<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0e1117">
<title>Percorso-matematica — allenamento</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icona.png">
<script src="nuclei-indice.js"></script>
<style>
  :root{
    --bg:#0e1117; --panel:#161b22; --panel2:#1c232d; --border:#2b333d;
    --txt:#eef3f8; --muted:#b9c4d1; --accent:#4c8dff; --accent2:#8fb0ff;
    --ok:#2ea043; --okbg:#10331b; --warn:#d8a13a; --warnbg:#332a10;
    --gram:#5eead4; --pro:#b98cff; --rosso:#c1443f;
    --m1:#8bd450; --m2:#5ac8fa; --m3:#b98cff; --m4:#e0a94a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;font-size:17px;line-height:1.5;}
  a{color:var(--accent2);text-decoration:none}
  .wrap{max-width:820px;margin:0 auto;padding:18px 16px 90px}

  header.top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
    border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:6px}
  header.top h1{font-size:1.32rem;margin:0}
  header.top .sub{color:var(--muted);font-size:.86rem}

  .tabs{display:flex;gap:6px;margin:16px 0 20px;flex-wrap:wrap}
  .tab{background:var(--panel2);border:1px solid var(--border);color:var(--muted);
    border-radius:20px;padding:7px 15px;font:inherit;font-size:.86rem;cursor:pointer;transition:.12s}
  .tab:hover{color:var(--txt)}
  .tab.on{background:#13233f;border-color:var(--accent);color:#fff}

  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:15px 17px;margin-bottom:12px}
  .card h3{margin:0 0 4px;font-size:1rem;color:var(--accent2)}
  .card .meta{color:var(--muted);font-size:.8rem}

  .oggi-vuoto{text-align:center;color:var(--muted);padding:26px 10px}
  .oggi-vuoto b{color:var(--gram);display:block;font-size:1.05rem;margin-bottom:6px}

  .val{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap;align-items:center}
  .b{border:1px solid var(--border);background:var(--panel2);color:var(--muted);border-radius:9px;
    padding:7px 13px;font:inherit;font-size:.85rem;cursor:pointer;transition:.12s}
  .b:hover{border-color:var(--accent);color:var(--txt)}
  .b.so:hover{border-color:var(--ok);color:#5fd980}
  .b.incerto:hover{border-color:var(--warn);color:#e0b85a}
  .b.rivedere:hover{border-color:var(--rosso);color:#ff8b86}
  .b.apri{background:#13233f;border-color:#2b4877;color:#cfe0ff;margin-left:auto}

  .barra{height:7px;background:#0b0f15;border-radius:20px;overflow:hidden;margin:7px 0 2px;border:1px solid var(--border)}
  .barra i{display:block;height:100%;border-radius:20px;transition:width .3s}
  .mov{margin:22px 0 8px;font-size:.74rem;text-transform:uppercase;letter-spacing:.9px;color:var(--muted)}
  .nuc{display:block;background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:11px 14px;margin-bottom:8px;color:var(--txt);transition:.12s}
  .nuc:hover{border-color:var(--accent)}
  .nuc .riga{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .nuc .t{font-size:.93rem}
  .nuc .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.8rem;white-space:nowrap}

  .stat{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .stat div{flex:1 1 130px;background:var(--panel);border:1px solid var(--border);
    border-radius:12px;padding:11px 13px}
  .stat .k{font-size:1.5rem;font-weight:600}
  .stat .v{font-size:.74rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}

  .riga-opt{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0}
  input[type=number]{background:var(--panel2);border:1px solid var(--border);color:var(--txt);
    border-radius:8px;padding:6px 9px;width:76px;font:inherit}
  .nota{color:var(--muted);font-size:.86rem;background:var(--panel2);border-left:3px solid var(--border);
    border-radius:6px;padding:10px 13px;margin:12px 0}
  .heat{display:flex;gap:3px;flex-wrap:wrap;margin-top:8px}
  .heat i{width:12px;height:12px;border-radius:3px;background:#141a22;border:1px solid #1e262f}
  footer{color:#6b7788;font-size:.76rem;text-align:center;margin-top:26px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Percorso-matematica</h1>
    <span class="sub" id="sottotitolo">18 nuclei · Analisi Vettoriale + Metodi</span>
  </header>

  <div class="tabs">
    <button class="tab on" data-v="oggi">Oggi</button>
    <button class="tab" data-v="percorso">Percorso</button>
    <button class="tab" data-v="dati">Dati</button>
    <a class="tab" href="mappa-percorso.html" style="margin-left:auto">mappa ↗</a>
  </div>

  <div id="vista"></div>
  <footer>i progressi restano su questo dispositivo · esportabili dalla scheda «Dati»</footer>
</div>

<script>
"use strict";
var KEY='pm-progresso-v1', GIORNO=86400000;
var IDX = window.PM_INDICE || {nuclei:[],movimenti:{}};
var COLM = {1:'var(--m1)',2:'var(--m2)',3:'var(--m3)',4:'var(--m4)',5:'#ff9b6b'};

function vuoto(){ return {v:1,nuclei:{},voci:{},opts:{perGiorno:10},storico:{}}; }
function leggi(){ try{ var d=JSON.parse(localStorage.getItem(KEY)||'null'); return d&&d.v?d:vuoto(); }catch(e){ return vuoto(); } }
function scrivi(d){ localStorage.setItem(KEY, JSON.stringify(d)); }
var D = leggi();
function oggiStr(){ return new Date().toISOString().slice(0,10); }

/* ---- SM-2 leggero: STESSA logica di nuclei/progresso.js.
   Vive in due posti perché i nuclei non caricano l'app e viceversa; se cambia una,
   va cambiata l'altra (sono ~15 righe: duplicarle costa meno che introdurre un
   modulo condiviso che va servito via http anche quando il file si apre da disco). */
var PASSI=[1,3,7,16,35,75];
function pianifica(v,esito){
  var ef=v.ef||2.5;
  if(esito==='so'){ ef=Math.min(2.9,ef+0.1); v.n=(v.n||0)+1; }
  else if(esito==='incerto'){ ef=Math.max(1.3,ef-0.15); v.n=Math.max(1,v.n||1); }
  else { ef=Math.max(1.3,ef-0.25); v.n=0; v.lapse=(v.lapse||0)+1; }
  v.ef=Math.round(ef*100)/100;
  var base=PASSI[Math.min(v.n,PASSI.length-1)];
  var gg = v.n===0 ? 1 : Math.max(1, Math.round(base*(v.ef/2.5)));
  v.int=gg; v.due=Date.now()+gg*GIORNO; v.ultimo=Date.now(); v.esito=esito;
  return v;
}
function valuta(id,esito){
  var v=D.voci[id]; if(!v) return;
  pianifica(v,esito);
  var g=oggiStr(); D.storico[g]=(D.storico[g]||0)+1;
  scrivi(D); render();
}

/* ---- calcoli ---- */
function scadute(){
  var ora=Date.now(), out=[];
  for(var id in D.voci){ var v=D.voci[id]; if((v.due||0)<=ora) out.push(Object.assign({id:id},v)); }
  out.sort(function(a,b){ return (a.due||0)-(b.due||0); });
  return out;
}
function avanzamentoNucleo(n){
  var st=D.nuclei[n.nn], viste=st?Object.keys(st.tappe||{}).length:0;
  var tot=n.tappe.length||1;
  var voci=0, sod=0;
  for(var id in D.voci){ if(D.voci[id].nucleo===n.nn){ voci++; if(D.voci[id].esito==='so') sod++; } }
  return {viste:viste, tot:tot, perc:Math.round(viste/tot*100), voci:voci, sod:sod};
}
function totali(){
  var viste=0, tot=0;
  IDX.nuclei.forEach(function(n){ var a=avanzamentoNucleo(n); viste+=a.viste; tot+=a.tot; });
  var voci=Object.keys(D.voci).length, sod=0, dovute=scadute().length;
  for(var id in D.voci) if(D.voci[id].esito==='so') sod++;
  return {viste:viste,tot:tot,voci:voci,sod:sod,dovute:dovute};
}
function nomeNucleo(nn){
  var n=IDX.nuclei.filter(function(x){return x.nn===nn;})[0];
  return n?n.titolo:('Nucleo '+nn);
}
function fileNucleo(nn){
  var n=IDX.nuclei.filter(function(x){return x.nn===nn;})[0];
  return n?n.file:null;
}
function titoloTappa(nn,num){
  var n=IDX.nuclei.filter(function(x){return x.nn===nn;})[0];
  if(!n) return '';
  var t=n.tappe.filter(function(x){return x.num===num;})[0];
  return t?t.titolo:'';
}
function el(h){ var d=document.createElement('div'); d.innerHTML=h; return d.firstElementChild; }

/* ---- viste ---- */
function vistaOggi(){
  var cap=(D.opts&&D.opts.perGiorno)||10;
  var coda=scadute(), q=coda.slice(0,cap), root=document.createElement('div');
  var fattiOggi=D.storico[oggiStr()]||0;

  var t=totali();
  root.appendChild(el('<div class="stat">'+
    '<div><div class="k">'+coda.length+'</div><div class="v">da rivedere</div></div>'+
    '<div><div class="k">'+fattiOggi+'</div><div class="v">fatte oggi</div></div>'+
    '<div><div class="k">'+t.viste+'/'+t.tot+'</div><div class="v">tappe aperte</div></div>'+
    '</div>'));

  if(!coda.length){
    root.appendChild(el('<div class="card oggi-vuoto"><b>'+
      (t.voci? 'Niente da rivedere oggi.' : 'Non hai ancora valutato nulla.')+'</b>'+
      (t.voci? 'Torna domani: la coda si riempie da sola con le scadenze.'
             : 'Apri un nucleo e usa i pulsanti «so farlo / incerto / da rivedere» sotto i collaudi e gli esercizi: da lì nasce l&rsquo;allenamento.')+
      '</div>'));
    if(!t.voci) root.appendChild(el('<div class="nota">Consiglio: parti dal nucleo che devi consolidare, non dal primo. Le voci valutate «da rivedere» tornano domani; quelle «so farlo» si allontanano progressivamente (1, 3, 7, 16, 35, 75 giorni).</div>'));
    return root;
  }

  if(coda.length>cap) root.appendChild(el('<div class="nota">La coda ne ha <b>'+coda.length+'</b>, te ne mostro <b>'+cap+'</b>: meglio poche e ogni giorno che una maratona ogni tanto. Il limite si cambia in «Dati».</div>'));

  q.forEach(function(v){
    var f=fileNucleo(v.nucleo);
    var link=f? f+'#'+(v.tappa||'00') : '#';
    var scad=Math.round((Date.now()-(v.due||Date.now()))/GIORNO);
    var c=el('<div class="card">'+
      '<h3>'+(v.titolo||'(voce)')+'</h3>'+
      '<div class="meta">nucleo '+v.nucleo+' · tappa '+(v.tappa||'—')+' · '+(v.tipo||'')+
      (scad>0?' · scaduta da '+scad+' g':'')+'</div>'+
      '<div class="val"></div></div>');
    var val=c.querySelector('.val');
    [['so','so farlo'],['incerto','incerto'],['rivedere','da rivedere']].forEach(function(b){
      var btn=document.createElement('button'); btn.className='b '+b[0]; btn.textContent=b[1];
      btn.onclick=function(){ valuta(v.id,b[0]); };
      val.appendChild(btn);
    });
    var a=document.createElement('a'); a.className='b apri'; a.href=link; a.textContent='apri ↗';
    val.appendChild(a);
    root.appendChild(c);
  });
  return root;
}

function vistaPercorso(){
  var root=document.createElement('div');
  var t=totali();
  root.appendChild(el('<div class="stat">'+
    '<div><div class="k">'+Math.round(t.viste/t.tot*100)+'%</div><div class="v">percorso aperto</div></div>'+
    '<div><div class="k">'+t.sod+'/'+t.voci+'</div><div class="v">voci «so farlo»</div></div>'+
    '<div><div class="k">'+Object.keys(D.storico).length+'</div><div class="v">giorni attivi</div></div>'+
    '</div>'));

  [1,2,3,4,5].forEach(function(m){
    var lista=IDX.nuclei.filter(function(n){ return n.mov===m; });
    if(!lista.length) return;
    root.appendChild(el('<div class="mov">Movimento '+m+' — '+(IDX.movimenti[m]||'')+'</div>'));
    lista.forEach(function(n){
      var a=avanzamentoNucleo(n);
      var card=el('<a class="nuc" href="'+n.file+'">'+
        '<div class="riga"><span class="t">'+n.titolo+'</span>'+
        '<span class="n">'+a.viste+'/'+a.tot+(a.voci?' · '+a.sod+'✓':'')+'</span></div>'+
        '<div class="barra"><i style="width:'+a.perc+'%;background:'+COLM[m]+'"></i></div></a>');
      root.appendChild(card);
    });
  });
  root.appendChild(el('<div class="nota">La barra misura le <b>tappe aperte</b>, il numero col ✓ le voci che hai marcato «so farlo». Sono due cose diverse di proposito: la prima dice dove sei arrivato, la seconda dove reggi davvero.</div>'));
  return root;
}

function vistaDati(){
  var root=document.createElement('div'), t=totali();

  var opt=el('<div class="card"><h3>Allenamento</h3>'+
    '<div class="riga-opt">carte al giorno: <input type="number" id="cap" min="1" max="60" value="'+((D.opts&&D.opts.perGiorno)||10)+'">'+
    '<button class="b" id="salvaCap">salva</button></div>'+
    '<div class="meta">Il ripasso spaziato funziona per costanza, non per volume. Dieci al giorno tutti i giorni battono settanta la domenica.</div></div>');
  root.appendChild(opt);
  opt.querySelector('#salvaCap').onclick=function(){
    var v=parseInt(opt.querySelector('#cap').value,10);
    if(v>0){ D.opts=D.opts||{}; D.opts.perGiorno=v; scrivi(D); render(); }
  };

  var exp=el('<div class="card"><h3>Backup e trasferimento</h3>'+
    '<div class="meta">I progressi vivono in questo browser. Per passarli al telefono (o metterli al sicuro) esporta un file e importalo dall&rsquo;altra parte.</div>'+
    '<div class="val"><button class="b" id="esporta">esporta JSON</button>'+
    '<button class="b" id="importa">importa JSON</button>'+
    '<input type="file" id="filejson" accept="application/json" style="display:none"></div></div>');
  root.appendChild(exp);
  exp.querySelector('#esporta').onclick=function(){
    var b=new Blob([JSON.stringify(D,null,1)],{type:'application/json'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(b);
    a.download='percorso-progressi-'+oggiStr()+'.json';
    a.click();
  };
  exp.querySelector('#importa').onclick=function(){ exp.querySelector('#filejson').click(); };
  exp.querySelector('#filejson').onchange=function(e){
    var f=e.target.files[0]; if(!f) return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var d=JSON.parse(r.result);
        if(!d||!d.v) throw new Error('file non riconosciuto');
        var mie=Object.keys(D.voci).length, sue=Object.keys(d.voci||{}).length;
        if(mie && !confirm('Qui ci sono '+mie+' voci, nel file '+sue+'. Sostituire tutto?')) return;
        D=d; scrivi(D); render();
      }catch(err){ alert('Import fallito: '+err.message); }
    };
    r.readAsText(f);
  };

  var st=el('<div class="card"><h3>Stato</h3>'+
    '<div class="meta">'+t.voci+' voci in allenamento · '+t.sod+' marcate «so farlo» · '+
    t.viste+' tappe aperte su '+t.tot+' · '+Object.keys(D.storico).length+' giorni attivi</div>'+
    '<div class="heat" id="heat"></div>'+
    '<div class="val"><button class="b rivedere" id="azzera">azzera tutto</button></div></div>');
  root.appendChild(st);
  var heat=st.querySelector('#heat');
  for(var i=41;i>=0;i--){
    var g=new Date(Date.now()-i*GIORNO).toISOString().slice(0,10), n=D.storico[g]||0;
    var q=document.createElement('i');
    if(n>0) q.style.background = n>=15?'#2ea043' : n>=6?'#25823a' : '#1c5e2b';
    q.title=g+': '+n;
    heat.appendChild(q);
  }
  st.querySelector('#azzera').onclick=function(){
    if(confirm('Cancella TUTTI i progressi su questo dispositivo. Sicuro?')){ D=vuoto(); scrivi(D); render(); }
  };

  root.appendChild(el('<div class="nota">Nessun account, nessun server: l&rsquo;archivio è una chiave <code>'+KEY+'</code> nel browser. Se svuoti i dati del sito, i progressi se ne vanno — per questo esiste l&rsquo;esportazione.</div>'));
  return root;
}

/* ---- render ---- */
// la vista sta nell'hash: cosi' e' richiamabile e il tasto indietro funziona
var VISTE=['oggi','percorso','dati'];
var vistaCorrente=(VISTE.indexOf((location.hash||'').replace('#',''))>=0)?location.hash.replace('#',''):'oggi';
function render(){
  D=leggi();
  var c=document.getElementById('vista'); c.innerHTML='';
  c.appendChild(vistaCorrente==='oggi'?vistaOggi():vistaCorrente==='percorso'?vistaPercorso():vistaDati());
  var t=totali();
  document.getElementById('sottotitolo').textContent =
    IDX.nuclei.length+' nuclei · '+t.dovute+' da rivedere oggi';
  Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(b){
    b.classList.toggle('on', b.dataset.v===vistaCorrente);
  });
}
Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(b){
  b.onclick=function(){ vistaCorrente=b.dataset.v; try{history.replaceState(null,'','#'+vistaCorrente);}catch(e){} render(); };
});
window.addEventListener('focus', render);   // tornando dai nuclei, i numeri sono freschi
render();

/* ---- installabilità: solo su http(s), da file:// il service worker non è ammesso ---- */
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
</body>
</html>
