<header><h1>Carta delle rotte</h1>
<div class="sub">Ogni concetto di matematica che impari apre un arco verso la fisica che verrà —
elettromagnetismo, meccanica, statistica, quantistica — e una domanda aperta punta alla tesi.
La mappa cresce nucleo dopo nucleo. <i>Passa sopra un arco per leggere la corrispondenza.</i></div></header>

<script>
var NUCLEI=[{"num": "00", "topic": "Topologia", "oggetto": "la struttura topologica di $\\mathbb{R}^n$: la <b>norma</b> $\\lVert\\cdot\\rVert$ e la distanza, le <b>palle</b> $B_r(x_0)$ come nozione di &laquo;vicino&raquo;, gli <b>aperti/chiusi</b>, la <b>compattezza</b> (chiuso e limitato) e la <b>connessione</b>. In matematica sono definizioni sul caso concreto $\\mathbb{R}^n$; in fisica sono l&rsquo;impalcatura di ogni spazio in cui vive un sistema &mdash; delle configurazioni, delle fasi, degli stati.", "rotte": [{"dest": "Analisi<br>funzionale<br>(Mov. II)", "txt": "La corrispondenza &egrave; una <b>promozione ad assioma</b>. Gli assiomi della norma (tappa 01) diventano la definizione di <b>spazio normato</b>; la distanza $d(x,y)=\\lVert x-y\\rVert$ diventa lo <b>spazio metrico</b>; la palla $B_r$ resta la definizione di &laquo;vicino&raquo; e di aperto; la convergenza per successioni resta identica. $\\mathbb{R}^n$ &egrave; il <b>prototipo</b>, ma la teoria astratta comprende gli <b>spazi di funzioni</b> $C[a,b]$, $L^2$, $\\ell^2$, dove i &laquo;punti&raquo; sono funzioni. Lo spazio di <b>Banach</b> aggiunge la <b>completezza</b> (ogni successione di Cauchy converge &mdash; il buco $\\sqrt2\\notin\\mathbb{Q}$ non esiste): &egrave; ci&ograve; che rende leciti limiti, serie, punti fissi. E l&rsquo;avvertimento chiave: in dimensione infinita &laquo;chiuso e limitato&raquo; <b>non</b> basta pi&ugrave; per compatto &mdash; la palla unitaria di $L^2$ &egrave; chiusa, limitata e <b>non</b> compatta. Il tuo Heine&ndash;Borel &egrave; un lusso della dimensione finita."}, {"dest": "Meccanica quantistica", "txt": "Qui la parola-ponte &egrave; <b>compattezza $\\Rightarrow$ discretezza</b>. In MQ gli stati vivono in uno spazio di Hilbert (un Banach con prodotto scalare, la versione infinito-dimensionale di $\\mathbb{R}^n$) e le osservabili sono operatori. Quando l&rsquo;operatore hamiltoniano ha <b>risolvente compatto</b> &mdash; tipicamente perch&eacute; il sistema &egrave; <b>confinato</b> (potenziale che intrappola, dominio spaziale limitato) &mdash; il suo <b>spettro &egrave; discreto</b>: i livelli energetici sono <b>quantizzati</b>, $E_0\\lt E_1\\lt E_2\\lt\\dots$, separati. La compattezza &egrave; la ragione matematica per cui l&rsquo;energia di un elettrone legato assume valori discreti e non un continuo. E l&rsquo;esistenza dello <b>stato fondamentale</b> &mdash; il minimo dell&rsquo;energia $\\inf\\langle\\psi|H|\\psi\\rangle$ &mdash; &egrave; un teorema di Weierstrass astratto: senza compattezza (sistema non legato) il minimo pu&ograve; non essere assunto, ed &egrave; il caso degli stati di <b>scattering</b>, con spettro continuo."}, {"dest": "Meccanica statistica", "txt": "Il moto di un sistema hamiltoniano vive nello <b>spazio delle fasi</b> $(\\mathbf q,\\mathbf p)$, un $\\mathbb{R}^{2N}$ (o una sua sottovariet&agrave;). La superficie a <b>energia costante</b> $\\{H(\\mathbf q,\\mathbf p)=E\\}$ &egrave;, per un sistema <b>legato</b>, un insieme <b>compatto</b>: chiuso (controimmagine del chiuso $\\{E\\}$ tramite $H$ continua) e limitato (l&rsquo;energia finita impedisce la fuga all&rsquo;infinito). La compattezza &egrave; ci&ograve; che rende <b>finita</b> la misura microcanonica su quella superficie &mdash; senza la quale non potresti nemmeno <b>normalizzare</b> le probabilit&agrave;, e l&rsquo;insieme statistico non esisterebbe. La <b>connessione</b> topologico-dinamica di quella superficie, e le nozioni pi&ugrave; forti di <b>ergodicit&agrave;</b> e <b>mescolamento</b>, decidono se le medie temporali coincidono con quelle d&rsquo;insieme."}], "domanda": "La superficie a energia costante di un sistema legato &egrave; compatta, e la dinamica hamiltoniana vi conserva il volume (Liouville). Ma la compattezza da sola non dice come una traiettoria <b>riempie</b> quella superficie: potrebbe girare su un toro (moto integrabile, ordinato) oppure <b>mescolare</b> ergodicamente ogni regione con ogni altra. La domanda che la fisica ti far&agrave;: <b>quali propriet&agrave; topologiche e dinamiche dello spazio delle fasi rendono un sistema &laquo;ergodico&raquo; o &laquo;mescolante&raquo;</b>, cio&egrave; fanno s&igrave; che le medie temporali di un&rsquo;osservabile coincidano con le medie sull&rsquo;insieme &mdash; il fondamento non dimostrato della meccanica statistica? <br>&mdash; &Egrave; la porta della tua tesi. In versione <b>quantistica</b> la domanda diventa: come fa un sistema isolato, la cui evoluzione &egrave; unitaria e reversibile su uno spazio di Hilbert, a &laquo;termalizzare&raquo;, cio&egrave; a portare le osservabili al valore d&rsquo;equilibrio? La risposta candidata &egrave; l&rsquo;<b>ETH</b> (eigenstate thermalization hypothesis): l&rsquo;informazione termica &egrave; gi&agrave; scritta nei singoli autostati dell&rsquo;energia. La struttura di &laquo;vicinanza&raquo; e di &laquo;compattezza&raquo; che qui hai imparato in $\\mathbb{R}^n$ &egrave; il primo mattone del linguaggio in cui quella domanda si formula &mdash; spazio degli stati, spettro, misura invariante, mescolamento."}, {"num": "01", "topic": "Differenziabilita", "oggetto": "l&rsquo;approssimazione lineare $f(x_0+h)=f(x_0)+\\nabla f(x_0)\\cdot h+o(|h|)$: il differenziale $df_{x_0}$ (una <b>applicazione lineare</b>), il <b>gradiente</b> $\\nabla f$, la derivata come mappa lineare. Non cambierà l&rsquo;oggetto: cambierà solo il nome che gli danno — e le domande che gli faranno.", "rotte": [{"dest": "Elettromagnetismo", "txt": "Il campo elettrostatico <b>è</b> un gradiente: $\\mathbf{E}=-\\nabla\\phi$. Il tuo teorema &laquo;$\\nabla f\\perp$ insieme di livello&raquo; diventa parola per parola &laquo;$\\mathbf{E}\\perp$ superfici equipotenziali&raquo;. E il differenziale-1-forma $df$ è il seme del <b>potenziale di gauge</b> $A=A_\\mu\\,dx^\\mu$: la macchina $d(\\cdot)$ che qui manda una funzione nella sua 1-forma, lì manda $A$ nel campo $F=dA$ — la stessissima che nel Movimento I diventa il teorema di Stokes."}, {"dest": "Meccanica statistica", "txt": "Le variabili di stato <b>sono</b> derivate parziali di un potenziale: da $F(T,V)$ (energia libera) leggi $S=-\\partial_T F$, $\\;p=-\\partial_V F$. &laquo;$f$ differenziabile $=$ esiste il piano tangente&raquo; qui significa &laquo;esistono variabili intensive ben definite&raquo;; e l&rsquo;uguaglianza delle miste $\\partial_T\\partial_V F=\\partial_V\\partial_T F$ (Schwarz, prossimo nucleo) <b>è</b> una relazione di Maxwell."}, {"dest": "Meccanica quantistica", "txt": "La derivata smette di essere un&rsquo;operazione e diventa un <b>oggetto</b>: l&rsquo;operatore impulso $\\hat{p}=-i\\hbar\\nabla$ su $L^2$. &laquo;La derivata è un&rsquo;applicazione lineare&raquo; è il primo gradino di &laquo;gli osservabili sono operatori lineari autoaggiunti&raquo;. Il gradiente, qui una modesta mappa $\\mathbb{R}^n\\!\\to\\!\\mathbb{R}$, acquisterà uno <b>spettro</b> e autofunzioni (le onde piane): Movimenti II e IV."}], "domanda": "Lo stesso oggetto è un <i>campo</i> in EM, una <i>derivata di stato</i> in termodinamica, un <i>osservabile</i> in QM. Ma questo nucleo parla soprattutto di <b>quando la differenziabilità fallisce</b> (parziali sì, piano tangente no). Allora: la fisica ha un nome per il punto in cui l&rsquo;energia libera <b>smette</b> di essere differenziabile? <br>&mdash; Risposta da tenere in tasca fino a meccanica statistica: sì, si chiama <b>transizione di fase</b>. La non-analiticità di $F$ <i>è</i> la criticità. Il &laquo;buco&raquo; dei tuoi controesempi, promosso a fenomeno fisico — e vive accanto alla tua tesi (ETH, sistemi complessi)."}, {"num": "02", "topic": "Dini ottimizzazione", "oggetto": "l&rsquo;ottimizzazione vincolata $\\nabla f=\\lambda\\nabla g$ e la sua lettura $\\lambda=\\partial f^*/\\partial c$ (il moltiplicatore come sensibilità dell&rsquo;ottimo al vincolo). Non cambierà l&rsquo;oggetto: cambierà solo cosa <b>è</b> quel $\\lambda$ &mdash; e in fisica $\\lambda$ ha un nome, un&rsquo;unità di misura e uno strumento che lo legge.", "rotte": [{"dest": "Meccanica statistica", "txt": "Il cuore. Massimizza l&rsquo;entropia $S=-k\\sum_i p_i\\ln p_i$ sotto <b>due vincoli</b>: normalizzazione $\\sum_i p_i=1$ e energia media fissata $\\sum_i p_i E_i=U$. La Lagrangiana $S-\\alpha(\\sum p_i-1)-\\beta(\\sum p_i E_i-U)$, stazionaria in $p_i$, dà $-k(\\ln p_i+1)-\\alpha-\\beta E_i=0$, cioè la <b>distribuzione di Boltzmann</b> $p_i\\propto e^{-\\beta E_i/k}$. E i moltiplicatori <b>sono</b> le grandezze termodinamiche: $\\beta=1/kT$ è il moltiplicatore dell&rsquo;energia, $\\mu$ (potenziale chimico) è quello del numero di particelle. La temperatura <b>è</b> un moltiplicatore di Lagrange. Questo è oro per la tua rotta (stat mech, tesi ETH)."}, {"dest": "Meccanica quantistica", "txt": "Il principio variazionale. Lo stato fondamentale minimizza l&rsquo;energia $\\langle\\psi|H|\\psi\\rangle$ sotto il vincolo di normalizzazione $\\langle\\psi|\\psi\\rangle=1$. La Lagrangiana $\\langle\\psi|H|\\psi\\rangle-E\\big(\\langle\\psi|\\psi\\rangle-1\\big)$, stazionaria rispetto a $\\langle\\psi|$, dà $H|\\psi\\rangle-E|\\psi\\rangle=0$: l&rsquo;equazione di Schrödinger stazionaria $H|\\psi\\rangle=E|\\psi\\rangle$. Il moltiplicatore $\\lambda$ <b>è</b> l&rsquo;energia $E$, l&rsquo;autovalore. La regola $\\nabla f=\\lambda\\nabla g$ diventa, parola per parola, $H\\psi=E\\psi$: l&rsquo;autovalore è un moltiplicatore di Lagrange."}, {"dest": "Elettromagnetismo", "txt": "Qui la rotta forte è Dini, non Lagrange. Una superficie equipotenziale $\\phi(x,y,z)=\\text{cost}$ è localmente il grafico $z=g(x,y)$ dove $\\partial_z\\phi\\neq0$, cioè dove $E_z=-\\partial_z\\phi\\neq0$: il teorema della funzione implicita dice <b>dove</b> puoi risolvere per una coordinata. E ogni cambio di coordinate del campo (cartesiane$\\to$sferiche) è lecito dove il jacobiano non si annulla &mdash; funzione inversa. Due rotte vere (stat mech, QM) valgono più di tre forzate: qui Dini serve i cambi di coordinate, non i moltiplicatori."}], "domanda": "In statistica, $\\beta=1/kT$ compare come moltiplicatore del vincolo &laquo;energia media $=U$&raquo;: è la variabile <b>coniugata</b> all&rsquo;energia, e fissarla equivale a mettere il sistema a contatto con un bagno termico. Ma in un sistema <b>isolato</b> l&rsquo;energia è fissata esattamente, non in media: non c&rsquo;è nessun bagno, nessun vincolo &laquo;in media&raquo;. Allora: cosa fissa la temperatura di un singolo stato quantistico isolato? <br>&mdash; È la domanda dell&rsquo;<b>ETH</b> (eigenstate thermalization hypothesis): l&rsquo;ipotesi che un singolo autostato di energia di un sistema complesso <i>contenga già</i> un $\\beta$ termico, come se fosse il bagno di sé stesso. Il moltiplicatore di Lagrange che qui è un artificio di calcolo, lì diventa il problema aperto attorno a cui ruota la tua tesi."}, {"num": "03", "topic": "Curve superfici", "oggetto": "i due integrali costruiti in questo nucleo: la <b>circuitazione</b> $\\oint_\\gamma\\mathbf F\\cdot d\\mathbf r$ (integrale di linea vettoriale lungo un cammino chiuso) e il <b>flusso</b> $\\iint_S\\mathbf F\\cdot\\mathbf n\\,dS$ (integrale di superficie della componente normale). In matematica sono definizioni; in fisica hanno un nome, un&rsquo;unità di misura e uno strumento che li legge.", "rotte": [{"dest": "Elettromagnetismo", "txt": "La corrispondenza è letterale, simbolo per simbolo. La circuitazione del campo elettrico è la <b>forza elettromotrice</b>: $\\text{f.e.m.}=\\oint_\\gamma\\mathbf E\\cdot d\\mathbf r$. Il flusso del campo magnetico è il <b>flusso magnetico</b>: $\\Phi_B=\\iint_S\\mathbf B\\cdot\\mathbf n\\,dS$. La legge di <b>Faraday</b> le incolla nella stessa equazione: $\\oint_\\gamma\\mathbf E\\cdot d\\mathbf r=-\\dfrac{d}{dt}\\iint_S\\mathbf B\\cdot\\mathbf n\\,dS$ &mdash; circuitazione a sinistra, flusso a destra, dove $\\gamma=\\partial S$ è il bordo di $S$. E la legge di <b>Gauss</b> è puro flusso: $\\iint_{\\partial V}\\mathbf E\\cdot\\mathbf n\\,dS=Q/\\varepsilon_0$. Le equazioni di Maxwell in forma integrale <b>sono</b> equazioni fra i due oggetti di questo nucleo. Il prossimo nucleo (Green-Gauss-Stokes) è ciò che le trasforma nella forma differenziale."}, {"dest": "Meccanica statistica", "txt": "Il cuore della tua rotta. Nello spazio delle fasi $(\\mathbf q,\\mathbf p)\\in\\mathbb{R}^{2N}$, la <b>superficie a energia costante</b> $\\Sigma_E=\\{H(\\mathbf q,\\mathbf p)=E\\}$ è una superficie di livello dell&rsquo;hamiltoniana: è l&rsquo;ipersuperficie $(2N-1)$-dimensionale su cui vive l&rsquo;<b>ensemble microcanonico</b> (energia fissata). Il numero di stati accessibili è un <b>integrale di superficie</b> su $\\Sigma_E$: $$\\Omega(E)=\\iint_{\\Sigma_E}\\frac{d\\sigma}{|\\nabla H|},$$ dove $d\\sigma$ è l&rsquo;elemento d&rsquo;area (costruito esattamente come $|\\Phi_u\\times\\Phi_v|\\,du\\,dv$) e $|\\nabla H|$ pesa la &laquo;spaziatura&raquo; fra superfici a energia vicina &mdash; lo stesso $\\nabla H$ che è normale a $\\Sigma_E$, per l&rsquo;ortogonalità gradiente$\\perp$livello. Da qui l&rsquo;entropia di Boltzmann $S=k\\log\\Omega(E)$. La termodinamica di un sistema isolato è geometria su una superficie a energia fissata."}, {"dest": "Meccanica quantistica", "txt": "Qui una corrispondenza <b>simbolo per simbolo</b> come le altre due è più debole: lo dico esplicitamente, meglio due rotte solide che tre forzate. Restano però due agganci onesti. Il <b>flusso di probabilità</b>: la corrente $\\mathbf j=\\tfrac{\\hbar}{m}\\,\\mathrm{Im}(\\psi^{*}\\nabla\\psi)$ ha un flusso $\\iint_S\\mathbf j\\cdot\\mathbf n\\,dS$ che misura la probabilità che attraversa $S$ nell&rsquo;unità di tempo (equazione di continuità $\\partial_t|\\psi|^2+\\nabla\\cdot\\mathbf j=0$): stesso oggetto-flusso di questo nucleo. E la <b>fase di Berry</b> $\\gamma=\\oint_C\\mathbf A\\cdot d\\mathbf R$, integrale di linea di un &laquo;potenziale&raquo; lungo un cammino chiuso nello spazio dei parametri: una circuitazione che diventa fase fisica osservabile. Due usi veri, senza forzare l&rsquo;analogia."}], "domanda": "La superficie $\\Sigma_E=\\{H=E\\}$ porta l&rsquo;ensemble microcanonico: la statistica di equilibrio di un sistema <b>isolato</b>, con energia fissata esattamente. Ma un sistema isolato evolve da uno <b>stato singolo</b> (un punto, o un singolo autostato $|E_n\\rangle$), non da una distribuzione uniforme sull&rsquo;intera superficie. Allora: come fa un singolo punto (o un singolo autostato) a &laquo;riempire&raquo; statisticamente la superficie a energia costante e a comportarsi come l&rsquo;ensemble microcanonico? <br>&mdash; È esattamente la domanda dell&rsquo;<b>ETH</b> (eigenstate thermalization hypothesis): l&rsquo;ipotesi che i valori di aspettazione in un singolo autostato di energia coincidano già con la media microcanonica sulla superficie $\\Sigma_E$, come se ogni autostato contenesse in sé l&rsquo;intera superficie. Il flusso e l&rsquo;integrale di superficie che qui sono calcolo, lì diventano il linguaggio del problema aperto attorno a cui ruota la tua tesi."}, {"num": "04", "topic": "Campi vettoriali", "oggetto": "i quattro oggetti di questo nucleo: il <b>campo vettoriale</b> $\\mathbf F$, i tre operatori <b>gradiente</b> $\\nabla f$, <b>divergenza</b> $\\nabla\\cdot\\mathbf F$, <b>rotore</b> $\\nabla\\times\\mathbf F$, e il <b>campo conservativo</b> $\\mathbf F=\\nabla\\varphi$ col suo potenziale. In matematica sono definizioni; in fisica sono l&rsquo;alfabeto con cui si scrivono le leggi dei campi.", "rotte": [{"dest": "Elettromagnetismo", "txt": "La corrispondenza &egrave; totale: le <b>equazioni di Maxwell in forma differenziale</b> sono, letteralmente, i quattro operatori di questo nucleo applicati a $\\mathbf E$ e $\\mathbf B$. Legge di Gauss: $\\nabla\\cdot\\mathbf E=\\rho/\\varepsilon_0$ (la <b>divergenza</b> del campo elettrico &egrave; la densit&agrave; di carica: le cariche sono le sorgenti). Assenza di monopoli: $\\nabla\\cdot\\mathbf B=0$ (il campo magnetico &egrave; solenoidale, quindi $\\mathbf B=\\nabla\\times\\mathbf A$ per l&rsquo;identit&agrave; div rot $=0$). Faraday: $\\nabla\\times\\mathbf E=-\\partial_t\\mathbf B$ (il <b>rotore</b> del campo elettrico &egrave; la variazione del magnetico). Amp&egrave;re&ndash;Maxwell: $\\nabla\\times\\mathbf B=\\mu_0\\mathbf J+\\mu_0\\varepsilon_0\\,\\partial_t\\mathbf E$. E in <b>elettrostatica</b> $\\nabla\\times\\mathbf E=\\mathbf 0$: il campo &egrave; <b>conservativo</b>, $\\mathbf E=-\\nabla V$, con $V$ il potenziale elettrico &mdash; il tuo $\\varphi$ col segno della fisica. Questo nucleo &egrave; la grammatica; Maxwell &egrave; il testo."}, {"dest": "Meccanica classica", "txt": "La rotta pi&ugrave; diretta verso il tuo esame di settembre. Una <b>forza conservativa</b> &egrave; esattamente un campo conservativo: $\\mathbf F=-\\nabla U$, con $U$ l&rsquo;<b>energia potenziale</b> (gravitazionale $U=mgz$, elastica $U=\\tfrac12kx^2$, ...). Il teorema fondamentale degli integrali di linea diventa il <b>teorema dell&rsquo;energia</b>: il lavoro $\\int_\\gamma\\mathbf F\\cdot d\\mathbf r=U(A)-U(B)$ dipende solo dagli estremi, e uguagliandolo alla variazione di energia cinetica si ottiene $E=T+U=\\text{cost}$, la <b>conservazione dell&rsquo;energia meccanica</b>. Il nome &laquo;conservativo&raquo; viene da qui: sono i campi per cui l&rsquo;energia si conserva. Una forza con $\\nabla\\times\\mathbf F\\neq\\mathbf 0$ (l&rsquo;attrito, in modo effettivo) dissipa: non ha potenziale, il lavoro dipende dal cammino."}, {"dest": "Meccanica quantistica", "txt": "Qui protagonista &egrave; $\\nabla$ <b>come operatore</b>. In MQ le grandezze fisiche diventano operatori che agiscono sulla funzione d&rsquo;onda, e $\\nabla$ &egrave; il mattone: l&rsquo;<b>impulso</b> &egrave; $\\hat{\\mathbf p}=-i\\hbar\\nabla$ (il gradiente, promosso a osservabile), e l&rsquo;energia cinetica &egrave; $\\dfrac{\\hat p^2}{2m}=-\\dfrac{\\hbar^2}{2m}\\nabla^2$, col <b>laplaciano</b> $\\nabla^2=\\nabla\\cdot\\nabla$ &mdash; divergenza del gradiente. L&rsquo;equazione di Schr&ouml;dinger $i\\hbar\\,\\partial_t\\psi=-\\dfrac{\\hbar^2}{2m}\\nabla^2\\psi+V\\psi$ &egrave; costruita con gli operatori di questo nucleo. E la <b>corrente di probabilit&agrave;</b> $\\mathbf j$ obbedisce a $\\partial_t|\\psi|^2+\\nabla\\cdot\\mathbf j=0$: la stessa equazione di continuit&agrave; &laquo;variazione $=$ meno divergenza del flusso&raquo; che regge i fluidi e le cariche. Il vocabolario non cambia; cambia ci&ograve; su cui agisce."}], "domanda": "In meccanica statistica il moto di un sistema hamiltoniano nello spazio delle fasi &egrave; il flusso del campo di velocit&agrave; $\\mathbf v=(\\dot{\\mathbf q},\\dot{\\mathbf p})=(\\partial H/\\partial\\mathbf p,\\,-\\partial H/\\partial\\mathbf q)$. Calcolane la divergenza: $\\nabla\\cdot\\mathbf v=\\partial_{\\mathbf q}(\\partial H/\\partial\\mathbf p)+\\partial_{\\mathbf p}(-\\partial H/\\partial\\mathbf q)=0$ per Schwarz &mdash; il <b>teorema di Liouville</b>: il flusso &egrave; a divergenza nulla, <b>incomprimibile</b>, conserva il volume nello spazio delle fasi. Ma allora ecco il paradosso: un flusso che conserva il volume non pu&ograve; &laquo;concentrare&raquo; n&eacute; &laquo;disperdere&raquo; nulla, ed &egrave; reversibile nel tempo. <b>Come fa, allora, un sistema isolato a tendere all&rsquo;equilibrio</b>, a &laquo;spalmarsi&raquo; uniformemente sulla superficie a energia costante, se il volume di fase &egrave; conservato esattamente e la dinamica &egrave; reversibile? <br>&mdash; &Egrave; il cuore del problema dell&rsquo;irreversibilit&agrave; (Loschmidt), che si scioglie con <b>mescolamento</b>, coarse-graining e, in versione quantistica, con l&rsquo;<b>ETH</b> e la decoerenza. La stessa identit&agrave; $\\nabla\\cdot(\\nabla\\times)=0$ che qui ti d&agrave; &laquo;div rot $=0$&raquo; l&igrave; ti d&agrave; l&rsquo;incomprimibilit&agrave; di Liouville &mdash; e con essa la domanda attorno a cui ruota la tua tesi."}, {"num": "05", "topic": "Teoremi integrali", "oggetto": "Lo <b>Stokes generalizzato</b> $\\int_\\Omega d\\omega=\\int_{\\partial\\Omega}\\omega$: l&rsquo;integrale di una derivata sul pieno è determinato dai valori sul bordo. Con $d^2=0$ e la distinzione chiuse/esatte.", "rotte": [{"dest": "Elettromagnetismo", "txt": "Le leggi di Gauss $\\oint\\mathbf E\\cdot d\\mathbf S=Q/\\varepsilon_0$ e di Ampère $\\oint\\mathbf B\\cdot d\\mathbf r=\\mu_0 I$ <b>sono</b> Gauss e Stokes; Maxwell in forma integrale ⟷ differenziale è questo nucleo. In forma covariante, $F=dA$ e $dF=0$ (due delle quattro equazioni) è $d^2=0$."}, {"dest": "Meccanica quantistica", "txt": "$d\\omega$ e chiuse-vs-esatte sono il seme della <b>coomologia di de Rham</b>. La <b>fase di Berry</b> e l&rsquo;effetto <b>Aharonov–Bohm</b> sono integrali di una 1-forma di connessione su cammini che racchiudono un flusso: la stessa macchina del campo-vortice, con la fase al posto del lavoro."}, {"dest": "Meccanica statistica", "txt": "Le leggi di conservazione locali (continuità $\\partial_t\\rho+\\nabla\\!\\cdot\\!\\mathbf j=0$) diventano bilanci globali su un volume via Gauss: è cosÀ che &laquo;niente si crea né si distrugge&raquo; passa da equazione differenziale a contabilità misurabile."}], "domanda": "Un integrale conservato su un bordo dipende solo dalla topologia del dominio, non dai dettagli del campo (è un <b>invariante</b>). La domanda che porti alla tesi: nei sistemi complessi e caotici, quali &laquo;cariche topologiche&raquo; restano invarianti sotto la dinamica, mentre tutto il resto si mescola? È il punto dove l&rsquo;ergodicità (tutto si rimescola) incontra le quantità che <i>non</i> si rimescolano — e uno dei fili che portano a ETH e alla natura dell&rsquo;irreversibilità."}, {"num": "06", "topic": "Edo qualitative", "oggetto": "Un&rsquo;equazione $\\dot{\\mathbf x}=\\mathbf F(\\mathbf x)$ come <b>campo di velocità nello spazio degli stati</b>: equilibri, stabilità, e il volume delle fasi conservato (divergenza nulla del flusso hamiltoniano).", "rotte": [{"dest": "Meccanica classica", "txt": "Le equazioni di Hamilton <b>sono</b> un ritratto di fase su $(q,p)$; punti fissi = equilibri, centri = moti legati, selle = equilibri instabili. Il pendolo di questo nucleo è il caso di scuola."}, {"dest": "Meccanica statistica", "txt": "Liouville ($\\nabla\\!\\cdot\\!v=0$, il tuo nucleo 4) conserva il volume delle fasi: è la base della misura microcanonica e dell&rsquo;<b>ergodicità</b>. La statistica nasce dal rinunciare a seguire la singola traiettoria e misurare volumi."}, {"dest": "Meccanica quantistica", "txt": "L&rsquo;evoluzione $\\dot{|\\psi\\rangle}=-\\tfrac{i}{\\hbar}H|\\psi\\rangle$ è un sistema lineare i cui &laquo;autovalori&raquo; sono le energie: diagonalizzare $H$ È trovare il ritratto di fase quantistico. Il &laquo;centro&raquo; conservativo diventa l&rsquo;evoluzione unitaria che conserva la norma."}], "domanda": "Quando un sistema deterministico &laquo;dimentica&raquo; le sue condizioni iniziali? Le equazioni sono reversibili e conservano il volume (Liouville), eppure il caffè si raffredda e non si riscalda mai da solo. La domanda che porti alla tesi: come nasce l&rsquo;<b>irreversibilità</b> termodinamica da una dinamica microscopicamente reversibile? La sensibilità alle condizioni iniziali (esponenti di Lyapunov) produce <b>mescolamento</b>, e il mescolamento è il ponte fra il ritratto di fase reversibile e la freccia del tempo — il filo che, via il paradosso di Loschmidt, arriva a ETH e alla decoerenza."}, {"num": "07", "topic": "Serie funzioni", "oggetto": "La <b>convergenza uniforme</b> $\\sup_x|f_n-f|\\to0$: la licenza a scambiare $\\sum$ con $\\int$ e $\\frac{d}{dx}$; e il <b>raggio</b> di una serie di potenze, distanza dalla singolarità (complessa) più vicina.", "rotte": [{"dest": "Meccanica quantistica", "txt": "La convergenza uniforme <b>autorizza</b> gli sviluppi in serie di autostati e la teoria delle perturbazioni: $|\\psi\\rangle=\\sum_n c_n|n\\rangle$, correzioni $E=E_0+\\lambda E_1+\\dots$. Scambiare somma e operatori è lecito solo sotto controllo uniforme."}, {"dest": "Meccanica statistica", "txt": "Gli sviluppi del <b>viriale</b> e di <b>cluster</b> (gas non ideali) sono serie di potenze nella densità: il loro raggio di convergenza segnala la <b>transizione di fase</b> — dove la serie smette di convergere, la fisica cambia stato."}], "domanda": "Quando una serie perturbativa <b>converge</b> davvero, e quando è solo <b>asintotica</b> (utile ma divergente, raggio zero)? La domanda che porti alla tesi: il raggio di convergenza — cioè la <b>non-analiticità</b> — è il marcatore matematico delle transizioni di fase (la funzione di partizione perde analiticità dove il sistema cambia stato). Studiare <i>dove</i> e <i>come</i> una serie cessa di convergere è studiare la criticità: il filo che, dai raggi di convergenza di oggi, arriva agli zeri di Lee–Yang e alla fisica dei sistemi complessi."}, {"num": "08", "topic": "Spazi normati", "oggetto": "Uno <b>spazio di Banach</b>: funzioni (o stati) come punti, una <b>norma</b> che li misura, e la <b>completezza</b> che garantisce che ogni successione di Cauchy converga a un punto dello spazio.", "rotte": [{"dest": "Meccanica quantistica", "txt": "Gli stati vivono in uno spazio <b>completo</b> (di Hilbert, nucleo 09): la completezza rende i limiti di stati ancora stati, e legittima sviluppi in serie e passaggi al limite. Senza, la sovrapposizione infinita $\\sum c_n|n\\rangle$ potrebbe non essere uno stato."}, {"dest": "Meccanica statistica", "txt": "Il teorema delle contrazioni è dietro le equazioni <b>autoconsistenti</b> (campo medio, Hartree): la magnetizzazione $m$ risolve $m=T(m)$, e il punto fisso — quando $T$ è una contrazione — è lo stato d&rsquo;equilibrio. Quando cessa di esserlo (la derivata di $T$ attraversa $1$), c&rsquo;è una <b>transizione di fase</b>."}], "domanda": "In dimensione infinita l&rsquo;intuizione finita cade: le palle chiuse non sono più compatte, le norme non sono equivalenti, la convergenza dipende dalla topologia scelta. La domanda che porti alla tesi: è proprio in questo &laquo;spazio troppo grande&raquo; che vivono i fenomeni <b>collettivi</b> dei sistemi con infiniti gradi di libertà — rotture di simmetria, transizioni, stati macroscopicamente distinti. Capire quale <b>topologia</b> e quale <b>spazio</b> descrivono un sistema a molti corpi è già metà della fisica: il filo che porta agli spazi di Fock, al limite termodinamico, e alla domanda su come emergano proprietà macroscopiche robuste (ETH) da una dinamica su uno spazio di stati infinito-dimensionale."}, {"num": "09", "topic": "Hilbert fourier", "oggetto": "<b>Lo sviluppo su base ortonormale</b> in uno spazio di Hilbert, con $c_n=\\langle f,e_n\\rangle$ e $\\sum|c_n|^2=\\lVert f\\rVert^2$.", "rotte": [{"dest": "Meccanica quantistica", "txt": "È letteralmente il formalismo. Gli stati sono vettori di $L^2$ (o di uno spazio di Hilbert astratto), $|\\psi\\rangle=\\sum_n c_n|n\\rangle$ <b>è</b> lo sviluppo su base ortonormale, e $c_n=\\langle n|\\psi\\rangle$ è la proiezione di questa tappa. Parseval $\\sum|c_n|^2=1$ è la <b>conservazione della probabilità</b>, e $|c_n|^2$ è la probabilità di misurare l&rsquo;autovalore $n$-esimo. La notazione di Dirac è la notazione del prodotto scalare."}, {"dest": "EDP e<br>corda vibrante", "txt": "La <b>separazione delle variabili</b> per $u_{tt}=c^2u_{xx}$ produce esattamente le armoniche: ogni modo evolve indipendentemente, e la soluzione generale è la sovrapposizione con i coefficienti fissati dal dato iniziale — cioè i suoi coefficienti di Fourier. Fourier ha inventato tutto questo (1807) per l&rsquo;<b>equazione del calore</b>, non per la matematica pura."}, {"dest": "Meccanica statistica", "txt": "In un sistema invariante per traslazione (cristallo), i modi di Fourier <b>diagonalizzano</b> l&rsquo;hamiltoniana: le oscillazioni accoppiate degli atomi diventano oscillatori indipendenti, i <b>fononi</b>. Equipartizione e calori specifici (Debye) si calcolano modo per modo perché la base giusta ha spezzato il problema in pezzi non interagenti."}, {"dest": "Segnali e<br>misura", "txt": "Lo <b>spettro di potenza</b> è $|c_n|^2$; la funzione di correlazione e lo spettro sono legati da Parseval (Wiener&ndash;Khinchin). Ogni volta che un apparato misura &laquo;quanta energia c&rsquo;è a quella frequenza&raquo;, sta calcolando una proiezione su un elemento della base."}], "domanda": "Se scegliere la base giusta significa <b>diagonalizzare l&rsquo;evoluzione</b>, allora per un sistema quantistico la base giusta è quella degli autostati dell&rsquo;hamiltoniana: lì l&rsquo;evoluzione è solo una fase, $c_n(t)=c_n(0)e^{-iE_nt/\\hbar}$, e nulla &laquo;succede&raquo;. Ma i sistemi complessi <b>termalizzano</b>: partendo da uno stato qualunque, le osservabili macroscopiche si stabilizzano su valori d&rsquo;equilibrio. Come può un&rsquo;evoluzione che nella base giusta è banale produrre irreversibilità apparente? La risposta candidata è l&rsquo;<b>ETH</b> (eigenstate thermalization hypothesis): non una proprietà dell&rsquo;evoluzione, ma degli <b>elementi di matrice</b> $\\langle m|\\hat O|n\\rangle$ delle osservabili <i>in quella base</i> — che per un sistema caotico si comportano come quantità pseudo-casuali. Il linguaggio con cui questa domanda si formula è, parola per parola, quello di questo nucleo."}, {"num": "10", "topic": "Lebesgue", "oggetto": "<b>L&rsquo;integrale di Lebesgue e la misura</b>: la nozione di &laquo;quanto pesa un insieme&raquo; e la robustezza dell&rsquo;integrale sotto limite.", "rotte": [{"dest": "Meccanica quantistica", "txt": "Gli stati sono elementi di $L^2$, cioè <b>classi</b> di funzioni: il valore in un punto non è osservabile, solo gli integrali lo sono. La normalizzazione $\\int|\\psi|^2=1$ è una misura di probabilità, e la convergenza dominata è ciò che autorizza gran parte dei passaggi al limite nei conti."}, {"dest": "Meccanica statistica", "txt": "La teoria della misura <b>è</b> il linguaggio della probabilità (Kolmogorov): uno stato macroscopico è una misura sullo spazio delle fasi, la misura di Liouville è invariante sotto il flusso hamiltoniano (nucleo 06), e l&rsquo;ipotesi ergodica è un enunciato sulla misura degli insiemi invarianti."}, {"dest": "Processi<br>stocastici", "txt": "Moto browniano, cammini aleatori, integrale sui cammini: tutti definiti come <b>misure su spazi di funzioni</b>. Qui l&rsquo;integrale di Riemann non è nemmeno pensabile — le traiettorie tipiche sono continue ma non derivabili in nessun punto."}], "domanda": "La misura è ciò che permette di dire che un insieme di configurazioni è &laquo;trascurabile&raquo; pur essendo infinito — i razionali in $[0,1]$, le traiettorie che tornano indietro spontaneamente. La meccanica statistica poggia interamente su questo tipo di affermazione: le configurazioni che violano il secondo principio <b>esistono</b>, ma hanno misura ridicolmente piccola. <b>Domanda che porti avanti:</b> «misura nulla» è una proprietà matematica esatta, mentre «misura $10^{-10^{23}}$» è una proprietà fisica di tutt&rsquo;altra natura — eppure le trattiamo allo stesso modo. Quando studierai la termalizzazione, la distinzione fra <i>impossibile</i> e <i>trascurabile</i> tornerà come questione centrale, e questo nucleo ti dà il vocabolario per porla con precisione."}, {"num": "11", "topic": "Olomorfe", "oggetto": "<b>L&rsquo;olomorfia</b>: dipendenza da $z$ e non da $\\bar z$, con le sue conseguenze — parti armoniche coniugate, conformità, rigidità globale.", "rotte": [{"dest": "Elettromagnetismo", "txt": "Potenziale ed equipotenziali/linee di campo sono $\\mathrm{Re}$ e $\\mathrm{Im}$ della stessa funzione olomorfa (<i>potenziale complesso</i>). Le <b>mappe conformi</b> trasportano un problema di Laplace da una geometria difficile a una banale: è il metodo per spigoli, lamine, profili alari (Joukowski)."}, {"dest": "Risposta lineare<br>e causalità", "txt": "Una funzione di risposta $\\chi(\\omega)$ è <b>olomorfa nel semipiano superiore</b> <i>perché</i> il sistema è causale (nessuna risposta prima dello stimolo). Da questa sola analiticità discendono le relazioni di <b>Kramers&ndash;Kronig</b>, che legano parte reale (dispersione) e parte immaginaria (assorbimento): due quantità misurabili separatamente, vincolate l&rsquo;una all&rsquo;altra da un fatto di analisi complessa."}, {"dest": "Meccanica quantistica", "txt": "Le <b>ampiezze di scattering</b> sono funzioni analitiche dell&rsquo;energia complessa; i loro <b>poli</b> sono stati legati e risonanze, i <b>tagli</b> corrispondono all&rsquo;apertura di canali (soglie). L&rsquo;analiticità è talmente vincolante da essere stata usata, negli anni &rsquo;60, come principio costitutivo di una teoria (matrice S analitica)."}, {"dest": "Meccanica statistica", "txt": "La funzione di partizione di un sistema <b>finito</b> è analitica: nessuna transizione di fase è possibile. Le transizioni sono <b>punti di non analiticità</b> che compaiono solo nel limite termodinamico — e nel piano complesso appaiono come <b>zeri di Lee&ndash;Yang</b> che si addensano sull&rsquo;asse reale. La singolarità, qui, è il fenomeno fisico."}], "domanda": "Se l&rsquo;analiticità è rigidità — un valore locale determina il tutto — allora un sistema descritto da funzioni analitiche non può <b>sorprendere</b>: il comportamento a grandi scale è già scritto nel comportamento locale. Ma i sistemi complessi fanno esattamente il contrario: emergono transizioni, criticità, comportamenti collettivi che nessuna analisi locale prevede. La conciliazione è che quei fenomeni vivono <b>esattamente dove l&rsquo;analiticità si rompe</b> — al limite termodinamico, nei punti critici, sui tagli. <b>Domanda che porti avanti:</b> la non-analiticità è un artefatto del limite infinito, o è il <i>modo</i> in cui la novità entra in una teoria altrimenti rigida? E per un sistema quantistico finito ma grande — quelli della decoerenza e dell&rsquo;ETH — dove si nasconde la quasi-singolarità che imita una transizione vera?"}, {"num": "12", "topic": "Cauchy", "oggetto": "<b>Il valore interno determinato dal bordo</b> ($f(z_0)=\\frac{1}{2\\pi i}\\oint\\frac{f}{z-z_0}$) e la <b>circuitazione non nulla attorno a una singolarità</b>.", "rotte": [{"dest": "Relazioni di<br>dispersione", "txt": "Se $\\chi(\\omega)$ è olomorfa nel semipiano superiore (causalità), applicare la formula di Cauchy a un contorno che chiude quel semipiano dà le <b>relazioni di Kramers&ndash;Kronig</b>: $\\mathrm{Re}\\,\\chi$ è un integrale di $\\mathrm{Im}\\,\\chi$ su tutte le frequenze, e viceversa. Assorbimento e dispersione sono due facce dello stesso oggetto analitico."}, {"dest": "Propagatori e<br>funzioni di Green", "txt": "Un propagatore è un&rsquo;espressione del tipo $\\frac{1}{\\omega-\\omega_0+i\\epsilon}$: il suo <b>polo</b> individua il modo, e il segno di $i\\epsilon$ (cioè da quale parte il polo sta rispetto al contorno) sceglie la prescrizione <b>ritardata</b> o <b>avanzata</b> — la causalità è una decisione topologica su come aggirare un polo."}, {"dest": "Fase di Berry<br>e topologia", "txt": "Un integrale su un cammino chiuso che non dipende dal cammino ma solo da <b>cosa racchiude</b> è la struttura della fase di Berry, dell&rsquo;effetto Aharonov&ndash;Bohm e dei numeri di Chern. Il $2\\pi i$ di $\\oint dz/z$ è il progenitore elementare di ogni quantità quantizzata di origine topologica."}, {"dest": "Principio del<br>massimo", "txt": "Un potenziale armonico non ha massimi interni: nessuna configurazione di cariche statiche può intrappolare una carica di prova in equilibrio stabile (<b>Earnshaw</b>). È il motivo per cui le trappole reali (Paul, Penning) usano campi <b>oscillanti</b> o magnetici — un teorema di analisi complessa che detta il progetto di un apparato."}], "domanda": "Se il valore interno è già scritto sul bordo, dov&rsquo;è &laquo;l&rsquo;informazione&raquo; di un sistema descritto da funzioni analitiche? Il principio d&rsquo;identità dice che un frammento arbitrariamente piccolo determina il tutto — e in fisica ciò significa che misurare una risposta su una finestra di frequenze determina, in linea di principio, la risposta a <b>tutte</b> le frequenze. Ma la ricostruzione è notoriamente <b>instabile</b>: piccoli errori sul frammento esplodono nella continuazione. <b>Domanda che porti avanti:</b> quando un sistema complesso &laquo;dimentica&raquo; il suo stato iniziale (termalizzazione, decoerenza), sta perdendo informazione oppure la sta rendendo <i>praticamente</i> irrecuperabile, come una continuazione analitica che esiste ma è mal condizionata? La distinzione fra impossibile e mal posto è, forse, il nodo di tutta la faccenda."}, {"num": "13", "topic": "Residui", "oggetto": "<b>Il teorema dei residui</b>: $\\oint f=2\\pi i\\sum\\mathrm{Res}$, con la scelta del contorno come scelta fisica.", "rotte": [{"dest": "Propagatori e<br>funzioni di Green", "txt": "Antitrasformare $\\tilde G(\\omega)=\\frac{1}{\\omega^2-\\omega_0^2+i\\epsilon}$ significa chiudere il contorno nel semipiano scelto dal <b>segno di $t$</b>: per $t\\gt0$ sopra, per $t\\lt0$ sotto. Il risultato è la Green ritardata — la risposta che arriva <b>dopo</b> lo stimolo. La causalità è, operativamente, un lemma di Jordan."}, {"dest": "Risonanze e<br>tempi di vita", "txt": "Un polo in $\\omega=\\omega_0-i\\Gamma/2$ dà, antitrasformando, un fattore $e^{-i\\omega_0t}e^{-\\Gamma t/2}$: la <b>parte immaginaria del polo è l&rsquo;inverso del tempo di vita</b>. Una lorentziana misurata in laboratorio è un polo nel piano complesso, e la sua larghezza è la sua distanza dall&rsquo;asse reale."}, {"dest": "Meccanica statistica", "txt": "Le <b>somme di Matsubara</b> $\\sum_n g(i\\omega_n)$ sulle frequenze immaginarie si calcolano come somme di residui: si introduce una funzione con poli proprio in $i\\omega_n$ (la distribuzione di Bose o Fermi) e si deforma il contorno. Un formalismo intero costruito su questo nucleo."}, {"dest": "Metodo del punto<br>di sella", "txt": "Per integrali con esponenziale grande si <b>deforma</b> il cammino fino a farlo passare per un punto stazionario, lungo la direzione di massima discesa. È la libertà di deformazione di questo nucleo, usata per l&rsquo;approssimazione asintotica: da lì nascono Stirling, WKB, e l&rsquo;approssimazione di sella dell&rsquo;integrale sui cammini."}], "domanda": "I poli di una funzione di risposta danno i <b>tempi di rilassamento</b> di un sistema: un polo vicino all&rsquo;asse reale è un modo che decade lentamente, uno lontano è un modo che muore subito. Per un sistema quantistico <b>chiuso e finito</b>, però, lo spettro è discreto e reale: nessun polo fuori asse, nessun decadimento vero — l&rsquo;evoluzione è quasi-periodica e a tempi enormi (Poincaré) il sistema <i>torna indietro</i>. <b>Domanda che porti avanti:</b> il decadimento che misuriamo è allora una proprietà di quali poli sono <i>effettivamente</i> rilevanti su tempi osservabili, cioè di come i residui si distribuiscono su uno spettro fittissimo. Studiare la decoerenza e l&rsquo;ETH significa, in questo linguaggio, chiedersi <b>quando una selva di poli reali imita un unico polo complesso</b> — e su che scala di tempi la finzione regge."}, {"num": "14", "topic": "Continuazione", "oggetto": "<b>La continuazione analitica</b>: l&rsquo;estensione unica di una funzione oltre il dominio in cui la sua formula converge.", "rotte": [{"dest": "Rinormalizzazione", "txt": "La <b>regolarizzazione dimensionale</b> continua analiticamente nella dimensione $d$ dello spazio-tempo: gli integrali divergenti diventano funzioni di $d$, e le divergenze compaiono come <b>poli di $\\Gamma$</b> in $d=4$. La struttura tecnica dell&rsquo;intera teoria quantistica dei campi perturbativa poggia su questo nucleo."}, {"dest": "Meccanica statistica", "txt": "La <b>rotazione di Wick</b> $t\\to-i\\tau$ è una continuazione analitica che trasforma l&rsquo;evoluzione quantistica $e^{-iHt}$ nel peso di Boltzmann $e^{-\\beta H}$: meccanica quantistica e meccanica statistica sono la <b>stessa</b> teoria continuata analiticamente nel tempo, con $\\beta$ come tempo immaginario. È forse il ponte concettuale più profondo fra i due campi che ti interessano."}, {"dest": "Transizioni<br>di fase", "txt": "La funzione di partizione di un sistema finito è analitica in $\\beta$ e nel campo: <b>nessuna transizione</b> è possibile. Gli <b>zeri di Lee&ndash;Yang</b> nel piano complesso si avvicinano all&rsquo;asse reale al crescere del sistema, e nel limite termodinamico lo toccano: <b>la transizione di fase è l&rsquo;arrivo di una singolarità sull&rsquo;asse fisico</b>."}, {"dest": "Scattering", "txt": "L&rsquo;ampiezza continuata nell&rsquo;energia complessa ha poli (stati legati, risonanze) e tagli (soglie). La <b>continuazione al secondo foglio</b> è dove vivono le risonanze instabili — oggetti che sull&rsquo;asse reale fisico non appaiono come stati, ma governano ciò che si misura."}], "domanda": "Se la funzione di partizione di un sistema <b>finito</b> è analitica, allora nessun sistema reale — che è sempre finito — ha vere transizioni di fase, vere singolarità, vera irreversibilità: sono tutte proprietà del <i>limite</i>. Eppure le osserviamo. <b>Domanda che porti avanti, ed è la stessa dei nuclei 06 e 13 in un&rsquo;altra veste:</b> qual è la quantità che misura <i>quanto vicino all&rsquo;asse reale</i> sono arrivate le singolarità di un sistema grande ma finito — e vale la pena studiare la termalizzazione (ETH, decoerenza) proprio come la <b>migrazione degli zeri e dei poli verso l&rsquo;asse fisico</b>, invece che come proprietà delle traiettorie? Se sì, gli strumenti per porla bene sono tutti in questo Movimento."}, {"num": "15", "topic": "Distribuzioni", "oggetto": "<b>La distribuzione</b> ($\\delta$, $\\delta^{\\prime}$), la <b>trasformata di Fourier</b> e la <b>funzione di Green</b> come risposta all&rsquo;impulso.", "rotte": [{"dest": "Elettromagnetismo", "txt": "Una carica puntiforme è $\\rho=q\\delta^3(\\mathbf r)$, e il potenziale coulombiano $\\frac{1}{4\\pi\\varepsilon_0 r}$ è la <b>Green del laplaciano</b>: $-\\Delta\\frac{1}{4\\pi r}=\\delta^3$. Ogni distribuzione di carica si risolve per sovrapposizione — cioè per convoluzione con quella Green. Il dipolo, non a caso, è una $\\delta^{\\prime}$."}, {"dest": "Meccanica quantistica", "txt": "Gli stati del continuo si normalizzano con $\\langle x|x'\\rangle=\\delta(x-x')$, le onde piane vivono nelle temperate, e $\\hat x,\\hat p$ sono coniugati <b>di Fourier</b>: l&rsquo;indeterminazione è la proprietà della trasformata vista nella tappa 02. Il <b>propagatore</b> è la Green dell&rsquo;equazione di Schrödinger."}, {"dest": "Risposta lineare", "txt": "Un sistema lineare invariante nel tempo è completamente descritto dalla sua <b>risposta all&rsquo;impulso</b> $G(t)$: $u=G*f$. In frequenza diventa un prodotto, $\\hat u=\\hat G\\hat f$, e $\\hat G$ è la <b>suscettività</b> — la stessa funzione analitica del nucleo 12 (Kramers–Kronig). Tre nuclei, un solo oggetto."}, {"dest": "Teoria<br>dei campi", "txt": "I <b>propagatori</b> sono le funzioni di Green dell&rsquo;operatore cinetico, le linee interne dei diagrammi di Feynman <b>sono</b> Green, e i vertici sono $\\delta$ che impongono la conservazione dell&rsquo;impulso. Il formalismo perturbativo è, tecnicamente, un&rsquo;algebra di convoluzioni."}], "domanda": "L&rsquo;equazione del calore <b>liscia</b> e non si può invertire nel tempo; quella delle onde no. Eppure entrambe descrivono sistemi fatti di particelle la cui dinamica microscopica è <b>reversibile</b>. La freccia del tempo, in questo linguaggio, entra quando si passa dai gradi di libertà microscopici a una descrizione ridotta — e si manifesta come uno <b>smorzamento delle alte frequenze</b>. <b>Domanda che porti avanti:</b> l&rsquo;irreversibilità è una proprietà dell&rsquo;equazione effettiva o della <i>scelta</i> di quali modi osservare? La decoerenza dice: le informazioni non si distruggono, migrano in modi che non guardiamo — cioè nelle alte frequenze dell&rsquo;ambiente. Se è così, l&rsquo;equazione del calore non è un&rsquo;approssimazione sbagliata della meccanica: è la meccanica <b>proiettata</b> sui modi che un osservatore può risolvere. Il nucleo 16 ti darà il linguaggio dei proiettori per formularlo con precisione."}, {"num": "16", "topic": "Operatori spettrale", "oggetto": "<b>L&rsquo;operatore autoaggiunto e il suo spettro</b>: $A=\\sum\\lambda_nP_n$, con la base di autovettori come base &laquo;giusta&raquo;.", "rotte": [{"dest": "Meccanica quantistica", "txt": "È il dizionario completo: osservabile = operatore autoaggiunto; valori misurabili = <b>spettro</b>; probabilità dell&rsquo;esito $n$ = $\\lVert P_n\\psi\\rVert^2$; collasso = applicazione del proiettore; evoluzione = $e^{-iHt/\\hbar}$, funzione dell&rsquo;operatore. Osservabili compatibili = operatori che <b>commutano</b> = base comune."}, {"dest": "Modi normali<br>e stabilità", "txt": "Piccole oscillazioni attorno a un equilibrio: diagonalizzare la matrice hessiana dà i <b>modi normali</b> e le frequenze proprie. Autovalore negativo = direzione instabile. È lo stesso conto che nel nucleo 06 classificava i punti fissi del ritratto di fase, qui in $N$ dimensioni."}, {"dest": "Meccanica statistica", "txt": "$Z=\\mathrm{Tr}\\,e^{-\\beta H}=\\sum_ne^{-\\beta E_n}$: la funzione di partizione è una funzione dell&rsquo;operatore, calcolata sullo spettro. Tutta la termodinamica di un sistema quantistico è contenuta nella <b>lista dei suoi autovalori</b> e nel loro addensamento (densità degli stati)."}, {"dest": "Caos quantistico<br>e ETH", "txt": "La <b>statistica delle spaziature</b> distingue integrabile (Poisson) da caotico (GOE/GUE): è la figura della tappa 02. L&rsquo;<b>ETH</b> aggiunge l&rsquo;affermazione sugli autostati — $\\langle m|\\hat O|n\\rangle$ si comporta come una matrice casuale con una parte liscia diagonale — e da lì deriva che un singolo autostato contiene già l&rsquo;informazione termica. <b>È il tuo terreno di tesi, scritto nel linguaggio di questo nucleo.</b>"}], "domanda": "Se l&rsquo;evoluzione è $\\psi(t)=\\sum_nc_ne^{-iE_nt/\\hbar}\\phi_n$, allora nella base spettrale <b>non succede nulla</b>: solo fasi che ruotano, moduli $|c_n|$ costanti per sempre. Un sistema quantistico chiuso non termalizza mai, in senso stretto. Eppure le osservabili macroscopiche si stabilizzano. La risposta dell&rsquo;ETH è che la termalizzazione non sta nello <b>stato</b> ma nelle <b>osservabili</b>: se gli elementi di matrice $\\langle m|\\hat O|n\\rangle$ fuori diagonale sono minuscoli e pseudo-casuali, le fasi che ruotano si cancellano fra loro e $\\langle\\hat O\\rangle(t)$ si assesta sul valore microcanonico. <b>Domanda che porti avanti:</b> quali proprietà dello <i>spettro</i> (spaziature, degenerazioni, risonanze) rendono quella cancellazione robusta invece che accidentale — e quanto a lungo regge, prima che le ricorrenze di Poincaré la smentiscano? Tutto ciò che serve per porre la domanda con precisione — base ortonormale, proiettori, funzioni di operatori, spettro — è in questo nucleo."}, {"num": "17", "topic": "Edp", "oggetto": "<b>Le tre EDP archetipe</b> e la loro distinzione: equilibrio, dissipazione, propagazione — tre destini dello stesso spettro.", "rotte": [{"dest": "Elettromagnetismo", "txt": "Elettrostatica e magnetostatica sono Laplace/Poisson; le onde EM nel vuoto sono l&rsquo;equazione delle onde con $c$ la velocità della luce, e i potenziali ritardati sono la sua funzione di Green. Le condizioni al bordo dei conduttori sono, letteralmente, il problema al bordo di questo nucleo."}, {"dest": "Meccanica statistica", "txt": "L&rsquo;equazione di diffusione emerge come limite macroscopico di un cammino aleatorio microscopico: $\\langle x^2\\rangle=2\\alpha t$ è la relazione di Einstein, e $\\alpha$ si lega alla temperatura dal <b>teorema di fluttuazione-dissipazione</b>. La freccia del tempo del calore <b>nasce</b> da una dinamica microscopica reversibile."}, {"dest": "Meccanica quantistica", "txt": "Schrödinger è il calore con coefficiente immaginario: unitaria come le onde, dispersiva come il calore. L&rsquo;equazione stazionaria $H\\psi=E\\psi$ è il problema agli autovalori del nucleo 16, e la buca di potenziale è il problema al bordo di questo."}, {"dest": "Relatività", "txt": "Il <b>dominio di dipendenza</b> dell&rsquo;equazione delle onde è il <b>cono di luce</b>: la struttura causale dello spaziotempo è, matematicamente, l&rsquo;iperbolicità dell&rsquo;equazione. Un&rsquo;equazione parabolica come il calore viola la causalità relativistica, ed è per questo che le teorie relativistiche della diffusione sono più delicate."}], "domanda": "Ecco la domanda che ha percorso tutto il percorso, e con cui è giusto chiuderlo. L&rsquo;equazione del calore è <b>irreversibile</b>: $t\\to-t$ la rompe, e il problema all&rsquo;indietro è mal posto. Ma i costituenti microscopici obbediscono a equazioni <b>reversibili</b> — Newton, o Schrödinger, che sono simmetriche nel tempo. È il paradosso di <b>Loschmidt</b>, e non si scioglie dicendo «statisticamente». <b>Domanda che porti avanti:</b> l&rsquo;irreversibilità è (a) un&rsquo;approssimazione che nasconde un&rsquo;informazione conservata ma inaccessibile — le alte frequenze del nucleo 15, i modi microscopici in cui la memoria migra; (b) una proprietà della <b>proiezione</b> che scegliamo, cioè di quali osservabili guardiamo (nucleo 16); oppure (c) qualcosa di genuinamente nuovo che emerge nel limite di infiniti gradi di libertà, come le singolarità del nucleo 14 che compaiono solo al limite termodinamico? La decoerenza propende per (a)+(b), l&rsquo;ETH dà la formulazione precisa di (b), e (c) resta il territorio meno battuto. <b>Il percorso finisce qui perché da qui in avanti non è più matematica da imparare: è la tua domanda.</b>"}, {"num": "18", "topic": "Integrali multipli", "oggetto": "<b>L&rsquo;integrale multiplo</b>: sommare una densità su un dominio, nelle coordinate che ne vedono la simmetria.", "rotte": [{"dest": "Meccanica classica", "txt": "Massa, <b>baricentro</b> e <b>momento d&rsquo;inerzia</b> di un corpo esteso sono tre integrali della stessa densità con pesi diversi ($1$, $\\mathbf r$, $d^2$). Il tensore d&rsquo;inerzia è la matrice di tutti questi integrali insieme."}, {"dest": "Elettromagnetismo", "txt": "Il potenziale di una distribuzione di carica è $\\int\\frac{\\rho\\,dV}{4\\pi\\varepsilon_0|\\mathbf r-\\mathbf r'|}$: un integrale triplo, quasi sempre da fare in sferiche o cilindriche sfruttando la simmetria — che è anche ciò che rende utilizzabile Gauss."}, {"dest": "Meccanica statistica", "txt": "La funzione di partizione è un integrale su tutto lo <b>spazio delle fasi</b>: $Z=\\frac{1}{h^{3N}}\\int e^{-\\beta H}d^{3N}q\\,d^{3N}p$ — un integrale multiplo in $6N$ dimensioni. Il cambio di variabili verso le coordinate normali (nucleo 16) è ciò che lo rende calcolabile, e il jacobiano di quel cambio è parte del risultato."}, {"dest": "Probabilità", "txt": "Una densità di probabilità congiunta si integra su una regione per dare la probabilità di quell&rsquo;evento; il cambio di variabili con $|\\det J|$ è <b>esattamente</b> la formula di trasformazione delle densità di variabili aleatorie. Stessa matematica, altro nome."}], "domanda": "Il fattore $|\\det J|$ dice quanto una trasformazione <b>comprime o dilata</b> il volume. In meccanica hamiltoniana c&rsquo;è un teorema che dice che l&rsquo;evoluzione temporale ha jacobiano <b>esattamente 1</b> (Liouville, nucleo 06): il volume nello spazio delle fasi non si comprime mai. <b>Domanda che porti avanti:</b> se il volume si conserva esattamente, come può un sistema «occupare tutto lo spazio accessibile» e termalizzare? La risposta è che il volume si conserva ma si <b>deforma</b>, allungandosi in filamenti sempre più sottili che si intrecciano ovunque — e a quel punto la domanda diventa: su quale scala smetti di distinguere un filamento sottile da una nuvola uniforme? Quella scala, e non la dinamica, è dove nasce l&rsquo;irreversibilità."}, {"num": "19", "topic": "Asintotica", "oggetto": "<b>L&rsquo;approssimazione di sella</b>: per parametro grande, l&rsquo;integrale vale il suo integrando nel punto dominante, per la larghezza gaussiana attorno.", "rotte": [{"dest": "Meccanica statistica", "txt": "Il <b>limite termodinamico</b> è un&rsquo;approssimazione di sella con $N$ = numero di particelle: $Z=\\int e^{-N\\beta f}$ è dominata dal minimo dell&rsquo;energia libera, e le fluttuazioni relative vanno come $1/\\sqrt N$. L&rsquo;equivalenza degli insiemi statistici <b>è</b> questo teorema. E quando due selle diventano degeneri, l&rsquo;approssimazione si rompe: è la <b>transizione di fase</b>."}, {"dest": "Integrali<br>di cammino", "txt": "$\\int\\mathcal{D}x\\,e^{iS/\\hbar}$: per $\\hbar\\to0$ la fase stazionaria seleziona la traiettoria di azione stazionaria, cioè quella <b>classica</b>. Le correzioni al secondo ordine sono le fluttuazioni quantistiche; la fase di Maslov è il $\\pi/4$ di questa tappa."}, {"dest": "WKB e<br>tunnel", "txt": "L&rsquo;approssimazione semiclassica per l&rsquo;equazione di Schrödinger è un&rsquo;espansione asintotica in $\\hbar$. L&rsquo;effetto <b>tunnel</b> corrisponde a una sella complessa (istantone) e produce $e^{-S/\\hbar}$: la quantità <b>non perturbativa</b>, invisibile a ogni ordine della serie — la stessa che la tappa 01 ha incontrato come limite del troncamento ottimo."}, {"dest": "Teoria dei<br>campi", "txt": "La serie perturbativa in QED è <b>asintotica e non convergente</b> (argomento di Dyson): a un certo ordine i termini ricominciano a crescere. Non è un fallimento del metodo, è l&rsquo;informazione che esiste fisica non perturbativa fuori dalla portata della serie."}], "domanda": "L&rsquo;approssimazione di sella dice che, per $N$ grande, un sistema «sta» nella configurazione che minimizza l&rsquo;energia libera, e tutto il resto è soppresso come $e^{-N\\Delta}$. È il motivo per cui la termodinamica funziona: un solo stato macroscopico conta. <b>Domanda che porti avanti:</b> se il sistema è grande ma <b>finito</b>, quella soppressione è enorme ma non infinita — le altre configurazioni ci sono ancora, con peso $e^{-10^{23}}$. Sono «impossibili» o solo «trascurabili»? È la stessa distinzione incontrata nel nucleo 10 con la misura nulla, e la stessa del nucleo 14 con la non-analiticità che appare solo al limite. <b>Tre nuclei diversi, la stessa frattura:</b> le proprietà su cui poggia la fisica macroscopica — irreversibilità, transizioni di fase, termalizzazione — sono <b>esatte solo all&rsquo;infinito</b>, e ciò che osserviamo è sempre finito. Studiare l&rsquo;ETH significa scegliere di prendere sul serio quel «quasi»."}, {"num": "20", "topic": "Spazio fasi", "oggetto": "<b>Lo spazio delle fasi con la sua misura invariante</b>: il volume $d^nq\\,d^np$ che il flusso hamiltoniano non comprime.", "rotte": [{"dest": "Meccanica statistica", "txt": "La misura di Liouville è ciò che rende <b>ben definito</b> «contare gli stati»: il volume nello spazio delle fasi diviso $h^{3N}$ è il numero di microstati, e da lì l&rsquo;entropia di Boltzmann $S=k\\ln\\Omega$. Senza l&rsquo;invarianza, «contare» dipenderebbe dall&rsquo;istante in cui conti."}, {"dest": "Meccanica quantistica", "txt": "L&rsquo;equazione di Liouville diventa quella di von Neumann per la <b>matrice densità</b>, con il commutatore al posto della parentesi di Poisson. Lo spazio delle fasi diventa lo spazio di Hilbert (nucleo 09), e il volume invariante diventa l&rsquo;unitarietà dell&rsquo;evoluzione (nucleo 16)."}, {"dest": "Caos e<br>sistemi dinamici", "txt": "L&rsquo;incomprimibilità è ciò che costringe un sistema caotico a <b>stirare e ripiegare</b>: non potendo comprimere, per mescolare deve allungare in una direzione e assottigliare nell&rsquo;altra. Gli esponenti di Lyapunov misurano quella velocità, e la loro somma è nulla proprio per Liouville."}, {"dest": "Simulazione<br>numerica", "txt": "Gli integratori <b>simplettici</b> (Verlet, leapfrog) sono costruiti per conservare esattamente il volume delle fasi: per questo restano stabili su miliardi di passi dove un Runge–Kutta accumula deriva sull&rsquo;energia. <b>Il teorema di questo nucleo detta il progetto del codice.</b>"}], "domanda": "Liouville dice che l&rsquo;informazione sullo stato iniziale <b>non si perde mai</b>: il volume che la contiene resta identico per sempre, e il flusso è invertibile. Eppure ogni sistema macroscopico che osservi dimentica il proprio passato. <b>Domanda che porti avanti — ed è letteralmente l&rsquo;inizio della tua tesi:</b> se nulla si perde, che cosa esattamente cambia quando un sistema «raggiunge l&rsquo;equilibrio»? Le due risposte candidate sono nei prossimi due nuclei: che la traiettoria <b>visiti</b> tutto lo spazio accessibile rendendo le medie temporali uguali a quelle d&rsquo;insieme (ergodicità), oppure che l&rsquo;informazione <b>migri</b> in dettagli sempre più fini che nessun osservatore risolve (coarse-graining, decoerenza). Non sono la stessa cosa, e distinguerle è il mestiere."}, {"num": "21", "topic": "Ergodicita", "oggetto": "<b>L&rsquo;ergodicità e il mescolamento</b>: quando una traiettoria sola può parlare per l&rsquo;intero insieme.", "rotte": [{"dest": "Meccanica statistica", "txt": "È la giustificazione dell&rsquo;insieme microcanonico: se il sistema è ergodico sulla superficie di energia, la media temporale che misuri coincide con l&rsquo;integrale che calcoli. Boltzmann la propose come ipotesi; un secolo dopo è dimostrata solo per pochi modelli (biliardi di Sinai, sfere dure)."}, {"dest": "Caos<br>hamiltoniano", "txt": "Esponenti di Lyapunov, KAM, transizione al caos: la figura della mappa standard è il ritratto standard del campo. La domanda «quanto è grande il mare caotico?» è quantitativa e si misura."}, {"dest": "Caos<br>quantistico", "txt": "Nei sistemi quantistici non esistono traiettorie, quindi l&rsquo;ergodicità classica non si trasporta. Il suo posto è preso dalla <b>statistica dei livelli</b> (nucleo 16: Poisson contro GOE/GUE) e dalla struttura degli autostati: sistemi il cui limite classico è caotico hanno spettri con repulsione dei livelli."}, {"dest": "ETH", "txt": "L&rsquo;<b>eigenstate thermalization hypothesis</b> è l&rsquo;analogo quantistico dell&rsquo;ipotesi ergodica, ma sposta l&rsquo;affermazione: non sulle traiettorie, bensì sugli <b>elementi di matrice</b> delle osservabili negli autostati dell&rsquo;energia. Se quelli si comportano come quantità pseudo-casuali, <b>un singolo autostato contiene già i valori termici</b> — e non serve alcuna media temporale."}], "domanda": "L&rsquo;ipotesi ergodica chiede che <i>una</i> traiettoria visiti tutto. Ma i tempi per farlo crescono come $e^N$, e nessun esperimento dura così: il gas nella stanza raggiunge l&rsquo;equilibrio in <b>secondi</b>, non in tempi di ricorrenza. <b>Quindi l&rsquo;ergodicità, anche quando è vera, spiega la cosa sbagliata</b> — spiega le medie su tempi infiniti, mentre l&rsquo;equilibrio è un fatto rapidissimo. <b>Domanda che porti avanti:</b> qual è la proprietà che rende l&rsquo;equilibrio <i>veloce</i>? Il candidato è il mescolamento con il suo tasso di Lyapunov, ma anche lì la scala giusta è quella su cui <b>l&rsquo;osservatore</b> smette di distinguere il filamento dalla nuvola. La risposta, se c&rsquo;è, non riguarda solo il sistema: riguarda la coppia sistema-osservabile. Ed è precisamente ciò che l&rsquo;ETH mette al centro."}, {"num": "22", "topic": "Irreversibilita", "oggetto": "<b>L&rsquo;irreversibilità come proprietà della coppia dinamica-osservabile</b>, non della sola dinamica.", "rotte": [{"dest": "Meccanica statistica", "txt": "Il secondo principio come enunciato probabilistico; l&rsquo;entropia di Boltzmann come conteggio di microstati compatibili col macrostato; il teorema H e le sue ipotesi nascoste (il <i>Stosszahlansatz</i>, che introduce a mano l&rsquo;asimmetria temporale)."}, {"dest": "Meccanica quantistica", "txt": "Entropia di entanglement, traccia parziale, e la sua crescita nel tempo come misura della migrazione dell&rsquo;informazione. Il paradosso dell&rsquo;informazione dei buchi neri è questa stessa domanda, portata dove fa più male."}, {"dest": "Sistemi a molti<br>corpi", "txt": "ETH e le sue <b>violazioni</b>: la localizzazione a molti corpi (MBL), dove il disordine impedisce la termalizzazione e il sistema <b>ricorda</b> il proprio stato iniziale per sempre. È il contro-esempio che rende ETH una vera ipotesi fisica e non una tautologia."}, {"dest": "Esperimenti", "txt": "Atomi freddi e simulatori quantistici misurano oggi la termalizzazione di sistemi isolati con decine di particelle: il campo non è più solo teorico, ed è la ragione per cui una tesi qui ha materiale reale con cui confrontarsi."}], "domanda": "<b>La domanda con cui il percorso finisce, ed è la tua.</b> Un sistema quantistico chiuso e finito non termalizza: lo spettro è discreto, l&rsquo;evoluzione unitaria, le ricorrenze esistono. Eppure, per certe osservabili e su certe scale di tempo, si comporta esattamente come se lo facesse. La domanda non è <i>se</i> termalizza — è: <b>quali proprietà dello spettro e degli elementi di matrice rendono quella finzione robusta, e per quanto tempo regge prima che le ricorrenze la smentiscano?</b><br><br>Posta così, è una domanda a cui si può <b>rispondere</b>: si misurano le spaziature dei livelli (nucleo 16), si guarda la struttura degli elementi di matrice, si stimano i tempi. E gli strumenti per porla ci sono tutti nei venti nuclei che hai alle spalle — Hilbert e le basi ortonormali, lo spettro e i proiettori, la misura e il «quasi ovunque», la sella e il limite $N\\to\\infty$, il flusso incomprimibile e il coarse-graining. <b>Il percorso finisce qui perché da qui in avanti non è più matematica da imparare: è una domanda da lavorare.</b>"}], DEST=[["Elettromagnetismo", "#e0a94a"], ["Meccanica classica", "#5ac8fa"], ["Meccanica statistica", "#8bd450"], ["Meccanica quantistica", "#b98cff"], ["Tesi", "#ff6b6b"]];
var LX=280, RX=880, TOP=70, GAPN=Math.max(96,(760)/Math.max(1,NUCLEI.length)), GAPD=120;
var svg=document.getElementById('map'), tip=document.getElementById('tip');
function pos(i,n,gap,x){ return {x:x, y:TOP + i*gap + gap/2}; }
var nY=NUCLEI.map(function(_,i){return pos(i,NUCLEI.length,GAPN,LX).y;});
var dY=DEST.map(function(_,i){return pos(i,DEST.length,GAPD,RX).y;});
var H=Math.max(TOP+NUCLEI.length*GAPN, TOP+DEST.length*GAPD)+40;
svg.setAttribute('viewBox','0 0 1160 '+H);
function esc(s){return s;}
// archi
var arcs=[];
NUCLEI.forEach(function(n,ni){
  var routes=n.rotte.slice();
  if(n.domanda) routes.push({dest:'Tesi', txt:n.domanda, open:true});
  routes.forEach(function(r){
    var di=DEST.findIndex(function(d){return d[0]===r.dest;});
    if(di<0) return;
    var col=DEST[di][1], y1=nY[ni], y2=dY[di];
    var mx=(LX+RX)/2;
    var p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d','M '+LX+' '+y1+' C '+mx+' '+y1+' '+mx+' '+y2+' '+RX+' '+y2);
    p.setAttribute('class','arc'+(r.open?' open':'')); p.setAttribute('stroke',col);
    if(r.open) p.setAttribute('stroke-dasharray','7 5');
    p.dataset.ni=ni; p.dataset.dest=r.dest; p.dataset.txt=r.txt;
    p.addEventListener('mousemove',showTip); p.addEventListener('mouseleave',hideTip);
    svg.appendChild(p); arcs.push(p);
  });
});
// nodi matematica (sinistra)
NUCLEI.forEach(function(n,ni){ node(LX, nY[ni], 'N'+n.num+' · '+n.topic, '#221c3e', var_pro(), 'left', ni); });
// nodi fisica (destra)
DEST.forEach(function(d,di){ node(RX, dY[di], d[0], '#1a1730', d[1], 'right', -1); });
function var_pro(){return getComputedStyle(document.documentElement).getPropertyValue('--pro').trim();}
function node(x,y,label,fill,stroke,side,ni){
  var g=document.createElementNS('http://www.w3.org/2000/svg','g'); g.setAttribute('class','node');
  var w=Math.min(300, 40+label.length*8.2), h=40;
  var rx = side==='left'? x-w : x;
  var rct=document.createElementNS('http://www.w3.org/2000/svg','rect');
  rct.setAttribute('x',rx);rct.setAttribute('y',y-h/2);rct.setAttribute('width',w);rct.setAttribute('height',h);
  rct.setAttribute('rx',10);rct.setAttribute('fill',fill);rct.setAttribute('stroke',stroke);rct.setAttribute('stroke-width',1.6);
  var t=document.createElementNS('http://www.w3.org/2000/svg','text');
  t.setAttribute('x',rx+w/2);t.setAttribute('y',y+5);t.setAttribute('text-anchor','middle');
  t.setAttribute('class','lab');t.setAttribute('fill','#e9e6f2');t.setAttribute('font-size','14.5');t.textContent=label;
  g.appendChild(rct);g.appendChild(t);svg.appendChild(g);
  if(ni>=0){ g.addEventListener('mouseenter',function(){highlight(ni);}); g.addEventListener('mouseleave',clearHi); }
}
function highlight(ni){ arcs.forEach(function(a){ a.classList.toggle('hot', +a.dataset.ni===ni); a.classList.toggle('dim', +a.dataset.ni!==ni); }); }
function clearHi(){ arcs.forEach(function(a){ a.classList.remove('hot','dim'); }); }
function showTip(e){ var a=e.currentTarget; a.classList.add('hot');
  tip.innerHTML='<div class="d" style="color:'+a.getAttribute('stroke')+'">→ '+a.dataset.dest+'</div>'+a.dataset.txt;
  if(window.renderMathInElement) renderMathInElement(tip,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}]});
  tip.style.opacity=1; var x=Math.min(e.clientX+16, innerWidth-440), y=Math.min(e.clientY+14, innerHeight-160);
  tip.style.left=x+'px'; tip.style.top=y+'px'; }
function hideTip(e){ e.currentTarget.classList.remove('hot'); tip.style.opacity=0; }
// legenda
var leg=document.getElementById('legend');
DEST.forEach(function(d){ var s=document.createElement('span'); s.innerHTML='<b style="background:'+d[1]+'"></b>'+d[0]; leg.appendChild(s); });
var so=document.createElement('span'); so.innerHTML='<b style="background:#ff6b6b;height:0;border-top:2px dashed #ff6b6b"></b>domanda aperta → tesi'; leg.appendChild(so);
