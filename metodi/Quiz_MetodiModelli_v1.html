tazionario + transiente · manuale","steps":[{"t":"$\\partial_t u=D\\,\\partial_x^2 u+Q$ su $[0,L]$, Dirichlet $u(t,0)=u(t,L)=0$, $Q>0$ costante (generazione interna), $u(0,x)=0$. Poiche' la sorgente NON dipende dal tempo, qual e' la strategia?","opts":[{"x":"Cercare lo stato stazionario $u_s(x)$ (soluzione $\\partial_t=0$) e porre $u=u_s+v$ con $v$ transiente a sorgente nulla","c":true},{"x":"Applicare Duhamel con sorgente dipendente dal tempo"},{"x":"Trasformare in Fourier su tutta la retta"}],"hint":"Sorgente costante $\\Rightarrow$ esiste un profilo di equilibrio verso cui il sistema tende.","sol":"Con sorgente autonoma conviene la decomposizione stazionario + transiente: $u=u_s(x)+v(x,t)$, dove $u_s$ assorbe la sorgente e $v$ risolve il calore OMOGENEO. E' piu' pulita di Duhamel, che pure funzionerebbe.","cont":"Stato stazionario"},{"t":"Lo stato stazionario risolve $0=D u_s''+Q$ con $u_s(0)=u_s(L)=0$. Quanto vale?","opts":[{"x":"$u_s(x)=\\dfrac{Q}{2D}\\,x(L-x)$ (parabola)","c":true},{"x":"$u_s(x)=\\dfrac{Q}{D}\\,x$"},{"x":"$u_s(x)=\\dfrac{Q}{2D}\\,x^2$"}],"hint":"$u_s''=-Q/D$: integra due volte e imponi lo zero ai due estremi.","sol":"$u_s''=-Q/D\\Rightarrow u_s=-\\tfrac{Q}{2D}x^2+c_1x+c_2$; con $u_s(0)=0\\Rightarrow c_2=0$ e $u_s(L)=0\\Rightarrow c_1=QL/(2D)$. Quindi $u_s=\\tfrac{Q}{2D}x(L-x)$: profilo parabolico simmetrico, massimo al centro.","cont":"Transiente"},{"t":"Ponendo $u=u_s+v$, quale problema risolve $v$ e qual e' il suo dato iniziale?","opts":[{"x":"$v_t=D v_{xx}$ (omogeneo), Dirichlet omogenee, $v(0,x)=-u_s(x)$","c":true},{"x":"$v_t=Dv_{xx}+Q$, stessa sorgente"},{"x":"$v_t=Dv_{xx}$ con $v(0,x)=+u_s(x)$"}],"hint":"$u(0,x)=0=u_s(x)+v(0,x)$: ricava $v(0,x)$.","sol":"Sostituendo, la sorgente si cancella con $u_s''$: $v_t=Dv_{xx}$, BC Dirichlet omogenee. Il dato: $u(0,x)=0\\Rightarrow v(0,x)=-u_s(x)=-\\tfrac{Q}{2D}x(L-x)$. Il transiente porta il disallineamento iniziale e decade.","cont":"Sviluppo"},{"t":"Sviluppando $-u_s(x)$ in seni, la soluzione transiente e':","opts":[{"x":"$v=-\\sum_{n\\ dispari}\\dfrac{4QL^2}{D\\pi^3 n^3}\\sin\\dfrac{n\\pi x}{L}\\,e^{-D(n\\pi/L)^2 t}$ (solo $n$ dispari)","c":true},{"x":"$v=-\\sum_{n}\\dfrac{2QL^2}{D\\pi^2 n^2}\\sin\\dfrac{n\\pi x}{L}\\,e^{-D(n\\pi/L)^2 t}$ (tutti gli $n$)"},{"x":"$v=-\\dfrac{Q}{2D}x(L-x)e^{-Dt}$"}],"hint":"$\\int_0^L x(L-x)\\sin(n\\pi x/L)dx=\\dfrac{2L^3}{n^3\\pi^3}(1-(-1)^n)$: nullo per $n$ pari.","sol":"I coefficienti di $x(L-x)$: $b_n=\\tfrac2L\\cdot\\tfrac{Q}{2D}\\int_0^L x(L-x)\\sin(n\\pi x/L)dx=\\tfrac{4QL^2}{D\\pi^3 n^3}(1-(-1)^n)$, nonnullo solo per $n$ dispari (dove vale $\\tfrac{8QL^2}{D\\pi^3n^3}$). La parabola e' simmetrica rispetto a $x=L/2$, quindi solo armoniche dispari. Quindi $v=-\\sum_{n\\ disp}\\tfrac{8QL^2}{D\\pi^3n^3}\\sin\\tfrac{n\\pi x}{L}e^{-D(n\\pi/L)^2t}$; l'opzione corretta riporta il coefficiente gia' ristretto agli $n$ dispari.","cont":"Esistenza dello stazionario"},{"t":"Domanda di comprensione: perche' con Dirichlet esiste uno stato stazionario, mentre con estremi ISOLATI (Neumann) e la stessa sorgente $Q$ NON esisterebbe?","opts":[{"x":"Con Dirichlet i bordi rimuovono il calore prodotto, e all'equilibrio la produzione $Q$ eguaglia il flusso uscente. Con Neumann (isolato) nessun calore esce: il bilancio $\\frac{d}{dt}\\int u=QL>0$ e' sempre positivo, la temperatura media cresce senza limite, nessuno stazionario","c":true},{"x":"Neumann ha uno stazionario, Dirichlet no"},{"x":"Nessuno dei due ha stato stazionario"}],"hint":"Integra l'equazione su $[0,L]$: $\\frac{d}{dt}\\int u=D[u_x]_0^L+QL$. Con Neumann il termine di flusso e' zero.","sol":"Bilancio globale: $\\frac{d}{dt}\\int_0^L u\\,dx=D\\,[u_x]_0^L+QL$. Con Dirichlet il flusso ai bordi $D[u_x]_0^L$ puo' bilanciare $QL$ e dare stazionario. Con Neumann $u_x(0)=u_x(L)=0$, quindi $\\frac{d}{dt}\\int u=QL>0$: la media cresce linearmente per sempre, nessun equilibrio. E' la condizione di solvibilita' (alternativa di Fredholm) per il problema stazionario.","cont":"Tempo lungo"},{"t":"Comportamento per $t\\to\\infty$?","opts":[{"x":"$u\\to u_s(x)=\\dfrac{Q}{2D}x(L-x)$: il transiente muore e resta il profilo parabolico di equilibrio","c":true},{"x":"$u\\to0$"},{"x":"$u\\to$ media costante"}],"hint":"Il transiente $v$ ha tutti $\\lambda_n>0$: cosa resta?","sol":"Ogni modo di $v$ decade ($\\lambda_n>0$), quindi $u\\to u_s$: lo stato stazionario e' l'attrattore. La temperatura si assesta sulla parabola $\\tfrac{Q}{2D}x(L-x)$, massima al centro."}]},{"pool":"edp","src":"corda pizzicata (dato triangolare): armoniche dispari e convergenza · manuale","steps":[{"t":"$\\partial_t^2 u=c^2\\partial_x^2 u$ su $[0,L]$, Dirichlet, corda pizzicata al centro: $u(x,0)=f(x)$ triangolare (altezza $h$ in $x=L/2$), $\\partial_t u(x,0)=0$. Quale base e forma della soluzione?","opts":[{"x":"$u=\\sum_n b_n\\sin\\dfrac{n\\pi x}{L}\\cos\\dfrac{n\\pi c t}{L}$, con $b_n$ coefficienti di Fourier in seni di $f$","c":true},{"x":"$u=\\sum_n b_n\\cos\\dfrac{n\\pi x}{L}\\cos\\dfrac{n\\pi ct}{L}$"},{"x":"$u=\\sum_n b_n\\sin\\dfrac{n\\pi x}{L}\\sin\\dfrac{n\\pi ct}{L}$"}],"hint":"Dirichlet $\\Rightarrow$ seni; velocita' iniziale nulla $\\Rightarrow$ solo coseni nel tempo.","sol":"Dirichlet seleziona $\\sin(n\\pi x/L)$; velocita' iniziale nulla annulla i $\\sin(n\\pi ct/L)$, lasciando i $\\cos$. Quindi $u=\\sum_n b_n\\sin(n\\pi x/L)\\cos(n\\pi ct/L)$ con $b_n=\\tfrac2L\\int_0^L f\\sin(n\\pi x/L)dx$.","cont":"Calcolo dei b_n"},{"t":"Con $f(x)=\\tfrac{2h}{L}x$ per $0\\le x\\le L/2$ e $f(x)=\\tfrac{2h}{L}(L-x)$ per $L/2\\le x\\le L$, i coefficienti valgono:","opts":[{"x":"$b_n=\\dfrac{8h}{\\pi^2 n^2}\\sin\\dfrac{n\\pi}{2}$","c":true},{"x":"$b_n=\\dfrac{4h}{\\pi n}\\sin\\dfrac{n\\pi}{2}$"},{"x":"$b_n=\\dfrac{2h}{L}$ per ogni $n$"}],"hint":"Integra per parti sui due tratti; il risultato standard del triangolo isoscele e' $\\propto\\sin(n\\pi/2)/n^2$.","sol":"Con $b_n=\\tfrac2L\\int_0^L f\\sin(n\\pi x/L)dx$, integrando per parti sui due tratti si ottiene il risultato classico $b_n=\\tfrac{8h}{\\pi^2 n^2}\\sin(n\\pi/2)$. Il fattore $\\sin(n\\pi/2)$ vale $0$ per $n$ pari e $\\pm1$ alternato per $n$ dispari.","cont":"Solo armoniche dispari"},{"t":"Perche' compaiono SOLO le armoniche dispari, e cosa succede se si pizzica in un punto diverso dal centro?","opts":[{"x":"Il dato e' simmetrico rispetto a $x=L/2$; i modi PARI $\\sin(2k\\pi x/L)$ sono antisimmetrici rispetto al centro e hanno prodotto scalare nullo col dato simmetrico. Pizzicando fuori centro la simmetria si rompe e ricompaiono modi pari","c":true},{"x":"I modi pari mancano sempre, per qualunque dato"},{"x":"E' un caso fortuito del calcolo, senza ragione"}],"hint":"$\\sin(n\\pi x/L)$ rispetto al centro $x=L/2$: e' pari per $n$ dispari, dispari per $n$ pari. Il dato triangolare centrato che parita' ha?","sol":"Rispetto a $x=L/2$, $\\sin(n\\pi x/L)$ e' simmetrico (pari) per $n$ dispari e antisimmetrico per $n$ pari. Il triangolo centrato e' simmetrico, quindi ha proiezione nulla sui modi pari: $\\langle f,\\sin(2k\\pi x/L)\\rangle=0$. E' una selezione per simmetria, non un caso: chi pizzica una corda al centro (chitarra) sopprime davvero le armoniche pari. Pizzicando in $x_0\\neq L/2$ la simmetria cade e i modi pari riappaiono.","cont":"Convergenza"},{"t":"Il decadimento $b_n\\sim1/n^2$ implica che la serie:","opts":[{"x":"converge UNIFORMEMENTE (niente fenomeno di Gibbs), perche' $f$ e' continua; con $\\sum1/n^2<\\infty$ la convergenza e' totale (test di Weierstrass)","c":true},{"x":"converge solo puntualmente e mostra Gibbs agli estremi"},{"x":"diverge"}],"hint":"Confronta col dato discontinuo (onda quadra), dove $b_n\\sim1/n$ e c'e' Gibbs. Qui il dato e' continuo.","sol":"$|b_n|\\le\\tfrac{8h}{\\pi^2 n^2}$ e $\\sum1/n^2<\\infty$: per il test di Weierstrass la serie converge uniformemente e totalmente, senza Gibbs. Il tasso $1/n^2$ (invece di $1/n$) e' conseguenza della continuita' di $f$: la corda pizzicata e' continua ma con derivata angolosa al centro, da cui $1/n^2$.","cont":"Verifica"},{"t":"Verifica in $t=0$: la serie ricostruisce $f(x)$?","opts":[{"x":"Si': $u(x,0)=\\sum_n b_n\\sin(n\\pi x/L)=f(x)$ per ogni $x$, essendo lo sviluppo in seni di una funzione continua e regolare a tratti (teorema di Dirichlet sulla convergenza)","c":true},{"x":"No, converge a $h/2$ al centro"},{"x":"Solo in media quadratica, non puntualmente"}],"hint":"$f$ continua e $C^1$ a tratti: il teorema di convergenza di Dirichlet garantisce ricostruzione puntuale.","sol":"Per il teorema di Dirichlet, lo sviluppo in seni di una funzione continua e regolare a tratti converge puntualmente al valore della funzione in ogni punto (agli estremi $f=0$, coerente coi seni). Quindi $u(x,0)=f(x)$: la soluzione soddisfa il dato iniziale. Il punto angoloso in $L/2$ e' comunque un punto di continuita', nessun salto.","cont":"Periodo"},{"t":"Domanda finale sul suono: perche' la corda produce un tono definito (armonico) mentre un tamburo no?","opts":[{"x":"Le frequenze $\\omega_n=c\\,n\\pi/L$ sono multipli INTERI della fondamentale: periodo comune $2L/c$, suono armonico. Le frequenze di una membrana 2D sono $\\propto\\sqrt{m^2/a^2+n^2/b^2}$, generalmente incommensurabili: nessun periodo comune, suono non intonato","c":true},{"x":"La corda e' inarmonica, il tamburo armonico"},{"x":"Entrambi producono frequenze intere"}],"hint":"$\\omega_n/\\omega_1=n$ per la corda: rapporto intero. Per la membrana i rapporti sono irrazionali.","sol":"Sulla corda $\\omega_n=n\\omega_1$: tutte le frequenze condividono il periodo $2L/c$, l'orecchio percepisce un'altezza netta. Sulla membrana rettangolare $\\omega_{mn}=c\\pi\\sqrt{(m/a)^2+(n/b)^2}$ da' rapporti irrazionali (incommensurabili), niente periodo comune, timbro percussivo senza altezza definita. E' la differenza fisica fra strumento a corda e a percussione."}]},{"pool":"edp","src":"diffusione su semiretta con Dirichlet, metodo delle immagini ed erf · manuale","steps":[{"t":"$\\partial_t u=D\\,\\partial_x^2 u$ su $x>0$, $u(0,t)=0$, $u(x,0)=u_0$ costante. Per usare il nucleo del calore (definito su tutta la retta) come si estende il dato?","opts":[{"x":"Estensione DISPARI: $\\tilde f(x)=u_0$ per $x>0$, $-u_0$ per $x<0$","c":true},{"x":"Estensione PARI: $\\tilde f(x)=u_0$ per ogni $x$"},{"x":"Estensione nulla per $x<0$"}],"hint":"Serve $u(0,t)=0$: quale parita' del dato annulla la convoluzione in $x=0$?","sol":"Per la BC di Dirichlet $u(0,t)=0$ si estende il dato in modo DISPARI. Metodo delle immagini: una 'sorgente immagine' negativa a $x<0$ pinza a zero il bordo.","cont":"Perche' dispari"},{"t":"Perche' proprio l'estensione dispari garantisce $u(0,t)=0$ per ogni $t$?","opts":[{"x":"Il nucleo $G(x-y,t)$ e' pari in $(x-y)$; convolvendo un dato dispari, $u(x,t)$ risulta dispari in $x$, e una funzione dispari vale $0$ in $x=0$ automaticamente","c":true},{"x":"Perche' il nucleo diventa dispari"},{"x":"E' una coincidenza numerica valida solo a $t$ piccoli"}],"hint":"Convoluzione di (pari) $\\ast$ (dispari) = ? E quanto vale una funzione dispari in $0$?","sol":"Il nucleo del calore e' pari; la convoluzione di una funzione pari con una dispari e' dispari. Quindi $u(-x,t)=-u(x,t)$, da cui $u(0,t)=0$ identicamente. La parita' del dato E' dettata dalla BC (Dirichlet$\\to$dispari, Neumann$\\to$pari): sbagliarla viola il bordo.","cont":"Convoluzione"},{"t":"La soluzione $u=\\int_{-\\infty}^{\\infty}\\tfrac{1}{\\sqrt{4\\pi Dt}}e^{-(x-y)^2/(4Dt)}\\tilde f(y)\\,dy$ con il dato dispari si scrive come:","opts":[{"x":"$u=u_0\\Big[\\displaystyle\\int_0^\\infty G(x-y,t)dy-\\int_{-\\infty}^0 G(x-y,t)dy\\Big]$","c":true},{"x":"$u=u_0\\displaystyle\\int_{-\\infty}^\\infty G(x-y,t)dy=u_0$"},{"x":"$u=u_0\\displaystyle\\int_0^\\infty G(x-y,t)dy$ soltanto"}],"hint":"Spezza l'integrale in $y>0$ ($+u_0$) e $y<0$ ($-u_0$).","sol":"Con $\\tilde f=u_0$ per $y>0$ e $-u_0$ per $y<0$, l'integrale si spezza nei due semiassi con segni opposti. La differenza dei due integrali gaussiani produrra' una funzione errore.","cont":"Risultato erf"},{"t":"Introdotta la variabile di similarita' $\\eta=\\dfrac{x}{2\\sqrt{Dt}}$, il risultato e':","opts":[{"x":"$u(x,t)=u_0\\,\\mathrm{erf}\\!\\Big(\\dfrac{x}{2\\sqrt{Dt}}\\Big)$","c":true},{"x":"$u(x,t)=u_0\\,\\mathrm{erfc}\\!\\Big(\\dfrac{x}{2\\sqrt{Dt}}\\Big)$"},{"x":"$u(x,t)=u_0\\,e^{-x^2/(4Dt)}$"}],"hint":"$\\mathrm{erf}(z)=\\tfrac{2}{\\sqrt\\pi}\\int_0^z e^{-s^2}ds$: cambia variabile $s=(x-y)/\\sqrt{4Dt}$.","sol":"Con la sostituzione $s=(x-y)/(2\\sqrt{Dt})$ i due integrali gaussiani si combinano in $u=u_0\\,\\mathrm{erf}(x/(2\\sqrt{Dt}))$, dove $\\mathrm{erf}$ e' la funzione errore. La soluzione dipende solo dalla variabile di similarita' $\\eta=x/(2\\sqrt{Dt})$: firma dell'invarianza di scala della diffusione.","cont":"Limiti"},{"t":"Comportamenti a $t\\to0^+$ e $t\\to\\infty$?","opts":[{"x":"$t\\to0^+$: $\\eta\\to\\infty$, $\\mathrm{erf}\\to1$, si recupera $u\\to u_0$ per $x>0$; $t\\to\\infty$: $\\eta\\to0$, $\\mathrm{erf}\\to0$, $u\\to0$ (il calore fugge dal bordo)","c":true},{"x":"$t\\to\\infty$: $u\\to u_0$ (calore conservato)"},{"x":"$t\\to0$: $u\\to0$"}],"hint":"$\\eta=x/(2\\sqrt{Dt})$: come si comporta per $t\\to0$ (fissato $x>0$) e per $t\\to\\infty$?","sol":"Per $t\\to0^+$, $\\eta\\to+\\infty$ e $\\mathrm{erf}\\to1$: $u\\to u_0$ (dato iniziale ricostruito su $x>0$). Per $t\\to\\infty$, $\\eta\\to0$ e $\\mathrm{erf}\\to0$: $u\\to0$, perche' il bordo assorbente drena tutto il calore. A differenza del problema su dominio finito Neumann (calore conservato), qui la semiretta con Dirichlet perde calore all'infinito temporale.","cont":"Verifica BC"},{"t":"Verifica: la soluzione soddisfa $u(0,t)=0$?","opts":[{"x":"Si': $\\mathrm{erf}(0)=0$ per ogni $t>0$, quindi $u(0,t)=0$ identicamente","c":true},{"x":"No, $u(0,t)=u_0/2$"},{"x":"Solo nel limite $t\\to\\infty$"}],"hint":"$\\mathrm{erf}(0)=0$: valuta $u$ in $x=0$.","sol":"$u(0,t)=u_0\\,\\mathrm{erf}(0)=0$ per ogni $t>0$: la BC di Dirichlet e' rispettata a tutti i tempi. Il metodo delle immagini con estensione dispari e' consistente."}]},{"pool":"edp","src":"calore con estremi isolati (Neumann): il modo nullo e la conservazione · manuale","steps":[{"t":"$\\partial_t u=D\\,\\partial_x^2 u$ su $[0,L]$, estremi isolati $\\partial_x u(t,0)=\\partial_x u(t,L)=0$, dato $u(0,x)=f(x)$. Quali sono le autofunzioni e gli autovalori, incluso il caso $\\lambda=0$?","opts":[{"x":"$X_n=\\cos(n\\pi x/L)$, $\\lambda_n=(n\\pi/L)^2$ per $n\\ge0$: il modo $n=0$ (costante) ha $\\lambda_0=0$ ed E' ammesso","c":true},{"x":"$X_n=\\sin(n\\pi x/L)$, $n\\ge1$: nessun modo costante"},{"x":"$X_n=\\cos(n\\pi x/L)$, $n\\ge1$: il modo $n=0$ si scarta"}],"hint":"Con Neumann la costante $X_0=1$ soddisfa $X'(0)=X'(L)=0$: e' un'autofunzione legittima.","sol":"Neumann seleziona i coseni $\\cos(n\\pi x/L)$; a differenza di Dirichlet, il modo $n=0$ (funzione costante) soddisfa le BC ed E' autofunzione, con $\\lambda_0=0$. Lo spettro parte da zero.","cont":"Soluzione generale"},{"t":"La soluzione generale e':","opts":[{"x":"$u=\\dfrac{a_0}{2}+\\displaystyle\\sum_{n\\ge1}a_n\\cos\\dfrac{n\\pi x}{L}\\,e^{-D(n\\pi/L)^2 t}$, $a_n=\\dfrac2L\\int_0^L f\\cos\\dfrac{n\\pi x}{L}\\,dx$","c":true},{"x":"$u=\\displaystyle\\sum_{n\\ge1}a_n\\cos\\dfrac{n\\pi x}{L}\\,e^{-D(n\\pi/L)^2 t}$, senza termine costante"},{"x":"$u=\\dfrac{a_0}{2}e^{-Dt}+\\sum a_n\\cos(\\dots)$"}],"hint":"Il modo $n=0$ ha fattore temporale $e^{-\\lambda_0 Dt}=e^0=1$: costante nel tempo.","sol":"Espansione in coseni con il termine $n=0$: $u=\\tfrac{a_0}{2}+\\sum_{n\\ge1}a_n\\cos(n\\pi x/L)e^{-D(n\\pi/L)^2 t}$. Il modo costante NON decade ($e^{-\\lambda_0 Dt}=1$): resta fisso a $a_0/2$.","cont":"Perche' il modo nullo non decade"},{"t":"Perche' il modo $n=0$ non decade, cosa rappresenta fisicamente, e perche' con Dirichlet invece $u\\to0$?","opts":[{"x":"$\\lambda_0=0$ e' il modo conservato: gli estremi isolati non fanno uscire calore, quindi il calore totale $\\int_0^L u\\,dx$ e' costante e $u\\to\\bar f=\\tfrac1L\\int_0^L f\\,dx$. Con Dirichlet i bordi drenano calore, non c'e' modo nullo, e $u\\to0$","c":true},{"x":"Non decade per un errore di normalizzazione; fisicamente $u\\to0$ anche qui"},{"x":"Rappresenta un'oscillazione stazionaria"}],"hint":"Integra l'equazione: $\\frac{d}{dt}\\int_0^L u=D[u_x]_0^L=0$ con Neumann. Cosa si conserva?","sol":"Bilancio globale: $\\frac{d}{dt}\\int_0^L u\\,dx=D[u_x]_0^L=0$ (flusso nullo agli estremi isolati), quindi il calore totale si conserva. L'autovalore nullo $\\lambda_0=0$ E' questa legge di conservazione, e forza $u\\to\\bar f$ (la media del dato), non zero. Con Dirichlet il flusso ai bordi non e' nullo, non esiste modo a $\\lambda=0$, e tutto il calore esce: $u\\to0$. Confondere i due limiti e' l'errore tipico.","cont":"Esempio concreto"},{"t":"Con $f(x)=x$, quanto valgono i coefficienti?","opts":[{"x":"$a_0=L$ (quindi media $L/2$); $a_n=\\dfrac{2L}{n^2\\pi^2}((-1)^n-1)$, nonnullo solo per $n$ dispari dove vale $-\\dfrac{4L}{n^2\\pi^2}$","c":true},{"x":"$a_0=L/2$; $a_n=\\dfrac{2}{n\\pi}(-1)^n$"},{"x":"$a_0=0$; tutti gli $a_n$ nulli"}],"hint":"$\\int_0^L x\\cos(n\\pi x/L)dx=\\dfrac{L^2}{n^2\\pi^2}((-1)^n-1)$; e $a_0=\\tfrac2L\\int_0^L x\\,dx$.","sol":"$a_0=\\tfrac2L\\int_0^L x\\,dx=L$, quindi $a_0/2=L/2$ (media di $x$ su $[0,L]$, come deve). $a_n=\\tfrac2L\\int_0^L x\\cos(n\\pi x/L)dx=\\tfrac{2L}{n^2\\pi^2}((-1)^n-1)$: zero per $n$ pari, $-\\tfrac{4L}{n^2\\pi^2}$ per $n$ dispari.","cont":"Tempo lungo"},{"t":"Con $f(x)=x$, a cosa tende $u$ per $t\\to\\infty$?","opts":[{"x":"$u\\to L/2$, la temperatura media iniziale, uniforme in $x$","c":true},{"x":"$u\\to0$"},{"x":"$u\\to x$, il dato iniziale"}],"hint":"Sopravvive solo il modo $n=0=a_0/2$.","sol":"Ogni modo $n\\ge1$ decade; resta $a_0/2=L/2$. Il calore si ridistribuisce fino a temperatura uniforme pari alla media $\\bar f=L/2$: conseguenza diretta della conservazione del calore totale (Neumann).","cont":"Verifica ortogonalita'"},{"t":"Come si giustifica la formula $a_n=\\tfrac2L\\int_0^L f\\cos(n\\pi x/L)dx$ per $n\\ge1$, e perche' il fattore del termine costante e' $a_0/2$?","opts":[{"x":"Ortogonalita' dei coseni: $\\int_0^L\\cos(m\\pi x/L)\\cos(n\\pi x/L)dx=\\tfrac{L}{2}\\delta_{mn}$ per $m,n\\ge1$, mentre per $n=0$ la norma e' $L$ (non $L/2$): da qui il $\\tfrac12$ sul termine costante","c":true},{"x":"E' una convenzione arbitraria senza giustificazione"},{"x":"Perche' $\\cos(0)=1$ e la norma vale sempre $L/2$"}],"hint":"$\\int_0^L 1\\,dx=L$, ma $\\int_0^L\\cos^2(n\\pi x/L)dx=L/2$ per $n\\ge1$: le due norme sono diverse.","sol":"Le autofunzioni di Sturm-Liouville (Neumann) sono ortogonali: $\\int_0^L\\cos(m\\pi x/L)\\cos(n\\pi x/L)dx=\\tfrac{L}{2}\\delta_{mn}$ per $m,n\\ge1$. Il modo costante ha norma $\\int_0^L 1\\,dx=L$, doppia rispetto agli altri: scrivere $a_0/2$ con $a_0=\\tfrac2L\\int f$ compensa esattamente, cosi' che la stessa formula valga per tutti gli $n$."}]},{"pool":"edp","src":"membrana rettangolare vibrante (tamburo 2D): modi e inarmonicita' · manuale","steps":[{"t":"$\\partial_t^2 u=c^2(\\partial_x^2+\\partial_y^2)u$ sul rettangolo $[0,a]\\times[0,b]$, $u=0$ su tutto il bordo. Separando $u=X(x)Y(y)T(t)$, quali autofunzioni spaziali?","opts":[{"x":"$X_m=\\sin(m\\pi x/a)$, $Y_n=\\sin(n\\pi y/b)$, $m,n\\ge1$","c":true},{"x":"$X_m=\\cos(m\\pi x/a)$, $Y_n=\\cos(n\\pi y/b)$"},{"x":"$X_m=\\sin(m\\pi x/a)$, $Y_n=\\cos(n\\pi y/b)$"}],"hint":"Dirichlet su tutti i lati $\\Rightarrow$ seni in entrambe le direzioni.","sol":"La separazione da' due problemi di Sturm-Liouville con Dirichlet: $X''+\\mu X=0$, $X(0)=X(a)=0\\Rightarrow X_m=\\sin(m\\pi x/a)$; analogo per $Y$. Le autofunzioni 2D sono i prodotti $\\sin(m\\pi x/a)\\sin(n\\pi y/b)$.","cont":"Frequenze"},{"t":"La costante di separazione totale e' $\\mu_m+\\nu_n=(m\\pi/a)^2+(n\\pi/b)^2$. Qual e' la frequenza $\\omega_{mn}$?","opts":[{"x":"$\\omega_{mn}=c\\pi\\sqrt{\\dfrac{m^2}{a^2}+\\dfrac{n^2}{b^2}}$","c":true},{"x":"$\\omega_{mn}=c\\pi\\Big(\\dfrac{m}{a}+\\dfrac{n}{b}\\Big)$"},{"x":"$\\omega_{mn}=c\\pi\\sqrt{\\dfrac{m^2+n^2}{a^2+b^2}}$"}],"hint":"$T''+c^2(\\mu_m+\\nu_n)T=0$: la frequenza e' $c\\sqrt{\\mu_m+\\nu_n}$.","sol":"$T''_{mn}+c^2(\\mu_m+\\nu_n)T_{mn}=0\\Rightarrow\\omega_{mn}=c\\sqrt{(m\\pi/a)^2+(n\\pi/b)^2}=c\\pi\\sqrt{m^2/a^2+n^2/b^2}$. Le frequenze sono radici di somme di quadrati.","cont":"Perche' inarmonico"},{"t":"Perche' un tamburo suona 'non intonato' mentre una corda produce un'altezza definita?","opts":[{"x":"Le $\\omega_{mn}=c\\pi\\sqrt{m^2/a^2+n^2/b^2}$ sono in generale INCOMMENSURABILI (rapporti irrazionali): non esiste un periodo comune, quindi nessuna altezza percepita. La corda ha $\\omega_n=cn\\pi/L$, multipli interi: periodo comune $2L/c$, suono armonico","c":true},{"x":"Il tamburo e' armonico e la corda no"},{"x":"Entrambi hanno frequenze in rapporto intero"}],"hint":"$\\omega_{mn}/\\omega_{11}$ e' razionale? Confronta con $\\omega_n/\\omega_1=n$ della corda.","sol":"Le frequenze 2D sono radici di somme di quadrati: i loro rapporti (es. $\\omega_{12}/\\omega_{11}$) sono tipicamente irrazionali, quindi le oscillazioni non condividono un periodo comune e l'orecchio non estrae un'altezza. La corda 1D ha $\\omega_n=n\\omega_1$, tutte armoniche del fondamentale, periodo comune $2L/c$: suono intonato. E' la ragione fisica per cui i tamburi sono percussioni non intonate.","cont":"Linee nodali"},{"t":"Dove sta ferma la membrana nel modo $(m,n)$ (linee nodali)?","opts":[{"x":"Sulle rette $x=ka/m$ ($k=1,\\dots,m-1$) e $y=lb/n$ ($l=1,\\dots,n-1$), dove $\\sin(m\\pi x/a)$ o $\\sin(n\\pi y/b)$ si annullano","c":true},{"x":"Solo al centro del rettangolo"},{"x":"Sui bordi soltanto"}],"hint":"Il modo si annulla dove uno dei due seni fa zero: rette interne parallele ai lati.","sol":"Il modo $\\sin(m\\pi x/a)\\sin(n\\pi y/b)$ si annulla dove uno dei fattori e' zero: rette verticali $x=ka/m$ e orizzontali $y=lb/n$. Sono le linee nodali (i segni delle figure di Chladni), $m-1$ verticali e $n-1$ orizzontali.","cont":"Degenerazione"},{"t":"Se la membrana e' QUADRATA ($a=b$), cosa succede alle coppie di modi $(m,n)$ e $(n,m)$ con $m\\neq n$?","opts":[{"x":"Sono DEGENERI: $\\omega_{mn}=\\omega_{nm}$; ogni combinazione lineare dei due e' ancora un modo alla stessa frequenza, da cui la ricchezza delle figure di Chladni sul quadrato","c":true},{"x":"Hanno frequenze diverse, nessuna degenerazione"},{"x":"Uno dei due modi scompare"}],"hint":"Con $a=b$: $\\sqrt{m^2+n^2}=\\sqrt{n^2+m^2}$.","sol":"Con $a=b$, $\\omega_{mn}=\\tfrac{c\\pi}{a}\\sqrt{m^2+n^2}=\\omega_{nm}$: degenerazione dovuta alla simmetria del quadrato. Lo spazio proprio e' bidimensionale, e ogni combinazione $\\alpha\\,u_{mn}+\\beta\\,u_{nm}$ vibra alla stessa frequenza con linee nodali diverse: e' l'origine della varieta' dei pattern di Chladni.","cont":"Soluzione generale"},{"t":"La soluzione completa con dati $u(x,y,0)=f(x,y)$, $\\partial_t u(x,y,0)=0$ e':","opts":[{"x":"$u=\\displaystyle\\sum_{m,n\\ge1}A_{mn}\\sin\\dfrac{m\\pi x}{a}\\sin\\dfrac{n\\pi y}{b}\\cos(\\omega_{mn}t)$, con $A_{mn}=\\dfrac{4}{ab}\\!\\iint f\\,\\sin\\dfrac{m\\pi x}{a}\\sin\\dfrac{n\\pi y}{b}\\,dx\\,dy$","c":true},{"x":"$u=\\sum A_{mn}\\sin(\\dots)\\sin(\\dots)\\sin(\\omega_{mn}t)$"}],"hint":"Velocita' iniziale nulla $\\Rightarrow$ solo coseni nel tempo; la norma 2D e' $ab/4$.","sol":"Doppia serie di Fourier in seni: $A_{mn}=\\tfrac{4}{ab}\\iint f\\sin(m\\pi x/a)\\sin(n\\pi y/b)\\,dx\\,dy$ (la costante $4/(ab)$ e' l'inverso della norma $\\iint\\sin^2\\sin^2=ab/4$). La velocita' iniziale nulla lascia solo i $\\cos(\\omega_{mn}t)$."}]},{"pool":"edp","src":"modus operandi: ridurre BC inomogenee, quale strada scegliere · manuale","steps":[{"t":"Ti trovi un'EDP con condizioni al contorno NON omogenee (es. $u(t,0)=T_1\\neq0$, o flusso imposto, o sorgente). Perche' non puoi sviluppare subito in autofunzioni?","opts":[{"x":"Le autofunzioni (seni/coseni) soddisfano BC omogenee: una loro serie eredita quelle BC e non puo' rappresentare un valore o un flusso non nullo al bordo. Prima si omogeneizza","c":true},{"x":"Puoi sempre sviluppare direttamente, le BC non contano"},{"x":"Perche' le autofunzioni non sono complete"}],"hint":"Che valore/flusso al bordo ha, termine a termine, una serie di soli seni? E di soli coseni?","sol":"Le autofunzioni di Sturm-Liouville sono costruite CON le BC omogenee; ogni loro combinazione le rispetta identicamente. Rappresentare BC inomogenee richiede prima di sottrarre una funzione che le assorba. E' il passo zero, dove si perdono punti se saltato.","cont":"Scelta della strada"},{"t":"Come si sceglie la funzione da sottrarre, a seconda del problema?","opts":[{"x":"Se le BC (e la sorgente) sono costanti nel tempo: sottrai lo STATO STAZIONARIO $u_s(x)$ (risolve $u_s''$=sorgente con le BC date). Se le BC dipendono dal tempo o non c'e' stazionario: usa una FUNZIONE DI RIFERIMENTO $w(x,t)$ che soddisfa solo le BC, e il residuo diventa una sorgente da trattare con DUHAMEL","c":true},{"x":"Si sottrae sempre lo stato stazionario, in ogni caso"},{"x":"Si usa sempre Duhamel, mai lo stazionario"}],"hint":"Stazionario esiste solo se le BC sono costanti e il bilancio globale e' compatibile.","sol":"Due strade: (1) BC costanti $\\Rightarrow$ stato stazionario $u_s$, e il transiente $v=u-u_s$ risolve il problema OMOGENEO; (2) BC dipendenti dal tempo (o stazionario inesistente, es. sorgente con Neumann) $\\Rightarrow$ funzione di riferimento $w(x,t)$ che soddisfa le BC, poi $v=u-w$ prende una sorgente $S=Dw_{xx}-w_t$ da risolvere con Duhamel. La scelta dipende dalla dipendenza temporale delle BC.","cont":"Controllo di esistenza"},{"t":"Prima di cercare lo stazionario, quale controllo di dieci secondi conviene fare?","opts":[{"x":"Verificare la condizione di solvibilita' (bilancio globale): con Neumann puro e sorgente netta non nulla lo stazionario NON esiste (la media cresce), e va usata un'altra strada. E' l'alternativa di Fredholm","c":true},{"x":"Nessun controllo: lo stazionario esiste sempre"},{"x":"Controllare solo che le autofunzioni siano ortogonali"}],"hint":"Integra l'equazione stazionaria su tutto il dominio: il flusso ai bordi deve poter bilanciare la sorgente.","sol":"Integrando $0=Du_s''+S$ su $[0,L]$: $0=D[u_s']_0^L+\\int S$. Con Dirichlet il flusso ai bordi bilancia; con Neumann puro $[u_s']_0^L=0$, quindi serve $\\int S=0$, altrimenti nessuno stazionario (condizione di solvibilita' / alternativa di Fredholm). Riconoscerlo prima evita di cercare una soluzione che non esiste."}]},{"pool":"edp","src":"modus operandi: velocita' di propagazione, calore vs onde · manuale","steps":[{"t":"Un dato iniziale concentrato in un punto: nell'equazione delle ONDE ($\\partial_t^2u=c^2\\partial_x^2u$) e in quella del CALORE ($\\partial_t u=D\\partial_x^2u$), con che velocita' l'informazione raggiunge un punto lontano?","opts":[{"x":"Onde: velocita' FINITA $c$ (il segnale arriva solo dopo $t=$distanza$/c$). Calore: velocita' INFINITA (un punto lontano si scalda, seppur pochissimo, gia' per $t>0$ arbitrariamente piccolo)","c":true},{"x":"Entrambe a velocita' finita $c$"},{"x":"Entrambe a velocita' infinita"}],"hint":"La soluzione fondamentale del calore e' una gaussiana con code su tutta la retta gia' per $t>0$; quella delle onde ha supporto compatto.","sol":"Onde (iperbolica): d'Alembert da' propagazione a velocita' finita $c$, con cono di luce. Calore (parabolica): il nucleo $\\tfrac{1}{\\sqrt{4\\pi Dt}}e^{-x^2/4Dt}$ e' strettamente positivo ovunque per ogni $t>0$: velocita' infinita di propagazione. E' la differenza qualitativa fra i due tipi di EDP.","cont":"Perche'"},{"t":"Da dove nasce questa differenza, e che ruolo ha l'ordine della derivata temporale?","opts":[{"x":"L'equazione delle onde e' del secondo ordine nel tempo e ammette caratteristiche reali $x\\pm ct=$cost (dominio di dipendenza limitato). Il calore e' del primo ordine nel tempo, parabolico, senza caratteristiche reali: nessun cono limita la propagazione","c":true},{"x":"Dipende solo dal valore di $c$ e $D$"},{"x":"Il calore ha caratteristiche reali, le onde no"}],"hint":"Classificazione: iperbolica (caratteristiche reali distinte) vs parabolica (caratteristiche coincidenti).","sol":"Classificazione delle EDP del secondo ordine: le onde sono IPERBOLICHE, con due famiglie di caratteristiche reali $x\\pm ct$; il segnale viaggia lungo di esse, e il dominio di dipendenza di $(x,t)$ e' l'intervallo $[x-ct,x+ct]$. Il calore e' PARABOLICO: caratteristiche degeneri, nessun cono, dominio di dipendenza = tutta la retta. L'ordine in $t$ (2 vs 1) sancisce la differenza.","cont":"Conseguenza fisica"},{"t":"Quale conseguenza fisica/matematica ha la velocita' infinita del calore?","opts":[{"x":"Viola la causalita' relativistica (per questo il calore e' un modello non relativistico) e rende il problema all'indietro nel tempo mal posto: la diffusione cancella informazione (irreversibilita'), l'inversione amplifica gli errori","c":true},{"x":"Rende il problema del calore reversibile nel tempo"},{"x":"Non ha conseguenze, e' solo formale"}],"hint":"Se l'informazione si propaga ovunque istantaneamente e le code si appiattiscono, e' recuperabile il passato?","sol":"La velocita' infinita e' un artefatto non relativistico del modello parabolico. Sul piano matematico la diffusione smorza le alte frequenze ($e^{-D k^2 t}$) distruggendo informazione: il problema INVERSO (ricostruire $u(0,x)$ da $u(T,x)$) e' mal posto, perche' l'inversione richiede $e^{+Dk^2 t}$ che amplifica illimitatamente il rumore. E' l'irreversibilita' della diffusione, opposta alla reversibilita' delle onde."}]}]};

var S = { units:[], ui:0, si:0, correct:0, total:0, answered:false };

/* TRACCIA innestata v2 (quiz_innesta_traccia.py) — il quiz ricorda le risposte E LE CONSEGNA DA SOLO.

   Il quiz vive su GitHub Pages: pagina statica, non puo' scrivere su disco. Fino
   al 3 settembre l'unica uscita era un bottone «esporta» che scaricava un .jsonl,
   e in 35 giorni non e' mai stato cliccato: `02-accademico/esiti/` e' rimasta
   vuota mentre il tracciamento girava. Requisito di Giuseppe, 2 agosto: nessun
   gesto manuale.

   Ora i tentativi vanno da soli alla bocca di Oceano — il ricevitore locale che
   si accende al login — su http://127.0.0.1:8077/atti. Passa da HTTPS a HTTP
   perche' il loopback e' un'origine «potentially trustworthy» e non conta come
   mixed content; verso l'IP di rete locale sarebbe bloccata, ed e' per questo
   che dal telefono la consegna diretta non funziona (li' resta il paracadute).

   La regola che tiene: un record e' CONSEGNATO solo quando il ricevitore lo ha
   confermato (`_c`). Se Oceano e' giu', se il PC e' spento, se e' il telefono:
   niente si perde, si accumula in localStorage, e alla prima apertura utile la
   coda si svuota da sola. Il bottone «esporta» non e' piu' la strada: e' il
   paracadute, e compare solo quando la consegna e' fallita e c'e' arretrato. */
var TRACCIA = (function(){
  var CHIAVE = 'navicella.quiz.attempts.v1';
  var BOCCA  = 'http://127.0.0.1:8077/atti';
  var ATTESA = 4000;            /* si consegna a raffiche, non a ogni click */
  var attivo = true, inVolo = false, ultimoEsito = null, timer = null;
  try { window.localStorage.setItem('__t','1'); window.localStorage.removeItem('__t'); }
  catch(e){ attivo = false; }
  function leggi(){
    if(!attivo) return [];
    try { return JSON.parse(window.localStorage.getItem(CHIAVE)||'[]'); } catch(e){ return []; }
  }
  function scrivi(a){
    if(!attivo) return;
    try { window.localStorage.setItem(CHIAVE, JSON.stringify(a)); } catch(e){}
  }
  /* impronta: la stessa che usa la navicella (atti.py) per riconoscere un
     doppione. Serve a ritrovare i record dopo la consegna, perche' l'array puo'
     essere cresciuto mentre la richiesta era in volo. */
  function impronta(r){ return [r.ts, r.corso, r.pool, r.ui, r.si].join(''); }
  function daConsegnare(a){
    var f = [], i;
    for(i=0;i<a.length;i++){ if(!a[i]._c) f.push(a[i]); }
    return f;
  }
  function registra(rec){
    if(!attivo) return;
    var a = leggi();
    rec.ts = new Date().toISOString();
    rec.corso = (document.title||'').trim();
    a.push(rec);
    if(a.length > 5000) a = a.slice(-5000);
    scrivi(a);
    programma();
  }
  function programma(){
    if(timer) return;
    timer = setTimeout(function(){ timer = null; consegna(); }, ATTESA);
  }
  function consegna(subito){
    if(!attivo || inVolo) return;
    var coda = daConsegnare(leggi());
    if(!coda.length) return;
    var corpo = coda.map(function(r){ return JSON.stringify(r); }).join('\n')+'\n';
    var mandati = {}, i;
    for(i=0;i<coda.length;i++){ mandati[impronta(coda[i])] = 1; }
    inVolo = true;
    /* fetch e non sendBeacon: Chrome, per una richiesta da sito pubblico verso
       la rete privata, pretende un preflight — e il beacon non sa farlo.
       keepalive perche' la chiusura della scheda non tronchi l'ultima raffica
       (non e' garantito quando c'e' un preflight: per questo la raffica e'
       corta, e cio' che non parte parte alla prossima apertura). */
    fetch(BOCCA, {method:'POST', mode:'cors', keepalive:!!subito,
                  headers:{'Content-Type':'text/plain;charset=UTF-8'}, body:corpo})
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(function(esito){
        var a = leggi(), n = 0;
        for(var j=0;j<a.length;j++){
          if(!a[j]._c && mandati[impronta(a[j])]){ a[j]._c = 1; n++; }
        }
        scrivi(a); inVolo = false; ultimoEsito = 'ok';
        annuncia(n, esito && esito.totale);
      })
      .catch(function(){ inVolo = false; ultimoEsito = 'no'; aggiornaBottone(); });
  }
  function esporta(){
    var a = leggi(); if(!a.length) return;
    var jsonl = a.map(function(r){ return JSON.stringify(r); }).join('\n')+'\n';
    var url = URL.createObjectURL(new Blob([jsonl], {type:'application/x-ndjson'}));
    var nome = 'quiz-attempts-'+(document.title||'quiz').replace(/[^A-Za-z0-9]+/g,'-')
             + '-' + new Date().toISOString().slice(0,10) + '.jsonl';
    var el = document.createElement('a');
    el.href = url; el.download = nome; document.body.appendChild(el); el.click();
    document.body.removeChild(el); URL.revokeObjectURL(url);
  }
  function svuota(){
    if(!confirm('Cancellare i tentativi salvati in questo browser?')) return;
    scrivi([]); aggiornaBottone();
  }
  function riquadro(){
    var b = document.getElementById('tracciaBtn');
    if(!b){
      b = document.createElement('div'); b.id='tracciaBtn';
      b.style.cssText='position:fixed;right:14px;bottom:14px;z-index:9999;'
        +'font:600 13px/1.2 system-ui,sans-serif;display:flex;gap:6px;align-items:center;'
        +'padding:8px 12px;border-radius:10px;color:#fff;'
        +'box-shadow:0 2px 10px rgba(0,0,0,.25);opacity:.92';
      document.body.appendChild(b);
    }
    return b;
  }
  /* Consegnato: si dice, non si chiede. Due secondi e mezzo e sparisce — non e'
     un bottone, e' la ricevuta. */
  function annuncia(n, totale){
    var b = document.getElementById('tracciaBtn');
    if(b) b.remove();
    if(!n) return;
    b = riquadro();
    b.style.background = '#14532d'; b.style.cursor = 'default'; b.onclick = null;
    b.textContent = '↑ ' + n + (n===1?' risposta consegnata':' risposte consegnate')
                  + (totale ? ' · ' + totale + ' in archivio' : '');
    setTimeout(function(){ if(b && b.parentNode) b.remove(); }, 2500);
  }
  /* Il paracadute. Compare SOLO se la consegna automatica non passa e c'e'
     arretrato: cosi' un bottone visibile significa sempre qualcosa. */
  function aggiornaBottone(){
    var n = daConsegnare(leggi()).length;
    var b = document.getElementById('tracciaBtn');
    if(!n || ultimoEsito !== 'no'){ if(b) b.remove(); return; }
    b = riquadro();
    b.style.background = '#1f2937'; b.style.cursor = 'pointer';
    b.title = 'La navicella non risponde su ' + BOCCA + ' (Oceano spento, o sei '
            + 'sul telefono). Le risposte sono al sicuro qui nel browser: '
            + 'scaricale e finiranno in archivio al prossimo avvio.';
    b.textContent = '↓ esporta ' + n + ' risposte';
    b.onclick = esporta;
    var x = document.createElement('span'); x.textContent = '×';
    x.style.cssText = 'margin-left:6px;opacity:.6;padding:0 3px'; x.title = 'Svuota';
    x.onclick = function(ev){ ev.stopPropagation(); svuota(); };
    b.appendChild(x);
  }
  var ultimoGiusto = 0, ultimoVisto = null;
  /* famiglia "meccanica": un solo aggancio, l'esito dalla variazione di correctCount */
  function daStato(st, q){
    if(!st) return;
    var chiave = (q && (q._pool||'?')) + '::' + st.idx;
    if(chiave === ultimoVisto) return;              // gia' registrato questo passo
    ultimoVisto = chiave;
    var giusto = (st.correctCount||0) > ultimoGiusto;
    ultimoGiusto = st.correctCount||0;
    registra({ pool: (q && q._pool) || null, ui: st.idx, si: 0,
               esito: giusto, primo: true, tipo: (q && q.type) || null });
  }
  /* I tre momenti in cui si prova a consegnare, oltre alla raffica: all'apertura
     (svuota l'arretrato di ieri e del telefono, se e' lo stesso browser), quando
     la pagina passa in secondo piano, e quando se ne va. */
  try {
    if(document.readyState === 'loading')
      document.addEventListener('DOMContentLoaded', function(){ consegna(); });
    else setTimeout(function(){ consegna(); }, 600);
    document.addEventListener('visibilitychange', function(){
      if(document.visibilityState === 'hidden') consegna(true);
    });
    window.addEventListener('pagehide', function(){ consegna(true); });
  } catch(e){}
  return { registra:registra, esporta:esporta, daStato:daStato, consegna:consegna,
           conta:function(){ return leggi().length; },
           inSospeso:function(){ return daConsegnare(leggi()).length; },
           aggiorna:aggiornaBottone };
})();

function poolCount(id){ return (Q[id]||[]).reduce(function(n,u){return n+u.steps.length;},0); }

function renderMenu(){
  var g = document.getElementById('poolGrid');
  g.innerHTML = '';
  POOLS.forEach(function(p){
    var units = Q[p.id]||[];
    var n = poolCount(p.id);
    var empty = units.length===0;
    var card = document.createElement(empty?'div':'button');
    card.className = 'pool-card'+(empty?' empty':'');
    if(!empty) card.onclick = function(){ start(p.id); };
    card.innerHTML =
      '<div class="n">'+p.name+'</div>'+
      '<div class="meta">Difficolt&agrave; '+p.diff+' &middot; '+(empty?'0 domande':(n+' passi')) +'</div>'+
      '<span class="badge '+(p.status==='full'?'full':'todo')+'">'+
        (p.status==='full'?'COMPLETO':'DA ESTENDERE')+'</span>';
    g.appendChild(card);
  });
  typeset(g);
}

function start(poolId){
  var units = [];
  if(poolId==='ALL'){
    POOLS.forEach(function(p){ (Q[p.id]||[]).forEach(function(u){ units.push(u); }); });
  } else {
    units = (Q[poolId]||[]).slice();
  }
  if(units.length===0) return;
  units = shuffle(units.slice());
  S = { units:units, ui:0, si:0, correct:0, total:0, answered:false, poolId:poolId };
  show('quiz');
  renderStep();
}

function poolNameById(id){
  for(var i=0;i<POOLS.length;i++) if(POOLS[i].id===id) return POOLS[i].name;
  return id;
}

function renderStep(){
  var u = S.units[S.ui];
  var st = u.steps[S.si];
  S.answered = false;

  document.getElementById('qpool').innerHTML =
    (S.poolId==='ALL'?'Mischia':poolNameById(S.poolId));
  document.getElementById('qpos').innerHTML =
    'Domanda '+(S.ui+1)+' / '+S.units.length+
    (u.steps.length>1?(' &middot; parte '+(S.si+1)+'/'+u.steps.length):'')+
    ' &middot; <span class="src">'+u.src+'</span>';
  document.getElementById('qbar').style.width = (100*(S.ui)/S.units.length)+'%';

  var fig = document.getElementById('qfig');
  var svg = st.svg || (S.si===0 ? u.svg : null);
  if(svg){ fig.innerHTML = svg; fig.classList.remove('hidden'); typeset(fig); }
  else { fig.innerHTML=''; fig.classList.add('hidden'); }

  var qt = document.getElementById('qtext');
  qt.innerHTML = st.t;
  typeset(qt);

  var opts = shuffle(st.opts.map(function(o){return o;}));
  var box = document.getElementById('qopts');
  box.innerHTML = '';
  opts.forEach(function(o){
    var b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = o.x;
    b.onclick = function(){ answer(b, o, st); };
    box.appendChild(b);
  });
  typeset(box);

  document.getElementById('qhint').classList.remove('show');
  document.getElementById('qsol').classList.remove('show');
  document.getElementById('qcont').classList.add('hidden');
}

function answer(btn, opt, st){
  /* Accensione: ogni click e' un dato. `primo` distingue il primo tentativo sul
     passo (il segnale che conta per un contatore stile PFA) dai ritentativi. */
  TRACCIA.registra({ pool: S.poolId, ui: S.ui, si: S.si,
                     esito: !!opt.c, primo: !S.answered,
                     hint: document.getElementById('qhint').classList.contains('show') });
  if(opt.c){
    btn.classList.add('correct');
    Array.prototype.forEach.call(document.querySelectorAll('#qopts .opt'),
      function(b){ b.disabled = true; });
    document.getElementById('qhint').classList.remove('show');
    var sol = document.getElementById('qsol');
    sol.innerHTML = '<b>Corretto.</b> '+st.sol;
    sol.classList.add('show');
    typeset(sol);
    if(!S.answered){ S.correct++; }
    S.answered = true;
    var c = document.getElementById('qcont');
    var last = (S.si === S.units[S.ui].steps.length-1);
    c.innerHTML = last ? 'Prossima domanda &rarr;' : (st.cont || 'Continua &rarr;');
    c.classList.remove('hidden');
    c.onclick = nextStep;
  } else {
    btn.classList.add('wrong');
    btn.disabled = true;
    var h = document.getElementById('qhint');
    h.innerHTML = '<b>Rivedi.</b> '+st.hint;
    h.classList.add('show');
    typeset(h);
  }
}

function nextStep(){
  var u = S.units[S.ui];
  S.total++;
  if(S.si < u.steps.length-1){
    S.si++;
    renderStep();
  } else {
    S.ui++;
    S.si = 0;
    if(S.ui >= S.units.length){ endQuiz(); }
    else renderStep();
  }
}

function endQuiz(){
  show('end');
  document.getElementById('endScore').innerHTML = S.correct+' / '+S.total;
  var pct = S.total? Math.round(100*S.correct/S.total):0;
  var msg = pct>=85 ? 'Livello d&rsquo;esame solido.' :
            pct>=60 ? 'Buona base, ma alcuni trabocchetti ti hanno preso.' :
                      'Rivedi i suggerimenti: gli errori sono concettuali, non di calcolo.';
  document.getElementById('endMsg').innerHTML = 'Risposte corrette al primo tentativo. '+msg;
}

function toMenu(){ show('menu'); }

function show(which){
  ['menu','quiz','end'].forEach(function(id){
    document.getElementById(id).classList.toggle('hidden', id!==which);
  });
  window.scrollTo(0,0);
}

window.addEventListener('DOMContentLoaded', renderMenu);
</script>
