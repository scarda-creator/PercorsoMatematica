nza</em>: ogni $u(T,\\cdot)$ raggiungibile &egrave; necessariamente $C^\\infty$ (anzi analitica), perch&eacute; il calore regolarizza istantaneamente; un dato con una cuspide non appartiene all'immagine dell'evoluzione e non ha alcuna preimmagine","c":true},{"x":"Nulla di nuovo: l'esistenza &egrave; garantita, la soluzione sar&agrave; solo molto irregolare"},{"x":"Si perde l'unicit&agrave;, perch&eacute; una cuspide pu&ograve; provenire da pi&ugrave; dati iniziali diversi"},{"x":"Si perde la linearit&agrave; della mappa inversa"}],"hint":"Chiediti quali funzioni possono comparire come $u(T,\\cdot)$ per <em>qualche</em> dato iniziale: l'evoluzione in avanti ha un'immagine molto piccola.","sol":"Per ogni $t>0$ i coefficienti di $u(t,\\cdot)$ decadono come $e^{-Dn^2t}$ moltiplicato per i $b_n$ iniziali, che sono al pi&ugrave; limitati se il dato &egrave; in $L^2$: dunque decadono <em>pi&ugrave; rapidamente di ogni potenza</em>, il che equivale a dire che $u(t,\\cdot)$ &egrave; $C^\\infty$ (di fatto analitica). Il calore &egrave; un operatore fortemente regolarizzante e la sua immagine, a tempo $T>0$ fissato, &egrave; uno spazio molto piccolo di funzioni ultra-lisce. Una funzione con una cuspide non ci appartiene: non esiste alcun $u(0,\\cdot)$ in $L^2$ che a tempo $T$ produca quel profilo, e il problema all'indietro non ha proprio soluzione — non &egrave; una questione di stabilit&agrave;, &egrave; l'esistenza a cadere. Vale la pena tenere allineati i tre casi visti: il problema di Cauchy per Laplace perde la dipendenza continua (controesempio di Hadamard con $\\frac1n\\sin(nx)$); il calore all'indietro perde la dipendenza continua <em>e</em> l'esistenza; il calore in avanti e le onde in avanti o all'indietro sono ben posti. La tassonomia parabolico/iperbolico/ellittico dice quale problema &egrave; ben posto per quale equazione, ed &egrave; la vera domanda dietro ogni esercizio d'esame che chieda 'discutere la buona posizione'."}]},{"pool":"edp","src":"20250120 Es.4 · spettro di A=d^2/dx^2+2 con f(0)=f(1)=0","steps":[{"t":"L'esercizio chiede lo spettro dell'operatore $A=\\frac{d^2}{dx^2}+2$ sul dominio delle $f\\in C^2$ con $f(0)=f(1)=0$. Prima di calcolare: che tipo di problema &egrave; e quale dato ne determina lo spettro?","opts":[{"x":"Problema agli autovalori di Sturm-Liouville: le condizioni al bordo $f(0)=f(1)=0$ (Dirichlet) selezionano gli autovalori ammessi; la ODE da sola ne ha un continuo.","c":true},{"x":"Problema di Cauchy: il dato iniziale $f(0)=0$ fissa univocamente la soluzione, e lo spettro &egrave; tutto $\\mathbb{R}$."},{"x":"Problema di Green: si costruisce $G(x,y)$ e lo spettro sono i poli di $G$ lungo l'asse reale."}],"hint":"Non c'&egrave; una variabile temporale: &egrave; l'operatore spaziale che vive dentro la separazione. Che ruolo hanno DUE condizioni al bordo su un problema del secondo ordine?","sol":"&Egrave; un problema agli autovalori di Sturm-Liouville regolare. L'equazione $Af=\\lambda f$ &egrave; $f''+(2-\\lambda)f=0$, una ODE lineare del second'ordine: la sua soluzione generale ha due costanti. Le DUE condizioni al bordo di Dirichlet $f(0)=f(1)=0$ impongono un sistema omogeneo su queste costanti; lo spettro &egrave; l'insieme dei $\\lambda$ per cui il sistema ammette soluzione non banale. &Egrave; esattamente il problema spettrale che compare separando le variabili in una PDE su $[0,1]$.","cont":"Imposto la ODE"},{"t":"Scrivo $Af=\\lambda f$, cio&egrave; $f''+(2-\\lambda)f=0$. Perch&eacute; la scelta corretta &egrave; cercare soluzioni $f(x)=e^{\\alpha x}$, e quale equazione soddisfa $\\alpha$?","opts":[{"x":"Perch&eacute; l'equazione &egrave; lineare a coefficienti costanti: l'ansatz $e^{\\alpha x}$ la trasforma in $\\alpha^2+(2-\\lambda)=0$, cio&egrave; $\\alpha=\\pm\\sqrt{\\lambda-2}$.","c":true},{"x":"Perch&eacute; ogni ODE del secondo ordine ha soluzioni polinomiali: $\\alpha$ &egrave; il grado del polinomio."},{"x":"Perch&eacute; le condizioni di Dirichlet impongono soluzioni $e^{\\alpha x}$ con $\\alpha$ immaginario puro gi&agrave; a priori."}],"hint":"Coefficienti costanti: l'ansatz esponenziale &egrave; quello che diagonalizza $\\frac{d^2}{dx^2}$.","sol":"Con coefficienti costanti, $e^{\\alpha x}$ &egrave; autofunzione di $\\frac{d^2}{dx^2}$: sostituendo si ottiene l'equazione caratteristica $\\alpha^2+(2-\\lambda)=0$, quindi $\\alpha_\\pm=\\pm\\sqrt{\\lambda-2}$. Non si assume a priori che $\\alpha$ sia immaginario: &egrave; il segno di $\\lambda-2$ a deciderlo, ed &egrave; il punto del prossimo passo.","cont":"Discuto il segno"},{"t":"Punto in cui si perdono i punti: perch&eacute; gli autovalori dello spettro discreto stanno solo dove $\\lambda<2$, e cosa succederebbe se cercassimo autofunzioni con $\\lambda>2$?","opts":[{"x":"Se $\\lambda>2$, $\\alpha$ &egrave; reale e $f$ &egrave; combinazione di esponenziali reali (seni iperbolici): le uniche che si annullano in $0$ e $1$ sono la banale $f\\equiv0$. Solo $\\lambda<2$ d&agrave; $\\alpha$ immaginario e soluzioni oscillanti che possono annullarsi due volte.","c":true},{"x":"Se $\\lambda>2$ le soluzioni divergono all'infinito, ma su $[0,1]$ va bene lo stesso: si ottengono altri autovalori sopra $2$."},{"x":"Non c'&egrave; differenza: seno e seno iperbolico si annullano entrambi in due punti, quindi lo spettro copre tutti i $\\lambda\\in\\mathbb{R}$."}],"hint":"$\\sinh$ si annulla una volta sola (nell'origine); $\\sin$ si annulla infinite volte. Quante volte serve annullarsi qui?","sol":"Per $\\lambda>2$, $\\alpha=\\pm\\sqrt{\\lambda-2}$ &egrave; reale: $f(x)=A\\sinh(\\sqrt{\\lambda-2}\\,x)+B\\cosh(\\sqrt{\\lambda-2}\\,x)$. La $f(0)=0$ d&agrave; $B=0$, e $f(1)=A\\sinh(\\sqrt{\\lambda-2})=0$ forza $A=0$ perch&eacute; $\\sinh$ non ha zeri fuori dall'origine. Resta solo $f\\equiv0$, che non &egrave; autofunzione. Serve $\\lambda<2$: allora $\\alpha=\\pm i\\sqrt{2-\\lambda}$ e $f$ &egrave; oscillante, capace di annullarsi in due punti distinti. &Egrave; la positivit&agrave; dell'operatore $-\\frac{d^2}{dx^2}$ con Dirichlet a garantire che gli autovalori stiano da un lato.","cont":"Applico le BC"},{"t":"Impongo le condizioni al bordo alla soluzione oscillante $f(x)=A_+e^{\\sqrt{\\lambda-2}\\,x}+A_-e^{-\\sqrt{\\lambda-2}\\,x}$. Cosa danno $f(0)=0$ e $f(1)=0$?","opts":[{"x":"$f(0)=0\\Rightarrow A_-=-A_+$; poi $f(1)=0\\Rightarrow e^{2\\sqrt{\\lambda-2}}=1$, cio&egrave; $2\\sqrt{\\lambda-2}=2\\pi n i$, da cui $\\lambda_n=2-n^2\\pi^2$.","c":true},{"x":"$f(0)=0\\Rightarrow A_+=A_-$; poi $f(1)=0\\Rightarrow \\cos\\sqrt{2-\\lambda}=0$, da cui $\\lambda_n=2-\\big(n+\\tfrac12\\big)^2\\pi^2$."},{"x":"$f(0)=0$ e $f(1)=0$ danno direttamente $\\lambda_n=n^2\\pi^2$, come per il pozzo infinito standard."}],"hint":"Attenzione: qui c'&egrave; il $+2$. La quantizzazione riguarda $\\sqrt{\\lambda-2}$, non $\\sqrt{\\lambda}$. Il distrattore col $n+\\frac12$ &egrave; il caso Neumann/misto, non Dirichlet-Dirichlet.","sol":"$f(0)=0$ d&agrave; $A_++A_-=0$, cio&egrave; $A_-=-A_+$, quindi $f(x)=A_+\\big(e^{\\sqrt{\\lambda-2}x}-e^{-\\sqrt{\\lambda-2}x}\\big)$. La $f(1)=0$ d&agrave; $A_+\\big(e^{\\sqrt{\\lambda-2}}-e^{-\\sqrt{\\lambda-2}}\\big)=0$, ossia $e^{2\\sqrt{\\lambda-2}}=1$. Le soluzioni sono $2\\sqrt{\\lambda-2}=2\\pi n i$, da cui $\\sqrt{\\lambda-2}=\\pi n i$ e $\\lambda_n=2-n^2\\pi^2$. Le autofunzioni sono $\\sin(n\\pi x)$. Il $+2$ dell'operatore trasla lo spettro: senza di esso avremmo $-n^2\\pi^2$.","cont":"Il caso critico $n=0$"},{"t":"Il passo che salva l'esercizio: cosa succede a $n=0$ (cio&egrave; $\\lambda=2$) e perch&eacute; va trattato a parte?","opts":[{"x":"A $\\lambda=2$ le due radici coincidono ($\\alpha_+=\\alpha_-=0$): la soluzione generale diventa $f(x)=A+Bx$. Le BC $f(0)=f(1)=0$ danno $A=B=0$: l'autofunzione &egrave; nulla, quindi $\\lambda=2$ NON appartiene allo spettro.","c":true},{"x":"A $\\lambda=2$ si ottiene l'autofunzione costante $f\\equiv1$, che soddisfa le BC: $\\lambda=2$ &egrave; l'autovalore fondamentale."},{"x":"$n=0$ non richiede trattamento speciale: $\\sin(0\\cdot\\pi x)=0$ &egrave; gi&agrave; l'autofunzione, con autovalore $\\lambda=2$."}],"hint":"Quando l'equazione caratteristica ha una radice doppia, la seconda soluzione indipendente non &egrave; un altro esponenziale. E un'autofunzione identicamente nulla non &egrave; un'autofunzione.","sol":"A $\\lambda=2$ l'equazione diventa $f''=0$, radice doppia $\\alpha=0$: la soluzione generale &egrave; $f(x)=A+Bx$ (non due esponenziali distinti). Le condizioni $f(0)=0\\Rightarrow A=0$ e $f(1)=0\\Rightarrow B=0$ lasciano solo $f\\equiv0$. Per definizione un'autofunzione dev'essere non nulla, quindi $\\lambda=2$ &egrave; escluso. &Egrave; il tipico punto in cui uno mette un autovalore di troppo nello spettro. Nota anche che $\\sin(0\\cdot\\pi x)\\equiv0$: coerente col fatto che $n=0$ non produce autofunzione.","cont":"Scrivo lo spettro"},{"t":"Conclusione e verifica. Qual &egrave; lo spettro completo e perch&eacute; l'indice va preso in $\\mathbb{Z}\\setminus\\{0\\}$ e non semplicemente in $\\mathbb{N}$?","opts":[{"x":"$\\lambda_n=2-n^2\\pi^2$ con $n\\in\\mathbb{Z}\\setminus\\{0\\}$. Poich&eacute; $\\lambda_n$ dipende solo da $n^2$, $n$ e $-n$ danno lo stesso autovalore e la stessa autofunzione $\\sin(n\\pi x)$ (a meno del segno): lo spettro &egrave; non degenere e si pu&ograve; equivalentemente indicizzare con $n\\in\\mathbb{N}^+$.","c":true},{"x":"$\\lambda_n=2-n^2\\pi^2$ con $n\\in\\mathbb{Z}$: anche $n=0$ va incluso perch&eacute; lo spettro dev'essere simmetrico."},{"x":"$\\lambda_n=2+n^2\\pi^2$ con $n\\in\\mathbb{N}$: gli autovalori crescono con $n$ come per ogni operatore differenziale positivo."}],"hint":"$\\sin(-n\\pi x)=-\\sin(n\\pi x)$ genera lo stesso sottospazio: $n$ e $-n$ non sono modi indipendenti.","sol":"Lo spettro &egrave; $\\lambda_n=2-n^2\\pi^2$, $n\\in\\mathbb{Z}\\setminus\\{0\\}$, con autofunzioni $\\sin(n\\pi x)$. Poich&eacute; $\\lambda_n=\\lambda_{-n}$ e $\\sin(-n\\pi x)=-\\sin(n\\pi x)$ spanna lo stesso raggio, ogni autovalore &egrave; semplice: la scrittura con $\\mathbb{Z}\\setminus\\{0\\}$ (della stampa ufficiale) e quella con $\\mathbb{N}^+$ sono equivalenti. Verifica di consistenza: gli autovalori vanno a $-\\infty$, coerente col fatto che $-\\frac{d^2}{dx^2}$ &egrave; positivo e il $+2$ &egrave; solo uno shift finito; le autofunzioni $\\{\\sin(n\\pi x)\\}$ sono ortogonali e complete in $L^2[0,1]$ (Sturm-Liouville regolare, operatore auto-aggiunto).","cont":""}]},{"pool":"edp","src":"Duhamel per il calore con sorgente dipendente dal tempo · manuale","steps":[{"t":"Si risolve $\\partial_t u=D\\,\\partial_x^2 u+S(t,x)$ su $[0,L]$ con $u(t,0)=u(t,L)=0$ e $u(0,x)=0$. Che tipo di problema &egrave; e qual &egrave; la strategia corretta di attacco?","opts":[{"x":"PDE parabolica NON omogenea con BC omogenee: si sviluppa $u$ (e la sorgente) sulla base di autofunzioni del problema omogeneo e si ottiene, per ogni modo, una ODE ordinaria non omogenea.","c":true},{"x":"PDE omogenea: la sorgente $S$ si assorbe in un cambio di variabile $u\\to u+S$, poi si separano le variabili."},{"x":"Si applica direttamente la separazione $u(t,x)=T(t)X(x)$: la sorgente $S(t,x)$ si fattorizza automaticamente in $T$ e $X$."}],"hint":"La separazione pura $u=T(t)X(x)$ funziona per l'equazione OMOGENEA. Con una sorgente generica non fattorizzabile serve un'altra idea: proiettare tutto sui modi.","sol":"&Egrave; una PDE parabolica non omogenea con condizioni di Dirichlet omogenee. La strategia &egrave; l'espansione in autofunzioni (eigenfunction expansion / metodo di Duhamel per serie): si prendono le autofunzioni $\\varphi_n(x)=\\sin\\!\\big(\\tfrac{n\\pi x}{L}\\big)$ del problema omogeneo con quelle BC e si scrive sia $u$ sia $S$ come combinazione di esse. La separazione $u=T(t)X(x)$ da sola vale solo per l'equazione omogenea; qui la sorgente non si fattorizza e va proiettata modo per modo.","cont":"Perch&eacute; questa base"},{"t":"Perch&eacute; &egrave; lecito sviluppare qualunque dato su $\\{\\sin(n\\pi x/L)\\}$, e quale propriet&agrave; dell'operatore lo garantisce?","opts":[{"x":"Perch&eacute; $-D\\,\\partial_x^2$ con BC di Dirichlet omogenee &egrave; un operatore di Sturm-Liouville auto-aggiunto: il teorema spettrale garantisce che le sue autofunzioni formano una base ortogonale completa di $L^2[0,L]$.","c":true},{"x":"Perch&eacute; i seni sono periodici, e ogni funzione su un intervallo &egrave; periodica."},{"x":"Perch&eacute; la sorgente $S$ &egrave; per ipotesi gi&agrave; una combinazione finita di seni."}],"hint":"La completezza non viene dalla periodicit&agrave;: viene dall'auto-aggiuntezza dell'operatore spaziale con quelle condizioni al bordo.","sol":"L'operatore $\\mathcal{L}=-D\\,\\partial_x^2$ ristretto alle funzioni con $u(0)=u(L)=0$ &egrave; auto-aggiunto (problema di Sturm-Liouville regolare). Per il teorema spettrale per operatori auto-aggiunti, le autofunzioni $\\varphi_n(x)=\\sin(n\\pi x/L)$ formano una base ortogonale completa di $L^2[0,L]$. &Egrave; questa completezza — non la periodicit&agrave; — a permettere di sviluppare qualunque $u(t,\\cdot)$ e $S(t,\\cdot)$ in serie di seni: senza auto-aggiuntezza non avremmo garanzia n&eacute; di ortogonalit&agrave; n&eacute; di completezza.","cont":"Proietto l'equazione"},{"t":"Scrivo $u(t,x)=\\sum_n u_n(t)\\sin\\frac{n\\pi x}{L}$ e $S(t,x)=\\sum_n s_n(t)\\sin\\frac{n\\pi x}{L}$. Qual &egrave; il coefficiente $s_n(t)$ e quale ODE soddisfa $u_n(t)$?","opts":[{"x":"$s_n(t)=\\frac{2}{L}\\int_0^L S(t,x)\\sin\\frac{n\\pi x}{L}\\,dx$; sostituendo si ottiene $\\dot u_n+D\\big(\\frac{n\\pi}{L}\\big)^2 u_n=s_n(t)$, con $u_n(0)=0$.","c":true},{"x":"$s_n(t)=\\int_0^L S(t,x)\\sin\\frac{n\\pi x}{L}\\,dx$ (senza il $2/L$); la ODE &egrave; $\\dot u_n+D\\frac{n\\pi}{L}u_n=s_n$."},{"x":"$s_n(t)=\\frac{2}{L}\\int_0^L S(t,x)\\sin\\frac{n\\pi x}{L}\\,dx$; la ODE &egrave; del secondo ordine $\\ddot u_n+D\\big(\\frac{n\\pi}{L}\\big)^2 u_n=s_n$."}],"hint":"Trabocchetto doppio: il fattore di normalizzazione dei coefficienti di Fourier di seno su $[0,L]$ &egrave; $2/L$; e $\\partial_x^2\\sin(n\\pi x/L)=-(n\\pi/L)^2\\sin$, non $-(n\\pi/L)$.","sol":"L'ortonormalizzazione $\\int_0^L\\sin\\frac{n\\pi x}{L}\\sin\\frac{m\\pi x}{L}dx=\\frac{L}{2}\\delta_{nm}$ d&agrave; $s_n(t)=\\frac{2}{L}\\int_0^L S(t,x)\\sin\\frac{n\\pi x}{L}dx$ (il fattore $2/L$ &egrave; obbligatorio: dimenticarlo &egrave; l'errore classico). Applicando $\\partial_x^2$ al modo si abbassa $-(n\\pi/L)^2$; proiettando l'equazione sul modo $n$ si ottiene la ODE del PRIM'ordine $\\dot u_n+D\\big(\\frac{n\\pi}{L}\\big)^2 u_n=s_n(t)$ con $u_n(0)=0$ (il dato iniziale nullo). &Egrave; del prim'ordine perch&eacute; il calore ha una sola derivata temporale.","cont":"Risolvo la ODE del modo"},{"t":"Risolvo $\\dot u_n+\\omega_n^2 u_n=s_n(t)$ con $\\omega_n^2=D(n\\pi/L)^2$ e $u_n(0)=0$. Con quale metodo e qual &egrave; la soluzione?","opts":[{"x":"Fattore integrante $e^{\\omega_n^2 t}$: $\\frac{d}{dt}\\big(e^{\\omega_n^2 t}u_n\\big)=e^{\\omega_n^2 t}s_n(t)$, da cui $u_n(t)=\\int_0^t e^{-\\omega_n^2(t-\\tau)}s_n(\\tau)\\,d\\tau$.","c":true},{"x":"Separazione di variabili nella ODE: $u_n(t)=u_n(0)e^{-\\omega_n^2 t}=0$, quindi la sorgente non contribuisce."},{"x":"Trasformata di Laplace con polo in $\\omega_n^2$: $u_n(t)=s_n(t)/\\omega_n^2$, indipendente da $\\tau$."}],"hint":"ODE lineare del prim'ordine non omogenea: il metodo canonico &egrave; il fattore integrante, che produce una convoluzione col nucleo $e^{-\\omega_n^2(t-\\tau)}$.","sol":"Con il fattore integrante $e^{\\omega_n^2 t}$ l'equazione diventa $\\frac{d}{dt}\\big(e^{\\omega_n^2 t}u_n\\big)=e^{\\omega_n^2 t}s_n(t)$; integrando da $0$ a $t$ e usando $u_n(0)=0$ si ottiene la formula di Duhamel per il modo: $u_n(t)=\\int_0^t e^{-\\omega_n^2(t-\\tau)}\\,s_n(\\tau)\\,d\\tau$. La risposta del modo al tempo $t$ &egrave; la sovrapposizione pesata di tutte le sorgenti passate $\\tau<t$, ciascuna smorzata dal tempo trascorso $t-\\tau$: &egrave; il principio di Duhamel.","cont":"Ricompongo e verifico"},{"t":"Scrivo la soluzione completa e la verifico. Qual &egrave; $u(t,x)$ e quale controllo conferma che risolve il problema, dato iniziale incluso?","opts":[{"x":"$u(t,x)=\\sum_n\\Big(\\int_0^t e^{-D(n\\pi/L)^2(t-\\tau)}s_n(\\tau)d\\tau\\Big)\\sin\\frac{n\\pi x}{L}$. A $t=0$ ogni integrale &egrave; nullo (estremi coincidenti) $\\Rightarrow u(0,x)=0$; ogni modo &egrave; un seno $\\Rightarrow$ BC di Dirichlet soddisfatte; il termine forzante ricostruisce $S$.","c":true},{"x":"$u(t,x)=\\sum_n s_n(t)e^{-D(n\\pi/L)^2 t}\\sin\\frac{n\\pi x}{L}$: si verifica che a $t=0$ vale $u(0,x)=S(0,x)$."},{"x":"$u(t,x)=\\sum_n\\big(\\int_0^t s_n\\,d\\tau\\big)\\sin\\frac{n\\pi x}{L}$: le BC sono soddisfatte ma il dato iniziale &egrave; $u(0,x)=S(0,x)$."}],"hint":"Due controlli che costano dieci secondi: metti $t=0$ (deve dare il dato iniziale) e $x=0,L$ (devono dare le BC). Il primo funziona perch&eacute; l'integrale ha estremi coincidenti.","sol":"$u(t,x)=\\sum_n\\Big(\\int_0^t e^{-D(n\\pi/L)^2(t-\\tau)}s_n(\\tau)\\,d\\tau\\Big)\\sin\\frac{n\\pi x}{L}$. Verifica: a $t=0$ ogni $\\int_0^0=0$, dunque $u(0,x)=0$ come richiesto; ogni addendo &egrave; $\\propto\\sin(n\\pi x/L)$, che si annulla in $x=0$ e $x=L$, dunque le BC di Dirichlet valgono termine a termine; sostituendo nella PDE, $\\dot u_n+\\omega_n^2 u_n=s_n$ per costruzione ricostruisce $S(t,x)=\\sum_n s_n(t)\\sin\\frac{n\\pi x}{L}$. Il distrattore col solo $e^{-\\omega_n^2 t}$ risolve l'equazione OMOGENEA, non ha il termine di sorgente.","cont":""}]},{"pool":"edp","src":"Calore con BC non omogenee ridotte alla soluzione stazionaria · manuale","steps":[{"t":"Si risolve $\\partial_t u=D\\,\\partial_x^2 u$ su $[0,L]$ con $u(t,0)=T_1$, $u(t,L)=T_2$ (costanti, non entrambe nulle) e $u(0,x)=g(x)$. Perch&eacute; NON si pu&ograve; separare direttamente, e qual &egrave; il primo passo corretto?","opts":[{"x":"Perch&eacute; la separazione richiede BC lineari OMOGENEE (un modo $\\sin$ non pu&ograve; valere $T_1\\neq0$ al bordo): prima si sottrae una soluzione stazionaria $u_s(x)$ che assorbe le BC non omogenee.","c":true},{"x":"Perch&eacute; il dato iniziale $g(x)$ non &egrave; un seno; si sviluppa prima $g$ in serie di Fourier e poi si separa."},{"x":"Perch&eacute; $D$ dipende dalla temperatura al bordo; si adimensionalizza prima l'equazione."}],"hint":"Se $u(t,0)=T_1\\neq0$, nessuna somma di $\\sin(n\\pi x/L)$ (che valgono $0$ in $x=0$) pu&ograve; soddisfare la condizione. Il problema &egrave; il bordo, non il dato iniziale.","sol":"La separazione a variabili genera modi $\\sin(n\\pi x/L)$ che si annullano al bordo: la loro sovrapposizione soddisfa solo BC omogenee. Con $u(t,0)=T_1\\neq0$ nessuna combinazione di questi modi pu&ograve; funzionare. Il primo passo &egrave; cercare la soluzione stazionaria $u_s(x)$ (indipendente da $t$) che porta le BC non omogenee, e poi studiare la deviazione $w=u-u_s$, che avr&agrave; BC omogenee. &Egrave; il metodo di riduzione a BC omogenee.","cont":"Trovo la stazionaria"},{"t":"Cerco $u_s(x)$ stazionaria: $\\partial_t u_s=0\\Rightarrow D\\,u_s''=0$, con $u_s(0)=T_1$, $u_s(L)=T_2$. Quanto vale?","opts":[{"x":"$u_s''=0\\Rightarrow u_s$ lineare: $u_s(x)=T_1+\\frac{T_2-T_1}{L}\\,x$.","c":true},{"x":"$u_s(x)=T_1\\cos\\frac{\\pi x}{L}+T_2\\sin\\frac{\\pi x}{L}$, la combinazione dei modi fondamentali."},{"x":"$u_s(x)=\\frac{T_1+T_2}{2}$, la media delle temperature al bordo."}],"hint":"$u_s''=0$ ha soluzione generale $a+bx$: due costanti, due condizioni al bordo.","sol":"L'equazione stazionaria &egrave; $u_s''=0$, la cui soluzione generale &egrave; la retta $u_s(x)=a+bx$. Imponendo $u_s(0)=T_1$ si ha $a=T_1$; imponendo $u_s(L)=T_2$ si ha $b=(T_2-T_1)/L$. Quindi $u_s(x)=T_1+\\frac{T_2-T_1}{L}x$: il profilo lineare di temperatura, esatta soluzione stazionaria del calore con estremi a temperatura fissa.","cont":"Definisco la deviazione"},{"t":"Pongo $w(t,x)=u(t,x)-u_s(x)$. Quale problema soddisfa $w$?","opts":[{"x":"$\\partial_t w=D\\,\\partial_x^2 w$ (perch&eacute; $u_s$ risolve l'omogenea stazionaria) con BC OMOGENEE $w(t,0)=w(t,L)=0$ e dato iniziale $w(0,x)=g(x)-u_s(x)$.","c":true},{"x":"$\\partial_t w=D\\,\\partial_x^2 w+u_s''(x)$ con $w(t,0)=T_1$, $w(t,L)=T_2$ e $w(0,x)=g(x)$."},{"x":"$\\partial_t w=D\\,\\partial_x^2 w$ con $w(0,x)=g(x)$ e le stesse BC non omogenee di $u$."}],"hint":"$u_s$ non dipende dal tempo e ha $u_s''=0$: sottraendola, l'equazione resta la stessa e le BC si azzerano. Il prezzo si sposta tutto sul dato iniziale.","sol":"Sostituendo $u=w+u_s$: $\\partial_t w=D\\,\\partial_x^2 w+D\\,u_s''=D\\,\\partial_x^2 w$ perch&eacute; $u_s''=0$. Al bordo $w(t,0)=u(t,0)-u_s(0)=T_1-T_1=0$ e analogamente $w(t,L)=0$: BC omogenee. Il dato iniziale diventa $w(0,x)=g(x)-u_s(x)$. La non omogeneit&agrave; del bordo &egrave; stata trasferita, tramite $u_s$, nel dato iniziale — dove &egrave; innocua.","cont":"Risolvo $w$ per separazione"},{"t":"Ora $w$ ha BC di Dirichlet omogenee: separo. Qual &egrave; $w(t,x)$ e come si determinano i coefficienti?","opts":[{"x":"$w(t,x)=\\sum_{n\\ge1} b_n e^{-D(n\\pi/L)^2 t}\\sin\\frac{n\\pi x}{L}$, con $b_n=\\frac{2}{L}\\int_0^L\\big(g(x)-u_s(x)\\big)\\sin\\frac{n\\pi x}{L}\\,dx$.","c":true},{"x":"$w(t,x)=\\sum_n b_n e^{-D(n\\pi/L)^2 t}\\sin\\frac{n\\pi x}{L}$ con $b_n=\\frac{2}{L}\\int_0^L g(x)\\sin\\frac{n\\pi x}{L}dx$ (il dato originale, non corretto)."},{"x":"$w(t,x)=\\sum_n b_n e^{-D(n\\pi/L)t}\\sin\\frac{n\\pi x}{L}$ con $b_n=\\int_0^L(g-u_s)\\sin\\frac{n\\pi x}{L}dx$."}],"hint":"I coefficienti vanno presi sul dato iniziale DI $w$, cio&egrave; $g-u_s$, non su $g$. E l'esponente di decadimento &egrave; $-(n\\pi/L)^2$, con il quadrato.","sol":"Separando, ogni modo di Dirichlet ha fattore temporale $e^{-D(n\\pi/L)^2 t}$, quindi $w(t,x)=\\sum_{n\\ge1}b_n e^{-D(n\\pi/L)^2 t}\\sin\\frac{n\\pi x}{L}$. I coefficienti si fissano imponendo $w(0,x)=g(x)-u_s(x)$ e proiettando: $b_n=\\frac{2}{L}\\int_0^L\\big(g(x)-u_s(x)\\big)\\sin\\frac{n\\pi x}{L}dx$. L'errore da evitare &egrave; usare $g$ invece di $g-u_s$: il dato iniziale della parte omogenea &egrave; il dato COMPLETO meno il profilo stazionario.","cont":"Il limite $t\\to\\infty$"},{"t":"Ricompongo $u=u_s+w$ e studio $t\\to\\infty$. Verso cosa tende $u$ e perch&eacute; &egrave; il controllo che conferma tutto?","opts":[{"x":"Ogni modo di $w$ decade come $e^{-D(n\\pi/L)^2 t}\\to0$, quindi $u(t,x)\\to u_s(x)=T_1+\\frac{T_2-T_1}{L}x$: la barra rilassa al profilo lineare stazionario, indipendente dal dato iniziale. &Egrave; fisicamente e matematicamente coerente.","c":true},{"x":"$u(t,x)\\to \\frac{2}{L}\\int_0^L g$, la temperatura media iniziale, perch&eacute; il calore si conserva."},{"x":"$u(t,x)\\to0$ ovunque, perch&eacute; tutti i modi del calore decadono a zero."}],"hint":"Solo la parte $w$ decade; $u_s$ &egrave; stazionaria e resta. Il distrattore della media vale per le BC di Neumann (isolanti), non per Dirichlet a temperatura fissata.","sol":"La soluzione completa &egrave; $u(t,x)=u_s(x)+\\sum_{n\\ge1}b_n e^{-D(n\\pi/L)^2 t}\\sin\\frac{n\\pi x}{L}$. Per $t\\to\\infty$ ogni esponenziale $e^{-D(n\\pi/L)^2 t}\\to0$, quindi $u\\to u_s(x)=T_1+\\frac{T_2-T_1}{L}x$: il sistema dimentica il dato iniziale e rilassa al profilo lineare imposto dalle temperature al bordo. &Egrave; il senso fisico della soluzione stazionaria e il controllo che chiude l'esercizio. La media $\\frac{1}{L}\\int g$ sarebbe il limite per estremi ISOLATI (Neumann), dove l'energia si conserva; qui il bordo scambia calore e fissa il profilo.","cont":""}]},{"pool":"edp","src":"20241106 Es.4 · Green dell'operatore radiale f''+(2/x)f'-l(l+1)/x^2 f=delta(x-a)","steps":[{"t":"Si risolve $f''(x)+\\frac{2}{x}f'(x)-\\frac{\\ell(\\ell+1)}{x^2}f(x)=\\delta(x-a)$ su $x\\in(0,\\infty)$ con $\\lim_{x\\to0}f=\\lim_{x\\to\\infty}f=0$ ($\\ell$ intero positivo, $a>0$). Che oggetto stai costruendo e da dove nasce questo operatore?","opts":[{"x":"La funzione di Green dell'operatore radiale che compare separando il Laplaciano 3D in coordinate sferiche nel settore di momento angolare $\\ell$: il termine sorgente $\\delta(x-a)$ e le due BC agli estremi la identificano univocamente.","c":true},{"x":"Una PDE parabolica in cui $x$ gioca il ruolo del tempo: si separa in $\\delta$-modi e si integra."},{"x":"Un problema agli autovalori: gli autovalori sono i valori di $\\ell$ per cui esiste soluzione non banale."}],"hint":"L'operatore $\\frac{d^2}{dx^2}+\\frac{2}{x}\\frac{d}{dx}-\\frac{\\ell(\\ell+1)}{x^2}$ &egrave; la parte RADIALE di $\\nabla^2$ in 3D dopo aver separato le armoniche sferiche. La sorgente $\\delta(x-a)$ dice: funzione di Green.","sol":"La struttura $Lf=\\delta(x-a)$ con $L=\\frac{d^2}{dx^2}+\\frac{2}{x}\\frac{d}{dx}-\\frac{\\ell(\\ell+1)}{x^2}$ &egrave; la definizione stessa di funzione di Green $G(x,a)$ dell'operatore radiale. Questo operatore &egrave; ci&ograve; che resta del Laplaciano $\\nabla^2$ in coordinate sferiche dopo aver separato l'armonica sferica $Y_{\\ell m}$: la parte radiale porta il potenziale centrifugo $\\ell(\\ell+1)/x^2$. Le due BC ai bordi (regolarit&agrave; in $0$, decadimento a $\\infty$) rendono $G$ unica. &Egrave; lo stesso schema del potenziale di Coulomb/multipolo.","cont":"Risolvo l'omogenea"},{"t":"Per costruire $G$ servono le soluzioni dell'omogenea $Lf=0$. Moltiplicando per $x^2$ si ottiene un'equazione di Eulero: quali sono le due soluzioni indipendenti e perch&eacute; ciascuna serve un solo bordo?","opts":[{"x":"$x^2 f''+2x f'-\\ell(\\ell+1)f=0$: ansatz $x^\\alpha$ d&agrave; $\\alpha^2+\\alpha-\\ell(\\ell+1)=0$, cio&egrave; $\\alpha=\\ell$ o $\\alpha=-(\\ell+1)$. Quindi $f_1=x^\\ell$ (soddisfa $f(0)=0$) e $f_2=x^{-\\ell-1}$ (soddisfa $f(\\infty)=0$).","c":true},{"x":"$\\alpha^2+\\alpha-\\ell(\\ell+1)=0$ d&agrave; $\\alpha=\\pm\\ell$; entrambe $x^\\ell$ e $x^{-\\ell}$ vanno a zero in $0$."},{"x":"L'omogenea &egrave; a coefficienti costanti: le soluzioni sono $e^{\\pm\\ell x}$, una per ciascun bordo."}],"hint":"Eulero, non coefficienti costanti: ansatz di POTENZA $x^\\alpha$, non esponenziale. E controlla: $x^\\ell\\to0$ in $x=0$ (per $\\ell>0$), $x^{-\\ell-1}\\to0$ in $x=\\infty$.","sol":"Moltiplicando per $x^2$: $x^2 f''+2x f'-\\ell(\\ell+1)f=0$, equazione di Eulero. L'ansatz $x^\\alpha$ d&agrave; $\\alpha(\\alpha-1)+2\\alpha-\\ell(\\ell+1)=\\alpha^2+\\alpha-\\ell(\\ell+1)=0$, con radici $\\alpha_+=\\ell$ e $\\alpha_-=-(\\ell+1)$. Dunque $f_1(x)=x^\\ell$, che per $\\ell>0$ soddisfa $\\lim_{x\\to0}f_1=0$, e $f_2(x)=x^{-\\ell-1}$, che soddisfa $\\lim_{x\\to\\infty}f_2=0$. Ogni bordo &egrave; servito da una sola soluzione: &egrave; la struttura che rende ben posta la costruzione di Green con condizioni ai due estremi.","cont":"Calcolo il Wronskiano"},{"t":"Calcolo il Wronskiano $W=f_1 f_2'-f_1' f_2$ con $f_1=x^\\ell$, $f_2=x^{-\\ell-1}$. Quanto vale?","opts":[{"x":"$W(x)=x^\\ell\\big(-(\\ell+1)x^{-\\ell-2}\\big)-\\ell x^{\\ell-1}\\,x^{-\\ell-1}=-\\frac{2\\ell+1}{x^2}$.","c":true},{"x":"$W(x)=-\\frac{2\\ell+1}{x}$, lineare in $1/x$."},{"x":"$W(x)=\\frac{2\\ell+1}{x^2}$, positivo."}],"hint":"$f_2'=-(\\ell+1)x^{-\\ell-2}$; entrambi i termini di $W$ scalano come $x^{-2}$ e si sommano con lo stesso segno.","sol":"$f_1'=\\ell x^{\\ell-1}$, $f_2'=-(\\ell+1)x^{-\\ell-2}$. Allora $W=x^\\ell\\cdot(-(\\ell+1)x^{-\\ell-2})-\\ell x^{\\ell-1}\\cdot x^{-\\ell-1}=-(\\ell+1)x^{-2}-\\ell x^{-2}=-\\frac{2\\ell+1}{x^2}$. La dipendenza $\\propto x^{-2}$ non &egrave; casuale: per l'identit&agrave; di Abel $W'\\!/W=-p(x)$ dove $p=2/x$ &egrave; il coefficiente del termine di prim'ordine, da cui $W\\propto e^{-\\int 2/x\\,dx}=x^{-2}$.","cont":"Assemblo la Green"},{"t":"Assemblo $G(x,a)=\\frac{1}{a_2(a)\\,W(a)}\\big[f_1(x_<)f_2(x_>)\\big]$. Attenzione al coefficiente $a_2$: quanto vale e qual &egrave; il risultato finale?","opts":[{"x":"$a_2=1$ (coefficiente di $f''$ nell'equazione ORIGINALE, non moltiplicata per $x^2$): $G(x,a)=-\\frac{1}{2\\ell+1}\\Big[\\frac{x^\\ell}{a^{\\ell-1}}\\theta(a-x)+\\frac{a^{\\ell+2}}{x^{\\ell+1}}\\theta(x-a)\\Big]$.","c":true},{"x":"$a_2=x^2$ (perch&eacute; abbiamo moltiplicato per $x^2$): $G(x,a)=-\\frac{a^2}{2\\ell+1}[\\ldots]$."},{"x":"$a_2=1$ ma la Green &egrave; simmetrica solo per $x=a$: $G(x,a)=\\frac{1}{2\\ell+1}\\frac{x^\\ell}{a^{\\ell+1}}$."}],"hint":"Il fattore $a_2$ &egrave; il coefficiente di $f''$ NELL'EQUAZIONE COME &Egrave; DATA (qui $1$), non nell'Eulero riscalato. Moltiplicare per $x^2$ serviva solo a risolvere l'omogenea.","sol":"La formula &egrave; $G(x,a)=\\frac{f_1(x_<)f_2(x_>)}{a_2(a)W(a)}$, dove $a_2$ &egrave; il coefficiente di $f''$ nell'equazione data, cio&egrave; $a_2=1$ (l'aver moltiplicato per $x^2$ serviva solo a riconoscere Eulero: non cambia $a_2$). Con $W(a)=-(2\\ell+1)/a^2$: $\\frac{1}{a_2 W(a)}=-\\frac{a^2}{2\\ell+1}$. Per $x<a$: $-\\frac{a^2}{2\\ell+1}x^\\ell a^{-\\ell-1}=-\\frac{1}{2\\ell+1}\\frac{x^\\ell}{a^{\\ell-1}}$; per $x>a$: $-\\frac{a^2}{2\\ell+1}a^\\ell x^{-\\ell-1}=-\\frac{1}{2\\ell+1}\\frac{a^{\\ell+2}}{x^{\\ell+1}}$. Prendere $a_2=x^2$ &egrave; l'errore che sballa il risultato di un fattore $a^2$.","cont":"Verifico il salto"},{"t":"Verifica che salva l'esercizio: perch&eacute; questa $G$ produce davvero un $\\delta(x-a)$ e non una funzione liscia? Quale condizione controlli in $x=a$?","opts":[{"x":"$G$ &egrave; continua in $x=a$ ma la sua derivata ha un salto $[\\partial_x G]_{a^-}^{a^+}=1/a_2(a)=1$: integrando $LG$ su un intorno di $a$, solo il termine $G''$ sopravvive e il salto della derivata genera esattamente $\\delta(x-a)$.","c":true},{"x":"$G$ ha un salto di valore in $x=a$ pari a $1/W(a)$; &egrave; la discontinuit&agrave; a produrre la $\\delta$."},{"x":"$G$ e $\\partial_x G$ sono entrambe continue in $x=a$; la $\\delta$ nasce dal termine centrifugo $\\ell(\\ell+1)/x^2$."}],"hint":"Una $\\delta$ nasce dalla derivata SECONDA di una funzione continua con derivata prima discontinua (un angolo). Controlla il salto di $\\partial_x G$, non di $G$.","sol":"La costruzione garantisce che $G$ sia continua in $x=a$ (i due rami coincidono l&igrave;) ma con derivata discontinua. Integrando $LG=\\delta(x-a)$ su $[a-\\epsilon,a+\\epsilon]$: i termini $\\frac{2}{x}\\partial_x G$ e $-\\frac{\\ell(\\ell+1)}{x^2}G$ danno contributo nullo nel limite (integrandi limitati), mentre $\\int \\partial_x^2 G=[\\partial_x G]_{a^-}^{a^+}$ deve valere $1$ (il coefficiente $a_2=1$). Questo salto unitario della derivata &egrave; ci&ograve; che riproduce la $\\delta$: &egrave; la firma dell'angolo di $G$ in $x=a$. Se il salto non torna a $1/a_2$, la Green &egrave; sbagliata.","cont":""}]},{"pool":"edp","src":"Onde su semiretta con d'Alembert e riflessione all'estremo · manuale","steps":[{"t":"Corda su $x\\ge0$: $\\partial_t^2 u=c^2\\partial_x^2 u$ con estremo fisso $u(0,t)=0$, dato iniziale $u(x,0)=f(x)$ e $\\partial_t u(x,0)=0$. Qual &egrave; la strategia corretta e perch&eacute; NON basta la formula di d'Alembert su tutta la retta?","opts":[{"x":"Si usa d'Alembert ma prima si estende $f$ a tutta la retta in modo DISPARI: solo l'estensione dispari garantisce automaticamente $u(0,t)=0$ per ogni $t$.","c":true},{"x":"Si separano le variabili con $\\sin(n\\pi x)$: il dominio semi-infinito ha comunque uno spettro discreto."},{"x":"Si estende $f$ in modo PARI, cos&igrave; che $u(0,t)=f(0)$ resti costante nel tempo."}],"hint":"Su tutta la retta d'Alembert d&agrave; $u=\\frac12[f(x-ct)+f(x+ct)]$, ma questo non sa nulla del vincolo in $x=0$. Che simmetria di $f$ rende $u(0,t)$ identicamente nullo?","sol":"La formula di d'Alembert $u(x,t)=\\frac12[f(x-ct)+f(x+ct)]$ (valida con velocit&agrave; iniziale nulla) vive su tutta la retta e ignora il bordo. Per imporre $u(0,t)=0$ si estende $f$ a una funzione dispari $\\tilde f$ su $\\mathbb{R}$: allora $u(0,t)=\\frac12[\\tilde f(-ct)+\\tilde f(ct)]=\\frac12[-\\tilde f(ct)+\\tilde f(ct)]=0$ automaticamente. &Egrave; il metodo delle immagini/riflessione. Estensione PARI servirebbe per un estremo LIBERO (Neumann $\\partial_x u(0,t)=0$), non fisso.","cont":"Scrivo la soluzione per zone"},{"t":"Con $\\tilde f$ dispari, la soluzione &egrave; $u(x,t)=\\frac12[\\tilde f(x-ct)+\\tilde f(x+ct)]$. Come si scrive esplicitamente nelle due regioni $x>ct$ e $0<x<ct$?","opts":[{"x":"Per $x>ct$ (onda non ancora riflessa): $u=\\frac12[f(x-ct)+f(x+ct)]$. Per $0<x<ct$ (dopo la riflessione): $u=\\frac12[f(x+ct)-f(ct-x)]$, con il segno meno dall'estensione dispari.","c":true},{"x":"Per $x>ct$: $u=\\frac12[f(x-ct)+f(x+ct)]$. Per $0<x<ct$: $u=\\frac12[f(x+ct)+f(ct-x)]$, con il segno pi&ugrave; dell'estensione pari."},{"x":"In entrambe le regioni $u=f(x-ct)$: l'onda viaggia solo verso destra."}],"hint":"Quando $x<ct$ l'argomento $x-ct$ &egrave; negativo: l&igrave; si usa $\\tilde f(x-ct)=-f(ct-x)$ (dispari). Il segno meno &egrave; la firma della riflessione all'estremo fisso.","sol":"Per $x>ct$ entrambi gli argomenti $x\\pm ct$ sono positivi e $\\tilde f=f$: $u=\\frac12[f(x-ct)+f(x+ct)]$, la sovrapposizione delle due onde iniziali. Per $0<x<ct$ l'argomento $x-ct<0$: l'estensione dispari d&agrave; $\\tilde f(x-ct)=-f(ct-x)$, quindi $u=\\frac12[f(x+ct)-f(ct-x)]$. Il segno meno &egrave; l'onda riflessa dall'estremo fisso, invertita in ampiezza (riflessione con inversione di fase, come una corda fissata al muro).","cont":"Interpreto la riflessione"},{"t":"Perch&eacute; all'estremo FISSO l'onda riflessa &egrave; rovesciata (segno meno), mentre a un estremo LIBERO no? Cosa cambia nell'estensione?","opts":[{"x":"Estremo fisso $u(0,t)=0$ richiede estensione DISPARI $\\Rightarrow$ l'immagine ha ampiezza opposta $\\Rightarrow$ riflessione con inversione. Estremo libero $\\partial_x u(0,t)=0$ richiede estensione PARI $\\Rightarrow$ immagine con stessa ampiezza $\\Rightarrow$ riflessione senza inversione.","c":true},{"x":"Dipende solo dalla velocit&agrave; $c$: se $c>1$ l'onda si rovescia, se $c<1$ no."},{"x":"L'estremo fisso non riflette affatto: l'onda viene assorbita e sparisce."}],"hint":"La condizione al bordo dice quale simmetria imporre. Dirichlet $\\to$ dispari $\\to$ meno; Neumann $\\to$ pari $\\to$ pi&ugrave;.","sol":"La condizione al bordo fissa la parit&agrave; dell'immagine. $u(0,t)=0$ (Dirichlet, estremo fissato) impone $\\tilde f$ dispari: l'onda immagine ha ampiezza $-f$, quindi la riflessione inverte il segno (nodo forzato al bordo). $\\partial_x u(0,t)=0$ (Neumann, estremo libero/anello senza attrito) impone $\\tilde f$ pari: l'immagine ha stessa ampiezza, riflessione senza inversione (antinodo al bordo). &Egrave; lo stesso principio della corda vibrante fissata al muro (si rovescia) vs con estremo libero (non si rovescia).","cont":"Dominio di dipendenza"},{"t":"Ultimo controllo: in un punto $x_0$ fissato, a quale istante $u(x_0,t)$ 'sente' per la prima volta il bordo, e cosa dice questo sul dominio di dipendenza?","opts":[{"x":"Per $t<x_0/c$ vale $u=\\frac12[f(x_0-ct)+f(x_0+ct)]$, identica al problema su tutta la retta: il bordo non &egrave; ancora arrivato. A $t=x_0/c$ il segnale riflesso ($ct=x_0$) raggiunge $x_0$ e da l&igrave; compare il termine $-\\frac12 f(ct-x_0)$.","c":true},{"x":"$u(x_0,t)$ sente il bordo immediatamente a $t=0$, perch&eacute; l'informazione nella PDE delle onde si propaga a velocit&agrave; infinita."},{"x":"Il bordo non influenza mai $u(x_0,t)$ se $x_0>0$: la riflessione resta confinata in $x=0$."}],"hint":"La velocit&agrave; finita $c$ significa dominio di dipendenza finito: l'informazione dal bordo viaggia a velocit&agrave; $c$ e impiega un tempo $x_0/c$ ad arrivare.","sol":"L'equazione delle onde ha velocit&agrave; di propagazione finita $c$: il segnale che parte dal bordo in $x=0$ raggiunge $x_0$ solo a $t=x_0/c$. Per $t<x_0/c$ la soluzione &egrave; $\\frac12[f(x_0-ct)+f(x_0+ct)]$, indistinguibile dal problema su tutta la retta (il punto non sa ancora che esiste un bordo). Per $t>x_0/c$ entra il termine riflesso $-\\frac12 f(ct-x_0)$. &Egrave; la differenza cruciale col calore, dove il bordo si sente istantaneamente (velocit&agrave; di propagazione infinita): l'iperbolicit&agrave; delle onde d&agrave; coni di luce e dominio di dipendenza compatto.","cont":""}]},{"pool":"edp","src":"Calore su piastra rettangolare 2D con separazione a doppia base · manuale","steps":[{"t":"Calore su una piastra: $\\partial_t u=D(\\partial_x^2 u+\\partial_y^2 u)$ su $[0,a]\\times[0,b]$, $u=0$ su tutto il bordo, $u(x,y,0)=g(x,y)$. Qual &egrave; l'ansatz di separazione corretto?","opts":[{"x":"$u(x,y,t)=X(x)Y(y)T(t)$: sostituendo e dividendo per $XYT$ si separano tre pezzi $\\frac{\\dot T}{DT}=\\frac{X''}{X}+\\frac{Y''}{Y}$, ciascuno costante.","c":true},{"x":"$u(x,y,t)=X(x)T(t)+Y(y)T(t)$: la somma di due problemi 1D indipendenti."},{"x":"$u(x,y,t)=R(r)\\Theta(\\theta)T(t)$ in coordinate polari, perch&eacute; il Laplaciano &egrave; pi&ugrave; semplice."}],"hint":"Dominio rettangolare, BC su lati paralleli agli assi: si separa in prodotto di funzioni di UNA variabile ciascuna. Le coordinate polari servono per il disco, non per il rettangolo.","sol":"Su un rettangolo con BC sui lati coordinati l'ansatz &egrave; il PRODOTTO $u=X(x)Y(y)T(t)$. Sostituendo in $\\partial_t u=D(\\partial_x^2+\\partial_y^2)u$ e dividendo per $DXYT$: $\\frac{\\dot T}{DT}=\\frac{X''}{X}+\\frac{Y''}{Y}$. Il membro sinistro dipende solo da $t$, il destro solo da $(x,y)$: entrambi valgono una costante $-\\mu$. A sua volta $\\frac{X''}{X}=-k^2$ e $\\frac{Y''}{Y}=-m^2$ sono costanti separate, con $\\mu=k^2+m^2$. La somma (distrattore) non separa la PDE.","cont":"Trovo la doppia base"},{"t":"Applicando $u=0$ sul bordo, quali sono le autofunzioni e gli autovalori (tassi di decadimento) $\\lambda_{mn}$?","opts":[{"x":"$X_m=\\sin\\frac{m\\pi x}{a}$, $Y_n=\\sin\\frac{n\\pi y}{b}$ ($m,n\\ge1$); $\\lambda_{mn}=D\\big[(\\frac{m\\pi}{a})^2+(\\frac{n\\pi}{b})^2\\big]$, con fattore temporale $e^{-\\lambda_{mn}t}$.","c":true},{"x":"$X_m=\\sin\\frac{m\\pi x}{a}$, $Y_n=\\cos\\frac{n\\pi y}{b}$; $\\lambda_{mn}=D(\\frac{m\\pi}{a}+\\frac{n\\pi}{b})$."},{"x":"$X_m=\\sin\\frac{m\\pi x}{a}$, $Y_n=\\sin\\frac{n\\pi y}{b}$; $\\lambda_{mn}=D\\,\\frac{m n\\pi^2}{ab}$ (prodotto degli indici)."}],"hint":"Ogni fattore &egrave; un problema di Dirichlet 1D indipendente: $\\sin$ in entrambe le direzioni. I tassi si SOMMANO (Laplaciano), non si moltiplicano; e sono al quadrato.","sol":"Le BC di Dirichlet su ogni coppia di lati danno un problema 1D per direzione: $X_m(x)=\\sin\\frac{m\\pi x}{a}$ con $k_m=m\\pi/a$, e $Y_n(y)=\\sin\\frac{n\\pi y}{b}$ con $\\ell_n=n\\pi/b$, $m,n\\ge1$. Il tasso di decadimento &egrave; $\\lambda_{mn}=D(k_m^2+\\ell_n^2)=D\\big[(\\frac{m\\pi}{a})^2+(\\frac{n\\pi}{b})^2\\big]$: i due contributi si SOMMANO perch&eacute; il Laplaciano &egrave; $\\partial_x^2+\\partial_y^2$. Fattore temporale $e^{-\\lambda_{mn}t}$.","cont":"Perch&eacute; la base prodotto &egrave; completa"},{"t":"Perch&eacute; &egrave; lecito sviluppare qualunque dato $g(x,y)$ sulla base dei PRODOTTI $\\sin\\frac{m\\pi x}{a}\\sin\\frac{n\\pi y}{b}$?","opts":[{"x":"Perch&eacute; $\\{\\sin\\frac{m\\pi x}{a}\\}$ &egrave; base completa di $L^2[0,a]$ e $\\{\\sin\\frac{n\\pi y}{b}\\}$ di $L^2[0,b]$: il prodotto tensoriale delle due basi &egrave; base completa di $L^2([0,a]\\times[0,b])$.","c":true},{"x":"Perch&eacute; $g$ &egrave; sempre a variabili separabili $g(x,y)=g_1(x)g_2(y)$."},{"x":"Perch&eacute; il rettangolo &egrave; convesso e ogni funzione su un convesso &egrave; sviluppabile in seni."}],"hint":"La completezza 2D non richiede che $g$ sia separabile: viene dal fatto che il prodotto di due basi complete &egrave; una base completa dello spazio prodotto.","sol":"$L^2([0,a]\\times[0,b])\\cong L^2[0,a]\\otimes L^2[0,b]$: se $\\{\\sin\\frac{m\\pi x}{a}\\}$ &egrave; base ortogonale completa del primo fattore (Sturm-Liouville con Dirichlet) e $\\{\\sin\\frac{n\\pi y}{b}\\}$ del secondo, allora i prodotti $\\{\\sin\\frac{m\\pi x}{a}\\sin\\frac{n\\pi y}{b}\\}_{m,n}$ formano base ortogonale completa dello spazio prodotto. Non serve che $g$ sia separabile: un $g$ generico si scrive come somma doppia $\\sum_{mn}c_{mn}\\sin\\frac{m\\pi x}{a}\\sin\\frac{n\\pi y}{b}$. &Egrave; il teorema spettrale applicato al Laplaciano 2D, operatore auto-aggiunto.","cont":"Coefficienti e limite"},{"t":"Scrivo la soluzione completa e i coefficienti. Qual &egrave; $u(x,y,t)$ e il fattore di normalizzazione di $c_{mn}$?","opts":[{"x":"$u=\\sum_{m,n}c_{mn}e^{-\\lambda_{mn}t}\\sin\\frac{m\\pi x}{a}\\sin\\frac{n\\pi y}{b}$, con $c_{mn}=\\frac{4}{ab}\\int_0^a\\!\\int_0^b g(x,y)\\sin\\frac{m\\pi x}{a}\\sin\\frac{n\\pi y}{b}\\,dx\\,dy$.","c":true},{"x":"$u=\\sum_{m,n}c_{mn}e^{-\\lambda_{mn}t}\\sin\\frac{m\\pi x}{a}\\sin\\frac{n\\pi y}{b}$, con $c_{mn}=\\frac{2}{ab}\\int\\!\\int g\\,\\sin\\sin$."},{"x":"$u=\\sum_{m,n}c_{mn}e^{-\\lambda_{mn}t}\\sin\\frac{m\\pi x}{a}\\sin\\frac{n\\pi y}{b}$, con $c_{mn}=\\frac{4}{ab}\\int\\!\\int g\\,\\sin\\sin$ ma il fattore temporale &egrave; $e^{-\\sqrt{\\lambda_{mn}}\\,t}$."}],"hint":"Il fattore di normalizzazione &egrave; il PRODOTTO dei due 1D: $\\frac2a\\cdot\\frac2b=\\frac{4}{ab}$. E il calore decade come $e^{-\\lambda t}$, non $e^{-\\sqrt\\lambda t}$.","sol":"$u(x,y,t)=\\sum_{m,n\\ge1}c_{mn}e^{-\\lambda_{mn}t}\\sin\\frac{m\\pi x}{a}\\sin\\frac{n\\pi y}{b}$ con $\\lambda_{mn}=D[(\\frac{m\\pi}{a})^2+(\\frac{n\\pi}{b})^2]$. Il coefficiente si ottiene proiettando $g$ sul modo $(m,n)$: poich&eacute; $\\int_0^a\\sin^2=\\frac a2$ e $\\int_0^b\\sin^2=\\frac b2$, la normalizzazione &egrave; il prodotto $\\frac2a\\cdot\\frac2b=\\frac{4}{ab}$. Quindi $c_{mn}=\\frac{4}{ab}\\int_0^a\\!\\int_0^b g\\,\\sin\\frac{m\\pi x}{a}\\sin\\frac{n\\pi y}{b}\\,dx\\,dy$. Per $t\\to\\infty$ domina il modo $(1,1)$, il pi&ugrave; lento a decadere; $u\\to0$ perch&eacute; tutti i $\\lambda_{mn}>0$ (nessun modo costante con Dirichlet).","cont":""}]},{"pool":"edp","src":"sbarra radiante, BC di Robin · Sturm-Liouville cap. 19 · manuale","steps":[{"t":"Sbarra $[0,L]$, $\\partial_t u=D\\,\\partial_x^2 u$, estremo sinistro isolato $\\partial_x u(t,0)=0$ ed estremo destro che irraggia (legge di Newton) $\\partial_x u(t,L)=-h\\,u(t,L)$ con $h>0$. Separando $u=T(t)X(x)$, che segno conviene dare alla costante di separazione e perche'?","opts":[{"x":"$X''+\\lambda X=0$ con $\\lambda>0$: solo cosi' $T'=-\\lambda D T$ decade, coerente con una sbarra che si raffredda","c":true},{"x":"$\\lambda<0$, cosi' $T$ cresce esponenzialmente nel tempo"},{"x":"$\\lambda=0$ sempre, perche' la sbarra tende a una costante"}],"hint":"Il fattore temporale e' $T=e^{-\\lambda D t}$: per far uscire energia servono modi che decadono.","sol":"Metodo di separazione delle variabili: $\\frac{T'}{DT}=\\frac{X''}{X}=-\\lambda$. Si sceglie $-\\lambda$ con $\\lambda>0$ perche' l'operatore di Sturm-Liouville $-d^2/dx^2$ con queste BC e' definito positivo, quindi lo spettro sara' $>0$ e $T=e^{-\\lambda Dt}$ decade.","cont":"Applica le BC"},{"t":"Con $\\lambda=\\mu^2>0$ la soluzione e' $X=A\\cos(\\mu x)+B\\sin(\\mu x)$. Cosa impone l'estremo isolato $X'(0)=0$?","opts":[{"x":"$B=0$: resta $X=A\\cos(\\mu x)$","c":true},{"x":"$A=0$: resta $X=B\\sin(\\mu x)$"},{"x":"$A=B$"}],"hint":"$X'(x)=-A\\mu\\sin(\\mu x)+B\\mu\\cos(\\mu x)$; valutala in $0$.","sol":"$X'(0)=B\\mu=0\\Rightarrow B=0$. La BC di Neumann omogenea a sinistra seleziona i coseni (autofunzioni con derivata nulla al bordo).","cont":"Estremo destro"},{"t":"Imponendo la BC di Robin $X'(L)=-h\\,X(L)$ su $X=A\\cos(\\mu x)$, quale equazione determina gli autovalori?","opts":[{"x":"$\\mu\\sin(\\mu L)=h\\cos(\\mu L)$, cioe' $\\tan(\\mu L)=h/\\mu$: equazione trascendente","c":true},{"x":"$\\mu L=n\\pi$, spettro esatto come Dirichlet"},{"x":"$\\cos(\\mu L)=0$, cioe' $\\mu L=(2n+1)\\pi/2$"}],"hint":"$X'(L)=-A\\mu\\sin(\\mu L)$ e $-hX(L)=-hA\\cos(\\mu L)$: eguaglia.","sol":"$-A\\mu\\sin(\\mu L)=-hA\\cos(\\mu L)\\Rightarrow \\tan(\\mu L)=h/\\mu$. Equazione trascendente con infinite radici $\\mu_n$; lo spettro $\\lambda_n=\\mu_n^2$ non e' in forma chiusa, a differenza di Dirichlet/Neumann puri.","cont":"Perche' niente modo nullo"},{"t":"Verifica cruciale: esiste l'autovalore $\\lambda=0$? E cosa cambierebbe se fosse $h=0$ (estremo destro isolato)?","opts":[{"x":"$\\lambda=0$ NON e' autovalore per $h>0$; con $h=0$ ricompare il modo costante e la sbarra non si raffredda piu' a zero","c":true},{"x":"$\\lambda=0$ e' sempre autovalore, con qualunque $h$"},{"x":"con $h=0$ lo spettro diventa negativo"}],"hint":"Per $\\lambda=0$: $X=A+Bx$. Imponi $X'(0)=0$ e poi la Robin a destra.","sol":"Per $\\lambda=0$, $X=A+Bx$; $X'(0)=0\\Rightarrow B=0$, $X=A$; la Robin $X'(L)=0=-hA$ forza $A=0$ se $h>0$: nessun modo nullo. Con $h=0$ la condizione diventa $0=0$ e $X=$cost e' autofunzione con $\\lambda_0=0$, il modo conservato del Neumann puro. Fisicamente $h>0$ apre un canale di uscita del calore (il termine di bordo $h\\,|u(L)|^2$ nell'identita' di Green rende l'operatore strettamente positivo); $h=0$ lo chiude e conserva il calore totale.","cont":"Tempo lungo"},{"t":"Comportamento per $t\\to\\infty$?","opts":[{"x":"$u\\to0$, dominato dal modo $\\mu_1$ piu' piccolo: $u\\sim c_1\\cos(\\mu_1 x)e^{-D\\mu_1^2 t}$","c":true},{"x":"$u\\to$ media di $f$, come nel caso isolato"},{"x":"$u$ oscilla indefinitamente"}],"hint":"Tutti i $\\lambda_n>0$: quale modo muore piu' lentamente?","sol":"Poiche' tutti gli autovalori sono positivi ogni modo decade; il piu' lento e' $\\mu_1$ (prima radice di $\\tan(\\mu L)=h/\\mu$). La sbarra irraggia tutto il calore: $u\\to0$, in contrasto col Neumann puro dove $u\\to\\bar f$.","cont":"Coefficienti"},{"t":"Come si fissano i coefficienti $c_n$ dal dato iniziale $f(x)$?","opts":[{"x":"$c_n=\\dfrac{\\int_0^L f(x)\\cos(\\mu_n x)\\,dx}{\\int_0^L \\cos^2(\\mu_n x)\\,dx}$, per ortogonalita' delle autofunzioni di Sturm-Liouville","c":true},{"x":"$c_n=\\frac{2}{L}\\int_0^L f\\cos(n\\pi x/L)\\,dx$, formula standard di Fourier"}],"hint":"Le $\\mu_n$ NON sono $n\\pi/L$: la norma $\\int\\cos^2(\\mu_n x)\\,dx$ non vale $L/2$.","sol":"Teorema di Sturm-Liouville: le autofunzioni $\\cos(\\mu_n x)$ di un operatore autoaggiunto con autovalori distinti sono ortogonali su $[0,L]$, quindi $c_n=\\langle f,X_n\\rangle/\\lVert X_n\\rVert^2$. La formula di Fourier standard e' errata qui perche' $\\mu_n\\neq n\\pi/L$ e la norma va calcolata esplicitamente."}]},{"pool":"edp","src":"onda smorzata su corda fissata agli estremi · manuale","steps":[{"t":"$\\partial_t^2 u+2\\gamma\\,\\partial_t u=c^2\\,\\partial_x^2 u$ su $[0,L]$, $u(t,0)=u(t,L)=0$, $\\gamma>0$ (attrito viscoso). Separando $u=T(t)X(x)$, quale problema spaziale si ottiene?","opts":[{"x":"$X''+\\lambda X=0$ con $X(0)=X(L)=0$: $\\lambda_n=(n\\pi/L)^2$, $X_n=\\sin(n\\pi x/L)$","c":true},{"x":"$X''+\\lambda X=0$ con $X'(0)=X'(L)=0$: coseni"},{"x":"$X''-\\lambda X=0$: esponenziali reali"}],"hint":"Il termine di attrito $2\\gamma\\partial_t u$ dipende solo dal tempo: non tocca il problema spaziale.","sol":"$\\frac{T''+2\\gamma T'}{c^2 T}=\\frac{X''}{X}=-\\lambda$. Il problema spaziale e' l'ordinario Sturm-Liouville con Dirichlet: $\\lambda_n=(n\\pi/L)^2$, $X_n=\\sin(n\\pi x/L)$. L'attrito e' interamente nel fattore temporale.","cont":"ODE temporale"},{"t":"Il fattore temporale soddisfa $T_n''+2\\gamma T_n'+c^2\\lambda_n T_n=0$. Radici caratteristiche?","opts":[{"x":"$r=-\\gamma\\pm\\sqrt{\\gamma^2-c^2\\lambda_n}$","c":true},{"x":"$r=\\pm ic\\sqrt{\\lambda_n}$, come senza attrito"},{"x":"$r=-2\\gamma\\pm c\\sqrt{\\lambda_n}$"}],"hint":"Equazione caratteristica $r^2+2\\gamma r+c^2\\lambda_n=0$.","sol":"Oscillatore smorzato per ogni modo: $r^2+2\\gamma r+c^2\\lambda_n=0\\Rightarrow r=-\\gamma\\pm\\sqrt{\\gamma^2-c^2\\lambda_n}$. Ogni modo spaziale evolve come un oscillatore armonico smorzato indipendente.","cont":"Sotto/sovra smorzamento"},{"t":"Perche' i modi bassi e i modi alti si comportano diversamente, e dov'e' la soglia?","opts":[{"x":"Se $c^2\\lambda_n>\\gamma^2$ (modi alti) sono sottosmorzati e oscillano; se $c^2\\lambda_n<\\gamma^2$ (modi bassi) sono sovrasmorzati e decadono senza oscillare. Soglia $c\\,n\\pi/L=\\gamma$","c":true},{"x":"Tutti i modi oscillano con la stessa frequenza"},{"x":"I modi alti decadono piu' lentamente dei bassi"}],"hint":"Il discriminante $\\gamma^2-c^2\\lambda_n$ cambia segno al crescere di $n$.","sol":"Il segno del discriminante decide: negativo (n grande) $\\Rightarrow$ radici complesse $\\Rightarrow$ oscillazione smorzata; positivo (n piccolo) $\\Rightarrow$ radici reali $\\Rightarrow$ decadimento monotono. La soglia $n^*$ con $c\\,n^*\\pi/L=\\gamma$ separa i regimi. Senza questa distinzione si scriverebbe una frequenza reale anche per modi che non oscillano.","cont":"Modo sottosmorzato"},{"t":"Per un modo sottosmorzato ($c^2\\lambda_n>\\gamma^2$), come si scrive $T_n(t)$?","opts":[{"x":"$T_n=e^{-\\gamma t}\\big(a_n\\cos\\omega_n t+b_n\\sin\\omega_n t\\big)$ con $\\omega_n=\\sqrt{c^2\\lambda_n-\\gamma^2}$","c":true},{"x":"$T_n=a_n\\cos(c\\sqrt{\\lambda_n}\\,t)$ senza smorzamento"},{"x":"$T_n=e^{-\\gamma t}$ soltanto, nessuna oscillazione"}],"hint":"Radici $-\\gamma\\pm i\\omega_n$: parte reale = inviluppo, parte immaginaria = frequenza.","sol":"Con radici $-\\gamma\\pm i\\omega_n$: inviluppo $e^{-\\gamma t}$ comune a TUTTI i modi, frequenza abbassata $\\omega_n=\\sqrt{c^2\\lambda_n-\\gamma^2}<c\\sqrt{\\lambda_n}$. L'attrito abbassa la frequenza e impone un decadimento uguale per ogni modo.","cont":"Limite"},{"t":"Limite $\\gamma\\to0$?","opts":[{"x":"$\\omega_n\\to c\\,n\\pi/L$ e l'inviluppo $e^{-\\gamma t}\\to1$: si recupera l'onda non smorzata con frequenze armoniche","c":true},{"x":"La soluzione diverge"},{"x":"Restano solo i modi pari"}],"hint":"Metti $\\gamma=0$ in $\\omega_n$ e nell'inviluppo.","sol":"Per $\\gamma\\to0$: $\\omega_n=\\sqrt{c^2\\lambda_n-\\gamma^2}\\to c\\,n\\pi/L$ e inviluppo $\\to1$. Test di consistenza superato: l'equazione delle onde ordinaria e' il limite non dissipativo, con frequenze armoniche $c\\,n\\pi/L$.","cont":"Soluzione generale"},{"t":"Soluzione completa con $u(x,0)=f(x)$, $\\partial_t u(x,0)=0$ (tutti i modi sottosmorzati)?","opts":[{"x":"$u=\\sum_n e^{-\\gamma t}\\big(a_n\\cos\\omega_n t+\\tfrac{\\gamma a_n}{\\omega_n}\\sin\\omega_n t\\big)\\sin\\tfrac{n\\pi x}{L}$, con $a_n=\\tfrac2L\\int_0^L f\\sin\\tfrac{n\\pi x}{L}\\,dx$","c":true},{"x":"$u=\\sum_n a_n\\cos\\omega_n t\\,\\sin\\tfrac{n\\pi x}{L}$, con $b_n$ liberi"}],"hint":"La velocita' iniziale nulla lega $b_n$ ad $a_n$: $\\dot T_n(0)=0\\Rightarrow -\\gamma a_n+\\omega_n b_n=0$.","sol":"Sviluppo di Fourier del dato: $a_n=\\frac2L\\int_0^L f\\sin(n\\pi x/L)\\,dx$. La condizione $\\partial_t u(x,0)=0$ impone $\\dot T_n(0)=-\\gamma a_n+\\omega_n b_n=0\\Rightarrow b_n=\\gamma a_n/\\omega_n$. L'attrito rende $b_n\\neq0$ anche con velocita' iniziale nulla, a differenza del caso conservativo."}]},{"pool":"edp","src":"raffreddamento di un cilindro, calore radiale (Bessel) · da MIT 18.303 · manuale","steps":[{"t":"Cilindro infinito, calore radiale $\\partial_t u=D\\,\\Delta u$ sul disco $r<a$ con $u=u(r,t)$ (simmetria radiale) e $u(a,t)=0$. Qual e' il Laplaciano e la ODE radiale dopo separazione $u=T(t)R(r)$?","opts":[{"x":"$\\Delta u=\\partial_r^2 u+\\frac1r\\partial_r u$; radiale: $R''+\\frac1r R'+\\lambda R=0$","c":true},{"x":"$\\Delta u=\\partial_r^2 u$; radiale: $R''+\\lambda R=0$"},{"x":"$\\Delta u=\\frac1r\\partial_r u$; radiale del primo ordine"}],"hint":"In coordinate polari con simmetria radiale il termine $\\frac1r\\partial_r$ non si trascura.","sol":"Laplaciano polare radiale $\\Delta=\\partial_r^2+\\frac1r\\partial_r$. Separando: $\\frac{T'}{DT}=\\frac{R''+R'/r}{R}=-\\lambda$, da cui $R''+\\frac1r R'+\\lambda R=0$.","cont":"Bessel"},{"t":"Con $\\lambda=k^2$ e $s=kr$, l'equazione $R''+\\frac1r R'+k^2 R=0$ diventa Bessel di ordine $0$. Soluzione generale?","opts":[{"x":"$R=c_1 J_0(kr)+c_2 Y_0(kr)$","c":true},{"x":"$R=c_1\\cos(kr)+c_2\\sin(kr)$"},{"x":"$R=c_1 e^{kr}+c_2 e^{-kr}$"}],"hint":"$s^2 R_{ss}+sR_s+s^2 R=0$ e' l'equazione di Bessel di ordine $0$.","sol":"Sostituendo $s=kr$: $s^2 R_{ss}+sR_s+s^2R=0$, equazione di Bessel di ordine $0$, con soluzione $R=c_1 J_0(kr)+c_2 Y_0(kr)$.","cont":"Regolarita'"},{"t":"Perche' si scarta $Y_0$? Quale caratteristica del DOMINIO lo impone?","opts":[{"x":"Il dominio include il centro $r=0$ e $Y_0(0)=-\\infty$: la temperatura al centro sarebbe infinita, quindi $c_2=0$. La regolarita' in $0$ e' parte della definizione dell'operatore","c":true},{"x":"$Y_0$ si scarta perche' non e' periodica"},{"x":"$Y_0$ e' a valori complessi"}],"hint":"Cosa fa $Y_0(kr)$ per $r\\to0$? E il centro appartiene al disco?","sol":"Il disco $r<a$ CONTIENE il centro; $Y_0(kr)\\to-\\infty$ per $r\\to0$, incompatibile con temperatura finita. La regolarita' in $r=0$ e' una BC implicita (bordo del dominio) che seleziona $R=c_1 J_0(kr)$. Su un anello $a<r<b$ $Y_0$ NON si scarterebbe: e' il dominio a decidere l'operatore.","cont":"Autovalori"},{"t":"Dalla BC $u(a,t)=0$, cioe' $J_0(ka)=0$, come sono fatti gli autovalori?","opts":[{"x":"$k_m=\\alpha_{0,m}/a$ con $\\alpha_{0,m}$ $m$-esimo zero di $J_0$; $\\lambda_m=(\\alpha_{0,m}/a)^2$","c":true},{"x":"$k_m=m\\pi/a$, come una corda"},{"x":"$\\lambda_m=(2m+1)^2\\pi^2/(4a^2)$"}],"hint":"$J_0$ non e' un coseno: i suoi zeri $\\alpha_{0,m}\\approx2.405,\\,5.520,\\dots$ non sono equispaziati.","sol":"$J_0(ka)=0\\Rightarrow ka=\\alpha_{0,m}$, gli zeri di $J_0$. Quindi $\\lambda_m=(\\alpha_{0,m}/a)^2$. Gli zeri non sono $m\\pi$: lo spettro non e' quello di una corda vibrante.","cont":"Ortogonalita' pesata"},{"t":"I coefficienti $c_m$ dal dato $u(r,0)=g(r)$: quale prodotto scalare li fissa?","opts":[{"x":"$c_m=\\dfrac{\\int_0^a g(r)J_0(\\alpha_{0,m}r/a)\\,r\\,dr}{\\int_0^a J_0^2(\\alpha_{0,m}r/a)\\,r\\,dr}$: peso $r$ dalla forma di Sturm-Liouville","c":true},{"x":"$c_m=\\frac2a\\int_0^a g(r)J_0(\\alpha_{0,m}r/a)\\,dr$ senza peso"}],"hint":"Il peso viene dalla forma $\\frac{d}{dr}(r R')+\\lambda\\,r R=0$: qual e' la funzione peso?","sol":"L'operatore radiale in forma di Sturm-Liouville e' $\\frac{d}{dr}(r\\,R')+\\lambda\\, r\\,R=0$: funzione peso $w(r)=r$. L'ortogonalita' delle $J_0(\\alpha_{0,m}r/a)$ e' quindi PESATA con $r\\,dr$. Dimenticare il peso e' l'errore classico su Bessel.","cont":"Tempo lungo"},{"t":"Comportamento per $t\\to\\infty$?","opts":[{"x":"$u\\sim c_1 J_0(\\alpha_{0,1}r/a)e^{-D(\\alpha_{0,1}/a)^2 t}$, decadimento col primo zero $\\alpha_{0,1}\\approx2.405$","c":true},{"x":"$u\\to$ media di $g$"},{"x":"$u$ oscilla nel tempo"}],"hint":"Con Dirichlet non c'e' modo a $\\lambda=0$: il piu' lento e' $m=1$.","sol":"Tutti $\\lambda_m>0$ (Dirichlet, nessun modo nullo), quindi $u\\to0$; domina il modo piu' lento $m=1$ con tasso $D(\\alpha_{0,1}/a)^2$, $\\alpha_{0,1}\\approx2.405$. Il cilindro si raffredda completamente."}]},{"pool":"edp","src":"corda semi-infinita con estremo LIBERO (Neumann), riflessione per immagini · manuale","steps":[{"t":"Corda su $x\\ge0$, $\\partial_t^2 u=c^2\\partial_x^2 u$, estremo libero $\\partial_x u(0,t)=0$, dati $u(x,0)=f(x)$ e $\\partial_t u(x,0)=0$. Da d'Alembert generale $u=\\phi(x-ct)+\\psi(x+ct)$, cosa impone la velocita' iniziale nulla?","opts":[{"x":"$\\phi=\\psi$ a meno di costante, cioe' $u=\\tfrac12[F(x-ct)+F(x+ct)]$ con $F$ estensione di $f$","c":true},{"x":"$\\phi=-\\psi$, cioe' $u=\\tfrac12[F(x-ct)-F(x+ct)]$"},{"x":"$\\psi=0$, onda solo progressiva"}],"hint":"$\\partial_t u(x,0)=-c\\phi'(x)+c\\psi'(x)=0$: che relazione fra $\\phi'$ e $\\psi'$?","sol":"La formula di d'Alembert con $\\partial_t u(x,0)=0$ da' $\\phi'=\\psi'$, quindi $u=\\tfrac12[F(x-ct)+F(x+ct)]$ dove $F$ e' un'opportuna estensione di $f$ a tutta la retta: il dato si divide in due mezze onde controcorrenti.","cont":"Semiretta ed estensione"},{"t":"Il problema e' su $x\\ge0$ ma d'Alembert vive su tutta la retta: come si estende $f$ per rispettare la BC di estremo libero $\\partial_x u(0,t)=0$?","opts":[{"x":"Estensione PARI: $F(-x)=F(x)$","c":true},{"x":"Estensione DISPARI: $F(-x)=-F(x)$"},{"x":"Estensione periodica di periodo $2$"}],"hint":"$\\partial_x u(0,t)=\\tfrac12[F'(-ct)+F'(ct)]$: quando si annulla per ogni $t$?","sol":"Con estensione pari $F'$ e' dispari, quindi $F'(-ct)+F'(ct)=0$: la BC di Neumann e' soddisfatta automaticamente per ogni $t$. Costruzione per immagini (metodo delle immagini).","cont":"Perche' pari e non dispari"},{"t":"Perche' proprio l'estensione PARI, e cosa cambierebbe con un estremo FISSO $u(0,t)=0$ invece che libero?","opts":[{"x":"Neumann (libero) $\\Rightarrow$ pari, perche' la derivata di una funzione pari si annulla in $0$; Dirichlet (fisso) $\\Rightarrow$ dispari, perche' una funzione dispari si annulla in $0$","c":true},{"x":"E' indifferente: entrambe le BC ammettono qualunque estensione"},{"x":"Neumann richiede l'estensione dispari"}],"hint":"Al bordo: una funzione pari ha $F'(0)=0$; una dispari ha $F(0)=0$. Quale BC serve?","sol":"La parita' dell'estensione E' dettata dalla BC. Estremo libero fissa la DERIVATA a zero $\\Rightarrow$ serve $F'(0)=0\\Rightarrow F$ pari. Estremo fisso fissa il VALORE a zero $\\Rightarrow$ serve $F(0)=0\\Rightarrow F$ dispari. Sbagliare la parita' viola la BC: e' l'errore che l'esercizio vuole intercettare.","cont":"Segno dell'impulso riflesso"},{"t":"Un impulso concentrato inizialmente a $x_0>0$ viaggia verso il bordo e si riflette. Con l'estremo LIBERO, con che segno torna indietro?","opts":[{"x":"Con lo STESSO segno (riflessione senza inversione): il bordo libero e' un ventre","c":true},{"x":"Con segno OPPOSTO (riflessione con inversione), come per l'estremo fisso"},{"x":"Si annulla al bordo"}],"hint":"L'estensione pari mette a $-x_0$ una copia dello STESSO segno; l'estensione dispari (estremo fisso) la metterebbe rovesciata.","sol":"L'immagine pari a $-x_0$ ha lo stesso segno dell'impulso reale; quando la mezza onda progressiva raggiunge il bordo e riemerge, l'impulso riflesso conserva il segno. Il bordo libero e' un ventre (antinodo), l'opposto del bordo fisso (nodo) che inverte il segno.","cont":"Verifica BC"},{"t":"Verifica finale: la soluzione $u=\\tfrac12[F(x-ct)+F(x+ct)]$ con $F$ pari soddisfa davvero $\\partial_x u(0,t)=0$?","opts":[{"x":"Si': $\\partial_x u(0,t)=\\tfrac12[F'(-ct)+F'(ct)]=0$ perche' $F'$ e' dispari","c":true},{"x":"No, resta un termine $\\propto F(0)$"},{"x":"Solo per $t=0$"}],"hint":"$F$ pari $\\Rightarrow F'$ dispari $\\Rightarrow F'(-a)=-F'(a)$.","sol":"$\\partial_x u=\\tfrac12[F'(x-ct)+F'(x+ct)]$; in $x=0$: $\\tfrac12[F'(-ct)+F'(ct)]$. Con $F$ pari, $F'$ e' dispari, quindi la somma e' nulla per ogni $t$. La BC di Neumann e' verificata: la costruzione per immagini e' consistente."}]},{"pool":"edp","src":"calore con flusso di Neumann dipendente dal tempo, riduzione con funzione di riferimento · manuale","steps":[{"t":"$\\partial_t u=D\\,\\partial_x^2 u$ su $[0,L]$, $\\partial_x u(t,0)=0$, flusso imposto $\\partial_x u(t,L)=q(t)$, dato $u(0,x)=0$. Perche' NON si puo' sviluppare direttamente $u=\\sum_n a_n(t)\\cos(n\\pi x/L)$?","opts":[{"x":"Perche' ogni coseno ha derivata nulla in $x=L$: una serie di soli coseni ha sempre flusso nullo al bordo, non puo' rappresentare $q(t)\\neq0$","c":true},{"x":"Perche' i coseni non sono ortogonali"},{"x":"Perche' la serie non converge"}],"hint":"$\\partial_x\\cos(n\\pi x/L)|_{x=L}=-\\tfrac{n\\pi}{L}\\sin(n\\pi)=0$ per ogni $n$.","sol":"Le autofunzioni di Neumann $\\cos(n\\pi x/L)$ hanno tutte derivata nulla agli estremi, quindi la derivata termine a termine di qualunque loro serie e' nulla al bordo: e' impossibile rappresentare un flusso non nullo. E' l'ostacolo che impone di omogeneizzare prima le BC.","cont":"Funzione di riferimento"},{"t":"Si cerca $w(x,t)$ che assorba la BC inomogenea. Quale scelta funziona?","opts":[{"x":"$w(x,t)=\\dfrac{q(t)}{2L}x^2$: da' $w_x=q(t)x/L$, quindi $w_x(0)=0$ e $w_x(L)=q(t)$","c":true},{"x":"$w(x,t)=q(t)\\,x$: da' $w_x=q(t)$ dappertutto, ma $w_x(0)=q(t)\\neq0$"},{"x":"$w(x,t)=q(t)\\cos(\\pi x/L)$"}],"hint":"Servono $w_x(0)=0$ e $w_x(L)=q(t)$ insieme: un polinomio di secondo grado in $x$.","sol":"$w=\\tfrac{q(t)}{2L}x^2$ ha $w_x=q(t)x/L$: soddisfa sia $w_x(0)=0$ sia $w_x(L)=q(t)$. La scelta lineare $q(t)x$ sbaglia il flusso a sinistra. Costruzione della funzione di riferimento per omogeneizzare le BC.","cont":"Perche' funziona"},{"t":"Ponendo $u=w+v$, quale problema risolve $v$ e perche' ora l'espansione in coseni e' lecita?","opts":[{"x":"$v_t=D v_{xx}+S(t,x)$ con $S=D w_{xx}-w_t$, e $v$ ha BC di Neumann OMOGENEE $v_x(0)=v_x(L)=0$: ora i coseni sono la base giusta","c":true},{"x":"$v$ soddisfa l'equazione omogenea senza sorgente"},{"x":"$v$ eredita la stessa BC inomogenea di $u$"}],"hint":"Sostituisci $u=w+v$ in $u_t=Du_{xx}$: $v$ prende una sorgente ma perde l'inomogeneita' al bordo.","sol":"Sottraendo, $v=u-w$ soddisfa $v_t=Dv_{xx}+(Dw_{xx}-w_t)$ con $v_x(0)=v_x(L)=0$ (le BC di $w$ cancellano quelle di $u$). Ora le BC sono omogenee e i coseni sono autofunzioni legittime: e' l'unico modo di applicare l'espansione spettrale. Qui $Dw_{xx}=Dq(t)/L$ e $w_t=\\dot q\\,x^2/(2L)$.","cont":"Duhamel"},{"t":"La sorgente $S(t,x)$ dipende dal tempo. Con quale metodo si risolve $v_t=Dv_{xx}+S$ a BC omogenee?","opts":[{"x":"Espansione $v=\\sum_n v_n(t)\\cos(n\\pi x/L)$ e principio di Duhamel: ogni $v_n$ risolve una ODE del primo ordine forzata $\\dot v_n+D(n\\pi/L)^2 v_n=S_n(t)$","c":true},{"x":"Separazione di variabili pura, senza sorgente"},{"x":"Trasformata di Fourier in $x$ su tutta la retta"}],"hint":"Proietta l'equazione su $\\cos(n\\pi x/L)$: ottieni una ODE lineare del primo ordine con termine noto $S_n(t)$.","sol":"Proiettando su ciascun coseno si ha $\\dot v_n+D(n\\pi/L)^2 v_n=S_n(t)$, con $S_n$ i coefficienti di $S$. Il principio di Duhamel da' $v_n(t)=\\int_0^t e^{-D(n\\pi/L)^2(t-\\tau)}S_n(\\tau)\\,d\\tau$. E' la risposta forzata modo per modo.","cont":"Il modo n=0"},{"t":"Attenzione al modo $n=0$ (la media): che equazione soddisfa $v_0(t)$ e cosa significa fisicamente?","opts":[{"x":"$\\dot v_0=S_0(t)$ (nessun decadimento, $\\lambda_0=0$): rappresenta l'accumulo netto di calore dovuto al flusso entrante, che non viene smaltito","c":true},{"x":"$v_0=0$ sempre"},{"x":"$\\dot v_0+D v_0=S_0$, decade come gli altri"}],"hint":"Per $n=0$ l'autovalore e' $\\lambda_0=0$: la ODE perde il termine di decadimento.","sol":"Per $n=0$: $\\dot v_0=S_0(t)$, senza smorzamento perche' $\\lambda_0=0$. Fisicamente e' il bilancio globale di calore: il flusso $q(t)$ al bordo destro inietta o estrae energia che si accumula nella media, non decade. E' il modo che porta l'informazione della conservazione."}]},{"pool":"edp","src":"advezione-diffusione su dominio finito con Dirichlet, trasformazione di gauge · manuale","steps":[{"t":"$\\partial_t u+v\\,\\partial_x u=D\\,\\partial_x^2 u$ su $[0,L]$, $u(t,0)=u(t,L)=0$, $v$ costante (deriva). Per eliminare il termine del primo ordine si pone $u=e^{\\alpha x+\\beta t}w$. Quale $\\alpha$ cancella la deriva?","opts":[{"x":"$\\alpha=\\dfrac{v}{2D}$","c":true},{"x":"$\\alpha=\\dfrac{v}{D}$"},{"x":"$\\alpha=-\\dfrac{D}{v}$"}],"hint":"Sostituisci l'ansatz e imponi che il coefficiente di $\\partial_x w$ si annulli.","sol":"Con $u=e^{\\alpha x+\\beta t}w$ i termini in $\\partial_x w$ danno $(2D\\alpha-v)\\partial_x w$; annullarlo richiede $\\alpha=v/(2D)$. E' la trasformazione di gauge (o cambio esponenziale) che riduce advezione-diffusione a pura diffusione.","cont":"Il coefficiente beta"},{"t":"Con $\\alpha=v/(2D)$, quale $\\beta$ rende $w$ soluzione dell'equazione del calore pura $w_t=D w_{xx}$?","opts":[{"x":"$\\beta=-\\dfrac{v^2}{4D}$","c":true},{"x":"$\\beta=\\dfrac{v^2}{4D}$"},{"x":"$\\beta=0$"}],"hint":"Raccogli i termini senza derivate spaziali di $w$: il residuo $D\\alpha^2-v\\alpha+\\beta$ deve annullarsi.","sol":"I termini di ordine zero danno $\\beta=v\\alpha-D\\alpha^2=\\tfrac{v^2}{2D}-\\tfrac{v^2}{4D}=\\tfrac{v^2}{4D}$; per avere $w_t=Dw_{xx}$ senza residuo si assorbe questo nel fattore, cioe' $u=e^{\\frac{v}{2D}x-\\frac{v^2}{4D}t}w$, con $\\beta=-v^2/(4D)$.","cont":"BC preservate"},{"t":"Le BC di Dirichlet si trasferiscono a $w$? Perche' la trasformazione e' lecita su dominio finito?","opts":[{"x":"Si': il fattore $e^{\\alpha x+\\beta t}$ non si annulla mai, quindi $u=0$ al bordo $\\Leftrightarrow w=0$ al bordo. Su $[0,L]$ resta limitato, quindi legittimo","c":true},{"x":"No, le BC diventano di Robin"},{"x":"Le BC diventano periodiche"}],"hint":"$u(t,0)=e^{\\beta t}w(t,0)$: quando vale zero?","sol":"Poiche' $e^{\\alpha x+\\beta t}>0$ ovunque, $u=0$ agli estremi equivale a $w=0$ agli estremi: le Dirichlet omogenee si conservano. Su dominio finito il fattore esponenziale e' limitato, quindi la trasformazione e' ben definita (a differenza di casi su tutta la retta dove va controllata l'integrabilita').","cont":"Autovalori spostati"},{"t":"Risolto $w=\\sum_n b_n\\sin(n\\pi x/L)e^{-D(n\\pi/L)^2 t}$, qual e' il tasso di decadimento del modo $n$ per $u$?","opts":[{"x":"$D\\left(\\dfrac{n\\pi}{L}\\right)^2+\\dfrac{v^2}{4D}$: la deriva AGGIUNGE un decadimento comune $v^2/(4D)$","c":true},{"x":"$D(n\\pi/L)^2$, invariato rispetto al caso senza deriva"},{"x":"$D(n\\pi/L)^2-v^2/(4D)$, la deriva rallenta"}],"hint":"$u=e^{-\\frac{v^2}{4D}t}\\cdot e^{\\frac{v}{2D}x}\\,w$: il primo fattore aggiunge un tasso a ogni modo.","sol":"$u=e^{\\frac{v}{2D}x}\\,e^{-\\frac{v^2}{4D}t}\\sum_n b_n\\sin(n\\pi x/L)e^{-D(n\\pi/L)^2 t}$: ogni modo decade con tasso $D(n\\pi/L)^2+v^2/(4D)$. La deriva accelera lo smaltimento.","cont":"Perche' la deriva accelera"},{"t":"Perche' fisicamente la deriva $v$ AUMENTA il tasso di decadimento (non lo rallenta)?","opts":[{"x":"Perche' l'advezione trasporta il profilo verso i bordi assorbenti (Dirichlet): il calore raggiunge prima la frontiera dove viene rimosso, quindi decade piu' in fretta","c":true},{"x":"Perche' la deriva genera nuova diffusione"},{"x":"Perche' $v$ cambia il segno degli autovalori"}],"hint":"Con Dirichlet il bordo assorbe. Cosa fa la deriva al baricentro del profilo?","sol":"La deriva sposta il profilo verso la frontiera; con Dirichlet (bordo assorbente) tutto cio' che arriva al bordo viene rimosso, quindi il trasporto accelera la perdita: da qui il contributo positivo $v^2/(4D)$. Con bordi periodici o su tutta la retta la deriva sarebbe pura traslazione, senza extra decadimento: e' la BC assorbente a dare il segno.","cont":"Limite"},{"t":"Limite $v\\to0$?","opts":[{"x":"Si recupera l'equazione del calore pura: $\\alpha\\to0$, $\\beta\\to0$, tasso $\\to D(n\\pi/L)^2$","c":true},{"x":"La soluzione diverge"},{"x":"Restano solo modi dispari"}],"hint":"Metti $v=0$ in $\\alpha$, $\\beta$ e nel tasso.","sol":"Per $v\\to0$: $\\alpha=v/(2D)\\to0$, $\\beta\\to0$, il fattore esponenziale $\\to1$ e il tasso $\\to D(n\\pi/L)^2$. Test di consistenza: la diffusione pura e' il limite senza deriva."}]},{"pool":"edp","src":"equazione di Klein-Gordon (onda massiva) su dominio finito · manuale","steps":[{"t":"$\\partial_t^2 u=c^2\\partial_x^2 u-m^2 u$ su $[0,L]$, Dirichlet $u(t,0)=u(t,L)=0$ ($m$ costante, campo massivo). Separando $u=T(t)X(x)$, quale problema spaziale e quale ODE temporale?","opts":[{"x":"$X''+\\lambda X=0$ con Dirichlet ($X_n=\\sin(n\\pi x/L)$, $\\lambda_n=(n\\pi/L)^2$) e $T_n''+(c^2\\lambda_n+m^2)T_n=0$","c":true},{"x":"$X''+\\lambda X=0$ e $T_n''+c^2\\lambda_n T_n=0$: il termine di massa scompare"},{"x":"$X''-\\lambda X=0$ (esponenziali) e $T$ del primo ordine"}],"hint":"Dividi per $u$: $\\frac{T''}{c^2 T}+\\frac{m^2}{c^2}=\\frac{X''}{X}=-\\lambda$. Dove finisce $m^2$?","sol":"Separando: $\\frac{T''}{T}=c^2\\frac{X''}{X}-m^2$. Il problema spaziale resta Dirichlet ($\\lambda_n=(n\\pi/L)^2$, seni), ma il termine di massa entra nel tempo: $T_n''+(c^2\\lambda_n+m^2)T_n=0$. La massa non tocca le autofunzioni spaziali, solo le frequenze.","cont":"Frequenze"},{"t":"Qual e' la frequenza $\\omega_n$ del modo $n$?","opts":[{"x":"$\\omega_n=\\sqrt{c^2(n\\pi/L)^2+m^2}$","c":true},{"x":"$\\omega_n=c\\,n\\pi/L$, indipendente da $m$"},{"x":"$\\omega_n=\\sqrt{c^2(n\\pi/L)^2-m^2}$"}],"hint":"$T_n''+\\omega_n^2 T_n=0$ con $\\omega_n^2=c^2\\lambda_n+m^2$.","sol":"$T_n=a_n\\cos\\omega_n t+b_n\\sin\\omega_n t$ con $\\omega_n^2=c^2(n\\pi/L)^2+m^2$. La massa ALZA ogni frequenza. E' la relazione di dispersione $\\omega^2=c^2k^2+m^2$ valutata sui $k_n=n\\pi/L$ permessi dal dominio.","cont":"Dispersione e gap"},{"t":"Perche' l'equazione massiva e' DISPERSIVA mentre l'onda ordinaria ($m=0$) non lo e', e cosa comporta un 'gap' di frequenza?","opts":[{"x":"Con $m=0$ vale $\\omega=ck$ (velocita' di fase costante, niente dispersione); con $m\\neq0$ $\\omega=\\sqrt{c^2k^2+m^2}$ dipende non linearmente da $k$, i pacchetti si deformano, e c'e' una frequenza minima $\\omega\\ge m$ (gap)","c":true},{"x":"Massiva e non massiva sono entrambe non dispersive"},{"x":"Il gap significa che mancano i modi bassi"}],"hint":"Confronta $\\omega(k)$: e' lineare in $k$ o no? E qual e' $\\omega$ minimo al tendere di $k\\to0$?","sol":"Dispersione = dipendenza NON lineare di $\\omega$ da $k$. Per $m=0$, $\\omega=ck$ e' lineare: tutte le componenti viaggiano a velocita' $c$, il profilo non si deforma. Per $m\\neq0$, $\\omega=\\sqrt{c^2k^2+m^2}$ e' non lineare $\\Rightarrow$ velocita' di gruppo $d\\omega/dk$ dipende da $k$ $\\Rightarrow$ i pacchetti si disperdono; inoltre $\\omega\\to m$ per $k\\to0$: esiste una frequenza minima (gap di massa). E' il tratto distintivo del campo massivo.","cont":"Modo piu' basso"},{"t":"Sul dominio $[0,L]$ la frequenza del modo fondamentale ($n=1$) e':","opts":[{"x":"$\\omega_1=\\sqrt{c^2(\\pi/L)^2+m^2}$: sempre $>m$, mai esattamente $m$ perche' $k=0$ e' escluso da Dirichlet","c":true},{"x":"$\\omega_1=m$ esatto"},{"x":"$\\omega_1=0$"}],"hint":"Dirichlet esclude $k=0$ (il modo costante non e' ammesso): il $k$ piu' piccolo e' $\\pi/L$.","sol":"Il piu' piccolo numero d'onda ammesso da Dirichlet e' $k_1=\\pi/L$ (il modo $n=0$ costante violerebbe le BC), quindi $\\omega_1=\\sqrt{c^2(\\pi/L)^2+m^2}>m$. Il gap teorico $\\omega=m$ (a $k=0$) e' un estremo inferiore non raggiunto sul dominio finito.","cont":"Limite"},{"t":"Limite $m\\to0$?","opts":[{"x":"$\\omega_n\\to c\\,n\\pi/L$: frequenze armoniche, si recupera l'onda ordinaria non dispersiva di d'Alembert","c":true},{"x":"Le frequenze divergono"},{"x":"Sopravvivono solo i modi pari"}],"hint":"Metti $m=0$ in $\\omega_n$.","sol":"Per $m\\to0$: $\\omega_n=\\sqrt{c^2(n\\pi/L)^2+m^2}\\to c\\,n\\pi/L$, frequenze armoniche (multipli interi della fondamentale). Si recupera l'equazione delle onde ordinaria: consistenza.","cont":"Soluzione generale"},{"t":"Soluzione completa con $u(x,0)=f(x)$, $\\partial_t u(x,0)=g(x)$?","opts":[{"x":"$u=\\sum_n\\big(a_n\\cos\\omega_n t+\\tfrac{b_n}{\\omega_n}\\sin\\omega_n t\\big)\\sin\\tfrac{n\\pi x}{L}$ con $a_n,b_n$ coefficienti di Fourier di $f,g$","c":true},{"x":"$u=\\sum_n a_n e^{-\\omega_n t}\\sin\\tfrac{n\\pi x}{L}$"}],"hint":"$T_n$ oscilla (non decade): il dato di velocita' fissa il coefficiente del seno con un $1/\\omega_n$.","sol":"Sviluppo di Fourier in seni: $a_n=\\frac2L\\int_0^L f\\sin(n\\pi x/L)dx$, $b_n=\\frac2L\\int_0^L g\\sin(n\\pi x/L)dx$. Da $\\partial_t u(x,0)=g$ si ha $\\omega_n\\cdot(\\text{coeff. seno})=b_n$, quindi $u=\\sum_n(a_n\\cos\\omega_n t+\\tfrac{b_n}{\\omega_n}\\sin\\omega_n t)\\sin(n\\pi x/L)$."}]},{"pool":"edp","src":"pacchetto gaussiano libero di Schroedinger, allargamento via propagatore · da MIT 18.303 PS6 · manuale","steps":[{"t":"$i\\,\\partial_t\\psi=-\\tfrac{\\hbar}{2m}\\partial_x^2\\psi$ su tutta la retta, dato $\\psi(x,0)=(2\\pi\\sigma_0^2)^{-1/4}e^{-x^2/(4\\sigma_0^2)}$. Qual e' il propagatore libero $K(x,x',t)$ da convolvere col dato?","opts":[{"x":"$K=\\sqrt{\\dfrac{m}{2\\pi i\\hbar t}}\\,\\exp\\!\\Big(\\dfrac{im(x-x')^2}{2\\hbar t}\\Big)$","c":true},{"x":"$K=\\sqrt{\\dfrac{m}{2\\pi\\hbar t}}\\,\\exp\\!\\Big(-\\dfrac{m(x-x')^2}{2\\hbar t}\\Big)$ (reale, come il calore)"},{"x":"$K=\\dfrac{1}{\\sqrt{4\\pi t}}e^{-(x-x')^2/(4t)}$"}],"hint":"Schroedinger libera = calore con tempo IMMAGINARIO $t\\to it$: il nucleo ha fase, non decadimento.","sol":"Il propagatore libero e' $K=\\sqrt{\\tfrac{m}{2\\pi i\\hbar t}}\\exp\\!\\big(\\tfrac{im(x-x')^2}{2\\hbar t}\\big)$: e' il nucleo del calore con $D\\to i\\hbar/(2m)$. La sostituzione $t\\to it$ trasforma gaussiana reale in oscillatoria. $\\psi(x,t)=\\int K(x,x',t)\\psi(x',0)\\,dx'$.","cont":"Integrale gaussiano"},{"t":"La convoluzione di due gaussiane (una col fattore $1/(4\\sigma_0^2)$, una col fattore complesso $-im/(2\\hbar t)$) resta gaussiana. Qual e' l'ingrediente di calcolo?","opts":[{"x":"Integrale gaussiano $\\int e^{-ax'^2+bx'}dx'=\\sqrt{\\pi/a}\\,e^{b^2/(4a)}$, valido anche con $a$ complesso (Re$\\,a>0$)","c":true},{"x":"Il teorema dei residui, chiudendo il contorno"},{"x":"La formula di Parseval"}],"hint":"Completa il quadrato nell'esponente in $x'$ e usa la formula gaussiana con parametro complesso.","sol":"Si completa il quadrato in $x'$ e si applica $\\int_{-\\infty}^\\infty e^{-ax'^2+bx'}dx'=\\sqrt{\\pi/a}\\,e^{b^2/(4a)}$ (prolungamento analitico a $a$ complesso con parte reale positiva). Il risultato e' una gaussiana in $x$ con varianza complessa dipendente da $t$.","cont":"Larghezza nel tempo"},{"t":"La densita' $|\\psi(x,t)|^2$ resta gaussiana con larghezza $\\sigma(t)$. Quanto vale $\\sigma(t)^2$?","opts":[{"x":"$\\sigma(t)^2=\\sigma_0^2+\\Big(\\dfrac{\\hbar t}{2m\\sigma_0}\\Big)^2$","c":true},{"x":"$\\sigma(t)^2=\\sigma_0^2-\\Big(\\dfrac{\\hbar t}{2m\\sigma_0}\\Big)^2$, il pacchetto si restringe"},{"x":"$\\sigma(t)^2=\\sigma_0^2$, larghezza costante"}],"hint":"La varianza complessa e' $\\sigma_0^2+i\\hbar t/(2m)$; il modulo quadro della gaussiana ha larghezza col MODULO.","sol":"La varianza complessa vale $\\Sigma(t)=\\sigma_0^2+i\\hbar t/(2m)$; $|\\psi|^2\\propto\\exp(-x^2/(2\\sigma(t)^2))$ con $\\sigma(t)^2=|\\Sigma|^2/\\sigma_0^2=\\sigma_0^2+(\\hbar t/(2m\\sigma_0))^2$. Il pacchetto si ALLARGA monotonamente.","cont":"Perche' si allarga"},{"t":"Perche' il pacchetto si allarga, e perche' cio' e' compatibile con la conservazione della norma $\\int|\\psi|^2dx=1$?","opts":[{"x":"Le componenti di Fourier (momenti $p=\\hbar k$) hanno velocita' di gruppo $p/m$ diverse: la dispersione $\\omega=\\hbar k^2/2m$ e' non lineare, quindi il pacchetto si sparpaglia. La norma resta $1$ perche' l'evoluzione e' unitaria: l'ampiezza cala mentre la larghezza cresce","c":true},{"x":"Si allarga perche' perde norma nel tempo"},{"x":"Si allarga per effetto di una forza esterna"}],"hint":"Relazione di dispersione libera $\\omega(k)=\\hbar k^2/(2m)$: velocita' di gruppo $d\\omega/dk$ dipende da $k$. E la norma?","sol":"L'allargamento e' pura dispersione: $\\omega=\\hbar k^2/2m$ non lineare $\\Rightarrow$ velocita' di gruppo $\\hbar k/m$ dipende dal momento $\\Rightarrow$ componenti veloci e lente si separano. La conservazione della norma (unitarieta' dell'evoluzione di Schroedinger) impone che l'area resti $1$: il picco $\\propto1/\\sqrt{\\sigma(t)}$ scende mentre $\\sigma$ sale. E' la ragione fisica per cui un'osservabile ($\\Delta x$) cresce senza violare la probabilita' totale.","cont":"Regimi limite"},{"t":"Comportamenti a $t\\to0$ e $t\\to\\infty$?","opts":[{"x":"$t\\to0$: $\\sigma\\to\\sigma_0$ (si recupera il dato); $t\\to\\infty$: $\\sigma\\approx\\hbar t/(2m\\sigma_0)$, cresce linearmente nel tempo","c":true},{"x":"$t\\to\\infty$: $\\sigma$ satura a un valore finito"},{"x":"$t\\to0$: $\\sigma\\to\\infty$"}],"hint":"Nella formula $\\sigma^2=\\sigma_0^2+(\\hbar t/2m\\sigma_0)^2$ quale termine domina nei due limiti?","sol":"Per $t\\to0$ domina $\\sigma_0^2$: si recupera il pacchetto iniziale (consistenza). Per $t\\to\\infty$ domina il secondo termine: $\\sigma(t)\\sim\\hbar t/(2m\\sigma_0)$, crescita lineare. Nota il paradosso apparente: un pacchetto inizialmente stretto ($\\sigma_0$ piccolo) si allarga PIU' in fretta, perche' contiene momenti piu' alti (principio di indeterminazione)."}]},{"pool":"edp","src":"Laplace sull'anello (corona circolare), il termine logaritmico · da MIT 18.303 PS5 · manuale","steps":[{"t":"$\\Delta u=0$ sull'anello $a<r<b$ con dati radiali $u(a,\\theta)=V_1$, $u(b,\\theta)=V_2$ costanti. Data la simmetria, quale forma ha $u$?","opts":[{"x":"$u=u(r)$ solo radiale (nessuna dipendenza da $\\theta$), perche' i dati sono costanti in $\\theta$","c":true},{"x":"$u=u(r)\\cos\\theta$"},{"x":"$u=u(\\theta)$ solo angolare"}],"hint":"Se i dati al bordo non dipendono da $\\theta$, per unicita' nemmeno la soluzione.","sol":"Con dati indipendenti da $\\theta$, il modo $m=0$ e' l'unico attivato; per il teorema di unicita' del problema di Dirichlet la soluzione eredita la simmetria: $u=u(r)$.","cont":"ODE radiale m=0"},{"t":"Il modo $m=0$ del Laplaciano polare da' $\\frac1r\\frac{d}{dr}(r\\,u')=0$. Soluzione generale?","opts":[{"x":"$u(r)=A+B\\ln r$","c":true},{"x":"$u(r)=A+Br$"},{"x":"$u(r)=A r+B/r$"}],"hint":"$(r u')'=0\\Rightarrow r u'=$ cost $\\Rightarrow u'\\propto1/r$.","sol":"$(r u')'=0\\Rightarrow r u'=B\\Rightarrow u'=B/r\\Rightarrow u=A+B\\ln r$. Il logaritmo e' la soluzione radiale armonica del modo $m=0$ in 2D.","cont":"Perche' il logaritmo qui"},{"t":"Perche' il termine $\\ln r$ e' AMMESSO sull'anello ma va SCARTATO sul disco pieno?","opts":[{"x":"Sul disco $r<b$ il centro $r=0$ appartiene al dominio e $\\ln r\\to-\\infty$: va scartato per regolarita'. Sull'anello $a>0$ il centro e' escluso, $\\ln r$ e' finito e legittimo","c":true},{"x":"$\\ln r$ e' sempre scartato, anche sull'anello"},{"x":"$\\ln r$ e' ammesso ovunque"}],"hint":"Dove $\\ln r$ diverge? Quel punto sta nel dominio del disco? E in quello dell'anello?","sol":"$\\ln r\\to-\\infty$ in $r=0$. Sul disco pieno il centro e' interno, quindi la regolarita' impone $B=0$ (via il modo del disco): resta solo $u=$cost per $m=0$. Sull'anello $0<a<r<b$ il centro e' fuori dal dominio, $\\ln r$ e' regolare e va tenuto. E' la topologia del dominio (anello non semplicemente connesso) a decidere lo spazio delle soluzioni.","cont":"Imposizione dati"},{"t":"Imponendo $u(a)=V_1$, $u(b)=V_2$, quanto valgono $A,B$?","opts":[{"x":"$B=\\dfrac{V_2-V_1}{\\ln(b/a)}$, $A=V_1-B\\ln a$","c":true},{"x":"$B=\\dfrac{V_2-V_1}{b-a}$, $A=V_1-Ba$"},{"x":"$B=V_2-V_1$, $A=V_1$"}],"hint":"Sistema $A+B\\ln a=V_1$, $A+B\\ln b=V_2$: sottrai.","sol":"Sottraendo le due condizioni: $B(\\ln b-\\ln a)=V_2-V_1\\Rightarrow B=\\tfrac{V_2-V_1}{\\ln(b/a)}$; poi $A=V_1-B\\ln a$. Il profilo e' logaritmico in $r$, non lineare: firma della geometria cilindrica 2D.","cont":"Modi angolari generali"},{"t":"Se invece i dati dipendessero da $\\theta$, la soluzione generale sull'anello includerebbe:","opts":[{"x":"$u=A+B\\ln r+\\sum_{m\\ge1}(C_m r^m+D_m r^{-m})(\\alpha_m\\cos m\\theta+\\beta_m\\sin m\\theta)$: sull'anello sopravvivono SIA $r^m$ SIA $r^{-m}$","c":true},{"x":"Solo i termini $r^m$ (come sul disco), i $r^{-m}$ si scartano sempre"},{"x":"Solo $r^{-m}$ (come nel problema esterno)"}],"hint":"Sul disco $r^{-m}$ si scarta (diverge in $0$); sull'anello ne' $r^m$ ne' $r^{-m}$ divergono nel dominio.","sol":"Le soluzioni angolari del Laplaciano 2D sono $r^{\\pm m}e^{\\pm im\\theta}$. Sul disco $r^{-m}$ diverge in $0$ e si scarta; nel problema esterno $r^m$ diverge all'infinito e si scarta. Sull'anello NESSUNA delle due diverge nel dominio: entrambe sopravvivono. Ancora una volta il dominio seleziona la base ammissibile.","cont":"Caso limite"},{"t":"Nel limite $a\\to0^+$ (l'anello degenera nel disco) cosa succede al coefficiente $B$ del logaritmo?","opts":[{"x":"$B=\\dfrac{V_2-V_1}{\\ln(b/a)}\\to0$ perche' $\\ln(b/a)\\to+\\infty$: il logaritmo si spegne e resta $u\\to V_2$ costante, coerente con la regolarita' sul disco","c":true},{"x":"$B\\to\\infty$, il logaritmo domina"},{"x":"$B$ resta invariato"}],"hint":"$\\ln(b/a)\\to+\\infty$ per $a\\to0$: cosa fa $B$?","sol":"Per $a\\to0$, $\\ln(b/a)\\to\\infty$ quindi $B\\to0$: il termine $\\ln r$ si annulla e $u\\to V_2$ costante. Il limite riproduce correttamente il caso del disco (dove il modo $m=0$ regolare e' solo la costante). Consistenza fra le due geometrie."}]},{"pool":"edp","src":"calore con sorgente interna costante, decomposizione s
