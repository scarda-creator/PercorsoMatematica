l, sempre"},{"x":"calcolando la primitiva reale di $f(x)e^{-ikx}$"}],"hint":"L'integrale reale &egrave; un lato di un contorno chiuso: l'arco aggiunto deve svanire, e ci&ograve; seleziona il semipiano.","sol":"<b>Teorema dei residui applicato alla trasformata.</b> Si scrive $\\hat f(k)=\\int f(z)e^{-ikz}dz$ lungo l'asse reale, si chiude con una semicirconferenza in un semipiano e, se l'arco svanisce, $\\hat f(k)=\\pm2\\pi i\\sum\\mathrm{Res}$ sui poli racchiusi. La scelta del semipiano NON &egrave; libera: la fissa il segno di $k$ tramite $|e^{-ikz}|=e^{k\\,\\mathrm{Im}\\,z}$ (nucleo 13, sottotipo $c$)."}]},{"pool":"fourier","src":"20230704 Es.3","steps":[{"t":"MODUS OPERANDI. Con la convenzione $\\hat f(k)=\\int f(x)e^{-ikx}dx$, per $k>0$ si chiude il contorno:","opts":[{"x":"nel semipiano INFERIORE ($\\mathrm{Im}\\,z<0$): l&igrave; $|e^{-ikz}|=e^{k\\,\\mathrm{Im}\\,z}$ &egrave; esponenzialmente piccolo e l'arco svanisce","c":true},{"x":"nel semipiano superiore, sempre, indipendentemente dal segno di $k$"},{"x":"nel semipiano superiore per $k>0$ (come per l'antitrasformata)"},{"x":"a scelta: i due semipiani danno lo stesso risultato"}],"hint":"$|e^{-ikz}|=|e^{-ik(x+iy)}|=e^{ky}$: con $k>0$ questo decade dove $y=\\mathrm{Im}\\,z<0$. L'esponenziale schiaccia l'arco solo l&igrave;.","sol":"<b>Lemma di Jordan e scelta obbligata del semipiano.</b> Con $e^{-ikx}$ e $k>0$, il fattore $e^{-ikz}$ decade nel semipiano inferiore: si chiude SOTTO. Per $k<0$ si chiude SOPRA. Chiudere dalla parte sbagliata &egrave; l'errore n.1 del corso: l'arco esplode e il risultato &egrave; privo di senso. Attenzione: l'antitrasformata ha $e^{+ikx}$, quindi la regola si INVERTE (nucleo 13). &Egrave; il punto dove si perde l'esercizio."}]},{"pool":"fourier","src":"tipo &middot; nucleo 13","steps":[{"t":"Il <b>lemma di Jordan</b> garantisce che l'arco svanisce sotto quale ipotesi?","opts":[{"x":"$f(z)\\to0$ uniformemente sull'arco quando $R\\to\\infty$ (basta $|f|\\le M/R^{\\alpha}$, $\\alpha>0$): pi&ugrave; debole della stima ML pura","c":true},{"x":"$f$ deve decadere come $1/R^{2}$, come per i razionali senza esponenziale"},{"x":"$f$ deve essere pari"},{"x":"$f$ deve essere olomorfa ovunque"}],"hint":"&Egrave; il fattore $e^{-ikz}$, esponenzialmente piccolo nel semipiano giusto, ad aiutare: permette a $f$ di decadere pi&ugrave; lentamente che nel sottotipo dei razionali puri.","sol":"<b>Lemma di Jordan.</b> Se $f(z)\\to0$ uniformemente sull'arco per $R\\to\\infty$, allora $\\int_{C_R}f(z)e^{ikz}dz\\to0$ nel semipiano dove $e^{ikz}$ decade. La condizione &egrave; PIU DEBOLE di quella del sottotipo $(a)$ (razionali puri, che chiedono $\\deg Q\\ge\\deg P+2$): qui basta $\\deg Q\\ge\\deg P+1$, perch&eacute; l'esponenziale fa il resto. Per questo $\\frac{z}{z^2+4}$ va bene con $e^{ikz}$ ma non da solo."}]},{"pool":"fourier","src":"20230704 Es.3","steps":[{"t":"Chiudendo nel semipiano INFERIORE il contorno risulta percorso in senso orario. Conseguenza:","opts":[{"x":"$\\hat f(k)=-2\\pi i\\sum_{\\mathrm{Im}\\,z_j<0}\\mathrm{Res}$: compare il segno meno dal verso orario","c":true},{"x":"$\\hat f(k)=+2\\pi i\\sum\\mathrm{Res}$, il verso non conta"},{"x":"$\\hat f(k)=-\\pi i\\sum\\mathrm{Res}$, mezzo residuo"},{"x":"l'integrale &egrave; sempre nullo perch&eacute; il verso &egrave; orario"}],"hint":"Il teorema dei residui d&agrave; $+2\\pi i\\sum\\mathrm{Res}$ in senso ANTIorario; il semipiano inferiore si percorre al contrario.","sol":"<b>Segno del verso (teorema dei residui).</b> $\\oint=2\\pi i\\sum\\mathrm{Res}$ vale in senso antiorario; chiudendo sotto il cammino &egrave; orario, quindi $\\hat f(k>0)=-2\\pi i\\sum_{\\mathrm{Im}\\,z_j<0}\\mathrm{Res}$. Dimenticare questo meno inverte il segno della trasformata: nella soluzione ufficiale del 04/07/2023 il $-2\\pi i$ &egrave; esattamente ci&ograve; che produce $\\hat f(k>0)=\\frac{i\\pi}{3}e^{-k}$ con il segno giusto."}]},{"pool":"fourier","src":"tipo &middot; b01","steps":[{"t":"MODUS OPERANDI. Riconosci il tipo &laquo;trasformata di Fourier via residui&raquo; e ne imposti l'attacco: la sequenza corretta &egrave;:","opts":[{"x":"(1) prolunga a $f(z)e^{-ikz}$; (2) trova i poli e la loro parte immaginaria; (3) per OGNI segno di $k$ scegli il semipiano dove l'arco svanisce; (4) somma i residui racchiusi col segno del verso; (5) ricomponi con $\\theta(k)$","c":true},{"x":"calcola una primitiva e valuti agli estremi $\\pm\\infty$"},{"x":"sostituisci $z=e^{i\\theta}$ e integri sul cerchio unitario"},{"x":"sviluppi in serie di Fourier e leggi i coefficienti"}],"hint":"La distinzione $k>0$ / $k<0$ va fatta SEMPRE e per prima: sono due conti diversi che poi si fondono in una formula con la funzione gradino.","sol":"<b>Strategia d'attacco (mappa b01).</b> Il tipo si riconosce da un integrale $\\int_{-\\infty}^{+\\infty}$ di una razionale (o razionale$\\times$gaussiana) contro $e^{-ikx}$. Ordine invariante: prolungamento, poli, semipiano per ciascun segno di $k$ (lemma di Jordan), somma residui col verso, ricomposizione via $\\theta(k)$. Saltare la separazione dei segni &egrave; la causa n.1 di risposta incompleta."}]},{"pool":"fourier","src":"tipo &middot; nucleo 13","steps":[{"t":"Se un polo di $f$ cade ESATTAMENTE sull'asse reale (cammino), la trasformata:","opts":[{"x":"si definisce col valore principale di Cauchy e il polo contribuisce con MEZZO residuo ($\\pm i\\pi\\,\\mathrm{Res}$)","c":true},{"x":"non esiste in nessun senso"},{"x":"contribuisce col residuo intero $2\\pi i\\,\\mathrm{Res}$"},{"x":"si annulla per simmetria"}],"hint":"Il polo si aggira con una rientranza semicircolare di raggio $\\varepsilon$: l'arco piccolo d&agrave; una FRAZIONE del giro, non zero.","sol":"<b>Valore principale e regola del mezzo residuo (Sokhotski-Plemelj).</b> Per un polo SEMPLICE $x_0\\in\\mathbb{R}$ la rientranza semicircolare contribuisce $\\pm i\\pi\\,\\mathrm{Res}(f,x_0)$ (segno dal verso). Formalmente $\\frac{1}{x-x_0\\pm i\\epsilon}=\\mathrm{P}\\frac{1}{x-x_0}\\mp i\\pi\\delta(x-x_0)$. Vale SOLO per poli semplici: con un polo doppio sull'asse la rientranza diverge e il valore principale non esiste (nucleo 13, tappa 04)."}]},{"pool":"fourier","src":"20240910 Es.2","steps":[{"t":"Per $\\int_{-\\infty}^{+\\infty}\\frac{\\cos x}{e^x+e^{-x}}dx$ la funzione ha INFINITI poli su $z=\\pm i\\pi/2+i2k\\pi$. Perch&eacute; NON si usa la semicirconferenza?","opts":[{"x":"perch&eacute; il semicerchio racchiuderebbe infiniti poli: si usa un percorso RETTANGOLARE che ne cattura uno solo","c":true},{"x":"perch&eacute; la funzione non &egrave; olomorfa"},{"x":"perch&eacute; l'integrale diverge"},{"x":"perch&eacute; $\\cos x$ non &egrave; limitato"}],"hint":"I poli sono allineati verticalmente e spaziati di $2\\pi$: un arco che cresce ne inghiotte una quantit&agrave; infinita. Serve un cammino di altezza FISSA.","sol":"<b>Percorso rettangolare (compito 10/09/2024).</b> Con poli periodici lungo l'asse immaginario, la semicirconferenza racchiude infiniti residui e non chiude. Si sceglie un rettangolo di altezza $\\pi$: il lato superiore $z=x+i\\pi$ d&agrave; $f(x+i\\pi)=-e^{-\\pi}g(x)$, cio&egrave; $\\int_{\\gamma_3}=-e^{-\\pi}\\int_{\\gamma_1}$ (proporzionale, non opposto), e $K(1+e^{-\\pi})=2\\pi i\\,\\mathrm{Res}_{i\\pi/2}$. Risultato $I=\\frac{\\pi}{2\\cosh(\\pi/2)}$. La chiave &egrave; che i due lati orizzontali sono proporzionali per periodicit&agrave; dell'esponenziale."}]},{"pool":"fourier","src":"Set 3 es.2","steps":[{"t":"I coefficienti della serie di Fourier ESPONENZIALE di $f\\in L^2[-\\pi,\\pi]$ sono:","opts":[{"x":"$f_n=\\frac{1}{\\sqrt{2\\pi}}\\int_{-\\pi}^{\\pi}f(x)e^{-inx}dx$, e $f(x)=\\frac{1}{\\sqrt{2\\pi}}\\sum_{n=-\\infty}^{\\infty}f_n e^{inx}$","c":true},{"x":"$f_n=\\int_{-\\pi}^{\\pi}f(x)e^{inx}dx$, senza normalizzazione"},{"x":"$f_n=f(n)$, il campionamento della funzione"},{"x":"$f_n=\\frac{d^n f}{dx^n}(0)/n!$"}],"hint":"La base $\\{e^{inx}/\\sqrt{2\\pi}\\}$ &egrave; ortonormale su $[-\\pi,\\pi]$: il coefficiente &egrave; il prodotto scalare $\\langle e^{inx}/\\sqrt{2\\pi}\\,|\\,f\\rangle$.","sol":"<b>Coefficienti di Fourier (proiezione su base ortonormale).</b> $\\{\\varphi_n=e^{inx}/\\sqrt{2\\pi}\\}$ &egrave; base ortonormale di $L^2[-\\pi,\\pi]$; $f_n=\\langle\\varphi_n,f\\rangle$. La forma trigonometrica $a_n,b_n$ &egrave; equivalente (combinazioni di $f_n,f_{-n}$): si sceglie l'esponenziale quando il calcolo dell'integrale &egrave; pi&ugrave; pulito, la trigonometrica quando $f$ &egrave; reale pari/dispari (met&agrave; dei coefficienti si annullano per simmetria)."}]},{"pool":"fourier","src":"20240115 Es.4","steps":[{"t":"In un punto $x_0$ di DISCONTINUIT&Agrave; a salto, la serie di Fourier $S(x_0)$ converge a:","opts":[{"x":"la semisomma dei limiti destro e sinistro, $\\tfrac12\\big(f(x_0^+)+f(x_0^-)\\big)$, NON a $f(x_0)$","c":true},{"x":"$f(x_0)$, sempre"},{"x":"$\\max(f(x_0^+),f(x_0^-))$"},{"x":"zero"}],"hint":"Il valore puntuale $f(x_0)$ &egrave; irrilevante: la serie &laquo;non vede&raquo; il singolo punto, media i due rami.","sol":"<b>Teorema di Dirichlet.</b> Se $f$ &egrave; regolare a tratti, la serie di Fourier converge a $\\tfrac12(f(x_0^+)+f(x_0^-))$ in ogni punto; dove $f$ &egrave; continua ci&ograve; coincide con $f(x_0)$, ma in un salto d&agrave; la MEDIA. Usare $f(x_0)$ al posto della semisomma quando $f$ &egrave; discontinua &egrave; la trappola dominante delle identit&agrave; numeriche (mappa b01): produce un'equazione sbagliata per la somma della serie."}]},{"pool":"fourier","src":"tipo &middot; b01","steps":[{"t":"MODUS OPERANDI. Per estrarre un'IDENTIT&Agrave; numerica (tipo $\\sum 1/n^2$) da una serie di Fourier, la mossa &egrave;:","opts":[{"x":"valutare la serie in un punto scelto ($x=0$ o $x=\\pm\\pi$) e uguagliarla al valore della funzione l&igrave;: $f(x_0)$ se continua, la semisomma se discontinua","c":true},{"x":"derivare la serie termine a termine e porre $x=0$"},{"x":"integrare la serie su tutto il periodo"},{"x":"prendere il limite $n\\to\\infty$ dei coefficienti"}],"hint":"L'identit&agrave; nasce uguagliando i DUE modi di scrivere lo stesso numero: la serie valutata in $x_0$ e il valore (o la semisomma) di $f$ in $x_0$. Il punto va scelto per far comparire la somma voluta.","sol":"<b>Strategia delle identit&agrave; (Set 3, compiti 2024).</b> Si sceglie $x_0$ in modo che i $\\cos(nx_0)$ o $e^{inx_0}$ producano la somma cercata: $x_0=0$ d&agrave; $\\sum a_n$ (segni tutti $+$ o alternati), $x_0=\\pi$ d&agrave; $\\sum(-1)^n a_n$. Poi si applica il <b>teorema di Dirichlet</b>: uguagliare a $f(x_0)$ (se continua) o alla semisomma (se salto). La distinzione continuit&agrave;/salto DECIDE il secondo membro: &egrave; il passo dove il conto vive o muore."}]},{"pool":"fourier","src":"20231116 Es.3","steps":[{"t":"L'antitrasformata $\\hat{\\hat f}(x)=\\int\\frac{dk}{2\\pi}\\hat f(k)e^{ikx}$ si calcola coi residui: per $x>0$ si chiude:","opts":[{"x":"nel semipiano SUPERIORE ($\\mathrm{Im}\\,k>0$): con $e^{+ikx}$ e $x>0$ &egrave; l&igrave; che l'esponenziale decade &mdash; regola INVERTITA rispetto alla trasformata diretta","c":true},{"x":"nel semipiano inferiore, come per la trasformata diretta con $k>0$"},{"x":"a scelta, il risultato non dipende dal semipiano"},{"x":"non si pu&ograve; chiudere: l'antitrasformata si fa solo numericamente"}],"hint":"Ora l'esponente &egrave; $+ikx$: $|e^{ikx}|=e^{-x\\,\\mathrm{Im}\\,k}$; con $x>0$ decade dove $\\mathrm{Im}\\,k>0$. Il segno opposto rispetto a $e^{-ikx}$ inverte la regola.","sol":"<b>Antitrasformata (lemma di Jordan, segno invertito).</b> Il nucleo &egrave; ora $e^{+ikx}$: per $x>0$ si chiude SOPRA, per $x<0$ SOTTO &mdash; l'opposto della trasformata diretta, per via del segno dell'esponente. Nel 16/11/2023, $\\hat f(k)=\\frac{1}{1-ik}+\\frac{1}{(1+ik)^2}$: per $x>0$ contribuisce il polo doppio in $k=i$ (secondo termine) $\\to xe^{-x}$; per $x<0$ il polo semplice in $k=-i$ $\\to e^{x}$. Si riottiene $f(x)$ ovunque tranne il salto."}]},{"pool":"fourier","src":"20231116 Es.3","steps":[{"t":"Nel punto $x=0$, dove $f(x)=xe^{-x}\\theta(x)+e^x\\theta(-x)$ &egrave; discontinua, l'antitrasformata $\\hat{\\hat f}(0)$ vale:","opts":[{"x":"$\\tfrac12\\big(f(0^+)+f(0^-)\\big)=\\tfrac12(0+1)=\\tfrac12$, per lo stesso teorema di Dirichlet delle serie","c":true},{"x":"$f(0)=1$"},{"x":"$0$, perch&eacute; $xe^{-x}$ si annulla in $0$"},{"x":"diverge, l'integrale non converge"}],"hint":"$f(0^+)=0\\cdot e^0=0$ (ramo $xe^{-x}$), $f(0^-)=e^0=1$ (ramo $e^x$): la trasformata inversa media i due, non prende un ramo solo.","sol":"<b>Dirichlet anche per la trasformata (compito 16/11/2023).</b> Nel salto l'integrale di antitrasformata converge alla semisomma $\\tfrac12(f(0^+)+f(0^-))=\\tfrac12$, in perfetta analogia col teorema di Dirichlet per le serie. La soluzione ufficiale lo dichiara senza calcolare l'integrale (che l&igrave; &egrave; divergente e va regolarizzato): il valore &egrave; imposto dalla struttura, non dal conto."}]},{"pool":"fourier","src":"Set 3 es.6","steps":[{"t":"Per $f\\in L^1(\\mathbb{R})$ con poli in $C$, la VELOCIT&Agrave; di decadimento di $\\hat f(k)$ per $k\\to+\\infty$ &egrave; controllata da:","opts":[{"x":"la pi&ugrave; piccola $|\\mathrm{Im}|$ fra i poli del semipiano INFERIORE (quelli che contano per $k>0$): $\\hat f(k)\\sim e^{-|\\mathrm{Im}\\,z^-_{\\min}|\\,k}$","c":true},{"x":"la parte reale del polo pi&ugrave; vicino all'origine"},{"x":"il numero totale di poli"},{"x":"il polo con parte immaginaria pi&ugrave; grande in modulo"}],"hint":"Per $k>0$ si chiude sotto: ogni residuo porta $e^{k\\,\\mathrm{Im}\\,z^-}$ con $\\mathrm{Im}\\,z^-<0$; il termine che muore pi&ugrave; lentamente domina, ed &egrave; quello col polo pi&ugrave; VICINO all'asse reale.","sol":"<b>Decadimento e posizione dei poli (Set 3 es.6).</b> Chiudendo sotto per $k>0$, $\\hat f(k)=-2\\pi i\\sum_i c_i^- e^{k\\,\\mathrm{Im}\\,z_i^-}$: il decadimento pi&ugrave; lento (il polo pi&ugrave; vicino all'asse) domina. Simmetricamente, per $k\\to-\\infty$ contano i poli SUPERIORI. Verifica sulla lorentziana $\\frac{1}{x^2+a^2}$: poli in $\\pm ia$, $\\hat f(k)=\\frac{\\pi}{a}e^{-a|k|}$ &mdash; il tasso $a$ &egrave; proprio $|\\mathrm{Im}|$ del polo. &Egrave; il principio dietro al confronto $\\hat f$ vs $\\hat g$ del 04/07/2023."}]},{"pool":"fourier","src":"20230704 Es.3","steps":[{"t":"$f(x)=\\frac{1}{(x^2+1)(x-2i)}$: trasformata via residui. Poli e semipiano per $k>0$:","opts":[{"x":"poli in $z=\\pm i$ e $z=2i$; per $k>0$ si chiude SOTTO, dentro sta solo $z=-i$","c":true},{"x":"poli in $z=\\pm i,\\,2i$; per $k>0$ si chiude sopra, dentro $z=i$ e $z=2i$"},{"x":"un solo polo in $z=2i$; si chiude sopra"},{"x":"nessun polo: la trasformata &egrave; nulla"}],"hint":"$x^2+1=(x-i)(x+i)$: tre poli, di cui $z=i$ e $z=2i$ nel semipiano superiore e $z=-i$ in quello inferiore. Con $k>0$ chiudi sotto.","sol":"<b>Poli e chiusura (compito 04/07/2023).</b> $\\hat f(k)=\\int\\frac{e^{-ikz}}{(z^2+1)(z-2i)}dz$; poli $\\pm i,2i$. Per $k>0$ il lemma di Jordan impone il semipiano inferiore: l'unico polo racchiuso &egrave; $z=-i$ (verso orario $\\Rightarrow$ segno $-2\\pi i$).","cont":"Calcola il residuo in $z=-i$ &rarr;"},{"t":"Il residuo in $z=-i$ e quindi $\\hat f(k>0)$:","opts":[{"x":"$\\mathrm{Res}_{-i}=-\\tfrac{e^{-k}}{6}$, quindi $\\hat f(k>0)=-2\\pi i\\cdot(-\\tfrac{e^{-k}}{6})=\\tfrac{i\\pi}{3}e^{-k}$","c":true},{"x":"$\\hat f(k>0)=\\tfrac{\\pi}{3}e^{-k}$ (reale)"},{"x":"$\\hat f(k>0)=-\\tfrac{i\\pi}{3}e^{k}$"},{"x":"$\\hat f(k>0)=2\\pi i\\,e^{-k}$"}],"hint":"$\\lim_{z\\to-i}(z+i)\\frac{e^{-ikz}}{(z-i)(z+i)(z-2i)}=\\frac{e^{-k}}{(-2i)(-3i)}$; poi moltiplica per $-2\\pi i$.","sol":"<b>Formula del quoziente + verso orario (verificato ufficialmente).</b> $\\mathrm{Res}_{-i}=\\frac{e^{-ik(-i)}}{(-i-i)(-i-2i)}=\\frac{e^{-k}}{(-2i)(-3i)}=\\frac{e^{-k}}{-6}$. Con il $-2\\pi i$ del verso orario: $\\hat f(k>0)=\\frac{i\\pi}{3}e^{-k}$. Il risultato &egrave; immaginario puro: coerente, perch&eacute; $f$ non &egrave; reale.","cont":"Ora $k<0$ e la forma compatta &rarr;"},{"t":"Per $k<0$ (chiusura sopra, poli $i$ e $2i$) e ricomposizione con $\\theta$:","opts":[{"x":"$\\hat f(k<0)=i\\pi\\big(e^{k}-\\tfrac{2}{3}e^{2k}\\big)$; compatto $\\hat f(k)=\\tfrac{i\\pi}{3}e^{-k}\\theta(k)+i\\pi(e^{k}-\\tfrac{2}{3}e^{2k})\\theta(-k)$","c":true},{"x":"$\\hat f(k<0)=0$"},{"x":"$\\hat f(k<0)=\\tfrac{i\\pi}{3}e^{k}$"},{"x":"$\\hat f(k)=\\tfrac{i\\pi}{3}e^{-|k|}$ per ogni $k$"}],"hint":"Per $k<0$ chiudi sopra (verso antiorario, $+2\\pi i$) e sommi i residui in $z=i$ e $z=2i$. La funzione gradino $\\theta$ incolla i due regimi.","sol":"<b>Ricomposizione via $\\theta(k)$ (verificato ufficialmente).</b> Per $k<0$: $+2\\pi i[\\mathrm{Res}_i+\\mathrm{Res}_{2i}]=i\\pi(e^{k}-\\tfrac{2}{3}e^{2k})$. La forma compatta $\\hat f(k)=\\frac{i\\pi}{3}e^{-k}\\theta(k)+i\\pi(e^{k}-\\frac{2}{3}e^{2k})\\theta(-k)$ &egrave; obbligatoria: il termine gradino NON &egrave; un dettaglio estetico, distingue i due semipiani (trappola b01). La parte $g$ dell'esercizio confronta i decadimenti via posizione dei poli."}]},{"pool":"fourier","src":"20240910 Es.3","steps":[{"t":"$f(x)=\\frac{1}{(x+i)(x-1+2i)}$: entrambi i poli sono $z=-i$ e $z=1-2i$, con $\\mathrm{Im}<0$. Cosa succede per $k<0$?","opts":[{"x":"si chiude SOPRA, dove NON ci sono poli: $\\hat f(k<0)=0$","c":true},{"x":"si chiude sopra e si prendono entrambi i residui"},{"x":"si chiude sotto anche per $k<0$"},{"x":"la trasformata diverge"}],"hint":"Entrambi i poli stanno nel semipiano inferiore. Per $k<0$ si chiude nel superiore, che &egrave; vuoto: integrale nullo.","sol":"<b>Semipiano vuoto $\\Rightarrow$ trasformata nulla (compito 10/09/2024).</b> Con tutti i poli in $\\mathrm{Im}\\,z<0$, per $k<0$ (chiusura superiore, lemma di Jordan) non c'&egrave; nulla dentro il contorno: $\\hat f(k<0)=0$. La trasformata &egrave; supportata solo su $k>0$: $\\hat f(k)=[\\cdots]\\,\\theta(k)$.","cont":"Calcola il caso $k>0$ &rarr;"},{"t":"Per $k>0$ (chiusura sotto, verso orario) la trasformata &egrave;:","opts":[{"x":"$\\hat f(k)=-2\\pi i\\Big(\\tfrac{e^{-k}}{i-1}+\\tfrac{e^{-2k-ik}}{1-i}\\Big)\\theta(k)$","c":true},{"x":"$\\hat f(k)=+2\\pi i\\big(\\mathrm{Res}_{-i}+\\mathrm{Res}_{1-2i}\\big)$"},{"x":"$\\hat f(k)=-2\\pi i\\,\\mathrm{Res}_{-i}$ soltanto"},{"x":"$\\hat f(k)=\\pi i\\,e^{-k}$"}],"hint":"Entrambi i poli sono racchiusi; $\\mathrm{Res}_{-i}=\\frac{e^{-k}}{-i-1+2i}=\\frac{e^{-k}}{i-1}$ e $\\mathrm{Res}_{1-2i}=\\frac{e^{-2k-ik}}{1-i}$; poi $-2\\pi i$ per il verso.","sol":"<b>Somma dei residui col segno orario (verificato ufficialmente).</b> $\\mathrm{Res}_{-i}=\\frac{e^{-ik(-i)}}{(-i-1+2i)}=\\frac{e^{-k}}{i-1}$; $\\mathrm{Res}_{1-2i}=\\frac{e^{-ik(1-2i)}}{(1-2i+i)}=\\frac{e^{-2k-ik}}{1-i}$. Il verso orario d&agrave; $\\hat f(k)=-2\\pi i\\big(\\frac{e^{-k}}{i-1}+\\frac{e^{-2k-ik}}{1-i}\\big)\\theta(k)$. Il caso in cui i poli stanno tutti da un lato &egrave; il pi&ugrave; rapido: met&agrave; della retta d&agrave; zero."}]},{"pool":"fourier","src":"20231116 Es.3","steps":[{"t":"$f(x)=xe^{-x}\\theta(x)+e^x\\theta(-x)$: la trasformata si calcola come somma di due integrali elementari. $\\hat f(k)$ vale:","opts":[{"x":"$\\hat f(k)=\\dfrac{1}{1-ik}+\\dfrac{1}{(1+ik)^2}$","c":true},{"x":"$\\hat f(k)=\\dfrac{1}{1+ik}+\\dfrac{1}{1-ik}$"},{"x":"$\\hat f(k)=\\dfrac{1}{(1-ik)^2}$"},{"x":"$\\hat f(k)=\\dfrac{2}{1+k^2}$"}],"hint":"$\\int_{-\\infty}^0 e^{(1-ik)x}dx=\\frac{1}{1-ik}$; $\\int_0^\\infty x e^{-(1+ik)x}dx=-\\frac{d}{d\\alpha}\\frac{1}{\\alpha}\\big|_{\\alpha=1+ik}=\\frac{1}{(1+ik)^2}$.","sol":"<b>Trasformata diretta via integrali (compito 16/11/2023).</b> Il ramo $e^x\\theta(-x)$ d&agrave; $\\frac{1}{1-ik}$; il ramo $xe^{-x}\\theta(x)$ si ottiene con il trucco $x\\,e^{-\\alpha x}=-\\frac{d}{d\\alpha}e^{-\\alpha x}$ valutato in $\\alpha=1+ik$, dando $\\frac{1}{(1+ik)^2}$ (polo DOPPIO, non semplice). Questi qui non richiedono nemmeno i residui, ma li richiede l'antitrasformata.","cont":"Verifica in $x=0$ &rarr;"},{"t":"Antitrasformando, per $x=0$ (punto di discontinuit&agrave;) si trova:","opts":[{"x":"$\\hat{\\hat f}(0)=\\tfrac12$, semisomma dei limiti $\\tfrac12(0+1)$","c":true},{"x":"$\\hat{\\hat f}(0)=1$"},{"x":"$\\hat{\\hat f}(0)=0$"},{"x":"$\\hat{\\hat f}(0)=\\tfrac14$"}],"hint":"L'antitrasformata ricostruisce $f$ per $x\\neq0$; nel salto d&agrave; la media dei due rami $f(0^+)=0$ e $f(0^-)=1$.","sol":"<b>Chiusura del conto via Dirichlet.</b> Per $x\\neq0$ l'antitrasformata riproduce $f$; in $x=0$, salto fra $0$ e $1$, d&agrave; la semisomma $\\tfrac12$. Non serve calcolare l'integrale divergente: il <b>teorema di Dirichlet</b> (esteso alla trasformata) fissa il valore. &Egrave; il gemello continuo dell'identit&agrave; delle serie."}]},{"pool":"fourier","src":"Set 3 es.7","steps":[{"t":"$f_2(x)=\\dfrac{x}{(1+x^2)^2}=\\dfrac{x}{(x-i)^2(x+i)^2}$: che natura hanno i poli e come si procede per $k>0$?","opts":[{"x":"poli DOPPI in $\\pm i$; per $k>0$ si chiude sotto e si usa la formula del polo doppio (una derivata) in $z=-i$","c":true},{"x":"poli semplici in $\\pm i$; residuo diretto"},{"x":"un polo quadruplo in $0$"},{"x":"nessun polo: si integra per parti"}],"hint":"$(1+x^2)^2$ al denominatore raddoppia ogni zero: $\\pm i$ diventano poli di ordine 2. Il residuo di un polo doppio richiede $\\frac{d}{dz}$.","sol":"<b>Poli doppi (Set 3 es.7).</b> $\\mathrm{Res}(f_2 e^{-ikz},-i)=\\lim_{z\\to-i}\\frac{d}{dz}\\big[(z+i)^2 f_2 e^{-ikz}\\big]$: la formula del polo di ordine $m=2$ chiede UNA derivata. Chiudere sotto per $k>0$ (Jordan) porta il verso orario, quindi $-2\\pi i$.","cont":"Il risultato compatto &rarr;"},{"t":"Il risultato per ogni $k$ &egrave;:","opts":[{"x":"$\\hat f_2(k)=-\\dfrac{i\\pi}{4}\\,k\\,e^{-|k|}$","c":true},{"x":"$\\hat f_2(k)=\\dfrac{\\pi}{4}e^{-|k|}$"},{"x":"$\\hat f_2(k)=-\\dfrac{i\\pi}{4}e^{-|k|}$ (senza il fattore $k$)"},{"x":"$\\hat f_2(k)=\\dfrac{i\\pi}{4}k^2 e^{-|k|}$"}],"hint":"Per $k>0$ esce $-\\frac{i\\pi}{4}ke^{-k}$, per $k<0$ (polo $+i$) $-\\frac{i\\pi}{4}ke^{k}$: si fondono in $ke^{-|k|}$.","sol":"<b>Trasformata di un polo doppio (verificato ufficialmente).</b> $\\hat f_2(k)=-\\frac{i\\pi}{4}ke^{-|k|}$: il fattore lineare $k$ &egrave; la firma del polo doppio (deriva dalla derivata nel residuo). $f_2$ &egrave; dispari e reale $\\Rightarrow$ $\\hat f_2$ &egrave; immaginaria pura e dispari: due controlli di coerenza superati."}]},{"pool":"fourier","src":"Set 3 es.7","steps":[{"t":"$f_3(x)=\\dfrac{\\cos(ax)}{x^2+b^2}$ ($a,b>0$). Scrivendo $\\cos(ax)=\\tfrac12(e^{iax}+e^{-iax})$, quanti CASI in $k$ occorre distinguere?","opts":[{"x":"tre: $k>a$, $-a<k<a$, $k<-a$ &mdash; perch&eacute; i due esponenziali cambiano semipiano a soglie diverse","c":true},{"x":"uno solo: si chiude sempre sopra"},{"x":"due: $k>0$ e $k<0$"},{"x":"nessuno: la trasformata &egrave; costante"}],"hint":"Ogni esponenziale $e^{\\pm iax}e^{-ikx}=e^{-i(k\\mp a)x}$ ha il proprio segno di frequenza $k\\mp a$: le due soglie sono $k=a$ e $k=-a$.","sol":"<b>Distinzione dei casi in $k$ (Set 3 es.7).</b> $\\frac12 e^{iax}$ porta frequenza $k-a$, $\\frac12 e^{-iax}$ porta $k+a$; ciascun termine si chiude nel proprio semipiano secondo il segno della SUA frequenza. Le soglie $k=\\pm a$ generano tre regioni. NON si forzano entrambi gli esponenziali nello stesso contorno: vogliono semipiani opposti quando $-a<k<a$.","cont":"La forma compatta &rarr;"},{"t":"Ricomponendo i tre casi, la trasformata &egrave;:","opts":[{"x":"$\\hat f_3(k)=\\dfrac{\\pi}{2b}\\big(e^{-b|k-a|}+e^{-b|a+k|}\\big)$","c":true},{"x":"$\\hat f_3(k)=\\dfrac{\\pi}{b}e^{-b|k|}$"},{"x":"$\\hat f_3(k)=\\dfrac{\\pi}{2b}e^{-b|k|}\\cos(ab)$"},{"x":"$\\hat f_3(k)=\\dfrac{\\pi}{2b}\\big(e^{-b|k-a|}-e^{-b|a+k|}\\big)$"}],"hint":"Ogni polo $\\pm ib$ d&agrave; un $\\frac{\\pi}{2b}$; i moduli $|k-a|$ e $|k+a|$ raccolgono i tre casi in una sola formula.","sol":"<b>Trasformata di $\\cos(ax)/(x^2+b^2)$ (verificato ufficialmente).</b> I tre regimi si fondono in $\\hat f_3(k)=\\frac{\\pi}{2b}(e^{-b|k-a|}+e^{-b|a+k|})$. La struttura a due lorentziane traslate a $\\pm a$ &egrave; la firma della modulazione $\\cos(ax)$: la moltiplicazione per $\\cos(ax)$ nello spazio $x$ trasla lo spettro di $\\pm a$ (teorema di modulazione)."}]},{"pool":"fourier","src":"Set 3 es.2","steps":[{"t":"$f_a(x)=e^{ax}$ su $[-\\pi,\\pi]$. I coefficienti esponenziali e la somma $s_1=\\sum_{n=1}^{\\infty}\\frac{(-1)^n}{n^2+a^2}$ si ottengono cos&igrave;: prima $f_n$, poi si valuta in $x=0$. I coefficienti sono:","opts":[{"x":"$f_n=\\sqrt{\\tfrac{2}{\\pi}}\\,\\dfrac{(-1)^n\\sinh(a\\pi)}{a-in}$","c":true},{"x":"$f_n=\\dfrac{\\sinh(a\\pi)}{a+in}$"},{"x":"$f_n=\\dfrac{(-1)^n}{a^2+n^2}$"},{"x":"$f_n=e^{an}$"}],"hint":"$f_n=\\frac{1}{\\sqrt{2\\pi}}\\int_{-\\pi}^{\\pi}e^{(a-in)x}dx=\\frac{1}{\\sqrt{2\\pi}}\\frac{e^{(a-in)\\pi}-e^{-(a-in)\\pi}}{a-in}$; ricorda $e^{\\mp in\\pi}=(-1)^n$.","sol":"<b>Coefficienti di $e^{ax}$ (Set 3 es.2, verificato).</b> $f_n=\\frac{1}{\\sqrt{2\\pi}}\\frac{e^{(a-in)\\pi}-e^{-(a-in)\\pi}}{a-in}=\\sqrt{\\frac{2}{\\pi}}\\frac{(-1)^n\\sinh(a\\pi)}{a-in}$, usando $e^{\\pm in\\pi}=(-1)^n$ e la definizione di $\\sinh$. Questi coefficienti generano tutte e tre le somme $s_1,s_2,s_3$ dell'esercizio.","cont":"Valuta in $x=0$ (continuo) &rarr;"},{"t":"In $x=0$ la funzione &egrave; CONTINUA ($f(0)=1$). Uguagliando $S_a(0)=f(0)$ si ottiene:","opts":[{"x":"$s_1=\\dfrac{1}{2a}\\Big(\\dfrac{\\pi}{\\sinh(\\pi a)}-\\dfrac{1}{a}\\Big)$","c":true},{"x":"$s_1=\\dfrac{\\pi}{a}\\coth(\\pi a)$"},{"x":"$s_1=\\dfrac{\\pi^2}{6}$"},{"x":"$s_1=\\dfrac{1}{a^2}$"}],"hint":"$S_a(0)=\\frac{\\sinh(a\\pi)}{\\pi}\\big[\\frac1a+2a\\,s_1\\big]$ e va posto uguale a $f(0)=1$ perch&eacute; $e^{ax}$ &egrave; continua in $0$.","sol":"<b>Identit&agrave; via continuit&agrave; in $x=0$ (verificato ufficialmente).</b> $S_a(0)=\\frac{\\sinh(a\\pi)}{\\pi}(\\frac1a+2a\\,s_1)$; poich&eacute; $f$ &egrave; continua in $0$, il <b>teorema di Dirichlet</b> d&agrave; $S_a(0)=f(0)=1$, da cui $s_1=\\frac{1}{2a}(\\frac{\\pi}{\\sinh\\pi a}-\\frac1a)$. Il punto $x=0$ &egrave; scelto perch&eacute; l&igrave; $f$ &egrave; continua: nessuna semisomma, si usa $f(0)$ direttamente."}]},{"pool":"fourier","src":"Set 3 es.2","steps":[{"t":"Stessa $f_a(x)=e^{ax}$, ma ora si valuta in $x=\\pi$ per ottenere $s_2=\\sum_{n=-\\infty}^{\\infty}\\frac{1}{n^2+a^2}$. Quale valore prende la serie in $\\pi$?","opts":[{"x":"la semisomma $\\tfrac12(f_a(\\pi)+f_a(-\\pi))=\\tfrac12(e^{a\\pi}+e^{-a\\pi})=\\cosh(a\\pi)$: in $\\pi$ la funzione periodica &egrave; DISCONTINUA","c":true},{"x":"$f_a(\\pi)=e^{a\\pi}$, la funzione &egrave; continua"},{"x":"$0$, per antisimmetria"},{"x":"$1$, come in $x=0$"}],"hint":"Estendendo $e^{ax}$ periodicamente, in $x=\\pi$ i due rami valgono $e^{a\\pi}$ (da sinistra) ed $e^{-a\\pi}$ (da destra, cio&egrave; $-\\pi$): salto.","sol":"<b>Identit&agrave; via DISCONTINUIT&Agrave; in $x=\\pi$ (verificato ufficialmente).</b> La periodicizzazione di $e^{ax}$ ha un salto in $\\pi$: per il <b>teorema di Dirichlet</b> $S_a(\\pi)=\\tfrac12(e^{a\\pi}+e^{-a\\pi})=\\cosh(a\\pi)$, NON $e^{a\\pi}$. &Egrave; il contrasto istruttivo con $s_1$: stessa funzione, punto continuo ($0$) vs punto di salto ($\\pi$) &mdash; il secondo membro cambia natura.","cont":"Concludi $s_2$ &rarr;"},{"t":"Da $S_a(\\pi)=\\cosh(a\\pi)$ segue:","opts":[{"x":"$s_2=\\dfrac{\\pi}{a}\\coth(\\pi a)=\\dfrac{\\pi}{a}\\dfrac{\\cosh(a\\pi)}{\\sinh(a\\pi)}$","c":true},{"x":"$s_2=\\dfrac{\\pi}{a}\\tanh(\\pi a)$"},{"x":"$s_2=\\dfrac{\\pi^2}{6}$"},{"x":"$s_2=\\dfrac{1}{a^2}$"}],"hint":"$S_a(\\pi)=\\frac{a\\sinh(a\\pi)}{\\pi}s_2$; poni uguale a $\\cosh(a\\pi)$ e isola $s_2$.","sol":"<b>Somma bilatera $s_2$ (verificato ufficialmente).</b> $S_a(\\pi)=\\frac{a\\sinh(a\\pi)}{\\pi}s_2=\\cosh(a\\pi)$ d&agrave; $s_2=\\frac{\\pi}{a}\\coth(\\pi a)$. Verifica di coerenza: ponendo $a=b$ in $s_3$ si riottiene $s_2$ (usando $\\sinh 2x=2\\sinh x\\cosh x$), come richiede l'esercizio."}]},{"pool":"fourier","src":"20240115 Es.4","steps":[{"t":"$f(x)=\\frac{(x+\\pi)^2}{\\pi}$ su $(-\\pi,0)$ e $0$ su $(0,\\pi)$. Per l'identit&agrave; $\\sum_{n\\ge1}\\frac1{n^2}$ si valuta in $x=0$, dove $f$ &egrave; DISCONTINUA. Quanto vale $S(0)$?","opts":[{"x":"la semisomma $\\tfrac12(f(0^+)+f(0^-))=\\tfrac12(0+\\pi)=\\tfrac{\\pi}{2}$","c":true},{"x":"$f(0)=0$ (ramo destro)"},{"x":"$f(0)=\\pi$ (ramo sinistro)"},{"x":"$0$, media nulla"}],"hint":"$f(0^+)=0$ (dal ramo nullo su $(0,\\pi)$), $f(0^-)=\\frac{(0+\\pi)^2}{\\pi}=\\pi$: la serie prende la MEDIA, non un ramo.","sol":"<b>Teorema di Dirichlet nel salto (compito 15/01/2024).</b> In $x=0$ la funzione periodica salta fra $\\pi$ (sinistra) e $0$ (destra): $S(0)=\\tfrac12(\\pi+0)=\\tfrac{\\pi}{2}$. Usare $f(0)$ (che vale $0$ o $\\pi$ a seconda del ramo) al posto della semisomma d&agrave; l'equazione sbagliata: &egrave; la trappola centrale del tipo (mappa b01).","cont":"Uguaglia alla serie e concludi &rarr;"},{"t":"Con $f_0=\\frac{1}{\\sqrt{2\\pi}}\\frac{\\pi^2}{3}$ e $f_n+f_{-n}=\\frac{1}{\\sqrt{2\\pi}}\\frac{4}{n^2}$, imporre $S(0)=\\frac{\\pi}{2}$ d&agrave;:","opts":[{"x":"$\\frac{1}{2\\pi}\\big[\\frac{\\pi^2}{3}+4\\sum_{n\\ge1}\\frac1{n^2}\\big]=\\frac{\\pi}{2}\\Rightarrow\\sum_{n\\ge1}\\frac1{n^2}=\\frac{\\pi^2}{6}$","c":true},{"x":"$\\sum_{n\\ge1}\\frac1{n^2}=\\frac{\\pi^2}{8}$"},{"x":"$\\sum_{n\\ge1}\\frac1{n^2}=\\frac{\\pi^2}{12}$"},{"x":"$\\sum_{n\\ge1}\\frac1{n^2}=\\frac{\\pi}{2}$"}],"hint":"$S(0)=\\frac{1}{\\sqrt{2\\pi}}[f_0+\\sum(f_n+f_{-n})]=\\frac{1}{2\\pi}[\\frac{\\pi^2}{3}+4\\sum\\frac1{n^2}]$; poni uguale a $\\frac{\\pi}{2}$.","sol":"<b>Identit&agrave; di Basilea $\\zeta(2)=\\frac{\\pi^2}{6}$ (verificato ufficialmente).</b> $\\frac{1}{2\\pi}[\\frac{\\pi^2}{3}+4\\sum\\frac1{n^2}]=\\frac{\\pi}{2}\\Rightarrow\\frac{\\pi^2}{3}+4\\sum\\frac1{n^2}=\\pi^2\\Rightarrow\\sum_{n\\ge1}\\frac1{n^2}=\\frac{\\pi^2}{6}$. La semisomma $\\frac{\\pi}{2}$ del passo precedente &egrave; ci&ograve; che rende l'equazione corretta: cambiando il secondo membro cambia la costante di Basilea."}]},{"pool":"fourier","src":"20240703 Es.3","steps":[{"t":"$f(x)=e^{|x|}$ su $[-1,1]$ ($L=2$), funzione PARI. I coefficienti trigonometrici sono:","opts":[{"x":"$b_n=0$ per parit&agrave;; $a_n=\\dfrac{2(-1)^n(e-1)}{1+\\pi^2n^2}$ e termine costante $e-1$","c":true},{"x":"$a_n=0$ per parit&agrave;; solo $b_n\\neq0$"},{"x":"$a_n=\\dfrac{2(e-1)}{n^2}$"},{"x":"$a_n=\\dfrac{(-1)^n}{1+n^2}$, termine costante $0$"}],"hint":"$f$ pari $\\Rightarrow$ serie di soli coseni ($b_n=0$). L'integrale $\\int_0^1 e^x\\cos(\\pi nx)dx$ d&agrave; il denominatore $1+\\pi^2 n^2$ e il segno $(-1)^n$ da $\\cos(\\pi n)$.","sol":"<b>Coefficienti di $e^{|x|}$ (compito 03/07/2024, verificati).</b> Per parit&agrave; $b_n=0$; integrando $a_n=\\int_{-1}^1 e^{|x|}\\cos(\\pi nx)dx=\\frac{2(-1)^n(e-1)}{1+\\pi^2n^2}$, con termine costante $e-1$. Sono i coefficienti veri della soluzione ufficiale; su di essi poggia l'identit&agrave; numerica.","cont":"Valuta in $x=0$ &rarr;"},{"t":"In $x=0$ la funzione $e^{|x|}$ &egrave; CONTINUA. Il teorema di Dirichlet impone quindi:","opts":[{"x":"$S(0)=f(0)=e^0=1$ &mdash; nessuna semisomma, perch&eacute; non c'&egrave; salto","c":true},{"x":"$S(0)=\\tfrac12(e+e)=e$, semisomma"},{"x":"$S(0)=0$"},{"x":"$S(0)=e-1$"}],"hint":"$e^{|x|}$ &egrave; continua in $0$ (i due rami $e^{x}$ ed $e^{-x}$ combaciano): la serie converge al valore vero $f(0)=1$.","sol":"<b>Continuit&agrave; in $x=0$ (Dirichlet).</b> $e^{|x|}$ &egrave; continua in $0$: $S(0)=f(0)=1$, senza semisomma. Uguagliando $S(0)=e-1+2\\sum_{n\\ge1}\\frac{(-1)^n(e-1)}{1+\\pi^2n^2}$ a $1$ si ottiene un'identit&agrave; per la somma alternante. NOTA DI ONEST&Agrave;: il valore numerico di CHIUSURA di quella somma non lo asserisco qui &mdash; la stampa ufficiale del 03/07/2024 presenta, fra enunciato e passaggio finale, due forme che non ho saputo riconciliare (numeratore $-1+(-1)^n e$ contro $(-1)^n(e-1)$, e costante $(1-e)/2$ contro $(2-e)/2$). Il meccanismo &egrave; solido; il numero finale resta da verificare su fonte pulita."}]},{"pool":"fourier","src":"20240910 Es.2","steps":[{"t":"$\\int_{-\\infty}^{+\\infty}\\frac{\\cos x}{e^x+e^{-x}}dx$ col rettangolo di altezza $\\pi$ ($\\gamma_1$ asse reale, $\\gamma_3$ a quota $i\\pi$). I lati verticali $\\gamma_2,\\gamma_4$:","opts":[{"x":"svaniscono per $R\\to\\infty$: l'integrando $\\sim e^{-y}/(e^R-e^{-R})\\to0$ sui lati $x=\\pm R$","c":true},{"x":"danno un contributo finito da sommare"},{"x":"sono uguali e opposti, si cancellano fra loro"},{"x":"non vanno considerati"}],"hint":"Sui lati verticali $z=\\pm R+iy$: il denominatore $e^{\\pm R}$ cresce mentre il numeratore resta limitato. Stima diretta $\\to0$.","sol":"<b>Lati verticali del rettangolo (compito 10/09/2024, verificato).</b> Su $\\gamma_2,\\gamma_4$ l'integrando &egrave; maggiorato da $\\frac{e^{-y}}{e^R-e^{-R}}\\to0$: svaniscono. Restano i due lati orizzontali. A differenza della semicirconferenza (che qui racchiuderebbe infiniti poli), il rettangolo di altezza fissa ne cattura uno solo, $z=i\\pi/2$.","cont":"Relaziona i due lati orizzontali &rarr;"},{"t":"Sul lato superiore $z=x+i\\pi$ vale $f(x+i\\pi)=-e^{-\\pi}g(x)$, quindi $\\int_{\\gamma_3}=-e^{-\\pi}\\int_{\\gamma_1}$ (con l'orientazione, $+e^{-\\pi}K$). Il risultato &egrave;:","opts":[{"x":"$K(1+e^{-\\pi})=2\\pi i\\,\\mathrm{Res}_{i\\pi/2}=\\pi e^{-\\pi/2}\\Rightarrow I=\\mathrm{Re}\\,K=\\dfrac{\\pi}{2\\cosh(\\pi/2)}$","c":true},{"x":"$I=\\dfrac{\\pi}{\\cosh(\\pi/2)}$"},{"x":"$I=\\dfrac{\\pi}{2}e^{-\\pi/2}$"},{"x":"$I=2\\pi i\\,e^{-\\pi/2}$"}],"hint":"I due lati orizzontali NON si cancellano ma sono proporzionali via $e^{-\\pi}$: $\\int_{\\gamma_1}+\\int_{\\gamma_3}=K(1+e^{-\\pi})$, uguale a $2\\pi i$ per il residuo racchiuso.","sol":"<b>Percorso rettangolare, chiusura (verificato ufficialmente).</b> Il prolungamento $\\frac{e^{iz}}{e^z+e^{-z}}$ soddisfa $f(x+i\\pi)=-e^{-\\pi}g(x)$: i lati orizzontali sono proporzionali, non opposti, e $K(1+e^{-\\pi})=2\\pi i\\,\\mathrm{Res}_{i\\pi/2}=\\pi e^{-\\pi/2}$. Prendendo la parte reale, $I=\\frac{\\pi}{2\\cosh(\\pi/2)}$. La proporzionalit&agrave; per periodicit&agrave; dell'esponenziale &egrave; ci&ograve; che rende il rettangolo, e non il semicerchio, lo strumento giusto."}]},{"pool":"fourier","src":"Set 3 es.7","steps":[{"t":"La trasformata di $f_1(x)=\\sin(x)e^{-x^2}$ NON usa i residui ma il completamento del quadrato. La strategia &egrave;:","opts":[{"x":"scrivere $\\sin x=\\frac{e^{ix}-e^{-ix}}{2i}$, completare il quadrato all'esponente e usare $\\int e^{-(x+c)^2}dx=\\sqrt{\\pi}$ (valido anche per $c$ complesso)","c":true},{"x":"chiudere il contorno nel semipiano superiore e sommare i residui"},{"x":"sviluppare $e^{-x^2}$ in serie e integrare termine a termine"},{"x":"usare il percorso rettangolare"}],"hint":"La gaussiana non ha poli: niente residui. Il trucco &egrave; ricondurre l'esponente a un quadrato perfetto e usare l'integrale gaussiano noto.","sol":"<b>Trasformata di una gaussiana modulata (Set 3 es.7, verificato).</b> $\\hat f_1(k)=\\frac{1}{2i}\\int[e^{-x^2-i(k-1)x}-e^{-x^2-i(k+1)x}]dx$; completando il quadrato, $\\int e^{-(x+i(k\\mp1)/2)^2}dx=\\sqrt{\\pi}$ (traslazione complessa del cammino, lecita perch&eacute; $e^{-z^2}$ &egrave; intera). Risultato $\\hat f_1(k)=\\frac{\\sqrt{\\pi}}{2i}\\big(e^{-(k-1)^2/4}-e^{-(k+1)^2/4}\\big)$: due gaussiane traslate a $\\pm1$, firma della modulazione $\\sin x$."}]},{"pool":"fourier","src":"Set 3 es.4","steps":[{"t":"$g_2(x)=\\int_{-\\infty}^{+\\infty}\\frac{e^{-(x-y)^2}}{y^2+1}dy$ &egrave; una CONVOLUZIONE. La sua trasformata si ottiene:","opts":[{"x":"come PRODOTTO delle trasformate: $\\hat g_2=\\hat f_1\\cdot\\hat f_2$ con $f_1=e^{-x^2},\\,f_2=\\frac{1}{x^2+1}$, per il teorema di convoluzione","c":true},{"x":"come somma $\\hat f_1+\\hat f_2$"},{"x":"come convoluzione delle trasformate"},{"x":"calcolando l'integrale doppio direttamente"}],"hint":"$g_2=f_1*f_2$: la trasformata di una convoluzione &egrave; il prodotto delle trasformate. Entrambe le trasformate sono note ($\\sqrt\\pi e^{-k^2/4}$ e $\\pi e^{-|k|}$).","sol":"<b>Teorema di convoluzione (Set 3 es.4, verificato).</b> $\\widehat{f_1*f_2}=\\hat f_1\\hat f_2$. Con $\\hat f_1(k)=\\sqrt{\\pi}\\,e^{-k^2/4}$ (gaussiana) e $\\hat f_2(k)=\\pi e^{-|k|}$ (lorentziana, via residui), $\\hat g_2(k)=\\pi^{3/2}e^{-|k|-k^2/4}$. Riconoscere la convoluzione converte un integrale in un prodotto: &egrave; il vantaggio del passaggio in trasformata."}]},{"pool":"fourier","src":"Set 3 es.2","steps":[{"t":"La terza somma $s_3=\\sum_{n=-\\infty}^{\\infty}\\frac{1}{(n+ia)(n-ib)}$ si ricava con una tecnica diversa da $s_1,s_2$. Quale?","opts":[{"x":"il PRODOTTO SCALARE $\\langle S_b|S_a\\rangle$ di due serie con parametri diversi, sfruttando l'ortonormalit&agrave; delle esponenziali","c":true},{"x":"valutando la serie in un ulteriore punto $x_0$"},{"x":"derivando $s_2$ rispetto ad $a$"},{"x":"il teorema dei residui su un cerchio"}],"hint":"$s_3$ mescola DUE parametri $a,b$: nasce dal prodotto scalare di $|S_a\\rangle$ e $|S_b\\rangle$, non dalla valutazione in un punto.","sol":"<b>Somma via prodotto scalare (Set 3 es.2, verificato).</b> $\\langle S_b|S_a\\rangle=\\frac{2}{\\pi}\\sinh(a\\pi)\\sinh(b\\pi)\\sum\\frac{1}{(b+in)(a-in)}$ per l'ortonormalit&agrave; di $\\{e^{inx}\\}$; ma $\\langle S_b|S_a\\rangle=\\int_{-\\pi}^{\\pi}e^{(a+b)x}dx$ perch&eacute; serie e funzione coincidono q.o. (identit&agrave; di Parseval/Plancherel).","cont":"Il risultato &rarr;"},{"t":"Uguagliando le due espressioni di $\\langle S_b|S_a\\rangle$:","opts":[{"x":"$s_3=\\dfrac{\\pi}{a+b}\\dfrac{\\sinh[(a+b)\\pi]}{\\sinh(a\\pi)\\sinh(b\\pi)}$","c":true},{"x":"$s_3=\\dfrac{\\pi}{ab}\\coth(a\\pi)\\coth(b\\pi)$"},{"x":"$s_3=\\dfrac{\\pi^2}{6}$"},{"x":"$s_3=\\dfrac{1}{a+b}$"}],"hint":"$\\int_{-\\pi}^{\\pi}e^{(a+b)x}dx=\\frac{2\\sinh[(a+b)\\pi]}{a+b}$; isola la somma.","sol":"<b>Somma a due parametri $s_3$ (verificato ufficialmente).</b> $s_3=\\frac{\\pi}{a+b}\\frac{\\sinh[(a+b)\\pi]}{\\sinh(a\\pi)\\sinh(b\\pi)}$. Controllo: per $a=b$, con $\\sinh(2a\\pi)=2\\sinh(a\\pi)\\cosh(a\\pi)$, si riottiene $s_2=\\frac{\\pi}{a}\\coth(a\\pi)$. La coerenza fra $s_2$ e $s_3$ &egrave; la verifica interna dell'esercizio."}]},{"pool":"fourier","src":"tipo &middot; nucleo 13","steps":[{"t":"Per $\\int f(x)\\cos(kx)\\,dx$ via residui, spezzando $\\cos(kx)=\\tfrac12(e^{ikx}+e^{-ikx})$, l'errore da evitare &egrave;:","opts":[{"x":"chiudere ENTRAMBI gli esponenziali nello stesso semipiano: $e^{ikx}$ ed $e^{-ikx}$ decadono in semipiani OPPOSTI, ciascuno va chiuso nel suo","c":true},{"x":"spezzare il coseno: non &egrave; mai lecito"},{"x":"prendere la parte reale alla fine"},{"x":"usare i residui invece della primitiva"}],"hint":"$e^{ikx}$ vuole un semipiano, $e^{-ikx}$ quello opposto: forzarli nello stesso contorno fa esplodere uno dei due archi.","sol":"<b>Semipiani opposti per i due esponenziali (nucleo 13).</b> Si pu&ograve; spezzare $\\cos(kx)$, ma ogni termine va chiuso nel PROPRIO semipiano secondo il segno della sua frequenza (come nei tre casi di $\\cos(ax)/(x^2+b^2)$). In alternativa, si calcola $\\int f(x)e^{ikx}dx$ una volta sola e si prende alla fine parte reale (coseno) o immaginaria (seno): pi&ugrave; sicuro, un solo contorno."}]},{"pool":"fourier","src":"20230704 Es.3","steps":[{"t":"Due funzioni: $f$ ha polo in $z=-i$; $g$ ha poli in $z=1-2i$ e $z=-3+i/2$. Quale $\\hat{}$ decade pi&ugrave; rapidamente per $k\\to+\\infty$?","opts":[{"x":"$\\hat g$: per $k>0$ contano i poli INFERIORI, $g$ ha $z=1-2i$ ($|\\mathrm{Im}|=2$) contro $z=-i$ di $f$ ($|\\mathrm{Im}|=1$), quindi $\\hat g\\sim e^{-2k}$ batte $\\hat f\\sim e^{-k}$","c":true},{"x":"$\\hat f$, perch&eacute; ha un solo polo"},{"x":"decadono ugualmente"},{"x":"$\\hat g$, ma governata dal polo $-3+i/2$"}],"hint":"Per $k\\to+\\infty$ si chiude sotto: domina il polo inferiore pi&ugrave; VICINO all'asse. $f$: $|\\mathrm{Im}|=1$. $g$: fra i poli inferiori c'&egrave; solo $1-2i$, $|\\mathrm{Im}|=2$.","sol":"<b>Confronto dei decadimenti (compito 04/07/2023, verificato).</b> Per $k\\to+\\infty$ conta il polo inferiore con $|\\mathrm{Im}|$ minimo: $f$ decade come $e^{-k}$, $g$ come $e^{-2k}$ (pi&ugrave; veloce). Per $k\\to-\\infty$ contano i poli superiori: $g$ ha $-3+i/2$ ($|\\mathrm{Im}|=1/2$) e decade come $e^{k/2}$, pi&ugrave; lento di $\\hat f\\sim e^{k}$. La posizione dei poli detta la coda della trasformata (Set 3 es.6)."}]},{"pool":"fourier","src":"tipo &middot; b01","steps":[{"t":"Il teorema di Dirichlet interviene sia nelle serie sia nelle trasformate. La distinzione strutturale corretta &egrave;:","opts":[{"x":"in ENTRAMBE, in un salto il valore ricostruito &egrave; la semisomma dei limiti; la serie somma modi DISCRETI $e^{inx}$, la trasformata integra un continuo di modi $e^{ikx}$","c":true},{"x":"il teorema vale solo per le serie, non per le trasformate"},{"x":"nelle trasformate il salto d&agrave; sempre $0$"},{"x":"nelle serie il valore in un salto &egrave; $f(x_0)$, nelle trasformate la semisomma"}],"hint":"Serie e trasformata sono lo stesso principio a spettro discreto vs continuo; il comportamento nei salti (semisomma) &egrave; identico.","sol":"<b>Serie vs trasformata, stesso Dirichlet.</b> La serie di Fourier decompone su modi discreti $e^{inx}$ (dominio finito, spettro $n\\in\\mathbb{Z}$); la trasformata su un continuo $e^{ikx}$ (dominio $\\mathbb{R}$, spettro $k\\in\\mathbb{R}$). In un salto entrambe ricostruiscono la SEMISOMMA $\\tfrac12(f(x_0^+)+f(x_0^-))$: lo si &egrave; visto sia in $\\hat{\\hat f}(0)=\\tfrac12$ (16/11/2023) sia nelle identit&agrave; $\\zeta(2)$ e $\\sum(2n+1)^{-2}$. Cross-domain: in meccanica quantistica questi sono spettro legato (discreto) vs spettro di scattering (continuo) dello stesso operatore."}]},{"pool":"fourier","src":"Set 3 es.3","steps":[{"t":"$f_2(x)=-x$ su $(-1,0)$ e $\\tfrac12$ su $(0,1)$, periodicizzata ($L=2$). Nei punti di salto $x=0$ e $x=1$, il teorema di Dirichlet d&agrave;:","opts":[{"x":"$S(0)=\\tfrac12(f(0^+)+f(0^-))=\\tfrac12(\\tfrac12+0)=\\tfrac14$ e $S(1)=\\tfrac12(f(1^+)+f(1^-))=\\tfrac12(1+\\tfrac12)=\\tfrac34$","c":true},{"x":"$S(0)=\\tfrac12$ e $S(1)=1$, i valori del ramo destro"},{"x":"$S(0)=0$ e $S(1)=\\tfrac12$, i valori del ramo sinistro"},{"x":"$S(0)=S(1)=0$"}],"hint":"In $0$: $f(0^-)=-x|_{0^-}=0$, $f(0^+)=\\tfrac12$. In $1$: $f(1^-)=\\tfrac12$, $f(1^+)=f(-1^+)=-x|_{-1^+}=1$ (periodicit&agrave;). Media, non ramo.","sol":"<b>Dirichlet in due salti (Set 3 es.3, verificato).</b> $S(0)=\\tfrac12(0+\\tfrac12)=\\tfrac14$; $S(1)=\\tfrac12(\\tfrac12+1)=\\tfrac34$, dove $f(1^+)$ si legge dalla periodicizzazione ($=f(-1^+)=1$). Ogni punto di discontinuit&agrave; d&agrave; la sua semisomma indipendentemente: la funzione periodica &laquo;vede&raquo; il salto anche al bordo del periodo.","cont":"Estrai l'identit&agrave; numerica &rarr;"},{"t":"Da $S(0)=\\tfrac14$, con $S(0)=\\tfrac12+\\tfrac1{\\pi^2}\\sum_{n\\ge1}\\frac{(-1)^n-1}{n^2}$, segue:","opts":[{"x":"$\\sum_{n=0}^{\\infty}\\dfrac{1}{(2n+1)^2}=\\dfrac{\\pi^2}{8}$","c":true},{"x":"$\\sum_{n=0}^{\\infty}\\dfrac{1}{(2n+1)^2}=\\dfrac{\\pi^2}{6}$"},{"x":"$\\sum_{n=1}^{\\infty}\\dfrac{1}{n^2}=\\dfrac{\\pi^2}{12}$"},{"x":"$\\sum_{n=0}^{\\infty}\\dfrac{1}{(2n+1)^2}=\\dfrac{\\pi^2}{4}$"}],"hint":"$(-1)^n-1$ vale $0$ per $n$ pari e $-2$ per $n$ dispari: la somma si riduce ai soli dispari, cio&egrave; $\\sum 1/(2n+1)^2$.","sol":"<b>Identit&agrave; dei dispari (verificato ufficialmente).</b> $S(0)=\\tfrac12-\\tfrac2{\\pi^2}\\sum_{n\\ge0}\\frac1{(2n+1)^2}=\\tfrac14\\Rightarrow\\sum_{n\\ge0}\\frac1{(2n+1)^2}=\\frac{\\pi^2}{8}$. Coerente con Basilea: $\\sum\\frac1{n^2}=\\sum_{pari}+\\sum_{dispari}=\\frac14\\zeta(2)+\\frac{\\pi^2}{8}$, che ridà $\\zeta(2)=\\frac{\\pi^2}{6}$. La semisomma $\\tfrac14$ del passo precedente &egrave; ci&ograve; che chiude il conto."}]}],"integrali":[{"pool":"integrali","src":"nucleo 13 &middot; b01","steps":[{"t":"MODUS OPERANDI. Davanti a un integrale reale da calcolare per residui, il PRIMO passo &egrave; scegliere il contorno. Il criterio corretto e':","opts":[{"x":"guardare la FORMA dell'integrando: razionale su $\\mathbb{R}$ &rarr; semicerchio; razionale in $\\cos,\\sin$ su $[0,2\\pi]$ &rarr; $z=e^{i\\theta}$ sul cerchio unitario; fattore $e^{ikx}$ &rarr; semicerchio + lemma di Jordan; potenza non intera o $\\log$ &rarr; keyhole; periodicit&agrave; in $e^x$ con infiniti poli allineati &rarr; rettangolo","c":true},{"x":"usare sempre la semicirconferenza superiore, cambia solo il numero di residui"},{"x":"scegliere il contorno che racchiude piu' poli, per massimizzare i residui"},{"x":"provare un contorno a caso e verificare a posteriori se l'arco svanisce"}],"hint":"Il contorno non si indovina: lo detta la forma dell'integrando. Ogni ingrediente (dominio, presenza di $e^{ikx}$, di una radice, di una periodicit&agrave;) seleziona una geometria precisa.","sol":"<b>Classificazione dei sottotipi (nucleo 13, tappa 03).</b> I quattro (+1) contorni canonici: (a) razionale su tutta la retta &rarr; semicerchio con stima ML; (b) razionale in $\\cos,\\sin$ &rarr; sostituzione $z=e^{i\\theta}$; (c) con $e^{ikx}$ &rarr; semicerchio + lemma di Jordan (semipiano scelto dal segno di $k$); (d) con taglio ($x^\\alpha,\\log,\\sqrt{\\cdot}$) &rarr; keyhole/settore; (e) periodicit&agrave; iperbolica ($e^x+e^{-x}$, infiniti poli) &rarr; rettangolo. La scelta E' l'esercizio: sbagliarla rende l'arco non-svanescente e il conto privo di senso."}]},{"pool":"integrali","src":"nucleo 13","steps":[{"t":"Il lemma di Jordan afferma che, se $f(z)\\to0$ uniformemente sull'arco per $|z|\\to\\infty$, allora per $k>0$:","opts":[{"x":"$\\int_{C_R^{+}}f(z)e^{ikz}\\,dz\\to0$ sull'arco nel semipiano SUPERIORE, perche' $|e^{ikz}|=e^{-k\\,\\mathrm{Im}\\,z}$ e' esponenzialmente piccolo dove $\\mathrm{Im}\\,z>0$","c":true},{"x":"$\\int_{C_R^{+}}f\\,dz\\to0$ senza bisogno del fattore $e^{ikz}$, per qualunque $f$ limitata"},{"x":"l'arco svanisce solo se $|f|\\le M/R^2$, come per le razionali pure"},{"x":"il fattore $e^{ikz}$ non influisce sul comportamento dell'arco"}],"hint":"La forza di Jordan sta nel fattore oscillante $e^{ikz}$: nel semipiano giusto esso decade come esponenziale, e questo permette una condizione su $f$ piu' DEBOLE ($|f|\\to0$) di quella richiesta dal semplice ML.","sol":"<b>Lemma di Jordan (nucleo 13, sottotipo c).</b> Con $|e^{ikz}|=e^{-k\\,\\mathrm{Im}\\,z}$, per $k>0$ il fattore schiaccia l'arco superiore anche se $f$ cala solo come $1/R^{\\alpha}$, $\\alpha>0$. E' questa condizione indebolita a distinguere Jordan dalla stima ML pura (che richiede $|f|\\sim1/R^2$)."}]},{"pool":"integrali","src":"nucleo 13 (sottotipo a)","steps":[{"t":"Per $\\int_{-\\infty}^{+\\infty}\\frac{P(x)}{Q(x)}\\,dx$ con $Q$ senza zeri reali, l'arco $C_R$ della semicirconferenza svanisce quando:","opts":[{"x":"$\\deg Q\\ge\\deg P+2$: allora $\\left|\\int_{C_R}\\right|\\le\\pi R\\cdot\\max_{C_R}\\left|\\tfrac PQ\\right|\\sim\\pi R\\cdot\\tfrac{C}{R^2}\\to0$","c":true},{"x":"$\\deg Q\\ge\\deg P+1$ e' gia' sufficiente"},{"x":"sempre, indipendentemente dai gradi"},{"x":"solo se $Q$ ha grado pari"}],"hint":"La stima ML da' lunghezza $\\times$ massimo $=\\pi R\\cdot\\max_{C_R}|P/Q|$. Perche' tenda a zero serve che $|P/Q|$ cali almeno come $1/R^2$.","sol":"<b>Stima ML / lemma del cerchio grande (nucleo 13).</b> $\\left|\\int_\\gamma f\\right|\\le L(\\gamma)\\cdot\\max_\\gamma|f|$. Sull'arco $L=\\pi R$; per una razionale $|P/Q|\\sim R^{\\deg P-\\deg Q}$, quindi il prodotto tende a $0$ se e solo se $\\deg Q-\\deg P\\ge2$. Con $\\deg Q=\\deg P+1$ il semicerchio nudo NON basta (e infatti l'integrale reale divergerebbe): serve il fattore $e^{ikx}$ e Jordan."}]},{"pool":"integrali","src":"nucleo 13 &middot; 20240618 Es.2","steps":[{"t":"Perche' $\\int\\frac{x\\sin x}{x^2+4}\\,dx$ (con $\\deg Q=\\deg P+1$) si calcola col semicerchio, mentre $\\int\\frac{x}{x^2+4}\\,dx$ (stessi gradi) no?","opts":[{"x":"perche' il primo porta il fattore $e^{ix}$ e cade sotto il lemma di JORDAN (condizione $|f|\\to0$, piu' debole); il secondo e' razionale pura e richiede $\\deg Q\\ge\\deg P+2$, qui violata (infatti $\\int x/(x^2+4)\\,dx$ diverge)","c":true},{"x":"perche' il seno rende l'integrando limitato e quindi convergente"},{"x":"perche' il secondo ha un polo reale"},{"x":"non c'e' differenza: entrambi si calcolano allo stesso modo"}],"hint":"Confronta le due condizioni di svanimento dell'arco: ML pura chiede $1/R^2$, Jordan basta $1/R$ grazie all'esponenziale. Il fattore $e^{ikx}$ e' cio' che salva il caso $\\deg Q=\\deg P+1$.","sol":"<b>Jordan contro ML (nucleo 13).</b> $\\frac{z}{z^2+4}\\sim1/R\\to0$: sufficiente per Jordan (che sfrutta $e^{iz}$) ma NON per la stima ML nuda. Perci&ograve; $\\int\\frac{x\\sin x}{x^2+4}dx=\\pi/e^{2}$ esiste e si calcola, mentre $\\int\\frac{x}{x^2+4}dx$ diverge (solo il valore principale, nullo per disparit&agrave;, ha senso)."}]},{"pool":"integrali","src":"nucleo 13 &middot; b01 (trappola)","steps":[{"t":"TRAPPOLA. Per $\\int_{-\\infty}^{+\\infty}f(x)e^{ikx}\\,dx$ la scelta del semipiano di chiusura e':","opts":[{"x":"$k>0$ &rarr; si chiude SOPRA (residui con $\\mathrm{Im}\\,z_j>0$); $k<0$ &rarr; si chiude SOTTO, e il verso orario introduce un segno: $-2\\pi i\\sum_{\\mathrm{Im}\\,z_j<0}\\mathrm{Res}$","c":true},{"x":"sempre sopra, il segno di $k$ non conta"},{"x":"$k>0$ sotto, $k<0$ sopra"},{"x":"si sceglie il semipiano con piu' poli"}],"hint":"$|e^{ikz}|=e^{-k\\,\\mathrm{Im}\\,z}$: perche' l'arco svanisca serve $k\\,\\mathrm{Im}\\,z>0$. Il segno di $k$ determina il semipiano; sbagliarlo fa ESPLODERE l'arco.","sol":"<b>Lemma di Jordan + trappola censita (b01).</b> La regola: $k>0\\Rightarrow$ sopra, $k<0\\Rightarrow$ sotto (contorno orario, segno meno). E' l'errore piu' frequente dell'intero corso: chiudere dalla parte sbagliata non da' un risultato meno preciso, lo rende privo di giustificazione (l'arco non tende a zero) e sbagliato di segno/parte immaginaria."}]},{"pool":"integrali","src":"nucleo 13","steps":[{"t":"Per calcolare $\\int f(x)\\cos(kx)\\,dx$ conviene:","opts":[{"x":"calcolare $\\int f(x)e^{ikx}\\,dx$ chiudendo in UN solo semipiano e prendere alla fine la parte reale; NON spezzare $\\cos kz=\\tfrac{e^{ikz}+e^{-ikz}}{2}$ dentro il contorno","c":true},{"x":"spezzare $\\cos kz=\\tfrac{e^{ikz}+e^{-ikz}}{2}$ e integrare i due pezzi sullo stesso semicerchio"},{"x":"usare direttamente $\\cos kz$ sul semicerchio superiore"},{"x":"sostituire $z=e^{i\\theta}$"}],"hint":"I due esponenziali $e^{ikz}$ e $e^{-ikz}$ vogliono semipiani OPPOSTI: sullo stesso arco uno dei due esplode sempre.","sol":"<b>Regola dell'esponenziale unico (nucleo 13, sottotipo c).</b> $\\cos kz$ e $\\sin kz$ contengono $e^{-ikz}$, che nel semipiano superiore diverge: non si sostituiscono nel contorno. Si lavora con $\\int f e^{ikz}$ in un solo semipiano e si estraggono Re (per $\\cos$) o Im (per $\\sin$) alla fine. Bonus: si ottengono i due integrali (con $\\cos$ e con $\\sin$) in un colpo solo."}]},{"pool":"integrali","src":"nucleo 13 (esempio canonico)","steps":[{"t":"$\\int_{-\\infty}^{+\\infty}\\frac{\\cos x}{x^2+1}\\,dx$: come si imposta?","opts":[{"x":"si considera $\\int\\frac{e^{ix}}{x^2+1}\\,dx$ con $k=1>0$, si chiude SOPRA (unico polo $z=i$), e alla fine si prende la parte reale","c":true},{"x":"si chiude sotto, perche' $\\cos x>0$"},{"x":"si usa $\\cos z$ direttamente sul semicerchio superiore"},{"x":"si sostituisce $z=e^{i\\theta}$ sul cerchio unitario"}],"hint":"Passa a $e^{ix}$ ($k=1>0$ &rarr; sopra); il polo superiore e' $z=i$, quello inferiore $z=-i$ resta fuori.","sol":"<b>Impostazione (nucleo 13, sottotipo c).</b> $\\cos x=\\mathrm{Re}\\,e^{ix}$; con $k=1>0$ Jordan chiude nel semipiano superiore, dove sta il solo polo $z=i$ di $\\frac{e^{iz}}{z^2+1}$.","cont":"Ora il residuo in $z=i$ &rarr;"},{"t":"Il residuo in $z=i$ di $\\frac{e^{iz}}{z^2+1}$ vale (formula del quoziente, $Q'=2z$):","opts":[{"x":"$\\dfrac{e^{i\\cdot i}}{2i}=\\dfrac{e^{-1}}{2i}$","c":true},{"x":"$\\dfrac{e^{-1}}{2}$"},{"x":"$\\dfrac{e}{2i}$"},{"x":"$\\dfrac{e^{-1}}{i}$"}],"hint":"$\\mathrm{Res}=\\frac{P(i)}{Q'(i)}$ con $P=e^{iz}$, $Q'=2z$; e $e^{i\\cdot i}=e^{-1}$.","sol":"<b>Residuo di un polo semplice (formula $P/Q'$, nucleo 13).</b> $\\mathrm{Res}_{z=i}=\\frac{e^{iz}}{2z}\\big|_{i}=\\frac{e^{-1}}{2i}$.","cont":"Ora chiudi il conto &rarr;"},{"t":"Quindi l'integrale vale:","opts":[{"x":"$2\\pi i\\cdot\\dfrac{e^{-1}}{2i}=\\dfrac{\\pi}{e}$ (gia' reale)","c":true},{"x":"$\\dfrac{2\\pi}{e}$"},{"x":"$\\dfrac{\\pi}{2e}$"},{"x":"$\\pi e$"}],"hint":"$2\\pi i\\cdot\\frac{e^{-1}}{2i}=\\pi e^{-1}$; e' gia' reale, quindi coincide con la parte reale cercata.","sol":"<b>Teorema dei residui (nucleo 13).</b> $\\int_{-\\infty}^{+\\infty}\\frac{\\cos x}{x^2+1}dx=\\mathrm{Re}\\,\\big[2\\pi i\\,\\mathrm{Res}_{z=i}\\big]=\\pi/e$. Valore verificato (nucleo 13). La parte immaginaria nulla da' anche $\\int\\frac{\\sin x}{x^2+1}dx=0$, corretto perche' l'integrando e' dispari."}]},{"pool":"integrali","src":"20240618 Es.2","steps":[{"t":"$\\int_{-\\infty}^{+\\infty}\\frac{x\\sin x}{x^2+1}\\,dx$ (appello 18/06/2024): si prolunga con $\\frac{z\\,e^{iz}}{z^2+1}$, $k=1>0$, chiusura superiore, polo $z=i$. Il residuo e':","opts":[{"x":"$\\dfrac{z\\,e^{iz}}{2z}\\Big|_{z=i}=\\dfrac{e^{i\\cdot i}}{2}=\\dfrac{e^{-1}}{2}$","c":true},{"x":"$\\dfrac{e^{-1}}{2i}$"},{"x":"$\\dfrac{i\\,e^{-1}}{2}$"},{"x":"$\\dfrac{e}{2}$"}],"hint":"Formula del quoziente su $\\frac{z e^{iz}}{z^2+1}$: $\\mathrm{Res}=\\frac{z e^{iz}}{2z}\\big|_{i}$; il fattore $z$ si semplifica.","sol":"<b>Residuo (soluzione ufficiale 18/06/2024).</b> $\\mathrm{Res}_{z=i}\\!\\left[\\frac{z e^{iz}}{z^2+1}\\right]=\\frac{z e^{iz}}{2z}\\big|_{i}=\\frac{e^{-1}}{2}$: il fattore $z$ del numeratore cancella $2z$ del denominatore lasciando $\\frac{e^{iz}}{2}$.","cont":"Ora l'integrale e la sua meta' su $[0,\\infty)$ &rarr;"},{"t":"Con $\\mathrm{Res}_{z=i}=\\frac{e^{-1}}{2}$, quanto valgono $I=\\int_{-\\infty}^{+\\infty}$ e $I_+=\\int_0^{+\\infty}$?","opts":[{"x":"$\\int\\frac{x e^{ix}}{x^2+1}dx=2\\pi i\\cdot\\frac{e^{-1}}{2}=i\\pi e^{-1}$; parte immaginaria $I=\\frac{\\pi}{e}$; e $I_+=\\frac{\\pi}{2e}$ perche' l'integrando reale e' pari","c":true},{"x":"$I=\\frac{\\pi}{e}$ e $I_+=\\frac{\\pi}{e}$ (uguali)"},{"x":"$I=\\frac{2\\pi}{e}$ e $I_+=\\frac{\\pi}{e}$"},{"x":"$I=\\frac{\\pi}{2e}$ e $I_+=\\frac{\\pi}{4e}$"}],"hint":"Prendi la parte IMMAGINARIA di $i\\pi e^{-1}$ per avere $I$; poi $\\frac{x\\sin x}{x^2+1}$ e' pari, quindi $I_+=I/2$.","sol":"<b>Teorema dei residui + parita' (soluzione ufficiale: $I=\\pi/e$, $I_+=\\pi/(2e)$).</b> $I=\\mathrm{Im}(i\\pi e^{-1})=\\pi/e$; e poiche' $\\frac{x\\sin x}{x^2+1}$ e' pari (prodotto di due dispari), $\\int_0^\\infty=\\tfrac12\\int_{-\\infty}^{\\infty}=\\pi/(2e)$. La parita' si applica alla funzione REALE, non al prolungamento con $e^{iz}$."}]},{"pool":"integrali","src":"nucleo 13 (sottotipo a)","steps":[{"t":"$\\int_{-\\infty}^{+\\infty}\\frac{dx}{1+x^4}$: quali poli entrano nel conto e come si semplifica il residuo?","opts":[{"x":"i poli sono le radici quarte di $-1$: $e^{i\\pi/4},e^{i3\\pi/4},e^{i5\\pi/4},e^{i7\\pi/4}$; i due SUPERIORI ($e^{i\\pi/4},e^{i3\\pi/4}$) contano, e $\\mathrm{Res}(z_j)=\\frac{1}{4z_j^3}=-\\frac{z_j}{4}$ usando $z_j^4=-1$","c":true},{"x":"tutti e quattro i poli contano, il semicerchio li racchiude tutti"},{"x":"il polo e' solo $z=i$, di ordine $4$"},{"x":"non ci sono poli, $1+x^4>0$ sempre"}],"hint":"$\\deg Q=4\\ge\\deg P+2=2$: l'arco svanisce e contano solo i poli con $\\mathrm{Im}\\,z>0$. Trucco: $z_j^3=z_j^4/z_j=-1/z_j$, quindi $\\frac{1}{4z_j^3}=-\\frac{z_j}{4}$.","sol":"<b>Sottotipo (a), formula del quoziente (nucleo 13).</b> $Q'=4z^3$; con $z_j^4=-1$ si scrive $\\mathrm{Res}=\\frac{1}{4z_j^3}=\\frac{z_j}{4z_j^4}=-\\frac{z_j}{4}$. E' il trucco che rende immediati i casi $1/(1+x^n)$.","cont":"Ora somma i due residui superiori &rarr;"},{"t":"Con $e^{i\\pi/4}+e^{i3\\pi/4}=i\\sqrt2$, quanto vale l'integrale?","opts":[{"x":"$\\sum\\mathrm{Res}=-\\frac{i\\sqrt2}{4}$, quindi $I=2\\pi i\\left(-\\frac{i\\sqrt2}{4}\\right)=\\frac{\\pi}{\\sqrt2}$","c":true},{"x":"$I=\\frac{\\pi\\sqrt2}{4}$"},{"x":"$I=\\frac{\\pi}{2\\sqrt2}$"},{"x":"$I=\\pi\\sqrt2$"}],"hint":"$\\sum\\mathrm{Res}=-\\tfrac14(e^{i\\pi/4}+e^{i3\\pi/4})=-\\tfrac{i\\sqrt2}{4}$; poi $2\\pi i\\cdot(-\\tfrac{i\\sqrt2}{4})=\\tfrac{\\pi\\sqrt2}{2}$.","sol":"<b>Teorema dei residui (nucleo 13, valore verificato $\\pi/\\sqrt2$).</b> $I=2\\pi i(-\\tfrac{i\\sqrt2}{4})=\\tfrac{\\pi\\sqrt2}{2}=\\tfrac{\\pi}{\\sqrt2}$. Controllo di plausibilit&agrave;: reale e positivo, come deve essere per un integrando positivo."}]},{"pool":"integrali","src":"nucleo 13 (tappa 04)","steps":[{"t":"Aggirando un polo semplice sull'asse reale con una rientranza semicircolare di raggio $\\varepsilon$, il contributo del cerchietto per $\\varepsilon\\to0$:","opts":[{"x":"NON svanisce: vale $\\pm i\\pi\\,\\mathrm{Res}$ (meta' del giro completo), col segno dato dal verso di percorrenza","c":true},{"x":"svanisce sempre, come il cerchio grande"},{"x":"vale $2\\pi i\\,\\mathrm{Res}$, come un giro intero"},{"x":"diverge"}],"hint":"Vicino a un polo semplice $f\\approx\\frac{a_{-1}}{z-x_0}$; su un arco di ampiezza $\\theta$ l'integrale da' $i\\theta a_{-1}$, indipendente da $\\varepsilon$. Per il semicerchio $\\theta=\\pi$.","sol":"<b>Lemma del cerchio piccolo / regola del mezzo residuo (nucleo 13, tappa 04).</b> Su un arco di ampiezza angolare $\\theta$ attorno a un polo semplice, $\\int\\frac{a_{-1}}{z-x_0}\\,dz=i\\theta\\,a_{-1}$: per il semicerchio $\\theta=\\pi$, dunque $\\pm i\\pi\\,\\mathrm{Res}$ (segno dal verso). A differenza del cerchio GRANDE (che svanisce per ML), questo contributo e' finito e va sommato."}]},{"pool":"integrali","src":"nucleo 13 (tappa 04)","steps":[{"t":"Con un polo semplice in $x_0\\in\\mathbb{R}$ SUL cammino, chiudendo sopra, il valore principale di Cauchy vale:","opts":[{"x":"$\\mathrm{P}\\!\\!\\int_{-\\infty}^{+\\infty}f=2\\pi i\\!\\!\\sum_{\\mathrm{Im}\\,z_j>0}\\!\\!\\mathrm{Res}+\\pi i\\!\\!\\sum_{x_j\\in\\mathbb{R}}\\!\\!\\mathrm{Res}$","c":true},{"x":"$2\\pi i\\!\\!\\sum_{\\mathrm{Im}\\,z_j>0}\\mathrm{Res}$ soltanto"},{"x":"$2\\pi i\\sum_{\\text{tutti i poli}}\\mathrm{Res}$"},{"x":"il valore principale non esiste se un polo sta sul cammino"}],"hint":"Il polo reale contribuisce con MEZZO residuo ($\\pi i$, non $2\\pi i$), perche' la rientranza lo aggira di mezzo giro.","sol":"<b>Valore principale + mezzo residuo (nucleo 13, tappa 04).</b> $\\mathrm{P}\\!\\int$ elimina simmetricamente un intorno $\\varepsilon$ del polo; la rientranza semicircolare aggiunge $\\pi i\\,\\mathrm{Res}$ per ciascun polo reale semplice, mentre i poli interni danno il $2\\pi i$ pieno. Vale solo per poli SEMPLICI sull'asse."}]},{"pool":"integrali","src":"nucleo 13","steps":[{"t":"Perche' la rientranza semicircolare da' esattamente META' del residuo, e non un'altra frazione?","opts":[{"x":"perche' su un arco di ampiezza angolare $\\theta$ attorno a un polo semplice $\\int\\frac{a_{-1}}{z-x_0}\\,dz=i\\theta\\,a_{-1}$, indipendente dal raggio; per il semicerchio $\\theta=\\pi$, quindi $i\\pi\\,a_{-1}$","c":true},{"x":"per convenzione di normalizzazione"},{"x":"perche' meta' del polo e' fisicamente dentro il contorno"},{"x":"perche' il residuo si dimezza vicino all'asse reale"}],"hint":"La frazione di residuo e' la frazione di angolo giro: $\\theta/(2\\pi)$ del $2\\pi i\\,\\mathrm{Res}$ completo.","sol":"<b>Frazione di angolo (nucleo 13).</b> Parametrizzando $z-x_0=\\varepsilon e^{i\\vartheta}$, $dz=i\\varepsilon e^{i\\vartheta}d\\vartheta$ e $\\int\\frac{a_{-1}}{z-x_0}dz=a_{-1}\\int i\\,d\\vartheta=i\\theta\\,a_{-1}$: il raggio $\\varepsilon$ scompare. Semicerchio $\\Rightarrow\\theta=\\pi\\Rightarrow i\\pi a_{-1}$. L'argomento usa solo il termine $a_{-1}$: per un polo di ordine $\\ge2$ fallisce (compaiono potenze $\\varepsilon^{-1}$ divergenti)."}]},{"pool":"integrali","src":"nucleo 13 &middot; integrale di Dirichlet","steps":[{"t":"$\\int_0^{+\\infty}\\frac{\\sin x}{x}\\,dx$: come si prepara il calcolo per residui?","opts":[{"x":"si simmetrizza ($\\frac{\\sin x}{x}$ e' pari): $\\int_0^\\infty=\\frac12\\,\\mathrm{Im}\\,\\mathrm{P}\\!\\!\\int_{-\\infty}^{+\\infty}\\frac{e^{ix}}{x}\\,dx$, notando che $\\frac{e^{ix}}{x}$ ha un polo semplice in $0$ (mentre $\\frac{\\sin x}{x}$ e' regolare l&igrave;)","c":true},{"x":"si chiude subito nel semipiano inferiore"},{"x":"si sostituisce $z=e^{i\\theta}$ sul cerchio unitario"},{"x":"si usa il settore di angolo $\\pi/2$"}],"hint":"Passa all'esponenziale $e^{ix}/x$: introduce un polo semplice in $0$ (da cui il valore principale) ma permette Jordan.","sol":"<b>Impostazione (integrale di Dirichlet, nucleo 13).</b> $\\frac{\\sin x}{x}$ e' pari e ha singolarit&agrave; eliminabile in $0$, ma $\\frac{e^{ix}}{x}$ ha polo semplice: da qui il valore principale e la rientranza.","cont":"Ora il contorno &rarr;"},{"t":"Chiudendo sopra con una rientranza che scavalca l'origine, dentro il contorno:","opts":[{"x":"NON c'e' alcun polo ($e^{iz}/z$ e' olomorfa l&igrave;): l'integrale sul cammino chiuso e' $0$, e l'arco grande svanisce per Jordan","c":true},{"x":"c'e' il polo $z=0$, che da' $2\\pi i$"},{"x":"c'e' un polo in $z=i$"},{"x":"il contorno chiuso vale $2\\pi i\\,\\mathrm{Res}_{z=0}$"}],"hint":"La rientranza esclude l'origine dal dominio racchiuso: dentro non resta nessuna singolarita', quindi Cauchy da' zero.","sol":"<b>Teorema di Cauchy (nessun polo interno).</b> La rientranza tiene $z=0$ FUORI dal contorno; $e^{iz}/z$ e' olomorfa nell'interno, quindi $\\oint=0$. L'arco grande svanisce per Jordan ($k=1>0$).","cont":"Ora la rientranza e il valore finale &rarr;"},{"t":"La rientranza (percorsa in verso orario) da' $-i\\pi\\,\\mathrm{Res}(\\frac{e^{iz}}{z},0)=-i\\pi$. Concludendo:","opts":[{"x":"$0=\\mathrm{P}\\!\\!\\int\\frac{e^{ix}}{x}dx-i\\pi\\Rightarrow\\mathrm{P}\\!\\!\\int\\frac{e^{ix}}{x}dx=i\\pi$; la parte immaginaria da' $\\int_{-\\infty}^{\\infty}\\frac{\\sin x}{x}=\\pi$, quindi $\\int_0^{\\infty}\\frac{\\sin x}{x}=\\frac{\\pi}{2}$","c":true},{"x":"$\\int_0^\\infty\\frac{\\sin x}{x}=\\pi$"},{"x":"$\\int_0^\\infty\\frac{\\sin x}{x}=\\frac{\\pi}{4}$"},{"x":"$\\int_0^\\infty\\frac{\\sin x}{x}=1$"}],"hint":"Somma i contributi del cammino chiuso: $0=\\mathrm{P}\\!\\int-i\\pi$. Poi prendi $\\mathrm{Im}$ e dimezza per la parita'.","sol":"<b>Regola del mezzo residuo (valore verificato $\\pi/2$, nucleo 13).</b> $\\mathrm{Res}(\\frac{e^{iz}}{z},0)=1$; rientranza oraria $\\Rightarrow-i\\pi$. Bilancio: $\\mathrm{P}\\!\\int\\frac{e^{ix}}{x}=i\\pi$, la cui parte immaginaria e' $\\int_{-\\infty}^\\infty\\frac{\\sin x}{x}=\\pi$; per parita' $\\int_0^\\infty=\\pi/2$. (La parte reale nulla da' $\\mathrm{P}\\!\\int\\frac{\\cos x}{x}=0$, coerente con l'integrando dispari.)"}]},{"pool":"integrali","src":"nucleo 13","steps":[{"t":"CASO LIMITE. La regola del mezzo residuo per un polo sull'asse reale vale:","opts":[{"x":"solo per poli SEMPLICI; per un polo doppio la rientranza diverge come $\\varepsilon^{-1}$ e il valore principale (in senso di Cauchy) non esiste","c":true},{"x":"per poli di qualunque ordine"},{"x":"solo per poli doppi"},{"x":"solo se il polo e' nell'origine"}],"hint":"L'argomento $\\int a_{-1}/(z-x_0)=i\\theta a_{-1}$ usa SOLO il termine $a_{-1}$; con un polo doppio compare anche $a_{-2}/(z-x_0)^2$, il cui integrale sull'arco va come $1/\\varepsilon$.","sol":"<b>Validit&agrave; del mezzo residuo (nucleo 13).</b> Solo per poli semplici: il termine $a_{-2}(z-x_0)^{-2}$ di un polo doppio integra ad $\\sim\\varepsilon^{-1}$ sull'arco e diverge quando $\\varepsilon\\to0$. Un polo doppio sull'asse rende non-definito anche il valore principale ordinario (serve una regolarizzazione piu' forte)."}]},{"pool":"integrali","src":"nucleo 13 (sottotipo b)","steps":[{"t":"Per $\\int_0^{2\\pi}R(\\cos\\theta,\\sin\\theta)\\,d\\theta$ la sostituzione $z=e^{i\\theta}$ da':","opts":[{"x":"$\\cos\\theta=\\frac{z+z^{-1}}{2},\\ \\sin\\theta=\\frac{z-z^{-1}}{2i},\\ d\\theta=\\frac{dz}{iz}$; l'intervallo $[0,2\\pi]$ diventa il cerchio unitario percorso una volta, e contano i poli con $|z_j|<1$","c":true},{"x":"$\\cos\\theta=\\frac{z-z^{-1}}{2},\\ d\\theta=z\\,dz$"},{"x":"$\\cos\\theta=z,\\ d\\theta=dz$"},{"x":"la sostituzione vale solo se $R$ e' pari in $\\theta$"}],"hint":"$d(e^{i\\theta})=ie^{i\\theta}d\\theta=iz\\,d\\theta$; e $\\theta$ da $0$ a $2\\pi$ e' un giro completo del cerchio unitario.","sol":"<b>Sostituzione $z=e^{i\\theta}$ (nucleo 13, sottotipo b).</b> L'integrale diventa $\\oint_{|z|=1}$ di una razionale in $z$; per il teorema dei residui vale $2\\pi i$ per la somma dei residui dei poli INTERNI al cerchio unitario. E' la spia del sottotipo (b): dominio $[0,2\\pi]$ e razionale in $\\cos,\\sin$."}]},{"pool":"integrali","src":"nucleo 13 (esempio canonico)","steps":[{"t":"$\\int_0^{2\\pi}\\frac{d\\theta}{2+\\cos\\theta}$: dopo $z=e^{i\\theta}$ l'integrale diventa $\\oint\\frac{2\\,dz}{i\\,(z^2+4z+1)}$. Quale polo conta?","opts":[{"x":"le radici sono $z=-2\\pm\\sqrt3$; solo $z_0=-2+\\sqrt3\\approx-0.27$ ha $|z_0|<1$, quindi e' l'unico interno","c":true},{"x":"entrambe le radici $-2\\pm\\sqrt3$ sono interne"},{"x":"il polo e' $z=0$, di ordine $2$"},{"x":"nessun polo e' interno, l'integrale e' $0$"}],"hint":"$2+\\frac{z+z^{-1}}{2}$ moltiplicato per $z$ da' $\\frac12(z^2+4z+1)$; le radici sono $-2\\pm\\sqrt3$. Confronta i moduli con $1$: $-2-\\sqrt3$ e' fuori.","sol":"<b>Sottotipo (b), poli interni (nucleo 13).</b> $z^2+4z+1=0\\Rightarrow z=-2\\pm\\sqrt3$; $|-2+\\sqrt3|<1$ (interno), $|-2-\\sqrt3|>1$ (esterno). Solo $z_0=-2+\\sqrt3$ entra nel conto.","cont":"Ora il residuo e il valore &rarr;"},{"t":"Con la formula del quoziente, $\\mathrm{Res}_{z_0}\\frac{2}{i(z^2+4z+1)}=\\frac{2}{i(2z_0+4)}=\\frac{1}{i\\sqrt3}$. Quindi:","opts":[{"x":"$I=2\\pi i\\cdot\\frac{1}{i\\sqrt3}=\\frac{2\\pi}{\\sqrt3}$","c":true},{"x":"$I=\\frac{\\pi}{\\sqrt3}$"},{"x":"$I=\\frac{2\\pi}{3}$"},{"x":"$I=\\frac{4\\pi}{\\sqrt3}$"}],"hint":"$2z_0+4=2(-2+\\sqrt3)+4=2\\sqrt3$, quindi $\\frac{2}{i\\cdot2\\sqrt3}=\\frac{1}{i\\sqrt3}$; poi $2\\pi i\\cdot\\frac{1}{i\\sqrt3}$.","sol":"<b>Teorema dei residui (valore verificato $2\\pi/\\sqrt3$, nucleo 13).</b> $I=2\\pi i\\cdot\\frac{1}{i\\sqrt3}=\\frac{2\\pi}{\\sqrt3}$. Plausibilit&agrave;: l'integrando sta fra $1/3$ e $1$, quindi $I\\in(2\\pi/3,\\,2\\pi)$; e $2\\pi/\\sqrt3\\approx3.6$ ci sta."}]},{"pool":"integrali","src":"20240115 Es.2","steps":[{"t":"$\\int_0^{\\pi}\\frac{d\\theta}{3-2\\cos\\theta}$ (appello 15/01/2024). L'intervallo e' $[0,\\pi]$, meta' giro. Il primo passo corretto e':","opts":[{"x":"sfruttare la parita' dell'integrando in $\\theta$: $\\int_0^\\pi=\\frac12\\int_{-\\pi}^{\\pi}$, cos&igrave; da coprire il cerchio unitario intero con $z=e^{i\\theta}$","c":true},{"x":"applicare $z=e^{i\\theta}$ direttamente su $[0,\\pi]$, che gia' copre il cerchio"},{"x":"raddoppiare: $\\int_0^\\pi=2\\int_{-\\pi}^{\\pi}$"},{"x":"chiudere con la semicirconferenza superiore"}],"hint":"Il cerchio unitario corrisponde a un giro INTERO ($[-\\pi,\\pi]$ o $[0,2\\pi]$); $[0,\\pi]$ e' mezzo giro. La parita' $\\theta\\to-\\theta$ (perche' $\\cos$ e' pari) permette di estendere con il fattore $\\frac12$.","sol":"<b>Estensione con parita' (trappola censita b01).</b> $3-2\\cos\\theta$ e' pari in $\\theta$, quindi $\\int_0^\\pi=\\frac12\\int_{-\\pi}^\\pi$: il fattore $\\frac12$ e' OBBLIGATORIO e va portato fino in fondo. E' la trappola n.1 del sottotipo (b): dimenticarlo raddoppia il risultato.","cont":"Ora il conto sul cerchio &rarr;"},{"t":"Con $z=e^{i\\theta}$ si ottiene $\\frac{i}{2}\\oint\\frac{dz}{z^2-3z+1}$; radici $z=\\frac{3\\pm\\sqrt5}{2}$, interna solo $z_-$. Il valore finale e':","opts":[{"x":"$\\mathrm{Res}_{z_-}=\\frac{1}{2z_--3}=-\\frac{1}{\\sqrt5}$, quindi $I=\\frac{i}{2}\\cdot2\\pi i\\left(-\\frac{1}{\\sqrt5}\\right)=\\frac{\\pi}{\\sqrt5}$","c":true},{"x":"$I=\\frac{2\\pi}{\\sqrt5}$ (dimenticando il fattore $\\frac12$)"},{"x":"$I=\\frac{\\pi}{5}$"},{"x":"$I=\\frac{\\pi}{2\\sqrt5}$"}],"hint":"$2z_--3=(3-\\sqrt5)-3=-\\sqrt5$, quindi $\\mathrm{Res}=-1/\\sqrt5$. Poi $\\frac{i}{2}\\cdot2\\pi i\\cdot(-1/\\sqrt5)=\\frac{\\pi}{\\sqrt5}$. Il distrattore $2\\pi/\\sqrt5$ e' esattamente l'errore da fattore $\\frac12$ dimenticato.","sol":"<b>Teorema dei residui + fattore $\\frac12$ (soluzione ufficiale: $\\pi/\\sqrt5$).</b> $\\mathrm{Res}_{z_-}=\\frac{1}{2z_--3}=-\\frac{1}{\\sqrt5}$; $I=\\frac{i}{2}(2\\pi i)(-\\frac{1}{\\sqrt5})=\\frac{\\pi}{\\sqrt5}$. Senza il $\\frac12$ iniziale uscirebbe $2\\pi/\\sqrt5$: la trappola dichiarata di questo appello."}]},{"pool":"integrali","src":"20230704 Es.2","steps":[{"t":"TRAPPOLA. In $\\int_0^{2\\pi}\\frac{d\\theta}{\\sin(e^{2i\\theta}-1/4)}$ (appello 04/07/2023), dopo $z=e^{i\\theta}$ il denominatore diventa $\\sin(z^2-1/4)$, con poli dove $z^2-1/4=k\\pi$. L'insidia e':","opts":[{"x":"per $k<0$ (quando $\\frac14+k\\pi<0$) le radici $z=\\pm\\sqrt{\\frac14+k\\pi}$ sono IMMAGINARIE pure: bisogna verificare $|z|<1$ prima di includerle; dentro il cerchio restano $z=0$ e $z=\\pm\\frac12$","c":true},{"x":"tutte le radici $z^2=\\frac14+k\\pi$ cadono dentro il cerchio unitario"},{"x":"$\\sin$ non si annulla mai, quindi non ci sono poli"},{"x":"conta solo il polo $z=0$"}],"hint":"$z^2=\\frac14+k\\pi$: per $k\\ge0$ radici reali, per $k<0$ radici immaginarie pure (radicando negativo). In ogni caso il criterio di inclusione e' $|z|<1$.","sol":"<b>Poli interni al cerchio unitario (trappola censita b01, sottotipo b).</b> La sostituzione esponenziale genera poli sia reali ($z=\\pm\\frac12$ da $k=0$) sia immaginari ($z=\\pm i\\sqrt{|{\\frac14+k\\pi}|}$ da $k<0$): questi ultimi possono cadere dentro o fuori, quindi il MODULO va controllato caso per caso. La soluzione ufficiale trova come interni $z=0,\\pm\\frac12$ e riporta $I=2\\pi\\big(4-\\frac{1}{\\sin(1/4)}\\big)$."}]},{"pool":"integrali","src":"nucleo 13 &middot; 20230908 Es.1","steps":[{"t":"MODUS OPERANDI. Quando conviene il percorso a SETTORE (cuneo di angolo $\\phi$) invece del semicerchio, per $\\int_0^\\infty f(x)\\,dx$?","opts":[{"x":"quando $f$ ha una simmetria rotazionale $f(z e^{i\\phi})=c\\,f(z)$ per un angolo $\\phi=2\\pi/n$ (tipico di $1/(1+x^n)$): il raggio ruotato riproduce l'integrale a meno di una costante, e $(1-c\\,e^{i\\phi})I=2\\pi i\\sum\\mathrm{Res}$ chiude il conto con pochissimi poli interni","c":true},{"x":"sempre, per qualunque integrale su $[0,\\infty)$"},{"x":"quando l'integrando e' dispari"},{"x":"quando compare un fattore $e^{ikx}$"}],"hint":"Il settore sfrutta una simmetria rotazionale: $f$ costruita con $x^n$ si ripete ruotando di $2\\pi/n$. Cerca l'angolo che riporta l'integrando su se stesso a meno di un fattore.","sol":"<b>Percorso a settore (nucleo 13, variante del sottotipo d).</b> Se $f(ze^{i\\phi})=c\\,f(z)$, il raggio ruotato da' $c\\,e^{i\\phi}I$ e il contorno chiuso (raggio, arco, raggio ruotato) da' $(1-ce^{i\\phi})I=2\\pi i\\sum_{\\text{interni}}\\mathrm{Res}$. Il vantaggio: un settore stretto racchiude UN solo polo, contro i molti del semicerchio. Il keyhole con $\\log$ e' l'alternativa quando la simmetria non e' evidente."}]},{"pool":"integrali","src":"20230908 Es.1","steps":[{"t":"$\\int_0^\\infty\\frac{x^3}{1+x^6}\\,dx$ (appello 08/09/2023). Quale angolo di settore e come si riconosce?","opts":[{"x":"$\\phi=\\pi/3$: perche' $f(z e^{i\\pi/3})=\\frac{z^3 e^{i\\pi}}{1+z^6 e^{i2\\pi}}=\\frac{-z^3}{1+z^6}=-f(z)$; il settore $[0,\\pi/3]$ racchiude il solo polo $z_1=e^{i\\pi/6}$","c":true},{"x":"$\\phi=\\pi/6$, perche' i poli distano $\\pi/6$"},{"x":"$\\phi=\\pi/2$, il primo quadrante"},{"x":"$\\phi=2\\pi$, il keyhole completo"}],"hint":"Prova $z\\to ze^{i\\pi/3}$: $z^3\\to z^3 e^{i\\pi}=-z^3$ e $z^6\\to z^6 e^{i2\\pi}=z^6$. La funzione torna cambiata di segno: il settore giusto e' $\\pi/3$, non $\\pi/6$.","sol":"<b>Simmetria del settore (soluzione ufficiale 08/09/2023).</b> La scelta $\\pi/3$ (non $\\pi/6$) e' la trappola: si identifica $f(ze^{i\\pi/3})=-f(z)$ PRIMA di scegliere il percorso. Nel settore $[0,\\pi/3]$ l'unico polo interno e' $z_1=e^{i\\pi/6}$ (radice di $z^6=-1$).","cont":"Ora la relazione risolvente e il valore &rarr;"},{"t":"Con $\\mathrm{Res}_{z_1}\\frac{z^3}{1+z^6}=\\frac{z_1^3}{6z_1^5}=\\frac{1}{6z_1^2}=\\frac{e^{-i\\pi/3}}{6}$ e la relazione $(1+e^{i\\pi/3})I=2\\pi i\\,\\mathrm{Res}_{z_1}$, si ottiene:","opts":[{"x":"$I=\\frac{\\pi}{3\\sqrt3}$","c":true},{"x":"$I=\\frac{\\pi}{6\\sqrt3}$"},{"x":"$I=\\frac{\\pi}{\\sqrt3}$"},{"x":"$I=\\frac{2\\pi}{3\\sqrt3}$"}],"hint":"$1+e^{i\\pi/3}=\\sqrt3\\,e^{i\\pi/6}$; quindi $I=\\frac{2\\pi i}{\\sqrt3 e^{i\\pi/6}}\\cdot\\frac{e^{-i\\pi/3}}{6}=\\frac{2\\pi i}{6\\sqrt3}e^{-i\\pi/2}=\\frac{2\\pi}{6\\sqrt3}$.","sol":"<b>Teorema dei residui su settore (soluzione ufficiale: $\\pi/(3\\sqrt3)$).</b> $1+e^{i\\pi/3}=\\tfrac32+i\\tfrac{\\sqrt3}{2}=\\sqrt3\\,e^{i\\pi/6}$; con $\\mathrm{Res}=\\frac{e^{-i\\pi/3}}{6}$, $I=\\frac{2\\pi i\\,e^{-i\\pi/3}}{6\\sqrt3\\,e^{i\\pi/6}}=\\frac{2\\pi i\\,e^{-i\\pi/2}}{6\\sqrt3}=\\frac{2\\pi}{6\\sqrt3}=\\frac{\\pi}{3\\sqrt3}$. Reale e positivo: coerente. (Il keyhole con $g(z)=f(z)\\log z$ da' lo stesso valore.)"}]},{"pool":"integrali","src":"nucleo 13 &middot; 20240910 Es.2","steps":[{"t":"MODUS OPERANDI. Come si riconosce che il semicerchio NON chiude e serve il percorso RETTANGOLARE?","opts":[{"x":"quando l'integrando contiene $e^x,\\cosh x,\\sinh x$ (es. $e^x+e^{-x}$ a denominatore): i poli sono INFINITI e allineati su rette $\\mathrm{Im}\\,z=$ cost, e il semicerchio ne racchiuderebbe infiniti (somma divergente); un rettangolo con lato alto a $\\mathrm{Im}\\,z=$ cost ne isola UNO, sfruttando la periodicit&agrave; $e^{z+iT}=e^z$","c":true},{"x":"quando ci sono poli sull'asse reale"},{"x":"quando l'integrando e' una razionale di grado alto"},{"x":"quando compare $e^{ikx}$"}],"hint":"La firma e' la periodicita' immaginaria: $e^{x+2\\pi i}=e^x$ genera poli equispaziati in verticale. Il semicerchio ne prende infiniti; il rettangolo ne prende uno e lega il lato alto al basso.","sol":"<b>Percorso rettangolare (nucleo 13, sottotipo periodico).</b> Le funzioni con $e^x,\\cosh,\\sinh$ hanno poli su $\\mathrm{Im}\\,z=$ cost, infiniti: il semicerchio fallisce (dovrebbe sommarne infiniti). Il rettangolo di altezza $T$ (il periodo immaginario) ne racchiude pochi, e il lato superiore, per periodicit&agrave;, e' PROPORZIONALE a quello inferiore: la loro combinazione da' l'equazione risolvente."}]},{"pool":"integrali","src":"20240910 Es.2","steps":[{"t":"$\\int_{-\\infty}^{+\\infty}\\frac{\\cos x}{e^x+e^{-x}}\\,dx=\\int\\frac{\\cos x}{2\\cosh x}\\,dx$ (appello 10/09/2024). Dove sono i poli e quale contorno?","opts":[{"x":"$2\\cosh z=0\\Rightarrow z=i\\frac{\\pi}{2}+ik\\pi$: infiniti, verticali; si usa un rettangolo con lato superiore a $\\mathrm{Im}\\,z=\\pi$, che racchiude il solo $z=i\\frac{\\pi}{2}$","c":true},{"x":"poli in $z=\\pm i$, semicirconferenza superiore"},{"x":"nessun polo, integrando intero"},{"x":"polo doppio in $z=0$"}],"hint":"$\\cosh z=0$ per $z=i(\\frac{\\pi}{2}+k\\pi)$: infiniti poli sull'asse immaginario. Un rettangolo alto $\\pi$ ne cattura uno solo, $z=i\\pi/2$.","sol":"<b>Scelta del rettangolo (soluzione ufficiale 10/09/2024).</b> Si lavora con $\\frac{e^{iz}}{2\\cosh z}$ (poi $\\mathrm{Re}$). I poli sono $z=i(\\frac{\\pi}{2}+k\\pi)$; il rettangolo $[-R,R]\\times[0,\\pi]$ racchiude solo $z=i\\frac{\\pi}{2}$. I lati verticali svaniscono per $R\\to\\infty$.","cont":"Ora la periodicita' lega i due lati orizzontali &rarr;"},{"t":"Sul lato superiore $z=x+i\\pi$ si trova $\\frac{e^{i(x+i\\pi)}}{2\\cosh(x+i\\pi)}=-e^{-\\pi}\\frac{e^{ix}}{2\\cosh x}$. Detto $K=\\int\\frac{e^{ix}}{2\\cosh x}dx$, la relazione risolvente e':","opts":[{"x":"$K+K e^{-\\pi}=2\\pi i\\,\\mathrm{Res}_{i\\pi/2}$, cioe' $K(1+e^{-\\pi})=2\\pi i\\,\\mathrm{Res}_{i\\pi/2}$","c":true},{"x":"$K-K e^{-\\pi}=2\\pi i\\,\\mathrm{Res}$ (i due lati si sottraggono)"},{"x":"$K=2\\pi i\\,\\mathrm{Res}$ (il lato alto svanisce)"},{"x":"$2K=0$, i due lati si cancellano"}],"hint":"Il lato basso da' $K$; il lato alto, percorso in verso opposto, da' $-\\int(-e^{-\\pi}\\frac{e^{ix}}{2\\cosh x})dx=+e^{-\\pi}K$. I due si SOMMANO.","sol":"<b>Periodicit&agrave; iperbolica (soluzione ufficiale).</b> $\\cosh(x+i\\pi)=-\\cosh x$ e $e^{i(x+i\\pi)}=e^{-\\pi}e^{ix}$; il lato alto vale $-e^{-\\pi}\\frac{e^{ix}}{2\\cosh x}$, e percorso all'indietro contribuisce $+e^{-\\pi}K$. Somma: $K(1+e^{-\\pi})=2\\pi i\\,\\mathrm{Res}_{i\\pi/2}$.","cont":"Ora il residuo e il valore &rarr;"},{"t":"Con $\\mathrm{Res}_{i\\pi/2}\\frac{e^{iz}}{2\\cosh z}=\\frac{e^{i\\cdot i\\pi/2}}{2\\sinh(i\\pi/2)}=\\frac{e^{-\\pi/2}}{2i}$, il risultato e':","opts":[{"x":"$K(1+e^{-\\pi})=\\pi e^{-\\pi/2}\\Rightarrow K=\\frac{\\pi}{e^{\\pi/2}+e^{-\\pi/2}}=\\frac{\\pi}{2\\cosh(\\pi/2)}$, e $I=\\mathrm{Re}\\,K=\\frac{\\pi}{2\\cosh(\\pi/2)}$","c":true},{"x":"$I=\\frac{\\pi}{\\cosh(\\pi/2)}$"},{"x":"$I=\\frac{\\pi}{2}e^{-\\pi/2}$"},{"x":"$I=\\frac{\\pi}{2\\sinh(\\pi/2)}$"}],"hint":"$2\\pi i\\cdot\\frac{e^{-\\pi/2}}{2i}=\\pi e^{-\\pi/2}$; dividi per $(1+e^{-\\pi})$ e moltiplica sopra e sotto per $e^{\\pi/2}$: $\\frac{\\pi e^{-\\pi/2}}{1+e^{-\\pi}}\\cdot\\frac{e^{\\pi/2}}{e^{\\pi/2}}=\\frac{\\pi}{e^{\\pi/2}+e^{-\\pi/2}}$.","sol":"<b>Teorema dei residui su rettangolo (soluzione ufficiale: $I=\\pi/(2\\cosh(\\pi/2))$).</b> $\\frac{d}{dz}(2\\cosh z)=2\\sinh z$, $\\sinh(i\\pi/2)=i\\sin(\\pi/2)=i$; quindi $\\mathrm{Res}=\\frac{e^{-\\pi/2}}{2i}$ e $\\pi e^{-\\pi/2}=K(1+e^{-\\pi})$, da cui $K=\\frac{\\pi}{2\\cosh(\\pi/2)}$, gia' reale: $I=\\mathrm{Re}\\,K=\\frac{\\pi}{2\\cosh(\\pi/2)}$."}]},{"pool":"integrali","src":"20240910 Es.2","steps":[{"t":"Nel percorso rettangolare per $\\int\\frac{\\cos x}{2\\cosh x}dx$ (lato alto a $y=\\pi$), il lato superiore NON cancella quello inferiore perche':","opts":[{"x":"sostituendo $z\\to z+i\\pi$ si trova $\\frac{e^{i(x+i\\pi)}}{2\\cosh(x+i\\pi)}=-e^{-\\pi}\\frac{e^{ix}}{2\\cosh x}$: il lato alto e' PROPORZIONALE al basso (fattore $-e^{-\\pi}$), non uguale e opposto; sommando, $(1+e^{-\\pi})$ moltiplica l'integrale cercato","c":true},{"x":"il lato alto svanisce, come un arco all'infinito"},{"x":"il lato alto e' esattamente $-$ quello basso e si cancellano"},{"x":"il lato alto racchiude un polo diverso"}],"hint":"$\\cosh(x+i\\pi)=\\cosh x\\cos\\pi+i\\sinh x\\sin\\pi=-\\cosh x$; e $e^{i(x+i\\pi)}=e^{-\\pi}e^{ix}$. Metti insieme i due fattori.","sol":"<b>Perche' il rettangolo funziona (soluzione ufficiale 10/09/2024).</b> A differenza degli archi (che svaniscono) e dei due lati del taglio nel keyhole (uguali e opposti a meno della determinazione), qui il lato alto e' una COPIA RISCALATA del basso: $-e^{-\\pi}$ volte. E' proprio questa proporzionalit&agrave; (non cancellazione, non svanimento) a produrre il fattore $(1+e^{-\\pi})$ e a rendere risolubile un integrale con infiniti poli."}]},{"pool":"integrali","src":"nucleo 13 (sottotipo d)","steps":[{"t":"$\\int_0^{\\infty}\\frac{x^{\\alpha-1}}{1+x}\\,dx$ ($0<\\alpha<1$), keyhole con taglio sul semiasse reale positivo ($\\arg z\\in(0,2\\pi)$). Il bilancio dei due lati del taglio e':","opts":[{"x":"sopra $\\arg z=0$ l'integrando vale $x^{\\alpha-1}g$, sotto $\\arg z=2\\pi$ vale $x^{\\alpha-1}e^{2\\pi i\\alpha}g$; sommando (verso opposto) resta $(1-e^{2\\pi i\\alpha})I=2\\pi i\\,\\mathrm{Res}_{z=-1}$","c":true},{"x":"i due lati si cancellano e resta solo l'arco $C_R$"},{"x":"i due lati sommano a $2I$, come per $\\sqrt{\\cdot}$ sul segmento"},{"x":"sopra e sotto valgono entrambi $x^{\\alpha-1}g$: i lati si annullano"}],"hint":"Girando sotto il taglio, $\\arg z$ passa da $0$ a $2\\pi$, quindi $z^{\\alpha-1}$ acquista $e^{2\\pi i(\\alpha-1)}=e^{2\\pi i\\alpha}$. Il fattore davanti all'integrale e' $(1-e^{2\\pi i\\alpha})$.","sol":"<b>Meccanismo del keyhole (nucleo 13, sottotipo d).</b> La polidromia rende i due lati diversi di $e^{2\\pi i\\alpha}$; se la funzione fosse monodroma ($\\alpha$ intero) i lati si cancellerebbero ($0=0$). Gli archi $C_R$ e $C_\\varepsilon$ svaniscono per $0<\\alpha<1$ (stessa condizione della convergenza reale).","cont":"Ora il residuo e il valore &rarr;"},{"t":"Con l'unico polo $z=-1=e^{i\\pi}$ e $\\mathrm{R
