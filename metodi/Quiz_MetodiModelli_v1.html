"$\\alpha_\\pm=\\pm\\sqrt{\\lambda-2}$","c":true},{"x":"$\\alpha_\\pm=\\pm\\sqrt{2-\\lambda}$ reali per ogni $\\lambda$"},{"x":"$\\alpha=\\pm\\sqrt{\\lambda+2}$"},{"x":"$\\alpha=2-\\lambda$"}],"hint":"$f=e^{\\alpha x}$ da' $\\alpha^2+(2-\\lambda)=0$, cioe' $\\alpha^2=\\lambda-2$.","sol":"<b>Equazione caratteristica.</b> $\\alpha^2+2-\\lambda=0\\Rightarrow\\alpha_\\pm=\\pm\\sqrt{\\lambda-2}$. Per $\\lambda\\neq2$ le radici sono distinte e $f=A_+e^{\\sqrt{\\lambda-2}\\,x}+A_-e^{-\\sqrt{\\lambda-2}\\,x}$. Re-derivato, coerente con la soluzione ufficiale del 20/01/2025.","cont":"Ora quantizza con le BC &rarr;"},{"t":"Le BC $f(0)=f(1)=0$ (con $\\lambda\\neq2$) danno:","opts":[{"x":"$\\sinh(\\sqrt{\\lambda-2})=0\\Rightarrow\\sqrt{\\lambda-2}=in\\pi\\Rightarrow\\lambda_n=2-n^2\\pi^2$, con $n\\in\\mathbb{Z}\\setminus\\{0\\}$","c":true},{"x":"$\\lambda_n=2+n^2\\pi^2$"},{"x":"$\\lambda_n=n^2\\pi^2$"},{"x":"$\\cosh(\\sqrt{\\lambda-2})=0$, nessuna soluzione"}],"hint":"$f(0)=0\\Rightarrow A_-=-A_+$; $f(1)=0\\Rightarrow A_+(e^{\\sqrt{\\lambda-2}}-e^{-\\sqrt{\\lambda-2}})=0$, cioe' $\\sinh(\\sqrt{\\lambda-2})=0$.","sol":"<b>Quantizzazione (soluzione ufficiale 20/01/2025).</b> $f(0)=0\\Rightarrow A_-=-A_+$, quindi $f\\propto\\sinh(\\sqrt{\\lambda-2}\\,x)$ e $f(1)=0\\Rightarrow\\sinh(\\sqrt{\\lambda-2})=0\\Rightarrow e^{2\\sqrt{\\lambda-2}}=1\\Rightarrow\\sqrt{\\lambda-2}=in\\pi$. Dunque $\\lambda_n=2-n^2\\pi^2$. Re-derivato: coincide con la stampa ufficiale $\\lambda_n=2-n^2\\pi^2$, $n\\in\\mathbb{Z}/\\{0\\}$.","cont":"Perche' $n=0$ e' escluso? &rarr;"},{"t":"Il valore $\\lambda=2$ (cioe' $n=0$):","opts":[{"x":"da' radici coincidenti $\\alpha_+=\\alpha_-=0$, soluzione generale $A+Bx$; le BC forzano $A=B=0$, quindi $\\lambda=2\\notin$ spettro","c":true},{"x":"da' l'autofunzione costante $f=1$, quindi $\\lambda=2$ e' nello spettro"},{"x":"da' $f=x$, autofunzione valida"},{"x":"e' un polo dell'operatore"}],"hint":"Con $\\lambda=2$ si ha $\\alpha=0$ doppio: la soluzione generale e' un polinomio di primo grado $A+Bx$. Imponi $f(0)=f(1)=0$ su di esso.","sol":"<b>Autovalore degenere trattato a parte (soluzione ufficiale 20/01/2025).</b> $\\lambda=2\\Rightarrow\\alpha=0$ doppio $\\Rightarrow f=A+Bx$. $f(0)=0\\Rightarrow A=0$; $f(1)=0\\Rightarrow B=0$: autofunzione nulla, $\\lambda=2$ escluso. E' esattamente il caso &laquo;radici coincidenti&raquo; della trappola b01, e il motivo per cui lo spettro e' $\\{2-n^2\\pi^2: n\\in\\mathbb{Z}\\setminus\\{0\\}\\}$. Re-derivato."}]},{"pool":"spettro","src":"20240618 turno A Es.4","steps":[{"t":"$A=\\dfrac{d}{dx}+1$ su $[0,a)$, dominio $\\{f:\\ \\lim_{x\\to a}f(x)=-f(0)\\}$. Risolta $Af=\\lambda f$, la soluzione e':","opts":[{"x":"$f'=(\\lambda-1)f\\Rightarrow f(x)=f(0)\\,e^{(\\lambda-1)x}$","c":true},{"x":"$f(x)=f(0)\\,e^{(\\lambda+1)x}$"},{"x":"$f(x)=f(0)\\cos((\\lambda-1)x)$"},{"x":"$f(x)=f(0)+(\\lambda-1)x$"}],"hint":"$\\frac{df}{dx}+f=\\lambda f\\Rightarrow f'=(\\lambda-1)f$: ODE del primo ordine a variabili separabili, soluzione esponenziale.","sol":"<b>ODE del primo ordine.</b> $f'+f=\\lambda f\\Rightarrow f'=(\\lambda-1)f\\Rightarrow f(x)=f(0)e^{(\\lambda-1)x}$. Un operatore del PRIMO ordine ha una sola costante e richiede UNA sola condizione al contorno (a differenza del secondo ordine, che ne richiede due). Re-derivato, coerente con b01.","cont":"Imponi la BC e trova lo spettro &rarr;"},{"t":"La condizione $\\lim_{x\\to a}f=-f(0)$ (con $a$ finito) da':","opts":[{"x":"$e^{(\\lambda-1)a}=-1\\Rightarrow(\\lambda-1)a=i(2n+1)\\pi\\Rightarrow\\lambda_n=1+\\dfrac{i(2n+1)\\pi}{a}$: spettro PURAMENTE complesso","c":true},{"x":"$e^{(\\lambda-1)a}=1\\Rightarrow\\lambda_n=1+\\dfrac{2in\\pi}{a}$"},{"x":"$\\lambda_n=1-n^2\\pi^2/a^2$, reale"},{"x":"nessun $\\lambda$ soddisfa la condizione"}],"hint":"$f(0)e^{(\\lambda-1)a}=-f(0)\\Rightarrow e^{(\\lambda-1)a}=-1$. Gli zeri di $e^{w}+1$ sono $w=i(2n+1)\\pi$ (multipli DISPARI di $i\\pi$).","sol":"<b>Quantizzazione con BC non standard + operatore non autoaggiunto (20240618 turno A, Es.4).</b> $e^{(\\lambda-1)a}=-1\\Rightarrow(\\lambda-1)a=i\\pi(2n+1)$, quindi $\\lambda_n=1+i(2n+1)\\pi/a$. Gli autovalori hanno parte immaginaria: coerente col fatto che $d/dx+1$ NON e' autoaggiunto (il teorema di realta' non si applica). Re-derivato.","cont":"E il caso $a\\to\\infty$? &rarr;"},{"t":"Per $a\\to\\infty$ (intervallo illimitato):","opts":[{"x":"nessun $\\lambda$ soddisfa $e^{(\\lambda-1)a}=-1$ salvo $f(0)=0$, che da' $f\\equiv0$: l'operatore NON ha spettro (discreto)","c":true},{"x":"lo spettro diventa denso ma resta discreto"},{"x":"si ottiene $\\lambda=1$ come unico autovalore"},{"x":"lo spettro diventa tutto l'asse reale"}],"hint":"Facendo $a\\to\\infty$ i valori $\\lambda_n=1+i(2n+1)\\pi/a$ collassano tutti verso $1$, ma la condizione $e^{(\\lambda-1)a}=-1$ non ammette piu' soluzioni fisse per $f$ non nulla.","sol":"<b>Assenza di spettro su intervallo illimitato (trappola b01, &laquo;a infinito non c'e' spettro&raquo;).</b> Per $a=\\infty$ la BC $\\lim_{x\\to\\infty}f=-f(0)$ non e' soddisfacibile da $f(0)e^{(\\lambda-1)x}$ con $f(0)\\neq0$ (l'esponenziale non tende a $-f(0)$ per nessun $\\lambda$ fisso), e $f(0)=0$ da' $f\\equiv0$. Quindi nessun autovalore. E' il caso dichiarato esplicitamente in b01. Re-derivato."}]},{"pool":"spettro","src":"20250707 Es.3","steps":[{"t":"$A=-i\\dfrac{d}{dx}$ su $[0,1]$, dominio $\\{f\\in C[0,1]:\\ f(1)=-f(0)\\}$ (antiperiodiche). Risolta $Af=\\lambda f$ e imposta la BC:","opts":[{"x":"$-if'=\\lambda f\\Rightarrow f=f_0 e^{i\\lambda x}$; la BC $e^{i\\lambda}=-1$ da' $\\lambda_n=(2n+1)\\pi$, $n\\in\\mathbb{Z}$: autovalori REALI","c":true},{"x":"$\\lambda_n=2n\\pi$, reali"},{"x":"$\\lambda_n=in\\pi$, immaginari puri"},{"x":"nessuna quantizzazione, spettro continuo"}],"hint":"$-if'=\\lambda f\\Rightarrow f'=i\\lambda f\\Rightarrow f=f_0e^{i\\lambda x}$. La BC $f(1)=-f(0)$ da' $e^{i\\lambda}=-1$, cioe' $i\\lambda=i(2n+1)\\pi$.","sol":"<b>Spettro reale da operatore autoaggiunto (compito 08/07/2025 Es.3).</b> $f=f_0e^{i\\lambda x}$; $f(1)=-f(0)\\Rightarrow e^{i\\lambda}=-1\\Rightarrow\\lambda_n=(2n+1)\\pi$, $n\\in\\mathbb{Z}$. Gli autovalori sono REALI perche' $-i\\,d/dx$ con BC antiperiodiche e' autoaggiunto (il termine di bordo $-i[f\\bar g]_0^1$ si annulla). Contrasto netto con $d/dx+1$: la stessa aria di operatore del primo ordine, ma li' complesso, qui reale, e la differenza e' l'autoaggiuntezza. Re-derivato.","cont":"Ora sviluppa $f=1$ nella base &rarr;"},{"t":"Le autofunzioni normalizzate sono $f_n(x)=e^{i(2n+1)\\pi x}$ (con $\\langle f_n,f_m\\rangle=\\delta_{nm}$). Lo sviluppo di $f(x)=1$ ha coefficienti:","opts":[{"x":"$c_n=\\langle f_n,1\\rangle=\\displaystyle\\int_0^1 e^{-i(2n+1)\\pi x}dx=\\dfrac{2}{i\\pi(2n+1)}$","c":true},{"x":"$c_n=\\delta_{n,0}$, cioe' $1$ e' gia' un'autofunzione"},{"x":"$c_n=\\dfrac{1}{2n+1}$"},{"x":"$c_n=0$ per ogni $n$"}],"hint":"$c_n=\\int_0^1 \\overline{f_n(x)}\\cdot1\\,dx=\\int_0^1 e^{-i(2n+1)\\pi x}dx$; integra l'esponenziale e usa $e^{-i(2n+1)\\pi}=-1$.","sol":"<b>Sviluppo in serie di autofunzioni (compito 08/07/2025 Es.3).</b> Essendo $A$ autoaggiunto, $\\{f_n\\}$ e' una base ortonormale di $L^2[0,1]$ e $1=\\sum_n c_n f_n$ con $c_n=\\langle f_n,1\\rangle$. $c_n=\\int_0^1 e^{-i(2n+1)\\pi x}dx=\\dfrac{e^{-i(2n+1)\\pi}-1}{-i(2n+1)\\pi}=\\dfrac{-1-1}{-i(2n+1)\\pi}=\\dfrac{2}{i\\pi(2n+1)}$. La completezza della base e' garantita dal teorema spettrale per operatori autoaggiunti. Re-derivato, coincide con la stampa ufficiale."}]},{"pool":"spettro","src":"nucleo 16, tappa 03 (particella nella scatola)","steps":[{"t":"$-u''=\\lambda u$ su $[0,L]$ con Dirichlet $u(0)=u(L)=0$. Soluzione generale $u=A\\sin(\\sqrt\\lambda x)+B\\cos(\\sqrt\\lambda x)$; imponendo le BC:","opts":[{"x":"$B=0$ e $\\sin(\\sqrt\\lambda L)=0\\Rightarrow\\sqrt\\lambda L=n\\pi\\Rightarrow\\lambda_n=\\left(\\dfrac{n\\pi}{L}\\right)^2$, $n=1,2,\\dots$","c":true},{"x":"$A=0$ e $\\lambda_n=\\left(\\dfrac{n\\pi}{L}\\right)^2$ con autofunzioni $\\cos$"},{"x":"$\\lambda_n=\\dfrac{n\\pi}{L}$, lineare in $n$"},{"x":"$\\lambda_n=-\\left(\\dfrac{n\\pi}{L}\\right)^2$"}],"hint":"$u(0)=0\\Rightarrow B=0$; resta $u=A\\sin(\\sqrt\\lambda x)$, e $u(L)=0\\Rightarrow\\sin(\\sqrt\\lambda L)=0$, i cui zeri sono $\\sqrt\\lambda L=n\\pi$.","sol":"<b>Sturm-Liouville con $p=w=1$, Dirichlet (nucleo 16, tappa 03).</b> $u(0)=0\\Rightarrow B=0$; $u(L)=0\\Rightarrow\\sin(\\sqrt\\lambda L)=0\\Rightarrow\\lambda_n=(n\\pi/L)^2$. E' la particella in una scatola: $E_n=\\hbar^2\\pi^2 n^2/(2mL^2)$. Re-derivato. La quantizzazione e' la stessa dei modi di una corda: le BC selezionano un insieme DISCRETO di $\\lambda$.","cont":"Ora normalizza l'autofunzione &rarr;"},{"t":"L'autofunzione $u_n=A\\sin(n\\pi x/L)$ normalizzata in $L^2[0,L]$ ha:","opts":[{"x":"$A=\\sqrt{2/L}$, poiche' $\\displaystyle\\int_0^L\\sin^2(n\\pi x/L)\\,dx=\\dfrac{L}{2}$","c":true},{"x":"$A=1/L$"},{"x":"$A=\\sqrt{L/2}$"},{"x":"$A=1$, gia' normalizzata"}],"hint":"Imponi $\\int_0^L|u_n|^2dx=1$; l'integrale di $\\sin^2$ su un numero intero di semiperiodi vale meta' dell'intervallo, $L/2$.","sol":"<b>Normalizzazione delle autofunzioni.</b> $\\int_0^L\\sin^2(n\\pi x/L)dx=L/2$ (media di $\\sin^2$ pari a $1/2$ su un numero intero di semionde), quindi $A^2\\cdot L/2=1\\Rightarrow A=\\sqrt{2/L}$ e $u_n=\\sqrt{2/L}\\,\\sin(n\\pi x/L)$. Le autofunzioni sono ortonormali per il teorema di Sturm-Liouville: $\\int_0^L u_n u_m dx=\\delta_{nm}$. Re-derivato."}]},{"pool":"spettro","src":"b03 Set 2 (momento angolare)","steps":[{"t":"L'operatore $L_z=-i\\dfrac{d}{d\\varphi}$ agisce su funzioni della variabile angolare $\\varphi\\in[0,2\\pi)$ con condizione di PERIODICITA' $\\psi(\\varphi+2\\pi)=\\psi(\\varphi)$. Le autofunzioni di $L_z\\psi=m\\psi$ sono:","opts":[{"x":"$\\psi_m(\\varphi)=e^{im\\varphi}$, e la periodicita' forza $m\\in\\mathbb{Z}$","c":true},{"x":"$\\psi_m(\\varphi)=e^{im\\varphi}$ con $m\\in\\mathbb{R}$ qualsiasi"},{"x":"$\\psi_m(\\varphi)=\\cos(m\\varphi)$ con $m$ semi-intero"},{"x":"$\\psi_m(\\varphi)=e^{-m\\varphi}$ con $m>0$"}],"hint":"$-i\\psi'=m\\psi\\Rightarrow\\psi=e^{im\\varphi}$; la condizione $\\psi(2\\pi)=\\psi(0)$ da' $e^{2\\pi im}=1$, i cui zeri richiedono $m$ intero.","sol":"<b>Quantizzazione del momento angolare (b03 Set 2).</b> $-i\\psi'=m\\psi\\Rightarrow\\psi_m=e^{im\\varphi}$; la periodicita' $2\\pi$ impone $e^{2\\pi im}=1\\Rightarrow m\\in\\mathbb{Z}$. La BC periodica e' cio' che rende $L_z$ autoaggiunto e discreto: autovalori interi REALI. E' l'esatto analogo circolare di $-i\\,d/dx$ periodico. Valore $m\\in\\mathbb{Z}$ riportato dalla fonte b03 e coerente con la re-derivazione.","cont":"Normalizzazione su $[0,2\\pi)$ &rarr;"},{"t":"L'autofunzione normalizzata in $L^2[0,2\\pi)$ e':","opts":[{"x":"$\\psi_m(\\varphi)=\\dfrac{1}{\\sqrt{2\\pi}}e^{im\\varphi}$, poiche' $\\displaystyle\\int_0^{2\\pi}|e^{im\\varphi}|^2 d\\varphi=2\\pi$","c":true},{"x":"$\\psi_m=\\dfrac{1}{2\\pi}e^{im\\varphi}$"},{"x":"$\\psi_m=\\dfrac{1}{\\sqrt\\pi}e^{im\\varphi}$"},{"x":"$\\psi_m=e^{im\\varphi}$, gia' normalizzata"}],"hint":"$|e^{im\\varphi}|=1$, quindi l'integrale del modulo quadro e' semplicemente la lunghezza dell'intervallo, $2\\pi$.","sol":"<b>Normalizzazione (b03 Set 2).</b> $\\int_0^{2\\pi}|e^{im\\varphi}|^2 d\\varphi=2\\pi\\Rightarrow\\psi_m=\\frac{1}{\\sqrt{2\\pi}}e^{im\\varphi}$. Queste $\\{\\psi_m\\}$ formano una base ortonormale (le armoniche di Fourier sul cerchio): $\\langle\\psi_m,\\psi_{m'}\\rangle=\\delta_{mm'}$ per l'autoaggiuntezza di $L_z$. Re-derivato."}]},{"pool":"spettro","src":"b03 Set 4 (ODE con BC)","steps":[{"t":"Per l'operatore $\\dfrac{d}{dx}$ su $[0,1]$ con BC $f(0)=f(1)$ (periodiche), l'equazione $f'=\\lambda f$ da' $f=f_0 e^{\\lambda x}$ e la quantizzazione:","opts":[{"x":"$e^{\\lambda}=1\\Rightarrow\\lambda_n=2\\pi i\\,n$, $n\\in\\mathbb{Z}$: spettro immaginario puro","c":true},{"x":"$\\lambda_n=n\\pi$, reale"},{"x":"$\\lambda_n=(2n+1)\\pi i$"},{"x":"nessuna quantizzazione"}],"hint":"$f(0)=f(1)\\Rightarrow f_0=f_0 e^{\\lambda}\\Rightarrow e^{\\lambda}=1$, i cui zeri sono i multipli PARI di $i\\pi$: $\\lambda=2\\pi i n$.","sol":"<b>Operatore $d/dx$ periodico (b03 Set 4).</b> $e^{\\lambda}=1\\Rightarrow\\lambda_n=2\\pi i n$. Lo spettro e' immaginario puro: $d/dx$ da solo e' anti-autoaggiunto ($\\big(\\frac{d}{dx}\\big)^\\dagger=-\\frac{d}{dx}$ con BC periodiche), quindi $-i\\,d/dx$ e' autoaggiunto con spettro reale $2\\pi n$. Confronta con le BC ANTIperiodiche $f(1)=-f(0)$: li' $e^\\lambda=-1$ e $\\lambda_n=i(2n+1)\\pi$ (dispari). Le BC selezionano interi pari vs dispari. Valore riportato da b03, coerente con la re-derivazione.","cont":"Cosa cambia con BC antiperiodiche? &rarr;"},{"t":"Cambiando la BC in $f(0)=-f(1)$ (antiperiodiche), lo spettro dello stesso $\\dfrac{d}{dx}$:","opts":[{"x":"diventa $\\lambda_n=i\\pi(2n+1)$: gli stessi passaggi ma con $e^\\lambda=-1$, quindi multipli DISPARI di $i\\pi$ invece che pari","c":true},{"x":"resta $\\lambda_n=2\\pi i n$, immutato"},{"x":"diventa reale"},{"x":"scompare"}],"hint":"Solo la condizione finale cambia: $e^\\lambda=-1$ invece di $e^\\lambda=+1$. Gli zeri di $e^\\lambda+1$ sono i multipli dispari di $i\\pi$.","sol":"<b>Le BC cambiano lo spettro (b03 Set 4).</b> $f(0)=-f(1)\\Rightarrow e^\\lambda=-1\\Rightarrow\\lambda_n=i\\pi(2n+1)$. E' la dimostrazione operativa del principio della tappa 01: STESSA espressione differenziale $d/dx$, STESSO intervallo, ma BC diverse (periodiche vs antiperiodiche) danno spettri disgiunti ($2\\pi i n$ vs $i\\pi(2n+1)$). E' proprio la distinzione che ricompare in 20250707 col fattore $-i$. Re-derivato."}]},{"pool":"spettro","src":"20260212 Es.4 &middot; 20262001 Es.4","steps":[{"t":"Per $-\\dfrac{d^2}{dx^2}$ su $[0,\\pi]$, si confrontino DIRICHLET $u(0)=u(\\pi)=0$ e NEUMANN $u'(0)=u'(\\pi)=0$. Gli spettri sono:","opts":[{"x":"Dirichlet: $\\lambda_n=n^2$, $n=1,2,\\dots$, autofunzioni $\\sin(nx)$. Neumann: $\\lambda_n=n^2$, $n=0,1,2,\\dots$, autofunzioni $\\cos(nx)$ &mdash; Neumann include $\\lambda=0$ (la costante), Dirichlet no","c":true},{"x":"identici in entrambi i casi, $\\lambda_n=n^2$ con $n\\geq1$"},{"x":"Dirichlet $\\lambda_n=n^2$, Neumann $\\lambda_n=(n+1/2)^2$"},{"x":"Neumann non ha spettro perche' $u'$ non e' fissata"}],"hint":"La differenza chiave e' $n=0$: la costante ha derivata nulla (soddisfa Neumann) ma non e' nulla al bordo (viola Dirichlet). Quindi $\\lambda=0$ e' Neumann-ammesso e Dirichlet-escluso.","sol":"<b>Neumann vs Dirichlet: stesso operatore, spettri diversi (compiti 12/02/2026 e 20/01/2026, Es.4).</b> $-u''=\\lambda u$ da' $u=A\\cos(\\sqrt\\lambda x)+B\\sin(\\sqrt\\lambda x)$. Dirichlet: $B$-solo, $\\sin(\\sqrt\\lambda\\pi)=0\\Rightarrow\\lambda_n=n^2$, $n\\geq1$. Neumann: $A$-solo, $\\sin(\\sqrt\\lambda\\pi)=0$ dalla derivata $\\Rightarrow\\lambda_n=n^2$, $n\\geq0$, con $n=0$ la costante ($\\lambda=0$). La sola $\\lambda=0$ distingue i due spettri: e' l'esempio-manifesto che le BC definiscono l'operatore. Re-derivato.","cont":"Perche' la costante e' Neumann e non Dirichlet? &rarr;"},{"t":"L'autofunzione $u_0=\\text{cost}$ con $\\lambda=0$:","opts":[{"x":"soddisfa Neumann ($u_0'=0$ ovunque) ma viola Dirichlet ($u_0(0)\\neq0$): e' proprio la differenza fra i due spettri","c":true},{"x":"soddisfa entrambe le BC"},{"x":"non soddisfa nessuna delle due"},{"x":"soddisfa Dirichlet ma non Neumann"}],"hint":"Una funzione costante non nulla ha derivata identicamente nulla, quindi passa Neumann; ma non si annulla agli estremi, quindi fallisce Dirichlet.","sol":"<b>Il modo zero (compiti 2026).</b> $u_0=\\text{cost}\\neq0$ ha $u_0'\\equiv0$: soddisfa $u'(0)=u'(\\pi)=0$ (Neumann) ed e' autofunzione con $\\lambda=0$. Ma $u_0(0)\\neq0$ viola Dirichlet, quindi $\\lambda=0\\notin$ spettro-Dirichlet. In fisica: il modo uniforme (media conservata) esiste col flusso nullo al bordo (isolante, Neumann), non con estremi fissati a zero (Dirichlet). Re-derivato."}]},{"pool":"spettro","src":"20250909 Es.4 (base di Hermite)","steps":[{"t":"L'operatore $A=-\\dfrac{d^2}{dx^2}+x^2$ su $\\mathbb{R}$ con la richiesta $f(x)\\to0$ per $|x|\\to\\infty$ ha:","opts":[{"x":"spettro DISCRETO $\\lambda_n=2n+1$, $n=0,1,2,\\dots$, con autofunzioni la base di Hermite $f_n(x)=H_n(x)e^{-x^2/2}$","c":true},{"x":"spettro continuo $\\lambda\\geq0$, perche' il dominio e' tutto $\\mathbb{R}$"},{"x":"nessuno spettro, perche' l'intervallo e' illimitato"},{"x":"spettro $\\lambda_n=n^2\\pi^2$"}],"hint":"Su $\\mathbb{R}$ un intervallo illimitato NON implica automaticamente spettro continuo: il termine confinante $+x^2$ (potenziale che cresce all'infinito) rende lo spettro DISCRETO, come l'oscillatore armonico quantistico.","sol":"<b>Oscillatore armonico: spettro discreto su dominio illimitato (compito 09/09/2025 Es.4).</b> $-f_n''+x^2 f_n=(2n+1)f_n$ con $f_n=H_n(x)e^{-x^2/2}$ (polinomi di Hermite, peso $w=e^{-x^2}$ in forma di Sturm-Liouville). Lo spettro e' $\\lambda_n=2n+1$, DISCRETO nonostante il dominio $\\mathbb{R}$: e' il potenziale confinante $x^2$ a normalizzare le autofunzioni e a discretizzare. Contrasto con $-d^2/dx^2$ libero su $\\mathbb{R}$, che ha spettro continuo. Valore $\\lambda_n=2n+1$ riportato dalla soluzione ufficiale (base di Hermite standard), non ri-derivato indipendentemente."}]},{"pool":"spettro","src":"b03 Set 2 (operatore non hermitiano)","steps":[{"t":"L'operatore di annichilazione $a=\\dfrac{iP+X}{\\sqrt2}=\\dfrac{1}{\\sqrt2}\\!\\left(x+\\dfrac{d}{dx}\\right)$ NON e' hermitiano. Il suo problema agli autovalori $a\\,\\psi_\\alpha=\\alpha\\psi_\\alpha$:","opts":[{"x":"ha soluzione per OGNI $\\alpha\\in\\mathbb{C}$ (stati coerenti), con $\\psi_\\alpha(x)\\propto e^{\\sqrt2\\,\\alpha x-x^2/2}$: essendo non hermitiano, gli autovalori NON sono reali ne' discreti","c":true},{"x":"ha autovalori reali $\\alpha=n$ interi, come un operatore hermitiano"},{"x":"non ha autofunzioni normalizzabili per nessun $\\alpha$"},{"x":"ha spettro solo per $\\alpha$ immaginario puro"}],"hint":"$a$ non e' autoaggiunto ($a^\\dagger\\neq a$): niente garantisce autovalori reali. Separando le variabili in $\\frac{1}{\\sqrt2}(x+d/dx)\\psi=\\alpha\\psi$ si trova una gaussiana traslata, normalizzabile per ogni $\\alpha$ complesso.","sol":"<b>Autovalori di un operatore non hermitiano (b03 Set 2).</b> Da $\\frac{1}{\\sqrt2}(\\psi'+x\\psi)=\\alpha\\psi$ segue $\\psi'=(\\sqrt2\\alpha-x)\\psi\\Rightarrow\\psi_\\alpha\\propto e^{\\sqrt2\\alpha x-x^2/2}$, in $L^2(\\mathbb{R})$ per OGNI $\\alpha\\in\\mathbb{C}$. Sono gli stati coerenti. La lezione: solo l'autoaggiuntezza garantisce spettro reale e discreto; un operatore non hermitiano puo' avere un intero piano complesso come spettro puntuale. Valori riportati da b03, coerenti con la struttura gaussiana."}]},{"pool":"spettro","src":"nucleo 16, tappa 04 (alternativa di Fredholm)","steps":[{"t":"Nella Green spettrale $G(x,\\xi)=\\sum_n\\dfrac{\\phi_n(x)\\phi_n(\\xi)}{\\lambda_n}$, la presenza di un autovalore NULLO ($\\lambda_n=0$):","opts":[{"x":"fa esplodere la formula: $Au=f$ e' risolubile SOLO se $f$ e' ortogonale all'autofunzione di $\\lambda=0$ (alternativa di Fredholm); e' la risonanza","c":true},{"x":"non ha alcun effetto sulla Green"},{"x":"rende la Green identicamente nulla"},{"x":"e' sempre proibito perche' $\\lambda=0$ non puo' essere autovalore"}],"hint":"Un autovalore nullo significa che l'omogenea $Au=0$ ha soluzione non banale $\\phi_0$: il termine $1/\\lambda_0$ diverge. La compatibilita' richiede $\\langle\\phi_0,f\\rangle=0$.","sol":"<b>Alternativa di Fredholm (nucleo 16, tappa 04).</b> Se $\\lambda_n=0$ per qualche $n$, l'operatore $A$ non e' invertibile e la Green spettrale diverge nel modo corrispondente. $Au=f$ ha soluzione se e solo se $f\\perp\\phi_0$ (la sorgente non eccita il modo a frequenza nulla). Fisicamente e' la risonanza: forzare un sistema esattamente su un suo modo proprio non da' risposta stazionaria. E' il motivo per cui il caso $\\lambda=0$ va sempre esaminato a parte, sia nello spettro sia nella Green."}]},{"pool":"spettro","src":"nucleo 16, tappa 02","steps":[{"t":"La DEGENERAZIONE di un autovalore (piu' autofunzioni indipendenti con lo stesso $\\lambda$) per un problema di Sturm-Liouville REGOLARE su intervallo finito:","opts":[{"x":"NON accade per BC separate: gli autovalori sono semplici (non degeneri); la degenerazione richiede simmetrie o BC periodiche (es. $\\pm m$ per $L_z$)","c":true},{"x":"accade sempre, ogni autovalore e' doppio"},{"x":"impedisce l'ortogonalita' delle autofunzioni"},{"x":"rende lo spettro continuo"}],"hint":"Con BC separate (Dirichlet/Neumann/Robin) a un autovalore corrisponde una sola autofunzione, a meno di costante. Le BC periodiche invece accoppiano gli estremi e possono raddoppiare i livelli.","sol":"<b>Semplicita' degli autovalori (teorema di Sturm-Liouville regolare).</b> Per un problema regolare con BC SEPARATE ogni autovalore e' semplice: una sola autofunzione (a meno di scalare). La degenerazione compare con BC periodiche o simmetrie: per $L_z=-i\\,d/d\\varphi$ gli autovalori $m$ e $-m$ danno modi indipendenti $e^{\\pm im\\varphi}$ ma con autovalori DIVERSI; la vera degenerazione (stesso $\\lambda$, piu' modi) nasce quando piu' numeri quantici indipendenti collassano sullo stesso $\\lambda$. Le autofunzioni restano ortogonali (teorema spettrale)."}]},{"pool":"spettro","src":"nucleo 16, tappa 01 (modus/riconoscimento)","steps":[{"t":"Ricevuto un operatore differenziale, come si distingue subito quante condizioni al contorno servono e quante costanti compaiono nello spettro?","opts":[{"x":"l'ORDINE dell'operatore: primo ordine $\\to$ una costante, UNA BC (spettro tipicamente da una sola condizione); secondo ordine $\\to$ due costanti, DUE BC (condizione di quantizzazione da un sistema $2\\times2$)","c":true},{"x":"la dimensione dello spazio, sempre $2$"},{"x":"il numero di termini nell'espressione dell'operatore"},{"x":"il grado del polinomio caratteristico meno uno"}],"hint":"Un'ODE di ordine $k$ ha $k$ soluzioni indipendenti e $k$ costanti: servono $k$ condizioni al contorno per fissarle. Primo ordine = una, secondo ordine = due.","sol":"<b>Ordine dell'operatore e numero di BC (nucleo 16).</b> Un operatore di ordine $k$ produce una ODE di ordine $k$: $k$ costanti, $k$ condizioni. Primo ordine (es. $d/dx+1$, $-i\\,d/dx$): una costante, una BC, e la quantizzazione nasce da $e^{(\\cdot)}=\\pm1$. Secondo ordine (es. $d^2/dx^2+c$): due costanti, due BC, e la quantizzazione da $\\sinh(\\cdot)=0$ o $\\sin(\\cdot)=0$ (determinante $2\\times2$ nullo). Riconoscere l'ordine e' il primo gesto: fissa la struttura di tutto il problema."}]},{"pool":"spettro","src":"nucleo 16, tappa 03 (Legendre)","steps":[{"t":"L'equazione di Legendre $\\big((1-x^2)u'\\big)'+\\lambda u=0$ su $[-1,1]$ e' un problema di Sturm-Liouville. Che peso ha e cosa ne segue per le autofunzioni?","opts":[{"x":"peso $w=1$: le autofunzioni (i polinomi di Legendre $P_n$, con $\\lambda_n=n(n+1)$) sono ortogonali SENZA peso, $\\int_{-1}^1 P_n P_m\\,dx=0$ per $n\\neq m$","c":true},{"x":"peso $w=1-x^2$: ortogonalita' con quel peso"},{"x":"peso $w=x$: come Bessel"},{"x":"nessun peso definito, l'operatore non e' autoaggiunto"}],"hint":"Nella forma $(pu')'+qu+\\lambda w u=0$ il peso e' il coefficiente di $\\lambda u$: qui $+\\lambda u$, dunque $w=1$. Il fattore $1-x^2=p$ e' il coefficiente $p$, non il peso.","sol":"<b>Legendre come Sturm-Liouville con $w=1$ (nucleo 16, tappa 03).</b> Confrontando $((1-x^2)u')'+\\lambda u=0$ con la forma normale: $p=1-x^2$, $q=0$, $w=1$. Ortogonalita' SENZA peso: $\\int_{-1}^1 P_n P_m dx=0$. Autovalori $\\lambda_n=n(n+1)$. Poiche' $p$ si annulla agli estremi ($x=\\pm1$), e' un problema SINGOLARE: le BC diventano la richiesta di limitatezza. E' il caso che nasce dal laplaciano in coordinate sferiche (armoniche sferiche). Valori $\\lambda_n=n(n+1)$ standard, non ri-derivati qui."}]},{"pool":"spettro","src":"nucleo 16, tappa 02 (funzioni dell'operatore)","steps":[{"t":"Noto lo spettro $\\{\\lambda_n,\\phi_n\\}$ di un operatore autoaggiunto $A$, l'evoluzione temporale $e^{-iAt}$ e la Green $A^{-1}$ si scrivono:","opts":[{"x":"$e^{-iAt}=\\sum_n e^{-i\\lambda_n t}P_n$ e $A^{-1}=\\sum_n\\lambda_n^{-1}P_n$ con $P_n=|\\phi_n\\rangle\\langle\\phi_n|$: nella base spettrale ogni funzione dell'operatore agisce numero per numero","c":true},{"x":"si sostituisce $A$ nella serie di Taylor e si somma la serie di operatori, senza usare lo spettro"},{"x":"$e^{-iAt}=e^{-it\\sum_n\\lambda_n}$"},{"x":"queste funzioni non sono definibili per operatori differenziali"}],"hint":"E' lo stesso meccanismo delle funzioni di matrice: $f(A)=\\sum_n f(\\lambda_n)P_n$. Il vantaggio di trovare lo spettro e' proprio che ogni funzione dell'operatore diventa banale.","sol":"<b>Funzioni di operatore via spettro (teorema spettrale, nucleo 16, tappa 02).</b> Se $A=\\sum_n\\lambda_n P_n$ allora $f(A)=\\sum_n f(\\lambda_n)P_n$. Da qui l'evoluzione quantistica $e^{-iAt}=\\sum_n e^{-i\\lambda_n t}P_n$ (moduli costanti, unitaria), il peso di Boltzmann $e^{-\\beta A}$, la Green $A^{-1}=\\sum_n\\lambda_n^{-1}P_n$ (che esplode se $\\lambda_n=0$: alternativa di Fredholm). Trovare lo spettro E' risolvere il problema: nella base propria l'operatore e' un numero per ogni modo."}]},{"pool":"spettro","src":"nucleo 16, tappa 03 &middot; b01 (distinzione tipi)","steps":[{"t":"Un intervallo illimitato ($\\mathbb{R}$ o $[0,\\infty)$) da' spettro CONTINUO oppure DISCRETO? La distinzione corretta e':","opts":[{"x":"dipende dal potenziale/coefficienti: $-d^2/dx^2$ libero su $\\mathbb{R}$ ha spettro CONTINUO (onde piane non normalizzabili); $-d^2/dx^2+x^2$ ha spettro DISCRETO (il termine confinante normalizza le autofunzioni)","c":true},{"x":"illimitato implica sempre continuo, senza eccezioni"},{"x":"illimitato implica sempre discreto"},{"x":"illimitato implica sempre assenza di spettro"}],"hint":"Non e' la sola illimitatezza a decidere: e' se le autofunzioni possono stare in $L^2$. Un potenziale che cresce all'infinito confina gli stati (discreto); uno piatto no (continuo).","sol":"<b>Discreto vs continuo su domini illimitati (nucleo 16, tappe 03-04).</b> La illimitatezza del dominio e' NECESSARIA ma non sufficiente per lo spettro continuo. Se il potenziale confina ($x^2$, oscillatore), le autofunzioni sono normalizzabili e lo spettro e' discreto ($\\lambda_n=2n+1$). Se non confina ($-d^2/dx^2$ libero), le &laquo;autofunzioni&raquo; sono onde piane $e^{ikx}\\notin L^2$ e lo spettro e' continuo ($\\lambda=k^2\\geq0$), rappresentato da un taglio del risolvente. Il caso 20240618 ($a=\\infty$, primo ordine) e' un terzo scenario: nessuno spettro affatto. Tre esiti distinti, da non confondere."}]},{"pool":"spettro","src":"nucleo 16, tappa 01 (R vs C)","steps":[{"t":"Due operatori del primo ordine su $[0,1]$: $A_1=-i\\,d/dx$ con BC antiperiodiche e $A_2=d/dx+1$ con BC $\\lim f=-f(0)$. Perche' $A_1$ ha spettro reale e $A_2$ complesso, pur essendo entrambi del primo ordine?","opts":[{"x":"$A_1$ e' autoaggiunto (il fattore $-i$ e le BC annullano il termine di bordo), quindi spettro $\\subset\\mathbb{R}$; $A_2$ non lo e', quindi la realta' non e' garantita e infatti gli autovalori sono complessi","c":true},{"x":"perche' $A_1$ ha coefficienti reali e $A_2$ no"},{"x":"perche' $A_1$ agisce su $[0,1]$ e $A_2$ su un intervallo diverso"},{"x":"per puro caso: entrambi potrebbero avere spettro reale o complesso"}],"hint":"La discriminante e' l'autoaggiuntezza, non l'ordine ne' l'aspetto dell'operatore. Il $-i$ davanti a $d/dx$ e' esattamente cio' che serve a rendere reale lo spettro di un operatore anti-simmetrico.","sol":"<b>Autoaggiuntezza decide la realta' (nucleo 16, tappa 01).</b> $d/dx$ e' anti-autoaggiunto ($(d/dx)^\\dagger=-d/dx$ con BC che annullano il bordo), quindi $-i\\,d/dx$ e' autoaggiunto e ha spettro reale $\\lambda_n=(2n+1)\\pi$ (20250707). Invece $A_2=d/dx+1$ non e' autoaggiunto (manca il $-i$, e la BC non lo simmetrizza), e ha spettro $\\lambda_n=1+i(2n+1)\\pi/a$, complesso (20240618). Stesso ordine, esiti opposti: e' l'autoaggiuntezza, verificata sul termine di bordo, a decidere &mdash; non l'ordine dell'operatore. Re-derivato su entrambi."}]}],"edp":[{"pool":"edp","src":"20260212 Es.4","steps":[{"t":"Appello 12/02/2026. Si deve risolvere $\\partial_t u(t,x)=t^2\\,\\partial_x^2 u(t,x)$ su $x\\in[0,\\pi)$, $t\\ge 0$, con $u(0,x)=g(x)$ e $\\partial_x u|_{x=0}=\\partial_x u|_{x=\\pi}=0$. Il coefficiente $t^2$ dipende dal tempo: la separazione di variabili &egrave; ancora lecita?","opts":[{"x":"S&igrave;: il coefficiente dipende dalla sola $t$, quindi ponendo $u=\\varphi(t)\\psi(x)$ le variabili restano separate, $\\dot\\varphi/(t^2\\varphi)=\\psi''/\\psi=\\lambda$","c":true},{"x":"No: la separazione richiede coefficienti costanti, qui serve una trasformata di Laplace in $t$"},{"x":"S&igrave;, ma solo dopo aver riassorbito $t^2$ in una variabile spaziale riscalata $\\xi=x/t$"},{"x":"No: con coefficiente variabile la soluzione non &egrave; pi&ugrave; sviluppabile in serie di autofunzioni"}],"hint":"Il criterio di separabilit&agrave; non chiede coefficienti costanti; chiede che dopo la divisione per $\\varphi\\psi$ ogni membro dipenda da una sola variabile.","sol":"Separabile. Sostituendo $u=\\varphi(t)\\psi(x)$ si ottiene $\\dot\\varphi\\,\\psi=t^2\\varphi\\,\\psi''$ e, dividendo per $t^2\\varphi\\psi$, $$\\frac{\\dot\\varphi(t)}{t^2\\varphi(t)}=\\frac{\\psi''(x)}{\\psi(x)}=\\lambda .$$ Il membro sinistro dipende solo da $t$, il destro solo da $x$: per il lemma di separazione (due funzioni di variabili indipendenti che coincidono sono entrambe costanti) esiste $\\lambda$ costante. Tutta la dipendenza temporale del coefficiente finisce nel membro temporale e non ostacola nulla. Sarebbe invece fatale un coefficiente misto $a(t,x)$ non fattorizzabile, o un termine di derivata mista $\\partial_t\\partial_x u$. La base spaziale, poi, resta quella del problema di Sturm-Liouville $\\psi''=\\lambda\\psi$ con le BC assegnate: il coefficiente $t^2$ non la tocca.","cont":"Risolvi la parte temporale"},{"t":"Con $\\dot\\varphi(t)=\\lambda\\,t^2\\,\\varphi(t)$ e $\\varphi(0)=\\varphi_0$, quanto vale $\\varphi(t)$?","opts":[{"x":"$\\varphi(t)=\\varphi_0\\,e^{\\lambda t^3/3}$","c":true},{"x":"$\\varphi(t)=\\varphi_0\\,e^{\\lambda t}$"},{"x":"$\\varphi(t)=\\varphi_0\\,e^{\\lambda t^2/2}$"},{"x":"$\\varphi(t)=\\varphi_0\\,t^2\\,e^{\\lambda t}$"}],"hint":"&Egrave; il trabocchetto centrale di questo appello: la parte temporale va integrata, non copiata dal caso a coefficiente costante.","sol":"Equazione del primo ordine a variabili separabili: $d\\varphi/\\varphi=\\lambda\\,t^2\\,dt$, e integrando fra $0$ e $t$, $$\\ln\\frac{\\varphi(t)}{\\varphi_0}=\\lambda\\int_0^t s^2\\,ds=\\frac{\\lambda t^3}{3}\\ \\Longrightarrow\\ \\varphi(t)=\\varphi_0\\,e^{\\lambda t^3/3}.$$ Regola generale da portare all'esame: per $\\partial_t u=a(t)\\,\\partial_x^2u$ l'esponente del modo $n$ &egrave; $\\lambda_n\\int_0^t a(s)\\,ds$. Con $a(t)=t$ si ottiene $e^{\\lambda t^2/2}$, con $a(t)=t^2$ si ottiene $e^{\\lambda t^3/3}$, con $a(t)=\\sin t$ si ottiene $e^{\\lambda(1-\\cos t)}$. Scrivere $e^{\\lambda t}$ equivale ad aver trattato $a(t)$ come una costante: &egrave; l'errore che l'appello sta cercando. L'estremo inferiore $0$ non &egrave; decorativo: serve a far valere $\\varphi(0)=\\varphi_0$, cio&egrave; a far coincidere i $c_n$ con i coefficienti del dato iniziale.","cont":"Passa alle condizioni al bordo"},{"t":"L'equazione spaziale &egrave; $\\psi''(x)=\\lambda\\,\\psi(x)$ con $\\psi'(0)=\\psi'(\\pi)=0$. Quale famiglia di autofunzioni si ottiene, e con quali indici?","opts":[{"x":"$\\psi_n(x)=\\cos(nx)$, $\\lambda_n=-n^2$, con $n=0,1,2,\\dots$: il modo costante $n=0$ &egrave; ammesso","c":true},{"x":"$\\psi_n(x)=\\sin(nx)$, $\\lambda_n=-n^2$, con $n=1,2,\\dots$"},{"x":"$\\psi_n(x)=\\cos(nx)$, $\\lambda_n=-n^2$, con $n=1,2,\\dots$: la costante non &egrave; un'autofunzione accettabile"},{"x":"$\\psi_n(x)=\\cos\\!\\big((n+\\tfrac12)x\\big)$, $\\lambda_n=-(n+\\tfrac12)^2$"}],"hint":"Due errori diversi sono in agguato qui: la famiglia sbagliata, e la perdita del modo costante.","sol":"Con $\\lambda=-k^2<0$ la generale &egrave; $\\psi=A\\cos(kx)+B\\sin(kx)$, dunque $\\psi'=-Ak\\sin(kx)+Bk\\cos(kx)$. Da $\\psi'(0)=0$ segue $B=0$; da $\\psi'(\\pi)=0$ segue $Ak\\sin(k\\pi)=0$, cio&egrave; $k=n$ intero. Restano i coseni. Il modo $n=0$ &egrave; legittimo: la costante soddisfa $\\psi''=0$ e ha derivata nulla ovunque, quindi $\\lambda_0=0$ &egrave; autovalore. Questo &egrave; il contenuto del problema di Sturm-Liouville con condizioni di Neumann omogenee: spettro $\\{-n^2\\}_{n\\ge0}$, autofunzioni i coseni, e lo zero appartiene allo spettro. Nel caso Dirichlet ($\\psi(0)=\\psi(\\pi)=0$) la costante viene uccisa dalle BC e restano i soli seni con $n\\ge1$: la regola mnemonica &egrave; che <em>Neumann d&agrave; coseni, Dirichlet d&agrave; seni</em>, e va usata all'ingresso, non a met&agrave; conto. Da escludere anche $\\lambda>0$: $\\psi=Ae^{kx}+Be^{-kx}$ con derivata nulla ai due estremi forza $A=B=0$.","cont":"Scrivi la soluzione generale"},{"t":"Sommando i modi, qual &egrave; la soluzione generale del problema?","opts":[{"x":"$u(t,x)=\\sum_{n=0}^{\\infty}c_n\\,e^{-n^2t^3/3}\\cos(nx)$","c":true},{"x":"$u(t,x)=\\sum_{n=1}^{\\infty}c_n\\,e^{-n^2t^3/3}\\cos(nx)$"},{"x":"$u(t,x)=\\sum_{n=0}^{\\infty}c_n\\,e^{-n^2t/3}\\cos(nx)$"},{"x":"$u(t,x)=\\sum_{n=1}^{\\infty}c_n\\,e^{-n^2t^3/3}\\sin(nx)$"}],"hint":"Incolla i due risultati precedenti ponendo $\\lambda_n=-n^2$, e controlla da quale indice parte la somma.","sol":"Si moltiplica il fattore temporale per l'autofunzione e si somma su tutti i modi ammessi, per linearit&agrave; e completezza del sistema $\\{\\cos(nx)\\}_{n\\ge0}$ in $L^2(0,\\pi)$: $$u(t,x)=\\sum_{n=0}^{\\infty}c_n\\,e^{-n^2t^3/3}\\cos(nx).$$ Il termine $n=0$ vale semplicemente $c_0$, costante in $t$ e in $x$: &egrave; l'unico che non decade, e ci&ograve; ha un significato fisico preciso, la conservazione della massa totale sotto Neumann.","cont":"Ricava i coefficienti"},{"t":"Imponendo $u(0,x)=g(x)$ si ha $g(x)=c_0+\\sum_{n\\ge1}c_n\\cos(nx)$. Quali sono $c_0$ e $c_{n>0}$?","opts":[{"x":"$c_0=\\frac{1}{\\pi}\\int_0^{\\pi}\\!g(x)\\,dx$ e $c_{n>0}=\\frac{2}{\\pi}\\int_0^{\\pi}\\!g(x)\\cos(nx)\\,dx$","c":true},{"x":"$c_n=\\frac{2}{\\pi}\\int_0^{\\pi}\\!g(x)\\cos(nx)\\,dx$ per ogni $n\\ge0$, modo costante incluso"},{"x":"$c_0=\\frac{2}{\\pi}\\int_0^{\\pi}\\!g\\,dx$ e $c_{n>0}=\\frac{1}{\\pi}\\int_0^{\\pi}\\!g\\cos(nx)\\,dx$"},{"x":"$c_n=\\frac{1}{2\\pi}\\int_{-\\pi}^{\\pi}\\!g(x)e^{-inx}\\,dx$, come nella serie di Fourier complessa"}],"hint":"Il fattore di normalizzazione non &egrave; lo stesso per il modo costante e per gli altri: viene da $\\int_0^\\pi\\cos^2(nx)\\,dx$, che vale una cosa per $n=0$ e un'altra per $n\\ge1$.","sol":"Relazione di ortogonalit&agrave; su $[0,\\pi]$: $\\int_0^{\\pi}\\cos(nx)\\cos(mx)\\,dx=\\frac{\\pi}{2}\\delta_{nm}$ per $n,m\\ge1$, mentre $\\int_0^{\\pi}\\cos^2(0\\cdot x)\\,dx=\\int_0^\\pi dx=\\pi$. Proiettando $g$ su $\\cos(mx)$ si isola $c_m\\cdot\\frac{\\pi}{2}$ per $m\\ge1$ e $c_0\\cdot\\pi$ per $m=0$: da qui il $2/\\pi$ negli uni e il $1/\\pi$ nell'altro. Il modo costante ha norma al quadrato doppia degli altri, e questo &egrave; esattamente il motivo per cui in molti testi la serie si scrive con $a_0/2$: &egrave; la stessa asimmetria, spostata dalla formula del coefficiente alla formula della serie. Lettura utile: $c_0$ &egrave; il valor medio di $g$ su $[0,\\pi]$.","cont":"Specializza a $g(x)=x^2$"},{"t":"Per $g(x)=x^2$ su $[0,\\pi]$, quanto valgono $c_0$ e $c_{n>0}$?","opts":[{"x":"$c_0=\\dfrac{\\pi^2}{3}$ e $c_n=\\dfrac{4(-1)^n}{n^2}$","c":true},{"x":"$c_0=\\dfrac{\\pi^2}{3}$ e $c_n=-\\dfrac{4(-1)^n}{n^2}$"},{"x":"$c_0=\\dfrac{\\pi^2}{2}$ e $c_n=\\dfrac{4}{n^2}$"},{"x":"$c_0=\\dfrac{\\pi^2}{3}$ e $c_n=\\dfrac{2\\pi(-1)^n}{n^3}$"}],"hint":"Due integrazioni per parti. Il segno si controlla in dieci secondi valutando la serie risultante in $x=\\pi$.","sol":"Media: $c_0=\\frac{1}{\\pi}\\int_0^{\\pi}x^2dx=\\frac{1}{\\pi}\\cdot\\frac{\\pi^3}{3}=\\frac{\\pi^2}{3}$. Per $n\\ge1$, la primitiva &egrave; $$\\int x^2\\cos(nx)\\,dx=\\frac{x^2\\sin(nx)}{n}+\\frac{2x\\cos(nx)}{n^2}-\\frac{2\\sin(nx)}{n^3},$$ e valutandola fra $0$ e $\\pi$ i termini in $\\sin(n\\pi)$ si annullano, restando $\\frac{2\\pi(-1)^n}{n^2}$. Dunque $c_n=\\frac{2}{\\pi}\\cdot\\frac{2\\pi(-1)^n}{n^2}=\\frac{4(-1)^n}{n^2}$, in accordo con la stampa ufficiale dell'appello (ricalcolato, non copiato). Controllo del segno: in $x=\\pi$ si ha $\\cos(n\\pi)=(-1)^n$, quindi $$g(\\pi)=\\frac{\\pi^2}{3}+\\sum_{n\\ge1}\\frac{4(-1)^n}{n^2}(-1)^n=\\frac{\\pi^2}{3}+4\\sum_{n\\ge1}\\frac{1}{n^2}=\\frac{\\pi^2}{3}+4\\cdot\\frac{\\pi^2}{6}=\\pi^2,$$ che &egrave; proprio $\\pi^2$ come deve essere. Col segno opposto si sarebbe ottenuto $\\pi^2/3-2\\pi^2/3<0$, assurdo per $x^2$. La soluzione completa &egrave; quindi $u(t,x)=\\frac{\\pi^2}{3}+\\sum_{n\\ge1}\\frac{4(-1)^n}{n^2}e^{-n^2t^3/3}\\cos(nx)$.","cont":"Ultimo controllo"},{"t":"Sempre con $g(x)=x^2$, a che cosa tende $u(t,x)$ per $t\\to+\\infty$?","opts":[{"x":"A $\\pi^2/3$, il valor medio del dato iniziale, uniformemente in $x$","c":true},{"x":"A $0$: tutte le soluzioni dell'equazione del calore si spengono"},{"x":"A $\\pi^2$, cio&egrave; al valore massimo del dato iniziale"},{"x":"Non tende ad alcun limite, perch&eacute; il coefficiente $t^2$ diverge"}],"hint":"Con Neumann il flusso attraverso gli estremi &egrave; nullo: c'&egrave; una quantit&agrave; che si conserva, e il limite non pu&ograve; che essere lei.","sol":"Ogni modo $n\\ge1$ porta $e^{-n^2t^3/3}\\to0$, quindi sopravvive solo $c_0=\\pi^2/3$. Non &egrave; un accidente del dato: integrando l'equazione su $[0,\\pi]$, $$\\frac{d}{dt}\\int_0^{\\pi}u\\,dx=t^2\\big[\\partial_xu\\big]_0^{\\pi}=0$$ per le condizioni di Neumann omogenee, dunque $\\int_0^\\pi u\\,dx$ &egrave; un integrale primo e il calore, non potendo uscire dalla sbarra, si redistribuisce uniformemente sul valor medio. Con Dirichlet omogenee, invece, non c'&egrave; alcun modo costante e il limite &egrave; $0$, perch&eacute; il calore esce dagli estremi tenuti a temperatura fissa. Si noti infine che il decadimento &egrave; in $e^{-n^2t^3/3}$: a tempi lunghi &egrave; enormemente pi&ugrave; rapido del calore ordinario, perch&eacute; la diffusivit&agrave; efficace cresce nel tempo."}]},{"pool":"edp","src":"20262001 Es.4","steps":[{"t":"Appello 20/01/2026. Corda di lunghezza $L$ fissata agli estremi, $\\partial_t^2y=c^2\\partial_x^2y$, con $y(x,0)=0$ e $\\partial_ty|_{t=0}=\\frac{4V}{L^2}x(L-x)$. Quale forma generale si pu&ograve; scrivere <em>gi&agrave; dalle sole condizioni al bordo</em>, prima di guardare i dati iniziali?","opts":[{"x":"$y(x,t)=\\sum_{n\\ge1}\\big[a_n\\cos(\\omega_nt)+b_n\\sin(\\omega_nt)\\big]\\sin\\!\\big(\\tfrac{n\\pi x}{L}\\big)$, con $\\omega_n=\\tfrac{n\\pi c}{L}$","c":true},{"x":"$y(x,t)=\\sum_{n\\ge0}\\big[a_n\\cos(\\omega_nt)+b_n\\sin(\\omega_nt)\\big]\\cos\\!\\big(\\tfrac{n\\pi x}{L}\\big)$"},{"x":"$y(x,t)=F(x-ct)+G(x+ct)$ con $F,G$ arbitrarie e nessun vincolo"},{"x":"$y(x,t)=\\sum_{n\\ge1}b_n\\,e^{-\\omega_n t}\\sin\\!\\big(\\tfrac{n\\pi x}{L}\\big)$"}],"hint":"Sono le condizioni al bordo, non i dati iniziali, a scegliere la famiglia spaziale. E l'equazione &egrave; del secondo ordine in $t$: la parte temporale non pu&ograve; essere un solo esponenziale.","sol":"$y(0,t)=y(L,t)=0$ per ogni $t$ obbliga $\\psi(0)=\\psi(L)=0$: &egrave; il problema di Sturm-Liouville con Dirichlet omogenee, che d&agrave; autofunzioni $\\sin(n\\pi x/L)$ e autovalori $\\lambda_n=-(n\\pi/L)^2$, $n\\ge1$. Sostituendo nella parte temporale, $\\ddot\\varphi=c^2\\lambda_n\\varphi=-\\omega_n^2\\varphi$ con $\\omega_n=cn\\pi/L$, la cui generale &egrave; $a_n\\cos(\\omega_nt)+b_n\\sin(\\omega_nt)$: due costanti per modo, perch&eacute; l'equazione &egrave; del secondo ordine in $t$ e infatti servono <em>due</em> dati iniziali, posizione e velocit&agrave;. La rappresentazione di d'Alembert $F(x-ct)+G(x+ct)$ resta vera, ma su dominio limitato con estremi fissi va costruita per riflessioni successive del dato prolungato in modo dispari e $2L$-periodico: pi&ugrave; lunga da scrivere della separazione. Regola pratica: dominio finito con BC omogenee, si separa; retta intera, d'Alembert.","cont":"Usa la prima condizione iniziale"},{"t":"La condizione $y(x,0)=0$ per ogni $x\\in(0,L)$ che cosa impone sui coefficienti?","opts":[{"x":"$a_n=0$ per ogni $n$: resta la sola parte in $\\sin(\\omega_nt)$","c":true},{"x":"$b_n=0$ per ogni $n$: resta la sola parte in $\\cos(\\omega_nt)$"},{"x":"$a_n=-b_n$ per ogni $n$"},{"x":"$a_0=0$ soltanto, gli altri restano liberi"}],"hint":"Poni $t=0$ nella forma generale e guarda quale delle due funzioni temporali sopravvive; poi ricorda che una serie di Fourier nulla ha tutti i coefficienti nulli.","sol":"A $t=0$ si ha $\\cos(0)=1$, $\\sin(0)=0$, quindi $y(x,0)=\\sum_n a_n\\sin(n\\pi x/L)$. Per l'unicit&agrave; dei coefficienti di Fourier (il sistema $\\{\\sin(n\\pi x/L)\\}_{n\\ge1}$ &egrave; ortogonale e completo in $L^2(0,L)$, quindi la funzione identicamente nulla ha proiezioni tutte nulle) segue $a_n=0$ per ogni $n$. Firma da riconoscere a colpo d'occhio: corda che parte in quiete e viene messa in moto da un impulso di velocit&agrave; $\\Rightarrow$ seni nel tempo; corda pizzicata e lasciata andare ($y(x,0)=f(x)$, $\\partial_ty|_0=0$) $\\Rightarrow$ coseni nel tempo. Le due condizioni iniziali si spartiscono le due famiglie temporali.","cont":"Proietta la velocit&agrave; iniziale"},{"t":"Da $\\partial_ty|_{t=0}=\\sum_n b_n\\omega_n\\sin\\!\\big(\\tfrac{n\\pi x}{L}\\big)=\\frac{4V}{L^2}x(L-x)$, quale relazione fissa i $b_n$?","opts":[{"x":"$b_n\\omega_n=\\dfrac{2}{L}\\displaystyle\\int_0^{L}\\!\\frac{4V}{L^2}x(L-x)\\sin\\!\\big(\\tfrac{n\\pi x}{L}\\big)dx$","c":true},{"x":"$b_n\\omega_n=\\dfrac{1}{L}\\displaystyle\\int_0^{L}\\!\\frac{4V}{L^2}x(L-x)\\sin\\!\\big(\\tfrac{n\\pi x}{L}\\big)dx$"},{"x":"$b_n\\omega_n=\\dfrac{2}{\\pi}\\displaystyle\\int_0^{L}\\!\\frac{4V}{L^2}x(L-x)\\sin\\!\\big(\\tfrac{n\\pi x}{L}\\big)dx$"},{"x":"$b_n=\\dfrac{2}{L}\\displaystyle\\int_0^{L}\\!\\frac{4V}{L^2}x(L-x)\\sin\\!\\big(\\tfrac{n\\pi x}{L}\\big)dx$, senza $\\omega_n$"}],"hint":"La normalizzazione viene da $\\int_0^L\\sin^2(n\\pi x/L)\\,dx$, e l'intervallo qui &egrave; $[0,L]$, non $[0,\\pi]$. Occhio anche a non perdere il fattore $\\omega_n$, che va portato a destra alla fine.","sol":"Ortogonalit&agrave; su $[0,L]$: $\\int_0^{L}\\sin\\!\\big(\\tfrac{n\\pi x}{L}\\big)\\sin\\!\\big(\\tfrac{m\\pi x}{L}\\big)dx=\\frac{L}{2}\\delta_{nm}$. Moltiplicando per $\\sin(m\\pi x/L)$ e integrando si isola $b_m\\omega_m\\frac{L}{2}$, da cui il fattore $2/L$. Il $2/\\pi$ &egrave; il fattore giusto solo quando l'intervallo &egrave; $[0,\\pi]$: &egrave; l'errore pi&ugrave; comune quando si ricicla a memoria la formula di un altro esercizio. Il $2/L$ &egrave; la scrittura generale, e $2/\\pi$ ne &egrave; il caso $L=\\pi$.","cont":"Calcola l'integrale"},{"t":"Quanto vale $\\displaystyle\\int_0^{L}x(L-x)\\sin\\!\\big(\\tfrac{n\\pi x}{L}\\big)dx$?","opts":[{"x":"$\\dfrac{2L^3}{n^3\\pi^3}\\big[1-(-1)^n\\big]$, cio&egrave; $4L^3/(n^3\\pi^3)$ per $n$ dispari e $0$ per $n$ pari","c":true},{"x":"$\\dfrac{4L^3}{n^3\\pi^3}\\big[1-(-1)^n\\big]$"},{"x":"$\\dfrac{2L^3}{n^2\\pi^2}\\big[1-(-1)^n\\big]$"},{"x":"$\\dfrac{2L^3}{n^3\\pi^3}\\big[1+(-1)^n\\big]$"}],"hint":"Il dato &egrave; simmetrico rispetto a $x=L/2$, mentre i modi pari sono antisimmetrici rispetto a quel punto: qualcosa deve annullarsi. E conta le integrazioni per parti per fissare la potenza di $n$.","sol":"Sia $f(x)=x(L-x)$, con $f(0)=f(L)=0$ e $f''=-2$, e $k=n\\pi/L$ (cos&igrave; $\\sin(kL)=0$). Due integrazioni per parti: $$\\int_0^Lf\\sin(kx)dx=\\Big[-\\frac{f\\cos(kx)}{k}\\Big]_0^L+\\frac1k\\int_0^Lf'\\cos(kx)dx=0+\\frac1k\\Big(\\Big[\\frac{f'\\sin(kx)}{k}\\Big]_0^L-\\frac1k\\int_0^Lf''\\sin(kx)dx\\Big),$$ e i termini di bordo cadono ($f$ si annulla agli estremi, $\\sin(kL)=0$). Resta $\\frac{2}{k^2}\\int_0^L\\sin(kx)dx=\\frac{2}{k^3}\\big[1-\\cos(kL)\\big]=\\frac{2L^3}{n^3\\pi^3}\\big[1-(-1)^n\\big]$. Verifica numerica indipendente con $L=1$, $n=1$: $\\int_0^1x(1-x)\\sin(\\pi x)dx=\\frac1\\pi-\\big(\\frac1\\pi-\\frac{4}{\\pi^3}\\big)=\\frac{4}{\\pi^3}$, che &egrave; ci&ograve; che d&agrave; la formula. La stampa ufficiale scrive il prodotto gi&agrave; moltiplicato per $4V/L^2$, cio&egrave; $\\frac{8LV}{n^3\\pi^3}[1-(-1)^n]$: coincide, perch&eacute; $\\frac{4V}{L^2}\\cdot\\frac{2L^3}{n^3\\pi^3}=\\frac{8LV}{n^3\\pi^3}$. L'annullarsi dei modi pari &egrave; la parit&agrave; annunciata: rispetto a $x=L/2$ il dato &egrave; pari e $\\sin(n\\pi x/L)$ &egrave; dispari per $n$ pari.","cont":"Metti tutto insieme"},{"t":"Sopravvivono i soli $n=2k+1$. Qual &egrave; la soluzione finale $y(x,t)$?","opts":[{"x":"$y=\\displaystyle\\sum_{k\\ge0}\\frac{32LV}{c\\,\\pi^4(2k+1)^4}\\sin\\!\\Big[\\frac{(2k+1)\\pi ct}{L}\\Big]\\sin\\!\\Big[\\frac{(2k+1)\\pi x}{L}\\Big]$","c":true},{"x":"$y=\\displaystyle\\sum_{k\\ge0}\\frac{32V}{\\pi^3(2k+1)^3}\\sin\\!\\Big[\\frac{(2k+1)\\pi ct}{L}\\Big]\\sin\\!\\Big[\\frac{(2k+1)\\pi x}{L}\\Big]$"},{"x":"$y=\\displaystyle\\sum_{n\\ge1}\\frac{32LV}{c\\,\\pi^4n^4}\\sin\\!\\Big[\\frac{n\\pi ct}{L}\\Big]\\sin\\!\\Big[\\frac{n\\pi x}{L}\\Big]$"},{"x":"$y=\\displaystyle\\sum_{k\\ge0}\\frac{16LV}{c\\,\\pi^4(2k+1)^4}\\sin\\!\\Big[\\frac{(2k+1)\\pi ct}{L}\\Big]\\sin\\!\\Big[\\frac{(2k+1)\\pi x}{L}\\Big]$"}],"hint":"L'ultima divisione per $\\omega_n$ &egrave; quella che alza la potenza di $n$ da 3 a 4: se la dimentichi resti a $n^3$ e sbagli anche le dimensioni.","sol":"Per $n$ dispari, $b_n\\omega_n=\\frac{2}{L}\\cdot\\frac{4V}{L^2}\\cdot\\frac{4L^3}{n^3\\pi^3}=\\frac{32V}{n^3\\pi^3}$; dividendo per $\\omega_n=n\\pi c/L$ si ottiene $$b_n=\\frac{32V}{n^3\\pi^3}\\cdot\\frac{L}{n\\pi c}=\\frac{32LV}{c\\,\\pi^4n^4},$$ in accordo con la stampa ufficiale (ricalcolato). Controllo dimensionale, sempre da fare: $[LV/c]=\\mathrm{lunghezza}\\cdot(\\mathrm{lunghezza/tempo})/(\\mathrm{lunghezza/tempo})=\\mathrm{lunghezza}$, ed &egrave; giusto perch&eacute; $y$ &egrave; uno spostamento trasverso; l'opzione con $32V/\\pi^3$ avrebbe le dimensioni di una velocit&agrave; e si scarta senza fare conti. La somma su tutti gli $n$ &egrave; sbagliata perch&eacute; i pari sono nulli, e mantenerli formalmente non &egrave; un errore di valore ma di forma.","cont":"Somma la serie numerica"},{"t":"Il testo chiede poi di dedurre $\\sum_{k\\ge0}\\frac{(-1)^k}{(2k+1)^3}=\\frac{\\pi^3}{32}$. Quale mossa lo produce?","opts":[{"x":"Valutare in $x=L/2$ l'identit&agrave; per la velocit&agrave; iniziale, $\\sum_k\\frac{32V}{\\pi^3(2k+1)^3}\\sin\\!\\big[\\tfrac{(2k+1)\\pi x}{L}\\big]=\\frac{4V}{L^2}x(L-x)$","c":true},{"x":"Applicare l'identit&agrave; di Parseval alla velocit&agrave; iniziale"},{"x":"Valutare la soluzione $y(x,t)$ in $x=L/2$ e $t=L/(2c)$"},{"x":"Derivare rispetto a $x$ la serie e porre $x=0$"}],"hint":"Serve il punto in cui $\\sin[(2k+1)\\pi x/L]$ produce esattamente $(-1)^k$; e serve una serie con $(2k+1)^3$ al denominatore, non $(2k+1)^4$.","sol":"In $x=L/2$ si ha $\\sin[(2k+1)\\pi/2]=(-1)^k$, e il membro destro vale $\\frac{4V}{L^2}\\cdot\\frac{L}{2}\\cdot\\frac{L}{2}=V$. Dunque $\\frac{32V}{\\pi^3}\\sum_k\\frac{(-1)^k}{(2k+1)^3}=V$, cio&egrave; $\\sum_k\\frac{(-1)^k}{(2k+1)^3}=\\frac{\\pi^3}{32}$ (verificato numericamente: $1-1/27+1/125-\\dots\\approx0{,}9689$, e $\\pi^3/32\\approx0{,}9689$). Il risultato invocato &egrave; il <em>teorema di convergenza puntuale</em> di Dirichlet per le serie di Fourier: $x(L-x)$ &egrave; continua e $C^1$ a tratti sul prolungamento dispari, quindi la serie converge al valore della funzione in ogni punto di regolarit&agrave;, e $x=L/2$ lo &egrave;. Parseval &egrave; la strada sbagliata per questo bersaglio: darebbe una somma di quadrati, cio&egrave; $\\sum(2k+1)^{-6}$. Partire dalla $y$ anzich&eacute; dalla $\\partial_ty$ porterebbe a $(2k+1)^4$ al denominatore, di nuovo un altro bersaglio."}]},{"pool":"edp","src":"modus operandi","steps":[{"t":"Ti trovi davanti all'esercizio 4 di un appello, che &egrave; una PDE. Prima di scrivere qualunque cosa, qual &egrave; il dato da leggere per primo?","opts":[{"x":"Il dominio spaziale insieme alle condizioni al bordo: sono loro a scegliere la base di autofunzioni, e quindi la forma di tutto il resto","c":true},{"x":"Il dato iniziale, perch&eacute; &egrave; da l&igrave; che si calcolano i coefficienti"},{"x":"L'ordine in $t$: se &egrave; primo &egrave; calore, se &egrave; secondo sono onde"},{"x":"La presenza o meno di una sorgente al membro destro"}],"hint":"Chiediti quale informazione, se cambiasse, ti costringerebbe a rifare l'esercizio da capo anzich&eacute; a rifare solo un integrale.","sol":"Il dominio e le BC. Se cambia il dato iniziale, cambiano solo i coefficienti, cio&egrave; un integrale; se cambiano le BC, cambia la <em>base</em>, e con essa lo spettro, la forma dei modi, la normalizzazione, tutto. La gerarchia di lettura corretta &egrave;: (1) dominio e BC $\\to$ base di autofunzioni, via problema di Sturm-Liouville; (2) ordine in $t$ e coefficiente $a(t)$ $\\to$ fattore temporale di ciascun modo; (3) dato iniziale $\\to$ coefficienti, per proiezione; (4) eventuale sorgente $\\to$ Duhamel o funzione di Green. Le quattro tabelle da avere in testa: Dirichlet omogenee su $[0,L]$ $\\to\\sin(n\\pi x/L)$, $n\\ge1$; Neumann omogenee $\\to\\cos(n\\pi x/L)$, $n\\ge0$; miste (Dirichlet in $0$, Neumann in $L$) $\\to\\sin\\!\\big[(n+\\tfrac12)\\pi x/L\\big]$, cio&egrave; mezzi interi; periodiche $\\to$ seni e coseni insieme, ovvero $e^{2\\pi inx/L}$.","cont":"Secondo passo: scegliere il metodo"},{"t":"Come si sceglie fra separazione di variabili, trasformata di Fourier e propagatore?","opts":[{"x":"Dominio limitato con BC omogenee $\\to$ separazione e serie discreta; retta intera $\\to$ trasformata di Fourier, che per il calore d&agrave; il nucleo gaussiano e per le onde la formula di d'Alembert; sorgente presente $\\to$ Green o Duhamel sopra la soluzione omogenea","c":true},{"x":"La separazione funziona sempre, la trasformata &egrave; solo una scorciatoia equivalente"},{"x":"La trasformata di Fourier &egrave; sempre preferibile perch&eacute; evita di imporre le condizioni al bordo"},{"x":"Si sceglie in base all'ordine dell'equazione: primo ordine $\\to$ trasformata, secondo ordine $\\to$ separazione"}],"hint":"La domanda vera &egrave;: lo spettro dell'operatore spaziale &egrave; discreto o continuo? &Egrave; il dominio a deciderlo.","sol":"&Egrave; una scelta dettata dallo spettro dell'operatore $\\partial_x^2$ sul dominio con quelle BC. Su intervallo limitato con BC omogenee l'operatore &egrave; autoaggiunto a risolvente compatto: spettro discreto, autofunzioni numerabili, e la soluzione &egrave; una <em>serie</em>. Su tutta la retta lo spettro &egrave; continuo, le autofunzioni sono generalizzate ($e^{ikx}$, non normalizzabili), e la somma diventa un <em>integrale</em>: la trasformata di Fourier &egrave; letteralmente lo stesso sviluppo, con $\\sum_n\\to\\int dk$. Il propagatore &egrave; poi il risultato di quell'integrale eseguito una volta per tutte sul dato $\\delta(x-y)$: per il calore $K(t,x-y)=\\frac{1}{\\sqrt{4\\pi Dt}}e^{-(x-y)^2/4Dt}$. Con una sorgente $f(t,x)$ si usa il principio di Duhamel: la soluzione &egrave; l'omogenea con lo stesso dato iniziale, pi&ugrave; $\\int_0^tds$ del propagatore applicato a $f(s,\\cdot)$. La separazione, per inciso, non &egrave; universale: fallisce se le BC non sono omogenee (ma si riconducono, sottraendo una soluzione stazionaria) o se il dominio non &egrave; un prodotto di intervalli nelle coordinate scelte."}]},{"pool":"edp","src":"teoria — Sturm-Liouville, cap. 19","steps":[{"t":"Sbarra $[0,L]$ con estremi termicamente isolati, $\\partial_tu=D\\partial_x^2u$ e $\\partial_xu(t,0)=\\partial_xu(t,L)=0$. Su quale sistema si sviluppa il dato iniziale?","opts":[{"x":"Serie di soli coseni, $\\;\\frac{a_0}{2}+\\sum_{n\\ge1}a_n\\cos\\!\\big(\\tfrac{n\\pi x}{L}\\big)$, con $\\lambda_n=-\\big(\\tfrac{n\\pi}{L}\\big)^2$ e $n\\ge0$","c":true},{"x":"Serie di soli seni, $\\sum_{n\\ge1}b_n\\sin\\!\\big(\\tfrac{n\\pi x}{L}\\big)$"},{"x":"Serie di Fourier completa con seni e coseni, perch&eacute; nessuna delle due famiglie si annulla al bordo"},{"x":"Serie di coseni con indici semi-interi, $\\cos\\!\\big[(n+\\tfrac12)\\pi x/L\\big]$"}],"hint":"Non chiederti quale funzione si annulla al bordo, ma quale ha <em>derivata</em> nulla al bordo.","sol":"Le BC di Neumann vincolano la derivata, non il valore: $\\psi'(0)=\\psi'(L)=0$ &egrave; soddisfatta da $\\cos(n\\pi x/L)$ e non da $\\sin(n\\pi x/L)$, la cui derivata agli estremi vale $\\pm n\\pi/L\\ne0$. Il problema di Sturm-Liouville $\\psi''=\\lambda\\psi$ con Neumann omogenee ha dunque autofunzioni i coseni e spettro $\\lambda_n=-(n\\pi/L)^2$ con $n\\ge0$, <em>zero incluso</em>. Lettura fisica: estremi isolati significa flusso nullo, $\\int_0^Lu\\,dx$ conservato, e il modo $\\lambda_0=0$ che non decade &egrave; esattamente quella conservazione. I casi da tenere allineati in memoria: Dirichlet $\\to$ seni con $n\\ge1$; Neumann $\\to$ coseni con $n\\ge0$; misto Dirichlet-Neumann $\\to$ mezzi interi. Gli indici semi-interi compaiono solo nel caso misto."}]},{"pool":"edp","src":"More problems, es. 2-5 / famiglia 20260212","steps":[{"t":"Sia $\\partial_tu=\\sin t\\;\\partial_x^2u$ su $[0,\\pi]$ con Dirichlet omogenee. Qual &egrave; il fattore temporale del modo $n$?","opts":[{"x":"$e^{-n^2(1-\\cos t)}$","c":true},{"x":"$e^{-n^2\\sin t}$"},{"x":"$e^{-n^2 t\\sin t}$"},{"x":"$e^{-n^2(1+\\cos t)}$"}],"hint":"L'esponente &egrave; $\\lambda_n\\int_0^t a(s)\\,ds$, e l'estremo inferiore $0$ non &egrave; ornamentale: garantisce che a $t=0$ il fattore valga $1$.","sol":"Con $u=\\varphi(t)\\psi(x)$ e Dirichlet si ha $\\psi_n=\\sin(nx)$, $\\lambda_n=-n^2$, e la parte temporale &egrave; $\\dot\\varphi=-n^2\\sin t\\,\\varphi$. Separando, $$\\ln\\varphi(t)-\\ln\\varphi(0)=-n^2\\int_0^t\\sin s\\,ds=-n^2\\big[1-\\cos t\\big],$$ da cui $\\varphi(t)=\\varphi_0e^{-n^2(1-\\cos t)}$. La primitiva scelta con estremo inferiore $0$ &egrave; ci&ograve; che fa valere $\\varphi(0)=\\varphi_0$: prendendo $\\int\\sin=-\\cos t$ senza costante si otterrebbe $e^{n^2\\cos t}$, che a $t=0$ vale $e^{n^2}$ e sballa tutti i coefficienti di un fattore diverso per ogni modo. La regola &egrave; una sola, con $a(t)$ qualunque: $\\varphi_n(t)=c_n\\exp\\!\\big[\\lambda_n\\int_0^ta(s)ds\\big]$.","cont":"Che cosa cambia qualitativamente"},{"t":"Rispetto al calore ordinario ($a=D>0$ costante), che cosa ha di anomalo questa soluzione?","opts":[{"x":"Non &egrave; monotona: dove $\\sin t<0$ i modi ricrescono, e a $t=2k\\pi$ si ritrova esattamente $u(2k\\pi,x)=g(x)$ — la soluzione &egrave; periodica in $t$","c":true},{"x":"Nulla di anomalo: poich&eacute; $1-\\cos t\\ge0$, il decadimento resta monotono"},{"x":"Diverge per $t>\\pi$, perch&eacute; l&igrave; il coefficiente &egrave; negativo e l'equazione diventa il calore all'indietro, che &egrave; mal posto"},{"x":"Decade pi&ugrave; in fretta del calore ordinario, perch&eacute; l'oscillazione del coefficiente accelera la diffusione"}],"hint":"Studia la funzione $t\\mapsto 1-\\cos t$: &egrave; sempre non negativa, ma non &egrave; crescente. E guarda che cosa succede ai multipli di $2\\pi$.","sol":"L'esponente $-n^2(1-\\cos t)$ ha $1-\\cos t\\in[0,2]$: il fattore resta sempre in $(0,1]$, quindi nessuna divergenza, ma non &egrave; monotono. Su $t\\in(0,\\pi)$ il coefficiente $\\sin t$ &egrave; positivo, l'equazione &egrave; parabolica in avanti e i modi decadono; su $t\\in(\\pi,2\\pi)$ il coefficiente &egrave; negativo e l'equazione &egrave; letteralmente il calore <em>all'indietro</em>, con i modi che ricrescono. Non c'&egrave; catastrofe perch&eacute; la crescita restituisce esattamente il credito accumulato: a $t=2k\\pi$ si ha $1-\\cos t=0$ e $u(2k\\pi,x)=g(x)$ per ogni dato. Il punto teorico &egrave; che l'irreversibilit&agrave; del calore non &egrave; nell'operatore $\\partial_x^2$ ma nel segno del coefficiente davanti: se il segno oscilla, il semigruppo perde la propriet&agrave; di contrazione stretta e la freccia del tempo svanisce. Con $a(t)=t^2\\ge0$ (il caso dell'appello 12/02/2026) questo non accade e il decadimento resta monotono."}]},{"pool":"edp","src":"Set 4 - Differential equations","steps":[{"t":"Sia $\\partial_tu=D\\partial_x^2u$ su $[0,\\pi]$ con $u(t,0)=u(t,\\pi)=0$ e $u(0,x)=3\\sin(2x)-\\sin(5x)$. Quanti integrali servono per trovare i coefficienti?","opts":[{"x":"Nessuno: il dato &egrave; gi&agrave; scritto nella base, quindi $c_2=3$, $c_5=-1$ e tutti gli altri sono nulli","c":true},{"x":"Due, uno per ciascuno dei due coefficienti non nulli"},{"x":"Infiniti, uno per ogni $n$, e poi si verifica che quasi tutti si annullano"},{"x":"Nessuno, ma solo perch&eacute; il dato &egrave; dispari: con un dato pari servirebbero gli integrali"}],"hint":"L'unicit&agrave; dei coefficienti di Fourier &egrave; un teorema, non un'osservazione: se una funzione &egrave; gi&agrave; scritta come combinazione della base, quella <em>&egrave;</em> la sua serie.","sol":"Per l'unicit&agrave; dello sviluppo su una base ortogonale completa, se $g$ &egrave; gi&agrave; una combinazione lineare finita degli elementi della base, i coefficienti si leggono. Nessun conto: $c_2=3$, $c_5=-1$, tutti gli altri zero. Volendo, l'integrale $\\frac2\\pi\\int_0^\\pi[3\\sin 2x-\\sin 5x]\\sin(nx)dx$ restituirebbe esattamente questo per ortogonalit&agrave;, ma farlo &egrave; puro spreco di minuti d'esame. Questo &egrave; uno dei quattro trabocchetti classificati di questa famiglia di esercizi, e ha un sintomo di riconoscimento immediato: il dato iniziale contiene funzioni trigonometriche <em>degli stessi argomenti delle autofunzioni</em>. Se invece il dato fosse $\\sin(2{,}5\\,x)$, oppure $x^2$, oppure $x(\\pi-x)$, gli integrali servirebbero eccome. Attenzione anche al caso ibrido, tipo $\\sin^3x$: non &egrave; nella base, ma un'identit&agrave; trigonometrica lo riduce a una combinazione finita ($\\sin^3x=\\frac34\\sin x-\\frac14\\sin 3x$), e di nuovo non serve alcun integrale.","cont":"Scrivi la soluzione"},{"t":"Quindi qual &egrave; $u(t,x)$?","opts":[{"x":"$u(t,x)=3e^{-4Dt}\\sin(2x)-e^{-25Dt}\\sin(5x)$","c":true},{"x":"$u(t,x)=3e^{-2Dt}\\sin(2x)-e^{-5Dt}\\sin(5x)$"},{"x":"$u(t,x)=e^{-4Dt}\\big[3\\sin(2x)-\\sin(5x)\\big]$"},{"x":"$u(t,x)=3e^{-4D t^2}\\sin(2x)-e^{-25Dt^2}\\sin(5x)$"}],"hint":"Ogni modo ha il <em>proprio</em> tasso di decadimento, e il tasso va come il quadrato del numero d'onda.","sol":"Il modo $\\sin(nx)$ &egrave; autofunzione di $\\partial_x^2$ con autovalore $-n^2$, quindi la sua ampiezza evolve secondo $\\dot c_n=-Dn^2c_n$, cio&egrave; $c_n(t)=c_n(0)e^{-Dn^2t}$. Con $n=2$: $e^{-4Dt}$; con $n=5$: $e^{-25Dt}$. Il fatto strutturale &egrave; che l'equazione del calore &egrave; un <em>filtro passa-basso</em>: il rapporto fra le due ampiezze evolve come $e^{-21Dt}$, cio&egrave; il modo a lunghezza d'onda corta muore molto pi&ugrave; in fretta, ed &egrave; il motivo per cui la soluzione diventa liscia istantaneamente per $t>0$ qualunque sia la rugosit&agrave; del dato. Il tempo caratteristico del modo $n$ &egrave; $\\tau_n=1/(Dn^2)$: quadratico, non lineare. Un fattore comune $e^{-4Dt}$ a entrambi i modi corrisponderebbe a un operatore che non distingue le scale, cio&egrave; non a $\\partial_x^2$."}]},{"pool":"edp","src":"teoria — nucleo del calore, cap. 20","steps":[{"t":"Sia $\\partial_tu=D\\partial_x^2u$ su tutta la retta con $u(0,x)=g(x)$ regolare e integrabile. Qual &egrave; la soluzione?","opts":[{"x":"$u(t,x)=\\displaystyle\\int_{-\\infty}^{+\\infty}\\!\\!dy\\;\\frac{e^{-(x-y)^2/(4Dt)}}{\\sqrt{4\\pi Dt}}\\,g(y)$","c":true},{"x":"$u(t,x)=\\displaystyle\\int_{-\\infty}^{+\\infty}\\!\\!dy\\;\\frac{e^{-(x-y)^2/(2Dt)}}{\\sqrt{2\\pi Dt}}\\,g(y)$"},{"x":"$u(t,x)=\\displaystyle\\int_{-\\infty}^{+\\infty}\\!\\!dy\\;\\frac{e^{-(x-y)^2/(4Dt)}}{\\sqrt{2\\pi Dt}}\\,g(y)$"},{"x":"$u(t,x)=\\displaystyle\\sum_{n\\ge1}c_n e^{-Dn^2t}\\sin(nx)$, con i $c_n$ presi da $g$"}],"hint":"La normalizzazione si fissa in un colpo solo: il nucleo deve avere integrale $1$ in $y$, cos&igrave; che per $t\\to0^+$ diventi $\\delta(x-y)$ e restituisca $g$.","sol":"Trasformando in $x$: $\\partial_t\\hat u=-Dk^2\\hat u$, cio&egrave; $\\hat u(t,k)=\\hat g(k)e^{-Dk^2t}$. Per il <em>teorema di convoluzione</em> il prodotto in $k$ diventa convoluzione in $x$, e l'antitrasformata di una gaussiana &egrave; una gaussiana: $\\mathcal{F}^{-1}[e^{-Dk^2t}](s)=\\frac{1}{\\sqrt{4\\pi Dt}}e^{-s^2/(4Dt)}$. Da qui $u=K_t*g$ con $K_t(s)=\\frac{1}{\\sqrt{4\\pi Dt}}e^{-s^2/(4Dt)}$. Controllo della normalizzazione, che &egrave; il modo veloce di non sbagliare i fattori: $\\int_{-\\infty}^{+\\infty}e^{-s^2/(4Dt)}ds=\\sqrt{4\\pi Dt}$ per la gaussiana di Gauss $\\int e^{-\\alpha s^2}ds=\\sqrt{\\pi/\\alpha}$ con $\\alpha=1/(4Dt)$; quindi il prefattore $1/\\sqrt{4\\pi Dt}$ &egrave; l'unico che rende $\\int K_t=1$, cio&egrave; $K_t\\to\\delta$ per $t\\to0^+$. Lo sviluppo in serie di seni &egrave; sbagliato qui perch&eacute; su tutta la retta lo spettro di $\\partial_x^2$ &egrave; continuo: non ci sono BC che quantizzino $k$.","cont":"Dato gaussiano"},{"t":"Se $g(x)=e^{-x^2/(2a^2)}$, la soluzione resta gaussiana. Quale?","opts":[{"x":"$u(t,x)=\\dfrac{a}{\\sqrt{a^2+2Dt}}\\,e^{-x^2/[2(a^2+2Dt)]}$: le varianze si sommano, $\\sigma^2(t)=a^2+2Dt$","c":true},{"x":"$u(t,x)=\\dfrac{a}{\\sqrt{a^2+4Dt}}\\,e^{-x^2/[2(a^2+4Dt)]}$"},{"x":"$u(t,x)=e^{-x^2/[2(a^2+2Dt)]}$, con ampiezza di picco invariata"},{"x":"$u(t,x)=\\dfrac{a}{\\sqrt{a^2+2Dt}}\\,e^{-x^2/(2a^2)}e^{-2Dt}$"}],"hint":"Non fare l'integrale: usa che la convoluzione di due gaussiane &egrave; gaussiana, e scrivi la varianza del nucleo nella convenzione $e^{-s^2/(2\\sigma^2)}$.","sol":"Riscrivendo il nucleo come $\\frac{1}{\\sqrt{2\\pi\\sigma_K^2}}e^{-s^2/(2\\sigma_K^2)}$ si legge $2\\sigma_K^2=4Dt$, cio&egrave; $\\sigma_K^2=2Dt$. Il dato ha varianza $a^2$ e massa $\\int g=a\\sqrt{2\\pi}$. Per il teorema di convoluzione, in Fourier le due gaussiane si moltiplicano e gli esponenti si sommano: le varianze si sommano, $\\sigma^2(t)=a^2+2Dt$, mentre la massa si conserva. Quindi $$u(t,x)=a\\sqrt{2\\pi}\\cdot\\frac{1}{\\sqrt{2\\pi(a^2+2Dt)}}e^{-x^2/[2(a^2+2Dt)]}=\\frac{a}{\\sqrt{a^2+2Dt}}\\,e^{-x^2/[2(a^2+2Dt)]}.$$ Tre controlli che valgono pi&ugrave; del conto: (i) $t\\to0^+$ restituisce $g$; (ii) $\\int u\\,dx=a\\sqrt{2\\pi}$ per ogni $t$, come dev'essere perch&eacute; $\\frac{d}{dt}\\int u=D[\\partial_xu]_{-\\infty}^{+\\infty}=0$; (iii) l'altezza del picco decresce come $t^{-1/2}$ mentre la larghezza cresce come $t^{1/2}$, ed &egrave; la firma diffusiva $\\sigma\\sim\\sqrt{2Dt}$, la stessa del moto browniano. Il $4Dt$ al posto del $2Dt$ &egrave; l'errore di chi confonde le due convenzioni: nel nucleo compare $4Dt$ perch&eacute; l&igrave; il denominatore &egrave; $2\\sigma_K^2$."}]},{"pool":"edp","src":"modus operandi","steps":[{"t":"Hai scritto $u(t,x)=\\sum_nc_ne^{-\\lambda_nt}\\psi_n(x)$. Qual &egrave; il controllo che costa dieci secondi e salva l'esercizio?","opts":[{"x":"Verificare che $u(0,x)$ riproduca il dato iniziale e che ogni singolo $\\psi_n$ soddisfi le BC assegnate","c":true},{"x":"Verificare che la serie converga uniformemente su $[0,L]\\times[0,\\infty)$"},{"x":"Verificare che $\\int_0^L u\\,dx$ sia finito"},{"x":"Verificare che $\\lambda_n$ sia reale"}],"hint":"I due controlli utili sono quelli che intercettano gli errori che davvero si fanno: la famiglia sbagliata e la normalizzazione sbagliata.","sol":"Le BC vanno controllate <em>modo per modo</em>: se hai scritto seni dove servivano coseni, $\\partial_x\\psi_n(0)\\ne0$ salta all'occhio senza fare alcun conto. Il limite $t\\to0^+$ intercetta invece l'altro errore ricorrente, la normalizzazione dei coefficienti: se il fattore $2/L$ &egrave; sbagliato, la serie a $t=0$ non restituisce il dato. Sono i due errori che effettivamente compaiono nei compiti, mentre la convergenza uniforme e la realt&agrave; degli autovalori sono garantite a monte dal teorema spettrale per operatori di Sturm-Liouville autoaggiunti, e verificarle non fa guadagnare punti. Aggiungi, se hai tempo, la verifica che l'equazione sia soddisfatta modo per modo: basta derivare un termine.","cont":"Secondo controllo"},{"t":"E il controllo dimensionale-asintotico?","opts":[{"x":"$\\lambda_nt$ dev'essere adimensionale (per il calore $\\lambda_n\\sim Dn^2/L^2$, e $[D]=\\mathrm{lung}^2/\\mathrm{tempo}$), e il limite $t\\to\\infty$ dev'essere coerente con le BC: $\\to0$ con Dirichlet, $\\to$ valor medio con Neumann","c":true},{"x":"Basta che i coefficienti $c_n$ decrescano, senza altro requisito"},{"x":"Il limite $t\\to\\infty$ deve sempre essere $0$, qualunque siano le BC"},{"x":"Le dimensioni non sono un criterio utile, perch&eacute; le PDE d'esame sono adimensionali"}],"hint":"Un esponente con le dimensioni sbagliate &egrave; un errore che si vede senza rifare il conto; e l'asintotica ha un significato fisico che dipende dalle BC.","sol":"Ogni esponente dev'essere puro: per il calore $\\lambda_nt=Dn^2\\pi^2t/L^2$ &egrave; adimensionale perch&eacute; $[D]=\\mathrm{lunghezza}^2/\\mathrm{tempo}$; per le onde $\\omega_nt=n\\pi ct/L$ lo &egrave; perch&eacute; $[c]=\\mathrm{lunghezza}/\\mathrm{tempo}$. Se compare $Dnt/L$ oppure $Dn^2t/L$, manca una potenza e il conto &egrave; sbagliato. Il secondo pezzo &egrave; il regime asintotico, che dipende dalle BC e non dal dato: Dirichlet omogenee $\\to u\\to0$, perch&eacute; il calore esce dagli estremi; Neumann omogenee $\\to u\\to$ media di $g$, perch&eacute; $\\int u$ &egrave; conservato; equazione delle onde $\\to$ nessun decadimento, l'energia $\\frac12\\int[(\\partial_ty)^2+c^2(\\partial_xy)^2]dx$ si conserva e la soluzione &egrave; quasi-periodica. Se il tuo risultato per un problema di Neumann tende a zero, hai perso il modo $n=0$; se un problema di onde ti decade, hai messo un esponenziale reale dove andava un'oscillazione."}]},{"pool":"edp","src":"20250909 Es.4","steps":[{"t":"Appello 09/09/2025. Si risolva $-\\partial_t^2u+\\partial_x^2u-x^2u=0$ per $t\\ge0$ e $x\\in\\mathbb{R}$, con $\\lim_{|x|\\to\\infty}u(t,x)=0$. Separando $u=\\varphi(t)\\psi(x)$, quale problema agli autovalori resta in $x$?","opts":[{"x":"$\\big(-\\tfrac{d^2}{dx^2}+x^2\\big)\\psi=\\lambda\\psi$, l'oscillatore armonico: $\\lambda_n=2n+1$ e $\\psi_n(x)=H_n(x)e^{-x^2/2}$, con $n\\ge0$","c":true},{"x":"$\\psi''=\\lambda\\psi$ con $\\psi(\\pm\\infty)=0$, che su tutta la retta non ha autovalori discreti"},{"x":"$\\big(-\\tfrac{d^2}{dx^2}+x^2\\big)\\psi=\\lambda\\psi$ con $\\lambda_n=n+\\tfrac12$"},{"x":"$\\psi''-x^2\\psi=\\lambda\\psi$ con $\\lambda_n=-n^2$ e autofunzioni $\\sin(nx)$"}],"hint":"La condizione al bordo qui non &egrave; un valore su due estremi, ma il decadimento all'infinito: &egrave; quella a quantizzare lo spettro. E attenzione alla convenzione degli autovalori.","sol":"Separando, $$\\frac{\\ddot\\varphi(t)}{\\varphi(t)}=\\frac{\\psi''(x)-x^2\\psi(x)}{\\psi(x)}=\\mu .$$ Il membro destro &egrave; $-A\\psi/\\psi$ con $A=-\\frac{d^2}{dx^2}+x^2$, l'operatore dell'oscillatore armonico, autoaggiunto su $L^2(\\mathbb{R})$ e con spettro puramente discreto grazie al potenziale confinante. Le sue autofunzioni sono le funzioni di Hermite $f_n(x)=H_n(x)e^{-x^2/2}$, con $-f_n''+x^2f_n=(2n+1)f_n$: la convenzione $2n+1$ &egrave; quella con l'operatore scritto <em>senza</em> il fattore $1/2$; il familiare $n+\\tfrac12$ della meccanica quantistica &egrave; lo stesso spettro diviso per due, perch&eacute; l&igrave; l'hamiltoniana &egrave; $\\frac12(-\\partial_x^2+x^2)$. Poich&eacute; qui il membro destro &egrave; $-\\lambda_n$, si ha $\\mu_n=-(2n+1)$. Il suggerimento del testo &egrave; la freccia: quando compare $x^2u$ su tutta la retta con decadimento a infinito, la base &egrave; Hermite.","cont":"Risolvi la parte temporale"},{"t":"Con $\\mu_n=-(2n+1)$ l'equazione temporale &egrave; $\\ddot\\varphi_n=-(2n+1)\\varphi_n$. Che cosa resta dopo aver imposto $\\lim_{t\\to0}\\partial_tu(t,x)=0$?","opts":[{"x":"$\\varphi_n=a_ne^{i\\sqrt{2n+1}\\,t}+b_ne^{-i\\sqrt{2n+1}\\,t}$, e la condizione impone $a_n=b_n$: resta $\\varphi_n\\propto\\cos\\!\\big(\\sqrt{2n+1}\\,t\\big)$","c":true},{"x":"$\\varphi_n=a_ne^{-(2n+1)t}$, e la condizione impone $a_n=0$"},{"x":"$\\varphi_n\\propto\\sin\\!\\big(\\sqrt{2n+1}\\,t\\big)$"},{"x":"$\\varphi_n=a_n+b_nt$, perch&eacute; con $\\mu<0$ l'equazione degenera"}],"hint":"L'equazione temporale &egrave; del secondo ordine con costante negativa a destra: oscilla, non decade. E la condizione va imposta modo per modo, il che richiede un argomento.","sol":"$\\ddot\\varphi=-\\omega_n^2\\varphi$ con $\\omega_n=\\sqrt{2n+1}$ ha per generale $a_ne^{i\\omega_nt}+b_ne^{-i\\omega_nt}$. Derivando la serie e ponendo $t\\to0$: $\\sum_ni\\omega_n(a_n-b_n)f_n(x)=0$. Qui serve un risultato preciso, l'<em>indipendenza lineare</em> (anzi, la completezza ortogonale) della base di Hermite in $L^2(\\mathbb{R})$: una combinazione che si annulla identicamente ha tutti i coefficienti nulli, quindi $a_n=b_n$ per ogni $n$, non solo la somma. Con $a_n=b_n$ si ottiene $\\varphi_n=2a_n\\cos(\\omega_nt)$, coerente con l'idea fisica di un sistema che parte in quiete.","cont":"Leggi i coefficienti dal dato"},{"t":"Il dato &egrave; $u(0,x)=(2+3x)e^{-x^2/2}$. Sapendo che $H_0(x)=1$ e $H_1(x)=2x$, quali coefficienti si leggono in $u(0,x)=\\sum_n2a_nH_n(x)e^{-x^2/2}$?","opts":[{"x":"$a_0=1$ e $a_1=\\tfrac34$, tutti gli altri nulli","c":true},{"x":"$a_0=2$ e $a_1=3$"},{"x":"$a_0=1$ e $a_1=\\tfrac32$"},{"x":"Nessuno si legge: servono gli integrali $a_n\\propto\\int f_n(x)u(0,x)dx$, perch&eacute; il dato non &egrave; una combinazione finita"}],"hint":"$H_1(x)=2x$ e non $x$: c'&egrave; un fattore 2 da scontare. E prima ancora ce n'&egrave; un altro, il $2a_n$ della scrittura.","sol":"Il dato &egrave; gi&agrave; una combinazione finita degli elementi della base, quindi per l'unicit&agrave; dello sviluppo su base ortogonale non serve alcun integrale. Termine per termine: $2a_0H_0e^{-x^2/2}=2a_0e^{-x^2/2}$ deve dare $2e^{-x^2/2}$, quindi $a_0=1$; $2a_1H_1e^{-x^2/2}=4a_1xe^{-x^2/2}$ deve dare $3xe^{-x^2/2}$, quindi $a_1=\\tfrac34$. Il doppio fattore 2 (uno dal $2a_n$, uno da $H_1=2x$) &egrave; esattamente ci&ograve; su cui l'esercizio conta; $a_1=3/2$ &egrave; l'errore di chi dimentica $H_1=2x$, $a_0=2$ quello di chi dimentica il $2a_n$.","cont":"Assembla la soluzione"},{"t":"Qual &egrave; la soluzione finale?","opts":[{"x":"$u(t,x)=\\big[2\\cos t+3x\\cos(\\sqrt3\\,t)\\big]e^{-x^2/2}$","c":true},{"x":"$u(t,x)=\\big[2\\cos t+3x\\cos(3t)\\big]e^{-x^2/2}$"},{"x":"$u(t,x)=\\big[2\\cos t+\\tfrac32x\\cos(\\sqrt3\\,t)\\big]e^{-x^2/2}$"},{"x":"$u(t,x)=\\big[2\\cos t+3x\\cos(\\sqrt3\\,t)\\big]e^{-x^2}$"}],"hint":"La frequenza del modo $n$ &egrave; $\\sqrt{2n+1}$, non $2n+1$: la radice non si perde. E il controllo &egrave; immediato: poni $t=0$.","sol":"Con $a_0=1$, $\\omega_0=\\sqrt1=1$, e $a_1=3/4$, $\\omega_1=\\sqrt3$: $$u(t,x)=2\\cos(t)\\,H_0e^{-x^2/2}+2\\cdot\\tfrac34\\cos(\\sqrt3t)\\,H_1e^{-x^2/2}=\\big[2\\cos t+3x\\cos(\\sqrt3\\,t)\\big]e^{-x^2/2}.$$ Controllo a $t=0$: si ritrova $(2+3x)e^{-x^2/2}$, e $\\partial_tu|_{t=0}=[-2\\sin 0-3\\sqrt3x\\sin0]e^{-x^2/2}=0$: entrambi i dati sono soddisfatti. Osservazione che vale un commento all'orale: le frequenze $\\sqrt{2n+1}$ stanno fra loro in rapporto irrazionale ($1:\\sqrt3:\\sqrt5\\ldots$), quindi la soluzione &egrave; quasi-periodica ma non periodica in $t$ — a differenza della corda vibrante, dove le frequenze $n\\omega_1$ sono commensurabili e il moto ha periodo $2L/c$.","cont":"Perch&eacute; proprio Hermite"},{"t":"Perch&eacute; qui la base giusta &egrave; quella di Hermite e non $e^{ikx}$, nonostante il dominio spaziale sia tutto $\\mathbb{R}$?","opts":[{"x":"Perch&eacute; il termine $x^2u$ rompe l'invarianza per traslazione: $e^{ikx}$ non &egrave; autofunzione di $-\\partial_x^2+x^2$. &Egrave; il potenziale confinante, non la limitatezza del dominio, a rendere lo spettro discreto","c":true},{"x":"Perch&eacute; $e^{ikx}$ non &egrave; a quadrato sommabile, e quindi non si pu&ograve; mai usare"},{"x":"Perch&eacute; il dominio temporale $t\\ge0$ &egrave; una semiretta"},{"x":"Perch&eacute; il dato iniziale contiene una gaussiana, e le gaussiane si sviluppano solo su Hermite"}],"hint":"Chiediti quale simmetria dell'equazione &egrave; responsabile del fatto che, di solito, su $\\mathbb{R}$ si usa Fourier.","sol":"Su $\\mathbb{R}$ la trasformata di Fourier &egrave; la scelta giusta quando l'operatore spaziale commuta con le traslazioni, perch&eacute; allora $e^{ikx}$ ne &egrave; autofunzione. Il termine $x^2$ distrugge quella simmetria e con essa la diagonalizzabilit&agrave; in $k$: infatti in Fourier $x^2\\to-\\partial_k^2$, e l'equazione resta differenziale invece di diventare algebrica. Il potenziale $x^2$ confina, e il confinamento (non la limitatezza del dominio) &egrave; ci&ograve; che discretizza lo spettro: la lezione generale &egrave; che <em>lo spettro discreto viene dagli stati legati</em>, che li produca una scatola con pareti o una buca di potenziale. La stessa equazione, letta in fisica, &egrave; un campo di Klein-Gordon in un potenziale armonico, e le frequenze $\\sqrt{2n+1}$ sono le radici delle energie dell'oscillatore quantistico."}]},{"pool":"edp","src":"20251105 Es.4","steps":[{"t":"Appello 05/11/2025. $\\partial_tf=\\partial_x^2f$ per $t>0$ e $0\\le x<2\\pi$, con $f$ <em>periodica</em> in $x$. Quale base di autofunzioni impongono le condizioni periodiche?","opts":[{"x":"$\\{e^{inx}\\}_{n\\in\\mathbb{Z}}$, equivalentemente $\\{1,\\cos(nx),\\sin(nx)\\}_{n\\ge1}$: le periodiche non selezionano n&eacute; i soli seni n&eacute; i soli coseni","c":true},{"x":"I soli $\\sin(nx)$ con $n\\ge1$"},{"x":"I soli $\\cos(nx)$ con $n\\ge0$"},{"x":"$e^{i(n+1/2)x}$, per antiperiodicit&agrave;"}],"hint":"Le condizioni periodiche sono due, $\\psi(0)=\\psi(2\\pi)$ e $\\psi'(0)=\\psi'(2\\pi)$, ma non fissano alcun valore: quante autofunzioni indipendenti possono coesistere con lo stesso autovalore?","sol":"Le BC periodiche $\\psi(0)=\\psi(2\\pi)$, $\\psi'(0)=\\psi'(2\\pi)$ sono soddisfatte da $\\cos(nx)$ e $\\sin(nx)$ allo stesso modo, per ogni $n$ intero. La differenza strutturale con Dirichlet e Neumann &egrave; la <em>degenerazione</em>: qui ogni autovalore $\\lambda_n=-n^2$ con $n\\ge1$ ha molteplicit&agrave; due, mentre nei problemi di Sturm-Liouville regolari su un intervallo con BC separate lo spettro &egrave; sempre semplice. Il motivo &egrave; la simmetria: il problema periodico &egrave; invariante per traslazione lungo il cerchio, e la degenerazione &egrave; l'ombra di quella simmetria continua. Il modo $n=0$ (costante) &egrave; presente e non degenere. Le autofunzioni antiperiodiche compaiono solo se il testo impone $\\psi(2\\pi)=-\\psi(0)$, che non &egrave; questo caso.","cont":"Risolvi col dato assegnato"},{"t":"Con $f(x,0)=\\sin(2x)-\\cos(x)$, qual &egrave; la soluzione?","opts":[{"x":"$f(x,t)=e^{-4t}\\sin(2x)-e^{-t}\\cos(x)$","c":true},{"x":"$f(x,t)=e^{-2t}\\sin(2x)-e^{-t}\\cos(x)$"},{"x":"$f(x,t)=e^{-4t}\\big[\\sin(2x)-\\cos(x)\\big]$"},{"x":"$f(x,t)=c_0+e^{-4t}\\sin(2x)-e^{-t}\\cos(x)$, con $c_0$ da determinare"}],"hint":"Ogni modo porta il suo tasso $e^{-n^2t}$, e $n$ si legge dall'argomento. Verifica poi sostituendo: costa dieci secondi.","sol":"Il dato &egrave; gi&agrave; combinazione finita di autofunzioni: $c$ del modo $\\sin(2x)$ vale $1$, quello di $\\cos(x)$ vale $-1$, tutti gli altri sono zero. Il modo $n$ evolve con $e^{-n^2t}$, quindi $n=2$ d&agrave; $e^{-4t}$ e $n=1$ d&agrave; $e^{-t}$. Verifica diretta: $\\partial_tf=-4e^{-4t}\\sin(2x)+e^{-t}\\cos x$ e $\\partial_x^2f=-4e^{-4t}\\sin(2x)+e^{-t}\\cos x$: coincidono, e a $t=0$ si ritrova il dato. Il termine costante $c_0$ &egrave; nullo perch&eacute; il valor medio del dato su un periodo &egrave; zero, e sotto BC periodiche $\\int_0^{2\\pi}f\\,dx$ si conserva ($\\frac{d}{dt}\\int f=[\\partial_xf]_0^{2\\pi}=0$ per periodicit&agrave;): non pu&ograve; nascere dal nulla.","cont":"Riconoscere l'esercizio corto"},{"t":"Questo esercizio vale 6 punti, meno degli altri esercizi 4 del 2025-26. Da che cosa si riconosce <em>prima di iniziare</em> che &egrave; il caso corto?","opts":[{"x":"Dal dato iniziale scritto direttamente negli argomenti delle autofunzioni del dominio: nessun integrale di proiezione, solo l'attribuzione dei tassi $e^{-n^2t}$","c":true},{"x":"Dal fatto che il dominio &egrave; $[0,2\\pi)$ e non un generico $[0,L]$"},{"x":"Dal fatto che l'equazione &egrave; il calore puro, senza coefficienti variabili n&eacute; sorgenti"},{"x":"Dal punteggio: sotto gli 8 punti non compaiono mai serie infinite"}],"hint":"Confronta gli argomenti del dato con gli argomenti delle autofunzioni: se coincidono, met&agrave; dell'esercizio &egrave; gi&agrave; fatta.","sol":"La spia &egrave; la coincidenza fra gli argomenti del dato ($\\sin 2x$, $\\cos x$) e quelli delle autofunzioni ammesse dalle BC ($\\sin nx$, $\\cos nx$ con $n$ intero, perch&eacute; il periodo &egrave; $2\\pi$). Quando accade, il dato &egrave; gi&agrave; sviluppato e si legge; quando non accade — dato $x^2$, oppure $x(L-x)$, oppure $e^{-x}$ — serve la proiezione e l'esercizio si allunga di un'integrazione per parti o due. Corollario utile: se il dato <em>non</em> fosse periodico su $[0,2\\pi)$ (per esempio $\\sin(2{,}5\\,x)$) il problema sarebbe mal posto, perch&eacute; il dato dev'essere compatibile con le BC. La compatibilit&agrave; dato-BC &egrave; sempre la prima cosa da controllare: in un esercizio ben posto o coincide (caso corto) o richiede la proiezione (caso lungo), mai nessuna delle due."}]},{"pool":"edp","src":"20250707 Es.4","steps":[{"t":"Appello 08/07/2025. $\\partial_tf=\\partial_x^2f-\\partial_xf-f+\\delta(x)\\,\\delta\\!\\big(\\tfrac t3-1\\big)$ su $x\\in\\mathbb{R}$, con $f(t=-\\tfrac12,x)=0$. Prima mossa: come si riscrive $\\delta(t/3-1)$?","opts":[{"x":"$3\\,\\delta(t-3)$","c":true},{"x":"$\\delta(t-3)$"},{"x":"$\\tfrac13\\,\\delta(t-3)$"},{"x":"$3\\,\\delta(t-1)$"}],"hint":"Vale $\\delta(g(t))=\\sum_i\\delta(t-t_i)/|g'(t_i)|$ sugli zeri semplici: qui c'&egrave; un solo zero e la derivata vale $1/3$, quindi si <em>divide</em> per $1/3$.","sol":"$g(t)=t/3-1$ si annulla in $t=3$ e ha $g'=1/3$, dunque $\\delta(t/3-1)=\\delta(t-3)/|1/3|=3\\,\\delta(t-3)$. Controllo indipendente in una riga, che &egrave; il modo pi&ugrave; sicuro di non sbagliare il verso del fattore: $\\int_{-\\infty}^{+\\infty}\\delta(t/3-1)\\,dt$, con $s=t/3$ e $dt=3\\,ds$, vale $3\\int\\delta(s-1)ds=3$; e infatti $\\int 3\\delta(t-3)dt=3$. La sorgente &egrave; dunque un impulso puntiforme in $x=0$ acceso all'istante $t=3$ con <em>peso 3</em>. Nota per chi legge la stampa ufficiale: nell'equazione trasformata il testo scrive per refuso $3\\delta(t-1)$, ma nella riga immediatamente successiva dichiara $\\delta(t/3-1)=3\\delta(t-3)$ e da l&igrave; in avanti usa coerentemente $\\theta(t-3)$; il refuso &egrave; nell'argomento, non nel fattore.","cont":"Semplifica l'operatore"},{"t":"Per l'omogenea associata, quali sostituzioni riducono $\\partial_tf=\\partial_x^2f-\\partial_xf-f$ al calore puro?","opts":[{"x":"$f=e^{-t}h$ elimina il termine $-f$ lasciando $\\partial_th=\\partial_x^2h-\\partial_xh$; poi il passaggio al sistema mobile $\\xi=x-t$ elimina l'advezione e resta $\\partial_tH=\\partial_\\xi^2H$","c":true},{"x":"$f=e^{-x}h$ elimina entrambi i termini in un colpo solo"},{"x":"$f=e^{+t}h$ elimina il termine $-f$"},{"x":"Nessuna sostituzione elementare: i due termini vanno trattati perturbativamente"}],"hint":"Il termine di ordine zero si assorbe in un fattore che dipende solo da $t$; il termine del primo ordine si assorbe cambiando riferimento.","sol":"Con $f=e^{-t}h$: $\\partial_tf=e^{-t}(\\dot h-h)$ e il membro destro vale $e^{-t}(h''-h'-h)$; uguagliando, i due $-h$ si cancellano e resta $\\dot h=h''-h'$. Poi,
