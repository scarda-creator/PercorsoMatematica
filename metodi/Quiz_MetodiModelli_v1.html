t,x)=\\dfrac{e^{-t}}{2\\pi}\\displaystyle\\int_0^{\\infty}\\!dk\\;\\dfrac{e^{-(1-\\cos t)k^2}}{1+k^2}e^{ikx}$"}],"hint":"L'integrando &egrave; pari in $k$: sostituisci $e^{ikx}$ con $\\cos(kx)$ e dimezza il dominio raddoppiando. Poi controlla il caso $t=0$.","sol":"Antitrasformando, $u=\\int\\frac{dk}{2\\pi}\\hat u\\,e^{ikx}$ con $\\hat u=\\frac{2e^{-t}}{1+k^2}e^{-(1-\\cos t)k^2}$. L'integrando &egrave; pari in $k$, quindi la parte in $\\sin(kx)$ si cancella e $\\int_{-\\infty}^{+\\infty}=2\\int_0^{+\\infty}$: $$u=\\frac{1}{2\\pi}\\cdot 2\\cdot 2e^{-t}\\int_0^{\\infty}\\frac{e^{-(1-\\cos t)k^2}}{1+k^2}\\cos(kx)\\,dk=\\frac{2e^{-t}}{\\pi}\\int_0^{\\infty}\\frac{e^{-(1-\\cos t)k^2}}{1+k^2}\\cos(kx)\\,dk,$$ in accordo con la stampa ufficiale. Verifica in $t=0$, che &egrave; il controllo decisivo: resta $\\frac{2}{\\pi}\\int_0^{\\infty}\\frac{\\cos(kx)}{1+k^2}dk$, integrale noto (si fa per residui chiudendo nel semipiano superiore sul polo $k=i$) che vale $\\frac{\\pi}{2}e^{-|x|}$; il prodotto d&agrave; $e^{-|x|}$, cio&egrave; proprio il dato esteso. Notare infine che nessuna primitiva elementare esiste per $t>0$: il testo lo dice esplicitamente, ed &egrave; una licenza da usare — portare il conto fino all'integrale unidimensionale &egrave; la risposta completa."}]},{"pool":"edp","src":"trabocchetto ricorrente — scaling della delta","steps":[{"t":"In sorgenti di PDE compaiono, in appelli diversi, le scritture $\\delta\\!\\big(\\tfrac t3-1\\big)$, $\\delta(2t-4)$ e $\\delta(t^2-4)$ con $t\\ge0$. Quale terna di riscritture &egrave; corretta?","opts":[{"x":"$3\\delta(t-3)$;  $\\tfrac12\\delta(t-2)$;  $\\tfrac14\\delta(t-2)$","c":true},{"x":"$\\tfrac13\\delta(t-3)$;  $2\\delta(t-2)$;  $4\\delta(t-2)$"},{"x":"$3\\delta(t-3)$;  $2\\delta(t-2)$;  $\\tfrac14\\delta(t-2)$"},{"x":"$3\\delta(t-1)$;  $\\tfrac12\\delta(t-4)$;  $\\tfrac14\\delta(t-4)$"},{"x":"$3\\delta(t-3)$;  $\\tfrac12\\delta(t-2)$;  $\\tfrac14\\big[\\delta(t-2)+\\delta(t+2)\\big]$"}],"hint":"Il coefficiente &egrave; l'<em>inverso</em> del modulo della derivata, non la derivata. E nell'ultimo caso conta quali zeri cadono davvero nel dominio.","sol":"Regola invocata: $\\delta(g(t))=\\sum_i\\frac{\\delta(t-t_i)}{|g'(t_i)|}$, somma sugli zeri <em>semplici</em> di $g$ (se $g'(t_i)=0$ la composizione non &egrave; definita come distribuzione in questo modo). Caso per caso: $g=t/3-1$ ha zero in $3$ e $|g'|=1/3$, quindi $3\\delta(t-3)$; $g=2t-4$ ha zero in $2$ e $|g'|=2$, quindi $\\tfrac12\\delta(t-2)$; $g=t^2-4$ ha zeri in $\\pm2$ con $|g'(\\pm2)|=4$, ma il dominio &egrave; $t\\ge0$ e sopravvive solo $\\tfrac14\\delta(t-2)$. Verifica indipendente sul primo, che &egrave; il pi&ugrave; insidioso perch&eacute; il fattore &egrave; maggiore di uno: $\\int\\delta(t/3-1)dt=3$ per sostituzione diretta. Il modo di ricordare il verso: comprimere l'argomento (moltiplicarlo per un numero grande) <em>stringe</em> il picco e quindi ne riduce il peso; dilatarlo (dividerlo per 3) allarga e quindi aumenta il peso."}]},{"pool":"edp","src":"teoria — onde su dominio illimitato, cap. 20","steps":[{"t":"Onde su tutta la retta, $\\partial_t^2y=c^2\\partial_x^2y$ con $y(x,0)=f(x)$ e $\\partial_ty(x,0)=g(x)$. Qual &egrave; la formula di d'Alembert?","opts":[{"x":"$y=\\tfrac12\\big[f(x-ct)+f(x+ct)\\big]+\\dfrac{1}{2c}\\displaystyle\\int_{x-ct}^{x+ct}\\!g(s)\\,ds$","c":true},{"x":"$y=\\tfrac12\\big[f(x-ct)+f(x+ct)\\big]+\\tfrac12\\displaystyle\\int_{x-ct}^{x+ct}\\!g(s)\\,ds$"},{"x":"$y=f(x-ct)+f(x+ct)+\\dfrac{1}{2c}\\displaystyle\\int_{x-ct}^{x+ct}\\!g(s)\\,ds$"},{"x":"$y=\\tfrac12\\big[f(x-ct)-f(x+ct)\\big]+\\dfrac{1}{2c}\\displaystyle\\int_{x-ct}^{x+ct}\\!g(s)\\,ds$"}],"hint":"Verifica i due dati iniziali sulla formula candidata: a $t=0$ deve dare $f$, e la sua derivata temporale a $t=0$ deve dare $g$. Il $1/(2c)$ esce proprio da l&igrave;.","sol":"La generale dell'equazione delle onde &egrave; $y=F(x-ct)+G(x+ct)$ (si vede fattorizzando l'operatore come $(\\partial_t-c\\partial_x)(\\partial_t+c\\partial_x)$). Imponendo i dati: $F+G=f$ e $-cF'+cG'=g$, da cui $G-F=\\frac1c\\int^xg+\\mathrm{cost}$; risolvendo si ottiene la formula. Verifica: a $t=0$ i due argomenti coincidono e l'integrale &egrave; vuoto, quindi $y=f$; derivando in $t$, $\\partial_ty=\\frac c2[-f'(x-ct)+f'(x+ct)]+\\frac{1}{2c}\\cdot c\\,[g(x+ct)+g(x-ct)]$, che a $t=0$ vale $g(x)$ — ed &egrave; il fattore $1/(2c)$ a farlo tornare. Lettura strutturale: $y(x,t)$ dipende solo dal segmento $[x-ct,\\,x+ct]$, il <em>dominio di dipendenza</em>, ed &egrave; l'espressione matematica della causalit&agrave; a velocit&agrave; finita.","cont":"Confronta col calore"},{"t":"Qual &egrave; la differenza strutturale fra la formula di d'Alembert e il nucleo del calore?","opts":[{"x":"d'Alembert ha dominio di dipendenza <em>finito</em> $[x-ct,x+ct]$ e non regolarizza (una cuspide nel dato resta cuspide); il nucleo del calore &egrave; strettamente positivo ovunque, quindi il dominio di dipendenza &egrave; tutta la retta e la soluzione &egrave; $C^\\infty$ per ogni $t>0$","c":true},{"x":"Sono equivalenti: entrambe sono convoluzioni con un nucleo, solo con nuclei diversi"},{"x":"d'Alembert vale solo per dati a supporto compatto, il nucleo del calore per dati qualunque"},{"x":"Il nucleo del calore ha dominio di dipendenza finito, quello delle onde infinito"}],"hint":"Guarda dove i due nuclei si annullano. Uno &egrave; supportato su un segmento, l'altro non si annulla mai.","sol":"Il nucleo del calore $\\frac{1}{\\sqrt{4\\pi Dt}}e^{-(x-y)^2/4Dt}$ &egrave; positivo per ogni $y$: un dato a supporto compatto produce, un istante dopo, una soluzione non nulla ovunque. La velocit&agrave; di propagazione &egrave; dunque infinita, e l'equazione del calore &egrave; incompatibile con la relativit&agrave; (&egrave; il difetto che l'equazione dei telegrafisti corregge). In compenso il nucleo &egrave; analitico e la convoluzione regolarizza istantaneamente qualunque dato $L^1$. Per le onde &egrave; l'opposto: il supporto &egrave; il cono di luce, le singolarit&agrave; del dato viaggiano intatte lungo le caratteristiche $x\\pm ct=\\mathrm{cost}$, e non c'&egrave; alcuna regolarizzazione. Terza differenza, che &egrave; la pi&ugrave; profonda: le onde sono reversibili ($t\\to-t$ lascia l'equazione invariata e il problema resta ben posto), il calore no — il calore all'indietro amplifica i modi alti come $e^{+Dk^2|t|}$ e viola la dipendenza continua dai dati."}]},{"pool":"edp","src":"teoria — Sturm-Liouville, BC miste","steps":[{"t":"$\\partial_tu=D\\partial_x^2u$ su $[0,L]$ con $u(t,0)=0$ (estremo a temperatura fissa) e $\\partial_xu(t,L)=0$ (estremo isolato). Quali sono le autofunzioni?","opts":[{"x":"$\\sin\\!\\Big[\\dfrac{(2m+1)\\pi x}{2L}\\Big]$ con $m\\ge0$, e $\\lambda_m=-\\Big[\\dfrac{(2m+1)\\pi}{2L}\\Big]^2$","c":true},{"x":"$\\sin\\!\\big(\\tfrac{m\\pi x}{L}\\big)$ con $m\\ge1$"},{"x":"$\\cos\\!\\Big[\\dfrac{(2m+1)\\pi x}{2L}\\Big]$ con $m\\ge0$"},{"x":"$\\sin\\!\\Big[\\dfrac{(2m+1)\\pi x}{L}\\Big]$ con $m\\ge0$"}],"hint":"La prima condizione sceglie la famiglia, la seconda quantizza. Imponi $\\psi'(L)=0$ su $\\sin(kx)$ e guarda dove si annulla il coseno.","sol":"$\\psi(0)=0$ elimina il coseno e lascia $\\psi=\\sin(kx)$; poi $\\psi'(L)=k\\cos(kL)=0$ richiede $kL=\\frac\\pi2+m\\pi$, cio&egrave; $k_m=\\frac{(2m+1)\\pi}{2L}$: da qui gli <em>indici semi-interi</em>, firma inconfondibile delle BC miste. Verifica sul modo fondamentale $m=0$: $\\sin\\!\\big(\\frac{\\pi x}{2L}\\big)$ si annulla in $x=0$ e ha derivata $\\frac{\\pi}{2L}\\cos\\!\\big(\\frac{\\pi}{2}\\big)=0$ in $x=L$. Il quadro completo delle quattro BC: Dirichlet-Dirichlet $\\to\\sin(m\\pi x/L)$, $m\\ge1$; Neumann-Neumann $\\to\\cos(m\\pi x/L)$, $m\\ge0$; miste $\\to$ semi-interi; periodiche $\\to$ seni e coseni insieme, con degenerazione doppia.","cont":"Conseguenza sul modo fondamentale"},{"t":"Rispetto al caso Dirichlet-Dirichlet sullo stesso intervallo, il modo fondamentale:","opts":[{"x":"Ha lunghezza d'onda $4L$ invece di $2L$, e tempo di rilassamento quattro volte pi&ugrave; lungo: $\\tau_0=4L^2/(D\\pi^2)$ invece di $L^2/(D\\pi^2)$","c":true},{"x":"&Egrave; identico: le BC cambiano le autofunzioni ma non il fondamentale"},{"x":"Ha lunghezza d'onda $L$ invece di $2L$, e rilassa quattro volte pi&ugrave; in fretta"},{"x":"Ha la stessa lunghezza d'onda ma tempo di rilassamento doppio"}],"hint":"$\\lambda=2\\pi/k$ e $\\tau=1/(Dk^2)$: il rapporto fra i due tempi &egrave; il quadrato del rapporto fra i due $k$.","sol":"Dirichlet-Dirichlet: $k_0=\\pi/L$, lunghezza d'onda $2\\pi/k_0=2L$, $\\tau_0=1/(Dk_0^2)=L^2/(D\\pi^2)$. Misto: $k_0=\\pi/(2L)$, lunghezza d'onda $4L$, $\\tau_0=4L^2/(D\\pi^2)$. Il fattore 4 &egrave; il quadrato del fattore 2 fra i numeri d'onda, perch&eacute; nel calore il tasso va come $k^2$. Il fatto fisico &egrave; che nella sbarra mista il calore pu&ograve; uscire da un solo estremo, quindi ci mette pi&ugrave; tempo a spegnersi. C'&egrave; un analogo acustico esatto e vale la pena tenerlo in mente per l'orale: una canna d'organo chiusa a un'estremit&agrave; (BC miste) suona un'ottava sotto la canna aperta della stessa lunghezza (BC uguali ai due capi), ed &egrave; lo stesso raddoppio della lunghezza d'onda fondamentale. Un identico raddoppio compare nella buca di potenziale con una parete infinita e una condizione di derivata nulla."}]},{"pool":"edp","src":"metodo — riduzione a BC omogenee","steps":[{"t":"$\\partial_tu=D\\partial_x^2u$ su $[0,L]$ con $u(t,0)=T_1$ e $u(t,L)=T_2$ costanti non entrambe nulle. Perch&eacute; la separazione diretta fallisce, e come si rimedia?","opts":[{"x":"Fallisce perch&eacute; con BC non omogenee le combinazioni lineari di soluzioni non soddisfano pi&ugrave; le BC, e l'insieme delle soluzioni non &egrave; uno spazio vettoriale. Si sottrae la stazionaria $u_s(x)=T_1+(T_2-T_1)\\frac{x}{L}$: allora $w=u-u_s$ risolve la stessa equazione con BC omogenee","c":true},{"x":"Fallisce perch&eacute; l'equazione diventa non lineare; si linearizza attorno a $T_1$"},{"x":"Non fallisce affatto: basta separare e imporre le BC modo per modo"},{"x":"Fallisce perch&eacute; lo spettro diventa continuo; si passa alla trasformata di Fourier"}],"hint":"Il punto &egrave; la struttura algebrica, non la difficolt&agrave; del conto: due soluzioni che valgono $T_1$ al bordo, sommate, valgono $2T_1$.","sol":"La separazione produce soluzioni della forma $\\varphi\\psi$ e poi le somma: il passaggio &egrave; lecito solo se l'insieme delle funzioni che soddisfano le BC &egrave; chiuso per combinazioni lineari, il che accade se e solo se le BC sono <em>omogenee</em>. Con $u(t,0)=T_1\\ne0$ non lo &egrave;. Il rimedio standard: si cerca la soluzione stazionaria, cio&egrave; $u_s''=0$ con $u_s(0)=T_1$ e $u_s(L)=T_2$, che &egrave; il profilo lineare $u_s(x)=T_1+(T_2-T_1)x/L$; poi $w=u-u_s$ soddisfa $\\partial_tw=D\\partial_x^2w$ (perch&eacute; $\\partial_tu_s=0$ e $\\partial_x^2u_s=0$) con $w(t,0)=w(t,L)=0$, e su $w$ la separazione &egrave; legittima. Il dato iniziale si trasferisce: $w(0,x)=g(x)-u_s(x)$. Lo stesso trucco copre le BC non omogenee <em>dipendenti dal tempo</em>, ma allora $u_s$ dipende da $t$ e nell'equazione per $w$ compare una sorgente $-\\partial_tu_s$, che si tratta con Duhamel.","cont":"Fai il conto"},{"t":"Con $T_1=0$, $T_2=T$ e $u(0,x)=0$ (sbarra fredda, estremo destro portato di colpo a $T$), qual &egrave; la soluzione?","opts":[{"x":"$u(t,x)=\\dfrac{Tx}{L}+\\displaystyle\\sum_{n\\ge1}\\frac{2T(-1)^n}{n\\pi}\\,e^{-Dn^2\\pi^2t/L^2}\\sin\\!\\Big(\\frac{n\\pi x}{L}\\Big)$","c":true},{"x":"$u(t,x)=\\dfrac{Tx}{L}+\\displaystyle\\sum_{n\\ge1}\\frac{2T(-1)^{n+1}}{n\\pi}\\,e^{-Dn^2\\pi^2t/L^2}\\sin\\!\\Big(\\frac{n\\pi x}{L}\\Big)$"},{"x":"$u(t,x)=\\displaystyle\\sum_{n\\ge1}\\frac{2T(-1)^n}{n\\pi}\\,e^{-Dn^2\\pi^2t/L^2}\\sin\\!\\Big(\\frac{n\\pi x}{L}\\Big)$, senza termine stazionario"},{"x":"$u(t,x)=\\dfrac{Tx}{L}\\Big(1-e^{-D\\pi^2t/L^2}\\Big)$"}],"hint":"Il segno dei coefficienti si controlla verificando che a $t=0$ la somma cancelli esattamente il profilo lineare. Serve la serie notevole di $x$ sui seni.","sol":"Qui $u_s=Tx/L$ e $w(0,x)=-Tx/L$, da cui $$b_n=\\frac2L\\int_0^L\\!\\Big(-\\frac{Tx}{L}\\Big)\\sin\\!\\Big(\\frac{n\\pi x}{L}\\Big)dx .$$ Con $\\int_0^Lx\\sin(n\\pi x/L)dx=-\\frac{L^2(-1)^n}{n\\pi}$ (una integrazione per parti; il termine in $\\sin(n\\pi)$ &egrave; nullo) si ottiene $b_n=\\frac{2T(-1)^n}{n\\pi}$, e il modo $n$ decade con $e^{-D(n\\pi/L)^2t}$. Verifica del segno a $t=0$: si usa la serie notevole $\\sum_{n\\ge1}\\frac{(-1)^{n+1}}{n}\\sin\\!\\big(\\frac{n\\pi x}{L}\\big)=\\frac{\\pi x}{2L}$ per $0<x<L$, quindi $\\sum_n\\frac{2T(-1)^n}{n\\pi}\\sin(\\cdot)=-\\frac{2T}{\\pi}\\cdot\\frac{\\pi x}{2L}=-\\frac{Tx}{L}$, che cancella esattamente il termine stazionario e d&agrave; $u(0,x)=0$: torna. Col segno opposto si otterrebbe $2Tx/L$, assurdo. Per $t\\to\\infty$ resta il profilo lineare $Tx/L$: &egrave; il regime stazionario, e il tempo per raggiungerlo &egrave; governato dal modo pi&ugrave; lento, $\\tau_1=L^2/(D\\pi^2)$."}]},{"pool":"edp","src":"variante di 20262001 Es.4","steps":[{"t":"Stessa corda dell'appello 20/01/2026 (estremi fissi, lunghezza $L$), ma con i dati scambiati: $y(x,0)=f(x)$ e $\\partial_ty|_{t=0}=0$ — corda pizzicata e lasciata andare. Quale forma prende la soluzione?","opts":[{"x":"$y=\\displaystyle\\sum_{n\\ge1}a_n\\cos\\!\\Big(\\frac{n\\pi ct}{L}\\Big)\\sin\\!\\Big(\\frac{n\\pi x}{L}\\Big)$ con $a_n=\\frac2L\\int_0^L\\!f(x)\\sin\\!\\Big(\\frac{n\\pi x}{L}\\Big)dx$","c":true},{"x":"$y=\\displaystyle\\sum_{n\\ge1}b_n\\sin\\!\\Big(\\frac{n\\pi ct}{L}\\Big)\\sin\\!\\Big(\\frac{n\\pi x}{L}\\Big)$ con $b_n\\frac{n\\pi c}{L}=\\frac2L\\int_0^L\\!f\\sin$"},{"x":"$y=\\displaystyle\\sum_{n\\ge1}a_n\\cos\\!\\Big(\\frac{n\\pi ct}{L}\\Big)\\cos\\!\\Big(\\frac{n\\pi x}{L}\\Big)$"},{"x":"$y=\\displaystyle\\sum_{n\\ge1}a_n\\,e^{-n\\pi ct/L}\\sin\\!\\Big(\\frac{n\\pi x}{L}\\Big)$"}],"hint":"Le BC non sono cambiate, quindi la famiglia spaziale &egrave; la stessa: cambia solo quale delle due funzioni temporali sopravvive, e quale integrale d&agrave; i coefficienti.","sol":"Le condizioni al bordo sono identiche, quindi la base spaziale resta $\\sin(n\\pi x/L)$. Nella parte temporale, $\\partial_ty|_{t=0}=\\sum_n b_n\\omega_n\\sin(n\\pi x/L)=0$ impone ora $b_n=0$: sopravvivono i coseni. I coefficienti si leggono direttamente dalla posizione iniziale, senza dividere per $\\omega_n$ — ed &egrave; la differenza pratica pi&ugrave; importante rispetto al caso del dato di velocit&agrave;: l&igrave; la potenza di $n$ al denominatore sale di uno, qui no. Regola generale: <em>il dato di posizione va sui coseni temporali e non si divide per $\\omega_n$; il dato di velocit&agrave; va sui seni temporali e si divide per $\\omega_n$</em>. Se il testo d&agrave; entrambi i dati non nulli, si sommano i due contributi, perch&eacute; l'equazione &egrave; lineare.","cont":"Il ponte con d'Alembert"},{"t":"La stessa soluzione si riscrive come somma di due onde progressive. Come?","opts":[{"x":"$y=\\tfrac12\\big[\\tilde f(x-ct)+\\tilde f(x+ct)\\big]$, dove $\\tilde f$ &egrave; il prolungamento <em>dispari</em> e $2L$-periodico di $f$","c":true},{"x":"$y=\\tfrac12\\big[\\tilde f(x-ct)+\\tilde f(x+ct)\\big]$, dove $\\tilde f$ &egrave; il prolungamento <em>pari</em> e $2L$-periodico di $f$"},{"x":"$y=\\tilde f(x-ct)+\\tilde f(x+ct)$, con $\\tilde f$ dispari e $2L$-periodico"},{"x":"Non si riscrive: su dominio limitato d'Alembert non vale"}],"hint":"Applica la formula di prostaferesi $\\cos A\\,\\sin B=\\tfrac12[\\sin(B+A)+\\sin(B-A)]$ a ogni termine della serie e guarda che cosa resta.","sol":"Con $\\omega_n=n\\pi c/L$, l'identit&agrave; $\\cos(\\omega_nt)\\sin\\!\\big(\\tfrac{n\\pi x}{L}\\big)=\\tfrac12\\Big[\\sin\\!\\big(\\tfrac{n\\pi(x+ct)}{L}\\big)+\\sin\\!\\big(\\tfrac{n\\pi(x-ct)}{L}\\big)\\Big]$ trasforma la serie in $$y=\\tfrac12\\Big[\\tilde f(x+ct)+\\tilde f(x-ct)\\Big],\\qquad \\tilde f(\\xi)\\equiv\\sum_{n\\ge1}a_n\\sin\\!\\Big(\\frac{n\\pi\\xi}{L}\\Big),$$ e la funzione a destra &egrave; per costruzione il prolungamento dispari e $2L$-periodico di $f$: dispari perch&eacute; &egrave; una serie di soli seni, $2L$-periodica perch&eacute; ogni seno lo &egrave;. &Egrave; esattamente la formula di d'Alembert con $g=0$, applicata al dato prolungato. La lettura fisica &egrave; il metodo delle immagini: la corda finita si comporta come una corda infinita su cui viaggiano, oltre all'onda vera, le sue immagini riflesse con segno invertito agli estremi; l'inversione di segno &egrave; la disparit&agrave; del prolungamento, ed &egrave; ci&ograve; che tiene $y=0$ nei punti fissi. Con estremi liberi (Neumann) il prolungamento sarebbe pari e la riflessione avverrebbe senza cambio di segno."}]},{"pool":"edp","src":"Set 4 - Differential equations (separazione 2D, Laplace)","steps":[{"t":"Sia $\\Delta u=\\partial_x^2u+\\partial_y^2u=0$ sul rettangolo $[0,a]\\times[0,b]$, con $u=0$ sui tre lati $x=0$, $x=a$, $y=0$, e $u(x,b)=F(x)$. Quale forma ha la soluzione?","opts":[{"x":"$u=\\displaystyle\\sum_{n\\ge1}c_n\\,\\sinh\\!\\Big(\\frac{n\\pi y}{a}\\Big)\\sin\\!\\Big(\\frac{n\\pi x}{a}\\Big)$, con $c_n\\sinh\\!\\big(\\tfrac{n\\pi b}{a}\\big)=\\frac2a\\int_0^a\\!F(x)\\sin\\!\\big(\\tfrac{n\\pi x}{a}\\big)dx$","c":true},{"x":"$u=\\displaystyle\\sum_{n\\ge1}c_n\\,\\sin\\!\\Big(\\frac{n\\pi y}{a}\\Big)\\sin\\!\\Big(\\frac{n\\pi x}{a}\\Big)$"},{"x":"$u=\\displaystyle\\sum_{n\\ge1}c_n\\,e^{-n\\pi y/a}\\sin\\!\\Big(\\frac{n\\pi x}{a}\\Big)$"},{"x":"$u=\\displaystyle\\sum_{n\\ge1}c_n\\,\\cosh\\!\\Big(\\frac{n\\pi y}{a}\\Big)\\sin\\!\\Big(\\frac{n\\pi x}{a}\\Big)$"}],"hint":"Nell'equazione di Laplace la costante di separazione compare con segni <em>opposti</em> nelle due variabili: se una direzione oscilla, l'altra non pu&ograve; oscillare. E la condizione $u(x,0)=0$ sceglie fra $\\sinh$ e $\\cosh$.","sol":"Con $u=X(x)Y(y)$: $\\frac{X''}{X}=-\\frac{Y''}{Y}=-k^2$. Il segno opposto &egrave; la firma delle equazioni ellittiche: le tre BC omogenee stanno sui lati verticali e su quello basso, quindi &egrave; la direzione $x$ a doversi quantizzare, $X=\\sin(n\\pi x/a)$ con $k_n=n\\pi/a$, e allora $Y''=k_n^2Y$ ha soluzioni <em>iperboliche</em> $\\sinh$ e $\\cosh$, non trigonometriche. La condizione $u(x,0)=0$ elimina il $\\cosh$ e lascia $\\sinh(n\\pi y/a)$; l'esponenziale puro $e^{-n\\pi y/a}$ sarebbe la scelta giusta su una striscia semi-infinita $y>0$ con decadimento a infinito, non su un rettangolo con $u=0$ in $y=0$. Il coefficiente si fissa proiettando il dato sul lato alto: $c_n\\sinh(n\\pi b/a)$ &egrave; il coefficiente di Fourier di $F$, e la divisione per $\\sinh(n\\pi b/a)$ (che cresce esponenzialmente in $n$) rende la soluzione all'interno straordinariamente liscia, come dev'essere per una funzione armonica.","cont":"Perch&eacute; non c'&egrave; alcun dato iniziale"},{"t":"Perch&eacute; per Laplace non si assegnano un valore <em>e</em> una derivata normale sullo stesso lato, come si farebbe con le onde?","opts":[{"x":"Perch&eacute; il problema di Cauchy per Laplace &egrave; <em>mal posto</em> (Hadamard): la soluzione non dipende con continuit&agrave; dai dati. Laplace &egrave; un problema al contorno — un dato per ogni punto dell'<em>intero</em> bordo — non un problema a valori iniziali","c":true},{"x":"Perch&eacute; il problema sarebbe sovradeterminato: due dati per un'equazione del secondo ordine sono uno di troppo"},{"x":"Perch&eacute; la derivata normale non &egrave; definita sui vertici del rettangolo"},{"x":"Non c'&egrave; alcun motivo: si pu&ograve; fare, ed &egrave; il problema di Robin"}],"hint":"Costruisci una successione di dati che tende a zero mentre le soluzioni corrispondenti esplodono: basta un seno molto oscillante con ampiezza piccola.","sol":"Controesempio di Hadamard, che vale la pena saper esibire: si prenda $u(x,0)=0$ e $\\partial_yu(x,0)=\\tfrac1n\\sin(nx)$. La soluzione &egrave; $u=\\tfrac{1}{n^2}\\sin(nx)\\sinh(ny)$. Il dato tende uniformemente a zero come $1/n$, ma per ogni $y>0$ fissato la soluzione diverge come $e^{ny}/n^2$: la dipendenza continua dai dati &egrave; violata, e il problema &egrave; mal posto nel senso di Hadamard. La ragione strutturale &egrave; che nelle equazioni ellittiche non esistono direzioni caratteristiche reali — non c'&egrave; alcun 'tempo' lungo cui propagare — e la classificazione parabolica/iperbolica/ellittica non &egrave; una tassonomia decorativa: dice quale <em>tipo</em> di problema &egrave; ben posto. Iperbolico $\\to$ Cauchy (dato e derivata a $t=0$); parabolico $\\to$ dato a $t=0$ pi&ugrave; BC laterali; ellittico $\\to$ un solo dato su tutto il bordo, Dirichlet oppure Neumann oppure Robin, mai Cauchy."}]},{"pool":"edp","src":"metodo — Duhamel","steps":[{"t":"Sia $\\partial_tu=D\\partial_x^2u+S(t,x)$ su $[0,L]$ con Dirichlet omogenee e $u(0,x)=0$. Sviluppando $u=\\sum_nu_n(t)\\sin\\!\\big(\\tfrac{n\\pi x}{L}\\big)$ e $S=\\sum_nS_n(t)\\sin\\!\\big(\\tfrac{n\\pi x}{L}\\big)$, quanto vale $u_n(t)$?","opts":[{"x":"$u_n(t)=\\displaystyle\\int_0^t\\!ds\\;e^{-Dk_n^2(t-s)}S_n(s)$, con $k_n=\\tfrac{n\\pi}{L}$","c":true},{"x":"$u_n(t)=e^{-Dk_n^2t}\\displaystyle\\int_0^t\\!ds\\;S_n(s)$"},{"x":"$u_n(t)=\\dfrac{S_n(t)}{Dk_n^2}\\big(1-e^{-Dk_n^2t}\\big)$ per ogni $S_n$"},{"x":"$u_n(t)=\\displaystyle\\int_0^t\\!ds\\;e^{-Dk_n^2 s}S_n(s)$"}],"hint":"Ogni modo obbedisce a una ODE lineare del primo ordine non omogenea: la formula di variazione delle costanti pesa la sorgente con il propagatore del <em>tempo trascorso</em>, non del tempo assoluto.","sol":"Proiettando l'equazione sul modo $n$ si ottiene $\\dot u_n=-Dk_n^2u_n+S_n(t)$, ODE lineare del primo ordine. Con fattore integrante $e^{Dk_n^2t}$: $\\frac{d}{dt}\\big(e^{Dk_n^2t}u_n\\big)=e^{Dk_n^2t}S_n(t)$, e integrando da $0$ a $t$ con $u_n(0)=0$, $$u_n(t)=\\int_0^t e^{-Dk_n^2(t-s)}S_n(s)\\,ds .$$ &Egrave; il <em>principio di Duhamel</em>: la soluzione forzata &egrave; la sovrapposizione delle risposte libere a impulsi accesi a ogni istante $s$, propagate per il tempo residuo $t-s$. Il nucleo dipende da $t-s$ e non da $s$ o da $t$ separatamente perch&eacute; l'operatore ha coefficienti indipendenti dal tempo: se $D$ dipendesse da $t$ il nucleo diventerebbe $\\exp[-k_n^2\\int_s^tD(\\sigma)d\\sigma]$. Se invece la sorgente &egrave; costante, $S_n(t)=S_n$, l'integrale si fa e d&agrave; proprio $\\frac{S_n}{Dk_n^2}(1-e^{-Dk_n^2t})$: quella formula &egrave; corretta, ma solo in quel caso.","cont":"E per le onde?"},{"t":"Per le onde, $\\partial_t^2y=c^2\\partial_x^2y+S$, il modo $n$ obbedisce a $\\ddot y_n+\\omega_n^2y_n=S_n(t)$. Che cosa succede se $S_n(t)=\\sin(\\omega_nt)$, cio&egrave; se la sorgente &egrave; in risonanza col modo?","opts":[{"x":"L'ampiezza cresce linearmente in $t$: la soluzione particolare &egrave; $-\\dfrac{t}{2\\omega_n}\\cos(\\omega_nt)$, e la serie non converge pi&ugrave; a un moto limitato","c":true},{"x":"L'ampiezza cresce esponenzialmente, come $e^{\\omega_nt}$"},{"x":"Non succede nulla di speciale: la soluzione resta limitata perch&eacute; l'equazione &egrave; conservativa"},{"x":"L'ampiezza satura al valore $S_n/\\omega_n^2$, come nel caso del calore"}],"hint":"Prova $y_n=\\alpha\\,t\\cos(\\omega_nt)$ e determina $\\alpha$ sostituendo: la crescita &egrave; algebrica, non esponenziale.","sol":"Con $y_n=-\\frac{t}{2\\omega}\\cos(\\omega t)$ si ha $\\dot y_n=-\\frac{1}{2\\omega}\\cos\\omega t+\\frac t2\\sin\\omega t$ e $\\ddot y_n=\\sin\\omega t+\\frac{t\\omega}{2}\\cos\\omega t$; sommando $\\omega^2y_n=-\\frac{t\\omega}{2}\\cos\\omega t$ resta esattamente $\\sin(\\omega t)$: la soluzione particolare &egrave; verificata. La crescita &egrave; <em>lineare</em> in $t$, non esponenziale — l'errore comune &egrave; immaginare un'esplosione esponenziale, che nasce invece da autovalori con parte reale positiva, non dalla risonanza. La differenza col calore &egrave; strutturale ed &egrave; il punto da portare all'orale: il propagatore del calore $e^{-Dk_n^2(t-s)}$ dimentica il passato, quindi nessuna sorgente limitata pu&ograve; accumularsi e la risposta satura; il propagatore delle onde &egrave; oscillante e di modulo costante, quindi una forzante in fase si somma coerentemente per sempre. In una corda reale la risonanza &egrave; limitata dallo smorzamento, che aggiunge un termine $\\gamma\\dot y_n$ e sostituisce la crescita lineare con una saturazione a $S_n/(\\gamma\\omega_n)$."}]},{"pool":"edp","src":"teoria — propagatori, cap. 20","steps":[{"t":"Sia $i\\partial_t\\psi=-\\tfrac12\\partial_x^2\\psi$ su tutta la retta. Qual &egrave; il propagatore, cio&egrave; la soluzione con $\\psi(0,x)=\\delta(x)$?","opts":[{"x":"$K(t,x)=\\dfrac{1}{\\sqrt{2\\pi i t}}\\,e^{\\,i x^2/(2t)}$","c":true},{"x":"$K(t,x)=\\dfrac{1}{\\sqrt{2\\pi t}}\\,e^{-x^2/(2t)}$"},{"x":"$K(t,x)=\\dfrac{1}{\\sqrt{2\\pi i t}}\\,e^{-x^2/(2t)}$"},{"x":"$K(t,x)=\\dfrac{1}{\\sqrt{4\\pi i t}}\\,e^{\\,i x^2/(4t)}$"}],"hint":"&Egrave; lo stesso conto del nucleo del calore, ma con $D$ immaginario. L'integrale gaussiano $\\int e^{-\\alpha k^2+ikx}dk=\\sqrt{\\pi/\\alpha}\\,e^{-x^2/4\\alpha}$ vale anche per $\\alpha$ complesso con parte reale non negativa.","sol":"In Fourier: $i\\partial_t\\hat\\psi=\\tfrac12k^2\\hat\\psi$, dunque $\\hat K(t,k)=e^{-ik^2t/2}$. Antitrasformando con $\\alpha=it/2$: $$K=\\frac{1}{2\\pi}\\int\\! e^{-\\alpha k^2+ikx}dk=\\frac{1}{2\\pi}\\sqrt{\\frac{\\pi}{\\alpha}}e^{-x^2/(4\\alpha)}=\\frac{1}{2\\pi}\\sqrt{\\frac{2\\pi}{it}}\\,e^{ix^2/(2t)}=\\frac{1}{\\sqrt{2\\pi i t}}e^{ix^2/(2t)} .$$ Differenza cruciale rispetto al calore: qui $|K|=1/\\sqrt{2\\pi t}$ non decade in $x$, cio&egrave; il nucleo non &egrave; concentrato ma oscilla su tutta la retta con fase stazionaria; e $\\int|K|^2dx$ non converge, come dev'essere per un dato $\\delta$ non normalizzabile. La norma $L^2$ del pacchetto, invece, si conserva esattamente (unitariet&agrave;), a differenza del calore dove decade.","cont":"La rotazione di Wick"},{"t":"Sostituendo $t=-i\\tau$ nel propagatore di Schr&ouml;dinger si ottiene il nucleo del calore. Perch&eacute; questa non &egrave; una curiosit&agrave; formale?","opts":[{"x":"Perch&eacute; l'operatore di evoluzione $e^{-iHt}$ diventa $e^{-\\tau H}$, che per $\\tau=\\beta$ &egrave; l'operatore di Gibbs: la funzione di partizione $Z=\\mathrm{Tr}\\,e^{-\\beta H}$ &egrave; letteralmente un propagatore in tempo immaginario, ed &egrave; il ponte fra meccanica quantistica e meccanica statistica","c":true},{"x":"Perch&eacute; permette di calcolare integrali reali con metodi complessi, come nel lemma di Jordan"},{"x":"Perch&eacute; dimostra che l'equazione del calore &egrave; reversibile, come Schr&ouml;dinger"},{"x":"&Egrave; una curiosit&agrave; formale: la sostituzione non ha alcun contenuto fisico, perch&eacute; il tempo &egrave; reale"}],"hint":"Guarda che cosa diventa l'esponente dell'operatore di evoluzione quando il tempo diventa immaginario, e con che cosa coincide se il tempo immaginario vale $\\beta=1/k_BT$.","sol":"Con $t=-i\\tau$: $\\frac{1}{\\sqrt{2\\pi it}}e^{ix^2/2t}=\\frac{1}{\\sqrt{2\\pi\\tau}}e^{-x^2/(2\\tau)}$, che &egrave; il nucleo del calore con $D=1/2$ (infatti $\\frac{1}{\\sqrt{4\\pi D\\tau}}e^{-x^2/4D\\tau}$ con $D=1/2$ d&agrave; proprio quello). A livello di operatori, $e^{-iHt}\\to e^{-\\tau H}$, e ponendo $\\tau=\\beta=1/k_BT$ si ottiene la matrice densit&agrave; non normalizzata: la traccia &egrave; la funzione di partizione. Da qui il path integral euclideo, in cui l'ampiezza di transizione a tempo immaginario &egrave; una somma su cammini pesata da $e^{-S_E}$ e la meccanica quantistica in $d$ dimensioni si mappa sulla meccanica statistica classica in $d+1$. &Egrave; l'apparato che regge la decoerenza e le questioni di termalizzazione: le PDE risolte per separazione e i propagatori gaussiani di questo corso sono lo stesso oggetto, letti in un altro riferimento. Attenzione a non trarne la conclusione sbagliata: la rotazione di Wick non rende reversibile il calore, perch&eacute; la continuazione analitica &egrave; ben definita in una sola direzione — verso $\\mathrm{Re}\\,\\tau>0$."}]},{"pool":"edp","src":"modus operandi","steps":[{"t":"Quando conviene trasformare (Fourier) invece di separare, e soprattutto: su quale delle due variabili si trasforma?","opts":[{"x":"Su quella il cui dominio &egrave; illimitato o periodico <em>e</em> in cui i coefficienti dell'operatore sono costanti: quella variabile diventa un parametro algebrico e la PDE si riduce a una ODE nell'altra","c":true},{"x":"Sempre sul tempo, perch&eacute; l'obiettivo &egrave; eliminare le derivate temporali"},{"x":"Sempre sullo spazio, perch&eacute; le condizioni al bordo sono spaziali"},{"x":"Su quella in cui compare la derivata di ordine pi&ugrave; alto"}],"hint":"La trasformata converte $\\partial$ in moltiplicazione solo se il coefficiente davanti non dipende dalla variabile che stai trasformando. Rileggi le soluzioni dei sei appelli con questo criterio.","sol":"La trasformata di Fourier diagonalizza $\\partial_x$ perch&eacute; $e^{ikx}$ &egrave; autofunzione delle traslazioni: funziona quando l'operatore commuta con le traslazioni nella variabile trasformata, cio&egrave; quando i coefficienti non dipendono da quella variabile e il dominio &egrave; $\\mathbb{R}$ (spettro continuo) o un cerchio (spettro discreto, serie di Fourier). Il criterio si vede all'opera nei sei appelli: nel 08/07/2025 e nel 23/06/2025 il dominio spaziale &egrave; $\\mathbb{R}$ (o riducibile per estensione) e i coefficienti sono costanti in $x$ — si trasforma in $x$ e resta una ODE in $t$, anche col coefficiente $\\sin t$ che dipende dal tempo, perch&eacute; il tempo l&igrave; &egrave; solo un parametro. Nel 12/02/2026 e nel 20/01/2026 il dominio spaziale &egrave; limitato con BC omogenee: si separa e si ottiene una serie. Nel 09/09/2025 il dominio &egrave; $\\mathbb{R}$ ma compare $x^2u$, che rompe l'invarianza per traslazione: la trasformata non aiuta in $x$, e si usa la base di Hermite.","cont":"Il caso limite"},{"t":"Nell'appello 12/02/2026 il coefficiente &egrave; $t^2$: perch&eacute; non conviene trasformare rispetto a $t$?","opts":[{"x":"Perch&eacute; il coefficiente dipende proprio da $t$, quindi in $\\omega$ diventerebbe $-\\partial_\\omega^2$ e l'equazione resterebbe differenziale invece di diventare algebrica; inoltre il dominio &egrave; $t\\ge0$ con dato in $t=0$, cio&egrave; una semiretta","c":true},{"x":"Perch&eacute; la trasformata di Fourier non si applica mai al tempo"},{"x":"Perch&eacute; il dato iniziale non &egrave; a quadrato sommabile"},{"x":"Perch&eacute; l'equazione &egrave; del primo ordine in $t$, e Fourier richiede il secondo ordine"}],"hint":"Che cosa diventa il fattore $t^2$ nello spazio delle frequenze? E che tipo di dominio &egrave; $t\\ge0$?","sol":"Moltiplicare per $t^2$ diventa, in trasformata, $-\\partial_\\omega^2$: si scambierebbe una PDE con un'altra PDE, senza guadagno. In generale la trasformata paga solo dove i coefficienti sono costanti nella variabile trasformata. Il secondo ostacolo &egrave; il dominio: $t\\ge0$ &egrave; una semiretta con un dato assegnato all'estremo, che &egrave; la situazione della trasformata di <em>Laplace</em>, non di Fourier (e infatti Laplace incorpora automaticamente i dati iniziali nel termine $sF(s)-f(0)$). La soluzione ufficiale del 09/09/2025 fa vedere il prezzo di forzare Fourier nel tempo: per usarla estende prima il dominio temporale a tutto $\\mathbb{R}$, e il risultato vive solo nello spazio delle distribuzioni, con $\\hat u\\propto\\delta(\\omega\\pm\\sqrt{2n+1})$ — corretto, ma pi&ugrave; laborioso della separazione diretta. Morale operativa: la trasformata &egrave; uno strumento, non un riflesso."}]},{"pool":"edp","src":"teoria — compatibilit&agrave; dato/BC","steps":[{"t":"Calore su $[0,\\pi]$ con $u(t,0)=u(t,\\pi)=0$ e dato iniziale $u(0,x)=1$, costante. Il dato non si annulla agli estremi: il problema &egrave; mal posto?","opts":[{"x":"No, &egrave; ben posto: l'incompatibilit&agrave; sta su un insieme di misura nulla, la serie converge in $L^2$ e per ogni $t>0$ la soluzione &egrave; $C^\\infty$ e rispetta le BC. La discontinuit&agrave; vive solo nell'angolo $t=0$, $x\\in\\{0,\\pi\\}$","c":true},{"x":"S&igrave;: il dato dev'essere compatibile con le BC, altrimenti la soluzione non esiste"},{"x":"S&igrave;, ma si aggiusta modificando il dato in un intorno degli estremi"},{"x":"No, ma la soluzione esiste solo per $t$ maggiore di un certo $t_0>0$"}],"hint":"La regolarizzazione parabolica &egrave; istantanea: chiediti che cosa vale $u(t,0)$ per $t>0$ nella serie di seni, indipendentemente dal dato.","sol":"La serie di seni $u(t,x)=\\sum_nb_ne^{-Dn^2t}\\sin(nx)$ soddisfa $u(t,0)=u(t,\\pi)=0$ <em>termine per termine</em>, quindi per ogni $t>0$ le BC sono rispettate qualunque siano i $b_n$. La convergenza in $L^2$ del dato basta per la buona posizione, e il fattore $e^{-Dn^2t}$ rende la serie e tutte le sue derivate assolutamente convergenti per $t>0$: la soluzione &egrave; $C^\\infty$ nell'aperto. La singolarit&agrave; &egrave; confinata negli angoli $(t,x)=(0,0)$ e $(0,\\pi)$ del dominio spazio-temporale, dove il limite dipende dalla direzione: lungo $t=0$ la soluzione tende a $1$, lungo $x=0$ tende a $0$. I coefficienti: $b_n=\\frac2\\pi\\int_0^\\pi\\sin(nx)dx=\\frac{2}{\\pi}\\frac{1-(-1)^n}{n}$, cio&egrave; $\\frac{4}{\\pi n}$ per $n$ dispari e $0$ per $n$ pari — la classica onda quadra. La lettura fisica &egrave; una sbarra a temperatura uniforme immersa di colpo in due bagni a zero.","cont":"E il fenomeno di Gibbs"},{"t":"A $t=0$ la serie di soli seni di una costante manifesta il fenomeno di Gibbs. Che cosa succede per $t>0$?","opts":[{"x":"Sparisce: a $t=0$ le somme parziali sovraoscillano di circa il 9% del salto e la serie converge a $0$ negli estremi (media del salto), ma il fattore $e^{-Dn^2t}$ smorza i modi alti pi&ugrave; che esponenzialmente e le sovraoscillazioni si spengono immediatamente","c":true},{"x":"Persiste identico per ogni $t$, perch&eacute; Gibbs &egrave; una propriet&agrave; della base e non del dato"},{"x":"Si amplifica, perch&eacute; i modi alti sono quelli che portano l'oscillazione"},{"x":"Resta ma si sposta verso il centro dell'intervallo"}],"hint":"Gibbs vive nei modi alti; il calore li uccide come $e^{-Dn^2t}$. Chiediti anche a quale valore converge la serie <em>esattamente</em> negli estremi a $t=0$.","sol":"Il fenomeno di Gibbs &egrave; una propriet&agrave; delle somme parziali in presenza di un salto: l'overshoot vale circa il 9% dell'ampiezza del salto e non si attenua all'aumentare del numero di termini, si limita a stringersi attorno alla discontinuit&agrave;. Il risultato invocato per il valore nel punto di salto &egrave; il <em>teorema di convergenza puntuale di Dirichlet</em>: la serie converge alla semisomma dei limiti destro e sinistro, che qui vale $\\frac{1+(-1)}{2}=0$ agli estremi, perch&eacute; il prolungamento dispari salta da $-1$ a $+1$ attraverso l'origine. Per $t>0$ il quadro cambia radicalmente: il coefficiente effettivo del modo $n$ diventa $\\frac{4}{\\pi n}e^{-Dn^2t}$, che decade come una gaussiana in $n$, e la serie &egrave; dominata da $\\sum n^{-1}e^{-Dn^2t}<\\infty$ con tutte le derivate. Gibbs &egrave; un fenomeno dei modi alti, e il calore &egrave; un filtro passa-basso: si spengono a vicenda. Con l'equazione delle onde, invece, i modi alti non decadono e la discontinuit&agrave; sopravvive, viaggiando lungo le caratteristiche."}]},{"pool":"edp","src":"Green ritardata del calore &middot; da MIT 18.303 PS6 &middot; manuale","steps":[{"t":"Si cerca la funzione di Green <em>ritardata</em> del calore su tutta la retta: $\\big(\\partial_t-D\\partial_x^2\\big)G(t,x)=\\delta(t)\\,\\delta(x)$ con $G\\equiv0$ per $t<0$. Quale espressione &egrave;?","opts":[{"x":"$G(t,x)=\\theta(t)\\,\\dfrac{1}{\\sqrt{4\\pi Dt}}\\,e^{-x^2/(4Dt)}$","c":true},{"x":"$G(t,x)=\\dfrac{1}{\\sqrt{4\\pi Dt}}\\,e^{-x^2/(4Dt)}$, senza alcun fattore $\\theta$"},{"x":"$G(t,x)=\\theta(-t)\\,\\dfrac{1}{\\sqrt{4\\pi D|t|}}\\,e^{-x^2/(4D|t|)}$"},{"x":"$G(t,x)=\\theta(t)\\,\\dfrac{1}{\\sqrt{4\\pi Dt}}\\,e^{-x^2/(4Dt)}\\,e^{-Dt}$"}],"hint":"&Egrave; il nucleo del calore moltiplicato per qualcosa che vale zero prima dell'accensione. Chiediti anche se, senza quel fattore, l'espressione avrebbe senso per $t<0$.","sol":"La Green ritardata &egrave; il nucleo del calore troncato dal gradino: $G(t,x)=\\theta(t)K_t(x)$ con $K_t(x)=\\frac{1}{\\sqrt{4\\pi Dt}}e^{-x^2/(4Dt)}$. Il fattore $\\theta(t)$ non &egrave; cosmetico e fa tre lavori distinti. Primo, rende $G$ definita ovunque: per $t<0$ il nucleo scritto senza $\\theta$ non &egrave; nemmeno una funzione ragionevole, perch&eacute; $e^{-x^2/(4Dt)}$ con $t<0$ diverge in $|x|$. Secondo, seleziona la soluzione <em>causale</em>: nulla accade prima dell'impulso. Terzo, ed &egrave; il punto tecnico, &egrave; proprio la sua derivata a generare il $\\delta(t)$ al membro destro. La versione con $\\theta(-t)$ &egrave; la Green <em>avanzata</em>: risolve la stessa equazione con la condizione imposta a tempi futuri, ed &egrave; la scelta giusta in altri contesti (per esempio nei problemi aggiunti), ma per il calore non ha senso fisico perch&eacute; l'equazione all'indietro &egrave; mal posta.","cont":"Verifica che produca la delta"},{"t":"Verificando per sostituzione, da dove nasce esattamente il $\\delta(t)\\delta(x)$ al membro destro?","opts":[{"x":"Da $\\partial_t\\big[\\theta(t)K_t(x)\\big]=\\delta(t)K_t(x)+\\theta(t)\\partial_tK_t$: il primo termine vale $\\delta(t)\\delta(x)$ perch&eacute; $K_t\\to\\delta$ per $t\\to0^+$, il secondo cancella $D\\partial_x^2G$ perch&eacute; $K$ risolve gi&agrave; l'omogenea","c":true},{"x":"Da $\\partial_x^2$ applicato alla gaussiana, che nel limite $t\\to0$ produce una delta in $x$"},{"x":"Dal prefattore $1/\\sqrt{4\\pi Dt}$, che diverge per $t\\to0^+$"},{"x":"Non nasce da nessun termine: $G$ risolve l'equazione omogenea e la delta si impone a mano come condizione iniziale"}],"hint":"L'unica derivata che pu&ograve; produrre una distribuzione singolare &egrave; quella che cade sul gradino. Poi serve un fatto sul nucleo del calore a tempo piccolo.","sol":"Regola di Leibniz nel senso delle distribuzioni: $\\partial_t(\\theta K)=\\theta'(t)K_t+\\theta(t)\\partial_tK_t$, e $\\theta'=\\delta$. Nel termine $\\delta(t)K_t(x)$ il nucleo va valutato a $t=0$, dove $K_t\\to\\delta(x)$ in senso distribuzionale — &egrave; la propriet&agrave; di identit&agrave; approssimata del nucleo del calore, quella che segue dalla normalizzazione $\\int K_t\\,dx=1$ per ogni $t$ e dalla concentrazione $\\sigma^2=2Dt\\to0$. Restano poi $\\theta(t)\\big[\\partial_tK_t-D\\partial_x^2K_t\\big]=0$, perch&eacute; il nucleo risolve l'equazione omogenea per $t>0$. Totale: $\\delta(t)\\delta(x)$, come richiesto. Il messaggio generale, che vale per ogni operatore di evoluzione del primo ordine in $t$: <em>la Green ritardata &egrave; il propagatore moltiplicato per $\\theta(t)$, e il salto del gradino &egrave; ci&ograve; che fabbrica la sorgente istantanea</em>. Per un operatore del secondo ordine in $t$ (le onde) il conto &egrave; analogo ma la condizione da imporre &egrave; sul salto della <em>derivata</em>, e infatti la Green delle onde in 1D &egrave; $\\frac{1}{2c}\\theta(ct-|x|)$, continua ma con derivata discontinua.","cont":"Usala con una sorgente"},{"t":"Con sorgente $f(t,x)$ accesa da $t=0$ e dato iniziale $u(0,x)=g(x)$, qual &egrave; la soluzione?","opts":[{"x":"$u(t,x)=\\displaystyle\\int\\!dy\\,K_t(x-y)g(y)+\\int_0^t\\!\\!ds\\!\\int\\!dy\\;K_{t-s}(x-y)\\,f(s,y)$","c":true},{"x":"$u(t,x)=\\displaystyle\\int\\!dy\\,K_t(x-y)g(y)+\\int_0^t\\!\\!ds\\!\\int\\!dy\\;K_{s}(x-y)\\,f(s,y)$"},{"x":"$u(t,x)=\\displaystyle\\int\\!dy\\,K_t(x-y)g(y)+K_t*\\!\\int_0^t\\!\\!f(s,\\cdot)\\,ds$"},{"x":"$u(t,x)=\\displaystyle\\int_0^t\\!\\!ds\\!\\int\\!dy\\;K_{t-s}(x-y)\\,f(s,y)$, e il dato iniziale entra come valore della sorgente in $s=0$"}],"hint":"Il nucleo deve propagare per il tempo <em>residuo</em> fra l'accensione e l'osservazione. Controlla la formula candidata nel caso $f=0$ e nel caso $g=0$ con $f=\\delta(s)\\delta(y)$.","sol":"&Egrave; il principio di Duhamel in forma integrale: l'omogenea con dato $g$, pi&ugrave; la sovrapposizione delle risposte a tutti gli impulsi $f(s,y)\\,ds\\,dy$ accesi in $(s,y)$ e propagati per il tempo residuo $t-s$. L'argomento $t-s$ (e non $s$, e non $t$) discende dall'invarianza per traslazione temporale dell'operatore: la risposta dipende solo da quanto tempo &egrave; passato dall'accensione. Controlli: con $f=0$ resta la formula del propagatore; con $g=0$ e $f=\\delta(s)\\delta(y)$ l'integrale doppio collassa su $K_t(x)$, che &egrave; per definizione la Green. L'opzione con $K_s$ &egrave; l'errore pi&ugrave; frequente e si smaschera cos&igrave;: darebbe, per una sorgente accesa un istante fa, una risposta gi&agrave; diffusa su una larghezza $\\sqrt{2Ds}$ arbitraria. Nota di struttura: la stessa formula, scritta su un dominio limitato, ha come nucleo $G(t,x,y)=\\sum_n\\frac2L\\sin(k_nx)\\sin(k_ny)e^{-Dk_n^2t}$ invece della gaussiana — cambia il nucleo, non l'architettura di Duhamel."}]},{"pool":"edp","src":"Green ritardata di Schr&ouml;dinger &middot; da MIT 18.303 PS6 &middot; manuale","steps":[{"t":"Si vuole $G$ tale che $\\big(i\\partial_t+\\tfrac12\\partial_x^2\\big)G(t,x)=\\delta(t)\\delta(x)$ con $G=0$ per $t<0$. Sapendo che il propagatore libero &egrave; $K(t,x)=\\frac{1}{\\sqrt{2\\pi it}}e^{ix^2/(2t)}$, qual &egrave; $G$?","opts":[{"x":"$G(t,x)=-i\\,\\theta(t)\\,K(t,x)$","c":true},{"x":"$G(t,x)=\\theta(t)\\,K(t,x)$"},{"x":"$G(t,x)=+i\\,\\theta(t)\\,K(t,x)$"},{"x":"$G(t,x)=-i\\,\\theta(t)\\,K(t,x)\\,e^{-t}$"}],"hint":"Ripeti il conto del caso parabolico: poni $G=\\theta(t)h(t,x)$, isola il termine con $\\delta(t)$ e guarda quale condizione iniziale su $h$ serve. Qui davanti a $\\partial_t$ c'&egrave; una $i$.","sol":"Posto $G=\\theta(t)h(t,x)$ con $h$ soluzione dell'omogenea, $$\\big(i\\partial_t+\\tfrac12\\partial_x^2\\big)G=i\\,\\delta(t)\\,h(0,x)+\\theta(t)\\underbrace{\\big(i\\partial_th+\\tfrac12\\partial_x^2h\\big)}_{=0}.$$ Perch&eacute; il risultato sia $\\delta(t)\\delta(x)$ serve $i\\,h(0,x)=\\delta(x)$, cio&egrave; $h(0,x)=-i\\,\\delta(x)$: la condizione iniziale &egrave; la delta <em>divisa per $i$</em>. Poich&eacute; $K$ &egrave; per definizione la soluzione con dato $\\delta(x)$, si ha $h=-iK$ e dunque $G=-i\\theta(t)K(t,x)$. Il fattore $-i$ &egrave; esattamente ci&ograve; che distingue il <em>propagatore</em> $K$ (soluzione con dato iniziale $\\delta$) dalla <em>Green</em> $G$ (soluzione con sorgente $\\delta$ nello spazio-tempo): sono due oggetti diversi che in letteratura si chiamano spesso con lo stesso nome. Con la convenzione $\\big(i\\partial_t-H\\big)G=\\delta$ si trova sempre $G=-i\\theta(t)e^{-iHt}$, ed &egrave; il $-i$ che compare in ogni vertice della serie perturbativa di Dyson.","cont":"Confronta col calore"},{"t":"Che cosa distingue $|G|$ di Schr&ouml;dinger da $|G|$ del calore, a parit&agrave; di sorgente puntiforme?","opts":[{"x":"Il modulo di Schr&ouml;dinger vale $\\theta(t)/\\sqrt{2\\pi t}$ e non dipende da $x$: il disturbo &egrave; ovunque con la stessa ampiezza, e l'informazione sta tutta nella fase $e^{ix^2/2t}$; nel calore il modulo &egrave; gaussiano e decade in $x$","c":true},{"x":"Nessuna differenza sostanziale: entrambi sono gaussiani con la stessa larghezza $\\sqrt{2Dt}$"},{"x":"Il modulo di Schr&ouml;dinger decade come $e^{-x^2/2t}$, quello del calore come $e^{-x^2/4Dt}$: cambiano solo i fattori numerici"},{"x":"Il modulo di Schr&ouml;dinger cresce con $|x|$, perch&eacute; l'equazione non &egrave; dissipativa"}],"hint":"Calcola il modulo dell'esponenziale $e^{ix^2/(2t)}$ con $x$ e $t$ reali.","sol":"Con $x,t$ reali l'esponente $ix^2/(2t)$ &egrave; puramente immaginario, dunque $\\big|e^{ix^2/2t}\\big|=1$ e $|G|=\\theta(t)\\,\\big|2\\pi it\\big|^{-1/2}=\\theta(t)/\\sqrt{2\\pi t}$, indipendente da $x$. La struttura spaziale non sta nell'ampiezza ma nella <em>fase quadratica</em>, e riemerge solo quando si integra contro un dato iniziale, per interferenza: il metodo della fase stazionaria mostra che il punto $y$ che contribuisce di pi&ugrave; a $u(t,x)$ &egrave; quello con $ (x-y)/t=$ velocit&agrave; del pacchetto, cio&egrave; la propagazione classica emerge dall'interferenza. Tre conseguenze da tenere insieme. (i) Anche Schr&ouml;dinger ha velocit&agrave; di propagazione infinita, come il calore: la coda &egrave; istantanea. (ii) A differenza del calore, non c'&egrave; regolarizzazione: l'evoluzione &egrave; unitaria e invertibile, e $\\|\\psi(t)\\|_{L^2}$ si conserva mentre nel calore decade. (iii) L'equazione di Schr&ouml;dinger all'indietro &egrave; ben posta, mentre il calore all'indietro non lo &egrave;: &egrave; l'unica $i$ nell'esponente $e^{-ik^2t/2}$ contro $e^{-Dk^2t}$ a fare tutta la differenza — modulo uno contro decadimento.","cont":"Il caso con potenziale"},{"t":"Se all'equazione si aggiunge un potenziale, $\\big(i\\partial_t+\\tfrac12\\partial_x^2-V(x)\\big)G=\\delta(t)\\delta(x)$, e $V$ &egrave; 'piccolo', quale struttura si genera?","opts":[{"x":"L'identit&agrave; risolvente $G=G_0+G_0\\,V\\,G$, che iterata d&agrave; la serie $G=G_0+G_0VG_0+G_0VG_0VG_0+\\dots$: ogni termine &egrave; una sequenza di propagazioni libere separate da interazioni, ed &egrave; la serie di Born-Dyson","c":true},{"x":"Il propagatore libero moltiplicato per $e^{-i\\int V\\,dt}$, esattamente e senza approssimazioni"},{"x":"Nessuna struttura utile: con un potenziale la Green si calcola solo numericamente"},{"x":"La Green diventa $G_0/(1-V)$, per somma della serie geometrica puntuale"}],"hint":"Porta il termine $V G$ al membro destro e trattalo come una sorgente, poi usa la formula di Duhamel gi&agrave; nota. La 'sorgente' contiene l'incognita: da l&igrave; l'iterazione.","sol":"Scrivendo $\\big(i\\partial_t+\\tfrac12\\partial_x^2\\big)G=\\delta+VG$ e applicando la Green libera $G_0$ come si fa con una sorgente qualunque, si ottiene $G=G_0+G_0VG$, dove il prodotto &egrave; una convoluzione in spazio e tempo. Sostituendo ripetutamente $G$ nel membro destro nasce la serie perturbativa. Non &egrave; un artificio di questo corso: &egrave; la struttura dei diagrammi di Feynman, in cui la linea &egrave; $G_0$, il vertice &egrave; $V$, e l'ordine $n$-esimo &egrave; $n$ interazioni intervallate da propagazioni libere. L'esponenziale $e^{-i\\int V}$ sarebbe esatto solo se $V$ commutasse con il termine cinetico, cosa falsa perch&eacute; $V(x)$ e $\\partial_x^2$ non commutano — l'errore &egrave; il primo termine della formula di Baker-Campbell-Hausdorff, ed &egrave; esattamente il motivo per cui in fisica numerica si usa lo splitting di Trotter con passi piccoli."}]},{"pool":"edp","src":"advezione-diffusione, riferimento mobile &middot; da MIT 18.303 PS4/PS6 &middot; manuale","steps":[{"t":"Un inquinante in un fiume obbedisce a $\\partial_tu+v\\,\\partial_xu=D\\,\\partial_x^2u$ su $x\\in\\mathbb{R}$, con $u(0,x)=g(x)$ e $v>0$ costante. Quale cambio di variabile elimina il termine di trasporto?","opts":[{"x":"$\\xi=x-vt$, cio&egrave; il riferimento che viaggia con la corrente: posto $w(t,\\xi)=u(t,x)$ resta $\\partial_tw=D\\partial_\\xi^2w$","c":true},{"x":"$\\xi=x+vt$, cio&egrave; il riferimento che risale la corrente"},{"x":"$\\tau=t-x/v$, il tempo ritardato"},{"x":"$u=e^{-vt}w$, che assorbe il trasporto in un fattore esponenziale"}],"hint":"Scrivi la regola della catena per $\\partial_tu$ quando $u(t,x)=w(t,x-ct)$: compare un termine $-c\\,\\partial_\\xi w$ che deve cancellare $+v\\partial_xu$.","sol":"Con $u(t,x)=w(t,\\xi)$ e $\\xi=x-ct$: $\\partial_tu=\\partial_tw-c\\,\\partial_\\xi w$, $\\partial_xu=\\partial_\\xi w$, $\\partial_x^2u=\\partial_\\xi^2w$. Sostituendo, $\\partial_tw-c\\partial_\\xi w+v\\partial_\\xi w=D\\partial_\\xi^2w$, e la scelta $c=v$ cancella i due termini del primo ordine lasciando il calore puro. Il verso &egrave; il punto delicato: $\\xi=x-vt$ &egrave; la coordinata di un osservatore che si sposta <em>con</em> la corrente, ed &egrave; nel suo riferimento che il fenomeno &egrave; pura diffusione. Il fattore esponenziale $e^{-vt}$ non funziona qui perch&eacute; assorbe termini di ordine <em>zero</em> (cio&egrave; $\\pm\\alpha u$), non del primo ordine: le due sostituzioni sono complementari e in un problema con tutti e tre i termini (come l'appello del 08/07/2025) si usano entrambe.","cont":"Scrivi la soluzione"},{"t":"Qual &egrave; allora $u(t,x)$?","opts":[{"x":"$u(t,x)=\\displaystyle\\int_{-\\infty}^{+\\infty}\\!\\!dy\\;\\frac{e^{-(x-vt-y)^2/(4Dt)}}{\\sqrt{4\\pi Dt}}\\,g(y)$","c":true},{"x":"$u(t,x)=\\displaystyle\\int_{-\\infty}^{+\\infty}\\!\\!dy\\;\\frac{e^{-(x+vt-y)^2/(4Dt)}}{\\sqrt{4\\pi Dt}}\\,g(y)$"},{"x":"$u(t,x)=e^{-vt}\\displaystyle\\int_{-\\infty}^{+\\infty}\\!\\!dy\\;\\frac{e^{-(x-y)^2/(4Dt)}}{\\sqrt{4\\pi Dt}}\\,g(y)$"},{"x":"$u(t,x)=g(x-vt)$, perch&eacute; il trasporto domina"}],"hint":"Risolvi il calore in $\\xi$ e poi torna indietro sostituendo $\\xi=x-vt$ nell'argomento del nucleo.","sol":"In $\\xi$ il problema &egrave; il calore puro con dato $w(0,\\xi)=g(\\xi)$, dunque $w(t,\\xi)=\\int K_t(\\xi-y)g(y)dy$ con $K_t$ il nucleo gaussiano. Tornando, $\\xi-y=x-vt-y$: il nucleo &egrave; centrato in $x=y+vt$, cio&egrave; la massa iniziale in $y$ si &egrave; spostata di $vt$ e nel frattempo si &egrave; allargata di $\\sqrt{2Dt}$. Se $g$ &egrave; gaussiana di varianza $a^2$ centrata in $0$, la soluzione &egrave; gaussiana con centro $vt$ e varianza $a^2+2Dt$: trasporto rigido del baricentro, diffusione della larghezza, e i due effetti non interferiscono perch&eacute; l'operatore &egrave; a coefficienti costanti. Il puro trasporto $g(x-vt)$ sarebbe la risposta con $D=0$: corretta come limite, non come soluzione. Verifica che vale sempre la pena fare: la massa $\\int u\\,dx$ si conserva (nessun termine di reazione), e $\\frac{d}{dt}\\int x\\,u\\,dx=v\\int u\\,dx$, cio&egrave; il baricentro avanza esattamente a velocit&agrave; $v$.","cont":"Quando domina che cosa"},{"t":"Su una scala di lunghezza $L$, quale numero adimensionale dice se conta di pi&ugrave; il trasporto o la diffusione?","opts":[{"x":"Il numero di P&eacute;clet $\\mathrm{Pe}=vL/D$: &egrave; il rapporto fra il tempo diffusivo $L^2/D$ e quello advettivo $L/v$; $\\mathrm{Pe}\\gg1$ significa trasporto dominante, $\\mathrm{Pe}\\ll1$ diffusione dominante","c":true},{"x":"Il rapporto $v/D$, che ha le dimensioni di un inverso di lunghezza ed &egrave; gi&agrave; adimensionale"},{"x":"Il numero di Reynolds $vL/\\nu$, che &egrave; lo stesso oggetto con $\\nu=D$"},{"x":"Il prodotto $vDL$, grande quando entrambi gli effetti sono forti"}],"hint":"Costruisci i due tempi caratteristici del problema sulla scala $L$ e fanne il rapporto: uno va come $L$, l'altro come $L^2$.","sol":"I due tempi sono $\\tau_{\\rm adv}=L/v$ e $\\tau_{\\rm diff}=L^2/D$, e il loro rapporto $\\tau_{\\rm diff}/\\tau_{\\rm adv}=vL/D$ &egrave; il numero di P&eacute;clet, adimensionale perch&eacute; $[D]=\\mathrm{lung}^2/\\mathrm{tempo}$ e $[v]=\\mathrm{lung}/\\mathrm{tempo}$. Il solo $v/D$ non &egrave; adimensionale: &egrave; l'inverso di una lunghezza, e proprio quella lunghezza $\\ell=D/v$ &egrave; la scala sotto la quale la diffusione vince comunque. Il numero di Reynolds ha la stessa forma ma confronta inerzia e viscosit&agrave; nell'equazione di Navier-Stokes, non trasporto e diffusione di uno scalare passivo: nei fluidi reali il loro rapporto $\\mathrm{Pe}/\\mathrm{Re}=\\nu/D$ &egrave; il numero di Schmidt. Conseguenza numerica pratica, che vale la pena conoscere: discretizzando su passo $h$, se il P&eacute;clet di cella $vh/D$ supera $2$ gli schemi centrati producono oscillazioni spurie, ed &egrave; il motivo per cui si usano schemi upwind."}]},{"pool":"edp","src":"reazione-diffusione, sostituzione esponenziale &middot; manuale","steps":[{"t":"Sia $\\partial_tu=D\\partial_x^2u+\\alpha u$ su $[0,L]$ con $u(t,0)=u(t,L)=0$ e $\\alpha>0$ costante (diffusione con crescita locale). Quale sostituzione riduce il problema al calore puro?","opts":[{"x":"$u(t,x)=e^{\\alpha t}w(t,x)$: si ottiene $\\partial_tw=D\\partial_x^2w$ con le stesse condizioni al bordo, perch&eacute; il fattore &egrave; non nullo e non dipende da $x$","c":true},{"x":"$u(t,x)=e^{-\\alpha t}w(t,x)$"},{"x":"$u(t,x)=e^{\\alpha x}w(t,x)$"},{"x":"Nessuna: con un termine di reazione la separazione di variabili non &egrave; pi&ugrave; applicabile"}],"hint":"Sostituisci $u=e^{\\lambda t}w$ nell'equazione e determina $\\lambda$ chiedendo che il termine proporzionale a $w$ scompaia. Il segno esce dal conto, non dall'intuizione.","sol":"Con $u=e^{\\lambda t}w$: $\\partial_tu=e^{\\lambda t}(\\lambda w+\\partial_tw)$ e il membro destro vale $e^{\\lambda t}(D\\partial_x^2w+\\alpha w)$. Uguagliando, $\\partial_tw=D\\partial_x^2w+(\\alpha-\\lambda)w$, e la scelta $\\lambda=\\alpha$ elimina il termine di reazione: dunque $u=e^{+\\alpha t}w$. Il segno &egrave; quello che sembra 'sbagliato' a chi ragiona per analogia col decadimento: qui $\\alpha>0$ &egrave; una <em>crescita</em>, e il fattore che la riassorbe cresce a sua volta. Due osservazioni sulla legittimit&agrave;: il fattore non dipende da $x$, quindi non tocca $\\partial_x^2$ e non altera le condizioni al bordo omogenee ($u=0\\Leftrightarrow w=0$, perch&eacute; $e^{\\alpha t}\\ne0$); e la sostituzione funziona identicamente con $\\alpha$ dipendente dal tempo, purch&eacute; si prenda $\\lambda(t)=\\int_0^t\\alpha(s)ds$. La separazione, di per s&eacute;, funzionerebbe anche senza sostituzione: il termine $\\alpha u$ semplicemente sposta tutti gli autovalori della stessa quantit&agrave;.","cont":"Scrivi lo spettro effettivo"},{"t":"Qual &egrave; la soluzione, e con quale tasso evolve il modo $n$?","opts":[{"x":"$u=\\sum_{n\\ge1}c_n\\,e^{(\\alpha-Dk_n^2)t}\\sin(k_nx)$ con $k_n=\\tfrac{n\\pi}{L}$: la reazione trasla in blocco tutti i tassi di $+\\alpha$","c":true},{"x":"$u=\\sum_{n\\ge1}c_n\\,e^{-Dk_n^2t}\\sin(k_nx)$: il fattore $e^{\\alpha t}$ si semplifica con quello della sostituzione"},{"x":"$u=e^{\\alpha t}\\sum_{n\\ge1}c_n\\,e^{-Dk_n^2t}\\cos(k_nx)$"},{"x":"$u=\\sum_{n\\ge1}c_n\\,e^{(\\alpha-Dk_n)t}\\sin(k_nx)$"}],"hint":"Risolvi il calore puro per $w$ con Dirichlet, poi rimoltiplica per $e^{\\alpha t}$ e raccogli gli esponenti. La potenza di $k_n$ nel tasso non pu&ograve; essere uno.","sol":"Per $w$ vale la soluzione standard con Dirichlet: $w=\\sum_nc_ne^{-Dk_n^2t}\\sin(k_nx)$, $k_n=n\\pi/L$, e $c_n=\\frac2L\\int_0^Lg\\sin(k_nx)dx$ perch&eacute; $w(0,x)=u(0,x)=g$. Rimoltiplicando, $u=\\sum_nc_ne^{(\\alpha-Dk_n^2)t}\\sin(k_nx)$. Lo spettro dell'operatore completo $D\\partial_x^2+\\alpha$ &egrave; dunque quello di $D\\partial_x^2$ traslato di $\\alpha$: un termine di ordine zero non cambia le autofunzioni, sposta solo tutti gli autovalori. Il tasso va come $k_n^2$ e non come $k_n$: le dimensioni lo confermano, $[Dk^2]=1/\\mathrm{tempo}$ mentre $[Dk]=\\mathrm{lung}/\\mathrm{tempo}$.","cont":"La soglia"},{"t":"Per quali $L$ la soluzione cresce invece di spegnersi?","opts":[{"x":"Per $L>L_c=\\pi\\sqrt{D/\\alpha}$: il modo fondamentale ha tasso $\\alpha-D\\pi^2/L^2$, positivo esattamente sopra quella soglia","c":true},{"x":"Per ogni $L$, perch&eacute; il termine $\\alpha u$ con $\\alpha>0$ &egrave; sempre destabilizzante"},{"x":"Per $L<L_c=\\pi\\sqrt{D/\\alpha}$: dominio piccolo, meno dispersione, quindi crescita"},{"x":"Per nessun $L$: le condizioni di Dirichlet garantiscono il decadimento"}],"hint":"Il destino a tempi lunghi &egrave; deciso dal modo con il tasso pi&ugrave; grande, cio&egrave; da $n=1$. Imponi che quel tasso sia positivo e risolvi in $L$.","sol":"Il tasso del modo $n$ &egrave; $\\sigma_n=\\alpha-D n^2\\pi^2/L^2$, decrescente in $n$: il pi&ugrave; instabile &egrave; sempre il fondamentale. Da $\\sigma_1>0$ segue $\\alpha>D\\pi^2/L^2$, cio&egrave; $L>\\pi\\sqrt{D/\\alpha}$, e la verifica dimensionale torna perch&eacute; $\\sqrt{D/\\alpha}$ &egrave; una lunghezza. &Egrave; il fenomeno della <em>dimensione critica</em>: la diffusione porta materia ai bordi assorbenti a un ritmo $\\sim D/L^2$, la reazione la crea a ritmo $\\alpha$, e vince chi &egrave; pi&ugrave; veloce. Il modello &egrave; l'equazione di Fisher-KPP linearizzata: sotto $L_c$ una popolazione confinata in un habitat con bordi letali si estingue, sopra $L_c$ esplode (e la saturazione richiede il termine non lineare $-u^2$ che qui &egrave; stato trascurato). La stessa aritmetica d&agrave; la <em>massa critica</em> di un reattore nucleare, con $\\alpha$ il tasso netto di produzione di neutroni per fissione e le pareti che assorbono: la criticit&agrave; &egrave; letteralmente $\\sigma_1=0$. Con $\\alpha<0$ (decadimento) tutti i tassi sono negativi e non c'&egrave; alcuna soglia, coerentemente con l'opzione scartata."}]},{"pool":"edp","src":"Laplace sul disco &middot; da MIT 18.303 PS5 &middot; manuale","steps":[{"t":"Si risolve $\\Delta u=0$ sul disco $r<a$ con $u(a,\\theta)=f(\\theta)$. In polari $\\Delta u=\\partial_r^2u+\\frac1r\\partial_ru+\\frac{1}{r^2}\\partial_\\theta^2u$. Separando $u=R(r)\\Theta(\\theta)$, che cosa quantizza la costante di separazione?","opts":[{"x":"La <em>periodicit&agrave;</em> $\\Theta(\\theta+2\\pi)=\\Theta(\\theta)$, che non &egrave; una condizione al bordo imposta dal problema ma un requisito di buona definizione della funzione: d&agrave; $\\Theta''=-n^2\\Theta$ con $n$ intero","c":true},{"x":"La condizione $u(a,\\theta)=f(\\theta)$ sul bordo del disco"},{"x":"La condizione di regolarit&agrave; in $r=0$"},{"x":"Nulla: sul disco la costante di separazione resta continua e la somma diventa un integrale"}],"hint":"$\\theta$ e $\\theta+2\\pi$ sono lo stesso punto del piano: che cosa impone questo a $\\Theta$? E chiediti quale delle altre condizioni agisce invece sulla parte radiale.","sol":"Moltiplicando per $r^2/(R\\Theta)$ si separa: $\\frac{r^2R''+rR'}{R}=-\\frac{\\Theta''}{\\Theta}=\\mu$. La variabile angolare vive sul cerchio, e una funzione sul piano deve assumere lo stesso valore in $\\theta$ e $\\theta+2\\pi$ (e cos&igrave; la sua derivata): sono <em>condizioni periodiche</em>, che come nel caso dell'intervallo con BC periodiche danno $\\mu=n^2$ con $n=0,1,2,\\dots$ e autofunzioni $\\cos(n\\theta)$, $\\sin(n\\theta)$, con degenerazione doppia per $n\\ge1$. La differenza concettuale rispetto ai problemi su un intervallo &egrave; che qui la condizione non &egrave; imposta dalla fisica del bordo: &egrave; imposta dalla <em>geometria</em>, e dimenticarla &egrave; l'errore che produce soluzioni con $n$ non intero, cio&egrave; funzioni a pi&ugrave; valori. Le altre due condizioni hanno ruoli diversi e vanno tenute separate: la regolarit&agrave; in $r=0$ seleziona una delle due soluzioni radiali, il dato $f(\\theta)$ fissa i coefficienti.","cont":"Risolvi la parte radiale"},{"t":"Con $\\mu=n^2$ la parte radiale &egrave; $r^2R''+rR'-n^2R=0$. Quali sono le soluzioni?","opts":[{"x":"$R=r^{n}$ e $R=r^{-n}$ per $n\\ge1$; per $n=0$ le due soluzioni indipendenti sono $R=1$ e $R=\\ln r$","c":true},{"x":"$R=\\cos(nr)$ e $R=\\sin(nr)$"},{"x":"$R=J_n(nr)$ e $R=Y_n(nr)$, le funzioni di Bessel"},{"x":"$R=e^{nr}$ e $R=e^{-nr}$"}],"hint":"&Egrave; un'equazione di Eulero: i coefficienti hanno grado pari all'ordine della derivata. Prova $R=r^s$ e ricava l'equazione indiciale; poi tratta a parte il caso in cui le due radici coincidono.","sol":"&Egrave; l'<em>equazione di Eulero</em> (o equidimensionale): il tentativo $R=r^s$ d&agrave; $s(s-1)+s-n^2=0$, cio&egrave; $s^2=n^2$ e $s=\\pm n$. Per $n\\ge1$ le due soluzioni indipendenti sono $r^n$ e $r^{-n}$. Per $n=0$ le radici coincidono ($s=0$ doppia) e la seconda soluzione si ottiene col metodo standard delle radici ripetute, moltiplicando per il logaritmo della variabile: $R=1$ e $R=\\ln r$. Il modo mnemonico &egrave; la sostituzione $r=e^{\\tau}$, che manda Eulero in $\\frac{d^2R}{d\\tau^2}-n^2R=0$ a coefficienti costanti, con soluzioni $e^{\\pm n\\tau}=r^{\\pm n}$ e, per $n=0$, $1$ e $\\tau=\\ln r$. Le funzioni di Bessel non compaiono qui: nascono dall'equazione di <em>Helmholtz</em> $\\Delta u+k^2u=0$ in polari, cio&egrave; nei problemi di calore e onde sul disco dove il termine $k^2r^2$ si aggiunge; per Laplace puro il conto &egrave; elementare. Il logaritmo, per inciso, &egrave; la soluzione fondamentale del Laplaciano in 2D e descrive il potenziale di una carica lineare.","cont":"Elimina le soluzioni cattive"},{"t":"Che cosa impone la regolarit&agrave; nell'origine, e come si scrive la soluzione generale?","opts":[{"x":"Scarta $r^{-n}$ e $\\ln r$, che divergono in $r=0$: resta $u=\\frac{a_0}{2}+\\sum_{n\\ge1}r^n\\big[a_n\\cos(n\\theta)+b_n\\sin(n\\theta)\\big]$, con i coefficienti fissati da $f$ attraverso i fattori $a^n$","c":true},{"x":"Scarta $r^n$, perch&eacute; deve restare limitata al bordo"},{"x":"Non scarta nulla: entrambe le soluzioni sono ammesse e le costanti si fissano col solo dato al bordo"},{"x":"Scarta $r^{-n}$ ma conserva $\\ln r$, che &egrave; integrabile in due dimensioni"}],"hint":"Il punto $r=0$ &egrave; un punto interno del dominio come tutti gli altri, e l&igrave; non c'&egrave; alcuna sorgente: la soluzione deve essere finita. Poi imponi $r=a$ e riconosci una serie di Fourier.","sol":"L'origine &egrave; interna al dominio e il problema &egrave; omogeneo: la soluzione dev'essere limitata e liscia l&igrave; come altrove, quindi cadono $r^{-n}$ e $\\ln r$. Che $\\ln r$ sia integrabile non basta: la richiesta &egrave; che $\\Delta u=0$ <em>ovunque</em>, e $\\Delta\\ln r=2\\pi\\delta^{(2)}(\\mathbf{x})$, cio&egrave; conservarlo equivarrebbe a mettere di nascosto una carica puntiforme nel centro. Resta $$u(r,\\theta)=\\frac{a_0}{2}+\\sum_{n\\ge1}\\Big(\\frac{r}{a}\\Big)^{\\!n}\\big[\\alpha_n\\cos n\\theta+\\beta_n\\sin n\\theta\\big],$$ dove $\\alpha_n,\\beta_n$ sono i coefficienti di Fourier di $f(\\theta)$ su $[0,2\\pi)$ — scrivere $(r/a)^n$ &egrave; comodo perch&eacute; a $r=a$ il fattore vale $1$ e la serie diventa direttamente quella di $f$. Sul dominio complementare, la <em>corona</em> $a<r<b$ o l'esterno del disco, la conclusione si rovescia: l&igrave; l'origine non appartiene al dominio, $r^{-n}$ e $\\ln r$ sono ammesse, e servono due dati al bordo per fissare tutte le costanti.","cont":"Esempio e propriet&agrave; della media"},{"t":"Con $a=1$ e $f(\\theta)=1+3\\cos\\theta-2\\sin(2\\theta)$, quanto valgono $u(r,\\theta)$ e $u$ al centro?","opts":[{"x":"$u=1+3r\\cos\\theta-2r^2\\sin(2\\theta)$, e $u(0)=1$, che &egrave; la media di $f$ sul bordo","c":true},{"x":"$u=1+3r\\cos\\theta-2r^2\\sin(2\\theta)$, e $u(0)=1+3-2=2$"},{"x":"$u=r\\big[1+3\\cos\\theta-2\\sin(2\\theta)\\big]$, e $u(0)=0$"},{"x":"$u=1+3r^2\\cos\\theta-2r^4\\sin(2\\theta)$, e $u(0)=1$"}],"hint":"Il dato &egrave; gi&agrave; scritto nella base angolare: nessun integrale, basta attaccare a ciascun modo la sua potenza di $r$. E quale potenza spetta a $\\cos\\theta$?","sol":"Il dato &egrave; una combinazione finita di $1$, $\\cos\\theta$, $\\sin2\\theta$, quindi per l'unicit&agrave; dello sviluppo di Fourier i coefficienti si leggono: $a_0/2=1$, $\\alpha_1=3$, $\\beta_2=-2$. A ciascun modo si attacca $r^n$ con $n$ pari all'<em>indice angolare</em> del modo, non alla sua posizione nella lista: $\\cos\\theta\\to r$, $\\sin2\\theta\\to r^2$. Dunque $u=1+3r\\cos\\theta-2r^2\\sin2\\theta$; a $r=1$ si ritrova $f$, come dev'essere. Al centro sopravvive il solo termine costante, $u(0)=1$, e non &egrave; un caso: &egrave; la <em>propriet&agrave; della media</em> delle funzioni armoniche, $u(\\mathbf{x}_0)=\\frac{1}{2\\pi}\\int_0^{2\\pi}u(\\mathbf{x}_0+a\\mathbf{e}_\\theta)\\,d\\theta$, che qui si vede in trasparenza perch&eacute; tutti i modi $n\\ge1$ hanno media angolare nulla e si annullano in $r=0$. Da questa propriet&agrave; discende in due righe il principio del massimo (una funzione armonica non pu&ograve; avere massimi interni stretti) e da esso l'unicit&agrave; del problema di Dirichlet. Sommando esplicitamente la serie con i coefficienti di $f$ si ottiene poi la formula integrale di Poisson, $u(r,\\theta)=\\frac{1}{2\\pi}\\int_0^{2\\pi}\\frac{a^2-r^2}{a^2-2ar\\cos(\\theta-\\phi)+r^2}f(\\phi)\\,d\\phi$: &egrave; la Green del disco, ed &egrave; la versione continua di questo stesso conto."}]},{"pool":"edp","src":"Laplace su rettangolo, dati su pi&ugrave; lati &middot; da MIT 18.303 PS5 &middot; manuale","steps":[{"t":"Si vuole $\\Delta u=0$ su $[0,a]\\times[0,b]$ con $u(x,b)=F(x)$ sul lato alto, $u(a,y)=H(y)$ sul lato destro, e $u=0$ sugli altri due. Perch&eacute; la separazione diretta non funziona, e che cosa si fa?","opts":[{"x":"Perch&eacute; con due dati non nulli su lati non paralleli nessuna delle due variabili ha entrambe le condizioni omogenee, quindi manca il problema di Sturm-Liouville. Si spezza per <em>linearit&agrave;</em> in $u=u_1+u_2$, con $u_1$ che porta $F$ e ha zero sugli altri tre lati, $u_2$ che porta $H$ e zero sugli altri tre","c":true},{"x":"Perch&eacute; il rettangolo non &egrave; un dominio separabile; si passa alle coordinate polari"},{"x":"Non serve fare nulla: si separa e si impongono i due dati sui coefficienti della stessa serie"},{"x":"Perch&eacute; il problema &egrave; sovradeterminato: quattro condizioni per un'equazione del secondo ordine sono troppe"}],"hint":"Per separare serve <em>una</em> direzione con due condizioni omogenee agli estremi. Contale, direzione per direzione, nel problema come &egrave; posto.","sol":"La separazione richiede che, in almeno una delle due direzioni, le condizioni ai due estremi siano omogenee: solo allora quella direzione fornisce un problema di Sturm-Liouville con una base di autofunzioni su cui sviluppare. Qui in $x$ si ha $u(0,y)=0$ ma $u(a,y)=H(y)\\ne0$, e in $y$ si ha $u(x,0)=0$ ma $u(x,b)=F(x)\\ne0$: nessuna direzione &egrave; pulita. Il rimedio &egrave; il <em>principio di sovrapposizione</em>, lecito perch&eacute; l'equazione &egrave; lineare e omogenea: si risolvono due problemi, ciascuno con un solo lato attivo, e si sommano. In generale, un rettangolo con quattro dati non nulli si spezza in quattro sottoproblemi. Il rettangolo resta perfettamente separabile — quello che non &egrave; separabile &egrave; il modo in cui i dati sono distribuiti, e non c'&egrave; nulla di sovradeterminato: per un problema ellittico si assegna esattamente un dato su tutto il bordo, ed &egrave; ci&ograve; che si sta facendo.","cont":"Risolvi i due pezzi"},{"t":"Nel pezzo $u_2$ (dato $H(y)$ sul lato $x=a$, zero sugli altri tre), quale base si usa?","opts":[{"x":"Seni in $y$ e seni iperbolici in $x$: $u_2=\\sum_{n\\ge1}d_n\\sinh\\!\\big(\\tfrac{n\\pi x}{b}\\big)\\sin\\!\\big(\\tfrac{n\\pi y}{b}\\big)$, con $d_n\\sinh\\!\\big(\\tfrac{n\\pi a}{b}\\big)$ uguale al coefficiente di Fourier di $H$ su $[0,b]$","c":true},{"x":"Seni in $x$ e seni iperbolici in $y$, come nel pezzo $u_1$: la base non cambia"},{"x":"Seni in entrambe le variabili, $\\sin(n\\pi x/a)\\sin(m\\pi y/b)$"},{"x":"Coseni in $y$ e esponenziali in $x$"}],"hint":"I ruoli delle due variabili si scambiano rispetto al primo pezzo: adesso &egrave; $y$ ad avere due condizioni omogenee. E occhio a quale lunghezza compare nei denominatori.","sol":"In $u_2$ le condizioni omogenee sono $u_2(x,0)=u_2(x,b)=0$, cio&egrave; sulla variabile $y$: &egrave; $y$ a quantizzarsi, con $\\sin(n\\pi y/b)$ e $k_n=n\\pi/b$ — nel denominatore va $b$, la lunghezza del lato lungo cui si annulla, non $a$. Allora $X''=k_n^2X$ ha soluzioni iperboliche, e $u_2(0,y)=0$ seleziona $\\sinh(k_nx)$ scartando $\\cosh$. Il coefficiente si fissa proiettando $H$ sul lato attivo: $d_n\\sinh(n\\pi a/b)=\\frac2b\\int_0^bH(y)\\sin\\!\\big(\\frac{n\\pi y}{b}\\big)dy$. La simmetria del conto rispetto al pezzo $u_1$ &egrave; una pura ridenominazione delle variabili, e riconoscerla fa risparmiare met&agrave; del tempo d'esame. Il prodotto $\\sin\\cdot\\sin$ nelle due variabili &egrave; invece la base giusta per il problema agli autovalori $\\Delta\\varphi=-\\lambda\\varphi$ sul rettangolo (calore e onde 2D), non per Laplace: qui la costante di separazione compare con segni opposti nelle due direzioni e una delle due <em>deve</em> essere iperbolica.","cont":"Il controllo sui vertici"},{"t":"Che cosa succede nel vertice $(a,b)$ se $F(a)\\ne H(b)$?","opts":[{"x":"Il dato al bordo &egrave; discontinuo in quel vertice: la soluzione resta armonica e ben definita all'interno, ma non si estende con continuit&agrave; fino al vertice, dove il limite dipende dalla direzione di avvicinamento","c":true},{"x":"Il problema non ammette soluzione: i dati sono incompatibili"},{"x":"La soluzione esiste ma non &egrave; unica, perch&eacute; nel vertice resta un grado di libert&agrave;"},{"x":"Le serie divergono ovunque all'interno del rettangolo"}],"hint":"&Egrave; la stessa situazione dell'unit&agrave; sul dato costante incompatibile con le BC di Dirichlet nel calore: la singolarit&agrave; sta in un angolo del dominio, non dentro.","sol":"Una discontinuit&agrave; del dato in un punto del bordo non distrugge la buona posizione: il problema di Dirichlet ha soluzione unica per dati anche solo $L^2$ sul bordo, e la soluzione &egrave; analitica in <em>tutto l'interno</em> per la regolarit&agrave; ellittica (le funzioni armoniche sono analitiche dove l'equazione vale). Quello che si perde &egrave; la continuit&agrave; fino al bordo nel punto singolare: avvicinandosi al vertice lungo il lato alto si tende a $F(a)$, lungo il lato destro a $H(b)$, e il limite non esiste. &Egrave; la stessa struttura del calore con dato costante e BC di Dirichlet omogenee, dove la singolarit&agrave; vive nell'angolo $(t,x)=(0,0)$ dello spazio-tempo. Segno pratico della cosa: le serie convergono lentamente vicino al vertice, e una somma troncata mostra l&igrave; le sovraoscillazioni di Gibbs. In un problema d'esame, se i dati sono compatibili nei vertici la soluzione &egrave; continua sulla chiusura, e verificare quella compatibilit&agrave; costa dieci secondi."}]},{"pool":"edp","src":"separazione 2D &middot; da MIT 18.303 PS5 &middot; manuale","steps":[{"t":"Calore su una piastra rettangolare: $\\partial_tu=D\\big(\\partial_x^2u+\\partial_y^2u\\big)$ su $[0,a]\\times[0,b]$ con $u=0$ su tutto il bordo. Quali sono i modi e gli autovalori?","opts":[{"x":"$\\varphi_{mn}=\\sin\\!\\big(\\tfrac{m\\pi x}{a}\\big)\\sin\\!\\big(\\tfrac{n\\pi y}{b}\\big)$ con $\\lambda_{mn}=\\pi^2\\big(\\tfrac{m^2}{a^2}+\\tfrac{n^2}{b^2}\\big)$ e fattore temporale $e^{-D\\lambda_{mn}t}$, $m,n\\ge1$","c":true},{"x":"$\\varphi_{mn}=\\sin\\!\\big(\\tfrac{m\\pi x}{a}\\big)\\sin\\!\\big(\\tfrac{n\\pi y}{b}\\big)$ con $\\lambda_{mn}=\\pi^2\\tfrac{(m+n)^2}{ab}$"},{"x":"$\\varphi_{mn}=\\sin\\!\\big(\\tfrac{m\\pi x}{a}\\big)\\sin\\!\\big(\\tfrac{n\\pi y}{b}\\big)$ con $\\lambda_{mn}=\\pi^2\\big(\\tfrac{m}{a}+\\tfrac{n}{b}\\big)^2$"},{"x":"$\\varphi_{mn}=\\sin\\!\\big(\\tfrac{m\\pi x}{a}\\big)\\cos\\!\\big(\\tfrac{n\\pi y}{b}\\big)$ con $\\lambda_{mn}=\\pi^2\\big(\\tfrac{m^2}{a^2}+\\tfrac{n^2}{b^2}\\big)$, $m\\ge1$, $n\\ge0$"}],"hint":"Separa due volte: $u=T(t)X(x)Y(y)$. Ogni direzione produce la sua costante, e la terza equazione le somma. Gli autovalori si sommano, non i numeri d'onda.","sol":"Con $u=T(t)X(x)Y(y)$ e divisione per $TXY$: $\\frac{\\dot T}{DT}=\\frac{X''}{X}+\\frac{Y''}{Y}$. Il primo addendo dipende solo da $x$, il secondo solo da $y$, e la somma da nessuna delle due: dunque ciascuno &egrave; costante, $X''/X=-\\alpha$ e $Y''/Y=-\\beta$. Dirichlet omogenee in entrambe le direzioni danno $X=\\sin(m\\pi x/a)$, $\\alpha_m=(m\\pi/a)^2$ e $Y=\\sin(n\\pi y/b)$, $\\beta_n=(n\\pi/b)^2$, con $m,n\\ge1$. L'autovalore del Laplaciano 2D &egrave; la <em>somma</em> $\\lambda_{mn}=\\alpha_m+\\beta_n$, perch&eacute; $\\Delta=\\partial_x^2+\\partial_y^2$ agisce additivamente sui prodotti: &egrave; il fatto strutturale che $-\\Delta$ su un rettangolo &egrave; la somma di due operatori 1D commutanti, e le autofunzioni sono i prodotti. Sommare i numeri d'onda invece degli autovalori (le opzioni con $(m/a+n/b)^2$ e $(m+n)^2/ab$) &egrave; l'errore tipico e si smaschera col caso $a=b$, dove i due criteri danno risultati diversi gi&agrave; per $(m,n)=(1,2)$.","cont":"Scrivi i coefficienti"},{"t":"Con dato iniziale $u(0,x,y)=g(x,y)$, quanto vale $c_{mn}$?","opts":[{"x":"$c_{mn}=\\dfrac{4}{ab}\\displaystyle\\int_0^a\\!\\!\\int_0^b g(x,y)\\sin\\!\\Big(\\frac{m\\pi x}{a}\\Big)\\sin\\!\\Big(\\frac{n\\pi y}{b}\\Big)dy\\,dx$","c":true},{"x":"$c_{mn}=\\dfrac{2}{ab}\\displaystyle\\int_0^a\\!\\!\\int_0^b g\\,\\sin\\!\\Big(\\frac{m\\pi x}{a}\\Big)\\sin\\!\\Big(\\frac{n\\pi y}{b}\\Big)dy\\,dx$"},{"x":"$c_{mn}=\\dfrac{4}{\\pi^2}\\displaystyle\\int_0^a\\!\\!\\int_0^b g\\,\\sin\\!\\Big(\\frac{m\\pi x}{a}\\Big)\\sin\\!\\Big(\\frac{n\\pi y}{b}\\Big)dy\\,dx$"},{"x":"$c_{mn}=\\dfrac{4}{ab}\\displaystyle\\int_0^a\\!\\!\\int_0^b g\\,\\sin\\!\\Big(\\frac{m\\pi x}{a}\\Big)\\sin\\!\\Big(\\frac{n\\pi y}{b}\\Big)e^{-D\\lambda_{mn}t}\\,dy\\,dx$"}],"hint":"La normalizzazione &egrave; il prodotto delle due normalizzazioni 1D: $2/a$ per la prima variabile e $2/b$ per la seconda. E i coefficienti sono numeri, non funzioni del tempo.","sol":"Il sistema $\\{\\sin(m\\pi x/a)\\sin(n\\pi y/b)\\}$ &egrave; ortogonale e completo in $L^2$ del rettangolo, perch&eacute; prodotto tensoriale di due basi complete: $$\\int_0^a\\!\\!\\int_0^b\\varphi_{mn}\\varphi_{m'n'}\\,dx\\,dy=\\frac{a}{2}\\frac{b}{2}\\,\\delta_{mm'}\\delta_{nn'} .$$ Proiettando $g$ si isola $c_{mn}\\frac{ab}{4}$, da cui il fattore $4/(ab)$ — che &egrave; letteralmente $\\frac2a\\cdot\\frac2b$, il prodotto delle due normalizzazioni unidimensionali. La regola si generalizza: in $d$ dimensioni il fattore &egrave; $2^d/\\prod L_i$. Se $g$ &egrave; a variabili separate, $g=g_1(x)g_2(y)$, l'integrale doppio si fattorizza in due integrali semplici e $c_{mn}=c^{(1)}_mc^{(2)}_n$: &egrave; la scorciatoia che gli esercizi d'esame quasi sempre permettono. I coefficienti sono costanti: tutta la dipendenza temporale sta nel fattore $e^{-D\\lambda_{mn}t}$ della serie, non dentro l'integrale.","cont":"Chi governa il rilassamento"},{"t":"Se la piastra &egrave; molto allungata, $a\\gg b$, quale scala di tempo governa il raffreddamento?","opts":[{"x":"$\\tau=\\dfrac{1}{D\\lambda_{11}}=\\dfrac{1}{D\\pi^2\\big(\\tfrac{1}{a^2}+\\tfrac{1}{b^2}\\big)}\\;\\simeq\\;\\dfrac{b^2}{D\\pi^2}$: comanda la direzione <em>stretta</em>, perch&eacute; &egrave; quella con il numero d'onda pi&ugrave; grande","c":true},{"x":"$\\tau\\simeq a^2/(D\\pi^2)$: comanda la direzione lunga, perch&eacute; il calore deve percorrerla tutta"},{"x":"$\\tau\\simeq ab/(D\\pi^2)$, media geometrica delle due scale"},{"x":"Nessuna: in 2D il decadimento non &egrave; esponenziale"}],"hint":"Il modo che sopravvive pi&ugrave; a lungo &egrave; quello con $\\lambda$ pi&ugrave; <em>piccolo</em>. Guarda quale dei due addendi domina la somma $1/a^2+1/b^2$ quando $a\\gg b$.","sol":"A tempi lunghi sopravvive il modo fondamentale $(1,1)$, con $\\lambda_{11}=\\pi^2(a^{-2}+b^{-2})$. Se $a\\gg b$ il termine $1/a^2$ &egrave; trascurabile e $\\lambda_{11}\\simeq\\pi^2/b^2$, cio&egrave; $\\tau\\simeq b^2/(D\\pi^2)$: la piastra si raffredda nel tempo che il calore impiega ad attraversare la <em>dimensione minore</em>. Il principio generale &egrave; che nel calore i tassi si sommano e vince il pi&ugrave; veloce: aggiungere una direzione di fuga non pu&ograve; che accelerare il raffreddamento, mai rallentarlo, e infatti $\\lambda_{11}^{2D}>\\lambda_1^{1D}$ sempre. &Egrave; la ragione per cui una lamina sottile si raffredda con la legge della sua spessore e non della sua estensione, ed &egrave; anche la giustificazione delle approssimazioni 'lubrificazione' o 'shallow water', dove si assume che nella direzione stretta l'equilibrio sia raggiunto istantaneamente. Nota collegata: se $a/b$ &egrave; razionale compaiono autovalori <em>degeneri</em>, ad esempio con $a=b$ i modi $(1,2)$ e $(2,1)$ hanno lo stesso $\\lambda$, e ogni loro combinazione lineare &egrave; ancora un modo — la degenerazione &egrave; sempre l'ombra di una simmetria, qui lo scambio dei due lati."}]},{"pool":"edp","src":"mal-posizione &middot; calore all'indietro &middot; manuale","steps":[{"t":"Si assegna $u(T,x)$ e si vuole ricostruire $u(0,x)$ per l'equazione del calore su $[0,\\pi]$ con Dirichlet. In che senso il problema &egrave; mal posto?","opts":[{"x":"Viene meno la <em>dipendenza continua dai dati</em>: risolvere all'indietro significa moltiplicare il modo $n$ per $e^{+Dn^2T}$, quindi una perturbazione del dato di ampiezza $\\varepsilon$ sul modo $n$ produce un errore $\\varepsilon e^{Dn^2T}$, non limitato uniformemente in $n$","c":true},{"x":"Viene meno l'unicit&agrave;: due dati iniziali diversi possono produrre lo stesso $u(T,\\cdot)$"},{"x":"Viene meno la linearit&agrave;, perch&eacute; l'inversione dell'operatore non &egrave; lineare"},{"x":"Non &egrave; mal posto: basta cambiare $t\\to-t$ e si ottiene di nuovo l'equazione del calore"}],"hint":"Guarda che cosa diventa il fattore $e^{-Dn^2t}$ quando lo si inverte, e stima quanto vale per $n$ grande. Poi ricorda i tre requisiti di Hadamard.","sol":"I tre requisiti di Hadamard per un problema ben posto sono esistenza, unicit&agrave; e dipendenza continua dai dati. Qui l'unicit&agrave; c'&egrave; (se $u(T,\\cdot)$ coincide, coincidono tutti i coefficienti, e quindi anche a $t=0$), e la linearit&agrave; non &egrave; in discussione: l'operatore inverso &egrave; lineare, semplicemente non &egrave; <em>continuo</em>. Formalmente, $b_n(0)=b_n(T)e^{+Dn^2T}$, e l'operatore che manda $u(T,\\cdot)$ in $u(0,\\cdot)$ ha norma infinita: non esiste alcuna costante $C$ con $\\|u(0)\\|\\le C\\|u(T)\\|$. La sostituzione $t\\to-t$ non salva nulla, anzi lo dimostra: produce $\\partial_tu=-D\\partial_x^2u$, cio&egrave; un'equazione con diffusivit&agrave; negativa, l'archetipo dell'equazione instabile. Il contrasto con l'equazione delle onde &egrave; istruttivo: l&igrave; $t\\to-t$ lascia l'equazione invariata e il problema all'indietro &egrave; ben posto quanto quello in avanti, perch&eacute; i fattori temporali hanno modulo uno.","cont":"Quantifica"},{"t":"Con $D=1$, $T=1$ e un errore di misura $\\varepsilon=10^{-10}$ sul modo $n=10$ del dato finale, quale errore ne risulta sul dato iniziale ricostruito?","opts":[{"x":"Circa $10^{-10}\\,e^{100}\\approx3\\times10^{33}$: l'errore di misura, amplificato, seppellisce completamente il segnale","c":true},{"x":"Circa $10^{-10}\\cdot100=10^{-8}$: l'amplificazione &egrave; polinomiale e resta trascurabile"},{"x":"Circa $10^{-10}$: l'errore non viene amplificato perch&eacute; l'equazione &egrave; lineare"},{"x":"Circa $10^{-10}e^{10}\\approx2\\times10^{-6}$"}],"hint":"Il fattore di amplificazione &egrave; $e^{Dn^2T}$, e l'esponente contiene $n$ al <em>quadrato</em>.","sol":"Il fattore &egrave; $e^{Dn^2T}=e^{1\\cdot100\\cdot1}=e^{100}\\approx2{,}7\\times10^{43}$, quindi l'errore ricostruito vale $\\approx2{,}7\\times10^{33}$ (calcolato, non stimato a occhio: $e^{100}=10^{100/\\ln10}=10^{43{,}4}$). &Egrave; una cifra priva di senso fisico, e la lezione &egrave; che l'instabilit&agrave; del calore all'indietro non &egrave; una sottigliezza matematica: dieci modi di risoluzione spaziale bastano a rendere il problema numericamente impossibile in aritmetica a doppia precisione, che ha circa sedici cifre. Nella pratica il problema si affronta <em>regolarizzando</em>: si tronca lo spettro a un $n_{\\max}$ tale che $e^{Dn_{\\max}^2T}$ resti confrontabile col rapporto segnale-rumore, oppure si aggiunge un termine di penalit&agrave; alla Tikhonov che sacrifica fedelt&agrave; per stabilit&agrave;. &Egrave; l'apparato di tutti i <em>problemi inversi</em>: deblurring di immagini, tomografia, ricostruzione di sorgenti termiche.","cont":"E l'esistenza?"},{"t":"Oltre alla stabilit&agrave;, che cosa si perde se il dato finale $u(T,x)$ &egrave; una funzione soltanto continua, per esempio un profilo triangolare con una cuspide?","opts":[{"x":"Si perde anche l'<em>esiste
