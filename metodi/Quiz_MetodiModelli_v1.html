 ponendo $\\xi=x-ct$ e $h(t,x)=H(t,\\xi)$: $\\partial_th=H_t-cH_\\xi$, $\\partial_xh=H_\\xi$, $\\partial_x^2h=H_{\\xi\\xi}$, e l'equazione diventa $H_t-cH_\\xi=H_{\\xi\\xi}-H_\\xi$: scegliendo $c=1$ resta $H_t=H_{\\xi\\xi}$. Il segno &egrave; quello che dice il verso della deriva: il termine $-\\partial_xf$ trasporta verso <em>destra</em> con velocit&agrave; $+1$. La lettura fisica dei tre termini &egrave; diffusione, advezione, decadimento — l'equazione di un inquinante che diffonde in un fiume e nel frattempo si degrada.","cont":"Scrivi il propagatore"},{"t":"Qual &egrave; il propagatore ritardato $G(t,x)$ dell'operatore $\\partial_t-\\partial_x^2+\\partial_x+1$, cio&egrave; la soluzione con sorgente $\\delta(x)\\delta(t)$ e nulla per $t<0$?","opts":[{"x":"$G(t,x)=\\theta(t)\\,\\dfrac{e^{-t}}{\\sqrt{4\\pi t}}\\,e^{-(x-t)^2/(4t)}$","c":true},{"x":"$G(t,x)=\\theta(t)\\,\\dfrac{e^{-t}}{\\sqrt{4\\pi t}}\\,e^{-x^2/(4t)}$"},{"x":"$G(t,x)=\\theta(t)\\,\\dfrac{e^{-t}}{\\sqrt{4\\pi t}}\\,e^{-(x+t)^2/(4t)}$"},{"x":"$G(t,x)=\\theta(t)\\,\\dfrac{1}{\\sqrt{4\\pi t}}\\,e^{-(x-t)^2/(4t)}$"}],"hint":"Tre ingredienti, uno per termine dell'operatore: la gaussiana per la diffusione, lo spostamento del centro per l'advezione, il fattore esponenziale globale per il decadimento.","sol":"Nel riferimento mobile e con la sostituzione esponenziale il problema &egrave; il calore puro con $D=1$, il cui nucleo &egrave; $\\frac{1}{\\sqrt{4\\pi t}}e^{-\\xi^2/(4t)}$; tornando indietro, $\\xi=x-t$ e il fattore $e^{-t}$: $$G(t,x)=\\theta(t)\\,\\frac{e^{-t}}{\\sqrt{4\\pi t}}\\,e^{-(x-t)^2/(4t)} .$$ Il centro del pacchetto &egrave; in $x=t$, non in $x=0$ n&eacute; in $x=-t$: la deriva &egrave; verso destra, come si &egrave; visto dal segno di $c$. Verifica in Fourier, che &egrave; il modo pi&ugrave; rapido per convincersene: $\\partial_t\\hat f=-(k^2+ik+1)\\hat f$ d&agrave; $\\hat G=\\theta(t)e^{-k^2t}e^{-ikt}e^{-t}$, e il fattore $e^{-ikt}$ &egrave; per il teorema di traslazione lo spostamento $x\\to x-t$. Il fattore $e^{-t}$ dice che la massa totale non si conserva: $\\int G\\,dx=e^{-t}$.","cont":"Componi la soluzione"},{"t":"Qual &egrave; allora $f(t,x)$?","opts":[{"x":"$f(t,x)=\\theta(t-3)\\,\\dfrac{3\\,e^{-(t-3)}}{\\sqrt{4\\pi(t-3)}}\\,\\exp\\!\\Big[-\\dfrac{(x-t+3)^2}{4(t-3)}\\Big]$","c":true},{"x":"$f(t,x)=\\theta(t-3)\\,\\dfrac{e^{-(t-3)}}{\\sqrt{4\\pi(t-3)}}\\,\\exp\\!\\Big[-\\dfrac{(x-t+3)^2}{4(t-3)}\\Big]$"},{"x":"$f(t,x)=\\theta(t)\\,\\dfrac{3\\,e^{-t}}{\\sqrt{4\\pi t}}\\,\\exp\\!\\Big[-\\dfrac{(x-t)^2}{4t}\\Big]$"},{"x":"$f(t,x)=\\theta(t+\\tfrac12)\\,\\dfrac{3\\,e^{-(t+1/2)}}{\\sqrt{4\\pi(t+\\tfrac12)}}\\,\\exp\\!\\Big[-\\dfrac{(x-t-\\tfrac12)^2}{4(t+\\tfrac12)}\\Big]$"},{"x":"$f(t,x)=3\\,\\theta(t-3)\\,\\dfrac{e^{-(t-3)}}{\\sqrt{4\\pi(t-3)}}\\,\\exp\\!\\Big[-\\dfrac{(x-t-3)^2}{4(t-3)}\\Big]$"}],"hint":"L'invarianza per traslazioni temporali dice che l'unica cosa che conta &egrave; il tempo trascorso dall'accensione. E il peso della sorgente non &egrave; 1.","sol":"L'operatore ha coefficienti costanti, quindi &egrave; invariante per traslazione in $t$ e in $x$: una sorgente $3\\,\\delta(x)\\delta(t-3)$ produce $3\\,G(t-3,x)$, cio&egrave; $$f(t,x)=\\theta(t-3)\\,\\frac{3\\,e^{-(t-3)}}{\\sqrt{4\\pi(t-3)}}\\exp\\!\\Big[-\\frac{(x-t+3)^2}{4(t-3)}\\Big].$$ La costante dell'omogenea &egrave; nulla perch&eacute; il dato $f(-\\tfrac12,x)=0$ &egrave; assegnato <em>prima</em> dell'accensione, in $t=-1/2<3$: prima dell'impulso non succede nulla, ed &egrave; il significato del $\\theta(t-3)$. Il centro si trova in $x=t-3$, cio&egrave; parte da $x=0$ all'accensione e deriva a destra con velocit&agrave; 1: l'argomento della gaussiana &egrave; $x-(t-3)=x-t+3$. La stampa ufficiale scrive lo stesso risultato nella forma $3\\theta(t-3)e^{-(t-3)}e^{-[x-t+3]^2/4(t-3)}/\\big(\\sqrt{2\\pi}\\sqrt{2(t-3)}\\big)$: coincide, perch&eacute; $\\sqrt{2\\pi}\\sqrt{2(t-3)}=\\sqrt{4\\pi(t-3)}$.","cont":"Il controllo che smaschera il fattore 3"},{"t":"Quale controllo mostra immediatamente se il fattore 3 &egrave; stato perso?","opts":[{"x":"Integrare l'equazione in $x$: la massa $M(t)=\\int f\\,dx$ obbedisce a $\\dot M=-M+3\\delta(t-3)$, quindi salta esattamente di 3 all'accensione e poi vale $M(t)=3e^{-(t-3)}$","c":true},{"x":"Il limite $t\\to+\\infty$, che deve dare 3"},{"x":"La verifica che $f\\to0$ per $|x|\\to\\infty$"},{"x":"La verifica dimensionale dell'esponente $(x-t+3)^2/[4(t-3)]$"}],"hint":"C'&egrave; una quantit&agrave; scalare che si legge dalla soluzione e si calcola indipendentemente dall'equazione: confrontale.","sol":"Integrando l'equazione su tutto $x$, i termini $\\int\\partial_x^2f$ e $\\int\\partial_xf$ si annullano perch&eacute; $f$ e $\\partial_xf$ svaniscono a $\\pm\\infty$, e $\\int\\delta(x)dx=1$: resta $\\dot M=-M+3\\delta(t-3)$. Dunque $M$ &egrave; nulla fino a $t=3$, salta di $3$ e poi decade: $M(t)=3\\,\\theta(t-3)e^{-(t-3)}$. Dalla soluzione trovata si ottiene lo stesso, perch&eacute; la gaussiana &egrave; normalizzata a $1$ e resta il prefattore $3e^{-(t-3)}$: torna. Se avessi perso il fattore 3 troveresti $M=e^{-(t-3)}$ contro il salto di ampiezza $3$ imposto dalla sorgente, e lo scarto sarebbe evidente senza rifare un solo integrale. Il limite $t\\to\\infty$ non serve (tutto tende a zero per il decadimento) e la verifica delle BC nemmeno, perch&eacute; il fattore moltiplicativo non le tocca."}]},{"pool":"edp","src":"20250623 Es.4","steps":[{"t":"Appello 23/06/2025. $\\partial_tu-\\sin t\\,\\partial_x^2u+u=0$ per $x>0$, con $u(0,x)=e^{-x}$ e $\\partial_xu|_{x=0}=0$. Come si tratta la semiretta?","opts":[{"x":"Si estende il problema a tutta la retta per <em>parit&agrave;</em>, $u(t,-x)=u(t,x)$: il dato diventa $e^{-|x|}$ e la condizione di Neumann in $0$ risulta automaticamente soddisfatta","c":true},{"x":"Si estende per <em>disparit&agrave;</em>, $u(t,-x)=-u(t,x)$: il dato diventa $\\mathrm{sgn}(x)\\,e^{-|x|}$"},{"x":"Si separa e si usano le autofunzioni $\\sin(nx)$ con $n$ intero"},{"x":"Non si estende: sulla semiretta l'unico strumento &egrave; la trasformata di Laplace in $x$"}],"hint":"Quale delle due estensioni ha derivata nulla in $x=0$? E quale sarebbe comunque incompatibile col dato, che in $x=0$ vale $1$?","sol":"L'estensione pari di una funzione regolare ha derivata dispari, e una funzione dispari continua si annulla in $0$: dunque la parit&agrave; <em>impone</em> $\\partial_xu(t,0)=0$, cio&egrave; esattamente la condizione di Neumann. L'estensione dispari imporrebbe invece $u(t,0)=0$, cio&egrave; Dirichlet, incompatibile con $e^{-x}\\big|_{x=0}=1$ e per di pi&ugrave; discontinua nell'origine. La regola generale sulla semiretta &egrave; il gemello di quella sull'intervallo: Neumann in $0$ $\\to$ estensione pari $\\to$ trasformata coseno; Dirichlet in $0$ $\\to$ estensione dispari $\\to$ trasformata seno. L'equazione &egrave; invariante sotto $x\\to-x$ (contiene solo $\\partial_x^2$), il che &egrave; ci&ograve; che rende lecita l'estensione: con un termine $\\partial_xu$ non lo sarebbe.","cont":"Trasforma in Fourier"},{"t":"Trasformando in Fourier rispetto a $x$, quale ODE resta?","opts":[{"x":"$\\partial_t\\hat u(t,k)=-\\big(1+k^2\\sin t\\big)\\hat u(t,k)$","c":true},{"x":"$\\partial_t\\hat u=-\\big(1-k^2\\sin t\\big)\\hat u$"},{"x":"$\\partial_t\\hat u=-\\big(1+k^2\\big)\\sin t\\;\\hat u$"},{"x":"$\\partial_t\\hat u=-\\big(1+ik\\sin t\\big)\\hat u$"}],"hint":"$\\widehat{\\partial_x^2u}=-k^2\\hat u$, e nell'equazione quel termine compare gi&agrave; con un segno meno davanti: i due segni si compongono.","sol":"L'equazione &egrave; $\\partial_tu=\\sin t\\,\\partial_x^2u-u$. Con $\\widehat{\\partial_x^2u}=-k^2\\hat u$ si ottiene $\\partial_t\\hat u=-k^2\\sin t\\,\\hat u-\\hat u=-(1+k^2\\sin t)\\hat u$. La trasformata converte l'operatore differenziale in un moltiplicatore, e la PDE in una ODE del primo ordine in cui $k$ &egrave; un semplice parametro: &egrave; il vantaggio strutturale del dominio illimitato con coefficienti indipendenti da $x$. Il doppio segno meno &egrave; il punto in cui si sbaglia: $-\\sin t\\,\\partial_x^2\\to+k^2\\sin t$ dentro la parentesi.","cont":"Integra nel tempo"},{"t":"Integrando quella ODE con dato $\\hat u(0,k)$:","opts":[{"x":"$\\hat u(t,k)=\\hat u(0,k)\\,e^{-t-(1-\\cos t)\\,k^2}$","c":true},{"x":"$\\hat u(t,k)=\\hat u(0,k)\\,e^{-t-k^2\\sin t}$"},{"x":"$\\hat u(t,k)=\\hat u(0,k)\\,e^{-t(1+k^2)}$"},{"x":"$\\hat u(t,k)=\\hat u(0,k)\\,e^{-t+(1-\\cos t)k^2}$"}],"hint":"&Egrave; di nuovo l'integrale $\\int_0^t a(s)\\,ds$ del coefficiente dipendente dal tempo, con $a(s)=\\sin s$.","sol":"$\\ln\\frac{\\hat u(t,k)}{\\hat u(0,k)}=-\\int_0^t\\!\\big(1+k^2\\sin s\\big)ds=-t-k^2\\big(1-\\cos t\\big)$, da cui la tesi. Il pezzo $-t$ &egrave; il decadimento uniforme di tutti i modi (viene dal termine $+u$ nell'equazione), il pezzo $-k^2(1-\\cos t)$ &egrave; la diffusione con intensit&agrave; modulata. Si ritrova la struttura gi&agrave; incontrata: con coefficiente $a(t)$ l'esponente diffusivo &egrave; $-k^2\\int_0^ta$, ed &egrave; non monotono quando $a$ cambia segno. Nei tratti in cui $\\sin t<0$ i modi alti ricrescono, ma $1-\\cos t\\ge0$ garantisce che non superino mai il valore iniziale.","cont":"Trasforma il dato"},{"t":"Quanto vale $\\hat u(0,k)=\\int_{-\\infty}^{+\\infty}e^{-|x|}e^{-ikx}dx$?","opts":[{"x":"$\\dfrac{2}{1+k^2}$","c":true},{"x":"$\\dfrac{1}{1+k^2}$"},{"x":"$\\dfrac{1}{1+ik}$"},{"x":"$\\dfrac{2}{(1+k^2)^2}$"}],"hint":"Spezza in $(-\\infty,0]$ e $[0,+\\infty)$ e somma i due esponenziali; poi controlla ponendo $k=0$.","sol":"$\\int_{-\\infty}^{0}e^{(1-ik)x}dx+\\int_{0}^{+\\infty}e^{-(1+ik)x}dx=\\frac{1}{1-ik}+\\frac{1}{1+ik}=\\frac{2}{1+k^2}$. Controllo istantaneo: in $k=0$ la trasformata deve valere $\\int e^{-|x|}dx=2$, e infatti $2/(1+0)=2$. La coppia $e^{-|x|}\\leftrightarrow$ lorentziana $2/(1+k^2)$ &egrave; da avere in memoria: &egrave; la stessa che compare nella funzione d'onda dello stato fondamentale idrogenoide, e la sua reciproca (lorentziana in $x$, esponenziale in $k$) &egrave; il propagatore di Yukawa in una dimensione. Il fatto che la trasformata sia reale e pari discende dal dato reale e pari, come dev'essere per una estensione fatta bene.","cont":"Antitrasforma"},{"t":"Qual &egrave; la soluzione finale, che il testo ammette di poter lasciare in forma integrale?","opts":[{"x":"$u(t,x)=\\dfrac{2e^{-t}}{\\pi}\\displaystyle\\int_0^{\\infty}\\!dk\\;\\dfrac{e^{-(1-\\cos t)k^2}}{1+k^2}\\cos(kx)$","c":true},{"x":"$u(t,x)=\\dfrac{e^{-t}}{\\pi}\\displaystyle\\int_0^{\\infty}\\!dk\\;\\dfrac{e^{-(1-\\cos t)k^2}}{1+k^2}\\cos(kx)$"},{"x":"$u(t,x)=\\dfrac{2e^{-t}}{\\pi}\\displaystyle\\int_{-\\infty}^{+\\infty}\\!dk\\;\\dfrac{e^{-(1-\\cos t)k^2}}{1+k^2}\\cos(kx)$"},{"x":"$u(t,x)=\\dfrac{e^{-t}}{2\\pi}\\displaystyle\\int_0^{\\infty}\\!dk\\;\\dfrac{e^{-(1-\\cos t)k^2}}{1+k^2}e^{ikx}$"}],"hint":"L'integrando &egrave; pari in $k$: sostituisci $e^{ikx}$ con $\\cos(kx)$ e dimezza il dominio raddoppiando. Poi controlla il caso $t=0$.","sol":"Antitrasformando, $u=\\int\\frac{dk}{2\\pi}\\hat u\\,e^{ikx}$ con $\\hat u=\\frac{2e^{-t}}{1+k^2}e^{-(1-\\cos t)k^2}$. L'integrando &egrave; pari in $k$, quindi la parte in $\\sin(kx)$ si cancella e $\\int_{-\\infty}^{+\\infty}=2\\int_0^{+\\infty}$: $$u=\\frac{1}{2\\pi}\\cdot 2\\cdot 2e^{-t}\\int_0^{\\infty}\\frac{e^{-(1-\\cos t)k^2}}{1+k^2}\\cos(kx)\\,dk=\\frac{2e^{-t}}{\\pi}\\int_0^{\\infty}\\frac{e^{-(1-\\cos t)k^2}}{1+k^2}\\cos(kx)\\,dk,$$ in accordo con la stampa ufficiale. Verifica in $t=0$, che &egrave; il controllo decisivo: resta $\\frac{2}{\\pi}\\int_0^{\\infty}\\frac{\\cos(kx)}{1+k^2}dk$, integrale noto (si fa per residui chiudendo nel semipiano superiore sul polo $k=i$) che vale $\\frac{\\pi}{2}e^{-|x|}$; il prodotto d&agrave; $e^{-|x|}$, cio&egrave; proprio il dato esteso. Notare infine che nessuna primitiva elementare esiste per $t>0$: il testo lo dice esplicitamente, ed &egrave; una licenza da usare — portare il conto fino all'integrale unidimensionale &egrave; la risposta completa."}]},{"pool":"edp","src":"trabocchetto ricorrente — scaling della delta","steps":[{"t":"In sorgenti di PDE compaiono, in appelli diversi, le scritture $\\delta\\!\\big(\\tfrac t3-1\\big)$, $\\delta(2t-4)$ e $\\delta(t^2-4)$ con $t\\ge0$. Quale terna di riscritture &egrave; corretta?","opts":[{"x":"$3\\delta(t-3)$;  $\\tfrac12\\delta(t-2)$;  $\\tfrac14\\delta(t-2)$","c":true},{"x":"$\\tfrac13\\delta(t-3)$;  $2\\delta(t-2)$;  $4\\delta(t-2)$"},{"x":"$3\\delta(t-3)$;  $2\\delta(t-2)$;  $\\tfrac14\\delta(t-2)$"},{"x":"$3\\delta(t-1)$;  $\\tfrac12\\delta(t-4)$;  $\\tfrac14\\delta(t-4)$"},{"x":"$3\\delta(t-3)$;  $\\tfrac12\\delta(t-2)$;  $\\tfrac14\\big[\\delta(t-2)+\\delta(t+2)\\big]$"}],"hint":"Il coefficiente &egrave; l'<em>inverso</em> del modulo della derivata, non la derivata. E nell'ultimo caso conta quali zeri cadono davvero nel dominio.","sol":"Regola invocata: $\\delta(g(t))=\\sum_i\\frac{\\delta(t-t_i)}{|g'(t_i)|}$, somma sugli zeri <em>semplici</em> di $g$ (se $g'(t_i)=0$ la composizione non &egrave; definita come distribuzione in questo modo). Caso per caso: $g=t/3-1$ ha zero in $3$ e $|g'|=1/3$, quindi $3\\delta(t-3)$; $g=2t-4$ ha zero in $2$ e $|g'|=2$, quindi $\\tfrac12\\delta(t-2)$; $g=t^2-4$ ha zeri in $\\pm2$ con $|g'(\\pm2)|=4$, ma il dominio &egrave; $t\\ge0$ e sopravvive solo $\\tfrac14\\delta(t-2)$. Verifica indipendente sul primo, che &egrave; il pi&ugrave; insidioso perch&eacute; il fattore &egrave; maggiore di uno: $\\int\\delta(t/3-1)dt=3$ per sostituzione diretta. Il modo di ricordare il verso: comprimere l'argomento (moltiplicarlo per un numero grande) <em>stringe</em> il picco e quindi ne riduce il peso; dilatarlo (dividerlo per 3) allarga e quindi aumenta il peso."}]},{"pool":"edp","src":"teoria — onde su dominio illimitato, cap. 20","steps":[{"t":"Onde su tutta la retta, $\\partial_t^2y=c^2\\partial_x^2y$ con $y(x,0)=f(x)$ e $\\partial_ty(x,0)=g(x)$. Qual &egrave; la formula di d'Alembert?","opts":[{"x":"$y=\\tfrac12\\big[f(x-ct)+f(x+ct)\\big]+\\dfrac{1}{2c}\\displaystyle\\int_{x-ct}^{x+ct}\\!g(s)\\,ds$","c":true},{"x":"$y=\\tfrac12\\big[f(x-ct)+f(x+ct)\\big]+\\tfrac12\\displaystyle\\int_{x-ct}^{x+ct}\\!g(s)\\,ds$"},{"x":"$y=f(x-ct)+f(x+ct)+\\dfrac{1}{2c}\\displaystyle\\int_{x-ct}^{x+ct}\\!g(s)\\,ds$"},{"x":"$y=\\tfrac12\\big[f(x-ct)-f(x+ct)\\big]+\\dfrac{1}{2c}\\displaystyle\\int_{x-ct}^{x+ct}\\!g(s)\\,ds$"}],"hint":"Verifica i due dati iniziali sulla formula candidata: a $t=0$ deve dare $f$, e la sua derivata temporale a $t=0$ deve dare $g$. Il $1/(2c)$ esce proprio da l&igrave;.","sol":"La generale dell'equazione delle onde &egrave; $y=F(x-ct)+G(x+ct)$ (si vede fattorizzando l'operatore come $(\\partial_t-c\\partial_x)(\\partial_t+c\\partial_x)$). Imponendo i dati: $F+G=f$ e $-cF'+cG'=g$, da cui $G-F=\\frac1c\\int^xg+\\mathrm{cost}$; risolvendo si ottiene la formula. Verifica: a $t=0$ i due argomenti coincidono e l'integrale &egrave; vuoto, quindi $y=f$; derivando in $t$, $\\partial_ty=\\frac c2[-f'(x-ct)+f'(x+ct)]+\\frac{1}{2c}\\cdot c\\,[g(x+ct)+g(x-ct)]$, che a $t=0$ vale $g(x)$ — ed &egrave; il fattore $1/(2c)$ a farlo tornare. Lettura strutturale: $y(x,t)$ dipende solo dal segmento $[x-ct,\\,x+ct]$, il <em>dominio di dipendenza</em>, ed &egrave; l'espressione matematica della causalit&agrave; a velocit&agrave; finita.","cont":"Confronta col calore"},{"t":"Qual &egrave; la differenza strutturale fra la formula di d'Alembert e il nucleo del calore?","opts":[{"x":"d'Alembert ha dominio di dipendenza <em>finito</em> $[x-ct,x+ct]$ e non regolarizza (una cuspide nel dato resta cuspide); il nucleo del calore &egrave; strettamente positivo ovunque, quindi il dominio di dipendenza &egrave; tutta la retta e la soluzione &egrave; $C^\\infty$ per ogni $t>0$","c":true},{"x":"Sono equivalenti: entrambe sono convoluzioni con un nucleo, solo con nuclei diversi"},{"x":"d'Alembert vale solo per dati a supporto compatto, il nucleo del calore per dati qualunque"},{"x":"Il nucleo del calore ha dominio di dipendenza finito, quello delle onde infinito"}],"hint":"Guarda dove i due nuclei si annullano. Uno &egrave; supportato su un segmento, l'altro non si annulla mai.","sol":"Il nucleo del calore $\\frac{1}{\\sqrt{4\\pi Dt}}e^{-(x-y)^2/4Dt}$ &egrave; positivo per ogni $y$: un dato a supporto compatto produce, un istante dopo, una soluzione non nulla ovunque. La velocit&agrave; di propagazione &egrave; dunque infinita, e l'equazione del calore &egrave; incompatibile con la relativit&agrave; (&egrave; il difetto che l'equazione dei telegrafisti corregge). In compenso il nucleo &egrave; analitico e la convoluzione regolarizza istantaneamente qualunque dato $L^1$. Per le onde &egrave; l'opposto: il supporto &egrave; il cono di luce, le singolarit&agrave; del dato viaggiano intatte lungo le caratteristiche $x\\pm ct=\\mathrm{cost}$, e non c'&egrave; alcuna regolarizzazione. Terza differenza, che &egrave; la pi&ugrave; profonda: le onde sono reversibili ($t\\to-t$ lascia l'equazione invariata e il problema resta ben posto), il calore no — il calore all'indietro amplifica i modi alti come $e^{+Dk^2|t|}$ e viola la dipendenza continua dai dati."}]},{"pool":"edp","src":"teoria — Sturm-Liouville, BC miste","steps":[{"t":"$\\partial_tu=D\\partial_x^2u$ su $[0,L]$ con $u(t,0)=0$ (estremo a temperatura fissa) e $\\partial_xu(t,L)=0$ (estremo isolato). Quali sono le autofunzioni?","opts":[{"x":"$\\sin\\!\\Big[\\dfrac{(2m+1)\\pi x}{2L}\\Big]$ con $m\\ge0$, e $\\lambda_m=-\\Big[\\dfrac{(2m+1)\\pi}{2L}\\Big]^2$","c":true},{"x":"$\\sin\\!\\big(\\tfrac{m\\pi x}{L}\\big)$ con $m\\ge1$"},{"x":"$\\cos\\!\\Big[\\dfrac{(2m+1)\\pi x}{2L}\\Big]$ con $m\\ge0$"},{"x":"$\\sin\\!\\Big[\\dfrac{(2m+1)\\pi x}{L}\\Big]$ con $m\\ge0$"}],"hint":"La prima condizione sceglie la famiglia, la seconda quantizza. Imponi $\\psi'(L)=0$ su $\\sin(kx)$ e guarda dove si annulla il coseno.","sol":"$\\psi(0)=0$ elimina il coseno e lascia $\\psi=\\sin(kx)$; poi $\\psi'(L)=k\\cos(kL)=0$ richiede $kL=\\frac\\pi2+m\\pi$, cio&egrave; $k_m=\\frac{(2m+1)\\pi}{2L}$: da qui gli <em>indici semi-interi</em>, firma inconfondibile delle BC miste. Verifica sul modo fondamentale $m=0$: $\\sin\\!\\big(\\frac{\\pi x}{2L}\\big)$ si annulla in $x=0$ e ha derivata $\\frac{\\pi}{2L}\\cos\\!\\big(\\frac{\\pi}{2}\\big)=0$ in $x=L$. Il quadro completo delle quattro BC: Dirichlet-Dirichlet $\\to\\sin(m\\pi x/L)$, $m\\ge1$; Neumann-Neumann $\\to\\cos(m\\pi x/L)$, $m\\ge0$; miste $\\to$ semi-interi; periodiche $\\to$ seni e coseni insieme, con degenerazione doppia.","cont":"Conseguenza sul modo fondamentale"},{"t":"Rispetto al caso Dirichlet-Dirichlet sullo stesso intervallo, il modo fondamentale:","opts":[{"x":"Ha lunghezza d'onda $4L$ invece di $2L$, e tempo di rilassamento quattro volte pi&ugrave; lungo: $\\tau_0=4L^2/(D\\pi^2)$ invece di $L^2/(D\\pi^2)$","c":true},{"x":"&Egrave; identico: le BC cambiano le autofunzioni ma non il fondamentale"},{"x":"Ha lunghezza d'onda $L$ invece di $2L$, e rilassa quattro volte pi&ugrave; in fretta"},{"x":"Ha la stessa lunghezza d'onda ma tempo di rilassamento doppio"}],"hint":"$\\lambda=2\\pi/k$ e $\\tau=1/(Dk^2)$: il rapporto fra i due tempi &egrave; il quadrato del rapporto fra i due $k$.","sol":"Dirichlet-Dirichlet: $k_0=\\pi/L$, lunghezza d'onda $2\\pi/k_0=2L$, $\\tau_0=1/(Dk_0^2)=L^2/(D\\pi^2)$. Misto: $k_0=\\pi/(2L)$, lunghezza d'onda $4L$, $\\tau_0=4L^2/(D\\pi^2)$. Il fattore 4 &egrave; il quadrato del fattore 2 fra i numeri d'onda, perch&eacute; nel calore il tasso va come $k^2$. Il fatto fisico &egrave; che nella sbarra mista il calore pu&ograve; uscire da un solo estremo, quindi ci mette pi&ugrave; tempo a spegnersi. C'&egrave; un analogo acustico esatto e vale la pena tenerlo in mente per l'orale: una canna d'organo chiusa a un'estremit&agrave; (BC miste) suona un'ottava sotto la canna aperta della stessa lunghezza (BC uguali ai due capi), ed &egrave; lo stesso raddoppio della lunghezza d'onda fondamentale. Un identico raddoppio compare nella buca di potenziale con una parete infinita e una condizione di derivata nulla."}]},{"pool":"edp","src":"metodo — riduzione a BC omogenee","steps":[{"t":"$\\partial_tu=D\\partial_x^2u$ su $[0,L]$ con $u(t,0)=T_1$ e $u(t,L)=T_2$ costanti non entrambe nulle. Perch&eacute; la separazione diretta fallisce, e come si rimedia?","opts":[{"x":"Fallisce perch&eacute; con BC non omogenee le combinazioni lineari di soluzioni non soddisfano pi&ugrave; le BC, e l'insieme delle soluzioni non &egrave; uno spazio vettoriale. Si sottrae la stazionaria $u_s(x)=T_1+(T_2-T_1)\\frac{x}{L}$: allora $w=u-u_s$ risolve la stessa equazione con BC omogenee","c":true},{"x":"Fallisce perch&eacute; l'equazione diventa non lineare; si linearizza attorno a $T_1$"},{"x":"Non fallisce affatto: basta separare e imporre le BC modo per modo"},{"x":"Fallisce perch&eacute; lo spettro diventa continuo; si passa alla trasformata di Fourier"}],"hint":"Il punto &egrave; la struttura algebrica, non la difficolt&agrave; del conto: due soluzioni che valgono $T_1$ al bordo, sommate, valgono $2T_1$.","sol":"La separazione produce soluzioni della forma $\\varphi\\psi$ e poi le somma: il passaggio &egrave; lecito solo se l'insieme delle funzioni che soddisfano le BC &egrave; chiuso per combinazioni lineari, il che accade se e solo se le BC sono <em>omogenee</em>. Con $u(t,0)=T_1\\ne0$ non lo &egrave;. Il rimedio standard: si cerca la soluzione stazionaria, cio&egrave; $u_s''=0$ con $u_s(0)=T_1$ e $u_s(L)=T_2$, che &egrave; il profilo lineare $u_s(x)=T_1+(T_2-T_1)x/L$; poi $w=u-u_s$ soddisfa $\\partial_tw=D\\partial_x^2w$ (perch&eacute; $\\partial_tu_s=0$ e $\\partial_x^2u_s=0$) con $w(t,0)=w(t,L)=0$, e su $w$ la separazione &egrave; legittima. Il dato iniziale si trasferisce: $w(0,x)=g(x)-u_s(x)$. Lo stesso trucco copre le BC non omogenee <em>dipendenti dal tempo</em>, ma allora $u_s$ dipende da $t$ e nell'equazione per $w$ compare una sorgente $-\\partial_tu_s$, che si tratta con Duhamel.","cont":"Fai il conto"},{"t":"Con $T_1=0$, $T_2=T$ e $u(0,x)=0$ (sbarra fredda, estremo destro portato di colpo a $T$), qual &egrave; la soluzione?","opts":[{"x":"$u(t,x)=\\dfrac{Tx}{L}+\\displaystyle\\sum_{n\\ge1}\\frac{2T(-1)^n}{n\\pi}\\,e^{-Dn^2\\pi^2t/L^2}\\sin\\!\\Big(\\frac{n\\pi x}{L}\\Big)$","c":true},{"x":"$u(t,x)=\\dfrac{Tx}{L}+\\displaystyle\\sum_{n\\ge1}\\frac{2T(-1)^{n+1}}{n\\pi}\\,e^{-Dn^2\\pi^2t/L^2}\\sin\\!\\Big(\\frac{n\\pi x}{L}\\Big)$"},{"x":"$u(t,x)=\\displaystyle\\sum_{n\\ge1}\\frac{2T(-1)^n}{n\\pi}\\,e^{-Dn^2\\pi^2t/L^2}\\sin\\!\\Big(\\frac{n\\pi x}{L}\\Big)$, senza termine stazionario"},{"x":"$u(t,x)=\\dfrac{Tx}{L}\\Big(1-e^{-D\\pi^2t/L^2}\\Big)$"}],"hint":"Il segno dei coefficienti si controlla verificando che a $t=0$ la somma cancelli esattamente il profilo lineare. Serve la serie notevole di $x$ sui seni.","sol":"Qui $u_s=Tx/L$ e $w(0,x)=-Tx/L$, da cui $$b_n=\\frac2L\\int_0^L\\!\\Big(-\\frac{Tx}{L}\\Big)\\sin\\!\\Big(\\frac{n\\pi x}{L}\\Big)dx .$$ Con $\\int_0^Lx\\sin(n\\pi x/L)dx=-\\frac{L^2(-1)^n}{n\\pi}$ (una integrazione per parti; il termine in $\\sin(n\\pi)$ &egrave; nullo) si ottiene $b_n=\\frac{2T(-1)^n}{n\\pi}$, e il modo $n$ decade con $e^{-D(n\\pi/L)^2t}$. Verifica del segno a $t=0$: si usa la serie notevole $\\sum_{n\\ge1}\\frac{(-1)^{n+1}}{n}\\sin\\!\\big(\\frac{n\\pi x}{L}\\big)=\\frac{\\pi x}{2L}$ per $0<x<L$, quindi $\\sum_n\\frac{2T(-1)^n}{n\\pi}\\sin(\\cdot)=-\\frac{2T}{\\pi}\\cdot\\frac{\\pi x}{2L}=-\\frac{Tx}{L}$, che cancella esattamente il termine stazionario e d&agrave; $u(0,x)=0$: torna. Col segno opposto si otterrebbe $2Tx/L$, assurdo. Per $t\\to\\infty$ resta il profilo lineare $Tx/L$: &egrave; il regime stazionario, e il tempo per raggiungerlo &egrave; governato dal modo pi&ugrave; lento, $\\tau_1=L^2/(D\\pi^2)$."}]},{"pool":"edp","src":"variante di 20262001 Es.4","steps":[{"t":"Stessa corda dell'appello 20/01/2026 (estremi fissi, lunghezza $L$), ma con i dati scambiati: $y(x,0)=f(x)$ e $\\partial_ty|_{t=0}=0$ — corda pizzicata e lasciata andare. Quale forma prende la soluzione?","opts":[{"x":"$y=\\displaystyle\\sum_{n\\ge1}a_n\\cos\\!\\Big(\\frac{n\\pi ct}{L}\\Big)\\sin\\!\\Big(\\frac{n\\pi x}{L}\\Big)$ con $a_n=\\frac2L\\int_0^L\\!f(x)\\sin\\!\\Big(\\frac{n\\pi x}{L}\\Big)dx$","c":true},{"x":"$y=\\displaystyle\\sum_{n\\ge1}b_n\\sin\\!\\Big(\\frac{n\\pi ct}{L}\\Big)\\sin\\!\\Big(\\frac{n\\pi x}{L}\\Big)$ con $b_n\\frac{n\\pi c}{L}=\\frac2L\\int_0^L\\!f\\sin$"},{"x":"$y=\\displaystyle\\sum_{n\\ge1}a_n\\cos\\!\\Big(\\frac{n\\pi ct}{L}\\Big)\\cos\\!\\Big(\\frac{n\\pi x}{L}\\Big)$"},{"x":"$y=\\displaystyle\\sum_{n\\ge1}a_n\\,e^{-n\\pi ct/L}\\sin\\!\\Big(\\frac{n\\pi x}{L}\\Big)$"}],"hint":"Le BC non sono cambiate, quindi la famiglia spaziale &egrave; la stessa: cambia solo quale delle due funzioni temporali sopravvive, e quale integrale d&agrave; i coefficienti.","sol":"Le condizioni al bordo sono identiche, quindi la base spaziale resta $\\sin(n\\pi x/L)$. Nella parte temporale, $\\partial_ty|_{t=0}=\\sum_n b_n\\omega_n\\sin(n\\pi x/L)=0$ impone ora $b_n=0$: sopravvivono i coseni. I coefficienti si leggono direttamente dalla posizione iniziale, senza dividere per $\\omega_n$ — ed &egrave; la differenza pratica pi&ugrave; importante rispetto al caso del dato di velocit&agrave;: l&igrave; la potenza di $n$ al denominatore sale di uno, qui no. Regola generale: <em>il dato di posizione va sui coseni temporali e non si divide per $\\omega_n$; il dato di velocit&agrave; va sui seni temporali e si divide per $\\omega_n$</em>. Se il testo d&agrave; entrambi i dati non nulli, si sommano i due contributi, perch&eacute; l'equazione &egrave; lineare.","cont":"Il ponte con d'Alembert"},{"t":"La stessa soluzione si riscrive come somma di due onde progressive. Come?","opts":[{"x":"$y=\\tfrac12\\big[\\tilde f(x-ct)+\\tilde f(x+ct)\\big]$, dove $\\tilde f$ &egrave; il prolungamento <em>dispari</em> e $2L$-periodico di $f$","c":true},{"x":"$y=\\tfrac12\\big[\\tilde f(x-ct)+\\tilde f(x+ct)\\big]$, dove $\\tilde f$ &egrave; il prolungamento <em>pari</em> e $2L$-periodico di $f$"},{"x":"$y=\\tilde f(x-ct)+\\tilde f(x+ct)$, con $\\tilde f$ dispari e $2L$-periodico"},{"x":"Non si riscrive: su dominio limitato d'Alembert non vale"}],"hint":"Applica la formula di prostaferesi $\\cos A\\,\\sin B=\\tfrac12[\\sin(B+A)+\\sin(B-A)]$ a ogni termine della serie e guarda che cosa resta.","sol":"Con $\\omega_n=n\\pi c/L$, l'identit&agrave; $\\cos(\\omega_nt)\\sin\\!\\big(\\tfrac{n\\pi x}{L}\\big)=\\tfrac12\\Big[\\sin\\!\\big(\\tfrac{n\\pi(x+ct)}{L}\\big)+\\sin\\!\\big(\\tfrac{n\\pi(x-ct)}{L}\\big)\\Big]$ trasforma la serie in $$y=\\tfrac12\\Big[\\tilde f(x+ct)+\\tilde f(x-ct)\\Big],\\qquad \\tilde f(\\xi)\\equiv\\sum_{n\\ge1}a_n\\sin\\!\\Big(\\frac{n\\pi\\xi}{L}\\Big),$$ e la funzione a destra &egrave; per costruzione il prolungamento dispari e $2L$-periodico di $f$: dispari perch&eacute; &egrave; una serie di soli seni, $2L$-periodica perch&eacute; ogni seno lo &egrave;. &Egrave; esattamente la formula di d'Alembert con $g=0$, applicata al dato prolungato. La lettura fisica &egrave; il metodo delle immagini: la corda finita si comporta come una corda infinita su cui viaggiano, oltre all'onda vera, le sue immagini riflesse con segno invertito agli estremi; l'inversione di segno &egrave; la disparit&agrave; del prolungamento, ed &egrave; ci&ograve; che tiene $y=0$ nei punti fissi. Con estremi liberi (Neumann) il prolungamento sarebbe pari e la riflessione avverrebbe senza cambio di segno."}]},{"pool":"edp","src":"Set 4 - Differential equations (separazione 2D, Laplace)","steps":[{"t":"Sia $\\Delta u=\\partial_x^2u+\\partial_y^2u=0$ sul rettangolo $[0,a]\\times[0,b]$, con $u=0$ sui tre lati $x=0$, $x=a$, $y=0$, e $u(x,b)=F(x)$. Quale forma ha la soluzione?","opts":[{"x":"$u=\\displaystyle\\sum_{n\\ge1}c_n\\,\\sinh\\!\\Big(\\frac{n\\pi y}{a}\\Big)\\sin\\!\\Big(\\frac{n\\pi x}{a}\\Big)$, con $c_n\\sinh\\!\\big(\\tfrac{n\\pi b}{a}\\big)=\\frac2a\\int_0^a\\!F(x)\\sin\\!\\big(\\tfrac{n\\pi x}{a}\\big)dx$","c":true},{"x":"$u=\\displaystyle\\sum_{n\\ge1}c_n\\,\\sin\\!\\Big(\\frac{n\\pi y}{a}\\Big)\\sin\\!\\Big(\\frac{n\\pi x}{a}\\Big)$"},{"x":"$u=\\displaystyle\\sum_{n\\ge1}c_n\\,e^{-n\\pi y/a}\\sin\\!\\Big(\\frac{n\\pi x}{a}\\Big)$"},{"x":"$u=\\displaystyle\\sum_{n\\ge1}c_n\\,\\cosh\\!\\Big(\\frac{n\\pi y}{a}\\Big)\\sin\\!\\Big(\\frac{n\\pi x}{a}\\Big)$"}],"hint":"Nell'equazione di Laplace la costante di separazione compare con segni <em>opposti</em> nelle due variabili: se una direzione oscilla, l'altra non pu&ograve; oscillare. E la condizione $u(x,0)=0$ sceglie fra $\\sinh$ e $\\cosh$.","sol":"Con $u=X(x)Y(y)$: $\\frac{X''}{X}=-\\frac{Y''}{Y}=-k^2$. Il segno opposto &egrave; la firma delle equazioni ellittiche: le tre BC omogenee stanno sui lati verticali e su quello basso, quindi &egrave; la direzione $x$ a doversi quantizzare, $X=\\sin(n\\pi x/a)$ con $k_n=n\\pi/a$, e allora $Y''=k_n^2Y$ ha soluzioni <em>iperboliche</em> $\\sinh$ e $\\cosh$, non trigonometriche. La condizione $u(x,0)=0$ elimina il $\\cosh$ e lascia $\\sinh(n\\pi y/a)$; l'esponenziale puro $e^{-n\\pi y/a}$ sarebbe la scelta giusta su una striscia semi-infinita $y>0$ con decadimento a infinito, non su un rettangolo con $u=0$ in $y=0$. Il coefficiente si fissa proiettando il dato sul lato alto: $c_n\\sinh(n\\pi b/a)$ &egrave; il coefficiente di Fourier di $F$, e la divisione per $\\sinh(n\\pi b/a)$ (che cresce esponenzialmente in $n$) rende la soluzione all'interno straordinariamente liscia, come dev'essere per una funzione armonica.","cont":"Perch&eacute; non c'&egrave; alcun dato iniziale"},{"t":"Perch&eacute; per Laplace non si assegnano un valore <em>e</em> una derivata normale sullo stesso lato, come si farebbe con le onde?","opts":[{"x":"Perch&eacute; il problema di Cauchy per Laplace &egrave; <em>mal posto</em> (Hadamard): la soluzione non dipende con continuit&agrave; dai dati. Laplace &egrave; un problema al contorno — un dato per ogni punto dell'<em>intero</em> bordo — non un problema a valori iniziali","c":true},{"x":"Perch&eacute; il problema sarebbe sovradeterminato: due dati per un'equazione del secondo ordine sono uno di troppo"},{"x":"Perch&eacute; la derivata normale non &egrave; definita sui vertici del rettangolo"},{"x":"Non c'&egrave; alcun motivo: si pu&ograve; fare, ed &egrave; il problema di Robin"}],"hint":"Costruisci una successione di dati che tende a zero mentre le soluzioni corrispondenti esplodono: basta un seno molto oscillante con ampiezza piccola.","sol":"Controesempio di Hadamard, che vale la pena saper esibire: si prenda $u(x,0)=0$ e $\\partial_yu(x,0)=\\tfrac1n\\sin(nx)$. La soluzione &egrave; $u=\\tfrac{1}{n^2}\\sin(nx)\\sinh(ny)$. Il dato tende uniformemente a zero come $1/n$, ma per ogni $y>0$ fissato la soluzione diverge come $e^{ny}/n^2$: la dipendenza continua dai dati &egrave; violata, e il problema &egrave; mal posto nel senso di Hadamard. La ragione strutturale &egrave; che nelle equazioni ellittiche non esistono direzioni caratteristiche reali — non c'&egrave; alcun 'tempo' lungo cui propagare — e la classificazione parabolica/iperbolica/ellittica non &egrave; una tassonomia decorativa: dice quale <em>tipo</em> di problema &egrave; ben posto. Iperbolico $\\to$ Cauchy (dato e derivata a $t=0$); parabolico $\\to$ dato a $t=0$ pi&ugrave; BC laterali; ellittico $\\to$ un solo dato su tutto il bordo, Dirichlet oppure Neumann oppure Robin, mai Cauchy."}]},{"pool":"edp","src":"metodo — Duhamel","steps":[{"t":"Sia $\\partial_tu=D\\partial_x^2u+S(t,x)$ su $[0,L]$ con Dirichlet omogenee e $u(0,x)=0$. Sviluppando $u=\\sum_nu_n(t)\\sin\\!\\big(\\tfrac{n\\pi x}{L}\\big)$ e $S=\\sum_nS_n(t)\\sin\\!\\big(\\tfrac{n\\pi x}{L}\\big)$, quanto vale $u_n(t)$?","opts":[{"x":"$u_n(t)=\\displaystyle\\int_0^t\\!ds\\;e^{-Dk_n^2(t-s)}S_n(s)$, con $k_n=\\tfrac{n\\pi}{L}$","c":true},{"x":"$u_n(t)=e^{-Dk_n^2t}\\displaystyle\\int_0^t\\!ds\\;S_n(s)$"},{"x":"$u_n(t)=\\dfrac{S_n(t)}{Dk_n^2}\\big(1-e^{-Dk_n^2t}\\big)$ per ogni $S_n$"},{"x":"$u_n(t)=\\displaystyle\\int_0^t\\!ds\\;e^{-Dk_n^2 s}S_n(s)$"}],"hint":"Ogni modo obbedisce a una ODE lineare del primo ordine non omogenea: la formula di variazione delle costanti pesa la sorgente con il propagatore del <em>tempo trascorso</em>, non del tempo assoluto.","sol":"Proiettando l'equazione sul modo $n$ si ottiene $\\dot u_n=-Dk_n^2u_n+S_n(t)$, ODE lineare del primo ordine. Con fattore integrante $e^{Dk_n^2t}$: $\\frac{d}{dt}\\big(e^{Dk_n^2t}u_n\\big)=e^{Dk_n^2t}S_n(t)$, e integrando da $0$ a $t$ con $u_n(0)=0$, $$u_n(t)=\\int_0^t e^{-Dk_n^2(t-s)}S_n(s)\\,ds .$$ &Egrave; il <em>principio di Duhamel</em>: la soluzione forzata &egrave; la sovrapposizione delle risposte libere a impulsi accesi a ogni istante $s$, propagate per il tempo residuo $t-s$. Il nucleo dipende da $t-s$ e non da $s$ o da $t$ separatamente perch&eacute; l'operatore ha coefficienti indipendenti dal tempo: se $D$ dipendesse da $t$ il nucleo diventerebbe $\\exp[-k_n^2\\int_s^tD(\\sigma)d\\sigma]$. Se invece la sorgente &egrave; costante, $S_n(t)=S_n$, l'integrale si fa e d&agrave; proprio $\\frac{S_n}{Dk_n^2}(1-e^{-Dk_n^2t})$: quella formula &egrave; corretta, ma solo in quel caso.","cont":"E per le onde?"},{"t":"Per le onde, $\\partial_t^2y=c^2\\partial_x^2y+S$, il modo $n$ obbedisce a $\\ddot y_n+\\omega_n^2y_n=S_n(t)$. Che cosa succede se $S_n(t)=\\sin(\\omega_nt)$, cio&egrave; se la sorgente &egrave; in risonanza col modo?","opts":[{"x":"L'ampiezza cresce linearmente in $t$: la soluzione particolare &egrave; $-\\dfrac{t}{2\\omega_n}\\cos(\\omega_nt)$, e la serie non converge pi&ugrave; a un moto limitato","c":true},{"x":"L'ampiezza cresce esponenzialmente, come $e^{\\omega_nt}$"},{"x":"Non succede nulla di speciale: la soluzione resta limitata perch&eacute; l'equazione &egrave; conservativa"},{"x":"L'ampiezza satura al valore $S_n/\\omega_n^2$, come nel caso del calore"}],"hint":"Prova $y_n=\\alpha\\,t\\cos(\\omega_nt)$ e determina $\\alpha$ sostituendo: la crescita &egrave; algebrica, non esponenziale.","sol":"Con $y_n=-\\frac{t}{2\\omega}\\cos(\\omega t)$ si ha $\\dot y_n=-\\frac{1}{2\\omega}\\cos\\omega t+\\frac t2\\sin\\omega t$ e $\\ddot y_n=\\sin\\omega t+\\frac{t\\omega}{2}\\cos\\omega t$; sommando $\\omega^2y_n=-\\frac{t\\omega}{2}\\cos\\omega t$ resta esattamente $\\sin(\\omega t)$: la soluzione particolare &egrave; verificata. La crescita &egrave; <em>lineare</em> in $t$, non esponenziale — l'errore comune &egrave; immaginare un'esplosione esponenziale, che nasce invece da autovalori con parte reale positiva, non dalla risonanza. La differenza col calore &egrave; strutturale ed &egrave; il punto da portare all'orale: il propagatore del calore $e^{-Dk_n^2(t-s)}$ dimentica il passato, quindi nessuna sorgente limitata pu&ograve; accumularsi e la risposta satura; il propagatore delle onde &egrave; oscillante e di modulo costante, quindi una forzante in fase si somma coerentemente per sempre. In una corda reale la risonanza &egrave; limitata dallo smorzamento, che aggiunge un termine $\\gamma\\dot y_n$ e sostituisce la crescita lineare con una saturazione a $S_n/(\\gamma\\omega_n)$."}]},{"pool":"edp","src":"teoria — propagatori, cap. 20","steps":[{"t":"Sia $i\\partial_t\\psi=-\\tfrac12\\partial_x^2\\psi$ su tutta la retta. Qual &egrave; il propagatore, cio&egrave; la soluzione con $\\psi(0,x)=\\delta(x)$?","opts":[{"x":"$K(t,x)=\\dfrac{1}{\\sqrt{2\\pi i t}}\\,e^{\\,i x^2/(2t)}$","c":true},{"x":"$K(t,x)=\\dfrac{1}{\\sqrt{2\\pi t}}\\,e^{-x^2/(2t)}$"},{"x":"$K(t,x)=\\dfrac{1}{\\sqrt{2\\pi i t}}\\,e^{-x^2/(2t)}$"},{"x":"$K(t,x)=\\dfrac{1}{\\sqrt{4\\pi i t}}\\,e^{\\,i x^2/(4t)}$"}],"hint":"&Egrave; lo stesso conto del nucleo del calore, ma con $D$ immaginario. L'integrale gaussiano $\\int e^{-\\alpha k^2+ikx}dk=\\sqrt{\\pi/\\alpha}\\,e^{-x^2/4\\alpha}$ vale anche per $\\alpha$ complesso con parte reale non negativa.","sol":"In Fourier: $i\\partial_t\\hat\\psi=\\tfrac12k^2\\hat\\psi$, dunque $\\hat K(t,k)=e^{-ik^2t/2}$. Antitrasformando con $\\alpha=it/2$: $$K=\\frac{1}{2\\pi}\\int\\! e^{-\\alpha k^2+ikx}dk=\\frac{1}{2\\pi}\\sqrt{\\frac{\\pi}{\\alpha}}e^{-x^2/(4\\alpha)}=\\frac{1}{2\\pi}\\sqrt{\\frac{2\\pi}{it}}\\,e^{ix^2/(2t)}=\\frac{1}{\\sqrt{2\\pi i t}}e^{ix^2/(2t)} .$$ Differenza cruciale rispetto al calore: qui $|K|=1/\\sqrt{2\\pi t}$ non decade in $x$, cio&egrave; il nucleo non &egrave; concentrato ma oscilla su tutta la retta con fase stazionaria; e $\\int|K|^2dx$ non converge, come dev'essere per un dato $\\delta$ non normalizzabile. La norma $L^2$ del pacchetto, invece, si conserva esattamente (unitariet&agrave;), a differenza del calore dove decade.","cont":"La rotazione di Wick"},{"t":"Sostituendo $t=-i\\tau$ nel propagatore di Schr&ouml;dinger si ottiene il nucleo del calore. Perch&eacute; questa non &egrave; una curiosit&agrave; formale?","opts":[{"x":"Perch&eacute; l'operatore di evoluzione $e^{-iHt}$ diventa $e^{-\\tau H}$, che per $\\tau=\\beta$ &egrave; l'operatore di Gibbs: la funzione di partizione $Z=\\mathrm{Tr}\\,e^{-\\beta H}$ &egrave; letteralmente un propagatore in tempo immaginario, ed &egrave; il ponte fra meccanica quantistica e meccanica statistica","c":true},{"x":"Perch&eacute; permette di calcolare integrali reali con metodi complessi, come nel lemma di Jordan"},{"x":"Perch&eacute; dimostra che l'equazione del calore &egrave; reversibile, come Schr&ouml;dinger"},{"x":"&Egrave; una curiosit&agrave; formale: la sostituzione non ha alcun contenuto fisico, perch&eacute; il tempo &egrave; reale"}],"hint":"Guarda che cosa diventa l'esponente dell'operatore di evoluzione quando il tempo diventa immaginario, e con che cosa coincide se il tempo immaginario vale $\\beta=1/k_BT$.","sol":"Con $t=-i\\tau$: $\\frac{1}{\\sqrt{2\\pi it}}e^{ix^2/2t}=\\frac{1}{\\sqrt{2\\pi\\tau}}e^{-x^2/(2\\tau)}$, che &egrave; il nucleo del calore con $D=1/2$ (infatti $\\frac{1}{\\sqrt{4\\pi D\\tau}}e^{-x^2/4D\\tau}$ con $D=1/2$ d&agrave; proprio quello). A livello di operatori, $e^{-iHt}\\to e^{-\\tau H}$, e ponendo $\\tau=\\beta=1/k_BT$ si ottiene la matrice densit&agrave; non normalizzata: la traccia &egrave; la funzione di partizione. Da qui il path integral euclideo, in cui l'ampiezza di transizione a tempo immaginario &egrave; una somma su cammini pesata da $e^{-S_E}$ e la meccanica quantistica in $d$ dimensioni si mappa sulla meccanica statistica classica in $d+1$. &Egrave; l'apparato che regge la decoerenza e le questioni di termalizzazione: le PDE risolte per separazione e i propagatori gaussiani di questo corso sono lo stesso oggetto, letti in un altro riferimento. Attenzione a non trarne la conclusione sbagliata: la rotazione di Wick non rende reversibile il calore, perch&eacute; la continuazione analitica &egrave; ben definita in una sola direzione — verso $\\mathrm{Re}\\,\\tau>0$."}]},{"pool":"edp","src":"modus operandi","steps":[{"t":"Quando conviene trasformare (Fourier) invece di separare, e soprattutto: su quale delle due variabili si trasforma?","opts":[{"x":"Su quella il cui dominio &egrave; illimitato o periodico <em>e</em> in cui i coefficienti dell'operatore sono costanti: quella variabile diventa un parametro algebrico e la PDE si riduce a una ODE nell'altra","c":true},{"x":"Sempre sul tempo, perch&eacute; l'obiettivo &egrave; eliminare le derivate temporali"},{"x":"Sempre sullo spazio, perch&eacute; le condizioni al bordo sono spaziali"},{"x":"Su quella in cui compare la derivata di ordine pi&ugrave; alto"}],"hint":"La trasformata converte $\\partial$ in moltiplicazione solo se il coefficiente davanti non dipende dalla variabile che stai trasformando. Rileggi le soluzioni dei sei appelli con questo criterio.","sol":"La trasformata di Fourier diagonalizza $\\partial_x$ perch&eacute; $e^{ikx}$ &egrave; autofunzione delle traslazioni: funziona quando l'operatore commuta con le traslazioni nella variabile trasformata, cio&egrave; quando i coefficienti non dipendono da quella variabile e il dominio &egrave; $\\mathbb{R}$ (spettro continuo) o un cerchio (spettro discreto, serie di Fourier). Il criterio si vede all'opera nei sei appelli: nel 08/07/2025 e nel 23/06/2025 il dominio spaziale &egrave; $\\mathbb{R}$ (o riducibile per estensione) e i coefficienti sono costanti in $x$ — si trasforma in $x$ e resta una ODE in $t$, anche col coefficiente $\\sin t$ che dipende dal tempo, perch&eacute; il tempo l&igrave; &egrave; solo un parametro. Nel 12/02/2026 e nel 20/01/2026 il dominio spaziale &egrave; limitato con BC omogenee: si separa e si ottiene una serie. Nel 09/09/2025 il dominio &egrave; $\\mathbb{R}$ ma compare $x^2u$, che rompe l'invarianza per traslazione: la trasformata non aiuta in $x$, e si usa la base di Hermite.","cont":"Il caso limite"},{"t":"Nell'appello 12/02/2026 il coefficiente &egrave; $t^2$: perch&eacute; non conviene trasformare rispetto a $t$?","opts":[{"x":"Perch&eacute; il coefficiente dipende proprio da $t$, quindi in $\\omega$ diventerebbe $-\\partial_\\omega^2$ e l'equazione resterebbe differenziale invece di diventare algebrica; inoltre il dominio &egrave; $t\\ge0$ con dato in $t=0$, cio&egrave; una semiretta","c":true},{"x":"Perch&eacute; la trasformata di Fourier non si applica mai al tempo"},{"x":"Perch&eacute; il dato iniziale non &egrave; a quadrato sommabile"},{"x":"Perch&eacute; l'equazione &egrave; del primo ordine in $t$, e Fourier richiede il secondo ordine"}],"hint":"Che cosa diventa il fattore $t^2$ nello spazio delle frequenze? E che tipo di dominio &egrave; $t\\ge0$?","sol":"Moltiplicare per $t^2$ diventa, in trasformata, $-\\partial_\\omega^2$: si scambierebbe una PDE con un'altra PDE, senza guadagno. In generale la trasformata paga solo dove i coefficienti sono costanti nella variabile trasformata. Il secondo ostacolo &egrave; il dominio: $t\\ge0$ &egrave; una semiretta con un dato assegnato all'estremo, che &egrave; la situazione della trasformata di <em>Laplace</em>, non di Fourier (e infatti Laplace incorpora automaticamente i dati iniziali nel termine $sF(s)-f(0)$). La soluzione ufficiale del 09/09/2025 fa vedere il prezzo di forzare Fourier nel tempo: per usarla estende prima il dominio temporale a tutto $\\mathbb{R}$, e il risultato vive solo nello spazio delle distribuzioni, con $\\hat u\\propto\\delta(\\omega\\pm\\sqrt{2n+1})$ — corretto, ma pi&ugrave; laborioso della separazione diretta. Morale operativa: la trasformata &egrave; uno strumento, non un riflesso."}]},{"pool":"edp","src":"teoria — compatibilit&agrave; dato/BC","steps":[{"t":"Calore su $[0,\\pi]$ con $u(t,0)=u(t,\\pi)=0$ e dato iniziale $u(0,x)=1$, costante. Il dato non si annulla agli estremi: il problema &egrave; mal posto?","opts":[{"x":"No, &egrave; ben posto: l'incompatibilit&agrave; sta su un insieme di misura nulla, la serie converge in $L^2$ e per ogni $t>0$ la soluzione &egrave; $C^\\infty$ e rispetta le BC. La discontinuit&agrave; vive solo nell'angolo $t=0$, $x\\in\\{0,\\pi\\}$","c":true},{"x":"S&igrave;: il dato dev'essere compatibile con le BC, altrimenti la soluzione non esiste"},{"x":"S&igrave;, ma si aggiusta modificando il dato in un intorno degli estremi"},{"x":"No, ma la soluzione esiste solo per $t$ maggiore di un certo $t_0>0$"}],"hint":"La regolarizzazione parabolica &egrave; istantanea: chiediti che cosa vale $u(t,0)$ per $t>0$ nella serie di seni, indipendentemente dal dato.","sol":"La serie di seni $u(t,x)=\\sum_nb_ne^{-Dn^2t}\\sin(nx)$ soddisfa $u(t,0)=u(t,\\pi)=0$ <em>termine per termine</em>, quindi per ogni $t>0$ le BC sono rispettate qualunque siano i $b_n$. La convergenza in $L^2$ del dato basta per la buona posizione, e il fattore $e^{-Dn^2t}$ rende la serie e tutte le sue derivate assolutamente convergenti per $t>0$: la soluzione &egrave; $C^\\infty$ nell'aperto. La singolarit&agrave; &egrave; confinata negli angoli $(t,x)=(0,0)$ e $(0,\\pi)$ del dominio spazio-temporale, dove il limite dipende dalla direzione: lungo $t=0$ la soluzione tende a $1$, lungo $x=0$ tende a $0$. I coefficienti: $b_n=\\frac2\\pi\\int_0^\\pi\\sin(nx)dx=\\frac{2}{\\pi}\\frac{1-(-1)^n}{n}$, cio&egrave; $\\frac{4}{\\pi n}$ per $n$ dispari e $0$ per $n$ pari — la classica onda quadra. La lettura fisica &egrave; una sbarra a temperatura uniforme immersa di colpo in due bagni a zero.","cont":"E il fenomeno di Gibbs"},{"t":"A $t=0$ la serie di soli seni di una costante manifesta il fenomeno di Gibbs. Che cosa succede per $t>0$?","opts":[{"x":"Sparisce: a $t=0$ le somme parziali sovraoscillano di circa il 9% del salto e la serie converge a $0$ negli estremi (media del salto), ma il fattore $e^{-Dn^2t}$ smorza i modi alti pi&ugrave; che esponenzialmente e le sovraoscillazioni si spengono immediatamente","c":true},{"x":"Persiste identico per ogni $t$, perch&eacute; Gibbs &egrave; una propriet&agrave; della base e non del dato"},{"x":"Si amplifica, perch&eacute; i modi alti sono quelli che portano l'oscillazione"},{"x":"Resta ma si sposta verso il centro dell'intervallo"}],"hint":"Gibbs vive nei modi alti; il calore li uccide come $e^{-Dn^2t}$. Chiediti anche a quale valore converge la serie <em>esattamente</em> negli estremi a $t=0$.","sol":"Il fenomeno di Gibbs &egrave; una propriet&agrave; delle somme parziali in presenza di un salto: l'overshoot vale circa il 9% dell'ampiezza del salto e non si attenua all'aumentare del numero di termini, si limita a stringersi attorno alla discontinuit&agrave;. Il risultato invocato per il valore nel punto di salto &egrave; il <em>teorema di convergenza puntuale di Dirichlet</em>: la serie converge alla semisomma dei limiti destro e sinistro, che qui vale $\\frac{1+(-1)}{2}=0$ agli estremi, perch&eacute; il prolungamento dispari salta da $-1$ a $+1$ attraverso l'origine. Per $t>0$ il quadro cambia radicalmente: il coefficiente effettivo del modo $n$ diventa $\\frac{4}{\\pi n}e^{-Dn^2t}$, che decade come una gaussiana in $n$, e la serie &egrave; dominata da $\\sum n^{-1}e^{-Dn^2t}<\\infty$ con tutte le derivate. Gibbs &egrave; un fenomeno dei modi alti, e il calore &egrave; un filtro passa-basso: si spengono a vicenda. Con l'equazione delle onde, invece, i modi alti non decadono e la discontinuit&agrave; sopravvive, viaggiando lungo le caratteristiche."}]}]};

var S = { units:[], ui:0, si:0, correct:0, total:0, answered:false };

/* =====================================================================
   TRACCIA — il quiz ricorda le risposte.  (Accensione, 2026-07-31)
   Prima di questo blocco il motore non salvava una singola risposta da
   nessuna parte: chiuso il tab, il tentativo spariva. Senza questo dato
   la navicella non ha nessun segnale esterno su cui correggersi.
   Blocco autonomo: si innesta identico in qualunque quiz gia' pubblicato.
   ===================================================================== */
var TRACCIA = (function(){
  var CHIAVE = 'navicella.quiz.attempts.v1';
  var attivo = true;
  try { window.localStorage.setItem('__t','1'); window.localStorage.removeItem('__t'); }
  catch(e){ attivo = false; }              // navigazione privata: si degrada in silenzio

  function leggi(){
    if(!attivo) return [];
    try { return JSON.parse(window.localStorage.getItem(CHIAVE)||'[]'); }
    catch(e){ return []; }
  }
  function scrivi(a){
    if(!attivo) return;
    try { window.localStorage.setItem(CHIAVE, JSON.stringify(a)); } catch(e){}
  }
  function registra(rec){
    if(!attivo) return;
    var a = leggi();
    rec.ts = new Date().toISOString();
    rec.corso = (document.title||'').trim();
    a.push(rec);
    if(a.length > 5000) a = a.slice(-5000);   // tetto: non gonfiare il browser
    scrivi(a);
    aggiornaBottone();
  }
  function esporta(){
    var a = leggi();
    if(!a.length){ return; }
    var jsonl = a.map(function(r){ return JSON.stringify(r); }).join('\n')+'\n';
    var blob = new Blob([jsonl], {type:'application/x-ndjson'});
    var url = URL.createObjectURL(blob);
    var nome = 'quiz-attempts-'+(document.title||'quiz').replace(/[^A-Za-z0-9]+/g,'-')
             + '-' + new Date().toISOString().slice(0,10) + '.jsonl';
    var a2 = document.createElement('a');
    a2.href = url; a2.download = nome; document.body.appendChild(a2); a2.click();
    document.body.removeChild(a2); URL.revokeObjectURL(url);
  }
  function svuota(){
    if(!confirm('Cancellare i tentativi salvati in questo browser?')) return;
    scrivi([]); aggiornaBottone();
  }
  function aggiornaBottone(){
    var b = document.getElementById('tracciaBtn');
    var n = leggi().length;
    if(!b){
      if(!n) return;
      b = document.createElement('div');
      b.id = 'tracciaBtn';
      b.style.cssText = 'position:fixed;right:14px;bottom:14px;z-index:9999;'
        + 'font:600 13px/1.2 system-ui,sans-serif;display:flex;gap:6px;align-items:center;'
        + 'background:#1f2937;color:#fff;padding:8px 12px;border-radius:10px;'
        + 'box-shadow:0 2px 10px rgba(0,0,0,.25);cursor:pointer;opacity:.92';
      b.title = 'Scarica i tentativi come .jsonl da consegnare alla navicella';
      b.onclick = esporta;
      document.body.appendChild(b);
      var x = document.createElement('span');
      x.textContent = '×';
      x.style.cssText = 'margin-left:6px;opacity:.6;padding:0 3px';
      x.title = 'Svuota';
      x.onclick = function(ev){ ev.stopPropagation(); svuota(); };
      b.appendChild(x);
    }
    if(!n){ b.remove(); return; }
    b.firstChild && b.firstChild.nodeType===3
      ? (b.firstChild.nodeValue = '↓ esporta '+n+' risposte')
      : b.insertBefore(document.createTextNode('↓ esporta '+n+' risposte'), b.firstChild);
  }
  return { registra: registra, esporta: esporta, conta: function(){ return leggi().length; },
           aggiorna: aggiornaBottone };
})();

function poolCount(id){ return (Q[id]||[]).reduce(function(n,u){return n+u.steps.length;},0); }

function renderMenu(){
  var g = document.getElementById('poolGrid');
  g.innerHTML = '';
  POOLS.forEach(function(p){
    var units = Q[p.id]||[];
    var n = poolCount(p.id);
    var empty = units.length===0;
    var card = document.createElement(empty?'div':'button');
    card.className = 'pool-card'+(empty?' empty':'');
    if(!empty) card.onclick = function(){ start(p.id); };
    card.innerHTML =
      '<div class="n">'+p.name+'</div>'+
      '<div class="meta">Difficolt&agrave; '+p.diff+' &middot; '+(empty?'0 domande':(n+' passi')) +'</div>'+
      '<span class="badge '+(p.status==='full'?'full':'todo')+'">'+
        (p.status==='full'?'COMPLETO':'DA ESTENDERE')+'</span>';
    g.appendChild(card);
  });
  typeset(g);
}

function start(poolId){
  var units = [];
  if(poolId==='ALL'){
    POOLS.forEach(function(p){ (Q[p.id]||[]).forEach(function(u){ units.push(u); }); });
  } else {
    units = (Q[poolId]||[]).slice();
  }
  if(units.length===0) return;
  units = shuffle(units.slice());
  S = { units:units, ui:0, si:0, correct:0, total:0, answered:false, poolId:poolId };
  show('quiz');
  renderStep();
}

function poolNameById(id){
  for(var i=0;i<POOLS.length;i++) if(POOLS[i].id===id) return POOLS[i].name;
  return id;
}

function renderStep(){
  var u = S.units[S.ui];
  var st = u.steps[S.si];
  S.answered = false;

  document.getElementById('qpool').innerHTML =
    (S.poolId==='ALL'?'Mischia':poolNameById(S.poolId));
  document.getElementById('qpos').innerHTML =
    'Domanda '+(S.ui+1)+' / '+S.units.length+
    (u.steps.length>1?(' &middot; parte '+(S.si+1)+'/'+u.steps.length):'')+
    ' &middot; <span class="src">'+u.src+'</span>';
  document.getElementById('qbar').style.width = (100*(S.ui)/S.units.length)+'%';

  var fig = document.getElementById('qfig');
  var svg = st.svg || (S.si===0 ? u.svg : null);
  if(svg){ fig.innerHTML = svg; fig.classList.remove('hidden'); typeset(fig); }
  else { fig.innerHTML=''; fig.classList.add('hidden'); }

  var qt = document.getElementById('qtext');
  qt.innerHTML = st.t;
  typeset(qt);

  var opts = shuffle(st.opts.map(function(o){return o;}));
  var box = document.getElementById('qopts');
  box.innerHTML = '';
  opts.forEach(function(o){
    var b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = o.x;
    b.onclick = function(){ answer(b, o, st); };
    box.appendChild(b);
  });
  typeset(box);

  document.getElementById('qhint').classList.remove('show');
  document.getElementById('qsol').classList.remove('show');
  document.getElementById('qcont').classList.add('hidden');
}

function answer(btn, opt, st){
  /* Accensione: ogni click e' un dato. `primo` distingue il primo tentativo sul
     passo (il segnale che conta per un contatore stile PFA) dai ritentativi. */
  TRACCIA.registra({ pool: S.poolId, ui: S.ui, si: S.si,
                     esito: !!opt.c, primo: !S.answered,
                     hint: document.getElementById('qhint').classList.contains('show') });
  if(opt.c){
    btn.classList.add('correct');
    Array.prototype.forEach.call(document.querySelectorAll('#qopts .opt'),
      function(b){ b.disabled = true; });
    document.getElementById('qhint').classList.remove('show');
    var sol = document.getElementById('qsol');
    sol.innerHTML = '<b>Corretto.</b> '+st.sol;
    sol.classList.add('show');
    typeset(sol);
    if(!S.answered){ S.correct++; }
    S.answered = true;
    var c = document.getElementById('qcont');
    var last = (S.si === S.units[S.ui].steps.length-1);
    c.innerHTML = last ? 'Prossima domanda &rarr;' : (st.cont || 'Continua &rarr;');
    c.classList.remove('hidden');
    c.onclick = nextStep;
  } else {
    btn.classList.add('wrong');
    btn.disabled = true;
    var h = document.getElementById('qhint');
    h.innerHTML = '<b>Rivedi.</b> '+st.hint;
    h.classList.add('show');
    typeset(h);
  }
}

function nextStep(){
  var u = S.units[S.ui];
  S.total++;
  if(S.si < u.steps.length-1){
    S.si++;
    renderStep();
  } else {
    S.ui++;
    S.si = 0;
    if(S.ui >= S.units.length){ endQuiz(); }
    else renderStep();
  }
}

function endQuiz(){
  show('end');
  document.getElementById('endScore').innerHTML = S.correct+' / '+S.total;
  var pct = S.total? Math.round(100*S.correct/S.total):0;
  var msg = pct>=85 ? 'Livello d&rsquo;esame solido.' :
            pct>=60 ? 'Buona base, ma alcuni trabocchetti ti hanno preso.' :
                      'Rivedi i suggerimenti: gli errori sono concettuali, non di calcolo.';
  document.getElementById('endMsg').innerHTML = 'Risposte corrette al primo tentativo. '+msg;
}

function toMenu(){ show('menu'); }

function show(which){
  ['menu','quiz','end'].forEach(function(id){
    document.getElementById(id).classList.toggle('hidden', id!==which);
  });
  window.scrollTo(0,0);
}

window.addEventListener('DOMContentLoaded', renderMenu);
</script>
