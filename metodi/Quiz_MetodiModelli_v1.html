l, sempre"},{"x":"calcolando la primitiva reale di $f(x)e^{-ikx}$"}],"hint":"L'integrale reale &egrave; un lato di un contorno chiuso: l'arco aggiunto deve svanire, e ci&ograve; seleziona il semipiano.","sol":"<b>Teorema dei residui applicato alla trasformata.</b> Si scrive $\\hat f(k)=\\int f(z)e^{-ikz}dz$ lungo l'asse reale, si chiude con una semicirconferenza in un semipiano e, se l'arco svanisce, $\\hat f(k)=\\pm2\\pi i\\sum\\mathrm{Res}$ sui poli racchiusi. La scelta del semipiano NON &egrave; libera: la fissa il segno di $k$ tramite $|e^{-ikz}|=e^{k\\,\\mathrm{Im}\\,z}$ (nucleo 13, sottotipo $c$)."}]},{"pool":"fourier","src":"20230704 Es.3","steps":[{"t":"MODUS OPERANDI. Con la convenzione $\\hat f(k)=\\int f(x)e^{-ikx}dx$, per $k>0$ si chiude il contorno:","opts":[{"x":"nel semipiano INFERIORE ($\\mathrm{Im}\\,z<0$): l&igrave; $|e^{-ikz}|=e^{k\\,\\mathrm{Im}\\,z}$ &egrave; esponenzialmente piccolo e l'arco svanisce","c":true},{"x":"nel semipiano superiore, sempre, indipendentemente dal segno di $k$"},{"x":"nel semipiano superiore per $k>0$ (come per l'antitrasformata)"},{"x":"a scelta: i due semipiani danno lo stesso risultato"}],"hint":"$|e^{-ikz}|=|e^{-ik(x+iy)}|=e^{ky}$: con $k>0$ questo decade dove $y=\\mathrm{Im}\\,z<0$. L'esponenziale schiaccia l'arco solo l&igrave;.","sol":"<b>Lemma di Jordan e scelta obbligata del semipiano.</b> Con $e^{-ikx}$ e $k>0$, il fattore $e^{-ikz}$ decade nel semipiano inferiore: si chiude SOTTO. Per $k<0$ si chiude SOPRA. Chiudere dalla parte sbagliata &egrave; l'errore n.1 del corso: l'arco esplode e il risultato &egrave; privo di senso. Attenzione: l'antitrasformata ha $e^{+ikx}$, quindi la regola si INVERTE (nucleo 13). &Egrave; il punto dove si perde l'esercizio."}]},{"pool":"fourier","src":"tipo &middot; nucleo 13","steps":[{"t":"Il <b>lemma di Jordan</b> garantisce che l'arco svanisce sotto quale ipotesi?","opts":[{"x":"$f(z)\\to0$ uniformemente sull'arco quando $R\\to\\infty$ (basta $|f|\\le M/R^{\\alpha}$, $\\alpha>0$): pi&ugrave; debole della stima ML pura","c":true},{"x":"$f$ deve decadere come $1/R^{2}$, come per i razionali senza esponenziale"},{"x":"$f$ deve essere pari"},{"x":"$f$ deve essere olomorfa ovunque"}],"hint":"&Egrave; il fattore $e^{-ikz}$, esponenzialmente piccolo nel semipiano giusto, ad aiutare: permette a $f$ di decadere pi&ugrave; lentamente che nel sottotipo dei razionali puri.","sol":"<b>Lemma di Jordan.</b> Se $f(z)\\to0$ uniformemente sull'arco per $R\\to\\infty$, allora $\\int_{C_R}f(z)e^{ikz}dz\\to0$ nel semipiano dove $e^{ikz}$ decade. La condizione &egrave; PIU DEBOLE di quella del sottotipo $(a)$ (razionali puri, che chiedono $\\deg Q\\ge\\deg P+2$): qui basta $\\deg Q\\ge\\deg P+1$, perch&eacute; l'esponenziale fa il resto. Per questo $\\frac{z}{z^2+4}$ va bene con $e^{ikz}$ ma non da solo."}]},{"pool":"fourier","src":"20230704 Es.3","steps":[{"t":"Chiudendo nel semipiano INFERIORE il contorno risulta percorso in senso orario. Conseguenza:","opts":[{"x":"$\\hat f(k)=-2\\pi i\\sum_{\\mathrm{Im}\\,z_j<0}\\mathrm{Res}$: compare il segno meno dal verso orario","c":true},{"x":"$\\hat f(k)=+2\\pi i\\sum\\mathrm{Res}$, il verso non conta"},{"x":"$\\hat f(k)=-\\pi i\\sum\\mathrm{Res}$, mezzo residuo"},{"x":"l'integrale &egrave; sempre nullo perch&eacute; il verso &egrave; orario"}],"hint":"Il teorema dei residui d&agrave; $+2\\pi i\\sum\\mathrm{Res}$ in senso ANTIorario; il semipiano inferiore si percorre al contrario.","sol":"<b>Segno del verso (teorema dei residui).</b> $\\oint=2\\pi i\\sum\\mathrm{Res}$ vale in senso antiorario; chiudendo sotto il cammino &egrave; orario, quindi $\\hat f(k>0)=-2\\pi i\\sum_{\\mathrm{Im}\\,z_j<0}\\mathrm{Res}$. Dimenticare questo meno inverte il segno della trasformata: nella soluzione ufficiale del 04/07/2023 il $-2\\pi i$ &egrave; esattamente ci&ograve; che produce $\\hat f(k>0)=\\frac{i\\pi}{3}e^{-k}$ con il segno giusto."}]},{"pool":"fourier","src":"tipo &middot; b01","steps":[{"t":"MODUS OPERANDI. Riconosci il tipo &laquo;trasformata di Fourier via residui&raquo; e ne imposti l'attacco: la sequenza corretta &egrave;:","opts":[{"x":"(1) prolunga a $f(z)e^{-ikz}$; (2) trova i poli e la loro parte immaginaria; (3) per OGNI segno di $k$ scegli il semipiano dove l'arco svanisce; (4) somma i residui racchiusi col segno del verso; (5) ricomponi con $\\theta(k)$","c":true},{"x":"calcola una primitiva e valuti agli estremi $\\pm\\infty$"},{"x":"sostituisci $z=e^{i\\theta}$ e integri sul cerchio unitario"},{"x":"sviluppi in serie di Fourier e leggi i coefficienti"}],"hint":"La distinzione $k>0$ / $k<0$ va fatta SEMPRE e per prima: sono due conti diversi che poi si fondono in una formula con la funzione gradino.","sol":"<b>Strategia d'attacco (mappa b01).</b> Il tipo si riconosce da un integrale $\\int_{-\\infty}^{+\\infty}$ di una razionale (o razionale$\\times$gaussiana) contro $e^{-ikx}$. Ordine invariante: prolungamento, poli, semipiano per ciascun segno di $k$ (lemma di Jordan), somma residui col verso, ricomposizione via $\\theta(k)$. Saltare la separazione dei segni &egrave; la causa n.1 di risposta incompleta."}]},{"pool":"fourier","src":"tipo &middot; nucleo 13","steps":[{"t":"Se un polo di $f$ cade ESATTAMENTE sull'asse reale (cammino), la trasformata:","opts":[{"x":"si definisce col valore principale di Cauchy e il polo contribuisce con MEZZO residuo ($\\pm i\\pi\\,\\mathrm{Res}$)","c":true},{"x":"non esiste in nessun senso"},{"x":"contribuisce col residuo intero $2\\pi i\\,\\mathrm{Res}$"},{"x":"si annulla per simmetria"}],"hint":"Il polo si aggira con una rientranza semicircolare di raggio $\\varepsilon$: l'arco piccolo d&agrave; una FRAZIONE del giro, non zero.","sol":"<b>Valore principale e regola del mezzo residuo (Sokhotski-Plemelj).</b> Per un polo SEMPLICE $x_0\\in\\mathbb{R}$ la rientranza semicircolare contribuisce $\\pm i\\pi\\,\\mathrm{Res}(f,x_0)$ (segno dal verso). Formalmente $\\frac{1}{x-x_0\\pm i\\epsilon}=\\mathrm{P}\\frac{1}{x-x_0}\\mp i\\pi\\delta(x-x_0)$. Vale SOLO per poli semplici: con un polo doppio sull'asse la rientranza diverge e il valore principale non esiste (nucleo 13, tappa 04)."}]},{"pool":"fourier","src":"20240910 Es.2","steps":[{"t":"Per $\\int_{-\\infty}^{+\\infty}\\frac{\\cos x}{e^x+e^{-x}}dx$ la funzione ha INFINITI poli su $z=\\pm i\\pi/2+i2k\\pi$. Perch&eacute; NON si usa la semicirconferenza?","opts":[{"x":"perch&eacute; il semicerchio racchiuderebbe infiniti poli: si usa un percorso RETTANGOLARE che ne cattura uno solo","c":true},{"x":"perch&eacute; la funzione non &egrave; olomorfa"},{"x":"perch&eacute; l'integrale diverge"},{"x":"perch&eacute; $\\cos x$ non &egrave; limitato"}],"hint":"I poli sono allineati verticalmente e spaziati di $2\\pi$: un arco che cresce ne inghiotte una quantit&agrave; infinita. Serve un cammino di altezza FISSA.","sol":"<b>Percorso rettangolare (compito 10/09/2024).</b> Con poli periodici lungo l'asse immaginario, la semicirconferenza racchiude infiniti residui e non chiude. Si sceglie un rettangolo di altezza $\\pi$: il lato superiore $z=x+i\\pi$ d&agrave; $f(x+i\\pi)=-e^{-\\pi}g(x)$, cio&egrave; $\\int_{\\gamma_3}=-e^{-\\pi}\\int_{\\gamma_1}$ (proporzionale, non opposto), e $K(1+e^{-\\pi})=2\\pi i\\,\\mathrm{Res}_{i\\pi/2}$. Risultato $I=\\frac{\\pi}{2\\cosh(\\pi/2)}$. La chiave &egrave; che i due lati orizzontali sono proporzionali per periodicit&agrave; dell'esponenziale."}]},{"pool":"fourier","src":"Set 3 es.2","steps":[{"t":"I coefficienti della serie di Fourier ESPONENZIALE di $f\\in L^2[-\\pi,\\pi]$ sono:","opts":[{"x":"$f_n=\\frac{1}{\\sqrt{2\\pi}}\\int_{-\\pi}^{\\pi}f(x)e^{-inx}dx$, e $f(x)=\\frac{1}{\\sqrt{2\\pi}}\\sum_{n=-\\infty}^{\\infty}f_n e^{inx}$","c":true},{"x":"$f_n=\\int_{-\\pi}^{\\pi}f(x)e^{inx}dx$, senza normalizzazione"},{"x":"$f_n=f(n)$, il campionamento della funzione"},{"x":"$f_n=\\frac{d^n f}{dx^n}(0)/n!$"}],"hint":"La base $\\{e^{inx}/\\sqrt{2\\pi}\\}$ &egrave; ortonormale su $[-\\pi,\\pi]$: il coefficiente &egrave; il prodotto scalare $\\langle e^{inx}/\\sqrt{2\\pi}\\,|\\,f\\rangle$.","sol":"<b>Coefficienti di Fourier (proiezione su base ortonormale).</b> $\\{\\varphi_n=e^{inx}/\\sqrt{2\\pi}\\}$ &egrave; base ortonormale di $L^2[-\\pi,\\pi]$; $f_n=\\langle\\varphi_n,f\\rangle$. La forma trigonometrica $a_n,b_n$ &egrave; equivalente (combinazioni di $f_n,f_{-n}$): si sceglie l'esponenziale quando il calcolo dell'integrale &egrave; pi&ugrave; pulito, la trigonometrica quando $f$ &egrave; reale pari/dispari (met&agrave; dei coefficienti si annullano per simmetria)."}]},{"pool":"fourier","src":"20240115 Es.4","steps":[{"t":"In un punto $x_0$ di DISCONTINUIT&Agrave; a salto, la serie di Fourier $S(x_0)$ converge a:","opts":[{"x":"la semisomma dei limiti destro e sinistro, $\\tfrac12\\big(f(x_0^+)+f(x_0^-)\\big)$, NON a $f(x_0)$","c":true},{"x":"$f(x_0)$, sempre"},{"x":"$\\max(f(x_0^+),f(x_0^-))$"},{"x":"zero"}],"hint":"Il valore puntuale $f(x_0)$ &egrave; irrilevante: la serie &laquo;non vede&raquo; il singolo punto, media i due rami.","sol":"<b>Teorema di Dirichlet.</b> Se $f$ &egrave; regolare a tratti, la serie di Fourier converge a $\\tfrac12(f(x_0^+)+f(x_0^-))$ in ogni punto; dove $f$ &egrave; continua ci&ograve; coincide con $f(x_0)$, ma in un salto d&agrave; la MEDIA. Usare $f(x_0)$ al posto della semisomma quando $f$ &egrave; discontinua &egrave; la trappola dominante delle identit&agrave; numeriche (mappa b01): produce un'equazione sbagliata per la somma della serie."}]},{"pool":"fourier","src":"tipo &middot; b01","steps":[{"t":"MODUS OPERANDI. Per estrarre un'IDENTIT&Agrave; numerica (tipo $\\sum 1/n^2$) da una serie di Fourier, la mossa &egrave;:","opts":[{"x":"valutare la serie in un punto scelto ($x=0$ o $x=\\pm\\pi$) e uguagliarla al valore della funzione l&igrave;: $f(x_0)$ se continua, la semisomma se discontinua","c":true},{"x":"derivare la serie termine a termine e porre $x=0$"},{"x":"integrare la serie su tutto il periodo"},{"x":"prendere il limite $n\\to\\infty$ dei coefficienti"}],"hint":"L'identit&agrave; nasce uguagliando i DUE modi di scrivere lo stesso numero: la serie valutata in $x_0$ e il valore (o la semisomma) di $f$ in $x_0$. Il punto va scelto per far comparire la somma voluta.","sol":"<b>Strategia delle identit&agrave; (Set 3, compiti 2024).</b> Si sceglie $x_0$ in modo che i $\\cos(nx_0)$ o $e^{inx_0}$ producano la somma cercata: $x_0=0$ d&agrave; $\\sum a_n$ (segni tutti $+$ o alternati), $x_0=\\pi$ d&agrave; $\\sum(-1)^n a_n$. Poi si applica il <b>teorema di Dirichlet</b>: uguagliare a $f(x_0)$ (se continua) o alla semisomma (se salto). La distinzione continuit&agrave;/salto DECIDE il secondo membro: &egrave; il passo dove il conto vive o muore."}]},{"pool":"fourier","src":"20231116 Es.3","steps":[{"t":"L'antitrasformata $\\hat{\\hat f}(x)=\\int\\frac{dk}{2\\pi}\\hat f(k)e^{ikx}$ si calcola coi residui: per $x>0$ si chiude:","opts":[{"x":"nel semipiano SUPERIORE ($\\mathrm{Im}\\,k>0$): con $e^{+ikx}$ e $x>0$ &egrave; l&igrave; che l'esponenziale decade &mdash; regola INVERTITA rispetto alla trasformata diretta","c":true},{"x":"nel semipiano inferiore, come per la trasformata diretta con $k>0$"},{"x":"a scelta, il risultato non dipende dal semipiano"},{"x":"non si pu&ograve; chiudere: l'antitrasformata si fa solo numericamente"}],"hint":"Ora l'esponente &egrave; $+ikx$: $|e^{ikx}|=e^{-x\\,\\mathrm{Im}\\,k}$; con $x>0$ decade dove $\\mathrm{Im}\\,k>0$. Il segno opposto rispetto a $e^{-ikx}$ inverte la regola.","sol":"<b>Antitrasformata (lemma di Jordan, segno invertito).</b> Il nucleo &egrave; ora $e^{+ikx}$: per $x>0$ si chiude SOPRA, per $x<0$ SOTTO &mdash; l'opposto della trasformata diretta, per via del segno dell'esponente. Nel 16/11/2023, $\\hat f(k)=\\frac{1}{1-ik}+\\frac{1}{(1+ik)^2}$: per $x>0$ contribuisce il polo doppio in $k=i$ (secondo termine) $\\to xe^{-x}$; per $x<0$ il polo semplice in $k=-i$ $\\to e^{x}$. Si riottiene $f(x)$ ovunque tranne il salto."}]},{"pool":"fourier","src":"20231116 Es.3","steps":[{"t":"Nel punto $x=0$, dove $f(x)=xe^{-x}\\theta(x)+e^x\\theta(-x)$ &egrave; discontinua, l'antitrasformata $\\hat{\\hat f}(0)$ vale:","opts":[{"x":"$\\tfrac12\\big(f(0^+)+f(0^-)\\big)=\\tfrac12(0+1)=\\tfrac12$, per lo stesso teorema di Dirichlet delle serie","c":true},{"x":"$f(0)=1$"},{"x":"$0$, perch&eacute; $xe^{-x}$ si annulla in $0$"},{"x":"diverge, l'integrale non converge"}],"hint":"$f(0^+)=0\\cdot e^0=0$ (ramo $xe^{-x}$), $f(0^-)=e^0=1$ (ramo $e^x$): la trasformata inversa media i due, non prende un ramo solo.","sol":"<b>Dirichlet anche per la trasformata (compito 16/11/2023).</b> Nel salto l'integrale di antitrasformata converge alla semisomma $\\tfrac12(f(0^+)+f(0^-))=\\tfrac12$, in perfetta analogia col teorema di Dirichlet per le serie. La soluzione ufficiale lo dichiara senza calcolare l'integrale (che l&igrave; &egrave; divergente e va regolarizzato): il valore &egrave; imposto dalla struttura, non dal conto."}]},{"pool":"fourier","src":"Set 3 es.6","steps":[{"t":"Per $f\\in L^1(\\mathbb{R})$ con poli in $C$, la VELOCIT&Agrave; di decadimento di $\\hat f(k)$ per $k\\to+\\infty$ &egrave; controllata da:","opts":[{"x":"la pi&ugrave; piccola $|\\mathrm{Im}|$ fra i poli del semipiano INFERIORE (quelli che contano per $k>0$): $\\hat f(k)\\sim e^{-|\\mathrm{Im}\\,z^-_{\\min}|\\,k}$","c":true},{"x":"la parte reale del polo pi&ugrave; vicino all'origine"},{"x":"il numero totale di poli"},{"x":"il polo con parte immaginaria pi&ugrave; grande in modulo"}],"hint":"Per $k>0$ si chiude sotto: ogni residuo porta $e^{k\\,\\mathrm{Im}\\,z^-}$ con $\\mathrm{Im}\\,z^-<0$; il termine che muore pi&ugrave; lentamente domina, ed &egrave; quello col polo pi&ugrave; VICINO all'asse reale.","sol":"<b>Decadimento e posizione dei poli (Set 3 es.6).</b> Chiudendo sotto per $k>0$, $\\hat f(k)=-2\\pi i\\sum_i c_i^- e^{k\\,\\mathrm{Im}\\,z_i^-}$: il decadimento pi&ugrave; lento (il polo pi&ugrave; vicino all'asse) domina. Simmetricamente, per $k\\to-\\infty$ contano i poli SUPERIORI. Verifica sulla lorentziana $\\frac{1}{x^2+a^2}$: poli in $\\pm ia$, $\\hat f(k)=\\frac{\\pi}{a}e^{-a|k|}$ &mdash; il tasso $a$ &egrave; proprio $|\\mathrm{Im}|$ del polo. &Egrave; il principio dietro al confronto $\\hat f$ vs $\\hat g$ del 04/07/2023."}]},{"pool":"fourier","src":"20230704 Es.3","steps":[{"t":"$f(x)=\\frac{1}{(x^2+1)(x-2i)}$: trasformata via residui. Poli e semipiano per $k>0$:","opts":[{"x":"poli in $z=\\pm i$ e $z=2i$; per $k>0$ si chiude SOTTO, dentro sta solo $z=-i$","c":true},{"x":"poli in $z=\\pm i,\\,2i$; per $k>0$ si chiude sopra, dentro $z=i$ e $z=2i$"},{"x":"un solo polo in $z=2i$; si chiude sopra"},{"x":"nessun polo: la trasformata &egrave; nulla"}],"hint":"$x^2+1=(x-i)(x+i)$: tre poli, di cui $z=i$ e $z=2i$ nel semipiano superiore e $z=-i$ in quello inferiore. Con $k>0$ chiudi sotto.","sol":"<b>Poli e chiusura (compito 04/07/2023).</b> $\\hat f(k)=\\int\\frac{e^{-ikz}}{(z^2+1)(z-2i)}dz$; poli $\\pm i,2i$. Per $k>0$ il lemma di Jordan impone il semipiano inferiore: l'unico polo racchiuso &egrave; $z=-i$ (verso orario $\\Rightarrow$ segno $-2\\pi i$).","cont":"Calcola il residuo in $z=-i$ &rarr;"},{"t":"Il residuo in $z=-i$ e quindi $\\hat f(k>0)$:","opts":[{"x":"$\\mathrm{Res}_{-i}=-\\tfrac{e^{-k}}{6}$, quindi $\\hat f(k>0)=-2\\pi i\\cdot(-\\tfrac{e^{-k}}{6})=\\tfrac{i\\pi}{3}e^{-k}$","c":true},{"x":"$\\hat f(k>0)=\\tfrac{\\pi}{3}e^{-k}$ (reale)"},{"x":"$\\hat f(k>0)=-\\tfrac{i\\pi}{3}e^{k}$"},{"x":"$\\hat f(k>0)=2\\pi i\\,e^{-k}$"}],"hint":"$\\lim_{z\\to-i}(z+i)\\frac{e^{-ikz}}{(z-i)(z+i)(z-2i)}=\\frac{e^{-k}}{(-2i)(-3i)}$; poi moltiplica per $-2\\pi i$.","sol":"<b>Formula del quoziente + verso orario (verificato ufficialmente).</b> $\\mathrm{Res}_{-i}=\\frac{e^{-ik(-i)}}{(-i-i)(-i-2i)}=\\frac{e^{-k}}{(-2i)(-3i)}=\\frac{e^{-k}}{-6}$. Con il $-2\\pi i$ del verso orario: $\\hat f(k>0)=\\frac{i\\pi}{3}e^{-k}$. Il risultato &egrave; immaginario puro: coerente, perch&eacute; $f$ non &egrave; reale.","cont":"Ora $k<0$ e la forma compatta &rarr;"},{"t":"Per $k<0$ (chiusura sopra, poli $i$ e $2i$) e ricomposizione con $\\theta$:","opts":[{"x":"$\\hat f(k<0)=i\\pi\\big(e^{k}-\\tfrac{2}{3}e^{2k}\\big)$; compatto $\\hat f(k)=\\tfrac{i\\pi}{3}e^{-k}\\theta(k)+i\\pi(e^{k}-\\tfrac{2}{3}e^{2k})\\theta(-k)$","c":true},{"x":"$\\hat f(k<0)=0$"},{"x":"$\\hat f(k<0)=\\tfrac{i\\pi}{3}e^{k}$"},{"x":"$\\hat f(k)=\\tfrac{i\\pi}{3}e^{-|k|}$ per ogni $k$"}],"hint":"Per $k<0$ chiudi sopra (verso antiorario, $+2\\pi i$) e sommi i residui in $z=i$ e $z=2i$. La funzione gradino $\\theta$ incolla i due regimi.","sol":"<b>Ricomposizione via $\\theta(k)$ (verificato ufficialmente).</b> Per $k<0$: $+2\\pi i[\\mathrm{Res}_i+\\mathrm{Res}_{2i}]=i\\pi(e^{k}-\\tfrac{2}{3}e^{2k})$. La forma compatta $\\hat f(k)=\\frac{i\\pi}{3}e^{-k}\\theta(k)+i\\pi(e^{k}-\\frac{2}{3}e^{2k})\\theta(-k)$ &egrave; obbligatoria: il termine gradino NON &egrave; un dettaglio estetico, distingue i due semipiani (trappola b01). La parte $g$ dell'esercizio confronta i decadimenti via posizione dei poli."}]},{"pool":"fourier","src":"20240910 Es.3","steps":[{"t":"$f(x)=\\frac{1}{(x+i)(x-1+2i)}$: entrambi i poli sono $z=-i$ e $z=1-2i$, con $\\mathrm{Im}<0$. Cosa succede per $k<0$?","opts":[{"x":"si chiude SOPRA, dove NON ci sono poli: $\\hat f(k<0)=0$","c":true},{"x":"si chiude sopra e si prendono entrambi i residui"},{"x":"si chiude sotto anche per $k<0$"},{"x":"la trasformata diverge"}],"hint":"Entrambi i poli stanno nel semipiano inferiore. Per $k<0$ si chiude nel superiore, che &egrave; vuoto: integrale nullo.","sol":"<b>Semipiano vuoto $\\Rightarrow$ trasformata nulla (compito 10/09/2024).</b> Con tutti i poli in $\\mathrm{Im}\\,z<0$, per $k<0$ (chiusura superiore, lemma di Jordan) non c'&egrave; nulla dentro il contorno: $\\hat f(k<0)=0$. La trasformata &egrave; supportata solo su $k>0$: $\\hat f(k)=[\\cdots]\\,\\theta(k)$.","cont":"Calcola il caso $k>0$ &rarr;"},{"t":"Per $k>0$ (chiusura sotto, verso orario) la trasformata &egrave;:","opts":[{"x":"$\\hat f(k)=-2\\pi i\\Big(\\tfrac{e^{-k}}{i-1}+\\tfrac{e^{-2k-ik}}{1-i}\\Big)\\theta(k)$","c":true},{"x":"$\\hat f(k)=+2\\pi i\\big(\\mathrm{Res}_{-i}+\\mathrm{Res}_{1-2i}\\big)$"},{"x":"$\\hat f(k)=-2\\pi i\\,\\mathrm{Res}_{-i}$ soltanto"},{"x":"$\\hat f(k)=\\pi i\\,e^{-k}$"}],"hint":"Entrambi i poli sono racchiusi; $\\mathrm{Res}_{-i}=\\frac{e^{-k}}{-i-1+2i}=\\frac{e^{-k}}{i-1}$ e $\\mathrm{Res}_{1-2i}=\\frac{e^{-2k-ik}}{1-i}$; poi $-2\\pi i$ per il verso.","sol":"<b>Somma dei residui col segno orario (verificato ufficialmente).</b> $\\mathrm{Res}_{-i}=\\frac{e^{-ik(-i)}}{(-i-1+2i)}=\\frac{e^{-k}}{i-1}$; $\\mathrm{Res}_{1-2i}=\\frac{e^{-ik(1-2i)}}{(1-2i+i)}=\\frac{e^{-2k-ik}}{1-i}$. Il verso orario d&agrave; $\\hat f(k)=-2\\pi i\\big(\\frac{e^{-k}}{i-1}+\\frac{e^{-2k-ik}}{1-i}\\big)\\theta(k)$. Il caso in cui i poli stanno tutti da un lato &egrave; il pi&ugrave; rapido: met&agrave; della retta d&agrave; zero."}]},{"pool":"fourier","src":"20231116 Es.3","steps":[{"t":"$f(x)=xe^{-x}\\theta(x)+e^x\\theta(-x)$: la trasformata si calcola come somma di due integrali elementari. $\\hat f(k)$ vale:","opts":[{"x":"$\\hat f(k)=\\dfrac{1}{1-ik}+\\dfrac{1}{(1+ik)^2}$","c":true},{"x":"$\\hat f(k)=\\dfrac{1}{1+ik}+\\dfrac{1}{1-ik}$"},{"x":"$\\hat f(k)=\\dfrac{1}{(1-ik)^2}$"},{"x":"$\\hat f(k)=\\dfrac{2}{1+k^2}$"}],"hint":"$\\int_{-\\infty}^0 e^{(1-ik)x}dx=\\frac{1}{1-ik}$; $\\int_0^\\infty x e^{-(1+ik)x}dx=-\\frac{d}{d\\alpha}\\frac{1}{\\alpha}\\big|_{\\alpha=1+ik}=\\frac{1}{(1+ik)^2}$.","sol":"<b>Trasformata diretta via integrali (compito 16/11/2023).</b> Il ramo $e^x\\theta(-x)$ d&agrave; $\\frac{1}{1-ik}$; il ramo $xe^{-x}\\theta(x)$ si ottiene con il trucco $x\\,e^{-\\alpha x}=-\\frac{d}{d\\alpha}e^{-\\alpha x}$ valutato in $\\alpha=1+ik$, dando $\\frac{1}{(1+ik)^2}$ (polo DOPPIO, non semplice). Questi qui non richiedono nemmeno i residui, ma li richiede l'antitrasformata.","cont":"Verifica in $x=0$ &rarr;"},{"t":"Antitrasformando, per $x=0$ (punto di discontinuit&agrave;) si trova:","opts":[{"x":"$\\hat{\\hat f}(0)=\\tfrac12$, semisomma dei limiti $\\tfrac12(0+1)$","c":true},{"x":"$\\hat{\\hat f}(0)=1$"},{"x":"$\\hat{\\hat f}(0)=0$"},{"x":"$\\hat{\\hat f}(0)=\\tfrac14$"}],"hint":"L'antitrasformata ricostruisce $f$ per $x\\neq0$; nel salto d&agrave; la media dei due rami $f(0^+)=0$ e $f(0^-)=1$.","sol":"<b>Chiusura del conto via Dirichlet.</b> Per $x\\neq0$ l'antitrasformata riproduce $f$; in $x=0$, salto fra $0$ e $1$, d&agrave; la semisomma $\\tfrac12$. Non serve calcolare l'integrale divergente: il <b>teorema di Dirichlet</b> (esteso alla trasformata) fissa il valore. &Egrave; il gemello continuo dell'identit&agrave; delle serie."}]},{"pool":"fourier","src":"Set 3 es.7","steps":[{"t":"$f_2(x)=\\dfrac{x}{(1+x^2)^2}=\\dfrac{x}{(x-i)^2(x+i)^2}$: che natura hanno i poli e come si procede per $k>0$?","opts":[{"x":"poli DOPPI in $\\pm i$; per $k>0$ si chiude sotto e si usa la formula del polo doppio (una derivata) in $z=-i$","c":true},{"x":"poli semplici in $\\pm i$; residuo diretto"},{"x":"un polo quadruplo in $0$"},{"x":"nessun polo: si integra per parti"}],"hint":"$(1+x^2)^2$ al denominatore raddoppia ogni zero: $\\pm i$ diventano poli di ordine 2. Il residuo di un polo doppio richiede $\\frac{d}{dz}$.","sol":"<b>Poli doppi (Set 3 es.7).</b> $\\mathrm{Res}(f_2 e^{-ikz},-i)=\\lim_{z\\to-i}\\frac{d}{dz}\\big[(z+i)^2 f_2 e^{-ikz}\\big]$: la formula del polo di ordine $m=2$ chiede UNA derivata. Chiudere sotto per $k>0$ (Jordan) porta il verso orario, quindi $-2\\pi i$.","cont":"Il risultato compatto &rarr;"},{"t":"Il risultato per ogni $k$ &egrave;:","opts":[{"x":"$\\hat f_2(k)=-\\dfrac{i\\pi}{4}\\,k\\,e^{-|k|}$","c":true},{"x":"$\\hat f_2(k)=\\dfrac{\\pi}{4}e^{-|k|}$"},{"x":"$\\hat f_2(k)=-\\dfrac{i\\pi}{4}e^{-|k|}$ (senza il fattore $k$)"},{"x":"$\\hat f_2(k)=\\dfrac{i\\pi}{4}k^2 e^{-|k|}$"}],"hint":"Per $k>0$ esce $-\\frac{i\\pi}{4}ke^{-k}$, per $k<0$ (polo $+i$) $-\\frac{i\\pi}{4}ke^{k}$: si fondono in $ke^{-|k|}$.","sol":"<b>Trasformata di un polo doppio (verificato ufficialmente).</b> $\\hat f_2(k)=-\\frac{i\\pi}{4}ke^{-|k|}$: il fattore lineare $k$ &egrave; la firma del polo doppio (deriva dalla derivata nel residuo). $f_2$ &egrave; dispari e reale $\\Rightarrow$ $\\hat f_2$ &egrave; immaginaria pura e dispari: due controlli di coerenza superati."}]},{"pool":"fourier","src":"Set 3 es.7","steps":[{"t":"$f_3(x)=\\dfrac{\\cos(ax)}{x^2+b^2}$ ($a,b>0$). Scrivendo $\\cos(ax)=\\tfrac12(e^{iax}+e^{-iax})$, quanti CASI in $k$ occorre distinguere?","opts":[{"x":"tre: $k>a$, $-a<k<a$, $k<-a$ &mdash; perch&eacute; i due esponenziali cambiano semipiano a soglie diverse","c":true},{"x":"uno solo: si chiude sempre sopra"},{"x":"due: $k>0$ e $k<0$"},{"x":"nessuno: la trasformata &egrave; costante"}],"hint":"Ogni esponenziale $e^{\\pm iax}e^{-ikx}=e^{-i(k\\mp a)x}$ ha il proprio segno di frequenza $k\\mp a$: le due soglie sono $k=a$ e $k=-a$.","sol":"<b>Distinzione dei casi in $k$ (Set 3 es.7).</b> $\\frac12 e^{iax}$ porta frequenza $k-a$, $\\frac12 e^{-iax}$ porta $k+a$; ciascun termine si chiude nel proprio semipiano secondo il segno della SUA frequenza. Le soglie $k=\\pm a$ generano tre regioni. NON si forzano entrambi gli esponenziali nello stesso contorno: vogliono semipiani opposti quando $-a<k<a$.","cont":"La forma compatta &rarr;"},{"t":"Ricomponendo i tre casi, la trasformata &egrave;:","opts":[{"x":"$\\hat f_3(k)=\\dfrac{\\pi}{2b}\\big(e^{-b|k-a|}+e^{-b|a+k|}\\big)$","c":true},{"x":"$\\hat f_3(k)=\\dfrac{\\pi}{b}e^{-b|k|}$"},{"x":"$\\hat f_3(k)=\\dfrac{\\pi}{2b}e^{-b|k|}\\cos(ab)$"},{"x":"$\\hat f_3(k)=\\dfrac{\\pi}{2b}\\big(e^{-b|k-a|}-e^{-b|a+k|}\\big)$"}],"hint":"Ogni polo $\\pm ib$ d&agrave; un $\\frac{\\pi}{2b}$; i moduli $|k-a|$ e $|k+a|$ raccolgono i tre casi in una sola formula.","sol":"<b>Trasformata di $\\cos(ax)/(x^2+b^2)$ (verificato ufficialmente).</b> I tre regimi si fondono in $\\hat f_3(k)=\\frac{\\pi}{2b}(e^{-b|k-a|}+e^{-b|a+k|})$. La struttura a due lorentziane traslate a $\\pm a$ &egrave; la firma della modulazione $\\cos(ax)$: la moltiplicazione per $\\cos(ax)$ nello spazio $x$ trasla lo spettro di $\\pm a$ (teorema di modulazione)."}]},{"pool":"fourier","src":"Set 3 es.2","steps":[{"t":"$f_a(x)=e^{ax}$ su $[-\\pi,\\pi]$. I coefficienti esponenziali e la somma $s_1=\\sum_{n=1}^{\\infty}\\frac{(-1)^n}{n^2+a^2}$ si ottengono cos&igrave;: prima $f_n$, poi si valuta in $x=0$. I coefficienti sono:","opts":[{"x":"$f_n=\\sqrt{\\tfrac{2}{\\pi}}\\,\\dfrac{(-1)^n\\sinh(a\\pi)}{a-in}$","c":true},{"x":"$f_n=\\dfrac{\\sinh(a\\pi)}{a+in}$"},{"x":"$f_n=\\dfrac{(-1)^n}{a^2+n^2}$"},{"x":"$f_n=e^{an}$"}],"hint":"$f_n=\\frac{1}{\\sqrt{2\\pi}}\\int_{-\\pi}^{\\pi}e^{(a-in)x}dx=\\frac{1}{\\sqrt{2\\pi}}\\frac{e^{(a-in)\\pi}-e^{-(a-in)\\pi}}{a-in}$; ricorda $e^{\\mp in\\pi}=(-1)^n$.","sol":"<b>Coefficienti di $e^{ax}$ (Set 3 es.2, verificato).</b> $f_n=\\frac{1}{\\sqrt{2\\pi}}\\frac{e^{(a-in)\\pi}-e^{-(a-in)\\pi}}{a-in}=\\sqrt{\\frac{2}{\\pi}}\\frac{(-1)^n\\sinh(a\\pi)}{a-in}$, usando $e^{\\pm in\\pi}=(-1)^n$ e la definizione di $\\sinh$. Questi coefficienti generano tutte e tre le somme $s_1,s_2,s_3$ dell'esercizio.","cont":"Valuta in $x=0$ (continuo) &rarr;"},{"t":"In $x=0$ la funzione &egrave; CONTINUA ($f(0)=1$). Uguagliando $S_a(0)=f(0)$ si ottiene:","opts":[{"x":"$s_1=\\dfrac{1}{2a}\\Big(\\dfrac{\\pi}{\\sinh(\\pi a)}-\\dfrac{1}{a}\\Big)$","c":true},{"x":"$s_1=\\dfrac{\\pi}{a}\\coth(\\pi a)$"},{"x":"$s_1=\\dfrac{\\pi^2}{6}$"},{"x":"$s_1=\\dfrac{1}{a^2}$"}],"hint":"$S_a(0)=\\frac{\\sinh(a\\pi)}{\\pi}\\big[\\frac1a+2a\\,s_1\\big]$ e va posto uguale a $f(0)=1$ perch&eacute; $e^{ax}$ &egrave; continua in $0$.","sol":"<b>Identit&agrave; via continuit&agrave; in $x=0$ (verificato ufficialmente).</b> $S_a(0)=\\frac{\\sinh(a\\pi)}{\\pi}(\\frac1a+2a\\,s_1)$; poich&eacute; $f$ &egrave; continua in $0$, il <b>teorema di Dirichlet</b> d&agrave; $S_a(0)=f(0)=1$, da cui $s_1=\\frac{1}{2a}(\\frac{\\pi}{\\sinh\\pi a}-\\frac1a)$. Il punto $x=0$ &egrave; scelto perch&eacute; l&igrave; $f$ &egrave; continua: nessuna semisomma, si usa $f(0)$ direttamente."}]},{"pool":"fourier","src":"Set 3 es.2","steps":[{"t":"Stessa $f_a(x)=e^{ax}$, ma ora si valuta in $x=\\pi$ per ottenere $s_2=\\sum_{n=-\\infty}^{\\infty}\\frac{1}{n^2+a^2}$. Quale valore prende la serie in $\\pi$?","opts":[{"x":"la semisomma $\\tfrac12(f_a(\\pi)+f_a(-\\pi))=\\tfrac12(e^{a\\pi}+e^{-a\\pi})=\\cosh(a\\pi)$: in $\\pi$ la funzione periodica &egrave; DISCONTINUA","c":true},{"x":"$f_a(\\pi)=e^{a\\pi}$, la funzione &egrave; continua"},{"x":"$0$, per antisimmetria"},{"x":"$1$, come in $x=0$"}],"hint":"Estendendo $e^{ax}$ periodicamente, in $x=\\pi$ i due rami valgono $e^{a\\pi}$ (da sinistra) ed $e^{-a\\pi}$ (da destra, cio&egrave; $-\\pi$): salto.","sol":"<b>Identit&agrave; via DISCONTINUIT&Agrave; in $x=\\pi$ (verificato ufficialmente).</b> La periodicizzazione di $e^{ax}$ ha un salto in $\\pi$: per il <b>teorema di Dirichlet</b> $S_a(\\pi)=\\tfrac12(e^{a\\pi}+e^{-a\\pi})=\\cosh(a\\pi)$, NON $e^{a\\pi}$. &Egrave; il contrasto istruttivo con $s_1$: stessa funzione, punto continuo ($0$) vs punto di salto ($\\pi$) &mdash; il secondo membro cambia natura.","cont":"Concludi $s_2$ &rarr;"},{"t":"Da $S_a(\\pi)=\\cosh(a\\pi)$ segue:","opts":[{"x":"$s_2=\\dfrac{\\pi}{a}\\coth(\\pi a)=\\dfrac{\\pi}{a}\\dfrac{\\cosh(a\\pi)}{\\sinh(a\\pi)}$","c":true},{"x":"$s_2=\\dfrac{\\pi}{a}\\tanh(\\pi a)$"},{"x":"$s_2=\\dfrac{\\pi^2}{6}$"},{"x":"$s_2=\\dfrac{1}{a^2}$"}],"hint":"$S_a(\\pi)=\\frac{a\\sinh(a\\pi)}{\\pi}s_2$; poni uguale a $\\cosh(a\\pi)$ e isola $s_2$.","sol":"<b>Somma bilatera $s_2$ (verificato ufficialmente).</b> $S_a(\\pi)=\\frac{a\\sinh(a\\pi)}{\\pi}s_2=\\cosh(a\\pi)$ d&agrave; $s_2=\\frac{\\pi}{a}\\coth(\\pi a)$. Verifica di coerenza: ponendo $a=b$ in $s_3$ si riottiene $s_2$ (usando $\\sinh 2x=2\\sinh x\\cosh x$), come richiede l'esercizio."}]},{"pool":"fourier","src":"20240115 Es.4","steps":[{"t":"$f(x)=\\frac{(x+\\pi)^2}{\\pi}$ su $(-\\pi,0)$ e $0$ su $(0,\\pi)$. Per l'identit&agrave; $\\sum_{n\\ge1}\\frac1{n^2}$ si valuta in $x=0$, dove $f$ &egrave; DISCONTINUA. Quanto vale $S(0)$?","opts":[{"x":"la semisomma $\\tfrac12(f(0^+)+f(0^-))=\\tfrac12(0+\\pi)=\\tfrac{\\pi}{2}$","c":true},{"x":"$f(0)=0$ (ramo destro)"},{"x":"$f(0)=\\pi$ (ramo sinistro)"},{"x":"$0$, media nulla"}],"hint":"$f(0^+)=0$ (dal ramo nullo su $(0,\\pi)$), $f(0^-)=\\frac{(0+\\pi)^2}{\\pi}=\\pi$: la serie prende la MEDIA, non un ramo.","sol":"<b>Teorema di Dirichlet nel salto (compito 15/01/2024).</b> In $x=0$ la funzione periodica salta fra $\\pi$ (sinistra) e $0$ (destra): $S(0)=\\tfrac12(\\pi+0)=\\tfrac{\\pi}{2}$. Usare $f(0)$ (che vale $0$ o $\\pi$ a seconda del ramo) al posto della semisomma d&agrave; l'equazione sbagliata: &egrave; la trappola centrale del tipo (mappa b01).","cont":"Uguaglia alla serie e concludi &rarr;"},{"t":"Con $f_0=\\frac{1}{\\sqrt{2\\pi}}\\frac{\\pi^2}{3}$ e $f_n+f_{-n}=\\frac{1}{\\sqrt{2\\pi}}\\frac{4}{n^2}$, imporre $S(0)=\\frac{\\pi}{2}$ d&agrave;:","opts":[{"x":"$\\frac{1}{2\\pi}\\big[\\frac{\\pi^2}{3}+4\\sum_{n\\ge1}\\frac1{n^2}\\big]=\\frac{\\pi}{2}\\Rightarrow\\sum_{n\\ge1}\\frac1{n^2}=\\frac{\\pi^2}{6}$","c":true},{"x":"$\\sum_{n\\ge1}\\frac1{n^2}=\\frac{\\pi^2}{8}$"},{"x":"$\\sum_{n\\ge1}\\frac1{n^2}=\\frac{\\pi^2}{12}$"},{"x":"$\\sum_{n\\ge1}\\frac1{n^2}=\\frac{\\pi}{2}$"}],"hint":"$S(0)=\\frac{1}{\\sqrt{2\\pi}}[f_0+\\sum(f_n+f_{-n})]=\\frac{1}{2\\pi}[\\frac{\\pi^2}{3}+4\\sum\\frac1{n^2}]$; poni uguale a $\\frac{\\pi}{2}$.","sol":"<b>Identit&agrave; di Basilea $\\zeta(2)=\\frac{\\pi^2}{6}$ (verificato ufficialmente).</b> $\\frac{1}{2\\pi}[\\frac{\\pi^2}{3}+4\\sum\\frac1{n^2}]=\\frac{\\pi}{2}\\Rightarrow\\frac{\\pi^2}{3}+4\\sum\\frac1{n^2}=\\pi^2\\Rightarrow\\sum_{n\\ge1}\\frac1{n^2}=\\frac{\\pi^2}{6}$. La semisomma $\\frac{\\pi}{2}$ del passo precedente &egrave; ci&ograve; che rende l'equazione corretta: cambiando il secondo membro cambia la costante di Basilea."}]},{"pool":"fourier","src":"20240703 Es.3","steps":[{"t":"$f(x)=e^{|x|}$ su $[-1,1]$ ($L=2$), funzione PARI. I coefficienti trigonometrici sono:","opts":[{"x":"$b_n=0$ per parit&agrave;; $a_n=\\dfrac{2(-1)^n(e-1)}{1+\\pi^2n^2}$ e termine costante $e-1$","c":true},{"x":"$a_n=0$ per parit&agrave;; solo $b_n\\neq0$"},{"x":"$a_n=\\dfrac{2(e-1)}{n^2}$"},{"x":"$a_n=\\dfrac{(-1)^n}{1+n^2}$, termine costante $0$"}],"hint":"$f$ pari $\\Rightarrow$ serie di soli coseni ($b_n=0$). L'integrale $\\int_0^1 e^x\\cos(\\pi nx)dx$ d&agrave; il denominatore $1+\\pi^2 n^2$ e il segno $(-1)^n$ da $\\cos(\\pi n)$.","sol":"<b>Coefficienti di $e^{|x|}$ (compito 03/07/2024, verificati).</b> Per parit&agrave; $b_n=0$; integrando $a_n=\\int_{-1}^1 e^{|x|}\\cos(\\pi nx)dx=\\frac{2(-1)^n(e-1)}{1+\\pi^2n^2}$, con termine costante $e-1$. Sono i coefficienti veri della soluzione ufficiale; su di essi poggia l'identit&agrave; numerica.","cont":"Valuta in $x=0$ &rarr;"},{"t":"In $x=0$ la funzione $e^{|x|}$ &egrave; CONTINUA. Il teorema di Dirichlet impone quindi:","opts":[{"x":"$S(0)=f(0)=e^0=1$ &mdash; nessuna semisomma, perch&eacute; non c'&egrave; salto","c":true},{"x":"$S(0)=\\tfrac12(e+e)=e$, semisomma"},{"x":"$S(0)=0$"},{"x":"$S(0)=e-1$"}],"hint":"$e^{|x|}$ &egrave; continua in $0$ (i due rami $e^{x}$ ed $e^{-x}$ combaciano): la serie converge al valore vero $f(0)=1$.","sol":"<b>Continuit&agrave; in $x=0$ (Dirichlet).</b> $e^{|x|}$ &egrave; continua in $0$: $S(0)=f(0)=1$, senza semisomma. Uguagliando $S(0)=e-1+2\\sum_{n\\ge1}\\frac{(-1)^n(e-1)}{1+\\pi^2n^2}$ a $1$ si ottiene un'identit&agrave; per la somma alternante. NOTA DI ONEST&Agrave;: il valore numerico di CHIUSURA di quella somma non lo asserisco qui &mdash; la stampa ufficiale del 03/07/2024 presenta, fra enunciato e passaggio finale, due forme che non ho saputo riconciliare (numeratore $-1+(-1)^n e$ contro $(-1)^n(e-1)$, e costante $(1-e)/2$ contro $(2-e)/2$). Il meccanismo &egrave; solido; il numero finale resta da verificare su fonte pulita."}]},{"pool":"fourier","src":"20240910 Es.2","steps":[{"t":"$\\int_{-\\infty}^{+\\infty}\\frac{\\cos x}{e^x+e^{-x}}dx$ col rettangolo di altezza $\\pi$ ($\\gamma_1$ asse reale, $\\gamma_3$ a quota $i\\pi$). I lati verticali $\\gamma_2,\\gamma_4$:","opts":[{"x":"svaniscono per $R\\to\\infty$: l'integrando $\\sim e^{-y}/(e^R-e^{-R})\\to0$ sui lati $x=\\pm R$","c":true},{"x":"danno un contributo finito da sommare"},{"x":"sono uguali e opposti, si cancellano fra loro"},{"x":"non vanno considerati"}],"hint":"Sui lati verticali $z=\\pm R+iy$: il denominatore $e^{\\pm R}$ cresce mentre il numeratore resta limitato. Stima diretta $\\to0$.","sol":"<b>Lati verticali del rettangolo (compito 10/09/2024, verificato).</b> Su $\\gamma_2,\\gamma_4$ l'integrando &egrave; maggiorato da $\\frac{e^{-y}}{e^R-e^{-R}}\\to0$: svaniscono. Restano i due lati orizzontali. A differenza della semicirconferenza (che qui racchiuderebbe infiniti poli), il rettangolo di altezza fissa ne cattura uno solo, $z=i\\pi/2$.","cont":"Relaziona i due lati orizzontali &rarr;"},{"t":"Sul lato superiore $z=x+i\\pi$ vale $f(x+i\\pi)=-e^{-\\pi}g(x)$, quindi $\\int_{\\gamma_3}=-e^{-\\pi}\\int_{\\gamma_1}$ (con l'orientazione, $+e^{-\\pi}K$). Il risultato &egrave;:","opts":[{"x":"$K(1+e^{-\\pi})=2\\pi i\\,\\mathrm{Res}_{i\\pi/2}=\\pi e^{-\\pi/2}\\Rightarrow I=\\mathrm{Re}\\,K=\\dfrac{\\pi}{2\\cosh(\\pi/2)}$","c":true},{"x":"$I=\\dfrac{\\pi}{\\cosh(\\pi/2)}$"},{"x":"$I=\\dfrac{\\pi}{2}e^{-\\pi/2}$"},{"x":"$I=2\\pi i\\,e^{-\\pi/2}$"}],"hint":"I due lati orizzontali NON si cancellano ma sono proporzionali via $e^{-\\pi}$: $\\int_{\\gamma_1}+\\int_{\\gamma_3}=K(1+e^{-\\pi})$, uguale a $2\\pi i$ per il residuo racchiuso.","sol":"<b>Percorso rettangolare, chiusura (verificato ufficialmente).</b> Il prolungamento $\\frac{e^{iz}}{e^z+e^{-z}}$ soddisfa $f(x+i\\pi)=-e^{-\\pi}g(x)$: i lati orizzontali sono proporzionali, non opposti, e $K(1+e^{-\\pi})=2\\pi i\\,\\mathrm{Res}_{i\\pi/2}=\\pi e^{-\\pi/2}$. Prendendo la parte reale, $I=\\frac{\\pi}{2\\cosh(\\pi/2)}$. La proporzionalit&agrave; per periodicit&agrave; dell'esponenziale &egrave; ci&ograve; che rende il rettangolo, e non il semicerchio, lo strumento giusto."}]},{"pool":"fourier","src":"Set 3 es.7","steps":[{"t":"La trasformata di $f_1(x)=\\sin(x)e^{-x^2}$ NON usa i residui ma il completamento del quadrato. La strategia &egrave;:","opts":[{"x":"scrivere $\\sin x=\\frac{e^{ix}-e^{-ix}}{2i}$, completare il quadrato all'esponente e usare $\\int e^{-(x+c)^2}dx=\\sqrt{\\pi}$ (valido anche per $c$ complesso)","c":true},{"x":"chiudere il contorno nel semipiano superiore e sommare i residui"},{"x":"sviluppare $e^{-x^2}$ in serie e integrare termine a termine"},{"x":"usare il percorso rettangolare"}],"hint":"La gaussiana non ha poli: niente residui. Il trucco &egrave; ricondurre l'esponente a un quadrato perfetto e usare l'integrale gaussiano noto.","sol":"<b>Trasformata di una gaussiana modulata (Set 3 es.7, verificato).</b> $\\hat f_1(k)=\\frac{1}{2i}\\int[e^{-x^2-i(k-1)x}-e^{-x^2-i(k+1)x}]dx$; completando il quadrato, $\\int e^{-(x+i(k\\mp1)/2)^2}dx=\\sqrt{\\pi}$ (traslazione complessa del cammino, lecita perch&eacute; $e^{-z^2}$ &egrave; intera). Risultato $\\hat f_1(k)=\\frac{\\sqrt{\\pi}}{2i}\\big(e^{-(k-1)^2/4}-e^{-(k+1)^2/4}\\big)$: due gaussiane traslate a $\\pm1$, firma della modulazione $\\sin x$."}]},{"pool":"fourier","src":"Set 3 es.4","steps":[{"t":"$g_2(x)=\\int_{-\\infty}^{+\\infty}\\frac{e^{-(x-y)^2}}{y^2+1}dy$ &egrave; una CONVOLUZIONE. La sua trasformata si ottiene:","opts":[{"x":"come PRODOTTO delle trasformate: $\\hat g_2=\\hat f_1\\cdot\\hat f_2$ con $f_1=e^{-x^2},\\,f_2=\\frac{1}{x^2+1}$, per il teorema di convoluzione","c":true},{"x":"come somma $\\hat f_1+\\hat f_2$"},{"x":"come convoluzione delle trasformate"},{"x":"calcolando l'integrale doppio direttamente"}],"hint":"$g_2=f_1*f_2$: la trasformata di una convoluzione &egrave; il prodotto delle trasformate. Entrambe le trasformate sono note ($\\sqrt\\pi e^{-k^2/4}$ e $\\pi e^{-|k|}$).","sol":"<b>Teorema di convoluzione (Set 3 es.4, verificato).</b> $\\widehat{f_1*f_2}=\\hat f_1\\hat f_2$. Con $\\hat f_1(k)=\\sqrt{\\pi}\\,e^{-k^2/4}$ (gaussiana) e $\\hat f_2(k)=\\pi e^{-|k|}$ (lorentziana, via residui), $\\hat g_2(k)=\\pi^{3/2}e^{-|k|-k^2/4}$. Riconoscere la convoluzione converte un integrale in un prodotto: &egrave; il vantaggio del passaggio in trasformata."}]},{"pool":"fourier","src":"Set 3 es.2","steps":[{"t":"La terza somma $s_3=\\sum_{n=-\\infty}^{\\infty}\\frac{1}{(n+ia)(n-ib)}$ si ricava con una tecnica diversa da $s_1,s_2$. Quale?","opts":[{"x":"il PRODOTTO SCALARE $\\langle S_b|S_a\\rangle$ di due serie con parametri diversi, sfruttando l'ortonormalit&agrave; delle esponenziali","c":true},{"x":"valutando la serie in un ulteriore punto $x_0$"},{"x":"derivando $s_2$ rispetto ad $a$"},{"x":"il teorema dei residui su un cerchio"}],"hint":"$s_3$ mescola DUE parametri $a,b$: nasce dal prodotto scalare di $|S_a\\rangle$ e $|S_b\\rangle$, non dalla valutazione in un punto.","sol":"<b>Somma via prodotto scalare (Set 3 es.2, verificato).</b> $\\langle S_b|S_a\\rangle=\\frac{2}{\\pi}\\sinh(a\\pi)\\sinh(b\\pi)\\sum\\frac{1}{(b+in)(a-in)}$ per l'ortonormalit&agrave; di $\\{e^{inx}\\}$; ma $\\langle S_b|S_a\\rangle=\\int_{-\\pi}^{\\pi}e^{(a+b)x}dx$ perch&eacute; serie e funzione coincidono q.o. (identit&agrave; di Parseval/Plancherel).","cont":"Il risultato &rarr;"},{"t":"Uguagliando le due espressioni di $\\langle S_b|S_a\\rangle$:","opts":[{"x":"$s_3=\\dfrac{\\pi}{a+b}\\dfrac{\\sinh[(a+b)\\pi]}{\\sinh(a\\pi)\\sinh(b\\pi)}$","c":true},{"x":"$s_3=\\dfrac{\\pi}{ab}\\coth(a\\pi)\\coth(b\\pi)$"},{"x":"$s_3=\\dfrac{\\pi^2}{6}$"},{"x":"$s_3=\\dfrac{1}{a+b}$"}],"hint":"$\\int_{-\\pi}^{\\pi}e^{(a+b)x}dx=\\frac{2\\sinh[(a+b)\\pi]}{a+b}$; isola la somma.","sol":"<b>Somma a due parametri $s_3$ (verificato ufficialmente).</b> $s_3=\\frac{\\pi}{a+b}\\frac{\\sinh[(a+b)\\pi]}{\\sinh(a\\pi)\\sinh(b\\pi)}$. Controllo: per $a=b$, con $\\sinh(2a\\pi)=2\\sinh(a\\pi)\\cosh(a\\pi)$, si riottiene $s_2=\\frac{\\pi}{a}\\coth(a\\pi)$. La coerenza fra $s_2$ e $s_3$ &egrave; la verifica interna dell'esercizio."}]},{"pool":"fourier","src":"tipo &middot; nucleo 13","steps":[{"t":"Per $\\int f(x)\\cos(kx)\\,dx$ via residui, spezzando $\\cos(kx)=\\tfrac12(e^{ikx}+e^{-ikx})$, l'errore da evitare &egrave;:","opts":[{"x":"chiudere ENTRAMBI gli esponenziali nello stesso semipiano: $e^{ikx}$ ed $e^{-ikx}$ decadono in semipiani OPPOSTI, ciascuno va chiuso nel suo","c":true},{"x":"spezzare il coseno: non &egrave; mai lecito"},{"x":"prendere la parte reale alla fine"},{"x":"usare i residui invece della primitiva"}],"hint":"$e^{ikx}$ vuole un semipiano, $e^{-ikx}$ quello opposto: forzarli nello stesso contorno fa esplodere uno dei due archi.","sol":"<b>Semipiani opposti per i due esponenziali (nucleo 13).</b> Si pu&ograve; spezzare $\\cos(kx)$, ma ogni termine va chiuso nel PROPRIO semipiano secondo il segno della sua frequenza (come nei tre casi di $\\cos(ax)/(x^2+b^2)$). In alternativa, si calcola $\\int f(x)e^{ikx}dx$ una volta sola e si prende alla fine parte reale (coseno) o immaginaria (seno): pi&ugrave; sicuro, un solo contorno."}]},{"pool":"fourier","src":"20230704 Es.3","steps":[{"t":"Due funzioni: $f$ ha polo in $z=-i$; $g$ ha poli in $z=1-2i$ e $z=-3+i/2$. Quale $\\hat{}$ decade pi&ugrave; rapidamente per $k\\to+\\infty$?","opts":[{"x":"$\\hat g$: per $k>0$ contano i poli INFERIORI, $g$ ha $z=1-2i$ ($|\\mathrm{Im}|=2$) contro $z=-i$ di $f$ ($|\\mathrm{Im}|=1$), quindi $\\hat g\\sim e^{-2k}$ batte $\\hat f\\sim e^{-k}$","c":true},{"x":"$\\hat f$, perch&eacute; ha un solo polo"},{"x":"decadono ugualmente"},{"x":"$\\hat g$, ma governata dal polo $-3+i/2$"}],"hint":"Per $k\\to+\\infty$ si chiude sotto: domina il polo inferiore pi&ugrave; VICINO all'asse. $f$: $|\\mathrm{Im}|=1$. $g$: fra i poli inferiori c'&egrave; solo $1-2i$, $|\\mathrm{Im}|=2$.","sol":"<b>Confronto dei decadimenti (compito 04/07/2023, verificato).</b> Per $k\\to+\\infty$ conta il polo inferiore con $|\\mathrm{Im}|$ minimo: $f$ decade come $e^{-k}$, $g$ come $e^{-2k}$ (pi&ugrave; veloce). Per $k\\to-\\infty$ contano i poli superiori: $g$ ha $-3+i/2$ ($|\\mathrm{Im}|=1/2$) e decade come $e^{k/2}$, pi&ugrave; lento di $\\hat f\\sim e^{k}$. La posizione dei poli detta la coda della trasformata (Set 3 es.6)."}]},{"pool":"fourier","src":"tipo &middot; b01","steps":[{"t":"Il teorema di Dirichlet interviene sia nelle serie sia nelle trasformate. La distinzione strutturale corretta &egrave;:","opts":[{"x":"in ENTRAMBE, in un salto il valore ricostruito &egrave; la semisomma dei limiti; la serie somma modi DISCRETI $e^{inx}$, la trasformata integra un continuo di modi $e^{ikx}$","c":true},{"x":"il teorema vale solo per le serie, non per le trasformate"},{"x":"nelle trasformate il salto d&agrave; sempre $0$"},{"x":"nelle serie il valore in un salto &egrave; $f(x_0)$, nelle trasformate la semisomma"}],"hint":"Serie e trasformata sono lo stesso principio a spettro discreto vs continuo; il comportamento nei salti (semisomma) &egrave; identico.","sol":"<b>Serie vs trasformata, stesso Dirichlet.</b> La serie di Fourier decompone su modi discreti $e^{inx}$ (dominio finito, spettro $n\\in\\mathbb{Z}$); la trasformata su un continuo $e^{ikx}$ (dominio $\\mathbb{R}$, spettro $k\\in\\mathbb{R}$). In un salto entrambe ricostruiscono la SEMISOMMA $\\tfrac12(f(x_0^+)+f(x_0^-))$: lo si &egrave; visto sia in $\\hat{\\hat f}(0)=\\tfrac12$ (16/11/2023) sia nelle identit&agrave; $\\zeta(2)$ e $\\sum(2n+1)^{-2}$. Cross-domain: in meccanica quantistica questi sono spettro legato (discreto) vs spettro di scattering (continuo) dello stesso operatore."}]},{"pool":"fourier","src":"Set 3 es.3","steps":[{"t":"$f_2(x)=-x$ su $(-1,0)$ e $\\tfrac12$ su $(0,1)$, periodicizzata ($L=2$). Nei punti di salto $x=0$ e $x=1$, il teorema di Dirichlet d&agrave;:","opts":[{"x":"$S(0)=\\tfrac12(f(0^+)+f(0^-))=\\tfrac12(\\tfrac12+0)=\\tfrac14$ e $S(1)=\\tfrac12(f(1^+)+f(1^-))=\\tfrac12(1+\\tfrac12)=\\tfrac34$","c":true},{"x":"$S(0)=\\tfrac12$ e $S(1)=1$, i valori del ramo destro"},{"x":"$S(0)=0$ e $S(1)=\\tfrac12$, i valori del ramo sinistro"},{"x":"$S(0)=S(1)=0$"}],"hint":"In $0$: $f(0^-)=-x|_{0^-}=0$, $f(0^+)=\\tfrac12$. In $1$: $f(1^-)=\\tfrac12$, $f(1^+)=f(-1^+)=-x|_{-1^+}=1$ (periodicit&agrave;). Media, non ramo.","sol":"<b>Dirichlet in due salti (Set 3 es.3, verificato).</b> $S(0)=\\tfrac12(0+\\tfrac12)=\\tfrac14$; $S(1)=\\tfrac12(\\tfrac12+1)=\\tfrac34$, dove $f(1^+)$ si legge dalla periodicizzazione ($=f(-1^+)=1$). Ogni punto di discontinuit&agrave; d&agrave; la sua semisomma indipendentemente: la funzione periodica &laquo;vede&raquo; il salto anche al bordo del periodo.","cont":"Estrai l'identit&agrave; numerica &rarr;"},{"t":"Da $S(0)=\\tfrac14$, con $S(0)=\\tfrac12+\\tfrac1{\\pi^2}\\sum_{n\\ge1}\\frac{(-1)^n-1}{n^2}$, segue:","opts":[{"x":"$\\sum_{n=0}^{\\infty}\\dfrac{1}{(2n+1)^2}=\\dfrac{\\pi^2}{8}$","c":true},{"x":"$\\sum_{n=0}^{\\infty}\\dfrac{1}{(2n+1)^2}=\\dfrac{\\pi^2}{6}$"},{"x":"$\\sum_{n=1}^{\\infty}\\dfrac{1}{n^2}=\\dfrac{\\pi^2}{12}$"},{"x":"$\\sum_{n=0}^{\\infty}\\dfrac{1}{(2n+1)^2}=\\dfrac{\\pi^2}{4}$"}],"hint":"$(-1)^n-1$ vale $0$ per $n$ pari e $-2$ per $n$ dispari: la somma si riduce ai soli dispari, cio&egrave; $\\sum 1/(2n+1)^2$.","sol":"<b>Identit&agrave; dei dispari (verificato ufficialmente).</b> $S(0)=\\tfrac12-\\tfrac2{\\pi^2}\\sum_{n\\ge0}\\frac1{(2n+1)^2}=\\tfrac14\\Rightarrow\\sum_{n\\ge0}\\frac1{(2n+1)^2}=\\frac{\\pi^2}{8}$. Coerente con Basilea: $\\sum\\frac1{n^2}=\\sum_{pari}+\\sum_{dispari}=\\frac14\\zeta(2)+\\frac{\\pi^2}{8}$, che ridà $\\zeta(2)=\\frac{\\pi^2}{6}$. La semisomma $\\tfrac14$ del passo precedente &egrave; ci&ograve; che chiude il conto."}]},{"pool":"fourier","src":"20260212 Es.4","steps":[{"t":"PDE $\\partial_t u = t^2\\,\\partial_x^2 u$ su $x\\in[0,\\pi)$, $t\\ge0$, con $\\partial_x u\\big|_{x=0}=\\partial_x u\\big|_{x=\\pi}=0$ e $u(0,x)=g(x)$. Ponendo $u=\\varphi(t)\\psi(x)$, a cosa si riduce e perché la costante di separazione è davvero costante?","opts":[{"x":"$\\dfrac{\\dot\\varphi}{t^2\\varphi}=\\dfrac{\\psi''}{\\psi}=\\lambda$: il membro sinistro dipende solo da $t$, il destro solo da $x$, quindi entrambi valgono la stessa costante","c":true},{"x":"$\\dfrac{\\dot\\varphi}{\\varphi}=\\dfrac{\\psi''}{\\psi}=\\lambda$: il fattore $t^2$ si assorbe e sparisce"},{"x":"non è separabile, perché il coefficiente $t^2$ dipende dal tempo"}],"hint":"Il fattore $t^2$ resta dalla parte temporale, ma è funzione della sola $t$: la separazione regge lo stesso.","sol":"Metodo di separazione delle variabili. Dividendo per $t^2\\varphi\\psi$ si ottiene $\\dot\\varphi/(t^2\\varphi)=\\psi''/\\psi$. Il primo membro dipende solo da $t$, il secondo solo da $x$: due funzioni di variabili indipendenti uguali ovunque sono necessariamente una stessa costante $\\lambda$.","cont":"Autovalori spaziali"},{"t":"Risolvendo $\\psi''=\\lambda\\psi$ con le condizioni di Neumann $\\psi'(0)=\\psi'(\\pi)=0$: quali autofunzioni si selezionano, e cosa cambierebbe con condizioni di Dirichlet $\\psi(0)=\\psi(\\pi)=0$?","opts":[{"x":"Neumann seleziona $\\psi_n(x)=\\cos(nx)$ con $\\lambda_n=-n^2$, $n=0,1,2,\\dots$ (incluso il modo costante $n=0$); Dirichlet selezionerebbe invece $\\sin(nx)$ e non ammetterebbe il modo $n=0$","c":true},{"x":"in entrambi i casi si ottengono i $\\cos(nx)$, la condizione al bordo non cambia la base"},{"x":"Neumann seleziona i $\\sin(nx)$, perché la derivata di un seno si annulla al bordo"}],"hint":"È la derivata a doversi annullare: $\\psi'\\propto\\sin(nx)$ si annulla in $0$ e $\\pi$, quindi $\\psi\\propto\\cos(nx)$. Il modo $n=0$ (costante) ha derivata nulla ovunque e va incluso.","sol":"Problema di Sturm-Liouville con estremi liberi. Le soluzioni oscillanti sono $\\cos(\\sqrt{-\\lambda}\\,x)$; $\\psi'(0)=0$ è automatica, $\\psi'(\\pi)=0$ impone $\\sqrt{-\\lambda}\\,\\pi=n\\pi$, cioè $\\lambda_n=-n^2$, $\\psi_n=\\cos(nx)$. La condizione di Neumann è ciò che ammette il modo costante $n=0$: con Dirichlet quel modo (e la media) sarebbe proibito e la base sarebbe di soli seni.","cont":"Parte temporale"},{"t":"Con $\\lambda_n=-n^2$, la parte temporale risolve $\\dot\\varphi_n = \\lambda_n t^2\\varphi_n$. Qual è la sua forma?","opts":[{"x":"$\\varphi_n(t)=\\varphi_{n,0}\\,e^{-n^2 t^3/3}$: separando, $\\int d\\varphi/\\varphi = -n^2\\int t^2\\,dt = -n^2 t^3/3$","c":true},{"x":"$\\varphi_n(t)=\\varphi_{n,0}\\,e^{-n^2 t}$, come nel calore standard"},{"x":"$\\varphi_n(t)=\\varphi_{n,0}\\,e^{-n^2 t^2}$"}],"hint":"L'esponente è la primitiva di $-n^2 t^2$, non di $-n^2$: compare $t^3/3$, non $t$.","sol":"EDO lineare a variabili separabili: $d\\varphi/\\varphi=-n^2 t^2 dt$ integra in $\\ln\\varphi=-n^2 t^3/3+\\text{cost}$. Il coefficiente $t^2$ della PDE si riflette nel decadimento $e^{-n^2 t^3/3}$, più rapido a tempi grandi del $e^{-n^2 t}$ ordinario.","cont":"Coefficienti"},{"t":"La soluzione generale è $u(t,x)=\\sum_{n\\ge0} c_n\\,e^{-n^2 t^3/3}\\cos(nx)$ e la IC dà $g(x)=c_0+\\sum_{n\\ge1}c_n\\cos(nx)$. Come si estraggono i $c_n$?","opts":[{"x":"per ortogonalità dei coseni su $[0,\\pi]$: $c_0=\\frac1\\pi\\int_0^\\pi g\\,dx$ e $c_{n\\ge1}=\\frac2\\pi\\int_0^\\pi g(x)\\cos(nx)\\,dx$","c":true},{"x":"$c_n=\\frac1{2\\pi}\\int_0^\\pi g(x)\\cos(nx)\\,dx$ per ogni $n$, incluso $n=0$"},{"x":"$c_n=\\frac2\\pi\\int_0^\\pi g(x)\\sin(nx)\\,dx$, con i seni"}],"hint":"$\\int_0^\\pi\\cos^2(nx)\\,dx=\\pi/2$ per $n\\ge1$ ma $=\\pi$ per $n=0$: da qui il fattore doppio sul termine $c_0$.","sol":"Coefficienti di Fourier in coseno (serie di Fourier del prolungamento pari). L'ortogonalità $\\int_0^\\pi\\cos(nx)\\cos(mx)\\,dx=\\tfrac\\pi2\\delta_{nm}$ ($n,m\\ge1$) e $\\int_0^\\pi 1\\,dx=\\pi$ danno le due normalizzazioni distinte per $c_0$ e $c_{n\\ge1}$.","cont":"Caso g=x^2"},{"t":"Specializzando a $g(x)=x^2$: quanto valgono $c_0$ e $c_{n\\ge1}$?","opts":[{"x":"$c_0=\\dfrac{\\pi^2}{3}$ e $c_{n}=\\dfrac{4(-1)^n}{n^2}$","c":true},{"x":"$c_0=\\dfrac{\\pi^2}{3}$ e $c_{n}=\\dfrac{2(-1)^n}{n}$"},{"x":"$c_0=\\dfrac{2\\pi^2}{3}$ e $c_{n}=\\dfrac{4}{n^2}$"}],"hint":"$c_0=\\frac1\\pi\\int_0^\\pi x^2 dx=\\frac{\\pi^2}{3}$. Per $c_n$ due integrazioni per parti: $\\int_0^\\pi x^2\\cos(nx)dx=\\frac{2\\pi(-1)^n}{n^2}$.","sol":"Integrazione per parti (due volte). $c_0=\\frac1\\pi\\cdot\\frac{\\pi^3}{3}=\\frac{\\pi^2}{3}$; $c_n=\\frac2\\pi\\int_0^\\pi x^2\\cos(nx)dx=\\frac2\\pi\\cdot\\frac{2\\pi(-1)^n}{n^2}=\\frac{4(-1)^n}{n^2}$ (il termine di bordo $\\sin(n\\pi)=0$).","cont":"Limite t grande"},{"t":"Verifica: per $t\\to\\infty$ la soluzione tende a $u\\to \\pi^2/3$. Perché proprio quel valore, e cosa lo garantisce?","opts":[{"x":"tutti i modi $n\\ge1$ decadono ($e^{-n^2 t^3/3}\\to0$), resta il solo modo $n=0$, $c_0=\\pi^2/3$, che è la MEDIA di $g$ su $[0,\\pi]$: le BC di Neumann conservano l'integrale (flusso nullo al bordo)","c":true},{"x":"tende a zero, perché tutti i modi della serie decadono nel tempo"},{"x":"tende a $g(\\pi/2)$, valore centrale del dominio"}],"hint":"Neumann = flusso nullo agli estremi: $\\frac{d}{dt}\\int_0^\\pi u\\,dx=t^2[\\partial_x u]_0^\\pi=0$. La media è un invariante.","sol":"Il modo $n=0$ è stazionario e uguale alla media iniziale $\\frac1\\pi\\int_0^\\pi g=c_0$. Con Neumann $\\frac{d}{dt}\\int u\\,dx = t^2\\,[\\partial_x u]_0^\\pi=0$: l'integrale (dunque la media) è conservato, e il calore ridistribuisce il resto fino all'equilibrio uniforme $\\pi^2/3$. Con Dirichlet, invece, il modo $n=0$ non esiste e $u\\to0$.","cont":null}]},{"pool":"fourier","src":"20262001 Es.4","steps":[{"t":"Corda di lunghezza $L$ fissata agli estremi, equazione delle onde $\\partial_t^2 y=c^2\\partial_x^2 y$ con $y(0,t)=y(L,t)=0$. Quale base spaziale impongono le condizioni al bordo, e perché non i coseni?","opts":[{"x":"i seni $\\sin(n\\pi x/L)$: annullarsi agli estremi (Dirichlet) esclude il coseno, che in $x=0$ vale $1\\neq0$","c":true},{"x":"i coseni $\\cos(n\\pi x/L)$, che si annullano al bordo per parità"},{"x":"le esponenziali $e^{in\\pi x/L}$, senza restrizioni di parità"}],"hint":"$y(0,t)=0$ per ogni $t$ impone $\\psi(0)=0$: $\\cos(0)=1$ è escluso, resta il seno.","sol":"Problema di Sturm-Liouville con estremi fissi (Dirichlet). $\\psi(0)=\\psi(L)=0$ seleziona $\\psi_n=\\sin(n\\pi x/L)$, $\\lambda_n=-(n\\pi/L)^2$. Il coseno è escluso perché $\\cos(0)=1$ viola $\\psi(0)=0$; a differenza del caso Neumann, qui non c'è modo $n=0$.","cont":"Forma della soluzione"},{"t":"Con $y(x,0)=0$ e velocità iniziale $\\partial_t y|_{t=0}=\\frac{4V}{L^2}x(L-x)$, la soluzione generale $y=\\sum_n[\\alpha_n e^{i\\omega_n t}+\\beta_n e^{-i\\omega_n t}]\\sin(n\\pi x/L)$ ($\\omega_n=n\\pi c/L$) si riduce a quale forma?","opts":[{"x":"$y=\\sum_{n\\ge1}\\gamma_n\\sin(\\omega_n t)\\sin(n\\pi x/L)$: $y(x,0)=0$ impone $\\beta_n=-\\alpha_n$, che lascia solo la parte $\\sin(\\omega_n t)$","c":true},{"x":"$y=\\sum_{n\\ge1}\\gamma_n\\cos(\\omega_n t)\\sin(n\\pi x/L)$, dalla condizione sulla velocità"},{"x":"$y=\\sum_{n\\ge1}\\gamma_n\\,e^{-\\omega_n t}\\sin(n\\pi x/L)$"}],"hint":"$y(x,0)=0$ tocca la parte temporale in $t=0$: $\\alpha_n+\\beta_n=0$. Ciò che sopravvive è dispari in $t$, cioè il seno.","sol":"Sovrapposizione dei modi normali. La condizione $y(x,0)=0$ impone $\\alpha_n+\\beta_n=0$, quindi la combinazione temporale diventa $\\propto\\sin(\\omega_n t)$ (parte dispari), con $\\gamma_n\\equiv 2i\\alpha_n$. Il modo di posizione iniziale nulla e velocità non nulla è esattamente $\\sin(\\omega_n t)$.","cont":"Coefficienti"},{"t":"Imponendo $\\partial_t y|_{t=0}=\\sum_n\\gamma_n\\omega_n\\sin(n\\pi x/L)=\\frac{4V}{L^2}x(L-x)$: quanto vale $\\gamma_n\\omega_n$?","opts":[{"x":"$\\gamma_n\\dfrac{n\\pi c}{L}=\\dfrac{8V}{n\\pi}\\cdot\\dfrac{[1-(-1)^n]}{ \\pi^2}\\;\\Rightarrow\\;\\dfrac{16LV}{n^3\\pi^3}$ per $n$ dispari, $0$ per $n$ pari","c":true},{"x":"$\\gamma_n\\omega_n=\\dfrac{4V}{n^2\\pi^2}$ per ogni $n$"},{"x":"$\\gamma_n\\omega_n=\\dfrac{8LV}{n\\pi}$, senza dipendenza dalla parità di $n$"}],"hint":"Proietta su $\\sin(n\\pi x/L)$: $\\int_0^L x(L-x)\\sin(n\\pi x/L)dx=\\frac{2L^3}{n^3\\pi^3}[1-(-1)^n]$. Il fattore $[1-(-1)^n]$ uccide i pari.","sol":"Coefficienti di Fourier in seno, con ortogonalità $\\int_0^L\\sin(n\\pi x/L)\\sin(m\\pi x/L)dx=\\frac L2\\delta_{nm}$. Dopo due integrazioni per parti $\\int_0^L x(L-x)\\sin(n\\pi x/L)dx=\\frac{2L^3}{n^3\\pi^3}[1-(-1)^n]$, da cui $\\gamma_n\\omega_n L/2=\\frac{4V}{L^2}\\cdot\\frac{2L^3}{n^3\\pi^3}[1-(-1)^n]$. Restano i soli $n$ dispari.","cont":"Soluzione finale"},{"t":"Ricomponendo (solo $n=2m+1$), la soluzione è $y(x,t)=\\sum_{m\\ge0}\\frac{32LV}{c\\pi^4(2m+1)^4}\\sin\\!\\big[\\frac{\\pi c(2m+1)t}{L}\\big]\\sin\\!\\big[\\frac{\\pi(2m+1)x}{L}\\big]$. Per l'identità richiesta, in quale punto conviene valutare $\\partial_t y|_{t=0}$, e perché lì?","opts":[{"x":"in $x=L/2$: lì $\\sin[(2m+1)\\pi/2]=(-1)^m$, che trasforma la serie in $\\sum(-1)^m/(2m+1)^3$, ed è anche il punto in cui $x(L-x)$ è massimo e regolare","c":true},{"x":"in $x=0$, dove la serie si annulla e dà l'identità direttamente"},{"x":"in $x=L$, dove $\\sin$ assume il valore $1$ per ogni modo"}],"hint":"Serve far comparire il segno alternato $(-1)^m$: è $\\sin[(2m+1)\\pi/2]$ a produrlo, e vale $1$ solo in $x=L/2$.","sol":"Teorema di Dirichlet (convergenza puntuale nei punti di continuità): $\\partial_t y|_{t=0}$ è continua e vale la sua serie in ogni $x$. In $x=L/2$, $\\sin[(2m+1)\\pi/2]=(-1)^m$ e $x(L-x)=L^2/4$, sicché l'uguaglianza serie=funzione diventa un'identità numerica sui $(2m+1)^{-3}$.","cont":"Identità"},{"t":"Valutando $\\partial_t y|_{t=0}=\\frac{32V}{\\pi^3}\\sum_{m\\ge0}\\frac{\\sin[(2m+1)\\pi/2]}{(2m+1)^3}$ in $x=L/2$ dove $\\frac{4V}{L^2}x(L-x)=V$, quale identità si ottiene? E perché la convergenza è garantita?","opts":[{"x":"$\\displaystyle\\sum_{m\\ge0}\\frac{(-1)^m}{(2m+1)^3}=\\frac{\\pi^3}{32}$: la serie converge assolutamente ($\\sim n^{-3}$), quindi la valutazione puntuale è lecita","c":true},{"x":"$\\displaystyle\\sum_{m\\ge0}\\frac{(-1)^m}{(2m+1)^3}=\\frac{\\pi^3}{16}$"},{"x":"$\\displaystyle\\sum_{m\\ge0}\\frac{1}{(2m+1)^3}=\\frac{\\pi^3}{32}$ (senza segno alternato)"}],"hint":"$\\frac{32V}{\\pi^3}\\cdot S=V\\Rightarrow S=\\pi^3/32$. Il decadimento $n^{-3}$ è più che sufficiente per la convergenza assoluta.","sol":"Uguagliando $\\frac{32V}{\\pi^3}\\sum\\frac{(-1)^m}{(2m+1)^3}=V$ si isola $\\sum(-1)^m/(2m+1)^3=\\pi^3/32$. La serie converge assolutamente perché $|a_n|\\sim n^{-3}$ (criterio del confronto con $\\sum n^{-p}$, $p>1$): l'identità non è formale ma un valore numerico esatto (funzione beta di Dirichlet $\\beta(3)$).","cont":null}]},{"pool":"fourier","src":"20251105 Es.4","steps":[{"t":"Calore periodico $\\partial_t f=\\partial_x^2 f$ su $0\\le x<2\\pi$, $f$ periodica, con $f(x,0)=\\sin(2x)-\\cos(x)$. Prima di calcolare qualsiasi integrale: perché conviene la base di Fourier e cosa ha di speciale QUESTA condizione iniziale?","opts":[{"x":"la periodicità rende $e^{inx}$ (o $\\cos nx,\\sin nx$) autofunzioni di $\\partial_x^2$; e la IC è GIÀ una combinazione finita di quelle autofunzioni, quindi è già la propria serie di Fourier: nessun integrale di proiezione serve","c":true},{"x":"conviene comunque calcolare $a_n=\\frac1\\pi\\int_0^{2\\pi}f(x,0)\\cos(nx)dx$ per ogni $n$, come sempre"},{"x":"conviene la trasformata di Fourier continua, perché il dominio è illimitato"}],"hint":"$\\sin(2x)$ e $\\cos(x)$ sono già elementi della base: leggere i coefficienti è immediato, gli integrali darebbero gli stessi numeri con più fatica.","sol":"Su dominio periodico $\\{\\cos nx,\\sin nx\\}$ diagonalizzano $\\partial_x^2$ (autovalore $-n^2$). Poiché $f(x,0)=\\sin 2x-\\cos x$ è già finita combinazione di autofunzioni, per l'unicità dello sviluppo di Fourier i coefficienti si leggono a vista: $b_2=1$, $a_1=-1$, tutti gli altri nulli. Gli integrali di proiezione sono superflui.","cont":"Evoluzione dei modi"},{"t":"Inserendo $f=\\sum_n[a_n(t)\\cos nx+b_n(t)\\sin nx]$ nella PDE, che EDO soddisfa ciascun coefficiente?","opts":[{"x":"$\\dot a_n=-n^2 a_n$ (idem per $b_n$), quindi $a_n(t)=a_n(0)e^{-n^2 t}$","c":true},{"x":"$\\dot a_n=-n\\,a_n$, quindi $a_n(t)=a_n(0)e^{-nt}$"},{"x":"$\\ddot a_n=-n^2 a_n$, oscillazioni $\\cos(nt)$"}],"hint":"$\\partial_x^2\\cos nx=-n^2\\cos nx$: ogni modo evolve indipendentemente con la propria costante $-n^2$.","sol":"Sostituendo e usando l'indipendenza lineare della base (i coefficienti di funzioni base diverse si uguagliano separatamente): $\\dot a_n=-n^2 a_n$, EDO del primo ordine con soluzione $a_n(t)=a_n(0)e^{-n^2 t}$. La derivata seconda in $x$ diventa moltiplicazione per $-n^2$: è questo che rende il calore risolubile modo per modo.","cont":"Soluzione"},{"t":"Mettendo tutto insieme, qual è $f(x,t)$?","opts":[{"x":"$f(x,t)=-e^{-t}\\cos x+e^{-4t}\\sin(2x)$","c":true},{"x":"$f(x,t)=-e^{-t}\\cos x+e^{-2t}\\sin(2x)$"},{"x":"$f(x,t)=e^{-t}(\\sin 2x-\\cos x)$"}],"hint":"Ogni modo porta il proprio $n^2$: il modo $\\cos x$ ha $n=1\\to e^{-t}$, il modo $\\sin 2x$ ha $n=2\\to e^{-4t}$.","sol":"Ciascun coefficiente iniziale si moltiplica per il proprio fattore $e^{-n^2 t}$: $a_1=-1\\to-e^{-t}$, $b_2=1\\to e^{-4t}$. Da cui $f=-e^{-t}\\cos x+e^{-4t}\\sin 2x$.","cont":"Perché il modo alto muore prima"},{"t":"Perché, a tempi lunghi, il termine $e^{-4t}\\sin 2x$ svanisce prima di $e^{-t}\\cos x$, e cosa dice questo del calore?","opts":[{"x":"i modi con $n$ più grande decadono come $e^{-n^2 t}$, quindi molto più in fretta: il calore è regolarizzante, smorza per prime le componenti a piccola scala (alta frequenza)","c":true},{"x":"decade prima perché ha ampiezza minore all'istante iniziale"},{"x":"non è vero: essendo un seno, oscilla e non decade"}],"hint":"Il tasso è $n^2$, non $n$: raddoppiare $n$ quadruplica il tasso di smorzamento.","sol":"Il fattore $e^{-n^2 t}$ penalizza quadraticamente la frequenza: i dettagli fini (grande $n$) spariscono per primi. È la proprietà regolarizzante (smoothing) dell'equazione del calore, opposta al comportamento dell'equazione delle onde dove ogni modo mantiene ampiezza costante. A $t\\to\\infty$ resta solo la media (qui zero).","cont":"Cosa rende speciale questa IC"},{"t":"Verifica strutturale: la soluzione $f(x,t)=-e^{-t}\\cos x+e^{-4t}\\sin 2x$ resta una combinazione FINITA di modi a ogni $t$. Cosa sarebbe cambiato con una condizione iniziale generica, per esempio un'onda quadra?","opts":[{"x":"una IC generica va prima proiettata sulla base con gli integrali $\\frac1\\pi\\int_0^{2\\pi}f_0\\cos(nx)dx$ (infiniti coefficienti $\\neq0$), e la soluzione diventa una serie infinita $\\sum_n c_n e^{-n^2 t}(\\dots)$; qui la finitezza è dovuta al fatto che l'IC è già un polinomio trigonometrico","c":true},{"x":"nulla: qualunque IC produce sempre una somma finita di modi"},{"x":"con un'IC generica la PDE non sarebbe risolubile"}],"hint":"La finitezza è un regalo di questa IC; un'onda quadra ha infinite armoniche, tutte da far evolvere con il proprio $e^{-n^2t}$.","sol":"Unicità e linearità dello sviluppo di Fourier. Una IC generica ha infiniti coefficienti $c_n=\\langle e_n,f_0\\rangle$ non nulli, ciascuno evoluto con $e^{-n^2 t}$: la soluzione è una serie infinita. La combinazione finita qui è un caso particolare, non la regola; il metodo (proietta ed evolvi modo per modo) resta lo stesso."}]},{"pool":"fourier","src":"Trasformata via rettangolo (cos(ax)/cosh) - da Manchester PHYS30672 - manuale","steps":[{"t":"Per $I(a)=\\int_{-\\infty}^{+\\infty}\\frac{\\cos(ax)}{\\cosh x}\\,dx$ si pone $g(z)=\\frac{e^{iaz}}{\\cosh z}$. Perché si sceglie un contorno RETTANGOLARE di altezza $\\pi$ e non la solita semicirconferenza?","opts":[{"x":"perché $\\cosh z$ ha infiniti zeri sull'asse immaginario ($z=i\\pi/2+ik\\pi$): una semicirconferenza grande ne racchiuderebbe infiniti, mentre il rettangolo di altezza $\\pi$ ne racchiude ESATTAMENTE uno e sfrutta la quasi-periodicità $\\cosh(x+i\\pi)=-\\cosh x$","c":true},{"x":"perché la semicirconferenza non converge mai per funzioni con $\\cosh$"},{"x":"perché il rettangolo racchiude tutti i poli, e il teorema dei residui vuole tutte le singolarità"}],"hint":"Con infiniti poli allineati, la mossa non è racchiuderli tutti ma sceglierne uno solo e legare il lato superiore a quello inferiore.","sol":"Strategia del contorno rettangolare (modus operandi per integrandi con $\\cosh/\\sinh$ al denominatore). Gli zeri di $\\cosh$ sono equispaziati sull'asse immaginario; un rettangolo $[-R,R]\\times[0,\\pi]$ isola il solo polo $z=i\\pi/2$ e usa $\\cosh(x+i\\pi)=-\\cosh x$ per legare il lato alto al basso. La semicirconferenza fallirebbe (infiniti poli).","cont":"Poli"},{"t":"Gli zeri di $\\cosh z$ sono in $z_k=i\\pi/2+ik\\pi$. Quale cade dentro il rettangolo $[-R,R]\\times[0,\\pi]$ e di che ordine è?","opts":[{"x":"solo $z=i\\pi/2$, polo semplice (poiché $\\cosh'(z)=\\sinh z$ e $\\sinh(i\\pi/2)=i\\neq0$)","c":true},{"x":"$z=i\\pi/2$ e $z=3i\\pi/2$, entrambi poli semplici"},{"x":"$z=i\\pi/2$, ma è un polo doppio perché $\\cosh$ si annulla con la derivata"}],"hint":"$\\sinh(i\\pi/2)=i\\sin(\\pi/2)=i\\neq0$: zero semplice del denominatore, dunque polo semplice.","sol":"Relazione zeri-poli: se $\\cosh(z_0)=0$ ma $\\cosh'(z_0)=\\sinh(z_0)\\neq0$, allora $z_0$ è polo semplice di $1/\\cosh$. $\\sinh(i\\pi/2)=i$, quindi $z=i\\pi/2$ è semplice; gli altri $z_k$ stanno fuori dalla striscia $0<\\mathrm{Im}<\\pi$.","cont":"Lato superiore"},{"t":"Sul lato superiore $\\gamma_3$ ($z=x+i\\pi$, $x:R\\to-R$), come si lega $\\int_{\\gamma_3}g$ all'integrale $I_c=\\int_{-\\infty}^{\\infty}\\frac{e^{iax}}{\\cosh x}dx$?","opts":[{"x":"$\\int_{\\gamma_3}g=e^{-a\\pi}I_c$, perché $\\cosh(x+i\\pi)=-\\cosh x$ e $e^{ia(x+i\\pi)}=e^{-a\\pi}e^{iax}$; i due segni meno (denominatore e verso) si cancellano","c":true},{"x":"$\\int_{\\gamma_3}g=-e^{-a\\pi}I_c$, il segno di $\\cosh(x+i\\pi)$ resta"},{"x":"$\\int_{\\gamma_3}g=e^{a\\pi}I_c$"}],"hint":"Due segni meno: uno da $\\cosh(x+i\\pi)=-\\cosh x$, uno dall'inversione degli estremi $R\\to-R$. Si elidono.","sol":"$\\cosh(x+i\\pi)=-\\cosh x$ e $e^{ia(x+i\\pi)}=e^{-a\\pi}e^{iax}$. Con $dx$ da $R$ a $-R$: $\\int_{\\gamma_3}=\\int_R^{-R}\\frac{e^{-a\\pi}e^{iax}}{-\\cosh x}dx=e^{-a\\pi}\\int_{-R}^{R}\\frac{e^{iax}}{\\cosh x}dx\\to e^{-a\\pi}I_c$. Dunque $\\int_{\\gamma_1}+\\int_{\\gamma_3}=(1+e^{-a\\pi})I_c$.","cont":"Lati verticali"},{"t":"Perché i lati verticali $\\gamma_2,\\gamma_4$ ($z=\\pm R+iy$, $y\\in[0,\\pi]$) danno contributo nullo per $R\\to\\infty$?","opts":[{"x":"perché $|\\cosh(\\pm R+iy)|\\ge\\sinh R\\to\\infty$ mentre il numeratore $|e^{iaz}|=e^{-ay}$ resta limitato su $y\\in[0,\\pi]$: l'integrando è $O(e^{-R})$ su un tratto di lunghezza $\\pi$","c":true},{"x":"per il lemma di Jordan, che si applica ai lati verticali dei rettangoli"},{"x":"non si annullano, ma i loro contributi si cancellano tra loro"}],"hint":"Non è Jordan (quello è per archi): è la crescita esponenziale del denominatore $\\cosh$ a schiacciare l'integrando su un tratto finito.","sol":"Stima diretta (ML): $|\\cosh(\\pm R+iy)|\\ge|\\sinh R|$ cresce come $e^R/2$; il numeratore $|e^{iaz}|=e^{-ay}\\le\\max(1,e^{-a\\pi})$ è limitato. L'integrando è $O(e^{-R})$ su lunghezza $\\pi$, quindi i lati $\\to0$. Il lemma di Jordan qui non serve: la soppressione viene dal $\\cosh$.","cont":"Residuo e chiusura"},{"t":"Il residuo in $z=i\\pi/2$ è $\\mathrm{Res}=\\frac{e^{ia\\cdot i\\pi/2}}{\\sinh(i\\pi/2)}=\\frac{e^{-a\\pi/2}}{i}$. Assemblando $(1+e^{-a\\pi})I_c=2\\pi i\\,\\mathrm{Res}$, quanto vale $I(a)$?","opts":[{"x":"$I(a)=\\dfrac{2\\pi\\,e^{-a\\pi/2}}{1+e^{-a\\pi}}=\\dfrac{\\pi}{\\cosh(a\\pi/2)}$, ed è reale come dev'essere","c":true},{"x":"$I(a)=\\dfrac{2\\pi\\,e^{-a\\pi/2}}{1+e^{-a\\pi}}=\\dfrac{\\pi}{\\sinh(a\\pi/2)}$"},{"x":"$I(a)=\\dfrac{\\pi}{2\\cosh(a\\pi/2)}$"}],"hint":"$2\\pi i\\cdot e^{-a\\pi/2}/i=2\\pi e^{-a\\pi/2}$; poi $\\frac{2e^{-a\\pi/2}}{1+e^{-a\\pi}}=\\frac{2}{e^{a\\pi/2}+e^{-a\\pi/2}}=\\mathrm{sech}(a\\pi/2)$.","sol":"Teorema dei residui. $2\\pi i\\cdot\\frac{e^{-a\\pi/2}}{i}=2\\pi e^{-a\\pi/2}$; dividendo per $(1+e^{-a\\pi})$ e moltiplicando sopra e sotto per $e^{a\\pi/2}$: $I=\\frac{2\\pi}{e^{a\\pi/2}+e^{-a\\pi/2}}=\\frac{\\pi}{\\cosh(a\\pi/2)}$. Poiché $I_c=\\int\\cos(ax)/\\cosh x\\,dx+i\\int\\sin(ax)/\\cosh x\\,dx$ e la seconda è dispari (nulla), $I(a)=\\mathrm{Re}\\,I_c=I_c$ è reale.","cont":null}]},{"pool":"fourier","src":"Trasformata di e^{-a|x|} + Parseval - da UNM Solved Problems - manuale","steps":[{"t":"Per $\\hat f(k)=\\int_{-\\infty}^{+\\infty}e^{-a|x|}e^{-ikx}dx$ ($a>0$): perché conviene spezzare l'integrale in $x=0$ invece di usare i residui?","opts":[{"x":"perché $e^{-a|x|}\\in L^1(\\mathbb{R})$ e su ciascuna semiretta è un'esponenziale elementare: l'integrale converge assolutamente e si fa in chiuso, senza bisogno di chiudere contorni","c":true},{"x":"perché $e^{-a|x|}$ è analitica ovunque e i residui darebbero zero"},{"x":"perché il valore assoluto $|x|$ crea un polo in $x=0$ da aggirare con un'indentazione"}],"hint":"La funzione ha un modulo, non un polo: su $x>0$ vale $e^{-ax}$, su $x<0$ vale $e^{ax}$. Due integrali elementari.","sol":"Definizione di trasformata e appartenenza a $L^1$: $\\int|e^{-a|x|}|dx=2/a<\\infty$, quindi $\\hat f$ esiste come integrale ordinario. Il $|x|$ impone di spezzare in $[0,\\infty)$ e $(-\\infty,0]$; non c'è singolarità, i residui sarebbero un fuori-strada.","cont":"I due pezzi"},{"t":"Calcolando i due tratti: $\\int_0^\\infty e^{-(a+ik)x}dx+\\int_{-\\infty}^0 e^{(a-ik)x}dx$. Quanto valgono?","opts":[{"x":"$\\dfrac{1}{a+ik}+\\dfrac{1}{a-ik}$","c":true},{"x":"$\\dfrac{1}{a+ik}-\\dfrac{1}{a-ik}$"},{"x":"$\\dfrac{1}{a+ik}+\\dfrac{1}{a+ik}$"}],"hint":"Sul tratto negativo, $e^{-a|x|}=e^{ax}$ e $e^{-ikx}$ danno $e^{(a-ik)x}$, che integrato da $-\\infty$ a $0$ vale $1/(a-ik)$.","sol":"Integrali esponenziali elementari: $\\int_0^\\infty e^{-(a+ik)x}dx=\\frac{1}{a+ik}$ (converge perché $\\mathrm{Re}(a+ik)=a>0$); $\\int_{-\\infty}^0 e^{(a-ik)x}dx=\\frac{1}{a-ik}$.","cont":"Somma"},{"t":"Sommando, qual è $\\hat f(k)$?","opts":[{"x":"$\\hat f(k)=\\dfrac{2a}{a^2+k^2}$","c":true},{"x":"$\\hat f(k)=\\dfrac{2ik}{a^2+k^2}$"},{"x":"$\\hat f(k)=\\dfrac{2a}{a^2-k^2}$"}],"hint":"Denominatore comune $(a+ik)(a-ik)=a^2+k^2$; i numeratori $ (a-ik)+(a+ik)=2a$.","sol":"$\\frac{1}{a+ik}+\\frac{1}{a-ik}=\\frac{(a-ik)+(a+ik)}{a^2+k^2}=\\frac{2a}{a^2+k^2}$. È reale e pari, coerente col fatto che $e^{-a|x|}$ è reale e pari (trasformata di funzione pari è pari e reale).","cont":"Dualità"},{"t":"Da questo, senza rifare integrali, quanto vale la trasformata della lorentziana $\\int_{-\\infty}^{+\\infty}\\frac{e^{-ikx}}{x^2+a^2}dx$? E perché lo si può dedurre?","opts":[{"x":"$\\dfrac{\\pi}{a}e^{-a|k|}$: per la proprietà di dualità/inversione della trasformata di Fourier, poiché $e^{-a|x|}\\leftrightarrow\\frac{2a}{a^2+k^2}$, la coppia si legge al contrario a meno del fattore $2\\pi$","c":true},{"x":"$\\dfrac{2\\pi}{a}e^{-a|k|}$, senza dimezzamento"},{"x":"$\\dfrac{\\pi}{a}e^{-a k^2}$, gaussiana in $k$"}],"hint":"Inversione: $\\frac{1}{2\\pi}\\int\\hat f(k)e^{ikx}dk=f(x)$. Applicandola a $\\hat f=\\frac{2a}{a^2+k^2}$ si ottiene la trasformata della lorentziana leggendo la coppia a rovescio.","sol":"Teorema di inversione (dualità). Da $\\frac{1}{2\\pi}\\int\\frac{2a}{a^2+k^2}e^{ikx}dk=e^{-a|x|}$ segue $\\int\\frac{1}{x^2+a^2}e^{-ikx}dx=\\frac{\\pi}{a}e^{-a|k|}$ (scambiando i ruoli di $x$ e $k$ e sistemando le costanti). Un integrale che coi residui richiederebbe di chiudere un contorno e usare il lemma di Jordan.","cont":"Parseval"},{"t":"Verifica con Parseval: $\\int|f|^2dx=\\frac{1}{2\\pi}\\int|\\hat f|^2dk$. I due membri tornano?","opts":[{"x":"sì: $\\int e^{-2a|x|}dx=\\frac1a$ e $\\frac{1}{2\\pi}\\int\\frac{4a^2}{(a^2+k^2)^2}dk=\\frac{1}{2\\pi}\\cdot4a^2\\cdot\\frac{\\pi}{2a^3}=\\frac1a$: coincidono","c":true},{"x":"no: il primo dà $1/a$, il secondo $2/a$, segno che la trasformata è sbagliata"},{"x":"tornano solo se si aggiunge un fattore $2\\pi$ a destra"}],"hint":"Serve $\\int\\frac{dk}{(a^2+k^2)^2}=\\frac{\\pi}{2a^3}$ (residuo doppio in $ia$, oppure derivata rispetto ad $a^2$ di $\\int\\frac{dk}{a^2+k^2}=\\pi/a$).","sol":"Identità di Parseval-Plancherel. $\\int e^{-2a|x|}dx=\\frac1a$; $\\int\\frac{dk}{(a^2+k^2)^2}=\\frac{\\pi}{2a^3}$, quindi $\\frac{1}{2\\pi}\\cdot4a^2\\cdot\\frac{\\pi}{2a^3}=\\frac1a$. L'accordo conferma la trasformata; inoltre $\\hat f\\sim k^{-2}$ perché $f$ ha uno spigolo (solo $C^0$) in $x=0$: la regolarità di $f$ governa il tasso di decadimento di $\\hat f$.","cont":null}]},{"pool":"fourier","src":"Trasformata della gaussiana per completamento del quadrato - da UC3M OCW - manuale","steps":[{"t":"Per $\\hat f(k)=\\int_{-\\infty}^{+\\infty}e^{-b x^2}e^{-ikx}dx$ ($b>0$): qual è il primo passo che rende l'integrale gestibile?","opts":[{"x":"completare il quadrato: $-bx^2-ikx=-b\\big(x+\\tfrac{ik}{2b}\\big)^2-\\tfrac{k^2}{4b}$","c":true},{"x":"sviluppare $e^{-ikx}$ in serie di Taylor e integrare termine a termine"},{"x":"chiudere un contorno semicircolare e usare i residui"}],"hint":"L'esponente è quadratico in $x$: raccogliendo $-b$ e completando il quadrato compare uno shift immaginario $ik/2b$ e un fattore costante $e^{-k^2/4b}$.","sol":"Completamento del quadrato: $-bx^2-ikx=-b\\big(x^2+\\tfrac{ik}{b}x\\big)=-b\\big(x+\\tfrac{ik}{2b}\\big)^2-\\tfrac{k^2}{4b}$. Il termine costante $-k^2/4b$ esce dall'integrale.","cont":"Shift del contorno"},{"t":"Resta $e^{-k^2/4b}\\int_{-\\infty}^{+\\infty}e^{-b(x+ik/2b)^2}dx$. Perché si può traslare il cammino sull'asse reale, cioè porre $u=x+ik/2b$ e integrare su $\\mathbb{R}$?","opts":[{"x":"perché $e^{-bz^2}$ è intera (nessun polo) e decade sui lati del rettangolo $|\\mathrm{Im}\\,z|\\le k/2b$: per il teorema di Cauchy l'integrale sulla retta traslata uguaglia quello sull'asse reale","c":true},{"x":"perché una traslazione immaginaria non cambia mai il valore di un integrale reale, per definizione"},{"x":"perché il lemma di Jordan garantisce l'annullamento su qualunque traslazione"}],"hint":"La legittimità sta nell'ASSENZA di poli tra i due cammini paralleli e nel decadimento gaussiano ai lati: è Cauchy, non una regola automatica.","sol":"Teorema integrale di Cauchy. $e^{-bz^2}$ è olomorfa su tutto $\\mathbb{C}$; sui due lati verticali del rettangolo tra l'asse reale e la retta $\\mathrm{Im}=k/2b$ l'integrando è $O(e^{-bR^2})\\to0$. Senza poli racchiusi, $\\oint=0$ dà $\\int_{\\mathbb{R}+ik/2b}=\\int_{\\mathbb{R}}$. Se ci fosse una singolarità tra i cammini, lo shift NON sarebbe lecito.","cont":"Integrale gaussiano"},{"t":"L'integrale residuo $\\int_{-\\infty}^{+\\infty}e^{-bu^2}du$ vale?","opts":[{"x":"$\\sqrt{\\pi/b}$","c":true},{"x":"$\\sqrt{\\pi b}$"},{"x":"$\\pi/b$"}],"hint":"Riscalando $u\\to u/\\sqrt b$ dall'integrale di Gauss $\\int e^{-u^2}du=\\sqrt\\pi$.","sol":"Integrale di Gauss $\\int_{-\\infty}^\\infty e^{-u^2}du=\\sqrt\\pi$, con il riscalamento $\\int e^{-bu^2}du=\\sqrt{\\pi/b}$.","cont":"Risultato"},{"t":"Dunque $\\hat f(k)=?$","opts":[{"x":"$\\sqrt{\\dfrac{\\pi}{b}}\\;e^{-k^2/4b}$","c":true},{"x":"$\\sqrt{\\dfrac{\\pi}{b}}\\;e^{-b k^2/4}$"},{"x":"$\\sqrt{\\pi b}\\;e^{-k^2/4b}$"}],"hint":"Il fattore fuori dall'integrale era $e^{-k^2/4b}$; l'integrale gaussiano dà $\\sqrt{\\pi/b}$.","sol":"$\\hat f(k)=e^{-k^2/4b}\\sqrt{\\pi/b}$. La trasformata di una gaussiana è una gaussiana: una funzione dello stesso tipo, con larghezza reciproca.","cont":"Punto fisso e larghezze"},{"t":"Per quale $b$ la gaussiana $e^{-bx^2}$ è (a meno della costante) punto fisso della trasformata, e cosa dice il legame tra le due larghezze?","opts":[{"x":"$b=\\tfrac12$: $e^{-x^2/2}\\mapsto\\sqrt{2\\pi}\\,e^{-k^2/2}$, stessa forma; in generale la larghezza reale $\\sim1/\\sqrt b$ e quella in $k$ $\\sim\\sqrt b$ hanno prodotto costante -> principio di indeterminazione","c":true},{"x":"$b=1$: $e^{-x^2}\\mapsto e^{-k^2}$ senza costanti"},{"x":"nessun $b$: una gaussiana non è mai autofunzione della trasformata"}],"hint":"L'esponente di uscita è $k^2/4b$: coincide con $bx^2$ (stessa larghezza) quando $4b=1/b$, cioè $b=1/2$.","sol":"Autofunzione della trasformata (a meno di costante) quando l'esponente si conserva: $b=1/(4b)\\Rightarrow b=1/2$. Le larghezze $\\Delta x\\sim1/\\sqrt b$ e $\\Delta k\\sim\\sqrt b$ danno $\\Delta x\\,\\Delta k\\sim1$: comprimere in $x$ allarga in $k$, versione fourieristica dell'indeterminazione.","cont":null}]},{"pool":"fourier","src":"Sommazione di Poisson su lorentziana - da UNM Solved Problems - manuale","steps":[{"t":"La formula di sommazione di Poisson $\\sum_{n=-\\infty}^{\\infty}f(n)=\\sum_{m=-\\infty}^{\\infty}\\hat f(2\\pi m)$ (con $\\hat f(k)=\\int f e^{-ikx}dx$) da dove viene, cioè su quale identità si regge?","opts":[{"x":"dalla periodizzazione $F(x)=\\sum_n f(x+n)$, che essendo $1$-periodica ha una serie di Fourier i cui coefficienti sono i valori $\\hat f(2\\pi m)$; valutando $F(0)$ si ottengono le due somme","c":true},{"x":"dal teorema dei residui applicato alla funzione $\\pi\\cot(\\pi z)$"},{"x":"dall'identità di Parseval applicata alla funzione costante"}],"hint":"Il ponte è la funzione periodizzata: sommare le traslate intere di $f$ crea una funzione periodica, e la sua serie di Fourier lega i due lati.","sol":"Derivazione della sommazione di Poisson. $F(x)=\\sum_n f(x+n)$ è $1$-periodica; i suoi coefficienti di Fourier sono $\\hat F_m=\\int_0^1 F(x)e^{-2\\pi imx}dx=\\int_{\\mathbb R}f(x)e^{-2\\pi imx}dx=\\hat f(2\\pi m)$. Da $F(0)=\\sum_m\\hat F_m$ segue l'identità. Serve $f$ regolare e a decadimento rapido perché entrambe le serie convergano.","cont":"Scelta della funzione"},{"t":"Per calcolare $\\sum_{n}\\frac{1}{n^2+a^2}$ si prende $f(x)=\\frac{1}{x^2+a^2}$. Quanto vale $\\hat f(2\\pi m)$?","opts":[{"x":"$\\hat f(2\\pi m)=\\dfrac{\\pi}{a}e^{-2\\pi a|m|}$, poiché $\\hat f(k)=\\frac\\pi a e^{-a|k|}$","c":true},{"x":"$\\hat f(2\\pi m)=\\dfrac{\\pi}{a}e^{-a|m|}$"},{"x":"$\\hat f(2\\pi m)=\\dfrac{2a}{a^2+4\\pi^2 m^2}$"}],"hint":"La trasformata della lorentziana è $\\frac\\pi a e^{-a|k|}$; qui $k=2\\pi m$, quindi l'esponente è $-2\\pi a|m|$.","sol":"Uso della trasformata nota $\\widehat{1/(x^2+a^2)}(k)=\\frac\\pi a e^{-a|k|}$ (per dualità dalla trasformata di $e^{-a|x|}$). Valutata in $k=2\\pi m$: $\\frac\\pi a e^{-2\\pi a|m|}$.","cont":"Applicazione"},{"t":"Applicando Poisson, $\\sum_n\\frac{1}{n^2+a^2}=\\frac\\pi a\\sum_m e^{-2\\pi a|m|}$. Come si somma la serie geometrica bilatera?","opts":[{"x":"$\\sum_{m}e^{-2\\pi a|m|}=1+2\\sum_{m\\ge1}e^{-2\\pi am}=1+\\dfrac{2e^{-2\\pi a}}{1-e^{-2\\pi a}}=\\dfrac{1+e^{-2\\pi a}}{1-e^{-2\\pi a}}$","c":true},{"x":"$\\sum_{m}e^{-2\\pi a|m|}=\\dfrac{1}{1-e^{-2\\pi a}}$ (una sola coda)"},{"x":"$\\sum_{m}e^{-2\\pi a|m|}=\\dfrac{2}{1-e^{-2\\pi a}}$"}],"hint":"Il termine $m=0$ vale $1$; le due code $m\\ge1$ e $m\\le-1$ sono uguali, da cui il fattore $2$ su una geometrica $\\sum_{m\\ge1}(e^{-2\\pi a})^m$.","sol":"Serie geometrica: $\\sum_{m\\ge1}r^m=\\frac{r}{1-r}$ con $r=e^{-2\\pi a}<1$ (converge perché $a>0$). Il modulo $|m|$ conta due volte le code più il termine centrale: $1+\\frac{2r}{1-r}=\\frac{1+r}{1-r}$.","cont":"Risultato"},{"t":"Riconoscendo $\\frac{1+e^{-2\\pi a}}{1-e^{-2\\pi a}}$, qual è la forma chiusa e come si controlla il limite $a\\to\\infty$?","opts":[{"x":"$\\sum_n\\frac{1}{n^2+a^2}=\\dfrac{\\pi}{a}\\coth(\\pi a)$; per $a\\to\\infty$ $\\coth(\\pi a)\\to1$ e resta $\\sim\\pi/a$, dominato dal solo termine $n=0$ ($1/a^2$ per $\\pi/a$)","c":true},{"x":"$\\sum_n\\frac{1}{n^2+a^2}=\\dfrac{\\pi}{a}\\tanh(\\pi a)$; per $a\\to\\infty$ tende a $0$"},{"x":"$\\sum_n\\frac{1}{n^2+a^2}=\\dfrac{\\pi^2}{a}$, indipendente da $a$ oltre il fattore"}],"hint":"$\\frac{1+r}{1-r}$ con $r=e^{-2\\pi a}$ è $\\coth(\\pi a)$; per $a$ grande $\\coth\\to1$ e domina $n=0$.","sol":"$\\coth(\\pi a)=\\frac{e^{\\pi a}+e^{-\\pi a}}{e^{\\pi a}-e^{-\\pi a}}=\\frac{1+e^{-2\\pi a}}{1-e^{-2\\pi a}}$. Quindi $\\sum_n\\frac1{n^2+a^2}=\\frac\\pi a\\coth(\\pi a)$. Verifica asintotica: $a\\to\\infty\\Rightarrow\\coth(\\pi a)\\to1$ e la somma $\\sim\\pi/a$, che è il termine $n=0=1/a^2$ moltiplicato... in effetti il contributo dominante è proprio $n=0$ più correzioni esponenzialmente piccole. Coerente.","cont":"Ipotesi di applicabilità"},{"t":"Perché la sommazione di Poisson è LECITA per $f(x)=1/(x^2+a^2)$, cioè quali ipotesi vanno verificate prima di usarla?","opts":[{"x":"servono decadimento e regolarità sufficienti: qui $f$ è continua e decade come $x^{-2}$ (quindi $\\sum_n f(n)$ converge) e $\\hat f$ decade come $e^{-a|k|}$ (quindi $\\sum_m\\hat f(2\\pi m)$ converge); entrambe le condizioni tengono per $a>0$","c":true},{"x":"nessuna ipotesi: la formula di Poisson vale per qualunque funzione"},{"x":"basta che $f$ sia limitata, il decadimento non conta"}],"hint":"Poisson richiede che ENTRAMBE le serie (in $x$ e in $k$) convergano: va controllato il decadimento della funzione E della sua trasformata.","sol":"Ipotesi della formula di Poisson: convergenza (assoluta) di $\\sum f(x+n)$ e della sua serie di Fourier. La classe di Schwartz le garantisce; qui bastano $f\\in C^0$ con $f=O(x^{-2})$ e $\\hat f=O(e^{-a|k|})$. Senza decadimento adeguato l'identità può fallire: è la verifica che nessuno fa e che all'esame vale punti."}]},{"pool":"fourier","src":"Trasformata di 1/(x^2+a^2)^2 (polo doppio) - da Manchester PHYS30672 - manuale","steps":[{"t":"Per $\\hat f(k)=\\int_{-\\infty}^{+\\infty}\\frac{e^{-ikx}}{(x^2+a^2)^2}dx$ ($a>0$): due strade sono possibili. La più pulita sfrutta una trasformata già nota. Quale relazione tra $\\frac{1}{(x^2+a^2)^2}$ e $\\frac{1}{x^2+a^2}$ conviene usare?","opts":[{"x":"$\\dfrac{1}{(x^2+a^2)^2}=-\\dfrac{1}{2a}\\dfrac{\\partial}{\\partial a}\\dfrac{1}{x^2+a^2}$, così da derivare la trasformata nota rispetto al parametro $a$","c":true},{"x":"$\\dfrac{1}{(x^2+a^2)^2}=\\dfrac{\\partial}{\\partial a}\\dfrac{1}{x^2+a^2}$ direttamente"},{"x":"non c'è relazione: si è obbligati a usare il polo doppio con la formula del residuo"}],"hint":"$\\partial_a\\frac{1}{x^2+a^2}=\\frac{-2a}{(x^2+a^2)^2}$: isolando si trova il fattore $-1/(2a)$.","sol":"Trucco della differenziazione rispetto a un parametro. Da $\\partial_a(x^2+a^2)^{-1}=-2a(x^2+a^2)^{-2}$ segue $(x^2+a^2)^{-2}=-\\frac{1}{2a}\\partial_a(x^2+a^2)^{-1}$. Evita di calcolare il residuo in un polo doppio.","cont":"Perché è lecito"},{"t":"Perché si può portare $\\partial_a$ dentro l'integrale, cioè $\\hat f(k)=-\\frac{1}{2a}\\partial_a\\big[\\frac\\pi a e^{-a|k|}\\big]$?","opts":[{"x":"perché l'integrando e la sua derivata in $a$ sono dominati da una funzione integrabile indipendente da $a$ (su ogni intorno $a\\ge a_0>0$): il teorema di derivazione sotto il segno di integrale si applica","c":true},{"x":"perché la derivata e l'integrale commutano sempre, senza condizioni"},{"x":"perché $e^{-a|k|}$ è limitata, e questo basta"}],"hint":"La legittimità è una dominazione uniforme: senza una maggiorante integrabile lo scambio $\\partial_a\\int=\\int\\partial_a$ non è garantito.","sol":"Teorema di derivazione sotto il segno di integrale (Leibniz). Su $a\\ge a_0>0$, $|\\partial_a (x^2+a^2)^{-1}|=2a(x^2+a^2)^{-2}\\le C(x^2+a_0^2)^{-2}\\in L^1$: la dominazione uniforme consente lo scambio. È il PERCHÉ che rende valido derivare la trasformata nota invece di ricalcolarla.","cont":"Derivata"},{"t":"Calcolando $-\\frac{1}{2a}\\partial_a\\big[\\frac\\pi a e^{-a|k|}\\big]$, qual è $\\hat f(k)$?","opts":[{"x":"$\\hat f(k)=\\dfrac{\\pi}{2a^3}\\,(1+a|k|)\\,e^{-a|k|}$","c":true},{"x":"$\\hat f(k)=\\dfrac{\\pi}{2a^3}\\,(1-a|k|)\\,e^{-a|k|}$"},{"x":"$\\hat f(k)=\\dfrac{\\pi}{a^3}\\,a|k|\\,e^{-a|k|}$"}],"hint":"$\\partial_a[a^{-1}e^{-a|k|}]=-a^{-2}e^{-a|k|}-a^{-1}|k|e^{-a|k|}=-a^{-2}e^{-a|k|}(1+a|k|)$; moltiplica per $-\\pi/(2a)$.","sol":"$\\partial_a\\big[\\frac1a e^{-a|k|}\\big]=-\\frac{1}{a^2}e^{-a|k|}(1+a|k|)$. Quindi $\\hat f=-\\frac{\\pi}{2a}\\cdot\\big(-\\frac{1}{a^2}\\big)(1+a|k|)e^{-a|k|}=\\frac{\\pi}{2a^3}(1+a|k|)e^{-a|k|}$.","cont":"Firma del polo doppio"},{"t":"Verifica in $k=0$ e significato del prefattore $(1+a|k|)$?","opts":[{"x":"$\\hat f(0)=\\frac{\\pi}{2a^3}=\\int\\fra
