<style>
  :root{
    --bg:#0e1117; --panel:#161b22; --panel2:#1c232d; --border:#2b333d;
    --txt:#eef3f8; --muted:#b9c4d1; --accent:#4c8dff; --accent2:#8fb0ff;
    --ok:#2ea043; --okbg:#10331b; --bad:#d83a3a; --badbg:#3a1414;
    --warn:#d8a13a; --warnbg:#332a10;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    font-size:17px;line-height:1.5;}
  .wrap{max-width:820px;margin:0 auto;padding:24px 18px 80px;}
  h1{font-size:1.5rem;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:.92rem;margin:0 0 22px;}
  .hidden{display:none!important;}

  /* ---- MENU ---- */
  .mode-row{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
  .mode-btn{flex:1;min-width:220px;border:1px solid var(--border);background:var(--panel);
    color:var(--txt);padding:16px;border-radius:12px;cursor:pointer;text-align:left;
    transition:.15s;}
  .mode-btn:hover{border-color:var(--accent);background:var(--panel2);}
  .mode-btn b{font-size:1.05rem;}
  .mode-btn span{display:block;color:var(--muted);font-size:.85rem;margin-top:4px;}
  .mode-btn.primary{border-color:var(--accent);background:#13233f;}

  .pool-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:640px){.pool-grid{grid-template-columns:1fr;}}
  .pool-card{border:1px solid var(--border);background:var(--panel);border-radius:12px;
    padding:14px;cursor:pointer;transition:.15s;position:relative;}
  .pool-card:hover{border-color:var(--accent);background:var(--panel2);}
  .pool-card.empty{opacity:.55;cursor:not-allowed;}
  .pool-card.empty:hover{border-color:var(--border);background:var(--panel);}
  .pool-card .n{font-weight:600;font-size:.98rem;}
  .pool-card .meta{color:var(--muted);font-size:.8rem;margin-top:6px;}
  .badge{display:inline-block;font-size:.7rem;font-weight:700;padding:2px 8px;
    border-radius:20px;margin-top:8px;letter-spacing:.3px;}
  .badge.full{background:var(--okbg);color:#5fd980;border:1px solid #235c33;}
  .badge.todo{background:var(--warnbg);color:#e0b85a;border:1px solid #5c4a23;}

  /* ---- QUIZ ---- */
  .qhead{display:flex;justify-content:space-between;align-items:center;
    color:var(--muted);font-size:.82rem;margin-bottom:14px;gap:12px;}
  .qhead .src{font-style:italic;}
  .progress{height:5px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-bottom:18px;}
  .progress > i{display:block;height:100%;background:var(--accent);width:0;transition:.3s;}

  .fig{background:var(--panel);border:1px solid var(--border);border-radius:10px;
    padding:12px;margin:0 0 16px;text-align:center;overflow-x:auto;}
  .qtext{font-size:1.08rem;margin:0 0 18px;}
  .qtext .lbl{display:inline-block;background:var(--panel2);border:1px solid var(--border);
    color:var(--accent2);font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:6px;
    margin-right:8px;vertical-align:middle;}

  .opts{display:flex;flex-direction:column;gap:10px;}
  .opt{border:1px solid var(--border);background:var(--panel);color:var(--txt);
    padding:13px 15px;border-radius:10px;cursor:pointer;text-align:left;
    font-size:1rem;transition:.12s;}
  .opt:hover:not(:disabled){border-color:var(--accent);background:var(--panel2);}
  .opt:disabled{cursor:default;}
  .opt.correct{border-color:var(--ok);background:var(--okbg);}
  .opt.wrong{border-color:var(--bad);background:var(--badbg);}

  .fb{margin-top:16px;border-radius:10px;padding:14px;font-size:.95rem;display:none;}
  .fb.show{display:block;}
  .fb.hint{background:var(--badbg);border:1px solid #6b2222;}
  .fb.hint b{color:#ff8585;}
  .fb.sol{background:var(--okbg);border:1px solid #235c33;}
  .fb.sol b{color:#5fd980;}

  .navrow{margin-top:20px;display:flex;justify-content:space-between;align-items:center;gap:12px;}
  .cont{background:var(--accent);color:#fff;border:none;padding:12px 20px;border-radius:10px;
    font-size:1rem;font-weight:600;cursor:pointer;transition:.12s;}
  .cont:hover{background:var(--accent2);}
  .menu-btn{background:transparent;color:var(--muted);border:1px solid var(--border);
    padding:10px 16px;border-radius:10px;cursor:pointer;font-size:.9rem;}
  .menu-btn:hover{color:var(--txt);border-color:var(--accent);}

  .end{text-align:center;padding:40px 10px;}
  .end h2{font-size:1.4rem;}
  .end .score{font-size:2.2rem;font-weight:700;color:var(--accent2);margin:10px 0;}

  .katex{font-size:1.02em;color:var(--txt);}
  .mode-btn.primary span{color:#cdd8e6;}
  .katex-display{margin:.4em 0;}
</style>

<div class="wrap">

  <!-- ===================== MENU ===================== -->
  <section id="menu">
    <h1>{{TITOLO}}</h1>
    <p class="sub">{{SOTTOTITOLO}}</p>

        <span>Tutte le domande dei pool disponibili, in ordine casuale.</span>
      </button>
    </div>

    <div class="pool-grid" id="poolGrid"></div>
  </section>

  <!-- ===================== QUIZ ===================== -->
  <section id="quiz" class="hidden">
    <div class="qhead">
      <span id="qpool"></span>
      <span id="qpos"></span>
    </div>
    <div class="progress"><i id="qbar"></i></div>

    <div class="fig hidden" id="qfig"></div>
    <p class="qtext" id="qtext"></p>
    <div class="opts" id="qopts"></div>

    <div class="fb hint" id="qhint"></div>
    <div class="fb sol" id="qsol"></div>

    <div class="navrow">
      <button class="menu-btn" onclick="toMenu()">&#8592; Menu</button>
      <button class="cont hidden" id="qcont"></button>
    </div>
  </section>

  <!-- ===================== END ===================== -->
  <section id="end" class="hidden">
    <div class="end">
      <h2>Pool completato</h2>
      <div class="score" id="endScore"></div>
      <p class="sub" id="endMsg"></p>
      <button class="cont" onclick="toMenu()">Torna al menu</button>
    </div>
  </section>

</div>

function typeset(el){
  if(el && window.renderMathInElement){
    try{
      renderMathInElement(el,{
        delimiters:[
          {left:'$$',right:'$$',display:true},
          {left:'$',right:'$',display:false}
        ],
        throwOnError:false
      });
    }catch(e){/* no-op */}
  }
}
function shuffle(a){
  for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}
  return a;
}

var Q = {"green":[{"pool":"green","src":"tipo &middot; b01","steps":[{"t":"La funzione di Green $G(x,\\xi)$ di un problema ai limiti $\\mathcal{L}u=f$ &egrave; definita da:","opts":[{"x":"$\\mathcal{L}_x G(x,\\xi)=\\delta(x-\\xi)$ con $G$ che soddisfa le STESSE condizioni al bordo omogenee del problema","c":true},{"x":"$\\mathcal{L}_x G=f$ con $G$ nulla al bordo"},{"x":"$G=\\mathcal{L}^{-1}f$ calcolata per ogni singola $f$"},{"x":"$G(x,\\xi)=u_1(x)u_2(\\xi)$ per due soluzioni qualsiasi dell'omogenea"}],"hint":"La Green risponde alla sorgente ELEMENTARE $\\delta(x-\\xi)$, non alla $f$ data; le condizioni al bordo sono quelle omogenee.","sol":"<b>Definizione di funzione di Green.</b> $G(x,\\xi)$ risolve $\\mathcal{L}_x G(x,\\xi)=\\delta(x-\\xi)$ con le condizioni al bordo omogenee del problema. Per il <b>principio di sovrapposizione</b> (linearit&agrave; di $\\mathcal{L}$) la soluzione con sorgente qualunque &egrave; $u(x)=\\int G(x,\\xi)f(\\xi)\\,d\\xi$: si risolve UNA volta il problema con l'impulso e si ottengono tutte le altre per integrazione."}]},{"pool":"green","src":"tipo &middot; b01","steps":[{"t":"MODUS OPERANDI. Davanti a &laquo;costruire la Green di $\\mathcal{L}u=f$ su $[a,b]$ con date BC omogenee&raquo;, il PRIMO passo &egrave;:","opts":[{"x":"risolvere l'omogenea $\\mathcal{L}u=0$ e costruire due soluzioni $u_1,u_2$ adattate ciascuna a UN estremo del bordo","c":true},{"x":"calcolare subito $\\int G f$"},{"x":"integrare $\\delta(x-\\xi)$ su tutto $[a,b]$"},{"x":"imporre continuit&agrave; di $G$ prima di conoscere l'omogenea"}],"hint":"Senza le due soluzioni omogenee adattate al bordo non hai i mattoni con cui costruire $G$: quello viene prima di qualunque condizione di raccordo.","sol":"<b>Strategia (equazione di Eulero / coeff. costanti).</b> Ordine invariante: (1) risolvi l'omogenea $\\mathcal{L}u=0$; (2) scegli $u_1$ che soddisfa la BC in $a$ e $u_2$ che soddisfa la BC in $b$; (3) poni $G=c\\,u_1(x_{<})u_2(x_{>})$; (4) imponi il salto della derivata letto dall'equazione. La continuit&agrave; &egrave; automatica nella struttura $x_{<},x_{>}$; l'unica costante $c$ si fissa dal salto."}]},{"pool":"green","src":"20230620 Es.4","steps":[{"t":"L'equazione $x^2u''+xu'-u=f$ &egrave; del tipo:","opts":[{"x":"equazione di Eulero: si cercano soluzioni $u=x^{\\alpha}$","c":true},{"x":"a coefficienti costanti: soluzioni $e^{\\alpha x}$"},{"x":"di Bernoulli"},{"x":"separabile"}],"hint":"I coefficienti sono monomi $x^k$ davanti alla derivata $k$-esima: &egrave; la firma di Eulero.","sol":"<b>Equazione di Eulero.</b> Il coefficiente di $u^{(k)}$ &egrave; $\\propto x^k$: sostituendo $u=x^{\\alpha}$ si ottiene l'<b>equazione caratteristica</b> $\\alpha(\\alpha-1)+\\alpha-1=\\alpha^2-1=0$, quindi $\\alpha=\\pm1$ e base $\\{x,\\,1/x\\}$. Con coefficienti costanti si userebbe $e^{\\alpha x}$; qui no."}]},{"pool":"green","src":"tipo &middot; b01","steps":[{"t":"Il Wronskiano $W(u_1,u_2)=u_1u_2'-u_1'u_2$ di due soluzioni serve a stabilire che esse:","opts":[{"x":"sono linearmente indipendenti ($W\\neq0$) e quindi formano una base per costruire $G$","c":true},{"x":"sono ortogonali in $L^2$"},{"x":"soddisfano le condizioni al bordo"},{"x":"hanno lo stesso segno"}],"hint":"Il Wronskiano misura l'indipendenza lineare, non l'ortogonalit&agrave; n&eacute; il bordo.","sol":"<b>Criterio del Wronskiano.</b> Due soluzioni di un'ODE lineare del 2&deg; ordine sono linearmente indipendenti su un intervallo se e solo se $W\\neq0$ in quell'intervallo. Servono indipendenti per generare tutte le soluzioni dell'omogenea e per far comparire $W$ a denominatore nella Green: se $W=0$ la costruzione salta."}]},{"pool":"green","src":"tipo &middot; b01","steps":[{"t":"Per l'<b>identit&agrave; di Abel</b>, il Wronskiano di due soluzioni di $u''+P(x)u'+Q(x)u=0$:","opts":[{"x":"$W(x)=W(x_0)\\,e^{-\\int_{x_0}^x P}$: non cambia mai segno, o &egrave; identicamente nullo","c":true},{"x":"pu&ograve; annullarsi in punti isolati restando altrove non nullo"},{"x":"&egrave; costante per qualsiasi $P$"},{"x":"cambia segno dove $Q$ cambia segno"}],"hint":"Un esponenziale non si annulla mai: se $W$ vale zero in un punto, la costante $W(x_0)$ era zero, quindi $W\\equiv0$.","sol":"<b>Identit&agrave; di Abel-Liouville.</b> $W(x)=W(x_0)\\exp\\!\\big(-\\int_{x_0}^x P\\big)$. L'esponenziale &egrave; sempre positivo: dunque $W$ ha <b>segno costante</b> su tutto l'intervallo oppure &egrave; identicamente nullo. Non esistono zeri isolati del Wronskiano. Questo &egrave; il motivo per cui basta valutarlo in un punto per sapere se le soluzioni sono indipendenti ovunque."}]},{"pool":"green","src":"20230620 Es.4","steps":[{"t":"Base $\\{x,\\,1/x\\}$ dell'omogenea di Eulero. Il Wronskiano $W(x,1/x)$ vale:","opts":[{"x":"$-2/x$","c":true},{"x":"$2/x$"},{"x":"$0$"},{"x":"$-2$"}],"hint":"$W(u_1,u_2)=u_1u_2'-u_1'u_2$ con $u_1=x$, $u_2=1/x$: attento ai segni delle derivate.","sol":"<b>Calcolo del Wronskiano.</b> $u_1=x$, $u_1'=1$; $u_2=1/x$, $u_2'=-1/x^2$. Quindi $W=x\\cdot(-1/x^2)-1\\cdot(1/x)=-1/x-1/x=-2/x$. Coerente con Abel: $P=1/x$ d&agrave; $W\\propto e^{-\\int dx/x}=1/x$. Non nullo per $x\\neq0$: base valida.","cont":"Ora costruiamo le soluzioni adattate al bordo &rarr;"},{"t":"Su $[1,2]$ con $u(1)=u(2)=0$, le soluzioni adattate a ciascun estremo sono:","opts":[{"x":"$u_1=x-1/x$ (annulla in $1$) e $u_2=x-4/x$ (annulla in $2$)","c":true},{"x":"$u_1=x$ e $u_2=1/x$"},{"x":"$u_1=x+1/x$ e $u_2=x+4/x$"},{"x":"$u_1=x-1/x$ per entrambi gli estremi"}],"hint":"$u_1$ deve annullarsi in $x=1$: cerca $c_1x+c_2/x$ con $c_1+c_2=0$. $u_2$ deve annullarsi in $x=2$.","sol":"<b>Adattamento al bordo.</b> $u_1=c_1x+c_2/x$ con $u_1(1)=c_1+c_2=0\\Rightarrow u_1=x-1/x$. $u_2(2)=2c_1+c_2/2=0\\Rightarrow c_2=-4c_1\\Rightarrow u_2=x-4/x$. Sono i due mattoni: $u_1$ porta la BC sinistra, $u_2$ quella destra. $W(u_1,u_2)=6/x\\neq0$: indipendenti, la Green esiste (per ora)."}]},{"pool":"green","src":"tipo &middot; b01","steps":[{"t":"Nella struttura $G(x,\\xi)=c\\,u_1(x_{<})u_2(x_{>})$ con $x_{<}=\\min(x,\\xi)$, la CONTINUIT&Agrave; di $G$ in $x=\\xi$:","opts":[{"x":"&egrave; automaticamente soddisfatta: da entrambi i lati $G(\\xi,\\xi)=c\\,u_1(\\xi)u_2(\\xi)$","c":true},{"x":"va imposta come equazione separata"},{"x":"vale solo se $u_1=u_2$"},{"x":"non &egrave; richiesta per la Green"}],"hint":"Scambiando $x$ e $\\xi$ nel punto $x=\\xi$, $x_{<}$ e $x_{>}$ coincidono entrambi con $\\xi$.","sol":"<b>Perch&eacute; si usa la forma $u_1(x_{<})u_2(x_{>})$.</b> In $x=\\xi$ i due rami danno lo stesso valore $c\\,u_1(\\xi)u_2(\\xi)$: la continuit&agrave; ([G]=0, richiesta dalla sorgente $\\delta$) &egrave; incorporata nella struttura. Resta da imporre solo il salto della derivata, che fissa l'unica costante $c$."}]},{"pool":"green","src":"tipo &middot; b01","steps":[{"t":"Integrando $\\mathcal{L}G=a_2(x)G''+a_1G'+a_0G=\\delta(x-\\xi)$ su $[\\xi^-,\\xi^+]$, le condizioni di raccordo per una sorgente $\\delta$ sono:","opts":[{"x":"$[G]=0$ (continua) e $[G']=1/a_2(\\xi)$ (la derivata salta)","c":true},{"x":"$[G]=1$ e $[G']=0$"},{"x":"$[G]=0$ e $[G']=1$ sempre, indipendentemente da $a_2$"},{"x":"$[G]=a_2(\\xi)$ e $[G']=0$"}],"hint":"Solo il termine con la derivata pi&ugrave; alta $a_2G''$ sopravvive all'integrazione su un intervallo che si stringe; gli altri sono continui e danno contributo nullo.","sol":"<b>Condizioni di raccordo (sorgente $\\delta$).</b> $\\int_{\\xi^-}^{\\xi^+}a_2G''=a_2(\\xi)[G']$ (per continuit&agrave; di $a_2$), mentre $\\int a_1G'$ e $\\int a_0G\\to0$. Uguagliando a $\\int\\delta=1$: $[G']=1/a_2(\\xi)$. La $\\delta$ non forza salto in $G$ ($[G]=0$): con sorgente $\\delta$ salta la DERIVATA, non la funzione. Se $a_2(\\xi)\\neq1$ il coefficiente principale entra nel salto."}]},{"pool":"green","src":"tipo &middot; b01","steps":[{"t":"MODUS OPERANDI. PRIMA di costruire la Green conviene verificare se ESISTE. Il test decisivo &egrave;:","opts":[{"x":"il problema OMOGENEO $\\mathcal{L}u=0$ con le stesse BC ha SOLO la soluzione nulla (equivalente: $W(u_1,u_2)\\neq0$)","c":true},{"x":"la sorgente $f$ &egrave; integrabile"},{"x":"i coefficienti sono continui su $[a,b]$"},{"x":"l'intervallo $[a,b]$ &egrave; limitato"}],"hint":"Se l'omogeneo con le BC ammette una soluzione non nulla, $0$ &egrave; autovalore dell'operatore e l'inverso (la Green) non pu&ograve; esistere.","sol":"<b>Alternativa di Fredholm.</b> La Green &egrave; l'inverso $\\mathcal{L}^{-1}$: esiste se e solo se il problema omogeneo $\\mathcal{L}u=0$ con quelle BC ha solo $u\\equiv0$. Se invece esiste $u_h\\neq0$ omogenea (cio&egrave; $u_1\\propto u_2$, dunque $W=0$), allora $0$ &egrave; autovalore e $\\mathcal{L}$ non &egrave; invertibile: la Green non esiste. &Egrave; il controllo da fare per PRIMO quando le BC sono insolite (miste)."}]},{"pool":"green","src":"20230620 Es.4","steps":[{"t":"TRAPPOLA. Stessa Eulero su $[1,2]$ ma con BC miste $u(1)+3u'(1)=0$ e $u(2)-6u'(2)=0$. La soluzione omogenea $u=c_1x+c_2/x$ che soddisfa la PRIMA BC &egrave;:","opts":[{"x":"$u_1=x+2/x$ (da $4c_1-2c_2=0\\Rightarrow c_2=2c_1$)","c":true},{"x":"$u_1=x-2/x$"},{"x":"$u_1=x-1/x$"},{"x":"$u_1=2x+1/x$"}],"hint":"$u=c_1x+c_2/x$, $u'=c_1-c_2/x^2$. Imponi $u(1)+3u'(1)=0$: valuta in $x=1$.","sol":"<b>Imporre la BC mista sinistra.</b> $u(1)+3u'(1)=(c_1+c_2)+3(c_1-c_2)=4c_1-2c_2=0\\Rightarrow c_2=2c_1$. Scegliendo $c_1=1$: $u_1=x+2/x$. Il criterio da applicare &egrave; quello dell'<b>alternativa di Fredholm</b>: prima si guarda cosa selezionano le BC nell'omogenea.","cont":"Ora la seconda BC &rarr;"},{"t":"La soluzione omogenea che soddisfa la SECONDA BC $u(2)-6u'(2)=0$ &egrave;:","opts":[{"x":"ancora $u_2=x+2/x$: proporzionale a $u_1$, quindi $W=0$ e la Green NON esiste","c":true},{"x":"$u_2=x-4/x$: indipendente da $u_1$, la Green esiste"},{"x":"$u_2=x-2/x$"},{"x":"$u_2=1/x$"}],"hint":"Valuta $u(2)-6u'(2)=0$ con $u=c_1x+c_2/x$: se ritrovi di nuovo $c_2=2c_1$, le due BC selezionano la STESSA soluzione.","sol":"<b>La Green non esiste (trappola BC miste, compito 20/06/2023).</b> $u(2)-6u'(2)=(2c_1+c_2/2)-6(c_1-c_2/4)=-4c_1+2c_2=0\\Rightarrow c_2=2c_1$: identica condizione. Quindi $u_2\\propto u_1=x+2/x$: le due BC sono soddisfatte dalla STESSA funzione non nulla. Per l'<b>alternativa di Fredholm</b> l'omogeneo ha soluzione non banale, $W(u_1,u_2)=0$, e la funzione di Green non esiste. Riconoscerlo richiede di imporre le BC sull'omogenea PRIMA di costruire $G$."}]},{"pool":"green","src":"20230620 Es.4","steps":[{"t":"Con le BC di Dirichlet $u(1)=u(2)=0$ (non miste) la stessa Eulero HA Green perch&eacute;:","opts":[{"x":"$u_1=x-1/x$ e $u_2=x-4/x$ sono indipendenti ($W=6/x\\neq0$): l'omogeneo ha solo $u\\equiv0$","c":true},{"x":"la sorgente &egrave; regolare"},{"x":"l'intervallo &egrave; corto"},{"x":"$a_2(x)=x^2>0$"}],"hint":"Con Dirichlet le due soluzioni adattate agli estremi sono diverse; il contrasto con le BC miste sta tutto nell'indipendenza.","sol":"<b>Esistenza via indipendenza.</b> Con $u(1)=u(2)=0$ le soluzioni adattate $u_1=x-1/x$ e $u_2=x-4/x$ NON sono proporzionali ($W=6/x\\neq0$): l'unica omogenea che soddisfa entrambe le BC &egrave; $u\\equiv0$. Per l'<b>alternativa di Fredholm</b> la Green esiste. La differenza con le BC miste &egrave; solo nella scelta delle BC, non nell'operatore."}]},{"pool":"green","src":"tipo &middot; b01","steps":[{"t":"Per un operatore in forma di <b>Sturm-Liouville</b> $\\mathcal{L}u=(p(x)u')'+q(x)u$, la Green &egrave; SIMMETRICA:","opts":[{"x":"$G(x,\\xi)=G(\\xi,x)$, perch&eacute; l'operatore &egrave; autoaggiunto con quelle BC","c":true},{"x":"solo se $p$ &egrave; costante"},{"x":"mai, la Green non &egrave; mai simmetrica"},{"x":"solo se la sorgente &egrave; pari"}],"hint":"La simmetria del nucleo &egrave; l'ombra dell'autoaggiuntezza dell'operatore; &egrave; un controllo gratuito del risultato.","sol":"<b>Simmetria della Green (operatori autoaggiunti).</b> In forma di Sturm-Liouville, con BC che rendono $\\mathcal{L}$ autoaggiunto, vale $G(x,\\xi)=G(\\xi,x)$. &Egrave; conseguenza di $\\langle\\mathcal{L}u,v\\rangle=\\langle u,\\mathcal{L}v\\rangle$. Utile come verifica: se la $G$ calcolata non &egrave; simmetrica, c'&egrave; un errore (a meno di operatore non autoaggiunto, es. con termine $u'$ e $p$ non assorbito)."}]},{"pool":"green","src":"tipo &middot; b01","steps":[{"t":"In forma Sturm-Liouville $(pu')'+qu=\\delta(x-\\xi)$, il salto corretto della derivata &egrave;:","opts":[{"x":"$[p\\,G']=1$, cio&egrave; $[G']=1/p(\\xi)$","c":true},{"x":"$[G']=1$ sempre"},{"x":"$[G']=p(\\xi)$"},{"x":"$[G']=0$"}],"hint":"&Egrave; il termine $(pG')'$ a integrarsi su $[\\xi^-,\\xi^+]$; il fattore $p(\\xi)$ resta attaccato alla derivata.","sol":"<b>Salto in forma di Sturm-Liouville.</b> $\\int_{\\xi^-}^{\\xi^+}(pG')'=[pG']=\\int\\delta=1$, quindi $[G']=1/p(\\xi)$. Dimenticare il coefficiente $p(\\xi)$ &egrave; uno degli errori pi&ugrave; comuni: con $p\\neq1$ il salto NON &egrave; $1$. Coincide col fatto che, in forma $a_2u''+\\dots$, il salto &egrave; $1/a_2(\\xi)$."}]},{"pool":"green","src":"Set 4 es.9","steps":[{"t":"Nel prodotto $u=\\int G(x,\\xi)f(\\xi)\\,d\\xi$, la funzione di Green va integrata:","opts":[{"x":"contro la sorgente $f(\\xi)$ nella variabile $\\xi$, tenendo $x$ fisso","c":true},{"x":"nella variabile $x$"},{"x":"contro $\\delta(x-\\xi)$"},{"x":"solo sull'intervallo dove $f=0$"}],"hint":"$x$ &egrave; il punto in cui vuoi la soluzione; $\\xi$ scorre su tutte le posizioni della sorgente.","sol":"<b>Uso della Green (principio di sovrapposizione).</b> $u(x)=\\int_a^b G(x,\\xi)f(\\xi)\\,d\\xi$: si somma il contributo di ogni impulso $f(\\xi)\\delta(x-\\xi)$ pesato da $f(\\xi)$. La struttura $G=u_1(x_{<})u_2(x_{>})/(\\dots)$ spezza l'integrale in $\\int_a^x$ (dove $\\xi<x$, cio&egrave; $x_{>}=x$) e $\\int_x^b$."}]},{"pool":"green","src":"20241106 Es.4","steps":[{"t":"L'operatore radiale $u''+\\frac{2}{x}u'-\\frac{\\ell(\\ell+1)}{x^2}u$ ha base omogenea:","opts":[{"x":"$\\{x^{\\ell},\\,x^{-\\ell-1}\\}$, dalla caratteristica $\\alpha^2+\\alpha-\\ell(\\ell+1)=0$","c":true},{"x":"$\\{e^{\\ell x},\\,e^{-(\\ell+1)x}\\}$"},{"x":"$\\{x^{\\ell},\\,x^{\\ell+1}\\}$"},{"x":"$\\{\\sin(\\ell x),\\,\\cos(\\ell x)\\}$"}],"hint":"Moltiplica per $x^2$: diventa Eulero. Sostituisci $u=x^{\\alpha}$ e risolvi $\\alpha(\\alpha-1)+2\\alpha-\\ell(\\ell+1)=0$.","sol":"<b>Eulero radiale (compito 06/11/2024).</b> Moltiplicando per $x^2$ si ha Eulero; $u=x^{\\alpha}$ d&agrave; $\\alpha(\\alpha-1)+2\\alpha-\\ell(\\ell+1)=\\alpha^2+\\alpha-\\ell(\\ell+1)=0$, radici $\\alpha=\\ell$ e $\\alpha=-\\ell-1$. Base $\\{x^{\\ell},x^{-\\ell-1}\\}$: $x^{\\ell}\\to0$ per $x\\to0$ (adatta alla BC in $0$), $x^{-\\ell-1}\\to0$ per $x\\to\\infty$ (adatta alla BC all'infinito)."}]},{"pool":"green","src":"tipo &middot; b01","steps":[{"t":"Un problema $-u''=f$ su $[0,1]$, $u(0)=u(1)=0$: quale segno ha il salto $[G']$?","opts":[{"x":"$[G']=-1$, perch&eacute; l'equazione &egrave; $-G''=\\delta$ (segno meno davanti a $G''$)","c":true},{"x":"$[G']=+1$ sempre"},{"x":"$[G']=0$"},{"x":"$[G']=-1/2$"}],"hint":"Integra $-G''=\\delta$: il segno meno del coefficiente principale passa nel salto.","sol":"<b>Segno del salto.</b> Da $-G''=\\delta$: $\\int_{\\xi^-}^{\\xi^+}(-G'')=-[G']=1\\Rightarrow[G']=-1$. Il segno del coefficiente principale $a_2=-1$ determina il segno del salto. Dimenticarlo inverte la $G$: &egrave; l'errore-segno pi&ugrave; frequente."}]},{"pool":"green","src":"Set 4 es.10","steps":[{"t":"La Green di $-u''+u=f$ su tutta la retta con $u\\to0$ a $\\pm\\infty$ &egrave;:","opts":[{"x":"$G(x,\\xi)=\\tfrac{1}{2}e^{-|x-\\xi|}$ (potenziale di Yukawa 1D)","c":true},{"x":"$G=\\tfrac{1}{2}e^{-(x-\\xi)}$"},{"x":"$G=x_{<}(1-x_{>})$"},{"x":"$G=\\tfrac{1}{2}|x-\\xi|$"}],"hint":"L'omogenea $-u''+u=0$ ha base $e^{x},e^{-x}$: scegli il ramo che decade a ciascun infinito.","sol":"<b>Green su retta infinita.</b> Base $\\{e^{x},e^{-x}\\}$; per $x<\\xi$ si prende $e^{x}$ (decade a $-\\infty$), per $x>\\xi$ si prende $e^{-x}$ (decade a $+\\infty$). Continuit&agrave; + salto $[G']=-1$ (da $-G''+G=\\delta$) danno $G=\\tfrac{1}{2}e^{-|x-\\xi|}$. In fisica &egrave; il potenziale di Yukawa unidimensionale: il termine di massa $+u$ diventa il decadimento esponenziale della risposta."}]},{"pool":"green","src":"tipo &middot; b01","steps":[{"t":"MODUS OPERANDI. Dopo aver calcolato una candidata $G(x,\\xi)$, i controlli rapidi da fare sono:","opts":[{"x":"BC ai due estremi, continuit&agrave; in $\\xi$, salto della derivata corretto, e simmetria $G(x,\\xi)=G(\\xi,x)$ se autoaggiunto","c":true},{"x":"solo che $G$ sia positiva"},{"x":"solo la continuit&agrave;"},{"x":"che $G$ risolva $\\mathcal{L}G=f$"},{"x":"che $G$ sia limitata"}],"hint":"Sono quattro firme indipendenti: se una manca, hai imposto una condizione sbagliata.","sol":"<b>Verifica di una Green.</b> Quattro controlli: (1) $G$ soddisfa le BC omogenee ai due estremi; (2) &egrave; continua in $x=\\xi$ (per sorgente $\\delta$); (3) $[G']=1/a_2(\\xi)$ col segno giusto; (4) $G(x,\\xi)=G(\\xi,x)$ per operatori autoaggiunti (Sturm-Liouville). La (4) &egrave; un controllo gratuito che scopre subito errori algebrici."}]},{"pool":"green","src":"tipo &middot; b01","steps":[{"t":"Nel problema $\\mathcal{L}u=f$ risolto via Green, la parte OMOGENEA della soluzione generale:","opts":[{"x":"&egrave; gi&agrave; inglobata: $u=\\int Gf$ soddisfa AUTOMATICAMENTE le BC, non si aggiunge $c_1u_1+c_2u_2$","c":true},{"x":"va aggiunta a parte con due costanti libere"},{"x":"si sceglie per rendere $u$ pari"},{"x":"coincide con la sorgente"}],"hint":"La Green &egrave; costruita con le BC dentro: la soluzione $\\int Gf$ le eredita, non restano costanti da fissare.","sol":"<b>Green vs variazione delle costanti.</b> A differenza del metodo diretto (soluzione generale $c_1u_1+c_2u_2+u_p$, poi si impongono le BC), la Green incorpora gi&agrave; le BC omogenee: $u=\\int Gf$ &egrave; LA soluzione del problema ai limiti, senza costanti residue. Aggiungere $c_1u_1+c_2u_2$ &egrave; un errore concettuale: violerebbe le BC gi&agrave; imposte."}]},{"pool":"green","src":"20240703 Es.4","steps":[{"t":"Se una soluzione dell'omogenea $f_1(x)=\\tan x$ &egrave; nota, la seconda si trova con:","opts":[{"x":"la formula di riduzione d'ordine (Wronskiano): $f_2=f_1\\int \\frac{1}{f_1^2}e^{-\\int a_1/a_2}\\,dy$","c":true},{"x":"la trasformata di Fourier"},{"x":"la formula di variazione delle costanti"},{"x":"il teorema dei residui"}],"hint":"Nota una soluzione, l'altra si ottiene abbassando l'ordine dell'equazione tramite il Wronskiano.","sol":"<b>Riduzione d'ordine (compito 03/07/2024).</b> Con $f_1$ nota, $f_2=f_1\\int f_1^{-2}\\,e^{-\\int a_1/a_2}\\,dy$: &egrave; la formula che ricostruisce la seconda soluzione dal Wronskiano ($f_1f_2'-f_1'f_2=e^{-\\int a_1/a_2}$). Attenzione al segno dell'esponente $-\\int a_1/a_2$: invertirlo d&agrave; una $f_2$ sbagliata. Per $\\cos^2x\\,f''-\\sin x\\cos x\\,f'-f=0$ si ottiene $f_2=1/\\cos x$."}]},{"pool":"green","src":"tipo &middot; b01","steps":[{"t":"Se la sorgente $\\xi$ della Green cadesse ESATTAMENTE su un estremo (es. $\\xi=a$):","opts":[{"x":"il ramo $x<\\xi$ si annulla e la costruzione degenera: la Green va intesa come limite $\\xi\\to a^+$","c":true},{"x":"$G$ raddoppia di valore"},{"x":"$G$ cambia segno"},{"x":"nulla cambia, la formula vale identica"}],"hint":"$u_1(x_{<})$ con $\\xi=a$ costringe $x_{<}=a$, dove $u_1(a)=0$ per la BC: il prodotto collassa.","sol":"<b>Caso limite $\\xi$ al bordo.</b> Poich&eacute; $u_1(a)=0$ per costruzione, con $\\xi=a$ il fattore $u_1(x_{<})$ si annulla e $G\\equiv0$ nel ramo interno: la sorgente sul bordo non produce risposta interna (coerente con le BC di Dirichlet). La Green &egrave; ben definita per $\\xi\\in(a,b)$ e si estende per continuit&agrave;."}]},{"pool":"green","src":"tipo &middot; b01","steps":[{"t":"Costruisci la Green di $-u''=f$ su $[0,1]$, $u(0)=u(1)=0$. I due rami (soluzioni di $u''=0$ adattate al bordo) sono:","opts":[{"x":"$u_1=x$ (annulla in $0$) e $u_2=1-x$ (annulla in $1$)","c":true},{"x":"$u_1=1-x$ e $u_2=x$"},{"x":"$u_1=x^2$ e $u_2=(1-x)^2$"},{"x":"$u_1=\\sin\\pi x$ e $u_2=\\cos\\pi x$"}],"hint":"$u''=0$ d&agrave; funzioni affini; scegli quella nulla in $0$ e quella nulla in $1$.","sol":"<b>Rami affini.</b> $u''=0\\Rightarrow u$ affine. $u_1(0)=0\\Rightarrow u_1=x$; $u_2(1)=0\\Rightarrow u_2=1-x$. Sono i due mattoni; $W(u_1,u_2)=x\\cdot(-1)-1\\cdot(1-x)=-1\\neq0$: indipendenti.","cont":"Imponi ora continuit&agrave; e salto &rarr;"},{"t":"Con $G=A\\,x$ per $x<\\xi$ e $G=B(1-x)$ per $x>\\xi$, le condizioni ($-G''=\\delta$) danno:","opts":[{"x":"$A\\xi=B(1-\\xi)$ (continuit&agrave;) e $-B-A=-1$ (salto), quindi $A=1-\\xi$, $B=\\xi$","c":true},{"x":"$A=B$ e $A+B=1$"},{"x":"$A\\xi=B(1-\\xi)$ e $B-A=1$"},{"x":"$A=\\xi$, $B=1-\\xi$"}],"hint":"Continuit&agrave;: uguaglia i due rami in $\\xi$. Salto: $[G']=G'(\\xi^+)-G'(\\xi^-)=-B-A$, e vale $-1$ perch&eacute; $-G''=\\delta$.","sol":"<b>Condizioni di raccordo.</b> Continuit&agrave;: $A\\xi=B(1-\\xi)$. Salto: $[G']=-B-A$; da $-G''=\\delta$ si ha $[G']=-1$, cio&egrave; $A+B=1$. Risolvendo: $A=1-\\xi$, $B=\\xi$. Quindi $G(x,\\xi)=x(1-\\xi)$ per $x\\le\\xi$ e $\\xi(1-x)$ per $x\\ge\\xi$, cio&egrave; $G=x_{<}(1-x_{>})$. Simmetrico ($G(x,\\xi)=G(\\xi,x)$): controllo superato.","cont":"Usa la Green con $f\\equiv1$ &rarr;"},{"t":"La soluzione con $f\\equiv1$, $u(x)=\\int_0^1 G(x,\\xi)\\,d\\xi$, vale:","opts":[{"x":"$u(x)=\\dfrac{x(1-x)}{2}$","c":true},{"x":"$u(x)=x(1-x)$"},{"x":"$u(x)=\\dfrac{x^2}{2}$"},{"x":"$u(x)=1-x$"}],"hint":"Spezza $\\int_0^1=\\int_0^x[\\xi(1-x)]d\\xi+\\int_x^1[x(1-\\xi)]d\\xi$: nel primo $\\xi<x$, nel secondo $\\xi>x$.","sol":"<b>Sovrapposizione.</b> $u=\\int_0^x\\xi(1-x)d\\xi+\\int_x^1x(1-\\xi)d\\xi=\\tfrac{x^2}{2}(1-x)+x\\tfrac{(1-x)^2}{2}=\\tfrac{x(1-x)}{2}$. Verifica: $-u''=1$, $u(0)=u(1)=0$. &Egrave; la parabola (corda tesa sotto carico uniforme)."}]},{"pool":"green","src":"20230620 Es.4","steps":[{"t":"Metodo diretto per $x^2u''+xu'-u=x^2$ su $[1,2]$, $u(1)=u(2)=0$. Una soluzione particolare $u_p=Ax^2$ ha:","opts":[{"x":"$A=1/3$, cio&egrave; $u_p=x^2/3$","c":true},{"x":"$A=1$, $u_p=x^2$"},{"x":"$A=1/2$"},{"x":"$A=-1/3$"}],"hint":"Sostituisci $u_p=Ax^2$: $x^2(2A)+x(2Ax)-Ax^2=3Ax^2$, uguaglia a $x^2$.","sol":"<b>Soluzione particolare.</b> $u_p=Ax^2\\Rightarrow x^2(2A)+x(2Ax)-Ax^2=3Ax^2=x^2\\Rightarrow A=1/3$. La generale &egrave; $u=c_1/x+c_2x+x^2/3$ (omogenea $\\{1/x,x\\}$ + particolare).","cont":"Imponi le BC &rarr;"},{"t":"Imponendo $u(1)=u(2)=0$ su $u=c_1/x+c_2x+x^2/3$ si ottiene:","opts":[{"x":"$u(x)=\\dfrac{4}{9x}-\\dfrac{7x}{9}+\\dfrac{x^2}{3}$","c":true},{"x":"$u(x)=\\dfrac{1}{x}-x+\\dfrac{x^2}{3}$"},{"x":"$u(x)=-\\dfrac{4}{9x}+\\dfrac{7x}{9}+\\dfrac{x^2}{3}$"},{"x":"$u(x)=\\dfrac{x^2}{3}$"}],"hint":"Sistema: $c_1+c_2+1/3=0$ e $c_1/2+2c_2+4/3=0$. Risolvi per $c_1,c_2$.","sol":"<b>Sistema per le costanti.</b> $u(1)=c_1+c_2+1/3=0$; $u(2)=c_1/2+2c_2+4/3=0$. Sottraendo: $c_2=-7/9$, quindi $c_1=4/9$. Risultato $u=\\tfrac{4}{9x}-\\tfrac{7x}{9}+\\tfrac{x^2}{3}$. La <b>variazione delle costanti</b> (o la Green) darebbe lo stesso; qui il metodo diretto &egrave; pi&ugrave; rapido perch&eacute; $u_p$ si indovina."}]},{"pool":"green","src":"20240910 Es.4","steps":[{"t":"Eulero non-omogenea $x^3u''+2x^2u'-2xu=x^3+1$ su $[1,\\infty)$. Dividendo per $x$ si ottiene Eulero con caratteristica:","opts":[{"x":"$\\alpha^2+\\alpha-2=0$, radici $\\alpha=1$ e $\\alpha=-2$: base $\\{x,\\,x^{-2}\\}$","c":true},{"x":"$\\alpha^2-\\alpha-2=0$, base $\\{x^2,\\,x^{-1}\\}$"},{"x":"$\\alpha^2+2\\alpha=0$, base $\\{1,\\,x^{-2}\\}$"},{"x":"$\\alpha^2-2=0$"}],"hint":"Dopo la divisione per $x$: $x^2u''+2xu'-2u=\\dots$; sostituisci $u=x^{\\alpha}$: $\\alpha(\\alpha-1)+2\\alpha-2=0$.","sol":"<b>Eulero, caratteristica (compito 10/09/2024).</b> $x^2u''+2xu'-2u$; $u=x^{\\alpha}$ d&agrave; $\\alpha(\\alpha-1)+2\\alpha-2=\\alpha^2+\\alpha-2=0$, radici $1,-2$. Base $\\{x,x^{-2}\\}$, Wronskiano $W=-3/x^2$.","cont":"Interpreta la BC all'infinito &rarr;"},{"t":"La BC insolita $\\lim_{x\\to\\infty}(u(x)-x^2/4)=0$ (con soluzione particolare $u_p=x^2/4-1/(2x)$) impone:","opts":[{"x":"il coefficiente del termine $\\propto x$ (che cresce) deve annullarsi: seleziona $A=0$","c":true},{"x":"$u(\\infty)=0$"},{"x":"il coefficiente di $x^{-2}$ nullo"},{"x":"nessuna condizione"}],"hint":"$u=Ax+Bx^{-2}+u_p$; per $x\\to\\infty$ il termine $Ax$ diverge mentre $x^2/4$ &egrave; gi&agrave; in $u_p$: cosa resta se $A\\neq0$?","sol":"<b>BC asintotica (trappola).</b> La condizione $\\lim(u-x^2/4)=0$ non dice $u(\\infty)=0$: dice che, tolto il termine $x^2/4$ (gi&agrave; in $u_p$), il resto svanisce. Il termine omogeneo $Ax$ crescerebbe linearmente $\\Rightarrow A=0$. Poi $u(1)=0$ fissa $B=1/4$: $u=x^2/4-1/(2x)+1/(4x^2)$."}]},{"pool":"green","src":"20241106 Es.4","steps":[{"t":"Costruisci la Green radiale di $u''+\\frac{2}{x}u'-\\frac{\\ell(\\ell+1)}{x^2}u=\\delta(x-a)$ su $(0,\\infty)$, $u\\to0$ a $0$ e $\\infty$. I rami adattati sono:","opts":[{"x":"$x^{\\ell}$ per $x<a$ (finito in $0$) e $x^{-\\ell-1}$ per $x>a$ (nullo a $\\infty$)","c":true},{"x":"$x^{-\\ell-1}$ per $x<a$ e $x^{\\ell}$ per $x>a$"},{"x":"$e^{\\ell x}$ e $e^{-\\ell x}$"},{"x":"$x^{\\ell}$ per entrambi i rami"}],"hint":"Ogni ramo deve soddisfare la BC dal suo lato: $x^{\\ell}\\to0$ in $0$, $x^{-\\ell-1}\\to0$ all'infinito.","sol":"<b>Rami radiali (compito 06/11/2024).</b> Base $\\{x^{\\ell},x^{-\\ell-1}\\}$. La BC in $0$ (regolarit&agrave;) seleziona $x^{\\ell}$ per $x<a$; la BC a $\\infty$ seleziona $x^{-\\ell-1}$ per $x>a$. Struttura $G=c\\,x_{<}^{\\ell}\\,x_{>}^{-\\ell-1}$.","cont":"Fissa la costante col Wronskiano &rarr;"},{"t":"Con $W(x^{\\ell},x^{-\\ell-1})=-(2\\ell+1)/x^2$ e coefficiente principale $a_2=1$, la costante d&agrave;:","opts":[{"x":"$G(x,a)=-\\dfrac{1}{2\\ell+1}\\Big[\\dfrac{x^{\\ell}}{a^{\\ell-1}}\\theta(a-x)+\\dfrac{a^{\\ell+2}}{x^{\\ell+1}}\\theta(x-a)\\Big]$","c":true},{"x":"$G(x,a)=+\\dfrac{1}{2\\ell+1}x^{\\ell}a^{-\\ell-1}$"},{"x":"$G(x,a)=x^{\\ell}a^{-\\ell-1}\\theta(a-x)$"},{"x":"$G(x,a)=-(2\\ell+1)\\,x^{\\ell}x^{-\\ell-1}$"}],"hint":"Il salto $[G']=1/a_2=1$ e $a_2 W=-(2\\ell+1)/x^2$ fissano $c=1/(a_2W)=-a^2/(2\\ell+1)$ valutato in $x=a$.","sol":"<b>Costante dal salto.</b> $c=1/(a_2(a)W(a))=-a^2/(2\\ell+1)$; moltiplicato per $x_{<}^{\\ell}x_{>}^{-\\ell-1}$ e riorganizzato d&agrave; $G(x,a)=-\\tfrac{1}{2\\ell+1}\\big[x^{\\ell}a^{-(\\ell-1)}\\theta(a-x)+a^{\\ell+2}x^{-\\ell-1}\\theta(x-a)\\big]$. La soluzione dell'equazione COINCIDE con $G$ perch&eacute; la sorgente &egrave; una $\\delta$ centrata in $a$."}]},{"pool":"green","src":"Set 4 es.6","steps":[{"t":"Costante coefficienti: la Green di $u''-3u'+2u=f$ su $[0,2]$, $u(0)=u(2)=0$, parte dalla base:","opts":[{"x":"$\\{e^{x},\\,e^{2x}\\}$, dalla caratteristica $\\alpha^2-3\\alpha+2=0$","c":true},{"x":"$\\{x,\\,x^2\\}$"},{"x":"$\\{e^{-x},\\,e^{-2x}\\}$"},{"x":"$\\{\\cos x,\\,\\sin x\\}$"}],"hint":"Coefficienti costanti: cerca $e^{\\alpha x}$ e risolvi $\\alpha^2-3\\alpha+2=0$.","sol":"<b>Base a coefficienti costanti.</b> $\\alpha^2-3\\alpha+2=(\\alpha-1)(\\alpha-2)=0\\Rightarrow\\alpha=1,2$: base $\\{e^{x},e^{2x}\\}$. Rami adattati: $u_1=e^{x}-e^{2x}$ ($u_1(0)=0$), $u_2=e^{x}-e^{2(x-1)}$... (adattata a $u(2)=0$ nella variante $\\delta'$). La firma di Eulero (monomi) &egrave; assente: qui si usano esponenziali."}]},{"pool":"green","src":"Set 4 es.9","steps":[{"t":"Eulero $x^2u''-2xu'+2u=x^{\\lambda}$ ($\\lambda>3$). Base omogenea e Wronskiano:","opts":[{"x":"base $\\{x,\\,x^2\\}$ (radici $1,2$), $W=x^2$","c":true},{"x":"base $\\{1,\\,x\\}$, $W=1$"},{"x":"base $\\{x^{-1},\\,x^2\\}$, $W=3x$"},{"x":"base $\\{x^2,\\,x^3\\}$"}],"hint":"$u=x^{\\alpha}$: $\\alpha(\\alpha-1)-2\\alpha+2=\\alpha^2-3\\alpha+2=0$; poi $W(x,x^2)=x\\cdot2x-1\\cdot x^2$.","sol":"<b>Eulero (Set 4).</b> $\\alpha^2-3\\alpha+2=0\\Rightarrow\\alpha=1,2$: base $\\{x,x^2\\}$. $W(x,x^2)=x(2x)-1(x^2)=x^2$. Non nullo per $x>0$.","cont":"Soluzione particolare per variazione delle costanti &rarr;"},{"t":"La particolare (variazione delle costanti) $u_p$ per sorgente $x^{\\lambda}$ &egrave;:","opts":[{"x":"$u_p=\\dfrac{x^{\\lambda}}{(\\lambda-1)(\\lambda-2)}$","c":true},{"x":"$u_p=\\dfrac{x^{\\lambda}}{\\lambda^2}$"},{"x":"$u_p=x^{\\lambda}\\ln x$"},{"x":"$u_p=\\dfrac{x^{\\lambda}}{\\lambda!}$"}],"hint":"Cerca $u_p=Cx^{\\lambda}$: sostituendo, $C[\\lambda(\\lambda-1)-2\\lambda+2]=1$, cio&egrave; $C[(\\lambda-1)(\\lambda-2)]=1$.","sol":"<b>Variazione delle costanti / coefficienti indeterminati.</b> $u_p=Cx^{\\lambda}$ d&agrave; $C[\\lambda(\\lambda-1)-2\\lambda+2]=C(\\lambda-1)(\\lambda-2)=1\\Rightarrow C=1/[(\\lambda-1)(\\lambda-2)]$. Definito per $\\lambda\\neq1,2$ (altrimenti risonanza con l'omogenea, e serve un fattore $\\ln x$)."}]},{"pool":"green","src":"tipo &middot; b01","steps":[{"t":"Caso di RISONANZA: se la sorgente $x^{\\lambda}$ ha $\\lambda$ uguale a una radice della caratteristica di Eulero, la particolare:","opts":[{"x":"acquista un fattore $\\ln x$: $u_p\\propto x^{\\lambda}\\ln x$","c":true},{"x":"non esiste"},{"x":"resta $Cx^{\\lambda}$ con $C$ finito"},{"x":"diventa costante"}],"hint":"&Egrave; l'analogo del fattore $x$ (o $t$) nella risonanza a coefficienti costanti: qui la variabile giusta &egrave; $\\ln x$.","sol":"<b>Risonanza in Eulero.</b> Se $\\lambda$ coincide con una radice $\\alpha$, $Cx^{\\lambda}$ risolve l'omogenea e non pu&ograve; dare la particolare: il coefficiente indeterminato esplode. Si moltiplica per $\\ln x$ (la variabile naturale di Eulero, immagine di $x$ sotto $t=\\ln x$): $u_p\\propto x^{\\alpha}\\ln x$. Analogo di $t\\,e^{\\alpha t}$ a coefficienti costanti."}]},{"pool":"green","src":"Set 4 es.2","steps":[{"t":"Coefficienti costanti $u''-4u=f$ su $[0,1]$, $u(0)=u(1)=0$. La base omogenea &egrave;:","opts":[{"x":"$\\{e^{2x},\\,e^{-2x}\\}$ (o equivalentemente $\\{\\sinh 2x,\\cosh 2x\\}$)","c":true},{"x":"$\\{\\sin 2x,\\,\\cos 2x\\}$"},{"x":"$\\{e^{4x},\\,e^{-4x}\\}$"},{"x":"$\\{x,\\,x^{-1}\\}$"}],"hint":"$\\alpha^2-4=0$: radici REALI $\\pm2$, quindi esponenziali reali (non trigonometriche).","sol":"<b>Radici reali vs immaginarie.</b> $\\alpha^2-4=0\\Rightarrow\\alpha=\\pm2$ reali: base $\\{e^{2x},e^{-2x}\\}$. Se fosse $u''+4u$ ($\\alpha=\\pm2i$) la base sarebbe $\\{\\sin2x,\\cos2x\\}$. Distinguere il segno del termine di ordine zero decide fra crescita esponenziale e oscillazione: errore frequente scambiarli."}]},{"pool":"green","src":"20230620 Es.4","steps":[{"t":"Perch&eacute; con BC di Dirichlet il segno di $W=6/x$ non &egrave; mai zero su $[1,2]$?","opts":[{"x":"per Abel $W\\propto1/x$ non si annulla su $[1,2]$; segno costante positivo, base sempre indipendente","c":true},{"x":"perch&eacute; $6>0$"},{"x":"perch&eacute; l'intervallo &egrave; corto"},{"x":"perch&eacute; le BC sono simmetriche"}],"hint":"$1/x$ non si annulla per $x$ finito: l'identit&agrave; di Abel garantisce segno costante.","sol":"<b>Segno costante del Wronskiano.</b> Per Abel $W(x)=W(x_0)e^{-\\int dx/x}\\propto1/x$, positivo su $[1,2]$: mai nullo, dunque $u_1=x-1/x$ e $u_2=x-4/x$ restano indipendenti su tutto l'intervallo e la Green &egrave; ben definita. Il valore $6/x$ conferma: nessuno zero in $[1,2]$."}]},{"pool":"green","src":"tipo &middot; b01","steps":[{"t":"Problema completo: $-u''=f$ su $[0,\\pi]$, $u(0)=u(\\pi)=0$, con $f(x)=\\sin x$. Prima si verifica l'esistenza della Green:","opts":[{"x":"l'omogeneo $-u''=0$ con Dirichlet ha solo $u\\equiv0$: la Green esiste","c":true},{"x":"$0$ &egrave; autovalore: la Green non esiste"},{"x":"non serve verificare"},{"x":"$f=\\sin x$ garantisce l'esistenza"}],"hint":"Le uniche soluzioni affini nulle a entrambi gli estremi sono la funzione nulla: applica l'alternativa di Fredholm.","sol":"<b>Esistenza (Fredholm).</b> $-u''=0$ d&agrave; $u$ affine; $u(0)=u(\\pi)=0\\Rightarrow u\\equiv0$. Nessuna omogenea non banale, quindi $0$ non &egrave; autovalore di $-d^2/dx^2$ con Dirichlet su $[0,\\pi]$: la Green esiste. (Attenzione: $-u''=\\lambda u$ ha autovalori $n^2$, il pi&ugrave; basso $1$, mai $0$.)","cont":"Risolvi direttamente e confronta &rarr;"},{"t":"La soluzione di $-u''=\\sin x$, $u(0)=u(\\pi)=0$ &egrave;:","opts":[{"x":"$u(x)=\\sin x$","c":true},{"x":"$u(x)=-\\sin x$"},{"x":"$u(x)=x\\sin x$"},{"x":"$u(x)=1-\\cos x$"}],"hint":"Cerca $u_p=C\\sin x$: $-u_p''=C\\sin x$, uguaglia a $\\sin x$. Poi controlla che soddisfi gi&agrave; le BC.","sol":"<b>Soluzione particolare che rispetta le BC.</b> $u_p=\\sin x\\Rightarrow-u_p''=\\sin x$ ✓, e $\\sin0=\\sin\\pi=0$: le BC sono gi&agrave; soddisfatte, nessuna omogenea da aggiungere. Coerente con $u=\\int G\\sin\\xi\\,d\\xi$. Qui $\\sin x$ &egrave; autofunzione con autovalore $1$: la Green agisce come $1/\\lambda=1$."}]},{"pool":"green","src":"tipo &middot; b01","steps":[{"t":"Un operatore $\\mathcal{L}u=a_2(x)u''+\\dots$ con $a_2(x_0)=0$ in un punto INTERNO $x_0\\in(a,b)$:","opts":[{"x":"ha un punto singolare: la costruzione standard della Green pu&ograve; fallire o richiedere condizioni extra in $x_0$","c":true},{"x":"non cambia nulla, si procede come sempre"},{"x":"ha sempre Green nulla"},{"x":"ha Wronskiano infinito"}],"hint":"Dividere per $a_2$ per portare in forma standard richiede $a_2\\neq0$: dove si annulla la teoria elementare non si applica direttamente.","sol":"<b>Punto singolare interno.</b> Il salto $[G']=1/a_2(\\xi)$ e la riduzione a forma standard richiedono $a_2\\neq0$. Uno zero interno di $a_2$ (es. Eulero $x^2u''$ con $0\\in(a,b)$) &egrave; un punto singolare: le soluzioni possono non essere limitate e servono condizioni di regolarit&agrave; l&igrave;. Negli esami l'intervallo esclude tipicamente il punto singolare (es. $[1,2]$ evita $x=0$)."}]},{"pool":"green","src":"tipo &middot; b01","steps":[{"t":"Riepilogo-strategia: per un problema ai limiti $\\mathcal{L}u=f$ con sorgente REGOLARE, l'ordine corretto delle mosse &egrave;:","opts":[{"x":"omogenea &rarr; verifica esistenza (Fredholm/Wronskiano) &rarr; rami adattati al bordo &rarr; continuit&agrave; + salto &rarr; $u=\\int Gf$","c":true},{"x":"$u=\\int Gf$ &rarr; omogenea &rarr; BC"},{"x":"salto della derivata &rarr; sorgente &rarr; BC &rarr; omogenea"},{"x":"si sceglie a caso una base e si impongono le BC alla fine"}],"hint":"L'esistenza va controllata prima di costruire: se la Green non c'&egrave;, la costruzione &egrave; tempo perso.","sol":"<b>Sequenza operativa completa.</b> (1) risolvi l'omogenea; (2) verifica con l'<b>alternativa di Fredholm</b> che l'omogeneo con le BC dia solo $0$ (equivalente: $W\\neq0$); (3) costruisci $u_1,u_2$ adattate agli estremi; (4) imponi continuit&agrave; $[G]=0$ e salto $[G']=1/a_2(\\xi)$ col segno giusto; (5) integra $u=\\int Gf$. La verifica di simmetria chiude il controllo."}]}],"greendelta":[{"pool":"greendelta","src":"tipo &middot; b01","steps":[{"t":"La distribuzione $\\delta'$ &egrave; definita, su una funzione di prova $\\varphi$, da:","opts":[{"x":"$\\langle\\delta',\\varphi\\rangle=-\\varphi'(0)$","c":true},{"x":"$\\langle\\delta',\\varphi\\rangle=\\varphi'(0)$"},{"x":"$\\langle\\delta',\\varphi\\rangle=\\varphi(0)$"},{"x":"$\\langle\\delta',\\varphi\\rangle=-\\varphi(0)$"}],"hint":"La derivata distribuzionale scarica la derivata sulla test con un segno meno: $\\langle T',\\varphi\\rangle=-\\langle T,\\varphi'\\rangle$.","sol":"<b>Definizione di derivata distribuzionale.</b> $\\langle\\delta',\\varphi\\rangle=-\\langle\\delta,\\varphi'\\rangle=-\\varphi'(0)$: si scarica la derivata sulla funzione di prova (che &egrave; $C^\\infty$) col segno meno dell'integrazione per parti. La $\\delta'$ &egrave; un funzionale perfettamente rigoroso, non una funzione: legge la PENDENZA della test nell'origine."}]},{"pool":"greendelta","src":"nucleo 15","steps":[{"t":"L'identit&agrave; $x\\,\\delta'(x)$ vale:","opts":[{"x":"$-\\delta(x)$","c":true},{"x":"$0$"},{"x":"$\\delta(x)$"},{"x":"$\\delta'(x)$"}],"hint":"Applica a una $\\varphi$: $\\langle x\\delta',\\varphi\\rangle=\\langle\\delta',x\\varphi\\rangle=-(x\\varphi)'|_0$.","sol":"<b>Identit&agrave; $x\\delta'=-\\delta$.</b> $\\langle x\\delta',\\varphi\\rangle=\\langle\\delta',x\\varphi\\rangle=-\\frac{d}{dx}(x\\varphi)\\big|_{0}=-(\\varphi+x\\varphi')\\big|_0=-\\varphi(0)=\\langle-\\delta,\\varphi\\rangle$. Quindi $x\\delta'(x)=-\\delta(x)$. &Egrave; la stessa struttura che, moltiplicando l'ODE per una potenza di $x$, fa comparire un termine $\\delta$ accanto alla $\\delta'$."}]},{"pool":"greendelta","src":"nucleo 15","steps":[{"t":"Per una funzione liscia $g$, il prodotto $g(x)\\,\\delta'(x-a)$ &egrave;:","opts":[{"x":"$g(a)\\,\\delta'(x-a)-g'(a)\\,\\delta(x-a)$","c":true},{"x":"$g(a)\\,\\delta'(x-a)$"},{"x":"$g(a)\\,\\delta'(x-a)+g'(a)\\,\\delta(x-a)$"},{"x":"$g'(a)\\,\\delta(x-a)$"}],"hint":"Espandi $g$ intorno ad $a$: $g(x)=g(a)+g'(a)(x-a)+\\dots$ e usa $(x-a)\\delta'(x-a)=-\\delta(x-a)$.","sol":"<b>Regola del prodotto con $\\delta'$.</b> $g(x)\\delta'(x-a)=[g(a)+g'(a)(x-a)+\\dots]\\delta'(x-a)=g(a)\\delta'(x-a)+g'(a)(x-a)\\delta'(x-a)=g(a)\\delta'(x-a)-g'(a)\\delta(x-a)$, usando $(x-a)\\delta'(x-a)=-\\delta(x-a)$. Questa &egrave; l'origine ESATTA del termine $\\delta$ extra quando il coefficiente principale dell'operatore non &egrave; costante."}]},{"pool":"greendelta","src":"tipo &middot; b03 Set 2","steps":[{"t":"L'integrale $\\int_{-\\infty}^{+\\infty}(x-\\xi)\\,\\delta'(x-\\xi)\\,dx$ vale:","opts":[{"x":"$-1$","c":true},{"x":"$0$"},{"x":"$+1$"},{"x":"$\\xi$"}],"hint":"Prendi come funzione di prova $\\varphi(x)=x-\\xi$: $\\int\\delta'(x-\\xi)\\varphi=-\\varphi'(\\xi)$.","sol":"<b>Azione di $\\delta'$ su una test lineare.</b> Con $\\varphi(x)=x-\\xi$, $\\int\\delta'(x-\\xi)\\varphi(x)\\,dx=-\\varphi'(\\xi)=-1$. &Egrave; il conto che &laquo;accende&raquo; la seconda condizione di raccordo: moltiplicando l'equazione per $(x-\\xi)$ e integrando, il membro con la sorgente d&agrave; $-1$."}]},{"pool":"greendelta","src":"tipo &middot; b01","steps":[{"t":"Con sorgente $\\delta(x-\\xi)$ (impulso semplice) in $\\mathcal{L}u=a_2u''+\\dots=\\delta$, le condizioni di raccordo sono:","opts":[{"x":"$u$ CONTINUA ($[u]=0$) e la DERIVATA salta ($[u']=1/a_2(\\xi)$)","c":true},{"x":"$u$ salta e la derivata &egrave; continua"},{"x":"salta sia $u$ sia $u'$"},{"x":"$[u]=1$ e $[u']=1$"}],"hint":"Integrando una sola volta, sopravvive solo $a_2u''$; la funzione non salta, la sua derivata s&igrave;.","sol":"<b>Condizioni di raccordo (sorgente $\\delta$).</b> Integrando $a_2u''+\\dots=\\delta$ su $[\\xi^-,\\xi^+]$: $a_2(\\xi)[u']=1$, mentre $[u]=0$ (la funzione resta continua, altrimenti $u''$ conterrebbe una $\\delta'$ che qui non c'&egrave;). Con $\\delta$ salta la DERIVATA. &Egrave; il caso opposto a quello con $\\delta'$."}]},{"pool":"greendelta","src":"nucleo 15","steps":[{"t":"Nel caso pulito $-u''=\\delta'(x-\\xi)$, le condizioni di raccordo diventano:","opts":[{"x":"la FUNZIONE salta ($[u]=-1$) e la DERIVATA &egrave; continua ($[u']=0$)","c":true},{"x":"la funzione &egrave; continua e la derivata salta di $1$"},{"x":"$[u]=1$ e $[u']=1$"},{"x":"entrambe continue"}],"hint":"Con $\\delta'$ i ruoli si scambiano rispetto a $\\delta$: qui integrando due volte trovi che &egrave; $u$ a saltare.","sol":"<b>Lo scambio di ruoli (nucleo 15).</b> Per $-u''=\\delta'(x-\\xi)$: integrando una volta $-[u']=\\int\\delta'=0\\Rightarrow[u']=0$ (derivata continua); moltiplicando per $(x-\\xi)$ e integrando, $[u]=-1$ (la funzione salta). <b>Con $\\delta'$ salta la funzione, non la derivata</b>: firma inversa rispetto alla $\\delta$. Vale cos&igrave; pulito SOLO per l'operatore $-d^2/dx^2$ puro."}]},{"pool":"greendelta","src":"20230704 Es.4","steps":[{"t":"TRAPPOLA n.1 di b01. Con una sorgente $\\delta'$ servono:","opts":[{"x":"DUE condizioni di raccordo (una sul salto della funzione, una sulla derivata): il sistema per $a,b$ ha bisogno di entrambe","c":true},{"x":"una sola condizione, come con $\\delta$"},{"x":"nessuna condizione, si legge la soluzione direttamente"},{"x":"tre condizioni"}],"hint":"$\\delta'$ &egrave; pi&ugrave; singolare di $\\delta$: fermarsi a una condizione lascia il sistema per i coefficienti sottodeterminato.","sol":"<b>Due condizioni di raccordo (compito 03/07/2024).</b> La sorgente $\\delta'$ &egrave; la derivata di $\\delta$: contiene informazione su DUE ordini di salto. Servono entrambe le condizioni (tipicamente $[u]$ e $[u']$) per chiudere il sistema $2\\times2$ nei coefficienti $a,b$ dei due rami. Fermarsi alla prima &laquo;accensione&raquo; lascia il sistema sottodeterminato: errore segnalato nelle soluzioni ufficiali."}]},{"pool":"greendelta","src":"20230704 Es.4","steps":[{"t":"TRAPPOLA n.2 di b01. L'errore da NON fare con $\\delta'$ &egrave;:","opts":[{"x":"confondere la continuit&agrave; di $f$ con quella di $f'$: applicare &laquo;continua + salto della derivata&raquo; (regola della $\\delta$) alla $\\delta'$","c":true},{"x":"integrare per parti"},{"x":"usare la base dell'omogenea"},{"x":"imporre le condizioni al bordo"}],"hint":"Chi ricorda a memoria lo schema della $\\delta$ e lo riusa sulla $\\delta'$ scambia esattamente il ruolo di $f$ e $f'$.","sol":"<b>Continuit&agrave; di $f$ vs $f'$ (trappola b01).</b> Con $\\delta$: $f$ continua, $f'$ salta. Con $\\delta'$: (nel caso $-u''$) $f$ salta, $f'$ continua. Applicare meccanicamente lo schema della $\\delta$ scambia i ruoli e sbaglia l'INTERO esercizio. La difesa &egrave; non ricordare a memoria ma <b>integrare l'equazione attorno al punto</b> e leggere cosa salta."}]},{"pool":"greendelta","src":"tipo &middot; b01","steps":[{"t":"MODUS OPERANDI. Il metodo ROBUSTO per trovare le condizioni di raccordo, valido anche con coefficienti variabili o termine $u'$, &egrave;:","opts":[{"x":"scrivere $u''=\\{u''\\}+[u']\\delta+[u]\\delta'$, sostituire nell'equazione e UGUAGLIARE i coefficienti di $\\delta$ e $\\delta'$ separatamente","c":true},{"x":"ricordare a memoria &laquo;$\\delta$: derivata salta, $\\delta'$: funzione salta&raquo;"},{"x":"integrare una sola volta e leggere il risultato"},{"x":"imporre solo la continuit&agrave;"}],"hint":"Le regole a memoria valgono solo per $-u''$ puro; il match dei coefficienti distribuzionali funziona sempre.","sol":"<b>Match dei coefficienti distribuzionali.</b> Una funzione con salto $[u]$ e derivata con salto $[u']$ ha derivata seconda $u''=\\{u''\\}+[u']\\delta(x-\\xi)+[u]\\delta'(x-\\xi)$. Si sostituisce in $\\mathcal{L}u=$ sorgente e si uguagliano i coefficienti di $\\delta'$ e di $\\delta$: due equazioni, sempre corrette, anche quando la regola mnemonica fallisce (coeff. variabili, termine $u'$)."}]},{"pool":"greendelta","src":"20231116 Es.4","steps":[{"t":"In $u''-3u'+2u=\\delta'(x-\\xi)$, il termine $-3u'$ FA saltare anche la derivata? (Ricordando $u'=\\{u'\\}+[u]\\delta$.)","opts":[{"x":"S&igrave;: il match d&agrave; $[u]=1$ (da $\\delta'$) e $[u']-3[u]=0\\Rightarrow[u']=3$: la derivata NON &egrave; continua","c":true},{"x":"No, la derivata resta continua come in $-u''=\\delta'$"},{"x":"No, salta solo la funzione di $1$"},{"x":"S&igrave;, ma con $[u']=1$"}],"hint":"$-3u'=-3\\{u'\\}-3[u]\\delta$: il termine $-3[u]\\delta$ si somma al $[u']\\delta$ da $u''$. Uguaglia il coefficiente di $\\delta$ a zero.","sol":"<b>Derivata che salta col termine $u'$ (compito 16/11/2024).</b> $u''-3u'+2u=\\{\\dots\\}+[u']\\delta+[u]\\delta'-3[u]\\delta=\\delta'$. Coefficiente di $\\delta'$: $[u]=1$. Coefficiente di $\\delta$: $[u']-3[u]=0\\Rightarrow[u']=3$. Quindi con questo operatore la derivata SALTA (di $3$): la regola pulita &laquo;$\\delta'\\Rightarrow$ derivata continua&raquo; vale solo per $-u''$ senza termine $u'$. Il match dei coefficienti coglie la differenza."}]},{"pool":"greendelta","src":"20230704 Es.4","steps":[{"t":"In $x^2u''=\\delta'(x-1)$ il coefficiente VARIABILE $x^2$ produce, oltre a $[u]=1$, anche:","opts":[{"x":"un salto della derivata $[u']=2$, dal termine $-g'(a)\\delta$ con $g=x^2$, $g'(1)=2$","c":true},{"x":"nessun effetto extra, $[u']=0$"},{"x":"$[u']=1$"},{"x":"un salto di $u''$"}],"hint":"$x^2\\delta'(x-1)=1\\cdot\\delta'(x-1)-2\\cdot\\delta(x-1)$ per la regola del prodotto: il $-2\\delta$ costringe la derivata a saltare.","sol":"<b>Coefficiente variabile (compito 03/07/2024).</b> $x^2\\delta'(x-1)=g(1)\\delta'-g'(1)\\delta=\\delta'(x-1)-2\\delta(x-1)$ con $g=x^2$. Il match: $[u]=1$ (da $\\delta'$) e $[u']-2[u]=0\\Rightarrow[u']=2$. Anche qui la derivata salta, per il $-2\\delta$ generato dal coefficiente non costante. La regola mnemonica pulita non basta: serve la regola del prodotto $g\\delta'=g(a)\\delta'-g'(a)\\delta$."}]},{"pool":"greendelta","src":"nucleo 15","steps":[{"t":"Le due FIRME grafiche da riconoscere a colpo d'occhio sono:","opts":[{"x":"sorgente $\\delta$: curva continua con ANGOLO (salto della pendenza); sorgente $\\delta'$: curva con SALTO verticale e pendenze uguali","c":true},{"x":"$\\delta$: salto verticale; $\\delta'$: angolo"},{"x":"entrambe: angolo"},{"x":"entrambe: salto verticale"}],"hint":"$\\delta$ &rarr; $u''$ ha una $\\delta$, quindi $u'$ salta: angolo. $\\delta'$ &rarr; $u$ salta: gradino.","sol":"<b>Firme grafiche (nucleo 15).</b> Con $\\delta$ la funzione &egrave; continua ma ha un ANGOLO in $\\xi$ (la derivata salta): $u=x_{<}(1-x_{>})$ per $-u''=\\delta$. Con $\\delta'$ (caso $-u''$) la funzione SALTA e le due pendenze coincidono. Se disegni la tua soluzione e non vedi la firma giusta, hai imposto la condizione sbagliata: &egrave; il controllo pi&ugrave; veloce."}]},{"pool":"greendelta","src":"tipo &middot; b01","steps":[{"t":"Quando la sorgente dell'ODE &egrave; una $\\delta(x-a)$ (non una $f$ regolare), la soluzione del problema ai limiti:","opts":[{"x":"COINCIDE con la funzione di Green $G(x,a)$ valutata in quel $\\xi=a$","c":true},{"x":"si ottiene solo integrando $\\int G f$"},{"x":"non esiste"},{"x":"&egrave; la derivata di $G$"}],"hint":"La Green &egrave; per definizione la risposta a $\\delta(x-\\xi)$: se la sorgente &egrave; gi&agrave; $\\delta(x-a)$, la risposta &egrave; $G$ stessa.","sol":"<b>La soluzione con sorgente $\\delta$ &egrave; la Green.</b> Poich&eacute; $\\mathcal{L}_xG(x,\\xi)=\\delta(x-\\xi)$ per definizione, il problema $\\mathcal{L}u=\\delta(x-a)$ con le stesse BC ha soluzione $u(x)=G(x,a)$: non serve integrare. &Egrave; il caso del compito 06/11/2024 (Eulero radiale con $\\delta(x-a)$), dove &laquo;risolvere l'equazione&raquo; e &laquo;calcolare la Green&raquo; sono la stessa cosa."}]},{"pool":"greendelta","src":"tipo &middot; b01","steps":[{"t":"MODUS OPERANDI. Ricevuto un esercizio &laquo;ODE con sorgente distribuzionale&raquo;, come si riconosce il TIPO e si sceglie la strada?","opts":[{"x":"si guarda se la sorgente &egrave; $\\delta$ (una condizione di salto sulla derivata) o $\\delta'$ (due condizioni): questo decide quante e quali giunzioni imporre","c":true},{"x":"si integra sempre due volte a prescindere"},{"x":"si applica sempre continuit&agrave; + salto della derivata"},{"x":"si usa la trasformata di Fourier in ogni caso"}],"hint":"Il grado della derivata della $\\delta$ nella sorgente = numero di condizioni di raccordo indipendenti da imporre.","sol":"<b>Riconoscere il tipo.</b> Primo passo: leggere l'ordine della sorgente. $\\delta^{(n)}$ richiede di far comparire $\\delta,\\delta',\\dots,\\delta^{(n)}$ nel match, cio&egrave; imporre condizioni fino all'ordine giusto. Per $\\delta$: una giunzione non banale ($[u']=1/a_2$, $[u]=0$). Per $\\delta'$: due ($[u]$ e $[u']$, con valori dettati dai coefficienti). Solo dopo si costruiscono i rami adattati al bordo."}]},{"pool":"greendelta","src":"tipo &middot; b01","steps":[{"t":"Il segno del salto (es. $[u]=+1$ oppure $-1$) si determina:","opts":[{"x":"leggendolo dall'equazione tramite il match dei coefficienti, non a memoria","c":true},{"x":"&egrave; sempre $+1$"},{"x":"&egrave; sempre $-1$"},{"x":"dal segno della soluzione al bordo"}],"hint":"Un segno meno davanti a $u''$, o il coefficiente principale, cambia il segno del salto: va letto caso per caso.","sol":"<b>Segno del salto dall'equazione.</b> Il segno di $[u]$ o $[u']$ dipende dal segno del coefficiente principale e da quello della sorgente. Es.: $-u''=\\delta'$ d&agrave; $[u]=-1$; $x^2u''=\\delta'(x-1)$ d&agrave; $[u]=+1$. Va SEMPRE ricavato uguagliando i coefficienti di $\\delta'$ (e $\\delta$), mai assunto. &Egrave; l'errore-segno pi&ugrave; frequente dopo lo scambio $f\\leftrightarrow f'$."}]},{"pool":"greendelta","src":"tipo &middot; b03 Set 2","steps":[{"t":"Per la composizione, $\\delta(g(x))$ con $g$ a zeri semplici $x_k$ vale:","opts":[{"x":"$\\displaystyle\\sum_k\\frac{\\delta(x-x_k)}{|g'(x_k)|}$","c":true},{"x":"$\\displaystyle\\sum_k\\delta(x-x_k)$"},{"x":"$\\displaystyle\\sum_k g'(x_k)\\,\\delta(x-x_k)$"},{"x":"$\\delta(x)/|g'(0)|$"}],"hint":"Ogni zero contribuisce con peso $1/|g'(x_k)|$: &egrave; il fattore che spesso si dimentica.","sol":"<b>Formula di composizione della $\\delta$.</b> $\\delta(g(x))=\\sum_k\\delta(x-x_k)/|g'(x_k)|$, somma sugli zeri semplici di $g$. Es.: $\\delta(x^2-a^2)=\\frac{1}{2|a|}[\\delta(x-a)+\\delta(x+a)]$. Dimenticare il fattore $1/|g'(x_k)|$ &egrave; l'errore tipico (d&agrave; un risultato scalato)."}]},{"pool":"greendelta","src":"20230704 Es.4","steps":[{"t":"Compito 03/07/2024: $x^2u''=\\delta'(x-1)$ su $[0,2]$, $u(0)=u(2)=0$. L'omogenea $x^2u''=0$ e i rami adattati al bordo sono:","opts":[{"x":"base $\\{1,x\\}$; $u_1=x$ (annulla in $0$), $u_2=1-x/2$ (annulla in $2$)","c":true},{"x":"base $\\{x,1/x\\}$; $u_1=x-1/x$, $u_2=x-4/x$"},{"x":"base $\\{e^{x},e^{2x}\\}$"},{"x":"base $\\{1,x^2\\}$"}],"hint":"$x^2u''=0$ per $x\\neq0$ significa $u''=0$: funzioni affini. Scegli quella nulla in $0$ e quella nulla in $2$.","sol":"<b>Rami dall'omogenea.</b> $x^2u''=0\\Rightarrow u''=0$: base $\\{1,x\\}$. $u_1(0)=0\\Rightarrow u_1=x$; $u_2(2)=0\\Rightarrow u_2=1-x/2$. Struttura $u=a\\,x$ per $x<1$, $u=b(1-x/2)$ per $x>1$: due incognite $a,b$ da fissare con le DUE condizioni di raccordo della $\\delta'$.","cont":"Ricava le due condizioni di raccordo &rarr;"},{"t":"Poich&eacute; $x^2\\delta'(x-1)=\\delta'(x-1)-2\\delta(x-1)$, il match dei coefficienti d&agrave;:","opts":[{"x":"$[u]=1$ (da $\\delta'$) e $[u']=2$ (da $\\delta$, per il termine $-2\\delta$)","c":true},{"x":"$[u]=1$ e $[u']=0$"},{"x":"$[u]=0$ e $[u']=1$"},{"x":"$[u]=-1$ e $[u']=-2$"}],"hint":"Scrivi $u''=\\{u''\\}+[u']\\delta+[u]\\delta'$, moltiplica per $x^2$ (usando $x^2\\delta'=\\delta'-2\\delta$) e uguaglia al secondo membro, che &egrave; solo $\\delta'$.","sol":"<b>Match dei coefficienti distribuzionali.</b> $x^2u''=x^2\\{u''\\}+[u']\\,x^2\\delta+[u]\\,x^2\\delta'$. Usando $x^2\\delta(x-1)=\\delta(x-1)$ e $x^2\\delta'(x-1)=\\delta'(x-1)-2\\delta(x-1)$: il coefficiente di $\\delta'$ &egrave; $[u]$, quello di $\\delta$ &egrave; $[u']-2[u]$. Il secondo membro &egrave; $\\delta'(x-1)$ (nessun termine $\\delta$), quindi $[u]=1$ e $[u']-2[u]=0\\Rightarrow[u']=2$. Con coefficiente VARIABILE la derivata salta (di $2$): non &egrave; il caso pulito del $-u''$.","cont":"Risolvi il sistema per $a,b$ &rarr;"},{"t":"Con $[u]=b/2-a=1$ e $[u']=-b/2-a=2$, la soluzione &egrave;:","opts":[{"x":"$a=-3/2$, $b=-1$: $u=-\\dfrac{3x}{2}\\,\\theta(1-x)+\\Big(\\dfrac{x}{2}-1\\Big)\\theta(x-1)$","c":true},{"x":"$a=3/2$, $b=1$"},{"x":"$a=-1$, $b=-3/2$"},{"x":"$a=0$, $b=-1$"}],"hint":"Somma le due equazioni: $(b/2-a)+(-b/2-a)=-2a=3$.","sol":"<b>Sistema $2\\times2$ (compito 03/07/2024).</b> $[u]=b/2-a=1$; $[u']=-b/2-a=2$. Sommando: $-2a=3\\Rightarrow a=-3/2$; poi $b/2=1+a=-1/2\\Rightarrow b=-1$. Quindi $u=-\\tfrac{3x}{2}$ per $x<1$ e $u=x/2-1$ per $x>1$: $u=-\\tfrac{3x}{2}\\theta(1-x)+(\\tfrac{x}{2}-1)\\theta(x-1)$. Verifica: $u(0)=0$, $u(2)=0$, e in $x=1$ la funzione salta di $1$ e la derivata di $2$."}]},{"pool":"greendelta","src":"20231116 Es.4","steps":[{"t":"Compito 16/11/2024: $u''-3u'+2u=\\delta'(x-1)$ su $[0,2]$, $u(0)=u(2)=0$. I rami adattati sono:","opts":[{"x":"$u_1=e^{x}-e^{2x}$ ($u_1(0)=0$) e $u_2=e^{x}-e^{2x-2}$ ($u_2(2)=0$)","c":true},{"x":"$u_1=e^{2x}$ e $u_2=e^{x}$"},{"x":"$u_1=e^{x}+e^{2x}$ e $u_2=e^{x}+e^{2x-2}$"},{"x":"$u_1=x$ e $u_2=2-x$"}],"hint":"Base $\\{e^{x},e^{2x}\\}$ (caratteristica $\\alpha^2-3\\alpha+2=0$). Combina i due esponenziali per annullare a ciascun estremo.","sol":"<b>Rami a coefficienti costanti.</b> $\\alpha^2-3\\alpha+2=0\\Rightarrow\\alpha=1,2$. $u_1=e^{x}-e^{2x}$ ha $u_1(0)=1-1=0$; $u_2=e^{x}-e^{2x-2}$ ha $u_2(2)=e^{2}-e^{2}=0$. Wronskiano $W=(e^{2}-1)e^{3x-2}\\neq0$: indipendenti, la Green esiste.","cont":"Ricava le due condizioni &rarr;"},{"t":"Il termine $-3u'$ (con $u'=\\{u'\\}+[u]\\delta$) fa s&igrave; che le condizioni siano:","opts":[{"x":"$[u]=1$ (da $\\delta'$) e $[u']=3$ (da $\\delta$): il risultato &egrave; $u=\\dfrac{1-2e}{e^{3}-e}(e^{2x}-e^{x})\\theta(1-x)+\\dfrac{2-e}{e^{2}-1}(e^{x}-e^{2x-2})\\theta(x-1)$","c":true},{"x":"$[u]=1$ e $[u']=0$ (derivata continua)"},{"x":"$[u]=0$ e $[u']=1$"},{"x":"$[u]=1$ e $[u']=-3$"}],"hint":"Nel match, $-3u'$ porta $-3[u]\\delta$: sommato al $[u']\\delta$ da $u''$ e uguagliato a zero d&agrave; $[u']=3[u]$.","sol":"<b>Derivata che salta col termine $u'$ (compito 16/11/2024).</b> $u''-3u'+2u=\\{\\dots\\}+[u']\\delta+[u]\\delta'-3[u]\\delta=\\delta'$. Coefficiente di $\\delta'$: $[u]=1$. Coefficiente di $\\delta$: $[u']-3[u]=0\\Rightarrow[u']=3$. NON &egrave; il caso pulito $\\delta'\\Rightarrow$ derivata continua: qui il termine $-3u'$ fa saltare anche la derivata. Imponendo le due condizioni sui rami si ottiene il risultato di b01."}]},{"pool":"greendelta","src":"nucleo 15","steps":[{"t":"Caso pulito: $-u''=\\delta'(x-\\tfrac12)$ su $[0,1]$, $u(0)=u(1)=0$. Le due condizioni di raccordo sono:","opts":[{"x":"$[u']=0$ (derivata continua) e $[u]=-1$ (la funzione salta)","c":true},{"x":"$[u']=1$ e $[u]=0$"},{"x":"$[u']=-1$ e $[u]=0$"},{"x":"$[u']=0$ e $[u]=1$"}],"hint":"Integra $-u''=\\delta'$ una volta ($\\Rightarrow[u']$) e poi moltiplica per $(x-\\tfrac12)$ e integra ($\\Rightarrow[u]$).","sol":"<b>Condizioni pulite per $-u''=\\delta'$ (nucleo 15).</b> Integrando una volta: $-[u']=\\int\\delta'=0\\Rightarrow[u']=0$. Moltiplicando per $(x-\\tfrac12)$ e integrando: $-\\int(x-\\tfrac12)u''=[u]$ e $\\int(x-\\tfrac12)\\delta'=-1\\Rightarrow[u]=-1$. Con l'operatore $-d^2/dx^2$ puro la derivata &egrave; continua e la funzione salta.","cont":"Determina i due rami &rarr;"},{"t":"Con $u=Ax$ per $x<\\tfrac12$ e $u=B(1-x)$ per $x>\\tfrac12$, imponendo $[u']=0$ e $[u]=-1$:","opts":[{"x":"$B=-A$ (da $[u']=0$) e $-A=-1$ (da $[u]$), quindi $A=1$, $B=-1$","c":true},{"x":"$A=B=1$"},{"x":"$A=-1$, $B=1$"},{"x":"$A=1$, $B=1$"}],"hint":"$u'(x<)=A$, $u'(x>)=-B$: $[u']=-B-A=0$. Poi $[u]=B(1-\\tfrac12)-A\\tfrac12=-1$ con $B=-A$.","sol":"<b>Sistema per i rami.</b> $[u']=-B-A=0\\Rightarrow B=-A$. $[u]=B/2-A/2=-A=-1\\Rightarrow A=1$, $B=-1$. Quindi $u=x$ per $x<\\tfrac12$ e $u=-(1-x)=x-1$ per $x>\\tfrac12$.","cont":"Controlla il disegno &rarr;"},{"t":"Il grafico di $u$ mostra:","opts":[{"x":"due rette di pendenza $1$ (derivata continua) con un SALTO di $-1$ in $x=\\tfrac12$: la firma della $\\delta'$","c":true},{"x":"un angolo senza salto (firma della $\\delta$)"},{"x":"una parabola continua"},{"x":"una funzione costante"}],"hint":"Pendenza uguale ai due lati = derivata continua; il gradino verticale = salto della funzione.","sol":"<b>Firma grafica della $\\delta'$ (nucleo 15).</b> $u=x$ e $u=x-1$ hanno la STESSA pendenza $1$ (derivata continua, $[u']=0$) e differiscono per $-1$ ($[u]=-1$): gradino verticale. &Egrave; la firma opposta alla $\\delta$, che darebbe un angolo senza salto. Il disegno &egrave; il controllo pi&ugrave; rapido dell'esercizio."}]},{"pool":"greendelta","src":"tipo &middot; b01","steps":[{"t":"CONTRASTO. $-u''=\\delta(x-\\tfrac12)$ su $[0,1]$, $u(0)=u(1)=0$ (sorgente $\\delta$, non $\\delta'$). La Green &egrave;:","opts":[{"x":"$G(x,\\xi)=x_{<}(1-x_{>})$, cio&egrave; $u=x(1-\\tfrac12)$ per $x<\\tfrac12$ e $\\tfrac12(1-x)$ per $x>\\tfrac12$","c":true},{"x":"$u=x$ per $x<\\tfrac12$, $x-1$ per $x>\\tfrac12$"},{"x":"$u=\\tfrac12 e^{-|x-1/2|}$"},{"x":"$u=\\sin\\pi x$"}],"hint":"Con $\\delta$: continua ($[u]=0$) con derivata che salta ($[u']=-1$). &Egrave; il triangolo, non il gradino.","sol":"<b>Green con $\\delta$ (contrasto).</b> $[u]=0$, $[u']=-1$: $G=x_{<}(1-x_{>})$. Con $\\xi=\\tfrac12$: $u=\\tfrac{x}{2}$ per $x<\\tfrac12$ e $\\tfrac{1-x}{2}$ per $x>\\tfrac12$. Funzione continua con ANGOLO in $\\tfrac12$.","cont":"Confronta le due firme &rarr;"},{"t":"La differenza col caso $\\delta'$ (stesso operatore) &egrave;:","opts":[{"x":"$\\delta$ d&agrave; una funzione continua con angolo; $\\delta'$ d&agrave; una funzione con salto e pendenza continua: gli oggetti sono qualitativamente diversi","c":true},{"x":"sono la stessa soluzione"},{"x":"differiscono solo per una costante"},{"x":"$\\delta$ non ha soluzione"}],"hint":"Angolo vs gradino: &egrave; esattamente lo scambio del ruolo di $f$ e $f'$.","sol":"<b>Angolo vs gradino.</b> Con $\\delta$: $u$ continua, $u'$ salta (angolo, triangolo). Con $\\delta'$: $u$ salta, $u'$ continua (gradino). &Egrave; la manifestazione visiva della trappola n.2 di b01: non confondere la continuit&agrave; di $f$ con quella di $f'$. Stessa equazione, sorgenti diverse, firme opposte."}]},{"pool":"greendelta","src":"nucleo 15","steps":[{"t":"Metodo robusto su $-u''=\\delta'(x-\\xi)$: scritto $u''=\\{u''\\}+[u']\\delta+[u]\\delta'$, sostituendo si ottiene:","opts":[{"x":"$-\\{u''\\}-[u']\\delta-[u]\\delta'=\\delta'(x-\\xi)$","c":true},{"x":"$\\{u''\\}+[u']\\delta+[u]\\delta'=\\delta'$"},{"x":"$-\\{u''\\}+[u']\\delta=\\delta'$"},{"x":"$[u]\\delta=\\delta'$"}],"hint":"Basta moltiplicare la decomposizione per $-1$ (l'operatore &egrave; $-d^2/dx^2$).","sol":"<b>Decomposizione distribuzionale.</b> $u''=\\{u''\\}+[u']\\delta+[u]\\delta'$, quindi $-u''=-\\{u''\\}-[u']\\delta-[u]\\delta'$. Uguagliato a $\\delta'(x-\\xi)$: si confrontano i coefficienti termine per termine.","cont":"Uguaglia i coefficienti &rarr;"},{"t":"Uguagliando i coefficienti di $\\delta'$ e di $\\delta$:","opts":[{"x":"$\\delta'$: $-[u]=1\\Rightarrow[u]=-1$; $\\delta$: $-[u']=0\\Rightarrow[u']=0$","c":true},{"x":"$[u]=1$ e $[u']=1$"},{"x":"$[u]=0$ e $[u']=-1$"},{"x":"$[u]=-1$ e $[u']=-1$"}],"hint":"La sorgente $\\delta'$ non ha termine $\\delta$: quindi il coefficiente di $\\delta$ a sinistra deve annullarsi.","sol":"<b>Match (metodo robusto).</b> Coefficiente di $\\delta'$: $-[u]=1\\Rightarrow[u]=-1$. Coefficiente di $\\delta$: $-[u']=0\\Rightarrow[u']=0$. Ritroviamo, senza regole a memoria, che con $-u''=\\delta'$ la funzione salta ($-1$) e la derivata &egrave; continua. Il metodo del match &egrave; quello che non sbaglia anche con coefficienti variabili."}]},{"pool":"greendelta","src":"tipo &middot; b03 Set 2","steps":[{"t":"$\\int_0^{\\infty}\\delta(x^2-1)\\,e^{x}\\,dx$. Prima si riscrive $\\delta(x^2-1)$ sugli zeri in $[0,\\infty)$:","opts":[{"x":"solo $x=1$ &egrave; nell'intervallo: $\\delta(x^2-1)=\\dfrac{\\delta(x-1)}{|2x|}\\Big|_{x=1}=\\dfrac{\\delta(x-1)}{2}$","c":true},{"x":"$\\delta(x^2-1)=\\delta(x-1)+\\delta(x+1)$"},{"x":"$\\delta(x^2-1)=2\\delta(x-1)$"},{"x":"$\\delta(x^2-1)=\\delta(x-1)$"}],"hint":"Zeri di $x^2-1$: $x=\\pm1$; solo $x=1\\in[0,\\infty)$. Peso $1/|g'(1)|$ con $g'=2x$.","sol":"<b>Composizione della $\\delta$ (Set 2).</b> $\\delta(x^2-1)=\\sum\\delta(x-x_k)/|g'(x_k)|$; su $[0,\\infty)$ solo $x=1$, con $|g'(1)|=|2\\cdot1|=2$: $\\delta(x^2-1)=\\delta(x-1)/2$.","cont":"Valuta l'integrale &rarr;"},{"t":"Quindi l'integrale vale:","opts":[{"x":"$e/2$","c":true},{"x":"$e$"},{"x":"$2e$"},{"x":"$e^{2}/2$"}],"hint":"$\\int\\frac{\\delta(x-1)}{2}e^{x}dx=\\frac12 e^{1}$.","sol":"<b>Valutazione.</b> $\\int_0^{\\infty}\\frac{\\delta(x-1)}{2}e^{x}dx=\\frac12 e^{1}=e/2$. Il fattore $1/2$ viene dal $|g'(1)|$: dimenticarlo darebbe $e$ (errore tipico segnalato)."}]},{"pool":"greendelta","src":"20241106 Es.4","steps":[{"t":"Eulero $x^2u''+xu'-u=\\delta(x-\\xi)$ su $[1,2]$, $u(1)=u(2)=0$. Con $u_1=x-1/x$, $u_2=x-4/x$ ($W=6/x$), il salto della derivata &egrave;:","opts":[{"x":"$[G']=1/\\xi^{2}$, perch&eacute; il coefficiente principale &egrave; $a_2=x^2$","c":true},{"x":"$[G']=1$"},{"x":"$[G']=6/\\xi$"},{"x":"$[G']=1/\\xi$"}],"hint":"Integra $x^2G''+\\dots=\\delta$: sopravvive $x^2G''$, quindi $\\xi^2[G']=1$.","sol":"<b>Salto con coefficiente principale (sorgente $\\delta$).</b> Integrando $x^2G''+xG'-G=\\delta$ su $[\\xi^-,\\xi^+]$: $\\xi^2[G']=1\\Rightarrow[G']=1/\\xi^2$. La funzione resta continua ($[G]=0$): sorgente $\\delta$, salta la derivata.","cont":"Costruisci la Green &rarr;"},{"t":"La costante nella struttura $G=c\\,u_1(x_{<})u_2(x_{>})$ vale:","opts":[{"x":"$c=\\dfrac{1}{a_2(\\xi)W(\\xi)}=\\dfrac{1}{\\xi^2\\cdot(6/\\xi)}=\\dfrac{1}{6\\xi}$","c":true},{"x":"$c=\\dfrac{1}{6}$"},{"x":"$c=\\dfrac{1}{\\xi^2}$"},{"x":"$c=6\\xi$"}],"hint":"$[G']=c\\,W(\\xi)$ deve uguagliare $1/\\xi^2$; con $W(\\xi)=6/\\xi$ si ricava $c$.","sol":"<b>Costante dalla condizione di salto.</b> $[G']=c(u_1u_2'-u_1'u_2)|_\\xi=c\\,W(\\xi)=c\\cdot6/\\xi$. Uguagliando a $1/\\xi^2$: $c=1/(6\\xi)$. Quindi $G(x,\\xi)=\\dfrac{(x_{<}-1/x_{<})(x_{>}-4/x_{>})}{6\\xi}$. La soluzione con sorgente $\\delta(x-\\xi)$ COINCIDE con questa $G$."}]},{"pool":"greendelta","src":"tipo &middot; b01","steps":[{"t":"Verifica di una candidata. Per $-u''=\\delta'(x-\\xi)$ ti propongono $u=Ax$ ($x<\\xi$), $u=B(1-x)$ ($x>\\xi$). Il PRIMO controllo &egrave; la derivata:","opts":[{"x":"$u'(x<)=A$, $u'(x>)=-B$: la continuit&agrave; $[u']=0$ richiede $B=-A$","c":true},{"x":"$[u']=1$ richiede $B=A+1$"},{"x":"la derivata deve saltare di $1$"},{"x":"$u'$ non serve controllarla"}],"hint":"Con $\\delta'$ (operatore $-u''$) la derivata &egrave; CONTINUA: imponi $[u']=0$.","sol":"<b>Primo controllo: derivata continua.</b> Per $-u''=\\delta'$ vale $[u']=0$: $u'(x>)-u'(x<)=-B-A=0\\Rightarrow B=-A$. Chi qui imponesse $[u']=\\pm1$ starebbe applicando la regola della $\\delta$, non della $\\delta'$ (trappola n.2).","cont":"Secondo controllo: il salto della funzione &rarr;"},{"t":"Il secondo controllo, $[u]=-1$, con $B=-A$ d&agrave;:","opts":[{"x":"$B(1-\\xi)-A\\xi=-A(1-\\xi)-A\\xi=-A=-1\\Rightarrow A=1,\\,B=-1$: la candidata &egrave; corretta","c":true},{"x":"$A=-1$, $B=1$"},{"x":"$A=B=1$"},{"x":"la candidata &egrave; incompatibile con le condizioni"}],"hint":"Sostituisci $B=-A$ nel salto $[u]=B(1-\\xi)-A\\xi$ e uguaglia a $-1$.","sol":"<b>Secondo controllo: salto della funzione.</b> $[u]=B(1-\\xi)-A\\xi=-A(1-\\xi)-A\\xi=-A=-1\\Rightarrow A=1$, $B=-1$. Entrambe le condizioni ($[u']=0$ e $[u]=-1$) sono soddisfatte: la forma proposta &egrave; corretta. Una candidata &egrave; valida solo se supera ENTRAMBE le condizioni di raccordo della $\\delta'$."}]},{"pool":"greendelta","src":"tipo &middot; b03 Set 2","steps":[{"t":"$\\int_{-\\infty}^{+\\infty}\\delta(x^2-4)\\,x^2\\,dx$ vale:","opts":[{"x":"$2$","c":true},{"x":"$8$"},{"x":"$4$"},{"x":"$16$"}],"hint":"$\\delta(x^2-4)=\\frac{1}{2|x|}[\\delta(x-2)+\\delta(x+2)]$: valuta $x^2$ in $\\pm2$ col peso $1/4$.","sol":"<b>Composizione con due zeri.</b> $\\delta(x^2-4)=\\frac{1}{|2x|}[\\delta(x-2)+\\delta(x+2)]=\\frac14[\\delta(x-2)+\\delta(x+2)]$. Quindi $\\int x^2\\delta=\\frac14(4+4)=2$. Errore tipico: dimenticare $1/|g'|$ e rispondere $8$."}]},{"pool":"greendelta","src":"tipo &middot; b01","steps":[{"t":"Per $-u''=\\delta(x-\\xi)$ (impulso semplice) le condizioni di raccordo sono:","opts":[{"x":"$[u]=0$ (continua) e $[u']=-1$ (dal segno meno davanti a $u''$)","c":true},{"x":"$[u]=-1$ e $[u']=0$"},{"x":"$[u]=0$ e $[u']=1$"},{"x":"$[u]=1$ e $[u']=0$"}],"hint":"Integra $-u''=\\delta$ una volta: $-[u']=1$; la funzione non salta.","sol":"<b>Raccordo per $\\delta$ (segno).</b> $\\int(-u'')=-[u']=\\int\\delta=1\\Rightarrow[u']=-1$; $[u]=0$. Con $\\delta$ salta la derivata (di $-1$ per il segno meno dell'operatore), la funzione resta continua. Opposto al caso $\\delta'$ dove salta la funzione."}]},{"pool":"greendelta","src":"nucleo 15","steps":[{"t":"$\\int_{-\\infty}^{+\\infty}\\delta'(x-2)\\,x^{3}\\,dx$ vale:","opts":[{"x":"$-12$","c":true},{"x":"$8$"},{"x":"$12$"},{"x":"$-8$"}],"hint":"$\\int\\delta'(x-a)\\varphi=-\\varphi'(a)$ con $\\varphi=x^3$, $\\varphi'=3x^2$.","sol":"<b>Azione di $\\delta'$.</b> $\\int\\delta'(x-2)x^3\\,dx=-\\frac{d}{dx}(x^3)\\big|_{x=2}=-3(2)^2=-12$. Il segno meno &egrave; la definizione stessa di $\\delta'$ ($\\langle\\delta',\\varphi\\rangle=-\\varphi'$): scordarlo d&agrave; $+12$."}]},{"pool":"greendelta","src":"nucleo 15","steps":[{"t":"La derivata distribuzionale seconda di $e^{-|x|}$ &egrave;:","opts":[{"x":"$e^{-|x|}-2\\delta(x)$, da cui $-\\tfrac12 e^{-|x|}$... anzi $\\tfrac12 e^{-|x|}$ &egrave; la Green di $-d^2/dx^2+1$","c":true},{"x":"$e^{-|x|}$ senza termine $\\delta$"},{"x":"$-e^{-|x|}+\\delta(x)$"},{"x":"$2\\delta(x)$"}],"hint":"$g'=-\\mathrm{sgn}(x)e^{-|x|}$ ha un salto $-2$ in $0$: la derivata seconda eredita un $-2\\delta$.","sol":"<b>Derivata distribuzionale con salto (nucleo 15).</b> $g'=-\\mathrm{sgn}(x)e^{-|x|}$, continua a tratti con salto $-2$ in $0$; quindi $g''=e^{-|x|}-2\\delta(x)$, cio&egrave; $-g''+g=2\\delta$. Perci&ograve; $\\tfrac12 e^{-|x|}$ risolve $(-d^2/dx^2+1)G=\\delta$: &egrave; il potenziale di Yukawa 1D, la Green su tutta la retta."}]},{"pool":"greendelta","src":"20231116 Es.4","steps":[{"t":"Nel compito 16/11/2024, la scelta $u_2=e^{x}-e^{2x-2}$ soddisfa la BC $u(2)=0$ perch&eacute;:","opts":[{"x":"$u_2(2)=e^{2}-e^{2\\cdot2-2}=e^{2}-e^{2}=0$","c":true},{"x":"$u_2(2)=e^{2}-e^{2x}$ si annulla per ogni $x$"},{"x":"$u_2(0)=0$"},{"x":"$u_2$ &egrave; costante"}],"hint":"Sostituisci $x=2$ nell'esponente $2x-2$: quanto vale $2\\cdot2-2$?","sol":"<b>Adattamento al bordo destro.</b> $u_2(2)=e^{2}-e^{2(2)-2}=e^{2}-e^{2}=0$: l'esponente $2x-2$ &egrave; costruito apposta per far coincidere i due esponenziali in $x=2$. &Egrave; il modo standard di adattare la base $\\{e^{x},e^{2x}\\}$ alla condizione $u(2)=0$."}]},{"pool":"greendelta","src":"20230704 Es.4","steps":[{"t":"Verifica del prodotto: $x^2\\,\\delta'(x-1)$ riscritto sui generatori $\\delta',\\delta$ vale:","opts":[{"x":"$\\delta'(x-1)-2\\,\\delta(x-1)$","c":true},{"x":"$\\delta'(x-1)$"},{"x":"$\\delta'(x-1)+2\\,\\delta(x-1)$"},{"x":"$2\\,\\delta(x-1)$"}],"hint":"Regola $g(x)\\delta'(x-a)=g(a)\\delta'(x-a)-g'(a)\\delta(x-a)$ con $g=x^2$, $a=1$.","sol":"<b>Regola del prodotto con $\\delta'$.</b> $g(x)\\delta'(x-a)=g(a)\\delta'-g'(a)\\delta$; con $g=x^2$, $g(1)=1$, $g'(1)=2$: $x^2\\delta'(x-1)=\\delta'(x-1)-2\\delta(x-1)$. &Egrave; il termine $-2\\delta$ che, nel compito 03/07/2024, fa saltare la derivata ($[u']=2$) accanto al salto della funzione."}]},{"pool":"greendelta","src":"nucleo 15","steps":[{"t":"La derivata distribuzionale seconda di $f(x)=|x|$ &egrave;:","opts":[{"x":"$f''=2\\delta(x)$: l'angolo produce una $\\delta$ di peso pari al salto della pendenza","c":true},{"x":"$f''=0$"},{"x":"$f''=\\delta(x)$"},{"x":"$f''=\\mathrm{sgn}(x)$"}],"hint":"$f'=\\mathrm{sgn}(x)=2H(x)-1$; deriva di nuovo ricordando $H'=\\delta$.","sol":"<b>Regola derivata a tratti (nucleo 15).</b> $|x|$ &egrave; continua, $f'=\\mathrm{sgn}(x)$ (nessuna $\\delta$: $f$ non salta). Poi $\\mathrm{sgn}=2H-1$, quindi $f''=2H'=2\\delta$. La pendenza salta da $-1$ a $+1$ (salto $2$): l'angolo genera una $\\delta$ di peso $2$ nella derivata seconda. &Egrave; l'inverso della firma della $\\delta'$ (dove a saltare &egrave; la funzione)."}]}],"polidrome":[{"pool":"polidrome","src":"20230620 Es.2","steps":[{"t":"I punti di diramazione di $f(z)=(z^2-1)^{1/2}$ sono:","opts":[{"x":"$z=\\pm1$, gli zeri del radicando: girando attorno a uno solo di essi la funzione cambia foglio","c":true},{"x":"$z=0$, dove il radicando vale $-1$"},{"x":"$z=\\pm i$, i poli"},{"x":"nessuno: la radice quadrata e' monodroma"}],"hint":"Un punto di diramazione e' dove il radicando si annulla di ordine dispari: l&igrave; l'argomento della radice ruota di meno di $2\\pi$ per un giro completo.","sol":"<b>Punti di diramazione (nucleo 11).</b> Scritto $f=(z-1)^{1/2}(z+2)^{1/2}$... qui $(z-1)^{1/2}(z+1)^{1/2}$: ogni fattore ha un punto di diramazione dove il suo argomento si annulla, cio&egrave; $z=1$ e $z=-1$. Girando attorno a uno solo, il suo $\\theta$ cresce di $2\\pi$ e la mezza-potenza acquista $e^{i\\pi}=-1$: la funzione non torna al valore iniziale. L'infinito e' il terzo punto candidato, da discutere a parte."}]},{"pool":"polidrome","src":"tipo b01","steps":[{"t":"Per rendere monodroma $(z^2-1)^{1/2}$ quali tagli sono leciti?","opts":[{"x":"il segmento $[-1,1]$, OPPURE le due semirette $(-\\infty,-1]\\cup[1,+\\infty)$: entrambe, purch&eacute; dichiarate","c":true},{"x":"solo il segmento $[-1,1]$"},{"x":"solo il semiasse reale positivo"},{"x":"un taglio dall'origine all'infinito"}],"hint":"La scelta e' libera finch&eacute; ogni cammino chiuso ammesso incontra un numero PARI di attraversamenti di ramo. Ci&ograve; che conta e' isolare i due punti di diramazione.","sol":"<b>Scelta del taglio (nucleo 11).</b> Un cammino che circonda ENTRAMBI i punti $\\pm1$ fa cambiare segno a ciascun fattore, e il prodotto dei due cambi riporta la funzione al valore iniziale: quindi fuori dal segmento $[-1,1]$ la funzione e' monodroma. In alternativa si tagliano le due semirette esterne. Il compito 20/06/2023 usa proprio le semirette; il 16/11/2023 usa il segmento. Determinazione diversa, funzione diversa: la scelta del taglio E' parte della risposta."}]},{"pool":"polidrome","src":"tipo b01","steps":[{"t":"Nella scrittura polare $f(z)=(z-1)^{1/2}(z+1)^{1/2}=\\sqrt{r_1 r_2}\\,e^{i(\\theta_1+\\theta_2)/2}$, i simboli $\\theta_1,\\theta_2$ sono:","opts":[{"x":"$\\theta_1=\\arg(z-1)$ e $\\theta_2=\\arg(z+1)$: un angolo polare centrato in CIASCUN punto di diramazione","c":true},{"x":"entrambi $\\arg z$, misurati dall'origine"},{"x":"gli argomenti di $z$ e $\\bar z$"},{"x":"le fasi dei due poli"}],"hint":"Ogni fattore $(z-z_0)^{1/2}$ porta il proprio angolo, misurato dal SUO punto di diramazione $z_0$, non dall'origine.","sol":"<b>Rappresentazione polare (metodo standard, b01).</b> Si pone $z-1=r_1 e^{i\\theta_1}$ e $z+1=r_2 e^{i\\theta_2}$: $r_1,r_2$ sono le distanze da $+1$ e $-1$, e $\\theta_1,\\theta_2$ gli angoli che i vettori $z-1$ e $z+1$ formano con l'asse reale. Allora $f=\\sqrt{r_1 r_2}\\,e^{i(\\theta_1+\\theta_2)/2}$. Tracciare come variano $\\theta_1$ e $\\theta_2$ muovendosi nel piano E' il cuore del tipo: e' l&igrave; che si annidano le trappole."}]},{"pool":"polidrome","src":"tipo b01","steps":[{"t":"MODUS OPERANDI. Davanti a un esercizio 'valori sul taglio + integrale' di una polidroma, la sequenza corretta e':","opts":[{"x":"(1) trova i punti di diramazione; (2) fissa il taglio e la determinazione dal dato reale-positivo; (3) porta $\\theta_1,\\theta_2$ dal riferimento ai punti chiesti ruotando attorno ai punti giusti; (4) costruisci il contorno che circonda il taglio e applica i residui","c":true},{"x":"calcola subito il residuo all'infinito e moltiplica per $2\\pi i$"},{"x":"sostituisci $z=e^{i\\theta}$ e integra sul cerchio unitario"},{"x":"chiudi con la semicirconferenza superiore e usa il lemma di Jordan"}],"hint":"Prima si fissa la determinazione (il 'foglio') dal dato; solo dopo si calcolano valori e integrale. Saltare la fissazione del foglio e' la causa n.1 di errore di segno.","sol":"<b>Strategia d'attacco (nucleo 11, tappa 03).</b> La sequenza e' invariante: diramazioni, taglio+determinazione, trasporto degli angoli, contorno. Il dato 'reale positiva sopra il taglio' fissa la coppia $(\\theta_1,\\theta_2)$ di riferimento; ogni valore successivo si ottiene ruotando attorno al SOLO punto di diramazione che il cammino circonda. Il verso di rotazione (orario/antiorario) determina il segno: e' il passo dove si perde o si vince l'esercizio."}]},{"pool":"polidrome","src":"20230620 Es.2","steps":[{"t":"$f(z)=(z^2-1)^{1/2}$, tagli su $(-\\infty,-1]\\cup[1,+\\infty)$, reale positiva sopra il taglio di destra ($x>1$, dove $\\theta_1=\\theta_2=0$). Per raggiungere $z=0$ dal riferimento, come ruotano gli angoli?","opts":[{"x":"solo $\\theta_1$ ruota di $\\pi$ (antiorario attorno a $+1$); $\\theta_2$ resta $0$
