const R = String.raw;

/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un
   rimando scritto nella prosa:

       <span class="str" data-str="serie-geometrica">la serie geometrica</span>

   Le schede citate da questo nucleo sono cucite qui sotto dal montaggio
   (assembla-nucleo.js): la pagina resta autosufficiente — niente fetch,
   niente sottocartelle da pubblicare — e un rimando a una scheda che non
   esiste FERMA la costruzione invece di arrivare in pagina rotto.
   Apertura: lo stesso gesto del collaudo (si clicca, il pannello compare,
   si typeset una volta sola), portato dentro la frase.
   =================================================================== */
var CORSO = 'meccanica-statistica';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["campo-vettoriale"] = {"nome":"Campo vettoriale","riga":"Una funzione che a ogni punto dello spazio associa un vettore, scritta $\\mathbf{F}(x,y,z)=F_x\\,\\hat{\\imath}+F_y\\,\\hat{\\jmath}+F_z\\,\\hat{k}$ con le tre componenti funzioni del punto.","serve":"È il modo di dire «c'è qualcosa in ogni punto dello spazio, e ha una direzione». Serve perché permette di smettere di ragionare su coppie di oggetti che si attraggono a distanza e di ragionare su una proprietà dello spazio: la sorgente prepara il campo, e chi arriva dopo sente solo ciò che trova dove si trova.","esempio":"Il campo di una carica puntiforme $q$ nell'origine è $\\mathbf{E}=\\dfrac{q}{4\\pi\\varepsilon_0 r^{2}}\\hat{r}$: la direzione è radiale, il modulo dipende solo dalla distanza. Con $q=1$ e $4\\pi\\varepsilon_0=1$, nel punto $(3,4,0)$ si ha $r=5$, quindi il modulo vale $\\tfrac{1}{25}$ e il versore è $\\left(\\tfrac35,\\tfrac45,0\\right)$: la componente lungo $x$ è $\\tfrac{3}{125}$.","pieno":{"file":"04-campi-vettoriali.html","tappa":"00","come":"la trattazione completa, nel nucleo sui campi vettoriali di Analisi Vettoriale"},"qui":{"elettromagnetismo":{"serve":"È l'oggetto che l'intero corso studia: $\\mathbf{E}$ e $\\mathbf{B}$ sono campi vettoriali, e le quattro equazioni di Maxwell sono affermazioni su come le loro derivate spaziali si legano alle sorgenti. Tutto ciò che si impara dopo — flusso, circuitazione, divergenza, rotore — è un modo di interrogare un campo vettoriale.","esempio":"Per la carica puntiforme in $(3,4,0)$ con $q=1$ e $4\\pi\\varepsilon_0=1$: $r=5$, modulo $\\tfrac{1}{25}$, e la componente lungo $x$ vale $\\tfrac{3}{125}$. Le tre componenti non sono tre campi separati: ruotando gli assi si mescolano fra loro, ed è quello che rende $\\mathbf{E}$ un vettore e non una terna di numeri."}},"controllo":[{"tipo":"uguale","sinistra":"sqrt(3**2+4**2)","vale":"5","dove":"esempio","appare":"r=5"},{"tipo":"uguale","sinistra":"1/sqrt(3**2+4**2)**2","vale":"1/25","dove":"esempio","appare":"\\tfrac{1}{25}"},{"tipo":"uguale","sinistra":"(1/5**2)*(3/5)","vale":"3/125","dove":"esempio","appare":"\\tfrac{3}{125}"},{"tipo":"uguale","sinistra":"sqrt(3**2+4**2)","vale":"5","dove":"qui.elettromagnetismo.esempio","appare":"r=5"},{"tipo":"uguale","sinistra":"(1/5**2)*(3/5)","vale":"3/125","dove":"qui.elettromagnetismo.esempio","appare":"\\tfrac{3}{125}"}]};
STRUM["teorema-della-divergenza"] = {"nome":"Teorema della divergenza","riga":"Il flusso uscente da una superficie chiusa è l'integrale della divergenza sul volume che racchiude: $\\oint_{\\partial V}\\mathbf F\\cdot\\hat n\\,dS=\\int_V\\nabla\\cdot\\mathbf F\\,dV$.","serve":"Scambia una domanda sul bordo con una sul volume. A destra c'è la divergenza, che è la densità di sorgente punto per punto; a sinistra il totale che esce. Si usa nei due versi: per calcolare un flusso scomodo con un integrale di volume comodo, e — in fisica soprattutto — per passare da una legge integrale a una legge locale, perché se due integrali di volume coincidono per OGNI volume allora coincidono gli integrandi.","esempio":"Per $\\mathbf F=\\mathbf r=(x,y,z)$ la divergenza vale $3$, quindi sulla palla di raggio $R$ il membro destro è $3\\cdot\\tfrac43\\pi R^{3}=4\\pi R^{3}$; il membro sinistro, calcolato come flusso, è il modulo $R$ per l'area $4\\pi R^{2}$, e dà lo stesso numero.","pieno":{"file":"05-teoremi-integrali.html","tappa":"02","come":"l'enunciato, la dimostrazione a fette e le ipotesi vere sul dominio, nel nucleo dei teoremi integrali"},"qui":{"elettromagnetismo":{"serve":"È il passaggio che trasforma la legge di Gauss integrale nella prima equazione di Maxwell, $\\nabla\\cdot\\mathbf E=\\rho/\\varepsilon_0$, e la conservazione della carica nell'equazione di continuità $\\nabla\\cdot\\mathbf J+\\partial_t\\rho=0$. La mossa è sempre la stessa: si scrive la legge su un volume arbitrario, si porta il flusso dentro come integrale di divergenza, e si osserva che un integrale nullo su OGNI volume obbliga l'integrando a essere nullo. L'arbitrarietà del volume non è un dettaglio: è tutta la dimostrazione.","esempio":"Per il campo di una carica puntiforme, di modulo $\\dfrac{q}{4\\pi\\varepsilon_0r^{2}}$ e diretto radialmente, la divergenza è nulla ovunque tranne nell'origine: in coordinate sferiche la divergenza di un campo radiale si scrive con $\\partial_r\\!\\left(r^{2}E_r\\right)$, e qui $r^{2}E_r$ non dipende da $r$, quindi la derivata fa $0$. Tutta la carica è finita nel punto escluso, ed è esattamente il buco che la $\\delta$ di Dirac serve a riempire."}},"controllo":[{"tipo":"uguale","sinistra":"diff(x,x)+diff(y,y)+diff(z,z)","vale":"3","dove":"esempio","appare":"vale $3$"},{"tipo":"uguale","sinistra":"3*(4/3)*pi*R**3","vale":"4*pi*R**3","dove":"esempio","appare":"4\\pi R^{3}"},{"tipo":"derivata","espr":"r**2*(q/(4*pi*e0*r**2))","rispetto":["r"],"vale":"0","dove":"qui.elettromagnetismo.esempio","appare":"la derivata fa $0$"}]};
STRUM["teorema-di-schwarz"] = {"nome":"Teorema di Schwarz","riga":"Se le derivate seconde miste di $f$ esistono e sono continue, allora non dipendono dall'ordine: $\\partial_x\\partial_y f=\\partial_y\\partial_x f$.","serve":"È l'ipotesi silenziosa di metà dei conti: ogni volta che si scambia l'ordine di due derivate — nel rotore di un gradiente, nelle relazioni di Maxwell della termodinamica, nella cancellazione dei termini secondi in una parentesi di Lie — si sta usando Schwarz senza nominarlo. Vale la pena sapere che è un teorema e non una regola di calcolo, perché **è falso senza la continuità**: esistono funzioni con entrambe le derivate miste definite ovunque e diverse in un punto. In pratica tutto ciò che si incontra è $C^{\\infty}$ e il teorema si applica sempre; il caso in cui conta davvero è quello inverso, quando l'asimmetria di un'espressione rispetto allo scambio di due derivate è il segnale che l'oggetto non è un gradiente e che lì c'è della geometria.","esempio":"Con $f(x,y)=x^{2}y^{3}$ si deriva prima in $y$, ottenendo $3x^{2}y^{2}$, e poi in $x$, ottenendo $6xy^{2}$. Nell'ordine opposto si deriva prima in $x$, ottenendo $2xy^{3}$, e poi in $y$: di nuovo $6xy^{2}$. I due cammini passano per espressioni diverse e arrivano allo stesso posto, ed è questo il contenuto del teorema — non che i passaggi intermedi si somiglino, ma che l'arrivo coincida. Il controesempio classico, che mostra dove sta il confine, è $g(x,y)=xy\\frac{x^{2}-y^{2}}{x^{2}+y^{2}}$ prolungata con $g(0,0)=0$: le due derivate miste nell'origine valgono $-1$ e $+1$, perché le derivate seconde esistono ma non sono continue lì.","debito":"la dimostrazione (via teorema del valor medio applicato due volte al rapporto incrementale doppio) sta in ogni corso di Analisi 2 e non è riportata; qui c'è l'enunciato e il confine.","controllo":[{"tipo":"derivata","espr":"x**2*y**3","rispetto":["y"],"vale":"3*x**2*y**2","ipotesi":{"x":"real","y":"real"},"dove":"esempio","appare":"3x^{2}y^{2}"},{"tipo":"derivata","espr":"x**2*y**3","rispetto":["y","x"],"vale":"6*x*y**2","ipotesi":{"x":"real","y":"real"},"dove":"esempio","appare":"6xy^{2}"},{"tipo":"derivata","espr":"x**2*y**3","rispetto":["x"],"vale":"2*x*y**3","ipotesi":{"x":"real","y":"real"},"dove":"esempio","appare":"2xy^{3}"}]};

function schedaHTML(s){

  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';

  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';

}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;

{ num:'00', title:'Perché questo movimento', meta:'il moto smette di essere una traiettoria e diventa un flusso · e la traiettoria viene sostituita da una probabilità',
  blocchi:[
  {t:'prosa', title:'Il cambio di sguardo', tag:'first principles', html:R`
  <p>In meccanica un sistema è una <b>traiettoria</b>: si dà $x(t)$ e si è detto tutto. Ma se le particelle sono $10^{23}$, nessuno scriverà mai quelle traiettorie, e soprattutto <i>non servono</i>: ciò che si misura sono poche grandezze macroscopiche.</p>
  <p>Il passaggio che rende possibile la meccanica statistica è cambiare oggetto due volte, e i due passaggi vanno tenuti distinti perché sono indipendenti. <b>Il primo</b>: non più una traiettoria nello spazio ordinario, ma <b>un punto in uno spazio più grande</b> — lo <b>spazio delle fasi</b>, dove le coordinate sono <i>tutte</i> le posizioni e <i>tutti</i> gli impulsi. Un sistema di $N$ atomi è <b>un solo punto</b> in $6N$ dimensioni, e la sua evoluzione è il moto di quel punto: un flusso. <b>Il secondo</b>, che è l&rsquo;operazione di Gibbs: non più un punto, ma una <b>distribuzione di probabilità</b> su quello spazio — e con essa l&rsquo;abbandono definitivo della traiettoria come oggetto di calcolo.</p>
  <p>Fra i due passaggi c&rsquo;è un teorema che sembra tecnico e invece decide tutto: il flusso hamiltoniano <b>non comprime i volumi</b>. È il teorema di Liouville, ed è quello che rende legittimo, più avanti, «contare gli stati»: il conteggio non dipende dall&rsquo;istante in cui si conta. Ed è anche la ragione per cui la freccia del tempo diventa un problema, perché un flusso che non comprime niente non dimentica niente.</p>`},
  {t:'prosa', title:'Cosa saprai fare, uscendo di qui', tag:'performance attesa', html:R`
  <ul>
  <li>Costruire lo spazio $\Gamma$, contarne le dimensioni nei casi non banali, e riconoscere l&rsquo;evoluzione come un <b>campo vettoriale</b>.</li>
  <li>Dire in che senso una traiettoria è <b>chiusa oppure non si autointerseca mai</b>, e da quale proprietà delle equazioni segue.</li>
  <li>Esporre l&rsquo;<b>operazione concettuale di Gibbs</b>: cosa guadagna e cosa perde chi sostituisce la traiettoria con una densità di probabilità.</li>
  <li>Dimostrare il <b>teorema di Liouville</b> nei tre modi — dall&rsquo;equazione di continuità (la via del corso), dalla divergenza nulla, dallo jacobiano unitario — e dire quale ipotesi serve davvero.</li>
  <li>Scrivere l&rsquo;<b>equazione di Liouville</b> con le parentesi di Poisson, e dedurne quali distribuzioni sono stazionarie.</li>
  <li>Spiegare perché l&rsquo;<b>entropia di Gibbs non cambia mai</b>, e perché questo rende problematica l&rsquo;irreversibilità.</li>
  <li>Enunciare la <b>ricorrenza di Poincaré</b>, stimarne il tempo, e non concluderne la cosa sbagliata.</li>
  </ul>`},

/* ---------------- 01 · LO SPAZIO Γ E IL FLUSSO ---------------- */
{ num:'01', title:'Lo spazio Γ e il flusso hamiltoniano', meta:'stato = punto · evoluzione = campo vettoriale · inversione temporale · e perché le traiettorie non si incrociano',
  blocchi:[
  {t:'prosa', title:'Costruzione, e quante dimensioni servono davvero', tag:'grammatica', html:R`
  <p>Uno stato di un sistema di $N$ atomi è specificato dalle $3N$ coordinate canoniche $q_1\dots q_{3N}$ e dai $3N$ momenti coniugati $p_1\dots p_{3N}$. Lo spazio a <b>$6N$ dimensioni</b> individuato da coordinate e momenti si chiama <b>spazio delle fasi</b>, o <b>spazio $\Gamma$</b>, e un suo punto rappresenta lo stato dell&rsquo;<i>intero</i> sistema.</p>
  <p>Vale la pena registrare subito un dettaglio che Sciortino mette in nota e che smonta l&rsquo;idea che «$6N$» sia una formula: nel caso di <b>molecole che non godono di particolari simmetrie</b> lo spazio ha dimensione <b>$12N$</b>, perché bisogna includere anche le variabili orientazionali e i loro momenti coniugati. La dimensione di $\Gamma$ non è un numero da ricordare: è il doppio del numero di gradi di libertà, e quanti siano lo decide il sistema. Nel seguito si resta al caso atomico.</p>
  <p>Data l&rsquo;<b>hamiltoniana</b> $H(q,p)$ — per i sistemi meccanici, l&rsquo;energia espressa in queste variabili — l&rsquo;evoluzione è
  $$\dot q_i=\frac{\partial H}{\partial p_i},\qquad \dot p_i=-\frac{\partial H}{\partial q_i}.$$
  Queste equazioni descrivono come il <b>punto rappresentativo</b> si muove in $\Gamma$ al passare del tempo. Un&rsquo;osservabile, nel caso classico, è una funzione delle $3N$ coordinate e dei $3N$ momenti, cioè <b>una funzione del punto rappresentativo</b>: l&rsquo;energia è il valore di $H$ calcolato in $(q,p)$, e dipende dal tempo solo attraverso il moto del punto.</p>`},
  {t:'reveal', title:'Tre proprietà che seguono dalla forma delle equazioni', tag:'derivazione', steps:[
   {label:'Primo ordine, quindi determinismo punto per punto', body:R`<p>Il sistema è del <b>primo ordine</b>: assegnato il punto $(q,p)$, il futuro è determinato — non serve altro. Due differenze sostanziali rispetto a Newton, e sono il motivo per cui si passa a Hamilton. La prima è appunto questa: nello spazio ordinario due traiettorie possono passare per lo stesso punto <i>con velocità diverse</i>, e l&rsquo;informazione mancante è l&rsquo;impulso; in $\Gamma$ l&rsquo;impulso <b>è una coordinata</b>, e quindi per ogni punto passa una sola traiettoria.</p>
   <p>La seconda: il membro destro è un <b><span class="str" data-str="campo-vettoriale">campo vettoriale</span></b> $\mathbf v=(\partial_pH,\,-\partial_qH)$ su $\Gamma$, e l&rsquo;evoluzione è il suo flusso. Tutto il linguaggio dei campi — divergenza, flusso attraverso una superficie, linee di campo — si applica di peso, e nella tappa 03 sarà esattamente questo a dare il teorema.</p>`},
   {label:'Chiusa, oppure che non si autointerseca mai', body:R`<p>Sciortino lo mette come <b>Concetto Importante</b>, e l&rsquo;argomento è di una riga: <i>le traiettorie distinte al tempo $0$ non si intersecano mai — se lo facessero, evolverebbero in modo identico nel futuro e sarebbero dovute essere identiche anche nel passato</i>. Applicato a una singola traiettoria, questo dice che il luogo del punto rappresentativo è <b>o una curva chiusa, o una curva che non si autointerseca</b>: se si autointersecasse, da quel punto d&rsquo;incrocio partirebbero due futuri diversi.</p>
   <p>La conseguenza è più forte di quanto sembri, e va tenuta per la tappa 07: una curva che non si autointerseca, in uno spazio di volume finito, deve <i>riempirlo</i> avvolgendosi su se stessa senza mai toccarsi — e non può mai passare <b>esattamente</b> per tutti i punti. È il primo indizio del problema ergodico.</p>`},
   {label:'Invarianza per inversione temporale', body:R`<p>Si supponga che $H$ non dipenda da nessuna derivata temporale di $p$ e $q$ — cioè che non ci siano forze dissipative. Allora la dinamica è <b>invariante sotto l&rsquo;inversione del tempo</b>: la trasformazione $t\to-t$ accompagnata da $p\to-p$ lascia le equazioni di Hamilton identiche. Si verifica sostituendo: $\dot q\to-\dot q$ e $p\to-p$ lasciano invariata la prima equazione, e nella seconda entrambi i membri cambiano segno.</p>
   <p><b>Questa è la proprietà che rende l&rsquo;irreversibilità un problema, e non una constatazione.</b> Ogni filmato di un sistema hamiltoniano, proiettato al rovescio, mostra un altro moto <i>possibile</i>. Se le leggi microscopiche non distinguono passato e futuro, la freccia del tempo non può essere fra le loro conseguenze: deve nascere altrove, e trovare quell&rsquo;«altrove» è il programma dei due movimenti che seguono.</p>`}
  ]},
  {t:'prosa', title:'Il caso da avere in mano: l’oscillatore armonico', tag:'esempio che si riusa', html:R`
  <p>Per $H=\dfrac{p^{2}}{2m}+\dfrac12m\omega^{2}q^{2}$ le equazioni di Hamilton danno, derivando:
  $$\dot q=\frac{\partial H}{\partial p}=\frac{p}{m},\qquad \dot p=-\frac{\partial H}{\partial q}=-m\omega^{2}q.$$
  Le curve di livello di $H$ sono <b>ellissi</b>, e poiché $H$ si conserva <i>ogni traiettoria è</i> una di quelle ellissi. Vale la pena calcolarne l&rsquo;area, perché è una quantità che ritornerà: all&rsquo;energia $E$ i semiassi sono $q_{\max}=\sqrt{2E/(m\omega^{2})}$ e $p_{\max}=\sqrt{2mE}$, quindi l&rsquo;area racchiusa è
  $$\mathcal A=\pi\,q_{\max}p_{\max}=\pi\sqrt{\frac{2E}{m\omega^{2}}}\sqrt{2mE}=\frac{2\pi E}{\omega}.$$
  <b>L&rsquo;area nello spazio delle fasi è proporzionale all&rsquo;energia</b>, e la costante di proporzionalità è il periodo $2\pi/\omega$. Né la massa né la costante elastica compaiono separatamente: solo la frequenza. È il primo esempio di una quantità geometrica in $\Gamma$ che ha significato fisico, e quando si conteranno gli stati sarà proprio un&rsquo;area — divisa per $h$ — a dirne il numero.</p>`},
  {t:'plot', title:'Il flusso dell’oscillatore: orbite chiuse percorse senza incrociarsi',
   intro:R`Campo $(\dot q,\dot p)=(p,\,-q)$ in unità con $m=\omega=1$: le traiettorie sono le curve di livello di $H$, cioè circonferenze.`,
   plots:[
    {kind:'phase', fx:'y', fy:'-x', xr:[-2.6,2.6], yr:[-2.6,2.6], n:15, height:340,
     seeds:[[1,0],[1.8,0],[2.4,0]],
     title:'spazio delle fasi dell oscillatore: q in ascissa, p in ordinata'}
   ],
   leggi:R`<p>Ogni traiettoria è una curva <b>chiusa</b>: il moto è periodico e il sistema torna esattamente dov&rsquo;era. Le curve <b>non si intersecano</b> — se lo facessero, da un punto partirebbero due futuri diversi, impossibile per un sistema del primo ordine. Il verso è orario: a $p\gt0$ la posizione cresce, e la forza di richiamo fa calare $p$.</p>
   <p><b>Che cosa impararne oltre il disegno.</b> Il ritratto di fase contiene tutta la dinamica <i>senza risolvere l&rsquo;equazione</i>: energia, periodo e ampiezza si leggono dalla forma delle orbite. In un sistema a $10^{23}$ particelle non si potrà disegnarlo, ma il ragionamento resta lo stesso — e conviene impararlo qui, dove si vede. <b>Un avvertimento sulla particolarità di questo esempio</b>: nell&rsquo;oscillatore armonico il periodo <i>non</i> dipende dall&rsquo;energia, quindi due punti vicini su orbite diverse restano vicini per sempre. È il caso eccezionale: in quasi ogni altro sistema il periodo dipende dall&rsquo;energia, e due punti inizialmente vicini si separano. La figura della tappa successiva mostra quel caso.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Perché nello spazio delle fasi le traiettorie non possono incrociarsi, mentre nello spazio ordinario sì?`,
    a:R`Perché il sistema di Hamilton è del <b>primo ordine</b>: il campo vettoriale assegna a ogni punto <b>una</b> velocità, e per il teorema di esistenza e unicità delle soluzioni di un&rsquo;equazione differenziale ordinaria con campo lipschitziano, per ogni punto passa una sola soluzione. Nello spazio ordinario due traiettorie possono passare per lo stesso punto <b>con velocità diverse</b>: l&rsquo;informazione mancante è proprio l&rsquo;impulso, che in $\Gamma$ è una coordinata. <b>Lo spazio delle fasi è lo spazio in cui il moto diventa deterministico punto per punto.</b>`},
   {q:R`Un moto smorzato converge verso l&rsquo;origine del piano delle fasi, e quindi infinite traiettorie finiscono nello stesso punto. È una violazione?`,
    a:R`No, ed è istruttivo vedere perché. Le traiettorie <b>si avvicinano</b> all&rsquo;origine senza raggiungerla in tempo finito, quindi non si incrociano mai davvero. Ma soprattutto: il moto smorzato <b>non è hamiltoniano</b> — l&rsquo;attrito dipende da $\dot q$, e per un&rsquo;hamiltoniana vale l&rsquo;ipotesi opposta, che $H$ non contenga derivate temporali. Perciò nessuna delle tre proprietà di questa tappa si applica: né l&rsquo;unicità globale, né l&rsquo;invarianza per inversione temporale, né (nella tappa 03) la conservazione del volume. <b>L&rsquo;attrito è una descrizione efficace</b>, ottenuta eliminando i gradi di libertà del mezzo: nel sistema completo la dinamica è hamiltoniana e tutto torna.`}
  ]}

/* ---------------- 02 · L’OPERAZIONE DI GIBBS ---------------- */
{ num:'02', title:'L’operazione concettuale di Gibbs: dalla traiettoria alla probabilità', meta:'un macrostato sono molti microstati · l’ensemble come copie mentali · la media termodinamica · e cosa si guadagna eliminando il tempo',
  blocchi:[
  {t:'prosa', title:'Perché una traiettoria non è la risposta', tag:'first principles', html:R`
  <p>Fare misure fisiche, e specialmente misure all&rsquo;equilibrio, implica la capacità di <b>riprodurre i risultati</b>. Perciò ci si deve aspettare che le osservabili misurate siano «simili» per numerosissimi punti di $\Gamma$: e infatti un numero enorme di stati microscopici — di fatto un numero che scala esponenzialmente con $N$ — corrisponde a una stessa condizione macroscopica. Attraverso misure macroscopiche non si è in grado di distinguere due sistemi che stanno in stati <i>diversi</i> — quindi in due punti distinti di $\Gamma$ — ma soddisfano le stesse condizioni macroscopiche.</p>
  <p>Sciortino lo mette come secondo <b>Concetto Importante</b>: <i>a uno stato macroscopico si associano un grande numero di stati microscopici</i>. E la conseguenza operativa è che <b>quando si parla di condizioni macroscopiche non ci si riferisce mai a un singolo punto di $\Gamma$, ma a un&rsquo;ampia regione</b>.</p>
  <p>A questo punto insistere sulla traiettoria è due volte assurdo: è incalcolabile, e sarebbe <b>informazione in eccesso</b> rispetto a ciò che si misura. Serve un oggetto che descriva una regione, non un punto.</p>`},
  {t:'reveal', title:'Che cosa fa Gibbs, e cosa costa', tag:'la mossa che fonda la materia', steps:[
   {label:'L’ensemble', body:R`<p>Gibbs propone di descrivere statisticamente un sistema macroscopico determinando la <b>distribuzione di probabilità di tutti i punti dello spazio delle fasi</b>. Un <b>insieme statistico</b> — un <i>ensemble</i> — è una distribuzione di punti in $\Gamma$, di solito continua, descritta da una funzione $\rho(p,q,t)$ definita in modo che
   $$\rho(p,q,t)\,dq_1\dots dq_{3N}\,dp_1\dots dp_{3N}$$
   sia il peso dei punti rappresentativi che al tempo $t$ stanno nel volume infinitesimo centrato in $(q,p)$.</p>
   <p><b>Un&rsquo;avvertenza che Sciortino sottolinea e che è la sorgente di quasi tutti i fraintendimenti</b>: i punti dello spazio delle fasi che compongono un ensemble <i>sono</i> i membri dell&rsquo;ensemble, e sono <b>copie mentali del sistema</b> — non particelle, non sottosistemi, e <b>non interagiscono fra loro</b>. Non c&rsquo;è nessun gas di punti in $\Gamma$: c&rsquo;è un unico sistema fisico, e $\rho$ misura la nostra ignoranza su quale dei punti compatibili sia quello vero.</p>`},
   {label:'La media termodinamica', body:R`<p>Definita $\rho$, la media di un&rsquo;osservabile è
   $$\langle O\rangle=\frac{\displaystyle\int dp^{3N}dq^{3N}\,O(p,q)\,\rho(p,q,t)}{\displaystyle\int dp^{3N}dq^{3N}\,\rho(p,q,t)},$$
   dove il denominatore ha il ruolo di <b>normalizzare</b> la probabilità. Si chiama <b>media termodinamica</b>, e l&rsquo;eventuale dipendenza dal tempo è tutta contenuta in quella di $\rho$.</p>
   <p>Vale la pena non passare sopra al denominatore: portarlo scritto significa non dover chiedere che $\rho$ sia normalizzata, ed è il motivo per cui nei conti degli ensembles si può lavorare con pesi non normalizzati — $e^{-\beta H}$, o la funzione indicatrice di un guscio di energia — e normalizzare solo alla fine. La funzione di partizione sarà precisamente quel denominatore.</p>`},
   {label:'Che cosa si guadagna, e cosa si perde', body:R`<p>Gibbs fa, dice Sciortino, «una grossa operazione concettuale»: <b>elimina il tempo</b>, limitandosi allo studio delle proprietà di equilibrio, ed <b>elimina il bisogno di valutare la traiettoria</b>. Si limita a dire che un sistema può essere descritto in termini probabilistici, associando a ogni microstato una probabilità; e un ensemble è <b>completamente specificato</b> da $\rho(p,q,t)$. All&rsquo;equilibrio, $\rho$ non dipende dal tempo.</p>
   <p><b>Il guadagno</b> è che il problema diventa calcolabile: non si integra nessuna equazione del moto, si fa un integrale su $\Gamma$. Tutto il resto del corso è questo integrale, fatto con tre scelte diverse di $\rho$.</p>
   <p><b>Il costo</b>, e va dichiarato perché è ciò che apre il movimento successivo: la media di Gibbs è una media <i>sull&rsquo;ensemble</i>, cioè su copie mentali; l&rsquo;esperimento misura una media <i>nel tempo</i> su un solo sistema. Che le due coincidano non è dimostrato qui — è l&rsquo;<b>ipotesi ergodica</b>, ed è un&rsquo;ipotesi. Finché non si sa quando vale, tutto il formalismo di Gibbs è una costruzione elegante di cui non si conosce il rapporto con il laboratorio.</p>`}
  ]},
  {t:'plot', title:'Un ensemble che si deforma: perché serve una densità e non un punto',
   intro:R`Il pendolo $H=p^{2}/2-\cos q$: il ritratto di fase ha orbite chiuse (oscillazioni) e orbite aperte (rotazioni), separate dalla separatrice. Ogni traiettoria è una copia mentale del sistema con dati iniziali diversi.`,
   plots:[
    {kind:'phase', fx:'y', fy:'-sin(x)', xr:[-6.5,6.5], yr:[-3,3], n:16, height:360,
     seeds:[[0,0.6],[0,1.2],[0,1.9],[0,1.999],[0,2.4],[0,-2.4],[3.14159,0.35]],
     title:'pendolo: q in ascissa, p in ordinata'}
   ],
   leggi:R`<p><b>Che cosa guardare</b>: le orbite interne sono chiuse — il pendolo oscilla — e quelle esterne sono aperte, cioè il pendolo gira. Fra le due c&rsquo;è la <b>separatrice</b>, l&rsquo;orbita di energia esattamente pari al massimo del potenziale. E il <b>periodo dipende dall&rsquo;energia</b>: le orbite grandi si percorrono più lentamente, e vicino alla separatrice il periodo diverge.</p>
   <p><b>Perché questa figura giustifica Gibbs.</b> Si immagini di conoscere lo stato iniziale solo approssimativamente: un piccolo insieme di punti attorno a un dato iniziale. Poiché il periodo dipende dall&rsquo;energia, i punti dell&rsquo;insieme <b>si distribuiscono lungo le rispettive orbite a velocità diverse</b>, e dopo molti periodi l&rsquo;insieme si è stirato in un filamento avvolto attorno al centro. Seguire la traiettoria <i>di uno</i> di quei punti non dice nulla di utile; seguire la <b>densità</b> dell&rsquo;insieme sì. È la situazione generica — l&rsquo;oscillatore armonico della tappa 01, con il suo periodo indipendente dall&rsquo;energia, è l&rsquo;eccezione.</p>
   <p><b>E si vede il problema ergodico in anticipo.</b> Una traiettoria interna alla separatrice non uscirà mai da lì: lo spazio delle fasi è <b>partizionato</b> dalla separatrice in regioni che la dinamica non mescola. Un sistema così <i>non</i> è ergodico, e nessuna media temporale su un&rsquo;orbita interna potrà mai riprodurre una media d&rsquo;insieme calcolata su tutto $\Gamma$. La condizione «lo spazio delle fasi non deve essere scisso in sottoparti» si legge qui con gli occhi.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`I punti di un ensemble «non interagiscono». Che errore si commetterebbe pensandoli come particelle?`,
    a:R`Si costruirebbe una fisica sbagliata due volte. <b>Primo</b>, si attribuirebbe al sistema una dinamica collettiva che non ha: i punti di $\Gamma$ sono <i>copie mentali</i> dello stesso sistema in stati diversi, e un sistema non urta contro le proprie copie. <b>Secondo</b>, si confonderebbe $\rho$ — che è una densità di <b>probabilità sullo stato del sistema intero</b>, in $6N$ dimensioni — con la densità di particelle nello spazio ordinario, che è in $3$ dimensioni e sta dentro il sistema. Sono oggetti di spazi diversi: la seconda si ottiene dalla prima integrando su tutte le altre variabili, ed è un&rsquo;osservabile fra le tante.`},
   {q:R`Gibbs «elimina il tempo». Che cosa resta da spiegare, dopo?`,
    a:R`Due cose, e sono i due movimenti seguenti. <b>(1) Perché una media d&rsquo;insieme descriva un esperimento</b>, che misura una media temporale su un singolo sistema: è l&rsquo;ipotesi ergodica, e va capito quando vale e per quali osservabili. <b>(2) Come possa esistere l&rsquo;irreversibilità</b>, dato che nel formalismo non c&rsquo;è nessuna direzione del tempo — le equazioni sono invarianti per $t\to-t$, e come si vedrà nella tappa 06 l&rsquo;entropia di Gibbs è addirittura <i>costante</i>. Eliminare il tempo rende il calcolo possibile, ma sposta il problema: non lo risolve.`}
  ]}
]},

/* ---------------- 03 · LIOUVILLE, DERIVATO ---------------- */
{ num:'03', title:'Il teorema di Liouville, derivato dalla conservazione', meta:'niente sorgenti né pozzi · l’equazione di continuità · la cancellazione che chiude il conto',
  blocchi:[
  {t:'prosa', title:'Da dove viene la legge di conservazione', tag:'architettura', html:R`
  <p>Due fatti già stabiliti mettono insieme un vincolo su $\rho$. <b>Le traiettorie in $\Gamma$ non si intersecano</b> (tappa 01), e <b>non esistono punti dove nascono o muoiono traiettorie</b>: una traiettoria non comincia e non finisce, perché le equazioni di Hamilton la prolungano in entrambi i versi. Insieme, questi due fatti dicono che i punti rappresentativi si comportano come un fluido <b>senza sorgenti né pozzi</b>, e quindi che esiste una legge di conservazione che regola $\rho(q,p,t)$.</p>
  <p>È questa la strada per cui il corso arriva a Liouville, e conviene seguirla invece della scorciatoia: la scorciatoia dà il risultato in due righe, ma è la strada lunga a dire <i>di che cosa</i> Liouville sia la conservazione.</p>`},
  {t:'reveal', title:'La derivazione, per intero', tag:'la lavagna da saper riprodurre', steps:[
   {label:'Passo 1 — il bilancio su un volume', body:R`<p>Si consideri un volume $\Omega$ di $\Gamma$, chiuso da una superficie $S$ con normale uscente $\mathbf n$. Poiché non ci sono sorgenti né pozzi, la variazione del contenuto di $\Omega$ dipende <b>solo</b> dai punti che attraversano $S$: nel tempo $dt$, attraverso l&rsquo;elemento $dS$, escono i punti contenuti nel volumetto $\rho\,\mathbf v\cdot\mathbf n\,dt\,dS$. Quindi
   $$\frac{d}{dt}\int_{\Omega}\rho\,dp^{3N}dq^{3N}=-\int_{S}\rho\,\mathbf v\cdot\mathbf n\,dS.$$
   L&rsquo;integrale a sinistra si fa sulle $q$ e sulle $p$, quindi la quantità derivata dipende solo da $t$ e la derivata totale entra come derivata parziale:
   $$\int_{\Omega}\frac{\partial\rho}{\partial t}\,dp^{3N}dq^{3N}=-\int_{S}\rho\,\mathbf v\cdot\mathbf n\,dS.$$</p>`},
   {label:'Passo 2 — il teorema della divergenza', body:R`<p>Per il <b><span class="str" data-str="teorema-della-divergenza">teorema della divergenza</span></b>, $\displaystyle\int_{S}\mathbf X\cdot\mathbf n\,dS=\int_{\Omega}\vec\nabla\cdot\mathbf X\,d\Omega$, e dunque
   $$\int_{\Omega}\frac{\partial\rho}{\partial t}\,dp^{3N}dq^{3N}=-\int_{\Omega}\vec\nabla\cdot(\rho\vec v)\,dp^{3N}dq^{3N}.$$
   Poiché $\Omega$ è arbitrario, gli integrandi coincidono e si ottiene l&rsquo;<b>equazione di continuità</b>
   $$\frac{\partial\rho}{\partial t}=-\vec\nabla\cdot(\rho\vec v),$$
   dove $\vec v$ indica in modo compatto le derivate temporali delle variabili di $\Gamma$, cioè $(\dot q_i,\dot p_i)$. Fin qui non si è usata la <i>forma</i> hamiltoniana: vale per qualunque flusso senza sorgenti, incluso quello con attrito.</p>`},
   {label:'Passo 3 — ora entra Hamilton, e qualcosa si cancella', body:R`<p>Si scriva la divergenza componente per componente:
   $$-\frac{\partial\rho}{\partial t}=\sum_i\left[\frac{\partial(\rho\dot q_i)}{\partial q_i}+\frac{\partial(\rho\dot p_i)}{\partial p_i}\right]=\sum_i\left[\frac{\partial\rho}{\partial q_i}\dot q_i+\frac{\partial\rho}{\partial p_i}\dot p_i+\rho\frac{\partial\dot q_i}{\partial q_i}+\rho\frac{\partial\dot p_i}{\partial p_i}\right].$$
   Nei due ultimi termini si sostituiscono le equazioni di Hamilton, $\dot q_i=\partial H/\partial p_i$ e $\dot p_i=-\partial H/\partial q_i$:
   $$\rho\frac{\partial\dot q_i}{\partial q_i}+\rho\frac{\partial\dot p_i}{\partial p_i}=\rho\frac{\partial^{2}H}{\partial q_i\partial p_i}-\rho\frac{\partial^{2}H}{\partial p_i\partial q_i},$$
   e per il <span class="str" data-str="teorema-di-schwarz">teorema di Schwarz</span> le derivate seconde miste commutano:
   $$\frac{\partial^2H}{\partial q\,\partial p}-\frac{\partial^2H}{\partial p\,\partial q}=0.$$
   <b>I due termini si cancellano</b>, e resta
   $$\frac{\partial\rho}{\partial t}+\sum_i\left[\frac{\partial\rho}{\partial q_i}\dot q_i+\frac{\partial\rho}{\partial p_i}\dot p_i\right]=0,$$
   che è esattamente la <b>derivata totale di $\rho$ lungo il moto</b>:
   $$\boxed{\frac{d\rho}{dt}=0}$$
   Questo è il <b>teorema di Liouville</b>: la distribuzione di probabilità nello spazio delle fasi <b>si propaga come un fluido incomprimibile</b>. $\blacksquare$</p>
   <p><b>Dove è entrata la fisica</b>, e vale la pena isolarlo perché è l&rsquo;unica ipotesi: il segno meno nella seconda equazione di Hamilton. Cambiandolo, i due termini si <i>sommerebbero</i> invece di cancellarsi, e il flusso comprimerebbe i volumi. <b>Tutto Liouville sta in quel segno</b>, che nella meccanica sembrava una convenzione.</p>`}
  ]},
  {t:'prosa', title:'Due vie più rapide, per l’orale', tag:'economia', html:R`
  <p>La derivazione qui sopra è quella del corso e va saputa. Ma esistono due scorciatoie che conviene avere in tasca, perché rispondono alla stessa domanda in trenta secondi.</p>
  <p><b>Prima: la divergenza del campo.</b> Il campo che genera il flusso è $\mathbf v=(\partial_pH,-\partial_qH)$, e la sua divergenza in $\Gamma$ è
  $$\vec\nabla\cdot\mathbf v=\frac{\partial}{\partial q}\!\left(\frac{\partial H}{\partial p}\right)+\frac{\partial}{\partial p}\!\left(-\frac{\partial H}{\partial q}\right)=0$$
  per Schwarz. <b>Il flusso hamiltoniano è incomprimibile</b>, e l&rsquo;equazione di continuità si riduce subito a $d\rho/dt=0$. È la stessa cancellazione di prima, isolata.</p>
  <p><b>Seconda: lo jacobiano.</b> Sia $\Phi_t$ la mappa che porta lo stato iniziale in quello al tempo $t$. Per un tempo infinitesimo $dt$ si ha $q\mapsto q+\dot q\,dt$ e $p\mapsto p+\dot p\,dt$, quindi
  $$\det J=1+\left(\frac{\partial\dot q}{\partial q}+\frac{\partial\dot p}{\partial p}\right)dt+O(dt^{2})=1+(\vec\nabla\cdot\mathbf v)\,dt=1,$$
  e poiché il volume si trasforma con $|\det J|$, <b>il volume è invariato</b>. Componendo infiniti passi infinitesimi, vale per ogni $t$. Sciortino segnala questa via in nota, come dimostrazione alternativa dell&rsquo;uguaglianza $dp^{3N}(0)dq^{3N}(0)=dp^{3N}(t)dq^{3N}(t)$.</p>
  <div class="note">Le tre dimostrazioni non sono tre teoremi: sono lo stesso fatto letto come conservazione di una densità, come proprietà di un campo, e come proprietà di una mappa. <b>Averle tutte tre serve a rispondere in qualunque linguaggio la domanda venga posta</b> — ed è tipico che all&rsquo;orale la si chieda «per il volume» quando si è studiata «per la densità», o viceversa.</div>`}
]},

/* ---------------- 04 · VOLUME CONSERVATO, FORMA DISTRUTTA ---------------- */
{ num:'04', title:'Volume conservato, forma distrutta', meta:'ciò che Liouville NON dice · lo shear della particella libera · le quattro osservazioni sulle traiettorie',
  blocchi:[
  {t:'prosa', title:'L’errore che rende incomprensibile la termodinamica', tag:'attenzione', html:R`
  <div class="note warn"><p>Liouville dice che il <b>volume</b> si conserva, <b>non</b> che la forma si conserva. Una regione può allungarsi in filamenti sottilissimi e attorcigliarsi ovunque mantenendo volume costante — ed è esattamente quello che fa in un sistema caotico. <b>Confondere «volume conservato» con «la nuvola resta compatta» è l&rsquo;errore che rende incomprensibile l&rsquo;irreversibilità</b>, perché fa sembrare impossibile ciò che invece succede sempre.</p></div>
  <p>Conviene vederlo su un sistema in cui il conto si fa a mano, e il più semplice è la particella <b>libera</b>, $H=p^{2}/2m$. Le equazioni di Hamilton danno $\dot q=p/m$ e $\dot p=0$, quindi il flusso è
  $$q\mapsto q+\frac{p}{m}t,\qquad p\mapsto p.$$
  È una trasformazione lineare, e la sua matrice — in unità $m=1$ — è
  $$J=\begin{pmatrix}1&t\\0&1\end{pmatrix},\qquad \det J=1\cdot1-t\cdot0=1.$$
  <b>Area invariata</b>, come impone Liouville. Ma la matrice è uno <b>shear</b>: allunga indefinitamente nella direzione di $q$ mantenendo $p$ fisso.</p>`},
  {t:'plot', title:'Lo shear: stessa area, forma irriconoscibile',
   intro:R`Un disco di condizioni iniziali della particella libera diventa un&rsquo;ellisse inclinata: <b>stessa area</b>, forma irriconoscibile.`,
   plots:[
    {kind:'curve', x:'cos(t)', y:'sin(t)', tr:[0,6.2832], xr:[-3.4,3.4], yr:[-1.6,1.6], height:250, w:430,
     title:'t=0: il disco delle condizioni iniziali'},
    {kind:'curve', x:'cos(t)+2*sin(t)', y:'sin(t)', tr:[0,6.2832], xr:[-3.4,3.4], yr:[-1.6,1.6], height:250, w:430,
     title:'t dopo: stessa area, allungata (shear)'}
   ],
   leggi:R`<p>La trasformazione ha <b>determinante $1$</b>: area invariata, come impone Liouville. Ma la figura si <b>allunga</b> senza limite: le particelle più veloci scappano avanti, le più lente restano indietro. Dopo un tempo lungo il disco è un filamento lunghissimo e sottilissimo, che attraversa tutto lo spazio disponibile.</p>
   <p><b>Qui c&rsquo;è in nuce tutta la questione dell&rsquo;irreversibilità.</b> Se si guarda con precisione infinita, l&rsquo;insieme occupa sempre lo stesso volume e nulla è andato perso: l&rsquo;evoluzione è invertibile, e conoscendo il filamento si ricostruisce il disco. Se si guarda con una <b>risoluzione finita</b> — cioè come guarda qualunque strumento — quel filamento appare <i>sparso ovunque</i>, indistinguibile da una nuvola uniforme. L&rsquo;informazione non è distrutta: è migrata in dettagli più fini di quanto si possa risolvere.</p>
   <p><b>E si noti che qui non c&rsquo;è nessun caos</b>: la particella libera è il sistema più semplice che esista, e lo stiramento è <i>lineare</i> nel tempo. In un sistema caotico lo stiramento è <i>esponenziale</i>, ma il meccanismo concettuale è già tutto in questa figura.</p>`},
  {t:'prosa', title:'Le quattro osservazioni sulle traiettorie', tag:'sintesi del capitolo del docente', html:R`
  <p>Sciortino chiude il discorso su Liouville con quattro osservazioni sulla struttura delle traiettorie. Vale la pena raccoglierle, perché tre sono già state dimostrate e la quarta è quella che apre il problema seguente.</p>
  <ol>
  <li><b>Punti distinti al tempo $0$ generano traiettorie che non si incontreranno mai</b>, né nel futuro né nel passato. Quindi una traiettoria non potrà mai esplorare <i>tutti</i> i punti di $\Gamma$, ma solo quelli generati dalla dinamica a partire da $(q_0,p_0)$. <b>Ciononostante, ogni traiettoria arbitraria deve consentire di calcolare la stessa media temporale</b> — ed è una tensione, non una conseguenza: la prima metà della frase è un teorema, la seconda è ciò che si vuole che sia vero.</li>
  <li><b>Ogni traiettoria, per tempi infiniti, copre uniformemente lo spazio.</b> Questo non è un teorema della meccanica: è la formulazione dell&rsquo;<i>ipotesi</i> ergodica, e va trattata come tale.</li>
  <li><b>Traiettorie infinitesimamente vicine al tempo $0$ si allontanano nel tempo.</b> È ciò che si è visto nella figura del pendolo (periodo dipendente dall&rsquo;energia) e in quella dello shear (velocità diverse): in un sistema caotico la separazione è esponenziale, e la velocità con cui avviene si chiama esponente di Lyapunov.</li>
  <li><b>Una superficie chiusa resta una superficie chiusa.</b> Prendendo tutte le traiettorie che compongono una superficie chiusa al tempo $0$ ed evolvendole, si ha ancora una superficie chiusa: nessun punto interno potrà uscire, nessun punto esterno entrare — perché per uscire dovrebbe attraversare la superficie, cioè incrociare una delle traiettorie che la compongono. E il volume racchiuso è lo stesso, poiché $d\rho/dt=0$.</li>
  </ol>
  <p>La quarta osservazione è quella con più conseguenze, e sono di due tipi opposti. Da un lato <b>garantisce</b> che parlare del «volume degli stati accessibili» abbia senso: quel volume è una proprietà del sistema, non dell&rsquo;istante. Dall&rsquo;altro <b>vieta</b> che una regione si contragga: quindi nessun ensemble può «concentrarsi verso l&rsquo;equilibrio», e la nozione ingenua di rilassamento è già in contraddizione con la meccanica.</p>
  <div class="note">Le note del corso rimandano, a questo punto, al video di dimostrazione della <b>reversibilità idrodinamica</b> del laboratorio didattico della New York University (<i>physics.nyu.edu/pine/hydrodynamic_reversibility.html</i>): una goccia di colorante mescolata in un fluido molto viscoso viene <b>rimescolata all&rsquo;indietro</b> e ricompone la goccia. È la dimostrazione sperimentale che il mescolamento apparente non è distruzione di informazione — vale la pena guardarlo, perché è esattamente la figura dello shear fatta in laboratorio.</div>`}
]},

/* ---------------- 05 · IL VOLUME COME MISURA ---------------- */
{ num:'05', title:'Il volume delle fasi come misura invariante', meta:'perché «contare gli stati» è ben definito · lo jacobiano dell’oscillatore · e il conto che diventa entropia',
  blocchi:[
  {t:'prosa', title:'Che cosa autorizza a contare', tag:'first principles', html:R`
  <p>Tutto il resto del corso consiste nel <b>contare microstati</b>: l&rsquo;entropia sarà il logaritmo di un volume di $\Gamma$, la funzione di partizione un integrale su $\Gamma$. Perché un conto del genere abbia senso serve che il volume sia una <b>proprietà del sistema e non dell&rsquo;istante</b>, e questo è precisamente ciò che Liouville garantisce: il volume $dp^{3N}dq^{3N}$ è una <b>misura invariante</b> sotto il flusso.</p>
  <p>Vale la pena dire cosa succederebbe senza. Se il flusso comprimesse i volumi, l&rsquo;insieme degli stati compatibili con un&rsquo;energia data avrebbe un volume che cambia nel tempo; «il numero di microstati» dipenderebbe da quando lo si conta; l&rsquo;entropia di un sistema isolato all&rsquo;equilibrio non sarebbe una funzione di stato. <b>La misura invariante è la condizione di esistenza della meccanica statistica</b>, non un suo teorema accessorio.</p>`},
  {t:'reveal', title:'Il conto esplicito su un flusso che si sa integrare', tag:'derivazione', steps:[
   {label:'Il flusso dell’oscillatore', body:R`<p>Per $H=\frac12(p^{2}+q^{2})$ (unità con $m=\omega=1$) le equazioni di Hamilton sono $\dot q=p$, $\dot p=-q$, e la soluzione con dati iniziali $(q_0,p_0)$ è una rotazione:
   $$q(t)=q_0\cos t+p_0\sin t,\qquad p(t)=-q_0\sin t+p_0\cos t.$$</p>`},
   {label:'Lo jacobiano, calcolato', body:R`<p>La matrice della trasformazione da $(q_0,p_0)$ a $(q(t),p(t))$ è
   $$J=\begin{pmatrix}\cos t&\sin t\\-\sin t&\cos t\end{pmatrix},$$
   e il suo determinante è
   $$\det J=\cos t\cdot\cos t-\sin t\cdot(-\sin t)=\cos^{2}t+\sin^{2}t=1.$$
   <b>Verificato esplicitamente</b>: il volume delle fasi è invariato a ogni tempo, e non solo al primo ordine in $dt$. Per l&rsquo;oscillatore lo si vede anche senza conti — una rotazione non cambia le aree — ma il punto è che questa è la <i>stessa</i> conservazione dello shear della particella libera, dove la mappa non è una rotazione e le forme vengono distrutte.</p>
   <p><b>Due mappe con lo stesso determinante e destini opposti</b>: la rotazione conserva anche la forma, lo shear no. Liouville non distingue fra le due, e questo è precisamente il suo limite — quello che la tappa 04 ha isolato.</p>`},
   {label:'E il ponte verso il conteggio', body:R`<p>L&rsquo;area racchiusa da un&rsquo;orbita di energia $E$ era $2\pi E/\omega$ (tappa 01). Se si divide quest&rsquo;area per $h$, la costante di Planck, si ottiene un numero <b>adimensionale</b>:
   $$\frac{\mathcal A}{h}=\frac{2\pi E}{\omega h}=\frac{E}{\hbar\omega}.$$
   È il numero di stati quantistici con energia minore di $E$, a meno del mezzo di punto zero — e non è una coincidenza: è il primo apparire del fatto che <b>un volume di $\Gamma$ diviso $h$ conta stati</b>. La giustificazione appartiene alla meccanica quantistica, e qui resta un <b>debito dichiarato</b>; ma l&rsquo;invarianza di quel volume, che è ciò che rende il conto ben definito, è stata dimostrata in questa pagina.</p>`}
  ]}
]},

/* ---------------- 06 · L’EQUAZIONE DI LIOUVILLE ---------------- */
{ num:'06', title:'L’equazione di Liouville e le distribuzioni stazionarie', meta:'parentesi di Poisson · all’equilibrio $\\rho$ commuta con $H$ · e l’entropia di Gibbs che non si muove',
  blocchi:[
  {t:'prosa', title:'La forma compatta, e cosa si legge subito', tag:'grammatica', html:R`
  <p>Il risultato della tappa 03 si scrive sinteticamente con le <b>parentesi di Poisson</b>:
  $$\frac{d\rho}{dt}=\frac{\partial\rho}{\partial t}+\{\rho,H\}=0,\qquad \{A,B\}=\sum_i\left(\frac{\partial A}{\partial q_i}\frac{\partial B}{\partial p_i}-\frac{\partial A}{\partial p_i}\frac{\partial B}{\partial q_i}\right).$$
  Da questa forma si legge immediatamente la condizione di equilibrio. All&rsquo;equilibrio $\partial\rho/\partial t=0$, e quindi
  $$\{\rho,H\}=0:$$
  <b>la distribuzione deve «commutare» con l&rsquo;hamiltoniana.</b></p>
  <p>Che distribuzioni la soddisfano? Tutte quelle che dipendono da $(q,p)$ <b>solo attraverso $H$</b>. Il conto è immediato: se $\rho=f(H)$ allora, per la regola della catena,
  $$\{f(H),H\}=0,$$
  perché entrambi i termini della parentesi contengono $f'(H)$ moltiplicato per la stessa combinazione di derivate di $H$, con segni opposti. <b>Ma non solo</b>, e Sciortino lo dice esplicitamente: $\rho$ può essere funzione di $H$ <i>o, in linea di principio, di altre costanti del moto</i> — il momento totale, il momento angolare totale. È un&rsquo;osservazione che sembra marginale e non lo è: se un sistema ha altre quantità conservate, l&rsquo;equilibrio non è determinato dalla sola energia, e la distribuzione microcanonica «uniforme sulla superficie di energia» è <b>sbagliata</b>. È il caso dei sistemi integrabili, ed è il motivo per cui la termalizzazione in essi fallisce.</p>`},
  {t:'plot', title:'Le superfici su cui $\\rho$ deve essere costante',
   intro:R`Curve di livello di tre hamiltoniane nel piano delle fasi. All’equilibrio la densità può variare da una curva all’altra, ma deve essere costante lungo ciascuna.`,
   plots:[
    {kind:'contour', f:'0.5*(y*y+x*x)', xr:[-2.4,2.4], yr:[-2.4,2.4], levels:[0.3,0.8,1.5,2.4],
     col:'#5eead4', label:'armonico: p^2/2+q^2/2',
     overlays:[{f:'0.5*y*y+0.25*x*x*x*x', levels:[0.3,0.8,1.5,2.4], col:'#d8a13a', label:'quartico: p^2/2+q^4/4'},
               {f:'0.5*y*y-cos(x)', levels:[-0.4,0.4,1.0], col:'#b98cff', label:'pendolo: p^2/2-cos q', dash:true}],
     title:'curve di livello di H (q in ascissa, p in ordinata)'}
   ],
   leggi:R`<p><b>Che cosa guardare</b>: tre famiglie di curve di livello, e il fatto che siano <i>curve chiuse annidate</i>. All&rsquo;equilibrio $\{\rho,H\}=0$ impone che $\rho$ sia <b>costante lungo ciascuna curva</b>: la densità può cambiare passando da un livello all&rsquo;altro, mai muovendosi lungo uno.</p>
   <p><b>Questo è tutto ciò che la dinamica permette di dire, e già determina i due ensembles.</b> Scegliere $\rho$ concentrata su un solo livello dà il <b>microcanonico</b>; scegliere $\rho\propto e^{-\beta H}$, cioè una funzione decrescente del livello, dà il <b>canonico</b>. Non sono postulati arbitrari: sono due modi di riempire l&rsquo;unica libertà che $\{\rho,H\}=0$ lascia. Quale dei due si usi dipende da come il sistema è tenuto — isolato o a contatto con un bagno — e non dalla dinamica.</p>
   <p><b>E si vede il caso che rompe tutto</b>: le curve tratteggiate del pendolo non sono tutte chiuse, e quelle aperte stanno in regioni che la dinamica non collega. Su un sistema così, «costante lungo il livello» non basta a fissare $\rho$: si possono mettere pesi diversi nelle due regioni separate dalla separatrice, e ciascuna scelta è un equilibrio legittimo. La dinamica non decide fra loro, e nessuna evoluzione temporale le mescola.</p>`},
  {t:'prosa', title:'Le tre conseguenze che contano', tag:'sintesi', html:R`
  <ul>
  <li><b>Equilibrio significa «$\rho$ funzione delle sole quantità conservate».</b> Da qui il microcanonico e il canonico nascono come soluzioni stazionarie, non come assiomi. È il primo posto del corso in cui una scelta che sembrava arbitraria diventa forzata.</li>
  <li><b>L&rsquo;entropia di Gibbs non cambia mai.</b> Definita $S=-k\!\int\rho\ln\rho\,dp^{3N}dq^{3N}$, è <b>costante nel tempo</b>: la dimostrazione è che $\rho$ è trasportata rigidamente lungo il flusso ($d\rho/dt=0$) e il volume è invariante, quindi l&rsquo;integrale di qualunque funzione di $\rho$ è invariante. <b>Il secondo principio non può derivare da qui</b>: serve un ingrediente in più, e trovarlo è il problema aperto.</li>
  <li><b>Il ponte quantistico è immediato.</b> $d\rho/dt=0$ diventa
  $$i\hbar\,\partial_t\hat\rho=[\hat H,\hat\rho]$$
  — l&rsquo;equazione di von Neumann — sostituendo la parentesi di Poisson col commutatore. <b>Anche lì l&rsquo;entropia resta costante</b>, per lo stesso motivo: l&rsquo;evoluzione è unitaria, e una trasformazione unitaria non cambia lo spettro di $\hat\rho$. La decoerenza dovrà spiegare come mai si osserva il contrario, ed è esattamente lo stesso problema di questa pagina in veste quantistica.</li>
  </ul>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Perché $\rho\propto e^{-\beta H}$ è stazionaria, e perché $\rho\propto e^{-\beta p_1}$ non lo è?`,
    a:R`Perché la prima dipende da $(q,p)$ solo attraverso $H$, che è una costante del moto: $\{f(H),H\}=0$ per qualunque $f$. La seconda dipende dal momento di <i>una</i> particella, che <b>non</b> è conservato — le collisioni lo cambiano — quindi $\{e^{-\beta p_1},H\}\ne0$ e la distribuzione evolve. <b>La regola operativa</b>: una distribuzione di equilibrio si può scrivere solo in funzione di quantità conservate. E se il sistema ne ha più di una — energia <i>e</i> momento totale, per esempio in un fluido in moto — l&rsquo;equilibrio le contiene tutte, con un moltiplicatore per ciascuna.`},
   {q:R`Se l&rsquo;entropia di Gibbs è costante, in che senso l&rsquo;entropia «aumenta»?`,
    a:R`Non nel senso di quella $S$. L&rsquo;entropia che cresce è una quantità <b>diversa</b>, e la differenza è precisamente il contenuto dei movimenti seguenti: l&rsquo;entropia di Boltzmann $S=k\ln\Omega$, che conta il volume del <i>macrostato</i> in cui il sistema si trova, oppure un&rsquo;entropia di Gibbs calcolata su una $\rho$ <b>grossolanizzata</b> — mediata su celle di risoluzione finita. La prima cresce perché il sistema passa da macrostati piccoli a macrostati enormi; la seconda perché la grossolanizzazione butta via l&rsquo;informazione migrata nei filamenti della figura dello shear. <b>La risposta sbagliata da evitare</b> è «l&rsquo;entropia di Gibbs aumenta»: è dimostrabilmente falso, e dirlo all&rsquo;orale segnala che il teorema di Liouville non è stato capito.`}
  ]}
]},

/* ---------------- 07 · LA RICORRENZA, E IL PARADOSSO ---------------- */
{ num:'07', title:'La ricorrenza di Poincaré, e il paradosso che apre', meta:'da un volume finito e un flusso incomprimibile segue il ritorno · il tempo di ricorrenza · e cosa NON si deve concluderne',
  blocchi:[
  {t:'reveal', title:'Il teorema, con l’argomento di volume', tag:'derivazione', steps:[
   {label:'L’enunciato', body:R`<p>Se il moto è confinato in una regione di $\Gamma$ di volume <b>finito</b> — ed è il caso di un sistema con energia limitata in un recipiente limitato — e il flusso conserva il volume, allora <b>quasi ogni stato ritorna arbitrariamente vicino a se stesso</b>, dopo un tempo abbastanza lungo.</p>`},
   {label:'L’argomento', body:R`<p>Si prenda una piccola regione $A$ attorno allo stato iniziale, di volume $\varepsilon$, e si considerino le sue immagini $A$, $\Phi_\tau(A)$, $\Phi_{2\tau}(A)$, … a intervalli di tempo $\tau$. Per Liouville hanno <b>tutte volume $\varepsilon$</b>. Se nessuna coppia di esse si sovrapponesse mai, la loro unione avrebbe volume $n\varepsilon$ per ogni $n$, cioè volume <b>infinito</b> — impossibile, perché sono tutte contenute nella regione accessibile, che ha volume finito. Dunque esistono due immagini che si sovrappongono, $\Phi_{m\tau}(A)\cap\Phi_{n\tau}(A)\ne\emptyset$ con $m>n$; e applicando $\Phi_{-n\tau}$, che è invertibile, segue $\Phi_{(m-n)\tau}(A)\cap A\ne\emptyset$. <b>Qualche punto di $A$ è tornato in $A$.</b> $\blacksquare$</p>
   <p>Le due ipotesi sono entrambe indispensabili e vale la pena isolarle: <b>volume finito</b> (senza cui le immagini possono andarsene all&rsquo;infinito) e <b>volume conservato</b> (senza cui potrebbero rimpicciolirsi e stare in uno spazio finito senza mai sovrapporsi). La seconda è Liouville.</p>`},
   {label:'Il tempo, e l’ordine di grandezza', body:R`<p>La conseguenza è scomoda: <b>un gas che si è espanso in una stanza tornerà, prima o poi, tutto in un angolo</b>. Ma il tempo di ricorrenza cresce come l&rsquo;inverso della probabilità del macrostato di partenza, cioè come $e^{N}$ — e il conto d&rsquo;ordine di grandezza si fa in una riga: la probabilità che $N$ particelle stiano tutte in metà del recipiente è $2^{-N}$, quindi il tempo di attesa in unità di tempo di collisione è $2^{N}$. Con $N\sim10^{23}$ il fattore $e^{-N}$ vale
   $$e^{-N}\;\sim\;\frac{10^{23}}{e^{10^{23}}},$$
   un numero rispetto al quale l&rsquo;età dell&rsquo;universo in unità di Planck è indistinguibile da zero. <b>La ricorrenza esiste e non si osserverà mai</b>, e le due affermazioni sono compatibili.</p>`}
  ]},
  {t:'prosa', title:'Che cosa non si deve concluderne', tag:'attenzione', html:R`
  <p>Sulla ricorrenza si fanno tre errori tipici, e ciascuno inverte una parte del ragionamento.</p>
  <ol>
  <li><b>«La ricorrenza contraddice il secondo principio.»</b> No: mostra che il secondo principio non può essere una legge <i>assoluta</i> della meccanica, che è un&rsquo;affermazione diversa e più debole. Il secondo principio resta vero come enunciato sul comportamento tipico dei grandi numeri — è precisamente ciò che Sciortino scrive nel capitolo di termodinamica, che la seconda legge è corretta «in media» e le deviazioni sono così rare da non verificarsi mai.</li>
  <li><b>«Allora il sistema oscilla avanti e indietro fra ordine e disordine.»</b> No, non in alcun senso osservabile: fra due ricorrenze passano tempi $e^{N}$, e nel frattempo il sistema sta in stati indistinguibili dall&rsquo;equilibrio. La storia del sistema non è un&rsquo;oscillazione: è equilibrio, interrotto da eventi di misura nulla su qualunque scala temporale fisica.</li>
  <li><b>«La ricorrenza dice che il sistema ripercorre esattamente i suoi passi.»</b> No: dice che torna <i>arbitrariamente vicino</i>, non che torna nello stesso punto. La differenza conta, perché un ritorno approssimato non ricostituisce la correlazione fra le particelle: il gas si ritrova nell&rsquo;angolo con velocità diverse da quelle che aveva.</li>
  </ol>
  <p><b>Il modo giusto di tenere il risultato</b> è come vincolo su che tipo di spiegazione dell&rsquo;irreversibilità sia ammissibile. Qualunque spiegazione che renda l&rsquo;irreversibilità <i>assoluta</i> — impossibile tornare indietro — contraddice la meccanica. L&rsquo;unica spiegazione ammissibile la rende <b>estremamente improbabile</b>, e deve produrre il fattore $e^{-N}$.</p>`},
  {t:'prosa', title:'Il bilancio, e la domanda che resta aperta', tag:'sintesi', html:R`
  <p><b>Che cosa si è stabilito.</b> Lo spazio delle fasi trasforma la dinamica nella geometria di un flusso incomprimibile. Da lì: le traiettorie non si incrociano e non si autointersecano; il volume è una misura invariante, e quindi «contare gli stati» è ben definito; la densità di Gibbs sostituisce la traiettoria e rende il problema calcolabile; all&rsquo;equilibrio $\rho$ deve essere funzione delle quantità conservate, e da questo nascono gli ensembles; l&rsquo;entropia di Gibbs è costante; e un sistema confinato ritorna.</p>
  <p><b>Che cosa non si è stabilito, e sono due cose distinte.</b> Primo: che la media d&rsquo;insieme di Gibbs descriva ciò che un esperimento misura, cioè una media temporale su un singolo sistema. Secondo: come possa emergere l&rsquo;irreversibilità da un flusso che non perde niente e che torna indietro. <b>Le due mancanze non sono la stessa</b>, e conviene non confonderle: la prima è un problema di <i>legittimità del formalismo</i>, la seconda di <i>spiegazione di un fenomeno</i>. La prima si affronta con i teoremi di Birkhoff e di Khinchin; la seconda con la grossolanizzazione e il conteggio dei macrostati.</p>`},
  {t:'prolessi', title:'Dove riappare, nella fisica che verrà',
   oggetto:R`<b>Lo spazio delle fasi con la sua misura invariante</b>: il volume $dp^{3N}dq^{3N}$ che il flusso hamiltoniano non comprime, e la densità di Gibbs che vi si appoggia.`,
   rotte:[
    {dove:'Meccanica<br>statistica', txt:R`La misura di Liouville è ciò che rende <b>ben definito</b> contare gli stati: il volume di $\Gamma$ diviso $h^{3N}$ è il numero di microstati, e da lì l&rsquo;entropia di Boltzmann $S=k\ln\Omega$. Senza l&rsquo;invarianza, il conteggio dipenderebbe dall&rsquo;istante in cui si conta, e l&rsquo;entropia non sarebbe una funzione di stato.`},
    {dove:'Meccanica<br>quantistica', txt:R`L&rsquo;equazione di Liouville diventa quella di von Neumann per la <b>matrice densità</b>, col commutatore al posto della parentesi di Poisson. Lo spazio delle fasi diventa lo spazio di Hilbert, e l&rsquo;invarianza del volume diventa l&rsquo;unitarietà dell&rsquo;evoluzione — con la stessa conseguenza scomoda: l&rsquo;entropia di von Neumann di un sistema chiuso non cresce.`},
    {dove:'Caos e<br>sistemi dinamici', txt:R`L&rsquo;incomprimibilità è ciò che costringe un sistema caotico a <b>stirare e ripiegare</b>: non potendo comprimere, per mescolare deve allungare in una direzione e assottigliare nell&rsquo;altra. Gli esponenti di Lyapunov misurano quella velocità, e la loro somma è nulla proprio per Liouville.`},
    {dove:'Simulazione<br>numerica', txt:R`Gli integratori <b>simplettici</b> (Verlet, leapfrog) sono costruiti per conservare esattamente il volume delle fasi: per questo restano stabili su miliardi di passi dove un Runge-Kutta accumula deriva sull&rsquo;energia. <b>Il teorema di questa pagina detta il progetto del codice</b>, e il motivo è che un integratore che comprime i volumi simula un sistema con attrito che non c&rsquo;è.`}
   ],
   domanda:R`Liouville dice che l&rsquo;informazione sullo stato iniziale <b>non si perde mai</b>: il volume che la contiene resta identico per sempre, il flusso è invertibile, e la ricorrenza garantisce persino il ritorno. Eppure ogni sistema macroscopico che si osservi dimentica il proprio passato.<br><br><b>La domanda da tenere aperta</b>: se nulla si perde, che cosa esattamente cambia quando un sistema «raggiunge l&rsquo;equilibrio»? Le due risposte candidate sono di natura diversa, e distinguerle è il mestiere. La prima: che la traiettoria <b>visiti</b> tutto lo spazio accessibile, rendendo la media temporale uguale a quella d&rsquo;insieme — è ergodicità, e riguarda la <i>legittimità</i> del calcolo. La seconda: che l&rsquo;informazione <b>migri</b> in dettagli sempre più fini che nessun osservatore risolve, come nel filamento della figura dello shear — è grossolanizzazione, e riguarda la <i>comparsa</i> dell&rsquo;irreversibilità.<br><br>Non sono la stessa cosa, e non si implicano: un sistema può essere ergodico e non mescolante (l&rsquo;oscillatore armonico con frequenze incommensurabili lo è), e la grossolanizzazione produce irreversibilità anche in un sistema banale come la particella libera. Tenerle separate è ciò che permette di rispondere all&rsquo;orale senza confondere due problemi che il formalismo lascia entrambi aperti.`}
]}

];

function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}

function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionSvelabile(title, tag, html, sol){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var c=document.createElement('div'); c.className='collaudo-item';
  var q=document.createElement('div'); q.className='cq'; q.innerHTML=html||'';
  c.appendChild(q); typeset(q);
  if(sol){
    var a=document.createElement('div'); a.className='ca'; a.style.display='none';
    a.innerHTML='<b>Soluzione.</b> '+sol;
    var btn=document.createElement('button'); btn.className='reveal-btn small';
    btn.textContent='Rivela la soluzione';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a);
      btn.disabled=true; btn.classList.add('done'); btn.textContent='Soluzione rivelata'; };
    c.appendChild(btn); c.appendChild(a);
  }
  wrap.appendChild(c); return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    /* DUE SCHEMI, NON UNO — scoperto il 2026-10-06 provando le pagine vive. I movimenti
       scritti per primi (em-01..03, me-10b, i collaudi di gd-01..09 e di quattro em)
       usano una forma piu' semplice: `reveal` e `prolessi` con un solo `html`,
       `esercizio` e `collaudo` con `html` + `sol`. Il renderer ne conosceva una sola e
       chiamava `steps.forEach` su `undefined`: TypeError, e la tappa si fermava li' —
       62 blocchi in 17 movimenti su 74. Non si riscrive il contenuto per far contento
       il renderer: e' il renderer che deve leggere cio' che c'e'.
       E in fondo un ramo che NON muore: uno schema nuovo di domani deve far vedere un
       avviso in quella sezione, non spegnere la pagina sotto di se'. */
    try{
      if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
      else if(b.t==='prolessi') m.appendChild(b.rotte ? sectionProlessi(b)
                                   : sectionProsa(b.title,'prolessi',b.html));
      else if(b.t==='reveal')m.appendChild(b.steps ? sectionReveal(b.title,b.tag,b.steps)
                                   : sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='esercizio') m.appendChild(b.steps ? sectionEsercizio(b)
                                   : sectionSvelabile(b.title,'esercizio',b.html,b.sol));
      else if(b.t==='collaudo')  m.appendChild(b.items ? sectionCollaudo(b.title,b.items)
                                   : sectionSvelabile(b.title,'provi, poi riveli',b.html,b.sol));
      else if(b.t==='plot')      m.appendChild(sectionPlot(b));
      else m.appendChild(sectionProsa(b.title||'(blocco)', 'tipo sconosciuto: '+b.t,
                                      b.html||''));
    }catch(err){
      var avv=document.createElement('section'); avv.className='section';
      avv.innerHTML='<h3>'+(b.title||'(blocco)')+'<span class="tag">non reso</span></h3>'
        +'<p style="color:#ff6b6b">Questo blocco non si &egrave; potuto rendere ('
        +b.t+': '+err.message+'). Il resto della tappa continua sotto.</p>';
      m.appendChild(avv);
    }
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* I POP-UP DEGLI STRUMENTI. `cablaStrumenti` esisteva dal 18-09 e non la chiamava
     nessuno: i 229 rimandi del percorso erano <span> senza handler, e il clic non
     faceva niente. Nessun controllo poteva vederlo — la sintassi era valida, le schede
     c'erano tutte, le formule rendevano: il guasto esisteva solo a pagina viva. Qui, e
     dopo ogni inserimento successivo, perche' la tappa si rimonta da capo a ogni
     cambio e gli handler vanno riattaccati al DOM nuovo. */
  cablaStrumenti(m);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}

/* deep-link: 20-spazio-fasi.html#03 apre direttamente la tappa 03 */
window.addEventListener('DOMContentLoaded', function(){
  var h=(location.hash||'').replace('#','');
  showTappa(byId[h]?h:'00');
});
window.addEventListener('hashchange', function(){
  var h=(location.hash||'').replace('#','');
  if(byId[h]) showTappa(h);
});
