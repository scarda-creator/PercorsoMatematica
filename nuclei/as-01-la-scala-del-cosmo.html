   leggi:R`<p><b>Prima avvertenza, e va letta prima della figura: la distanza è compressa.</b> Nel disegno la stella sta a sei volte e mezza il raggio dell&rsquo;orbita; nella realtà, per una parallasse di un secondo d&rsquo;arco, starebbe a <i>duecentomila</i> volte. Un disegno in scala sarebbe un segmento senza triangolo, e per questo ogni libro lo deforma. <b>La deformazione cambia una cosa sola, l&rsquo;angolo $p$</b>, che qui si vede largo e nella realtà è invisibile: tutto il resto della figura è corretto.</p>
   <p><b>Che cosa guardare a sinistra.</b> La freccia arancione è l&rsquo;unica lunghezza nota del problema; l&rsquo;arco tratteggiato attorno alla stella è dove si legge l&rsquo;angolo fra le due linee di vista. Si vede che da giugno a dicembre la stella viene vista in due direzioni diverse, e che <b>la differenza fra le due direzioni è $2p$, non $p$</b> — la parallasse è l&rsquo;angolo fra una delle due e l&rsquo;asse Sole-stella. È il fattore due del paragrafo precedente, in forma di disegno.</p>
   <p><b>Che cosa guardare a destra, ed è il punto didattico.</b> La curva verde è la parallasse pura: un&rsquo;oscillazione di periodo un anno e ampiezza $p$, che non cresce. La retta grigia è il moto proprio: cresce indefinitamente e non dice niente sulla distanza. La curva arancione è <b>l&rsquo;unica cosa che un telescopio registra</b>: la somma. Si vede perché servono almeno due o tre anni di osservazione — da una sola stagione le due componenti non si distinguono, e quello che si attribuirebbe alla parallasse sarebbe in parte moto proprio. <b>Una misura di parallasse è, operativamente, un fit di una sinusoide più una retta</b>, e la distanza sta nell&rsquo;ampiezza della sinusoide.</p>`},
  {t:'prosa', title:'Il secondo d’arco, e da dove viene il 4,848·10⁻⁶', tag:'il fattore che non si impara a memoria', html:R`
  <p>Tutto il resto è aritmetica delle unità angolari, ed è la parte che si dimentica — quindi vale la pena ricostruirla invece di impararla. Un grado è $\pi/180$ radianti. Un secondo d&rsquo;arco è un sessantesimo di un sessantesimo di grado, cioè un $3600$-esimo di grado. Quindi
  $$1''=\frac{1}{3600}\cdot\frac{\pi}{180}=\frac{\pi}{648\,000}=4{,}848\cdot10^{-6}\ \mathrm{rad}.$$
  Il numero $648\,000=3600\cdot180$ è l&rsquo;unica cosa da ricordare di questa riga, e non va nemmeno ricordato: è $180$ gradi per $3600$ secondi d&rsquo;arco per grado. de Bernardis riporta esattamente $4{,}85\cdot10^{-6}$ radianti.</p>
  <p>Un secondo d&rsquo;arco è <b>un angolo molto piccolo per l&rsquo;esperienza quotidiana e molto grande per l&rsquo;astrometria</b>, e la slide del corso ne dà l&rsquo;immagine giusta: è l&rsquo;angolo sotto cui si vede <i>«una moneta da 1 € a 5,6 km di distanza»</i>. Il conto si controlla: una moneta da un euro ha diametro $23{,}25$ mm, e
  $$\frac{0{,}02325}{4{,}848\cdot10^{-6}\cdot1000}=4{,}80\ \mathrm{km}.$$
  Vengono dunque <b>4,8 km e non 5,6</b>: la diapositiva 121 dice 5,6 km, la diapositiva 5 della prima lezione dice 6 km, e il valore esatto dipende dalla moneta che si immagina. <i>L&rsquo;immagine va presa per quello che è</i> — un ordine di grandezza, «una monetina a qualche chilometro» — e non come un dato. Che le due diapositive del docente non concordino fra loro è il modo più rapido di capire che quella riga è un&rsquo;illustrazione e non una misura.</p>`},
  {t:'prosa', title:'La definizione del parsec, e il conto che la chiude', tag:'il risultato', html:R`
  <p>Adesso la definizione si può dare nella sua forma esatta, che è quella di Masani: il parsec è <i>«la distanza da cui il semidiametro dell&rsquo;orbita della Terra intorno al Sole è visto sotto l&rsquo;angolo di un secondo d&rsquo;arco»</i>. Cioè si prende la relazione $p=R/d$, si <b>impone</b> $p=1''$ e si chiama parsec la $d$ che ne esce:
  $$1\ \mathrm{pc}=\frac{R}{1''}=\frac{1{,}496\cdot10^{11}}{4{,}848\cdot10^{-6}}=3{,}086\cdot10^{16}\ \mathrm{m}.$$
  È il numero stampato in calce a ogni prova scritta del corso — <i>«1 parsec = 3.086 x 10<sup>16</sup> m»</i> — e in CGS, come lo scrive Masani, $3{,}087\cdot10^{18}$ cm.</p>
  <p>La stessa definizione, letta in unità astronomiche, dà un numero che vale la pena avere in testa perché rende concreta la compressione della figura:
  $$1\ \mathrm{pc}=\frac{648\,000}{\pi}\ \mathrm{UA}=206\,265\ \mathrm{UA}.$$
  <b>Un parsec è duecentomila volte il raggio dell&rsquo;orbita terrestre.</b> Masani riporta $2{,}06\cdot10^{5}$ UA, ed è lo stesso numero. Nel disegno della figura la stella sta a sei volte e mezza quel raggio: ecco di quanto si è barato, ed ecco perché la parallasse si misura in secondi d&rsquo;arco e non in gradi.</p>
  <p><b>Il parsec non è dunque un&rsquo;unità «più astronomica» dell&rsquo;anno luce: è un&rsquo;unità tagliata sullo strumento.</b> L&rsquo;anno luce è definito a partire da un fenomeno (la luce che viaggia per un anno); il parsec è definito a partire da una misura (l&rsquo;angolo che si legge al telescopio). È per questo che gli astronomi lo preferiscono, nonostante sia il più artificiale dei due — e il motivo si vede nel paragrafo seguente.</p>`},
  {t:'prosa', title:'Perché d(pc) = 1/p(arcsec) è una conseguenza, non una convenzione', tag:'il guadagno della definizione', html:R`
  <p>La relazione che si usa ogni volta è <i>«la distanza di una stella in parsec è semplicemente l&rsquo;inverso della sua parallasse misurata in secondi d&rsquo;arco»</i>, cioè $d[\mathrm{pc}]=1/p['']$. Masani la scrive identica. Sembra una convenzione fortunata, e invece <b>è una conseguenza algebrica immediata</b> — e vale la pena vederla, perché chi la vede non la inverte mai nel verso sbagliato.</p>
  <p>Si parte da $p=R/d$ e si misurano entrambe le quantità nelle unità appena costruite. L&rsquo;angolo in secondi d&rsquo;arco è $p['']=p[\mathrm{rad}]/(1'')$; la distanza in parsec è $d[\mathrm{pc}]=d/(R/1'')$, perché il parsec <i>è</i> $R/1''$. Allora
  $$p['']=\frac{R/d}{1''}=\frac{R/1''}{d}=\frac{1\ \mathrm{pc}}{d}=\frac{1}{d[\mathrm{pc}]}.$$
  <b>Il fattore $R$ si cancella</b>, e con esso il raggio dell&rsquo;orbita terrestre: si cancella perché il parsec è stato <i>costruito</i> con quel raggio dentro. Questo è l&rsquo;intero vantaggio dell&rsquo;unità: la conversione dal dato alla distanza non contiene più nessuna costante fisica, e un errore di aritmetica non ha dove annidarsi.</p>
  <p><b>Due esempi, con i numeri del catalogo Hipparcos</b> che de Bernardis riporta nella lezione. Proxima Centauri ha parallasse annua $772{,}33$ millisecondi d&rsquo;arco, cioè $0{,}7687''$:
  $$d=\frac{1}{0{,}7687}=1{,}301\ \mathrm{pc}.$$
  La stella di Barnard ha parallasse $549{,}01$ mas, cioè $0{,}54901''$:
  $$d=\frac{1}{0{,}54901}=1{,}821\ \mathrm{pc}.$$
  Si noti il controllo di coerenza che costa zero: <b>una parallasse inferiore al secondo d&rsquo;arco deve dare una distanza superiore al parsec</b>, sempre. Se il conto dà il contrario, la frazione è stata invertita — e poiché nessuna stella del cielo ha parallasse maggiore di un secondo d&rsquo;arco, <i>nessuna stella sta a meno di un parsec</i>.</p>
  <p><b>E il giro completo, per fidarsi del fattore.</b> Si riprende la distanza di Proxima in parsec, si riporta in metri moltiplicando per $3{,}0857\cdot10^{16}$, e si ricalcola l&rsquo;angolo a partire dalla geometria nuda $p=R/d$ riconvertendolo in secondi d&rsquo;arco:
  $$p=\frac{1{,}496\cdot10^{11}}{1{,}301\cdot3{,}0857\cdot10^{16}}\cdot\frac{648\,000}{\pi}=0{,}7686.$$
  Torna la parallasse di partenza, $0{,}7687''$, a meno dell&rsquo;arrotondamento sulle quattro cifre di $1{,}301$. <b>Il giro di andata e ritorno è il modo di collaudare una conversione</b> senza fidarsi di chi l&rsquo;ha scritta — compreso sé stessi — e in un esame orale è anche il modo di accorgersi di aver invertito un fattore mentre si parla.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Una stella ha parallasse $p=0{,}02''$. A che distanza sta, in parsec e in metri?`,
    a:R`$d=1/0{,}02=50$ pc, cioè $50\cdot3{,}086\cdot10^{16}=1{,}54\cdot10^{18}$ m. <b>Il controllo dell&rsquo;ordine di grandezza</b>: cinquanta parsec sono circa centosessanta anni luce, cioè una distanza <i>interna</i> alla Galassia e anzi al vicinato solare — coerente con il fatto che $0{,}02''$ è un angolo appena dieci volte più grande della precisione di Hipparcos ($2$ mas). Non per caso: de Bernardis dice che proprio con quella precisione si misurano <i>«con precisione del 10% distanze di stelle fino a circa 50 pc»</i>, e il conto è questo stesso al rovescio — un errore di $2$ mas su una parallasse di $20$ mas è il dieci per cento.`},
   {q:R`Perché non si può misurare per parallasse la distanza di una galassia a 1 Mpc?`,
    a:R`Perché la parallasse sarebbe $p=1/10^{6}=10^{-6}$ secondi d&rsquo;arco, cioè <b>un microsecondo d&rsquo;arco</b>, mille volte più piccola della precisione di Hipparcos e circa cento volte più piccola di quella di Gaia. L&rsquo;inverso nella formula è crudele: la parallasse decade come $1/d$, quindi ogni fattore dieci di distanza chiede un fattore dieci di precisione angolare. <b>È questa la ragione strutturale per cui esiste una «scala di distanze»</b> a gradini — metodi geometrici per il vicinato, indicatori di luminosità per il resto — e non un metodo unico: de Bernardis la introduce esattamente così, <i>«non possiamo misurare le distanze cosmiche con un righello, e quindi abbiamo bisogno di altre definizioni operative di distanza»</i>.`}
  ]}
]},

/* ---------------- 03 · L'ANGOLO SOTTESO ---------------- */
{ num:'03', title:'L’angolo sotteso, e quanto costa l’approssimazione di angolo piccolo', meta:'l’unica grandezza che si misura · i tre usi della stessa relazione · l’errore dello sviluppo, calcolato · dall’angolo all’angolo solido',
  blocchi:[
  {t:'prosa', title:'L’unica grandezza che un telescopio misura è un angolo', tag:'first principles', html:R`
  <p>Vale la pena fermarsi su un fatto che sembra banale e governa tutto il corso: <b>un telescopio non misura distanze, non misura dimensioni e non misura masse. Misura angoli e conta fotoni.</b> Tutto il resto è ricostruito, e la ricostruzione passa quasi sempre per una sola relazione — la stessa della tappa precedente, letta in avanti invece che al rovescio. Un oggetto di dimensione trasversa $l$ posto a distanza $d\gg l$ sottende l&rsquo;angolo
  $$\theta\simeq\frac{l}{d},$$
  e questa relazione, con <b>l&rsquo;approssimazione di angolo piccolo</b> dentro, è il ponte fra ciò che si vede e ciò che c&rsquo;è.</p>
  <p>Masani la usa nella prima riga utile del suo capitolo sul Sole, e la frase è istruttiva proprio perché la dà per ovvia: <i>«misurando l&rsquo;angolo sotto cui è visto il suo diametro col noto valore della distanza, si ha subito il valore del raggio $R$ in cm»</i>, e ne esce $R_\odot=6{,}96\cdot10^{10}$ cm, cioè $6{,}96\cdot10^{8}$ m — il valore che il foglio dati delle prove scritte stampa come $695\,700$ km. Si noti l&rsquo;ordine logico: prima si conosce la <i>distanza</i> (dalla meccanica celeste, con la terza legge di Keplero), poi si misura l&rsquo;<i>angolo</i>, e solo allora si ottiene il <i>raggio</i>. <b>Il raggio del Sole è una quantità dedotta, non misurata</b>, e lo stesso vale per il raggio di qualunque altra stella del cielo.</p>
  <p>La relazione si usa in <b>tre direzioni diverse</b>, e riconoscere quale delle tre chiede un esercizio è metà del lavoro:</p>
  <ul>
  <li><b>angolo + distanza $\to$ dimensione.</b> È il caso di Masani appena visto, ed è il caso normale per gli oggetti del sistema solare, dove la distanza è nota dalla dinamica.</li>
  <li><b>dimensione + angolo $\to$ distanza.</b> È il <i>regolo campione</i>: se si sa quanto è grande un oggetto per altra via — un anello di supernova, una galassia tipica, la scala acustica nel fondo cosmico — misurarne l&rsquo;angolo dà la distanza. Tutta la cosmologia osservativa vive su questo.</li>
  <li><b>dimensione + distanza $\to$ angolo.</b> Serve a decidere <i>prima di osservare</i> se un oggetto sarà risolto o puntiforme per un dato strumento, e quindi che strumento serve. È un conto di progetto, e compare nelle prove d&rsquo;esame nella forma «le dimensioni angolari siano inferiori alla risoluzione del telescopio».</li>
  </ul>`},
  {t:'prosa', title:'Il Sole e la Luna, e una coincidenza che non è una coincidenza di fisica', tag:'due conti svolti', html:R`
  <p>Il diametro del Sole è $1{,}392\cdot10^{9}$ m e la sua distanza $1{,}496\cdot10^{11}$ m. Quindi
  $$\theta_\odot=\frac{1{,}392\cdot10^{9}}{1{,}496\cdot10^{11}}=9{,}30\cdot10^{-3}\ \mathrm{rad},$$
  che in gradi fa
  $$\theta_\odot=\frac{1{,}392\cdot10^{9}}{1{,}496\cdot10^{11}}\cdot\frac{180}{\pi}=0{,}533\ \text{gradi}.$$
  <b>Mezzo grado.</b> È il più grande oggetto del cielo insieme alla Luna, e già mezzo grado è un angolo piccolissimo: un dito teso a un braccio di distanza lo copre comodamente.</p>
  <p>La Luna ha diametro $3{,}476\cdot10^{6}$ m e dista $3{,}844\cdot10^{8}$ m:
  $$\theta_{\mathrm{Luna}}=\frac{3{,}476\cdot10^{6}}{3{,}844\cdot10^{8}}\cdot\frac{180}{\pi}=0{,}518\ \text{gradi}.$$
  I due angoli coincidono entro il tre per cento, ed è il motivo per cui esistono le eclissi totali di Sole — e per cui esistono anche quelle anulari, dato che l&rsquo;orbita lunare è ellittica e l&rsquo;angolo varia di qualche punto percento lungo l&rsquo;anno. <b>Non c&rsquo;è nessuna legge fisica dietro questa coincidenza</b>: è un accidente della nostra epoca, perché la Luna si allontana di qualche centimetro all&rsquo;anno e fra qualche centinaio di milioni di anni le eclissi totali non esisteranno più. Vale la pena dirlo perché è il prototipo di un errore di ragionamento frequente: <i>una coincidenza numerica non è un indizio di legge finché non si mostra il meccanismo</i>.</p>`},
  {t:'prosa', title:'Quanto costa l’approssimazione, calcolato invece che promesso', tag:'il regime di validità', html:R`
  <p>«Per angoli piccoli $\tan\theta\simeq\sin\theta\simeq\theta$» è una frase che si ripete senza mai metterci un numero, e metterci un numero è il modo di non doverla più temere. Dallo sviluppo di Taylor
  $$\sin\theta=\theta-\frac{\theta^{3}}{6}+\frac{\theta^{5}}{120}-\dots$$
  segue che $\theta$ <b>sovrastima</b> $\sin\theta$ di una frazione relativa
  $$\frac{\theta-\sin\theta}{\sin\theta}\simeq\frac{\theta^{2}}{6}.$$
  L&rsquo;errore è <b>quadratico</b>, e questa è l&rsquo;unica cosa importante: dimezzare l&rsquo;angolo divide l&rsquo;errore per quattro. Per la tangente il segno è opposto e il coefficiente doppio, $(\tan\theta-\theta)/\theta\simeq\theta^{2}/3$.</p>
  <p>Mettiamo il numero. Per il disco solare, che è l&rsquo;oggetto più grande del cielo:
  $$\frac{\theta_\odot^{2}}{6}=\frac{(9{,}30\cdot10^{-3})^{2}}{6}=1{,}44\cdot10^{-5},$$
  cioè <b>una parte su settantamila</b>. Nessuna misura astronomica ha quella precisione sul diametro di un disco: l&rsquo;approssimazione, per il più grande angolo del cielo, è già molto più accurata del dato. Per una parallasse stellare, che è dieci milioni di volte più piccola, l&rsquo;errore relativo scende a $10^{-11}$ e il discorso si chiude.</p>
  <p><b>La conclusione operativa, e vale per tutto il corso.</b> In astrofisica l&rsquo;approssimazione di angolo piccolo non va giustificata ogni volta e non va nemmeno sorvegliata: è esatta a tutti gli effetti pratici, perché <i>tutti</i> gli oggetti extrasolari sottendono angoli sotto il minuto d&rsquo;arco. L&rsquo;unico posto in cui vale la pena ricordarsi che è un&rsquo;approssimazione è dove gli angoli sono di ordine uno — e quei posti nel corso sono due, entrambi lontani da qui: le coordinate sulla sfera celeste quando si integra su tutto il cielo, e la deflessione gravitazionale forte vicino a un oggetto compatto.</p>`},
  {t:'plot', title:'L’errore relativo dell’approssimazione, e dove vive l’astrofisica',
   intro:'In ascissa l’angolo in radianti, in ordinata l’errore relativo che si commette scrivendo $\\theta$ al posto di $\\sin\\theta$ (curva verde) e al posto di $\\tan\\theta$ (curva viola). Le due parabole $\\theta^2/6$ e $\\theta^2/3$ sono tratteggiate: sono l’approssimazione dell’approssimazione.',
   plots:[
    {kind:'func2d', xr:[0,1.2], yr:[-0.03,0.42], height:330, equal:false,
     curves:[{f:'x/sin(x)-1', col:'#5eead4', label:'errore su sin'},
             {f:'x*x/6', col:'#5eead4', label:'parabola x^2/6', dash:true},
             {f:'1-x/tan(x)', col:'#b98cff', label:'errore su tan'},
             {f:'x*x/3', col:'#b98cff', label:'parabola x^2/3', dash:true}],
     title:'errore relativo contro angolo in radianti',
     marks:[{x:0.00930, y:0, label:'disco solare: 1,4 su 100 000', col:'#d8a13a', up:true},
            {x:0.5236, y:0.0472, label:'30 gradi: 4,7%', col:'#ffffff', left:true, up:true},
            {x:1.0472, y:0.2092, label:'60 gradi: 21%', col:'#ff9b6b', left:true}]}
   ],
   leggi:R`<p><b>Che cosa guardare: le due parabole stanno incollate alle curve vere</b> fino a mezzo radiante, e si staccano solo oltre. Vuol dire che $\theta^{2}/6$ e $\theta^{2}/3$ non sono stime grossolane dell&rsquo;errore: sono <i>l&rsquo;errore</i>, con una precisione a sua volta buona. Quando serve sapere quanto si sta sbagliando, il termine successivo dello sviluppo basta sempre.</p>
   <p><b>Che cosa impararne, ed è il motivo per cui la figura è qui.</b> Il punto arancione è il disco solare, e sta <i>sull&rsquo;asse</i>: a quella scala di ascisse l&rsquo;errore è indistinguibile da zero, e tutti gli altri oggetti del cielo stanno ancora più a sinistra, schiacciati sull&rsquo;origine. <b>L&rsquo;astrofisica vive interamente nel primo centesimo di questo grafico</b>, dove la curva non si è ancora staccata dalla retta nulla. La regione in cui l&rsquo;approssimazione comincia a costare — trenta gradi, cinque per cento — non è il regime di nessun oggetto osservato: è il regime della geometria di tutti i giorni, e il contrasto è esattamente il contenuto della figura.</p>
   <p><b>L&rsquo;errore d&rsquo;esame che smaschera.</b> Davanti a una richiesta del tipo «si discuta la validità dell&rsquo;approssimazione di angolo piccolo» la risposta non è «l&rsquo;angolo è piccolo»: è <i>un numero</i>, $\theta^{2}/6$, confrontato con l&rsquo;incertezza del dato. Se $\theta^2/6$ è sotto l&rsquo;errore di misura, l&rsquo;approssimazione è gratis; se è sopra, non lo è. È un criterio, non un&rsquo;impressione, e vale anche quando l&rsquo;angolo <i>non</i> è piccolo.</p>`},
  {t:'prosa', title:'Dall’angolo all’angolo solido, perché i flussi si misurano così', tag:'il pezzo che serve dopo', html:R`
  <p>Un&rsquo;ultima conversione angolare, e non è un dettaglio: quasi tutte le grandezze osservative dell&rsquo;astrofisica — intensità, brillanza, emissività — si misurano <i>per unità di angolo solido</i>, quindi la trasformazione da angolo piano a angolo solido serve subito. Per una sorgente circolare di raggio angolare $\theta$, l&rsquo;angolo solido è esattamente la calotta sferica
  $$\Omega=2\pi\,(1-\cos\theta),$$
  e per angoli piccoli, sviluppando $\cos\theta\simeq1-\theta^{2}/2$,
  $$\Omega\simeq\pi\theta^{2}.$$
  <b>È il risultato che uno si aspetta e vale la pena notare perché</b>: $\pi\theta^{2}$ è l&rsquo;area di un cerchio di raggio $\theta$, cioè per angoli piccoli la sfera è localmente un piano e l&rsquo;angolo solido si calcola come un&rsquo;area piatta. Il rapporto fra la formula esatta e quella approssimata tende a uno per $\theta\to0$, ed è lo stesso meccanismo quadratico di prima.</p>
  <p>Per il Sole, il cui raggio angolare è metà del diametro angolare, cioè $4{,}652\cdot10^{-3}$ rad:
  $$\Omega_\odot=\pi\,(4{,}652\cdot10^{-3})^{2}=6{,}80\cdot10^{-5}\ \mathrm{sr}.$$
  Su una sfera intera, che misura $4\pi\simeq12{,}57$ steradianti, <b>il Sole occupa una parte su centottantamila del cielo</b>. Questo numero tornerà in modo decisivo nella tappa 08: un oggetto che manda sulla Terra un certo flusso <i>concentrato</i> in $10^{-5}$ steradianti e lo stesso flusso <i>sparso</i> su un steradiante non si vedono allo stesso modo, e l&rsquo;occhio non misura il flusso ma il flusso per angolo solido.</p>
  <p><b>Il rovescio della medaglia, che è la risoluzione angolare.</b> Lo stesso conto letto al contrario dice quanto bisogna essere bravi a misurare angoli per vedere qualcosa. Hipparcos arrivava a <i>«circa 2 millisecondi d&rsquo;arco»</i>, e de Bernardis lo illustra con <i>«l&rsquo;angolo sotteso da una monetina a 3000 chilometri di distanza»</i>. Il conto con la moneta da un euro dà
  $$\frac{0{,}02325}{2\cdot10^{-3}\cdot4{,}848\cdot10^{-6}}=2{,}40\cdot10^{3}\ \mathrm{km},$$
  cioè duemilaquattrocento chilometri: la stima della diapositiva è giusta come ordine di grandezza, e la differenza sta nella monetina che si immagina. <b>Due millisecondi d&rsquo;arco sono il traguardo di una missione spaziale</b>, e sono ancora dieci volte troppo grossolani per misurare la parallasse di una stella a $500$ pc. Da qui Gaia, e da qui tutto il resto della scala delle distanze.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Una galassia ha diametro $24$ kpc e dista $1$ Mpc. Quale angolo sottende, e quanti dischi lunari sono?`,
    a:R`Il bello di questo conto è che non serve nessuna conversione in metri: <b>le unità si cancellano se si usa la stessa per numeratore e denominatore</b>. $\theta=24\ \mathrm{kpc}/1000\ \mathrm{kpc}=0{,}024$ rad, che in gradi sono $0{,}024\cdot180/\pi=1{,}4$ gradi. Confrontato con i $0{,}518$ gradi della Luna: <b>quasi tre dischi lunari affiancati</b>. È un dato sorprendente e sarà il nocciolo della tappa 08 — le galassie vicine non sono puntini, sono gli oggetti <i>più estesi</i> del cielo dopo Sole e Luna, e il fatto che non si vedano ha un&rsquo;altra causa.`},
   {q:R`Perché nel conto precedente non si è usata l’approssimazione di angolo piccolo con cautela, dato che $1{,}4$ gradi non è un angolo infinitesimo?`,
    a:R`Perché l&rsquo;errore è $\theta^{2}/6$ con $\theta=0{,}024$ rad, cioè $10^{-4}$: <b>una parte su diecimila</b>, mentre il diametro di una galassia non è noto nemmeno al venti per cento. L&rsquo;approssimazione introduce un errore <i>mille volte più piccolo</i> dell&rsquo;incertezza sul dato di partenza, e un errore che non si vede dentro l&rsquo;errore di misura non esiste operativamente. <b>È il criterio generale</b>: un&rsquo;approssimazione si valuta confrontandola con l&rsquo;incertezza del dato, non con lo zero.`}
  ]}
]},

/* ---------------- 04 · LA TAVOLA DELLE CONVERSIONI ---------------- */
{ num:'04', title:'Unità astronomica, anno luce, parsec: la tavola e i disaccordi fra le fonti', meta:'tre unità e un anno da scegliere · la tavola derivata, non copiata · i multipli e il loro dominio · tre numeri su cui le fonti non concordano',
  blocchi:[
  {t:'prosa', title:'L’anno luce, e quale anno', tag:'la derivazione più corta del corso', html:R`
  <p>L&rsquo;anno luce è la distanza percorsa dalla luce in un anno, e de Bernardis lo deriva sulla diapositiva con il conto in chiaro: $D=ct$. Resta però una scelta da fare, che nessuno dichiara mai e che vale sei parti su diecimila: <b>quale anno</b>. Con l&rsquo;anno giuliano, $365{,}25$ giorni, che è la convenzione dell&rsquo;Unione Astronomica Internazionale,
  $$1\ \mathrm{al}=2{,}99792458\cdot10^{8}\cdot365{,}25\cdot86400=9{,}461\cdot10^{15}\ \mathrm{m};$$
  con l&rsquo;anno di $365$ giorni, che è quello che la diapositiva usa,
  $$1\ \mathrm{al}=2{,}998\cdot10^{8}\cdot365\cdot86400=9{,}454\cdot10^{15}\ \mathrm{m}.$$
  <b>I due valori differiscono di meno di un per mille</b>, e arrotondati alle tre cifre con cui si usano sono lo stesso numero: $9{,}46\cdot10^{15}$ m. È il valore della slide del corso e, in CGS, il $9{,}46\cdot10^{17}$ cm di Masani. <i>Qui si tiene $9{,}461\cdot10^{15}$ m</i>, e la differenza con la diapositiva è dichiarata perché è di quelle che non si vedono: non è un errore di nessuno dei due, è una convenzione sull&rsquo;anno.</p>
  <p>Vale la pena osservare che l&rsquo;anno luce è l&rsquo;unica delle tre unità <b>definita da una costante di natura</b> — la velocità della luce, che è esatta per definizione del metro — più una convenzione di calendario. L&rsquo;unità astronomica è definita da un&rsquo;orbita, il parsec da una convenzione angolare. Questa differenza di natura è anche la ragione pratica per cui l&rsquo;anno luce non si usa nei conti: <i>porta dentro un calendario</i>, e un calendario non ha niente a che fare con la Galassia.</p>`},
  {t:'prosa', title:'La tavola, derivata invece che copiata', tag:'il dizionario', html:R`
  <p>Con il parsec della tappa 02 e l&rsquo;anno luce appena ricavato, le nove conversioni fra le tre unità si ottengono per divisione. Due vanno fatte per esteso, le altre sono reciproci. Il parsec in anni luce:
  $$1\ \mathrm{pc}=\frac{3{,}0857\cdot10^{16}}{9{,}4607\cdot10^{15}}=3{,}262\ \mathrm{al}.$$
  Questo è <i>il</i> fattore da avere in testa, e sia Masani sia de Bernardis lo riportano come $3{,}26$. E l&rsquo;anno luce in parsec, che è il suo reciproco:
  $$1\ \mathrm{al}=\frac{9{,}4607\cdot10^{15}}{3{,}0857\cdot10^{16}}=0{,}3066\ \mathrm{pc}.$$
  Infine l&rsquo;anno luce in unità astronomiche, che serve raramente ma è il controllo di coerenza più rapido sulla tavola:
  $$1\ \mathrm{al}=\frac{9{,}4607\cdot10^{15}}{1{,}496\cdot10^{11}}=6{,}324\cdot10^{4}\ \mathrm{UA}.$$</p>
  <table class="tab">
  <thead><tr><th></th><th>in metri</th><th>in UA</th><th>in anni luce</th><th>in parsec</th></tr></thead>
  <tbody>
  <tr><td><b>1 UA</b></td><td>$1{,}496\cdot10^{11}$</td><td>1</td><td>$1{,}581\cdot10^{-5}$</td><td>$4{,}848\cdot10^{-6}$</td></tr>
  <tr><td><b>1 anno luce</b></td><td>$9{,}461\cdot10^{15}$</td><td>$6{,}324\cdot10^{4}$</td><td>1</td><td>$0{,}3066$</td></tr>
  <tr><td><b>1 parsec</b></td><td>$3{,}086\cdot10^{16}$</td><td>$2{,}063\cdot10^{5}$</td><td>$3{,}262$</td><td>1</td></tr>
  </tbody>
  </table>
  <p><b>Come si legge la tavola senza impararla.</b> Tre numeri la generano tutta: il metro per il parsec ($3{,}086\cdot10^{16}$), il rapporto parsec/anno luce ($3{,}26$) e il numero di unità astronomiche in un parsec ($206\,265$). Tutto il resto sono reciproci e prodotti. E i tre numeri non vanno nemmeno ricordati tutti: <i>il secondo e il terzo si derivano dal primo</i> e dalle definizioni, in due righe, come si è fatto sopra. Il solo numero che conviene avere davvero in memoria, perché all&rsquo;orale non c&rsquo;è il foglio, è <b>$1\ \mathrm{pc}=3{,}086\cdot10^{16}$ m</b>.</p>
  <p><b>I multipli, e il loro dominio di impiego</b>, perché nelle prove d&rsquo;esame compaiono sempre così e mai in metri:</p>
  <ul>
  <li><b>parsec</b> — distanze stellari nel vicinato solare, spessore del disco galattico, dimensioni delle nubi molecolari. La stella più vicina sta a $1{,}3$ pc.</li>
  <li><b>kiloparsec</b> ($10^{3}$ pc) — struttura della Galassia: raggio del disco $12$ kpc, distanza dal centro $8$ kpc, Nubi di Magellano a $50$ e $70$ kpc.</li>
  <li><b>megaparsec</b> ($10^{6}$ pc) — distanze fra galassie e dimensioni degli ammassi. $1$ Mpc $=3{,}086\cdot10^{22}$ m, e de Bernardis scrive che <i>«le distanze tipiche tra galassie sono dell&rsquo;ordine del Mpc»</i>. È anche l&rsquo;unità in cui si scrive la costante di Hubble, km/s/Mpc.</li>
  <li><b>gigaparsec</b> ($10^{9}$ pc) — scala cosmologica. L&rsquo;orizzonte osservabile sta a circa $4{,}2$ Gpc.</li>
  </ul>`},
  {t:'reveal', title:'Tre disaccordi numerici fra le fonti del corso, e quale valore si tiene', tag:'dove le fonti non concordano', steps:[
   {label:'1 · Il parsec in chilometri: la slide dice 3,06, il suo conto dà 3,086', body:R`<p>La diapositiva 5 della prima lezione e la diapositiva 121 della seconda parte scrivono entrambe: <i>«1 parsec = R / 1&rdquo; = 3.06x10<sup>13</sup> km = 3.26 anni luce»</i>. Ma il conto che la stessa diapositiva imposta, con $R=149{,}6$ milioni di km e $1''=4{,}85\cdot10^{-6}$ rad, dà
   $$\frac{1{,}496\cdot10^{11}}{4{,}848\cdot10^{-6}\cdot10^{3}}=3{,}086\cdot10^{13}\ \mathrm{km}.$$
   Lo scarto è
   $$\frac{3{,}086-3{,}06}{3{,}086}\cdot100=0{,}84\ \text{per cento},$$
   cioè <b>quasi un per cento</b>, e non è un arrotondamento: $3{,}06$ non è $3{,}09$ arrotondato a tre cifre. È un errore di battitura che si è propagato attraverso le edizioni del corso — compare identico nel 2016 e nella lezione sulle galassie.</p>
   <p><b>Che cosa si fa, e perché non vale qui la regola «si segue il docente».</b> Dove un manuale e il docente divergono su una <i>convenzione</i> — quale lettera usare, quale definizione adottare — si segue il docente, perché l&rsquo;esame lo fa lui. Ma questo non è un disaccordo di convenzione: è un numero sbagliato, e lo smentisce il foglio dati delle sue stesse prove scritte, che stampa <i>«1 parsec = 3.086 x 10<sup>16</sup> m»</i>. <b>Si tiene $3{,}086$</b>, e si sa che a lezione si sentirà dire $3{,}06$. Sapere <i>quale</i> dei due è l&rsquo;errore, e da dove viene, è esattamente l&rsquo;informazione che la lezione non dà.</p>`},
   {label:'2 · L’unità astronomica di Masani, arrotondata e propagata', body:R`<p>Masani scrive <i>«1 unità astronomica $=1{,}5\cdot10^{13}$ cm»</i>, e subito dopo, in nota, il valore preciso: <i>«secondo misure recenti risulta 1 UA $=149\,597\,900$ km, con un errore dell&rsquo;ordine delle decine di km»</i>. Cioè conosce il valore buono e nel testo usa quello arrotondato al dieci per mille. L&rsquo;arrotondamento poi <b>si propaga nella sua tavola</b>, dove si legge $1\ \mathrm{UA}=4{,}87\cdot10^{-6}$ pc, mentre il valore corretto è $4{,}848\cdot10^{-6}$. Da dove viene lo scarto si vede rifacendo il suo conto con i suoi numeri:
   $$\frac{1{,}5\cdot10^{13}}{3{,}087\cdot10^{18}}=4{,}859\cdot10^{-6},$$
   che è già diverso dal suo $4{,}87$ e diverso da $4{,}848$. <b>Due arrotondamenti in catena</b>: l&rsquo;unità astronomica a due cifre e il parsec a quattro, e il risultato esce sbagliato nella terza.</p>
   <p>La lezione generale è più utile del caso: <b>un arrotondamento al dieci per mille, passato attraverso due divisioni, diventa un errore nella terza cifra</b>. Per questo in questo movimento ogni conversione è fatta a partire dai valori a quattro cifre e arrotondata <i>solo alla fine</i>, e per questo i numeri della tavola sono stati ricalcolati invece di trascritti. Masani resta la fonte buona per l&rsquo;impostazione — la sua definizione di parallasse è la più pulita delle due — e non per le cifre.</p>`},
   {label:'3 · I kiloparsec convertiti in anni luce con 3 invece di 3,26', body:R`<p>Questo è il più insidioso dei tre, perché non è un numero isolato ma <b>un fattore usato in modo sistematico</b>. Nella lezione sulla Via Lattea le dimensioni sono date in doppia unità, e il fattore di conversione adoperato non è $3{,}26$:</p>
   <ul>
   <li><i>«Radius stellar disk 12 kpc = 37 000 light years»</i>, mentre $$12\,000\cdot3{,}2616=39\,139\ \mathrm{al}.$$</li>
   <li><i>«Distance Sun to centre 8 kpc = 24 000 l.y.»</i>, mentre $$8\,000\cdot3{,}2616=26\,093\ \mathrm{al}.$$</li>
   <li><i>«Thickness stellar disk ~400 pc = 1200 l.y.»</i>, mentre $$400\cdot3{,}2616=1305\ \mathrm{al}.$$</li>
   </ul>
   <p>Tutti e tre i valori della diapositiva si ottengono moltiplicando per <b>3 invece che per 3,26</b>: $12\,000\cdot3=36\,000\simeq37\,000$, $8\,000\cdot3=24\,000$, $400\cdot3=1200$. Non è un caso isolato ma una conversione fatta a mente con il fattore arrotondato all&rsquo;intero, che costa un <b>otto per cento</b> sistematico, sempre nello stesso verso.</p>
   <p><b>Che cosa farne.</b> Dentro la lezione quei numeri sono innocui: servono a dare l&rsquo;ordine di grandezza della Galassia, e l&rsquo;otto per cento su una dimensione nota al venti per cento non cambia nulla. Diventano un problema solo se si usano come <i>dati</i> in un esercizio che chiede un rapporto o un conto in catena — e all&rsquo;orale, se si cita «ventiquattromila anni luce» dicendo «otto kiloparsec», si sta citando una conversione sbagliata. La forma sicura è <b>dire la quantità in parsec</b>, che è l&rsquo;unità in cui il dato è stato misurato, e convertire solo se qualcuno lo chiede.</p>`}
  ]},
  {t:'prosa', title:'Perché queste tre cose stanno in un nucleo invece che in una tabella', tag:'il filo', html:R`
  <p>Una tabella di conversioni si può copiare da qualunque parte in dieci secondi, e questo movimento sarebbe inutile se fosse soltanto quella tabella. Le tre voci qui sopra sono la ragione per cui non lo è: <b>due dei tre numeri sbagliati stanno nelle slide che si ascoltano a lezione</b>, e un errore incontrato a lezione senza l&rsquo;avvertenza si impara come se fosse vero. Le fonti non sono state «corrette»: sono state <i>rifatte</i>, e dove il risultato non coincideva lo scarto è stato calcolato e spiegato.</p>
  <p>C&rsquo;è anche un criterio generale che esce da questi tre casi, e vale per il resto del corso. <b>Un numero riportato da una fonte si controlla solo se si sa da che conto viene</b>: $3{,}06$ contro $3{,}086$ non si distinguono guardandoli, si distinguono rifacendo $R/1''$. È la ragione per cui le conversioni di questo movimento sono state derivate e non copiate — <i>una conversione derivata porta con sé il suo controllo</i>. Con le unità sistemate, il passo seguente è la seconda metà del programma di questa lezione: non più quanto sono grandi le cose, ma quanto pesano e di che sono fatte.</p>`}
]},

/* ---------------- 05 · MASSE ED ENERGIE ---------------- */
{ num:'05', title:'Masse ed energie: dal grammo alla massa solare, e l’elettronvolt', meta:'ottantacinque ordini di grandezza in massa · la massa solare come unità · l’energia al posto della massa · e l’energia come temperatura',
  blocchi:[
  {t:'prosa', title:'La seconda scala: le masse, e ottantacinque ordini di grandezza', tag:'architettura', html:R`
  <p>La prima voce del programma, «spazio e tempo, dimensioni», è esaurita. La seconda — «particelle e forze» — comincia da una seconda scala, e l&rsquo;intervallo che copre è ancora più ampio di quello delle lunghezze. Dall&rsquo;elettrone, $9{,}11\cdot10^{-31}$ kg, alla massa dell&rsquo;universo osservabile, dell&rsquo;ordine di $10^{53}$ kg, ci sono <b>ottantaquattro ordini di grandezza</b>: più del doppio dei trentasei delle lunghezze.</p>
  <table class="tab">
  <thead><tr><th>oggetto</th><th>massa (kg)</th><th>in masse solari</th></tr></thead>
  <tbody>
  <tr><td>elettrone</td><td>$9{,}11\cdot10^{-31}$</td><td>—</td></tr>
  <tr><td>protone</td><td>$1{,}673\cdot10^{-27}$</td><td>—</td></tr>
  <tr><td>Terra</td><td>$5{,}97\cdot10^{24}$</td><td>$3{,}0\cdot10^{-6}$</td></tr>
  <tr><td>Sole</td><td>$1{,}989\cdot10^{30}$</td><td>1</td></tr>
  <tr><td>stelle della Via Lattea</td><td>$\sim10^{41}$</td><td>$5\cdot10^{10}$</td></tr>
  <tr><td>gas della Via Lattea</td><td>$\sim10^{40}$</td><td>$5\cdot10^{9}$</td></tr>
  <tr><td>alone di materia oscura</td><td>$\sim10^{42}$</td><td>$6\cdot10^{11}$ – $3\cdot10^{12}$</td></tr>
  <tr><td>universo osservabile</td><td>$\sim10^{53}$</td><td>$\sim5\cdot10^{22}$</td></tr>
  </tbody>
  </table>
  <p>I valori galattici sono quelli della lezione sulla Via Lattea: de Bernardis elenca <i>«stellar mass ~5x10<sup>10</sup> M<sub>&#9737;</sub>, gas mass ~5x10<sup>9</sup> M<sub>&#9737;</sub>, dark matter halo: roughly spherical, 6x10<sup>11</sup> to 3x10<sup>12</sup> M<sub>&#9737;</sub>»</i>. Tre numeri che vale la pena guardare insieme perché il loro rapporto è un risultato, non un dato: <b>il gas è un decimo delle stelle, e la materia oscura è dieci o venti volte le stelle e il gas messi insieme.</b> Che l&rsquo;alone sia dichiarato con un intervallo di un fattore cinque, mentre la massa stellare è data con una cifra, dice anche quanto diversamente si conoscono le due — l&rsquo;una si misura contando luce, l&rsquo;altra si deduce da una dinamica.</p>
  <p><b>La massa solare è l&rsquo;unità, e non per pigrizia.</b> $M_\odot=1{,}989\cdot10^{30}$ kg è il valore stampato in calce alle prove scritte, e tutta l&rsquo;astrofisica stellare e galattica misura in quelle unità. La ragione è la stessa del parsec: <i>porta i numeri a essere di ordine uno nel regime in cui si lavora</i>. Una stella va da $0{,}08$ a $100\ M_\odot$, una galassia da $10^{7}$ a $10^{13}$ — e si legge. Per confronto, la Terra pesa
  $$\frac{1{,}989\cdot10^{30}}{5{,}97\cdot10^{24}\cdot10^{3}}=333,$$
  cioè un trecentotrentatremillesimo di Sole: il sistema solare <b>è il Sole</b>, e tutto il resto è polvere residua dentro cui noi viviamo. E la massa stellare della Galassia, in chilogrammi, è
  $$5\cdot10^{10}\cdot1{,}989\cdot10^{30}=9{,}9\cdot10^{40}\ \mathrm{kg}.$$</p>`},
  {t:'prosa', title:'L’elettronvolt, e perché le masse si scrivono come energie', tag:'la conversione meno intuitiva', html:R`
  <p>Qui il dizionario cambia lingua, e la cosa va capita e non subita. <b>In fisica delle particelle e in astrofisica delle alte energie le masse non si scrivono in chilogrammi: si scrivono in elettronvolt</b> — l&rsquo;elettrone «pesa» $0{,}511$ MeV, il protone $938{,}3$ MeV, il bosone di Higgs $125$ GeV. Non è una bizzarria di notazione, ed è il primo punto di questa tappa.</p>
  <p>L&rsquo;<b>elettronvolt</b> è l&rsquo;energia che un elettrone acquista attraversando una differenza di potenziale di un volt, cioè il prodotto della carica elementare per un volt:
  $$1\ \mathrm{eV}=1{,}602\cdot10^{-19}\ \mathrm{J}.$$
  Questa è una definizione e non un conto — la carica elementare è $1{,}6\cdot10^{-19}$ C sul foglio dati delle prove. Dividerla per $c^{2}$ dà una <i>massa</i>, e qui il conto c&rsquo;è:
  $$1\ \mathrm{eV}/c^{2}=\frac{1{,}602177\cdot10^{-19}}{(2{,}99792458\cdot10^{8})^{2}}=1{,}783\cdot10^{-36}\ \mathrm{kg}.$$
  È il fattore di conversione fra le due lingue, ed è tutto quello che serve.</p>
  <p><b>Perché si fa così, e la ragione è fisica.</b> In una reazione — nucleare, atomica, di decadimento — la quantità che si conserva è l&rsquo;energia <i>totale</i>, e la massa a riposo ne è solo un addendo: $E=mc^{2}+K$. Scrivere la massa già in energia permette di leggere a colpo d&rsquo;occhio quali reazioni sono permesse e quanta energia resta per il resto. Due esempi che tornano in tutto il corso: la fusione di quattro protoni in un nucleo di elio libera lo $0{,}7$ per cento della loro massa, e quel numero si legge <i>sottraendo</i> masse scritte in MeV; l&rsquo;annichilazione elettrone-positrone produce due fotoni da $0{,}511$ MeV ciascuno, cioè <i>la massa dell&rsquo;elettrone diventa l&rsquo;energia del fotone</i> e il numero è lo stesso simbolo.</p>
  <p>Il rapporto fra le masse di protone ed elettrone si legge allora senza nessuna conversione:
  $$\frac{938{,}3}{0{,}511}=1836,$$
  ed è uno dei pochi numeri puri della fisica che vale la pena sapere a memoria. <b>Il giro di controllo</b>, per fidarsi del fattore appena ricavato: dalla massa del protone in energia si devono ritrovare i chilogrammi del foglio dati,
  $$938{,}3\cdot10^{6}\cdot1{,}783\cdot10^{-36}=1{,}673\cdot10^{-27}\ \mathrm{kg},$$
  che è esattamente il $m_p=1{,}67\cdot10^{-27}$ kg stampato sulle prove. <i>La conversione chiude su un dato indipendente</i>, e questo è il solo modo serio di collaudare un fattore.</p>`},
  {t:'prosa', title:'Il secondo mestiere dell’elettronvolt: l’energia come temperatura', tag:'la conversione più usata del corso', html:R`
  <p>C&rsquo;è un secondo uso dell&rsquo;elettronvolt, e in astrofisica è più frequente del primo. Attraverso la costante di Boltzmann, <b>un&rsquo;energia è una temperatura</b>: si pone $E=k_BT$ e si legge a che scala termica quel processo diventa frequente. Con $k_B=1{,}381\cdot10^{-23}$ J/K,
  $$T(1\ \mathrm{eV})=\frac{1{,}602\cdot10^{-19}}{1{,}381\cdot10^{-23}}=11\,600\ \mathrm{K}.$$
  <b>Un elettronvolt è poco più di undicimila kelvin</b>, e questo singolo numero organizza mezza astrofisica.</p>
  <p>Si vede subito applicandolo al caso che compare in ogni esame. Ionizzare l&rsquo;idrogeno dal fondamentale costa $13{,}6$ eV, quindi la temperatura corrispondente è
  $$T=\frac{13{,}6\cdot1{,}602\cdot10^{-19}}{1{,}381\cdot10^{-23}}=1{,}58\cdot10^{5}\ \mathrm{K}.$$
  Qui va fatta attenzione a non concludere troppo: la fotosfera solare sta a $5800$ K, cioè <b>venticinque volte sotto</b>, e tuttavia l&rsquo;idrogeno nel Sole è in parte ionizzato. La ragione è che $k_BT$ è l&rsquo;energia <i>tipica</i> di una distribuzione, non il massimo: la coda di Boltzmann ha sempre una frazione $\mathrm{e}^{-E/k_BT}$ di particelle sopra la soglia, e in un gas di $10^{57}$ particelle una frazione $\mathrm{e}^{-27}\sim10^{-12}$ è ancora un numero enorme di atomi. <b>La conversione eV$\to$K dà la scala, non la soglia</b>, e scambiarla per una soglia è l&rsquo;errore che la formula di Saha esiste per correggere.</p>
  <p>Con questo si capisce anche perché la scala termica dell&rsquo;universo si misura in elettronvolt. Qualche esempio del corso, tutti ottenuti con questo unico fattore: la ricombinazione dell&rsquo;idrogeno nel plasma primordiale avviene intorno a $0{,}3$ eV, cioè $3000$ K; l&rsquo;annichilazione dei positroni intorno a $0{,}5$ MeV, cioè $6\cdot10^{9}$ K; il centro del Sole, a $1{,}5\cdot10^{7}$ K, corrisponde a poco più di un keV. <b>Ogni epoca dell&rsquo;universo e ogni strato di una stella si etichetta con un&rsquo;energia</b>, e l&rsquo;energia si converte in temperatura con questa riga.</p>
  <p>Un ultimo esempio, che serve anche come collaudo incrociato sulle fonti. Nella lezione sulle galassie de Bernardis scrive la luminosità del Sole in due unità: <i>«L<sub>&#9737;</sub> = 2.4·10<sup>45</sup> eV/s = 3.8·10<sup>26</sup> W»</i>. Rifacendo la conversione,
  $$2{,}4\cdot10^{45}\cdot1{,}602\cdot10^{-19}=3{,}84\cdot10^{26}\ \mathrm{W},$$
  e il valore della diapositiva è confermato. <b>Qui il docente e il dizionario concordano</b>, e vale la pena notarlo dopo i tre disaccordi della tappa precedente: il controllo non serve a cogliere in errore, serve a sapere di quali numeri si può fare a meno di dubitare.</p>`},
  {t:'plot', title:'Il piano massa-raggio, e le rette di densità costante',
   intro:'In ascissa il logaritmo della massa in kg, in ordinata il logaritmo del raggio in metri. Le tre rette hanno pendenza $1/3$ e sono i luoghi a densità costante: $R=(3M/4\\pi\\rho)^{1/3}$. Dall’alto: la densità media cosmica $10^{-26}$, quella dell’acqua $10^{3}$, quella nucleare $10^{17}$ kg/m³.',
   plots:[
    {kind:'func2d', xr:[-30,55], yr:[-16,29], height:380, equal:false,
     curves:[{f:'(x+25.378)/3', col:'#4c8dff', label:'densita 1e-26 (cosmica)'},
             {f:'(x-3.622)/3', col:'#5eead4', label:'densita 1e3 (acqua)'},
             {f:'(x-17.622)/3', col:'#ff9b6b', label:'densita 1e17 (nucleare)'}],
     title:'x = log10(massa / kg)   y = log10(raggio / m)',
     marks:[{x:-26.78, y:-15.1, label:'protone', col:'#ff9b6b', up:true},
            {x:24.78, y:6.80, label:'Terra', col:'#5eead4', up:true},
            {x:30.30, y:8.84, label:'Sole', col:'#5eead4'},
            {x:30.30, y:6.85, label:'nana bianca', col:'#d8a13a'},
            {x:30.45, y:4.08, label:'stella di neutroni', col:'#ff9b6b'},
            {x:42.0, y:21.08, label:'Via Lattea', col:'#4c8dff', up:true},
            {x:53.0, y:26.11, label:'universo osservabile', col:'#4c8dff', left:true, up:true}]}
   ],
   leggi:R`<p><b>Perché le rette hanno pendenza un terzo, ed è il contenuto geometrico.</b> A densità fissata la massa va come il volume, cioè come $R^{3}$; passando ai logaritmi, $\log R=\frac13\log M+\text{cost}$. Quindi in questo piano <i>ogni</i> famiglia di oggetti con la stessa densità è una retta di pendenza $1/3$, e la costante additiva è la densità. Spostarsi <b>parallelamente</b> alle rette significa cambiare taglia tenendo la stessa materia; spostarsi <b>perpendicolarmente</b> significa comprimere.</p>
   <p><b>Che cosa impararne, primo fatto: Sole e Terra stanno sulla stessa retta, quella dell&rsquo;acqua.</b> Sei ordini di grandezza di massa li separano, e la loro densità media è la stessa a meno di un fattore quattro. Vuol dire che <i>tutta la materia ordinaria, dal sasso alla stella, occupa una striscia sottile di questo piano</i> — ed è un fatto non banale: dice che la materia atomica ha una densità sua, fissata dalla dimensione degli atomi, che non dipende da quanta ce n&rsquo;è.</p>
   <p><b>Secondo fatto, e sposta il discorso sulle forze.</b> La nana bianca e la stella di neutroni hanno la massa del Sole e stanno molto <i>sotto</i> la retta dell&rsquo;acqua: per arrivarci la materia ha dovuto smettere di essere fatta di atomi. La stella di neutroni finisce sulla retta nucleare, <b>la stessa retta su cui sta il protone</b>, trenta ordini di grandezza di massa più a sinistra. Un oggetto di una massa solare e un singolo nucleone hanno la stessa densità: è il modo più compatto di dire che cosa sia una stella di neutroni, e si legge nella figura senza nessuna equazione.</p>
   <p><b>Terzo fatto, il più sorprendente.</b> L&rsquo;universo osservabile cade sulla retta a $10^{-26}\ \mathrm{kg/m^3}$, che è circa cinque atomi di idrogeno per metro cubo. Non è un caso né un&rsquo;approssimazione fortunata: è la <i>densità critica</i>, e il fatto che l&rsquo;universo ci stia sopra è uno dei risultati centrali della cosmologia. Qui serve solo come ordine di grandezza — <b>la densità media dell&rsquo;universo è trenta ordini di grandezza sotto quella dell&rsquo;acqua</b> — ma è anche il motivo per cui la figura si ferma lì: più a destra non c&rsquo;è niente, e la ragione per cui non c&rsquo;è niente è la cosmologia.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Quanti elettroni ci stanno in una massa solare?`,
    a:R`$$\frac{1{,}989\cdot10^{30}}{9{,}109\cdot10^{-31}}=2{,}18\cdot10^{60}.$$ <b>Il conto si fa a mente</b> ed è l&rsquo;esempio canonico della prima regola della tappa 01: due su nove fa circa due decimi, trenta meno meno trentuno fa sessantuno, dunque due decimi di $10^{61}$, cioè $2\cdot10^{60}$. La cifra successiva non aggiunge niente. <b>Perché il numero è interessante</b>: il Sole contiene circa $10^{57}$ protoni, e il rapporto fra i due conti è proprio i $1836$ di prima — cioè la <i>stessa</i> massa contiene mille ottocento volte più elettroni che protoni se la si immagina fatta solo di elettroni. Siccome il Sole è elettricamente neutro, i due numeri di particelle sono invece uguali, e sono $10^{57}$: la massa la fanno i protoni.`},
   {q:R`Un fotone di 1 eV: che lunghezza d’onda ha, e dove cade nello spettro?`,
    a:R`Da $E=hc/\lambda$ con $h=6{,}63\cdot10^{-34}$ J s si ricava $\lambda=hc/E=6{,}63\cdot10^{-34}\cdot3\cdot10^{8}/1{,}602\cdot10^{-19}\simeq1{,}24\cdot10^{-6}$ m, cioè <b>1,24 micrometri: infrarosso vicino</b>. Il numero da ricordare in forma pratica è $\lambda[\mu\mathrm{m}]\simeq1{,}24/E[\mathrm{eV}]$, ed è una delle conversioni più usate del corso: il visibile sta fra $1{,}7$ e $3{,}1$ eV, i raggi X fra $100$ eV e $100$ keV. <b>Messo accanto alla conversione termica</b>, dice che un corpo a $11\,600$ K emette tipicamente nel vicino infrarosso — e infatti il Sole, due volte più freddo, emette nel visibile.`}
  ]}
]},

/* ---------------- 06 · QUALI FORZE, A QUALE SCALA ---------------- */
{ num:'06', title:'Quali forze tengono insieme che cosa, scala per scala', meta:'la gravità è la più debole di tutte · perché vince comunque · dove passa il confine, calcolato · e che cosa fa il neutrino',
  blocchi:[
  {t:'prosa', title:'Il rapporto che va saputo: la gravità è 10⁻³⁶ volte l’elettrostatica', tag:'il conto che inquadra tutto', html:R`
  <p>La seconda voce del programma chiede «particelle e forze», e il modo più rapido di inquadrarla è un unico conto. Si prendono due protoni e si confrontano le due forze che esercitano l&rsquo;uno sull&rsquo;altro: la gravitazionale $Gm_p^{2}/r^{2}$ e l&rsquo;elettrostatica $k_ee^{2}/r^{2}$. <b>Entrambe vanno come $1/r^{2}$, quindi il loro rapporto non dipende dalla distanza</b> — e questa è la ragione per cui il confronto ha senso come numero puro:
  $$\frac{F_g}{F_e}=\frac{Gm_p^{2}}{k_ee^{2}}=\frac{6{,}674\cdot10^{-11}\cdot(1{,}673\cdot10^{-27})^{2}}{8{,}988\cdot10^{9}\cdot(1{,}602\cdot10^{-19})^{2}}=8{,}1\cdot10^{-37}.$$
  <b>La gravità è trentasei ordini di grandezza più debole dell&rsquo;elettrostatica</b>, e lo è a qualunque distanza. È il numero che va saputo in questo movimento, perché rende assurdo ciò che si dice sempre — che la gravità governa l&rsquo;universo — e obbliga a spiegarlo.</p>
  <p>La spiegazione è in una sola parola, e non è «la gravità è a lungo raggio»: anche l&rsquo;elettrostatica lo è, con la stessa legge di potenza. La parola è <b>neutralità</b>. La carica esiste nei due segni, quindi la materia macroscopica è elettricamente neutra a un&rsquo;accuratezza spaventosa, e i campi elettrici dei suoi costituenti si <i>schermano</i>: a un metro da una pietra il campo elettrico è nullo, non piccolo. La massa invece <b>ha un solo segno</b>: non esiste massa negativa, non c&rsquo;è nulla da schermare, e i contributi si sommano tutti.</p>
  <p>Questo trasforma il confronto in un conto sul <i>numero</i> di particelle. Per $N$ nucleoni la forza gravitazionale totale cresce come $N^{2}$, perché ogni massa attira ogni altra; la forza elettrica totale cresce come $(fN)^{2}$, dove $f$ è la frazione di carica non compensata, e per la materia ordinaria $f$ è talmente piccola che il prodotto resta sotto. <b>La gravità non è forte: è l&rsquo;unica che non si cancella</b>, e vince per accumulazione quando $N$ è dell&rsquo;ordine di $10^{36}$ e più. Da qui segue la gerarchia del corso: le forze nucleari tengono insieme i nuclei, l&rsquo;elettromagnetismo gli atomi e le molecole, <b>la gravità tutto ciò che è più grande di un asteroide</b> — e nulla di intermedio.</p>`},
  {t:'prosa', title:'Dove passa il confine, calcolato invece che asserito', tag:'la derivazione', html:R`
  <p>«Più grande di un asteroide» è vago, e si può fare meglio con un criterio energetico che è una delle stime più eleganti di tutta l&rsquo;astrofisica. Si confronta <b>l&rsquo;energia gravitazionale per nucleone</b> con <b>l&rsquo;energia di legame atomico</b>, cioè la scala di energia — qualche <span class="str" data-str="elettronvolt">elettronvolt</span> — che tiene in piedi la struttura della materia ordinaria. Finché la prima è minore, la materia conserva la sua struttura atomica e la sua densità; quando la supera, la gravità vince e la comprime.</p>
  <p>Per un corpo sferico di densità uniforme $\rho$ e raggio $R$, con $M=\frac{4\pi}{3}\rho R^{3}$, l&rsquo;energia gravitazionale per nucleone al bordo è
  $$\frac{GMm_p}{R}=\frac{4\pi}{3}G\rho m_pR^{2}.$$
  Cresce <b>come $R^{2}$</b>, mentre l&rsquo;energia atomica è una costante: quindi il confronto ha sempre una soluzione, e c&rsquo;è una taglia oltre la quale nessun materiale resiste. Imponendo l&rsquo;uguaglianza con $E_{\mathrm{at}}=13{,}6$ eV e $\rho=3000\ \mathrm{kg/m^3}$ — la densità della roccia — si ricava
  $$R=\sqrt{\frac{3E_{\mathrm{at}}}{4\pi G\rho m_p}}=\sqrt{\frac{3\cdot13{,}6\cdot1{,}602\cdot10^{-19}}{4\pi\cdot6{,}674\cdot10^{-11}\cdot3000\cdot1{,}673\cdot10^{-27}}}=3{,}9\cdot10^{7}\ \mathrm{m}.$$
  <b>Quarantamila chilometri, cioè sei raggi terrestri — la taglia di Giove.</b> E il risultato è corretto nel senso più forte: <i>Giove è il corpo freddo più grande che possa esistere</i>, perché oltre quella massa l&rsquo;aggiunta di materia comprime invece di gonfiare, e il raggio comincia a <b>diminuire</b>. La stima a una riga ritrova il massimo della curva massa-raggio.</p>
  <p>Due controlli, per verificare che il criterio sia tarato e non inventato. Per la Terra,
  $$\frac{GM_\oplus m_p}{R_\oplus}=\frac{6{,}674\cdot10^{-11}\cdot5{,}97\cdot10^{24}\cdot1{,}673\cdot10^{-27}}{6{,}37\cdot10^{6}\cdot1{,}602\cdot10^{-19}}=0{,}65\ \mathrm{eV},$$
  cioè <b>sotto la soglia atomica di un fattore venti</b>: la Terra è tenuta insieme dalla gravità, ma la sua <i>densità</i> è ancora decisa dalla chimica, non dal peso. Per il Sole lo stesso conto dà
  $$\frac{GM_\odot m_p}{R_\odot}=1{,}99\cdot10^{3}\ \mathrm{eV},$$
  cioè <b>due keV, centocinquanta volte la soglia</b>. Nel Sole la gravità ha vinto completamente: nessuna struttura atomica sopravvive, la materia è un plasma ionizzato, e la densità non ha più niente a che fare con la dimensione degli atomi. <i>Questo singolo numero dice perché una stella è un gas e non un sasso</i>, e si collega direttamente alla figura della tappa 05: Terra e Sole stanno sulla stessa retta di densità per ragioni diverse, e il Sole ci sta per caso.</p>`},
  {t:'reveal', title:'Le quattro interazioni, con il numero che le distingue', tag:'la mappa delle forze', steps:[
   {label:'Nucleare forte — raggio di un fermi, otto MeV per nucleone', body:R`<p>È l&rsquo;interazione più intensa e la più corta: il suo raggio d&rsquo;azione è di circa $10^{-15}$ m, un <b>fermi</b>, cioè la dimensione di un nucleo. Fuori da quel raggio non esiste, e questa è la sola ragione per cui esistono atomi distinti invece di una sola palla di materia nucleare.</p>
   <p>L&rsquo;energia che mette in gioco è l&rsquo;<b>energia di legame per nucleone, circa 8 MeV</b>, e il confronto con la chimica è il numero che spiega le stelle:
   $$\frac{8\cdot10^{6}}{13{,}6}=5{,}88\cdot10^{5}.$$
   <b>Una reazione nucleare rende seicentomila volte più di una reazione chimica</b>, a parità di particelle coinvolte. È la differenza fra una stella che brucia per dieci miliardi di anni e una che si spegnerebbe in qualche decina di migliaia — e nel 1850, prima che si conoscesse la fisica nucleare, questo era precisamente il problema insolubile dell&rsquo;età del Sole.</p>`},
   {label:'Elettromagnetica — tutto ciò che si osserva passa da qui', body:R`<p>Raggio infinito, intensità intermedia, e due segni di carica. Tiene insieme atomi e molecole con energie dell&rsquo;ordine dell&rsquo;elettronvolt, e governa <i>tutta</i> l&rsquo;osservazione astronomica: ogni fotone che arriva da una stella è stato emesso da una transizione elettromagnetica. <b>L&rsquo;astrofisica è una scienza elettromagnetica che studia oggetti gravitazionali</b>, e la frattura fra ciò che tiene insieme gli oggetti e ciò con cui li guardiamo è una caratteristica strutturale della materia.</p>
   <p>Il motivo per cui in astrofisica non si parla quasi mai di forze elettriche <i>macroscopiche</i> è la neutralità del paragrafo precedente, ma c&rsquo;è un&rsquo;eccezione enorme: i <b>campi magnetici</b>. Un plasma neutro non ha campo elettrico ma può avere correnti, e quindi campi magnetici, che non si schermano. Da lì vengono il vento solare, i getti relativistici, la radiazione di sincrotrone — cioè una buona metà di ciò che il cielo emette fuori dal visibile.</p>`},
   {label:'Debole — il raggio più corto, e il messaggero più prezioso', body:R`<p>Raggio d&rsquo;azione $10^{-18}$ m, mille volte sotto quello della forza forte, e intensità ancora minore. In astrofisica conta per una ragione sola e decisiva: <b>governa i processi in cui compaiono i neutrini</b>, cioè i decadimenti beta che stanno nel cuore della catena protone-protone, e il collasso del nucleo di una supernova.</p>
   <p>Che l&rsquo;interazione sia debolissima è esattamente ciò che rende il neutrino utile: un fotone emesso nel centro del Sole impiega centomila anni a uscire, un neutrino esce in due secondi. <b>I neutrini sono l&rsquo;unico messaggero che proviene dall&rsquo;interno degli oggetti invece che dalla loro superficie.</b></p>
   <p>de Bernardis apre il corso con la dimostrazione di questo, e vale la pena rifarne il conto. Dalla supernova SN1987A, a $168\,000$ anni luce, i neutrini sono arrivati <i>«approximately three hours before the visible light»</i> — e tre ore su centosessantottomila anni sono
   $$\frac{3}{168\,000\cdot8766}=2{,}04\cdot10^{-9}.$$
   Cioè l&rsquo;osservazione limita la differenza relativa fra la velocità dei neutrini e quella della luce a <b>due parti su un miliardo</b>. Il confronto che il docente vuole far fare è con la misura di OPERA del 2011: una differenza di $2{,}5\cdot10^{-5}$ avrebbe comportato
   $$2{,}5\cdot10^{-5}\cdot168\,000=4{,}2\ \text{anni}$$
   di anticipo dei neutrini, non tre ore. <b>Una singola osservazione astrofisica del 1987 escludeva già il risultato di un acceleratore del 2011</b>, con quattro ordini di grandezza di margine — e, come la lezione nota con asciuttezza, quel risultato si rivelò dovuto a <i>«un connettore mal connesso»</i>. È la tesi del corso in un esempio: l&rsquo;astrofisica è un laboratorio con parametri non riproducibili sulla Terra.</p>`},
   {label:'Gravitazionale — la più debole, e la sola che non si cancella', body:R`<p>Raggio infinito, un solo segno, intensità $10^{-36}$ rispetto all&rsquo;elettrostatica. Tutto quanto detto sopra, con una conseguenza in più che va dichiarata perché pesa sui movimenti successivi: siccome <b>l&rsquo;energia gravitazionale di un sistema non è la somma delle energie delle sue parti</b> — accostare due corpi libera energia — un sistema autogravitante non è <i>estensivo</i>. È il motivo per cui la termodinamica ordinaria va maneggiata con cura in astrofisica: un gas autogravitante può avere calore specifico negativo, cioè scaldarsi perdendo energia, ed è esattamente quello che fa una stella mentre si contrae.</p>
   <p>Una stima che chiude il cerchio, ed è quella di Masani. Se <i>tutta</i> la massa del Sole si convertisse in radiazione alla luminosità attuale, la vita del Sole sarebbe
   $$\tau=\frac{M_\odot c^{2}}{L_\odot}=\frac{1{,}989\cdot10^{30}\cdot(2{,}998\cdot10^{8})^{2}}{3{,}845\cdot10^{26}\cdot365{,}25\cdot86400}=1{,}47\cdot10^{13}\ \text{anni},$$
   e Masani lo scrive così, <i>«un limite superiore lo si ottiene evidentemente dalla relazione $\tau=Mc^{2}/L\sim10^{13}$ anni»</i>, aggiungendo che il consumo è <i>«una frazione estremamente piccola della sua energia interna»</i>. Il limite vero si ottiene correggendo con due fattori: solo lo $0{,}7$ per cento della massa dell&rsquo;idrogeno diventa energia nella fusione in elio, e solo circa un decimo della massa stellare sta nel nucleo abbastanza caldo da bruciare. Quindi
   $$0{,}007\cdot0{,}1\cdot1{,}47\cdot10^{13}=1{,}03\cdot10^{10}\ \text{anni},$$
   <b>dieci miliardi di anni</b>, che è la vita di sequenza principale del Sole misurata per altra via. <i>Due fattori di correzione su una stima dimensionale, e il numero esce giusto</i>: è il modello di tutte le stime d&rsquo;ordine di grandezza del corso.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Perché la gravità, che è $10^{-36}$ volte più debole, decide la struttura di una stella, mentre l’interazione forte, che è la più intensa, non ha nessun ruolo nel tenerla insieme?`,
    a:R`Per il <b>raggio d&rsquo;azione</b>, e il conto è immediato: la forza forte agisce entro $10^{-15}$ m, quindi in una stella di raggio $7\cdot10^{8}$ m <i>ogni</i> nucleone ne sente solo i vicini immediati — l&rsquo;interazione forte non si somma su scala macroscopica, perché non arriva. La gravità, con raggio infinito e un solo segno, si somma su tutti i $10^{57}$ nucleoni. <b>Il criterio generale è il prodotto intensità per numero di coppie accoppiate</b>: la forza forte vince su $10^{2}$ nucleoni, la gravità su $10^{57}$, e il confine è dove i due prodotti si pareggiano. La forza forte nelle stelle conta per un&rsquo;altra cosa — <i>fornisce l&rsquo;energia</i> — e il corso tiene le due questioni separate: la gravità dà l&rsquo;equilibrio, il nucleare la sorgente.`},
   {q:R`Il rapporto $F_g/F_e$ fra due protoni non dipende dalla distanza. Da che cosa dipende, allora, e che succede sostituendo gli elettroni ai protoni?`,
    a:R`Dipende <b>soltanto dalle masse</b>, perché le cariche sono uguali: $F_g/F_e=Gm^{2}/k_ee^{2}$. Con due elettroni il rapporto si riduce di $(m_e/m_p)^{2}=(1/1836)^{2}\simeq3\cdot10^{-7}$, cioè diventa $\sim2{,}4\cdot10^{-43}$: fra elettroni la gravità è ancora mille miliardi di volte più trascurabile. <b>Conseguenza fisica vera</b>, non un esercizio: in ogni plasma astrofisico gli elettroni rispondono ai campi elettromagnetici e <i>non</i> alla gravità, mentre gli ioni sentono entrambe. La separazione di carica che ne nascerebbe genera però subito un campo elettrico che riaccoppia le due specie — ed è l&rsquo;origine del campo elettrico di polarizzazione in un&rsquo;atmosfera stellare, uno dei pochi posti in astrofisica in cui un campo elettrico macroscopico non è nullo.`}
  ]}
]},

/* ---------------- 11 · IL SENSO E LE ROTTE ---------------- */
{ num:'11', title:'Il senso, e dove riappare', meta:'da scrivere',
  blocchi:[
  {t:'prosa', title:'segnaposto', tag:'', html:R`
  <p>segnaposto: prolessi.</p>`}
]}

];


/* =================================================================== */
var byId = {}; TAPPE.forEach(function(s){ byId[s.num]=s; });

var VKEY='pm-nucleoas-01-visited';
function loadSeen(){ try{ return new Set(JSON.parse(localStorage.getItem(VKEY)||'[]')); }catch(e){ return new Set(); } }
function saveSeen(s){ try{ localStorage.setItem(VKEY, JSON.stringify(Array.from(s))); }catch(e){} }
var SEEN = loadSeen();

function renderNav(active){
  var nav=document.getElementById('sidebar');
  nav.innerHTML='';
  var h=document.createElement('h2'); h.textContent='Nucleo as-01 · le tappe'; nav.appendChild(h);
  TAPPE.forEach(function(s){
    var b=document.createElement('button');
    b.className='navitem'+(active===s.num?' active':'')+(SEEN.has(s.num)?' seen':'');
    b.innerHTML='<span class="dot"></span><span class="nx">'+s.num+'</span><span>'+s.title+'</span>';
    b.onclick=function(){ showTappa(s.num); };
    nav.appendChild(b);
  });
}

/* ---- renderer dei blocchi ---- */
function sectionProsa(title, tag, html){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var body=elFromHTML('<div class="open-body">'+html+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function sectionGram(title, rows){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag gramtag">grammatica</span></h3>';
  var inner='<table class="gramtab">';
  rows.forEach(function(r){ inner+='<tr><td class="gs">'+r[0]+'</td><td>'+r[1]+'</td></tr>'; });
  inner+='</table>';
  var body=elFromHTML('<div class="gramwrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
/* --- blocco PLOT: la figura non decora, si legge. Ogni plot porta una chiave di lettura. --- */
function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';
  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionSvelabile(title, tag, html, sol){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var c=document.createElement('div'); c.className='collaudo-item';
  var q=document.createElement('div'); q.className='cq'; q.innerHTML=html||'';
  c.appendChild(q); typeset(q);
  if(sol){
    var a=document.createElement('div'); a.className='ca'; a.style.display='none';
    a.innerHTML='<b>Soluzione.</b> '+sol;
    var btn=document.createElement('button'); btn.className='reveal-btn small';
    btn.textContent='Rivela la soluzione';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a);
      btn.disabled=true; btn.classList.add('done'); btn.textContent='Soluzione rivelata'; };
    c.appendChild(btn); c.appendChild(a);
  }
  wrap.appendChild(c); return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    /* DUE SCHEMI, NON UNO — scoperto il 2026-10-06 provando le pagine vive. I movimenti
       scritti per primi (em-01..03, me-10b, i collaudi di gd-01..09 e di quattro em)
       usano una forma piu' semplice: `reveal` e `prolessi` con un solo `html`,
       `esercizio` e `collaudo` con `html` + `sol`. Il renderer ne conosceva una sola e
       chiamava `steps.forEach` su `undefined`: TypeError, e la tappa si fermava li' —
       62 blocchi in 17 movimenti su 74. Non si riscrive il contenuto per far contento
       il renderer: e' il renderer che deve leggere cio' che c'e'.
       E in fondo un ramo che NON muore: uno schema nuovo di domani deve far vedere un
       avviso in quella sezione, non spegnere la pagina sotto di se'. */
    try{
      if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
      else if(b.t==='prolessi') m.appendChild(b.rotte ? sectionProlessi(b)
                                   : sectionProsa(b.title,'prolessi',b.html));
      else if(b.t==='reveal')m.appendChild(b.steps ? sectionReveal(b.title,b.tag,b.steps)
                                   : sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='esercizio') m.appendChild(b.steps ? sectionEsercizio(b)
                                   : sectionSvelabile(b.title,'esercizio',b.html,b.sol));
      else if(b.t==='collaudo')  m.appendChild(b.items ? sectionCollaudo(b.title,b.items)
                                   : sectionSvelabile(b.title,'provi, poi riveli',b.html,b.sol));
      else if(b.t==='plot')      m.appendChild(sectionPlot(b));
      else m.appendChild(sectionProsa(b.title||'(blocco)', 'tipo sconosciuto: '+b.t,
                                      b.html||''));
    }catch(err){
      var avv=document.createElement('section'); avv.className='section';
      avv.innerHTML='<h3>'+(b.title||'(blocco)')+'<span class="tag">non reso</span></h3>'
        +'<p style="color:#ff6b6b">Questo blocco non si &egrave; potuto rendere ('
        +b.t+': '+err.message+'). Il resto della tappa continua sotto.</p>';
      m.appendChild(avv);
    }
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* I POP-UP DEGLI STRUMENTI. `cablaStrumenti` esisteva dal 18-09 e non la chiamava
     nessuno: i 229 rimandi del percorso erano <span> senza handler, e il clic non
     faceva niente. Nessun controllo poteva vederlo — la sintassi era valida, le schede
     c'erano tutte, le formule rendevano: il guasto esisteva solo a pagina viva. Qui, e
     dopo ogni inserimento successivo, perche' la tappa si rimonta da capo a ogni
     cambio e gli handler vanno riattaccati al DOM nuovo. */
  cablaStrumenti(m);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}

/* deep-link: as-01-la-scala-del-cosmo.html#03 apre direttamente la tappa 03 */
window.addEventListener('DOMContentLoaded', function(){
  var h=(location.hash||'').replace('#','');
  showTappa(byId[h]?h:'00');
});
window.addEventListener('hashchange', function(){
  var h=(location.hash||'').replace('#','');
  if(byId[h]) showTappa(h);
});
</script>
