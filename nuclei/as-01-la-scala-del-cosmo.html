<style>
  :root{
    --bg:#0e1117; --panel:#161b22; --panel2:#1c232d; --border:#2b333d;
    --txt:#eef3f8; --muted:#b9c4d1; --accent:#4c8dff; --accent2:#8fb0ff;
    --ok:#2ea043; --okbg:#10331b; --warn:#d8a13a; --warnbg:#332a10;
    --gram:#5eead4; --grambg:#0f2a26;
    --pro:#b98cff; --probg:#1a1430; --proline:#2a2247; --proedge:#3a2d5c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    font-size:17px;line-height:1.55;}
  a{color:var(--accent2);}
  .banner{background:var(--panel2);border-bottom:1px solid var(--border);color:var(--muted);
    font-size:.8rem;font-weight:600;text-align:center;padding:8px 12px;letter-spacing:.3px;}
  .banner b{color:var(--accent2);}
  .shell{display:flex;max-width:1180px;margin:0 auto;align-items:flex-start;}

  /* ---- SIDEBAR ---- */
  .sidebar{width:280px;flex:0 0 280px;padding:20px 12px 60px;position:sticky;top:0;
    max-height:100vh;overflow-y:auto;border-right:1px solid var(--border);}
  .sidebar h2{font-size:.72rem;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);
    margin:18px 8px 8px;}
  .navitem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:none;
    background:transparent;color:var(--txt);padding:9px 10px;border-radius:8px;cursor:pointer;
    font-size:.9rem;transition:.12s;border:1px solid transparent;}
  .navitem:hover{background:var(--panel2);}
  .navitem.active{background:#13233f;border-color:var(--accent);color:#fff;}
  .navitem .dot{width:7px;height:7px;border-radius:50%;background:transparent;flex:0 0 7px;
    border:1px solid var(--border);}
  .navitem.seen .dot{background:var(--ok);border-color:var(--ok);}
  .navitem .nx{color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto;}

  /* ---- MAIN ---- */
  .main{flex:1 1 auto;min-width:0;padding:24px 30px 90px;max-width:860px;}
  h1{font-size:1.5rem;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:.92rem;margin:0 0 18px;}
  .sfhead{border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:8px;}
  .sfhead h1{font-size:1.55rem;}
  .meta{color:var(--muted);font-size:.82rem;margin-top:6px;}

  .section{margin:26px 0;}
  .section > h3{font-size:1.02rem;color:var(--accent2);margin:0 0 10px;
    display:flex;align-items:center;gap:10px;}
  .section > h3 .tag{font-size:.66rem;font-weight:700;letter-spacing:.4px;background:var(--panel2);
    border:1px solid var(--border);color:var(--muted);padding:2px 8px;border-radius:20px;
    text-transform:uppercase;}
  /* --- blocchi figura --- */
  .section > h3 .tag.plottag{background:#101f2e;border-color:#1f3c57;color:#7ab8e0;}
  .plot-intro{color:var(--muted);font-size:.95rem;margin:0 0 12px;}
  .plot-row{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;
    background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;}
  .plot-row.due .plot-box{flex:1 1 300px;min-width:280px;}
  .plot-box{max-width:560px;}
  .plot-leggi{margin-top:10px;background:var(--panel2);border:1px solid var(--border);
    border-left:3px solid #4a8fc7;border-radius:0 10px 10px 0;padding:11px 14px;
    font-size:.93rem;color:var(--muted);}
  .plot-leggi b{color:#7ab8e0;}
  .plot-err{color:#ff6b6b;font-size:.85rem;}
  .open-body{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
  .open-body p:first-child{margin-top:0;} .open-body p:last-child{margin-bottom:0;}
  .open-body ul{margin:.4em 0;padding-left:1.2em;} .open-body li{margin:.35em 0;}

  .note{background:var(--panel2);border-left:3px solid var(--muted);border-radius:6px;
    padding:9px 12px;margin:12px 0;font-size:.9rem;color:var(--muted);}
  .note b{color:#ff9d6b;}
  .note.warn{background:var(--warnbg);border-left-color:var(--warn);color:#e0b85a;}
  .note.warn b{color:#f0c25a;}

  /* ---- GRAMMATICA ---- */
  .gramwrap{background:var(--grambg);border:1px solid #1f4d47;border-radius:12px;padding:6px 6px;}
  table.gramtab{border-collapse:collapse;width:100%;font-size:.92rem;}
  table.gramtab td{padding:9px 12px;vertical-align:top;border-bottom:1px solid #17332e;}
  table.gramtab tr:last-child td{border-bottom:none;}
  table.gramtab td.gs{white-space:nowrap;color:var(--gram);width:1%;
    border-right:1px solid #17332e;font-variant-numeric:tabular-nums;}
  .section > h3 .tag.gramtag{background:var(--grambg);border-color:#1f4d47;color:var(--gram);}

  /* ---- STRUMENTI (repertorio condiviso: la scheda si apre DENTRO la frase) ----
     Nessun accento nuovo: riusa il verde della grammatica, perche' uno strumento
     richiamato e' grammatica gia' spiegata altrove, non una quinta specie di blocco. */
  .str{color:var(--gram);border-bottom:1px dashed var(--gram);cursor:pointer;}
  .str:hover{background:var(--grambg);}
  .str::after{content:"\2666";font-size:.62em;vertical-align:.42em;margin-left:2px;opacity:.8;}
  .str.aperto::after{content:"\2715";}
  .str.rotto{color:#ff6b6b;border-bottom-color:#ff6b6b;cursor:help;}
  /* la scheda e' uno SPAN in display:block, non un div: i rimandi cadono dentro
     <p>, <li> e celle di tabella, dove un div e' HTML illegale. */
  .strcard{display:block;margin:10px 0;background:var(--grambg);border:1px solid #1f4d47;
    border-left:3px solid var(--gram);border-radius:0 10px 10px 0;padding:10px 14px;font-size:.9rem;}
  .strcard .sh{display:block;font-size:.66rem;font-weight:700;letter-spacing:.5px;
    text-transform:uppercase;color:var(--gram);margin-bottom:7px;}
  .strcard .sr{display:block;margin:5px 0;}
  .strcard .sk{color:var(--gram);font-weight:600;}

  /* ---- PROLESSI (preannuncio fisico) ---- */
  .prowrap{background:var(--probg);border:1px solid var(--proedge);border-radius:12px;padding:4px 4px 8px;}
  .prohead{padding:11px 14px 4px;color:var(--pro);font-size:.72rem;font-weight:700;letter-spacing:.7px;
    text-transform:uppercase;}
  .pro-oggetto{padding:2px 14px 11px;color:var(--muted);font-size:.92rem;border-bottom:1px solid var(--proline);
    margin-bottom:2px;} .pro-oggetto b{color:var(--txt);}
  table.protab{border-collapse:collapse;width:100%;font-size:.92rem;}
  table.protab td{padding:10px 12px;vertical-align:top;border-bottom:1px solid var(--proline);}
  table.protab tr:last-child td{border-bottom:none;}
  table.protab td.pd{white-space:nowrap;color:var(--pro);width:1%;font-weight:700;font-size:.78rem;
    letter-spacing:.3px;text-transform:uppercase;border-right:1px solid var(--proline);line-height:1.3;}
  .pro-domanda{margin:8px 8px 2px;background:#140d26;border:1px solid var(--proedge);
    border-left:3px solid var(--pro);border-radius:8px;padding:10px 14px;font-size:.92rem;}
  .pro-domanda b{color:var(--pro);}
  .section > h3 .tag.protag{background:var(--probg);border-color:var(--proedge);color:var(--pro);}

  /* ---- REVEAL ---- */
  .rsteps{display:flex;flex-direction:column;gap:12px;}
  .rstep{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 18px;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .rlabel{font-size:.7rem;font-weight:700;letter-spacing:.4px;color:var(--accent);
    text-transform:uppercase;margin-bottom:8px;}
  .rstep p:first-of-type{margin-top:0;} .rstep p:last-child{margin-bottom:0;}
  .rstep ul{margin:.4em 0;padding-left:1.2em;}
  .testo{background:#13233f;border:1px solid #2b4877;border-radius:12px;padding:14px 18px;margin-bottom:14px;}
  .testo .src{display:block;font-size:.74rem;font-style:italic;color:var(--accent2);margin-bottom:8px;
    text-transform:uppercase;letter-spacing:.3px;}
  .esame-nota{font-size:.9rem;color:var(--muted);font-style:italic;margin-top:12px;padding-left:12px;
    border-left:3px solid var(--border);}

  .reveal-btn{background:var(--accent);color:#fff;border:none;padding:11px 18px;border-radius:10px;
    font-size:.95rem;font-weight:600;cursor:pointer;margin-top:14px;transition:.12s;}
  .reveal-btn:hover:not(:disabled){background:var(--accent2);}
  .reveal-btn.small{padding:7px 14px;font-size:.85rem;margin-top:0;background:var(--panel2);
    color:var(--accent2);border:1px solid var(--border);}
  .reveal-btn.small:hover:not(:disabled){border-color:var(--accent);}
  .reveal-btn:disabled,.reveal-btn.done{background:var(--panel2);color:var(--muted);
    border:1px solid var(--border);cursor:default;}

  /* ---- COLLAUDO ---- */
  .collaudo-item{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 18px;margin-bottom:12px;}
  .cq{margin-bottom:10px;}
  .ca{margin-top:12px;background:var(--okbg);border:1px solid #235c33;border-radius:8px;
    padding:10px 14px;font-size:.94rem;}
  .ca b{color:#5fd980;}

  /* ---- PREV / NEXT ---- */
  .prevnext{display:flex;justify-content:space-between;gap:12px;margin-top:40px;
    border-top:1px solid var(--border);padding-top:20px;}
  .pnbtn{flex:1 1 0;background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:12px 16px;cursor:pointer;color:var(--txt);text-align:left;transition:.14s;font:inherit;}
  .pnbtn:hover{border-color:var(--accent);background:var(--panel2);}
  .pnbtn.next{text-align:right;}
  .pnbtn .k{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .pnbtn .t{font-weight:600;color:var(--accent2);}
  .pnbtn:disabled{opacity:.35;cursor:default;border-color:var(--border);background:var(--panel);}

  code{background:var(--panel2);border:1px solid var(--border);border-radius:5px;
    padding:1px 5px;font-size:.85em;color:var(--accent2);}
  .katex{font-size:1.02em;color:var(--txt);} .katex-display{margin:.5em 0;overflow-x:auto;overflow-y:hidden;}

  @media(max-width:860px){
    .shell{flex-direction:column;}
    .sidebar{width:100%;flex:none;position:static;max-height:none;border-right:none;
      border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:4px;}
    .sidebar h2{width:100%;} .navitem{width:auto;}
    .main{padding:20px 16px 80px;}
  }
</style>

/* ===================================================================

var CORSO = 'astrofisica';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["ordini-di-grandezza"] = {"nome":"Ordini di grandezza","riga":"Stimare una quantità alla potenza di dieci giusta: si tiene una cifra significativa, si sommano e si sottraggono gli esponenti, e si controlla che l'unità del risultato sia quella che si voleva.","serve":"A sapere se un risultato è plausibile prima di averlo calcolato con precisione, e ad accorgersi di un errore di impostazione quando c'è ancora tempo per rimediare. In astrofisica non è una comodità ma il modo normale di ragionare, per due ragioni: le grandezze in gioco vanno da $10^{-36}$ kg a $10^{53}$ kg e nessuna intuizione le copre, e i dati osservativi sono noti al dieci o al venti per cento, quindi una cifra significativa è spesso tutto ciò che il problema contiene davvero. Il controllo che smaschera più errori non è sul numero, è sull'**unità**: un conto che dovrebbe dare una densità e dà dei kg è sbagliato nell'impostazione, e nessun affinamento dell'aritmetica lo salverà. La seconda regola è il confronto con un termine noto — l'acqua per una densità, il Sole per una massa o una luminosità, il parsec per una distanza galattica — perché un numero senza metro non dice niente.","esempio":"Densità media del Sole, dalle due sole quantità stampate in calce al foglio d'esame, $M_\\odot=1{,}989\\cdot10^{30}$ kg e $R_\\odot=6{,}957\\cdot10^{8}$ m: $\\rho=\\dfrac{3M_\\odot}{4\\pi R_\\odot^{3}}=1410\\ \\mathrm{kg/m^3}$. Il confronto è immediato e istruttivo: è quasi una volta e mezza l'acqua, cioè il Sole è in media meno denso della Terra — una stella non è un sasso grande, è un gas tenuto insieme dal proprio peso.","pieno":{"file":"as-01-la-scala-del-cosmo.html","tappa":"01","come":"la gerarchia delle strutture cosmiche letta come scala di ordini di grandezza, e il tempo di luce come secondo asse della stessa tabella"},"controllo":[{"tipo":"numero","espr":"3*1.989e30/(4*pi*(6.957e8)**3)","vale":"1410","dove":"esempio","appare":"1410"}]};
STRUM["parsec-e-parallasse"] = {"nome":"Parsec e parallasse","riga":"Il parsec è la distanza da cui il raggio dell'orbita terrestre è visto sotto un secondo d'arco: $1\\ \\mathrm{pc}=1\\,\\mathrm{UA}/1''=3{,}086\\cdot10^{16}$ m, e la distanza di una stella in parsec è l'inverso della sua parallasse in secondi d'arco.","serve":"A non portare mai un fattore di conversione a memoria. La definizione è geometrica e si ricostruisce in due righe: se $p$ è l'angolo sotto cui dalla stella si vede il semiasse maggiore dell'orbita terrestre, per angoli piccoli $p=R_{\\text{UA}}/d$, e scegliendo l'unità di distanza in modo che $p=1''$ corrisponda a $d=1$ si ottiene $d[\\mathrm{pc}]=1/p['']$. Il parsec non è un'unità più «astronomica» dell'anno luce: è l'unità in cui la misura che si fa davvero — un angolo — diventa direttamente una distanza, senza nessun conto intermedio. Nelle prove scritte di Astrofisica il valore $1\\ \\mathrm{pc}=3{,}086\\cdot10^{16}$ m è stampato in calce al foglio fra i dati: ciò che va saputo è l'inversione, non il numero.","esempio":"La stella più vicina, Proxima Centauri, ha parallasse $p=0{,}7687''$. Quindi $d=1/0{,}7687=1{,}301$ pc, e in anni luce $d=3{,}26/0{,}7687=4{,}24$ anni luce. Il controllo di coerenza è immediato: una parallasse inferiore al secondo d'arco vuol dire per forza una distanza superiore al parsec, e se il conto dà il contrario è stata invertita la frazione.","pieno":{"file":"as-01-la-scala-del-cosmo.html","tappa":"02","come":"la derivazione del parsec dalla parallasse annua e le conversioni fra unità astronomica, anno luce e parsec, nel movimento sulla scala del cosmo"},"controllo":[{"tipo":"numero","espr":"1.496e11/(pi/648000)/1e16","vale":"3.086","dove":"riga","appare":"3,086\\cdot10^{16}"},{"tipo":"numero","espr":"1/0.7687","vale":"1.301","dove":"esempio","appare":"1,301"},{"tipo":"numero","espr":"3.26/0.7687","vale":"4.24","dove":"esempio","appare":"4,24"},{"tipo":"numero","espr":"1.496e11/(pi/648000)/1e16","vale":"3.086","dove":"serve","appare":"3,086\\cdot10^{16}"}]};
STRUM["angolo-piccolo"] = {"nome":"Angolo piccolo","riga":"Per $\\theta\\ll1$ radiante valgono $\\sin\\theta\\simeq\\tan\\theta\\simeq\\theta$, e un oggetto di dimensione trasversa $l$ posto a distanza $d\\gg l$ sottende l'angolo $\\theta\\simeq l/d$.","serve":"È l'approssimazione su cui poggia tutta la geometria osservativa: l'unica grandezza che un telescopio misura direttamente è un angolo, e trasformarlo in una lunghezza richiede solo questa relazione più una distanza nota. L'errore relativo che si commette è controllato e piccolissimo: dallo sviluppo $\\sin\\theta=\\theta-\\theta^{3}/6+\\dots$ segue che $\\theta$ sovrastima $\\sin\\theta$ di una frazione $\\theta^{2}/6$, quindi per il disco solare — l'oggetto più grande del cielo insieme alla Luna, e già solo mezzo grado — si sbaglia di una parte su settantamila. Per qualunque oggetto extrasolare l'approssimazione è esatta a tutti gli effetti pratici. La regola pratica che ne segue vale più della formula: un angolo in radianti si legge subito come rapporto fra due lunghezze, e i secondi d'arco esistono solo perché il radiante è troppo grande — $1''=4{,}848\\cdot10^{-6}$ rad.","esempio":"La Luna ha diametro $l=3{,}476\\cdot10^{6}$ m e dista $d=3{,}844\\cdot10^{8}$ m, quindi sottende $\\theta=\\dfrac{3{,}476\\cdot10^{6}}{3{,}844\\cdot10^{8}}=9{,}043\\cdot10^{-3}$ rad, che in gradi sono $\\theta=9{,}043\\cdot10^{-3}\\cdot180/\\pi=0{,}518$ gradi. L'errore dell'approssimazione, $\\theta^{2}/6$, vale una parte su settantamila: invisibile rispetto a qualunque incertezza osservativa.","pieno":{"file":"as-01-la-scala-del-cosmo.html","tappa":"03","come":"l'angolo sotteso come unica grandezza direttamente misurabile, con la stima dell'errore dell'approssimazione di angolo piccolo"},"controllo":[{"tipo":"numero","espr":"pi/648000*1e6","vale":"4.848","dove":"serve","appare":"4,848"},{"tipo":"numero","espr":"3.476e6/3.844e8*1e3","vale":"9.043","dove":"esempio","appare":"9,043\\cdot10^{-3}"},{"tipo":"numero","espr":"3.476e6/3.844e8*180/pi","vale":"0.518","dove":"esempio","appare":"0,518"}]};
STRUM["elettronvolt"] = {"nome":"Elettronvolt","riga":"L'energia che un elettrone acquista attraversando una differenza di potenziale di un volt: $1\\ \\mathrm{eV}=1{,}602\\cdot10^{-19}$ J; divisa per $c^{2}$ è una massa, $1\\ \\mathrm{eV}/c^{2}=1{,}783\\cdot10^{-36}$ kg.","serve":"A leggere senza conversioni le tabelle in cui la fisica delle particelle e l'astrofisica scrivono le masse a riposo come energie — l'elettrone 0,511 MeV, il protone 938 MeV, il bosone di Higgs 125 GeV. La scelta non è una bizzarria di notazione: in un processo la quantità che si conserva è l'energia, e scrivere la massa già in energia dice a colpo d'occhio quali reazioni sono possibili e quante ne resta per l'energia cinetica o per i fotoni. L'elettronvolt ha anche un secondo mestiere, e in astrofisica è il più usato dei due: convertito in temperatura tramite $k_BT$ dà la scala termica a cui un processo di quella energia diventa frequente, e questo è ciò che permette di dire a che punto della storia dell'universo o a che profondità di una stella un certo processo si accende.","esempio":"Dalla massa del protone espressa come energia, $938{,}3$ MeV, si ricavano i chilogrammi in un passaggio: $m_p=938{,}3\\cdot10^{6}\\cdot1{,}783\\cdot10^{-36}=1{,}673\\cdot10^{-27}$ kg, che è il valore stampato in calce al foglio d'esame. Sul versante termico, $T=\\dfrac{1{,}602\\cdot10^{-19}}{1{,}381\\cdot10^{-23}}=11600$ K: un'energia di un elettronvolt corrisponde a poco più di undicimila kelvin, e siccome ionizzare l'idrogeno costa 13,6 eV si capisce subito perché serva una fotosfera da qualche decina di migliaia di kelvin per trovarlo ionizzato.","pieno":{"file":"as-01-la-scala-del-cosmo.html","tappa":"05","come":"le masse delle particelle elementari scritte come energie, con la conversione in chilogrammi e la gerarchia delle masse, nel movimento sulla scala del cosmo"},"controllo":[{"tipo":"numero","espr":"1.602177e-19/(2.99792458e8)**2*1e36","vale":"1.783","dove":"riga","appare":"1,783\\cdot10^{-36}"},{"tipo":"numero","espr":"938.3e6*1.783e-36*1e27","vale":"1.673","dove":"esempio","appare":"1,673\\cdot10^{-27}"},{"tipo":"numero","espr":"1.602e-19/1.381e-23","vale":"11600","dove":"esempio","appare":"11600"}]};

function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';
  return h;
}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

{ num:'00', title:'Perché questo movimento, e perché non è un capitolo', meta:'il dizionario prima del vocabolario · si legge una volta e ci si torna · dodici prove su sessanta lo toccano e nessuna lo chiede',
  blocchi:[
  {t:'prosa', title:'Un dizionario, non un capitolo sulla struttura del cosmo', tag:'architettura', html:R`
  <p>La prima parte del programma di de Bernardis si apre con due voci che sembrano un capitolo di divulgazione e non lo sono: <i>«Spazio e tempo, dimensioni: la gerarchia di strutture del cosmo»</i> e <i>«Particelle e forze»</i>. Letto come capitolo, un argomento così si scrive in tre pagine di aggettivi e non lascia niente. Letto per quello che è — <b>l&rsquo;insieme delle unità e dei fattori di conversione in cui tutto il resto del corso verrà scritto</b> — diventa il movimento più usato dei diciannove, e l&rsquo;unico che si riapre ogni volta.</p>
  <p>La misura lo dice senza ambiguità. Sulle sessanta prove della banca dati, <b>dodici toccano questo movimento, e la densità di menzioni è bassa: 1,8</b>. Non significa che conti poco: significa l&rsquo;esatto contrario di quello che si crede leggendo un numero basso. Parsec, anno luce, unità astronomica, massa solare e magnitudini compaiono in <i>quasi ogni</i> problema d&rsquo;esame — ma sempre <b>come dati</b>, mai come domanda. Nessuna prova chiede «che cos&rsquo;è un parsec»; una decina presuppone che chi legge sappia trasformare una parallasse in metri senza pensarci, perché il conto vero comincia dopo.</p>
  <p>Da qui la forma di questo movimento, e vale la pena dichiararla perché è diversa da quella di tutti gli altri diciotto: <b>ogni fattore di conversione viene derivato una volta e per sempre</b>, con il conto in chiaro, invece di essere copiato da una tabella. Un fattore copiato si sbaglia a memoria e non si sa ricostruire; un fattore derivato si ricostruisce in due righe anche quando la memoria ha perso la cifra. E siccome <span class="str" data-str="ordini-di-grandezza">ragionare per ordini di grandezza</span> in astrofisica non è una comodità ma il modo normale di procedere, la prima cosa da far diventare automatica è proprio questa.</p>
  <p><b>C&rsquo;è una ragione d&rsquo;esame in più, e cambia tutto.</b> L&rsquo;esame di Astrofisica è <b>solo orale, tre domande</b> — una a piacere, una sugli esercizi svolti a lezione, una puramente teorica — e gli esoneri scritti sono stati tolti. All&rsquo;orale <b>non c&rsquo;è il foglio dei «dati potenzialmente utili»</b> che le prove scritte portavano in calce. Questo movimento quindi non può limitarsi a saper usare i numeri: deve lasciarne in testa un piccolo nucleo, ed è per questo che chiude con otto voci e non con una tabella di cinquanta.</p>`},
  {t:'prosa', title:'Cosa saprai fare, uscendo di qui', tag:'performance attesa', html:R`
  <ul>
  <li>Collocare qualunque oggetto celeste sulla <b>scala delle distanze</b> alla potenza di dieci giusta, e dire in quanto tempo la luce lo attraversa.</li>
  <li><b>Derivare il parsec dalla parallasse</b> annua, non ricordarlo: è l&rsquo;unico passaggio di questo movimento che va saputo pronunciare a voce, e si fa in quattro mosse dichiarate.</li>
  <li>Convertire in tutte le direzioni fra <b>unità astronomica, anno luce e parsec</b>, e fra i loro multipli (kpc, Mpc, Gpc), sapendo da dove viene ciascun fattore.</li>
  <li>Trasformare un <b>angolo misurato</b> in una lunghezza e viceversa, e dire quanto costa l&rsquo;approssimazione di angolo piccolo quando qualcuno chiede se è lecita.</li>
  <li>Leggere una massa scritta <b>come energia</b> (MeV, GeV) e riportarla in chilogrammi, e sapere a che temperatura corrisponde un elettronvolt.</li>
  <li>Dire <b>quale forza tiene insieme che cosa</b> a ciascuna scala, con il rapporto numerico fra gravità ed elettrostatica in mano invece che a parole.</li>
  <li>Fare una <b>stima d&rsquo;ordine di grandezza fino in fondo</b>: pesare il Sole con la terza legge di Keplero, ricavarne la densità media, stimare la distanza tipica fra due stelle del disco galattico.</li>
  <li>Rispondere alla domanda d&rsquo;esame <i>«perché le galassie non si vedono a occhio nudo?»</i> con un conto, e scoprire che la risposta ingenua è sbagliata.</li>
  </ul>`},
  {t:'prosa', title:'Il patto sulle unità, e perché le due fonti del corso non parlano la stessa lingua', tag:'grammatica', html:R`
  <p>Tre convenzioni, da fissare adesso perché le fonti non concordano e la differenza si paga in fattori di mille.</p>
  <ul>
  <li><b>Si scrive in SI</b>, cioè metri, chilogrammi, secondi, watt. È la scelta di de Bernardis nelle slide del corso ed è quella del foglio dati delle prove scritte, dove si legge <i>«1 parsec = 3.086 x 10<sup>16</sup> m»</i>. <b>Masani invece scrive tutto in CGS</b> — centimetri, grammi, erg — e lo stesso parsec gli diventa $3{,}087\cdot10^{18}$ cm. Non è un disaccordo di fisica: è lo stesso numero spostato di due potenze di dieci, e l&rsquo;unico modo di non sbagliarlo è <b>non convertire mai a memoria</b> ma riscrivere l&rsquo;esponente. Nel resto del movimento, quando una formula viene da Masani, i suoi numeri sono riportati in CGS come li scrive lui <i>e</i> in SI subito accanto.</li>
  <li><b>Le energie si scrivono in joule, le masse delle particelle in elettronvolt.</b> È un&rsquo;incoerenza apparente che tutta l&rsquo;astrofisica pratica, e ha una ragione precisa che si vede nella tappa 05: la massa di una particella interessa quasi sempre come <i>energia disponibile in una reazione</i>, non come inerzia.</li>
  <li><b>La virgola è decimale</b> e il punto non si usa. Le slide di de Bernardis, scritte in inglese nei numeri, usano il punto: dove un valore è citato dalla diapositiva, qui è riscritto con la virgola, e la cifra è la stessa.</li>
  </ul>
  <p>Un&rsquo;ultima avvertenza, che è il filo di tutto il movimento. Nelle prossime tappe compariranno <b>tre disaccordi numerici veri</b> fra le fonti del corso — non convenzioni diverse, cifre diverse per la stessa quantità. Sono raccolti e discussi nella tappa 04, e non vengono nascosti scegliendo in silenzio il valore giusto: due di quei tre stanno nelle slide che Giuseppe sta ascoltando a lezione, e un errore che si incontra a lezione senza sapere che è un errore si impara come se fosse vero.</p>`}
]},

/* ---------------- 01 · LA GERARCHIA DELLE STRUTTURE ---------------- */
{ num:'01', title:'La gerarchia delle strutture, letta come scala di ordini di grandezza', meta:'trentasei potenze di dieci · la tabella del docente · il tempo di luce come secondo asse · tre regole per stimare',
  blocchi:[
  {t:'prosa', title:'Trentasei potenze di dieci, e perché nessuna intuizione le copre', tag:'first principles', html:R`
  <p>La prima lezione di de Bernardis apre con una tabella e con una frase che la spiega: le distanze dell&rsquo;astrofisica <i>«sono distanze molto grandi rispetto agli standard terrestri, quindi il metro, l&rsquo;unità di misura corretta nel Sistema Internazionale, non è molto pratico»</i>. La tabella è questa — i valori sono i suoi, diapositiva 5 — e vale la pena guardarla prima di commentarla.</p>
  <table class="tab">
  <thead><tr><th>oggetto</th><th>dimensione (m)</th><th>in anni luce</th><th>tempo di luce</th></tr></thead>
  <tbody>
  <tr><td>diametro della Terra</td><td>$1{,}275\cdot10^{7}$</td><td>$1{,}38\cdot10^{-9}$</td><td>$0{,}0425$ s</td></tr>
  <tr><td>diametro del Sole</td><td>$1{,}392\cdot10^{9}$</td><td>$1{,}47\cdot10^{-7}$</td><td>4,6 s</td></tr>
  <tr><td>semiasse dell&rsquo;orbita terrestre (1 UA)</td><td>$1{,}496\cdot10^{11}$</td><td>$1{,}58\cdot10^{-5}$</td><td>8,3 min</td></tr>
  <tr><td>semiasse dell&rsquo;orbita di Plutone</td><td>$5{,}914\cdot10^{12}$</td><td>$6{,}25\cdot10^{-4}$</td><td>5,5 h</td></tr>
  <tr><td>distanza della stella più vicina</td><td>$3{,}97\cdot10^{16}$</td><td>4,2</td><td>4,2 anni</td></tr>
  <tr><td>distanza del Sole dal centro galattico</td><td>$2{,}4\cdot10^{20}$</td><td>25 000</td><td>25 kyr</td></tr>
  <tr><td>diametro della Via Lattea</td><td>$8\cdot10^{20}$</td><td>80 000</td><td>85 kyr</td></tr>
  <tr><td>distanza tipica fra due galassie</td><td>$3\cdot10^{22}$</td><td>$3{,}3\cdot10^{6}$</td><td>3,2 Myr</td></tr>
  <tr><td>diametro di un ammasso di galassie</td><td>$10^{24}$</td><td>$10^{8}$</td><td>100 Myr</td></tr>
  <tr><td>raggio dell&rsquo;universo osservabile</td><td>$1{,}3\cdot10^{26}$</td><td>$1{,}4\cdot10^{10}$</td><td>13,7 Gyr</td></tr>
  </tbody>
  </table>
  <p><b>La prima cosa da notare non è un numero: è una struttura.</b> Fra una riga e la successiva il salto non è mai di poco — è un fattore cento, mille, diecimila — e <b>nessun salto è regolare</b>. Lo spazio non è popolato uniformemente: è fatto di oggetti compatti separati da vuoti enormemente più grandi di loro. Il Sole ha un diametro di $1{,}4\cdot10^{9}$ m e la stella più vicina sta a $4\cdot10^{16}$ m: il rapporto è circa trenta milioni. Se il Sole fosse una biglia da un centimetro, la stella più vicina sarebbe un&rsquo;altra biglia a trecento chilometri. <b>Questa è la sola ragione per cui il cielo notturno è nero</b> e per cui le stelle non si urtano mai: non perché siano poche, ma perché il rapporto fra la loro dimensione e la loro distanza è quello.</p>
  <p>E se si guarda l&rsquo;intervallo coperto dalla fisica — non solo dall&rsquo;astrofisica — il conto è questo. In basso c&rsquo;è il raggio di Bohr, $5{,}29\cdot10^{-11}$ m, cioè la dimensione tipica di un atomo; in alto il raggio dell&rsquo;universo osservabile. Il rapporto vale
  $$\frac{1{,}3\cdot10^{26}}{5{,}29\cdot10^{-11}}=2{,}46\cdot10^{36},$$
  cioè <b>$36{,}4$ ordini di grandezza</b>. Ed è il punto dove ogni intuizione va lasciata alla porta: non esiste nessuna immagine mentale che tenga insieme i due estremi, e <b>l&rsquo;unico strumento che li tiene insieme è il logaritmo</b>. Da qui in avanti, in questo corso, «grande» e «piccolo» non vogliono dire niente se non si dice <i>rispetto a cosa</i>, e la risposta si dà in potenze di dieci.</p>`},
  {t:'prosa', title:'Il secondo asse della stessa tabella: il tempo di luce', tag:'la conversione che fa più lavoro', html:R`
  <p>Le ultime due colonne della tabella non sono un abbellimento: sono <b>la stessa tabella letta in un&rsquo;altra unità</b>, e l&rsquo;unità è il tempo. La conversione è la più banale che esista — si divide per $c$ — ed è anche la più ricca di conseguenze fisiche di tutto il movimento:
  $$t=\frac{L}{c},\qquad c=2{,}998\cdot10^{8}\ \mathrm{m/s}.$$
  Qualche riga svolta, perché il conto si veda e non si creda. Per il diametro della Terra,
  $$\frac{1{,}275\cdot10^{7}}{2{,}998\cdot10^{8}}=0{,}0425\ \mathrm{s},$$
  cioè quarantadue millesimi di secondo: un impulso radio fa il giro del pianeta in un battito di ciglia, ed è la ragione per cui le telecomunicazioni terrestri si possono trattare come istantanee. Per l&rsquo;unità astronomica,
  $$\frac{1{,}496\cdot10^{11}}{2{,}998\cdot10^{8}\cdot60}=8{,}32\ \text{minuti},$$
  e questo numero è già fisica e non geometria: <b>il Sole che si vede è il Sole di otto minuti fa</b>, e se si spegnesse adesso ce ne accorgeremmo allora. Per il diametro della Galassia,
  $$\frac{8\cdot10^{20}}{2{,}998\cdot10^{8}\cdot365{,}25\cdot86400}=8{,}46\cdot10^{4}\ \text{anni},$$
  ottantacinquemila anni: la luce che arriva dall&rsquo;altro bordo del disco è partita quando sulla Terra non c&rsquo;era ancora l&rsquo;agricoltura. E per il raggio dell&rsquo;universo osservabile,
  $$\frac{1{,}3\cdot10^{26}}{2{,}998\cdot10^{8}\cdot365{,}25\cdot86400\cdot10^{9}}=13{,}7\ \text{miliardi di anni}.$$</p>
  <p><b>Perché questa colonna cambia il modo di leggere la prima.</b> In astrofisica <i>guardare lontano è guardare indietro</i>, e non in senso poetico: non esiste nessun modo di osservare un oggetto distante <i>come è adesso</i>. La distanza è un&rsquo;informazione sul passato, e la tabella dice di quanto. Due conseguenze che torneranno letteralmente in tutto il corso: il raggio dell&rsquo;universo osservabile e l&rsquo;età dell&rsquo;universo sono <b>lo stesso numero scritto in due unità</b> — non due fatti indipendenti che si somigliano — e qualunque oggetto a più di 13,7 miliardi di anni luce <b>non è distante: non è osservabile</b>, perché la sua luce non ha ancora avuto il tempo di arrivare.</p>
  <p>Una nota di prudenza sull&rsquo;ultima riga, perché è l&rsquo;unica della tabella che non è una conversione ma un risultato di modello. Che l&rsquo;orizzonte stia a $1{,}3\cdot10^{26}$ m, cioè circa $4{,}2$ Gpc, dipende dall&rsquo;espansione dello spazio durante il viaggio del fotone: il prodotto ingenuo $c\times t_{\text{universo}}$ dà un valore vicino per compensazione, non per diritto. Qui serve soltanto come <b>ordine di grandezza del più grande numero del corso</b>; la definizione pulita di distanza in un universo in espansione è un&rsquo;altra cosa e richiede la metrica.</p>`},
  {t:'plot', title:'La scala delle distanze, e il tempo che la luce impiega ad attraversarla',
   intro:'Sull’asse orizzontale il logaritmo in base dieci della dimensione in metri, su quello verticale il logaritmo del tempo di luce in secondi. La retta è la relazione $t=L/c$: una sola riga, perché la conversione è una divisione. I punti sono gli oggetti della tabella.',
   plots:[
    {kind:'func2d', f:'x-8.4768', xr:[-11,27], yr:[-20,19], height:380, equal:false,
     title:'x = log10(dimensione / m)   y = log10(tempo di luce / s)',
     marks:[{x:-10.28, y:-18.75, label:'raggio di Bohr', col:'#b98cff'},
            {x:7.11, y:-1.37, label:'Terra', col:'#5eead4', up:true},
            {x:9.14, y:0.67, label:'Sole', col:'#5eead4'},
            {x:11.17, y:2.70, label:'1 UA', col:'#d8a13a', up:true},
            {x:16.49, y:8.01, label:'1 pc', col:'#d8a13a'},
            {x:20.90, y:12.43, label:'Via Lattea', col:'#4c8dff', up:true},
            {x:24.0, y:15.52, label:'ammasso', col:'#4c8dff'},
            {x:26.11, y:17.64, label:'orizzonte', col:'#ff9b6b', left:true, up:true}],
     segs:[{x1:16.49, y1:-20, x2:16.49, y2:8.01, col:'#d8a13a', dash:true, width:1.4}]}
   ],
   leggi:R`<p><b>Che cosa guardare per primo: la retta è una retta, e questo è il contenuto.</b> In un diagramma logaritmico una proporzionalità diretta diventa una retta di pendenza uno, e il suo spostamento verticale è $-\log_{10}c=-8{,}48$. Tutti gli oggetti dell&rsquo;universo stanno <i>su</i> quella retta, senza eccezione, perché la conversione distanza-tempo non dipende da che cosa sia l&rsquo;oggetto. Non c&rsquo;è niente da ricordare della tabella precedente: c&rsquo;è una retta, e la posizione di ciascun punto lungo di essa.</p>
   <p><b>Che cosa impararne, e non è ovvio.</b> I punti non sono distribuiti uniformemente lungo la retta: si addensano in due zone — quella atomica in basso a sinistra e quella astronomica a destra — con <i>un vuoto in mezzo</i> che va da circa $10^{-10}$ a $10^{7}$ metri e che contiene tutta la fisica di laboratorio, cioè tutto ciò che si può toccare. Diciassette ordini di grandezza di mondo quotidiano, su trentasei: <b>l&rsquo;esperienza diretta occupa meno della metà della scala</b>, ed è schiacciata al centro.</p>
   <p><b>La linea tratteggiata verticale segna il parsec</b>, e la sua posizione è il motivo per cui esiste: sta esattamente dove finiscono le distanze del sistema solare e cominciano quelle stellari, cioè è l&rsquo;unità tagliata su misura per la zona in cui si lavora. L&rsquo;unità astronomica è quattro ordini di grandezza più in basso e serve ai pianeti; il kiloparsec e il megaparsec sono tre e sei ordini più in alto e servono alla Galassia e alle galassie. <b>Scegliere l&rsquo;unità giusta vuol dire lavorare con numeri fra uno e mille invece che con esponenti</b>, e un conto fatto con numeri di quell&rsquo;ordine si controlla a mente, mentre uno fatto con $10^{22}$ no.</p>
   <p><b>L&rsquo;errore che la figura smaschera.</b> Un punto <i>fuori</i> dalla retta sarebbe un oggetto la cui luce impiega ad attraversarlo un tempo diverso da dimensione diviso $c$: impossibile. Quindi, quando in un esercizio una distanza e un tempo di luce non si corrispondono, non c&rsquo;è niente da discutere sulla fisica — c&rsquo;è un esponente sbagliato, e si trova confrontando con questa retta.</p>`},
  {t:'reveal', title:'Le tre regole dello stimare, e quella che smaschera più errori', tag:'il mestiere', steps:[
   {label:'Prima: una cifra significativa, e basta', body:R`<p>I dati osservativi dell&rsquo;astrofisica sono noti al dieci o al venti per cento: la massa di una galassia, la densità del mezzo interstellare, la distanza di un ammasso. <b>Portare tre cifre in un conto che parte da una sola è un&rsquo;illusione di precisione</b>, e costa tempo. La forma giusta di un conto d&rsquo;ordine di grandezza è $\sim10^{n}$, con il moltiplicatore tenuto solo quando serve a decidere qualcosa.</p>
   <p>Il corollario pratico: <b>gli esponenti si sommano e si sottraggono a mente</b>, i moltiplicatori si tengono fra parentesi. $\frac{3\cdot10^{22}}{6\cdot10^{8}}$ si legge «tre su sei fa un mezzo, ventidue meno otto fa quattordici», cioè $5\cdot10^{13}$, e si è fatto in testa.</p>`},
   {label:'Seconda: il controllo è sull’unità, non sul numero', body:R`<p>Questa è la regola che paga più di tutte le altre insieme. <b>Un conto che dovrebbe dare una densità e dà dei chilogrammi è sbagliato nell&rsquo;impostazione</b>, e nessun affinamento dell&rsquo;aritmetica lo salverà: non si è sbagliata una cifra, si è sbagliata una divisione. Verificare l&rsquo;unità del risultato <i>prima</i> di guardare il numero intercetta gli errori che contano, perché sono quelli strutturali.</p>
   <p>Funziona anche al rovescio, ed è il modo di ricostruire una formula dimenticata: se il risultato deve essere un tempo e in mano si hanno una lunghezza e una velocità, l&rsquo;unica combinazione possibile è $L/v$. Una gran parte delle formule dell&rsquo;astrofisica si rimette in piedi così, a meno di un fattore numerico puro.</p>`},
   {label:'Terza: nessun numero dice niente senza un termine di confronto', body:R`<p>$1410\ \mathrm{kg/m^3}$ non significa nulla da solo. «Una volta e mezza l&rsquo;acqua» significa tutto, perché colloca immediatamente la densità media del Sole fra quella di un gas e quella di un sasso — e dice che <b>una stella non è un sasso grande</b>. I termini di confronto da tenere pronti sono pochi: l&rsquo;<b>acqua</b> per le densità ($10^{3}\ \mathrm{kg/m^3}$), il <b>Sole</b> per masse e luminosità, il <b>parsec</b> per le distanze stellari, il <b>metro quadro</b> e il <b>watt</b> per i flussi.</p>
   <p>La forma canonica di una risposta d&rsquo;astrofisica è dunque un rapporto, non un valore assoluto: <i>«dieci volte più denso dell&rsquo;acqua»</i>, <i>«due ordini di grandezza sotto la luminosità solare»</i>, <i>«un decimo di parsec»</i>. Chi risponde così ha capito la scala; chi risponde con quindici cifre ha usato la calcolatrice.</p>`}
  ]},
  {t:'prosa', title:'Dove serve il parsec, e perché la tabella non lo usa ancora', tag:'il filo', html:R`
  <p>La tabella di de Bernardis è scritta in metri e in anni luce, e il parsec non vi compare. Non è una dimenticanza: le slide lo introducono nella diapositiva successiva, e l&rsquo;ordine ha un senso. L&rsquo;anno luce si capisce senza sapere niente — è una distanza espressa col tempo che la luce impiega a percorrerla — mentre il parsec <b>non si capisce affatto finché non si sa come si misura una distanza stellare</b>. È un&rsquo;unità definita a partire dallo <i>strumento</i>, non dall&rsquo;oggetto, e questa è la sua forza: <span class="str" data-str="parsec-e-parallasse">la distanza in parsec è l&rsquo;inverso della parallasse in secondi d&rsquo;arco</span>, quindi la quantità misurata diventa la distanza senza nessun conto intermedio.</p>
  <p>Nella seconda parte del corso le distanze delle galassie saranno date in megaparsec, le dimensioni della Via Lattea in kiloparsec, lo spessore del disco in parsec — e mai in metri. <b>Vale allora la pena capire quell&rsquo;unità una volta sola e fino in fondo</b>, invece di trattarla come un fattore $3{,}086\cdot10^{16}$ da ricopiare. È il lavoro della tappa seguente, e la derivazione sta in quattro righe di geometria elementare.</p>`}
]},

/* ---------------- 02 · IL PARSEC DALLA PARALLASSE ---------------- */
{ num:'02', title:'Il parsec, derivato dalla parallasse annua', meta:'un’oscillazione, non un triangolo · il secondo d’arco in radianti · la definizione e il conto · perché l’inverso non è una convenzione',
  blocchi:[
  {t:'prosa', title:'Che cosa si misura davvero: un’oscillazione annuale, non un triangolo', tag:'dal dato alla geometria', html:R`
  <p>Il parsec si presenta sempre con un disegno di triangoli, e il disegno fa dimenticare che <b>nessuno misura un triangolo</b>. Il dato grezzo è un altro, e de Bernardis lo mette prima della definizione: <i>«se si eseguono misure molto accurate di posizione (astrometria), ci si accorge che il moto apparente di alcune stelle è la sovrapposizione di un moto rettilineo e di uno oscillatorio»</i>. Esempio suo: la stella di Barnard. Il moto oscillatorio ha <b>periodo di un anno</b>, e quel periodo è l&rsquo;unica firma che serve — un anno è il periodo della Terra, non della stella, quindi l&rsquo;oscillazione non è un fatto della stella ma del nostro punto di osservazione.</p>
  <p>Questo scioglie subito una confusione che costa punti all&rsquo;esame. Il moto <b>rettilineo</b> è il <i>moto proprio</i>: la stella si sposta davvero rispetto a noi, e quello spostamento cresce indefinitamente con gli anni. Il moto <b>oscillatorio</b> è la <i>parallasse annua</i>: è un moto apparente, torna ogni anno al punto di partenza, e la sua ampiezza non cresce. Per separarli basta osservare per qualche anno e togliere la retta; il residuo periodico è l&rsquo;informazione sulla distanza. <b>Si misura la distanza da ciò che si ripete, non da ciò che avanza.</b></p>
  <p>E qui c&rsquo;è il fattore due che si sbaglia sempre. Masani definisce: <i>«l&rsquo;angolo sotto cui dalla stella è visto il semidiametro dell&rsquo;orbita terrestre prende il nome di parallasse»</i>, e de Bernardis scrive la stessa cosa con una formula, <i>«la relazione tra angolo $p$ sotteso dal <b>raggio</b> dell&rsquo;orbita terrestre e distanza della stella dal Sole $d$»</i>. Le due fonti concordano, ed è bene saperlo perché la cosa <i>che si vede in cielo</i> è l&rsquo;escursione completa, da dicembre a giugno, che vale <b>$2p$</b>. La parallasse è la <b>semi</b>ampiezza dell&rsquo;oscillazione. Chi usa l&rsquo;ampiezza totale sbaglia la distanza di un fattore due, e il risultato resta plausibile — che è il tipo di errore peggiore.</p>`},
  {t:'prosa', title:'La geometria, e l’unica approssimazione che si fa', tag:'la derivazione', html:R`
  <p>Si mette il Sole nell&rsquo;origine, la stella a distanza $d$ lungo la linea di vista, e la Terra a distanza $R=1$ UA dal Sole in direzione perpendicolare a quella linea — cioè nella posizione dell&rsquo;orbita in cui lo spostamento apparente è massimo. Il triangolo Sole-Terra-stella è rettangolo nel Sole, e l&rsquo;angolo al vertice della stella è per definizione la parallasse $p$. La relazione esatta è dunque
  $$\tan p=\frac{R}{d}.$$
  <b>Fin qui non c&rsquo;è nessuna approssimazione</b>, e conviene scriverla così una volta per sapere dove entra quella che segue.</p>
  <p>Il passo successivo è l&rsquo;unico passo non esatto di tutta la derivazione, ed è <span class="str" data-str="angolo-piccolo">l&rsquo;approssimazione di angolo piccolo</span>: per $p\ll1$ radiante, $\tan p\simeq p$, quindi
  $$p\simeq\frac{R}{d}.$$
  <b>La domanda che va fatta adesso, e non dopo, è se sia lecita.</b> La parallasse più grande di tutto il cielo è quella della stella più vicina e vale meno di un secondo d&rsquo;arco, cioè meno di $5\cdot10^{-6}$ radianti; l&rsquo;errore relativo dello sviluppo è dell&rsquo;ordine di $p^2/3$, cioè $10^{-11}$. In altri termini: <i>l&rsquo;approssimazione di angolo piccolo, in questo problema, è esatta a undici cifre</i>. Non è un&rsquo;approssimazione di comodo da ricordare con disagio — è la constatazione che il regime in cui l&rsquo;astrometria lavora è, dal punto di vista geometrico, infinitamente lontano dal regime in cui la tangente si distingue dall&rsquo;angolo.</p>
  <p>Letta al rovescio, questa relazione dice una cosa che pesa su tutto il corso: <b>la distanza non si misura, si deduce da un angolo</b> — e dall&rsquo;unica lunghezza nota del sistema, il raggio dell&rsquo;orbita terrestre. L&rsquo;intera scala delle distanze cosmiche poggia alla base su quel singolo metro campione, e ogni gradino successivo (Cefeidi, supernove, Hubble) viene calibrato su questo. Se l&rsquo;unità astronomica fosse sbagliata del dieci per cento, sarebbero sbagliate del dieci per cento tutte le distanze dell&rsquo;universo.</p>`},
  {t:'plot', title:'La parallasse: la geometria, e quello che si vede in cielo',
   intro:'A sinistra il triangolo: il Sole nell’origine, l’orbita terrestre come cerchio di raggio $R=1$ UA, la stella a destra, e l’angolo $p$ al vertice della stella fra le due linee di vista. A destra la stessa cosa come la registra un telescopio: la posizione apparente della stella nel tempo.',
   plots:[
    {kind:'curve', x:'cos(t)', y:'sin(t)', tr:[0,6.2832], xr:[-1.7,7.6], yr:[-2.1,2.1], height:300,
     title:'vista dall-alto: Sole, orbita terrestre, stella (distanza compressa)',
