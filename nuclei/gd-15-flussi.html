idth:1.2,dash:[4,4]},{x1:1.321,y1:-0.5069,x2:1.2964,y2:-0.5217,col:'#ff6b6b',width:1.2,dash:[4,4]},{x1:1.2964,y1:-0.5217,x2:1.271,y2:-0.5353,col:'#ff6b6b',width:1.2,dash:[4,4]},{x1:1.271,y1:-0.5353,x2:1.2451,y2:-0.5477,col:'#ff6b6b',width:1.2,dash:[4,4]},{x1:1.6,y1:0,x2:1.6,y2:-0.42,col:'#4c8dff',width:3,arrow:true,label:'L_X Y',lx:1.65,ly:-0.5}]}
   ],
   leggi:R`<p>Il punto $p$ scorre lungo il cerchio, $\Phi_t(1,0)=(\cos t,\ \sin t)$, e lì il campo $Y$ vale ancora $\partial_x$: le frecce arancioni sono tutte uguali, perché $Y$ è costante. <b>In $\mathbb{R}^{2}$ la derivata direzionale ingenua di $Y$ lungo $X$ è dunque zero</b>: le componenti di $Y$ non cambiano. È il conto con cui Lee apre la sezione «Lie Derivatives» (formula 9.15, Fig. 9.12) — e su una varietà quel conto non si può nemmeno scrivere, perché $Y_{\Phi_t(p)}$ e $Y_p$ stanno in spazi tangenti diversi e non si sottraggono.</p>
   <p>La derivata di Lie non sottrae le frecce dove stanno: riporta $Y_{\Phi_t(p)}$ in $p$ con $d\Phi_{-t}$, che qui è la rotazione di $-t$. Il riportato è $R_{-t}\,e_1=(\cos t,\ -\sin t)$: <b>la freccia rossa ruota all&rsquo;indietro</b> mentre $t$ cresce, e la sua punta descrive l&rsquo;arco tratteggiato. La derivata in $t=0$ è il vettore tangente all&rsquo;arco nel suo punto iniziale, $(0,-1)$: dunque $\mathcal{L}_XY=-\partial_y$, la freccia blu. È la Fig. 9.13 di Lee, con i numeri.</p>
   <p>La formula in coordinate dà lo stesso: $[X,Y]^{j}=X(Y^{j})-Y(X^{j})$, e con $Y^{j}$ costanti resta $-\partial_xX^{j}=-(0,1)$, cioè $[X,Y]=-\partial_y$. <b>Il campo costante non è invariante per la rotazione</b> — ruotando il piano le frecce orizzontali smettono di esserlo — ed è quel difetto, non la variazione delle componenti, che la derivata di Lie misura. In $\mathbb{R}^{n}$ lo si scrive $\mathcal{L}_XY=D_XY-D_YX$: il primo termine è la derivata ingenua, qui nulla; il secondo è la correzione dovuta al flusso che deforma ciò che trasporta, qui $D_YX=\partial_x(-y,\,x)=(0,1)$.</p>
   <p>Le frecce rosse stanno tutte nello stesso spazio $T_{\mathbb{R}^2,p}$, e formano la curva su cui ragiona la Proposizione 9.41 di Lee (Fig. 9.14): la sua derivata in un istante qualunque è il riportato di $\mathcal{L}_XY$. Qui la parentesi non è nulla, la curva non è costante, e infatti la rotazione e la traslazione orizzontale non commutano. Generale: la derivata di Lie confronta i vettori riportandoli con il flusso, e vale la parentesi. Accidentale: che il flusso sia una rotazione rigida, così che il riporto si scrive con una matrice sola.</p>`},
  {t:'prosa', title:'Campi invarianti, e il teorema delle tre equivalenze', tag:'teorema', html:R`
  <p>Abate chiama un campo $Y$ <b>$X$-invariante</b> se il flusso di $X$ lo trascina in sé, $d(\Phi_t)_p(Y_p)=Y_{\Phi_t(p)}$ dove il flusso è definito (Definizione 3.3.6), e osserva che la clausola (v) del suo Teorema 3.3.5 dice proprio che <b>ogni campo è invariante sotto il proprio flusso</b>. Il Theorem 9.42 di Lee rende la nozione operativa: per due campi lisci sono equivalenti (a) $[X,Y]=0$; (b) $Y$ è invariante sotto il flusso di $X$; (c) $X$ è invariante sotto il flusso di $Y$.</p>
  <p>La strada da (a) a (b) è il cuore, ed è un argomento di derivata nulla. Si guarda la curva di vettori, tutti nello stesso spazio tangente $T_{M,p}$, che si ottiene riportando in $p$ il campo $Y$ preso lungo l'orbita: $t\mapsto d(\Phi_{-t})\big(Y_{\Phi_t(p)}\big)$. La Proposition 9.41 di Lee calcola la sua derivata in un istante qualsiasi $t_0$: è il trasportato all'indietro di $(\mathcal{L}_XY)$ preso nel punto $\Phi_{t_0}(p)$. Se la parentesi è nulla, la derivata è nulla in ogni istante, la curva è costante, e vale quanto all'istante zero, cioè $Y_p$. Riportando avanti si ottiene esattamente l'invarianza.</p>
  <p>Ne segue la caratterizzazione più utile (Lee 9.44): <b>$[X,Y]=0$ se e solo se i due flussi commutano</b>, cioè $\Phi^X_t\circ\Phi^Y_s=\Phi^Y_s\circ\Phi^X_t$. Per campi completi la frase è letterale. Per campi non completi Lee avverte che va presa con cura: può succedere che entrambe le composizioni siano definite in un punto e diano risultati diversi pur con parentesi nulla, perché i domini dei due flussi si incastrano male (il suo Problem 9-19 costruisce un esempio sul complementare di una semiretta). La definizione corretta chiede l'uguaglianza su ogni rettangolo di tempi in cui una delle due composizioni è definita.</p>`},
  {t:'prosa', title:'Il quadratino, calcolato fino in fondo', tag:'esame', html:R`
  <p>Il difetto di chiusura del quadratino — muoversi lungo $X$, poi $Y$, poi indietro lungo $X$, poi indietro lungo $Y$ — è la manifestazione finita di $[X,Y]$, e c'è un esempio in cui lo si calcola senza sviluppi: $X=\partial_x$ e $Y=x\,\partial_y$ su $\mathbb{R}^2$ (Example 8.24 di Lee). Il flusso di $X$ manda $(x,y)$ in $(x+t,\,y)$, quello di $Y$ lo manda in $(x,\ y+sx)$: il primo trasla, il secondo spinge verticalmente di una quantità proporzionale all'ascissa.</p>
  <p>Si parte da $(x,y)$. Lungo $X$ per un tempo $t$ si arriva a $(x+t,y)$; lungo $Y$ per un tempo $s$ a $\big(x+t,\ y+s(x+t)\big)$; indietro lungo $X$ a $\big(x,\ y+s(x+t)\big)$; indietro lungo $Y$, che ora sottrae $sx$, al punto
  $$\big(x,\ y+s(x+t)-sx\big)=(x,\ y+st).$$
  <b>Il quadratino non si chiude, e lo spostamento è $st$ nella direzione $\partial_y$.</b> Ed è proprio la parentesi: per la formula in coordinate la componente lungo $\partial_y$ di $[X,Y]$ è $X(x)-Y(0)=1$, quindi $[X,Y]=\partial_y$. In generale lo spostamento è $st\,[X,Y]$ più termini di ordine tre nei tempi; qui i termini superiori sono nulli perché i campi sono polinomiali di grado basso, ed è per questo che l'esempio è il migliore per fissare l'idea.</p>
  <div class="note"><b>Perché questo importa oltre il corso.</b> In meccanica quantistica due osservabili sono <i>compatibili</i> — misurabili simultaneamente con precisione arbitraria — esattamente quando i loro operatori commutano, e gli operatori sono generatori di flussi nello spazio degli stati. <b>La frase «non commutano, quindi l'ordine della misura conta» e la frase «il quadratino non si chiude» sono la stessa frase</b>, scritte in due linguaggi. In meccanica analitica, la stessa struttura con le parentesi di Poisson dice quando due quantità conservate generano simmetrie indipendenti.</div>`},
  {t:'plot', title:'Due flussi che commutano, e due che non commutano',
   intro:R`Il percorso «lungo $X$ per $t$, poi lungo $Y$ per $t$» confrontato con l'ordine inverso, per due coppie di campi: le traslazioni (che commutano) e una traslazione con una rotazione (che non commutano).`,
   plots:[
    {kind:'phase', fx:'1', fy:'0', xr:[-2,2], yr:[-2,2], n:11, height:300,
     seeds:[[-1.5,0.8],[-1.5,0],[-1.5,-0.8]],
     title:'campo di traslazione: flusso rigido, commuta con le altre traslazioni'},
    {kind:'phase', fx:'-y', fy:'x', xr:[-2,2], yr:[-2,2], n:11, height:300,
     seeds:[[1.2,0],[0.6,0],[1.7,0]],
     title:'campo di rotazione: NON commuta con la traslazione'}
   ],
   leggi:R`<b>A sinistra</b> il flusso della traslazione: tutte le frecce sono uguali, e comporre due traslazioni in ordine diverso dà lo stesso risultato — la parentesi di due campi costanti è nulla, e infatti si possono usare come coordinate cartesiane.<br><br>
   <b>A destra</b> il flusso della rotazione. <b>Traslare e poi ruotare non è come ruotare e poi traslare</b>: la traslazione sposta il centro di rotazione, e il difetto è proprio $[X,Y]$. Il conto lo conferma — la parentesi fra il campo costante e quello rotazionale è un nuovo campo costante, perpendicolare al primo.<br><br>
   <b>La lettura che vale la pena tenere</b>: guardando i due ritratti si capisce senza calcolare quali campi commuteranno. Se le frecce di un campo sono <i>invarianti</i> lungo il flusso dell'altro, i due commutano: è la clausola (b) del teorema delle tre equivalenze, vista con gli occhi.`}
]},

/* ---------------- 04b · LA FORMA CANONICA ---------------- */
{ num:'09', title:'Raddrizzare un campo: la forma canonica vicino a un punto regolare', meta:'ogni campo che non si annulla e localmente d/ds · la dimostrazione col flusso · campi che commutano e coordinate · il foglio 4 e la prova del 14/09',
  blocchi:[
  {t:'prosa', title:'Il teorema, e perche dice che lontano dagli zeri tutti i campi sono uguali', tag:'teorema', html:R`
  <p>Un punto $p$ si dice <b>regolare</b> per il campo $X$ se $X_p\neq0$, singolare altrimenti. Il Theorem 9.22 di Lee dice che <b>vicino a un punto regolare esistono coordinate $(s^1,\dots,s^n)$ in cui $X=\partial/\partial s^1$</b>. È un teorema sorprendente per quanto è forte: nessuna informazione locale sopravvive, e tutti i campi che non si annullano sono, localmente, la stessa traslazione. Ciò che distingue un campo da un altro sta tutto negli zeri — dove si linearizza e si guarda la matrice, come nei campi lineari calcolati prima — e nel comportamento globale delle orbite.</p>
  <p><b>Dimostrazione.</b> Si prendono coordinate $(x^i)$ centrate in $p$ in cui $X_p=\partial/\partial x^1|_p$, cosa che un cambio lineare di coordinate permette sempre. L'iperpiano $S=\{x^1=0\}$ passa per $p$ ed è trasverso al campo, perché il campo in $p$ punta fuori da esso. Si definisce
  $$\psi(t,u)=\Phi_t(0,u),\qquad u=(u^2,\dots,u^n),$$
  cioè si fa partire un punto da $S$ e lo si lascia fluire per un tempo $t$. Nell'origine il differenziale di $\psi$ manda $\partial_t$ in $X_p=\partial_{x^1}$ e lascia fissi i $\partial_{u^j}$, quindi è invertibile; per il teorema della funzione inversa $\psi$ è un diffeomorfismo vicino all'origine, e la sua inversa è la carta cercata. In quella carta $X=\partial/\partial s^1$ perché, per la legge di gruppo, passare da $\psi(t,u)$ a $\psi(t+h,u)$ è applicare $\Phi_h$: muoversi di $h$ nella prima coordinata è esattamente fluire di $h$. <b>Il flusso fabbrica la coordinata, e il campo diventa la derivata rispetto al tempo di volo.</b></p>
  <p>La costruzione è la stessa del Flowout Theorem di Lee (Theorem 9.20) e dell'Esercizio 3.28 di Abate — un'ipersuperficie trasversa fatta scorrere lungo il campo riempie un intorno — ed è per questo che il dato di un'equazione del primo ordine si assegna proprio su un'ipersuperficie trasversa.</p>`},
  {t:'prosa', title:'L’esempio di Lee: la rotazione diventa d/dtheta', tag:'esempio', html:R`
  <p>Il campo di rotazione $W=x\,\partial_y-y\,\partial_x$ è regolare nel punto $(1,0)$ (Example 9.23 di Lee). L'ipersuperficie trasversa è il semiasse positivo delle $x$, e la mappa della dimostrazione fa ruotare il punto $(s,0)$ per un tempo $t$:
  $$\psi(t,s)=\Phi_t(s,0)=(s\cos t,\ s\sin t).$$
  Sono le <b>coordinate polari</b>, con $t$ al posto dell'angolo e $s$ al posto del raggio. La matrice jacobiana ha colonne $(-s\sin t,\ s\cos t)$ e $(\cos t,\ \sin t)$, e il suo determinante vale $\det d\psi=-s$, diverso da zero per $s>0$: la carta funziona su tutto il semipiano tolta l'origine, e in essa $W=\partial/\partial\vartheta$. <b>Ciò che si sapeva da sempre sulle coordinate polari è il teorema della forma canonica applicato alla rotazione</b>, e la singolarità delle coordinate polari nell'origine è esattamente lo zero del campo.</p>`},
  {t:'prosa', title:'Il debito pagato: perché la derivata di Lie è la parentesi', tag:'teorema', html:R`
  <p>La forma canonica chiude il conto lasciato aperto nella tappa precedente, ed è la dimostrazione del Theorem 9.38 di Lee. Si divide $M$ in tre parti secondo il campo $X$: i <b>punti regolari</b>, dove $X\neq0$ — un aperto, la cui chiusura è il supporto di $X$ —; i punti del supporto che <b>non</b> sono regolari; e il <b>complementare del supporto</b>.</p>
  <p><b>Nei punti regolari</b> si prendono le coordinate della forma canonica, in cui $X=\partial/\partial u^{1}$. Il flusso è allora la traslazione $\Phi_t(u)=(u^{1}+t,\,u^{2},\dots,u^{n})$, la cui jacobiana è l&rsquo;identità in ogni punto: riportare indietro un vettore non ne cambia le componenti. Quindi
  $$d\Phi_{-t}\big(Y_{\Phi_t(u)}\big)=Y^{j}(u^{1}+t,u^{2},\dots,u^{n})\left.\frac{\partial}{\partial u^{j}}\right|_u,\qquad(\mathcal{L}_XY)_u=\frac{\partial Y^{j}}{\partial u^{1}}(u)\left.\frac{\partial}{\partial u^{j}}\right|_u .$$
  La formula in coordinate della parentesi, con le componenti di $X$ costanti, dà $[X,Y]^{j}=X(Y^{j})-Y(X^{j})=\partial Y^{j}/\partial u^{1}$: lo stesso. <b>In coordinate dove $X$ è una traslazione, la derivata di Lie è la derivata ingenua delle componenti</b> — è l&rsquo;Esercizio 9.37 di Lee — e tutta la difficoltà del teorema è stata spostata dentro la forma canonica.</p>
  <p><b>Fuori dal supporto</b> $X$ è nullo in un intorno di $p$, il flusso lì è l&rsquo;identità, il riportato $d\Phi_{-t}(Y_{\Phi_t(p)})=Y_p$ non dipende da $t$ e la derivata è zero; anche $[X,Y]_p=0$, perché la parentesi in $p$ dipende solo dai campi vicino a $p$. <b>Nei punti del supporto che non sono regolari</b> si usa la continuità: entrambi i membri sono campi lisci — per la derivata di Lie lo verifica il Lemma 9.36 di Lee, scrivendo il riportato in coordinate come funzione liscia di $(t,x)$ — e coincidono sull&rsquo;aperto dei punti regolari, quindi sulla sua chiusura. $\blacksquare$</p>
  <p><b>La prova sull&rsquo;esempio della figura.</b> Nelle coordinate polari la rotazione è $\partial_\vartheta$ — è l&rsquo;esempio di Lee appena visto —, e il campo costante $\partial_x$ ha componenti $(\cos\vartheta,\ -\sin\vartheta/r)$ sulla base $(\partial_r,\partial_\vartheta)$. Il caso dei punti regolari dice di derivarle rispetto a $\vartheta$: si ottiene $(-\sin\vartheta,\ -\cos\vartheta/r)$, che sono le componenti di $-\partial_y$, perché $\partial_y$ ha componenti $(\sin\vartheta,\ \cos\vartheta/r)$. <b>È il $-\partial_y$ della freccia blu</b>, ritrovato senza scrivere il flusso e senza calcolare una parentesi.</p>`},
  {t:'prosa', title:'Piu campi insieme: le coordinate esistono se e solo se i campi commutano', tag:'teorema', html:R`
  <p>Il Theorem 9.46 di Lee estende la forma canonica a più campi: se $X_1,\dots,X_k$ sono <b>linearmente indipendenti</b> in ogni punto di un aperto e <b>commutano a due a due</b>, allora vicino a ogni punto esistono coordinate in cui $X_i=\partial/\partial s^i$ per $i=1,\dots,k$. La dimostrazione è quella di prima con $k$ flussi al posto di uno — $\psi(t_1,\dots,t_k,u)=\Phi^{X_1}_{t_1}\circ\cdots\circ\Phi^{X_k}_{t_k}(0,u)$ — e la commutazione dei flussi è ciò che rende irrilevante l'ordine in cui si compongono. <b>La condizione è anche necessaria</b>, e per un motivo elementare: i campi coordinati commutano sempre, perché le derivate parziali seconde si scambiano.</p>
  <p>Il foglio 4 di Diverio, Esercizio 13, è questo teorema letto al contrario. I campi $X=\partial_x+f(x,y)\,\partial_y$ e $Y=\partial_y$ sono indipendenti ovunque, ma $[X,Y]=-(\partial f/\partial y)\,\partial_y$, e per $f=xy$ viene $[X,Y]=-x\,\partial_y$. Dove la derivata di $f$ rispetto a $y$ non si annulla, la parentesi non è nulla, e allora <b>non esiste nessuna carta in cui $X$ e $Y$ siano i campi coordinati</b>: se esistesse, la parentesi calcolata in quella carta sarebbe zero, e la parentesi non dipende dalle coordinate.</p>
  <p>E la prova del 14/09 contiene il caso positivo. I campi $X=x\,\partial_x+y\,\partial_y$ e $Y=-y\,\partial_x+x\,\partial_y$ commutano e sono indipendenti fuori dall'origine, quindi devono esistere coordinate che li raddrizzano entrambi: sono $u=\log r$ e $v=\vartheta$, con $r=\sqrt{x^2+y^2}$ e $\vartheta=\arctan(y/x)$ sul semipiano $x>0$. Il controllo si fa applicando i campi alle funzioni coordinate: $X(u)=1$, $Y(u)=0$, $X(v)=0$, $Y(v)=1$. <b>Il logaritmo complesso $\log z=\log r+i\vartheta$ è la carta che raddrizza simultaneamente la dilatazione e la rotazione</b>, e il gruppo $CO^+(2)$ della prova, letto in quella carta, diventa la traslazione del piano $(u,v)$.</p>`}
]},

/* ---------------- 05 · ESERCIZI ---------------- */
{ num:'10', title:'Esercizi — tocca a te', meta:'dal flusso al campo e ritorno · il flusso di una matrice · e un campo non completo da riparare',
  blocchi:[
  {t:'esercizio', title:'1 · Risalire dal flusso al campo che lo genera',
   src:'il conto inverso, che e quello che si sbaglia piu spesso',
   testo:R`È data la famiglia di mappe $\Phi_t(x)=xe^{t}$ su $\mathbb{R}$. Verifica che è un flusso, trova il campo che la genera, e controlla che l'inversa di $\Phi_t$ sia $\Phi_{-t}$.`,
   steps:[
    {label:'Le tre verifiche', body:R`
    <p><b>Al tempo zero</b> la mappa è l&rsquo;identità, perché l&rsquo;esponenziale di zero vale uno. <b>La proprietà di gruppo</b> segue dalla proprietà dell&rsquo;esponenziale: applicando prima il tempo $s$ e poi il tempo $t$ si moltiplica per il prodotto dei due esponenziali, che è l&rsquo;esponenziale della somma. <b>L&rsquo;inversa</b> si legge dalla stessa proprietà: componendo il tempo $t$ con il tempo opposto si ottiene l&rsquo;identità, e infatti il prodotto dei due esponenziali vale $1$ — il che è il conto dietro la scrittura $\Phi_{-t}\circ\Phi_t$.</p>
    <p><b>Il campo si ottiene derivando in $t=0$</b>, ed è la definizione di generatore infinitesimale: la derivata rispetto al tempo della posizione, valutata all&rsquo;istante iniziale, vale $x_0$. Quindi <b>il generatore e $x\,\partial_x$</b>, cioè il campo di dilatazione. <b>Si noti l&rsquo;ordine delle operazioni</b>: si deriva rispetto al tempo tenendo fermo il punto di partenza, non rispetto alla posizione. Invertire i due è l&rsquo;errore tipico e produce il campo sbagliato.</p>`},
    {label:'Che cosa dice il segno del campo', body:R`
    <p>Il campo $x\,\partial_x$ punta verso l&rsquo;esterno a destra dell&rsquo;origine e verso l&rsquo;esterno a sinistra — cioè si allontana sempre dall&rsquo;origine — e si annulla nell&rsquo;origine stessa, che è quindi un <b>punto fisso del flusso</b>. Coerentemente, $\Phi_t(0)$ vale zero per ogni $t$.</p>
    <p><b>Gli zeri del campo sono esattamente i punti fissi del flusso</b>, ed è una corrispondenza che vale sempre: la curva integrale da un punto dove il campo si annulla è costante, per unicità. <b>È il primo strumento della teoria qualitativa</b> — si trovano gli zeri, si linearizza attorno a ciascuno, e si legge il comportamento locale dal segno degli autovalori. Qui l&rsquo;autovalore è $+1$ e l&rsquo;origine è un punto fisso <i>repulsivo</i>.</p>`}
   ]},
  {t:'esercizio', title:'2 · Il flusso di un campo lineare, in due dimensioni',
   src:'il caso in cui esponenziale di matrice e flusso sono la stessa cosa',
   testo:R`Sia $A=\begin{pmatrix}1&0\\0&2\end{pmatrix}$ e si consideri il campo lineare $\dot{\mathbf x}=A\mathbf x$ su $\mathbb{R}^{2}$. Scrivi il flusso, di' se è completo, e descrivi le orbite.`,
   steps:[
    {label:'Il flusso, e la completezza', body:R`
    <p>Il flusso è l&rsquo;esponenziale della matrice moltiplicata per il tempo, applicato al dato iniziale. Essendo $A$ diagonale, l&rsquo;esponenziale si calcola entrata per entrata: la prima coordinata viene moltiplicata per $e^{t}$ e la seconda per <b>$e^{2t}$</b>. <b>Il flusso è definito per ogni tempo reale e ogni punto</b>, quindi il campo è completo — come dev&rsquo;essere per ogni campo lineare, la cui crescita al più esponenziale non raggiunge l&rsquo;infinito in tempo finito.</p>
    <p><b>La verifica della proprietà di gruppo è gratuita</b>: componendo due volte si moltiplicano gli esponenziali, e per una matrice fissata le due esponenziali commutano sempre. <b>Questo è il caso in cui esponenziale di matrice e flusso coincidono letteralmente</b>, ed è il motivo per cui i due argomenti si studiano insieme: lo stesso oggetto è un sottogruppo a un parametro se lo si guarda dal gruppo delle matrici invertibili, e un flusso se lo si guarda dal piano su cui agisce.</p>`},
    {label:'Le orbite, e il nodo improprio', body:R`
    <p>Eliminando il tempo fra le due coordinate si trova che le orbite sono le curve del tipo «seconda coordinata proporzionale al quadrato della prima», cioè <b>parabole</b> tangenti all&rsquo;asse lento. Gli assi coordinati sono orbite a sé — le semirette — e l&rsquo;origine è l&rsquo;unico punto fisso.</p>
    <p><b>La forma delle orbite è governata dal rapporto degli autovalori</b>, non dai loro valori: se fossero stati uguali le orbite sarebbero state rette per l&rsquo;origine, se fossero stati di segno opposto sarebbero state iperboli e l&rsquo;origine una sella. <b>Qui entrambi sono positivi e diversi, e la configurazione si chiama nodo improprio</b>: tutto scappa dall&rsquo;origine, ma più in fretta lungo la direzione con autovalore maggiore, e per questo le traiettorie si incurvano verso quell&rsquo;asse.</p>
    <p><b>La lettura in termini di flusso</b>: la mappa $\Phi_t$ è una dilatazione anisotropa, e la sua matrice jacobiana ha determinante $e^{3t}$, che cresce. <b>Il flusso non conserva le aree</b> — a differenza dei flussi hamiltoniani, dove il determinante resta $1$ per ogni tempo — e quel determinante è l&rsquo;esponenziale dell&rsquo;integrale della divergenza del campo, che qui vale $3$. È la formula di Liouville, ed è la ragione per cui in meccanica la divergenza nulla del campo hamiltoniano equivale alla conservazione del volume nello spazio delle fasi.</p>`}
   ]},
  {t:'esercizio', title:'3 · Rendere completo un campo che non lo e',
   src:'la tecnica della funzione bump, applicata invece che solo nominata',
   testo:R`Il campo $X=x^{2}\partial_x$ su $\mathbb{R}$ non è completo. Costruisci un campo completo che coincida con $X$ sull'intervallo $[-1,1]$, e spiega che cosa si è perso.`,
   steps:[
    {label:'La costruzione', body:R`
    <p>Si prende una funzione bump $\chi$ — liscia, identicamente $1$ su $[-1,1]$, identicamente nulla fuori da $[-2,2]$, con valori in $[0,1]$ — che si costruisce a partire dalla funzione $e^{-1/t}$, liscia ma non analitica. Si pone allora $\tilde X=\chi\,X$, cioè si moltiplica il coefficiente del campo per la bump.</p>
    <p><b>Il nuovo campo ha supporto compatto</b>, contenuto in $[-2,2]$, quindi è completo per il primo dei tre criteri. Fuori dal supporto è il campo nullo e le curve integrali sono costanti; dentro, il supporto è compatto e fornisce l&rsquo;$\epsilon$ uniforme. <b>E su $[-1,1]$ coincide con $X$</b>, perché lì la bump vale uno: le curve integrali che restano in quell&rsquo;intervallo sono esattamente quelle di partenza.</p>`},
    {label:'Che cosa si e perso, e perche la tecnica vale comunque', body:R`
    <p>Si è perso il comportamento all&rsquo;esterno: le soluzioni che prima esplodevano ora si fermano, rallentando fino a diventare costanti oltre $2$. <b>Il campo modificato non risponde più alla domanda originale</b>, e sarebbe un errore usarlo per studiare l&rsquo;esplosione.</p>
    <p><b>Ma la tecnica è centrale in geometria, e vale la pena capire a che cosa serve davvero.</b> Serve quando ciò che interessa è <i>locale</i> — un intorno di un punto, una carta, una sottovarietà — e serve un oggetto <i>globale</i> per poter applicare i teoremi. Si prende l&rsquo;oggetto locale, lo si moltiplica per una bump, e si ottiene un oggetto globale che coincide con quello di partenza dove serve. È l&rsquo;operazione che si fa ogni volta che si dice «si estende con una partizione dell&rsquo;unità», ed è quella che l&rsquo;Esercizio 3.26 di Abate usa per dimostrare che i diffeomorfismi di una varietà connessa agiscono transitivamente: un campo a supporto compatto nella palla, il cui flusso al tempo $1$ porta un punto dato in un altro.</p>
    <p><b>Il prezzo è sempre lo stesso e va dichiarato</b>: l&rsquo;oggetto globale non è canonico, dipende dalla bump scelta. Ciò che si dimostra con esso deve quindi riguardare solo la regione in cui coincide con l&rsquo;originale, oppure essere indipendente dalla scelta. <b>Chi dimentica questo prezzo dimostra teoremi falsi</b>, ed è la ragione per cui gli enunciati con le partizioni dell&rsquo;unità sono sempre formulati con cura.</p>`}
   ]}
]},

/* ---------------- 06 · IL SENSO ---------------- */
{ num:'11', title:'Il senso, e le rotte', meta:'cosa lascia in mano, e dove il flusso e il linguaggio naturale',
  blocchi:[
  {t:'prosa', title:'Cosa lascia in mano', tag:'sintesi', html:R`
  <p><b>Il punto.</b> Un campo vettoriale e un gruppo a un parametro di diffeomorfismi sono <b>lo stesso oggetto</b> visto in due modi: infinitesimo e finito. Passare dall'uno all'altro è integrare o derivare, e quasi tutta la fisica teorica consiste nel fare quel passaggio in un verso o nell'altro — dai generatori alle trasformazioni, e viceversa.</p>
  <p>E un secondo punto, tecnico ma decisivo: <b>l'esistenza globale non è garantita</b>, e le condizioni che la garantiscono (compattezza, supporto compatto, omogeneità di gruppo) sono le stesse che in analisi garantiscono che le soluzioni non esplodano. <b>La geometria non aggiunge difficoltà: le rende visibili.</b></p>`},
  {t:'prolessi', title:'Dove riappare questo movimento, nella fisica che farai',
   oggetto:R`<b>Il flusso</b>: l'evoluzione temporale come famiglia di trasformazioni, generata da un campo.`,
   rotte:[
    {dove:'Meccanica<br>analitica', txt:R`Il <b>flusso hamiltoniano</b> è il flusso del campo generato da $H$ sullo spazio delle fasi; il teorema di Liouville dice che preserva il volume, e le simmetrie continue sono flussi di campi che commutano con quello dell'energia — cioè le quantità conservate.`},
    {dove:'Meccanica<br>statistica', txt:R`L'<b>ipotesi ergodica</b> è un'affermazione sul flusso sulla superficie di energia costante: che le medie temporali lungo una traiettoria coincidano con quelle d'insieme. <b>Compattezza della superficie e completezza del flusso sono le ipotesi che rendono l'enunciato ben posto.</b>`},
    {dove:'Meccanica<br>quantistica', txt:R`L'evoluzione temporale $e^{-iHt/\hbar}$ è un gruppo a un parametro di trasformazioni unitarie, generato dall'hamiltoniana: <b>è questa struttura, con lo spazio di Hilbert al posto della varietà</b>. Il teorema di Stone è l'analogo del teorema fondamentale sui flussi.`},
    {dove:'Sistemi<br>dinamici', txt:R`Attrattori, insiemi invarianti, sezioni di Poincaré, esponenti di Lyapunov: tutta la teoria studia il flusso senza risolverlo. <b>La sezione di Poincaré</b> è il modo di ridurre un flusso continuo a una mappa discreta, e si costruisce con la trasversalità.`}
   ],
   domanda:R`Il flusso di un campo a divergenza nulla preserva i volumi, e quindi non può avere attrattori: nessuna regione si contrae. Eppure i sistemi fisici reali dissipano e si assestano su stati di equilibrio. <b>Domanda che porti avanti:</b> come si concilia la conservazione del volume nello spazio delle fasi con l'irreversibilità che osserviamo? La risposta non sta nel flusso — che è reversibile e conserva tutto — ma in <b>come si osserva</b>: il volume si conserva ma si <i>filamenta</i>, distribuendosi in strutture sempre più sottili che qualunque misura a risoluzione finita non distingue da una distribuzione uniforme. <b>L'irreversibilità è un fatto sull'osservatore, non sul flusso</b>, ed è il punto da cui parte tutta la meccanica statistica.`}
]}

];


/* =================================================================== */
var byId = {}; TAPPE.forEach(function(s){ byId[s.num]=s; });

var VKEY='pm-nucleogd-15-visited';
function loadSeen(){ try{ return new Set(JSON.parse(localStorage.getItem(VKEY)||'[]')); }catch(e){ return new Set(); } }
function saveSeen(s){ try{ localStorage.setItem(VKEY, JSON.stringify(Array.from(s))); }catch(e){} }
var SEEN = loadSeen();

function renderNav(active){
  var nav=document.getElementById('sidebar');
  nav.innerHTML='';
  var h=document.createElement('h2'); h.textContent='Nucleo gd-15 · le tappe'; nav.appendChild(h);
  TAPPE.forEach(function(s){
    var b=document.createElement('button');
    b.className='navitem'+(active===s.num?' active':'')+(SEEN.has(s.num)?' seen':'');
    b.innerHTML='<span class="dot"></span><span class="nx">'+s.num+'</span><span>'+s.title+'</span>';
    b.onclick=function(){ showTappa(s.num); };
    nav.appendChild(b);
  });
}

/* ---- renderer dei blocchi ---- */
function sectionProsa(title, tag, html){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var body=elFromHTML('<div class="open-body">'+html+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function sectionGram(title, rows){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag gramtag">grammatica</span></h3>';
  var inner='<table class="gramtab">';
  rows.forEach(function(r){ inner+='<tr><td class="gs">'+r[0]+'</td><td>'+r[1]+'</td></tr>'; });
  inner+='</table>';
  var body=elFromHTML('<div class="gramwrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
/* --- blocco PLOT: la figura non decora, si legge. Ogni plot porta una chiave di lettura. --- */
function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';
  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionSvelabile(title, tag, html, sol){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var c=document.createElement('div'); c.className='collaudo-item';
  var q=document.createElement('div'); q.className='cq'; q.innerHTML=html||'';
  c.appendChild(q); typeset(q);
  if(sol){
    var a=document.createElement('div'); a.className='ca'; a.style.display='none';
    a.innerHTML='<b>Soluzione.</b> '+sol;
    var btn=document.createElement('button'); btn.className='reveal-btn small';
    btn.textContent='Rivela la soluzione';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a);
      btn.disabled=true; btn.classList.add('done'); btn.textContent='Soluzione rivelata'; };
    c.appendChild(btn); c.appendChild(a);
  }
  wrap.appendChild(c); return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    /* DUE SCHEMI, NON UNO — scoperto il 2026-10-06 provando le pagine vive. I movimenti
       scritti per primi (em-01..03, me-10b, i collaudi di gd-01..09 e di quattro em)
       usano una forma piu' semplice: `reveal` e `prolessi` con un solo `html`,
       `esercizio` e `collaudo` con `html` + `sol`. Il renderer ne conosceva una sola e
       chiamava `steps.forEach` su `undefined`: TypeError, e la tappa si fermava li' —
       62 blocchi in 17 movimenti su 74. Non si riscrive il contenuto per far contento
       il renderer: e' il renderer che deve leggere cio' che c'e'.
       E in fondo un ramo che NON muore: uno schema nuovo di domani deve far vedere un
       avviso in quella sezione, non spegnere la pagina sotto di se'. */
    try{
      if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
      else if(b.t==='prolessi') m.appendChild(b.rotte ? sectionProlessi(b)
                                   : sectionProsa(b.title,'prolessi',b.html));
      else if(b.t==='reveal')m.appendChild(b.steps ? sectionReveal(b.title,b.tag,b.steps)
                                   : sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='esercizio') m.appendChild(b.steps ? sectionEsercizio(b)
                                   : sectionSvelabile(b.title,'esercizio',b.html,b.sol));
      else if(b.t==='collaudo')  m.appendChild(b.items ? sectionCollaudo(b.title,b.items)
                                   : sectionSvelabile(b.title,'provi, poi riveli',b.html,b.sol));
      else if(b.t==='plot')      m.appendChild(sectionPlot(b));
      else m.appendChild(sectionProsa(b.title||'(blocco)', 'tipo sconosciuto: '+b.t,
                                      b.html||''));
    }catch(err){
      var avv=document.createElement('section'); avv.className='section';
      avv.innerHTML='<h3>'+(b.title||'(blocco)')+'<span class="tag">non reso</span></h3>'
        +'<p style="color:#ff6b6b">Questo blocco non si &egrave; potuto rendere ('
        +b.t+': '+err.message+'). Il resto della tappa continua sotto.</p>';
      m.appendChild(avv);
    }
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* I POP-UP DEGLI STRUMENTI. `cablaStrumenti` esisteva dal 18-09 e non la chiamava
     nessuno: i 229 rimandi del percorso erano <span> senza handler, e il clic non
     faceva niente. Nessun controllo poteva vederlo — la sintassi era valida, le schede
     c'erano tutte, le formule rendevano: il guasto esisteva solo a pagina viva. Qui, e
     dopo ogni inserimento successivo, perche' la tappa si rimonta da capo a ogni
     cambio e gli handler vanno riattaccati al DOM nuovo. */
  cablaStrumenti(m);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}

  var h=(location.hash||'').replace('#','');
  showTappa(byId[h]?h:'00');
});
window.addEventListener('hashchange', function(){
  var h=(location.hash||'').replace('#','');
  if(byId[h]) showTappa(h);
});
