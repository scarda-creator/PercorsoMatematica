<style>
  :root{

  .navitem .nx{color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto;}

  .plot-intro{color:var(--muted);font-size:.95rem;margin:0 0 12px;}
  .plot-row{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;
    background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;}
  .plot-row.due .plot-box{flex:1 1 300px;min-width:280px;}
  .plot-box{max-width:560px;}

  .gramwrap{background:var(--grambg);border:1px solid #1f4d47;border-radius:12px;padding:6px 6px;}

  table.gramtab tr:last-child td{border-bottom:none;}

    border-right:1px solid #17332e;font-variant-numeric:tabular-nums;}
  .section > h3 .tag.gramtag{background:var(--grambg);border-color:#1f4d47;color:var(--gram);}

  /* ---- STRUMENTI (repertorio condiviso: la scheda si apre DENTRO la frase) ----
     Nessun accento nuovo: riusa il verde della grammatica, perche' uno strumento
     richiamato e' grammatica gia' spiegata altrove, non una quinta specie di blocco. */
  .str{color:var(--gram);border-bottom:1px dashed var(--gram);cursor:pointer;}
  .str:hover{background:var(--grambg);}
  .str::after{content:"\2666";font-size:.62em;vertical-align:.42em;margin-left:2px;opacity:.8;}
  .str.aperto::after{content:"\2715";}
  .str.rotto{color:#ff6b6b;border-bottom-color:#ff6b6b;cursor:help;}

  table.protab td.pd{white-space:nowrap;color:var(--pro);width:1%;font-weight:700;font-size:.78rem;

  .cq{margin-bottom:10px;}
  .ca{margin-top:12px;background:var(--okbg);border:1px solid #235c33;border-radius:8px;
    padding:10px 14px;font-size:.94rem;}
  .ca b{color:#5fd980;}

  /* ---- PREV / NEXT ---- */
  .prevnext{display:flex;justify-content:space-between;gap:12px;margin-top:40px;
    border-top:1px solid var(--border);padding-top:20px;}
  .pnbtn{flex:1 1 0;background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:12px 16px;cursor:pointer;color:var(--txt);text-align:left;transition:.14s;font:inherit;}
  .pnbtn:hover{border-color:var(--accent);background:var(--panel2);}
  .pnbtn.next{text-align:right;}
  .pnbtn .k{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .pnbtn .t{font-weight:600;color:var(--accent2);}
  .pnbtn:disabled{opacity:.35;cursor:default;border-color:var(--border);background:var(--panel);}

  code{background:var(--panel2);border:1px solid var(--border);border-radius:5px;

  .katex{font-size:1.02em;color:var(--txt);} .katex-display{margin:.5em 0;overflow-x:auto;overflow-y:hidden;}

  @media(max-width:860px){
    .shell{flex-direction:column;}
    .sidebar{width:100%;flex:none;position:static;max-height:none;border-right:none;
      border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:4px;}
    .sidebar h2{width:100%;} .navitem{width:auto;}
    .main{padding:20px 16px 80px;}
  }
</style>

/* ===================================================================

   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un

       <span class="str" data-str="serie-geometrica">la serie geometrica</span>

   Le schede citate da questo nucleo sono cucite qui sotto dal montaggio
   (assembla-nucleo.js): la pagina resta autosufficiente — niente fetch,
   niente sottocartelle da pubblicare — e un rimando a una scheda che non

   Apertura: lo stesso gesto del collaudo (si clicca, il pannello compare,

var CORSO = 'geometria-differenziale';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["campo-vettoriale"] = {"nome":"Campo vettoriale","riga":"Una funzione che a ogni punto dello spazio associa un vettore, scritta $\\mathbf{F}(x,y,z)=F_x\\,\\hat{\\imath}+F_y\\,\\hat{\\jmath}+F_z\\,\\hat{k}$ con le tre componenti funzioni del punto.","serve":"È il modo di dire «c'è qualcosa in ogni punto dello spazio, e ha una direzione». Serve perché permette di smettere di ragionare su coppie di oggetti che si attraggono a distanza e di ragionare su una proprietà dello spazio: la sorgente prepara il campo, e chi arriva dopo sente solo ciò che trova dove si trova.","esempio":"Il campo di una carica puntiforme $q$ nell'origine è $\\mathbf{E}=\\dfrac{q}{4\\pi\\varepsilon_0 r^{2}}\\hat{r}$: la direzione è radiale, il modulo dipende solo dalla distanza. Con $q=1$ e $4\\pi\\varepsilon_0=1$, nel punto $(3,4,0)$ si ha $r=5$, quindi il modulo vale $\\tfrac{1}{25}$ e il versore è $\\left(\\tfrac35,\\tfrac45,0\\right)$: la componente lungo $x$ è $\\tfrac{3}{125}$.","pieno":{"file":"04-campi-vettoriali.html","tappa":"00","come":"la trattazione completa, nel nucleo sui campi vettoriali di Analisi Vettoriale"},"qui":{"elettromagnetismo":{"serve":"È l'oggetto che l'intero corso studia: $\\mathbf{E}$ e $\\mathbf{B}$ sono campi vettoriali, e le quattro equazioni di Maxwell sono affermazioni su come le loro derivate spaziali si legano alle sorgenti. Tutto ciò che si impara dopo — flusso, circuitazione, divergenza, rotore — è un modo di interrogare un campo vettoriale.","esempio":"Per la carica puntiforme in $(3,4,0)$ con $q=1$ e $4\\pi\\varepsilon_0=1$: $r=5$, modulo $\\tfrac{1}{25}$, e la componente lungo $x$ vale $\\tfrac{3}{125}$. Le tre componenti non sono tre campi separati: ruotando gli assi si mescolano fra loro, ed è quello che rende $\\mathbf{E}$ un vettore e non una terna di numeri."}},"controllo":[{"tipo":"uguale","sinistra":"sqrt(3**2+4**2)","vale":"5","dove":"esempio","appare":"r=5"},{"tipo":"uguale","sinistra":"1/sqrt(3**2+4**2)**2","vale":"1/25","dove":"esempio","appare":"\\tfrac{1}{25}"},{"tipo":"uguale","sinistra":"(1/5**2)*(3/5)","vale":"3/125","dove":"esempio","appare":"\\tfrac{3}{125}"},{"tipo":"uguale","sinistra":"sqrt(3**2+4**2)","vale":"5","dove":"qui.elettromagnetismo.esempio","appare":"r=5"},{"tipo":"uguale","sinistra":"(1/5**2)*(3/5)","vale":"3/125","dove":"qui.elettromagnetismo.esempio","appare":"\\tfrac{3}{125}"}]};
STRUM["derivazione"] = {"nome":"Derivazione (regola di Leibniz)","riga":"Un operatore lineare $D$ su un'algebra che rispetta la regola del prodotto: $D(fg)=f\\,D(g)+g\\,D(f)$. È la proprietà che isola «derivare» fra tutti gli operatori lineari possibili.","serve":"È il modo algebrico di definire la derivata senza limiti, e serve ogni volta che si vuole derivare su un oggetto dove non c'è un rapporto incrementale da fare — su una varietà astratta, su un'algebra di matrici, su un anello di polinomi. La conseguenza operativa più usata è che **una derivazione è determinata dai suoi valori sui generatori**: su $\\mathbb{R}^{n}$ basta sapere quanto vale sulle coordinate $x^{1},\\dots,x^{n}$, e da lì Leibniz e la linearità danno tutto il resto. È il motivo per cui un vettore tangente, definito come derivazione, si scrive sempre come combinazione delle $\\partial/\\partial x^{i}$: non perché lo si sia scelto, ma perché non c'è altro. Un secondo fatto, che si dimostra in due righe e si usa continuamente: la **composizione** di due derivazioni non è una derivazione (compaiono derivate seconde), ma la loro **differenza incrociata** $DE-ED$ lo è, perché i termini secondi si cancellano a coppie.","esempio":"Su $\\mathbb{R}$, l'operatore $d/dx$ verificato sul prodotto $f=x^{2}$ e $g=x^{3}$: la regola dice $x^{2}\\cdot3x^{2}+x^{3}\\cdot2x$, cioè $5x^{4}$, e la derivata diretta di $x^{5}$ dà lo stesso $5x^{4}$. Il conto è banale ed è il punto: Leibniz non aggiunge informazione su $\\mathbb{R}$, dove la derivata si sa già fare. Aggiunge informazione quando è l'unica cosa che si ha — per esempio sull'algebra delle matrici, dove $D(A)=MA-AM$ per una matrice fissata $M$ è una derivazione, e la verifica di Leibniz consiste nello sviluppare $M(AB)-(AB)M$ e riconoscerlo come somma di $A\\,D(B)$ e $D(A)\\,B$, cosa che riesce perché i due termini $AMB$ introdotti dallo sviluppo compaiono con segni opposti e si cancellano.","debito":"che le derivazioni in un punto di una varietà siano esattamente i vettori tangenti è il teorema di gd-06 e non si ripete qui; il caso delle algebre non commutative è citato come esempio e non sviluppato.","controllo":[{"tipo":"uguale","sinistra":"x**2*3*x**2+x**3*2*x","vale":"5*x**4","ipotesi":{"x":"real"},"dove":"esempio","appare":"5x^{4}"},{"tipo":"derivata","espr":"x**5","rispetto":["x"],"vale":"5*x**4","ipotesi":{"x":"real"},"dove":"esempio","appare":"derivata diretta di $x^{5}$"}]};
STRUM["hausdorff"] = {"nome":"Hausdorff","riga":"Uno spazio è di Hausdorff (assioma $T_2$, o separato) quando due punti distinti qualunque si possono racchiudere in due aperti disgiunti.","serve":"a dare senso univoco alla parola «limite»: in uno spazio di Hausdorff una successione non può convergere a due punti diversi, quindi scrivere $\\lim_n x_n=p$ individua un solo $p$. La conseguenza che si usa più spesso in geometria differenziale è però un'altra e più forte: Hausdorff è l'ipotesi che converte «compatto» in «chiuso» — ogni sottoinsieme compatto di uno spazio di Hausdorff è chiuso — ed è per questo che la separazione è la prima delle tre clausole della definizione di varietà topologica, accanto a «localmente euclideo» e «a base numerabile». Attenzione al verso: il sottospazio la eredita sempre (gli aperti disgiunti dell'ambiente si intersecano col sottospazio e restano disgiunti), mentre il quoziente può romperla, perché la sua topologia guarda in uscita.","esempio":"Ogni spazio metrico è di Hausdorff, e lo si vede col punto medio. Su $\\mathbb{R}$, presi $p=0$ e $q=8$, la distanza è $D=8$ e si pone $\\varepsilon=\\tfrac{8-0}{2}=4$: le palle aperte $B(0,4)=(-4,4)$ e $B(8,4)=(4,12)$ sono disgiunte. Se un punto $z$ stesse in entrambe, la disuguaglianza triangolare darebbe $D\\le d(0,z)+d(z,8)\\lt\\varepsilon+\\varepsilon=4+4=8=D$, cioè $8\\lt 8$, assurdo. Il margine è il più stretto possibile: le due palle si toccano nell'unico punto $0+4=8-4=4$, che però, essendo aperte, non appartiene a nessuna delle due.","pieno":{"file":"tp-06-hausdorff-e-separazione.html","tappa":"01","come":"la definizione di Hausdorff nella forma diretta, perché non è ridondante rispetto a «localmente euclideo», e il fatto che il sottospazio la eredita"},"controllo":[{"tipo":"uguale","sinistra":"(8-0)/2","vale":"4","dove":"esempio","appare":"\\tfrac{8-0}{2}=4"},{"tipo":"uguale","sinistra":"4+4","vale":"8","dove":"esempio","appare":"4+4=8"},{"tipo":"uguale","sinistra":"0+4","vale":"4","dove":"esempio","appare":"0+4=8-4=4"},{"tipo":"uguale","sinistra":"8-4","vale":"4","dove":"esempio","appare":"0+4=8-4=4"}]};
STRUM["connessione"] = {"nome":"Connessione","riga":"Uno spazio è connesso quando non si spezza in due aperti disgiunti non vuoti, cioè quando i suoi unici sottoinsiemi insieme aperti e chiusi sono $\\emptyset$ e lo spazio stesso.","serve":"a decidere quando un argomento globale regge su tutto lo spazio e quando invece va rifatto pezzo per pezzo. L'equivalenza con «gli unici clopen sono $\\emptyset$ e $X$» è la forma con cui si verifica la connessione nei conti: una funzione continua a valori in $\\{0,1\\}$ (discreto) è costante se e solo se il dominio è connesso, ed è lo scheletro della versione topologica del teorema dei valori intermedi (l'immagine continua di un connesso è un connesso, in $\\mathbb{R}$ un intervallo). I pezzi massimali sono le componenti connesse: formano una partizione di $X$ e ogni punto sta in una sola. Su una varietà, dove vale «localmente euclideo», connesso e connesso per archi coincidono e le componenti sono aperte — è la ragione per cui gli argomenti globali di geometria differenziale si enunciano su una varietà connessa senza perdita, e le altre componenti si trattano a parte identicamente.","esempio":"Lo spazio $X=\\mathbb{R}\\setminus\\{0\\}$ è sconnesso, e lo prova una funzione. La $f(x)=x/|x|$ è continua su $X$ (il denominatore non si annulla mai) e vale $f(-1)=\\tfrac{-1}{|-1|}=-1$ e $f(1)=\\tfrac{1}{|1|}=1$: assume solo i due valori $\\pm1$. Se $X$ fosse connesso l'immagine $f(X)$ sarebbe un connesso di $\\mathbb{R}$, cioè un intervallo, e un intervallo che contiene $-1$ e $1$ conterrebbe anche $0$ — ma $0\\notin f(X)$. Dunque $X$ non è connesso; le sue due componenti sono $(-\\infty,0)$ e $(0,+\\infty)$, su ciascuna delle quali $f$ resta costante.","pieno":{"file":"tp-08-connessione.html","tappa":"01","come":"la definizione di connesso e sconnesso, l'equivalenza col criterio dei clopen, e le componenti come partizione in pezzi massimali"},"controllo":[{"tipo":"uguale","sinistra":"-1/Abs(-1)","vale":"-1","dove":"esempio","appare": STRUM["compattezza"] = {"nome":"Compattezza","riga":"Ogni ricoprimento aperto ammette un sottoricoprimento finito: è la proprietà che permette di passare da «vale vicino a ogni punto» a «vale su tutto», con un numero finito di passi.","serve":"È l'ipotesi che rende globali le conclusioni locali, ed è per questo che ricorre in ogni dimostrazione di geometria differenziale. In $\\mathbb{R}^n$ equivale a chiuso e limitato (Heine-Borel), ma su una varietà quell'equivalenza non si può usare come definizione, perché «limitato» richiede una distanza e una varietà non ne ha una privilegiata. La conseguenza che si usa più spesso è negativa: gli unici sottoinsiemi di $\\mathbb{R}^n$ che sono **insieme** aperti e compatti sono $\\emptyset$ e nient'altro — ed è l'argomento per cui una varietà compatta non può essere coperta da una sola carta.","esempio":"L'intervallo $(0,1)$ non è compatto, e si vede esibendo un ricoprimento senza sottoricoprimento finito: gli aperti $A_n=\\left(\\tfrac1n,1\\right)$ per $n\\ge2$ ricoprono $(0,1)$, perché ogni $x\\gt0$ sta in $A_n$ appena $\\tfrac1n\\lt x$, cioè appena $n\\gt1/x$. Ma una sottofamiglia finita $A_{n_1},\\dots,A_{n_k}$ ha un indice massimo $N$, quindi la sua unione è $\\left(\\tfrac1N,1\\right)$, e il punto $x=\\tfrac1{2N}$ resta fuori: è positivo, dunque sta in $(0,1)$, ed è minore di $\\tfrac1N$. Il conto che regge l'argomento è $\\lim_{n\\to\\infty}\\tfrac1n=0$: gli $A_n$ si avvicinano a coprire tutto, ma nessuno di essi contiene un intorno di $0$, e servirebbero tutti. Chiudendo l'intervallo, $[0,1]$ diventa compatto e quel ricoprimento smette di essere un ricoprimento — $0$ non sta in nessun $A_n$.","debito":"la dimostrazione del teorema di Heine-Borel e la teoria generale degli spazi compatti stanno fuori dal percorso: qui c'è l'uso che se ne fa. Nel corso di Diverio la compattezza entra come ipotesi (sfera, gruppi di Lie compatti) e come conclusione della locale compattezza delle varietà.","controllo":[{"tipo":"limite","espr function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';
  return h;
}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

/* ---------------- 00 · DI COSA PARLA QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Di cosa parla questo movimento', meta:'Geometria Differenziale · voci G.28 e G.29 · dalle singole traiettorie al moto di tutto insieme',
  blocchi:[
  {t:'prosa', title:'Il cambio di sguardo, e perche cambia tutto', tag:'architettura', html:R`
  <p>Una curva integrale descrive <b>un</b> punto che si muove. Ma un campo vettoriale assegna una velocità a <i>ogni</i> punto insieme, e quindi descrive il moto di <b>tutta la varietà in blocco</b> — come un fluido in regime stazionario, in cui ogni particella segue la sua traiettoria e l'insieme si deforma con continuità.</p>
  <p>Questo oggetto si chiama <b>flusso</b>, e si scrive $\Phi_t(p)$: «dove si trova, dopo un tempo $t$, il punto partito da $p$». Fissato $t$, è una mappa dalla varietà in sé; fissato $p$, è la curva integrale da $p$. <b>La novità è guardarla nel primo modo</b>, e la scoperta che ne viene è che quelle mappe formano un <b>gruppo</b>:
  $$\Phi_t\circ\Phi_s=\Phi_{t+s},\qquad \Phi_0=\mathrm{id},\qquad (\Phi_t)^{-1}=\Phi_{-t}.$$
  Cioè: ogni campo vettoriale genera una famiglia di <b>diffeomorfismi</b> parametrizzata dai reali, e quella famiglia è l'immagine di un omomorfismo da $(\mathbb{R},+)$.</p>
  <p><b>È la stessa struttura del sottogruppo a un parametro dei gruppi di Lie</b>, portata sull'intera varietà: il campo è il generatore infinitesimo, il flusso è ciò che genera. Diverio lo tratta il 6 e il 10 dicembre; in <b>Lee, capitolo 9</b>, è il cuore del libro e la trattazione più dettagliata di cui disponiamo, mentre Abate (§3.3) lo enuncia in un solo teorema con sei clausole e Manetti (§7) parte dal flusso come dato e risale al campo.</p>`},
  {t:'prosa', title:'Tre modi di guardare lo stesso dato, e conviene tenerli tutti', tag:'grammatica', html:R`
  <p>Lo stesso oggetto si presenta in tre forme, e vale la pena allineare i tre punti di vista prima di procedere, perché all&rsquo;esame la domanda arriva in una delle tre forme e la risposta sta spesso nelle altre due.</p>
  <p><b>Primo: il <span class="str" data-str="campo-vettoriale">campo vettoriale</span> come freccia.</b> Un vettore in ogni punto, e basta. È la forma in cui il dato si assegna — «sia $X$ il campo di componenti…» — ed è statica: non contiene esplicitamente nessun moto, solo l&rsquo;istruzione per generarlo.</p>
  <p><b>Secondo: il campo come <span class="str" data-str="derivazione">derivazione</span>.</b> Un operatore che mangia funzioni e restituisce funzioni, rispettando Leibniz. È la forma algebrica, quella con cui si definisce la parentesi di due campi, e la sua virtù è che non nomina le coordinate: tutto ciò che si dimostra in questo linguaggio è automaticamente geometrico. La sua debolezza è che non si vede niente.</p>
  <p><b>Terzo: il campo come flusso.</b> Una famiglia di diffeomorfismi della varietà, uno per ogni tempo. È la forma dinamica, quella di questo movimento, ed è la sola in cui si può <i>guardare</i> ciò che succede. <b>Il passaggio dal primo al terzo è l&rsquo;integrazione, quello dal terzo al primo è la derivata al tempo zero</b>, e i due sono inversi l&rsquo;uno dell&rsquo;altro: il campo si chiama per questo generatore infinitesimale del flusso.</p>
  <p><b>La regola pratica che se ne ricava</b>: quando una domanda sembra difficile in una delle tre lingue, conviene tradurla nelle altre due prima di pensarci. «I due campi commutano?» è algebrica e si calcola; «i due flussi si possono scambiare?» è dinamica e si vede; «il quadratino si chiude?» è geometrica e si disegna. <b>Sono la stessa domanda</b>, e la tappa sulla derivata di Lie lo dimostra.</p>`},
  {t:'prosa', title:'Il filo delle otto tappe', tag:'mappa', html:R`
  <p>La prima tappa definisce il flusso come azione del gruppo additivo dei reali, dimostra la <b>proprietà di gruppo</b> — che discende dall'unicità delle soluzioni — e ne ricava la forma possibile delle orbite. La seconda calcola due flussi lineari fino in fondo; la terza dà il <b>metodo</b> per calcolarne uno e lo applica ai quattro campi dell'Esercizio 3.25 di Abate, l'ultimo dei quali è già, senza dirlo, il gruppo di una prova d'esame.</p>
  <p>La quarta affronta il problema che rende la teoria delicata — <b>il flusso può non essere definito per ogni tempo</b> — e costruisce il dominio di flusso con il Teorema Fondamentale, dimostrato nei suoi passaggi. La quinta dà le condizioni che garantiscono la completezza, con le dimostrazioni. La sesta porta tutto sui gruppi di matrici, dove i flussi sono moltiplicazioni per esponenziali, e <b>rilegge come flussi i campi che Diverio mette nelle prove</b>. La settima ritrova la derivata di Lie e mostra che due campi commutano esattamente quando commutano i loro flussi; l'ottava raddrizza un campo vicino a un punto in cui non si annulla, e chiude con le coordinate che una coppia di campi commutanti regala.</p>`}
]},

/* ---------------- 01 · LA DEFINIZIONE E IL GRUPPO ---------------- */
{ num:'01', title:'Il flusso, e perche e un gruppo', meta:'flusso globale come azione di R · il generatore e liscio · la proprieta di gruppo dallunicita · zeri e orbite',
  blocchi:[
  {t:'reveal', title:'La costruzione, e la dimostrazione dei punti non ovvi', tag:'costruzione', steps:[
   {label:'Due strade verso lo stesso oggetto', body:R`
   <p>Le fonti arrivano al flusso da due lati opposti, e conviene vederli entrambi perché ciascuno dimostra ciò che l'altro dà per buono. Manetti (Definizione 7.1) e Lee (formula 9.2) partono dal <b>flusso come dato primitivo</b>: un <b>flusso globale</b> su $M$ è un'applicazione continua
   $$\Phi:\mathbb{R}\times M\to M$$
   che sia un'<b>azione del gruppo additivo</b> $(\mathbb{R},+)$, cioè tale che $\Phi(0,p)=p$ e $\Phi\big(t,\Phi(s,p)\big)=\Phi(t+s,p)$ per ogni $p$ e ogni coppia di tempi. Manetti la chiama anche «gruppo a un parametro» o «sistema dinamico», e la immagina come l'azione di un campo di forze costante nel tempo.</p>
   <p>Da una tale $\Phi$ escono due famiglie: fissato $t$, la mappa $\Phi_t:M\to M$; fissato $p$, la curva $t\mapsto\Phi_t(p)$, la cui immagine è l'<b>orbita</b> di $p$. Le due leggi d'azione si riscrivono come leggi di gruppo, $\Phi_t\circ\Phi_s=\Phi_{t+s}$ e $\Phi_0=\mathrm{id}$, e la prima con $s=-t$ dice che <b>ogni $\Phi_t$ è un omeomorfismo con inversa $\Phi_{-t}$</b> (Osservazione 7.1 di Manetti), un diffeomorfismo se $\Phi$ è liscia. Abate, al contrario, parte dal campo e arriva al flusso integrando (Teorema 3.3.5): è la strada delle prossime righe, e la sola che funziona quando il flusso non è globale.</p>`},
   {label:'Dal flusso al campo, e perche il campo e liscio', body:R`
   <p>Data un'azione liscia, si definisce in ogni punto il vettore velocità dell'orbita all'istante iniziale,
   $$X_p=\left.\frac{d}{dt}\right|_{t=0}\Phi_t(p),$$
   e la Proposition 9.7 di Lee dice due cose. <b>Che $X$ è un campo liscio</b>: per una funzione liscia $f$ si ha $(Xf)(p)=\partial_t\big|_{(0,p)}f\big(\Phi(t,p)\big)$, e la derivata parziale in $t$ di una funzione liscia di $(t,p)$ è liscia in $p$ — e un campo è liscio esattamente quando manda funzioni lisce in funzioni lisce, che è la caratterizzazione per derivazioni. In coordinate è il conto di Manetti: $X(p)=\sum_i\partial_t\Phi^i(0,p)\,\partial_i$. <b>E che ogni orbita è una curva integrale di $X$</b>: posto $q=\Phi_{t_0}(p)$, la legge di gruppo dà $\Phi_t(q)=\Phi_{t+t_0}(p)$, e derivando in $t=0$ si trova che la velocità dell'orbita di $p$ al tempo $t_0$ è $X_q$.</p>
   <p>Un esempio fa vedere che il conto è meccanico. Per le rotazioni del piano, $\Phi_t(x,y)=(x\cos t-y\sin t,\ x\sin t+y\cos t)$, si deriva componente per componente:
   $$\left.\frac{\partial}{\partial t}\right|_{t=0}(x\cos t-y\sin t)=-y,\qquad \left.\frac{\partial}{\partial t}\right|_{t=0}(x\sin t+y\cos t)=x,$$
   quindi il generatore è $X=-y\,\partial_x+x\,\partial_y$, il campo di rotazione. <b>Si deriva in $t$ tenendo fermo il punto</b>: è l'unico modo di sbagliare questo conto.</p>`},
   {label:'Dal campo al flusso: la proprieta di gruppo, e perche e lunicita a darla', body:R`
   <p>Ora il verso difficile. Sia $X$ un campo liscio e, per ogni $p$, sia $\gamma_p$ la curva integrale massimale con $\gamma_p(0)=p$; si pone $\Phi_t(p)=\gamma_p(t)$. Se ogni $\gamma_p$ è definita su tutto $\mathbb{R}$ il campo si dice <b>completo</b> e si ottiene un flusso globale $\Phi:\mathbb{R}\times M\to M$.
   $$X\ \text{completo}\iff\forall p\in M\ \ \mathcal{D}_p=\mathbb{R},\qquad\text{dove}\ \mathcal{D}_p\subseteq\mathbb{R}\ \text{è il dominio massimale di}\ \gamma_p.$$ La <b>liscezza congiunta</b> in $(t,p)$ non è gratis: viene dal teorema di dipendenza liscia dai dati iniziali, la clausola (ii) del Teorema 3.3.3 di Abate.</p>
   <p>Ciò che si sta per dimostrare, detto nella forma che ne rivela la natura:</p>
   $$\forall s,t\in\mathbb{R}\ \ \Phi_{s+t}=\Phi_s\circ\Phi_t,\qquad\Phi_0=\mathrm{id}_M,\qquad\Phi_t^{-1}=\Phi_{-t}\ \ \Longleftrightarrow\ \ \Phi:(\mathbb{R},+)\to\mathrm{Diff}(M)\ \text{è un omomorfismo di gruppi}.$$
   <p>Le tre identità a sinistra non sono tre fatti: sono <b>la definizione di omomorfismo</b> scritta per esteso, e le ultime due seguono dalla prima ponendo $s=t=0$ e $s=-t$. Quindi si dimostra solo la prima.</p>
   <p>Si vuole $\Phi_t(\Phi_s(p))=\Phi_{t+s}(p)$. <b>La dimostrazione è tutta nell'unicità</b>, ed è l'argomento da saper ripetere: si fissano $s$ e $p$, e si considerano le due curve $t\mapsto\Phi_{t+s}(p)$ e $t\mapsto\Phi_t\big(\Phi_s(p)\big)$. <b>Entrambe sono curve integrali di $X$</b> — la prima perché traslare il tempo in una curva integrale dà ancora una curva integrale, dato che $X$ non dipende da $t$ (è il Translation Lemma 9.4 di Lee); la seconda per definizione. <b>Ed entrambe valgono $\Phi_s(p)$ per $t=0$.</b> Per l'unicità del problema di Cauchy coincidono.</p>
   <p>Da qui seguono $\Phi_0=\mathrm{id}$ e $\Phi_{-t}\circ\Phi_t=\mathrm{id}$: <b>ogni $\Phi_t$ è invertibile con inversa liscia</b>, cioè è un diffeomorfismo di $M$. <b>Un campo vettoriale non genera solo traiettorie: genera simmetrie.</b></p>
   <div class="note"><b>Dove l'ipotesi «$X$ non dipende dal tempo» sta lavorando.</b> Se il campo fosse $X(t,p)$, traslare il tempo non darebbe più una curva integrale della stessa equazione, e la proprietà di gruppo cadrebbe: resterebbe solo una famiglia a due parametri $\Phi_{t_0\to t_1}$, che Lee tratta a parte come flusso dipendente dal tempo (Theorem 9.48). <b>È la differenza fra un sistema autonomo e uno forzato</b>, e in meccanica è la differenza fra un'energia conservata e una no.</div>`},
   {label:'Il campo come generatore infinitesimo', body:R`
   <p>Le due strade si chiudono in un cerchio: il campo che si ottiene derivando il flusso di $X$ è $X$ stesso, e il flusso di un campo ottenuto derivando un flusso è quel flusso — il Lemma 7.2 di Manetti lo dimostra con lo stesso argomento di connessione dell'unicità. Si dice allora che $X$ è il <b>generatore infinitesimo</b> del flusso, e <b>la corrispondenza è biunivoca</b>: campi completi e gruppi a un parametro di diffeomorfismi sono la stessa cosa guardata da due lati — uno infinitesimo, uno finito.</p>
   <p>Le due frecce della corrispondenza, ciascuna in una riga:</p>
   $$X(p)=\frac{d}{dt}\Big|_{t=0}\Phi_t(p)\quad\text{(dal flusso al campo)},\qquad \forall p\in M\ \forall t\ \ \frac{d}{dt}\Phi_t(p)=X\big(\Phi_t(p)\big)\quad\text{(dal campo al flusso)}.$$
   <p><b>La seconda è l&rsquo;equazione differenziale, la prima è la sua condizione iniziale derivata</b>: la biiezione fra campi completi e gruppi a un parametro è il teorema di esistenza e unicità di Cauchy, letto come un&rsquo;uguaglianza fra due insiemi.</p>
   <p>È la stessa struttura che lega un elemento dell'algebra di Lie al sottogruppo $\exp(tv)$, e in effetti si scrive anche $\Phi_t=\exp(tX)$. <b>Il flusso è l'esponenziale di un campo vettoriale</b>, e questa notazione non è un'analogia: su un gruppo di matrici, applicata a un campo invariante, restituisce letteralmente l'esponenziale di matrici. E la formula di Manetti per il generatore — il limite di $(f\circ\Phi_t-f)/t$ per $t\to0$ è la funzione $X(f)$ — è la versione infinitesima della stessa frase: <b>il campo è la derivata del flusso al tempo zero, letta sulle funzioni</b>.</p>`},
   {label:'Zeri, punti fissi, e le sole tre forme di unorbita', body:R`
   <p>Il primo frutto della proprietà di gruppo è una classificazione delle orbite, ed è sorprendentemente rigida. Il Lemma 7.1 di Manetti dice che <b>$X(p)=0$ se e solo se $\Phi_t(p)=p$ per ogni $t$</b>: gli zeri del campo sono esattamente i punti fissi del flusso. Un verso è immediato (un'orbita costante ha velocità nulla); per l'altro basta osservare che la curva costante in $p$ è una curva integrale quando $X(p)=0$, e per unicità è <i>la</i> curva integrale da $p$.</p>
   <p>Se invece $\gamma$ non è costante, si guarda l'insieme $P$ dei numeri $T$ tali che la curva traslata nel tempo di $T$ coincida con $\gamma$. È un <b>sottogruppo</b> di $\mathbb{R}$ — somma e opposto di periodi sono periodi — ed è <b>chiuso</b>, perché è definito da un'uguaglianza fra funzioni continue a valori in uno spazio di Hausdorff. E basta un solo ritorno per avere un periodo: se $\gamma(t_1)=\gamma(t_2)$ con $t_1\neq t_2$, le curve $t\mapsto\gamma(t+t_2-t_1)$ e $\gamma$ sono curve integrali che coincidono in $t_1$, quindi coincidono ovunque. I sottogruppi chiusi di $\mathbb{R}$ sono $\{0\}$, $T_0\mathbb{Z}$ e $\mathbb{R}$; il terzo darebbe $\gamma$ costante. Restano due casi, ed è l'Esercizio 3.27 di Abate: <b>una curva integrale massimale non costante o è iniettiva, o è periodica con un periodo minimo $T_0$</b>, e la sua immagine è una varietà di dimensione uno diffeomorfa a $\mathbb{R}$ o a $S^1$. <b>Non esistono orbite che si ripassano sopra a caso</b>: la figura di Manetti con le tre possibilità — un punto, una curva chiusa, una curva iniettiva — è tutto il campionario.</p>`}
  ]}
]},

/* ---------------- 02 · DUE FLUSSI CALCOLATI ---------------- */
{ num:'02', title:'Due flussi calcolati fino in fondo', meta:'la dilatazione · la rotazione · e come si vede che sono diffeomorfismi',
  blocchi:[
  {t:'prosa', title:'Il primo: la dilatazione', tag:'esame', html:R`
  <p>Su $\mathbb{R}$, il campo $X=x\,\dfrac{\partial}{\partial x}$ dà l'equazione $\dot x=x$, quindi
  $$\Phi_t(x)=x\,e^{t}.$$
  <b>La verifica della proprietà di gruppo è immediata</b>: $(x e^{s})e^{t}=x e^{t+s}$. Ogni $\Phi_t$ è la moltiplicazione per una costante positiva — un diffeomorfismo di $\mathbb{R}$ — e il campo è <b>completo</b> benché la varietà non sia compatta, perché la crescita esponenziale non raggiunge l'infinito in tempo finito.</p>
  <p><b>La lettura dinamica</b>: l'origine è un punto fisso, e ogni altro punto fugge da essa. Per $t\to+\infty$ tutto diverge, per $t\to-\infty$ tutto converge a $0$. <b>Il flusso non conserva le distanze né le misure</b>: dilata di un fattore $e^{t}$, e questo è il modo giusto di leggere la divergenza del campo, che qui vale $1$.</p>`},
  {t:'prosa', title:'Il secondo: la rotazione', tag:'esame', html:R`
  <p>Su $\mathbb{R}^2$, il campo $X=-y\,\dfrac{\partial}{\partial x}+x\,\dfrac{\partial}{\partial y}$ dà il sistema lineare $\dot{\vec x}=J\vec x$ con $J$ la matrice antisimmetrica elementare, e il flusso è
  $$\Phi_t=\exp(tJ)=\begin{pmatrix}\cos t&-\sin t\\ \sin t&\cos t\end{pmatrix}.$$
  <b>La proprietà di gruppo qui è l'addizione degli angoli</b>: il prodotto $\exp(tJ)\exp(sJ)$ ha per entrata in alto a sinistra <b>$\cos(t+s)$</b>, cioè ruotare di $s$ e poi di $t$ equivale a ruotare di $t+s$. È l'Example 9.8(b) di Lee, dove lo stesso campo è scritto $x\,\partial_y-y\,\partial_x$.</p>
  <p>Il campo è completo — le traiettorie sono circonferenze, limitate — e il flusso <b>conserva le distanze</b>: è un'isometria. <b>Il confronto fra i due esempi è il punto della tappa</b>: due campi entrambi lineari, uno che dilata e uno che ruota, e la differenza si legge nella matrice — simmetrica contro antisimmetrica. In generale il flusso conserva i volumi esattamente quando la <b>divergenza</b> del campo è nulla, e per la rotazione lo è.</p>
  <div class="note"><b>È il teorema di Liouville</b>, che in meccanica statistica si enuncia per il flusso hamiltoniano: le equazioni di Hamilton hanno divergenza nulla nello spazio delle fasi, quindi il flusso preserva il volume. <b>Qui si vede da dove viene</b>: non è una proprietà misteriosa della meccanica, è la condizione $\nabla\cdot X=0$ letta sul flusso che il campo genera.</div>`},
  {t:'plot', title:'I due flussi a confronto: chi dilata e chi ruota',
   intro:R`Le traiettorie dei due campi, e l'effetto del flusso su un quadratino di punti iniziali. A sinistra la dilatazione, a destra la rotazione.`,
   plots:[
    {kind:'phase', fx:'x', fy:'y', xr:[-2,2], yr:[-2,2], n:13, height:320,
     seeds:[[0.4,0.4],[-0.4,0.4],[0.4,-0.4],[-0.4,-0.4],[0.8,0.1],[-0.8,-0.1],[0.1,0.8],[-0.1,-0.8]],
     title:'flusso di dilatazione: tutto fugge dallorigine, e le aree crescono'},
    {kind:'phase', fx:'-y', fy:'x', xr:[-2,2], yr:[-2,2], n:13, height:320,
     seeds:[[0.5,0],[1,0],[1.5,0],[0,0.7],[0,1.3],[-1.1,0]],
     title:'flusso di rotazione: le traiettorie sono cerchi, e le aree si conservano'}
   ],
   leggi:R`<b>A sinistra</b> le traiettorie sono raggi uscenti: ogni punto si allontana dall'origine, e un quadratino di condizioni iniziali si <b>dilata</b> — dopo un tempo $t$ la sua area è moltiplicata per $e^{2t}$, che è l'esponenziale della divergenza (pari a $2$ nel piano) per il tempo. L'origine è l'unico punto fisso.<br><br>
   <b>A destra</b> le traiettorie sono circonferenze concentriche: il flusso è una rotazione rigida, e un quadratino <b>si sposta senza deformarsi</b>. La divergenza è nulla, e l'area si conserva esattamente.<br><br>
   <b>Che cosa guardare, e che cosa portare via</b>: i due ritratti hanno lo stesso numero di punti fissi e la stessa struttura lineare, eppure il comportamento è opposto. <b>La divergenza del campo è la quantità che decide</b>, e si legge sulle figure prima che nei conti: dove le frecce «escono» da una regione più di quanto entrino, l'area cresce. E tenete a mente questa coppia: dilatazione e rotazione torneranno, con le stesse formule, come i due campi di un gruppo di matrici in una prova d'esame.`}
]},

/* ---------------- 02b · IL METODO E I QUATTRO CAMPI DI ABATE ---------------- */
{ num:'02b', title:'Calcolare un flusso: il metodo, e i quattro campi di Abate', meta:'campo lineare · sistema triangolare · integrale primo · Esercizio 3.25 per intero',
  blocchi:[
  {t:'prosa', title:'Che cosa vuol dire calcolare un flusso', tag:'metodo', html:R`
  <p>Calcolare un flusso vuol dire risolvere il problema di Cauchy $\dot{\mathbf x}=X(\mathbf x)$, $\mathbf x(0)=p$ <b>tenendo il punto iniziale $p$ come parametro</b>, e poi leggere la soluzione come funzione delle due variabili $(t,p)$. Non c'è un metodo universale — c'è per le equazioni che si sanno integrare — ma tre casi coprono quasi tutti gli esercizi del corso, e l'Esercizio 3.25 di Abate li mette in fila. Lee propone lo stesso allenamento nel Problem 9-3, con campi diversi.</p>
  <p><b>Primo caso: il campo lineare.</b> Se $X(\mathbf x)=A\mathbf x$ con $A$ matrice costante, il flusso è $\Phi_t=\exp(tA)$, e tutto si riduce a un esponenziale di matrice: si diagonalizza, oppure si riconosce un blocco noto. <b>Secondo caso: il sistema triangolare.</b> Se una componente del campo dipende solo dalla sua variabile, la si integra per prima e la si sostituisce nelle altre, in cascata. <b>Terzo caso: una funzione costante sulle orbite.</b> Se $X(h)=0$ per qualche funzione $h$, le orbite stanno sui livelli di $h$, e il numero di equazioni da risolvere scende di uno; in meccanica una tale $h$ si chiama integrale primo. <b>Il terzo caso non dà il flusso, ma ne dà la forma</b>, e spesso è tutto ciò che la domanda chiede.</p>`},
  {t:'reveal', title:'I quattro campi dell Esercizio 3.25, risolti', tag:'esame', steps:[
   {label:'(i) il campo y d/dx + d/dy: un sistema triangolare', body:R`
   <p>Il sistema è $\dot x=y$, $\dot y=1$, ed è triangolare: la seconda equazione non vede la prima. Si integra $y(t)=y_0+t$, si sostituisce, e $x(t)=x_0+y_0t+\tfrac{t^2}{2}$. Il flusso è
   $$\Phi_t(x,y)=\Big(x+ty+\tfrac{t^{2}}{2},\ y+t\Big).$$
   <b>Non è una mappa lineare</b> — il termine $t^2/2$ non dipende dal punto — e tuttavia è un gruppo, come deve. Componendo, la prima componente di $\Phi_s\circ\Phi_t$ vale
   $$\Big(x+ty+\tfrac{t^2}{2}\Big)+s(y+t)+\tfrac{s^2}{2}=x+(s+t)y+\tfrac{(s+t)^2}{2},$$
   che è la prima componente di $\Phi_{s+t}$; la seconda è $y+t+s$, e il conto è chiuso. <b>Il termine misto $st$ che nasce dal quadrato è esattamente quello che serve</b>: è il pezzo che un errore di segno distruggerebbe, ed è il motivo per cui la verifica della proprietà di gruppo è un buon controllo di un flusso calcolato a mano.</p>
   <p>La forma delle orbite si legge senza risolvere niente: la funzione $h=x-\tfrac{y^2}{2}$ è costante lungo il flusso, perché $X(h)=y-y=0$, e infatti sul flusso esplicito $\big(x+ty+\tfrac{t^2}{2}\big)-\tfrac{(y+t)^2}{2}=x-\tfrac{y^2}{2}$. <b>Le orbite sono le parabole $x=\tfrac{y^2}{2}+c$</b>, percorse verso l'alto, tutte traslate l'una dell'altra; nessun punto fisso, perché la seconda componente del campo non si annulla mai, e il campo è completo.</p>`},
   {label:'(ii) il campo x d/dx + 3y d/dy: un nodo', body:R`
   <p>Campo lineare con matrice diagonale $\mathrm{diag}(1,3)$: il flusso è $\Phi_t(x,y)=(e^{t}x,\ e^{3t}y)$, completo. L'integrale primo si trova eliminando il tempo: sulla curva da $(x_0,y_0)$ con $x_0\neq0$,
   $$\frac{y(t)}{x(t)^3}=\frac{e^{3t}y_0}{e^{3t}x_0^3}=\frac{y_0}{x_0^3},$$
   quindi le orbite sono le cubiche $y=c\,x^3$, più i semiassi. <b>L'origine è un nodo repulsivo</b>: autovalori entrambi positivi e diversi, e le orbite escono tangenti all'asse dell'autovalore minore, perché lungo l'altro asse la fuga è tre volte più rapida.</p>`},
   {label:'(iii) il campo x d/dx - y d/dy: una sella che conserva le aree', body:R`
   <p>Ancora diagonale, ma con autovalori di segno opposto: $\Phi_t(x,y)=(e^{t}x,\ e^{-t}y)$. Il prodotto delle coordinate è costante, $x(t)y(t)=(e^{t}x_0)(e^{-t}y_0)=x_0y_0$, e le orbite sono i rami delle <b>iperboli $xy=c$</b>, più i quattro semiassi: l'asse $x$ si allontana dall'origine, l'asse $y$ vi converge. <b>L'origine è una sella.</b></p>
   <p>Un dettaglio che vale la pena vedere: la jacobiana di $\Phi_t$ ha determinante $e^{t}e^{-t}=1$, quindi <b>questo flusso conserva le aree</b> pur non conservando le distanze — è la versione più semplice possibile di un flusso hamiltoniano, con hamiltoniana $H=xy$. La divergenza del campo è $1-1=0$, e Liouville torna puntuale.</p>`},
   {label:'(iv) il campo y d/dx + x d/dy: il gruppo di una prova, senza dirlo', body:R`
   <p>Lineare, con matrice $K=\begin{pmatrix}0&1\\1&0\end{pmatrix}$. Siccome $K^2=I$, la serie dell'esponenziale si spezza in termini pari e dispari, e i due pezzi sono le serie di coseno e seno iperbolico:
   $$\exp(tK)=\begin{pmatrix}\cosh t&\sinh t\\ \sinh t&\cosh t\end{pmatrix},$$
   quindi $\Phi_t(x,y)=(x\cosh t+y\sinh t,\ x\sinh t+y\cosh t)$, con entrata fuori diagonale $\sinh t$ e diagonale $\cosh t$. L'integrale primo è la forma quadratica di Lorentz:
   $$(x\cosh t+y\sinh t)^2-(x\sinh t+y\cosh t)^2=x^2-y^2,$$
   quindi le orbite stanno sulle iperboli $x^2-y^2=c$ — <b>la stessa sella del caso (iii), ruotata di un quarto di angolo retto</b>. Non è una coincidenza: $K$ ha autovettori $(1,1)$ e $(1,-1)$ con autovalori $\pm1$, e nella base degli autovettori il campo (iv) <i>è</i> il campo (iii).</p>
   <p><b>E ora il punto che collega l'esercizio allo scritto.</b> Le matrici $\exp(tK)$ sono esattamente la carta globale della componente dell'identità $SO^+(1,1)$ che la prova del 15/07, punto (v), chiede di costruire: Diverio chiede di dimostrare che la sua inversa è $t\mapsto\begin{pmatrix}\cosh t&\sinh t\\ \sinh t&\cosh t\end{pmatrix}$. <b>Quella carta è il flusso del campo (iv) letto sulla matrice identità</b>, e preservare $x^2-y^2$ è esattamente la condizione che definisce il gruppo pseudo-ortogonale $O(1,1)$. Il gruppo d'esame è il flusso di un campo lineare.</p>`}
  ]},
  {t:'plot', title:'Una parabola che non e lineare, e una sella che e un gruppo di Lorentz',
   intro:R`A sinistra il campo (i), $y\,\partial_x+\partial_y$, con le sue parabole; a destra il campo (iv), $y\,\partial_x+x\,\partial_y$, con le iperboli che il flusso preserva.`,
   plots:[
    {kind:'phase', fx:'y', fy:'1', xr:[-2,2], yr:[-2,2], n:12, height:320,
     seeds:[[-1.8,0],[-1.2,0],[-0.6,0],[0,0],[0.6,0],[1.2,0]],
     title:'campo (i): parabole x - y^2/2 = costante, nessun punto fisso'},
    {kind:'phase', fx:'y', fy:'x', xr:[-2,2], yr:[-2,2], n:12, height:320,
     seeds:[[0.5,0],[1.2,0],[-0.5,0],[-1.2,0],[0,0.5],[0,1.2],[0,-0.5],[0,-1.2]],
     segs:[{x1:-2, y1:-2, x2:2, y2:2, col:'#d8a13a', dash:true, width:1.4, label:'y = x', lx:1.3, ly:1.7},{x1:-2, y1:2, x2:2, y2:-2, col:'#d8a13a', dash:true, width:1.4, label:'y = -x', lx:1.25, ly:-1.6}],
     title:'campo (iv): iperboli x^2 - y^2 = costante, sella nellorigine'}
   ],
   leggi:R`<b>A sinistra</b> le orbite sono parabole con l'asse orizzontale, tutte uguali e traslate: il campo è invariante per traslazioni in $x$, e il flusso lo eredita. Non c'è nessun punto fisso, perché la componente verticale del campo vale sempre $1$: ogni punto sale con velocità verticale costante, e la parte orizzontale cresce come $t^2/2$.<br><br>
   <b>A destra</b> le orbite sono iperboli con gli asintoti sulle diagonali $y=\pm x$, che sono essi stessi orbite: la diagonale principale si allontana dall'origine, l'antidiagonale vi converge. È la sella del caso (iii) ruotata di 45 gradi, e la rotazione è il cambio di base agli autovettori di $K$.<br><br>
   <b>La lezione che la figura rende ovvia</b>: due campi che in coordinate sembrano diversi possono avere lo stesso ritratto di fase a meno di un diffeomorfismo, e allora i loro flussi sono coniugati. È la naturalità dei flussi, e tornerà sui gruppi di matrici.`}
]},

/* ---------------- 02c · IL TEOREMA FONDAMENTALE ---------------- */
{ num:'02c', title:'Quando il flusso non e globale: il dominio di flusso e il Teorema Fondamentale', meta:'il campo x^2 d/dx calcolato · il dominio aperto tx minore di 1 · lunicita globale e Hausdorff · lapertura del dominio',
  blocchi:[
  {t:'prosa', title:'Due campi che non arrivano a tempo infinito', tag:'first principles', html:R`
  <p>Lee mette davanti al Teorema Fondamentale due esempi, e sono due modi diversi di perdere il flusso globale. Il primo (Example 9.9) è topologico: sulla varietà $\mathbb{R}^2\setminus\{0\}$ il campo costante $\partial_x$ porta il punto $(-1,0)$ verso l'origine, e la curva $(t-1,0)$ <b>cade nel buco</b> al tempo $t=1$ — non si può prolungare, perché il suo limite in $\mathbb{R}^2$ è un punto che la varietà non contiene. Il secondo (Example 9.10) è analitico e più istruttivo, perché la varietà è tutta $\mathbb{R}$ (o $\mathbb{R}^2$) e non c'è nessun buco: il campo
  $$W=x^2\,\frac{\partial}{\partial x}.$$
  L'equazione $\dot x=x^2$ si separa, e la soluzione con $x(0)=x_0$ è
  $$x(t)=\frac{x_0}{1-tx_0}.$$
  <b>Per $x_0>0$ esplode al tempo $1/x_0$</b>, e il suo intervallo massimale è $(-\infty,1/x_0)$; per $x_0<0$ è definita su $(1/x_0,+\infty)$ ed esplode andando indietro; per $x_0=0$ è la costante, definita sempre. Il campo cresce come il quadrato della distanza, e una crescita quadratica basta a raggiungere l'infinito in tempo finito — la crescita lineare della dilatazione no.</p>`},
  {t:'prosa', title:'Il dominio di flusso, calcolato', tag:'costruzione', html:R`
  <p>Mettendo insieme gli intervalli di tutti i punti si ottiene l'insieme delle coppie (tempo, punto) per cui il flusso ha senso, e qui lo si scrive in una riga: la condizione $1-tx>0$ copre i tre casi insieme, quindi
  $$\mathcal{D}=\{(t,x)\in\mathbb{R}^2:\ tx<1\}.$$
  È la regione compresa fra i due rami dell'iperbole $tx=1$, contiene i due assi, ed è <b>aperta</b>. Lee chiama <b>dominio di flusso</b> un aperto di $\mathbb{R}\times M$ la cui sezione sopra ogni punto è un intervallo aperto contenente $0$, e <b>flusso locale</b> un'applicazione $\Phi:\mathcal{D}\to M$ che soddisfa la legge di gruppo dove entrambi i membri hanno senso. Per $W$ la legge si controlla a mano:
  $$\Phi_t\big(\Phi_s(x)\big)=\frac{x/(1-sx)}{1-t\,x/(1-sx)}=\frac{x}{1-(s+t)x}.$$</p>
  <p>E si vede anche la clausola più sottile del teorema. Fissato $t$, l'insieme dei punti che sopravvivono fino al tempo $t$ è $M_t=\{x:\ tx<1\}$, un aperto, e $\Phi_t$ lo manda in $M_{-t}$: per $x\in M_t$ il punto d'arrivo soddisfa
  $$1-(-t)\,\frac{x}{1-tx}=\frac{1}{1-tx},$$
  che è positivo, quindi $(-t)\Phi_t(x)<1$. E tornando indietro si ritrova il punto di partenza, $\Phi_{-t}\big(\Phi_t(x)\big)=x$. <b>Ogni $\Phi_t$ è un diffeomorfismo fra due aperti diversi della retta</b>, $M_t$ e $M_{-t}$, non della retta intera: per $t=1$ è la mappa $x\mapsto x/(1-x)$ da $(-\infty,1)$ su $(-1,+\infty)$.</p>`},
  {t:'plot', title:'Il dominio di flusso di x^2 d/dx: la regione fra i due rami di tx = 1',
   intro:R`Sul piano $(t,x)$: in tratteggio il bordo $tx=1$ del dominio, in colore le curve integrali da $x_0=\pm\tfrac12$, $\pm1$ e $0$, ciascuna disegnata solo dove esiste.`,
   plots:[
    {kind:'func2d', xr:[-4,4], yr:[-4,4], height:340,
     title:'ogni curva vive fra i due rami e scappa allinfinito toccando il bordo',
     xlabel:'t', ylabel:'x',
     curves:[
      {f:'(x>0.05)?1/x:NaN', col:'#ff6b6b', width:2.0, dash:true, label:'bordo tx = 1'},
      {f:'(x<-0.05)?1/x:NaN', col:'#ff6b6b', width:2.0, dash:true},
      {f:'(x<2)?0.5/(1-0.5*x):NaN', col:'#5eead4', width:2.4, label:'x0 = 1/2'},
      {f:'(x<1)?1/(1-x):NaN', col:'#b98cff', width:2.4, label:'x0 = 1'},
      {f:'(x>-2)?-0.5/(1+0.5*x):NaN', col:'#d8a13a', width:2.4, label:'x0 = -1/2'},
      {f:'(x>-1)?-1/(1+x):NaN', col:'#4c8dff', width:2.4, label:'x0 = -1'},
      {f:'0', col:'#ffffff', width:1.6, label:'x0 = 0'}
     ],
     marks:[{x:0, y:1, label:'x0 = 1', col:'#b98cff', left:true},{x:0, y:-1, label:'x0 = -1', col:'#4c8dff'}]}
   ],
   leggi:R`<b>Il dominio è la regione che contiene i due assi e sta fra i rami dell'iperbole</b>, e la figura si legge con il tempo in orizzontale: la sezione del dominio sopra un punto $x_0$ è la retta orizzontale di altezza $x_0$, tagliata dove incontra il bordo. La curva da $x_0=1$ (viola) parte dall'asse verticale all'altezza $1$ e sale fino a diventare verticale al tempo $t=1$, dove l'iperbole tratteggiata la aspetta: l'esplosione avviene esattamente sul bordo del dominio. Andando indietro nel tempo la stessa curva scende verso $0$ senza mai raggiungerlo, quindi esiste per ogni tempo negativo.<br><br>
   <b>Più si parte in alto, prima si esplode</b>: la curva da $x_0=\tfrac12$ (verde) arriva al bordo solo a $t=2$. Le curve da valori negativi sono il riflesso delle altre: esplodono verso il basso andando indietro nel tempo. La retta $x=0$ è l'unica orbita definita per tutti i tempi, ed è il punto fisso.<br><br>
   <b>Che cosa portare via</b>: il tempo di vita $1/x_0$ tende a zero quando $x_0$ cresce, cioè non esiste un tempo minimo uguale per tutti. È esattamente l'ipotesi che il Lemma del Tempo Uniforme chiede, e che qui manca.`},
  {t:'reveal', title:'Il Teorema Fondamentale sui Flussi, e la sua dimostrazione in quattro passi', tag:'teorema', steps:[
   {label:'Lenunciato, nelle due versioni', body:R`
   <p><b>Teorema</b> (Lee 9.12; Abate 3.3.5). Per ogni campo liscio $X$ su $M$ esiste un unico flusso massimale liscio $\Phi:\mathcal{D}\to M$ il cui generatore è $X$, e: (a) per ogni $p$ la curva $t\mapsto\Phi(t,p)$ è l'unica curva integrale massimale di $X$ uscente da $p$; (b) se $s$ sta nell'intervallo di $p$, l'intervallo di $\Phi_s(p)$ è quello di $p$ traslato di $-s$; (c) per ogni $t$ l'insieme $M_t$ è aperto e $\Phi_t:M_t\to M_{-t}$ è un diffeomorfismo con inversa $\Phi_{-t}$.</p>
   <p>Abate aggiunge due clausole che conviene avere in mano: (v) $d(\Phi_t)_p(X_p)=X_{\Phi_t(p)}$, cioè <b>il campo è invariante sotto il proprio flusso</b>, e (vi) la derivata di $f$ lungo l'orbita al tempo zero è $X(f)$. La prima dice che il flusso trascina il campo in sé, e la sua dimostrazione è un conto di una riga con la legge di gruppo: si deriva $f\circ\Phi_{t_0}\circ\Phi_t$ in $t=0$ e si riconosce la derivata di $f$ lungo l'orbita al tempo $t_0$.</p>`},
   {label:'Primo passo: lunicita globale, e dove servono connessione e Hausdorff', body:R`
   <p>Il teorema di Cauchy dà l'unicità <i>locale</i>, in una carta. Per passare a quella globale — due curve integrali definite sullo stesso intervallo $J$ che coincidono in un istante coincidono ovunque — si considera l'insieme $A$ degli istanti in cui coincidono. È <b>non vuoto</b> per ipotesi; è <b>aperto</b>, perché intorno a ogni suo punto le due curve risolvono lo stesso problema di Cauchy in una carta; ed è <b>chiuso</b>, perché è la controimmagine della diagonale tramite la coppia delle due curve, e la diagonale è chiusa esattamente quando $M$ è di <span class="str" data-str="hausdorff">Hausdorff</span> — è il dettaglio che il Lemma 7.2 di Manetti scrive esplicitamente. Un sottoinsieme non vuoto, aperto e chiuso di un intervallo è tutto l'intervallo, perché l'intervallo è <span class="str" data-str="connessione">connesso</span>.</p>
   <p><b>Senza Hausdorff l'unicità globale cade davvero</b>, e il controesempio è la retta con due origini (Problem 1-1 di Lee, Esercizio 1 del primo foglio di Diverio): il campo $\partial_x$ ha, dal punto $-1$, due curve integrali che coincidono per $t<1$ e al tempo $1$ passano una per ciascuna delle due origini. Il problema di Cauchy è localmente ben posto in ogni carta, eppure la soluzione si biforca. <b>La clausola di Hausdorff nella definizione di varietà sta lavorando qui</b>.</p>`},
   {label:'Secondo e terzo passo: la curva massimale e la legge di gruppo', body:R`
   <p>Per ogni $p$ si prende l'<b>unione</b> di tutti gli intervalli aperti contenenti $0$ su cui è definita una curva integrale da $p$: per il passo precedente le curve si incollano, e si ottiene la curva integrale massimale, definita su un intervallo aperto $\mathcal{D}^{(p)}$. Il dominio $\mathcal{D}$ è l'insieme delle coppie $(t,p)$ con $t\in\mathcal{D}^{(p)}$.</p>
   <p>La legge di gruppo si dimostra come nel caso globale, con un'attenzione in più ai domini: se $q=\Phi_s(p)$, la curva $t\mapsto\Phi_{t+s}(p)$, definita su $\mathcal{D}^{(p)}-s$, è una curva integrale da $q$, quindi coincide con quella massimale da $q$ e il suo dominio è contenuto in $\mathcal{D}^{(q)}$. Scambiando i ruoli — da $q$ si torna a $p$ al tempo $-s$ — si ottiene l'inclusione opposta, e quindi l'uguaglianza della clausola (b). <b>È la massimalità a fare il lavoro</b>: senza di essa si avrebbe solo un'inclusione.</p>`},
   {label:'Quarto passo: il dominio e aperto, e il flusso e liscio', body:R`
   <p>È il punto delicato, e Lee e Abate lo dimostrano con lo stesso argomento per assurdo. Si chiama $W$ l'insieme dei $(t,p)$ intorno ai quali $\Phi$ è definita e liscia su un prodotto (intervallo che contiene $0$ e $t$) × (intorno di $p$): è aperto per costruzione, e basta vedere che coincide con $\mathcal{D}$. Se non coincidesse, ci sarebbe un punto $p_0$ e un primo tempo $\tau>0$ in cui si esce da $W$. Il teorema di Cauchy, applicato vicino a $q_0=\Phi_\tau(p_0)$, dà un $\delta>0$ e un intorno $U_0$ di $q_0$ su cui il flusso esiste liscio per tempi $|t|<\delta$. Si sceglie allora un tempo $t_1<\tau$ con $t_1+\delta>\tau$ e $\Phi_{t_1}(p_0)\in U_0$, e per i punti $p$ vicini a $p_0$ si definisce
   $$\Phi_t(p)=\Phi_{t-t_1}\big(\Phi_{t_1}(p)\big)\qquad\text{per } t\in(t_1-\delta,\ t_1+\delta),$$
   che è liscia perché composta di due mappe lisce. Per la legge di gruppo coincide con il flusso dove già c'era, quindi $\Phi$ è liscia oltre $\tau$ su tutto un intorno di $p_0$: contraddizione.</p>
   <p><b>Il trucco è usare la legge di gruppo come strumento di prolungamento</b>: si fa un passo con il pezzo di flusso che si conosce bene vicino a $q_0$, e lo si attacca a quello che si conosce fino a $t_1$. È lo stesso trucco che fra poco darà il Lemma del Tempo Uniforme.</p>`}
  ]}
]},

/* ---------------- 03 · COMPLETEZZA ---------------- */
{ num:'03', title:'Quando il flusso e globale: completezza e Lemma del Tempo Uniforme', meta:'il campo che esce in tempo finito · il lemma dimostrato · supporto compatto · varieta compatta · campi invarianti',
  blocchi:[
  {t:'prosa', title:'Il problema, con lesempio piu semplice possibile', tag:'first principles', html:R`
  <p>Non tutti i campi sono completi, e non serve un esempio esotico. Sulla varietà $M=(0,1)$ — un intervallo aperto, che è una varietà perfettamente legittima — si prenda il campo costante $X=\dfrac{\partial}{\partial x}$. La curva integrale da $x_0$ è $x_0+t$, e <b>raggiunge il bordo</b> al tempo <b>$1-x_0$</b>, dove esce dalla varietà. Manetti usa lo stesso controesempio nella palla unitaria di $\mathbb{R}^2$ (Osservazione 7.3): tutte le curve integrali di $\partial_{x_1}$ escono dalla palla.</p>
  <p>Un campo si dice <b>completo</b> quando genera un flusso globale, cioè quando ogni curva integrale massimale è definita per ogni tempo (Abate, Definizione 3.3.6: il dominio è tutto $\mathbb{R}\times M$). Lee lo dice con franchezza: guardando un campo non si capisce se è completo, e quando l'equazione non si risolve servono criteri generali. I criteri sono tre, e discendono tutti da un lemma solo.</p>`},
  {t:'prosa', title:'Il Lemma del Tempo Uniforme, dimostrato', tag:'teorema', html:R`
  <p><b>Lemma del Tempo Uniforme</b> (Lee 9.15). Se esiste $\epsilon>0$ tale che <i>per ogni</i> punto la curva integrale sia definita almeno su $(-\epsilon,\epsilon)$, allora il campo è <b>completo</b>.</p>
  <p><b>Dimostrazione.</b> Se per qualche $p$ l'intervallo massimale fosse limitato a destra, sia $b$ il suo estremo superiore, e si scelga un tempo $t_0$ con $b-\epsilon<t_0<b$; si ponga $q=\Phi_{t_0}(p)$. Per ipotesi la curva da $q$ esiste almeno per $|t|<\epsilon$, e allora la curva che vale $\Phi_t(p)$ fino a $b$ e $\Phi_{t-t_0}(q)$ per $t_0-\epsilon<t<t_0+\epsilon$ è ben definita — sulla sovrapposizione le due espressioni coincidono per la legge di gruppo — ed è una curva integrale da $p$ che arriva fino a $t_0+\epsilon>b$. Contraddizione con la massimalità. <b>Il punto è l'uniformità</b>: un tempo di esistenza che non si assottiglia da punto a punto permette di ripartire sempre con un passo della stessa lunghezza.</p>
  <p>Manetti (Lemma 7.3) presenta lo stesso argomento nella forma costruttiva, che è quella da ricordare: per arrivare al tempo $t$ si sceglie $N$ con $|t/N|<\epsilon$ e si compone il flusso con se stesso $N$ volte, $\Phi_t=\Phi_{t/N}\circ\cdots\circ\Phi_{t/N}$. Nella forma di Diverio, con passi di mezzo epsilon, $\Phi_{n\epsilon/2}=(\Phi_{\epsilon/2})^{n}$, e <b>si copre tutto $\mathbb{R}$ a passi finiti</b>.</p>`},
  {t:'prosa', title:'I tre criteri che coprono quasi tutti i casi utili', tag:'regola operativa', html:R`
  <ul>
   <li><b>Campi a supporto compatto sono completi</b> (Lee 9.16). Sia $K$ il supporto. Ogni punto di $K$ ha un intorno $U_p$ e un $\epsilon_p>0$ su cui il flusso è definito; per <span class="str" data-str="compattezza">compattezza</span> bastano finiti intorni a coprire $K$, e il minimo dei loro $\epsilon$ è positivo. Fuori da $K$ il campo è nullo e le curve integrali sono costanti, quindi definite sempre. Il lemma si applica. <b>Qui si consuma la funzione bump</b>: moltiplicando un campo qualunque per una bump se ne ottiene uno completo che coincide con l'originale dove serve;</li>
   <li><b>su una varietà compatta ogni campo è completo</b> (Lee 9.17, Manetti Lemma 7.3), perché ogni campo ha supporto compatto. Abate (Esercizio 3.24) dà il criterio che contiene entrambi: <b>$X$ è completo se e solo se ogni arco d'orbita $\Phi_p\big((-t_0,t_0)\big)$ è relativamente compatto</b>, cioè se le orbite non scappano in tempo finito da ogni compatto;</li>
   <li><b>i campi invarianti a sinistra su un gruppo di Lie sono completi</b> (Lee 9.18). Il flusso dell'identità esiste su un $(-\epsilon,\epsilon)$; e siccome un campo invariante è correlato a se stesso dalla traslazione $L_g$, la curva $L_g\circ\gamma_e$ è la curva integrale da $g$, definita sullo stesso intervallo. <b>L'omogeneità del gruppo fornisce l'uniformità che il lemma richiede</b>, con lo stesso $\epsilon$ per tutti i punti.</li>
  </ul>
  <p>Il rovescio è il <b>Lemma di fuga</b> (Lee 9.19): se una curva integrale massimale ha l'intervallo limitato a destra da $b$, allora per ogni $t_0$ l'arco $\Phi_p([t_0,b))$ non sta in nessun compatto. <b>Una curva che non è definita per sempre deve scappare da ogni compatto</b>: è ciò che si è visto per $x^2\partial_x$, dove $x_0/(1-tx_0)$ tende a $+\infty$ quando $t$ sale verso $1/x_0$, ed è ciò che vieta l'esplosione su una varietà compatta, dove non c'è un «fuori» verso cui scappare.</p>
  <div class="note"><b>Perché in meccanica i sistemi con spazio delle fasi compatto non hanno soluzioni che esplodono.</b> Uno spazio delle fasi effettivamente compatto è ciò che si ha quando l'energia è conservata e le sue superfici di livello sono limitate: il flusso hamiltoniano, ristretto a un livello, è un campo su una varietà compatta, ed è completo per il secondo criterio.</div>`},
  {t:'plot', title:'Completo e non completo: lo stesso campo, due varieta diverse',
   intro:R`Il campo costante $\partial/\partial x$ visto su $\mathbb{R}$ e su $(0,1)$: la posizione in funzione del tempo, partendo da $x_0=0{,}3$.`,

   <b>E si vede perché il Lemma del Tempo Uniforme non si applica</b>: il tempo di esistenza $1-x_0$ <i>dipende dal punto</i> e tende a zero per $x_0\to1$. Non esiste nessun $\epsilon$ buono per tutti, ed è esattamente l'ipotesi che manca. Il Lemma di fuga è rispettato: l'orbita esce da ogni compatto di $(0,1)$ prima di morire. <b>La completezza non è una proprietà della formula del campo, ma del rapporto fra il campo e la varietà su cui vive.</b>`}
