<script>
"use strict";
const R = String.raw;

function typeset(el){
  if(el && window.renderMathInElement){
    try{ renderMathInElement(el,{delimiters:[
      {left:'$$',right:'$$',display:true},
      {left:'$',right:'$',display:false}
    ],throwOnError:false}); }catch(e){}
  }
}
function elFromHTML(html){ var d=document.createElement('div'); d.innerHTML=html; return d; }

/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un
   rimando scritto nella prosa:

       <span class="str" data-str="serie-geometrica">la serie geometrica</span>

   Le schede citate da questo nucleo sono cucite qui sotto dal montaggio
   (assembla-nucleo.js): la pagina resta autosufficiente — niente fetch,
   niente sottocartelle da pubblicare — e un rimando a una scheda che non
   esiste FERMA la costruzione invece di arrivare in pagina rotto.
   Apertura: lo stesso gesto del collaudo (si clicca, il pannello compare,
   si typeset una volta sola), portato dentro la frase.
   =================================================================== */
var CORSO = 'geometria-differenziale';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};


function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';
  return h;
}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

/* ---------------- 00 · DI COSA PARLA QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Di cosa parla questo movimento', meta:'Geometria Differenziale · voci G.28 e G.29 · dalle singole traiettorie al moto di tutto insieme',
  blocchi:[
  {t:'prosa', title:'Il cambio di sguardo, e perche cambia tutto', tag:'architettura', html:R`
  <p>Una curva integrale descrive <b>un</b> punto che si muove. Ma un campo vettoriale assegna una velocità a <i>ogni</i> punto insieme, e quindi descrive il moto di <b>tutta la varietà in blocco</b> — come un fluido in regime stazionario, in cui ogni particella segue la sua traiettoria e l'insieme si deforma con continuità.</p>
  <p>Questo oggetto si chiama <b>flusso</b>, e si scrive $\Phi_t(p)$: «dove si trova, dopo un tempo $t$, il punto partito da $p$». Fissato $t$, è una mappa dalla varietà in sé; fissato $p$, è la curva integrale da $p$. <b>La novità è guardarla nel primo modo</b>, e la scoperta che ne viene è che quelle mappe formano un <b>gruppo</b>:
  $$\Phi_t\circ\Phi_s=\Phi_{t+s},\qquad \Phi_0=\mathrm{id},\qquad (\Phi_t)^{-1}=\Phi_{-t}.$$
  Cioè: ogni campo vettoriale genera una famiglia di <b>diffeomorfismi</b> parametrizzata dai reali, e quella famiglia è l'immagine di un omomorfismo da $(\mathbb{R},+)$.</p>
  <p><b>È la stessa struttura del sottogruppo a un parametro dei gruppi di Lie</b>, portata sull'intera varietà: il campo è il generatore infinitesimo, il flusso è ciò che genera. Diverio lo tratta il 6 e il 10 dicembre; in <b>Lee, capitolo 9</b>, è il cuore del libro e la trattazione più dettagliata di cui disponiamo.</p>`},
  {t:'prosa', title:'Il filo delle quattro tappe', tag:'mappa', html:R`
  <p>La prima tappa definisce il flusso e dimostra la <b>proprietà di gruppo</b>, che non è ovvia e discende dall'unicità delle soluzioni. La seconda guarda due esempi calcolati fino in fondo, e mostra che cosa significa «il flusso è un diffeomorfismo». La terza affronta il problema che rende la teoria delicata — <b>il flusso può non essere definito per ogni tempo</b> — e dà le condizioni che garantiscono che lo sia. La quarta chiude il cerchio con la derivata di Lie, che finalmente riceve il significato dinamico che la sua definizione algebrica nascondeva.</p>`}
]},

   {label:'La definizione', body:R`
   <p>Sia $X$ un campo vettoriale liscio. Per ogni $p$ sia $\gamma_p$ la curva integrale massimale con $\gamma_p(0)=p$. Si pone
   $$\Phi_t(p)=\gamma_p(t),$$
   definita per $t$ nell'intervallo massimale di $p$. Se quell'intervallo è tutto $\mathbb{R}$ per ogni punto, il campo si dice <b>completo</b> e si ottiene un <b>flusso globale</b>
   $$\Phi:\mathbb{R}\times M\to M.$$
   La <b>liscezza congiunta</b> in $(t,p)$ non è gratis: viene dal teorema di dipendenza liscia dai dati iniziali, ed è il motivo per cui in gd-13 quel teorema andava enunciato insieme all'esistenza.</p>`},
   {label:'La proprieta di gruppo, e perche e lunicita a darla', body:R`
   <p>Si vuole $\Phi_t(\Phi_s(p))=\Phi_{t+s}(p)$. <b>La dimostrazione è tutta nell'unicità</b>, ed è l'argomento da saper ripetere: si fissano $s$ e $p$, e si considerano le due curve
   $$t\mapsto\Phi_{t+s}(p)\qquad\text{e}\qquad t\mapsto\Phi_t\big(\Phi_s(p)\big).$$
   <b>Entrambe sono curve integrali di $X$</b> — la prima perché traslare il tempo in una curva integrale dà ancora una curva integrale, dato che $X$ non dipende da $t$; la seconda per definizione. <b>Ed entrambe valgono $\Phi_s(p)$ per $t=0$.</b> Per l'unicità del problema di Cauchy coincidono.</p>
   <p>Da qui seguono $\Phi_0=\mathrm{id}$ e $\Phi_t\circ\Phi_{-t}=\mathrm{id}$: <b>ogni $\Phi_t$ è invertibile con inversa liscia</b>, cioè è un diffeomorfismo di $M$. <b>Un campo vettoriale non genera solo traiettorie: genera simmetrie.</b></p>
   <div class="note"><b>Dove l'ipotesi «$X$ non dipende dal tempo» sta lavorando.</b> Se il campo fosse $X(t,p)$, traslare il tempo non darebbe più una curva integrale della stessa equazione, e la proprietà di gruppo cadrebbe: resterebbe solo una famiglia a due parametri $\Phi_{t_0\to t_1}$. <b>È la differenza fra un sistema autonomo e uno forzato</b>, e in meccanica è la differenza fra un'energia conservata e una no.</div>`},
   {label:'Il campo come generatore infinitesimo', body:R`
   <p>Il campo si riottiene derivando il flusso:
   $$X_p=\left.\frac{d}{dt}\right|_{t=0}\Phi_t(p).$$
   Si dice allora che $X$ è il <b>generatore infinitesimo</b> del flusso. <b>La corrispondenza è biunivoca</b>: campi completi e gruppi a un parametro di diffeomorfismi sono la stessa cosa guardata da due lati — uno infinitesimo, uno finito.</p>
   <p>È la stessa struttura che nella tappa sui gruppi di Lie legava un elemento dell'algebra al sottogruppo $\exp(tv)$, e in effetti si scrive anche $\Phi_t=\exp(tX)$. <b>Il flusso è l'esponenziale di un campo vettoriale</b>, e questa notazione non è un'analogia: su un gruppo di Lie, applicata a un campo invariante, restituisce letteralmente l'esponenziale di matrici.</p>`}
  ]}
]},

/* ---------------- 02 · DUE FLUSSI CALCOLATI ---------------- */
{ num:'02', title:'Due flussi calcolati fino in fondo', meta:'la dilatazione · la rotazione · e come si vede che sono diffeomorfismi',
  blocchi:[
  {t:'prosa', title:'Il primo: la dilatazione', tag:'esame', html:R`
  <p>Su $\mathbb{R}$, il campo $X=x\,\dfrac{\partial}{\partial x}$ dà l'equazione $\dot x=x$, quindi
  $$\Phi_t(x)=x\,e^{t}.$$
  <b>La verifica della proprietà di gruppo è immediata</b>: $(x e^{s})e^{t}=x e^{t+s}$. Ogni $\Phi_t$ è la moltiplicazione per una costante positiva — un diffeomorfismo di $\mathbb{R}$ — e il campo è <b>completo</b> benché la varietà non sia compatta, perché la crescita esponenziale non raggiunge l'infinito in tempo finito.</p>
  <p><b>La lettura dinamica</b>: l'origine è un punto fisso, e ogni altro punto fugge da essa. Per $t\to+\infty$ tutto diverge, per $t\to-\infty$ tutto converge a $0$. <b>Il flusso non conserva le distanze né le misure</b>: dilata di un fattore $e^{t}$, e questo è il modo giusto di leggere la divergenza del campo, che qui vale $1$.</p>`},
  {t:'prosa', title:'Il secondo: la rotazione', tag:'esame', html:R`
  <p>Su $\mathbb{R}^2$, il campo $X=-y\,\dfrac{\partial}{\partial x}+x\,\dfrac{\partial}{\partial y}$ dà il sistema lineare $\dot{\vec x}=J\vec x$ con $J$ la matrice antisimmetrica elementare, e il flusso è
  $$\Phi_t=\exp(tJ)=\begin{pmatrix}\cos t&-\sin t\\ \sin t&\cos t\end{pmatrix}.$$
  <b>La proprietà di gruppo qui è l'addizione degli angoli</b>: il prodotto $\exp(tJ)\exp(sJ)$ ha per entrata in alto a sinistra <b>$\cos(t+s)$</b>, cioè ruotare di $s$ e poi di $t$ equivale a ruotare di $t+s$.</p>
  <p>Il campo è completo — le traiettorie sono circonferenze, limitate — e il flusso <b>conserva le distanze</b>: è un'isometria. <b>Il confronto fra i due esempi è il punto della tappa</b>: due campi entrambi lineari, uno che dilata e uno che ruota, e la differenza si legge nella matrice — simmetrica contro antisimmetrica. In generale il flusso conserva i volumi esattamente quando la <b>divergenza</b> del campo è nulla, e per la rotazione lo è.</p>
  <div class="note"><b>È il teorema di Liouville</b>, che in meccanica statistica si enuncia per il flusso hamiltoniano: le equazioni di Hamilton hanno divergenza nulla nello spazio delle fasi, quindi il flusso preserva il volume. <b>Qui si vede da dove viene</b>: non è una proprietà misteriosa della meccanica, è la condizione $\nabla\cdot X=0$ letta sul flusso che il campo genera.</div>`},
  {t:'plot', title:'I due flussi a confronto: chi dilata e chi ruota',
   intro:R`Le traiettorie dei due campi, e l'effetto del flusso su un quadratino di punti iniziali. A sinistra la dilatazione, a destra la rotazione.`,
   plots:[
    {kind:'phase', fx:'x', fy:'y', xr:[-2,2], yr:[-2,2], n:13, height:320,
     seeds:[[0.4,0.4],[-0.4,0.4],[0.4,-0.4],[-0.4,-0.4],[0.8,0.1],[-0.8,-0.1],[0.1,0.8],[-0.1,-0.8]],
     title:'flusso di dilatazione: tutto fugge dallorigine, e le aree crescono'},
    {kind:'phase', fx:'-y', fy:'x', xr:[-2,2], yr:[-2,2], n:13, height:320,
     seeds:[[0.5,0],[1,0],[1.5,0],[0,0.7],[0,1.3],[-1.1,0]],
     title:'flusso di rotazione: le traiettorie sono cerchi, e le aree si conservano'}
   ],
   leggi:R`<b>A sinistra</b> le traiettorie sono raggi uscenti: ogni punto si allontana dall'origine, e un quadratino di condizioni iniziali si <b>dilata</b> — dopo un tempo $t$ la sua area è moltiplicata per $e^{2t}$, che è l'esponenziale della divergenza (pari a $2$ nel piano) per il tempo. L'origine è l'unico punto fisso.<br><br>
   <b>A destra</b> le traiettorie sono circonferenze concentriche: il flusso è una rotazione rigida, e un quadratino <b>si sposta senza deformarsi</b>. La divergenza è nulla, e l'area si conserva esattamente.<br><br>
   <b>Che cosa guardare, e che cosa portare via</b>: i due ritratti hanno lo stesso numero di punti fissi e la stessa struttura lineare, eppure il comportamento è opposto. <b>La divergenza del campo è la quantità che decide</b>, e si legge sulle figure prima che nei conti: dove le frecce «escono» da una regione più di quanto entrino, l'area cresce.`}
]},

/* ---------------- 03 · COMPLETEZZA ---------------- */
{ num:'03', title:'Quando il flusso e globale: completezza e Lemma del Tempo Uniforme', meta:'il flusso locale · il campo che esce in tempo finito · supporto compatto · e la varieta compatta',
  blocchi:[
  {t:'prosa', title:'Il problema, con lesempio piu semplice possibile', tag:'first principles', html:R`
  <p>Non tutti i campi sono completi, e non serve un esempio esotico. Sulla varietà $M=(0,1)$ — un intervallo aperto, che è una varietà perfettamente legittima — si prenda il campo costante $X=\dfrac{\partial}{\partial x}$. La curva integrale da $x_0$ è $x_0+t$, e <b>raggiunge il bordo</b> al tempo <b>$1-x_0$</b>, dove esce dalla varietà.</p>
  <p><b>Il flusso esiste, ma non su tutto $\mathbb{R}\times M$</b>: è definito su un aperto $\mathcal{D}\subseteq\mathbb{R}\times M$ che contiene $\{0\}\times M$, chiamato <b>dominio di flusso</b>, e si parla di <b>flusso locale</b>. La proprietà di gruppo continua a valere, ma solo quando entrambi i membri hanno senso — ed è l'unica complicazione tecnica della teoria.</p>
  <p><b>Il Teorema Fondamentale sui Flussi</b> (che Diverio enuncia il 6 dicembre e discute il 10) mette insieme tutto: per ogni campo liscio esiste un unico flusso massimale, il dominio $\mathcal{D}$ è <b>aperto</b>, $\Phi$ è liscia, e vale la proprietà di gruppo dove definita. <b>La dimostrazione è l'incollamento delle soluzioni locali di Cauchy</b>, e la parte delicata è che $\mathcal{D}$ sia aperto — cioè che si possa sempre prolungare un po' oltre, per punti vicini.</p>`},
  {t:'prosa', title:'Le condizioni che garantiscono la completezza', tag:'regola operativa', html:R`
  <p><b>Lemma del Tempo Uniforme.</b> Se esiste $\epsilon>0$ tale che <i>per ogni</i> punto la curva integrale sia definita almeno su $(-\epsilon,\epsilon)$, allora il campo è <b>completo</b>. La dimostrazione è elegante: si compone il flusso con se stesso, $\Phi_{n\epsilon/2}=(\Phi_{\epsilon/2})^{n}$, e si copre tutto $\mathbb{R}$ a passi finiti. <b>Il punto è l'uniformità</b>: un tempo di esistenza che non si assottiglia da punto a punto.</p>
  <p>Due corollari che coprono quasi tutti i casi utili:</p>
  <ul>
   <li><b>campi a supporto compatto sono completi.</b> Fuori dal supporto il campo è nullo e le curve integrali sono costanti — definite per sempre; dentro, il supporto è compatto e si ricava un $\epsilon$ uniforme per compattezza. <b>Qui si consuma la funzione bump</b>: moltiplicando un campo qualunque per una bump se ne ottiene uno completo che coincide con l'originale dove serve;</li>
   <li><b>su una varietà compatta ogni campo è completo</b>, perché ogni campo ha supporto compatto. <b>È la ragione per cui in meccanica i sistemi con spazio delle fasi compatto non hanno soluzioni che esplodono</b>, e uno spazio delle fasi compatto è esattamente ciò che si ha quando l'energia è conservata e le superfici di livello sono limitate.</li>
  </ul>
  <p>E i campi invarianti a sinistra su un gruppo di Lie sono completi, per l'argomento di prolungamento già visto: <b>l'omogeneità del gruppo fornisce l'uniformità che il lemma richiede</b>.</p>`},
  {t:'plot', title:'Completo e non completo: lo stesso campo, due varieta diverse',
   intro:R`Il campo costante $\partial/\partial x$ visto su $\mathbb{R}$ e su $(0,1)$: la posizione in funzione del tempo, partendo da $x_0=0{,}3$.`,
   plots:[
    {kind:'func2d', xr:[-0.4,1.2], yr:[-0.2,1.4], height:320,
     title:'sullintervallo aperto la traiettoria finisce; sulla retta no',
     xlabel:'t', ylabel:'posizione',
     curves:[
      {f:'0.3+x', col:'#5eead4', width:2.6, label:'traiettoria x0+t'},
      {f:'1', col:'#ff6b6b', width:2.0, dash:true, label:'bordo della varieta (0,1)'},
      {f:'0', col:'#ff6b6b', width:2.0, dash:true, label:'altro bordo'}
     ],
     segs:[{x1:0.7, y1:-0.2, x2:0.7, y2:1.4, col:'#d8a13a', dash:true, width:1.5, label:'t = 1 - x0', lx:0.72, ly:1.3}],
     marks:[{x:0.7, y:1, label:'qui esce dalla varieta', col:'#ff6b6b'},
            {x:0, y:0.3, label:'partenza', col:'#b98cff', left:true}]}
   ],
   leggi:R`<b>La stessa formula, $x(t)=x_0+t$, descrive due situazioni diverse a seconda di dove vive.</b> Su $\mathbb{R}$ la retta prosegue per sempre e il campo è completo. Su $(0,1)$ la traiettoria raggiunge il bordo al tempo <b>$1-x_0$</b> — la linea oro — e lì smette di esistere: non «si ferma», <i>esce</i>, perché il bordo non appartiene alla varietà.<br><br>
   <b>E si vede perché il Lemma del Tempo Uniforme non si applica</b>: il tempo di esistenza $1-x_0$ <i>dipende dal punto</i> e tende a zero per $x_0\to1$. Non esiste nessun $\epsilon$ buono per tutti, ed è esattamente l'ipotesi che manca. <b>La completezza non è una proprietà della formula del campo, ma del rapporto fra il campo e la varietà su cui vive.</b>`}
]},

/* ---------------- 04 · LA DERIVATA DI LIE ---------------- */
{ num:'04', title:'La derivata di Lie ritrovata: cosa misura davvero', meta:'trascinare un campo col flusso · la formula col flusso · e il significato della parentesi',
  blocchi:[
  {t:'prosa', title:'La definizione dinamica, e il teorema che la lega alla parentesi', tag:'idea', html:R`
  <p>Con il flusso in mano si può finalmente dire che cosa misura la parentesi di due campi, in modo non algebrico. Il problema: dati due campi $X$ e $Y$, come si confronta $Y$ in due punti diversi? Non c'è modo canonico — sono vettori in spazi tangenti diversi — <b>ma il flusso di $X$ fornisce un trasporto</b>: si prende $Y$ nel punto $\Phi_t(p)$ e lo si riporta indietro in $p$ con il differenziale di $\Phi_{-t}$.</p>
  <p>Si definisce allora la <b>derivata di Lie</b> come la velocità con cui $Y$ cambia lungo questo trasporto:
  $$\mathcal{L}_XY=\left.\frac{d}{dt}\right|_{0}(\Phi_{-t})_*Y,$$
  e il teorema dice che
  $$\mathcal{L}_XY=[X,Y].$$
  <b>La parentesi, definita algebricamente come commutatore di derivazioni, è la variazione di $Y$ trascinato dal flusso di $X$.</b> Le due definizioni coincidono, e questa è la seconda che dà il significato.</p>
  <p>Ne segue la caratterizzazione più utile: <b>$[X,Y]=0$ se e solo se i due flussi commutano</b>, cioè $\Phi^X_t\circ\Phi^Y_s=\Phi^Y_s\circ\Phi^X_t$ dove definiti. Il difetto di chiusura del quadratino — muoversi lungo $X$, poi $Y$, poi indietro — è quindi la manifestazione finita di un fatto infinitesimo.</p>
  <div class="note"><b>Perché questo importa oltre il corso.</b> In meccanica quantistica due osservabili sono <i>compatibili</i> — misurabili simultaneamente con precisione arbitraria — esattamente quando i loro operatori commutano, e gli operatori sono generatori di flussi nello spazio degli stati. <b>La frase «non commutano, quindi l'ordine della misura conta» e la frase «il quadratino non si chiude» sono la stessa frase</b>, scritte in due linguaggi. In meccanica analitica, la stessa struttura con le parentesi di Poisson dice quando due quantità conservate generano simmetrie indipendenti.</div>`},
  {t:'plot', title:'Due flussi che commutano, e due che non commutano',
   intro:R`Il percorso «lungo $X$ per $t$, poi lungo $Y$ per $t$» confrontato con l'ordine inverso, per due coppie di campi: le traslazioni (che commutano) e una traslazione con una rotazione (che non commutano).`,
   plots:[
    {kind:'phase', fx:'1', fy:'0', xr:[-2,2], yr:[-2,2], n:11, height:300,
     seeds:[[-1.5,0.8],[-1.5,0],[-1.5,-0.8]],
     title:'campo di traslazione: flusso rigido, commuta con le altre traslazioni'},
    {kind:'phase', fx:'-y', fy:'x', xr:[-2,2], yr:[-2,2], n:11, height:300,
     seeds:[[1.2,0],[0.6,0],[1.7,0]],
     title:'campo di rotazione: NON commuta con la traslazione'}
   ],
   leggi:R`<b>A sinistra</b> il flusso della traslazione: tutte le frecce sono uguali, e comporre due traslazioni in ordine diverso dà lo stesso risultato — la parentesi di due campi costanti è nulla, e infatti si possono usare come coordinate cartesiane.<br><br>
   <b>A destra</b> il flusso della rotazione. <b>Traslare e poi ruotare non è come ruotare e poi traslare</b>: la traslazione sposta il centro di rotazione, e il difetto è proprio $[X,Y]$. Il conto lo conferma — la parentesi fra il campo costante e quello rotazionale è un nuovo campo costante, perpendicolare al primo.<br><br>
   <b>La lettura che vale la pena tenere</b>: guardando i due ritratti si capisce senza calcolare quali campi commuteranno. Se le frecce di un campo sono <i>invarianti</i> lungo il flusso dell'altro, i due commutano. È una verifica visiva che spesso anticipa il conto e permette di controllarlo.`}
]},

/* ---------------- 05 · IL SENSO ---------------- */
{ num:'05', title:'Il senso, e le rotte', meta:'cosa lascia in mano, e dove il flusso e il linguaggio naturale',
  blocchi:[
  {t:'prosa', title:'Cosa lascia in mano', tag:'sintesi', html:R`
  <p><b>Il punto.</b> Un campo vettoriale e un gruppo a un parametro di diffeomorfismi sono <b>lo stesso oggetto</b> visto in due modi: infinitesimo e finito. Passare dall'uno all'altro è integrare o derivare, e quasi tutta la fisica teorica consiste nel fare quel passaggio in un verso o nell'altro — dai generatori alle trasformazioni, e viceversa.</p>
  <p>E un secondo punto, tecnico ma decisivo: <b>l'esistenza globale non è garantita</b>, e le condizioni che la garantiscono (compattezza, supporto compatto, omogeneità di gruppo) sono le stesse che in analisi garantiscono che le soluzioni non esplodano. <b>La geometria non aggiunge difficoltà: le rende visibili.</b></p>`},
  {t:'prolessi', title:'Dove riappare questo movimento, nella fisica che farai',
   oggetto:R`<b>Il flusso</b>: l'evoluzione temporale come famiglia di trasformazioni, generata da un campo.`,
   rotte:[
    {dove:'Meccanica<br>analitica', txt:R`Il <b>flusso hamiltoniano</b> è il flusso del campo generato da $H$ sullo spazio delle fasi; il teorema di Liouville dice che preserva il volume, e le simmetrie continue sono flussi di campi che commutano con quello dell'energia — cioè le quantità conservate.`},
    {dove:'Meccanica<br>statistica', txt:R`L'<b>ipotesi ergodica</b> è un'affermazione sul flusso sulla superficie di energia costante: che le medie temporali lungo una traiettoria coincidano con quelle d'insieme. <b>Compattezza della superficie e completezza del flusso sono le ipotesi che rendono l'enunciato ben posto.</b>`},
    {dove:'Meccanica<br>quantistica', txt:R`L'evoluzione temporale $e^{-iHt/\hbar}$ è un gruppo a un parametro di trasformazioni unitarie, generato dall'hamiltoniana: <b>è questa struttura, con lo spazio di Hilbert al posto della varietà</b>. Il teorema di Stone è l'analogo del teorema fondamentale sui flussi.`},
    {dove:'Sistemi<br>dinamici', txt:R`Attrattori, insiemi invarianti, sezioni di Poincaré, esponenti di Lyapunov: tutta la teoria studia il flusso senza risolverlo. <b>La sezione di Poincaré</b> è il modo di ridurre un flusso continuo a una mappa discreta, e si costruisce con la trasversalità.`}
   ],
   domanda:R`Il flusso di un campo a divergenza nulla preserva i volumi, e quindi non può avere attrattori: nessuna regione si contrae. Eppure i sistemi fisici reali dissipano e si assestano su stati di equilibrio. <b>Domanda che porti avanti:</b> come si concilia la conservazione del volume nello spazio delle fasi con l'irreversibilità che osserviamo? La risposta non sta nel flusso — che è reversibile e conserva tutto — ma in <b>come si osserva</b>: il volume si conserva ma si <i>filamenta</i>, distribuendosi in strutture sempre più sottili che qualunque misura a risoluzione finita non distingue da una distribuzione uniforme. <b>L'irreversibilità è un fatto sull'osservatore, non sul flusso</b>, ed è il punto da cui parte tutta la meccanica statistica.`}
]}

];

  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
    else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
    else if(b.t==='prolessi') m.appendChild(sectionProlessi(b));
    else if(b.t==='reveal')m.appendChild(sectionReveal(b.title,b.tag,b.steps));
    else if(b.t==='esercizio') m.appendChild(sectionEsercizio(b));
    else if(b.t==='collaudo')  m.appendChild(sectionCollaudo(b.title,b.items));
    else if(b.t==='plot')      m.appendChild(sectionPlot(b));
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}

/* deep-link: gd-15-flussi.html#03 apre direttamente la tappa 03 */
window.addEventListener('DOMContentLoaded', function(){
  var h=(location.hash||'').replace('#','');
  showTappa(byId[h]?h:'00');
});
window.addEventListener('hashchange', function(){
  var h=(location.hash||'').replace('#','');
  if(byId[h]) showTappa(h);
});
</script>
