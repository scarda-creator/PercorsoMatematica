<style>
  :root{

  .main{flex:1 1 auto;min-width:0;padding:24px 30px 90px;max-width:860px;}

  .gramwrap{background:var(--grambg);border:1px solid #1f4d47;border-radius:12px;padding:6px 6px;}

  /* ---- STRUMENTI (repertorio condiviso: la scheda si apre DENTRO la frase) ----
     Nessun accento nuovo: riusa il verde della grammatica, perche' uno strumento

  .str{color:var(--gram);border-bottom:1px dashed var(--gram);cursor:pointer;}
  .str:hover{background:var(--grambg);}
  .str::after{content:"\2666";font-size:.62em;vertical-align:.42em;margin-left:2px;opacity:.8;}
  .str.aperto::after{content:"\2715";}
  .str.rotto{color:#ff6b6b;border-bottom-color:#ff6b6b;cursor:help;}

  .strcard{display:block;margin:10px 0;background:var(--grambg);border:1px solid #1f4d47;

  table.protab td.pd{white-space:nowrap;color:var(--pro);width:1%;font-weight:700;font-size:.78rem;

  .rsteps{display:flex;flex-direction:column;gap:12px;}

  .rlabel{font-size:.7rem;font-weight:700;letter-spacing:.4px;color:var(--accent);

  .cq{margin-bottom:10px;}
  .ca{margin-top:12px;background:var(--okbg);border:1px solid #235c33;border-radius:8px;
    padding:10px 14px;font-size:.94rem;}

  /* ---- PREV / NEXT ---- */
  .prevnext{display:flex;justify-content:space-between;gap:12px;margin-top:40px;

  .pnbtn{flex:1 1 0;background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:12px 16px;cursor:pointer;color:var(--txt);text-align:left;transition:.14s;font:inherit;}

  .pnbtn .k{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}

  .pnbtn:disabled{opacity:.35;cursor:default;border-color:var(--border);background:var(--panel);}

  code{background:var(--panel2);border:1px solid var(--border);border-radius:5px;

  .katex{font-size:1.02em;color:var(--txt);} .katex-display{margin:.5em 0;overflow-x:auto;overflow-y:hidden;}

  @media(max-width:860px){
    .shell{flex-direction:column;}
    .sidebar{width:100%;flex:none;position:static;max-height:none;border-right:none;
      border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:4px;}
    .sidebar h2{width:100%;} .navitem{width:auto;}
    .main{padding:20px 16px 80px;}
  }
</style>

/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un
   rimando scritto nella prosa:

       <span class="str" data-str="serie-geometrica">la serie geometrica</span>

   Le schede citate da questo nucleo sono cucite qui sotto dal montaggio
   (assembla-nucleo.js): la pagina resta autosufficiente — niente fetch,

   Apertura: lo stesso gesto del collaudo (si clicca, il pannello compare,
   si typeset una volta sola), portato dentro la frase.
   =================================================================== */
var CORSO = 'astrofisica';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["elettronvolt"] = {"nome":"Elettronvolt","riga":"L'energia che un elettrone acquista attraversando una differenza di potenziale di un volt: $1\\ \\mathrm{eV}=1{,}602\\cdot10^{-19}$ J; divisa per $c^{2}$ è una massa, $1\\ \\mathrm{eV}/c^{2}=1{,}783\\cdot10^{-36}$ kg.","serve":"A leggere senza conversioni le tabelle in cui la fisica delle particelle e l'astrofisica scrivono le masse a riposo come energie — l'elettrone 0,511 MeV, il protone 938 MeV, il bosone di Higgs 125 GeV. La scelta non è una bizzarria di notazione: in un processo la quantità che si conserva è l'energia, e scrivere la massa già in energia dice a colpo d'occhio quali reazioni sono possibili e quante ne resta per l'energia cinetica o per i fotoni. L'elettronvolt ha anche un secondo mestiere, e in astrofisica è il più usato dei due: convertito in temperatura tramite $k_BT$ dà la scala termica a cui un processo di quella energia diventa frequente, e questo è ciò che permette di dire a che punto della storia dell'universo o a che profondità di una stella un certo processo si accende.","esempio":"Dalla massa del protone espressa come energia, $938{,}3$ MeV, si ricavano i chilogrammi in un passaggio: $m_p=938{,}3\\cdot10^{6}\\cdot1{,}783\\cdot10^{-36}=1{,}673\\cdot10^{-27}$ kg, che è il valore stampato in calce al foglio d'esame. Sul versante termico, $T=\\dfrac{1{,}602\\cdot10^{-19}}{1{,}381\\cdot10^{-23}}=11600$ K: un'energia di un elettronvolt corrisponde a poco più di undicimila kelvin, e siccome ionizzare l'idrogeno costa 13,6 eV si capisce subito perché serva una fotosfera da qualche decina di migliaia di kelvin per trovarlo ionizzato.","pieno":{"file":"as-01-la-scala-del-cosmo.html","tappa":"05","come":"le masse delle particelle elementari scritte come energie, con la conversione in chilogrammi e la gerarchia delle masse, nel movimento sulla scala del cosmo"},"controllo":[{"tipo":"numero","espr":"1.602177e-19/(2.99792458e8)**2*1e36","vale":"1.783","dove":"riga","appare":"1,783\\cdot10^{-36}"},{"tipo":"numero","espr":"938.3e6*1.783e-36*1e27","vale":"1.673","dove":"esempio","appare":"1,673\\cdot10^{-27}"},{"tipo":"numero","espr":"1.602e-19/1.381e-23","vale":"11600","dove":"esempio","appare":"11600"}]};
STRUM["funzione-zeta-di-riemann"] = {"nome":"Funzione zeta di Riemann","riga":"$\\zeta(s)=\\sum_{n\\ge1} n^{-s}$, convergente per $s>1$; i valori che servono sono $\\zeta(3/2)\\simeq 2{,}612$, $\\zeta(2)=\\pi^{2}/6\\simeq1{,}645$, $\\zeta(3)\\simeq1{,}202$, $\\zeta(4)=\\pi^{4}/90$.","serve":"Compare tutte le volte che una somma su stati discreti viene approssimata con un integrale e si sviluppa l'integrando in serie geometrica: si scambiano somma e integrale e resta una zeta moltiplicata per una gamma. Non e' un abbellimento — il valore NUMERICO di $\\zeta(3/2)$ decide se una transizione di fase esiste.","esempio":"$\\displaystyle\\int_{0}^{\\infty}\\frac{x^{s-1}}{e^{x}-1}dx=\\Gamma(s)\\zeta(s)$, che si ottiene scrivendo $\\frac{1}{e^{x}-1}=\\sum_{n\\ge1}e^{-nx}$ e integrando termine a termine. Per $s=4$ da' $\\pi^{4}/15$, che e' la costante che compare nella legge di Stefan-Boltzmann.","pieno":null,"qui":{"meccanica-statistica":{"serve":"E' cio' che rende la condensazione di Bose-Einstein un fatto e non una possibilita'. Il numero di particelle negli stati eccitati e' limitato superiormente da un integrale che vale $\\zeta(3/2)$: siccome quel numero e' FINITO, oltre una certa densita' le particelle in eccesso non hanno dove stare se non nello stato fondamentale.","esempio":"La condizione critica e' $n\\lambda^{3}=\\zeta(3/2)\\simeq2{,}612$, che definisce $T_{c}$. In due dimensioni lo stesso conto porta a $\\zeta(1)$, che DIVERGE: gli stati eccitati accolgono qualunque numero di particelle e la condensazione non avviene. La dimensionalita' entra nel risultato attraverso l'argomento della zeta, e il confine e' esattamente $s=1$."}}};
STRUM["funzione-gamma"] = {"nome":"Funzione Gamma","riga":"$\\Gamma(z)=\\displaystyle\\int_0^{\\infty}t^{z-1}e^{-t}\\,dt$, e da questa $\\displaystyle\\int_0^{\\infty}t^{k}e^{-at}\\,dt=\\dfrac{\\Gamma(k+1)}{a^{k+1}}$ per $a>0$.","serve":"E' il fattoriale esteso ai numeri non interi — $\\Gamma(n+1)=n!$ — e soprattutto e' la forma chiusa di TUTTI gli integrali del tipo «potenza per esponenziale». Sapere questa sola formula sostituisce una decina di integrazioni per parti, e permette di leggere a vista il risultato di un integrale appena si riconosce l'esponente della potenza.","esempio":"Da $\\Gamma(z+1)=z\\,\\Gamma(z)$, che si ottiene integrando per parti una volta, discende $\\Gamma(n+1)=n!$ per $n$ intero: $\\Gamma(1)=1$, $\\Gamma(2)=1$, $\\Gamma(3)=2$, $\\Gamma(4)=6$. Sui semi-interi il capostipite e' $\\Gamma(\\tfrac12)=\\sqrt\\pi$ — che e' l'integrale gaussiano travestito — e da li' $\\Gamma(\\tfrac32)=\\tfrac12\\sqrt\\pi$, $\\Gamma(\\tfrac52)=\\tfrac34\\sqrt\\pi$. Un integrale come $\\int_0^\\infty t^{2}e^{-at}dt$ vale dunque $\\Gamma(3)/a^{3}=2/a^{3}$, senza fare nessun conto.","pieno":null,"qui":{"meccanica-statistica":{"serve":"E' l'inventario degli integrali del canonico ridotto a una riga. Ogni funzione di partizione di singola particella e' un integrale di potenza per esponenziale — cambia solo l'esponente, e con esso la fisica: $t^{1/2}$ per il gas classico, $t^{2}$ per l'ultrarelativistico, $t^{3/n}$ per un potenziale $\\alpha r^{n}$. Riconoscere quale $\\Gamma$ si sta calcolando e' cio' che distingue chi risolve lo scritto in dieci minuti da chi lo risolve in un'ora.","esempio":"Per una particella relativistica con $\\varepsilon=cp$ la partizione porta $\\int_0^\\infty p^{2}e^{-\\beta cp}dp=\\Gamma(3)/(\\beta c)^{3}=2/(\\beta c)^{3}$, da cui $\\langle\\varepsilon\\rangle=3T$ invece dei $\\tfrac32T$ del caso non relativistico. Il fattore 3 contro $3/2$ viene per intero dall'esponente della potenza, cioe' dall'argomento della Gamma: la dipendenza dell'energia dalla quantita' di moto decide da sola quanto calore serve a scaldare il gas."}}};
STRUM["ordini-di-grandezza"] = {"nome":"Ordini di grandezza","riga":"Stimare una quantità alla potenza di dieci giusta: si tiene una cifra significativa, si sommano e si sottraggono gli esponenti, e si controlla che l'unità del risultato sia quella che si voleva.","serve":"A sapere se un risultato è plausibile prima di averlo calcolato con precisione, e ad accorgersi di un errore di impostazione quando c'è ancora tempo per rimediare. In astrofisica non è una comodità ma il modo normale di ragionare, per due ragioni: le grandezze in gioco vanno da $10^{-36}$ kg a $10^{53}$ kg e nessuna intuizione le copre, e i dati osservativi sono noti al dieci o al venti per cento, quindi una cifra significativa è spesso tutto ciò che il problema contiene davvero. Il controllo che smaschera più errori non è sul numero, è sull'**unità**: un conto che dovrebbe dare una densità e dà dei kg è sbagliato nell'impostazione, e nessun affinamento dell'aritmetica lo salverà. La seconda regola è il confronto con un termine noto — l'acqua per una densità, il Sole per una massa o una luminosità, il parsec per una distanza galattica — perché un numero senza metro non dice niente.","esempio":"Densità media del Sole, dalle due sole quantità stampate in calce al foglio d'esame, $M_\\odot=1{,}989\\cdot10^{30}$ kg e $R_\\odot=6{,}957\\cdot10^{8}$ m: $\\rho=\\dfrac{3M_\\odot}{4\\pi R_\\odot^{3}}=1410\\ \\mathrm{kg/m^3}$. Il confronto è immediato e istruttivo: è quasi una volta e mezza l'acqua, cioè il Sole è in media meno denso della Terra — una stella non è un sasso grande, è un gas tenuto insieme dal proprio peso.","pieno":{"file":"as-01-la-scala-del-cosmo.html","tappa":"01","come":"la gerarchia delle strutture cosmiche letta come scala di ordini di grandezza, e il tempo di luce come secondo asse della stessa tabella"},"controllo":[{"tipo":"numero","espr":"3*1.989e30/(4*pi*(6.957e8)**3)","vale":"1410","dove":"esempio","appare":"1410"}]};

function schedaHTML(s){

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

/* ---------------- 00 · PERCHÉ QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Perché questo movimento: un termometro che scende e lascia tracce', meta:'T = T₀(1+z) · soglie in MeV e in eV · residui misurabili oggi',
  blocchi:[
  {t:'prosa', title:'Una storia scritta in temperature', tag:'architettura', html:R`
  <p>L&rsquo;universo primordiale, dice la lezione 23 del 2020, <i>«è dominato da un bagno di radiazione termica. La temperatura cresce andando indietro nel tempo»</i>, come</p>
  <p>$$T=T_0(1+z)=\frac{T_0}{a} .$$</p>
  <p>Oggi $T_0=2{,}725$ K; a $z=1100$ erano 3000 K, a $z\sim4\cdot10^8$ un miliardo di kelvin, e così via all&rsquo;indietro. Ogni volta che $kT$ attraversa un&rsquo;energia caratteristica della fisica, la massa di una particella, un&rsquo;energia di legame, un ritmo di reazione confrontato con il ritmo dell&rsquo;espansione, succede qualcosa di irreversibile: una specie smette di essere creata, un legame smette di essere spezzato, una reazione smette di andare. E ciò che resta in quel momento resta per sempre, a meno della diluizione. La storia termica è una sequenza di soglie, e la cosmologia osservativa misura i residui.</p>
  <p>Due residui sono il cuore di questo movimento. Il primo è l&rsquo;elio: circa un quarto della massa dei barioni dell&rsquo;universo è elio-4 formato nei primi minuti, e la sua abbondanza si calcola con una catena di quattro passaggi che è, come dice la mappa del corso, <i>la derivazione più bella del corso e la più facile da raccontare come storia</i>. Il secondo è il fondo cosmico a microonde, il residuo della ricombinazione degli atomi di idrogeno, quando l&rsquo;universo è diventato trasparente.</p>
  <p>La mappa indica anche come si scrive questa parte: le prove chiedono epoche e temperature, e la procedura è sempre la stessa, <b>dato un processo, trovare la temperatura a cui si spegne e il redshift corrispondente</b>. La tappa 02 la scrive come procedura; le tappe 04 e 07 la applicano a due casi, la formazione del deuterio e la ricombinazione. Gli strumenti di calcolo sono l&rsquo;<span class="str" data-str="elettronvolt">elettronvolt</span> come unità di temperatura ($1$ eV $\leftrightarrow$ $11\,605$ K), la <span class="str" data-str="funzione-zeta-di-riemann">funzione zeta</span> e la <span class="str" data-str="funzione-gamma">funzione gamma</span> per contare i fotoni di un corpo nero, e gli <span class="str" data-str="ordini-di-grandezza">ordini di grandezza</span>.</p>`}
]},

/* ---------------- 01 · IL BAGNO TERMICO ---------------- */
{ num:'01', title:'Il bagno termico: T ∝ 1/a, quanti fotoni, quanti barioni', meta:'un corpo nero che resta corpo nero · 411 fotoni/cm³ · η ≈ 5·10⁻¹⁰ · t(T) in fase di radiazione',
  blocchi:[
  {t:'prosa', title:'Perché T va come 1/a', tag:'il fondamento', html:R`
  <p>La radiazione in equilibrio termico ha uno spettro di corpo nero. Nell&rsquo;espansione ogni lunghezza d&rsquo;onda si allunga come $a$, e il numero di fotoni in un volume comovente si conserva, perché dopo i primi istanti nessun processo li crea o li distrugge in quantità apprezzabile. La lezione 19 del 2017 mostra che le due cose insieme preservano la forma dello spettro: la densità di energia per intervallo di lunghezza d&rsquo;onda $u_\lambda\,d\lambda$ scala come $a^{-4}$, e sostituendo $\lambda=\lambda_0a/a_0$ nella legge di Planck lo spettro resta di Planck con la temperatura</p>
  <p>$$T=T_0\frac{a_0}{a},$$</p>
  <p>perché nell&rsquo;esponente compare $hc/\lambda kT$, che resta invariato solo se $\lambda T$ è costante. <i>«Uno spettro di corpo nero rimane uno spettro di corpo nero, ma varia la sua temperatura come l&rsquo;inverso del fattore di scala»</i>. Il raffreddamento è adiabatico, ed è quello che regge tutta la storia termica: la temperatura è un orologio, e $1+z=T/T_0$ lo legge.</p>`},
  {t:'prosa', title:'Quanti fotoni', tag:'n_γ', html:R`
  <p>Il numero di fotoni di un corpo nero per unità di volume si ottiene integrando la distribuzione di Planck: $n_\gamma=\frac{8\pi}{c^3}\int_0^\infty\frac{\nu^2d\nu}{e^{h\nu/kT}-1}$. Con $x=h\nu/kT$ l&rsquo;integrale diventa $\int_0^\infty x^2/(e^x-1)\,dx=\Gamma(3)\zeta(3)=2\zeta(3)$, con la <span class="str" data-str="funzione-gamma">funzione gamma</span> e la <span class="str" data-str="funzione-zeta-di-riemann">zeta di Riemann</span>, $\zeta(3)=1{,}202$. Il risultato è</p>
  <p>$$n_\gamma=\frac{2\zeta(3)}{\pi^2}\left(\frac{kT}{\hbar c}\right)^3,$$</p>
  <p>e per $T_0=2{,}725$ K, con $kT_0/\hbar c=1190$ m$^{-1}$, dà $n_\gamma=4{,}11\cdot10^8$ m$^{-3}$: i <i>«411 fotoni per cm$^3$»</i> della lezione. Scalano come $T^3$, cioè come $a^{-3}$: il loro numero in un volume comovente si conserva, come si era assunto.</p>`},
  {t:'prosa', title:'Quanti barioni per fotone', tag:'η', html:R`
  <p><i>«I fotoni sono un numero enorme rispetto ai barioni: ci sono circa 5 barioni ogni $10^{10}$ fotoni»</i>. Il conto si fa con la densità dei barioni di oggi: $\Omega_B=0{,}04$ della densità critica $9{,}2\cdot10^{-27}$ kg/m$^3$, diviso per la massa del protone, dà $n_b=0{,}22$ m$^{-3}$; diviso per $n_\gamma$,</p>
  <p>$$\eta=\frac{n_b}{n_\gamma}=\frac{0{,}04\cdot9{,}2\cdot10^{-27}/1{,}67\cdot10^{-27}}{4{,}11\cdot10^8}=5{,}4\cdot10^{-10} .$$</p>
  <p>Siccome sia $n_b$ sia $n_\gamma$ scalano come $a^{-3}$, $\eta$ è costante nel tempo. La lezione lo chiama <i>parametro di entropia specifica</i>, perché l&rsquo;entropia di un gas di fotoni è proporzionale al loro numero. È il numero più importante della storia termica: tutte le soglie di dissociazione sono spostate a temperature molto più basse delle energie di legame proprio perché $\eta$ è piccolo, come si vede alla tappa successiva.</p>`},
  {t:'prosa', title:'Il tempo in funzione della temperatura', tag:'t(T)', html:R`
  <p>Per legare le temperature agli istanti serve la fase di radiazione. De Bernardis, nella lezione 23 del 2020, lo fa in tre righe: $\dot a/a=-\dot T/T$, e Friedmann con la sola radiazione, $\rho=a_{\rm rad}T^4/c^2$, dà</p>
  <p>$$-\frac{\dot T}{T}=\left(\frac{8\pi G\,a_{\rm rad}T^4}{3c^2}\right)^{1/2}\quad\Longrightarrow\quad-\frac{dT}{T^3}=\left(\frac{8\pi G\,a_{\rm rad}}{3c^2}\right)^{1/2}dt\quad\Longrightarrow\quad t=\left(\frac{3c^2}{32\pi G\,a_{\rm rad}}\right)^{1/2}\frac{1}{T^2},$$</p>
  <p>cioè numericamente</p>
  <p>$$t=\frac{2{,}3\cdot10^{20}\ \mathrm{s\,K^2}}{T^2} .$$</p>
  <p>A $10^{12}$ K, $t=2{,}3\cdot10^{-4}$ s: la lezione scrive «circa 0,1 ms». La differenza è il punto debole della formula: conta solo i fotoni. A quelle temperature sono relativistici anche le coppie elettrone-positrone e tre specie di neutrini, che aumentano la densità di energia e accorciano i tempi; la lezione lo ricorda dicendo che <i>«$H$ va come $g^{1/2}T^2$»</i>, con $g$ il numero di gradi di libertà relativistici. Con tutti i contributi, contando $7/8$ per ogni grado di libertà fermionico, i gradi di libertà efficaci sono $g_*=2+\frac78(4+6)=10{,}75$ invece dei 2 dei soli fotoni (valore standard, non dalle slide): la densità è $5{,}4$ volte maggiore e i tempi si accorciano di $\sqrt{5{,}4}=2{,}3$, così che $2{,}3\cdot10^{-4}$ s diventa $1{,}0\cdot10^{-4}$ s, esattamente lo 0,1 ms della lezione. Nei conti delle prove si usa la formula a soli fotoni, come nelle slide.</p>
  <p>Con $kT=1{,}38\cdot10^{-23}\cdot10^{12}$ J $=1{,}4\cdot10^{-11}$ J $=86$ MeV, la lezione osserva che a $10^{12}$ K <i>«la T è molto alta, ma conosciamo molto bene le interazioni tra particelle a queste energie perché le possiamo studiare negli acceleratori»</i>. È il punto da cui la storia si racconta con fisica verificata.</p>`},
  {t:'prosa', title:'Lo stesso conto nel Marconi, e un conteggio che non torna', tag:'Marconi, cap. 9.1.2, pp. 130-131', html:R`
  <p>Marconi rifà lo stesso conto con la stessa sostituzione $x=h\nu/kT$ e lo scrive nella forma che si trova nei libri, con il coefficiente $2\zeta(3)/\pi^2=0{,}244$:</p>
  <p>$$N_\gamma=0{,}244\left(\frac{2\pi kT}{hc}\right)^3=412\ \mathrm{cm^{-3}}\left(\frac{T}{2{,}728\ \mathrm K}\right)^3,$$</p>
  <p>con la temperatura di COBE di allora, 2,728 K, invece del 2,725 di oggi. Sul conteggio dei barioni, però, il libro e le slide divergono, e vale la pena dire dove. Marconi divide la densità barionica per una massa media $\bar m=1{,}75\,m_p$, ottenuta pesando idrogeno ed elio con le frazioni in massa come se fossero frazioni in numero, e trova $N_\gamma/N_b=1{,}31\cdot10^8/(\Omega_bh_{70}^2)$, cioè, per $\Omega_b=0{,}04$, $N_\gamma/N_b=3{,}3\cdot10^9$. Ma il numero di <i>barioni</i> non dipende dalla composizione: protoni e neutroni hanno la stessa massa a meno di un millesimo, e $n_b=\rho_b/m_p$ sia che stiano in nuclei di idrogeno sia che stiano in nuclei di elio. Togliendo il fattore 1,75 resta $N_\gamma/N_b=1{,}87\cdot10^9$, cioè $\eta=5{,}3\cdot10^{-10}$, il valore di de Bernardis («5 barioni ogni $10^{10}$ fotoni»). La conferma viene dallo stesso Marconi, che nel capitolo sulla nucleosintesi usa $\eta_{10}=10^{10}\eta=274\,\Omega_bh^2$: con $\Omega_b=0{,}04$ e $h=0{,}7$, $274\cdot0{,}04\cdot0{,}49=5{,}37$. Lo dichiaro come incoerenza interna del libro: si usa $\eta\simeq5\cdot10^{-10}$.</p>`}
]},

/* ---------------- 02 · LA PROCEDURA ---------------- */
{ num:'02', title:'La procedura: dato un processo, a che temperatura si spegne?', meta:'tre tipi di soglia · il fattore ln(1/η) · Γ = H · da T a z e a t',
  blocchi:[
  {t:'prosa', title:'Tre tipi di soglia', tag:'la procedura', html:R`
  <p>De Bernardis, nella lezione 23, elenca le due conseguenze del bagno termico: <i>«quando la temperatura è tale che l&rsquo;energia dei fotoni ($h\nu$, dell&rsquo;ordine di $kT$) è maggiore dell&rsquo;energia di legame di una molecola (meV), o di un atomo (eV), o di un nucleo (MeV), lo stato legato non può esistere a causa della fotoionizzazione»</i>; e <i>«quando l&rsquo;energia dei fotoni è maggiore del doppio della massa a riposo $mc^2$ di una particella carica, l&rsquo;energia dei fotoni è sufficiente per creare coppie particella/antiparticella»</i>. Una procedura che funzioni per ogni processo ha cinque passi.</p>
  <p><b>Passo 1, la scala di energia.</b> Si individua l&rsquo;energia $E$ del processo: un&rsquo;energia di legame $B$, una soglia di creazione $2mc^2$, una differenza di massa. La stima ingenua è $T\approx E/k$.</p>
  <p><b>Passo 2, la correzione di $\eta$.</b> Se il processo è la dissociazione di uno stato legato da parte dei fotoni, la stima ingenua sbaglia di un fattore grande. Lo stato legato sopravvive quando i fotoni capaci di spezzarlo, con $h\nu\gt B$, diventano meno numerosi dei barioni. La frazione di fotoni sopra la soglia è dell&rsquo;ordine di $e^{-B/kT}$ (la coda di Wien), quindi la condizione è $\eta^{-1}e^{-B/kT}\approx1$, cioè</p>
  <p>$$kT\approx\frac{B}{\ln(1/\eta)} .$$</p>
  <p>Con $\eta=5\cdot10^{-10}$, $\ln(1/\eta)=21{,}4$: le soglie di dissociazione cadono a temperature venti volte più basse delle energie di legame. È ciò che la lezione dice con <i>«a causa del bassissimo valore di $\eta=n_B/n_\gamma$, i nuclei si formano solo a temperature molto più basse delle loro energie di legame»</i>, e lo stesso vale per gli atomi. Se serve più precisione, al posto della stima si usa l&rsquo;equazione di Saha.</p>
  <p><b>Passo 3, oppure il congelamento.</b> Se il processo è una reazione che mantiene un equilibrio, si spegne quando il suo ritmo $\Gamma=n\langle\sigma v\rangle$ scende sotto il ritmo dell&rsquo;espansione $H$: da quel momento una particella ha in media meno di un&rsquo;interazione per tempo di Hubble, e l&rsquo;abbondanza resta congelata. Gli stampati della lezione 20 lo scrivono per neutroni e protoni: <i>«il suo rate diventa inferiore al rate di espansione dell&rsquo;universo $\Gamma_H$»</i>.</p>
  <p><b>Passo 4, il redshift.</b> $1+z=T/T_0$, con $T_0=2{,}725$ K.</p>
  <p><b>Passo 5, il tempo.</b> Dal regime dominante: in radiazione $t=2{,}3\cdot10^{20}\,\mathrm{s}/T^2$ (in kelvin); in materia $t=\frac{2}{3H_0\sqrt{\Omega_{M0}}}(1+z)^{-3/2}$.</p>`},
  {t:'prosa', title:'Le soglie della storia', tag:'la tabella', html:R`
  <p>Con il passo 1 si costruisce la sequenza. Le coppie elettrone-positrone smettono di essere create quando $kT$ scende sotto $2m_ec^2=1{,}022$ MeV, cioè sotto $T=1{,}022\cdot10^6/8{,}617\cdot10^{-5}=1{,}19\cdot10^{10}$ K: è il <i>«intorno a $10^{10}$ K»</i> della lezione, dove <i>«i fotoni non possono più ricreare le coppie elettroni-positroni che si annichilano. Rimane solo un piccolo eccesso di elettroni»</i>, uno per protone. Le coppie di muoni ($2m_\mu c^2=211$ MeV) si sono spente prima, intorno a $10^{12}$ K. I nuclei si formano tra $10^9$ e $10^{10}$ K a seconda dell&rsquo;energia di legame, che la lezione elenca: deuterio $2{,}22$ MeV, trizio $6{,}92$ MeV (il valore tabulato è $8{,}48$ MeV, e lo dichiaro), elio-3 $7{,}72$ MeV, elio-4 $28{,}3$ MeV. Gli atomi di idrogeno, con $B=13{,}6$ eV, si formano a qualche migliaio di kelvin. Le molecole, con energie di legame di qualche eV ma formate da processi lenti, molto dopo.</p>`},
  {t:'prosa', title:'La stessa soglia contata con più cura: il 26,5 di Marconi', tag:'Marconi, cap. 9.2, pp. 132-133 e 139', html:R`
  <p>Il passo 2 approssima la frazione di fotoni sopra la soglia con $e^{-B/kT}$. Marconi integra la coda di Wien per intero e trova, con $x=E/kT$,</p>
  <p>$$\frac{N(\ge E)}{N}=\frac{e^{-x}(x^2+2x+2)}{0{,}244\,\pi^2} .$$</p>
  <p>Il polinomio davanti all&rsquo;esponenziale non è un dettaglio: per $x\approx26$ vale $26{,}5^2+2\cdot26{,}5+2=757$, e sposta la soglia. Chiedendo un fotone ionizzante ogni $10^9$, come fa Marconi, la soluzione è $x=26{,}5$; con l&rsquo;$\eta=5\cdot10^{-10}$ di de Bernardis viene $x=27{,}2$, contro il $\ln(1/\eta)=21{,}4$ della stima del passo 2. La forma esatta è dunque $kT\approx B/26{,}5$, e i numeri si spostano di un quarto. Per il deuterio, con $B_D=2{,}23$ MeV, $kT=2{,}23/26{,}5=0{,}084$ MeV, cioè $T=9{,}8\cdot10^8$ K, il «$10^9$ K» che de Bernardis e Marconi scrivono entrambi. Per l&rsquo;idrogeno, $T=13{,}6\ \mathrm{eV}/(26{,}5\,k)=5956$ K (Marconi, partendo da $150\,000/26{,}5$, scrive 5600 K): <i>«bastano poche migliaia di Kelvin a fronte di un&rsquo;energia di ionizzazione corrispondente a oltre 100.000 K!»</i>. Questa è la temperatura sopra la quale c&rsquo;è almeno un fotone ionizzante per barione, e cade a $z\approx2000$; che metà dell&rsquo;idrogeno sia davvero ionizzato lo decide la Saha, ed è più in basso (tappa 07).</p>
  <p>Sulle coppie elettrone-positrone le due fonti scelgono criteri diversi e hanno entrambe ragione. De Bernardis mette la soglia a $2m_ec^2=1{,}022$ MeV, sotto la quale un fotone medio non crea più coppie ($1{,}2\cdot10^{10}$ K); Marconi mette l&rsquo;annichilazione a $kT\approx m_ec^2$, cioè $T\approx5{,}9\cdot10^9$ K e $z\approx2\cdot10^9$, quando le coppie residue si annichilano davvero e cedono la loro energia ai fotoni, <i>«una piccola discontinuità nella derivata di T(z)… come in una transizione di fase»</i>. Il primo è l&rsquo;inizio del processo, il secondo il suo grosso.</p>`}
]},

/* ---------------- 03 · NEUTRONI E PROTONI ---------------- */
{ num:'03', title:'Da 10¹² a 10¹⁰ K: neutroni e protoni in equilibrio, poi il congelamento', meta:'Δm c² = 1,293 MeV · Boltzmann · 0,985 a 86 MeV · 0,223 a 10¹⁰ K',
  blocchi:[
  {t:'prosa', title:'L’equilibrio', tag:'il primo passo della catena', html:R`
  <p>A $10^{12}$ K le particelle relativistiche presenti erano fotoni, coppie elettrone-positrone, neutrini ed antineutrini elettronici e muonici. <i>«Inoltre c&rsquo;erano barioni, sotto forma di protoni e neutroni: circa 5 ogni $10^{10}$ fotoni»</i>. Protoni e neutroni si convertono continuamente gli uni negli altri con le reazioni deboli</p>
  <p>$$n+\nu_e\rightleftharpoons p+e^-,\qquad n+e^+\rightleftharpoons p+\bar\nu_e,\qquad n\to p+e^-+\bar\nu_e,$$</p>
  <p>che a quella temperatura sono facili, perché la differenza di massa</p>
  <p>$$\Delta E=(m_n-m_p)c^2=1{,}293\ \mathrm{MeV}$$</p>
  <p>è piccola rispetto all&rsquo;energia tipica delle particelle, $kT=86$ MeV. Finché le reazioni sono più veloci dell&rsquo;espansione, le densità obbediscono alla statistica di Boltzmann, e il rapporto dipende solo dalla differenza di energia:</p>
  <p>$$\frac{n_n}{n_p}=e^{-\Delta E/kT} .$$</p>
  <p>A $10^{12}$ K, $e^{-1{,}293/86}=0{,}985$: tanti neutroni quanti protoni, a meno dell&rsquo;$1{,}5\%$. (Il rapporto dei pesi statistici è 1, perché neutrone e protone hanno lo stesso spin.)</p>`},
  {t:'prosa', title:'Il congelamento', tag:'Γ < H', html:R`
  <p>Con il calare della temperatura il rapporto scende, finché intorno a $10^{10}$ K, cioè circa 1 MeV, <i>«avvengono due cose»</i>. La prima: <i>«ad energie poco superiori a $10^{10}$ K le sezioni d&rsquo;urto dei neutrini decrescono molto: a questo punto non possono più partecipare alle reazioni tra protoni e neutroni»</i>. La sezione d&rsquo;urto debole cresce come il quadrato dell&rsquo;energia, e la densità dei bersagli come $T^3$, così che il ritmo va come $T^5$ mentre $H$ va come $T^2$: il rapporto $\Gamma/H\propto T^3$ crolla in un intervallo stretto di temperatura, ed è per questo che il congelamento si può trattare come istantaneo. La seconda: le coppie elettrone-positrone si annichilano e non si ricreano. <i>«Il rapporto si congela quindi al valore che ha a $10^{10}$ K»</i>: con $kT=8{,}617\cdot10^{-5}\cdot10^{10}$ eV $=0{,}862$ MeV,</p>
  <p>$$\frac{n_n}{n_p}=e^{-1{,}293/0{,}862}=0{,}223,$$</p>
  <p>223 neutroni ogni 1000 protoni. Da qui in poi non si creano più neutroni. È la soglia di tipo «congelamento» della procedura, con $T_f\approx10^{10}$ K, $1+z=10^{10}/2{,}725=3{,}7\cdot10^9$ e $t=2{,}3\cdot10^{20}/10^{20}=2{,}3$ s.</p>
  <p>I neutrini, che a questo punto smettono di interagire, si disaccoppiano e viaggiano liberi da allora: formano un fondo cosmico di neutrini, che oggi ha una temperatura di circa $1{,}95$ K, più bassa di quella dei fotoni perché l&rsquo;annichilazione delle coppie, avvenuta dopo il loro disaccoppiamento, ha riscaldato solo i fotoni (il fattore è $(4/11)^{1/3}$, valore standard non presente nelle slide).</p>`},
  {t:'plot', title:'Il rapporto neutroni/protoni in equilibrio',
   intro:R`n_n/n_p = exp(−1,293 MeV/kT) contro T in unità di 10¹⁰ K (kT = 0,8617 MeV per T = 10¹⁰ K). Il punto marca il congelamento a 10¹⁰ K, come nella lezione; a temperature più basse il rapporto resta congelato (linea tratteggiata) e poi cala solo per il decadimento.`,
   plots:[
    {kind:'func2d', xr:[0.3,10], yr:[0,1], height:270, equal:false,
     title:'T / 10¹⁰ K      n_n / n_p',
     curves:[{f:'exp(-1.293/(0.8617*x))', col:'#5eead4', label:'equilibrio di Boltzmann'},
             {f:'0.223', col:'#d8a13a', label:'congelato a 0,223', dash:true}],
     marks:[{x:1, y:0.223, label:'10¹⁰ K: 0,223', col:'#d8a13a', up:true},
            {x:10, y:0.861, label:'10¹¹ K: 0,86', col:'#5eead4', up:false}]}
   ],
   leggi:R`<p><b>Che cosa guardare:</b> sopra qualche 10¹⁰ K il rapporto è vicino a 1; scende rapidamente sotto 10¹⁰ K, dove l'esponente supera 1. Il congelamento ferma la discesa proprio dove sarebbe diventata ripida.</p>
   <p><b>Che cosa impararne:</b> tutta l'abbondanza di elio è decisa da questo numero. Se il congelamento avvenisse a temperatura un po' più alta, ad esempio perché H è più grande per la presenza di altre specie relativistiche, il rapporto congelato sarebbe più alto, e l'elio di più: è il legame tra elio primordiale e numero di neutrini che la lezione chiama dipendenza da g.</p>`},
  {t:'prosa', title:'Un congelamento a 1 MeV o a 10¹⁰ K: Marconi e de Bernardis', tag:'Marconi, cap. 10.2, p. 147', html:R`
  <p>Marconi scrive la frazione di neutroni sul totale, non il rapporto, e congela a $kT=1$ MeV, la temperatura a cui i neutrini si disaccoppiano:</p>
  <p>$$\frac{n}{n+p}=\frac{e^{-\Delta mc^2/kT}}{1+e^{-\Delta mc^2/kT}}=0{,}216,$$</p>
  <p>cioè $n/p=0{,}275$, <i>«$4N_n\simeq N_p$»</i>. De Bernardis congela a $10^{10}$ K, dove $\Delta mc^2/kT=1{,}293/0{,}862=1{,}50$ invece di 1,29, e trova 0,223. La fisica è la stessa e i due numeri differiscono solo per la scelta dell&rsquo;istante: il congelamento non è istantaneo, e l&rsquo;esponenziale è sensibile alla temperatura scelta. È la ragione per cui Marconi dice che <i>«l&rsquo;$^4$He ha un&rsquo;abbondanza che è misura della temperatura a cui avviene il disaccoppiamento dei neutrini»</i>: cambiare quella temperatura del 15% cambia $n/p$ del 20%.</p>`}
]},

/* ---------------- 04 · IL DEUTERIO ---------------- */
{ num:'04', title:'Da 10¹⁰ a 10⁹ K: il decadimento dei neutroni e il collo di bottiglia del deuterio', meta:'617 s · 230 s · 172 neutroni su 1051 protoni · il primo esempio della procedura',
  blocchi:[
  {t:'prosa', title:'I neutroni liberi decadono', tag:'il secondo passo', html:R`
  <p><i>«Da qui in poi non si creano più nuovi neutroni. Ma la reazione di decadimento beta del neutrone libero rimane attiva, con un tempo di dimezzamento di 617 s»</i>. Il neutrone libero decade; quello legato in un nucleo stabile no. Ogni secondo che passa prima che i neutroni finiscano in nuclei ne perde una frazione $\ln2/617$. Il tempo che serve per scendere da $10^{10}$ a $10^9$ K si ricava dalla fase di radiazione,</p>
  <p>$$\Delta t=2{,}3\cdot10^{20}\left(\frac{1}{10^{18}}-\frac{1}{10^{20}}\right)\mathrm s=228\ \mathrm s\approx230\ \mathrm s,$$</p>
  <p>e in quel tempo i neutroni decadono secondo</p>
  <p>$$N_n(t)=N_n(0)\,e^{-t\ln2/t_{1/2}}=223\,e^{-230\ln2/617}=172 .$$</p>
  <p>I 51 neutroni decaduti sono diventati protoni: <i>«partendo da 223 n ogni 1000 p si arriva a 172 n ogni 1051 p»</i>. (Il tempo di dimezzamento misurato del neutrone è $611$ s, la vita media $880$ s; i $617$ s della slide sono un valore di qualche anno fa. De Bernardis, nella lezione 23, indica anche la vita media come <i>«il parametro di fisica nucleare più incerto in questi calcoli, $\tau=(10{,}5\pm0{,}2)$ min»</i>.)</p>`},
  {t:'prosa', title:'Perché il deuterio aspetta 10⁹ K: il primo esempio della procedura', tag:'esempio svolto 1', html:R`
  <p><i>«Solo a $10^9$ K diventa possibile formare nuclei di deuterio tramite la reazione $p+n\to{}^2\mathrm H+\gamma$, perché l&rsquo;energia dei fotoni diventa sufficientemente inferiore all&rsquo;energia di legame nucleare del deuterio, e le fotodissociazioni non sono più efficienti»</i>. Si applichi la procedura.</p>
  <p><b>Passo 1.</b> L&rsquo;energia è quella di legame del deuterio, $B_D=2{,}22$ MeV. La stima ingenua è $T=B_D/k=2{,}22\cdot10^6/8{,}617\cdot10^{-5}=2{,}6\cdot10^{10}$ K. Ma a quella temperatura ci sono ancora coppie elettrone-positrone e i neutroni non hanno neanche finito di congelarsi: chiaramente sbagliata.</p>
  <p><b>Passo 2.</b> È un processo di dissociazione, e ci sono $1/\eta=2\cdot10^9$ fotoni per barione. Ogni deuterone formato viene spezzato finché i fotoni con $h\nu\gt B_D$ sono più numerosi dei barioni, cioè finché $\eta^{-1}e^{-B_D/kT}\gt 1$:</p>
  <p>$$kT_D\approx\frac{B_D}{\ln(1/\eta)}=\frac{2{,}22\ \mathrm{MeV}}{21{,}4}=0{,}104\ \mathrm{MeV},\qquad T_D\approx1{,}2\cdot10^9\ \mathrm K .$$</p>
  <p>Il $10^9$ K della lezione. Il collo di bottiglia del deuterio sta tutto in quel 21: a causa del numero enorme di fotoni per barione, la temperatura di formazione è venti volte più bassa dell&rsquo;energia di legame.</p>
  <p><b>Passi 4 e 5.</b> $1+z=1{,}2\cdot10^9/2{,}725=4{,}4\cdot10^8$; $t=2{,}3\cdot10^{20}/(1{,}2\cdot10^9)^2=160$ s. Il deuterio si forma a meno di tre minuti dal Big Bang, quando l&rsquo;universo era quattrocento milioni di volte più piccolo di oggi.</p>
  <p>La reazione, una volta possibile, è efficiente: <i>«tutti i n producono nuclei di deuterio»</i>, e quasi subito il deuterio diventa elio.</p>`},
  {t:'prosa', title:'Due orologi diversi: perché Marconi trova 100 s e la lezione 230 s', tag:'Marconi, cap. 10.1-10.2, pp. 146-148', html:R`
  <p>Le due fonti legano tempo e temperatura con orologi diversi. De Bernardis usa $t=2{,}3\cdot10^{20}\,\mathrm s\,\mathrm K^2/T^2$, cioè $T=1{,}52\cdot10^{10}\,\mathrm K\,(t/1\,\mathrm s)^{-1/2}$; Marconi usa</p>
  <p>$$T=10^{10}\,\mathrm K\,(t/1\,\mathrm s)^{-1/2} .$$</p>
  <p>Il rapporto è $(10{,}75/2)^{1/4}=1{,}52$, esattamente: de Bernardis mette nella densità di radiazione solo i fotoni, Marconi anche neutrini e coppie, e siccome $\rho\propto g_*T^4$ e $t\propto\rho^{-1/2}$, a tempo fissato $T\propto g_*^{-1/4}$. Con l&rsquo;orologio di Marconi i $10^9$ K del deuterio arrivano a $t=100$ s, non a 230. Il suo calcolo dettagliato (fig. 10.2) dice che la sintesi vera avviene verso $t\approx300$ s: il deuterio comincia a sopravvivere a 100 s, ma le reazioni che lo portano in elio hanno bisogno di qualche minuto in più. Un refuso nel libro: la vita media del neutrone è scritta «8,857 s» e va letta 885,7 s; il tempo di dimezzamento della lezione, 617 s, corrisponde a una vita media $617/\ln2=890$ s.</p>`}
]},

/* ---------------- 05 · L'ELIO ---------------- */
{ num:'05', title:'L’elio primordiale: Y ≈ 0,25, e perché quasi tutti i neutroni ci finiscono', meta:'172 n → 86 nuclei di ⁴He · Y = 0,281 nel modello · gli altri nuclei leggeri · g ed η',
  blocchi:[
  {t:'prosa', title:'Il conto della lezione', tag:'il terzo passo', html:R`
  <p>Dal deuterio si forma l&rsquo;elio tramite reazioni a due corpi:</p>
  <p>$$^2\mathrm H+{}^2\mathrm H\to{}^3\mathrm H+p,\quad{}^2\mathrm H+{}^2\mathrm H\to{}^3\mathrm{He}+n,\quad{}^3\mathrm H+{}^2\mathrm H\to{}^4\mathrm{He}+n,\quad{}^3\mathrm{He}+{}^2\mathrm H\to{}^4\mathrm{He}+p .$$</p>
  <p><i>«Queste reazioni sono diverse da quelle (p-p) che producono l&rsquo;elio nelle stelle: le reazioni p-p hanno una sezione d&rsquo;urto così bassa che possono funzionare solo alle densità enormi dei centri delle stelle»</i>: la prima reazione della catena stellare, $p+p\to d+e^++\nu$, è debole, e qui non c&rsquo;è tempo; nella nucleosintesi primordiale i neutroni ci sono già, e il deuterio si forma per cattura elettromagnetica.</p>
  <p>L&rsquo;elio-4 ha l&rsquo;energia di legame per nucleone più alta tra i nuclei leggeri, $28{,}3/4=7{,}1$ MeV, e la catena finisce lì. Ogni nucleo di elio contiene due neutroni: i 172 neutroni disponibili formano 86 nuclei di elio, e rimangono $1051-172=879$ protoni liberi. La frazione in massa dell&rsquo;elio è</p>
  <p>$$Y=\frac{4N_{\rm He}}{N_{\rm H}+4N_{\rm He}}=\frac{4\cdot86}{879+4\cdot86}=0{,}281 .$$</p>
  <p>Lo stesso conto in forma chiusa: se tutti i neutroni finiscono in elio, con $r=n_n/n_p$ al momento della formazione,</p>
  <p>$$Y=\frac{2r}{1+r},$$</p>
  <p>e con $r=172/1051$ si ritrova $0{,}281$.</p>`},
  {t:'prosa', title:'Perché il modello dà troppo, e che cosa decide Y', tag:'onestà', html:R`
  <p>Le misure danno $0{,}236\lt Y\lt 0{,}254$, e il modello di lezione $0{,}281$. La differenza non è un errore di conto: il modello congela il rapporto $n/p$ esattamente a $10^{10}$ K e fa partire la formazione del deuterio a 230 s. Nei calcoli completi il congelamento è graduale e un po&rsquo; più tardo, a $kT\approx0{,}8$ MeV, con $n/p\approx1/6$, e la sintesi effettiva dell&rsquo;elio avviene verso $kT\approx0{,}07$ MeV, quando i neutroni sono già scesi a circa $1/7$ dei protoni: $Y=2/8=0{,}25$. Il grafico mostra quanto conta l&rsquo;istante: nel modello di lezione, $Y$ cala da $0{,}36$ a zero secondo una sola esponenziale, e per avere il valore misurato servirebbe aspettare circa 350 s.</p>
  <p>Il punto che resta è quello della lezione: <i>«l&rsquo;abbondanza di elio dipende soprattutto dall&rsquo;abbondanza di neutroni liberi a $t_{\rm He}$, e quindi è abbastanza indipendente da $\eta$»</i>. I due parametri cosmologici da cui dipende sono $g$, il numero di gradi di libertà relativistici a 1 MeV, e $\eta$. Un aumento di $g$, ad esempio una quarta specie di neutrino, aumenta $H\propto g^{1/2}T^2$, anticipa il congelamento e lascia più neutroni: più elio. Un aumento di $\eta$ anticipa la formazione del deuterio, perché il fattore $\ln(1/\eta)$ diminuisce, e lascia ai neutroni meno tempo per decadere: un po&rsquo; più di elio, ma <i>«$n_n/n_p$ varia lentamente con il tempo, e quindi questa dipendenza non è molto forte»</i>.</p>`},
  {t:'plot', title:'Y in funzione dell’istante di formazione del deuterio, nel modello di lezione',
   intro:R`Frazione in massa di elio Y = 2·223·exp(−t ln2/617)/1223 contro il tempo t (s) trascorso da 10¹⁰ K al momento in cui i neutroni finiscono in elio. Il punto è il valore di lezione (230 s, Y = 0,281); la fascia tratteggiata è l'intervallo misurato 0,236-0,254.`,
   plots:[
    {kind:'func2d', xr:[0,800], yr:[0,0.4], height:270, equal:false,
     title:'t (s)      Y',
     curves:[{f:'2*223*exp(-x*log(2)/617)/1223', col:'#5eead4', label:'Y(t), modello di lezione'},
             {f:'0.254', col:'#94a3b8', label:'misura: 0,254', dash:true},
             {f:'0.236', col:'#94a3b8', label:'misura: 0,236', dash:true}],
     marks:[{x:230, y:0.281, label:'230 s: 0,281', col:'#d8a13a', up:true},
            {x:354, y:0.245, label:'≈ 350 s: 0,245', col:'#f87171', up:false}]}
   ],
   leggi:R`<p><b>Che cosa guardare:</b> Y scende lentamente, con la scala di tempo di 617 s per dimezzare: un errore di un minuto sull'istante di formazione sposta Y di circa due centesimi.</p>
   <p><b>Che cosa impararne:</b> l'elio è un orologio. Misurato al percento, dice quanto è durato l'intervallo tra il congelamento e la nucleosintesi, e quindi quanto valeva H a 1 MeV: è così che l'elio primordiale ha limitato il numero di specie di neutrini leggeri a tre, prima degli acceleratori.</p>`},
  {t:'prosa', title:'Gli altri nuclei leggeri', tag:'D, ³He, ⁷Li', html:R`
  <p><i>«Via via che le reazioni che producono $^4$He da $^2$H e $^3$H procedono, la densità di $^2$H e $^3$H diminuisce, e di conseguenza diminuiscono le velocità di reazione $\Gamma\sim X_A\eta n_\gamma\langle\sigma v\rangle$. Molto presto queste reazioni si congelano, lasciando frazioni intorno a $X_A\sim10^{-4}$ di $^2$H e $^3$H»</i>. È il passo 3 della procedura applicato al deuterio stesso: si consuma finché il ritmo delle reazioni che lo distruggono supera $H$, e il ritmo è proporzionale a $\eta$. Quindi <i>«le abbondanze primordiali di $^2$H e $^3$H diminuiranno all&rsquo;aumentare di $\eta$»</i>, come $\eta^{-1/3}$ secondo la lezione 23: più barioni, più distruzione, meno residuo. Il deuterio è per questo il <i>barionometro</i>: la sua abbondanza misura $\eta$.</p>
  <p>Oltre l&rsquo;elio la sintesi si ferma per due ragioni. <i>«Le reazioni dirette tra due nuclei di He oppure tra He e H producono nuclei con masse 5 e 8, e siccome non ci sono isotopi stabili con tali masse, non portano a nulla. Nemmeno la reazione a tre corpi He+He+He = C produce nulla perché la densità di elio è ancora troppo bassa»</i>; e la barriera coulombiana cresce con $Z$. Si formano solo tracce di litio-7, per due vie: $^4\mathrm{He}+{}^3\mathrm H\to{}^7\mathrm{Li}+\gamma$, dominante per $\eta\lt 3\cdot10^{-10}$, e $^4\mathrm{He}+{}^3\mathrm{He}\to{}^7\mathrm{Be}+\gamma$ seguita dalla cattura elettronica, dominante sopra. Al passaggio tra le due, $\eta=3\cdot10^{-10}$, c&rsquo;è un minimo dell&rsquo;abbondanza di litio, dell&rsquo;ordine di $10^{-10}$. Il grafico delle abbondanze contro $\eta$ della lezione mostra le tre firme: il minimo del litio, il deuterio e l&rsquo;elio-3 che scendono, l&rsquo;elio-4 quasi costante intorno al $25\%$.</p>`},
  {t:'prosa', title:'Il conto completo: Y = 2 × 0,123', tag:'Marconi, cap. 10.2, pp. 148-149', html:R`
  <p>Marconi chiude il conto con il risultato del calcolo numerico: a $t\approx300$ s la frazione in massa dei neutroni è scesa a 0,123, e siccome <i>«per ogni coppia di neutroni che sopravvive si è formato un nucleo di He»</i>, la frazione in massa dell&rsquo;elio è doppia, $Y_p=2\cdot0{,}123=0{,}246$. È il valore che il modello di lezione, con $Y=0{,}281$, sovrastima perché congela prima e forma il deuterio prima: le due fonti concordano nella struttura del conto e differiscono negli istanti.</p>
  <p>Il libro aggiunge tre osservazioni che le slide non fanno. La nucleosintesi primordiale è esplosiva e dura circa 15 minuti, quella stellare procede per tempi lunghi in quasi equilibrio: per questo il processo triplo-$\alpha$, $3\,{}^4\mathrm{He}\to\mathrm C$, che nelle stelle funziona, qui non ha tempo. Il trizio prodotto è instabile, con un tempo di dimezzamento di 12,3 anni, e finisce in elio-3. E la fisica delle due famiglie di abbondanze è diversa: l&rsquo;elio-4 è termodinamico, fissato da $n/p$ al disaccoppiamento; deuterio, elio-3 e litio sono cinetici, fissati dalla velocità delle reazioni prima che la temperatura scenda troppo, e quindi da $\Omega_b$. Sul numero di neutrini, infine, Marconi riporta che lasciando $N_\nu$ libero nel fit delle abbondanze si otteneva $N_\nu=2{,}3$, a 1,5 deviazioni standard da 3, <i>«prima della misura di $N_\nu$ ottenuta al CERN col LEP»</i>: la nucleosintesi aveva già detto che le specie leggere non sono più di tre.</p>`}
]},

/* ---------------- 06 · LE MISURE ---------------- */
{ num:'06', title:'Come si misurano le abbondanze primordiali, e che cosa dicono', meta:'la foresta Lyman-α · lo spostamento isotopico del deuterio · η e Ω_B h² · i barioni non bastano',
  blocchi:[
  {t:'prosa', title:'Nubi illuminate da dietro', tag:'il metodo', html:R`
  <p>Per misurare un&rsquo;abbondanza primordiale bisogna osservare materia che le stelle non hanno ancora toccato. <i>«Si osservano nubi di materia in cui non si sono ancora formate stelle. Queste nubi non sono luminose, ma vengono illuminate “da dietro” da QSO, che emettono un potentissimo continuo»</i>. La luce del quasar viene assorbita da ogni nube che attraversa, alle lunghezze d&rsquo;onda delle transizioni delle specie presenti, con un assorbimento proporzionale all&rsquo;abbondanza; e la stessa transizione, in nubi a redshift diversi, cade a lunghezze d&rsquo;onda diverse:</p>
  <p>$$\frac{\lambda_{\rm nube}}{\lambda_{\rm QSO}}=\frac{1+z_{\rm nube}}{1+z_{\rm QSO}} .$$</p>
  <p>La riga Lyman-$\alpha$ dell&rsquo;idrogeno, 121,567 nm a riposo, è la più forte. Nello spettro della slide l&rsquo;emissione Ly$\alpha$ del quasar cade a 580 nm, quindi $1+z_{\rm QSO}=580/121{,}567=4{,}77$, $z_{\rm QSO}=3{,}77$; a lunghezze d&rsquo;onda minori il continuo è mangiato da centinaia di righe di assorbimento Ly$\alpha$ delle nubi intermedie, la <i>foresta Lyman-alfa</i>.</p>
  <p>Il deuterio si vede come una riga gemella accanto a quella dell&rsquo;idrogeno, perché <i>«ha una massa ridotta diversa»</i>. Le lunghezze d&rsquo;onda di un atomo idrogenoide sono proporzionali all&rsquo;inverso della massa ridotta $\mu=m_em_N/(m_e+m_N)$; passando dal protone al deuterone, che ha massa circa doppia, $\mu$ cresce e la riga si sposta verso il blu di</p>
  <p>$$\frac{\Delta\lambda}{\lambda}\approx-\frac{m_e}{2m_p}=-2{,}72\cdot10^{-4},$$</p>
  <p>cioè $-82$ km/s in velocità, $0{,}33$ Å a riposo. Le profondità delle due righe danno D/H.</p>`},
  {t:'prosa', title:'I numeri, e la conclusione sui barioni', tag:'i risultati', html:R`
  <p>De Bernardis riassume <i>«un grande numero di misure (non facili!)»</i>: $0{,}236\lt Y\lt 0{,}254$; D/H $=3{,}4\cdot10^{-5}$ oppure, in altre misure, $2{,}0\cdot10^{-4}$; $^7$Li/H $=2\cdot10^{-10}$ da stelle con bassissima abbondanza di elementi pesanti. <i>«Queste misure sono consistenti con 10,3 min \lt  τ \lt  10,7 min e $\eta=(1{,}5$-$6)\cdot10^{-10}$»</i>.</p>
  <p>Il passaggio da $\eta$ a $\Omega_B$ ha un refuso nella slide, che scrive $\eta=2{,}68\cdot10^{-10}\,\Omega_Bh^2$. Il coefficiente giusto si ricava dai numeri della tappa 01: $n_b=\Omega_B\rho_c/m_p$ con $\rho_c=1{,}88\cdot10^{-26}h^2$ kg/m$^3$, diviso per $n_\gamma=4{,}11\cdot10^8$ m$^{-3}$, dà</p>
  <p>$$\eta=\frac{1{,}88\cdot10^{-26}}{1{,}67\cdot10^{-27}\cdot4{,}11\cdot10^8}\,\Omega_Bh^2=2{,}73\cdot10^{-8}\,\Omega_Bh^2 .$$</p>
  <p>Con questo coefficiente le conclusioni della slide tornano: $\eta=(1{,}5$-$6)\cdot10^{-10}$ dà $\Omega_Bh^2=0{,}0055$-$0{,}022$, e con $h=0{,}7$ l&rsquo;intervallo $0{,}011\lt \Omega_B\lt 0{,}045$, vicino allo $0{,}011$-$0{,}037$ della slide. Con il coefficiente della slide verrebbe $\Omega_Bh^2\approx1$, assurdo. <i>«Recentemente si è creata una preferenza per valori di D/H bassi, il che consente di arrivare a valutare $\Omega_Bh^2=0{,}020\pm0{,}002$»</i>: con $h=0{,}7$, $\Omega_B=0{,}020/0{,}49=0{,}041$, e $\eta=2{,}73\cdot10^{-8}\cdot0{,}020=5{,}5\cdot10^{-10}$.</p>
  <p>La conclusione della lezione: <i>«la teoria è stata splendidamente confermata, implicando che davvero l&rsquo;universo ha attraversato una fase iniziale densa e calda, e che la densità di barioni non è sufficiente a ottenere $\Omega=1$»</i>. I barioni sono il $4\%$ della densità critica; la materia che pesano le galassie e gli ammassi è sette volte di più, e quindi non è barionica. L&rsquo;ultima osservazione delle slide è la prudenza: tutto dipende dal rapporto $n/p$ al congelamento in un universo perfettamente omogeneo, e inomogeneità diverse di $n$ e $p$ cambierebbero i risultati, ma è difficile costruirne di plausibili.</p>`},
  {t:'prosa', title:'Le misure secondo Marconi, e il confronto con la teoria', tag:'Marconi, cap. 10.3-10.4, pp. 150-155', html:R`
  <p>Il libro dà valori più recenti delle slide, e conviene metterli accanto. L&rsquo;elio si misura nelle regioni HII a bassa metallicità, estrapolando a metallicità zero (Izotov e Thuan, fig. 10.4): $Y_p=0{,}244\pm0{,}002$, dentro l&rsquo;intervallo 0,236-0,254 di de Bernardis. Il deuterio dalle righe in assorbimento davanti a quasar a $z\gt 2{,}5$ (fig. 10.5-10.6): D/H $=(2{,}6\pm0{,}4)\cdot10^{-5}$. Tra i due valori della slide, $3{,}4\cdot10^{-5}$ e $2\cdot10^{-4}$, ha vinto il primo, quello «basso» che la lezione dice preferito. Dal deuterio, il «barometro più sensibile», Marconi ricava $\eta_{10}=6{,}1$, cioè $\Omega_bh^2=6{,}1/274=0{,}0223$, <i>«in ottimo accordo con la stima indipendente dalle fluttuazioni di temperatura della CMB»</i>, $\Omega_bh^2=0{,}0224\pm0{,}0009$: due misure con fisica diversa, i primi minuti e i primi 380000 anni, che danno lo stesso numero.</p>
  <p>Il coefficiente 274 del libro, $\eta=274\cdot10^{-10}\,\Omega_bh^2=2{,}74\cdot10^{-8}\,\Omega_bh^2$, conferma la correzione dell&rsquo;esponente della slide fatta sopra. Il confronto completo del libro: elio-3, predetto $(1{,}0\pm0{,}1)\cdot10^{-5}$ e misurato $(1{,}1\pm0{,}2)\cdot10^{-5}$; elio-4, predetto 0,248 e misurato 0,244; litio, $[^7\mathrm{Li}/\mathrm H]=12+\log(\mathrm{Li/H})=2{,}3\pm0{,}3$ misurato contro 2,65 predetto. In numeri, Li/H $=10^{2{,}3-12}=2{,}0\cdot10^{-10}$, il valore di de Bernardis, contro $4{,}5\cdot10^{-10}$ predetti: un fattore 2,2 che il libro chiama accordo «entro 2$\sigma$» e che la letteratura chiama il problema del litio, perché il litio si distrugge nelle stelle e si produce per spallazione nei raggi cosmici, e l&rsquo;estrapolazione è delicata. La conclusione è la stessa delle slide, con il numero di Marconi: $\Omega_b=0{,}0449$ per $h=0{,}7$, cioè $\Omega_bh^2=0{,}022$, e <i>«gran parte della materia (oscura) deve essere non barionica»</i>.</p>`}
]},

/* ---------------- 07 · LA RICOMBINAZIONE ---------------- */
{ num:'07', title:'La ricombinazione e il disaccoppiamento: il secondo esempio della procedura', meta:'B = 13,6 eV · Saha con η · x = ½ a 3740 K · Γ_T = H · z ≈ 1100',
  blocchi:[
  {t:'prosa', title:'Saha per l’universo', tag:'esempio svolto 2', html:R`
  <p>De Bernardis, nella lezione 21 del 2017, tratta la ricombinazione come il secondo esempio della stessa logica. Elettroni e protoni possono combinarsi in atomi di idrogeno se l&rsquo;energia termica è inferiore all&rsquo;energia di legame dello stato fondamentale, $B=13{,}6$ eV. <b>Passo 1:</b> la stima ingenua è $T=B/k=13{,}6/8{,}617\cdot10^{-5}=157\,800$ K (la slide scrive 156000). <i>«In realtà, perché si formi un numero rilevante di atomi, la temperatura deve essere molto inferiore»</i>.</p>
  <p><b>Passo 2, nella versione precisa:</b> l&rsquo;equilibrio $e^-+p\rightleftharpoons\mathrm H+\gamma$ è descritto dall&rsquo;equazione di Saha, che si ricava dal bilancio dei potenziali chimici $\mu_e+\mu_p=\mu_{\rm H}$:</p>
  <p>$$\frac{n_en_p}{n_{\rm H}}=\left(\frac{2\pi m_ekT}{h^2}\right)^{3/2}e^{-B/kT} .$$</p>
  <p>Con la frazione ionizzata $x=n_e/n_b=n_p/n_b$ e $n_b=\eta n_\gamma$, si ha $n_p=n_e=x\eta n_\gamma$ e $n_{\rm H}=(1-x)\eta n_\gamma$, e la Saha diventa</p>
  <p>$$\frac{x^2}{1-x}=\frac{1}{\eta\,n_\gamma(T)}\left(\frac{2\pi m_ekT}{h^2}\right)^{3/2}e^{-B/kT}\equiv S(T),$$</p>
  <p>un&rsquo;equazione di secondo grado con soluzione $x=\frac12\left(\sqrt{S^2+4S}-S\right)$, come nella slide. Il fattore $1/\eta$ è enorme, $2\cdot10^9$, ed è quello che tiene ionizzato il gas fino a temperature molto più basse di $B/k$: anche quando la frazione di fotoni sopra 13,6 eV è minuscola, ce ne sono comunque più che atomi. Il calcolo con $\eta=5\cdot10^{-10}$ e $n_\gamma=4{,}11\cdot10^8(T/2{,}725)^3$ m$^{-3}$, fatto da me, dà $x=0{,}5$ a</p>
  <p>$$T_{1/2}=3740\ \mathrm K,\qquad 1+z=\frac{3740}{2{,}725}=1372,$$</p>
  <p>e $x=0{,}0045$ a 3000 K. De Bernardis usa 3000 K: <i>«essendo $\eta$ molto piccolo, la temperatura effettiva di ricombinazione è $T_{\rm rec}\sim3000$ K invece che 156000 K. Quindi $1+z_{\rm rec}=T_{\rm rec}/T_0\sim1100$»</i>.</p>`},
  {t:'plot', title:'La frazione ionizzata secondo Saha',
   intro:R`x(T) dall'equazione di Saha con η = 5·10⁻¹⁰, contro T in kelvin, calcolata nel grafico con la soluzione della quadratica. Il punto marca x = 1/2; la retta tratteggiata indica i 3000 K della lezione.`,
   plots:[
    {kind:'func2d', xr:[2500,5000], yr:[0,1], height:270, equal:false,
     title:'T (K)      x',
     curves:[{f:'(function(T){var ng=4.108e8*pow(T/2.725,3);var S=1/(5e-10*ng)*pow(2*PI*9.109e-31*1.381e-23*T/pow(6.626e-34,2),1.5)*exp(-13.6/(8.617e-5*T));return (sqrt(S*S+4*S)-S)/2;})(x)', col:'#5eead4', label:'Saha'}],
     marks:[{x:3740, y:0.5, label:'x = ½ a 3740 K', col:'#d8a13a', up:true},
            {x:3000, y:0.0045, label:'3000 K: x = 0,005', col:'#f87171', up:true}]}
   ],
   leggi:R`<p><b>Che cosa guardare:</b> la transizione da gas ionizzato a gas neutro avviene in meno di mille kelvin, tra 4500 e 3200 K, cioè tra z ≈ 1650 e z ≈ 1170.</p>
   <p><b>Che cosa impararne:</b> la ricombinazione non è istantanea; il fondo cosmico ha una superficie di emissione con uno spessore, ed è per questo che le sue anisotropie più piccole si mediano.</p>`},
  {t:'prosa', title:'Quando Saha smette di valere, e quando l’universo diventa trasparente', tag:'i due congelamenti', html:R`
  <p>La Saha vale finché la reazione di ricombinazione riesce a mantenere l&rsquo;equilibrio. Il suo ritmo, $\Gamma_{\rm rec}=n_p\langle v\sigma\rangle$, cala con la densità dei protoni liberi, e quando scende sotto $H$ la ricombinazione si ferma (passo 3). Il grafico della lezione mostra che i due ritmi sono uguali a circa 2700 K, <i>«quando la frazione ionizzata è dell&rsquo;ordine di $5\cdot10^{-4}$. Si può quindi pensare che solo $10^{-4}$ dell&rsquo;idrogeno rimanga ionizzato anche dopo la ricombinazione»</i>.</p>
  <p>La trasparenza è un altro congelamento, quello dei fotoni. A queste energie i fotoni interagiscono con gli elettroni liberi per scattering Thomson, $\sigma_T=6{,}65\cdot10^{-29}$ m$^2$, e con gli atomi per scattering Rayleigh, $\sigma_R=\sigma_T(E_\gamma/B)^4$, trascurabile. Il ritmo di scattering di un fotone è $\Gamma_T=x\,n_b\sigma_Tc$, e <i>«dal momento in cui $\Gamma_\gamma\lt \Gamma_H$ in poi i fotoni si propagano liberamente»</i>. Il conto, che è mio, mostra dove. A $z=1100$, $n_b=\eta n_\gamma=5\cdot10^{-10}\cdot4{,}11\cdot10^8\cdot1101^3=2{,}74\cdot10^8$ m$^{-3}$; se il gas fosse tutto ionizzato,</p>
  <p>$$\Gamma_T=n_b\sigma_Tc=2{,}74\cdot10^8\cdot6{,}65\cdot10^{-29}\cdot3\cdot10^8=5{,}5\cdot10^{-12}\ \mathrm{s^{-1}},$$</p>
  <p>mentre $H(z=1100)=H_0\sqrt{0{,}3\cdot1101^3+8{,}5\cdot10^{-5}\cdot1101^4}=5{,}2\cdot10^{-14}$ s$^{-1}$. Il rapporto è 105: i fotoni diventano liberi quando la frazione ionizzata scende sotto $1/105\approx0{,}01$, che secondo la Saha succede intorno ai 3100 K. <i>«Dal grafico risulta che la trasparenza inizia a T = 3000 K, cioè z = 3000/2,7 = 1100. I fotoni presenti in equilibrio termico nell&rsquo;universo primordiale subiscono l&rsquo;ultimo scattering a z = 1100»</i>: è la superficie di ultimo scattering, da cui viene il fondo cosmico.</p>`},
  {t:'reveal', title:'La superficie di ultimo scattering in temperature e tempi (prova del 14/09/2007, es. 2, letta in chiave termica)', tag:'svolto', steps:[
   {label:'Il dato', body:R`<p>La prova assume che i fotoni del fondo provengano da redshift compresi tra $z_1=1000$ (fine della ricombinazione) e $z_2=1200$ (inizio), con $\Omega_{M0}=0{,}3$, $\Omega_\Lambda=0{,}7$, $H_0=72$ km/s/Mpc. La prova chiede le distanze; qui chiedo temperature e tempi, con $H_0=70$.</p>`},
   {label:'Le temperature', body:R`<p>$T=T_0(1+z)$: $T_1=2{,}725\cdot1001=2728$ K, $T_2=2{,}725\cdot1201=3273$ K. Confrontate con la Saha: a 3273 K la frazione ionizzata è ancora intorno al $4\%$, a 2728 K è sotto lo $0{,}1\%$. L&rsquo;intervallo della prova è quello in cui il gas passa da opaco a trasparente.</p>`},
   {label:'L’epoca', body:R`<p>In fase di materia, $t=\frac{2}{3H_0\sqrt{\Omega_{M0}}}(1+z)^{-3/2}$. A $z=1100$: $t=5{,}36\cdot10^{17}\ \mathrm s/36\,533=1{,}47\cdot10^{13}$ s, circa 465000 anni. La radiazione, che a quell&rsquo;epoca vale ancora il $30\%$ della materia, accorcia questo tempo: il valore standard è 380000 anni, quello delle slide.</p>`},
   {label:'La durata', body:R`<p>Tra $z=1200$ e $z=1000$: $\Delta t=5{,}36\cdot10^{17}(1001^{-3/2}-1201^{-3/2})$ s, cioè circa 128000 anni. La ricombinazione dura un quarto dell&rsquo;età che l&rsquo;universo aveva allora.</p>`}
  ]},
  {t:'prosa', title:'La barriera dei fotoni e il disaccoppiamento termico', tag:'Marconi, cap. 9.2-9.3, pp. 133-138', html:R`
  <p>Tre numeri per la ricombinazione circolano tra le fonti, e non si contraddicono: rispondono a domande diverse. Marconi dà metà dell&rsquo;idrogeno ionizzato a $z\approx1500$, la Saha di questa tappa a $z=1372$, de Bernardis la trasparenza a $z=1100$. Il libro quantifica l&rsquo;opacità con la profondità ottica Thomson accumulata in fase di materia,</p>
  <p>$$\tau_T=\frac{9\sigma_TH_0c}{32\pi Gm_p}\frac{\Omega_b}{\Omega_0^{1/2}}\int_{z_1}^{z_2}x(z)\,z^{1/2}dz,\qquad\frac{9\sigma_TH_0c}{32\pi Gm_p}=0{,}0363,$$</p>
  <p>e con il gas tutto ionizzato tra $z=1000$ e 1500, $\int z^{1/2}dz=\frac23\left(1500^{3/2}-1000^{3/2}\right)$, trova $\tau_T(1000\to1500)=47$ (con $\Omega_b=0{,}04$, $\Omega_0=0{,}3$). Oltre $z\approx1500$ l&rsquo;universo non è osservabile con i fotoni: è una <i>photon barrier</i>, <i>«lo stesso identico processo che ci impedisce di vedere all&rsquo;interno del Sole»</i>.</p>
  <p>Marconi aggiunge un secondo disaccoppiamento che le slide non trattano, quello termico. Prima della ricombinazione la materia ha la temperatura della radiazione perché gli elettroni, circondati da $10^9$ fotoni ciascuno, vi sono «agganciati»: il tempo in cui una differenza di temperatura viene riassorbita è $\tau_{ex}=\frac{3m_ec^2}{16\sigma_T\sigma T_0^4}z^{-4}=7{,}35\cdot10^{19}z^{-4}$ s, cioè 0,46 anni a $z=1500$, contro un&rsquo;età di $2{,}9\cdot10^5$ anni: un rapporto di $1{,}6\cdot10^{-6}$. Dopo la ricombinazione la frazione ionizzata residua, $x\approx2{,}5\cdot10^{-5}$, basta a mantenere l&rsquo;accoppiamento fino a $z/1000=0{,}09^{2/5}$, cioè $z=382$ (i calcoli dettagliati danno 150). Da lì in poi il gas si raffredda come $a^{-2}$, la radiazione come $a^{-1}$, ed è la temperatura del gas, non quella dei fotoni, che entra nella massa di Jeans delle prime strutture.</p>`}
]},

/* ---------------- 08 · LA SEQUENZA ---------------- */
{ num:'08', title:'La sequenza intera: era della radiazione, equivalenza, era della materia', meta:'una retta in scala logaritmica · gli eventi lungo la retta · che cosa resta di ciascuno',
  blocchi:[
  {t:'prosa', title:'L’equivalenza', tag:'il cambio di regime', html:R`
  <p>La temperatura come orologio funziona con due leggi diverse. In fase di radiazione $T\propto t^{-1/2}$; in fase di materia $a\propto t^{2/3}$ e quindi $T\propto t^{-2/3}$. Il passaggio è l&rsquo;equivalenza, quando le densità di radiazione e materia sono uguali: $a_{\rm eq}=\Omega_{R0}/\Omega_{M0}$. Con $\Omega_{R0}=8{,}5\cdot10^{-5}$ e $\Omega_{M0}=0{,}3$, $1+z_{\rm eq}=0{,}3/8{,}5\cdot10^{-5}=3529$, $T_{\rm eq}=2{,}725\cdot3529=9618$ K, e $t_{\rm eq}$ dell&rsquo;ordine di $5\cdot10^4$ anni. L&rsquo;equivalenza viene prima della ricombinazione: quando gli atomi si formano, la materia domina già da trecentomila anni. È una distinzione che conta per la crescita delle strutture, perché le perturbazioni di materia oscura cominciano a crescere davvero solo dopo l&rsquo;equivalenza.</p>`},
  {t:'plot', title:'La storia termica in un grafico',
   intro:R`log₁₀ T (K) contro log₁₀ t (s). In ciano la fase di radiazione, T = (2,3·10²⁰/t)^{1/2}; in oro la fase di materia, T = 2,725 (t/5,36·10¹⁷ s)^{−2/3}; ciascuna vale nel proprio tratto, prima o dopo l’equivalenza. I punti sono gli eventi del movimento.`,
   plots:[
    {kind:'func2d', xr:[-5,18], yr:[0,13], height:310, equal:false,
     title:'log₁₀ t (s)      log₁₀ T (K)',
     curves:[{f:'(log(2.3e20)/log(10)-x)/2', col:'#5eead4', label:'radiazione: T ∝ t^{−1/2}'},
             {f:'log(2.725)/log(10)-(2/3)*(x-log(5.36e17)/log(10))', col:'#d8a13a', label:'materia: T ∝ t^{−2/3}'}],
     marks:[{x:-3.64, y:12, label:'10¹² K: equilibrio n-p', col:'#f87171', up:true},
            {x:0.36, y:10, label:'10¹⁰ K: congelamento n/p', col:'#f87171', up:true},
            {x:2.2, y:9.08, label:'1,2·10⁹ K: deuterio, elio', col:'#f87171', up:false},
            {x:12.2, y:3.98, label:'equivalenza', col:'#b98cff', up:true},

   <p><b>Che cosa impararne:</b> ogni soglia della procedura è un punto su queste rette. Dato T, il grafico dà t e z; dato un processo, la procedura dà T.</p>`},
  {t:'prosa', title:'Che cosa resta di ciascuna soglia', tag:'i residui', html:R`
  <p>Il congelamento dei neutrini lascia un fondo di neutrini a 1,95 K, mai osservato direttamente ma visibile nella densità di radiazione. L&rsquo;annichilazione delle coppie lascia un elettrone per protone e scalda i fotoni. Il congelamento di $n/p$ e il decadimento dei neutroni lasciano l&rsquo;elio, il $25\%$ dei barioni, e le tracce di deuterio, elio-3 e litio. La ricombinazione lascia gli atomi neutri e, soprattutto, i fotoni liberi del fondo cosmico, un corpo nero a 2,725 K con le increspature della materia di allora. De Bernardis chiude la lezione con l&rsquo;osservazione che dà senso a tutto: la nucleosintesi permette <i>«conclusioni quantitative molto precise e confutabili»</i>, e finora le ha superate tutte.</p>`},

  <p>Marconi mette l&rsquo;inizio della fase di radiazione a $z_{\rm rad}\approx6000$, quasi il doppio del 3529 di questa tappa. La differenza è nei neutrini: il libro conta solo i fotoni, $0{,}3/5{,}04\cdot10^{-5}=5952$; i neutrini aggiungono $\frac{21}{8}\left(\frac{4}{11}\right)^{4/3}=0{,}681$ volte la densità dei fotoni, e con loro $0{,}3/(5{,}04\cdot10^{-5}\cdot1{,}681)=3541$. È lo stesso fattore $g_*$ della differenza tra gli orologi della tappa 04, che ritorna.</p>
  <p>Andando indietro oltre la nucleosintesi il libro elenca le tappe che le slide lasciano fuori: la barriera dei neutrini, analoga a quella dei fotoni, prima dell&rsquo;annichilazione delle coppie; l&rsquo;epoca a $kT\approx1$ GeV, $T\approx1{,}2\cdot10^{13}$ K e $z\approx4\cdot10^{12}$, in cui si annichilano barioni e antibarioni, e il problema dell&rsquo;asimmetria: <i>«dovevano esistere $10^9+1$ barioni per ogni $10^9$ antibarioni»</i>, così che resta un barione ogni $10^9$ fotoni, il nostro $\eta$, con la violazione di CP dei mesoni $K^0$ come indizio. E infine l&rsquo;era di Planck, che Marconi scrive $t_P=(Gh/c^5)^{1/2}=1{,}35\cdot10^{-43}$ s con la costante $h$; con $\hbar$, come si usa e come nella prova del 14/09/2007, è $5{,}4\cdot10^{-44}$ s.</p>`}

var byId = {}; TAPPE.forEach(function(s){ byId[s.num]=s; });

var VKEY='pm-nucleoas-17-visited';
function loadSeen(){ try{ return new Set(JSON.parse(localStorage.getItem(VKEY)||'[]')); }catch(e){ return new Set(); } }
function saveSeen(s){ try{ localStorage.setItem(VKEY, JSON.stringify(Array.from(s))); }catch(e){} }
var SEEN = loadSeen();

function renderNav(active){
  var nav=document.getElementById('sidebar');
  nav.innerHTML='';
  var h=document.createElement('h2'); h.textContent='Nucleo as-17 · le tappe'; nav.appendChild(h);
  TAPPE.forEach(function(s){
    var b=document.createElement('button');
    b.className='navitem'+(active===s.num?' active':'')+(SEEN.has(s.num)?' seen':'');
    b.innerHTML='<span class="dot"></span><span class="nx">'+s.num+'</span><span>'+s.title+'</span>';
    b.onclick=function(){ showTappa(s.num); };
    nav.appendChild(b);
  });
}

/* ---- renderer dei blocchi ---- */
function sectionProsa(title, tag, html){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var body=elFromHTML('<div class="open-body">'+html+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function sectionGram(title, rows){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag gramtag">grammatica</span></h3>';
  var inner='<table class="gramtab">';
  rows.forEach(function(r){ inner+='<tr><td class="gs">'+r[0]+'</td><td>'+r[1]+'</td></tr>'; });
  inner+='</table>';
  var body=elFromHTML('<div class="gramwrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
/* --- blocco PLOT: la figura non decora, si legge. Ogni plot porta una chiave di lettura. --- */
function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';
  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionSvelabile(title, tag, html, sol){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var c=document.createElement('div'); c.className='collaudo-item';
  var q=document.createElement('div'); q.className='cq'; q.innerHTML=html||'';
  c.appendChild(q); typeset(q);
  if(sol){
    var a=document.createElement('div'); a.className='ca'; a.style.display='none';
    a.innerHTML='<b>Soluzione.</b> '+sol;
    var btn=document.createElement('button'); btn.className='reveal-btn small';
    btn.textContent='Rivela la soluzione';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a);
      btn.disabled=true; btn.classList.add('done'); btn.textContent='Soluzione rivelata'; };
    c.appendChild(btn); c.appendChild(a);
  }
  wrap.appendChild(c); return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    /* DUE SCHEMI, NON UNO — scoperto il 2026-10-06 provando le pagine vive. I movimenti
       scritti per primi (em-01..03, me-10b, i collaudi di gd-01..09 e di quattro em)
       usano una forma piu' semplice: `reveal` e `prolessi` con un solo `html`,
       `esercizio` e `collaudo` con `html` + `sol`. Il renderer ne conosceva una sola e
       chiamava `steps.forEach` su `undefined`: TypeError, e la tappa si fermava li' —
       62 blocchi in 17 movimenti su 74. Non si riscrive il contenuto per far contento
       il renderer: e' il renderer che deve leggere cio' che c'e'.
       E in fondo un ramo che NON muore: uno schema nuovo di domani deve far vedere un
       avviso in quella sezione, non spegnere la pagina sotto di se'. */
    try{
      if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
      else if(b.t==='prolessi') m.appendChild(b.rotte ? sectionProlessi(b)
                                   : sectionProsa(b.title,'prolessi',b.html));
      else if(b.t==='reveal')m.appendChild(b.steps ? sectionReveal(b.title,b.tag,b.steps)
                                   : sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='esercizio') m.appendChild(b.steps ? sectionEsercizio(b)
                                   : sectionSvelabile(b.title,'esercizio',b.html,b.sol));
      else if(b.t==='collaudo')  m.appendChild(b.items ? sectionCollaudo(b.title,b.items)
                                   : sectionSvelabile(b.title,'provi, poi riveli',b.html,b.sol));
      else if(b.t==='plot')      m.appendChild(sectionPlot(b));
      else m.appendChild(sectionProsa(b.title||'(blocco)', 'tipo sconosciuto: '+b.t,
                                      b.html||''));
    }catch(err){
      var avv=document.createElement('section'); avv.className='section';
      avv.innerHTML='<h3>'+(b.title||'(blocco)')+'<span class="tag">non reso</span></h3>'
        +'<p style="color:#ff6b6b">Questo blocco non si &egrave; potuto rendere ('
        +b.t+': '+err.message+'). Il resto della tappa continua sotto.</p>';
      m.appendChild(avv);
    }
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* I POP-UP DEGLI STRUMENTI. `cablaStrumenti` esisteva dal 18-09 e non la chiamava
     nessuno: i 229 rimandi del percorso erano <span> senza handler, e il clic non
     faceva niente. Nessun controllo poteva vederlo — la sintassi era valida, le schede
     c'erano tutte, le formule rendevano: il guasto esisteva solo a pagina viva. Qui, e
     dopo ogni inserimento successivo, perche' la tappa si rimonta da capo a ogni
     cambio e gli handler vanno riattaccati al DOM nuovo. */
  cablaStrumenti(m);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}
