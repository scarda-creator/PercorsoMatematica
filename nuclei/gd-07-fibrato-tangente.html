/* ---------------- 00 · DI COSA PARLA QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Di cosa parla questo movimento', meta:'Geometria Differenziale · voci G.13, G.14, R.6 · da tanti spazi tangenti a una varieta sola',
  blocchi:[
  {t:'prosa', title:'Il salto', tag:'architettura', html:R`
  <p>Lo spazio tangente è uno spazio vettoriale $T_pM$ <b>per ogni punto</b>. Sono infiniti spazi separati, e finché restano separati non si può parlare di un vettore che varia <i>con continuità</i> da punto a punto — cioè non si può definire un <b><span class="str" data-str="campo-vettoriale">campo vettoriale</span></b>, che è l&rsquo;oggetto con cui si scrivono tutte le equazioni differenziali.</p>
  <p>La mossa è metterli insieme:
  $$TM=\bigsqcup_{p\in M}T_pM,$$
  e mostrare che quell&rsquo;unione disgiunta è <b>essa stessa una varietà</b>, di dimensione $2n$. Un suo punto è una coppia (punto, vettore in quel punto). La costruzione segue il criterio che fa nascere una varietà da un insieme e da delle carte — insieme, carte, transizioni lisce — e le transizioni risultano essere le jacobiane delle transizioni di $M$.</p>
  <p>Fatto questo, un campo vettoriale diventa semplicemente una <b>sezione</b>: una mappa $X:M\to TM$ che a ogni punto assegna un vettore <i>in quel punto</i>. E «liscio» ha già senso, perché sia $M$ sia $TM$ sono varietà lisce. <b>Tutto il movimento serve a rendere ovvia quest&rsquo;ultima frase</b>, e a metterla al lavoro sui campi che Diverio chiede di verificare in quattro prove su cinque.</p>
  <p><b>Il filo.</b> La prima tappa costruisce $TM$ con le carte naturali; la seconda lo costruisce di nuovo per una sottovarietà di $\mathbb{R}^N$, come luogo di zeri, alla maniera di Manetti e del foglio 4; la terza isola le transizioni — il cociclo jacobiano — e mostra che un cociclo basta a fabbricare un fibrato. La quarta definisce i campi, con il criterio che separa un campo «rozzo» da uno liscio; la quinta verifica i campi delle prove d&rsquo;esame; la sesta chiede quando il fibrato è un prodotto, e incontra la palla pelosa; la settima guarda i campi come operatori.</p>`}
]},

/* ---------------- 01 · IL FIBRATO ---------------- */
{ num:'01', title:'Il fibrato tangente come varieta', meta:'le carte naturali · le transizioni · Hausdorff e base numerabile · il differenziale globale',
  blocchi:[
  {t:'prosa', title:'Le carte, e la struttura', tag:'costruzione', html:R`
  <p>Da una carta $(U,\varphi)$ di $M$ con coordinate $x^i$ si ottiene una carta di $TM$ su $\pi^{-1}(U)$:
  $$\left(p,\ \sum_i v^{i}\frac{\partial}{\partial x^{i}}\Big|_p\right)\ \longmapsto\ (x^1,\dots,x^n,v^1,\dots,v^n)\in\mathbb{R}^{2n}.$$
  <b>Le prime $n$ coordinate dicono dove si è, le altre $n$ quale vettore si ha</b>: Lee le chiama <b>coordinate naturali</b> su $TM$ (formula 3.13). L&rsquo;immagine è $\varphi(U)\times\mathbb{R}^n$, aperta in $\mathbb{R}^{2n}$, e la mappa è biunivoca perché la sua inversa si scrive: a $(x,v)$ corrisponde il vettore $\sum v^i\partial_i$ nel punto $\varphi^{-1}(x)$.</p>
  <p>Su due carte che si sovrappongono la transizione fra le coordinate naturali è $(x,v)\mapsto\big(\tilde x(x),\ J(x)v\big)$, con $J$ la jacobiana della transizione di $M$, ed è liscia. Un esempio fa vedere la forma: per le coordinate polari del piano, la transizione verso le cartesiane manda $(r,\vartheta,v^r,v^\vartheta)$ in $\big(r\cos\vartheta,\ r\sin\vartheta,\ J(r,\vartheta)(v^r,v^\vartheta)\big)$ con
  $$J=\begin{pmatrix}\cos\vartheta&-r\sin\vartheta\\ \sin\vartheta&r\cos\vartheta\end{pmatrix},\qquad \det J=r,$$
  e il determinante non nullo per $r>0$ dice che la transizione è un diffeomorfismo fra le due carte di $TM$.</p>
  <p>Lee (Proposition 3.18) conclude con il <i>chart lemma</i>, che chiede due verifiche in più oltre alle transizioni lisce. La prima è numerabile: un ricoprimento di $M$ con <span class="str" data-str="base-numerabile">base numerabile</span> si riduce a un&rsquo;infinità numerabile di carte, e le corrispondenti $\pi^{-1}(U_i)$ ricoprono $TM$. La seconda è la separazione di <span class="str" data-str="hausdorff">Hausdorff</span>, e si verifica in due casi: due vettori nella stessa fibra stanno nella stessa carta, che è un aperto di $\mathbb{R}^{2n}$ e li separa; due vettori in fibre diverse, sopra $p\neq q$, si separano prendendo carte disgiunte $U\ni p$ e $V\ni q$ di $M$, e allora $\pi^{-1}(U)$ e $\pi^{-1}(V)$ sono disgiunti. <b>Le due proprietà che la definizione di varietà chiede passano da $M$ a $TM$ senza sforzo</b>, ed è il motivo per cui la costruzione non ha sorprese.</p>
  <p>Un avvertimento di Lee che le coordinate naturali rendono concreto: <b>il campo coordinato $\partial/\partial x^i$ dipende da tutto il sistema di coordinate, non dalla sola funzione $x^i$</b>, perché è la derivata rispetto a $x^i$ <i>tenendo ferme le altre</i>. Nell&rsquo;Exercise 3.17 le coordinate $\tilde x=x$ e $\tilde y=y+x^3$ sul piano hanno la stessa prima funzione delle cartesiane, eppure nel punto $(1,0)$ i due campi $\partial/\partial x$ e $\partial/\partial\tilde x$ sono diversi. Invertendo, $x=\tilde x$ e $y=\tilde y-\tilde x^3$, e la regola della catena dà $\partial/\partial\tilde x=\partial/\partial x-3\tilde x^{2}\,\partial/\partial y$; in $(1,0)$ il coefficiente di $\partial/\partial y$ è
  $$\left.\frac{\partial}{\partial\tilde x}\big(\tilde y-\tilde x^{3}\big)\right|_{\tilde x=1}=-3.$$
  È la stessa ragione per cui nella transizione di $TM$ le nuove componenti $\tilde v^j$ dipendono da <i>tutte</i> le vecchie: la jacobiana è una matrice piena, non diagonale.</p>
  <p>La <b>proiezione naturale</b> $\pi:TM\to M$, che dimentica il vettore e ricorda il punto, in queste coordinate è $(x,v)\mapsto x$: liscia e <b>una sommersione suriettiva</b>. Le sue fibre $\pi^{-1}(p)=T_pM$ sono sottovarietà diffeomorfe a $\mathbb{R}^n$.</p>`},
  {t:'prosa', title:'Il differenziale globale, e il caso di una sola carta', tag:'grammatica', html:R`
  <p>La struttura su $TM$ serve anzitutto a rendere liscio un oggetto che si usa sempre. Se $F:M\to N$ è liscia, mettendo insieme i differenziali in tutti i punti si ottiene il <b>differenziale globale</b> $dF:TM\to TN$, che su ciascuna fibra è $dF_p$. In coordinate naturali è $(x,v)\mapsto\big(F(x),\ DF(x)\,v\big)$, quindi è liscio (Lee, Proposition 3.21), e la regola della catena diventa $d(G\circ F)=dG\circ dF$ fra fibrati. È il primo esempio di una mappa fra fibrati che è <b>lineare sulle fibre</b>: un morfismo di fibrati vettoriali.</p>
  <p>E c&rsquo;è un caso in cui $TM$ è un prodotto senza bisogno di altro: se $M$ si ricopre con <b>una sola carta</b>, la carta naturale è un diffeomorfismo globale e $TM\cong M\times\mathbb{R}^n$ (Lee, Proposition 3.20). Lee avverte subito: non bisogna lasciarsi ingannare dall&rsquo;immagine locale del prodotto. <b>Per la maggior parte delle varietà il fibrato tangente non è globalmente un prodotto</b>, nemmeno a meno di omeomorfismi.</p>
  <div class="note"><b>Perché si chiama «fibrato» e non semplicemente «prodotto».</b> Localmente $TM$ <i>è</i> un prodotto: $\pi^{-1}(U)\cong U\times\mathbb{R}^n$. Globalmente può non esserlo, e la differenza è il contenuto della tappa sui parallelizzabili: $TM\cong M\times\mathbb{R}^n$ succede <b>solo</b> se la varietà ha un riferimento globale, e $S^2$ non lo ha. <b>Il fibrato è un oggetto che è localmente banale e globalmente può essere attorcigliato</b>, ed è lo stesso fenomeno del nastro di Möbius.</div>`}
]},

/* ---------------- 01b · IL FIBRATO DI UNA SOTTOVARIETÀ ---------------- */
{ num:'01b', title:'Il fibrato tangente di una sottovarieta, come luogo di zeri', meta:'la costruzione di Manetti in R^N x R^N · lo jacobiano a blocchi · TS2 nel foglio 4 · SO(3) dentro TS2',
  blocchi:[
  {t:'prosa', title:'La costruzione di Manetti', tag:'costruzione', html:R`
  <p>Quando $M$ è una sottovarietà di $\mathbb{R}^N$ c&rsquo;è una seconda costruzione, più concreta, ed è quella con cui Manetti apre il §5. Vicino a un punto, $M$ è il luogo di zeri di $F=(F_1,\dots,F_{N-n})$ con jacobiana $JF$ di rango massimo, e lo spazio tangente in $x$ è il nucleo di $JF_x$. Allora
  $$TM=\big\{(x,w)\in\mathbb{R}^N\times\mathbb{R}^N:\ F(x)=0,\ JF_x(w)=0\big\},$$
  cioè il luogo di zeri della mappa $\vartheta(x,w)=\big(F(x),\ JF_x(w)\big)$ a valori in $\mathbb{R}^{N-n}\times\mathbb{R}^{N-n}$. La sua jacobiana è la matrice a blocchi
  $$J\vartheta=\begin{pmatrix}JF_x&0\\ \ast&JF_x\end{pmatrix},$$
  che ha rango massimo perché ce l&rsquo;hanno i due blocchi diagonali. Quindi $TM$ è una sottovarietà di $\mathbb{R}^{2N}$, e la dimensione si legge per differenza: $(N+N)-(N-n+N-n)=2n$.</p>
  <p>Il blocco $\ast$ contiene le derivate seconde delle $F_i$, perché è la derivata di $JF_x(w)$ rispetto a $x$. Manetti (Osservazione 5.2) nota che <b>è nullo esattamente quando le $F_i$ sono lineari</b>, cioè quando $M$ è un pezzo di sottospazio affine: in quel blocco c&rsquo;è la curvatura di $M$, ed è lì che comincia la geometria riemanniana. La costruzione astratta della tappa precedente e questa danno la stessa varietà: le carte naturali, lette in $\mathbb{R}^{2N}$, sono parametrizzazioni del luogo di zeri.</p>`},
  {t:'prosa', title:'Lesempio del foglio 4: TS2 dentro R6', tag:'esame', html:R`
  <p>Il foglio 4 di Diverio, Esercizio 5, chiede di dimostrare che l&rsquo;insieme $X\subseteq\mathbb{R}^6$ delle soluzioni del sistema $x^2+y^2+z^2=1$, $xu+yv+zw=0$ è una sottovarietà chiusa diffeomorfa a $TS^2$. È la costruzione di Manetti con $F(x)=|x|^2-1$: la jacobiana di $F$ è $2x^{\top}$, il suo nucleo è $\{w:\ x\cdot w=0\}$, e il sistema dice esattamente «$x$ sta sulla sfera e $(u,v,w)$ è tangente in $x$».</p>
  <p>Che sia una sottovarietà si vede con il valore regolare. La mappa $\Phi(x,u)=\big(|x|^2-1,\ x\cdot u\big)$ ha jacobiana con righe $(2x^{\top},\,0)$ e $(u^{\top},\,x^{\top})$; sui punti di $X$ si ha $x\neq0$, e se per esempio la prima coordinata $x$ non è nulla il minore formato dalle colonne di $x$ e di $u$ vale
  $$\det\begin{pmatrix}2x&0\\ u&x\end{pmatrix}=2x^2,$$
  diverso da zero. Le altre coordinate si trattano allo stesso modo, quindi il rango è $2$ in ogni punto, $(0,0)$ è un valore regolare, e $X=\Phi^{-1}(0,0)$ è chiusa di dimensione $6-2=4$. Il diffeomorfismo con $TS^2$ è l&rsquo;identità letta nelle due costruzioni: un punto di $X$ <i>è</i> una coppia (punto della sfera, vettore tangente in quel punto). L&rsquo;Esercizio 4 dello stesso foglio fa la versione generale, e conviene vedere perché è vera.</p>
  <p>Sia $S\subseteq M$ una sottovarietà di dimensione $k$. Vicino a ogni suo punto ci sono <b>coordinate di fetta</b> $(x^1,\dots,x^n)$ di $M$ in cui $S$ è $\{x^{k+1}=\dots=x^n=0\}$. Nelle coordinate naturali $(x,v)$ di $TM$ la restrizione $TM|_S=\pi^{-1}(S)$ è l&rsquo;insieme $\{x^{k+1}=\dots=x^n=0\}$ — una sottovarietà di dimensione $k+n$, con $\pi$ ristretta che resta una sommersione suriettiva su $S$ — e i vettori tangenti a $S$ sono quelli che in più hanno $v^{k+1}=\dots=v^n=0$, perché in coordinate di fetta il differenziale dell&rsquo;inclusione manda $\partial/\partial y^a$ in $\partial/\partial x^a$ per $a\le k$. Quindi $TS$ è la fetta di $TM$ in cui si annullano le ultime $n-k$ coordinate di posizione e le ultime $n-k$ di velocità: una sottovarietà di dimensione $2k$, chiusa in $TM|_S$, con un&rsquo;inclusione che commuta con le proiezioni ed è lineare e iniettiva su ogni fibra. <b>Il fibrato tangente di una sottovarietà è un sottofibrato della restrizione</b>, e il quoziente fibra per fibra $T_pM/T_pS$ è il fibrato normale, che Abate costruisce nell&rsquo;Esempio 3.1.18.</p>`},
  {t:'prosa', title:'Un gruppo dentro il fibrato: SO(3) e i vettori tangenti unitari', tag:'esempio', html:R`
  <p>Manetti chiude il §5 con un esempio che lega due oggetti del corso (Esempio 5.1). Una matrice di $SO(3)$ ha per colonne una base ortonormale positiva $v_1,v_2,v_3$: $v_1$ è un punto di $S^2$, $v_2$ è unitario e ortogonale a $v_1$, cioè un vettore tangente unitario in $v_1$, e $v_3=v_1\wedge v_2$ è determinato dai primi due. Quindi <b>$SO(3)$ si identifica con l&rsquo;insieme dei vettori tangenti unitari della sfera</b>, una sottovarietà di $TS^2$ di codimensione uno: le dimensioni tornano, $4-1=3$, che è la dimensione di $SO(3)$.</p>
  <p>Non è tutto $TS^2$, perché i vettori tangenti possono avere norma qualunque; ma il fibrato dei vettori unitari porta già l&rsquo;informazione che conta. Se $S^2$ avesse un campo mai nullo, normalizzandolo si otterrebbe una sezione di questo fibrato unitario, e $SO(3)$ si spezzerebbe in un prodotto $S^2\times S^1$. Non succede, ed è la stessa ostruzione della palla pelosa vista dal gruppo delle rotazioni.</p>`}
]},

/* ---------------- 02 · IL COCICLO JACOBIANO ---------------- */
{ num:'02', title:'Il cociclo jacobiano: come si incollano le carte del fibrato', meta:'fibrati vettoriali e banalizzazioni · la condizione di cociclo · un cociclo basta · il cociclo di TS2 calcolato',
  blocchi:[
  {t:'prosa', title:'La transizione, e la condizione che soddisfa', tag:'grammatica', html:R`
  <p>Su due carte di $M$ che si sovrappongono, un vettore ha componenti $v^i$ e $\tilde v^j$ legate, per la regola della catena, da
  $$\tilde v^{j}=\sum_i\frac{\partial\tilde x^{j}}{\partial x^{i}}\,v^{i}.$$
  Quindi la transizione fra le due carte <b>indotte</b> su $TM$ è
  $$(x,v)\ \longmapsto\ \big(\tilde x(x),\ J(x)\,v\big),\qquad J(x)=\left(\frac{\partial\tilde x^{j}}{\partial x^{i}}\right),$$
  <b>liscia</b> perché lo sono $\tilde x(x)$ e le sue derivate. <b>Questo basta a fare di $TM$ una varietà</b>, e il conto è tutto qui.</p>
  <p>Le matrici $J_{\alpha\beta}$ soddisfano la <b>condizione di cociclo</b>:
  $$J_{\alpha\gamma}=J_{\alpha\beta}\,J_{\beta\gamma}\quad\text{su }U_\alpha\cap U_\beta\cap U_\gamma,$$
  che è la regola della catena scritta per tre carte. <b>Non è una proprietà accessoria</b>: è la condizione di coerenza che rende l&rsquo;incollamento possibile, ed è il punto in cui i fibrati diventano oggetti classificabili.</p>`},
  {t:'prosa', title:'Il punto di vista di Abate: un cociclo basta a fabbricare un fibrato', tag:'teorema', html:R`
  <p>Abate mette il fibrato tangente dentro una nozione più generale (Definizione 3.1.1). Un <b>fibrato vettoriale di rango $r$</b> su $M$ è una varietà $E$ con una sommersione suriettiva $\pi:E\to M$ le cui fibre sono spazi vettoriali di dimensione $r$, e con <b>banalizzazioni locali</b>: diffeomorfismi $\chi_\alpha:\pi^{-1}(U_\alpha)\to U_\alpha\times\mathbb{R}^r$ che rispettano le fibre e sono lineari su ciascuna. Due banalizzazioni differiscono, sopra l&rsquo;intersezione, per una matrice invertibile che dipende dal punto:
  $$\chi_\alpha\circ\chi_\beta^{-1}(p,v)=\big(p,\ g_{\alpha\beta}(p)\,v\big),$$
  e le $g_{\alpha\beta}:U_\alpha\cap U_\beta\to GL(r,\mathbb{R})$ sono le <b>funzioni di transizione</b> (Definizione 3.1.6). Per il fibrato tangente sono le jacobiane: è l&rsquo;Esempio 3.1.11.</p>
  <p>La Proposizione 3.1.8 dice due cose. Le funzioni di transizione di un fibrato soddisfano sempre tre condizioni: $g_{\alpha\alpha}=I$, $g_{\beta\alpha}=g_{\alpha\beta}^{-1}$, e il cociclo $g_{\alpha\beta}g_{\beta\gamma}=g_{\alpha\gamma}$. E — il viceversa, che è il punto — <b>date funzioni $g_{\alpha\beta}$ lisce che soddisfano le tre condizioni, esiste un fibrato, unico a meno di isomorfismo, che le ha come transizioni</b>. La costruzione è un <span class="str" data-str="quoziente-topologico">quoziente</span>: si prende l&rsquo;unione disgiunta degli $U_\alpha\times\mathbb{R}^r$ e si identifica $(p,u)$ nel pezzo $\alpha$ con $(p,v)$ nel pezzo $\beta$ quando $u=g_{\alpha\beta}(p)v$. <b>Le tre condizioni sono esattamente ciò che rende questa una relazione d&rsquo;equivalenza</b>: la prima dà la riflessività, la seconda la simmetria, il cociclo la transitività. Poi la Proposizione 3.1.7 dota il quoziente della struttura di fibrato.</p>
  <div class="note"><b>È qui che il corso tocca la fisica senza dirlo.</b> Un fibrato si costruisce dando gli aperti e un <i>cociclo</i> di matrici di transizione a valori in un gruppo — qui $GL(n,\mathbb{R})$. In teoria di gauge quel gruppo è $U(1)$, $SU(2)$, $SU(3)$, e le matrici di transizione <b>sono</b> le trasformazioni di gauge. La struttura è identica; cambia solo il gruppo.</div>`},
  {t:'prosa', title:'Il cociclo di TS2, calcolato con le due proiezioni stereografiche', tag:'esempio', html:R`
  <p>La sfera si ricopre con le due carte stereografiche dai poli, e la transizione fra le coordinate $u=(u^1,u^2)$ dell&rsquo;una e quelle dell&rsquo;altra è l&rsquo;inversione $\sigma(u)=u/|u|^2$, definita fuori dall&rsquo;origine. Il cociclo di $TS^2$ è la sua jacobiana, che si calcola entrata per entrata; scrivendo $(u,v)$ per le due coordinate, la prima entrata è
  $$\frac{\partial}{\partial u}\,\frac{u}{u^2+v^2}=\frac{v^2-u^2}{(u^2+v^2)^2},$$
  e in forma compatta $J(u)=\big(|u|^2I-2uu^{\top}\big)/|u|^4$. Il determinante vale
  $$\det J(u)=-\frac{1}{(u^2+v^2)^2},$$
  sempre negativo: <b>l&rsquo;inversione rovescia l&rsquo;orientamento</b>, e per avere un atlante orientato bisogna comporre una delle due carte con una riflessione. Le condizioni di Abate si verificano a mano: $\sigma$ è un&rsquo;involuzione, e la regola della catena dà $J(\sigma(u))\,J(u)=I$, che è la condizione $g_{\beta\alpha}=g_{\alpha\beta}^{-1}$ per questo atlante di due carte. <b>Tutta l&rsquo;informazione su $TS^2$ sta in questa matrice $2\times2$</b>, e il fatto che $TS^2$ non sia un prodotto si nasconde nel modo in cui ruota i vettori lungo l&rsquo;equatore. Sul cerchio $|u|=1$ la matrice è $I-2uu^{\top}$, una riflessione; composta con la riflessione che corregge l&rsquo;orientamento diventa una rotazione, e quando $u$ fa un giro dell&rsquo;equatore quella rotazione ne fa <b>due</b>. Quel $2$ è la <span class="str" data-str="caratteristica-di-eulero">caratteristica di Eulero</span> della sfera, letta nel cociclo.</p>`},
  {t:'plot', title:'Il campo costante di una carta, visto dallaltra: un dipolo',
   intro:R`Il campo $\partial/\partial u^{1}$ della carta stereografica dal polo nord, scritto nelle coordinate $w$ della carta dal polo sud: componenti $(w_2^2-w_1^2,\ -2w_1w_2)$, cioè la prima colonna del cociclo valutata in $\sigma(w)$.`,
   plots:[
    {kind:'field2d', fx:'y*y-x*x', fy:'-2*x*y', xr:[-1.5,1.5], yr:[-1.5,1.5], n:15, height:330,
     marks:[{x:0, y:0, label:'polo nord: lunico zero', col:'#ff6b6b'}],
     title:'nel polo le frecce fanno due giri: indice 2'}
   ],
   leggi:R`<b>Lontano dall'origine</b> le frecce sono il campo costante della prima carta, deformato dal cambio di coordinate; <b>vicino all'origine</b>, che è il polo nord, si accorciano come $|w|^2$ e si annullano. Il campo trasportato si estende quindi con continuità — anzi in modo liscio, perché le componenti sono polinomi — ponendolo nullo nel polo, ed è il campo con un solo zero dell'Esercizio 11 del foglio 4.<br><br>
   <b>Che cosa contare</b>: percorrendo un cerchietto attorno all'origine una volta, la direzione delle frecce compie due giri completi. È l'<i>indice</i> dello zero, e vale $2$: un solo zero porta tutta la somma che la sfera impone. Il cociclo e il campo raccontano la stessa cosa — il fibrato tangente della sfera è torto due volte — da due lati.`},
]},

/* ---------------- 03 · CAMPI VETTORIALI ---------------- */
{ num:'03', title:'I campi vettoriali: sezioni, il criterio di liscezza, e lesempio della sfera', meta:'campo rozzo e campo liscio · le funzioni componenti · estendere un vettore · latitudine e longitudine',
  blocchi:[
  {t:'prosa', title:'Le tre facce di un campo', tag:'grammatica', html:R`
  <p>Un <b>campo vettoriale</b> è una sezione liscia $X:M\to TM$, cioè $\pi\circ X=\mathrm{id}$ (Lee, cap. 8; Abate, Definizione 3.2.4; Manetti, Definizione 6.1). Tre modi di vederlo, tutti usati:</p>
  $$X\in\Gamma(TM)\iff X:M\to TM\ \text{liscia e}\ \pi\circ X=\mathrm{id}_M\iff\forall p\in M\ \ X(p)\in T_pM\ \text{e}\ X\ \text{liscia}.$$
  <p>La seconda forma dice quello che la prima nasconde: <b>$\pi\circ X=\mathrm{id}$ significa esattamente «il vettore assegnato a $p$ vive in $p$»</b>. Senza quella condizione $X$ sarebbe una mappa qualunque in $TM$, e potrebbe appoggiare in $p$ un vettore tangente in un altro punto.</p>
  <ul>
   <li><b>geometrico</b>: a ogni punto una freccia tangente. In coordinate $X=\sum X^{i}(x)\frac{\partial}{\partial x^{i}}$ con $X^i$ funzioni lisce;</li>
   <li><b>algebrico</b>: una <b>derivazione</b> dell&rsquo;algebra $C^\infty(M)$, cioè $X:C^\infty(M)\to C^\infty(M)$ lineare con Leibniz. È la versione «punto per punto» dei vettori tangenti fatta globalmente, ed è la definizione su cui poggia la <span class="str" data-str="parentesi-di-lie">parentesi di Lie</span>, perché due derivazioni si possono comporre e il loro commutatore è ancora una derivazione;</li>
   <li><b>dinamico</b>: la legge $\dot\gamma=X(\gamma)$, cioè un&rsquo;equazione differenziale su $M$, le cui soluzioni sono le <b>curve integrali</b> del campo: le traiettorie che in ogni istante hanno per velocità la freccia del campo nel punto in cui si trovano.</li>
  </ul>`},
  {t:'prosa', title:'Campo rozzo e campo liscio: il criterio, e perche le prove lo chiedono', tag:'teorema', html:R`
  <p>Lee distingue con cura due livelli. Un <b>campo rozzo</b> (<i>rough vector field</i>) è una qualunque mappa $X:M\to TM$ con $X_p\in T_pM$ per ogni $p$, senza richieste di continuità: una scelta di un vettore in ogni punto. Un campo è <b>liscio</b> se lo è come mappa fra le varietà $M$ e $TM$. In una carta si scrive $X_p=\sum X^i(p)\,\partial_i|_p$, e le $X^i$ si chiamano <b>funzioni componenti</b>.</p>
  <p><b>Criterio</b> (Lee, Proposition 8.1): un campo rozzo è liscio su una carta se e solo se le sue funzioni componenti lo sono. La dimostrazione è una riga: nelle coordinate naturali, il campo è la mappa $x\mapsto\big(x,\ X^1(x),\dots,X^n(x)\big)$. E c&rsquo;è una seconda forma, che è quella utile nelle dimostrazioni (Proposition 8.14): <b>$X$ è liscio se e solo se $Xf$ è liscia per ogni funzione liscia $f$</b>, anche solo definita su un aperto. Un verso è la formula $Xf=\sum X^i\partial_if$; l&rsquo;altro si ottiene applicando $X$ alle funzioni coordinate, perché applicato alla coordinata $x^i$ il campo restituisce proprio la sua componente $X^i$. Il passaggio da funzioni su un aperto a funzioni globali usa una bump: si moltiplica $f$ per una funzione che vale $1$ vicino al punto e si estende con zero, ed è lo stesso argomento con cui Abate dimostra che <b>i campi e le derivazioni di $C^\infty(M)$ sono la stessa cosa</b> (Proposizione 3.3.2; Lee, Proposition 8.15).</p>
  <p>La distinzione non è pedanteria: <b>la prova del 18/02 la chiede in due punti separati</b>. Al punto (viii) si deve verificare che $\Xi_A(X)=A-XA^{\top}X$ definisce un campo <i>rozzo</i> sulla varietà di Stiefel, cioè che il vettore assegnato a ogni $X$ sta nello spazio tangente in $X$; al punto (ix) che è un campo <i>liscio</i>. Sono due verifiche diverse — la prima è algebra lineare punto per punto, la seconda è il criterio — e la tappa che segue le fa entrambe.</p>
  <p>Due esempi di Lee fissano le idee. Il <b>campo di Eulero</b> $V=\sum x^i\partial_i$ su $\mathbb{R}^n$ (Example 8.3) è liscio perché le componenti sono lineari; si annulla nell&rsquo;origine e altrove punta radialmente. Il <b>campo angolare</b> $d/d\vartheta$ sulla circonferenza (Example 8.4) è globale anche se la coordinata $\vartheta$ non lo è: due coordinate angolari differiscono per una costante vicino a ogni punto, quindi i loro campi coordinati coincidono e si incollano. E il lemma di estensione (Lee, Lemma 8.6, con la stessa dimostrazione per partizioni dell&rsquo;unità del caso delle funzioni) dà la conseguenza più usata: <b>ogni vettore tangente in un punto è il valore di un campo liscio globale</b> (Proposition 8.7).</p>
  <p>I campi formano uno spazio vettoriale reale e — di più — un <b>modulo su $C^\infty(M)$</b>: si possono moltiplicare per funzioni (Proposition 8.8). Questa struttura in più è ciò che permette di <b>costruire campi globali con le partizioni dell&rsquo;unità</b>: si prende un campo in ogni carta, lo si moltiplica per il peso, e si somma.</p>`},
  {t:'reveal', title:'Latitudine e longitudine su S2, in dettaglio', tag:'esame', steps:[
   {label:'I due campi coordinati', body:R`
   <p>Con $\theta$ colatitudine e $\varphi$ longitudine, la parametrizzazione è $(\sin\theta\cos\varphi,\ \sin\theta\sin\varphi,\ \cos\theta)$, e i due campi coordinati sono le colonne della jacobiana:
   $$\frac{\partial}{\partial\theta}=(\cos\varphi\cos\theta,\ \sin\varphi\cos\theta,\ -\sin\theta),\qquad
   \frac{\partial}{\partial\varphi}=(-\sin\varphi\sin\theta,\ \cos\varphi\sin\theta,\ 0).$$
   Il primo punta verso sud lungo il meridiano, il secondo verso est lungo il parallelo. <b>Sono ortogonali</b> — il loro prodotto scalare è nullo — e il primo ha norma $1$.</p>`},
   {label:'Dove la carta muore, e perche', body:R`
   <p>La norma al quadrato del secondo campo è <b>$\sin^{2}\theta$</b>, e <b>si annulla ai poli</b> ($\theta=0,\pi$). Lì il campo $\partial/\partial\varphi$ è il vettore nullo: <b>non è una base</b>, e le coordinate sferiche smettono di essere una carta.</p>
   <p><b>Non è un difetto della parametrizzazione scelta</b>, ed è il punto che Diverio segnala come «in dettaglio»: è l&rsquo;ombra locale di un fatto globale. Ai poli la longitudine non è definita — tutti i meridiani si incontrano — e nessuna scelta di coordinate su $S^2$ può evitare di avere punti singolari. <b>La tappa sui parallelizzabili dice perché.</b></p>`}
  ]},
  {t:'plot', title:'I due campi coordinati sulla sfera, in proiezione',
   intro:R`Le norme dei due campi coordinati in funzione della colatitudine $\theta$: il campo dei meridiani ha norma costante, quello dei paralleli si spegne ai poli.`,
   plots:[
    {kind:'func2d', xr:[0,3.1416], yr:[-0.05,1.2], height:320,
     title:'il campo della longitudine si annulla dove i meridiani si incontrano',
     xlabel:'theta (colatitudine)', ylabel:'norma del campo',
     curves:[
      {f:'1', col:'#5eead4', width:2.4, label:'|d/dtheta| (meridiani)'},
      {f:'abs(sin(x))', col:'#d8a13a', width:2.6, label:'|d/dphi| (paralleli)'}
     ],
     segs:[{x1:0, y1:0, x2:0, y2:1.2, col:'#ff6b6b', dash:true, width:1.4, label:'polo nord', lx:0.05, ly:1.1},
           {x1:3.1416, y1:0, x2:3.1416, y2:1.2, col:'#ff6b6b', dash:true, width:1.4, label:'polo sud', lx:2.55, ly:1.1}],
     marks:[{x:1.5708, y:1, label:'equatore: i due campi sono equivalenti', col:'#b98cff', left:true}]}
   ],
   leggi:R`<b>La curva oro è il punto della tappa</b>: il campo che segue i paralleli ha norma $\sin\theta$, quindi <b>si annulla esattamente ai due poli</b>. All&rsquo;equatore i due campi sono entrambi unitari e formano una base ortonormale; avvicinandosi ai poli il secondo si accorcia fino a sparire, e la coppia smette di essere una base.<br><br>
   <b>Perché è inevitabile e non è colpa delle coordinate</b>: il teorema della palla pelosa dice che su $S^2$ <i>ogni</i> campo continuo si annulla da qualche parte. Le coordinate sferiche non sono maldestre — stanno mostrando un ostacolo topologico. <b>Ogni atlante di $S^2$ avrà lo stesso problema in punti diversi</b>, ed è la ragione per cui servono almeno due carte.`}
]},

/* ---------------- 03a · I CAMPI DELLE PROVE ---------------- */
{ num:'03a', title:'I campi delle prove: come si verifica che un campo e tangente e liscio', meta:'il metodo in due passi · Sigma1 del 26/01 · Sp(2) del 24/06 · O(1,1) del 15/07 · il campo rozzo di Stiefel del 18/02',
  blocchi:[
  {t:'prosa', title:'Il metodo, in due passi', tag:'metodo', html:R`
  <p>Quattro prove su cinque contengono la stessa richiesta: dati due campi espliciti su una sottovarietà $S$ di uno spazio di matrici, «verificare che $X_A,Y_A\in T_AS$ e che le assegnazioni $A\mapsto X_A$ e $A\mapsto Y_A$ definiscono campi vettoriali lisci». Il metodo ha due passi, e corrispondono ai due livelli della tappa precedente.</p>
  <p><b>Primo passo: il campo è tangente</b>, cioè è almeno un campo rozzo su $S$. Se $S=F^{-1}(0)$ con $0$ valore regolare, lo spazio tangente in $A$ è il nucleo del differenziale, $T_AS=\ker dF_A$, e basta controllare $dF_A(X_A)=0$. Per il determinante il differenziale si scrive con l&rsquo;aggiunta classica: $d(\det)_A(H)=\operatorname{tr}\big(\operatorname{adj}(A)\,H\big)$, che si riduce a $\det(A)\operatorname{tr}(A^{-1}H)$ quando $A$ è invertibile.</p>
  <p><b>Secondo passo: il campo è liscio.</b> Le formule d&rsquo;esame sono polinomi nelle entrate di $A$, quindi definiscono un campo liscio $\tilde X$ su tutto lo spazio delle matrici, che in ogni punto di $S$ è tangente a $S$. Lee (Proposition 8.23) dice che la restrizione a una sottovarietà di un campo liscio dell&rsquo;ambiente, tangente in ogni punto della sottovarietà, è un campo liscio della sottovarietà. <b>È la frase che le soluzioni del 15/07 scrivono così: «le componenti sono restrizioni di funzioni polinomiali lisce in $\mathbb{R}^4$»</b>. La nota a piè di pagina della prova del 26/01 — «mi è sufficiente che lo si verifichi sull&rsquo;aperto $\{x_{11}\neq0\}$» — è il criterio delle funzioni componenti applicato in una carta.</p>`},
  {t:'reveal', title:'Quattro campi, quattro verifiche', tag:'esame', steps:[
   {label:'24/06: Sp(2,R) = SL(2,R), la verifica con laggiunta', body:R`
   <p>Il campo è $X_A=\begin{pmatrix}a&-b\\c&-d\end{pmatrix}=AD$ con $D=\mathrm{diag}(1,-1)$. Siccome $Sp(2,\mathbb{R})=SL(2,\mathbb{R})$ è il livello $1$ del determinante, si calcola il differenziale lungo $X_A$:
   $$\operatorname{tr}\big(\operatorname{adj}(A)\,A\,D\big)=\det(A)\operatorname{tr}D=0,$$
   perché $\operatorname{adj}(A)A=\det(A)\,I$ e $D$ ha traccia nulla. Lo stesso per $Y_A=AN$ con $N$ nilpotente, che ha traccia nulla. <b>La verifica non dipende dal punto: ogni campo della forma $A\mapsto AB$ con $\operatorname{tr}B=0$ è tangente a $SL(2)$</b>, e sono esattamente i campi invarianti a sinistra. Il suggerimento della prova — «prima adattare la risposta del punto (iv) per descrivere $T_A$» — è questo: $T_A=A\cdot T_I$.</p>`},
   {label:'26/01: le matrici di rango uno, e un campo che si annulla', body:R`
   <p>Su $\Sigma_1=\{A\in M_2(\mathbb{R}):\ \operatorname{rk}A=1\}=\det^{-1}(0)\setminus\{0\}$ il campo è $X_A=\begin{pmatrix}0&-b\\0&-d\end{pmatrix}$. Con l&rsquo;aggiunta $\operatorname{adj}(A)=\begin{pmatrix}d&-b\\-c&a\end{pmatrix}$ il differenziale del determinante lungo $X_A$ è
   $$\operatorname{tr}\big(\operatorname{adj}(A)\,X_A\big)=bc-ad,$$
   cioè $-\det A$, che su $\Sigma_1$ è nullo: <b>il campo è tangente</b>. Qui non si può usare $A^{-1}$, perché le matrici di $\Sigma_1$ non sono invertibili — ed è il motivo per cui la forma con l&rsquo;aggiunta è quella da ricordare. Il punto (viii) della stessa prova osserva che $0$ è un valore critico del determinante su $\mathbb{R}^4$ (il differenziale si annulla nella matrice nulla) ma che il determinante è trasverso a $\{0\}$ su $\mathbb{R}^4\setminus\{0\}$: per questo $\Sigma_1$ si definisce togliendo l&rsquo;origine. Il punto (x) chiede dove $X_A$ e $Y_A$ sono indipendenti: su un aperto denso, non ovunque, e la parentesi dice come si deformano.</p>`},
   {label:'15/07: O(1,1), la verifica con la forma quadratica', body:R`
   <p>Il gruppo è $F^{-1}(0)$ con $F(X)=X^{\top}I_{1,1}X-I_{1,1}$, e il differenziale è $dF_A(H)=H^{\top}I_{1,1}A+A^{\top}I_{1,1}H$. Per $X_A=\begin{pmatrix}c&d\\a&b\end{pmatrix}$ la soluzione del docente calcola i due addendi separatamente e trova due matrici antisimmetriche opposte, quindi
   $$X_A^{\top}I_{1,1}A+A^{\top}I_{1,1}X_A=0.$$
   Il conto vale per <i>ogni</i> matrice $A$, non solo su $O(1,1)$: è la traccia algebrica del fatto che $X$ è il campo $A\mapsto KA$, e la moltiplicazione a sinistra per $K$ è un generatore del gruppo di Lorentz del piano, che preserva la forma. Poi $Y_A=aX_A$ è tangente perché <b>lo spazio tangente è uno spazio vettoriale</b>: moltiplicare un vettore tangente per uno scalare, anche dipendente dal punto, lo lascia tangente.</p>`},
   {label:'18/02: il campo rozzo di Stiefel, e perche e tangente solo su V_k', body:R`
   <p>Il campo è $\Xi_A(X)=A-XA^{\top}X$, definito per ogni matrice $X\in M_{n,k}(\mathbb{R})$. Lo spazio tangente a $V_k(\mathbb{R}^n)$ è $\{H:\ X^{\top}H+H^{\top}X=0\}$, e sostituendo $H=\Xi_A(X)$ si trova
   $$X^{\top}\Xi_A+\Xi_A^{\top}X=X^{\top}A+A^{\top}X-(X^{\top}X)(A^{\top}X)-(X^{\top}A)(X^{\top}X),$$
   che si annulla quando $X^{\top}X=I$. Per $k=1$ e $n=3$ il conto è scalare e mostra bene dove sta il punto: la somma vale $2\big(1-|X|^2\big)\,(X\cdot A)$, nulla esattamente sulla sfera. <b>Il campo ambiente non è tangente alle sfere di raggio diverso da uno</b>: è tangente solo sulla varietà che interessa, e questo è il motivo per cui la prova chiede prima di verificare che è un campo rozzo <i>su $V_k$</i>. La liscezza (punto (ix)) segue poi dal secondo passo del metodo: $\Xi_A$ è polinomiale in $X$.</p>`}
  ]}
]},

/* ---------------- 04 · PARALLELIZZABILI ---------------- */
{ num:'04', title:'Parallelizzabili: quando il fibrato e banale, e la palla pelosa', meta:'banalizzazione e riferimento globale · S1, i tori e i gruppi di Lie · S3 con i quaternioni · S^(2n-1) · e il teorema',
  blocchi:[
  {t:'prosa', title:'Il criterio: un fibrato e banale se e solo se ha un riferimento globale', tag:'teorema', html:R`
  <p>Un <b>riferimento locale</b> su un aperto $U$ è una $n$-upla di campi lisci $(X_1,\dots,X_n)$ che in ogni punto di $U$ formano una base di $T_pM$; si dice <b>globale</b> se $U=M$ (Lee, Example 8.10). I campi coordinati di una carta sono un riferimento locale, e la Proposition 8.11 di Lee dice che ogni $k$-upla indipendente di campi, o di vettori in un punto, si completa a un riferimento locale. $M$ si dice <b>parallelizzabile</b> se ha un riferimento globale (Abate, Definizione 3.E.1, lo dice come: $TM$ è un fibrato banale).</p>
  $$M\ \text{parallelizzabile}\iff TM\cong M\times\mathbb{R}^n\iff\exists X_1,\dots,X_n\in\Gamma(TM)\ :\ \forall p\in M\ \ \big(X_1(p),\dots,X_n(p)\big)\ \text{base di}\ T_pM.$$
  <p>Da confrontare con la banalità <i>locale</i>, che invece ce l&rsquo;hanno tutti i fibrati e non dice nulla sulla varietà:</p>
  $$\forall p\in M\ \ \exists U\ni p\ \text{aperto}\ :\ \pi^{-1}(U)\cong U\times\mathbb{R}^n.$$
  <p><b>La differenza fra i due enunciati è dove sta il $\forall p$</b>: nel primo è dentro, dopo la scelta dei campi, e chiede che <i>gli stessi</i> $n$ campi funzionino in ogni punto; nel secondo è fuori, e ogni punto può avere la sua banalizzazione. Tutta la palla pelosa sta in quello scambio.</p>
  <p>L&rsquo;equivalenza è l&rsquo;Esercizio 1 del foglio 4 di Diverio: <b>esiste un diffeomorfismo $TU\to U\times\mathbb{R}^n$ che rispetta le fibre ed è lineare su ciascuna se e solo se esistono $n$ campi lisci su $U$ che in ogni punto formano una base</b>. Da un riferimento si definisce $\Phi^{-1}(p,v)=\sum_iv^iX_i(p)$, che è liscia, biunivoca e lineare sulle fibre; la sua inversa è liscia perché in una carta le componenti dei campi formano una matrice invertibile che dipende in modo liscio dal punto, e l&rsquo;inversa di una tale matrice è liscia per la regola di Cramer. Viceversa, da una banalizzazione si ottiene il riferimento $X_i(p)=\Phi^{-1}(p,e_i)$.</p>`},
  {t:'prosa', title:'I parallelizzabili che si costruiscono a mano', tag:'esempio', html:R`
  <p><b>La circonferenza e i tori.</b> Il campo angolare $d/d\vartheta$ è un riferimento globale di $S^1$, e i campi angolari dei fattori sono un riferimento globale del toro $T^n$ (Lee, Examples 8.4-8.5).</p>
  <p><b>Ogni <span class="str" data-str="gruppo-di-lie">gruppo di Lie</span></b> (Abate, Esercizio 3.40). Si prende una base $B_1,\dots,B_n$ dello spazio tangente all&rsquo;identità e la si trasporta con le traslazioni a sinistra, che sono diffeomorfismi: su un gruppo di matrici i campi sono $A\mapsto AB_i$, e sono indipendenti in ogni punto perché la moltiplicazione per $A$ invertibile è un isomorfismo. È esattamente come la soluzione della prova del 14/09 costruisce i campi $X_A=A$ e $Y_A=AJ$ su $CO^+(2)$: <b>i campi delle prove sono quasi sempre un riferimento globale di un gruppo di Lie</b>.</p>
  <p><b>Le sfere dispari hanno un campo mai nullo</b> (Abate, Esercizio 3.19; foglio 4, Es. 8). Pensando $\mathbb{R}^{2n}$ come $\mathbb{C}^n$, il campo $X(z)=iz$ è la velocità della curva $t\mapsto e^{it}z$, che resta sulla sfera; è tangente perché è ortogonale al punto — in $\mathbb{C}^2$, con $z=(x_1+iy_1,\,x_2+iy_2)$, il vettore $iz$ ha coordinate reali $(-y_1,x_1,-y_2,x_2)$ e $\langle z,iz\rangle=0$ — e ha la stessa norma di $z$, quindi non si annulla mai.</p>
  <p><b>$S^3$ è parallelizzabile</b> (Abate, Esercizio 3.20; foglio 4, Es. 8). Identificando $\mathbb{R}^4$ con i quaternioni $q=a+bi+cj+dk$, i tre campi $X_1(q)=qi$, $X_2(q)=qj$, $X_3(q)=qk$ hanno coordinate
  $$qi=(-b,\,a,\,d,\,-c),\qquad qj=(-c,\,-d,\,a,\,b),\qquad qk=(-d,\,c,\,-b,\,a).$$
  Un conto diretto dà $qi,\ qj,\ qk\perp q$, quindi i tre campi sono tangenti alla sfera unitaria, e la loro matrice di Gram è $|q|^2I$: sulla sfera sono ortonormali. <b>Tre campi ortonormali tangenti in ogni punto di $S^3$: un riferimento globale</b>, ottenuto trasportando $i,j,k$ con la moltiplicazione a destra — è lo stesso argomento dei gruppi di Lie, perché i quaternioni unitari sono il gruppo $SU(2)$.</p>`},
  {t:'prosa', title:'La palla pelosa, e il confine di cio che il corso dimostra', tag:'idea', html:R`
  <p><b>Il teorema della palla pelosa</b>: su $S^{2}$ <i>ogni</i> campo vettoriale continuo si annulla in almeno un punto. Quindi $S^2$ <b>non</b> è parallelizzabile, e il suo fibrato tangente non è un prodotto. Il nome viene dall&rsquo;immagine: non si può pettinare una sfera pelosa senza lasciare un vortice. In Lee è il Problem 16-6, e la dimostrazione usa il grado di una mappa; la ragione profonda è il teorema di Poincaré-Hopf, che lega gli zeri dei campi alla <span class="str" data-str="caratteristica-di-eulero">caratteristica di Eulero</span>, e che si enuncia qui senza dimostrarlo.</p>
  <p><b>Il quadro completo per le sfere è sorprendente</b>: $S^n$ è parallelizzabile <b>solo</b> per $n=1,3,7$. Non è un caso: sono le dimensioni in cui esistono i numeri complessi, i quaternioni e gli ottonioni — le algebre di divisione reali — e Abate costruisce il riferimento di $S^7$ con gli ottonioni nell&rsquo;Esercizio 3.21. <b>Un fatto di topologia che equivale a un fatto di algebra</b>, e la dimostrazione dell&rsquo;«solo» (Bott-Milnor, Kervaire, 1958) è uno dei risultati profondi del Novecento.</p>
  <div class="note"><b>Come si riconosce un parallelizzabile in pratica</b>: ogni gruppo di Lie lo è, perché si può trasportare una base dall&rsquo;identità con le traslazioni. Quindi $S^1$ e $S^3$ lo sono perché sono gruppi (numeri complessi e quaternioni unitari); $S^2$ non è un gruppo, e infatti non lo è. <b>Il toro $S^1\times S^1$ è parallelizzabile</b> per lo stesso motivo — ed è la ragione per cui sul toro si può pettinare, e sulla sfera no.</div>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Perché la palla pelosa implica che servono almeno due carte su $S^2$?`,
    a:R`Perché una carta globale darebbe un diffeomorfismo con un aperto di $\mathbb{R}^2$, e lì i due campi coordinati costanti non si annullano mai: trasportandoli sulla sfera si avrebbe un campo mai nullo, contro il teorema. <b>Vale anche l&rsquo;argomento di compattezza</b> — la sfera è compatta e un aperto del piano non lo è — ma questo è più informativo: dice che l&rsquo;ostruzione riguarda i campi, non solo la topologia dello spazio.`},
   {q:R`Il toro è compatto come $S^2$, ma è parallelizzabile. Che cosa distingue i due casi?`,
    a:R`La <b>caratteristica di Eulero</b>: il teorema di Poincaré-Hopf dice che la somma degli indici degli zeri di un campo vettoriale vale $\chi(M)$. Per il toro $\chi=0$, quindi un campo senza zeri è possibile; per $S^2$ $\chi=2\ne0$, e gli zeri sono obbligati. <b>Un invariante topologico che decide un fatto sui campi vettoriali</b>.`}
  ]}
]},

/* ---------------- 04b · I CAMPI COME OPERATORI, E LE OPERAZIONI CHE SI POSSONO FARE ---------------- */
{ num:'04b', title:'Che cosa si puo fare con un campo, e che cosa no', meta:'il campo come derivazione di funzioni · perche il prodotto di due campi non e un campo · lo spazio dei campi come modulo · e il supporto',
  blocchi:[
  {t:'prosa', title:'Un campo e un operatore differenziale del primo ordine', tag:'idea', html:R`
  <p>Un campo di vettori $X$ assegna a ogni punto un vettore tangente, e ogni vettore tangente è una derivazione. Mettendo insieme, <b>$X$ agisce sulle funzioni lisce</b>: data $f\in C^{\infty}(M)$, si definisce $Xf$ come la funzione che in $p$ vale $X_p(f)$. In coordinate, se $X=\sum_i X^{i}\frac{\partial}{\partial x^{i}}$, allora</p>
  $$Xf=\sum_i X^{i}\frac{\partial f}{\partial x^{i}},$$
  <p>cioè la derivata direzionale di $f$ lungo $X$, punto per punto. <b>Il risultato è ancora una funzione liscia</b>, quindi $X$ si può applicare di nuovo, e questo è il punto di partenza di tutto ciò che segue nel corso.</p>
  <p><b>Un&rsquo;osservazione sulla notazione che evita un equivoco frequente.</b> Il simbolo $Xf$ non è un prodotto: è l&rsquo;applicazione dell&rsquo;operatore $X$ alla funzione $f$, e il risultato è una funzione, non un numero; e non va confuso con $fX$, che è il campo moltiplicato per la funzione (l&rsquo;avvertenza è di Lee). Il numero si ottiene valutando in un punto, $\left(Xf\right)(p)=X_p(f)$. La stessa lettera $X$ indica quindi tre cose che conviene tenere distinte: il campo come sezione del fibrato, l&rsquo;operatore sulle funzioni, e il singolo vettore $X_p$. <b>Sono identificate da teoremi, non da convenzioni</b>, ed è utile sapere quale delle tre si sta usando in ogni passaggio.</p>
  <p>Le proprietà che caratterizzano un campo come operatore sono due, ed è utile vederle insieme:</p>
  <ul>
   <li><b>è $\mathbb{R}$-lineare</b>: $X(af+bg)=aXf+bXg$ per $a,b$ costanti;</li>
   <li><b>soddisfa Leibniz</b>: $X(fg)=f\,Xg+g\,Xf$.</li>
  </ul>
  <p><b>E vale il viceversa</b>, che è il teorema utile: ogni operatore $C^{\infty}(M)\to C^{\infty}(M)$ con queste due proprietà <i>è</i> un campo di vettori. Si dimostra applicandolo alle funzioni coordinate, come per le derivazioni puntuali, dopo aver mostrato che l&rsquo;operatore è locale — se $f$ si annulla vicino a $p$, anche $Xf$ si annulla in $p$ — con una funzione che vale $0$ in $p$ e $1$ fuori da un intorno. <b>Quindi «campo di vettori» e «derivazione dell&rsquo;algebra delle funzioni» sono la stessa cosa</b>, e si può scegliere il punto di vista più comodo — geometrico quando si disegna, algebrico quando si dimostra.</p>
  <p>L&rsquo;isomorfismo, scritto con il quantificatore che porta Leibniz:</p>
  $$\Gamma(TM)\ \cong\ \mathrm{Der}\big(C^\infty(M)\big)=\Big\{D:C^\infty(M)\to C^\infty(M)\ \mathbb{R}\text{-lineare}\ :\ \forall f,g\in C^\infty(M)\ \ D(fg)=f\,Dg+g\,Df\Big\}.$$
  <p>Non è un isomorfismo di spazi vettoriali soltanto: è di <b>moduli su $C^\infty(M)$</b>, e la distinzione conta perché è il modulo a non essere libero su $S^2$.</p>`},
  {t:'prosa', title:'Perche non si possono comporre due campi', tag:'trappola', html:R`
  <p>Una volta stabilito che i campi sono operatori, viene naturale chiedersi se si possano comporre come si compongono gli operatori. Se $X$ e $Y$ sono campi, $XY$ — cioè «applica $Y$, poi applica $X$» — è un operatore ben definito su $C^{\infty}(M)$, perché il risultato di $Y$ è una funzione liscia su cui $X$ può agire. <b>Ma non è un campo di vettori</b>, e la ragione è precisa: non soddisfa Leibniz. Sviluppando,</p>
  $$XY(fg)=X\!\left(f\,Yg+g\,Yf\right)=f\,XYg+g\,XYf+\left(Xf\right)\!\left(Yg\right)+\left(Xg\right)\!\left(Yf\right),$$
  <p>e i due termini finali sono di troppo: un campo darebbe solo i primi due, quelli della regola di Leibniz. In coordinate si vede subito perché — $XY$ contiene <b>derivate seconde</b>, mentre un campo è del primo ordine.</p>
  <p><b>Ma scambiando i ruoli e sottraendo, i termini in eccesso si cancellano</b>: nell&rsquo;espressione per $YX(fg)$ gli stessi due prodotti compaiono identici, perché sono simmetrici in $X$ e $Y$. Quindi</p>
  $$[X,Y]:=XY-YX$$
  <p>soddisfa Leibniz, <b>è</b> dunque un campo di vettori per il teorema di caratterizzazione appena enunciato, e si chiama <b>parentesi di Lie</b>. È l&rsquo;operazione che rende lo spazio dei campi un&rsquo;algebra, e la ragione per cui esiste è tutta in questa cancellazione.</p>
  <div class="note"><b>Il fatto strutturale sotto</b>: gli operatori differenziali di ordine $\le k$ formano uno spazio; il prodotto alza l&rsquo;ordine, il commutatore no. È lo stesso fenomeno che in meccanica quantistica rende i commutatori più interessanti dei prodotti: $\hat x\hat p$ non è un osservabile utile, $[\hat x,\hat p]=i\hbar$ lo è. <b>La parentesi di Lie e il commutatore quantistico sono lo stesso oggetto algebrico</b> in due contesti diversi, e la coincidenza non è casuale — entrambi misurano il fallimento di due operazioni a commutare.</div>`},
  {t:'prosa', title:'Lo spazio dei campi: un modulo, non uno spazio vettoriale', tag:'grammatica', html:R`
  <p>L&rsquo;insieme $\mathfrak{X}(M)$ dei campi lisci su $M$ si somma e si moltiplica per scalari, quindi è uno spazio vettoriale reale — di dimensione <b>infinita</b>, perché un campo è una funzione e le funzioni sono infinite. Su una varietà <span class="str" data-str="compattezza">compatta</span> questo resta vero: la compattezza limita il comportamento all&rsquo;infinito, non il numero di gradi di libertà.</p>
  <p>Ma ha una struttura più ricca e più utile: si può moltiplicare un campo per una <b>funzione</b>, non solo per un numero. Il campo $fX$ è quello che in $p$ vale $f(p)X_p$, ed è ancora liscio. <b>Questo rende $\mathfrak{X}(M)$ un modulo sull&rsquo;anello $C^{\infty}(M)$</b>, ed è la struttura giusta in cui pensarlo.</p>
  <p><b>La differenza non è formale.</b> In uno spazio vettoriale la nozione di base è chiara: $n$ elementi indipendenti che generano. In un modulo su $C^{\infty}(M)$ una «base» sarebbero $n$ campi che in <i>ogni</i> punto formano una base dello spazio tangente — cioè un <b>riferimento globale</b>. E il movimento ha appena mostrato che non sempre esiste: <b>$\mathfrak{X}(S^{2})$ non ha riferimenti globali</b>, quindi è un modulo che non è libero.</p>
  <p><b>Un modulo libero è quello che ha una base</b>, e l&rsquo;esistenza di un riferimento globale equivale esattamente a questo. Quando manca, il modulo resta comunque «finitamente generato» — bastano un numero finito di campi per generare tutto, anche se non sono indipendenti in ogni punto: per la sfera ne bastano tre, le proiezioni sul tangente dei campi coordinati di $\mathbb{R}^{3}$. <b>Generare sì, essere una base no</b>, ed è la distinzione che in algebra lineare non esiste perché lì ogni sistema di generatori contiene una base.</p>
  <p><b>È il modo algebrico di dire «il fibrato non è banale»</b>, ed è anche il ponte con il teorema di Serre-Swan, che identifica i fibrati vettoriali su una varietà compatta con i moduli proiettivi finitamente generati sulle sue funzioni. <b>Non serve per l&rsquo;esame</b>, ma dice perché gli algebristi si interessano di questo movimento: la geometria di $M$ è leggibile nell&rsquo;algebra di $C^{\infty}(M)$, e i fibrati diventano moduli.</p>`}
]},

/* ---------------- 04c · ESERCIZI ---------------- */
{ num:'04c', title:'Esercizi — tocca a te', meta:'il fibrato tangente della circonferenza · un campo su S^2 con un solo zero · e il cociclo verificato a mano',
  blocchi:[
  {t:'esercizio', title:'1 · Il fibrato tangente di S^1, e quello di S^2',
   src:'il primo caso e calcolabile, il secondo e un teorema',
   testo:R`Mostra che $TS^{1}\cong S^{1}\times\mathbb{R}$ esibendo un riferimento globale. Poi spiega perché lo stesso argomento non può funzionare per $S^{2}$, e che cosa si può dire di $TS^{2}$.`,
   steps:[
    {label:'La circonferenza', body:R`
    <p>Sulla circonferenza esiste un campo di vettori tangenti <b>mai nullo</b>: quello che in ogni punto punta nel verso antiorario con modulo costante. In coordinate ambiente, nel punto $(\cos\theta,\sin\theta)$ vale $(-\sin\theta,\cos\theta)$ — è la derivata della parametrizzazione, e non si annulla mai perché $\sin$ e $\cos$ non si annullano insieme.</p>
    <p>Si può scriverlo anche nella carta angolare: è semplicemente $\partial/\partial\theta$, il campo coordinato dell'angolo. L'angolo non è una funzione globale sulla circonferenza — salta di $2\pi$ tornando al punto di partenza — ma il <i>campo</i> che ne deriva sì, perché la derivata di un salto costante è nulla. <b>È il primo esempio di un oggetto globale costruito da una coordinata che globale non è</b>, situazione che ricorrerà con le forme differenziali.</p>
   <p>Quel singolo campo è già un riferimento globale, perché $\dim S^{1}=1$: in ogni punto genera tutto lo spazio tangente. Quindi la mappa $(\theta,\lambda)\mapsto\lambda\,\partial_\theta$ è un diffeomorfismo $S^{1}\times\mathbb{R}\to TS^{1}$, e <b>$S^{1}$ è parallelizzabile</b> — è il Problem 3-4 di Lee. Geometricamente $TS^{1}$ è un <i>cilindro</i>, ed è una delle poche volte in cui un fibrato tangente si disegna.</p>`},
    {label:'La sfera, e perche cambia tutto', body:R`
    <p>Per $S^{2}$ servirebbero <b>due</b> campi indipendenti in ogni punto, e già uno solo mai nullo non esiste: è il teorema della palla pelosa. La ragione strutturale per cui il toro è parallelizzabile e la sfera no è che il toro è un gruppo — il quoziente $\mathbb{R}^{2}/\mathbb{Z}^{2}$, su cui i campi invarianti danno sempre un riferimento globale — mentre la sfera di dimensione due non porta nessuna struttura di gruppo di Lie. <b>Quindi $TS^{2}$ non è banale</b>, e nessuna scelta di carte può renderlo tale — non è un difetto della costruzione, è una proprietà della sfera.</p>
    <p>Quello che si può dire è che $TS^{2}$ è comunque una varietà liscia di dimensione $4$, e che è banale <i>localmente</i>: sopra ogni carta è un prodotto. <b>Un fibrato è sempre localmente banale per definizione</b>, e la domanda interessante è solo se lo sia globalmente. <b>La differenza fra locale e globale è l'intero contenuto della teoria dei fibrati</b>, ed è anche il motivo per cui in fisica i campi di gauge non sono semplicemente funzioni.</p>
    <p><b>Un fatto che sorprende</b>, e che conviene conoscere: di tutte le sfere, solo $S^{1}$, $S^{3}$ e $S^{7}$ sono parallelizzabili. I tre numeri corrispondono a complessi, quaternioni e ottonioni — le uniche algebre di divisione reali. Le prime due sono facili da capire una volta detto: $S^{1}$ è il gruppo dei complessi di modulo uno, $S^{3}$ quello dei quaternioni unitari, e su un gruppo i campi invarianti danno un riferimento globale. $S^{7}$ non è un gruppo — gli ottonioni non sono associativi — eppure è parallelizzabile lo stesso, ed è il caso che rende il teorema difficile. <b>Una domanda che sembra di geometria differenziale elementare ha una risposta che dipende dall'algebra</b>.</p>`}
   ]},
  {t:'plot', title:'Il fibrato tangente della circonferenza e un cilindro',
   intro:R`$TS^{1}$ disegnato come superficie in $\mathbb{R}^{3}$: la base è la circonferenza $\theta$, e sopra ogni punto la retta verticale è lo spazio tangente $T_\theta S^{1}\cong\mathbb{R}$. Trascina per ruotare.`,
   plots:[
    {kind:'param3d', x:'cos(u)', y:'sin(u)', z:'v',
     ur:[0,6.2832], vr:[-1.5,1.5], nu:34, nv:14, yaw:0.65, pitch:0.4, alpha:0.85, height:340,
     title:'base circolare, fibra verticale: il prodotto S^1 x R'}
   ],
   leggi:R`<p><b>È uno dei pochissimi fibrati tangenti che si possono disegnare</b>, e vale la pena guardarlo bene perché fissa l'immagine giusta. La circonferenza in basso è la varietà $M$; ogni retta verticale è uno spazio tangente, e tutti insieme formano una superficie di dimensione $1+1=2$.</p>
   <p>La figura mostra anche perché «banale» significa <i>prodotto</i>: il cilindro è letteralmente $S^{1}\times\mathbb{R}$, e per dirlo bisogna poter scegliere, in modo coerente su tutto il giro, quale direzione chiamare «positiva» sulla fibra. <b>Quella scelta coerente è il campo mai nullo</b>, e nel caso della circonferenza esiste.</p>
   <p><b>Se non esistesse, il risultato sarebbe un nastro di Möbius invece di un cilindro</b>: stesse fibre, stessa base, incollamento diverso — con due carte sulla circonferenza, transizione $+1$ su un pezzo dell&rsquo;intersezione e $-1$ sull&rsquo;altro. È il primo esempio di due fibrati con la stessa base e la stessa fibra che non sono isomorfi. <b>Tutta la teoria dei fibrati nasce da questa distinzione</b>, e la sfera è il caso in cui l'ostruzione non si può disegnare ma si dimostra.</p>`},
  {t:'esercizio', title:'2 · Un campo su S^2 con un solo zero',
   src:'il complemento del teorema della palla pelosa',
   testo:R`Il teorema dice che ogni campo su $S^{2}$ si annulla da qualche parte. Costruisci un campo che si annulli in <b>un solo punto</b>, e spiega perché non è in contraddizione.`,
   steps:[
    {label:'La costruzione', body:R`
    <p>Si prende la carta stereografica dal polo nord, che è un <span class="str" data-str="omeomorfismo">omeomorfismo</span> $\varphi_N:S^{2}\setminus\{N\}\to\mathbb{R}^{2}$, e si trasporta sulla sfera il campo <b>costante</b> $\partial/\partial u^{1}$ di $\mathbb{R}^{2}$. Il campo risultante è liscio e mai nullo su tutta la sfera meno il polo nord. È l&rsquo;Esercizio 11 del foglio 4 di Diverio, e il Problem 8-13 di Lee.</p>
    <p>Nel polo nord il campo <i>non è definito</i>, ma si può estendere ponendolo uguale a zero: nella carta dal polo sud il campo trasportato ha componenti date dalla prima colonna della jacobiana dell&rsquo;inversione, che tendono a zero come $1/|u|^2$ avvicinandosi a $N$, e l&rsquo;estensione è liscia. <b>Quindi esiste un campo con esattamente uno zero</b>, e il teorema è rispettato — dice che ce n'è almeno uno, non che ce ne siano molti.</p>`},
    {label:'Il conto che sta dietro, e il teorema vero', body:R`
    <p>Il risultato generale, di cui la palla pelosa è un corollario, è il <b>teorema di Poincaré-Hopf</b>: per un campo con zeri isolati su una varietà compatta, la somma degli <i>indici</i> degli zeri vale la <span class="str" data-str="caratteristica-di-eulero">caratteristica di Eulero</span> $\chi(M)$.</p>
    <p>Per la sfera $\chi=2$: quindi la somma degli indici deve fare $2$, e in particolare <b>non può essere vuota</b> — un campo senza zeri avrebbe somma zero. Il campo costruito qui ha un solo zero, di indice $2$: attorno al polo nord le frecce compiono due giri, come le linee di un dipolo. Sul toro, dove $\chi=0$, la somma può essere vuota, e infatti esistono campi mai nulli — <b>il toro è parallelizzabile</b>.</p>
    <p><b>È lo stesso numero che dà il conto dei punti critici della funzione altezza</b>: sulla sfera un massimo e un minimo, $1+1=2$; sul toro un massimo, un minimo e due selle, $1-2+1=0$. <b>Due conti completamente diversi — uno sugli zeri di un campo, uno sui punti critici di una funzione — danno lo stesso numero</b>, ed è il tipo di coincidenza che rivela un invariante topologico profondo.</p>`}
   ]},
  {t:'collaudo', title:'Controlla di aver capito', html:R`
  <ol>
  <li>Perché $TM$ ha dimensione $2n$ e non $n$?</li>
  <li>La proiezione $\pi:TM\to M$ è una sommersione. Che cosa sono le sue fibre?</li>
  <li>Che cosa significa esattamente la condizione di cociclo, e che cosa succederebbe se fallisse?</li>
  </ol>`,
   sol:R`<ol>
   <li>Perché un punto di $TM$ è una <b>coppia</b>: un punto $p$ di $M$ ($n$ parametri) e un vettore in $T_pM$ (altri $n$ parametri, le componenti). <b>Non si sta raddoppiando la varietà</b>: si sta registrando, per ogni posizione, anche una velocità. In meccanica è esattamente lo spazio degli stati di un sistema lagrangiano — posizioni e velocità — e la dimensione $2n$ è quella dello spazio delle fasi.</li>
   <li>Le fibre $\pi^{-1}(p)=T_pM$ sono gli spazi tangenti, di dimensione $n=2n-n$, come il teorema del rango prescrive — e che $\pi$ sia una sommersione si vede subito in carta indotta, dove è la proiezione $(x,v)\mapsto x$ sulle prime $n$ coordinate. <b>Sono anche spazi vettoriali</b>, e questa struttura in più — che non tutte le sommersioni hanno — è ciò che rende $TM$ un <i>fibrato vettoriale</i> e non solo un fibrato.</li>
   <li>La condizione di cociclo è $g_{\alpha\gamma}=g_{\alpha\beta}\,g_{\beta\gamma}$ sulle triple intersezioni, dove $g_{\alpha\beta}$ sono le jacobiane delle transizioni. <b>Dice che incollare passando per una carta intermedia dà lo stesso risultato che incollare direttamente</b> — cioè che la relazione con cui si incollano i pezzi è transitiva. Se fallisse, il risultato dell'incollamento dipenderebbe dal percorso seguito fra le carte, e l'oggetto globale non esisterebbe. <b>Per il fibrato tangente la condizione è automatica</b>, perché discende dalla regola della catena; ma quando si costruiscono fibrati a mano — e in teoria di gauge si fa — va verificata, ed è lì che nascono le ostruzioni.</li>
   </ol>`}
]},

/* ---------------- 05 · IL SENSO ---------------- */
{ num:'05', title:'Il senso, e le rotte', meta:'cosa apre, e dove i fibrati diventano fisica',
  blocchi:[
  {t:'prosa', title:'Cosa lascia in mano', tag:'sintesi', html:R`
  <p><b>Il punto.</b> Un fibrato è <b>localmente banale e globalmente no</b>, e la differenza è misurata dai dati di incollamento. È il primo oggetto del corso in cui la topologia globale ha conseguenze concrete e calcolabili: sulla sfera <i>non si può</i> pettinare, e non per mancanza di abilità.</p>
  <p><b>A valle.</b> I campi come derivazioni portano alla parentesi di Lie e all&rsquo;algebra di un gruppo; i campi come equazioni differenziali portano alle curve integrali e ai flussi; e la sfera $S^3$, parallelizzabile, porta la fibrazione di Hopf, l&rsquo;esempio più bello di fibrato non banale.</p>`},
  {t:'prolessi', title:'Dove riappare questo movimento',
   oggetto:R`<b>Il fibrato</b>: una famiglia di spazi vettoriali che varia con continuità, e può essere globalmente attorcigliata.`,
   rotte:[
    {dove:'Teoria<br>di gauge', txt:R`I campi di gauge <b>sono</b> connessioni su fibrati principali, e il cociclo di transizione è la trasformazione di gauge. Il monopolo di Dirac è un fibrato non banale su $S^2$, e la quantizzazione della carica magnetica è la classificazione di quei fibrati: <b>un numero intero topologico</b>.`},
    {dove:'Materia<br>condensata', txt:R`Le bande elettroniche formano un fibrato sul toro di Brillouin; il suo <b>numero di Chern</b> è un intero che non cambia per deformazioni continue, e vale la conduttanza di Hall quantistica. <b>Una misura di laboratorio che dà un invariante topologico con nove cifre di precisione.</b>`},
    {dove:'Meccanica<br>analitica', txt:R`La lagrangiana è una funzione su $TM$ — dipende da posizione <i>e</i> velocità — e questo movimento dice esattamente che cos&rsquo;è quel dominio. L&rsquo;hamiltoniana vive invece su $T^*M$, e la trasformata di Legendre è la mappa fra i due.`},
    {dove:'Relativita<br>generale', txt:R`Un campo vettoriale mai nullo su una varieta' e' cio' che serve per definire una direzione temporale: <b>l'esistenza di una metrica lorentziana e' una condizione topologica</b>, ed e' questa tappa a dire quando e' soddisfatta.`}
   ],
   domanda:R`Su $S^2$ ogni campo continuo ha uno zero, e la somma degli indici degli zeri vale sempre $2$ — non importa quale campo si scelga. <b>Domanda che porti avanti:</b> perché un numero che si calcola contando i vortici di un campo <i>arbitrario</i> è una proprietà della superficie e non del campo? La risposta è il teorema di Poincaré-Hopf, e la struttura che lo rende possibile è la stessa di ogni invariante topologico in fisica: <b>una quantità che si può calcolare localmente in molti modi diversi e che dà sempre lo stesso intero</b>. Da lì arrivano il numero di Chern, gli indici dei difetti nei cristalli liquidi, e la robustezza degli stati di bordo negli isolanti topologici.`}

var byId = {}; TAPPE.forEach(function(s){ byId[s.num]=s; });

var VKEY='pm-nucleogd-07-visited';
function loadSeen(){ try{ return new Set(JSON.parse(localStorage.getItem(VKEY)||'[]')); }catch(e){ return new Set(); } }
function saveSeen(s){ try{ localStorage.setItem(VKEY, JSON.stringify(Array.from(s))); }catch(e){} }
var SEEN = loadSeen();

function renderNav(active){
  var nav=document.getElementById('sidebar');
  nav.innerHTML='';
  var h=document.createElement('h2'); h.textContent='Nucleo gd-07 · le tappe'; nav.appendChild(h);
  TAPPE.forEach(function(s){
    var b=document.createElement('button');
    b.className='navitem'+(active===s.num?' active':'')+(SEEN.has(s.num)?' seen':'');
    b.innerHTML='<span class="dot"></span><span class="nx">'+s.num+'</span><span>'+s.title+'</span>';
    b.onclick=function(){ showTappa(s.num); };
    nav.appendChild(b);
  });
}

/* ---- renderer dei blocchi ---- */
function sectionProsa(title, tag, html){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var body=elFromHTML('<div class="open-body">'+html+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function sectionGram(title, rows){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag gramtag">grammatica</span></h3>';
  var inner='<table class="gramtab">';
  rows.forEach(function(r){ inner+='<tr><td class="gs">'+r[0]+'</td><td>'+r[1]+'</td></tr>'; });
  inner+='</table>';
  var body=elFromHTML('<div class="gramwrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
/* --- blocco PLOT: la figura non decora, si legge. Ogni plot porta una chiave di lettura. --- */
function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';
  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionSvelabile(title, tag, html, sol){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var c=document.createElement('div'); c.className='collaudo-item';
  var q=document.createElement('div'); q.className='cq'; q.innerHTML=html||'';
  c.appendChild(q); typeset(q);
  if(sol){
    var a=document.createElement('div'); a.className='ca'; a.style.display='none';
    a.innerHTML='<b>Soluzione.</b> '+sol;
    var btn=document.createElement('button'); btn.className='reveal-btn small';
    btn.textContent='Rivela la soluzione';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a);
      btn.disabled=true; btn.classList.add('done'); btn.textContent='Soluzione rivelata'; };
    c.appendChild(btn); c.appendChild(a);
  }
  wrap.appendChild(c); return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    /* DUE SCHEMI, NON UNO — scoperto il 2026-10-06 provando le pagine vive. I movimenti
       scritti per primi (em-01..03, me-10b, i collaudi di gd-01..09 e di quattro em)
       usano una forma piu' semplice: `reveal` e `prolessi` con un solo `html`,
       `esercizio` e `collaudo` con `html` + `sol`. Il renderer ne conosceva una sola e
       chiamava `steps.forEach` su `undefined`: TypeError, e la tappa si fermava li' —
       62 blocchi in 17 movimenti su 74. Non si riscrive il contenuto per far contento
       il renderer: e' il renderer che deve leggere cio' che c'e'.
       E in fondo un ramo che NON muore: uno schema nuovo di domani deve far vedere un
       avviso in quella sezione, non spegnere la pagina sotto di se'. */
    try{
      if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
      else if(b.t==='prolessi') m.appendChild(b.rotte ? sectionProlessi(b)
                                   : sectionProsa(b.title,'prolessi',b.html));
      else if(b.t==='reveal')m.appendChild(b.steps ? sectionReveal(b.title,b.tag,b.steps)
                                   : sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='esercizio') m.appendChild(b.steps ? sectionEsercizio(b)
                                   : sectionSvelabile(b.title,'esercizio',b.html,b.sol));
      else if(b.t==='collaudo')  m.appendChild(b.items ? sectionCollaudo(b.title,b.items)
                                   : sectionSvelabile(b.title,'provi, poi riveli',b.html,b.sol));
      else if(b.t==='plot')      m.appendChild(sectionPlot(b));
      else m.appendChild(sectionProsa(b.title||'(blocco)', 'tipo sconosciuto: '+b.t,
                                      b.html||''));
    }catch(err){
      var avv=document.createElement('section'); avv.className='section';
      avv.innerHTML='<h3>'+(b.title||'(blocco)')+'<span class="tag">non reso</span></h3>'
        +'<p style="color:#ff6b6b">Questo blocco non si &egrave; potuto rendere ('
        +b.t+': '+err.message+'). Il resto della tappa continua sotto.</p>';
      m.appendChild(avv);
    }
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* I POP-UP DEGLI STRUMENTI. `cablaStrumenti` esisteva dal 18-09 e non la chiamava
     nessuno: i 229 rimandi del percorso erano <span> senza handler, e il clic non
     faceva niente. Nessun controllo poteva vederlo — la sintassi era valida, le schede
     c'erano tutte, le formule rendevano: il guasto esisteva solo a pagina viva. Qui, e
     dopo ogni inserimento successivo, perche' la tappa si rimonta da capo a ogni
     cambio e gli handler vanno riattaccati al DOM nuovo. */
  cablaStrumenti(m);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}
