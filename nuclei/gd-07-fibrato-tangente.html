var CORSO = 'geometria-differenziale';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["campo-vettoriale"] = {"nome":"Campo vettoriale","riga":"Una funzione che a ogni punto dello spazio associa un vettore, scritta $\\mathbf{F}(x,y,z)=F_x\\,\\hat{\\imath}+F_y\\,\\hat{\\jmath}+F_z\\,\\hat{k}$ con le tre componenti funzioni del punto.","serve":"È il modo di dire «c'è qualcosa in ogni punto dello spazio, e ha una direzione». Serve perché permette di smettere di ragionare su coppie di oggetti che si attraggono a distanza e di ragionare su una proprietà dello spazio: la sorgente prepara il campo, e chi arriva dopo sente solo ciò che trova dove si trova.","esempio":"Il campo di una carica puntiforme $q$ nell'origine è $\\mathbf{E}=\\dfrac{q}{4\\pi\\varepsilon_0 r^{2}}\\hat{r}$: la direzione è radiale, il modulo dipende solo dalla distanza. Con $q=1$ e $4\\pi\\varepsilon_0=1$, nel punto $(3,4,0)$ si ha $r=5$, quindi il modulo vale $\\tfrac{1}{25}$ e il versore è $\\left(\\tfrac35,\\tfrac45,0\\right)$: la componente lungo $x$ è $\\tfrac{3}{125}$.","pieno":{"file":"04-campi-vettoriali.html","tappa":"00","come":"la trattazione completa, nel nucleo sui campi vettoriali di Analisi Vettoriale"},"qui":{"elettromagnetismo":{"serve":"È l'oggetto che l'intero corso studia: $\\mathbf{E}$ e $\\mathbf{B}$ sono campi vettoriali, e le quattro equazioni di Maxwell sono affermazioni su come le loro derivate spaziali si legano alle sorgenti. Tutto ciò che si impara dopo — flusso, circuitazione, divergenza, rotore — è un modo di interrogare un campo vettoriale.","esempio":"Per la carica puntiforme in $(3,4,0)$ con $q=1$ e $4\\pi\\varepsilon_0=1$: $r=5$, modulo $\\tfrac{1}{25}$, e la componente lungo $x$ vale $\\tfrac{3}{125}$. Le tre componenti non sono tre campi separati: ruotando gli assi si mescolano fra loro, ed è quello che rende $\\mathbf{E}$ un vettore e non una terna di numeri."}},"controllo":[{"tipo":"uguale","sinistra":"sqrt(3**2+4**2)","vale":"5","dove":"esempio","appare":"r=5"},{"tipo":"uguale","sinistra":"1/sqrt(3**2+4**2)**2","vale":"1/25","dove":"esempio","appare":"\\tfrac{1}{25}"},{"tipo":"uguale","sinistra":"(1/5**2)*(3/5)","vale":"3/125","dove":"esempio","appare":"\\tfrac{3}{125}"},{"tipo":"uguale","sinistra":"sqrt(3**2+4**2)","vale":"5","dove":"qui.elettromagnetismo.esempio","appare":"r=5"},{"tipo":"uguale","sinistra":"(1/5**2)*(3/5)","vale":"3/125","dove":"qui.elettromagnetismo.esempio","appare":"\\tfrac{3}{125}"}]};
STRUM["compattezza"] = {"nome":"Compattezza","riga":"Ogni ricoprimento aperto ammette un sottoricoprimento finito: è la proprietà che permette di passare da «vale vicino a ogni punto» a «vale su tutto», con un numero finito di passi.","serve":"È l'ipotesi che rende globali le conclusioni locali, ed è per questo che ricorre in ogni dimostrazione di geometria differenziale. In $\\mathbb{R}^n$ equivale a chiuso e limitato (Heine-Borel), ma su una varietà quell'equivalenza non si può usare come definizione, perché «limitato» richiede una distanza e una varietà non ne ha una privilegiata. La conseguenza che si usa più spesso è negativa: gli unici sottoinsiemi di $\\mathbb{R}^n$ che sono **insieme** aperti e compatti sono $\\emptyset$ e nient'altro — ed è l'argomento per cui una varietà compatta non può essere coperta da una sola carta.","esempio":"L'intervallo $(0,1)$ non è compatto, e si vede esibendo un ricoprimento senza sottoricoprimento finito: gli aperti $A_n=\\left(\\tfrac1n,1\\right)$ per $n\\ge2$ ricoprono $(0,1)$, perché ogni $x\\gt0$ sta in $A_n$ appena $\\tfrac1n\\lt x$, cioè appena $n\\gt1/x$. Ma una sottofamiglia finita $A_{n_1},\\dots,A_{n_k}$ ha un indice massimo $N$, quindi la sua unione è $\\left(\\tfrac1N,1\\right)$, e il punto $x=\\tfrac1{2N}$ resta fuori: è positivo, dunque sta in $(0,1)$, ed è minore di $\\tfrac1N$. Il conto che regge l'argomento è $\\lim_{n\\to\\infty}\\tfrac1n=0$: gli $A_n$ si avvicinano a coprire tutto, ma nessuno di essi contiene un intorno di $0$, e servirebbero tutti. Chiudendo l'intervallo, $[0,1]$ diventa compatto e quel ricoprimento smette di essere un ricoprimento — $0$ non sta in nessun $A_n$.","debito":"la dimostrazione del teorema di Heine-Borel e la teoria generale degli spazi compatti stanno fuori dal percorso: qui c'è l'uso che se ne fa. Nel corso di Diverio la compattezza entra come ipotesi (sfera, gruppi di Lie compatti) e come conclusione della locale compattezza delle varietà.","controllo":[{"tipo":"limite","espr":"1/n","var":"n","a":"oo","vale":"0","ipotesi":{"n":"positive"},"dove":"esempio","appare":"\\lim_{n\\to\\infty}\\tfrac1n=0"},{"tipo":"disuguaglianza","sinistra":"1/(2*N)","destra":"1/N","relazione":"<","ipotesi":{"N":"positive"},"dove":"esempio","appare":"minore di $\\tfrac1N$"}]};
STRUM["quoziente-topologico"] = {"nome":"Topologia quoziente","riga":"Si incollano punti dichiarandoli uguali, e si decide che un insieme è aperto nel quoziente quando la sua controimmagine è aperta sopra: è il modo di costruire spazi nuovi senza metterli dentro nessun ambiente.","serve":"È la seconda fabbrica di varietà, accanto ai grafici e ai prodotti, e produce proprio gli esempi che non si vedono come sottoinsiemi di $\\mathbb{R}^n$: il toro, il nastro di Möbius, lo spazio proiettivo. La regola pratica è sempre la stessa: una funzione definita sul quoziente è continua se e solo se, composta con la proiezione, è continua sopra — quindi si lavora sempre con i rappresentanti, controllando che il risultato non dipenda da quale si è scelto. Attenzione: **un quoziente di una varietà non è automaticamente una varietà**, e la proprietà che salta per prima è Hausdorff — la retta con due origini è proprio un quoziente mal riuscito.","esempio":"La circonferenza è $\\mathbb{R}/\\mathbb{Z}$: si dichiarano uguali due numeri che differiscono per un intero, e si manda la classe di $t$ nel punto $\\left(\\cos 2\\pi t,\\ \\sin 2\\pi t\\right)$. Perché la definizione sia lecita il risultato non deve dipendere dal rappresentante, e infatti $\\cos\\!\\left(2\\pi(t+1)\\right)=\\cos 2\\pi t$ e altrettanto per il seno: la mappa passa al quoziente. Ripetendo su due fattori si ottiene il toro $\\mathbb{T}^2=\\mathbb{R}^2/\\mathbb{Z}^2$, cioè il quadrato $[0,1]^2$ con i lati opposti incollati — lo spazio delle configurazioni del pendolo doppio, dove i due angoli sono definiti a meno di un giro. Le carte si prendono restringendo la proiezione a un quadratino di lato minore di $1$: lì è iniettiva, e la sua inversa dà le coordinate.","debito":"la verifica che il quoziente sia Hausdorff e a base numerabile va fatta caso per caso e qui non c'è: per il toro e per lo spazio proiettivo la si trova in Lee, Examples 1.4 e 1.5. Nel percorso, l'unico movimento che costruisce quozienti in dettaglio è gd-01.","controllo":[{"tipo":"uguale","sinistra":"cos(2*pi*(t+1))","vale":"cos(2*pi*t)","ipotesi":{"t":"real"},"dove":"esempio","appare":"\\cos\\!\\left(2\\pi(t+1)\\right)=\\cos 2\\pi t"},{"tipo":"simbolico","perche":"e' la notazione del quoziente di R^2 per il reticolo degli interi: si sta dando un nome allo spazio costruito, non calcolando un valore","dove":"esempio","appare":"\\mathbb{R}^2/\\mathbb{Z}^2"}]};
STRUM["omeomorfismo"] = {"nome":"Omeomorfismo","riga":"Una biiezione continua con inversa continua: due spazi omeomorfi sono lo stesso spazio scritto in due modi, per tutto ciò che la topologia sa vedere.","serve":"È la nozione di «uguale» che si usa quando si dice che una varietà è localmente come $\\mathbb{R}^n$. La richiesta che anche l'inversa sia continua non è pignoleria: senza di essa una biiezione continua può incollare cose lontane — l'applicazione $t\\mapsto(\\cos 2\\pi t,\\sin 2\\pi t)$ da $[0,1)$ alla circonferenza è continua e biunivoca, ma la sua inversa spezza la circonferenza in un punto, e infatti $[0,1)$ e $S^1$ non sono lo stesso spazio (uno è compatto, l'altro no). Le proprietà che si conservano per omeomorfismo — compattezza, connessione, dimensione, gruppo fondamentale — sono esattamente quelle di cui si può parlare su una varietà senza aver scelto una carta.","esempio":"L'intervallo aperto $(0,1)$ e la semiretta $(0,+\\infty)$ sono omeomorfi tramite $f(x)=\\dfrac{x}{1-x}$: è continua su $(0,1)$, manda $0^+$ in $0^+$ e $1^-$ in $+\\infty$, e la sua inversa è $g(y)=\\dfrac{y}{1+y}$, anch'essa continua. Che siano davvero una l'inversa dell'altra si verifica componendo: $g(f(x))=\\dfrac{x/(1-x)}{1+x/(1-x)}=x$. Ne segue che $(0,1)$ è omeomorfo anche a tutto $\\mathbb{R}$ (componendo con $y\\mapsto\\ln y$), il che dice una cosa che all'inizio sorprende: **la lunghezza non è una proprietà topologica**. Non lo è nemmeno l'essere limitato; lo è invece la compattezza, ed è per questo che $[0,1]$ non è omeomorfo a nessuno dei due.","debito":"nessun movimento del percorso tratta la topologia generale come argomento a sé: qui c'è ciò che serve per leggere la definizione di varietà. La classificazione di quali spazi sono omeomorfi a quali è il mestiere della topologia algebrica, e nel corso di Diverio entra solo per la numerabilità del gruppo fondamentale.","controllo":[{"tipo":"uguale","sinistra":"(x/(1-x))/(1+x/(1-x))","vale":"x","ipotesi":{"x":"positive" function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

{ num:'00', title:'Di cosa parla questo movimento', meta:'Geometria Differenziale · voci G.13, G.14, R.6 · da tanti spazi tangenti a una varieta sola',
  blocchi:[
  {t:'prosa', title:'Il salto', tag:'architettura', html:R`
  <p>gd-06 ha dato uno spazio vettoriale $T_pM$ <b>per ogni punto</b>. Sono infiniti spazi separati, e finché restano separati non si può parlare di un vettore che varia <i>con continuità</i> da punto a punto — cioè non si può definire un <b><span class="str" data-str="campo-vettoriale">campo vettoriale</span></b>, che è l&rsquo;oggetto con cui si scrivono tutte le equazioni differenziali.</p>
  <p>La mossa è metterli insieme:
  $$TM=\bigsqcup_{p\in M}T_pM,$$
  e mostrare che quell&rsquo;unione disgiunta è <b>essa stessa una varietà</b>, di dimensione $2n$. Un suo punto è una coppia (punto, vettore in quel punto). <b>La costruzione usa il criterio di gd-03</b> — insieme, carte, transizioni lisce — e le transizioni risultano essere le jacobiane delle transizioni di $M$.</p>
  <p>Fatto questo, un campo vettoriale diventa semplicemente una <b>sezione</b>: una mappa $X:M\to TM$ che a ogni punto assegna un vettore <i>in quel punto</i>. E «liscio» ha già senso, perché sia $M$ sia $TM$ sono varietà lisce. <b>Tutto il movimento serve a rendere ovvia quest&rsquo;ultima frase.</b></p>`}
]},

/* ---------------- 01 · IL FIBRATO ---------------- */
{ num:'01', title:'Il fibrato tangente come varieta', meta:'le carte indotte · la proiezione e una submersione · dimensione 2n',
  blocchi:[
  {t:'prosa', title:'Le carte, e la struttura', tag:'costruzione', html:R`
  <p>Da una carta $(U,\varphi)$ di $M$ con coordinate $x^i$ si ottiene una carta di $TM$ su $\pi^{-1}(U)$:
  $$\left(p,\ \sum_i v^{i}\frac{\partial}{\partial x^{i}}\Big|_p\right)\ \longmapsto\ (x^1,\dots,x^n,v^1,\dots,v^n)\in\mathbb{R}^{2n}.$$
  <b>Le prime $n$ coordinate dicono dove si è, le altre $n$ quale vettore si ha.</b> Queste carte coprono $TM$, e il criterio di gd-03 garantisce che esista un&rsquo;unica topologia che le rende omeomorfismi — purché le transizioni siano lisce, ed è la tappa 02.</p>
  <p>La <b>proiezione naturale</b> $\pi:TM\to M$, che dimentica il vettore e ricorda il punto, è liscia e — in queste coordinate — è $(x,v)\mapsto x$: <b>una submersione suriettiva</b>. Le sue fibre $\pi^{-1}(p)=T_pM$ sono sottovarietà diffeomorfe a $\mathbb{R}^n$.</p>
  <div class="note"><b>Perché si chiama «fibrato» e non semplicemente «prodotto».</b> Localmente $TM$ <i>è</i> un prodotto: $\pi^{-1}(U)\cong U\times\mathbb{R}^n$. Globalmente può non esserlo, e la differenza è tutto il contenuto della tappa 04: $TM\cong M\times\mathbb{R}^n$ succede <b>solo</b> se la varietà è parallelizzabile, e $S^2$ non lo è. <b>Il fibrato è un oggetto che è localmente banale e globalmente può essere attorcigliato</b>, ed è lo stesso fenomeno del nastro di Möbius.</div>`}
]},

/* ---------------- 02 · IL COCICLO JACOBIANO ---------------- */
{ num:'02', title:'Il cociclo jacobiano: come si incollano le carte del fibrato', meta:'la transizione di TM · la condizione di cociclo · e cosa significa',
  blocchi:[
  {t:'prosa', title:'La transizione, e la condizione che soddisfa', tag:'grammatica', html:R`
  <p>Su due carte di $M$ che si sovrappongono, un vettore ha componenti $v^i$ e $\tilde v^j$ legate (gd-06) da
  $$\tilde v^{j}=\sum_i\frac{\partial\tilde x^{j}}{\partial x^{i}}\,v^{i}.$$
  Quindi la transizione fra le due carte <b>indotte</b> su $TM$ è
  $$(x,v)\ \longmapsto\ \big(\tilde x(x),\ J(x)\,v\big),\qquad J(x)=\left(\frac{\partial\tilde x^{j}}{\partial x^{i}}\right),$$
  <b>liscia</b> perché lo sono $\tilde x(x)$ e le sue derivate. <b>Questo basta a fare di $TM$ una varietà</b>, e il conto è tutto qui.</p>
  <p>Le matrici $J_{\alpha\beta}$ soddisfano la <b>condizione di cociclo</b>:
  $$J_{\alpha\gamma}=J_{\alpha\beta}\,J_{\beta\gamma}\quad\text{su }U_\alpha\cap U_\beta\cap U_\gamma,$$
  che è la regola della catena scritta per tre carte. <b>Non è una proprietà accessoria</b>: è la condizione di coerenza che rende l&rsquo;incollamento possibile, ed è il punto in cui i fibrati diventano oggetti classificabili.</p>
  <div class="note"><b>È qui che il corso tocca la fisica senza dirlo.</b> Un fibrato si costruisce dando gli aperti e un <i>cociclo</i> di matrici di transizione a valori in un gruppo — qui $GL(n,\mathbb{R})$. In teoria di gauge quel gruppo è $U(1)$, $SU(2)$, $SU(3)$, e le matrici di transizione <b>sono</b> le trasformazioni di gauge. La struttura è identica; cambia solo il gruppo.</div>`}
]},

/* ---------------- 03 · CAMPI VETTORIALI ---------------- */
{ num:'03', title:'I campi vettoriali: sezioni, derivazioni, e lesempio della sfera', meta:'sezione · modulo sulle funzioni · campi coordinati · latitudine e longitudine',
  blocchi:[
  {t:'prosa', title:'Le tre facce di un campo', tag:'grammatica', html:R`
  <p>Un <b>campo vettoriale</b> è una sezione liscia $X:M\to TM$, cioè $\pi\circ X=\mathrm{id}$. Tre modi di vederlo, tutti usati:</p>
  <ul>
   <li><b>geometrico</b>: a ogni punto una freccia tangente. In coordinate $X=\sum X^{i}(x)\frac{\partial}{\partial x^{i}}$ con $X^i$ funzioni lisce;</li>
   <li><b>algebrico</b>: una <b>derivazione</b> dell&rsquo;algebra $C^\infty(M)$, cioè $X:C^\infty(M)\to C^\infty(M)$ lineare con Leibniz. È la versione «punto per punto» di gd-06 fatta globalmente, e <b>sarà la definizione usata in gd-12</b> per la parentesi di Lie;</li>
   <li><b>dinamico</b>: la legge $\dot\gamma=X(\gamma)$, cioè un&rsquo;equazione differenziale su $M$. È gd-13.</li>
  </ul>
  <p>I campi formano uno spazio vettoriale reale e — di più — un <b>modulo su $C^\infty(M)$</b>: si possono moltiplicare per funzioni. Questa struttura in più è ciò che permette di <b>costruire campi globali con le partizioni dell&rsquo;unità</b> (gd-05): si prende un campo in ogni carta, lo si moltiplica per il peso, e si somma.</p>`},
  {t:'reveal', title:'Latitudine e longitudine su S2, in dettaglio', tag:'esame', steps:[
   {label:'I due campi coordinati', body:R`
   <p>Con $\theta$ colatitudine e $\varphi$ longitudine, la parametrizzazione è $(\sin\theta\cos\varphi,\ \sin\theta\sin\varphi,\ \cos\theta)$, e i due campi coordinati sono le colonne della jacobiana:
   $$\frac{\partial}{\partial\theta}=(\cos\varphi\cos\theta,\ \sin\varphi\cos\theta,\ -\sin\theta),\qquad
   \frac{\partial}{\partial\varphi}=(-\sin\varphi\sin\theta,\ \cos\varphi\sin\theta,\ 0).$$
   Il primo punta verso sud lungo il meridiano, il secondo verso est lungo il parallelo. <b>Sono ortogonali</b> — il loro prodotto scalare è nullo — e il primo ha norma $1$.</p>`},
   {label:'Dove la carta muore, e perche', body:R`
   <p>La norma al quadrato del secondo campo è <b>$\sin^{2}\theta$</b>, e <b>si annulla ai poli</b> ($\theta=0,\pi$). Lì il campo $\partial/\partial\varphi$ è il vettore nullo: <b>non è una base</b>, e le coordinate sferiche smettono di essere una carta.</p>
   <p><b>Non è un difetto della parametrizzazione scelta</b>, ed è il punto che Diverio segnala come «in dettaglio»: è l&rsquo;ombra locale di un fatto globale. Ai poli la longitudine non è definita — tutti i meridiani si incontrano — e nessuna scelta di coordinate su $S^2$ può evitare di avere punti singolari. <b>La tappa successiva dice perché.</b></p>`}

/* ---------------- 04 · PARALLELIZZABILI ---------------- */
{ num:'04', title:'Parallelizzabili: quando il fibrato e banale, e la palla pelosa', meta:'la definizione · TM = M x R^n · S^1 e S^3 si, S^2 no · e il teorema',
  blocchi:[
  {t:'prosa', title:'Il criterio, e il teorema', tag:'idea', html:R`
  <p>$M$ si dice <b>parallelizzabile</b> se esistono $n$ campi vettoriali lisci che in <i>ogni</i> punto formano una base di $T_pM$. <b>Equivale a dire che $TM\cong M\times\mathbb{R}^n$</b>: i campi danno l&rsquo;identificazione globale, e viceversa.</p>
  <p><b>Il teorema della palla pelosa</b>: su $S^{2}$ <i>ogni</i> campo vettoriale continuo si annulla in almeno un punto. Quindi $S^2$ <b>non</b> è parallelizzabile, e il suo fibrato tangente non è un prodotto. Il nome viene dall&rsquo;immagine: non si può pettinare una sfera pelosa senza lasciare un vortice.</p>
  <p><b>Il quadro completo per le sfere è sorprendente</b>: $S^n$ è parallelizzabile <b>solo</b> per $n=1,3,7$. Non è un caso: sono le dimensioni in cui esistono i numeri complessi, i quaternioni e gli ottonioni — cioè le algebre di divisione reali. <b>Un fatto di topologia che equivale a un fatto di algebra</b>, e la dimostrazione (Bott-Milnor, Kervaire, 1958) è uno dei risultati profondi del Novecento.</p>
  <div class="note"><b>Come si riconosce un parallelizzabile in pratica</b>: <i>ogni gruppo di Lie lo è</i> (gd-14), perché si può trasportare una base dall&rsquo;identità con le traslazioni. Quindi $S^1$ e $S^3$ lo sono perché sono gruppi (numeri complessi e quaternioni unitari); $S^2$ non è un gruppo, e infatti non lo è. <b>Il toro $S^1\times S^1$ è parallelizzabile</b> per lo stesso motivo — ed è la ragione per cui sul toro si può pettinare, e sulla sfera no.</div>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Perché la palla pelosa implica che servono almeno due carte su $S^2$?`,
    a:R`Perché una carta globale darebbe un diffeomorfismo con un aperto di $\mathbb{R}^2$, e lì i due campi coordinati costanti non si annullano mai: trasportandoli sulla sfera si avrebbe un campo mai nullo, contro il teorema. <b>Vale anche l&rsquo;argomento di compattezza di gd-01</b>, ma questo è più informativo: dice che l&rsquo;ostruzione è <i>differenziale</i>, non solo topologica.`},
   {q:R`Il toro è compatto come $S^2$, ma è parallelizzabile. Che cosa distingue i due casi?`,
    a:R`La <b>caratteristica di Eulero</b>: il teorema di Poincaré-Hopf dice che la somma degli indici degli zeri di un campo vettoriale vale $\chi(M)$. Per il toro $\chi=0$, quindi un campo senza zeri è possibile; per $S^2$ $\chi=2\ne0$, e gli zeri sono obbligati. <b>Un invariante topologico che decide un fatto sui campi vettoriali</b>: è il genere di teorema per cui questo corso prepara il terreno, e che si incontra subito dopo.`}
  ]}
]},

/* ---------------- 04b · I CAMPI COME OPERATORI, E LE OPERAZIONI CHE SI POSSONO FARE ---------------- */
{ num:'04b', title:'Che cosa si puo fare con un campo, e che cosa no', meta:'il campo come derivazione di funzioni · perche il prodotto di due campi non e un campo · lo spazio dei campi come modulo · e il supporto',
  blocchi:[
  {t:'prosa', title:'Un campo e un operatore differenziale del primo ordine', tag:'idea', html:R`
  <p>Un campo di vettori $X$ assegna a ogni punto un vettore tangente, e ogni vettore tangente è una derivazione. Mettendo insieme, <b>$X$ agisce sulle funzioni lisce</b>: data $f\in C^{\infty}(M)$, si definisce $Xf$ come la funzione che in $p$ vale $X_p(f)$. In coordinate, se $X=\sum_i X^{i}\frac{\partial}{\partial x^{i}}$, allora</p>
  $$Xf=\sum_i X^{i}\frac{\partial f}{\partial x^{i}},$$
  <p>cioè la derivata direzionale di $f$ lungo $X$, punto per punto. <b>Il risultato è ancora una funzione liscia</b>, quindi $X$ si può applicare di nuovo, e questo è il punto di partenza di tutto ciò che segue nel corso.</p>
  <p><b>Un&rsquo;osservazione sulla notazione che evita un equivoco frequente.</b> Il simbolo $Xf$ non è un prodotto: è l&rsquo;applicazione dell&rsquo;operatore $X$ alla funzione $f$, e il risultato è una funzione, non un numero. Il numero si ottiene valutando in un punto, $\left(Xf\right)(p)=X_p(f)$. La stessa lettera $X$ indica quindi tre cose che conviene tenere distinte: il campo come sezione del fibrato, l&rsquo;operatore sulle funzioni, e il singolo vettore $X_p$. <b>Sono identificate da teoremi, non da convenzioni</b>, ed è utile sapere quale delle tre si sta usando in ogni passaggio.</p>
  <p>Le proprietà che caratterizzano un campo come operatore sono due, ed è utile vederle insieme:</p>
  <ul>
   <li><b>è $\mathbb{R}$-lineare</b>: $X(af+bg)=aXf+bXg$ per $a,b$ costanti;</li>
   <li><b>soddisfa Leibniz</b>: $X(fg)=f\,Xg+g\,Xf$.</li>
  </ul>
  <p><b>E vale il viceversa</b>, che è il teorema utile: ogni operatore $C^{\infty}(M)\to C^{\infty}(M)$ con queste due proprietà <i>è</i> un campo di vettori. Si dimostra applicandolo alle funzioni coordinate, come per le derivazioni puntuali. <b>Quindi «campo di vettori» e «derivazione dell&rsquo;algebra delle funzioni» sono la stessa cosa</b>, e si può scegliere il punto di vista più comodo — geometrico quando si disegna, algebrico quando si dimostra.</p>`},
  {t:'prosa', title:'Perche non si possono comporre due campi', tag:'trappola', html:R`
  <p>Una volta stabilito che i campi sono operatori, viene naturale chiedersi se si possano comporre come si compongono gli operatori. Se $X$ e $Y$ sono campi, $XY$ — cioè «applica $Y$, poi applica $X$» — è un operatore ben definito su $C^{\infty}(M)$, perché il risultato di $Y$ è una funzione liscia su cui $X$ può agire. <b>Ma non è un campo di vettori</b>, e la ragione è precisa: non soddisfa Leibniz. Sviluppando,</p>
  $$XY(fg)=X\!\left(f\,Yg+g\,Yf\right)=f\,XYg+g\,XYf+\left(Xf\right)\!\left(Yg\right)+\left(Xg\right)\!\left(Yf\right),$$
  <p>e i due termini finali sono di troppo: un campo darebbe solo i primi due, quelli della regola di Leibniz. In coordinate si vede subito perché — $XY$ contiene <b>derivate seconde</b>, mentre un campo è del primo ordine.</p>
  <p><b>Ma scambiando i ruoli e sottraendo, i termini in eccesso si cancellano</b>: nell&rsquo;espressione per $YX(fg)$ gli stessi due prodotti compaiono identici, perché sono simmetrici in $X$ e $Y$. Quindi</p>
  $$[X,Y]:=XY-YX$$
  <p>soddisfa Leibniz, <b>è</b> dunque un campo di vettori per il teorema di caratterizzazione appena enunciato, e si chiama <b>parentesi di Lie</b>. È l&rsquo;operazione che rende lo spazio dei campi un&rsquo;algebra, ed è il contenuto di un movimento successivo del corso — ma la ragione per cui esiste è tutta in questa cancellazione, e vale la pena averla vista qui.</p>
  <div class="note"><b>Il fatto strutturale sotto</b>: gli operatori differenziali di ordine $\le k$ formano uno spazio; il prodotto alza l&rsquo;ordine, il commutatore no. È lo stesso fenomeno che in meccanica quantistica rende i commutatori più interessanti dei prodotti: $\hat x\hat p$ non è un osservabile utile, $[\hat x,\hat p]=i\hbar$ lo è. <b>La parentesi di Lie e il commutatore quantistico sono lo stesso oggetto algebrico</b> in due contesti diversi, e la coincidenza non è casuale — entrambi misurano il fallimento di due operazioni a commutare.</div>`},
  {t:'prosa', title:'Lo spazio dei campi: un modulo, non uno spazio vettoriale', tag:'grammatica', html:R`
  <p>L&rsquo;insieme $\mathfrak{X}(M)$ dei campi lisci su $M$ si somma e si moltiplica per scalari, quindi è uno spazio vettoriale reale — di dimensione <b>infinita</b>, perché un campo è una funzione e le funzioni sono infinite. Su una varietà <span class="str" data-str="compattezza">compatta</span> questo resta vero: la compattezza limita il comportamento all&rsquo;infinito, non il numero di gradi di libertà.</p>
  <p>Ma ha una struttura più ricca e più utile: si può moltiplicare un campo per una <b>funzione</b>, non solo per un numero. Il campo $fX$ è quello che in $p$ vale $f(p)X_p$, ed è ancora liscio. <b>Questo rende $\mathfrak{X}(M)$ un modulo sull&rsquo;anello $C^{\infty}(M)$</b>, ed è la struttura giusta in cui pensarlo.</p>
  <p><b>La differenza non è formale.</b> In uno spazio vettoriale la nozione di base è chiara: $n$ elementi indipendenti che generano. In un modulo su $C^{\infty}(M)$ una «base» sarebbero $n$ campi che in <i>ogni</i> punto formano una base dello spazio tangente — cioè un <b>riferimento globale</b>. E il movimento ha appena mostrato che non sempre esiste: <b>$\mathfrak{X}(S^{2})$ non ha riferimenti globali</b>, quindi è un modulo che non è libero.</p>
  <p><b>Un modulo libero è quello che ha una base</b>, e l&rsquo;esistenza di un riferimento globale equivale esattamente a questo. Quando manca, il modulo resta comunque «finitamente generato» — bastano un numero finito di campi per generare tutto, anche se non sono indipendenti in ogni punto: per la sfera ne bastano tre, le restrizioni dei campi coordinati di $\mathbb{R}^{3}$ proiettati sul tangente. <b>Generare sì, essere una base no</b>, ed è la distinzione che in algebra lineare non esiste perché lì ogni sistema di generatori contiene una base.</p>
  <p><b>È il modo algebrico di dire «il fibrato non è banale»</b>, ed è anche il ponte con il teorema di Serre-Swan, che identifica i fibrati vettoriali su una varietà compatta con i moduli proiettivi finitamente generati sulle sue funzioni. <b>Non serve per l&rsquo;esame</b>, ma dice perché gli algebristi si interessano di questo movimento: la geometria di $M$ è leggibile nell&rsquo;algebra di $C^{\infty}(M)$, e i fibrati diventano moduli.</p>`}
]},

/* ---------------- 04c · ESERCIZI ---------------- */
{ num:'04c', title:'Esercizi — tocca a te', meta:'il fibrato tangente della circonferenza · un campo su S^2 con un solo zero · e il cociclo verificato a mano',
  blocchi:[
  {t:'esercizio', title:'1 · Il fibrato tangente di S^1, e quello di S^2',
   src:'il primo caso e calcolabile, il secondo e un teorema',
   testo:R`Mostra che $TS^{1}\cong S^{1}\times\mathbb{R}$ esibendo un riferimento globale. Poi spiega perché lo stesso argomento non può funzionare per $S^{2}$, e che cosa si può dire di $TS^{2}$.`,
   steps:[
    {label:'La circonferenza', body:R`
    <p>Sulla circonferenza esiste un campo di vettori tangenti <b>mai nullo</b>: quello che in ogni punto punta nel verso antiorario con modulo costante. In coordinate ambiente, nel punto $(\cos\theta,\sin\theta)$ vale $(-\sin\theta,\cos\theta)$ — è la derivata della parametrizzazione, e non si annulla mai perché $\sin$ e $\cos$ non si annullano insieme.</p>
    <p>Si può scriverlo anche nella carta angolare: è semplicemente $\partial/\partial\theta$, il campo coordinato dell'angolo. L'angolo non è una funzione globale sulla circonferenza — salta di $2\pi$ tornando al punto di partenza — ma il <i>campo</i> che ne deriva sì, perché la derivata di un salto costante è nulla. <b>È il primo esempio di un oggetto globale costruito da una coordinata che globale non è</b>, situazione che ricorrerà con le forme differenziali.</p>
   <p>Quel singolo campo è già un riferimento globale, perché $\dim S^{1}=1$: in ogni punto genera tutto lo spazio tangente. Quindi la mappa $(\theta,\lambda)\mapsto\lambda\,\partial_\theta$ è un diffeomorfismo $S^{1}\times\mathbb{R}\to TS^{1}$, e <b>$S^{1}$ è parallelizzabile</b>. Geometricamente $TS^{1}$ è un <i>cilindro</i>, ed è una delle poche volte in cui un fibrato tangente si disegna.</p>`},
    {label:'La sfera, e perche cambia tutto', body:R`
    <p>Per $S^{2}$ servirebbero <b>due</b> campi indipendenti in ogni punto, e già uno solo mai nullo non esiste: è il teorema della palla pelosa. Vale la pena notare che la sfera <i>non</i> si ottiene come <span class="str" data-str="quoziente-topologico">quoziente</span> di un gruppo che agisca liberamente su se stesso — a differenza del toro, che è $\mathbb{R}^{2}/\mathbb{Z}^{2}$ — e questa è la ragione strutturale per cui il toro è parallelizzabile e la sfera no: su un gruppo di Lie i campi invarianti danno sempre un riferimento globale. <b>Quindi $TS^{2}$ non è banale</b>, e nessuna scelta di carte può renderlo tale — non è un difetto della costruzione, è una proprietà della sfera.</p>
    <p>Quello che si può dire è che $TS^{2}$ è comunque una varietà liscia di dimensione $4$, e che è banale <i>localmente</i>: sopra ogni carta è un prodotto. <b>Un fibrato è sempre localmente banale per definizione</b>, e la domanda interessante è solo se lo sia globalmente. <b>La differenza fra locale e globale è l'intero contenuto della teoria dei fibrati</b>, ed è anche il motivo per cui in fisica i campi di gauge non sono semplicemente funzioni.</p>
    <p>Le prime due sono facili da capire una volta detto: $S^{1}$ è il gruppo dei complessi di modulo uno, $S^{3}$ quello dei quaternioni unitari, e su un gruppo i campi invarianti danno un riferimento globale. $S^{7}$ non è un gruppo — gli ottonioni non sono associativi — eppure è parallelizzabile lo stesso, ed è il caso che rende il teorema difficile.</p>
    <p><b>Un fatto che sorprende</b>, e che conviene conoscere: di tutte le sfere, solo $S^{1}$, $S^{3}$ e $S^{7}$ sono parallelizzabili. I tre numeri corrispondono a complessi, quaternioni e ottonioni — le uniche algebre di divisione reali — e la dimostrazione è di topologia algebrica profonda. <b>Una domanda che sembra di geometria differenziale elementare ha una risposta che dipende dall'algebra</b>.</p>`}
   ]},
  {t:'plot', title:'Il fibrato tangente della circonferenza e un cilindro',
   intro:R`$TS^{1}$ disegnato come superficie in $\mathbb{R}^{3}$: la base è la circonferenza $\theta$, e sopra ogni punto la retta verticale è lo spazio tangente $T_\theta S^{1}\cong\mathbb{R}$. Trascina per ruotare.`,
   plots:[
    {kind:'param3d', x:'cos(u)', y:'sin(u)', z:'v',
     ur:[0,6.2832], vr:[-1.5,1.5], nu:34, nv:14, yaw:0.65, pitch:0.4, alpha:0.85, height:340,
     title:'base circolare, fibra verticale: il prodotto S^1 x R'}
   ],
   leggi:R`<p><b>È uno dei pochissimi fibrati tangenti che si possono disegnare</b>, e vale la pena guardarlo bene perché fissa l'immagine giusta. La circonferenza in basso è la varietà $M$; ogni retta verticale è uno spazio tangente, e tutti insieme formano una superficie di dimensione $1+1=2$.</p>
   <p>La figura mostra anche perché «banale» significa <i>prodotto</i>: il cilindro è letteralmente $S^{1}\times\mathbb{R}$, e per dirlo bisogna poter scegliere, in modo coerente su tutto il giro, quale direzione chiamare «positiva» sulla fibra. <b>Quella scelta coerente è il campo mai nullo</b>, e nel caso della circonferenza esiste.</p>
   <p><b>Se non esistesse, il risultato sarebbe un nastro di Möbius invece di un cilindro</b>: stesse fibre, stessa base, incollamento diverso. È esattamente quello che succede al fibrato tangente di una retta proiettiva reale, e la differenza fra i due — cilindro e Möbius — è il primo esempio di due fibrati con la stessa base e la stessa fibra che non sono isomorfi. <b>Tutta la teoria dei fibrati nasce da questa distinzione</b>, e la sfera è il caso in cui l'ostruzione non si può disegnare ma si dimostra.</p>`},
  {t:'esercizio', title:'2 · Un campo su S^2 con un solo zero',
   src:'il complemento del teorema della palla pelosa',
   testo:R`Il teorema dice che ogni campo su $S^{2}$ si annulla da qualche parte. Costruisci un campo che si annulli in <b>un solo punto</b>, e spiega perché non è in contraddizione.`,
   steps:[
    {label:'La costruzione', body:R`
    <p>Si prende la carta stereografica dal polo nord, che è un <span class="str" data-str="omeomorfismo">omeomorfismo</span> $\varphi_N:S^{2}\setminus\{N\}\to\mathbb{R}^{2}$, e si trasporta sulla sfera il campo <b>costante</b> $\partial/\partial u^{1}$ di $\mathbb{R}^{2}$. Il campo risultante è liscio e mai nullo su tutta la sfera meno il polo nord.</p>
    <p>Nel polo nord il campo <i>non è definito</i>, ma si può estendere ponendolo uguale a zero: verificando in carta stereografica dal polo sud si trova che il campo trasportato tende a zero avvicinandosi a $N$, e l'estensione è liscia. <b>Quindi esiste un campo con esattamente uno zero</b>, e il teorema è rispettato — dice che ce n'è almeno uno, non che ce ne siano molti.</p>`},
    {label:'Il conto che sta dietro, e il teorema vero', body:R`
    <p>Il risultato generale, di cui la palla pelosa è un corollario, è il <b>teorema di Poincaré-Hopf</b>: per un campo con zeri isolati su una varietà compatta, la somma degli <i>indici</i> degli zeri vale la caratteristica di Eulero $\chi(M)$.</p>
    <p>Per la sfera $\chi=2$: quindi la somma degli indici deve fare $2$, e in particolare <b>non può essere vuota</b> — un campo senza zeri avrebbe somma zero. Il campo costruito qui ha un solo zero, di indice $2$. Sul toro, dove $\chi=0$, la somma può essere vuota, e infatti esistono campi mai nulli — <b>il toro è parallelizzabile</b>.</p>
    <p><b>È lo stesso invariante già incontrato con la funzione altezza</b>: massimi meno selle più minimi, che per il toro faceva zero e per la sfera due. <b>Due conti completamente diversi — uno sugli zeri di un campo, uno sui punti critici di una funzione — danno lo stesso numero</b>, ed è il tipo di coincidenza che rivela un invariante topologico profondo.</p>`}
   ]},
  {t:'collaudo', title:'Controlla di aver capito', html:R`
  <ol>
  <li>Perché $TM$ ha dimensione $2n$ e non $n$?</li>
  <li>La proiezione $\pi:TM\to M$ è una sommersione. Che cosa sono le sue fibre?</li>
  <li>Che cosa significa esattamente la condizione di cociclo, e che cosa succederebbe se fallisse?</li>
  </ol>`,
   sol:R`<ol>
   <li>Perché un punto di $TM$ è una <b>coppia</b>: un punto $p$ di $M$ ($n$ parametri) e un vettore in $T_pM$ (altri $n$ parametri, le componenti). <b>Non si sta raddoppiando la varietà</b>: si sta registrando, per ogni posizione, anche una velocità. In meccanica è esattamente lo spazio degli stati di un sistema lagrangiano — posizioni e velocità — e la dimensione $2n$ è quella dello spazio delle fasi.</li>
   <li>Le fibre $\pi^{-1}(p)=T_pM$ sono gli spazi tangenti, di dimensione $n=2n-n$, come il teorema del rango prescrive — e che $\pi$ sia una sommersione si vede subito in carta indotta, dove è la proiezione $(x,v)\mapsto x$ sulle prime $n$ coordinate. <b>Sono anche spazi vettoriali</b>, e questa struttura in più — che non tutte le sommersioni hanno — è ciò che rende $TM$ un <i>fibrato vettoriale</i> e non solo un fibrato.</li>
   <li>La condizione di cociclo è $g_{\alpha\gamma}=g_{\alpha\beta}\,g_{\beta\gamma}$ sulle triple intersezioni, dove $g_{\alpha\beta}$ sono le jacobiane delle transizioni. <b>Dice che incollare passando per una carta intermedia dà lo stesso risultato che incollare direttamente</b> — cioè che la costruzione è coerente. Se fallisse, il risultato dell'incollamento dipenderebbe dal percorso seguito fra le carte, e l'oggetto globale non esisterebbe. <b>Per il fibrato tangente la condizione è automatica</b>, perché discende dalla regola della catena; ma quando si costruiscono fibrati a mano — e in teoria di gauge si fa — va verificata, ed è lì che nascono le ostruzioni.</li>
   </ol>`}
]},

/* ---------------- 05 · IL SENSO ---------------- */
{ num:'05', title:'Il senso, e le rotte', meta:'cosa apre, e dove i fibrati diventano fisica',
  blocchi:[
  {t:'prosa', title:'Cosa lascia in mano', tag:'sintesi', html:R`
  <p><b>Il punto.</b> Un fibrato è <b>localmente banale e globalmente no</b>, e la differenza è misurata dai dati di incollamento. È il primo oggetto del corso in cui la topologia globale ha conseguenze concrete e calcolabili: sulla sfera <i>non si può</i> pettinare, e non per mancanza di abilità.</p>
  <p><b>A valle.</b> gd-11 costruisce la fibrazione di Hopf, l&rsquo;esempio più bello di fibrato non banale; gd-12 usa i campi come derivazioni e ne studia il commutatore; gd-13 e gd-15 li usano come equazioni differenziali.</p>`},
  {t:'prolessi', title:'Dove riappare questo movimento',
   oggetto:R`<b>Il fibrato</b>: una famiglia di spazi vettoriali che varia con continuità, e può essere globalmente attorcigliata.`,
   rotte:[
    {dove:'Teoria<br>di gauge', txt:R`I campi di gauge <b>sono</b> connessioni su fibrati principali, e il cociclo di transizione è la trasformazione di gauge. Il monopolo di Dirac è un fibrato non banale su $S^2$, e la quantizzazione della carica magnetica è la classificazione di quei fibrati: <b>un numero intero topologico</b>.`},
    {dove:'Materia<br>condensata', txt:R`Le bande elettroniche formano un fibrato sul toro di Brillouin; il suo <b>numero di Chern</b> è un intero che non cambia per deformazioni continue, e vale la conduttanza di Hall quantistica. <b>Una misura di laboratorio che dà un invariante topologico con nove cifre di precisione.</b>`},
    {dove:'Meccanica<br>analitica', txt:R`La lagrangiana è una funzione su $TM$ — dipende da posizione <i>e</i> velocità — e questo movimento dice esattamente che cos&rsquo;è quel dominio. L&rsquo;hamiltoniana vive invece su $T^*M$, e la trasformata di Legendre è la mappa fra i due.`},
    {dove:'Relativita<br>generale', txt:R`Un campo vettoriale mai nullo su una varieta' e' cio' che serve per definire una direzione temporale: <b>l'esistenza di una metrica lorentziana e' una condizione topologica</b>, ed e' questa tappa a dire quando e' soddisfatta.`}
   ],
   domanda:R`Su $S^2$ ogni campo continuo ha uno zero, e la somma degli indici degli zeri vale sempre $2$ — non importa quale campo si scelga. <b>Domanda che porti avanti:</b> perché un numero che si calcola contando i vortici di un campo <i>arbitrario</i> è una proprietà della superficie e non del campo? La risposta è il teorema di Poincaré-Hopf, e la struttura che lo rende possibile è la stessa di ogni invariante topologico in fisica: <b>una quantità che si può calcolare localmente in molti modi diversi e che dà sempre lo stesso intero</b>. Da lì arrivano il numero di Chern, gli indici dei difetti nei cristalli liquidi, e la robustezza degli stati di bordo negli isolanti topologici.`}
]}

];

  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';
  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
    else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
    else if(b.t==='prolessi') m.appendChild(sectionProlessi(b));
    else if(b.t==='reveal')m.appendChild(sectionReveal(b.title,b.tag,b.steps));
    else if(b.t==='esercizio') m.appendChild(sectionEsercizio(b));
    else if(b.t==='collaudo')  m.appendChild(sectionCollaudo(b.title,b.items));
    else if(b.t==='plot')      m.appendChild(sectionPlot(b));
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}

/* deep-link: gd-07-fibrato-tangente.html#03 apre direttamente la tappa 03 */
window.addEventListener('DOMContentLoaded', function(){
  var h=(location.hash||'').replace('#','');
  showTappa(byId[h]?h:'00');
});
window.addEventListener('hashchange', function(){
  var h=(location.hash||'').replace('#','');
  if(byId[h]) showTappa(h);
});
</script>
