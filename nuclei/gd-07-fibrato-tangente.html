var CORSO = 'geometria-differenziale';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["campo-vettoriale"] = {"nome":"Campo vettoriale","riga":"Una funzione che a ogni punto dello spazio associa un vettore, scritta $\\mathbf{F}(x,y,z)=F_x\\,\\hat{\\imath}+F_y\\,\\hat{\\jmath}+F_z\\,\\hat{k}$ con le tre componenti funzioni del punto.","serve":"È il modo di dire «c'è qualcosa in ogni punto dello spazio, e ha una direzione». Serve perché permette di smettere di ragionare su coppie di oggetti che si attraggono a distanza e di ragionare su una proprietà dello spazio: la sorgente prepara il campo, e chi arriva dopo sente solo ciò che trova dove si trova.","esempio":"Il campo di una carica puntiforme $q$ nell'origine è $\\mathbf{E}=\\dfrac{q}{4\\pi\\varepsilon_0 r^{2}}\\hat{r}$: la direzione è radiale, il modulo dipende solo dalla distanza. Con $q=1$ e $4\\pi\\varepsilon_0=1$, nel punto $(3,4,0)$ si ha $r=5$, quindi il modulo vale $\\tfrac{1}{25}$ e il versore è $\\left(\\tfrac35,\\tfrac45,0\\right)$: la componente lungo $x$ è $\\tfrac{3}{125}$.","pieno":{"file":"04-campi-vettoriali.html","tappa":"00","come":"la trattazione completa, nel nucleo sui campi vettoriali di Analisi Vettoriale"},"qui":{"elettromagnetismo":{"serve":"È l'oggetto che l'intero corso studia: $\\mathbf{E}$ e $\\mathbf{B}$ sono campi vettoriali, e le quattro equazioni di Maxwell sono affermazioni su come le loro derivate spaziali si legano alle sorgenti. Tutto ciò che si impara dopo — flusso, circuitazione, divergenza, rotore — è un modo di interrogare un campo vettoriale.","esempio":"Per la carica puntiforme in $(3,4,0)$ con $q=1$ e $4\\pi\\varepsilon_0=1$: $r=5$, modulo $\\tfrac{1}{25}$, e la componente lungo $x$ vale $\\tfrac{3}{125}$. Le tre componenti non sono tre campi separati: ruotando gli assi si mescolano fra loro, ed è quello che rende $\\mathbf{E}$ un vettore e non una terna di numeri."}},"controllo":[{"tipo":"uguale","sinistra":"sqrt(3**2+4**2)","vale":"5","dove":"esempio","appare":"r=5"},{"tipo":"uguale","sinistra":"1/sqrt(3**2+4**2)**2","vale":"1/25","dove":"esempio","appare":"\\tfrac{1}{25}"},{"tipo":"uguale","sinistra":"(1/5**2)*(3/5)","vale":"3/125","dove":"esempio","appare":"\\tfrac{3}{125}"},{"tipo":"uguale","sinistra":"sqrt(3**2+4**2)","vale":"5","dove":"qui.elettromagnetismo.esempio","appare":"r=5"},{"tipo":"uguale","sinistra":"(1/5**2)*(3/5)","vale":"3/125","dove":"qui.elettromagnetismo.esempio","appare":"\\tfrac{3}{125}"}]};
STRUM["base-numerabile"] = {"nome":"Base numerabile","riga":"Uno spazio è a base numerabile (secondo-numerabile) quando ammette una base numerabile per l'intera topologia, cioè una famiglia numerabile di aperti di cui ogni aperto è unione.","serve":"a garantire che una proprietà locale si rimonti a globale con una quantità controllabile di pezzi. La conseguenza operativa è il teorema di Lindelöf: in uno spazio secondo-numerabile ogni ricoprimento aperto, anche più che numerabile, ammette un sottoricoprimento numerabile — tradotto in geometria differenziale, ogni varietà ammette un atlante numerabile, e quindi partizioni dell'unità numerabili su cui sommare e integrare. È questo il motivo per cui «a base numerabile» è la terza clausola della definizione di varietà topologica: esclude spazi Hausdorff e localmente euclidei ma troppo grandi per un atlante scrivibile. Il secondo assioma implica il primo (primo-numerabile: base locale numerabile in ogni punto), ma non viceversa, perché le basi locali di punti diversi non si incollano automaticamente in un'unica famiglia numerabile.","esempio":"Ogni spazio metrico è primo-numerabile grazie alle palle di raggio $1/n$, e il conto dietro è elementare. Preso $p$ e un suo intorno che contiene la palla $B_r(p)$ con, poniamo, $r=\\tfrac{3}{10}$, basta scegliere $n$ con $\\tfrac1n\\lt r$: siccome $\\tfrac14=\\tfrac{25}{100}$ e $\\tfrac14\\lt\\tfrac3{10}$, la palla $B_{1/4}(p)$ sta dentro $B_r(p)$. La famiglia è annidata, $\\tfrac1{11}\\lt\\tfrac1{10}$, e numerabile: $\\mathbb{R}$ è così primo-numerabile, ed è anche secondo-numerabile perché gli intervalli a estremi razionali sono una base numerabile dell'intera retta. Non è automatico — $\\mathbb{R}$ con la topologia discreta, dove ogni singoletto $\\{p\\}$ è aperto, resta primo-numerabile (base locale $\\{\\{p\\}\\}$, un solo elemento) ma non secondo-numerabile, perché una base dovrebbe contenere ciascuno degli infiniti più che numerabili singoletti.","pieno":{"file":"tp-02-basi-e-numerabilita.html","tappa":"02","come":"il primo e il secondo assioma di numerabilità a confronto, perché il secondo implica il primo e non viceversa, e la base locale annidata di raggio 1/n negli spazi metrici"},"controllo":[{"tipo":"uguale","sinistra":"1/4","vale":"25/100","dove":"esempio","appare":"\\tfrac14=\\tfrac{25}{100}"},{"tipo":"disuguaglianza","sinistra":"1/4","relazione":"<","destra":"3/10","dove":"esempio","appare":"\\tfrac14\\lt\\tfrac3{10}"},{"tipo":"disuguaglianza","sinistra":"1/11","relazione":"<","destra":"1/10","dove":"esempio","appare":"\\tfrac1{11}\\lt\\tfrac1{10}"}]};
STRUM["hausdorff"] = {"nome":"Hausdorff","riga":"Uno spazio è di Hausdorff (assioma $T_2$, o separato) quando due punti distinti qualunque si possono racchiudere in due aperti disgiunti.","serve":"a dare senso univoco alla parola «limite»: in uno spazio di Hausdorff una successione non può convergere a due punti diversi, quindi scrivere $\\lim_n x_n=p$ individua un solo $p$. La conseguenza che si usa più spesso in geometria differenziale è però un'altra e più forte: Hausdorff è l'ipotesi che converte «compatto» in «chiuso» — ogni sottoinsieme compatto di uno spazio di Hausdorff è chiuso — ed è per questo che la separazione è la prima delle tre clausole della definizione di varietà topologica, accanto a «localmente euclideo» e «a base numerabile». Attenzione al verso: il sottospazio la eredita sempre (gli aperti disgiunti dell'ambiente si intersecano col sottospazio e restano disgiunti), mentre il quoziente può romperla, perché la sua topologia guarda in uscita.","esempio":"Ogni spazio metrico è di Hausdorff, e lo si vede col punto medio. Su $\\mathbb{R}$, presi $p=0$ e $q=8$, la distanza è $D=8$ e si pone $\\varepsilon=\\tfrac{8-0}{2}=4$: le palle aperte $B(0,4)=(-4,4)$ e $B(8,4)=(4,12)$ sono disgiunte. Se un punto $z$ stesse in entrambe, la disuguaglianza triangolare darebbe $D\\le d(0,z)+d(z,8)\\lt\\varepsilon+\\varepsilon=4+4=8=D$, cioè $8\\lt 8$, assurdo. Il margine è il più stretto possibile: le due palle si toccano nell'unico punto $0+4=8-4=4$, che però, essendo aperte, non appartiene a nessuna delle due.","pieno":{"file":"tp-06-hausdorff-e-separazione.html","tappa":"01","come":"la definizione di Hausdorff nella forma diretta, perché non è ridondante rispetto a «localmente euclideo», e il fatto che il sottospazio la eredita"},"controllo":[{"tipo":"uguale","sinistra":"(8-0)/2","vale":"4","dove":"esempio","appare":"\\tfrac{8-0}{2}=4"},{"tipo":"uguale","sinistra":"4+4","vale":"8","dove":"esempio","appare":"4+4=8"},{"tipo":"uguale","sinistra":"0+4","vale":"4","dove":"esempio","appare":"0+4=8-4=4"},{"tipo":"uguale","sinistra":"8-4","vale":"4","dove":"esempio","appare":"0+4=8-4=4"}]};
STRUM["quoziente-topologico"] = {"nome":"Topologia quoziente","riga":"Si incollano punti dichiarandoli uguali, e si decide che un insieme è aperto nel quoziente quando la sua controimmagine è aperta sopra: è il modo di costruire spazi nuovi senza metterli dentro nessun ambiente.","serve":"È la seconda fabbrica di varietà, accanto ai grafici e ai prodotti, e produce proprio gli esempi che non si vedono come sottoinsiemi di $\\mathbb{R}^n$: il toro, il nastro di Möbius, lo spazio proiettivo. La regola pratica è sempre la stessa: una funzione definita sul quoziente è continua se e solo se, composta con la proiezione, è continua sopra — quindi si lavora sempre con i rappresentanti, controllando che il risultato non dipenda da quale si è scelto. Attenzione: **un quoziente di una varietà non è automaticamente una varietà**, e la proprietà che salta per prima è Hausdorff — la retta con due origini è proprio un quoziente mal riuscito.","esempio":"La circonferenza è $\\mathbb{R}/\\mathbb{Z}$: si dichiarano uguali due numeri che differiscono per un intero, e si manda la classe di $t$ nel punto $\\left(\\cos 2\\pi t,\\ \\sin 2\\pi t\\right)$. Perché la definizione sia lecita il risultato non deve dipendere dal rappresentante, e infatti $\\cos\\!\\left(2\\pi(t+1)\\right)=\\cos 2\\pi t$ e altrettanto per il seno: la mappa passa al quoziente. Ripetendo su due fattori si ottiene il toro $\\mathbb{T}^2=\\mathbb{R}^2/\\mathbb{Z}^2$, cioè il quadrato $[0,1]^2$ con i lati opposti incollati — lo spazio delle configurazioni del pendolo doppio, dove i due angoli sono definiti a meno di un giro. Le carte si prendono restringendo la proiezione a un quadratino di lato minore di $1$: lì è iniettiva, e la sua inversa dà le coordinate.","debito":"la verifica che il quoziente sia Hausdorff e a base numerabile va fatta caso per caso e qui non c'è: per il toro e per lo spazio proiettivo la si trova in Lee, Examples 1.4 e 1.5. Nel percorso, l'unico movimento che costruisce quozienti in dettaglio è gd-01.","controllo":[{"tipo":"uguale","sinistra":"cos(2*pi*(t+1))","vale":"cos(2*pi*t)","ipotesi":{"t":"real"},"dove":"esempio","appare":"\\cos\\!\\left(2\\pi(t+1)\\right)=\\cos 2\\pi t"},{"tipo":"simbolico","perche":"e' la notazione del quoziente di R^2 per il reticolo degli interi: si sta dando un nome allo spazio costruito, non calcolando un valore","dove":"esempio","appare":"\\mathbb{R}^2/\\mathbb{Z}^2"}]};
STRUM["caratteristica-di-eulero"] = {"nome":"Caratteristica di Eulero","riga":"È il numero intero $\\chi(M)$ che, per una superficie triangolata, vale vertici meno spigoli più facce, non dipende dalla triangolazione scelta, e su una varietà compatta conta con segno gli zeri di qualunque campo vettoriale.","serve":"a decidere se su una varietà compatta esistano oggetti globali che una partizione dell'unità non sa costruire, perché l'insieme in cui vivono non è convesso. Il fatto che si usa è il teorema di Poincaré-Hopf: se un campo vettoriale su una varietà compatta ha zeri isolati, la somma dei loro indici (il numero di giri che il campo compie su un cerchietto attorno allo zero, con segno) vale $\\chi(M)$, qualunque sia il campo. Ne seguono due conseguenze operative. Se $\\chi(M)\\neq0$, ogni campo ha almeno uno zero: è il teorema della palla pelosa per $S^2$, che ha $\\chi=2$. Se $\\chi(M)=0$, esiste un campo mai nullo, e su una varietà compatta questo equivale ad avere una metrica lorentziana, cioè a poter essere uno spazio-tempo. Le superfici compatte orientabili hanno $\\chi=2-2g$, con $g$ il numero di buchi: solo il toro ha caratteristica nulla, perché con $g=1$ viene $\\chi=2-2\\cdot1=0$.","esempio":"Si calcola sulla sfera con la triangolazione più piccola, il bordo di un tetraedro: $4$ vertici, $6$ spigoli, $4$ facce, quindi $\\chi(S^2)=4-6+4=2$. Con il bordo di un cubo, che è un'altra decomposizione della stessa sfera, si contano $8$ vertici, $12$ spigoli e $6$ facce quadrate, e torna lo stesso numero: $8-12+6=2$. Il toro si ottiene da un quadrato identificando i lati opposti, e la decomposizione minima ha un solo vertice (i quattro angoli diventano un punto), due spigoli e una faccia: $\\chi(T^2)=1-2+1=0$. Il confronto con i campi è immediato. Sul toro il campo $\\partial/\\partial\\vartheta_1$ della coordinata angolare non si annulla mai, coerentemente con $\\chi=0$. Sulla sfera il campo di rotazione attorno all'asse verticale si annulla nei due poli, e ciascuno ha indice $+1$: la somma $1+1=2$ è esattamente $\\chi(S^2)$, e nessun campo può fare meglio.","debito":"che $\\chi$ non dipenda dalla decomposizione scelta, e il teorema di Poincaré-Hopf che lega $\\chi$ agli zeri dei campi, si dimostrano con l'omologia (o con la teoria del grado) in un corso di topologia algebrica, che non è fra i prerequisiti; in Lee la palla pelosa è il Problem 16-6, risolto con la coomologia di de Rham. Qui si enuncia il teorema, si calcola $\\chi$ sui casi che servono, e si dichiara il confine: il corso usa $\\chi$ per sapere quando un'ostruzione esiste, non per dimostrarla.","controllo":[{"tipo":"uguale","sinistra":"4-6+4","vale":"2","dove":"esempio","appare":"\\chi(S^2)=4-6+4=2"},{"tipo":"uguale","sinistra":"8-12+6","vale":"2","dove":"esempio","appare":"8-12+6=2"},{"tipo":"uguale","sinistra":"1-2+1","vale":"0","dove":"esempio","appare":"\\chi(T^2)=1-2+1=0"},{"tipo":"uguale","sinistra":"1+1","vale":"2","dove":"esempio","appare":"1+1=2"},{"tipo":"uguale","sinistra":"2-2*1","vale":"0","dove":"serve","appare":"2-2\\cdot1=0"}]};
STRUM["parentesi-di-lie"] = {"nome":"Parentesi di Lie","riga":"$[X,Y]f=X(Yf)-Y(Xf)$: il commutatore di due campi vettoriali, che resta un campo vettoriale perche i termini del secondo ordine si cancellano.","serve":"a misurare se due flussi commutano. Trascinare un punto lungo $X$ e poi lungo $Y$ non da in generale lo stesso risultato dell'ordine inverso, e $[X,Y]$ e il difetto di chiusura di quel quadratino al primo ordine non banale. Da qui due usi: $[X,Y]=0$ se e solo se i flussi commutano, e quindi se e solo se i due campi si possono usare come coordinate; e la parentesi fa dei campi vettoriali un'algebra di Lie, la struttura che ricompare dentro ogni gruppo di simmetria.","esempio":"Siano $X=y\\dfrac{\\partial}{\\partial x}$ e $Y=x\\dfrac{\\partial}{\\partial y}$, i due tagli elementari del piano, e si calcoli su $f=x^2y$. Da una parte $Yf=x\\cdot x^2=x^3$ e dunque $X(Yf)=y\\cdot3x^2=3x^2y$; dall'altra $Xf=y\\cdot2xy=2xy^2$ e dunque $Y(Xf)=x\\cdot4xy=4x^2y$. La differenza e $3x^2y-4x^2y=-x^2y$. Lo stesso valore si ottiene applicando a $f$ il campo $[X,Y]=y\\dfrac{\\partial}{\\partial y}-x\\dfrac{\\partial}{\\partial x}$, cioe $y\\cdot x^2-x\\cdot 2xy=-x^2y$: le due strade coincidono, e il risultato e del primo ordine, perche i termini in $\\partial^2$ si sono cancellati.","pieno":{"file":"gd-12-parentesi-lie.html","tappa":"01","come":"la parentesi come commutatore, e perche resta del primo ordine"},"controllo":[{"tipo":"uguale","sinistra":"x*diff(x**2*y,y)","vale":"x**3","dove":"esempio","appare":"Yf=x\\cdot x^2=x^3"},{"tipo":"uguale","sinistra":"y*diff(x**2*y,x)","vale":"2*x*y**2","dove":"esempio","appare":"Xf=y\\cdot2xy=2xy^2"},{"tipo":"uguale","sinistra":"y*diff(x*diff(x**2*y,y),x)","vale":"3*x**2*y","dove":"esempio","appare":"X(Yf)=y\\cdot3x^2=3x^2y"},{"tipo":"uguale","sinistra":"x*diff(y*diff(x**2*y,x),y)","vale":"4*x**2*y","dove":"esempio","appare":"Y(Xf)=x\\cdot4xy=4x^2y"},{"tipo":"uguale","sinistra":"3*x**2*y-4*x**2*y","vale":"-x**2*y","dove":"esempio","appare":"3x^2y-4x^2y=-x^2y"},{"tipo":"uguale","sinistra":"y*diff(x**2*y,y)-x*diff(x**2*y,x)","vale":"-x**2*y","dove":"esempio","appare":"y\\cdot x^2-x\\cdot 2xy=-x^2y"}]};
STRUM["gruppo-di-lie"] = {"nome":"Gruppo di Lie","riga":"Una varieta differenziabile che e anche un gruppo, e in cui il prodotto $(g,h)\\mapsto gh$ e l'inverso $g\\mapsto g^{-1}$ sono applicazioni lisce.","serve":"a trattare insieme due strutture che di solito si studiano separate: la simmetria (il gruppo) e il calcolo differenziale (la varieta). La conseguenza che si usa di piu e l'omogeneita: le traslazioni $L_g(x)=gx$ sono diffeomorfismi, quindi ogni punto ha un intorno diffeomorfo a quello dell'identita, e tutto cio che si dimostra nell'identita si trasporta ovunque gratis. Da qui seguono due fatti usati continuamente: ogni gruppo di Lie e parallelizzabile, e per conoscerne la geometria infinitesima basta lo spazio tangente in un punto solo, che si chiama la sua algebra di Lie.","esempio":"Il gruppo delle rotazioni del piano $SO(2)$ e la circonferenza. Una sua matrice e $R(\\theta)=\\begin{pmatrix}\\cos\\theta & -\\sin\\theta\\\\ \\sin\\theta & \\cos\\theta\\end{pmatrix}$, e che il determinante valga $1$ si verifica subito: $\\cos^2\\theta+\\sin^2\\theta=1$. Il prodotto e liscio perche in coordinate e l'addizione degli angoli — svolgendo la riga in alto del prodotto $R(\\alpha)R(\\varphi)$ si trova $\\cos\\alpha\\cos\\varphi-\\sin\\alpha\\sin\\varphi=\\cos(\\alpha+\\varphi)$ e $\\sin\\alpha\\cos\\varphi+\\cos\\alpha\\sin\\varphi=\\sin(\\alpha+\\varphi)$, cioe $R(\\alpha)R(\\varphi)=R(\\alpha+\\varphi)$ — e l'inverso e $R(-\\theta)$, liscio in $\\theta$. La varieta sottostante e $S^1$, di dimensione $1$.","pieno":{"file":"gd-14-gruppi-di-lie.html","tappa":"01","come":"i gruppi di matrici, la traslazione che rende tutto omogeneo, e l'algebra di Lie come tangente all'identita"},"controllo":[{"tipo":"uguale","sinistra":"cos(theta)**2+sin(theta)**2","vale":"1","dove":"esempio","appare":"\\cos^2\\theta+\\sin^2\\theta=1"},{"tipo":"uguale","sinistra":"cos(alpha)*cos(varphi)-sin(alpha)*sin(varphi)","vale":"cos(alpha+varphi)","dove":"esempio","appare":"\\cos\\alpha\\cos\\varphi-\\sin\\alpha\\sin\\varphi=\\cos(\\alpha+\\varphi)"},{"tipo":"uguale","sinistra":"sin(alpha)*cos(varphi)+cos(alpha)*sin(varphi)","vale":"sin(alpha+varphi)","dove":"esempio","appare":"\\sin\\alpha\\cos\\varphi+\\cos\\alpha\\sin\\varphi=\\sin(\\alpha+\\varphi)"}]};
STRUM["compattezza"] = {"nome":"Compattezza","riga":"Ogni ricoprimento aperto ammette un sottoricoprimento finito: è la proprietà che permette di passare da «vale vicino a ogni punto» a «vale su tutto», con un numero finito di passi.","serve":"È l'ipotesi che rende globali le conclusioni locali, ed è per questo che ricorre in ogni dimostrazione di geometria differenziale. In $\\mathbb{R}^n$ equivale a chiuso e limitato (Heine-Borel), ma su una varietà quell'equivalenza non si può usare come definizione, perché «limitato» richiede una distanza e una varietà non ne ha una privilegiata. La conseguenza che si usa più spesso è negativa: gli unici sottoinsiemi di $\\mathbb{R}^n$ che sono **insieme** aperti e compatti sono $\\emptyset$ e nient'altro — ed è l'argomento per cui una varietà compatta non può essere coperta da una sola carta.","esempio":"L'intervallo $(0,1)$ non è compatto, e si vede esibendo un ricoprimento senza sottoricoprimento finito: gli aperti $A_n=\\left(\\tfrac1n,1\\right)$ per $n\\ge2$ ricoprono $(0,1)$, perché ogni $x\\gt0$ sta in $A_n$ appena $\\tfrac1n\\lt x$, cioè appena $n\\gt1/x$. Ma una sottofamiglia finita $A_{n_1},\\dots,A_{n_k}$ ha un indice massimo $N$, quindi la sua unione è $\\left(\\tfrac1N,1\\right)$, e il punto $x=\\tfrac1{2N}$ resta fuori: è positivo, dunque sta in $(0,1)$, ed è minore di $\\tfrac1N$. Il conto che regge l'argomento è $\\lim_{n\\to\\infty}\\tfrac1n=0$: gli $A_n$ si avvicinano a coprire tutto, ma nessuno di essi contiene un intorno di $0$, e servirebbero tutti. Chiudendo l'intervallo, $[0,1]$ diventa compatto e quel ricoprimento smette di essere un ricoprimento — $0$ non sta in nessun $A_n$.","debito":"la dimostrazione del teorema di Heine-Borel e la teoria generale degli spazi compatti stanno fuori dal percorso: qui c'è l'uso che se ne fa. Nel corso di Diverio la compattezza entra come ipotesi (sfera, gruppi di Lie compatti) e come conclusione della locale compattezza delle varietà.","controllo":[{"tipo":"limite","espr":"1/n","var":"n","a":"oo","vale":"0","ipotesi":{"n":"positive"},"dove":"esempio","appare":"\\lim_{n\\to\\infty}\\tfrac1n=0"},{"tipo":"disuguaglianza","sinistra":"1/(2*N)","destra":"1/N","relazione":"<","ipotesi":{"N":"positive"},"dove":"esempio","appare":"minore di $\\tfrac1N$"}]};
STRUM["omeomorfismo"] = {"nome":"Omeomorfismo","riga":"Una biiezione continua con inversa continua: due spazi omeomorfi sono lo stesso spazio scritto in due modi, per tutto ciò che la topologia sa vedere.","serve":"È la nozione di «uguale» che si usa quando si dice che una varietà è localmente come $\\mathbb{R}^n$. La richiesta che anche l'inversa sia continua non è pignoleria: senza di essa una biiezione continua può incollare cose lontane — l'applicazione $t\\mapsto(\\cos 2\\pi t,\\sin 2\\pi t)$ da $[0,1)$ alla circonferenza è continua e biunivoca, ma la sua inversa spezza la circonferenza in un punto, e infatti $[0,1)$ e $S^1$ non sono lo stesso spazio (uno è compatto, l'altro no). Le proprietà che si conservano per omeomorfismo — compattezza, connessione, dimensione, gruppo fondamentale — sono esattamente quelle di cui si può parlare su una varietà senza aver scelto una carta.","esempio":"L'intervallo aperto $(0,1)$ e la semiretta $(0,+\\infty)$ sono omeomorfi tramite $f(x)=\\dfrac{x}{1-x}$: è continua su $(0,1)$, manda $0^+$ in $0^+$ e $1^-$ in $+\\infty$, e la sua inversa è $g(y)=\\dfrac{y}{1+y}$, anch'essa continua. Che siano davvero una l'inversa dell'altra si verifica componendo: $g(f(x))=\\dfrac{x/(1-x)}{1+x/(1-x)}=x$. Ne segue che $(0,1)$ è omeomorfo anche a tutto $\\mathbb{R}$ (componendo con $y\\mapsto\\ln y$), il che dice una cosa che all'inizio sorprende: **la lunghezza non è una proprietà topologica**. Non lo è nemmeno l'essere limitato; lo è invece la compattezza, ed è per questo che $[0,1]$ non è omeomorfo a nessuno dei due.","debito":"nessun movimento del percorso tratta la topologia generale come argomento a sé: qui c'è ciò che serve per leggere la definizione di varietà. La classificazione di quali spazi sono omeomorfi a quali è il mestiere della topologia algebrica, e nel corso di Diverio entra solo per la numerabilità del gruppo fondamentale.","controllo":[{"tipo":"uguale","sinistra":"(x/(1-x))/(1+x/(1-x))","vale":"x","ipotesi":{"x":"positive"},"dove":"esempio","appare":"=x"}]};

function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';
  return h;
}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}
