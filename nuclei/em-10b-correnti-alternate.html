<script>
"use strict";
const R = String.raw;

function typeset(el){
  if(el && window.renderMathInElement){
    try{ renderMathInElement(el,{delimiters:[
      {left:'$$',right:'$$',display:true},
      {left:'$',right:'$',display:false}
    ],throwOnError:false}); }catch(e){}
  }
}
function elFromHTML(html){ var d=document.createElement('div'); d.innerHTML=html; return d; }

/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un
   rimando scritto nella prosa:

       <span class="str" data-str="serie-geometrica">la serie geometrica</span>

   Le schede citate da questo nucleo sono cucite qui sotto dal montaggio
   (assembla-nucleo.js): la pagina resta autosufficiente — niente fetch,
   niente sottocartelle da pubblicare — e un rimando a una scheda che non
   esiste FERMA la costruzione invece di arrivare in pagina rotto.
   Apertura: lo stesso gesto del collaudo (si clicca, il pannello compare,
   si typeset una volta sola), portato dentro la frase.
   =================================================================== */
var CORSO = 'elettromagnetismo';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};


function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';
  return h;
}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

/* ===================================================================
   >>> CONTENUTO — Nucleo em-10b: Le correnti alternate <<<
   Modello dati: TAPPE[] ; ogni tappa ha blocchi[] con un tipo (t).
   Tipi: prosa | gram | reveal | esercizio | collaudo | prolessi | plot
   Tutta la matematica in R`...` (String.raw). Nelle formule si usano
   \lt \gt \le \ge (mai < > nudi, che l'HTML leggerebbe come tag).
   =================================================================== */

var TAPPE = [


/*MOVIMENTO
id:        em-10b — le correnti alternate
identita:  tre componenti diverse, un solo numero complesso
copre:     B.8 — Circuiti in corrente alternata, impedenza, risonanza
serve:     em-07 (em-07-la-corrente.html), em-10 (em-10-induzione.html)
apre:      em-11 (em-11-maxwell.html)
strumenti: campo-vettoriale
fonti:     Focardi cap. 9; programma di Bini voce B.8; le prove d'esame che chiedono circuiti RLC
generata:  2026-09-18 da mappa.json — non modificare a mano, si cambia la mappa
MOVIMENTO*/

/*CONTROLLO
[
 {"tipo":"uguale","sinistra":"Abs(R+I*(w*L-1/(w*C))).subs(w,1/sqrt(L*C))","vale":"R",
  "ipotesi":{"R":"positive","L":"positive","C":"positive","w":"positive"},
  "dove":"03","appare":"|Z|=R"},

 {"tipo":"uguale","sinistra":"(w*L-1/(w*C))/R","vale":"w*L/R-1/(C*R*w)",
  "ipotesi":{"R":"positive","L":"positive","C":"positive","w":"positive"},
  "dove":"02","appare":"\\tan\\varphi=\\frac{\\omega L-\\frac{1}{\\omega C}}{R}"},

 {"tipo":"integrale","espr":"(V0*sin(w*t))**2","var":"t","da":"0","a":"2*pi/w",
  "vale":"pi*V0**2/w",
  "ipotesi":{"V0":"positive","w":"positive","t":"positive"},
  "dove":"04","appare":"\\frac{V_0^{2}}{2}"},

 {"tipo":"integrale","espr":"V0*sin(w*t)*(V0/R)*sin(w*t)","var":"t","da":"0","a":"2*pi/w",
  "vale":"pi*V0**2/(R*w)",
  "ipotesi":{"V0":"positive","R":"positive","w":"positive","t":"positive"},
  "dove":"04","appare":"\\frac{V_0^{2}}{2R}"},

 {"tipo":"uguale","sinistra":"1/sqrt(L*C)","vale":"sqrt(1/(L*C))",
  "ipotesi":{"L":"positive","C":"positive"},
  "dove":"03","appare":"\\omega_0=\\frac{1}{\\sqrt{LC}}"},

 {"tipo":"uguale","sinistra":"diff(exp(I*w*t),t)","vale":"I*w*exp(I*w*t)",
  "ipotesi":{"w":"positive","t":"positive"},
  "dove":"01","appare":"i\\omega"},

 {"tipo":"uguale","sinistra":"1/(I*w)","vale":"-I/w",
  "ipotesi":{"w":"positive"},
  "dove":"02","appare":"-i/\\omega"},

 {"tipo":"simbolico","dove":"02","appare":"Z_L=i\\omega L",
  "perche":"e' la definizione di impedenza dell'induttanza, ottenuta applicando la derivata complessa alla legge di L: enunciato del risultato"},

 {"tipo":"simbolico","dove":"02","appare":"Z_C=\\frac{1}{i\\omega C}",
  "perche":"stessa cosa per il condensatore: la definizione di impedenza capacitiva"}
]
CONTROLLO*/

/* ---------------- 00 · DI COSA PARLA QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Di cosa parla questo movimento', meta:'Elettromagnetismo · voce B.8 · il movimento che il blueprint non aveva, trovato dal giudice il 16-09',
  blocchi:[
  {t:'prosa', title:'Perche esiste, e cosa promette', tag:'architettura', html:R`
  <p>Con un generatore sinusoidale, ogni circuito con $R$, $L$ e $C$ obbedisce a un&rsquo;equazione differenziale — e risolverla ogni volta con seni e coseni è un lavoro sproporzionato al risultato. <b>Questo movimento è il trucco che lo evita</b>, e il trucco è puro Metodi: si lavora con esponenziali complessi, le derivate diventano moltiplicazioni, e l&rsquo;equazione differenziale diventa <b>algebra</b>.</p>
  <p>La promessa, in una riga: dopo questa tappa un circuito RLC in alternata si risolve <b>come se fosse in continua</b>, con la legge di Ohm $V=ZI$ dove $Z$ è un numero complesso. Modulo e fase dell&rsquo;impedenza contengono tutto: quanto passa, e quanto è sfasata.</p>
  <div class="note"><b>Questo movimento non era nel progetto iniziale.</b> L&rsquo;ha trovato il giudice del programma il 16-09, confrontando la mappa con il programma di Bini: la voce B.8 «correnti alternate» non era rivendicata da nessun movimento. È il tipo di buco che a occhio non si vede — non manca un argomento vistoso, manca un argomento che il <i>docente</i> chiede e che il libro di struttura non enfatizza.</div>`}
]},

/* ---------------- 01 · I FASORI ---------------- */
{ num:'01', title:'I fasori: perche conviene passare ai complessi', meta:'derivare diventa moltiplicare · la parte reale alla fine · il legame con Metodi',
  blocchi:[
  {t:'prosa', title:'La mossa, e perche funziona', tag:'costruzione', html:R`
  <p>Si sostituisce $V(t)=V_0\cos(\omega t)$ con $\tilde V(t)=V_0e^{i\omega t}$, tenendo a mente che il segnale fisico è la <b>parte reale</b>. Il vantaggio è tutto qui:
  $$\frac{d}{dt}e^{i\omega t}=i\omega\,e^{i\omega t},$$
  cioè <b>derivare equivale a moltiplicare per $i\omega$</b>. Un&rsquo;equazione differenziale lineare a coefficienti costanti diventa un&rsquo;equazione algebrica nel numero complesso.</p>
  <p><b>È lecito</b> perché le equazioni dei circuiti sono <b>lineari</b> a coefficienti reali: la parte reale della soluzione complessa è la soluzione del problema reale. <b>Smette di essere lecito</b> appena compare una non linearità o quando si calcolano le <i>potenze</i>, che contengono prodotti di due grandezze: lì il prodotto delle parti reali non è la parte reale del prodotto, ed è l&rsquo;errore più comune di questa tappa (si rimedia con la formula della potenza media, tappa 04).</p>
  <p><b>Il legame con Metodi è diretto</b>: questa è la stessa idea della trasformata di Laplace di <code>me-10b</code>, ristretta a una sola frequenza. Là si trasformava tutto il transitorio, qui si guarda il solo regime sinusoidale — e in cambio non serve nemmeno antitrasformare.</p>`}
]},

/* ---------------- 02 · L'IMPEDENZA ---------------- */
{ num:'02', title:'Limpedenza: un solo numero per tre componenti diverse', meta:'Z_R, Z_L, Z_C · serie e parallelo come in continua · modulo e fase',
  blocchi:[
  {t:'prosa', title:'Le tre impedenze', tag:'regola operativa', html:R`
  <p>Applicando la sostituzione alle tre leggi elementari:</p>
  <ul>
   <li><b>resistenza</b>: $V=RI$ resta $Z_R=R$, reale — tensione e corrente <b>in fase</b>;</li>
   <li><b>induttanza</b>: $V=L\dot I$ diventa $Z_L=i\omega L$ — la tensione <b>anticipa</b> la corrente di $90°$, e l&rsquo;impedenza cresce con la frequenza (a frequenza altissima l&rsquo;induttanza è un circuito aperto);</li>
   <li><b>condensatore</b>: $I=C\dot V$ diventa $Z_C=\dfrac{1}{i\omega C}$ — la tensione <b>ritarda</b> di $90°$, e l&rsquo;impedenza cala con la frequenza (a frequenza altissima il condensatore è un cortocircuito).</li>
  </ul>
  <p><b>Il guadagno è che serie e parallelo funzionano esattamente come in continua</b>: si sommano le impedenze in serie, gli inversi in parallelo. Per un RLC serie:
  $$Z=R+i\left(\omega L-\frac{1}{\omega C}\right),\qquad |Z|=\sqrt{R^{2}+\left(\omega L-\frac1{\omega C}\right)^{2}},\qquad \tan\varphi=\frac{\omega L-\frac{1}{\omega C}}{R}.$$
  <b>Il modulo dà l&rsquo;ampiezza della corrente ($I_0=V_0/|Z|$), la fase dice di quanto è sfasata.</b> I due termini reattivi si sottraggono: è questo che rende possibile la risonanza.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Perché induttanza e condensatore hanno sfasamenti opposti?`,
    a:R`Perché una risponde alla <b>derivata</b> della corrente e l&rsquo;altro al suo <b>integrale</b>: $i\omega$ contro $1/(i\omega)=-i/\omega$. Nel piano complesso uno moltiplica per $+i$ (rotazione di $+90°$) e l&rsquo;altro per $-i$. <b>È il motivo per cui possono cancellarsi</b>, e la frequenza a cui lo fanno esattamente è la risonanza.`}
  ]}
]},

/* ---------------- 03 · LA RISONANZA ---------------- */
{ num:'03', title:'La risonanza: quando le due reattanze si cancellano', meta:'omega_0 = 1/sqrt(LC) · |Z| = R · il fattore di merito · la larghezza di banda',
  blocchi:[
  {t:'prosa', title:'La condizione, e cosa succede', tag:'idea', html:R`
  <p>La parte immaginaria dell&rsquo;impedenza si annulla quando $\omega L=\dfrac{1}{\omega C}$, cioè a
  $$\omega_0=\frac{1}{\sqrt{LC}}.$$
  Lì $|Z|=R$: <b>il minimo possibile</b>, la corrente è massima, e tensione e corrente sono in fase. Il circuito, che a frequenze diverse «resiste», a quella frequenza si comporta come se induttanza e condensatore non ci fossero.</p>
  <p><b>Non è che spariscano</b>: le loro tensioni ai capi sono grandi e <i>opposte</i>, e possono essere molto maggiori di quella del generatore — il rapporto è il <b>fattore di merito</b>
  $$Q=\frac{\omega_0L}{R}.$$
  Un $Q$ alto significa picco stretto e selettivo; la <b>larghezza di banda</b> a metà potenza è $\Delta\omega=\omega_0/Q$. È il principio con cui una radio sceglie una stazione e ignora le altre: la stessa antenna riceve tutto, il circuito risonante seleziona.</p>
  <div class="note"><b>La stessa struttura matematica dell&rsquo;oscillatore forzato smorzato</b> della meccanica: $R$ è l&rsquo;attrito, $L$ la massa, $1/C$ la costante elastica. Le formule sono <i>le stesse</i>, e in me-12 hai risolto quell&rsquo;equazione con la funzione di Green. Chi ha capito la risonanza meccanica non ha nulla di nuovo da capire qui — solo un dizionario da imparare.</div>`},
  {t:'plot', title:'La curva di risonanza, al variare del fattore di merito',
   intro:R`Ampiezza della corrente in funzione della frequenza, in unità $\omega_0=1$ e $V_0=1$, per tre valori di $R$ (cioè tre $Q$).`,
   plots:[
    {kind:'func2d', xr:[0.2,2.4], yr:[0,5.5], height:350,
     title:'piu piccola la resistenza, piu stretto e alto il picco',
     xlabel:'omega / omega_0', ylabel:'ampiezza della corrente',
     curves:[
      {f:'1/sqrt(pow(0.2,2)+pow(x-1/x,2))', col:'#5eead4', width:2.4, label:'R piccola: Q alto'},
      {f:'1/sqrt(pow(0.5,2)+pow(x-1/x,2))', col:'#d8a13a', width:2.2, label:'R media'},
      {f:'1/sqrt(pow(1.2,2)+pow(x-1/x,2))', col:'#b98cff', width:2.2, label:'R grande: Q basso'}
     ],
     segs:[{x1:1, y1:0, x2:1, y2:5.4, col:'#ff6b6b', dash:true, width:1.4, label:'omega_0', lx:1.03, ly:5.1}],
     marks:[{x:1, y:5, label:'a risonanza |Z|=R', col:'#5eead4', left:true}]}
   ],
   leggi:R`<b>Tutte e tre le curve hanno il picco nello stesso punto</b>, $\omega_0=1/\sqrt{LC}$: la posizione della risonanza dipende solo da $L$ e $C$, <b>non dalla resistenza</b>. Ciò che $R$ decide è l&rsquo;<i>altezza</i> e la <i>larghezza</i>: con $R$ piccola il picco è alto e stretto (selettivo), con $R$ grande è basso e largo. Il prodotto altezza×larghezza resta all&rsquo;incirca costante — l&rsquo;energia che il circuito può accettare si redistribuisce, non aumenta.<br><br>
   <b>Da leggere anche il comportamento lontano dal picco</b>: a frequenza bassa la corrente tende a zero perché il condensatore blocca il continuo; a frequenza alta tende a zero perché l&rsquo;induttanza si oppone alle variazioni rapide. <b>Il circuito RLC serie è un filtro passa-banda</b>, e le due code raccontano quali delle due componenti sta bloccando da quale parte.`}
]},

/* ---------------- 04 · LA POTENZA ---------------- */
{ num:'04', title:'La potenza in alternata: valori efficaci e fattore di potenza', meta:'perche V_rms = V0/sqrt2 · P = V_rms I_rms cos(phi) · perche le reattanze non dissipano',
  blocchi:[
  {t:'prosa', title:'I valori efficaci, e da dove viene la radice di due', tag:'costruzione', html:R`
  <p>La potenza istantanea oscilla; ciò che conta è la media su un periodo. Per una resistenza, la media di $V_0^{2}\sin^{2}(\omega t)$ è $\dfrac{V_0^{2}}{2}$, quindi la potenza media è $\dfrac{V_0^{2}}{2R}$. <b>Si definisce allora il valore efficace</b>
  $$V_{\text{rms}}=\frac{V_0}{\sqrt2},$$
  scelto proprio perché con esso la formula ritorna quella del continuo, $P=\dfrac{V_{\text{rms}}^{2}}{R}$. <b>I 230 V della rete sono un valore efficace</b>: il picco è circa 325 V, ed è quello che deve reggere l&rsquo;isolamento.</p>`},
  {t:'prosa', title:'Il fattore di potenza, e perche le reattanze non consumano', tag:'idea', html:R`
  <p>In generale tensione e corrente sono sfasate di $\varphi$, e la potenza media è
  $$\langle P\rangle=V_{\text{rms}}I_{\text{rms}}\cos\varphi.$$
  Il termine $\cos\varphi$ è il <b>fattore di potenza</b>. Per una resistenza $\varphi=0$ e si dissipa tutto; <b>per un&rsquo;induttanza o un condensatore puri $\varphi=\pm90°$ e la potenza media è ZERO</b>.</p>
  <p><b>Non significa che non succeda niente</b>: durante un quarto di periodo la componente accumula energia (nel campo magnetico o elettrico), nel quarto successivo la restituisce al generatore. L&rsquo;energia oscilla avanti e indietro senza essere consumata. <b>Solo la resistenza dissipa</b>, ed è la traduzione in alternata del fatto che il campo magnetico non fa lavoro (em-08) e che un condensatore ideale non ha perdite.</p>
  <div class="note"><b>Perché è un problema pratico e non solo una formula.</b> Un carico industriale molto induttivo — motori — ha $\cos\varphi$ basso: assorbe una corrente grande di cui solo una parte produce lavoro, mentre il resto va e viene scaldando i cavi lungo tutta la linea. Per questo le utenze industriali sono obbligate a <b>rifasare</b>, cioè ad aggiungere condensatori che cancellano la reattanza induttiva. È letteralmente la risonanza della tappa 03 usata come strumento.</div>`}
]},

/* ---------------- 05 · IL SENSO ---------------- */
{ num:'05', title:'Il senso, e le rotte', meta:'cosa chiude, cosa apre, e la risposta in frequenza come idea generale',
  blocchi:[
  {t:'prosa', title:'Cosa lascia in mano', tag:'sintesi', html:R`
  <p><b>A monte.</b> em-07 dava i circuiti in continua, em-10 l&rsquo;autoinduzione. Qui i due si uniscono con un generatore sinusoidale, e lo strumento che li tiene insieme viene da Metodi: gli esponenziali complessi.</p>
  <p><b>Il punto.</b> Un sistema lineare, sollecitato a una frequenza, risponde a <b>quella</b> frequenza — cambiano solo ampiezza e fase. Tutta l&rsquo;informazione sta quindi in <b>un numero complesso per ogni $\omega$</b>: la funzione di risposta. È una delle idee più riusabili della fisica, e qui compare nella sua forma più semplice.</p>
  <p><b>A valle.</b> em-12 tratterà le onde, che sono la stessa analisi in frequenza applicata ai campi nello spazio; e la dipendenza di $\varepsilon_r$ dalla frequenza (em-05) è la stessa storia per i materiali.</p>`},
  {t:'prolessi', title:'Dove riappare questo movimento, nella fisica che farai',
   oggetto:R`<b>La risposta in frequenza</b>: un numero complesso che riassume come un sistema lineare reagisce a una sollecitazione sinusoidale.`,
   rotte:[
    {dove:'Metodi<br>matematici', txt:R`L&rsquo;impedenza è la <b>funzione di trasferimento</b> valutata su $s=i\omega$, cioè la trasformata di Laplace di me-10b guardata sull&rsquo;asse immaginario. I poli di $1/Z$ nel piano complesso sono le frequenze proprie del circuito, e la loro parte reale è lo smorzamento.`},
    {dove:'Teoria della<br>risposta lineare', txt:R`Suscettività dielettrica, magnetica, mobilità, conducibilità: ogni risposta lineare è una funzione complessa della frequenza, con parte reale (in fase, non dissipativa) e immaginaria (in quadratura, dissipativa). <b>Il fattore di potenza è l&rsquo;esempio più semplice di quella distinzione.</b>`},
    {dove:'Meccanica<br>quantistica', txt:R`Le risonanze compaiono negli spettri di assorbimento e nello scattering: una risonanza è un polo dell&rsquo;ampiezza vicino all&rsquo;asse reale, con larghezza inversamente proporzionale alla vita media dello stato. <b>Il fattore $Q$ diventa il rapporto fra energia e larghezza di riga.</b>`},
    {dove:'Causalita', txt:R`Poiché la risposta non precede la causa, l&rsquo;impedenza è analitica in un semipiano, e valgono le relazioni di <b>Kramers-Kronig</b> fra la sua parte reale e immaginaria. È lo stesso teorema incontrato in em-05 per $\varepsilon(\omega)$: <b>dissipazione e dispersione sono legate</b>, e non da un'analogia ma da un'identità.`}
   ],
   domanda:R`Un circuito risonante con $Q$ altissimo seleziona una frequenza quasi esatta — ma per «accorgersi» della frequenza deve osservare il segnale per molti periodi: più è selettivo, più è lento a rispondere. <b>Domanda che porti avanti:</b> esiste un limite invalicabile al prodotto fra precisione in frequenza e tempo di osservazione? La risposta è sì, ed è $\Delta\omega\,\Delta t\gtrsim1$ — un teorema sull&rsquo;analisi di Fourier, non sulla fisica. In meccanica quantistica, moltiplicato per $\hbar$, diventa l&rsquo;indeterminazione energia-tempo: <b>la stessa disuguaglianza, con un'altra interpretazione.</b>`}
]}

];

var byId = {}; TAPPE.forEach(function(s){ byId[s.num]=s; });

var VKEY='pm-nucleoem-10b-visited';
function loadSeen(){ try{ return new Set(JSON.parse(localStorage.getItem(VKEY)||'[]')); }catch(e){ return new Set(); } }
function saveSeen(s){ try{ localStorage.setItem(VKEY, JSON.stringify(Array.from(s))); }catch(e){} }
var SEEN = loadSeen();

function renderNav(active){
  var nav=document.getElementById('sidebar');
  nav.innerHTML='';
  var h=document.createElement('h2'); h.textContent='Nucleo em-10b · le tappe'; nav.appendChild(h);
  TAPPE.forEach(function(s){
    var b=document.createElement('button');
    b.className='navitem'+(active===s.num?' active':'')+(SEEN.has(s.num)?' seen':'');
    b.innerHTML='<span class="dot"></span><span class="nx">'+s.num+'</span><span>'+s.title+'</span>';
    b.onclick=function(){ showTappa(s.num); };
    nav.appendChild(b);
  });
}

/* ---- renderer dei blocchi ---- */
function sectionProsa(title, tag, html){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var body=elFromHTML('<div class="open-body">'+html+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function sectionGram(title, rows){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag gramtag">grammatica</span></h3>';
  var inner='<table class="gramtab">';
  rows.forEach(function(r){ inner+='<tr><td class="gs">'+r[0]+'</td><td>'+r[1]+'</td></tr>'; });
  inner+='</table>';
  var body=elFromHTML('<div class="gramwrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
/* --- blocco PLOT: la figura non decora, si legge. Ogni plot porta una chiave di lettura. --- */
function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';
  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
    else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
    else if(b.t==='prolessi') m.appendChild(sectionProlessi(b));
    else if(b.t==='reveal')m.appendChild(sectionReveal(b.title,b.tag,b.steps));
    else if(b.t==='esercizio') m.appendChild(sectionEsercizio(b));
    else if(b.t==='collaudo')  m.appendChild(sectionCollaudo(b.title,b.items));
    else if(b.t==='plot')      m.appendChild(sectionPlot(b));
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}

});
window.addEventListener('hashchange', function(){
  var h=(location.hash||'').replace('#','');
  if(byId[h]) showTappa(h);
});
