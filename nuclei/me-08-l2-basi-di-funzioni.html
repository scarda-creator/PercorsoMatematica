{ num:'00', title:'Di cosa parla questo movimento', meta:'Metodi · il collo di bottiglia del modulo di analisi funzionale: le note §4-5 e tutto Calogero §4.7',
  blocchi:[
  {t:'prosa', title:'Una frase, e il programma del movimento', tag:'first principles', html:R`
  <p>In dimensione finita un vettore è una lista di numeri $(v_1,\dots,v_N)$ e il prodotto scalare è una somma. Il passo che questo movimento compie è uno solo, e tutto il resto ne discende:</p>
  <p style="text-align:center"><i>si lascia crescere l'indice fino a diventare una <b>variabile continua</b>: $v_k\rightsquigarrow f(x)$, e la somma $\sum_k v_k^*u_k$ diventa l'integrale $\int dx\,f^*(x)g(x)$.</i></p>
  <p>Fatto questo, <b>una funzione è un vettore</b>: ha una norma, ha degli angoli con le altre funzioni, si proietta su una base. Lo spazio che si ottiene si chiama $L^2$, ed è lo <b>spazio di funzioni</b> in cui vivono le funzioni d'onda della meccanica quantistica. Due conseguenze immediate, ed è per queste che il corso lo fa:</p>
  <ul>
  <li>Una <b>base</b> di $L^2$ è un insieme numerabile di funzioni $\{e_n(x)\}$ tale che ogni $f$ si scrive $f=\sum_n c_n e_n$ con $c_n=\langle e_n|f\rangle$. Le serie di Fourier (me-10) sono <b>esattamente</b> questo con una base particolare; i polinomi di Legendre, Laguerre e Hermite sono le altre tre basi che il programma nomina.</li>
  <li>La macchina che le produce tutte e tre è una sola, ed è già nota da me-06: <b>Gram-Schmidt applicato ai monomi</b> $\{1,x,x^2,\dots\}$. Cambia solo l'intervallo — e l'intervallo decide la famiglia. Su $[-1,1]$ escono i Legendre, su $[0,\infty)$ i Laguerre, su $(-\infty,\infty)$ gli Hermite. Non sono tre teorie: è una procedura sola girata tre volte.</li>
  </ul>
  <p><b>Quanto in profondità, e perché così.</b> Sulle <b>24 prove</b> d'esame di Metodi in banca dati questo movimento è toccato da <b>7</b>, con densità di chiavi <b>7,4</b> — la più alta fra i movimenti di analisi funzionale. (Il numero è stato rifatto il 18-09: il conto del 17-09 diceva «9 su 26, densità 27,6» perché il misuratore contava anche le note del docente e il programma d'esame come se fossero prove, e le note sono il testo più fitto del corpus.) Qui, al contrario di me-00, si va a fondo — e a fondo significa che ogni conto delle note di Esposito è rifatto per intero, che le tre famiglie sono costruite una per una invece di essere citate, e che c'è una tappa intera (07) dedicata alla <b>seconda strada</b> per arrivarci, quella di Calogero via Sturm-Liouville, perché nelle prove compaiono entrambe.</p>`},
  {t:'prosa', title:'Cosa saprai fare, uscendo di qui', tag:'performance attesa', html:R`
  <ul>
  <li>Dire se una funzione assegnata sta in $L^2$ su un dato intervallo, e per quali valori di un parametro — che è l'esercizio 1 del Set 2 e il primo scoglio di metà delle prove.</li>
  <li><b>Ortonormalizzare</b> due o tre funzioni esplicite in $L^2$ con Gram-Schmidt: è la prova del 12/02/2025, esercizio 3, sette punti, e non richiede nient'altro che saper fare tre integrali.</li>
  <li>Spiegare perché serve <b>Lebesgue</b> e non Riemann, con l'esempio che lo mostra (la funzione di Dirichlet), e cosa vuol dire «<b>quasi ovunque</b>».</li>
  <li>Costruire i primi polinomi di <b>Legendre</b>, <b>Laguerre</b> e <b>Hermite</b> con Gram-Schmidt, e riconoscerli poi dalla formula di Rodrigues, dall'equazione differenziale e dalla relazione di ricorrenza.</li>
  <li>Espandere una funzione data in una di quelle basi, cioè calcolare i coefficienti $c_n$ — l'esercizio 3 del Set 2 e il punto finale della prova del 09/09/2025.</li>
  <li>Riconoscere la base di Hermite quando compare come <b>autobase</b> dell'operatore $-\frac{d^2}{dx^2}+x^2$, che è il modo in cui compare in fisica e nelle prove sulle PDE.</li>
  <li>Enunciare la <b>completezza</b> di $L^2$ e sapere che cosa esattamente asserisce (le successioni di Cauchy convergono <i>dentro</i> lo spazio) e che cosa non asserisce (la convergenza in norma non è la convergenza puntuale).</li>
  </ul>
  <p>Questo movimento poggia su me-06 (prodotto scalare, norma, successioni di Cauchy, Gram-Schmidt in dimensione finita) e regge me-09, me-09b e me-10: è il punto di passaggio obbligato fra il modulo finito-dimensionale e tutto il resto dell'analisi funzionale.</p>`}
]},

/* ---------------- 01 · IL PASSO IN DIMENSIONE INFINITA ---------------- */
{ num:'01', title:'Il passo in dimensione infinita: Cauchy come unica vera novità', meta:'note §4 · basi numerabili · $\\ell^2$ · ogni spazio di Hilbert separabile è lo stesso spazio',
  blocchi:[
  {t:'prosa', title:'Che cosa cambia davvero, e che cosa no', tag:'architettura', html:R`
  <p>Esposito apre la Parte 2 delle note con una frase che conviene prendere sul serio perché è la struttura di tutto il modulo: <i>a parte qualche sottigliezza tecnica tipicamente irrilevante per la fisica, molti dei risultati ottenuti nel caso $\dim\mathcal H\lt \infty$ si estendono in modo del tutto naturale al caso $\dim\mathcal H=\infty$; l'unica vera novità è la necessità di controllare i problemi di convergenza.</i></p>
  <p>Cioè: <b>somme finite diventano serie</b>, e una serie può non convergere. Tutto il resto — linearità, prodotto scalare, Schwarz, ortogonalità, proiettori — resta identico a me-06 e non va riimparato. Questa tappa isola l'unica cosa nuova e la chiude.</p>`},
  {t:'reveal', title:'Che gli spazi infinito-dimensionali siano già fra noi: le funzioni analitiche', tag:'esempio motore', steps:[
   {label:'L\'osservazione', body:R`<p>Le funzioni analitiche $f:\Omega\to\mathbb{C}$ su un dominio del piano complesso (me-01) formano uno spazio vettoriale: somma di analitiche è analitica, e $\lambda f$ pure.</p>`},
   {label:'Perché la dimensione è infinita', body:R`<p>Ogni analitica ammette uno sviluppo in <span class="str" data-str="serie-di-potenze">serie di potenze</span> attorno a un punto, $f(z)=\sum_{n\ge0}\alpha_n(z-z_0)^n$, e riespandendo le potenze di $(z-z_0)$ si riscrive $f(z)=\sum_{n\ge0}\beta_n z^n$. I <b>monomi</b> $\{1,z,z^2,\dots\}$ sono dunque un insieme che genera tutto lo spazio, e sono infiniti e indipendenti: la dimensione è infinita numerabile.</p>
   <p>Da tenere: <b>i monomi come base</b> non sono un trucco inventato per i polinomi ortogonali. Sono il modo in cui uno spazio di funzioni diventa infinito-dimensionale, e nella tappa 05 li ritroveremo come materiale grezzo di Gram-Schmidt.</p>`},
   {label:'Il caso che ci interessa', body:R`<p>Salvo un paio di eccezioni note, il corso lavora su spazi di Hilbert con <b>base numerabile</b> (separabili). Base ortonormale vuol dire, come in dimensione finita, $\langle e_i|e_j\rangle=\delta_{ij}$, con l'unica differenza che lo sviluppo è un <b>limite</b>:
   $$|v\rangle=\lim_{N\to\infty}\sum_{n=0}^{N}v_n|e_n\rangle\equiv\sum_{n=0}^{\infty}v_n|e_n\rangle,\qquad v_n=\langle e_n|v\rangle.$$</p>`}
  ]},
  {t:'reveal', title:'Quando la serie converge davvero: il conto che risponde', tag:'derivazione', steps:[
   {label:'La domanda', body:R`<p>Scrivere $\sum_n v_n|e_n\rangle$ è facile; sapere che quella somma <b>esiste</b> nello spazio è un'altra cosa. La chiave è una proprietà che in uno spazio di Hilbert vale per definizione — la <b>completezza</b>:
   $$\text{successione di Cauchy}\iff\text{successione convergente}.$$
   Quindi basta controllare che le somme parziali $|s_N\rangle=\sum_{n=0}^{N}v_n|e_n\rangle$ siano di Cauchy.</p>`},
   {label:'Il conto', body:R`<p>Per $N\gt M$, e usando solo $\langle e_n|e_m\rangle=\delta_{nm}$:
   $$\bigl\|\,|s_N\rangle-|s_M\rangle\,\bigr\|^2=\Bigl\|\sum_{n=M+1}^{N}v_n|e_n\rangle\Bigr\|^2=\sum_{n=M+1}^{N}|v_n|^2=\sum_{n=0}^{N}|v_n|^2-\sum_{n=0}^{M}|v_n|^2.$$
   La distanza fra due somme parziali del vettore è la coda di una serie <b>numerica</b>, quella dei moduli quadri.</p>`},
   {label:'La conclusione', body:R`<p>Dunque $\{|s_N\rangle\}$ è di Cauchy se e solo se lo è la successione numerica $\sum_{n=0}^{N}|v_n|^2$, cioè se e solo se quella serie converge:
   $$\sum_{n=0}^{\infty}v_n|e_n\rangle\ \text{converge}\iff\sum_{n=0}^{\infty}|v_n|^2\lt \infty.$$
   <b>Un vettore di uno spazio di Hilbert infinito-dimensionale è una successione di coefficienti a quadrato sommabile.</b> Niente di più.</p>`}
  ]},
  {t:'prosa', title:'$\\ell^2$, e il fatto che c\'è un solo spazio di Hilbert separabile', tag:'struttura', html:R`
  <p>Lo spazio delle successioni complesse $\{z_n\}_{n\in\mathbb{N}}$ con $\sum_n|z_n|^2\lt \infty$ si chiama $\ell^2$. Il risultato appena ottenuto dice allora una cosa forte: <b>ogni spazio di Hilbert con base numerabile è isomorfo a $\ell^2$</b>, e l'isomorfismo è semplicemente «prendi le componenti rispetto alla base scelta»,
  $$|v\rangle\in\mathcal H\ \longleftrightarrow\ \{v_n\}\in\ell^2.$$</p>
  <p>Il senso di questa frase è lo stesso che aveva $\mathbb{C}^N$ in dimensione finita: <i>a meno di isomorfismo lo spazio è sempre lo stesso</i>, e ciò che distingue un problema da un altro non è lo spazio ma l'<b>operatore</b> che ci si mette dentro (me-07, me-09b). È anche il motivo per cui la meccanica quantistica «delle matrici» di Heisenberg e quella «delle funzioni d'onda» di Schrödinger sono la stessa teoria: $\ell^2$ e $L^2$ sono lo stesso spazio scritto in due basi.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`La successione $v_n=1/n$ definisce un vettore di $\mathcal H$? E $v_n=1/\sqrt{n}$?`,
    a:R`<b>Sì la prima, no la seconda.</b> Il criterio è $\sum|v_n|^2\lt \infty$: per $v_n=1/n$ si ha $\sum 1/n^2=\pi^2/6$, finita; per $v_n=1/\sqrt n$ si ha $\sum 1/n$, la serie armonica, che diverge. Nota bene la trappola: $\{1/\sqrt n\}$ tende a zero, e tendere a zero <b>non basta</b>. Serve che ci tenda abbastanza in fretta.`},
   {q:R`Perché in dimensione finita questa discussione non esisteva?`,
    a:R`Perché una somma con un numero finito di termini è sempre definita: non c'è nessun limite da controllare. La completezza in dimensione finita è un teorema gratuito ($\mathbb{C}^N$ è completo), mentre in dimensione infinita è una <b>richiesta</b> che si mette nella definizione di spazio di Hilbert, e che va verificata ogni volta che si costruisce uno spazio nuovo — come faremo per $L^2$ nella tappa 04.`}
  ]}
]},

/* ---------------- 02 · PERCHÉ LEBESGUE ---------------- */
{ num:'02', title:'Perché serve l\'integrale di Lebesgue', meta:'note §5, premessa · Riemann guarda il dominio, Lebesgue il codominio · la funzione di Dirichlet · insiemi di misura nulla',
  blocchi:[
  {t:'prosa', title:'L\'avvertenza che sta all\'inizio del capitolo, e perché non è un formalismo', tag:'inquadramento', html:R`
  <p>Tutto ciò che si dirà su $L^2$ è tecnicamente valido per l'integrazione alla <b>Lebesgue</b>, non necessariamente per quella alla Riemann. Esposito lo dichiara in apertura e aggiunge che <i>nella stragrande maggioranza dei casi di interesse fisico la distinzione è irrilevante, ma non sempre</i>. Conviene sapere dove sta il «non sempre», perché è esattamente da lì che nasce il «quasi ovunque» della tappa 04, che invece nelle prove serve.</p>
  <p>La differenza fra le due nozioni è una sola, ed è geometrica: <b>Riemann partiziona il dominio, Lebesgue partiziona il codominio.</b></p>`},
  {t:'gram', title:'Le due definizioni, affiancate', rows:[
   [R`<b>Riemann</b>`, R`Si spezza $[a,b]$ in sottointervalli $\Delta_i$, si sceglie un punto $\bar x_i\in\Delta_i$ e si pesa il valore lì con la lunghezza dell'intervallo: $\displaystyle\int_a^b dx\,f(x)\equiv\lim_{N\to\infty}\sum_{i=1}^{N}f(\bar x_i)|\Delta_i|$. Si guarda <b>dove</b> sta la variabile.`],
   [R`<b>Lebesgue</b>`, R`Si spezza il <i>codominio</i> in intervalli $[f_i,f_{i+1}]$ e si pesa ciascun valore con la <b>misura</b> dell'insieme di punti in cui la funzione lo assume: $\displaystyle\int_a^b dx\,f(x)\equiv\lim_{N\to\infty}\sum_{i=1}^{N}f_i\,\bigl|f^{-1}(f_i\le f\lt f_{i+1})\bigr|$. Si guarda <b>quanto è grande</b> l'insieme su cui la funzione vale una certa cosa.`],
   [R`<b>Quando differiscono</b>`, R`Quando la funzione è abbastanza patologica da rendere la somma di Riemann mal definita — cioè quando il risultato dipende da quali punti campione $\bar x_i$ si scelgono. Allora Riemann non dà nessun numero e Lebesgue sì.`]
  ]},
  {t:'reveal', title:'La funzione di Dirichlet: l\'esempio in cui i due integrali non pareggiano', tag:'controesempio', steps:[
   {label:'La funzione', body:R`<p>L'indicatrice dei razionali in $[0,1]$:
   $$\chi_{\mathbb{Q}}(x)=\begin{cases}1&amp;x\in\mathbb{Q}\\ 0&amp;x\notin\mathbb{Q}\end{cases}$$
   Si «accende» solo sui razionali. È discontinua in ogni punto.</p>`},
   {label:'Riemann: due risposte diverse, quindi nessuna', body:R`<p>Si partiziona $[0,1]$ in $N$ intervalli uniformi di ampiezza $1/N$. Se si scelgono tutti i punti campione razionali, ogni $f(\bar x_n)=1$ e la somma vale $\sum_{n=1}^{N}\frac1N=1$. Se si scelgono tutti irrazionali, ogni $f(\bar x_n)=0$ e la somma vale $0$. Il risultato <b>dipende dalla scelta dei punti campione</b>: l'integrale di Riemann di $\chi_{\mathbb{Q}}$ non è definito.</p>`},
   {label:'Lebesgue: una risposta sola', body:R`<p>Si partiziona il codominio con $f_n=1+n/N$, cosicché il primo livello è $f_0=1$. Tutte le preimmagini sono vuote tranne una: l'insieme dei punti in cui $f_0\le f\lt f_1$ è esattamente $\mathbb{Q}_{[0,1]}$, i razionali fra $0$ e $1$. Quindi la somma di Lebesgue si riduce a $f_0\cdot\bigl|\mathbb{Q}_{[0,1]}\bigr|=\bigl|\mathbb{Q}_{[0,1]}\bigr|$, e tutto si gioca sulla <b>misura dei razionali</b>.</p>`},
   {label:'La misura dei razionali è zero, e il conto sta in due righe', body:R`<p>I razionali sono <b>numerabili</b>: si enumerano come $q_1,q_2,\dots$ Attorno a ciascuno si mette un intervallo di ampiezza $\epsilon/2^{n+1}$. La misura dell'unione è al più la somma delle ampiezze, e quella somma è una geometrica:
   $$\bigl|\mathbb{Q}_{[0,1]}\bigr|_\epsilon\le\sum_{n=1}^{\infty}\frac{\epsilon}{2^{n+1}}=\frac{\epsilon}{2}\xrightarrow[\epsilon\to0]{}0.$$
   Poiché $\epsilon$ è arbitrario, la misura è <b>nulla</b>. Dunque $\int_0^1dx\,\chi_{\mathbb{Q}}(x)=0$ nel senso di Lebesgue, e l'integrale è ben definito.</p>
   <p><b>La sostanza da portare via non è il risultato, è il meccanismo</b>: un insieme numerabile di punti ha misura nulla, perché lo si copre con intervalli le cui ampiezze formano una serie convergente che si può rendere piccola a piacere. È la ragione tecnica di tutto ciò che segue.</p>`}
  ]},
  {t:'prosa', title:'Che cosa portarsi dietro, in pratica', tag:'economia', html:R`
  <p>Nessuna prova d'esame di questo corso chiede di costruire la misura di Lebesgue. Quello che chiedono — e che questa tappa esiste per dare — sono <b>due frasi</b>:</p>
  <ul>
  <li><b>Un insieme numerabile di punti ha misura nulla</b>, e modificare una funzione su un insieme di misura nulla non cambia nessun integrale.</li>
  <li>Perciò in $L^2$ <b>due funzioni che differiscono su un insieme di misura nulla sono lo stesso vettore</b>. È l'unica sottigliezza dell'integrale di Lebesgue che si paga, e la si paga nella tappa che segue.</li>
  </ul>`}
]},

/* ---------------- 03 · LO SPAZIO L² ---------------- */
{ num:'03', title:'Lo spazio $L^2$: la definizione e chi ci sta dentro', meta:'note §5 · il dizionario indice-variabile · norma $L^p$ e perché $p=2$ · esempi e controesempi',
  blocchi:[
  {t:'reveal', title:'Il dizionario: da $\\mathbb{C}^N$ allo spazio di funzioni', tag:'costruzione', steps:[
   {label:'Le norme possibili su uno spazio di funzioni', body:R`<p>Nello spazio vettoriale delle funzioni $f:\Omega\to\mathbb{C}$ si possono definire molte norme. Le più comuni sono la <b>uniforme</b>, la $L^1$ pesata e, in generale, la $L^p$ pesata:
   $$\|f\|_{\sup}=\sup_{x\in\Omega}|f(x)|,\qquad \|f\|_{1,\omega}=\int_\Omega dx\,\omega(x)|f(x)|,\qquad \|f\|_{p,\omega}=\Bigl(\int_\Omega dx\,\omega(x)|f(x)|^p\Bigr)^{1/p},$$
   con $\omega(x)$ una funzione di <b>peso</b> nota e fissata. Il peso non è un ornamento: nella tappa 06 sarà lui a produrre Laguerre e Hermite.</p>`},
   {label:'Perché in fisica vince $p=2$ con peso $\\omega=1$', body:R`<p>Perché è l'unica scelta che rende la norma il <b>prodotto scalare di un vettore con sé stesso</b>, cioè l'unica estensione naturale del caso finito-dimensionale. Basta pensare alla variabile continua $x\in[a,b]$ come alla versione continua dell'indice $k$:
   $$v_k\longrightarrow f(x),$$
   $$\langle v|u\rangle=\sum_{k=1}^{\infty}v_k^*u_k\longrightarrow\langle f|g\rangle=\int_a^b dx\,f^*(x)g(x),$$
   $$\|v\|=\sqrt{\langle v|v\rangle}=\Bigl(\sum_{k=1}^{\infty}|v_k|^2\Bigr)^{1/2}\longrightarrow\|f\|_2=\sqrt{\langle f|f\rangle}=\Bigl(\int_a^b dx\,|f(x)|^2\Bigr)^{1/2}.$$
   <b>Questo dizionario a tre righe è il movimento intero.</b> Tutto il resto è verificare che l'oggetto a destra si comporti come quello a sinistra.</p>`},
   {label:'La definizione', body:R`<p>Si definisce <b>spazio $L^2$</b> lo spazio delle funzioni <b>a quadrato integrabile</b>:
   $$L^2=\Bigl\{f:[a,b]\to\mathbb{C}\ \Bigm|\ \int_a^b dx\,|f(x)|^2\lt \infty\Bigr\}.$$
   L'intervallo $[a,b]$ può essere finito, una semiretta o tutto $\mathbb{R}$, e — lo si vedrà nelle tappe 05 e 06 — <b>quale sia cambia tutto</b>.</p>`}
  ]},
  {t:'reveal', title:'Che $L^2$ sia uno spazio vettoriale, e che il prodotto scalare ci stia dentro', tag:'verifica', steps:[
   {label:'Chiuso per moltiplicazione scalare', body:R`<p>Se $f\in L^2$ e $\lambda\in\mathbb{C}$:
   $$\int_a^b dx\,|\lambda f(x)|^2=|\lambda|^2\int_a^b dx\,|f(x)|^2\lt \infty\ \Longrightarrow\ \lambda f\in L^2.$$</p>`},
   {label:'Chiuso per somma — e qui serve una disuguaglianza', body:R`<p>Punto per punto, detta $\varphi$ la differenza di fase fra i due valori, vale l'identità $|f+g|^2=|f|^2+|g|^2+2|f||g|\cos\varphi$. Il coseno è al più $1$, e $2|f||g|\le|f|^2+|g|^2$ perché non è altro che $(|f|-|g|)^2\ge0$ riscritta: dunque $|f+g|^2\le2\bigl(|f|^2+|g|^2\bigr)$, e integrando
   $$\int_a^b dx\,|f(x)+g(x)|^2\le2\Bigl(\int_a^b dx\,|f(x)|^2+\int_a^b dx\,|g(x)|^2\Bigr)\lt \infty,$$
   quindi $f+g\in L^2$. <i>(Esposito maggiora invece con $\bigl(2\max(|f|,|g|)\bigr)^2$ e arriva alla stessa conclusione con una costante $4$: la costante non conta, perché serve solo la finitezza. Qui si passa da $2|f||g|\le|f|^2+|g|^2$ perché è esattamente la disuguaglianza che serve di nuovo due righe più sotto.)</i></p>`},
   {label:'Il prodotto scalare è finito', body:R`<p>Non è automatico: $\langle f|g\rangle$ è un integrale che potrebbe divergere. Non diverge, e la ragione è la disuguaglianza elementare $|f||g|\le\frac12(|f|^2+|g|^2)$ (che è $(|f|-|g|)^2\ge0$ riscritta):
   $$|\langle f|g\rangle|=\Bigl|\int_a^b dx\,f^*(x)g(x)\Bigr|\le\int_a^b dx\,|f(x)||g(x)|\le\frac12\Bigl(\int_a^b dx\,|f(x)|^2+\int_a^b dx\,|g(x)|^2\Bigr)\lt \infty.$$
   <b>Conseguenza</b>: tutte le proprietà del prodotto scalare viste in dimensione finita — Schwarz, triangolare, Pitagora, Gram-Schmidt — valgono identiche in $L^2$. È questo che autorizza tutto il resto del movimento.</p>`}
  ]},
  {t:'prosa', title:'Chi sta in $L^2$ e chi no: i sei casi di riferimento', tag:'palestra', html:R`
  <p>Il modo veloce di decidere è guardare <b>i due estremi</b>: il comportamento all'infinito (se il dominio è illimitato) e i poli (se ce ne sono nel dominio). Gli esempi delle note coprono tutte le combinazioni.</p>
  <ol>
  <li>$f(x)=e^{-x^2/2}$ su $(-\infty,\infty)$ <b>è</b> in $L^2$: $\displaystyle\int_{-\infty}^{\infty}dx\,e^{-x^2}=\sqrt{\pi}$. L'esponenziale schiaccia tutto.</li>
  <li>$f(x)=x+ix^2$ su $(-\infty,\infty)$ <b>non</b> è in $L^2$: $|f|^2=x^2+x^4$ e $\int dx\,x^4\sim x^5$ diverge all'infinito.</li>
  <li>La <b>stessa</b> $f(x)=x+ix^2$ ristretta a $x\in[0,1]$ <b>è</b> in $L^2$: $\displaystyle\int_0^1dx\,(x^2+x^4)=\frac{8}{15}$. Cambiato il dominio, cambiata la risposta: l'appartenenza a $L^2$ è una proprietà della <b>coppia</b> funzione-intervallo, mai della funzione da sola.</li>
  <li>$f(x)=\dfrac{1}{1+x}$ su $[0,\infty)$ <b>è</b> in $L^2$: $\displaystyle\int_0^{\infty}\frac{dx}{(1+x)^2}=1$, perché decresce come $1/x$ e $\int dx/x^2$ converge all'infinito.</li>
  <li>La <b>stessa</b> $\dfrac{1}{1+x}$ estesa a $(-\infty,\infty)$ <b>non</b> è in $L^2$, e stavolta non per colpa dell'infinito ma del <b>polo</b> in $x=-1$: lì $\int dx/(1+x)^2$ diverge.</li>
  <li>L'indicatrice $f(x)=1$ su $[-1,1]$ e $0$ altrove <b>è</b> in $L^2(\mathbb{R})$: $\displaystyle\int_{-1}^{1}dx=2$. Una funzione <b>discontinua</b> può benissimo stare in $L^2$: la condizione è sull'integrabilità, non sulla regolarità.</li>
  </ol>
  <p><b>La regola d'oro dell'esame</b> — e i due casi 3 e 5 sono lì per inciderla: si controlla separatamente la <b>coda</b> e ogni <b>singolarità</b>, e basta che uno dei due controlli fallisca perché la funzione sia fuori.</p>`},
  {t:'esercizio', title:'Per quali $\\alpha$ la potenza sta in $L^2$', src:'la forma dell\'esercizio 1 del Set 2 di Caprini-Esposito',
   testo:R`Determinare per quali $\alpha\in\mathbb{R}$ la funzione $f(x)=x^{\alpha}$ appartiene a $L^2[0,1]$, a $L^2[1,\infty)$ e a $L^2[0,\infty)$.`,
   steps:[
    {label:'Il conto, una volta sola', body:R`<p>$|f|^2=x^{2\alpha}$, e la primitiva è $x^{2\alpha+1}/(2\alpha+1)$ salvo il caso $\alpha=-\frac12$, in cui è un logaritmo (e allora diverge da entrambe le parti).</p>`},
    {label:'Su $[0,1]$: comanda l\'origine', body:R`<p>Il rischio è in $x=0$, dove $x^{2\alpha}$ esplode se $\alpha\lt 0$. L'integrale converge se e solo se l'esponente sta sopra $-1$:
    $$\int_0^1dx\,x^{2\alpha}=\frac{1}{2\alpha+1},\qquad\text{finito}\iff\alpha\gt -\frac12.$$</p>`},
    {label:'Su $[1,\\infty)$: comanda la coda', body:R`<p>Nessun problema in $1$; il rischio è all'infinito, e lì serve un esponente <b>sotto</b> $-1$:
    $$\int_1^{\infty}dx\,x^{2\alpha}=-\frac{1}{2\alpha+1},\qquad\text{finito}\iff\alpha\lt -\frac12.$$</p>`},
    {label:'Su $[0,\\infty)$: mai', body:R`<p>Le due condizioni sono $\alpha\gt -\frac12$ e $\alpha\lt -\frac12$: incompatibili. <b>Nessuna potenza pura sta in $L^2[0,\infty)$</b>, ed è precisamente la ragione per cui nella tappa 06 i monomi non potranno essere ortonormalizzati direttamente su quella semiretta e bisognerà passare da uno spazio pesato. Questo esercizio non è un esercizio: è il motivo per cui Laguerre esiste.</p>`}
   ]}
]},

/* ---------------- 04 · QUASI OVUNQUE E COMPLETEZZA ---------------- */
{ num:'04', title:'«Quasi ovunque», e perché $L^2$ è uno spazio di Hilbert', meta:'note §5 · distanza nulla fra funzioni diverse · convergenza in norma ≠ puntuale · densità delle continue · completezza',
  blocchi:[
  {t:'reveal', title:'Due funzioni diverse a distanza nulla', tag:'la sottigliezza', steps:[
   {label:'La distanza in $L^2$', body:R`<p>È quella indotta dalla norma, come in dimensione finita:
   $$d(f,g)=\|f-g\|=\Bigl(\int_a^b dx\,|f(x)-g(x)|^2\Bigr)^{1/2}.$$
   Se due funzioni coincidono ovunque la distanza è certamente nulla. <b>Il viceversa non vale.</b></p>`},
   {label:'Il controesempio, il più semplice possibile', body:R`<p>Su $[0,1]$ si prendano
   $$f(x)=\sqrt{x},\qquad g(x)=\begin{cases}\sqrt{x}&amp;x\in[0,1]\setminus\{1/2\}\\ 1&amp;x=1/2\end{cases}$$
   Le due differiscono in <b>un punto solo</b>, e un punto è un insieme di misura nulla (tappa 02). Quindi l'integrando $|f-g|^2$ è nullo tranne che su un insieme di misura nulla, e
   $$\|f-g\|=\Bigl(\int_0^1dx\,|f(x)-g(x)|^2\Bigr)^{1/2}=0,$$
   pur essendo $f\ne g$ come funzioni puntuali.</p>`},
   {label:'La conclusione, che è una definizione', body:R`<p>In $L^2$, dunque,
   $$\|f-g\|=0\ \Longrightarrow\ f(x)=g(x)\ \text{«}\textbf{quasi ovunque}\text{»},$$
   cioè a meno di insiemi di misura nulla. <b>Gli elementi di $L^2$ non sono funzioni: sono classi di equivalenza di funzioni</b> che coincidono quasi ovunque. Se non si facesse così, la norma non sarebbe una norma — violerebbe l'assioma $\|v\|=0\Rightarrow v=0$ — e $L^2$ non sarebbe uno spazio normato.</p>
   <p>Conseguenza operativa, quella che serve all'esame: <b>chiedere il valore di una funzione di $L^2$ in un punto preciso non ha senso</b>. È il motivo per cui in meccanica quantistica $|\psi(x)|^2$ è una densità che si integra su un intervallo, e non una probabilità puntuale; ed è anche la ragione per cui la $\delta$ di Dirac (me-09) non potrà essere una funzione di $L^2$.</p>`}
  ]},
  {t:'prosa', title:'Convergere in norma non è convergere punto per punto', tag:'trappola', html:R`
  <p>Una successione $\{|f_n\rangle\}$ converge a $|f\rangle$ in $L^2$ se $\|f_n-f\|\to0$. Esposito mette qui un <i>notabene</i> che vale la pena leggere due volte: <b>questo non implica</b> $f_n(x)\to f(x)$ punto per punto. La convergenza in norma $L^2$ è una condizione sull'<b>integrale</b>, non sul valore in ogni singolo punto.</p>
  <p>Ciò che resta vero è una versione indebolita: esiste sempre una <b>sottosuccessione</b> $\{f_{n_k}\}$ che converge a $f(x)$ puntualmente quasi ovunque. Non tutta la successione, e non in tutti i punti.</p>
  <p><b>Perché importa.</b> Quando nella tappa 05 si dirà che i polinomi di Legendre sono una <i>base completa</i> di $L^2[-1,1]$, e in me-10 che la serie di Fourier converge a $f$, il senso sarà <b>questo</b> e non quello ingenuo: la somma parziale si avvicina a $f$ <i>in norma</i>. Il fenomeno di Gibbs (me-10) — la serie di Fourier di un'onda quadra che vicino al salto sbaglia sempre della stessa quantità, per quanti termini si prendano — non è un paradosso: è la differenza fra le due convergenze, vista a occhio nudo.</p>`},
  {t:'gram', title:'I tre fatti che rendono $L^2$ uno spazio di Hilbert', rows:[
   [R`<b>le continue sono dense</b>`, R`su supporto <b>compatto</b> $[a,b]$ con $a,b$ finiti, ogni $f\in L^2$ è limite in norma di una successione di funzioni continue: esiste $\{f_n\}$ con $\lim_{n\to\infty}\|f_n-f\|=0$. È il ponte fra «una qualunque $f$ a quadrato integrabile» e «un polinomio», e nella tappa 05 è il primo anello della catena che giustifica Gram-Schmidt sui monomi.`],
   [R`<b>è completo</b>`, R`tutte le successioni di Cauchy in $L^2$ convergono a un elemento <b>dello spazio stesso</b>. Esposito lo enuncia senza dimostrarlo (è il teorema di Riesz-Fischer, e richiede la teoria della misura per intero); ma è l'ingrediente che, unito al prodotto scalare della tappa 03, dà la conclusione: <b>$L^2$ è uno spazio di Hilbert</b>. È anche il punto in cui l'integrale di Lebesgue si guadagna il posto: con l'integrale di Riemann questa proprietà <i>sarebbe falsa</i>.`],
   [R`<b>la convergenza è in norma</b>`, R`$|f_n\rangle\to|f\rangle$ significa $\|f_n-f\|\to0$, e nient'altro. Da qui in poi ogni «uguale» fra una funzione e una serie di funzioni va letto così.`]
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`La funzione che vale $1$ sui razionali di $[0,1]$ e $0$ altrove: che vettore è di $L^2[0,1]$?`,
    a:R`<b>Il vettore nullo.</b> I razionali hanno misura nulla (tappa 02), quindi $\chi_{\mathbb{Q}}$ coincide quasi ovunque con la funzione identicamente nulla, e in $L^2$ le due sono lo <b>stesso</b> elemento. Non è un vettore piccolo: è zero. È il modo più netto di vedere che gli elementi di $L^2$ non sono funzioni.`},
   {q:R`Dove esattamente si usa la completezza, in concreto?`,
    a:R`Ogni volta che si scrive $f=\sum_n c_ne_n$ e si pretende che la somma sia un elemento dello spazio. Il conto della tappa 01 mostra che le somme parziali sono di Cauchy quando $\sum|c_n|^2\lt \infty$; la <b>completezza</b> è ciò che trasforma «di Cauchy» in «convergente <i>a qualcosa che sta in $L^2$</i>». Senza, la serie potrebbe puntare fuori dallo spazio — come $\sum 1/n!$ fatta dentro $\mathbb{Q}$, che è di Cauchy e converge a $e$, che razionale non è.`}
  ]}
]},

/* ---------------- 05 · LEGENDRE ---------------- */
{ num:'05', title:'La macchina che fabbrica le basi: Gram-Schmidt sui monomi, e i polinomi di Legendre', meta:'note §5.1.1 · l\'intervallo decide la famiglia · $e_n=\\sqrt{(2n+1)/2}\\,P_n$ · Rodrigues · le sei proprietà',
  blocchi:[
  {t:'prosa', title:'L\'idea, in tre anelli', tag:'architettura', html:R`
  <p>Serve una <b>base ortonormale</b> di $L^2$. Da dove si parte? Dai monomi, e la catena che lo giustifica ha tre anelli, tutti già posati:</p>
  <ol>
  <li>Se l'intervallo è <b>compatto</b>, ogni $f\in L^2[a,b]$ è limite in norma di funzioni <b>continue</b> (tappa 04).</li>
  <li>Ogni funzione continua è a sua volta limite di somme di <b>monomi</b> (la sua serie di Taylor, o più in generale l'approssimazione polinomiale).</li>
  <li>Dunque $\{1,x,x^2,\dots\}$ genera tutto $L^2[a,b]$ — ma non è ortonormale. Lo si rende tale con <b>Gram-Schmidt</b>, esattamente la procedura di me-06, con il prodotto scalare integrale della tappa 03.</li>
  </ol>
  <p style="text-align:center"><i>Ed ecco il punto che rende il capitolo elegante: cambia l'<b>intervallo</b> (e, se serve, il <b>peso</b>), e la stessa procedura sputa fuori una famiglia diversa.</i></p>
  <p>Ognuna di queste basi è già familiare dalla fisica, ed emerge da sé senza che nessuno la inventi: <b>la scelta dell'intervallo determina univocamente la base che si ottiene.</b></p>`},
  {t:'reveal', title:'Gram-Schmidt su $[-1,1]$: i primi tre vettori a mano', tag:'derivazione', steps:[
   {label:'Il primo: normalizzare la costante', body:R`<p>Si parte da $u_0(x)=1$. La sua norma quadra è $\int_{-1}^{1}dy\,1=2$, quindi
   $$e_0(x)=\frac{u_0(x)}{\sqrt{\langle u_0|u_0\rangle}}=\frac{1}{\sqrt2}.$$</p>`},
   {label:'Il secondo: la proiezione è nulla per parità', body:R`<p>$u_1(x)=x-\langle e_0|x\rangle e_0(x)$, e la proiezione contiene $\int_{-1}^{1}dy\,y=0$ — l'integrale di una funzione dispari su un intervallo simmetrico. Dunque $u_1(x)=x$ senza fatica. Normalizzando con $\int_{-1}^{1}dy\,y^2=\frac23$:
   $$e_1(x)=\frac{x}{\sqrt{2/3}}=\sqrt{\frac32}\,x.$$</p>`},
   {label:'Il terzo: qui si sottrae davvero qualcosa', body:R`<p>$u_2(x)=x^2-\langle e_0|x^2\rangle e_0(x)-\langle e_1|x^2\rangle e_1(x)$. Il secondo termine sparisce ancora per parità ($\int_{-1}^{1}dy\,y^3=0$); il primo no, perché $\frac12\int_{-1}^{1}dy\,y^2=\frac13$. Resta
   $$u_2(x)=x^2-\frac13.$$
   La sua norma quadra è $\int_{-1}^{1}dx\,(x^2-\frac13)^2=\frac{8}{45}$, da cui
   $$e_2(x)=\sqrt{\frac{45}{8}}\Bigl(x^2-\frac13\Bigr)=\sqrt{\frac52}\,\frac{3x^2-1}{2}.$$</p>`},
   {label:'Il pattern', body:R`<p>È facile convincersi che il pattern generale è
   $$e_n(x)=\sqrt{\frac{2n+1}{2}}\,P_n(x),\qquad\text{[base di }L^2[-1,1]\text{]}$$
   dove $P_n$ è l'$n$-esimo <b>polinomio di Legendre</b>, definito dalla <b>formula di Rodrigues</b>
   $$P_n(x)=\frac{1}{2^n\,n!}\frac{d^n}{dx^n}\bigl[(x^2-1)^n\bigr].$$
   Verifica su $n=2$: $\frac{1}{8}\frac{d^2}{dx^2}(x^4-2x^2+1)=\frac{3x^2-1}{2}$, che è esattamente il $P_2$ appena trovato con Gram-Schmidt. La normalizzazione convenzionale è $P_n(1)=1$, e infatti $P_2(1)=1$.</p>`}
  ]},
  {t:'gram', title:'Le sei proprietà dei polinomi di Legendre, e a che cosa serve ciascuna', rows:[
   [R`$P_{n+1}'=(n+1)P_n+xP_n'$`, R`la prima delle due relazioni derivata-polinomio; Esposito la dimostra per esteso dalla Rodrigues (le altre «in modo del tutto analogo»). Serve a ricavare le altre.`],
   [R`$P_{n-1}'=-nP_n+xP_n'$`, R`la compagna della precedente. Sottraendole si ottiene la $(2n+1)P_n=P_{n+1}'-P_{n-1}'$ che Calogero riporta.`],
   [R`$(n+1)P_{n+1}=(2n+1)xP_n-nP_{n-1}$`, R`<b>la relazione di ricorrenza a tre termini</b>: è il modo pratico di generare i polinomi senza derivare. Da $P_0=1$ e $P_1=x$ dà $P_2=\frac{3x^2-1}{2}$, poi $P_3=\frac{5x^3-3x}{2}$, e così via. All'esame è questa che si usa.`],
   [R`$(1-x^2)P_n''-2xP_n'+n(n+1)P_n=0$`, R`<b>l'equazione differenziale di Legendre.</b> È la proprietà più importante delle sei, perché è il ponte verso la tappa 07 e verso la fisica: dice che $P_n$ è l'<b>autofunzione</b> di un operatore differenziale con autovalore $n(n+1)$. Quando in elettrostatica o in meccanica quantistica si separa l'equazione di Laplace in coordinate sferiche, questa equazione salta fuori da sola, con $n$ nel ruolo del numero quantico orbitale: l'autovalore $n(n+1)$ è il $\ell(\ell+1)$ del momento angolare.`],
   [R`$P_n(-x)=(-1)^nP_n(x)$`, R`<b>parità definita</b>: i $P_n$ di indice pari sono funzioni pari, quelli dispari dispari. È la scorciatoia che nelle prove azzera metà dei coefficienti senza calcolare nulla.`],
   [R`$\int_{-1}^{1}dx\,P_nP_m=\dfrac{2}{2n+1}\delta_{nm}$`, R`la <b>relazione di ortogonalità</b>, ed è da qui che viene il fattore $\sqrt{(2n+1)/2}$ nella base ortonormale. È anche la formula che dà i coefficienti di un'espansione: vedi sotto.`]
  ]},
  {t:'prosa', title:'Espandere in Legendre: la formula dei coefficienti', tag:'operativo', html:R`
  <p>I polinomi di Legendre costituiscono un insieme ortogonale e <b>completo</b> su $[-1,1]$. «Completo» qui è il senso della tappa 04: assegnata una qualunque $f\in L^2[-1,1]$ si può scrivere
  $$f(x)=\sum_{n=0}^{\infty}c_nP_n(x),$$
  e la relazione di ortogonalità dà i coefficienti moltiplicando entrambi i membri per $P_m$ e integrando:
  $$c_n=\frac{2n+1}{2}\int_{-1}^{1}dx\,P_n(x)f(x).$$
  <b>È la stessa identica operazione della proiezione su una base in dimensione finita</b>, $v_k=\langle e_k|v\rangle$: il fattore $\frac{2n+1}{2}$ c'è solo perché si sta proiettando su $P_n$, che non è normalizzato, invece che su $e_n$, che lo è. Se si usa $e_n$ il fattore sparisce e la formula è $c_n=\langle e_n|f\rangle$ e basta.</p>`},
  {t:'plot', title:'I primi quattro polinomi di Legendre su $[-1,1]$',
   intro:R`$P_0=1$, $P_1=x$, $P_2=\frac{3x^2-1}{2}$, $P_3=\frac{5x^3-3x}{2}$. Tutti valgono $1$ in $x=1$ (è la normalizzazione convenzionale), e $P_n$ ha esattamente $n$ zeri dentro l'intervallo.`,
   plots:[
    {kind:'func2d', xr:[-1.05,1.05], yr:[-1.2,1.2], ticks:true, height:340,
     title:'P0, P1, P2, P3  su  [-1, 1]',
     curves:[{f:'1', col:'#5eead4', width:1.8, label:'P0'},
             {f:'x', col:'#4c8dff', width:1.8, label:'P1'},
             {f:'(3*x*x-1)/2', col:'#d8a13a', width:1.8, label:'P2'},
             {f:'(5*x*x*x-3*x)/2', col:'#b98cff', width:1.8, label:'P3'}]}
   ],
   leggi:R`Le tre cose da leggere nella figura. <b>Parità</b>: $P_2$ è simmetrica rispetto all'asse verticale, $P_1$ e $P_3$ sono antisimmetriche — è la quinta proprietà, e si vede. <b>Zeri</b>: $P_n$ taglia l'asse $n$ volte dentro $(-1,1)$, e gli zeri si infittiscono verso gli estremi. <b>Ortogonalità</b>: l'area con segno del prodotto di due curve qualunque della figura è nulla; per $P_0P_2$, per esempio, la gobba centrale negativa di $P_2$ compensa esattamente le due code positive. È il senso geometrico di $\int_{-1}^{1}P_nP_m=0$, e conviene averlo in testa perché è ciò che rende la proiezione un'operazione sensata.`},
  {t:'esercizio', title:'Espandere $1/(1+x^2)$ in polinomi di Legendre', src:'Set 2 di Caprini-Esposito, esercizio 3 (variante $f_2$)',
   testo:R`Calcolare i primi tre coefficienti dell'espansione di $f(x)=\dfrac{1}{1+x^2}$, con $x\in[-1,1]$, nella base dei polinomi di Legendre.`,
   steps:[
    {label:'$c_1=0$ senza calcolare niente', body:R`<p>$f$ è <b>pari</b> e $P_1=x$ è <b>dispari</b>: il prodotto è dispari e l'integrale su $[-1,1]$ si annulla. Stessa cosa per tutti i $c_n$ con $n$ dispari. La parità dimezza il lavoro: è per questo che sta fra le sei proprietà.</p>`},
    {label:'$c_0$: l\'arcotangente', body:R`<p>$c_0=\frac12\int_{-1}^{1}\frac{dx}{1+x^2}=\frac12\bigl[\arctan x\bigr]_{-1}^{1}=\frac{\pi}{4}$. È il <b>valor medio</b> di $f$ sull'intervallo, come sempre per il coefficiente di $P_0$.</p>`},
    {label:'$c_2$: la divisione che semplifica tutto', body:R`<p>$c_2=\frac52\int_{-1}^{1}dx\,\frac{3x^2-1}{2}\cdot\frac{1}{1+x^2}$. Il trucco è la divisione polinomiale sotto integrale: $\frac{3x^2-1}{1+x^2}=3-\frac{4}{1+x^2}$. Allora
    $$\int_{-1}^{1}dx\,\frac{3x^2-1}{2(1+x^2)}=\frac12\Bigl(6-2\pi\Bigr)=3-\pi,$$
    e quindi $c_2=\frac52(3-\pi)$, numericamente circa $-0{,}354$.</p>
    <p>Il segno negativo ha un senso che si legge sulla figura sopra: $f$ è concentrata al centro, dove $P_2$ è negativa.</p>`},
    {label:'Il senso dell\'esercizio', body:R`<p>Una funzione che <b>non è un polinomio</b> — anzi, che ha due poli in $x=\pm i$ appena fuori dall'asse reale — si scrive come serie di polinomi. È la completezza della base in azione, e la velocità con cui i $c_n$ decrescono è governata dalla distanza di quei poli dall'intervallo: è lo stesso meccanismo del raggio di convergenza di me-03, e riapparirà in me-10 come «regolarità della funzione $\Rightarrow$ decadimento dei coefficienti di Fourier».</p>`}
   ]}
]},

/* ---------------- 06 · LAGUERRE E HERMITE ---------------- */
{ num:'06', title:'Laguerre e Hermite: quando l\'intervallo non è compatto', meta:'note §5.1.2-3 · lo spazio pesato · i tre passi · $L_n$ su $[0,\\infty)$ · $H_n$ su $\\mathbb{R}$',
  blocchi:[
  {t:'prosa', title:'Il problema, e la sua unica soluzione', tag:'first principles', html:R`
  <p>Su $[0,\infty)$ l'argomento della tappa 05 <b>non si può ripetere</b>, e la ragione è già stata misurata nell'esercizio della tappa 03: i monomi $x^n$ non sono neppure a quadrato integrabile su una semiretta. Non si può ortonormalizzare un insieme di vettori che nello spazio non ci stanno.</p>
  <p>La mossa è quella che si fa sempre quando un oggetto diverge: <b>gli si mette accanto un peso che lo schiaccia</b>. Si lavora nello spazio pesato $L^2_{e^{-x}}[0,\infty)$, con prodotto scalare $\langle f|g\rangle=\int_0^{\infty}dx\,e^{-x}f^*(x)g(x)$, dove i monomi sono perfettamente legittimi. Poi si torna indietro.</p>
  <p>La struttura è tre passi, e vale identica per Hermite con peso $e^{-x^2}$ su tutto $\mathbb{R}$.</p>`},
  {t:'reveal', title:'I tre passi, per Laguerre', tag:'derivazione', steps:[
   {label:'Passo 1 — i monomi sono una base dello spazio pesato', body:R`<p>Sia $f\in L^2_{e^{-x}}[0,\infty)$. Il cambio di variabile $y=e^{-x}$, con $dy=-dx\,e^{-x}$, manda la semiretta nell'intervallo compatto $[0,1]$:
   $$\infty\gt \int_0^{\infty}dx\,e^{-x}|f(x)|^2=\int_0^{1}dy\,|f(\log(1/y))|^2\ \Longrightarrow\ f(\log(1/y))\in L^2[0,1].$$
   Ma su un compatto il risultato della tappa 05 vale: $f(\log(1/y))$ si approssima in norma con polinomi $P_N(y)=\sum_{n=0}^{N}\alpha_ny^n$. Tornando a $x$, ogni $y^n$ diventa $e^{-nx}$, e sviluppando ogni $e^{-nx}$ nella sua serie di Taylor si riottengono le potenze $x^m$. Dunque i monomi $\{x^n\}$ sono una base di $L^2_{e^{-x}}[0,\infty)$. <b>Il compatto è servito da trampolino, e il cambio di variabile è l'intero contenuto del passo.</b></p>`},
   {label:'Passo 2 — Gram-Schmidt, col peso dentro il prodotto scalare', body:R`<p>Si parte da $u_0=1$, e $\int_0^{\infty}dy\,e^{-y}=1$ dà subito $e_0(x)=1$. Poi
   $$u_1(x)=x-\langle x|e_0\rangle e_0=x-\int_0^{\infty}dy\,e^{-y}y=x-1,$$
   e siccome $\langle x-1|x-1\rangle=\int_0^{\infty}dy\,e^{-y}(y-1)^2=1$, il vettore è già normalizzato: $e_1(x)=-(1-x)$. Al passo dopo servono $\int_0^{\infty}dy\,e^{-y}y^2=2$ e $\int_0^{\infty}dy\,e^{-y}y^2(y-1)=4$, e
   $$u_2(x)=x^2-2-4(x-1)=x^2-4x+2,$$
   con $\|x^2-4x+2\|^2=\int_0^{\infty}dy\,e^{-y}(y^2-4y+2)^2=4$, dunque $e_2(x)=\frac12(x^2-4x+2)$.</p>
   <p>Iterando si trova $e_n(x)=(-1)^nL_n(x)$, dove
   $$L_n(x)=\frac{e^x}{n!}\frac{d^n}{dx^n}\bigl(e^{-x}x^n\bigr)$$
   è l'$n$-esimo <b>polinomio di Laguerre</b> (formula di Rodrigues). Controllo su $n=2$: $\frac{e^x}{2}\frac{d^2}{dx^2}(e^{-x}x^2)=\frac{x^2-4x+2}{2}$, che coincide con l'$e_2$ appena costruito.</p>`},
   {label:'Passo 3 — tornare da $L^2_{e^{-x}}$ a $L^2$', body:R`<p>Il peso si può spostare dentro la funzione:
   $$\infty\gt \int_0^{\infty}dx\,e^{-x}|f(x)|^2=\int_0^{\infty}dx\,\bigl|e^{-x/2}f(x)\bigr|^2\equiv\int_0^{\infty}dx\,|g(x)|^2,$$
   cioè a ogni $f\in L^2_{e^{-x}}[0,\infty)$ corrisponde $g(x)=e^{-x/2}f(x)\in L^2[0,\infty)$ e viceversa. Riscrivendo con questa sostituzione lo sviluppo del passo 2 si legge la base ortonormale dello spazio che interessa:
   $$e_n(x)=(-1)^ne^{-x/2}L_n(x),\qquad\text{[base di }L^2[0,\infty)\text{]}.$$
   <b>Il peso non è sparito: si è diviso a metà fra le due funzioni.</b> È la stessa mossa che in meccanica quantistica trasforma un problema con misura pesata in un problema con misura piatta, e la si ritrova identica nel fattore $e^{-x^2/2}$ delle autofunzioni dell'oscillatore.</p>`}
  ]},
  {t:'gram', title:'Le cinque proprietà dei polinomi di Laguerre', rows:[
   [R`$L_{n-1}=L_{n-1}'-L_n'$`, R`relazione fra derivate consecutive.`],
   [R`$xL_n'=nL_n-nL_{n-1}$`, R`la derivata espressa con due polinomi vicini.`],
   [R`$(n+1)L_{n+1}=(2n+1-x)L_n-nL_{n-1}$`, R`<b>la ricorrenza a tre termini.</b> Da $L_0=1$ e $L_1=1-x$ dà $L_2=\frac{x^2-4x+2}{2}$, poi $L_3$, e così via — il modo pratico di generarli.`],
   [R`$xL_n''+(1-x)L_n'+nL_n=0$`, R`<b>l'equazione di Laguerre</b>, il ponte con la tappa 07 e con la fisica: è l'equazione radiale dell'atomo di idrogeno, dove $n$ è il numero quantico principale.`],
   [R`$\int_0^{\infty}dx\,e^{-x}L_nL_m=\delta_{nm}$`, R`l'ortonormalità <b>nello spazio pesato</b> — si noti il peso $e^{-x}$ dentro l'integrale. Senza quel peso i $L_n$ non sono ortogonali e l'integrale nemmeno converge. <b>Nelle prove è l'errore più frequente su questa famiglia.</b>`]
  ]},
  {t:'reveal', title:'Hermite: la stessa storia su tutto $\\mathbb{R}$', tag:'derivazione', steps:[
   {label:'Costruzione', body:R`<p>Si considera $L^2$ su $(-\infty,\infty)$. In modo del tutto analogo si parte dallo spazio pesato $L^2_{e^{-x^2}}(-\infty,\infty)$, di cui si mostra — con una riduzione simile a quella di Laguerre — che i monomi $\{x^n\}$ sono una base; poi si costruisce una generica funzione di $L^2(-\infty,\infty)$ moltiplicando per $e^{-x^2/2}$; poi Gram-Schmidt. Il risultato è
   $$e_n(x)=\frac{e^{-x^2/2}}{\sqrt{2^n\,n!\,\sqrt{\pi}}}H_n(x),\qquad\text{[base di }L^2(-\infty,\infty)\text{]},$$
   con l'$n$-esimo <b>polinomio di Hermite</b> dato dalla Rodrigues
   $$H_n(x)=(-1)^ne^{x^2}\frac{d^n}{dx^n}e^{-x^2}.$$</p>`},
   {label:'I primi tre, e il controllo della normalizzazione', body:R`<p>$H_0=1$, $H_1=2x$, $H_2=4x^2-2$ (si ottengono dalla Rodrigues o dalla ricorrenza $H_{n+1}=2xH_n-2nH_{n-1}$; per esempio $H_3=2x(4x^2-2)-4\cdot 2x=8x^3-12x$). La costante di normalizzazione si controlla sul caso più semplice: $\int_{-\infty}^{\infty}dx\,\frac{e^{-x^2}}{\sqrt{\pi}}=1$, cioè $e_0$ ha norma uno.</p>
   <p><b>Attenzione alla convenzione</b>: il $2^n$ dentro la radice c'è perché $H_n$ ha coefficiente di testa $2^n$, non $1$. Esistono in letteratura Hermite «probabilistici» $He_n$ con peso $e^{-x^2/2}$ e coefficiente di testa $1$; quelli del corso, e quelli che compaiono nelle prove, sono questi.</p>`},
   {label:'Le cinque proprietà', body:R`<p>$H_n'=2nH_{n-1}$ · $H_{n+1}=2xH_n-2nH_{n-1}$ · $H_n''-2xH_n'+2nH_n=0$ (<b>equazione di Hermite</b>) · $H_n(-x)=(-1)^nH_n(x)$ (parità definita, come Legendre e a differenza di Laguerre) · $\int_{-\infty}^{\infty}dx\,e^{-x^2}H_nH_m=2^n\,n!\,\sqrt{\pi}\,\delta_{nm}$.</p>
   <p>Controllo dell'equazione differenziale su $n=2$: $H_2''-2xH_2'+4H_2=8-16x^2+16x^2-8=0$. Controllo dell'ortogonalità: $\int_{-\infty}^{\infty}dx\,e^{-x^2}H_2^2=8\sqrt{\pi}$, ed è $2^2\cdot2!\cdot\sqrt{\pi}$.</p>`}
  ]},
  {t:'plot', title:'Le prime tre funzioni della base di Hermite',
   intro:R`$e_n(x)=H_n(x)e^{-x^2/2}/\sqrt{2^n n!\sqrt{\pi}}$: sono, letteralmente, le autofunzioni dell'oscillatore armonico quantistico. $e_0$ è la gaussiana, $e_1$ ha un nodo, $e_2$ ne ha due.`,
   plots:[
    {kind:'func2d', xr:[-4,4], yr:[-0.85,0.85], ticks:true, height:340,
     title:'e0, e1, e2  —  base di Hermite su R',
     curves:[{f:'exp(-x*x/2)/pow(PI,0.25)', col:'#5eead4', width:1.8},
             {f:'2*x*exp(-x*x/2)/sqrt(2*pow(PI,0.5))', col:'#4c8dff', width:1.8},
             {f:'(4*x*x-2)*exp(-x*x/2)/sqrt(8*pow(PI,0.5))', col:'#d8a13a', width:1.8}]}
   ],
   leggi:R`Verde $e_0$, blu $e_1$, oro $e_2$. Tre cose. <b>Il numero di nodi è $n$</b>: è il fatto che in meccanica quantistica distingue lo stato fondamentale dagli eccitati, e vale per tutte e tre le famiglie di questo movimento (i Legendre hanno $n$ zeri, i Laguerre pure). <b>La parità si alterna</b>: $e_0$ ed $e_2$ pari, $e_1$ dispari — è $H_n(-x)=(-1)^nH_n(x)$ moltiplicata per la gaussiana, che è pari. <b>Tutte muoiono all'infinito</b>, ed è il fattore $e^{-x^2/2}$ a ucciderle: è l'unico motivo per cui un polinomio, che all'infinito esplode, può appartenere a $L^2(\mathbb{R})$. Senza peso, nessuna di queste curve sarebbe un vettore.`}
]},

/* ---------------- 07 · LA SECONDA STRADA: STURM-LIOUVILLE ---------------- */
{ num:'07', title:'La seconda strada per le stesse tre famiglie: Sturm-Liouville', meta:'Calogero §4.7 · le stesse basi come autofunzioni di un operatore · perché le due costruzioni coincidono · le convenzioni che cambiano',
  blocchi:[
  {t:'prosa', title:'Perché questa tappa esiste', tag:'cucitura fra le fonti', html:R`
  <p>Le note di Esposito arrivano a Legendre, Laguerre e Hermite per <b>ortonormalizzazione</b>: sono ciò che esce da Gram-Schmidt. Calogero (§4.7) ci arriva per una strada completamente diversa: sono le <b>autofunzioni</b> di un problema differenziale, il problema di <b>Sturm-Liouville</b>. Le due strade danno gli stessi polinomi, e questa non è una coincidenza da mandare a memoria: è il fatto centrale del capitolo, e la ragione per cui in fisica quelle funzioni saltano fuori da sole ogni volta che si separa una variabile.</p>
  <p>Chi studia solo Esposito sa <i>fabbricare</i> le basi ma non le riconosce quando arrivano da un'equazione differenziale — che è come arrivano in ogni prova sulle PDE. Chi studia solo Calogero le riconosce ma non sa da dove vengano. <b>Servono entrambe, e stanno qui.</b></p>`},
  {t:'reveal', title:'Il problema di Sturm-Liouville, e i due teoremi che lo rendono utile', tag:'Calogero §4.7', steps:[
   {label:'La forma', body:R`<p>Si considera l'equazione differenziale omogenea del secondo ordine
   $$\bigl(p(x)y'(x)\bigr)'-q(x)y(x)+\lambda\rho(x)y(x)=0,$$
   con $p,q,\rho$ funzioni reali note e $p(x)\gt 0$, $\rho(x)\gt 0$. Equivalentemente $\mathcal L\,y=\lambda\rho\,y$ con l'operatore differenziale lineare $\mathcal L=q(x)-p'(x)\frac{d}{dx}-p(x)\frac{d^2}{dx^2}$. Si cercano soluzioni su $\alpha\le x\le\beta$ che si annullino agli estremi, $y(\alpha)=y(\beta)=0$.</p>
   <p>Poiché l'equazione è omogenea, si può sempre soddisfare <b>una</b> delle due condizioni al bordo scegliendo la costante libera; solo per <b>valori speciali</b> di $\lambda$ si soddisfano entrambe. Quei valori si chiamano <b>autovalori</b> $\lambda_n$ e le soluzioni corrispondenti <b>autofunzioni</b> $y_n$. La struttura è già quella di me-07: un operatore, uno spettro.</p>`},
   {label:'Teorema 1 — gli autovalori sono reali', body:R`<p>Si scrive l'equazione per $y_n$ e la sua coniugata per $y_n^*$ (usando che $p,q,\rho$ sono reali), si moltiplica la prima per $y_n^*$ e la seconda per $y_n$, si sottrae e si integra da $\alpha$ a $\beta$. Integrando per parti il membro di destra diventa un termine di bordo, che si annulla per le condizioni al contorno:
   $$(\lambda_n-\lambda_n^*)\int_\alpha^\beta dx\,\rho(x)|y_n(x)|^2=\Bigl[y_n^*p\,y_n'-y_np\,y_n^{*\prime}\Bigr]_\alpha^\beta=0.$$
   Siccome $\rho\gt 0$, l'integrale è strettamente positivo, e dunque $\lambda_n=\lambda_n^*$. <b>Le autofunzioni risultano perciò reali</b>, a meno della costante moltiplicativa.</p>`},
   {label:'Teorema 2 — le autofunzioni sono ortogonali, ma col peso', body:R`<p>Lo stesso conto fatto con due indici diversi, $n$ e $m$, dà
   $$(\lambda_n-\lambda_m)\int_\alpha^\beta dx\,\rho(x)\,y_m^*(x)y_n(x)=\Bigl[y_m^*p\,y_n'-y_np\,y_m^{*\prime}\Bigr]_\alpha^\beta=0,$$
   e se $\lambda_n\ne\lambda_m$ il fattore davanti non è nullo, quindi l'integrale lo è:
   $$\int_\alpha^\beta dx\,\rho(x)\,y_m^*(x)y_n(x)=0,\qquad m\ne n.$$
   <b>Ecco da dove viene il peso.</b> La normalizzazione coerente è $\int_\alpha^\beta dx\,\rho(x)|y_n(x)|^2=1$, ed è per questo che Calogero infila $\rho(x)$ dentro l'integrale di normalizzazione: perché è rispetto a quel prodotto scalare che il problema è ortogonale. Il $\rho$ di Sturm-Liouville <b>è</b> l'$\omega$ della norma $L^2_\omega$ della tappa 03. Due notazioni, un oggetto.</p>`},
   {label:'Non degenerazione', body:R`<p>A ogni autovalore corrisponde <b>una sola</b> autofunzione (a parte la costante). Per assurdo, se ce ne fossero due indipendenti $y_1,y_2$, ogni combinazione $A_1y_1+A_2y_2$ sarebbe la soluzione generale <b>e</b> si annullerebbe agli estremi: ma allora <i>tutte</i> le soluzioni si annullerebbero agli estremi, il che è falso — si può sempre costruire una soluzione con valore assegnato arbitrario in $x=\alpha$.</p>`}
  ]},
  {t:'gram', title:'Le tre famiglie come problemi di Sturm-Liouville — e lo stesso oggetto nelle due fonti', rows:[
   [R`<b>Legendre</b><br>$[-1,1]$`, R`$p=1-x^2$, $q=0$, $\rho=1$; l'equazione è $\bigl((1-x^2)y'\bigr)'+\lambda y=0$, cioè $(1-x^2)y''-2xy'+\lambda y=0$. Qui $p$ si annulla agli estremi, quindi il problema è <b>singolare</b> e la condizione al bordo non è «$y=0$» ma «$y$ resta <b>limitata</b> in $x=\pm1$». Autovalori $\lambda=n(n+1)$; autofunzioni i $P_n$, normalizzati con $P_n(1)=1$. <b>Coincide</b> con la quarta proprietà della tappa 05.`],
   [R`<b>Hermite</b><br>$(-\infty,\infty)$`, R`$p=1$, $q=x^2-1$, $\rho=1$; l'equazione è $y''+(1-x^2)y+\lambda y=0$, con la condizione che $y$ non diverga per $x\to\pm\infty$. Autovalori $\lambda=2n$; autofunzioni $y_n=N_nH_n(x)e^{-x^2/2}$ con $N_n=\pi^{-1/4}2^{-n/2}(n!)^{-1/2}$. <b>Quel $N_n$ è esattamente il $1/\sqrt{2^n n!\sqrt{\pi}}$ della tappa 06</b>: stessa base, scritta con esponenti invece che con una radice.`],
   [R`<b>Laguerre</b><br>$[0,\infty)$`, R`$p=x$, $q=\frac{x}{4}-\frac12$, $\rho=1$; l'equazione è $\bigl(xy'\bigr)'+\bigl(\frac12-\frac{x}{4}\bigr)y+\lambda y=0$, con $y$ limitata sia in $x=0$ (dove $p$ si annulla) sia all'infinito. Autovalori $\lambda=n$; autofunzioni $y_n=e^{-x/2}L_n(x)$. <b>Coincide</b> con la base della tappa 06 a meno del segno $(-1)^n$, che è una costante moltiplicativa e non tocca né l'ortogonalità né la norma.`],
   [R`<b>La trappola delle convenzioni</b>`, R`Per Hermite, Calogero scrive l'autovalore come $\lambda=2n$ perché il suo $q$ contiene già il $-1$; le prove d'esame di Caprini-Esposito scrivono invece l'operatore come $A=-\frac{d^2}{dx^2}+x^2$ e l'autovalore come $\lambda_n=1+2n$. <b>È lo stesso problema traslato di uno</b>, e non c'è nulla da scegliere: si guarda come è scritto l'operatore e si legge lì lo spettro. Per Laguerre, poi, Calogero avverte che <i>non esiste una convenzione così universalmente accettata come per Legendre</i>: vi sono testi con una definizione diversa da quella qui riportata. In un esame, la definizione da usare è quella che il testo fornisce.`]
  ]},
  {t:'prosa', title:'Il limite dichiarato, che è onesto e va saputo', tag:'regime di validità', html:R`
  <p>Calogero chiude la sezione con un'avvertenza che vale la pena riportare intera, perché è esattamente il livello di rigore che questo corso dichiara: per i problemi di Sturm-Liouville <b>singolari</b> — cioè i tre di sopra, tutti — non è stato enunciato nessun teorema generale che garantisca l'esistenza di uno spettro discreto e la completezza del sistema di autofunzioni. <i>In effetti un tale teorema non esiste</i>: possono darsi problemi in cui gli autovalori sono un insieme continuo anziché discreto (e sarà il caso dell'operatore impulso, me-09b). Una trattazione rigorosa della completezza con spettro continuo richiederebbe un rigore assai più spinto di quel che è usuale e necessario per la discussione di problemi fisici; <i>nei quali si può fare invece ricorso all'intuito, rinunciando al rigore matematico, ma evitando nondimeno di commettere errori</i>.</p>
  <p>Detto in positivo: la completezza delle tre famiglie è un <b>fatto</b> che si usa, dimostrato caso per caso e non per teorema generale. È la stessa posizione che Esposito dichiara in apertura delle note — <i>il livello di rigore necessario per comprendere gli argomenti e saper navigare i regimi di validità</i> — e le due fonti, su questo, dicono la stessa cosa con parole diverse.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Perché le autofunzioni di Sturm-Liouville sono ortogonali <i>col peso</i> $\rho$, e non senza?`,
    a:R`Perché il termine che si annulla nella dimostrazione è quello di bordo, e ciò che resta a sinistra è $(\lambda_n-\lambda_m)\int\rho\,y_m^*y_n$: il $\rho$ arriva dal termine $\lambda\rho y$ dell'equazione, non lo si sceglie. Detto in linguaggio di me-07: l'operatore $\mathcal L$ è hermitiano <b>rispetto al prodotto scalare pesato da $\rho$</b>, e l'ortogonalità delle autofunzioni di un operatore hermitiano vale sempre rispetto al prodotto scalare che lo rende tale. Cambiare peso significa cambiare operatore.`},
   {q:R`Le due costruzioni (Gram-Schmidt e Sturm-Liouville) danno gli stessi polinomi. Perché non è un caso?`,
    a:R`Perché entrambe producono <b>l'unica</b> famiglia ortogonale di polinomi, uno per grado, rispetto a quel prodotto scalare. Gram-Schmidt lo costruisce per definizione: $u_n$ è di grado $n$ e ortogonale a tutti i precedenti, e questo lo determina a meno della costante. Sturm-Liouville arriva allo stesso insieme perché il teorema 2 garantisce l'ortogonalità e la struttura ricorsiva dell'equazione garantisce che l'autofunzione $n$-esima sia un polinomio di grado $n$. Due caratterizzazioni della stessa condizione, quindi lo stesso oggetto — a meno di normalizzazione, che infatti è l'unica cosa su cui le fonti divergono.`}
  ]}
]},

/* ---------------- 08 · PALESTRA D'ESAME ---------------- */
{ num:'08', title:'Palestra: quello che chiedono davvero', meta:'7 prove su 24 toccano questo movimento · Gram-Schmidt esplicito · $L^2$ come condizione al bordo · la base di Hermite in una PDE',
  blocchi:[
  {t:'prosa', title:'Le tre forme in cui $me$-08 compare nelle prove', tag:'misura', html:R`
  <p>Spogliando le 24 prove in banca dati, questo movimento non compare quasi mai come domanda di teoria. Compare in tre forme, e conviene riconoscerle:</p>
  <ol>
  <li><b>Ortonormalizzare due o tre funzioni esplicite</b> in $L^2$ di un intervallo dato. Esercizio autonomo, da sette punti. Prova del 12/02/2025 n.3. Non richiede di sapere niente di questo movimento oltre alla tappa 03 e a Gram-Schmidt: richiede di saper fare gli integrali.</li>
  <li><b>$L^2$ come condizione al bordo</b>: si risolve un problema agli autovalori e si usa «$f\in L^2$» per buttare via le soluzioni che divergono. Prova del 08/09/2023 n.4, prova del 07/07/2025 n.3. Qui $L^2$ non è il tema: è il filtro.</li>
  <li><b>La base di Hermite (o di Legendre) come autobase di un operatore</b>, dentro un esercizio di PDE o di sviluppo. Prova del 09/09/2025 n.4, Set 2 n.3. Qui serve la tappa 07: riconoscerla dall'equazione, non dalla costruzione.</li>
  </ol>`},
  {t:'esercizio', title:'Ortonormalizzare $\\sin x\\,e^{-x}$ e $\\cos x\\,e^{-x}$ in $L^2[0,\\infty)$', src:'prova del 12/02/2025, esercizio 3 (7 punti)',
   testo:R`Si considerino le funzioni $f_1(x)=\sin(x)e^{-x}$ e $f_2(x)=\cos(x)e^{-x}$, definite su $L^2[0,\infty)$. Le si rendano ortonormali.`,
   steps:[
    {label:'Strategia: prima tutti i prodotti scalari, poi Gram-Schmidt', body:R`<p>Gram-Schmidt su due vettori richiede tre numeri: $\langle f_1|f_1\rangle$, $\langle f_2|f_2\rangle$, $\langle f_1|f_2\rangle$. Calcolarli tutti e tre <b>prima</b> evita di rifare integrali dentro le formule. Le funzioni sono reali, quindi non c'è coniugazione da portarsi dietro.</p>`},
    {label:'I tre integrali', body:R`<p>Il modo rapido è la forma esponenziale: $\sin^2x=\frac{1-\cos2x}{2}$, $\cos^2x=\frac{1+\cos2x}{2}$, $\sin x\cos x=\frac{\sin 2x}{2}$, e poi $\int_0^{\infty}dx\,e^{-2x}\cos2x=\frac14$, $\int_0^{\infty}dx\,e^{-2x}\sin2x=\frac14$. Vengono
    $$\langle f_1|f_1\rangle=\int_0^{\infty}dx\,\sin^2\!x\,e^{-2x}=\frac18,$$
    $$\langle f_2|f_2\rangle=\int_0^{\infty}dx\,\cos^2\!x\,e^{-2x}=\frac38,$$
    $$\langle f_1|f_2\rangle=\int_0^{\infty}dx\,\sin x\cos x\,e^{-2x}=\frac18.$$</p>`},
    {label:'Primo vettore: normalizzare', body:R`<p>$$e_1(x)=\frac{f_1(x)}{\sqrt{\langle f_1|f_1\rangle}}=2\sqrt{2}\,\sin(x)e^{-x}.$$
    Verifica immediata: $8\cdot\frac18=1$.</p>`},
    {label:'Secondo vettore: sottrarre la proiezione', body:R`<p>$$u_2=f_2-\langle e_1|f_2\rangle e_1=f_2-\frac{\langle f_1|f_2\rangle}{\langle f_1|f_1\rangle}f_1=f_2-f_1=\bigl(\cos x-\sin x\bigr)e^{-x},$$
    perché il rapporto $\frac{1/8}{1/8}$ vale $1$. La norma quadra si legge dai tre numeri già calcolati, senza nuovi integrali:
    $$\|u_2\|^2=\langle f_2|f_2\rangle-2\langle f_1|f_2\rangle+\langle f_1|f_1\rangle=\frac14,$$
    dunque
    $$e_2(x)=2\bigl(\cos x-\sin x\bigr)e^{-x}.$$</p>`},
    {label:'Controllo finale', body:R`<p>Il prodotto scalare $\langle e_1|e_2\rangle$ lo calcoliamo qui, per esteso: $\int_0^{\infty}dx\,4\sqrt2\,\sin x(\cos x-\sin x)e^{-2x}=0$, perché $\frac18-\frac18$ si annulla. <b>Il controllo va fatto sempre</b>: costa dieci secondi e intercetta il segno sbagliato, che è l'errore tipico del passo di sottrazione.</p>`}
   ]},
  {t:'esercizio', title:'$L^2$ come filtro: l\'operatore $-\\frac{d^2}{dx^2}-\\delta(x)$', src:'prova del 08/09/2023, esercizio 4 (parte a)',
   testo:R`Per l'operatore $A=-\dfrac{d^2}{dx^2}-\delta(x)$ e il problema $Af=\lambda f$, trovare autovalori e autofunzioni per $\lambda\lt 0$ cercando autofunzioni in $L^2(\mathbb{R})$.`,
   steps:[
    {label:'Dove $\\delta$ non c\'è', body:R`<p>Per $x\ne0$ l'equazione è $-f''=\lambda f$ con $\lambda\lt 0$, cioè $f''=|\lambda|f$: soluzioni esponenziali reali $e^{\pm\sqrt{|\lambda|}x}$. In generale $f=a\,e^{-\sqrt{|\lambda|}x}+b\,e^{+\sqrt{|\lambda|}x}$ per $x\gt 0$ e $c\,e^{-\sqrt{|\lambda|}x}+d\,e^{+\sqrt{|\lambda|}x}$ per $x\lt 0$.</p>`},
    {label:'Qui entra $L^2$, e uccide metà delle costanti', body:R`<p>Una funzione di $L^2(\mathbb{R})$ deve annullarsi all'infinito (più precisamente: non può avere una coda esponenzialmente crescente, perché il suo quadrato non sarebbe integrabile — è il caso 2 della tappa 03). Quindi $b=0$ e $c=0$: <b>l'appartenenza a $L^2$ non è una nota a margine, è ciò che seleziona lo spettro.</b> È il punto in cui questo movimento entra in un esercizio che sembra di tutt'altro argomento.</p>`},
    {label:'Le condizioni di raccordo in $0$', body:R`<p>Dalla presenza della $\delta$ si deduce che $f$ è <b>continua</b> in $0$ mentre $f'$ ha un salto. La continuità in $0$ — il valore da destra e quello da sinistra coincidono — dà $a=d$. Il salto si trova integrando l'equazione su $[-\epsilon,\epsilon]$ e mandando $\epsilon\to0$, tecnica che è di me-09.</p>`},
    {label:'Cosa portare via', body:R`<p>Non il risultato, ma il <b>ruolo</b> di $L^2$: in dimensione infinita lo spettro di un operatore dipende dallo spazio in cui si cercano le autofunzioni. La stessa equazione, cercata in $L^2_{\rm loc}$ invece che in $L^2$, ha uno spettro <b>continuo</b> e autofunzioni generalizzate (la seconda parte della stessa prova, e tutto me-09b). Cambiare lo spazio cambia la risposta: è la cosa che in dimensione finita non poteva succedere.</p>`}
   ]},
  {t:'esercizio', title:'Espandere un dato iniziale nella base di Hermite', src:'prova del 09/09/2025, esercizio 4 (il passo che vale l\'esercizio)',
   testo:R`In una PDE con dato iniziale $u(0,x)=(2+3x)e^{-x^2/2}$ e condizione $u\to0$ per $|x|\to\infty$, si chiede di sfruttare la base di Hermite $f_n(x)=H_n(x)e^{-x^2/2}$. Come si scrive il dato iniziale in quella base?`,
   steps:[
    {label:'Primo: riconoscere l\'operatore', body:R`<p>La separazione delle variabili produce l'equazione agli autovalori per $A=-\frac{d^2}{dx^2}+x^2$, e il suggerimento del testo dice quali sono le autofunzioni. Vale
    $$-f_n''(x)+x^2f_n(x)=\lambda_nf_n(x),\qquad\lambda_n=1+2n,$$
    con $f_n\to0$ all'infinito. Questa è la tappa 07 usata al contrario: non si costruisce la base, la si <b>riconosce</b>. Controllo su $n=0$: $f_0=e^{-x^2/2}$, $f_0''=(x^2-1)e^{-x^2/2}$, quindi $-f_0''+x^2f_0=e^{-x^2/2}$ e $\lambda_0=1$. Su $n=1$: $f_1=2xe^{-x^2/2}$ e viene $\lambda_1=3$.</p>`},
    {label:'Secondo: il dato iniziale è già nella base', body:R`<p>Il fattore $e^{-x^2/2}$ c'è già; resta da scrivere $2+3x$ nei polinomi di Hermite. Siccome $H_0=1$ e $H_1=2x$:
    $$2+3x=2H_0(x)+\tfrac32H_1(x),$$
    e dunque $u(0,x)=2f_0(x)+\frac32f_1(x)$: <b>solo due modi</b>, tutti gli altri coefficienti nulli. La somma infinita si tronca da sola.</p>`},
    {label:'Perché l\'esame è costruito così', body:R`<p>Perché con un dato iniziale polinomiale per la gaussiana l'espansione è <b>esatta e finita</b>, e l'esercizio diventa fattibile in venti minuti. Riconoscerlo vale mezzo esercizio: se ci si mette a calcolare $c_n=\int dx\,e^{-x^2}H_n(x)(2+3x)$ per $n$ generico si fa un lavoro inutile, perché $(2+3x)$ è un polinomio di grado $1$ e i suoi coefficienti su $H_n$ con $n\ge2$ sono nulli per ortogonalità. <b>La parità e il grado sono le due scorciatoie che questo movimento regala, e vanno cercate prima di integrare.</b></p>`}
   ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`In un esercizio su $L^2[0,\infty)$ con i polinomi di Laguerre, il prodotto scalare da usare è $\int_0^\infty dx\,f^*g$ oppure $\int_0^\infty dx\,e^{-x}f^*g$?`,
    a:R`<b>Dipende da come sono scritte le funzioni, e la differenza è il passo 3 della tappa 06.</b> Se si lavora con i polinomi <i>nudi</i> $L_n(x)$ si è nello spazio pesato, e il prodotto scalare porta $e^{-x}$: $\int_0^\infty dx\,e^{-x}L_nL_m=\delta_{nm}$. Se si lavora con le funzioni $e_n(x)=(-1)^ne^{-x/2}L_n(x)$ si è in $L^2[0,\infty)$ vero, e il peso è già dentro le funzioni, metà per ciascuna: il prodotto scalare è quello piatto. Sbagliare qui significa sbagliare tutti i coefficienti di un fattore $e^{\pm x}$.`},
   {q:R`Come si decide in trenta secondi se $\dfrac{\sin x}{x}$ sta in $L^2(\mathbb{R})$?`,
    a:R`Si guardano separatamente i due punti critici, come prescrive la regola d'oro della tappa 03. <b>In $x=0$</b>: non c'è singolarità, $\sin x/x\to1$. <b>All'infinito</b>: $|\sin x/x|^2\le1/x^2$, e $\int^{\infty}dx/x^2$ converge. Entrambi i controlli passano, dunque <b>sì</b>, sta in $L^2(\mathbb{R})$. Da notare per me-10: sta in $L^2$ ma <b>non</b> in $L^1$, perché $\int|\sin x/x|dx$ diverge — ed è il motivo per cui la trasformata di Fourier va estesa da $L^1$ a $L^2$ passando per lo spazio di Schwartz invece che definita direttamente.`}
  ]}
]},

/* ---------------- 09 · PROLESSI ---------------- */
{ num:'09', title:'Dove riappare, dopo', meta:'me-09 · me-09b · me-10 · e la fisica del terzo anno',
  blocchi:[
  {t:'prolessi', title:'Dove riappare questo nucleo, nella fisica che farai',
   oggetto:R`<b>$L^2$ come spazio di Hilbert di funzioni</b>, con le sue basi ortonormali costruite per ortonormalizzazione dei monomi o, equivalentemente, come autofunzioni di un problema di Sturm-Liouville.`,
   rotte:[
    {dove:'Meccanica quantistica<br>(III anno, 12 CFU)', txt:R`Non è un'analogia: la funzione d'onda <b>è</b> un elemento di $L^2$, il prodotto scalare <b>è</b> $\int dx\,\psi^*\varphi$, la normalizzazione $\|\psi\|=1$ <b>è</b> la conservazione della probabilità, e «quasi ovunque» è la ragione per cui $|\psi(x)|^2$ si integra su un intervallo invece di essere letta in un punto. La base di Hermite della tappa 06 sono le autofunzioni dell'<b>oscillatore armonico</b>; i Laguerre sono la parte radiale dell'<b>atomo di idrogeno</b>; i Legendre, via armoniche sferiche, la parte angolare di ogni potenziale centrale. Tutto il movimento è il primo capitolo del corso di MQ, scritto in anticipo.`},
    {dove:'Distribuzioni e $\\delta$ di Dirac<br>(me-09)', txt:R`Il prossimo movimento nasce da un limite di questo: la $\delta$ serve a rappresentare una carica puntiforme, e <b>non può essere un elemento di $L^2$</b> — né di nessuno spazio di funzioni — proprio per il «quasi ovunque» della tappa 04. Si esce dalle funzioni, e ciò che si guadagna è la derivabilità illimitata. Chi non ha chiaro perché $L^2$ non basti non capisce perché le distribuzioni esistano.`},
    {dove:'Operatori in dimensione<br>infinita (me-09b)', txt:R`L'esercizio della tappa 08 sull'operatore con la $\delta$ anticipa il punto: in dimensione infinita il <b>dominio</b> di un operatore è parte dell'operatore, e lo spettro dipende dallo spazio in cui si cercano le autofunzioni. $L^2$ dà spettro discreto, $L^2_{\rm loc}$ spettro continuo e autofunzioni generalizzate. Da lì escono l'operatore impulso, le relazioni di commutazione e Heisenberg.`},
    {dove:'Analisi di Fourier<br>(me-10)', txt:R`La serie di Fourier è lo sviluppo su <b>un'altra</b> base ortonormale di $L^2$, quella delle esponenziali $e^{2\pi inx/a}$ su un intervallo — il caso più famoso, non un caso a parte. Parseval è la conservazione della norma nel passaggio alle componenti, cioè l'isomorfismo con $\ell^2$ della tappa 01 scritto per esteso; Plancherel ne è la versione continua. Il fenomeno di Gibbs è la differenza fra convergenza in norma e convergenza puntuale, quella della tappa 04.`},
    {dove:'Meccanica statistica<br>e teoria dei campi', txt:R`L'idea di <b>sviluppare in modi</b> un campo continuo — che è ciò che questo movimento insegna — è l'operazione con cui si quantizza un campo, si diagonalizza un hamiltoniano di spin, si scrive la funzione di partizione di un sistema di oscillatori. I polinomi ortogonali riappaiono ogni volta che il peso della misura non è piatto: il peso gaussiano $e^{-x^2}$ degli Hermite è, letteralmente, la misura di Boltzmann di un oscillatore classico.`},
    {dove:'Metodi numerici<br>e quadratura', txt:R`Gli zeri dei polinomi ortogonali sono i nodi delle formule di <b>quadratura gaussiana</b>: integrare con $n$ nodi scelti negli zeri di $P_n$ è esatto per tutti i polinomi fino al grado $2n-1$. È la ragione pratica per cui queste famiglie stanno in ogni libreria di calcolo scientifico, e un buon promemoria che la tappa 05 non è cultura generale.`}
   ]}
]}

var byId = {}; TAPPE.forEach(function(s){ byId[s.num]=s; });

var VKEY='pm-nucleome-08-visited';
function loadSeen(){ try{ return new Set(JSON.parse(localStorage.getItem(VKEY)||'[]')); }catch(e){ return new Set(); } }
function saveSeen(s){ try{ localStorage.setItem(VKEY, JSON.stringify(Array.from(s))); }catch(e){} }
var SEEN = loadSeen();

function renderNav(active){
  var nav=document.getElementById('sidebar');
  nav.innerHTML='';
  var h=document.createElement('h2'); h.textContent='Nucleo me-08 · le tappe'; nav.appendChild(h);
  TAPPE.forEach(function(s){
    var b=document.createElement('button');
    b.className='navitem'+(active===s.num?' active':'')+(SEEN.has(s.num)?' seen':'');
    b.innerHTML='<span class="dot"></span><span class="nx">'+s.num+'</span><span>'+s.title+'</span>';
    b.onclick=function(){ showTappa(s.num); };
    nav.appendChild(b);
  });
}

/* ---- renderer dei blocchi ---- */
function sectionProsa(title, tag, html){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var body=elFromHTML('<div class="open-body">'+html+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function sectionGram(title, rows){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag gramtag">grammatica</span></h3>';
  var inner='<table class="gramtab">';
  rows.forEach(function(r){ inner+='<tr><td class="gs">'+r[0]+'</td><td>'+r[1]+'</td></tr>'; });
  inner+='</table>';
  var body=elFromHTML('<div class="gramwrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
/* --- blocco PLOT: la figura non decora, si legge. Ogni plot porta una chiave di lettura. --- */
function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';
  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
    else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
    else if(b.t==='prolessi') m.appendChild(sectionProlessi(b));
    else if(b.t==='reveal')m.appendChild(sectionReveal(b.title,b.tag,b.steps));
    else if(b.t==='esercizio') m.appendChild(sectionEsercizio(b));
    else if(b.t==='collaudo')  m.appendChild(sectionCollaudo(b.title,b.items));
    else if(b.t==='plot')      m.appendChild(sectionPlot(b));
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}

/* deep-link: me-08-l2-basi-di-funzioni.html#03 apre direttamente la tappa 03 */
window.addEventListener('DOMContentLoaded', function(){
  var h=(location.hash||'').replace('#','');
  showTappa(byId[h]?h:'00');
});
window.addEventListener('hashchange', function(){
  var h=(location.hash||'').replace('#','');
  if(byId[h]) showTappa(h);
});
