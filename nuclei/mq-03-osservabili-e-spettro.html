<style>
  :root{
    --bg:#0e1117; --panel:#161b22; --panel2:#1c232d; --border:#2b333d;
    --txt:#eef3f8; --muted:#b9c4d1; --accent:#4c8dff; --accent2:#8fb0ff;
    --ok:#2ea043; --okbg:#10331b; --warn:#d8a13a; --warnbg:#332a10;
    --gram:#5eead4; --grambg:#0f2a26;
    --pro:#b98cff; --probg:#1a1430; --proline:#2a2247; --proedge:#3a2d5c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    font-size:17px;line-height:1.55;}
  a{color:var(--accent2);}
  .banner{background:var(--panel2);border-bottom:1px solid var(--border);color:var(--muted);
    font-size:.8rem;font-weight:600;text-align:center;padding:8px 12px;letter-spacing:.3px;}
  .banner b{color:var(--accent2);}
  .shell{display:flex;max-width:1180px;margin:0 auto;align-items:flex-start;}

  /* ---- SIDEBAR ---- */
  .sidebar{width:280px;flex:0 0 280px;padding:20px 12px 60px;position:sticky;top:0;
    max-height:100vh;overflow-y:auto;border-right:1px solid var(--border);}
  .sidebar h2{font-size:.72rem;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);
    margin:18px 8px 8px;}
  .navitem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:none;
    background:transparent;color:var(--txt);padding:9px 10px;border-radius:8px;cursor:pointer;
    font-size:.9rem;transition:.12s;border:1px solid transparent;}
  .navitem:hover{background:var(--panel2);}
  .navitem.active{background:#13233f;border-color:var(--accent);color:#fff;}
  .navitem .dot{width:7px;height:7px;border-radius:50%;background:transparent;flex:0 0 7px;
    border:1px solid var(--border);}
  .navitem.seen .dot{background:var(--ok);border-color:var(--ok);}
  .navitem .nx{color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto;}

  /* ---- MAIN ---- */
  .main{flex:1 1 auto;min-width:0;padding:24px 30px 90px;max-width:860px;}
  h1{font-size:1.5rem;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:.92rem;margin:0 0 18px;}
  .sfhead{border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:8px;}
  .sfhead h1{font-size:1.55rem;}
  .meta{color:var(--muted);font-size:.82rem;margin-top:6px;}

  .section{margin:26px 0;}
  .section > h3{font-size:1.02rem;color:var(--accent2);margin:0 0 10px;
    display:flex;align-items:center;gap:10px;}
  .section > h3 .tag{font-size:.66rem;font-weight:700;letter-spacing:.4px;background:var(--panel2);
    border:1px solid var(--border);color:var(--muted);padding:2px 8px;border-radius:20px;
    text-transform:uppercase;}
  /* --- blocchi figura --- */
  .section > h3 .tag.plottag{background:#101f2e;border-color:#1f3c57;color:#7ab8e0;}
  .plot-intro{color:var(--muted);font-size:.95rem;margin:0 0 12px;}
  .plot-row{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;
    background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;}
  .plot-row.due .plot-box{flex:1 1 300px;min-width:280px;}
  .plot-box{max-width:560px;}
  .plot-leggi{margin-top:10px;background:var(--panel2);border:1px solid var(--border);
    border-left:3px solid #4a8fc7;border-radius:0 10px 10px 0;padding:11px 14px;
    font-size:.93rem;color:var(--muted);}
  .plot-leggi b{color:#7ab8e0;}
  .plot-err{color:#ff6b6b;font-size:.85rem;}
  .open-body{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
  .open-body p:first-child{margin-top:0;} .open-body p:last-child{margin-bottom:0;}
  .open-body ul{margin:.4em 0;padding-left:1.2em;} .open-body li{margin:.35em 0;}

  .note{background:var(--panel2);border-left:3px solid var(--muted);border-radius:6px;
    padding:9px 12px;margin:12px 0;font-size:.9rem;color:var(--muted);}
  .note b{color:#ff9d6b;}
  .note.warn{background:var(--warnbg);border-left-color:var(--warn);color:#e0b85a;}
  .note.warn b{color:#f0c25a;}

  /* ---- GRAMMATICA ---- */
  .gramwrap{background:var(--grambg);border:1px solid #1f4d47;border-radius:12px;padding:6px 6px;}
  table.gramtab{border-collapse:collapse;width:100%;font-size:.92rem;}
  table.gramtab td{padding:9px 12px;vertical-align:top;border-bottom:1px solid #17332e;}
  table.gramtab tr:last-child td{border-bottom:none;}
  table.gramtab td.gs{white-space:nowrap;color:var(--gram);width:1%;
    border-right:1px solid #17332e;font-variant-numeric:tabular-nums;}
  .section > h3 .tag.gramtag{background:var(--grambg);border-color:#1f4d47;color:var(--gram);}

  /* ---- STRUMENTI (repertorio condiviso: la scheda si apre DENTRO la frase) ----
     Nessun accento nuovo: riusa il verde della grammatica, perche' uno strumento
     richiamato e' grammatica gia' spiegata altrove, non una quinta specie di blocco. */
  .str{color:var(--gram);border-bottom:1px dashed var(--gram);cursor:pointer;}
  .str:hover{background:var(--grambg);}
  .str::after{content:"\2666";font-size:.62em;vertical-align:.42em;margin-left:2px;opacity:.8;}
  .str.aperto::after{content:"\2715";}
  .str.rotto{color:#ff6b6b;border-bottom-color:#ff6b6b;cursor:help;}
  /* la scheda e' uno SPAN in display:block, non un div: i rimandi cadono dentro
     <p>, <li> e celle di tabella, dove un div e' HTML illegale. */
  .strcard{display:block;margin:10px 0;background:var(--grambg);border:1px solid #1f4d47;
    border-left:3px solid var(--gram);border-radius:0 10px 10px 0;padding:10px 14px;font-size:.9rem;}
  .strcard .sh{display:block;font-size:.66rem;font-weight:700;letter-spacing:.5px;
    text-transform:uppercase;color:var(--gram);margin-bottom:7px;}
  .strcard .sr{display:block;margin:5px 0;}
  .strcard .sk{color:var(--gram);font-weight:600;}

  /* ---- PROLESSI (preannuncio fisico) ---- */
  .prowrap{background:var(--probg);border:1px solid var(--proedge);border-radius:12px;padding:4px 4px 8px;}
  .prohead{padding:11px 14px 4px;color:var(--pro);font-size:.72rem;font-weight:700;letter-spacing:.7px;
    text-transform:uppercase;}
  .pro-oggetto{padding:2px 14px 11px;color:var(--muted);font-size:.92rem;border-bottom:1px solid var(--proline);
    margin-bottom:2px;} .pro-oggetto b{color:var(--txt);}
  table.protab{border-collapse:collapse;width:100%;font-size:.92rem;}
  table.protab td{padding:10px 12px;vertical-align:top;border-bottom:1px solid var(--proline);}
  table.protab tr:last-child td{border-bottom:none;}
  table.protab td.pd{white-space:nowrap;color:var(--pro);width:1%;font-weight:700;font-size:.78rem;
    letter-spacing:.3px;text-transform:uppercase;border-right:1px solid var(--proline);line-height:1.3;}
  .pro-domanda{margin:8px 8px 2px;background:#140d26;border:1px solid var(--proedge);
    border-left:3px solid var(--pro);border-radius:8px;padding:10px 14px;font-size:.92rem;}
  .pro-domanda b{color:var(--pro);}
  .section > h3 .tag.protag{background:var(--probg);border-color:var(--proedge);color:var(--pro);}

  /* ---- REVEAL ---- */
  .rsteps{display:flex;flex-direction:column;gap:12px;}
  .rstep{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 18px;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .rlabel{font-size:.7rem;font-weight:700;letter-spacing:.4px;color:var(--accent);
    text-transform:uppercase;margin-bottom:8px;}
  .rstep p:first-of-type{margin-top:0;} .rstep p:last-child{margin-bottom:0;}
  .rstep ul{margin:.4em 0;padding-left:1.2em;}
  .testo{background:#13233f;border:1px solid #2b4877;border-radius:12px;padding:14px 18px;margin-bottom:14px;}
  .testo .src{display:block;font-size:.74rem;font-style:italic;color:var(--accent2);margin-bottom:8px;
    text-transform:uppercase;letter-spacing:.3px;}
  .esame-nota{font-size:.9rem;color:var(--muted);font-style:italic;margin-top:12px;padding-left:12px;
    border-left:3px solid var(--border);}

  .reveal-btn{background:var(--accent);color:#fff;border:none;padding:11px 18px;border-radius:10px;
    font-size:.95rem;font-weight:600;cursor:pointer;margin-top:14px;transition:.12s;}
  .reveal-btn:hover:not(:disabled){background:var(--accent2);}
  .reveal-btn.small{padding:7px 14px;font-size:.85rem;margin-top:0;background:var(--panel2);
    color:var(--accent2);border:1px solid var(--border);}
  .reveal-btn.small:hover:not(:disabled){border-color:var(--accent);}
  .reveal-btn:disabled,.reveal-btn.done{background:var(--panel2);color:var(--muted);
    border:1px solid var(--border);cursor:default;}

  /* ---- COLLAUDO ---- */
  .collaudo-item{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 18px;margin-bottom:12px;}
  .cq{margin-bottom:10px;}
  .ca{margin-top:12px;background:var(--okbg);border:1px solid #235c33;border-radius:8px;
    padding:10px 14px;font-size:.94rem;}
  .ca b{color:#5fd980;}

  /* ---- PREV / NEXT ---- */
  .prevnext{display:flex;justify-content:space-between;gap:12px;margin-top:40px;
    border-top:1px solid var(--border);padding-top:20px;}
  .pnbtn{flex:1 1 0;background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:12px 16px;cursor:pointer;color:var(--txt);text-align:left;transition:.14s;font:inherit;}
  .pnbtn:hover{border-color:var(--accent);background:var(--panel2);}
  .pnbtn.next{text-align:right;}
  .pnbtn .k{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .pnbtn .t{font-weight:600;color:var(--accent2);}
  .pnbtn:disabled{opacity:.35;cursor:default;border-color:var(--border);background:var(--panel);}

  code{background:var(--panel2);border:1px solid var(--border);border-radius:5px;
    padding:1px 5px;font-size:.85em;color:var(--accent2);}
  .katex{font-size:1.02em;color:var(--txt);} .katex-display{margin:.5em 0;overflow-x:auto;overflow-y:hidden;}

  @media(max-width:860px){
    .shell{flex-direction:column;}
    .sidebar{width:100%;flex:none;position:static;max-height:none;border-right:none;
      border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:4px;}
    .sidebar h2{width:100%;} .navitem{width:auto;}
    .main{padding:20px 16px 80px;}
  }
</style>
</head>

<script>
"use strict";
const R = String.raw;

function typeset(el){
  if(el && window.renderMathInElement){
    try{ renderMathInElement(el,{delimiters:[
      {left:'$$',right:'$$',display:true},
      {left:'$',right:'$',display:false}
    ],throwOnError:false}); }catch(e){}
  }
}
function elFromHTML(html){ var d=document.createElement('div'); d.innerHTML=html; return d; }

/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un
   rimando scritto nella prosa:

       <span class="str" data-str="serie-geometrica">la serie geometrica</span>

   Le schede citate da questo nucleo sono cucite qui sotto dal montaggio
   (assembla-nucleo.js): la pagina resta autosufficiente — niente fetch,
   niente sottocartelle da pubblicare — e un rimando a una scheda che non
   esiste FERMA la costruzione invece di arrivare in pagina rotto.
   Apertura: lo stesso gesto del collaudo (si clicca, il pannello compare,
   si typeset una volta sola), portato dentro la frase.
   =================================================================== */
var CORSO = 'meccanica-quantistica';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["operatore-aggiunto"] = {"nome":"Operatore aggiunto e autoaggiunto","riga":"L'aggiunto e' definito da $\\langle\\phi|\\hat A\\psi\\rangle=\\langle\\hat A^{\\dagger}\\phi|\\psi\\rangle$ per ogni coppia di stati, e l'operatore e' autoaggiunto quando coincidono sia $\\hat A^{\\dagger}$ con $\\hat A$ sia i loro domini.","serve":"E' la condizione che rende un operatore un'osservabile: autovalori reali, e autovettori di autovalori distinti ortogonali. In dimensione finita «autoaggiunto» e «hermitiano» coincidono; in dimensione infinita no, e la differenza non e' pedanteria — l'operatore impulso su una semiretta e' hermitiano e non autoaggiunto, e infatti non e' un'osservabile.","esempio":"Se $\\hat A\\psi=a\\psi$ con $\\hat A$ autoaggiunto, allora $a\\langle\\psi|\\psi\\rangle=\\langle\\psi|\\hat A\\psi\\rangle=\\langle\\hat A\\psi|\\psi\\rangle=a^{*}\\langle\\psi|\\psi\\rangle$; siccome la norma non e' nulla segue $a=a^{*}$, cioe' l'autovalore e' reale. Tre righe, e sono la ragione per cui le osservabili si rappresentano cosi'.","debito":"la distinzione fra hermitiano e autoaggiunto in dimensione infinita — domini, estensioni, indici di difetto — e' il programma di von Neumann e sta fuori da questo percorso: qui si dichiara che esiste e si lavora nel caso buono. La regola di inversione dell'ordine nell'aggiunto di un prodotto si usa e non si dimostra.","controllo":[{"tipo":"uguale","sinistra":"conjugate(a)","vale":"a","ipotesi":{"a":"real"},"dove":"esempio","appare":"a=a^{*}"}],"qui":{},"pieno":null};
STRUM["spazio-di-hilbert"] = {"nome":"Spazio di Hilbert","riga":"E' uno spazio vettoriale complesso con prodotto interno, completo nella norma che ne deriva e separabile, cosicche' ogni stato si scrive come somma numerabile $|\\psi\\rangle=\\sum_n c_n|n\\rangle$ con $c_n=\\langle n|\\psi\\rangle$.","serve":"E' la casa degli stati, e le tre parole della definizione fanno tre lavori diversi. Il prodotto interno da' le ampiezze, e quindi le probabilita'. La completezza garantisce che il limite di una successione di stati sia ancora uno stato: senza, uno sviluppo in serie potrebbe convergere fuori dallo spazio. La separabilita' permette di scrivere un vettore con una lista numerabile di coefficienti, cioe' di fare i conti.","esempio":"La relazione di completezza $\\sum_n|n\\rangle\\langle n|=\\hat 1$ e' lo strumento operativo piu' usato della teoria: infilata dentro un prodotto scalare lo spezza in una somma. La norma diventa $\\langle\\psi|\\psi\\rangle=\\sum_n|c_n|^{2}$, e se lo stato e' normalizzato quella somma vale uno: i moduli quadri dei coefficienti sono probabilita', e sommano a uno per costruzione.","debito":"la costruzione di $L^{2}$ come completamento, la misura di Lebesgue che serve a definirlo e il teorema di Riesz-Fischer stanno nei movimenti di Metodi; qui si usa il risultato.","controllo":[{"tipo":"somma","espr":"(1/2)**n","var":"n","da":"1","a":"oo","vale":"1","ipotesi":{"n":"positive-integer"},"dove":"esempio","appare":"sommano a uno"},{"tipo":"simbolico","dove":"esempio","appare":"\\sum_n|n\\rangle\\langle n|=\\hat 1","perche":"e' la relazione di completezza: i proiettori sugli elementi di una base ortonormale sommano all'identita'. E' la proprieta' che definisce una base completa, non un conto"}],"qui":{},"pieno":null};
STRUM["spettro"] = {"nome":"Spettro di un operatore","riga":"Lo spettro di un operatore e' l'insieme dei possibili esiti di una misura — i suoi autovalori — e puo' essere discreto (autovalori separati, autovettori in $\\mathcal H$), continuo (autovalori che riempiono un intervallo, autovettori non normalizzabili), o misto.","serve":"E' la quantita' che la fisica chiede davvero: scrivere l'hamiltoniana e trovarne lo spettro E' il problema d'esame. La distinzione discreto/continuo non e' tecnica — decide se un autostato e' uno stato preparabile (discreto) o una distribuzione che vive fuori dallo spazio di Hilbert (continuo), come l'onda piana e la delta.","esempio":"Per $\\sigma_z=\\begin{pmatrix}1&0\\\\0&-1\\end{pmatrix}$ lo spettro e' $\\{+1,-1\\}$, discreto, e i due invarianti della matrice lo riassumono senza risolvere l'equazione secolare: la somma degli autovalori e' la traccia, $\\operatorname{tr}\\sigma_z=0$, il loro prodotto e' il determinante, $\\det\\sigma_z=-1$. Per l'operatore posizione lo spettro e' tutta la retta reale, continuo, e gli autovettori sono delte di Dirac.","debito":"la costruzione rigorosa dello spettro continuo (teorema spettrale generalizzato, misura spettrale $E(\\lambda)$ di von Neumann) sta fuori da questo percorso: qui si dichiara che esiste e si lavora coi casi concreti. La separazione fra spettro continuo e spettro residuo non si tratta.","controllo":[{"tipo":"uguale","sinistra":"Matrix([[1,0],[0,-1]]).trace()","vale":"0","dove":"esempio","appare":"\\operatorname{tr}\\sigma_z=0"},{"tipo":"uguale","sinistra":"Matrix([[1,0],[0,-1]]).det()","vale":"-1","dove":"esempio","appare":"\\det\\sigma_z=-1"}],"qui":{},"pieno":null};
STRUM["proiettore-ortogonale"] = {"nome":"Proiettore ortogonale","riga":"Un proiettore ortogonale e' un operatore $\\hat P$ che soddisfa due condizioni insieme: $\\hat P^2=\\hat P$ (idempotenza — proiettare due volte equivale a proiettare una volta) e $\\hat P^{\\dagger}=\\hat P$ (autoaggiuntezza, che rende la proiezione perpendicolare al sottospazio invece che obliqua).","serve":"E' il mattone di tutta la teoria della misura: $\\hat P=|\\psi\\rangle\\langle\\psi|$ su un ket normalizzato e' l'osservabile «lo stato e' $|\\psi\\rangle$?» con esiti $1$ e $0$, e il suo valor medio e' la probabilita'. L'identita' si scrive come somma di proiettori, $\\mathbb 1=\\sum_i\\hat P_i$, ed e' con questa che si cambia base e si decompone un'osservabile.","esempio":"Da $|\\psi\\rangle=(\\tfrac35,\\tfrac45)$ normalizzato si costruisce $\\hat P=|\\psi\\rangle\\langle\\psi|$ con entrate $\\tfrac{9}{25},\\tfrac{12}{25},\\tfrac{16}{25}$. L'elemento $(1,1)$ di $\\hat P^2$ vale $(\\tfrac{9}{25})^2+(\\tfrac{12}{25})^2=\\tfrac{9}{25}$, cioe' $\\hat P^2=\\hat P$; la traccia e' $\\tfrac{9}{25}+\\tfrac{16}{25}=1$, come per ogni proiettore di rango uno.","debito":"la decomposizione spettrale di un operatore autoaggiunto con spettro continuo in una famiglia di proiettori $E(\\lambda)$ (la misura spettrale) sta fuori da qui: si usa il caso discreto, dove i proiettori sono $|i\\rangle\\langle i|$.","controllo":[{"tipo":"simbolico","dove":"esempio","appare":"\\hat P^2=\\hat P","perche":"e' l'idempotenza, meta' della definizione di proiettore: un'identita' fra operatori, non un conto numerico. Il caso concreto che la sostiene e' l'entrata $(1,1)$ asserita qui sotto, dove i numeri ci sono"},{"tipo":"uguale","sinistra":"(Rational(9,25))**2+(Rational(12,25))**2","vale":"9/25","dove":"esempio","appare":"(\\tfrac{9}{25})^2+(\\tfrac{12}{25})^2=\\tfrac{9}{25}"},{"tipo":"uguale","sinistra":"Rational(9,25)+Rational(16,25)","vale":"1","dove":"esempio","appare":"\\tfrac{9}{25}+\\tfrac{16}{25}=1"}],"qui":{},"pieno":null};

function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

/* ---------------- 00 · DI COSA PARLA QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Di cosa parla questo movimento', meta:'Meccanica Quantistica · voce Q.2 · perche gli operatori autoaggiunti, e perche la richiesta si spezza in due in dimensione infinita',
  blocchi:[
  {t:'prosa', title:'Una richiesta fisica che diventa una richiesta matematica', tag:'architettura', html:R`
  <p>Il movimento precedente ha costruito <b>la casa</b> — lo spazio di Hilbert — e <b>la grammatica</b> — bra e ket. Questo movimento mette in quella casa i suoi abitanti principali: gli <b>operatori che rappresentano le osservabili</b>, cioè le grandezze che un esperimento misura. La domanda da cui tutto parte è una sola, ed è fisica prima che matematica: <i>quale proprietà deve avere un operatore perché i suoi possibili esiti di misura siano numeri reali?</i></p>
  <p>La risposta è «autoaggiunto», e sembra un dettaglio tecnico. Non lo è. È l&rsquo;unico punto di tutto il corso in cui una richiesta della fisica — quando misuri, leggi sullo strumento un numero reale — si traduce in una richiesta matematica <i>esatta</i> su un operatore. Tutto il resto del formalismo è convenzione comoda; questa è necessità. E c&rsquo;è di più: la richiesta sembra identica a «hermitiano», e in dimensione finita lo è; ma appena lo spazio diventa a dimensione infinita — cioè sempre, per una particella sulla retta — le due cose <b>si separano</b>, e la differenza decide quali grandezze sono osservabili e quali no. L&rsquo;impulso di una particella libera lo è; l&rsquo;impulso della stessa particella confinata su una semiretta non lo è, pur essendo l&rsquo;operatore «lo stesso». Questo è il conto che si paga qui, una volta e per bene, perché il movimento sullo spettro continuo ci tornerà sopra.</p>`},
  {t:'prosa', title:'Due strade per lo stesso oggetto, e la divergenza è il contenuto', tag:'architettura', html:R`
  <p>Come in mq-02, le due grandi fonti fondative <b>non concordano</b>, e di nuovo la loro divergenza non è rumore storico: è esattamente ciò che il programma chiede di capire.</p>
  <p><b>Dirac</b> (1930) procede da fisico. Parte dall&rsquo;equazione agli autovalori di una variabile dinamica, ne ricava tre proprietà, e poi <i>definisce</i> un&rsquo;osservabile come «una variabile dinamica reale i cui autostati formano un insieme completo». Completezza come <b>condizione di misurabilità</b>, non come teorema: se gli autostati non bastano a sviluppare ogni stato, la grandezza semplicemente non è misurabile. E quando gli autovalori riempiono un intervallo, Dirac abbandona senza esitare la finitezza delle norme e dichiara che il suo spazio «è uno spazio più generale di quello di Hilbert».</p>
  <p><b>von Neumann</b> (1932) procede da matematico, e fa l&rsquo;operazione opposta. Per lui l&rsquo;operatore autoaggiunto è il <i>fondamento</i>, non una proprietà da verificare: la meccanica quantistica si fonda sulla risoluzione spettrale degli operatori autoaggiunti. Il problema agli autovalori nella forma ingenua — trovare abbastanza autovettori da formare una base — <i>fallisce</i> in casi perfettamente regolari, e quel fallimento non è una patologia: è la <b>definizione</b> di spettro continuo. Dove Dirac postula la completezza, von Neumann costruisce la famiglia di proiettori che la sostituisce.</p>
  <p>Chi ha ragione? Come in mq-02: Dirac sul fatto e sull&rsquo;audacia, von Neumann sul rigore. La sintesi è il teorema spettrale, e il programma di questo corso — «spettro discreto e continuo, autovettori generalizzati, operatore posizione» — <i>è</i> questa divergenza messa in forma di esame. Non si capisce se non si sa che c&rsquo;è.</p>`},
  {t:'prosa', title:'Come è fatto il movimento', tag:'architettura', html:R`
  <p><b>La rotta.</b> La tappa 01 ricava dalla fisica la condizione sull&rsquo;operatore (valor medio reale ⟹ autoaggiunto) e dimostra che gli autovalori sono reali, seguendo l&rsquo;argomento di Ballentine e quello di Dirac affiancati. La 02 aggiunge l&rsquo;ortogonalità degli autovettori di autovalori distinti e la porta in forma matriciale con l&rsquo;equazione caratteristica di Shankar, su un esempio svolto. La 03 è il cuore: hermitiano contro autoaggiunto, i domini, le estensioni autoaggiunte, e il contro-esempio di Ballentine e von Neumann — l&rsquo;operatore derivata su intervalli diversi — che mostra la stessa formula essere osservabile o no a seconda delle condizioni al bordo. La 04 apre lo spettro: discreto, continuo, misto, e la differenza fra autovettore vero e autovettore generalizzato (la delta), con gli esempi di Griffiths. La 05 tratta la degenerazione e la non unicità della base nell&rsquo;autospazio. La 06 introduce gli operatori unitari e mostra che il cambio di base di mq-02 ne era un caso particolare. La 07 costruisce i proiettori ortogonali come le due metà di una definizione, e la risoluzione spettrale. La 08 porta la traccia, la sua invarianza, e il valor medio. L&rsquo;ultima raccoglie il senso.</p>
  <p><b>Che cosa questo movimento non fa.</b> Non enuncia il postulato della misura nella sua forma completa, non risolve l&rsquo;equazione di Schrödinger, non tratta la teoria rigorosa delle estensioni autoaggiunte (indici di difetto) — che si dichiara e si costeggia. Costruisce lo strumentario con cui le osservabili si manipolano, e la lucidità su quando una manipolazione è lecita.</p>`}
]},

/* ---------------- 01 · LA CONDIZIONE FISICA, E GLI AUTOVALORI REALI ---------------- */
{ num:'01', title:'La condizione fisica, e gli autovalori reali', meta:'il valor medio reale forza l&rsquo;autoaggiuntezza · l&rsquo;osservabile di Dirac · perche gli autovalori di un operatore autoaggiunto sono reali',
  blocchi:[
  {t:'prosa', title:'Dal risultato di una misura alla proprietà dell’operatore', tag:'costruzione', html:R`
  <p>Il punto di partenza è lo stesso di mq-02: una misura dà come esito un numero, e quel numero — la lettura sullo strumento — è <b>reale</b>. La domanda è che cosa questo imponga all&rsquo;operatore $\hat A$ che rappresenta la grandezza. Ballentine dà l&rsquo;argomento nella forma più nuda, nel paragrafo 2.2 «Conditions on Operators», e vale seguirlo perché è il modo in cui una richiesta fisica diventa un&rsquo;equazione.</p>
  <p>Si consideri una grandezza che può valere solo $0$ o $1$ — l&rsquo;osservabile «lo stato è $|u\rangle$?», rappresentata dal proiettore <span class="str" data-str="operatore-aggiunto">$\hat P_u=|u\rangle\langle u|$</span>. Il suo valor medio in uno stato descritto dall&rsquo;operatore $\rho$ è $\langle u|\rho|u\rangle=\operatorname{Tr}(\rho\hat P_u)$. Ora, <i>la media di una grandezza che assume solo valori reali deve essere reale</i>; e se lo imponiamo per ogni vettore $|u\rangle$, un teorema che vedremo fra poco (Ballentine, Teorema 1) costringe l&rsquo;operatore a essere uguale al proprio aggiunto. La stessa catena, applicata a una generica osservabile $\hat R$ con $\rho=|\Psi\rangle\langle\Psi|$, dà $\langle\Psi|\hat R|\Psi\rangle$ reale per ogni $|\Psi\rangle$, dunque $\hat R=\hat R^{\dagger}$.</p>
  <p>Ballentine è onesto sul fatto che questo argomento «ha meno sostanza di quanta sembri avere» — usare numeri reali per i valori è in fondo una convenzione, e si potrebbe immaginare una fisica che li codifica altrimenti. Ma la proprietà degli operatori autoaggiunti che serve davvero non è questa: è che <b>hanno autovalori reali e un insieme di autovettori con cui si costruisce lo spettro</b>. È lì che si va.</p>`},
  {t:'reveal', title:'L’osservabile secondo Dirac: completezza come condizione di misura', tag:'costruzione', steps:[
   {label:'L’equazione agli autovalori, e le tre proprietà', body:R`
   <p>Dirac parte dall&rsquo;altra estremità. Nel capitolo sulle variabili dinamiche introduce l&rsquo;equazione</p>
   $$\hat A|\phi\rangle=a|\phi\rangle$$
   <p>e la legge così: «l&rsquo;operatore lineare $\hat A$ applicato al ket $|\phi\rangle$ lo moltiplica semplicemente per un fattore numerico senza cambiarne la direzione». Chiama $a$ un <b>autovalore</b> e $|\phi\rangle$ un <b>autoket</b>. Osserva subito che solo la direzione di $|\phi\rangle$ conta — moltiplicarlo per un numero non nullo non cambia nulla — il che è coerente con lo stato-raggio di mq-02.</p>
   <p>Limitandosi agli operatori <i>reali</i> (il suo nome per gli autoaggiunti), Dirac ricava «tre risultati di grande importanza». Primo: <b>gli autovalori sono tutti reali</b>. Secondo: gli autovalori associati agli autoket coincidono con quelli associati agli autobra. Terzo: l&rsquo;immaginario coniugato di un autoket è un autobra appartenente allo stesso autovalore. È quest&rsquo;ultimo che gli fa dire che ha senso parlare di <i>autostato</i> della variabile dinamica, senza distinguere ket e bra.</p>`},
   {label:'Che cos’è un’osservabile, e il fuoco di Dirac', body:R`
   <p>E qui arriva la definizione, che è il contributo concettuale di Dirac e il punto in cui diverge da von Neumann. Non tutte le variabili dinamiche reali sono misurabili: «quelle i cui autostati non formano un insieme completo non sono quantità misurabili». Da cui, parole sue:</p>
   <p style="padding-left:1.2em;border-left:3px solid rgba(120,160,255,.45)"><i>«Chiameremo osservabile ogni variabile dinamica reale i cui autostati formino un insieme completo. Ogni quantità misurabile risulta così un&rsquo;osservabile.»</i> — Dirac, pag. stampata 49-50</p>
   <p>La <b>completezza degli autostati è la condizione di misurabilità</b>, non un teorema da dimostrare: è il criterio che separa gli operatori che rappresentano qualcosa di fisico da quelli che non lo fanno. Picasso, cinquant&rsquo;anni dopo, dice la stessa cosa al rovescio: parte dalla fisica (autostati, autovalori come esiti) e <i>deduce</i> che l&rsquo;operatore associato è autoaggiunto. Dove Dirac impone la completezza a mano, Picasso la ricava dal postulato di von Neumann sulla misura. Due porte per la stessa stanza.</p>`}
  ]},
  {t:'reveal', title:'Perché gli autovalori sono reali: due dimostrazioni, la stessa idea', tag:'costruzione', steps:[
   {label:'La dimostrazione in tre righe', body:R`
   <p>Sia $\hat A$ autoaggiunto e $\hat A|\phi\rangle=a|\phi\rangle$. Moltiplicando a sinistra per $\langle\phi|$ e usando $\langle\phi|\hat A|\phi\rangle=\langle\phi|\hat A|\phi\rangle^{*}$ (è la definizione di autoaggiunto applicata allo stesso vettore), si ha</p>
   $$a\langle\phi|\phi\rangle=\langle\phi|\hat A|\phi\rangle=\langle\phi|\hat A|\phi\rangle^{*}=a^{*}\langle\phi|\phi\rangle.$$
   <p>Poiché $\langle\phi|\phi\rangle$ non è nullo (un autoket non è il vettore nullo), segue $a=a^{*}$, cioè $a$ reale. È la stessa catena in Dirac, in Ballentine (Teorema 2), in Picasso, in Shankar e in Griffiths: la si incontra in ogni libro perché è la giustificazione, in tre righe, del perché la fisica usa proprio questi operatori.</p>`},
   {label:'Perché serve l’aggiunto, e non basta l’intuizione', body:R`
   <p>Vale notare dove entra l&rsquo;ipotesi. Non si usa che $\hat A$ sia «simmetrico in qualche senso vago»: si usa l&rsquo;uguaglianza esatta $\langle\phi|\hat A|\psi\rangle=\langle\psi|\hat A|\phi\rangle^{*}$ <b>per ogni coppia</b> di vettori, che in dimensione finita è la definizione di matrice hermitiana $M_{ij}=M_{ji}^{*}$. Ballentine la rende ancora più tagliente con il suo Teorema 1: <i>basta</i> che $\langle\psi|\hat A|\psi\rangle$ sia reale per ogni singolo $|\psi\rangle$ — il caso diagonale — per dedurre l&rsquo;uguaglianza completa e quindi $\hat A=\hat A^{\dagger}$. La dimostrazione sceglie $|\psi\rangle=|\phi_1\rangle+|\phi_2\rangle$ e poi $|\psi\rangle=|\phi_1\rangle+i|\phi_2\rangle$, e la seconda scelta — l&rsquo;unità immaginaria — è essenziale: «nessun analogo di questo teorema può esistere per spazi vettoriali reali». È la prima avvisaglia che la struttura complessa dello spazio di Hilbert non è un lusso.</p>`}
  ]},
  {t:'plot', title:'Un operatore hermitiano con entrate complesse ha comunque autovalori reali',
   intro:R`Si prenda la matrice hermitiana $\hat A=\begin{pmatrix}3&i\\-i&1\end{pmatrix}$: è uguale alla trasposta coniugata, $\hat A=\hat A^{\dagger}$. La traccia è $3+1=4$ e il determinante $3\cdot1-i\cdot(-i)=3-1=2$, entrambi reali nonostante le entrate complesse. Gli autovalori risolvono $\lambda^2-4\lambda+2=0$, cioè $\frac{4+\sqrt{8}}{2}=2+\sqrt2$ e $\frac{4-\sqrt{8}}{2}=2-\sqrt2$: due numeri reali. La parabola qui sotto è il polinomio caratteristico, e le sue radici sono gli autovalori.`,
   plots:[
    {kind:'func2d', xr:[-0.5,4.5], yr:[-1.2,3], height:320, ticks:6,
     title:'il polinomio caratteristico e le sue due radici reali',
     curves:[
      {f:'x*x-4*x+2', col:'#4c8dff', width:2.6, label:'p(λ)=λ²−4λ+2'},
      {f:'0', col:'#8a93a6', width:1.2, label:'asse λ'}
     ],
     xlabel:'λ', ylabel:'p(λ)'}
   ],
   leggi:R`<p><b>Che cosa guardare.</b> La parabola taglia l&rsquo;asse in due punti, $2-\sqrt2\approx0{,}59$ e $2+\sqrt2\approx3{,}41$: sono gli autovalori, entrambi reali. Che un&rsquo;entrata della matrice sia $i$ non li sposta nel piano complesso — è l&rsquo;hermitianità ($\hat A=\hat A^{\dagger}$) a inchiodarli sull&rsquo;asse reale. <b>Che cosa impararne.</b> Una matrice generica $2\times2$ con entrate complesse ha autovalori complessi; l&rsquo;hermitianità è precisamente la condizione che li costringe reali, e la figura mostra <i>perché</i> «autovalore reale» significa «radice reale del caratteristico». Il vertice della parabola sta a $\lambda=2$, che è la semisomma delle radici, cioè metà della traccia: traccia e determinante sono reali prima ancora di risolvere, ed è un controllo rapido che una matrice potrebbe essere hermitiana.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Un collega sostiene che ogni matrice con autovalori reali è hermitiana. Vero?`,
    a:R`Falso, e il contro-esempio è istruttivo. La matrice $\begin{pmatrix}2&1\\0&2\end{pmatrix}$ ha autovalore $2$ (doppio), reale, ma non è hermitiana ($M_{12}=1\neq0=\overline{M_{21}}$) — e infatti è <b>difettosa</b>: ha un solo autovettore indipendente, non due, quindi i suoi autovettori non formano una base. L&rsquo;implicazione corretta ha un verso solo: hermitiano ⟹ autovalori reali <i>e</i> autovettori che formano una base ortonormale. Il verso opposto fallisce perché «autovalori reali» non dice nulla sugli autovettori. È per questo che la condizione fisica non è «autovalori reali» ma «autoaggiunto»: serve anche la completezza degli autostati, cioè la seconda metà, quella che Dirac mette nella definizione stessa di osservabile.`},
   {q:R`Nel teorema di Ballentine la premessa ($\langle\psi|\hat A|\psi\rangle$ reale per ogni $\psi$) sembra più debole della conclusione ($\hat A=\hat A^{\dagger}$). Come può il caso diagonale implicare quello generale?`,
    a:R`Perché lo spazio è <b>complesso</b>, e questo dà due equazioni invece di una. Imponendo la realtà di $\langle\psi|\hat A|\psi\rangle$ su $|\psi\rangle=|\phi_1\rangle+|\phi_2\rangle$ si ottiene una relazione fra i termini misti $\langle\phi_1|\hat A|\phi_2\rangle$ e $\langle\phi_2|\hat A|\phi_1\rangle$; imponendola su $|\psi\rangle=|\phi_1\rangle+i|\phi_2\rangle$ se ne ottiene una seconda, <i>indipendente</i> perché l&rsquo;$i$ ruota i termini misti. Due equazioni fissano entrambi i termini e danno $\langle\phi_1|\hat A|\phi_2\rangle=\langle\phi_2|\hat A|\phi_1\rangle^{*}$ per ogni coppia. Su uno spazio reale avremmo solo la prima equazione, e la conclusione cadrebbe: lì esistono operatori con tutti i valor medi diagonali reali che non sono simmetrici. È la ragione profonda per cui la meccanica quantistica vive su un campo complesso — non per comodità di calcolo, ma perché solo lì «valor medio reale» e «autoaggiunto» sono la stessa condizione.`}
  ]}
]},

/* ---------------- 02 · AUTOVETTORI ORTOGONALI, E L'EQUAZIONE CARATTERISTICA ---------------- */
{ num:'02', title:'Autovettori ortogonali, e l’equazione caratteristica', meta:'autovalori distinti danno autovettori ortogonali · il problema agli autovalori per via matriciale · un esempio svolto fino in fondo',
  blocchi:[
  {t:'prosa', title:'La seconda proprietà: autovalori distinti, autovettori ortogonali', tag:'costruzione', html:R`
  <p>Un operatore autoaggiunto non dà solo autovalori reali: dà autovettori che, quando appartengono ad autovalori <i>diversi</i>, sono automaticamente <b>ortogonali</b>. È la proprietà che rende possibile usare gli autovettori come base, e quindi leggere le probabilità come moduli quadri di componenti — tutto l&rsquo;impianto di mq-02.</p>
  <p>La dimostrazione è di nuovo corta e identica in tutte le fonti. Siano $\hat A|\phi_1\rangle=a_1|\phi_1\rangle$ e $\hat A|\phi_2\rangle=a_2|\phi_2\rangle$, con $\hat A$ autoaggiunto. Dalla definizione $\langle\phi_1|\hat A|\phi_2\rangle=\langle\phi_2|\hat A|\phi_1\rangle^{*}$ e dalla realtà degli autovalori si ottiene, sottraendo, $(a_1-a_2)\langle\phi_2|\phi_1\rangle=0$. Se $a_1\neq a_2$ il primo fattore non si annulla, quindi $\langle\phi_2|\phi_1\rangle=0$. Dirac la chiama «teorema di ortogonalità» e la usa per dire che «due stati per i quali una misura dà con certezza due risultati diversi sono fra loro ortogonali» — la lettura fisica dell&rsquo;ortogonalità.</p>
  <p>Resta scoperto il caso $a_1=a_2$: lì la dimostrazione tace, e per una buona ragione — due autovettori dello <i>stesso</i> autovalore non devono essere ortogonali. È la degenerazione, argomento della tappa 05. Per ora teniamo il caso non degenere, dove gli autovettori di un&rsquo;osservabile formano una base ortonormale e si possono normalizzare a $\langle\phi_i|\phi_j\rangle=\delta_{ij}$.</p>`},
  {t:'reveal', title:'Il problema agli autovalori in pratica: l’equazione caratteristica', tag:'costruzione', steps:[
   {label:'Da operatore a matrice a polinomio', body:R`
   <p>In dimensione finita trovare autovalori e autovettori è un algoritmo, e Shankar lo espone con cura. Si scrive l&rsquo;equazione come $(\hat A-\lambda\mathbb 1)|\phi\rangle=0$: perché esista un $|\phi\rangle$ non nullo, l&rsquo;operatore $(\hat A-\lambda\mathbb 1)$ non può essere invertibile, cioè</p>
   $$\det(\hat A-\lambda\mathbb 1)=0.$$
   <p>Proiettando su una base ortonormale questo diventa l&rsquo;annullarsi del determinante di una matrice, e l&rsquo;espansione dà un <b>polinomio caratteristico</b> di grado $N$ in $\lambda$. Shankar nota il punto che rende il metodo robusto: «gli autovalori, che sono le sue radici, sono indipendenti dalla base, perché definiti dall&rsquo;equazione astratta che non fa riferimento ad alcuna base». Un polinomio di grado $N$ ha $N$ radici (nel campo complesso, contate con molteplicità): quindi ogni operatore in dimensione $N$ ha $N$ autovalori — ma, avverte Shankar, <i>non</i> necessariamente $N$ autovettori indipendenti, a meno che non sia hermitiano o unitario.</p>`},
   {label:'Un esempio svolto: la matrice reale simmetrica', body:R`
   <p>Si prenda $\hat A=\begin{pmatrix}2&1\\1&2\end{pmatrix}$, hermitiana (reale e simmetrica). La traccia è $2+2=4$, il determinante $2\cdot2-1\cdot1=3$. Il caratteristico è $\lambda^2-4\lambda+3=0$, e le radici sono $\frac{4+2}{2}=3$ e $\frac{4-2}{2}=1$. Entrambe reali, come deve essere. Si verifica al volo che la somma delle radici $3+1=4$ è la traccia e il prodotto $3\cdot1=3$ è il determinante: due controlli che non costano nulla e prendono quasi ogni errore di conto.</p>
   <p>Per l&rsquo;autovalore $3$ l&rsquo;autovettore risolve $(2-3)x+y=0$, cioè $y=x$: la direzione $(1,1)$, normalizzata $\tfrac1{\sqrt2}(1,1)$. Per l&rsquo;autovalore $1$: $(2-1)x+y=0$, cioè $y=-x$, la direzione $(1,-1)$. Il loro prodotto scalare è $1\cdot1+1\cdot(-1)=0$: ortogonali, come garantito dal teorema, perché gli autovalori $3$ e $1$ sono distinti. Non abbiamo dovuto <i>imporre</i> l&rsquo;ortogonalità: è venuta da sola dall&rsquo;hermitianità.</p>`}
  ]},
  {t:'plot', title:'Due autovettori ortogonali, due direzioni fissate dall’operatore',
   intro:R`La matrice $\begin{pmatrix}2&1\\1&2\end{pmatrix}$ agisce sul piano. Le due rette disegnate sono le direzioni che essa <i>non ruota</i>, solo riscala: la direzione $(1,1)$, allungata di un fattore $3$, e la direzione $(1,-1)$, lasciata di fattore $1$. Sono perpendicolari, e la perpendicolarità non è un caso: è il teorema di ortogonalità in forma geometrica.`,
   plots:[
    {kind:'func2d', xr:[-3,3], yr:[-3,3], height:340, ticks:6,
     title:'le due direzioni proprie, perpendicolari',
     curves:[
      {f:'x', col:'#4c8dff', width:2.6, label:'autovettore (1,1), autovalore 3'},
      {f:'-x', col:'#ff8a5c', width:2.6, label:'autovettore (1,−1), autovalore 1'}
     ],
     xlabel:'prima componente', ylabel:'seconda componente'}
   ],
   leggi:R`<p><b>Che cosa guardare.</b> Un vettore sulla retta blu, applicato $\hat A$, resta sulla retta blu (triplicato); uno sulla retta arancio resta sulla retta arancio (invariato). Qualunque altro vettore viene <i>ruotato</i> verso la retta blu, perché l&rsquo;autovalore più grande domina. Le due rette formano un angolo retto. <b>Che cosa impararne.</b> Diagonalizzare un operatore hermitiano significa trovare queste direzioni perpendicolari: nella base $\{(1,1),(1,-1)\}/\sqrt2$ la matrice diventa $\operatorname{diag}(3,1)$. La perpendicolarità garantisce che la base sia ortonormale senza ritocchi, ed è ciò che permette di leggere le componenti come ampiezze e i loro moduli quadri come probabilità. Se la matrice non fosse stata simmetrica, le due direzioni proprie potrebbero esistere ma non essere perpendicolari — e allora la base non sarebbe ortonormale.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Il polinomio caratteristico ha grado $N$ e quindi $N$ radici: perché allora un operatore $N\times N$ può avere meno di $N$ autovettori indipendenti?`,
    a:R`Perché «$N$ radici» conta gli autovalori con molteplicità, non gli autovettori. Quando una radice si ripete (autovalore degenere) la teoria <i>non</i> garantisce che le righe indipendenti del sistema $(\hat A-\lambda\mathbb 1)\phi=0$ siano tante quanto la molteplicità. Per un operatore <b>hermitiano o unitario</b> lo sono sempre — il teorema di diagonalizzabilità assicura un autospazio di dimensione pari alla molteplicità — ma per un operatore generico no: la matrice $\begin{pmatrix}3&1\\0&3\end{pmatrix}$ ha $\lambda=3$ doppio e un solo autovettore. Questa è la differenza fra molteplicità <i>algebrica</i> (quante volte la radice compare nel polinomio) e <i>geometrica</i> (la dimensione dell&rsquo;autospazio): per gli hermitiani coincidono sempre, ed è esattamente la proprietà che li rende adatti a rappresentare osservabili.`},
   {q:R`Perché conviene calcolare traccia e determinante <i>prima</i> di risolvere il caratteristico?`,
    a:R`Perché sono la somma e il prodotto degli autovalori, e danno un controllo immediato. Per una matrice $2\times2$ con traccia $t$ e determinante $d$ il caratteristico è esattamente $\lambda^2-t\lambda+d=0$: non serve nemmeno espandere il determinante con $\lambda$ dentro, basta leggere $t$ e $d$ dalla matrice di partenza. E una volta trovate le radici, verificare che la loro somma faccia $t$ e il prodotto $d$ prende quasi ogni errore aritmetico. Nell&rsquo;esempio: $3+1=4=\operatorname{tr}$ e $3\cdot1=3=\det$. La traccia e il determinante sono inoltre <b>invarianti per cambio di base</b> (tappa 08), quindi questo controllo non dipende dalla rappresentazione scelta — un&rsquo;ulteriore rete di sicurezza.`}
  ]}
]},

/* ---------------- 03 · HERMITIANO NON E' AUTOAGGIUNTO: I DOMINI ---------------- */
{ num:'03', title:'Hermitiano non è autoaggiunto: i domini, e la stessa formula su quattro spazi', meta:'perche in dimensione infinita la condizione si spezza in due · il dominio denso · la derivata su intervalli diversi · le estensioni autoaggiunte',
  blocchi:[
  {t:'prosa', title:'Dove la definizione si sdoppia', tag:'costruzione', html:R`
  <p>Fin qui &laquo;autoaggiunto&raquo; è stato usato come sinonimo di &laquo;hermitiano&raquo;, e in dimensione finita lo è: una matrice $N\times N$ con $M_{ij}=M_{ji}^{*}$ è definita su tutto lo spazio, la sua aggiunta pure, e non c&rsquo;è niente che le distingua. Ma la definizione completa ha <b>due clausole</b>, e la seconda in dimensione finita è automatica. Ballentine la scrive per intero:</p>
  <p style="padding-left:1.2em;border-left:3px solid rgba(120,160,255,.45)"><i>&laquo;Un operatore $A$ che è uguale al suo aggiunto $A^{\dagger}$ si dice autoaggiunto. Questo significa che soddisfa $\langle\phi|A|\psi\rangle=\langle\psi|A|\phi\rangle^{*}$ <b>e che il dominio di $A$</b> (cioè l&rsquo;insieme dei vettori $\phi$ su cui $A\phi$ è ben definito) <b>coincide con il dominio di $A^{\dagger}$</b>. Un operatore che soddisfa soltanto [la prima] si dice hermitiano.&raquo;</i> &mdash; Ballentine, par. 1.3, pag. stampata 15</p>
  <p>Due operatori possono dunque agire con la stessa formula e non essere lo stesso operatore, se sono definiti su insiemi di vettori diversi. In dimensione finita questa frase è vuota &mdash; il dominio è tutto lo spazio e non c&rsquo;è scelta. In dimensione infinita è il punto su cui gira il corso.</p>
  <p><b>Un disaccordo di terminologia, da dichiarare e non appianare.</b> Ballentine aggiunge in nota che &laquo;gli operatori che chiamiamo <i>hermitiani</i> sono spesso chiamati <i>simmetrici</i> nella letteratura matematica&raquo; e giudica quella terminologia &laquo;discutibile, perché entra in conflitto con le proprietà corrispondenti delle matrici&raquo;. Picasso dice la cosa opposta partendo dallo stesso fatto: poiché il dominio $D_\xi$ è denso, &laquo;il termine corretto sarebbe <i>simmetrico</i>, tuttavia useremo sempre il termine <i>hermitiano</i>, che è quello normalmente usato dai fisici&raquo;. Hanno il medesimo uso e ragioni contrarie: uno difende la parola per analogia con le matrici, l&rsquo;altro la adotta per consuetudine ammettendo che è impropria. Chi legge una fonte matematica deve sapere che &laquo;simmetrico&raquo; è ciò che qui si chiama hermitiano, e che <b>&laquo;autoaggiunto&raquo; è la parola che in entrambe le lingue significa la stessa cosa</b> &mdash; è il motivo per cui conviene usare quella.</p>`},
  {t:'reveal', title:'Da dove salta fuori un dominio: il conto di Picasso', tag:'costruzione', steps:[
   {label:'L’operatore si definisce sulla base, e la serie può divergere', body:R`
   <p>Picasso costruisce l&rsquo;operatore associato a un&rsquo;osservabile nel modo più diretto possibile: lo <i>definisce</i> sugli autovettori. Scelta una base di autovettori $|\xi_i\rangle$ dell&rsquo;osservabile $\xi$, si pone $\xi_{\rm op}|\xi_i\rangle\equiv\xi_i|\xi_i\rangle$ e si estende per linearità alle combinazioni finite. Finché le combinazioni sono finite non c&rsquo;è nessun problema. Il problema nasce al passo successivo &mdash; estendere alle combinazioni <i>infinite</i>, che sono la maggioranza dei vettori di $\mathcal H$ &mdash; e Picasso lo mostra calcolando la norma del risultato:</p>
   $$\Big\|\sum_{i=1}^{n}a_i\xi_i|\xi_i\rangle\Big\|^{2}=\sum_{i=1}^{n}\xi_i^{2}|a_i|^{2}.$$
   <p>Il vettore di partenza $|A\rangle=\sum a_i|\xi_i\rangle$ sta in <span class="str" data-str="spazio-di-hilbert">$\mathcal H$</span> perché $\sum|a_i|^{2}<\infty$. Ma la serie che conta è un&rsquo;altra: $\sum\xi_i^{2}|a_i|^{2}$, con gli autovalori dentro. Se gli autovalori crescono, quella serie può divergere mentre la prima converge &mdash; e allora $\xi_{\rm op}|A\rangle$ <b>non è un vettore di $\mathcal H$</b>. L&rsquo;operatore non si può definire su tutto lo spazio.</p>
   <p>Quello che resta è il <b>dominio</b>: l&rsquo;insieme $D_\xi$ dei vettori per cui $\sum\xi_i^{2}|a_i|^{2}<\infty$. Non è un sottoinsieme sparuto &mdash; contiene tutte le combinazioni finite, e quindi è <b>denso</b> in $\mathcal H$: ogni vettore dello spazio è limite di vettori del dominio. Questa è l&rsquo;unica cosa che salva il formalismo, e si scrive $\overline{D_\xi}=\mathcal H$.</p>`},
   {label:'Quando il dominio è tutto, e perché in fisica non succede mai', body:R`
   <p>C&rsquo;è un caso in cui il problema non esiste: se gli autovalori sono <b>limitati</b>, $|\xi_i|<M$ per ogni $i$, allora $\sum\xi_i^{2}|a_i|^{2}<M^{2}\sum|a_i|^{2}<\infty$ sempre, e l&rsquo;operatore è definito su tutto $\mathcal H$. Si chiama <b>operatore limitato</b>, e per i limitati &laquo;hermitiano&raquo; e &laquo;autoaggiunto&raquo; coincidono di nuovo, come in dimensione finita.</p>
   <p>Qui Picasso fa un&rsquo;osservazione che vale più di un teorema, e che è il motivo per cui questo paragrafo non è matematica fine a sé stessa:</p>
   <p style="padding-left:1.2em;border-left:3px solid rgba(120,160,255,.45)"><i>&laquo;In principio si dovrebbe affermare che dal punto di vista fisico tutte le osservabili sono rappresentate da operatori limitati ($|\xi_i|<M$ per ogni $i$), poiché nessuno strumento può dare risultati &ldquo;grandi quanto si vuole&rdquo;: la scala di uno strumento è sempre limitata sia dall&rsquo;alto che dal basso. La sola ragione per cui, in pratica, non possiamo dimenticare totalmente i problemi di dominio sta nel fatto che quasi tutti gli operatori associati alle osservabili $f(q,p)$ presenteranno uno spettro non limitato [&hellip;] la radice dei problemi di dominio sta nella schematizzazione matematica, non nella fisica.&raquo;</i> &mdash; Picasso, par. 4.6</p>
   <p>È una posizione precisa e discutibile, e Picasso la dichiara come tale: i domini sono il prezzo di aver idealizzato uno strumento reale (una scala con un fondo e un cielo) in un operatore con spettro illimitato. Si paga quel prezzo perché l&rsquo;idealizzazione rende i conti possibili &mdash; ma chi dimentica il prezzo poi si stupisce che l&rsquo;impulso di una particella su una semiretta non sia un&rsquo;osservabile. Tanto netta è la posizione che Picasso <b>si rifiuta di definire l&rsquo;aggiunto per gli operatori non limitati</b>: &laquo;coerentemente con l&rsquo;affermazione appena fatta che non vogliamo essere sopraffatti dai problemi di dominio, nel caso di operatori non limitati non diamo né la definizione di operatore aggiunto né quella di operatore autoaggiunto&raquo;. Dimostra che $\xi_{\rm op}$ è <i>hermitiano</i>, e si ferma lì. Per vedere che cosa si perde fermandosi lì, serve l&rsquo;esempio che segue.</p>`}
  ]},
  {t:'reveal', title:'Lo stesso simbolo, quattro operatori: la derivata su spazi diversi', tag:'costruzione', steps:[
   {label:'Il termine di bordo, e la condizione che impone', body:R`
   <p>Si prenda l&rsquo;operatore più innocuo che si possa scrivere: $D=-i\,d/dx$ sulle funzioni derivabili in $a\le x\le b$, con $a$ e $b$ eventualmente infiniti. Per identificarne l&rsquo;<span class="str" data-str="operatore-aggiunto">aggiunto</span> si impone la definizione, che qui è un integrale, e si integra per parti:</p>
   $$\int_a^b\phi^{*}(x)\,D^{\dagger}\psi(x)\,dx=\Big[\int_a^b\psi^{*}(x)\,D\phi(x)\,dx\Big]^{*}=\int_a^b\phi^{*}(x)\,D\psi(x)\,dx+i\big[\psi(x)\phi^{*}(x)\big]_a^b.$$
   <p>L&rsquo;ultimo termine è il <b>termine di bordo</b>, e tutto dipende da lui: se le condizioni al contorno lo annullano, allora $D^{\dagger}$ agisce come $D$ e l&rsquo;operatore è hermitiano; se non lo annullano, non lo è. Ballentine scrive esattamente questo e nota, con una parola scelta, che in quel caso $D$ sarà <i>apparentemente</i> hermitiano &mdash; l&rsquo;avverbio anticipa che non basterà.</p>
   <p>Von Neumann aveva fatto lo stesso conto nel 1932 sull&rsquo;operatore $\frac{\hbar}{i}\frac{\partial}{\partial q}$, e vale guardare la sua versione perché lui non si ferma al termine di bordo: lo <i>risolve</i>. Trova</p>
   $$(A'f,g)-(f,A'g)=\frac{\hbar}{i}\big[f(q)\overline{g(q)}\big]_a^b=\frac{\hbar}{i}\big[f(b)\overline{g(b)}-f(a)\overline{g(a)}\big]$$
   <p>e osserva che per annullarlo il dominio va limitato &laquo;in modo tale che per due $f,g$ scelte arbitrariamente in esso valga $f(a)\overline{g(a)}=f(b)\overline{g(b)}$&raquo;, cioè $f(a):f(b)=\overline{g(b)}:\overline{g(a)}$. Poi la mossa: &laquo;se facciamo variare $f$ a $g$ fissata, vediamo che $f(a):f(b)$ deve essere lo <b>stesso numero</b>&raquo; per tutte le funzioni del dominio. Non una condizione per funzione: <b>un unico numero</b>, fissato una volta per tutte, che è un parametro libero del problema. Su $-\infty<q<+\infty$ il termine si annulla da sé e la questione non si pone; su un intervallo finito, quel numero va scelto, e scegliendolo si scelgono operatori diversi.</p>`},
   {label:'I quattro spazi, uno per uno', body:R`
   <p>L&rsquo;equazione agli autovalori è la stessa in tutti i casi, ed è un&rsquo;equazione differenziale che si risolve subito: $-i\frac{d}{dx}e^{i\lambda x}=\lambda e^{i\lambda x}$, quindi $\phi(x)=c\,e^{i\lambda x}$ con $c$ costante. Ma &mdash; e qui sta tutto &mdash; di quelle soluzioni interessano <i>solo quelle che stanno nello spazio vettoriale scelto</i>. Ballentine elenca quattro scelte.</p>
   <p><b>$V_1$ &middot; nessuna condizione al contorno.</b> Ogni $\lambda$ complesso è autovalore: $e^{i\lambda x}$ è derivabile qualunque sia $\lambda$. Ma senza condizioni il termine di bordo non si annulla, quindi $D$ non è hermitiano e il caso &laquo;non ha ulteriore interesse&raquo; &mdash; autovalori complessi, nessuna osservabile.</p>
   <p><b>$V_2$ &middot; tutta la retta, $|\phi(x)|$ limitata per $|x|\to\infty$.</b> Autovalori: tutti i $\lambda$ <b>reali</b>, perché $e^{i\lambda x}$ è limitata esattamente quando $\lambda$ è reale. Le autofunzioni non sono normalizzabili &mdash; $\int|e^{i\lambda x}|^{2}dx$ diverge &mdash; ma formano un insieme completo &laquo;nel senso che una funzione arbitraria può essere rappresentata come un integrale di Fourier, che si può riguardare come una combinazione lineare <i>continua</i> delle autofunzioni&raquo;. Spettro continuo, autofunzioni fuori dallo spazio di Hilbert.</p>
   <p><b>$V_3$ &middot; il segmento $[-L/2,+L/2]$ con condizioni periodiche $\phi(-L/2)=\phi(L/2)$.</b> La condizione richiede $e^{i\lambda L}=1$, cioè $\lambda_n=2\pi n/L$ con $n$ intero di segno qualunque: uno spettro <b>discreto</b>, una scala di gradini equispaziati. Le autofunzioni $\frac{1}{\sqrt L}e^{2\pi inx/L}$ formano un insieme ortonormale completo, e la completezza è il teorema delle serie di Fourier: la normalizzazione si legge da $\int_{-L/2}^{L/2}\frac{1}{L}\,dx=1$ e l&rsquo;ortogonalità si vede su un caso, $\int_{-1/2}^{1/2}e^{2\pi ix}e^{-4\pi ix}\,dx=0$.</p>
   <p><b>$V_4$ &middot; tutta la retta, $\phi(x)\to0$ per $x\to\pm\infty$.</b> Qui il termine di bordo si annulla, quindi $D$ <i>è</i> hermitiano &mdash; e <b>non ha nessuna autofunzione in quello spazio</b>, perché $e^{i\lambda x}$ non tende a zero per nessun $\lambda$ reale, e per $\lambda$ complesso esplode da un lato. Un operatore hermitiano, perfettamente rispettabile, con spettro vuoto.</p>
   <p>Ballentine tira la conclusione in una riga: &laquo;questi esempi bastano a mostrare che un operatore hermitiano in uno spazio a dimensione infinita <b>può avere o non avere</b> un insieme completo di autovettori, a seconda della natura precisa dell&rsquo;operatore <i>e dello spazio vettoriale</i>&raquo;. La formula $-i\,d/dx$, da sola, non identifica un operatore: identifica una regola di calcolo. L&rsquo;operatore è la regola <i>più</i> il dominio.</p>`},
   {label:'Le estensioni autoaggiunte, e perché sono infinite', body:R`
   <p>Resta la domanda che von Neumann si pone e Ballentine lascia stare: dato un operatore hermitiano definito su un dominio troppo piccolo, lo si può <i>allargare</i> fino a renderlo autoaggiunto? E in quanti modi?</p>
   <p>Von Neumann lavora sull&rsquo;intervallo $[0,1]$ e costruisce una famiglia di operatori, uno per ogni fase $\alpha$: il dominio del membro $\alpha$ contiene $e^{i\alpha q}$, cioè fissa pari a $e^{i\alpha}$ il rapporto fra i valori al bordo. Poi dimostra che due di questi non hanno nessuna estensione hermitiana comune, calcolando</p>
   $$(A'e^{i\alpha q},e^{i\gamma q})-(e^{i\alpha q},A'e^{i\gamma q})=i(\alpha-\gamma)\int_0^1e^{i(\alpha-\gamma)q}\,dq=e^{i(\alpha-\gamma)}-1\neq0$$
   <p>per $\alpha\neq\gamma$: gli operatori sono genuinamente diversi. La conclusione, parole sue: &laquo;il processo di estensione è <b>infinitamente multivoco</b>, poiché ciascun [membro della famiglia] può essere usato e ciascuno produce un&rsquo;altra soluzione del problema agli autovalori. (Si tratta sempre di uno spettro puramente discreto, ma esso <i>dipende</i> da $\alpha$: $\lambda_k=h\left(\frac{\alpha}{2\pi}+k\right)$, $k=0,\pm1,\pm2,\dots$)&raquo;.</p>
   <p>Von Neumann dà anche il nome alla proprietà che separa i buoni dai cattivi: un operatore che non ammette estensioni proprie &mdash; &laquo;già definito in tutti i punti in cui potrebbe essere definito in modo ragionevole, cioè senza violare la sua natura hermitiana&raquo; &mdash; lo chiama <b>massimale</b>. E dimostra che &laquo;risoluzioni dell&rsquo;identità possono appartenere soltanto a operatori massimali&raquo;: se l&rsquo;operatore si può ancora allargare, il suo problema agli autovalori non ha <i>una</i> soluzione, ne ha tante quante le estensioni. La parola moderna per &laquo;massimale e hermitiano&raquo; è <i>autoaggiunto</i>, e il teorema di von Neumann è il motivo per cui la seconda clausola di Ballentine non è un cavillo: senza di essa non c&rsquo;è <i>uno</i> spettro di cui parlare. Von Neumann avverte però che l&rsquo;esistenza non è garantita nemmeno così: &laquo;a un dato operatore hermitiano massimale appartiene nessuna o esattamente una risoluzione dell&rsquo;identità, e la prima situazione talvolta si verifica; cioè il problema agli autovalori è certamente unico, ma sotto certe condizioni è insolubile&raquo;.</p>
   <p><b>Che cosa significa in fisica.</b> L&rsquo;impulso di una particella confinata in un segmento non è un&rsquo;osservabile, è una <b>famiglia a un parametro</b> di osservabili, e il parametro $\alpha$ non è matematica: è la condizione al bordo, cioè che cosa fa la particella quando arriva all&rsquo;estremo. Lo spettro $\lambda_k=h(\alpha/2\pi+k)$ dice che i valori misurabili dell&rsquo;impulso <i>slittano</i> al variare di quella scelta, restando equispaziati. Due laboratori che confinano la stessa particella con bordi fisicamente diversi misurano insiemi di valori diversi &mdash; e la teoria glielo dice in anticipo.</p>`}
  ]},
  {t:'plot', title:'Lo spettro che slitta: una famiglia di operatori, non un operatore',
   intro:R`Ogni retta è un livello $\lambda_k=h(\alpha/2\pi+k)$ della famiglia di von Neumann, in unità $h=1$, al variare della fase al bordo $\alpha$ fra $0$ e $2\pi$. Fissare $\alpha$ significa tagliare la figura con una verticale: i punti d&rsquo;intersezione sono lo spettro di <i>quel</i> membro della famiglia.`,
   plots:[
    {kind:'func2d', xr:[0,6.3], yr:[-2.2,3.2], height:360, ticks:7,
     title:'i livelli della derivata sul segmento, al variare della condizione al bordo',
     curves:[
      {f:'x/(2*3.141592653589793)-2', col:'#8a93a6', width:1.8, label:'k=−2'},
      {f:'x/(2*3.141592653589793)-1', col:'#5c9cff', width:2.0, label:'k=−1'},
      {f:'x/(2*3.141592653589793)', col:'#4c8dff', width:2.6, label:'k=0'},
      {f:'x/(2*3.141592653589793)+1', col:'#ff8a5c', width:2.0, label:'k=1'},
      {f:'x/(2*3.141592653589793)+2', col:'#ffb45c', width:1.8, label:'k=2'}
     ],
     xlabel:'fase al bordo α', ylabel:'autovalore λ (unità h)'}
   ],
   leggi:R`<p><b>Che cosa guardare.</b> A $\alpha=0$ (condizioni periodiche) gli autovalori sono gli interi: è il caso $V_3$ di Ballentine. Spostando $\alpha$ verso destra tutta la scala sale rigidamente, e a $\alpha=2\pi$ è tornata su sé stessa con $k$ traslato di uno &mdash; cioè la famiglia è periodica in $\alpha$, e due fasi che differiscono di $2\pi$ danno lo <i>stesso</i> operatore. La distanza fra due righe consecutive non cambia mai: resta $h$. <b>Che cosa impararne.</b> La figura è il contro-esempio reso visivo: se &laquo;la derivata sul segmento&raquo; identificasse un operatore, ci sarebbe una sola riga orizzontale di valori possibili. Ce n&rsquo;è invece un fascio, e scegliere il dominio significa scegliere la verticale su cui leggere. Si vede anche perché nessuna misura può distinguere $\alpha$ da $\alpha+2\pi$ &mdash; e perché, al contrario, $\alpha=0$ e $\alpha=\pi$ danno spettri che non hanno <i>nessun</i> valore in comune: con $\alpha=\pi$ i livelli stanno a $\pm\tfrac12,\pm\tfrac32,\dots$, tutti semidispari. Fisicamente: cambiare la condizione al bordo non cambia la <i>spaziatura</i> dei livelli, cambia la loro <i>origine</i>.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Se &laquo;hermitiano&raquo; e &laquo;autoaggiunto&raquo; coincidono per gli operatori limitati, e in fisica (dice Picasso) gli strumenti sono limitati, perché non si lascia perdere la distinzione?`,
    a:R`Perché gli operatori che si <i>scrivono</i> non sono limitati, anche se gli strumenti lo sono. Posizione, impulso, energia cinetica hanno spettro illimitato per costruzione &mdash; $q$ va su tutta la retta, $p$ pure, $p^{2}/2m$ cresce senza tetto &mdash; e sono proprio quelli con cui si fanno i conti. Picasso è esplicito: la radice del problema sta nella schematizzazione, non nella fisica. Ma il prezzo di quella schematizzazione è reale e si paga in conti sbagliati, non in filosofia: l&rsquo;impulso sul segmento ha spettri <i>diversi</i> secondo il dominio, e chi ignora la distinzione non ha modo di sapere quale dei fasci di livelli stia usando. La distinzione non serve a essere rigorosi: serve a sapere di quale operatore si stanno calcolando gli autovalori.`},
   {q:R`Nel caso $V_4$ l&rsquo;operatore è hermitiano e non ha autofunzioni; nel caso $V_2$ ha come autovalori tutti i reali. Ma $V_4$ è <i>contenuto</i> in $V_2$ (le funzioni che tendono a zero sono limitate). Come può un sottoinsieme avere meno autovettori di zero?`,
    a:R`Non ha &laquo;meno di zero&raquo;: ne ha zero, e $V_2$ ne ha infiniti, ed è coerente perché gli autovettori di $V_2$ <b>non appartengono a $V_4$</b>. Le $e^{i\lambda x}$ sono limitate (stanno in $V_2$) ma non tendono a zero (non stanno in $V_4$): restringendo lo spazio si sono buttati via esattamente i vettori che risolvevano l&rsquo;equazione. È la lezione del contro-esempio nella sua forma più nuda: la domanda &laquo;$\hat A$ ha autovettori?&raquo; non ha senso senza specificare <i>dove</i> li si cerca, perché l&rsquo;equazione agli autovalori è un vincolo su una funzione, e appartenere allo spazio è un secondo vincolo indipendente. Si noti che $V_4$ non è patologico né artificiale: contiene tutte le funzioni d&rsquo;onda normalizzabili che decadono, cioè gli stati fisici di una particella libera.`}
  ]}
]},

/* ---------------- 04 · LO SPETTRO: DISCRETO, CONTINUO, MISTO ---------------- */
{ num:'04', title:'Lo spettro: discreto, continuo, misto, e l’autovettore che non c’è', meta:'il fallimento del problema agli autovalori come definizione · autovettore vero e generalizzato · il teorema spettrale di Stieltjes · impulso e posizione',
  blocchi:[
  {t:'prosa', title:'Un operatore autoaggiunto senza nemmeno un autovettore', tag:'costruzione', html:R`
  <p>Il contro-esempio della derivata mostrava che un operatore hermitiano <i>può</i> non avere autovettori. Ma lì si poteva sospettare che la colpa fosse della scelta un po&rsquo; artificiosa dello spazio. L&rsquo;esempio che segue chiude quella via di fuga, perché l&rsquo;operatore è il più semplice immaginabile e lo spazio è quello naturale.</p>
  <p>Nello spazio $L^{2}(a,b)$ delle funzioni a quadrato sommabile sull&rsquo;intervallo, si consideri l&rsquo;operatore che <b>moltiplica per la variabile</b>: $f(x)\mapsto x\,f(x)$. È autoaggiunto &mdash; verificarlo è immediato, perché moltiplicare per un numero reale commuta col prodotto scalare e non produce termini di bordo. E non ha <b>nessun</b> autovettore. Picasso lo liquida in una parentesi, ed è la parentesi più importante del capitolo: l&rsquo;equazione $x\,f(x)=\lambda f(x)$ si riscrive $(x-\lambda)f(x)=0$, e poiché $x-\lambda$ si annulla in un solo punto, questa impone $f(x)=0$ per ogni $x\neq\lambda$ &mdash; cioè, come elemento di $L^{2}$, $f\sim0$. E il vettore nullo non è un autovettore.</p>
  <p>Si confronti con la dimensione finita: lì il polinomio caratteristico ha sempre almeno una radice, a quella radice corrisponde sempre almeno un autovettore, e un operatore senza autovettori non esiste. Ballentine dice perché l&rsquo;argomento non si trasporta: &laquo;se si lascia $N$ diventare infinito, $\det|M-\lambda I|=0$ diventa una serie di potenze infinita in $\lambda$, che <i>non deve necessariamente possedere radici</i>, anche se converge. (In realtà il determinante di una matrice a dimensione infinita è indefinibile, tranne in casi speciali.)&raquo; Il metodo che in dimensione finita <i>è</i> il problema agli autovalori, in dimensione infinita non esiste nemmeno come enunciato.</p>`},
  {t:'reveal', title:'Von Neumann: il fallimento non è una patologia, è la definizione', tag:'costruzione', steps:[
   {label:'Che cosa significa esattamente «spettro continuo»', body:R`
   <p>Von Neumann affronta la cosa di petto e ne ricava una definizione, che è il contributo che regge tutta la teoria moderna. Il problema agli autovalori &laquo;nel senso della meccanica quantistica&raquo;, dice, richiederebbe di trovare abbastanza soluzioni $\psi_1,\psi_2,\dots$ di $H\psi=\lambda\psi$ da formarne un insieme ortonormale <b>completo</b>. Poi constata che &laquo;questo non è possibile in generale&raquo;, e porta l&rsquo;esempio dell&rsquo;atomo di idrogeno di Schrödinger, dove una parte delle soluzioni necessarie a sviluppare ogni funzione d&rsquo;onda ha integrale del modulo quadro infinito: &laquo;dunque non appartiene allo spazio di Hilbert. Quindi non c&rsquo;è un insieme ortonormale completo di soluzioni nello spazio di Hilbert&raquo;.</p>
   <p>E poi la mossa:</p>
   <p style="padding-left:1.2em;border-left:3px solid rgba(120,160,255,.45)"><i>&laquo;Se ciò si verifica, cioè se l&rsquo;insieme ortonormale scelto fra le soluzioni di E non è completo, allora possiamo dire che esiste uno &ldquo;spettro continuo di $H$&rdquo;. ($\lambda_1,\lambda_2,\dots$ formano lo spettro &ldquo;puntuale&rdquo; o &ldquo;discreto&rdquo; di $H$.)&raquo;</i> &mdash; von Neumann, pag. stampata 68</p>
   <p>Non si <i>spiega</i> il fallimento, non lo si <i>aggira</i>: lo si battezza. Lo <span class="str" data-str="spettro">spettro</span> continuo <b>è</b> il modo in cui il problema agli autovalori non si risolve, e chiamarlo così trasforma un ostacolo in un oggetto. Von Neumann aggiunge, da matematico onesto, che &laquo;la teoria di Hilbert del problema agli autovalori mostra che questo fenomeno non rappresenta in alcun modo un&rsquo;eccezione al comportamento degli operatori, nemmeno di quelli continui&raquo; &mdash; cioè: è il caso generico, non il caso strano.</p>`},
   {label:'La definizione che sostituisce gli autovettori', body:R`
   <p>Avendo rinunciato agli autovettori, von Neumann deve dire dove sta lo spettro, e lo fa con la famiglia di proiettori $E(\lambda)$. La definizione è di una concisione che vale citare, perché è esattamente quella dei testi di oggi:</p>
   <p style="padding-left:1.2em;border-left:3px solid rgba(120,160,255,.45)"><i>&laquo;Le discontinuità di $E(\lambda)$ sono note come lo spettro discreto di $A$. Sono gli stessi $\lambda$ per i quali $Af=\lambda f$, $f\neq0$ è risolubile. [&hellip;] <b>Tutti i punti nell&rsquo;intorno dei quali $E(\lambda)$ non è costante formano lo spettro di $A$.</b>&raquo;</i> &mdash; von Neumann, pag. stampata 80</p>
   <p>Si guardi che cosa ha fatto. &laquo;Autovalore&raquo; era una proprietà di un&rsquo;<i>equazione</i> (esiste un vettore che&hellip;); &laquo;punto dello spettro&raquo; è una proprietà di una <b>funzione crescente</b>: $\lambda$ sta nello spettro se $E$ cresce intorno a $\lambda$. I salti di $E$ sono gli autovalori veri; i tratti di crescita continua sono lo spettro continuo; i tratti costanti sono il complementare, dove non c&rsquo;è niente. La stessa definizione copre i tre casi senza distinguerli, e questo è il motivo per cui funziona anche quando una delle due descrizioni non è disponibile. Von Neumann dimostra anche, con un argomento di ortogonalità, che i $\lambda$ dello spettro discreto &laquo;formano al più una successione&raquo;: gli autovalori veri sono sempre numerabili, mai un continuo.</p>`}
  ]},
  {t:'reveal', title:'Il teorema spettrale, e l’integrale che somma sui salti', tag:'costruzione', steps:[
   {label:'Perché serve un integrale di Stieltjes', body:R`
   <p>Si vuole una formula che ricostruisca l&rsquo;operatore dai suoi autovalori e che funzioni <i>sia</i> quando lo spettro è una scala di gradini <i>sia</i> quando è un continuo. La somma $\hat A=\sum_a a\,P(a)$ fa il primo caso e non il secondo; l&rsquo;integrale $\int a\,\rho(a)\,da$ fa il secondo e non il primo. L&rsquo;oggetto che fa entrambi è l&rsquo;<b>integrale di Stieltjes</b>, definito da</p>
   $$\int_a^b g(x)\,d\sigma(x)=\lim_{n\to\infty}\sum_{k=1}^{n}g(x_k)\big[\sigma(x_k)-\sigma(x_{k-1})\big],$$
   <p>dove $\sigma$ è una funzione non decrescente detta <b>misura</b>. Se $\sigma(x)=x$ si ritrova Riemann; se $\sigma$ è derivabile si ritrova $\int g(x)\frac{d\sigma}{dx}dx$. La generalizzazione diventa non banale, dice Ballentine, &laquo;solo quando si permette a $\sigma(x)$ di essere discontinua&raquo;: con $\sigma(x)=h\,\theta(x-c)$ il solo termine della somma che contribuisce è quello con $x_{k-1}<c<x_k$, e l&rsquo;integrale vale $h\,g(c)$. Un <i>salto</i> della misura produce un termine di <i>somma</i>. È il meccanismo che fa convivere i due casi in una formula.</p>`},
   {label:'L’enunciato, e i due esempi che lo verificano', body:R`
   <p><b>Teorema spettrale</b> (Ballentine, Teorema 4). A ogni operatore autoaggiunto $\hat A$ corrisponde un&rsquo;unica famiglia di <span class="str" data-str="proiettore-ortogonale">proiettori</span> $E(\lambda)$, $\lambda$ reale, tale che: <i>(i)</i> se $\lambda_1<\lambda_2$ allora $E(\lambda_1)E(\lambda_2)=E(\lambda_2)E(\lambda_1)=E(\lambda_1)$ &mdash; informalmente, $E(\lambda)$ proietta sul sottospazio degli autovalori minori o uguali a $\lambda$; <i>(ii)</i> $E(\lambda+\varepsilon)|\psi\rangle\to E(\lambda)|\psi\rangle$ per $\varepsilon\to0$; <i>(iii)</i> $E(\lambda)|\psi\rangle\to0$ per $\lambda\to-\infty$; <i>(iv)</i> $E(\lambda)|\psi\rangle\to|\psi\rangle$ per $\lambda\to+\infty$; <i>(v)</i> e la formula che conta,</p>
   $$\int_{-\infty}^{+\infty}\lambda\,dE(\lambda)=\hat A.$$
   <p>Le proprietà (iii) e (iv) dicono che la famiglia parte da niente e arriva a tutto; la (ii) che è continua da destra. Von Neumann le enumera nello stesso ordine e avverte di un punto tecnico che vale ricordare: &laquo;l&rsquo;espressione $H=\int\lambda\,dE(\lambda)$ è priva di significato, poiché l&rsquo;integrale di Stieltjes è definito per numeri e non per operatori&raquo;. La si legge come abbreviazione formale di $(Hf,g)=\int\lambda\,(dE(\lambda)f,g)$, che è un&rsquo;uguaglianza fra numeri. È la stessa prudenza che gli fa distinguere hermitiano da autoaggiunto.</p>
   <p><b>Caso discreto.</b> Qui $E(\lambda)=\sum_i|\phi_i\rangle\langle\phi_i|\theta(\lambda-a_i)$ è una scala: salta di $|\phi_i\rangle\langle\phi_i|$ ogni volta che $\lambda$ supera un autovalore, ed è costante fra due autovalori consecutivi. Il contributo di un salto è esattamente il termine della somma, perché $\int_{-\infty}^{+\infty}\lambda\,\delta(\lambda-a)\,d\lambda=a$ &mdash; l&rsquo;integrale di Stieltjes su un gradino restituisce il valore nel punto del salto, e la (v) si riduce a $\hat A=\sum_a a\,P(a)$.</p>
   <p><b>Caso continuo.</b> Si prenda l&rsquo;operatore posizione, $Q\psi(x)=x\psi(x)$: quello che non ha autovettori. I suoi proiettori si scrivono comunque, e sono il troncamento a sinistra: $E(\lambda)\psi(x)=\theta(\lambda-x)\psi(x)$, cioè la funzione tenuta per $x<\lambda$ e azzerata per $x>\lambda$. Si verifica la (v) direttamente, ricordando che $\lambda$ è la variabile d&rsquo;integrazione e $x$ una costante: poiché $\frac{d}{d\lambda}\theta(\lambda-x)=\delta(\lambda-x)$, l&rsquo;integrale $\int\lambda\,d[\theta(\lambda-x)\psi(x)]$ raccoglie il valore $\lambda=x$ e dà $x\,\psi(x)=Q\psi(x)$. L&rsquo;operatore è ricostruito per intero <b>senza che esista un solo autovettore</b>, e questa è la ragione per cui il teorema spettrale sostituisce la diagonalizzazione invece di estenderla.</p>`}
  ]},
  {t:'plot', title:'La misura spettrale: dove cresce E(λ), là c’è spettro',
   intro:R`Le due curve sono due famiglie $E(\lambda)$, lette come numeri su un vettore fissato. La blu è una scala: cresce per salti in $\lambda=-1$, $\lambda=0$ e $\lambda=2$, e resta piatta altrove. L&rsquo;arancio cresce senza salti su tutto l&rsquo;intervallo da $-1$ a $2$. Le proprietà <i>(iii)</i> e <i>(iv)</i> del teorema impongono che entrambe partano da zero e arrivino a uno.`,
   plots:[
    {kind:'func2d', xr:[-3,4], yr:[-0.15,1.25], height:340, ticks:7,
     title:'spettro discreto (scala) e spettro continuo (rampa)',
     curves:[
      {f:'(x>-1)*0.4+(x>0)*0.35+(x>2)*0.25', col:'#4c8dff', width:2.6, label:'E(λ) discreto: tre salti'},
      {f:'(x>=-1)*(x<=2)*((x+1)/3)+(x>2)*1', col:'#ff8a5c', width:2.6, label:'E(λ) continuo: una rampa'},
      {f:'1', col:'#8a93a6', width:1.0, label:'livello 1'}
     ],
     xlabel:'λ', ylabel:'valor medio di E(λ) sullo stato'}
   ],
   leggi:R`<p><b>Che cosa guardare.</b> Sulla curva blu lo spettro è fatto dei tre punti dove la scala salta: $-1$, $0$, $2$. L&rsquo;altezza di ciascun salto è il peso di quell&rsquo;autovalore nello stato &mdash; $0{,}40$, $0{,}35$, $0{,}25$ &mdash; e la somma dei salti fa uno, che è la conservazione della probabilità. Fra i salti la curva è piatta: lì non c&rsquo;è spettro, e non c&rsquo;è niente da misurare. Sulla curva arancio non c&rsquo;è <i>nessun</i> salto, quindi nessun autovalore vero; ma la curva cresce su tutto l&rsquo;intervallo, e per la definizione di von Neumann l&rsquo;intero intervallo è spettro. <b>Che cosa impararne.</b> La figura è la ragione per cui conviene definire lo spettro con $E$ invece che con l&rsquo;equazione agli autovalori: le due curve sono lo stesso tipo di oggetto &mdash; monotone, da zero a uno &mdash; e un solo criterio (&laquo;dove non è costante&raquo;) le legge entrambe. Si vede anche cos&rsquo;è uno spettro <b>misto</b>: basta una curva che salta in un punto e poi sale in rampa, e la fisica ne è piena &mdash; i livelli legati dell&rsquo;idrogeno sono i salti, il continuo di ionizzazione è la rampa. Infine, la pendenza della rampa è la densità: dove $E$ sale più ripida, quell&rsquo;intervallo di valori è più probabile.</p>`},
  {t:'prosa', title:'Dirac dall’altra parte: lo spazio si allarga, e la norma diventa infinita', tag:'costruzione', html:R`
  <p>Dirac arriva allo stesso punto dalla direzione opposta, e il confronto è istruttivo perché nessuno dei due è &laquo;il modo corretto&raquo;: sono due prezzi diversi pagati per lo stesso oggetto. Dirac vuole tenere gli autovettori. Per tenerli, è costretto a buttare via lo spazio di Hilbert.</p>
  <p>Il conto che lo costringe è questo. Se $|X\rangle$ e $|Y\rangle$ si scrivono come integrali di autoket di un&rsquo;osservabile $\xi$ i cui autovalori riempiono un intervallo, il teorema di ortogonalità dice che l&rsquo;integrando $\langle\xi'_x|\xi''_y\rangle$ è nullo in tutto l&rsquo;intervallo d&rsquo;integrazione tranne nel punto $\xi''=\xi'$. Se in quel punto fosse <i>finito</i>, l&rsquo;integrale sarebbe nullo, e dunque $\langle X|Y\rangle$ sarebbe nullo per ogni coppia &mdash; che è falso. Dirac conclude che il prodotto scalare di due autoket coincidenti &laquo;deve essere <b>infinitamente grande</b> per poter rendere finita e diversa da zero&raquo; l&rsquo;espressione. Ponendo $|Y\rangle=|X\rangle$: la norma di un autovettore dello spettro continuo è infinita.</p>
  <p>E allora, con una frase che è il manifesto del suo metodo:</p>
  <p style="padding-left:1.2em;border-left:3px solid rgba(120,160,255,.45)"><i>&laquo;Lo spazio dei vettori bra o ket, nel caso in cui essi abbiano lunghezze finite e prodotti scalari pure finiti, è chiamato dai matematici spazio di Hilbert. I vettori bra e ket da noi ora adoperati formano uno spazio più generale di quello di Hilbert.&raquo;</i> &mdash; Dirac, pag. stampata 54</p>
  <p>Non è un&rsquo;ammissione di sconfitta, è una decisione: se l&rsquo;oggetto fisico richiede vettori di norma infinita, si cambia spazio. Nella stessa pagina Dirac dà anche la forma generale della condizione di osservabile per lo spettro misto &mdash; ogni ket si scrive come un <b>integrale più una somma</b> di autoket, l&rsquo;integrale sull&rsquo;intervallo continuo e la somma sui valori discreti fuori di esso &mdash; e dimostra che quella scrittura è <i>unica</i>, purché non vi siano nella somma due termini relativi allo stesso autovalore.</p>
  <p>La divergenza con von Neumann, in una riga: von Neumann tiene lo spazio e perde gli autovettori; Dirac tiene gli autovettori e perde lo spazio. Il formalismo che si usa oggi fa entrambe le cose e dichiara quale sta usando &mdash; ed è per questo che bisogna conoscerle entrambe. Ballentine lo dice senza girarci intorno: &laquo;la formulazione di Dirac non entra nella teoria matematica dello spazio di Hilbert, che ammette solo vettori di norma finita&raquo;, e aggiunge che il proiettore $E(\lambda)=\int_{-\infty}^{\lambda}|q\rangle\langle q|\,dq$ è ben definito nello spazio di Hilbert <i>mentre la sua derivata</i> $dE(q)/dq=|q\rangle\langle q|$ non lo è. La derivata di un oggetto buono non è un oggetto buono: è esattamente lì che sta la differenza.</p>`},
  {t:'reveal', title:'Impulso e posizione: gli autovettori generalizzati al lavoro', tag:'esempio', steps:[
   {label:'L’impulso, e l’ortonormalità alla Dirac', body:R`
   <p>Griffiths svolge i due casi concreti che servono, ed è la fonte da aprire qui perché non scantona né nel rigore né nell&rsquo;euristica: fa il conto e dichiara che cosa non torna. L&rsquo;autofunzione dell&rsquo;impulso risolve $-i\hbar\frac{d}{dx}f_p(x)=p\,f_p(x)$, dunque $f_p(x)=A\,e^{ipx/\hbar}$. Non è a quadrato sommabile per <i>nessun</i> valore complesso di $p$: &laquo;l&rsquo;operatore impulso non ha autofunzioni nello spazio di Hilbert&raquo;. Ma restringendosi agli autovalori reali si recupera &laquo;una specie di ortonormalità surrogata&raquo;:</p>
   $$\langle f_{p'}|f_p\rangle=|A|^{2}\!\!\int_{-\infty}^{+\infty}\!\!e^{i(p-p')x/\hbar}dx=|A|^{2}\,2\pi\hbar\,\delta(p-p'),$$
   <p>e scegliendo $A=1/\sqrt{2\pi\hbar}$ si ottiene $\langle f_{p'}|f_p\rangle=\delta(p-p')$ &mdash; che Griffiths battezza <b>ortonormalità alla Dirac</b>, notando che &laquo;gli indici sono ora variabili continue, e la delta di Kronecker è diventata una <span class="str" data-str="delta-di-dirac">delta di Dirac</span>, ma per il resto ha esattamente lo stesso aspetto&raquo;. La completezza diventa un integrale, e l&rsquo;espansione $f(x)=\frac{1}{\sqrt{2\pi\hbar}}\int c(p)\,e^{ipx/\hbar}dp$ &laquo;non è altro che una trasformata di Fourier&raquo;. Il trucco di Fourier per estrarre i coefficienti funziona identico: $\langle f_{p'}|f\rangle=\int c(p)\delta(p-p')dp=c(p')$.</p>
