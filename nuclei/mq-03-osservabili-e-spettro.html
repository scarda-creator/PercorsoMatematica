   <p>In nota, Griffiths chiude il cerchio con una distinzione che molti libri saltano: che ne è delle autofunzioni con autovalore <i>non</i> reale? &laquo;Non sono semplicemente non normalizzabili: esplodono a $\pm\infty$&raquo;. Le funzioni dei &laquo;sobborghi&raquo; dello spazio di Hilbert &mdash; l&rsquo;area metropolitana, scrive, si chiama a volte <i>rigged Hilbert space</i>, e cita Ballentine per nome &mdash; hanno la proprietà che, pur non avendo prodotto scalare finito con sé stesse, <i>ammettono</i> prodotto scalare con tutti i membri dello spazio di Hilbert; e questo per le autofunzioni di $p$ con autovalore immaginario è falso. Da cui la frase esatta: &laquo;in questo senso ogni numero complesso è autovalore dell&rsquo;operatore $p$, ma solo i numeri reali sono autovalori dell&rsquo;operatore <b>hermitiano</b> $p$ &mdash; gli altri cadono fuori dallo spazio su cui $p$ è hermitiano&raquo;. L&rsquo;hermitianità non è una proprietà della formula: è una proprietà della coppia formula-dominio, di nuovo.</p>`},
   {label:'La posizione, e il senso di una delta come autovettore', body:R`
   <p>Per la posizione la domanda di Griffiths è la più diretta che si possa fare: &laquo;quale funzione di $x$ ha la proprietà che moltiplicarla per $x$ equivale a moltiplicarla per la costante $y$?&raquo;. Ovviamente deve essere nulla dappertutto tranne nel punto $x=y$; e &laquo;infatti non è altro che la funzione delta di Dirac&raquo;, $g_y(x)=A\,\delta(x-y)$. Anche qui l&rsquo;autovalore è costretto reale, le autofunzioni non sono a quadrato sommabile, e vale l&rsquo;ortonormalità alla Dirac: con $A=1$ si ha $\langle g_{y'}|g_y\rangle=\delta(y-y')$. La completezza è immediata, $f(x)=\int c(y)\,\delta(x-y)\,dy$ con $c(y)=f(y)$ &mdash; &laquo;banale in questo caso, ma la si può ottenere dal trucco di Fourier se si insiste&raquo;.</p>
   <p>Vale notare che questo è lo <i>stesso</i> operatore di cui Picasso ha dimostrato che non ha autovettori e di cui Ballentine ha costruito i proiettori: si sta guardando una cosa sola da tre posizioni. Picasso guarda dentro $L^{2}$ e conclude correttamente che non c&rsquo;è niente; Ballentine rinuncia a cercare e costruisce $E(\lambda)$, che esiste; Griffiths esce da $L^{2}$ e trova $\delta(x-y)$, che è &laquo;un autovettore&raquo; nel senso allargato. <b>Nessuna delle tre risposte contraddice le altre</b>, e tenerle tutte e tre è ciò che permette di leggere qualunque libro senza restare sorpresi. Il nome moderno di questa distinzione è <i>autovettore vero</i> contro <i>autovettore generalizzato</i>: il primo sta nello spazio, il secondo no, e il secondo è utile perché ammette prodotto scalare con tutto ciò che sta nello spazio.</p>
   <p>Griffiths chiude con l&rsquo;assioma che Dirac aveva postulato e lui dichiara come restrizione: &laquo;le autofunzioni di un operatore osservabile sono <b>complete</b>: ogni funzione (nello spazio di Hilbert) può essere espressa come combinazione lineare di esse&raquo;. E ammette l&rsquo;imbarazzo di chiamarlo assioma: &laquo;è un po&rsquo; goffo chiamare &ldquo;assioma&rdquo; qualcosa che in certi casi è dimostrabile, ma non conosco un modo migliore di trattarlo&raquo;. Picasso lo tratta diversamente &mdash; <i>postula</i> che ogni operatore autoaggiunto a spettro puramente discreto sia associato a un&rsquo;osservabile, e poi mostra che gli spettri misti si guadagnano il nome come &laquo;limiti&raquo; di quelli discreti, con l&rsquo;esempio dell&rsquo;energia dell&rsquo;atomo di idrogeno: &laquo;ci sono i livelli energetici, che costituiscono la componente discreta dello spettro, e c&rsquo;è il continuo degli stati di ionizzazione&raquo;, e sono &laquo;casi limite di osservabili <i>bona fide</i>, come quei concetti limite così frequenti nella fisica: punto materiale, velocità istantanea&raquo;. Tre autori, tre modi di mettere in conto la stessa lacuna, e nessuno che la nasconda.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Se l&rsquo;operatore posizione non ha autovettori, in che senso &laquo;la misura di posizione dà il valore $x_0$&raquo; ha un significato?`,
    a:R`Nel senso che dà il valore <i>in un intervallo</i>, e il formalismo lo dice con precisione. Il proiettore $E(\lambda)$ dell&rsquo;operatore posizione tronca la funzione d&rsquo;onda a $x<\lambda$, quindi la differenza $E(b)-E(a)$ proietta sul sottospazio &laquo;la particella sta fra $a$ e $b$&raquo;, e il suo valor medio nello stato è $\int_a^b|\psi|^{2}dx$: un numero fra zero e uno, perfettamente definito, senza bisogno di nessun autovettore. La probabilità di trovare la particella in un <i>punto</i> è invece zero, come per qualunque variabile continua &mdash; ed è coerente col fatto che l&rsquo;autovettore relativo a quel punto non esiste. Griffiths lo dice nella sua interpretazione statistica generalizzata: per spettro continuo si assegna $|c(z)|^{2}dz$, una densità, non un peso. Il &laquo;collasso in $\delta(x-x_0)$&raquo; è un&rsquo;idealizzazione utile che corrisponde, nella sua nota, a &laquo;un intervallo stretto attorno al valore misurato, a seconda della precisione dello strumento&raquo;.`},
   {q:R`Lo spettro continuo nasce dalla dimensione infinita. Ma $L^{2}(a,b)$ su un intervallo <i>finito</i> è anch&rsquo;esso a dimensione infinita, e lì la derivata con condizioni periodiche ha spettro discreto. Che cosa decide fra i due?`,
    a:R`Decide se le autofunzioni candidate <b>appartengono</b> allo spazio, e su un intervallo finito appartengono quasi sempre. Le $e^{i\lambda x}$ sul segmento sono a quadrato sommabile per ogni $\lambda$ &mdash; l&rsquo;intervallo è corto e non c&rsquo;è niente che diverga: la condizione al bordo seleziona allora un insieme <i>numerabile</i> di $\lambda$, e lo spettro è discreto. Sulla retta intera le stesse funzioni non sono più sommabili per nessun $\lambda$, non c&rsquo;è nessuna condizione al bordo che selezioni, e tutti i $\lambda$ reali passano: spettro continuo. Il meccanismo generale è questo: la condizione al contorno è un <i>vincolo discreto</i> che quantizza, e un dominio infinito è un dominio dove quel vincolo non c&rsquo;è. È lo stesso motivo per cui una corda di chitarra ha armoniche e il mare no &mdash; e la stessa ragione per cui l&rsquo;idrogeno ha livelli discreti sotto la soglia di ionizzazione (dove la funzione d&rsquo;onda <i>deve</i> decadere) e un continuo sopra (dove non deve).`}
  ]}
]},

/* ---------------- 05 · LA DEGENERAZIONE: L'AUTOSPAZIO, E LA BASE CHE NON E' UNICA ---------------- */
{ num:'05', title:'La degenerazione: l’autospazio, e la base che non è unica', meta:'dove tace la dimostrazione di ortogonalità · il proiettore sull’autospazio di Ballentine · perché due basi diverse rappresentano lo stesso fatto fisico',
  blocchi:[
  {t:'prosa', title:'Il buco lasciato aperto nella tappa 02', tag:'costruzione', html:R`
  <p>La dimostrazione di ortogonalità della tappa 02 partiva da $(a_1-a_2)\langle\phi_2|\phi_1\rangle=0$ e concludeva dividendo per $a_1-a_2$. Quella divisione è illegittima esattamente quando $a_1=a_2$: non è un dettaglio tecnico rimandabile, è il caso che la fisica incontra più spesso di quanto i libri introduttivi lascino credere — il momento angolare orbitale, l&rsquo;energia dell&rsquo;oscillatore armonico isotropo in più dimensioni, lo spettro dell&rsquo;idrogeno rispetto a $\ell$ e $m$. Shankar lo dice senza girarci intorno: &laquo;che la dimostrazione di ortogonalità fallisca per $\omega_i=\omega_j$ non deve sorprendere, perché due vettori etichettati da un autovalore degenere possono essere una qualunque coppia di membri dello spazio degenere, che non devono necessariamente essere ortogonali&raquo;. Il teorema tace; non vuol dire che non ci sia niente da dire, vuol dire che bisogna dirlo con uno strumento diverso.</p>`},
  {t:'reveal', title:'L’autospazio, e il proiettore che lo rappresenta', tag:'costruzione', steps:[
   {label:'Che cos’è un autospazio', body:R`
   <p>Quando $a_1=a_2=a$, l&rsquo;insieme di <i>tutti</i> i vettori $|\phi\rangle$ che risolvono $\hat A|\phi\rangle=a|\phi\rangle$ non è più una singola retta: è un sottospazio, chiamato <b>autospazio</b> di $\hat A$ relativo all&rsquo;autovalore $a$, e la sua dimensione è il <b>grado di degenerazione</b> di $a$. Ballentine lo scrive nella forma che userà per il resto del capitolo: se l&rsquo;operatore ha autovalori ripetuti, si raccolgono tutti gli autovettori con lo stesso $a_i$ in un unico proiettore,</p>
   $$P(a)=\sum_i|\phi_i\rangle\langle\phi_i|\,\delta_{a,a_i},\qquad \hat A=\sum_a a\,P(a),$$
   <p>dove la somma su $i$ corre su <i>tutta</i> la base ortonormale e il delta di Kronecker seleziona solo gli indici con quell&rsquo;autovalore. $P(a)$ proietta esattamente sull&rsquo;autospazio, qualunque sia la sua dimensione — e questa è la generalizzazione di $\hat A=\sum_i a_i|\phi_i\rangle\langle\phi_i|$ (tappa 02) al caso in cui più di un indice $i$ condivide lo stesso $a_i$. È il punto da cui la tappa 07 ripartirà per la risoluzione spettrale completa.</p>`},
   {label:'Un esempio che si porta dietro fino alla fine del movimento', body:R`
   <p>Si prenda l&rsquo;operatore (hermitiano, verificabile a vista) $\hat A=\begin{pmatrix}2&0&0\\0&3&1\\0&1&3\end{pmatrix}$. È a blocchi: il primo autovalore si legge subito, $2$, e il blocco $2\times2$ restante ha traccia $3+3=6$ e determinante $3\cdot3-1\cdot1=8$, quindi autovalori $\frac{6\pm\sqrt{36-32}}{2}=\frac{6\pm2}{2}=4,2$. Il polinomio caratteristico completo è</p>
   $$\det(\hat A-\lambda\mathbb 1)=(2-\lambda)\big[(3-\lambda)^2-1\big]=(2-\lambda)^2(4-\lambda),$$
   <p>e l&rsquo;autovalore $2$ compare <b>due volte</b>: è degenere, con grado di degenerazione $2$; l&rsquo;autovalore $4$ è semplice. Risolvendo $(\hat A-2\mathbb 1)|\phi\rangle=0$ si trova che la prima riga si annulla identicamente (il blocco $2\times2$ meno $2\mathbb 1$ ha solo la seconda e terza riga) e restano i vettori $(x,y,-y)$ per $x,y$ arbitrari: un <b>piano</b>, non una retta. Due scelte ortonormali comode sono $|\phi_1\rangle=(1,0,0)$ e $|\phi_2\rangle=\tfrac1{\sqrt2}(0,1,-1)$; per $\lambda=4$ si trova invece la retta $|\phi_3\rangle=\tfrac1{\sqrt2}(0,1,1)$, non degenere.</p>`}
  ]},
  {t:'reveal', title:'La base non è unica, ma il proiettore sì', tag:'costruzione', steps:[
   {label:'Ruotare dentro il piano degenere', body:R`
   <p>Shankar fa l&rsquo;osservazione che è il cuore di questa tappa: oltre a $|\phi_1\rangle,|\phi_2\rangle$ esiste &laquo;un&rsquo;infinità di coppie ortonormali $|\phi_1'\rangle,|\phi_2'\rangle$, ottenute per rotazione rigida di $|\phi_1\rangle,|\phi_2\rangle$, fra le quali si può scegliere qualunque coppia nel costruire la base propria&raquo;. Si verifichi: per un angolo $\theta$ qualunque,</p>
   $$|f_1\rangle=\cos\theta\,|\phi_1\rangle+\sin\theta\,|\phi_2\rangle,\qquad |f_2\rangle=-\sin\theta\,|\phi_1\rangle+\cos\theta\,|\phi_2\rangle$$
   <p>restano autovettori di $\hat A$ con lo stesso autovalore $2$ (combinazione lineare di autovettori dello stesso autospazio) e restano ortonormali, perché $\langle f_1|f_1\rangle=\cos^2\theta+\sin^2\theta=1$ per ogni $\theta$. <b>Nessuna misura di $\hat A$ può distinguere la base $\{\phi_1,\phi_2\}$ dalla base $\{f_1,f_2\}$</b>: entrambe diagonalizzano l&rsquo;operatore con lo stesso autovalore, ed è qui che la degenerazione smette di essere un tecnicismo — dice che l&rsquo;operatore da solo non seleziona una base nell&rsquo;autospazio, e che se la fisica ne vuole una (per esempio $\ell,m$ invece di una combinazione qualunque) serve un <b>secondo</b> operatore, compatibile col primo, che tolga quella libertà. È esattamente il tema di mq-02 sugli insiemi completi di osservabili compatibili, e la degenerazione è la ragione per cui quel tema serve davvero.</p>`},
   {label:'Che cosa resta fisso: il proiettore, non i suoi vettori', body:R`
   <p>Il punto che la rotazione rende visibile è che $P(2)=|\phi_1\rangle\langle\phi_1|+|\phi_2\rangle\langle\phi_2|$ e $P'(2)=|f_1\rangle\langle f_1|+|f_2\rangle\langle f_2|$ sono <b>lo stesso operatore</b>, anche se i vettori con cui li si è scritti sono diversi. La componente $(2,2)$ di $P(2)$, calcolata con $|\phi_1\rangle,|\phi_2\rangle$, è $0^2+\big(\tfrac1{\sqrt2}\big)^2=\tfrac12$; calcolata con $|f_1\rangle,|f_2\rangle$ diventa $\big(\!-\!\tfrac{\sin\theta}{\sqrt2}\big)^2+\big(\!-\!\tfrac{\cos\theta}{\sqrt2}\big)^2=\tfrac{\sin^2\theta}{2}+\tfrac{\cos^2\theta}{2}=\tfrac12$: <b>indipendente da $\theta$</b>. Il proiettore sull&rsquo;autospazio è un oggetto fisico ben definito — &ldquo;la probabilità di trovare il sistema nell&rsquo;autospazio di $a$&rdquo; non dipende da quale base si è scelta per descriverlo; i singoli autovettori che lo compongono sono convenzione di calcolo, usabile ma non osservabile.</p>`}
  ]},
  {t:'plot', title:'Il grafico mostra la degenerazione prima ancora di risolvere l’equazione',
   intro:R`Il polinomio caratteristico di $\hat A$, espanso, è $p(\lambda)=-\lambda^3+8\lambda^2-20\lambda+16$. Le sue radici sono gli autovalori: la curva lo mostra, e mostra anche <i>come</i> le tocca.`,
   plots:[
    {kind:'func2d', xr:[0.5,4.7], yr:[-3,3], height:340, ticks:6,
     title:'il polinomio caratteristico: una radice doppia, una semplice',
     curves:[
      {f:'-x*x*x+8*x*x-20*x+16', col:'#4c8dff', width:2.6, label:'p(λ)=−λ³+8λ²−20λ+16'},
      {f:'0', col:'#8a93a6', width:1.2, label:'asse λ'}
     ],
     xlabel:'λ', ylabel:'p(λ)'}
   ],
   leggi:R`<p><b>Che cosa guardare.</b> A $\lambda=4$ la curva <i>attraversa</i> l&rsquo;asse — è una radice semplice, $p'(4)=-4\ne0$. A $\lambda=2$ la curva <b>tocca</b> l&rsquo;asse senza attraversarlo e riparte dalla stessa parte: è tangente, e si calcola che $p'(2)=0$. Questa è la firma grafica di una radice doppia, ed è visibile <i>prima</i> di risolvere nulla: una tangenza è la degenerazione fatta immagine. <b>Che cosa impararne.</b> Se il polinomio caratteristico di un operatore hermitiano tocca l&rsquo;asse invece di attraversarlo, quell&rsquo;autovalore porta con sé un autospazio di dimensione maggiore di uno — e il grafico lo segnala senza bisogno di conoscere gli autovettori. È lo stesso fatto della tappa 02 (traccia e determinante come controllo rapido) portato un passo oltre: qui il controllo rapido è la <i>forma</i> della curva, non solo il suo valore.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Se il proiettore sull’autospazio è ben definito indipendentemente dalla base, perché preoccuparsi di quale coppia $|\phi_1\rangle,|\phi_2\rangle$ si sceglie?`,
    a:R`Perché la scelta conta per <i>altre</i> domande, anche se non conta per $\hat A$. Se si vuole calcolare il valor medio di un <i>secondo</i> operatore $\hat B$ che non commuta con $\hat A$, o se si vuole etichettare gli stati con numeri quantici fisicamente significativi (il momento angolare lungo un asse, per esempio), la base interna all&rsquo;autospazio smette di essere indifferente: diventa la base che diagonalizza anche $\hat B$ ristretto a quell&rsquo;autospazio. La libertà di ruotare non è un difetto da eliminare, è lo spazio esatto in cui un secondo operatore compatibile può agire per togliere l&rsquo;ambiguità — ed è per questo che si parla di <i>insieme completo</i> di osservabili compatibili, non di un&rsquo;osservabile sola.`},
   {q:R`La tangenza nel grafico sembra un fatto sul polinomio, non sull’operatore. Che relazione c’è davvero?`,
    a:R`La relazione è diretta: il polinomio caratteristico è $p(\lambda)=\det(\hat A-\lambda\mathbb 1)$, e una radice di molteplicità due significa — per un operatore hermitiano, dove la molteplicità algebrica coincide sempre con quella geometrica (tappa 02) — un autospazio di dimensione due. Non è un fatto sul polinomio <i>invece che</i> sull&rsquo;operatore: è lo stesso fatto letto nella rappresentazione algebrica anziché in quella vettoriale. La differenza pratica è che la tangenza si vede a colpo d&rsquo;occhio senza risolvere il sistema lineare, mentre il piano degenere richiede di risolverlo — motivo in più per guardare prima la forma del grafico, come controllo di cosa aspettarsi.`}
  ]}
]},

/* ---------------- 06 · OPERATORI UNITARI, E LA TRASFORMATA DI CAYLEY ---------------- */
{ num:'06', title:'Operatori unitari, e la trasformata di Cayley', meta:'autovalori di modulo uno · il cambio di base che era già un unitario · la mappa di von Neumann dagli autoaggiunti agli unitari',
  blocchi:[
  {t:'prosa', title:'Il terzo tipo di operatore, dopo autoaggiunto e proiettore', tag:'costruzione', html:R`
  <p>Il programma di questo movimento (voce Q.2) nomina esplicitamente gli <b>operatori unitari</b> accanto agli autoaggiunti. Non è un argomento parallelo e indipendente: è lo stesso impianto — autovalori, autovettori, teorema spettrale — applicato a una condizione diversa, $\hat U^{\dagger}\hat U=\hat U\hat U^{\dagger}=\mathbb 1$ al posto di $\hat U=\hat U^{\dagger}$. E il cambio di base della tappa 02, che diagonalizzava $\begin{pmatrix}2&1\\1&2\end{pmatrix}$ nella base $\{(1,1),(1,-1)\}/\sqrt2$, <i>era già</i> un operatore unitario, senza che il nome fosse stato detto.</p>`},
  {t:'reveal', title:'Autovalori di modulo uno, autovettori ortogonali: gli stessi teoremi, un’altra ipotesi', tag:'costruzione', steps:[
   {label:'Che cosa cambia nella dimostrazione', body:R`
   <p>Shankar tratta gli unitari come il caso gemello degli hermitiani, e lo fa alla lettera: <b>Teorema 11</b>, gli autovalori di un operatore unitario sono numeri complessi di modulo unitario; <b>Teorema 12</b>, i suoi autovettori (non degeneri) sono mutuamente ortogonali. Sia $\hat U|u_i\rangle=u_i|u_i\rangle$: prendendo l&rsquo;aggiunto della relazione e usando $\hat U^{\dagger}\hat U=\mathbb 1$ al posto di $\hat A=\hat A^{\dagger}$, la stessa manipolazione che in tappa 01 dava $a=a^{*}$ dà qui $u_i^{*}u_i=1$, cioè $|u_i|=1$: non reale, <b>di modulo uno</b>. È il punto in cui la dimostrazione diverge: l&rsquo;ipotesi diversa produce una conclusione diversa con lo stesso metodo.</p>`},
   {label:'Ogni base ortonormale diagonalizzante è un unitario', body:R`
   <p>Shankar nota il fatto che chiude il cerchio con mq-02: l&rsquo;operatore $\hat U$ che fa passare dalla base originaria $\{|i\rangle\}$ alla base degli autovettori $\{|\omega_i\rangle\}$ di un hermitiano $\hat R$ è &laquo;chiaramente unitario, perché &lsquo;ruota&rsquo; una base ortonormale in un&rsquo;altra&raquo; — le sue colonne contengono le componenti di autovettori ortonormali, che è esattamente la condizione di unitarietà. Da qui il teorema di diagonalizzazione nella sua forma operativa: <i>ogni matrice hermitiana $R$ su $V_n(\mathbb C)$ ammette una matrice unitaria $U$ (costruita con i suoi autovettori) tale che $U^{\dagger}RU$ sia diagonale</i>. Trovare la base che diagonalizza $R$ e risolvere il suo problema agli autovalori sono, letteralmente, lo stesso problema.</p>`}
  ]},
  {t:'reveal', title:'La trasformata di Cayley: da autoaggiunto a unitario, in una formula', tag:'costruzione', steps:[
   {label:'La mappa, e perché funziona', body:R`
   <p>Von Neumann costruisce il ponte esplicito fra le due famiglie. Nota prima il fatto in dimensione finita: una funzione razionale $f(\lambda)$ di una matrice diagonalizzabile conserva gli autovettori e manda gli autovalori $\lambda_i\mapsto f(\lambda_i)$; se $f$ manda l&rsquo;asse reale sulla circonferenza unitaria, allora manda le matrici con autovalori reali (hermitiane) in matrici con autovalori di modulo $1$ (unitarie). La funzione che lo fa è</p>
   $$f(\lambda)=\frac{\lambda-i}{\lambda+i},\qquad U=\frac{A-i\mathbb 1}{A+i\mathbb 1},\qquad A=i\,\frac{\mathbb 1+U}{\mathbb 1-U},$$
   <p>e von Neumann la chiama, dandole il nome che porta ancora oggi, <b>trasformata di Cayley</b>. La seconda formula è l&rsquo;inversa: dato un unitario $U$ (con $1$ non autovalore) si ricostruisce l&rsquo;autoaggiunto $A$ che lo genera. La coppia di formule è una corrispondenza biunivoca fra autoaggiunti e unitari (privati del punto singolare), ed è il motivo per cui in meccanica quantistica &ldquo;simmetria continua&rdquo; (unitaria, per Wigner) e &ldquo;generatore&rdquo; (autoaggiunto, l&rsquo;osservabile conservata) sono facce della stessa trasformazione — il tema che Noether lega alle quantità conservate. Il legame si legge già qui: se $U(t)=e^{-iAt}$ commuta con l'hamiltoniana, allora $A$ è costante nel tempo, perché $\frac{d}{dt}\langle A\rangle=\frac{i}{\hbar}\langle[H,A]\rangle=0$ — la simmetria è l'invarianza di $H$ sotto il gruppo, e la quantità conservata è il suo generatore.</p>`},
   {label:'Un numero, non un operatore: perché il conto numerico convince', body:R`
   <p>Prima di fidarsi della formula su un operatore, vale verificarla dove si può controllare a mano: su un singolo numero reale, trattato come &ldquo;operatore&rdquo; $1\times1$. Con $\lambda=3$ (un autovalore reale qualunque), la trasformata dà</p>
   $$U=\frac{3-i}{3+i}=\frac{(3-i)^2}{(3+i)(3-i)}=\frac{8-6i}{10}=\frac45-\frac35\,i,$$
   <p>e si verifica che $\big(\tfrac45\big)^2+\big(\tfrac35\big)^2=\tfrac{16}{25}+\tfrac9{25}=1$: modulo esattamente uno, come il teorema promette, per un numero che di per sé non aveva nulla di speciale. Il conto generale lo conferma per <i>ogni</i> $\lambda$ reale: $\lambda-i$ e $\lambda+i$ sono l&rsquo;uno il coniugato dell&rsquo;altro (per $\lambda$ reale, il coniugato di $\lambda-i$ è $\lambda+i$), quindi $U\,\overline U=\dfrac{(\lambda-i)(\lambda+i)}{(\lambda+i)(\lambda-i)}=1$ perché numeratore e denominatore sono lo stesso prodotto, scritto in due ordini diversi. E l&rsquo;inversione si verifica altrettanto esplicitamente: sostituendo $U=(\lambda-i)/(\lambda+i)$ nella seconda formula si ritrova esattamente $\lambda$, per ogni $\lambda$ — la coppia di formule è davvero una corrispondenza, non un&rsquo;approssimazione.</p>`}
  ]},
  {t:'plot', title:'La retta reale si avvolge sul cerchio unitario',
   intro:R`Ogni punto $\lambda$ della retta reale (asse orizzontale) va a finire in un punto del cerchio unitario nel piano complesso, tramite $U(\lambda)=(\lambda-i)/(\lambda+i)$. La curva qui sotto mostra la parte reale di $U(\lambda)$ al variare di $\lambda$: parte da $-1$ (per $\lambda\to-\infty$), passa per $0$ a $\lambda=0$, e tende a $1$ per $\lambda\to+\infty$ senza mai uscire dall’intervallo $[-1,1]$ — la traccia, sull’asse reale, del fatto che il punto resta sempre sul cerchio di raggio uno.`,
   plots:[
    {kind:'func2d', xr:[-10,10], yr:[-1.3,1.3], height:320, ticks:8,
     title:'Re[U(λ)] = (λ²−1)/(λ²+1), mai fuori da [−1,1]',
     curves:[
      {f:'(x*x-1)/(x*x+1)', col:'#4c8dff', width:2.6, label:'Re U(λ)'},
      {f:'1', col:'#8a93a6', width:1.0, label:'limite +1'},
      {f:'-1', col:'#8a93a6', width:1.0, label:'limite −1'}
     ],
     xlabel:'λ (autovalore reale)', ylabel:'Re U(λ)'}
   ],
   leggi:R`<p><b>Che cosa guardare.</b> La curva è compresa per sempre fra $-1$ e $1$, e li tocca solo nei limiti $\lambda\to\mp\infty$, mai per un $\lambda$ finito: coerente con $|U(\lambda)|=1$ esattamente, non approssimativamente. A $\lambda=3$ si legge $\mathrm{Re}\,U(3)=(9-1)/(9+1)=8/10=4/5$, lo stesso numero calcolato a mano sopra. <b>Che cosa impararne.</b> L&rsquo;intera retta reale — tutti gli infiniti autovalori possibili di un operatore autoaggiunto — si comprime sul cerchio unitario senza buchi e senza sovrapposizioni (tranne il punto $\lambda=\infty$, che manca all&rsquo;appello e corrisponde a $U=1$): è una mappa <i>biunivoca</i> fra retta e cerchio meno un punto, lo stesso tipo di corrispondenza della proiezione stereografica. La trasformata di Cayley è quella mappa applicata non ai numeri ma agli <i>operatori</i> che li generano.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Perché conviene dimostrare prima il Teorema 11 (autovalori di modulo uno) sul caso numerico $\lambda=3$ invece che direttamente in astratto?`,
    a:R`Perché il caso numerico espone <i>dove</i> entra l&rsquo;ipotesi, nello stesso modo in cui l&rsquo;esempio $\hat A=\begin{pmatrix}3&i\\-i&1\end{pmatrix}$ in tappa 01 esponeva perché servisse l&rsquo;aggiunto e non una nozione vaga di simmetria. Qui si vede concretamente che $|U|^2=1$ non dipende dal valore di $\lambda$ scelto — vale $4/5,3/5$ per $\lambda=3$ tanto quanto per qualunque altro reale — perché la struttura $U=(\lambda-i)/(\lambda+i)$ mette sempre al numeratore e al denominatore una coppia di coniugati. Il conto astratto ripete lo stesso argomento con $\lambda$ lasciato libero; il conto numerico è la prova che l&rsquo;argomento non nasconde un caso speciale.`},
   {q:R`La trasformata di Cayley manda autoaggiunti in unitari. Ma mq-03 ha appena mostrato (tappa 03) che non tutti gli operatori hermitiani sono autoaggiunti: che succede se si prova ad applicarla a uno che non lo è?`,
    a:R`Von Neumann costruisce esattamente questo caso, ed è la ragione per cui introduce la trasformata nel paragrafo sulle estensioni: applicata a un operatore hermitiano ma non massimale (per esempio $-i\,d/dx$ su un dominio con condizioni al bordo non ancora fissate), la trasformata associata non è <i>univocamente</i> definita come operatore unitario su tutto lo spazio — resta un&rsquo;isometria parziale, definita solo dove il termine di bordo si comporta bene. È lo stesso fenomeno della tappa 03 letto nel linguaggio della tappa 06: l&rsquo;ostruzione del dominio non sparisce cambiando rappresentazione, perché la trasformata di Cayley è una corrispondenza fra <i>autoaggiunti</i> e <i>unitari definiti ovunque</i> — un hermitiano non massimale non è né l&rsquo;uno né, tramite Cayley, genera l&rsquo;altro. Risolvere quell&rsquo;ambiguità — scegliere quale estensione autoaggiunta usare — è esattamente scegliere quale trasformata di Cayley (quale condizione al bordo) si vuole.`}
  ]}
]},

/* ---------------- 07 · PROIETTORI ORTOGONALI, E LA RISOLUZIONE SPETTRALE ---------------- */
{ num:'07', title:'Proiettori ortogonali, e la risoluzione spettrale', meta:'P²=P come definizione · il proiettore sull’autospazio ricostruisce l’operatore · lo stesso esempio di tappa 05, chiuso',
  blocchi:[
  {t:'prosa', title:'Un mattone solo, usato ovunque finora senza nominarlo', tag:'costruzione', html:R`
  <p>I proiettori sono già comparsi in ogni tappa precedente senza che il movimento si fermasse a definirli: $\hat P_u=|u\rangle\langle u|$ nella tappa 01 (il valor medio come traccia), $P(a)$ nella tappa 05 (il proiettore sull&rsquo;autospazio degenere), $E(\lambda)$ nella tappa 04 (la famiglia che sostituisce gli autovettori). Questa tappa raccoglie il filo: che cos&rsquo;è esattamente un proiettore, perché l&rsquo;idempotenza $\hat P^2=\hat P$ è <i>la</i> definizione e non una proprietà accessoria, e come l&rsquo;operatore degenere di tappa 05 si ricostruisce per intero dai suoi due proiettori.</p>`},
  {t:'reveal', title:'Dal ket alla proiezione: la definizione, e perché è idempotente', tag:'costruzione', steps:[
   {label:'Il caso più semplice: proiettare su una retta', body:R`
   <p>Picasso lo introduce nel modo più diretto: sia $|v\rangle$ normalizzato, $\langle v|v\rangle=1$; l&rsquo;operatore di proiezione sulla retta generata da $|v\rangle$ si scrive, per ogni $|u\rangle\in\mathcal H$, $\hat P_v|u\rangle=|v\rangle\langle v|u\rangle$, cioè $\hat P_v=|v\rangle\langle v|$. Griffiths lo chiede esplicitamente come esercizio e lo chiama con il nome che è rimasto: &laquo;mostrare che gli operatori di proiezione sono idempotenti: $\hat P^2=\hat P$&raquo;. La dimostrazione è immediata e vale la pena farla perché mostra <i>dove</i> entra la normalizzazione:</p>
   $$\hat P_v^2|u\rangle=|v\rangle\langle v|v\rangle\langle v|u\rangle=|v\rangle\cdot1\cdot\langle v|u\rangle=\hat P_v|u\rangle,$$
   <p>per ogni $|u\rangle$, dunque $\hat P_v^2=\hat P_v$. Se $|v\rangle$ non fosse normalizzato comparirebbe un fattore $\langle v|v\rangle\ne1$ e l&rsquo;idempotenza cadrebbe: è la stessa clausola di normalizzazione che rende $\hat P_v$ hermitiano, $\hat P_v^{\dagger}=(|v\rangle\langle v|)^{\dagger}=|v\rangle\langle v|=\hat P_v$ (tappa 03, la regola per l&rsquo;aggiunto di un prodotto esterno).</p>`},
   {label:'Su un sottospazio: la somma che conta i vettori della base', body:R`
   <p>Se il sottospazio $V$ ha dimensione maggiore di uno, con base ortonormale $|v_i\rangle$, il proiettore si generalizza a $\hat P_V=\sum_i|v_i\rangle\langle v_i|$ (Picasso, eq. 4.24), ed è questa la forma che compare in $P(a)$ di tappa 05. L&rsquo;idempotenza si verifica identica, usando l&rsquo;ortonormalità $\langle v_i|v_j\rangle=\delta_{ij}$ per cancellare i termini incrociati: $\hat P_V^2=\sum_{i,j}|v_i\rangle\langle v_i|v_j\rangle\langle v_j|=\sum_i|v_i\rangle\langle v_i|=\hat P_V$. Quando $V$ è <i>tutto</i> $\mathcal H$ con una base completa, $\hat P_V=\mathbb 1$: è la relazione di completezza, eq. (4.25) di Picasso, e Ballentine la scrive identica in (1.26). Un proiettore interpola fra &ldquo;niente&rdquo; ($\hat P=0$) e &ldquo;tutto&rdquo; ($\hat P=\mathbb 1$): nel mezzo, seleziona esattamente un sottospazio.</p>`}
  ]},
  {t:'reveal', title:'Chiudere l’esempio di tappa 05: l’operatore ricostruito dai suoi due proiettori', tag:'esempio', steps:[
   {label:'I due proiettori scritti per intero', body:R`
   <p>Per l&rsquo;operatore $\hat A=\begin{pmatrix}2&0&0\\0&3&1\\0&1&3\end{pmatrix}$ di tappa 05, con autospazi generati da $|\phi_1\rangle=(1,0,0)$, $|\phi_2\rangle=\tfrac1{\sqrt2}(0,1,-1)$ (autovalore $2$) e $|\phi_3\rangle=\tfrac1{\sqrt2}(0,1,1)$ (autovalore $4$), i due proiettori sono</p>
   $$P(2)=|\phi_1\rangle\langle\phi_1|+|\phi_2\rangle\langle\phi_2|=\begin{pmatrix}1&0&0\\0&\tfrac12&-\tfrac12\\0&-\tfrac12&\tfrac12\end{pmatrix},\qquad P(4)=|\phi_3\rangle\langle\phi_3|=\begin{pmatrix}0&0&0\\0&\tfrac12&\tfrac12\\0&\tfrac12&\tfrac12\end{pmatrix}.$$
   <p>Si controllano le tre proprietà sulla singola entrata $(2,2)$ e $(2,3)$, che bastano perché la struttura delle altre è identica. <b>Idempotenza</b>: l&rsquo;entrata $(2,2)$ di $P(2)^2$ è $\tfrac12\cdot\tfrac12+\big(\!-\!\tfrac12\big)\cdot\big(\!-\!\tfrac12\big)=\tfrac12$, uguale all&rsquo;entrata di partenza. <b>Ortogonalità</b>: l&rsquo;entrata $(2,2)$ di $P(2)P(4)$ è $\tfrac12\cdot\tfrac12+\big(\!-\!\tfrac12\big)\cdot\tfrac12=0$ — i due proiettori si annullano a vicenda, come deve essere per autospazi distinti. <b>Completezza</b>: l&rsquo;entrata $(2,2)$ di $P(2)+P(4)$ è $\tfrac12+\tfrac12=1$, la stessa entrata dell&rsquo;identità: $P(2)+P(4)=\mathbb 1$ su questo spazio a tre dimensioni, perché non resta nessun terzo autospazio da coprire.</p>`},
   {label:'La risoluzione spettrale discreta, verificata entrata per entrata', body:R`
   <p>La formula di Ballentine $\hat A=\sum_a a\,P(a)$ (eq. 1.34) diventa qui $\hat A=2\,P(2)+4\,P(4)$, ed è il momento di verificarla e non solo crederla. Entrata $(2,2)$: $2\cdot\tfrac12+4\cdot\tfrac12=1+2=3$, che è esattamente $\hat A_{22}$. Entrata $(2,3)$: $2\cdot\big(\!-\!\tfrac12\big)+4\cdot\tfrac12=-1+2=1$, esattamente $\hat A_{23}$. L&rsquo;operatore con cui si è aperta la tappa 05 non era un dato arbitrario: era già, implicitamente, la somma pesata dei suoi proiettori — la tappa 05 lo scompone, questa lo ricompone, e il fatto che tornino a coincidere entrata per entrata è il teorema spettrale discreto visto funzionare, non solo enunciato.</p>`}
  ]},
  {t:'plot', title:'La misura spettrale di questo operatore, non di uno generico',
   intro:R`Come in tappa 04, ma ora con i numeri di un operatore scritto per intero: la traccia di un proiettore è la dimensione del sottospazio su cui proietta, quindi $\operatorname{Tr}P(2)=2$ e $\operatorname{Tr}P(4)=1$, su una traccia totale di $3=\dim\mathcal H$. Normalizzando, il salto a $\lambda=2$ pesa $2/3$ e quello a $\lambda=4$ pesa $1/3$, e $2/3+1/3=1$: la misura spettrale di un vettore uniformemente distribuito fra gli autospazi.`,
   plots:[
    {kind:'func2d', xr:[0,5.5], yr:[-0.12,1.2], height:320, ticks:6,
     title:'E(λ) per questo operatore: un salto di peso 2/3, poi uno di peso 1/3',
     curves:[
      {f:'(x>2)*(2/3)+(x>4)*(1/3)', col:'#4c8dff', width:2.6, label:'E(λ), pesi dalla degenerazione'},
      {f:'1', col:'#8a93a6', width:1.0, label:'livello 1'}
     ],
     xlabel:'λ', ylabel:'peso cumulato'}
   ],
   leggi:R`<p><b>Che cosa guardare.</b> Il primo salto, a $\lambda=2$, è il più alto: pesa il doppio del secondo perché il suo autospazio ha dimensione doppia. È la traduzione visiva del grado di degenerazione introdotto in tappa 05 — non un&rsquo;etichetta astratta, ma letteralmente <i>quanto pesa</i> quell&rsquo;autovalore nella risoluzione spettrale. <b>Che cosa impararne.</b> La traccia di un proiettore non è un numero neutro: è il grado di degenerazione dell&rsquo;autovalore corrispondente, e la relazione $\operatorname{Tr}\hat A=\sum_a a\operatorname{Tr}P(a)$ — qui $2\cdot2+4\cdot1=8$, la traccia calcolata direttamente in tappa 05 — è esattamente la tappa 08 anticipata di una riga: la traccia totale si scompone sui pesi degli autospazi, non sui singoli autovettori che si è scelto di usare per scriverli.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Perché l’idempotenza $\hat P^2=\hat P$ si prende come DEFINIZIONE di proiettore, invece di definirlo come «l’operatore $|v\rangle\langle v|$ per un vettore normalizzato»?`,
    a:R`Perché la seconda definizione presuppone già di sapere su quale sottospazio si vuole proiettare e di averne scelto una base, mentre $\hat P^2=\hat P$ (insieme a $\hat P=\hat P^{\dagger}$) caratterizza la famiglia intera senza riferimento a nessuna base: è la stessa mossa della tappa 04, dove $E(\lambda)$ sostituiva gli autovettori con una proprietà strutturale. E coglie esattamente il fatto di tappa 05: $P(2)$ scritto con $|\phi_1\rangle,|\phi_2\rangle$ o con la coppia ruotata $|f_1\rangle,|f_2\rangle$ è lo stesso operatore idempotente, anche se le due costruzioni &ldquo;$|v\rangle\langle v|$ per vettore normalizzato&rdquo; partono da vettori diversi. La definizione operativa vede l&rsquo;invariante; quella costruttiva vede la scelta arbitraria.`},
   {q:R`La risoluzione spettrale $\hat A=\sum_a aP(a)$ sembra ridire soltanto $\hat A=\hat A$, una volta che si conoscono già gli autovalori e i proiettori. Che cosa aggiunge davvero?`,
    a:R`Aggiunge che la ricostruzione **non richiede** di scegliere una base dentro ogni autospazio degenere — i proiettori $P(a)$ sono ben definiti indipendentemente da quella scelta (tappa 05), mentre la scrittura $\hat A=\sum_i a_i|\phi_i\rangle\langle\phi_i|$ richiede di avere fissato $|\phi_1\rangle,|\phi_2\rangle$ in un ordine e con un orientamento precisi. È la differenza fra una formula che funziona per OGNI base ortonormale dell&rsquo;autospazio e una che ne richiede una fissata: la prima è un fatto sull&rsquo;operatore, la seconda sul calcolo particolare che si sta facendo. Ed è la forma che sopravvive quando lo spettro diventa continuo (tappa 04), dove gli $\hat A=\sum a_i|\phi_i\rangle\langle\phi_i|$ non hanno più senso ma $\hat A=\int\lambda\,dE(\lambda)$ sì.`}
  ]}
]},

/* ---------------- 08 · LA TRACCIA: UN NUMERO CHE NON DIPENDE DALLA BASE ---------------- */
{ num:'08', title:'La traccia: un numero che non dipende dalla base', meta:'la definizione di Ballentine · perché è invariante per cambio di base unitario · la traccia di un proiettore è una dimensione · il valor medio richiuso',
  blocchi:[
  {t:'prosa', title:'Un numero già incontrato, mai definito per intero', tag:'costruzione', html:R`
  <p>La traccia è comparsa fin dalla tappa 01, nella formula $\langle u|\rho|u\rangle=\operatorname{Tr}(\rho\hat P_u)$ con cui Ballentine deduce che l&rsquo;osservabile associata a un proiettore è autoaggiunta. È tempo di definirla per intero. Ballentine la scrive così:</p>
  <p style="padding-left:1.2em;border-left:3px solid rgba(120,160,255,.45)"><i>&laquo;Una caratteristica utile di un operatore $A$ è la sua traccia, definita come $\operatorname{Tr}A=\sum_j\langle u_j|A|u_j\rangle$, dove $\{|u_j\rangle\}$ può essere una base ortonormale qualunque. Si può dimostrare che il valore di $\operatorname{Tr}A$ è indipendente dalla particolare base ortonormale scelta per calcolarlo.&raquo;</i> &mdash; Ballentine, par. 1.2, pag. stampata 15</p>
  <p>Due cose in questa definizione meritano peso uguale: che la traccia <i>si calcoli</i> come somma di elementi diagonali in una base, e che il suo <i>valore non dipenda</i> da quale base si è scelta per calcolarla. La seconda è il punto delicato — e ne è stata appena vista una dimostrazione implicita, senza che il movimento la nominasse: in tappa 05, la traccia dei proiettori $P(2)$ e $P(4)$ non è cambiata ruotando $|\phi_1\rangle,|\phi_2\rangle$ in $|f_1\rangle,|f_2\rangle$.</p>`},
  {t:'reveal', title:'Perché un cambio di base unitario non tocca la traccia', tag:'costruzione', steps:[
   {label:'La verifica diretta, sulla stessa matrice di tappa 02', body:R`
   <p>Shankar lo chiede come esercizio nella forma più operativa: &laquo;la traccia di una matrice non è alterata da un cambio di base unitario $|i\rangle\to U|i\rangle$&raquo; (Esercizio 1.7.1), e lo stesso per il determinante (Esercizio 1.7.2). Si verifichi sulla matrice di tappa 02, $\hat A=\begin{pmatrix}2&1\\1&2\end{pmatrix}$, traccia $4$ e determinante $3$. Ruotandola con $U=\begin{pmatrix}\cos\varphi&-\sin\varphi\\\sin\varphi&\cos\varphi\end{pmatrix}$ (un unitario reale, cioè ortogonale) si ottiene $\hat B=U^{T}\hat AU=\begin{pmatrix}2+\sin2\varphi&\cos2\varphi\\\cos2\varphi&2-\sin2\varphi\end{pmatrix}$: le singole entrate <i>oscillano</i> con $\varphi$ — a $\varphi=\pi/4$, per dire, $\hat B$ diventa diagonale — ma</p>
   $$\operatorname{Tr}\hat B=(2+\sin2\varphi)+(2-\sin2\varphi)=4,\qquad \det\hat B=(2+\sin2\varphi)(2-\sin2\varphi)-\cos^22\varphi=4-\sin^22\varphi-\cos^22\varphi=3,$$
   <p>entrambi <b>indipendenti da $\varphi$</b>, uguali ai valori di partenza per ogni angolo. Non è una coincidenza di questo esempio: è la dimostrazione generale di Shankar applicata a un caso che si può disegnare.</p>`},
   {label:'L’argomento generale, in una riga', body:R`
   <p>Perché la traccia sia invariante basta la proprietà ciclica $\operatorname{Tr}(XY)=\operatorname{Tr}(YX)$ (von Neumann la dimostra per esteso nel paragrafo sulla traccia, costruendola a partire dalla radice quadrata di operatori positivi, per renderla valida anche in dimensione infinita): scrivendo $\hat B=U^{\dagger}\hat AU$ si ha $\operatorname{Tr}\hat B=\operatorname{Tr}(U^{\dagger}\hat AU)=\operatorname{Tr}(\hat AUU^{\dagger})=\operatorname{Tr}\hat A$, usando $UU^{\dagger}=\mathbb 1$ (tappa 06) nell&rsquo;ultimo passo. La traccia non vede la base <i>perché</i> l&rsquo;unitarietà è precisamente la condizione che permette di far scorrere $U$ da un lato all&rsquo;altro del prodotto senza lasciare resti.</p>`}
  ]},
  {t:'reveal', title:'La traccia di un proiettore è un conteggio, non un numero qualunque', tag:'costruzione', steps:[
   {label:'Un intero che misura la dimensione di un sottospazio', body:R`
   <p>Si applichi la definizione di Ballentine a $\hat P_V=\sum_i|v_i\rangle\langle v_i|$ (tappa 07), usando come base di calcolo gli stessi $|v_i\rangle$ completati a base di $\mathcal H$: ogni $|v_i\rangle$ della base del sottospazio dà $\langle v_i|\hat P_V|v_i\rangle=\langle v_i|v_i\rangle=1$, e ogni vettore ortogonale a $V$ dà $0$. Quindi $\operatorname{Tr}\hat P_V=\dim V$ — <b>sempre un intero</b>, mai un numero qualunque, perché conta vettori di base, non li pesa. È esattamente ciò che tappa 07 aveva calcolato sul caso specifico: $\operatorname{Tr}P(2)=2$ e $\operatorname{Tr}P(4)=1$, i gradi di degenerazione dei due autovalori, e la loro somma $2+1=3$ è la dimensione dell&rsquo;intero spazio — la stessa cosa detta tre volte, con la traccia, con la somma dei gradi di degenerazione, e con $\dim\mathcal H$.</p>`},
   {label:'Il valor medio richiuso: dove tutto il movimento confluisce', body:R`
   <p>La tappa 01 era partita da $\langle u|\rho|u\rangle=\operatorname{Tr}(\rho\hat P_u)$ per dedurre l&rsquo;autoaggiuntezza. Ora si può scrivere la formula generale del valor medio di un&rsquo;osservabile <i>degenere</i>, usando la risoluzione spettrale di tappa 05 e 07:</p>
   $$\langle\hat A\rangle_\rho=\operatorname{Tr}(\rho\hat A)=\operatorname{Tr}\Big(\rho\sum_a aP(a)\Big)=\sum_a a\,\operatorname{Tr}\big(\rho P(a)\big)=\sum_a a\,p(a),$$
   <p>dove $p(a)=\operatorname{Tr}(\rho P(a))$ è la probabilità di ottenere $a$ — la generalizzazione della regola di Born al caso in cui un autovalore ha più di un autovettore. La formula non privilegia nessun autovettore particolare dentro l&rsquo;autospazio di $a$, esattamente perché $P(a)$ non lo privilegia (tappa 05): la probabilità di misurare $a$ dipende solo dalla proiezione <i>sull&rsquo;intero autospazio</i>, non da come lo si è scelto di descrivere. Questo chiude il cerchio aperto in tappa 01: lì si era vista la condizione sull&rsquo;operatore che rende reale un valor medio; qui si vede la formula completa che quel valor medio calcola, con la degenerazione messa in conto fin dall&rsquo;inizio.</p>`}
  ]},
  {t:'plot', title:'Le entrate oscillano, la somma resta piatta',
   intro:R`Le due entrate diagonali di $\hat B=U^{T}\hat AU$ al variare dell’angolo di rotazione $\varphi$: ciascuna sale e scende, ma la loro somma — la traccia — è la retta orizzontale che non si muove.`,
   plots:[
    {kind:'func2d', xr:[0,6.3], yr:[-0.3,4.3], height:340, ticks:7,
     title:'B₁₁(φ), B₂₂(φ) oscillano; B₁₁+B₂₂ = 4 sempre',
     curves:[
      {f:'2+sin(2*x)', col:'#4c8dff', width:2.2, label:'B₁₁(φ)=2+sin2φ'},
      {f:'2-sin(2*x)', col:'#ff8a5c', width:2.2, label:'B₂₂(φ)=2−sin2φ'},
      {f:'4', col:'#8a93a6', width:2.4, label:'traccia = 4, costante'}
     ],
     xlabel:'φ', ylabel:'valore'}
   ],
   leggi:R`<p><b>Che cosa guardare.</b> Le due curve blu e arancio si intrecciano, ciascuna oscillando fra $1$ e $3$: a $\varphi=0$ si ha $(2,2)$ — la base di partenza — e a $\varphi=\pi/4$ si ha $(3,1)$, che sono esattamente gli <i>autovalori</i> di $\hat A$ trovati in tappa 02 (coerente: a quell&rsquo;angolo $U$ diagonalizza $\hat A$). La retta grigia orizzontale, somma delle due, non si piega mai. <b>Che cosa impararne.</b> La traccia è l&rsquo;unica combinazione delle entrate diagonali che resta cieca al cambio di base — non la singola entrata, non la loro differenza (che oscilla fra $-2$ e $2$ esattamente come le entrate stesse), solo la somma. È il motivo per cui la traccia, e non una singola componente, è la quantità che compare nelle formule fisiche (il valor medio, la normalizzazione di uno stato misto $\operatorname{Tr}\rho=1$): è l&rsquo;unico numero del genere che non dipende da una scelta arbitraria di assi.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Se la traccia non dipende dalla base, perché Ballentine si prende la briga di dimostrarlo invece di darlo per ovvio?`,
    a:R`Perché non è ovvio finché non si usa la proprietà ciclica — e la proprietà ciclica stessa non è ovvia in dimensione infinita, dove una somma infinita non si può sempre riordinare senza cambiarne il valore. Von Neumann costruisce la traccia apposta per sopravvivere a quel caso, passando per la radice quadrata di un operatore positivo invece che per la somma diretta degli elementi diagonali — un prezzo pagato precisamente perché &ldquo;ovvio in dimensione finita&rdquo; non basta quando lo spazio è $\mathcal H$ di dimensione infinita, lo stesso spazio dove in tappa 03 e 04 &ldquo;ovvio&rdquo; falliva regolarmente.`},
   {q:R`La formula $\langle\hat A\rangle_\rho=\sum_a a\,p(a)$ sembra identica alla tappa 01 ($\varepsilon=\sum_i\varepsilon_i p_i$ di Picasso, eq. 4.28). Che cosa aggiunge la versione con $P(a)$?`,
    a:R`Aggiunge che $p(a)=\operatorname{Tr}(\rho P(a))$ è definito anche quando $a$ è degenere, sommando correttamente su TUTTO l&rsquo;autospazio invece che su un singolo autovettore — se si scrivesse $p_i=\langle\phi_i|\rho|\phi_i\rangle$ per un singolo $|\phi_i\rangle$ dentro un autospazio di dimensione due, il risultato dipenderebbe da quale dei due vettori (o quale combinazione) si fosse scelto, contraddicendo tappa 05. La formula di Picasso era già corretta ma lasciava sottinteso che ogni autovalore avesse un solo autovettore; la riscrittura con $P(a)$ rende quell&rsquo;ipotesi esplicita rimuovendola — vale per operatori degeneri e non degeneri senza bisogno di due formule diverse.`}
  ]}
]},

/* ---------------- 09 · IL SENSO: DALLA CONDIZIONE FISICA ALLA MACCHINA COMPLETA ---------------- */
{ num:'09', title:'Il senso: dalla condizione fisica alla macchina completa', meta:'il filo ricomposto, tappa per tappa · ciò che questo movimento non ha fatto, e a chi tocca · un’ultima parola a chi lo ha fondato',
  blocchi:[
  {t:'prosa', title:'Il filo ricomposto', tag:'architettura', html:R`
  <p>Il movimento è partito da una domanda fisica — quale proprietà rende reali i risultati di una misura — e ha dovuto costruire otto strumenti per rispondere per intero. La tappa 01 ha tradotto quella domanda in $\hat A=\hat A^{\dagger}$ e dimostrato che gli autovalori sono reali; la 02 ha aggiunto l&rsquo;ortogonalità degli autovettori, lasciando scoperto apposta il caso degenere. La 03 ha mostrato che in dimensione infinita &laquo;hermitiano&raquo; si spezza in due, e che la seconda metà — i domini — non è un cavillo: è ciò che decide se l&rsquo;impulso su una semiretta sia un&rsquo;osservabile. La 04 ha affrontato il caso in cui non c&rsquo;è nemmeno un autovettore, con la risposta di von Neumann (la famiglia $E(\lambda)$) e quella di Dirac (uscire dallo spazio di Hilbert) affiancate senza dichiarare un vincitore. La 05 ha richiuso il buco lasciato in tappa 02: la degenerazione non rompe la teoria, produce un autospazio e una libertà di base che nessuna misura di $\hat A$ può togliere. La 06 ha aperto il secondo tipo di operatore — unitario, non autoaggiunto — e mostrato con la trasformata di Cayley che i due tipi sono due facce della stessa trasformazione. La 07 ha nominato il mattone comune a tutte le tappe precedenti, il proiettore, e ricostruito l&rsquo;operatore di tappa 05 dai suoi due pezzi. La 08 ha chiuso con la traccia: il numero che non dipende dalla base, e che nella formula $\langle\hat A\rangle_\rho=\sum_a a\operatorname{Tr}(\rho P(a))$ raccoglie tutto il resto — autovalori, proiettori, probabilità — in un&rsquo;unica espressione.</p>`},
  {t:'reveal', title:'Che cosa questo movimento non ha chiuso, e perché è giusto così', tag:'architettura', steps:[
   {label:'Tre debiti dichiarati, non dimenticati', body:R`
   <p>Primo: <b>mq-07</b> resta un buco dichiarato nella mappa — le simmetrie e i loro generatori, dove la trasformata di Cayley di questa tappa 06 diventerà il ponte fra operatore unitario di simmetria e osservabile conservata, via Noether. Richiede Sakurai, che non si apre: è lavoro per il modello forte, non per questa coda. Secondo: la <b>degenerazione</b> di tappa 05 ha introdotto, senza risolverlo, il problema di <i>quale</i> secondo operatore serva per toglierla — è l&rsquo;argomento di <b>mq-05</b>, gli insiemi completi di osservabili compatibili (CSCO) e l&rsquo;indeterminazione che nasce quando due operatori non commutano. Terzo: la tappa 04 ha trattato lo spettro continuo <i>in generale</i>, con $Q\psi(x)=x\psi(x)$ come unico esempio esplicito — <b>mq-06</b> prende posizione e impulso insieme e mostra come la loro incompatibilità reciproca sia la stessa storia della tappa 03 (domini, condizioni al bordo) letta come principio fisico.</p>`},
   {label:'Il postulato della misura, rimandato di proposito', body:R`
   <p>Questo movimento ha costruito $\langle\hat A\rangle_\rho=\operatorname{Tr}(\rho\hat A)$ e la probabilità $p(a)=\operatorname{Tr}(\rho P(a))$, ma non ha enunciato <i>il collasso</i> — che cosa succede allo stato <i>dopo</i> la misura, quando $|\Psi\rangle$ diventa (proporzionale a) $P(a)|\Psi\rangle$. Picasso lo chiama il postulato di von Neumann e lo introduce a parte, come un quinto postulato indipendente dai primi quattro; tenerlo fuori da qui non è una lacuna, è la stessa disciplina della tappa 03 (&laquo;che cosa questo movimento non fa&raquo;): mescolare &ldquo;come si calcola un valor medio&rdquo; con &ldquo;che cosa succede allo stato&rdquo; renderebbe questo movimento due movimenti mal cuciti. È per intero il programma di <b>mq-04</b>.</p>`}
  ]},
  {t:'prosa', title:'Un’ultima parola, a chi lo ha fondato', tag:'architettura', html:R`
  <p>Il movimento chiude dove Dirac chiude il suo capitolo sulle osservabili, e vale lasciargli l&rsquo;ultima parola perché è lui ad aver scelto la via più audace di tutte e tre quelle viste qui — von Neumann, Ballentine, lo stesso Dirac: tenere gli autovettori a costo di uscire dallo spazio di Hilbert. Definendo l&rsquo;osservabile come variabile dinamica reale i cui autostati formano un insieme completo, scrive che questa è &laquo;un&rsquo;assunzione essenziale della teoria quantistica&raquo;, e non una conseguenza che si dimostra da principi più semplici. È la stessa onestà che ha attraversato tutto il movimento: Picasso dichiara che il suo argomento sul valor medio reale &laquo;ha meno sostanza di quanta sembri avere&raquo; (tappa 01); von Neumann avverte che il problema agli autovalori, anche quando è unico, può essere insolubile (tappa 03); Ballentine sceglie di <i>non</i> definire l&rsquo;aggiunto per operatori non limitati invece di far finta che il problema non esista (tappa 03). Nessuno dei quattro autori nasconde dove la propria costruzione smette di essere ovvia — ed è esattamente lì, in quei punti dichiarati, che si misura quanto a fondo si è davvero capito l&rsquo;operatore che si sta usando.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Se dovessi riassumere in una frase perché «autoaggiunto» e non «hermitiano» è la condizione giusta, quale sceglieresti?`,
    a:R`Perché «hermitiano» è una condizione sulla <i>formula</i> dell&rsquo;operatore, mentre «autoaggiunto» è una condizione sulla formula <i>e</i> sul dominio insieme — ed è questa seconda parte, invisibile in dimensione finita, a decidere se esista un&rsquo;unica risoluzione spettrale di cui parlare (tappa 03, teorema di von Neumann sull&rsquo;operatore massimale). Una frase sola che la cattura: due operatori con la stessa regola di calcolo ma domini diversi sono, in generale, operatori diversi — e solo uno dei due (al più) è davvero un&rsquo;osservabile.`},
   {q:R`Il movimento ha usato lo stesso operatore — quello di tappa 05 — in tappa 05, 07 e 08. Perché non costruirne uno nuovo a ogni tappa, come fa la maggior parte dei libri?`,
    a:R`Perché la ripetizione è il punto, non un risparmio di fatica: vedere lo <i>stesso</i> $2$ e $4$ ricomparire come autovalori (05), poi come coefficienti della risoluzione spettrale (07), poi come addendi pesati nella traccia (08) mostra che non sono tre fatti distinti su tre oggetti diversi — sono tre descrizioni dello stesso oggetto, lette con tre strumenti diversi. È lo stesso principio che Shankar enuncia per la traccia e il determinante: invarianti perché non dipendono dalla rappresentazione, e qui si vede che anche la <i>scomposizione</i> in autovalori e proiettori non dipende da quale tappa del movimento la sta leggendo.`}
  ]}
]}

/* =================================================================== */
var byId = {}; TAPPE.forEach(function(s){ byId[s.num]=s; });

var VKEY='pm-nucleomq-03-visited';
function loadSeen(){ try{ return new Set(JSON.parse(localStorage.getItem(VKEY)||'[]')); }catch(e){ return new Set(); } }
function saveSeen(s){ try{ localStorage.setItem(VKEY, JSON.stringify(Array.from(s))); }catch(e){} }
var SEEN = loadSeen();

function renderNav(active){
  var nav=document.getElementById('sidebar');
  nav.innerHTML='';
  var h=document.createElement('h2'); h.textContent='Nucleo mq-03 · le tappe'; nav.appendChild(h);
  TAPPE.forEach(function(s){
    var b=document.createElement('button');
    b.className='navitem'+(active===s.num?' active':'')+(SEEN.has(s.num)?' seen':'');
    b.innerHTML='<span class="dot"></span><span class="nx">'+s.num+'</span><span>'+s.title+'</span>';
    b.onclick=function(){ showTappa(s.num); };
    nav.appendChild(b);
  });
}

/* ---- renderer dei blocchi ---- */
function sectionProsa(title, tag, html){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var body=elFromHTML('<div class="open-body">'+html+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function sectionGram(title, rows){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag gramtag">grammatica</span></h3>';
  var inner='<table class="gramtab">';
  rows.forEach(function(r){ inner+='<tr><td class="gs">'+r[0]+'</td><td>'+r[1]+'</td></tr>'; });
  inner+='</table>';
  var body=elFromHTML('<div class="gramwrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
/* --- blocco PLOT: la figura non decora, si legge. Ogni plot porta una chiave di lettura. --- */
function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';
  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionSvelabile(title, tag, html, sol){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var c=document.createElement('div'); c.className='collaudo-item';
  var q=document.createElement('div'); q.className='cq'; q.innerHTML=html||'';
  c.appendChild(q); typeset(q);
  if(sol){
    var a=document.createElement('div'); a.className='ca'; a.style.display='none';
    a.innerHTML='<b>Soluzione.</b> '+sol;
    var btn=document.createElement('button'); btn.className='reveal-btn small';
    btn.textContent='Rivela la soluzione';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a);
      btn.disabled=true; btn.classList.add('done'); btn.textContent='Soluzione rivelata'; };
    c.appendChild(btn); c.appendChild(a);
  }
  wrap.appendChild(c); return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    /* DUE SCHEMI, NON UNO — scoperto il 2026-10-06 provando le pagine vive. I movimenti
       scritti per primi (em-01..03, me-10b, i collaudi di gd-01..09 e di quattro em)
       usano una forma piu' semplice: `reveal` e `prolessi` con un solo `html`,
       `esercizio` e `collaudo` con `html` + `sol`. Il renderer ne conosceva una sola e
       chiamava `steps.forEach` su `undefined`: TypeError, e la tappa si fermava li' —
       62 blocchi in 17 movimenti su 74. Non si riscrive il contenuto per far contento
       il renderer: e' il renderer che deve leggere cio' che c'e'.
       E in fondo un ramo che NON muore: uno schema nuovo di domani deve far vedere un
       avviso in quella sezione, non spegnere la pagina sotto di se'. */
    try{
      if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
      else if(b.t==='prolessi') m.appendChild(b.rotte ? sectionProlessi(b)
                                   : sectionProsa(b.title,'prolessi',b.html));
      else if(b.t==='reveal')m.appendChild(b.steps ? sectionReveal(b.title,b.tag,b.steps)
                                   : sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='esercizio') m.appendChild(b.steps ? sectionEsercizio(b)
                                   : sectionSvelabile(b.title,'esercizio',b.html,b.sol));
      else if(b.t==='collaudo')  m.appendChild(b.items ? sectionCollaudo(b.title,b.items)
                                   : sectionSvelabile(b.title,'provi, poi riveli',b.html,b.sol));
      else if(b.t==='plot')      m.appendChild(sectionPlot(b));
      else m.appendChild(sectionProsa(b.title||'(blocco)', 'tipo sconosciuto: '+b.t,
                                      b.html||''));
    }catch(err){
      var avv=document.createElement('section'); avv.className='section';
      avv.innerHTML='<h3>'+(b.title||'(blocco)')+'<span class="tag">non reso</span></h3>'
        +'<p style="color:#ff6b6b">Questo blocco non si &egrave; potuto rendere ('
        +b.t+': '+err.message+'). Il resto della tappa continua sotto.</p>';
      m.appendChild(avv);
    }
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* I POP-UP DEGLI STRUMENTI. `cablaStrumenti` esisteva dal 18-09 e non la chiamava
     nessuno: i 229 rimandi del percorso erano <span> senza handler, e il clic non
     faceva niente. Nessun controllo poteva vederlo — la sintassi era valida, le schede
     c'erano tutte, le formule rendevano: il guasto esisteva solo a pagina viva. Qui, e
     dopo ogni inserimento successivo, perche' la tappa si rimonta da capo a ogni
     cambio e gli handler vanno riattaccati al DOM nuovo. */
  cablaStrumenti(m);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}

/* deep-link: mq-03-osservabili-e-spettro.html#03 apre direttamente la tappa 03 */
window.addEventListener('DOMContentLoaded', function(){
  var h=(location.hash||'').replace('#','');
  showTappa(byId[h]?h:'00');
});
window.addEventListener('hashchange', function(){
  var h=(location.hash||'').replace('#','');
  if(byId[h]) showTappa(h);
});
