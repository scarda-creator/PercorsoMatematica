<style>
  :root{
    --bg:#0e1117; --panel:#161b22; --panel2:#1c232d; --border:#2b333d;
    --txt:#eef3f8; --muted:#b9c4d1; --accent:#4c8dff; --accent2:#8fb0ff;
    --ok:#2ea043; --okbg:#10331b; --warn:#d8a13a; --warnbg:#332a10;
    --gram:#5eead4; --grambg:#0f2a26;
    --pro:#b98cff; --probg:#1a1430; --proline:#2a2247; --proedge:#3a2d5c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    font-size:17px;line-height:1.55;}
  a{color:var(--accent2);}
  .banner{background:var(--panel2);border-bottom:1px solid var(--border);color:var(--muted);
    font-size:.8rem;font-weight:600;text-align:center;padding:8px 12px;letter-spacing:.3px;}
  .banner b{color:var(--accent2);}
  .shell{display:flex;max-width:1180px;margin:0 auto;align-items:flex-start;}

  /* ---- SIDEBAR ---- */
  .sidebar{width:280px;flex:0 0 280px;padding:20px 12px 60px;position:sticky;top:0;
    max-height:100vh;overflow-y:auto;border-right:1px solid var(--border);}
  .sidebar h2{font-size:.72rem;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);
    margin:18px 8px 8px;}
  .navitem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:none;
    background:transparent;color:var(--txt);padding:9px 10px;border-radius:8px;cursor:pointer;
    font-size:.9rem;transition:.12s;border:1px solid transparent;}
  .navitem:hover{background:var(--panel2);}
  .navitem.active{background:#13233f;border-color:var(--accent);color:#fff;}
  .navitem .dot{width:7px;height:7px;border-radius:50%;background:transparent;flex:0 0 7px;
    border:1px solid var(--border);}
  .navitem.seen .dot{background:var(--ok);border-color:var(--ok);}
  .navitem .nx{color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto;}

  /* ---- MAIN ---- */
  .main{flex:1 1 auto;min-width:0;padding:24px 30px 90px;max-width:860px;}
  h1{font-size:1.5rem;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:.92rem;margin:0 0 18px;}
  .sfhead{border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:8px;}
  .sfhead h1{font-size:1.55rem;}
  .meta{color:var(--muted);font-size:.82rem;margin-top:6px;}

  .section{margin:26px 0;}
  .section > h3{font-size:1.02rem;color:var(--accent2);margin:0 0 10px;
    display:flex;align-items:center;gap:10px;}
  .section > h3 .tag{font-size:.66rem;font-weight:700;letter-spacing:.4px;background:var(--panel2);
    border:1px solid var(--border);color:var(--muted);padding:2px 8px;border-radius:20px;
    text-transform:uppercase;}
  /* --- blocchi figura --- */
  .section > h3 .tag.plottag{background:#101f2e;border-color:#1f3c57;color:#7ab8e0;}
  .plot-intro{color:var(--muted);font-size:.95rem;margin:0 0 12px;}
  .plot-row{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;
    background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;}
  .plot-row.due .plot-box{flex:1 1 300px;min-width:280px;}
  .plot-box{max-width:560px;}
  .plot-leggi{margin-top:10px;background:var(--panel2);border:1px solid var(--border);
    border-left:3px solid #4a8fc7;border-radius:0 10px 10px 0;padding:11px 14px;
    font-size:.93rem;color:var(--muted);}
  .plot-leggi b{color:#7ab8e0;}
  .plot-err{color:#ff6b6b;font-size:.85rem;}
  .open-body{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
  .open-body p:first-child{margin-top:0;} .open-body p:last-child{margin-bottom:0;}
  .open-body ul{margin:.4em 0;padding-left:1.2em;} .open-body li{margin:.35em 0;}

  .note{background:var(--panel2);border-left:3px solid var(--muted);border-radius:6px;
    padding:9px 12px;margin:12px 0;font-size:.9rem;color:var(--muted);}
  .note b{color:#ff9d6b;}
  .note.warn{background:var(--warnbg);border-left-color:var(--warn);color:#e0b85a;}
  .note.warn b{color:#f0c25a;}

  /* ---- GRAMMATICA ---- */
  .gramwrap{background:var(--grambg);border:1px solid #1f4d47;border-radius:12px;padding:6px 6px;}
  table.gramtab{border-collapse:collapse;width:100%;font-size:.92rem;}
  table.gramtab td{padding:9px 12px;vertical-align:top;border-bottom:1px solid #17332e;}
  table.gramtab tr:last-child td{border-bottom:none;}
  table.gramtab td.gs{white-space:nowrap;color:var(--gram);width:1%;
    border-right:1px solid #17332e;font-variant-numeric:tabular-nums;}
  .section > h3 .tag.gramtag{background:var(--grambg);border-color:#1f4d47;color:var(--gram);}

  /* ---- STRUMENTI (repertorio condiviso: la scheda si apre DENTRO la frase) ----
     Nessun accento nuovo: riusa il verde della grammatica, perche' uno strumento
     richiamato e' grammatica gia' spiegata altrove, non una quinta specie di blocco. */
  .str{color:var(--gram);border-bottom:1px dashed var(--gram);cursor:pointer;}
  .str:hover{background:var(--grambg);}
  .str::after{content:"\2666";font-size:.62em;vertical-align:.42em;margin-left:2px;opacity:.8;}
  .str.aperto::after{content:"\2715";}
  .str.rotto{color:#ff6b6b;border-bottom-color:#ff6b6b;cursor:help;}
  /* la scheda e' uno SPAN in display:block, non un div: i rimandi cadono dentro
     <p>, <li> e celle di tabella, dove un div e' HTML illegale. */
  .strcard{display:block;margin:10px 0;background:var(--grambg);border:1px solid #1f4d47;
    border-left:3px solid var(--gram);border-radius:0 10px 10px 0;padding:10px 14px;font-size:.9rem;}
  .strcard .sh{display:block;font-size:.66rem;font-weight:700;letter-spacing:.5px;
    text-transform:uppercase;color:var(--gram);margin-bottom:7px;}
  .strcard .sr{display:block;margin:5px 0;}
  .strcard .sk{color:var(--gram);font-weight:600;}

  /* ---- PROLESSI (preannuncio fisico) ---- */
  .prowrap{background:var(--probg);border:1px solid var(--proedge);border-radius:12px;padding:4px 4px 8px;}
  .prohead{padding:11px 14px 4px;color:var(--pro);font-size:.72rem;font-weight:700;letter-spacing:.7px;
    text-transform:uppercase;}
  .pro-oggetto{padding:2px 14px 11px;color:var(--muted);font-size:.92rem;border-bottom:1px solid var(--proline);
    margin-bottom:2px;} .pro-oggetto b{color:var(--txt);}
  table.protab{border-collapse:collapse;width:100%;font-size:.92rem;}
  table.protab td{padding:10px 12px;vertical-align:top;border-bottom:1px solid var(--proline);}
  table.protab tr:last-child td{border-bottom:none;}
  table.protab td.pd{white-space:nowrap;color:var(--pro);width:1%;font-weight:700;font-size:.78rem;
    letter-spacing:.3px;text-transform:uppercase;border-right:1px solid var(--proline);line-height:1.3;}
  .pro-domanda{margin:8px 8px 2px;background:#140d26;border:1px solid var(--proedge);
    border-left:3px solid var(--pro);border-radius:8px;padding:10px 14px;font-size:.92rem;}
  .pro-domanda b{color:var(--pro);}
  .section > h3 .tag.protag{background:var(--probg);border-color:var(--proedge);color:var(--pro);}

  /* ---- REVEAL ---- */
  .rsteps{display:flex;flex-direction:column;gap:12px;}
  .rstep{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 18px;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .rlabel{font-size:.7rem;font-weight:700;letter-spacing:.4px;color:var(--accent);
    text-transform:uppercase;margin-bottom:8px;}
  .rstep p:first-of-type{margin-top:0;} .rstep p:last-child{margin-bottom:0;}
  .rstep ul{margin:.4em 0;padding-left:1.2em;}
  .testo{background:#13233f;border:1px solid #2b4877;border-radius:12px;padding:14px 18px;margin-bottom:14px;}
  .testo .src{display:block;font-size:.74rem;font-style:italic;color:var(--accent2);margin-bottom:8px;
    text-transform:uppercase;letter-spacing:.3px;}
  .esame-nota{font-size:.9rem;color:var(--muted);font-style:italic;margin-top:12px;padding-left:12px;
    border-left:3px solid var(--border);}

  .reveal-btn{background:var(--accent);color:#fff;border:none;padding:11px 18px;border-radius:10px;
    font-size:.95rem;font-weight:600;cursor:pointer;margin-top:14px;transition:.12s;}
  .reveal-btn:hover:not(:disabled){background:var(--accent2);}
  .reveal-btn.small{padding:7px 14px;font-size:.85rem;margin-top:0;background:var(--panel2);
    color:var(--accent2);border:1px solid var(--border);}
  .reveal-btn.small:hover:not(:disabled){border-color:var(--accent);}
  .reveal-btn:disabled,.reveal-btn.done{background:var(--panel2);color:var(--muted);
    border:1px solid var(--border);cursor:default;}

  /* ---- COLLAUDO ---- */
  .collaudo-item{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 18px;margin-bottom:12px;}
  .cq{margin-bottom:10px;}
  .ca{margin-top:12px;background:var(--okbg);border:1px solid #235c33;border-radius:8px;
    padding:10px 14px;font-size:.94rem;}
  .ca b{color:#5fd980;}

  /* ---- PREV / NEXT ---- */
  .prevnext{display:flex;justify-content:space-between;gap:12px;margin-top:40px;
    border-top:1px solid var(--border);padding-top:20px;}
  .pnbtn{flex:1 1 0;background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:12px 16px;cursor:pointer;color:var(--txt);text-align:left;transition:.14s;font:inherit;}
  .pnbtn:hover{border-color:var(--accent);background:var(--panel2);}
  .pnbtn.next{text-align:right;}
  .pnbtn .k{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .pnbtn .t{font-weight:600;color:var(--accent2);}
  .pnbtn:disabled{opacity:.35;cursor:default;border-color:var(--border);background:var(--panel);}

  code{background:var(--panel2);border:1px solid var(--border);border-radius:5px;
    padding:1px 5px;font-size:.85em;color:var(--accent2);}
  .katex{font-size:1.02em;color:var(--txt);} .katex-display{margin:.5em 0;overflow-x:auto;overflow-y:hidden;}

  @media(max-width:860px){
    .shell{flex-direction:column;}
    .sidebar{width:100%;flex:none;position:static;max-height:none;border-right:none;
      border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:4px;}
    .sidebar h2{width:100%;} .navitem{width:auto;}
    .main{padding:20px 16px 80px;}
  }
</style>

<script>
"use strict";
const R = String.raw;

function typeset(el){
  if(el && window.renderMathInElement){
    try{ renderMathInElement(el,{delimiters:[
      {left:'$$',right:'$$',display:true},
      {left:'$',right:'$',display:false}
    ],throwOnError:false}); }catch(e){}
  }
}
function elFromHTML(html){ var d=document.createElement('div'); d.innerHTML=html; return d; }

/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un
   rimando scritto nella prosa:

       <span class="str" data-str="serie-geometrica">la serie geometrica</span>

   Le schede citate da questo nucleo sono cucite qui sotto dal montaggio
   (assembla-nucleo.js): la pagina resta autosufficiente — niente fetch,
   niente sottocartelle da pubblicare — e un rimando a una scheda che non
   esiste FERMA la costruzione invece di arrivare in pagina rotto.
   Apertura: lo stesso gesto del collaudo (si clicca, il pannello compare,
   si typeset una volta sola), portato dentro la frase.
   =================================================================== */
var CORSO = 'elettromagnetismo';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["simmetrie"] = {"nome":"Simmetrie","riga":"L'insieme delle trasformazioni che lasciano identica la sorgente, e che perciò devono lasciare identico anche il campo che ne nasce.","serve":"È il ragionamento che decide la FORMA del campo prima di calcolarlo, e senza il quale la legge di Gauss non serve a niente: Gauss dà un solo numero — il flusso totale — e da un numero si ricava un campo soltanto se si sa già in che direzione punta e da quali variabili dipende. L'argomento ha una forma sola: se una trasformazione lascia identica la distribuzione di carica, lascia identico il campo; quindi ogni componente che quella trasformazione cambierebbe deve essere nulla, e ogni variabile che essa sposta non può comparire.","esempio":"Per un filo infinito uniformemente carico, la traslazione lungo il filo e la rotazione attorno a esso lasciano la carica identica: $\\mathbf E$ non può dipendere né da $z$ né dall'angolo. La riflessione nel piano perpendicolare al filo manderebbe $E_z$ in $-E_z$ lasciando uguale la sorgente, quindi $E_z=0$; resta la sola componente radiale $E_r(r)$. Solo a quel punto il cilindro coassiale è la superficie giusta, e Gauss dà $E_r\\cdot 2\\pi rL=\\dfrac{\\lambda L}{\\varepsilon_0}$, da cui $E_r=\\dfrac{\\lambda}{2\\pi\\varepsilon_0 r}$.","debito":"nessun nucleo del percorso tratta l'argomento di simmetria come strumento a sé: qui c'è la forma dell'argomento e non la sua giustificazione, che è di teoria dei gruppi e sta fuori dal percorso costruito finora. Quello che il percorso copre è il pezzo di destra — l'integrale di flusso, nel nucleo 03 tappa 04 — non il pezzo di sinistra che decide quale superficie scegliere.","controllo":[{"tipo":"uguale","sinistra":"(lam/(2*pi*e0*r))*2*pi*r*L","vale":"lam*L/e0","dove":"esempio","appare":"\\dfrac{\\lambda L}{\\varepsilon_0}"}]};
STRUM["flusso-di-un-campo"] = {"nome":"Flusso di un campo","riga":"L'integrale $\\iint_S\\mathbf F\\cdot\\hat n\\,dS$: quanta parte del campo attraversa la superficie, contata col segno che l'orientazione stabilisce.","serve":"Traduce «quanto passa attraverso» in un numero, e il numero dipende da due scelte che vanno dichiarate entrambe: la superficie e il verso della normale. Su una superficie chiusa la convenzione è normale uscente, e allora un flusso positivo significa che dentro c'è una sorgente netta. Dove il campo è parallelo alla superficie il contributo è nullo: conta solo la componente normale, mai il modulo.","esempio":"Per il campo radiale $\\mathbf F=\\mathbf r$ sulla sfera di raggio $R$ la normale uscente è $\\hat r$, e la componente normale vale $R$ in ogni punto, costante: il flusso è quel valore per l'area, $\\Phi=R\\cdot4\\pi R^{2}=4\\pi R^{3}$. Per $R=2$ fa $32\\pi$.","pieno":{"file":"03-curve-superfici.html","tappa":"04","come":"la definizione, il ruolo dell'orientazione e l'indipendenza dalla parametrizzazione, nel nucleo su curve e superfici"},"qui":{"elettromagnetismo":{"serve":"Il flusso di $\\mathbf E$ attraverso una superficie chiusa è l'unica cosa che la legge di Gauss controlla: dice quanto esce in totale, non quanto vale $\\mathbf E$ punto per punto. Da un solo numero si risale al campo soltanto se si sa già in che direzione punta e da cosa dipende — e quello lo decide la simmetria della distribuzione, non il teorema. Per questo la superficie si sceglie: dove $\\mathbf E$ è costante e normale, il flusso diventa modulo per area.","esempio":"Per una carica puntiforme $q$ al centro di una sfera di raggio $R$ il campo ha modulo $\\dfrac{q}{4\\pi\\varepsilon_0R^{2}}$ ed è ovunque normale alla sfera, quindi $\\Phi=\\dfrac{q}{4\\pi\\varepsilon_0R^{2}}\\cdot4\\pi R^{2}=\\dfrac{q}{\\varepsilon_0}$: il raggio è sparito. È il motivo per cui la legge di Gauss è una legge e non un conto — vale per qualunque superficie chiusa che racchiuda la carica."}},"controllo":[{"tipo":"uguale","sinistra":"R*4*pi*R**2","vale":"4*pi*R**3","dove":"esempio","appare":"4\\pi R^{3}"},{"tipo":"uguale","sinistra":"4*pi*2**3","vale":"32*pi","dove":"esempio","appare":"32\\pi"},{"tipo":"uguale","sinistra":"q/(4*pi*e0*R**2)*4*pi*R**2","vale":"q/e0","dove":"qui.elettromagnetismo.esempio","appare":"\\dfrac{q}{\\varepsilon_0}"},{"tipo":"derivata","espr":"q/(4*pi*e0*R**2)*4*pi*R**2","rispetto":["R"],"vale":"0","dove":"qui.elettromagnetismo.esempio","appare":"il raggio è sparito"}]};
STRUM["campo-conservativo"] = {"nome":"Campo conservativo","riga":"Un campo che è il gradiente di una funzione, $\\mathbf F=\\nabla U$, e che perciò compie lungo un cammino un lavoro deciso solo dagli estremi.","serve":"Le tre proprietà — esiste un potenziale, il lavoro non dipende dal cammino, la circuitazione su ogni chiusa è nulla — sono equivalenti, e all'esame si usa quella che costa meno. Il rotore nullo è invece una condizione soltanto NECESSARIA: diventa sufficiente unicamente se il dominio è semplicemente connesso, e dimenticare quella clausola è l'errore classico, perché il controesempio non è patologico ma è il campo attorno a un filo.","esempio":"Il campo $\\mathbf F=(2xy,\\,x^{2})$ ha potenziale $U=x^{2}y$, perché $\\partial_xU=2xy$ e $\\partial_yU=x^{2}$; quindi il lavoro da $(0,0)$ a $(1,1)$ vale $U(1,1)-U(0,0)=1$, lungo qualunque cammino si scelga fra i due punti.","pieno":{"file":"04-campi-vettoriali.html","tappa":"05","come":"le tre caratterizzazioni equivalenti, la costruzione del potenziale per integrazione e il ruolo del dominio, nel nucleo sui campi vettoriali"},"qui":{"elettromagnetismo":{"serve":"In elettrostatica $\\mathbf E$ è conservativo, e l'intero apparato del potenziale $V$ poggia su questo: il lavoro per spostare una carica da $A$ a $B$ è $q(V_A-V_B)$ qualunque strada prenda, e solo per questo ha senso parlare di energia potenziale di una configurazione. La proprietà cade appena $\\mathbf B$ varia nel tempo: per Faraday la circuitazione di $\\mathbf E$ su una chiusa vale $-\\dfrac{d\\Phi_B}{dt}$, e un campo con circuitazione non nulla non ammette potenziale scalare.","esempio":"Per la carica puntiforme, il lavoro del campo di Coulomb su una carica di prova unitaria che va da $r_1$ a $r_2$ è $\\displaystyle\\int_{r_1}^{r_2}\\dfrac{q}{4\\pi\\varepsilon_0r^{2}}\\,dr=\\dfrac{q}{4\\pi\\varepsilon_0}\\left(\\dfrac{1}{r_1}-\\dfrac{1}{r_2}\\right)$: dipende solo dai due raggi, e l'angolo percorso non compare da nessuna parte. È la stessa cosa che dire $V\\propto 1/r$."}},"controllo":[{"tipo":"derivata","espr":"x**2*y","rispetto":["x"],"vale":"2*x*y","dove":"esempio","appare":"2xy"},{"tipo":"derivata","espr":"x**2*y","rispetto":["y"],"vale":"x**2","dove":"esempio","appare":"x^{2}"},{"tipo":"uguale","sinistra":"1**2*1-0**2*0","vale":"1","dove":"esempio","appare":"=1"},{"tipo":"integrale","espr":"q/(4*pi*e0*r**2)","var":"r","da":"r1","a":"r2","vale":"q/(4*pi*e0)*(1/r1-1/r2)","ipotesi":{"r":"positive","r1":"positive","r2":"positive"},"dove":"qui.elettromagnetismo.esempio","appare":"\\left(\\dfrac{1}{r_1}-\\dfrac{1}{r_2}\\right)"}]};

function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';
  return h;
}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){

/* ---------------- 00 · DI COSA PARLA QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Di cosa parla questo movimento', meta:'Elettromagnetismo · voce B.3 · 55 prove su 100, densita 6.5 · il capitolo in cui la materia entra nelle formule',
  blocchi:[
  {t:'prosa', title:'Il problema, e la mossa', tag:'architettura', html:R`
  <p>In un conduttore le cariche si spostano <b>liberamente</b> finché il campo interno si annulla. In un <b>isolante</b> non possono andare da nessuna parte: restano legate ai loro atomi. Ma possono <b>spostarsi di poco</b> — la nube elettronica si sbilancia rispetto al nucleo, o le molecole già polari si orientano — e quel poco basta a produrre un campo che si oppone a quello esterno.</p>
  <p>Il risultato non è l&rsquo;annullamento ma l&rsquo;<b>attenuazione</b>: dentro un dielettrico lineare il campo è
  $$E=\frac{E_0}{\varepsilon_r},$$
  con $\varepsilon_r>1$ la costante dielettrica relativa. <b>Il conduttore è il caso limite $\varepsilon_r\to\infty$</b>, ed è il modo giusto di tenere insieme i due movimenti: non due teorie, una sola con un parametro.</p>
  <p>La mossa tecnica di tutto il capitolo è una sola: <b>le cariche di polarizzazione sono cariche vere</b> — fanno campo come tutte le altre — ma non le controlliamo e non sappiamo dove siano finché non risolviamo il problema. Quindi si cerca un modo di scrivere Gauss che le <i>nasconda</i>, e quel modo è il vettore $\vec D$.</p>`}
]},

/* ---------------- 01 · LA POLARIZZAZIONE ---------------- */
{ num:'01', title:'La polarizzazione: dal dipolo microscopico alle cariche che compaiono sulle facce', meta:'P come densita di dipolo · sigma_p e rho_p · perche le cariche compaiono solo dove P cambia',
  blocchi:[
  {t:'prosa', title:'P, e cosa produce', tag:'costruzione', html:R`
  <p>Ogni volumetto $dV$ di materiale acquista un momento di dipolo $d\vec p$. Si definisce la <b>polarizzazione</b> come densità di momento di dipolo,
  $$\vec P=\frac{d\vec p}{dV},$$
  che si misura in C/m² — <b>le stesse unità di una densità superficiale di carica</b>, e non è un caso.</p>
  <p>Immagina una fila di dipoli allineati: la testa positiva di ciascuno è addossata alla coda negativa del successivo, e <b>internamente si cancellano</b>. Restano scoperte solo le estremità: una faccia positiva e una negativa. Questo è il contenuto delle due formule:</p>
  <ul>
   <li><b>sulla superficie</b>: $\sigma_p=\vec P\cdot\hat n$, con $\hat n$ normale uscente. Massima dove $\vec P$ è perpendicolare alla faccia, nulla dove le è parallela;</li>
   <li><b>nel volume</b>: $\rho_p=-\nabla\cdot\vec P$, diversa da zero <b>solo dove $\vec P$ non è uniforme</b>. In un dielettrico omogeneo in campo uniforme, $\rho_p=0$ e tutta la carica di polarizzazione sta sulle facce.</li>
  </ul>
  <div class="note"><b>Il segno, che agli scritti costa più di ogni altra cosa.</b> Le cariche di polarizzazione si dispongono in modo da <b>opporsi</b> al campo che le ha create: sulla faccia dove entra $\vec E_0$ compare carica <b>negativa</b>, su quella dove esce carica <b>positiva</b>. Il loro campo interno punta contro $\vec E_0$, e lo riduce. Se in un tuo conto il campo dentro il dielettrico risulta <i>maggiore</i> di quello fuori, hai sbagliato un segno: per $\varepsilon_r>1$ non può succedere mai.</div>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Un dielettrico è <b>neutro</b>. Come può avere cariche sulle facce?`,
    a:R`Perché la carica totale resta <b>zero</b>: la faccia positiva e quella negativa si compensano esattamente, e l&rsquo;integrale di $\sigma_p$ su tutta la superficie chiusa più quello di $\rho_p$ sul volume fa zero. Non si è creata carica: si è <b>separata</b>. È la stessa cosa che succede in un conduttore neutro per induzione, con la differenza che qui gli spostamenti sono microscopici e reversibili.`},
   {q:R`Perché $\rho_p=-\nabla\cdot\vec P$ ha il segno meno?`,
    a:R`Perché $\vec P$ punta dalla carica negativa alla positiva di ogni dipolo, quindi dove $\vec P$ <b>diverge</b> (esce più di quanto entra) sta partendo carica positiva e ne resta indietro di negativa. Il meno è lo stesso della definizione del dipolo, non una convenzione aggiuntiva — e la prova è che con quel segno la carica totale viene zero, come deve.`}
  ]},
  {t:'prosa', title:'Perche in campo uniforme la carica di volume e nulla — l argomento, non l enunciato', tag:'first principles', html:R`
  <p>La formula $\rho_p=-\nabla\cdot\vec P$ dice <i>che</i> la carica di volume compare solo dove $\vec P$ varia, e non dice <i>perché</i>. Bettini (§4.4) fa l'argomento diretto, che vale la pena rifare perché è tutto il contenuto fisico del divergenza.</p>
  <p>Prendi una fetta sottile di dielettrico, di spessore $d$, fra due superfici $S_1$ e $S_2$ parallele alle facce. A campo spento la fetta è neutra. Accendendo il campo, immagina — è lecito, perché conta solo lo spostamento <i>relativo</i> — che le cariche negative restino ferme e le positive si spostino, di $d_1$ all'altezza di $S_1$ e di $d_2$ all'altezza di $S_2$. Allora:</p>
  <ul>
   <li><b>entrano</b> nella fetta tutte le cariche positive che stavano entro $d_1$ sotto $S_1$;</li>
   <li><b>escono</b> tutte quelle che stavano entro $d_2$ sotto $S_2$.</li>
  </ul>
  <p>Se $d_1=d_2$ il bilancio è esattamente nullo: <b>entra tanta carica quanta ne esce</b>, e la fetta resta neutra per quanto sottile la si prenda. E poiché lo spostamento è proporzionale al campo, $d_1=d_2$ equivale a $E_1=E_2$: <b>è il campo uniforme la condizione, non una proprietà del materiale</b>. Quando invece il campo varia, $d_1\ne d_2$, il bilancio non torna, e la differenza è precisamente ciò che $-\nabla\cdot\vec P$ conta.</p>
  <p><b>Perché questo argomento conviene averlo in testa e non solo la formula.</b> Dice dove guardare in un esercizio: la carica di volume non si cerca «nel materiale», si cerca dove il campo cambia — vicino a una carica libera immersa nel dielettrico, in una guaina cilindrica dove $E\propto1/r$, in un materiale disomogeneo con $\varepsilon_r$ variabile. In un condensatore piano riempito, dove il campo è uniforme, <b>non c'è niente da cercare</b>: tutta la carica di polarizzazione sta sulle due facce, e il conto si chiude con $\sigma_p$ soltanto.</p>`}
]},

/* ---------------- 01b · DA DOVE VIENE CHI_E ---------------- */
{ num:'01b', title:'Da dove viene la suscettivita: polarizzabilita, e i due meccanismi', meta:'p = alpha E · chi_e = n alpha / eps0 · deformazione contro orientamento · perche lacqua vale 80 in continua e 1.8 in ottica',
  blocchi:[
  {t:'prosa', title:'Il ponte micro-macro, in tre righe', tag:'derivazione', html:R`
  <p>Finora $\varepsilon_r$ è un numero che si legge in tabella. Da dove viene? Bettini lo costruisce in tre passaggi (§4.2), e sono tre passaggi che vale la pena saper rifare perché rendono prevedibile l'ordine di grandezza invece che misterioso.</p>
  <p><b>Primo</b>: il singolo atomo. Il campo sbilancia la nube elettronica rispetto al nucleo di una quantità piccolissima, e finché il campo non è enorme lo spostamento è proporzionale a esso. Quindi il dipolo indotto è proporzionale al campo:
  $$\vec p=\alpha\vec E,$$
  con $\alpha$ la <b>polarizzabilità atomica</b>, una costante del materiale che si misura in $\mathrm{C^2\,m/N}$. Più è grande, più l'atomo è «molle».</p>
  <p><b>Secondo</b>: la media su un volumetto. Se ci sono $n$ atomi per unità di volume e sono tutti polarizzati allo stesso modo,
  $$\vec P=n\vec p=n\alpha\vec E.$$
  <b>Terzo</b>: il confronto con la definizione macroscopica $\vec P=\varepsilon_0\chi_e\vec E$ dà
  $$\chi_e=\frac{n\alpha}{\varepsilon_0},\qquad \varepsilon_r=1+\frac{n\alpha}{\varepsilon_0}.$$
  <b>La suscettività non è una costante indipendente: è la polarizzabilità di un atomo moltiplicata per quanti atomi ci sono.</b></p>
  <p><b>L'ordine di grandezza, che è la parte utile.</b> Per un atomo, $\alpha/(4\pi\varepsilon_0)$ è dell'ordine del <i>volume</i> atomico — un conto classico grossolano su una nube sferica di raggio $a$ dà esattamente $\alpha=4\pi\varepsilon_0a^{3}$. Allora $\chi_e\simeq 4\pi n a^{3}$, cioè <b>la frazione di volume effettivamente occupata dagli atomi</b>. Per un gas a pressione atmosferica quella frazione è $\sim10^{-3}$, e infatti l'aria ha $\varepsilon_r=1{,}00059$: uno con una correzione minuscola. Per un solido la frazione è di ordine uno, e infatti i solidi hanno $\varepsilon_r$ fra $2$ e $10$. <b>Non serve una tabella per sapere che un gas non attenua quasi niente e un vetro attenua di un fattore pochi</b>: serve sapere quanto spazio occupa la materia.</p>`},
  {t:'reveal', title:'I due meccanismi, e perche lacqua si comporta in due modi diversi', tag:'struttura', steps:[
   {label:'Deformazione: veloce e debole', body:R`
   <p>È quello appena descritto: il campo <b>deforma</b> l'atomo o la molecola, creando un dipolo che prima non c'era. Coinvolge gli elettroni, che sono leggeri, quindi il meccanismo è <b>rapidissimo</b> — segue il campo fin nell'ottico, a $10^{15}$ Hz — e dà contributi modesti, $\varepsilon_r$ di qualche unità. Non dipende quasi dalla temperatura: la nube si sbilancia allo stesso modo caldo o freddo.</p>`},
   {label:'Orientamento: lento e potente', body:R`
   <p>Alcune molecole hanno un dipolo permanente anche a campo nullo — l'acqua ne è l'esempio, con $p\simeq6{,}2\cdot10^{-30}\ \mathrm{C\,m}$ dovuto alla sua forma a V. Lì il campo non deve creare niente: deve solo <b>orientare</b> dipoli che esistono già, contro l'agitazione termica che li scompiglia.</p>
   <p>Il bilancio fra le due tendenze lo dà la statistica di Boltzmann, con energia $U=-\vec p\cdot\vec E=-pE\cos\theta$. La media dell'orientamento è la <b>funzione di Langevin</b>
   $$\langle\cos\theta\rangle=\coth x-\frac1x,\qquad x=\frac{pE}{k_BT},$$
   e nei casi reali $x$ è piccolissimo — con $E=10^{6}\ \mathrm{V/m}$ e $T=300$ K viene $x\sim10^{-3}$. Sviluppando per $x\to0$ si ha $\coth x-\tfrac1x\to\tfrac{x}{3}$, quindi
   $$\langle p_\parallel\rangle=p\cdot\frac{x}{3}=\frac{p^{2}E}{3k_BT}\quad\Longrightarrow\quad \chi_e^{\text{orient}}=\frac{np^{2}}{3\varepsilon_0k_BT}.$$
   <b>Questo contributo è enorme e va come $1/T$</b>: è la legge di Curie per i dielettrici, ed è il motivo per cui l'acqua ha $\varepsilon_r\simeq80$ mentre un solido non polare si ferma a $5$.</p>`},
   {label:'E qui i due si separano: la frequenza', body:R`
   <p>Orientare una molecola intera richiede di ruotarla, e in un liquido questo costa tempo: l'acqua ci mette $\sim10^{-11}$ s. <b>Sopra quella frequenza il meccanismo orientazionale smette di funzionare</b>, perché il campo cambia verso prima che la molecola si sia girata, e resta solo la deformazione elettronica.</p>
   <p>La verifica sta in due numeri che chiunque conosce e che di solito non vengono messi insieme: l'acqua ha $\varepsilon_r\simeq80$ in continua, e indice di rifrazione $n\simeq1{,}333$ nel visibile. Poiché $n=\sqrt{\varepsilon_r}$, nell'ottico $\varepsilon_r=n^{2}\simeq1{,}78$. <b>Non è una contraddizione né una misura sbagliata: sono due regimi.</b> A $50$ Hz i dipoli seguono e si sommano gli $80$; a $10^{14}$ Hz restano fermi e sopravvive solo l'elettronica.</p>
   <p>È la ragione fisica per cui la domanda con cui questo movimento si chiude — «cosa succede se la polarizzazione ricorda?» — non è speculativa: <b>succede già nell'acqua di un bicchiere</b>, e il numero $80$ vale solo perché si è tacitamente supposto un campo lentissimo.</p>`}
  ]}
]},

/* ---------------- 02 · IL VETTORE D ---------------- */
{ num:'02', title:'Il vettore D: nascondere le cariche che non conosciamo', meta:'la definizione · Gauss per D vede solo le cariche libere · mezzi lineari · il ciclo logico e come si spezza',
  blocchi:[
  {t:'reveal', title:'Come nasce, e non e un postulato', tag:'costruzione', steps:[
   {label:'Il ciclo da spezzare', body:R`
   <p>Gauss vale sempre, ma con <b>tutte</b> le cariche: $\nabla\cdot\vec E=\dfrac{\rho_{\text{lib}}+\rho_{p}}{\varepsilon_0}$. Il guaio è che $\rho_p$ dipende da $\vec P$, che dipende dal campo $\vec E$, che è quello che stiamo cercando. <b>È un ciclo</b>, e il vettore $\vec D$ serve solo a spezzarlo.</p>`},
   {label:'La definizione, e il teorema che ne segue', body:R`
   <p>Si sostituisce $\rho_p=-\nabla\cdot\vec P$ e si porta a sinistra:
   $$\nabla\cdot(\varepsilon_0\vec E+\vec P)=\rho_{\text{lib}}.$$
   Si <b>battezza</b> quella combinazione:
   $$\vec D=\varepsilon_0\vec E+\vec P\quad\Longrightarrow\quad \nabla\cdot\vec D=\rho_{\text{lib}},$$
   e in forma integrale $\oint\vec D\cdot d\vec S=Q_{\text{lib}}$. <b>Il flusso di $\vec D$ conta solo le cariche che hai messo tu</b>, quelle che sai e controlli. Non è una nuova legge fisica: è la stessa legge con i termini ignoti spostati dall&rsquo;altra parte dell&rsquo;uguale.</p>`},
   {label:'Mezzi lineari: dove si chiude il conto', body:R`
   <p>Per un materiale lineare, omogeneo e isotropo, $\vec P=\varepsilon_0\chi_e\vec E$, e allora
   $$\vec D=\varepsilon_0(1+\chi_e)\vec E=\varepsilon_0\varepsilon_r\vec E,\qquad \varepsilon_r=1+\chi_e.$$
   <b>La ricetta d&rsquo;esame in tre righe</b>: (1) Gauss per $\vec D$ con le sole cariche libere, che dà $\vec D$ usando l'argomento di <span class="str" data-str="simmetrie">simmetria</span> per stabilire direzione e dipendenza, e il <span class="str" data-str="flusso-di-un-campo">flusso</span> attraverso la superficie giusta per il modulo; (2) $\vec E=\vec D/(\varepsilon_0\varepsilon_r)$ regione per regione, con $\varepsilon_r=1$ nel vuoto; (3) se servono, $\vec P=\vec D-\varepsilon_0\vec E$ e le cariche di polarizzazione. <b>Il ciclo è spezzato perché il passo (1) non ha bisogno di sapere niente del materiale.</b></p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`$\vec D$ è «il campo vero» o un artificio di calcolo?`,
    a:R`Un <b>artificio utile</b>, e conviene esserne consapevoli. La forza su una carica è $q\vec E$, non $q\vec D$: il campo fisico è $\vec E$. $\vec D$ è una combinazione costruita apposta perché la sua divergenza ignori le cariche di polarizzazione. Fuori dai mezzi lineari la relazione $\vec D=\varepsilon_0\varepsilon_r\vec E$ salta (nei ferroelettrici $\vec P$ esiste anche a campo nullo) mentre $\nabla\cdot\vec D=\rho_{\text{lib}}$ <b>resta vera</b>: è quello il contenuto solido.`},
   {q:R`In un condensatore piano con dielettrico, quanto vale $D$ fra le armature?`,
    a:R`$D=\sigma_{\text{lib}}$, la densità di carica <b>sulle armature</b> — e basta, senza che $\varepsilon_r$ compaia. È il senso di «$\vec D$ vede solo le cariche libere»: cambiando materiale, $D$ non cambia, cambia $E=D/(\varepsilon_0\varepsilon_r)$. Questa è la ragione per cui conviene sempre partire da $\vec D$ e non da $\vec E$.`}
  ]}
]},

/* ---------------- 03 · IL CONDENSATORE CON DIELETTRICO ---------------- */
{ num:'03', title:'Il condensatore con dielettrico: e il riempimento parziale, che e il vero esercizio', meta:'C = er C0 · lastra a meta spessore (serie) · lastra a meta area (parallelo) · isolato o collegato',
  blocchi:[
  {t:'prosa', title:'Riempimento totale', tag:'regola operativa', html:R`
  <p>Con il dielettrico che riempie tutto lo spazio fra le armature, a parità di carica libera il campo si riduce di $\varepsilon_r$, quindi $\Delta V$ si riduce di $\varepsilon_r$, quindi
  $$C=\varepsilon_rC_0.$$
  Vale per <b>qualunque</b> geometria — piano, cilindrico, sferico — perché il fattore entra allo stesso modo in ogni passaggio. È il motivo pratico per cui i condensatori reali contengono materiale e non aria: a parità di volume, $\varepsilon_r$ volte più capacità.</p>`},
  {t:'reveal', title:'Riempimento parziale: due configurazioni, due formule, un solo criterio', tag:'esame', steps:[
   {label:'Lastra di spessore d/2: e una SERIE', body:R`
   <p>Il dielettrico occupa metà dello spessore, per tutta l&rsquo;area. Le due regioni hanno la <b>stessa carica libera</b> sulle facce (induzione completa fra i due strati) e le loro tensioni si <b>sommano</b>: è una serie di $C_1=\frac{\varepsilon_0A}{d/2}$ e $C_2=\frac{\varepsilon_r\varepsilon_0A}{d/2}$, quindi
   $$C=\frac{2\varepsilon_r\varepsilon_0A}{d(1+\varepsilon_r)}.$$
   Controllo: per $\varepsilon_r\to1$ si ritrova $\varepsilon_0A/d$; per $\varepsilon_r\to\infty$ tende a $2\varepsilon_0A/d$, cioè al condensatore di spessore $d/2$ — <b>il dielettrico infinitamente polarizzabile si comporta come un conduttore</b> che avvicina le armature.</p>`},
   {label:'Lastra su meta area: e un PARALLELO', body:R`
   <p>Il dielettrico occupa metà dell&rsquo;area, per tutto lo spessore. Le due metà hanno la <b>stessa tensione</b> (le armature sono equipotenziali) e le cariche si <b>sommano</b>: è un parallelo,
   $$C=\frac{\varepsilon_0A(1+\varepsilon_r)}{2d}.$$</p>
   <div class="note"><b>Il criterio per non sbagliare mai</b>, ed è l&rsquo;unica cosa da ricordare di questa tappa: si guarda <i>che cosa hanno in comune le due regioni</i>. Stessa tensione → parallelo, si sommano le capacità. Stessa carica → serie, si sommano gli inversi. Le lastre parallele alle armature sono in serie; quelle perpendicolari, in parallelo. <b>Non serve ricordare le due formule: si ricostruiscono in dieci secondi.</b></div>`}
  ]},
  {t:'plot', title:'Le due configurazioni a confronto, al variare di epsilon_r',
   intro:R`Capacità in unità di $C_0=\varepsilon_0A/d$, per la stessa quantità di dielettrico disposta nei due modi.`,
   plots:[
    {kind:'func2d', xr:[1,12], yr:[0,7], height:340,
     title:'stessa lastra, due orientazioni: il parallelo cresce senza limite, la serie satura a 2',
     xlabel:'epsilon_r', ylabel:'C / C0',
     curves:[
      {f:'(1+x)/2', col:'#5eead4', width:2.4, label:'meta area (parallelo)'},
      {f:'2*x/(1+x)', col:'#b98cff', width:2.4, label:'meta spessore (serie)'}
     ],
     segs:[{x1:1, y1:2, x2:12, y2:2, col:'#ff6b6b', dash:true, width:1.4, label:'la serie non supera mai 2', lx:6.5, ly:2.16},
           {x1:1, y1:1, x2:12, y2:1, col:'#4d5a6b', dash:true, width:1.2, label:'C0', lx:11, ly:1.14}],
     marks:[{x:1, y:1, label:'er=1: nessun dielettrico', col:'#d8a13a', up:true}]}
   ],
   leggi:R`<b>Stessa lastra, stesso volume di materiale, risultati profondamente diversi</b> — ed è il tipo di cosa che un esercizio d&rsquo;esame sfrutta volentieri. Messa <i>perpendicolare</i> alle armature (metà area, parallelo) la capacità cresce linearmente con $\varepsilon_r$ e non ha un tetto. Messa <i>parallela</i> (metà spessore, serie) <b>satura a $2C_0$</b>: per quanto buono sia il dielettrico, la metà vuota resta lì e limita tutto, perché in serie comanda la capacità più piccola. Le due curve partono insieme da $C_0$ per $\varepsilon_r=1$ — controllo obbligato: senza dielettrico devono coincidere — e divergono subito dopo.<br><br>
   <b>La morale operativa</b>: in un condensatore in serie il collo di bottiglia è lo strato peggiore. È la stessa struttura della resistenza termica di un muro, e lo stesso motivo per cui un&rsquo;intercapedine d&rsquo;aria rovina l&rsquo;isolamento di una parete spessa.`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Un condensatore <b>isolato</b> e carico: ci infili dentro un dielettrico. Che cosa succede a $Q$, $E$, $\Delta V$, $U$? E se invece è <b>collegato</b>?`,
    a:R`<b>Isolato</b>: $Q$ resta, $E$ cala di $\varepsilon_r$, $\Delta V$ cala di $\varepsilon_r$, $C$ cresce di $\varepsilon_r$, e $U=\frac{Q^2}{2C}$ <b>cala</b> di $\varepsilon_r$. L&rsquo;energia persa è il lavoro che il campo fa <b>risucchiando dentro</b> la lastra: il dielettrico viene attirato nel condensatore, e se lo lasci libero ci entra da solo.<br><b>Collegato</b>: $\Delta V$ resta, $E$ resta, $C$ cresce di $\varepsilon_r$, quindi $Q$ cresce di $\varepsilon_r$ e $U=\frac12C\Delta V^2$ <b>cresce</b>. La carica in più la fornisce il generatore, che lavora il doppio di quanto l&rsquo;energia immagazzinata aumenti. <b>In entrambi i casi la lastra è attirata dentro</b>, ed è la domanda con cui questi esercizi si chiudono quasi sempre.`}
  ]}
]},

/* ---------------- 04 · IL RACCORDO ALL'INTERFACCIA ---------------- */
{ num:'04', title:'Le due condizioni al raccordo, e la rifrazione delle linee di campo', meta:'E parallela continua · D perpendicolare continua · tan theta = er tan theta · lesercizio della lastra inclinata',
  blocchi:[
  {t:'prosa', title:'Le due condizioni, e da dove vengono', tag:'first principles', html:R`
  <p>All&rsquo;interfaccia fra due mezzi valgono due regole, e ciascuna viene da una legge già nota:</p>
  <ul>
   <li><b>la componente parallela di $\vec E$ è continua</b>: $E_{1\parallel}=E_{2\parallel}$. Viene dal fatto che il campo elettrostatico è <span class="str" data-str="campo-conservativo">conservativo</span>: la sua circuitazione su un rettangolino a cavallo della superficie è nulla, e schiacciando il rettangolino fino a spessore zero i due lati corti non contribuiscono più, restano i due lati lunghi — uno per mezzo, percorsi in verso opposto, e la loro somma nulla impone l'uguaglianza delle componenti tangenziali;</li>
   <li><b>la componente perpendicolare di $\vec D$ è continua</b> (in assenza di carica libera sull&rsquo;interfaccia): $D_{1\perp}=D_{2\perp}$. Viene da <b>Gauss per $\vec D$</b> applicato al solito cilindretto schiacciato.</li>
  </ul>
  <p><b>Sono continue due componenti di due campi diversi</b>, e questo è il punto che genera confusione: $E_\perp$ <i>salta</i> (di un fattore $\varepsilon_r$) e $D_\parallel$ <i>salta</i> anch&rsquo;esso. Chi impone la continuità della grandezza sbagliata ottiene la legge di rifrazione al contrario.</p>`},
  {t:'reveal', title:'Lesercizio della lastra inclinata (esonero 20/04/2018)', tag:'esame', steps:[
   {label:'Il campo dentro', body:R`
   <p>Una lastra dielettrica di costante $\varepsilon_r$ è immersa in un campo uniforme $\vec E_0$ che forma un angolo $\theta$ con la <b>normale</b> alla lastra. Applicando le due condizioni:
   $$E_\parallel=E_0\sin\theta\ \text{(continua)},\qquad E_\perp=\frac{E_0\cos\theta}{\varepsilon_r}\ \text{(perché $D_\perp$ è continua)}.$$
   Il modulo del campo dentro è quindi $|\vec E|=E_0\sqrt{\dfrac{\cos^{2}\theta}{\varepsilon_r^{2}}+\sin^{2}\theta}$, <b>sempre minore di $E_0$</b>, ma ridotto solo nella componente perpendicolare.</p>`},
   {label:'La rifrazione: langolo cambia', body:R`
   <p>Poiché solo una delle due componenti si riduce, il campo <b>ruota</b>:
   $$\tan\theta'=\frac{E_\parallel}{E_\perp}=\varepsilon_r\tan\theta.$$
   <b>Le linee di campo si allontanano dalla normale</b> entrando nel dielettrico ($\theta'>\theta$), e sono la forma elettrostatica della legge di rifrazione ottica — non per analogia: è la stessa condizione al contorno applicata a un campo che oscilla invece che a uno statico, ed è da lì che nasce la legge di Snell con $n=\sqrt{\varepsilon_r}$.</p>`},
   {label:'Le cariche di polarizzazione e lenergia', body:R`
   <p>Sulla faccia compare $\sigma_p=\varepsilon_0(E_{0\perp}-E_\perp)=\varepsilon_0E_0\cos\theta\left(1-\frac{1}{\varepsilon_r}\right)$ — <b>solo la componente perpendicolare</b> produce carica, perché $\sigma_p=\vec P\cdot\hat n$.</p>
   <p>E la densità di energia dentro il materiale, $u=\frac12\vec D\cdot\vec E$, vale
   $$u=\frac12\varepsilon_0\varepsilon_rE_0^{2}\left(\frac{\cos^{2}\theta}{\varepsilon_r^{2}}+\sin^{2}\theta\right).$$
   <b>Il controllo di ogni formula di questa tappa è lo stesso</b>: per $\theta=0$ (campo perpendicolare) tutto si riduce al caso del condensatore riempito; per $\theta=\pi/2$ (campo parallelo) il dielettrico non fa nulla, $\sigma_p=0$ e il campo è indisturbato. Se una tua formula non passa questi due limiti, è sbagliata.</p>`}
  ]},
  {t:'plot', title:'La rifrazione delle linee di campo, e quanto vale langolo dentro',
   intro:R`$\theta'$ in funzione di $\theta$ (in gradi), per tre valori di $\varepsilon_r$. La bisettrice è il caso senza dielettrico.`,
   plots:[
    {kind:'func2d', xr:[0,90], yr:[0,90], height:340,
     title:'theta dentro contro theta fuori: le linee si allontanano sempre dalla normale',
     xlabel:'theta fuori (gradi)', ylabel:'theta dentro (gradi)',
     curves:[
      {f:'x', col:'#4d5a6b', width:1.6, dash:true, label:'er=1 (nessun effetto)'},
      {f:'atan(2*tan(x*PI/180))*180/PI', col:'#5eead4', width:2.2, label:'er=2'},
      {f:'atan(5*tan(x*PI/180))*180/PI', col:'#d8a13a', width:2.2, label:'er=5'},
      {f:'atan(80*tan(x*PI/180))*180/PI', col:'#b98cff', width:2.2, label:'er=80 (acqua)'}
     ],
     marks:[{x:45, y:63.43, label:'er=2: 45 -> 63', col:'#5eead4', left:true},
            {x:0, y:0, label:'perpendicolare: non ruota', col:'#ff9b6b', up:true}]}
   ],
   leggi:R`Tutte le curve stanno <b>sopra</b> la bisettrice: entrando nel dielettrico le linee si allontanano sempre dalla normale, e tanto più quanto $\varepsilon_r$ è grande. I due estremi sono fissi per <b>tutti</b> i materiali e sono il controllo dell&rsquo;esercizio: un campo perfettamente perpendicolare ($\theta=0$) non ruota — non ha componente parallela da conservare — e uno perfettamente parallelo ($\theta=90°$) resta parallelo, e infatti non produce nemmeno cariche di polarizzazione.<br><br>
   <b>La curva dell&rsquo;acqua ($\varepsilon_r\simeq80$) è quasi un gradino</b>: già a due gradi di inclinazione il campo interno è praticamente parallelo alla superficie. È il comportamento limite del conduttore, e non per una regola a parte: con $\varepsilon_r\to\infty$ la stessa formula manda $\theta'$ a $90°$ per ogni $\theta$ non nullo, cioè il campo <i>dentro</i> diventa puramente tangenziale — che visto dall&rsquo;altro lato è la regola familiare «il campo esterno a un conduttore è perpendicolare alla sua superficie».`}
]},

/* ---------------- 05 · ESERCIZI ---------------- */
{ num:'05', title:'Esercizi — tocca a te', meta:'le tre forme che cadono: riempimento parziale, cilindrico con guaina, lastra inclinata',
  blocchi:[
  {t:'esercizio', title:'Cavo coassiale con due guaine dielettriche',
   src:'forma ricorrente negli scritti (cfr. 180705)',
   testo:R`Un filo di raggio $R_1$ con carica $\lambda$ per unità di lunghezza è circondato da due guaine dielettriche coassiali: $\varepsilon_{r1}$ fra $R_1$ e $R_2$, $\varepsilon_{r2}$ fra $R_2$ e $R_3$. Determinare $\vec D$, $\vec E$ e $\vec P$ in ogni regione, le cariche di polarizzazione su ogni superficie, e la capacità per unità di lunghezza.`,
   steps:[
    {label:'La strada, e perche si parte da D', body:R`<p>Gauss per $\vec D$ con un cilindro di raggio $r$: $D(r)2\pi rL=\lambda L$, quindi $D=\frac{\lambda}{2\pi r}$ <b>in tutte le regioni</b>, indipendentemente dai materiali. Poi $E=D/(\varepsilon_0\varepsilon_r)$ regione per regione — ed è lì che i materiali entrano. Il potenziale si ottiene integrando $E$ a tratti, e la capacità per unità di lunghezza è $\lambda/\Delta V$: i due logaritmi compaiono divisi per le rispettive $\varepsilon_r$, cioè è una <b>serie</b> di due condensatori cilindrici.</p>`},
    {label:'Le cariche di polarizzazione', body:R`<p>$P=D-\varepsilon_0E=D\left(1-\frac{1}{\varepsilon_r}\right)$, e su ogni superficie $\sigma_p=\vec P\cdot\hat n$ con il segno dato dalla normale <b>uscente dal dielettrico</b>. Controllo obbligatorio: la carica di polarizzazione totale di ciascuna guaina (faccia interna più faccia esterna, moltiplicate per le rispettive aree) deve venire <b>zero</b>. Il fattore $r$ nelle aree è ciò che lo rende non ovvio, ed è esattamente il punto in cui l&rsquo;esercizio verifica se hai capito o hai applicato una formula.</p>`}
   ]},
  {t:'esercizio', title:'La lastra che viene risucchiata',
   src:'la domanda finale di quasi tutti gli esercizi con dielettrico',
   testo:R`Un condensatore piano di armature $A=L^2$ e distanza $d$ è caricato e poi isolato. Una lastra dielettrica di spessore $d$ e costante $\varepsilon_r$ viene inserita per un tratto $x$ lungo il condensatore. Calcolare $C(x)$, l'energia $U(x)$, e la forza che agisce sulla lastra.`,
   steps:[
    {label:'La strada', body:R`<p>È un <b>parallelo</b> fra la parte piena e quella vuota: $C(x)=\frac{\varepsilon_0L}{d}\left[(L-x)+\varepsilon_rx\right]$. A carica costante $U(x)=\frac{Q^2}{2C(x)}$, e la forza è $F=-\frac{dU}{dx}$ (a $Q$ fissato), che risulta <b>positiva</b>: la lastra è tirata dentro. <b>Il segno è tutto l&rsquo;esercizio</b>, e il controllo che lo conferma senza conti è fisico: il sistema si porta verso l&rsquo;energia minore, e con $Q$ fissato l&rsquo;energia cala al crescere di $C$, quindi al crescere di $x$.</p>`},
    {label:'Il conto della forza, fatto fino in fondo', body:R`
    <p>Conviene scrivere $C(x)=k\left[L+(\varepsilon_r-1)x\right]$ con $k=\dfrac{\varepsilon_0L}{d}$: la dipendenza da $x$ è tutta nel fattore $(\varepsilon_r-1)$, e si vede subito che per $\varepsilon_r=1$ la capacità non dipende più da $x$ — nessun dielettrico, nessuna forza. Allora</p>
    $$U(x)=\frac{Q^{2}}{2k\left[L+(\varepsilon_r-1)x\right]},\qquad
    F=-\frac{dU}{dx}=\frac{Q^{2}(\varepsilon_r-1)}{2k\left[L+(\varepsilon_r-1)x\right]^{2}}.$$
    <p><b>Tre cose che questo risultato dice e che l'enunciato qualitativo non diceva.</b> La forza è <b>positiva</b> per ogni $\varepsilon_r>1$: la lastra è sempre tirata dentro, mai respinta. È <b>massima quando la lastra è appena entrata</b> ($x=0$) e <i>cala</i> mentre entra — quindi il moto non è uniformemente accelerato, e se l'esercizio chiede la velocità d'ingresso serve l'energia, non la forza. E non dipende da $d$ separatamente ma solo attraverso $k$: raddoppiando la distanza fra le armature, a parità di carica, la forza raddoppia.</p>
    <p><b>Dove agisce, ed è la domanda insidiosa.</b> Il campo dentro il condensatore è uniforme e parallelo alle armature non tira niente: la forza nasce tutta dal <b>campo di bordo</b>, quello disordinato che esce dai lati e che nel modello idealizzato si trascina. È il caso raro in cui una grandezza si calcola esattamente con l'energia proprio perché il bilancio energetico non ha bisogno di sapere <i>dove</i> la forza agisce — mentre un conto diretto con $\sigma_p$ richiederebbe il campo di bordo, che non sappiamo scrivere.</p>
    <p>Se invece il condensatore resta <b>collegato</b> al generatore, il conto va rifatto con $\Delta V$ costante: $U=\frac12C\Delta V^{2}$ cresce con $x$, e la forza <i>non</i> è $-dU/dx$ — bisogna contare anche il lavoro del generatore, che è il doppio della variazione di energia immagazzinata. Il risultato è $F=+\frac12\frac{dC}{dx}\Delta V^{2}$, di nuovo positiva. <b>Le due strade danno lo stesso verso, come devono</b>: la lastra non sa a cosa è collegato il condensatore.</p>`}
   ]}
]},

/* ---------------- 06 · IL SENSO ---------------- */
{ num:'06', title:'Il senso, e le rotte', meta:'cosa chiude, cosa apre, e dove la polarizzazione riappare',
  blocchi:[
  {t:'prosa', title:'Cosa lascia in mano', tag:'sintesi', html:R`
  <p><b>A monte.</b> Gauss resta la stessa legge; cambia solo quali cariche si decide di contare. Il conduttore diventa il caso limite $\varepsilon_r\to\infty$ — un dielettrico infinitamente polarizzabile — e i due casi smettono di essere due capitoli separati.</p>
  <p><b>Il punto.</b> $\vec D$ non è un campo più fondamentale di $\vec E$: è una <b>contabilità</b>. Separare ciò che controlliamo (le cariche libere) da ciò che il sistema fa in risposta (la polarizzazione) è una mossa che si ripete identica con i materiali magnetici, dove il campo $\vec H$ sta a $\vec B$ come qui $\vec D$ sta a $\vec E$: si costruisce la combinazione la cui sorgente è la sola corrente che si controlla, e si lascia che il materiale risponda.</p>
  <p><b>A valle.</b> L&rsquo;energia $\frac12\vec D\cdot\vec E$ smetterà di essere una formula di comodo e diventerà una densità con un posto nel bilancio energetico; e le due condizioni di raccordo scritte qui nella forma statica sono già, parola per parola, quelle che governano riflessione e rifrazione di un&rsquo;onda — cambia solo che i campi oscillano, e che $\varepsilon_r$ va preso alla frequenza giusta.</p>`},
  {t:'prolessi', title:'Dove riappare questo movimento, nella fisica che farai',
   oggetto:R`<b>La risposta lineare</b>: un materiale reagisce a un campo con una polarizzazione proporzionale, e la costante di proporzionalità è tutto ciò che serve sapere del materiale.`,
   rotte:[
    {dove:'Ottica', txt:R`$\varepsilon_r$ dipende dalla <b>frequenza</b>, e $n=\sqrt{\varepsilon_r}$ è l&rsquo;indice di rifrazione: la dispersione della luce nel prisma è $\varepsilon_r(\omega)$. La legge $\tan\theta'=\varepsilon_r\tan\theta$ di questa tappa e la legge di Snell sono la stessa condizione al contorno a due frequenze diverse.`},
    {dove:'Materia<br>condensata', txt:R`La <b>funzione dielettrica</b> $\varepsilon(\vec q,\omega)$ è l&rsquo;oggetto centrale: contiene la schermatura, i plasmoni, le eccitazioni collettive. La costante $\varepsilon_r$ di qui è il suo valore per $q\to0$, $\omega\to0$ — l&rsquo;angolo più povero di un oggetto molto più ricco.`},
    {dove:'Teoria della<br>risposta lineare', txt:R`$\vec P=\varepsilon_0\chi\vec E$ è il prototipo di ogni <b>suscettività</b>. La stessa struttura governa la risposta magnetica, quella meccanica, e in meccanica statistica lega la suscettività alle <b>fluttuazioni spontanee</b> del sistema (teorema di fluttuazione-dissipazione): la capacità di rispondere a un campo è la stessa cosa del fluttuare da soli.`},
    {dove:'Causalita', txt:R`Poiché la risposta non può precedere la causa, $\varepsilon(\omega)$ è analitica in un semipiano — e questo impone le <b>relazioni di Kramers-Kronig</b> fra la sua parte reale e immaginaria: sapere come un materiale <i>assorbe</i> a tutte le frequenze determina come <i>rifrange</i>. È il ponte con l&rsquo;analisi complessa di Metodi, e non è un&rsquo;analogia.`}
   ],
   domanda:R`In questo movimento $\varepsilon_r$ è un numero: istantaneo, uguale a tutte le frequenze, e con la risposta rigorosamente proporzionale al campo. Nessuna delle tre cose è vera. <b>Domanda che porti avanti:</b> cosa succede se la polarizzazione <i>ricorda</i> — se $\vec P(t)$ dipende da tutta la storia di $\vec E$ e non solo dal suo valore adesso? La risposta trasforma $\varepsilon_r$ in una funzione complessa della frequenza, fa comparire l&rsquo;assorbimento come parte immaginaria, e lega le due parti da un integrale che è pura analisi complessa. È il punto in cui questo corso e Metodi smettono di essere due esami diversi.`}
]}

];

function sectionGram(title, rows){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag gramtag">grammatica</span></h3>';
  var inner='<table class="gramtab">';
  rows.forEach(function(r){ inner+='<tr><td class="gs">'+r[0]+'</td><td>'+r[1]+'</td></tr>'; });
  inner+='</table>';
  var body=elFromHTML('<div class="gramwrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
/* --- blocco PLOT: la figura non decora, si legge. Ogni plot porta una chiave di lettura. --- */
function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';
  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
    else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
    else if(b.t==='prolessi') m.appendChild(sectionProlessi(b));
    else if(b.t==='reveal')m.appendChild(sectionReveal(b.title,b.tag,b.steps));
    else if(b.t==='esercizio') m.appendChild(sectionEsercizio(b));
    else if(b.t==='collaudo')  m.appendChild(sectionCollaudo(b.title,b.items));
    else if(b.t==='plot')      m.appendChild(sectionPlot(b));
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}

/* deep-link: em-05-dielettrici.html#03 apre direttamente la tappa 03 */
window.addEventListener('DOMContentLoaded', function(){
  var h=(location.hash||'').replace('#','');
  showTappa(byId[h]?h:'00');
});
window.addEventListener('hashchange', function(){
  var h=(location.hash||'').replace('#','');
  if(byId[h]) showTappa(h);
});
</script>
