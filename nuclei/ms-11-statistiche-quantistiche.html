   <p>Vale la pena mettere i numeri, perché il contrasto è violento. Per l&rsquo;<b>aria</b> a condizioni standard ($n\simeq2{,}7\times10^{25}\,\mathrm{m^{-3}}$, molecole di azoto con $m\simeq4{,}65\times10^{-26}$ kg, $T=300$ K) la lunghezza termica vale una frazione di ångström e</p>
   <p style="text-align:center">$n\lambda^3\simeq1{,}865\times10^{-7}$</p>
   <p>cioè sette ordini di grandezza sotto la soglia: l&rsquo;aria è classica con enorme margine. Per gli <b>elettroni di conduzione di un metallo</b> ($n\simeq10^{28}\,\mathrm{m^{-3}}$, massa dell&rsquo;elettrone, stessa temperatura) la lunghezza termica è di qualche nanometro e</p>
   <p style="text-align:center">$n\lambda^3\simeq7{,}97\times10^{2}$</p>
   <p>cioè ottocento volte sopra la soglia. <b>Nella stessa stanza, alla stessa temperatura, due gas distanti nove ordini di grandezza nel parametro che decide se la meccanica quantistica conti.</b> Crisanti mette la stessa osservazione in una tabella (pag. 230): idrogeno gassoso $T_0\simeq5\times10^{-2}$ K, elio liquido $T_0\simeq2$ K, elettroni in un metallo $T_0\simeq10^4$ K — e per l&rsquo;elio la temperatura di degenerazione coincide, con precisione sospetta, con i $2{,}17$ K a cui si osserva la transizione superfluida.</p>
   <p><span class="str" data-str="ordini-di-grandezza">Un controllo d&rsquo;ordine di grandezza sulla tabella</span>, perché conviene sempre farlo: con i valori che Crisanti stesso dà per gli elettroni ($n=10^{22}\,\mathrm{cm^{-3}}=10^{28}\,\mathrm{m^{-3}}$) la formula restituisce</p>
   <p style="text-align:center">$T_0\simeq2{,}578\times10^{4}$ K</p>
   <p>contro il $10^4$ K stampato. Il fattore è $2{,}6$: la tabella sta dando l&rsquo;ordine di grandezza e non il valore, il che è legittimo e va saputo — chi la usa per un conto numerico sbaglia di due volte e mezza.</p>`}
  ]},
  {t:'prosa', title:'La prima correzione quantistica al numero di occupazione', tag:'grammatica', html:R`
  <p>Il limite classico non è un interruttore: è il primo termine di uno sviluppo, e il secondo termine dice <i>in che direzione</i> ciascuna statistica devia. Si parta dall&rsquo;occupazione esatta e si raccolga l&rsquo;esponenziale al denominatore, con $x\equiv\beta(\varepsilon-\mu)$:</p>
  $$\frac{1}{e^{x}\mp1}=\frac{e^{-x}}{1\mp e^{-x}}=e^{-x}\left(1\pm e^{-x}+e^{-2x}+\dots\right)$$
  <p>dove si è usata la serie geometrica di ragione $\pm e^{-x}$, lecita perché nel regime classico $e^{-x}\ll1$. Riordinando per potenze:</p>
  $$\langle n_\varepsilon\rangle=e^{-x}\pm e^{-2x}+O(e^{-3x})$$
  <p>Il primo termine è Maxwell-Boltzmann; il secondo è la prima correzione quantistica, ed è <b>positivo per i bosoni e negativo per i fermioni</b>. Detto in parole: a parità di tutto il resto i bosoni occupano un livello <i>più</i> di quanto farebbero particelle indipendenti, i fermioni <i>meno</i>. La statistica quantistica si comporta, al primo ordine, come un&rsquo;interazione efficace — attrattiva per i bosoni, repulsiva per i fermioni — che non è nell&rsquo;hamiltoniana e nasce solo dalla simmetria della funzione d&rsquo;onda. Landau, citato in inglese da Grilli-Giardina (pag. 55), la chiama «a peculiar mutual effect of particles that are in the same quantum state (called the exchange effect)».</p>
  <p>Questa correzione, sommata su tutti i livelli, produrrà nella tappa 08 la prima deviazione dall&rsquo;equazione di stato dei gas perfetti — con lo stesso segno, e quindi con la stessa lettura: i fermioni spingono di più, i bosoni di meno.</p>`},
  {t:'plot', title:'La frontiera della degenerazione nel piano densita-temperatura',
   intro:R`Curve di livello di $\log_{10}(n\lambda^3)$ nel piano $(\log_{10}T,\ \log_{10}n)$, con $T$ in kelvin e $n$ in metri alla meno tre. Ogni linea è il luogo $n\lambda^3=1$ per una specie diversa — la posizione della linea dipende dalla massa, la pendenza no. Sopra la linea il gas è quantistico, sotto è classico.`,
   plots:[
    {kind:'contour', f:'y-1.5*x-21.382', xr:[-1,4], yr:[20,30], levels:[0], equal:false, height:400,
     col:'#4c8dff', width:2.4, label:'elettroni (massa m_e)',
     overlays:[
      {f:'y-1.5*x-27.177', levels:[0], col:'#5eead4', width:2.4, label:'elio-4 (massa 4 u)'},
      {f:'y-1.5*x-28.444', levels:[0], col:'#d8a13a', width:2.4, label:'azoto molecolare (massa 28 u)'}
     ],
     marks:[
      {x:2.477, y:28, label:'elettroni in un metallo, 300 K', col:'#4c8dff', up:true, left:true},
      {x:0.301, y:28.301, label:'elio-4 liquido, 2 K', col:'#5eead4'},
      {x:2.477, y:25.431, label:'aria a STP', col:'#d8a13a'}
     ],
     title:'frontiera n lambda^3 = 1 per tre specie', xlabel:'log10 (T / K)', ylabel:'log10 (n / m^-3)'}
   ],
   leggi:R`<p><b>Che cosa guardare: tre rette parallele, e il punto che sta dalla parte sbagliata.</b> Le tre linee hanno tutte pendenza $3/2$ — perché $n\lambda^3=1$ si scrive $\log n=\tfrac32\log T+\text{cost}$, e la costante è l&rsquo;unica cosa che dipende dalla massa. Uno stesso punto del piano può quindi stare <i>sopra</i> la linea di una specie e <i>sotto</i> quella di un&rsquo;altra, e i due pallini a $T=300$ K sono esattamente questo: l&rsquo;aria (pallino ambra) sta parecchio sotto la sua linea, gli elettroni (pallino blu) stanno parecchio sopra la loro. <b>Non è la temperatura a decidere se un gas è quantistico, è la posizione relativa alla propria frontiera.</b></p>
   <p><b>Che cosa impararne sulla massa.</b> La distanza verticale fra la linea degli elettroni e quella dell&rsquo;azoto è di circa sette decadi, e viene tutta dal rapporto delle masse: $\lambda\propto m^{-1/2}$, quindi $\lambda^3\propto m^{-3/2}$, e il rapporto fra la massa di una molecola di azoto e quella dell&rsquo;elettrone vale</p>
   <p style="text-align:center">$\dfrac{4{,}65\times10^{-26}}{9{,}109\times10^{-31}}\simeq5{,}105\times10^{4}$</p>
   <p>che elevato a $3/2$ dà $1{,}153\times10^{7}$. <b>Una particella cinquantamila volte più leggera è dieci milioni di volte più quantistica a parità di densità e temperatura.</b> È la stessa ragione per cui il protone in un nucleo e l&rsquo;elettrone in un atomo si comportano in modo così diverso.</p>
   <p><b>Che cosa impararne per gli esercizi.</b> Il pallino dell&rsquo;elio liquido sta appena <i>sopra</i> la sua linea: il valore è $n\lambda^3\simeq4{,}697$, cioè dello stesso ordine dell&rsquo;unità. È il caso interessante — né classico né profondamente degenere — ed è anche il più difficile, perché è l&rsquo;unico in cui nessuno dei due sviluppi (piccola fugacità, temperatura quasi nulla) funziona e bisogna risolvere numericamente l&rsquo;equazione per $z$. Un esercizio che chiede un conto analitico sta implicitamente promettendo di stare lontano da quella striscia.</p>
   <p><b>Dove questa figura mente.</b> Tratta $\lambda$ come se valesse sempre la formula non relativistica, e per gli elettroni in un metallo bianco-nano questo è falso; e disegna una <i>linea</i> dove c&rsquo;è una transizione graduale, perché $n\lambda^3=1$ non è una soglia fisica ma il punto in cui un parametro attraversa l&rsquo;unità. Gli effetti quantistici non si accendono lì: cominciano a $n\lambda^3\simeq10^{-1}$ e sono dominanti a $n\lambda^3\simeq10$.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Si dice che il limite classico è quello di «alta temperatura». Ma la condizione $n\lambda^3\ll1$ contiene anche la densità. Quale delle due comanda?`,
    a:R`Nessuna delle due da sola: comanda il rapporto fra il volume termico e il volume per particella. Il criterio da riconoscere è che $n\lambda^3=\lambda^3/v$ con $v=V/N$, cioè un <b>rapporto di volumi</b>, e lo si può rendere piccolo scaldando (che riduce $\lambda$ come $T^{-1/2}$) oppure diluendo (che aumenta $v$). Grilli-Giardina lo dicono così: «il volume termico deve essere molto minore del volume specifico… si può ottenere aumentando sufficientemente la temperatura oppure diminuendo abbastanza la densità». La conseguenza operativa è che un gas può essere <i>quantistico e caldo</i> se è abbastanza denso — gli elettroni di una nana bianca sono degeneri a milioni di gradi — e <i>classico e freddo</i> se è abbastanza rarefatto.`},
   {q:R`Nel limite classico si ritrova la divisione per $N!$ del conteggio di Boltzmann. Ma la statistica quantistica non ha mai diviso per $N!$. Da dove salta fuori?`,
    a:R`Salta fuori dalla struttura della somma, e il conto è quello della tappa 02. Nel gran canonico il coefficiente di $z^N$ è $Z(T,V,N)$; nel limite $z\ll1$ ogni fattore $(1\mp x_p)^{\mp1}$ vale $1+x_p+O(x_p^2)$, quindi il coefficiente di $z^N$ è la somma dei prodotti di $N$ fattori $e^{-\beta\varepsilon_p}$ con indici <b>tutti diversi</b> — che è $\big(\sum_pe^{-\beta\varepsilon_p}\big)^N/N!$ a meno di termini con indici ripetuti. Il criterio invocato è che quei termini ripetuti pesano $O(\langle n\rangle)$ rispetto agli altri: trascurarli è esattamente l&rsquo;ipotesi di occupazione piccola. <b>L&rsquo;$N!$ di Boltzmann non è un postulato né un rattoppo: è il numero di permutazioni di $N$ indici distinti, e vale finché gli indici sono distinti.</b>`}
  ]}
]},

/* ---------------- 05 · LA DENSITA DEGLI STATI ---------------- */
{ num:'05', title:'La densita degli stati: contare i modi in una scatola, e poi con un potenziale qualunque', meta:'condizioni al contorno periodiche · il fattore di spin · la forma in d dimensioni · il caso con potenziale esterno',
  blocchi:[
  {t:'reveal', title:'Dai modi della scatola alla misura sugli impulsi', tag:'costruzione', steps:[
   {label:'Quantizzare gli impulsi, e contare quanti stati stanno in un volumetto', body:R`
   <p>Tutte le formule costruite finora vivono su un indice discreto $p$ che etichetta gli autostati di singola particella. Per calcolare qualunque cosa bisogna sapere <b>quanti sono</b>, e per saperlo bisogna metterli in una scatola.</p>
   <p>Si prenda un cubo di lato $L$ e si impongano condizioni al contorno periodiche, $\psi(x+L,y,z)=\psi(x,y,z)$: Grilli-Giardina (pag. 79) le scelgono perché sono le più comode e perché nel limite termodinamico la scelta non conta. Le autofunzioni di $-\tfrac{\hbar^2}{2m}\nabla^2\psi=\varepsilon\psi$ sono onde piane normalizzate</p>
   $$\varphi_{\vec p}(\vec x)=\frac{1}{\sqrt V}e^{i\vec p\cdot\vec x/\hbar},\qquad V=L^3$$
   <p>e la periodicità seleziona gli impulsi ammessi:</p>
   $$\vec p=\frac{2\pi\hbar}{L}\,(n,l,m),\qquad (n,l,m)\in\mathbb Z^3$$
   <p>con autovalori $\varepsilon_{\vec p}=p^2/2m$. <b>Gli stati sono dunque i punti di un reticolo cubico nello spazio degli impulsi</b>, di passo $2\pi\hbar/L=h/L$, e il volume che ciascuno occupa è $(h/L)^3=h^3/V$. Da qui il fatto che useremo cento volte: in un volumetto $d^3p$ dello spazio degli impulsi stanno</p>
   $$\frac{V}{h^3}\,d^3p$$
   <p>stati. Ed è anche la risposta alla domanda «da dove viene l&rsquo;$h^3$ che in meccanica statistica classica si mette a mano»: <b>viene dal passo di un reticolo</b>, e nel conteggio quantistico non è una convenzione ma un teorema.</p>
   <p>La sostituzione della somma con l&rsquo;integrale si scrive allora componente per componente. Siccome $p_x=(2\pi\hbar/L)n$, la spaziatura è $\Delta p_x=2\pi\hbar/L$, e</p>
   $$\sum_{p_x}=\frac{L}{2\pi\hbar}\sum_n\Delta p_x\ \longrightarrow\ \frac{L}{2\pi\hbar}\int dp_x$$
   <p>cioè la definizione stessa di integrale di Riemann, valida quando la funzione sommata varia poco su una spaziatura. Moltiplicando le tre componenti:</p>
   $$\sum_{\vec p}\ \longrightarrow\ \frac{V}{(2\pi\hbar)^3}\int d^3p=\frac{V}{h^3}\int d^3p$$
   <p>Crisanti (pag. 233) scrive la stessa sostituzione e la completa osservando che, siccome le posizioni sono libere in $V$, la forma simmetrica è $\int d^3r\,d^3p/h^3$ — cioè, letteralmente, <b>lo spazio delle fasi misurato in celle di volume $h^3$</b>.</p>`},
   {label:'Lo spin, e il fattore che in mezza riga fa sbagliare un compito', body:R`
   <p>Una particella con spin $S$ non ha un solo stato per ogni impulso, ne ha $2S+1$ — uno per ogni proiezione. Il conteggio va quindi moltiplicato per la <b>degenerazione di spin</b></p>
   $$g_s=2S+1$$
   <p>e Grilli-Giardina lo dicono con l&rsquo;esempio che basta a ricordarlo: gli elettroni hanno $S=\tfrac12$ e quindi $g_s=2$, che conta semplicemente lo stato «su» e quello «giù». Crisanti (pag. 233) aggiunge la lettura fisica, che è più profonda di quanto sembri: se l&rsquo;energia non dipende dallo spin, il numero di occupazione è lo stesso per ogni proiezione, e allora <b>«le particelle con diverse orientazioni dello spin formano gas indipendenti, ognuno contenente $N/(2S+1)$ particelle»</b>. Non c&rsquo;è un gas di elettroni: ci sono due gas di elettroni che non si parlano, e il fattore due è il numero dei gas.</p>
   <p>Da qui discendono due avvertenze, entrambe con conseguenze immediate su un compito.</p>
   <p><b>Prima: la moltiplicazione per $g_s$ è lecita solo se l&rsquo;energia non dipende dallo spin.</b> È scritto in entrambe le fonti (Crisanti pag. 260: «questo è lecito solo se l&rsquo;energia non dipende dallo spin»; Grilli-Giardina pag. 99: «only if the hamiltonian does not depend on the spin»). Se c&rsquo;è un campo magnetico che separa le proiezioni, i $g_s$ gas hanno energie diverse e <i>non</i> si può moltiplicare: bisogna sommare $g_s$ contributi, ciascuno con il suo $\varepsilon$ spostato. È la struttura di ogni esercizio sul paramagnetismo di Pauli.</p>
   <p><b>Seconda, ed è il disaccordo (c): $g_s$ galleggia fra le fonti.</b> Grilli-Giardina definiscono $G(\varepsilon)$ <i>senza</i> spin e poi scrivono sempre $g_sG(\varepsilon)$ davanti agli integrali; Crisanti lo incorpora dentro $dN_\varepsilon$; ed <i>entrambi</i> annotano, con le stesse parole, che «a volte si incorpora in $G$ anche il fattore $g$». Non è una differenza di fisica, ma chi legge una formula da una fonte e la combina con una dell&rsquo;altra <b>moltiplica per $g_s$ due volte</b>, e per gli elettroni sbaglia di un fattore due su $N$, di $2^{-2/3}$ su $\varepsilon_F$ e di $2^{-2/3}$ su $T_c$. Convenzione adottata qui, dichiarata una volta per tutte: <b>$G(\varepsilon)$ NON contiene lo spin, e il fattore $g_s$ è sempre scritto esplicitamente.</b></p>`},
   {label:'La densita di stati come integrale con la delta, e la sua forma in d dimensioni', body:R`
   <p>La definizione generale, quella che Crisanti (pag. 260) indica come il punto di partenza di ogni esercizio, usa la <span class="str" data-str="delta-di-dirac">delta di Dirac</span> per selezionare la superficie di energia costante:</p>
   $$G(\varepsilon)=\int\frac{d^dq\,d^dp}{h^d}\,\delta\big(\varepsilon-H(q,p)\big)$$
   <p>e vale la pena dire che cosa <i>è</i>: il numero di stati di <b>singola</b> particella per unità di energia. Crisanti lo chiama «un parente di $\Gamma(\varepsilon)$, ma relativo a una singola particella», e la parentela è tutta qui.</p>
   <p>Si calcoli per il gas libero in tre dimensioni, con il metodo che generalizza meglio — la delta come derivata della theta. Con $H=p^2/2m$ le posizioni danno un fattore $V$, e</p>
   $$G(\varepsilon)=\frac{V}{h^3}\,4\pi\frac{\partial}{\partial\varepsilon}\int_0^{\sqrt{2m\varepsilon}}dp\,p^2=\frac{V}{h^3}\frac{4\pi}{3}\frac{\partial}{\partial\varepsilon}(2m\varepsilon)^{3/2}$$
   <p>dove si è usato che $\theta(\varepsilon-p^2/2m)$ è diverso da zero per $p\lt\sqrt{2m\varepsilon}$. Derivando la potenza:</p>
   $$\frac{\partial}{\partial\varepsilon}(2m\varepsilon)^{3/2}=3m\sqrt{2m\varepsilon}$$
   <p>e quindi, raccogliendo,</p>
   $$G(\varepsilon)=2\pi V\left(\frac{2m}{h^2}\right)^{3/2}\sqrt{\varepsilon}$$
   <p>che è la forma in cui la scrivono entrambe le fonti. Una scrittura equivalente, comoda perché fa comparire la lunghezza termica, è</p>
   $$G(\varepsilon)=\frac{2V}{\sqrt\pi}\frac{\beta^{3/2}}{\lambda^3}\sqrt\varepsilon$$
   <p>e le due coincidono perché $\beta^{3/2}/\lambda^3=(2\pi m)^{3/2}/h^3$, che non dipende dalla temperatura — il $\beta^{3/2}$ e il $\lambda^{-3}$ si mangiano a vicenda la dipendenza da $T$, come devono, visto che $G$ è una proprietà puramente geometrica.</p>
   <p><b>La forma in $d$ dimensioni</b>, che serve perché gli esercizi la chiedono spesso in una o due. Si usa $\delta(\varepsilon-p^2/2m)=\delta(p-p_0)\,m/p_0$ con $p_0=\sqrt{2m\varepsilon}$ — la regola $\delta(f(x))=\sum_k\delta(x-x_k)/|f'(x_k)|$, con la sola radice positiva che sopravvive — e si integra sull&rsquo;angolo solido di $\mathbb R^d$, la cui misura totale è $2\pi^{d/2}/\Gamma(d/2)$:</p>
   $$G_d(\varepsilon)=\frac{V_d}{h^d}\frac{2\pi^{d/2}}{\Gamma(d/2)}\,m\,(2m)^{\frac d2-1}\,\varepsilon^{\frac d2-1}$$
   <p>Tutto il contenuto sta nell&rsquo;esponente: <b>$G_d\propto\varepsilon^{d/2-1}$</b>, quindi cresce come $\sqrt\varepsilon$ in tre dimensioni, è <i>costante</i> in due, e <i>diverge</i> come $\varepsilon^{-1/2}$ in una. I tre casi si ritrovano dalla formula generale:</p>
   $$G_3=2\pi V\left(\frac{2m}{h^2}\right)^{3/2}\sqrt\varepsilon,\qquad G_2=\frac{2\pi mA}{h^2},\qquad G_1=\frac{L}{h}\sqrt{\frac{2m}{\varepsilon}}$$
   <p>e sono esattamente i tre che Grilli-Giardina calcolano uno per uno (pag. 63-64) passando in coordinate polari sferiche, poi piane, poi usando la parità in una dimensione. <b>Il comportamento a energia piccola è opposto nei tre casi</b>, e la tappa 06 mostrerà che è lì che si decide tutto.</p>`}
  ]},
  {t:'prosa', title:'Con un potenziale esterno: la forma che gli scritti chiedono davvero', tag:'costruzione', html:R`
  <p>Nelle prove di questo corso l&rsquo;hamiltoniana di singola particella non è quasi mai quella libera: è</p>
  $$H=\frac{|\vec p|^2}{2m}+V(\vec q)$$
  <p>con $V$ costante a tratti, armonico, lineare, o una buca. Il conto è però lo stesso, e conviene organizzarlo una volta sola perché poi si applica a occhi chiusi.</p>
  <p>Si parte dalla definizione e si separa: la delta contiene le posizioni solo attraverso $V(\vec q)$, quindi <b>si integra prima sugli impulsi a posizione fissata</b>, con l&rsquo;energia disponibile ridotta di $V(\vec q)$. Grilli-Giardina (pag. 62) lo scrivono ponendo $\bar\varepsilon\equiv\varepsilon-V(q)$:</p>
  $$G(\varepsilon)=\int\frac{d^dq}{h^d}\,\theta\big(\varepsilon-V(q)\big)\int d^dp\;\delta\!\left(\bar\varepsilon-\frac{|\vec p|^2}{2m}\right)$$
  <p>e la $\theta$ <b>non è parte dello sviluppo della delta</b>: è l&rsquo;esplicitazione della condizione che la delta impone, cioè che $\bar\varepsilon$ sia positivo, perché $|\vec p|^2/2m$ non può essere negativo. Le note lo sottolineano proprio così, ed è l&rsquo;errore più comune: dimenticare la $\theta$ significa integrare su regioni dove la particella non può stare, e ottenere una densità di stati che non si annulla dove dovrebbe.</p>
  <p>L&rsquo;integrale sugli impulsi è quello già fatto, con $\varepsilon$ sostituito da $\bar\varepsilon$. Dunque, in tutta generalità,</p>
  $$G(\varepsilon)=\frac{2\pi^{d/2}}{\Gamma(d/2)}\frac{m(2m)^{\frac d2-1}}{h^d}\int d^dq\;\big[\varepsilon-V(\vec q)\big]^{\frac d2-1}\theta\big(\varepsilon-V(\vec q)\big)$$
  <p><b>Questa formula è la macchina.</b> Contiene tutti i casi d&rsquo;esame, e il lavoro che resta è sempre e solo l&rsquo;integrale sulle posizioni.</p>
  <p><b>Il caso a gradini, svolto.</b> Sia $d=1$ e sia $V$ costante a tratti: $V=0$ per $0\le q\le L$, $V=V_0$ per $L\le q\le 2L$, $V=2V_0$ per $2L\le q\le3L$. Con $d=1$ l&rsquo;esponente vale $-\tfrac12$ e il prefattore è $\sqrt{2m}/h$ (da $2\pi^{1/2}/\Gamma(1/2)=2$ e $m(2m)^{-1/2}=\sqrt{m/2}$, il cui doppio è $\sqrt{2m}$). Ogni tratto contribuisce la sua lunghezza $L$ moltiplicata per il suo integrando, e</p>
  $$G(\varepsilon)=\frac{L}{h}\sqrt{2m}\left[\frac{\theta(\varepsilon)}{\sqrt\varepsilon}+\frac{\theta(\varepsilon-V_0)}{\sqrt{\varepsilon-V_0}}+\frac{\theta(\varepsilon-2V_0)}{\sqrt{\varepsilon-2V_0}}\right]$$
  <p>che è esattamente il risultato che Crisanti ottiene svolgendo l&rsquo;esercizio d&rsquo;esame del 2014 (pag. 291) per la via alternativa, derivando la theta. <b>La struttura da riconoscere è a scalini</b>: ogni volta che l&rsquo;energia supera un nuovo gradino, una nuova regione dello spazio diventa accessibile e la densità di stati fa un salto verso l&rsquo;alto. In tre dimensioni i salti sarebbero continui ma con derivata discontinua; in una dimensione, per via del $\varepsilon^{-1/2}$, sono divergenze integrabili. Crisanti annota il punto tecnico che le fa funzionare: <b>«le funzioni $\theta$ attraversano le derivate»</b>, cioè derivando $\sqrt{\varepsilon-V_0}\,\theta(\varepsilon-V_0)$ il termine con $\delta(\varepsilon-V_0)$ è moltiplicato per una radice che si annulla, e sparisce.</p>`},
  {t:'plot', title:'La densita di stati nelle tre dimensioni, e cosa succede a energia piccola',
   intro:R`Densità di stati di una particella libera in funzione dell&rsquo;energia, in unità in cui il prefattore vale uno, per $d=1,2,3$: le tre curve sono $\varepsilon^{-1/2}$, $\varepsilon^{0}$ e $\varepsilon^{1/2}$. La differenza fra loro vive tutta vicino all&rsquo;origine.`,
   plots:[
    {kind:'func2d', xr:[0.02,4], yr:[0,4], height:330, ticks:6,
     title:'densita di stati per d = 1, 2, 3',
     curves:[
      {f:'1/sqrt(x)', col:'#ff6b6b', label:'d = 1: diverge come 1/radice di E'},
      {f:'1', col:'#d8a13a', label:'d = 2: costante'},
      {f:'sqrt(x)', col:'#4c8dff', label:'d = 3: si annulla come radice di E'}
     ],
     xlabel:'energia (unita arbitrarie)', ylabel:'G(E) (unita arbitrarie)'}
   ],
   leggi:R`<p><b>Che cosa guardare: il comportamento a $\varepsilon\to0$, e soltanto quello.</b> Le tre curve si somigliano a energia alta e fanno tre cose opposte a energia bassa. In tre dimensioni $G$ <b>va a zero</b>: lo stato fondamentale e i suoi vicini hanno peso nullo nel conteggio continuo. In due dimensioni $G$ resta <b>finita</b>. In una dimensione $G$ <b>diverge</b>: vicino al fondo ci sono, in un certo senso, infiniti stati per unità di energia.</p>
   <p><b>Che cosa impararne, ed è il punto di tutto il movimento.</b> Il numero di particelle si ottiene integrando $G(\varepsilon)n(\varepsilon)$, e l&rsquo;occupazione bosonica diverge come $1/\varepsilon$ quando $\mu\to0$. Il prodotto vicino all&rsquo;origine va dunque come $\varepsilon^{d/2-2}$, e l&rsquo;integrale converge se e solo se $d/2-2\gt-1$, cioè $d\gt2$. <b>In tre dimensioni l&rsquo;integrale ha un valore massimo finito, e quindi può non bastare a contenere tutte le particelle; in una dimensione è infinito, e quindi le contiene sempre.</b> Le tre curve di questa figura sono la ragione per cui un gas di bosoni in tre dimensioni fa una cosa che in una dimensione non può fare.</p>
   <p><b>Che cosa impararne per i conti.</b> In un problema di esame l&rsquo;esponente di $G$ è la prima cosa da scrivere, perché da solo fissa la dipendenza dalla temperatura di tutto il resto: se $G\propto\varepsilon^{a-1}$, allora $N\propto T^{a}$ a fugacità fissata, $E\propto T^{a+1}$ e $C_V\propto T^{a}$. Sbagliare l&rsquo;esponente non sposta un coefficiente, sposta una legge di potenza.</p>
   <p><b>Dove questa figura mente.</b> Disegna curve lisce fin quasi a zero, mentre lo spettro vero è <i>discreto</i> e la densità di stati è una somma di delta. La curva liscia è già il risultato della sostituzione somma-integrale, cioè della tappa seguente — e proprio nella regione dove la figura è più interessante, vicino all&rsquo;origine, quella sostituzione è meno giustificata.</p>`}
]},

/* ---------------- 06 · LA SOSTITUZIONE SOMMA-INTEGRALE E LA SUA CREPA ---------------- */
{ num:'06', title:'Quando e lecito sostituire la somma con un integrale, e il termine che si perde facendolo', meta:'la spaziatura dei livelli contro la temperatura · il peso nullo del fondamentale · la regolarizzazione · dove la crepa si apre e dove no',
  blocchi:[
  {t:'prosa', title:'La condizione di liceita, e quanto e larga', tag:'costruzione', html:R`
  <p>La sostituzione $\sum_{\vec p}\to(V/h^3)\int d^3p$ è stata introdotta nella tappa 05 come definizione di integrale di Riemann, e come ogni definizione di quel tipo richiede che la funzione sommata <b>vari poco su una spaziatura</b>. Vale la pena vedere quanto larga sia questa condizione, perché la risposta è «larghissima», ed è ciò che rende sorprendente il fatto che possa comunque fallire.</p>
  <p>La spaziatura in energia fra livelli adiacenti in una scatola cubica si legge da $\varepsilon=h^2(n^2+l^2+m^2)/(2mL^2)$: l&rsquo;incremento elementare, quello fra $n=0$ e $n=1$ lungo un asse, vale</p>
  $$\Delta\varepsilon=\frac{h^2}{2mL^2}$$
  <p>e la funzione da sommare, l&rsquo;occupazione, varia su una scala di energia pari a $T$. La sostituzione è lecita quando $\Delta\varepsilon\ll T$. <span class="str" data-str="ordini-di-grandezza">Si mettano i numeri</span> nel caso peggiore che un laboratorio possa produrre — un elettrone (la massa più piccola disponibile, quindi la spaziatura più grande) in un campione di un centimetro, a un solo kelvin:</p>
  <p style="text-align:center">$\dfrac{\Delta\varepsilon}{k_BT}\simeq1{,}745\times10^{-10}$</p>
  <p>Dieci ordini di grandezza di margine, nel caso più sfavorevole. <b>Per qualunque sistema macroscopico la sostituzione non è un&rsquo;approssimazione: è un&rsquo;identità entro qualunque precisione sperimentale.</b> Ed è proprio questo a rendere istruttivo il modo in cui, ciononostante, può dare una risposta assurda.</p>`},
  {t:'reveal', title:'Il termine che riceve peso nullo, e perche puo valere quanto tutto il resto', tag:'costruzione', steps:[
   {label:'Il conto che fa sparire particelle', body:R`
   <p>Si scriva il numero di particelle di un gas di bosoni in tre dimensioni con la formula della tappa 05, a $\mu\le0$:</p>
   $$\frac NV=2\pi g_s\left(\frac{2m}{h^2}\right)^{3/2}\int_0^{\infty}d\varepsilon\;\frac{\varepsilon^{1/2}}{e^{\beta(\varepsilon-\mu)}-1}$$
   <p>Si tenga $N/V$ fissato e si abbassi la temperatura. L&rsquo;integrale, a $\mu$ fissato, <i>diminuisce</i> — l&rsquo;occupazione di ogni livello cala — quindi per mantenere l&rsquo;uguaglianza bisogna far crescere $\mu$, cioè far crescere $z$. Ma $z$ non può superare l&rsquo;unità, perché $\mu$ non può superare il fondamentale. Esiste dunque una temperatura, chiamiamola $T_c$, alla quale $z$ arriva a $1$ e non può più salire.</p>
   <p>E sotto quella temperatura? La formula, presa alla lettera, dice che <b>$N$ diminuisce</b>. Grilli-Giardina (pag. 100) reagiscono come si deve: «that&rsquo;s a stupid conclusion! It says that we can make particles disappear by making them cold. Where did they go?». Non possono essere andate nelle fluttuazioni, perché nel limite termodinamico $\Delta N\sim\sqrt N$ è troppo piccolo per giustificare la perdita. <b>La conclusione obbligata è che c&rsquo;è un errore nel conto</b>, e le note lo dicono senza mezzi termini: «in fact, we did make a mistake in the calculation. It happened right at the beginning, when we replaced the sum with the integral».</p>`},
   {label:'Dove esattamente il conto perde il pezzo', body:R`
   <p>Si torni alla somma vera:</p>
   $$N=\sum_{\vec p}\langle n_{\vec p}\rangle=\sum_{\vec p}\frac{1}{z^{-1}e^{\beta\varepsilon_{\vec p}}-1}$$
   <p>Il primo termine, quello con $\vec p=0$ e dunque $\varepsilon=0$, vale</p>
   $$\langle n_0\rangle=\frac{1}{z^{-1}-1}=\frac{z}{1-z}$$
   <p>e questa quantità <b>diverge</b> quando $z\to1$: può essere resa grande quanto si vuole. Tutti gli altri termini, invece, tendono a un limite finito, e la loro somma è proprio ciò che l&rsquo;integrale calcola bene.</p>
   <p>Nell&rsquo;integrale, però, quel primo termine <b>non c&rsquo;è</b>. La ragione è la figura della tappa 05: il peso con cui l&rsquo;integrale conta gli stati attorno all&rsquo;energia $\varepsilon$ è $G(\varepsilon)\propto\sqrt\varepsilon$, e</p>
   $$\lim_{\varepsilon\to0}\sqrt{\varepsilon}=0$$
   <p>cosicché lo stato fondamentale riceve peso nullo. Grilli-Giardina lo mettono in una nota di tre parole — «it is given a zero weight» — e Crisanti (pag. 282) lo scrive come proprietà della densità di stati: «si vede che $\lim_{\varepsilon\to0}G(\varepsilon)=0$, e quindi $G(\varepsilon)$ conta male il numero di stati per $\varepsilon=0$».</p>
   <p><b>Il punto delicato non è che un termine sia stato trascurato: è che un termine su $10^{23}$, di solito, si trascura a ragione.</b> Qui non si può, perché quell&rsquo;unico termine non è limitato. Grilli-Giardina lo formulano con precisione: i sommandi divergono per $z\to1$ perché diverge il singolo termine $p=0$, e «thus the single term $p=0$ may be as important as the entire sum». <b>Un solo addendo che vale quanto la somma di tutti gli altri</b> — è la sola circostanza in cui la sostituzione somma-integrale, larga dieci ordini di grandezza, si rompe.</p>`},
   {label:'La riparazione, e dove la crepa non si apre', body:R`
   <p>Il rimedio è quello che Grilli-Giardina chiamano <b>regolarizzazione dell&rsquo;integrale</b>, e consiste nell&rsquo;estrarre a mano i termini che l&rsquo;integrale non sa vedere prima di sostituire il resto:</p>
   $$\frac{PV}{T}=-\sum_{\vec p}\log\left(1-ze^{-\beta\varepsilon_p}\right)=-\frac{4\pi V}{h^3}\int_0^{\infty}dp\,p^2\log\left(1-ze^{-\beta\varepsilon_p}\right)-\log(1-z)$$
   <p>e analogamente, per il numero di particelle,</p>
   $$\frac NV=\frac{g_s}{\lambda^3}\,g_{3/2}(z)+\frac1V\frac{z}{1-z}$$
   <p>dove $g_{3/2}$ è la funzione della tappa 07 e il secondo addendo è $\langle n_0\rangle/V$. Crisanti (pag. 282) chiama quel termine «chiave per capire cosa accade» e lo identifica con «$\bar n_0/V$, una frazione finita di stati nello stato fondamentale». <b>La formula corretta non ha più il difetto</b>: quando l&rsquo;integrale satura, il secondo addendo prende il resto, e nessuna particella sparisce.</p>
   <p><b>Dove la crepa non si apre, che è altrettanto importante.</b> Tre casi, e in tutti e tre la sostituzione resta innocua.</p>
   <p><i>Fermioni, sempre.</i> L&rsquo;occupazione di ogni livello, fondamentale compreso, è limitata da uno. Un termine che vale al più uno, tolto da una somma che vale $N\sim10^{23}$, è irrilevante per costruzione, e non c&rsquo;è nessun valore di $z$ che lo faccia crescere. <b>Per un gas di Fermi la sostituzione somma-integrale non ha crepe</b>, e questa è la vera asimmetria fra i due gas: non il segno nel denominatore, ma il fatto che un denominatore può annullarsi e l&rsquo;altro no.</p>
   <p><i>Bosoni in una dimensione.</i> Qui $G_1\propto\varepsilon^{-1/2}$, quindi l&rsquo;integrando vicino all&rsquo;origine, a $z=1$, si comporta come</p>
   $$\frac{G(\varepsilon)}{e^{\beta\varepsilon}-1}\ \sim\ \frac{\varepsilon^{-1/2}}{\beta\varepsilon}=\frac{1}{\beta}\,\varepsilon^{-3/2}$$
   <p>che <b>non è integrabile</b> in zero. L&rsquo;integrale diverge, il che significa che può assorbire un numero di particelle arbitrariamente grande prima di saturare: <i>non satura mai</i>, e quindi non c&rsquo;è niente da mettere nel fondamentale. Crisanti conclude questo conto (pag. 291) con la frase «non possiamo trovare la soluzione. Ne segue che non c&rsquo;è condensazione di Bose-Einstein».</p>
   <p><i>Bosoni ad alta temperatura.</i> Finché $z$ è lontano da uno, $\langle n_0\rangle=z/(1-z)$ è un numero di ordine uno, e vale l&rsquo;argomento dei fermioni.</p>
   <p><b>Il criterio generale, da portarsi via.</b> La sostituzione somma-integrale è lecita quando <i>nessun singolo termine</i> è confrontabile con la somma. Siccome il termine potenzialmente pericoloso è sempre il fondamentale, il controllo si riduce a una domanda sola: <b>l&rsquo;occupazione del livello più basso resta $O(1)$, o può diventare $O(N)$?</b> La risposta si legge dall&rsquo;esponente della densità di stati e dal segno nel denominatore, cioè dai due oggetti costruiti in questo movimento.</p>`}
  ]},
  {t:'plot', title:'La superficie dell occupazione bosonica, e il muro che si alza a energia nulla',
   intro:R`Occupazione media di Bose-Einstein $\langle n\rangle=1/(e^{\varepsilon/T}-1)$ a potenziale chimico nullo, in funzione della temperatura (asse $x$) e dell&rsquo;energia del livello (asse $y$), tagliata a quota $5$ per poterla disegnare. Trascina per ruotare.`,
   plots:[
    {kind:'surface3d', f:'min(1/(exp(y/x)-1),5)', xr:[0.15,2], yr:[0.05,2], n:34, height:400,
     title:'occupazione di Bose-Einstein nel piano (T, energia)',
     xlabel:'T', ylabel:'energia del livello'}
   ],
   leggi:R`<p><b>Che cosa guardare: il bordo a energia piccola, dove la superficie non ha un valore finito.</b> Lungo tutto il bordo $\varepsilon\to0$ l&rsquo;occupazione sale contro il tetto artificiale a quota cinque, e continuerebbe a salire senza limite: a $\mu=0$ vale $\langle n\rangle\simeq T/\varepsilon$ per $\varepsilon\ll T$, che diverge. <b>Il muro non è un accidente grafico: è la ragione per cui un solo livello può ospitare una frazione finita del gas.</b> Si confronti col resto della superficie, che è dolce e limitata: lontano dall&rsquo;origine l&rsquo;occupazione è un numero di ordine uno e nulla di speciale accade.</p>
   <p><b>Che cosa impararne sul conto della tappa.</b> L&rsquo;integrale $\int d\varepsilon\,G(\varepsilon)\langle n\rangle$ moltiplica quella superficie per $\sqrt\varepsilon$ prima di sommarla, e $\sqrt\varepsilon$ va a zero esattamente dove la superficie va all&rsquo;infinito. Il prodotto è $\varepsilon^{-1/2}$, che è integrabile: <b>l&rsquo;integrale resta finito proprio perché il peso schiaccia il muro</b>. Ed è per questo che l&rsquo;integrale non «vede» ciò che sta accadendo: non è cieco per errore, è cieco per costruzione, e la cecità è la stessa cosa del suo essere finito.</p>
   <p><b>Che cosa impararne sulle isoterme.</b> Tagliando la superficie a $T$ costante si ottiene una curva che scende come $1/\varepsilon$ vicino all&rsquo;origine e poi esponenzialmente; tagliandola a $\varepsilon$ costante si ottiene una curva che cresce <i>linearmente</i> in $T$, perché $1/(e^{\varepsilon/T}-1)\to T/\varepsilon$ per $T$ grande. Quella linearità è l&rsquo;equipartizione classica che riemerge: un modo bosonico caldo contiene $T$ di energia, che è il teorema di Rayleigh-Jeans.</p>
   <p><b>Dove questa figura mente.</b> Pone $\mu=0$ ovunque, mentre a $T$ alta il potenziale chimico è molto negativo e l&rsquo;occupazione è ovunque piccola — la superficie vera, a $N$ fissato, non ha il muro finché non si scende sotto la temperatura critica. E il taglio a quota cinque nasconde proprio la quantità che interessa: quanto <i>sia</i> alto il muro.</p>`}
]},

/* ---------------- 07 · LE GRANDEZZE TERMODINAMICHE IN FORMA UNIFICATA ---------------- */
{ num:'07', title:'Numero, energia e pressione come integrali sulla densita di stati', meta:'le tre formule madri · PV uguale due terzi di E per entrambi i gas · le funzioni di Fermi e di Bose · Gamma e zeta',
  blocchi:[
  {t:'reveal', title:'Le tre formule madri, e la relazione che le lega', tag:'costruzione', steps:[
   {label:'Tradurre le somme sui livelli in integrali sull energia', body:R`
   <p>Tutte le grandezze termodinamiche dei due gas sono somme sui livelli di qualcosa moltiplicato per l&rsquo;occupazione media. Il dizionario della tappa 05 le traduce in integrali, e vale la pena scrivere il passaggio per esteso una volta sola, perché è il modello di tutti gli altri. Usando l&rsquo;identità $\langle n_p\rangle=\int d\varepsilon\,n(\varepsilon)\delta(\varepsilon-\varepsilon_p)$:</p>
   $$N=\sum_p\langle n_p\rangle=\int d\varepsilon\;n(\varepsilon)\;\frac{g_sV}{h^3}\int d^3p\;\delta(\varepsilon-\varepsilon_p)=g_s\int d\varepsilon\;n(\varepsilon)G(\varepsilon)$$
   <p>dove il riconoscimento finale è la definizione stessa di $G$. <b>La delta non è un ornamento</b>: è l&rsquo;oggetto che permette di scambiare l&rsquo;ordine dei due integrali e far comparire la densità di stati come un blocco. Con lo stesso passaggio, mettendo $\varepsilon_p$ dentro la somma:</p>
   $$E=\sum_p\varepsilon_p\langle n_p\rangle=g_s\int d\varepsilon\;\varepsilon\,n(\varepsilon)G(\varepsilon)$$
   <p>e per la pressione, partendo da $PV/T=\log\mathcal Z$ della tappa 02,</p>
   $$\frac{PV}{T}=\mp g_s\int d\varepsilon\;G(\varepsilon)\log\left(1\mp ze^{-\beta\varepsilon}\right)$$
   <p>Queste tre sono le <b>formule madri</b>. Tutto ciò che un esercizio chiede — energia, calore specifico, equazione di stato, entropia — si ottiene da queste tre e dalla condizione che fissa $\mu$, che è la prima: si scrive $N$, la si inverte rispetto a $z$, e si sostituisce. Crisanti riassume l&rsquo;impianto in due righe di notazione, $dN_\varepsilon=G(\varepsilon)n(\varepsilon)d\varepsilon$ con «$n(\varepsilon)$ che include la dipendenza dalla temperatura mentre $G(\varepsilon)$ ha una espressione che tiene conto della sola geometria». <b>La separazione fra statistica e geometria è la struttura da avere in testa</b>: cambiando potenziale cambia solo $G$; cambiando statistica cambia solo $n$.</p>`},
   {label:'PV uguale due terzi di E, per bosoni e per fermioni insieme', body:R`
   <p>C&rsquo;è una relazione fra pressione ed energia che vale per entrambi i gas <i>e</i> per il caso classico, e che conviene ricavare in generale perché la generalizzazione costa niente e serve negli esercizi ultrarelativistici.</p>
   <p>Si supponga $G(\varepsilon)=C\varepsilon^{a-1}$ con $C$ costante — il che copre il gas libero non relativistico in $d$ dimensioni ($a=d/2$) e quello ultrarelativistico $\varepsilon=c|\vec p|$ ($a=d$). Si parta dalla pressione e si integri per parti, scrivendo $\varepsilon^{a-1}=\tfrac1a\frac{d}{d\varepsilon}\varepsilon^a$:</p>
   $$\frac{PV}{T}=\mp g_sC\int_0^{\infty}d\varepsilon\;\varepsilon^{a-1}\log\left(1\mp ze^{-\beta\varepsilon}\right)$$
   <p>Il termine di bordo $\big[\varepsilon^a\log(1\mp ze^{-\beta\varepsilon})\big]_0^{\infty}$ si annulla a entrambi gli estremi: in zero perché $\varepsilon^a\to0$ con $a\gt0$, all&rsquo;infinito perché il logaritmo tende a zero esponenzialmente mentre la potenza cresce solo algebricamente. Resta l&rsquo;integrale della derivata del logaritmo, che si calcola:</p>
   $$\frac{\partial}{\partial\varepsilon}\log\left(1\mp ze^{-\beta\varepsilon}\right)=\frac{\pm\beta ze^{-\beta\varepsilon}}{1\mp ze^{-\beta\varepsilon}}=\pm\beta\,n(\varepsilon)$$
   <p>— ed è il punto in cui la struttura si chiude, perché la derivata del logaritmo <b>è</b> l&rsquo;occupazione, come già nella tappa 03. Rimettendo tutto insieme, i due doppi segni si moltiplicano dando $+1$ in entrambi i casi:</p>
   $$\frac{PV}{T}=\frac{g_sC}{a}\,\beta\int_0^{\infty}d\varepsilon\;\varepsilon^{a}\,n(\varepsilon)=\frac{\beta}{a}\,g_s\int_0^{\infty}d\varepsilon\;\varepsilon\,\big(C\varepsilon^{a-1}\big)n(\varepsilon)=\frac{\beta E}{a}$$
   <p>e dunque, semplificando $\beta$ contro $T$,</p>
   $$PV=\frac Ea$$
   <p><b>Il doppio segno è scomparso.</b> La relazione non distingue bosoni da fermioni, e nemmeno distingue il caso quantistico da quello classico, perché non è mai stata usata la forma esplicita di $n(\varepsilon)$: solo il fatto che sia la derivata logaritmica giusta. Nei casi concreti:</p>
   $$a=\frac32\ \Rightarrow\ PV=\frac23E\qquad(\text{gas libero non relativistico in }d=3)$$
   $$a=3\ \Rightarrow\ PV=\frac13E\qquad(\text{gas ultrarelativistico in }d=3)$$
   <p>La prima è quella che Grilli-Giardina enunciano come teorema (pag. 89), ricavandola per i fermioni e annotando che «nonostante sia stata ricavata utilizzando la statistica di Fermi-Dirac, tale relazione vale anche nel caso bosonico»; Crisanti (pag. 279) la marca con un <b>(DDP)</b> e la stessa estensione, «che vale per bosoni, fermioni, ed anche nel caso di Boltzmann». La seconda è la relazione della radiazione di corpo nero, e viene <i>dallo stesso conto</i> con un solo esponente cambiato. La verifica di consistenza nel limite classico è immediata: $E=\tfrac32NT$ dà $PV=NT$.</p>`},
   {label:'Le funzioni di Fermi e di Bose, e gli integrali che le chiudono', body:R`
   <p>Nel caso non relativistico in tre dimensioni gli integrali delle formule madri hanno un nome. Sostituendo $G(\varepsilon)=\tfrac{2V}{\sqrt\pi}\tfrac{\beta^{3/2}}{\lambda^3}\sqrt\varepsilon$ e cambiando variabile con $y\equiv\beta\varepsilon$, ogni integrale diventa adimensionale e dipende solo dalla fugacità. Per i fermioni si definisce</p>
   $$f_{5/2}(z)\equiv\frac{2}{\sqrt\pi}\int_0^{\infty}dy\;y^{1/2}\log\left(1+ze^{-y}\right)$$
   <p>e le due formule madri diventano $P/T=g_sf_{5/2}(z)/\lambda^3$ e $N/V=g_sf_{3/2}(z)/\lambda^3$, con $f_{3/2}=z\,\partial_zf_{5/2}$. Per i bosoni le corrispondenti si chiamano $g_{5/2}$ e $g_{3/2}$ e differiscono per il segno dentro il logaritmo.</p>
   <p><b>Le serie.</b> Si sviluppa il logaritmo, $\log(1+x)=\sum_{n\ge1}(-1)^{n+1}x^n/n$ con $x=ze^{-y}$, e si scambia con l&rsquo;integrale. Ogni termine richiede</p>
   $$\int_0^{\infty}dy\;y^{1/2}e^{-ny}=\frac{\sqrt\pi}{2\,n^{3/2}}$$
   <p>— si sostituisce $y'=ny$ e si riconosce la <span class="str" data-str="funzione-gamma">funzione Gamma</span>, $\Gamma(3/2)=\sqrt\pi/2$. Il $2/\sqrt\pi$ davanti cancella esattamente questo fattore, e resta</p>
   $$f_{5/2}(z)=\sum_{n\ge1}(-1)^{n+1}\frac{z^n}{n^{5/2}},\qquad g_{5/2}(z)=\sum_{n\ge1}\frac{z^n}{n^{5/2}}$$
   <p>e applicando $z\partial_z$, che abbassa l&rsquo;indice di uno,</p>
   $$f_{3/2}(z)=\sum_{n\ge1}(-1)^{n+1}\frac{z^n}{n^{3/2}},\qquad g_{3/2}(z)=\sum_{n\ge1}\frac{z^n}{n^{3/2}}$$
   <p><b>La differenza fra le due famiglie è un segno alternato</b>, e con esso tutto quello che le distingue: le $f$ convergono per ogni $z\ge0$ (serie a segni alterni con termini decrescenti), le $g$ solo per $z\le1$, che è di nuovo la condizione sul potenziale chimico dei bosoni. Crisanti (pag. 259-260) riassume le quattro in un riquadro e avverte, giustamente, che «in questi contesti le costanti che emergono dai calcoli sono frequenti ed è molto facile commettere degli errori».</p>
   <p><b>I due integrali che chiudono ogni conto.</b> A $z=1$ le serie sono valori speciali della <span class="str" data-str="funzione-zeta-di-riemann">funzione zeta di Riemann</span>, e più in generale Crisanti (pag. 287-288) dimostra le due formule che negli esercizi «si lasciano indicate»:</p>
   $$\int_0^{\infty}dy\;\frac{y^{x-1}}{e^y-1}=\Gamma(x)\zeta(x),\qquad \int_0^{\infty}dy\;\frac{y^{x-1}}{e^y+1}=\left(1-2^{1-x}\right)\Gamma(x)\zeta(x)$$
   <p>La dimostrazione della prima è tre righe e vale la pena tenerla a mente perché è la stessa per entrambe: si raccoglie $e^{-y}$ al denominatore, si sviluppa in serie geometrica $\sum_{n\ge0}e^{-ny}$, si scambia con l&rsquo;integrale e ogni termine dà $\Gamma(x)/(n+1)^x$; la somma su $n$ è la zeta. Per la seconda la serie è a segni alterni, e la somma alternata si riduce alla zeta con il fattore $(1-2^{1-x})$ isolando i termini pari. I valori che servono davvero sono pochi:</p>
   $$\zeta(3/2)\simeq2{,}612,\qquad\zeta(5/2)\simeq1{,}341,\qquad\Gamma(3/2)\simeq0{,}886,\qquad\Gamma(5/2)\simeq1{,}329$$
   <p>e il primo è quello che decide tutto per i bosoni, perché $g_{3/2}(1)=\zeta(3/2)$ è <b>il massimo valore che l&rsquo;integrale può raggiungere</b>. Crisanti lo dichiara con il conto completo: $g_{3/2}(1)=\tfrac{2}{\sqrt\pi}\Gamma(3/2)\zeta(3/2)=\zeta(3/2)=2{,}612$, dove il $2/\sqrt\pi$ e il $\Gamma(3/2)$ si elidono.</p>`}
  ]},
  {t:'prosa', title:'L entropia dei due gas, scritta senza distinguerli', tag:'grammatica', html:R`
  <p>Vale la pena chiudere la tappa con una formula che non serve quasi mai per calcolare ma che dice qualcosa di preciso su che cosa siano i due gas. Grilli-Giardina (pag. 85) ricavano l&rsquo;entropia partendo da $S=\beta(E-\mu N)+\log\mathcal Z$ e manipolando il logaritmo con l&rsquo;occupazione già nota. Il passaggio chiave è l&rsquo;identità</p>
  $$\log\frac{1\pm\langle n_p\rangle}{\langle n_p\rangle}=\beta(\varepsilon_p-\mu)$$
  <p>che si verifica in una riga: da $1/\langle n_p\rangle=e^{\beta(\varepsilon_p-\mu)}\mp1$ segue $1/\langle n_p\rangle\pm1=e^{\beta(\varepsilon_p-\mu)}$, e prendendo il logaritmo si ottiene la formula. Sostituendola dentro la somma, i termini si riorganizzano e resta</p>
  $$S=\sum_p\Big[-\langle n_p\rangle\log\langle n_p\rangle\pm\left(1\pm\langle n_p\rangle\right)\log\left(1\pm\langle n_p\rangle\right)\Big]$$
  <p>Si legga che cosa dice. Nel caso fermionico (segno inferiore) diventa $S=-\sum_p[\,n\log n+(1-n)\log(1-n)\,]$, che è <b>l&rsquo;entropia di Shannon di una moneta</b>, sommata su tutti i livelli: ogni livello è una variabile binaria — pieno o vuoto — con probabilità $n_p$, e l&rsquo;entropia del gas è la somma delle entropie di quelle monete indipendenti. È massima quando $n_p=\tfrac12$, cioè per i livelli <i>esattamente al potenziale chimico</i>, e nulla per i livelli pieni e per quelli vuoti. <b>Tutta l&rsquo;entropia di un gas di fermioni vive nella striscia di larghezza $T$ attorno a $\mu$</b>, e questa singola frase spiega perché il calore specifico di un metallo sia così piccolo rispetto a quello classico: non tutti gli elettroni possono assorbire calore, solo quelli nella striscia.</p>
  <p>Nel caso bosonico (segno superiore) i due termini hanno lo stesso segno e l&rsquo;entropia per livello cresce senza limite con l&rsquo;occupazione, perché non c&rsquo;è un tetto: un livello che ospita $n$ bosoni ha $\log n$ modi di essere, non due. <b>La stessa formula, con un segno diverso, descrive un sistema che può concentrarsi e uno che non può.</b></p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`La relazione $PV=\tfrac23E$ è stata ricavata senza mai usare la forma di $n(\varepsilon)$. Vale allora anche fuori equilibrio?`,
    a:R`No, e il punto è sottile. Il criterio invocato nella derivazione è l&rsquo;<b>integrazione per parti</b> applicata a $PV/T=\log\mathcal Z$, e quel $\log\mathcal Z$ presuppone l&rsquo;insieme gran canonico, cioè l&rsquo;equilibrio. Ciò che la derivazione non usa è la <i>statistica</i> — bosoni o fermioni — non l&rsquo;equilibrio. Quello che invece è vero e più generale: la relazione dipende solo dall&rsquo;esponente della densità di stati, cioè dalla relazione fra energia e impulso e dalla dimensione. È per questo che $PV=E/3$ vale per la radiazione e per un gas di neutrini ultrarelativistici, che non hanno quasi nulla in comune tranne $\varepsilon=c|\vec p|$ in tre dimensioni.`},
   {q:R`Le funzioni $f_\nu$ convergono per ogni $z$ positivo, le $g_\nu$ solo fino a $z=1$. Ma entrambe vengono dallo stesso sviluppo del logaritmo, che ha raggio di convergenza uno. Come può la serie dei fermioni convergere oltre?`,
    a:R`La serie, presa alla lettera, <b>non converge</b> oltre $z=1$: convergono le <i>funzioni</i>, non le loro serie. Il criterio da riconoscere è la distinzione fra una funzione e una sua rappresentazione: $f_{5/2}(z)$ è definita dall&rsquo;<b>integrale</b> $\tfrac{2}{\sqrt\pi}\int y^{1/2}\log(1+ze^{-y})dy$, che converge per ogni $z\gt0$ perché $1+ze^{-y}$ resta positivo; la serie ne è lo sviluppo, valido solo nel disco $|z|\lt1$, e fuori serve un prolungamento — per i fermioni lo fornisce lo sviluppo di Sommerfeld nella variabile $\log z$. Per i bosoni invece è l&rsquo;integrale stesso a smettere di esistere a $z\gt1$, perché $1-ze^{-y}$ cambia segno: lì non è un problema di rappresentazione, è un problema di dominio. <b>Le note di Grilli-Giardina segnalano la distinzione con un avviso in maiuscolo</b> — «le espansioni in serie trovate per $f_{5/2}$ e $f_{3/2}$ valgono se $z\to0$» — e chi lo salta usa la serie dove non vale.`}
  ]}
]},

/* ---------------- 08 · LO SVILUPPO AD ALTA TEMPERATURA ---------------- */
{ num:'08', title:'Lo sviluppo ad alta temperatura: la prima correzione quantistica all equazione di stato', meta:'invertire la serie · il segno che separa i due gas · la pressione di scambio · quanto pesa davvero',
  blocchi:[
  {t:'reveal', title:'Eliminare la fugacita, che e il lavoro vero di ogni esercizio', tag:'costruzione', steps:[
   {label:'Il problema: due equazioni parametriche e una variabile da togliere', body:R`
   <p>Le due formule madri della tappa 07, nel caso non relativistico tridimensionale, si scrivono in forma compatta usando le funzioni di Fermi e di Bose. Introdotta la variabile adimensionale</p>
   $$\xi\equiv\frac{n\lambda^3}{g_s}$$
   <p>— che è il parametro di degenerazione della tappa 04 diviso per la degenerazione di spin — le due relazioni sono</p>
   $$\xi=z\pm\frac{z^2}{2^{3/2}}+O(z^3),\qquad \frac{P\lambda^3}{g_sT}=z\pm\frac{z^2}{2^{5/2}}+O(z^3)$$
   <p>con il segno superiore per i bosoni (le serie $g_\nu$, tutte positive) e quello inferiore per i fermioni (le serie $f_\nu$, a segni alterni). Le due sono <b>equazioni parametriche</b>: danno densità e pressione in funzione di un parametro, la fugacità, che nel problema non è né dato né voluto. L&rsquo;equazione di stato è la curva che si ottiene <i>eliminando</i> il parametro, e questo è letteralmente il lavoro che un esercizio d&rsquo;esame chiede quando dice «si ricavi l&rsquo;equazione di stato».</p>
   <p>L&rsquo;eliminazione esatta non si fa in forma chiusa — per questo esistono le tabelle delle $f$ e delle $g$ — ma nel regime quasi classico, dove $z\ll1$, si fa per inversione di serie, ed è un conto che vale la pena saper rifare a memoria.</p>`},
   {label:'Invertire la serie, e sostituire', body:R`
   <p>Si cerca $z$ come serie in $\xi$. Al primo ordine $z\simeq\xi$; si pone allora $z=\xi+c\,\xi^2+O(\xi^3)$ e si impone la prima equazione:</p>
   $$\xi=\left(\xi+c\xi^2\right)\pm\frac{\xi^2}{2^{3/2}}+O(\xi^3)$$
   <p>dove nel termine quadratico si è già sostituito $z\simeq\xi$, perché la differenza è di ordine tre. Il coefficiente di $\xi^2$ deve annullarsi, quindi $c=\mp2^{-3/2}$ e</p>
   $$z=\xi\mp\frac{\xi^2}{2^{3/2}}+O(\xi^3)$$
   <p>Si sostituisce questo nella seconda equazione, di nuovo tenendo $z\simeq\xi$ dentro il termine quadratico:</p>
   $$\frac{P\lambda^3}{g_sT}=\left(\xi\mp\frac{\xi^2}{2^{3/2}}\right)\pm\frac{\xi^2}{2^{5/2}}=\xi\pm\xi^2\left(\frac{1}{2^{5/2}}-\frac{1}{2^{3/2}}\right)$$
   <p>e la parentesi si semplifica raccogliendo $2^{-5/2}$, perché $2^{-3/2}=2\cdot2^{-5/2}$:</p>
   $$\frac{1}{2^{5/2}}-\frac{1}{2^{3/2}}=-\frac{1}{2^{5/2}}$$
   <p>Dunque $P\lambda^3/(g_sT)=\xi\mp\xi^2/2^{5/2}$, e tornando alle variabili fisiche — $\xi=n\lambda^3/g_s$, quindi $g_s\xi/\lambda^3=n$ e $g_s\xi^2/\lambda^3=n^2\lambda^3/g_s$ —</p>
   $$\boxed{\ P=nT\left[1\mp\frac{n\lambda^3}{2^{5/2}g_s}+O\big((n\lambda^3)^2\big)\right]\ }$$
   <p>con il segno superiore (meno) per i <b>bosoni</b> e quello inferiore (più) per i <b>fermioni</b>. Il coefficiente numerico è</p>
   $$2^{5/2}\simeq5{,}657$$
   <p>e la relazione $PV=\tfrac23E$ della tappa 07 trasporta immediatamente la stessa correzione sull&rsquo;energia: $E=\tfrac32NT[1\mp n\lambda^3/(2^{5/2}g_s)]$.</p>`},
   {label:'Che cosa dice il segno, e la correzione al potenziale chimico', body:R`
   <p><b>Un gas di fermioni preme più di un gas classico alla stessa densità e temperatura; un gas di bosoni preme meno.</b> Non c&rsquo;è nessuna forza fra le particelle — l&rsquo;hamiltoniana è quella di particelle libere — e tuttavia il risultato è indistinguibile, al primo ordine, da quello che darebbe un&rsquo;interazione repulsiva nel primo caso e attrattiva nel secondo. Il nome tecnico è <b>pressione di scambio</b>, e l&rsquo;origine è il conto della tappa 04: i fermioni si tolgono stati a vicenda, i bosoni se li offrono.</p>
   <p>È istruttivo leggere il risultato come un coefficiente del viriale. Scrivendo $P=nT[1+B_2(T)n+\dots]$ si identifica</p>
   $$B_2(T)=\mp\frac{\lambda^3}{2^{5/2}g_s}$$
   <p>cioè un secondo coefficiente del viriale che dipende dalla temperatura come $T^{-3/2}$ e che <b>non viene da nessun potenziale di interazione</b>. Per un gas classico con potenziale a coppie $B_2$ si calcola dall&rsquo;integrale di Mayer; qui si ottiene lo stesso tipo di oggetto dalla sola simmetria della funzione d&rsquo;onda, e il confronto sperimentale fra i due — in un gas reale entrambi sono presenti — è il modo in cui si misura l&rsquo;effetto di scambio.</p>
   <p>Lo stesso sviluppo dà anche la correzione al potenziale chimico. Prendendo il logaritmo di $z=\xi\mp\xi^2/2^{3/2}=\xi(1\mp\xi/2^{3/2})$ e usando $\log(1+u)\simeq u$:</p>
   $$\mu=T\log\xi\mp\frac{T\xi}{2^{3/2}}+O(\xi^2)=\mu_{\rm cl}\mp\frac{T}{2^{3/2}}\frac{n\lambda^3}{g_s}$$
   <p>con $2^{3/2}\simeq2{,}828$. Dunque <b>il potenziale chimico dei fermioni sta sopra quello classico e quello dei bosoni sotto</b>, ed è esattamente l&rsquo;ordine che mostra la figura 10.6 di Grilli-Giardina (pag. 100), dove le tre curve $\mu(T)$ — classica, di Fermi e di Bose — si separano proprio scendendo in temperatura, con quella di Bose che si ferma contro lo zero e quella di Fermi che lo attraversa e diventa positiva.</p>
   <p><b>Quanto pesa davvero, in un caso concreto.</b> Per l&rsquo;aria a condizioni standard, con $n\lambda^3\simeq1{,}865\times10^{-7}$ e $g_s=1$, la correzione relativa all&rsquo;equazione di stato vale</p>
   <p style="text-align:center">$\dfrac{n\lambda^3}{2^{5/2}}\simeq3{,}297\times10^{-8}$</p>
   <p>cioè tre parti su cento milioni: invisibile a qualunque manometro, e sommersa di molti ordini di grandezza dalle correzioni dovute alle interazioni vere fra molecole. <b>Per un gas ordinario la statistica quantistica non è una piccola correzione: è nessuna correzione.</b> Diventa tutto solo quando $n\lambda^3$ si avvicina all&rsquo;unità, e allora lo sviluppo fatto qui non vale più — motivo per cui i due regimi degeneri hanno bisogno di conti diversi.</p>`}
  ]},
  {t:'plot', title:'L equazione di stato in forma parametrica: come i due gas si staccano dalla retta classica',
   intro:R`Le due curve parametriche $\big(\xi(z),\,P\lambda^3/(g_sT)\big)$ al variare della fugacità $z$ da $0$ a $0{,}8$, disegnate con le serie troncate all&rsquo;ottavo termine. La retta tratteggiata è il gas classico, dove pressione e densità sono proporzionali. L&rsquo;ascissa è il parametro di degenerazione, l&rsquo;ordinata la pressione ridotta.`,
   plots:[
    {kind:'curve', equal:false, height:320, xr:[0,0.8], yr:[0,0.8], ticks:6,
     x:'t - t*t*0.353553 + t*t*t*0.192450 - t*t*t*t*0.125 + pow(t,5)*0.089443 - pow(t,6)*0.068041 + pow(t,7)*0.053995 - pow(t,8)*0.044194',
     y:'t - t*t*0.176777 + t*t*t*0.064150 - t*t*t*t*0.031250 + pow(t,5)*0.017889 - pow(t,6)*0.011340 + pow(t,7)*0.007714 - pow(t,8)*0.005524',
     tr:[0,0.8],
     segs:[{x1:0,y1:0,x2:0.8,y2:0.8,col:'#d8a13a',dash:true,width:1.6,label:'gas classico',lx:0.62,ly:0.68}],
     title:'fermioni: la curva sta SOPRA la retta classica', xlabel:'parametro di degenerazione', ylabel:'pressione ridotta'},
    {kind:'curve', equal:false, height:320, xr:[0,1.4], yr:[0,1.4], ticks:6,
     x:'t + t*t*0.353553 + t*t*t*0.192450 + t*t*t*t*0.125 + pow(t,5)*0.089443 + pow(t,6)*0.068041 + pow(t,7)*0.053995 + pow(t,8)*0.044194',
     y:'t + t*t*0.176777 + t*t*t*0.064150 + t*t*t*t*0.031250 + pow(t,5)*0.017889 + pow(t,6)*0.011340 + pow(t,7)*0.007714 + pow(t,8)*0.005524',
     tr:[0,0.8],
     segs:[{x1:0,y1:0,x2:1.4,y2:1.4,col:'#d8a13a',dash:true,width:1.6,label:'gas classico',lx:1.1,ly:1.2}],
     title:'bosoni: la curva sta SOTTO, e la curva vera finisce', xlabel:'parametro di degenerazione', ylabel:'pressione ridotta'}
   ],
   leggi:R`<p><b>Che cosa guardare: da che parte della retta sta ciascuna curva.</b> Vicino all&rsquo;origine entrambe partono tangenti alla retta tratteggiata — è il limite classico, dove pressione e densità sono proporzionali con la costante $T$ — e poi se ne staccano in versi opposti. Quella dei fermioni sale <i>sopra</i>: a parità di densità la pressione è maggiore, ed è la pressione di scambio. Quella dei bosoni resta <i>sotto</i>. <b>Il distacco comincia a essere visibile attorno a $\xi\simeq0{,}3$</b>, cioè quando circa un terzo di una particella occupa una cella termica, e questo è il modo grafico di dire che lo sviluppo del primo ordine serve fin lì.</p>
   <p><b>Che cosa impararne sulla curva dei bosoni.</b> La sua ascissa non può crescere indefinitamente. La curva vera si ferma al valore massimo $\xi=g_{3/2}(1)=\zeta(3/2)\simeq2{,}612$, raggiunto quando $z$ arriva a uno; oltre, non esiste nessuna soluzione dell&rsquo;equazione parametrica. <b>Un&rsquo;equazione di stato che finisce</b> è l&rsquo;anomalia più forte che questo movimento incontra, e nella tappa 06 se ne è già vista la causa: l&rsquo;integrale ha un massimo, e le particelle in eccesso devono andare altrove. La curva disegnata qui, essendo la serie troncata a otto termini con $z\le0{,}8$, arriva solo a circa $1{,}24$: si ferma prima per un limite del disegno, non della fisica.</p>
   <p><b>Che cosa impararne per i conti.</b> La coordinata orizzontale è ciò che un problema dà (densità e temperatura), quella verticale ciò che chiede (pressione), e la fugacità è solo il parametro che scorre lungo la curva. <b>Il metodo è sempre lo stesso in tre passi</b>: scrivere $\xi$ dai dati; risolvere per $z$, esattamente se si può o per serie se $\xi$ è piccolo; sostituire $z$ nella pressione. Chi salta il secondo passo e sostituisce direttamente la densità dentro la formula della pressione sbaglia esattamente del termine del secondo ordine.</p>
   <p><b>Dove questa figura mente.</b> Le due curve sono serie troncate, quindi non sono la vera equazione di stato: per i fermioni la serie non converge affatto oltre $z=1$ — dove pure la funzione esiste — e per i bosoni converge lentamente. E la figura disegna la pressione a temperatura fissata mentre $\xi$ contiene anche $\lambda^3\propto T^{-3/2}$: muoversi lungo l&rsquo;asse orizzontale non è muoversi a temperatura costante, se lo si fa raffreddando invece che comprimendo.</p>`}
]},

/* ---------------- 09 · ESERCIZI ---------------- */
{ num:'09', title:'Esercizi — tocca a te', meta:'il potenziale a tre gradini · la particella ultrarelativistica in d dimensioni · l emissione termoionica',
  blocchi:[
  {t:'esercizio', title:'1 · Il potenziale a tre gradini: prima classico, poi fermioni a temperatura zero',
   src:'Crisanti pag. 288-292, esercizio da un compito del 2014, svolto per intero nei cinque quesiti',
   testo:R`In una dimensione, $N$ particelle identiche non interagenti di massa $m$ stanno in $0\le q\le3L$ con hamiltoniana di singola particella $H=p^2/2m+V(q)$ e potenziale a gradini: $V=0$ per $0\le q\le L$, $V=V_0$ per $L\le q\le2L$, $V=2V_0$ per $2L\le q\le3L$. (a) Nel regime classico calcola la funzione di partizione di singola particella e l'energia media per particella $U(T)/N$. (b) Se le particelle sono fermioni identici di spin $1/2$, determina il numero massimo $N_{\rm max}$ che il sistema può contenere affinché a $T=0$ non ci siano particelle nella zona $q\gt L$. (c) Calcola la densità di stati $G(\varepsilon)$ e l'energia $U(T=0)$ nel caso $\varepsilon_F=3V_0$.`,
   steps:[
    {label:'a · Il conto classico, che vale per meta esercizio', body:R`
    <p><b>Il riconoscimento</b>: particelle indipendenti e distinguibili nel regime di Boltzmann, quindi $Z=z_1^N/N!$ e l&rsquo;energia media si ottiene da $E=-N\,\partial_\beta\log z_1$. La partizione di singola particella si fattorizza in impulso e posizione:</p>
    $$z_1=\frac1h\int_{-\infty}^{+\infty}dp\,e^{-\beta p^2/2m}\int_0^{3L}dq\,e^{-\beta V(q)}$$
    <p>L&rsquo;integrale gaussiano dà $\sqrt{2\pi m/\beta}$; quello sulle posizioni è una somma di tre tratti di lunghezza $L$ ciascuno con il suo peso costante, dunque $L(1+e^{-\beta V_0}+e^{-2\beta V_0})$. Quindi</p>
    $$z_1=\frac{L}{h}\left(\frac{2\pi m}{\beta}\right)^{1/2}\left(1+e^{-\beta V_0}+e^{-2\beta V_0}\right)$$
    <p><b>L&rsquo;energia media.</b> Si deriva il logaritmo rispetto a $\beta$, e le costanti $L/h$ e $\sqrt{2\pi m}$ spariscono perché la loro derivata logaritmica è nulla. Resta da derivare $-\log\big[\beta^{-1/2}(1+e^{-\beta V_0}+e^{-2\beta V_0})\big]$:</p>
    $$-\frac{\partial}{\partial\beta}\log z_1=\frac{1}{2\beta}+V_0\,\frac{e^{-\beta V_0}+2e^{-2\beta V_0}}{1+e^{-\beta V_0}+e^{-2\beta V_0}}$$
    <p>cioè</p>
    $$\frac{U(T)}{N}=\frac T2+V_0\,\frac{e^{-\beta V_0}+2e^{-2\beta V_0}}{1+e^{-\beta V_0}+e^{-2\beta V_0}}$$
    <p>che è esattamente il risultato di Crisanti (pag. 289). <b>Due controlli che vale sempre la pena fare.</b> Il primo termine è $T/2$ e non $3T/2$, perché in una dimensione c&rsquo;è un solo grado di libertà quadratico: l&rsquo;equipartizione conta i gradi di libertà, non le particelle. Il secondo termine è <i>positivo</i>, come deve essere, perché è la media di un potenziale che vale $0$, $V_0$ o $2V_0$; e i suoi due limiti sono leggibili a occhio — ad alta temperatura ($\beta V_0\to0$) ogni tratto è ugualmente popolato e la media tende a</p>
    $$\frac{0+V_0+2V_0}{3}=V_0$$
    <p>mentre a bassa temperatura ($\beta V_0\to\infty$) la frazione tende a zero e le particelle stanno tutte nel tratto a potenziale nullo. Crisanti annota il controllo di segno con una frase sola: «è corretto che il secondo termine sia positivo, in quanto $\langle V\rangle$ è sempre positivo, dalla sua definizione».</p>`},
    {label:'b · Fermioni a T = 0: la condizione e un conteggio di area', body:R`
    <p><b>La mossa che risolve il quesito in una riga.</b> A $T=0$ l&rsquo;occupazione è il gradino $\theta(\varepsilon_F-\varepsilon)$, cioè tutti i livelli fino a $\varepsilon_F$ sono pieni e gli altri vuoti. Chiedere che <i>nessuna</i> particella si trovi con $q\gt L$ significa chiedere che nessuno stato occupato abbia energia sufficiente a entrare nel secondo tratto, dove il potenziale vale $V_0$. La condizione limite è dunque</p>
    $$\varepsilon_F=V_0$$
    <p>ed è tutta la fisica del quesito: la domanda «quante particelle al massimo» è la domanda «quanti stati ci sono sotto $V_0$».</p>
    <p>Si contano gli stati direttamente nello spazio delle fasi, senza passare da $G(\varepsilon)$, perché è più corto. Con $g_s=2S+1=2$ per lo spin $1/2$:</p>
    $$N_{\rm max}=2\int\frac{dq\,dp}{h}\;\theta\big(V_0-H\big)=\frac2h\int_0^{L}dq\int dp\;\theta\!\left(V_0-\frac{p^2}{2m}\right)$$
    <p>L&rsquo;integrale su $q$ si ferma a $L$ perché oltre quel punto il potenziale vale già $V_0$ e la theta è nulla per ogni impulso. Quello sugli impulsi è la lunghezza dell&rsquo;intervallo $|p|\le\sqrt{2mV_0}$:</p>
    $$\int_{-\sqrt{2mV_0}}^{+\sqrt{2mV_0}}dp=2\sqrt{2mV_0}$$
    <p>e mettendo insieme i tre fattori:</p>
    $$N_{\rm max}=\frac{4L}{h}\sqrt{2mV_0}$$
    <p><b>Il criterio invocato</b> è che a temperatura nulla il numero di fermioni è il volume di spazio delle fasi accessibile diviso per $h$ per ogni grado di libertà, moltiplicato per la degenerazione di spin — cioè il conteggio degli stati della tappa 05 applicato a una regione limitata da $\theta$. <b>Il controllo dimensionale</b>: $\sqrt{2mV_0}$ è un impulso, $L$ una lunghezza, il loro prodotto un&rsquo;azione, e diviso per $h$ dà un numero puro. Se il fattore $2$ dello spin sparisce, $N_{\rm max}$ si dimezza: è l&rsquo;errore più frequente di questo esercizio.</p>`},
    {label:'c · La densita di stati a gradini, e l energia a T = 0', body:R`
    <p>Si usa la macchina della tappa 05 in $d=1$, dove l&rsquo;esponente vale $-1/2$ e il prefattore è $\sqrt{2m}/h$. Ogni tratto lungo $L$ contribuisce il suo integrando valutato all&rsquo;energia ridotta:</p>
    $$G(\varepsilon)=\frac{L}{h}\sqrt{2m}\left[\frac{\theta(\varepsilon)}{\sqrt\varepsilon}+\frac{\theta(\varepsilon-V_0)}{\sqrt{\varepsilon-V_0}}+\frac{\theta(\varepsilon-2V_0)}{\sqrt{\varepsilon-2V_0}}\right]$$
    <p>Ora l&rsquo;energia a temperatura nulla, con $\varepsilon_F=3V_0$ e il fattore $2$ di spin:</p>
    $$U(0)=2\int_0^{\varepsilon_F}d\varepsilon\;\varepsilon\,G(\varepsilon)=\frac{2L}{h}\sqrt{2m}\left[\int_0^{3V_0}\!\!d\varepsilon\,\sqrt\varepsilon+\int_{V_0}^{3V_0}\!\!\frac{\varepsilon\,d\varepsilon}{\sqrt{\varepsilon-V_0}}+\int_{2V_0}^{3V_0}\!\!\frac{\varepsilon\,d\varepsilon}{\sqrt{\varepsilon-2V_0}}\right]$$
    <p>I tre integrali si fanno spostando l&rsquo;origine, che è il passaggio da non saltare: nel secondo si pone $u=\varepsilon-V_0$, nel terzo $u=\varepsilon-2V_0$, e in entrambi il numeratore diventa $u+\text{costante}$. Uno per volta:</p>
    $$\int_0^{3V_0}d\varepsilon\,\sqrt\varepsilon=\frac23(3V_0)^{3/2}$$
    $$\int_0^{2V_0}\frac{u+V_0}{\sqrt u}\,du=\frac23(2V_0)^{3/2}+2V_0\sqrt{2V_0}$$
    $$\int_0^{V_0}\frac{u+2V_0}{\sqrt u}\,du=\frac23V_0^{3/2}+4V_0^{3/2}$$
    <p>Raccogliendo $V_0^{3/2}$ da tutti e cinque i pezzi si ottiene un numero puro:</p>
    $$U(0)=\frac{2L}{h}\sqrt{2m}\;V_0^{3/2}\left[\frac23\left(3\sqrt3+2\sqrt2+1\right)+2\sqrt2+4\right]$$
    <p>e la parentesi vale</p>
    <p style="text-align:center">$\dfrac23\left(3\sqrt3+2\sqrt2+1\right)+2\sqrt2+4\simeq12{,}845$</p>
    <p><b>Che cosa portarsi via</b>, al di là del numero. La struttura del risultato di Crisanti (pag. 291) è $\tfrac23\big[\varepsilon_F^{3/2}+(\varepsilon_F-V_0)^{3/2}+(\varepsilon_F-2V_0)^{3/2}\big]+3V_0(\varepsilon_F-V_0)^{1/2}+6V_0(\varepsilon_F-2V_0)^{1/2}$: i primi tre termini sono l&rsquo;energia cinetica accumulata in ciascun tratto, gli ultimi due sono l&rsquo;energia <i>potenziale</i> delle particelle che stanno nei tratti alti. <b>Il criterio da riconoscere</b> è che un potenziale a gradini si tratta tratto per tratto e non con una formula sola: ogni tratto è un gas libero unidimensionale con l&rsquo;origine delle energie spostata, e la densità di stati totale è la loro somma.</p>`}
   ]},
  {t:'esercizio', title:'2 · Particelle ultrarelativistiche in d dimensioni, e dove la condensazione e possibile',
   src:'Crisanti pag. 292, esercizio 2 proposto («si puo provare il seguente esercizio»), svolto qui per intero',
   testo:R`Particelle indipendenti con hamiltoniana di singola particella $H=c|\vec p|$ in $d=1,2,3$ dimensioni, in un volume $V_d$. (a) Calcola la densità di stati $G(\varepsilon)$ e l'equazione di stato che lega $PV$ ed $E$. (b) Nel caso classico calcola l'energia media per particella e verifica l'equazione di stato dei gas perfetti. (c) Nel caso bosonico stabilisci per quali dimensioni può esserci condensazione, cioè per quali $d$ l'integrale che conta le particelle fuori dal fondamentale resta finito a $z=1$.`,
   steps:[
    {label:'a · La densita di stati, e PV uguale E su d', body:R`
    <p>Si riparte dalla definizione con la delta e si ripete il conto della tappa 05 cambiando la relazione fra energia e impulso. Con $\varepsilon=c|\vec p|$ la radice è $p_0=\varepsilon/c$ e il modulo della derivata è $|d\varepsilon/dp|=c$, quindi</p>
    $$G(\varepsilon)=\frac{V_d}{h^d}\frac{2\pi^{d/2}}{\Gamma(d/2)}\int_0^{\infty}dp\;p^{d-1}\,\frac{\delta(p-\varepsilon/c)}{c}=\frac{V_d}{h^d}\frac{2\pi^{d/2}}{\Gamma(d/2)}\frac{\varepsilon^{d-1}}{c^d}$$
    <p><b>Confronto immediato col caso non relativistico</b>, ed è la lettura che serve: là l&rsquo;esponente era $d/2-1$, qui è $d-1$. In tre dimensioni si passa da $\sqrt\varepsilon$ a $\varepsilon^2$; in una si passa da $\varepsilon^{-1/2}$ a una <i>costante</i>. La regola generale è che per $\varepsilon\propto p^s$ vale $G\propto\varepsilon^{d/s-1}$, e qui $s=1$.</p>
    <p>L&rsquo;equazione di stato segue dalla relazione generale della tappa 07, $PV=E/a$ con $G\propto\varepsilon^{a-1}$. Qui $a=d$, dunque</p>
    $$PV=\frac Ed$$
    <p>e in tre dimensioni <b>$PV=E/3$</b>, che è la relazione della radiazione: un gas di fotoni è esattamente questo caso con $g_s=2$ e $\mu=0$. <b>Il criterio invocato</b> è che quella derivazione non usava mai la forma di $n(\varepsilon)$ ma solo l&rsquo;esponente della densità di stati: cambiare la dispersione cambia l&rsquo;esponente e quindi il coefficiente, e nient&rsquo;altro.</p>`},
    {label:'b · Il caso classico, e il controllo di consistenza', body:R`
    <p>Nel regime di Boltzmann l&rsquo;energia media per particella è il rapporto di due integrali pesati dalla densità di stati, con $d=3$ per fissare le idee:</p>
    $$\langle\varepsilon\rangle=\frac{\int_0^{\infty}d\varepsilon\;\varepsilon\cdot\varepsilon^{2}e^{-\beta\varepsilon}}{\int_0^{\infty}d\varepsilon\;\varepsilon^{2}e^{-\beta\varepsilon}}$$
    <p>I due integrali sono Gamma di Eulero. Al numeratore</p>
    $$\int_0^{\infty}d\varepsilon\;\varepsilon^{3}e^{-\beta\varepsilon}=\frac{6}{\beta^4}$$
    <p>e al denominatore</p>
    $$\int_0^{\infty}d\varepsilon\;\varepsilon^{2}e^{-\beta\varepsilon}=\frac{2}{\beta^3}$$
    <p>quindi il rapporto vale</p>
    $$\langle\varepsilon\rangle=\frac{3}{\beta}=3T$$
    <p><b>Tre $T$ per particella e non $\tfrac32T$</b>: una particella ultrarelativistica ha il doppio dell&rsquo;energia termica di una non relativistica, perché l&rsquo;hamiltoniana è omogenea di grado uno negli impulsi invece che di grado due, e il teorema di equipartizione generalizzato dà $\langle\varepsilon\rangle=dT/s$. Il controllo di consistenza chiude il quesito: sostituendo $E=3NT$ dentro $PV=E/3$ si ottiene</p>
    $$PV=\frac{3NT}{3}=NT$$
    <p>cioè l&rsquo;equazione di stato dei gas perfetti, come deve essere — <b>la legge $PV=NT$ non sa nulla della relazione fra energia e impulso</b>, e infatti si ritrova identica qui e nel caso non relativistico, dove il coefficiente $2/3$ moltiplica un&rsquo;energia $\tfrac32NT$.</p>`},
    {label:'c · Bosoni: per quali dimensioni l integrale satura', body:R`
    <p>La domanda «c&rsquo;è condensazione?» è, per il conto della tappa 06, la domanda «<b>l&rsquo;integrale che conta le particelle fuori dal fondamentale è finito a $z=1$?</b>». Se è finito, esiste un numero massimo di particelle che l&rsquo;integrale può ospitare e il resto deve andare nel fondamentale; se diverge, nessun numero di particelle lo satura e non c&rsquo;è niente da mettere da parte.</p>
    <p>L&rsquo;integrale, a $z=1$, è</p>
    $$\tilde N\propto\int_0^{\infty}d\varepsilon\;\frac{\varepsilon^{d-1}}{e^{\beta\varepsilon}-1}$$
    <p>e l&rsquo;unico punto dove può divergere è l&rsquo;origine, perché all&rsquo;infinito l&rsquo;esponenziale domina qualunque potenza. Vicino a zero $e^{\beta\varepsilon}-1\simeq\beta\varepsilon$, quindi l&rsquo;integrando si comporta come</p>
    $$\frac{\varepsilon^{d-1}}{\beta\varepsilon}=\frac{\varepsilon^{d-2}}{\beta}$$
    <p>che è integrabile in zero se e solo se $d-2\gt-1$, cioè <b>$d\gt1$</b>. Dunque: in <i>due e tre</i> dimensioni la condensazione è possibile, in <i>una</i> no — ed è esattamente la risposta che Crisanti dà all&rsquo;esercizio, «c&rsquo;è condensazione per $D=2,3$».</p>
    <p>I due integrali finiti si calcolano con le formule della tappa 07, $\int_0^{\infty}dy\,y^{x-1}/(e^y-1)=\Gamma(x)\zeta(x)$. In due dimensioni ($x=2$):</p>
    $$\int_0^{\infty}dy\;\frac{y}{e^{y}-1}=\frac{\pi^2}{6}$$
    <p>perché $\Gamma(2)=1$ e $\zeta(2)=\pi^2/6$. In tre dimensioni ($x=3$):</p>
    $$\int_0^{\infty}dy\;\frac{y^{2}}{e^{y}-1}=2\zeta(3)$$
    <p>perché $\Gamma(3)=2$. <b>Il criterio da riconoscere, e da applicare senza pensarci in ogni prova</b>: si scrive l&rsquo;esponente della densità di stati, lo si confronta con la divergenza $1/\varepsilon$ dell&rsquo;occupazione bosonica, e si guarda se la differenza è maggiore di $-1$. È un conto da dieci secondi che decide un intero quesito, e la stessa regola applicata al gas non relativistico ($G\propto\varepsilon^{d/2-1}$) dà la condizione $d\gt2$ — motivo per cui un gas non relativistico condensa in tre dimensioni ma non in due, mentre uno ultrarelativistico condensa in entrambe. <b>La dispersione conta quanto la dimensione.</b></p>`}
   ]},
  {t:'esercizio', title:'3 · Emissione termoionica: la Fermi-Dirac misurata in laboratorio',
   src:'Falcioni-Vulpiani pag. 72-74, paragrafo 5.1.2 «La distribuzione di Fermi-Dirac»',
   testo:R`Gli elettroni di conduzione di un metallo sono un gas di fermioni liberi di spin $1/2$ a temperatura $T$; fra interno ed esterno c'è una barriera di potenziale di altezza $e\varphi$. (a) Scrivi la corrente per unità di superficie emessa dal metallo, usando la distribuzione di Fermi-Dirac e la condizione che un elettrone esca solo se $p_x^2/2m\gt e\varphi$. (b) Sviluppa nel regime $e\varphi-\mu\gg k_BT$ e ricava la legge di Richardson. (c) Stabilisci se il lavoro di estrazione misurato vale $e\varphi$ oppure $e\varphi-\varepsilon_F$, e verificalo sui numeri del tungsteno.`,
   steps:[
    {label:'a · La corrente, e i due integrali che si fanno', body:R`
    <p><b>Il riconoscimento</b>: il numero medio di elettroni per unità di volume in $d^3p$ è l&rsquo;occupazione di Fermi moltiplicata per la densità di stati nello spazio degli impulsi, cioè $\big(g_s/h^3\big)d^3p\,/\big(e^{(\varepsilon-\mu)/k_BT}+1\big)$ con $g_s=2$. Ciascuno di essi trasporta carica $e$ e si muove verso la superficie con velocità $p_x/m$, quindi la densità di corrente è</p>
    $$j_x=\frac{2e}{h^3}\int_{p_0}^{\infty}dp_x\,\frac{p_x}{m}\int_{-\infty}^{+\infty}\!\!dp_y\int_{-\infty}^{+\infty}\!\!dp_z\;\frac{1}{e^{(\varepsilon-\mu)/k_BT}+1}$$
    <p>con $p_0=\sqrt{2me\varphi}$. <b>Il cambio di variabile che semplifica tutto</b>: si pongono $\varepsilon_x=p_x^2/2m$ ed $\varepsilon_t=(p_y^2+p_z^2)/2m$. Il primo assorbe il fattore $p_x/m$ perché $d\varepsilon_x=(p_x/m)dp_x$; il secondo trasforma il piano trasverso in coordinate polari, dove $dp_ydp_z=2\pi p_t\,dp_t=2\pi m\,d\varepsilon_t$. Restano due integrali in energia:</p>
    $$j_x=\frac{4\pi me}{h^3}\int_{e\varphi}^{\infty}\!\!d\varepsilon_x\int_0^{\infty}\!\!d\varepsilon_t\;\frac{1}{e^{(\varepsilon_x+\varepsilon_t-\mu)/k_BT}+1}$$
    <p>L&rsquo;integrale interno si fa esattamente, ed è l&rsquo;unico passaggio non banale dell&rsquo;esercizio. Posto $a=(\varepsilon_x-\mu)/k_BT$ e $u=\varepsilon_t/k_BT$:</p>
    $$\int_0^{\infty}\frac{du}{e^{a+u}+1}=\log\left(1+e^{-a}\right)$$
    <p>perché la primitiva di $1/(e^{a+u}+1)$ è $-\log(1+e^{-a-u})$, che all&rsquo;estremo superiore si annulla. Rimettendo il fattore $k_BT$ del cambio di variabile:</p>
    $$j_x=\frac{4\pi mek_BT}{h^3}\int_{e\varphi}^{\infty}\!\!d\varepsilon_x\;\log\left(1+e^{-(\varepsilon_x-\mu)/k_BT}\right)$$`},
    {label:'b · Lo sviluppo, e la legge di Richardson', body:R`
    <p>Nel dominio di integrazione vale $\varepsilon_x\ge e\varphi$, quindi $\varepsilon_x-\mu\ge e\varphi-\mu$. Falcioni-Vulpiani fa qui il controllo numerico che giustifica lo sviluppo, ed è il modello di come si giustifica un&rsquo;approssimazione invece di dichiararla: la differenza $e\varphi-\varepsilon_F$ è tipicamente di qualche elettronvolt, e un elettronvolt corrisponde a</p>
    <p style="text-align:center">$\dfrac{1{,}602\times10^{-19}}{1{,}381\times10^{-23}}\simeq1{,}160\times10^{4}$ K</p>
    <p>mentre i metalli comuni a $2000$ K sono già fusi — il tungsteno, che è il più refrattario, fonde attorno a $3700$ K. Dunque $(e\varphi-\mu)/k_BT$ è dell&rsquo;ordine delle decine, l&rsquo;esponenziale è piccolissimo, e $\log(1+x)\simeq x$:</p>
    $$j_x\simeq\frac{4\pi mek_BT}{h^3}\int_{e\varphi}^{\infty}\!\!d\varepsilon_x\;e^{-(\varepsilon_x-\mu)/k_BT}$$
    <p>L&rsquo;integrale di un esponenziale decrescente su una semiretta è immediato:</p>
    $$\int_{e\varphi}^{\infty}d\varepsilon\;e^{-(\varepsilon-\mu)/k_BT}=k_BT\,e^{-(e\varphi-\mu)/k_BT}$$
    <p>e sostituendo si ottiene la <b>legge di Richardson</b>:</p>
    $$j_x=\frac{4\pi emk_B^2}{h^3}\,T^2\,e^{-W/k_BT},\qquad W\equiv e\varphi-\mu$$
    <p><b>Da dove viene il $T^2$</b>, che è la firma sperimentale: un fattore $k_BT$ viene dall&rsquo;integrale sulle energie trasverse, l&rsquo;altro dall&rsquo;integrale sulla coda esponenziale. Il conto classico con la distribuzione di Maxwell dà invece un prefattore $T^{1/2}$ — e qui sta il punto, perché l&rsquo;esperimento distingue i due.</p>`},
    {label:'c · Che cosa si misura davvero, e i numeri del tungsteno', body:R`
    <p><b>La domanda che decide l&rsquo;esercizio</b> non è il prefattore ma l&rsquo;esponente, perché un esponenziale è molto più sensibile di una potenza. La legge quantistica ha nell&rsquo;esponente $W=e\varphi-\mu$, e in regime degenere $\mu\simeq\varepsilon_F$, quindi $W=e\varphi-\varepsilon_F$; la legge classica ha nell&rsquo;esponente $e\varphi$ nudo. Le due previsioni differiscono di tutta l&rsquo;energia di Fermi, che in un metallo vale parecchi elettronvolt.</p>
    <p>Il confronto è possibile perché l&rsquo;altezza della barriera $e\varphi$ si misura in modo indipendente, per esempio studiando la diffrazione degli elettroni sul metallo. Per il <b>tungsteno</b> i numeri di Falcioni-Vulpiani sono $e\varphi\simeq13{,}5$ eV ed $\varepsilon_F\simeq9$ eV, dunque la previsione quantistica è</p>
    $$W=13{,}5-9=4{,}5\ \text{eV}$$
    <p>e il valore misurato del lavoro di estrazione è appunto $W\simeq4{,}5$ eV, non $13{,}5$. <b>La Fermi-Dirac non è stata verificata guardando la forma di una curva: è stata verificata guardando un numero nell&rsquo;esponente, e quel numero contiene il potenziale chimico.</b></p>
    <p><b>Il controllo di coerenza interno</b>, che chiude il cerchio con la tappa 04. Falcioni-Vulpiani osserva che la formula classica si riottiene da quella quantistica sostituendo il potenziale chimico del gas classico, $e^{\beta\mu}=\rho h^3/\big[2(2\pi mk_BT)^{3/2}\big]$ — che è $n\lambda^3/g_s$ con $g_s=2$, cioè la relazione della tappa 04. Ma quella relazione vale per $k_BT\gg\varepsilon_F$, e negli esperimenti si ha $k_BT\lt\varepsilon_F$: <b>la legge classica non è sbagliata come algebra, è sbagliata come dominio</b>, perché usa un potenziale chimico fuori dal suo regime di validità. È lo stesso errore che la figura della tappa 03 mostra graficamente, quando la curva di Maxwell-Boltzmann supera l&rsquo;unità.</p>`}
   ]}
]},

/* ---------------- 10 · IL SENSO E LE ROTTE ---------------- */
{ num:'10', title:'Il senso, e le rotte', meta:'cosa lascia in mano · dove le due statistiche riappaiono in fisica · la domanda che porta avanti',
  blocchi:[
  {t:'prosa', title:'Cosa portarsi via', tag:'sintesi', html:R`
  <p><b>Il punto.</b> Fermi-Dirac e Bose-Einstein non sono due teorie: sono due righe dello stesso conto. Si applica il gran canonico a un gas di particelle indipendenti, si scambia la somma sulle configurazioni con il prodotto sui livelli — il passaggio che scioglie il vincolo $\sum_pn_p=N$ — e si resta con una somma su un indice solo per ciascun livello. Quella somma corre su tutti gli interi per i bosoni, ed è una geometrica; ha due termini per i fermioni. Da lì esce tutto, con un doppio segno che non è una comodità tipografica ma il ricordo del dominio di una sommatoria.</p>
  <p><b>Che cosa ricordare, in ordine di durata.</b> Che l&rsquo;occupazione media vale $\langle n_\varepsilon\rangle=1/(e^{\beta(\varepsilon-\mu)}\mp1)$ e che il segno si ricostruisce senza memoria, chiedendosi se l&rsquo;occupazione debba saturare a uno o poter divergere. Che per i bosoni $\mu$ sta sotto il <i>livello fondamentale</i> — non sotto zero, che è un caso particolare — e per i fermioni non c&rsquo;è nessun vincolo. Che il parametro che decide se un gas sia quantistico è $n\lambda^3$, la frazione di spazio occupata dai pacchetti d&rsquo;onda, e che passa da $10^{-7}$ per l&rsquo;aria a $10^{3}$ per gli elettroni di un metallo <i>nella stessa stanza</i>. Che la densità di stati $G(\varepsilon)=\int d^dq\,d^dp/h^d\;\delta(\varepsilon-H)$ è la geometria del problema, separata dalla statistica, e che con un potenziale esterno si calcola integrando $[\varepsilon-V(\vec q)]^{d/2-1}\theta(\varepsilon-V(\vec q))$ sulle posizioni. Che per ogni densità di stati a potenza $\varepsilon^{a-1}$ vale $PV=E/a$, per bosoni, fermioni e Boltzmann insieme. E che la correzione quantistica all&rsquo;equazione di stato vale $\mp n\lambda^3/(2^{5/2}g_s)$, con i fermioni che premono di più e i bosoni di meno.</p>
