<style>
  :root{
    --bg:#0e1117; --panel:#161b22; --panel2:#1c232d; --border:#2b333d;
    --txt:#eef3f8; --muted:#b9c4d1; --accent:#4c8dff; --accent2:#8fb0ff;
    --ok:#2ea043; --okbg:#10331b; --warn:#d8a13a; --warnbg:#332a10;
    --gram:#5eead4; --grambg:#0f2a26;
    --pro:#b98cff; --probg:#1a1430; --proline:#2a2247; --proedge:#3a2d5c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    font-size:17px;line-height:1.55;}
  a{color:var(--accent2);}
  .banner{background:var(--panel2);border-bottom:1px solid var(--border);color:var(--muted);
    font-size:.8rem;font-weight:600;text-align:center;padding:8px 12px;letter-spacing:.3px;}
  .banner b{color:var(--accent2);}
  .shell{display:flex;max-width:1180px;margin:0 auto;align-items:flex-start;}

  /* ---- SIDEBAR ---- */
  .sidebar{width:280px;flex:0 0 280px;padding:20px 12px 60px;position:sticky;top:0;
    max-height:100vh;overflow-y:auto;border-right:1px solid var(--border);}
  .sidebar h2{font-size:.72rem;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);
    margin:18px 8px 8px;}
  .navitem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:none;
    background:transparent;color:var(--txt);padding:9px 10px;border-radius:8px;cursor:pointer;
    font-size:.9rem;transition:.12s;border:1px solid transparent;}
  .navitem:hover{background:var(--panel2);}
  .navitem.active{background:#13233f;border-color:var(--accent);color:#fff;}
  .navitem .dot{width:7px;height:7px;border-radius:50%;background:transparent;flex:0 0 7px;
    border:1px solid var(--border);}
  .navitem.seen .dot{background:var(--ok);border-color:var(--ok);}
  .navitem .nx{color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto;}

  /* ---- MAIN ---- */
  .main{flex:1 1 auto;min-width:0;padding:24px 30px 90px;max-width:860px;}
  h1{font-size:1.5rem;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:.92rem;margin:0 0 18px;}
  .sfhead{border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:8px;}
  .sfhead h1{font-size:1.55rem;}
  .meta{color:var(--muted);font-size:.82rem;margin-top:6px;}

  .section{margin:26px 0;}
  .section > h3{font-size:1.02rem;color:var(--accent2);margin:0 0 10px;
    display:flex;align-items:center;gap:10px;}
  .section > h3 .tag{font-size:.66rem;font-weight:700;letter-spacing:.4px;background:var(--panel2);
    border:1px solid var(--border);color:var(--muted);padding:2px 8px;border-radius:20px;
    text-transform:uppercase;}
  /* --- blocchi figura --- */
  .section > h3 .tag.plottag{background:#101f2e;border-color:#1f3c57;color:#7ab8e0;}
  .plot-intro{color:var(--muted);font-size:.95rem;margin:0 0 12px;}
  .plot-row{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;
    background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;}
  .plot-row.due .plot-box{flex:1 1 300px;min-width:280px;}
  .plot-box{max-width:560px;}
  .plot-leggi{margin-top:10px;background:var(--panel2);border:1px solid var(--border);
    border-left:3px solid #4a8fc7;border-radius:0 10px 10px 0;padding:11px 14px;
    font-size:.93rem;color:var(--muted);}
  .plot-leggi b{color:#7ab8e0;}
  .plot-err{color:#ff6b6b;font-size:.85rem;}
  .open-body{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
  .open-body p:first-child{margin-top:0;} .open-body p:last-child{margin-bottom:0;}
  .open-body ul{margin:.4em 0;padding-left:1.2em;} .open-body li{margin:.35em 0;}

  .note{background:var(--panel2);border-left:3px solid var(--muted);border-radius:6px;
    padding:9px 12px;margin:12px 0;font-size:.9rem;color:var(--muted);}
  .note b{color:#ff9d6b;}
  .note.warn{background:var(--warnbg);border-left-color:var(--warn);color:#e0b85a;}
  .note.warn b{color:#f0c25a;}

  /* ---- GRAMMATICA ---- */
  .gramwrap{background:var(--grambg);border:1px solid #1f4d47;border-radius:12px;padding:6px 6px;}
  table.gramtab{border-collapse:collapse;width:100%;font-size:.92rem;}
  table.gramtab td{padding:9px 12px;vertical-align:top;border-bottom:1px solid #17332e;}
  table.gramtab tr:last-child td{border-bottom:none;}
  table.gramtab td.gs{white-space:nowrap;color:var(--gram);width:1%;
    border-right:1px solid #17332e;font-variant-numeric:tabular-nums;}
  .section > h3 .tag.gramtag{background:var(--grambg);border-color:#1f4d47;color:var(--gram);}

  /* ---- STRUMENTI (repertorio condiviso: la scheda si apre DENTRO la frase) ----
     Nessun accento nuovo: riusa il verde della grammatica, perche' uno strumento
     richiamato e' grammatica gia' spiegata altrove, non una quinta specie di blocco. */
  .str{color:var(--gram);border-bottom:1px dashed var(--gram);cursor:pointer;}
  .str:hover{background:var(--grambg);}
  .str::after{content:"\2666";font-size:.62em;vertical-align:.42em;margin-left:2px;opacity:.8;}
  .str.aperto::after{content:"\2715";}
  .str.rotto{color:#ff6b6b;border-bottom-color:#ff6b6b;cursor:help;}
  /* la scheda e' uno SPAN in display:block, non un div: i rimandi cadono dentro
     <p>, <li> e celle di tabella, dove un div e' HTML illegale. */
  .strcard{display:block;margin:10px 0;background:var(--grambg);border:1px solid #1f4d47;
    border-left:3px solid var(--gram);border-radius:0 10px 10px 0;padding:10px 14px;font-size:.9rem;}
  .strcard .sh{display:block;font-size:.66rem;font-weight:700;letter-spacing:.5px;
    text-transform:uppercase;color:var(--gram);margin-bottom:7px;}
  .strcard .sr{display:block;margin:5px 0;}
  .strcard .sk{color:var(--gram);font-weight:600;}

  /* ---- PROLESSI (preannuncio fisico) ---- */
  .prowrap{background:var(--probg);border:1px solid var(--proedge);border-radius:12px;padding:4px 4px 8px;}
  .prohead{padding:11px 14px 4px;color:var(--pro);font-size:.72rem;font-weight:700;letter-spacing:.7px;
    text-transform:uppercase;}
  .pro-oggetto{padding:2px 14px 11px;color:var(--muted);font-size:.92rem;border-bottom:1px solid var(--proline);
    margin-bottom:2px;} .pro-oggetto b{color:var(--txt);}
  table.protab{border-collapse:collapse;width:100%;font-size:.92rem;}
  table.protab td{padding:10px 12px;vertical-align:top;border-bottom:1px solid var(--proline);}
  table.protab tr:last-child td{border-bottom:none;}
  table.protab td.pd{white-space:nowrap;color:var(--pro);width:1%;font-weight:700;font-size:.78rem;
    letter-spacing:.3px;text-transform:uppercase;border-right:1px solid var(--proline);line-height:1.3;}
  .pro-domanda{margin:8px 8px 2px;background:#140d26;border:1px solid var(--proedge);
    border-left:3px solid var(--pro);border-radius:8px;padding:10px 14px;font-size:.92rem;}
  .pro-domanda b{color:var(--pro);}
  .section > h3 .tag.protag{background:var(--probg);border-color:var(--proedge);color:var(--pro);}

  /* ---- REVEAL ---- */
  .rsteps{display:flex;flex-direction:column;gap:12px;}
  .rstep{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 18px;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .rlabel{font-size:.7rem;font-weight:700;letter-spacing:.4px;color:var(--accent);
    text-transform:uppercase;margin-bottom:8px;}
  .rstep p:first-of-type{margin-top:0;} .rstep p:last-child{margin-bottom:0;}
  .rstep ul{margin:.4em 0;padding-left:1.2em;}
  .testo{background:#13233f;border:1px solid #2b4877;border-radius:12px;padding:14px 18px;margin-bottom:14px;}
  .testo .src{display:block;font-size:.74rem;font-style:italic;color:var(--accent2);margin-bottom:8px;
    text-transform:uppercase;letter-spacing:.3px;}
  .esame-nota{font-size:.9rem;color:var(--muted);font-style:italic;margin-top:12px;padding-left:12px;
    border-left:3px solid var(--border);}

  .reveal-btn{background:var(--accent);color:#fff;border:none;padding:11px 18px;border-radius:10px;
    font-size:.95rem;font-weight:600;cursor:pointer;margin-top:14px;transition:.12s;}
  .reveal-btn:hover:not(:disabled){background:var(--accent2);}
  .reveal-btn.small{padding:7px 14px;font-size:.85rem;margin-top:0;background:var(--panel2);
    color:var(--accent2);border:1px solid var(--border);}
  .reveal-btn.small:hover:not(:disabled){border-color:var(--accent);}
  .reveal-btn:disabled,.reveal-btn.done{background:var(--panel2);color:var(--muted);
    border:1px solid var(--border);cursor:default;}

  /* ---- COLLAUDO ---- */
  .collaudo-item{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 18px;margin-bottom:12px;}
  .cq{margin-bottom:10px;}
  .ca{margin-top:12px;background:var(--okbg);border:1px solid #235c33;border-radius:8px;
    padding:10px 14px;font-size:.94rem;}
  .ca b{color:#5fd980;}

  /* ---- PREV / NEXT ---- */
  .prevnext{display:flex;justify-content:space-between;gap:12px;margin-top:40px;
    border-top:1px solid var(--border);padding-top:20px;}
  .pnbtn{flex:1 1 0;background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:12px 16px;cursor:pointer;color:var(--txt);text-align:left;transition:.14s;font:inherit;}
  .pnbtn:hover{border-color:var(--accent);background:var(--panel2);}
  .pnbtn.next{text-align:right;}
  .pnbtn .k{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .pnbtn .t{font-weight:600;color:var(--accent2);}
  .pnbtn:disabled{opacity:.35;cursor:default;border-color:var(--border);background:var(--panel);}

  code{background:var(--panel2);border:1px solid var(--border);border-radius:5px;
    padding:1px 5px;font-size:.85em;color:var(--accent2);}
  .katex{font-size:1.02em;color:var(--txt);} .katex-display{margin:.5em 0;overflow-x:auto;overflow-y:hidden;}

  @media(max-width:860px){
    .shell{flex-direction:column;}
    .sidebar{width:100%;flex:none;position:static;max-height:none;border-right:none;
      border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:4px;}
    .sidebar h2{width:100%;} .navitem{width:auto;}
    .main{padding:20px 16px 80px;}
  }
</style>

var CORSO = 'meccanica-statistica';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["stirling"] = {"nome":"Approssimazione di Stirling","riga":"Per $N$ grande, $\\ln N! = N\\ln N - N + \\tfrac12\\ln(2\\pi N) + O(1/N)$; quasi sempre bastano i primi due termini.","serve":"Il fattoriale nasce ogni volta che si contano configurazioni, e $N!$ con $N\\sim 10^{23}$ non e' un numero che si maneggia. Stirling lo trasforma in una funzione liscia e derivabile di $N$ — ed e' proprio la derivabilita', non la comodita', il punto: senza di essa non si potrebbe massimizzare un'entropia rispetto a un numero di occupazione.","esempio":"Con $N=10$: $\\ln 10! = 15{,}104$, mentre $N\\ln N - N = 13{,}026$ e il termine $\\tfrac12\\ln(2\\pi N)=2{,}070$ porta a $15{,}096$ — tre cifre esatte gia' a dieci. Il terzo termine e' trascurabile in termodinamica perche' cresce come $\\ln N$ contro $N$: su $N=10^{23}$ pesa $10^{-22}$ in relativo. Per questo in meccanica statistica si scrive $\\ln N!\\simeq N\\ln N-N$ e non si guarda indietro.","pieno":null,"qui":{"meccanica-statistica":{"serve":"E' lo strumento senza il quale il conteggio microcanonico non diventa termodinamica. $S=k\\ln\\Omega$ con $\\Omega$ pieno di fattoriali resta un'espressione; applicato Stirling, $S$ diventa una funzione estensiva di $N$, $V$, $E$ che si puo' derivare per ottenere temperatura e pressione.","esempio":"Nel gas ideale il conteggio corretto di Boltzmann divide per $N!$, e il suo logaritmo $-\\ln N!\\simeq -N\\ln N+N$ e' esattamente il termine che rende l'entropia estensiva e scioglie il paradosso di Gibbs. Togliere Stirling di li' significa non vedere piu' da dove viene il $-N\\ln N$ della Sackur-Tetrode."}}};
STRUM["moltiplicatori-di-lagrange"] = {"nome":"Moltiplicatori di Lagrange","riga":"Per rendere stazionaria $f$ sotto i vincoli $g_{i}=0$ si rende stazionaria $f-\\sum_i\\lambda_i g_i$ nelle variabili libere, trattando i $\\lambda_i$ come incognite in piu'.","serve":"Permette di massimizzare senza prima risolvere i vincoli — che e' quasi sempre impossibile quando le variabili sono $10^{23}$. In cambio si pagano tante incognite quante sono i vincoli, e si guadagna che i moltiplicatori hanno quasi sempre un significato fisico: non sono scorie del metodo, sono le grandezze coniugate ai vincoli.","esempio":"Massimizzare $f=xy$ sul vincolo $x+y=2$: si annulla il gradiente di $xy-\\lambda(x+y-2)$, da cui $y=\\lambda$, $x=\\lambda$ e quindi $x=y=1$, $\\lambda=1$, massimo $1$. Sostituendo il vincolo a mano si sarebbe trovato lo stesso, ma con due vincoli e cento variabili la sostituzione non si fa e questa si'.","pieno":null,"qui":{"meccanica-statistica":{"serve":"E' il modo in cui gli ensemble si DEDUCONO invece di essere postulati: si massimizza l'entropia di Gibbs $S=-k\\sum_i p_i\\ln p_i$ sotto i vincoli che le probabilita' sommino a uno e che l'energia media sia fissata, e la distribuzione di Boltzmann esce come conseguenza. I due moltiplicatori non restano anonimi: uno si rivela essere $\\beta=1/kT$, l'altro la normalizzazione.","esempio":"Da $\\partial_{p_i}\\big[-k\\sum p\\ln p-\\alpha(\\sum p-1)-\\beta'(\\sum pE-U)\\big]=0$ si ottiene $-k(\\ln p_i+1)-\\alpha-\\beta' E_i=0$, cioe' $p_i\\propto e^{-\\beta E_i}$ con $\\beta=\\beta'/k$. Il confronto con la termodinamica identifica poi $\\beta=1/kT$: il moltiplicatore del vincolo sull'energia E' l'inverso della temperatura."}}};
STRUM["serie-geometrica"] = {"nome":"Serie geometrica","riga":"La somma $\\sum_{n\\ge 0} q^{n}$ vale $\\dfrac{1}{1-q}$ se $|q|\\lt 1$, e non esiste se $|q|\\ge 1$.","serve":"È l'unica serie di cui si conosce la somma in forma chiusa senza fatica, e per questo diventa il metro di tutte le altre: una serie si studia maggiorandola con una geometrica (criterio del rapporto, criterio della radice) o riconoscendola come geometrica travestita.","esempio":"Con $q=\\tfrac12$: $1+\\tfrac12+\\tfrac14+\\cdots=\\dfrac{1}{1-\\tfrac12}=2$. Con $q=-\\tfrac13$: $\\dfrac{1}{1+\\tfrac13}=\\tfrac34$. Con $q=1$ le somme parziali sono $N+1$ e se ne vanno: la formula $1/(1-q)$ non è una scorciatoia da usare fuori dal suo raggio.","pieno":{"file":"07-serie-funzioni.html","tappa":"04","come":"il raggio $R=1$, il grafico delle somme parziali e la cassetta dei trucchi che parte da qui, nella tappa sulle serie di potenze"},"qui":{"metodi-e-modelli":{"serve":"È il motore della serie di Laurent: lo sviluppo di $\\dfrac{1}{z-a}$ in potenze di $z$ o di $1/z$ è una geometrica, e quale delle due si sceglie decide in quale corona si sta sviluppando. Tutta la parte principale di Laurent nasce da qui.","esempio":"Per $\\dfrac{1}{z-2}$ con $|z|\\lt 2$ si scrive $-\\tfrac12\\cdot\\dfrac{1}{1-z/2}=-\\sum_{n\\ge0}\\dfrac{z^{n}}{2^{n+1}}$; in $z=1$ entrambi i membri valgono $-1$. Per $|z|\\gt 2$ si raccoglie invece $z$ e viene $\\sum_{n\\ge0}\\dfrac{2^{n}}{z^{n+1}}$, cioè solo potenze negative; in $z=4$ entrambi i membri valgono $\\tfrac12$."},"elettromagnetismo":{"serve":"Compare ogni volta che una configurazione si ripete con un fattore costante — catene di cariche immagine fra due piani conduttori, riflessioni multiple in una cavità — e la somma chiusa è ciò che rende il conto finito invece che infinito.","esempio":"Una carica fra due piani paralleli genera immagini a distanze crescenti, e il contributo al potenziale è una somma del tipo $\\sum_{n\\ge0} r^{n}$ con $r\\lt 1$ fissato dalla geometria. Con una riflettività $r=\\tfrac14$ la serie vale $\\tfrac43$: la catena è infinita, il potenziale no."}},"controllo":[{"tipo":"somma","espr":"(1/2)**n","var":"n","da":"0","a":"oo","vale":"2","dove":"esempio","appare":"=2"},{"tipo":"somma","espr":"(-1/3)**n","var":"n","da":"0","a":"oo","vale":"3/4","dove":"esempio","appare":"\\tfrac34"},{"tipo":"somma","espr":"-1**n/2**(n+1)","var":"n","da":"0","a":"oo","vale":"-1","dove":"qui.metodi-e-modelli.esempio","appare":"-1"},{"tipo":"somma","espr":"2**n/4**(n+1)","var":"n","da":"0","a":"oo","vale":"1/2","dove":"qui.metodi-e-modelli.esempio","appare":"\\tfrac12"},{"tipo":"somma","espr":"(1/4)**n","var":"n","da":"0","a":"oo","vale":"4/3","dove":"qui.elettromagnetismo.esempio","appare":"\\tfrac43"},{"tipo":"uguale","sinistra":"1/(1-2)","vale":"-1","dove":"qui.metodi-e-modelli.esempio","appare":"-1"},{"tipo":"uguale","sinistra":"1/(4-2)","vale":"1/2","dove":"qui.metodi-e-modelli.esempio","appare":"\\tfrac12"}]};
STRUM["delta-di-dirac"] = {"nome":"Delta di Dirac","riga":"Non è una funzione ma un funzionale, definito da $\\int f(x)\\,\\delta(x-a)\\,dx=f(a)$, che composto con una funzione si spezza sui suoi zeri come $\\delta(g(x))=\\sum_i \\delta(x-x_i)/|g'(x_i)|$.","serve":"Serve come macchina per cambiare variabile senza invertire nulla. La densità di $y=f(x)$ si scrive $p_Y(y)=\\int p_X(x)\\,\\delta(y-f(x))\\,dx$, e la delta produce da sola il fattore $1/|f'|$ che altrimenti andrebbe messo a mano: i rami molteplici si contano da soli invece di doverli ricordare. È la ragione pratica per cui il formalismo con la delta compare in ogni soluzione d'esame che tocchi una distribuzione, mentre il cambio di variabile esplicito compare quasi mai.","esempio":"$\\delta(x^2-a^2)$ con $a$ positivo. Gli zeri sono $x=\\pm a$; la derivata dell'argomento è $2x$, che in modulo vale $2a$ su entrambi. Quindi $\\delta(x^2-a^2)=\\dfrac{1}{2a}\\big[\\delta(x-a)+\\delta(x+a)\\big]$. Il caso si ripete identico in fisica statistica con $\\varepsilon=p^2/2m$ in una dimensione, dove i due rami $p=\\pm\\sqrt{2m\\varepsilon}$ contribuiscono entrambi — e dimenticarne uno dimezza la risposta.","pieno":{"file":"15-distribuzioni.html","tappa":"01","come":"le distribuzioni come funzionali, la delta e le sue proprietà, nel nucleo di Metodi"},"qui":{"meccanica-statistica":{"serve":"È lo strumento con cui si calcola la densità degli stati, cioè l'oggetto su cui poggia tutto il secondo tempo del corso: $g(\\varepsilon)=\\int d^dp\\,d^dq\\;\\delta(\\varepsilon-H)/h^d$. L'identità che si usa davvero non è la definizione ma questa: $\\delta(\\varepsilon-H)=\\partial_\\varepsilon\\,\\theta(\\varepsilon-H)$. Si scambia l'integrale con la derivata e ci si ritrova a calcolare il volume della regione dove l'hamiltoniana sta sotto $\\varepsilon$ — un integrale elementare — invece di un integrale con una delta dentro. La $g$ così ottenuta è pura geometria dello spazio delle fasi: non sa nulla della temperatura, e per questo resta identica quando si passa da Boltzmann a Fermi o a Bose.","esempio":"Particella libera in due dimensioni. Il volume della regione $p^2/2m$ sotto $\\varepsilon$ è il disco di area $2\\pi m\\varepsilon$; derivando rispetto a $\\varepsilon$ si ottiene $2\\pi m$, cioè una densità degli stati costante. Non è una curiosità: è la ragione per cui in due dimensioni una particella libera non condensa, e per cui le prove che chiedono la condensazione in $d=2$ mettono sempre un potenziale confinante, che porta la $g$ da costante a crescente."}},"controllo":[{"tipo":"derivata","espr":"x**2-a**2","rispetto":["x"],"vale":"2*x","ipotesi":{"x":"positive","a":"positive"},"dove":"esempio","appare":"2x"},{"tipo":"uguale","sinistra":"1/Abs(2*a)","vale":"1/(2*a)","ipotesi":{"a":"positive"},"dove":"esempio","appare":"\\dfrac{1}{2a}"},{"tipo":"derivata","espr":"2*pi*m*e","rispetto":["e"],"vale":"2*pi*m","ipotesi":{"m":"positive","e":"positive"},"dove":"qui.meccanica-statistica.esempio","appare":"2\\pi m"}]};
STRUM["integrale-gaussiano"] = {"nome":"Integrale gaussiano","riga":"$\\displaystyle\\int_{-\\infty}^{+\\infty} e^{-ax^{2}}\\,dx=\\sqrt{\\pi/a}$ per $a>0$, e $\\displaystyle\\int_{-\\infty}^{+\\infty} x^{2}e^{-ax^{2}}\\,dx=\\tfrac12\\sqrt{\\pi/a^{3}}$.","serve":"E' l'unico integrale che serve davvero sapere a memoria in meccanica statistica, perche' l'energia cinetica e' quadratica nell'impulso e quindi ogni integrazione sugli impulsi e' una gaussiana. Il trucco della dimostrazione — elevare al quadrato e passare in coordinate polari — vale la pena di vederlo una volta: e' il motivo per cui compare un $\\pi$ in una formula che di cerchi non parla.","esempio":"Da $I^{2}=\\iint e^{-a(x^{2}+y^{2})}dx\\,dy=2\\pi\\int_{0}^{\\infty}re^{-ar^{2}}dr=\\pi/a$ segue $I=\\sqrt{\\pi/a}$. I momenti superiori si ottengono derivando rispetto ad $a$ sotto il segno: $-\\partial_a I=\\int x^{2}e^{-ax^{2}}dx=\\tfrac12\\sqrt{\\pi}\\,a^{-3/2}$. Derivare rispetto a un parametro e' piu' rapido che integrare per parti, e funziona per tutti i momenti pari.","pieno":null,"qui":{"meccanica-statistica":{"serve":"La funzione di partizione di una particella libera e' un prodotto di tre gaussiane negli impulsi, e da li' esce la lunghezza d'onda termica $\\lambda=h/\\sqrt{2\\pi m k T}$ — che e' la grandezza con cui si misura quando un gas smette di essere classico.","esempio":"$\\int e^{-\\beta p^{2}/2m}dp=\\sqrt{2\\pi m/\\beta}$, quindi $Z_{1}=\\dfrac{V}{h^{3}}(2\\pi mkT)^{3/2}=V/\\lambda^{3}$. Lo stesso integrale col peso $p^{2}$ da' $\\langle p^{2}/2m\\rangle=\\tfrac12 kT$ per grado di liberta': l'equipartizione non e' un principio a parte, e' questo integrale."}}};
STRUM["ordini-di-grandezza"] = {"nome":"Ordini di grandezza","riga":"Stimare una quantità alla potenza di dieci giusta: si tiene una cifra significativa, si sommano e si sottraggono gli esponenti, e si controlla che l'unità del risultato sia quella che si voleva.","serve":"A sapere se un risultato è plausibile prima di averlo calcolato con precisione, e ad accorgersi di un errore di impostazione quando c'è ancora tempo per rimediare. In astrofisica non è una comodità ma il modo normale di ragionare, per due ragioni: le grandezze in gioco vanno da $10^{-36}$ kg a $10^{53}$ kg e nessuna intuizione le copre, e i dati osservativi sono noti al dieci o al venti per cento, quindi una cifra significativa è spesso tutto ciò che il problema contiene davvero. Il controllo che smaschera più errori non è sul numero, è sull'**unità**: un conto che dovrebbe dare una densità e dà dei kg è sbagliato nell'impostazione, e nessun affinamento dell'aritmetica lo salverà. La seconda regola è il confronto con un termine noto — l'acqua per una densità, il Sole per una massa o una luminosità, il parsec per una distanza galattica — perché un numero senza metro non dice niente.","esempio":"Densità media del Sole, dalle due sole quantità stampate in calce al foglio d'esame, $M_\\odot=1{,}989\\cdot10^{30}$ kg e $R_\\odot=6{,}957\\cdot10^{8}$ m: $\\rho=\\dfrac{3M_\\odot}{4\\pi R_\\odot^{3}}=1410\\ \\mathrm{kg/m^3}$. Il confronto è immediato e istruttivo: è quasi una volta e mezza l'acqua, cioè il Sole è in media meno denso della Terra — una stella non è un sasso grande, è un gas tenuto insieme dal proprio peso.","pieno":{"file":"as-01-la-scala-del-cosmo.html","tappa":"01","come":"la gerarchia delle strutture cosmiche letta come scala di ordini di grandezza, e il tempo di luce come secondo asse della stessa tabella"},"controllo":[{"tipo":"numero","espr":"3*1.989e30/(4*pi*(6.957e8)**3)","vale":"1410","dove":"esempio","appare":"1410"}]};
STRUM["funzione-gamma"] = {"nome":"Funzione Gamma","riga":"$\\Gamma(z)=\\displaystyle\\int_0^{\\infty}t^{z-1}e^{-t}\\,dt$, e da questa $\\displaystyle\\int_0^{\\infty}t^{k}e^{-at}\\,dt=\\dfrac{\\Gamma(k+1)}{a^{k+1}}$ per $a>0$.","serve":"E' il fattoriale esteso ai numeri non interi — $\\Gamma(n+1)=n!$ — e soprattutto e' la forma chiusa di TUTTI gli integrali del tipo «potenza per esponenziale». Sapere questa sola formula sostituisce una decina di integrazioni per parti, e permette di leggere a vista il risultato di un integrale appena si riconosce l'esponente della potenza.","esempio":"Da $\\Gamma(z+1)=z\\,\\Gamma(z)$, che si ottiene integrando per parti una volta, discende $\\Gamma(n+1)=n!$ per $n$ intero: $\\Gamma(1)=1$, $\\Gamma(2)=1$, $\\Gamma(3)=2$, $\\Gamma(4)=6$. Sui semi-interi il capostipite e' $\\Gamma(\\tfrac12)=\\sqrt\\pi$ — che e' l'integrale gaussiano travestito — e da li' $\\Gamma(\\tfrac32)=\\tfrac12\\sqrt\\pi$, $\\Gamma(\\tfrac52)=\\tfrac34\\sqrt\\pi$. Un integrale come $\\int_0^\\infty t^{2}e^{-at}dt$ vale dunque $\\Gamma(3)/a^{3}=2/a^{3}$, senza fare nessun conto.","pieno":null,"qui":{"meccanica-statistica":{"serve":"E' l'inventario degli integrali del canonico ridotto a una riga. Ogni funzione di partizione di singola particella e' un integrale di potenza per esponenziale — cambia solo l'esponente, e con esso la fisica: $t^{1/2}$ per il gas classico, $t^{2}$ per l'ultrarelativistico, $t^{3/n}$ per un potenziale $\\alpha r^{n}$. Riconoscere quale $\\Gamma$ si sta calcolando e' cio' che distingue chi risolve lo scritto in dieci minuti da chi lo risolve in un'ora.","esempio":"Per una particella relativistica con $\\varepsilon=cp$ la partizione porta $\\int_0^\\infty p^{2}e^{-\\beta cp}dp=\\Gamma(3)/(\\beta c)^{3}=2/(\\beta c)^{3}$, da cui $\\langle\\varepsilon\\rangle=3T$ invece dei $\\tfrac32T$ del caso non relativistico. Il fattore 3 contro $3/2$ viene per intero dall'esponente della potenza, cioe' dall'argomento della Gamma: la dipendenza dell'energia dalla quantita' di moto decide da sola quanto calore serve a scaldare il gas."}}};
STRUM["funzione-zeta-di-riemann"] = {"nome":"Funzione zeta di Riemann","riga":"$\\zeta(s)=\\sum_{n\\ge1} n^{-s}$, convergente per $s>1$; i valori che servono sono $\\zeta(3/2)\\simeq 2{,}612$, $\\zeta(2)=\\pi^{2}/6\\simeq1{,}645$, $\\zeta(3)\\simeq1{,}202$, $\\zeta(4)=\\pi^{4}/90$.","serve":"Compare tutte le volte che una somma su stati discreti viene approssimata con un integrale e si sviluppa l'integrando in serie geometrica: si scambiano somma e integrale e resta una zeta moltiplicata per una gamma. Non e' un abbellimento — il valore NUMERICO di $\\zeta(3/2)$ decide se una transizione di fase esiste.","esempio":"$\\displaystyle\\int_{0}^{\\infty}\\frac{x^{s-1}}{e^{x}-1}dx=\\Gamma(s)\\zeta(s)$, che si ottiene scrivendo $\\frac{1}{e^{x}-1}=\\sum_{n\\ge1}e^{-nx}$ e integrando termine a termine. Per $s=4$ da' $\\pi^{4}/15$, che e' la costante che compare nella legge di Stefan-Boltzmann.","pieno":null,"qui":{"meccanica-statistica":{"serve":"E' cio' che rende la condensazione di Bose-Einstein un fatto e non una possibilita'. Il numero di particelle negli stati eccitati e' limitato superiormente da un integrale che vale $\\zeta(3/2)$: siccome quel numero e' FINITO, oltre una certa densita' le particelle in eccesso non hanno dove stare se non nello stato fondamentale.","esempio":"La condizione critica e' $n\\lambda^{3}=\\zeta(3/2)\\simeq2{,}612$, che definisce $T_{c}$. In due dimensioni lo stesso conto porta a $\\zeta(1)$, che DIVERGE: gli stati eccitati accolgono qualunque numero di particelle e la condensazione non avviene. La dimensionalita' entra nel risultato attraverso l'argomento della zeta, e il confine e' esattamente $s=1$."}}};

function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';
  return h;
}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

{ num:'00', title:'Di cosa parla questo movimento', meta:'Meccanica Statistica · voce A.11 · due statistiche che escono dallo stesso conto · e il dizionario che traduce le somme in integrali',
  blocchi:[
  {t:'prosa', title:'Un conto solo, due domini di somma', tag:'architettura', html:R`
  <p>Ci sono due formule che ogni scritto di questo corso finisce per chiedere, e che vengono presentate quasi sempre come due cose diverse: la <b>distribuzione di Fermi-Dirac</b>, che governa gli elettroni, e la <b>distribuzione di Bose-Einstein</b>, che governa i fotoni e gli atomi a spin intero. Questo movimento sostiene — e mostra — che sono la stessa formula, e che la differenza fra le due non sta in un principio ma in <i>dove si ferma una sommatoria</i>.</p>
  <p>Il punto di partenza è meccanico-quantistico e non statistico: due particelle identiche non sono due oggetti con un&rsquo;etichetta, perché l&rsquo;hamiltoniana è invariante per scambio e la funzione d&rsquo;onda può soltanto essere simmetrica o antisimmetrica. Crisanti (pag. 231) lo ricava in quattro righe dall&rsquo;operatore di permutazione; la conseguenza operativa, che è tutto ciò che serve qui, è che uno stato del gas non si specifica dicendo <i>quale</i> particella sta in quale livello, ma solo <b>quante</b> ne stanno in ciascuno. I numeri interi che contano queste occupazioni sono i <b>numeri di occupazione</b> $n_p$, e i loro valori permessi sono i soli due insiemi</p>
  $$n_p\in\{0,1,2,\dots\}\ \ (\text{bosoni}),\qquad n_p\in\{0,1\}\ \ (\text{fermioni})$$
  <p>Tutto il resto è conseguenza. Applicando l&rsquo;insieme gran canonico a un sistema di particelle indipendenti la funzione di gran partizione si <b>fattorizza sui livelli</b>, e ogni fattore è una somma su un solo indice:</p>
  $$\mathcal Z=\prod_p\left[\sum_{n_p}\left(ze^{-\beta\varepsilon_p}\right)^{n_p}\right]$$
  <p>A questo punto la somma interna, per i bosoni, corre su tutti gli interi ed è una serie geometrica; per i fermioni ha <b>due soli termini</b>. Due risultati diversi dallo stesso conto, e la differenza è il dominio di $n_p$. Il numero medio di occupazione che ne esce è una formula unica con un doppio segno,</p>
  $$\langle n_\varepsilon\rangle=\frac{1}{e^{\beta(\varepsilon-\mu)}\mp1}$$
  <p>dove d&rsquo;ora in poi, e senza eccezioni, <b>il segno superiore vale per i bosoni e quello inferiore per i fermioni</b>.</p>
  <p>La seconda metà del movimento è un dizionario. Le formule qui sopra vivono su un indice discreto $p$ che etichetta i livelli di una scatola, mentre ogni problema d&rsquo;esame chiede numeri — un&rsquo;energia, una pressione, un calore specifico — e quindi un integrale. Il traduttore è la <b>densità degli stati</b></p>
  $$G(\varepsilon)=\int\frac{d^3q\,d^3p}{h^3}\,\delta(\varepsilon-H)$$
  <p>e Crisanti (pag. 260) dice di lei la frase più utile di tutto il capitolo: «per risolvere gli esercizi si parte sempre dal calcolo di questo termine». La traduzione però non è gratuita, e la tappa 06 mostra il punto esatto in cui perde un pezzo.</p>
  <div class="note"><b>Convenzioni, e sette disaccordi dichiarati subito.</b> Crisanti e Grilli-Giardina pongono $k_B=1$ (la temperatura è un&rsquo;energia, $\beta=1/T$); Falcioni-Vulpiani tiene $k_B$ esplicito. Qui si scrive $k_B=1$ nei conti simbolici e lo si rimette quando si fanno i <b>numeri</b>, perché un ordine di grandezza si controlla in unità SI. I disaccordi veri, che incontreremo sul posto e che segnalerò lì, sono: <b>(a)</b> il doppio segno, che Crisanti scrive $\mp$ a pag. 258 e $\pm$ a pag. 260 <i>nella stessa formula</i>; <b>(b)</b> la condizione su $\mu$ per i bosoni, scritta $\mu\le0$ da entrambe le fonti ma vera solo perché entrambe pongono il fondamentale a energia nulla; <b>(c)</b> dove va il fattore di spin $g_s$, che una fonte tiene fuori dalla densità di stati e l&rsquo;altra dentro; <b>(d)</b> la forma a tangente iperbolica della Fermi-Dirac, che nelle note di Grilli-Giardina ha il segno sbagliato — qui è corretta e verificata; <b>(e)</b> le <i>due</i> lunghezze d&rsquo;onda che Crisanti definisce nella stessa pagina; <b>(f)</b> la strada per arrivare alle due distribuzioni, combinatoria in Crisanti e Falcioni-Vulpiani, gran canonica in Grilli-Giardina; <b>(g)</b> il fattore $g_s$ dentro o fuori il logaritmo del potenziale chimico classico.</div>`},
  {t:'prosa', title:'Perché questo movimento pesa piu di ogni altro, e come e fatto', tag:'architettura', html:R`
  <p><b>Il peso, misurato.</b> Su quarantasette prove d&rsquo;esame, <b>quarantasette</b> toccano questo argomento. «Fermi» compare in 46, «Bose» in 43, lo spin in 44 — quasi sempre nella forma minima «particelle di spin $S$», che serve solo a fissare la degenerazione $g_s=2S+1$ — e la densità di stati in 12. Non è un argomento fra gli altri: è <b>il punto di giunzione dello scritto</b>. La struttura tipica di una prova è sempre la stessa: si dà un&rsquo;hamiltoniana di singola particella, spesso con un potenziale esterno; si chiede di risolvere il problema <i>classico</i> (energia media, distribuzione di una grandezza, equazione di stato); e poi si chiede lo stesso sistema con particelle quantistiche — fermioni a temperatura zero, bosoni con la domanda «c&rsquo;è condensazione?». Le due metà condividono un solo oggetto, ed è la densità di stati del problema.</p>
  <p>Questo decide come è scritto il movimento. Le tappe 02 e 05 sono <b>addestramento</b>: la derivazione unica e il calcolo di $G(\varepsilon)$ con un potenziale generico sono i due punti in cui una prova si vince o si perde nei primi dieci minuti, e sono sviluppati fino all&rsquo;ultimo passaggio, con il caso a potenziale costante a tratti svolto per intero. Le altre tappe sono comprensione, che all&rsquo;orale conta e allo scritto evita gli errori di segno.</p>
  <p><b>La rotta.</b> Si comincia dall&rsquo;indistinguibilità e dal conteggio degli stati, con la via combinatoria che Crisanti e Falcioni-Vulpiani percorrono — perché è quella che rende visibile <i>dove</i> entra il vincolo di Pauli. Poi la derivazione unica nel gran canonico, con lo scambio fra somma e produttoria che Grilli-Giardina chiama, con onestà, «a very delicate step»: è il passaggio che scioglie il vincolo $\sum_pn_p=N$ e rende il conto possibile. Quindi il numero di occupazione medio, le sue proprietà e le condizioni su $\mu$; il limite classico e il parametro che lo governa; la densità degli stati, in una e in $d$ dimensioni, con e senza potenziale esterno; la sostituzione somma-integrale con la sua crepa; le grandezze termodinamiche in forma unificata, dove esce $PV=\tfrac23E$ per entrambi i gas; lo sviluppo ad alta temperatura, con la correzione quantistica al primo ordine e il segno che distingue i due; e infine i due regimi degeneri, annunciati con il conto che li definisce. Chiudono tre esercizi d&rsquo;esame veri.</p>`}
]},

/* ---------------- 01 · L INDISTINGUIBILITA E IL CONTEGGIO ---------------- */
{ num:'01', title:'Perche l indistinguibilita cambia il conteggio, e la via combinatoria', meta:'lo scambio come operatore · i due soli segni possibili · i numeri di occupazione · celle, Stirling e moltiplicatori',
  blocchi:[
  {t:'reveal', title:'Lo scambio come operatore, e perche i segni sono due e non di piu', tag:'costruzione', steps:[
   {label:'P al quadrato e l identita, e cio che ne segue', body:R`
   <p>La meccanica statistica classica conta punti nello spazio delle fasi e divide per $N!$ alla fine, come rimedio postumo all&rsquo;indistinguibilità. La quantistica non ha bisogno del rimedio, perché l&rsquo;indistinguibilità le è strutturale, e Crisanti (pag. 231) la ricava senza nessun ingrediente statistico.</p>
   <p>Si prendano due particelle identiche con coordinate $\vec r_1,\vec r_2$ e si definisca l&rsquo;<b>operatore di permutazione</b> $P$ tramite la sua azione sulle funzioni d&rsquo;onda:</p>
   $$P\psi(\vec r_1,\vec r_2)=\psi(\vec r_2,\vec r_1)$$
   <p>Scambiare due volte non fa nulla, quindi $P^2=I$; e se l&rsquo;hamiltoniana è invariante sotto permutazione — che è <i>la definizione</i> di «particelle identiche» — allora $PHP^{-1}=H$, cioè $[H,P]=0$, e i due operatori si diagonalizzano simultaneamente. Applicando $P$ a un&rsquo;autofunzione di $H$:</p>
   $$H(P\psi)=PHP^{-1}P\psi=E(P\psi)$$
   <p>dunque $P\psi$ è ancora autofunzione con lo <i>stesso</i> autovalore. Se l&rsquo;energia non è degenere, $\psi$ e $P\psi$ devono descrivere lo stesso stato fisico e possono differire al più per un fattore. Quel fattore è un autovalore di $P$, e da $P^2=I$ segue che vale $+1$ oppure $-1$. Quindi</p>
   $$\psi(\vec r_1,\vec r_2)=\pm\,\psi(\vec r_2,\vec r_1)$$
   <p>e non c&rsquo;è nessuna terza possibilità. Le particelle con funzione d&rsquo;onda <b>simmetrica</b> si chiamano <b>bosoni</b>; quelle con funzione d&rsquo;onda <b>antisimmetrica</b>, <b>fermioni</b>. Questa è tutta la meccanica quantistica che serve al movimento: il resto è conteggio.</p>
   <p><b>Perché due segni e non un continuo di fasi.</b> L&rsquo;argomento sopra usa $P^2=I$, che è vero perché lo scambio è un&rsquo;operazione discreta e involutiva. In due dimensioni spaziali l&rsquo;argomento si indebolisce — lo scambio diventa una treccia e non un&rsquo;involuzione — e compaiono statistiche intermedie; ma in tre dimensioni, che è il caso di ogni prova d&rsquo;esame di questo corso, i segni sono due.</p>`},
   {label:'Contare gli stati di due particelle: tre numeri diversi', body:R`
   <p>Crisanti rende visibile la conseguenza con l&rsquo;esempio più semplice possibile (pag. 231). Si prendano due particelle e due funzioni d&rsquo;onda di singola particella, $f$ localizzata in $A$ e $g$ localizzata in $B$, senza sovrapposizione. <i>Classicamente</i> ci sono due stati distinti: la particella 1 in $A$ e la 2 in $B$, descritto da $f(x_1)g(x_2)$; oppure lo scambio, $f(x_2)g(x_1)$. <b>Quantisticamente esiste un solo stato</b>, con una sola funzione d&rsquo;onda:</p>
   $$f(x_1)g(x_2)\pm f(x_2)g(x_1)$$
   <p>col segno $+$ per i bosoni e $-$ per i fermioni. Non è che i due stati classici siano «equivalenti»: è che erano un conteggio sbagliato, e la correzione non è un fattore $1/2$ — è una ricostruzione.</p>
   <p>Il conteggio si vede meglio se si contano davvero. Due particelle, due stati di singola particella disponibili $a$ e $b$. <b>Particelle distinguibili</b>: ogni particella sceglie indipendentemente, quindi</p>
   $$2^2=4$$
   <p>stati — $aa$, $bb$, e i due modi di fare $ab$. <b>Bosoni</b>: conta solo quante particelle stiano in $a$, dunque le configurazioni sono $(2,0)$, $(1,1)$, $(0,2)$, e in generale il numero di modi di distribuire $n$ bosoni identici in $g$ stati è il coefficiente binomiale con ripetizione:</p>
   $$\binom{n+g-1}{n}=\binom{3}{2}=3$$
   <p><b>Fermioni</b>: ogni stato ospita al più una particella, quindi si tratta di <i>scegliere</i> quali stati riempire, e</p>
   $$\binom{g}{n}=\binom{2}{2}=1$$
   <p>un solo stato, quello con entrambi i livelli occupati. Quattro, tre, uno: tre conteggi diversi per lo stesso sistema fisico, e il primo non descrive nessun sistema reale. Crisanti lo dice senza attenuanti (pag. 235): il conteggio classico «non corrisponde ad alcuna statistica utilizzabile realmente nel modo fisico».</p>`},
   {label:'I numeri di occupazione, e il vincolo che rende scomodo il canonico', body:R`
   <p>Per $N$ particelle si costruisce una base completa a partire da un insieme ortonormale di funzioni d&rsquo;onda di singola particella $u_\alpha(\vec r)$, con $\int d^3r\,u^*_\alpha u_\beta=\delta_{\alpha\beta}$, simmetrizzando o antisimmetrizzando il prodotto. Per i fermioni la combinazione antisimmetrica è il <b>determinante di Slater</b>, e Crisanti (pag. 232) ne trae il principio di esclusione come proprietà algebrica invece che come postulato: un determinante con due righe uguali vale zero, quindi <i>se due delle $u_i$ coincidono la funzione d&rsquo;onda si annulla</i>. Pauli non è un divieto imposto, è un determinante che si annulla.</p>
   <p>La conseguenza di etichettatura è quella che comanda tutto il resto. Lo stato di $N$ particelle è individuato dall&rsquo;insieme $(\alpha_1,\dots,\alpha_N)$ <b>in cui l&rsquo;ordine non è rilevante</b>: e allora, invece dell&rsquo;insieme, si specifica quante particelle stiano in ciascuno stato. Il <b>numero di occupazione</b> $n_\alpha$ è definito così, e i valori permessi sono</p>
   $$n_\alpha=\begin{cases}0,1,2,\dots,\infty&\text{bosoni}\\0,1&\text{fermioni}\end{cases}$$
   <p>Grilli-Giardina (pag. 80) enunciano lo stesso fatto con la formula che useremo come definizione operativa: lo stato quantistico è completamente definito dall&rsquo;insieme $\{n_p\}$, cioè $|\Phi\rangle\Leftrightarrow\{n_p\}$, e per contare gli stati basta contare i diversi $\{n_p\}$. Energia e numero di particelle si leggono direttamente:</p>
   $$E(\{n_p\})=\sum_p\varepsilon_pn_p,\qquad N=\sum_pn_p$$
   <p>Qui nasce il problema che questo movimento deve risolvere. La funzione di partizione canonica è</p>
   $$Z(T,V,N)=\sum_{\{n_p\}}{}^{\prime}\,e^{-\beta\sum_p\varepsilon_pn_p},\qquad \sum_{\{n_p\}}{}^{\prime}\equiv\sum_{\{n_p\}}\delta\Big(\sum_pn_p-N\Big)$$
   <p>dove l&rsquo;apice sulla somma ricorda che si sommano solo le configurazioni con il numero <i>giusto</i> di particelle. Quel vincolo è letale: impedisce di fattorizzare la somma sui livelli, perché le occupazioni dei diversi livelli non sono indipendenti — se uno ne prende una in più, un altro deve prenderne una in meno. Grilli-Giardina lo liquidano in una riga: «the constraint is hard to calculate with standard methods». È esattamente la ragione per cui la tappa 02 va nel gran canonico.</p>`}
  ]},
  {t:'prosa', title:'La via combinatoria: lo stesso risultato per una strada che non useremo', tag:'costruzione', html:R`
  <p>Prima di andare nel gran canonico vale la pena percorrere la strada che <i>non</i> prenderemo, per due ragioni: è quella di Crisanti (pag. 234-235) e di Falcioni-Vulpiani (pag. 42), quindi è quella che si trova aprendo due delle tre fonti; e soprattutto è quella in cui si <b>vede</b> dove entra il vincolo di Pauli, perché entra in un coefficiente binomiale.</p>
  <p><b>L&rsquo;impostazione a celle.</b> Nel limite termodinamico lo spettro è un quasi-continuo, e per contare si divide in celle $i=1,2,\dots$ con $g_i$ stati ciascuna e energia comune $\varepsilon_i$. Crisanti mette in guardia sul fatto che la suddivisione è grossolana e che «la degenerazione della cella dovrebbe scomparire dalla espressione finale»: se $g_i$ sopravvive nel risultato, il conto è sbagliato. Le occupazioni soddisfano i due vincoli $\sum_ln_l=N$ e $\sum_l\varepsilon_ln_l=E$, e il numero di modi di realizzare una data configurazione è un <b>prodotto</b> sulle celle,</p>
  $$\Omega(\{n_j\})=\prod_jw_j(n_j)$$
  <p>perché scambiare due particelle fra celle diverse non produce uno stato nuovo. Si confronti con la formula classica $\Omega=N!/(n_1!n_2!\cdots n_k!)$: lì si contano le permutazioni fra celle, qui no, ed è tutta la differenza fra le due fisiche.</p>
  <p><b>Il caso fermionico.</b> Mettere $n_j$ fermioni in $g_j$ stati significa <i>scegliere</i> quali $g_j$ stati occupare, dunque $w_j=\binom{g_j}{n_j}$ e</p>
  $$\Omega(\{n_j\})=\prod_j\frac{g_j!}{n_j!\,(g_j-n_j)!}$$
  <p>Con $g_j$ e $n_j$ entrambi grandi si applica <span class="str" data-str="stirling">Stirling</span> nella forma $\log m!\simeq m\log m-m$, e i termini lineari si cancellano a coppie perché $n_j+(g_j-n_j)=g_j$:</p>
  $$\log\Omega=\sum_j\Big[g_j\log g_j-n_j\log n_j-(g_j-n_j)\log(g_j-n_j)\Big]$$
  <p><b>La massimizzazione vincolata.</b> Si cerca la configurazione più probabile massimizzando $\log\Omega$ con i due vincoli, cioè annullando la variazione di $\log\Omega+\alpha\sum_jn_j-\beta\sum_j\varepsilon_jn_j$ con <span class="str" data-str="moltiplicatori-di-lagrange">due moltiplicatori di Lagrange</span>. Siccome le $\delta n_j$ sono indipendenti e arbitrarie, si annulla il coefficiente di ciascuna. La derivata della parentesi rispetto a $n_j$ vale</p>
  $$\frac{\partial}{\partial n}\Big[g\log g-n\log n-(g-n)\log(g-n)\Big]=\log(g-n)-\log(n)$$
  <p>— i due termini $\pm1$ generati dalle due derivate logaritmiche si elidono — e la condizione di massimo diventa</p>
  $$-\log n_j+\log(g_j-n_j)+\alpha-\beta\varepsilon_j=0$$
  <p>che si risolve isolando il rapporto: $(g_j-n_j)/n_j=e^{\beta\varepsilon_j-\alpha}$, cioè</p>
  $$n_j=\frac{g_j}{e^{-\alpha+\beta\varepsilon_j}+1}$$
  <p>Questa è la <b>distribuzione di Fermi</b>. Il moltiplicatore $\alpha$ è quello che impone il numero di particelle, e la termodinamica lo identifica con $\beta\mu$; posto $\alpha=\beta\mu$, l&rsquo;occupazione <i>per stato</i> è $n_j/g_j=1/(e^{\beta(\varepsilon_j-\mu)}+1)$ e la degenerazione di cella è sparita dal risultato, come Crisanti aveva preteso. Il controllo di consistenza si fa sostituendo la soluzione dentro la condizione di massimo:</p>
  $$\log\frac{g-g/(e^x+1)}{g/(e^x+1)}=x$$
  <p>con $x\equiv\beta(\varepsilon-\mu)$: il numeratore è $ge^x/(e^x+1)$, il rapporto è $e^x$, e il logaritmo restituisce $x$. Fatto.</p>
  <p><b>Il caso bosonico</b>, che Crisanti non svolge e che si ottiene con la stessa macchina cambiando un solo ingrediente. Distribuire $n$ bosoni identici in $g$ stati è il problema delle «barre e stelle»: si allineano $n$ oggetti e $g-1$ separatori, e si sceglie quali posizioni siano separatori, quindi $w=\binom{n+g-1}{n}$. Per $g$ grande si può usare $n+g-1\simeq n+g$, e Stirling dà $\log w\simeq(n+g)\log(n+g)-n\log n-g\log g$. La derivata è</p>
  $$\frac{\partial}{\partial n}\Big[(n+g)\log(n+g)-n\log n-g\log g\Big]=\log(n+g)-\log(n)$$
  <p>e annullando $\log((n+g)/n)+\alpha-\beta\varepsilon=0$ si ottiene $(n+g)/n=e^{\beta\varepsilon-\alpha}$, cioè $g/n=e^{\beta(\varepsilon-\mu)}-1$ e quindi $n/g=1/(e^{\beta(\varepsilon-\mu)}-1)$. Anche qui il controllo è la sostituzione all&rsquo;indietro:</p>
  $$\log\frac{g/(e^x-1)+g}{g/(e^x-1)}=x$$
  <p><b>Il disaccordo (f), e perché non prendiamo questa strada.</b> Falcioni-Vulpiani (pag. 42) presenta questo procedimento come «il metodo, a volte usato, di ricavare le distribuzioni di Bose-Einstein e Fermi-Dirac impostando un problema di massimizzazione per le distribuzioni empiriche», e ottiene esattamente $\langle n_s\rangle_B=1/(e^{\beta(\varepsilon_s-\mu)}-1)$ e $\langle n_s\rangle_F=1/(e^{\beta(\varepsilon_s-\mu)}+1)$; Grilli-Giardina invece le ricava dal gran canonico senza mai nominare una cella. Il risultato è lo stesso, <b>lo statuto logico no</b>: la via combinatoria ha bisogno di celle con molti stati, di occupazioni grandi e di Stirling — cioè di tre approssimazioni — e dà la configurazione <i>più probabile</i>, non la media; la via gran canonica non ha bisogno di nessuna delle tre e dà direttamente la media. Quando in un esercizio i numeri sono piccoli — due livelli, tre particelle — la via combinatoria non si può usare e la gran canonica sì. È per questo che la tappa seguente rifà tutto da capo.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Il fattore $1/N!$ della statistica classica e il conteggio quantistico degli stati servono alla stessa cosa. Perché allora non coincidono?`,
    a:R`Perché $1/N!$ è esatto solo quando le occupazioni multiple sono trascurabili. Il criterio invocato è che $N!$ conta le permutazioni di $N$ oggetti <i>tutti in stati diversi</i>: se due particelle stanno nello stesso stato, le loro permutazioni sono $2!$ e non $N!$ in eccesso, e la divisione toglie troppo. Il conteggio quantistico, che assegna a ogni insieme $\{n_p\}$ esattamente un peso, è giusto sempre; la divisione per $N!$ è la sua approssimazione nel regime in cui quasi tutti gli $n_p$ valgono $0$ o $1$. La tappa 04 mostra che il parametro che misura quanto l&rsquo;approssimazione sia buona è $n\lambda^3$, e la tappa 05 che il rimedio classico, applicato dove non vale, produce il paradosso di Gibbs al contrario: non un&rsquo;entropia non estensiva, ma una pressione sbagliata.`},
   {q:R`Nella via combinatoria si massimizza $\log\Omega$ con due vincoli e si ottiene una sola formula. Dove sono finite le fluttuazioni?`,
    a:R`Sono state buttate via, ed è il prezzo del metodo. Il criterio da riconoscere è l&rsquo;<b>integrazione di picco</b>: $\log\Omega$ è di ordine $N$, quindi la distribuzione delle configurazioni è piccata come $e^{-cN(\delta n)^2}$ attorno al massimo e la configurazione più probabile coincide con la media a meno di $O(N^{-1/2})$. Ma «coincide a meno di $O(N^{-1/2})$» non è «coincide»: se il sistema ha un livello la cui occupazione diventa macroscopica mentre gli altri restano microscopici, il picco non è più dove il conto lo mette. È esattamente ciò che succede a un gas di bosoni freddo, e la tappa 06 lo mostra come proprietà di un integrale, non come patologia esotica.`}
  ]}
]},

/* ---------------- 02 · LA DERIVAZIONE UNICA ---------------- */
{ num:'02', title:'La derivazione unica: un livello alla volta, e due domini per la stessa somma', meta:'lo scambio fra somma e produttoria · la geometrica dei bosoni · i due termini dei fermioni · il prodotto che sostituisce il vincolo',
  blocchi:[
  {t:'reveal', title:'Lo scambio fra somma e produttoria, che e il passaggio delicato', tag:'costruzione', steps:[
   {label:'La gran partizione, scritta sugli insiemi di occupazione', body:R`
   <p>Il vincolo $\sum_pn_p=N$ è ciò che rende impraticabile il canonico. Il rimedio è quello già costruito: si lascia fluttuare $N$, si introduce la fugacità $z=e^{\beta\mu}$ e si somma sui settori,</p>
   $$\mathcal Z(T,V,z)=\sum_{N=0}^{\infty}z^N\,Z(T,V,N)=\sum_{N=0}^{\infty}z^N\sum_{\{n_p\}}e^{-\beta\sum_p\varepsilon_pn_p}\,\delta\Big(\sum_pn_p-N\Big)$$
   <p>Il primo passo è una riscrittura innocua. Dentro la somma, la delta impone $N=\sum_pn_p$: quindi $z^N$ si può scrivere $z^{\sum_pn_p}$, che è un <i>prodotto</i> di potenze, una per livello. Lo stesso vale per l&rsquo;esponenziale, che essendo l&rsquo;esponenziale di una somma è un prodotto di esponenziali. Raggruppando per livello:</p>
   $$\mathcal Z=\sum_{N=0}^{\infty}\sum_{\{n_p\}}\ \prod_p z^{n_p}e^{-\beta\varepsilon_pn_p}\ \delta\Big(\sum_pn_p-N\Big)$$
   <p>Tutto ciò che è successo finora è algebra di esponenti. Il passaggio successivo, invece, non lo è, e Grilli-Giardina (pag. 81) lo annunciano con una frase che vale la pena tenere: «the following is a very delicate step and requires a profound understanding of the quantities in play».</p>`},
   {label:'Invertire somma e produttoria: cosa cambia di significato', body:R`
   <p>Si vuole scambiare la somma sulle configurazioni con la produttoria sui livelli:</p>
   $$\sum_{\{n_p\}}\prod_p\ \longrightarrow\ \prod_p\sum_{n_p=0}^{\ }$$
   <p>e conviene fermarsi a capire <i>che cosa cambia di significato</i>, perché è qui che si sbaglia. Nella scrittura di sinistra, $\{n_p\}$ è una <b>configurazione</b>: si fissa l&rsquo;intera lista delle occupazioni e se ne calcola il peso, poi si passa alla lista successiva. Nella scrittura di destra la produttoria fissa il livello $p$, e la somma che le sta dentro non guarda più la configurazione totale: <b>si concentra su un singolo livello e somma su tutti i valori che la sua occupazione può assumere</b>. Grilli-Giardina lo scandiscono con tre righe di dizionario — $p$ fissa l&rsquo;indice, cioè il livello; $n_p$ definisce il numero di particelle in quel livello; $\{n_p\}$ fissa una configurazione — e con due figure che elencano le configurazioni a $N=1$ e a $N=2$.</p>
   <p>Lo scambio è lecito per una ragione precisa, ed è il motivo per cui serviva il gran canonico: <b>siccome $N$ corre da zero all&rsquo;infinito, ogni livello può ricevere qualunque occupazione compatibile con la sua statistica</b>, indipendentemente da quello che fanno gli altri. Guardando il livello $p=1$: la configurazione con $N=1$ che mette la particella altrove dà $n_1=0$; quella con $N=1$ che la mette lì dà $n_1=1$; una configurazione con $N=2$ dà $n_1=2$; e così via. Le occupazioni sono diventate <b>variabili indipendenti</b>, ed è esattamente ciò che il vincolo impediva.</p>
   <p>Resta la delta, che ora dipende solo dalle $n_p$ ed è sommata su $N$: per ogni configurazione esiste uno e un solo $N$ che la soddisfa, dunque $\sum_{N=0}^{\infty}\delta(\sum_pn_p-N)=1$. Il vincolo non è stato approssimato né trascurato: è stato <b>consumato</b>, e ha lasciato un fattore uno. Resta</p>
   $$\mathcal Z(T,V,z)=\prod_p\sum_{n_p}\left(ze^{-\beta\varepsilon_p}\right)^{n_p}$$
   <p>Si guardi che cosa è diventato il problema. Prima era una somma vincolata su liste di interi lunghe quanto lo spettro; adesso è un prodotto di somme <i>a un indice</i>, ciascuna delle quali riguarda un livello solo e non sa niente degli altri. <b>È il gran canonico che paga il suo conto</b>: il baratto «numero di particelle contro potenziale chimico» ha comprato la fattorizzazione.</p>`},
   {label:'Le due somme, e dove nasce la differenza fra i due gas', body:R`
   <p>Ora si specializza, e <b>il conto è uno solo</b>: cambia il dominio su cui corre $n_p$. Posto per brevità $x_p\equiv ze^{-\beta\varepsilon_p}$, che è un numero positivo:</p>
   <p><b>Bosoni.</b> L&rsquo;occupazione è un intero qualunque, quindi la somma è una <span class="str" data-str="serie-geometrica">serie geometrica</span> di ragione $x_p$. Scritta nella variabile che rende trasparente la convergenza — ponendo $a\equiv\beta(\varepsilon_p-\mu)$, cosicché $x_p=e^{-a}$ —</p>
   $$\sum_{n=0}^{\infty}e^{-an}=\frac{1}{1-e^{-a}}$$
   <p>e la serie converge se e solo se $e^{-a}\lt1$, cioè $a\gt0$, cioè $\mu\lt\varepsilon_p$. Dovendo valere per <i>ogni</i> livello, la condizione è $\mu$ minore del livello fondamentale. Dunque</p>
   $$\mathcal Z_{\rm B}=\prod_p\left[1-ze^{-\beta\varepsilon_p}\right]^{-1}$$
   <p><b>Fermioni.</b> L&rsquo;occupazione vale zero o uno, quindi la somma ha due termini e basta:</p>
   $$\sum_{n=0}^{1}x_p^{\,n}=1+x_p$$
   <p>senza nessuna condizione di convergenza — una somma finita converge sempre — e quindi</p>
   $$\mathcal Z_{\rm F}=\prod_p\left(1+ze^{-\beta\varepsilon_p}\right)$$
   <p><b>Le due in una.</b> Adottando il doppio segno con la convenzione dichiarata (sopra bosoni, sotto fermioni):</p>
   $$\mathcal Z=\prod_p\left(1\mp ze^{-\beta\varepsilon_p}\right)^{\mp1},\qquad \log\mathcal Z=\mp\sum_p\log\left(1\mp ze^{-\beta\varepsilon_p}\right)$$
   <p>e siccome nel gran canonico l&rsquo;equazione di stato esce dalla normalizzazione, $PV/T=\log\mathcal Z$, si ha già la termodinamica completa dei due gas:</p>
   $$\frac{PV}{T}=\mp\sum_p\log\left(1\mp ze^{-\beta\varepsilon_p}\right)$$
   <p>Grilli-Giardina (pag. 83) scrivono queste due formule in una graffa unica, una sopra l&rsquo;altra, e la disposizione grafica dice la cosa giusta: <b>non sono due teorie, sono due righe dello stesso conto</b>.</p>`}
  ]},
  {t:'prosa', title:'Un controllo su un sistema minuscolo, dove si possono contare gli stati a mano', tag:'grammatica', html:R`
  <p>La fattorizzazione è il passaggio che più facilmente si accetta senza verificarlo, e conviene provarlo su un sistema abbastanza piccolo da poterlo contare con le dita. Tre livelli soltanto, $p=1,2,3$, con pesi $x_1,x_2,x_3$.</p>
  <p><b>Bosoni.</b> La gran partizione è $\mathcal Z_{\rm B}=\prod_{p=1}^{3}(1-x_p)^{-1}$, e sviluppando ciascun fattore in serie geometrica si ottiene la somma di <i>tutti</i> i monomi $x_1^{n_1}x_2^{n_2}x_3^{n_3}$ con esponenti interi non negativi. Il settore a due particelle è l&rsquo;insieme dei monomi di grado totale due, e i monomi di grado due in tre variabili sono</p>
  $$\binom{2+3-1}{2}=\binom{4}{2}=6$$
  <p>cioè $x_1^2$, $x_2^2$, $x_3^2$, $x_1x_2$, $x_1x_3$, $x_2x_3$: esattamente le sei configurazioni di due bosoni su tre livelli, che si possono elencare a mano. <b>Fermioni.</b> Qui $\mathcal Z_{\rm F}=\prod_{p=1}^3(1+x_p)$, il cui sviluppo contiene solo monomi con esponenti $0$ o $1$; quelli di grado due sono</p>
  $$\binom{3}{2}=3$$
  <p>cioè $x_1x_2$, $x_1x_3$, $x_2x_3$, e i quadrati sono spariti perché nessun fattore contiene $x_p^2$. <b>Il prodotto non ha aggiunto e non ha perso nulla</b>: ha soltanto riorganizzato la stessa somma, e il coefficiente di $z^N$ nella gran partizione è ancora, come deve essere, la funzione di partizione canonica a $N$ particelle.</p>
  <p>Si noti anche come il principio di esclusione sia diventato invisibile: non compare come divieto in nessun punto del conto, compare come <b>l&rsquo;estremo superiore di una sommatoria</b>. Ed è questa la ragione per cui i due gas hanno formule così simili nonostante descrivano comportamenti opposti — l&rsquo;uno che si ammucchia, l&rsquo;altro che si respinge.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Per i bosoni la geometrica converge solo se $\mu$ sta sotto il fondamentale. Per i fermioni non c&rsquo;è nessuna condizione. Non è sospetto che due formule «uguali» abbiano domini così diversi?`,
    a:R`No: è la traccia lasciata dal dominio della somma, ed è il contenuto fisico della tappa. Il criterio invocato è il <b>criterio di convergenza della serie geometrica</b>, $|x|\lt1$, che si applica alla somma infinita dei bosoni e non si applica a una somma di due termini. Fisicamente: alzare $\mu$ fa crescere l&rsquo;occupazione di ogni livello, e per i bosoni quella crescita non ha tetto — a $\mu\to\varepsilon_0$ l&rsquo;occupazione del fondamentale diverge — mentre per i fermioni l&rsquo;occupazione satura a uno qualunque sia $\mu$, e una quantità che satura non può divergere. Il dominio di $\mu$ è, letteralmente, il dominio di convergenza di una serie.`},
   {q:R`Lo scambio fra somma e produttoria richiede che le occupazioni dei diversi livelli siano indipendenti. In un gas reale non lo sono affatto, perché il numero totale di particelle è fissato. Dove è finita questa obiezione?`,
    a:R`È vera, e la risposta è che abbiamo cambiato sistema di proposito. Nel canonico le occupazioni sono <i>anticorrelate</i> dal vincolo, e infatti lì la fattorizzazione è falsa; nel gran canonico il vincolo non c&rsquo;è e l&rsquo;indipendenza è esatta. Il criterio da riconoscere è l&rsquo;<b>equivalenza degli insiemi</b>: le medie calcolate nei due modi coincidono nel limite termodinamico, perché la distribuzione del numero di particelle è piccata con larghezza relativa $N^{-1/2}$. Ma «le medie coincidono» non vuol dire «tutto coincide»: le <i>correlazioni</i> fra occupazioni sono diverse nei due insiemi, di un termine $O(1/N)$, e questo diventa il punto quando una singola occupazione cessa di essere $O(1)$ — cioè, come si vedrà nella tappa 06, quando un livello solo ospita una frazione finita del gas.`}
  ]}
]},

/* ---------------- 03 · IL NUMERO DI OCCUPAZIONE MEDIO ---------------- */
{ num:'03', title:'Il numero di occupazione medio, e le condizioni sul potenziale chimico', meta:'la derivata rispetto al livello · i due casi · il doppio segno e i disaccordi di notazione · mu sotto il fondamentale',
  blocchi:[
  {t:'reveal', title:'Estrarre l occupazione derivando rispetto all energia del livello', tag:'costruzione', steps:[
   {label:'Il trucco della derivata, e perche funziona', body:R`
   <p>La gran partizione è una funzione generatrice, e come ogni funzione generatrice restituisce le medie per derivazione. Per il numero di particelle si deriva rispetto alla fugacità; per l&rsquo;occupazione di <i>un livello scelto</i> si deriva rispetto alla sua energia, e la ragione è che $\varepsilon_p$ compare nell&rsquo;esponente moltiplicata proprio per $n_p$.</p>
   <p>Si parta dalla definizione di media gran canonica dell&rsquo;osservabile $n_p$ (Grilli-Giardina, pag. 83) e si osservi che</p>
   $$n_p\,e^{-\beta\sum_q\varepsilon_qn_q}=-\frac{1}{\beta}\frac{\partial}{\partial\varepsilon_p}e^{-\beta\sum_q\varepsilon_qn_q}$$
   <p>perché la derivata rispetto a $\varepsilon_p$ tocca un solo addendo della somma all&rsquo;esponente e tira giù il fattore $-\beta n_p$. Il fattore $-1/\beta$ lo compensa. Questa identità vale <i>dentro</i> qualunque somma sulle configurazioni, quindi si può portare la derivata fuori dalla somma:</p>
   $$\langle n_p\rangle=\frac{1}{\mathcal Z}\left(-\frac{1}{\beta}\frac{\partial}{\partial\varepsilon_p}\right)\mathcal Z=-\frac{1}{\beta}\frac{\partial}{\partial\varepsilon_p}\log\mathcal Z$$
   <p>Il passaggio da $\frac{1}{\mathcal Z}\partial\mathcal Z$ a $\partial\log\mathcal Z$ è la derivata logaritmica, e non è un&rsquo;eleganza: è ciò che rende il conto fattibile, perché di $\log\mathcal Z$ abbiamo una <i>somma</i> sui livelli, e derivare una somma rispetto a un suo termine lascia in piedi quel termine solo.</p>`},
   {label:'I due conti, svolti', body:R`
   <p><b>Bosoni.</b> Da $\log\mathcal Z_{\rm B}=-\sum_q\log(1-ze^{-\beta\varepsilon_q})$ la derivata rispetto a $\varepsilon_p$ uccide tutti i termini tranne uno. La derivata del singolo termine è</p>
   $$\frac{\partial}{\partial\varepsilon}\log\left(1-ze^{-\beta\varepsilon}\right)=\frac{\beta ze^{-\beta\varepsilon}}{1-ze^{-\beta\varepsilon}}$$
   <p>(il segno meno dell&rsquo;esponenziale derivata e il segno meno davanti a $z$ si moltiplicano in un più). Quindi $\partial_{\varepsilon_p}\log\mathcal Z_{\rm B}=-\beta ze^{-\beta\varepsilon_p}/(1-ze^{-\beta\varepsilon_p})$, e moltiplicando per $-1/\beta$:</p>
   $$\langle n_p\rangle_{\rm B}=\frac{ze^{-\beta\varepsilon_p}}{1-ze^{-\beta\varepsilon_p}}$$
   <p>Adesso si rimette $z=e^{\beta\mu}$ e si divide sopra e sotto per $ze^{-\beta\varepsilon_p}$:</p>
   $$\frac{e^{\beta\mu}e^{-\beta\varepsilon}}{1-e^{\beta\mu}e^{-\beta\varepsilon}}=\frac{1}{e^{\beta(\varepsilon-\mu)}-1}$$
   <p><b>Fermioni.</b> Da $\log\mathcal Z_{\rm F}=+\sum_q\log(1+ze^{-\beta\varepsilon_q})$, con lo stesso conto e il segno opposto nel denominatore,</p>
   $$\frac{\partial}{\partial\varepsilon}\log\left(1+ze^{-\beta\varepsilon}\right)=-\frac{\beta ze^{-\beta\varepsilon}}{1+ze^{-\beta\varepsilon}}$$
   <p>e quindi $\langle n_p\rangle_{\rm F}=ze^{-\beta\varepsilon_p}/(1+ze^{-\beta\varepsilon_p})$, che con la stessa divisione diventa</p>
   $$\frac{e^{\beta\mu}e^{-\beta\varepsilon}}{1+e^{\beta\mu}e^{-\beta\varepsilon}}=\frac{1}{e^{\beta(\varepsilon-\mu)}+1}$$
   <p><b>Le due in una riga.</b> Con la convenzione dichiarata — segno superiore ai bosoni, inferiore ai fermioni —</p>
   $$\langle n_\varepsilon\rangle=\frac{1}{e^{\beta(\varepsilon-\mu)}\mp1}=\frac{1}{z^{-1}e^{\beta\varepsilon}\mp1}$$
   <p>e le due scritture sono la stessa cosa, perché $z^{-1}=e^{-\beta\mu}$. Grilli-Giardina (pag. 88) insistono sull&rsquo;equivalenza <i>fisica</i> delle due notazioni $\langle n_p\rangle$ e $n(\varepsilon)$: la prima dà l&rsquo;occupazione media del livello etichettato $p$, la seconda è la stessa funzione riguardata come funzione continua dell&rsquo;energia, e il ponte fra loro è $\langle n_p\rangle=\int d\varepsilon\,n(\varepsilon)\delta(\varepsilon-\varepsilon_p)$. Sembra pedanteria; diventa sostanza nella tappa 05, dove è proprio questa <span class="str" data-str="delta-di-dirac">delta</span> a far comparire la densità di stati.</p>`},
   {label:'Due disaccordi di notazione, che in un compito costano il segno', body:R`
   <p><b>Disaccordo (a): il doppio segno non è stabile fra le fonti, e nemmeno dentro la stessa fonte.</b> Crisanti a pag. 258 scrive $n_p=1/(z^{-1}e^{\beta\varepsilon_p}\mp1)$ e a pag. 260, due pagine dopo, scrive la <i>stessa</i> formula con $\pm$. Non è una svista che cambia la fisica — nel suo testo il contesto dice sempre quale caso si sta trattando — ma è una trappola micidiale per chi copia una formula da una pagina e la usa nell&rsquo;altra. <b>La regola da tenere, che non dipende da nessuna convenzione</b>: il denominatore dei fermioni deve essere <i>più</i> uno, perché deve restare positivo e maggiore di uno per ogni $\varepsilon$, così che $\langle n\rangle\le1$; il denominatore dei bosoni deve essere <i>meno</i> uno, perché è ciò che gli permette di diventare piccolo e far divergere l&rsquo;occupazione. Se un conto dà un&rsquo;occupazione fermionica maggiore di uno, il segno è sbagliato.</p>
   <p><b>Disaccordo (d): la forma a tangente iperbolica, che nelle note di Grilli-Giardina è scritta con il segno sbagliato.</b> A pag. 89 si legge $n(\varepsilon)=\tfrac12+\tfrac12\tanh\big(\tfrac12\beta(\varepsilon-\mu)\big)$, e subito dopo la descrizione corretta del comportamento («vale $1$ per $\varepsilon\ll\mu$, vale $\tfrac12$ in $\varepsilon=\mu$, va esponenzialmente a zero per $\varepsilon\gg\mu$»): le due cose non stanno insieme, perché la formula scritta tende a <i>uno</i> per $\varepsilon\to+\infty$. La forma giusta ha il segno meno, e si ottiene in due righe da $\tanh(x/2)=(e^x-1)/(e^x+1)$:</p>
   $$\frac12-\frac12\tanh\frac{x}{2}=\frac12\left[1-\frac{e^x-1}{e^x+1}\right]=\frac{1}{e^x+1}$$
   <p>con $x=\beta(\varepsilon-\mu)$. La forma serve a poco per calcolare, ma rende evidente una simmetria che vale la pena avere in testa: siccome $\tanh$ è dispari, l&rsquo;occupazione di Fermi è <b>antisimmetrica rispetto al punto $(\mu,\tfrac12)$</b>, cioè $n(\mu+\delta)+n(\mu-\delta)=1$ per ogni $\delta$. È la simmetria particella-lacuna, e in un problema con un livello sopra e uno sotto $\mu$ alla stessa distanza fa risparmiare metà del conto.</p>`}
  ]},
  {t:'prosa', title:'Le condizioni sul potenziale chimico, e un disaccordo che riguarda ogni esercizio con un potenziale esterno', tag:'grammatica', html:R`
  <p>Il numero di occupazione medio è un <i>numero di particelle</i>, quindi deve essere non negativo. Questa sola richiesta fissa il dominio di $\mu$, e lo fissa in modo diverso nei due casi.</p>
  <p><b>Fermioni: nessuna condizione.</b> Il denominatore $e^{\beta(\varepsilon-\mu)}+1$ è maggiore di uno per ogni valore reale di $\mu$ e di $\varepsilon$, dunque</p>
  $$0\lt\langle n_\varepsilon\rangle_{\rm F}\lt1$$
  <p>sempre, e la fugacità può correre su tutto $[0,+\infty)$. Il potenziale chimico di un gas di fermioni può essere positivo quanto si vuole: è anzi ciò che accade nei metalli, dove vale qualche elettronvolt.</p>
  <p><b>Bosoni: $\mu$ sotto il fondamentale.</b> Qui il denominatore $e^{\beta(\varepsilon-\mu)}-1$ cambia segno. Se fosse $\varepsilon\lt\mu$ si avrebbe $e^{\beta(\varepsilon-\mu)}\lt1$, quindi denominatore negativo e occupazione negativa, che non significa niente. La condizione è dunque $\varepsilon-\mu\ge0$ per <i>ogni</i> livello, cioè</p>
  $$\mu\lt\varepsilon_0$$
  <p>con $\varepsilon_0$ l&rsquo;energia del livello fondamentale. È la stessa condizione già trovata nella tappa 02 come convergenza della serie geometrica: due strade, un solo risultato — e questo è un buon segno, perché una condizione che si ricava sia dall&rsquo;analisi sia dalla fisica di solito è vera.</p>
  <p><b>Disaccordo (b), e conta.</b> Entrambe le fonti scrivono la condizione nella forma $\mu\le0$. Grilli-Giardina (pag. 99) la ricavano così: «setting $\varepsilon=0$ in the relation above gives us $\mu\le0$»; Crisanti (pag. 280) osserva che $z$ può variare solo fra $0$ e $1$ «e quindi il potenziale chimico è sempre negativo». <b>Entrambe hanno ragione nel loro contesto e torto in generale</b>, e il contesto è che entrambe stanno trattando $H=p^2/2m$ in una scatola, dove il livello più basso ha energia nulla. Basta accendere un potenziale esterno — un&rsquo;armonica, una buca, un gradino — perché il fondamentale non sia più a zero e la condizione diventi $\mu\lt\varepsilon_0$ con $\varepsilon_0\ne0$. Negli esercizi d&rsquo;esame di questo corso l&rsquo;hamiltoniana <i>ha quasi sempre</i> un potenziale esterno, quindi la forma da ricordare è quella generale. Il modo di non sbagliare mai: la condizione è che l&rsquo;occupazione del <b>livello più basso</b> sia positiva e finita, e da lì si legge tutto.</p>
  <p>Vale la pena chiudere con i due limiti estremi della Fermi-Dirac, che si scrivono subito e che serviranno per riconoscere un regime a colpo d&rsquo;occhio. Per un livello molto sotto il potenziale chimico, $x\to-\infty$:</p>
  $$\lim_{x\to-\infty}\frac{1}{e^{x}+1}=1$$
  <p>cioè il livello è pieno; per un livello molto sopra, $x\to+\infty$:</p>
  $$\lim_{x\to+\infty}\frac{1}{e^{x}+1}=0$$
  <p>cioè vuoto. Nel mezzo, esattamente a $\varepsilon=\mu$, vale $1/(e^0+1)=1/2$, ed è la definizione operativa del potenziale chimico di un gas di fermioni: <b>il livello occupato a metà</b>.</p>`},
  {t:'plot', title:'Le tre statistiche a confronto, e dove Maxwell-Boltzmann smette di avere senso',
   intro:R`Numero medio di occupazione in funzione della variabile ridotta $x=(\varepsilon-\mu)/T$, che è l&rsquo;unica variabile da cui dipende. A sinistra le tre statistiche nella regione $x\gt0$, dove tutte e tre sono definite; a destra la sola Fermi-Dirac confrontata con Maxwell-Boltzmann attraverso il punto $\varepsilon=\mu$.`,
   plots:[
    {kind:'func2d', xr:[0.08,5], yr:[0,3], height:320, ticks:6,
     title:'le tre occupazioni per energie sopra il potenziale chimico',
     curves:[
      {f:'1/(exp(x)-1)', col:'#5eead4', label:'Bose-Einstein: 1/(e^x - 1)'},
      {f:'exp(-x)', col:'#d8a13a', label:'Maxwell-Boltzmann: e^(-x)', dash:true},
      {f:'1/(exp(x)+1)', col:'#4c8dff', label:'Fermi-Dirac: 1/(e^x + 1)'}
     ],
     xlabel:'x = (energia - mu) / T', ylabel:'occupazione media'},
    {kind:'func2d', xr:[-4,4], yr:[0,1.6], height:320, ticks:6,
     title:'attraversando il potenziale chimico: il gradino e la formula che esplode',
     curves:[
      {f:'1/(exp(x)+1)', col:'#4c8dff', label:'Fermi-Dirac: satura a 1'},
      {f:'exp(-x)', col:'#d8a13a', label:'Maxwell-Boltzmann: supera 1 e diverge', dash:true}
     ],
     xlabel:'x = (energia - mu) / T', ylabel:'occupazione media'}
   ],
   leggi:R`<p><b>Che cosa guardare nella figura di sinistra: l&rsquo;ordine delle tre curve, che è sempre lo stesso.</b> Per ogni $x\gt0$ vale $\langle n\rangle_{\rm B}\gt\langle n\rangle_{\rm MB}\gt\langle n\rangle_{\rm F}$, e la ragione è algebrica e immediata: i tre denominatori sono $e^x-1$, $e^x$, $e^x+1$, ordinati in modo crescente. <b>I bosoni si ammucchiano più di quanto farebbero particelle indipendenti, i fermioni meno</b>, e il $\mp1$ al denominatore è tutta la statistica quantistica. Si guardi poi dove le tre curve si confondono: già a $x=3$ sono visivamente indistinguibili, perché $e^3\simeq20$ e il $\mp1$ pesa il cinque per cento. È il primo indizio del limite classico.</p>
   <p><b>Che cosa guardare a destra: la curva tratteggiata che sfonda il tetto.</b> A sinistra del potenziale chimico la Maxwell-Boltzmann passa sopra l&rsquo;uno e continua a salire, cioè predice più di una particella per stato quantistico. Non è un&rsquo;imprecisione: è la formula che dichiara di essere fuori dal suo dominio, e il punto in cui lo dichiara è esattamente $\varepsilon=\mu$. <b>La Fermi-Dirac, invece, satura</b> — la curva si appiattisce su uno — e la larghezza della zona in cui passa da quasi-uno a quasi-zero è di qualche unità di $x$, cioè di qualche $T$ in energia. Tutto ciò che in un gas di fermioni dipende dalla temperatura vive dentro quella striscia.</p>
   <p><b>Che cosa impararne per i conti.</b> Entrambe le figure sono disegnate nella variabile $x=(\varepsilon-\mu)/T$ e non in $\varepsilon$, e questo non è un vezzo grafico: l&rsquo;occupazione <i>non dipende separatamente</i> da energia, temperatura e potenziale chimico, ma solo dalla loro combinazione. Quando in un esercizio si cambia temperatura tenendo $\mu$ fisso, la curva non cambia forma: si <b>dilata</b> lungo l&rsquo;asse delle energie. Ed è per questo che la stessa figura, ridisegnata in funzione di $\varepsilon$, diventa la figura della tappa 09.</p>
   <p><b>Dove questa figura mente.</b> Tiene $\mu$ fisso mentre in un problema reale, a $N$ fissato, $\mu$ è una funzione della temperatura — e come si vedrà nelle tappe 08 e 09 è una funzione che cambia perfino di segno. La variabile ridotta nasconde questa dipendenza, che è però il vero lavoro di ogni esercizio: trovare $\mu(T)$ invertendo $N=\sum_p\langle n_p\rangle$.</p>`}
]},

/* ---------------- 04 · IL LIMITE CLASSICO ---------------- */
{ num:'04', title:'Il limite classico, e il parametro puro che decide quando vale', meta:'occupazioni piccole · la fugacita piccola · la lunghezza termica · n lambda cubo e la temperatura di degenerazione',
  blocchi:[
  {t:'reveal', title:'La condizione, dedotta invece che assunta', tag:'costruzione', steps:[
   {label:'Che cosa deve essere piccolo, e perche proprio quello', body:R`
   <p>Le due statistiche differiscono per il $\mp1$ al denominatore. Se quel denominatore è grande, il $\mp1$ non si vede, e allora</p>
   $$\langle n_\varepsilon\rangle=\frac{1}{e^{\beta(\varepsilon-\mu)}\mp1}\ \simeq\ e^{-\beta(\varepsilon-\mu)}$$
   <p>che è la <b>statistica di Maxwell-Boltzmann</b>: Grilli-Giardina (pag. 54) la scrivono proprio in questa forma, $n_{\rm MB}=e^{\beta(\mu-H)}$, ricavandola nel canonico come numero medio di particelle per stato di singola particella. Le due statistiche quantistiche collassano quindi sulla stessa distribuzione classica quando $e^{\beta(\varepsilon-\mu)}\gg1$ per <i>ogni</i> livello, che è come dire $\langle n_\varepsilon\rangle\ll1$ per ogni livello.</p>
   <p><b>La condizione fisica sotto la condizione matematica.</b> Grilli-Giardina (pag. 55) la enunciano nel modo che spiega davvero: si deve richiedere che il numero medio di occupazione di uno stato sia molto minore di uno, «per garantirci che, nella maggior parte degli stati che contribuiscono significativamente alla media, in un dato stato di singola particella si trovi al più una particella». Se questo vale, l&rsquo;indistinguibilità è tenuta in conto adeguatamente dividendo per $N!$; se non vale — se l&rsquo;occupazione multipla non è più un&rsquo;eccezione — il rimedio classico si rompe e bisogna distinguere i due tipi di particella. Le note aggiungono, in inglese, l&rsquo;immagine giusta: nel limite classico il numero di stati termicamente accessibili <i>eccede enormemente</i> il numero di particelle, e in quelle condizioni si possono ignorare i dettagli fini dell&rsquo;indistinguibilità.</p>
   <p>Siccome il livello più basso è quello più occupato, la condizione va imposta lì. Con $\varepsilon_0=0$ diventa $e^{\beta\mu}\ll1$, cioè</p>
   $$z\ll1\quad\Longleftrightarrow\quad \mu\lt0\ \text{ e }\ |\mu|\gg T$$
   <p>Un potenziale chimico <i>molto negativo</i> rispetto alla temperatura: è la firma del regime classico, e un $\mu$ che si avvicina a zero o diventa positivo è il segnale che si è usciti dal dominio.</p>`},
   {label:'Dalla fugacita al parametro di densita, in tre integrali gaussiani', body:R`
   <p>La condizione $z\ll1$ è corretta ma inutilizzabile, perché $z$ non è un dato del problema: i dati sono densità e temperatura. La si traduce imponendo il numero di particelle. Nel limite classico</p>
   $$N=\sum_p\langle n_p\rangle\simeq z\sum_pe^{-\beta\varepsilon_p}=z\,g_s\frac{V}{h^3}\int d^3p\;e^{-\beta p^2/2m}$$
   <p>dove $g_s$ è la degenerazione di spin e la sostituzione della somma con l&rsquo;integrale è quella della tappa 05. L&rsquo;integrale è il prodotto di tre <span class="str" data-str="integrale-gaussiano">integrali gaussiani</span>, uno per componente:</p>
   $$\int_{-\infty}^{+\infty}dp_x\,e^{-\beta p_x^2/2m}=\sqrt{\frac{2\pi m}{\beta}}$$
   <p>cosicché $\int d^3p\,e^{-\beta p^2/2m}=(2\pi mT)^{3/2}$ e</p>
   $$N=z\,g_s V\left(\frac{2\pi mT}{h^2}\right)^{3/2}$$
   <p>Si definisce allora la <b>lunghezza d&rsquo;onda termica di de Broglie</b> come la lunghezza che rende adimensionale questa combinazione,</p>
   $$\lambda\equiv\frac{h}{\sqrt{2\pi mT}}=\sqrt{\frac{2\pi\hbar^2}{mT}}$$
   <p>— le due scritture sono identiche, perché $h=2\pi\hbar$ e $h^2/(2\pi m T)=4\pi^2\hbar^2/(2\pi mT)=2\pi\hbar^2/(mT)$ — e si ottiene la relazione che si userà ovunque:</p>
   $$z=\frac{N\lambda^3}{g_sV}=\frac{n\lambda^3}{g_s}$$
   <p>Dunque <b>la fugacità del gas classico è il numero di particelle contenute in una cella termica</b>, diviso per la degenerazione. Grilli-Giardina danno di $n\lambda^3$ la lettura che vale la pena tenere: pensando a ciascuna particella come un pacchetto d&rsquo;onda di larghezza $\lambda$, che occupa dunque un volume $\lambda^3$, la quantità $N\lambda^3/V$ è <b>la frazione di spazio occupata dalle particelle</b>. Il limite classico è quello in cui i pacchetti d&rsquo;onda sono isolati; il limite quantistico è quello in cui si toccano.</p>
   <p>Invertendo si ottiene il potenziale chimico classico:</p>
   $$\mu_{\rm cl}=T\log\frac{n\lambda^3}{g_s}=-T\log\left[\frac{g_sV}{N}\left(\frac{2\pi mT}{h^2}\right)^{3/2}\right]$$
   <p>ed è negativo esattamente quando $n\lambda^3\lt g_s$, cioè nel dominio in cui è stato ricavato. <b>Disaccordo (g)</b>: questa formula compare in Grilli-Giardina (pag. 100) e in Falcioni-Vulpiani (pag. 73, eq. 5.14, che scrive $e^{\beta\mu}=\rho h^3/[2(2\pi mk_BT)^{3/2}]$ specificando che «il fattore $2$ al denominatore tiene conto dello spin») con $g_s$ dentro, mentre Crisanti la scrive senza. Non è una differenza di fisica ma di convenzione su che cosa si chiami «densità»; diventa una differenza di <i>numeri</i> appena si chiede un valore, e per gli elettroni vale un fattore $\log 2$ per particella.</p>`},
   {label:'La temperatura di degenerazione, e le due lunghezze d onda di Crisanti', body:R`
   <p>Il criterio classico si scrive finalmente in forma pura: <b>gli effetti quantistici sono trascurabili se</b></p>
   $$n\lambda^3\ll1$$
   <p>cioè, come Crisanti (pag. 230) lo enuncia, se la lunghezza d&rsquo;onda termica è molto minore della distanza media fra le particelle $r_0\propto n^{-1/3}$. Il confine è dove $n\lambda^3\simeq1$, e definisce una temperatura caratteristica: da $n(2\pi\hbar^2/(mT_0))^{3/2}=1$ si ricava</p>
   $$k_BT_0=\frac{2\pi\hbar^2}{m}\,n^{2/3}$$
   <p>la <b>temperatura di degenerazione</b>. Sopra $T_0$ il gas è classico, sotto è quantistico, e la relazione disegna una linea nel piano densità-temperatura che separa le due regioni. Si noti la struttura: $T_0$ cresce con la densità come $n^{2/3}$ e <i>decresce</i> con la massa. Sono particelle leggere e dense a diventare quantistiche per prime, ed è il motivo per cui gli elettroni di un metallo sono degeneri a temperatura ambiente mentre l&rsquo;aria della stessa stanza non lo è.</p>
   <p><b>Disaccordo (e): Crisanti definisce due lunghezze d&rsquo;onda nella stessa pagina, e non sono la stessa.</b> A pag. 229 introduce $\lambda_0=h/p_0$ con $p_0$ l&rsquo;impulso medio, ricavato da $p_0^2/2m=\tfrac32kT$, cioè $\lambda_0=h/\sqrt{3mkT}$; a pag. 230 definisce la lunghezza termica $\lambda=\sqrt{2\pi\hbar^2/(mkT)}=h/\sqrt{2\pi mkT}$. Il rapporto fra le due è</p>
   $$\frac{\lambda}{\lambda_0}=\sqrt{\frac{3}{2\pi}}\simeq0{,}691$$
   <p>cioè un trenta per cento, che elevato al cubo diventa un fattore $0{,}33$ su $n\lambda^3$. Nessuna delle due è «sbagliata» — la prima è una stima di ordine di grandezza dell&rsquo;estensione del pacchetto, la seconda è la definizione che rende esatte le formule della statistica — ma <b>è la seconda quella che entra nei conti</b>, e usare la prima in $\mathcal Z$ produce errori di fattore tre.</p>
