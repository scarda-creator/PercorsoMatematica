  .main{flex:1 1 auto;min-width:0;padding:24px 30px 90px;max-width:860px;}

  .sfhead{border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:8px;}

  .plot-intro{color:var(--muted);font-size:.95rem;margin:0 0 12px;}
  .plot-row{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;

  .note.warn b{color:#f0c25a;}

  /* ---- GRAMMATICA ---- */
  .gramwrap{background:var(--grambg);border:1px solid #1f4d47;border-radius:12px;padding:6px 6px;}

  table.gramtab tr:last-child td{border-bottom:none;}

  .section > h3 .tag.gramtag{background:var(--grambg);border-color:#1f4d47;color:var(--gram);}

  /* ---- STRUMENTI (repertorio condiviso: la scheda si apre DENTRO la frase) ----

  .str{color:var(--gram);border-bottom:1px dashed var(--gram);cursor:pointer;}
  .str:hover{background:var(--grambg);}
  .str::after{content:"\2666";font-size:.62em;vertical-align:.42em;margin-left:2px;opacity:.8;}
  .str.aperto::after{content:"\2715";}
  .str.rotto{color:#ff6b6b;border-bottom-color:#ff6b6b;cursor:help;}

  .strcard{display:block;margin:10px 0;background:var(--grambg);border:1px solid #1f4d47;

  table.protab td{padding:10px 12px;vertical-align:top;border-bottom:1px solid var(--proline);}
  table.protab tr:last-child td{border-bottom:none;}
  table.protab td.pd{white-space:nowrap;color:var(--pro);width:1%;font-weight:700;font-size:.78rem;

  .ca{margin-top:12px;background:var(--okbg);border:1px solid #235c33;border-radius:8px;

  .pnbtn{flex:1 1 0;background:var(--panel);border:1px solid var(--border);border-radius:12px;

  .pnbtn:hover{border-color:var(--accent);background:var(--panel2);}
  .pnbtn.next{text-align:right;}
  .pnbtn .k{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .pnbtn .t{font-weight:600;color:var(--accent2);}
  .pnbtn:disabled{opacity:.35;cursor:default;border-color:var(--border);background:var(--panel);}

  code{background:var(--panel2);border:1px solid var(--border);border-radius:5px;
    padding:1px 5px;font-size:.85em;color:var(--accent2);}
  .katex{font-size:1.02em;color:var(--txt);} .katex-display{margin:.5em 0;overflow-x:auto;overflow-y:hidden;}

  @media(max-width:860px){
    .shell{flex-direction:column;}
    .sidebar{width:100%;flex:none;position:static;max-height:none;border-right:none;

    .sidebar h2{width:100%;} .navitem{width:auto;}
    .main{padding:20px 16px 80px;}
  }
</style>

<script>
"use strict";
const R = String.raw;

function typeset(el){
  if(el && window.renderMathInElement){
    try{ renderMathInElement(el,{delimiters:[
      {left:'$$',right:'$$',display:true},

function elFromHTML(html){ var d=document.createElement('div'); d.innerHTML=html; return d; }

/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un
   rimando scritto nella prosa:

       <span class="str" data-str="serie-geometrica">la serie geometrica</span>

   Le schede citate da questo nucleo sono cucite qui sotto dal montaggio
   (assembla-nucleo.js): la pagina resta autosufficiente — niente fetch,
   niente sottocartelle da pubblicare — e un rimando a una scheda che non
   esiste FERMA la costruzione invece di arrivare in pagina rotto.
   Apertura: lo stesso gesto del collaudo (si clicca, il pannello compare,
   si typeset una volta sola), portato dentro la frase.
   =================================================================== */
var CORSO = 'meccanica-quantistica';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["armoniche-sferiche"] = {"nome":"Armoniche sferiche","riga":"$Y_\\ell^{m}(\\theta,\\varphi)$ sono le autofunzioni simultanee di $\\hat L^{2}$, con autovalore $\\hbar^{2}\\ell(\\ell+1)$, e di $\\hat L_z$, con autovalore $\\hbar m$, ortonormali e complete sulla sfera.","serve":"Sono la parte angolare di ogni problema a simmetria sferica: appena il potenziale dipende solo dalla distanza, l'equazione si separa e la dipendenza angolare e' sempre una di queste, qualunque sia il potenziale. Cio' che cambia da problema a problema e' solo la parte radiale — per questo si imparano una volta e si riusano sempre.","esempio":"Per ogni $\\ell$ ci sono $2\\ell+1$ valori di $m$: e' la degenerazione essenziale di ogni livello a simmetria sferica, e non dipende dal potenziale. Per $\\ell=2$ vengono $2\\cdot2+1=5$ stati. La prima armonica e' costante, ed e' il motivo per cui lo stato fondamentale di un potenziale centrale e' sempre sfericamente simmetrico.","debito":"la costruzione esplicita dai polinomi di Legendre associati, e le formule di ricorrenza, non stanno qui: si usano gli enunciati e l'ortonormalita'.","controllo":[{"tipo":"uguale","sinistra":"2*2+1","vale":"5","dove":"esempio","appare":"2\\cdot2+1=5"},{"tipo":"simbolico","dove":"riga","appare":"\\hbar^{2}\\ell(\\ell+1)","perche":"e' l'autovalore del quadrato del momento angolare, che discende dall'algebra dei commutatori e non dalla forma esplicita delle armoniche. Si enuncia qui perche' e' cio' che le definisce"}],"qui":{},"pieno":null};
STRUM["commutatore"] = {"nome":"Commutatore","riga":"$[\\hat A,\\hat B]=\\hat A\\hat B-\\hat B\\hat A$, antisimmetrico, con la regola di Leibniz $[\\hat A,\\hat B\\hat C]=[\\hat A,\\hat B]\\hat C+\\hat B[\\hat A,\\hat C]$ e la relazione canonica $[\\hat x,\\hat p]=i\\hbar$.","serve":"E' la misura di quanto due operazioni dipendano dall'ordine, e qui l'ordine e' fisica: due osservabili che non commutano non hanno una base comune di autostati, quindi non si misurano insieme con precisione arbitraria. Quasi ogni conto che sembra magico — l'algebra del momento angolare, gli operatori di salita e discesa, il teorema di Ehrenfest — e' una manipolazione di commutatori fatta con quelle regole e nient'altro.","esempio":"Dalla regola di Leibniz, $[\\hat x,\\hat p^{2}]=[\\hat x,\\hat p]\\hat p+\\hat p[\\hat x,\\hat p]=2i\\hbar\\hat p$. E' il conto che fa uscire il teorema di Ehrenfest: la meccanica classica ricompare come relazione fra valori medi, e ricompare perche' quel commutatore vale proprio $2i\\hbar\\hat p$.","debito":"l'identita' di Jacobi si enuncia e non si dimostra; la corrispondenza fra commutatore e parentesi di Poisson — che e' l'idea di Dirac e non un'analogia decorativa — sta in mq-07, e li' va letta per intero.","controllo":[{"tipo":"uguale","sinistra":"I*hbar*p + p*I*hbar","vale":"2*I*hbar*p","ipotesi":{"hbar":"positive","p":"real"},"dove":"esempio","appare":"2i\\hbar\\hat p"},{"tipo":"simbolico","dove":"riga","appare":"[\\hat x,\\hat p]=i\\hbar","perche":"e' la relazione di commutazione canonica, il POSTULATO da cui discende il resto della teoria: non si dimostra, si assume, ed e' cio' che separa la meccanica quantistica dalla classica"}],"qui":{},"pieno":null};
STRUM["operatore-aggiunto"] = {"nome":"Operatore aggiunto e autoaggiunto","riga":"L'aggiunto e' definito da $\\langle\\phi|\\hat A\\psi\\rangle=\\langle\\hat A^{\\dagger}\\phi|\\psi\\rangle$ per ogni coppia di stati, e l'operatore e' autoaggiunto quando coincidono sia $\\hat A^{\\dagger}$ con $\\hat A$ sia i loro domini.","serve":"E' la condizione che rende un operatore un'osservabile: autovalori reali, e autovettori di autovalori distinti ortogonali. In dimensione finita «autoaggiunto» e «hermitiano» coincidono; in dimensione infinita no, e la differenza non e' pedanteria — l'operatore impulso su una semiretta e' hermitiano e non autoaggiunto, e infatti non e' un'osservabile.","esempio":"Se $\\hat A\\psi=a\\psi$ con $\\hat A$ autoaggiunto, allora $a\\langle\\psi|\\psi\\rangle=\\langle\\psi|\\hat A\\psi\\rangle=\\langle\\hat A\\psi|\\psi\\rangle=a^{*}\\langle\\psi|\\psi\\rangle$; siccome la norma non e' nulla segue $a=a^{*}$, cioe' l'autovalore e' reale. Tre righe, e sono la ragione per cui le osservabili si rappresentano cosi'.","debito":"la distinzione fra hermitiano e autoaggiunto in dimensione infinita — domini, estensioni, indici di difetto — e' il programma di von Neumann e sta fuori da questo percorso: qui si dichiara che esiste e si lavora nel caso buono. La regola di inversione dell'ordine nell'aggiunto di un prodotto si usa e non si dimostra.","controllo":[{"tipo":"uguale","sinistra":"conjugate(a)","vale":"a","ipotesi":{"a":"real"},"dove":"esempio","appare":"a=a^{*}"}],"qui":{},"pieno":null};
STRUM["polinomi-di-legendre"] = {"nome":"Polinomi di Legendre e funzioni associate","riga":"$P_\\ell(u)=(2^{\\ell}\\ell!)^{-1}\\big(\\tfrac{d}{du}\\big)^{\\ell}(u^{2}-1)^{\\ell}$ sono le soluzioni polinomiali dell'equazione di Legendre, ortogonali su $[-1,1]$, e le funzioni associate si ottengono da esse con $P_\\ell^{m}(u)=(1-u^{2})^{m/2}\\big(\\tfrac{d}{du}\\big)^{m}P_\\ell(u)$.","serve":"Sono la dipendenza da $\\theta$ di ogni problema a simmetria sferica, in qualunque campo della fisica: il momento angolare in quantistica, i multipoli in elettrostatica, le vibrazioni di una superficie sferica. La cosa da ricordare non e' la formula ma il motivo per cui quantizzano: l'equazione ha soluzioni per OGNI valore dei parametri, e la restrizione a $\\ell$ intero non negativo con $\\ell\\ge|m|$ viene solo dalla richiesta che la soluzione resti finita ai due poli $\\theta=0$ e $\\theta=\\pi$, che sono punti singolari dell'equazione.","esempio":"Dalla formula di Rodrigues con $\\ell=2$: si deriva due volte $(u^{2}-1)^{2}=u^{4}-2u^{2}+1$ ottenendo $12u^{2}-4$, e dividendo per $2^{2}\\cdot2!=8$ viene $P_2(u)=\\frac{3u^{2}-1}{2}$. La sua norma al quadrato vale $\\int_{-1}^{1}P_2(u)^{2}du=\\frac{2}{5}$, cioe' il caso $\\ell=2$ della formula generale $2/(2\\ell+1)$ — ed e' quel $2\\ell+1$ che compare nella normalizzazione delle armoniche sferiche. La funzione associata con $\\ell=m=1$ e' $P_1^{1}(u)=(1-u^{2})^{1/2}$, che in termini dell'angolo e' $\\sin\\theta$: per esempio a $\\theta=\\pi/3$ vale $\\frac{\\sqrt3}{2}$.","debito":"l'ortogonalita' con peso, le relazioni di ricorrenza, la funzione generatrice e il legame con lo sviluppo in multipoli stanno nei movimenti di Metodi sulle funzioni speciali; qui c'e' cio' che serve per riconoscere la parte angolare di un problema sferico e per sapere da dove viene la quantizzazione.","controllo":[{"tipo":"uguale","sinistra":"diff((u**2-1)**2, u, 2)","vale":"12*u**2 - 4","ipotesi":{"u":"real"},"dove":"esempio","appare":"12u^{2}-4"},{"tipo":"uguale","sinistra":"diff((u**2-1)**2, u, 2)/8","vale":"(3*u**2-1)/2","ipotesi":{"u":"real"},"dove":"esempio","appare":"P_2(u)=\\frac{3u^{2}-1}{2}"},{"tipo":"integrale","espr":"((3*u**2-1)/2)**2","var":"u","da":"-1","a":"1","vale":"2/5","ipotesi":{"u":"real"},"dove":"esempio","appare":"\\frac{2}{5}"},{"tipo":"uguale","sinistra":"2**2*factorial(2)","vale":"8","dove":"esempio","appare":"2^{2}\\cdot2!=8"},{"tipo":"uguale","sinistra":"2/(2*2+1)","vale":"2/5","dove":"esempio","appare":"2/(2\\ell+1)"},{"tipo":"uguale","sinistra":"expand((u**2-1)**2)","vale":"u**4-2*u**2+1","ipotesi":{"u":"real"},"dove":"esempio","appare":"u^{4}-2u^{2}+1"},{"tipo":"uguale","sinistra":"sqrt(1-cos(pi/3)**2)","vale":"sqrt(3)/2","dove":"esempio","appare":"(1-u^{2})^{1/2}"},{"tipo":"simbolico","dove":"riga","appare":"P_\\ell^{m}(u)=(1-u^{2})^{m/2}\\big(\\tfrac{d}{du}\\big)^{m}P_\\ell(u)","perche":"e' la definizione delle funzioni associate a partire dai polinomi, non un conto: contiene una derivata di ordine simbolico $m$ applicata a un polinomio di grado simbolico $\\ell$, e sympy non valuta derivate di ordine non numerico. Il caso concreto $\\ell=m=1$, che da' $\\sin\\theta$, e' immediato dalla definizione perche' $P_1(u)=u$ ha derivata uno"},{"tipo":"simbolico","dove":"riga","appare":"P_\\ell(u)=(2^{\\ell}\\ell!)^{-1}\\big(\\tfrac{d}{du}\\big)^{\\ell}(u^{2}-1)^{\\ell}","perche":"stessa ragione: la formula di Rodrigues ha l'ordine di derivazione simbolico. Il caso $\\ell=2$ e' verificato per intero dalle due asserzioni sull'esempio, che ricalcolano la derivata seconda e il fattore $8$"}],"qui":{"meccanica-quantistica":{"serve":"Appena si fissa che il numero quantico azimutale $m$ e' intero, l'equazione per la dipendenza da $\\theta$ delle autofunzioni di $L^{2}$ E' l'equazione di Legendre associata nella variabile $u=\\cos\\theta$. Da qui viene la seconda quantizzazione, quella di $\\ell$: le soluzioni esistono per ogni $\\ell$, ma restano finite ai poli solo se $\\ell$ e' intero non negativo con $\\ell\\ge|m|$. Il prodotto $e^{im\\varphi}P_\\ell^{|m|}(\\cos\\theta)$, normalizzato, e' l'armonica sferica.","esempio":"Con $\\ell=m=1$ si ha $P_1^{1}(\\cos\\theta)=\\sin\\theta$, quindi $Y_1^{1}\\propto\\sin\\theta\\,e^{i\\varphi}$: e' la forma che si riconosce a vista dentro gli stati degli scritti. E il fattore $2\\ell+1$ della normalizzazione viene dalla norma $2/(2\\ell+1)$ dei polinomi, non da altrove — per questo la degenerazione $2\\ell+1$ e il coefficiente delle armoniche portano lo stesso numero."}},"pieno":null};
STRUM["cambio-di-variabile"] = {"nome":"Cambio di variabile in una densità","riga":"Una densità non si trasforma sostituendo ma porta il jacobiano: se $y=f(x)$ allora $p_Y(y)=\\sum_i p_X(x_i)\\,/\\,|f'(x_i)|$, sommato su tutti i rami $x_i$ con $f(x_i)=y$.","serve":"È l'unico punto in cui una densità si comporta diversamente da una funzione, ed è l'errore che si ripete. Ciò che è invariante è la probabilità dell'evento, $p_Y(y)|dy|=p_X(x)|dx|$: la densità no, perché è una probabilità per unità di qualcosa, e passando da $x$ a $y$ quell'unità si dilata o si comprime. Scrivere $p_Y(y)=p_X(x(y))$ e basta è attraente e sbagliato. Si scova senza rifare il conto con due prove da cinque secondi: la normalizzazione non torna, e le dimensioni restano quelle della variabile di partenza.","esempio":"Una particella uniforme su un disco di raggio $R$: $p(x,y)=1/(\\pi R^2)$. Passando alla sola distanza dal centro, il jacobiano è l'elemento d'area radiale $2\\pi r$, e resta $p(r)=2r/R^2$ su $[0,R]$, che infatti si normalizza a $1$. Il valor medio è $\\langle r\\rangle=2R/3$ — non $R/2$, che è la risposta di chi tratta $r$ come uniforme. La differenza fra i due numeri è esattamente il fattore $r$, cioè il fatto che lontano dal centro c'è più area.","pieno":{"file":"ms-03-probabilita.html","tappa":"01","come":"la regola dedotta dall'invarianza della probabilità, i rami molteplici e il caso radiale, nel movimento ms-03 di Meccanica Statistica"},"qui":{"meccanica-statistica":{"serve":"È metà della domanda più frequente dello scritto: «calcolare la densità di probabilità dell'energia di singola particella», «la densità di particelle $\\rho(r)$». L'altra metà è la marginalizzazione. Le scritture $d^2r=2\\pi r\\,dr$ e $d^3r=4\\pi r^2dr$ non sono formule da ricordare: sono questo cambio di variabile con gli angoli già integrati, e saperlo deducere è ciò che salva quando la simmetria è cilindrica invece che sferica. Attenzione al doppio jacobiano: $p(r)$ è una densità rispetto a $r$, $\\rho(r)$ è una densità per unità di volume, e fra le due ce n'è un altro.","esempio":"L'energia cinetica in due dimensioni. La misura radiale nel piano degli impulsi è la derivata dell'area del disco, $2\\pi p$; la sostituzione $\\varepsilon=p^2/2m$ ha $d\\varepsilon/dp=p/m$, e il jacobiano cancella esattamente il fattore $p$. Per questo in $d=2$ la densità dell'energia è l'esponenziale pura $\\beta e^{-\\beta\\varepsilon}$, senza prefattore, mentre in $d=3$ resta un $\\sqrt{\\varepsilon}$. Da quel solo fattore dipendono tutte le differenze qualitative fra i gas quantistici in dimensioni diverse."}},"controllo":[{"tipo":"integrale","espr":"2*r/R**2","var":"r","da":"0","a":"R","vale":"1","ipotesi":{"r":"positive","R":"positive"},"dove":"esempio","appare":"p(r)=2r/R^2"},{"tipo":"integrale","espr":"r*2*r/R**2","var":"r","da":"0","a":"R","vale":"2*R/3","ipotesi":{"r":"positive","R":"positive"},"dove":"esempio","appare":"2R/3"},{"tipo":"derivata","espr":"pi*p**2","rispetto":["p"],"vale":"2*pi*p","ipotesi":{"p":"positive"},"dove":"qui.meccanica-statistica.esempio","appare":"2\\pi p"},{"tipo":"derivata","espr":"p**2/(2*m)","rispetto":["p"],"vale":"p/m","ipotesi":{"p":"positive","m":"positive"},"dove":"qui.meccanica-statistica.esempio","appare":"p/m"},{"tipo":"integrale","espr":"b*exp(-b*e)","var":"e","da":"0","a":"oo","vale":"1","ipotesi":{"b":"positive","e":"positive"},"dove":"qui.meccanica-statistica.esempio","appare":"\\beta e^{-\\beta\\varepsilon}"}]};
STRUM["teorema-della-divergenza"] = {"nome":"Teorema della divergenza","riga":"Il flusso uscente da una superficie chiusa è l'integrale della divergenza sul volume che racchiude: $\\oint_{\\partial V}\\mathbf F\\cdot\\hat n\\,dS=\\int_V\\nabla\\cdot\\mathbf F\\,dV$.","serve":"Scambia una domanda sul bordo con una sul volume. A destra c'è la divergenza, che è la densità di sorgente punto per punto; a sinistra il totale che esce. Si usa nei due versi: per calcolare un flusso scomodo con un integrale di volume comodo, e — in fisica soprattutto — per passare da una legge integrale a una legge locale, perché se due integrali di volume coincidono per OGNI volume allora coincidono gli integrandi.","esempio":"Per $\\mathbf F=\\mathbf r=(x,y,z)$ la divergenza vale $3$, quindi sulla palla di raggio $R$ il membro destro è $3\\cdot\\tfrac43\\pi R^{3}=4\\pi R^{3}$; il membro sinistro, calcolato come flusso, è il modulo $R$ per l'area $4\\pi R^{2}$, e dà lo stesso numero.","pieno":{"file":"05-teoremi-integrali.html","tappa":"02","come":"l'enunciato, la dimostrazione a fette e le ipotesi vere sul dominio, nel nucleo dei teoremi integrali"},"qui":{"elettromagnetismo":{"serve":"È il passaggio che trasforma la legge di Gauss integrale nella prima equazione di Maxwell, $\\nabla\\cdot\\mathbf E=\\rho/\\varepsilon_0$, e la conservazione della carica nell'equazione di continuità $\\nabla\\cdot\\mathbf J+\\partial_t\\rho=0$. La mossa è sempre la stessa: si scrive la legge su un volume arbitrario, si porta il flusso dentro come integrale di divergenza, e si osserva che un integrale nullo su OGNI volume obbliga l'integrando a essere nullo. L'arbitrarietà del volume non è un dettaglio: è tutta la dimostrazione.","esempio":"Per il campo di una carica puntiforme, di modulo $\\dfrac{q}{4\\pi\\varepsilon_0r^{2}}$ e diretto radialmente, la divergenza è nulla ovunque tranne nell'origine: in coordinate sferiche la divergenza di un campo radiale si scrive con $\\partial_r\\!\\left(r^{2}E_r\\right)$, e qui $r^{2}E_r$ non dipende da $r$, quindi la derivata fa $0$. Tutta la carica è finita nel punto escluso, ed è esattamente il buco che la $\\delta$ di Dirac serve a riempire."}},"controllo":[{"tipo":"uguale","sinistra":"diff(x,x)+diff(y,y)+diff(z,z)","vale":"3","dove":"esempio","appare":"vale $3$"},{"tipo":"uguale","sinistra":"3*(4/3)*pi*R**3","vale":"4*pi*R**3","dove":"esempio","appare":"4\\pi R^{3}"},{"tipo":"derivata","espr":"r**2*(q/(4*pi*e0*r**2))","rispetto":["r"],"vale":"0","dove":"qui.elettromagnetismo.esempio","appare":"la derivata fa $0$"}]};
STRUM["delta-di-dirac"] = {"nome":"Delta di Dirac","riga":"Non è una funzione ma un funzionale, definito da $\\int f(x)\\,\\delta(x-a)\\,dx=f(a)$, che composto con una funzione si spezza sui suoi zeri come $\\delta(g(x))=\\sum_i \\delta(x-x_i)/|g'(x_i)|$.","serve":"Serve come macchina per cambiare variabile senza invertire nulla. La densità di $y=f(x)$ si scrive $p_Y(y)=\\int p_X(x)\\,\\delta(y-f(x))\\,dx$, e la delta produce da sola il fattore $1/|f'|$ che altrimenti andrebbe messo a mano: i rami molteplici si contano da soli invece di doverli ricordare. È la ragione pratica per cui il formalismo con la delta compare in ogni soluzione d'esame che tocchi una distribuzione, mentre il cambio di variabile esplicito compare quasi mai.","esempio":"$\\delta(x^2-a^2)$ con $a$ positivo. Gli zeri sono $x=\\pm a$; la derivata dell'argomento è $2x$, che in modulo vale $2a$ su entrambi. Quindi $\\delta(x^2-a^2)=\\dfrac{1}{2a}\\big[\\delta(x-a)+\\delta(x+a)\\big]$. Il caso si ripete identico in fisica statistica con $\\varepsilon=p^2/2m$ in una dimensione, dove i due rami $p=\\pm\\sqrt{2m\\varepsilon}$ contribuiscono entrambi — e dimenticarne uno dimezza la risposta.","pieno":{"file":"15-distribuzioni.html","tappa":"01","come":"le distribuzioni come funzionali, la delta e le sue proprietà, nel nucleo di Metodi"},"qui":{"meccanica-statistica":{"serve":"È lo strumento con cui si calcola la densità degli stati, cioè l'oggetto su cui poggia tutto il secondo tempo del corso: $g(\\varepsilon)=\\int d^dp\\,d^dq\\;\\delta(\\varepsilon-H)/h^d$. L'identità che si usa davvero non è la definizione ma questa: $\\delta(\\varepsilon-H)=\\partial_\\varepsilon\\,\\theta(\\varepsilon-H)$. Si scambia l'integrale con la derivata e ci si ritrova a calcolare il volume della regione dove l'hamiltoniana sta sotto $\\varepsilon$ — un integrale elementare — invece di un integrale con una delta dentro. La $g$ così ottenuta è pura geometria dello spazio delle fasi: non sa nulla della temperatura, e per questo resta identica quando si passa da Boltzmann a Fermi o a Bose.","esempio":"Particella libera in due dimensioni. Il volume della regione $p^2/2m$ sotto $\\varepsilon$ è il disco di area $2\\pi m\\varepsilon$; derivando rispetto a $\\varepsilon$ si ottiene $2\\pi m$, cioè una densità degli stati costante. Non è una curiosità: è la ragione per cui in due dimensioni una particella libera non condensa, e per cui le prove che chiedono la condensazione in $d=2$ mettono sempre un potenziale confinante, che porta la $g$ da costante a crescente."}},"controllo":[{"tipo":"derivata","espr":"x**2-a**2","rispetto":["x"],"vale":"2*x","ipotesi":{"x":"positive","a":"positive"},"dove":"esempio","appare":"2x"},{"tipo":"uguale","sinistra":"1/Abs(2*a)","vale":"1/(2*a)","ipotesi":{"a":"positive"},"dove":"esempio","appare":"\\dfrac{1}{2a}"},{"tipo":"derivata","espr":"2*pi*m*e","rispetto":["e"],"vale":"2*pi*m","ipotesi":{"m":"positive","e":"positive"},"dove":"qui.meccanica-statistica.esempio","appare":"2\\pi m"}]};
STRUM["spettro"] = {"nome":"Spettro di un operatore","riga":"Lo spettro di un operatore e' l'insieme dei possibili esiti di una misura — i suoi autovalori — e puo' essere discreto (autovalori separati, autovettori in $\\mathcal H$), continuo (autovalori che riempiono un intervallo, autovettori non normalizzabili), o misto.","serve":"E' la quantita' che la fisica chiede davvero: scrivere l'hamiltoniana e trovarne lo spettro E' il problema d'esame. La distinzione discreto/continuo non e' tecnica — decide se un autostato e' uno stato preparabile (discreto) o una distribuzione che vive fuori dallo spazio di Hilbert (continuo), come l'onda piana e la delta.","esempio":"Per $\\sigma_z=\\begin{pmatrix}1&0\\\\0&-1\\end{pmatrix}$ lo spettro e' $\\{+1,-1\\}$, discreto, e i due invarianti della matrice lo riassumono senza risolvere l'equazione secolare: la somma degli autovalori e' la traccia, $\\operatorname{tr}\\sigma_z=0$, il loro prodotto e' il determinante, $\\det\\sigma_z=-1$. Per l'operatore posizione lo spettro e' tutta la retta reale, continuo, e gli autovettori sono delte di Dirac.","debito":"la costruzione rigorosa dello spettro continuo (teorema spettrale generalizzato, misura spettrale $E(\\lambda)$ di von Neumann) sta fuori da questo percorso: qui si dichiara che esiste e si lavora coi casi concreti. La separazione fra spettro continuo e spettro residuo non si tratta.","controllo":[{"tipo":"uguale","sinistra":"Matrix([[1,0],[0,-1]]).trace()","vale":"0","dove":"esempio","appare":"\\operatorname{tr}\\sigma_z=0"},{"tipo":"uguale","sinistra":"Matrix([[1,0],[0,-1]]).det()","vale":"-1","dove":"esempio","appare":"\\det\\sigma_z=-1"}],"qui":{},"pieno":null};
STRUM["serie-di-potenze"] = {"nome":"Serie di potenze","riga":"Una somma $\\sum_{n\\ge0}a_n(x-x_0)^{n}$, che converge dentro un intervallo (in campo complesso: un disco) di raggio $R$ centrato in $x_0$ e diverge fuori.","serve":"È la classe di serie di funzioni che si comporta meglio di tutte: dentro il raggio converge uniformemente sui compatti, quindi si deriva e si integra termine a termine infinite volte, e i coefficienti sono quelli di Taylor. Il raggio si calcola col rapporto $|a_{n+1}/a_n|$ o con Cauchy–Hadamard, e sul bordo non si sa niente a priori: va studiato a parte.","esempio":"Per $\\sum_{n\\ge0}\\dfrac{x^{n}}{n!}$ il rapporto fra coefficienti consecutivi tende a $0$: il raggio è infinito e la somma è $e^{x}$ su tutto $\\mathbb{R}$. Per $\\sum_{n\\ge1}n\\,x^{n}$ tende invece a $1$, quindi $R=1$, e in $x=\\tfrac12$ la somma vale $2$.","pieno":{"file":"07-serie-funzioni.html","tappa":"04","come":"il raggio, la derivazione termine a termine e l'identità con Taylor, nel nucleo sulle serie di funzioni"},"qui":{"metodi-e-modelli":{"serve":"In campo complesso la serie di potenze non è una classe fra altre: è la definizione stessa di analitica, e il teorema che olomorfa $=$ analitica dice che ogni funzione derivabile in senso complesso è già una serie di potenze. Il raggio smette anche di essere un conto sui coefficienti e diventa geometria: è la distanza dal centro alla singolarità più vicina — ed è il primo dei due raggi della corona di Laurent.","esempio":"La regola geometrica spiega i raggi reali che sembravano arbitrari: $\\dfrac{1}{1+x^{2}}$ è liscia su tutto $\\mathbb{R}$, ma il suo sviluppo in $0$ ha raggio $1$, perché in $\\pm i$ la funzione esplode e $|i|=1$. Dentro quel raggio il conto chiude: in $z=\\tfrac12$ la serie $1-z^{2}+z^{4}-\\cdots$ vale $\\tfrac45$."}},"controllo":[{"tipo":"limite","espr":"1/(n+1)","var":"n","a":"oo","vale":"0","ipotesi":{"n":"positive"},"dove":"esempio","appare":"a $0$"},{"tipo":"limite","espr":"(n+1)/n","var":"n","a":"oo","vale":"1","ipotesi":{"n":"positive"},"dove":"esempio","appare":"a $1$"},{"tipo":"somma","espr":"n*(1/2)**n","var":"n","da":"1","a":"oo","vale":"2","dove":"esempio","appare":"vale $2$"},{"tipo":"uguale","sinistra":"Abs(I)","vale":"1","dove":"qui.metodi-e-modelli.esempio","appare":"|i|=1"},{"tipo":"somma","espr":"(-1)**n*(1/2)**(2*n)","var":"n","da":"0","a":"oo","vale":"4/5","dove":"qui.metodi-e-modelli.esempio","appare":"\\tfrac45"}]};
STRUM["polinomi-di-laguerre"] = {"nome":"Polinomi di Laguerre associati","riga":"$L_n^{k}$ sono le soluzioni polinomiali dell'equazione di Laguerre associata, ortogonali con peso $\\rho^{k}e^{-\\rho}$, e nell'idrogeno compaiono con indici $n-\\ell-1$ e $2\\ell+1$.","serve":"Sono la parte radiale dell'atomo di idrogeno. Il grado conta i nodi radiali, e la condizione che quel grado sia un intero non negativo e' esattamente cio' che quantizza l'energia e impone che il numero quantico orbitale resti sotto quello principale: la quantizzazione non viene da un postulato, viene dal chiedere che la serie si tronchi.","esempio":"Per lo stato fondamentale il grado e' $1-0-1=0$: nessun nodo radiale, e la funzione e' la sola esponenziale decrescente. Per il $2s$ il grado e' $2-0-1=1$, cioe' un nodo — ed e' il motivo per cui $2s$ e $2p$ hanno la stessa energia ma forme radiali diverse.","debito":"la soluzione dell'equazione radiale per serie, e il troncamento che quantizza l'energia, stanno nel movimento sull'idrogeno; qui c'e' il dizionario per leggere il risultato.","controllo":[{"tipo":"uguale","sinistra":"1-0-1","vale":"0","dove":"esempio","appare":"1-0-1=0"},{"tipo":"uguale","sinistra":"2-0-1","vale":"1","dove":"esempio","appare":"2-0-1=1"},{"tipo":"integrale","espr":"exp(-2*r)*r**2","var":"r","da":"0","a":"oo","vale":"1/4","dove":"esempio","appare":"esponenziale decrescente"}],"qui":{},"pieno":null};

function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';
  return h;
}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

/* ---------------- 00 · DI COSA PARLA QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Di cosa parla questo movimento', meta:'Meccanica Quantistica · voce Q.18 · che cosa impone la simmetria per rotazioni · la parte angolare uguale per tutti · un problema unidimensionale sulla semiretta · perché l orbitale è intero',
  blocchi:[
  {t:'prosa', title:'Una simmetria che fa metà del lavoro', tag:'architettura', html:R`
  <p>Un potenziale che dipende solo dalla distanza dall&rsquo;origine, $V=V(r)$, è il caso più importante della fisica atomica e nucleare, e Sakurai lo dice senza giri di parole: le hamiltoniane della forma $H=\mathbf p^{2}/2m+V(r)$ <i>«are the basis for very many situations in the physical world. The fundamental importance of this Hamiltonian lies in the fact that it is spherically symmetrical»</i>. Da questa simmetria segue che tutte le componenti del momento angolare orbitale commutano con la hamiltoniana, e che gli autostati dell&rsquo;energia si possono scegliere con $l$ e $m$ definiti.</p>
  <p>Il guadagno è grande. La parte angolare della funzione d&rsquo;onda non dipende dal potenziale: sono le <span class="str" data-str="armoniche-sferiche">armoniche sferiche</span>, le stesse per l&rsquo;idrogeno, per l&rsquo;oscillatore, per un nucleo. Griffiths lo scrive così: <i>«the angular part of the wave function, $Y(\theta,\phi)$, is the same for all spherically symmetric potentials; the actual shape of the potential, $V(r)$, affects only the radial part of the wave function»</i>. Quello che resta è un&rsquo;equazione per una sola variabile, $r$, che Landau riduce al <i>«moto unidimensionale in una regione semi-limitata»</i>, con un potenziale centrifugo in più e una condizione nell&rsquo;origine.</p>
  <p>Il prezzo è una domanda che l&rsquo;algebra del momento angolare lasciava aperta. Le regole di commutazione da sole ammettono valori interi e semiinteri; il momento angolare orbitale, $\mathbf L=\mathbf r\times\mathbf p$, ha solo valori interi. Perché? Le fonti rispondono in modi diversi, e almeno una delle risposte più comuni è meno solida di quanto sembri. Capire perché è una delle domande d&rsquo;orale che distinguono chi ha capito da chi ha imparato.</p>`},
  {t:'prosa', title:'Come è fatto il movimento', tag:'architettura', html:R`
  <p><b>Il primo blocco è la parte angolare.</b> La tappa 01 ricava dalla simmetria la forma della soluzione. La 02 scrive $L_{z}$ e $L^{2}$ come operatori differenziali e mostra che $L^{2}$ è la parte angolare del laplaciano. La 03 affronta la domanda sugli interi, con tutti gli argomenti delle fonti messi a confronto, compresa la prova di Ballentine che non usa condizioni al contorno. La 04 costruisce le armoniche sferiche e le loro proprietà.</p>
  <p><b>Il secondo blocco è la parte radiale.</b> La 05 ricava l&rsquo;equazione radiale e il potenziale efficace. La 06 discute la condizione nell&rsquo;origine, l&rsquo;altro punto su cui le fonti divergono, e il comportamento $r^{l}$. La 07 è la particella libera in coordinate sferiche e la buca sferica infinita, con le funzioni di Bessel sferiche e un errore di stampa trovato facendo il conto. La 08 è la buca sferica finita, dove si vede che in tre dimensioni uno stato legato può non esserci.</p>
  <p><b>Il terzo blocco sono i conti d&rsquo;esame.</b> La 09 risolve l&rsquo;oscillatore isotropo in coordinate sferiche e lo confronta con la soluzione cartesiana: due conti, lo stesso spettro, la degenerazione contata in due modi. La 10 risolve un compito vero che dà le autofunzioni dell&rsquo;oscillatore in coordinate sferiche e ci aggiunge lo spin-orbita. La 11 tratta i problemi senza parte radiale, una particella vincolata su una sfera, che negli scritti compaiono più volte. La 12 mette a confronto le fonti e chiude con le domande d&rsquo;orale.</p>
  <p><b>Che cosa il movimento non fa.</b> Non risolve l&rsquo;atomo di idrogeno: il potenziale coulombiano compare solo dove serve un esempio di comportamento all&rsquo;infinito. Non sviluppa la teoria dello scattering in onde parziali oltre lo sviluppo dell&rsquo;onda piana. E usa la composizione di momento orbitale e spin solo nei due casi che servono all&rsquo;esercizio della tappa 10, verificandola con le matrici.</p>`}
]},
/* ---------------- 01 · CHE COSA IMPONE LA SIMMETRIA ---------------- */
{ num:'01', title:'Che cosa impone la simmetria per rotazioni', meta:'L commuta con H · autostati con E l m · perché la degenerazione è 2l+1 · degenerazione essenziale e accidentale · che cosa non basta a fissare uno stato',
  blocchi:[
  {t:'prosa', title:'Il momento angolare commuta con la hamiltoniana', tag:'simmetria', html:R`
  <p>Il punto di partenza è che le componenti di $\mathbf L=\mathbf r\times\mathbf p$ <span class="str" data-str="commutatore">commutano</span> con $\mathbf p^{2}$ e con qualunque funzione di $r^{2}$, cioè di $\mathbf r\cdot\mathbf r$. È un fatto geometrico: $\mathbf L$ genera le rotazioni, e $\mathbf p^{2}$ e $r^{2}$ sono scalari, invarianti per rotazioni. Sakurai lo scrive come $[L_{i},\mathbf p^{2}]=[L_{i},f(r)]=0$, e ne deduce</p>
  $$[\mathbf L,H]=[L^{2},H]=0\qquad\text{se}\quad H=\frac{\mathbf p^{2}}{2m}+V(r).$$
  <p>Picasso apre il capitolo sul campo centrale con la stessa osservazione: se la particella è soggetta a un campo di forza centrale, <i>«tutte le componenti del momento angolare commutano con la hamiltoniana e vedremo che questo fatto permette di semplificare notevolmente l&rsquo;equazione di Schrödinger»</i>.</p>
  <p>Il conto si fa nella rappresentazione delle coordinate. Con $L_{z}=-i\hbar(x\partial_{y}-y\partial_{x})$, applicato a una funzione qualunque $f(x,y,z)$, si verifica che $L_{z}$ commuta con la moltiplicazione per $x^{2}+y^{2}+z^{2}$ e con il laplaciano: $L_{z}(\nabla^{2}f)-\nabla^{2}(L_{z}f)=0$ per ogni $f$. Lo stesso vale per $L_{x}$ e $L_{y}$, per simmetria. Le tre componenti, invece, non commutano fra loro: $[L_{x},L_{y}]=i\hbar L_{z}$ e cicliche, e anche questo si verifica sulla funzione arbitraria.</p>`},
  {t:'reveal', title:'Che cosa segue dalla commutazione', tag:'conseguenze', steps:[
   {label:'Un insieme di autostati comuni', body:R`
   <p>$H$, $L^{2}$ e $L_{z}$ commutano a due a due, quindi hanno una base di autostati comuni, che Sakurai scrive $|E\,l\,m\rangle$:</p>
   $$H|Elm\rangle=E|Elm\rangle,\qquad L^{2}|Elm\rangle=l(l+1)\hbar^{2}|Elm\rangle,\qquad L_{z}|Elm\rangle=m\hbar|Elm\rangle .$$
   <p>Che $l$ e $m$ siano quelli dell&rsquo;algebra, cioè $l(l+1)\hbar^{2}$ con $m$ da $-l$ a $l$, segue dal fatto che le $L_{k}$ soddisfano le regole di commutazione del momento angolare. Che $l$ debba essere intero è un&rsquo;altra questione, che richiede la tappa 03.</p>`},
   {label:'Perché ogni livello è degenere 2l+1 volte', body:R`
   <p>Picasso dà la ragione generale. La degenerazione è <i>«una conseguenza del teorema di degenerazione»</i>: ha <i>«la sua origine nel fatto che $M_{+}$, $M_{-}$ e $M_{3}$, cioè tutte le $M_{i}$, commutano con [...] ma non commutano fra di loro»</i>, dove i puntini stanno per l&rsquo;osservabile scalare, qui la hamiltoniana. Se $|Elm\rangle$ è un autostato, anche $L_{\pm}|Elm\rangle$ lo è, con la stessa energia, perché $L_{\pm}$ commuta con $H$; e $L_{\pm}$ cambia $m$. Quindi tutti i $2l+1$ valori di $m$ hanno la stessa energia.</p>
   <p>Landau vede la stessa cosa dall&rsquo;equazione: nell&rsquo;equazione radiale <i>«non contiene affatto il valore $l_{z}=m$, cosa che corrisponde al fatto ormai noto che i livelli sono $(2l+1)$ volte degeneri rispetto alle direzioni del momento angolare»</i>. Fisicamente: in un campo centrale lo spazio non ha direzioni privilegiate, e l&rsquo;energia non può dipendere dall&rsquo;orientazione del momento angolare.</p>`},
   {label:'Degenerazione essenziale e accidentale', body:R`
   <p>La degenerazione in $m$ è imposta dalla simmetria, e non si toglie senza rompere la simmetria. Picasso, discutendo gli atomi, osserva che in un sistema complicato <i>«la complessità della hamiltoniana rimuove qualsiasi degenerazione che non sia imposta da ragioni di simmetria: in pratica sopravvive solo la degenerazione su $M$, dovuta all&rsquo;invarianza per rotazioni»</i>.</p>
   <p>Ogni degenerazione in più è un segnale. Livelli con $l$ diverso e la stessa energia si trovano nell&rsquo;oscillatore isotropo, dove $l=0$ e $l=2$ stanno insieme nello stesso livello, e nell&rsquo;atomo di idrogeno, dove Sakurai scrive che la degenerazione in $l$ <i>«is in fact not accidental but, rather, reflects a subtle symmetry of the Coulomb potential»</i>. Nella buca sferica infinita, invece, Sakurai nota che i livelli non hanno degenerazione in $l$, <i>«except for any accidental equality between zeros of spherical Bessel functions of different orders»</i>.</p>`},
   {label:'Il momento angolare da solo non basta', body:R`
   <p>Shankar fa notare che fissare $l_{z}=m\hbar$ non individua uno stato: la soluzione di $L_{z}\psi=m\hbar\psi$ è $R(\rho)e^{im\phi}$ con $R$ arbitraria, e l&rsquo;autospazio ha dimensione infinita. Ci vuole un operatore che commuti con $L_{z}$ e scelga una base dentro quell&rsquo;autospazio, e in un problema invariante per rotazioni lo fa la hamiltoniana: <i>«physically this means that a state is not uniquely specified by just its angular momentum (which only fixes the angular part of the wave function), but it can be specified by its energy and angular momentum in a rotationally invariant problem»</i>. Landau arriva alla stessa conclusione dall&rsquo;altro lato: nel campo centrale <i>«l&rsquo;energia, il quadrato del momento angolare e la sua proiezione costituiscono insieme un sistema completo di grandezze fisiche»</i>.</p>`}
  ]}
]},
/* ---------------- 02 · L COME OPERATORE DIFFERENZIALE ---------------- */
{ num:'02', title:'Il momento angolare come operatore differenziale', meta:'Lz come derivata nell angolo azimutale · Lz e phi come x e p · L quadro è la parte angolare del laplaciano · energia cinetica radiale più centrifuga · il segno del potenziale centrifugo',
  blocchi:[
  {t:'reveal', title:'Lz: la derivata rispetto all angolo azimutale', tag:'derivazione', steps:[
   {label:'Dal generatore delle rotazioni', body:R`
   <p>Sakurai ricava $L_{z}$ dal suo significato. Se l&rsquo;impulso genera le traslazioni, l&rsquo;operatore $1-i\,\delta\phi\,L_{z}/\hbar=1-i\,\delta\phi\,(xp_{y}-yp_{x})/\hbar$ applicato a un autoket della posizione lo sposta in $|x'-y'\delta\phi,\ y'+x'\delta\phi,\ z'\rangle$, che è la rotazione di $\delta\phi$ attorno a $z$. <i>«So we have demonstrated that if $\mathbf p$ generates translation, then $\mathbf L$ generates rotation»</i>. In coordinate sferiche la rotazione cambia solo $\phi$, e confrontando lo sviluppo al primo ordine si ottiene</p>
   $$\langle\mathbf x'|L_{z}|\alpha\rangle=-i\hbar\frac{\partial}{\partial\phi}\langle\mathbf x'|\alpha\rangle,$$
   <p><i>«which is a well-known result from wave mechanics»</i>, con la precisazione che questa derivazione <i>«emphasizes the role of $L_{z}$ as the generator of rotation»</i>.</p>`},
   {label:'Dalla regola della catena', body:R`
   <p>Picasso fa il conto direttamente. Partendo da $L_{z}=-i\hbar(x\partial_{y}-y\partial_{x})$ e scrivendo le derivate cartesiane in coordinate sferiche, il coefficiente di $\partial/\partial r$ è nullo, perché $\partial r/\partial y=y/r$ e $\partial r/\partial x=x/r$ si cancellano; lo stesso succede al coefficiente di $\partial/\partial\theta$; <i>«resta solo il coefficiente di $\partial/\partial\phi$ che il calcolo diretto mostra essere uguale a 1»</i>. Il controllo su una funzione concreta: $(x+iy)^{2}z\,e^{-r^{2}}$, che in coordinate sferiche è $r^{3}\sin^{2}\theta\cos\theta\,e^{2i\phi}e^{-r^{2}}$, è autofunzione di $L_{z}$ con autovalore $2\hbar$ in tutte e due le scritture.</p>
   <p>Picasso aggiunge un&rsquo;analogia e un avvertimento. L&rsquo;analogia: $L_{z}=-i\hbar\,\partial/\partial\phi$ è come $p=-i\hbar\,\partial/\partial x$, <i>«perché classicamente $\phi$ e $L_{z}$ sono variabili canonicamente coniugate, così come lo sono $x$ e $p$»</i>. L&rsquo;avvertimento: la regola di commutazione $[L_{z},\phi]=-i\hbar$ <i>«presenta qualche delicato problema di dominio perché, siccome $\phi$ varia fra $0$ e $2\pi$, la moltiplicazione per $\phi$ introduce una discontinuità»</i>. Per questo non esiste una relazione di indeterminazione fra $L_{z}$ e l&rsquo;angolo nella forma ingenua: $\phi$ non è una buona osservabile sulle funzioni periodiche.</p>`},
   {label:'Le altre componenti, e gli operatori a scala', body:R`
   <p>Le componenti $L_{x}$ e $L_{y}$ si ottengono allo stesso modo con rotazioni attorno a $x$ e a $y$, e sono più complicate perché quelle rotazioni cambiano sia $\theta$ sia $\phi$. Gli operatori a scala hanno la forma compatta di Sakurai,</p>
   $$\langle\mathbf x'|L_{\pm}|\alpha\rangle=-i\hbar\,e^{\pm i\phi}\Big(\pm i\frac{\partial}{\partial\theta}-\cot\theta\,\frac{\partial}{\partial\phi}\Big)\langle\mathbf x'|\alpha\rangle .$$
   <p>Ballentine scrive l&rsquo;intero vettore come $\mathbf L=-i\hbar\big(\hat e_{\phi}\,\partial_{\theta}-\hat e_{\theta}\,\tfrac{1}{\sin\theta}\partial_{\phi}\big)$, e avverte che, calcolando $\mathbf L\cdot\mathbf L$, <i>«we must remember that the unit vectors $\hat e_{\theta}$ and $\hat e_{\phi}$ are not constant, and so the action of the differential operators on them must be included»</i>.</p>`}
  ]},
  {t:'prosa', title:'L quadro è la parte angolare del laplaciano', tag:'identità', html:R`
  <p>Il risultato, in tutte le fonti, è</p>
  $$\langle\mathbf x'|L^{2}|\alpha\rangle=-\hbar^{2}\Big[\frac{1}{\sin^{2}\theta}\frac{\partial^{2}}{\partial\phi^{2}}+\frac{1}{\sin\theta}\frac{\partial}{\partial\theta}\Big(\sin\theta\frac{\partial}{\partial\theta}\Big)\Big]\langle\mathbf x'|\alpha\rangle,$$
  <p>e Sakurai commenta: <i>«apart from $1/r^{2}$, we recognize the differential operator that appears here to be just the angular part of the Laplacian in spherical coordinates»</i>. Lo stabilisce anche per un&rsquo;altra via, con un&rsquo;identità fra operatori che vale la pena saper dimostrare:</p>
  $$\mathbf L^{2}=\mathbf x^{2}\mathbf p^{2}-(\mathbf x\cdot\mathbf p)^{2}+i\hbar\,\mathbf x\cdot\mathbf p .$$
  <p>Classicamente $L^{2}=r^{2}p^{2}-(\mathbf r\cdot\mathbf p)^{2}$, il quadrato del prodotto vettoriale; il termine $i\hbar\,\mathbf x\cdot\mathbf p$ è il prezzo dell&rsquo;ordine degli operatori. Nella rappresentazione delle coordinate $\mathbf x\cdot\mathbf p=-i\hbar\,r\,\partial/\partial r$, e dividendo per $2mr^{2}$ si ottiene l&rsquo;energia cinetica come somma di una parte radiale e di una parte angolare:</p>
  $$\frac{\mathbf p^{2}}{2m}\ \to\ -\frac{\hbar^{2}}{2m}\Big(\frac{\partial^{2}}{\partial r^{2}}+\frac{2}{r}\frac{\partial}{\partial r}\Big)+\frac{L^{2}}{2mr^{2}} .$$
  <p>Il controllo su un caso: per $F=z\,e^{-r^{2}}$, che ha $l=1$ e parte radiale $R=r\,e^{-r^{2}}$, il laplaciano cartesiano diviso per $F$ coincide con $(R''+2R'/r-2R/r^{2})/R$, dove il $2$ è $l(l+1)$.</p>`},
  {t:'prosa', title:'Picasso: impulso radiale e potenziale centrifugo', tag:'fisica', html:R`
  <p>Picasso scrive la stessa decomposizione con l&rsquo;impulso radiale, nella forma $L^{2}=r^{2}p^{2}-r\,p_{r}^{2}\,r$, e osserva che differisce dall&rsquo;espressione classica <i>«(come è giusto che sia) solo per l&rsquo;ordine dei fattori»</i>. Il suo impulso radiale è la proiezione dell&rsquo;impulso lungo il raggio, $p_{r}=r^{-1}\,\mathbf r\cdot\mathbf p$, che nella rappresentazione di Schrödinger agisce semplicemente come $-i\hbar\,\partial/\partial r$. Nell&rsquo;energia cinetica compare la combinazione $r^{-1}p_{r}^{2}\,r$, che agisce come $-\hbar^{2}\frac1r\frac{\partial^{2}}{\partial r^{2}}(rg)=-\hbar^{2}\big(g''+\tfrac2rg'\big)$, la parte radiale del laplaciano. Picasso avverte che $p_{r}$ non è hermitiano, perché $p_{r}^{\dagger}=(\mathbf p\cdot\mathbf r)\,r^{-1}$ è un altro operatore, e spiega da dove viene la differenza: <i>«la ragione per cui l&rsquo;operatore $-i\,\partial/\partial x$ è hermitiano, mentre invece $-i\,\partial/\partial r$ no, è nel fattore $r^{2}$ presente nell&rsquo;elemento di volume in coordinate polari»</i>. Landau, in nota, sceglie invece l&rsquo;impulso radiale $p_{r}=-i\hbar\,\frac1r\frac{\partial}{\partial r}\,r$, che è hermitiano e il cui quadrato è direttamente la parte radiale del laplaciano; con questa scelta la hamiltoniana <i>«coincide con la forma della funzione di Hamilton classica in coordinate sferiche»</i>. Le due scelte differiscono per l&rsquo;ordine dei fattori e danno lo stesso operatore energia cinetica.</p>
  <p>L&rsquo;energia cinetica si spezza allora come</p>
  $$\frac{\mathbf p^{2}}{2m}=\frac{1}{2m}\,\frac1r\,p_{r}^{2}\,r+\frac{L^{2}}{2mr^{2}},$$
  <p>con il $p_{r}$ di Picasso, e Picasso dà il significato del secondo termine: <i>«il contributo dovuto alla rotazione della particella: esso viene chiamato potenziale centrifugo a momento angolare costante»</i>. La sua derivata cambiata di segno è $L^{2}/mr^{3}$, che con $L=mr^{2}\omega$ è la forza centrifuga $m\omega^{2}r$. Picasso nota la differenza con il potenziale centrifugo a velocità angolare costante, $-\tfrac12m\omega^{2}r^{2}$, che dà la stessa forza ma ha segno opposto: il primo è quello giusto qui, perché in un campo centrale si conserva $L$, non $\omega$.</p>`}
]},
/* ---------------- 03 · PERCHE L ORBITALE E INTERO ---------------- */
{ num:'03', title:'Perché il momento angolare orbitale è intero', meta:'l algebra ammette i semiinteri · la funzione d onda a un sol valore e i suoi limiti · l hermiticità di Lz · interi e semiinteri non convivono · i tre argomenti di Sakurai · la critica di Ballentine e la sua prova con due oscillatori',
  blocchi:[
  {t:'prosa', title:'La domanda', tag:'problema', html:R`
  <p>Dalle sole regole di commutazione $[J_{i},J_{j}]=i\hbar\epsilon_{ijk}J_{k}$ segue che gli autovalori di $J^{2}$ sono $j(j+1)\hbar^{2}$ con $j=0,\tfrac12,1,\tfrac32,\dots$, e quelli di $J_{z}$ sono $m\hbar$ con $m$ da $-j$ a $j$ a passi di uno. Picasso, dopo averlo ricavato, avverte che il risultato <i>«dipende solo dalle regole di commutazione»</i> e che <i>«per questo motivo non è detto che per un particolare sistema, cioè per un particolare momento angolare, $j$ possa effettivamente assumere tutti i valori che abbiamo trovato come possibili»</i>. Per il momento angolare orbitale $\mathbf L=\mathbf r\times\mathbf p$ solo gli interi sono realizzati. Shankar, ricavati gli autovalori dall&rsquo;algebra, scrive che i risultati per $\mathbf J=\mathbf L$ si ottengono <i>«we simply ignore the states with half-integral $m$ and $j$»</i>, e rimanda la giustificazione.</p>
  <p>La giustificazione è il punto. Sakurai ammette che <i>«from the point of view of the angular-momentum commutation relations alone, it might not appear obvious why $l$ cannot be a half-integer»</i>. Le fonti danno almeno cinque argomenti diversi, e non sono equivalenti: alcuni sono condizioni al contorno imposte sulla funzione d&rsquo;onda, uno è una proprietà dell&rsquo;operatore, uno non usa la funzione d&rsquo;onda affatto.</p>`},
  {t:'reveal', title:'Cinque argomenti, dal più ingenuo al più solido', tag:'argomenti', steps:[
   {label:'1. La funzione d’onda deve avere un sol valore', body:R`
   <p>È l&rsquo;argomento di Picasso e di Griffiths. L&rsquo;equazione $-i\hbar\,\partial_{\phi}\psi=m\hbar\psi$ ha soluzione $f(r,\theta)e^{im\phi}$, e siccome $\phi$ e $\phi+2\pi$ rappresentano lo stesso punto, Picasso chiede $\psi(r,\theta,\phi)=\psi(r,\theta,\phi+2\pi)$, cioè $e^{2\pi im}=1$, <i>«che vale solo se $m$ è un numero intero»</i>. Griffiths fa lo stesso, ma in nota mette in guardia: <i>«this is more slippery than it looks. After all, the probability density $(|\Phi|^{2})$ is single-valued regardless of $m$»</i>, e promette <i>«an entirely different, and more compelling, argument»</i>. Il punto debole è che la funzione d&rsquo;onda non è osservabile: per $m=\tfrac12$ cambia segno girando di $2\pi$, ma $|\psi|^{2}$ no.</p>`},
   {label:'2. Lz deve essere hermitiano', body:R`
   <p>Shankar parte da un&rsquo;altra osservazione: senza vincoli, la soluzione $e^{il_{z}\phi/\hbar}$ esiste per ogni $l_{z}$, anche complesso, perché $\phi$ va solo da $0$ a $2\pi$. <i>«The fact that complex eigenvalues enter the answer, signals that we are overlooking the Hermiticity constraint»</i>. Integrando per parti, $L_{z}$ è <span class="str" data-str="operatore-aggiunto">hermitiano</span> su un insieme di funzioni se il termine di bordo $\psi_{1}^{*}\psi_{2}\big|_{0}^{2\pi}$ si annulla, e basta chiedere che ogni funzione dell&rsquo;insieme abbia lo stesso valore in $0$ e in $2\pi$. Imposto agli autostati, il vincolo dà $l_{z}=m\hbar$ con $m$ intero. L&rsquo;argomento è più solido del precedente perché non chiede niente alla funzione d&rsquo;onda come oggetto fisico: chiede che l&rsquo;operatore sia un&rsquo;osservabile. Resta però una scelta: il dominio su cui $L_{z}$ è hermitiano non è unico, e il dominio delle funzioni con $\psi(2\pi)=e^{i\alpha}\psi(0)$ lo renderebbe hermitiano con autovalori $m+\alpha/2\pi$.</p>
   <p>Shankar stesso, nell&rsquo;esercizio 12.3.2, mostra che cosa si ottiene chiedendo soltanto che una rotazione di $2\pi$ dia lo stesso stato fisico, non lo stesso vettore: le differenze fra autovalori sono intere, e per simmetria lo spettro è o tutto intero o tutto semiintero. <i>«It is not possible to restrict $l_{z}$ any further this way»</i>.</p>`},
   {label:'3. Interi e semiinteri non convivono', body:R`
   <p>Picasso dimostra la parte che si può dimostrare in generale. Se un sistema avesse stati con $j$ intero e con $j$ semiintero, uno stato $|A\rangle=|A'\rangle+|A''\rangle$ con una parte di ciascun tipo, ruotato di $2\pi$, diventerebbe $|A'\rangle-|A''\rangle$, perché $e^{2\pi im}$ vale $1$ per $m$ intero e $-1$ per $m$ semiintero. Ma $|A'\rangle-|A''\rangle$ è un altro stato, non un multiplo di $|A\rangle$, mentre la rotazione di $2\pi$ è l&rsquo;identità su tutte le osservabili. Quindi <i>«per un sistema non sono simultaneamente possibili momenti angolari interi e semidispari»</i>. È lo stesso risultato di Shankar: tutto intero o tutto semiintero. Quale dei due, per il momento orbitale, l&rsquo;argomento non lo dice.</p>`},
   {label:'4. I tre argomenti di Sakurai', body:R`
   <p>Sakurai ne mette in fila tre. Il primo è un rafforzamento del primo argomento: la rotazione di $2\pi$ generata da $L_{z}$ agisce sulla funzione d&rsquo;onda cambiando le coordinate, $\langle\mathbf x'|e^{-iL_{z}2\pi/\hbar}|\alpha\rangle=\langle x'\cos2\pi+y'\sin2\pi,\ y'\cos2\pi-x'\sin2\pi,\ z'|\alpha\rangle=\langle\mathbf x'|\alpha\rangle$, senza cambio di segno; e la funzione d&rsquo;onda deve essere a un sol valore perché lo sviluppo di un ket negli autoket della posizione è unico.</p>
   <p>Il secondo è il più concreto. Si prova a costruire $Y_{1/2}^{1/2}=c\,e^{i\phi/2}\sqrt{\sin\theta}$, soluzione di $L_{+}Y=0$, e le si applica $L_{-}$. Il risultato è</p>
   $$Y_{1/2}^{-1/2}\propto e^{-i\phi}\Big(-\frac{\partial}{\partial\theta}+i\cot\theta\frac{\partial}{\partial\phi}\Big)\big(e^{i\phi/2}\sqrt{\sin\theta}\big)=-e^{-i\phi/2}\cot\theta\,\sqrt{\sin\theta},$$
   <p><i>«this expression is not permissible because it is singular at $\theta=0,\pi$. What is worse»</i>, risolvendo direttamente $L_{-}Y_{1/2}^{-1/2}=0$ si ottiene $e^{-i\phi/2}\sqrt{\sin\theta}$, <i>«in sharp contradiction»</i> con il risultato precedente: le due funzioni non sono proporzionali. La scala non si chiude.</p>
   <p>Il terzo è la completezza: per la teoria di Sturm-Liouville le soluzioni con $l$ intero formano già un insieme completo, e <i>«an arbitrary function of $\theta$ and $\phi$ can be expanded in terms of $Y_{l}^{m}$ with integer $l$ and $m$ only»</i>. Non c&rsquo;è posto per altro. La conclusione di Sakurai: <i>«it is futile to contemplate orbital angular momentum with half-integer $l$-values»</i>.</p>`},
   {label:'5. Ballentine: la critica, e la prova senza condizioni al contorno', body:R`
   <p>Ballentine è il più severo con gli argomenti basati sulla funzione d&rsquo;onda. Le condizioni di un sol valore e di regolarità <i>«can be justified in a classical field theory, such as electromagnetism, in which the field is an observable physical quantity. But in quantum theory the state function $\Psi$ does not have such direct physical significance»</i>. E fa il controesempio: $Y=(\sin\theta)^{1/2}e^{i\phi/2}$ è finita ovunque e soddisfa le equazioni per $l=m=\tfrac12$. <i>«Is it therefore to be admitted as an eigenfunction of orbital angular momentum? It is difficult to give an adequate justification for the conventional boundary conditions in this quantum-mechanical setting»</i>.</p>
   <p>La sua prova usa solo $\mathbf L=\mathbf Q\times\mathbf P$ e le regole di commutazione canoniche. Con $\hbar=1$ e quattro nuove variabili,</p>
   $$q_{1}=\frac{Q_{x}+P_{y}}{\sqrt2},\quad q_{2}=\frac{Q_{x}-P_{y}}{\sqrt2},\quad p_{1}=\frac{P_{x}-Q_{y}}{\sqrt2},\quad p_{2}=\frac{P_{x}+Q_{y}}{\sqrt2},$$
   <p>si verifica che sono canoniche, $[q_{\alpha},p_{\beta}]=i\delta_{\alpha\beta}$ e le altre nulle, e che</p>
   $$L_{z}=Q_{x}P_{y}-Q_{y}P_{x}=\tfrac12\big(p_{1}^{2}+q_{1}^{2}\big)-\tfrac12\big(p_{2}^{2}+q_{2}^{2}\big).$$
   <p>È la differenza di due oscillatori indipendenti, ciascuno con autovalori $n+\tfrac12$. Gli autovalori di $L_{z}$ sono quindi $(n_{1}+\tfrac12)-(n_{2}+\tfrac12)=n_{1}-n_{2}$: interi, e solo interi. <i>«This approach avoids any problematic discussion of boundary conditions on the state function $\Psi$; it could, however, be regarded as an indirect justification for the conventional boundary conditions that lead to the same result»</i>.</p>`}
  ]},
  {t:'plot', title:'La scala che non si chiude per l = 1/2',
   intro:R`<p>In funzione di $\theta$: il modulo della candidata $Y_{1/2}^{1/2}\propto\sqrt{\sin\theta}$ (blu), il modulo di $L_{-}$ applicato a essa, $|\cot\theta|\sqrt{\sin\theta}$ (arancio), e la soluzione diretta di $L_{-}Y=0$, ancora $\sqrt{\sin\theta}$ (verde, tratteggio sovrapposto al blu).</p>`,
   plots:[{kind:'func2d', xr:[0.02,3.12], yr:[0,3], height:260, ticks:true,
     title:'Sakurai: la candidata con l = 1/2 e la sua discesa',
     curves:[{f:'Math.sqrt(Math.sin(x))', col:'#5aa9ff', width:2.6, label:'sqrt(sin theta)'},
             {f:'Math.abs(Math.cos(x)/Math.sin(x))*Math.sqrt(Math.sin(x))', col:'#ffb86b', width:2.4, label:'|cot theta| sqrt(sin theta)'},
             {f:'Math.sqrt(Math.sin(x))', col:'#6bdc9b', width:1.2, label:'soluzione di L- Y = 0'}],
     xlabel:'theta', ylabel:'modulo'}],
   leggi:R`<p><b>Che cosa guardare.</b> La candidata è finita e regolare, come osserva Ballentine. La funzione che si ottiene applicando $L_{-}$ diverge come $1/\sqrt\theta$ ai poli e si annulla all&rsquo;equatore, mentre la soluzione diretta dell&rsquo;equazione per lo stato più basso è massima all&rsquo;equatore e si annulla ai poli. Le due curve dovrebbero essere la stessa funzione a meno di una costante, e non lo sono.</p>
   <p><b>Che cosa impararne.</b> Per $l$ intero l&rsquo;operatore $L_{-}$ porta ogni armonica nella successiva, e dopo $2l$ passi arriva esattamente alla soluzione di $L_{-}Y=0$. Per $l=\tfrac12$ un solo passo basta a uscire dalle funzioni regolari. L&rsquo;argomento non usa la monodromia: usa la coerenza della scala costruita con gli operatori differenziali.</p>`},
  {t:'prosa', title:'Che cosa portarsi all’orale', tag:'sintesi per l esame', html:R`
  <p>Alla domanda «perché $l$ è intero?» la risposta della monodromia è quella che quasi tutti danno, ed è quella che un esaminatore attento contesta subito con l&rsquo;osservazione di Griffiths: la densità di probabilità ha un sol valore comunque. La risposta che regge si costruisce in due tempi. Primo: per un dato sistema i valori sono o tutti interi o tutti semiinteri, perché una rotazione di $2\pi$ deve agire come un multiplo dell&rsquo;identità (Picasso, Shankar). Secondo: per $\mathbf L=\mathbf r\times\mathbf p$ sono interi, e lo si vede o con l&rsquo;hermiticità di $L_{z}$ sulle funzioni periodiche (Shankar), o con la scala di Sakurai che per $l=\tfrac12$ non si chiude, o, senza nessuna condizione al contorno, con la scomposizione di Ballentine di $L_{z}$ in due oscillatori. Lo spin, che non è $\mathbf r\times\mathbf p$, sfugge a tutti questi argomenti, ed è per questo che può essere semiintero.</p>`}
]},
/* ---------------- 04 · LE ARMONICHE SFERICHE ---------------- */
{ num:'04', title:'Le armoniche sferiche: costruzione, forma cartesiana, proprietà', meta:'separare theta e phi · le soluzioni che esplodono ai poli · la costruzione con L+ e L- · i polinomi armonici omogenei · parità · ortonormalità e la somma su m · le convenzioni di fase',
  blocchi:[
  {t:'reveal', title:'Due costruzioni', tag:'costruzione', steps:[
   {label:'Griffiths: separare ancora', body:R`
   <p>Griffiths cerca le soluzioni dell&rsquo;equazione angolare come prodotto, $Y(\theta,\phi)=\Theta(\theta)\Phi(\phi)$, con una seconda costante di separazione che chiama $m^{2}$. L&rsquo;equazione in $\phi$ dà $\Phi=e^{im\phi}$. Quella in $\theta$,</p>
   $$\sin\theta\frac{d}{d\theta}\Big(\sin\theta\frac{d\Theta}{d\theta}\Big)+\big[l(l+1)\sin^{2}\theta-m^{2}\big]\Theta=0,$$
   <p>ha come soluzione $\Theta=A\,P_{l}^{m}(\cos\theta)$, con le funzioni associate di Legendre ottenute dai <span class="str" data-str="polinomi-di-legendre">polinomi di Legendre</span> con la formula di Rodrigues. Griffiths osserva che $l$ deve essere un intero non negativo perché la formula di Rodrigues abbia senso, che $P_{l}^{m}=0$ per $|m|\gt l$, e si chiede: <i>«Equation 4.25 is a second-order differential equation: It should have two linearly independent solutions, for any old values of $l$ and $m$. Where are all the other solutions? Answer: They exist, of course, as mathematical solutions to the equation, but they are physically unacceptable, because they blow up at $\theta=0$ and/or $\theta=\pi$»</i>. Il suo problema 4.4 ne dà un esempio per $l=m=0$: $\Theta=A\ln[\tan(\theta/2)]$, che soddisfa l&rsquo;equazione e diverge ai due poli.</p>`},
   {label:'Sakurai: salire e scendere', body:R`
   <p>Sakurai parte dallo stato più alto. La condizione $L_{+}Y_{l}^{l}=0$, con $L_{+}$ come operatore differenziale e la dipendenza $e^{il\phi}$, dà</p>
   $$Y_{l}^{l}(\theta,\phi)=c_{l}\,e^{il\phi}\sin^{l}\theta,$$
   <p>con $c_{l}$ fissato dalla normalizzazione. Poi si applica $L_{-}$ ripetutamente, e ogni applicazione abbassa $m$ di uno. Il risultato generale è che la parte in $\theta$ di $Y_{l}^{m}$ è $\sin^{|m|}\theta$ per un polinomio in $\cos\theta$ di grado $l-|m|$, e per $m=0$</p>
   $$Y_{l}^{0}(\theta,\phi)=\sqrt{\frac{2l+1}{4\pi}}\,P_{l}(\cos\theta).$$
   <p>Le due costruzioni si completano: quella di Griffiths spiega perché la regolarità ai poli seleziona $l$ intero e $|m|\le l$, quella di Sakurai dà le funzioni senza risolvere nessuna equazione differenziale del secondo ordine.</p>`}
  ]},
  {t:'prosa', title:'Le prime armoniche, e la forma cartesiana', tag:'tavola', html:R`
  <p>Le armoniche che servono negli esercizi sono poche:</p>
  $$Y_{0}^{0}=\frac{1}{\sqrt{4\pi}},\qquad Y_{1}^{0}=\sqrt{\frac{3}{4\pi}}\cos\theta,\qquad Y_{1}^{\pm1}=\mp\sqrt{\frac{3}{8\pi}}\sin\theta\,e^{\pm i\phi},$$
  $$Y_{2}^{0}=\sqrt{\frac{5}{16\pi}}\,(3\cos^{2}\theta-1),\qquad Y_{2}^{\pm1}=\mp\sqrt{\frac{15}{8\pi}}\sin\theta\cos\theta\,e^{\pm i\phi},\qquad Y_{2}^{\pm2}=\sqrt{\frac{15}{32\pi}}\sin^{2}\theta\,e^{\pm2i\phi}.$$
  <p>Picasso fa notare che <i>«per quanto riguarda la $Y_{00}$ era prevedibile che non dovesse dipendere né da $\theta$ né da $\phi$»</i>: se $l=0$ ogni componente di $\mathbf L$ ha solo l&rsquo;autovalore zero, e una funzione che non cambia per rotazioni attorno a nessun asse è a simmetria sferica. E aggiunge che questo non contraddice la non commutazione delle componenti: <i>«gli stati di momento angolare $0$ non formano un insieme completo di stati»</i>.</p>
  <p>Moltiplicate per $r^{l}$, le armoniche diventano polinomi nelle coordinate cartesiane. Per $l=1$, a meno di un fattore comune, $rY_{1}^{\pm1}\propto\mp(x\pm iy)$ e $rY_{1}^{0}\propto z$; per $l=2$, $r^{2}Y_{2}^{0}\propto2z^{2}-x^{2}-y^{2}$ e $r^{2}Y_{2}^{\pm2}\propto(x\pm iy)^{2}$. Picasso lo dice in generale: <i>«le armoniche sferiche di ordine $l$ sono il prodotto di $r^{-l}$ per un polinomio omogeneo di grado $l$ nelle $x,y,z$»</i>. Questi polinomi sono armonici, cioè hanno laplaciano nullo, e il loro numero si conta: i polinomi omogenei di grado $l$ in tre variabili sono $(l+1)(l+2)/2$, il laplaciano li manda su quelli di grado $l-2$, che sono $(l-1)l/2$, e quelli che annulla sono la differenza,</p>
  $$\frac{(l+1)(l+2)}{2}-\frac{(l-1)l}{2}=2l+1 .$$
  <p>Il conto è lo stesso che, nell&rsquo;oscillatore isotropo, separa il livello $n=2$ in sei stati, cinque con $l=2$ e uno con $l=0$: i polinomi omogenei di grado $l$ sono le armoniche di grado $l$ più $r^{2}$ per i polinomi di grado $l-2$.</p>`},
  {t:'reveal', title:'Parità, ortonormalità, e la somma su m', tag:'proprietà', steps:[
   {label:'Parità', body:R`
   <p>L&rsquo;inversione $\mathbf r\to-\mathbf r$ manda $\theta\to\pi-\theta$ e $\phi\to\phi+\pi$, e un polinomio omogeneo di grado $l$ cambia per il fattore $(-1)^{l}$. Quindi $Y_{l}^{m}(\pi-\theta,\phi+\pi)=(-1)^{l}Y_{l}^{m}(\theta,\phi)$. Picasso lo ricava in un altro modo, più strutturale: l&rsquo;operatore di inversione commuta con tutte le componenti di $\mathbf L$, quindi è uno scalare, e tutti gli stati con lo stesso $l$ hanno la stessa parità; il fatto che le armoniche siano polinomi omogenei di grado $l$ <i>«ci dice anche che la parità di ogni stato $|\ldots,l,m\rangle$ coincide con la parità di $l$, cioè è $(-1)^{l}$»</i>.</p>`},
   {label:'Ortonormalità', body:R`
   <p>Le armoniche sono ortonormali sulla sfera, con l&rsquo;elemento d&rsquo;angolo solido $d\Omega=\sin\theta\,d\theta\,d\phi$:</p>
   $$\int_{0}^{2\pi}d\phi\int_{0}^{\pi}\sin\theta\,d\theta\ Y_{l'}^{m'*}(\theta,\phi)\,Y_{l}^{m}(\theta,\phi)=\delta_{ll'}\delta_{mm'} .$$
   <p>L&rsquo;ortogonalità in $m$ viene dall&rsquo;integrale in $\phi$ degli esponenziali; quella in $l$ a $m$ fissato dal fatto che sono autofunzioni di un operatore hermitiano, $L^{2}$, con autovalori diversi. Sakurai legge le armoniche come ampiezze: la $Y_{l}^{m}(\theta,\phi)$, che scrive come prodotto scalare $\langle\hat n|l,m\rangle$, <i>«is the amplitude for a state characterized by $l$, $m$ to be found in the direction $\hat n$ specified by $\theta$ and $\phi$»</i>, e l&rsquo;ortonormalità è la $\langle l',m'|l,m\rangle=\delta_{ll'}\delta_{mm'}$ scritta con la completezza degli autoket di direzione.</p>`},
   {label:'La somma su m è isotropa', body:R`
   <p>Una proprietà che non si vede nelle singole armoniche ma che è inevitabile: la somma dei moduli quadri su tutti gli $m$ di un dato $l$ non dipende dalla direzione,</p>
   $$\sum_{m=-l}^{l}|Y_{l}^{m}(\theta,\phi)|^{2}=\frac{2l+1}{4\pi}.$$
   <p>Per $l=2$ si controlla con la tavola: $\tfrac{5}{16\pi}(3\cos^{2}\theta-1)^{2}+2\cdot\tfrac{15}{8\pi}\sin^{2}\theta\cos^{2}\theta+2\cdot\tfrac{15}{32\pi}\sin^{4}\theta=\tfrac{5}{4\pi}$. La ragione è la simmetria: un multipletto riempito per intero è invariante per rotazioni, e la sua densità non può privilegiare nessuna direzione. È il motivo per cui un guscio atomico completo è a simmetria sferica.</p>`}
  ]},
  {t:'plot', title:'Le cinque armoniche con l = 2, e la loro somma',
   intro:R`<p>In funzione di $\theta$: $|Y_{2}^{0}|^{2}$ (blu), $|Y_{2}^{\pm1}|^{2}$ (arancio), $|Y_{2}^{\pm2}|^{2}$ (verde), e la somma su tutti e cinque i valori di $m$ (viola), che vale $5/4\pi\approx0{,}398$.</p>`,
   plots:[{kind:'func2d', xr:[0,3.1416], yr:[0,0.85], height:270, ticks:true,
     title:'moduli quadri delle armoniche con l = 2',
     curves:[{f:'5/(16*Math.PI)*Math.pow(3*Math.cos(x)*Math.cos(x)-1,2)', col:'#5aa9ff', width:2.4, label:'m = 0'},
             {f:'15/(8*Math.PI)*Math.pow(Math.sin(x)*Math.cos(x),2)', col:'#ffb86b', width:2.4, label:'m = +-1'},
             {f:'15/(32*Math.PI)*Math.pow(Math.sin(x),4)', col:'#6bdc9b', width:2.4, label:'m = +-2'},
             {f:'5/(16*Math.PI)*Math.pow(3*Math.cos(x)*Math.cos(x)-1,2)+2*15/(8*Math.PI)*Math.pow(Math.sin(x)*Math.cos(x),2)+2*15/(32*Math.PI)*Math.pow(Math.sin(x),4)', col:'#c49bff', width:2.0, label:'somma su m'}],
     xlabel:'theta', ylabel:'densita angolare'}],
   leggi:R`<p><b>Che cosa guardare.</b> $m=0$ è concentrato sui poli, con un minimo nullo all&rsquo;angolo magico $\cos^{2}\theta=\tfrac13$; $m=\pm2$ è concentrato sull&rsquo;equatore; $m=\pm1$ a metà strada, a $45$ gradi. La somma è una retta orizzontale.</p>
   <p><b>Che cosa impararne.</b> Nel limite classico un momento angolare $l$ con proiezione $m$ corrisponde a un&rsquo;orbita inclinata, e la densità angolare si sposta dai poli all&rsquo;equatore man mano che $|m|$ cresce verso $l$, cioè man mano che l&rsquo;orbita si porta nel piano $xy$. La somma isotropa dice che sommare su tutte le orientazioni ridà la sfera.</p>`},
  {t:'prosa', title:'Le convenzioni di fase', tag:'convenzioni', html:R`
  <p>Le armoniche sono definite a meno di una fase, e le fonti la fissano tutte con la stessa scelta, quella di Condon e Shortley, ma la scrivono in modi diversi. Ballentine scrive il fattore $(-1)^{(m+|m|)/2}$ davanti e sceglie la fase in modo che $Y_{l}^{-m}=(-1)^{m}(Y_{l}^{m})^{*}$. Griffiths mette un fattore $\epsilon=(-1)^{m}$ per $m\ge0$ e $\epsilon=1$ per $m\lt0$, e avverte che <i>«some older books use other conventions»</i>. Sakurai inserisce un $(-1)^{l}$ nella costante $c_{l}$ <i>«so that when we use the $L_{-}$ operator successively to reach the state $m=0$, we obtain $Y_{l}^{0}$ with the same sign as the Legendre polynomial $P_{l}(\cos\theta)$»</i>. Le tre scritture danno le stesse funzioni, e il segno meno davanti a $Y_{1}^{1}$ è la conseguenza visibile.</p>
  <p>In un esercizio la fase conta quando si scrive una funzione data in coordinate cartesiane nella base delle armoniche: $x=r\sin\theta\cos\phi$ è proporzionale a $Y_{1}^{-1}-Y_{1}^{1}$, non alla somma, e $y=r\sin\theta\sin\phi$ a $Y_{1}^{1}+Y_{1}^{-1}$ con un fattore $i$. Le probabilità di $L_{z}$ non cambiano, i coefficienti sì, e con essi i segni delle interferenze quando lo stato evolve.</p>`}
]},
/* ---------------- 05 · L EQUAZIONE RADIALE ---------------- */
{ num:'05', title:'L equazione radiale e il potenziale efficace', meta:'separare r dagli angoli · la funzione u = rR · un problema unidimensionale sulla semiretta · la barriera centrifuga · i livelli radiali non degeneri e il numero quantico radiale · il fondamentale è sempre s',
  blocchi:[
  {t:'reveal', title:'Dalla separazione all equazione per u', tag:'derivazione', steps:[
   {label:'La costante di separazione', body:R`
   <p>Griffiths scrive l&rsquo;equazione di Schrödinger in coordinate sferiche e cerca soluzioni $\psi=R(r)Y(\theta,\phi)$. Dividendo per $RY$ e moltiplicando per $-2mr^{2}/\hbar^{2}$, una parte dipende solo da $r$ e l&rsquo;altra solo dagli angoli, quindi ciascuna è costante, e Griffiths la scrive $l(l+1)$: <i>«note that there is no loss of generality here, at this stage $l$ could be any complex number. Later on we&rsquo;ll discover that $l$ must in fact be an integer, and it is in anticipation of that result that I express the separation constant in a way that looks peculiar now»</i>. La parte angolare è l&rsquo;equazione delle armoniche sferiche; quella radiale, nella forma di Sakurai, è</p>
   $$\Big[-\frac{\hbar^{2}}{2mr^{2}}\frac{d}{dr}\Big(r^{2}\frac{d}{dr}\Big)+\frac{l(l+1)\hbar^{2}}{2mr^{2}}+V(r)\Big]R_{El}(r)=E\,R_{El}(r).$$
   <p>Picasso nota che <i>«compaiono $E$ ed $l$, ma non $m$ (non si confonda il numero quantico $m$ con la massa!)»</i>: la funzione radiale dipende solo da $E$ e da $l$, e per ogni sua soluzione ci sono $2l+1$ stati indipendenti con la stessa energia.</p>`},
   {label:'La funzione radiale ridotta', body:R`
   <p>Con la <span class="str" data-str="cambio-di-variabile">sostituzione</span> $u(r)=rR(r)$, la derivata prima sparisce: $\frac{1}{r^{2}}\frac{d}{dr}\big(r^{2}\frac{dR}{dr}\big)=\frac1r\frac{d^{2}u}{dr^{2}}$, e l&rsquo;equazione diventa</p>
   $$-\frac{\hbar^{2}}{2m}\frac{d^{2}u}{dr^{2}}+\Big[V(r)+\frac{\hbar^{2}}{2m}\frac{l(l+1)}{r^{2}}\Big]u=E\,u .$$
   <p>Griffiths: <i>«this is called the radial equation; it is identical in form to the one-dimensional Schrödinger equation, except that the effective potential»</i> contiene un pezzo in più, <i>«the so-called centrifugal term»</i>, che <i>«tends to throw the particle outward (away from the origin), just like the centrifugal (pseudo-)force in classical mechanics»</i>. Anche la normalizzazione diventa unidimensionale: $\int|\psi|^{2}d^{3}r=\int_{0}^{\infty}|R|^{2}r^{2}dr=\int_{0}^{\infty}|u|^{2}dr$, con le armoniche normalizzate a parte. Sakurai ne trae la lettura: $u_{El}$ <i>«can be interpreted as a wave function in one dimension for a particle moving in an &lsquo;effective potential&rsquo;»</i>.</p>`},
   {label:'Le tre differenze dal caso unidimensionale', body:R`
   <p>Shankar le elenca: <i>«(1) The independent variable ($r$) goes from $0$ to $\infty$ and not from $-\infty$ to $\infty$. (2) In addition to the actual potential $V(r)$, there is the repulsive centrifugal barrier, $l(l+1)\hbar^{2}/2\mu r^{2}$, in all but the $l=0$ states. (3) The boundary conditions on $U$ are different from the one-dimensional case»</i>. La terza è il tema della tappa 06. Ballentine dice lo stesso in due punti: un potenziale efficace repulsivo proporzionale all&rsquo;autovalore di $L^{2}$, e la condizione $u(0)=0$.</p>`}
  ]},
  {t:'plot', title:'Il potenziale efficace',
   intro:R`<p>Potenziale efficace $V(r)+l(l+1)/2r^{2}$ per un potenziale attrattivo $V=-1/r$, in unità con $\hbar=m=1$: $l=0$ (blu), $l=1$ (arancio), $l=2$ (verde).</p>`,
   plots:[{kind:'func2d', xr:[0.05,14], yr:[-0.6,0.6], height:270, ticks:true,
     title:'potenziale efficace per V = -1/r',
     curves:[{f:'-1/x', col:'#5aa9ff', width:2.4, label:'l = 0'},
             {f:'-1/x+1/(x*x)', col:'#ffb86b', width:2.4, label:'l = 1'},
             {f:'-1/x+3/(x*x)', col:'#6bdc9b', width:2.4, label:'l = 2'}],
     xlabel:'r', ylabel:'V efficace'}],
   leggi:R`<p><b>Che cosa guardare.</b> Per $l=0$ il potenziale scende senza fondo verso l&rsquo;origine. Per $l\ge1$ la barriera centrifuga, che va come $1/r^{2}$, vince il potenziale coulombiano vicino all&rsquo;origine e crea un minimo in $r=l(l+1)$, di profondità $-1/2l(l+1)$: $r=2$ e $-\tfrac14$ per $l=1$, $r=6$ e $-\tfrac1{12}$ per $l=2$.</p>
   <p><b>Che cosa impararne.</b> Al crescere di $l$ la buca efficace si sposta in fuori e diventa meno profonda: gli stati con momento angolare grande stanno lontano dall&rsquo;origine e sono meno legati. È la versione quantistica dell&rsquo;orbita classica che, a energia fissata, ha un perielio più lontano se ha più momento angolare.</p>`},
  {t:'prosa', title:'Landau: che cosa segue dall essere unidimensionali', tag:'struttura', html:R`
  <p>Landau trae dalla riduzione a una dimensione tre conseguenze, che conviene conoscere perché sono domande d&rsquo;orale. La prima: <i>«nel moto unidimensionale in una regione semi-limitata i livelli energetici non sono degeneri»</i>, quindi l&rsquo;energia determina la funzione radiale, la parte angolare è fissata da $l$ e $m$, e <i>«l&rsquo;energia, il quadrato del momento angolare e la sua proiezione costituiscono insieme un sistema completo di grandezze fisiche»</i>.</p>
  <p>La seconda: vale il teorema dell&rsquo;oscillazione. Ordinando i livelli con un dato $l$ e numerandoli con $n_{r}=0,1,2,\dots$, il numero $n_{r}$ conta i nodi della funzione radiale a $r$ finito, esclusa l&rsquo;origine. Landau lo chiama numero quantico radiale, e ricorda i nomi degli altri due: <i>«il numero $l$ è chiamato talvolta numero quantico azimutale, e il numero $m$ numero quantico magnetico»</i>, con la notazione $s,p,d,f,g,\dots$ per $l=0,1,2,3,4,\dots$</p>
  <p>La terza: <i>«lo stato fondamentale per il moto di una particella in un campo a simmetria centrale è sempre lo stato $s$; infatti, per $l\ne0$, la parte angolare della funzione d&rsquo;onda ha in ogni caso dei nodi, mentre la funzione d&rsquo;onda dello stato fondamentale non ne deve avere nessuno»</i>. E, a $l$ fissato, il livello più basso cresce con $l$, perché il termine centrifugo è <i>«essenzialmente positivo»</i> e cresce con $l$: passare da $l$ a $l+1$ aggiunge a $l(l+1)$ la quantità $2(l+1)$, sempre positiva.</p>`},
  {t:'prosa', title:'Lontano dall origine', tag:'asintotica', html:R`
  <p>Se il potenziale va a zero all&rsquo;infinito, per $r$ grande l&rsquo;equazione radiale si riduce a quella della particella libera. Per uno stato legato, $E\lt0$, Sakurai scrive $u_{E}(r)\propto e^{-\kappa r}$ con $\kappa=\sqrt{-2mE}/\hbar$, e suggerisce di usare la variabile adimensionale $\rho=\kappa r$ togliendo a mano sia il comportamento all&rsquo;origine sia quello all&rsquo;infinito. Per $E\gt0$ la soluzione oscilla, e la particella è libera lontano dall&rsquo;origine.</p>
  <p>Shankar precisa una condizione che le altre fonti non scrivono: perché la soluzione si comporti davvero come un&rsquo;onda libera, non basta che il potenziale vada a zero, serve che $rV(r)\to0$. Scrivendo $u=f(r)e^{\pm ikr}$ e trascurando $f''$, si trova che $f$ tende a una costante se $V$ va a zero più in fretta di $1/r$; per il potenziale coulombiano, invece, $f$ contiene una fase che cresce come $\ln r$, e <i>«no matter how far away the particle is from the origin, it is never completely free of the Coulomb potential»</i>. È la ragione per cui lo scattering coulombiano richiede un trattamento a parte.</p>
  <p>Per gli stati legati, Shankar osserva anche che la condizione all&rsquo;origine è ciò che quantizza l&rsquo;energia: per $E\lt0$ arbitrario la soluzione che si annulla in $r=0$, continuata verso l&rsquo;esterno, contiene sia $e^{-\kappa r}$ sia $e^{\kappa r}$, e <i>«only for certain discrete values of $E$ will the $e^{\kappa r}$ piece be absent; these will be the allowed bound state levels»</i>.</p>`}
]},
/* ---------------- 06 · LA CONDIZIONE NELL ORIGINE ---------------- */
{ num:'06', title:'La condizione nell origine: u(0) = 0, giustificata in sei modi', meta:'il comportamento r alla l e r alla meno l meno uno · perché la normalizzabilità non basta per l = 0 · il dominio del laplaciano · l hermiticità · la delta nell origine · il flusso di probabilità · la probabilità di stare nel nucleo',
  blocchi:[
  {t:'prosa', title:'Le due soluzioni vicino all origine', tag:'analisi', html:R`
  <p>Vicino all&rsquo;origine, se il potenziale non è troppo singolare, il termine centrifugo domina. Landau lo dice con l&rsquo;ipotesi $\lim_{r\to0}U(r)r^{2}=0$ e cerca la soluzione radiale nella forma $R=\text{costante}\cdot r^{s}$: sostituendo e tenendo solo i termini dominanti si ottiene</p>
  $$s(s+1)=l(l+1),\qquad\text{da cui}\qquad s=l\quad\text{oppure}\quad s=-(l+1).$$
  <p>Sakurai fa lo stesso per $u=rR$, con soluzione generale $u\approx Ar^{l+1}+Br^{-l}$. La seconda soluzione va scartata, e tutte le fonti lo fanno; ma le ragioni che danno sono diverse, e il caso delicato è $l=0$. Per $l\ge1$ la soluzione irregolare non è nemmeno normalizzabile: $|R|^{2}r^{2}\sim r^{-2l}$, e $\int_{0}r^{-2l}dr$ diverge. Per $l=0$ invece $R\sim1/r$ dà $|R|^{2}r^{2}\sim1$, che si integra senza problemi. Griffiths lo ammette in nota: <i>«actually, all we require is that the wave function be normalizable, not that it be finite: $R(r)\sim1/r$ at the origin is normalizable (because of the $r^{2}$ in Equation 4.31). For a more compelling proof that $B=0$, see R. Shankar»</i>.</p>`},
  {t:'reveal', title:'Sei giustificazioni', tag:'fonti a confronto', steps:[
   {label:'Picasso: il dominio del laplaciano', body:R`
   <p>Le autofunzioni della hamiltoniana devono stare nel dominio dell&rsquo;operatore $\mathbf p^{2}$, che è proporzionale al laplaciano, e Picasso usa un risultato di analisi: <i>«si dimostra che le funzioni appartenenti al dominio dell&rsquo;operatore di Laplace (in dimensione $n\le3$) sono limitate; in particolare segue che le $R_{El}(r)$ devono essere finite per $r=0$ quindi, per la (11.10), le funzioni radiali ridotte $u_{El}(r)$ devono annullarsi per $r=0$»</i>. È l&rsquo;argomento più pulito dal punto di vista matematico: la condizione non si impone, segue dal fatto che la hamiltoniana è un operatore con un dominio preciso.</p>`},
   {label:'Landau: la funzione d’onda finita', body:R`
   <p>Landau: <i>«se l&rsquo;energia potenziale $U(r)$ è ovunque finita, finita deve essere allora in tutto lo spazio, compresa l&rsquo;origine delle coordinate, anche la funzione d&rsquo;onda $\psi$ e, di conseguenza, la sua parte radiale $R(r)$. Ne segue che $\chi(r)$ deve annullarsi per $r=0$»</i>, e aggiunge che la condizione <i>«in realtà vale anche per un campo che per $r\to0$ diventa infinito»</i>. Della soluzione con $s=-(l+1)$ dice semplicemente che <i>«non soddisfa le condizioni richieste; essa diventa infinita per $r=0$»</i>.</p>`},
   {label:'Ballentine: niente singolarità', body:R`
   <p>Ballentine impone $u(0)=0$ <i>«since $\Psi(r,\theta,\phi)$ would otherwise have an $r^{-1}$ singularity at the origin»</i>, e rimanda a un argomento generale del suo capitolo sulla rappresentazione delle coordinate per dire che una tale singolarità non è accettabile. È la forma più breve, che dà per acquisito ciò che Griffiths mette in dubbio.</p>`},
   {label:'Shankar: l’hermiticità, e la delta', body:R`
   <p>Shankar ragiona in due passi. Primo, l&rsquo;operatore radiale $D_{l}=-\frac{d^{2}}{dr^{2}}+\dots$ deve essere hermitiano sulle funzioni $U$ ammesse, e integrando per parti il termine di bordo in $r=0$ si annulla se $U(0)$ ha lo stesso valore $c$ per tutte. Secondo, se $c\ne0$ la funzione radiale va come $c/r$, <i>«this in itself is not a disqualification, for $R$ is still square integrable. The problem with $c\ne0$ is that the corresponding total wave function does not satisfy Schrödinger&rsquo;s equation at the origin»</i>, per la relazione</p>
   $$\nabla^{2}\frac1r=-4\pi\,\delta^{3}(\mathbf r).$$
