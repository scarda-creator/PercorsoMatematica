   <p>Il laplaciano di $1/r$ è zero ovunque tranne nell&rsquo;origine, dove il <span class="str" data-str="teorema-della-divergenza">teorema della divergenza</span> applicato a una sferetta dà un flusso di $\nabla(1/r)$ uguale a $4\pi r^{2}\cdot(-1/r^{2})=-4\pi$, indipendente dal raggio: è una <span class="str" data-str="delta-di-dirac">delta</span> di peso $-4\pi$. Una funzione che va come $1/r$ soddisfa l&rsquo;equazione di Schrödinger con un potenziale che contiene una delta nell&rsquo;origine, non con quello dato. <i>«Thus unless $V(r)$ contains a delta function at the origin (which we assume it does not) the choice $c\ne0$ is untenable»</i>. È l&rsquo;argomento che Griffiths chiama <i>«more compelling»</i>.</p>`},
   {label:'Sakurai: il flusso di probabilità', body:R`
   <p>Sakurai guarda la probabilità che esce da una sferetta attorno all&rsquo;origine. Se $R\to r^{l}$, la corrente radiale va come $r^{2l-1}$, e il flusso attraverso la sfera, $4\pi r^{2}j_{r}$, va come $r^{2l+1}\to0$. Se invece $R\to r^{-(l+1)}$, la corrente va come $r^{-2l-3}$ e il flusso come $r^{-2l-1}\to\infty$, <i>«even for $l=0$. Consequently, we must choose only $u(r)\propto r^{l+1}$ as a solution; otherwise, we would violate our probabilistic interpretation of the quantum-mechanical amplitude»</i>. L&rsquo;argomento conta le potenze di $r$ nell&rsquo;espressione $R\,dR/dr$ senza parti immaginarie, e va letto come un argomento di scala più che come un calcolo di corrente: per una funzione reale la corrente è zero.</p>`},
   {label:'Che cosa scegliere', body:R`
   <p>Le sei strade arrivano allo stesso posto. Per $l\ge1$ basta la normalizzabilità. Per $l=0$ servono argomenti più fini, e i due più solidi sono quello di Picasso, sul dominio del laplaciano, e quello di Shankar, sulla delta: tutti e due dicono che una soluzione $1/r$ non è un autostato della hamiltoniana data, ma di un&rsquo;altra con un termine concentrato nell&rsquo;origine. Che una $1/r$ possa descrivere qualcosa di fisico lo si vede proprio da qui: un potenziale di raggio molto piccolo e intensità grande, come quello fra due nucleoni visto da distanze grandi, si rappresenta con una condizione al contorno nell&rsquo;origine diversa da $u(0)=0$.</p>`}
  ]},
  {t:'plot', title:'Come la barriera svuota l origine',
   intro:R`<p>Andamento vicino all&rsquo;origine della densità di probabilità radiale $r^{2}|R|^{2}\propto r^{2l+2}$: $l=0$ (blu), $l=1$ (arancio), $l=2$ (verde).</p>`,
   plots:[{kind:'func2d', xr:[0,1.5], yr:[0,2.2], height:250, ticks:true,
     title:'densita radiale vicino a r = 0',
     curves:[{f:'x*x', col:'#5aa9ff', width:2.4, label:'l = 0: r^2'},
             {f:'Math.pow(x,4)', col:'#ffb86b', width:2.4, label:'l = 1: r^4'},
             {f:'Math.pow(x,6)', col:'#6bdc9b', width:2.4, label:'l = 2: r^6'}],
     xlabel:'r (unita arbitrarie)', ylabel:'r^2 |R|^2'}],
   leggi:R`<p><b>Che cosa guardare.</b> Sotto $r=1$ le curve si separano tanto più quanto più $l$ è grande. Landau: la probabilità di trovarsi fra $r$ e $r+dr$ è proporzionale a $r^{2(l+1)}$, e <i>«si annulla nell&rsquo;origine delle coordinate tanto più rapidamente quanto più grande è il valore di $l$»</i>.</p>
   <p><b>Che cosa impararne.</b> Solo gli stati $s$ hanno $R(0)\ne0$: Shankar nota che, anche se $u_{0}(0)=0$, una particella in uno stato $s$ <i>«has a nonzero amplitude to be at the origin, since $R_{0}(r)=U_{0}(r)/r\ne0$ at $r=0$»</i>. Sakurai ne dà la conseguenza atomica: la probabilità che un elettrone si trovi dentro un nucleo di raggio $R$ va come $(R/a_{0})^{2l}$. Con $R\approx1$ fm e $a_{0}\approx5{,}29\times10^{4}$ fm, il fattore per $l=1$ rispetto a $l=0$ è circa $3{,}6\times10^{-10}$: gli effetti del nucleo sui livelli atomici riguardano quasi solo gli stati $s$.</p>`}
]},
/* ---------------- 07 · PARTICELLA LIBERA E BUCA SFERICA INFINITA ---------------- */
{ num:'07', title:'La particella libera in coordinate sferiche, e la buca sferica infinita', meta:'le funzioni di Bessel sferiche · le regolari e le irregolari · l onda piana come somma di onde sferiche · la buca infinita: zeri al posto di multipli di pi · nessuna degenerazione in l · un errore di stampa trovato facendo il conto',
  blocchi:[
  {t:'prosa', title:'L equazione radiale senza potenziale', tag:'particella libera', html:R`
  <p>Una particella libera si può descrivere con onde piane, e lo si è sempre fatto; ma si può anche cercare un insieme di stati con energia, $l$ e $m$ definiti. Sakurai: <i>«we can of course approach the same problem by exploiting spherical symmetry and angular momentum»</i>. Con $E=\hbar^{2}k^{2}/2m$ e la variabile $\rho=kr$, l&rsquo;equazione radiale diventa</p>
  $$\frac{d^{2}R}{d\rho^{2}}+\frac{2}{\rho}\frac{dR}{d\rho}+\Big[1-\frac{l(l+1)}{\rho^{2}}\Big]R=0,$$
  <p>le cui soluzioni sono le funzioni di Bessel sferiche $j_{l}(\rho)$ e di Neumann sferiche $n_{l}(\rho)$, date dalle formule di Rayleigh</p>
  $$j_{l}(\rho)=(-\rho)^{l}\Big(\frac{1}{\rho}\frac{d}{d\rho}\Big)^{l}\frac{\sin\rho}{\rho},\qquad n_{l}(\rho)=-(-\rho)^{l}\Big(\frac{1}{\rho}\frac{d}{d\rho}\Big)^{l}\frac{\cos\rho}{\rho}.$$
  <p>Le prime sono</p>
  $$j_{0}=\frac{\sin\rho}{\rho},\qquad j_{1}=\frac{\sin\rho}{\rho^{2}}-\frac{\cos\rho}{\rho},\qquad j_{2}=\Big(\frac{3}{\rho^{3}}-\frac1\rho\Big)\sin\rho-\frac{3\cos\rho}{\rho^{2}} .$$
  <p>Vicino all&rsquo;origine $j_{l}(\rho)\to\rho^{l}/(2l+1)!!$, con $j_{1}/\rho\to\tfrac13$ e $j_{2}/\rho^{2}\to\tfrac1{15}$, mentre $n_{l}$ diverge come $\rho^{-(l+1)}$: per $l=0$, $\rho\,n_{0}\to-1$. Sakurai conclude che <i>«$j_{l}(\rho)$ corresponds to (3.7.14) and these are the only solutions we consider here»</i>, e in nota avverte che quando l&rsquo;origine è esclusa, come nello scattering da una sfera dura, si tengono anche le $n_{l}$, <i>«the relative phase between the two solutions for a given $l$ is called the phase shift»</i>.</p>`},
  {t:'reveal', title:'Tre modi di generare le funzioni di Bessel sferiche', tag:'fonti', steps:[
   {label:'Landau: una ricorrenza', body:R`
   <p>Landau pone $R_{kl}=r^{l}\chi_{kl}$, deriva l&rsquo;equazione per $\chi$ e scopre che $\frac1r\chi'_{kl}$ soddisfa l&rsquo;equazione per $\chi_{k,l+1}$: <i>«pertanto le funzioni $\chi_{kl}$ sono legate in successione»</i> da $\chi_{k,l+1}=\frac1r\chi'_{kl}$. Partendo da $R_{k0}\propto\sin kr/r$, regolare nell&rsquo;origine, si ottengono tutte le altre: è la formula di Rayleigh.</p>`},
   {label:'Shankar: un operatore di salita in l', body:R`
   <p>Shankar osserva che l&rsquo;equazione radiale libera <i>«looks a lot like the harmonic oscillator except for the fact that we have a potential $1/\rho^{2}$ instead of $\rho^{2}$»</i>, e definisce operatori analoghi a quelli di salita e discesa, che portano la soluzione con $l$ in quella con $l+1$; la sua analisi è, dichiaratamente, una versione semplificata del lavoro di Infeld. È la stessa ricorrenza di Landau, scritta come algebra.</p>`},
   {label:'Sakurai e Picasso: un integrale, e l’onda piana', body:R`
   <p>Sakurai dà la rappresentazione integrale</p>
   $$j_{l}(z)=\frac{1}{2i^{l}}\int_{-1}^{1}e^{izs}P_{l}(s)\,ds,$$
   <p>che per $l=1$ si verifica direttamente. È la stessa formula che dà lo sviluppo dell&rsquo;onda piana in onde sferiche, che Picasso scrive, con l&rsquo;asse polare lungo $\mathbf k$, come</p>
   $$e^{i\mathbf k\cdot\mathbf r}=\sum_{l=0}^{\infty}i^{l}\sqrt{4\pi(2l+1)}\;j_{l}(kr)\,Y_{l}^{0}(\theta):$$
   <p>proiettando l&rsquo;onda piana su $Y_{l}^{0}$ e integrando su $\phi$ resta proprio l&rsquo;integrale di Sakurai. Picasso commenta che <i>«$j_{l}(kr)Y_{l0}(\theta)$ sono autofunzioni simultanee di $H_{0}$, $L^{2}$, $L_{z}$»</i>, e che lo sviluppo <i>«è noto come lo sviluppo in onde parziali dell&rsquo;onda piana»</i>: un&rsquo;onda piana, che ha impulso definito, non ha momento angolare definito, e contiene tutti gli $l$.</p>`}
  ]},
  {t:'plot', title:'Le prime funzioni di Bessel sferiche',
   intro:R`<p>$j_{0}$ (blu), $j_{1}$ (arancio), $j_{2}$ (verde) in funzione di $\rho=kr$.</p>`,
   plots:[{kind:'func2d', xr:[0.01,15], yr:[-0.35,1.05], height:270, ticks:true,
     title:'funzioni di Bessel sferiche j0, j1, j2',
     curves:[{f:'Math.sin(x)/x', col:'#5aa9ff', width:2.4, label:'j0'},
             {f:'Math.sin(x)/(x*x)-Math.cos(x)/x', col:'#ffb86b', width:2.4, label:'j1'},
             {f:'(3/(x*x*x)-1/x)*Math.sin(x)-3*Math.cos(x)/(x*x)', col:'#6bdc9b', width:2.4, label:'j2'}],
     xlabel:'rho = k r', ylabel:'j_l'}],
   leggi:R`<p><b>Che cosa guardare.</b> Solo $j_{0}$ è diversa da zero nell&rsquo;origine. Le altre partono come $\rho^{l}$ e restano piccole finché $\rho$ non supera all&rsquo;incirca $l$: è la barriera centrifuga, che tiene la particella lontana dall&rsquo;origine. Per $\rho$ grande tutte oscillano come $\sin(\rho-l\pi/2)/\rho$, con lo stesso inviluppo $1/\rho$.</p>
   <p><b>Che cosa impararne.</b> Il primo zero di $j_{l}$ si sposta verso destra al crescere di $l$: $\pi$, $4{,}49$, $5{,}76$. È lo stesso fatto letto in un altro modo, e decide l&rsquo;ordine dei livelli nella buca sferica.</p>`},
  {t:'reveal', title:'La buca sferica infinita', tag:'esempio', steps:[
   {label:'La condizione di quantizzazione', body:R`
   <p>Una particella chiusa in una sfera di raggio $a$ con pareti impenetrabili: dentro la soluzione regolare è $R=A\,j_{l}(kr)$, e la condizione $R(a)=0$ dà, per ogni $l$, <i>«the &lsquo;quantization condition&rsquo; $j_{l}(ka)=0$; that is, $ka$ equals the set of zeros of the spherical Bessel function»</i>. Per $l=0$ gli zeri sono $ka=n\pi$, e le energie sono quelle della buca unidimensionale,</p>
   $$E_{n0}=\frac{\hbar^{2}\pi^{2}n^{2}}{2ma^{2}},$$
   <p>come nota Griffiths, con la funzione d&rsquo;onda normalizzata $\psi_{n00}=\frac{1}{\sqrt{2\pi a}}\frac{\sin(n\pi r/a)}{r}$. Per gli altri $l$ gli zeri <i>«are not located at nice sensible points (such as $n$, or $n\pi$, or something); they have to be computed numerically»</i>.</p>`},
   {label:'Gli zeri, e un errore di stampa', body:R`
   <p>Calcolati con un metodo numerico, i primi tre zeri di $j_{1}$ sono $4{,}493$, $7{,}725$, $10{,}904$, e quelli di $j_{2}$ sono $5{,}763$, $9{,}095$, $12{,}323$; il primo zero di $j_{3}$ è $6{,}988$. Sakurai riporta per $l=1$ i valori $4{,}49$, $7{,}73$, $10{,}90$, che coincidono, ma per $l=2$, nel testo estratto della seconda edizione, si legge $5{,}84$, $8{,}96$, $12{,}25$, che non coincidono con gli zeri di $j_{2}$. La differenza non è di arrotondamento: il primo valore sbaglia di più dell&rsquo;uno per cento. Si usino i valori calcolati.</p>`},
   {label:'L’ordine dei livelli, e nessuna degenerazione in l', body:R`
   <p>In unità di $\hbar^{2}/2ma^{2}$ le energie sono i quadrati degli zeri. In ordine: $1s$ a $\pi^{2}\approx9{,}87$, $1p$ a $4{,}493^{2}\approx20{,}19$, $1d$ a $5{,}763^{2}\approx33{,}22$, $2s$ a $(2\pi)^{2}\approx39{,}48$, $1f$ a $6{,}988^{2}\approx48{,}83$, $2p$ a $7{,}725^{2}\approx59{,}68$. Qui $n$ conta gli zeri di ciascun $l$, non è un numero quantico principale. Ogni livello è degenere $2l+1$ volte e basta: Sakurai osserva che <i>«this series of energy levels shows no degeneracies in $l$»</i>, a differenza dell&rsquo;oscillatore. La sequenza $1s,1p,1d,2s,1f,2p$ è quella della colonna «infinite square well» nella figura del modello a strati nucleare che Sakurai riproduce da Haxel, Jensen e Suess.</p>`}
  ]}
]},
/* ---------------- 08 · LA BUCA SFERICA FINITA ---------------- */
{ num:'08', title:'La buca sferica finita: in tre dimensioni uno stato legato può non esserci', meta:'gli stati s come gli stati dispari della buca unidimensionale · la soluzione grafica di Ballentine · la soglia di profondità · il raggio che diverge alla soglia e gli stati alone · lo spettro continuo sopra zero',
  blocchi:[
  {t:'prosa', title:'Il problema', tag:'impostazione', html:R`
  <p>Il potenziale è $V=-V_{0}$ per $r\lt a$ e $V=0$ per $r\gt a$. Picasso lo chiama <i>«buca sferica»</i> e osserva subito il legame con una dimensione: per $l=0$ il potenziale centrifugo è assente, e il problema <i>«è identico al problema della buca unidimensionale [...] relativamente ai soli stati dispari: infatti la (11.11) (con $l=0$) e la condizione (11.12) impongono che la funzione radiale ridotta $u_{E0}(r)$ per $0\lt r\lt a$ sia $A\sin kr$ (anziché una combinazione di $\sin kr$ e $\cos kr$), come per gli stati dispari della buca unidimensionale»</i>. La condizione $u(0)=0$ è la stessa che, in una buca simmetrica in una dimensione, hanno le funzioni dispari nel centro.</p>
  <p>Il fondamentale, se c&rsquo;è, è uno stato $s$, perché il potenziale centrifugo è positivo e alza le energie. E qui sta la differenza: <i>«contrariamente al caso unidimensionale nel quale uno stato legato esiste sempre, in questo caso, nel quale lo stato fondamentale è il primo stato dispari del problema unidimensionale, il sistema ammette uno stato legato se e solo se»</i> la buca è abbastanza profonda e larga.</p>`},
  {t:'reveal', title:'La soluzione, con Ballentine', tag:'derivazione', steps:[
   {label:'Dentro e fuori', body:R`
   <p>Ballentine scrive la soluzione con $l=0$ dentro e fuori. Dentro, con $\hbar^{2}k^{2}/2M=E+V_{0}$, solo $\sin kr$ si annulla nell&rsquo;origine:</p>
   $$u(r)=N\,\frac{\sin(kr)}{\sin(ka)},\quad r\le a;\qquad u(r)=N\,e^{-\alpha(r-a)},\quad r\ge a,$$
   <p>con $\hbar^{2}\alpha^{2}/2M=-E$ per uno stato legato. Il denominatore $\sin(ka)$ serve solo a far coincidere le due espressioni in $r=a$. La continuità della derivata logaritmica $u'/u$, che non dipende dalla normalizzazione, dà</p>
   $$\alpha=-\frac{k}{\tan(ka)},$$
   <p>e la relazione fra $k$ e $\alpha$ data dall&rsquo;energia è</p>
   $$\alpha=\sqrt{\frac{2MV_{0}}{\hbar^{2}}-k^{2}} .$$`},
   {label:'La soluzione grafica, e la soglia', body:R`
   <p>Le due espressioni di $\alpha$ si eguagliano graficamente. Nel piano $(k,\alpha)$ la seconda è un quarto di circonferenza di raggio $\sqrt{2MV_{0}}/\hbar$, la prima una curva che parte da $\alpha\lt0$, diventa positiva per $ka\gt\pi/2$ e diverge a $ka=\pi$, e così via a ogni multiplo di $\pi$. Ballentine: <i>«if $V_{0}$ is smaller than $(\hbar^{2}/2Ma^{2})(\pi/2)^{2}$, as in case (a), the two curves do not intersect, and no bound state solution exists»</i>; fra $(\pi/2)^{2}$ e $(3\pi/2)^{2}$, in quelle unità, c&rsquo;è un&rsquo;intersezione e un solo stato legato; fra $(3\pi/2)^{2}$ e $(5\pi/2)^{2}$ due; <i>«it is clear that as $V_{0}$ increases, the number of bound states increases without limit»</i>.</p>
   <p>La soglia è quella di Picasso: uno stato legato esiste se e solo se $2MV_{0}a^{2}/\hbar^{2}\gt\pi^{2}/4$. In una dimensione la buca più debole ha sempre uno stato legato pari, che qui manca perché la condizione nell&rsquo;origine esclude il coseno.</p>`},
   {label:'I tre casi di Ballentine, con i numeri', body:R`
   <p>Con le unità di Ballentine, $\hbar=2M=a=1$, l&rsquo;energia è $k^{2}-V_{0}$ e la soglia è $V_{0}=(\pi/2)^{2}\approx2{,}47$. Per $V_{0}=1$ non c&rsquo;è nessuno stato legato. Per $V_{0}=5$ c&rsquo;è un solo stato, con $k\approx2{,}017$ ed energia $\approx-0{,}931$. Per $V_{0}=25$, sopra la seconda soglia $(3\pi/2)^{2}\approx22{,}2$ e sotto la terza $(5\pi/2)^{2}\approx61{,}7$, ce ne sono due: $k\approx2{,}596$ con energia $\approx-18{,}26$ e $k\approx4{,}906$ con energia $\approx-0{,}928$.</p>`}
  ]},
  {t:'plot', title:'La soluzione grafica',
   intro:R`<p>In unità $\hbar=2M=a=1$, in funzione di $k$: la curva $\alpha=-k/\tan k$ (blu) e i quarti di circonferenza $\alpha=\sqrt{V_{0}-k^{2}}$ per $V_{0}=1$ (arancio), $V_{0}=5$ (verde), $V_{0}=25$ (viola). Le intersezioni sono gli stati legati.</p>`,
   plots:[{kind:'func2d', xr:[0,5.2], yr:[0,5.5], height:290, ticks:true,
     title:'buca sferica: condizione per gli stati legati con l = 0',
     curves:[{f:'-x/Math.tan(x)', col:'#5aa9ff', width:2.4, label:'alpha = -k cot k'},
             {f:'Math.sqrt(1-x*x)', col:'#ffb86b', width:2.0, label:'V0 = 1'},
             {f:'Math.sqrt(5-x*x)', col:'#6bdc9b', width:2.0, label:'V0 = 5'},
             {f:'Math.sqrt(25-x*x)', col:'#c49bff', width:2.0, label:'V0 = 25'}],
     xlabel:'k a', ylabel:'alpha a'}],
   leggi:R`<p><b>Che cosa guardare.</b> La curva blu è negativa per $k\lt\pi/2$ e quindi non compare nel quadrante: il quarto di cerchio arancione, di raggio $1\lt\pi/2$, non la incontra mai. Il verde la incontra una volta, il viola due, una per ciascun ramo della curva blu fra $\pi/2$ e $\pi$ e fra $3\pi/2$ e $2\pi$.</p>
   <p><b>Che cosa impararne.</b> È la stessa costruzione della buca unidimensionale, con un ramo in meno: in una dimensione c&rsquo;è anche il ramo $\alpha=k\tan k$ degli stati pari, che parte da zero e incontra qualunque cerchio, anche piccolissimo. In tre dimensioni quel ramo non c&rsquo;è, e per legare una particella serve una buca di «area» $V_{0}a^{2}$ abbastanza grande.</p>`},
  {t:'prosa', title:'Alla soglia, lo stato si allarga', tag:'fisica', html:R`
  <p>Ballentine segue lo stato legato mentre la profondità scende verso la soglia. Per $V_{0}$ grande lo stato è quasi tutto dentro la buca; avvicinandosi alla soglia, la coda esponenziale fuori si allunga, perché $\alpha\to0$, e il raggio quadratico medio <i>«diverges rapidly as $V_{0}$ approaches the critical value of $(\hbar^{2}/2Ma^{2})(\pi/2)^{2}$»</i>. Lontano dalla soglia invece il raggio <i>«is insensitive to $V_{0}$ over a large range because the exponential tail contributes very little»</i>. La lunghezza della coda è $1/\alpha$, e alla soglia $\alpha$ tende a zero linearmente nella distanza dalla soglia: nelle unità di Ballentine, con $V_{0}$ di $0{,}01$ sopra il valore critico si trova $\alpha\approx0{,}0050$, con $0{,}02$ sopra $\alpha\approx0{,}0100$. L&rsquo;energia di legame, $\alpha^{2}$, va quindi a zero come il quadrato della distanza dalla soglia, e il raggio come il suo inverso.</p>
  <p>Ballentine collega questi stati debolmente legati e molto estesi a un fenomeno osservato: <i>«these loosely bound large-radius states occur in nuclei, where they are called halo states»</i>. In nuclei come il berillio 11 un neutrone è legato debolmente a un nocciolo compatto, e la densità nucleare ha una coda che cala lentamente invece di finire bruscamente al raggio nucleare.</p>
  <p>Sopra lo zero, per $E\gt0$, la soluzione esterna è una combinazione di $\sin kr$ e $\cos kr$ con due coefficienti liberi, e il raccordo si può fare per qualunque energia: lo <span class="str" data-str="spettro">spettro</span> è continuo. Ballentine lo spiega con la condizione all&rsquo;infinito: per $E\lt0$ la soluzione $e^{\alpha r}$ è esclusa perché cresce troppo, e questo vincolo in più seleziona energie discrete; per $E\gt0$ <i>«both terms are acceptable, and neither $A$ nor $B$ needs to be eliminated»</i>.</p>`}
]},
/* ---------------- 09 · L OSCILLATORE ISOTROPO IN COORDINATE SFERICHE ---------------- */
{ num:'09', title:'L oscillatore isotropo in coordinate sferiche, e il confronto con la soluzione cartesiana', meta:'la serie di Sakurai e la sua terminazione · E = (2q + l + 3/2) hbar omega · i polinomi di Laguerre delle note del corso, e una variabile da correggere · la degenerazione contata in due modi · la tavola d esame · i gusci del modello a strati',
  blocchi:[
  {t:'reveal', title:'La soluzione con la serie', tag:'derivazione', steps:[
   {label:'Togliere i due comportamenti estremi', body:R`
   <p>Sakurai pone $E=\tfrac12\hbar\omega\lambda$ e $\rho=\sqrt{m\omega/\hbar}\,r$, e l&rsquo;equazione per la funzione radiale ridotta diventa</p>
   $$\frac{d^{2}u}{d\rho^{2}}-\frac{l(l+1)}{\rho^{2}}u+(\lambda-\rho^{2})u=0 .$$
   <p>Vicino all&rsquo;origine $u\sim\rho^{l+1}$, lontano $u\sim e^{-\rho^{2}/2}$; il potenziale non va a zero all&rsquo;infinito, quindi il comportamento asintotico è gaussiano e non esponenziale. Con $u=\rho^{l+1}e^{-\rho^{2}/2}f(\rho)$, l&rsquo;equazione per $f$ è</p>
   $$\rho\frac{d^{2}f}{d\rho^{2}}+2\big[(l+1)-\rho^{2}\big]\frac{df}{d\rho}+\big[\lambda-(2l+3)\big]\rho f=0 .$$`},
   {label:'La ricorrenza, e perché deve fermarsi', body:R`
   <p>Sostituendo una <span class="str" data-str="serie-di-potenze">serie di potenze</span> $f=\sum a_{n}\rho^{n}$, il termine in $\rho^{0}$ dà $a_{1}=0$, e gli altri danno la ricorrenza</p>
   $$a_{n+2}=\frac{2n+2l+3-\lambda}{(n+2)(n+2l+3)}\,a_{n}.$$
   <p>Quindi compaiono solo potenze pari. Per $n$ grande $a_{n+2}/a_{n}\to2/n$, che è il rapporto dei coefficienti della serie di $e^{\rho^{2}}$: se la serie non si ferma, $u$ cresce come $e^{\rho^{2}/2}$ e non è normalizzabile. Deve fermarsi, e questo succede se il numeratore si annulla per qualche $n=2q$ pari: $\lambda=4q+2l+3$, cioè</p>
   $$E_{ql}=\Big(2q+l+\frac32\Big)\hbar\omega=\Big(N+\frac32\Big)\hbar\omega,\qquad N=2q+l .$$
   <p>Sakurai chiama $N$ il numero quantico «principale» e nota che <i>«it can be shown that $q$ counts the number of nodes in the radial function»</i>. Il controllo diretto: per $l=0$ e $q=1$ la serie si ferma a $f=a_{0}\big(1-\tfrac23\rho^{2}\big)$, e $u=\rho\big(1-\tfrac23\rho^{2}\big)e^{-\rho^{2}/2}$ risolve l&rsquo;equazione con $\lambda=7$, cioè $E=\tfrac72\hbar\omega$.</p>`},
   {label:'La versione delle note del corso, e una variabile da correggere', body:R`
   <p>Le note di Martinelli fanno lo stesso con $R(\xi)=\xi^{l}H_{l}(\xi)e^{-\xi^{2}/2}$, dove $H_{l}$ è un polinomio pari, e passano a una nuova variabile $t$ per ottenere l&rsquo;equazione di Laguerre</p>
   $$t\frac{d^{2}H_{l}}{dt^{2}}+\Big[\Big(l+\frac32\Big)-t\Big]\frac{dH_{l}}{dt}+\frac14(\epsilon-3-2l)H_{l}=0,$$
   <p>che ha soluzioni polinomiali, i <span class="str" data-str="polinomi-di-laguerre">polinomi di Laguerre</span> generalizzati $L^{(l+1/2)}_{(n-l)/2}$, per $\epsilon=3+2n$ con $n\ge l$ e $n-l$ pari. Facendo il conto, questa equazione segue dalla (45) delle note con $t=\xi^{2}$. Nel testo estratto delle note si legge invece $t=\xi^{2}/2$; con quella scelta l&rsquo;equazione diventa $tH''+[(l+\tfrac32)-2t]H'+\tfrac12(\epsilon-3-2l)H=0$, che non è nella forma di Laguerre. Le relazioni fra derivate scritte subito prima sono a loro volta in parte dell&rsquo;una e in parte dell&rsquo;altra convenzione. Il risultato finale delle note, le funzioni $L^{(l+1/2)}_{(n-l)/2}(\xi^{2})$, è quello giusto, con l&rsquo;argomento $\xi^{2}$.</p>`}
  ]},
  {t:'plot', title:'Il potenziale efficace dell oscillatore e i primi livelli',
   intro:R`<p>In unità di $\tfrac12\hbar\omega$, il potenziale efficace $\rho^{2}+l(l+1)/\rho^{2}$ per $l=0$ (blu), $l=1$ (arancio), $l=2$ (verde), e i livelli $\lambda=3$, $5$, $7$ (righe sottili): $\lambda=3$ solo per $l=0$, $\lambda=5$ solo per $l=1$, $\lambda=7$ per $l=0$ con un nodo e per $l=2$.</p>`,
   plots:[{kind:'func2d', xr:[0.05,4], yr:[0,12], height:280, ticks:true,
     title:'oscillatore isotropo: potenziale efficace e livelli',
     curves:[{f:'x*x', col:'#5aa9ff', width:2.4, label:'l = 0'},
             {f:'x*x+2/(x*x)', col:'#ffb86b', width:2.4, label:'l = 1'},
             {f:'x*x+6/(x*x)', col:'#6bdc9b', width:2.4, label:'l = 2'},
             {f:'3', col:'#c49bff', width:1.0, label:'lambda = 3, 5, 7'},
             {f:'5', col:'#c49bff', width:1.0, label:''},
             {f:'7', col:'#c49bff', width:1.0, label:''}],
     xlabel:'rho', ylabel:'2 V eff / hbar omega'}],
   leggi:R`<p><b>Che cosa guardare.</b> Il minimo del potenziale efficace per $l$ dato sta in $\rho^{2}=\sqrt{l(l+1)}$ e vale $2\sqrt{l(l+1)}$: circa $2{,}83$ per $l=1$ e $4{,}90$ per $l=2$. Il livello più basso di ogni $l$ sta sopra il minimo, a $\lambda=2l+3$: $5$ per $l=1$, $7$ per $l=2$.</p>
   <p><b>Che cosa impararne.</b> La riga $\lambda=7$ taglia due buche diverse: quella con $l=0$, dove lo stato ha un nodo radiale, e quella con $l=2$, dove non ne ha. Due problemi unidimensionali diversi danno la stessa energia: è la degenerazione «in $l$» dell&rsquo;oscillatore, che nella soluzione sferica appare come una coincidenza e nella soluzione cartesiana come ovvia.</p>`},
  {t:'reveal', title:'Due conti, stesso spettro', tag:'confronto', steps:[
   {label:'La degenerazione contata con l', body:R`
   <p>Il livello $N$ contiene i valori di $l$ con la parità di $N$, da $N$ in giù: $l=N,N-2,\dots$ fino a $1$ o $0$, ciascuno con $q=(N-l)/2$ e con $2l+1$ stati. Sakurai: <i>«there are three states (all $l=1$) for $N=1$. For $N=2$ there are five states with $l=2$, plus one state with $q=1$ and $l=0$, giving a total of six. Notice that for even (odd) values of $N$, only even (odd) values of $l$ are allowed»</i>. Sommando $2l+1$ su questi valori si ottiene, per $N=3$, $7+3=10$, e per $N=4$, $9+5+1=15$.</p>`},
   {label:'La degenerazione contata con tre numeri', body:R`
   <p>Nella soluzione cartesiana il livello $N$ ha tanti stati quante sono le terne $(n_{x},n_{y},n_{z})$ di somma $N$, cioè $(N+1)(N+2)/2$: $1,3,6,10,15$. I due conteggi coincidono per ogni $N$. Sakurai lascia la verifica generale come esercizio, <i>«it is simple to show numerically that for the first few energy levels, the degeneracy is the same regardless of which basis is used. It is an interesting exercise to show this in general, and also to derive the unitary transformation matrix $\langle n_{x},n_{y},n_{z}|qlm\rangle$ that changes from one basis to the other»</i>. La dimostrazione generale è la somma $\sum_{j=0}^{k}(4j+1)=(2k+1)(k+1)$ per $N=2k$, e l&rsquo;analoga per $N$ dispari, $\sum_{j=0}^{k}(4j+3)=(k+1)(2k+3)$ per $N=2k+1$.</p>`},
   {label:'Perché ci sono due soluzioni', body:R`
   <p>Sakurai osserva che la hamiltoniana si può scrivere come somma di tre oscillatori $H_{i}=\hbar\omega(a_{i}^{\dagger}a_{i}+\tfrac12)$, e allora gli autostati si etichettano $|n_{x},n_{y},n_{z}\rangle$; oppure come problema centrale, con $|q\,l\,m\rangle$. Le due basi diagonalizzano due insiemi diversi di operatori che commutano con $H$: $(H_{x},H_{y},H_{z})$ nel primo caso, $(H,L^{2},L_{z})$ nel secondo. Che un problema si possa separare in due sistemi di coordinate diversi è il segno di una simmetria più grande di quella per rotazioni, e la degenerazione fra $l$ diversi ne è la conseguenza. Una buca sferica, che si separa solo in coordinate sferiche, non ha questa degenerazione.</p>`}
  ]},
  {t:'prosa', title:'La tavola d esame, e i gusci', tag:'esame', html:R`
  <p>Il compito del 28-01-2014, il cui testo compare anche in testa alla raccolta 2015-2019, dà in fondo la tavola delle <i>«autofunzioni normalizzate $\varphi_{k,l,m}$ dell&rsquo;oscillatore isotropo tridimensionale»</i>, con $\beta=\sqrt{m\omega/\hbar}$ e la convenzione <i>«$k=n-l$, $n$ è il numero quantico principale [$E_{n}=(n+3/2)\hbar\omega$]»</i>:</p>
  $$\varphi_{0,0,0}=\frac{2\beta^{3/2}}{\pi^{1/4}}e^{-\beta^{2}r^{2}/2}Y_{0}^{0},\qquad \varphi_{0,1,m}=\sqrt{\frac83}\frac{\beta^{3/2}}{\pi^{1/4}}\,\beta r\,e^{-\beta^{2}r^{2}/2}Y_{1}^{m},$$
  $$\varphi_{0,2,m}=\sqrt{\frac{16}{15}}\frac{\beta^{3/2}}{\pi^{1/4}}\,\beta^{2}r^{2}e^{-\beta^{2}r^{2}/2}Y_{2}^{m},\qquad \varphi_{2,0,0}=\frac{\sqrt6\,\beta^{3/2}}{\pi^{1/4}}\Big(1-\frac23\beta^{2}r^{2}\Big)e^{-\beta^{2}r^{2}/2}Y_{0}^{0}.$$
  <p>Le costanti si controllano con gli integrali gaussiani dei momenti, e sono quelle giuste. Si noti che qui $k=n-l=2q$ non è il numero di nodi $q$, ma il suo doppio: $\varphi_{2,0,0}$ ha un nodo, in $\beta^{2}r^{2}=\tfrac32$, ed è lo stato con $n=2$, $l=0$. La parte polinomiale di $\varphi_{2,0,0}$ è la stessa trovata con la serie, $1-\tfrac23\rho^{2}$.</p>
  <p>Sakurai chiude la sezione con l&rsquo;uso più importante di queste funzioni, il modello a strati del nucleo, in cui protoni e neutroni si muovono in un potenziale medio. Con due stati di spin per ciascuno stato orbitale, i livelli dell&rsquo;oscillatore si riempiono con $2,6,12,20,30,\dots$ particelle, e i gusci completi cadono a $2,8,20,40,70$. I primi tre sono numeri magici osservati; i successivi osservati, $28,50,82,126$, si ottengono solo aggiungendo l&rsquo;interazione spin-orbita, ed è quello che mostra la figura del modello a strati di Sakurai, dalla colonna dell&rsquo;oscillatore a quella con l&rsquo;accoppiamento spin-orbita.</p>`}
]},
/* ---------------- 10 · COMPITO DEL 28-01-2014 ---------------- */
{ num:'10', title:'Un compito intero: l oscillatore isotropo con lo spin orbita (28-01-2014)', meta:'esame del 28 gennaio 2014 · quali funzioni d onda sono autostati · il periodo di ritorno · Sx che resta a un mezzo · il fondamentale, e una condizione del testo che non basta · lo stato con L quadro fissato',
  blocchi:[
  {t:'prosa', title:'Il testo', tag:'esame', html:R`
  <p>Una particella di massa $m$ e spin $\tfrac12$ in tre dimensioni, con</p>
  $$H=\frac{\mathbf p^{2}}{2m}+\frac{m\omega^{2}r^{2}}{2}+\alpha\Big(\frac{\mathbf L\cdot\mathbf S}{\hbar^{2}}+\frac{J_{z}}{\hbar}\Big),\qquad0\lt\alpha\lt\hbar\omega,\quad\mathbf J=\mathbf L+\mathbf S .$$
  <p>Le funzioni d&rsquo;onda proposte, con $\beta=\sqrt{m\omega/\hbar}$, sono $\Psi_{1}=N_{1}\,r\,e^{-\beta^{2}r^{2}/2}Y_{1}^{-1}\chi_{+}$, $\Psi_{2}=N_{2}\,r\,e^{-\beta^{2}r^{2}/2}Y_{1}^{1}\chi_{+}$, $\Psi_{3}=N_{3}\,e^{-\beta^{2}r^{2}/2}\chi_{+}$. Il testo chiede (1a) quali sono autofunzioni, (1b) per quali lo stato cambia nel tempo, (1c) il tempo di ritorno nello stato iniziale, (1d) la probabilità che una misura di $S_{x}$ dia $\hbar/2$; poi (2a) il fondamentale e (2b) l&rsquo;autostato di minima energia con $\mathbf L^{2}=2\hbar^{2}$, scritti con le $\varphi_{k,l,m}$ della tavola della tappa precedente. La domanda (2c) chiede una probabilità di transizione con una perturbazione accesa a $t=0$, e richiede la teoria delle perturbazioni dipendenti dal tempo, che qui non si svolge.</p>
  <p>La struttura: la parte orbitale è un oscillatore isotropo, che commuta con $\mathbf L^{2}$, $\mathbf J^{2}$, $J_{z}$; il termine aggiunto è diagonale negli stati $|n,l,j,m_{j}\rangle$, con $\mathbf L\cdot\mathbf S=\tfrac12[j(j+1)-l(l+1)-\tfrac34]\hbar^{2}$. Quindi le energie sono esatte:</p>
  $$E=\Big(n+\frac32\Big)\hbar\omega+\alpha\Big[\frac{j(j+1)-l(l+1)-\frac34}{2}+m_{j}\Big].$$`},
  {t:'reveal', title:'(1) Le tre funzioni d onda', tag:'soluzione', steps:[
   {label:'(1a) Quali sono autostati', body:R`
   <p>$\Psi_{3}$ ha $l=0$: $\mathbf L\cdot\mathbf S=0$, $J_{z}=S_{z}=\hbar/2$, quindi è autostato con $E=\tfrac32\hbar\omega+\tfrac{\alpha}{2}$. $\Psi_{2}$ ha $m_{l}=1$ e $m_{s}=\tfrac12$: è lo stato più alto di $j=\tfrac32$, $m_{j}=\tfrac32$, unico con quel $m_{j}$ nel livello, quindi autostato di $\mathbf J^{2}$; con $\mathbf L\cdot\mathbf S=\tfrac12\hbar^{2}$, $E=\tfrac52\hbar\omega+\alpha(\tfrac12+\tfrac32)=\tfrac52\hbar\omega+2\alpha$. $\Psi_{1}$ ha $m_{l}=-1$, $m_{s}=\tfrac12$, $m_{j}=-\tfrac12$, e non è autostato: nel sottospazio con $l=1$, $m_{j}=-\tfrac12$ ci sono due stati, $|{-1},+\rangle$ e $|0,-\rangle$, e $\mathbf L\cdot\mathbf S=L_{z}S_{z}+\tfrac12(L_{+}S_{-}+L_{-}S_{+})$ li mescola. In quella base, in unità di $\hbar^{2}$,</p>
   $$\mathbf L\cdot\mathbf S=\begin{pmatrix}-\tfrac12&\tfrac{1}{\sqrt2}\\ \tfrac{1}{\sqrt2}&0\end{pmatrix},$$
   <p>con autovalori $\tfrac12$ ($j=\tfrac32$) e $-1$ ($j=\tfrac12$).</p>`},
   {label:'(1b) e (1c) Che cosa cambia, e quando torna', body:R`
   <p>$\Psi_{2}$ e $\Psi_{3}$ sono stati stazionari: cambiano solo per una fase globale, e lo stato fisico non cambia. $\Psi_{1}$ è sovrapposizione di due autostati con $m_{j}=-\tfrac12$ e $j$ diverso, di energie</p>
   $$E_{j=3/2}=\frac52\hbar\omega+\alpha\Big(\frac12-\frac12\Big)=\frac52\hbar\omega,\qquad E_{j=1/2}=\frac52\hbar\omega+\alpha\Big(-1-\frac12\Big)=\frac52\hbar\omega-\frac32\alpha .$$
   <p>Lo stato torna lo stesso, a meno di una fase globale, quando la fase relativa ha fatto un giro: $\Delta E\,T/\hbar=2\pi$, con $\Delta E=\tfrac32\alpha$, cioè</p>
   $$T=\frac{2\pi\hbar}{\Delta E}=\frac{4\pi\hbar}{3\alpha}.$$
   <p>Il termine $\alpha J_{z}/\hbar$ non entra nel periodo, perché i due stati hanno lo stesso $m_{j}$.</p>`},
   {label:'(1d) Sx: la trappola', body:R`
   <p>Per $\Psi_{2}$ e $\Psi_{3}$ lo spin è $\chi_{+}$ in ogni istante, e la probabilità di $S_{x}=\hbar/2$ è $|\langle x_{+}|\chi_{+}\rangle|^{2}=\tfrac12$. Per $\Psi_{1}$ lo stato al tempo $t$ è $a(t)\,\varphi_{0,1,-1}\chi_{+}+b(t)\,\varphi_{0,1,0}\chi_{-}$, con $|a|^{2}+|b|^{2}=1$. La probabilità è il valor medio del proiettore sullo spin, e i termini incrociati contengono $\langle\varphi_{0,1,-1}|\varphi_{0,1,0}\rangle=0$, perché le armoniche con $m$ diverso sono ortogonali. Resta $\tfrac12|a|^{2}+\tfrac12|b|^{2}=\tfrac12$, costante nel tempo.</p>
   <p>La risposta è $\tfrac12$ per tutte e tre, sempre. Per $\Psi_{1}$ lo spin oscilla fra su e giù lungo $z$, ma ogni componente di spin è accompagnata da uno stato orbitale diverso e ortogonale: spin e orbita sono intrecciati, la matrice densità ridotta dello spin è diagonale lungo $z$, e lungo $x$ non c&rsquo;è nessuna coerenza da vedere.</p>`}
  ]},
  {t:'reveal', title:'(2) Il fondamentale, e lo stato con L quadro fissato', tag:'soluzione', steps:[
   {label:'(2a) Il candidato del testo', body:R`
   <p>Il termine $\alpha J_{z}/\hbar$ favorisce $m_{j}$ negativo, $\alpha\mathbf L\cdot\mathbf S/\hbar^{2}$ favorisce $j=l-\tfrac12$. Con $n=0$, $l=0$, $m_{j}=-\tfrac12$: $E=\tfrac32\hbar\omega-\tfrac{\alpha}{2}$, e lo stato è $\varphi_{0,0,0}\chi_{-}$. Il miglior stato con $l=1$ è $j=\tfrac12$, $m_{j}=-\tfrac12$, a $\tfrac52\hbar\omega-\tfrac32\alpha$; la differenza con il precedente è $\hbar\omega-\alpha$, positiva per la condizione del testo. Questo è il ragionamento che il testo si aspetta.</p>`},
   {label:'Una condizione che non basta', body:R`
   <p>Il conto però va fatto per ogni $l$. Il miglior stato con $l$ dato ha $n=l$, $j=l-\tfrac12$ e $m_{j}=-j$, con $\mathbf L\cdot\mathbf S=-\tfrac{l+1}{2}\hbar^{2}$ e $J_{z}=-(l-\tfrac12)\hbar$, quindi</p>
   $$E_{l}=\Big(l+\frac32\Big)\hbar\omega-\alpha\Big(\frac{l+1}{2}+l-\frac12\Big)=\frac32\hbar\omega+l\Big(\hbar\omega-\frac32\alpha\Big).$$
   <p>Se $\alpha\lt\tfrac23\hbar\omega$ queste energie crescono con $l$, e il fondamentale è davvero $\varphi_{0,0,0}\chi_{-}$. Se invece $\tfrac23\hbar\omega\lt\alpha\lt\hbar\omega$, che il testo ammette, le energie decrescono senza limite al crescere di $l$: con $\alpha=0{,}9\,\hbar\omega$, lo stato con $l=10$ ha energia $-2\hbar\omega$, molto sotto il candidato. La hamiltoniana non è limitata inferiormente e non ha uno stato fondamentale. Il termine $J_{z}$ cresce con $l$ quanto il termine di oscillatore, e con un coefficiente abbastanza grande lo supera. All&rsquo;esame la risposta corretta è: per $\alpha\lt\tfrac23\hbar\omega$ il fondamentale è $\varphi_{0,0,0}\chi_{-}$, con energia $\tfrac32\hbar\omega-\tfrac{\alpha}{2}$; per $\alpha$ più grande non esiste.</p>`},
   {label:'(2b) Minima energia con L quadro uguale a 2 hbar quadro', body:R`
   <p>$\mathbf L^{2}=2\hbar^{2}$ vuol dire $l=1$. Nel livello $n=1$ gli stati sono $j=\tfrac32$, a $\tfrac52\hbar\omega+\alpha(\tfrac12+m_{j})$, il più basso con $m_{j}=-\tfrac32$ a $\tfrac52\hbar\omega-\alpha$; e $j=\tfrac12$, a $\tfrac52\hbar\omega+\alpha(-1+m_{j})$, il più basso con $m_{j}=-\tfrac12$ a $\tfrac52\hbar\omega-\tfrac32\alpha$. Vince il secondo. È l&rsquo;autovettore con autovalore $-1$ della matrice $2\times2$ di (1a), e normalizzato è</p>
   $$|\varphi\rangle=\sqrt{\frac23}\,\varphi_{0,1,-1}\,\chi_{+}-\frac{1}{\sqrt3}\,\varphi_{0,1,0}\,\chi_{-},$$
   <p>a meno di una fase globale; con la convenzione di Condon e Shortley per i <span class="str" data-str="clebsch-gordan">coefficienti di Clebsch-Gordan</span> lo stato $|j=\tfrac12,m_{j}=-\tfrac12\rangle$ ha il segno complessivo opposto, che non cambia niente di fisico. Gli stati con $l=1$ e $n=3$ hanno la stessa struttura angolare e $2\hbar\omega$ in più.</p>`}
  ]},
  {t:'plot', title:'Il fondamentale che sparisce',
   intro:R`<p>In unità di $\hbar\omega$, in funzione di $a=\alpha/\hbar\omega$: l&rsquo;energia del candidato $\varphi_{0,0,0}\chi_{-}$, $\tfrac32-\tfrac a2$ (blu), e del miglior stato con $l=1$ (arancio), $l=3$ (verde), $l=10$ (viola), $\tfrac32+l(1-\tfrac32a)$.</p>`,
   plots:[{kind:'func2d', xr:[0,1], yr:[-3,4.5], height:280, ticks:true,
     title:'compito 28-01-2014: energie minime per l dato',
     curves:[{f:'1.5-x/2', col:'#5aa9ff', width:2.6, label:'l = 0, mj = -1/2'},
             {f:'1.5+1*(1-1.5*x)', col:'#ffb86b', width:2.2, label:'l = 1'},
             {f:'1.5+3*(1-1.5*x)', col:'#6bdc9b', width:2.2, label:'l = 3'},
             {f:'1.5+10*(1-1.5*x)', col:'#c49bff', width:2.2, label:'l = 10'}],
     xlabel:'alpha / hbar omega', ylabel:'E / hbar omega'}],
   leggi:R`<p><b>Che cosa guardare.</b> Tutte le rette con $l\ge1$ passano per $\tfrac32$ a $a=\tfrac23$, e prima di quel punto stanno sopra la blu. Dopo, ruotano verso il basso tanto più in fretta quanto più $l$ è grande: la viola incontra la blu poco dopo $a=\tfrac23$ e a $a=1$ è a $-3{,}5$.</p>
   <p><b>Che cosa impararne.</b> Un termine lineare in $J_{z}$ e in $\mathbf L\cdot\mathbf S$ cresce con $l$ come l&rsquo;energia dell&rsquo;oscillatore, e quale vinca dipende dai coefficienti. Il controllo «la hamiltoniana è limitata inferiormente?» si fa guardando il comportamento per $l$ grande, e il testo di un esame, scritto in fretta, può non averlo fatto.</p>`}
]},
/* ---------------- 11 · SOLO LA PARTE ANGOLARE: IL ROTATORE ---------------- */
{ num:'11', title:'Problemi senza parte radiale: la particella su una sfera e il rotatore', meta:'la hamiltoniana L quadro su 2I · la molecola biatomica di Picasso e la regola di Bohr · decomporre uno spinore in armoniche (02-02-2021) · il rotatore con spin del 16-02-2018 · la piccola asimmetria che apre i livelli',
  blocchi:[
  {t:'prosa', title:'Quando r è fissato', tag:'modello', html:R`
  <p>Molti scritti del corso vincolano la particella su una sfera, spesso di raggio unitario: «una particella di spin 1 vincolata su una sfera (rotatore)», «una particella di massa $m$ e spin $1/2$, vincolata a muoversi su una sfera di raggio unitario». Con $r=R$ fissato non c&rsquo;è equazione radiale: l&rsquo;energia cinetica è solo quella angolare, $L^{2}/2mR^{2}$, e lo spazio degli stati orbitali è quello delle funzioni sulla sfera, che le armoniche sferiche generano tutte. La hamiltoniana più semplice,</p>
  $$H=\frac{L^{2}}{2I},\qquad I=mR^{2},$$
  <p>ha autovalori $\hbar^{2}l(l+1)/2I$ con degenerazione $2l+1$, e autofunzioni $Y_{l}^{m}$. Picasso arriva alla stessa hamiltoniana con la molecola biatomica rigida: due atomi a distanza fissa $d$, per cui <i>«nel moto relativo manca il grado di libertà radiale»</i> e l&rsquo;energia cinetica relativa è data soltanto dal termine centrifugo, con $I=\mu d^{2}$ il momento d&rsquo;inerzia. Gli autovalori sono la (11.25), $E_{l}=\hbar^{2}l(l+1)/2I$, <i>«ciascuno degenere $2l+1$ volte»</i>.</p>
  <p>Picasso aggiunge il confronto con la teoria di Bohr, che quantizzava il momento angolare come $L=n\hbar$ e quindi dava $E=\hbar^{2}n^{2}/2I$: <i>«la teoria di Bohr fornisce il risultato corretto solo per grandi valori del numero quantico»</i>. La differenza fra $l(l+1)$ e $l^{2}$ è $l$, piccola rispetto a $l^{2}$ per $l$ grande; e le differenze fra livelli successivi, quelle che si misurano negli spettri rotazionali, sono $\hbar^{2}(l+1)/I$ invece di $\hbar^{2}(2n+1)/2I$, diverse di mezzo quanto di rotazione.</p>`},
  {t:'reveal', title:'Decomporre uno spinore sulla sfera (02-02-2021)', tag:'esame', steps:[
   {label:'Il testo, e L quadro', body:R`
   <p>Il compito del 02-02-2021 dà una particella di spin $\tfrac12$ su una sfera di raggio unitario nello stato</p>
   $$|\Psi\rangle=A\begin{pmatrix}3\sin\theta\,e^{-i\phi}\\ 2e^{i\alpha}\end{pmatrix},$$
   <p>e chiede $|A|$ e i risultati di una misura di $L^{2}$. La componente con spin su è proporzionale a $Y_{1}^{-1}$, quella con spin giù a $Y_{0}^{0}$: lo stato è una sovrapposizione di $l=1$ e $l=0$, con lo spin intrecciato al momento orbitale. La normalizzazione è la somma degli integrali sulla sfera, $\int9\sin^{2}\theta\,d\Omega=24\pi$ e $\int4\,d\Omega=16\pi$, quindi $|A|^{2}\cdot40\pi=1$ e $|A|=1/\sqrt{40\pi}$. Le probabilità di $L^{2}$ sono i pesi delle due componenti: $2\hbar^{2}$ con probabilità $\tfrac{24}{40}=\tfrac35$, $0$ con probabilità $\tfrac25$.</p>`},
   {label:'La misura di J quadro', body:R`
   <p>Il testo prosegue: una misura di $\mathbf J^{2}$ dà $\tfrac34\hbar^{2}$, cioè $j=\tfrac12$. Con le armoniche normalizzate lo stato si scrive $|\Psi\rangle=\sqrt{\tfrac35}\,Y_{1}^{-1}\chi_{+}+\sqrt{\tfrac25}\,e^{i\alpha}\,Y_{0}^{0}\chi_{-}$, perché $3\sin\theta\,e^{-i\phi}=\sqrt{24\pi}\,Y_{1}^{-1}$ e $2=\sqrt{16\pi}\,Y_{0}^{0}$. Le due componenti hanno $m_{j}=-\tfrac12$. Quella con $l=0$ ha già $j=\tfrac12$. Quella con $l=1$ è una combinazione di $j=\tfrac32$ e $j=\tfrac12$, e lo stato con $l=1$, $j=\tfrac12$, $m_{j}=-\tfrac12$ è $v=\sqrt{\tfrac23}\,Y_{1}^{-1}\chi_{+}-\sqrt{\tfrac13}\,Y_{1}^{0}\chi_{-}$, l&rsquo;autovettore di $\mathbf L\cdot\mathbf S$ con autovalore $-\hbar^{2}$ già trovato nella tappa precedente. La sua sovrapposizione con $Y_{1}^{-1}\chi_{+}$ è $\sqrt{2/3}$. La probabilità di trovare $j=\tfrac12$ è quindi $\tfrac35\cdot\tfrac23+\tfrac25=\tfrac45$, e lo stato dopo la misura, normalizzato, è</p>
   $$|\psi_{1}\rangle=\frac{1}{\sqrt2}\Big(v+e^{i\alpha}\,Y_{0}^{0}\chi_{-}\Big).$$
   <p>Il conto non ha richiesto tavole: solo la matrice $2\times2$ di $\mathbf L\cdot\mathbf S$ e le probabilità di partenza.</p>`}
  ]},
  {t:'reveal', title:'Il rotatore con spin del 16-02-2018', tag:'esame', steps:[
   {label:'Il testo, e la hamiltoniana riscritta', body:R`
   <p>Una particella di spin $1$ vincolata su una sfera, con</p>
   $$H=\frac12\Big(\frac{J_{x}^{2}}{I_{x}}+\frac{J_{y}^{2}}{I_{y}}+\frac{J_{z}^{2}}{I_{z}}\Big),\qquad\mathbf J=\mathbf L+\mathbf S,\quad I_{x}=I_{y}=I,\quad0\lt I_{z}\lt I .$$
   <p>È la hamiltoniana di un corpo rigido simmetrico, scritta con il momento angolare totale. Con $J_{x}^{2}+J_{y}^{2}=\mathbf J^{2}-J_{z}^{2}$ diventa</p>
   $$H=\frac{\mathbf J^{2}}{2I}+\Big(\frac{1}{2I_{z}}-\frac{1}{2I}\Big)J_{z}^{2},$$
   <p>diagonale negli stati $|l,s;j,j_{z}\rangle$, con energie $E=\hbar^{2}\big[\tfrac{j(j+1)}{2I}+\big(\tfrac{1}{2I_{z}}-\tfrac{1}{2I}\big)j_{z}^{2}\big]$. Il coefficiente di $j_{z}^{2}$ è positivo perché $I_{z}\lt I$, e l&rsquo;energia dipende da $l$ solo attraverso i valori di $j$ che permette: con $s=1$, $j$ va da $|l-1|$ a $l+1$.</p>`},
   {label:'Fondamentale e primo livello', body:R`
   <p>L&rsquo;energia minima è zero, con $j=0$, e $j=0$ si ottiene solo da $l=1$: il fondamentale è non degenere, lo stato $|l=1,s=1;0,0\rangle$, che nella base prodotto è $\tfrac{1}{\sqrt3}\big(|1\rangle|{-1}\rangle-|0\rangle|0\rangle+|{-1}\rangle|1\rangle\big)$; che abbia $\mathbf J^{2}=0$ si controlla con le matrici di spin $1$. Il livello successivo è $j=1$ con $j_{z}=0$, a $\hbar^{2}/I$: si ottiene da $l=0$, da $l=1$ e da $l=2$, quindi è tre volte degenere. Da $l=0$ lo stato è $Y_{0}^{0}\chi_{0}$; da $l=1$ è $\tfrac{1}{\sqrt2}\big(|1\rangle|{-1}\rangle-|{-1}\rangle|1\rangle\big)$; da $l=2$ è $\sqrt{\tfrac{3}{10}}\,|1\rangle|{-1}\rangle-\sqrt{\tfrac25}\,|0\rangle|0\rangle+\sqrt{\tfrac{3}{10}}\,|{-1}\rangle|1\rangle$. Anche questi due si controllano con le matrici, nel prodotto di $l=1$ o $l=2$ con lo spin $1$.</p>
   <p>Il livello dopo dipende dal rapporto dei momenti d&rsquo;inerzia: $j=1$ con $j_{z}=\pm1$ ha energia $\hbar^{2}/2I+\hbar^{2}/2I_{z}$, $j=2$ con $j_{z}=0$ ha $3\hbar^{2}/I$, e il primo sta sotto se $I_{z}\gt I/5$.</p>`},
   {label:'La piccola asimmetria', body:R`
   <p>Il testo chiede poi l&rsquo;effetto di $I_{x}=I(1+\varepsilon)$, $I_{y}=I(1-\varepsilon)$ al primo ordine. Al primo ordine in $\varepsilon$ la hamiltoniana cambia di $-\tfrac{\varepsilon}{2I}(J_{x}^{2}-J_{y}^{2})=-\tfrac{\varepsilon}{4I}(J_{+}^{2}+J_{-}^{2})$, che cambia $j_{z}$ di $\pm2$ e non cambia né $l$ né $j$. Sul fondamentale e sul livello $j_{z}=0$ i valori medi sono nulli, e al primo ordine non si spostano. Nel livello $j=1$, $j_{z}=\pm1$, la perturbazione collega $j_{z}=-1$ a $j_{z}=+1$ con elemento di matrice $\langle1,1|J_{+}^{2}|1,-1\rangle=2\hbar^{2}$, e la matrice $2\times2$ ha autovalori $\mp\tfrac{\varepsilon\hbar^{2}}{2I}$: per ciascuno dei tre valori di $l$ il doppietto si separa nelle combinazioni simmetrica e antisimmetrica di $j_{z}=\pm1$. La degenerazione in $l$ resta, perché la perturbazione non distingue fra stati con lo stesso $j$.</p>`}
  ]},
  {t:'plot', title:'Spettro rotazionale: quantistico contro Bohr',
   intro:R`<p>Energie del rotatore in unità $\hbar^{2}/2I$ in funzione del numero quantico, letto sugli interi: $l(l+1)$ (blu) e la regola di Bohr $n^{2}$ (arancio); la loro differenza, $l$, è la retta verde.</p>`,
   plots:[{kind:'func2d', xr:[0,8], yr:[0,75], height:250, ticks:true,
     title:'rotatore: l(l+1) contro n^2',
     curves:[{f:'x*(x+1)', col:'#5aa9ff', width:2.4, label:'l(l+1)'},
             {f:'x*x', col:'#ffb86b', width:2.4, label:'Bohr: n^2'},
             {f:'x', col:'#6bdc9b', width:1.6, label:'differenza'}],
     xlabel:'l', ylabel:'E / (hbar^2 / 2I)'}],
   leggi:R`<p><b>Che cosa guardare.</b> La differenza fra le due curve cresce come $l$, ma il loro rapporto tende a uno come $1+1/l$: per $l=8$ è $72$ contro $64$, un ottavo in più. Per $l$ piccolo la differenza è tutto: lo stato $l=0$ ha energia zero, e il primo eccitato sta a $2$ invece che a $1$.</p>
   <p><b>Che cosa impararne.</b> È la frase di Picasso: la teoria di Bohr è giusta solo per numeri quantici grandi. Gli spettri rotazionali delle molecole lo mostrano direttamente: le righe delle transizioni $l\to l+1$ cadono a $\hbar^{2}/I$ per $1,2,3,\dots$, come vuole $l(l+1)$, mentre $n^{2}$ le metterebbe a metà strada, a $\hbar^{2}/I$ per $\tfrac12,\tfrac32,\tfrac52,\dots$ Il passo fra righe è lo stesso; è la posizione della prima che decide.</p>`}
]},
/* ---------------- 12 · LE FONTI A CONFRONTO, E L ORALE ---------------- */
{ num:'12', title:'Dove le fonti divergono, e le domande d orale', meta:'algebra contro funzioni d onda · i due punti su cui le fonti non concordano · tre correzioni trovate facendo i conti · che cosa ciascuna fonte mette al centro · domande d orale',
  blocchi:[
  {t:'prosa', title:'Algebra contro funzioni d onda', tag:'formalismi', html:R`
  <p>Il problema centrale è il punto in cui due formalismi si incontrano e non dicono esattamente la stessa cosa. Il documento di sintesi sui postulati che Giuseppe ha caricato, scritto da un compagno di corso, mette in tavola le formulazioni della meccanica quantistica e scrive della formulazione matriciale che <i>«brilla»</i> negli <i>«spettri algebrici (oscillatore, momento angolare)»</i>, e di quella ondulatoria che è <i>«meno naturale per lo spin»</i>. Questo movimento mostra perché. L&rsquo;algebra del momento angolare dà interi e semiinteri, senza distinguere; le funzioni d&rsquo;onda sulla sfera danno solo interi, e lo spin, che non è una funzione della direzione, resta fuori dalle armoniche sferiche e va aggiunto come un fattore a parte.</p>
  <p>Le fonti si dividono su come giustificare la selezione degli interi. Picasso e Griffiths usano la funzione d&rsquo;onda a un sol valore, Griffiths con una nota che ne ammette la debolezza. Shankar usa l&rsquo;hermiticità di $L_{z}$. Sakurai mette in fila tre argomenti, di cui il più convincente è la scala che per $l=\tfrac12$ produce funzioni singolari. Ballentine rifiuta le condizioni al contorno come fondamento e dà una prova puramente algebrica, scrivendo $L_{z}$ come differenza di due oscillatori. La prova di Ballentine è anche la risposta al documento: l&rsquo;algebra da sola non basta, ma l&rsquo;algebra di $\mathbf Q$ e $\mathbf P$, non quella del momento angolare, sì.</p>`},
  {t:'prosa', title:'Il secondo punto di disaccordo: la condizione nell origine', tag:'fonti', html:R`
  <p>Il secondo punto è $u(0)=0$, e qui il disaccordo è sulla ragione, non sul risultato. Picasso la deduce dal dominio del laplaciano, Landau dalla finitezza della funzione d&rsquo;onda, Ballentine dal rifiuto delle singolarità, Sakurai dal flusso di probabilità, Shankar dall&rsquo;hermiticità e dall&rsquo;identità $\nabla^{2}(1/r)=-4\pi\delta^{3}(\mathbf r)$; Griffiths dichiara che la normalizzabilità non basta e rimanda a Shankar. Per $l\ge1$ la questione non si pone, perché la soluzione irregolare non è normalizzabile. Per $l=0$ i due argomenti che reggono sono quello di Picasso e quello di Shankar, e dicono la stessa cosa in due lingue: una $1/r$ nell&rsquo;origine è l&rsquo;autofunzione di un&rsquo;altra hamiltoniana.</p>`},
  {t:'prosa', title:'Tre correzioni trovate facendo i conti', tag:'errata', html:R`
  <p><b>Sakurai, gli zeri di $j_{2}$.</b> Nel testo estratto della seconda edizione si leggono $5{,}84$, $8{,}96$, $12{,}25$; il calcolo dà $5{,}763$, $9{,}095$, $12{,}323$. Gli zeri di $j_{1}$ riportati nella stessa riga sono corretti.</p>
  <p><b>Le note di Martinelli, la variabile dell&rsquo;equazione di Laguerre.</b> Nel testo estratto si legge $t=\xi^{2}/2$; l&rsquo;equazione (47) delle note segue dalla (45) con $t=\xi^{2}$, che è anche l&rsquo;argomento dei polinomi di Laguerre nella formula finale.</p>
  <p><b>Il compito del 28-01-2014, la condizione su $\alpha$.</b> Con $0\lt\alpha\lt\hbar\omega$, come scrive il testo, la hamiltoniana non è limitata inferiormente se $\alpha\gt\tfrac23\hbar\omega$: gli stati con $j=l-\tfrac12$, $m_{j}=-j$ hanno energia $\tfrac32\hbar\omega+l(\hbar\omega-\tfrac32\alpha)$. Lo stato fondamentale che il testo si aspetta esiste solo per $\alpha\lt\tfrac23\hbar\omega$.</p>
  <p>A queste si aggiunge una distinzione che le fonti fanno in silenzio: l&rsquo;impulso radiale di Picasso, $-i\hbar\,\partial_{r}$, non è hermitiano, quello di Landau, $-i\hbar\,\frac1r\partial_{r}r$, sì. Le due definizioni portano alla stessa energia cinetica, ma solo la seconda dà un operatore che si possa misurare.</p>`},
  {t:'prosa', title:'Che cosa ciascuna fonte mette al centro', tag:'fonti', html:R`
  <p><b>Sakurai</b> parte da $\mathbf L$ come generatore delle rotazioni, ricava le armoniche con gli operatori a scala, e tratta tre potenziali, la particella libera, la buca infinita e l&rsquo;oscillatore, prima dell&rsquo;idrogeno, chiudendo con il modello a strati nucleare. <b>Picasso</b> è il più strutturale: degenerazione dal teorema di degenerazione, parità dall&rsquo;inversione come scalare, condizione nell&rsquo;origine dal dominio del laplaciano. <b>Landau</b> porta tutto al moto unidimensionale e ne trae le conseguenze in poche righe: livelli radiali non degeneri, numero quantico radiale, fondamentale sempre $s$. <b>Griffiths</b> è il più esplicito nei passaggi e il più onesto nelle note sulle debolezze. <b>Shankar</b> è il più attento alle condizioni al contorno e al comportamento all&rsquo;infinito. <b>Ballentine</b> è il più critico, e il solo a dare una prova degli interi che non dipende da nessuna condizione sulle funzioni. Le note del corso, sull&rsquo;oscillatore, fanno il ponte fra la soluzione cartesiana e quella sferica.</p>`},
  {t:'collaudo', title:'Domande d’orale', items:[
   {q:R`Perché in un potenziale centrale ogni livello è degenere almeno $2l+1$ volte?`,
    a:R`Perché tutte le componenti di $\mathbf L$ commutano con $H$ ma non fra loro. Se $|Elm\rangle$ è autostato, anche $L_{\pm}|Elm\rangle$ lo è con la stessa energia, e cambia $m$: tutti i $2l+1$ valori di $m$ hanno la stessa energia. È una degenerazione imposta dalla simmetria per rotazioni, e nell&rsquo;equazione radiale si vede dal fatto che $m$ non compare. Ogni degenerazione in più, come quella in $l$ dell&rsquo;oscillatore o dell&rsquo;idrogeno, segnala una simmetria più grande.`},
   {q:R`L&rsquo;algebra del momento angolare ammette $j$ semiintero. Perché il momento angolare orbitale è sempre intero?`,
    a:R`Primo: per un sistema dato i valori sono o tutti interi o tutti semiinteri, perché una rotazione di $2\pi$ deve essere un multiplo dell&rsquo;identità. Secondo: per $\mathbf L=\mathbf r\times\mathbf p$ sono interi. Lo si mostra con l&rsquo;hermiticità di $L_{z}=-i\hbar\partial_{\phi}$ sulle funzioni periodiche, oppure con la scala di Sakurai, che per $l=\tfrac12$ produce $\cot\theta\sqrt{\sin\theta}$, singolare e in contraddizione con la soluzione diretta, oppure, senza condizioni al contorno, con la prova di Ballentine: con $q_{1,2}=(Q_{x}\pm P_{y})/\sqrt2$ e $p_{1,2}=(P_{x}\mp Q_{y})/\sqrt2$, $L_{z}$ è la differenza di due oscillatori e ha autovalori $n_{1}-n_{2}$. L&rsquo;argomento «la funzione d&rsquo;onda deve tornare uguale dopo $2\pi$» da solo non basta, perché $|\psi|^{2}$ torna uguale comunque.`},
   {q:R`Scriva l&rsquo;equazione radiale e spieghi da dove viene la condizione $u(0)=0$.`,
    a:R`Con $\psi=\frac{u(r)}{r}Y_{l}^{m}$, $-\frac{\hbar^{2}}{2m}u''+\big[V+\frac{\hbar^{2}l(l+1)}{2mr^{2}}\big]u=Eu$, con $\int_{0}^{\infty}|u|^{2}dr=1$. Vicino all&rsquo;origine $u\sim Ar^{l+1}+Br^{-l}$. Per $l\ge1$ il termine con $B$ non è normalizzabile. Per $l=0$ lo è, ma $R\sim1/r$ e $\nabla^{2}(1/r)=-4\pi\delta^{3}(\mathbf r)$: la funzione soddisfa l&rsquo;equazione di Schrödinger con una delta nell&rsquo;origine, non con il potenziale dato. Equivalentemente, le funzioni del dominio del laplaciano in tre dimensioni sono limitate.`},
   {q:R`Perché in tre dimensioni una buca attrattiva può non avere stati legati, mentre in una dimensione ne ha sempre almeno uno?`,
    a:R`Perché il fondamentale in tre dimensioni è uno stato $s$, e $u(0)=0$ lo rende uguale al primo stato dispari della buca unidimensionale, che esiste solo se la buca è abbastanza profonda e larga: per la buca quadrata, $2mV_{0}a^{2}/\hbar^{2}\gt\pi^{2}/4$. In una dimensione lo stato pari, che parte con derivata nulla nel centro, esiste per qualunque buca. Vicino alla soglia lo stato si allarga, con una coda di lunghezza $1/\alpha$ che diverge: sono gli stati alone di Ballentine.`},
   {q:R`L&rsquo;oscillatore isotropo ha livelli $(N+\tfrac32)\hbar\omega$ in coordinate cartesiane e $(2q+l+\tfrac32)\hbar\omega$ in coordinate sferiche. Come si conciliano le degenerazioni?`,
    a:R`Il livello $N$ contiene $l=N,N-2,\dots$ fino a $1$ o $0$; sommando $2l+1$ si ottiene $(N+1)(N+2)/2$, che è il numero di terne di interi non negativi di somma $N$. Per $N=2$: $5+1=6$. Le due basi diagonalizzano insiemi diversi di operatori che commutano con $H$, e il fatto che il problema si separi in due sistemi di coordinate è il segno di una simmetria più grande delle rotazioni, che è anche la causa della degenerazione fra $l$ diversi.`},
   {q:R`Una particella su una sfera ha $H=L^{2}/2I$. Perché la teoria di Bohr sbaglia lo spettro, e quando ha ragione?`,
    a:R`Bohr dà $\hbar^{2}n^{2}/2I$, la meccanica quantistica $\hbar^{2}l(l+1)/2I$ con degenerazione $2l+1$. Il rapporto tende a uno per $l$ grande, come dice Picasso: la teoria di Bohr è giusta solo per numeri quantici grandi. Negli spettri rotazionali le righe $l\to l+1$ cadono a $\hbar^{2}/I$ per numeri interi, mentre Bohr le metterebbe a valori semidispari.`}
  ]}
]}

var byId = {}; TAPPE.forEach(function(s){ byId[s.num]=s; });

var VKEY='pm-nucleomq-17-visited';
function loadSeen(){ try{ return new Set(JSON.parse(localStorage.getItem(VKEY)||'[]')); }catch(e){ return new Set(); } }
function saveSeen(s){ try{ localStorage.setItem(VKEY, JSON.stringify(Array.from(s))); }catch(e){} }
var SEEN = loadSeen();

function renderNav(active){
  var nav=document.getElementById('sidebar');
  nav.innerHTML='';
  var h=document.createElement('h2'); h.textContent='Nucleo mq-17 · le tappe'; nav.appendChild(h);
  TAPPE.forEach(function(s){
    var b=document.createElement('button');
    b.className='navitem'+(active===s.num?' active':'')+(SEEN.has(s.num)?' seen':'');
    b.innerHTML='<span class="dot"></span><span class="nx">'+s.num+'</span><span>'+s.title+'</span>';
    b.onclick=function(){ showTappa(s.num); };
    nav.appendChild(b);
  });
}

/* ---- renderer dei blocchi ---- */
function sectionProsa(title, tag, html){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var body=elFromHTML('<div class="open-body">'+html+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function sectionGram(title, rows){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag gramtag">grammatica</span></h3>';
  var inner='<table class="gramtab">';
  rows.forEach(function(r){ inner+='<tr><td class="gs">'+r[0]+'</td><td>'+r[1]+'</td></tr>'; });
  inner+='</table>';
  var body=elFromHTML('<div class="gramwrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
/* --- blocco PLOT: la figura non decora, si legge. Ogni plot porta una chiave di lettura. --- */
function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';
  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionSvelabile(title, tag, html, sol){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var c=document.createElement('div'); c.className='collaudo-item';
  var q=document.createElement('div'); q.className='cq'; q.innerHTML=html||'';
  c.appendChild(q); typeset(q);
  if(sol){
    var a=document.createElement('div'); a.className='ca'; a.style.display='none';
    a.innerHTML='<b>Soluzione.</b> '+sol;
    var btn=document.createElement('button'); btn.className='reveal-btn small';
    btn.textContent='Rivela la soluzione';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a);
      btn.disabled=true; btn.classList.add('done'); btn.textContent='Soluzione rivelata'; };
    c.appendChild(btn); c.appendChild(a);
  }
  wrap.appendChild(c); return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    /* DUE SCHEMI, NON UNO — scoperto il 2026-10-06 provando le pagine vive. I movimenti
       scritti per primi (em-01..03, me-10b, i collaudi di gd-01..09 e di quattro em)
       usano una forma piu' semplice: `reveal` e `prolessi` con un solo `html`,
       `esercizio` e `collaudo` con `html` + `sol`. Il renderer ne conosceva una sola e
       chiamava `steps.forEach` su `undefined`: TypeError, e la tappa si fermava li' —
       62 blocchi in 17 movimenti su 74. Non si riscrive il contenuto per far contento
       il renderer: e' il renderer che deve leggere cio' che c'e'.
       E in fondo un ramo che NON muore: uno schema nuovo di domani deve far vedere un
       avviso in quella sezione, non spegnere la pagina sotto di se'. */
    try{
      if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
      else if(b.t==='prolessi') m.appendChild(b.rotte ? sectionProlessi(b)
                                   : sectionProsa(b.title,'prolessi',b.html));
      else if(b.t==='reveal')m.appendChild(b.steps ? sectionReveal(b.title,b.tag,b.steps)
                                   : sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='esercizio') m.appendChild(b.steps ? sectionEsercizio(b)
                                   : sectionSvelabile(b.title,'esercizio',b.html,b.sol));
      else if(b.t==='collaudo')  m.appendChild(b.items ? sectionCollaudo(b.title,b.items)
                                   : sectionSvelabile(b.title,'provi, poi riveli',b.html,b.sol));
      else if(b.t==='plot')      m.appendChild(sectionPlot(b));
      else m.appendChild(sectionProsa(b.title||'(blocco)', 'tipo sconosciuto: '+b.t,
                                      b.html||''));
    }catch(err){
      var avv=document.createElement('section'); avv.className='section';
      avv.innerHTML='<h3>'+(b.title||'(blocco)')+'<span class="tag">non reso</span></h3>'
        +'<p style="color:#ff6b6b">Questo blocco non si &egrave; potuto rendere ('
        +b.t+': '+err.message+'). Il resto della tappa continua sotto.</p>';
      m.appendChild(avv);
    }
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* I POP-UP DEGLI STRUMENTI. `cablaStrumenti` esisteva dal 18-09 e non la chiamava
     nessuno: i 229 rimandi del percorso erano <span> senza handler, e il clic non
     faceva niente. Nessun controllo poteva vederlo — la sintassi era valida, le schede
     c'erano tutte, le formule rendevano: il guasto esisteva solo a pagina viva. Qui, e
     dopo ogni inserimento successivo, perche' la tappa si rimonta da capo a ogni
     cambio e gli handler vanno riattaccati al DOM nuovo. */
  cablaStrumenti(m);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}
