var CORSO = 'meccanica-statistica';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["integrale-gaussiano"] = {"nome":"Integrale gaussiano","riga":"$\\displaystyle\\int_{-\\infty}^{+\\infty} e^{-ax^{2}}\\,dx=\\sqrt{\\pi/a}$ per $a>0$, e $\\displaystyle\\int_{-\\infty}^{+\\infty} x^{2}e^{-ax^{2}}\\,dx=\\tfrac12\\sqrt{\\pi/a^{3}}$.","serve":"E' l'unico integrale che serve davvero sapere a memoria in meccanica statistica, perche' l'energia cinetica e' quadratica nell'impulso e quindi ogni integrazione sugli impulsi e' una gaussiana. Il trucco della dimostrazione — elevare al quadrato e passare in coordinate polari — vale la pena di vederlo una volta: e' il motivo per cui compare un $\\pi$ in una formula che di cerchi non parla.","esempio":"Da $I^{2}=\\iint e^{-a(x^{2}+y^{2})}dx\\,dy=2\\pi\\int_{0}^{\\infty}re^{-ar^{2}}dr=\\pi/a$ segue $I=\\sqrt{\\pi/a}$. I momenti superiori si ottengono derivando rispetto ad $a$ sotto il segno: $-\\partial_a I=\\int x^{2}e^{-ax^{2}}dx=\\tfrac12\\sqrt{\\pi}\\,a^{-3/2}$. Derivare rispetto a un parametro e' piu' rapido che integrare per parti, e funziona per tutti i momenti pari.","pieno":null,"qui":{"meccanica-statistica":{"serve":"La funzione di partizione di una particella libera e' un prodotto di tre gaussiane negli impulsi, e da li' esce la lunghezza d'onda termica $\\lambda=h/\\sqrt{2\\pi m k T}$ — che e' la grandezza con cui si misura quando un gas smette di essere classico.","esempio":"$\\int e^{-\\beta p^{2}/2m}dp=\\sqrt{2\\pi m/\\beta}$, quindi $Z_{1}=\\dfrac{V}{h^{3}}(2\\pi mkT)^{3/2}=V/\\lambda^{3}$. Lo stesso integrale col peso $p^{2}$ da' $\\langle p^{2}/2m\\rangle=\\tfrac12 kT$ per grado di liberta': l'equipartizione non e' un principio a parte, e' questo integrale."}}};
STRUM["funzione-gamma"] = {"nome":"Funzione Gamma","riga":"$\\Gamma(z)=\\displaystyle\\int_0^{\\infty}t^{z-1}e^{-t}\\,dt$, e da questa $\\displaystyle\\int_0^{\\infty}t^{k}e^{-at}\\,dt=\\dfrac{\\Gamma(k+1)}{a^{k+1}}$ per $a>0$.","serve":"E' il fattoriale esteso ai numeri non interi — $\\Gamma(n+1)=n!$ — e soprattutto e' la forma chiusa di TUTTI gli integrali del tipo «potenza per esponenziale». Sapere questa sola formula sostituisce una decina di integrazioni per parti, e permette di leggere a vista il risultato di un integrale appena si riconosce l'esponente della potenza.","esempio":"Da $\\Gamma(z+1)=z\\,\\Gamma(z)$, che si ottiene integrando per parti una volta, discende $\\Gamma(n+1)=n!$ per $n$ intero: $\\Gamma(1)=1$, $\\Gamma(2)=1$, $\\Gamma(3)=2$, $\\Gamma(4)=6$. Sui semi-interi il capostipite e' $\\Gamma(\\tfrac12)=\\sqrt\\pi$ — che e' l'integrale gaussiano travestito — e da li' $\\Gamma(\\tfrac32)=\\tfrac12\\sqrt\\pi$, $\\Gamma(\\tfrac52)=\\tfrac34\\sqrt\\pi$. Un integrale come $\\int_0^\\infty t^{2}e^{-at}dt$ vale dunque $\\Gamma(3)/a^{3}=2/a^{3}$, senza fare nessun conto.","pieno":null,"qui":{"meccanica-statistica":{"serve":"E' l'inventario degli integrali del canonico ridotto a una riga. Ogni funzione di partizione di singola particella e' un integrale di potenza per esponenziale — cambia solo l'esponente, e con esso la fisica: $t^{1/2}$ per il gas classico, $t^{2}$ per l'ultrarelativistico, $t^{3/n}$ per un potenziale $\\alpha r^{n}$. Riconoscere quale $\\Gamma$ si sta calcolando e' cio' che distingue chi risolve lo scritto in dieci minuti da chi lo risolve in un'ora.","esempio":"Per una particella relativistica con $\\varepsilon=cp$ la partizione porta $\\int_0^\\infty p^{2}e^{-\\beta cp}dp=\\Gamma(3)/(\\beta c)^{3}=2/(\\beta c)^{3}$, da cui $\\langle\\varepsilon\\rangle=3T$ invece dei $\\tfrac32T$ del caso non relativistico. Il fattore 3 contro $3/2$ viene per intero dall'esponente della potenza, cioe' dall'argomento della Gamma: la dipendenza dell'energia dalla quantita' di moto decide da sola quanto calore serve a scaldare il gas."}}};
STRUM["cambio-di-variabile"] = {"nome":"Cambio di variabile in una densità","riga":"Una densità non si trasforma sostituendo ma porta il jacobiano: se $y=f(x)$ allora $p_Y(y)=\\sum_i p_X(x_i)\\,/\\,|f'(x_i)|$, sommato su tutti i rami $x_i$ con $f(x_i)=y$.","serve":"È l'unico punto in cui una densità si comporta diversamente da una funzione, ed è l'errore che si ripete. Ciò che è invariante è la probabilità dell'evento, $p_Y(y)|dy|=p_X(x)|dx|$: la densità no, perché è una probabilità per unità di qualcosa, e passando da $x$ a $y$ quell'unità si dilata o si comprime. Scrivere $p_Y(y)=p_X(x(y))$ e basta è attraente e sbagliato. Si scova senza rifare il conto con due prove da cinque secondi: la normalizzazione non torna, e le dimensioni restano quelle della variabile di partenza.","esempio":"Una particella uniforme su un disco di raggio $R$: $p(x,y)=1/(\\pi R^2)$. Passando alla sola distanza dal centro, il jacobiano è l'elemento d'area radiale $2\\pi r$, e resta $p(r)=2r/R^2$ su $[0,R]$, che infatti si normalizza a $1$. Il valor medio è $\\langle r\\rangle=2R/3$ — non $R/2$, che è la risposta di chi tratta $r$ come uniforme. La differenza fra i due numeri è esattamente il fattore $r$, cioè il fatto che lontano dal centro c'è più area.","pieno":{"file":"ms-03-probabilita.html","tappa":"01","come":"la regola dedotta dall'invarianza della probabilità, i rami molteplici e il caso radiale, nel movimento ms-03 di Meccanica Statistica"},"qui":{"meccanica-statistica":{"serve":"È metà della domanda più frequente dello scritto: «calcolare la densità di probabilità dell'energia di singola particella», «la densità di particelle $\\rho(r)$». L'altra metà è la marginalizzazione. Le scritture $d^2r=2\\pi r\\,dr$ e $d^3r=4\\pi r^2dr$ non sono formule da ricordare: sono questo cambio di variabile con gli angoli già integrati, e saperlo deducere è ciò che salva quando la simmetria è cilindrica invece che sferica. Attenzione al doppio jacobiano: $p(r)$ è una densità rispetto a $r$, $\\rho(r)$ è una densità per unità di volume, e fra le due ce n'è un altro.","esempio":"L'energia cinetica in due dimensioni. La misura radiale nel piano degli impulsi è la derivata dell'area del disco, $2\\pi p$; la sostituzione $\\varepsilon=p^2/2m$ ha $d\\varepsilon/dp=p/m$, e il jacobiano cancella esattamente il fattore $p$. Per questo in $d=2$ la densità dell'energia è l'esponenziale pura $\\beta e^{-\\beta\\varepsilon}$, senza prefattore, mentre in $d=3$ resta un $\\sqrt{\\varepsilon}$. Da quel solo fattore dipendono tutte le differenze qualitative fra i gas quantistici in dimensioni diverse."}},"controllo":[{"tipo":"integrale","espr":"2*r/R**2","var":"r","da":"0","a":"R","vale":"1","ipotesi":{"r":"positive","R":"positive"},"dove":"esempio","appare":"p(r)=2r/R^2"},{"tipo":"integrale","espr":"r*2*r/R**2","var":"r","da":"0","a":"R","vale":"2*R/3","ipotesi":{"r":"positive","R":"positive"},"dove":"esempio","appare":"2R/3"},{"tipo":"derivata","espr":"pi*p**2","rispetto":["p"],"vale":"2*pi*p","ipotesi":{"p":"positive"},"dove":"qui.meccanica-statistica.esempio","appare":"2\\pi p"},{"tipo":"derivata","espr":"p**2/(2*m)","rispetto":["p"],"vale":"p/m","ipotesi":{"p":"positive","m":"positive"},"dove":"qui.meccanica-statistica.esempio","appare":"p/m"},{"tipo":"integrale","espr":"b*exp(-b*e)","var":"e","da":"0","a":"oo","vale":"1","ipotesi":{"b":"positive","e":"positive"},"dove":"qui.meccanica-statistica.esempio","appare":"\\beta e^{-\\beta\\varepsilon}"}]};
STRUM["stirling"] = {"nome":"Approssimazione di Stirling","riga":"Per $N$ grande, $\\ln N! = N\\ln N - N + \\tfrac12\\ln(2\\pi N) + O(1/N)$; quasi sempre bastano i primi due termini.","serve":"Il fattoriale nasce ogni volta che si contano configurazioni, e $N!$ con $N\\sim 10^{23}$ non e' un numero che si maneggia. Stirling lo trasforma in una funzione liscia e derivabile di $N$ — ed e' proprio la derivabilita', non la comodita', il punto: senza di essa non si potrebbe massimizzare un'entropia rispetto a un numero di occupazione.","esempio":"Con $N=10$: $\\ln 10! = 15{,}104$, mentre $N\\ln N - N = 13{,}026$ e il termine $\\tfrac12\\ln(2\\pi N)=2{,}070$ porta a $15{,}096$ — tre cifre esatte gia' a dieci. Il terzo termine e' trascurabile in termodinamica perche' cresce come $\\ln N$ contro $N$: su $N=10^{23}$ pesa $10^{-22}$ in relativo. Per questo in meccanica statistica si scrive $\\ln N!\\simeq N\\ln N-N$ e non si guarda indietro.","pieno":null,"qui":{"meccanica-statistica":{"serve":"E' lo strumento senza il quale il conteggio microcanonico non diventa termodinamica. $S=k\\ln\\Omega$ con $\\Omega$ pieno di fattoriali resta un'espressione; applicato Stirling, $S$ diventa una funzione estensiva di $N$, $V$, $E$ che si puo' derivare per ottenere temperatura e pressione.","esempio":"Nel gas ideale il conteggio corretto di Boltzmann divide per $N!$, e il suo logaritmo $-\\ln N!\\simeq -N\\ln N+N$ e' esattamente il termine che rende l'entropia estensiva e scioglie il paradosso di Gibbs. Togliere Stirling di li' significa non vedere piu' da dove viene il $-N\\ln N$ della Sackur-Tetrode."}}};
STRUM["delta-di-dirac"] = {"nome":"Delta di Dirac","riga":"Non è una funzione ma un funzionale, definito da $\\int f(x)\\,\\delta(x-a)\\,dx=f(a)$, che composto con una funzione si spezza sui suoi zeri come $\\delta(g(x))=\\sum_i \\delta(x-x_i)/|g'(x_i)|$.","serve":"Serve come macchina per cambiare variabile senza invertire nulla. La densità di $y=f(x)$ si scrive $p_Y(y)=\\int p_X(x)\\,\\delta(y-f(x))\\,dx$, e la delta produce da sola il fattore $1/|f'|$ che altrimenti andrebbe messo a mano: i rami molteplici si contano da soli invece di doverli ricordare. È la ragione pratica per cui il formalismo con la delta compare in ogni soluzione d'esame che tocchi una distribuzione, mentre il cambio di variabile esplicito compare quasi mai.","esempio":"$\\delta(x^2-a^2)$ con $a$ positivo. Gli zeri sono $x=\\pm a$; la derivata dell'argomento è $2x$, che in modulo vale $2a$ su entrambi. Quindi $\\delta(x^2-a^2)=\\dfrac{1}{2a}\\big[\\delta(x-a)+\\delta(x+a)\\big]$. Il caso si ripete identico in fisica statistica con $\\varepsilon=p^2/2m$ in una dimensione, dove i due rami $p=\\pm\\sqrt{2m\\varepsilon}$ contribuiscono entrambi — e dimenticarne uno dimezza la risposta.","pieno":{"file":"15-distribuzioni.html","tappa":"01","come":"le distribuzioni come funzionali, la delta e le sue proprietà, nel nucleo di Metodi"},"qui":{"meccanica-statistica":{"serve":"È lo strumento con cui si calcola la densità degli stati, cioè l'oggetto su cui poggia tutto il secondo tempo del corso: $g(\\varepsilon)=\\int d^dp\\,d^dq\\;\\delta(\\varepsilon-H)/h^d$. L'identità che si usa davvero non è la definizione ma questa: $\\delta(\\varepsilon-H)=\\partial_\\varepsilon\\,\\theta(\\varepsilon-H)$. Si scambia l'integrale con la derivata e ci si ritrova a calcolare il volume della regione dove l'hamiltoniana sta sotto $\\varepsilon$ — un integrale elementare — invece di un integrale con una delta dentro. La $g$ così ottenuta è pura geometria dello spazio delle fasi: non sa nulla della temperatura, e per questo resta identica quando si passa da Boltzmann a Fermi o a Bose.","esempio":"Particella libera in due dimensioni. Il volume della regione $p^2/2m$ sotto $\\varepsilon$ è il disco di area $2\\pi m\\varepsilon$; derivando rispetto a $\\varepsilon$ si ottiene $2\\pi m$, cioè una densità degli stati costante. Non è una curiosità: è la ragione per cui in due dimensioni una particella libera non condensa, e per cui le prove che chiedono la condensazione in $d=2$ mettono sempre un potenziale confinante, che porta la $g$ da costante a crescente."}},"controllo":[{"tipo":"derivata","espr":"x**2-a**2","rispetto":["x"],"vale":"2*x","ipotesi":{"x":"positive","a":"positive"},"dove":"esempio","appare":"2x"},{"tipo":"uguale","sinistra":"1/Abs(2*a)","vale":"1/(2*a)","ipotesi":{"a":"positive"},"dove":"esempio","appare":"\\dfrac{1}{2a}"},{"tipo":"derivata","espr":"2*pi*m*e","rispetto":["e"],"vale":"2*pi*m","ipotesi":{"m":"positive","e":"positive"},"dove":"qui.meccanica-statistica.esempio","appare":"2\\pi m"}]};

function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';
  return h;
}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

/* ---------------- 00 · DI COSA PARLA QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Di cosa parla questo movimento', meta:'Meccanica Statistica · voce A.7 · dato un potenziale, quale integrale esce e come si svolge',
  blocchi:[
  {t:'prosa', title:'Non una teoria in piu, ma un mestiere', tag:'architettura', html:R`
  <p>La regola del canonico è una sola, e sta in tre righe: si pesa ogni microstato con $e^{-\beta H}$, si somma il peso in una <b>funzione di partizione</b> $Z=\sum_s e^{-\beta H(s)}$, e da lì tutta la termodinamica esce con derivate — l&rsquo;energia libera $F=-T\log Z$, l&rsquo;energia media $E=-\dfrac{\partial\log Z}{\partial\beta}$, l&rsquo;entropia e la pressione come derivate di $F$. Chi ha in mano questa regola non ha ancora, però, ciò che l&rsquo;esame chiede. Perché lo scritto non domanda «enuncia il canonico»: dà un&rsquo;hamiltoniana di singola particella, quasi sempre nella forma</p>
  $$H_1=\frac{p^2}{2m}+V(q),$$
  <p>e chiede di <b>svolgere l&rsquo;integrale</b>. La forma $H=p^2/2m+V(q)$ compare in <b>quarantasei prove su quarantasette</b>, e in ventiquattro il potenziale è scritto per esteso: una buca, un oscillatore, la gravità, un confinamento di potenza. Questo movimento è il <b>mestiere</b> che sta fra la regola e il voto: dato $V(q)$, riconoscere quale integrale si sta facendo e saperlo chiudere.</p>
  <p style="text-align:center"><b>la regola dice cosa scrivere; il mestiere dice quale integrale è, e quanto vale.</b></p>
  <p>Enuncio qui, in due righe e con la loro ipotesi, i due risultati del canonico che userò senza più ridimostrarli, perché il movimento è autosufficiente: $F=-T\log Z$ definisce l&rsquo;energia libera di Helmholtz a partire da $Z$ (vale per un sistema a temperatura $T$ fissata), e $E=-\dfrac{\partial\log Z}{\partial\beta}$ estrae l&rsquo;energia media derivando $\log Z$ rispetto a $\beta=1/T$ (è l&rsquo;identità $\partial_\beta e^{-\beta H}=-H e^{-\beta H}$ mediata sull&rsquo;insieme). Da questi due, e da un solo inventario di integrali, si risolve ogni caso.</p>
  <div class="note"><b>Una convenzione, fissata all&rsquo;inizio.</b> Seguendo le note di Crisanti — il docente del terzo canale — e quelle di Gravina, pongo la costante di Boltzmann $k=1$, così che $\beta=1/T$ e l&rsquo;entropia è un numero puro. Falcioni-Vulpiani tengono $k_B$ esplicito e scrivono $\beta=1/k_BT$: dove riporto una loro formula lo dichiaro. Anche il fattore $1/(h^{3N}N!)$ nella misura dello spazio delle fasi ha due grammatiche — Crisanti e Gravina lo scrivono dentro l&rsquo;integrale, Falcioni-Vulpiani pongono $h=1$ e discutono $N!$ a parte con il paradosso di Gibbs — ma è lo stesso conto.</p></div>`},
  {t:'prosa', title:'La rotta', tag:'architettura', html:R`
  <p><b>Come è fatto il movimento.</b> Prima la <b>ricetta in sei passi</b> — $Z_1\to Z_N\to E\to S\to \rho\to P$ — e la sua chiave: siccome $H_1$ separa impulso e posizione, la partizione di singola particella si spezza in un integrale <b>cinetico</b> (sempre lo stesso) e uno <b>configurazionale</b> (dove entra il potenziale). Poi l&rsquo;<b>inventario degli integrali</b>: una tabella ragionata che, dato $V(q)$, dice quale integrale esce — gaussiano, gamma, a tratti — quanto vale e cosa se ne ricava. Poi quattro casi svolti <b>per intero</b> nella sequenza d&rsquo;esame: la <b>buca</b> (particella libera confinata), l&rsquo;<b>oscillatore armonico</b> in una, due e tre dimensioni, la <b>gravità</b> con la relazione barometrica, il <b>potenziale confinante di potenza</b> con la densità degli stati. Poi la <b>densità di probabilità</b>, dove si scopre che la distribuzione degli impulsi è sempre la stessa maxwelliana qualunque sia $V$, e solo quella spaziale cambia. Infine il passaggio al <b>relativistico</b>, dove a cambiare è l&rsquo;energia cinetica, e una batteria di esercizi.</p>`}
]},

/* ---------------- 01 · LA RICETTA IN SEI PASSI ---------------- */
{ num:'01', title:'La ricetta in sei passi, e la fattorizzazione che la regge', meta:'Z_1 poi Z_N poi energia entropia densita pressione · limpulso e la posizione si separano · lintegrale cinetico e quello configurazionale',
  blocchi:[
  {t:'prosa', title:'La sequenza che lesame usa, sempre la stessa', tag:'regola operativa', html:R`
  <p>Ogni problema di singola particella in un potenziale si svolge nello stesso ordine, ed è utile fissarlo come una lista perché all&rsquo;orale non si perde tempo a decidere da dove cominciare:</p>
  <p><b>(1)</b> la partizione di <b>una particella</b>, $Z_1=\dfrac{1}{h^d}\displaystyle\int d^dq\,d^dp\;e^{-\beta H_1}$; <b>(2)</b> la partizione delle $N$ particelle identiche non interagenti, $Z_N=\dfrac{Z_1^{\,N}}{N!}$; <b>(3)</b> l&rsquo;energia media $E=-\dfrac{\partial\log Z_N}{\partial\beta}$; <b>(4)</b> l&rsquo;energia libera $F=-T\log Z_N$ e da lei l&rsquo;entropia $S=-\partial F/\partial T$; <b>(5)</b> la densità di probabilità di singola particella $\rho=e^{-\beta H_1}/z_1$, da cui la maxwelliana e la densità spaziale; <b>(6)</b> la pressione $P=-\partial F/\partial V$, o la forza generalizzata coniugata al parametro geometrico che confina il sistema.</p>
  <p>Il passo <b>(2)</b> è il gesto che l&rsquo;esame chiede più di ogni altro: si scrive $Z_N=\dfrac{Z_1^{\,N}}{N!}$ e si riduce il problema a $N$ corpi al calcolo di un solo integrale, $Z_1$. Vale perché con particelle identiche e non interagenti $H=\sum_i H_1(q_i,p_i)$, e l&rsquo;esponenziale di una somma è un prodotto di esponenziali; l&rsquo;$1/N!$ è l&rsquo;indistinguibilità, ciò che rende l&rsquo;entropia estensiva. Cade appena compare un termine di interazione $\sum_{i\lt j}U(|q_i-q_j|)$, che mescola coordinate di coppie diverse: allora $Z_N$ non è più una potenza, ma quei problemi l&rsquo;esame non li chiede.</p>`},
  {t:'prosa', title:'La chiave del mestiere: impulso e posizione si separano', tag:'costruzione', html:R`
  <p>Tutto il movimento poggia su un fatto elementare e potente. L&rsquo;hamiltoniana $H_1=\dfrac{p^2}{2m}+V(q)$ è una <b>somma</b> di un termine che dipende solo dall&rsquo;impulso e uno che dipende solo dalla posizione. L&rsquo;esponenziale si spezza, $e^{-\beta H_1}=e^{-\beta p^2/2m}\,e^{-\beta V(q)}$, e l&rsquo;integrale di $Z_1$ si <b>fattorizza</b> in due integrali indipendenti:</p>
  $$Z_1=\frac{1}{h^d}\Big(\int d^dq\,e^{-\beta V(q)}\Big)\Big(\int d^dp\,e^{-\beta p^2/2m}\Big)\equiv \frac{1}{h^d}\,Z_{\text{conf}}\cdot Z_{\text{cin}}.$$
  <p>La <b>parte cinetica</b> è sempre la stessa, per qualunque potenziale: è il prodotto di $d$ integrali gaussiani. In una dimensione, con l&rsquo;<span class="str" data-str="integrale-gaussiano">integrale gaussiano</span> $\displaystyle\int_{-\infty}^{+\infty}e^{-\beta p^2/2m}\,dp=\sqrt{2\pi m/\beta}$, e in tre dimensioni la sua terza potenza. La <b>parte configurazionale</b> è dove entra la fisica del problema: cambia con $V(q)$, ed è l&rsquo;unico integrale che davvero bisogna imparare a riconoscere. Questa è la ragione per cui il mestiere si riduce a un inventario: la metà cinetica la conosco già, e mi resta da classificare la metà configurazionale.</p>
  <p>Ne segue anche il modo di leggere l&rsquo;energia media. Poiché $\log Z_1=\log Z_{\text{conf}}+\log Z_{\text{cin}}+\text{cost}$, e $E=-N\partial_\beta\log z_1$, il contributo cinetico e quello del potenziale si <b>sommano</b>: ogni fattore che dipende da $\beta$ come una potenza $\beta^{-\nu}$ porta all&rsquo;energia media un pezzo $\nu\,T$ per particella. La parte cinetica in tre dimensioni dà $\beta^{-3/2}$, cioè $\tfrac32 T$; il potenziale aggiunge il suo, e questo spiega in anticipo perché un gas in un campo esterno ha un calore specifico più grande di un gas libero.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Perché nel calcolo di $Z_1$ per $H_1=p^2/2m+V(q)$ conviene separare subito impulso e posizione?`,
    a:R`Perché l&rsquo;hamiltoniana è una <b>somma</b> di un termine di solo impulso e uno di sola posizione, e l&rsquo;esponenziale di una somma è un prodotto: $e^{-\beta H_1}=e^{-\beta p^2/2m}e^{-\beta V(q)}$. L&rsquo;integrale multiplo si fattorizza allora in un integrale sugli impulsi — sempre lo stesso, gaussiano — e uno sulle posizioni, dove entra il potenziale. <b>Il criterio è la separabilità dell&rsquo;hamiltoniana</b>: senza di essa (per esempio con un termine $p\cdot q$ di accoppiamento) la fattorizzazione non vale e l&rsquo;integrale va fatto in blocco.`},
   {q:R`Un potenziale aggiunge sempre energia media al gas. Da cosa si vede il quanto, senza fare il conto per esteso?`,
    a:R`Dalla potenza di $\beta$ che il fattore configurazionale porta. Se $Z_{\text{conf}}\propto\beta^{-\nu}$, allora $\log Z$ contiene $-\nu\log\beta$ e $E=-\partial_\beta\log Z$ guadagna $\nu/\beta=\nu T$ per particella. Un potenziale gravitazionale $V=mgz$ dà $Z_{\text{conf}}\propto\int e^{-\beta mgz}dz\propto\beta^{-1}$, cioè $\nu=1$ e un $T$ in più; un potenziale armonico dà $\beta^{-1/2}$ per grado, cioè $\tfrac12 T$ ciascuno. <b>Il criterio è l&rsquo;equipartizione generalizzata</b>: ogni potenza dell&rsquo;esponente nell&rsquo;energia si traduce in un contributo fisso $\propto T$.`}
  ]}
]},

/* ---------------- 02 · LINVENTARIO DEGLI INTEGRALI ---------------- */
{ num:'02', title:'Linventario degli integrali: quale esce, quanto vale, cosa se ne ricava', meta:'gaussiano per potenziali quadratici · gamma per potenze e dispersione lineare · a tratti per le buche · la tabella ragionata',
  blocchi:[
  {t:'prosa', title:'Tre famiglie, e come riconoscerle a colpo docchio', tag:'regola operativa', html:R`
  <p>Il potenziale può avere mille forme, ma gli integrali che ne escono appartengono a <b>tre famiglie</b> soltanto, e riconoscere la famiglia è metà del lavoro. Le elenco con il criterio di riconoscimento, il valore, e ciò che se ne ricava.</p>
  <p><b>Famiglia gaussiana</b> — esce quando l&rsquo;esponente è <b>quadratico</b> nella variabile. È sempre il caso della parte cinetica ($p^2/2m$) e della parte configurazionale di un oscillatore ($\tfrac12 m\omega^2 q^2$). Il valore da sapere è l&rsquo;<span class="str" data-str="integrale-gaussiano">integrale gaussiano</span> $\displaystyle\int_{-\infty}^{+\infty}e^{-a x^2}\,dx=\sqrt{\pi/a}$, e il suo momento secondo $\displaystyle\int_{-\infty}^{+\infty}x^2 e^{-a x^2}\,dx=\tfrac12\sqrt{\pi/a^3}$, che dà l&rsquo;equipartizione. Se ne ricava $\tfrac12 T$ di energia per ogni grado di libertà quadratico.</p>
  <p><b>Famiglia gamma</b> — esce quando l&rsquo;esponente è una <b>potenza</b> della variabile con un prefattore anch&rsquo;esso di potenza: dispersione lineare $\varepsilon=c|p|$, potenziali confinanti $V\propto r^n$, integrali radiali in dimensione qualsiasi. La forma è la <span class="str" data-str="funzione-gamma">funzione Gamma di Eulero</span> $\displaystyle\int_0^\infty x^k e^{-a x}\,dx=\Gamma(k+1)/a^{k+1}$. Due casi concreti che tornano sempre: l&rsquo;esponenziale puro $\displaystyle\int_0^\infty e^{-a x}\,dx=\dfrac{1}{a}$ (è $\Gamma(1)$) e il radiale del gas relativistico $\displaystyle\int_0^\infty p^2 e^{-a p}\,dp=\dfrac{2}{a^3}$ (è $\Gamma(3)=2$). Se ne ricava l&rsquo;energia media per la regola: con $\varepsilon\propto p^\alpha$ in $d$ dimensioni, ogni particella porta $(d/\alpha)T$.</p>
  <p><b>Famiglia a tratti</b> — esce quando il potenziale è <b>costante a tratti</b>, tipicamente una buca. Qui non c&rsquo;è un integrale da calcolare nel senso stretto: dove $V=0$ l&rsquo;integrando configurazionale vale $1$ e l&rsquo;integrale è semplicemente il <b>volume</b> accessibile; dove $V=+\infty$ l&rsquo;integrando è nullo. Il caso della buca infinita, il più frequente, dà $Z_{\text{conf}}=V$ e riporta esattamente al gas ideale. La buca finita raccorda i due regimi con un integrale su una regione limitata, che nei casi d&rsquo;esame è ancora gaussiano (pareti paraboliche) o esponenziale.</p>`},
  {t:'prosa', title:'La tabella ragionata', tag:'regola operativa', html:R`
  <p>Ecco l&rsquo;inventario in forma di tabella: prima colonna il potenziale, seconda l&rsquo;integrale configurazionale che ne esce (in una dimensione, o radiale in tre), terza il suo valore, quarta la conseguenza fisica sull&rsquo;energia media per particella. È lo strumento operativo del movimento — la si legge da sinistra a destra durante lo scritto.</p>
  <table class="tabella">
   <thead><tr><th>$V(q)$</th><th>integrale configurazionale</th><th>vale</th><th>energia per particella</th></tr></thead>
   <tbody>
   <tr><td>buca infinita, $V=0$ in $\mathcal V$</td><td>$\displaystyle\int_{\mathcal V} d^3q$</td><td>$V$ (volume)</td><td>$\tfrac32 T$ (solo cinetica)</td></tr>
   <tr><td>oscillatore, $\tfrac12 m\omega^2 q^2$</td><td>$\displaystyle\int e^{-\beta m\omega^2 q^2/2}dq$</td><td>$\sqrt{2\pi/(m\omega^2\beta)}$</td><td>$T$ per modo (cin.+pot.)</td></tr>
   <tr><td>gravità, $mgz$ ($z\ge0$)</td><td>$\displaystyle\int_0^\infty e^{-\beta m g z}dz$</td><td>$\dfrac{1}{\beta m g}$</td><td>$\tfrac52 T$</td></tr>
   <tr><td>potenza, $\alpha r^{n}$ ($r\le R$)</td><td>$\displaystyle\int_0^\infty r^2 e^{-\beta\alpha r^{n}}dr$</td><td>$\dfrac{\Gamma(3/n)}{n(\beta\alpha)^{3/n}}$</td><td>$\big(\tfrac32+\tfrac3n\big)T$</td></tr>
   <tr><td>relativistico, $c|p|$ (cinetica)</td><td>$\displaystyle\int_0^\infty p^2 e^{-\beta c p}dp$</td><td>$\dfrac{2}{(\beta c)^3}$</td><td>$3T$</td></tr>
   </tbody>
  </table>
  <p>Due righe meritano un commento, perché sono quelle in cui la gamma fa un lavoro non ovvio. Il caso <b>potenza</b>: l&rsquo;integrale radiale $\int_0^\infty r^2 e^{-\beta\alpha r^n}dr$ si riduce alla forma canonica con il <span class="str" data-str="cambio-di-variabile">cambio di variabile</span> $y=r^n$; per il cubo, $n=3$, il jacobiano $dy=3r^2 dr$ cancella esattamente il fattore $r^2$ e resta $\dfrac13\int_0^\infty e^{-\beta\alpha y}dy=\dfrac{1}{3\beta\alpha}$ — un&rsquo;esponenziale pura. Il caso <b>relativistico</b>: la cinetica non è più gaussiana ma lineare, e l&rsquo;integrale radiale con il peso $p^2$ (misura sferica nello spazio degli impulsi) è $\Gamma(3)/(\beta c)^3=2/(\beta c)^3$. In entrambi, è la potenza dell&rsquo;esponente a decidere l&rsquo;argomento della gamma, e con esso l&rsquo;energia media.</p>`},
  {t:'plot', title:'I quattro potenziali affiancati',
   intro:R`In ascissa la coordinata $q$ (o il raggio $r$), in unità arbitrarie; in ordinata il potenziale $V$. I quattro potenziali dell'inventario, sovrapposti per confronto: la buca piatta, l'oscillatore quadratico, la gravità lineare, il confinamento cubico. La forma di $V$ vicino all'origine decide quale integrale esce.`,
   plots:[
    {kind:'func2d', xr:[0,2.2], yr:[0,3], height:320, ticks:6,
     title:'buca piatta, oscillatore, gravita, confinamento di potenza',
     curves:[
      {f:'0.06+0*x', col:'#8bd450', label:'buca infinita: V=0 dentro (integrale = volume)'},
      {f:'0.9*x*x', col:'#5eead4', label:'oscillatore: V ~ q^2 (integrale gaussiano)'},
      {f:'1.1*x', col:'#d8a13a', label:'gravita: V ~ z (integrale esponenziale, gamma)'},
      {f:'0.55*pow(x,3)', col:'#ff6b6b', label:'confinamento: V ~ r^3 (integrale gamma)'}
     ],
     xlabel:'q oppure r', ylabel:'V (potenziale)'}
   ],
   leggi:R`<p><b>La pendenza del potenziale all&rsquo;origine è ciò che classifica l&rsquo;integrale.</b> La buca (verde) è piatta: dentro non pesa nulla, e l&rsquo;integrale configurazionale è solo il volume — nessuna gaussiana, nessuna gamma. L&rsquo;oscillatore (turchese) sale come $q^2$: esponente quadratico, integrale gaussiano, $\tfrac12 T$ per grado. La gravità (ocra) sale lineare: esponente di prima potenza, integrale esponenziale $\int e^{-\beta mgz}dz=1/\beta mg$, che è la gamma più semplice, $\Gamma(1)$. Il confinamento cubico (rosso) sale come $r^3$: integrale gamma con argomento $3/n$.</p>
   <p><b>Più il potenziale è ripido, più stretta è la regione esplorata, ma più energia costa uscirne.</b> È il bilancio che decide l&rsquo;energia media: un potenziale che cresce come $r^n$ aggiunge $\dfrac3n T$ all&rsquo;energia per particella in tre dimensioni — molto per la gravità ($n=1$, aggiunge $\tfrac32 T$… correggo: in una sola direzione, $T$), poco per un confinamento ripido ($n$ grande, contributo che svanisce, perché la particella è di fatto in una scatola rigida e il potenziale non immagazzina energia).</p>
   <p><b>La lettura da portare all&rsquo;orale.</b> Guardando $V(q)$ prima di scrivere qualsiasi cosa, si decide la famiglia: quadratico $\Rightarrow$ gaussiano, potenza o lineare $\Rightarrow$ gamma, a gradino $\Rightarrow$ volume. Sbagliare la famiglia è l&rsquo;unico modo di sbagliare tutto il problema; azzeccarla riduce il resto a sostituire numeri in una formula nota.</p>`}
]},

/* ---------------- 03 · CASO 1 · LA BUCA E IL GAS LIBERO CONFINATO ---------------- */
{ num:'03', title:'Caso 1 · la buca infinita: il gas libero confinato, svolto per intero', meta:'lintegrale configurazionale e il volume · la lunghezza donda termica · energia entropia di Sackur-Tetrode e pressione',
  blocchi:[
  {t:'reveal', title:'I sei passi sul caso base', tag:'costruzione', steps:[
   {label:'Z_1 e la lunghezza donda termica', body:R`
   <p>Il caso base è la buca infinita: $V=0$ dentro un volume $V$ e $V=+\infty$ fuori. Nella tabella è la riga «volume»: la parte configurazionale non pesa e dà semplicemente $V$. Resta la parte cinetica, tre gaussiane:</p>
   $$Z_1=\frac{V}{h^3}\Big(\int_{-\infty}^{+\infty}e^{-\beta p^2/2m}\,dp\Big)^{\!3}=\frac{V}{h^3}\big(\sqrt{2\pi m/\beta}\big)^3=\frac{V}{h^3}(2\pi m/\beta)^{3/2}\equiv\frac{V}{\lambda^3},$$
   <p>dove ho usato $\big(\sqrt{2\pi m/\beta}\big)^3=(2\pi m/\beta)^{3/2}$ e ho definito la <b>lunghezza d&rsquo;onda termica di de Broglie</b> $\lambda=h/\sqrt{2\pi m k_BT}$. È la scala che misura quando il gas smette di essere classico: finché $\lambda\ll(V/N)^{1/3}$, cioè finché la lunghezza d&rsquo;onda termica è minore della distanza media fra particelle, la descrizione classica regge.</p>`},
   {label:'Z_N, energia media, calore specifico', body:R`
   <p>La partizione totale è $Z_N=\dfrac{Z_1^N}{N!}=\dfrac{1}{N!}\Big(\dfrac{V}{\lambda^3}\Big)^N$. Il suo logaritmo, isolando la dipendenza da $\beta$, è $\log Z_N=N\log V-\tfrac{3N}{2}\log\beta+\text{cost}-\log N!$. L&rsquo;energia media è la derivata:</p>
   $$E=-\frac{\partial\log Z_N}{\partial\beta}=-\frac{\partial}{\partial\beta}\Big(-\tfrac{3N}{2}\log\beta\Big)=-\Big(-\frac{3N}{2\beta}\Big)=\frac{3N}{2\beta}=\frac32 NT.$$
   <p>Il calore specifico è $C_V=\dfrac{\partial E}{\partial T}=\tfrac32 N$, cioè la derivata di $\tfrac32 NT$ rispetto a $T$. È l&rsquo;energia di equipartizione — tre gradi di libertà quadratici, $\tfrac12 T$ ciascuno — ottenuta senza alcun punto di sella, solo derivando $\log\beta$.</p>`},
   {label:'Entropia di Sackur-Tetrode e pressione', body:R`
   <p>L&rsquo;energia libera è $F=-T\log Z_N$; con l&rsquo;<span class="str" data-str="stirling">approssimazione di Stirling</span> $\log N!\simeq N\log N-N$ prende la forma estensiva $F=-NT\big[\log\!\big(\tfrac{V}{N}(2\pi m/h^2\beta)^{3/2}\big)+1\big]$. L&rsquo;<b>entropia</b> è $S=-\partial F/\partial T$: concentrandosi sulla dipendenza da $T$, $F$ contiene $-NT(\tfrac32\log T+1)$, e derivando compare il termine chiave $\dfrac{d}{dT}\big[-NT(\tfrac32\log T+1)\big]=-N\big(\tfrac32\log T+\tfrac52\big)$, dove il $\tfrac32$ della derivata del logaritmo si somma all&rsquo;$1$ per dare l&rsquo;emblematico $\tfrac52$. Rimettendo le costanti si ha l&rsquo;<b>equazione di Sackur-Tetrode</b></p>
   $$S=N\Big[\log\!\Big(\frac{V}{N}\Big(\frac{2\pi m T}{h^2}\Big)^{3/2}\Big)+\frac52\Big].$$
   <p>La <b>pressione</b> viene da $P=-\partial F/\partial V$: la sola parte di $F$ che dipende da $V$ è $-NT\log V$, dunque $\dfrac{\partial F}{\partial V}=-\dfrac{NT}{V}$ e $P=NT/V$, cioè $PV=NT$. Crisanti ricava questi stessi numeri direttamente dalla $\Gamma_\beta(E)$ ancora prima di introdurre $Z$ (pag. 188-190): segno che il risultato non dipende dalla grammatica scelta.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Nel gas libero confinato la parte configurazionale di $Z_1$ dà solo il volume $V$. Perché, e cosa cambierebbe con pareti non rigide?`,
    a:R`Perché nella buca infinita $V(q)=0$ dentro il contenitore, quindi $e^{-\beta V}=1$ e $\int d^3q\,e^{-\beta V}=\int_{\mathcal V}d^3q=V$. Il potenziale non immagazzina energia: tutta l&rsquo;energia è cinetica, $E=\tfrac32 NT$. Con pareti non rigide — un potenziale che sale con continuità — l&rsquo;integrale configurazionale non sarebbe più il volume secco ma un integrale su $V(q)$, e il gas guadagnerebbe energia potenziale, alzando $C_V$ sopra $\tfrac32 N$. <b>Il criterio è che un potenziale costante a tratti contribuisce solo con il volume della regione permessa.</b>`}
  ]}
]},

/* ---------------- 04 · CASO 2 · LOSCILLATORE ARMONICO ---------------- */
{ num:'04', title:'Caso 2 · loscillatore armonico in una, due e tre dimensioni', meta:'due gaussiane per grado di liberta · Z_1 uguale a uno su beta h tagliato omega · lenergia T per modo e Dulong-Petit',
  blocchi:[
  {t:'prosa', title:'Un modo, due gaussiane', tag:'costruzione', html:R`
  <p>L&rsquo;oscillatore è il primo caso in cui il potenziale non è banale, ed è il più istruttivo perché il potenziale è <b>quadratico</b> come l&rsquo;energia cinetica: entrambi gli integrali sono gaussiani. Per un oscillatore unidimensionale $H_1=\dfrac{p^2}{2m}+\dfrac12 m\omega^2 q^2$, la partizione di singolo modo è il prodotto di due gaussiane, una sugli impulsi e una sulle posizioni:</p>
  $$Z_1=\frac1h\int e^{-\beta p^2/2m}dp\int e^{-\beta m\omega^2 q^2/2}dq=\frac1h\sqrt{\frac{2\pi m}{\beta}}\,\sqrt{\frac{2\pi}{m\omega^2\beta}}=\frac1h\cdot\frac{2\pi}{\beta\omega}=\frac{1}{\beta\hbar\omega}.$$
  <p>Ho usato l&rsquo;integrale gaussiano configurazionale $\displaystyle\int_{-\infty}^{+\infty}e^{-\beta m\omega^2 q^2/2}dq=\sqrt{\dfrac{2\pi}{m\omega^2\beta}}$, poi il prodotto $\sqrt{2\pi m/\beta}\,\sqrt{2\pi/(m\omega^2\beta)}=\dfrac{2\pi}{\beta\omega}$, e infine $h=2\pi\hbar$. L&rsquo;energia media di un modo è $E_1=-\partial_\beta\log Z_1$; poiché $\log Z_1=-\log(\beta\hbar\omega)$, la derivata è $\partial_\beta\log Z_1=-\dfrac1\beta$, dunque $E_1=\dfrac1\beta=T$. <b>Ogni oscillatore porta $T$</b> — due gradi quadratici, cinetico e potenziale, $\tfrac12 T$ ciascuno: è l&rsquo;equipartizione che conta anche il potenziale, non solo l&rsquo;energia cinetica come nel gas libero.</p>`},
  {t:'prosa', title:'Due e tre dimensioni, e il solido classico', tag:'costruzione', html:R`
  <p>In $d$ dimensioni l&rsquo;oscillatore isotropo ha $H_1=\dfrac{p^2}{2m}+\dfrac12 m\omega^2 r^2$ con $r^2=\sum_{i=1}^d q_i^2$, e siccome sia la cinetica sia il potenziale si spezzano lungo gli assi, la partizione è la potenza $d$-esima di quella unidimensionale: $Z_1=\big(1/\beta\hbar\omega\big)^d$. In tre dimensioni $Z_1=(1/\beta\hbar\omega)^3$, e $\log Z_1=-3\log(\beta\hbar\omega)$; per $N$ oscillatori tridimensionali indipendenti $\log Z_N=-3N\log\beta+\text{cost}$, e l&rsquo;energia media</p>
  $$E=-\frac{\partial\log Z_N}{\partial\beta}=-\frac{\partial}{\partial\beta}\big(-3N\log\beta\big)=\frac{3N}{\beta}=3NT,$$
  <p>con $C_V=3N$. È la <b>legge di Dulong-Petit</b>: un solido cristallino, modellato come $3N$ oscillatori (ogni atomo vibra attorno al suo sito nelle tre direzioni), ha calore specifico costante $3N$, indipendente dalla temperatura. Il risultato è giusto ad alta temperatura e clamorosamente sbagliato a bassa, dove l&rsquo;esperimento dà $C_V\to0$; la ragione è quantistica — i livelli discreti dell&rsquo;oscillatore, che congelano i modi a $T\ll\hbar\omega/k_B$ — e appartiene alla statistica dei livelli, non al mestiere degli integrali classici. Qui ci basta notare che il potenziale armonico raddoppia il contributo di ogni direzione rispetto al gas libero: $T$ invece di $\tfrac12 T$ per asse, perché la posizione ora pesa quanto l&rsquo;impulso.</p>`},
  {t:'plot', title:'Il peso di Boltzmann configurazionale a tre temperature',
   intro:R`In ascissa la posizione $q$ dell'oscillatore (unità arbitrarie); in ordinata il peso configurazionale normalizzato $\propto e^{-\beta m\omega^2 q^2/2}$, una gaussiana, per tre temperature crescenti. La larghezza cresce con $T$: è l'ampiezza tipica di oscillazione.`,
   plots:[
    {kind:'func2d', xr:[-3,3], yr:[0,1.05], height:320, ticks:6,
     title:'distribuzione delle posizioni di un oscillatore, gaussiana',
     curves:[
      {f:'exp(-x*x/0.25)', col:'#5eead4', label:'T bassa: ben confinato, gaussiana stretta'},
      {f:'exp(-x*x/0.9)*0.85', col:'#d8a13a', label:'T media'},
      {f:'exp(-x*x/2.2)*0.62', col:'#ff6b6b', label:'T alta: oscilla ampio, gaussiana larga'}
     ],
     xlabel:'q (posizione)', ylabel:'peso configurazionale (normalizzato)'}
   ],
   leggi:R`<p><b>Il potenziale quadratico produce una posizione distribuita come una gaussiana.</b> A differenza del gas libero, dove la posizione è uniforme nel volume, qui la particella è richiamata verso l&rsquo;origine e la probabilità di trovarla a distanza $q$ decade come $e^{-\beta m\omega^2 q^2/2}$. È la stessa forma della distribuzione degli impulsi, perché entrambi i termini dell&rsquo;hamiltoniana sono quadratici: <b>impulso e posizione sono statisticamente gemelli</b>, ed è questa simmetria a dare l&rsquo;equipartizione completa, $T$ per modo.</p>
   <p><b>La larghezza misura la temperatura.</b> Alzando $T$ la gaussiana si allarga: l&rsquo;ampiezza quadratica media di oscillazione è $\langle q^2\rangle=T/m\omega^2$, che cresce linearmente con la temperatura. È la lettura microscopica della dilatazione termica e, insieme a $\langle p^2/2m\rangle=\tfrac12 T$, dà l&rsquo;energia totale $\langle E\rangle=T$ per modo.</p>
   <p><b>La morale operativa.</b> Ogni volta che il potenziale è quadratico, l&rsquo;integrale configurazionale è gaussiano e porta gli stessi $\tfrac12 T$ della cinetica. Riconoscere «potenziale armonico $\Rightarrow$ gaussiana $\Rightarrow$ equipartizione piena» è ciò che permette di scrivere $E=NT$ (in una dimensione) o $E=3NT$ (in tre) senza calcolare nulla.</p>`}
]},

/* ---------------- 05 · CASO 3 · LA GRAVITA E LA RELAZIONE BAROMETRICA ---------------- */
{ num:'05', title:'Caso 3 · la gravita: la relazione barometrica, e mezzo grado in piu', meta:'V uguale mgz e lintegrale esponenziale · z1 fattorizzata · energia cinque mezzi NT · la densita che decade con laltezza',
  blocchi:[
  {t:'prosa', title:'Il potenziale lineare e il suo integrale', tag:'costruzione', html:R`
  <p>Consideriamo un gas di particelle libere in un contenitore cilindrico di base $A$ e altezza infinita, soggette al solo campo gravitazionale: $H_1=\dfrac{p^2}{2m}+mgz$ con $z\ge0$. È il caso di Crisanti (§3.17), e il potenziale è <b>lineare</b>: nella tabella è la riga «esponenziale». La partizione di singola particella fattorizza in cinetica (tre gaussiane) e configurazionale (un integrale sul piano orizzontale, che dà l&rsquo;area $A$, per uno verticale esponenziale):</p>
  $$z_1=\frac{1}{h^3}\int dx\,dy\int_0^\infty dz\,e^{-\beta mgz}\int d^3p\,e^{-\beta p^2/2m}=\frac{1}{h^3}\,A\cdot\frac{1}{\beta mg}\cdot\Big(\frac{2\pi m}{\beta}\Big)^{3/2}.$$
  <p>L&rsquo;integrale verticale è la gamma più semplice, l&rsquo;esponenziale pura $\displaystyle\int_0^\infty e^{-\beta mgz}\,dz=\dfrac{1}{\beta m g}$, cioè $\Gamma(1)/(\beta mg)$. Ecco il punto istruttivo: questo fattore porta un $\beta^{-1}$ <b>in più</b> rispetto al gas libero, che aveva solo il $\beta^{-3/2}$ cinetico. La potenza totale di $\beta$ è ora $\beta^{-5/2}$.</p>`},
  {t:'prosa', title:'Energia, calore specifico, e da dove viene il mezzo grado in piu', tag:'costruzione', html:R`
  <p>Il logaritmo, isolando $\beta$, è $\log z_1=-\tfrac32\log\beta-\log\beta+\text{cost}=-\tfrac52\log\beta+\text{cost}$; per $N$ particelle $\log Z_N=-\tfrac{5N}{2}\log\beta+\text{cost}-\log N!$, e l&rsquo;energia media</p>
  $$E=-\frac{\partial\log Z_N}{\partial\beta}=-\frac{\partial}{\partial\beta}\Big(-\frac{5N}{2}\log\beta\Big)=\frac{5N}{2\beta}=\frac52 NT,$$
  <p>con calore specifico $C_V=\dfrac{\partial E}{\partial T}=\tfrac52 N$, la derivata di $\tfrac52 NT$. È <b>più grande</b> del gas libero ($\tfrac32 N$): il campo gravitazionale aggiunge $T$ per particella, cioè un intero grado di libertà, non mezzo. La ragione la dà l&rsquo;equipartizione generalizzata: un termine di energia lineare nella coordinata, $mgz$, contribuisce $T$ (non $\tfrac12 T$ come un termine quadratico), perché l&rsquo;integrale $\int_0^\infty e^{-\beta mgz}dz\propto\beta^{-1}$ porta una potenza intera. La regola generale è: un termine $\propto z^n$ nell&rsquo;esponente contribuisce $\dfrac1n T$; l&rsquo;oscillatore ($n=2$) dà $\tfrac12 T$, la gravità ($n=1$) dà $T$.</p>`},
  {t:'reveal', title:'La relazione barometrica', tag:'costruzione', steps:[
   {label:'La densita di particelle come marginale spaziale', body:R`
   <p>La distribuzione di singola particella è $\rho(\mathbf q,\mathbf p)=e^{-\beta H_1}/z_1$. Se ci interessa <i>dove</i> stanno le particelle, non con quale impulso, si integra sugli impulsi (che danno una costante gaussiana) e resta la <b>densità spaziale</b>, funzione della sola quota $z$: $\rho(\mathbf q)\propto e^{-\beta mgz}$. Moltiplicando per il numero totale $N$ e normalizzando, la densità di particelle è</p>
   $$n(z)=n(0)\,e^{-\beta m g z},$$
   <p>la <b>relazione barometrica</b>: la densità dell&rsquo;atmosfera decade esponenzialmente con la quota, con scala di altezza $k_BT/mg$. È il primo risultato storico della meccanica statistica applicato all&rsquo;atmosfera, e nasce qui come marginale spaziale della distribuzione canonica.</p>`},
   {label:'La pressione e il suo significato', body:R`
   <p>La pressione si legge da $P=-\partial F/\partial V$, ma il volume qui è ambiguo (il cilindro è infinito): conviene la forza generalizzata coniugata all&rsquo;area $A$, $P=-\dfrac1A\partial F/\partial b$ con $b$ l&rsquo;altezza di un tappo. Crisanti lo svolge (§3.17.2) e trova la pressione a quota $z$, $P(z)=\dfrac{Nmg}{A}\dfrac{e^{-\beta mgz}}{1-e^{-\beta mgb}}$, che decade con l&rsquo;altezza come la densità — coerente con l&rsquo;equazione dei gas locale $P(z)=n(z)T$. Mediando sull&rsquo;altezza si ritrova $\overline P=NT/(bA)=NT/V$: la pressione media sulle pareti è quella dei gas perfetti, e le variazioni con la quota sono l&rsquo;impronta del campo esterno. <b>Il senso della pressione come forza generalizzata è che deriva l&rsquo;energia libera rispetto al parametro geometrico che confina il sistema.</b></p>`}
  ]},
  {t:'plot', title:'La densita barometrica che decade con laltezza',
   intro:R`In ascissa la quota $z$ (unità arbitrarie); in ordinata la densità di particelle $n(z)=n(0)e^{-\beta mgz}$, normalizzata a $1$ al suolo, per tre temperature. Più caldo è il gas, più lenta è la caduta: la scala di altezza è $k_BT/mg$.`,
   plots:[
    {kind:'func2d', xr:[0,4], yr:[0,1.05], height:320, ticks:6,
     title:'densita di particelle contro laltezza, tre temperature',
     curves:[
      {f:'exp(-3*x)', col:'#5eead4', label:'T bassa: atmosfera sottile, cade in fretta'},
      {f:'exp(-1.4*x)', col:'#d8a13a', label:'T media'},
      {f:'exp(-0.7*x)', col:'#ff6b6b', label:'T alta: atmosfera estesa, cade piano'}
     ],
     xlabel:'z (quota)', ylabel:'n(z)/n(0)'}
   ],
   leggi:R`<p><b>La densità decade esponenzialmente perché il peso di Boltzmann del potenziale $mgz$ è esattamente $e^{-\beta mgz}$.</b> Non c&rsquo;è dinamica nel conto: la marginale spaziale della distribuzione canonica <i>è</i> la relazione barometrica. Ogni quota è pesata secondo l&rsquo;energia potenziale che costa raggiungerla, e $\beta mg$ è l&rsquo;inverso della scala su cui la densità cala di un fattore $e$.</p>
   <p><b>La temperatura è la scala di altezza.</b> Alzando $T$ (abbassando $\beta$) l&rsquo;esponente $\beta mg$ diminuisce e l&rsquo;atmosfera si estende: le particelle hanno abbastanza energia termica per popolare quote più alte. La scala $k_BT/mg$ è pochi chilometri per l&rsquo;aria a temperatura ambiente — il motivo per cui la pressione atmosferica dimezza ogni cinquemila metri circa.</p>
   <p><b>Perché conta all&rsquo;orale.</b> La relazione barometrica è la domanda-tipo del potenziale esterno lineare, e la si costruisce in tre righe: peso di Boltzmann del potenziale, marginale sugli impulsi, normalizzazione. Da lì $\langle z\rangle=k_BT/mg$ e l&rsquo;energia potenziale media $\langle mgz\rangle=T$ escono con un integrale esponenziale.</p>`}
]},

/* ---------------- 06 · CASO 4 · IL POTENZIALE CONFINANTE DI POTENZA ---------------- */
{ num:'06', title:'Caso 4 · il potenziale confinante di potenza, e la densita degli stati', meta:'V uguale alpha r cubo in una sfera · lintegrale gamma · la pressione sulla superficie · G di epsilon dalla delta',
  blocchi:[
  {t:'prosa', title:'Il confinamento cubico e lintegrale gamma', tag:'costruzione', html:R`
  <p>L&rsquo;ultimo caso è il più ricco, ed è il potenziale <b>confinante di potenza</b>: $N$ particelle indipendenti in un potenziale centrale $H_1=\dfrac{p^2}{2m}+\alpha r^3$, confinate in una sfera di raggio $R$. È l&rsquo;esercizio di Crisanti §3.18, e serve a introdurre la densità degli stati. La partizione di singola particella fattorizza; la parte configurazionale è un integrale radiale con il peso $4\pi r^2$ (misura sferica):</p>
  $$z_{\text{conf}}=\int_0^R 4\pi r^2\,e^{-\beta\alpha r^3}\,dr=\frac{4\pi}{3}\int_0^{R^3}e^{-\beta\alpha y}\,dy=\frac{4\pi}{3}\cdot\frac{1-e^{-\beta\alpha R^3}}{\beta\alpha},$$
  <p>dove il <span class="str" data-str="cambio-di-variabile">cambio di variabile</span> $y=r^3$, con $dy=3r^2 dr$, cancella esattamente il fattore $r^2$ e trasforma l&rsquo;integrale in un&rsquo;esponenziale. Nel limite di sfera grande ($R\to\infty$) resta la gamma pura $\displaystyle\int_0^\infty r^2 e^{-\beta\alpha r^3}\,dr=\dfrac{1}{3\beta\alpha}$, cioè $\Gamma(1)/(3\beta\alpha)$. Per un potenziale di potenza generale $V=\alpha r^n$ lo stesso cambio $y=r^n$ dà $\int_0^\infty r^2 e^{-\beta\alpha r^n}dr=\dfrac{\Gamma(3/n)}{n(\beta\alpha)^{3/n}}$: <b>la potenza $n$ finisce nell&rsquo;argomento della <span class="str" data-str="funzione-gamma">funzione gamma</span></b>, ed è tutto ciò che distingue un confinamento dall&rsquo;altro.</p>`},
  {t:'prosa', title:'La pressione sulla superficie della sfera', tag:'costruzione', html:R`
  <p>La pressione sul bordo si ottiene derivando $F=-NT\log z_1$ rispetto al volume $V=\tfrac43\pi R^3$, cioè rispetto a $u\equiv R^3$ tramite $\partial_V=\dfrac{3}{4\pi}\partial_u$. La sola dipendenza da $u$ è nel fattore $\log(1-e^{-\beta\alpha u})$, e</p>
  $$\frac{\partial}{\partial u}\log\!\big(1-e^{-\beta\alpha u}\big)=\beta\alpha\,\frac{e^{-\beta\alpha u}}{1-e^{-\beta\alpha u}},$$
  <p>da cui, con $P=NT\,\partial_V\log z_1=\dfrac{3NT}{4\pi}\partial_u\log(1-e^{-\beta\alpha u})$ e $NT\beta=N$,</p>
  $$P(R)=\frac{3\alpha N}{4\pi}\,\frac{e^{-\beta\alpha R^3}}{1-e^{-\beta\alpha R^3}}.$$
  <p>La stessa espressione, valutata a raggio $r$ interno invece che a $R$, dà la pressione locale $P(r)$: la pressione decade dal centro verso il bordo come $e^{-\beta\alpha r^3}$, esattamente come la densità di particelle in questo potenziale. È l&rsquo;analogo confinato della relazione barometrica: dove là il potenziale era lineare e la pressione decadeva con la quota, qui è cubico e la pressione decade con la terza potenza del raggio.</p>`},
  {t:'reveal', title:'La densita degli stati, dalla delta', tag:'costruzione', steps:[
   {label:'Da rho(q,p) a rho(epsilon)', body:R`
   <p>La distribuzione di singola particella rispetto all&rsquo;<b>energia</b>, non all&rsquo;impulso, si ottiene inserendo una <span class="str" data-str="delta-di-dirac">delta di Dirac</span> che seleziona i microstati con $H_1=\varepsilon$:</p>
   $$\rho(\varepsilon)=\int\frac{d^3q\,d^3p}{h^3}\,\frac{e^{-\beta H_1}}{z_1}\,\delta(\varepsilon-H_1)=\frac{e^{-\beta\varepsilon}}{h^3 z_1}\int d^3q\,d^3p\,\delta(\varepsilon-H_1)\equiv\frac{e^{-\beta\varepsilon}}{h^3 z_1}\,G(\varepsilon).$$
   <p>Il fattore $e^{-\beta\varepsilon}$ esce dall&rsquo;integrale perché la delta fissa $H_1=\varepsilon$, e ciò che resta, $G(\varepsilon)=\int d^3q\,d^3p\,\delta(\varepsilon-H_1)$, è la <b>densità degli stati</b>: il numero di microstati con energia $\varepsilon$. È pura geometria dello spazio delle fasi — non sa nulla della temperatura — ed è la stessa quantità che comparirebbe con qualunque statistica.</p>`},
   {label:'Il conteggio geometrico', body:R`
   <p>Per il gas libero (o dentro il potenziale, fino a che $\alpha r^3\lt\varepsilon$) la densità degli stati si calcola come volume di un guscio nello spazio degli impulsi. Il numero di stati con $p^2/2m\le\varepsilon$ è il volume della sfera $p\le\sqrt{2m\varepsilon}$, proporzionale a $(2m\varepsilon)^{3/2}$, e la densità è la sua derivata:</p>
   $$G(\varepsilon)\propto\frac{d}{d\varepsilon}(2m\varepsilon)^{3/2}=3m\sqrt{2m\varepsilon}\;\Longrightarrow\;g(\varepsilon)\propto\varepsilon^{1/2}.$$
   <p>La densità degli stati di una particella libera in tre dimensioni cresce come $\varepsilon^{1/2}$. È il fattore che, moltiplicato per il peso di Boltzmann $e^{-\beta\varepsilon}$, dà la distribuzione dell&rsquo;energia $\rho(\varepsilon)\propto\varepsilon^{1/2}e^{-\beta\varepsilon}$, piccata a energia $\sim T$. Il potenziale confinante modifica $G(\varepsilon)$ a energie alte — Crisanti trova che $G(\varepsilon)$ satura oltre $\alpha R^3$, quando la particella «tocca» il bordo della sfera — e questo cambia la coda della distribuzione di energia. <b>Il criterio è che $\delta(\varepsilon-H)=\partial_\varepsilon\theta(\varepsilon-H)$ trasforma il conteggio degli stati nel volume della regione $H\le\varepsilon$</b>, un integrale elementare.</p>`}
  ]},
  {t:'plot', title:'La densita degli stati: libera contro confinata',
   intro:R`In ascissa l'energia $\varepsilon$ (unità arbitrarie); in ordinata la densità degli stati $g(\varepsilon)$. La particella libera cresce come $\sqrt\varepsilon$ senza limite; il potenziale confinante fa crescere $g$ più in fretta a energie basse, poi la satura quando la particella raggiunge il bordo.`,
   plots:[
    {kind:'func2d', xr:[0,3], yr:[0,2.2], height:320, ticks:6,
     title:'densita degli stati g(epsilon), libera e confinata',
     curves:[
      {f:'sqrt(x)', col:'#5eead4', label:'libera: g ~ radice di epsilon, cresce sempre'},
      {f:'sqrt(x)*(1+0.9*x)', col:'#ff6b6b', label:'confinata: cresce piu in fretta a bassa energia'}
     ],
     xlabel:'epsilon (energia)', ylabel:'g(epsilon) densita degli stati'}
   ],
   leggi:R`<p><b>La densità degli stati è geometria, non termodinamica.</b> La curva turchese è la particella libera in tre dimensioni, $g(\varepsilon)\propto\sqrt\varepsilon$: nasce dal fatto che il volume dello spazio degli impulsi con $p\le\sqrt{2m\varepsilon}$ cresce come $\varepsilon^{3/2}$, e la sua derivata come $\varepsilon^{1/2}$. Non compare né $\beta$ né $T$: è il conteggio degli stati, e resterebbe identico con Fermi o Bose.</p>
   <p><b>Il potenziale confinante aggiunge stati a bassa energia.</b> La curva rossa è la particella nel potenziale $\alpha r^3$: a parità di energia ci sono più modi di distribuirla fra cinetica e potenziale, quindi $g$ cresce più in fretta. Questa è la ragione per cui i potenziali confinanti favoriscono la condensazione — spostano stati verso il basso — ed è perché le prove che chiedono la condensazione in dimensione bassa mettono sempre una trappola armonica.</p>
   <p><b>La lettura operativa.</b> Da $g(\varepsilon)$ e dal peso $e^{-\beta\varepsilon}$ si ricostruisce tutta la termodinamica come integrali $\int d\varepsilon\,g(\varepsilon)e^{-\beta\varepsilon}(\dots)$: è la formulazione «per energia» equivalente a quella «per stati», e la si preferisce quando il potenziale rende $g$ non banale.</p>`}
]},

/* ---------------- 07 · LA DENSITA DI PROBABILITA ---------------- */
{ num:'07', title:'La densita di probabilita: gli impulsi sempre Maxwell-Boltzmann, le posizioni no', meta:'la maxwelliana e indipendente dal potenziale · lequipartizione come integrale gaussiano · la densita spaziale e e alla meno beta V',
  blocchi:[
  {t:'prosa', title:'Perche la distribuzione degli impulsi non dipende dal potenziale', tag:'costruzione', html:R`
  <p>C&rsquo;è un fatto che vale la pena isolare, perché sorprende e perché semplifica ogni conto: <b>la distribuzione degli impulsi è sempre la stessa maxwelliana, qualunque sia il potenziale $V(q)$</b>. La ragione è la fattorizzazione della tappa 01. La densità di singola particella è $\rho(\mathbf q,\mathbf p)\propto e^{-\beta p^2/2m}\,e^{-\beta V(q)}$, un prodotto di un fattore che dipende solo da $\mathbf p$ e uno che dipende solo da $\mathbf q$. Marginalizzando sulle posizioni, il fattore $e^{-\beta V}$ si integra via in una costante e resta</p>
  $$\rho(\mathbf p)=\Big(\frac{\beta}{2\pi m}\Big)^{3/2}e^{-\beta p^2/2m},$$
  <p>la <b>distribuzione di Maxwell-Boltzmann</b>, identica al gas libero. Falcioni-Vulpiani (par. 3.3) sottolineano questa universalità: che le particelle siano in una scatola, in un campo gravitazionale o in una trappola armonica, la distribuzione delle <i>velocità</i> è sempre gaussiana con varianza $mk_BT$ per componente. Il potenziale cambia <i>dove</i> stanno le particelle, mai <i>con quale velocità</i> si muovono a una data temperatura. È la separazione fra cinetica e configurazionale, vista sulle probabilità invece che sulle partizioni.</p>`},
  {t:'prosa', title:'Normalizzazione, equipartizione, e la densita spaziale', tag:'costruzione', html:R`
  <p>Che $\rho(\mathbf p)$ sia normalizzata si controlla componente per componente con l&rsquo;integrale gaussiano: $\displaystyle\int_{-\infty}^{+\infty}\sqrt{\frac{\beta}{2\pi m}}\,e^{-\beta p^2/2m}\,dp=1$, l&rsquo;area sotto una gaussiana normalizzata. E l&rsquo;<b>equipartizione</b> esce dallo stesso integrale con il peso $p^2$: l&rsquo;energia cinetica media per componente è</p>
  $$\Big\langle\frac{p_x^2}{2m}\Big\rangle=\int_{-\infty}^{+\infty}\frac{p^2}{2m}\sqrt{\frac{\beta}{2\pi m}}\,e^{-\beta p^2/2m}\,dp=\frac{1}{2\beta}=\frac12 T.$$
  <p>Tre componenti danno $\tfrac32 T$, ed è sempre così, in qualunque potenziale: l&rsquo;energia <b>cinetica</b> media di una particella è $\tfrac32 T$ a prescindere da $V$. Ciò che il potenziale aggiunge è l&rsquo;energia <b>potenziale</b> media, $\langle V\rangle$, che dipende dalla forma di $V$ — $T$ per la gravità, $\tfrac32 T$ per l&rsquo;oscillatore isotropo tridimensionale, e così via.</p>
  <p>La parte spaziale, invece, porta tutta l&rsquo;informazione sul potenziale. Marginalizzando sugli impulsi si trova la <b>densità di particelle</b> $n(\mathbf r)\propto e^{-\beta V(\mathbf r)}$: le particelle si accumulano dove il potenziale è basso, con peso di Boltzmann dell&rsquo;energia potenziale. Per la gravità è la relazione barometrica $e^{-\beta mgz}$; per l&rsquo;oscillatore è la gaussiana $e^{-\beta m\omega^2 r^2/2}$; per un confinamento cubico è $e^{-\beta\alpha r^3}$. <b>Una sola formula, $n(\mathbf r)\propto e^{-\beta V}$, contiene tutti i profili di densità dei casi precedenti</b> — e ottenerli come suoi casi particolari, invece che riderivarli ogni volta, è il segno che il mestiere è capito.</p>`},
  {t:'plot', title:'La maxwelliana degli impulsi a tre temperature',
   intro:R`In ascissa il modulo dell'impulso $p$ (unità arbitrarie); in ordinata la densità radiale $\propto p^2 e^{-\beta p^2/2m}$ per tre temperature crescenti. È la stessa per ogni potenziale: cambia solo con $T$.`,
   plots:[
    {kind:'func2d', xr:[0,4], yr:[0,1.05], height:320, ticks:6,
     title:'distribuzione radiale degli impulsi, universale',
     curves:[
      {f:'pow(x,2)*exp(-x*x/0.3)*1.5', col:'#5eead4', label:'T bassa: picco stretto, vicino a zero'},
      {f:'pow(x,2)*exp(-x*x/0.9)*0.55', col:'#d8a13a', label:'T media'},
      {f:'pow(x,2)*exp(-x*x/1.8)*0.28', col:'#ff6b6b', label:'T alta: picco largo e spostato'}
     ],
     xlabel:'p (impulso)', ylabel:'densita radiale (normalizzata)'}
   ],
   leggi:R`<p><b>Questa curva è la stessa in ogni problema di questo movimento.</b> Buca, oscillatore, gravità, confinamento: la distribuzione degli impulsi è sempre questa maxwelliana, perché la parte cinetica di $H_1$ non cambia mai. Il fattore $p^2$ (superficie della sfera di raggio $p$) spinge il picco lontano dall&rsquo;origine, il fattore gaussiano $e^{-\beta p^2/2m}$ lo taglia in alto, e il compromesso è la velocità più probabile.</p>
   <p><b>La temperatura è la larghezza, non il centro.</b> Alzando $T$ la gaussiana si allarga e il picco si sposta a destra: la varianza degli impulsi è $mk_BT$ per componente. La temperatura è la dispersione delle velocità, e il gas non deriva in alcuna direzione — la velocità media vettoriale è nulla.</p>
   <p><b>Perché conta.</b> Sapere che la maxwelliana è universale significa che tutte le grandezze cinetiche — velocità media, velocità quadratica media, flusso su una parete — si calcolano una volta sola e valgono per qualunque potenziale. Il conto specifico del problema è sempre e solo nella parte spaziale, $n(\mathbf r)\propto e^{-\beta V}$.</p>`}
]},

/* ---------------- 08 · IL PASSAGGIO AL RELATIVISTICO ---------------- */
{ num:'08', title:'Il passaggio al relativistico: cambia lenergia cinetica, non il metodo', meta:'epsilon uguale c p e lintegrale gamma · energia tre NT il doppio · la pressione geometrica invariata · la regola d su alpha',
  blocchi:[
  {t:'prosa', title:'La dispersione lineare e la gamma', tag:'costruzione', html:R`
  <p>Finora l&rsquo;energia cinetica è stata sempre $p^2/2m$, quadratica, e ha dato integrali gaussiani. Il gas ultrarelativistico cambia proprio questo: la dispersione è <b>lineare</b>, $\varepsilon=c|\mathbf p|$, e con essa cambia la famiglia dell&rsquo;integrale cinetico — da gaussiana a gamma. È l&rsquo;esercizio di Crisanti §3.15.1, la seconda metà della domanda d&rsquo;orale sul gas relativistico (la prima è nel microcanonico, con il punto di sella). Per $N$ particelle libere con $H=\sum_i c|\mathbf p_i|$ in un volume $V$, la partizione di singola particella è</p>
  $$z_1=\frac{V}{h^3}\int d^3p\,e^{-\beta c|\mathbf p|}=\frac{V}{h^3}\,4\pi\int_0^\infty p^2 e^{-\beta c p}\,dp=\frac{V}{h^3}\,4\pi\cdot\frac{2}{(\beta c)^3}=\frac{8\pi V}{h^3(\beta c)^3},$$
  <p>dove l&rsquo;integrale radiale è la <span class="str" data-str="funzione-gamma">funzione gamma</span> $\displaystyle\int_0^\infty p^2 e^{-\beta c p}\,dp=\dfrac{2}{(\beta c)^3}=\dfrac{\Gamma(3)}{(\beta c)^3}$. La misura sferica $4\pi p^2$ porta il peso $p^2$, e con la dispersione lineare esce $\Gamma(3)=2$ invece della gaussiana. La partizione totale è $Z_N=\dfrac{1}{N!}\Big(\dfrac{8\pi V}{h^3 c^3}\Big)^N\beta^{-3N}$.</p>`},
  {t:'prosa', title:'Energia doppia, pressione uguale', tag:'costruzione', html:R`
  <p>Il logaritmo è $\log Z_N=N\log(8\pi V/h^3c^3)-3N\log\beta-\log N!$, con una potenza $\beta^{-3}$ per particella (contro $\beta^{-3/2}$ del monoatomico). L&rsquo;energia media è</p>
  $$E=-\frac{\partial\log Z_N}{\partial\beta}=-\frac{\partial}{\partial\beta}\big(-3N\log\beta\big)=\frac{3N}{\beta}=3NT,$$
  <p>e il calore specifico $C_V=\dfrac{\partial E}{\partial T}=3N$, la derivata di $3NT$. È il <b>doppio</b> del gas monoatomico non relativistico ($\tfrac32 N$): la dispersione lineare paga tre gradi «pieni» invece di tre «mezzi». È la regola d&rsquo;oro della gamma: con $\varepsilon\propto p^\alpha$ in $d$ dimensioni l&rsquo;energia per particella è $\dfrac{d}{\alpha}T$, e $\alpha=1$, $d=3$ dà $3T$; $\alpha=2$ (non relativistico) dà $\tfrac32 T$. La <b>pressione</b>, invece, è identica: dalla parte di $F=-T\log Z$ che dipende dal volume, $-NT\log V$, si ha $\dfrac{\partial F}{\partial V}=-\dfrac{NT}{V}$ e $P=\dfrac{NT}{V}$, cioè $PV=NT$ come sempre.</p>
  <p>La lezione è netta: <b>l&rsquo;equazione di stato è geometrica</b>, dipende solo dal fatto che il gas riempie $V$ senza interagire, e non sa nulla della dispersione; l&rsquo;<b>energia interna è dinamica</b>, dipende da come l&rsquo;energia scala con l&rsquo;impulso. Cambiare $H_1$ da $p^2/2m$ a $c|p|$ raddoppia l&rsquo;energia e il calore specifico ma lascia $PV=NT$ intatta. È lo stesso principio del gas in gravità (tappa 05): là il potenziale alzava $C_V$ senza toccare la pressione media.</p>`},
  {t:'plot', title:'Gli integrandi cinetici: quadratico contro lineare',
   intro:R`In ascissa il modulo dell'impulso $p$ (unità arbitrarie); in ordinata l'integrando radiale $p^2 e^{-\beta\varepsilon(p)}$, per dispersione quadratica ($\varepsilon=p^2/2m$, gaussiana) e lineare ($\varepsilon=c p$, gamma). La coda più pesante del caso lineare è la ragione dell'energia doppia.`,
   plots:[
    {kind:'func2d', xr:[0,4], yr:[0,1.05], height:320, ticks:6,
     title:'integrando radiale, dispersione quadratica e lineare',
     curves:[
      {f:'pow(x,2)*exp(-x*x/1.0)*1.1', col:'#5eead4', label:'non relativistico: p^2 e^(-beta p^2/2m), taglio gaussiano'},
      {f:'pow(x,2)*exp(-1.1*x)*0.9', col:'#ff6b6b', label:'relativistico: p^2 e^(-beta c p), coda esponenziale'}
     ],
     xlabel:'p (impulso)', ylabel:'integrando radiale (normalizzato)'}
   ],
   leggi:R`<p><b>La differenza sta nella coda.</b> La curva turchese è l&rsquo;integrando del gas ordinario: il taglio gaussiano $e^{-\beta p^2/2m}$ è brutale, e gli impulsi grandi sono soppressi fortissimo. La curva rossa è il relativistico: il taglio $e^{-\beta c p}$ è solo esponenziale, molto più dolce, e lascia sopravvivere impulsi più grandi. Più coda significa più energia media — è l&rsquo;origine del fattore $2$ fra $3T$ e $\tfrac32 T$.</p>
   <p><b>Le due famiglie di integrali, viste in faccia.</b> Sotto la curva turchese c&rsquo;è un integrale gaussiano ($\Gamma(3/2)$ travestita); sotto la rossa un integrale gamma puro ($\Gamma(3)=2$). Lo stesso peso $p^2$ della misura sferica, ma un esponente diverso: quadratico contro lineare. Riconoscere quale delle due si sta facendo, guardando come $\varepsilon$ dipende da $p$, è esattamente il mestiere di questo movimento.</p>
   <p><b>La lettura operativa.</b> Ogni volta che la dispersione non è $p^2/2m$ — relativistica, o $\varepsilon\propto p^\alpha$ in generale — l&rsquo;integrale cinetico passa alla famiglia gamma, e l&rsquo;energia per particella diventa $(d/\alpha)T$. La pressione resta $NT/V$ perché non passa dall&rsquo;integrale sugli impulsi ma da quello sul volume.</p>`}
]},

/* ---------------- 09 · ESERCIZI ---------------- */
{ num:'09', title:'Esercizi — tocca a te', meta:'loscillatore anisotropo tridimensionale · laltezza media nel campo gravitazionale · il gas relativistico in due dimensioni',
  blocchi:[
  {t:'esercizio', title:'1 · Loscillatore armonico anisotropo in tre dimensioni',
   src:'la variante del caso 2: tre frequenze diverse, e il conteggio dei gradi di liberta',
   testo:R`$N$ oscillatori tridimensionali classici indipendenti hanno hamiltoniana $H_1=\dfrac{\mathbf p^2}{2m}+\dfrac12 m(\omega_x^2 x^2+\omega_y^2 y^2+\omega_z^2 z^2)$. Calcola la funzione di partizione, l'energia media e il calore specifico. Il risultato dipende dalle tre frequenze?`,
   steps:[
    {label:'La partizione fattorizza asse per asse', body:R`
    <p>Sia la cinetica sia il potenziale sono somme di termini lungo i tre assi, quindi $z_1$ è il prodotto di tre partizioni unidimensionali, una per frequenza. Ciascuna è quella del caso 2, $\dfrac{1}{\beta\hbar\omega_i}$, dunque</p>
    $$z_1=\frac{1}{\beta\hbar\omega_x}\cdot\frac{1}{\beta\hbar\omega_y}\cdot\frac{1}{\beta\hbar\omega_z}=\frac{1}{\beta^3\hbar^3\omega_x\omega_y\omega_z},\qquad Z_N=\frac{z_1^N}{N!}.$$
    <p>Le tre frequenze entrano solo in una costante moltiplicativa $\hbar^3\omega_x\omega_y\omega_z$, che nel logaritmo diventa un addendo indipendente da $\beta$.</p>`},
    {label:'Energia e calore specifico', body:R`
    <p>Il logaritmo è $\log Z_N=-3N\log\beta+\text{cost}-\log N!$: la dipendenza da $\beta$ è la stessa qualunque siano le frequenze. L&rsquo;energia media è</p>
    $$E=-\frac{\partial\log Z_N}{\partial\beta}=-\frac{\partial}{\partial\beta}\big(-3N\log\beta\big)=-\frac{3N}{\beta}\cdot(-1)=\frac{3N}{\beta}=3NT,$$
    <p>dunque $C_V=3N$. <b>Il risultato non dipende dalle frequenze</b>: è l&rsquo;equipartizione, che assegna $\tfrac12 T$ a ciascuno dei sei gradi quadratici (tre cinetici, tre potenziali) a prescindere dalla loro rigidità. Le frequenze contano per l&rsquo;energia libera (e quindi per l&rsquo;entropia, tramite la costante additiva), ma non per l&rsquo;energia interna né per il calore specifico. Il criterio invocato è l&rsquo;equipartizione: ogni termine quadratico nell&rsquo;hamiltoniana vale $\tfrac12 T$, e il coefficiente del quadrato è irrilevante.</p>`}
   ]},
  {t:'esercizio', title:'2 · Laltezza media nel campo gravitazionale',
   src:'il completamento del caso 3: dalla densita barometrica al valor medio con due gamma',
   testo:R`Per il gas in campo gravitazionale del caso 3, con densità $n(z)\propto e^{-\beta mgz}$ su $z\in[0,\infty)$, calcola l'altezza media $\langle z\rangle$ di una particella e l'energia potenziale media $\langle mgz\rangle$. Interpreta il risultato.`,
   steps:[
    {label:'Il rapporto di due integrali gamma', body:R`
    <p>L&rsquo;altezza media è il valor medio di $z$ sulla densità barometrica normalizzata, cioè il rapporto fra due integrali esponenziali (due gamma):</p>
    $$\langle z\rangle=\frac{\displaystyle\int_0^\infty z\,e^{-\beta mgz}\,dz}{\displaystyle\int_0^\infty e^{-\beta mgz}\,dz}.$$
    <p>Il denominatore è $\dfrac{1}{\beta mg}$ (già visto, $\Gamma(1)$). Il numeratore è la gamma successiva, $\displaystyle\int_0^\infty z\,e^{-az}\,dz=\dfrac{1}{a^2}=\Gamma(2)/a^2$ con $a=\beta mg$. Il rapporto è quindi</p>
    $$\langle z\rangle=\frac{1/(\beta mg)^2}{1/(\beta mg)}=\frac{1}{\beta mg}=\frac{k_BT}{mg}.$$`},
    {label:'Linterpretazione', body:R`
    <p>L&rsquo;altezza media è $\langle z\rangle=k_BT/mg$, esattamente la <b>scala di altezza</b> della relazione barometrica: le particelle stanno, in media, alla quota su cui la densità è calata di un fattore $e$. L&rsquo;energia potenziale media segue subito, $\langle mgz\rangle=mg\langle z\rangle=k_BT=T$: il campo gravitazionale immagazzina in media un $T$ per particella, che è proprio il grado di libertà in più responsabile di $C_V=\tfrac52 N$ (tappa 05). <b>Il criterio è l&rsquo;equipartizione generalizzata per un potenziale lineare</b>: un termine $\propto z$ nell&rsquo;energia contribuisce $T$ alla media, e lo si vede qui come rapporto $\Gamma(2)/\Gamma(1)$ diviso $a$.</p>`}
   ]},
  {t:'esercizio', title:'3 · Il gas ultrarelativistico in due dimensioni',
   src:'la regola d su alpha messa alla prova: cambiare dimensione invece che dispersione',
   testo:R`$N$ particelle libere ultrarelativistiche, $\varepsilon=c|\mathbf p|$, sono confinate su una superficie di area $A$ (due dimensioni). Calcola la funzione di partizione, l'energia media e il calore specifico. Confronta con il caso tridimensionale e verifica la regola $E=(d/\alpha)NT$.`,
   steps:[
    {label:'La partizione con la misura circolare', body:R`
    <p>In due dimensioni la misura degli impulsi è quella circolare, $d^2p=2\pi p\,dp$, con il peso $p$ (non $p^2$). La partizione di singola particella è</p>
    $$z_1=\frac{A}{h^2}\int d^2p\,e^{-\beta c|\mathbf p|}=\frac{A}{h^2}\,2\pi\int_0^\infty p\,e^{-\beta c p}\,dp=\frac{A}{h^2}\,2\pi\cdot\frac{1}{(\beta c)^2}=\frac{2\pi A}{h^2(\beta c)^2},$$
    <p>dove l&rsquo;integrale radiale è ora $\displaystyle\int_0^\infty p\,e^{-\beta c p}\,dp=\dfrac{1}{(\beta c)^2}=\Gamma(2)/(\beta c)^2$: il peso $p$ della misura circolare abbassa l&rsquo;argomento della gamma da $\Gamma(3)$ a $\Gamma(2)$.</p>`},
    {label:'Energia, calore specifico, e la regola', body:R`
    <p>Il logaritmo è $\log Z_N=-2N\log\beta+\text{cost}-\log N!$ (potenza $\beta^{-2}$ per particella), quindi</p>
    $$E=-\frac{\partial\log Z_N}{\partial\beta}=-\frac{\partial}{\partial\beta}\big(-2N\log\beta\big)=\frac{2N}{\beta}=2NT,\qquad C_V=2N.$$
    <p>Verifica della regola: con $\varepsilon\propto p^\alpha$ in $d$ dimensioni l&rsquo;energia è $(d/\alpha)NT$. Qui $\alpha=1$, $d=2$, dunque $E=2NT$ — confermato. In tre dimensioni era $E=3NT$; scendendo di una dimensione si perde un $T$ per particella, come atteso, perché sparisce un grado di libertà traslazionale. <b>Il criterio è la regola d&rsquo;oro della gamma</b>: la potenza dell&rsquo;esponente ($\alpha$) e la dimensione ($d$, che fissa il peso $p^{d-1}$ della misura) determinano insieme l&rsquo;argomento della funzione gamma, e quindi l&rsquo;energia media.</p>`}
   ]}
]},

/* ---------------- 10 · IL SENSO E LE ROTTE ---------------- */
{ num:'10', title:'Il senso, e le rotte', meta:'cosa lascia in mano, e dove il mestiere degli integrali diventa fisica',
  blocchi:[
  {t:'prosa', title:'Cosa portarsi via', tag:'sintesi', html:R`
  <p><b>Il punto.</b> Il canonico ha una regola sola, ma risolverlo è un mestiere: dato $H_1=p^2/2m+V(q)$, si fattorizza $z_1$ in una parte cinetica (sempre gaussiana) e una configurazionale (dove entra il potenziale), si riconosce a quale delle tre famiglie appartiene l&rsquo;integrale — gaussiano se l&rsquo;esponente è quadratico, gamma se è una potenza o è lineare, volume se il potenziale è a tratti — e si svolge. Da $z_1$ tutto discende nella sequenza $Z_N=z_1^N/N!\to E\to S\to n(\mathbf r)\to P$.</p>
  <p><b>Che cosa ricordare.</b> Le due famiglie di integrali: la gaussiana $\int e^{-ax^2}dx=\sqrt{\pi/a}$ per le energie quadratiche, e la gamma $\int_0^\infty x^k e^{-ax}dx=\Gamma(k+1)/a^{k+1}$ per potenze e dispersioni non quadratiche. La regola d&rsquo;oro dell&rsquo;energia: con $\varepsilon\propto p^\alpha$ in $d$ dimensioni ogni particella porta $(d/\alpha)T$, e un potenziale $V\propto r^n$ ne aggiunge $(d/n)T$ — mezzo grado per ogni termine quadratico, un grado intero per ogni termine lineare. I quattro profili di densità come casi di $n(\mathbf r)\propto e^{-\beta V}$: uniforme nella buca, gaussiano nell&rsquo;oscillatore, barometrico nella gravità, $e^{-\beta\alpha r^n}$ nel confinamento. E che la maxwelliana degli impulsi è universale: il potenziale cambia solo dove stanno le particelle, mai con quale velocità. <b>Di un movimento lungo, ciò che resta è: guarda $V(q)$, decidi la famiglia dell&rsquo;integrale, e svolgi.</b></p>`},
  {t:'prolessi', title:'Dove riappare questo movimento',
   oggetto:R`<b>La partizione di singola particella in un potenziale</b>: riconoscere l&rsquo;integrale configurazionale e chiuderlo, e leggere da lui energia, densità e pressione.`,
   rotte:[
    {dove:'Trappole atomiche<br>e condensati', txt:R`I gas ultrafreddi si tengono in <b>trappole armoniche</b>, e la densità degli stati in un potenziale $\tfrac12 m\omega^2 r^2$ cresce come $\varepsilon^2$ invece di $\varepsilon^{1/2}$: è questo che rende possibile la condensazione di Bose-Einstein in una trappola anche dove in una scatola non avverrebbe. L&rsquo;integrale gamma con l&rsquo;argomento del potenziale è ciò che decide la temperatura critica.`},
    {dove:'Atmosfere<br>stellari e planetarie', txt:R`La relazione barometrica $n(z)\propto e^{-\beta mgz}$ è il primo passo dell&rsquo;equilibrio idrostatico. Nelle stelle il campo non è uniforme e la temperatura varia con la quota, ma la struttura resta quella: peso di Boltzmann dell&rsquo;energia potenziale gravitazionale. La scala di altezza $k_BT/mg$ governa lo spessore delle atmosfere.`},
    {dove:'Densita degli stati<br>e statistiche quantistiche', txt:R`La $G(\varepsilon)$ calcolata qui con la delta è puramente geometrica, e resta identica passando da Boltzmann a Fermi o Bose. È l&rsquo;ingresso della teoria dei gas quantistici: l&rsquo;energia di Fermi, il calore specifico elettronico $\propto T$, il corpo nero — tutti si scrivono come integrali $\int d\varepsilon\,g(\varepsilon)\,f(\varepsilon)$ con la stessa $g(\varepsilon)\propto\varepsilon^{1/2}$.`},
    {dove:'Materia relativistica<br>e astrofisica', txt:R`Il gas relativistico $\varepsilon=c|p|$, con $E=3NT$ e $PV=NT$, è il modello della materia a energie altissime: il plasma primordiale, l&rsquo;interno delle stelle di neutroni, il gas di fotoni. La transizione da $\varepsilon=p^2/2m$ a $\varepsilon=cp$ — dalla gaussiana alla gamma — è la stessa che separa un gas freddo da uno ultrarelativistico degenere.`}
   ],
   domanda:R`La partizione di singola particella si è sempre fattorizzata perché $H_1=p^2/2m+V(q)$ separa impulso e posizione, e le particelle non interagivano: $Z_N=z_1^N/N!$. <b>Domanda che porti avanti:</b> cosa succede quando il potenziale non è esterno ma <b>fra le particelle</b>, $V=\sum_{i\lt j}U(|q_i-q_j|)$? La fattorizzazione cade, l&rsquo;integrale configurazionale diventa un integrale a $3N$ dimensioni che non si spezza, e compare l&rsquo;<b>integrale di configurazione</b> $Q_N=\int\prod_i d^3q_i\,e^{-\beta\sum U_{ij}}$. Svilupparlo in potenze della densità è lo <b>sviluppo del viriale</b>, e i suoi coefficienti misurano le deviazioni dal gas ideale: è l&rsquo;inizio della teoria dei gas reali, delle transizioni di fase, e della meccanica statistica dei sistemi interagenti — dove il mestiere degli integrali di questo movimento incontra il suo limite, e comincia la fisica difficile.`}
]}

];
