   {label:'Per righe: da uno stato prodotto agli stati accoppiati', body:R`
   <p>Una riga dà la decomposizione di uno stato prodotto negli stati accoppiati, la (4.186): <i>«these tables also work the other way around»</i>. L&rsquo;esempio di Griffiths è la riga $m_{1}=\tfrac12$, $m_{2}=0$ della tavola $\tfrac32\times1$:</p>
   $$|\tfrac32\,\tfrac12\rangle|1\,0\rangle=\sqrt{\tfrac35}\,|\tfrac52\,\tfrac12\rangle+\sqrt{\tfrac{1}{15}}\,|\tfrac32\,\tfrac12\rangle-\sqrt{\tfrac13}\,|\tfrac12\,\tfrac12\rangle,$$
   <p>e misurando lo spin totale <i>«you could get 5/2 (with probability 3/5), or 3/2 (with probability 1/15), or 1/2 (with probability 1/3). Again, the sum of the probabilities is 1 (the sum of the squares of each row on the Clebsch-Gordan table is 1)»</i>. Che si possa leggere la stessa tavola nei due versi è la realtà dei coefficienti: la matrice è ortogonale, e la sua inversa è la trasposta.</p>`},
   {label:'Quale verso serve in un compito', body:R`
   <p>Il verso lo decide la domanda. Se lo stato iniziale è un prodotto e la hamiltoniana è diagonale nella base accoppiata, si legge per righe: si decompone lo stato iniziale in autostati dell&rsquo;energia, si fa evolvere ciascuno con la sua fase, e poi si torna indietro per colonne se si chiede la probabilità di un risultato per una sola particella. Se lo stato iniziale ha $J$ e $M$ dati e si misura una componente di uno dei due momenti, basta una colonna. Il compito del 30-01-2018, nella tappa 08, usa la tavola in entrambi i versi e anche la $1\times\tfrac12$ per i momenti di ciascuna particella.</p>`}
  ]},
  {t:'prosa', title:'Tre cose che la tavola non scrive', tag:'tavola', html:R`
  <p><b>Gli $M$ negativi.</b> Per ogni blocco la tavola stampa le colonne con $M\geq0$, o una metà della griglia, e lascia il resto alla simmetria per cambio di segno di tutti gli $m$: $\langle j_{1}j_{2},-m_{1},-m_{2}|J,-M\rangle=(-1)^{J-j_{1}-j_{2}}\langle j_{1}j_{2}m_{1}m_{2}|JM\rangle$, la (15.2.11) di Shankar letta all&rsquo;inverso. Il fattore è $+1$ per il multipletto più alto e alterna scendendo di $J$. Nella composizione $\tfrac12\times\tfrac12$, per il singoletto il fattore vale $(-1)^{0-1}=-1$, e infatti in $|0,0\rangle$ il coefficiente di $(+\tfrac12,-\tfrac12)$ è $+\sqrt{1/2}$ e quello di $(-\tfrac12,+\tfrac12)$ è $-\sqrt{1/2}$.</p>
  <p><b>L&rsquo;ordine inverso dei due momenti.</b> La tavola ha il blocco $1\times\tfrac12$ e non il blocco $\tfrac12\times1$, ha $\tfrac32\times\tfrac12$ e non $\tfrac12\times\tfrac32$. Per l&rsquo;ordine opposto si usa la relazione stampata in testa:</p>
  $$\langle j_{1}j_{2}m_{1}m_{2}|j_{1}j_{2}JM\rangle=(-1)^{J-j_{1}-j_{2}}\langle j_{2}j_{1}m_{2}m_{1}|j_{2}j_{1}JM\rangle .$$
  <p>È qui che si sbaglia più spesso, perché i moduli sono gli stessi e l&rsquo;errore riguarda solo i segni. Un esempio che servirà nella tappa 08: componendo $j_{1}=\tfrac12$ con $j_{2}=\tfrac32$ in quest&rsquo;ordine, lo stato $|\tfrac12,\tfrac12\rangle|\tfrac32,-\tfrac12\rangle$ è $(|2,0\rangle+|1,0\rangle)/\sqrt2$. Nell&rsquo;ordine della tavola, con $\tfrac32$ per primo, lo stesso stato prodotto si scrive $(|2,0\rangle-|1,0\rangle)/\sqrt2$: il fattore $(-1)^{J-j_{1}-j_{2}}$ vale $+1$ per $J=2$ e $-1$ per $J=1$. Le probabilità di trovare $J=2$ o $J=1$ sono un mezzo in entrambi i casi; l&rsquo;evoluzione temporale e le probabilità di una componente singola no, se si mescolano coefficienti presi nei due ordini.</p>
  <p><b>La radice e il segno.</b> La nota della tavola va ripetuta: il numero $-8/15$ significa $-\sqrt{8/15}$, non $-8/15$ e non $\sqrt{-8/15}$, e la probabilità è $8/15$. In un compito il modo più rapido di controllare di aver letto bene è sommare i numeri di una colonna senza segno: deve venire uno.</p>`},
  {t:'reveal', title:'Le altre due cose sulla stessa pagina', tag:'rotazioni', steps:[
   {label:'Le armoniche sferiche', body:R`
   <p>Le armoniche della tavola sono quelle con la fase di Condon e Shortley: $Y_{1}^{1}=-\sqrt{3/8\pi}\,\sin\theta\,e^{i\phi}$, con il segno meno, e la regola $Y_{\ell}^{-m}=(-1)^{m}Y_{\ell}^{m*}$. È la stessa convenzione dei coefficienti, e non è un caso: il segno meno di $Y_{1}^{1}$ viene dall&rsquo;operatore di salita, che porta $Y_{1}^{0}$ in $Y_{1}^{1}$ con un coefficiente positivo. Le armoniche entrano nelle funzioni spin-angolari della tappa precedente, e chi usa armoniche con un&rsquo;altra fase deve cambiare i segni di quelle funzioni.</p>`},
   {label:'Le funzioni d', body:R`
   <p>Le funzioni $d^{j}_{m'm}(\theta)$, cioè gli elementi $\langle jm'|e^{-i\theta J_{y}/\hbar}|jm\rangle$, sono gli elementi della matrice di rotazione di un angolo $\theta$ attorno a $y$. Per $j=\tfrac12$ la tavola dà $d^{1/2}_{1/2,1/2}=\cos\tfrac\theta2$ e $d^{1/2}_{1/2,-1/2}=-\sin\tfrac\theta2$; per $j=1$, $d^{1}_{1,1}=\tfrac{1+\cos\theta}{2}$, $d^{1}_{1,0}=-\tfrac{\sin\theta}{\sqrt2}$, $d^{1}_{1,-1}=\tfrac{1-\cos\theta}{2}$. Con le armoniche le collega la relazione stampata $d^{\ell}_{m,0}=\sqrt{4\pi/(2\ell+1)}\,Y_{\ell}^{m}e^{-im\phi}$. Stanno sulla stessa pagina dei coefficienti perché le due cose sono legate: la serie di Clebsch-Gordan, nella tappa successiva, scrive il prodotto di due matrici di rotazione come somma di matrici di rotazione con coefficienti di Clebsch-Gordan.</p>`}
  ]},
  {t:'plot', title:'Le funzioni d di spin uno come probabilità',
   intro:R`<p>Quadrati delle funzioni $d^{1}_{m,1}(\theta)$ della tavola, cioè le probabilità di trovare $m=1$ (blu), $m=0$ (arancio), $m=-1$ (verde) lungo $z$ per uno stato con $m=1$ lungo un asse ruotato di $\theta$ attorno a $y$. In grigio la somma.</p>`,
   plots:[{kind:'func2d', xr:[0,3.1416], yr:[0,1.05], height:250, ticks:true,
     title:'|d1_{m,1}(theta)|^2',
     curves:[{f:'Math.pow((1+Math.cos(x))/2,2)', col:'#5aa9ff', width:2.4, label:'m = 1'},
             {f:'Math.pow(Math.sin(x),2)/2', col:'#ffb86b', width:2.4, label:'m = 0'},
             {f:'Math.pow((1-Math.cos(x))/2,2)', col:'#6bdc9b', width:2.4, label:'m = -1'},
             {f:'Math.pow((1+Math.cos(x))/2,2)+Math.pow(Math.sin(x),2)/2+Math.pow((1-Math.cos(x))/2,2)', col:'#999999', width:1.2, label:'somma'}],
     xlabel:'theta (radianti)', ylabel:'probabilita'}],
   leggi:R`<p><b>Che cosa guardare.</b> A $\theta=0$ lo stato è quello di partenza, a $\theta=\pi$ è capovolto. A $\theta=\pi/2$ le probabilità sono $\tfrac14,\tfrac12,\tfrac14$: un momento angolare $1$ con $m=1$ lungo $x$, misurato lungo $z$. La somma è sempre uno, perché la matrice di rotazione è unitaria.</p>
   <p><b>Che cosa impararne.</b> Le funzioni $d$ sono la versione «per rotazioni» dei coefficienti di Clebsch-Gordan: dicono come uno stato con $m$ dato lungo un asse si decompone lungo un altro. I numeri $\tfrac14,\tfrac12,\tfrac14$ sono i quadrati dei coefficienti binomiali divisi per $4$: uno spin $1$ con $m=1$ si comporta, per le rotazioni, come due spin $\tfrac12$ paralleli, e le probabilità sono quelle di trovare $0$, $1$ o $2$ spin girati.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Con la tavola $1\times\tfrac12$: un elettrone con $l=1$, $m_{l}=1$ e $m_{s}=-\tfrac12$. Che valori di $j$ si trovano, e con che probabilità?`,
    a:R`Si legge la riga $m_{1}=+1$, $m_{2}=-\tfrac12$, che sta nelle colonne con $M=\tfrac12$: i numeri sono $1/3$ sotto $J=\tfrac32$ e $2/3$ sotto $J=\tfrac12$. Quindi $j=\tfrac32$ con probabilità $\tfrac13$ e $j=\tfrac12$ con probabilità $\tfrac23$. Con la formula chiusa: il coefficiente di $m_{s}=-\tfrac12$ in $j=l+\tfrac12$ è $\sqrt{(l-M+\tfrac12)/(2l+1)}=\sqrt{1/3}$.`},
   {q:R`Si deve comporre $j_{1}=1$ con $j_{2}=2$, e la tavola ha solo il blocco $2\times1$. Che cosa si fa?`,
    a:R`Si usa il blocco $2\times1$ scambiando i ruoli di $m_{1}$ e $m_{2}$, e si moltiplica ogni coefficiente per $(-1)^{J-j_{1}-j_{2}}=(-1)^{J-3}$: segno invariato per $J=3$ e $J=1$, cambiato per $J=2$. Oppure si tiene l&rsquo;ordine $2\times1$ in tutto il problema, chiamando particella $1$ quella con momento $2$: è la scelta più sicura, purché la si mantenga dall&rsquo;inizio alla fine.`}
  ]}
]},
/* ---------------- 07 · A CHE COSA SERVONO ---------------- */
{ num:'07', title:'A che cosa servono: geometria separata dalla dinamica', meta:'la serie di Clebsch-Gordan e le matrici di rotazione · l integrale di tre armoniche sferiche · il teorema di Wigner-Eckart in due normalizzazioni · le regole di selezione di dipolo · il teorema di proiezione e il fattore di Lande',
  blocchi:[
  {t:'prosa', title:'Perché i coefficienti escono dagli esercizi', tag:'architettura', html:R`
  <p>Griffiths chiude la sua presentazione con un&rsquo;ammissione: <i>«if you think this is starting to sound like mystical numerology, I don&rsquo;t blame you. We will not be using the Clebsch-Gordan tables much in the rest of the book»</i>. E aggiunge che <i>«in a mathematical sense this is all applied group theory — what we are talking about is the decomposition of the direct product of two irreducible representations of the rotation group into a direct sum of irreducible representations (you can quote that, to impress your friends)»</i>. Sakurai, all&rsquo;inizio del §3.8, è di opinione opposta: la composizione dei momenti angolari <i>«has important applications in all areas of modern physics — from atomic spectroscopy to nuclear and particle collisions»</i>. La differenza si spiega con quello che i due libri fanno dopo. Sakurai usa i coefficienti per dimostrare il teorema di Wigner-Eckart, e da lì per le regole di selezione e il fattore di Landé; Griffiths non tratta gli operatori tensoriali. Questa tappa segue la strada di Sakurai e di Ballentine.</p>`},
  {t:'reveal', title:'La serie di Clebsch-Gordan', tag:'rotazioni', steps:[
   {label:'Il prodotto di due rotazioni', body:R`
   <p>Lo spazio prodotto ruota con il prodotto tensoriale delle due matrici di rotazione, $\mathcal D^{(j_{1})}(R)\otimes\mathcal D^{(j_{2})}(R)$, <i>«notice the appearance of the same axis of rotation and the same angle of rotation»</i>. Questa matrice è riducibile: nella base accoppiata diventa diagonale a blocchi, con un blocco $\mathcal D^{(j)}$ per ogni $j$ da $j_{1}+j_{2}$ a $|j_{1}-j_{2}|$. Sakurai lo scrive in notazione di teoria dei gruppi, $\mathcal D^{(j_{1})}\otimes\mathcal D^{(j_{2})}=\mathcal D^{(j_{1}+j_{2})}\oplus\dots\oplus\mathcal D^{(|j_{1}-j_{2}|)}$, la (3.8.68), e Landau nello stesso modo nel §106. Shankar lo dice con i due spin: le matrici di rotazione $4\times4$ <i>«are, however, reducible: by changing to the total-$s$ basis, they may be block diagonalized into a $3\times3$ block (spin-1 sector) and a $1\times1$ block (spin-0 sector)»</i>.</p>
   <p>Per due spin $\tfrac12$ e una rotazione di $\theta$ attorno a $y$ il conto si fa: con la matrice $U$ dei coefficienti, $U^{T}\big(d^{1/2}(\theta)\otimes d^{1/2}(\theta)\big)U$ è la matrice a blocchi con $d^{1}(\theta)$ in alto e $1$ in basso. Il singoletto non cambia per rotazioni, e il tripletto ruota come uno spin $1$.</p>`},
   {label:'Gli elementi di matrice', body:R`
   <p>Scritta elemento per elemento, la riduzione è la serie di Clebsch-Gordan, la (3.8.69) di Sakurai e la (7.113) di Ballentine: il prodotto $\mathcal D^{(j_{1})}_{m_{1}m_{1}'}\mathcal D^{(j_{2})}_{m_{2}m_{2}'}$ è una somma su $j$ di elementi $\mathcal D^{(j)}_{mm'}$ pesati con due coefficienti di Clebsch-Gordan. Ballentine la ottiene ruotando un vettore prodotto e confrontando i coefficienti, Sakurai inserendo un insieme completo di stati accoppiati. Con l&rsquo;ortogonalità delle matrici di rotazione ne segue l&rsquo;integrale del prodotto di tre matrici di rotazione su tutte le rotazioni, la (7.114) di Ballentine, che è lo strumento della dimostrazione del teorema di Wigner-Eckart.</p>`}
  ]},
  {t:'prosa', title:'L&rsquo;integrale di tre armoniche sferiche', tag:'armoniche', html:R`
  <p>Le armoniche sferiche sono elementi di matrici di rotazione con un indice nullo. Ponendo $m_{1}'=m_{2}'=0$ nella serie e integrando sull&rsquo;angolo solido, Sakurai ottiene la (3.8.73):</p>
  $$\int d\Omega\,Y_{l}^{m*}Y_{l_{1}}^{m_{1}}Y_{l_{2}}^{m_{2}}=\sqrt{\frac{(2l_{1}+1)(2l_{2}+1)}{4\pi(2l+1)}}\,\langle l_{1}l_{2};00|l_{1}l_{2};l0\rangle\,\langle l_{1}l_{2};m_{1}m_{2}|l_{1}l_{2};lm\rangle,$$
  <p>e la legge così: <i>«the square root factor times the first Clebsch-Gordan coefficient is independent of orientations — that is, of $m_{1}$ and $m_{2}$. The second Clebsch-Gordan coefficient is the one appropriate for adding $l_{1}$ and $l_{2}$ to obtain total $l$»</i>. È <i>«extremely useful in evaluating multipole matrix elements in atomic and nuclear spectroscopy»</i>. Ballentine la ricava nell&rsquo;esempio (3) del §7.8 dalla sua (7.114).</p>
  <p>Tre casi con $l_{1}=l_{2}=1$ e tutti gli $m$ nulli fanno vedere che cosa contiene la formula. Per $l=2$ il coefficiente $\langle1,1;0,0|2,0\rangle$ vale $\sqrt{2/3}$, e l&rsquo;integrale $1/\sqrt{5\pi}$. Per $l=0$, $\langle1,1;0,0|0,0\rangle$ vale $-1/\sqrt3$, compare due volte, e l&rsquo;integrale è $1/(2\sqrt\pi)$: positivo, come deve essere l&rsquo;integrale di $|Y_{1}^{0}|^{2}$ per la costante $Y_{0}^{0}$. Per $l=1$, $\langle1,1;0,0|1,0\rangle$ è nullo, e l&rsquo;integrale di $(Y_{1}^{0})^{3}$ è zero. Quest&rsquo;ultimo zero si capisce con la parità: il prodotto di tre funzioni dispari è dispari. Il coefficiente $\langle l_{1}l_{2};00|l0\rangle$ si annulla ogni volta che $l_{1}+l_{2}+l$ è dispari, e porta dentro la formula la regola di parità che Landau scrive nel §31 come $P=P_{1}P_{2}$.</p>`},
  {t:'reveal', title:'Il teorema di Wigner-Eckart', tag:'operatori tensoriali', steps:[
   {label:'L enunciato', body:R`
   <p>Un operatore tensoriale sferico di rango $k$ è un insieme di $2k+1$ operatori $T^{(k)}_{q}$ che per rotazioni si trasformano fra loro come gli stati $|k,q\rangle$; un operatore scalare ha $k=0$, un operatore vettoriale $k=1$, con componenti sferiche $V_{\pm1}=\mp(V_{x}\pm iV_{y})/\sqrt2$ e $V_{0}=V_{z}$. Sakurai, nel teorema 3.2: <i>«the matrix elements of tensor operators with respect to angular-momentum eigenstates satisfy»</i></p>
   $$\langle\alpha',j'm'|T^{(k)}_{q}|\alpha,jm\rangle=\langle jk;mq|jk;j'm'\rangle\,\frac{\langle\alpha'j'\|T^{(k)}\|\alpha j\rangle}{\sqrt{2j+1}},$$
   <p><i>«where the double-bar matrix element is independent of $m$ and $m'$, and $q$»</i>. Ballentine scrive lo stesso teorema, la (7.115), senza il fattore $1/\sqrt{2j+1}$: il suo elemento ridotto è quello di Sakurai diviso per $\sqrt{2j+1}$. Gli elementi ridotti delle due fonti non si possono quindi confrontare senza tener conto del fattore, e un esercizio che chiede «l&rsquo;elemento di matrice ridotto» dipende dalla convenzione del libro su cui è stato scritto.</p>`},
   {label:'Che cosa significa', body:R`
   <p>Sakurai: il primo fattore <i>«is a Clebsch-Gordan coefficient for adding $j$ and $k$ to get $j'$. It depends only on the geometry — that is, on the way the system is oriented with respect to the z-axis. There is no reference whatsoever to the particular nature of the tensor operator. The second factor does depend on the dynamics; for instance, $\alpha$ may stand for the radial quantum number, and its evaluation may involve, for example, evaluation of radial integrals»</i>. Per calcolare tutti gli elementi di matrice con le varie combinazioni di $m$, $m'$, $q$ <i>«it is sufficient to know just one of them; all others can be related geometrically»</i>.</p>
   <p>La dimostrazione di Sakurai confronta due relazioni di ricorrenza. Gli elementi di matrice di $[J_{\pm},T^{(k)}_{q}]$ danno per gli elementi di $T$ una relazione lineare omogenea con gli stessi coefficienti della ricorrenza (3.8.49) dei coefficienti di Clebsch-Gordan, con $j'\to j$, $m'\to m$, $j\to j_{1}$, $m\to m_{1}$, $k\to j_{2}$, $q\to m_{2}$. Due insiemi di incognite che risolvono lo stesso sistema omogeneo sono proporzionali: <i>«we cannot solve for the $x_{j}$ (or $y_{j}$) individually, but we can solve for the ratios»</i>. Ballentine la dimostra invece integrando su tutte le rotazioni con la (7.114). Le due dimostrazioni corrispondono ai due modi di costruire i coefficienti: per ricorrenza o con le matrici di rotazione.</p>`},
   {label:'Un elemento ridotto calcolato', body:R`
   <p>Ballentine calcola l&rsquo;elemento ridotto dello stesso momento angolare $\mathbf J$. Basta un elemento: $\langle J,J|J_{z}|J,J\rangle=\hbar J$, e il coefficiente di Clebsch-Gordan corrispondente è $(J,1,J,0|J,J)=\{J/(J+1)\}^{1/2}$, quindi l&rsquo;elemento ridotto vale $\hbar\{J(J+1)\}^{1/2}$, la (7.118). Il coefficiente si controlla con i casi già costruiti: per $J=1$ nella composizione $1\otimes1$ della tappa 04 il coefficiente di $|1,0\rangle$ in $|1,1\rangle_{J}$ è $1/\sqrt2$, cioè $\sqrt{1/2}$; per $J=2$ nella composizione $2\otimes1$ lo stato $|2,2\rangle$ è $(2|2,0\rangle-\sqrt2|1,1\rangle)/\sqrt6$, e il coefficiente di $|2,0\rangle$ è $\sqrt{2/3}$.</p>`}
  ]},
  {t:'prosa', title:'Le regole di selezione', tag:'regole di selezione', html:R`
  <p>Le regole di selezione si leggono dal coefficiente: <i>«from the requirement that the Clebsch-Gordan coefficient be nonvanishing, we immediately obtain the $m$-selection rule [...] and also the triangular relation»</i> $|j-k|\leq j'\leq j+k$. Un operatore scalare non cambia né $j$ né $m$, perché agire con esso <i>«is like adding an angular momentum of zero»</i>. Un operatore vettoriale cambia $m$ di $\pm1$ o $0$ e $j$ di $\pm1$ o $0$, <i>«in addition, the $0\to0$ transition is forbidden. This selection rule is of fundamental importance in the theory of radiation; it is the dipole selection rule obtained in the long-wavelength limit of emitted photons»</i>. La transizione $0\to0$ è vietata perché $0$ e $1$ non possono dare $0$. Per il dipolo elettrico, che è anche dispari per parità, si aggiunge che $l$ cambia di uno: $\Delta l=0$ è permesso da Wigner-Eckart e vietato dalla parità, ed è l&rsquo;integrale nullo di tre armoniche visto sopra. La componente $z$ del dipolo, $q=0$, lascia $m$ invariato; le componenti $x\pm iy$ lo cambiano di uno.</p>`},
  {t:'reveal', title:'Il teorema di proiezione e il fattore di Landé', tag:'proiezione', steps:[
   {label:'Il teorema', body:R`
   <p>Per $j'=j$ il teorema di Wigner-Eckart, applicato a un operatore vettoriale, prende una forma <i>«often known as the projection theorem for obvious reasons»</i>, il teorema 3.3 di Sakurai:</p>
   $$\langle\alpha',jm'|V_{q}|\alpha,jm\rangle=\frac{\langle\alpha',jm|\mathbf J\cdot\mathbf V|\alpha,jm\rangle}{\hbar^{2}j(j+1)}\,\langle jm'|J_{q}|jm\rangle .$$
   <p>Dentro un multipletto con $j$ dato, ogni operatore vettoriale si comporta come la sua proiezione su $\mathbf J$. È il modello vettoriale di Landau reso esatto: $\mathbf V$ ruota attorno a $\mathbf J$, e conta solo la sua componente lungo $\mathbf J$. La prova usa che $\mathbf J\cdot\mathbf V$ è scalare, quindi il suo valore medio non dipende da $m$, e che $\mathbf V$ e $\mathbf J$ hanno elementi di matrice proporzionali con lo stesso fattore geometrico.</p>`},
   {label:'Il fattore di Landé', body:R`
   <p>Il momento magnetico di un elettrone è proporzionale a $\mathbf L+2\mathbf S$, che non è parallelo a $\mathbf J=\mathbf L+\mathbf S$. Nel multipletto con $j$ dato, il teorema di proiezione lo sostituisce con $g_{J}\mathbf J$, dove $g_{J}\hbar^{2}j(j+1)$ è il valor medio di $\mathbf J\cdot(\mathbf J+\mathbf S)$:</p>
   $$g_{J}=1+\frac{j(j+1)+s(s+1)-l(l+1)}{2j(j+1)} .$$
   <p>Il valor medio di $\mathbf J\cdot\mathbf S$ si scrive con i quadrati, $\tfrac12(J^{2}+S^{2}-L^{2})$, che è la formula di Landau per il prodotto scalare di due momenti composti. Per lo stato $^{2}P_{3/2}$ si ottiene $g_{J}=\tfrac43$, per $^{2}P_{1/2}$ $g_{J}=\tfrac23$. Il controllo con la formula chiusa della tappa 05 è diretto: nello stato con $l=1$, $j=\tfrac32$, $M=\tfrac12$, il valor medio di $L_{z}+2S_{z}$ vale $\hbar\cdot\tfrac23$, che è $g_{J}M\hbar$ con $g_{J}=\tfrac43$.</p>`}
  ]},
  {t:'plot', title:'Il fattore di Landé di un elettrone',
   intro:R`<p>Fattore $g_{J}$ di un elettrone con momento orbitale $l$, per $j=l+\tfrac12$ (blu, $1+\tfrac{1}{2l+1}$) e $j=l-\tfrac12$ (arancio, $1-\tfrac{1}{2l+1}$), in funzione di $l$, da leggere agli interi $l\geq1$; per $l=0$ vale $2$. In grigio i due limiti, $g=1$ del solo moto orbitale.</p>`,
   plots:[{kind:'func2d', xr:[0,6], yr:[0,2.1], height:250, ticks:true,
     title:'g_J per j = l + 1/2 e j = l - 1/2',
     curves:[{f:'1+1/(2*x+1)', col:'#5aa9ff', width:2.4, label:'j = l + 1/2'},
             {f:'x>=0.99 ? 1-1/(2*x+1) : NaN', col:'#ffb86b', width:2.4, label:'j = l - 1/2'},
             {f:'1', col:'#999999', width:1.2, label:'g = 1'}],
     xlabel:'l', ylabel:'g_J'}],
   leggi:R`<p><b>Che cosa guardare.</b> A $l=0$ lo stato è di solo spin e $g_{J}=2$. Al crescere di $l$ i due valori si avvicinano a uno da sopra e da sotto: il momento orbitale domina, e lo spin conta sempre meno nella proiezione su $\mathbf J$.</p>
   <p><b>Che cosa impararne.</b> I due valori sono simmetrici rispetto a uno, con scarto $1/(2l+1)$. Lo scarto è la frazione di spin proiettata su $\mathbf J$, la stessa pendenza della retta della tappa 05. Nell&rsquo;effetto Zeeman debole i due livelli $j=l\pm\tfrac12$ si separano quindi in modo diverso, ed è questo che rende l&rsquo;effetto «anomalo».</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Perché in un atomo di idrogeno la transizione da $2s$ a $1s$ con emissione di un fotone di dipolo è vietata?`,
    a:R`Perché $\Delta l=0$. Per Wigner-Eckart un operatore vettoriale può collegare $l=0$ solo a $l=1$: da $0$ e $1$ si ottiene solo $1$. Lo stesso dice l&rsquo;integrale di tre armoniche, con $\langle1,0;0,0|0,0\rangle$ che si annulla perché $0+1+0$ è dispari. Lo stato $2s$ decade con due fotoni, ed è metastabile.`},
   {q:R`Il teorema di proiezione dice che dentro un multipletto $\mathbf S$ è proporzionale a $\mathbf J$. Allora $S_{x}$ e $J_{x}$ commutano?`,
    a:R`No. Il teorema riguarda gli elementi di matrice <i>dentro</i> il sottospazio con $j$ fissato, non gli operatori. $\mathbf S$ ha anche elementi di matrice fra stati con $j$ diversi, per esempio fra $j=l+\tfrac12$ e $j=l-\tfrac12$, e lì non c&rsquo;è nessuna proporzionalità. È per questo che il fattore di Landé vale per un campo debole, quando la separazione Zeeman è piccola rispetto a quella di struttura fine e si può restare dentro un multipletto.`}
  ]}
]},
/* ---------------- 08 · IL COMPITO DEL 30-01-2018 ---------------- */
{ num:'08', title:'Il compito del 30 gennaio 2018: due particelle con j dati e una hamiltoniana in J quadro', meta:'lo stato iniziale e la tavola da usare · le energie · l evoluzione e la misura di j2z · il tempo di ritorno con e senza fase globale · lo spin della seconda particella con la tavola uno per un mezzo · l errore di mescolare le convenzioni',
  blocchi:[
  {t:'prosa', title:'Il testo', tag:'compito', html:R`
  <p>L&rsquo;esercizio 2 dello scritto del 30-01-2018: <i>«Si considerino due particelle di spin 1/2, non identiche. Al tempo $t=0$ la prima particella si trova in uno stato di momento angolare orbitale $\ell_{1}=1$ e momento angolare totale $j_{1}=1/2$ e $j_{1z}=1/2$ ($\mathbf j_{1}=\mathbf l_{1}+\mathbf s_{1}$), mentre la seconda si trova in uno stato di momento angolare orbitale $\ell_{2}=1$ e momento angolare totale $j_{2}=3/2$ e $j_{2z}=-1/2$»</i>. I momenti sono in unità di $\hbar$. La hamiltoniana è $H=\mathbf J^{2}/2I+\alpha J_{z}$, con $\mathbf J=\mathbf J_{1}+\mathbf J_{2}$. Le domande: l&rsquo;evoluzione temporale; i valori di $j_{2z}$ al tempo $t$ e le loro probabilità; il tempo minimo $t_{m}$ al quale lo stato coincide con quello iniziale; i valori di $s_{2z}$ al tempo zero e le loro probabilità.</p>
  <p>Il riconoscimento è la prima cosa. Ci sono due composizioni, a due livelli. Dentro ciascuna particella, $\mathbf j_{i}=\mathbf l_{i}+\mathbf s_{i}$: serve solo per l&rsquo;ultima domanda, perché la hamiltoniana dipende soltanto da $\mathbf J$ e ciascuna particella resta nel suo multipletto $j_{i}$. Fra le due particelle, $\mathbf J=\mathbf j_{1}+\mathbf j_{2}$: è quella che decide l&rsquo;evoluzione, perché $H$ è diagonale nella base accoppiata. Lo stato iniziale è un prodotto, quindi si legge la tavola per righe.</p>`},
  {t:'reveal', title:'Lo stato iniziale nella base accoppiata', tag:'decomposizione', steps:[
   {label:'Quali J', body:R`
   <p>$\tfrac12\otimes\tfrac32$ dà $J=2$ e $J=1$, con $5+3=8=2\times4$ stati. Lo stato iniziale ha $M=\tfrac12-\tfrac12=0$, quindi contiene solo $|2,0\rangle$ e $|1,0\rangle$.</p>`},
   {label:'Quale tavola, e in che ordine', body:R`
   <p>La tavola PDG ha il blocco $\tfrac32\times\tfrac12$ e non $\tfrac12\times\tfrac32$. Si può tenere l&rsquo;ordine del testo, particella $1$ con $j_{1}=\tfrac12$, e usare la relazione di scambio; oppure tenere l&rsquo;ordine della tavola. Scelgo l&rsquo;ordine del testo e scrivo $|m_{1},m_{2}\rangle$ per $|\tfrac12,m_{1}\rangle\otimes|\tfrac32,m_{2}\rangle$. Nella convenzione di Condon e Shortley in quest&rsquo;ordine, i due stati con $M=0$ sono</p>
   $$|2,0\rangle=\frac{1}{\sqrt2}\big(|\tfrac12,-\tfrac12\rangle+|-\tfrac12,\tfrac12\rangle\big),\qquad|1,0\rangle=\frac{1}{\sqrt2}\big(|\tfrac12,-\tfrac12\rangle-|-\tfrac12,\tfrac12\rangle\big),$$
   <p>e quindi lo stato iniziale è</p>
   $$|\psi(0)\rangle=|\tfrac12,-\tfrac12\rangle=\frac{1}{\sqrt2}\big(|2,0\rangle+|1,0\rangle\big).$$
   <p>Con la tavola $\tfrac32\times\tfrac12$, nell&rsquo;ordine opposto, il coefficiente di $|1,0\rangle$ ha il segno opposto, perché $(-1)^{J-j_{1}-j_{2}}$ vale $-1$ per $J=1$: è l&rsquo;esempio della tappa 06.</p>`},
   {label:'Un controllo', body:R`
   <p>Il coefficiente di $|1,0\rangle$ è positivo nell&rsquo;ordine del testo perché lo stato più alto del multipletto, $|1,1\rangle$, ha coefficiente positivo sul termine con $m_{1}=j_{1}=\tfrac12$, e abbassando i segni non cambiano. Si verifica con la matrice di $\mathbf J^{2}$ sullo spazio di dimensione otto: i due vettori scritti sopra sono autovettori con autovalori $6$ e $2$, e $J_{+}^{2}$ annulla il secondo, come deve per uno stato con $J=1$.</p>`}
  ]},
  {t:'prosa', title:'Energie ed evoluzione', tag:'evoluzione', html:R`
  <p>Su $|J,M\rangle$ la hamiltoniana vale $\hbar^{2}J(J+1)/2I+\alpha\hbar M$. Con $M=0$ il termine in $\alpha$ non contribuisce, e le due energie sono</p>
  $$E_{2}=\frac{6\hbar^{2}}{2I}=\frac{3\hbar^{2}}{I},\qquad E_{1}=\frac{2\hbar^{2}}{2I}=\frac{\hbar^{2}}{I} .$$
  <p>Il termine $\alpha J_{z}$ è una trappola: separa i livelli con $M$ diversi, ma lo stato ha $M=0$ e $J_{z}$ commuta con $H$, quindi $M$ resta zero per sempre. Lo stato al tempo $t$ è</p>
  $$|\psi(t)\rangle=\frac{1}{\sqrt2}\Big(e^{-3i\hbar t/I}|2,0\rangle+e^{-i\hbar t/I}|1,0\rangle\Big),$$
  <p>che si controlla sostituendo nell&rsquo;equazione di Schrödinger: con $\tau=\hbar t/I$, $i\,d|\psi\rangle/d\tau$ è uguale a $\tfrac12\mathbf J^{2}|\psi\rangle$ con $\mathbf J^{2}$ in unità di $\hbar^{2}$, e a $\tau=0$ si ritrova lo stato prodotto.</p>`},
  {t:'reveal', title:'La misura di j2z', tag:'misura', steps:[
   {label:'Tornare alla base prodotto', body:R`
   <p>Si chiede $j_{2z}$, che non è diagonale nella base accoppiata: si torna indietro per colonne. Siccome $M=0$, i valori possibili sono $m_{2}=-\tfrac12$ (con $m_{1}=\tfrac12$) e $m_{2}=+\tfrac12$ (con $m_{1}=-\tfrac12$). Sostituendo le colonne,</p>
   $$\langle\tfrac12,-\tfrac12|\psi(t)\rangle=\frac{e^{-3i\tau}+e^{-i\tau}}{2},\qquad\langle-\tfrac12,\tfrac12|\psi(t)\rangle=\frac{e^{-3i\tau}-e^{-i\tau}}{2},$$
   <p>e le probabilità sono</p>
   $$P\big(j_{2z}=-\tfrac12\big)=\cos^{2}\frac{\hbar t}{I},\qquad P\big(j_{2z}=+\tfrac12\big)=\sin^{2}\frac{\hbar t}{I} .$$`},
   {label:'Che cosa succede fisicamente', body:R`
   <p>Le due particelle si scambiano un quanto di momento angolare lungo $z$ con frequenza angolare $(E_{2}-E_{1})/\hbar=2\hbar/I$. Il momento totale lungo $z$ resta zero; le proiezioni dei singoli momenti oscillano. È il modello vettoriale di Landau: $\mathbf j_{1}$ e $\mathbf j_{2}$ precedono attorno a $\mathbf J$, che è conservato, e le loro proiezioni su $z$ cambiano. Qui però lo stato non ha $J$ definito, e la precessione è un battimento fra due multipletti.</p>`}
  ]},
  {t:'plot', title:'Il battimento fra J uguale a due e J uguale a uno',
   intro:R`<p>Probabilità di trovare $j_{2z}=-\tfrac12$ (blu) e $j_{2z}=+\tfrac12$ (arancio) in funzione di $\tau=\hbar t/I$. In tratteggio grigio la curva che si otterrebbe prendendo la decomposizione dalla tavola $\tfrac32\times\tfrac12$ e le colonne nell&rsquo;ordine del testo, senza la relazione di scambio.</p>`,
   plots:[{kind:'func2d', xr:[0,6.2832], yr:[0,1.05], height:250, ticks:true,
     title:'P(j2z) nel compito del 30-01-2018',
     curves:[{f:'Math.pow(Math.cos(x),2)', col:'#5aa9ff', width:2.4, label:'j2z = -1/2'},
             {f:'Math.pow(Math.sin(x),2)', col:'#ffb86b', width:2.4, label:'j2z = +1/2'},
             {f:'Math.pow(Math.sin(x),2)', col:'#999999', width:1.2, dash:true, label:'convenzioni mescolate: j2z = -1/2'}],
     xlabel:'tau = hbar t / I', ylabel:'probabilita'}],
   leggi:R`<p><b>Che cosa guardare.</b> A $\tau=0$ la probabilità di $j_{2z}=-\tfrac12$ è uno, come deve: è il dato. A $\tau=\pi/2$ i due momenti si sono scambiati le proiezioni, a $\tau=\pi$ lo stato è tornato. La curva tratteggiata parte da zero: se si mescolano le convenzioni, la soluzione dice che al tempo zero la particella 2 ha certamente $j_{2z}=+\tfrac12$, contro il testo.</p>
   <p><b>Che cosa impararne.</b> L&rsquo;errore di convenzione non dà un risultato «un po&rsquo; sbagliato»: scambia seno e coseno. Ed è un errore che si scopre da solo, controllando la condizione iniziale. Il controllo a $t=0$ costa un secondo e va fatto sempre.</p>`},
  {t:'prosa', title:'Il tempo di ritorno', tag:'periodo', html:R`
  <p>La domanda chiede il tempo minimo per cui <i>«lo stato totale del sistema al tempo $t$ coincide con quello al tempo $t=0$»</i>. Due vettori che differiscono per una fase globale rappresentano lo stesso stato; allora basta che la fase relativa $(E_{2}-E_{1})t/\hbar=2\hbar t/I$ sia un multiplo di $2\pi$, e il tempo minimo è</p>
  $$t_{m}=\frac{\pi I}{\hbar} .$$
  <p>A quel tempo $|\psi(t_{m})\rangle=e^{-i\pi}|\psi(0)\rangle=-|\psi(0)\rangle$. Se invece si chiedesse l&rsquo;uguaglianza dei vettori, senza fase, servirebbe che entrambe le fasi $3\hbar t/I$ e $\hbar t/I$ fossero multipli di $2\pi$, e il tempo minimo sarebbe $2\pi I/\hbar$. Il testo parla di «stato», e la risposta fisica è la prima; scriverle entrambe, dicendo quale delle due si intende, toglie ogni ambiguità all&rsquo;orale.</p>`},
  {t:'reveal', title:'Lo spin della seconda particella al tempo zero', tag:'l per un mezzo', steps:[
   {label:'L altra composizione', body:R`
   <p>L&rsquo;ultima domanda guarda dentro la particella 2: $\mathbf j_{2}=\mathbf l_{2}+\mathbf s_{2}$ con $l_{2}=1$, $j_{2}=\tfrac32$, $m_{j}=-\tfrac12$. Si legge la colonna $J=\tfrac32$, $M=-\tfrac12$ della tavola $1\times\tfrac12$, o la formula chiusa della tappa 05 con $l=1$ e $M=-\tfrac12$:</p>
   $$|\tfrac32,-\tfrac12\rangle=\sqrt{\tfrac13}\,|m_{l}=-1\rangle|{\uparrow}\rangle+\sqrt{\tfrac23}\,|m_{l}=0\rangle|{\downarrow}\rangle .$$
   <p>Quindi $s_{2z}=+\tfrac12$ con probabilità $\tfrac13$ e $s_{2z}=-\tfrac12$ con probabilità $\tfrac23$. Lo stato della particella 1 non c&rsquo;entra: le osservabili della particella 2 commutano con quelle della 1, e lo stato iniziale è un prodotto.</p>`},
   {label:'Che cosa succede dopo', body:R`
   <p>Il testo chiede questa probabilità solo al tempo zero, e c&rsquo;è una ragione. Al tempo $t$ la particella 2 è in una sovrapposizione di $m_{j}=\pm\tfrac12$, e la probabilità di $s_{2z}=+\tfrac12$ diventa $\tfrac13\cos^{2}\tau+\tfrac23\sin^{2}\tau$: dalla tavola, in $|\tfrac32,+\tfrac12\rangle$ lo spin su ha probabilità $\tfrac23$. I termini di interferenza fra $m_{j}=-\tfrac12$ e $m_{j}=+\tfrac12$ non contribuiscono, perché i due stati hanno lo stesso $m_{s}$ con $m_{l}$ diversi, e gli stati di $m_{l}$ diversi sono ortogonali.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Se lo stato iniziale avesse avuto $j_{2z}=+\tfrac12$, invece di $-\tfrac12$, il termine $\alpha J_{z}$ avrebbe contato?`,
    a:R`Sì. Allora $M=1$, e i multipletti presenti sarebbero $J=2$ e $J=1$ con $M=1$: le energie diventano $3\hbar^{2}/I+\alpha\hbar$ e $\hbar^{2}/I+\alpha\hbar$. Il termine in $\alpha$ è lo stesso per entrambi e dà una fase globale: la differenza di energia, e quindi tutte le probabilità, non cambiano. Il termine $\alpha J_{z}$ conterebbe soltanto per uno stato con componenti a $M$ diversi.`},
   {q:R`Perché la hamiltoniana $\mathbf J^{2}/2I$ non cambia $j_{1}$ e $j_{2}$?`,
    a:R`Perché $\mathbf J^{2}$ commuta con $\mathbf j_{1}^{2}$ e $\mathbf j_{2}^{2}$: è uno dei quattro operatori della base accoppiata, insieme a $\mathbf j_{1}^{2}$, $\mathbf j_{2}^{2}$ e $J_{z}$. Ciascuna particella resta nel suo multipletto per sempre, e lo spazio rilevante ha dimensione $2\times4$, non $(3\cdot2)^{2}$. È la stessa ragione per cui nella tappa 01 la base accoppiata può tenere fissi i moduli dei due momenti.`}
  ]}
]},
/* ---------------- 09 · IL COMPITO DEL 17-05-2017 ---------------- */
{ num:'09', title:'Il compito del 17 maggio 2017: due misure e poi un accoppiamento S1 per S2', meta:'uno stato iniziale che e gia un prodotto · la misura di S1x e quella di S2z · la decomposizione in tripletto e singoletto · le fasi e la probabilita di S2z · il valor medio dello spin totale che non si muove · lo scambio completo dei due spin · che cosa cambia con il singoletto di Picasso',
  blocchi:[
  {t:'prosa', title:'Il testo', tag:'compito', html:R`
  <p>L&rsquo;esercizio 1 dello scritto del 17-05-2017: <i>«Due particelle di spin 1/2, distinguibili, si trovano inizialmente nello stato $|\psi_{0}\rangle=|\tfrac12,\tfrac12\rangle+2|\tfrac12,-\tfrac12\rangle$ dove $|s_{1z},s_{2z}\rangle$ è l&rsquo;autostato degli operatori di spin $S_{1z}$ e $S_{2z}$ delle due particelle»</i>. All&rsquo;istante zero si misura $S_{1x}$ e si trova $\hbar/2$; al tempo $t_{0}$ si misura $S_{2z}$ e si trova $-\hbar/2$; <i>«nell&rsquo;intervallo di tempo $0\lt t\lt t_{0}$ le due particelle non interagiscono»</i>. Subito dopo <i>«viene accesa un&rsquo;interazione tra le due particelle con Hamiltoniana $H=\alpha\,\mathbf S_{1}\cdot\mathbf S_{2}$»</i>. Si chiedono gli stati dopo le due misure, lo stato al tempo $t\gt t_{0}$ con le probabilità dei valori di $S_{2z}$, e il valor medio di $S_{{\rm tot},x}$.</p>
  <p>Il riconoscimento: prima dell&rsquo;interazione tutto si fa nella base prodotto, perché le misure riguardano una particella alla volta; con $H=\alpha\,\mathbf S_{1}\cdot\mathbf S_{2}$ si passa alla base accoppiata, perché $\mathbf S_{1}\cdot\mathbf S_{2}$ è una funzione di $S^{2}$. Lo stato da decomporre è un prodotto, e la tavola $\tfrac12\times\tfrac12$ si legge per righe.</p>`},
  {t:'reveal', title:'Le due misure', tag:'misura', steps:[
   {label:'Lo stato iniziale è un prodotto', body:R`
   <p>Lo stato dato non è normalizzato; normalizzato è $(|{\uparrow\uparrow}\rangle+2|{\uparrow\downarrow}\rangle)/\sqrt5$, e si fattorizza: $|{\uparrow}\rangle\otimes(|{\uparrow}\rangle+2|{\downarrow}\rangle)/\sqrt5$. La particella 1 ha spin su lungo $z$, la particella 2 è in uno stato di spin puro con $P(\uparrow)=\tfrac15$. Non c&rsquo;è correlazione fra le due.</p>`},
   {label:'Dopo la misura di S1x', body:R`
   <p>La misura di $S_{1x}$ con risultato $+\hbar/2$ proietta la particella 1 su $|x+\rangle=(|{\uparrow}\rangle+|{\downarrow}\rangle)/\sqrt2$, con probabilità $|\langle x+|{\uparrow}\rangle|^{2}=\tfrac12$, e lascia la particella 2 com&rsquo;era, perché lo stato è un prodotto. Lo stato dopo la prima misura, nella base $|s_{1z},s_{2z}\rangle$, è</p>
   $$|\psi_{1}\rangle=\frac{1}{\sqrt{10}}\big(|{\uparrow\uparrow}\rangle+2|{\uparrow\downarrow}\rangle+|{\downarrow\uparrow}\rangle+2|{\downarrow\downarrow}\rangle\big).$$
   <p>Fra zero e $t_{0}$ il testo non dà una hamiltoniana: le particelle non interagiscono, e senza campi esterni lo stato di spin non cambia. È un&rsquo;ipotesi che va dichiarata nello svolgimento.</p>`},
   {label:'Dopo la misura di S2z', body:R`
   <p>La misura di $S_{2z}$ con risultato $-\hbar/2$ ha probabilità $\tfrac45$ e proietta la particella 2 su $|{\downarrow}\rangle$:</p>
   $$|\psi(t_{0})\rangle=|x+\rangle|{\downarrow}\rangle=\frac{1}{\sqrt2}\big(|{\uparrow\downarrow}\rangle+|{\downarrow\downarrow}\rangle\big).$$
   <p>Lo stato è ancora un prodotto, e i coefficienti dello stato iniziale sono spariti del tutto: dopo due misure su due particelle diverse, che non interagiscono, lo stato è fissato dai risultati.</p>`}
  ]},
  {t:'prosa', title:'La decomposizione e l&rsquo;evoluzione', tag:'evoluzione', html:R`
  <p>Lo stato $|{\downarrow\downarrow}\rangle$ è $|1,-1\rangle$. Lo stato $|{\uparrow\downarrow}\rangle$ si legge sulla riga $(+\tfrac12,-\tfrac12)$ della tavola $\tfrac12\times\tfrac12$: $1/2$ sotto $|1,0\rangle$ e $1/2$ sotto $|0,0\rangle$, da leggere sotto radice, cioè $|{\uparrow\downarrow}\rangle=(|1,0\rangle+|0,0\rangle)/\sqrt2$. Dunque</p>
  $$|\psi(t_{0})\rangle=\frac12\big(|1,0\rangle+|0,0\rangle\big)+\frac{1}{\sqrt2}|1,-1\rangle .$$
  <p>Le energie sono quelle della tappa 03: $\alpha\hbar^{2}/4$ sul tripletto, $-3\alpha\hbar^{2}/4$ sul singoletto. Posto $\varphi=\alpha\hbar(t-t_{0})$, la differenza delle fasi accumulate,</p>
  $$|\psi(t)\rangle=e^{-i\varphi/4}\Big[\frac12\big(|1,0\rangle+e^{i\varphi}|0,0\rangle\big)+\frac{1}{\sqrt2}|1,-1\rangle\Big].$$
  <p>Per $S_{2z}$ si torna alla base prodotto. Il valore $+\hbar/2$ viene solo dal termine $|{\downarrow\uparrow}\rangle$, che compare in $|1,0\rangle$ con $+1/\sqrt2$ e in $|0,0\rangle$ con $-1/\sqrt2$; l&rsquo;ampiezza è $(1-e^{i\varphi})/(2\sqrt2)$ a meno della fase globale, e</p>
  $$P\big(S_{2z}=+\tfrac\hbar2\big)=\frac{1-\cos\varphi}{4},\qquad P\big(S_{2z}=-\tfrac\hbar2\big)=\frac{3+\cos\varphi}{4} .$$
  <p>La probabilità di spin su per la particella 2 oscilla fra zero e un mezzo. Non arriva a uno perché metà dello stato è $|1,-1\rangle$, che è un autostato dell&rsquo;energia e non partecipa all&rsquo;oscillazione: in quella metà entrambi gli spin restano giù.</p>`},
  {t:'reveal', title:'Lo spin totale e lo scambio', tag:'conservazione', steps:[
   {label:'Il valor medio di S tot x', body:R`
   <p>La terza domanda ha una risposta senza conti: $\mathbf S_{\rm tot}$ commuta con $S^{2}$, quindi con $H$, e il suo valor medio è costante. Al tempo $t_{0}$ la particella 1 è in $|x+\rangle$ e dà $\hbar/2$, la particella 2 è in $|{\downarrow}\rangle$ e dà zero. Dunque $\langle S_{{\rm tot},x}\rangle=\hbar/2$ per ogni $t\gt t_{0}$. Il conto lo conferma e dice di più: i valori medi delle due componenti separate oscillano, $\langle S_{1x}\rangle=\hbar(1+\cos\varphi)/4$ e $\langle S_{2x}\rangle=\hbar(1-\cos\varphi)/4$, e la somma è costante. È di nuovo il modello vettoriale: i due spin precedono attorno al totale e si scambiano la componente $x$.</p>`},
   {label:'Lo scambio completo', body:R`
   <p>A $\varphi=\pi$ la particella 1 ha $\langle S_{1x}\rangle=0$ e la particella 2 ha $\langle S_{2x}\rangle=\hbar/2$. Di più: lo stato è $|{\downarrow}\rangle|x+\rangle$ a meno di una fase, i due spin si sono scambiati lo stato. La ragione è l&rsquo;operatore di scambio della tappa 03: $\mathbf S_{1}\cdot\mathbf S_{2}=\hbar^{2}(P_{12}/2-1/4)$, quindi l&rsquo;evoluzione è $e^{i\varphi/4}e^{-i\varphi P_{12}/2}$; poiché $P_{12}^{2}=1$, l&rsquo;esponenziale vale $\cos\tfrac\varphi2-i\sin\tfrac\varphi2\,P_{12}$, e a $\varphi=\pi$ è $-iP_{12}$. L&rsquo;operatore di evoluzione dopo un tempo $\pi/\alpha\hbar$ è lo scambio dei due spin per una fase, $e^{-i\pi/4}P_{12}$, qualunque sia lo stato iniziale.</p>`}
  ]},
  {t:'plot', title:'Due spin che si scambiano lo stato',
   intro:R`<p>In funzione di $\varphi=\alpha\hbar(t-t_{0})$: probabilità di $S_{2z}=+\hbar/2$ (blu), valori medi $\langle S_{1x}\rangle$ (arancio) e $\langle S_{2x}\rangle$ (verde) in unità di $\hbar$, e la loro somma (grigio).</p>`,
   plots:[{kind:'func2d', xr:[0,12.566], yr:[0,0.6], height:250, ticks:true,
     title:'compito del 17-05-2017',
     curves:[{f:'(1-Math.cos(x))/4', col:'#5aa9ff', width:2.4, label:'P(S2z = +hbar/2)'},
             {f:'(1+Math.cos(x))/4', col:'#ffb86b', width:2.4, label:'<S1x> / hbar'},
             {f:'(1-Math.cos(x))/4', col:'#6bdc9b', width:1.6, dash:true, label:'<S2x> / hbar'},
             {f:'0.5', col:'#999999', width:1.2, label:'<Stot,x> / hbar'}],
     xlabel:'phi', ylabel:''}],
   leggi:R`<p><b>Che cosa guardare.</b> La curva arancio parte da un mezzo e quella verde da zero, e a $\varphi=\pi$ si sono scambiate; la somma resta un mezzo. La probabilità di spin su della particella 2 coincide, numericamente, con $\langle S_{2x}\rangle/\hbar$: entrambe vengono dalla stessa fase relativa fra tripletto e singoletto.</p>
   <p><b>Che cosa impararne.</b> Il periodo è $2\pi$ in $\varphi$, cioè $2\pi/\alpha\hbar$ in $t-t_{0}$: è la separazione fra tripletto e singoletto, $\alpha\hbar^{2}$, divisa per $\hbar$. La stessa interazione di scambio, nell&rsquo;atomo di elio e nella molecola di idrogeno, separa i livelli di para e orto; qui, a livelli fissati, produce un&rsquo;oscillazione nel tempo.</p>`},
  {t:'prosa', title:'Con il singoletto di Picasso', tag:'convenzioni', html:R`
  <p>Se si usa il singoletto di Picasso, $(|{\downarrow\uparrow}\rangle-|{\uparrow\downarrow}\rangle)/\sqrt2$, la riga cambia: $|{\uparrow\downarrow}\rangle=(|1,0\rangle-|0,0\rangle_{\rm Picasso})/\sqrt2$, e lo stato al tempo $t_{0}$ si scrive $\tfrac12(|1,0\rangle-|0,0\rangle_{\rm Picasso})+|1,-1\rangle/\sqrt2$. L&rsquo;ampiezza di $|{\downarrow\uparrow}\rangle$ diventa $\tfrac12\big(\tfrac{1}{\sqrt2}-e^{i\varphi}\cdot\tfrac{1}{\sqrt2}\big)$, perché nel singoletto di Picasso $|{\downarrow\uparrow}\rangle$ ha coefficiente $+1/\sqrt2$: lo stesso numero di prima. Le due convenzioni danno lo stesso stato, scritto con un vettore di base diverso, e le probabilità coincidono. L&rsquo;errore sarebbe scrivere $|{\uparrow\downarrow}\rangle=(|1,0\rangle+|0,0\rangle)/\sqrt2$, che è la riga della tavola, e poi tornare indietro con il singoletto di Picasso: si troverebbe $P(S_{2z}=+\hbar/2)=(1+\cos\varphi)/4$, che a $t=t_{0}$ vale un mezzo, contro il risultato della misura appena fatta.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Perché le probabilità dello stato iniziale, $\tfrac15$ e $\tfrac45$, non compaiono nel risultato finale?`,
    a:R`Perché la seconda misura riguarda proprio la particella che portava quell&rsquo;informazione. Lo stato è un prodotto per tutto il tempo prima dell&rsquo;interazione; la misura di $S_{2z}$ con risultato $-\hbar/2$ proietta la particella 2 su $|{\downarrow}\rangle$ qualunque fosse il suo stato. I numeri $\tfrac15$ e $\tfrac45$ entrano solo nella probabilità di ottenere quel risultato, $\tfrac45$, che il testo non chiede.`},
   {q:R`Se invece di $H=\alpha\,\mathbf S_{1}\cdot\mathbf S_{2}$ ci fosse $H=\alpha S_{1z}S_{2z}$, la probabilità di $S_{2z}$ cambierebbe nel tempo?`,
    a:R`No. $S_{1z}S_{2z}$ è diagonale nella base prodotto, quindi commuta con $S_{2z}$, e le probabilità dei valori di $S_{2z}$ sono costanti: la particella 2 resta giù con certezza. Cambierebbe invece $\langle S_{1x}\rangle$: la particella 1 precede attorno a $z$ con un verso che dipende dallo spin della 2. È l&rsquo;esempio più semplice della scelta della base fatta dalla hamiltoniana, il criterio della tappa 01.`}
  ]}
]},
/* ---------------- 10 · DOVE LE FONTI DIVERGONO ---------------- */
{ num:'10', title:'Dove le fonti divergono, e le domande d orale', meta:'che cosa ciascuna fonte dimostra e che cosa assume · tre modi di dire perche le basi non si mescolano · il segno del singoletto fonte per fonte · due normalizzazioni dell elemento ridotto · una regola di simmetria da correggere · che cosa non si e potuto aprire · domande d orale',
  blocchi:[
  {t:'prosa', title:'Che cosa ciascuna fonte mette al centro', tag:'fonti', html:R`
  <p>Le fonti trattano lo stesso problema con cinque idee guida diverse, e la scelta decide che cosa dimostrano e che cosa lasciano come dato. <b>Picasso</b> parte dagli atomi e dalla classificazione degli stati con insiemi completi di osservabili compatibili: dimostra i valori di $L$ contando, con il lemma sugli autovalori non degeneri, e dichiara di non affrontare il calcolo dei coefficienti; l&rsquo;unico caso che svolge, i due spin, lo risolve per simmetria, che è la strada che gli serve subito dopo per il principio di Pauli. <b>Sakurai</b> parte dal cambio di base: le opzioni A e B sono due insiemi massimali di osservabili compatibili, i coefficienti sono gli elementi di una matrice unitaria, e la sua attenzione va alle ricorrenze nel piano $m_{1}m_{2}$ e alle matrici di rotazione, che portano dritte al teorema di Wigner-Eckart. Della condizione triangolare dà una verifica di coerenza e rinvia la dimostrazione completa. <b>Ballentine</b> parte dai sottospazi invarianti irriducibili del gruppo delle rotazioni: il conteggio con $n(M)$ e $N(J)$ dimostra anche che ogni $J$ compare una volta sola, e la terza condizione viene dalla rotazione di $2\pi$, legata alla regola di superselezione che ha discusso poco prima. <b>Shankar</b> parte dal problema pratico: diagonalizzare $S^{2}$ nel caso più piccolo, poi un procedimento per colonne, con le proprietà dei coefficienti etichettate come fatti o come convenzioni. <b>Griffiths</b> parte dalla misura: le tavole servono a dire che cosa si trova misurando, le dimostrazioni sono rinviate ad altri testi, e la teoria dei gruppi è una frase da citare. <b>Landau</b> mette insieme il modello vettoriale, per l&rsquo;intuizione, e gli spinori, per la derivazione, ed è l&rsquo;unico a dare il simbolo 3j come stato di tre particelle con momento totale nullo.</p>
  <p>Gli appunti degli studenti stanno vicino a Sakurai. Quelli di Pompili, dalle lezioni di Martinelli e Testa, usano le parole <i>«disaccoppiata»</i> e <i>«accoppiata»</i>, scrivono che il conto dei valori possibili di $J$ si fa <i>«con opportune considerazioni che non verranno qui riportate»</i>, e passano all&rsquo;esempio dei due spin. Quelli di Iannelli chiamano le due basi $B_{1}$ e $B_{2}$, verificano la dimensione con le somme di Gauss distinguendo i casi $j_{1}\gt j_{2}$, $j_{1}\lt j_{2}$ e $j_{1}=j_{2}$, e ricavano i primi due stati in forma generale. La sintesi dei postulati preparata dall&rsquo;amico di Giuseppe, che per gli altri movimenti ha guidato il confronto fra formalismi, non tratta la composizione dei momenti angolari: qui non c&rsquo;è un&rsquo;affermazione sugli appunti del professore da attribuirle.</p>`},
  {t:'reveal', title:'Tre modi di dire perché le due basi non si mescolano', tag:'commutatori', steps:[
   {label:'Con le componenti', body:R`
   <p>Picasso: $J_{1z}$ <i>«commuta con $L_{1}^{2}$, con $L_{2}^{2}$ ma non commuta con i termini contenenti $L_{1x}$ e $L_{1y}$»</i>. Gli appunti di Pompili lo dicono dal lato opposto: nel termine misto $\mathbf M_{1}\cdot\mathbf M_{2}$ <i>«non so come agiscono le componenti in x e y (visto che conosco solo la componente z)»</i>, e quindi $M^{2}$ non è una funzione dei soli operatori della base disaccoppiata.</p>`},
   {label:'Con gli operatori a scala', body:R`
   <p>Sakurai e Iannelli scrivono $J^{2}$ con $J_{1\pm}$ e $J_{2\mp}$, e Iannelli calcola il commutatore in questa forma, la (5.4.7): $[J^{2},J_{1z}]=-J_{1+}J_{2-}+J_{1-}J_{2+}$. I due termini fanno passare un quanto di momento angolare da una parte all&rsquo;altra, e il commutatore è diverso da zero perché $J^{2}$ contiene questi scambi.</p>`},
   {label:'Con il prodotto vettoriale', body:R`
   <p>Griffiths, nel problema 4.42, scrive lo stesso commutatore come $2i\hbar(\mathbf S_{1}\times\mathbf S_{2})_{z}$, e Iannelli chiude la sua catena di uguaglianze con la stessa forma, $2i(J_{1x}J_{2y}-J_{1y}J_{2x})$, in unità con $\hbar=1$. Le due scritture sono la stessa identità; quella con il prodotto vettoriale dice che il commutatore si annulla quando i due momenti sono paralleli, cioè negli stati estremi $m_{1}=j_{1}$, $m_{2}=j_{2}$, che infatti appartengono a entrambe le basi.</p>`}
  ]},
  {t:'prosa', title:'Le convenzioni, fonte per fonte', tag:'convenzioni', html:R`
  <p>Il segno del singoletto e la normalizzazione dell&rsquo;elemento ridotto sono le due scelte su cui le fonti del corso non sono d&rsquo;accordo. La tabella le mette in fila con la convenzione sugli stati più alti.</p>
  <table class="tab">
  <tr><th>fonte</th><th>singoletto di due spin</th><th>convenzione dichiarata</th><th>Wigner-Eckart</th></tr>
  <tr><td>Picasso §15.3</td><td>$(|-+\rangle-|+-\rangle)/\sqrt2$</td><td>nessuna</td><td>non trattato</td></tr>
  <tr><td>Sakurai §3.8, §3.11</td><td>$(|+-\rangle-|-+\rangle)/\sqrt2$</td><td>coefficienti reali; stato più alto positivo</td><td>con $1/\sqrt{2j+1}$</td></tr>
  <tr><td>Ballentine §7.7, §7.8</td><td>$(|+-\rangle-|-+\rangle)/\sqrt2$</td><td>(7.89): coefficiente con $m_{1}=j_{1}$ positivo</td><td>senza fattore</td></tr>
  <tr><td>Shankar §15.1-15.2</td><td>$(|+-\rangle-|-+\rangle)/\sqrt2$</td><td>Condon e Shortley, nominata</td><td>§15.3, non usato qui</td></tr>
  <tr><td>Griffiths §4.4.3</td><td>$(\uparrow\downarrow-\downarrow\uparrow)/\sqrt2$</td><td>implicita nella tavola</td><td>non trattato</td></tr>
  <tr><td>Landau §106</td><td>segni alterni nella (106,2)</td><td>coefficienti reali; segno globale dall&rsquo;ordine della composizione</td><td>non usato qui</td></tr>
  <tr><td>tavola PDG</td><td>$+\sqrt{1/2}$ su $(+\tfrac12,-\tfrac12)$</td><td>Wigner, Condon e Shortley</td><td>non pertinente</td></tr>
  </table>
  <p>Landau aggiunge un&rsquo;osservazione che le altre fonti non fanno: nella composizione di due momenti uguali con somma nulla <i>«sono univoci solo i segni relativi dei termini della somma (106,2), mentre il segno generale può risultare dipendente dall&rsquo;ordine della composizione»</i>. È la relazione di scambio della tavola, $(-1)^{J-j_{1}-j_{2}}$, vista dal lato della funzione d&rsquo;onda: per $J=0$ e $j_{1}=j_{2}$ il fattore è $(-1)^{2j}$, che è $-1$ per $j$ semintero, e infatti il singoletto di due spin cambia segno scambiando le particelle.</p>
  <p>C&rsquo;è poi la discrepanza della tappa 04: la copia di Ballentine che abbiamo stampa la regola di permutazione dispari del simbolo 3j con il fattore $(-1)^{j_{1}-j_{2}-m_{3}}$, e il conto con i coefficienti dei due spin dà $(-1)^{j_{1}+j_{2}+j_{3}}$, come in Landau. Va segnalata all&rsquo;orale come una cosa verificata, non come un&rsquo;opinione.</p>`},
  {t:'prosa', title:'Che cosa non si è potuto aprire', tag:'fonti', html:R`
  <p>Il Sakurai italiano (Zanichelli 1994), dove la composizione è il §3.7, è una scansione senza testo: tutte le citazioni di Sakurai vengono dalla seconda edizione inglese con Napolitano. Il Cohen-Tannoudji, a cui Griffiths rinvia per la dimostrazione della regola di composizione (vol. 2, cap. X), è anch&rsquo;esso una scansione illeggibile, come i testi di Messiah, Bransden e Joachain, e Schiff. Gli appunti di lezione intitolati alla composizione dei momenti angolari, nel materiale del corso, sono tre pagine di scansione senza testo estraibile. Della tavola PDG si legge tutto tranne la griglia dei numeri, che è grafica: i coefficienti che la tappa 06 attribuisce alla tavola sono stati ricalcolati e controllati, e la disposizione è descritta come la descrive Griffiths per la sua. Negli appunti di Pompili i segni delle combinazioni dei due spin non si leggono nella trascrizione. Del Landau, infine, la formula dell&rsquo;operatore di scambio di spin è illeggibile nell&rsquo;OCR, e la tappa 03 ne dà la forma ricostruita dagli autovalori, dichiarandolo.</p>`},
  {t:'collaudo', title:'Domande d orale', items:[
   {q:R`Perché i coefficienti di Clebsch-Gordan si possono prendere reali, e che cosa si perderebbe se non lo fossero?`,
    a:R`Le fasi degli stati accoppiati sono arbitrarie: una per multipletto, dopo aver fissato quelle dentro il multipletto con gli operatori di salita e discesa. La convenzione di Condon e Shortley sceglie reale e positivo il coefficiente con $m_{1}=j_{1}$ nello stato più alto; da lì le ricorrenze, che hanno coefficienti reali, danno solo numeri reali. Ballentine avverte che il fatto che risultino tutti reali <i>«is not obvious»</i>. Se non lo fossero non si perderebbe nulla di fisico, ma la matrice sarebbe unitaria e non ortogonale, e la tavola non si potrebbe leggere nei due versi con gli stessi numeri: per righe servirebbero i complessi coniugati.`},
   {q:R`Che cosa dice esattamente il teorema di Wigner-Eckart, e perché si dice che separa la geometria dalla dinamica?`,
    a:R`Che gli elementi di matrice di una componente $T^{(k)}_{q}$ di un operatore tensoriale fra stati di momento angolare sono il prodotto di un coefficiente di Clebsch-Gordan, $\langle jk;mq|j'm'\rangle$, per un elemento ridotto che non dipende da $m$, $m'$, $q$. Il coefficiente dipende solo da come il sistema è orientato rispetto all&rsquo;asse $z$, la geometria; l&rsquo;elemento ridotto contiene integrali radiali e la natura dell&rsquo;operatore, la dinamica. Conseguenza pratica: basta calcolare un elemento per conoscerli tutti, e le regole di selezione si leggono dai coefficienti. Avvertenza sulle fonti: Sakurai divide per $\sqrt{2j+1}$, Ballentine no, e gli elementi ridotti delle due fonti differiscono per quel fattore.`},
   {q:R`Due elettroni in un atomo: perché nell&rsquo;approssimazione di Russell-Saunders la base buona è quella con $L$, $S$, $J$, $M$?`,
    a:R`Perché la hamiltoniana completa, con le interazioni relativistiche, commuta con tutte le componenti del momento angolare totale $\mathbf J$ ma non separatamente con $\mathbf L$ e $\mathbf S$. Picasso lo dice per la perturbazione $H'$: è diagonale nella base con $L$ e $S$ fissi e $J$, $J_{z}$ definiti, mentre non lo è nella base con $L_{z}$ e $S_{z}$. Gli elementi diagonali dipendono da $J$ e non da $J_{z}$, e il livello con $L$ e $S$ dati si apre nei multipletti di struttura fine, come conta Landau. Se la perturbazione fosse esattamente proporzionale a $\mathbf L\cdot\mathbf S$ varrebbe la regola degli intervalli, e per il carbonio i dati di Picasso danno $2{,}7$ invece di $2$.`},
   {q:R`Che cosa c&rsquo;entra la rotazione di $2\pi$ con la composizione dei momenti angolari?`,
    a:R`Una rotazione di $2\pi$ moltiplica uno stato con momento $J$ per $(-1)^{2J}$. Applicata alla relazione fra le due basi, deve dare lo stesso fattore ai due membri: $(-1)^{2J}$ a sinistra, $(-1)^{2(j_{1}+j_{2})}$ a destra. Quindi $j_{1}+j_{2}+J$ è intero, la condizione (7.96) di Ballentine: comporre un intero e un semintero dà solo seminteri. È la stessa ragione per cui stati di $J$ intero e semintero non si sovrappongono mai, la regola di superselezione generata da $R(2\pi)$.`},
   {q:R`Come si riconosce in un compito che serve la composizione dei momenti angolari, se il testo non lo dice?`,
    a:R`Dalla hamiltoniana e dalla domanda. Un termine $\mathbf S_{1}\cdot\mathbf S_{2}$, $\mathbf L\cdot\mathbf S$ o $\mathbf J^{2}$ chiede la base accoppiata, perché è una funzione di $J^{2}$; una richiesta di autostati di $S^{2}$ e $S_{z}$, o di probabilità del momento totale, chiede i coefficienti. Se lo stato iniziale è un prodotto si legge la tavola per righe, se ha $J$ e $M$ dati e si chiede una componente singola per colonne. I due compiti di questo movimento usano entrambi i versi, e in entrambi il primo controllo da fare è la condizione iniziale.`},
   {q:R`Perché la base accoppiata è definita dai soli quattro numeri $j_{1}$, $j_{2}$, $J$, $M$ per due momenti, e non basta più per tre?`,
    a:R`Per due momenti, il conteggio di Ballentine mostra che $N(J)$ non supera mai uno: ogni $J$ compare in un solo multipletto, e i quattro numeri bastano. Per tre momenti un $J$ può comparire più volte: tre spin $\tfrac12$ danno lo spin $\tfrac12$ due volte, e l&rsquo;atomo di idrogeno con lo spin del protone dà $J=l$ due volte, come nota Griffiths. Serve un&rsquo;etichetta in più, che di solito è il momento intermedio: in che ordine si sono composti i momenti e che cosa si è ottenuto al primo passo. Il cambio fra due ordini di composizione è il problema dei coefficienti di Racah, che Sakurai nomina rinviando a Edmonds e che nessuna fonte del corso svolge.`}
  ]}
]}

/* ---- renderer dei blocchi ---- */
function sectionProsa(title, tag, html){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var body=elFromHTML('<div class="open-body">'+html+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function sectionGram(title, rows){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag gramtag">grammatica</span></h3>';
  var inner='<table class="gramtab">';
  rows.forEach(function(r){ inner+='<tr><td class="gs">'+r[0]+'</td><td>'+r[1]+'</td></tr>'; });
  inner+='</table>';
  var body=elFromHTML('<div class="gramwrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
/* --- blocco PLOT: la figura non decora, si legge. Ogni plot porta una chiave di lettura. --- */
function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';
  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionSvelabile(title, tag, html, sol){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var c=document.createElement('div'); c.className='collaudo-item';
  var q=document.createElement('div'); q.className='cq'; q.innerHTML=html||'';
  c.appendChild(q); typeset(q);
  if(sol){
    var a=document.createElement('div'); a.className='ca'; a.style.display='none';
    a.innerHTML='<b>Soluzione.</b> '+sol;
    var btn=document.createElement('button'); btn.className='reveal-btn small';
    btn.textContent='Rivela la soluzione';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a);
      btn.disabled=true; btn.classList.add('done'); btn.textContent='Soluzione rivelata'; };
    c.appendChild(btn); c.appendChild(a);
  }
  wrap.appendChild(c); return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    /* DUE SCHEMI, NON UNO — scoperto il 2026-10-06 provando le pagine vive. I movimenti
       scritti per primi (em-01..03, me-10b, i collaudi di gd-01..09 e di quattro em)
       usano una forma piu' semplice: `reveal` e `prolessi` con un solo `html`,
       `esercizio` e `collaudo` con `html` + `sol`. Il renderer ne conosceva una sola e
       chiamava `steps.forEach` su `undefined`: TypeError, e la tappa si fermava li' —
       62 blocchi in 17 movimenti su 74. Non si riscrive il contenuto per far contento
       il renderer: e' il renderer che deve leggere cio' che c'e'.
       E in fondo un ramo che NON muore: uno schema nuovo di domani deve far vedere un
       avviso in quella sezione, non spegnere la pagina sotto di se'. */
    try{
      if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
      else if(b.t==='prolessi') m.appendChild(b.rotte ? sectionProlessi(b)
                                   : sectionProsa(b.title,'prolessi',b.html));
      else if(b.t==='reveal')m.appendChild(b.steps ? sectionReveal(b.title,b.tag,b.steps)
                                   : sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='esercizio') m.appendChild(b.steps ? sectionEsercizio(b)
                                   : sectionSvelabile(b.title,'esercizio',b.html,b.sol));
      else if(b.t==='collaudo')  m.appendChild(b.items ? sectionCollaudo(b.title,b.items)
                                   : sectionSvelabile(b.title,'provi, poi riveli',b.html,b.sol));
      else if(b.t==='plot')      m.appendChild(sectionPlot(b));
      else m.appendChild(sectionProsa(b.title||'(blocco)', 'tipo sconosciuto: '+b.t,
                                      b.html||''));
    }catch(err){
      var avv=document.createElement('section'); avv.className='section';
      avv.innerHTML='<h3>'+(b.title||'(blocco)')+'<span class="tag">non reso</span></h3>'
        +'<p style="color:#ff6b6b">Questo blocco non si &egrave; potuto rendere ('
        +b.t+': '+err.message+'). Il resto della tappa continua sotto.</p>';
      m.appendChild(avv);
    }
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* I POP-UP DEGLI STRUMENTI. `cablaStrumenti` esisteva dal 18-09 e non la chiamava
     nessuno: i 229 rimandi del percorso erano <span> senza handler, e il clic non
     faceva niente. Nessun controllo poteva vederlo — la sintassi era valida, le schede
     c'erano tutte, le formule rendevano: il guasto esisteva solo a pagina viva. Qui, e
     dopo ogni inserimento successivo, perche' la tappa si rimonta da capo a ogni
     cambio e gli handler vanno riattaccati al DOM nuovo. */
  cablaStrumenti(m);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}

/* deep-link: mq-21-composizione-momenti-angolari.html#03 apre direttamente la tappa 03 */
window.addEventListener('DOMContentLoaded', function(){
  var h=(location.hash||'').replace('#','');
  showTappa(byId[h]?h:'00');
});
window.addEventListener('hashchange', function(){
  var h=(location.hash||'').replace('#','');
  if(byId[h]) showTappa(h);
});
</script>
