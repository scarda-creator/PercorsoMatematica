<style>
  :root{
    --bg:#0e1117; --panel:#161b22; --panel2:#1c232d; --border:#2b333d;
    --txt:#eef3f8; --muted:#b9c4d1; --accent:#4c8dff; --accent2:#8fb0ff;
    --ok:#2ea043; --okbg:#10331b; --warn:#d8a13a; --warnbg:#332a10;
    --gram:#5eead4; --grambg:#0f2a26;
    --pro:#b98cff; --probg:#1a1430; --proline:#2a2247; --proedge:#3a2d5c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    font-size:17px;line-height:1.55;}
  a{color:var(--accent2);}
  .banner{background:var(--panel2);border-bottom:1px solid var(--border);color:var(--muted);
    font-size:.8rem;font-weight:600;text-align:center;padding:8px 12px;letter-spacing:.3px;}
  .banner b{color:var(--accent2);}
  .shell{display:flex;max-width:1180px;margin:0 auto;align-items:flex-start;}

  /* ---- SIDEBAR ---- */
  .sidebar{width:280px;flex:0 0 280px;padding:20px 12px 60px;position:sticky;top:0;
    max-height:100vh;overflow-y:auto;border-right:1px solid var(--border);}
  .sidebar h2{font-size:.72rem;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);
    margin:18px 8px 8px;}
  .navitem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:none;
    background:transparent;color:var(--txt);padding:9px 10px;border-radius:8px;cursor:pointer;
    font-size:.9rem;transition:.12s;border:1px solid transparent;}
  .navitem:hover{background:var(--panel2);}
  .navitem.active{background:#13233f;border-color:var(--accent);color:#fff;}
  .navitem .dot{width:7px;height:7px;border-radius:50%;background:transparent;flex:0 0 7px;
    border:1px solid var(--border);}
  .navitem.seen .dot{background:var(--ok);border-color:var(--ok);}
  .navitem .nx{color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto;}

  /* ---- MAIN ---- */
  .main{flex:1 1 auto;min-width:0;padding:24px 30px 90px;max-width:860px;}
  h1{font-size:1.5rem;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:.92rem;margin:0 0 18px;}
  .sfhead{border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:8px;}
  .sfhead h1{font-size:1.55rem;}
  .meta{color:var(--muted);font-size:.82rem;margin-top:6px;}

  .section{margin:26px 0;}
  .section > h3{font-size:1.02rem;color:var(--accent2);margin:0 0 10px;
    display:flex;align-items:center;gap:10px;}
  .section > h3 .tag{font-size:.66rem;font-weight:700;letter-spacing:.4px;background:var(--panel2);
    border:1px solid var(--border);color:var(--muted);padding:2px 8px;border-radius:20px;
    text-transform:uppercase;}
  /* --- blocchi figura --- */
  .section > h3 .tag.plottag{background:#101f2e;border-color:#1f3c57;color:#7ab8e0;}
  .plot-intro{color:var(--muted);font-size:.95rem;margin:0 0 12px;}
  .plot-row{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;
    background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;}
  .plot-row.due .plot-box{flex:1 1 300px;min-width:280px;}
  .plot-box{max-width:560px;}
  .plot-leggi{margin-top:10px;background:var(--panel2);border:1px solid var(--border);
    border-left:3px solid #4a8fc7;border-radius:0 10px 10px 0;padding:11px 14px;
    font-size:.93rem;color:var(--muted);}
  .plot-leggi b{color:#7ab8e0;}
  .plot-err{color:#ff6b6b;font-size:.85rem;}
  /* --- figure importate da una dispensa del docente ---
     Stesso vestito dei plot nativi, di proposito: la figura viene dal suo PDF ma e'
     stata ri-colorata sulla nostra tavolozza da `figure-da-pdf.py`, e deve sembrare di
     casa invece che incollata. La riga `fonte` dice sempre da dove viene. */
  .fig-nota{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px;margin:14px 0;text-align:center;}
  .fig-nota img{max-width:100%;height:auto;}
  .fig-nota figcaption{margin-top:10px;background:var(--panel2);border:1px solid var(--border);
    border-left:3px solid #4a8fc7;border-radius:0 10px 10px 0;padding:11px 14px;
    font-size:.93rem;color:var(--muted);text-align:left;}
  .fig-nota figcaption b{color:#7ab8e0;}
  .fig-nota .fonte{display:block;margin-top:8px;font-size:.78rem;color:var(--muted);
    opacity:.7;text-align:right;font-style:italic;}
  .open-body{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
  .open-body p:first-child{margin-top:0;} .open-body p:last-child{margin-bottom:0;}
  .open-body ul{margin:.4em 0;padding-left:1.2em;} .open-body li{margin:.35em 0;}

  .note{background:var(--panel2);border-left:3px solid var(--muted);border-radius:6px;
    padding:9px 12px;margin:12px 0;font-size:.9rem;color:var(--muted);}
  .note b{color:#ff9d6b;}
  .note.warn{background:var(--warnbg);border-left-color:var(--warn);color:#e0b85a;}
  .note.warn b{color:#f0c25a;}

  /* ---- GRAMMATICA ---- */
  .gramwrap{background:var(--grambg);border:1px solid #1f4d47;border-radius:12px;padding:6px 6px;}
  table.gramtab{border-collapse:collapse;width:100%;font-size:.92rem;}
  table.gramtab td{padding:9px 12px;vertical-align:top;border-bottom:1px solid #17332e;}
  table.gramtab tr:last-child td{border-bottom:none;}
  table.gramtab td.gs{white-space:nowrap;color:var(--gram);width:1%;
    border-right:1px solid #17332e;font-variant-numeric:tabular-nums;}
  .section > h3 .tag.gramtag{background:var(--grambg);border-color:#1f4d47;color:var(--gram);}

  /* ---- STRUMENTI (repertorio condiviso: la scheda si apre DENTRO la frase) ----
     Nessun accento nuovo: riusa il verde della grammatica, perche' uno strumento
     richiamato e' grammatica gia' spiegata altrove, non una quinta specie di blocco. */
  .str{color:var(--gram);border-bottom:1px dashed var(--gram);cursor:pointer;}
  .str:hover{background:var(--grambg);}
  .str::after{content:"\2666";font-size:.62em;vertical-align:.42em;margin-left:2px;opacity:.8;}
  .str.aperto::after{content:"\2715";}
  .str.rotto{color:#ff6b6b;border-bottom-color:#ff6b6b;cursor:help;}
  /* la scheda e' uno SPAN in display:block, non un div: i rimandi cadono dentro
     <p>, <li> e celle di tabella, dove un div e' HTML illegale. */
  .strcard{display:block;margin:10px 0;background:var(--grambg);border:1px solid #1f4d47;
    border-left:3px solid var(--gram);border-radius:0 10px 10px 0;padding:10px 14px;font-size:.9rem;}
  .strcard .sh{display:block;font-size:.66rem;font-weight:700;letter-spacing:.5px;
    text-transform:uppercase;color:var(--gram);margin-bottom:7px;}
  .strcard .sr{display:block;margin:5px 0;}
  .strcard .sk{color:var(--gram);font-weight:600;}

  /* ---- PROLESSI (preannuncio fisico) ---- */
  .prowrap{background:var(--probg);border:1px solid var(--proedge);border-radius:12px;padding:4px 4px 8px;}
  .prohead{padding:11px 14px 4px;color:var(--pro);font-size:.72rem;font-weight:700;letter-spacing:.7px;
    text-transform:uppercase;}
  .pro-oggetto{padding:2px 14px 11px;color:var(--muted);font-size:.92rem;border-bottom:1px solid var(--proline);
    margin-bottom:2px;} .pro-oggetto b{color:var(--txt);}
  table.protab{border-collapse:collapse;width:100%;font-size:.92rem;}
  table.protab td{padding:10px 12px;vertical-align:top;border-bottom:1px solid var(--proline);}
  table.protab tr:last-child td{border-bottom:none;}
  table.protab td.pd{white-space:nowrap;color:var(--pro);width:1%;font-weight:700;font-size:.78rem;
    letter-spacing:.3px;text-transform:uppercase;border-right:1px solid var(--proline);line-height:1.3;}
  .pro-domanda{margin:8px 8px 2px;background:#140d26;border:1px solid var(--proedge);
    border-left:3px solid var(--pro);border-radius:8px;padding:10px 14px;font-size:.92rem;}
  .pro-domanda b{color:var(--pro);}
  .section > h3 .tag.protag{background:var(--probg);border-color:var(--proedge);color:var(--pro);}

  /* ---- REVEAL ---- */
  .rsteps{display:flex;flex-direction:column;gap:12px;}
  .rstep{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 18px;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .rlabel{font-size:.7rem;font-weight:700;letter-spacing:.4px;color:var(--accent);
    text-transform:uppercase;margin-bottom:8px;}
  .rstep p:first-of-type{margin-top:0;} .rstep p:last-child{margin-bottom:0;}
  .rstep ul{margin:.4em 0;padding-left:1.2em;}
  .testo{background:#13233f;border:1px solid #2b4877;border-radius:12px;padding:14px 18px;margin-bottom:14px;}
  .testo .src{display:block;font-size:.74rem;font-style:italic;color:var(--accent2);margin-bottom:8px;
    text-transform:uppercase;letter-spacing:.3px;}
  .esame-nota{font-size:.9rem;color:var(--muted);font-style:italic;margin-top:12px;padding-left:12px;
    border-left:3px solid var(--border);}

  .reveal-btn{background:var(--accent);color:#fff;border:none;padding:11px 18px;border-radius:10px;
    font-size:.95rem;font-weight:600;cursor:pointer;margin-top:14px;transition:.12s;}
  .reveal-btn:hover:not(:disabled){background:var(--accent2);}
  .reveal-btn.small{padding:7px 14px;font-size:.85rem;margin-top:0;background:var(--panel2);
    color:var(--accent2);border:1px solid var(--border);}
  .reveal-btn.small:hover:not(:disabled){border-color:var(--accent);}
  .reveal-btn:disabled,.reveal-btn.done{background:var(--panel2);color:var(--muted);
    border:1px solid var(--border);cursor:default;}

  /* ---- COLLAUDO ---- */
  .collaudo-item{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 18px;margin-bottom:12px;}
  .cq{margin-bottom:10px;}
  .ca{margin-top:12px;background:var(--okbg);border:1px solid #235c33;border-radius:8px;
    padding:10px 14px;font-size:.94rem;}
  .ca b{color:#5fd980;}

  /* ---- PREV / NEXT ---- */
  .prevnext{display:flex;justify-content:space-between;gap:12px;margin-top:40px;
    border-top:1px solid var(--border);padding-top:20px;}
  .pnbtn{flex:1 1 0;background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:12px 16px;cursor:pointer;color:var(--txt);text-align:left;transition:.14s;font:inherit;}
  .pnbtn:hover{border-color:var(--accent);background:var(--panel2);}
  .pnbtn.next{text-align:right;}
  .pnbtn .k{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .pnbtn .t{font-weight:600;color:var(--accent2);}
  .pnbtn:disabled{opacity:.35;cursor:default;border-color:var(--border);background:var(--panel);}

  code{background:var(--panel2);border:1px solid var(--border);border-radius:5px;
    padding:1px 5px;font-size:.85em;color:var(--accent2);}
  .katex{font-size:1.02em;color:var(--txt);} .katex-display{margin:.5em 0;overflow-x:auto;overflow-y:hidden;}

  @media(max-width:860px){
    .shell{flex-direction:column;}
    .sidebar{width:100%;flex:none;position:static;max-height:none;border-right:none;
      border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:4px;}
    .sidebar h2{width:100%;} .navitem{width:auto;}
    .main{padding:20px 16px 80px;}
  }
</style>

<script>
"use strict";
const R = String.raw;

function typeset(el){
  if(el && window.renderMathInElement){
    try{ renderMathInElement(el,{delimiters:[
      {left:'$$',right:'$$',display:true},
      {left:'$',right:'$',display:false}
    ],throwOnError:false}); }catch(e){}
  }
}
function elFromHTML(html){ var d=document.createElement('div'); d.innerHTML=html; return d; }

/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un
   rimando scritto nella prosa:

       <span class="str" data-str="serie-geometrica">la serie geometrica</span>

   Le schede citate da questo nucleo sono cucite qui sotto dal montaggio
   (assembla-nucleo.js): la pagina resta autosufficiente — niente fetch,
   niente sottocartelle da pubblicare — e un rimando a una scheda che non
   esiste FERMA la costruzione invece di arrivare in pagina rotto.
   Apertura: lo stesso gesto del collaudo (si clicca, il pannello compare,
   si typeset una volta sola), portato dentro la frase.
   =================================================================== */
var CORSO = 'geometria-differenziale';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["gruppo-di-lie"] = {"nome":"Gruppo di Lie","riga":"Una varieta differenziabile che e anche un gruppo, e in cui il prodotto $(g,h)\\mapsto gh$ e l'inverso $g\\mapsto g^{-1}$ sono applicazioni lisce.","serve":"a trattare insieme due strutture che di solito si studiano separate: la simmetria (il gruppo) e il calcolo differenziale (la varieta). La conseguenza che si usa di piu e l'omogeneita: le traslazioni $L_g(x)=gx$ sono diffeomorfismi, quindi ogni punto ha un intorno diffeomorfo a quello dell'identita, e tutto cio che si dimostra nell'identita si trasporta ovunque gratis. Da qui seguono due fatti usati continuamente: ogni gruppo di Lie e parallelizzabile, e per conoscerne la geometria infinitesima basta lo spazio tangente in un punto solo, che si chiama la sua algebra di Lie.","esempio":"Il gruppo delle rotazioni del piano $SO(2)$ e la circonferenza. Una sua matrice e $R(\\theta)=\\begin{pmatrix}\\cos\\theta & -\\sin\\theta\\\\ \\sin\\theta & \\cos\\theta\\end{pmatrix}$, e che il determinante valga $1$ si verifica subito: $\\cos^2\\theta+\\sin^2\\theta=1$. Il prodotto e liscio perche in coordinate e l'addizione degli angoli — svolgendo la riga in alto del prodotto $R(\\alpha)R(\\varphi)$ si trova $\\cos\\alpha\\cos\\varphi-\\sin\\alpha\\sin\\varphi=\\cos(\\alpha+\\varphi)$ e $\\sin\\alpha\\cos\\varphi+\\cos\\alpha\\sin\\varphi=\\sin(\\alpha+\\varphi)$, cioe $R(\\alpha)R(\\varphi)=R(\\alpha+\\varphi)$ — e l'inverso e $R(-\\theta)$, liscio in $\\theta$. La varieta sottostante e $S^1$, di dimensione $1$.","pieno":{"file":"gd-14-gruppi-di-lie.html","tappa":"01","come":"i gruppi di matrici, la traslazione che rende tutto omogeneo, e l'algebra di Lie come tangente all'identita"},"controllo":[{"tipo":"uguale","sinistra":"cos(theta)**2+sin(theta)**2","vale":"1","dove":"esempio","appare":"\\cos^2\\theta+\\sin^2\\theta=1"},{"tipo":"uguale","sinistra":"cos(alpha)*cos(varphi)-sin(alpha)*sin(varphi)","vale":"cos(alpha+varphi)","dove":"esempio","appare":"\\cos\\alpha\\cos\\varphi-\\sin\\alpha\\sin\\varphi=\\cos(\\alpha+\\varphi)"},{"tipo":"uguale","sinistra":"sin(alpha)*cos(varphi)+cos(alpha)*sin(varphi)","vale":"sin(alpha+varphi)","dove":"esempio","appare":"\\sin\\alpha\\cos\\varphi+\\cos\\alpha\\sin\\varphi=\\sin(\\alpha+\\varphi)"}]};
STRUM["omeomorfismo"] = {"nome":"Omeomorfismo","riga":"Una biiezione continua con inversa continua: due spazi omeomorfi sono lo stesso spazio scritto in due modi, per tutto ciò che la topologia sa vedere.","serve":"È la nozione di «uguale» che si usa quando si dice che una varietà è localmente come $\\mathbb{R}^n$. La richiesta che anche l'inversa sia continua non è pignoleria: senza di essa una biiezione continua può incollare cose lontane — l'applicazione $t\\mapsto(\\cos 2\\pi t,\\sin 2\\pi t)$ da $[0,1)$ alla circonferenza è continua e biunivoca, ma la sua inversa spezza la circonferenza in un punto, e infatti $[0,1)$ e $S^1$ non sono lo stesso spazio (uno è compatto, l'altro no). Le proprietà che si conservano per omeomorfismo — compattezza, connessione, dimensione, gruppo fondamentale — sono esattamente quelle di cui si può parlare su una varietà senza aver scelto una carta.","esempio":"L'intervallo aperto $(0,1)$ e la semiretta $(0,+\\infty)$ sono omeomorfi tramite $f(x)=\\dfrac{x}{1-x}$: è continua su $(0,1)$, manda $0^+$ in $0^+$ e $1^-$ in $+\\infty$, e la sua inversa è $g(y)=\\dfrac{y}{1+y}$, anch'essa continua. Che siano davvero una l'inversa dell'altra si verifica componendo: $g(f(x))=\\dfrac{x/(1-x)}{1+x/(1-x)}=x$. Ne segue che $(0,1)$ è omeomorfo anche a tutto $\\mathbb{R}$ (componendo con $y\\mapsto\\ln y$), il che dice una cosa che all'inizio sorprende: **la lunghezza non è una proprietà topologica**. Non lo è nemmeno l'essere limitato; lo è invece la compattezza, ed è per questo che $[0,1]$ non è omeomorfo a nessuno dei due.","debito":"nessun movimento del percorso tratta la topologia generale come argomento a sé: qui c'è ciò che serve per leggere la definizione di varietà. La classificazione di quali spazi sono omeomorfi a quali è il mestiere della topologia algebrica, e nel corso di Diverio entra solo per la numerabilità del gruppo fondamentale.","controllo":[{"tipo":"uguale","sinistra":"(x/(1-x))/(1+x/(1-x))","vale":"x","ipotesi":{"x":"positive"},"dove":"esempio","appare":"=x"}]};
STRUM["compattezza"] = {"nome":"Compattezza","riga":"Ogni ricoprimento aperto ammette un sottoricoprimento finito: è la proprietà che permette di passare da «vale vicino a ogni punto» a «vale su tutto», con un numero finito di passi.","serve":"È l'ipotesi che rende globali le conclusioni locali, ed è per questo che ricorre in ogni dimostrazione di geometria differenziale. In $\\mathbb{R}^n$ equivale a chiuso e limitato (Heine-Borel), ma su una varietà quell'equivalenza non si può usare come definizione, perché «limitato» richiede una distanza e una varietà non ne ha una privilegiata. La conseguenza che si usa più spesso è negativa: gli unici sottoinsiemi di $\\mathbb{R}^n$ che sono **insieme** aperti e compatti sono $\\emptyset$ e nient'altro — ed è l'argomento per cui una varietà compatta non può essere coperta da una sola carta.","esempio":"L'intervallo $(0,1)$ non è compatto, e si vede esibendo un ricoprimento senza sottoricoprimento finito: gli aperti $A_n=\\left(\\tfrac1n,1\\right)$ per $n\\ge2$ ricoprono $(0,1)$, perché ogni $x\\gt0$ sta in $A_n$ appena $\\tfrac1n\\lt x$, cioè appena $n\\gt1/x$. Ma una sottofamiglia finita $A_{n_1},\\dots,A_{n_k}$ ha un indice massimo $N$, quindi la sua unione è $\\left(\\tfrac1N,1\\right)$, e il punto $x=\\tfrac1{2N}$ resta fuori: è positivo, dunque sta in $(0,1)$, ed è minore di $\\tfrac1N$. Il conto che regge l'argomento è $\\lim_{n\\to\\infty}\\tfrac1n=0$: gli $A_n$ si avvicinano a coprire tutto, ma nessuno di essi contiene un intorno di $0$, e servirebbero tutti. Chiudendo l'intervallo, $[0,1]$ diventa compatto e quel ricoprimento smette di essere un ricoprimento — $0$ non sta in nessun $A_n$.","debito":"la dimostrazione del teorema di Heine-Borel e la teoria generale degli spazi compatti stanno fuori dal percorso: qui c'è l'uso che se ne fa. Nel corso di Diverio la compattezza entra come ipotesi (sfera, gruppi di Lie compatti) e come conclusione della locale compattezza delle varietà.","controllo":[{"tipo":"limite","espr":"1/n","var":"n","a":"oo","vale":"0","ipotesi":{"n":"positive"},"dove":"esempio","appare":"\\lim_{n\\to\\infty}\\tfrac1n=0"},{"tipo":"disuguaglianza","sinistra":"1/(2*N)","destra":"1/N","relazione":"<","ipotesi":{"N":"positive"},"dove":"esempio","appare":"minore di $\\tfrac1N$"}]};
STRUM["proiezione-stereografica"] = {"nome":"Proiezione stereografica","riga":"Da un polo si proietta la sfera sul piano tangente al polo opposto: $\\sigma(x,y,z)=\\left(\\frac{x}{1-z},\\frac{y}{1-z}\\right)$ è un diffeomorfismo fra $S^{2}$ meno il polo nord e $\\mathbb{R}^{2}$, e la stessa formula funziona in ogni dimensione.","serve":"È la carta con cui si dimostra che la sfera è una varietà — due proiezioni, dai due poli, coprono tutto — ed è per questo la prima costruzione concreta del corso. Le due proprietà per cui la si sceglie fra tutte le mappe possibili sono che è **conforme** (conserva gli angoli, non le distanze) e che **manda circonferenze in circonferenze o rette**: una circonferenza che passa per il polo di proiezione diventa una retta, tutte le altre restano circonferenze. La seconda proprietà è ciò che la rende insostituibile quando si visualizza $S^{3}$: le fibre della fibrazione di Hopf sono cerchi, e dopo la proiezione restano cerchi — tranne una, quella che passa per il polo tolto, che diventa una retta. Il prezzo è che un punto va perso, e questo non è un difetto della carta ma un teorema: $S^{n}$ è compatta e $\\mathbb{R}^{n}$ no, quindi nessuna carta può coprire tutto.","esempio":"Il conto che si rifà ogni volta è la norma dell'immagine. Per $(x,y,z)\\in S^{2}$ vale $x^{2}+y^{2}=1-z^{2}$, quindi $\\lVert\\sigma(x,y,z)\\rVert^{2}=\\frac{1-z^{2}}{(1-z)^{2}}=\\frac{1+z}{1-z}$, dove la semplificazione è la differenza di quadrati. Da qui si legge tutto senza altri conti: l'equatore $z=0$ va nella circonferenza di raggio $1$, perché $\\frac{1+0}{1-0}=1$; l'emisfero sud $z\\lt0$ finisce dentro il disco unitario; avvicinandosi al polo nord $z\\to1$ la norma esplode, ed è il punto che manca. Il polo sud $z=-1$ va nell'origine, come dev'essere: $\\frac{1-1}{1+1}=0$.","debito":"la conformità e la proprietà «cerchi in cerchi» sono qui dichiarate e non dimostrate: la prima si prova calcolando la metrica indotta, che risulta un multiplo di quella euclidea, e la seconda si prova osservando che la proiezione è la restrizione di un'inversione. Entrambe stanno in Lee, cap. 1, e nessuna delle due serve per i conti del percorso.","controllo":[{"tipo":"uguale","sinistra":"1-z**2","vale":"(1-z)*(1+z)","dove":"esempio","appare":"1-z^{2}"},{"tipo":"uguale","sinistra":"(1-z**2)/(1-z)**2","vale":"(1+z)/(1-z)","dove":"esempio","appare":"\\frac{1+z}{1-z}"},{"tipo":"uguale","sinistra":"(1+0)/(1-0)","vale":"1","dove":"esempio","appare":"\\frac{1+0}{1-0}=1"},{"tipo":"uguale","sinistra":"(1-1)/(1+1)","vale":"0","dove":"esempio","appare":"\\frac{1-1}{1+1}=0"}]};
STRUM["quoziente-topologico"] = {"nome":"Topologia quoziente","riga":"Si incollano punti dichiarandoli uguali, e si decide che un insieme è aperto nel quoziente quando la sua controimmagine è aperta sopra: è il modo di costruire spazi nuovi senza metterli dentro nessun ambiente.","serve":"È la seconda fabbrica di varietà, accanto ai grafici e ai prodotti, e produce proprio gli esempi che non si vedono come sottoinsiemi di $\\mathbb{R}^n$: il toro, il nastro di Möbius, lo spazio proiettivo. La regola pratica è sempre la stessa: una funzione definita sul quoziente è continua se e solo se, composta con la proiezione, è continua sopra — quindi si lavora sempre con i rappresentanti, controllando che il risultato non dipenda da quale si è scelto. Attenzione: **un quoziente di una varietà non è automaticamente una varietà**, e la proprietà che salta per prima è Hausdorff — la retta con due origini è proprio un quoziente mal riuscito.","esempio":"La circonferenza è $\\mathbb{R}/\\mathbb{Z}$: si dichiarano uguali due numeri che differiscono per un intero, e si manda la classe di $t$ nel punto $\\left(\\cos 2\\pi t,\\ \\sin 2\\pi t\\right)$. Perché la definizione sia lecita il risultato non deve dipendere dal rappresentante, e infatti $\\cos\\!\\left(2\\pi(t+1)\\right)=\\cos 2\\pi t$ e altrettanto per il seno: la mappa passa al quoziente. Ripetendo su due fattori si ottiene il toro $\\mathbb{T}^2=\\mathbb{R}^2/\\mathbb{Z}^2$, cioè il quadrato $[0,1]^2$ con i lati opposti incollati — lo spazio delle configurazioni del pendolo doppio, dove i due angoli sono definiti a meno di un giro. Le carte si prendono restringendo la proiezione a un quadratino di lato minore di $1$: lì è iniettiva, e la sua inversa dà le coordinate.","debito":"la verifica che il quoziente sia Hausdorff e a base numerabile va fatta caso per caso e qui non c'è: per il toro e per lo spazio proiettivo la si trova in Lee, Examples 1.4 e 1.5. Nel percorso, l'unico movimento che costruisce quozienti in dettaglio è gd-01.","controllo":[{"tipo":"uguale","sinistra":"cos(2*pi*(t+1))","vale":"cos(2*pi*t)","ipotesi":{"t":"real"},"dove":"esempio","appare":"\\cos\\!\\left(2\\pi(t+1)\\right)=\\cos 2\\pi t"},{"tipo":"simbolico","perche":"e' la notazione del quoziente di R^2 per il reticolo degli interi: si sta dando un nome allo spazio costruito, non calcolando un valore","dove":"esempio","appare":"\\mathbb{R}^2/\\mathbb{Z}^2"}]};

function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';
  return h;
}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

/* ---------------- 00 · DI COSA PARLA QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Di cosa parla questo movimento', meta:'Geometria Differenziale · voci G.3, G.5, G.6 · il movimento che rende possibile derivare',
  blocchi:[
  {t:'prosa', title:'Il problema, e la mossa', tag:'architettura', html:R`
  <p>Su una varietà topologica <b>non si può derivare</b>, e la ragione è precisa. Per dire che una funzione $f:M\to\mathbb{R}$ è derivabile in un punto, si sarebbe tentati di leggerla in una carta e chiedere che $f\circ\varphi^{-1}$ sia derivabile. Ma <b>la risposta dipenderebbe dalla carta</b>: un&rsquo;altra carta potrebbe darne una diversa, e la nozione non sarebbe una proprietà di $f$.</p>
  <p>Il problema non è accademico: è lo stesso che si incontrerebbe volendo dire che una curva su una superficie ha «velocità», o che un campo di vettori «varia con continuità». Ogni nozione differenziale si definisce in coordinate, e ogni coordinata è una scelta. <b>Senza un criterio che renda le scelte equivalenti, il calcolo differenziale su una varietà non esiste.</b></p>
  <p><b>La mossa è chiedere che le carte siano compatibili fra loro.</b> Se il passaggio da una carta all&rsquo;altra è liscio, allora leggere $f$ in una carta o nell&rsquo;altra dà lo stesso verdetto, per la regola della catena. <b>La struttura differenziabile non sta nelle carte: sta nelle funzioni di transizione</b>, ed è tutto il contenuto di questo movimento.</p>`}
]},

/* ---------------- 01 · ATLANTI E COMPATIBILITÀ ---------------- */
{ num:'01', title:'Atlanti, compatibilita e atlante massimale', meta:'la condizione di compatibilita · perche e simmetrica · l’atlante massimale e perche si prende',
  blocchi:[
  {t:'prosa', title:'La definizione, e come si verifica in pratica', tag:'grammatica', html:R`
  <p>Due carte $(U_\alpha,\varphi_\alpha)$ e $(U_\beta,\varphi_\beta)$ si dicono <b>compatibili</b> se la <b>funzione di transizione</b>
  $$\varphi_\beta\circ\varphi_\alpha^{-1}:\varphi_\alpha(U_\alpha\cap U_\beta)\to\varphi_\beta(U_\alpha\cap U_\beta)$$
  è liscia ($C^\infty$). <b>È una funzione fra aperti di $\mathbb{R}^n$</b>: qui «liscia» ha il significato ordinario dell&rsquo;analisi, e questo è il punto in cui tutto il calcolo che già si conosce entra nella teoria.</p>
  <p>La condizione è automaticamente <b>simmetrica</b>: l&rsquo;inversa della transizione è la transizione nell&rsquo;altro verso, ed è liscia perché un diffeomorfismo lo è in entrambi i versi. Se le carte non si sovrappongono, sono compatibili a vuoto.</p>
  <p>Un <b>atlante</b> è una famiglia di carte che copre $M$ e a due a due compatibili.
  $$\mathcal{A}=\{(U_\alpha,\varphi_\alpha)\}\ \text{atlante}\iff M=\bigcup_\alpha U_\alpha\ \ \text{e}\ \ \forall\alpha,\beta\ \ \varphi_\beta\circ\varphi_\alpha^{-1}\in C^{\infty}\big(\varphi_\alpha(U_\alpha\cap U_\beta),\ \varphi_\beta(U_\alpha\cap U_\beta)\big).$$
  <p><b>Il «$\forall\alpha,\beta$» va preso alla lettera</b>, e vale la pena sapere perché: la compatibilità è riflessiva e simmetrica, ma la <b>transitività non è automatica</b> — due carte entrambe compatibili con una terza possono non esserlo fra loro, perché la liscezza delle due transizioni su $U\cap W$ e $W\cap V$ non dice niente su $U\cap V$ dove $W$ non arriva. È per questo che si chiede la compatibilità a coppie su tutto l&rsquo;atlante, e non a catena. Una <b>varietà differenziabile</b> è una varietà topologica con un atlante — e da quel momento si può dire che cosa è liscio.</p>
  <p><b>Una precisazione sul grado di regolarità</b>, che il corso fissa una volta e poi dimentica: chiedendo che le transizioni siano soltanto $C^{k}$ si ottiene una varietà di classe $C^{k}$, e la teoria si può sviluppare per ogni $k$. <b>Si sceglie sempre $C^{\infty}$</b> per due ragioni pratiche: nelle dimostrazioni si deriva un numero imprecisato di volte e non si vuole tenere il conto, e un teorema di Whitney garantisce che ogni struttura $C^{k}$ con $k\ge1$ contiene una struttura $C^{\infty}$ compatibile. <b>Nulla si perde a lavorare nel caso liscio</b> — e per questo nessuno lo fa altrimenti.</p>`},
  {t:'reveal', title:'La sfera, verificata per intero', tag:'costruzione', steps:[
   {label:'Le due carte e la transizione', body:R`
   <p>Su $S^1$, le due proiezioni stereografiche dai poli. Sulla sovrapposizione (la circonferenza meno i due poli) la transizione è
   $$\varphi_S\circ\varphi_N^{-1}(u)=\frac1u,$$
   definita per $u\ne0$ e <b>liscia lì</b>: la sua derivata è $-\frac{1}{u^{2}}$, e tutte le successive esistono. <b>Le due carte sono compatibili, quindi $S^1$ è una varietà differenziabile.</b></p>
   <p>Lo stesso conto in dimensione $n$ dà $\vec u\mapsto\vec u/|\vec u|^{2}$, l&rsquo;inversione rispetto alla sfera unitaria: liscia ovunque tranne l&rsquo;origine, che è proprio il punto escluso. <b>Il fatto che la singolarità cada esattamente dove la carta non è definita non è una fortuna</b>: è la traduzione del fatto che il polo mancante a una carta è coperto dall&rsquo;altra.</p>`},
   {label:'La stessa sfera con le carte di Lee', body:R`
   <p>Lee usa per la sfera un altro atlante, che costa di più in carte ma niente in idee (Esempio 1.31, stampata 20). Per ogni coordinata $x^i$ e ogni segno, la semisfera $U_i^{\pm}=\{\pm x^i\gt0\}$ è il grafico di una funzione delle altre coordinate, e la carta $\varphi_i^{\pm}$ dimentica la coordinata $x^i$. Sono $2(n+1)$ carte, e la transizione fra due di esse, per $i\lt j$, rimette al posto giusto la coordinata dimenticata:
   $$\varphi_i^{\pm}\circ(\varphi_j^{\pm})^{-1}(u^1,\dots,u^n)=\big(u^1,\dots,\widehat{u^i},\dots,\pm\sqrt{1-|u|^2},\dots,u^n\big),$$
   con la radice nella posizione $j$. È liscia perché sulla sovrapposizione $|u|\lt1$ e la radice non arriva mai a zero. <b>Due atlanti diversi, la stessa struttura</b>: Lee chiede di verificarlo nel Problema 1-7(d), e la verifica è che ogni carta stereografica è compatibile con ogni carta-grafico.</p>`},
   {label:'Perche questo conto e il modello di tutti gli altri', body:R`
   <p>Ogni volta che in questo corso si costruisce una varietà, i passi sono <b>sempre</b> questi tre: si esibiscono le carte, si calcola la transizione sulle sovrapposizioni, si verifica che sia liscia. Lo si farà per lo spazio proiettivo, per la grassmanniana, per il fibrato tangente, e ogni volta la parte faticosa sarà scrivere bene le carte, non verificare la levigatezza della transizione — che di solito è una funzione razionale con denominatore non nullo per costruzione. <b>Chi ha fatto una volta il conto sulla sfera, li ha fatti tutti</b> — cambia solo l&rsquo;algebra della transizione.</p>`}
  ]}
]},

{ num:'02', title:'L’atlante massimale: la Proposizione 1.17, e la carta che sta in mezzo', meta:'perche si prende il massimale · la dimostrazione con una carta dell’atlante sotto ogni punto · la Fig. 1.7 calcolata sul cerchio',
  blocchi:[
  {t:'prosa', title:'L’atlante massimale, e perche si prende quello', tag:'idea', html:R`
  <p>Due atlanti diversi possono dare la <b>stessa</b> nozione di funzione liscia — basta che l&rsquo;unione sia ancora un atlante. Per non dover scegliere un rappresentante, si prende l&rsquo;<b>atlante massimale</b>: l&rsquo;insieme di <i>tutte</i> le carte compatibili con quelle date. Ogni atlante ne determina uno solo, e <b>la struttura liscia è per definizione quello</b>.</p>
  <p><b>La ragione è la stessa di ogni «massimale» in matematica</b>: si vuole che l&rsquo;oggetto non dipenda da una scelta arbitraria. In pratica non si lavora mai con l&rsquo;atlante massimale — si esibiscono due o tre carte — ma sapere che è lui la struttura evita di credere che la sfera con le carte stereografiche sia diversa dalla sfera con le carte per proiezione sui piani coordinati. <b>Sono la stessa varietà</b>, e la prova è che le loro carte sono compatibili fra loro.</p>`},
  {t:'reveal', title:'Ogni atlante sta in un solo atlante massimale: la Proposizione 1.17 di Lee', tag:'teorema', steps:[
   {label:'L’enunciato', body:R`
   <p>Lee lo enuncia così (Proposizione 1.17, stampata 13): ogni atlante liscio $\mathcal A$ di una varietà topologica è contenuto in un <b>unico</b> atlante liscio massimale, e due atlanti determinano lo stesso atlante massimale se e solo se la loro unione è ancora un atlante liscio. È la frase che rende legittimo «esibire due carte» al posto di «dare la struttura»: le due carte determinano la struttura, e nessun'altra.</p>`},
   {label:'La dimostrazione, e dove si scioglie la transitività', body:R`
   <p>Si prenda come candidato $\bar{\mathcal A}$, l'insieme di <b>tutte</b> le carte compatibili con ogni carta di $\mathcal A$. Il punto è mostrare che due carte $(U,\varphi)$, $(V,\psi)$ di $\bar{\mathcal A}$ sono compatibili fra loro, cioè che $\psi\circ\varphi^{-1}$ è liscia su $\varphi(U\cap V)$. È esattamente il problema della transitività che sopra si era detto non automatico, e Lee lo scioglie localmente: la liscezza è una proprietà <b>locale</b>, quindi basta verificarla vicino a ogni punto. Preso $p\in U\cap V$, le carte di $\mathcal A$ coprono $M$, quindi c'è una carta $(W,\theta)\in\mathcal A$ con $p\in W$, e vicino a $\varphi(p)$
   $$\psi\circ\varphi^{-1}=\big(\psi\circ\theta^{-1}\big)\circ\big(\theta\circ\varphi^{-1}\big),$$
   composizione di due mappe lisce perché $\varphi$ e $\psi$ sono entrambe compatibili con $\theta$. <b>La transitività fallisce in generale perché la carta intermedia può non arrivare dove servirebbe; qui funziona perché l'atlante $\mathcal A$ ne mette una sotto ogni punto.</b> Che $\bar{\mathcal A}$ sia massimale è immediato: una carta compatibile con tutte quelle di $\bar{\mathcal A}$ lo è in particolare con quelle di $\mathcal A$, e quindi sta già in $\bar{\mathcal A}$.</p>`},
   {label:'Quando una carta sola basta', body:R`
   <p>Lee ne trae la conseguenza che si usa più spesso (stampata 14): se una varietà topologica si copre con <b>una sola carta</b>, la condizione di compatibilità è vuota e quella carta determina una struttura liscia. È il caso degli spazi vettoriali, dei grafici, degli aperti di $\mathbb{R}^n$ — e, si vedrà sotto, dei gruppi di matrici che le prove d'esame chiedono di parametrizzare con una carta globale.</p>`}
  ]},
  {t:'plot', title:'La transizione delle due stereografiche del cerchio',
   intro:R`La funzione di transizione $u\mapsto1/u$ fra la carta dal polo nord e quella dal polo sud, sul ramo $u\gt0$: la coordinata di un punto nell'una e nell'altra carta. È il ridisegno della Fig. 1.6 di Lee nel caso del cerchio.`,
   plots:[
    {kind:'curve', x:'t', y:'1/t', tr:[0.3,3.3], height:280, equal:true,
     xr:[-0.3,3.5], yr:[-0.3,3.5],
     title:'u nella carta nord, 1/u nella carta sud: liscia dove entrambe esistono',
     segs:[{x1:1,y1:0,x2:1,y2:1,col:'#8ea0b8',dash:true},{x1:0,y1:1,x2:1,y2:1,col:'#8ea0b8',dash:true}],
     marks:[{x:1,y:1,col:'#d8a13a',label:'u = 1: l’equatore, dove le due carte coincidono'},
            {x:0,y:0,col:'#c084fc',hollow:true,label:'u = 0: polo sud, fuori dalla carta sud'}]}
   ],
   leggi:R`<p>Sull'asse orizzontale la coordinata di un punto del cerchio nella carta dal polo nord, su quello verticale la coordinata dello stesso punto nella carta dal polo sud. La curva è liscia in ogni punto in cui è definita, ed è definita esattamente sulla sovrapposizione: il cerchio meno i due poli. Quando $u\to0$ il punto si avvicina al polo sud, che la carta sud non vede, e la coordinata $1/u$ scappa all'infinito; quando $u\to\infty$ è il polo nord ad andarsene. Il punto $u=1$, dove le due coordinate coincidono, è l'equatore. Il ramo $u\lt0$ è il simmetrico rispetto all'origine. Generale: una transizione è un diffeomorfismo fra due aperti di $\mathbb{R}^n$, e i suoi «guai» stanno tutti fuori dal suo dominio. Accidentale: che sia una funzione razionale.</p>`},
  {t:'prosa', title:'La dimostrazione, con i numeri', tag:'esempio', html:R`
  <p>La dimostrazione della Proposizione 1.17 ha un disegno, la Fig. 1.7 di Lee: tre domini di carta che si sovrappongono attorno a un punto, due delle carte prese dal candidato $\bar{\mathcal A}$ e una dall&rsquo;atlante $\mathcal A$, e la transizione fra le prime due ottenuta passando per la terza. Conviene rifarla su un caso in cui ogni freccia è una formula.</p>
  <p>Sia $M=S^{1}$ e sia $\mathcal A$ l&rsquo;atlante delle <b>carte angolo</b>: $\theta_1$ definita fuori dal punto $(-1,0)$, a valori in $(-\pi,\pi)$, e $\theta_2$ definita fuori da $(1,0)$, a valori in $(0,2\pi)$. Sulla sovrapposizione le due differiscono di $0$ o di $2\pi$, quindi la transizione è una traslazione e l&rsquo;atlante è liscio. Le due <b>stereografiche</b>, $\varphi(x,y)=x/(1-y)$ dal polo nord e $\psi(x,y)=x/(1+y)$ dal polo sud, non stanno in $\mathcal A$; stanno però in $\bar{\mathcal A}$, perché sono compatibili con le carte angolo. Lette in funzione dell&rsquo;angolo sono
  $$\varphi\circ\theta_1^{-1}(t)=\frac{\cos t}{1-\sin t},\qquad \psi\circ\theta_1^{-1}(t)=\frac{\cos t}{1+\sin t},$$
  e le loro derivate si semplificano più di quanto la formula lasci sperare:
  $$\frac{d}{dt}\,\frac{\cos t}{1-\sin t}=\frac{1}{1-\sin t},\qquad \frac{d}{dt}\,\frac{\cos t}{1+\sin t}=-\frac{1}{1+\sin t}.$$
  <b>Nessuna delle due si annulla mai</b>: entrambe le transizioni sono lisce con inversa liscia, cioè $\varphi$ e $\psi$ sono compatibili con $\theta_1$, e lo stesso conto vale per $\theta_2$, che differisce da $\theta_1$ per una costante.</p>
  <p>Ora il passo della dimostrazione. Si prenda $p=(\tfrac{\sqrt3}{2},\tfrac12)$, il punto ad angolo $t_0=\pi/6$. Le due stereografiche lo leggono come
  $$\varphi(p)=\frac{\sqrt3/2}{1-1/2}=\sqrt3,\qquad \psi(p)=\frac{\sqrt3/2}{1+1/2}=\frac{\sqrt3}{3},$$
  e la loro transizione è $\psi\circ\varphi^{-1}(u)=1/u$, che in $u=\sqrt3$ vale proprio $1/\sqrt3$. Lee non calcola $\psi\circ\varphi^{-1}$ direttamente: la scrive come $(\psi\circ\theta^{-1})\circ(\theta\circ\varphi^{-1})$, due mappe lisce per ipotesi, e conclude. Che la scrittura non sia una finzione lo dice la derivata. Direttamente, $\frac{d}{du}\frac1u=-\frac1{u^{2}}$, che in $\sqrt3$ vale $-\tfrac13$. Passando per l&rsquo;angolo, la regola della catena dà il prodotto della derivata di $\psi\circ\theta^{-1}$ in $t_0$ per quella di $\theta\circ\varphi^{-1}$ in $\sqrt3$, cioè per il reciproco della derivata di $\varphi\circ\theta^{-1}$ in $t_0$:
  $$-\frac{1}{1+\sin t_0}\cdot(1-\sin t_0)=-\frac{1}{3/2}\cdot\frac12=-\frac13.$$
  <b>Lo stesso numero, per due strade.</b> La seconda strada è quella della dimostrazione, e ha un vantaggio che il cerchio nasconde: non richiede di sapere niente su $\psi\circ\varphi^{-1}$, solo che ciascuna delle due carte va d&rsquo;accordo con la carta di $\mathcal A$ che sta sotto il punto.</p>`},
  {t:'plot', title:'Tre carte attorno a un punto: la Fig. 1.7 di Lee sul cerchio',
   intro:R`A sinistra i tre domini: in arancione quello di $\varphi$ (tutto il cerchio meno il polo nord), in viola quello di $\psi$ (meno il polo sud), in verde quello della carta angolo $\theta_1$ (meno il punto $(-1,0)$). A destra le due stereografiche lette in funzione dell&rsquo;angolo, con i valori nel punto $p$ ad angolo $\pi/6$.`,
   plots:[
    {kind:'curve', x:'cos(t)', y:'sin(t)', tr:[0,6.2832], height:280, equal:true, xr:[-1.6,1.6], yr:[-1.6,1.6],
