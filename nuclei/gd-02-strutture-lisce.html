     curves:[{f:'cos(x)/(1-sin(x))', col:'#d8a13a', label:'φ in funzione dell’angolo'},{f:'cos(x)/(1+sin(x))', col:'#b98cff', label:'ψ in funzione dell’angolo'}],
     title:'le due stereografiche lette con la carta angolo: crescente una, decrescente l’altra, mai piatte',
     segs:[{x1:0.5236,y1:-4,x2:0.5236,y2:4,col:'#8ea0b8',width:1,dash:true}],
     marks:[{x:0.5236,y:1.7321,col:'#d8a13a',label:'φ(p) = √3'},{x:0.5236,y:0.5774,col:'#b98cff',label:'ψ(p) = 1/√3'}]}
   ],
   leggi:R`<p>Nella figura di sinistra si vede perché serve una carta dell&rsquo;atlante <i>sotto ogni punto</i>: i tre domini escludono tre punti diversi, e il punto $p$ sta in tutti e tre. In un punto vicino al polo nord il dominio arancione non c&rsquo;è, e la dimostrazione non ne ha bisogno: lì $\varphi$ non interviene. Il caso delicato sarebbe un punto dove manca la carta intermedia, e l&rsquo;ipotesi che $\mathcal A$ sia un atlante lo esclude.</p>
   <p>A destra, le due curve hanno un polo ciascuna — l&rsquo;arancione in $t=\pi/2$, il polo nord, la viola in $t=-\pi/2$, il polo sud — e fuori dai poli sono strettamente monotone: è l&rsquo;espressione grafica di «derivata mai nulla», cioè di compatibilità con la carta angolo. Nel punto $p$ la verticale tratteggiata incontra le due curve in $\sqrt3$ e in $1/\sqrt3$, e il prodotto dei due valori è $1$: le due ordinate sono legate dalla transizione $u\mapsto1/u$, che non compare nella figura ma si legge in ogni sua verticale. Il prodotto delle due funzioni è infatti identicamente uguale a $1$.</p>
   <p>Generale: due carte compatibili con una terza sono compatibili fra loro, purché la terza stia sotto il punto. Accidentale: che sul cerchio tutte e tre le carte si scrivano in forma chiusa.</p>`}
]},


/* ---------------- 02 · GLI ESEMPI ---------------- */
{ num:'03', title:'Gli esempi che Diverio costruisce, e uno che non funziona', meta:'spazi vettoriali e matrici · sfere · spazi proiettivi · gruppi di Lie · il cono quadratico',
  blocchi:[
  {t:'prosa', title:'La famiglia di esempi', tag:'regola operativa', html:R`
  <ul>
   <li><b>spazi vettoriali reali di dimensione finita</b>, e tutto ciò che ne discende: le matrici $M_{n}(\mathbb{R})\cong\mathbb{R}^{n^2}$, le applicazioni lineari, e — aperto dentro le matrici — il <b>gruppo lineare generale</b> $GL(n,\mathbb{R})$, che è un aperto perché il determinante è continuo e $GL$ è la controimmagine di $\mathbb{R}\setminus\{0\}$. <b>Una varietà di dimensione $n^2$ che è anche un gruppo</b>: il primo esempio di <span class="str" data-str="gruppo-di-lie">gruppo di Lie</span>;</li>
   <li><b>matrici di rango massimo</b> $M_m(m\times n,\mathbb{R})$, con $m\lt n$: anche queste formano un aperto delle matrici, e per la stessa ragione di $GL$ — una matrice di rango $m$ ha un minore $m\times m$ non nullo, il determinante di quel minore resta non nullo vicino a lei, e quindi ha un intorno di matrici di rango massimo (Lee, Esempio 1.28, stampata 19). <b>Il criterio «aperto di qualcosa di noto» vale ogni volta che la condizione è una disuguaglianza stretta fra funzioni continue</b>;</li>
   <li><b>grafici di funzioni lisce</b>: carta globale, struttura ovvia — Lee li usa per dare alla sfera le sue carte (Esempio 1.30, stampata 20);</li>
   <li><b>sfere</b>: le stereografiche, come sopra;</li>
   <li><b>spazi proiettivi</b> $\mathbb{RP}^{n}$: le rette per l&rsquo;origine di $\mathbb{R}^{n+1}$. Le carte sono gli $n+1$ aperti $U_i=\{x_i\ne0\}$ con le coordinate affini $x_j/x_i$, e le transizioni sono <b>funzioni razionali</b> con denominatore non nullo dove servono: lisce. <b>$\mathbb{RP}^1$ è omeomorfo a $S^1$; $\mathbb{RP}^2$ non è immergibile in $\mathbb{R}^3$</b>, ed è il primo esempio di varietà che si costruisce senza poterla disegnare — cioè la ragione per cui l&rsquo;approccio astratto serve.</li>
  </ul>`},
  {t:'prosa', title:'Il cono quadratico: quando non e nemmeno una varieta topologica', tag:'first principles', html:R`
  <p>L&rsquo;insieme $\{x^{2}+y^{2}=z^{2}\}$ — il doppio cono — <b>non è una varietà topologica</b>, e il punto singolare è il vertice. L&rsquo;argomento non è «si vede che ha una punta»: si toglie il vertice e si guarda cosa resta. Un intorno del vertice privato del vertice ha <b>due</b> componenti connesse (le due falde), mentre un intorno di un punto di $\mathbb{R}^2$ privato del punto è connesso. <b>Un omeomorfismo conserva il numero di componenti connesse</b>, quindi non può esistere.</p>`},
  {t:'plot', title:'Il cono: liscio dappertutto tranne in un punto',
   intro:R`La falda superiore del cono $z=\sqrt{x^{2}+y^{2}}$, ruotabile. Fuori dal vertice è il grafico di una funzione liscia; nel vertice la superficie ha una punta, e togliendo il vertice l'intorno si spezza in due.`,
   plots:[
    {kind:'param3d', x:'u*cos(v)', y:'u*sin(v)', z:'u',
     ur:[0.001,1.6], vr:[0,6.2832], nu:20, nv:34, yaw:0.7, pitch:0.45, alpha:0.88, height:340,
     title:'la falda superiore: ogni punto tranne il vertice ha un intorno che e un grafico'}
   ],
   leggi:R`<p><b>Guarda il vertice, che è l'unico punto interessante.</b> Ovunque altrove la superficie si appiattisce a piacere ingrandendo abbastanza — è localmente il grafico di una funzione liscia, e quindi una varietà. Nel vertice, invece, per quanto si ingrandisca la punta resta una punta: l'ingrandimento non la smussa, perché il cono è <i>autosimile</i>.</p>
   <p>La figura disegna solo la falda superiore. Il doppio cono completo ha anche quella inferiore, che tocca la prima esattamente nel vertice — e <b>lì sta l'argomento della dimostrazione</b>: togliendo il vertice, un suo intorno nel doppio cono si spezza in due pezzi sconnessi, mentre un intorno bucato in $\mathbb{R}^{2}$ resta connesso.</p>
   <p><b>Una precisazione che la figura rende necessaria</b>: la <i>singola</i> falda, vertice compreso, <b>è</b> una varietà topologica — è omeomorfa a un piano, basta spianarla. Non è però una <i>sottovarietà liscia</i> di $\mathbb{R}^{3}$, perché l'inclusione nello spazio ambiente non è liscia nel vertice. <b>Le due domande sono diverse e vanno tenute separate</b>: «è una varietà?» riguarda l'oggetto, «è una sottovarietà?» riguarda il modo in cui sta dentro l'ambiente.</p>`},
  {t:'prosa', title:'Perche la prova negativa e piu istruttiva di quella positiva', tag:'metodo', html:R`
  <div class="note"><b>È il primo esempio di una prova NEGATIVA — che qualcosa non è una varietà</b>, ed è una tecnica che vale la pena conservare: si cerca un <i>invariante topologico locale</i> che distingue il punto sospetto da un punto di $\mathbb{R}^n$. La connessione dell&rsquo;intorno bucato è il più semplice; in casi più difficili si usano i gruppi di omologia locale. <b>Chiedere «è liscio?» prima di aver verificato «è una varietà topologica?» è l&rsquo;errore da non fare.</b></div>`}
]},

/* ---------------- 02c · IL LEMMA DELLE CARTE ---------------- */
{ num:'04', title:'Il lemma delle carte di Lee: la topologia la danno le carte', meta:'partire da un insieme senza topologia · le cinque condizioni · la dimostrazione · lo spazio proiettivo complesso e la sfera di Bloch',
  blocchi:[
  {t:'prosa', title:'Il problema: un insieme che non ha ancora una topologia', tag:'architettura', html:R`
  <p>Fin qui ogni esempio è stato costruito in due tempi: prima uno spazio topologico, poi la verifica che sia una varietà topologica, poi l'atlante liscio. Lee osserva che spesso conviene fare tutto insieme, perché l'oggetto di partenza è un <b>insieme</b> senza topologia — l'insieme delle rette per l'origine, dei sottospazi di dimensione $k$, delle matrici con una proprietà — e le carte sono l'unica cosa che si sa scrivere (stampata 21). Il lemma che segue dice che allora le carte bastano: costruiscono la topologia, e insieme la struttura liscia.</p>`},
  {t:'reveal', title:'Il lemma, e la sua dimostrazione', tag:'teorema', steps:[
   {label:'Le cinque condizioni', body:R`
   <p><b>Lemma delle carte</b> (Lee, Lemma 1.35, stampata 21). Sia $M$ un insieme, e siano dati sottoinsiemi $U_\alpha\subseteq M$ con mappe $\varphi_\alpha:U_\alpha\to\mathbb{R}^n$ tali che:</p>
   <ol>
   <li>ogni $\varphi_\alpha$ è una biiezione di $U_\alpha$ su un aperto di $\mathbb{R}^n$;</li>
   <li>per ogni $\alpha,\beta$, gli insiemi $\varphi_\alpha(U_\alpha\cap U_\beta)$ e $\varphi_\beta(U_\alpha\cap U_\beta)$ sono aperti in $\mathbb{R}^n$;</li>
   <li>quando $U_\alpha\cap U_\beta\ne\emptyset$, la transizione $\varphi_\beta\circ\varphi_\alpha^{-1}$ è liscia;</li>
   <li>un'infinità numerabile dei $U_\alpha$ ricopre $M$;</li>
   <li>dati due punti distinti $p\ne q$, o c'è un $U_\alpha$ che li contiene entrambi, o ci sono $U_\alpha\ni p$ e $U_\beta\ni q$ disgiunti.</li>
   </ol>
   <p>Allora $M$ ha un'unica struttura di varietà liscia in cui ogni $(U_\alpha,\varphi_\alpha)$ è una carta liscia.</p>`},
   {label:'La topologia si definisce con le carte', body:R`
   <p>Si prendono come base della topologia tutti gli insiemi $\varphi_\alpha^{-1}(V)$, con $V$ aperto di $\mathbb{R}^n$. Che siano una base lo si vede sull'intersezione di due di essi: per la (iii) l'insieme $(\varphi_\beta\circ\varphi_\alpha^{-1})^{-1}(W)$ è aperto in $\varphi_\alpha(U_\alpha\cap U_\beta)$, e per la (ii) è aperto anche in $\mathbb{R}^n$; quindi $$\varphi_\alpha^{-1}(V)\cap\varphi_\beta^{-1}(W)=\varphi_\alpha^{-1}\big(V\cap(\varphi_\beta\circ\varphi_\alpha^{-1})^{-1}(W)\big)$$ è ancora un insieme della forma voluta. Con questa topologia ogni $\varphi_\alpha$ è un omeomorfismo sull'immagine — quasi per definizione — e $M$ è localmente euclideo.</p>`},
   {label:'Hausdorff e base numerabile, dalle ultime due condizioni', body:R`
   <p>Le condizioni (iv) e (v) sono esattamente quelle che servono per le due proprietà della definizione di varietà che le carte, da sole, non danno. Se $p$ e $q$ stanno in uno stesso $U_\alpha$, si separano lì dentro, perché $\varphi_\alpha$ è un omeomorfismo con un aperto di $\mathbb{R}^n$ che è di Hausdorff; altrimenti la (v) dà due domini disgiunti. La base numerabile viene dalla (iv): ogni $U_\alpha$ è omeomorfo a un aperto di $\mathbb{R}^n$, quindi ha base numerabile, e un'unione numerabile di spazi a base numerabile ha base numerabile. La (iii), infine, rende l'atlante liscio. È il punto di cui si diceva a proposito dei quozienti: <b>Hausdorff è la condizione che salta</b>, e qui la si paga con la (v).</p>`}
  ]},
  {t:'prosa', title:'Un esempio che la fisica usa: lo spazio proiettivo complesso', tag:'esempi', html:R`
  <p>Lee propone come esercizio la versione complessa dello spazio proiettivo (Problema 1-9, stampata 31): $\mathbb{CP}^n$ è l'insieme delle rette complesse per l'origine di $\mathbb{C}^{n+1}$. Il caso $n=1$ basta a vedere il lemma al lavoro. Un punto di $\mathbb{CP}^1$ è una classe $[z_0:z_1]$ di coppie non entrambe nulle, identificate se differiscono per un fattore complesso non nullo. Le due carte sono $U_0=\{z_0\ne0\}$ con $\varphi_0[z_0:z_1]=z_1/z_0$, e $U_1=\{z_1\ne0\}$ con $\varphi_1[z_0:z_1]=z_0/z_1$, ciascuna una biiezione su tutto $\mathbb{C}\cong\mathbb{R}^2$. La transizione sulla sovrapposizione $\mathbb{C}\setminus\{0\}$ è $w\mapsto1/w$; scritta in coordinate reali, con $w=x+iy$, è $(x,y)\mapsto\big(x,-y\big)/(x^2+y^2)$, e il suo jacobiano ha determinante</p>
  $$\det J=\frac{1}{(x^2+y^2)^2}\neq0,$$
  <p>liscio e mai nullo fuori dall'origine. Le condizioni (iv) e (v) sono gratis: due carte bastano, e due punti diversi stanno sempre insieme in una delle due, perché un punto fuori da $U_0$ è soltanto $[0:1]$ e uno fuori da $U_1$ è soltanto $[1:0]$. Quindi $\mathbb{CP}^1$ è una varietà liscia di dimensione reale due, ed è la sfera: la stessa transizione $1/w$, a meno di una coniugazione, è quella delle stereografiche di $S^2$. In meccanica quantistica è la <b>sfera di Bloch</b>: gli stati di uno spin un mezzo sono vettori di $\mathbb{C}^2$ a meno di una fase e della norma, cioè punti di $\mathbb{CP}^1$, e la carta $z_1/z_0$ è il rapporto fra l'ampiezza di «giù» e quella di «su».</p>`}
]},

{ num:'05', title:'Il lemma su un insieme vero: le rette del piano sono una varieta', meta:'due carte per le rette affini · le cinque condizioni controllate · la Fig. 1.9 ridisegnata · e perche ne esce un nastro di Möbius',
  blocchi:[
  {t:'prosa', title:'L’insieme, e le due carte', tag:'esempio', html:R`
  <p>La Fig. 1.9 di Lee disegna lo schema del lemma delle carte: un insieme senza topologia, due sottoinsiemi, le loro immagini aperte in $\mathbb{R}^n$ e la transizione fra le immagini della sovrapposizione. Il lemma è più facile da credere quando lo si vede lavorare su un insieme che nessuno ha già messo dentro uno spazio ambiente, e il più piccolo è questo: $M$ è l&rsquo;insieme di <b>tutte le rette affini</b> del piano, comprese quelle che non passano per l&rsquo;origine. Un elemento di $M$ è una retta, non un punto, e a priori non c&rsquo;è nessuna nozione di «rette vicine».</p>
  <p>Le carte sono le due descrizioni che si imparano a scuola. Una retta <b>non verticale</b> si scrive in un solo modo come $y=mx+q$, e si pone
  $$U_1=\{\text{rette non verticali}\},\qquad \varphi_1(L)=(m,q)\in\mathbb{R}^{2}.$$
  Una retta <b>non orizzontale</b> si scrive in un solo modo come $x=ny+p$, e si pone
  $$U_2=\{\text{rette non orizzontali}\},\qquad \varphi_2(L)=(n,p)\in\mathbb{R}^{2}.$$
  Ciascuna è una biiezione su tutto $\mathbb{R}^2$: ogni coppia di numeri è una retta e ogni retta del dominio dà una coppia sola. La sovrapposizione $U_1\cap U_2$ è fatta delle rette né verticali né orizzontali, cioè quelle con $m\neq0$; la sua immagine è $\varphi_1(U_1\cap U_2)=\{(m,q):m\neq0\}$, il piano meno una retta, aperto. Lo stesso per $\varphi_2(U_1\cap U_2)=\{(n,p):n\neq0\}$.</p>`},
  {t:'prosa', title:'La transizione, e le cinque condizioni', tag:'teorema', html:R`
  <p>Per la transizione basta risolvere l&rsquo;equazione di una carta nella variabile dell&rsquo;altra. Da $y=mx+q$ con $m\neq0$ si ricava $x=(y-q)/m$, cioè
  $$\varphi_2\circ\varphi_1^{-1}(m,q)=\Big(\frac1m,\ -\frac qm\Big),$$
  liscia dove $m\neq0$. L&rsquo;inversa ha la stessa forma, $(n,p)\mapsto(1/n,\,-p/n)$, e componendo le due si torna al punto di partenza. Lo jacobiano della transizione è
  $$\det\frac{\partial(n,p)}{\partial(m,q)}=\det\begin{pmatrix}-1/m^{2}&0\\ q/m^{2}&-1/m\end{pmatrix}=\frac{1}{m^{3}},$$
  mai nullo sulla sovrapposizione. La retta $y=2x+1$, per esempio, ha coordinate $(2,1)$ nella prima carta e $(\tfrac12,-\tfrac12)$ nella seconda: in effetti $x=\tfrac12y-\tfrac12$ è la stessa retta.</p>
  <p>Le cinque condizioni del Lemma 1.35 si controllano una per una. (i) Ogni $\varphi_i$ è una biiezione su $\mathbb{R}^2$, che è aperto. (ii) Le immagini della sovrapposizione sono il piano meno un asse, aperte. (iii) La transizione è liscia. (iv) Due domini bastano a ricoprire $M$, perché nessuna retta è insieme verticale e orizzontale. (v) È l&rsquo;unica che chiede un pensiero. Due rette distinte stanno nello stesso dominio salvo un caso: una verticale, che sta solo in $U_2$, e una orizzontale, che sta solo in $U_1$. Lì servono due intorni disgiunti, e li danno le pendenze: le rette con $|m|<1$ formano un aperto di $U_1$ che contiene l&rsquo;orizzontale, quelle con $|n|<1$ un aperto di $U_2$ che contiene la verticale. Una retta del primo ha pendenza minore di uno in valore assoluto; una del secondo, se non è verticale, ha pendenza $m=1/n$ con $|m|>1$. <b>Nessuna retta sta in entrambi</b>, e la condizione di Hausdorff vale.</p>
  <p>Il lemma conclude che $M$ ha un&rsquo;unica struttura di varietà liscia di dimensione due in cui le due descrizioni scolastiche sono carte. <b>Con essa, «rette vicine» vuol dire rette con pendenza e intercetta vicine</b>, in una qualunque delle due carte in cui entrambe stanno.</p>`},
  {t:'plot', title:'Le rette del piano e le loro due carte',
   intro:R`Il ridisegno della Fig. 1.9 di Lee su questo insieme. A sinistra tre elementi di $M$: la retta $L$ di equazione $y=2x+1$, che sta in entrambi i domini, una orizzontale e una verticale. Al centro l&rsquo;immagine della carta $\varphi_1$, a destra quella di $\varphi_2$.`,
   plots:[
    {kind:'curve', x:'0', y:'0', tr:[0,1], height:250, equal:true, xr:[-1.8,1.8], yr:[-1.8,3.4],
     title:'tre rette del piano, cioè tre punti di M',
     segs:[{x1:-1.2,y1:-1.4,x2:0.9,y2:2.8,col:'#d8a13a',width:2.4,label:'L: y = 2x + 1',lx:0.55,ly:3},{x1:-1.5,y1:0.5,x2:1.5,y2:0.5,col:'#5eead4',width:2.4,label:'y = 1/2',lx:1.2,ly:0.75},{x1:-1,y1:-1.5,x2:-1,y2:3.2,col:'#b98cff',width:2.4,label:'x = -1',lx:-0.6,ly:-1.3}]},
    {kind:'curve', x:'0', y:'0', tr:[0,1], height:230, equal:true, xr:[-2.6,2.6], yr:[-2.1,2.1],
     title:'la carta φ₁ = (m, q): la verticale non c’è',
     marks:[{x:2,y:1,col:'#d8a13a',label:'L = (2, 1)',left:true},{x:0,y:0.5,col:'#5eead4',label:'y = 1/2',up:true}],
     segs:[{x1:0,y1:-2,x2:0,y2:2,col:'#ff6b6b',width:1.4,dash:[5,4],label:'m = 0: fuori da U₂',lx:0.95,ly:-1.75},{x1:-1,y1:-2,x2:-1,y2:2,col:'#5eead4',width:1,dash:[3,3]},{x1:1,y1:-2,x2:1,y2:2,col:'#5eead4',width:1,dash:[3,3]}]},
    {kind:'curve', x:'0', y:'0', tr:[0,1], height:230, equal:true, xr:[-2.6,2.6], yr:[-2.1,2.1],
     title:'la carta φ₂ = (n, p): l’orizzontale non c’è',
     marks:[{x:0.5,y:-0.5,col:'#d8a13a',label:'L = (1/2, -1/2)'},{x:0,y:-1,col:'#b98cff',label:'x = -1',left:true}],
     segs:[{x1:0,y1:-2,x2:0,y2:2,col:'#ff6b6b',width:1.4,dash:[5,4],label:'n = 0: fuori da U₁',lx:0.95,ly:-1.75},{x1:-1,y1:-2,x2:-1,y2:2,col:'#b98cff',width:1,dash:[3,3]},{x1:1,y1:-2,x2:1,y2:2,col:'#b98cff',width:1,dash:[3,3]}]}
   ],
   leggi:R`<p>Nella carta centrale la retta tratteggiata rossa $m=0$ è il luogo delle orizzontali: appartengono a $U_1$, ma non alla sovrapposizione, ed è per questo che l&rsquo;immagine di $U_1\cap U_2$ è il piano meno quell&rsquo;asse. A destra lo stesso per $n=0$, il luogo delle verticali. Il punto arancione si sposta da $(2,1)$ a $(\tfrac12,-\tfrac12)$ passando da una carta all&rsquo;altra: è la transizione, che manda la striscia $|m|\gt1$ nella striscia $|n|\lt1$ e viceversa.</p>
   <p>Le due strisce tratteggiate sono gli intorni della condizione (v): $|m|\lt1$ attorno all&rsquo;orizzontale, $|n|\lt1$ attorno alla verticale. La verticale non compare nella carta centrale e l&rsquo;orizzontale non compare in quella di destra: è proprio il caso in cui nessun dominio le contiene entrambe e la separazione va costruita.</p>
   <p>Generale: un insieme diventa una varietà quando le sue descrizioni locali sono biiezioni su aperti e si incollano in modo liscio. Accidentale: che bastino due carte e che siano le equazioni delle rette che si imparano a scuola.</p>`},
  {t:'prosa', title:'Che varieta e: un nastro di Möbius senza bordo', tag:'idea', html:R`
  <p>Il lemma dice che $M$ è una varietà, non quale. Lo jacobiano della transizione ne dà un indizio: $1/m^{3}$ è positivo per $m\gt0$ e negativo per $m\lt0$, cioè la transizione conserva il verso su una metà della sovrapposizione e lo rovescia sull&rsquo;altra. Su una varietà come il cilindro o il piano si possono sempre scegliere carte che conservano il verso; qui no, e la ragione si vede con una terza descrizione.</p>
  <p>Ogni retta si scrive come $x\cos\alpha+y\sin\alpha=s$, con $\alpha$ l&rsquo;angolo della normale e $s$ la distanza con segno dall&rsquo;origine. La coppia $(\alpha,s)$ però non è unica: sostituendo $\alpha+\pi$ al posto di $\alpha$ e $-s$ al posto di $s$ si ottiene la stessa equazione cambiata di segno, cioè la stessa retta, perché
  $$x\cos(\alpha+\pi)+y\sin(\alpha+\pi)=-(x\cos\alpha+y\sin\alpha).$$
  Quindi $M$ è la striscia $[0,\pi]\times\mathbb{R}$ con il lato sinistro incollato al destro dopo averlo ribaltato, $(0,s)\sim(\pi,-s)$: <b>è il nastro di Möbius aperto</b>. Il cambio di segno dello jacobiano è l&rsquo;ombra di quel ribaltamento.</p>
  <p>Due conseguenze che non sono decorazione. Lo spazio delle rette del piano è il primo esempio in cui una varietà nasce da un problema geometrico e risulta non orientabile senza che nessuno l&rsquo;abbia costruita apposta. E lo stesso schema — un insieme di oggetti geometrici, una carta per ogni modo di scriverli con dei numeri — è quello che costruisce le Grassmanniane, gli spazi proiettivi e, in fisica, gli spazi delle configurazioni dei corpi rigidi.</p>`}
]},


/* ---------------- 02d · CARTE GLOBALI DI GRUPPI DI MATRICI ---------------- */
{ num:'06', title:'Carta globale di un gruppo di matrici: il gesto che le prove chiedono', meta:'una carta sola, quindi nessuna compatibilità da verificare · le rotazioni iperboliche del piano · le similitudini conformi · come si trova la parametrizzazione',
  blocchi:[
  {t:'prosa', title:'Perché è il gesto d’esame', tag:'regola operativa', html:R`
  <p>Le prove di Diverio chiedono la struttura liscia quasi sempre nella stessa forma: dato un gruppo di matrici di dimensione bassa, esibirne una <b>carta globale</b>. La prova del 15/07, punto (v), chiede le rotazioni iperboliche del piano; quella del 14/09, punto (v), le similitudini conformi che conservano l'orientazione. La ragione per cui la domanda è ben posta è la conseguenza della Proposizione 1.17 vista sopra: una carta che copre tutto non deve essere compatibile con nessun'altra, quindi basta mostrare che è un omeomorfismo con un aperto di $\mathbb{R}^n$. Il lavoro vero è trovare la parametrizzazione, e c'è una strada che funziona quasi sempre: scrivere la condizione che definisce il gruppo, risolverla rispetto a pochi parametri liberi, e controllare che la mappa inversa sia continua.</p>`},
  {t:'reveal', title:'Le rotazioni iperboliche del piano', tag:'costruzione', steps:[
   {label:'Il gruppo e la condizione', body:R`
   <p>Il gruppo di Lorentz in una dimensione spaziale è fatto delle matrici che conservano la forma $\eta=\operatorname{diag}(1,-1)$, cioè $A^T\eta A=\eta$; la componente connessa dell'identità, $SO^+(1,1)$, è quella con determinante uno e primo elemento positivo. Imponendo la condizione su $A=\begin{pmatrix}a&b\\c&d\end{pmatrix}$ si trova $a^2-c^2=1$, $d^2-b^2=1$, $ab=cd$; con $a\gt0$ e $\det A=1$ resta un parametro solo.</p>`},
   {label:'La carta, e la verifica', body:R`
   <p>La parametrizzazione è quella della prova: $$t\mapsto\Lambda(t)=\begin{pmatrix}\cosh t&\sinh t\\ \sinh t&\cosh t\end{pmatrix},\qquad t\in\mathbb{R}.$$ È nel gruppo: $$\det\Lambda(t)=\cosh^2t-\sinh^2t=1,\qquad \Lambda(t)^T\eta\,\Lambda(t)=\eta.$$ È suriettiva sul gruppo perché ogni soluzione con $a\gt0$ di $a^2-c^2=1$ si scrive $a=\cosh t$, $c=\sinh t$ per un solo $t$, ed è iniettiva per lo stesso motivo; l'inversa è $A\mapsto\operatorname{arcsinh}(c)$, continua. Quindi la carta globale è $A\mapsto\operatorname{arcsinh}(A_{21})$, e $SO^+(1,1)$ è una varietà liscia di dimensione uno, diffeomorfa alla retta. C'è di più: la carta trasforma il prodotto in una somma, $$\Lambda(s)\Lambda(t)=\Lambda(s+t),$$ quindi è anche un isomorfismo con $(\mathbb{R},+)$. Il parametro $t$ è la <b>rapidità</b> della relatività ristretta, e la formula dice che le rapidità di boost lungo lo stesso asse si sommano, mentre le velocità no.</p>`}
  ]},
  {t:'plot', title:'La componente dell’identità di SO(1,1) come ramo di iperbole',
   intro:R`La prima colonna $(\cosh t,\sinh t)$ di $\Lambda(t)$ al variare della rapidità $t$: un ramo dell'iperbole $a^2-c^2=1$, con l'identità in $t=0$.`,
   plots:[
    {kind:'curve', x:'cosh(t)', y:'sinh(t)', tr:[-1.8,1.8], height:300, equal:true,
     xr:[-0.4,3.4], yr:[-3.1,3.1],
     title:'a = cosh t, c = sinh t: una carta globale, la rapidita t',
     segs:[{x1:0,y1:0,x2:3.1,y2:3.1,col:'#8ea0b8',dash:true,label:'asintoto c = a',lx:2.2,ly:2.75},
           {x1:0,y1:0,x2:3.1,y2:-3.1,col:'#8ea0b8',dash:true}],
     marks:[{x:1,y:0,col:'#5eead4',label:'t = 0: l’identita'},{x:1.543,y:1.175,col:'#d8a13a',label:'t = 1'},{x:3.107,y:2.94,col:'#c084fc',label:'t = 1.8',left:true}]}
   ],
   leggi:R`<p>Ogni punto del ramo è una matrice del gruppo, letta sulla sua prima colonna; il parametro $t$ lo percorre una volta sola, da un estremo all'altro, e non lo richiude mai: per questo la carta è globale e il gruppo è una retta, non un cerchio. Le due rette tratteggiate sono gli asintoti $c=\pm a$, che il ramo non raggiunge: corrispondono a una rapidità infinita, cioè alla velocità della luce, e non stanno nel gruppo. L'altro ramo, con $a\lt0$, è la seconda componente di $SO(1,1)$, quella che inverte il verso del tempo, e non è raggiungibile con continuità dall'identità. Generale: un gruppo di matrici a un parametro non compatto è una retta. Accidentale: le funzioni iperboliche, che vengono dalla forma $\eta$.</p>`},
  {t:'reveal', title:'Le similitudini conformi del piano', tag:'costruzione', steps:[
   {label:'Il gruppo', body:R`
   <p>$CO^+(2)$ è l'insieme delle matrici reali $2\times2$ che conservano gli angoli e l'orientazione: rotazioni composte con dilatazioni. La condizione è $A^TA=\lambda I$ con $\lambda\gt0$ e $\det A\gt0$, e risolverla dà tutte e sole le matrici della forma $$A(a,b)=\begin{pmatrix}a&-b\\ b&a\end{pmatrix},\qquad (a,b)\neq(0,0).$$ Infatti $$A(a,b)^TA(a,b)=(a^2+b^2)\,I,\qquad \det A(a,b)=a^2+b^2\gt0.$$</p>`},
   {label:'La carta, e che cosa è davvero', body:R`
   <p>La carta globale è $A(a,b)\mapsto(a,b)$, con immagine l'aperto $\mathbb{R}^2\setminus\{(0,0)\}$, ed è un omeomorfismo perché le due componenti si leggono direttamente fra gli elementi della matrice: $CO^+(2)$ è una varietà liscia di dimensione due. È lo stesso gruppo dei numeri complessi non nulli: $A(a,b)$ è la moltiplicazione per $a+ib$ scritta come matrice, e il prodotto di due di esse è quello dei complessi, $$A(a,b)\,A(c,d)=A(ac-bd,\ ad+bc).$$ Quindi $CO^+(2)\cong\mathbb{C}\setminus\{0\}$ come gruppo e come varietà. La prova del 14/09 chiede esattamente questo riconoscimento, e il punto in cui di solito si sbaglia è dimenticare che l'origine va tolta: la matrice nulla non è invertibile.</p>`}
  ]}
]},

/* ---------------- 02e · QUANTE STRUTTURE ---------------- */
{ num:'07', title:'Quante strutture lisce ha una varieta: infinite, e quasi tutte innocue', meta:'il Problema 1-6 di Lee · la famiglia di omeomorfismi della palla · strutture diverse non vuol dire oggetti diversi',
  blocchi:[
  {t:'prosa', title:'Una famiglia continua di strutture', tag:'teorema', html:R`
  <p>L'esercizio della retta, con la carta identica e la carta cubica, mostra due strutture lisce diverse sulla stessa varietà topologica. Lee chiede di più (Problema 1-6, stampata 30): se una varietà non vuota di dimensione almeno uno ha una struttura liscia, ne ha un'infinità più che numerabile. Il suggerimento è la famiglia di omeomorfismi della palla unitaria in sé $$F_s(x)=|x|^{s-1}x,\qquad s\gt0,$$ che allunga o comprime radialmente e lascia fissa la sfera di bordo. In una dimensione, per $x\gt0$, è $F_s(x)=x^s$, con inversa $F_{1/s}$, perché $$\big(x^{s}\big)^{1/s}=x.$$ Per $s=1$ è l'identità; per $s\ne1$ è un <span class="str" data-str="omeomorfismo">omeomorfismo</span> ma <b>non</b> un diffeomorfismo, perché in zero la derivata di $x^s$ si annulla o esplode. Componendo una carta centrata in un punto con $F_s$ si ottiene, per ogni $s$, una nuova carta, e carte con $s$ diversi non sono compatibili fra loro: la transizione è $F_{s'/s}$, che nell'origine non è liscia. Ogni $s$ dà una struttura, e gli $s$ sono un continuo.</p>
  <p>Il caso $s=3$ in una dimensione è la carta cubica dell'esercizio: $F_3(x)=x^3$ sui positivi, e la transizione con l'identità è $F_{1/3}$, la radice cubica. Il fatto da tenere è il rovescio: <b>strutture lisce diverse non sono necessariamente oggetti diversi</b>. La retta con la carta cubica e la retta con la carta identica sono due atlanti massimali distinti, ma la mappa $x\mapsto x^{1/3}$ porta l'una nell'altra trasformando carte lisce in carte lisce, e per tutto ciò che si fa con la geometria differenziale le due rette sono la stessa. Decidere quando due strutture sono davvero diverse richiede la nozione di mappa liscia fra varietà, e la risposta — in dimensione bassa quasi sempre no, in dimensione quattro una famiglia infinita — sta dove quella nozione si costruisce.</p>`},
  {t:'plot', title:'La famiglia F_s sui positivi: un omeomorfismo, un diffeomorfismo solo per s = 1',
   intro:R`I grafici di $x\mapsto x^s$ su $[0,1]$ per tre valori di $s$: tutti biiettivi e continui, con lo stesso punto fisso nel bordo.`,
   plots:[
    {kind:'func2d', xr:[0,1.05], yr:[0,1.05], height:280,
     curves:[{f:'x', col:'#5eead4', label:'s = 1: l’identita'},
             {f:'x*x*x', col:'#d8a13a', label:'s = 3: la carta cubica, derivata nulla in 0'},
             {f:'Math.cbrt(x)', col:'#c084fc', label:'s = 1/3: l’inversa, derivata infinita in 0'}],
     title:'tre carte della stessa retta, incompatibili fra loro nell’origine'}
   ],
   leggi:R`<p>Le tre curve partono dall'origine e arrivano in $(1,1)$: sono tre biiezioni continue dell'intervallo in sé, e per la topologia sono indistinguibili. La differenza è tutta nella pendenza in zero: orizzontale per la cubica, verticale per la radice cubica, uno per l'identità. Una carta liscia letta attraverso un'altra deve avere pendenza finita e non nulla in ogni punto, ed è quello che le due curve curve violano nell'origine — una sola volta, ma basta. Generale: una transizione omeomorfa ma non diffeomorfa separa due strutture. Accidentale: il punto in cui la pendenza degenera, che si può spostare dove si vuole.</p>`}
]},

/* ---------------- 02b · ESERCIZI ---------------- */
{ num:'08', title:'Esercizi — tocca a te', meta:'verificare una struttura liscia · due atlanti sulla retta, compatibili o no',
  blocchi:[
  {t:'esercizio', title:'1 · Il toro come prodotto, e le sue carte',
   src:'la costruzione che si riusa in tutto il corso',
   testo:R`Mostra che $\mathbb{T}^{2}=S^{1}\times S^{1}$ è una varietà liscia di dimensione $2$, esibendo un atlante e verificando la compatibilità. Quante carte servono al minimo?`,
   steps:[
    {label:'Le carte del prodotto', body:R`
    <p>La regola generale è che <b>il prodotto di due varietà lisce è una varietà liscia</b>, con carte i prodotti delle carte: se $(U,\varphi)$ è carta di $M$ e $(V,\psi)$ di $N$, allora $(U\times V,\ \varphi\times\psi)$ è carta di $M\times N$, e la dimensione è la somma.</p>
    <p>La compatibilità si eredita: la transizione del prodotto è il <b>prodotto delle transizioni</b>, cioè $(\varphi'\times\psi')\circ(\varphi\times\psi)^{-1}=(\varphi'\circ\varphi^{-1})\times(\psi'\circ\psi^{-1})$, liscia perché lo sono le due componenti.
  $$\big(\varphi'\times\psi'\big)\circ\big(\varphi\times\psi\big)^{-1}=\big(\varphi'\circ\varphi^{-1}\big)\times\big(\psi'\circ\psi^{-1}\big)\ \in C^{\infty},\qquad\text{quindi}\ \ \forall\alpha,\beta\ \ \text{la compatibilità si eredita.}$$ <b>Non c'è niente da verificare che non sia già stato verificato sui fattori</b> — ed è il motivo per cui questa costruzione si usa senza pensarci.</p>`},
    {label:'Quante ne servono', body:R`
    <p>$S^{1}$ ha bisogno di almeno due carte — è <span class="str" data-str="compattezza">compatta</span>, e una varietà compatta non è mai coperta da una sola carta — quindi il prodotto ne ha <b>quattro</b>: i prodotti delle due carte del primo fattore per le due del secondo. Sono sufficienti, e sono anche il minimo per questa costruzione.</p>
    <p><b>La domanda interessante è un'altra</b>, e conviene porla: quattro è il minimo <i>assoluto</i> per il toro, o solo il minimo di <i>questa</i> costruzione? La risposta è che con un po' di ingegno bastano tre carte — una varietà compatta non è mai coperta da una sola, quindi il minimo è almeno due. <b>Che due non bastino per il toro lo diamo per noto senza dimostrarlo</b>: la prova si fa con uno strumento che qui non serve a nient'altro nel corso (la categoria di Lusternik-Schnirelmann del ricoprimento, o equivalentemente un argomento di Mayer-Vietoris sull'omologia dell'intersezione). <b>Il numero minimo di carte è un invariante topologico non banale</b>, e di solito non serve a niente: ciò che conta è averne abbastanza, non averne poche.</p>`}
   ]},
  {t:'esercizio', title:'2 · Due atlanti sulla retta, compatibili o no',
   src:'il modo diretto per capire la differenza fra struttura e atlante',
   testo:R`Su $\mathbb{R}$ considera due atlanti, ciascuno con una sola carta: $\mathcal{A}_1=\{(\mathbb{R},\,\mathrm{id})\}$ e $\mathcal{A}_2=\{(\mathbb{R},\,x\mapsto x^{3})\}$. Sono compatibili? Definiscono la stessa struttura liscia?`,
   steps:[
    {label:'Compatibili: no', body:R`
    <p>La transizione fra le due carte è $\mathrm{id}\circ(x^{3})^{-1}=x^{1/3}$, che <b>non è liscia nell'origine</b>. Le due carte non sono compatibili, quindi i due atlanti generano <b>strutture lisce diverse</b> su $\mathbb{R}$ — nel senso preciso che l'unione dei due atlanti non è un atlante.</p>
    <p>La differenza è osservabile: la funzione $f(x)=x$ è liscia per la prima struttura (è l'identità letta in carta) ma <b>non</b> per la seconda, dove letta in carta diventa $x^{1/3}$.</p>`}
   ]},
  {t:'esercizio', title:'3 · La stereografica, con i conti di Lee',
   src:'Lee, Problema 1-7',
   testo:R`Sia $\sigma(x^1,\dots,x^{n+1})=(x^1,\dots,x^n)/(1-x^{n+1})$ la proiezione stereografica dal polo nord. Mostra che la <span class="str" data-str="proiezione-stereografica">proiezione stereografica</span> è una biiezione da $S^n$ meno il polo su $\mathbb{R}^n$, trova l'inversa, e calcola la transizione con la proiezione dal polo sud nel caso $n=1$.`,
   steps:[
    {label:'L’inversa', body:R`
    <p>Lee dà la formula (Problema 1-7(b), stampata 30): $$\sigma^{-1}(u)=\frac{\big(2u,\ |u|^2-1\big)}{|u|^2+1}.$$ Il punto sta sulla sfera, perché nel caso $n=1$ $$\Big(\frac{2u}{u^2+1}\Big)^2+\Big(\frac{u^2-1}{u^2+1}\Big)^2=1,$$ e $\sigma$ lo riporta in $u$: $1-x^{2}=\dfrac{2}{u^2+1}$, quindi $\sigma(\sigma^{-1}(u))=\dfrac{2u}{u^2+1}\cdot\dfrac{u^2+1}{2}=u$. Le due mappe sono continue e una l'inversa dell'altra: $\sigma$ è un omeomorfismo.</p>`},
    {label:'La transizione', body:R`
    <p>La proiezione dal polo sud è $\tilde\sigma(x)=x^1/(1+x^{2})$. Componendo, $\tilde\sigma\circ\sigma^{-1}(u)=\dfrac{2u/(u^2+1)}{1+(u^2-1)/(u^2+1)}=\dfrac1u$, la transizione della tappa 02. In dimensione $n$ lo stesso conto dà $u/|u|^2$, ed è il motivo per cui Lee la chiama «inversione».</p>`}
   ]},
  {t:'plot', title:'La proiezione stereografica dal polo nord',
   intro:R`Il ridisegno della Fig. 1.13 di Lee nel caso del cerchio: la retta dal polo nord $N$ al punto $x$ del cerchio incontra l'asse orizzontale nel punto $\sigma(x)$.`,
   plots:[
    {kind:'curve', x:'cos(t)', y:'sin(t)', tr:[0,6.2832], height:300, equal:true,
     xr:[-1.4,2.6], yr:[-1.3,1.35],
     title:'sigma(x) = x1 / (1 - x2): dove la retta da N per x taglia l’asse',
     segs:[{x1:-1.4,y1:0,x2:2.5,y2:0,col:'#8ea0b8',width:1.2},
           {x1:0,y1:1,x2:2,y2:0,col:'#d8a13a',label:'retta da N per x',lx:1.55,ly:0.5},
           {x1:0,y1:1,x2:0.6,y2:-0.8,col:'#5eead4',dash:true}],
     marks:[{x:0,y:1,col:'#c084fc',hollow:true,label:'N: fuori dalla carta'},
            {x:0.8,y:0.6,col:'#d8a13a',label:'x = (4/5, 3/5)'},
            {x:2,y:0,col:'#d8a13a',label:'sigma(x) = 2'},
            {x:0.6,y:-0.8,col:'#5eead4',label:'(3/5, -4/5)',left:true},
            {x:0.333,y:0,col:'#5eead4',label:'1/3',up:true}]}
   ],
   leggi:R`<p>Il punto $x=(\tfrac45,\tfrac35)$ sta nella metà superiore del cerchio, vicino al polo, e la retta da $N$ che lo attraversa taglia l'asse fuori dal cerchio: $\sigma(x)=\tfrac{4/5}{1-3/5}=2$. Il punto $(\tfrac35,-\tfrac45)$ della metà inferiore viene proiettato dentro il cerchio, in $\tfrac{3/5}{1+4/5}=\tfrac13$: la retta tratteggiata da $N$ lo raggiunge dopo aver attraversato l'asse. Più il punto si avvicina a $N$, più la sua immagine scappa all'infinito, ed è il motivo per cui il polo non sta nella carta. La metà superiore del cerchio va fuori dal segmento $(-1,1)$, la metà inferiore dentro, l'equatore in $\pm1$. Generale: ogni punto tranne $N$ ha un'immagine sola, e ogni punto della retta ha una controimmagine sola. Accidentale: la dimensione uno; in dimensione $n$ la retta incontra un iperpiano.</p>`},
  {t:'esercizio', title:'4 · La funzione angolo è una carta, ma non su tutto il cerchio',
   src:'Lee, Problema 1-8',
   testo:R`Una funzione angolo su un aperto $U\subseteq S^1$ è una funzione continua $\theta:U\to\mathbb{R}$ con $e^{i\theta(z)}=z$. Mostra che esiste se e solo se $U\ne S^1$, e che allora $(U,\theta)$ è una carta liscia della struttura standard.`,
   steps:[
    {label:'Perché non su tutto il cerchio', body:R`
    <p>Se $\theta$ fosse definita su tutto $S^1$, sarebbe una funzione continua sul cerchio, che è compatto e connesso; percorrendo il cerchio una volta, $e^{i\theta}$ torna al punto di partenza e quindi $\theta$ cambia per un multiplo intero di $2\pi$. Il multiplo non può essere zero, perché $\theta$ è iniettiva sul cerchio (due punti con lo stesso $\theta$ avrebbero lo stesso $e^{i\theta}$), e una funzione continua e iniettiva su un cerchio non esiste: dovrebbe essere monotona su un arco e poi tornare indietro. Se invece si toglie anche un solo punto $z_0$, il cerchio diventa un arco aperto, e lì $\theta$ si costruisce scegliendo un valore in un punto e procedendo con continuità.</p>`},
    {label:'È una carta liscia', body:R`
    <p>La compatibilità con le stereografiche si verifica sulla transizione: dalla carta angolo alla stereografica dal nord, $\theta\mapsto\cos\theta/(1-\sin\theta)$, che è liscia dove il denominatore non si annulla, cioè lontano dal polo nord, che è proprio dove la stereografica non è definita. È la carta che si usa sempre in pratica — la coordinata angolare — e il problema spiega perché ne servono due per coprire il cerchio.</p>`}
   ]},
  {t:'collaudo', title:'Controlla di aver capito', html:R`
  <ol>
  <li>Perché la compatibilità si chiede solo sulle sovrapposizioni, e due carte disgiunte sono sempre compatibili?</li>
  <li>Se una mappa è liscia letta in una carta, perché lo è in tutte? Dove entra esattamente la compatibilità?</li>
  <li>$GL(n,\mathbb{R})$ è una varietà liscia: di che dimensione, e perché non serve costruire un atlante?</li>
  <li>Lo spazio proiettivo è un <span class="str" data-str="quoziente-topologico">quoziente</span>: che cosa va verificato in più rispetto a una costruzione per carte?</li>
  <li>Scrivi le carte affini di $\mathbb{RP}^n$ e la loro transizione, e di' perché la liscezza non richiede conti.</li>
  </ol>`,
   sol:R`<ol>
   <li>Perché la funzione di transizione è definita <b>solo</b> su $\varphi_\alpha(U_\alpha\cap U_\beta)$: se l'intersezione è vuota, non c'è nessuna funzione da controllare e la condizione è soddisfatta a vuoto. <b>È una condizione locale sulle zone di sovrapposizione</b>, e questo è il motivo per cui si può costruire una varietà incollando pezzi che non si vedono fra loro.</li>
   <li>Entra nella catena $f\circ\chi^{-1}=(f\circ\varphi^{-1})\circ(\varphi\circ\chi^{-1})$: il secondo fattore è la transizione. Se non fosse liscia, la composizione non sarebbe garantita liscia, e la nozione dipenderebbe dalla carta scelta. <b>La compatibilità è precisamente l'ipotesi che fa funzionare la regola della catena</b> — non è un requisito estetico.</li>
   <li>Dimensione $n^{2}$, e non serve nessun atlante perché <b>è un aperto</b> dello spazio vettoriale $M_n(\mathbb{R})\cong\mathbb{R}^{n^{2}}$: un aperto di una varietà è una varietà della stessa dimensione, con la carta ereditata. Che sia aperto segue dalla continuità del determinante. <b>Riconoscere che un oggetto è un aperto di qualcosa di noto è la scorciatoia più redditizia del corso</b>, e funziona anche per $SL$, per i gruppi ortogonali no — quelli sono chiusi, e servono i valori regolari.</li>
   <li>Che il quoziente sia <b>di Hausdorff e a base numerabile</b>, che per una costruzione a carte sono automatiche e qui no. Il locale euclideo lo danno le carte affini $U_i$; la base numerabile si eredita perché la proiezione è aperta e suriettiva; Hausdorff va dimostrato — e per $\mathbb{RP}^n$ funziona perché due rette distinte per l'origine si separano con due coni aperti disgiunti. <b>È la condizione che salta nei quozienti mal costruiti</b>, e l'unica che il passaggio al quoziente può distruggere. Solo dopo quella verifica ha senso parlare di transizioni lisce.</li>
   <li>Le carte affini e la transizione, in simboli, perché è il conto che si rifà ogni volta:
   $$U_i=\{[x^0:\cdots:x^n]\ :\ x^i\neq0\},\qquad\varphi_i\big([x]\big)=\Big(\tfrac{x^0}{x^i},\dots,\widehat{\tfrac{x^i}{x^i}},\dots,\tfrac{x^n}{x^i}\Big)\in\mathbb{R}^{n},$$
   $$\forall i\neq j\ \ \varphi_j\circ\varphi_i^{-1}(u^1,\dots,u^n)=\tfrac{1}{u^{j}}\,(u^1,\dots,1,\dots,u^n)\in C^{\infty}\big(\varphi_i(U_i\cap U_j)\big),$$
   e la liscezza è gratis perché su $U_i\cap U_j$ si ha $u^{j}\neq0$: <b>la transizione è razionale con denominatore che non si annulla</b>, non c&rsquo;è niente da verificare oltre questo.</li>
   </ol>`}
]},

{ num:'09', title:'Il senso, e le rotte', meta:'cosa apre, e il metodo che si ripetera per tutto il corso',
  blocchi:[
  {t:'prosa', title:'Cosa lascia in mano', tag:'sintesi', html:R`
  <p><b>Il punto, ed è il metodo di tutto il corso.</b> Ogni nozione differenziale su una varietà si definisce <b>in carta</b>, e subito dopo se ne verifica l'<b>indipendenza dalla carta</b>. Il secondo passo usa sempre la regola della catena applicata alla funzione di transizione. <b>Quando in una dimostrazione compare uno jacobiano di transizione, quello è il passo che sta facendo esattamente questo.</b></p>
  <p><b>Il metodo, ripetuto.</b> Le stesse tre mosse — carte, transizioni, liscezza delle transizioni — costruiranno le sottovarietà e le grassmanniane, definiranno le mappe lisce fra varietà e il loro differenziale; e il cociclo jacobiano che regge il fibrato tangente non è altro che la funzione di transizione, derivata.</p>`},
  {t:'prolessi', title:'Dove riappare questo movimento',
   oggetto:R`<b>La compatibilità delle carte</b>: la struttura sta nel modo in cui i pezzi si incollano, non nei pezzi.`,
   rotte:[
    {dove:'Teoria<br>dei campi', txt:R`Un <b>fibrato</b> è definito dai suoi dati di incollamento — le funzioni di transizione a valori in un gruppo — e in fisica quelle <i>sono</i> le trasformazioni di gauge. La struttura di gd-02 diventa il contenuto della teoria.`},
    {dove:'Relativita<br>generale', txt:R`I cambi di carta sono i <b>cambi di coordinate</b>, e la richiesta che la fisica non dipenda dalla carta è il principio di covarianza generale. Ogni tensore è definito da come si trasforma sotto transizione.`},
    {dove:'Meccanica<br>analitica', txt:R`Le trasformazioni canoniche sono cambi di carta che preservano una struttura in più (la forma simplettica): lo stesso schema, con una condizione aggiuntiva sulle transizioni.`}
   ],
   domanda:R`La struttura liscia si ottiene chiedendo che le transizioni siano $C^\infty$. Ma si potrebbe chiedere di meno ($C^k$) o di più (analitiche, o olomorfe se le carte sono complesse). <b>Domanda da portare avanti:</b> che cosa cambia? La risposta è sorprendente: fra $C^1$ e $C^\infty$ <b>non cambia niente di sostanziale</b> (ogni struttura $C^1$ contiene una $C^\infty$ compatibile, ed è essenzialmente unica), mentre il salto a <b>olomorfo</b> cambia tutto — le varietà complesse sono molto più rigide, e su una superficie compatta esistono famiglie continue di strutture complesse non equivalenti. È il campo in cui lavora Diverio.`}

function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}

}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){

  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    /* DUE SCHEMI, NON UNO — scoperto il 2026-10-06 provando le pagine vive. I movimenti
       scritti per primi (em-01..03, me-10b, i collaudi di gd-01..09 e di quattro em)
       usano una forma piu' semplice: `reveal` e `prolessi` con un solo `html`,
       `esercizio` e `collaudo` con `html` + `sol`. Il renderer ne conosceva una sola e
       chiamava `steps.forEach` su `undefined`: TypeError, e la tappa si fermava li' —
       62 blocchi in 17 movimenti su 74. Non si riscrive il contenuto per far contento
       il renderer: e' il renderer che deve leggere cio' che c'e'.
       E in fondo un ramo che NON muore: uno schema nuovo di domani deve far vedere un
       avviso in quella sezione, non spegnere la pagina sotto di se'. */
    try{
      if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
      else if(b.t==='prolessi') m.appendChild(b.rotte ? sectionProlessi(b)
                                   : sectionProsa(b.title,'prolessi',b.html));
      else if(b.t==='reveal')m.appendChild(b.steps ? sectionReveal(b.title,b.tag,b.steps)
                                   : sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='esercizio') m.appendChild(b.steps ? sectionEsercizio(b)
                                   : sectionSvelabile(b.title,'esercizio',b.html,b.sol));
      else if(b.t==='collaudo')  m.appendChild(b.items ? sectionCollaudo(b.title,b.items)
                                   : sectionSvelabile(b.title,'provi, poi riveli',b.html,b.sol));
      else if(b.t==='plot')      m.appendChild(sectionPlot(b));
      else m.appendChild(sectionProsa(b.title||'(blocco)', 'tipo sconosciuto: '+b.t,
                                      b.html||''));
    }catch(err){
      var avv=document.createElement('section'); avv.className='section';
      avv.innerHTML='<h3>'+(b.title||'(blocco)')+'<span class="tag">non reso</span></h3>'
        +'<p style="color:#ff6b6b">Questo blocco non si &egrave; potuto rendere ('
        +b.t+': '+err.message+'). Il resto della tappa continua sotto.</p>';
      m.appendChild(avv);
    }
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* I POP-UP DEGLI STRUMENTI. `cablaStrumenti` esisteva dal 18-09 e non la chiamava
     nessuno: i 229 rimandi del percorso erano <span> senza handler, e il clic non
     faceva niente. Nessun controllo poteva vederlo — la sintassi era valida, le schede
     c'erano tutte, le formule rendevano: il guasto esisteva solo a pagina viva. Qui, e
     dopo ogni inserimento successivo, perche' la tappa si rimonta da capo a ogni
     cambio e gli handler vanno riattaccati al DOM nuovo. */
  cablaStrumenti(m);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}
