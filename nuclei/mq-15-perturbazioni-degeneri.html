   <p>Qui i libri divergono, e la divergenza va dichiarata. Picasso scrive <i>«$\langle2,1,0|z|2,0,0\rangle=3a_{B}$»</i>, con il segno positivo; Ballentine scrive $\langle210|H_{1}|200\rangle=-3e|\mathcal E|a_{0}$, e Sakurai, con la perturbazione $V=-ez|\mathcal E|$ e la carica dell&rsquo;elettrone scritta come $e\lt0$, scrive $3ea_{0}|\mathcal E|$. Il segno di un elemento di matrice fra stati diversi dipende dalla fase con cui si scelgono le funzioni d&rsquo;onda, e cambiando il segno di $R_{21}$ o di $Y_{10}$ cambia il segno dell&rsquo;elemento. Gli autovalori non ne dipendono. Quale delle due combinazioni sia quella più bassa in energia sì, e per questo, quando si scrivono gli stati buoni, bisogna dire quali funzioni si sono usate. Con le funzioni scritte sopra, che sono quelle standard e positive vicino all&rsquo;origine, il segno è negativo, come in Ballentine.</p>`},
   {label:'Autovalori e stati buoni', body:R`
   <p>La matrice della perturbazione nel livello ha un blocco $2\times2$ fra $|200\rangle$ e $|210\rangle$, proporzionale alla <span class="str" data-str="matrici-di-pauli">matrice di Pauli</span> $\sigma_{x}$, e zeri altrove. I suoi autovalori sono</p>
   $$E^{(1)}=\pm3e\mathcal Ea_{0},\qquad0,\qquad0,$$
   <p>con stati buoni $(|200\rangle\pm|210\rangle)/\sqrt2$ per i primi due e $|21,\pm1\rangle$ per gli altri. Con il segno calcolato sopra, la combinazione con il $+$ ha $\langle z\rangle=-3a_{0}$ ed energia $-3e\mathcal Ea_{0}$: l&rsquo;elettrone sta preferibilmente dalla parte delle $z$ negative, dove la forza del campo lo spinge. Il livello quattro volte degenere si separa in tre: uno spostato in basso, uno in alto, e uno doppio che resta dov&rsquo;era. Picasso: <i>«la perturbazione ha rimosso parzialmente la degenerazione del livello $n=2$»</i>.</p>`}
  ]},
  {t:'plot', title:'Gli stati buoni hanno la carica spostata lungo il campo',
   intro:R`<p>La densità di probabilità lungo l&rsquo;asse $z$ (in unità $a_{0}=1$, a meno della costante $1/64\pi$) per le due combinazioni $(|200\rangle\pm|210\rangle)/\sqrt2$: con il $+$ (blu) e con il $-$ (arancio).</p>`,
   plots:[{kind:'func2d', xr:[-10,10], yr:[0,4.4], height:270, ticks:true,
     title:'|psi|^2 lungo l asse z per i due stati di Stark',
     curves:[{f:'Math.pow(x-Math.abs(x)+2,2)*Math.exp(-Math.abs(x))', col:'#5aa9ff', width:2.4, label:'(200 + 210)/sqrt2'},
             {f:'Math.pow(-x-Math.abs(x)+2,2)*Math.exp(-Math.abs(x))', col:'#ffb86b', width:2.4, label:'(200 - 210)/sqrt2'}],
     xlabel:'z / a0', ylabel:'densita (x 64 pi)'}],
   leggi:R`<p><b>Che cosa guardare.</b> La curva blu ha, oltre al picco centrale, un secondo lobo lontano dalla parte delle $z$ negative, assente dall&rsquo;altra parte; la curva arancione è la sua immagine speculare. Ciascuno dei due stati ha la carica dell&rsquo;elettrone spostata da un lato del protone, cioè un dipolo elettrico. Gli stati $2s$ e $2p$ separatamente sono simmetrici e un dipolo non ce l&rsquo;hanno.</p>
   <p><b>Che cosa impararne.</b> L&rsquo;effetto lineare è l&rsquo;energia di un dipolo <i>permanente</i> nel campo. Ballentine ne calcola il valore, <i>«$\langle d_{z}\rangle=3ea_{0}$»</i>, e Picasso lo interpreta: l&rsquo;esistenza di stati con momento di dipolo proprio <i>«è dovuta al fatto che nell&rsquo;idrogeno si ha la degenerazione su $l$: grazie alla regola di selezione sulla parità, per ottenere un valor medio non nullo dell&rsquo;operatore di dipolo $D$, è necessario sovrapporre stati di parità diversa»</i>.</p>`},
  {t:'prosa', title:'Che cosa si vede, e il caso generale', tag:'esempio', html:R`
  <p><b>La riga Lyman alfa si divide in tre.</b> Il fondamentale non si sposta al primo ordine, il livello $n=2$ si separa in tre. Picasso: <i>«si dovranno osservare tre righe nelle transizioni fra i livelli con $n=1$ e $n=2$: di queste tre righe quella centrale coincide con la prima riga della serie di Lyman; le altre due sono simmetricamente disposte rispetto a questa e distano in frequenza da essa della quantità $\Delta\nu=\pm3e\mathcal Ea_{B}/h$»</i>. Con il campo di $10^{4}$ V/cm lo spostamento è $3e\mathcal Ea_{0}\approx1{,}6\times10^{-4}$ eV, a fronte dei $10{,}2$ <span class="str" data-str="elettronvolt">eV</span> della distanza fra $n=1$ e $n=2$: il criterio di validità è soddisfatto con larghissimo margine, come Picasso nota.</p>
  <p><b>Il caso generale, in coordinate paraboliche.</b> Per un $n$ qualunque la matrice nel livello ha dimensione $n^{2}$ e la ricerca della base buona sembra lunga. Landau la evita scegliendo fin dall&rsquo;inizio funzioni d&rsquo;onda che diagonalizzano la perturbazione: quelle dell&rsquo;idrogeno separate in coordinate paraboliche, in cui la matrice di perturbazione è <i>«diagonale rispetto ad ogni gruppo di stati mutuamente degeneri»</i>. È il teorema degli stati buoni applicato con l&rsquo;operatore giusto, che in questo caso è legato a una simmetria nascosta del problema coulombiano. Il risultato, con i numeri quantici parabolici $n_{1},n_{2}$ e $m$, è la formula (77,2) di Landau. Nel testo estratto la formula è illeggibile, e qui la si scrive nella forma standard, in unità ordinarie, controllandola sul caso $n=2$:</p>
  $$E^{(1)}=\frac32\,n\,(n_{1}-n_{2})\,e\mathcal Ea_{0},$$
  <p>che per $n=2$ ridà $\pm3e\mathcal Ea_{0}$ e $0$. Landau ricorda che il risultato <i>«è stato ottenuto da K. Schwarzschild e da P. Epstein sulla base della vecchia teoria dei quanti, e da W. Pauli e E. Schrödinger sulla base della meccanica quantistica (1926)»</i>, e ne trae due conseguenze. La separazione totale del livello <i>«è all&rsquo;incirca proporzionale a $n^{2}$»</i>, perché gli elettroni più lontani dal nucleo danno un dipolo più grande. E la degenerazione non è rimossa del tutto: lo spostamento non dipende da $m$, e restano degeneri stati che un campo uniforme non può distinguere.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Gli stati $|21,\pm1\rangle$ non si spostano al primo ordine. Si spostano al secondo?`,
    a:R`Sì, in generale: la perturbazione li collega agli stati con $m=\pm1$ di altri livelli, $n=3,4,\dots$, e al secondo ordine nascono correzioni quadratiche nel campo. Al primo ordine restano degeneri fra loro, e lo restano a ogni ordine, perché il campo lungo $z$ è invariante per la riflessione in un piano che contiene l&rsquo;asse $z$, che scambia $m$ con $-m$. Landau lo nota per tutti gli atomi: un campo elettrico uniforme non può rimuovere la degenerazione fra stati che differiscono solo per il segno di $m$.`},
   {q:R`Che cosa succede se si sceglie l&rsquo;asse $z$ non parallelo al campo?`,
    a:R`La perturbazione diventa $e\mathcal E(z\cos\alpha+x\sin\alpha)$, e $x$ collega $|200\rangle$ con $|21,\pm1\rangle$: la matrice nel livello si riempie, e la si deve diagonalizzare tutta. Gli autovalori sono gli stessi, $\pm3e\mathcal Ea_{0}$ e $0$ due volte, perché sono una proprietà fisica. Gli stati buoni sono le stesse combinazioni, scritte in una base ruotata. Picasso lo dice prima di cominciare: <i>«avendo scelto l&rsquo;asse $z$ parallelo al campo elettrico, conviene avere diagonale $L_{z}$ piuttosto che un&rsquo;altra componente»</i>. È il teorema degli stati buoni usato come scelta degli assi.`}
  ]}
]},
/* ---------------- 06 · QUANDO LA DEGENERAZIONE SOPRAVVIVE AL PRIMO ORDINE ---------------- */
{ num:'06', title:'Quando la degenerazione sopravvive al primo ordine', meta:'la sfida che Sakurai lascia agli esperti · la hamiltoniana efficace al secondo ordine e l osservazione di Landau · lo spin 1 di Shankar dove il primo ordine è esatto · lo stesso spin con una perturbazione che separa solo al secondo ordine',
  blocchi:[
  {t:'prosa', title:'Il problema', tag:'architettura', html:R`
  <p>La procedura della tappa 02 funziona se l&rsquo;equazione secolare ha radici distinte: allora ogni radice individua una combinazione degli stati imperturbati, e da lì si può procedere con le formule non degeneri. Se due radici coincidono, l&rsquo;ambiguità si ripresenta in un sottospazio più piccolo. Sakurai la lascia come sfida: <i>«A challenge for the experts: How must we proceed if the degeneracy is not removed in first order — that is, if some of the roots of the secular equation are equal?»</i>.</p>
  <p>Landau la affronta nel paragrafo 39, partendo da un caso che negli esercizi è frequente: <i>«Per varie ragioni può succedere che tutti gli elementi di matrice della transizione all&rsquo;interno di un gruppo di stati reciprocamente degeneri $n,n',\dots$ siano abbastanza piccoli (o persino nulli). Allora può essere opportuno, oltre che tener conto, al primo ordine, degli elementi di matrice $V_{nn'}$, tener conto anche, al secondo ordine, degli elementi di matrice $V_{nm}$ per le transizioni tra stati con energie diverse»</i>. La ragione tipica è una simmetria: la perturbazione non collega direttamente gli stati del livello, ma li collega passando per uno stato intermedio di un altro livello.</p>`},
  {t:'reveal', title:'La hamiltoniana efficace al secondo ordine', tag:'costruzione', steps:[
   {label:'Dalla derivazione di Sakurai', body:R`
   <p>La derivazione con i proiettori della tappa 02 conteneva già la risposta. L&rsquo;equazione esatta per la parte nel sottospazio degenere aveva un termine di ordine $\lambda^{2}$, che al primo ordine si era trascurato. Sakurai lo tiene nella (5.2.12), sostituendo l&rsquo;energia al denominatore con il suo valore imperturbato:</p>
   $$\Big(E-E_{D}^{(0)}-\lambda P_{0}VP_{0}-\lambda^{2}P_{0}VP_{1}\frac{1}{E_{D}^{(0)}-H_{0}}P_{1}VP_{0}\Big)P_{0}|l\rangle=0.$$
   <p>È un problema agli autovalori nel sottospazio $D$ per una matrice <b>efficace</b>, i cui elementi fra due stati $a,b$ del livello sono</p>
   $$V^{\rm eff}_{ab}=V_{ab}+\sum_{m\notin D}\frac{V_{am}V_{mb}}{E_{D}^{(0)}-E_{m}^{(0)}}.$$
   <p>Il secondo termine contiene i cammini che escono dal livello verso uno stato $m$ lontano e tornano. Landau scrive la stessa sostituzione nella sua equazione secolare (39,4): si diagonalizza la matrice efficace al posto di quella della sola perturbazione.</p>`},
   {label:'Quando conta', body:R`
   <p>Se la parte di primo ordine $V_{ab}$ separa già il livello, il termine di secondo ordine è una piccola correzione e si può trattare con la formula non degenere, sommando sugli stati fuori dal livello. È la (5.2.15) di Sakurai. Se invece $V_{ab}$ è nulla, o proporzionale all&rsquo;identità, nel livello, il termine di secondo ordine è la sola cosa che distingue gli stati, e la base buona è quella che diagonalizza la matrice efficace. I due esempi che seguono, entrambi su una particella di spin $1$, mostrano i due casi.</p>`}
  ]},
  {t:'reveal', title:'Spin 1, primo caso: l’esercizio di Shankar', tag:'esempio', steps:[
   {label:'Il problema', body:R`
   <p>Shankar propone come esercizio 17.3.2 una particella di spin $1$, senza gradi di libertà orbitali, con hamiltoniana $H=AS_{z}^{2}+B(S_{x}^{2}-S_{y}^{2})$ e $A\gg B$, chiedendo di trattare il termine in $B$ come perturbazione, di trovare gli stati imperturbati <i>«stable under the perturbation»</i>, e di confrontare con la soluzione esatta. Con $\hbar=1$, $H_{0}=AS_{z}^{2}$ ha l&rsquo;autovalore $0$ su $|0\rangle$ e l&rsquo;autovalore $A$, doppio, su $|\pm1\rangle$.</p>`},
   {label:'La soluzione', body:R`
   <p>Si scrive la perturbazione con gli operatori di salita e discesa: $S_{x}^{2}-S_{y}^{2}=\tfrac12(S_{+}^{2}+S_{-}^{2})$. Gli operatori $S_{\pm}^{2}$ cambiano $m$ di due, quindi collegano solo $|+1\rangle$ e $|-1\rangle$, con</p>
   $$\langle+1|B(S_{x}^{2}-S_{y}^{2})|-1\rangle=B.$$
   <p>Nel livello doppio la matrice è $B\sigma_{x}$: le correzioni sono $\pm B$, con stati buoni $(|+1\rangle\pm|-1\rangle)/\sqrt2$, mentre $|0\rangle$ non si sposta. Il confronto chiesto da Shankar dà un risultato netto: la perturbazione non collega mai $|0\rangle$ agli altri due, la hamiltoniana completa è a blocchi, e gli autovalori esatti sono</p>
   $$A+B,\qquad A-B,\qquad0,$$
   <p>cioè <b>il primo ordine è esatto</b>. Il motivo è che il sottospazio degenere è anche un sottospazio invariante per la perturbazione, e l&rsquo;osservazione di Sakurai, <i>«if the degenerate subspace were the whole space, we would have solved the problem exactly in this manner»</i>, qui vale alla lettera.</p>`}
  ]},
  {t:'reveal', title:'Spin 1, secondo caso: una perturbazione che separa solo al secondo ordine', tag:'esempio', steps:[
   {label:'Il problema, e il primo ordine nullo', body:R`
   <p>Si cambi la perturbazione in $V=BS_{x}$, cioè un piccolo campo magnetico trasverso. Con $\hbar=1$, $S_{x}=\tfrac{1}{\sqrt2}(S_{+}+S_{-})$ cambia $m$ di uno, quindi nel livello $\{|+1\rangle,|-1\rangle\}$ ha elementi tutti nulli: <b>il primo ordine non separa niente</b>. Ma $S_{x}$ collega entrambi gli stati del livello a $|0\rangle$, con $\langle\pm1|S_{x}|0\rangle=1/\sqrt2$.</p>`},
   {label:'La matrice efficace', body:R`
   <p>Il solo stato intermedio è $|0\rangle$, con denominatore $E_{D}^{(0)}-E_{0}^{(0)}=A$. La matrice efficace nel livello è</p>
   $$V^{\rm eff}=\frac{B^{2}}{2A}\begin{pmatrix}1&1\\1&1\end{pmatrix},$$
   <p>con autovalori $B^{2}/A$ e $0$, e stati buoni $(|+1\rangle+|-1\rangle)/\sqrt2$ e $(|+1\rangle-|-1\rangle)/\sqrt2$. La perturbazione ha scelto la base attraverso il secondo ordine: lo stato simmetrico, che è quello che $S_{x}$ raggiunge partendo da $|0\rangle$, si sposta di $B^{2}/A$; quello antisimmetrico, che $S_{x}$ non raggiunge, resta fermo.</p>`},
   {label:'Il confronto con l’esatto', body:R`
   <p>Il problema si risolve esattamente. Lo stato antisimmetrico è disaccoppiato da tutto, perché $S_{x}$ applicato a esso dà zero, e la sua energia è esattamente $A$. Lo stato simmetrico e $|0\rangle$ formano un blocco $\begin{pmatrix}A&B\\B&0\end{pmatrix}$, con autovalori</p>
   $$E=\frac{A}{2}\pm\sqrt{\frac{A^{2}}{4}+B^{2}},$$
   <p>il cui sviluppo per $B\ll A$ dà $A+B^{2}/A$ per il ramo superiore e $-B^{2}/A$ per quello inferiore. Il secondo ordine degenere ha dato esattamente il primo termine dello sviluppo, e anche il segno giusto per $|0\rangle$, che scende come vuole la regola del fondamentale.</p>`}
  ]},
  {t:'plot', title:'Lo spin 1 nel campo trasverso: esatto e secondo ordine',
   intro:R`<p>Con $A=1$, gli autovalori esatti di $AS_{z}^{2}+BS_{x}$ in funzione di $B$ (linee continue) e le loro approssimazioni al secondo ordine $1+B^{2}$, $1$, $-B^{2}$ (tratteggio implicito, in colori più chiari).</p>`,
   plots:[{kind:'func2d', xr:[0,1], yr:[-0.6,1.7], height:280, ticks:true,
     title:'spin 1: A Sz^2 + B Sx, autovalori esatti e al secondo ordine',
     curves:[{f:'0.5+Math.sqrt(0.25+x*x)', col:'#5aa9ff', width:2.6, label:'esatto, simmetrico'},
             {f:'1', col:'#ffb86b', width:2.6, label:'esatto, antisimmetrico'},
             {f:'0.5-Math.sqrt(0.25+x*x)', col:'#6bdc9b', width:2.6, label:'esatto, |0>'},
             {f:'1+x*x', col:'#9ccdff', width:1.4, label:'secondo ordine'},
             {f:'-x*x', col:'#a8f0c6', width:1.4, label:'secondo ordine'}],
     xlabel:'B / A', ylabel:'E / A'}],
   leggi:R`<p><b>Che cosa guardare.</b> Il livello doppio in $E=A$ si separa, ma i due rami si allontanano quadraticamente, non linearmente: è la firma di una separazione che nasce al secondo ordine. Lo stato antisimmetrico resta esattamente a $E=A$ per ogni $B$. Le curve chiare seguono da vicino quelle esatte fino a circa $B\approx0{,}3A$, dove l&rsquo;errore sullo spostamento è dell&rsquo;ordine del $10\%$.</p>
   <p><b>Che cosa impararne.</b> Il ramo superiore e $|0\rangle$ si respingono, come due livelli collegati al secondo ordine; il ramo antisimmetrico non partecipa, perché nessun elemento di matrice lo collega. Nella figura si leggono insieme il caso degenere, in cui la base la sceglie la perturbazione, e il caso non degenere, in cui i livelli si respingono.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Nel secondo esempio, che cosa succederebbe se si usassero subito gli stati $|\pm1\rangle$ con la formula non degenere del secondo ordine, senza diagonalizzare la matrice efficace?`,
    a:R`Si troverebbe per ciascuno $|\langle\pm1|BS_{x}|0\rangle|^{2}/A=B^{2}/2A$: lo stesso spostamento per entrambi, cioè nessuna separazione, e il valore sbagliato per tutti e due. Il valore $B^{2}/2A$ è la media delle due correzioni vere, $B^{2}/A$ e $0$: la traccia della matrice efficace divisa per due. È lo stesso errore della scatola cubica alla tappa 02, che trovava il baricentro giusto e la struttura sbagliata, spostato al secondo ordine.`},
   {q:R`Perché nel secondo esempio il termine di primo ordine $V_{ab}$ è nullo?`,
    a:R`Perché $S_{x}$ cambia $m$ di $\pm1$ e i due stati del livello hanno $m=\pm1$, cioè differiscono di due. Per collegarli servono due applicazioni di $S_{x}$, quindi il secondo ordine. In generale, se gli stati di un livello differiscono per un numero quantico che la perturbazione cambia di $k$ unità alla volta, il primo ordine li collega solo se differiscono esattamente di $k$, e la separazione nasce all&rsquo;ordine pari al numero di passi necessari.`}
  ]}
]},
/* ---------------- 07 · I LIVELLI QUASI DEGENERI ---------------- */
{ num:'07', title:'I livelli quasi degeneri: diagonalizzare esattamente il blocco dei vicini', meta:'quanto deve essere esatta una degenerazione per usare il metodo · lo Stark con il 2s e il 2p appena separati, da quadratico a lineare · un elettrone p in un campo magnetico confrontabile con la struttura fine · i fattori di Landé come pendenze iniziali · le linee con lo stesso m che non si incrociano',
  blocchi:[
  {t:'prosa', title:'Una degenerazione è mai esatta?', tag:'architettura', html:R`
  <p>Sakurai fa la domanda dopo aver risolto lo Stark lineare: nell&rsquo;idrogeno vero i livelli $2s$ e $2p$ non sono esattamente degeneri, perché la struttura fine li separa e l&rsquo;elettrodinamica quantistica separa anche quelli che la teoria di Dirac lascia degeneri. <i>«We might therefore ask, is it realistic to apply degenerate perturbation theory to this problem?»</i> La risposta dipende dal rapporto fra due energie: la separazione $\delta$ fra i livelli quasi degeneri e l&rsquo;elemento di matrice della perturbazione che li collega. Se l&rsquo;elemento di matrice è molto più grande di $\delta$, i livelli sono degeneri <i>a tutti gli effetti pratici</i> e il metodo degenere funziona. Se è molto più piccolo, i livelli sono ben separati e funziona il metodo non degenere. Nel caso intermedio, Sakurai: <i>«we must work harder; it is safer to attempt to diagonalize the Hamiltonian exactly in the space spanned by all the nearby levels»</i>. Shankar dice lo stesso: <i>«Degenerate perturbation theory is relevant not only when the levels are exactly degenerate but also when they are close [...] In that case one must diagonalize $H^{0}+H'$ exactly in the almost degenerate subspace»</i>. È la procedura di Picasso per i livelli quasi degeneri: si includono nella parte risolubile i termini responsabili della piccola separazione, e si diagonalizza il blocco esattamente.</p>`},
  {t:'reveal', title:'Lo Stark con un 2s e un 2p appena separati', tag:'esempio', steps:[
   {label:'Il blocco due per due', body:R`
   <p>Picasso riprende l&rsquo;effetto Stark a $n=2$ supponendo che i livelli con $l=0$ e $l=1$ non siano degeneri ma separati di una quantità $\delta E_{0}$, e scrive la matrice (12.28): sulla diagonale $E_{0}^{2s}$ e $E_{0}^{2p}$, fuori diagonale l&rsquo;elemento $3e\mathcal Ea_{B}$. Prendendo lo zero delle energie a metà fra i due livelli, gli autovalori del blocco sono</p>
   $$E_{\pm}=\pm\sqrt{\frac{\delta E_{0}^{2}}{4}+9e^{2}\mathcal E^{2}a_{0}^{2}}.$$
   <p>E Picasso conclude: siccome $3e\mathcal Ea_{B}$ <i>«è dello stesso ordine di $\delta E_{0}$, lo sviluppo in potenze di $3e\mathcal Ea_{B}/\delta E_{0}$ sarebbe completamente privo di senso»</i>.</p>`},
   {label:'I due regimi, e il campo di passaggio', body:R`
   <p>Per campi deboli, $3e\mathcal Ea_{0}\ll\delta E_{0}/2$, la radice si sviluppa e lo spostamento di ciascun livello dalla sua posizione imperturbata è</p>
   $$\pm\frac{9e^{2}\mathcal E^{2}a_{0}^{2}}{\delta E_{0}},$$
   <p>quadratico nel campo: è il risultato del secondo ordine non degenere, con i due livelli che si respingono. Per campi forti, $3e\mathcal Ea_{0}\gg\delta E_{0}/2$, la radice è dominata dal campo e $E_{\pm}\simeq\pm3e\mathcal Ea_{0}$: lo Stark lineare. Il passaggio avviene dove i due termini sotto radice sono uguali, $3e\mathcal Ea_{0}=\delta E_{0}/2$. Picasso stima la separazione fra $2s$ e $2p$ dovuta alla sola correzione relativistica dell&rsquo;energia cinetica in circa $4\times10^{-5}$ eV; prendendo questo numero come ordine di grandezza della separazione, il campo di passaggio è</p>
   $$\mathcal E_{c}=\frac{\delta E_{0}}{6ea_{0}}\approx1{,}3\times10^{3}\ \text{V/cm}.$$
   <p>Sopra qualche migliaio di volt per centimetro lo Stark dell&rsquo;idrogeno è lineare, sotto è quadratico. Il numero è indicativo, perché la separazione vera fra i sottolivelli di $n=2$ coinvolge anche lo spin, come Sakurai ricorda; l&rsquo;ordine di grandezza basta a dire che con i campi del laboratorio si sta quasi sempre nel regime lineare.</p>`}
  ]},
  {t:'plot', title:'Da quadratico a lineare',
   intro:R`<p>I due livelli del blocco in unità di $\delta E_{0}/2$, in funzione di $u=6e\mathcal Ea_{0}/\delta E_{0}$: esatti (blu), lineari $\pm u$ (arancio), quadratici $\pm(1+u^{2}/2)$ (verde).</p>`,
   plots:[{kind:'func2d', xr:[0,3], yr:[-3.3,3.3], height:290, ticks:true,
     title:'Stark a n = 2 con 2s e 2p separati: esatto, lineare, quadratico',
     curves:[{f:'Math.sqrt(1+x*x)', col:'#5aa9ff', width:2.6, label:'esatto'},
             {f:'-Math.sqrt(1+x*x)', col:'#5aa9ff', width:2.6, label:''},
             {f:'x', col:'#ffb86b', width:1.6, label:'lineare (degenere)'},
             {f:'-x', col:'#ffb86b', width:1.6, label:''},
             {f:'1+x*x/2', col:'#6bdc9b', width:1.6, label:'quadratico (non degenere)'},
             {f:'-1-x*x/2', col:'#6bdc9b', width:1.6, label:''}],
     xlabel:'u = 6 e E a0 / delta E0', ylabel:'E / (delta E0 / 2)'}],
   leggi:R`<p><b>Che cosa guardare.</b> Per $u\lt0{,}5$ la curva esatta segue la parabola verde: i livelli partono separati e si allontanano quadraticamente. Per $u\gt2$ segue la retta arancione: lo spostamento è lineare nel campo, come se i livelli fossero degeneri. Fra le due, nessuna delle due approssimazioni funziona, e serve la radice.</p>
   <p><b>Che cosa impararne.</b> «Degenere» e «non degenere» non sono proprietà di un livello, ma del rapporto fra la separazione e la perturbazione. Lo stesso atomo è non degenere per un campo debole e degenere per un campo forte. La diagonalizzazione esatta del blocco li contiene entrambi, ed è per questo che Picasso, Sakurai e Shankar la raccomandano nel caso intermedio.</p>`},
  {t:'reveal', title:'Un elettrone p in un campo magnetico: dal regime di Landé al regime opposto', tag:'esempio', steps:[
   {label:'Il problema di Picasso', body:R`
   <p>Picasso, nel paragrafo 16.6, tratta un atomo in un campo magnetico <i>«Intermedio»</i>, in cui <i>«le separazioni Zeeman sono confrontabili con quelle di struttura fine»</i>, e sceglie il livello $2p$ del litio, <i>«uno dei pochi casi in cui la separazione di struttura fine è confrontabile con le separazioni Zeeman per campi ragionevoli»</i>: $0{,}42\times10^{-4}$ eV. La perturbazione comprende l&rsquo;interazione spin-orbita e l&rsquo;interazione con il campo, $H'=A\,\mathbf L\cdot\mathbf S+\mu_{B}B(L_{z}+2S_{z})/\hbar$, sui sei stati di un elettrone $p$. Nessuna base diagonalizza entrambi i termini: lo spin-orbita vuole il momento totale, il campo vuole $L_{z}$ e $S_{z}$ separati. L&rsquo;unico operatore che commuta con tutti e due è $J_{z}$, e la matrice si spezza in blocchi di $m_{j}$: due blocchi di dimensione uno, $m_{j}=\pm\tfrac32$, e due di dimensione due, $m_{j}=\pm\tfrac12$.</p>`},
   {label:'I blocchi', body:R`
   <p>Per $m_{j}=+\tfrac32$, lo stato $|1,+\tfrac12\rangle$ dà $\tfrac12A\hbar^{2}+2\mu_{B}B$, come nella (16.61) di Picasso. Per $m_{j}=+\tfrac12$, nella base $|1,-\tfrac12\rangle$, $|0,+\tfrac12\rangle$, lo spin-orbita dà la matrice della tappa 03 e il campo aggiunge $\mu_{B}B(m_{l}+2m_{s})$ sulla diagonale, cioè $0$ e $\mu_{B}B$:</p>
   $$\begin{pmatrix}-\tfrac12A\hbar^{2}&\tfrac{1}{\sqrt2}A\hbar^{2}\\ \tfrac{1}{\sqrt2}A\hbar^{2}&\mu_{B}B\end{pmatrix},$$
   <p>con autovalori</p>
   $$E_{\pm}=\frac12\Big(\mu_{B}B-\frac{A\hbar^{2}}{2}\Big)\pm\frac12\sqrt{\Big(\mu_{B}B+\frac{A\hbar^{2}}{2}\Big)^{2}+2A^{2}\hbar^{4}}.$$
   <p>Per $B=0$ si ritrovano $\tfrac12A\hbar^{2}$ e $-A\hbar^{2}$, i due livelli di struttura fine.</p>`},
   {label:'Campo debole: i fattori di Landé', body:R`
   <p>Per $\mu_{B}B$ piccolo rispetto alla struttura fine, le pendenze iniziali dei due autovalori sono $\tfrac23\mu_{B}$ e $\tfrac13\mu_{B}$. Sono i valori di $g_{j}m_{j}\mu_{B}$ con i fattori di Landé $g_{3/2}=\tfrac43$ e $g_{1/2}=\tfrac23$. Landau li ricava nel paragrafo 113 con un argomento di proiezione: in uno stato con $J$ fissato, lo spin mediato <i>«può essere &lsquo;diretto&rsquo; soltanto lungo $J$, l&rsquo;unico &lsquo;vettore&rsquo; conservativo che caratterizza l&rsquo;atomo libero»</i>, e da qui il fattore</p>
   $$g=1+\frac{J(J+1)-L(L+1)+S(S+1)}{2J(J+1)},$$
   <p>che per $L=1$, $S=\tfrac12$ dà $\tfrac43$ e $\tfrac23$. La condizione di Landau per questo regime è esplicita: il campo deve essere <i>«piccolo rispetto alle distanze fra i livelli energetici dell&rsquo;atomo, nonché rispetto agli intervalli della struttura fine»</i>. In questo regime lo spin-orbita fa la parte di $H_{0}$ e il campo quella della perturbazione, sul livello degenere $2J+1$ volte.</p>`},
   {label:'Campo forte, e le linee che non si incrociano', body:R`
   <p>Per $\mu_{B}B$ grande rispetto alla struttura fine i ruoli si scambiano: il campo è la parte risolubile, con la base $|m_{l},m_{s}\rangle$, e lo spin-orbita è la perturbazione, che al primo ordine contribuisce con il suo valor medio $A\hbar^{2}m_{l}m_{s}$. I due autovalori tendono a $\mu_{B}B$ e a $-\tfrac12A\hbar^{2}$, cioè agli stati $|0,+\tfrac12\rangle$ e $|1,-\tfrac12\rangle$. Picasso disegna i sei livelli in funzione del campo, nella sua figura 16.4, e nota che <i>«le due linee con $m=+1/2$ non si incontrano, e lo stesso per quanto riguarda le linee con $m=-1/2$»</i>, mentre la linea con $m=-3/2$ incrocia linee con $m=\pm\tfrac12$: linee con la stessa simmetria si respingono, linee con simmetria diversa possono incrociarsi. È il teorema di non incrocio visto su un caso misurabile.</p>`}
  ]},
  {t:'plot', title:'I sei livelli del p in funzione del campo',
   intro:R`<p>In unità della separazione di struttura fine $\tfrac32A\hbar^{2}=1$, in funzione di $x=\mu_{B}B$: i livelli con $m_{j}=+\tfrac32$ (blu) e $-\tfrac32$ (arancio), i due con $m_{j}=+\tfrac12$ (verde) e i due con $m_{j}=-\tfrac12$ (viola).</p>`,
   plots:[{kind:'func2d', xr:[0,2], yr:[-2.6,4.4], height:310, ticks:true,
     title:'elettrone p: spin-orbita piu campo magnetico, dal regime di Lande a quello di campo forte',
     curves:[{f:'1/3+2*x', col:'#5aa9ff', width:2.2, label:'mj = +3/2'},
             {f:'1/3-2*x', col:'#ffb86b', width:2.2, label:'mj = -3/2'},
             {f:'0.5*(x-1/3)+0.5*Math.sqrt((x+1/3)*(x+1/3)+8/9)', col:'#6bdc9b', width:2.2, label:'mj = +1/2'},
             {f:'0.5*(x-1/3)-0.5*Math.sqrt((x+1/3)*(x+1/3)+8/9)', col:'#6bdc9b', width:2.2, label:''},
             {f:'0.5*(-x-1/3)+0.5*Math.sqrt((x-1/3)*(x-1/3)+8/9)', col:'#c49bff', width:2.2, label:'mj = -1/2'},
             {f:'0.5*(-x-1/3)-0.5*Math.sqrt((x-1/3)*(x-1/3)+8/9)', col:'#c49bff', width:2.2, label:''}],
     xlabel:'mu_B B / (3/2 A hbar^2)', ylabel:'E'}],
   leggi:R`<p><b>Che cosa guardare.</b> A sinistra i livelli partono dai due valori di struttura fine, $\tfrac13$ (quattro stati, $j=\tfrac32$) e $-\tfrac23$ (due stati, $j=\tfrac12$), e si aprono a ventaglio con pendenze proporzionali a $g_{j}m_{j}$. A destra si dispongono in rette parallele con pendenze $m_{l}+2m_{s}=2,1,0,0,-1,-2$. Le due curve verdi si avvicinano e si allontanano senza toccarsi, e così le due viola; la retta arancione taglia invece una curva verde e una viola.</p>
   <p><b>Che cosa impararne.</b> Nessuno dei due regimi è una perturbazione dell&rsquo;altro quando $\mu_{B}B$ è dell&rsquo;ordine della struttura fine. Il problema si risolve solo diagonalizzando i blocchi di $m_{j}$, che sono piccoli. Un orale chiede spesso di disegnare questa figura a memoria: basta sapere le pendenze ai due estremi e che le linee con lo stesso $m_{j}$ non si incrociano.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Nel regime di campo debole i livelli con $j=\tfrac32$ si separano in quattro. Perché la separazione è uniforme, con distanze uguali fra livelli adiacenti?`,
    a:R`Perché nel regime di Landé la perturbazione, ristretta al livello con $J$ fissato, è proporzionale a $J_{z}$: lo spin mediato è proporzionale a $\mathbf J$, quindi $L_{z}+2S_{z}$ diventa $g_{j}J_{z}$. Gli autovalori di $J_{z}$ sono equispaziati, e lo sono anche gli spostamenti, di $g_{j}\mu_{B}B$. La separazione smette di essere uniforme quando il campo diventa abbastanza grande da mescolare livelli con $J$ diversi, e questo accade solo fra stati con lo stesso $m_{j}$: è il motivo per cui le linee con $m_{j}=\pm\tfrac32$ restano rette per ogni campo.`},
   {q:R`Per lo Stark, che cosa si dovrebbe fare se i livelli vicini fossero tre invece di due?`,
    a:R`Diagonalizzare il blocco $3\times3$ di $H_{0}+H'$ ristretto ai tre livelli, includendo sulla diagonale le loro piccole separazioni e fuori diagonale gli elementi della perturbazione. Gli autovalori non hanno una formula semplice come la radice del caso doppio, ma sono le radici di un&rsquo;equazione di terzo grado, che si risolvono numericamente. Il resto dello spettro, lontano, si tratta al secondo ordine, come nella matrice efficace della tappa 06.`}
  ]}
]},
/* ---------------- 08 · QUANDO IL RISULTATO VALE ---------------- */
{ num:'08', title:'Quando il risultato vale: la gerarchia delle perturbazioni e i numeri quantici approssimativamente buoni', meta:'che cosa deve essere piccolo nel caso degenere, e che cosa no · l osservazione di Landau sull esattezza dentro il livello · l albero genealogico dei livelli di Picasso · Russell Saunders e jj · il mercurio e la riga che non dovrebbe esserci',
  blocchi:[
  {t:'prosa', title:'Che cosa deve essere piccolo', tag:'teorema', html:R`
  <p>Nel caso non degenere il criterio era uno solo: gli elementi di matrice della perturbazione piccoli rispetto alle distanze fra i livelli. Nel caso degenere il criterio si divide in due, e la divisione è il contenuto di questa tappa.</p>
  <p><b>Dentro il livello degenere non serve niente.</b> L&rsquo;equazione secolare diagonalizza esattamente la perturbazione ristretta al livello, per quanto grandi siano i suoi elementi. Landau lo dice in una nota al problema 2 del paragrafo 39: la condizione di piccolezza <i>«richiede sempre che siano osservate le condizioni (38,9) soltanto per le transizioni tra gli stati relativi ai diversi livelli energetici. Quanto alle transizioni tra gli stati relativi a uno stesso livello degenere, di esse l&rsquo;equazione secolare dà conto in maniera in un certo senso esatta»</i>.</p>
  <p><b>Fra il livello e gli altri livelli serve tutto.</b> Gli elementi di matrice che collegano il livello degenere a livelli lontani devono essere piccoli rispetto alle distanze, altrimenti il termine di secondo ordine della matrice efficace della tappa 06 non è piccolo e la separazione calcolata al primo ordine è sbagliata. La tappa 07 ha mostrato che cosa fare quando un livello «lontano» non lo è abbastanza: lo si include nel blocco e si diagonalizza esattamente.</p>
  <p>La pratica che ne segue è una <b>gerarchia</b>: si ordinano le interazioni per grandezza, si tratta la più grande come parte risolubile, la successiva come perturbazione sui livelli degeneri che la prima lascia, e così via. A ogni gradino la degenerazione residua definisce il sottospazio in cui diagonalizzare il gradino successivo. La gerarchia funziona se ogni gradino è piccolo rispetto alle distanze create dal precedente.</p>`},
  {t:'reveal', title:'L’albero genealogico dei livelli', tag:'esempio', steps:[
   {label:'L’idea di Picasso', body:R`
   <p>Picasso, al paragrafo 14.1, descrive la gerarchia per gli atomi a molti elettroni con un&rsquo;immagine. Si moltiplica la repulsione fra gli elettroni per un parametro $\lambda$ e lo si fa scendere con continuità da $1$ a $0$. Siccome l&rsquo;effetto della repulsione <i>«è quello di rimuovere parte della degenerazione presente nell&rsquo;approssimazione a elettroni indipendenti, gruppi di livelli energetici, separati per $\lambda\ne0$, confluiranno, per $\lambda=0$, in un unico livello corrispondente ad una ben determinata configurazione elettronica: quindi in cima all&rsquo;albero genealogico di ogni livello energetico [...] c&rsquo;è la configurazione elettronica da cui discende»</i>.</p>
   <p>E ne trae una conclusione che vale per tutto il movimento: <i>«l&rsquo;approssimazione ad elettroni indipendenti va molto male per calcolare le energie, mentre gioca un ruolo essenziale per classificare gli stati»</i>. La teoria delle perturbazioni degeneri serve anche quando le perturbazioni non sono piccole: anche se i numeri sono sbagliati, la struttura dell&rsquo;albero, cioè quanti livelli nascono da ogni configurazione e con quali numeri quantici, è giusta.</p>`},
   {label:'Il secondo gradino: Russell-Saunders', body:R`
   <p>Il gradino successivo sono le interazioni relativistiche, principalmente lo spin-orbita. Picasso giustifica il trattarle al primo ordine dentro ciascun termine con $L$ e $S$ fissati, che chiama approssimazione di Russell-Saunders, con un confronto di energie: le differenze dovute alle sole interazioni elettrostatiche sono, per i livelli bassi, <i>«dell&rsquo;ordine dell&rsquo;elettronvolt»</i>, mentre le separazioni dovute agli effetti relativistici, dentro un multipletto, sono più piccole di <i>«circa tre ordini di grandezza»</i>. Il risultato è quello della tappa 03 in grande: la perturbazione commuta con $\mathbf J$, e <i>«ha rimosso completamente la degenerazione su $J$ [...] lasciando però inalterata la degenerazione su $J_{z}$ (che è protetta dall&rsquo;invarianza [...] per rotazioni)»</i>.</p>
   <p>Landau, al paragrafo 72, dà il limite della gerarchia: l&rsquo;approssimazione richiede che <i>«gli intervalli della struttura fine devono essere piccoli rispetto alle differenze dei livelli con $L$ e $S$ diversi»</i>, e <i>«man mano che il numero atomico cresce le interazioni relativistiche nell&rsquo;atomo diventano più intense e l&rsquo;approssimazione di Russell-Saunders diventa inapplicabile»</i>. Nel limite opposto, accoppiamento $jj$, l&rsquo;ordine dei gradini si inverte: prima lo spin-orbita di ciascun elettrone, poi la repulsione. Fra i due, gli atomi pesanti mostrano <i>«diverse forme di accoppiamento intermedio»</i>, che sono il caso quasi degenere della tappa 07 applicato a un atomo intero.</p>`},
   {label:'Il terzo gradino, e la sua inversione', body:R`
   <p>Un campo magnetico esterno è il gradino successivo, finché è piccolo rispetto alla struttura fine: si tratta al primo ordine dentro ciascun livello con $J$ fissato, e dà i fattori di Landé. Quando il campo cresce fino a superare la struttura fine, l&rsquo;ordine degli ultimi due gradini si inverte, ed è il passaggio che la figura della tappa 07 mostra. Lo stesso atomo, nello stesso laboratorio, sta su una gerarchia o sull&rsquo;altra a seconda del valore di una manopola.</p>`}
  ]},
  {t:'reveal', title:'I numeri quantici approssimativamente buoni', tag:'teorema', steps:[
   {label:'Che cosa vuol dire approssimativamente', body:R`
   <p>Un numero quantico è «buono» se è l&rsquo;autovalore di un osservabile che commuta con la hamiltoniana completa. Ogni gradino della gerarchia rompe qualche simmetria, e con essa qualche numero quantico. Ma se il gradino è piccolo rispetto alle distanze del precedente, gli stati veri sono quasi autostati del numero quantico rotto, con una piccola mescolanza. Per due stati con numeri quantici diversi, separati da $\Delta$ e collegati da un elemento di matrice $v$, l&rsquo;angolo di mescolanza della tappa 01 dà, per $v\ll\Delta$,</p>
   $$\tan\theta\simeq\frac{v}{\Delta},$$
   <p>e la probabilità di trovare nello stato vero la componente «sbagliata» è circa $v^{2}/\Delta^{2}$. Il numero quantico è buono a meno di questa probabilità. Picasso lo dice in termini operativi: <i>«una regola di selezione sarà tanto meglio verificata quanto più &lsquo;buono&rsquo; è il numero quantico a cui si riferisce e viceversa»</i>.</p>`},
   {label:'Il mercurio e la riga di intercombinazione', body:R`
   <p>Il caso che Picasso porta è il mercurio, con $Z=80$. Il fondamentale è un $^{1}S$, e la prima configurazione eccitata, $6s\,6p$, dà un livello $^{1}P_{1}$ e uno $^{3}P_{1}$, con lo stesso $J$. Per l&rsquo;alto valore di $Z$, <i>«l&rsquo;interazione spin-orbita ha elementi di matrice non trascurabili fra stati con energie diverse (ma con lo stesso $J$), in particolare fra gli stati $^{1}P_{1}$ e $^{3}P_{1}$; ciò ha come conseguenza il fatto che, oltre a rimuovere la degenerazione su $J$, l&rsquo;interazione spin-orbita mescola apprezzabilmente fra loro gli stati $^{1}P_{1}$ e $^{3}P_{1}$»</i>. Lo spin totale $S$ non è più un numero quantico buono, e la regola di selezione $\Delta S=0$ viene violata: dal livello che gli spettroscopisti chiamano $^{3}P_{1}$ parte una transizione verso il fondamentale $^{1}S_{0}$, la <i>«riga di intercombinazione»</i>. La sua intensità relativa misura il quadrato dell&rsquo;ampiezza di mescolanza. Lo stesso meccanismo, con un mescolamento molto più piccolo, spiega le debolissime transizioni fra ortoelio e paraelio nell&rsquo;elio.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`In un esercizio un livello degenere di momento angolare è perturbato da un campo magnetico e da un termine $\mathbf L\cdot\mathbf S$ di intensità confrontabile. Si può trattare prima l&rsquo;uno e poi l&rsquo;altro?`,
    a:R`No: la gerarchia richiede che ogni gradino sia piccolo rispetto alle distanze create dal precedente, e qui nessuno dei due è piccolo rispetto all&rsquo;altro. Si deve diagonalizzare la somma delle due perturbazioni sul livello degenere, sfruttando l&rsquo;unico operatore che commuta con entrambe, $J_{z}$, per spezzare la matrice in blocchi. È il caso intermedio della tappa 07, ed è anche il caso in cui un esercizio d&rsquo;esame dà un risultato esatto al primo ordine, perché il livello degenere è un sottospazio finito su cui la somma si diagonalizza.`},
   {q:R`L&rsquo;approssimazione a elettroni indipendenti sbaglia l&rsquo;energia dell&rsquo;elio di molti elettronvolt. Perché si continua a usarla?`,
    a:R`Perché classifica gli stati correttamente, come dice Picasso. La configurazione elettronica, $1s^{2}$ o $1s\,2s$, determina quali livelli nascono, quanti sono e con quali numeri quantici, anche se le loro energie vanno calcolate meglio. Per il primo ordine nella repulsione questo è garantito: gli autovettori approssimati sono combinazioni di stati della stessa configurazione, che quindi <i>«sopravvive»</i> come etichetta. È lo stesso fatto della tappa 02, che gli stati all&rsquo;ordine zero restano autostati di $H_{0}$, letto come classificazione.`}
  ]}
]},
/* ---------------- 09 · LE FONTI A CONFRONTO, E LE ROTTE ---------------- */
{ num:'09', title:'Dove le fonti divergono, e dove il metodo riappare', meta:'sei strade per la stessa equazione · un segno che cambia da libro a libro · la mappa del corso e il programma sul metodo variazionale · bande, molecole, spin in un cristallo · domande d orale',
  blocchi:[
  {t:'prosa', title:'Sei strade per la stessa equazione', tag:'architettura', html:R`
  <p>Il contenuto del caso degenere è uno solo: si diagonalizza la perturbazione ristretta al livello. Le fonti di questo movimento ci arrivano per strade diverse, e ciascuna strada mette in luce un aspetto che le altre lasciano in ombra.</p>
  <p><b>Dirac</b> ci arriva come caso generale del suo paragrafo 43, senza separarlo dal non degenere, e lo collega al problema delle perturbazioni secolari della meccanica classica. È il solo a insistere sull&rsquo;asimmetria: ogni stato perturbato si avvicina a uno stato imperturbato, ma non ogni stato imperturbato si avvicina a uno perturbato. <b>Landau</b> parte dalla stessa forma matriciale del caso non degenere, ne ricava l&rsquo;equazione secolare con il suo nome astronomico e la somma delle radici, e prosegue fino al secondo ordine dentro il gruppo degenere. <b>Sakurai</b> organizza il conto con due proiettori e arriva a una hamiltoniana efficace esatta, da cui si legge ogni ordine. <b>Ballentine</b> tratta il degenere dentro la stessa sezione del non degenere, come il caso generale di cui l&rsquo;altro è un caso particolare. <b>Picasso</b> scompone la perturbazione in una parte che resta dentro i livelli e una che li collega, e con quella scomposizione tratta insieme degenere, non degenere e quasi degenere. <b>Griffiths</b> parte dal caso doppio e arriva al teorema degli stati buoni, che è lo strumento pratico più usato. <b>Shankar</b> dà la ragione per cui la serie si rompe: la base che salta.</p>
  <p>Anche il nome degli stati giusti cambia: «stati buoni» per Griffiths, <i>«stable under the perturbation»</i> per Shankar, <i>«correct zeroth-order kets»</i> per Sakurai, autovettori approssimati all&rsquo;ordine zero per Picasso. Sono la stessa cosa, e l&rsquo;esame può usare uno qualunque di questi nomi.</p>`},
  {t:'prosa', title:'Due divergenze dichiarate', tag:'architettura', html:R`
  <p><b>Il segno di un elemento di matrice.</b> Per l&rsquo;effetto Stark a $n=2$, Picasso scrive $\langle2,1,0|z|2,0,0\rangle=3a_{B}$, Ballentine $\langle210|H_{1}|200\rangle=-3e|\mathcal E|a_{0}$, Sakurai $3ea_{0}|\mathcal E|$ con una carica dell&rsquo;elettrone scritta come negativa. Con le funzioni radiali standard il conto dà $-3a_{0}$. Il segno di un elemento di matrice fra stati diversi dipende dalle fasi scelte per gli stati, e non ha significato fisico da solo; ce l&rsquo;ha la sua combinazione con gli stati buoni, cioè quale combinazione sta più in basso. In un esercizio va detto quali funzioni si usano, e il risultato fisico, cioè che lo stato più basso ha l&rsquo;elettrone spostato contro il verso del campo, non dipende dalla scelta.</p>
  <p><b>La mappa del corso e il programma.</b> La mappa di questo corso indica fra le fonti del movimento anche il paragrafo 10.6 di Ballentine, sul metodo variazionale, come <i>«la risposta alla domanda &lsquo;e quando non funziona?&rsquo;»</i>. Il programma ufficiale esclude invece esplicitamente il metodo variazionale. Questo movimento segue il programma: le risposte alla domanda «e quando non funziona?» sono qui la diagonalizzazione esatta del blocco dei livelli vicini, la matrice efficace al secondo ordine e la gerarchia delle perturbazioni, che sono tutte dentro il perimetro di Q.16. La pagina di Ballentine è stata aperta e non è stata usata, e lo si dichiara.</p>`},
  {t:'prosa', title:'Dove il metodo riappare, in fisica', tag:'architettura', html:R`
  <p><b>Negli spettri atomici.</b> Struttura fine, effetto Zeeman in tutti i suoi regimi, effetto Stark lineare dell&rsquo;idrogeno e degli stati di Rydberg, dove la separazione cresce come $n^{2}$: sono tutti casi di perturbazioni su livelli degeneri, e la figura dei sei livelli $p$ della tappa 07 è il modello di come si leggono.</p>
  <p><b>Negli spin in un ambiente anisotropo.</b> La hamiltoniana dell&rsquo;esercizio di Shankar, $AS_{z}^{2}+B(S_{x}^{2}-S_{y}^{2})$, è la forma con cui si descrive uno spin $1$ in un cristallo o in una molecola con simmetria ridotta, e i due casi della tappa 06 sono i due modi in cui un campo può separare i livelli $m=\pm1$, direttamente o attraverso il livello $m=0$.</p>
  <p><b>Nelle molecole e nei solidi.</b> Due atomi uguali lontani hanno livelli degeneri, uno per atomo; avvicinandoli, l&rsquo;elemento di matrice che li collega sceglie le combinazioni simmetrica e antisimmetrica, e separa i livelli in uno legante e uno antilegante. In un cristallo, un elettrone quasi libero ha stati degeneri ai bordi della zona di Brillouin, e il potenziale periodico, diagonalizzato in quel sottospazio, apre la banda proibita. È il problema a due livelli della tappa 01, nel limite degenere.</p>`},
  {t:'collaudo', title:'Domande d’orale', items:[
   {q:R`Perché nel caso degenere la teoria delle perturbazioni non degenere non funziona? Non mi dica solo che il denominatore si annulla.`,
    a:R`Perché gli stati imperturbati di partenza non sono determinati: qualunque combinazione degli stati del livello è autostato di $H_{0}$, e la perturbazione, anche infinitesima, ne sceglie alcune in particolare. Partendo da una combinazione diversa, lo stato perturbato non è vicino a quello di partenza, e la variazione della base con la perturbazione non è analitica: è un salto. Il denominatore nullo è il sintomo con cui la serie segnala questo salto. La cura è partire dalla base che diagonalizza la perturbazione nel livello.`},
   {q:R`Mi enunci e dimostri il teorema che permette di evitare la diagonalizzazione.`,
    a:R`Se un operatore hermitiano $A$ commuta con $H_{0}$ e con la perturbazione $H'$, e due stati degeneri sono autostati di $A$ con autovalori diversi $\mu\ne\nu$, allora l&rsquo;elemento di matrice di $H'$ fra loro è nullo. Dimostrazione: $0=\langle a|[A,H']|b\rangle=(\mu-\nu)\langle a|H'|b\rangle$, usando l&rsquo;hermiticità di $A$ a sinistra. Quindi gli autostati comuni di $H_{0}$ e $A$ sono già la base buona, e il primo ordine è il valor medio della perturbazione su ciascuno di essi. In pratica $A$ è il generatore di una simmetria che la perturbazione rispetta.`},
   {q:R`Un atomo di idrogeno nel livello $n=2$ in un campo elettrico: quante righe vede nella transizione verso il fondamentale, e perché?`,
    a:R`Tre, al primo ordine. Il fondamentale non si sposta, perché è non degenere e $z$ è dispari. Il livello $n=2$ si separa in tre: $E_{2}-3e\mathcal Ea_{0}$ e $E_{2}+3e\mathcal Ea_{0}$, con gli stati $(|200\rangle\pm|210\rangle)/\sqrt2$ che hanno un dipolo permanente di modulo $3ea_{0}$, e $E_{2}$ doppio, con gli stati $|21,\pm1\rangle$. La riga centrale coincide con la Lyman alfa imperturbata, le altre due sono spostate di $\pm3e\mathcal Ea_{0}$. L&rsquo;effetto è lineare perché nell&rsquo;idrogeno ci sono stati di parità opposta con la stessa energia; in un atomo senza questa degenerazione sarebbe quadratico.`},
   {q:R`Che cosa vuol dire che lo spin totale $S$ è un numero quantico approssimativamente buono?`,
    a:R`Che $S^{2}$ non commuta con la hamiltoniana completa, perché l&rsquo;interazione spin-orbita lo mescola, ma che il mescolamento fra stati con $S$ diverso è piccolo, di ampiezza dell&rsquo;ordine dell&rsquo;elemento di matrice diviso per la distanza fra i livelli. Negli atomi leggeri lo è; nel mercurio non abbastanza, e la regola di selezione $\Delta S=0$ è violata dalla riga di intercombinazione, la cui intensità misura il quadrato dell&rsquo;ampiezza di mescolanza. Un numero quantico è tanto buono quanto lo è la regola di selezione che gli corrisponde.`}
  ]}
]}

var byId = {}; TAPPE.forEach(function(s){ byId[s.num]=s; });

var VKEY='pm-nucleomq-15-visited';
function loadSeen(){ try{ return new Set(JSON.parse(localStorage.getItem(VKEY)||'[]')); }catch(e){ return new Set(); } }
function saveSeen(s){ try{ localStorage.setItem(VKEY, JSON.stringify(Array.from(s))); }catch(e){} }
var SEEN = loadSeen();

function renderNav(active){
  var nav=document.getElementById('sidebar');
  nav.innerHTML='';
  var h=document.createElement('h2'); h.textContent='Nucleo mq-15 · le tappe'; nav.appendChild(h);
  TAPPE.forEach(function(s){
    var b=document.createElement('button');
    b.className='navitem'+(active===s.num?' active':'')+(SEEN.has(s.num)?' seen':'');
    b.innerHTML='<span class="dot"></span><span class="nx">'+s.num+'</span><span>'+s.title+'</span>';
    b.onclick=function(){ showTappa(s.num); };
    nav.appendChild(b);
  });
}

/* ---- renderer dei blocchi ---- */
function sectionProsa(title, tag, html){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var body=elFromHTML('<div class="open-body">'+html+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function sectionGram(title, rows){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag gramtag">grammatica</span></h3>';
  var inner='<table class="gramtab">';
  rows.forEach(function(r){ inner+='<tr><td class="gs">'+r[0]+'</td><td>'+r[1]+'</td></tr>'; });
  inner+='</table>';
  var body=elFromHTML('<div class="gramwrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
/* --- blocco PLOT: la figura non decora, si legge. Ogni plot porta una chiave di lettura. --- */
function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';
  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionSvelabile(title, tag, html, sol){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var c=document.createElement('div'); c.className='collaudo-item';
  var q=document.createElement('div'); q.className='cq'; q.innerHTML=html||'';
  c.appendChild(q); typeset(q);
  if(sol){
    var a=document.createElement('div'); a.className='ca'; a.style.display='none';
    a.innerHTML='<b>Soluzione.</b> '+sol;
    var btn=document.createElement('button'); btn.className='reveal-btn small';
    btn.textContent='Rivela la soluzione';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a);
      btn.disabled=true; btn.classList.add('done'); btn.textContent='Soluzione rivelata'; };
    c.appendChild(btn); c.appendChild(a);
  }
  wrap.appendChild(c); return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    /* DUE SCHEMI, NON UNO — scoperto il 2026-10-06 provando le pagine vive. I movimenti
       scritti per primi (em-01..03, me-10b, i collaudi di gd-01..09 e di quattro em)
       usano una forma piu' semplice: `reveal` e `prolessi` con un solo `html`,
       `esercizio` e `collaudo` con `html` + `sol`. Il renderer ne conosceva una sola e
       chiamava `steps.forEach` su `undefined`: TypeError, e la tappa si fermava li' —
       62 blocchi in 17 movimenti su 74. Non si riscrive il contenuto per far contento
       il renderer: e' il renderer che deve leggere cio' che c'e'.
       E in fondo un ramo che NON muore: uno schema nuovo di domani deve far vedere un
       avviso in quella sezione, non spegnere la pagina sotto di se'. */
    try{
      if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
      else if(b.t==='prolessi') m.appendChild(b.rotte ? sectionProlessi(b)
                                   : sectionProsa(b.title,'prolessi',b.html));
      else if(b.t==='reveal')m.appendChild(b.steps ? sectionReveal(b.title,b.tag,b.steps)
                                   : sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='esercizio') m.appendChild(b.steps ? sectionEsercizio(b)
                                   : sectionSvelabile(b.title,'esercizio',b.html,b.sol));
      else if(b.t==='collaudo')  m.appendChild(b.items ? sectionCollaudo(b.title,b.items)
                                   : sectionSvelabile(b.title,'provi, poi riveli',b.html,b.sol));
      else if(b.t==='plot')      m.appendChild(sectionPlot(b));
      else m.appendChild(sectionProsa(b.title||'(blocco)', 'tipo sconosciuto: '+b.t,
                                      b.html||''));
    }catch(err){
      var avv=document.createElement('section'); avv.className='section';
      avv.innerHTML='<h3>'+(b.title||'(blocco)')+'<span class="tag">non reso</span></h3>'
        +'<p style="color:#ff6b6b">Questo blocco non si &egrave; potuto rendere ('
        +b.t+': '+err.message+'). Il resto della tappa continua sotto.</p>';
      m.appendChild(avv);
    }
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* I POP-UP DEGLI STRUMENTI. `cablaStrumenti` esisteva dal 18-09 e non la chiamava
     nessuno: i 229 rimandi del percorso erano <span> senza handler, e il clic non
     faceva niente. Nessun controllo poteva vederlo — la sintassi era valida, le schede
     c'erano tutte, le formule rendevano: il guasto esisteva solo a pagina viva. Qui, e
     dopo ogni inserimento successivo, perche' la tappa si rimonta da capo a ogni
     cambio e gli handler vanno riattaccati al DOM nuovo. */
  cablaStrumenti(m);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}
