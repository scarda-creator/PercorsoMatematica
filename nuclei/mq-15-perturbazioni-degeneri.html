<style>
  :root{
    --bg:#0e1117; --panel:#161b22; --panel2:#1c232d; --border:#2b333d;

  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;

  .banner{background:var(--panel2);border-bottom:1px solid var(--border);color:var(--muted);

  .shell{display:flex;max-width:1180px;margin:0 auto;align-items:flex-start;}

  .sidebar{width:280px;flex:0 0 280px;padding:20px 12px 60px;position:sticky;top:0;
    max-height:100vh;overflow-y:auto;border-right:1px solid var(--border);}
  .sidebar h2{font-size:.72rem;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);

  .navitem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:none;
    background:transparent;color:var(--txt);padding:9px 10px;border-radius:8px;cursor:pointer;
    font-size:.9rem;transition:.12s;border:1px solid transparent;}
  .navitem:hover{background:var(--panel2);}
  .navitem.active{background:#13233f;border-color:var(--accent);color:#fff;}
  .navitem .dot{width:7px;height:7px;border-radius:50%;background:transparent;flex:0 0 7px;
    border:1px solid var(--border);}
  .navitem.seen .dot{background:var(--ok);border-color:var(--ok);}
  .navitem .nx{color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto;}

  /* ---- MAIN ---- */
  .main{flex:1 1 auto;min-width:0;padding:24px 30px 90px;max-width:860px;}
  h1{font-size:1.5rem;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:.92rem;margin:0 0 18px;}
  .sfhead{border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:8px;}
  .sfhead h1{font-size:1.55rem;}
  .meta{color:var(--muted);font-size:.82rem;margin-top:6px;}

  .section{margin:26px 0;}
  .section > h3{font-size:1.02rem;color:var(--accent2);margin:0 0 10px;
    display:flex;align-items:center;gap:10px;}
  .section > h3 .tag{font-size:.66rem;font-weight:700;letter-spacing:.4px;background:var(--panel2);
    border:1px solid var(--border);color:var(--muted);padding:2px 8px;border-radius:20px;
    text-transform:uppercase;}
  /* --- blocchi figura --- */
  .section > h3 .tag.plottag{background:#101f2e;border-color:#1f3c57;color:#7ab8e0;}
  .plot-intro{color:var(--muted);font-size:.95rem;margin:0 0 12px;}
  .plot-row{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;
    background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;}
  .plot-row.due .plot-box{flex:1 1 300px;min-width:280px;}
  .plot-box{max-width:560px;}
  .plot-leggi{margin-top:10px;background:var(--panel2);border:1px solid var(--border);
    border-left:3px solid #4a8fc7;border-radius:0 10px 10px 0;padding:11px 14px;
    font-size:.93rem;color:var(--muted);}
  .plot-leggi b{color:#7ab8e0;}
  .plot-err{color:#ff6b6b;font-size:.85rem;}
  .open-body{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
  .open-body p:first-child{margin-top:0;} .open-body p:last-child{margin-bottom:0;}
  .open-body ul{margin:.4em 0;padding-left:1.2em;} .open-body li{margin:.35em 0;}

  .note{background:var(--panel2);border-left:3px solid var(--muted);border-radius:6px;
    padding:9px 12px;margin:12px 0;font-size:.9rem;color:var(--muted);}
  .note b{color:#ff9d6b;}
  .note.warn{background:var(--warnbg);border-left-color:var(--warn);color:#e0b85a;}
  .note.warn b{color:#f0c25a;}

  /* ---- GRAMMATICA ---- */
  .gramwrap{background:var(--grambg);border:1px solid #1f4d47;border-radius:12px;padding:6px 6px;}
  table.gramtab{border-collapse:collapse;width:100%;font-size:.92rem;}
  table.gramtab td{padding:9px 12px;vertical-align:top;border-bottom:1px solid #17332e;}
  table.gramtab tr:last-child td{border-bottom:none;}
  table.gramtab td.gs{white-space:nowrap;color:var(--gram);width:1%;
    border-right:1px solid #17332e;font-variant-numeric:tabular-nums;}
  .section > h3 .tag.gramtag{background:var(--grambg);border-color:#1f4d47;color:var(--gram);}

  /* ---- STRUMENTI (repertorio condiviso: la scheda si apre DENTRO la frase) ----
     Nessun accento nuovo: riusa il verde della grammatica, perche' uno strumento
     richiamato e' grammatica gia' spiegata altrove, non una quinta specie di blocco. */
  .str{color:var(--gram);border-bottom:1px dashed var(--gram);cursor:pointer;}
  .str:hover{background:var(--grambg);}
  .str::after{content:"\2666";font-size:.62em;vertical-align:.42em;margin-left:2px;opacity:.8;}
  .str.aperto::after{content:"\2715";}
  .str.rotto{color:#ff6b6b;border-bottom-color:#ff6b6b;cursor:help;}
  /* la scheda e' uno SPAN in display:block, non un div: i rimandi cadono dentro
     <p>, <li> e celle di tabella, dove un div e' HTML illegale. */
  .strcard{display:block;margin:10px 0;background:var(--grambg);border:1px solid #1f4d47;
    border-left:3px solid var(--gram);border-radius:0 10px 10px 0;padding:10px 14px;font-size:.9rem;}
  .strcard .sh{display:block;font-size:.66rem;font-weight:700;letter-spacing:.5px;
    text-transform:uppercase;color:var(--gram);margin-bottom:7px;}
  .strcard .sr{display:block;margin:5px 0;}
  .strcard .sk{color:var(--gram);font-weight:600;}

  /* ---- PROLESSI (preannuncio fisico) ---- */
  .prowrap{background:var(--probg);border:1px solid var(--proedge);border-radius:12px;padding:4px 4px 8px;}
  .prohead{padding:11px 14px 4px;color:var(--pro);font-size:.72rem;font-weight:700;letter-spacing:.7px;

  .pro-oggetto{padding:2px 14px 11px;color:var(--muted);font-size:.92rem;border-bottom:1px solid var(--proline);
    margin-bottom:2px;} .pro-oggetto b{color:var(--txt);}
  table.protab{border-collapse:collapse;width:100%;font-size:.92rem;}
  table.protab td{padding:10px 12px;vertical-align:top;border-bottom:1px solid var(--proline);}
  table.protab tr:last-child td{border-bottom:none;}
  table.protab td.pd{white-space:nowrap;color:var(--pro);width:1%;font-weight:700;font-size:.78rem;
    letter-spacing:.3px;text-transform:uppercase;border-right:1px solid var(--proline);line-height:1.3;}
  .pro-domanda{margin:8px 8px 2px;background:#140d26;border:1px solid var(--proedge);
    border-left:3px solid var(--pro);border-radius:8px;padding:10px 14px;font-size:.92rem;}
  .pro-domanda b{color:var(--pro);}
  .section > h3 .tag.protag{background:var(--probg);border-color:var(--proedge);color:var(--pro);}

  /* ---- REVEAL ---- */
  .rsteps{display:flex;flex-direction:column;gap:12px;}
  .rstep{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 18px;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .rlabel{font-size:.7rem;font-weight:700;letter-spacing:.4px;color:var(--accent);
    text-transform:uppercase;margin-bottom:8px;}
  .rstep p:first-of-type{margin-top:0;} .rstep p:last-child{margin-bottom:0;}
  .rstep ul{margin:.4em 0;padding-left:1.2em;}
  .testo{background:#13233f;border:1px solid #2b4877;border-radius:12px;padding:14px 18px;margin-bottom:14px;}
  .testo .src{display:block;font-size:.74rem;font-style:italic;color:var(--accent2);margin-bottom:8px;
    text-transform:uppercase;letter-spacing:.3px;}
  .esame-nota{font-size:.9rem;color:var(--muted);font-style:italic;margin-top:12px;padding-left:12px;
    border-left:3px solid var(--border);}

  .reveal-btn{background:var(--accent);color:#fff;border:none;padding:11px 18px;border-radius:10px;
    font-size:.95rem;font-weight:600;cursor:pointer;margin-top:14px;transition:.12s;}
  .reveal-btn:hover:not(:disabled){background:var(--accent2);}
  .reveal-btn.small{padding:7px 14px;font-size:.85rem;margin-top:0;background:var(--panel2);
    color:var(--accent2);border:1px solid var(--border);}
  .reveal-btn.small:hover:not(:disabled){border-color:var(--accent);}
  .reveal-btn:disabled,.reveal-btn.done{background:var(--panel2);color:var(--muted);
    border:1px solid var(--border);cursor:default;}

  /* ---- COLLAUDO ---- */
  .collaudo-item{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 18px;margin-bottom:12px;}
  .cq{margin-bottom:10px;}
  .ca{margin-top:12px;background:var(--okbg);border:1px solid #235c33;border-radius:8px;
    padding:10px 14px;font-size:.94rem;}
  .ca b{color:#5fd980;}

  /* ---- PREV / NEXT ---- */
  .prevnext{display:flex;justify-content:space-between;gap:12px;margin-top:40px;
    border-top:1px solid var(--border);padding-top:20px;}
  .pnbtn{flex:1 1 0;background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:12px 16px;cursor:pointer;color:var(--txt);text-align:left;transition:.14s;font:inherit;}
  .pnbtn:hover{border-color:var(--accent);background:var(--panel2);}
  .pnbtn.next{text-align:right;}
  .pnbtn .k{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .pnbtn .t{font-weight:600;color:var(--accent2);}
  .pnbtn:disabled{opacity:.35;cursor:default;border-color:var(--border);background:var(--panel);}

  code{background:var(--panel2);border:1px solid var(--border);border-radius:5px;
    padding:1px 5px;font-size:.85em;color:var(--accent2);}
  .katex{font-size:1.02em;color:var(--txt);} .katex-display{margin:.5em 0;overflow-x:auto;overflow-y:hidden;}

  @media(max-width:860px){
    .shell{flex-direction:column;}
    .sidebar{width:100%;flex:none;position:static;max-height:none;border-right:none;
      border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:4px;}
    .sidebar h2{width:100%;} .navitem{width:auto;}
    .main{padding:20px 16px 80px;}
  }
</style>

<script>

function elFromHTML(html){ var d=document.createElement('div'); d.innerHTML=html; return d; }

/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un
   rimando scritto nella prosa:

       <span class="str" data-str="serie-geometrica">la serie geometrica</span>

   Le schede citate da questo nucleo sono cucite qui sotto dal montaggio
   (assembla-nucleo.js): la pagina resta autosufficiente — niente fetch,
   niente sottocartelle da pubblicare — e un rimando a una scheda che non
   esiste FERMA la costruzione invece di arrivare in pagina rotto.
   Apertura: lo stesso gesto del collaudo (si clicca, il pannello compare,
   si typeset una volta sola), portato dentro la frase.
   =================================================================== */
var CORSO = 'meccanica-quantistica';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["spettro"] = {"nome":"Spettro di un operatore","riga":"Lo spettro di un operatore e' l'insieme dei possibili esiti di una misura — i suoi autovalori — e puo' essere discreto (autovalori separati, autovettori in $\\mathcal H$), continuo (autovalori che riempiono un intervallo, autovettori non normalizzabili), o misto.","serve":"E' la quantita' che la fisica chiede davvero: scrivere l'hamiltoniana e trovarne lo spettro E' il problema d'esame. La distinzione discreto/continuo non e' tecnica — decide se un autostato e' uno stato preparabile (discreto) o una distribuzione che vive fuori dallo spazio di Hilbert (continuo), come l'onda piana e la delta.","esempio":"Per $\\sigma_z=\\begin{pmatrix}1&0\\\\0&-1\\end{pmatrix}$ lo spettro e' $\\{+1,-1\\}$, discreto, e i due invarianti della matrice lo riassumono senza risolvere l'equazione secolare: la somma degli autovalori e' la traccia, $\\operatorname{tr}\\sigma_z=0$, il loro prodotto e' il determinante, $\\det\\sigma_z=-1$. Per l'operatore posizione lo spettro e' tutta la retta reale, continuo, e gli autovettori sono delte di Dirac.","debito":"la costruzione rigorosa dello spettro continuo (teorema spettrale generalizzato, misura spettrale $E(\\lambda)$ di von Neumann) sta fuori da questo percorso: qui si dichiara che esiste e si lavora coi casi concreti. La separazione fra spettro continuo e spettro residuo non si tratta.","controllo":[{"tipo":"uguale","sinistra":"Matrix([[1,0],[0,-1]]).trace()","vale":"0","dove":"esempio","appare":"\\operatorname{tr}\\sigma_z=0"},{"tipo":"uguale","sinistra":"Matrix([[1,0],[0,-1]]).det()","vale":"-1","dove":"esempio","appare":"\\det\\sigma_z=-1"}],"qui":{},"pieno":null};
STRUM["proiettore-ortogonale"] = {"nome":"Proiettore ortogonale","riga":"Un proiettore ortogonale e' un operatore $\\hat P$ che soddisfa due condizioni insieme: $\\hat P^2=\\hat P$ (idempotenza — proiettare due volte equivale a proiettare una volta) e $\\hat P^{\\dagger}=\\hat P$ (autoaggiuntezza, che rende la proiezione perpendicolare al sottospazio invece che obliqua).","serve":"E' il mattone di tutta la teoria della misura: $\\hat P=|\\psi\\rangle\\langle\\psi|$ su un ket normalizzato e' l'osservabile «lo stato e' $|\\psi\\rangle$?» con esiti $1$ e $0$, e il suo valor medio e' la probabilita'. L'identita' si scrive come somma di proiettori, $\\mathbb 1=\\sum_i\\hat P_i$, ed e' con questa che si cambia base e si decompone un'osservabile.","esempio":"Da $|\\psi\\rangle=(\\tfrac35,\\tfrac45)$ normalizzato si costruisce $\\hat P=|\\psi\\rangle\\langle\\psi|$ con entrate $\\tfrac{9}{25},\\tfrac{12}{25},\\tfrac{16}{25}$. L'elemento $(1,1)$ di $\\hat P^2$ vale $(\\tfrac{9}{25})^2+(\\tfrac{12}{25})^2=\\tfrac{9}{25}$, cioe' $\\hat P^2=\\hat P$; la traccia e' $\\tfrac{9}{25}+\\tfrac{16}{25}=1$, come per ogni proiettore di rango uno.","debito":"la decomposizione spettrale di un operatore autoaggiunto con spettro continuo in una famiglia di proiettori $E(\\lambda)$ (la misura spettrale) sta fuori da qui: si usa il caso discreto, dove i proiettori sono $|i\\rangle\\langle i|$.","controllo":[{"tipo":"simbolico","dove":"esempio","appare":"\\hat P^2=\\hat P","perche":"e' l'idempotenza, meta' della definizione di proiettore: un'identita' fra operatori, non un conto numerico. Il caso concreto che la sostiene e' l'entrata $(1,1)$ asserita qui sotto, dove i numeri ci sono"},{"tipo":"uguale","sinistra":"(Rational(9,25))**2+(Rational(12,25))**2","vale":"9/25","dove":"esempio","appare":"(\\tfrac{9}{25})^2+(\\tfrac{12}{25})^2=\\tfrac{9}{25}"},{"tipo":"uguale","sinistra":"Rational(9,25)+Rational(16,25)","vale":"1","dove":"esempio","appare":"\\tfrac{9}{25}+\\tfrac{16}{25}=1"}],"qui":{},"pieno":null};
STRUM["commutatore"] = {"nome":"Commutatore","riga":"$[\\hat A,\\hat B]=\\hat A\\hat B-\\hat B\\hat A$, antisimmetrico, con la regola di Leibniz $[\\hat A,\\hat B\\hat C]=[\\hat A,\\hat B]\\hat C+\\hat B[\\hat A,\\hat C]$ e la relazione canonica $[\\hat x,\\hat p]=i\\hbar$.","serve":"E' la misura di quanto due operazioni dipendano dall'ordine, e qui l'ordine e' fisica: due osservabili che non commutano non hanno una base comune di autostati, quindi non si misurano insieme con precisione arbitraria. Quasi ogni conto che sembra magico — l'algebra del momento angolare, gli operatori di salita e discesa, il teorema di Ehrenfest — e' una manipolazione di commutatori fatta con quelle regole e nient'altro.","esempio":"Dalla regola di Leibniz, $[\\hat x,\\hat p^{2}]=[\\hat x,\\hat p]\\hat p+\\hat p[\\hat x,\\hat p]=2i\\hbar\\hat p$. E' il conto che fa uscire il teorema di Ehrenfest: la meccanica classica ricompare come relazione fra valori medi, e ricompare perche' quel commutatore vale proprio $2i\\hbar\\hat p$.","debito":"l'identita' di Jacobi si enuncia e non si dimostra; la corrispondenza fra commutatore e parentesi di Poisson — che e' l'idea di Dirac e non un'analogia decorativa — sta in mq-07, e li' va letta per intero.","controllo":[{"tipo":"uguale","sinistra":"I*hbar*p + p*I*hbar","vale":"2*I*hbar*p","ipotesi":{"hbar":"positive","p":"real"},"dove":"esempio","appare":"2i\\hbar\\hat p"},{"tipo":"simbolico","dove":"riga","appare":"[\\hat x,\\hat p]=i\\hbar","perche":"e' la relazione di commutazione canonica, il POSTULATO da cui discende il resto della teoria: non si dimostra, si assume, ed e' cio' che separa la meccanica quantistica dalla classica"}],"qui":{},"pieno":null};
STRUM["operatore-aggiunto"] = {"nome":"Operatore aggiunto e autoaggiunto","riga":"L'aggiunto e' definito da $\\langle\\phi|\\hat A\\psi\\rangle=\\langle\\hat A^{\\dagger}\\phi|\\psi\\rangle$ per ogni coppia di stati, e l'operatore e' autoaggiunto quando coincidono sia $\\hat A^{\\dagger}$ con $\\hat A$ sia i loro domini.","serve":"E' la condizione che rende un operatore un'osservabile: autovalori reali, e autovettori di autovalori distinti ortogonali. In dimensione finita «autoaggiunto» e «hermitiano» coincidono; in dimensione infinita no, e la differenza non e' pedanteria — l'operatore impulso su una semiretta e' hermitiano e non autoaggiunto, e infatti non e' un'osservabile.","esempio":"Se $\\hat A\\psi=a\\psi$ con $\\hat A$ autoaggiunto, allora $a\\langle\\psi|\\psi\\rangle=\\langle\\psi|\\hat A\\psi\\rangle=\\langle\\hat A\\psi|\\psi\\rangle=a^{*}\\langle\\psi|\\psi\\rangle$; siccome la norma non e' nulla segue $a=a^{*}$, cioe' l'autovalore e' reale. Tre righe, e sono la ragione per cui le osservabili si rappresentano cosi'.","debito":"la distinzione fra hermitiano e autoaggiunto in dimensione infinita — domini, estensioni, indici di difetto — e' il programma di von Neumann e sta fuori da questo percorso: qui si dichiara che esiste e si lavora nel caso buono. La regola di inversione dell'ordine nell'aggiunto di un prodotto si usa e non si dimostra.","controllo":[{"tipo":"uguale","sinistra":"conjugate(a)","vale":"a","ipotesi":{"a":"real"},"dove":"esempio","appare":"a=a^{*}"}],"qui":{},"pieno":null};
STRUM["simmetrie"] = {"nome":"Simmetrie","riga":"L'insieme delle trasformazioni che lasciano identica la sorgente, e che perciò devono lasciare identico anche il campo che ne nasce.","serve":"È il ragionamento che decide la FORMA del campo prima di calcolarlo, e senza il quale la legge di Gauss non serve a niente: Gauss dà un solo numero — il flusso totale — e da un numero si ricava un campo soltanto se si sa già in che direzione punta e da quali variabili dipende. L'argomento ha una forma sola: se una trasformazione lascia identica la distribuzione di carica, lascia identico il campo; quindi ogni componente che quella trasformazione cambierebbe deve essere nulla, e ogni variabile che essa sposta non può comparire.","esempio":"Per un filo infinito uniformemente carico, la traslazione lungo il filo e la rotazione attorno a esso lasciano la carica identica: $\\mathbf E$ non può dipendere né da $z$ né dall'angolo. La riflessione nel piano perpendicolare al filo manderebbe $E_z$ in $-E_z$ lasciando uguale la sorgente, quindi $E_z=0$; resta la sola componente radiale $E_r(r)$. Solo a quel punto il cilindro coassiale è la superficie giusta, e Gauss dà $E_r\\cdot 2\\pi rL=\\dfrac{\\lambda L}{\\varepsilon_0}$, da cui $E_r=\\dfrac{\\lambda}{2\\pi\\varepsilon_0 r}$.","qui":{"meccanica-quantistica":{"serve":"Qui l'argomento di simmetria non decide la forma di un campo: decide la forma degli OPERATORI, ed è il modo in cui questo corso costruisce la teoria. Lo schema è lo stesso — una trasformazione che lascia identica la situazione fisica deve lasciare identica la descrizione — ma la conseguenza è più forte: ogni trasformazione di simmetria continua è realizzata da un operatore unitario, ogni operatore unitario continuo è l'esponenziale di un generatore autoaggiunto, e quel generatore è una quantità conservata. Impulso, momento angolare ed energia non si postulano: sono i generatori delle traslazioni, delle rotazioni e delle traslazioni temporali.","esempio":"Lo spazio è omogeneo, quindi traslare un sistema isolato non ne cambia la fisica: $\\hat U(a)=e^{-ia\\hat P/\\hbar}$ deve commutare con $\\hat H$. Al primo ordine in $a$ questo dà $[\\hat P,\\hat H]=0$, e quindi $\\dfrac{d}{dt}\\langle \\hat P\\rangle=0$: l'omogeneità dello spazio è la conservazione dell'impulso, e il passaggio da una all'altra è di due righe."}},"debito":"nessun nucleo del percorso tratta l'argomento di simmetria come strumento a sé: qui c'è la forma dell'argomento e non la sua giustificazione, che è di teoria dei gruppi e sta fuori dal percorso costruito finora. Quello che il percorso copre è il pezzo di destra — l'integrale di flusso, nel nucleo 03 tappa 04 — non il pezzo di sinistra che decide quale superficie scegliere.","controllo":[{"tipo":"uguale","sinistra":"(lam/(2*pi*e0*r))*2*pi*r*L","vale":"lam*L/e0","dove":"esempio","appare":"\\dfrac{\\lambda L}{\\varepsilon_0}"}]};
STRUM["clebsch-gordan"] = {"nome":"Coefficienti di Clebsch-Gordan","riga":"Sono il cambio di base fra quella disaccoppiata $|j_1m_1\\rangle|j_2m_2\\rangle$ e quella accoppiata $|JM\\rangle$, dove $J$ va da $|j_1-j_2|$ a $j_1+j_2$ a passi di uno e il coefficiente si annulla se $M$ non vale $m_1+m_2$.","serve":"Servono ogni volta che due momenti angolari si sommano — spin-orbita, due elettroni, spin nucleare ed elettronico — e serve la base in cui il momento totale e' definito. I coefficienti si leggono su tavola; cio' che va saputo a memoria e' quali valori del totale escono, e che senza la somma delle proiezioni il coefficiente e' zero.","esempio":"Due spin un mezzo danno un singoletto e un tripletto. Il conteggio torna, ed e' il primo controllo da fare su ogni composizione: $2\\cdot2=4$ stati nella base disaccoppiata, e $1+3=4$ in quella accoppiata. La dimensione non cambia mai, perche' e' solo un cambio di base.","debito":"le convenzioni di fase (Condon-Shortley) e le formule di ricorrenza non stanno qui. Le tavole dei vari testi differiscono proprio sulle fasi: quando se ne usa una, va dichiarata quale.","controllo":[{"tipo":"uguale","sinistra":"2*2","vale":"4","dove":"esempio","appare":"2\\cdot2=4"},{"tipo":"uguale","sinistra":"1+3","vale":"4","dove":"esempio","appare":"1+3=4"}],"qui":{},"pieno":null};
STRUM["raggio-di-bohr"] = {"nome":"Raggio di Bohr","riga":"$a_0=4\\pi\\varepsilon_0\\hbar^{2}/(m_ee^{2})\\simeq0{,}529\\times10^{-10}$ m, con energia associata $E_1\\simeq-13{,}6$ eV.","serve":"E' la scala di lunghezza dell'atomo, e si ottiene senza risolvere niente: si minimizza la somma fra il costo cinetico dell'indeterminazione, che va come l'inverso del quadrato del raggio, e l'attrazione coulombiana, che va come l'inverso del raggio. Serve come controllo d'ordine di grandezza su ogni risultato atomico: se un conto da' una lunghezza mille volte diversa, il conto e' sbagliato.","esempio":"I livelli vanno come l'inverso del quadrato del numero quantico principale, quindi il secondo vale $-3{,}4$ eV e la prima riga di Lyman ha energia $10{,}2$ eV. Il raggio medio cresce col quadrato: lo stato con numero quantico dieci e' $10^{2}=100$ volte piu' grande del fondamentale, ed e' la ragione fisica per cui gli atomi di Rydberg sono enormi.","debito":"la derivazione completa dall'equazione radiale sta nel movimento sull'idrogeno; qui ci sono la stima variazionale e i numeri da ricordare.","controllo":[{"tipo":"numero","espr":"-13.6/4","vale":"-3.4","dove":"esempio","appare":"-3{,}4"},{"tipo":"numero","espr":"-13.6/4 - (-13.6)","vale":"10.2","dove":"esempio","appare":"10{,}2"},{"tipo":"uguale","sinistra":"10**2","vale":"100","dove":"esempio","appare":"10^{2}=100"}],"qui":{},"pieno":null};
STRUM["armoniche-sferiche"] = {"nome":"Armoniche sferiche","riga":"$Y_\\ell^{m}(\\theta,\\varphi)$ sono le autofunzioni simultanee di $\\hat L^{2}$, con autovalore $\\hbar^{2}\\ell(\\ell+1)$, e di $\\hat L_z$, con autovalore $\\hbar m$, ortonormali e complete sulla sfera.","serve":"Sono la parte angolare di ogni problema a simmetria sferica: appena il potenziale dipende solo dalla distanza, l'equazione si separa e la dipendenza angolare e' sempre una di queste, qualunque sia il potenziale. Cio' che cambia da problema a problema e' solo la parte radiale — per questo si imparano una volta e si riusano sempre.","esempio":"Per ogni $\\ell$ ci sono $2\\ell+1$ valori di $m$: e' la degenerazione essenziale di ogni livello a simmetria sferica, e non dipende dal potenziale. Per $\\ell=2$ vengono $2\\cdot2+1=5$ stati. La prima armonica e' costante, ed e' il motivo per cui lo stato fondamentale di un potenziale centrale e' sempre sfericamente simmetrico.","debito":"la costruzione esplicita dai polinomi di Legendre associati, e le formule di ricorrenza, non stanno qui: si usano gli enunciati e l'ortonormalita'.","controllo":[{"tipo":"uguale","sinistra":"2*2+1","vale":"5","dove":"esempio","appare":"2\\cdot2+1=5"},{"tipo":"simbolico","dove":"riga","appare":"\\hbar^{2}\\ell(\\ell+1)","perche":"e' l'autovalore del quadrato del momento angolare, che discende dall'algebra dei commutatori e non dalla forma esplicita delle armoniche. Si enuncia qui perche' e' cio' che le definisce"}],"qui":{},"pieno":null};
STRUM["matrici-di-pauli"] = {"nome":"Matrici di Pauli","riga":"Sono le tre matrici $2\\times2$ hermitiane a traccia nulla il cui quadrato e' l'identita' e il cui commutatore riproduce l'algebra del momento angolare, da cui lo spin $\\hat S_i=\\tfrac{\\hbar}{2}\\sigma_i$.","serve":"Sono la rappresentazione piu' piccola non banale del momento angolare, e insieme all'identita' formano una base di tutte le matrici due per due hermitiane: qualunque osservabile di un sistema a due stati e' una combinazione dell'identita' e delle tre. Ogni conto di spin un mezzo — Stern-Gerlach, precessione, risonanza magnetica, qubit — si riduce alla loro algebra.","esempio":"Siccome il quadrato di una combinazione unitaria delle tre e' l'identita', qualunque esponenziale collassa: l'operatore di rotazione dello spinore diventa $\\cos(\\theta/2)$ per l'identita' meno $i\\sin(\\theta/2)$ per la combinazione. Il mezzo nell'angolo e' la ragione per cui una rotazione di un giro intero cambia segno allo stato, perche' $\\cos(\\pi)=-1$.","debito":"la costruzione generale delle rappresentazioni di SU(2) e il suo legame con SO(3) stanno nel movimento sul momento angolare; qui c'e' il caso di spin un mezzo con le sue regole di calcolo.","controllo":[{"tipo":"uguale","sinistra":"cos(2*pi/2)","vale":"-1","dove":"esempio","appare":"\\cos(\\pi)=-1"},{"tipo":"uguale","sinistra":"cos(pi/3)**2+sin(pi/3)**2","vale":"1","dove":"esempio","appare":"\\sin(\\theta/2)"}],"qui":{},"pieno":null};
STRUM["elettronvolt"] = {"nome":"Elettronvolt","riga":"L'energia che un elettrone acquista attraversando una differenza di potenziale di un volt: $1\\ \\mathrm{eV}=1{,}602\\cdot10^{-19}$ J; divisa per $c^{2}$ è una massa, $1\\ \\mathrm{eV}/c^{2}=1{,}783\\cdot10^{-36}$ kg.","serve":"A leggere senza conversioni le tabelle in cui la fisica delle particelle e l'astrofisica scrivono le masse a riposo come energie — l'elettrone 0,511 MeV, il protone 938 MeV, il bosone di Higgs 125 GeV. La scelta non è una bizzarria di notazione: in un processo la quantità che si conserva è l'energia, e scrivere la massa già in energia dice a colpo d'occhio quali reazioni sono possibili e quante ne resta per l'energia cinetica o per i fotoni. L'elettronvolt ha anche un secondo mestiere, e in astrofisica è il più usato dei due: convertito in temperatura tramite $k_BT$ dà la scala termica a cui un processo di quella energia diventa frequente, e questo è ciò che permette di dire a che punto della storia dell'universo o a che profondità di una stella un certo processo si accende.","esempio":"Dalla massa del protone espressa come energia, $938{,}3$ MeV, si ricavano i chilogrammi in un passaggio: $m_p=938{,}3\\cdot10^{6}\\cdot1{,}783\\cdot10^{-36}=1{,}673\\cdot10^{-27}$ kg, che è il valore stampato in calce al foglio d'esame. Sul versante termico, $T=\\dfrac{1{,}602\\cdot10^{-19}}{1{,}381\\cdot10^{-23}}=11600$ K: un'energia di un elettronvolt corrisponde a poco più di undicimila kelvin, e siccome ionizzare l'idrogeno costa 13,6 eV si capisce subito perché serva una fotosfera da qualche decina di migliaia di kelvin per trovarlo ionizzato.","pieno":{"file":"as-01-la-scala-del-cosmo.html","tappa":"05","come":"le masse delle particelle elementari scritte come energie, con la conversione in chilogrammi e la gerarchia delle masse, nel movimento sulla scala del cosmo"},"controllo":[{"tipo":"numero","espr":"1.602177e-19/(2.99792458e8)**2*1e36","vale":"1.783","dove":"riga","appare":"1,783\\cdot10^{-36}"} function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';
  return h;
}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

{ num:'00', title:'Di cosa parla questo movimento', meta:'Meccanica Quantistica · voce Q.16 · il caso degenere e la validità dell approssimazione · la perturbazione che sceglie la base · il conto che metà degli appelli chiede',
  blocchi:[
  {t:'prosa', title:'La domanda, e il rovesciamento che contiene', tag:'architettura', html:R`
  <p>La teoria delle perturbazioni non degenere si regge su un&rsquo;ipotesi che Dirac scrive prima di ogni formula: <i>«ciascun autovalore $H'$ di $H$ è molto vicino a uno e un sol autovalore $E'$ di $E$»</i>. Quando un livello dello <span class="str" data-str="spettro">spettro</span> imperturbato è degenere, cioè quando a un&rsquo;energia $E^{(0)}$ corrispondono più stati indipendenti, questa ipotesi cade in modo istruttivo. Accendendo la perturbazione, il livello si separa in generale in più livelli vicini, e ciascuno di essi proviene da una combinazione <i>particolare</i> degli stati imperturbati. Quale combinazione, l&rsquo;energia da sola non lo dice. Sakurai lo formula così: <i>«it is not a priori obvious to what linear combination of the unperturbed kets the perturbed ket is reduced in the limit $\lambda\to0$»</i>.</p>
  <p>Il rovesciamento è questo. Nel caso non degenere la perturbazione era piccola rispetto alle distanze fra i livelli, e il problema era stimare di quanto spostava un livello che si conosceva. Nel caso degenere la distanza fra gli stati di un livello è <b>zero</b>, e qualunque perturbazione, anche minuscola, è grande rispetto a essa. Dentro il livello degenere non c&rsquo;è nessuna serie da sviluppare. C&rsquo;è da diagonalizzare una matrice, e la perturbazione, per quanto piccola, decide da sola quale base è quella giusta. La teoria delle perturbazioni torna utile solo per ciò che collega il livello agli altri livelli, lontani in energia.</p>
  <p>Il programma del corso chiede in una riga sola <i>«estensione al caso degenere, validità dell&rsquo;approssimazione»</i>. La misura sugli scritti dice che è il conto più richiesto della parte di teoria: la parola «degenerazione» compare in venti dei cinquantuno file di compiti, quasi sempre come livello da separare con una perturbazione. La combinazione tipica è un livello di momento angolare più un termine $\mathbf L\cdot\mathbf S$ o un campo lungo $z$.</p>`},
  {t:'prosa', title:'Come è fatto il movimento', tag:'architettura', html:R`
  <p><b>Il primo blocco è il metodo.</b> La tappa 01 mostra perché la serie non degenere si rompe, e la ragione non è solo il denominatore nullo: è che la base imperturbata giusta salta in modo discontinuo quando si accende la perturbazione. La 02 ricava il metodo, l&rsquo;equazione secolare nel sottospazio degenere, seguendo la derivazione con i proiettori di Sakurai, e lo confronta con le forme di Landau, Ballentine, Griffiths e Dirac. La 03 dà il modo di evitarlo: il teorema degli stati «buoni», e il caso dell&rsquo;interazione spin-orbita, svolto prima nella base sbagliata e poi in quella giusta.</p>
  <p><b>Il secondo blocco sono gli esempi.</b> La 04 risolve tre compiti d&rsquo;esame veri. La 05 è l&rsquo;effetto Stark lineare dell&rsquo;idrogeno, il caso in cui la degenerazione fa comparire un effetto che nei livelli non degeneri non c&rsquo;è.</p>
  <p><b>Il terzo blocco è dove il metodo arriva al suo limite.</b> La 06 tratta il caso in cui la degenerazione sopravvive al primo ordine e va rimossa al secondo. La 07 i livelli quasi degeneri, con due esempi in cui si vede il passaggio da un regime all&rsquo;altro: lo Stark con una piccola separazione fra $2s$ e $2p$, e un elettrone $p$ in un campo magnetico confrontabile con la struttura fine. La 08 la gerarchia di perturbazioni e i numeri quantici approssimativamente buoni, cioè la domanda «quando il risultato vale». La 09 mette a confronto le fonti.</p>
  <p><b>Che cosa questo movimento non fa.</b> Non costruisce la teoria della composizione dei momenti angolari, né le tavole dei coefficienti di Clebsch-Gordan: dove servono, si usa il fatto che $\mathbf L\cdot\mathbf S$ è diagonale negli autostati del momento totale, e si mostra che cosa succede senza saperlo. Non calcola la struttura fine dell&rsquo;idrogeno nei dettagli relativistici. E non usa il metodo variazionale, che il programma esclude.</p>`}
]},
/* ---------------- 01 · PERCHE' LA SERIE SI ROMPE ---------------- */
{ num:'01', title:'Perché la serie non degenere si rompe, e non solo per un denominatore', meta:'il denominatore nullo e il numeratore che non lo è · la base che salta di colpo · il problema a due livelli quando la distanza va a zero · l angolo di mescolamento come funzione discontinua',
  blocchi:[
  {t:'prosa', title:'Il sintomo e la malattia', tag:'architettura', html:R`
  <p>Il sintomo è visibile nelle formule. La correzione al primo ordine dello stato e quella al secondo ordine dell&rsquo;energia hanno al denominatore $E_{n}^{(0)}-E_{k}^{(0)}$. Se due stati hanno la stessa energia imperturbata il denominatore è nullo, e se l&rsquo;elemento di matrice fra i due non è nullo il termine esplode. Griffiths nota una via d&rsquo;uscita: la formula sopravvive <i>«unless, perhaps, the numerator vanishes»</i>, se l&rsquo;elemento di matrice fra i due stati degeneri è zero. È una scappatoia che diventerà il metodo, nella tappa 03.</p>
  <p>La malattia è più profonda, e Shankar la descrive senza formule. Si immagini di accendere la perturbazione con continuità, da zero al suo valore pieno. Se né $H_{0}$ né $H_{0}+H'$ sono degeneri, la base di autovettori cambia con continuità da $|n^{0}\rangle$ a $|n\rangle$, e la serie è lo sviluppo di Taylor di questa variazione. Se invece $H_{0}$ è degenere, si può partire dalla base perturbata e <i>spegnere</i> la perturbazione: si arriva a una base ben precisa del sottospazio degenere, quella che la perturbazione ha selezionato. Ma <i>«since $H^{0}$ is degenerate, we needn&rsquo;t have started with this basis; we could have started with some other basis [...] chosen randomly. But if we start with any basis except [that one], and turn on the external field of infinitesimal size, the change in the basis will not be infinitesimal. It is this nonanalytic behavior that is signaled by the divergence in the first-order matrix element»</i>.</p>
  <p>Il denominatore nullo, dunque, è il segnale che si è partiti dalla base sbagliata. Una perturbazione infinitesima produce un cambiamento finito della base dentro il sottospazio degenere, e nessuno sviluppo in serie può descrivere un salto. La cura, anticipata da Shankar, è partire dalla base giusta: <i>«it is a basis that diagonalizes $H'$ within the degenerate space»</i>.</p>`},
  {t:'reveal', title:'Il salto, visto sul problema a due livelli', tag:'costruzione', steps:[
   {label:'Gli autovettori esatti', body:R`
   <p>Si prenda la hamiltoniana a due livelli</p>
   $$H=\begin{pmatrix}\Delta/2&\lambda V\\ \lambda V&-\Delta/2\end{pmatrix},$$
   <p>con $V$ reale e positivo. Gli autovettori si scrivono con un angolo di mescolamento $\theta$: quello superiore è $\cos\theta\,|1\rangle+\sin\theta\,|2\rangle$, con</p>
   $$\tan2\theta=\frac{2\lambda V}{\Delta}.$$
   <p>Per $\Delta$ grande rispetto a $\lambda V$ l&rsquo;angolo è piccolo, $\theta\simeq\lambda V/\Delta$, e l&rsquo;autovettore è quasi $|1\rangle$ con una piccola correzione proporzionale a $\lambda$: è la serie non degenere, con il suo coefficiente $\lambda V/\Delta$.</p>`},
   {label:'Il limite degenere', body:R`
   <p>Ora si faccia tendere $\Delta$ a zero. Per ogni $\lambda\gt0$, per quanto piccolo, $\tan2\theta\to+\infty$ e $\theta\to\pi/4$: l&rsquo;autovettore superiore diventa $(|1\rangle+|2\rangle)/\sqrt2$, a metà strada fra i due stati di partenza. Per $\lambda=0$ invece qualunque combinazione è autovettore. La funzione $\theta(\lambda)$, a $\Delta=0$, vale $\pi/4$ per ogni $\lambda\gt0$ e non è definita in $\lambda=0$: non c&rsquo;è nessun modo di arrivarci per piccole variazioni partendo da $|1\rangle$. La base «buona», $(|1\rangle\pm|2\rangle)/\sqrt2$, non dipende da quanto è piccola la perturbazione. Dipende solo dalla sua <i>forma</i>, cioè dalla direzione dell&rsquo;elemento fuori diagonale.</p>
   <p>Gli autovalori, nello stesso limite, sono $\pm\lambda V$: lineari in $\lambda$. Una serie di Rayleigh e Schrödinger costruita su $|1\rangle$ e $|2\rangle$ non può produrli, perché il suo primo ordine è $\langle1|\lambda V\sigma_{x}|1\rangle=0$ e il secondo ha il denominatore $\Delta$ che va a zero.</p>`}
  ]},
  {t:'plot', title:'L’angolo di mescolamento, da continuo a discontinuo',
   intro:R`<p>L&rsquo;angolo di mescolamento $\theta$ dell&rsquo;autovettore superiore in funzione di $\lambda V$, per tre valori della distanza imperturbata: $\Delta=0{,}4$ (blu), $\Delta=0{,}1$ (arancio), $\Delta=0{,}01$ (verde). La retta grigia orizzontale è $\pi/4$.</p>`,
   plots:[{kind:'func2d', xr:[0,1], yr:[0,0.9], height:270, ticks:true,
     title:'theta(lambda V) = (1/2) arctan(2 lambda V / Delta)',
     curves:[{f:'0.5*Math.atan(2*x/0.4)', col:'#5aa9ff', width:2.4, label:'Delta = 0.4'},
             {f:'0.5*Math.atan(2*x/0.1)', col:'#ffb86b', width:2.4, label:'Delta = 0.1'},
             {f:'0.5*Math.atan(2*x/0.01)', col:'#6bdc9b', width:2.4, label:'Delta = 0.01'},
             {f:'Math.PI/4', col:'#6f7a90', width:1.2, label:'pi/4'}],
     xlabel:'lambda V', ylabel:'theta'}],
   leggi:R`<p><b>Che cosa guardare.</b> Per $\Delta=0{,}4$ l&rsquo;angolo cresce dolcemente da zero, e la sua pendenza nell&rsquo;origine, $1/\Delta$, è il coefficiente della correzione al primo ordine. Riducendo $\Delta$ la pendenza cresce, e per $\Delta=0{,}01$ l&rsquo;angolo sale a $\pi/4$ quasi verticalmente e poi resta fermo.</p>
   <p><b>Che cosa impararne.</b> Al limite $\Delta\to0$ la curva diventa un gradino: zero nell&rsquo;origine, $\pi/4$ subito dopo. La serie non degenere è lo sviluppo di Taylor della curva nell&rsquo;origine, e un gradino non ha sviluppo di Taylor. Il metodo degenere fa il contrario: prende la curva <i>dopo</i> il gradino, dove è costante, e calcola da lì.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Se la perturbazione non ha elementi di matrice fra gli stati del livello degenere, la formula non degenere si può usare?`,
    a:R`Sì, ed è la scappatoia di Griffiths. Se tutti gli elementi $\langle a|V|b\rangle$ fra stati diversi del livello sono nulli, la base imperturbata è già quella che diagonalizza la perturbazione nel sottospazio: i numeratori pericolosi sono zero, e il primo ordine è semplicemente il valor medio su ciascuno stato. Il caso degenere diventa un problema non degenere per ciascuno stato separatamente. Il metodo della tappa 03 consiste nello scegliere la base in modo che questo accada.`},
   {q:R`Nel limite degenere l&rsquo;autovettore superiore è $(|1\rangle+|2\rangle)/\sqrt2$ per ogni $\lambda\gt0$. Che cosa succede se $V$ cambia segno?`,
    a:R`L&rsquo;autovettore superiore diventa $(|1\rangle-|2\rangle)/\sqrt2$, e i due stati si scambiano i ruoli. La base buona non dipende dal modulo della perturbazione ma da come è fatta: due perturbazioni diverse sullo stesso livello degenere possono scegliere basi diverse. È quello che mostra l&rsquo;esercizio sull&rsquo;oscillatore bidimensionale della tappa 04, dove due perturbazioni con lo stesso spettro esatto scelgono basi diverse.`}
  ]}
]},
/* ---------------- 02 · IL METODO ---------------- */
{ num:'02', title:'Il metodo: diagonalizzare la perturbazione dentro il livello degenere', meta:'la derivazione di Sakurai con due proiettori · l equazione secolare e il suo nome · la somma delle radici · la procedura in quattro passi · la scatola cubica di Griffiths, dove il conto ingenuo sbaglia due livelli su tre',
  blocchi:[
  {t:'reveal', title:'La derivazione con i proiettori', tag:'costruzione', steps:[
   {label:'Separare il sottospazio degenere dal resto', body:R`
   <p>Sakurai organizza il conto in modo che la parte singolare resti isolata. Sia $D$ il sottospazio degenere di dimensione $g$, con energia imperturbata $E_{D}^{(0)}$, sia $P_{0}$ il <span class="str" data-str="proiettore-ortogonale">proiettore</span> su $D$ e $P_{1}=1-P_{0}$ il proiettore sul resto. L&rsquo;equazione di Schrödinger per uno stato perturbato $|l\rangle$ è</p>
   $$0=(E-H_{0}-\lambda V)|l\rangle=(E-E_{D}^{(0)}-\lambda V)P_{0}|l\rangle+(E-H_{0}-\lambda V)P_{1}|l\rangle,$$
   <p>dove si è usato che $H_{0}$ agisce su $D$ come il numero $E_{D}^{(0)}$. Proiettando a sinistra con $P_{0}$ e con $P_{1}$ si ottengono due equazioni accoppiate (5.2.3)-(5.2.4):</p>
   $$\big(E-E_{D}^{(0)}-\lambda P_{0}VP_{0}\big)P_{0}|l\rangle-\lambda P_{0}VP_{1}|l\rangle=0,$$
   $$-\lambda P_{1}VP_{0}|l\rangle+\big(E-H_{0}-\lambda P_{1}VP_{1}\big)P_{1}|l\rangle=0.$$`},
   {label:'Eliminare il resto', body:R`
   <p>La seconda si risolve per $P_{1}|l\rangle$, perché l&rsquo;operatore $E-H_{0}-\lambda P_{1}VP_{1}$, ristretto a $P_{1}$, non è singolare: <i>«E is close to $E_{D}^{(0)}$ and the eigenvalues of $P_{1}H_{0}P_{1}$ are all different from $E_{D}^{(0)}$»</i>. Sostituendo nella prima si ottiene un&rsquo;equazione per la sola parte nel sottospazio degenere (5.2.7):</p>
   $$\Big(E-E_{D}^{(0)}-\lambda P_{0}VP_{0}-\lambda^{2}P_{0}VP_{1}\frac{1}{E-H_{0}-\lambda V}P_{1}VP_{0}\Big)P_{0}|l\rangle=0.$$
   <p>È esatta. L&rsquo;operatore fra parentesi agisce solo su $D$, che ha dimensione finita, e il resto dello spazio vi compare solo attraverso il termine di ordine $\lambda^{2}$. Al primo ordine quel termine si trascura e resta</p>
   $$\big(E-E_{D}^{(0)}-\lambda P_{0}VP_{0}\big)P_{0}|l^{(0)}\rangle=0.$$
   <p>È un problema agli autovalori per la matrice $g\times g$ di $V$ ristretta al sottospazio degenere. Le correzioni al primo ordine sono gli autovalori di quella matrice, cioè le radici dell&rsquo;<b>equazione secolare</b></p>
   $$\det\big[V_{ab}-E^{(1)}\delta_{ab}\big]=0,\qquad a,b\in D,$$
   <p>e gli stati all&rsquo;ordine zero sono i suoi autovettori. Sakurai: <i>«by solving the eigenvalue problem, we obtain in one stroke both the first-order energy shifts and the correct zeroth-order eigenkets»</i>.</p>`}
  ]},
  {t:'prosa', title:'La stessa equazione in quattro libri, e quello che ciascuno ne dice', tag:'teorema', html:R`
  <p><b>Landau</b> la scrive come (39,2), $|V_{nn'}-E^{(1)}\delta_{nn'}|=0$, e spiega il nome in una nota: <i>«Denominazione mutuata dalla meccanica celeste»</i>. Nelle perturbazioni dei moti planetari, i termini che non oscillano e producono effetti cumulativi su tempi lunghi si chiamano secolari, e il problema analogo di trovare le combinazioni giuste delle orbite imperturbate porta allo stesso tipo di determinante. Landau ne trae due osservazioni. La prima: <i>«la somma delle sue radici è uguale alla somma degli elementi di matrice diagonali»</i>, perché è il coefficiente del termine di grado $s-1$ nell&rsquo;equazione. La perturbazione può separare il livello, ma il baricentro delle correzioni resta fisso. La seconda: <i>«Questa rimozione della degenerazione può essere completa o parziale»</i>.</p>
  <p><b>Dirac</b>, al paragrafo 43, arriva alla sua equazione [43.7] e la commenta così: <i>«i vari possibili valori per $a_{1}$ sono gli autovalori della matrice $\langle E'\beta'|V|E'\beta''\rangle$. Questa matrice è una parte del rappresentativo dell&rsquo;energia di perturbazione [...] e precisamente la parte consistente di quegli elementi che si riferiscono allo stesso livello energetico imperturbato $E'$ sia per la riga che per la colonna»</i>. E aggiunge un&rsquo;asimmetria importante: ciascuno stato stazionario del sistema perturbato si approssima a uno stato del sistema imperturbato, <i>«ma l&rsquo;inverso, cioè che ciascuno stato stazionario del sistema imperturbato si approssimi a uno stato stazionario del sistema perturbato, non è vero»</i>. Il problema di trovare le combinazioni giuste <i>«corrisponde al problema delle &ldquo;perturbazioni secolari&rdquo; della meccanica classica»</i>.</p>
  <p><b>Ballentine</b> la scrive come (10.92), $\sum_{r'}\langle n,s|H_{1}|n,r'\rangle c_{r,r'}=E_{n}^{(1)}c_{r,s}$, e ne dice l&rsquo;uso: una volta scelti come base gli autovettori di questa matrice, le formule non degeneri <i>«become usable because the diagonalization of (10.92) ensures that $\langle m|H_{1}|n\rangle=0$ whenever $\varepsilon_{n}-\varepsilon_{m}=0$. Thus the potentially troublesome terms in the perturbation formulas do not contribute»</i>.</p>
  <p><b>Picasso</b> non scrive l&rsquo;equazione come caso a parte. La decomposizione $H'=H'_{0}+H''$, dove $H'_{0}$ contiene i soli elementi fra stati con la stessa energia, tratta insieme il caso degenere e quello non degenere: si diagonalizza $H_{0}+H'_{0}$ blocco per blocco, e $H''$ non contribuisce al primo ordine. Picasso osserva poi un fatto sugli autovettori che vale ricordare: <i>«mentre gli autovalori approssimati di $H$ dipendono linearmente dagli elementi di matrice della perturbazione $H'$, gli autovettori approssimati sono indipendenti dalla perturbazione e sono ancora autovettori di $H_{0}$»</i>.</p>
  <p><b>Griffiths</b> scrive per esteso il caso doppio, con $W_{ij}=\langle\psi_{i}^{0}|H'|\psi_{j}^{0}\rangle$ (6.27):</p>
  $$E_{\pm}^{1}=\frac12\Big[W_{aa}+W_{bb}\pm\sqrt{(W_{aa}-W_{bb})^{2}+4|W_{ab}|^{2}}\Big],$$
  <p>e lo chiama <i>«the fundamental result of degenerate perturbation theory»</i>. È la formula del problema a due livelli, scritta per gli elementi di matrice della perturbazione invece che per la hamiltoniana intera.</p>`},
  {t:'prosa', title:'La procedura, in quattro passi', tag:'esame', html:R`
  <p>Sakurai la riassume così, ed è lo schema da seguire in ogni esercizio.</p>
  <p><b>1.</b> Identificare gli stati imperturbati degeneri e costruire la matrice $g\times g$ della perturbazione fra di essi.</p>
  <p><b>2.</b> Diagonalizzarla, risolvendo l&rsquo;equazione secolare.</p>
  <p><b>3.</b> Le radici sono le correzioni al primo ordine; gli autovettori sono gli stati all&rsquo;ordine zero, quelli verso cui gli stati perturbati tendono per $\lambda\to0$.</p>
  <p><b>4.</b> Per gli ordini superiori usare le formule non degeneri, escludendo dalle somme gli stati del sottospazio degenere.</p>
  <p>Sakurai aggiunge un limite: la procedura funziona se le radici dell&rsquo;equazione secolare sono tutte diverse. Se due coincidono, resta l&rsquo;ambiguità di prima dentro quel sottospazio più piccolo, e la pone come <i>«a challenge for the experts»</i>. La tappa 06 la affronta.</p>`},
  {t:'reveal', title:'Un esempio in cui il conto ingenuo sbaglia: la scatola cubica di Griffiths', tag:'esempio', steps:[
   {label:'Il problema', body:R`
   <p>Una particella in una scatola cubica di lato $a$ a pareti infinite. Gli stati sono prodotti di seni, $\psi_{n_{x}n_{y}n_{z}}$, con energie proporzionali a $n_{x}^{2}+n_{y}^{2}+n_{z}^{2}$. Il fondamentale $(1,1,1)$ non è degenere. Il primo eccitato è triplo, con gli stati $\psi_{a}=\psi_{112}$, $\psi_{b}=\psi_{121}$, $\psi_{c}=\psi_{211}$. La perturbazione di Griffiths alza il potenziale di $V_{0}$ in un quarto della scatola, $0\lt x\lt a/2$ e $0\lt y\lt a/2$, per ogni $z$.</p>
   <p>Per il fondamentale basta il caso non degenere: la correzione è $V_{0}$ per la probabilità di stare in quel quarto, che per simmetria è un quarto, $E^{1}=V_{0}/4$.</p>`},
   {label:'La matrice nel livello triplo', body:R`
   <p>Gli elementi diagonali sono tutti $V_{0}/4$, per la stessa ragione. Gli elementi fuori diagonale che coinvolgono $\psi_{a}=\psi_{112}$ sono nulli, perché l&rsquo;integrale in $z$ di $\sin(\pi z/a)\sin(2\pi z/a)$ su tutto il lato è zero: la perturbazione non dipende da $z$. Resta $W_{bc}$, che si fattorizza in tre integrali, e vale</p>
   $$W_{bc}=\frac{16}{9\pi^{2}}V_{0}.$$
   <p>Scrivendo $\kappa=(8/3\pi)^{2}\approx0{,}7205$, la matrice è $\tfrac{V_{0}}{4}$ per la matrice con $1$ sulla diagonale e $\kappa$ nelle posizioni $bc$ e $cb$, e i suoi autovalori sono</p>
   $$E^{1}=\frac{V_{0}}{4},\qquad\frac{V_{0}}{4}(1+\kappa),\qquad\frac{V_{0}}{4}(1-\kappa),$$
   <p>con gli stati $\psi_{a}$, $(\psi_{b}+\psi_{c})/\sqrt2$, $(\psi_{b}-\psi_{c})/\sqrt2$.</p>`},
   {label:'Che cosa avrebbe dato il conto ingenuo', body:R`
   <p>Applicando la formula non degenere a ciascuno dei tre stati di partenza si troverebbe $V_{0}/4$ per tutti e tre: nessuna separazione. Griffiths: <i>«Notice that if we had naively applied non-degenerate perturbation theory to this problem, we would have concluded that the first-order correction is the same for all three states, and equal to $V_{0}/4$ — which is actually correct only for the middle state»</i>. Le due combinazioni giuste hanno un significato geometrico: $(\psi_{b}+\psi_{c})/\sqrt2$ concentra la probabilità nel quarto rialzato e sale, $(\psi_{b}-\psi_{c})/\sqrt2$ la toglie da lì e scende. La somma delle tre correzioni è $3V_{0}/4$, come la traccia della matrice: il baricentro è rimasto dov&rsquo;era.</p>`}
  ]},
  {t:'plot', title:'La separazione del livello triplo nella scatola cubica',
   intro:R`<p>Le correzioni al primo ordine del primo eccitato in funzione dell&rsquo;intensità $\lambda$ della perturbazione, in unità di $V_{0}$: i tre livelli $\tfrac{\lambda}{4}(1+\kappa)$, $\tfrac{\lambda}{4}$, $\tfrac{\lambda}{4}(1-\kappa)$.</p>`,
   plots:[{kind:'func2d', xr:[0,1], yr:[0,0.5], height:250, ticks:true,
     title:'Griffiths, esempio 6.2: il livello triplo si separa in tre',
     curves:[{f:'x/4*(1+0.7205)', col:'#5aa9ff', width:2.4, label:'(psi_b+psi_c)/sqrt2'},
             {f:'x/4', col:'#ffb86b', width:2.4, label:'psi_a'},
             {f:'x/4*(1-0.7205)', col:'#6bdc9b', width:2.4, label:'(psi_b-psi_c)/sqrt2'}],
     xlabel:'lambda', ylabel:'E1 / V0'}],
   leggi:R`<p><b>Che cosa guardare.</b> Le tre rette partono dallo stesso punto e si allontanano linearmente in $\lambda$: è la firma del caso degenere, dove le correzioni cominciano al primo ordine e sono diverse fra loro. La retta centrale è quella che il conto ingenuo avrebbe dato per tutti e tre gli stati.</p>
   <p><b>Che cosa impararne.</b> La media delle tre pendenze è $\tfrac14$, la pendenza centrale: il baricentro del livello si sposta come il valor medio della perturbazione sul livello, cioè come un quarto di $V_{0}$, mentre la separazione dipende dagli elementi fuori diagonale. Il risultato ingenuo dà il baricentro giusto e la struttura sbagliata.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Nella derivazione di Sakurai il termine di ordine $\lambda^{2}$ è stato trascurato. Perché non cambia gli autovalori al primo ordine ma può cambiare gli stati al primo ordine?`,
    a:R`Perché, dopo aver diagonalizzato $P_{0}VP_{0}$, le correzioni all&rsquo;energia dentro il sottospazio sono separate di quantità di ordine $\lambda$. Il termine $\lambda^{2}$, trattato come perturbazione della matrice efficace, cambia gli autovalori di ordine $\lambda^{2}$, ma cambia gli stati di $\lambda^{2}$ diviso per le distanze fra gli autovalori, che sono di ordine $\lambda$: il risultato è di ordine $\lambda$. Sakurai lo dice così: <i>«although the third term in the effective Hamiltonian [...] is of order $\lambda^{2}$, it is divided by energy denominators of order $\lambda$ in forming the correction to the eigenvector»</i>.`},
   {q:R`Se la matrice della perturbazione nel sottospazio degenere è proporzionale all&rsquo;identità, che cosa succede?`,
    a:R`Tutte le radici dell&rsquo;equazione secolare coincidono: il livello si sposta in blocco di quel valore e resta degenere al primo ordine. Ogni base del sottospazio diagonalizza la perturbazione, e la questione di quale combinazione sia quella giusta resta aperta. La decidono gli ordini superiori, attraverso il termine di ordine $\lambda^{2}$ della hamiltoniana efficace, cioè gli accoppiamenti con i livelli lontani. È il caso della tappa 06.`}
  ]}
]},
/* ---------------- 03 · LA BASE BUONA ---------------- */
{ num:'03', title:'Indovinare la base buona: un operatore che commuta con tutti e due', meta:'il teorema di Griffiths e la sua dimostrazione in tre righe · la regola di Sakurai · l interazione spin orbita su un livello p, prima nella base sbagliata poi in quella giusta · la regola degli intervalli e il baricentro pesato',
  blocchi:[
  {t:'reveal', title:'Il teorema degli stati buoni', tag:'teorema', steps:[
   {label:'L’enunciato', body:R`
   <p>Diagonalizzare una matrice $g\times g$ è sempre possibile, ma spesso è inutile, perché la base giusta si può indovinare. Griffiths lo dice con un teorema. <i>Sia $A$ un operatore hermitiano che <span class="str" data-str="commutatore">commuta</span> con $H^{0}$ e con $H'$. Se $\psi_{a}^{0}$ e $\psi_{b}^{0}$, autofunzioni degeneri di $H^{0}$, sono anche autofunzioni di $A$ con autovalori distinti, $A\psi_{a}^{0}=\mu\psi_{a}^{0}$ e $A\psi_{b}^{0}=\nu\psi_{b}^{0}$ con $\mu\ne\nu$, allora $W_{ab}=0$, e $\psi_{a}^{0}$ e $\psi_{b}^{0}$ sono gli stati «buoni» da usare nella teoria delle perturbazioni.</i></p>`},
   {label:'La dimostrazione', body:R`
   <p>Si prende l&rsquo;elemento di matrice del commutatore, che è zero per ipotesi, e lo si apre facendo agire $A$ una volta a destra e una volta a sinistra:</p>
   $$0=\langle\psi_{a}^{0}|[A,H']|\psi_{b}^{0}\rangle=\langle A\psi_{a}^{0}|H'\psi_{b}^{0}\rangle-\langle\psi_{a}^{0}|H'A\psi_{b}^{0}\rangle=(\mu-\nu)W_{ab}.$$
   <p>Nel primo termine si è usata l&rsquo;<span class="str" data-str="operatore-aggiunto">hermiticità</span> di $A$ per spostarlo a sinistra, e il suo autovalore reale $\mu$. Siccome $\mu\ne\nu$, l&rsquo;elemento fuori diagonale è zero. Che $A$ commuti anche con $H^{0}$ serve a garantire che si possano scegliere autostati comuni di $H^{0}$ e $A$ dentro il livello.</p>
   <p>La morale di Griffiths: <i>«If you&rsquo;re faced with degenerate states, look around for some hermitian operator $A$ that commutes with $H^{0}$ and $H'$; pick as your unperturbed states ones that are simultaneously eigenfunctions of $H^{0}$ and $A$. Then use ordinary first-order perturbation theory»</i>. In pratica l&rsquo;operatore $A$ è quasi sempre il generatore di una <span class="str" data-str="simmetrie">simmetria</span> che sopravvive alla perturbazione: una rotazione attorno all&rsquo;asse di un campo, una riflessione, il momento angolare totale.</p>`},
   {label:'La regola di Sakurai, detta senza giri di parole', body:R`
   <p>Sakurai trasforma il teorema in un precetto, a proposito dell&rsquo;interazione spin-orbita: <i>«Remember the cardinal rule: Choose unperturbed kets that diagonalize the perturbation»</i>. E aggiunge, sulla base che non commuta con la perturbazione: <i>«You have to be either a fool or a masochist to use the $L_{z}$, $S_{z}$ eigenkets as the base kets for this problem; if we proceeded to apply blindly the method of degenerate perturbation theory starting with set 1 as our base kets, we would be forced to diagonalize the $V_{LS}$ matrix written in the $L_{z}$, $S_{z}$ representation. The results of this, after a lot of hard algebra, give us just the $J^{2}$, $J_{z}$ eigenkets»</i>. Il blocco successivo fa quel conto, per vedere che cosa costa e che cosa dà.</p>`}
  ]},
  {t:'reveal', title:'L’interazione spin-orbita su un livello p, nelle due basi', tag:'esempio', steps:[
   {label:'Il livello e la perturbazione', body:R`
   <p>Un elettrone in uno stato con $l=1$ e spin $s=\tfrac12$: il livello imperturbato è degenere sei volte, tre valori di $m_{l}$ per due valori di $m_{s}$. La perturbazione è $V=A\,\mathbf L\cdot\mathbf S$, con $A$ costante. $V$ non commuta né con $L_{z}$ né con $S_{z}$, ma commuta con $J_{z}=L_{z}+S_{z}$ e con $J^{2}$. Picasso, nel paragrafo 16.4, fa lo stesso ragionamento per un atomo qualunque: la parte relativistica della hamiltoniana <i>«commuta con $J$ e quindi, in particolare con $J_{z}$ e $J^{2}$, mentre invece non commuta né con $L_{z}$ né con $S_{z}$»</i>, e conclude che conviene <i>«senz&rsquo;altro»</i> la base del momento totale.</p>`},
   {label:'La via del masochista: la base di L_z e S_z', body:R`
   <p>Si usa almeno il teorema con $A=J_{z}$: la matrice di $V$ nella base $|m_{l},m_{s}\rangle$ è a blocchi, uno per ogni valore di $m_{j}=m_{l}+m_{s}$. I blocchi con $m_{j}=\pm\tfrac32$ hanno un solo stato, $|1,+\tfrac12\rangle$ e $|-1,-\tfrac12\rangle$, e lì $V$ è già diagonale. Scrivendo $\mathbf L\cdot\mathbf S=L_{z}S_{z}+\tfrac12(L_{+}S_{-}+L_{-}S_{+})$, sullo stato $|1,+\tfrac12\rangle$ il termine con gli operatori di salita e discesa dà zero e resta</p>
   $$\langle1,+\tfrac12|\mathbf L\cdot\mathbf S|1,+\tfrac12\rangle=\tfrac12\hbar^{2}.$$
   <p>Il blocco con $m_{j}=+\tfrac12$ contiene due stati, $|1,-\tfrac12\rangle$ e $|0,+\tfrac12\rangle$. Il termine diagonale $L_{z}S_{z}$ vale $-\tfrac12\hbar^{2}$ sul primo e $0$ sul secondo. Il termine $\tfrac12L_{+}S_{-}$ porta $|0,+\tfrac12\rangle$ in $|1,-\tfrac12\rangle$ con coefficiente $\tfrac12\cdot\sqrt2\hbar\cdot\hbar$. La matrice del blocco, in unità di $\hbar^{2}$, è</p>
   $$\begin{pmatrix}-\tfrac12&\tfrac{1}{\sqrt2}\\ \tfrac{1}{\sqrt2}&0\end{pmatrix},$$
   <p>con autovalori $\tfrac12$ e $-1$. Il blocco con $m_{j}=-\tfrac12$ è lo specchio di questo e dà gli stessi autovalori.</p>`},
   {label:'Il risultato, e la via diretta', body:R`
   <p>Raccogliendo: quattro stati con correzione $+\tfrac12A\hbar^{2}$ (i due dei blocchi esterni e uno per ciascun blocco interno) e due con $-A\hbar^{2}$. Sono i livelli $j=\tfrac32$ e $j=\tfrac12$, con le degenerazioni $2j+1=4$ e $2$. La via diretta è un&rsquo;identità: siccome $J^{2}=L^{2}+S^{2}+2\mathbf L\cdot\mathbf S$,</p>
   $$\mathbf L\cdot\mathbf S=\tfrac12\big(J^{2}-L^{2}-S^{2}\big),$$
   <p>e negli autostati di $J^{2}$, $L^{2}$, $S^{2}$ il valore è $\tfrac12\hbar^{2}[j(j+1)-l(l+1)-s(s+1)]$: per $l=1$, $s=\tfrac12$ si ha $\tfrac12\hbar^{2}$ per $j=\tfrac32$ e $-\hbar^{2}$ per $j=\tfrac12$. La via del masochista non era sbagliata. Ha rifatto, per un caso particolare, la diagonalizzazione che porta alla base del momento totale, e i suoi autovettori sono le combinazioni che si scrivono con i <span class="str" data-str="clebsch-gordan">coefficienti di Clebsch-Gordan</span>.</p>`},
   {label:'La regola degli intervalli e il baricentro', body:R`
   <p>Per $l$ qualunque la stessa identità dà le due correzioni, nella forma di Sakurai (5.3.20): $\tfrac{l}{2}\hbar^{2}$ per $j=l+\tfrac12$ e $-\tfrac{l+1}{2}\hbar^{2}$ per $j=l-\tfrac12$, moltiplicate per la costante radiale. La distanza fra i due livelli è proporzionale a $l+\tfrac12$, cioè al $j$ maggiore: è la regola degli intervalli di Landé. Il baricentro pesato con le degenerazioni resta fermo,</p>
   $$(2l+2)\,\frac{l}{2}+2l\Big(-\frac{l+1}{2}\Big)=0,$$
   <p>come vuole l&rsquo;osservazione di Landau sulla somma delle radici: la traccia di $\mathbf L\cdot\mathbf S$ su tutto il livello è nulla. Landau, al paragrafo 66, descrive la struttura fine di un atomo proprio così: sotto l&rsquo;azione della perturbazione relativistica <i>«un livello degenere con $L$ e $S$ dati si &lsquo;separa&rsquo; in più livelli diversi (vicini l&rsquo;uno all&rsquo;altro) che si differenziano per il valore del momento angolare totale $J$. Questi livelli sono determinati (in prima approssimazione) dall&rsquo;equazione secolare corrispondente»</i>.</p>`}
  ]},
  {t:'plot', title:'Le due correzioni spin-orbita in funzione di l',
   intro:R`<p>Le correzioni al primo ordine $\tfrac{l}{2}$ (blu, $j=l+\tfrac12$) e $-\tfrac{l+1}{2}$ (arancio, $j=l-\tfrac12$), in unità di $A\hbar^{2}$, al variare di $l$, e la loro distanza $l+\tfrac12$ (verde). Le curve sono continue per leggibilità; hanno senso ai valori interi di $l$.</p>`,
   plots:[{kind:'func2d', xr:[0,5], yr:[-3.2,5.7], height:260, ticks:true,
     title:'spin-orbita: j = l + 1/2, j = l - 1/2 e la loro distanza',
     curves:[{f:'x/2', col:'#5aa9ff', width:2.4, label:'j = l + 1/2'},
             {f:'-(x+1)/2', col:'#ffb86b', width:2.4, label:'j = l - 1/2'},
             {f:'x+0.5', col:'#6bdc9b', width:1.8, label:'distanza'}],
     xlabel:'l', ylabel:'correzione / (A hbar^2)'}],
   leggi:R`<p><b>Che cosa guardare.</b> Il livello con $j=l+\tfrac12$ sale e quello con $j=l-\tfrac12$ scende, e la loro distanza cresce linearmente con $l$. Per $l=0$ esiste solo $j=\tfrac12$, e la correzione è nulla: non c&rsquo;è momento orbitale con cui lo spin possa accoppiarsi.</p>
   <p><b>Che cosa impararne.</b> Il livello con più stati, $j=l+\tfrac12$, si sposta di meno di quello con meno stati: è la conseguenza del baricentro fermo. Chi ricorda il baricentro ricorda anche il rapporto fra i due spostamenti, $l$ contro $-(l+1)$, senza dover ricordare nessuna formula.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Un campo magnetico lungo $z$ aggiunge $\mu_{B}B(L_{z}+2S_{z})/\hbar$. Quale operatore commuta con questa perturbazione e con $H_{0}$, e quale base suggerisce?`,
    a:R`$L_{z}$ e $S_{z}$ separatamente, quindi anche $J_{z}$. Se la perturbazione è solo il campo, la base $|m_{l},m_{s}\rangle$ è quella buona e la perturbazione è già diagonale, con correzioni $\mu_{B}B(m_{l}+2m_{s})$. Se ci sono insieme campo e spin-orbita, il solo operatore che commuta con entrambi è $J_{z}$, e la matrice è a blocchi di $m_{j}$ ma non diagonale: è il caso intermedio della tappa 07.`},
   {q:R`Il teorema di Griffiths richiede autovalori <i>distinti</i> di $A$. Che cosa succede se due stati degeneri hanno lo stesso autovalore di $A$?`,
    a:R`Il teorema non dice niente sull&rsquo;elemento di matrice fra loro, che può essere diverso da zero. Bisogna cercare un altro operatore che li distingua, oppure diagonalizzare il blocco che hanno in comune. È quello che è successo con $J_{z}$ nell&rsquo;esempio: i due stati con $m_{j}=\tfrac12$ hanno lo stesso autovalore di $J_{z}$, e il blocco $2\times2$ andava diagonalizzato. Con $J^{2}$, che ha autovalori diversi su quei due stati, il blocco sarebbe stato già diagonale.`}
  ]}
]},
/* ---------------- 04 · TRE ESERCIZI D'ESAME ---------------- */
{ num:'04', title:'Tre esercizi d esame sui livelli degeneri', meta:'l oscillatore bidimensionale e due perturbazioni con lo stesso spettro, compito del 14 luglio 2021 · la particella sull anello e le onde stazionarie lungo le diagonali, compito del 15 luglio 2020 · lo spin orbita su un livello con lo spin già fissato, compito del 18 settembre 2017',
  blocchi:[
  {t:'reveal', title:'Esercizio 1: l’oscillatore bidimensionale, primo livello eccitato', tag:'esame', steps:[
   {label:'Il testo, e il livello', body:R`
   <p>Il compito del 14 luglio 2021 prende l&rsquo;oscillatore isotropo in due dimensioni e la perturbazione $\epsilon V$ con $V=\tfrac12 m\omega^{2}(x^{2}-y^{2})$, e chiede le correzioni al primo ordine per il fondamentale e il primo eccitato, discutendo la rimozione della degenerazione e confrontando con il risultato esatto. Il fondamentale è non degenere e ha correzione nulla al primo ordine. Il primo eccitato ha energia $2\hbar\omega$ ed è doppio, con gli stati $|1,0\rangle$ e $|0,1\rangle$ (un quanto lungo $x$ o lungo $y$).</p>`},
   {label:'La matrice, e l’operatore che la rende diagonale', body:R`
   <p>Sugli stati del livello, $\langle x^{2}\rangle$ vale $\tfrac{\hbar}{2m\omega}(2n_{x}+1)$, quindi gli elementi diagonali sono</p>
   $$\langle1,0|V|1,0\rangle=\frac{\hbar\omega}{2},\qquad\langle0,1|V|0,1\rangle=-\frac{\hbar\omega}{2}.$$
   <p>L&rsquo;elemento fuori diagonale $\langle1,0|V|0,1\rangle$ è nullo, perché $x^{2}$ e $y^{2}$ cambiano il numero di quanti di zero o di due, e i due stati differiscono di uno lungo ciascun asse. La matrice è già diagonale, e le correzioni sono $\pm\epsilon\hbar\omega/2$: la degenerazione è rimossa completamente. Il teorema degli stati buoni spiega perché non c&rsquo;era niente da diagonalizzare: la hamiltoniana dell&rsquo;oscillatore lungo $x$ da solo, $H_{x}$, commuta sia con $H_{0}$ sia con $V$, e i due stati hanno autovalori diversi di $H_{x}$.</p>
   <p>Il confronto con l&rsquo;esatto è immediato, perché la hamiltoniana perturbata è separabile con frequenze $\omega\sqrt{1\pm\epsilon}$. Per lo stato $|1,0\rangle$ l&rsquo;energia esatta è $\hbar\omega\big(\tfrac32\sqrt{1+\epsilon}+\tfrac12\sqrt{1-\epsilon}\big)$, e il suo sviluppo al primo ordine è</p>
   $$2\hbar\omega+\frac{\epsilon\hbar\omega}{2},$$
   <p>come previsto.</p>`},
   {label:'La stessa domanda con la perturbazione ruotata', body:R`
   <p>Il punto 1 dello stesso compito costruisce uno stato del livello con $\langle xy\rangle=\hbar/2m\omega$ e $\langle V\rangle=0$: è $(|1,0\rangle+|0,1\rangle)/\sqrt2$. Non è uno stato buono per $V$. È invece uno stato buono per una perturbazione diversa, $V'=m\omega^{2}xy$, che è $V$ ruotata di $45^{\circ}$: nelle coordinate $u=(x+y)/\sqrt2$, $v=(x-y)/\sqrt2$ si ha $xy=\tfrac12(u^{2}-v^{2})$. Per $V'$ gli elementi diagonali sono nulli e quello fuori diagonale vale</p>
   $$\langle1,0|m\omega^{2}xy|0,1\rangle=\frac{\hbar\omega}{2},$$
   <p>quindi la matrice è $\tfrac{\hbar\omega}{2}\sigma_{x}$, con autovalori $\pm\hbar\omega/2$ e stati buoni $(|1,0\rangle\pm|0,1\rangle)/\sqrt2$. <b>Stesso livello, stesse correzioni, basi diverse</b>: lo spettro esatto di $H_{0}+\epsilon V'$ è identico a quello di $H_{0}+\epsilon V$, perché i due problemi differiscono per una rotazione, ma la perturbazione sceglie la base orientata come lei.</p>`}
  ]},
  {t:'reveal', title:'Esercizio 2: la particella sull’anello', tag:'esame', steps:[
   {label:'Il testo, e i livelli', body:R`
   <p>Il compito del 15 luglio 2020 prende una particella di massa $M$ vincolata su una circonferenza di raggio $R$, senza potenziale, e aggiunge $V(\theta)=\lambda\sin\theta\cos\theta$, chiedendo le energie dei primi tre stati al primo ordine in $\lambda$. Gli autostati imperturbati sono $\psi_{k}=e^{ik\theta}/\sqrt{2\pi}$ con $E_{k}=\hbar^{2}k^{2}/2MR^{2}$, $k$ intero. Il fondamentale $k=0$ non è degenere; il primo eccitato è doppio, $k=\pm1$, perché la particella può girare nei due versi. Lo stesso problema compare in Griffiths come problema 6.9, con una perturbazione diversa.</p>`},
   {label:'Gli elementi di matrice', body:R`
   <p>Scrivendo $\sin\theta\cos\theta=\tfrac12\sin2\theta=\tfrac{1}{4i}(e^{2i\theta}-e^{-2i\theta})$ si vede che $V$ collega solo stati con $k$ che differiscono di $\pm2$. Quindi il fondamentale ha correzione nulla al primo ordine, $\langle0|V|0\rangle=0$, e nel livello $k=\pm1$ gli elementi diagonali sono nulli mentre quello fuori diagonale non lo è:</p>
   $$\langle1|V|-1\rangle=-\frac{i\lambda}{4}.$$
   <p>La matrice è $\tfrac{\lambda}{4}\sigma_{y}$, con autovalori $\pm\lambda/4$. Le energie dei primi tre stati al primo ordine sono quindi $0$, $E_{1}-\lambda/4$, $E_{1}+\lambda/4$.</p>`},
   {label:'Gli stati buoni, e perché sono quelli', body:R`
   <p>Gli autovettori, riscritti come funzioni reali, sono $(\cos\theta\pm\sin\theta)/\sqrt{2\pi}=\cos(\theta\mp\pi/4)/\sqrt{\pi}$: onde stazionarie con i ventri lungo le diagonali. Quella con il segno $+$ ha la densità concentrata dove $\sin2\theta=+1$, cioè dove la perturbazione è massima, e sale di $\lambda/4$; l&rsquo;altra la ha dove $\sin2\theta=-1$ e scende. Gli stati imperturbati $e^{\pm i\theta}$, che descrivono una particella che gira, hanno densità uniforme e non sentono la perturbazione al primo ordine: sono stati di momento angolare definito, e la perturbazione non conserva il momento angolare.</p>
   <p>L&rsquo;operatore del teorema di Griffiths è la riflessione $\theta\to\pi/2-\theta$, che scambia $x$ e $y$: lascia invariati $H_{0}$ e $\sin\theta\cos\theta$, e le due onde stazionarie sono una pari e una dispari rispetto a essa.</p>
   <p>Per il fondamentale, il primo effetto viene dal secondo ordine, attraverso gli stati $k=\pm2$: $E_{0}^{(2)}=-2\,|\lambda/4|^{2}/E_{2}=-\lambda^{2}MR^{2}/16\hbar^{2}$. Il compito non lo chiede, ma è il controllo che il secondo ordine sul fondamentale sia negativo.</p>`}
  ]},
  {t:'plot', title:'Le due onde stazionarie buone sull’anello',
   intro:R`<p>Le densità $|\psi|^{2}$ dei due stati buoni del livello $k=\pm1$ in funzione dell&rsquo;angolo, $(1\pm\sin2\theta)/2\pi$ (blu e arancio), e il profilo della perturbazione $\sin\theta\cos\theta$ (grigio, in scala). La densità degli stati $e^{\pm i\theta}$ è la costante $1/2\pi$ (verde).</p>`,
   plots:[{kind:'func2d', xr:[0,6.2832], yr:[-0.55,0.35], height:270, ticks:true,
     title:'stati buoni sull anello e perturbazione sin(theta)cos(theta)',
     curves:[{f:'(1+Math.sin(2*x))/(2*Math.PI)', col:'#5aa9ff', width:2.4, label:'(cos+sin)/sqrt(2pi): sale'},
             {f:'(1-Math.sin(2*x))/(2*Math.PI)', col:'#ffb86b', width:2.4, label:'(cos-sin)/sqrt(2pi): scende'},
             {f:'1/(2*Math.PI)', col:'#6bdc9b', width:1.6, label:'e^(+-i theta)'},
             {f:'0.5*Math.sin(x)*Math.cos(x)-0.25', col:'#6f7a90', width:1.4, label:'V (spostata)'}],
     xlabel:'theta', ylabel:''}],
   leggi:R`<p><b>Che cosa guardare.</b> La curva blu ha i massimi in $\theta=\pi/4$ e $5\pi/4$, dove la perturbazione grigia è massima, e i minimi dove è minima; la curva arancione fa il contrario. La curva verde è piatta, e il valor medio della perturbazione su di essa è zero.</p>
   <p><b>Che cosa impararne.</b> Su un livello degenere la perturbazione sceglie gli stati che si adattano meglio, o peggio, alla sua forma. Le energie al primo ordine sono il valor medio della perturbazione su quegli stati, ed è un conto di geometria prima che di algebra. Questo è il motivo per cui, nella parte b) dello stesso compito, le onde che girano e quelle stazionarie si comportano così diversamente.</p>`},
  {t:'reveal', title:'Esercizio 3: lo spin-orbita con lo spin già fissato', tag:'esame', steps:[
   {label:'Il testo', body:R`
   <p>Il compito del 18 settembre 2017 prende una particella di spin $\tfrac12$ in un oscillatore tridimensionale, con una hamiltoniana che nella base degli autostati di $S_{z}$ ha la forma di una matrice $2\times2$ con $H_{0}$ sulla diagonale e $\mp i\mu B$ fuori: è $H_{0}+\mu B\,\sigma_{y}$. Si chiede lo spostamento dello stato fondamentale e dei primi due eccitati quando si aggiunge la perturbazione $V=2\lambda\,\mathbf L\cdot\mathbf S$, con $0\lt\mu B\ll\hbar\omega$.</p>`},
   {label:'I livelli imperturbati', body:R`
   <p>Lo spin entra solo con $\sigma_{y}$, che commuta con $H_{0}$: i livelli sono $(n+\tfrac32)\hbar\omega\pm\mu B$, con lo spin lungo $\mp y$. Siccome $\mu B\ll\hbar\omega$, i tre livelli più bassi sono: il fondamentale $\tfrac32\hbar\omega-\mu B$ con $n=0$ e spin lungo $-y$; il primo eccitato $\tfrac32\hbar\omega+\mu B$ con $n=0$ e spin lungo $+y$; il secondo eccitato $\tfrac52\hbar\omega-\mu B$ con $n=1$, $l=1$, spin lungo $-y$, triplo per i tre valori di $m$.</p>`},
   {label:'Le correzioni', body:R`
   <p>Per i primi due livelli $l=0$, quindi $\mathbf L|\psi\rangle=0$ e la correzione è nulla. Per il terzo, lo spin è lo stesso in tutti e tre gli stati, $|\chi_{-y}\rangle$, e dentro il livello si può sostituire $\mathbf S$ con il suo valor medio su quello spinore, $\langle\chi_{-y}|\mathbf S|\chi_{-y}\rangle=-\tfrac{\hbar}{2}\hat y$:</p>
   $$\langle m,\chi_{-y}|2\lambda\,\mathbf L\cdot\mathbf S|m',\chi_{-y}\rangle=-\lambda\hbar\,\langle m|L_{y}|m'\rangle.$$
   <p>La perturbazione, ristretta al livello, è $-\lambda\hbar L_{y}$. I suoi autovalori sono $-\lambda\hbar$ per gli autovalori di $L_{y}$ su $l=1$, cioè $-\hbar,0,\hbar$: le correzioni sono $\lambda\hbar^{2}$, $0$, $-\lambda\hbar^{2}$, e il livello triplo si separa in tre. Gli stati buoni sono gli autostati di $L_{y}$, non di $L_{z}$: chi lavorasse nella base $|l=1,m\rangle$ con $m$ autovalore di $L_{z}$ dovrebbe diagonalizzare la matrice di $L_{y}$, cioè rifare a mano una rotazione.</p>
   <p><b>Un controllo di validità.</b> La perturbazione collega anche gli stati con spin lungo $-y$ a quelli con spin lungo $+y$ dello stesso $n$, che stanno $2\mu B$ più in alto. Il conto è corretto al primo ordine se $\lambda\hbar^{2}\ll2\mu B$; in caso contrario i due livelli con $n=1$ vanno trattati insieme come quasi degeneri.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Nell&rsquo;esercizio 1 la perturbazione $V$ e la perturbazione ruotata $V'$ danno le stesse correzioni sul primo eccitato. Danno le stesse correzioni anche sul secondo eccitato, che ha tre stati?`,
    a:R`Sì, per lo stesso argomento: $H_{0}+\epsilon V'$ si ottiene da $H_{0}+\epsilon V$ con una rotazione di $45^{\circ}$, che lascia invariato $H_{0}$, quindi gli spettri esatti coincidono, e con loro tutte le correzioni a ogni ordine. Cambiano solo gli stati buoni. Con $V$ sono $|2,0\rangle$, $|1,1\rangle$, $|0,2\rangle$ e le correzioni sono $\epsilon\hbar\omega$, $0$, $-\epsilon\hbar\omega$, cioè $\tfrac12\hbar\omega(n_{x}-n_{y})\epsilon$; con $V'$ sono le loro rotazioni.`},
   {q:R`Nell&rsquo;esercizio 3, perché si può sostituire $\mathbf S$ con il suo valor medio?`,
    a:R`Perché dentro il livello considerato tutti gli stati hanno lo stesso spinore, quindi ogni elemento di matrice $\langle m,\chi|L_{i}S_{i}|m',\chi\rangle$ si fattorizza in $\langle m|L_{i}|m'\rangle\langle\chi|S_{i}|\chi\rangle$. È un caso particolare di una regola più generale: al primo ordine, la perturbazione si sostituisce con la sua proiezione sul sottospazio degenere, e se in quel sottospazio un grado di libertà è congelato, l&rsquo;operatore che vi agisce si sostituisce con il suo valor medio. Landau usa la stessa idea per lo spin nel fattore di Landé, sostituendo $\mathbf S$ con la sua proiezione lungo $\mathbf J$.`}
  ]}
]},
/* ---------------- 05 · L'EFFETTO STARK LINEARE ---------------- */
{ num:'05', title:'L effetto Stark lineare: la degenerazione che fa comparire un dipolo', meta:'il livello n uguale 2 dell idrogeno e le tre regole di selezione di Picasso · il solo elemento che sopravvive e il suo segno, che dipende dalla convenzione · gli stati buoni hanno un dipolo permanente · la riga Lyman alfa che si divide in tre · il caso generale di Landau in coordinate paraboliche',
  blocchi:[
  {t:'prosa', title:'Perché qui il primo ordine non è zero', tag:'architettura', html:R`
  <p>Per il fondamentale dell&rsquo;idrogeno, in un campo elettrico uniforme, il primo ordine è nullo: la perturbazione $H'=e\mathcal Ez$ è dispari e lo stato ha parità definita. Il primo eccitato, $n=2$, ha quattro stati con la stessa energia, $|200\rangle$, $|211\rangle$, $|210\rangle$, $|21,-1\rangle$, e fra questi ci sono stati di parità opposta: il $2s$ è pari, i tre $2p$ sono dispari. Shankar mette in guardia contro la conclusione affrettata: <i>«Are we to conclude that there is no first-order shift because [...] by parity invariance, or equivalently, because the atom in these states has no intrinsic dipole moment? No, because these states need not provide the correct starting points for a perturbative calculation in view of the degeneracy»</i>. Gli stati imperturbati di partenza vanno scelti diagonalizzando la perturbazione nel livello, e combinazioni di stati di parità opposta possono avere un valor medio di $z$ diverso da zero.</p>
  <p>Picasso, al paragrafo 13.7, spiega perché questo accade quasi solo nell&rsquo;idrogeno: l&rsquo;esistenza di un effetto al primo ordine <i>«è legata all&rsquo;esistenza di stati imperturbati con la stessa energia ma diversa parità, cosa che si verifica nell&rsquo;idrogeno (dove c&rsquo;è la degenerazione su $l$) ma non in altri atomi, dove la complessità della hamiltoniana rimuove qualsiasi degenerazione che non sia imposta da ragioni di simmetria»</i>. Negli altri atomi l&rsquo;effetto Stark è quadratico, come nel fondamentale; nell&rsquo;idrogeno eccitato è lineare, ed è un effetto della degenerazione accidentale del potenziale coulombiano.</p>`},
  {t:'reveal', title:'La matrice quattro per quattro', tag:'costruzione', steps:[
   {label:'Gli elementi nulli, con tre regole di selezione', body:R`
   <p>Picasso calcola gli elementi di matrice $\langle2,l,m|z|2,l',m'\rangle$ eliminandone prima il più possibile. <b>Fra stati $s$</b>: $\langle200|z|200\rangle=0$, perché $z$ applicato a uno stato $s$ dà uno stato $p$. <b>Per parità</b>: $\langle21m|z|21m'\rangle=0$ per ogni $m,m'$, perché i tre stati $2p$ hanno tutti parità $-1$. <b>Su $L_{z}$</b>: $z$ commuta con $L_{z}$, quindi collega solo stati con lo stesso $m$, e $\langle200|z|21,\pm1\rangle=0$. Resta un solo elemento, insieme al suo complesso coniugato:</p>
   $$\langle200|z|210\rangle,$$
   <p>per il quale <i>«nessuna delle tre regole di selezione si applica»</i>. Picasso osserva che non se ne possono cercare altre: le regole usate si riferiscono ai numeri quantici che commutano con $H_{0}$, e <i>«esaurito l&rsquo;insieme dei numeri quantici che sappiamo attribuire a questi stati viene meno la possibilità di scoprire altre regole di selezione»</i>. Bisogna fare il conto.</p>`},
   {label:'Il conto, e una divergenza di segno fra i libri', body:R`
   <p>Con le funzioni radiali $R_{20}=\tfrac{1}{\sqrt2}a_{0}^{-3/2}\big(1-\tfrac{r}{2a_{0}}\big)e^{-r/2a_{0}}$ e $R_{21}=\tfrac{1}{\sqrt{24}}a_{0}^{-3/2}\tfrac{r}{a_{0}}e^{-r/2a_{0}}$, dove $a_{0}$ è il <span class="str" data-str="raggio-di-bohr">raggio di Bohr</span>, e le <span class="str" data-str="armoniche-sferiche">armoniche sferiche</span> $Y_{00}$ e $Y_{10}=\sqrt{3/4\pi}\cos\theta$, l&rsquo;integrale si separa in una parte radiale, $\int R_{20}R_{21}r^{3}dr=-3\sqrt3\,a_{0}$, e una angolare, $\int Y_{00}\cos\theta\,Y_{10}\,d\Omega=1/\sqrt3$. Il prodotto è</p>
   $$\langle200|z|210\rangle=-3a_{0}.$$
