   <p>Un fattore tre. I due integrali sono entrambi corretti, ma rispondono a due problemi diversi: nel secondo il potenziale è massimo al centro, nel primo è nullo.</p>`},
   {label:'Il controllo che avrebbe salvato il conto', body:R`
   <p>Un controllo di buon senso basta. La media spaziale di $\sin^{2}$ su tutta la buca è $\tfrac12$: se la particella fosse uniforme, la correzione sarebbe $\lambda/2$. Il fondamentale è concentrato dove $\sin^{2}$ è piccolo, quindi la correzione deve essere <i>minore</i> di $\lambda/2$, e $\lambda/4$ lo è, mentre $3\lambda/4$ no. <b>Prima di integrare, si guarda dove sta la particella e dove sta la perturbazione</b>: è lo stesso ragionamento della figura qui sopra, ed è più rapido di qualunque verifica algebrica.</p>`}
  ]},
  {t:'reveal', title:'Esercizio 3: un primo ordine che vale zero', tag:'esame', steps:[
   {label:'Il testo', body:R`
   <p>Il compito del 14 luglio 2021 prende un oscillatore isotropo in due dimensioni e aggiunge la perturbazione $\epsilon V$ con</p>
   $$V=\tfrac12 m\omega^{2}(x^{2}-y^{2}),$$
   <p>chiedendo le correzioni al primo ordine per il fondamentale e il primo eccitato, e il confronto con il risultato esatto. Il primo eccitato è doppiamente degenere e richiede il metodo del caso degenere. Il fondamentale $|0,0\rangle$ invece è non degenere, e si tratta qui.</p>`},
   {label:'Il primo ordine, e il risultato esatto', body:R`
   <p>Sul fondamentale $\langle x^{2}\rangle=\langle y^{2}\rangle=\hbar/2m\omega$ per simmetria, quindi</p>
   $$\langle0,0|V|0,0\rangle=0,$$
   <p>e il primo ordine è nullo. Il risultato esatto si ha senza perturbazioni: la hamiltoniana perturbata è la somma di due oscillatori indipendenti, con frequenze $\omega\sqrt{1+\epsilon}$ lungo $x$ e $\omega\sqrt{1-\epsilon}$ lungo $y$. L&rsquo;energia del fondamentale è la somma delle due energie di punto zero, e sviluppata dà</p>
   $$E_{0}(\epsilon)=\hbar\omega\Big(1-\frac{\epsilon^{2}}{8}\Big)+O(\epsilon^{4}).$$
   <p>Il termine lineare manca, come il primo ordine aveva previsto, e il primo effetto è quadratico e <b>negativo</b>. La tappa 06 lo riottiene con la formula del secondo ordine.</p>`},
   {label:'Che cosa insegna', body:R`
   <p>Un primo ordine nullo non vuol dire che la perturbazione non abbia effetto: vuol dire che l&rsquo;effetto comincia al secondo. È la situazione della tappa 01, dove la perturbazione aveva solo elementi fuori diagonale, ed è quella dell&rsquo;effetto Stark sul fondamentale di un atomo. Qui la ragione è una simmetria: la rotazione di $90^{\circ}$ scambia $x$ e $y$ e cambia segno a $V$, mentre lascia invariato il fondamentale. Il valor medio di un operatore che una simmetria dello stato cambia di segno è zero, lo stesso argomento della parità nella tappa 03.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Nell&rsquo;esercizio 1, perché tutti i livelli pari hanno esattamente la correzione $V_{0}/2$?`,
    a:R`Perché per $n$ pari la densità è $\tfrac{2}{L}\sin^{2}(n\pi x/L)$, e la regione $|x|\le L/4$ contiene un numero intero di semiperiodi di $\sin^{2}$: $n\pi x/L$ va da $-n\pi/4$ a $n\pi/4$, un intervallo di lunghezza $n\pi/2$, multiplo di $\pi$ quando $n$ è pari. Su un numero intero di semiperiodi la media di $\sin^{2}$ è esattamente $\tfrac12$. Per $n$ dispari l&rsquo;intervallo contiene un mezzo semiperiodo in più, ed è quel pezzo a dare la correzione $\pm1/(n\pi)$.`},
   {q:R`Nell&rsquo;esercizio 3 il primo ordine è zero per tutti i livelli dell&rsquo;oscillatore bidimensionale, o solo per il fondamentale?`,
    a:R`Per tutti gli stati della forma $|n,n\rangle$, con lo stesso numero di quanti lungo $x$ e lungo $y$, per la stessa simmetria di scambio. Per $|n_{x},n_{y}\rangle$ con $n_{x}\ne n_{y}$ invece $\langle V\rangle=\tfrac12\hbar\omega\,(n_{x}-n_{y})$, che non è nullo. Ma quegli stati appartengono a livelli degeneri, perché $|n_{x},n_{y}\rangle$ e $|n_{y},n_{x}\rangle$ hanno la stessa energia, e lì la formula non degenere non si può usare senza prima scegliere la base giusta nel livello.`}
  ]}
]},
/* ---------------- 05 · LA CORREZIONE ALLO STATO ---------------- */
{ num:'05', title:'La correzione allo stato, la sua norma, e la probabilità di restare dove si era', meta:'la perturbazione mescola gli stati imperturbati · la funzione d onda del gradino centrale corretta al primo ordine · la regola di selezione della parità · il fattore di rinormalizzazione di Sakurai e il suo significato · il controllo su due casi esatti',
  blocchi:[
  {t:'prosa', title:'Che cosa fa la perturbazione allo stato', tag:'architettura', html:R`
  <p>La tappa 02 ha dato i coefficienti della correzione al primo ordine. Rimessi insieme, Ballentine li scrive nella sua (10.68):</p>
  $$\lambda|\Psi_{n}^{(1)}\rangle=\sum_{m\ne n}|m\rangle\frac{\langle m|\lambda V|n\rangle}{\varepsilon_{n}-\varepsilon_{m}}.$$
  <p>Sakurai ne dà la lettura fisica: <i>«the $n$th level is no longer proportional to the unperturbed ket $|n^{(0)}\rangle$ but acquires components along other unperturbed energy kets; stated another way, the perturbation $V$ mixes various unperturbed energy eigenkets»</i>. La perturbazione <b>mescola</b>. Ogni stato $|m\rangle$ entra nella mescolanza con un peso che è il rapporto fra due cose: quanto la perturbazione lo collega a $|n\rangle$, cioè l&rsquo;elemento di matrice, e quanto è lontano in energia, cioè il denominatore. Gli stati vicini e ben collegati pesano molto, quelli lontani o non collegati poco o niente.</p>
  <p>Due conseguenze pratiche, prima del conto. La prima: se una simmetria dell&rsquo;hamiltoniana completa è anche simmetria di $H_{0}$, la perturbazione collega solo stati con lo stesso numero quantico di quella simmetria, e gli altri coefficienti sono nulli senza bisogno di calcolarli. La seconda: i denominatori cambiano segno a seconda che $|m\rangle$ stia sopra o sotto $|n\rangle$, quindi gli stati superiori e inferiori entrano con segni opposti a parità di elemento di matrice.</p>`},
  {t:'reveal', title:'Il gradino centrale: la funzione d’onda corretta', tag:'esame', steps:[
   {label:'Quali stati entrano', body:R`
   <p>Il compito del 30 giugno 2021 chiedeva anche la correzione al primo ordine dell&rsquo;autofunzione del fondamentale. La perturbazione $V_{0}$ su $|x|\le L/4$ è pari, e il fondamentale è pari, quindi entrano solo gli stati pari della buca: i coseni con $k=3,5,7,\dots$. I seni sono esclusi dalla parità, e non serve calcolarne nessuno. Per i coseni l&rsquo;elemento di matrice è</p>
   $$V_{k1}=V_{0}\frac{2}{L}\int_{-L/4}^{L/4}\cos\frac{\pi x}{L}\cos\frac{k\pi x}{L}\,dx,$$
   <p>e il coefficiente è $c_{k}=V_{k1}/(E_{1}-E_{k})=V_{k1}/\big((1-k^{2})\varepsilon_{1}\big)$.</p>`},
   {label:'I numeri', body:R`
   <p>Il primo integrale vale $V_{31}=V_{0}/\pi$, e con il denominatore $E_{1}-E_{3}=-8\varepsilon_{1}$ dà</p>
   $$c_{3}=-\frac{1}{8\pi}\frac{V_{0}}{\varepsilon_{1}}\approx-0{,}040\,\frac{V_{0}}{\varepsilon_{1}}.$$
   <p>I successivi sono molto più piccoli: $V_{51}=-V_{0}/3\pi$ e $c_{5}=\frac{1}{72\pi}\frac{V_{0}}{\varepsilon_{1}}$, poi $c_{7}=\frac{1}{144\pi}\frac{V_{0}}{\varepsilon_{1}}$, e così via. Decrescono come $1/k^{3}$, perché l&rsquo;elemento di matrice decresce come $1/k$ e il denominatore cresce come $k^{2}$. In pratica il primo termine basta, e la funzione d&rsquo;onda corretta è</p>
   $$\psi_{1}\simeq\sqrt{\tfrac{2}{L}}\Big[\cos\frac{\pi x}{L}-\frac{V_{0}}{8\pi\varepsilon_{1}}\cos\frac{3\pi x}{L}+\dots\Big].$$`},
   {label:'Che cosa fa, fisicamente', body:R`
   <p>Al centro, $x=0$, il coseno di $3\pi x/L$ vale uno, quindi la correzione <i>abbassa</i> la funzione d&rsquo;onda proprio dove sta il gradino. Ai bordi del gradino, $x=\pm L/4$, il coseno di $3\pi/4$ è negativo, e la correzione la <i>alza</i>. Il fondamentale si sposta dove il potenziale è più basso: lo stato si adatta alla perturbazione. È anche la ragione per cui la correzione all&rsquo;energia del secondo ordine sarà negativa: lo stato vero trova un compromesso migliore di quello imperturbato.</p>`}
  ]},
  {t:'plot', title:'Il fondamentale, prima e dopo il gradino',
   intro:R`<p>La funzione d&rsquo;onda del fondamentale (con $L=1$ e il fattore $\sqrt2$) imperturbata e corretta al primo ordine con i termini $k=3,5,7$, per $V_{0}=3\varepsilon_{1}$, e il profilo del gradino.</p>`,
   plots:[{kind:'func2d', xr:[-0.5,0.5], yr:[-0.05,1.6], height:280, ticks:true,
     title:'psi_1 imperturbata (blu) e corretta al primo ordine (arancio)',
     curves:[{f:'Math.sqrt(2)*Math.cos(Math.PI*x)', col:'#5aa9ff', width:2.4, label:'imperturbata'},
             {f:'Math.sqrt(2)*(Math.cos(Math.PI*x)-3*0.0397887*Math.cos(3*Math.PI*x)+3*0.0044210*Math.cos(5*Math.PI*x)+3*0.0022105*Math.cos(7*Math.PI*x))', col:'#ffb86b', width:2.4, label:'corretta, V0 = 3 eps1'},
             {f:'Math.abs(x)<=0.25?1.5:0', col:'#6f7a90', width:1.4, label:'gradino'}],
     xlabel:'x / L', ylabel:'psi'}],
   leggi:R`<p><b>Che cosa guardare.</b> La curva arancione è più bassa al centro e più alta ai fianchi della curva blu: la probabilità si è spostata dalla regione del gradino verso le regioni dove il potenziale è nullo. La differenza è piccola, circa il $10\%$ al centro, pur con un $V_{0}$ pari a tre volte l&rsquo;energia di punto zero della buca.</p>
   <p><b>Che cosa impararne.</b> La correzione allo stato è controllata dal rapporto $V_{0}/8\pi\varepsilon_{1}$, molto più piccolo di $V_{0}/\varepsilon_{1}$. Il fattore $8$ è la distanza fra i livelli che la parità lascia collegare, il fattore $\pi$ viene dall&rsquo;elemento di matrice. Un criterio di validità scritto come «$V_{0}$ piccolo rispetto a $\varepsilon_{1}$» sarebbe troppo prudente: il criterio corretto confronta elementi di matrice con differenze di energia, ed è quello che la serie ha costruito.</p>`},
  {t:'reveal', title:'La norma dello stato corretto, e che cosa significa', tag:'teorema', steps:[
   {label:'Rinormalizzare', body:R`
   <p>Con la normalizzazione intermedia $\langle n|\Psi_{n}\rangle=1$ lo stato corretto non ha norma uno. Sakurai (5.1.45)-(5.1.48) definisce lo stato normalizzato $|n\rangle_{N}=Z_{n}^{1/2}|\Psi_{n}\rangle$ e calcola il fattore. Siccome le correzioni sono ortogonali a $|n\rangle$, al secondo ordine</p>
   $$Z_{n}^{-1}=\langle\Psi_{n}|\Psi_{n}\rangle=1+\lambda^{2}\sum_{k\ne n}\frac{|V_{kn}|^{2}}{(\varepsilon_{n}-\varepsilon_{k})^{2}}+O(\lambda^{3}),$$
   <p>e quindi</p>
   $$Z_{n}\simeq1-\lambda^{2}\sum_{k\ne n}\frac{|V_{kn}|^{2}}{(\varepsilon_{n}-\varepsilon_{k})^{2}}.$$`},
   {label:'Il significato di Z', body:R`
   <p>Siccome $Z_{n}^{1/2}=\langle n|n\rangle_{N}$, il numero $Z_{n}$ è il modulo quadro della proiezione dello stato perturbato su quello imperturbato: <b>la probabilità di trovare il sistema perturbato nello stato imperturbato da cui proviene</b>. Sakurai legge il secondo termine come <i>«the probability for &ldquo;leakage&rdquo; to states other than $|n^{(0)}\rangle$»</i>, la probabilità di «fuga» verso gli altri stati. Nel gradino centrale, con i coefficienti appena trovati, la fuga, sommando i quattro termini $k=3,5,7,9$ che contano, è $\sum_{k}|c_{k}|^{2}\approx0{,}0016\,(V_{0}/\varepsilon_{1})^{2}$: con $V_{0}=3\varepsilon_{1}$, meno del $2\%$.</p>`},
   {label:'Una relazione inattesa, e un controllo', body:R`
   <p>Sakurai aggiunge un&rsquo;osservazione che chiama <i>«amusing»</i>: confrontando con la formula del secondo ordine, a quell&rsquo;ordine</p>
   $$Z_{n}=\frac{\partial E_{n}}{\partial\varepsilon_{n}},$$
   <p>dove la derivata si fa tenendo fissi gli elementi di matrice, e osserva che la relazione <i>«is actually quite general and not restricted to second-order perturbation theory»</i>. Si può controllare sul problema a due livelli della tappa 01, dove tutto è esatto. La derivata di $E_{+}$ rispetto a $E_{1}$ coincide, per ogni $\lambda$, con il peso di $|1\rangle$ nell&rsquo;autovettore esatto.</p>
   <p>Il secondo controllo è l&rsquo;oscillatore con la molla cambiata. L&rsquo;unico elemento di matrice che collega il fondamentale è $\langle2|V|0\rangle=\sqrt2\,\varepsilon\hbar\omega/4$, con denominatore $-2\hbar\omega$, quindi</p>
   $$Z_{0}=1-\frac{\varepsilon^{2}}{32}.$$
   <p>Il calcolo esatto è un <span class="str" data-str="integrale-gaussiano">integrale gaussiano</span>: il fondamentale perturbato è una gaussiana di larghezza $x_{0}(1+\varepsilon)^{-1/4}$, e il modulo quadro della sua sovrapposizione con quella imperturbata, sviluppato in $\varepsilon$, dà lo stesso risultato, $1-\varepsilon^{2}/32$. Sakurai nota anche la ragione per cui manca la componente lungo il primo eccitato: <i>«our total $H$ is invariant under parity; hence, an energy eigenstate is expected to be a parity eigenstate»</i>.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Perché nella correzione allo stato i livelli superiori e quelli inferiori entrano con segno opposto, e che effetto ha sul fondamentale?`,
    a:R`Il denominatore è $\varepsilon_{n}-\varepsilon_{m}$: negativo per $m$ sopra $n$, positivo per $m$ sotto. Il fondamentale non ha stati sotto di sé, quindi tutti i denominatori sono negativi, e ogni stato entra con il segno opposto a quello del proprio elemento di matrice. Questo ha una conseguenza sull&rsquo;energia: il secondo ordine è $\langle n|V|\Psi^{(1)}\rangle$, cioè la somma degli elementi di matrice per i coefficienti, e se i coefficienti hanno segno opposto agli elementi di matrice ogni termine è negativo. È l&rsquo;argomento della tappa 06, visto dal lato dello stato.`},
   {q:R`Il fattore $Z_{n}$ è minore di uno. Può accadere che diventi negativo, e che cosa vorrebbe dire?`,
    a:R`Nella formula troncata può, se la somma supera uno; nella realtà no, perché $Z_{n}$ è un modulo quadro. Se la formula al secondo ordine dà un $Z_{n}$ lontano da uno, lo stato perturbato non assomiglia più a quello imperturbato e il presupposto stesso del metodo è caduto: l&rsquo;etichetta $n$ presa in prestito, nel linguaggio di Dirac, non è più legittima. È un criterio di validità che si legge sullo stato invece che sull&rsquo;energia, e in genere è più severo.`}
  ]}
]},
/* ---------------- 06 · IL SECONDO ORDINE ---------------- */
{ num:'06', title:'Il secondo ordine: il segno sul fondamentale, i livelli che si respingono, e quelli che non si incrociano', meta:'la formula e il cambio di segno di Picasso · perché sul fondamentale è sempre negativo · la repulsione a coppie · il teorema di non incrocio di Wigner e von Neumann · l oscillatore deformato rifatto al secondo ordine',
  blocchi:[
  {t:'prosa', title:'La formula, scritta come la scrive Picasso', tag:'architettura', html:R`
  <p>La tappa 02 ha dato il secondo ordine come conseguenza della formula generale $E^{(2)}_{n}=\langle n|V|\Psi^{(1)}_{n}\rangle$. Picasso lo ricava in un altro modo, derivando due volte rispetto al parametro l&rsquo;equazione agli autovalori (12.22), e lo scrive con il segno cambiato al denominatore:</p>
  $$\Delta E_{n}^{(2)}=-\sum_{k\ne n}\frac{|\langle k|V|n\rangle|^{2}}{E_{k}^{0}-E_{n}^{0}}.$$
  <p>È la stessa formula, con $E_{k}^{0}-E_{n}^{0}$ al posto di $E_{n}^{0}-E_{k}^{0}$ e un meno davanti. Picasso spiega la scelta: <i>«Il segno $-$ mette in evidenza che il contributo del secondo ordine all&rsquo;energia dello stato fondamentale è sempre negativo»</i>. Scritta così, ogni frazione è positiva per gli stati $k$ che stanno sopra $n$ e negativa per quelli che stanno sotto, e il segno del contributo si legge a colpo d&rsquo;occhio. Ballentine fa la stessa operazione nel suo esempio sulla polarizzabilità: <i>«The minus sign comes from reversing the sign of the denominator in order to make it positive»</i>.</p>
  <p>Picasso aggiunge un&rsquo;osservazione sugli ordini che vale tenere presente negli esercizi. Se la perturbazione contiene un parametro fisico, come la carica per il campo nell&rsquo;effetto Stark, la formula (12.25) scritta con le energie già corrette al primo ordine al denominatore contiene anche termini di ordine superiore al secondo, e <i>«non significativi»</i>. Il secondo ordine vero si ottiene con le energie imperturbate al denominatore: è la (12.26).</p>`},
  {t:'reveal', title:'Tre conseguenze della formula', tag:'teorema', steps:[
   {label:'Sul fondamentale il secondo ordine è sempre negativo', body:R`
   <p>Se $n$ è il fondamentale, ogni altro stato sta sopra, ogni denominatore $E_{k}^{0}-E_{0}^{0}$ è positivo, ogni numeratore è un modulo quadro: la somma è positiva e il meno davanti la rende negativa. Le tre fonti lo enunciano tutte. Landau: <i>«Osserviamo che la correzione del secondo ordine alla energia dello stato fondamentale è sempre negativa»</i>. Sakurai: <i>«the lowest state tends to get even lower as a result of mixing»</i>.</p>
   <p>C&rsquo;è anche una ragione che non passa per la formula. Il primo ordine $E^{(0)}+E^{(1)}$ è il valor medio di $H$ sullo stato imperturbato $|0\rangle$. Il fondamentale vero di $H$ ha l&rsquo;energia più bassa possibile fra tutti i valori medi di $H$ su stati normalizzati, quindi non può stare sopra quel valor medio. Le correzioni successive possono solo abbassarlo. La tappa 03 lo ha già visto sull&rsquo;oscillatore con la molla cambiata, dove la curva esatta stava sempre sotto la retta tangente.</p>`},
   {label:'I livelli si respingono, a coppie', body:R`
   <p>Si prendano due livelli $i$ e $j$ collegati da un elemento di matrice $V_{ij}$, con $E_{i}^{0}\lt E_{j}^{0}$. Nella formula del secondo ordine per $i$ il termine $k=j$ vale $-|V_{ij}|^{2}/(E_{j}^{0}-E_{i}^{0})$, che abbassa $i$. Nella formula per $j$ il termine $k=i$ vale $+|V_{ij}|^{2}/(E_{j}^{0}-E_{i}^{0})$, che alza $j$ della stessa quantità. Sakurai: <i>«two energy levels, say the $i$th level and the $j$th level, when connected by $V_{ij}$ tend to repel each other»</i>. Picasso dice la stessa cosa con il linguaggio dei contributi: l&rsquo;effetto al secondo ordine su un livello <i>«è negativo da parte dei livelli superiori ed è positivo da parte di quelli inferiori: si dice che i livelli &lsquo;si respingono&rsquo;»</i>.</p>
   <p>Una conseguenza quantitativa è che la somma delle correzioni del secondo ordine su tutti i livelli è zero, perché ogni coppia contribuisce con due termini uguali e opposti. In un sistema con un numero finito di stati questo è un fatto esatto per la traccia: la somma degli autovalori di $H_{0}+\lambda V$ è la traccia, che dipende da $\lambda$ solo linearmente. Il secondo ordine non può cambiarla.</p>`},
   {label:'Il teorema di non incrocio', body:R`
   <p>Sakurai chiama la repulsione <i>«a special case of the no-level-crossing theorem, which states that a pair of energy levels connected by perturbation do not cross as the strength of the perturbation is varied»</i>. Picasso ne dà la dimostrazione nel paragrafo 16.6, attribuendola a Wigner e von Neumann: <i>«i livelli con la stessa simmetria non si incrociano (no-crossing theorem)»</i>. L&rsquo;argomento è un conteggio. Perché due autovalori di $H(\lambda)=H_{0}+\lambda V$ coincidano a un certo $\lambda$, il blocco $2\times2$ che li rappresenta deve essere un multiplo dell&rsquo;identità. Questo chiede tre condizioni reali: i due elementi diagonali uguali, e l&rsquo;elemento fuori diagonale nullo nella sua parte reale e in quella immaginaria. Con un solo parametro $\lambda$ a disposizione, tre condizioni non si soddisfano in generale.</p>
   <p>Fa eccezione il caso in cui l&rsquo;elemento fuori diagonale è nullo per ogni $\lambda$, cioè quando i due stati hanno simmetria diversa rispetto a un operatore che commuta con $H(\lambda)$. Allora resta una sola condizione, e i livelli si incrociano a un $\lambda$ preciso. Picasso parla in questo caso di <i>«degenerazione accidentale»</i>. Nel problema a due livelli della tappa 01 la distanza fra gli autovalori esatti è $E_{+}-E_{-}=\sqrt{\Delta^{2}+4\lambda^{2}|V|^{2}}$, che resta sempre almeno $2\lambda|V|$, anche quando $\Delta$ va a zero. Questo è il non incrocio, visto nel caso più semplice.</p>`}
  ]},
  {t:'plot', title:'Due livelli che si avvicinano e non si toccano',
   intro:R`<p>Due livelli imperturbati che si incrociano linearmente in un parametro esterno $s$, $E_{1}^{0}=s$ e $E_{2}^{0}=-s$, accoppiati da un elemento di matrice costante $V=0{,}3$. In grigio i livelli imperturbati, in blu e arancione gli autovalori esatti $\pm\sqrt{s^{2}+V^{2}}$.</p>`,
   plots:[{kind:'func2d', xr:[-1.5,1.5], yr:[-1.6,1.6], height:290, ticks:true,
     title:'incrocio evitato: autovalori esatti contro livelli imperturbati',
     curves:[{f:'x', col:'#6f7a90', width:1.2, label:'E1 imperturbato'},
             {f:'-x', col:'#6f7a90', width:1.2, label:'E2 imperturbato'},
             {f:'Math.sqrt(x*x+0.09)', col:'#5aa9ff', width:2.6, label:'E+ esatto'},
             {f:'-Math.sqrt(x*x+0.09)', col:'#ffb86b', width:2.6, label:'E- esatto'}],
     xlabel:'s', ylabel:'E'}],
   leggi:R`<p><b>Che cosa guardare.</b> Lontano da $s=0$ gli autovalori esatti seguono le rette imperturbate, e la differenza è quella del secondo ordine: $\sqrt{s^{2}+V^{2}}\simeq|s|+V^{2}/2|s|$, lo spostamento verso l&rsquo;esterno della formula di Picasso. Vicino a $s=0$ le rette si incrociano, gli autovalori no: restano separati da $2V=0{,}6$. Chi segue un livello lungo la curva blu passa con continuità da «essere» $E_{2}^{0}$ a sinistra a «essere» $E_{1}^{0}$ a destra: gli stati si scambiano il carattere.</p>
   <p><b>Che cosa impararne.</b> Nella regione $|s|\lesssim V$ la teoria non degenere è inutilizzabile: il denominatore $2|s|$ va a zero e la correzione diverge, mentre l&rsquo;autovalore esatto è finito. È la situazione che Picasso chiama dei livelli quasi degeneri, e che la tappa 09 tratta. Fuori da quella regione la serie funziona, e la figura dice quanto è largo il «fuori»: qualche volta $V$.</p>`},
  {t:'reveal', title:'Il controllo: l’oscillatore deformato al secondo ordine', tag:'esempio', steps:[
   {label:'Gli elementi di matrice che contano', body:R`
   <p>Nell&rsquo;esercizio 3 della tappa 04 il primo ordine era nullo, e il risultato esatto dava $-\epsilon^{2}\hbar\omega/8$. Lo si riottiene con la formula. La perturbazione $\tfrac12 m\omega^{2}(x^{2}-y^{2})$ collega il fondamentale $|0,0\rangle$ solo a $|2,0\rangle$ e $|0,2\rangle$, attraverso $\langle2|x^{2}|0\rangle=\sqrt2\,\hbar/2m\omega$. I due elementi di matrice sono</p>
   $$\langle2,0|V|0,0\rangle=\frac{\sqrt2}{4}\hbar\omega,\qquad\langle0,2|V|0,0\rangle=-\frac{\sqrt2}{4}\hbar\omega,$$
   <p>entrambi con denominatore $E_{0}^{0}-E_{2}^{0}=-2\hbar\omega$.</p>`},
   {label:'La somma', body:R`
   <p>La formula del secondo ordine, moltiplicata per $\epsilon^{2}$, dà</p>
   $$E^{(2)}=\epsilon^{2}\frac{2\cdot\tfrac{2}{16}\hbar^{2}\omega^{2}}{-2\hbar\omega}=-\frac{\epsilon^{2}}{8}\hbar\omega,$$
   <p>esattamente il coefficiente dello sviluppo della soluzione esatta. I segni opposti dei due elementi di matrice non contano, perché entrano al quadrato: lungo $x$ la molla si irrigidisce e lungo $y$ si ammorbidisce, ma entrambe le deformazioni abbassano l&rsquo;energia al secondo ordine. È la convessità della radice, $\sqrt{1+\epsilon}+\sqrt{1-\epsilon}\lt2$, letta come un teorema sul segno.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Il secondo ordine sul livello più alto di un sistema con un numero finito di stati ha un segno definito?`,
    a:R`Sì, positivo: tutti gli altri stati stanno sotto, ogni contributo è positivo, e il livello più alto viene spinto ancora più su. È il simmetrico dell&rsquo;argomento per il fondamentale, e vale solo se lo spettro è limitato superiormente, il che in meccanica quantistica accade solo con un numero finito di stati, come per lo spin. Per un oscillatore o un atomo non esiste un livello più alto, e solo l&rsquo;argomento sul fondamentale resta valido.`},
   {q:R`Due livelli dell&rsquo;idrogeno con $m$ diverso possono incrociarsi al variare di un campo magnetico lungo $z$? E due con lo stesso $m$?`,
    a:R`Con $m$ diverso sì: la hamiltoniana commuta con $L_{z}$ per ogni valore del campo, quindi gli elementi di matrice fra stati con $m$ diverso sono nulli e l&rsquo;incrocio richiede una sola condizione. Picasso lo mostra nella sua figura 16.4, dove la linea con $m=-3/2$ incrocia linee con $m=\pm1/2$. Con lo stesso $m$ no, salvo coincidenze: le linee con lo stesso $m$ si avvicinano e si respingono. È il criterio con cui si legge qualunque diagramma di livelli in funzione di un parametro.`}
  ]}
]},
/* ---------------- 07 · DUE PROBLEMI ESATTI COME BANCO DI PROVA ---------------- */
{ num:'07', title:'Due problemi esatti come banco di prova della serie', meta:'l oscillatore con una forza costante, esatto al secondo ordine · lo stato fondamentale che trasla, e il coefficiente che lo riproduce · l oscillatore con la molla cambiata, ordine per ordine fino al terzo',
  blocchi:[
  {t:'prosa', title:'Perché risolvere con le perturbazioni un problema che si sa risolvere', tag:'architettura', html:R`
  <p>Ballentine e Sakurai fanno la stessa scelta, e la dichiarano quasi con le stesse parole. Ballentine, prima del suo primo esempio: <i>«This problem can be solved exactly [...] Solving this problem by perturbation theory will only serve to illustrate the technique»</i>. Sakurai, come si è visto alla tappa 03, chiama il suo <i>«the silliest problem in the world to which to apply perturbation theory»</i>. Il valore di un problema esatto è che permette di controllare ogni coefficiente della serie, non solo il primo, e di vedere che cosa la serie riproduce oltre all&rsquo;energia: lo stato. È il controllo che in un problema vero non si può fare, e che rende credibili i conti fatti dopo.</p>`},
  {t:'reveal', title:'L’oscillatore con una forza costante', tag:'esempio', steps:[
   {label:'Il problema esatto', body:R`
   <p>Ballentine prende $H_{0}=P^{2}/2M+\tfrac12 M\omega^{2}Q^{2}$ e la perturbazione lineare $H_{1}=bQ$, che è l&rsquo;energia di un oscillatore carico in un campo elettrico uniforme. Completando il quadrato (10.71),</p>
   $$H=\frac{P^{2}}{2M}+\frac12 M\omega^{2}\Big(Q+\frac{b}{M\omega^{2}}\Big)^{2}-\frac{b^{2}}{2M\omega^{2}},$$
   <p>e il potenziale è la stessa parabola, traslata di $-b/M\omega^{2}$ e abbassata di $b^{2}/2M\omega^{2}$. Gli autovalori sono quelli di prima meno questa costante, per ogni $n$.</p>`},
   {label:'La serie', body:R`
   <p>Gli unici elementi di matrice non nulli di $Q$ sono quelli fra livelli adiacenti, $\langle n|Q|n+1\rangle=\sqrt{\hbar/2M\omega}\,\sqrt{n+1}$ e $\langle n|Q|n-1\rangle=\sqrt{\hbar/2M\omega}\,\sqrt{n}$. Il primo ordine è $b\langle n|Q|n\rangle=0$. Il secondo ordine ha due termini, uno dal livello sotto e uno dal livello sopra:</p>
   $$E_{n}^{(2)}=\frac{b^{2}|\langle n|Q|n-1\rangle|^{2}}{\hbar\omega}+\frac{b^{2}|\langle n|Q|n+1\rangle|^{2}}{-\hbar\omega}=-\frac{b^{2}}{2M\omega^{2}},$$
   <p>che Ballentine commenta con tre parole: <i>«which is the exact answer»</i>. Vale la pena guardare <i>come</i> la dipendenza da $n$ sparisce. Il livello di sotto spinge in su con peso $n$, il livello di sopra spinge in giù con peso $n+1$, e la differenza dei pesi è uno per ogni $n$. È la repulsione della tappa 06 al lavoro, e il conto mostra che i due contributi si compensano quasi del tutto.</p>
   <p>Se il secondo ordine è già il risultato esatto, tutti gli ordini successivi devono essere nulli. Il terzo lo è per una ragione di conteggio: ogni termine del terzo ordine contiene tre elementi di matrice di $Q$, cioè tre salti di un livello, e tre salti di $\pm1$ non possono tornare al livello di partenza.</p>`},
   {label:'Lo stato: la serie trasla la gaussiana', body:R`
   <p>Il fondamentale esatto è la gaussiana del fondamentale traslata in $Q_{0}=-b/M\omega^{2}$. La serie al primo ordine dà invece $|0\rangle+c_{1}|1\rangle$, con un solo coefficiente perché $Q$ collega $|0\rangle$ solo a $|1\rangle$:</p>
   $$c_{1}=\frac{b\,\langle1|Q|0\rangle}{E_{0}-E_{1}}=-\frac{b}{\sqrt{2\hbar M\omega^{3}}}.$$
   <p>In unità $\hbar=M=\omega=1$ la funzione d&rsquo;onda corretta è $\pi^{-1/4}e^{-x^{2}/2}(1-bx)$, che è esattamente lo sviluppo al primo ordine in $b$ della gaussiana traslata $\pi^{-1/4}e^{-(x+b)^{2}/2}$. <b>Una traslazione piccola è, al primo ordine, l&rsquo;aggiunta di un pezzo di primo eccitato</b>, perché il primo eccitato è proporzionale alla derivata della gaussiana. La figura qui sotto mostra fin dove regge.</p>`}
  ]},
  {t:'plot', title:'La gaussiana traslata e la sua approssimazione al primo ordine',
   intro:R`<p>In unità $\hbar=M=\omega=1$, con $b=0{,}4$: il fondamentale imperturbato (grigio), quello esatto traslato in $x=-b$ (blu), e la correzione al primo ordine $\pi^{-1/4}e^{-x^{2}/2}(1-bx)$ (arancio).</p>`,
   plots:[{kind:'func2d', xr:[-3.5,3.5], yr:[-0.15,0.85], height:280, ticks:true,
     title:'psi_0 imperturbata, esatta e al primo ordine, b = 0.4',
     curves:[{f:'Math.pow(Math.PI,-0.25)*Math.exp(-x*x/2)', col:'#6f7a90', width:1.4, label:'imperturbata'},
             {f:'Math.pow(Math.PI,-0.25)*Math.exp(-(x+0.4)*(x+0.4)/2)', col:'#5aa9ff', width:2.6, label:'esatta, traslata'},
             {f:'Math.pow(Math.PI,-0.25)*Math.exp(-x*x/2)*(1-0.4*x)', col:'#ffb86b', width:2.0, label:'primo ordine'}],
     xlabel:'x', ylabel:'psi'}],
   leggi:R`<p><b>Che cosa guardare.</b> Vicino al massimo la curva arancione segue bene quella blu: il massimo si sposta verso sinistra della quantità giusta. Sulla coda destra, per $x\gt1/b=2{,}5$, il fattore $1-bx$ diventa negativo e la curva arancione scende sotto zero, cosa che la gaussiana esatta non fa mai. La correzione al primo ordine non conserva la positività, perché è un troncamento di una serie, non una funzione d&rsquo;onda di un problema vero.</p>
   <p><b>Che cosa impararne.</b> Il criterio della tappa 02 chiedeva $|c_{1}|\ll1$, cioè $b\ll\sqrt{2\hbar M\omega^{3}}$: la traslazione deve essere piccola rispetto alla larghezza della gaussiana. Con $b=0{,}4$ in queste unità la traslazione è il $40\%$ della larghezza, e l&rsquo;approssimazione è già visibilmente imperfetta sulle code, dove pesa poco nelle medie.</p>`},
  {t:'reveal', title:'L’oscillatore con la molla cambiata, fino al terzo ordine', tag:'esempio', steps:[
   {label:'Gli elementi di matrice', body:R`
   <p>Per il $V=\tfrac12\varepsilon m\omega^{2}x^{2}$ di Sakurai il fondamentale è collegato solo a sé stesso e al secondo eccitato. Scrivendo $x^{2}$ con gli operatori di salita e discesa, gli elementi di matrice che servono sono</p>
   $$V_{00}=\frac{\varepsilon\hbar\omega}{4},\qquad V_{20}=\frac{\sqrt2}{4}\varepsilon\hbar\omega,\qquad V_{22}=\frac{5}{4}\varepsilon\hbar\omega,$$
   <p>e $V_{40}=0$. Il primo ordine è $V_{00}$, il secondo è $|V_{20}|^{2}/(-2\hbar\omega)$, e insieme danno la (5.1.55b) di Sakurai:</p>
   $$\Delta_{0}=\hbar\omega\Big(\frac{\varepsilon}{4}-\frac{\varepsilon^{2}}{16}\Big)+O(\varepsilon^{3}).$$`},
   {label:'Il terzo ordine, con la formula della tappa 02', body:R`
   <p>Nella formula del terzo ordine la somma doppia ha un solo termine, $k=m=2$, e il termine con l&rsquo;elemento diagonale ha un solo addendo. Raccogliendo,</p>
   $$E_{0}^{(3)}=\frac{|V_{20}|^{2}}{(2\hbar\omega)^{2}}\big(V_{22}-V_{00}\big)=\frac{\varepsilon^{3}}{32}\hbar\omega.$$
   <p>Lo sviluppo esatto, $\tfrac12\hbar\omega\big(\sqrt{1+\varepsilon}-1\big)=\hbar\omega\big(\tfrac{\varepsilon}{4}-\tfrac{\varepsilon^{2}}{16}+\tfrac{\varepsilon^{3}}{32}-\dots\big)$, ha lo stesso coefficiente. La formula del terzo ordine, controllata alla tappa 02 su una matrice numerica, regge anche qui, dove gli elementi di matrice vengono dalla fisica e non sono stati scelti a caso. Il segno del terzo ordine è positivo: dopo il secondo ordine, che abbassa, il terzo riporta un po&rsquo; in su. È l&rsquo;alternanza di segni che si era vista alla tappa 01.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Nell&rsquo;oscillatore con la forza costante il secondo ordine non dipende da $n$. Che cosa vuol dire fisicamente?`,
    a:R`Che tutti i livelli si spostano della stessa quantità, quindi le differenze fra livelli, cioè le frequenze di transizione, non cambiano: un oscillatore carico in un campo elettrico uniforme emette alla stessa frequenza di prima. La forza costante sposta il punto di equilibrio e abbassa l&rsquo;energia di tutto lo spettro, ma non cambia la curvatura del potenziale, che è ciò che fissa $\omega$. Un campo non uniforme cambierebbe la curvatura, e allora le correzioni dipenderebbero da $n$.`},
   {q:R`Nella figura la correzione al primo ordine diventa negativa sulla coda. Vuol dire che la teoria delle perturbazioni dà probabilità negative?`,
    a:R`No: le probabilità sono moduli quadri, e $|\psi|^{2}$ resta positivo anche dove $\psi$ cambia segno. Quello che succede è che la funzione corretta ha un nodo che la funzione esatta non ha, e un nodo nel fondamentale è vietato dal teorema di oscillazione. Ma il nodo sta in $x=1/b$, dove la gaussiana vale $e^{-1/2b^{2}}$, una quantità di ordine superiore a qualunque potenza di $b$: è fuori dalla portata di qualunque ordine finito della serie, ed è il tipo di dettaglio che la serie non promette di riprodurre.`}
  ]}
]},
/* ---------------- 08 · L'OSCILLATORE ANARMONICO ---------------- */
{ num:'08', title:'L oscillatore anarmonico: due ordini diversi che contano allo stesso modo', meta:'il problema 3 del paragrafo 38 di Landau · gli elementi di matrice di x al cubo e alla quarta · perché il secondo ordine del termine cubico pesa quanto il primo del quartico · i livelli che si infittiscono · che cosa succede quando il potenziale non è limitato',
  blocchi:[
  {t:'prosa', title:'Il problema, e la domanda che pone sugli ordini', tag:'architettura', html:R`
  <p>Il problema 3 del paragrafo 38 di Landau chiede di <i>«determinare i livelli energetici di un oscillatore anarmonico lineare»</i>, con hamiltoniana</p>
  $$H=\frac{p^{2}}{2m}+\frac{m\omega^{2}x^{2}}{2}+\alpha x^{3}+\beta x^{4}.$$
  <p>È il primo potenziale realistico vicino a un minimo. Lo sviluppo di Taylor di un potenziale qualunque attorno a un minimo comincia con il termine quadratico, e i due termini successivi sono esattamente il cubico e il quartico. Il cubico rompe la simmetria fra destra e sinistra, come nel potenziale di una molecola che si dissocia allungandosi e non comprimendosi. Il quartico corregge la curvatura a grande distanza.</p>
  <p>Il problema pone una domanda sugli ordini che nessuno dei casi precedenti poneva. Il termine $\alpha x^{3}$ non ha elementi diagonali, quindi il suo primo ordine è nullo e il primo effetto viene dal secondo ordine, proporzionale ad $\alpha^{2}$. Il termine $\beta x^{4}$ ha elementi diagonali e contribuisce già al primo ordine, proporzionale a $\beta$. Quale dei due conta di più dipende da come $\alpha$ e $\beta$ scalano. Landau lo dice in una frase: la correzione al secondo ordine dovuta al termine cubico <i>«è dello stesso ordine della correzione della prima approssimazione dovuta al termine $\beta x^{4}$»</i>. La ragione è lo sviluppo di Taylor. Se il potenziale varia su una lunghezza tipica $\ell$, il coefficiente cubico va come $m\omega^{2}/\ell$ e il quartico come $m\omega^{2}/\ell^{2}$. Allora il secondo ordine del cubico, che va come $\alpha^{2}(\hbar/m\omega)^{3}/\hbar\omega$, e il primo ordine del quartico, che va come $\beta(\hbar/m\omega)^{2}$, sono entrambi dell&rsquo;ordine di $\hbar^{2}/m\ell^{2}$, e coerenza vuole che si tengano tutti e due.</p>`},
  {t:'reveal', title:'Gli elementi di matrice, e il calcolo', tag:'costruzione', steps:[
   {label:'Gli elementi di matrice delle potenze di x', body:R`
   <p>Landau li ottiene <i>«direttamente con la regola di moltiplicazione delle matrici»</i> dagli elementi di matrice di $x$. Con $x=s(a+a^{\dagger})$ e $s=\sqrt{\hbar/2m\omega}$, $x^{3}$ connette $|n\rangle$ ai livelli $n\pm1$ e $n\pm3$. Contando i cammini di tre salti che portano da $n$ al livello d&rsquo;arrivo, gli elementi non nulli sono</p>
   $$\langle n+3|x^{3}|n\rangle=s^{3}\sqrt{(n+1)(n+2)(n+3)},\qquad\langle n+1|x^{3}|n\rangle=3s^{3}(n+1)^{3/2},$$
   <p>e i loro simmetrici verso il basso, $\langle n-1|x^{3}|n\rangle=3s^{3}n^{3/2}$ e $\langle n-3|x^{3}|n\rangle=s^{3}\sqrt{n(n-1)(n-2)}$. Il coefficiente 3 negli elementi fra livelli adiacenti conta i tre modi di salire di uno con tre salti, uno in giù e due in su in ordine qualunque, e la radice viene dal prodotto dei fattori dei singoli salti. Sulla diagonale $x^{3}$ è nullo, come richiede la parità: tre salti di $\pm1$ non tornano mai al punto di partenza. Per $x^{4}$ serve invece la diagonale, che conta i sei cammini di quattro salti che tornano al punto di partenza:</p>
   $$\langle n|x^{4}|n\rangle=\frac34\Big(\frac{\hbar}{m\omega}\Big)^{2}\big(2n^{2}+2n+1\big).$$`},
   {label:'Il secondo ordine del termine cubico', body:R`
   <p>Nella formula del secondo ordine entrano quattro stati intermedi, con denominatori $\mp\hbar\omega$ per $n\pm1$ e $\mp3\hbar\omega$ per $n\pm3$. I contributi dei livelli sopra sono negativi, quelli sotto positivi, ma i primi pesano di più, perché gli elementi di matrice verso l&rsquo;alto sono più grandi. Sommando i quattro termini,</p>
   $$E_{n}^{(2)}[\alpha]=-\frac{15}{4}\frac{\alpha^{2}}{\hbar\omega}\Big(\frac{\hbar}{m\omega}\Big)^{3}\Big(n^{2}+n+\frac{11}{30}\Big).$$
   <p>Il risultato è negativo per ogni $n$: il termine cubico abbassa tutti i livelli, non solo il fondamentale. Il segno sul fondamentale è garantito dalla tappa 06. Che valga anche per i livelli eccitati è una proprietà di questa perturbazione, che collega ogni livello più fortemente ai livelli superiori che a quelli inferiori.</p>`},
   {label:'Il primo ordine del termine quartico, e il risultato di Landau', body:R`
   <p>Il primo ordine di $\beta x^{4}$ è $\beta$ per l&rsquo;elemento diagonale. Mettendo insieme i due contributi si ha la formula finale del problema di Landau:</p>
   $$E_{n}=\hbar\omega\Big(n+\frac12\Big)-\frac{15}{4}\frac{\alpha^{2}}{\hbar\omega}\Big(\frac{\hbar}{m\omega}\Big)^{3}\Big(n^{2}+n+\frac{11}{30}\Big)+\frac32\beta\Big(\frac{\hbar}{m\omega}\Big)^{2}\Big(n^{2}+n+\frac12\Big).$$
   <p>Per il fondamentale, $E_{0}=\tfrac12\hbar\omega-\tfrac{11}{8}\frac{\alpha^{2}}{\hbar\omega}\big(\frac{\hbar}{m\omega}\big)^{3}+\tfrac34\beta\big(\frac{\hbar}{m\omega}\big)^{2}$.</p>`},
   {label:'Che cosa si misura: la distanza fra i livelli', body:R`
   <p>Le correzioni contengono $n^{2}+n$, quindi crescono con $n$ e le distanze fra livelli consecutivi non sono più uguali:</p>
   $$E_{n+1}-E_{n}=\hbar\omega-\frac{15}{2}\frac{\alpha^{2}}{\hbar\omega}\Big(\frac{\hbar}{m\omega}\Big)^{3}(n+1)+3\beta\Big(\frac{\hbar}{m\omega}\Big)^{2}(n+1).$$
   <p>La distanza varia linearmente con $n$. In uno spettro vibrazionale molecolare la parte cubica domina, perché il potenziale si appiattisce verso la dissociazione, e i livelli si infittiscono salendo. La pendenza di quella variazione lineare, misurata in uno spettro, dà direttamente la combinazione $\tfrac{15}{2}\alpha^{2}(\hbar/m\omega)^{3}/\hbar\omega-3\beta(\hbar/m\omega)^{2}$: è il modo in cui la spettroscopia legge la forma del potenziale oltre la parabola.</p>`}
  ]},
  {t:'plot', title:'Un potenziale anarmonico e i suoi primi livelli',
   intro:R`<p>In unità $\hbar=m=\omega=1$: il potenziale $\tfrac12x^{2}-0{,}1x^{3}+0{,}02x^{4}$ (blu), la parabola armonica (grigio), e i primi cinque livelli calcolati con la formula di Landau (righe orizzontali arancioni, disegnate dove stanno dentro il potenziale).</p>`,
   plots:[{kind:'func2d', xr:[-3,4.5], yr:[0,5], height:300, ticks:true,
     title:'V(x) anarmonico e livelli E0...E4 al secondo ordine',
     curves:[{f:'0.5*x*x-0.1*x*x*x+0.02*x*x*x*x', col:'#5aa9ff', width:2.6, label:'V anarmonico'},
             {f:'0.5*x*x', col:'#6f7a90', width:1.2, label:'parabola'},
             {f:'(0.5*x*x-0.1*x*x*x+0.02*x*x*x*x)<=0.50125?0.50125:NaN', col:'#ffb86b', width:2, label:'E0 = 0.501'},
             {f:'(0.5*x*x-0.1*x*x*x+0.02*x*x*x*x)<=1.48625?1.48625:NaN', col:'#ffb86b', width:2, label:'E1 = 1.486'},
             {f:'(0.5*x*x-0.1*x*x*x+0.02*x*x*x*x)<=2.45625?2.45625:NaN', col:'#ffb86b', width:2, label:'E2 = 2.456'},
             {f:'(0.5*x*x-0.1*x*x*x+0.02*x*x*x*x)<=3.41125?3.41125:NaN', col:'#ffb86b', width:2, label:'E3 = 3.411'},
             {f:'(0.5*x*x-0.1*x*x*x+0.02*x*x*x*x)<=4.35125?4.35125:NaN', col:'#ffb86b', width:2, label:'E4 = 4.351'}],
     xlabel:'x', ylabel:'E'}],
   leggi:R`<p><b>Che cosa guardare.</b> Il potenziale blu è più largo della parabola a destra e più stretto a sinistra: il termine cubico negativo lo apre dal lato delle $x$ positive. Le distanze fra i livelli arancioni sono $0{,}985$, $0{,}970$, $0{,}955$, $0{,}940$: decrescono di $0{,}015$ a ogni passo, e la formula dice perché, $-\tfrac{15}{2}\alpha^{2}+3\beta=-0{,}075+0{,}06=-0{,}015$.</p>
   <p><b>Che cosa impararne.</b> I livelli si infittiscono perché il potenziale si allarga salendo. Un potenziale più largo è come una buca più ampia, con livelli più vicini. Con i parametri scelti il termine quartico, positivo, frena l&rsquo;infittimento ma non lo inverte. Il segno della pendenza dice quale dei due termini vince, ed è la prima cosa che si legge in uno spettro vibrazionale.</p>`},
  {t:'prosa', title:'Quanto in alto si può salire, e una domanda sul segno di beta', tag:'teorema', html:R`
  <p>Il criterio di validità si legge sulla formula: le correzioni crescono come $n^{2}$ mentre la distanza imperturbata fra i livelli resta $\hbar\omega$. Per livelli abbastanza alti la correzione supera la distanza, e la serie non ha più senso. Nell&rsquo;esempio della figura, con $\beta=0{,}02$, la correzione quartica sul livello $n$ vale $\tfrac32\beta(n^{2}+n+\tfrac12)$, e diventa pari a $\hbar\omega$ già per $n\approx5{,}3$. È la stessa situazione che Picasso trova per l&rsquo;effetto Stark nell&rsquo;idrogeno, dove gli elementi di matrice crescono con $n$ e le distanze fra i livelli calano: la teoria delle perturbazioni descrive i livelli bassi, non tutto lo spettro.</p>
  <p>C&rsquo;è anche una questione più profonda, che il conto non vede. Se $\beta\lt0$, o se $\beta=0$ e $\alpha\ne0$, il potenziale scende a $-\infty$ da almeno un lato. La hamiltoniana non è limitata inferiormente e, a rigore, non ha stati legati: una particella in quello che sembra il fondamentale può attraversare la barriera per effetto tunnel e scappare. Eppure la formula di Landau, ordine per ordine, dà numeri finiti e sensati, e per $\alpha$ e $\beta$ piccoli descrive benissimo ciò che si misura. La spiegazione è che i livelli calcolati sono quelli di stati <b>metastabili</b>, con una vita media esponenzialmente lunga, che nessun ordine finito della serie può vedere. Sakurai fa la stessa osservazione per l&rsquo;effetto Stark, in una nota del curatore: con un campo elettrico <i>«particles bound by $H_{0}$ can, of course, escape now, and all formerly bound states acquire a finite lifetime. However, we can still formally use perturbation theory to calculate the shift in the energy»</i>. La conseguenza per la serie è netta. Una funzione di $\beta$ che non esiste come autovalore vero per $\beta\lt0$ non può essere analitica in un intorno di $\beta=0$, e quindi la serie in potenze di $\beta$ non può avere raggio di convergenza positivo. Funziona in un altro senso: i primi termini approssimano bene, i successivi, prima o poi, peggiorano. La tappa 09 raccoglie questo e gli altri criteri.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Se nel potenziale ci fosse solo il termine quartico con $\beta\gt0$, la correzione al primo ordine basterebbe per tutti i livelli?`,
    a:R`No. La correzione $\tfrac32\beta(\hbar/m\omega)^{2}(n^{2}+n+\tfrac12)$ cresce come $n^{2}$, mentre la distanza fra i livelli è $\hbar\omega$. Per $n$ abbastanza grande la correzione supera la distanza e il criterio di validità cade. Fisicamente, i livelli alti sentono soprattutto il termine quartico, e lo spettro passa dal regime dell&rsquo;oscillatore armonico a quello di un oscillatore puramente quartico, dove le energie crescono come $n^{4/3}$ e non linearmente. Nessun ordine finito della serie attorno all&rsquo;oscillatore armonico riproduce quella legge.`},
   {q:R`Perché nella formula di Landau il termine cubico entra con $\alpha^{2}$ e non con $\alpha$?`,
    a:R`Perché $x^{3}$ è dispari e gli stati dell&rsquo;oscillatore hanno parità definita, quindi tutti gli elementi diagonali di $x^{3}$ sono nulli. Ma c&rsquo;è anche una ragione che non richiede conti: cambiare $\alpha$ in $-\alpha$ equivale a riflettere il potenziale, $x\to-x$, e la riflessione non cambia gli autovalori. Quindi i livelli sono funzioni pari di $\alpha$, e nella serie compaiono solo potenze pari.`}
  ]}
]},
/* ---------------- 09 · DOVE LA SERIE SI FERMA ---------------- */
{ num:'09', title:'Dove la serie si ferma: i criteri di validità, un caso in cui non esiste, e i livelli quasi degeneri', meta:'i criteri di Picasso, di Landau e di Sakurai messi a confronto · la stima di Picasso per l effetto Stark e il livello oltre cui non vale · la buca debole di Sakurai, dove lo sviluppo non esiste · includere i livelli vicini nella parte risolubile · la serie di Brillouin e Wigner',
  blocchi:[
  {t:'prosa', title:'Quattro criteri, e che cosa controlla ciascuno', tag:'architettura', html:R`
  <p>Il movimento ha incontrato finora quattro modi diversi di dire che la perturbazione è «piccola». Conviene metterli in fila, perché non sono equivalenti.</p>
  <p><b>Il criterio sugli elementi di matrice.</b> È la (38,9) di Landau e la (12.11) di Picasso: ogni elemento di matrice fuori diagonale deve essere piccolo rispetto alla differenza di energia fra i due livelli che collega, $|V_{mn}|\ll|\varepsilon_{m}-\varepsilon_{n}|$. Si controlla prima del conto, ed è quello che decide se il metodo si può applicare.</p>
  <p><b>Il criterio a posteriori.</b> È quello che Picasso raccomanda di usare in pratica (12.4): si fa il conto e poi si guarda. Distingue due casi. Se il primo ordine non è nullo, il secondo ordine deve essere piccolo rispetto al primo. Se il primo ordine è nullo, il secondo deve essere piccolo rispetto a $\delta E_{0}$, <i>«dove $\delta E_{0}$ è la distanza fra il livello imperturbato considerato e quello ad esso più vicino. In ogni caso, grosso modo, la condizione è che gli elementi di matrice di $H'$ siano molto minori di $\delta E_{0}$»</i>. Le due disuguaglianze sono riscritte qui in parole, perché nel testo estratto del libro le formule sono illeggibili.</p>
  <p><b>Il criterio sullo stato.</b> È quello che la tappa 05 ha ricavato dal fattore di rinormalizzazione di Sakurai: la probabilità di «fuga» $1-Z_{n}$ deve essere piccola, cioè lo stato perturbato deve somigliare a quello da cui prende il nome.</p>
  <p><b>Il criterio di convergenza.</b> È quello di Sakurai (5.1.17), visto alla tappa 01: la serie converge al valore fisico $\lambda=1$ solo se le singolarità della funzione $E_{n}(\lambda)$ nel piano complesso stanno fuori dal cerchio di raggio uno. È il più severo dei quattro, e il meno usato, perché la tappa 08 ha mostrato che per perturbazioni non limitate la serie non converge mai, e tuttavia i primi termini funzionano.</p>
  <p>I primi tre controllano se i <i>primi termini</i> sono buoni, il quarto se la <i>somma di tutti</i> esiste. In fisica serve quasi sempre la prima risposta.</p>`},
  {t:'reveal', title:'Una stima che fa il lavoro: l’effetto Stark sull’idrogeno', tag:'esempio', steps:[
   {label:'Quanto vale la perturbazione', body:R`
   <p>Picasso applica il criterio a un atomo di idrogeno in un campo elettrico $\mathcal E$, con $H'=e\mathcal E z$. Gli elementi di matrice di $z$ fra livelli bassi sono dell&rsquo;ordine del <span class="str" data-str="raggio-di-bohr">raggio di Bohr</span>, quindi $H'\sim e\mathcal E a_{B}$. Per $\mathcal E=10^{4}$ V/cm, che è un campo intenso per un laboratorio,</p>
   $$e\mathcal E a_{B}\approx5{,}3\times10^{-5}\ \text{eV},$$
   <p>dell&rsquo;ordine di $10^{-4}$ <span class="str" data-str="elettronvolt">eV</span>, come Picasso arrotonda. La distanza fra i primi due livelli dell&rsquo;idrogeno è $\tfrac34\cdot13{,}6=10{,}2$ eV, cinque ordini di grandezza più grande. Per i livelli bassi la teoria delle perturbazioni è ampiamente giustificata, e Picasso osserva che <i>«essendo le energie sempre definite a meno di una costante additiva, l&rsquo;unica cosa con cui ha senso fare il confronto sono proprio le distanze fra i livelli»</i>.</p>`},
   {label:'Fin dove vale', body:R`
   <p>Per livelli alti la stima cambia in due direzioni opposte. Gli elementi di matrice crescono come il raggio dell&rsquo;orbita, cioè come $n^{2}a_{B}$, mentre la distanza fra livelli adiacenti, $13{,}6\,[1/n^{2}-1/(n+1)^{2}]$ eV, cala come $27{,}2/n^{3}$ eV. Uguagliando $n^{2}e\mathcal E a_{B}$ a $27{,}2/n^{3}$ eV si trova il livello oltre cui la perturbazione non è più piccola:</p>
   $$n^{5}\approx\frac{27{,}2}{5{,}3\times10^{-5}}\approx5\times10^{5},\qquad n\approx14.$$
   <p>Picasso dà <i>«solo per $n\approx10$ gli elementi di matrice della perturbazione sono confrontabili con le distanze fra i livelli imperturbati»</i>. Le due stime concordano nell&rsquo;<span class="str" data-str="ordini-di-grandezza">ordine di grandezza</span>, e la differenza dice quanto sono rozze, perché $n^{5}$ è una potenza alta e un fattore due nel numeratore sposta $n$ di poco. La conclusione di Picasso è quella che conta: <i>«il calcolo perturbativo non può essere fatto per tutti i livelli dell&rsquo;idrogeno»</i>. La matrice della hamiltoniana è a blocchi finiti per $n$ piccolo e diventa <i>«un unico blocco di dimensione infinita»</i> da un certo $n$ in poi.</p>`}
  ]},
  {t:'reveal', title:'Un caso in cui lo sviluppo non esiste: la buca debole di Sakurai', tag:'teorema', steps:[
   {label:'L’argomento', body:R`
   <p>Sakurai mette in guardia contro un&rsquo;idea che sembra ovvia: <i>«The reader might be led to believe that a perturbation expansion always exists for a sufficiently weak perturbation. Unfortunately, this is not necessarily the case»</i>. Il suo esempio è una particella libera in una dimensione con l&rsquo;aggiunta di una buca quadrata debole, profonda $V_{0}$ e larga $2a$. La buca ha sempre almeno uno stato legato, per quanto debole, e la sua energia è quadratica in $V_{0}$. Chi la leggesse come una correzione del secondo ordine all&rsquo;energia zero della particella libera sbaglierebbe, e Sakurai dice perché: <i>«if this were the case, the system would also admit an $E\lt0$ state for a repulsive potential case with $\lambda$ negative, which would be sheer nonsense»</i>. Una serie di potenze in $\lambda$ che vale $c\lambda^{2}$ per $\lambda\gt0$ varrebbe $c\lambda^{2}$ anche per $\lambda\lt0$. Ma per una barriera, che è il caso $\lambda\lt0$, lo stato legato non esiste. La funzione «energia dello stato legato» non è analitica in $\lambda=0$, e la serie non c&rsquo;è.</p>`},
   {label:'Il conto', body:R`
   <p>Per lo stato pari, con $k$ il numero d&rsquo;onda dentro la buca e $\kappa$ la costante di decadimento fuori, la condizione di raccordo è $k\tan(ka)=\kappa$, con $k^{2}+\kappa^{2}=q$ e $q\equiv2mV_{0}/\hbar^{2}$. Per $q$ piccolo, sviluppando la tangente, $k^{2}a\simeq\kappa$ e quindi $\kappa\simeq aq$ al primo ordine in $q$. L&rsquo;energia è</p>
   $$E=-\frac{\hbar^{2}\kappa^{2}}{2m}\simeq-\frac{2ma^{2}V_{0}^{2}}{\hbar^{2}},$$
   <p>quadratica in $V_{0}$. La ragione per cui non è un secondo ordine perturbativo si vede nella struttura del problema imperturbato: la particella libera ha uno <span class="str" data-str="spettro">spettro</span> continuo che parte da zero, senza nessun livello isolato da correggere. La premessa di Dirac, che il problema <i>«ha senso solo se i livelli energetici del sistema imperturbato sono discreti»</i>, qui manca, ed è esattamente quella che manca.</p>`}
  ]},
  {t:'reveal', title:'I livelli quasi degeneri, e due cure', tag:'costruzione', steps:[
   {label:'La cura di Picasso: spostare i livelli vicini nella parte risolubile', body:R`
   <p>Spesso i livelli di $H_{0}$ si raggruppano in multipletti: gruppi di livelli vicini fra loro e lontani dagli altri, come i multipletti di struttura fine degli atomi. In un multipletto i denominatori sono piccoli e il criterio cade, e Picasso osserva che <i>«non basta neppure ricorrere al secondo ordine, perché anche gli ordini superiori (terzo, quarto, ...) sono potenze di $|H'_{nm}|/\delta E_{0}$ e quindi non piccoli»</i>. La cura sfrutta l&rsquo;arbitrarietà nella separazione di $H$ in una parte risolubile e una piccola (12.27). Si scrive $H_{0}=H'_{0}+\delta H_{0}$, dove $H'_{0}$ è degenere su ogni multipletto e $\delta H_{0}$ contiene le piccole differenze di energia dentro il multipletto. Poi si tratta $\delta H_{0}+H'$ come perturbazione. In pratica, nelle parole di Picasso, <i>«si prende la matrice $H_{nm}$, si mettono a zero i termini non diagonali fra stati corrispondenti a multipletti diversi e si diagonalizza quello che resta»</i>. Si diagonalizza esattamente il blocco del multipletto, e si lascia alle perturbazioni solo ciò che collega multipletti lontani.</p>
   <p>Per due livelli vicini il blocco è il problema della tappa 01, risolto esattamente:</p>
   $$E_{\pm}=\frac{E_{1}+E_{2}}{2}\pm\frac12\sqrt{(E_{1}-E_{2})^{2}+4|V|^{2}},$$
   <p>e Picasso, applicando la procedura al livello $n=2$ dell&rsquo;idrogeno quando la struttura fine e l&rsquo;effetto del campo sono confrontabili, nota che <i>«lo sviluppo in potenze di $3e\mathcal Ea_{B}/\delta E_{0}$ sarebbe completamente privo di senso»</i>. La radice va tenuta intera.</p>`},
   {label:'La cura di Ballentine: la serie di Brillouin e Wigner', body:R`
   <p>Ballentine propone una riorganizzazione della serie, che chiama di Brillouin e Wigner. Si parte da $(E_{n}-H_{0})|\Psi_{n}\rangle=V|\Psi_{n}\rangle$, si introduce il proiettore $Q_{n}=1-|n\rangle\langle n|$, e si arriva alla (10.103):</p>
   $$E_{n}=\varepsilon_{n}+V_{nn}+\sum_{m\ne n}\frac{|V_{nm}|^{2}}{E_{n}-\varepsilon_{m}}+\dots$$
   <p>La differenza con Rayleigh e Schrödinger è che al denominatore compare l&rsquo;energia <b>esatta</b> $E_{n}$, non quella imperturbata. L&rsquo;equazione è implicita e si risolve per iterazione, ma ha un vantaggio decisivo sui livelli quasi degeneri. Per il problema $2\times2$ con elementi diagonali $\varepsilon_{1},\varepsilon_{2}$ e fuori diagonale $v$, la (10.108) di Ballentine, $E_{1}=\varepsilon_{1}+|v|^{2}/(E_{1}-\varepsilon_{2})$, è equivalente all&rsquo;equazione secolare esatta, e quindi <i>«Brillouin-Wigner perturbation theory yields the exact answer to this problem, in both the degenerate and nondegenerate cases»</i>. Rayleigh e Schrödinger danno invece $E_{1}=\varepsilon_{1}+|v|^{2}/(\varepsilon_{1}-\varepsilon_{2})$, che <i>«is nonsense in the limit $\varepsilon_{1}\to\varepsilon_{2}$»</i>.</p>
   <p>Ballentine aggiunge un limite onesto: con più di due livelli degeneri la serie di Brillouin e Wigner non è più esatta nel limite degenere, ma <i>«may still form a usable approximation»</i>.</p>`}
  ]},
  {t:'plot', title:'Rayleigh-Schrödinger contro il risultato esatto, quando i livelli si avvicinano',
   intro:R`<p>Due livelli $\pm\Delta/2$ accoppiati da $v=0{,}3$: la correzione al livello superiore in funzione della distanza $\Delta$. In blu il risultato esatto $\sqrt{\Delta^{2}/4+v^{2}}$, che è anche ciò che dà la serie di Brillouin e Wigner. In arancione il secondo ordine di Rayleigh e Schrödinger, $\Delta/2+v^{2}/\Delta$. In grigio il livello imperturbato $\Delta/2$.</p>`,
   plots:[{kind:'func2d', xr:[0.02,2.5], yr:[0,2], height:280, ticks:true,
     title:'livello superiore: esatto (= Brillouin-Wigner) e Rayleigh-Schrodinger al 2o ordine',
     curves:[{f:'Math.sqrt(x*x/4+0.09)', col:'#5aa9ff', width:2.6, label:'esatto'},
             {f:'x/2+0.09/x', col:'#ffb86b', width:2.0, label:'RS 2o ordine'},
             {f:'x/2', col:'#6f7a90', width:1.2, label:'imperturbato'}],
     xlabel:'Delta', ylabel:'E+'}],
   leggi:R`<p><b>Che cosa guardare.</b> Per $\Delta\gtrsim1$, cioè per una distanza fra i livelli più di tre volte l&rsquo;accoppiamento, la curva arancione è sovrapposta a quella blu. Sotto $\Delta\approx0{,}6=2v$ si stacca e diverge come $v^{2}/\Delta$, mentre la curva esatta tende con calma a $v$. La soglia è il raggio di convergenza della tappa 01, $v=\Delta/2$.</p>
   <p><b>Che cosa impararne.</b> Il problema non è la perturbazione, che resta la stessa: è la distanza fra i livelli che la rende grande o piccola. La serie di Rayleigh e Schrödinger tratta la distanza come fissa e l&rsquo;accoppiamento come piccolo. Quando la distanza diventa confrontabile con l&rsquo;accoppiamento la serie va riorganizzata, includendo i livelli vicini nella parte risolubile alla Picasso, o mettendo l&rsquo;energia esatta al denominatore alla Brillouin e Wigner. Nel limite $\Delta\to0$ si arriva al caso degenere, dove il blocco va diagonalizzato prima di qualunque serie.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Il criterio $|V_{mn}|\ll|\varepsilon_{m}-\varepsilon_{n}|$ è soddisfatto per tutti gli $m$, ma la somma del secondo ordine diverge. Com&rsquo;è possibile?`,
    a:R`Se gli stati intermedi sono infiniti, la somma può divergere anche se ogni termine è piccolo: serve che decrescano abbastanza in fretta. Accade quando gli elementi di matrice verso gli stati alti non calano, per esempio con una perturbazione molto concentrata in un punto, che collega fortemente stati con energia arbitrariamente alta. Il criterio sugli elementi di matrice è necessario, non sufficiente: il controllo a posteriori di Picasso, che guarda la correzione calcolata, prende anche questo caso.`},
   {q:R`Nel limite di Brillouin e Wigner l&rsquo;energia esatta sta al denominatore. Che cosa si mette al primo passo dell&rsquo;iterazione, e quanti passi servono per riottenere il secondo ordine di Rayleigh e Schrödinger?`,
    a:R`Al primo passo si mette la stima più semplice, $E_{n}=\varepsilon_{n}$, e il primo giro dà esattamente il secondo ordine di Rayleigh e Schrödinger. Ballentine indica come ottenere il terzo: nel termine del secondo ordine si deve usare il valore corretto al primo ordine, $\varepsilon_{n}+V_{nn}$. In generale sviluppare i denominatori $1/(E_{n}-\varepsilon_{m})$ in potenze della perturbazione riproduce la serie di Rayleigh e Schrödinger, che dal terzo ordine in poi <i>«will contain many more terms»</i>. La forma di Brillouin e Wigner è più compatta, al prezzo di essere implicita.`}
  ]}
]},
/* ---------------- 10 · EFFETTO STARK QUADRATICO E POLARIZZABILITA' ---------------- */
{ num:'10', title:'Un atomo in un campo elettrico: l effetto Stark quadratico e la polarizzabilità dell idrogeno', meta:'perché il primo ordine è nullo, con tre regole di selezione · la polarizzabilità come coefficiente del secondo ordine · la stima dall alto di Sakurai con la completezza · il conto esatto di Dalgarno e Lewis senza nessuna somma · due vie che devono coincidere',
  blocchi:[
  {t:'prosa', title:'Il problema, e perché il primo ordine non dice niente', tag:'architettura', html:R`
  <p>Un atomo di idrogeno nel suo stato fondamentale è messo in un campo elettrico uniforme $\mathcal E$ diretto lungo $z$. L&rsquo;elettrone ha carica $-e$, il dipolo dell&rsquo;atomo è $\mathbf d=-e\mathbf r$, e l&rsquo;energia di interazione è $H_{1}=-\mathbf d\cdot\boldsymbol{\mathcal E}=e\mathcal E z$. Il fondamentale $|100\rangle$ è non degenere, e il metodo di questo movimento si applica. I livelli eccitati dell&rsquo;idrogeno invece sono degeneri, e lì il campo produce un effetto lineare che richiede un altro trattamento.</p>
  <p>Il primo ordine è $e\mathcal E\langle100|z|100\rangle$, e Picasso mostra in tre modi che è nullo, attraverso tre regole di selezione. <b>Sul momento angolare</b>: se $|B\rangle$ è uno stato $s$, la sua funzione d&rsquo;onda dipende solo da $r$, e $z|B\rangle$ ha funzione d&rsquo;onda $z\,f(r)=r\cos\theta\,f(r)$, che è uno stato $p$; uno stato $s$ e uno $p$ sono ortogonali, perché appartengono ad autovalori diversi di $L^{2}$. <b>Sulla parità</b>: $z$ è dispari, il fondamentale ha parità definita, e il valor medio di un operatore dispari su uno stato di parità definita è nullo. <b>Su $L_{z}$</b>: $z$ commuta con $L_{z}$, quindi collega solo stati con lo stesso $m$. Le prime due bastano già per il primo ordine; la terza serve per il secondo, perché riduce gli stati intermedi a quelli con $m=0$.</p>
  <p>Picasso aggiunge una riflessione sul significato di queste regole: sono legate <i>«a numeri quantici [...] che caratterizzano gli stati [...] che stiamo considerando, cioè agli autovalori di osservabili che commutano con $H_{0}$: esaurito l&rsquo;insieme dei numeri quantici che sappiamo attribuire a questi stati viene meno la possibilità di scoprire altre regole di selezione»</i>. È il motivo per cui conviene classificare gli stati con il maggior numero possibile di numeri quantici prima di calcolare elementi di matrice. Landau trae la conseguenza per tutti gli atomi: siccome gli elementi diagonali del dipolo sono nulli, <i>«la separazione dei livelli in un campo elettrico è un effetto del secondo ordine rispetto al campo»</i>.</p>`},
  {t:'reveal', title:'Il secondo ordine e la polarizzabilità', tag:'costruzione', steps:[
   {label:'La definizione', body:R`
   <p>Un atomo senza dipolo permanente, messo in un campo, si polarizza: acquista un dipolo indotto proporzionale al campo, $\langle d\rangle=\alpha\mathcal E$, dove $\alpha$ è la <b>polarizzabilità</b>. Ballentine spiega perché l&rsquo;energia che ne risulta è $-\tfrac12\alpha\mathcal E^{2}$ e non $-\alpha\mathcal E^{2}$. L&rsquo;energia del dipolo nel campo è $-\langle d\rangle\mathcal E=-\alpha\mathcal E^{2}$, ma il campo ha anche fatto un lavoro $\tfrac12\alpha\mathcal E^{2}$ per polarizzare l&rsquo;atomo, e la somma è</p>
   $$\Delta E=-\frac12\alpha\mathcal E^{2}.$$
   <p>È la stessa definizione di Sakurai (5.1.67) e di Landau (76,2). Confrontata con la formula del secondo ordine, essa dà</p>
   $$\alpha=2e^{2}\sum_{k\ne0}\frac{|\langle k|z|100\rangle|^{2}}{E_{k}-E_{1}},$$
   <p>con la somma estesa a tutti gli stati $p$ con $m=0$. Ballentine avverte che <i>«the sum over $n'$ [...] should include an integral over the continuum of unbound positive energy states, as well as a sum over the discrete bound states»</i>. Il continuo dell&rsquo;idrogeno pesa, e la somma non si fa in forma chiusa termine per termine.</p>`},
   {label:'Una stima dall’alto, con la sola completezza', body:R`
   <p>Sakurai aggira la somma con un argomento di due righe. Tutti i denominatori sono almeno pari alla distanza fra il fondamentale e il primo eccitato,</p>
   $$E_{k}-E_{1}\ge E_{2}-E_{1}=\frac{e^{2}}{2a_{0}}\Big(1-\frac14\Big)=\frac{3e^{2}}{8a_{0}},$$
   <p>quindi sostituendo ciascun denominatore con questo valore minimo la somma può solo crescere. A quel punto il numeratore si somma con la relazione di completezza: $\sum_{k}|\langle k|z|100\rangle|^{2}=\langle100|z^{2}|100\rangle$, e il termine $k=0$ che la completezza aggiunge è nullo. Per la simmetria sferica $\langle z^{2}\rangle=\tfrac13\langle r^{2}\rangle$, e sul fondamentale dell&rsquo;idrogeno $\langle r^{2}\rangle=3a_{0}^{2}$, quindi $\langle z^{2}\rangle=a_{0}^{2}$. Il risultato è la (5.1.72) di Sakurai:</p>
   $$\alpha\lt2e^{2}\frac{a_{0}^{2}}{3e^{2}/8a_{0}}=\frac{16}{3}a_{0}^{3}\approx5{,}3\,a_{0}^{3}.$$
   <p>Una stima senza nessuna funzione d&rsquo;onda eccitata, e già del giusto ordine di grandezza.</p>`},
   {label:'Il conto esatto: Dalgarno e Lewis', body:R`
   <p>Ballentine, nel suo esempio 3, fa il conto esatto con un metodo attribuito a Dalgarno e Lewis, che Sakurai cita come quello che <i>«also agrees with the experimentally measured value»</i>. L&rsquo;idea è non usare affatto la somma sugli stati. Si risolve direttamente l&rsquo;equazione del primo ordine della gerarchia della tappa 02,</p>
   $$(H_{0}-\varepsilon_{1})|\Psi^{(1)}\rangle=\big(\langle H_{1}\rangle-H_{1}\big)|100\rangle,$$
   <p>che è un&rsquo;<b>equazione differenziale non omogenea</b>, e poi si calcola $E^{(2)}=\langle100|H_{1}|\Psi^{(1)}\rangle$ con la formula $E^{(r)}=\langle n|V|\Psi^{(r-1)}\rangle$. Il secondo membro ha la dipendenza angolare $\cos\theta$, e l&rsquo;operatore a sinistra è invariante per rotazioni, quindi la soluzione deve avere la forma $\Psi^{(1)}=\cos\theta\,f(r)$, che è automaticamente ortogonale a $|100\rangle$ come vuole la normalizzazione intermedia. Si cerca $f(r)=p(r)e^{-r/a_{0}}$ con $p$ polinomio, e l&rsquo;equazione per $p$ ha un&rsquo;unica soluzione polinomiale (10.87):</p>
   $$p(r)=-\frac{1}{\sqrt{\pi a_{0}^{3}}}\frac{\mathcal E}{e}\Big(a_{0}r+\frac{r^{2}}{2}\Big).$$
   <p>Le altre soluzioni crescono esponenzialmente e vanno scartate. L&rsquo;integrale finale è elementare, perché contiene solo potenze di $r$ per esponenziali, e dà la (10.88):</p>
   $$E^{(2)}=-\frac94\mathcal E^{2}a_{0}^{3},\qquad\alpha=\frac92a_{0}^{3}.$$
   <p>Il valore esatto, $4{,}5\,a_{0}^{3}$, sta sotto la stima di Sakurai, $5{,}3\,a_{0}^{3}$, come deve. La differenza misura quanto gli stati intermedi stanno sopra il primo eccitato: il continuo pesa, e pesa con denominatori grandi.</p>`},
   {label:'Due vie che devono coincidere', body:R`
   <p>Ballentine calcola la polarizzabilità anche per una seconda via: il valor medio del dipolo nello stato corretto al primo ordine, $\langle d\rangle=\langle\Psi^{(0)}|d|\Psi^{(1)}\rangle+\langle\Psi^{(1)}|d|\Psi^{(0)}\rangle$. Ritrova la stessa espressione, e commenta: <i>«It is no coincidence that these two calculations of $\alpha$, from the second order energy and from the first order state vector, have led to exactly the same answer. Their compatibility is guaranteed by (10.69)»</i>. È la formula $E^{(r)}=\langle n|V|\Psi^{(r-1)}\rangle$ della tappa 02, vista come un principio fisico: per l&rsquo;energia al secondo ordine basta lo stato al primo, e il dipolo indotto è l&rsquo;informazione contenuta in quello stato.</p>`}
  ]},
  {t:'plot', title:'L’atomo deformato dal campo, lungo l’asse z',
   intro:R`<p>In unità $a_{0}=e=1$: la densità di probabilità del fondamentale lungo l&rsquo;asse $z$ (blu) e quella corretta al primo ordine con la soluzione di Dalgarno e Lewis, $\psi(z)\propto e^{-|z|}\big[1-\mathcal E z(1+|z|/2)\big]$, per $\mathcal E=0{,}1$ (arancio).</p>`,
   plots:[{kind:'func2d', xr:[-4,4], yr:[0,0.45], height:270, ticks:true,
     title:'|psi(z)|^2 lungo l asse del campo, senza e con campo',
     curves:[{f:'Math.exp(-2*Math.abs(x))/Math.PI', col:'#5aa9ff', width:2.4, label:'campo nullo'},
             {f:'Math.exp(-2*Math.abs(x))*Math.pow(1-0.1*x*(1+Math.abs(x)/2),2)/Math.PI', col:'#ffb86b', width:2.4, label:'campo 0.1 (unita atomiche)'}],
     xlabel:'z / a0', ylabel:'densita'}],
   leggi:R`<p><b>Che cosa guardare.</b> La curva arancione è più alta a sinistra, per $z\lt0$, e più bassa a destra. Il campo è diretto verso $z$ positivi, la forza sull&rsquo;elettrone, che ha carica negativa, è diretta verso $z$ negativi, e la nuvola si sposta di conseguenza. Il dipolo $-e\langle z\rangle$ che ne risulta punta lungo il campo, ed è il dipolo indotto della definizione.</p>
   <p><b>Che cosa impararne.</b> Il campo scelto, $0{,}1$ in unità atomiche, vale circa $5\times10^{10}$ V/m, molto più di qualunque campo statico di laboratorio, eppure la deformazione è modesta. Per i campi realistici la correzione al primo ordine dello stato è piccolissima, e la teoria delle perturbazioni è esatta a tutti gli effetti pratici. La deformazione cresce allontanandosi dal nucleo, come $z^{2}$: le parti esterne della nuvola, legate più debolmente, sono le più polarizzabili.</p>`},
  {t:'prosa', title:'I numeri, in unità di laboratorio', tag:'esempio', html:R`
  <p>In unità gaussiane la polarizzabilità ha le dimensioni di un volume: $\alpha=4{,}5\,a_{0}^{3}$, e con $a_{0}=0{,}529$ Å fa</p>
  $$\alpha=4{,}5\,(0{,}529\ \text{Å})^{3}\approx0{,}666\ \text{Å}^{3},$$
  <p>un volume più piccolo di quello dell&rsquo;atomo stesso. Lo spostamento di energia si scrive in una forma che rende evidente l&rsquo;ordine di grandezza: $E^{(2)}=-\tfrac94\mathcal E^{2}a_{0}^{3}=-\tfrac94\,(e\mathcal Ea_{0})^{2}/(e^{2}/a_{0})$, cioè il quadrato della stima di Picasso per l&rsquo;elemento di matrice diviso per l&rsquo;unità atomica di energia $e^{2}/a_{0}=27{,}2$ eV. Per $\mathcal E=10^{4}$ V/cm, con $e\mathcal Ea_{0}\approx5{,}3\times10^{-5}$ eV,</p>
  $$E^{(2)}\approx-\frac94\frac{(5{,}3\times10^{-5})^{2}}{27{,}2}\ \text{eV}\approx-2{,}3\times10^{-10}\ \text{eV}.$$
  <p>È un effetto minuscolo, ed è il motivo per cui l&rsquo;effetto Stark sul fondamentale degli atomi si misura con campi intensi e con tecniche di precisione. Per i livelli eccitati dell&rsquo;idrogeno, dove la degenerazione permette un effetto lineare dell&rsquo;ordine di $3e\mathcal Ea_{0}$, lo spostamento è circa sei ordini di grandezza più grande.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Nella stima di Sakurai si sostituiscono tutti i denominatori con il più piccolo. Perché il risultato è un limite superiore e non inferiore?`,
    a:R`Perché ogni termine della somma è positivo, e diminuire il suo denominatore lo fa crescere. Sostituendo ogni $E_{k}-E_{1}$ con il valore minimo $3e^{2}/8a_{0}$, ogni frazione cresce o resta uguale, e la somma con essa. Quindi la stima dà più del valore vero. Un limite inferiore si otterrebbe sostituendo i denominatori con un valore massimo, che non esiste, perché il continuo arriva a energie arbitrarie. Per questo la stima per completezza va in una direzione sola.`},
   {q:R`Il metodo di Dalgarno e Lewis funziona perché l&rsquo;equazione differenziale ha una soluzione polinomiale. Che cosa succederebbe con un potenziale per cui non ce l&rsquo;ha?`,
    a:R`Si dovrebbe risolvere l&rsquo;equazione differenziale non omogenea numericamente, o per serie. Ballentine lo dice esplicitamente: il metodo <i>«will be effective only if (10.81) is easier to solve than the full eigenvalue equation»</i>, e anche se va risolta in modo approssimato <i>«it may be more tractable than the infinite sum»</i>. Il vantaggio non dipende dall&rsquo;esistenza di una soluzione chiusa: un&rsquo;equazione differenziale ordinaria in una variabile è comunque più maneggevole di una somma su infiniti stati più un integrale sul continuo.`}
  ]}
]},
/* ---------------- 11 · L'ELIO AL PRIMO ORDINE ---------------- */
{ num:'11', title:'L elio al primo ordine: una perturbazione che non è piccola', meta:'la repulsione fra i due elettroni come perturbazione · il valor medio calcolato con l elettrostatica, come fa Picasso · venti virgola quattro elettronvolt contro ventiquattro virgola sei · lo ione H meno che la teoria non lega · perché l errore relativo cala con Z',
  blocchi:[
  {t:'prosa', title:'Il problema, e la scelta della parte risolubile', tag:'architettura', html:R`
  <p>Un atomo con due elettroni e un nucleo di carica $Ze$, che Picasso tratta insieme per $Z$ qualunque: lo ione H$^{-}$ ($Z=1$), l&rsquo;elio ($Z=2$), il litio ionizzato Li$^{+}$ ($Z=3$). La hamiltoniana, con il nucleo fermo, è</p>
  $$H=\frac{p_{1}^{2}}{2m}-\frac{Ze^{2}}{r_{1}}+\frac{p_{2}^{2}}{2m}-\frac{Ze^{2}}{r_{2}}+\frac{e^{2}}{r_{12}},$$
  <p>e Picasso (14.10) sceglie come perturbazione l&rsquo;ultimo termine, la repulsione fra i due elettroni: $H'=e^{2}/r_{12}$. Senza di esso la hamiltoniana è la somma di due atomi idrogenoidi indipendenti, e lo stato fondamentale imperturbato ha entrambi gli elettroni nell&rsquo;orbitale $1s$, con energia</p>
  $$E_{0}^{(0)}=2\times\Big(-\frac{Z^{2}e^{2}}{2a_{0}}\Big)=-\frac{Z^{2}e^{2}}{a_{0}}.$$
  <p>Due elettroni nello stesso orbitale spaziale sono possibili solo con gli spin opposti, nello stato di singoletto; qui lo spin non entra nella hamiltoniana e conta solo la parte spaziale. Il fondamentale imperturbato è non degenere nella parte spaziale, e il primo ordine è il valor medio di $e^{2}/r_{12}$.</p>
  <p>Già prima del conto si vede che questa perturbazione <b>non è piccola</b>. La repulsione fra due elettroni a distanza dell&rsquo;ordine di $a_{0}/Z$ vale circa $Ze^{2}/a_{0}$, da confrontare con l&rsquo;energia imperturbata $Z^{2}e^{2}/a_{0}$: il rapporto è dell&rsquo;ordine di $1/Z$, cioè un mezzo per l&rsquo;elio. Il caso è istruttivo proprio per questo: mostra che cosa dà il primo ordine quando la sua ipotesi è al limite.</p>`},
  {t:'reveal', title:'Il valor medio di 1/r12, con l’elettrostatica', tag:'costruzione', steps:[
   {label:'Riconoscere un problema di elettrostatica', body:R`
   <p>Il primo ordine è un integrale doppio sulle posizioni dei due elettroni,</p>
   $$\delta E_{0}=\int\!\!\int|\psi_{100}(\mathbf r_{1})|^{2}\,\frac{e^{2}}{r_{12}}\,|\psi_{100}(\mathbf r_{2})|^{2}\,dV_{1}\,dV_{2},$$
   <p>con $\psi_{100}=\sqrt{Z^{3}/\pi a_{0}^{3}}\;e^{-Zr/a_{0}}$. Picasso osserva che questo integrale <i>«è l&rsquo;energia elettrostatica della distribuzione»</i> di carica $\rho(r)=-e|\psi_{100}|^{2}$ <i>«nel campo di una seconda distribuzione identica alla prima, e quindi può essere calcolato con i metodi dell&rsquo;elettrostatica»</i>. Si evita l&rsquo;integrale doppio con $1/|\mathbf r_{1}-\mathbf r_{2}|$, che è la parte scomoda.</p>`},
   {label:'Il campo, il potenziale, l’energia', body:R`
   <p>Con $k=2Z/a_{0}$ la densità di carica è $\rho(r)=-e\,\frac{k^{3}}{8\pi}e^{-kr}$. La distribuzione è a simmetria sferica, quindi per il <span class="str" data-str="teorema-della-divergenza">teorema di Gauss</span> il campo a distanza $r$ dipende solo dalla carica racchiusa nella sfera di raggio $r$:</p>
   $$Q(r)=-e\Big[1-e^{-kr}\Big(1+kr+\frac{k^{2}r^{2}}{2}\Big)\Big].$$
   <p>Integrando il campo $Q(r)/r^{2}$ dall&rsquo;infinito si ha il potenziale, la (14.13) di Picasso:</p>
   $$\varphi(r)=e\Big[-\frac1r+\Big(\frac1r+\frac k2\Big)e^{-kr}\Big].$$
   <p>Lontano dall&rsquo;origine $\varphi\to-e/r$, il potenziale di una carica puntiforme $-e$. Vicino all&rsquo;origine il termine esponenziale compensa la divergenza, e $\varphi(0)=-ek/2$ resta finito: negativo, come deve essere il potenziale di una carica negativa, ma limitato. L&rsquo;energia della seconda distribuzione in questo potenziale è $\int\rho\,\varphi\,dV$, e gli integrali che servono sono tutti della forma $\int r^{n}e^{-\kappa r}dr$. Il risultato, la (14.14), è</p>
   $$\delta E_{0}=\frac58\frac{Ze^{2}}{a_{0}}.$$`},
   {label:'L’energia e la ionizzazione', body:R`
   <p>L&rsquo;energia del fondamentale al primo ordine è quindi</p>
   $$E_{0}=-\Big(Z^{2}-\frac58Z\Big)\frac{e^{2}}{a_{0}}.$$
   <p>L&rsquo;energia di prima ionizzazione è la differenza fra lo ione rimasto con un solo elettrone, $-Z^{2}e^{2}/2a_{0}$, e l&rsquo;atomo: $E_{I}=\big(\tfrac12Z^{2}-\tfrac58Z\big)e^{2}/a_{0}$, la (14.16). Con $e^{2}/a_{0}=27{,}2$ eV, per l&rsquo;elio,</p>
   $$E_{I}=\Big(2-\frac54\Big)\times27{,}2\ \text{eV}=20{,}4\ \text{eV},$$
   <p>contro il valore sperimentale di $24{,}6$ eV che Picasso riporta. L&rsquo;errore è del $17\%$. Senza la repulsione l&rsquo;energia di ionizzazione sarebbe $Z^{2}e^{2}/2a_{0}=54{,}4$ eV, più del doppio: il primo ordine porta il risultato da completamente sbagliato a sbagliato del $17\%$, che per una perturbazione grande la metà dell&rsquo;energia imperturbata è un risultato notevole.</p>`}
  ]},
  {t:'plot', title:'La carica racchiusa e lo schermo che un elettrone fa all’altro',
   intro:R`<p>Per l&rsquo;elio, in unità $a_{0}=e=1$ (quindi $k=4$): la frazione della carica di un elettrone racchiusa entro il raggio $r$ (blu), e il potenziale $\varphi(r)$ che quell&rsquo;elettrone produce (arancio), confrontato con il potenziale $-1/r$ di una carica puntiforme (grigio).</p>`,
   plots:[{kind:'func2d', xr:[0.01,2.5], yr:[-3,2.2], height:290, ticks:true,
     title:'carica racchiusa, potenziale della nuvola e potenziale puntiforme',
     curves:[{f:'1-Math.exp(-4*x)*(1+4*x+8*x*x)', col:'#5aa9ff', width:2.4, label:'frazione di carica entro r'},
             {f:'-1/x+(1/x+2)*Math.exp(-4*x)', col:'#ffb86b', width:2.4, label:'phi(r) della nuvola'},
             {f:'-1/x', col:'#6f7a90', width:1.2, label:'-1/r, carica puntiforme'}],
     xlabel:'r / a0', ylabel:''}],
   leggi:R`<p><b>Che cosa guardare.</b> La curva blu sale da zero a uno in un raggio di circa $a_{0}$: oltre $r\approx1{,}5\,a_{0}$ quasi tutta la carica dell&rsquo;elettrone è racchiusa. Il potenziale arancione coincide con quello puntiforme dove la curva blu è vicina a uno, e se ne stacca all&rsquo;interno, dove resta finito invece di divergere.</p>
   <p><b>Che cosa impararne.</b> Visto da fuori, un elettrone nell&rsquo;orbitale $1s$ dell&rsquo;elio scherma una carica unitaria del nucleo; visto da dentro la sua stessa nuvola, scherma solo la parte racchiusa. È l&rsquo;immagine che porta oltre il primo ordine: ciascun elettrone sente una carica nucleare efficace minore di $Z$. Picasso la usa nel passo successivo, che il programma del corso esclude: un calcolo variazionale con carica efficace $Z'=Z-5/16$, che porta l&rsquo;energia di ionizzazione dell&rsquo;elio a $23{,}1$ eV.</p>`},
  {t:'prosa', title:'Lo ione H meno, e perché l’errore cala con Z', tag:'teorema', html:R`
  <p>Per $Z=1$ la formula dà $E_{I}=\big(\tfrac12-\tfrac58\big)\times27{,}2$ eV $=-3{,}4$ eV, un&rsquo;energia di ionizzazione <i>negativa</i>. Al primo ordine il secondo elettrone non è legato: lo ione H$^{-}$, secondo questo conto, non esiste. Picasso lo dice senza girarci attorno: <i>«l&rsquo;esistenza, sperimentalmente accertata, dello ione H$^{-}$ (che ha un solo stato legato) non è prevista dalla teoria perturbativa»</i>. È il caso in cui la perturbazione, $\tfrac58$ in unità di $e^{2}/a_{0}$, supera addirittura la metà dell&rsquo;energia imperturbata, $1$ nelle stesse unità. Non c&rsquo;è da stupirsi che il primo ordine sbagli il segno di una quantità che è la piccola differenza fra due numeri grandi.</p>
  <p>Al crescere di $Z$ il rapporto fra perturbazione ed energia imperturbata cala come $5/8Z$, e il primo ordine migliora. Per il Li$^{+}$ ($Z=3$) la formula dà $E_{I}=\big(\tfrac92-\tfrac{15}{8}\big)\times27{,}2$ eV $\approx71{,}4$ eV, contro i $75{,}6$ eV sperimentali che Picasso riporta: un errore del $6\%$, contro il $17\%$ dell&rsquo;elio. È la tendenza che il criterio di validità prevede. La serie è, in effetti, una serie in potenze di $1/Z$, e ogni ordine guadagna un fattore $1/Z$.</p>
  <p>Il confronto con i livelli eccitati dà un&rsquo;altra misura della difficoltà. Il primo stato eccitato imperturbato, con un elettrone in $2s$, sta sopra il fondamentale di $\tfrac34\cdot Z^{2}e^{2}/2a_{0}$, cioè $40{,}8$ eV per l&rsquo;elio. La correzione al primo ordine, $\tfrac58\cdot2\cdot27{,}2=34$ eV, è dello stesso ordine. Il criterio di Picasso non è soddisfatto, e il secondo ordine, se lo si calcolasse, non sarebbe piccolo. Il primo ordine dà comunque un numero sensato perché la parte più grande della repulsione è un effetto medio, e il valor medio la cattura. La parte che manca è la correlazione: i due elettroni si evitano più di quanto due nuvole indipendenti possano descrivere.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Il primo ordine dà per l&rsquo;elio un&rsquo;energia del fondamentale più alta o più bassa di quella vera?`,
    a:R`Più alta. Il primo ordine $E^{(0)}+E^{(1)}$ è il valor medio della hamiltoniana completa sullo stato imperturbato, e il fondamentale vero ha l&rsquo;energia più bassa fra tutti i valori medi possibili. Quindi $E^{(0)}+E^{(1)}$ è un limite superiore all&rsquo;energia vera. Infatti $-74{,}8$ eV sta sopra il valore sperimentale di $-79{,}0$ eV, somma delle due energie di ionizzazione $24{,}6$ e $54{,}4$ eV. La stessa disuguaglianza dice che l&rsquo;energia di ionizzazione calcolata è un limite <i>inferiore</i>, e infatti $20{,}4\lt24{,}6$.`},
