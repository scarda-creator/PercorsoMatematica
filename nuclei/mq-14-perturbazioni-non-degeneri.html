<style>
  :root{
    --bg:#0e1117; --panel:#161b22; --panel2:#1c232d; --border:#2b333d;
    --txt:#eef3f8; --muted:#b9c4d1; --accent:#4c8dff; --accent2:#8fb0ff;
    --ok:#2ea043; --okbg:#10331b; --warn:#d8a13a; --warnbg:#332a10;
    --gram:#5eead4; --grambg:#0f2a26;
    --pro:#b98cff; --probg:#1a1430; --proline:#2a2247; --proedge:#3a2d5c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    font-size:17px;line-height:1.55;}
  a{color:var(--accent2);}
  .banner{background:var(--panel2);border-bottom:1px solid var(--border);color:var(--muted);
    font-size:.8rem;font-weight:600;text-align:center;padding:8px 12px;letter-spacing:.3px;}
  .banner b{color:var(--accent2);}
  .shell{display:flex;max-width:1180px;margin:0 auto;align-items:flex-start;}

  /* ---- SIDEBAR ---- */
  .sidebar{width:280px;flex:0 0 280px;padding:20px 12px 60px;position:sticky;top:0;
    max-height:100vh;overflow-y:auto;border-right:1px solid var(--border);}
  .sidebar h2{font-size:.72rem;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);
    margin:18px 8px 8px;}
  .navitem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:none;
    background:transparent;color:var(--txt);padding:9px 10px;border-radius:8px;cursor:pointer;
    font-size:.9rem;transition:.12s;border:1px solid transparent;}
  .navitem:hover{background:var(--panel2);}
  .navitem.active{background:#13233f;border-color:var(--accent);color:#fff;}
  .navitem .dot{width:7px;height:7px;border-radius:50%;background:transparent;flex:0 0 7px;
    border:1px solid var(--border);}
  .navitem.seen .dot{background:var(--ok);border-color:var(--ok);}
  .navitem .nx{color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto;}

  /* ---- MAIN ---- */
  .main{flex:1 1 auto;min-width:0;padding:24px 30px 90px;max-width:860px;}
  h1{font-size:1.5rem;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:.92rem;margin:0 0 18px;}
  .sfhead{border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:8px;}
  .sfhead h1{font-size:1.55rem;}
  .meta{color:var(--muted);font-size:.82rem;margin-top:6px;}

  .section{margin:26px 0;}
  .section > h3{font-size:1.02rem;color:var(--accent2);margin:0 0 10px;
    display:flex;align-items:center;gap:10px;}
  .section > h3 .tag{font-size:.66rem;font-weight:700;letter-spacing:.4px;background:var(--panel2);
    border:1px solid var(--border);color:var(--muted);padding:2px 8px;border-radius:20px;
    text-transform:uppercase;}
  /* --- blocchi figura --- */
  .section > h3 .tag.plottag{background:#101f2e;border-color:#1f3c57;color:#7ab8e0;}
  .plot-intro{color:var(--muted);font-size:.95rem;margin:0 0 12px;}
  .plot-row{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;
    background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;}
  .plot-row.due .plot-box{flex:1 1 300px;min-width:280px;}
  .plot-box{max-width:560px;}
  .plot-leggi{margin-top:10px;background:var(--panel2);border:1px solid var(--border);
    border-left:3px solid #4a8fc7;border-radius:0 10px 10px 0;padding:11px 14px;
    font-size:.93rem;color:var(--muted);}
  .plot-leggi b{color:#7ab8e0;}
  .plot-err{color:#ff6b6b;font-size:.85rem;}
  .open-body{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
  .open-body p:first-child{margin-top:0;} .open-body p:last-child{margin-bottom:0;}
  .open-body ul{margin:.4em 0;padding-left:1.2em;} .open-body li{margin:.35em 0;}

  .note{background:var(--panel2);border-left:3px solid var(--muted);border-radius:6px;
    padding:9px 12px;margin:12px 0;font-size:.9rem;color:var(--muted);}
  .note b{color:#ff9d6b;}
  .note.warn{background:var(--warnbg);border-left-color:var(--warn);color:#e0b85a;}
  .note.warn b{color:#f0c25a;}

  /* ---- GRAMMATICA ---- */
  .gramwrap{background:var(--grambg);border:1px solid #1f4d47;border-radius:12px;padding:6px 6px;}
  table.gramtab{border-collapse:collapse;width:100%;font-size:.92rem;}
  table.gramtab td{padding:9px 12px;vertical-align:top;border-bottom:1px solid #17332e;}
  table.gramtab tr:last-child td{border-bottom:none;}
  table.gramtab td.gs{white-space:nowrap;color:var(--gram);width:1%;
    border-right:1px solid #17332e;font-variant-numeric:tabular-nums;}
  .section > h3 .tag.gramtag{background:var(--grambg);border-color:#1f4d47;color:var(--gram);}

  /* ---- STRUMENTI (repertorio condiviso: la scheda si apre DENTRO la frase) ----
     Nessun accento nuovo: riusa il verde della grammatica, perche' uno strumento
     richiamato e' grammatica gia' spiegata altrove, non una quinta specie di blocco. */
  .str{color:var(--gram);border-bottom:1px dashed var(--gram);cursor:pointer;}
  .str:hover{background:var(--grambg);}
  .str::after{content:"\2666";font-size:.62em;vertical-align:.42em;margin-left:2px;opacity:.8;}
  .str.aperto::after{content:"\2715";}
  .str.rotto{color:#ff6b6b;border-bottom-color:#ff6b6b;cursor:help;}
  /* la scheda e' uno SPAN in display:block, non un div: i rimandi cadono dentro
     <p>, <li> e celle di tabella, dove un div e' HTML illegale. */
  .strcard{display:block;margin:10px 0;background:var(--grambg);border:1px solid #1f4d47;
    border-left:3px solid var(--gram);border-radius:0 10px 10px 0;padding:10px 14px;font-size:.9rem;}
  .strcard .sh{display:block;font-size:.66rem;font-weight:700;letter-spacing:.5px;
    text-transform:uppercase;color:var(--gram);margin-bottom:7px;}
  .strcard .sr{display:block;margin:5px 0;}
  .strcard .sk{color:var(--gram);font-weight:600;}

  /* ---- PROLESSI (preannuncio fisico) ---- */
  .prowrap{background:var(--probg);border:1px solid var(--proedge);border-radius:12px;padding:4px 4px 8px;}
  .prohead{padding:11px 14px 4px;color:var(--pro);font-size:.72rem;font-weight:700;letter-spacing:.7px;
    text-transform:uppercase;}
  .pro-oggetto{padding:2px 14px 11px;color:var(--muted);font-size:.92rem;border-bottom:1px solid var(--proline);
    margin-bottom:2px;} .pro-oggetto b{color:var(--txt);}
  table.protab{border-collapse:collapse;width:100%;font-size:.92rem;}
  table.protab td{padding:10px 12px;vertical-align:top;border-bottom:1px solid var(--proline);}
  table.protab tr:last-child td{border-bottom:none;}
  table.protab td.pd{white-space:nowrap;color:var(--pro);width:1%;font-weight:700;font-size:.78rem;
    letter-spacing:.3px;text-transform:uppercase;border-right:1px solid var(--proline);line-height:1.3;}
  .pro-domanda{margin:8px 8px 2px;background:#140d26;border:1px solid var(--proedge);
    border-left:3px solid var(--pro);border-radius:8px;padding:10px 14px;font-size:.92rem;}
  .pro-domanda b{color:var(--pro);}
  .section > h3 .tag.protag{background:var(--probg);border-color:var(--proedge);color:var(--pro);}

  /* ---- REVEAL ---- */
  .rsteps{display:flex;flex-direction:column;gap:12px;}
  .rstep{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 18px;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .rlabel{font-size:.7rem;font-weight:700;letter-spacing:.4px;color:var(--accent);
    text-transform:uppercase;margin-bottom:8px;}
  .rstep p:first-of-type{margin-top:0;} .rstep p:last-child{margin-bottom:0;}
  .rstep ul{margin:.4em 0;padding-left:1.2em;}
  .testo{background:#13233f;border:1px solid #2b4877;border-radius:12px;padding:14px 18px;margin-bottom:14px;}
  .testo .src{display:block;font-size:.74rem;font-style:italic;color:var(--accent2);margin-bottom:8px;
    text-transform:uppercase;letter-spacing:.3px;}
  .esame-nota{font-size:.9rem;color:var(--muted);font-style:italic;margin-top:12px;padding-left:12px;
    border-left:3px solid var(--border);}

  .reveal-btn{background:var(--accent);color:#fff;border:none;padding:11px 18px;border-radius:10px;
    font-size:.95rem;font-weight:600;cursor:pointer;margin-top:14px;transition:.12s;}
  .reveal-btn:hover:not(:disabled){background:var(--accent2);}
  .reveal-btn.small{padding:7px 14px;font-size:.85rem;margin-top:0;background:var(--panel2);
    color:var(--accent2);border:1px solid var(--border);}
  .reveal-btn.small:hover:not(:disabled){border-color:var(--accent);}
  .reveal-btn:disabled,.reveal-btn.done{background:var(--panel2);color:var(--muted);
    border:1px solid var(--border);cursor:default;}

  /* ---- COLLAUDO ---- */
  .collaudo-item{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 18px;margin-bottom:12px;}
  .cq{margin-bottom:10px;}
  .ca{margin-top:12px;background:var(--okbg);border:1px solid #235c33;border-radius:8px;
    padding:10px 14px;font-size:.94rem;}
  .ca b{color:#5fd980;}

  /* ---- PREV / NEXT ---- */
  .prevnext{display:flex;justify-content:space-between;gap:12px;margin-top:40px;
    border-top:1px solid var(--border);padding-top:20px;}
  .pnbtn{flex:1 1 0;background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:12px 16px;cursor:pointer;color:var(--txt);text-align:left;transition:.14s;font:inherit;}
  .pnbtn:hover{border-color:var(--accent);background:var(--panel2);}
  .pnbtn.next{text-align:right;}
  .pnbtn .k{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .pnbtn .t{font-weight:600;color:var(--accent2);}
  .pnbtn:disabled{opacity:.35;cursor:default;border-color:var(--border);background:var(--panel);}

  code{background:var(--panel2);border:1px solid var(--border);border-radius:5px;
    padding:1px 5px;font-size:.85em;color:var(--accent2);}
  .katex{font-size:1.02em;color:var(--txt);} .katex-display{margin:.5em 0;overflow-x:auto;overflow-y:hidden;}

  @media(max-width:860px){
    .shell{flex-direction:column;}
    .sidebar{width:100%;flex:none;position:static;max-height:none;border-right:none;
      border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:4px;}
    .sidebar h2{width:100%;} .navitem{width:auto;}
    .main{padding:20px 16px 80px;}
  }
</style>

function elFromHTML(html){ var d=document.createElement('div'); d.innerHTML=html; return d; }

/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un
   rimando scritto nella prosa:

       <span class="str" data-str="serie-geometrica">la serie geometrica</span>

   Le schede citate da questo nucleo sono cucite qui sotto dal montaggio
   (assembla-nucleo.js): la pagina resta autosufficiente — niente fetch,
   niente sottocartelle da pubblicare — e un rimando a una scheda che non
   esiste FERMA la costruzione invece di arrivare in pagina rotto.
   Apertura: lo stesso gesto del collaudo (si clicca, il pannello compare,
   si typeset una volta sola), portato dentro la frase.
   =================================================================== */
var CORSO = 'meccanica-quantistica';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["serie-di-potenze"] = {"nome":"Serie di potenze","riga":"Una somma $\\sum_{n\\ge0}a_n(x-x_0)^{n}$, che converge dentro un intervallo (in campo complesso: un disco) di raggio $R$ centrato in $x_0$ e diverge fuori.","serve":"È la classe di serie di funzioni che si comporta meglio di tutte: dentro il raggio converge uniformemente sui compatti, quindi si deriva e si integra termine a termine infinite volte, e i coefficienti sono quelli di Taylor. Il raggio si calcola col rapporto $|a_{n+1}/a_n|$ o con Cauchy–Hadamard, e sul bordo non si sa niente a priori: va studiato a parte.","esempio":"Per $\\sum_{n\\ge0}\\dfrac{x^{n}}{n!}$ il rapporto fra coefficienti consecutivi tende a $0$: il raggio è infinito e la somma è $e^{x}$ su tutto $\\mathbb{R}$. Per $\\sum_{n\\ge1}n\\,x^{n}$ tende invece a $1$, quindi $R=1$, e in $x=\\tfrac12$ la somma vale $2$.","pieno":{"file":"07-serie-funzioni.html","tappa":"04","come":"il raggio, la derivazione termine a termine e l'identità con Taylor, nel nucleo sulle serie di funzioni"},"qui":{"metodi-e-modelli":{"serve":"In campo complesso la serie di potenze non è una classe fra altre: è la definizione stessa di analitica, e il teorema che olomorfa $=$ analitica dice che ogni funzione derivabile in senso complesso è già una serie di potenze. Il raggio smette anche di essere un conto sui coefficienti e diventa geometria: è la distanza dal centro alla singolarità più vicina — ed è il primo dei due raggi della corona di Laurent.","esempio":"La regola geometrica spiega i raggi reali che sembravano arbitrari: $\\dfrac{1}{1+x^{2}}$ è liscia su tutto $\\mathbb{R}$, ma il suo sviluppo in $0$ ha raggio $1$, perché in $\\pm i$ la funzione esplode e $|i|=1$. Dentro quel raggio il conto chiude: in $z=\\tfrac12$ la serie $1-z^{2}+z^{4}-\\cdots$ vale $\\tfrac45$."}},"controllo":[{"tipo":"limite","espr":"1/(n+1)","var":"n","a":"oo","vale":"0","ipotesi":{"n":"positive"},"dove":"esempio","appare":"a $0$"},{"tipo":"limite","espr":"(n+1)/n","var":"n","a":"oo","vale":"1","ipotesi":{"n":"positive"},"dove":"esempio","appare":"a $1$"},{"tipo":"somma","espr":"n*(1/2)**n","var":"n","da":"1","a":"oo","vale":"2","dove":"esempio","appare":"vale $2$"},{"tipo":"uguale","sinistra":"Abs(I)","vale":"1","dove":"qui.metodi-e-modelli.esempio","appare":"|i|=1"},{"tipo":"somma","espr":"(-1)**n*(1/2)**(2*n)","var":"n","da":"0","a":"oo","vale":"4/5","dove":"qui.metodi-e-modelli.esempio","appare":"\\tfrac45"}]};
STRUM["singolarita-isolate"] = {"nome":"Singolarità isolate","riga":"Un punto $z_0$ in cui $f$ non è definita ma è olomorfa in tutto un disco forato $0\\lt|z-z_0|\\lt\\rho$ attorno, e che la parte principale del suo Laurent classifica in eliminabile, polo di ordine $m$, o essenziale.","serve":"È la classificazione che decide quale strumento si applica: parte principale assente vuol dire eliminabile (limite finito, residuo nullo); parte principale che si arresta a $(z-z_0)^{-m}$ vuol dire polo di ordine $m$ (e $|f|\\to\\infty$); infiniti termini vuol dire essenziale, e lì nessun limite esiste in alcun senso. Il criterio operativo non è guardare la funzione ma contare gli zeri: in un quoziente, ordine del polo $=$ zero del denominatore meno zero del numeratore.","esempio":"In $z=0$: $\\dfrac{\\sin z}{z}$ è eliminabile, perché il limite vale $1$ e la si ripara ridefinendola lì. $\\dfrac{1-\\cos z}{z^{3}}$ ha un polo semplice e non triplo, perché $1-\\cos z$ ha uno zero doppio e $3-2=1$: infatti $z\\cdot\\dfrac{1-\\cos z}{z^{3}}$ tende a $\\tfrac12$, che è anche il residuo. $e^{1/z}$ è essenziale: $z^{m}e^{1/z}$ se ne va lungo l'asse reale positivo per ogni $m$, e nessuna potenza la rende limitata.","pieno":{"file":"12b-laurent.html","tappa":"05","come":"le tre specie, i criteri equivalenti e le due insidie sull'ordine, nel nucleo su Laurent"},"controllo":[{"tipo":"limite","espr":"sin(z)/z","var":"z","a":"0","vale":"1","dove":"esempio","appare":"vale $1$"},{"tipo":"limite","espr":"(1-cos(z))/z**2","var":"z","a":"0","vale":"1/2","dove":"esempio","appare":"\\tfrac12"},{"tipo":"uguale","sinistra":"3-2","vale":"1","dove":"esempio","appare":"3-2=1"}]};
STRUM["operatore-aggiunto"] = {"nome":"Operatore aggiunto e autoaggiunto","riga":"L'aggiunto e' definito da $\\langle\\phi|\\hat A\\psi\\rangle=\\langle\\hat A^{\\dagger}\\phi|\\psi\\rangle$ per ogni coppia di stati, e l'operatore e' autoaggiunto quando coincidono sia $\\hat A^{\\dagger}$ con $\\hat A$ sia i loro domini.","serve":"E' la condizione che rende un operatore un'osservabile: autovalori reali, e autovettori di autovalori distinti ortogonali. In dimensione finita «autoaggiunto» e «hermitiano» coincidono; in dimensione infinita no, e la differenza non e' pedanteria — l'operatore impulso su una semiretta e' hermitiano e non autoaggiunto, e infatti non e' un'osservabile.","esempio":"Se $\\hat A\\psi=a\\psi$ con $\\hat A$ autoaggiunto, allora $a\\langle\\psi|\\psi\\rangle=\\langle\\psi|\\hat A\\psi\\rangle=\\langle\\hat A\\psi|\\psi\\rangle=a^{*}\\langle\\psi|\\psi\\rangle$; siccome la norma non e' nulla segue $a=a^{*}$, cioe' l'autovalore e' reale. Tre righe, e sono la ragione per cui le osservabili si rappresentano cosi'.","debito":"la distinzione fra hermitiano e autoaggiunto in dimensione infinita — domini, estensioni, indici di difetto — e' il programma di von Neumann e sta fuori da questo percorso: qui si dichiara che esiste e si lavora nel caso buono. La regola di inversione dell'ordine nell'aggiunto di un prodotto si usa e non si dimostra.","controllo":[{"tipo":"uguale","sinistra":"conjugate(a)","vale":"a","ipotesi":{"a":"real"},"dove":"esempio","appare":"a=a^{*}"}],"qui":{},"pieno":null};
STRUM["proiettore-ortogonale"] = {"nome":"Proiettore ortogonale","riga":"Un proiettore ortogonale e' un operatore $\\hat P$ che soddisfa due condizioni insieme: $\\hat P^2=\\hat P$ (idempotenza — proiettare due volte equivale a proiettare una volta) e $\\hat P^{\\dagger}=\\hat P$ (autoaggiuntezza, che rende la proiezione perpendicolare al sottospazio invece che obliqua).","serve":"E' il mattone di tutta la teoria della misura: $\\hat P=|\\psi\\rangle\\langle\\psi|$ su un ket normalizzato e' l'osservabile «lo stato e' $|\\psi\\rangle$?» con esiti $1$ e $0$, e il suo valor medio e' la probabilita'. L'identita' si scrive come somma di proiettori, $\\mathbb 1=\\sum_i\\hat P_i$, ed e' con questa che si cambia base e si decompone un'osservabile.","esempio":"Da $|\\psi\\rangle=(\\tfrac35,\\tfrac45)$ normalizzato si costruisce $\\hat P=|\\psi\\rangle\\langle\\psi|$ con entrate $\\tfrac{9}{25},\\tfrac{12}{25},\\tfrac{16}{25}$. L'elemento $(1,1)$ di $\\hat P^2$ vale $(\\tfrac{9}{25})^2+(\\tfrac{12}{25})^2=\\tfrac{9}{25}$, cioe' $\\hat P^2=\\hat P$; la traccia e' $\\tfrac{9}{25}+\\tfrac{16}{25}=1$, come per ogni proiettore di rango uno.","debito":"la decomposizione spettrale di un operatore autoaggiunto con spettro continuo in una famiglia di proiettori $E(\\lambda)$ (la misura spettrale) sta fuori da qui: si usa il caso discreto, dove i proiettori sono $|i\\rangle\\langle i|$.","controllo":[{"tipo":"simbolico","dove":"esempio","appare":"\\hat P^2=\\hat P","perche":"e' l'idempotenza, meta' della definizione di proiettore: un'identita' fra operatori, non un conto numerico. Il caso concreto che la sostiene e' l'entrata $(1,1)$ asserita qui sotto, dove i numeri ci sono"},{"tipo":"uguale","sinistra":"(Rational(9,25))**2+(Rational(12,25))**2","vale":"9/25","dove":"esempio","appare":"(\\tfrac{9}{25})^2+(\\tfrac{12}{25})^2=\\tfrac{9}{25}"},{"tipo":"uguale","sinistra":"Rational(9,25)+Rational(16,25)","vale":"1","dove":"esempio","appare":"\\tfrac{9}{25}+\\tfrac{16}{25}=1"}],"qui":{},"pieno":null};
STRUM["integrale-gaussiano"] = {"nome":"Integrale gaussiano","riga":"$\\displaystyle\\int_{-\\infty}^{+\\infty} e^{-ax^{2}}\\,dx=\\sqrt{\\pi/a}$ per $a\\gt 0$, e $\\displaystyle\\int_{-\\infty}^{+\\infty} x^{2}e^{-ax^{2}}\\,dx=\\tfrac12\\sqrt{\\pi/a^{3}}$.","serve":"E' l'unico integrale che serve davvero sapere a memoria in meccanica statistica, perche' l'energia cinetica e' quadratica nell'impulso e quindi ogni integrazione sugli impulsi e' una gaussiana. Il trucco della dimostrazione — elevare al quadrato e passare in coordinate polari — vale la pena di vederlo una volta: e' il motivo per cui compare un $\\pi$ in una formula che di cerchi non parla.","esempio":"Da $I^{2}=\\iint e^{-a(x^{2}+y^{2})}dx\\,dy=\\int_0^\\infty 2\\pi r\\,e^{-ar^{2}}dr=\\pi/a$ segue $I=\\sqrt{\\pi/a}$. I momenti superiori si ottengono derivando rispetto ad $a$ sotto il segno: $-\\partial_a I=\\int x^{2}e^{-ax^{2}}dx=\\tfrac12\\sqrt{\\pi}\\,a^{-3/2}$. Derivare rispetto a un parametro e' piu' rapido che integrare per parti, e funziona per tutti i momenti pari.","debito":"il caso di esponente immaginario — l'integrale di Fresnel $\\int e^{iax^{2}}dx$, che si ottiene ruotando il cammino nel piano complesso e che in meccanica quantistica e' il propagatore libero — non sta qui: in tutte le gaussiane di questo percorso $a$ e' reale e positivo, e la convergenza non e' in discussione.","controllo":[{"tipo":"integrale","espr":"exp(-a*x**2)","var":"x","da":"-oo","a":"oo","vale":"sqrt(pi/a)","ipotesi":{"a":"positive","x":"real"},"dove":"riga","appare":"\\sqrt{\\pi/a}"},{"tipo":"integrale","espr":"x**2*exp(-a*x**2)","var":"x","da":"-oo","a":"oo","vale":"sqrt(pi/a**3)/2","ipotesi":{"a":"positive","x":"real"},"dove":"riga","appare":"\\tfrac12\\sqrt{\\pi/a^{3}}"},{"tipo":"integrale","espr":"2*pi*r*exp(-a*r**2)","var":"r","da":"0","a":"oo","vale":"pi/a","ipotesi":{"a":"positive","r":"positive"},"dove":"esempio","appare":"2\\pi r\\,e^{-ar^{2}}dr=\\pi/a"},{"tipo":"integrale","espr":"x**2*exp(-a*x**2)","var":"x","da":"-oo","a":"oo","vale":"sqrt(pi)*a**Rational(-3,2)/2","ipotesi":{"a":"positive","x":"real"},"dove":"esempio","appare":"\\tfrac12\\sqrt{\\pi}\\,a^{-3/2}"},{"tipo":"integrale","espr":"exp(-b*p**2/(2*m))","var":"p","da":"-oo","a":"oo","vale":"sqrt(2*pi*m/b)","ipotesi":{"b":"positive","m":"positive","p":"real"},"dove":"qui.meccanica-statistica.esempio","appare":"\\sqrt{2\\pi m/\\beta}"},{"tipo":"uguale","sinistra":"V/(h/sqrt(2*pi*m*k*T))**3","vale":"V*(2*pi*m*k*T)**Rational(3,2)/h**3","ipotesi":{"V":"positive","h":"positive","m":"positive","k":"positive","T":"positive"},"dove":"qui.meccanica-statistica.esempio","appare":"V/\\lambda^{3}"},{"tipo":"uguale","sinistra":"integrate(p**2/(2*m)*exp(-b*p**2/(2*m)),(p,-oo,oo))/integrate(exp(-b*p**2/(2*m)),(p,-oo,oo))","vale":"1/(2*b)","ipotesi":{"b":"positive","m":"positive","p":"real"},"dove":"qui.meccanica-statistica.esempio","appare":"1/2\\beta=\\tfrac12 kT"}],"pieno":null,"qui":{"meccanica-statistica":{"serve":"La funzione di partizione di una particella libera e' un prodotto di tre gaussiane negli impulsi, e da li' esce la lunghezza d'onda termica $\\lambda=h/\\sqrt{2\\pi m k T}$ — che e' la grandezza con cui si misura quando un gas smette di essere classico.","esempio":"$\\int e^{-\\beta p^{2}/2m}dp=\\sqrt{2\\pi m/\\beta}$, quindi $Z_{1}=\\dfrac{V}{h^{3}}(2\\pi mkT)^{3/2}=V/\\lambda^{3}$, che e' la stessa cosa scritta due volte perche' $\\lambda=h/\\sqrt{2\\pi mkT}$. Lo stesso integrale col peso $p^{2}$ da' $\\langle p^{2}/2m\\rangle=1/2\\beta=\\tfrac12 kT$ per grado di liberta': l'equipartizione non e' un principio a parte, e' questo integrale."}}};
STRUM["raggio-di-bohr"] = {"nome":"Raggio di Bohr","riga":"$a_0=4\\pi\\varepsilon_0\\hbar^{2}/(m_ee^{2})\\simeq0{,}529\\times10^{-10}$ m, con energia associata $E_1\\simeq-13{,}6$ eV.","serve":"E' la scala di lunghezza dell'atomo, e si ottiene senza risolvere niente: si minimizza la somma fra il costo cinetico dell'indeterminazione, che va come l'inverso del quadrato del raggio, e l'attrazione coulombiana, che va come l'inverso del raggio. Serve come controllo d'ordine di grandezza su ogni risultato atomico: se un conto da' una lunghezza mille volte diversa, il conto e' sbagliato.","esempio":"I livelli vanno come l'inverso del quadrato del numero quantico principale, quindi il secondo vale $-3{,}4$ eV e la prima riga di Lyman ha energia $10{,}2$ eV. Il raggio medio cresce col quadrato: lo stato con numero quantico dieci e' $10^{2}=100$ volte piu' grande del fondamentale, ed e' la ragione fisica per cui gli atomi di Rydberg sono enormi.","debito":"la derivazione completa dall'equazione radiale sta nel movimento sull'idrogeno; qui ci sono la stima variazionale e i numeri da ricordare.","controllo":[{"tipo":"numero","espr":"-13.6/4","vale":"-3.4","dove":"esempio","appare":"-3{,}4"},{"tipo":"numero","espr":"-13.6/4 - (-13.6)","vale":"10.2","dove":"esempio","appare":"10{,}2"},{"tipo":"uguale","sinistra":"10**2","vale":"100","dove":"esempio","appare":"10^{2}=100"}],"qui":{},"pieno":null};
STRUM["elettronvolt"] = {"nome":"Elettronvolt","riga":"L'energia che un elettrone acquista attraversando una differenza di potenziale di un volt: $1\\ \\mathrm{eV}=1{,}602\\cdot10^{-19}$ J; divisa per $c^{2}$ è una massa, $1\\ \\mathrm{eV}/c^{2}=1{,}783\\cdot10^{-36}$ kg.","serve":"A leggere senza conversioni le tabelle in cui la fisica delle particelle e l'astrofisica scrivono le masse a riposo come energie — l'elettrone 0,511 MeV, il protone 938 MeV, il bosone di Higgs 125 GeV. La scelta non è una bizzarria di notazione: in un processo la quantità che si conserva è l'energia, e scrivere la massa già in energia dice a colpo d'occhio quali reazioni sono possibili e quante ne resta per l'energia cinetica o per i fotoni. L'elettronvolt ha anche un secondo mestiere, e in astrofisica è il più usato dei due: convertito in temperatura tramite $k_BT$ dà la scala termica a cui un processo di quella energia diventa frequente, e questo è ciò che permette di dire a che punto della storia dell'universo o a che profondità di una stella un certo processo si accende.","esempio":"Dalla massa del protone espressa come energia, $938{,}3$ MeV, si ricavano i chilogrammi in un passaggio: $m_p=938{,}3\\cdot10^{6}\\cdot1{,}783\\cdot10^{-36}=1{,}673\\cdot10^{-27}$ kg, che è il valore stampato in calce al foglio d'esame. Sul versante termico, $T=\\dfrac{1{,}602\\cdot10^{-19}}{1{,}381\\cdot10^{-23}}=11600$ K: un'energia di un elettronvolt corrisponde a poco più di undicimila kelvin, e siccome ionizzare l'idrogeno costa 13,6 eV si capisce subito perché serva una fotosfera da qualche decina di migliaia di kelvin per trovarlo ionizzato.","pieno":{"file":"as-01-la-scala-del-cosmo.html","tappa":"05","come":"le masse delle particelle elementari scritte come energie, con la conversione in chilogrammi e la gerarchia delle masse, nel movimento sulla scala del cosmo"},"controllo":[{"tipo":"numero","espr":"1.602177e-19/(2.99792458e8)**2*1e36","vale":"1.783","dove":"riga","appare":"1,783\\cdot10^{-36}"},{"tipo":"numero","espr":"938.3e6*1.783e-36*1e27","vale":"1.673","dove":"esempio","appare":"1,673\\cdot10^{-27}"},{"tipo":"numero","espr":"1.602e-19/1.381e-23","vale":"11600","dove":"esempio","appare":"11600"}]};
STRUM["ordini-di-grandezza"] = {"nome":"Ordini di grandezza","riga":"Stimare una quantità alla potenza di dieci giusta: si tiene una cifra significativa, si sommano e si sottraggono gli esponenti, e si controlla che l'unità del risultato sia quella che si voleva.","serve":"A sapere se un risultato è plausibile prima di averlo calcolato con precisione, e ad accorgersi di un errore di impostazione quando c'è ancora tempo per rimediare. In astrofisica non è una comodità ma il modo normale di ragionare, per due ragioni: le grandezze in gioco vanno da $10^{-36}$ kg a $10^{53}$ kg e nessuna intuizione le copre, e i dati osservativi sono noti al dieci o al venti per cento, quindi una cifra significativa è spesso tutto ciò che il problema contiene davvero. Il controllo che smaschera più errori non è sul numero, è sull'**unità**: un conto che dovrebbe dare una densità e dà dei kg è sbagliato nell'impostazione, e nessun affinamento dell'aritmetica lo salverà. La seconda regola è il confronto con un termine noto — l'acqua per una densità, il Sole per una massa o una luminosità, il parsec per una distanza galattica — perché un numero senza metro non dice niente.","esempio":"Densità media del Sole, dalle due sole quantità stampate in calce al foglio d'esame, $M_\\odot=1{,}989\\cdot10^{30}$ kg e $R_\\odot=6{,}957\\cdot10^{8}$ m: $\\rho=\\dfrac{3M_\\odot}{4\\pi R_\\odot^{3}}=1410\\ \\mathrm{kg/m^3}$. Il confronto è immediato e istruttivo: è quasi una volta e mezza l'acqua, cioè il Sole è in media meno denso della Terra — una stella non è un sasso grande, è un gas tenuto insieme dal proprio peso.","pieno":{"file":"as-01-la-scala-del-cosmo.html","tappa":"01","come":"la gerarchia delle strutture cosmiche letta come scala di ordini di grandezza, e il tempo di luce come secondo asse della stessa tabella"},"controllo":[{"tipo":"numero","espr":"3*1.989e30/(4*pi*(6.957e8)**3)","vale":"1410","dove":"esempio","appare":"1410"}]};
STRUM["spettro"] = {"nome":"Spettro di un operatore","riga":"Lo spettro di un operatore e' l'insieme dei possibili esiti di una misura — i suoi autovalori — e puo' essere discreto (autovalori separati, autovettori in $\\mathcal H$), continuo (autovalori che riempiono un intervallo, autovettori non normalizzabili), o misto.","serve":"E' la quantita' che la fisica chiede davvero: scrivere l'hamiltoniana e trovarne lo spettro E' il problema d'esame. La distinzione discreto/continuo non e' tecnica — decide se un autostato e' uno stato preparabile (discreto) o una distribuzione che vive fuori dallo spazio di Hilbert (continuo), come l'onda piana e la delta.","esempio":"Per $\\sigma_z=\\begin{pmatrix}1&0\\\\0&-1\\end{pmatrix}$ lo spettro e' $\\{+1,-1\\}$, discreto, e i due invarianti della matrice lo riassumono senza risolvere l'equazione secolare: la somma degli autovalori e' la traccia, $\\operatorname{tr}\\sigma_z=0$, il loro prodotto e' il determinante, $\\det\\sigma_z=-1$. Per l'operatore posizione lo spettro e' tutta la retta reale, continuo, e gli autovettori sono delte di Dirac.","debito":"la costruzione rigorosa dello spettro continuo (teorema spettrale generalizzato, misura spettrale $E(\\lambda)$ di von Neumann) sta fuori da questo percorso: qui si dichiara che esiste e si lavora coi casi concreti. La separazione fra spettro continuo e spettro residuo non si tratta.","controllo":[{"tipo":"uguale","sinistra":"Matrix([[1,0],[0,-1]]).trace()","vale":"0","dove":"esempio","appare":"\\operatorname{tr}\\sigma_z=0"},{"tipo":"uguale","sinistra":"Matrix([[1,0],[0,-1]]).det()","vale":"-1","dove":"esempio","appare":"\\det\\sigma_z=-1"}],"qui":{},"pieno":null};
STRUM["teorema-della-divergenza"] = {"nome":"Teorema della divergenza","riga":"Il flusso uscente da una superficie chiusa è l'integrale della divergenza sul volume che racchiude: $\\oint_{\\partial V}\\mathbf F\\cdot\\hat n\\,dS=\\int_V\\nabla\\cdot\\mathbf F\\,dV$.","serve":"Scambia una domanda sul bordo con una sul volume. A destra c'è la divergenza, che è la densità di sorgente punto per punto; a sinistra il totale che esce. Si usa nei due versi: per calcolare un flusso scomodo con un integrale di volume comodo, e — in fisica soprattutto — per passare da una legge integrale a una legge locale, perché se due integrali di volume coincidono per OGNI volume allora coincidono gli integrandi.","esempio":"Per $\\mathbf F=\\mathbf r=(x,y,z)$ la divergenza vale $3$, quindi sulla palla di raggio $R$ il membro destro è $3\\cdot\\tfrac43\\pi R^{3}=4\\pi R^{3}$; il membro sinistro, calcolato come flusso, è il modulo $R$ per l'area $4\\pi R^{2}$, e dà lo stesso numero.","pieno":{"file":"05-teoremi-integrali.html","tappa":"02","come":"l'enunciato, la dimostrazione a fette e le ipotesi vere sul dominio, nel nucleo dei teoremi integrali"},"qui":{"elettromagnetismo":{"serve":"È il passaggio che trasforma la legge di Gauss integrale nella prima equazione di Maxwell, $\\nabla\\cdot\\mathbf E=\\rho/\\varepsilon_0$, e la conservazione della carica nell'equazione di continuità $\\nabla\\cdot\\mathbf J+\\partial_t\\rho=0$. La mossa è sempre la stessa: si scrive la legge su un volume arbitrario, si porta il flusso dentro come integrale di divergenza, e si osserva che un integrale nullo su OGNI volume obbliga l'integrando a essere nullo. L'arbitrarietà del volume non è un dettaglio: è tutta la dimostrazione.","esempio":"Per il campo di una carica puntiforme, di modulo $\\dfrac{q}{4\\pi\\varepsilon_0r^{2}}$ e diretto radialmente, la divergenza è nulla ovunque tranne nell'origine: in coordinate sferiche la divergenza di un campo radiale si scrive con $\\partial_r\\!\\left(r^{2}E_r\\right)$, e qui $r^{2}E_r$ non dipende da $r$, quindi la derivata fa $0$. Tutta la carica è finita nel punto escluso, ed è esattamente il buco che la $\\delta$ di Dirac serve a riempire."}},"controllo":[{"tipo":"uguale","sinistra":"diff(x,x)+diff(y,y)+diff(z,z)","vale":"3","dove":"esempio","appare":"vale $3$"},{"tipo":"uguale","sinistra":"3*(4/3)*pi*R**3","vale":"4*pi*R**3","dove":"esempio","appare":"4\\pi R^{3}"},{"tipo":"derivata","espr":"r**2*(q/(4*pi*e0*r**2))","rispetto":["r"],"vale":"0","dove":"qui.elettromagnetismo.esempio","appare":"la derivata fa $0$"}]};

function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';
  return h;
}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

/* ---------------- 00 · DI COSA PARLA QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Di cosa parla questo movimento', meta:'Meccanica Quantistica · voce Q.16 · correggere un livello senza risolvere il problema · che cosa vuol dire piccolo per un operatore · tre fatti che diventano strumenti di stima',
  blocchi:[
  {t:'prosa', title:'La domanda, e perché è più sottile di come sembra', tag:'architettura', html:R`
  <p>I problemi che la meccanica quantistica sa risolvere esattamente si contano sulle dita: la particella libera, le buche costanti a tratti, l&rsquo;oscillatore armonico, l&rsquo;atomo di idrogeno senza nient&rsquo;altro intorno. Picasso apre il suo capitolo dichiarando il prezzo di questa scarsità: <i>«proprio nei casi più interessanti (atomi con più di un elettrone, atomi in presenza di un campo elettrico o magnetico esterno, ecc.), la hamiltoniana è così complicata che non c&rsquo;è speranza di trovare la soluzione esatta del problema agli autovalori. Affinché quindi la teoria generale non risulti sterile è necessario avere a disposizione dei metodi, possibilmente semplici»</i>. Landau dice la stessa cosa con un tono più operativo: nei problemi reali <i>«figurano spesso grandezze piccole trascurando le quali il problema si semplifica»</i>, e <i>«il metodo generale che permette di calcolare queste correzioni si chiama teoria delle perturbazioni»</i>.</p>
  <p>La struttura del problema si scrive in una riga: la hamiltoniana vera è</p>
  $$H=H_{0}+\lambda V,$$
  <p>dove di $H_{0}$ si conoscono autovalori $E_{n}^{(0)}$ e autovettori $|n\rangle$, e $\lambda V$ è «piccolo». Si vogliono gli autovalori $E_{n}$ e gli autovettori di $H$ come correzioni successive di quelli di $H_{0}$. Il parametro $\lambda$ può essere fisico (l&rsquo;intensità di un campo esterno) oppure, come dice Ballentine, <i>«a fictitious parameter introduced for mathematical convenience, in which case we will set $\lambda=1$ at the end of the analysis»</i>: serve a contare quante volte la perturbazione entra in un termine.</p>
  <p>La parola difficile è «piccolo». Picasso la mette subito sotto accusa: <i>«$H'$ è un operatore, quasi sempre non limitato, e non è molto chiaro cosa voglia dire che è piccolo: il significato di questa affermazione verrà chiarito per gradi nel corso di questa discussione»</i>. Un campo elettrico uniforme dà $V=e\mathcal E z$, che cresce senza limite quando $z\to\infty$; un termine anarmonico $\beta x^{4}$ domina l&rsquo;oscillatore a grande distanza, per quanto piccolo sia $\beta$. In nessuno dei due casi esiste un numero che misuri la «taglia» dell&rsquo;operatore. Eppure la teoria delle perturbazioni funziona benissimo in entrambi, per i livelli bassi. <b>Questo movimento è la risposta a questa tensione</b>: costruisce la serie, e il criterio di piccolezza esce dalla costruzione invece di essere messo all&rsquo;inizio.</p>`},
  {t:'prosa', title:'Come è fatto il movimento', tag:'architettura', html:R`
  <p><b>Il primo blocco costruisce il metodo.</b> La tappa 01 risolve esattamente un sistema a due livelli e ne sviluppa gli autovalori in serie: è lì che si vede da dove viene il criterio «elemento di matrice piccolo rispetto alla distanza fra i livelli», e che la serie ha un raggio di convergenza finito, fissato da singolarità nel piano complesso di $\lambda$. La 02 costruisce la serie per una hamiltoniana qualunque, ordine per ordine, con le notazioni di Ballentine, di Sakurai, di Landau e — per la voce di chi l&rsquo;ha fondata — di Dirac. La 03 mostra che il primo ordine è un valor medio, per due vie diverse, e lo verifica dove si sa il risultato esatto.</p>
  <p><b>Il secondo blocco è il mestiere.</b> La 04 applica il primo ordine a due esercizi d&rsquo;esame veri. La 05 calcola la correzione allo stato, la sua norma, e la probabilità che il sistema perturbato «resti» nello stato imperturbato. La 06 è il secondo ordine: la formula, il segno sul fondamentale, la repulsione dei livelli e il teorema di non incrocio. La 07 mette la serie davanti a due problemi che si sanno risolvere esattamente e la confronta termine a termine. La 08 è l&rsquo;oscillatore anarmonico di Landau, il primo problema in cui due ordini diversi contribuiscono alla stessa potenza del parametro.</p>
  <p><b>Il terzo blocco è dove la serie si ferma, e che cosa succede nei sistemi veri.</b> La 09 raccoglie i criteri di validità — quello a posteriori di Picasso, quello di Landau, il raggio di convergenza di Sakurai — e mostra un caso in cui la serie non esiste affatto; poi i livelli quasi degeneri, e la serie di Brillouin-Wigner che li tratta meglio. La 10 è l&rsquo;effetto Stark quadratico e la polarizzabilità dell&rsquo;idrogeno, stimata dall&rsquo;alto e poi calcolata esattamente col metodo di Dalgarno e Lewis. La 11 è il livello fondamentale dell&rsquo;elio, il caso in cui la perturbazione non è piccola e il primo ordine sbaglia di quattro elettronvolt. La 12 sono le forze di van der Waals, un effetto che esiste <i>solo</i> al secondo ordine. La 13 tira il bilancio, con le divergenze fra le fonti.</p>
  <p><b>Che cosa questo movimento non fa.</b> Non tratta il caso degenere se non nel punto in cui la serie non degenere si rompe: la diagonalizzazione nel sottospazio degenere è un problema a sé. Non tratta le perturbazioni dipendenti dal tempo né il metodo variazionale, che il programma del corso esclude esplicitamente. E non calcola la serie oltre il terzo ordine: Dirac ricorda che <i>«delle formule ricorrenti del tutto generali, che danno le correzioni dell&rsquo;$n$-esimo ordine in funzione di quelle di ordine inferiore, sono state ricavate da Born, Heisenberg e Jordan»</i>, e la tappa 02 dà la formula da cui ognuna si ricava.</p>`}
]},
/* ---------------- 01 · IL PROBLEMA A DUE LIVELLI ---------------- */
{ num:'01', title:'Un problema a due livelli risolto esattamente: dove nasce la serie e dove muore', meta:'la matrice due per due e la sua equazione secolare · lo sviluppo della radice e il criterio di Picasso · il raggio di convergenza fissato da punti fuori dall asse reale · la serie che diverge mentre la funzione resta liscia',
  blocchi:[
  {t:'prosa', title:'Perché cominciare da un caso che non ha bisogno del metodo', tag:'architettura', html:R`
  <p>Picasso, Sakurai e Ballentine fanno tutti e tre la stessa scelta prima di costruire il formalismo: prendono un sistema con due soli stati, dove gli autovalori si trovano risolvendo un&rsquo;equazione di secondo grado, e guardano che cosa succede sviluppandoli in serie. Picasso lo dichiara «il caso semplice (e fittizio)» e lo usa per una trattazione che chiama euristica; Sakurai lo usa per far vedere che lo sviluppo in $\lambda$ <i>«might indeed be valid»</i>, e subito dopo per mostrare quando non lo è. La ragione è che qui si può confrontare la serie con la risposta esatta, termine per termine, e quindi vedere <b>da dove viene</b> la condizione di piccolezza invece di doverla credere.</p>
  <p>Nella base dei due autovettori imperturbati $|1\rangle,|2\rangle$, con energie $E_{1},E_{2}$ e $E_{1}\gt E_{2}$, la hamiltoniana completa è rappresentata dalla matrice</p>
  $$H=\begin{pmatrix}E_{1}&\lambda V\\ \lambda V^{*}&E_{2}\end{pmatrix},$$
  <p>dove la perturbazione ha solo elementi fuori diagonale. Non è una restrizione: Picasso tiene anche gli elementi diagonali $H'_{11},H'_{22}$, ma questi si limitano a spostare i due livelli di partenza e si possono assorbire in $E_{1},E_{2}$; ciò che conta, e che è nuovo, è l&rsquo;elemento che <i>collega</i> i due stati. L&rsquo;hermiticità impone che l&rsquo;elemento in basso a sinistra sia il complesso coniugato di quello in alto a destra, e Sakurai osserva che si può sempre scegliere la fase relativa di $|2\rangle$ in modo che $V$ sia reale e positivo.</p>`},
  {t:'reveal', title:'Gli autovalori esatti, e il loro sviluppo', tag:'costruzione', steps:[
   {label:'L’equazione secolare', body:R`
   <p>Gli autovalori annullano il determinante di $H-E\,\mathbb 1$:</p>
   $$(E_{1}-E)(E_{2}-E)-\lambda^{2}|V|^{2}=0,$$
   <p>un&rsquo;equazione di secondo grado in $E$. Chiamando $\Delta=E_{1}-E_{2}\gt 0$ la distanza fra i livelli imperturbati, le due radici sono</p>
   $$E_{\pm}=\frac{E_{1}+E_{2}}{2}\pm\sqrt{\frac{\Delta^{2}}{4}+\lambda^{2}|V|^{2}}.$$
   <p>Per $\lambda=0$ la radice vale $\Delta/2$, e $E_{+}$ torna a $E_{1}$, $E_{-}$ a $E_{2}$: ogni autovalore perturbato «sa» da quale livello imperturbato proviene, che è la premessa di tutto il metodo.</p>`},
   {label:'Lo sviluppo in potenze di lambda', body:R`
   <p>Si raccoglie $\Delta/2$ sotto la radice e si sviluppa $\sqrt{1+y}=1+\tfrac12 y-\tfrac18 y^{2}+\dots$ con $y=4\lambda^{2}|V|^{2}/\Delta^{2}$. Il risultato per il livello che parte da $E_{1}$ è</p>
   $$E_{+}=E_{1}+\frac{\lambda^{2}|V|^{2}}{\Delta}-\frac{\lambda^{4}|V|^{4}}{\Delta^{3}}+\dots$$
   <p>Tre cose si leggono subito. <b>Non c&rsquo;è termine lineare in $\lambda$</b>: la perturbazione non ha elemento diagonale, quindi al primo ordine nessuno dei due livelli si muove. <b>Il primo termine non nullo è quadratico</b> e ha la forma «elemento di matrice al quadrato diviso differenza di energie»: è il prototipo della formula del secondo ordine che la tappa 06 ricaverà in generale. <b>Il segno è positivo per il livello superiore</b>, e per il livello inferiore lo stesso sviluppo dà $E_{-}=E_{2}-\lambda^{2}|V|^{2}/\Delta+\dots$: i due livelli si allontanano. Picasso lo dice con una parola sola, che resterà: <i>«i livelli si respingono»</i>.</p>
   <p>Ogni termine successivo porta un fattore $\lambda^{2}|V|^{2}/\Delta^{2}$ in più. Questo è il criterio, e Picasso lo scrive come (12.10):</p>
   $$|H'_{12}|\ll|E_{1}^{0}-E_{2}^{0}|,$$
   <p><i>«cioè gli elementi di matrice non diagonali sono trascurabili se, in modulo, sono piccoli rispetto alla differenza delle energie imperturbate degli stati cui si riferiscono»</i>. Aggiunge un&rsquo;osservazione che chiarisce perché non si poteva confrontare $V$ con nient&rsquo;altro: <i>«essendo le energie sempre definite a meno di una costante additiva, l&rsquo;unica cosa con cui ha senso fare il confronto sono proprio le distanze fra i livelli energetici»</i>.</p>`},
   {label:'Un numero, per vedere quanto converge', body:R`
   <p>Con $\Delta=1$ e $\lambda|V|=0{,}3$ — un elemento di matrice che è il trenta per cento della distanza fra i livelli, quindi non «molto» più piccolo — il valore esatto è $E_{+}-E_{2}=0{,}5+\sqrt{0{,}25+0{,}09}\approx1{,}0831$. Il secondo ordine dà $1+0{,}09=1{,}09$, con un errore dello $0{,}6\%$; aggiungendo il quarto ordine si scende a $1{,}09-0{,}0081=1{,}0819$, e l&rsquo;errore cambia segno e si dimezza. La serie converge, ma lentamente, e con segni alterni: è il comportamento di una serie che sta vicino al bordo del suo cerchio di convergenza.</p>`}
  ]},
  {t:'prosa', title:'Il raggio di convergenza, e perché sta fuori dall’asse reale', tag:'teorema', html:R`
  <p>Sakurai fa la domanda che i manuali più elementari saltano: per quali $\lambda$ la serie converge? Si considera $E_{+}$ come funzione del parametro <i>complesso</i> $\lambda$. La radice quadrata è analitica ovunque tranne dove il suo argomento si annulla, cioè nei punti di diramazione</p>
  $$\lambda=\pm\frac{i\Delta}{2|V|}.$$
  <p>Sono due punti <b>sull&rsquo;asse immaginario</b>. Per la teoria delle <span class="str" data-str="serie-di-potenze">serie di potenze</span>, lo sviluppo attorno a $\lambda=0$ converge nel cerchio più grande che non contiene <span class="str" data-str="singolarita-isolate">singolarità</span>, quindi il raggio di convergenza è la distanza dall&rsquo;origine di quei due punti. La condizione perché la serie converga anche al valore fisico $\lambda=1$ è, nella forma di Sakurai (5.1.17),</p>
  $$|V|\lt \frac{\Delta}{2}.$$
  <p><i>«If this condition is not met, perturbation expansion (5.1.14) is meaningless»</i>. Il punto delicato, ed è quello che la figura qui sotto fa vedere, è che <b>sull&rsquo;asse reale non succede niente di speciale</b> a $\lambda|V|=\Delta/2$. Gli autovalori esatti sono funzioni lisce, senza nessun salto né spigolo, per ogni $\lambda$ reale. La serie diverge per una ragione che sta in punti che nessun esperimento può raggiungere, perché un $\lambda$ immaginario renderebbe la hamiltoniana non hermitiana. È il primo segno che «la serie converge» e «la perturbazione è piccola» sono due affermazioni diverse, e che la seconda è quella che si controlla in pratica.</p>`},
  {t:'plot', title:'La funzione liscia, e le sue somme parziali che si staccano',
   intro:R`<p>Il livello superiore $E_{+}$, in unità di $\Delta$ e misurato da $E_{2}$, in funzione di $u=\lambda|V|/\Delta$: la curva esatta (blu) contro le somme parziali della serie troncate al secondo, quarto, sesto e ottavo ordine. Il raggio di convergenza è $|u|=\tfrac12$.</p>`,
   plots:[{kind:'func2d', xr:[-0.9,0.9], yr:[0.8,1.8], height:300, ticks:true,
     title:'E+ esatto e somme parziali della serie in u = lambda|V|/Delta',
     curves:[{f:'0.5+0.5*Math.sqrt(1+4*x*x)', col:'#5aa9ff', width:2.6, label:'esatto'},
             {f:'1+x*x', col:'#ffb86b', width:1.6, label:'2o ordine'},
             {f:'1+x*x-Math.pow(x,4)', col:'#6bdc9b', width:1.6, label:'4o ordine'},
             {f:'1+x*x-Math.pow(x,4)+2*Math.pow(x,6)', col:'#ff6b9d', width:1.6, label:'6o ordine'},
             {f:'1+x*x-Math.pow(x,4)+2*Math.pow(x,6)-5*Math.pow(x,8)', col:'#c49bff', width:1.6, label:'8o ordine'},
             ],
     xlabel:'u', ylabel:'(E+ - E2)/Delta'}],
   leggi:R`<p><b>Che cosa guardare.</b> Dentro $|u|\lt \tfrac12$ le somme parziali si stringono attorno alla curva blu, e più ordini si tengono più l&rsquo;accordo si allarga. Fuori, succede il contrario: l&rsquo;ottavo ordine si stacca dalla curva <i>prima</i> del sesto, e il sesto prima del quarto. I coefficienti della serie, $1,-1,2,-5,14,\dots$, crescono abbastanza in fretta da vincere le potenze di $u$ appena $4u^{2}\gt 1$.</p>
   <p><b>Che cosa impararne.</b> La curva blu non ha nessun difetto a $u=\tfrac12$: chi guardasse solo gli autovalori esatti non saprebbe dove la serie smette di funzionare. La divergenza è una proprietà della <i>serie</i>, non della fisica. In pratica non si sommano infiniti ordini: se ne tengono uno o due, e si chiede che il termine trascurato sia piccolo. Quella richiesta è sensata anche oltre il raggio di convergenza, finché $u$ resta piccolo, ed è il motivo per cui il criterio che si usa davvero è quello di Picasso e non quello di Sakurai.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Nel problema a due livelli la correzione al primo ordine è nulla. Che cosa cambierebbe se la perturbazione avesse anche un elemento diagonale $\lambda W$ sullo stato $|1\rangle$?`,
    a:R`Il livello si sposterebbe subito di $\lambda W$, al primo ordine, e la correzione quadratica diventerebbe $\lambda^{2}|V|^{2}/(\Delta+\lambda W)$, che sviluppata ridà $\lambda^{2}|V|^{2}/\Delta$ più termini di ordine superiore. È esattamente l&rsquo;osservazione di Picasso: gli elementi diagonali si possono sommare all&rsquo;energia imperturbata, e il criterio diventa la sua (12.8), con le energie <i>già corrette</i> al denominatore. <b>L&rsquo;elemento diagonale sposta, quello fuori diagonale mescola</b>: sono due mestieri diversi, e la serie li tratta a ordini diversi.`},
   {q:R`Se $\Delta$ tende a zero a $V$ fissato, che cosa fanno la serie e gli autovalori esatti?`,
    a:R`La serie esplode, perché ogni termine ha una potenza di $\Delta$ al denominatore; gli autovalori esatti invece tendono con calma a $E_{1}\pm\lambda|V|$, che sono <b>lineari</b> in $\lambda$. La serie non può riprodurre quel comportamento perché non contiene potenze dispari di $\lambda$. È la firma del caso degenere: lì il primo ordine non è zero, e i livelli si separano di $2\lambda|V|$. Ballentine fa lo stesso confronto sul suo esempio (10.104), e conclude che la formula di Rayleigh-Schrödinger «is nonsense in the limit $\varepsilon_{1}\to\varepsilon_{2}$».`}
  ]}
]},
/* ---------------- 02 · LA SERIE ORDINE PER ORDINE ---------------- */
{ num:'02', title:'La serie costruita ordine per ordine', meta:'la gerarchia di equazioni di Ballentine · la normalizzazione che semplifica tutto · le equazioni di Dirac con gli apici · il primo e il secondo ordine dedotti · la formula che dà ogni ordine dal precedente · il terzo ordine, controllato su una matrice tre per tre',
  blocchi:[
  {t:'prosa', title:'Che cosa si suppone, e che cosa Dirac richiede perché il problema abbia senso', tag:'architettura', html:R`
  <p>Il problema generale è l&rsquo;equazione agli autovalori</p>
  $$H|\Psi_{n}\rangle=E_{n}|\Psi_{n}\rangle,\qquad H=H_{0}+\lambda V,\qquad H_{0}|n\rangle=\varepsilon_{n}|n\rangle,$$
  <p>con gli $\varepsilon_{n}$ <b>non degeneri</b>: a ogni autovalore imperturbato corrisponde un solo autovettore. È l&rsquo;ipotesi che dà il nome al movimento, e Dirac, nel paragrafo 43 dei <i>Principi</i>, aggiunge in nota un commento sul nome stesso: <i>«un sistema avente un solo stato stazionario appartenente a ciascun livello energetico è spesso chiamato non degenere, mentre un sistema avente due o più stati stazionari appartenenti a un livello energetico è chiamato degenere, sebbene, dal moderno punto di vista, questa terminologia non sia molto appropriata»</i>. Dirac usa il termine e insieme se ne distanzia.</p>
  <p>La condizione perché il problema abbia senso, Dirac la scrive prima di ogni formula: <i>«Il nostro problema, evidentemente, ha senso solo se i livelli energetici del sistema imperturbato sono discreti e se le differenze fra di essi sono grandi in confronto ai mutamenti prodotti in essi dalla perturbazione»</i>. E aggiunge l&rsquo;ipotesi che rende possibile tutto il resto: <i>«ciascun autovalore $H'$ di $H$ è molto vicino a uno e un sol autovalore $E'$ di $E$»</i>. Nella notazione di Dirac la hamiltoniana imperturbata si chiama $E$ e la perturbazione $V$, e l&rsquo;identità degli autovalori si segna con il <b>numero di apici</b>: $H''$ è l&rsquo;autovalore perturbato vicino a $E''$, e Dirac avverte di <i>«usare un numero diverso di apici per indicare autovalori di $H$ e di $E$ che non vogliamo siano molto vicini l&rsquo;uno all&rsquo;altro»</i>. È una notazione scomoda per noi, ma dice una cosa precisa: l&rsquo;etichetta di un livello perturbato è <i>presa in prestito</i> da quello imperturbato, e il prestito è legittimo solo finché i due restano vicini.</p>`},
  {t:'reveal', title:'La gerarchia di equazioni', tag:'costruzione', steps:[
   {label:'Sviluppare tutto in potenze di lambda', body:R`
   <p>Ballentine (10.59)-(10.60) scrive le incognite come serie,</p>
   $$E_{n}=E_{n}^{(0)}+\lambda E_{n}^{(1)}+\lambda^{2}E_{n}^{(2)}+\dots,\qquad|\Psi_{n}\rangle=|\Psi_{n}^{(0)}\rangle+\lambda|\Psi_{n}^{(1)}\rangle+\lambda^{2}|\Psi_{n}^{(2)}\rangle+\dots$$
   <p>le sostituisce nell&rsquo;equazione agli autovalori e raccoglie le potenze di $\lambda$. Siccome l&rsquo;uguaglianza deve valere per ogni $\lambda$, i coefficienti di ogni potenza devono essere uguali separatamente. Si ottiene la sequenza (10.61):</p>
   $$\begin{aligned}(0)&:\ (H_{0}-E_{n}^{(0)})|\Psi_{n}^{(0)}\rangle=0\\(1)&:\ (H_{0}-E_{n}^{(0)})|\Psi_{n}^{(1)}\rangle=(E_{n}^{(1)}-V)|\Psi_{n}^{(0)}\rangle\\(2)&:\ (H_{0}-E_{n}^{(0)})|\Psi_{n}^{(2)}\rangle=(E_{n}^{(1)}-V)|\Psi_{n}^{(1)}\rangle+E_{n}^{(2)}|\Psi_{n}^{(0)}\rangle\end{aligned}$$
   <p>e così via. La prima dice che $|\Psi_{n}^{(0)}\rangle$ è un autovettore di $H_{0}$: per l&rsquo;ipotesi di non degenerazione è $|n\rangle$, con $E_{n}^{(0)}=\varepsilon_{n}$. Le equazioni di Dirac [43.4] sono le stesse, scritte con $a_{1},a_{2}$ per le correzioni all&rsquo;energia e $|1\rangle,|2\rangle$ per quelle allo stato: <i>«La prima di queste equazioni ci dice, come abbiamo già supposto, che $|0\rangle$ è un autoket di $E$ appartenente all&rsquo;autovalore $E'$. Le altre ci permettono di calcolare le varie correzioni»</i>. Landau fa lo stesso conto in forma matriciale, sviluppando $\psi=\sum_{m}c_{m}\psi_{m}^{(0)}$ e scrivendo le equazioni per i coefficienti (38,4). Tre notazioni, una sola gerarchia.</p>`},
   {label:'La scelta di normalizzazione che semplifica tutto', body:R`
   <p>L&rsquo;equazione agli autovalori è omogenea: se $|\Psi_{n}\rangle$ la risolve, la risolve anche ogni suo multiplo. Si può quindi fissare la normalizzazione come conviene, e Ballentine (10.63) sceglie</p>
   $$\langle n|\Psi_{n}\rangle=1$$
   <p>per <i>ogni</i> $\lambda$, invece della normalizzazione usuale. Sviluppando in $\lambda$ e uguagliando i coefficienti, ne segue che <b>ogni correzione è ortogonale allo stato imperturbato</b>:</p>
   $$\langle n|\Psi_{n}^{(r)}\rangle=0\qquad(r\gt 0).$$
   <p><i>«This is the reason why the nonstandard normalization (10.63) is so convenient»</i>. Il prezzo è che $|\Psi_{n}\rangle$ non è normalizzato a uno, e alla fine va rinormalizzato: la tappa 05 calcola quanto, e mostra che quel fattore ha un significato fisico. Sakurai fa la stessa scelta (5.1.31) per la stessa ragione. Landau sceglie diversamente nella forma ma ottiene la stessa cosa al primo ordine: pone $c_{n}^{(1)}=0$ perché la funzione corretta resti normalizzata <i>«a meno di termini del primo ordine»</i>.</p>`},
   {label:'Il primo ordine: energia e stato', body:R`
   <p>Si sviluppa la correzione al primo ordine sugli autovettori imperturbati, omettendo il termine lungo $|n\rangle$ che la normalizzazione ha appena reso nullo: $|\Psi_{n}^{(1)}\rangle=\sum_{m\ne n}a_{m}^{(1)}|m\rangle$. Si proietta l&rsquo;equazione (1) su $\langle m|$, usando che $H_{0}$ agisce a sinistra dando $\varepsilon_{m}$:</p>
   $$(\varepsilon_{m}-\varepsilon_{n})\,a_{m}^{(1)}=E_{n}^{(1)}\delta_{mn}-\langle m|V|n\rangle.$$
   <p>Per $m=n$ il primo membro si annulla e resta la correzione all&rsquo;energia,</p>
   $$E_{n}^{(1)}=\langle n|V|n\rangle,$$
   <p>per $m\ne n$ resta il coefficiente dello stato,</p>
   $$a_{m}^{(1)}=\frac{\langle m|V|n\rangle}{\varepsilon_{n}-\varepsilon_{m}}.$$
   <p>Ballentine commenta che questa forma <i>«suggests that a suitable definition of &ldquo;smallness&rdquo; for the perturbation is that the relevant matrix element $\langle m|\lambda H_{1}|n\rangle$ should be small compared to the corresponding energy denominator»</i>. È il criterio di Picasso, ritrovato senza aver bisogno del problema a due livelli, ed è la condizione (38,9) di Landau: <i>«gli elementi di matrice della perturbazione debbono essere piccoli rispetto alle differenze corrispondenti dei livelli energetici imperturbati»</i>. Ed è qui che l&rsquo;ipotesi di non degenerazione lavora: se due livelli avessero la stessa energia, quel denominatore sarebbe zero.</p>`},
   {label:'Una formula che dà ogni ordine dal precedente', body:R`
   <p>Si prende l&rsquo;equazione di ordine $r$ della gerarchia e la si proietta sul bra $\langle n|$. A sinistra $H_{0}$ agisce verso sinistra dando $\varepsilon_{n}=E_{n}^{(0)}$, quindi il primo membro si annulla. A destra, per l&rsquo;ortogonalità delle correzioni, sopravvivono solo due termini: $-\langle n|V|\Psi_{n}^{(r-1)}\rangle$ e $E_{n}^{(r)}\langle n|n\rangle$. Ne viene la (10.69) di Ballentine,</p>
   $$E_{n}^{(r)}=\langle n|V|\Psi_{n}^{(r-1)}\rangle\qquad(r\gt 0),$$
   <p>che Sakurai scrive identica nella sua (5.1.37): <i>«to obtain the energy $E_{n}$ to order $r$ we need only know $|\Psi_{n}\rangle$ to order $r-1$»</i>. Con $r=2$ e la correzione al primo ordine appena trovata si ottiene il secondo ordine,</p>
   $$E_{n}^{(2)}=\sum_{m\ne n}\frac{|\langle m|V|n\rangle|^{2}}{\varepsilon_{n}-\varepsilon_{m}},$$
   <p>dove si è usata l&rsquo;<span class="str" data-str="operatore-aggiunto">hermiticità</span> di $V$, $\langle n|V|m\rangle=\langle m|V|n\rangle^{*}$. Sakurai preferisce una forma senza indici. Con il <span class="str" data-str="proiettore-ortogonale">proiettore</span> complementare $\phi_{n}=1-|n\rangle\langle n|$, l&rsquo;operatore $\phi_{n}(\varepsilon_{n}-H_{0})^{-1}\phi_{n}$ è ben definito, perché $\phi_{n}$ toglie proprio la direzione su cui $\varepsilon_{n}-H_{0}$ si annulla, e il secondo ordine si scrive</p>
   $$E_{n}^{(2)}=\langle n|V\frac{\phi_{n}}{\varepsilon_{n}-H_{0}}V|n\rangle.$$
   <p>È la stessa cosa: inserendo la decomposizione spettrale di $H_{0}$ si torna alla somma.</p>`},
   {label:'Il terzo ordine, e un controllo su un caso che si sa risolvere', body:R`
   <p>Lo stesso meccanismo dà ogni ordine. Si risolve l&rsquo;equazione (2) per i coefficienti di $|\Psi_{n}^{(2)}\rangle$, proiettandola su $\langle m|$ con $m\ne n$, e si inserisce il risultato nella formula con $r=3$. Scrivendo $V_{km}=\langle k|V|m\rangle$, il risultato, che è anche quello del problema 2 del paragrafo 38 di Landau, è</p>
   $$E_{n}^{(3)}=\sum_{k,m\ne n}\frac{V_{nk}V_{km}V_{mn}}{(\varepsilon_{n}-\varepsilon_{k})(\varepsilon_{n}-\varepsilon_{m})}-V_{nn}\sum_{k\ne n}\frac{|V_{nk}|^{2}}{(\varepsilon_{n}-\varepsilon_{k})^{2}}.$$
   <p>Il secondo termine è nuovo: contiene l&rsquo;elemento diagonale, e nasce dal fatto che lo spostamento al primo ordine cambia, in effetti, il denominatore.</p>
   <p>Una formula così si controlla, non si crede. Si prende un sistema a tre livelli con $H_{0}=\mathrm{diag}(0,1,3)$ e una perturbazione reale simmetrica qualunque, per esempio</p>
   $$V=\frac15\begin{pmatrix}1&2&1\\2&-1&3\\1&3&2\end{pmatrix},$$
   <p>e si calcolano le tre correzioni per il livello più basso: $E^{(1)}=V_{00}=1/5$, poi $E^{(2)}=-\tfrac{4}{25}-\tfrac{1}{75}=-13/75$, e dalla formula $E^{(3)}=-7/225$. La verifica non passa per gli autovalori esatti, che sono radici di un&rsquo;equazione di terzo grado: si sostituisce la serie troncata nel polinomio caratteristico e si controlla che i termini fino a $\lambda^{3}$ si annullino, cioè</p>
   $$\det\big(H_{0}+\lambda V-E(\lambda)\mathbb 1\big)=O(\lambda^{4}),$$
   <p>con $E(\lambda)=\lambda/5-13\lambda^{2}/75-7\lambda^{3}/225$. Se uno solo dei tre coefficienti fosse sbagliato, resterebbe un termine di ordine più basso.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Perché nella formula $E_{n}^{(r)}=\langle n|V|\Psi_{n}^{(r-1)}\rangle$ non compaiono le correzioni all&rsquo;energia di ordine più basso, che pure stanno nell&rsquo;equazione di ordine $r$?`,
    a:R`Perché nell&rsquo;equazione di ordine $r$ le correzioni all&rsquo;energia $E_{n}^{(s)}$ con $0\lt s\lt r$ moltiplicano gli stati $|\Psi_{n}^{(r-s)}\rangle$, e proiettati su $\langle n|$ questi danno zero per la normalizzazione intermedia. Sopravvive solo $E_{n}^{(r)}$ moltiplicato per $\langle n|\Psi_{n}^{(0)}\rangle$, che vale uno. <b>È tutto il vantaggio della scelta $\langle n|\Psi_{n}\rangle=1$</b>: con la normalizzazione usuale, la correzione allo stato avrebbe una componente lungo $|n\rangle$ a ogni ordine, e quella componente rientrerebbe nelle formule dell&rsquo;energia.`},
   {q:R`La formula del secondo ordine contiene una somma su tutti gli stati $m\ne n$. In un atomo, che cosa vuol dire «tutti»?`,
    a:R`Vuol dire anche lo <b>spettro continuo</b>. Landau lo dice esplicitamente: i risultati <i>«si generalizzano direttamente al caso in cui l&rsquo;operatore $H_{0}$ ha anche uno spettro continuo»</i>, e basta <i>«aggiungere alle somme sullo spettro discreto gli integrali corrispondenti allo spettro continuo»</i>. Ballentine insiste sullo stesso punto per la polarizzabilità dell&rsquo;idrogeno: la somma <i>«should include an integral over the continuum of unbound positive energy states»</i>, ed è ciò che rende quel conto difficile. Si tratta sempre della perturbazione di uno stato dello spettro discreto: sono gli stati intermedi a stare anche nel continuo. La tappa 10 mostra come aggirare la somma.`}
  ]}
]},
/* ---------------- 03 · IL PRIMO ORDINE E' UN VALOR MEDIO ---------------- */
{ num:'03', title:'Il primo ordine è un valor medio, e lo è per due ragioni diverse', meta:'la lettura di Dirac e l analogia classica dei moti periodici · la dimostrazione di Picasso per derivazione rispetto al parametro · l identità esatta che la contiene · il controllo sull oscillatore con la molla cambiata',
  blocchi:[
  {t:'prosa', title:'Che cosa dice la formula, nella lettura di Dirac', tag:'architettura', html:R`
  <p>Il risultato della tappa precedente, $E_{n}^{(1)}=\langle n|V|n\rangle$, è la formula più usata di tutta la teoria delle perturbazioni: è il conto che quasi ogni esercizio d&rsquo;esame chiede. Dirac la legge in parole, e la lettura vale più della formula: <i>«la variazione dell&rsquo;energia è uguale, in approssimazione del primo ordine, al corrispondente elemento diagonale dell&rsquo;energia di perturbazione nella rappresentazione di Heisenberg per il sistema imperturbato, cioè al valor medio dell&rsquo;energia di perturbazione per lo stato imperturbato corrispondente»</i>. «Rappresentazione di Heisenberg» qui vuol dire, nel linguaggio di Dirac, la rappresentazione in cui la hamiltoniana imperturbata è diagonale: la base $|n\rangle$.</p>
  <p>Poi aggiunge una frase che collega la formula alla fisica che la precede: <i>«Quest&rsquo;ultima formulazione del nostro risultato è la stessa che si ha in meccanica classica quando il sistema imperturbato è multiplamente periodico»</i>. In meccanica classica, un sistema imperturbato periodico percorre la sua orbita sempre uguale; una perturbazione piccola cambia l&rsquo;energia, al primo ordine, della <b>media temporale</b> di $V$ lungo l&rsquo;orbita imperturbata. Le variazioni rapide di $V$ lungo il moto si compensano, e resta la media. In meccanica quantistica non c&rsquo;è l&rsquo;orbita, ma c&rsquo;è lo stato stazionario $|n\rangle$, che è la cosa più vicina a un moto periodico che la teoria conosca. La media su quello stato prende il posto della media lungo l&rsquo;orbita. Non è un&rsquo;analogia retorica: è la ragione per cui la vecchia teoria dei quanti, che calcolava spostamenti di livelli mediando lungo le orbite, a volte trovava i numeri giusti. Landau ricorda in nota che lo spostamento lineare dei livelli dell&rsquo;idrogeno in un campo elettrico <i>«è stato ottenuto da K. Schwarzschild e da P. Epstein sulla base della vecchia teoria dei quanti, e da W. Pauli e E. Schrödinger»</i> con la meccanica quantistica, nel 1926.</p>
  <p>Dirac nota anche una conseguenza che dice dove sta l&rsquo;informazione: <i>«i risultati ottenuti sono indipendenti dai valori di tutti gli elementi di matrice dell&rsquo;energia di perturbazione che si riferiscono a due diversi livelli energetici del sistema imperturbato»</i>. Al primo ordine conta solo la diagonale. Gli elementi fuori diagonale entrano dal secondo ordine in poi, e Picasso ne fa la dimostrazione formale.</p>`},
  {t:'reveal', title:'La dimostrazione di Picasso: derivare rispetto al parametro', tag:'teorema', steps:[
   {label:'Separare la perturbazione in due pezzi', body:R`
   <p>Picasso, al paragrafo 12.3, non sviluppa in serie: <b>deriva</b>. Divide la perturbazione in due parti (12.19): $H'_{0}$, che ha elementi di matrice solo fra stati con la stessa energia imperturbata, e $H''$, che li ha solo fra stati con energie diverse. Nel caso non degenere $H'_{0}$ è semplicemente la parte diagonale. Poi osserva che la separazione fra «risolubile» e «piccolo» è arbitraria, e sposta $H'_{0}$ nella parte risolubile:</p>
   $$H=(H_{0}+H'_{0})+H''.$$
   <p>La nuova hamiltoniana imperturbata $H_{0}+H'_{0}$ è ancora diagonale nella stessa base, con autovalori $E_{n}^{0}+\langle n|H'|n\rangle$. Resta da far vedere che $H''$ non cambia niente al primo ordine.</p>`},
   {label:'Derivare l’equazione agli autovalori', body:R`
   <p>Si moltiplica solo $H''$ per un parametro, $H_{\lambda}=(H_{0}+H'_{0})+\lambda H''$, e si deriva l&rsquo;equazione agli autovalori (12.22) rispetto a $\lambda$ in $\lambda=0$. Prendendo il prodotto scalare con l&rsquo;autovettore imperturbato, il termine con la derivata dello stato si annulla, perché quel bra è autovettore di $H_{0}+H'_{0}$ con lo stesso autovalore. Resta</p>
   $$\frac{dE_{n}}{d\lambda}\Big|_{\lambda=0}=\langle E_{n}^{0}|H''|E_{n}^{0}\rangle,$$
   <p>e questo è zero, perché $H''$ per costruzione non ha elementi diagonali. Picasso conclude: la teoria al primo ordine <i>«in definitiva consiste nel porre $H''=0$, cioè nel porre uguali a zero tutti gli elementi di matrice di $H'$ fra autovettori di $H_{0}$ corrispondenti ad energie imperturbate diverse»</i>.</p>`},
   {label:'L’identità esatta che sta sotto', body:R`
   <p>Il passaggio di Picasso è il caso $\lambda=0$ di un&rsquo;identità che vale per ogni $\lambda$, nota come teorema di Hellmann-Feynman. Se $|\Psi(\lambda)\rangle$ è un autovettore normalizzato di $H_{0}+\lambda V$ con autovalore $E(\lambda)$, derivando $(H_{0}+\lambda V-E)|\Psi\rangle=0$ e moltiplicando a sinistra per $\langle\Psi|$, il termine $\langle\Psi|(H_{0}+\lambda V-E)\,\tfrac{d}{d\lambda}|\Psi\rangle$ si annulla perché $\langle\Psi|$ è autovettore a sinistra con lo stesso autovalore, e resta</p>
   $$\frac{dE}{d\lambda}=\langle\Psi(\lambda)|V|\Psi(\lambda)\rangle.$$
   <p><b>La pendenza dell&rsquo;autovalore è, a ogni $\lambda$, il valor medio della perturbazione sullo stato esatto.</b> Il primo ordine della serie è la pendenza nell&rsquo;origine, quindi il valor medio sullo stato imperturbato. È la seconda ragione per cui il primo ordine è un valor medio, indipendente dalla prima: non serve sviluppare niente, basta sapere che la derivata di un autovalore è un valor medio.</p>`}
  ]},
  {t:'reveal', title:'Il controllo: l’oscillatore con la molla cambiata', tag:'esempio', steps:[
   {label:'Il problema esatto', body:R`
   <p>Sakurai prende l&rsquo;oscillatore armonico e cambia di poco la costante della molla aggiungendo $V=\tfrac12\varepsilon m\omega^{2}x^{2}$, con $\varepsilon\ll1$. E lo dice con franchezza: <i>«From a certain point of view, this is the silliest problem in the world to which to apply perturbation theory; the exact solution is immediately obtained just by changing $\omega$»</i> in $\omega\sqrt{1+\varepsilon}$. Proprio per questo serve: la risposta esatta è</p>
   $$E_{n}(\varepsilon)=\hbar\omega\sqrt{1+\varepsilon}\,\Big(n+\tfrac12\Big),$$
   <p>e si può confrontare tutto.</p>`},
   {label:'Il primo ordine, per le due vie', body:R`
   <p>Per la via della serie serve $\langle n|x^{2}|n\rangle$. Con gli operatori di salita e discesa $x=\sqrt{\hbar/2m\omega}\,(a+a^{\dagger})$, il quadrato contiene quattro termini, e sulla diagonale sopravvivono solo i due che salgono e scendono una volta: $\langle n|aa^{\dagger}|n\rangle=n+1$ e $\langle n|a^{\dagger}a|n\rangle=n$. Quindi</p>
   $$\langle n|\tfrac12 m\omega^{2}x^{2}|n\rangle=\tfrac12\hbar\omega\Big(n+\tfrac12\Big),$$
   <p>cioè metà dell&rsquo;energia del livello: è il teorema del viriale per l&rsquo;oscillatore, energia potenziale media uguale a cinetica media. La correzione al primo ordine è $\varepsilon$ volte questo valore.</p>
   <p>Per la via esatta si deriva la formula di prima rispetto a $\varepsilon$ in $\varepsilon=0$:</p>
   $$\frac{dE_{n}}{d\varepsilon}\Big|_{\varepsilon=0}=\frac{\hbar\omega}{2}\Big(n+\tfrac12\Big).$$
   <p>Le due cose coincidono, come devono.</p>`},
   {label:'E a ogni epsilon, non solo nell’origine', body:R`
   <p>Il controllo più severo è quello dell&rsquo;identità esatta, a $\varepsilon$ finito. Lo stato esatto è l&rsquo;autostato di un oscillatore di frequenza $\omega'=\omega\sqrt{1+\varepsilon}$, su cui $\langle x^{2}\rangle=\frac{\hbar}{m\omega'}\big(n+\tfrac12\big)$. Quindi</p>
   $$\langle\tfrac12 m\omega^{2}x^{2}\rangle_{\varepsilon}=\frac{\hbar\omega\,(n+\tfrac12)}{2\sqrt{1+\varepsilon}},$$
   <p>che è esattamente la derivata di $E_{n}(\varepsilon)$ rispetto a $\varepsilon$, per ogni $\varepsilon$. Il teorema non è un&rsquo;approssimazione: la pendenza della curva esatta è il valor medio sullo stato esatto, e il primo ordine della teoria delle perturbazioni ne è soltanto il primo campione.</p>`}
  ]},
  {t:'plot', title:'Il primo ordine come retta tangente',
   intro:R`<p>Il livello fondamentale dell&rsquo;oscillatore con la molla cambiata, $E_{0}/\hbar\omega=\tfrac12\sqrt{1+\varepsilon}$, contro la sua approssimazione al primo ordine $\tfrac12(1+\varepsilon/2)$ e al secondo ordine $\tfrac12(1+\varepsilon/2-\varepsilon^{2}/8)$.</p>`,
   plots:[{kind:'func2d', xr:[-0.9,2.5], yr:[0.1,1.2], height:280, ticks:true,
     title:'E0/(hbar omega) in funzione di epsilon',
     curves:[{f:'0.5*Math.sqrt(1+x)', col:'#5aa9ff', width:2.6, label:'esatto'},
             {f:'0.5*(1+x/2)', col:'#ffb86b', width:1.8, label:'1o ordine (tangente)'},
             {f:'0.5*(1+x/2-x*x/8)', col:'#6bdc9b', width:1.8, label:'2o ordine'}],
     xlabel:'epsilon', ylabel:'E0 / hbar omega'}],
   leggi:R`<p><b>Che cosa guardare.</b> La retta arancione tocca la curva blu in $\varepsilon=0$ con la stessa pendenza: il primo ordine <i>è</i> la tangente. La parabola verde segue la curva più a lungo, ma per $\varepsilon$ dell&rsquo;ordine di uno si stacca anche lei. Verso $\varepsilon=-1$ la molla si annulla, la curva esatta scende a zero con tangente verticale, e nessun polinomio la segue.</p>
   <p><b>Che cosa impararne.</b> La curva esatta sta <i>sotto</i> la tangente per ogni $\varepsilon$: la correzione del secondo ordine è negativa. È il caso particolare di una regola generale, che la tappa 06 dimostra, sul segno del secondo ordine per lo stato fondamentale. Il punto $\varepsilon=-1$ è una singolarità della radice, e fissa il raggio di convergenza di questa serie: converge per $|\varepsilon|\lt 1$, lo stesso meccanismo della tappa 01.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Se la perturbazione è dispari rispetto alla parità e lo stato imperturbato ha parità definita, quanto vale il primo ordine?`,
    a:R`Zero. Il valor medio di un operatore dispari su uno stato di parità definita si annulla, perché $|\psi(x)|^{2}$ è pari e il prodotto con una funzione dispari integra a zero. Picasso lo dimostra per l&rsquo;operatore di posizione con l&rsquo;operatore di parità $\Pi$: se $\Pi|A\rangle=w|A\rangle$ e $\Pi x\Pi^{-1}=-x$, allora $\langle A|x|A\rangle=-\langle A|x|A\rangle$. È la ragione per cui un campo elettrico uniforme non sposta al primo ordine il fondamentale di nessun atomo con livelli non degeneri: la tappa 10 ne fa il conto al secondo ordine.`},
   {q:R`Il teorema $dE/d\lambda=\langle\Psi|V|\Psi\rangle$ richiede che lo stato sia normalizzato. Che cosa cambia con la normalizzazione intermedia $\langle n|\Psi\rangle=1$ della tappa 02?`,
    a:R`Va diviso per la norma: $dE/d\lambda=\langle\Psi|V|\Psi\rangle/\langle\Psi|\Psi\rangle$. Con la normalizzazione intermedia $\langle\Psi|\Psi\rangle=1+O(\lambda^{2})$, quindi al primo ordine la differenza non si vede; dal secondo in poi sì. È uno dei punti in cui la scelta di Ballentine, comoda per costruire la serie, va corretta quando si vuole un valor medio fisico.`}
  ]}
]},
/* ---------------- 04 · IL PRIMO ORDINE AL LAVORO ---------------- */
{ num:'04', title:'Il primo ordine al lavoro: tre esercizi d esame', meta:'la buca infinita con un gradino centrale, compito del 30 giugno 2021 · la trappola delle coordinate, compito del 17 luglio 2019 · l oscillatore deformato, compito del 14 luglio 2021 · come si controlla che il primo ordine basti',
  blocchi:[
  {t:'prosa', title:'Che cosa chiede lo scritto, misurato', tag:'architettura', html:R`
  <p>Sui cinquantuno file di compiti del corso misurati per questo movimento, l&rsquo;espressione «primo ordine» compare in ventuno; «secondo ordine» in nessuno. La consegna tipica è «si calcolino al primo ordine in teoria delle perturbazioni le correzioni agli autovalori», spesso seguita da «si confronti con il risultato esatto». Il conto, in sé, è un integrale: il valor medio della perturbazione sullo stato imperturbato. Quello che lo scritto valuta davvero è altro: scegliere le autofunzioni giuste, accorgersi delle simmetrie che annullano un integrale, e dire perché il primo ordine basta. I tre esercizi di questa tappa sono scelti per esercitare queste tre cose.</p>`},
  {t:'reveal', title:'Esercizio 1: la buca infinita con un gradino nel mezzo', tag:'esame', steps:[
   {label:'Il testo, e le autofunzioni da usare', body:R`
   <p>Il compito del 30 giugno 2021 mette una particella in una buca infinita nel segmento $|x|\le L/2$ e aggiunge la perturbazione $V(x)=V_{0}$ per $|x|\le L/4$, zero altrove: un gradino che copre la metà centrale della buca. Si chiedono le correzioni a tutti gli autovalori al primo ordine e la correzione allo stato fondamentale. Quest&rsquo;ultima è il tema della tappa 05.</p>
   <p>Le autofunzioni della buca simmetrica vanno scritte nelle coordinate del testo, e qui si sbaglia spesso. Con l&rsquo;origine al centro, i livelli dispari sono coseni e quelli pari seni:</p>
   $$\psi_{n}(x)=\sqrt{\tfrac{2}{L}}\cos\frac{n\pi x}{L}\ (n\ \text{dispari}),\qquad\psi_{n}(x)=\sqrt{\tfrac{2}{L}}\sin\frac{n\pi x}{L}\ (n\ \text{pari}),$$
   <p>con $E_{n}^{(0)}=n^{2}\varepsilon_{1}$ e $\varepsilon_{1}=\pi^{2}\hbar^{2}/2mL^{2}$. Lo spettro è non degenere, come per ogni problema unidimensionale con stati legati, quindi la formula non degenere si applica a ogni livello.</p>`},
   {label:'Il conto, livello per livello', body:R`
   <p>La correzione è $V_{0}$ per la probabilità che la particella stia nella metà centrale:</p>
   $$E_{n}^{(1)}=V_{0}\int_{-L/4}^{L/4}|\psi_{n}(x)|^{2}\,dx.$$
   <p>Per il fondamentale si integra $\cos^{2}$ e si trova</p>
   $$E_{1}^{(1)}=V_{0}\Big(\frac12+\frac1\pi\Big)\approx0{,}818\,V_{0},$$
   <p>per il primo eccitato, che è un seno,</p>
   $$E_{2}^{(1)}=\frac{V_{0}}{2},$$
   <p>e per il secondo eccitato</p>
   $$E_{3}^{(1)}=V_{0}\Big(\frac12-\frac{1}{3\pi}\Big)\approx0{,}394\,V_{0}.$$
   <p>La forma generale, che si ottiene con lo stesso integrale per $n$ qualunque, è $V_{0}/2$ per i livelli pari e</p>
   $$E_{n}^{(1)}=V_{0}\Big(\frac12+\frac{(-1)^{(n-1)/2}}{n\pi}\Big)$$
   <p>per i dispari.</p>`},
   {label:'Che cosa dice il risultato', body:R`
   <p>Il numero $\tfrac12$ è la frazione della buca coperta dal gradino: è ciò che si otterrebbe se la particella fosse distribuita uniformemente, come una particella classica che rimbalza fra le pareti a velocità costante. Le correzioni quantistiche a quel valore oscillano e decrescono come $1/n$. Il fondamentale ha una densità concentrata al centro e «sente» il gradino più della media; il terzo livello ha un nodo vicino ai bordi del gradino e lo sente meno; i livelli pari hanno esattamente metà della probabilità nella regione centrale. Al crescere di $n$ si torna al valore classico: è il principio di corrispondenza, letto su un valor medio.</p>
   <p><b>Quando basta il primo ordine.</b> Il criterio della tappa 01 vuole che lo spostamento sia piccolo rispetto alla distanza dai livelli vicini. Per il fondamentale la distanza utile è $E_{3}-E_{1}=8\varepsilon_{1}$, perché il primo eccitato ha parità opposta e la perturbazione, che è pari, non lo collega. Una condizione più prudente è $0{,}818\,V_{0}\ll E_{2}-E_{1}=3\varepsilon_{1}$, cioè $V_{0}$ piccolo rispetto a qualche volta l&rsquo;energia di punto zero della buca. Picasso suggerisce proprio questo controllo <i>a posteriori</i>: si calcola lo spostamento al primo ordine, e solo dopo si guarda se è piccolo rispetto alle distanze fra i livelli.</p>`}
  ]},
  {t:'plot', title:'Dove sta la particella, e quanto sente il gradino',
   intro:R`<p>Le densità di probabilità dei primi tre livelli nella buca $|x|\le L/2$ (con $L=1$), e in grigio il profilo del gradino $V_{0}$ nella metà centrale.</p>`,
   plots:[{kind:'func2d', xr:[-0.5,0.5], yr:[0,2.3], height:280, ticks:true,
     title:'|psi_n|^2 per n=1,2,3 e la regione del gradino',
     curves:[{f:'2*Math.pow(Math.cos(Math.PI*x),2)', col:'#5aa9ff', width:2.4, label:'n=1'},
             {f:'2*Math.pow(Math.sin(2*Math.PI*x),2)', col:'#ffb86b', width:2.0, label:'n=2'},
             {f:'2*Math.pow(Math.cos(3*Math.PI*x),2)', col:'#6bdc9b', width:2.0, label:'n=3'},
             {f:'Math.abs(x)<=0.25?2.2:0', col:'#6f7a90', width:1.4, label:'gradino'}],
     xlabel:'x / L', ylabel:'densita'}],
   leggi:R`<p><b>Che cosa guardare.</b> L&rsquo;area sotto ciascuna curva dentro la regione grigia è la correzione divisa per $V_{0}$. La curva blu ha il massimo al centro e vi accumula l&rsquo;$82\%$ della probabilità; quella verde ha due nodi in $x=\pm L/6$, dentro il gradino, e ne mette dentro solo il $39\%$; quella arancione è simmetrica fra dentro e fuori e dà esattamente metà.</p>
   <p><b>Che cosa impararne.</b> Il primo ordine non richiede di risolvere niente: richiede di sapere <i>dove sta</i> la particella nello stato imperturbato. Un orale chiede spesso di indovinare il segno o l&rsquo;ordinamento delle correzioni prima di fare il conto, e la figura è la risposta: lo stato più spostato è quello più concentrato dove la perturbazione agisce.</p>`},
  {t:'reveal', title:'Esercizio 2: la stessa buca, una perturbazione che sembra facile', tag:'esame', steps:[
   {label:'Il testo, e l’errore che invita a fare', body:R`
   <p>Il compito del 17 luglio 2019 prende la stessa buca $|x|\le L/2$ e aggiunge $V=\lambda\sin^{2}(\pi x/L)$: si chiede l&rsquo;energia del fondamentale al primo ordine. La tentazione è riconoscere in $\sin^{2}(\pi x/L)$ la densità del fondamentale e calcolare la media di $\sin^{4}$. Ma il fondamentale della buca <i>centrata</i> è un coseno, e $\sin^{2}$ si annulla al centro, dove la particella sta di più. Il conto giusto è</p>
   $$E_{1}^{(1)}=\lambda\,\frac{2}{L}\int_{-L/2}^{L/2}\cos^{2}\frac{\pi x}{L}\,\sin^{2}\frac{\pi x}{L}\,dx=\frac{\lambda}{4},$$
   <p>mentre il conto sbagliato, quello con la buca in $[0,L]$ e il potenziale scritto nelle coordinate centrate, darebbe</p>
   $$\frac{2}{L}\int_{0}^{L}\sin^{4}\frac{\pi x}{L}\,dx=\frac34.$$
