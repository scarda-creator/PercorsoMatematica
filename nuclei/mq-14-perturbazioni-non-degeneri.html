   {q:R`Perché nel conto elettrostatico di Picasso basta l&rsquo;energia di <i>una</i> distribuzione nel campo dell&rsquo;altra, senza il fattore $\tfrac12$ dell&rsquo;energia elettrostatica di una distribuzione con sé stessa?`,
    a:R`Perché le due distribuzioni appartengono a due elettroni distinti, e $e^{2}/r_{12}$ è l&rsquo;interazione fra il primo e il secondo, contata una volta. Il fattore $\tfrac12$ compare nell&rsquo;energia di una distribuzione con sé stessa, perché lì ogni coppia di elementi di carica sarebbe contata due volte. Qui le coppie sono ordinate, una carica per elettrone, e ognuna compare una volta sola nell&rsquo;integrale doppio.`}
  ]}
]},
/* ---------------- 12 · LE FORZE DI VAN DER WAALS ---------------- */
{ num:'12', title:'Le forze di van der Waals: un effetto che esiste solo al secondo ordine', meta:'due atomi neutri lontani · perché il primo ordine è zero per ogni termine dello sviluppo in multipoli · il secondo ordine dipolo dipolo, negativo e proporzionale a uno su r alla sesta · un modello di oscillatori risolto esattamente, e il confronto',
  blocchi:[
  {t:'prosa', title:'Il problema come lo imposta Landau', tag:'architettura', html:R`
  <p>Due atomi neutri, ciascuno nel suo stato fondamentale, a una distanza $r$ molto grande rispetto alle loro dimensioni. Che forza si esercitano? Classicamente nessuna: due distribuzioni di carica neutre e a simmetria sferica non interagiscono. Landau, al paragrafo 89, risolve il problema con la teoria delle perturbazioni, <i>«considerando i due atomi come un sistema imperturbato e l&rsquo;energia potenziale della loro interazione elettrica come operatore della perturbazione»</i>.</p>
  <p>A grande distanza l&rsquo;interazione elettrica fra due sistemi di cariche si sviluppa in potenze di $1/r$. Per atomi neutri il termine di carica manca, e lo sviluppo comincia dall&rsquo;interazione dipolo-dipolo, che va come $1/r^{3}$, seguita da dipolo-quadrupolo, $1/r^{4}$, e da quadrupolo-quadrupolo, $1/r^{5}$. Il termine dipolo-dipolo è, con $\mathbf n$ il versore della congiungente,</p>
  $$V=\frac{\mathbf d_{1}\cdot\mathbf d_{2}-3(\mathbf d_{1}\cdot\mathbf n)(\mathbf d_{2}\cdot\mathbf n)}{r^{3}}.$$
  <p>Lo stato imperturbato è il prodotto dei due fondamentali atomici, e per due atomi in stati $S$ è non degenere.</p>`},
  {t:'reveal', title:'Il primo ordine è zero, il secondo no', tag:'teorema', steps:[
   {label:'Il primo ordine, per ogni termine dello sviluppo', body:R`
   <p>Il primo ordine è il valor medio di $V$ sullo stato prodotto, e si fattorizza in valori medi sui singoli atomi: $\langle\mathbf d_{1}\rangle$, $\langle\mathbf d_{2}\rangle$, e lo stesso per i momenti di quadrupolo e superiori. Landau osserva che negli stati $S$ <i>«gli elementi di matrice diagonali, cioè i valori medi dei momenti di dipolo, di quadrupolo, ecc. degli atomi, sono nulli, questo segue direttamente dalla simmetria sferica della distribuzione di densità di carica negli atomi. Quindi ogni termine dello sviluppo dell&rsquo;operatore di perturbazione secondo le potenze di $1/r$ nell&rsquo;approssimazione del primo ordine della teoria delle perturbazioni dà zero»</i>. Il primo ordine non è piccolo: è esattamente nullo, a tutte le distanze.</p>`},
   {label:'Il secondo ordine, e il suo segno', body:R`
   <p>Al secondo ordine entrano gli elementi di matrice <i>fuori</i> diagonale del dipolo, che in generale non sono nulli: un atomo può passare dal fondamentale a uno stato $P$ con un elemento di matrice di $\mathbf d$ dell&rsquo;ordine di $ea_{0}$. Basta il termine dipolo-dipolo, che è quello che decresce più lentamente. Siccome il secondo ordine è quadratico in $V$, ed è $V\propto1/r^{3}$, il risultato va come $1/r^{6}$. Il segno lo dà la tappa 06: lo stato imperturbato è il fondamentale del sistema dei due atomi, e su di esso il secondo ordine è negativo. Landau lo scrive richiamando il proprio paragrafo 38, <i>«La correzione del secondo ordine all&rsquo;autovalore più piccolo è sempre negativa»</i>, e conclude:</p>
   $$U(r)=-\frac{C}{r^{6}},\qquad C\gt0,$$
   <p>con il riferimento <i>«F. London, 1928»</i>. Due atomi neutri si attraggono, con una forza che va come $1/r^{7}$. È la forza di van der Waals, ed è un effetto puramente quantistico, perché nasce dalle fluttuazioni del dipolo attorno al valor medio nullo. Classicamente quelle fluttuazioni non ci sono.</p>`}
  ]},
  {t:'reveal', title:'Un modello che si risolve esattamente', tag:'esempio', steps:[
   {label:'Gli atomi come oscillatori', body:R`
   <p>Per vedere la formula al lavoro, e per controllarla, conviene un modello in cui tutto si può calcolare. Questo modello non viene dalle fonti del movimento: è la costruzione standard con cui si illustra il risultato di London, e si dichiara come tale. Ogni atomo è rappresentato da un elettrone di carica $-e$ legato elasticamente al proprio nucleo, cioè da un oscillatore isotropo tridimensionale di frequenza $\omega$. Con la congiungente lungo $z$, l&rsquo;interazione dipolo-dipolo fra i due spostamenti $\mathbf r_{1}$ e $\mathbf r_{2}$ è</p>
   $$V=\frac{e^{2}}{r^{3}}\big(x_{1}x_{2}+y_{1}y_{2}-2z_{1}z_{2}\big).$$
   <p>Il fondamentale imperturbato è $|0\rangle$ per ciascuno dei sei oscillatori. Il primo ordine è nullo, come nel caso generale, perché ogni $\langle x_{i}\rangle$ è nullo.</p>`},
   {label:'Il secondo ordine', body:R`
   <p>Il termine $x_{1}x_{2}$ porta il fondamentale nello stato con un quanto in ciascuno dei due oscillatori lungo $x$, con elemento di matrice $\langle1,1|x_{1}x_{2}|0,0\rangle=\hbar/2m\omega$ e denominatore $-2\hbar\omega$. Lo stesso per $y$; per $z$ l&rsquo;elemento di matrice ha un fattore $-2$. La somma dei quadrati dà $1+1+4=6$, e chiamando $\kappa=e^{2}/m\omega^{2}r^{3}$,</p>
   $$E^{(2)}=-\frac{6}{2\hbar\omega}\Big(\frac{e^{2}}{r^{3}}\frac{\hbar}{2m\omega}\Big)^{2}=-\frac34\hbar\omega\,\kappa^{2}.$$
   <p>È proporzionale a $1/r^{6}$, come previsto. La costante di London del modello è $C=\tfrac34\hbar\omega\,\alpha^{2}$, dove $\alpha=e^{2}/m\omega^{2}$ è la polarizzabilità statica di un elettrone legato elasticamente: le forze di van der Waals sono più intense fra atomi più polarizzabili.</p>`},
   {label:'Il risultato esatto', body:R`
   <p>Il modello si risolve anche esattamente. La hamiltoniana è quadratica, e lungo ciascun asse le due coordinate si combinano in modi normali, la somma e la differenza. Lungo $x$ e lungo $y$ le frequenze diventano $\omega\sqrt{1\pm\kappa}$, lungo $z$, per il fattore $-2$, $\omega\sqrt{1\pm2\kappa}$. L&rsquo;energia del fondamentale è la somma delle sei energie di punto zero, e lo spostamento rispetto ai due atomi isolati è</p>
   $$\Delta E=\frac{\hbar\omega}{2}\Big[2\big(\sqrt{1+\kappa}+\sqrt{1-\kappa}\big)+\sqrt{1+2\kappa}+\sqrt{1-2\kappa}\Big]-3\hbar\omega.$$
   <p>Sviluppato in $\kappa$, il primo termine non nullo è esattamente $-\tfrac34\hbar\omega\kappa^{2}$: il secondo ordine perturbativo coincide con il primo termine dello sviluppo esatto. Il termine successivo è di ordine $\kappa^{4}$, quindi $1/r^{12}$, e alle distanze per cui l&rsquo;approssimazione di dipolo vale è trascurabile.</p>`}
  ]},
  {t:'plot', title:'L’energia di interazione nel modello: esatta e al secondo ordine',
   intro:R`<p>Lo spostamento $\Delta E/\hbar\omega$ in funzione della distanza in unità della lunghezza $r_{0}=(e^{2}/m\omega^{2})^{1/3}$, per cui $\kappa=(r_{0}/r)^{3}$: esatto (blu) e al secondo ordine $-\tfrac34\kappa^{2}$ (arancio).</p>`,
   plots:[{kind:'func2d', xr:[1.27,3], yr:[-0.35,0.02], height:280, ticks:true,
     title:'energia di van der Waals nel modello a oscillatori',
     curves:[{f:'0.5*(2*(Math.sqrt(1+Math.pow(x,-3))+Math.sqrt(1-Math.pow(x,-3)))+Math.sqrt(1+2*Math.pow(x,-3))+Math.sqrt(Math.max(0,1-2*Math.pow(x,-3))))-3', col:'#5aa9ff', width:2.6, label:'esatto'},
             {f:'-0.75*Math.pow(x,-6)', col:'#ffb86b', width:2.0, label:'-(3/4) kappa^2'}],
     xlabel:'r / r0', ylabel:'Delta E / hbar omega'}],
   leggi:R`<p><b>Che cosa guardare.</b> A $r=2\,r_{0}$ le due curve differiscono dell&rsquo;$1{,}5\%$, a $r=1{,}6\,r_{0}$ del $6\%$; più lontano sono indistinguibili. Avvicinandosi, la curva esatta scende più rapidamente e, a $r=2^{1/3}r_{0}\approx1{,}26\,r_{0}$, la frequenza del modo $\omega\sqrt{1-2\kappa}$ si annulla: il modello diventa instabile, perché l&rsquo;attrazione fra i dipoli supera la molla che lega gli elettroni.</p>
   <p><b>Che cosa impararne.</b> Il secondo ordine descrive bene la regione a grande distanza, che è quella in cui l&rsquo;approssimazione di dipolo ha senso fisico. L&rsquo;instabilità a piccola distanza non è un difetto della teoria delle perturbazioni ma del modello di dipolo, che a distanze confrontabili con le dimensioni atomiche non vale più. Lì gli atomi si sovrappongono, entrano in gioco lo scambio e la repulsione, e lo sviluppo in multipoli perde senso.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Se uno dei due atomi avesse un momento di dipolo permanente, come una molecola polare, l&rsquo;interazione con un atomo in stato $S$ andrebbe ancora come $1/r^{6}$?`,
    a:R`Sì. Il primo ordine resta nullo, perché contiene il prodotto dei valor medi dei due dipoli, e quello dell&rsquo;atomo in stato $S$ è zero. Al secondo ordine compare, oltre alla dispersione, un termine di <b>induzione</b>: il dipolo permanente produce un campo che va come $1/r^{3}$, l&rsquo;atomo si polarizza con energia $-\tfrac12\alpha\mathcal E^{2}\propto1/r^{6}$. È la polarizzabilità della tappa 10 messa in un campo non uniforme, e ha la stessa dipendenza dalla distanza. Solo fra <i>due</i> dipoli permanenti l&rsquo;interazione può andare come $1/r^{3}$ al primo ordine.`},
   {q:R`Perché la forza di van der Waals è attrattiva per due atomi nel fondamentale, ma potrebbe non esserlo se uno dei due fosse in uno stato eccitato?`,
    a:R`Perché il segno negativo viene dall&rsquo;argomento sul fondamentale della tappa 06: tutti gli stati intermedi stanno sopra. Se uno degli atomi è eccitato, lo stato imperturbato del sistema non è più il più basso, ci sono stati intermedi sotto di esso con denominatori di segno opposto, e il segno della somma non è più garantito. Inoltre gli stati eccitati degli atomi sono spesso degeneri, e il trattamento non degenere va rivisto.`}
  ]}
]},
/* ---------------- 13 · LE FONTI A CONFRONTO, E LE ROTTE ---------------- */
{ num:'13', title:'Dove le fonti divergono, e dove il metodo riappare', meta:'cinque notazioni per la stessa serie · due normalizzazioni che differiscono al secondo ordine · serie o derivata rispetto al parametro · due cure per i livelli vicini · il metodo variazionale e una misura sugli scritti · la teoria delle perturbazioni fuori da questo capitolo',
  blocchi:[
  {t:'prosa', title:'Notazioni e normalizzazioni: dove i libri non dicono la stessa cosa', tag:'architettura', html:R`
  <p><b>La notazione.</b> Le cinque fonti di questo movimento scrivono la stessa serie in cinque modi, e mescolarli in un esercizio produce errori di segno. Dirac chiama $E$ la hamiltoniana imperturbata e $V$ la perturbazione, e distingue i livelli con il numero di apici, $a_{1},a_{2}$ per le correzioni all&rsquo;energia. Picasso scrive $H_{0}+H'$ e introduce il parametro solo per la parte $H''$ fuori dai blocchi degeneri. Ballentine scrive $H_{0}+\lambda H_{1}$, con $\varepsilon_{n}$ per gli autovalori imperturbati e $E_{n}^{(r)}$ per le correzioni. Sakurai scrive $H_{0}+\lambda V$, chiama $\Delta_{n}$ lo spostamento totale e usa il proiettore $\phi_{n}$. Landau sviluppa la funzione d&rsquo;onda sulle imperturbate con coefficienti $c_{m}$ e lavora in forma matriciale con $V_{mn}$. Quando un compito scrive «$\lambda V$» si sta usando Sakurai o Ballentine; quando scrive «$H'$», Picasso.</p>
  <p><b>Il segno al denominatore.</b> Ballentine, Sakurai e Landau scrivono il secondo ordine con $\varepsilon_{n}-\varepsilon_{m}$ al denominatore. Picasso, e Ballentine nell&rsquo;esempio della polarizzabilità, lo scrivono con $E_{k}-E_{n}$ e un meno davanti, per rendere visibile il segno. Le due forme sono identiche, ma passare dall&rsquo;una all&rsquo;altra a metà di un conto è il modo più comune di sbagliare il segno della correzione.</p>
  <p><b>La normalizzazione.</b> Ballentine e Sakurai scelgono $\langle n|\Psi_{n}\rangle=1$ per ogni $\lambda$, e rinormalizzano alla fine con il fattore $Z_{n}$. Landau sceglie $c_{n}^{(1)}=0$ perché lo stato corretto sia normalizzato <i>«a meno di termini del primo ordine»</i>. Al primo ordine le due scelte coincidono. Dal secondo ordine in poi la componente dello stato lungo $|n\rangle$ è diversa nelle due convenzioni, e lo stato al secondo ordine del problema 1 del paragrafo 38 di Landau non coincide termine per termine con la (5.1.41) di Sakurai. Le energie invece coincidono a ogni ordine, perché l&rsquo;equazione agli autovalori è omogenea e la normalizzazione non le tocca.</p>`},
  {t:'prosa', title:'Due strade per lo stesso risultato, e due cure per lo stesso guaio', tag:'architettura', html:R`
  <p><b>Serie o derivata.</b> Dirac, Landau, Ballentine e Sakurai costruiscono la serie sostituendo gli sviluppi nell&rsquo;equazione agli autovalori e uguagliando le potenze. Picasso fa un&rsquo;altra cosa: separa la perturbazione nella parte che resta dentro i livelli imperturbati e in quella che li collega, sposta la prima nella parte risolubile, e mostra che la seconda non contribuisce al primo ordine <i>derivando</i> l&rsquo;equazione agli autovalori. La strada di Picasso è meno meccanica per gli ordini alti, ma ha un vantaggio concettuale: tratta il caso non degenere e quello degenere con la stessa decomposizione, e rende naturale la procedura per i livelli quasi degeneri. La strada della serie è quella che dà la formula generale $E^{(r)}=\langle n|V|\Psi^{(r-1)}\rangle$, e con essa il metodo di Dalgarno e Lewis.</p>
  <p><b>I livelli vicini.</b> Quando due livelli imperturbati sono vicini, la serie di Rayleigh e Schrödinger diventa inaffidabile. Picasso la cura cambiando la separazione: i livelli vicini entrano nella parte risolubile, e il blocco che li contiene si diagonalizza esattamente. Ballentine la cura cambiando la serie: con l&rsquo;energia esatta al denominatore, la serie di Brillouin e Wigner resta esatta per due livelli anche nel limite degenere. Sakurai dà il criterio che separa i due regimi, il raggio di convergenza $|V|\lt\Delta/2$. Sono risposte complementari e nessun libro le dà tutte e tre.</p>`},
  {t:'prosa', title:'Il metodo variazionale: una divergenza con il documento di sintesi, e una misura', tag:'architettura', html:R`
  <p>Il documento di sintesi sui postulati che Giuseppe ha caricato, scritto da un compagno di corso, elenca fra le formulazioni della meccanica quantistica quella variazionale e la indica come <i>«metodo variazionale (spesso in esercizi)»</i>. Per questo corso la misura dice altro. Sui cinquantuno file di compiti d&rsquo;esame raccolti per il corso la parola «variazionale» non compare mai, e il programma ufficiale esclude esplicitamente il metodo variazionale insieme alle perturbazioni dipendenti dal tempo, allo scattering tridimensionale e al WKB. La divergenza si dichiara invece di sceglierne una in silenzio: l&rsquo;affermazione del documento può valere per altri corsi o per altri anni, ma su questi scritti lo strumento che si chiede è il primo ordine di Rayleigh e Schrödinger, in ventuno file su cinquantuno. Il metodo variazionale compare in questo movimento solo come confronto numerico nella tappa 11, con il valore che Picasso ne ricava per l&rsquo;elio.</p>`},
  {t:'prosa', title:'Dove la teoria delle perturbazioni riappare, in fisica', tag:'architettura', html:R`
  <p><b>Nella struttura degli atomi.</b> La struttura fine dell&rsquo;idrogeno, l&rsquo;interazione spin-orbita, l&rsquo;effetto Zeeman e l&rsquo;effetto Stark sono tutti calcolati come perturbazioni dei livelli coulombiani. Picasso, al paragrafo 16.6, mostra come struttura fine e campo magnetico, quando sono confrontabili, vadano trattati insieme con la procedura per i livelli quasi degeneri, e lì incontra il teorema di non incrocio.</p>
  <p><b>Nella spettroscopia molecolare.</b> Le costanti di anarmonicità che si misurano negli spettri vibrazionali sono, al primo ordine non banale, i coefficienti della formula di Landau della tappa 08. La pendenza con cui le distanze fra livelli calano misura la forma del potenziale oltre la parabola.</p>
  <p><b>Nella fisica della materia.</b> La polarizzabilità atomica della tappa 10 è la grandezza microscopica che determina la costante dielettrica e l&rsquo;indice di rifrazione di un gas. Le forze di van der Waals della tappa 12 tengono insieme i cristalli di gas nobili e le molecole non polari nei liquidi.</p>
  <p><b>Nella teoria dei campi.</b> Ogni calcolo di elettrodinamica quantistica è una serie perturbativa, e i diagrammi che la organizzano sono una rappresentazione grafica dei suoi termini. La lezione della tappa 08 vale anche lì: una serie che non converge può dare previsioni eccellenti, se i primi termini sono piccoli.</p>`},
  {t:'collaudo', title:'Domande d’orale', items:[
   {q:R`Mi dica che cosa vuol dire che una perturbazione è «piccola», visto che è un operatore non limitato.`,
    a:R`Vuol dire che i suoi <b>elementi di matrice</b> fra gli stati che contano sono piccoli rispetto alle <b>distanze in energia</b> fra quegli stati: $|V_{mn}|\ll|\varepsilon_{m}-\varepsilon_{n}|$. Non serve che l&rsquo;operatore sia limitato. Serve che gli stati coinvolti siano localizzati dove la perturbazione è moderata: il campo elettrico $e\mathcal Ez$ cresce senza limite, ma sul fondamentale dell&rsquo;idrogeno i suoi elementi di matrice sono dell&rsquo;ordine di $e\mathcal Ea_{0}$. Si confrontano con differenze di energia e non con energie, perché le energie sono definite a meno di una costante. In pratica il controllo si fa a posteriori, come suggerisce Picasso: si calcola la correzione e si verifica che sia piccola rispetto alla distanza dal livello più vicino.`},
   {q:R`Perché la correzione del secondo ordine allo stato fondamentale è negativa? Mi dia due argomenti.`,
    a:R`<b>Dalla formula:</b> ogni termine è un modulo quadro diviso per $\varepsilon_{0}-\varepsilon_{m}$, e sul fondamentale tutti questi denominatori sono negativi. <b>Senza la formula:</b> la somma $E^{(0)}+E^{(1)}$ è il valor medio della hamiltoniana completa sullo stato imperturbato, e il fondamentale esatto ha l&rsquo;energia più bassa fra tutti i valori medi; quindi le correzioni successive possono solo abbassarlo. Il secondo argomento dice anche che il primo ordine è sempre un limite superiore all&rsquo;energia vera del fondamentale, come si è visto per l&rsquo;elio.`},
   {q:R`Un compito chiede la correzione al primo ordine di un livello, e lei scopre che quel livello è doppiamente degenere. Che cosa fa, e perché la formula non degenere non va bene?`,
    a:R`La formula non degenere dà lo stato al primo ordine con denominatori $\varepsilon_{n}-\varepsilon_{m}$, che per due stati dello stesso livello sono nulli: se l&rsquo;elemento di matrice fra i due non è zero, il coefficiente diverge. Il problema è che nel livello degenere lo stato imperturbato «giusto» non è fissato: qualunque combinazione dei due è autovettore di $H_{0}$, e la perturbazione sceglie quale. Va scritta la matrice $2\times2$ della perturbazione nel livello e diagonalizzata; i suoi autovalori sono le correzioni al primo ordine, e i suoi autovettori sono gli stati da cui la serie può partire. Il problema a due livelli della tappa 01, nel limite $\Delta\to0$, mostra che cosa succede: i livelli si separano linearmente in $\lambda$, di $\pm\lambda|V|$.`},
   {q:R`Si indichi, per ciascuna fonte di questo movimento, un&rsquo;affermazione che non si troverebbe leggendo solo le altre.`,
    a:R`Da <b>Picasso</b>: la dimostrazione del primo ordine per derivazione rispetto al parametro, il criterio di controllo a posteriori, la stima dell&rsquo;effetto Stark che fissa a quale $n$ il metodo cede, il conto elettrostatico per l&rsquo;elio con lo ione H$^{-}$ non legato. Da <b>Ballentine</b>: la gerarchia di equazioni con la normalizzazione intermedia, l&rsquo;oscillatore esatto al secondo ordine, il metodo di Dalgarno e Lewis, la serie di Brillouin e Wigner. Da <b>Sakurai</b>: il raggio di convergenza con i punti di diramazione, la buca debole in cui la serie non esiste, il fattore $Z_{n}$ e la sua interpretazione come probabilità, la stima dall&rsquo;alto della polarizzabilità. Da <b>Dirac</b>: la condizione di senso del problema, l&rsquo;analogia con la media classica sui moti periodici, la nota sulla parola «degenere». Da <b>Landau</b>: l&rsquo;oscillatore anarmonico con i due ordini che pesano uguale, e le forze di van der Waals con il loro segno.`}
  ]}
]}

var byId = {}; TAPPE.forEach(function(s){ byId[s.num]=s; });

var VKEY='pm-nucleomq-14-visited';
function loadSeen(){ try{ return new Set(JSON.parse(localStorage.getItem(VKEY)||'[]')); }catch(e){ return new Set(); } }
function saveSeen(s){ try{ localStorage.setItem(VKEY, JSON.stringify(Array.from(s))); }catch(e){} }
var SEEN = loadSeen();

function renderNav(active){
  var nav=document.getElementById('sidebar');
  nav.innerHTML='';
  var h=document.createElement('h2'); h.textContent='Nucleo mq-14 · le tappe'; nav.appendChild(h);
  TAPPE.forEach(function(s){
    var b=document.createElement('button');
    b.className='navitem'+(active===s.num?' active':'')+(SEEN.has(s.num)?' seen':'');
    b.innerHTML='<span class="dot"></span><span class="nx">'+s.num+'</span><span>'+s.title+'</span>';
    b.onclick=function(){ showTappa(s.num); };
    nav.appendChild(b);
  });
}

/* ---- renderer dei blocchi ---- */
function sectionProsa(title, tag, html){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var body=elFromHTML('<div class="open-body">'+html+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function sectionGram(title, rows){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag gramtag">grammatica</span></h3>';
  var inner='<table class="gramtab">';
  rows.forEach(function(r){ inner+='<tr><td class="gs">'+r[0]+'</td><td>'+r[1]+'</td></tr>'; });
  inner+='</table>';
  var body=elFromHTML('<div class="gramwrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
/* --- blocco PLOT: la figura non decora, si legge. Ogni plot porta una chiave di lettura. --- */
function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';
  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionSvelabile(title, tag, html, sol){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var c=document.createElement('div'); c.className='collaudo-item';
  var q=document.createElement('div'); q.className='cq'; q.innerHTML=html||'';
  c.appendChild(q); typeset(q);
  if(sol){
    var a=document.createElement('div'); a.className='ca'; a.style.display='none';
    a.innerHTML='<b>Soluzione.</b> '+sol;
    var btn=document.createElement('button'); btn.className='reveal-btn small';
    btn.textContent='Rivela la soluzione';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a);
      btn.disabled=true; btn.classList.add('done'); btn.textContent='Soluzione rivelata'; };
    c.appendChild(btn); c.appendChild(a);
  }
  wrap.appendChild(c); return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    /* DUE SCHEMI, NON UNO — scoperto il 2026-10-06 provando le pagine vive. I movimenti
       scritti per primi (em-01..03, me-10b, i collaudi di gd-01..09 e di quattro em)
       usano una forma piu' semplice: `reveal` e `prolessi` con un solo `html`,
       `esercizio` e `collaudo` con `html` + `sol`. Il renderer ne conosceva una sola e
       chiamava `steps.forEach` su `undefined`: TypeError, e la tappa si fermava li' —
       62 blocchi in 17 movimenti su 74. Non si riscrive il contenuto per far contento
       il renderer: e' il renderer che deve leggere cio' che c'e'.
       E in fondo un ramo che NON muore: uno schema nuovo di domani deve far vedere un
       avviso in quella sezione, non spegnere la pagina sotto di se'. */
    try{
      if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
      else if(b.t==='prolessi') m.appendChild(b.rotte ? sectionProlessi(b)
                                   : sectionProsa(b.title,'prolessi',b.html));
      else if(b.t==='reveal')m.appendChild(b.steps ? sectionReveal(b.title,b.tag,b.steps)
                                   : sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='esercizio') m.appendChild(b.steps ? sectionEsercizio(b)
                                   : sectionSvelabile(b.title,'esercizio',b.html,b.sol));
      else if(b.t==='collaudo')  m.appendChild(b.items ? sectionCollaudo(b.title,b.items)
                                   : sectionSvelabile(b.title,'provi, poi riveli',b.html,b.sol));
      else if(b.t==='plot')      m.appendChild(sectionPlot(b));
      else m.appendChild(sectionProsa(b.title||'(blocco)', 'tipo sconosciuto: '+b.t,
                                      b.html||''));
    }catch(err){
      var avv=document.createElement('section'); avv.className='section';
      avv.innerHTML='<h3>'+(b.title||'(blocco)')+'<span class="tag">non reso</span></h3>'
        +'<p style="color:#ff6b6b">Questo blocco non si &egrave; potuto rendere ('
        +b.t+': '+err.message+'). Il resto della tappa continua sotto.</p>';
      m.appendChild(avv);
    }
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* I POP-UP DEGLI STRUMENTI. `cablaStrumenti` esisteva dal 18-09 e non la chiamava
     nessuno: i 229 rimandi del percorso erano <span> senza handler, e il clic non
     faceva niente. Nessun controllo poteva vederlo — la sintassi era valida, le schede
     c'erano tutte, le formule rendevano: il guasto esisteva solo a pagina viva. Qui, e
     dopo ogni inserimento successivo, perche' la tappa si rimonta da capo a ogni
     cambio e gli handler vanno riattaccati al DOM nuovo. */
  cablaStrumenti(m);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}
