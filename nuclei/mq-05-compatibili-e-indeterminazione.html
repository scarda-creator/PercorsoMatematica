<style>
  :root{

  .navitem.seen .dot{background:var(--ok);border-color:var(--ok);}
  .navitem .nx{color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto;}

  /* ---- MAIN ---- */
  .main{flex:1 1 auto;min-width:0;padding:24px 30px 90px;max-width:860px;}
  h1{font-size:1.5rem;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:.92rem;margin:0 0 18px;}
  .sfhead{border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:8px;}
  .sfhead h1{font-size:1.55rem;}
  .meta{color:var(--muted);font-size:.82rem;margin-top:6px;}

  .section{margin:26px 0;}

    display:flex;align-items:center;gap:10px;}

    border:1px solid var(--border);color:var(--muted);padding:2px 8px;border-radius:20px;
    text-transform:uppercase;}

  .section > h3 .tag.plottag{background:#101f2e;border-color:#1f3c57;color:#7ab8e0;}
  .plot-intro{color:var(--muted);font-size:.95rem;margin:0 0 12px;}
  .plot-row{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;
    background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;}
  .plot-row.due .plot-box{flex:1 1 300px;min-width:280px;}
  .plot-box{max-width:560px;}
  .plot-leggi{margin-top:10px;background:var(--panel2);border:1px solid var(--border);

  .plot-leggi b{color:#7ab8e0;}
  .plot-err{color:#ff6b6b;font-size:.85rem;}
  .open-body{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}

  .open-body ul{margin:.4em 0;padding-left:1.2em;} .open-body li{margin:.35em 0;}

  .note{background:var(--panel2);border-left:3px solid var(--muted);border-radius:6px;
    padding:9px 12px;margin:12px 0;font-size:.9rem;color:var(--muted);}
  .note b{color:#ff9d6b;}
  .note.warn{background:var(--warnbg);border-left-color:var(--warn);color:#e0b85a;}
  .note.warn b{color:#f0c25a;}

  /* ---- GRAMMATICA ---- */
  .gramwrap{background:var(--grambg);border:1px solid #1f4d47;border-radius:12px;padding:6px 6px;}
  table.gramtab{border-collapse:collapse;width:100%;font-size:.92rem;}
  table.gramtab td{padding:9px 12px;vertical-align:top;border-bottom:1px solid #17332e;}
  table.gramtab tr:last-child td{border-bottom:none;}
  table.gramtab td.gs{white-space:nowrap;color:var(--gram);width:1%;
    border-right:1px solid #17332e;font-variant-numeric:tabular-nums;}
  .section > h3 .tag.gramtag{background:var(--grambg);border-color:#1f4d47;color:var(--gram);}

  /* ---- STRUMENTI (repertorio condiviso: la scheda si apre DENTRO la frase) ----
     Nessun accento nuovo: riusa il verde della grammatica, perche' uno strumento
     richiamato e' grammatica gia' spiegata altrove, non una quinta specie di blocco. */
  .str{color:var(--gram);border-bottom:1px dashed var(--gram);cursor:pointer;}
  .str:hover{background:var(--grambg);}
  .str::after{content:"\2666";font-size:.62em;vertical-align:.42em;margin-left:2px;opacity:.8;}
  .str.aperto::after{content:"\2715";}
  .str.rotto{color:#ff6b6b;border-bottom-color:#ff6b6b;cursor:help;}
  /* la scheda e' uno SPAN in display:block, non un div: i rimandi cadono dentro
     <p>, <li> e celle di tabella, dove un div e' HTML illegale. */
  .strcard{display:block;margin:10px 0;background:var(--grambg);border:1px solid #1f4d47;

  .strcard .sh{display:block;font-size:.66rem;font-weight:700;letter-spacing:.5px;
    text-transform:uppercase;color:var(--gram);margin-bottom:7px;}

  .strcard .sk{color:var(--gram);font-weight:600;}

  .prowrap{background:var(--probg);border:1px solid var(--proedge);border-radius:12px;padding:4px 4px 8px;}

    margin-bottom:2px;} .pro-oggetto b{color:var(--txt);}
  table.protab{border-collapse:collapse;width:100%;font-size:.92rem;}
  table.protab td{padding:10px 12px;vertical-align:top;border-bottom:1px solid var(--proline);}
  table.protab tr:last-child td{border-bottom:none;}
  table.protab td.pd{white-space:nowrap;color:var(--pro);width:1%;font-weight:700;font-size:.78rem;

  .pro-domanda{margin:8px 8px 2px;background:#140d26;border:1px solid var(--proedge);

  .pro-domanda b{color:var(--pro);}
  .section > h3 .tag.protag{background:var(--probg);border-color:var(--proedge);color:var(--pro);}

  /* ---- REVEAL ---- */
  .rsteps{display:flex;flex-direction:column;gap:12px;}
  .rstep{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 18px;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .rlabel{font-size:.7rem;font-weight:700;letter-spacing:.4px;color:var(--accent);
    text-transform:uppercase;margin-bottom:8px;}
  .rstep p:first-of-type{margin-top:0;} .rstep p:last-child{margin-bottom:0;}
  .rstep ul{margin:.4em 0;padding-left:1.2em;}
  .testo{background:#13233f;border:1px solid #2b4877;border-radius:12px;padding:14px 18px;margin-bottom:14px;}
  .testo .src{display:block;font-size:.74rem;font-style:italic;color:var(--accent2);margin-bottom:8px;
    text-transform:uppercase;letter-spacing:.3px;}
  .esame-nota{font-size:.9rem;color:var(--muted);font-style:italic;margin-top:12px;padding-left:12px;

  .reveal-btn{background:var(--accent);color:#fff;border:none;padding:11px 18px;border-radius:10px;

  .reveal-btn.small:hover:not(:disabled){border-color:var(--accent);}
  .reveal-btn:disabled,.reveal-btn.done{background:var(--panel2);color:var(--muted);
    border:1px solid var(--border);cursor:default;}

  /* ---- COLLAUDO ---- */
  .collaudo-item{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 18px;margin-bottom:12px;}
  .cq{margin-bottom:10px;}
  .ca{margin-top:12px;background:var(--okbg);border:1px solid #235c33;border-radius:8px;
    padding:10px 14px;font-size:.94rem;}
  .ca b{color:#5fd980;}

  /* ---- PREV / NEXT ---- */
  .prevnext{display:flex;justify-content:space-between;gap:12px;margin-top:40px;
    border-top:1px solid var(--border);padding-top:20px;}
  .pnbtn{flex:1 1 0;background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:12px 16px;cursor:pointer;color:var(--txt);text-align:left;transition:.14s;font:inherit;}
  .pnbtn:hover{border-color:var(--accent);background:var(--panel2);}
  .pnbtn.next{text-align:right;}
  .pnbtn .k{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .pnbtn .t{font-weight:600;color:var(--accent2);}
  .pnbtn:disabled{opacity:.35;cursor:default;border-color:var(--border);background:var(--panel);}

  code{background:var(--panel2);border:1px solid var(--border);border-radius:5px;
    padding:1px 5px;font-size:.85em;color:var(--accent2);}
  .katex{font-size:1.02em;color:var(--txt);} .katex-display{margin:.5em 0;overflow-x:auto;overflow-y:hidden;}

  @media(max-width:860px){
    .shell{flex-direction:column;}
    .sidebar{width:100%;flex:none;position:static;max-height:none;border-right:none;
      border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:4px;}
    .sidebar h2{width:100%;} .navitem{width:auto;}
    .main{padding:20px 16px 80px;}
  }
</style>

<script>

const R = String.raw;

function typeset(el){

function elFromHTML(html){ var d=document.createElement('div'); d.innerHTML=html; return d; }

/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un
   rimando scritto nella prosa:

       <span class="str" data-str="serie-geometrica">la serie geometrica</span>

   Le schede citate da questo nucleo sono cucite qui sotto dal montaggio
   (assembla-nucleo.js): la pagina resta autosufficiente — niente fetch,
   niente sottocartelle da pubblicare — e un rimando a una scheda che non
   esiste FERMA la costruzione invece di arrivare in pagina rotto.
   Apertura: lo stesso gesto del collaudo (si clicca, il pannello compare,
   si typeset una volta sola), portato dentro la frase.
   =================================================================== */
var CORSO = 'meccanica-quantistica';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["commutatore"] = {"nome":"Commutatore","riga":"$[\\hat A,\\hat B]=\\hat A\\hat B-\\hat B\\hat A$, antisimmetrico, con la regola di Leibniz $[\\hat A,\\hat B\\hat C]=[\\hat A,\\hat B]\\hat C+\\hat B[\\hat A,\\hat C]$ e la relazione canonica $[\\hat x,\\hat p]=i\\hbar$.","serve":"E' la misura di quanto due operazioni dipendano dall'ordine, e qui l'ordine e' fisica: due osservabili che non commutano non hanno una base comune di autostati, quindi non si misurano insieme con precisione arbitraria. Quasi ogni conto che sembra magico — l'algebra del momento angolare, gli operatori di salita e discesa, il teorema di Ehrenfest — e' una manipolazione di commutatori fatta con quelle regole e nient'altro.","esempio":"Dalla regola di Leibniz, $[\\hat x,\\hat p^{2}]=[\\hat x,\\hat p]\\hat p+\\hat p[\\hat x,\\hat p]=2i\\hbar\\hat p$. E' il conto che fa uscire il teorema di Ehrenfest: la meccanica classica ricompare come relazione fra valori medi, e ricompare perche' quel commutatore vale proprio $2i\\hbar\\hat p$.","debito":"l'identita' di Jacobi si enuncia e non si dimostra; la corrispondenza fra commutatore e parentesi di Poisson — che e' l'idea di Dirac e non un'analogia decorativa — sta in mq-07, e li' va letta per intero.","controllo":[{"tipo":"uguale","sinistra":"I*hbar*p + p*I*hbar","vale":"2*I*hbar*p","ipotesi":{"hbar":"positive","p":"real"},"dove":"esempio","appare":"2i\\hbar\\hat p"},{"tipo":"simbolico","dove":"riga","appare":"[\\hat x,\\hat p]=i\\hbar","perche":"e' la relazione di commutazione canonica, il POSTULATO da cui discende il resto della teoria: non si dimostra, si assume, ed e' cio' che separa la meccanica quantistica dalla classica"}],"qui":{},"pieno":null};
STRUM["spazio-di-hilbert"] = {"nome":"Spazio di Hilbert","riga":"E' uno spazio vettoriale complesso con prodotto interno, completo nella norma che ne deriva e separabile, cosicche' ogni stato si scrive come somma numerabile $|\\psi\\rangle=\\sum_n c_n|n\\rangle$ con $c_n=\\langle n|\\psi\\rangle$.","serve":"E' la casa degli stati, e le tre parole della definizione fanno tre lavori diversi. Il prodotto interno da' le ampiezze, e quindi le probabilita'. La completezza garantisce che il limite di una successione di stati sia ancora uno stato: senza, uno sviluppo in serie potrebbe convergere fuori dallo spazio. La separabilita' permette di scrivere un vettore con una lista numerabile di coefficienti, cioe' di fare i conti.","esempio":"La relazione di completezza $\\sum_n|n\\rangle\\langle n|=\\hat 1$ e' lo strumento operativo piu' usato della teoria: infilata dentro un prodotto scalare lo spezza in una somma. La norma diventa $\\langle\\psi|\\psi\\rangle=\\sum_n|c_n|^{2}$, e se lo stato e' normalizzato quella somma vale uno: i moduli quadri dei coefficienti sono probabilita', e sommano a uno per costruzione.","debito":"la costruzione di $L^{2}$ come completamento, la misura di Lebesgue che serve a definirlo e il teorema di Riesz-Fischer stanno nei movimenti di Metodi; qui si usa il risultato.","controllo":[{"tipo":"somma","espr":"(1/2)**n","var":"n","da":"1","a":"oo","vale":"1","ipotesi":{"n":"positive-integer"},"dove":"esempio","appare":"sommano a uno"},{"tipo":"simbolico","dove":"esempio","appare":"\\sum_n|n\\rangle\\langle n|=\\hat 1","perche":"e' la relazione di completezza: i proiettori sugli elementi di una base ortonormale sommano all'identita'. E' la proprieta' che definisce una base completa, non un conto"}],"qui":{},"pieno":null};
STRUM["proiettore-ortogonale"] = {"nome":"Proiettore ortogonale","riga":"Un proiettore ortogonale e' un operatore $\\hat P$ che soddisfa due condizioni insieme: $\\hat P^2=\\hat P$ (idempotenza — proiettare due volte equivale a proiettare una volta) e $\\hat P^{\\dagger}=\\hat P$ (autoaggiuntezza, che rende la proiezione perpendicolare al sottospazio invece che obliqua).","serve":"E' il mattone di tutta la teoria della misura: $\\hat P=|\\psi\\rangle\\langle\\psi|$ su un ket normalizzato e' l'osservabile «lo stato e' $|\\psi\\rangle$?» con esiti $1$ e $0$, e il suo valor medio e' la probabilita'. L'identita' si scrive come somma di proiettori, $\\mathbb 1=\\sum_i\\hat P_i$, ed e' con questa che si cambia base e si decompone un'osservabile.","esempio":"Da $|\\psi\\rangle=(\\tfrac35,\\tfrac45)$ normalizzato si costruisce $\\hat P=|\\psi\\rangle\\langle\\psi|$ con entrate $\\tfrac{9}{25},\\tfrac{12}{25},\\tfrac{16}{25}$. L'elemento $(1,1)$ di $\\hat P^2$ vale $(\\tfrac{9}{25})^2+(\\tfrac{12}{25})^2=\\tfrac{9}{25}$, cioe' $\\hat P^2=\\hat P$; la traccia e' $\\tfrac{9}{25}+\\tfrac{16}{25}=1$, come per ogni proiettore di rango uno.","debito":"la decomposizione spettrale di un operatore autoaggiunto con spettro continuo in una famiglia di proiettori $E(\\lambda)$ (la misura spettrale) sta fuori da qui: si usa il caso discreto, dove i proiettori sono $|i\\rangle\\langle i|$.","controllo":[{"tipo":"simbolico","dove":"esempio","appare":"\\hat P^2=\\hat P","perche":"e' l'idempotenza, meta' della definizione di proiettore: un'identita' fra operatori, non un conto numerico. Il caso concreto che la sostiene e' l'entrata $(1,1)$ asserita qui sotto, dove i numeri ci sono"},{"tipo":"uguale","sinistra":"(Rational(9,25))**2+(Rational(12,25))**2","vale":"9/25","dove":"esempio","appare":"(\\tfrac{9}{25})^2+(\\tfrac{12}{25})^2=\\tfrac{9}{25}"},{"tipo":"uguale","sinistra":"Rational(9,25)+Rational(16,25)","vale":"1","dove":"esempio","appare":"\\tfrac{9}{25}+\\tfrac{16}{25}=1"}],"qui":{},"pieno":null};
STRUM["matrici-di-pauli"] = {"nome":"Matrici di Pauli","riga":"Sono le tre matrici $2\\times2$ hermitiane a traccia nulla il cui quadrato e' l'identita' e il cui commutatore riproduce l'algebra del momento angolare, da cui lo spin $\\hat S_i=\\tfrac{\\hbar}{2}\\sigma_i$.","serve":"Sono la rappresentazione piu' piccola non banale del momento angolare, e insieme all'identita' formano una base di tutte le matrici due per due hermitiane: qualunque osservabile di un sistema a due stati e' una combinazione dell'identita' e delle tre. Ogni conto di spin un mezzo — Stern-Gerlach, precessione, risonanza magnetica, qubit — si riduce alla loro algebra.","esempio":"Siccome il quadrato di una combinazione unitaria delle tre e' l'identita', qualunque esponenziale collassa: l'operatore di rotazione dello spinore diventa $\\cos(\\theta/2)$ per l'identita' meno $i\\sin(\\theta/2)$ per la combinazione. Il mezzo nell'angolo e' la ragione per cui una rotazione di un giro intero cambia segno allo stato, perche' $\\cos(\\pi)=-1$.","debito":"la costruzione generale delle rappresentazioni di SU(2) e il suo legame con SO(3) stanno nel movimento sul momento angolare; qui c'e' il caso di spin un mezzo con le sue regole di calcolo.","controllo":[{"tipo":"uguale","sinistra":"cos(2*pi/2)","vale":"-1","dove":"esempio","appare":"\\cos(\\pi)=-1"},{"tipo":"uguale","sinistra":"cos(pi/3)**2+sin(pi/3)**2","vale":"1","dove":"esempio","appare":"\\sin(\\theta/2)"}],"qui":{},"pieno":null};
STRUM["operatore-aggiunto"] = {"nome":"Operatore aggiunto e autoaggiunto","riga":"L'aggiunto e' definito da $\\langle\\phi|\\hat A\\psi\\rangle=\\langle\\hat A^{\\dagger}\\phi|\\psi\\rangle$ per ogni coppia di stati, e l'operatore e' autoaggiunto quando coincidono sia $\\hat A^{\\dagger}$ con $\\hat A$ sia i loro domini.","serve":"E' la condizione che rende un operatore un'osservabile: autovalori reali, e autovettori di autovalori distinti ortogonali. In dimensione finita «autoaggiunto» e «hermitiano» coincidono; in dimensione infinita no, e la differenza non e' pedanteria — l'operatore impulso su una semiretta e' hermitiano e non autoaggiunto, e infatti non e' un'osservabile.","esempio":"Se $\\hat A\\psi=a\\psi$ con $\\hat A$ autoaggiunto, allora $a\\langle\\psi|\\psi\\rangle=\\langle\\psi|\\hat A\\psi\\rangle=\\langle\\hat A\\psi|\\psi\\rangle=a^{*}\\langle\\psi|\\psi\\rangle$; siccome la norma non e' nulla segue $a=a^{*}$, cioe' l'autovalore e' reale. Tre righe, e sono la ragione per cui le osservabili si rappresentano cosi'.","debito":"la distinzione fra hermitiano e autoaggiunto in dimensione infinita — domini, estensioni, indici di difetto — e' il programma di von Neumann e sta fuori da questo percorso: qui si dichiara che esiste e si lavora nel caso buono. La regola di inversione dell'ordine nell'aggiunto di un prodotto si usa e non si dimostra.","controllo":[{"tipo":"uguale","sinistra":"conjugate(a)","vale":"a","ipotesi":{"a":"real"},"dove":"esempio","appare":"a=a^{*}"}],"qui":{},"pieno":null};
STRUM["spettro"] = {"nome":"Spettro di un operatore","riga":"Lo spettro di un operatore e' l'insieme dei possibili esiti di una misura — i suoi autovalori — e puo' essere discreto (autovalori separati, autovettori in $\\mathcal H$), continuo (autovalori che riempiono un intervallo, autovettori non normalizzabili), o misto.","serve":"E' la quantita' che la fisica chiede davvero: scrivere l'hamiltoniana e trovarne lo spettro E' il problema d'esame. La distinzione discreto/continuo non e' tecnica — decide se un autostato e' uno stato preparabile (discreto) o una distribuzione che vive fuori dallo spazio di Hilbert (continuo), come l'onda piana e la delta.","esempio":"Per $\\sigma_z=\\begin{pmatrix}1&0\\\\0&-1\\end{pmatrix}$ lo spettro e' $\\{+1,-1\\}$, discreto, e i due invarianti della matrice lo riassumono senza risolvere l'equazione secolare: la somma degli autovalori e' la traccia, $\\operatorname{tr}\\sigma_z=0$, il loro prodotto e' il determinante, $\\det\\sigma_z=-1$. Per l'operatore posizione lo spettro e' tutta la retta reale, continuo, e gli autovettori sono delte di Dirac.","debito":"la costruzione rigorosa dello spettro continuo (teorema spettrale generalizzato, misura spettrale $E(\\lambda)$ di von Neumann) sta fuori da questo percorso: qui si dichiara che esiste e si lavora coi casi concreti. La separazione fra spettro continuo e spettro residuo non si tratta.","controllo":[{"tipo":"uguale","sinistra":"Matrix([[1,0],[0,-1]]).trace()","vale":"0","dove":"esempio","appare":"\\operatorname{tr}\\sigma_z=0"},{"tipo":"uguale","sinistra":"Matrix([[1,0],[0,-1]]).det()","vale":"-1","dove":"esempio","appare":"\\det\\sigma_z=-1"}],"qui":{},"pieno":null};
STRUM["armoniche-sferiche"] = {"nome":"Armoniche sferiche","riga":"$Y_\\ell^{m}(\\theta,\\varphi)$ sono le autofunzioni simultanee di $\\hat L^{2}$, con autovalore $\\hbar^{2}\\ell(\\ell+1)$, e di $\\hat L_z$, con autovalore $\\hbar m$, ortonormali e complete sulla sfera.","serve":"Sono la parte angolare di ogni problema a simmetria sferica: appena il potenziale dipende solo dalla distanza, l'equazione si separa e la dipendenza angolare e' sempre una di queste, qualunque sia il potenziale. Cio' che cambia da problema a problema e' solo la parte radiale — per questo si imparano una volta e si riusano sempre.","esempio":"Per ogni $\\ell$ ci sono $2\\ell+1$ valori di $m$: e' la degenerazione essenziale di ogni livello a simmetria sferica, e non dipende dal potenziale. Per $\\ell=2$ vengono $2\\cdot2+1=5$ stati. La prima armonica e' costante, ed e' il motivo per cui lo stato fondamentale di un potenziale centrale e' sempre sfericamente simmetrico.","debito":"la costruzione esplicita dai polinomi di Legendre associati, e le formule di ricorrenza, non stanno qui: si usano gli enunciati e l'ortonormalita'.","controllo":[{"tipo":"uguale","sinistra":"2*2+1","vale":"5","dove":"esempio","appare":"2\\cdot2+1=5"},{"tipo":"simbolico","dove":"riga","appare":"\\hbar^{2}\\ell(\\ell+1)","perche":"e' l'autovalore del quadrato del momento angolare, che discende dall'algebra dei commutatori e non dalla forma esplicita delle armoniche. Si enuncia qui perche' e' cio' che le definisce"}],"qui":{},"pieno":null};
STRUM["derivazione"] = {"nome":"Derivazione (regola di Leibniz)","riga":"Un operatore lineare $D$ su un'algebra che rispetta la regola del prodotto: $D(fg)=f\\,D(g)+g\\,D(f)$. È la proprietà che isola «derivare» fra tutti gli operatori lineari possibili.","serve":"È il modo algebrico di definire la derivata senza limiti, e serve ogni volta che si vuole derivare su un oggetto dove non c'è un rapporto incrementale da fare — su una varietà astratta, su un'algebra di matrici, su un anello di polinomi. La conseguenza operativa più usata è che **una derivazione è determinata dai suoi valori sui generatori**: su $\\mathbb{R}^{n}$ basta sapere quanto vale sulle coordinate $x^{1},\\dots,x^{n}$, e da lì Leibniz e la linearità danno tutto il resto. È il motivo per cui un vettore tangente, definito come derivazione, si scrive sempre come combinazione delle $\\partial/\\partial x^{i}$: non perché lo si sia scelto, ma perché non c'è altro. Un secondo fatto, che si dimostra in due righe e si usa continuamente: la **composizione** di due derivazioni non è una derivazione (compaiono derivate seconde), ma la loro **differenza incrociata** $DE-ED$ lo è, perché i termini secondi si cancellano a coppie.","esempio":"Su $\\mathbb{R}$, l'operatore $d/dx$ verificato sul prodotto $f=x^{2}$ e $g=x^{3}$: la regola dice $x^{2}\\cdot3x^{2}+x^{3}\\cdot2x$, cioè $5x^{4}$, e la derivata diretta di $x^{5}$ dà lo stesso $5x^{4}$. Il conto è banale ed è il punto: Leibniz non aggiunge informazione su $\\mathbb{R}$, dove la derivata si sa già fare. Aggiunge informazione quando è l'unica cosa che si ha — per esempio sull'algebra delle matrici, dove $D(A)=MA-AM$ per una matrice fissata $M$ è una derivazione, e la verifica di Leibniz consiste nello sviluppare $M(AB)-(AB)M$ e riconoscerlo come somma di $A\\,D(B)$ e $D(A)\\,B$, cosa che riesce perché i due termini $AMB$ introdotti dallo sviluppo compaiono con segni opposti e si cancellano.","debito":"che le derivazioni in un punto di una varietà siano esattamente i vettori tangenti è il teorema di gd-06 e non si ripete qui; il caso delle algebre non commutative è citato come esempio e non sviluppato.","controllo":[{"tipo":"uguale","sinistra":"x**2*3*x**2+x**3*2*x","vale":"5*x**4","ipotesi":{"x":"real"},"dove":"esempio","appare":"5x^{4}"},{"tipo":"derivata","espr":"x**5","rispetto":["x"],"vale":"5*x**4","ipotesi":{"x":"real"},"dove":"esempio","appare":"derivata diretta di $x^{5}$"}]};
STRUM["disuguaglianza-di-schwarz"] = {"nome":"Disuguaglianza di Cauchy-Schwarz","riga":"$|\\langle\\phi|\\psi\\rangle|^{2}\\le\\langle\\phi|\\phi\\rangle\\,\\langle\\psi|\\psi\\rangle$, con l'uguaglianza se e solo se i due vettori sono proporzionali.","serve":"E' la disuguaglianza da cui nasce il principio di indeterminazione. Applicata agli scarti di due osservabili, e tenendo la sola parte immaginaria del prodotto scalare, da' un limite inferiore al prodotto delle due varianze pari al quadrato di $\\tfrac{1}{2i}\\langle[\\hat A,\\hat B]\\rangle$. L'indeterminazione non e' un postulato: e' Cauchy-Schwarz piu' un commutatore.","esempio":"Con posizione e impulso il commutatore vale $i\\hbar$, e la disuguaglianza diventa $\\sigma_x^{2}\\sigma_p^{2}\\ge\\hbar^{2}/4$, cioe' $\\sigma_x\\sigma_p\\ge\\hbar/2$. Il fattore un mezzo viene dal $2i$ al denominatore, non da una convenzione scelta.","debito":"la dimostrazione della disuguaglianza — il discriminante della norma quadra di una combinazione lineare — e' quella standard degli spazi con prodotto interno e non si ripete qui.","controllo":[{"tipo":"uguale","sinistra":"(1/(2*I)*(I*hbar))**2","vale":"hbar**2/4","ipotesi":{"hbar":"positive"},"dove":"esempio","appare":"\\hbar^{2}/4"},{"tipo":"uguale","sinistra":"sqrt(hbar**2/4)","vale":"hbar/2","ipotesi":{"hbar":"positive"},"dove":"esempio","appare":"\\hbar/2"}],"qui":{},"pieno":null};
STRUM["integrale-gaussiano"] = {"nome":"Integrale gaussiano","riga":"$\\displaystyle\\int_{-\\infty}^{+\\infty} e^{-ax^{2}}\\,dx=\\sqrt{\\pi/a}$ per $a\\gt 0$, e $\\displaystyle\\int_{-\\infty}^{+\\infty} x^{2}e^{-ax^{2}}\\,dx=\\tfrac12\\sqrt{\\pi/a^{3}}$.","serve":"E' l'unico integrale che serve davvero sapere a memoria in meccanica statistica, perche' l'energia cinetica e' quadratica nell'impulso e quindi ogni integrazione sugli impulsi e' una gaussiana. Il trucco della dimostrazione — elevare al quadrato e passare in coordinate polari — vale la pena di vederlo una volta: e' il motivo per cui compare un $\\pi$ in una formula che di cerchi non parla.","esempio":"Da $I^{2}=\\iint e^{-a(x^{2}+y^{2})}dx\\,dy=\\int_0^\\infty 2\\pi r\\,e^{-ar^{2}}dr=\\pi/a$ segue $I=\\sqrt{\\pi/a}$. I momenti superiori si ottengono derivando rispetto ad $a$ sotto il segno: $-\\partial_a I=\\int x^{2}e^{-ax^{2}}dx=\\tfrac12\\sqrt{\\pi}\\,a^{-3/2}$. Derivare rispetto a un parametro e' piu' rapido che integrare per parti, e funziona per tutti i momenti pari.","debito":"il caso di esponente immaginario — l'integrale di Fresnel $\\int e^{iax^{2}}dx$, che si ottiene ruotando il cammino nel piano complesso e che in meccanica quantistica e' il propagatore libero — non sta qui: in tutte le gaussiane di questo percorso $a$ e' reale e positivo, e la convergenza non e' in discussione.","controllo":[{"tipo":"integrale","espr":"exp(-a*x**2)","var":"x","da":"-oo","a":"oo","vale":"sqrt(pi/a)","ipotesi":{"a":"positive","x":"real"},"dove":"riga","appare":"\\sqrt{\\pi/a}"},{"tipo":"integrale","espr":"x**2*exp(-a*x**2)","var":"x","da":"-oo","a":"oo","vale":"sqrt(pi/a**3)/2","ipotesi":{"a":"positive","x":"real"},"dove":"riga","appare":"\\tfrac12\\sqrt{\\pi/a^{3}}"},{"tipo":"integrale","espr":"2*pi*r*exp(-a*r**2)","var":"r","da":"0","a":"oo","vale":"pi/a","ipotesi":{"a":"positive","r":"positive"},"dove":"esempio","appare":"2\\pi r\\,e^{-ar^{2}}dr=\\pi/a"},{"tipo":"integrale","espr":"x**2*exp(-a*x**2)","var":"x","da":"-oo","a":"oo","vale":"sqrt(pi)*a**Rational(-3,2)/2","ipotesi":{"a":"positive","x":"real"},"dove":"esempio","appare":"\\tfrac12\\sqrt{\\pi}\\,a^{-3/2}"},{"tipo":"integrale","espr":"exp(-b*p**2/(2*m))","var":"p","da":"-oo","a":"oo","vale":"sqrt(2*pi*m/b)","ipotesi":{"b":"positive","m":"positive","p":"real"},"dove":"qui.meccanica-statistica.esempio","appare":"\\sqrt{2\\pi m/\\beta}"},{"tipo":"uguale","sinistra":"V/(h/sqrt(2*pi*m*k*T))**3","vale":"V*(2*pi*m*k*T)**Rational(3,2)/h**3","ipotesi":{"V":"positive","h":"positive","m":"positive","k":"positive","T":"positive"},"dove":"qui.meccanica-statistica.esempio","appare":"V/\\lambda^{3}"},{"tipo":"uguale","sinistra":"integrate(p**2/(2*m)*exp(-b*p**2/(2*m)),(p,-oo,oo))/integrate(exp(-b*p**2/(2*m)),(p,-oo,oo))","vale":"1/(2*b)","ipotesi":{"b":"positive","m":"positive","p":"real"},"dove":"qui.meccanica-statistica.esempio","appare":"1/2\\beta=\\tfrac12 kT"}],"pieno":null,"qui":{"meccanica-statistica":{"serve":"La funzione di partizione di una particella libera e' un prodotto di tre gaussiane negli impulsi, e da li' esce la lunghezza d'onda termica $\\lambda=h/\\sqrt{2\\pi m k T}$ — che e' la grandezza con cui si misura quando un gas smette di essere classico.","esempio":"$\\int e^{-\\beta p^{2}/2m}dp=\\sqrt{2\\pi m/\\beta}$, quindi $Z_{1}=\\dfrac{V}{h^{3}}(2\\pi mkT)^{3/2}=V/\\lambda^{3}$, che e' la stessa cosa scritta due volte perche' $\\lambda=h/\\sqrt{2\\pi mkT}$. Lo stesso integrale col peso $p^{2}$ da' $\\langle p^{2}/2m\\rangle=1/2\\beta=\\tfrac12 kT$ per grado di liberta': l'equipartizione non e' un principio a parte, e' questo integrale."}}};
STRUM["trasformata-di-fourier"] = {"nome":"Trasformata di Fourier","riga":"L'operazione $\\hat f(k)=\\int f(x)\\,e^{-ikx}\\,dx$, che riscrive una funzione come sovrapposizione di onde piane e manda la derivata in una moltiplicazione per $ik$.","serve":"È lo strumento che rende ALGEBRICA un'equazione differenziale lineare a coefficienti costanti: con $\\partial_x$ che diventa $ik$, un'equazione differenziale in $x$ diventa un'equazione algebrica in $k$, si risolve, e si antitrasforma. Le due cose da non perdere sono la convenzione dei $2\\pi$, che cambia da testo a testo e va dichiarata una volta, e Plancherel, che dice che la trasformata conserva la norma $L^{2}$ — in fisica, l'energia.","esempio":"La gaussiana $f(x)=e^{-x^{2}/2}$ ha trasformata $\\int_{-\\infty}^{+\\infty}e^{-x^{2}/2}e^{-ikx}\\,dx=\\sqrt{2\\pi}\\,e^{-k^{2}/2}$: ancora una gaussiana, tanto più larga quanto l'originale è stretta. È il caso in cui si vede meglio il principio di indeterminazione come fatto puramente matematico.","pieno":{"file":"15-distribuzioni.html","tappa":"02","come":"le proprietà, la derivata che diventa un prodotto e Plancherel, nel nucleo delle distribuzioni"},"qui":{"elettromagnetismo":{"serve":"Serve appena si scrive un'onda generica invece di una monocromatica: ogni soluzione delle equazioni di Maxwell nel vuoto è una sovrapposizione di onde piane $e^{i(\\mathbf k\\cdot\\mathbf x-\\omega t)}$, e la trasformata è il modo di scomporla. Su ciascuna componente l'equazione delle onde si riduce alla relazione di dispersione, e la propagazione diventa un far girare fasi: ogni modo viaggia da solo, e nel vuoto tutti alla stessa velocità — per questo un impulso non si deforma.","esempio":"La sostituzione $\\partial_x\\to ik$ e $\\partial_t\\to-i\\omega$ manda le derivate seconde in $(ik)^{2}=-k^{2}$ e $(-i\\omega)^{2}=-\\omega^{2}$: l'equazione delle onde diventa $\\omega^{2}=c^{2}k^{2}$, cioè un'equazione di secondo grado al posto di una differenziale, e la sua radice positiva $\\omega=ck$ è la relazione di dispersione del vuoto."}},"controllo":[{"tipo":"integrale","espr":"exp(-x**2/2)*exp(-I*k*x)","var":"x","da":"-oo","a":"oo","vale":"sqrt(2*pi)*exp(-k**2/2)","ipotesi":{"k":"real"},"dove":"esempio","appare":"\\sqrt{2\\pi}\\,e^{-k^{2}/2}"},{"tipo":"uguale","sinistra":"(I*k)**2","vale":"-k**2","ipotesi":{"k":"real"},"dove":"qui.elettromagnetismo.esempio","appare":"-k^{2}"},{"tipo":"uguale","sinistra":"(-I*w)**2","vale":"-w**2","ipotesi":{"w":"real"},"dove":"qui.elettromagnetismo.esempio","appare":"-\\omega^{2}"},{"tipo":"uguale","sinistra":"(c*k)**2","vale":"c**2*k**2","dove":"qui.elettromagnetismo.esempio","appare":"c^{2}k^{2}"}]};
STRUM["traccia"] = {"nome":"Traccia di un operatore","riga":"La traccia e' la somma degli elementi diagonali, $\\operatorname{tr}\\hat A=\\sum_i\\langle i|\\hat A|i\\rangle$, e non dipende dalla base ortonormale scelta perche' e' invariante per permutazione ciclica: $\\operatorname{tr}(\\hat A\\hat B)=\\operatorname{tr}(\\hat B\\hat A)$, da cui $\\operatorname{tr}(\\hat U^{\\dagger}\\hat A\\hat U)=\\operatorname{tr}\\hat A$.","serve":"E' il modo di estrarre un numero da un operatore senza privilegiare una rappresentazione. Il valor medio di un'osservabile su uno stato si scrive $\\langle A\\rangle=\\operatorname{tr}(\\rho\\hat A)$ con $\\rho=|\\psi\\rangle\\langle\\psi|$, e questa forma — a differenza di $\\langle\\psi|\\hat A|\\psi\\rangle$ — vale identica per gli stati misti, dove $\\rho$ non e' piu' un proiettore: e' la porta verso la matrice densita' e la decoerenza.","esempio":"Per $A=\\begin{pmatrix}1&2\\\\3&4\\end{pmatrix}$ e $B=\\begin{pmatrix}0&1\\\\1&0\\end{pmatrix}$, pur essendo $AB\\neq BA$, le due tracce coincidono: $AB=\\begin{pmatrix}2&1\\\\4&3\\end{pmatrix}$ da' $\\operatorname{tr}(AB)=2+3=5$, mentre $BA=\\begin{pmatrix}3&4\\\\1&2\\end{pmatrix}$ da' $\\operatorname{tr}(BA)=3+2=5$. La traccia di un proiettore di rango uno vale $1$, e in generale la traccia di un proiettore e' la dimensione del sottospazio su cui proietta.","debito":"la traccia di un operatore in dimensione infinita esiste solo per la classe degli operatori a traccia (totalmente continui), e la costruzione rigorosa — $\\operatorname{tr}(\\hat A^{\\dagger}\\hat A)=\\sum_\\mu\\|\\hat A\\phi_\\mu\\|^2$ indipendente dalla base, von Neumann cap. II.11 — qui si cita. Si lavora col caso in cui la somma converge.","controllo":[{"tipo":"uguale","sinistra":"(Matrix([[1,2],[3,4]])*Matrix([[0,1],[1,0]])).trace()","vale":"5","dove":"esempio","appare":"\\operatorname{tr}(AB)=2+3=5"},{"tipo":"uguale","sinistra":"(Matrix([[0,1],[1,0]])*Matrix([[1,2],[3,4]])).trace()","vale":"5","dove":"esempio","appare":"\\operatorname{tr}(BA)=3+2=5"},{"tipo":"uguale","sinistra":"Matrix([[1,2],[3,4]])*Matrix([[0,1],[1,0]])","vale":"Matrix([[2,1],[4,3]])","dove":"esempio","appare":"AB=\\begin{pmatrix}2&1\\\\4&3\\end{pmatrix}"},{"tipo":"uguale","sinistra":"Matrix([[0,1],[1,0]])*Matrix([[1,2],[3,4]])","vale":"Matrix([[3,4],[1,2]])","dove":"esempio","appare":"BA=\\begin{pmatrix}3&4\\\\1&2\\end{pmatrix}"}],"qui":{},"pieno":null};
STRUM["delta-di-dirac"] = {"nome":"Delta di Dirac","riga":"Non è una funzione ma un funzionale, definito da $\\int f(x)\\,\\delta(x-a)\\,dx=f(a)$, che composto con una funzione si spezza sui suoi zeri come $\\delta(g(x))=\\sum_i \\delta(x-x_i)/|g'(x_i)|$.","serve":"Serve come macchina per cambiare variabile senza invertire nulla. La densità di $y=f(x)$ si scrive $p_Y(y)=\\int p_X(x)\\,\\delta(y-f(x))\\,dx$, e la delta produce da sola il fattore $1/|f'|$ che altrimenti andrebbe messo a mano: i rami molteplici si contano da soli invece di doverli ricordare. È la ragione pratica per cui il formalismo con la delta compare in ogni soluzione d'esame che tocchi una distribuzione, mentre il cambio di variabile esplicito compare quasi mai.","esempio":"$\\delta(x^2-a^2)$ con $a$ positivo. Gli zeri sono $x=\\pm a$; la derivata dell'argomento è $2x$, che in modulo vale $2a$ su entrambi. Quindi $\\delta(x^2-a^2)=\\dfrac{1}{2a}\\big[\\delta(x-a)+\\delta(x+a)\\big]$. Il caso si ripete identico in fisica statistica con $\\varepsilon=p^2/2m$ in una dimensione, dove i due rami $p=\\pm\\sqrt{2m\\varepsilon}$ contribuiscono entrambi — e dimenticarne uno dimezza la risposta.","pieno":{"file":"15-distribuzioni.html","tappa":"01","come":"le distribuzioni come funzionali, la delta e le sue proprietà, nel nucleo di Metodi"},"qui":{"meccanica-statistica":{"serve":"È lo strumento con cui si calcola la densità degli stati, cioè l'oggetto su cui poggia tutto il secondo tempo del corso: $g(\\varepsilon)=\\int d^dp\\,d^dq\\;\\delta(\\varepsilon-H)/h^d$. L'identità che si usa davvero non è la definizione ma questa: $\\delta(\\varepsilon-H)=\\partial_\\varepsilon\\,\\theta(\\varepsilon-H)$. Si scambia l'integrale con la derivata e ci si ritrova a calcolare il volume della regione dove l'hamiltoniana sta sotto $\\varepsilon$ — un integrale elementare — invece di un integrale con una delta dentro. La $g$ così ottenuta è pura geometria dello spazio delle fasi: non sa nulla della temperatura, e per questo resta identica quando si passa da Boltzmann a Fermi o a Bose.","esempio":"Particella libera in due dimensioni. Il volume della regione $p^2/2m$ sotto $\\varepsilon$ è il disco di area $2\\pi m\\varepsilon$; derivando rispetto a $\\varepsilon$ si ottiene $2\\pi m$, cioè una densità degli stati costante. Non è una curiosità: è la ragione per cui in due dimensioni una particella libera non condensa, e per cui le prove che chiedono la condensazione in $d=2$ mettono sempre un potenziale confinante, che porta la $g$ da costante a crescente."}},"controllo":[{"tipo":"derivata","espr":"x**2-a**2","rispetto":["x"],"vale":"2*x","ipotesi":{"x":"positive","a":"positive"},"dove":"esempio","appare":"2x"},{"tipo":"uguale","sinistra":"1/Abs(2*a)","vale":"1/(2*a)","ipotesi":{"a":"positive"},"dove":"esempio","appare":"\\dfrac{1}{2a}"},{"tipo":"derivata","espr":"2*pi*m*e","rispetto":["e"],"vale":"2*pi*m","ipotesi":{"m":"positive","e":"positive"},"dove":"qui.meccanica-statistica.esempio","appare":"2\\pi m"}]};

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

/* ---------------- 00 · DI COSA PARLA QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Di cosa parla questo movimento', meta:'Meccanica Quantistica · voci Q.3 e Q.4 · una sola domanda letta nei due versi · la disuguaglianza dedotta e il pacchetto calcolato',
  blocchi:[
  {t:'prosa', title:'Una domanda, e il commutatore come risposta', tag:'architettura', html:R`
  <p>Il movimento precedente ha chiuso la statistica di <i>una</i> misura: dato uno stato e un&rsquo;osservabile, quali esiti sono possibili, con quale probabilità, e che cosa resta dello stato dopo. Tutto quel lavoro riguardava una grandezza per volta. Questo movimento fa la domanda successiva, che è la prima domanda genuinamente quantistica della teoria: <b>date due osservabili, che cosa si può sapere di entrambe nello stesso stato?</b></p>
  <p>La risposta sta in un oggetto solo, e si scrive in una riga: il <span class="str" data-str="commutatore">commutatore</span> $[A,B]=AB-BA$. Se è nullo esiste una base di stati in cui <i>entrambe</i> le osservabili hanno valore certo, e allora si può parlare di una misura congiunta senza dire niente di falso. Se non è nullo quella base non esiste, e al suo posto compare un <i>pavimento</i> sotto il prodotto delle due indeterminazioni — un numero sotto il quale nessuno stato può scendere, qualunque apparato si costruisca.</p>
  <p><b>Perché le due cose stanno in un movimento solo.</b> Il programma di questo corso le elenca in due voci diverse — la Q.3 chiede le relazioni di indeterminazione e la funzione d&rsquo;onda di minimo prodotto, la Q.4 chiede le basi comuni e gli insiemi completi di osservabili che commutano — e quasi tutti i libri le separano di un capitolo. Separarle costa: sono <i>la stessa disuguaglianza</i> letta nei due versi. La relazione di Robertson che si ricava nella tappa 05 dice $\Delta A\,\Delta B\ \ge\ \tfrac12|\langle[A,B]\rangle|$, e il caso delle osservabili compatibili è esattamente quello in cui il secondo membro si annulla: non un argomento diverso, lo stesso argomento con il commutatore messo a zero. Chi le impara separate si ritrova con due regole da ricordare al posto di una da capire.</p>
  <p>E c&rsquo;è un secondo motivo, operativo. Il <b>pavimento nullo non vuol dire pavimento raggiunto</b>: due osservabili che commutano possono avere, in un certo stato, indeterminazioni entrambe grandi — e nella tappa 05 questo è un numero, $\Delta A\,\Delta B=\tfrac{16}{9}$ per due operatori che commutano esattamente. È l&rsquo;errore più comune che si fa su questo argomento, e si ripara solo tenendo i due versi nella stessa pagina.</p>`},
  {t:'prosa', title:'Quattro voci, e due deduzioni diverse della stessa formula', tag:'architettura', html:R`
  <p><b>Heisenberg</b> (1930) non dimostra niente: <i>racconta un esperimento</i>. Nei <i>Principi fisici della teoria dei quanti</i> la relazione nasce due volte, e in due modi che non si somigliano. La prima volta contando lunghezze d&rsquo;onda dentro un pacchetto; la seconda volta guardando dentro un microscopio immaginario in cui un solo quanto di luce, quello che serve per vedere l&rsquo;elettrone, gli cede per effetto Compton un rinculo che non si sa quanto valga. E poi — ed è la parte che si perde nei riassunti — passa quattro pagine a <b>confutare le obiezioni</b>: chi volesse misurare il rinculo del microscopio, chi volesse affinare il massimo della figura di diffrazione. Ogni scappatoia si chiude, e si chiude con un conto.</p>
  <p><b>Dirac</b> (1930) fa l&rsquo;opposto, e il suo contributo a questo movimento non è la disuguaglianza — che lui ricava in mezza pagina da Fourier, dichiarando che vale «<i>solo nel caso più favorevole</i>» — ma il lato della compatibilità. Dirac è il primo a dire che <b>due osservabili che commutano sono una sola osservabile</b> che restituisce due numeri, e il primo a definire l&rsquo;<i>insieme completo di osservabili che commutano</i>. Lo definisce per un motivo che oggi si è smarrito: non per etichettare stati, ma per <b>costruire una rappresentazione</b>. Nella sua mano il CSCO è uno strumento, non una nomenclatura.</p>
  <p><b>Picasso</b> (2015) è la voce che dimostra. Nelle <i>Lezioni</i> la compatibilità ha due definizioni fisiche — stessi autovettori, e la seconda misura non perturba — e il lavoro è provare che sono la stessa cosa e che entrambe equivalgono a $[\xi,\eta]=0$. È la via che questo corso ricalca, e porta la frase che decide lo status dell&rsquo;intera faccenda: «<i>in realtà nella teoria quantistica non è un principio, ma un teorema</i>».</p>
  <p><b>Ballentine</b> (1998) dissente, e dissente su che cosa la formula <i>misuri</i>. Le sue $\Delta Q$ e $\Delta P$ non sono errori di misura, e la verifica sperimentale della disuguaglianza non coinvolge alcuna misura simultanea: si prepara molte volte lo stesso stato, si misura ogni volta <i>una sola</i> delle due grandezze, e si confrontano le larghezze dei due istogrammi. In quella lettura il microscopio di Heisenberg non dimostra la disuguaglianza — dimostra un&rsquo;altra cosa, vera per conto suo. Il disaccordo è dichiarato nella tappa 08 e non viene sciolto, perché le due letture rispondono a due domande diverse.</p>`},
  {t:'prosa', title:'Come è fatto il movimento', tag:'architettura', html:R`
  <p><b>La rotta.</b> La tappa 01 costruisce la nozione fisica di compatibilità prima di sapere che c&rsquo;è un commutatore sotto, seguendo Picasso e Dirac, e definisce il sistema a tre livelli che attraversa tutto il movimento. La 02 dimostra il teorema — compatibili se e solo se commutano — con il lemma isolato, il caso degenere trattato per intero, e le tre osservazioni che valgono quanto il teorema. La 03 arriva agli insiemi completi: la definizione di Dirac, i suoi quattro risultati, e i tre CSCO che si incontrano all&rsquo;esame. La 04 è l&rsquo;algebra: le proprietà dei commutatori, il postulato di quantizzazione per analogia con le parentesi di Poisson, le regole di commutazione canoniche, e il punto in cui l&rsquo;analogia <i>fallisce</i>. La 05 deduce la relazione di indeterminazione, per due strade indipendenti, e la collauda. La 06 la rende più forte, svolgendo il problema 8.10 di Ballentine. La 07 calcola la funzione d&rsquo;onda che la satura, e dimostra che uno stato di minima indeterminazione deve essere puro. La 08 dice che cosa $\Delta$ misura e che cosa non misura, e dichiara il disaccordo. La 09 dà la parola a Heisenberg e a Dirac. La 10 chiude sul tempo — un pacchetto che si allarga, e due misure in sequenza il cui ordine conta — e ricompone il filo.</p>
  <p><b>Che cosa questo movimento non fa.</b> Non costruisce gli operatori posizione e impulso: qui $[q,p]=i\hbar$ arriva da un postulato di quantizzazione che si <i>dichiara</i>, e la sua derivazione dalle simmetrie dello spazio-tempo — che è il cuore di questo corso — è un altro lavoro. Non tratta lo spettro continuo nella sua parte delicata (stati non normalizzabili, autofunzioni della posizione): la gaussiana della tappa 07 è a quadrato sommabile e tutto quello che si fa su di lei è lecito. Non tratta il momento angolare: i commutatori $[L_x,L_y]=i\hbar L_z$ si calcolano nella tappa 04 perché servono come esempio, ma lo spettro che ne segue è un altro movimento. E non tratta l&rsquo;evoluzione temporale, se non nell&rsquo;unico punto in cui serve: la tappa 10 usa $x(t)=x(0)+pt/m$ per la particella libera, che è l&rsquo;equazione di Heisenberg risolta nel caso più semplice di tutti.</p>`}
]},

/* ---------------- 01 · COMPATIBILITA: LA NOZIONE FISICA, PRIMA DEL COMMUTATORE ---------------- */
{ num:'01', title:'Compatibilità: la nozione fisica, prima del commutatore', meta:'le due definizioni di Picasso · la tesi di Dirac · la probabilita congiunta come media di un prodotto di indicatori · il sistema a tre livelli',
  blocchi:[
  {t:'prosa', title:'Il problema, posto senza algebra', tag:'costruzione', html:R`
  <p>Si misura $\xi$ su un sistema nello stato $|A\rangle$ e si trova l&rsquo;esito $\xi'$. Subito dopo si misura $\eta$ e si trova $\eta'$. Ora: <b>si può dire che il sistema ha i valori $\xi'$ e $\eta'$?</b> La domanda sembra oziosa e non lo è, perché la misura di $\eta$ ha cambiato lo stato, e il valore $\xi'$ che si era trovato prima potrebbe non essere più vero.</p>
  <p>Dirac arriva a questo punto nel §13 dei <i>Principi</i> e lo dichiara nel modo più netto possibile, con una frase che vale la pena leggere nella sua forma originale:</p>
  <p style="padding-left:1.2em;border-left:3px solid rgba(120,160,255,.45)"><i>&laquo;In generale non si può fare un&rsquo;osservazione su un sistema che si trovi in uno stato definito senza perturbare tale stato, annullando la possibilità di effettuare su di esso una seconda osservazione. Non si può dare allora alcun significato all&rsquo;esecuzione simultanea di due osservazioni.&raquo;</i> &mdash; Dirac, §13, pag. stampata 71</p>
  <p>«Non si può dare alcun significato» è più forte di «è difficile»: non è un limite sperimentale, è una frase mal formata. E questo è il punto di partenza giusto, perché rende la compatibilità un&rsquo;<b>eccezione da guadagnare</b> e non una proprietà da dare per scontata. In meccanica classica la domanda non esiste: una particella ha posizione e velocità, e misurare l&rsquo;una non tocca l&rsquo;altra. Qui la regola generale è che non si può chiedere, e il lavoro è trovare i casi in cui si può.</p>`},
  {t:'reveal', title:'Le due definizioni di Picasso, e perché sono due e non una', tag:'costruzione', steps:[
   {label:'La prima: stessi autovettori', body:R`
   <p>Picasso, nel §4.10 delle <i>Lezioni</i>, dà la prima definizione in termini di stati a esito certo. Due osservabili $\xi$ ed $\eta$ sono <b>compatibili</b> se hanno un insieme completo di autovettori <i>simultanei</i>: esiste cioè una base dello <span class="str" data-str="spazio-di-hilbert">spazio di Hilbert</span> fatta di stati $|\xi',\eta'\rangle$ ciascuno dei quali dà esito certo $\xi'$ per la prima misura e $\eta'$ per la seconda.</p>
   <p>È la definizione che si usa per <i>calcolare</i>, e si capisce perché: se la base esiste, lo stato generico si sviluppa su di lei e tutta la statistica congiunta si legge nei moduli quadri dei coefficienti, esattamente come nel caso di una sola osservabile. Ma come definizione <i>fisica</i> è insoddisfacente, perché parla di una base e non di un esperimento.</p>`},
   {label:'La seconda: la misura di η non perturba', body:R`
   <p>La seconda definizione è operativa, e Picasso la scrive come un diagramma: si misura $\xi$ e si ottiene $|\xi'\rangle$; si misura $\eta$ e si ottiene $|\xi',\eta'\rangle$; e la richiesta è che <b>se $\xi$ è non degenere allora $|\xi',\eta'\rangle=|\xi'\rangle$</b> — cioè la seconda misura non ha spostato lo stato di un millimetro. In quel caso, e solo in quel caso, l&rsquo;esito $\xi'$ trovato prima è ancora vero dopo.</p>
   <p>Questa è la definizione che risponde alla frase di Dirac. Dice: due osservazioni si possono chiamare simultanee quando la seconda <i>non interferisce</i> con la prima, e allora la coppia di numeri che se ne ricava descrive il sistema e non il percorso di misura.</p>`},
   {label:'L’equivalenza, nel caso non degenere', body:R`
   <p>Picasso prova l&rsquo;equivalenza nei due versi, e nel caso non degenere la prova sta in due righe ciascuna.</p>
   <p><b>Dalla prima alla seconda.</b> Se $\xi$ ed $\eta$ hanno gli stessi autovettori e sono entrambe non degeneri, la misura di $\eta$ è «<i>una ripetizione della prima misura (cambia solo la scala dello strumento) e quindi non perturba lo stato</i>»: lo strumento che misura $\eta$ legge lo stesso vettore con un&rsquo;etichetta diversa.</p>
   <p><b>Dalla seconda alla prima.</b> Se la misura di $\eta$ su $|\xi'\rangle$ restituisce $|\xi',\eta'\rangle$ e $\xi$ è non degenere, allora c&rsquo;è <i>un solo</i> autostato con autovalore $\xi'$, quindi $|\xi',\eta'\rangle$ e $|\xi'\rangle$ sono lo stesso vettore: $|\xi'\rangle$ è anche autovettore di $\eta$. Facendolo per ogni $\xi'$ si ottiene la base comune.</p>`},
   {label:'L’equivalenza nel caso degenere, dove serve il postulato di proiezione', body:R`
   <p>Il caso degenere Picasso lo propone «<i>solo a titolo di esercizio</i>», e vale la pena seguirlo perché è il punto in cui questo movimento si appoggia al precedente.</p>
   <p>Supponiamo che esista l&rsquo;insieme completo di autovettori simultanei e che si misuri $\eta$ sullo stato $|\xi'\rangle$. Lo stato che si ottiene è una combinazione $a|\xi'\eta'\rangle+\sum c|\xi''\eta'\rangle$ con autovalori $\xi''\neq\xi'$ possibili a priori. Ma la probabilità di transizione verso $|\xi'\eta'\rangle$ non è nulla, quindi $a\neq0$; e il <b>postulato di von Neumann</b> impone che lo stato finale sia quello di probabilità di transizione <i>massima</i>, cioè che la <span class="str" data-str="proiettore-ortogonale">proiezione sia ortogonale</span>. Da qui $|a|=1$, tutti i $c$ nulli, e lo stato finale è $|\xi'\eta'\rangle$: la seconda misura non ha portato fuori dall&rsquo;autospazio di $\xi'$.</p>
   <p>Il verso opposto è una dimostrazione per assurdo, ed è elegante. Si considera la varietà lineare chiusa $V$ generata da <i>tutti</i> gli autovettori simultanei e si suppone $V\neq\mathcal H$. Esiste allora un autovettore $|\xi'\rangle$ ortogonale a $V$; ma ogni $|\xi'\eta'\rangle$ sta in $V$, dunque la probabilità di transizione $P(|\xi'\rangle\to|\xi'\eta'\rangle)$ è nulla — e questo contraddice l&rsquo;ipotesi che la misura di $\eta$ su $|\xi'\rangle$ dia un vettore con autovalore $\xi'$. Quindi $V=\mathcal H$ e la base esiste.</p>
   <p>Si noti che cosa è stato usato: non un&rsquo;identità algebrica, ma il <i>postulato sulla misura</i>. La compatibilità, in questa costruzione, è una proprietà del processo di misura prima di essere una proprietà degli operatori — ed è la tappa 02 a trasformarla in algebra.</p>`}
  ]},
  {t:'reveal', title:'La tesi di Dirac: due osservabili che commutano sono una sola', tag:'costruzione', steps:[
   {label:'La probabilità congiunta, costruita invece che postulata', body:R`
   <p>Dirac arriva alla compatibilità da una direzione che nessun manuale moderno ripercorre: costruendo la probabilità congiunta a partire dal valor medio. Dato un insieme di osservabili $\xi,\eta,\zeta,\dots$ che commutano fra loro, scrive la funzione che vale $1$ quando $\xi=a$, $\eta=b$, $\zeta=c$ e zero se una qualunque di queste condizioni cade. Nella sua notazione è un prodotto di indicatori,</p>
   $$\delta_{\xi a}\,\delta_{\eta b}\,\delta_{\zeta c},$$
   <p>e il suo <b>valor medio in un qualunque stato è la probabilità congiunta</b> $P_{abc}$. Non c&rsquo;è un postulato nuovo: c&rsquo;è il postulato sul valor medio — lo stesso da cui il movimento precedente ha ricavato tutta la statistica di una misura — applicato a una funzione furba.</p>
   <p>E qui compare la ragione tecnica per cui tutto questo funziona <i>solo</i> per osservabili che commutano, e Dirac la mette in una parentetica: quel prodotto è «<i>indipendente dall&rsquo;ordine dei fattori</i>». Se gli operatori non commutassero, scrivere $\delta_{\xi a}\delta_{\eta b}$ o $\delta_{\eta b}\delta_{\xi a}$ darebbe due oggetti diversi, e quindi due probabilità diverse per la stessa domanda — che è il modo in cui una domanda mal posta si manifesta nel formalismo. La probabilità congiunta <b>non è difficile da calcolare per osservabili incompatibili: non è definita</b>.</p>`},
   {label:'La tesi, e la frase che la giustifica', body:R`
   <p>Subito dopo aver costruito $P_{abc}$, Dirac ne trae una conclusione che chiama «<i>un nuovo e importante sviluppo</i>» e che è il contributo di questa pagina:</p>
   <p style="padding-left:1.2em;border-left:3px solid rgba(120,160,255,.45)"><i>&laquo;Dal punto di vista della teoria generale, due o più osservabili che commutino fra loro possono essere considerate come un&rsquo;unica osservabile, la cui misura dia come risultato due o più numeri. Gli stati per cui tali misure portano sicuramente a un particolare risultato sono gli autostati simultanei.&raquo;</i> &mdash; Dirac, §13, pag. stampata 71</p>
   <p>È una tesi, non una definizione, e cambia il modo di guardare l&rsquo;oggetto. Un CSCO non è una lista di grandezze da misurare una dopo l&rsquo;altra: è <b>un unico strumento</b> che restituisce una $n$-upla, e l&rsquo;insieme dei suoi esiti possibili è l&rsquo;insieme delle $n$-uple di autovalori. Letta così, la frase di apertura di questa tappa — che due osservazioni simultanee sono prive di significato — non viene smentita ma aggirata: non ci sono due osservazioni, c&rsquo;è una sola osservazione con due quadranti.</p>
   <p>Questa lettura ha una conseguenza che tornerà nella tappa 03: se un CSCO è <i>uno</i> strumento, allora l&rsquo;esito di quello strumento identifica lo stato, e il formalismo è completo nel senso che non resta libertà residua. È per questo che Dirac definisce l&rsquo;insieme completo per costruire una rappresentazione.</p>`}
  ]},
  {t:'reveal', title:'Il sistema che attraversa il movimento, e la sua base comune', tag:'esempio', steps:[
   {label:'Due osservabili su tre livelli', body:R`
   <p>Serve un esempio concreto che si possa rifare a mano in trenta secondi e che abbia <i>tutti</i> i tratti del caso generale: una degenerazione, una base comune non ovvia, e uno stato su cui calcolare. Prendiamo uno spazio a tre dimensioni con base $|1\rangle,|2\rangle,|3\rangle$ e due osservabili</p>
   $$A=\begin{pmatrix}1&0&0\\0&1&0\\0&0&3\end{pmatrix},\qquad B=\begin{pmatrix}0&1&0\\1&0&0\\0&0&5\end{pmatrix}.$$
   <p>$A$ è già diagonale e ha spettro $\{1,1,3\}$: l&rsquo;autovalore $1$ è <b>doppiamente degenerate</b>, con autospazio $\mathcal H_1=\mathrm{span}\{|1\rangle,|2\rangle\}$, e l&rsquo;autovalore $3$ è semplice. $B$ non è diagonale: dentro $\mathcal H_1$ agisce come la prima <span class="str" data-str="matrici-di-pauli">matrice di Pauli</span> $\sigma_x$, e su $|3\rangle$ agisce come il numero $5$.</p>
   <p>Che commutino si verifica in due prodotti. $AB$ si ottiene moltiplicando la riga $i$ di $B$ per l&rsquo;autovalore $i$-esimo di $A$; $BA$ si ottiene moltiplicando la colonna $j$ di $B$ per l&rsquo;autovalore $j$-esimo. Nelle prime due righe e colonne l&rsquo;autovalore è lo stesso ($1$), quindi i due prodotti coincidono; nella terza riga e colonna gli unici elementi non nulli di $B$ stanno sulla diagonale, e un elemento diagonale non distingue riga da colonna. Dunque $AB=BA$, cioè $[A,B]=0$.</p>`},
   {label:'La base comune, e l’osservazione che ci si trova dentro', body:R`
   <p>Per trovare la base comune non c&rsquo;è niente da fare fuori da $\mathcal H_1$: su $|3\rangle$ entrambe le osservabili sono già certe, con valori $3$ e $5$. Dentro $\mathcal H_1$ bisogna diagonalizzare $\sigma_x$, il cui polinomio caratteristico è</p>
   $$(0-\lambda)(0-\lambda)-1\cdot1=\lambda^{2}-1,$$
   <p>con radici $\lambda=\pm1$ e autovettori $(|1\rangle\pm|2\rangle)/\sqrt2$, normalizzati perché $\Big(\frac{1}{\sqrt2}\Big)^{2}+\Big(\frac{1}{\sqrt2}\Big)^{2}=1$. La base comune è quindi</p>
   $$|1,+1\rangle=\frac{|1\rangle+|2\rangle}{\sqrt2},\qquad |1,-1\rangle=\frac{|1\rangle-|2\rangle}{\sqrt2},\qquad |3,5\rangle=|3\rangle,$$
   <p>dove l&rsquo;etichetta è la coppia di autovalori $(a,b)$, cioè l&rsquo;indice collettivo che Sakurai-Napolitano scrive $|K'\rangle$.</p>
   <p><b>E ora l&rsquo;osservazione che l&rsquo;esempio esiste per fare.</b> Il vettore $|1\rangle$ è un autovettore di $A$ — con autovalore $1$ — e <i>non</i> è autovettore di $B$: infatti $B|1\rangle=|2\rangle$, che non è multiplo di $|1\rangle$. Quindi: <b>due osservabili che commutano non hanno necessariamente gli stessi autovettori.</b> Hanno una base comune, che è un&rsquo;affermazione di esistenza — e in un autospazio degenere quella base va <i>scelta</i>, perché la maggior parte delle direzioni non va bene. È la prima delle tre osservazioni che Picasso mette in coda al teorema, e qui si vede in una matrice $3\times3$ invece che a parole.</p>`},
   {label:'Uno stato, e la sua distribuzione congiunta', body:R`
   <p>Prendiamo lo stato</p>
   $$|\Psi\rangle=\frac{|1\rangle+|2\rangle+|3\rangle}{\sqrt3}$$
   <p>e calcoliamone tutto. I due valori medi si leggono direttamente in base canonica, perché entrambe le matrici agiscono in modo semplice:</p>
   $$\langle A\rangle=\frac{1+1+3}{3}=\frac53,\qquad \langle B\rangle=\frac{1+1+5}{3}=\frac73,$$
   <p>dove per $B$ si è usato $B|\Psi\rangle=(|2\rangle+|1\rangle+5|3\rangle)/\sqrt3$ e poi il prodotto scalare con $|\Psi\rangle$, che somma $1+1+5$.</p>
   <p>La <b>distribuzione congiunta</b> si legge invece nella base comune. Le tre ampiezze sono i prodotti scalari di $|\Psi\rangle$ con i tre vettori di base:</p>
   $$\langle 1,+1|\Psi\rangle=\frac{1}{\sqrt2}\cdot\frac{1+1}{\sqrt3}=\frac{2}{\sqrt6},\qquad \langle 1,-1|\Psi\rangle=\frac{1}{\sqrt2}\cdot\frac{1-1}{\sqrt3}=0,\qquad \langle 3,5|\Psi\rangle=\frac{1}{\sqrt3},$$
   <p>e quindi</p>
   $$P(1,+1)=\Big(\frac{2}{\sqrt6}\Big)^{2}=\frac23,\qquad P(1,-1)=0,\qquad P(3,5)=\frac13,$$
   <p>con il controllo di normalizzazione $\frac23+0+\frac13=1$.</p>
   <p><b>Il collaudo che conta</b> è che questa unica distribuzione riproduca <i>entrambe</i> le statistiche marginali, perché è esattamente la tesi di Dirac — uno strumento, due quadranti:</p>
   $$1\cdot\tfrac23+1\cdot0+3\cdot\tfrac13=\tfrac53,\qquad 1\cdot\tfrac23+(-1)\cdot0+5\cdot\tfrac13=\tfrac73.$$
   <p>I due numeri sono $\langle A\rangle$ e $\langle B\rangle$ di prima: i due valori medi calcolati in base canonica, uno per volta, e quelli calcolati dalla distribuzione congiunta coincidono. Per osservabili che non commutano non esiste alcuna distribuzione congiunta che faccia questo — e non perché sia difficile trovarla, ma perché non c&rsquo;è una base rispetto a cui scriverla.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Nello stato $|\Psi\rangle$ la probabilità $P(1,-1)$ è zero. Vuol dire che l&rsquo;esito $(1,-1)$ è impossibile per questa coppia di osservabili?`,
    a:R`No: vuol dire che è impossibile <i>in questo stato</i>. L&rsquo;esito $(1,-1)$ è una $n$-upla legittima dello spettro congiunto, e c&rsquo;è uno stato in cui ha probabilità uno — il vettore $|1,-1\rangle=(|1\rangle-|2\rangle)/\sqrt2$. Che qui sia zero dipende da una coincidenza di segni: $|\Psi\rangle$ ha componenti uguali su $|1\rangle$ e $|2\rangle$, e l&rsquo;ampiezza verso $|1,-1\rangle$ contiene la <i>differenza</i> di quelle componenti. La distinzione fra «non è nello spettro» e «ha ampiezza nulla in questo stato» è la stessa distinzione fra una proprietà dell&rsquo;osservabile e una proprietà dello stato, e sbagliarla è il modo più rapido di prendere zero a un esercizio di probabilità.`},
   {q:R`Se la probabilità congiunta per osservabili incompatibili non è definita, che cosa si calcola quando si fanno due misure in sequenza di $S_z$ e poi $S_x$? Quel numero esiste.`,
    a:R`Esiste, ed è un&rsquo;altra cosa: è la probabilità <b>condizionata</b> moltiplicata per quella del primo esito, cioè la probabilità di una <i>storia</i> di misura e non di una proprietà del sistema. Shankar lo scrive con due avvertenze esplicite (pag. stampata 133): primo, $P(\omega,\lambda)\neq P(\lambda,\omega)$ in generale — e quindi il numero dipende dall&rsquo;ordine, che è ciò che una probabilità congiunta non può fare; secondo, e più importante, $P(\omega,\lambda)$ «<i>non è la probabilità di produrre uno stato finale che abbia valori ben definiti $\omega$ e $\lambda$</i>», perché «<i>un tale stato non esiste per definizione di incompatibilità</i>». Lo stato prodotto dalle due misure è semplicemente l&rsquo;autostato della seconda osservabile. Il conto si fa; la frase che lo accompagna va scelta con cura.`},
   {q:R`La dimostrazione dell&rsquo;equivalenza nel caso degenere usa il postulato di proiezione. È un difetto?`,
    a:R`È una dipendenza, e va dichiarata invece che nascosta. La definizione «la seconda misura non perturba» parla di che cosa <i>succede</i> allo stato, quindi non può essere confrontata con la prima senza una regola che dica che cosa succede allo stato — e quella regola è il postulato di proiezione. Nel caso non degenere la dipendenza è innocua, perché l&rsquo;autostato è unico e non c&rsquo;è niente da scegliere; nel caso degenere serve sapere <i>dove</i> dentro l&rsquo;autospazio finisce il vettore, e la risposta «nella proiezione ortogonale, cioè nel punto di minima perturbazione» è esattamente ciò che il postulato di von Neumann afferma. Il teorema della tappa 02 non ha questa dipendenza: è puramente algebrico, e vale anche per chi del postulato di proiezione non vuole sapere nulla.`}
  ]}
]},

/* ---------------- 02 · IL TEOREMA: COMPATIBILI SE E SOLO SE COMMUTANO ---------------- */
{ num:'02', title:'Il teorema: compatibili se e solo se commutano', meta:'il lemma isolato · il caso non degenere in due righe · il caso degenere: autospazi invarianti · tre osservazioni che valgono quanto il teorema',
  blocchi:[
  {t:'prosa', title:'Da proprietà del processo a proprietà degli operatori', tag:'architettura', html:R`
  <p>La tappa 01 ha definito la compatibilità guardando che cosa <i>succede</i> in laboratorio: una base comune, oppure una seconda misura che non sposta lo stato. Questa tappa traduce quella definizione in una condizione sugli <span class="str" data-str="operatore-aggiunto">operatori</span> che si può verificare senza misurare niente — basta moltiplicare due matrici nei due ordini. Il teorema è:</p>
  <p style="padding-left:1.2em;border-left:3px solid rgba(120,160,255,.45)">$\xi$ ed $\eta$ sono compatibili $\iff$ $[\xi,\eta]=0$.</p>
  <p>È il risultato più usato di tutto il corso dopo lo spettro, e vale la pena vederlo dimostrato per intero — con il passo dove la dimostrazione <i>deve</i> complicarsi, perché è lì che si capisce perché i libri lo saltano.</p>`},
  {t:'reveal', title:'Il lemma isolato: che cosa succede a un autovettore quando il commutatore è nullo', tag:'costruzione', steps:[
   {label:'L’enunciato del lemma', body:R`
   <p>Picasso isola un passo tecnico prima del teorema, e lo isola apposta perché è l&rsquo;unico punto in cui serve davvero l&rsquo;algebra degli operatori:</p>
   <p style="padding-left:1.2em;border-left:3px solid rgba(120,160,255,.45)"><b>Lemma.</b> Se $[\xi,\eta]=0$ e $|\xi'\rangle$ è autovettore di $\xi$ con autovalore $\xi'$, allora $\eta|\xi'\rangle$ è <i>ancora</i> autovettore di $\xi$, con lo <i>stesso</i> autovalore $\xi'$.</p>
   <p>La dimostrazione è tre righe: $\xi(\eta|\xi'\rangle)=\eta\xi|\xi'\rangle=\eta\,\xi'|\xi'\rangle=\xi'(\eta|\xi'\rangle)$, dove il primo passo usa $[\xi,\eta]=0$ per scambiare l&rsquo;ordine e il secondo usa che $|\xi'\rangle$ è autovettore. Il punto da fissare è che cosa il lemma <i>non</i> dice: non dice che $\eta|\xi'\rangle$ sia proporzionale a $|\xi'\rangle$ — dice solo che resta dentro l&rsquo;<b>autospazio</b> di $\xi'$. Se quell&rsquo;autospazio ha dimensione uno le due cose coincidono; se ha dimensione maggiore di uno, no. È esattamente questa biforcazione a separare il caso facile dal caso che richiede lavoro.</p>`},
   {label:'Il caso non degenere, dove il lemma basta da solo', body:R`
   <p>Se $\xi'$ è non degenere, l&rsquo;autospazio è la retta generata da $|\xi'\rangle$ e il lemma dice che $\eta|\xi'\rangle$ ci sta dentro: dunque $\eta|\xi'\rangle=\eta'|\xi'\rangle$ per qualche numero $\eta'$. Ma questo è precisamente l&rsquo;affermazione che $|\xi'\rangle$ è <i>anche</i> autovettore di $\eta$. Ripetendo per ogni autovalore non degenere di $\xi$ si ottiene la base comune, senza mai dover scegliere niente: la base era già fissata da $\xi$, e $\eta$ si limita a rispettarla.</p>`},
   {label:'Il caso degenere, dove serve costruire e non solo verificare', body:R`
   <p>Se $\xi'$ è degenere, con autospazio $\mathcal H_{\xi'}$ di dimensione $d>1$, il lemma dice che $\eta$ manda $\mathcal H_{\xi'}$ <b>in se stesso</b> — è un autospazio <i>invariante</i> per $\eta$ — ma non dice quale base di $\mathcal H_{\xi'}$ diagonalizzi $\eta$. Qui il teorema richiede un passo in più: la restrizione di $\eta$ a $\mathcal H_{\xi'}$ è ancora un operatore autoaggiunto (perché $\eta$ lo è su tutto $\mathcal H$ e $\mathcal H_{\xi'}$ è invariante), quindi per il teorema spettrale della tappa 03 ha una base ortonormale di autovettori <i>dentro</i> $\mathcal H_{\xi'}$. Diagonalizzando $\eta$ separatamente in ciascun autospazio di $\xi$ — e ce ne possono essere molti, uno per ogni autovalore distinto — si ottiene la base comune sull&rsquo;intero $\mathcal H$.</p>
   <p>Il verso opposto — se esiste la base comune allora $[\xi,\eta]=0$ — è immediato una volta scritti i due operatori nella base: entrambi sono diagonali, e due matrici diagonali commutano sempre, in qualunque dimensione.</p>`}
  ]},
  {t:'reveal', title:'Il caso degenere sul sistema a tre livelli, verificato in due modi', tag:'esempio', steps:[
   {label:'Il lemma applicato per esteso: lo spettro di $A$ ricalcolato, non letto', body:R`
   <p>Il teorema va applicato, non solo enunciato, e il primo passo è onesto: verificare lo <span class="str" data-str="spettro">spettro</span> di $A=\mathrm{diag}(1,1,3)$ <i>senza</i> usare il fatto che la matrice è già diagonale, cioè espandendo il suo polinomio caratteristico come se non si sapesse nulla:</p>
   $$\det(A-\lambda\mathbb 1)=(1-\lambda)^{2}(3-\lambda)=3-7\lambda+5\lambda^{2}-\lambda^{3},$$
   <p>che si annulla per $\lambda=1$ (doppia) e $\lambda=3$ — lo spettro dichiarato in tappa 01, ora ottenuto dal polinomio e non dalla semplice lettura della diagonale. Per il lemma, l&rsquo;autospazio $\mathcal H_1=\mathrm{span}\{|1\rangle,|2\rangle\}$ di $\lambda=1$ è invariante per qualunque operatore che commuti con $A$, e la restrizione di $B$ a $\mathcal H_1$ — il blocco $\sigma_x$ già scritto in tappa 01 — ha polinomio caratteristico</p>
   $$(0-\lambda)(0-\lambda)-1\cdot1=\lambda^{2}-1,$$
   <p>radici $\pm1$: è esattamente il passo che il teorema prescrive nel caso degenere, diagonalizzare la restrizione <i>dentro</i> l&rsquo;autospazio invariante, non supporre a priori quale base vada bene.</p>`},
   {label:'Un secondo partner per $A$, costruito da $\\sigma_y$: stesso autospazio, base diversa', body:R`
   <p>Per vedere che la base trovata non è l&rsquo;unica <i>a priori possibile</i> — solo l&rsquo;unica comune a $B$ — serve un secondo operatore autoaggiunto che viva anche lui dentro $\mathcal H_1$ (e quindi commuti automaticamente con $A$, per lo stesso argomento banale per cui ogni operatore confinato in un autospazio di $A$ lo commuta) ma che <b>non</b> sia un multiplo di $B$. Prendiamo, con $\sigma_y=\begin{pmatrix}0&-i\\i&0\end{pmatrix}$,</p>
   $$G=\mathbb 1-2\,\sigma_y=\begin{pmatrix}1&2i\\-2i&1\end{pmatrix}\quad\text{su }\mathcal H_1,$$
   <p>costruito dalla <span class="str" data-str="matrici-di-pauli">matrice di Pauli</span> $\sigma_y$ invece che da $\sigma_x$. Il suo polinomio caratteristico è</p>
   $$(1-\lambda)^{2}-(2i)(-2i)=(1-\lambda)^{2}-4=(\lambda-3)(\lambda+1),$$
   <p>spettro $\{3,-1\}$ — diverso da quello di $B$ ($\{\pm1\}$ su $\mathcal H_1$, $5$ su $|3\rangle$), ma $G$ è perfettamente autoaggiunto e compatibile con $A$ allo stesso modo di $B$: entrambi sono costanti sugli autospazi di $A$ fuori da $\mathcal H_1$ e diagonalizzabili dentro.</p>`},
   {label:'Gli autovettori di $G$, e perché non sono quelli di $B$', body:R`
   <p>Per $\lambda=-1$: $(G+\mathbb 1)=\begin{pmatrix}2&2i\\-2i&2\end{pmatrix}$. La riga 1 dà $2v_1+2iv_2=0\Rightarrow v_1=-iv_2$. La riga 2 deve dare lo stesso vincolo: $-2iv_1+2v_2=-2i(-iv_2)+2v_2$, e il prodotto che decide il segno è</p>
   $$-2i\cdot(-i)=-2,$$
   <p>quindi $-2iv_1+2v_2=-2v_2+2v_2=0$ ✓. L&rsquo;autovettore è $|{-}1\rangle_G=(-i,1)/\sqrt2$ (a meno di fase, normalizzato come in tappa 01 con $|{-}i|^2+|1|^2=2$).</p>
   <p>Per $\lambda=3$: $(G-3\mathbb 1)=\begin{pmatrix}-2&2i\\-2i&-2\end{pmatrix}$. La riga 1 dà $-2v_1+2iv_2=0\Rightarrow v_1=iv_2$. La riga 2: $-2iv_1-2v_2=-2i(iv_2)-2v_2$, e qui il prodotto è</p>
   $$-2i\cdot(+i)=+2,$$
   <p>quindi $-2iv_1-2v_2=2v_2-2v_2=0$ ✓. L&rsquo;autovettore è $|3\rangle_G=(i,1)/\sqrt2$.</p>
   <p>Nessuno dei due, $(-i,1)/\sqrt2$ o $(i,1)/\sqrt2$, è proporzionale agli autovettori di $B$ trovati in tappa 01, $(|1\rangle\pm|2\rangle)/\sqrt2$. $G$ e $B$ commutano entrambi con $A$ — sono entrambi «compatibili con $A$» nel senso del teorema — eppure selezionano due basi <i>diverse</i> di $\mathcal H_1$. Compatibilità con $A$ non basta a fissare quale base; serve l&rsquo;operatore <i>specifico</i> con cui si misura davvero, e questa è la ragione fisica per cui il teorema parla sempre di una coppia di osservabili, non di una proprietà di una sola.</p>`},
   {label:'La direzione non degenere, scritta in componenti alla Sakurai', body:R`
   <p>Picasso dimostra il verso «stessi autovettori $\Rightarrow$ commutano» a parole; Sakurai-Napolitano lo scrive in componenti, ed è la forma più comoda per un calcolo esplicito. Se $A|a'\rangle=a'|a'\rangle$ per ogni autovalore non degenere e $[A,B]=0$, allora</p>
   $$\langle a''|[A,B]|a'\rangle=(a''-a')\langle a''|B|a'\rangle=0.$$
   <p>Il membro sinistro è zero perché il commutatore è nullo per ipotesi; il membro di destra viene da far agire $A$ a sinistra su $\langle a''|$ e a destra su $|a'\rangle$. Se $a''\neq a'$ (autovalori non degeneri e distinti), l&rsquo;unica possibilità è $\langle a''|B|a'\rangle=0$: cioè $B$ non collega autospazi diversi di $A$, e dentro ciascuno dei due agisce come un numero — $B$ è diagonale nella stessa base che diagonalizza $A$. È lo stesso contenuto della dimostrazione di Picasso, letto come algebra di matrici invece che come proprietà degli stati.</p>`},
   {label:'Il caso $\\ell=0$: il sottospazio dove osservabili incompatibili coincidono comunque', body:R`
   <p>Sakurai-Napolitano osserva un fatto che il teorema da solo non prevede, e che vale la pena mettere a fianco: $L_x$ e $L_z$ non commutano in generale — $[L_x,L_z]=-i\hbar L_y$ — eppure sul sottospazio $\ell=0$, dove $L^2=0$ e quindi ogni componente del momento angolare è zero, si ha</p>
   $$L_x|\ell=0\rangle=L_z|\ell=0\rangle=0,$$
   <p>e lo stato $|\ell=0\rangle$ è autostato simultaneo di <i>entrambi</i>, con autovalore zero per ciascuno. Non è un&rsquo;eccezione al teorema: il teorema parla di basi comuni su <i>tutto</i> $\mathcal H$, e qui si ha un singolo vettore comune a due operatori incompatibili, non un&rsquo;intera base. È il contenuto della terza osservazione di Picasso — $[\xi,\eta]\neq0$ non vieta che <i>qualche</i> autovettore sia comune — letta su un caso fisico reale invece che come possibilità abstratta.</p>`}
  ]},
  {t:'prosa', title:'Tre osservazioni che valgono quanto il teorema', tag:'architettura', html:R`
  <p>Picasso le mette in coda alla dimostrazione, e sono tre trappole, non tre corollari decorativi.</p>
  <p><b>Prima.</b> Due osservabili che commutano <i>non hanno necessariamente gli stessi autovettori</i> — ne hanno in comune <i>una base</i>, che in presenza di degenerazione è una fra tante possibili per il solo $\xi$. La tappa 01 lo ha già visto in un caso concreto: $|1\rangle$ è autovettore di $A$ e non di $B$, pur commutando $A$ con $B$.</p>
  <p><b>Seconda.</b> L&rsquo;identità commuta con qualunque operatore, quindi è compatibile con tutto — ma questo non aggiunge nessuna informazione fisica: dire che una grandezza è compatibile con l&rsquo;identità è vuoto, perché l&rsquo;identità non misura niente.</p>
  <p><b>Terza</b>, già vista sopra sul sottospazio $\ell=0$: $[\xi,\eta]\neq0$ non impedisce che esista <i>qualche</i> autovettore comune — impedisce che ne esista una <i>base intera</i>. Confondere le due cose è l&rsquo;errore più comune in un esame orale su questo teorema.</p>`}
]},

/* ---------------- 03 · INSIEMI COMPLETI DI OSSERVABILI CHE COMMUTANO ---------------- */
{ num:'03', title:'Insiemi completi di osservabili che commutano (CSCO)', meta:'la definizione di Dirac, costruita per fare una rappresentazione · i suoi quattro risultati · i tre CSCO dell’esame',
  blocchi:[
  {t:'prosa', title:'Il problema che il CSCO risolve: quando una sola osservabile non basta', tag:'architettura', html:R`
  <p>La tappa 02 ha mostrato che l&rsquo;autospazio $\mathcal H_1$ di $A$ ha dimensione due, e che dentro c&rsquo;è spazio per infiniti operatori diversi ($B$, $G$, chiunque altro) ciascuno con la propria base. Il problema fisico sottostante è questo: <b>una sola osservabile, quando è degenere, non etichetta completamente lo stato</b>. Serve aggiungerne altre, che commutino con la prima e fra loro, finché la degenerazione residua non sparisce. Un <b>insieme completo di osservabili che commutano</b> (CSCO) è esattamente il risultato di questo processo: la definizione di Picasso lo dice in una riga — un insieme di osservabili compatibili la cui $n$-upla di autovalori è <b>globalmente non degenere</b>, cioè individua un unico stato a meno di fase.</p>
  <p>L&rsquo;esempio più istruttivo è il più fisico di tutti: l&rsquo;atomo isolato. Gli stati stazionari con energia fissata $E_n$ non sono uno solo — sono degeneri, e la degenerazione <i>si conta</i>. Il numero di stati con <span class="str" data-str="armoniche-sferiche">momento angolare orbitale</span> $\ell$ fissato è $2\ell+1$ (le proiezioni $m=-\ell,\dots,\ell$), e sommando su tutti gli $\ell$ permessi a un dato livello $n$,</p>
  $$\sum_{\ell=0}^{n-1}(2\ell+1)=n^{2}.$$
  <p>Per $n=3$ questo dà $1+3+5=3^{2}=9$: nove stati degeneri alla stessa energia, e $H$ da sola ne distingue uno solo — il numero $E_3$. Serve dell&rsquo;altro, e il resto di questa tappa è dire cosa.</p>`},
  {t:'reveal', title:'La costruzione di Dirac, e i suoi quattro risultati', tag:'costruzione', steps:[
   {label:'Non una lista di etichette: uno strumento per fare la rappresentazione', body:R`
   <p>La tappa 01 ha già mostrato la tesi di Dirac — un CSCO è un&rsquo;unica osservabile a più quadranti. Il §14 dei <i>Principi</i> ne fa un uso tecnico preciso: costruire una <b>rappresentazione</b>, cioè una base dello spazio di Hilbert etichettata da numeri invece che da vettori abstract. Dirac procede per passi, e ciascuno è un risultato separato che vale la pena isolare.</p>`},
   {label:'Primo risultato: un CSCO produce una base ortogonale', body:R`
   <p>Se $\xi,\eta,\zeta,\dots$ formano un CSCO, i loro autobra simultanei $\langle\xi'\eta'\zeta'\dots|$ sono ortogonali a due a due — perché differiscono nell&rsquo;autovalore di <i>almeno</i> un&rsquo;osservabile, e autovettori di un operatore autoaggiunto con autovalori diversi sono ortogonali — e sono <i>non degeneri</i> per definizione: la $n$-upla basta a distinguerli tutti. È la base pronta all&rsquo;uso, la stessa che ha etichettato $|1,+1\rangle,|1,-1\rangle,|3,5\rangle$ nella tappa 01.</p>`},
   {label:'Secondo risultato, il converso: ogni rappresentazione ortogonale viene da un CSCO', body:R`
   <p>Dirac fa anche il passo opposto, che è quello meno citato: data una qualunque base ortogonale «fondamentale» dello spazio (nel senso tecnico che usa per costruire rappresentazioni), esiste <i>sempre</i> un insieme di osservabili che commutano di cui quella base è l&rsquo;insieme degli autobra simultanei. Non è un fatto ovvio: dice che scegliere una rappresentazione e scegliere un CSCO sono <i>la stessa scelta</i>, vista da due lati.</p>`},
   {label:'Terzo risultato: un insieme che commuta si completa sempre', body:R`
   <p>Se $\xi,\eta$ commutano ma la coppia $(\xi',\eta')$ non basta a distinguere ogni stato — cioè l&rsquo;insieme non è ancora globalmente non degenere — si può sempre trovare un&rsquo;altra osservabile $\zeta$ che commuti con entrambe e che tolga la degenerazione residua, aggiungendola all&rsquo;insieme. Il processo termina, perché la dimensione dello spazio (o il numero di numeri quantici indipendenti, nel caso continuo) è finito ad ogni passo: non si può completare all&rsquo;infinito.</p>`},
   {label:'Quarto risultato, il criterio operativo di Picasso: la non degenerazione globale', body:R`
   <p>Il terzo risultato dice che il completamento esiste; non dice <i>quando fermarsi</i>. Il criterio è quello con cui questa tappa è iniziata: l&rsquo;insieme è completo quando la $n$-upla di autovalori $(\xi',\eta',\zeta',\dots)$ individua uno stato unico a meno di fase — non più, non meno. È il test che si applica in pratica: dato un insieme di osservabili compatibili, si conta quanti stati distinti condividono la stessa $n$-upla di autovalori, e se sono di più di uno l&rsquo;insieme non è ancora completo.</p>`}
  ]},
  {t:'reveal', title:'I tre CSCO che si incontrano all’esame', tag:'esempio', steps:[
   {label:'L’atomo isolato: energia, momento angolare, proiezione, parità', body:R`
   <p>Tornando all&rsquo;esempio di apertura: i nove stati degeneri a $n=3$ si separano aggiungendo $L^{2}$ (che fissa $\ell$, e con esso la dimensione $2\ell+1$ del sottospazio residuo) e $L_z$ (che fissa $m$ dentro quel sottospazio). Per un atomo isolato — simmetria sferica, nessun campo esterno — queste tre osservabili insieme a $H$ non bastano ancora del tutto: resta la parità sotto inversione spaziale, che Picasso include come quarta etichetta. Lo stato si scrive</p>
   $$|E,L,M,w\rangle,$$
   <p>con $w$ l&rsquo;autovalore di parità. Questo è il CSCO «di struttura»: quattro osservabili, quattro numeri quantici, nessuna degenerazione residua per un atomo senza altre simmetrie rotte.</p>`},
   {label:'Il potenziale centrale: perché $H,L^2,L_z$ bastano quando $V=V(r)$', body:R`
   <p>Il caso più comune all&rsquo;esame è più semplice: un singolo corpo in un potenziale centrale $V=V(r)$, senza bisogno della parità come etichetta indipendente perché la simmetria sferica da sola fissa la struttura angolare. Qui il CSCO è $\{H,L^2,L_z\}$, e il fatto che commutino a vicenda non è un&rsquo;ipotesi aggiunta: è una conseguenza diretta della forma del potenziale,</p>
   $$[H,L^{2}]=[H,L_z]=0\quad\text{se }V=V(r).$$
   <p>La ragione fisica è che $L^2$ e $L_z$ generano rotazioni, e un potenziale che dipende solo da $r=|\vec r|$ è invariante per rotazioni — quindi commuta con i loro generatori. È lo stesso principio di simmetria che la tappa 07 di questo corso promette come cuore del programma, visto qui in anticipo su un caso particolare invece che nella sua forma generale.</p>`},
   {label:'Orbitale più spin: quando si aggiunge $s_z$', body:R`
   <p>Il terzo caso è quello in cui $\{H,L^2,L_z\}$ smette di bastare: appena si introduce lo spin dell&rsquo;elettrone, ogni livello orbitale raddoppia — due stati di spin per ogni $(n,\ell,m)$ — e $\{H,L^2,L_z\}$ torna a essere degenere, questa volta per un fattore due invece che per un fattore $2\ell+1$. Il completamento prescritto dal terzo risultato di Dirac è immediato: si aggiunge $S_z$, l&rsquo;operatore di proiezione dello spin, che commuta con tutti e tre perché agisce su un fattore diverso dello spazio di Hilbert (orbitale $\otimes$ spin) e non si mescola con nessuno di loro. Il CSCO diventa $\{H,L^2,L_z,S_z\}$, e questo è il punto in cui il formalismo prepara — senza ancora dimostrarlo — il terreno per l&rsquo;accoppiamento spin-orbita di un corso successivo.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Perché l’atomo isolato ha bisogno della parità in più rispetto al caso del potenziale centrale generico?`,
