    a:R`Perché «isolato» significa anche invariante per inversione spaziale $\vec r\to-\vec r$, una simmetria che il generico $V(r)$ possiede comunque (dipende solo dal modulo), ma che Picasso tiene come etichetta <i>indipendente</i> perché $w=\pm1$ non si deduce da $(E,L,M)$ — due stati con la stessa energia e lo stesso momento angolare possono avere parità opposta se il potenziale lo permette. Nel caso coulombiano puro la parità è in realtà fissata da $\ell$ (vale $(-1)^\ell$), quindi è ridondante; Picasso la mantiene nella lista perché per un potenziale centrale generico non coulombiano quella relazione non vale più, ed è un esempio di quanto sia delicato stabilire quando un insieme è davvero completo e quando contiene un&rsquo;etichetta superflua.`},
   {q:R`Il quarto risultato dice di contare gli stati con la stessa n-upla di autovalori. In pratica, come si accorge qualcuno che un insieme NON è ancora completo?`,
    a:R`Trovando uno stato degenere che l&rsquo;insieme non distingue — esattamente il conto fatto in apertura, $1+3+5=3^{2}=9$: se l&rsquo;unico numero quantico disponibile fosse $E_3$, ci sarebbero nove stati con quella stessa etichetta, non uno, e nessuna misura ulteriore di $H$ li separerebbe. Il segnale pratico è la degenerazione residua stessa: se dopo aver fissato tutti gli autovalori dell&rsquo;insieme proposto esistono ancora due stati ortogonali con la stessa $n$-upla, l&rsquo;insieme non è completo e serve un&rsquo;osservabile in più.`}
  ]}
]},

/* ---------------- 04 · L’ALGEBRA DEI COMMUTATORI, E DOVE L’ANALOGIA CLASSICA FALLISCE ---------------- */
{ num:'04', title:'L’algebra dei commutatori, e dove l’analogia classica fallisce', meta:'le proprieta di base e Jacobi · il postulato di quantizzazione dalle parentesi di Poisson · le CCR · [q²,p²]: l’ordine dei fattori conta',
  blocchi:[
  {t:'prosa', title:'Il commutatore come oggetto algebrico, non solo come test di compatibilità', tag:'architettura', html:R`
  <p>Le tappe 02 e 03 hanno usato il commutatore come un <i>test</i>: zero o non zero, compatibile o no. Questa tappa lo tratta come un <b>oggetto che si calcola</b>, con proprietà algebriche che valgono per qualunque tripla di operatori, prima ancora di sapere chi sono $A$, $B$, $C$:</p>
  $$[A,A]=0,\quad[A,B]=-[B,A],\quad[A,B+C]=[A,B]+[A,C],$$
  $$[A,BC]=[A,B]C+B[A,C],\quad[AB,C]=A[B,C]+[A,C]B,\quad[A,[B,C]]+[B,[C,A]]+[C,[A,B]]=0.$$
  <p>Le prime tre sono immediate dalla definizione $[A,B]=AB-BA$. Le due regole di Leibniz (quarta e quinta) sono quelle che fanno davvero il lavoro di calcolo — permettono di scomporre il commutatore di un prodotto senza mai disfare l&rsquo;ordine degli operatori che già si conosce — e l&rsquo;ultima, l&rsquo;<b>identità di Jacobi</b>, è la regola che sostituisce l&rsquo;associatività quando non si può semplicemente riordinare. Sono esattamente le due regole di Leibniz, applicate due volte ciascuna, a fare tutto il lavoro di questa tappa.</p>`},
  {t:'reveal', title:'Il postulato di quantizzazione: dalle parentesi di Poisson al commutatore', tag:'costruzione', steps:[
   {label:'L’analogia che Dirac propone', body:R`
   <p>In meccanica classica, due grandezze $f,g$ sullo spazio delle fasi hanno una parentesi di Poisson $\{f,g\}_{\mathrm{PB}}=\partial_q f\,\partial_p g-\partial_p f\,\partial_q g$, e $\{q,p\}_{\mathrm{PB}}=1$. Il postulato di quantizzazione, nella forma che Dirac propone per analogia, è</p>
   $$[\hat f,\hat g]=i\hbar\,\widehat{\{f,g\}_{\mathrm{PB}}},$$
   <p>applicato alla coppia fondamentale dà le <b>regole di commutazione canoniche</b> (CCR): $[q,p]=i\hbar$, e per tre dimensioni $[x_i,p_j]=i\hbar\,\delta_{ij}$, $[x_i,x_j]=0$, $[p_i,p_j]=0$. Non è una deduzione: è un <i>postulato</i>, giustificato dal fatto che riproduce correttamente la meccanica classica nel limite $\hbar\to0$ — e dal fatto, verificato qui sotto, che per funzioni <i>semplici</i> dà la risposta attesa.</p>`},
   {label:'Il caso in cui funziona: $[x^n,p]$', body:R`
   <p>Applicando due volte la regola di Leibniz $[A,BC]=[A,B]C+B[A,C]$ a $[x,x^{n-1}p]$ e iterando, si ottiene la formula generale $[x^n,p]=i\hbar\,n\,x^{n-1}$ — che è esattamente $i\hbar$ volte la parentesi di Poisson classica $\{x^n,p\}_{\mathrm{PB}}=n x^{n-1}=\tfrac{d}{dx}x^{n}$, calcolata qui per $n=4$:</p>
   $$\frac{d}{dx}x^{4}=4x^{3},$$
   <p>e applicata al caso $n=3$ dà il commutatore esplicito</p>
   $$[x^{3},p]=i\hbar\,\frac{d(x^{3})}{dx}=3i\hbar x^{2}.$$
   <p>Per qualunque potenza di una sola variabile, l&rsquo;analogia classica-quantistica funziona senza sorprese: il commutatore è $i\hbar$ volte la <span class="str" data-str="derivazione">derivata</span>, punto.</p>`}
  ]},
  {t:'reveal', title:'Il caso in cui l’analogia fallisce: $[q^2,p^2]$', tag:'esempio', steps:[
   {label:'La parentesi di Poisson classica, calcolata come derivata', body:R`
   <p>Classicamente, $\{q^2,p^2\}_{\mathrm{PB}}=\partial_q(q^2)\,\partial_p(p^2)-\partial_p(q^2)\,\partial_q(p^2)$. Il secondo termine è zero ($q^2$ non dipende da $p$), e il primo è</p>
   $$[q^{2},p^{2}]_{\mathrm{PB}}=\frac{\partial q^{2}}{\partial q}\frac{\partial p^{2}}{\partial p}-\frac{\partial q^{2}}{\partial p}\frac{\partial p^{2}}{\partial q}=4qp.$$
   <p>Se il postulato di quantizzazione funzionasse <i>sempre</i> alla lettera, ci aspetteremmo $[\hat q^2,\hat p^2]=i\hbar\cdot4qp=4i\hbar qp$ e nient&rsquo;altro.</p>`},
   {label:'Il calcolo quantistico vero, passo per passo', body:R`
   <p>Si calcola con la regola di Leibniz, senza scorciatoie. Prima il pezzo più piccolo, $[q,p^2]$: usando $[A,BC]=A[B,C]+[A,B]C$ con $A=q,B=C=p$,</p>
   $$p[q,p]+[q,p]p=p(i\hbar)+(i\hbar)p=2i\hbar p.$$
   <p>Poi si scala: $[q^2,p^2]=q[q,p^2]+[q,p^2]q=q(2i\hbar p)+(2i\hbar p)q=2i\hbar(qp+pq)$. Ora, dalla CCR, $pq=qp-i\hbar$, quindi $qp+pq=2qp-i\hbar$, e</p>
   $$2i\hbar\,(2qp-i\hbar)=4i\hbar\,qp+2\hbar^{2}.$$`},
   {label:'Il verdetto: un termine che la parentesi di Poisson non prevede', body:R`
   <p>Il risultato vero è $[q^2,p^2]=4i\hbar qp+2\hbar^2$, non $4i\hbar qp$. C&rsquo;è un termine <b>extra, di ordine $\hbar^2$</b>, che la parentesi di Poisson classica — un oggetto che non sa nulla di $\hbar$ — non può in nessun modo prevedere: nasce esclusivamente dal fatto che $q$ e $p$ non commutano, cioè dalla stessa CCR che il postulato usa per <i>costruire</i> il commutatore al primo ordine. L&rsquo;analogia classica-quantistica è quindi <b>affidabile al primo ordine in $\hbar$ e cieca agli ordini successivi</b>: funziona esattamente per $[x^n,p]$ (dove non c&rsquo;è nessun ordine superiore a trattare, perché $p$ compare una volta sola), e smette di bastare appena l&rsquo;osservabile coinvolge $p$ più di una volta insieme a $q$ più di una volta. È la stessa cautela che il §4.12 di Picasso mette per iscritto, e che nessun libro di meccanica classica potrebbe mai insegnare da solo.</p>`}
  ]},
  {t:'reveal', title:'Il commutatore del momento angolare, costruito dalla stessa algebra', tag:'esempio', steps:[
   {label:'$[L_x,L_y]$, espanso senza scorciatoie', body:R`
   <p>Con $L_x=yp_z-zp_y$ e $L_y=zp_x-xp_z$, il commutatore si espande in quattro pezzi usando $[AB,CD]=A[B,CD]+[A,CD]B$ applicata due volte a ciascuno. Due dei quattro si annullano identicamente — ogni volta che compaiono due coordinate diverse che commutano insieme a due componenti dell&rsquo;impulso che commutano — e i due che sopravvivono sono</p>
   $$-i\hbar\,yp_x+i\hbar\,xp_y=i\hbar\,(xp_y-yp_x)=i\hbar L_z,$$
   <p>dove il primo pezzo viene da $[yp_z,zp_x]$ (tramite $[p_z,z]=-i\hbar$) e il secondo da $[zp_y,xp_z]$ (tramite $[z,p_z]=i\hbar$). Il risultato $[L_x,L_y]=i\hbar L_z$ — e le sue permutazioni cicliche — sono le relazioni che generano tutta l&rsquo;algebra del momento angolare, ed è notevole che derivino dalla stessa manciata di regole di Leibniz usate sopra per $[q^2,p^2]$: non c&rsquo;è bisogno di un postulato nuovo.</p>`},
   {label:'Una conseguenza che si vede in un numero: la scala di uno stato $\\ell=1$', body:R`
   <p>Gli operatori di innalzamento e abbassamento $L_\pm=L_x\pm iL_y$ non commutano con $L_z$ — $[L_z,L_\pm]=\pm\hbar L_\pm$, dalla stessa algebra — e questo è il motivo per cui, anche se $\{L^2,L_z\}$ è un CSCO (tappa 03), gli stati con lo stesso $\ell$ e $m$ diverso restano collegati da un operatore ben definito. Per $\ell=1$, $m=0$, l&rsquo;elemento di matrice che porta a $m=1$ ha modulo</p>
   $$\sqrt{\ell(\ell+1)-m(m+1)}=\sqrt{2},$$
   <p>e questo stesso numero $\sqrt2$ — non casualmente — è il coefficiente di normalizzazione già incontrato nella tappa 01 per l&rsquo;autovettore $(|1\rangle+|2\rangle)/\sqrt2$: la stessa aritmetica delle radici di due compare ogni volta che una base ortonormale deve ripartire la probabilità su due componenti uguali.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Se l’analogia classica-quantistica fallisse SEMPRE per prodotti di più di una potenza di $q$ e $p$ insieme, la meccanica quantistica sarebbe inutilizzabile. Perché non è un problema praticamente?`,
    a:R`Perché il termine extra è sempre di ordine $\hbar^2$ (o più alto) rispetto al termine classico, che è di ordine $\hbar^1$: nel limite in cui le azioni in gioco sono enormi rispetto a $\hbar$ — il limite classico — il termine extra è trascurabile rispetto a quello previsto da Poisson, ed è per questo che la meccanica classica resta una buona approssimazione nel suo dominio. Il punto della tappa non è che l&rsquo;analogia sia inutile, è che va usata per costruire il COMMUTATORE ESATTO con Leibniz — non per leggere il risultato finale direttamente dalla parentesi di Poisson, che è cieca a questi termini.`},
   {q:R`Il commutatore $[L_x,L_y]=i\hbar L_z$ si poteva ottenere anche sostituendo $q\to x,\,p\to p_x$ eccetera nella parentesi di Poisson classica $\{L_x,L_y\}_{\mathrm{PB}}=L_z$ e moltiplicando per $i\hbar$. Perché qui l’analogia funziona, mentre per $q^2,p^2$ no?`,
    a:R`Perché $L_x$ e $L_y$, scritti in termini di posizioni e impulsi, sono <i>lineari</i> in ciascuna coppia canonica coinvolta — ogni termine ha al più un fattore di una data componente di posizione e un fattore della componente di impulso coniugata — e l&rsquo;espansione con Leibniz applicata a prodotti lineari non genera mai il termine extra di ordine $\hbar^2$ che compare invece per $q^2p^2$, dove la stessa coppia canonica $(q,p)$ appare due volte. La regola pratica, utile all&rsquo;esame: l&rsquo;analogia classica-quantistica è esatta per qualunque funzione che sia al più bilineare e separata nelle coppie canoniche, e richiede il calcolo con Leibniz non appena una singola coppia compare con potenza maggiore di uno su entrambi i lati.`}
  ]}
]},

/* ---------------- 05 · LA RELAZIONE DI INDETERMINAZIONE, DEDOTTA E COLLAUDATA ---------------- */
{ num:'05', title:'La relazione di indeterminazione, dedotta e collaudata', meta:'il lemma di Schwarz · il discriminante che non può essere positivo · la forma di Robertson · la verifica numerica sul sistema a tre livelli',
  blocchi:[
  {t:'prosa', title:'Dove il pavimento sotto il prodotto viene da', tag:'architettura', html:R`
  <p>La tappa 02 ha mostrato che un commutatore nullo garantisce una base comune. Questa tappa risponde alla domanda complementare: quando il commutatore <i>non</i> è nullo, quanto possono essere piccole insieme le due indeterminazioni $\Delta A,\Delta B$? La risposta non è «dipende dallo stato» in modo arbitrario: c&rsquo;è un numero, fissato dal commutatore, sotto il quale il prodotto $\Delta A\,\Delta B$ non può scendere in <i>nessuno</i> stato. La dimostrazione che segue — quella di Picasso, §4.11 — si fa per intero, perché è corta e perché il programma la chiede esplicitamente (Q.3).</p>`},
  {t:'reveal', title:'Il lemma di positività, e la sua forma degenere', tag:'costruzione', steps:[
   {label:'Un fatto generale su qualunque operatore', body:R`
   <p>Per <i>qualunque</i> operatore $a$ (non necessariamente Hermitiano) e qualunque stato $|s\rangle$, la <span class="str" data-str="disuguaglianza-di-schwarz">disuguaglianza di Schwarz</span> applicata a $|s\rangle$ e $a|s\rangle$ dà</p>
   $$\langle s|a^{\dagger}a|s\rangle\ \ge\ \langle s|a^{\dagger}|s\rangle\langle s|a|s\rangle.$$
   <p>È la (4.45) di Picasso, e dice semplicemente che la «larghezza» di $a$ non può essere più piccola del quadrato del suo valor medio — lo stesso fatto, generalizzato a un operatore qualunque, che per un&rsquo;osservabile Hermitiana dà $\Delta A^2\ge0$.</p>`},
   {label:'Specializzare ad $a=\\xi+i\\omega\\eta$', body:R`
   <p>Siano $\xi=A-\langle A\rangle$, $\eta=B-\langle B\rangle$ gli operatori di deviazione (a media nulla per costruzione: $\langle\xi\rangle=\langle\eta\rangle=0$), e sia $\omega$ un numero reale arbitrario. Per $a=\xi+i\omega\eta$ si ha $\langle a\rangle=\langle\xi\rangle+i\omega\langle\eta\rangle=0$, quindi il lemma degenera nella forma più semplice $\langle a^\dagger a\rangle\ge0$. Espandendo $a^\dagger a=(\xi-i\omega\eta)(\xi+i\omega\eta)=\xi^2+\omega^2\eta^2+i\omega(\xi\eta-\eta\xi)=\xi^2+\omega^2\eta^2+i\omega[\xi,\eta]$, e usando $[\xi,\eta]=[A,B]$ (il commutatore non vede gli spostamenti costanti),</p>
   $$\langle a^{\dagger}a\rangle=\Delta A^{2}+\omega^{2}\Delta B^{2}+i\omega\langle[A,B]\rangle\ \ge\ 0\qquad\forall\,\omega\in\mathbb R.$$`}
  ]},
  {t:'reveal', title:'Il discriminante, e perché non può essere positivo', tag:'costruzione', steps:[
   {label:'Rendere reale il termine misto', body:R`
   <p>$\langle[A,B]\rangle$ è immaginario puro, perché $[A,B]^\dagger=-[A,B]$ per $A,B$ Hermitiani: scriviamo allora $\langle[A,B]\rangle=ic$ con $c$ <i>reale</i>. Moltiplicando per un secondo fattore $i$ si ottiene una quantità reale e positiva:</p>
   $$\big(i\,(ic)\big)^{2}=c^{2},$$
   <p>cioè $i\langle[A,B]\rangle=-c$ è reale, come deve essere perché l&rsquo;intera espressione $\langle a^\dagger a\rangle$ sia reale. Con questa sostituzione, $i\omega\langle[A,B]\rangle=i\omega(ic)=-\omega c$, e la disuguaglianza diventa una forma quadratica <i>reale</i> in $\omega$:</p>
   $$\Delta A^{2}-\omega c+\omega^{2}\Delta B^{2}\ge0\qquad\forall\,\omega.$$`},
   {label:'Un polinomio di secondo grado sempre non negativo ha discriminante non positivo', body:R`
   <p>Scrivendo la forma come $a+\omega c'+\omega^2 b$ (con $a=\Delta A^2$, $b=\Delta B^2$, $c'=-c$, e riassorbendo il segno nella definizione di $c$ senza perdita di generalità — è la stessa $c$ della (4.45), a meno della convenzione di segno che l&rsquo;enunciato finale non vede, perché compare solo al quadrato), la condizione che sia $\ge0$ per ogni $\omega$ reale è esattamente che il discriminante non sia positivo:</p>
   $$c^{2}-4(\Delta\xi)^{2}(\Delta\eta)^{2}\le0.$$
   <p>È il punto in cui l&rsquo;algebra smette di essere un dettaglio: un trinomio di secondo grado con coefficiente direttivo positivo ($\Delta B^2>0$, a meno del caso degenere) è sempre $\ge0$ se e solo se non ha due radici reali distinte — altrimenti sarebbe negativo fra le due radici. Nessuna proprietà fisica è stata usata in questo passo: è pura algebra applicata a un fatto fisico (la positività di una norma).</p>`},
   {label:'La stessa soglia, trovata minimizzando', body:R`
   <p>In alternativa al discriminante, si può minimizzare direttamente $a+\omega c+\omega^2 b$ rispetto a $\omega$: il minimo è a $\omega=-c/(2b)$, e vale</p>
   $$\Delta A^{2}+\omega\langle C\rangle+\omega^{2}\Delta B^{2}\Big|_{\omega=-\frac{\langle C\rangle}{2\Delta B^{2}}}=\Delta A^{2}-\frac{\langle C\rangle^{2}}{4\Delta B^{2}},$$
   <p>e la richiesta che anche il minimo sia $\ge0$ dà $\Delta A^2\ge\langle C\rangle^2/4\Delta B^2$, cioè $\Delta A^2\Delta B^2\ge\langle C\rangle^2/4$, con $\langle C\rangle\equiv i\langle[A,B]\rangle$ (reale). Scritta con il commutatore originale,</p>
   $$\tfrac14\big|\langle[A,B]\rangle\big|^{2}=\tfrac14\langle C\rangle^{2},$$
   <p>e quindi la <b>relazione di indeterminazione di Robertson</b>:</p>
   $$\Delta A\,\Delta B\ \ge\ \tfrac12\big|\langle[A,B]\rangle\big|.$$
   <p>Le due strade — discriminante e minimizzazione — sono la stessa algebra vista da due angoli, e arrivano allo stesso numero: è il collaudo interno più semplice che questa deduzione potesse avere.</p>`}
  ]},
  {t:'plot', title:'Il discriminante che non può essere positivo, disegnato',
   intro:R`La condizione $\langle a^\dagger a\rangle\ge0\ \forall\omega$ è una parabola in $\omega$ che non scende mai sotto zero. Il disegno mostra tre casi con $\Delta A^2=1,\Delta B^2=1$ e $c$ crescente: a $c=0$ (osservabili compatibili) la parabola è ben sopra l&rsquo;asse; a $c=2$ il minimo tocca esattamente zero — è il caso saturato, quello della tappa 07; a $c=3$ la parabola scenderebbe sotto zero, ed è per questo che $c=3$ non può essere il valore di $i\langle[A,B]\rangle$ per QUESTI $\Delta A,\Delta B$: la disuguaglianza di Robertson lo vieta.`,
   plots:[
    {kind:'func2d', xr:[-3,3], yr:[-1,6], height:330, ticks:6,
     title:'f(ω) = ΔA² + ω²ΔB² − ωc, per c = 0, 2, 3 (ΔA²=ΔB²=1)',
     curves:[
      {f:'1+x^2-0*x', col:'#5ac8a0', width:2.2, label:'c=0 (compatibili)'},
      {f:'1+x^2-2*x', col:'#4c8dff', width:2.8, label:'c=2 (saturato)'},
      {f:'1+x^2-3*x', col:'#ff5a5a', width:2.2, label:'c=3 (impossibile)'}
     ],
     xlabel:'ω', ylabel:'f(ω)'}
   ],
   leggi:R`<p><b>Che cosa guardare.</b> La curva blu ($c=2$) tocca l&rsquo;asse $\omega$ in un punto solo e non lo attraversa mai: è la firma geometrica del discriminante nullo, $c^2-4\Delta A^2\Delta B^2=0$. La curva rossa ($c=3$) attraverserebbe l&rsquo;asse due volte — avrebbe cioè valori negativi di $\langle a^\dagger a\rangle$ per qualche $\omega$ reale, il che è impossibile per la norma quadra di un vettore. <b>Che cosa impararne.</b> La disuguaglianza di Robertson non è un limite imposto dall&rsquo;esterno: è la condizione, puramente geometrica, che una parabola con questi coefficienti non possa avere radici reali distinte. Il valore $c=2$ è esattamente il confine fra il permesso e l&rsquo;impossibile, ed è lì che vive ogni stato di minima indeterminazione.</p>`},
  {t:'reveal', title:'La seconda verifica: sul sistema a tre livelli, un numero vero', tag:'esempio', steps:[
   {label:'$\\Delta A$ sullo stato $|\\Psi\\rangle$', body:R`
   <p>La deduzione appena fatta è generale; ora si collauda su un caso dove si può controllare tutto a mano — lo stesso $|\Psi\rangle=(|1\rangle+|2\rangle+|3\rangle)/\sqrt3$ e $A=\mathrm{diag}(1,1,3)$ della tappa 01, con $\langle A\rangle=5/3$ già calcolato. Serve $\langle A^2\rangle$: $A^2=\mathrm{diag}(1,1,9)$, quindi $\langle A^2\rangle=(1+1+9)/3=11/3$, e</p>
   $$\frac{11}{3}-\Big(\frac53\Big)^{2}=\frac89,\qquad \Delta A=\sqrt{\tfrac89}=\frac{2\sqrt2}{3}.$$`},
   {label:'$\\Delta B$ sullo stesso stato', body:R`
   <p>Per $B$ (il blocco $\sigma_x$ su $\mathcal H_1$ più $5$ su $|3\rangle$), $B^2=\mathrm{diag}(1,1,25)$ — perché $\sigma_x^2=\mathbb 1$ — quindi $\langle B^2\rangle=(1+1+25)/3=9$, e con $\langle B\rangle=7/3$ già calcolato,</p>
   $$9-\Big(\frac73\Big)^{2}=\frac{32}{9},\qquad \Delta B=\sqrt{\tfrac{32}{9}}=\frac{4\sqrt2}{3}.$$`},
   {label:'Il prodotto, e il confronto con il pavimento', body:R`
   <p>Il prodotto delle due indeterminazioni è</p>
   $$\Delta A\,\Delta B=\frac{2\sqrt2}{3}\cdot\frac{4\sqrt2}{3}=\frac{16}{9}.$$
   <p>Ma $A$ e $B$ <b>commutano</b> ($[A,B]=0$, tappa 01): il pavimento di Robertson per questa coppia è $\tfrac12|\langle[A,B]\rangle|=0$, e $16/9\ge0$ è vero ma vuoto — è esattamente l&rsquo;osservazione fatta in apertura di questa tappa 05: <b>un pavimento nullo non vuol dire pavimento raggiunto</b>. Due osservabili compatibili possono avere indeterminazioni grandi quanto si vuole nello stesso stato; la disuguaglianza di Robertson non promette nulla in quel caso, perché il suo membro destro è zero. Il collaudo interessante arriva alla tappa 06, dove una coppia che <i>non</i> commuta rende il pavimento stesso un numero positivo da raggiungere o no.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Il lemma di Schwarz richiede $\langle a\rangle=0$ per degenerare nella forma semplice $\langle a^\dagger a\rangle\ge0$. Se si fosse scelto $a=\xi+i\omega\eta$ SENZA sottrarre le medie — cioè con $\xi=A,\eta=B$ direttamente — cosa sarebbe cambiato?`,
    a:R`La disuguaglianza finale sarebbe rimasta vera ma più debole: usando $A,B$ al posto delle deviazioni, il termine $\langle a^\dagger a\rangle\ge\langle a^\dagger\rangle\langle a\rangle$ non si riduce più a $\langle a^\dagger a\rangle\ge0$, e bisognerebbe portare attraverso tutto il calcolo un termine $|\langle A\rangle+i\omega\langle B\rangle|^2$ che alla fine si cancella esattamente contro la stessa quantità che appare nel completare il quadrato — il risultato è identico, perché la relazione di Robertson riguarda le <i>indeterminazioni</i> $\Delta A,\Delta B$, non i valori medi. Usare le deviazioni fin dall&rsquo;inizio è una scelta di eleganza, non di necessità: elimina un passaggio algebrico che altrimenti si cancellerebbe comunque.`},
   {q:R`Il prodotto $\Delta A\,\Delta B=16/9$ sul sistema a tre livelli non viola la relazione di Robertson pur essendo molto più grande di zero. Che senso ha allora chiamarla una relazione di INDETERMINAZIONE se in questo caso non determina niente?`,
    a:R`Ha il senso di un vincolo a una sola direzione: la relazione dice che il prodotto non può scendere sotto una soglia, non che debba restarci vicino. Quando la soglia è zero (osservabili compatibili) il vincolo è automaticamente soddisfatto da qualunque stato, incluso uno con indeterminazioni enormi — ed è corretto che sia così, perché per osservabili compatibili esistono stati (gli autostati comuni) in cui ENTRAMBE le indeterminazioni sono esattamente zero, e nessuna legge fisica impedisce di prepararne altri in cui non lo sono. La relazione diventa informativa esattamente quando il commutatore non è nullo, perché lì la soglia stessa diventa positiva e nessuno stato può evitarla — è il caso della tappa 06 e seguenti.`}
  ]}
]},

/* ---------------- 06 · LA FORMA PIÙ FORTE: SCHRÖDINGER CONTRO ROBERTSON ---------------- */
{ num:'06', title:'La forma più forte: Schrödinger contro Robertson', meta:'il problema 8.10 di Ballentine · il parametro complesso · il termine di covarianza · lo spin-1/2 che satura la forma forte e azzera la debole',
  blocchi:[
  {t:'prosa', title:'Un parametro reale non è il più generale possibile', tag:'architettura', html:R`
  <p>La tappa 05 ha usato $a=\xi+i\omega\eta$ con $\omega$ <i>reale</i>. È una scelta — non l&rsquo;unica. Il problema 8.10 di Ballentine chiede di ripetere la deduzione con $a=\xi+\lambda\eta$ e $\lambda=u+iv$ <b>complesso</b>, cioè con due parametri reali liberi invece di uno solo. Il risultato è una disuguaglianza <i>più forte</i> — contiene quella di Robertson come caso particolare, mai il contrario — e il motivo è semplice da anticipare: minimizzare su un insieme più grande di parametri non può mai dare un vincolo più debole.</p>`},
  {t:'reveal', title:'La deduzione con il parametro complesso', tag:'costruzione', steps:[
   {label:'Il termine in più: l’anticommutatore', body:R`
   <p>Espandendo $a^\dagger a=(\xi+\bar\lambda\eta)(\xi+\lambda\eta)$ con $\lambda=u+iv$, la parte immaginaria di $\lambda$ riproduce il commutatore già visto in tappa 05, ma la parte <i>reale</i> $u$ moltiplica adesso $\xi\eta+\eta\xi$ — l&rsquo;<b>anticommutatore</b>, che con il commutatore della tappa 05 non ha niente in comune: è un operatore <i>simmetrico</i>, non uno antisimmetrico. Definendo $S\equiv\tfrac12\langle\{\xi,\eta\}\rangle$ (la covarianza di $A$ e $B$, a meno del fattore 2) e $C\equiv i\langle[\xi,\eta]\rangle$ come in tappa 05, la positività $\langle a^\dagger a\rangle\ge0$ diventa una forma quadratica in <i>due</i> variabili reali:</p>
   $$\Delta A^{2}+(u^{2}+v^{2})\Delta B^{2}+uC-2Sv\ \ge\ 0\qquad\forall\,u,v\in\mathbb R.$$`},
   {label:'Minimizzare su due variabili invece di una', body:R`
   <p>La forma si separa: il termine $(u^2+v^2)\Delta B^2+uC-2Sv$ è la somma di due parabole indipendenti, una in $u$ e una in $v$, e si minimizzano separatamente. In $u$: $u^2\Delta B^2+uC$ è minimo a $u=-C/(2\Delta B^2)$. In $v$: $v^2\Delta B^2-2Sv$ è minimo a $v=S/\Delta B^2$. Sostituendo entrambi,</p>
   $$\Delta A^{2}+(u^{2}+v^{2})\Delta B^{2}+u\langle C\rangle-2Sv\Big|_{\min}=\Delta A^{2}-\frac{\langle C\rangle^{2}}{4\Delta B^{2}}-\frac{S^{2}}{\Delta B^{2}},$$
   <p>e la condizione che il minimo resti $\ge0$ dà $\Delta A^2\Delta B^2\ge C^2/4+S^2$, cioè la <b>relazione di Schrödinger</b>:</p>
   $$\Delta A^{2}\Delta B^{2}\ \ge\ \tfrac14\big|\langle[A,B]\rangle\big|^{2}+S^{2},\qquad S=\tfrac12\langle\{A-\langle A\rangle,B-\langle B\rangle\}\rangle.$$
   <p>Il termine $S^2$ è sempre $\ge0$: la forma di Schrödinger non può mai essere più debole di quella di Robertson, e lo è strettamente ogni volta che $A,B$ sono correlati ($S\neq0$).</p>`}
  ]},
  {t:'reveal', title:'Un caso in cui la forma debole è vuota e la forma forte no', tag:'esempio', steps:[
   {label:'Uno spin-1/2 nel piano equatoriale', body:R`
   <p>Sia $|\psi(\varphi)\rangle=\tfrac1{\sqrt2}(|\!\uparrow\rangle+e^{i\varphi}|\!\downarrow\rangle)$, l&rsquo;autostato di spin lungo la direzione a angolo azimutale $\varphi$ nel piano $xy$. I valori medi delle matrici di Pauli sono $\langle\sigma_x\rangle=\cos\varphi$, $\langle\sigma_y\rangle=\sin\varphi$, $\langle\sigma_z\rangle=0$, e poiché $\sigma_x^2=\sigma_y^2=\mathbb 1$ si ha $\Delta\sigma_x^2=1-\cos^2\varphi=\sin^2\varphi$ e $\Delta\sigma_y^2=1-\sin^2\varphi=\cos^2\varphi$.</p>
   <p>Il commutatore è $[\sigma_x,\sigma_y]=2i\sigma_z$, quindi $\langle[\sigma_x,\sigma_y]\rangle=2i\langle\sigma_z\rangle=0$: la forma di <b>Robertson è vuota</b>, qualunque sia $\varphi$. La domanda è se la realtà fisica — due osservabili che per $\varphi\neq0,\pi/2$ sono tutt&rsquo;altro che certe insieme — sia davvero descritta da un vincolo nullo.</p>`},
   {label:'L’anticommutatore delle deviazioni, e il termine $S$', body:R`
   <p>Le matrici di Pauli anticommutano esattamente, $\{\sigma_x,\sigma_y\}=0$; ma l&rsquo;anticommutatore delle <i>deviazioni</i> $\sigma_x^0=\sigma_x-\langle\sigma_x\rangle$, $\sigma_y^0=\sigma_y-\langle\sigma_y\rangle$ non eredita questo zero, perché i termini misti con i valori medi non si cancellano:</p>
   $$\langle\{\sigma_x^{0},\sigma_y^{0}\}\rangle=-2\sin\varphi\cos\varphi=-\sin2\varphi,$$
   <p>da cui $S=-\tfrac12\sin2\varphi$ e $S^2=\tfrac14\sin^22\varphi$. Il prodotto delle indeterminazioni è</p>
   $$\Delta\sigma_x^{2}\,\Delta\sigma_y^{2}=\sin^{2}\varphi\cos^{2}\varphi=\tfrac14\sin^{2}2\varphi,$$
   <p>cioè <b>esattamente uguale a $S^2$</b>, per <i>ogni</i> $\varphi$: la relazione di Schrödinger è satura con il segno di uguale, mentre quella di Robertson — con il suo membro destro identicamente nullo — non diceva nulla su quanto piccolo potesse essere il prodotto.</p>`},
   {label:'Un numero per fissare le idee: $\\varphi=\\pi/4$', body:R`
   <p>A $\varphi=\pi/4$,</p>
   $$\sin^{2}\tfrac\pi4\cos^{2}\tfrac\pi4=\tfrac14,$$
   <p>e si può controllare a mano: $\sin(\pi/4)=\cos(\pi/4)=1/\sqrt2$, quindi $\Delta\sigma_x^2=\Delta\sigma_y^2=1/2$ e il prodotto è $1/4$ — lo stesso numero, ottenuto per la strada lunga (l&rsquo;identità trigonometrica $\sin^2\varphi\cos^2\varphi=\tfrac14\sin^22\varphi$ valutata a $\varphi=\pi/4$, dove $\sin(\pi/2)=1$) e per la strada corta (il calcolo diretto). Questo stato non è affatto uno stato «di minima indeterminazione» nel senso della tappa 07 — è uno stato di spin, non una gaussiana — ma soddisfa comunque Schrödinger con il segno di uguale: è un secondo tipo di saturazione, specifico di sistemi a due livelli, che vale la pena distinguere da quello della tappa 07 proprio perché le due famiglie di stati saturanti non si sovrappongono.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Perché la relazione di Robertson è vuota per $\sigma_x,\sigma_y$ su QUALUNQUE stato con $\langle\sigma_z\rangle=0$, e non solo su quello scelto qui?`,
    a:R`Perché $[\sigma_x,\sigma_y]=2i\sigma_z$ è un&rsquo;identità operatoriale, vera indipendentemente dallo stato: il suo valore medio è $2i\langle\sigma_z\rangle$, che si annulla esattamente quando $\langle\sigma_z\rangle=0$, cioè per <i>tutti</i> gli stati nel piano equatoriale della sfera di Bloch, non solo per la famiglia a un parametro scelta qui. È un fatto che riguarda la geometria dello stato (dove sta sulla sfera di Bloch) e non la scelta particolare della fase $\varphi$, ed è esattamente per questo che la forma di Schrödinger — che invece dipende da $\varphi$ attraverso $S$ — porta un&rsquo;informazione che Robertson, su questa fetta di stati, non può portare per costruzione.`},
   {q:R`Il termine $S^2$ è sempre $\ge0$. Significa che la forma di Schrödinger è SEMPRE strettamente più informativa di Robertson?`,
    a:R`Quasi sempre, ma non all&rsquo;estremo: quando $S=0$ (nessuna covarianza fra le deviazioni di $A$ e $B$) le due forme coincidono esattamente, e il caso degenere più semplice è proprio uno con $A,B$ compatibili e in più scorrelate — ad esempio gli autostati comuni della tappa 02. Il guadagno di Schrödinger non è garantito ad essere grande: è garantito a non essere mai negativo, e nell&rsquo;esempio di questa tappa è massimale, perché l&rsquo;intero contenuto fisico della disuguaglianza passa da Robertson (zero) a Schrödinger (il quadrato della covarianza).`}
  ]}
]},

/* ---------------- 07 · IL PACCHETTO DI MINIMA INDETERMINAZIONE ---------------- */
{ num:'07', title:'Il pacchetto di minima indeterminazione', meta:'la condizione T†|ψ⟩=0 · l’equazione differenziale e la gaussiana · gli integrali in rappresentazione p · perché deve essere puro: Stoler e Newman',
  blocchi:[
  {t:'prosa', title:'Saturare la disuguaglianza: non basta dire «esiste», bisogna calcolare chi è', tag:'architettura', html:R`
  <p>La tappa 05 ha dedotto $\Delta x\,\Delta p\ge\hbar/2$ dalla positività di $\langle a^\dagger a\rangle$ con $a=\xi+i\omega\eta$. La disuguaglianza diventa un&rsquo;<b>uguaglianza</b> esattamente quando $\langle a^\dagger a\rangle=0$ al valore ottimale di $\omega$ — e per un operatore, avere norma quadra nulla vuol dire essere <i>lo stato nullo</i>: $a|\psi\rangle=0$, cioè $T|\psi\rangle=0$ con $T=\xi+i\omega_0\eta$ e $\omega_0=-\langle[\xi,\eta]\rangle/(2i\Delta\eta^2)$ il valore che minimizza. Questa tappa risolve quell&rsquo;equazione per $\xi=x-\langle x\rangle$, $\eta=p-\langle p\rangle$, trova la funzione d&rsquo;onda esplicita, e poi fa un passo che quasi nessun corso introduttivo fa: chiede se quella funzione d&rsquo;onda possa descrivere uno stato <i>misto</i> invece che puro.</p>`},
  {t:'reveal', title:'L’equazione differenziale, e la sua unica soluzione', tag:'costruzione', steps:[
   {label:'Da $T|\\psi\\rangle=0$ a un’equazione sulla funzione d’onda', body:R`
   <p>In rappresentazione di posizione, $p\to-i\hbar\,d/dx$, e scrivendo $T=(x-\langle x\rangle)+i\omega_0(p-\langle p\rangle)$ con $\langle x\rangle=\langle p\rangle=0$ per semplicità (uno spostamento non cambia nessuna indeterminazione), l&rsquo;equazione $T\psi(x)=0$ diventa $\big(x+\hbar\omega_0\,\tfrac{d}{dx}\big)\psi(x)=0$. Scrivendo $\alpha\equiv\hbar\omega_0>0$ (il segno si fissa richiedendo normalizzabilità), si verifica che la gaussiana $\psi(x)=\mathcal N e^{-x^2/2\alpha}$ risolve esattamente questa equazione:</p>
   $$\Big(x+\alpha\frac{d}{dx}\Big)e^{-x^{2}/2\alpha}=0.$$
   <p>È un&rsquo;equazione del primo ordine, quindi la soluzione è unica a meno di normalizzazione: <b>la</b> funzione d&rsquo;onda di minima indeterminazione è una gaussiana, e nessun&rsquo;altra forma funzionale la soddisfa.</p>`},
   {label:'Normalizzazione e $\\langle x^2\\rangle$', body:R`
   <p>Scrivendo $\alpha=\sigma^2$ (la scelta che rende $\sigma$ interpretabile come larghezza), la normalizzazione richiede l&rsquo;<span class="str" data-str="integrale-gaussiano">integrale gaussiano</span></p>
   $$\int_{-\infty}^{+\infty}e^{-x^{2}/2\sigma^{2}}dx=\sigma\sqrt{2\pi},$$
   <p>da cui $\mathcal N=(\sigma\sqrt{2\pi})^{-1/2}$. Il secondo momento si ottiene con lo stesso integrale gaussiano, pesato da $x^2$ (un passaggio standard di integrazione per parti, o la derivata dell&rsquo;integrale normalizzante rispetto a $1/\sigma^2$):</p>
   $$\langle x^{2}\rangle=\sigma^{2}.$$
   <p>Quindi $\Delta x=\sigma$: la larghezza della gaussiana <i>è</i>, per costruzione, l&rsquo;indeterminazione in posizione.</p>`},
   {label:'$\\langle p^2\\rangle$, calcolato in rappresentazione impulso', body:R`
   <p>Il modo più diretto di trovare $\Delta p$ non è derivare $\psi(x)$ più volte: è passare alla rappresentazione d&rsquo;impulso, dove la <span class="str" data-str="trasformata-di-fourier">trasformata di Fourier</span> di una gaussiana è un&rsquo;altra gaussiana, di larghezza <i>inversa</i>. La densità di probabilità in $p$ è proporzionale a $e^{-2\sigma^2p^2/\hbar^2}$, e i due integrali che servono sono</p>
   $$\int_{-\infty}^{+\infty}p^{2}e^{-2\sigma^{2}p^{2}/\hbar^{2}}dp=\frac{\hbar^{3}\sqrt{2\pi}}{8\sigma^{3}},\qquad \int_{-\infty}^{+\infty}e^{-2\sigma^{2}p^{2}/\hbar^{2}}dp=\frac{\hbar\sqrt{2\pi}}{2\sigma},$$
   <p>il primo per il numeratore di $\langle p^2\rangle$, il secondo per la normalizzazione. Il rapporto è</p>
   $$\langle p^{2}\rangle=\frac{\hbar^{2}}{4\sigma^{2}},$$
   <p>quindi $\Delta p=\hbar/(2\sigma)$ — e si vede già qui perché questa famiglia <i>deve</i> saturare: $\Delta x$ e $\Delta p$ sono inversamente proporzionali con la costante di proporzionalità esatta che rende il prodotto indipendente da $\sigma$:</p>
   $$\Delta x\,\Delta p=\sigma\cdot\frac{\hbar}{2\sigma}=\frac{\hbar}{2}.$$
   <p>Qualunque $\sigma$ si scelga — pacchetto largo o strettissimo — il prodotto è sempre esattamente $\hbar/2$, il pavimento di Robertson raggiunto con il segno di uguale.</p>`}
  ]},
  {t:'reveal', title:'Perché questo stato deve essere puro: l’argomento di Stoler e Newman', tag:'costruzione', steps:[
   {label:'La domanda che Ballentine pone e che i libri introduttivi saltano', body:R`
   <p>Tutto il calcolo sopra presuppone che lo stato sia descritto da un vettore $|\psi\rangle$ — uno stato <b>puro</b>. Ma la disuguaglianza di Robertson, dedotta in tappa 05 con il lemma di Schwarz su $\langle s|\dots|s\rangle$, si può ridedurre parola per parola per uno stato <b>misto</b>, con la <span class="str" data-str="traccia">traccia</span> $\mathrm{Tr}(\rho\, T^\dagger T)\ge0$ al posto di $\langle\psi|T^\dagger T|\psi\rangle\ge0$ — ed è esattamente quello che fa Ballentine nel §8.4. La domanda allora è legittima: potrebbe esistere una miscela statistica $\rho$ (non un singolo stato puro) che satura comunque $\Delta x\Delta p=\hbar/2$?</p>`},
   {label:'Il punto cruciale: due gaussiane diverse non sono mai ortogonali', body:R`
   <p>La risposta di Stoler e Newman (1972, citata da Ballentine) passa per un fatto quasi invisibile: due pacchetti gaussiani di minima indeterminazione, centrati in punti diversi $0$ e $d$ ma con la stessa larghezza $\sigma$, hanno sovrapposizione</p>
   $$\langle\psi_{0}|\psi_{d}\rangle=e^{-d^{2}/8\sigma^{2}},$$
   <p>che non è <i>mai</i> zero, per nessun $d$ finito — decresce, ma non si annulla. Confrontare con una base di autostati di $x$ (che sono ortogonali per $d\neq0$, essendo autostati di un&rsquo;osservabile con autovalori distinti) mostra che la famiglia delle gaussiane di minima indeterminazione è l&rsquo;esatto opposto: <i>nessuna</i> coppia distinta è ortogonale.</p>`},
   {label:'Perché questo esclude le miscele', body:R`
   <p>Se $\rho=\sum_k w_k|\phi_k\rangle\langle\phi_k|$ fosse una miscela (pesi $w_k>0$, almeno due termini) che satura Schrödinger con uguaglianza, un teorema generale sulla saturazione delle disuguaglianze convesse richiede che <i>ciascuno</i> dei $|\phi_k\rangle$ nella decomposizione sia esso stesso uno stato di minima indeterminazione — altrimenti la media pesata supererebbe il pavimento. Ma gli stati di minima indeterminazione con la stessa $\sigma$ formano esattamente la famiglia a un parametro (il centro) appena vista, e nessuno di questi stati è ortogonale agli altri: non si può costruire una miscela statistica genuina (che richiede pesi su stati linearmente indipendenti, tipicamente ortogonali per una decomposizione spettrale) usando solo membri di una famiglia dove ogni coppia si sovrappone. L&rsquo;unica via d&rsquo;uscita è $w_k=1$ per un solo $k$: la miscela collassa a un singolo stato puro. È un argomento indiretto — non costruisce la contraddizione esplicitamente, mostra che la via per costruirla è bloccata — ma è esattamente il tipo di argomento che la tappa 08 troverà di nuovo, quando il disaccordo sarà su cosa $\Delta$ misura e non su chi può saturarlo.</p>`}
  ]},
  {t:'plot', title:'La sovrapposizione che decresce e non si annulla mai',
   intro:R`$\langle\psi_0|\psi_d\rangle=e^{-d^2/8\sigma^2}$ è una gaussiana nella variabile $d$: decresce rapidamente, ma per nessun $d$ finito tocca l&rsquo;asse. Il disegno confronta la sovrapposizione per due larghezze $\sigma$ diverse — la famiglia più larga (verde) mantiene una sovrapposizione apprezzabile fino a distanze maggiori, quella più stretta (blu) decade più in fretta, ma entrambe restano strettamente positive su tutto l&rsquo;asse.`,
   plots:[
    {kind:'func2d', xr:[0,6], yr:[-0.05,1.05], height:300, ticks:6,
     title:'⟨ψ₀|ψ_d⟩ = exp(−d²/8σ²), per σ=1 e σ=2',
     curves:[
      {f:'exp(-x^2/8)', col:'#4c8dff', width:2.6, label:'σ=1'},
      {f:'exp(-x^2/32)', col:'#5ac8a0', width:2.2, label:'σ=2'}
     ],
     xlabel:'d (distanza fra i centri)', ylabel:'sovrapposizione'}
   ],
   leggi:R`<p><b>Che cosa guardare.</b> Nessuna delle due curve attraversa mai lo zero: anche a $d=6$, molto oltre la larghezza $\sigma$, la curva blu vale ancora un numero positivo (piccolissimo, ma mai nullo). È la proprietà che l&rsquo;argomento di Stoler-Newman usa: una base ortogonale richiederebbe che la curva toccasse zero per qualche $d\neq0$, e nessuna gaussiana lo fa. <b>Che cosa impararne.</b> Una famiglia di stati puri può essere «quasi ortogonale» — sovrapposizione piccola a piacere per $d$ grande — senza essere ortogonale: e nella dimostrazione della tappa 07 è esattamente questa differenza, fra piccolo e nullo, a escludere le miscele.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Perché la sovrapposizione $\langle\psi_0|\psi_d\rangle=e^{-d^2/8\sigma^2}$ non è mai esattamente zero, mentre due autostati di $x$ con autovalori diversi SONO ortogonali?`,
    a:R`Perché gli autostati di $x$ sono infinitamente concentrati (<span class="str" data-str="delta-di-dirac">delta di Dirac</span>, non normalizzabili) e due delta centrate in punti diversi non si sovrappongono mai, mentre una gaussiana ha «code» che si estendono su tutta la retta e per quanto $d$ sia grande c&rsquo;è sempre una regione, lontana da entrambi i centri, dove entrambe le funzioni sono (esponenzialmente) piccole ma non nulle — e l&rsquo;integrale del prodotto, benché minuscolo, non è mai esattamente zero. È la stessa ragione fisica per cui una gaussiana è uno stato a quadrato sommabile e un autostato di $x$ non lo è: la tappa 05 di meccanica quantistica ha lasciato fuori apposta lo spettro continuo «nella sua parte delicata», e questa è precisamente quella parte.`},
   {q:R`L’argomento di Stoler-Newman esclude le miscele di gaussiane DIVERSE. Potrebbe una miscela di stati che NON sono gaussiane comunque saturare la disuguaglianza?`,
    a:R`No, per una ragione più semplice: l&rsquo;equazione $T|\phi_k\rangle=0$ ha la gaussiana come <b>unica</b> soluzione (è un&rsquo;equazione differenziale del primo ordine, vista sopra), quindi qualunque $|\phi_k\rangle$ che debba essere esso stesso uno stato di minima indeterminazione è automaticamente una gaussiana di quella stessa famiglia — non c&rsquo;è una seconda classe di funzioni non gaussiane che soddisfi la condizione di saturazione. L&rsquo;argomento di Stoler-Newman non sta escludendo un caso esotico: sta chiudendo l&rsquo;unica porta che restava aperta dopo aver già stabilito, nello stesso calcolo, che la forma funzionale è unica.`}
  ]}
]},

/* ---------------- 08 · CHE COSA Δ MISURA, E CHE COSA NON MISURA ---------------- */
{ num:'08', title:'Che cosa Δ misura, e che cosa non misura', meta:'la distinzione di Ballentine fra larghezza statistica e risoluzione strumentale · la lettura di Popper · il confronto con Δt ΔE · disaccordo dichiarato',
  blocchi:[
  {t:'prosa', title:'Un simbolo, due storie possibili', tag:'architettura', html:R`
  <p>Le tappe 05-07 hanno trattato $\Delta A$ come un oggetto puramente statistico: lo scarto quadratico medio di una distribuzione di probabilità, calcolato da $\langle A^2\rangle-\langle A\rangle^2$. Non è l&rsquo;unica lettura possibile, e non è quella con cui Heisenberg ha scoperto la relazione nel 1930 — la tappa 09 darà la parola a lui. Questa tappa isola <i>che cosa</i> $\Delta A$ dice, prima di sentire le due voci, perché altrimenti il disaccordo che segue sembrerebbe un dettaglio filosofico invece di una domanda ben posta sull&rsquo;operazionalità del simbolo.</p>`},
  {t:'reveal', title:'La posizione di Ballentine: Δ non è un errore di misura', tag:'costruzione', steps:[
   {label:'La distinzione, e perché serve un secondo simbolo', body:R`
   <p>Ballentine insiste su una distinzione che il simbolo $\Delta$ da solo non porta: $\Delta Q,\Delta P$ sono <b>larghezze statistiche</b> — quanto è sparsa la distribuzione di probabilità di $Q$ (o $P$) su un <i>insieme</i> di sistemi preparati nello stesso stato — e non hanno niente a che fare con $\delta Q,\delta P$, la <b>risoluzione dello strumento</b> usato per una singola misura. Sono concetti indipendenti: uno strumento perfettissimo ($\delta Q\to0$) misurato su un ensemble con $\Delta Q$ grande dà comunque una distribuzione larga di risultati, e uno strumento grossolano può misurare un ensemble con $\Delta Q$ piccolissimo senza che la relazione di indeterminazione se ne accorga. La relazione lega $\Delta Q$ e $\Delta P$ fra loro, non $\delta Q$ e $\delta P$:</p>
   $$\Delta Q\,\Delta P\ \ge\ \tfrac12\hbar\quad\text{con}\quad\delta Q,\ \delta P\ \text{indipendenti}.$$`},
   {label:'Come si verificherebbe sperimentalmente', body:R`
   <p>La conseguenza operativa è precisa: per controllare la relazione non si misurano $Q$ e $P$ <i>simultaneamente</i> sullo stesso sistema (operazione che la tappa 02 ha già reso problematica per osservabili incompatibili) — si preparano <i>molte copie identiche</i> dello stesso stato, su metà si misura $Q$ e sull&rsquo;altra metà $P$, e si confrontano le larghezze dei due istogrammi. La lettura statistica di questa procedura, per Ballentine, risale a <b>K. R. Popper</b> (1934): la relazione è un&rsquo;affermazione sull&rsquo;ensemble statistico, non sulla perturbazione di un singolo sistema da parte di un singolo apparato.</p>`},
   {label:'Un esempio dove il limite quantistico è quasi raggiunto', body:R`
   <p>Ballentine cita un esempio di cristallografia (da Jauch) in cui la larghezza angolare di un fascio diffratto e l&rsquo;incertezza nella posizione del cristallo che lo produce si avvicinano al limite $\hbar/2$ previsto dalla teoria — non per una singola coppia posizione-impulso di un singolo fotone misurata due volte, ma per le distribuzioni statistiche misurate su un ensemble di eventi di diffrazione. È il tipo di evidenza che la lettura statistica prevede e che la lettura «disturbo di misura» non ha bisogno di invocare, perché qui non c&rsquo;è nessuna seconda misura che perturbi la prima.</p>`}
  ]},
  {t:'prosa', title:'Il confronto che chiarisce per contrasto: $\\Delta t\\,\\Delta E$', tag:'architettura', html:R`
  <p>Il programma del corso nomina anche la relazione tempo-energia, e vale la pena vedere perché Ballentine (e Sakurai-Napolitano) la tengono separata dalle altre:</p>
  $$\Delta t\,\Delta E\gtrsim\hbar.$$
  <p>Il tempo, in meccanica quantistica non relativistica, <b>non è un&rsquo;osservabile</b> — non c&rsquo;è un operatore autoaggiunto $\hat t$ con cui calcolare $\Delta t=\sqrt{\langle t^2\rangle-\langle t\rangle^2}$ nel senso delle tappe 05-07, perché il tempo è un parametro esterno dell&rsquo;evoluzione, non una grandezza che si misura su un singolo stato nell&rsquo;istante dato. Qui $\Delta t$ significa qualcosa di diverso — tipicamente il tempo caratteristico su cui il sistema cambia apprezzabilmente — e $\Delta E$ resta la larghezza statistica ordinaria dell&rsquo;energia. Sakurai-Napolitano lo scrive esplicitamente: la relazione tempo-energia è «di natura molto diversa» da $\Delta A\Delta B\ge\tfrac12|\langle[A,B]\rangle|$, perché non esiste nessun commutatore $[\hat t,\hat H]$ da cui dedurla con il metodo delle tappe 05-06. È un avvertimento che vale la pena portare fino all&rsquo;esame: scrivere $\Delta t\Delta E\ge\hbar/2$ con lo stesso segno di disuguaglianza rigorosa delle altre relazioni, come se seguisse dallo stesso teorema, è l&rsquo;errore concettuale più comune su questo argomento.</p>`},
  {t:'prosa', title:'Il disaccordo, dichiarato e non risolto', tag:'architettura', html:R`
  <p>Questa tappa non sceglie fra le due letture, e la tappa 09 darà a Heisenberg lo spazio per argomentare la sua. Il punto che <i>questa</i> tappa fissa è più modesto ma più solido: $\Delta Q\Delta P\ge\hbar/2$, <b>nella forma in cui questo movimento l&rsquo;ha dedotta</b> (tappe 05-06, da Schwarz e dalla positività di una norma), è un&rsquo;affermazione sulla larghezza di distribuzioni statistiche, punto — nessuna perturbazione, nessun apparato, nessun disturbo sono entrati in nessun passaggio della dimostrazione algebrica. Se Heisenberg ha ragione che la relazione riflette <i>anche</i> un limite fisico sul disturbo introdotto da una misura, quella è un&rsquo;affermazione ulteriore, che la dimostrazione di Picasso e Ballentine non contiene e non contraddice: sono due domande diverse che la stessa disuguaglianza algebrica, da sola, non può distinguere.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Se Δt non è lo scarto quadratico medio di un operatore, perché il simbolo Δ si usa comunque per il tempo?`,
    a:R`Per analogia di ruolo, non di definizione: in entrambi i casi Δ indica «quanto è indeterminata/caratteristica» una grandezza nel contesto del processo in esame, ma la costruzione matematica dietro è diversa. Per $\Delta E$ è lo scarto quadratico medio della distribuzione di energia sullo stato, costruito esattamente come $\Delta Q,\Delta P$ nelle tappe precedenti; per $\Delta t$ non esiste un operatore da cui costruire una distribuzione di probabilità nello stesso senso, e la quantità che compare in $\Delta t\Delta E\gtrsim\hbar$ è tipicamente definita operativamente — per esempio come il tempo su cui il valore medio di un&rsquo;osservabile cambia di una deviazione standard. Usare lo stesso simbolo per due costruzioni diverse è comodo ma rischia di far credere che esista un unico teorema che le copre entrambe: non esiste.`},
   {q:R`La lettura di Ballentine dice che Δ è una larghezza statistica, non un errore di misura. Significa che un singolo strumento con risoluzione perfetta può in linea di principio «battere» la relazione di indeterminazione?`,
    a:R`No, e qui la distinzione $\Delta$ contro $\delta$ è decisiva: uno strumento con $\delta Q\to0$ misura il valore di $Q$ su UN sistema con precisione arbitraria — ma il valore che trova varia da copia a copia dell&rsquo;ensemble, con una dispersione pari a $\Delta Q$, che è una proprietà dello STATO e non dello strumento. La relazione $\Delta Q\Delta P\ge\hbar/2$ non pone alcun limite a $\delta Q$ da solo: pone un limite a come $\Delta Q$ e $\Delta P$ possano essere simultaneamente piccoli per uno stesso stato. Uno strumento perfetto rivelerebbe esattamente quella dispersione, non la eliminerebbe.`}
  ]}
]},

/* ---------------- 09 · DUE VOCI DEL 1930: HEISENBERG E DIRAC ---------------- */
{ num:'09', title:'Due voci del 1930: Heisenberg e Dirac', meta:'il microscopio di Heisenberg e le sue confutazioni · Δq come scarto quadratico medio, non solo euristica · Dirac e la funzione di trasformazione',
  blocchi:[
  {t:'prosa', title:'Chi ha scoperto la relazione, e come l’ha scoperta', tag:'architettura', html:R`
  <p>Le tappe 05-08 hanno dedotto $\Delta A\Delta B\ge\tfrac12|\langle[A,B]\rangle|$ da un teorema di algebra degli operatori — Picasso, 1985 anni dopo Heisenberg. Nessuno dei due argomenti di Heisenberg, nei <i>Principi fisici della teoria dei quanti</i> (1930), usa un commutatore: li precede entrambi. Vale la pena leggerli nella forma originale, perché la tappa 08 ha appena mostrato che il disaccordo su cosa $\Delta$ misuri non è un dettaglio da manuale — è la domanda con cui tutto è cominciato.</p>`},
  {t:'reveal', title:'Il primo argomento di Heisenberg: contare le lunghezze d’onda', tag:'costruzione', steps:[
   {label:'Un pacchetto, e quante onde ci entrano', body:R`
   <p>Heisenberg immagina un pacchetto d&rsquo;onda di larghezza $\Delta q$ costruito sovrapponendo onde piane di lunghezza $\lambda$. Perché le onde si <i>cancellino</i> fuori dal pacchetto — perché cioè il pacchetto sia davvero localizzato e non si estenda su tutto lo spazio — serve una banda di lunghezze d&rsquo;onda sufficientemente larga: se il pacchetto contiene circa $n=\Delta q/\lambda$ creste, occorre includere nella sovrapposizione anche le componenti che ne fanno stare $n+1$, altrimenti la cancellazione fuori dal pacchetto è incompleta. Più il pacchetto è stretto (pochi $\lambda$ ci entrano), più la banda di lunghezze d&rsquo;onda necessaria è relativamente larga — ed è un argomento puramente ondulatorio, nessun quanto, nessuna misura, solo l&rsquo;aritmetica delle interferenze.</p>`},
   {label:'Dalla banda di lunghezze d’onda alla banda d’impulso', body:R`
   <p>De Broglie lega $\lambda$ a $p$ con $p=h/\lambda$: una banda relativa di $\lambda$ si traduce in una banda relativa di $p$, e il conto di Heisenberg — tenere traccia di quanto deve essere larga la banda per garantire la cancellazione — produce esattamente $\Delta q\,\Delta p\sim h$. È il primo argomento, ed è <i>ondulatorio</i>: non c&rsquo;è ancora nessun apparato di misura in scena, solo la matematica dei pacchetti d&rsquo;onda — la stessa che la tappa 07 ha reso rigorosa con la trasformata di Fourier di una gaussiana.</p>`}
  ]},
  {t:'reveal', title:'Il secondo argomento: il microscopio di Heisenberg', tag:'esempio', steps:[
   {label:'Il quanto che deve diffondersi per essere visto', body:R`
   <p>Il secondo argomento è quello più citato, e per vederlo serve l&rsquo;apparato: un microscopio, con apertura angolare $\varepsilon$, che osserva un elettrone illuminandolo con luce. La risoluzione ottica dello strumento è $\lambda/\sin\varepsilon$ — questa è la precisione $\delta q$ con cui si localizza l&rsquo;elettrone. Ma per essere <i>visto</i>, almeno un quanto di luce deve diffondersi dall&rsquo;elettrone ed entrare nell&rsquo;obiettivo, e quel quanto, per effetto Compton, cede all&rsquo;elettrone un rinculo — un impulso trasferito la cui direzione <i>dentro il cono di apertura</i> del microscopio non è nota. L&rsquo;incertezza sull&rsquo;impulso trasferito è dell&rsquo;ordine di $(h/\lambda)\sin\varepsilon$, e moltiplicando le due incertezze il $\sin\varepsilon$ si cancella: $\delta q\,\delta p\sim h$.</p>`},
   {label:'Le due obiezioni, e perché Heisenberg le confuta entrambe con un numero', body:R`
   <p>Heisenberg stesso immagina due scappatoie, e le chiude per conto proprio. <b>Prima obiezione:</b> se il microscopio fosse montato su un supporto <i>mobile</i>, misurando il rinculo del supporto si potrebbe dedurre il rinculo ceduto all&rsquo;elettrone e sottrarlo — ma questo richiede a sua volta di misurare la posizione e l&rsquo;impulso del supporto, che ha la sua propria relazione di indeterminazione, e il guadagno si perde esattamente allo stesso ordine. <b>Seconda obiezione</b>, più tecnica: raffinando la misura dell&rsquo;impulso trasferito ripetendo l&rsquo;osservazione su $m$ quanti diffusi invece di uno solo e misurando il massimo della figura di diffrazione, la precisione statistica sulla posizione del massimo migliora come $\sqrt m$ — una pratica da ottica standard. Ma lo stesso $m$ peggiora l&rsquo;incertezza sull&rsquo;impulso trasferito complessivo esattamente della stessa radice: per $m=16$ quanti,</p>
   $$\sqrt{m}=4\ \text{per}\ m=16,$$
   <p>la risoluzione di posizione migliora di un fattore $\sqrt m=4$ (dividendo $\delta q$ per $\sqrt m$) e l&rsquo;incertezza d&rsquo;impulso peggiora dello stesso fattore (moltiplicando $\delta p$ per $\sqrt m$), e il prodotto non si muove:</p>
   $$\frac{\Delta x}{\sqrt m}\cdot\sqrt m\,\Delta p_x=\Delta x\,\Delta p_x.$$
   <p>Nessuna strategia sperimentale immaginabile — cambiare apertura, cambiare lunghezza d&rsquo;onda, ripetere la misura $m$ volte — aggira il limite: ogni guadagno su un fattore è pagato esattamente dalla perdita sull&rsquo;altro.</p>`}
  ]},
  {t:'prosa', title:'Heisenberg non ha solo l’argomento euristico: la definizione statistica, a pagina 27', tag:'architettura', html:R`
  <p>Un luogo comune, anche nei corsi universitari, dice che Heisenberg avesse solo l&rsquo;argomento qualitativo del microscopio e che la lettura statistica rigorosa sia arrivata dopo, con Kennard o con la formalizzazione successiva. Non è esatto: nello stesso capitolo, Heisenberg <b>definisce</b> $\Delta q$ come lo scarto quadratico medio sull&rsquo;ampiezza di probabilità,</p>
  $$(\Delta q)^{2}=\int (q'-\bar q)^{2}\,|S(q')|^{2}\,dq',$$
  <p>cita esplicitamente Kennard, e osserva che le relazioni si possono dedurre «senza immediato riferimento al modello ondulatorio» direttamente dallo schema matematico — cioè dalla stessa struttura algebrica che questo movimento ha seguito nelle tappe 05-07. La riga che vale la pena portare all&rsquo;esame è una nota a piè di pagina sull&rsquo;espressione «in realtà»: Heisenberg la usa per segnalare che il significato delle parole «posizione» e «velocità» <i>fuori</i> dai limiti dati dalla relazione di indeterminazione non è semplicemente impreciso — è <b>indefinito</b>, nello stesso senso in cui chiedere il colore di un numero non ha una risposta sbagliata, ne ha nessuna.</p>`},
  {t:'reveal', title:'Dirac: la stessa relazione, dedotta da Fourier in mezza pagina', tag:'esempio', steps:[
   {label:'La funzione di trasformazione, e il suo modulo quadro', body:R`
   <p>Dirac arriva alla stessa disuguaglianza da una direzione completamente diversa, nel §24 dei <i>Principi</i>: la <span class="str" data-str="operatore-unitario">funzione che trasforma</span> dalla rappresentazione $q$ a quella $p$ è $\langle q'|p'\rangle\propto e^{iq'p'/\hbar}$, e il suo modulo quadro è <i>costante</i>, indipendente da $q'$:</p>
   $$|\langle q'|p'\rangle|^{2}=\frac1h.$$
   <p>Da questo fatto solo — nessuna misura, nessun apparato — Dirac conclude che se $p$ è conosciuto con esattezza assoluta, ogni valore di $q$ è <i>equiprobabile</i>: l&rsquo;autostato di $p$ non privilegia nessuna posizione. È l&rsquo;estremo opposto rispetto al microscopio di Heisenberg: qui l&rsquo;indeterminazione nasce dalla struttura della trasformata di Fourier, non da un disturbo fisico.</p>`},
   {label:'Il limite della validità, dichiarato dall’autore stesso', body:R`
   <p>Dirac ricava $\Delta q\,\Delta p=\hbar$ dalla relazione di Fourier fra i due rappresentativi, ma aggiunge — ed è la riga che rende questa fonte onesta — che il risultato vale «<i>solo nel caso più favorevole</i>» del pacchetto d&rsquo;onde, cioè per la gaussiana di minima indeterminazione che la tappa 07 ha costruito per intero. Per qualunque altra forma della funzione d&rsquo;onda, il prodotto è strettamente più grande — esattamente il contenuto della disuguaglianza di Robertson, qui anticipato senza dimostrazione dal risultato di un caso particolare.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Heisenberg e Dirac arrivano allo stesso numero da strade opposte — disturbo fisico contro struttura di Fourier. Le due derivazioni sono in competizione, o sono compatibili?`,
    a:R`Sono compatibili, e la tappa 08 ha già preparato il perché: rispondono a due domande diverse che condividono lo stesso vincolo matematico finale. Il microscopio di Heisenberg stima quanto una misura di posizione <i>disturba</i> l&rsquo;impulso di un singolo elettrone; Dirac mostra che, indipendentemente da qualunque misura, la struttura stessa dello spazio degli stati impone che un vettore concentrato in $q$ sia disperso in $p$ (e viceversa) attraverso la trasformata di Fourier. Il fatto che arrivino al medesimo $\hbar$ non è una coincidenza — è il segno che entrambi stanno descrivendo, da angoli diversi, la stessa struttura algebrica che Picasso dimostra in generale nelle tappe 05-06.`},
   {q:R`La confutazione della «seconda obiezione» mostra che raffinare con $m$ quanti non aiuta. Ma allora perché gli strumenti di misura reali, con molte ripetizioni, SONO più precisi di una singola osservazione?`,
    a:R`Perché quella maggiore precisione riguarda la stima del valor medio di una grandezza su un ensemble — ad esempio $\langle x\rangle$ — non la larghezza $\Delta x$ della distribuzione sullo stato singolo. Ripetere una misura $m$ volte su $m$ copie identicamente preparate dello stesso stato restringe l&rsquo;errore sulla MEDIA stimata come $1/\sqrt m$ (la legge dei grandi numeri, non la fisica quantistica), ma non restringe la dispersione $\Delta x$ intrinseca allo stato, che è quella che compare nella relazione di indeterminazione. Il conto di Heisenberg con $m$ quanti riguardava invece il TRASFERIMENTO di rinculo su una singola misura di posizione raffinata internamente — un meccanismo diverso, dove il miglioramento di un fattore è pagato esattamente dal peggioramento dell&rsquo;altro, senza scampo.`}
  ]}
]},

/* ---------------- 10 · IL FILO RICOMPOSTO: IL TEMPO, E DUE MISURE IN SEQUENZA ---------------- */
{ num:'10', title:'Il filo ricomposto: il tempo, e due misure in sequenza', meta:'la cascata di Stern-Gerlach, rivista col commutatore · x(t) e x(0) come coppia incompatibile · il pacchetto libero che si allarga · chiusura del movimento',
  blocchi:[
  {t:'prosa', title:'Due promesse rimaste aperte, e questa tappa le chiude entrambe', tag:'architettura', html:R`
  <p>Il movimento è partito dalla stessa domanda letta in due versi — compatibilità e indeterminazione — e ha promesso, in apertura, che le due letture sarebbero rimaste cucite insieme fino alla fine. Due fili erano rimasti scoperti: la cascata di Stern-Gerlach di <code>mq-04</code>, dove la tappa 09 di quel movimento aveva calcolato la probabilità di <i>ritrovare</i> l&rsquo;esito originale dopo un filtro intermedio, ma non la probabilità del suo opposto; e il tempo, nominato nella tappa 08 come il caso in cui l&rsquo;analogia con un commutatore si rompe. Questa tappa chiude entrambi, e con lo stesso strumento: il commutatore come misura di quanto l&rsquo;ordine delle operazioni conta.</p>`},
  {t:'reveal', title:'Il filtro di Stern-Gerlach, completato: la probabilità del cambio di esito', tag:'esempio', steps:[
   {label:'La probabilità complementare', body:R`
   <p>In <code>mq-04</code>, un fascio preparato con $S_z=+\hbar/2$ passa un filtro orientato a un angolo $\vartheta$ e poi viene rimisurato lungo $z$: la probabilità di ritrovare $+\hbar/2$ era $\cos^4(\vartheta/2)+\sin^4(\vartheta/2)$. La probabilità <i>complementare</i> — che l&rsquo;esito sia cambiato, cioè che il filtro intermedio abbia effettivamente fatto qualcosa di irreversibile — è $1$ meno quella, ed è la somma incrociata dei due contributi:</p>
   $$\cos^{2}\tfrac\vartheta2\sin^{2}\tfrac\vartheta2+\sin^{2}\tfrac\vartheta2\cos^{2}\tfrac\vartheta2=\tfrac12\sin^{2}\vartheta.$$
   <p>È la stessa identità trigonometrica della tappa 06 ($2\sin\varphi\cos\varphi=\sin2\varphi$, qui al quadrato e diviso due), e non è un caso: entrambe misurano quanto due proiettori relativi a basi diverse si «mescolano».</p>`},
   {label:'Il caso $\\vartheta=\\pi/2$: il filtro che rende l’esito una moneta', body:R`
   <p>A $\vartheta=\pi/2$ — filtro intermedio orientato <i>ortogonalmente</i> all&rsquo;asse originale —</p>
   $$\tfrac12\sin^{2}\tfrac\pi2=\tfrac12,$$
   <p>cioè l&rsquo;esito finale è esattamente il 50% delle volte invertito: il filtro intermedio, misurando un&rsquo;osservabile <i>massimamente</i> incompatibile con $S_z$ (gli operatori di spin lungo $x$ e lungo $z$ sono il caso $\vartheta=\pi/2$ di questa stessa famiglia), ha reso l&rsquo;esito di $S_z$ completamente casuale — ha cancellato ogni informazione che il primo filtro aveva stabilito. È la stessa fisica della tappa 02 (un terzo operatore come $G$ seleziona una base diversa da quella di $B$) scritta come probabilità invece che come autovettori.</p>`}
  ]},
  {t:'reveal', title:'Il tempo, chiuso senza bisogno di un commutatore postulato', tag:'costruzione', steps:[
   {label:'$x(t)$ e $x(0)$: posizione a due istanti come coppia incompatibile', body:R`
   <p>La tappa 08 ha dichiarato che $\Delta t\Delta E$ non segue dal metodo delle tappe 05-06 perché il tempo non è un&rsquo;osservabile. C&rsquo;è però un modo imparentato, e legittimo, di far rientrare il tempo nel formalismo: non trattarlo come un operatore, ma guardare come la <i>stessa</i> osservabile si comporta a <b>istanti diversi</b>. Per una particella libera, nell&rsquo;immagine di Heisenberg, $x(t)=x(0)+p\,t/m$ (l&rsquo;equazione del moto risolta nel caso più semplice), e quindi</p>
   $$[x(t),x(0)]=\big[x(0)+\tfrac{pt}{m},\,x(0)\big]=\frac{t}{m}[p,x(0)]=-\frac{i\hbar t}{m}.$$
   <p>$x(t)$ e $x(0)$ <b>non commutano</b>, per $t\neq0$: sono una coppia di osservabili incompatibili esattamente nel senso della tappa 02, anche se entrambe sono «la stessa» grandezza fisica, solo a istanti diversi. Applicando Robertson (tappa 05) a questa coppia,</p>
   $$\tfrac12\big|\langle[x(t),x(0)]\rangle\big|=\frac{\hbar t}{2m}.$$`}
  ]},
  {t:'reveal', title:'Il pacchetto libero che si allarga, misurato con lo stesso conto', tag:'esempio', steps:[
   {label:'Quanto si allarga una gaussiana lasciata libera', body:R`
   <p>La gaussiana di minima indeterminazione della tappa 07, lasciata evolvere liberamente, non resta ferma: $\Delta p$ è conservato ($[H,p]=0$ per una particella libera), ma la posizione si allarga con un meccanismo puramente cinematico — le componenti di impulso diverse, tutte presenti nel pacchetto iniziale, si separano nel tempo. Il contributo di questo allargamento, con $\Delta p=\hbar/2\sigma$ dalla tappa 07, è</p>
   $$\Big(\frac{t\,\Delta p}{m}\Big)^{2}=\frac{\hbar^{2}t^{2}}{4m^{2}\sigma^{2}}.$$
   <p>Questo termine <b>cresce</b> con $t$: più tempo passa, più l&rsquo;incertezza iniziale sull&rsquo;impulso si traduce in un ventaglio di posizioni raggiunte.</p>`},
   {label:'Il punto in cui il contributo iniziale e quello di allargamento si equivalgono', body:R`
   <p>La larghezza totale a tempo $t$ è $\Delta x(t)^2=\sigma^2+(\hbar t/2m\sigma)^2$ — il termine iniziale più il contributo appena calcolato. Scegliendo $\sigma^2=\hbar t/2m$ — il valore per cui il pavimento dell&rsquo;istante iniziale coincide numericamente con il tempo trascorso — i due contributi diventano uguali, e si sommano:</p>
   $$\Delta x(t)^{2}\Big|_{\sigma^{2}=\hbar t/2m}=\frac{\hbar t}{2m}+\frac{\hbar t}{2m}=\frac{\hbar t}{m}.$$
   <p>Non è un caso speciale privo di significato: è esattamente il $\sigma$ per cui il pacchetto, a tempo $t$, ha raddoppiato la sua larghezza quadra rispetto a quella iniziale — il punto naturale per dire che il pacchetto ha smesso di essere «lo stesso» pacchetto di minima indeterminazione con cui si è partiti in tappa 07. Il filo si richiude qui: la relazione dedotta da un&rsquo;algebra atemporale (tappe 05-06), saturata da una forma funzionale specifica (tappa 07), finisce per descrivere anche <i>come il tempo stesso</i> distrugge la saturazione che aveva creato.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Il commutatore $[x(t),x(0)]=-i\hbar t/m$ dipende dal tempo. È compatibile con la tappa 04, dove i commutatori fondamentali ($[x,p]=i\hbar$) erano NUMERI, non funzioni del tempo?`,
    a:R`Sì, perché $[x(t),x(0)]$ non è un commutatore fondamentale: è un commutatore <i>derivato</i>, calcolato a partire dal commutatore fondamentale $[x,p]=i\hbar$ (costante, come deve essere) applicato all&rsquo;equazione del moto $x(t)=x(0)+pt/m$. Il fattore $t/m$ che compare è un numero c (il tempo trascorso diviso la massa), non un operatore: la dipendenza dal tempo entra attraverso la DINAMICA (come $x$ si evolve), non attraverso un&rsquo;improvvisa dipendenza temporale della struttura algebrica di base, che resta quella fissata in tappa 04.`},
   {q:R`La probabilità di cambio esito $\tfrac12\sin^2\vartheta$ e la relazione di indeterminazione $\Delta A\Delta B\ge\tfrac12|\langle[A,B]\rangle|$ sembrano argomenti diversi — una probabilità, l’altra un prodotto di scarti. C’è davvero un legame, o è solo un’somiglianza nei conti?`,
    a:R`C’è un legame reale, non solo una coincidenza algebrica: entrambe le quantità misurano quanto due proiezioni ortogonali relative a basi diverse — gli autostati di $S_z$ e quelli dell&rsquo;osservabile orientata a $\vartheta$ — si «mescolano», e in entrambi i casi il mescolamento è massimo esattamente quando le due basi sono quanto più incompatibili possibile ($\vartheta=\pi/2$, dove il commutatore delle componenti di spin è più «efficace»). La relazione di indeterminazione quantifica il mescolamento con un prodotto di scarti su stati generici; la probabilità di cambio esito lo quantifica con una probabilità su una base specifica — ma la fonte comune, in entrambi i casi, è che due osservabili incompatibili non condividono proiettori, e qualunque modo di misurare «quanto non li condividono» finisce per dipendere dallo stesso $\sin\vartheta$ o dallo stesso commutatore.`}
  ]}
]}

];

  typeset(body); wrap.appendChild(body); return wrap;
}
/* --- blocco PLOT: la figura non decora, si legge. Ogni plot porta una chiave di lettura. --- */
function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';
  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionSvelabile(title, tag, html, sol){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var c=document.createElement('div'); c.className='collaudo-item';
  var q=document.createElement('div'); q.className='cq'; q.innerHTML=html||'';
  c.appendChild(q); typeset(q);
  if(sol){
    var a=document.createElement('div'); a.className='ca'; a.style.display='none';
    a.innerHTML='<b>Soluzione.</b> '+sol;
    var btn=document.createElement('button'); btn.className='reveal-btn small';
    btn.textContent='Rivela la soluzione';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a);
      btn.disabled=true; btn.classList.add('done'); btn.textContent='Soluzione rivelata'; };
    c.appendChild(btn); c.appendChild(a);
  }
  wrap.appendChild(c); return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    /* DUE SCHEMI, NON UNO — scoperto il 2026-10-06 provando le pagine vive. I movimenti
       scritti per primi (em-01..03, me-10b, i collaudi di gd-01..09 e di quattro em)
       usano una forma piu' semplice: `reveal` e `prolessi` con un solo `html`,
       `esercizio` e `collaudo` con `html` + `sol`. Il renderer ne conosceva una sola e
       chiamava `steps.forEach` su `undefined`: TypeError, e la tappa si fermava li' —
       62 blocchi in 17 movimenti su 74. Non si riscrive il contenuto per far contento
       il renderer: e' il renderer che deve leggere cio' che c'e'.
       E in fondo un ramo che NON muore: uno schema nuovo di domani deve far vedere un
       avviso in quella sezione, non spegnere la pagina sotto di se'. */
    try{
      if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
      else if(b.t==='prolessi') m.appendChild(b.rotte ? sectionProlessi(b)
                                   : sectionProsa(b.title,'prolessi',b.html));
      else if(b.t==='reveal')m.appendChild(b.steps ? sectionReveal(b.title,b.tag,b.steps)
                                   : sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='esercizio') m.appendChild(b.steps ? sectionEsercizio(b)
                                   : sectionSvelabile(b.title,'esercizio',b.html,b.sol));
      else if(b.t==='collaudo')  m.appendChild(b.items ? sectionCollaudo(b.title,b.items)
                                   : sectionSvelabile(b.title,'provi, poi riveli',b.html,b.sol));
      else if(b.t==='plot')      m.appendChild(sectionPlot(b));
      else m.appendChild(sectionProsa(b.title||'(blocco)', 'tipo sconosciuto: '+b.t,
                                      b.html||''));
    }catch(err){
      var avv=document.createElement('section'); avv.className='section';
      avv.innerHTML='<h3>'+(b.title||'(blocco)')+'<span class="tag">non reso</span></h3>'
        +'<p style="color:#ff6b6b">Questo blocco non si &egrave; potuto rendere ('
        +b.t+': '+err.message+'). Il resto della tappa continua sotto.</p>';
      m.appendChild(avv);
    }
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* I POP-UP DEGLI STRUMENTI. `cablaStrumenti` esisteva dal 18-09 e non la chiamava
     nessuno: i 229 rimandi del percorso erano <span> senza handler, e il clic non
     faceva niente. Nessun controllo poteva vederlo — la sintassi era valida, le schede
     c'erano tutte, le formule rendevano: il guasto esisteva solo a pagina viva. Qui, e
     dopo ogni inserimento successivo, perche' la tappa si rimonta da capo a ogni
     cambio e gli handler vanno riattaccati al DOM nuovo. */
  cablaStrumenti(m);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}

/* deep-link: mq-05-compatibili-e-indeterminazione.html#03 apre direttamente la tappa 03 */
window.addEventListener('DOMContentLoaded', function(){
  var h=(location.hash||'').replace('#','');
  showTappa(byId[h]?h:'00');
});
window.addEventListener('hashchange', function(){
  var h=(location.hash||'').replace('#','');
  if(byId[h]) showTappa(h);
});
</script>
