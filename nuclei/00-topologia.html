  <p>Qui pianto un chiodo che ritroverai nel <b>nucleo sui campi vettoriali</b> (04), dove decide un&rsquo;intera classe di esercizi. La connessione &laquo;un pezzo solo&raquo; garantisce che un potenziale, se esiste, sia unico a meno di una costante. Ma per garantire che il potenziale <b>esista</b> serve una condizione <b>pi&ugrave; forte</b>: che il dominio non abbia <b>buchi</b>. Un aperto connesso &egrave; <b>semplicemente connesso</b> se ogni cammino chiuso al suo interno pu&ograve; essere contratto con continuit&agrave; a un punto senza uscire dal dominio.</p>
  <p>La distinzione &egrave; netta e ti servir&agrave; letteralmente: il piano bucato $\mathbb{R}^2\setminus\{(0,0)\}$ &egrave; <b>connesso</b> (un pezzo solo: giri attorno al buco e vai ovunque) ma <b>non semplicemente connesso</b> (un cappio attorno all&rsquo;origine non si contrae). Ed &egrave; esattamente su questo dominio che vive il campo del vortice $\mathbf F=\big(\tfrac{-y}{x^2+y^2},\tfrac{x}{x^2+y^2}\big)$: <b>irrotazionale</b> ($\nabla\times\mathbf F=\mathbf 0$) ma <b>non conservativo</b> (la sua circuitazione su un giro &egrave; $2\pi\neq0$). $$\boxed{\ \text{connesso} \Rightarrow \text{potenziale unico a meno di costante};\quad \text{semplicemente connesso} \Rightarrow \text{irrotazionale} \Rightarrow \text{conservativo}\ }$$ Tieni a mente la gerarchia: connesso &egrave; &laquo;un pezzo&raquo;, semplicemente connesso &egrave; &laquo;un pezzo senza buchi&raquo;. La prima proteggerai l&rsquo;unicit&agrave;, la seconda l&rsquo;esistenza. Quando nel nucleo 04 vedrai il lemma di Poincar&eacute; e il vortice, questo chiodo sar&agrave; gi&agrave; piantato.</p>`},
  {t:'plot', title:'Un pezzo solo, oppure due',
   intro:R`A sinistra $\{x^2+y^2=1\}\cup\{(x-3)^2+y^2=1\}$: due componenti separate. A destra la corona $1\le\lVert x\rVert\le2$: un pezzo solo, ma <b>con un buco</b>.`,
   plots:[
    {kind:'contour', f:'(x*x+y*y-1)*((x-3)*(x-3)+y*y-1)', levels:[0], col:'#ff6b6b', xr:[-1.6,4.6], yr:[-2.2,2.2], height:300, title:'NON connesso: due componenti, nessun cammino fra loro'},
    {kind:'contour', f:'hypot(x,y)', levels:[1,2], col:'#5eead4', xr:[-2.4,2.4], yr:[-2.4,2.4], height:300, title:'connesso ma NON semplicemente connesso'}
   ],
   leggi:R`A sinistra: qualunque funzione continua a valori in $\{0,1\}$ pu&ograve; valere $0$ su un cerchio e $1$ sull&rsquo;altro senza mai saltare &mdash; per questo su un insieme <b>non</b> connesso &laquo;gradiente nullo&raquo; <b>non</b> implica &laquo;funzione costante&raquo;: implica solo costante <b>su ciascuna componente</b>. &Egrave; l&rsquo;errore classico nei campi conservativi, dove ti trovi un potenziale con <b>costanti diverse</b> su pezzi diversi del dominio. A destra: la corona &egrave; connessa (da ogni punto raggiungi ogni altro restando dentro), ma un laccio che gira attorno al buco <b>non pu&ograve; essere contratto a un punto</b> senza uscire. Questa seconda propriet&agrave; &mdash; <b>semplicemente connesso</b> &mdash; &egrave; pi&ugrave; forte, e sar&agrave; l&rsquo;ipotesi decisiva del nucleo 5: un campo irrotazionale $\nabla\times F=0$ &egrave; conservativo <b>solo</b> su domini semplicemente connessi. Il controesempio universale, il campo $\left(\frac{-y}{x^2+y^2},\frac{x}{x^2+y^2}\right)$, vive esattamente sulla figura di destra: irrotazionale ovunque, eppure il suo integrale sul cerchio vale $2\pi$. Il buco che vedi qui &egrave; quel $2\pi$.`},
  {t:'gram', title:'Le sfumature del &laquo;pezzo solo&raquo;', rows:[
   [R`$\Omega$ connesso per archi`, R`$\forall a,b\in\Omega\ \exists\gamma:[0,1]\to\Omega$ continua, $\gamma(0)=a$, $\gamma(1)=b$. &laquo;Un pezzo solo&raquo;, ci si sposta senza uscire. Per gli aperti di $\mathbb{R}^n$ equivale a connesso topologico.`],
   [R`$\Omega$ connesso`, R`non &egrave; unione di due aperti disgiunti non vuoti; gli unici clopen sono $\varnothing$ e $\Omega$. L&rsquo;immagine continua di un connesso &egrave; connessa (valori intermedi).`],
   [R`semplicemente connesso`, R`connesso <b>e</b> ogni cappio si contrae a un punto: &laquo;un pezzo <b>senza buchi</b>&raquo;. Pi&ugrave; forte di connesso. $\mathbb{R}^n$, palle, semipiani: s&igrave;. Piano bucato, corona: no.`],
   [R`$\nabla f=0$ su connesso`, R`$\Rightarrow f$ costante. Su un dominio <b>sconnesso</b> pu&ograve; valere costanti diverse sui diversi pezzi. &Egrave; l&rsquo;unicit&agrave; del potenziale a meno di costante nel nucleo dei campi.`],
   [R`componente connessa`, R`il massimo pezzo connesso contenente un punto. Un aperto si decompone in componenti connesse disgiunte: i suoi &laquo;pezzi&raquo;. Su ciascuno gli argomenti di connessione valgono separatamente.`]
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`La corona circolare $\{1\lt x^2+y^2\lt4\}$ &egrave; connessa? &Egrave; semplicemente connessa?`,
    a:R`<b>Connessa s&igrave;</b> (un pezzo solo: due punti qualsiasi si uniscono con un arco che gira nell&rsquo;anello). <b>Semplicemente connessa no</b>: un cerchio concentrico a met&agrave; raggio circonda il buco centrale (il disco $\le1$ escluso) e non si contrae a un punto senza attraversare quel buco. &Egrave; il tipo di dominio su cui un campo irrotazionale pu&ograve; non essere conservativo &mdash; lo stesso motivo del piano bucato.`},
   {q:R`Se $\nabla f=(0,0)$ su tutto l&rsquo;insieme $\Omega=\{x\lt0\}\cup\{x\gt0\}$ (il piano meno l&rsquo;asse $y$), &egrave; vero che $f$ &egrave; costante?`,
    a:R`<b>No.</b> $\Omega$ &egrave; <b>sconnesso</b>: due componenti, il semipiano sinistro e il destro, senza cammino che le unisca dentro $\Omega$. Il teorema &laquo;$\nabla f=0\Rightarrow$ costante&raquo; vale su ciascuna componente <b>separatamente</b>: $f$ pu&ograve; valere una costante a sinistra e un&rsquo;altra a destra (es. $f=-1$ per $x\lt0$, $f=+3$ per $x\gt0$). La connessione &egrave; l&rsquo;ipotesi che stavi per dare per scontata.`}
  ]}
]},

/* ---------------- 08 · IL SENSO E LE ROTTE FISICHE ---------------- */
{ num:'08', title:'Il senso e le rotte fisiche', meta:'topologia = struttura di vicinanza · compattezza = niente scappa all&rsquo;orlo n&eacute; all&rsquo;infinito · connessione = un pezzo solo · e dove tutto questo diventa spazi astratti, spettro, ergodicit&agrave;',
  blocchi:[
  {t:'prosa', title:'Le tre idee del nucleo, ridotte all&rsquo;osso', tag:'significato, non addobbo', html:R`
  <p>Sotto le definizioni ci sono tre idee, e vale la pena isolarle perch&eacute; sono ci&ograve; che porti via anche quando i dettagli sbiadiscono.</p>
  <ul>
  <li><b>Topologia = struttura di vicinanza.</b> Prima di misurare, derivare, integrare, devi sapere cosa significa &laquo;due punti sono vicini&raquo;. La palla $B_r(x_0)$ &egrave; la risposta; da essa nascono aperti, limiti, continuit&agrave;. La topologia &egrave; lo scheletro minimo che rende sensata la parola &laquo;tende a&raquo;.</li>
  <li><b>Compattezza = niente scappa, n&eacute; all&rsquo;infinito n&eacute; all&rsquo;orlo.</b> Chiuso trattiene i limiti (nulla fugge dal bordo mancante), limitato impedisce la fuga all&rsquo;infinito. &Egrave; la propriet&agrave; che <b>garantisce esistenza</b>: di massimi e minimi (Weierstrass), e &mdash; nella sua versione astratta &mdash; di equilibri, stati fondamentali, punti fissi. Ogni volta che in fisica &laquo;deve esistere uno stato di minima energia&raquo;, sotto c&rsquo;&egrave; una compattezza.</li>
  <li><b>Connessione = un pezzo solo.</b> Garantisce che &laquo;attraversi tutti i valori intermedi&raquo; e che &laquo;gradiente nullo significhi costante&raquo;. La sua versione pi&ugrave; forte &mdash; semplicemente connesso, senza buchi &mdash; decide se un campo irrotazionale &egrave; conservativo. La forma del dominio &egrave; fisica, non contorno.</li>
  </ul>`},
  {t:'prosa', title:'A valle: dove riappare, dentro e oltre il percorso', tag:'connessioni interne', html:R`
  <p><b>A monte</b> questo nucleo non ha nulla: &egrave; il fondamento, il pavimento. <b>A valle</b> regge l&rsquo;intero Movimento I. La <b>differenziabilit&agrave;</b> (nucleo 01) &egrave; scritta con palle e limiti che hai definito qui; il trabocchetto &laquo;parziali esistono ma non differenziabile&raquo; &egrave; lo stesso baco di &laquo;continua separatamente ma non congiuntamente&raquo; della tappa 05. L&rsquo;<b>ottimizzazione vincolata</b> (Lagrange) &egrave; sensata solo perch&eacute; Weierstrass garantisce l&rsquo;esistenza degli ottimi su un compatto. I <b>campi conservativi</b> (nucleo 04) dipendono dalla connessione del dominio, come hai anticipato nella tappa 07.</p>
  <p>Oltre il Movimento I, il salto &egrave; concettuale. Tutto ci&ograve; che hai fatto qui in $\mathbb{R}^n$ &mdash; norma, palla, aperto, convergenza, compattezza, continuit&agrave; &mdash; verr&agrave; <b>astratto</b> nel <b>Movimento II</b>: uno <b>spazio metrico</b> &egrave; un insieme con una distanza $d$ che soddisfa gli assiomi della tappa 01; uno <b>spazio normato</b> ha una norma; uno <b>spazio di Banach</b> &egrave; un normato <b>completo</b>. In quella teoria $\mathbb{R}^n$ non sparisce: &egrave; il <b>prototipo</b>, l&rsquo;esempio concreto da cui la teoria astratta &egrave; stata distillata. E c&rsquo;&egrave; il punto esatto in cui questo nucleo <b>smette di valere</b>: in dimensione infinita (spazi di funzioni) le norme <b>non</b> sono pi&ugrave; equivalenti, e &laquo;chiuso e limitato&raquo; <b>non</b> implica pi&ugrave; compatto (Heine&ndash;Borel fallisce). Sapere dove finisce ci&ograve; che hai imparato &egrave; parte dell&rsquo;averlo imparato.</p>`},
  {t:'prolessi', title:'Prolessi — la topologia di $\\mathbb{R}^n$ &egrave; il prototipo di ogni &laquo;spazio&raquo; della fisica',
   oggetto:R`la struttura topologica di $\mathbb{R}^n$: la <b>norma</b> $\lVert\cdot\rVert$ e la distanza, le <b>palle</b> $B_r(x_0)$ come nozione di &laquo;vicino&raquo;, gli <b>aperti/chiusi</b>, la <b>compattezza</b> (chiuso e limitato) e la <b>connessione</b>. In matematica sono definizioni sul caso concreto $\mathbb{R}^n$; in fisica sono l&rsquo;impalcatura di ogni spazio in cui vive un sistema &mdash; delle configurazioni, delle fasi, degli stati.`,
   rotte:[
    {dove:'Analisi<br>funzionale<br>(Mov. II)', txt:R`La corrispondenza &egrave; una <b>promozione ad assioma</b>. Gli assiomi della norma (tappa 01) diventano la definizione di <b>spazio normato</b>; la distanza $d(x,y)=\lVert x-y\rVert$ diventa lo <b>spazio metrico</b>; la palla $B_r$ resta la definizione di &laquo;vicino&raquo; e di aperto; la convergenza per successioni resta identica. $\mathbb{R}^n$ &egrave; il <b>prototipo</b>, ma la teoria astratta comprende gli <b>spazi di funzioni</b> $C[a,b]$, $L^2$, $\ell^2$, dove i &laquo;punti&raquo; sono funzioni. Lo spazio di <b>Banach</b> aggiunge la <b>completezza</b> (ogni successione di Cauchy converge &mdash; il buco $\sqrt2\notin\mathbb{Q}$ non esiste): &egrave; ci&ograve; che rende leciti limiti, serie, punti fissi. E l&rsquo;avvertimento chiave: in dimensione infinita &laquo;chiuso e limitato&raquo; <b>non</b> basta pi&ugrave; per compatto &mdash; la palla unitaria di $L^2$ &egrave; chiusa, limitata e <b>non</b> compatta. Il tuo Heine&ndash;Borel &egrave; un lusso della dimensione finita.`},
    {dove:'Meccanica<br>quantistica', txt:R`Qui la parola-ponte &egrave; <b>compattezza $\Rightarrow$ discretezza</b>. In MQ gli stati vivono in uno spazio di Hilbert (un Banach con prodotto scalare, la versione infinito-dimensionale di $\mathbb{R}^n$) e le osservabili sono operatori. Quando l&rsquo;operatore hamiltoniano ha <b>risolvente compatto</b> &mdash; tipicamente perch&eacute; il sistema &egrave; <b>confinato</b> (potenziale che intrappola, dominio spaziale limitato) &mdash; il suo <b>spettro &egrave; discreto</b>: i livelli energetici sono <b>quantizzati</b>, $E_0\lt E_1\lt E_2\lt\dots$, separati. La compattezza &egrave; la ragione matematica per cui l&rsquo;energia di un elettrone legato assume valori discreti e non un continuo. E l&rsquo;esistenza dello <b>stato fondamentale</b> &mdash; il minimo dell&rsquo;energia $\inf\langle\psi|H|\psi\rangle$ &mdash; &egrave; un teorema di Weierstrass astratto: senza compattezza (sistema non legato) il minimo pu&ograve; non essere assunto, ed &egrave; il caso degli stati di <b>scattering</b>, con spettro continuo.`},
    {dove:'Meccanica<br>statistica', txt:R`Il moto di un sistema hamiltoniano vive nello <b>spazio delle fasi</b> $(\mathbf q,\mathbf p)$, un $\mathbb{R}^{2N}$ (o una sua sottovariet&agrave;). La superficie a <b>energia costante</b> $\{H(\mathbf q,\mathbf p)=E\}$ &egrave;, per un sistema <b>legato</b>, un insieme <b>compatto</b>: chiuso (controimmagine del chiuso $\{E\}$ tramite $H$ continua) e limitato (l&rsquo;energia finita impedisce la fuga all&rsquo;infinito). La compattezza &egrave; ci&ograve; che rende <b>finita</b> la misura microcanonica su quella superficie &mdash; senza la quale non potresti nemmeno <b>normalizzare</b> le probabilit&agrave;, e l&rsquo;insieme statistico non esisterebbe. La <b>connessione</b> topologico-dinamica di quella superficie, e le nozioni pi&ugrave; forti di <b>ergodicit&agrave;</b> e <b>mescolamento</b>, decidono se le medie temporali coincidono con quelle d&rsquo;insieme.`}
   ],
   domanda:R`La superficie a energia costante di un sistema legato &egrave; compatta, e la dinamica hamiltoniana vi conserva il volume (Liouville). Ma la compattezza da sola non dice come una traiettoria <b>riempie</b> quella superficie: potrebbe girare su un toro (moto integrabile, ordinato) oppure <b>mescolare</b> ergodicamente ogni regione con ogni altra. La domanda che la fisica ti far&agrave;: <b>quali propriet&agrave; topologiche e dinamiche dello spazio delle fasi rendono un sistema &laquo;ergodico&raquo; o &laquo;mescolante&raquo;</b>, cio&egrave; fanno s&igrave; che le medie temporali di un&rsquo;osservabile coincidano con le medie sull&rsquo;insieme &mdash; il fondamento non dimostrato della meccanica statistica? <br>&mdash; &Egrave; la porta della tua tesi. In versione <b>quantistica</b> la domanda diventa: come fa un sistema isolato, la cui evoluzione &egrave; unitaria e reversibile su uno spazio di Hilbert, a &laquo;termalizzare&raquo;, cio&egrave; a portare le osservabili al valore d&rsquo;equilibrio? La risposta candidata &egrave; l&rsquo;<b>ETH</b> (eigenstate thermalization hypothesis): l&rsquo;informazione termica &egrave; gi&agrave; scritta nei singoli autostati dell&rsquo;energia. La struttura di &laquo;vicinanza&raquo; e di &laquo;compattezza&raquo; che qui hai imparato in $\mathbb{R}^n$ &egrave; il primo mattone del linguaggio in cui quella domanda si formula &mdash; spazio degli stati, spettro, misura invariante, mescolamento.`
  }
]}

];

/* --- blocco PLOT: la figura non decora, si legge. Ogni plot porta una chiave di lettura. --- */
function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';
  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
    else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
    else if(b.t==='prolessi') m.appendChild(sectionProlessi(b));
    else if(b.t==='reveal')m.appendChild(sectionReveal(b.title,b.tag,b.steps));
    else if(b.t==='esercizio') m.appendChild(sectionEsercizio(b));
    else if(b.t==='collaudo')  m.appendChild(sectionCollaudo(b.title,b.items));
    else if(b.t==='plot')      m.appendChild(sectionPlot(b));
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}

/* deep-link: 00-topologia.html#04 apre direttamente la tappa 04 */
window.addEventListener('DOMContentLoaded', function(){
  var h=(location.hash||'').replace('#','');
  showTappa(byId[h]?h:'00');
});
window.addEventListener('hashchange', function(){
  var h=(location.hash||'').replace('#','');
  if(byId[h]) showTappa(h);
});
</script>
