<style>
  :root{
    --bg:#0e1117; --panel:#161b22; --panel2:#1c232d; --border:#2b333d;
    --txt:#eef3f8; --muted:#b9c4d1; --accent:#4c8dff; --accent2:#8fb0ff;
    --ok:#2ea043; --okbg:#10331b; --warn:#d8a13a; --warnbg:#332a10;
    --gram:#5eead4; --grambg:#0f2a26;
    --pro:#b98cff; --probg:#1a1430; --proline:#2a2247; --proedge:#3a2d5c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    font-size:17px;line-height:1.55;}
  a{color:var(--accent2);}
  .banner{background:var(--panel2);border-bottom:1px solid var(--border);color:var(--muted);
    font-size:.8rem;font-weight:600;text-align:center;padding:8px 12px;letter-spacing:.3px;}
  .banner b{color:var(--accent2);}
  .shell{display:flex;max-width:1180px;margin:0 auto;align-items:flex-start;}

  /* ---- SIDEBAR ---- */
  .sidebar{width:280px;flex:0 0 280px;padding:20px 12px 60px;position:sticky;top:0;
    max-height:100vh;overflow-y:auto;border-right:1px solid var(--border);}
  .sidebar h2{font-size:.72rem;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);
    margin:18px 8px 8px;}
  .navitem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:none;
    background:transparent;color:var(--txt);padding:9px 10px;border-radius:8px;cursor:pointer;
    font-size:.9rem;transition:.12s;border:1px solid transparent;}
  .navitem:hover{background:var(--panel2);}
  .navitem.active{background:#13233f;border-color:var(--accent);color:#fff;}
  .navitem .dot{width:7px;height:7px;border-radius:50%;background:transparent;flex:0 0 7px;
    border:1px solid var(--border);}
  .navitem.seen .dot{background:var(--ok);border-color:var(--ok);}
  .navitem .nx{color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto;}

  /* ---- MAIN ---- */
  .main{flex:1 1 auto;min-width:0;padding:24px 30px 90px;max-width:860px;}
  h1{font-size:1.5rem;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:.92rem;margin:0 0 18px;}
  .sfhead{border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:8px;}
  .sfhead h1{font-size:1.55rem;}
  .meta{color:var(--muted);font-size:.82rem;margin-top:6px;}

  .section{margin:26px 0;}
  .section > h3{font-size:1.02rem;color:var(--accent2);margin:0 0 10px;
    display:flex;align-items:center;gap:10px;}
  .section > h3 .tag{font-size:.66rem;font-weight:700;letter-spacing:.4px;background:var(--panel2);
    border:1px solid var(--border);color:var(--muted);padding:2px 8px;border-radius:20px;
    text-transform:uppercase;}
  /* --- blocchi figura --- */
  .section > h3 .tag.plottag{background:#101f2e;border-color:#1f3c57;color:#7ab8e0;}
  .plot-intro{color:var(--muted);font-size:.95rem;margin:0 0 12px;}
  .plot-row{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;
    background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;}
  .plot-row.due .plot-box{flex:1 1 300px;min-width:280px;}
  .plot-box{max-width:560px;}
  .plot-leggi{margin-top:10px;background:var(--panel2);border:1px solid var(--border);
    border-left:3px solid #4a8fc7;border-radius:0 10px 10px 0;padding:11px 14px;
    font-size:.93rem;color:var(--muted);}
  .plot-leggi b{color:#7ab8e0;}
  .plot-err{color:#ff6b6b;font-size:.85rem;}
  .open-body{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
  .open-body p:first-child{margin-top:0;} .open-body p:last-child{margin-bottom:0;}
  .open-body ul{margin:.4em 0;padding-left:1.2em;} .open-body li{margin:.35em 0;}

  .note{background:var(--panel2);border-left:3px solid var(--muted);border-radius:6px;
    padding:9px 12px;margin:12px 0;font-size:.9rem;color:var(--muted);}
  .note b{color:#ff9d6b;}
  .note.warn{background:var(--warnbg);border-left-color:var(--warn);color:#e0b85a;}
  .note.warn b{color:#f0c25a;}

  /* ---- GRAMMATICA ---- */
  .gramwrap{background:var(--grambg);border:1px solid #1f4d47;border-radius:12px;padding:6px 6px;}
  table.gramtab{border-collapse:collapse;width:100%;font-size:.92rem;}
  table.gramtab td{padding:9px 12px;vertical-align:top;border-bottom:1px solid #17332e;}
  table.gramtab tr:last-child td{border-bottom:none;}
  table.gramtab td.gs{white-space:nowrap;color:var(--gram);width:1%;
    border-right:1px solid #17332e;font-variant-numeric:tabular-nums;}
  .section > h3 .tag.gramtag{background:var(--grambg);border-color:#1f4d47;color:var(--gram);}

  /* ---- STRUMENTI (repertorio condiviso: la scheda si apre DENTRO la frase) ----
     Nessun accento nuovo: riusa il verde della grammatica, perche' uno strumento
     richiamato e' grammatica gia' spiegata altrove, non una quinta specie di blocco. */
  .str{color:var(--gram);border-bottom:1px dashed var(--gram);cursor:pointer;}
  .str:hover{background:var(--grambg);}
  .str::after{content:"\2666";font-size:.62em;vertical-align:.42em;margin-left:2px;opacity:.8;}
  .str.aperto::after{content:"\2715";}
  .str.rotto{color:#ff6b6b;border-bottom-color:#ff6b6b;cursor:help;}
  /* la scheda e' uno SPAN in display:block, non un div: i rimandi cadono dentro
     <p>, <li> e celle di tabella, dove un div e' HTML illegale. */
  .strcard{display:block;margin:10px 0;background:var(--grambg);border:1px solid #1f4d47;
    border-left:3px solid var(--gram);border-radius:0 10px 10px 0;padding:10px 14px;font-size:.9rem;}
  .strcard .sh{display:block;font-size:.66rem;font-weight:700;letter-spacing:.5px;
    text-transform:uppercase;color:var(--gram);margin-bottom:7px;}
  .strcard .sr{display:block;margin:5px 0;}
  .strcard .sk{color:var(--gram);font-weight:600;}

    margin-bottom:2px;} .pro-oggetto b{color:var(--txt);}
  table.protab{border-collapse:collapse;width:100%;font-size:.92rem;}
  table.protab td{padding:10px 12px;vertical-align:top;border-bottom:1px solid var(--proline);}
  table.protab tr:last-child td{border-bottom:none;}
  table.protab td.pd{white-space:nowrap;color:var(--pro);width:1%;font-weight:700;font-size:.78rem;
    letter-spacing:.3px;text-transform:uppercase;border-right:1px solid var(--proline);line-height:1.3;}
  .pro-domanda{margin:8px 8px 2px;background:#140d26;border:1px solid var(--proedge);

  .pro-domanda b{color:var(--pro);}
  .section > h3 .tag.protag{background:var(--probg);border-color:var(--proedge);color:var(--pro);}

  /* ---- REVEAL ---- */
  .rsteps{display:flex;flex-direction:column;gap:12px;}
  .rstep{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 18px;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .rlabel{font-size:.7rem;font-weight:700;letter-spacing:.4px;color:var(--accent);
    text-transform:uppercase;margin-bottom:8px;}
  .rstep p:first-of-type{margin-top:0;} .rstep p:last-child{margin-bottom:0;}
  .rstep ul{margin:.4em 0;padding-left:1.2em;}
  .testo{background:#13233f;border:1px solid #2b4877;border-radius:12px;padding:14px 18px;margin-bottom:14px;}
  .testo .src{display:block;font-size:.74rem;font-style:italic;color:var(--accent2);margin-bottom:8px;
    text-transform:uppercase;letter-spacing:.3px;}
  .esame-nota{font-size:.9rem;color:var(--muted);font-style:italic;margin-top:12px;padding-left:12px;
    border-left:3px solid var(--border);}

  .reveal-btn{background:var(--accent);color:#fff;border:none;padding:11px 18px;border-radius:10px;
    font-size:.95rem;font-weight:600;cursor:pointer;margin-top:14px;transition:.12s;}
  .reveal-btn:hover:not(:disabled){background:var(--accent2);}
  .reveal-btn.small{padding:7px 14px;font-size:.85rem;margin-top:0;background:var(--panel2);
    color:var(--accent2);border:1px solid var(--border);}
  .reveal-btn.small:hover:not(:disabled){border-color:var(--accent);}
  .reveal-btn:disabled,.reveal-btn.done{background:var(--panel2);color:var(--muted);
    border:1px solid var(--border);cursor:default;}

  /* ---- COLLAUDO ---- */
  .collaudo-item{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 18px;margin-bottom:12px;}
  .cq{margin-bottom:10px;}
  .ca{margin-top:12px;background:var(--okbg);border:1px solid #235c33;border-radius:8px;
    padding:10px 14px;font-size:.94rem;}
  .ca b{color:#5fd980;}

  /* ---- PREV / NEXT ---- */
  .prevnext{display:flex;justify-content:space-between;gap:12px;margin-top:40px;
    border-top:1px solid var(--border);padding-top:20px;}
  .pnbtn{flex:1 1 0;background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:12px 16px;cursor:pointer;color:var(--txt);text-align:left;transition:.14s;font:inherit;}
  .pnbtn:hover{border-color:var(--accent);background:var(--panel2);}
  .pnbtn.next{text-align:right;}
  .pnbtn .k{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .pnbtn .t{font-weight:600;color:var(--accent2);}
  .pnbtn:disabled{opacity:.35;cursor:default;border-color:var(--border);background:var(--panel);}

  code{background:var(--panel2);border:1px solid var(--border);border-radius:5px;
    padding:1px 5px;font-size:.85em;color:var(--accent2);}
  .katex{font-size:1.02em;color:var(--txt);} .katex-display{margin:.5em 0;overflow-x:auto;overflow-y:hidden;}

  @media(max-width:860px){
    .shell{flex-direction:column;}
    .sidebar{width:100%;flex:none;position:static;max-height:none;border-right:none;
      border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:4px;}
    .sidebar h2{width:100%;} .navitem{width:auto;}
    .main{padding:20px 16px 80px;}
  }
</style>

<script>
"use strict";
const R = String.raw;

function typeset(el){
  if(el && window.renderMathInElement){
    try{ renderMathInElement(el,{delimiters:[
      {left:'$$',right:'$$',display:true},
      {left:'$',right:'$',display:false}
    ],throwOnError:false}); }catch(e){}
  }
}
function elFromHTML(html){ var d=document.createElement('div'); d.innerHTML=html; return d; }

/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un
   rimando scritto nella prosa:

       <span class="str" data-str="serie-geometrica">la serie geometrica</span>

   Le schede citate da questo nucleo sono cucite qui sotto dal montaggio
   (assembla-nucleo.js): la pagina resta autosufficiente — niente fetch,
   niente sottocartelle da pubblicare — e un rimando a una scheda che non
   esiste FERMA la costruzione invece di arrivare in pagina rotto.
   Apertura: lo stesso gesto del collaudo (si clicca, il pannello compare,
   si typeset una volta sola), portato dentro la frase.
   =================================================================== */
var CORSO = 'meccanica-quantistica';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["spazio-di-hilbert"] = {"nome":"Spazio di Hilbert","riga":"E' uno spazio vettoriale complesso con prodotto interno, completo nella norma che ne deriva e separabile, cosicche' ogni stato si scrive come somma numerabile $|\\psi\\rangle=\\sum_n c_n|n\\rangle$ con $c_n=\\langle n|\\psi\\rangle$.","serve":"E' la casa degli stati, e le tre parole della definizione fanno tre lavori diversi. Il prodotto interno da' le ampiezze, e quindi le probabilita'. La completezza garantisce che il limite di una successione di stati sia ancora uno stato: senza, uno sviluppo in serie potrebbe convergere fuori dallo spazio. La separabilita' permette di scrivere un vettore con una lista numerabile di coefficienti, cioe' di fare i conti.","esempio":"La relazione di completezza $\\sum_n|n\\rangle\\langle n|=\\hat 1$ e' lo strumento operativo piu' usato della teoria: infilata dentro un prodotto scalare lo spezza in una somma. La norma diventa $\\langle\\psi|\\psi\\rangle=\\sum_n|c_n|^{2}$, e se lo stato e' normalizzato quella somma vale uno: i moduli quadri dei coefficienti sono probabilita', e sommano a uno per costruzione.","debito":"la costruzione di $L^{2}$ come completamento, la misura di Lebesgue che serve a definirlo e il teorema di Riesz-Fischer stanno nei movimenti di Metodi; qui si usa il risultato.","controllo":[{"tipo":"somma","espr":"(1/2)**n","var":"n","da":"1","a":"oo","vale":"1","ipotesi":{"n":"positive-integer"},"dove":"esempio","appare":"sommano a uno"},{"tipo":"simbolico","dove":"esempio","appare":"\\sum_n|n\\rangle\\langle n|=\\hat 1","perche":"e' la relazione di completezza: i proiettori sugli elementi di una base ortonormale sommano all'identita'. E' la proprieta' che definisce una base completa, non un conto"}],"qui":{},"pieno":null};
STRUM["trasformata-di-fourier"] = {"nome":"Trasformata di Fourier","riga":"L'operazione $\\hat f(k)=\\int f(x)\\,e^{-ikx}\\,dx$, che riscrive una funzione come sovrapposizione di onde piane e manda la derivata in una moltiplicazione per $ik$.","serve":"È lo strumento che rende ALGEBRICA un'equazione differenziale lineare a coefficienti costanti: con $\\partial_x$ che diventa $ik$, un'equazione differenziale in $x$ diventa un'equazione algebrica in $k$, si risolve, e si antitrasforma. Le due cose da non perdere sono la convenzione dei $2\\pi$, che cambia da testo a testo e va dichiarata una volta, e Plancherel, che dice che la trasformata conserva la norma $L^{2}$ — in fisica, l'energia.","esempio":"La gaussiana $f(x)=e^{-x^{2}/2}$ ha trasformata $\\int_{-\\infty}^{+\\infty}e^{-x^{2}/2}e^{-ikx}\\,dx=\\sqrt{2\\pi}\\,e^{-k^{2}/2}$: ancora una gaussiana, tanto più larga quanto l'originale è stretta. È il caso in cui si vede meglio il principio di indeterminazione come fatto puramente matematico.","pieno":{"file":"15-distribuzioni.html","tappa":"02","come":"le proprietà, la derivata che diventa un prodotto e Plancherel, nel nucleo delle distribuzioni"},"qui":{"elettromagnetismo":{"serve":"Serve appena si scrive un'onda generica invece di una monocromatica: ogni soluzione delle equazioni di Maxwell nel vuoto è una sovrapposizione di onde piane $e^{i(\\mathbf k\\cdot\\mathbf x-\\omega t)}$, e la trasformata è il modo di scomporla. Su ciascuna componente l'equazione delle onde si riduce alla relazione di dispersione, e la propagazione diventa un far girare fasi: ogni modo viaggia da solo, e nel vuoto tutti alla stessa velocità — per questo un impulso non si deforma.","esempio":"La sostituzione $\\partial_x\\to ik$ e $\\partial_t\\to-i\\omega$ manda le derivate seconde in $(ik)^{2}=-k^{2}$ e $(-i\\omega)^{2}=-\\omega^{2}$: l'equazione delle onde diventa $\\omega^{2}=c^{2}k^{2}$, cioè un'equazione di secondo grado al posto di una differenziale, e la sua radice positiva $\\omega=ck$ è la relazione di dispersione del vuoto."}},"controllo":[{"tipo":"integrale","espr":"exp(-x**2/2)*exp(-I*k*x)","var":"x","da":"-oo","a":"oo","vale":"sqrt(2*pi)*exp(-k**2/2)","ipotesi":{"k":"real"},"dove":"esempio","appare":"\\sqrt{2\\pi}\\,e^{-k^{2}/2}"},{"tipo":"uguale","sinistra":"(I*k)**2","vale":"-k**2","ipotesi":{"k":"real"},"dove":"qui.elettromagnetismo.esempio","appare":"-k^{2}"},{"tipo":"uguale","sinistra":"(-I*w)**2","vale":"-w**2","ipotesi":{"w":"real"},"dove":"qui.elettromagnetismo.esempio","appare":"-\\omega^{2}"},{"tipo":"uguale","sinistra":"(c*k)**2","vale":"c**2*k**2","dove":"qui.elettromagnetismo.esempio","appare":"c^{2}k^{2}"}]};
STRUM["integrale-gaussiano"] = {"nome":"Integrale gaussiano","riga":"$\\displaystyle\\int_{-\\infty}^{+\\infty} e^{-ax^{2}}\\,dx=\\sqrt{\\pi/a}$ per $a>0$, e $\\displaystyle\\int_{-\\infty}^{+\\infty} x^{2}e^{-ax^{2}}\\,dx=\\tfrac12\\sqrt{\\pi/a^{3}}$.","serve":"E' l'unico integrale che serve davvero sapere a memoria in meccanica statistica, perche' l'energia cinetica e' quadratica nell'impulso e quindi ogni integrazione sugli impulsi e' una gaussiana. Il trucco della dimostrazione — elevare al quadrato e passare in coordinate polari — vale la pena di vederlo una volta: e' il motivo per cui compare un $\\pi$ in una formula che di cerchi non parla.","esempio":"Da $I^{2}=\\iint e^{-a(x^{2}+y^{2})}dx\\,dy=2\\pi\\int_{0}^{\\infty}re^{-ar^{2}}dr=\\pi/a$ segue $I=\\sqrt{\\pi/a}$. I momenti superiori si ottengono derivando rispetto ad $a$ sotto il segno: $-\\partial_a I=\\int x^{2}e^{-ax^{2}}dx=\\tfrac12\\sqrt{\\pi}\\,a^{-3/2}$. Derivare rispetto a un parametro e' piu' rapido che integrare per parti, e funziona per tutti i momenti pari.","pieno":null,"qui":{"meccanica-statistica":{"serve":"La funzione di partizione di una particella libera e' un prodotto di tre gaussiane negli impulsi, e da li' esce la lunghezza d'onda termica $\\lambda=h/\\sqrt{2\\pi m k T}$ — che e' la grandezza con cui si misura quando un gas smette di essere classico.","esempio":"$\\int e^{-\\beta p^{2}/2m}dp=\\sqrt{2\\pi m/\\beta}$, quindi $Z_{1}=\\dfrac{V}{h^{3}}(2\\pi mkT)^{3/2}=V/\\lambda^{3}$. Lo stesso integrale col peso $p^{2}$ da' $\\langle p^{2}/2m\\rangle=\\tfrac12 kT$ per grado di liberta': l'equipartizione non e' un principio a parte, e' questo integrale."}}};

function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';
  return h;
}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

/* ===================================================================
   >>> CONTENUTO — Nucleo mq-10: La particella libera: onde piane improprie, pacchetti d’onda, il teorema di degenerazione <<<
   Modello dati: TAPPE[] ; ogni tappa ha blocchi[] con un tipo (t).
   Tipi: prosa | gram | reveal | esercizio | collaudo | prolessi | plot
   Tutta la matematica in R`...` (String.raw). Nelle formule si usano

  <p>I movimenti precedenti hanno costruito l&rsquo;apparato: lo spettro continuo e gli autostati impropri (mq-06), l&rsquo;hamiltoniana come generatore dell&rsquo;evoluzione (mq-08). Questo movimento prende il caso in cui quell&rsquo;apparato produce un numero, non solo una struttura — la particella libera, $H=P^{2}/2m$, è il problema più semplice che la meccanica quantistica sa porre, e proprio per questo è il primo posto in cui qualcosa di sorprendente si vede senza bisogno di nessuna approssimazione.</p>
  <p>Tre sorprese, in ordine di apparizione. La prima: l&rsquo;onda piana $e^{ikx}$, soluzione dell&rsquo;equazione di Schrödinger stazionaria, non rappresenta nessuno stato fisico — e la velocità con cui si propaga è la <i>metà</i> di quella che un conto classico assegnerebbe alla particella che dovrebbe descrivere. La seconda: impacchettando onde piane con la trasformata di Fourier si ottiene un oggetto normalizzabile, ma quell&rsquo;oggetto si allarga nel tempo anche se non c&rsquo;è nessuna forza — e si allarga per una ragione che non ha equivalente classico. La terza: il pacchetto gaussiano è l&rsquo;unico caso in cui tutto questo si scrive in forma chiusa, con un numero esplicito per ogni istante, e il numero si può controllare lungo tre strade indipendenti che devono dare la stessa risposta.</p>`},
  {t:'prosa', title:'Come è fatto il movimento', tag:'architettura', html:R`
  <p>La tappa 01 tratta l&rsquo;onda piana come autostato improprio: perché non è normalizzabile, perché il numero d&rsquo;onda deve essere reale, e il primo paradosso di velocità. La 02 costruisce il pacchetto con la trasformata di Fourier, sull&rsquo;esempio concreto di un impulso rettangolare. La 03 risolve il paradosso di velocità con la derivazione per fase stazionaria della velocità di gruppo. La 04 introduce il pacchetto gaussiano iniziale, l&rsquo;unico caso che si somma esattamente. La 05 lo evolve nel tempo in forma chiusa e ne misura l&rsquo;allargamento, confrontando due derivazioni indipendenti — Heisenberg e Schrödinger — che devono coincidere. La 06 costruisce il propagatore come funzione di Green e lo lega all&rsquo;azione classica. La 07 estende tutto a una forza costante, risolvendo un problema che uno dei testi del corso lascia esplicitamente come esercizio. La 08 è il mestiere, con la densità d&rsquo;esame più bassa del corso. La 09 tira il bilancio.</p>
  <p><b>Che cosa questo movimento non fa.</b> Non tratta lo scattering — l&rsquo;impulso che incontra un potenziale, si riflette, si trasmette — che è <code>mq-13</code> e usa questo movimento come prerequisito tecnico senza ripeterlo. Non tratta il moto in una buca o in una barriera, dove il programma introduce il teorema di <i>non</i> degenerazione: qui lo spettro è continuo e <i>doppiamente</i> degenere, ed è il contrario che serve per apprezzare il teorema dell&rsquo;altro caso. Non usa il metodo WKB né l&rsquo;approssimazione semiclassica: ogni risultato di questo movimento è esatto.</p>`}
]},

/* ---------------- 01 · L'ONDA PIANA COME AUTOSTATO IMPROPRIO ---------------- */
{ num:'01', title:'L’onda piana come autostato improprio, e il primo paradosso di velocità', meta:'non normalizzabile · perché k deve essere reale · il teorema di degenerazione · la velocità di fase è metà di quella classica',
  blocchi:[
  {t:'prosa', title:'La soluzione che non è uno stato', tag:'costruzione', html:R`
  <p>Per una particella libera in una dimensione l&rsquo;hamiltoniana è $H=P^{2}/2m$ e l&rsquo;equazione di Schrödinger indipendente dal tempo è $-\dfrac{\hbar^{2}}{2m}\psi''(x)=E\psi(x)$. Ha per $E>0$ le soluzioni $\psi_k(x)=e^{\pm ikx}$ con $k=\sqrt{2mE}/\hbar$, come si verifica per sostituzione diretta:</p>
  $$-\frac{\hbar^{2}}{2m}\frac{d^{2}}{dx^{2}}e^{ikx}=\frac{\hbar^{2}k^{2}}{2m}\,e^{ikx},\qquad -\frac{\hbar^{2}}{2m}\frac{d^{2}}{dx^{2}}e^{-ikx}=\frac{\hbar^{2}k^{2}}{2m}\,e^{-ikx}.$$
  <p>Sono le stesse funzioni dell&rsquo;autostato improprio dell&rsquo;impulso già incontrato in <span class="str" data-str="spazio-di-hilbert">mq-06</span>, e l&rsquo;autovalore si ritrova nello stesso modo:</p>
  $$-i\hbar\frac{d}{dx}e^{ikx}=\hbar k\,e^{ikx}.$$
  <p><b>Il primo fatto da registrare è che per ogni $E>0$ ci sono DUE soluzioni indipendenti</b>, $e^{+ikx}$ e $e^{-ikx}$ — il moto a destra e il moto a sinistra — ed è il <i>teorema di degenerazione</i> della voce Q.11: lo spettro della particella libera è continuo e ogni suo valore è doppiamente degenere. È il contrario esatto di ciò che accadrà nella buca e nella barriera, dove il programma introduce il teorema di <i>non</i> degenerazione per gli stati legati in una dimensione — lì la funzione deve annullarsi da entrambi i lati e quella condizione, non dimostrata qui, elimina la libertà di scegliere fra le due soluzioni.</p>
  <p>Il secondo fatto, più duro:</p>
  $$\int_{-\infty}^{+\infty}|e^{ikx}|^{2}\,dx=\int_{-\infty}^{+\infty}1\,dx=\infty.$$
  <p>L&rsquo;onda piana non sta nello spazio di Hilbert, esattamente come $|x'\rangle$ in mq-06, e Griffiths lo scrive senza addolcirlo: <i>«there is no such thing as a free particle with a definite energy»</i>. Non è un difetto da riparare: è il prezzo di avere uno spettro continuo, e il rimedio — normalizzare alla delta, $\langle k|k'\rangle=\delta(k-k')$ — è già stato costruito in mq-06 e qui si applica senza ripeterlo.</p>`},
  {t:'reveal', title:'Perché k deve essere reale, e non è un postulato', tag:'costruzione', steps:[
   {label:'Il problema: l’equazione non lo impone da sola', body:R`
   <p>L&rsquo;equazione di partenza ammette soluzioni $e^{ikx}$ per <i>qualunque</i> $k$ complesso, con $E=\hbar^{2}k^{2}/2m$ complesso a sua volta se $k$ lo è. Niente, nell&rsquo;equazione differenziale da sola, esclude un&rsquo;energia complessa. Serve un criterio esterno, e la domanda è quale.</p>
   <p>Ballentine la affronta con il formalismo dello spazio di Hilbert equipaggiato, lo stesso che mq-06 ha introdotto per $|x'\rangle$: un tripletto $\Omega\subset\mathcal H\subset\Omega^\times$, dove $\Omega$ è lo spazio delle funzioni di prova (che decadono più rapidamente di ogni potenza inversa), $\mathcal H$ è Hilbert, e $\Omega^\times$ è lo spazio esteso che accoglie gli autostati impropri — a condizione che $\langle\chi|\varphi\rangle=\int\chi^*\varphi\,d^3x$ sia ben definito per <i>ogni</i> $\varphi$ in $\Omega$.</p>`},
   {label:'Il criterio, e la conclusione', body:R`
   <p>Se $k$ ha una parte immaginaria non nulla, $e^{ikx}$ diverge esponenzialmente in una delle due direzioni di $x$ — e una funzione che diverge esponenzialmente non appartiene a $\Omega^\times$, perché il suo prodotto scalare con una $\varphi$ che decade come una potenza qualunque smette di essere definito per $|x|$ grande. Ballentine lo scrive in una riga: <i>«if any component of $k$ is not real, then $\Psi_k(x)$ will diverge exponentially at large distances for some directions of $x$... Such functions do not belong to $\Omega^\times$, and hence they are excluded»</i>. Dunque <b>$k$ deve essere reale</b>, e di conseguenza $E=\hbar^2k^2/2m\ge0$: l&rsquo;energia della particella libera non può essere negativa, non per un argomento di segno ma perché un&rsquo;energia negativa richiederebbe un $k$ immaginario, e un $k$ immaginario produce un oggetto che non sta da nessuna parte nel formalismo.</p>
   <p>È lo stesso tipo di argomento — selezionare lo spettro imponendo l&rsquo;appartenenza allo spazio giusto, non a Hilbert ma al suo allargamento — che mq-06 ha introdotto in generale. Qui lo si vede lavorare su un caso dove il risultato è verificabile a mano: nessun altro vincolo (continuità, derivabilità) esclude le energie negative, e questo le esclude.</p>`}
  ]},
  {t:'reveal', title:'Il paradosso della velocità, posto da Griffiths', tag:'costruzione', steps:[
   {label:'Le due velocità, e il conto che le confronta', body:R`
   <p>Un&rsquo;onda piana completa di dipendenza temporale, $e^{i(kx-\omega t)}$, si propaga con <i>velocità di fase</i> $v_{\rm fase}=\omega/k$ — la velocità con cui un punto di fase costante (una cresta) avanza. Si pone $\omega=E/\hbar$: con $E=\hbar^{2}k^{2}/2m$ questo dà $\omega=\hbar k^{2}/2m$, e dunque $v_{\rm fase}=\hbar k/2m$.</p>
   <p>La particella <i>classica</i> con la stessa energia $E=\tfrac12mv^{2}$ ha velocità $v_{\rm classica}=\sqrt{2E/m}=\hbar k/m$. Il confronto dà</p>
   $$v_{\rm classica}=2\,v_{\rm fase}.$$
   <p><b>L&rsquo;onda che dovrebbe rappresentare la particella viaggia alla metà della sua velocità</b>, e Griffiths lo chiama senza perifrasi un paradosso: <i>«apparently the quantum mechanical wave function travels at half the speed of the particle it is supposed to represent»</i>.</p>`},
   {label:'Perché non è ancora una contraddizione fisica', body:R`
   <p>La ragione per cui questo non rovescia la teoria è quella appena vista: $e^{ikx}$ non rappresenta <i>nessuna</i> particella fisica, perché non è normalizzabile. Il paradosso riguarda un oggetto matematico che non è uno stato, quindi non c&rsquo;è ancora, a questo punto, nessuna velocità osservabile da confrontare con quella classica. Ma la domanda resta istruttiva, perché quando si costruisce un oggetto <i>fisico</i> — un pacchetto, nella tappa 02 — bisogna sapere quale delle due velocità, se una delle due, sopravvive. La risposta arriva nella tappa 03, ed è che sopravvive una terza velocità, diversa da entrambe nel nome e identica a quella classica nel valore.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Se l&rsquo;onda piana non è uno stato fisico, perché vale la pena studiarla con questa cura?`,
    a:R`Perché è la base su cui si espande <i>ogni</i> stato fisico della particella libera — esattamente come $|x'\rangle$ non è uno stato ma serve a scrivere $|\psi\rangle=\int dx'\,\psi(x')|x'\rangle$. Un pacchetto d&rsquo;onda (tappa 02) è una sovrapposizione di onde piane pesata da un&rsquo;ampiezza $\phi(k)$ che decade a infinito, e la sovrapposizione normalizza anche se ciascun addendo non lo fa — la stessa logica con cui una somma di funzioni singolari può dare una funzione regolare. <i>Capire l&rsquo;onda piana è il prezzo per capire il pacchetto</i>, non un esercizio a parte.`},
   {q:R`Il teorema di degenerazione dice che per $E>0$ ci sono due soluzioni. Che cosa succederebbe se si imponesse $\psi(x)\to0$ per $x\to\pm\infty$, come nella buca di potenziale?`,
    a:R`Nessuna combinazione $Ae^{ikx}+Be^{-ikx}$ con $k$ reale e non nullo tende a zero in <i>entrambe</i> le direzioni — il modulo è periodico o costante, non decade. <b>La condizione di annullamento ai due estremi è incompatibile con lo spettro continuo</b>, e infatti nella buca di potenziale (dove quella condizione si impone) lo spettro è discreto. È la stessa tensione che genera il teorema di <i>non</i> degenerazione per gli stati legati: imporre due condizioni al contorno (una per ciascun estremo) su un&rsquo;equazione del secondo ordine lascia, generimente, una sola soluzione per energia — qui, con lo spettro continuo, quella condizione non si impone affatto, e la libertà di scegliere fra due soluzioni resta intera.`}
  ]}
]},

/* ---------------- 02 · IL PACCHETTO COME SOVRAPPOSIZIONE ---------------- */
{ num:'02', title:'Il pacchetto come sovrapposizione: la trasformata di Fourier, su un esempio che si risolve per intero', meta:'la soluzione generale come integrale su k · l’impulso rettangolare di Griffiths · il seno cardinale · normalizzazione per Plancherel',
  blocchi:[
  {t:'prosa', title:'Come si costruisce un oggetto fisico dalle onde improprie', tag:'costruzione', html:R`
  <p>La soluzione generale dell&rsquo;equazione di Schrödinger dipendente dal tempo per la particella libera è una sovrapposizione continua delle soluzioni separabili della tappa 01, cioè una <span class="str" data-str="trasformata-di-fourier">trasformata di Fourier</span>:</p>
  $$\Psi(x,t)=\frac{1}{\sqrt{2\pi}}\int_{-\infty}^{+\infty}\phi(k)\,e^{i(kx-\omega(k)t)}\,dk,\qquad \omega(k)=\frac{\hbar k^{2}}{2m}.$$
  <p>Al tempo iniziale questa è l&rsquo;inversa di una trasformata di Fourier ordinaria, $\Psi(x,0)=\tfrac{1}{\sqrt{2\pi}}\int\phi(k)e^{ikx}dk$, e $\phi(k)$ si ricava da $\Psi(x,0)$ per Plancherel: $\phi(k)=\tfrac{1}{\sqrt{2\pi}}\int\Psi(x,0)e^{-ikx}dx$. A differenza della singola onda piana, $\Psi(x,0)$ <i>può</i> essere normalizzabile — e lo è, per $\phi(k)$ sufficientemente regolare — perché ora l&rsquo;integrale è su un continuo di onde con fasi relative che interferiscono, e l&rsquo;interferenza è ciò che permette la localizzazione.</p>`},
  {t:'reveal', title:'Un esempio che si fa fino in fondo: l’impulso rettangolare', tag:'costruzione', steps:[
   {label:'Il problema, e la normalizzazione', body:R`
   <p>Si parta, come fa Griffiths nell&rsquo;Example 2.6, da un pacchetto iniziale rettangolare:</p>
   $$\Psi(x,0)=\begin{cases}A,&-a<x<a\\0,&\text{altrimenti.}\end{cases}$$
   <p>La normalizzazione $\int|\Psi(x,0)|^{2}dx=1$ dà $|A|^{2}\cdot2a=1$, dunque $A=1/\sqrt{2a}$.</p>`},
   {label:'La trasformata, e il seno cardinale', body:R`
   <p>Con $A=1/\sqrt{2a}$:</p>
   $$\phi(k)=\frac{1}{\sqrt{2\pi}}\int_{-a}^{a}\frac{1}{\sqrt{2a}}\,e^{-ikx}\,dx=\frac{\sin(ka)}{k\sqrt{\pi a}}.$$
   <p>Si tratta di un conto elementare — l&rsquo;integrale di $e^{-ikx}$ su un intervallo finito dà $2\sin(ka)/k$, e i fattori di normalizzazione si combinano in $1/\sqrt{\pi a}$ — ma il risultato vale la lettura: $\phi(k)$ <b>non</b> è un impulso rettangolare nello spazio dei momenti; è un seno cardinale, con lobi laterali che non si annullano mai del tutto. Non esiste un modo di localizzare esattamente la posizione senza produrre codine nel momento, e viceversa — è la prima comparsa concreta, su un caso che si calcola a mano, del principio di indeterminazione.</p>`},
   {label:'Il controllo che chiude il conto', body:R`
   <p>Il teorema di Plancherel garantisce che la norma si conservi passando da $x$ a $k$:</p>
   $$\int_{-\infty}^{+\infty}|\Psi(x,0)|^{2}\,dx=1\qquad	ext{e}\qquad\int_{-\infty}^{+\infty}|\phi(k)|^{2}\,dk=1.$$
   <p>Il primo vale per costruzione; il secondo — su $\phi(k)=\sin(ka)/(k\sqrt{\pi a})$, un integrale improprio con un integrando che non ha singolarità reali ma non è ovvio a vista — è il controllo che la trasformata è stata fatta bene, ed è indipendente dalla costruzione: <i>se fosse sbagliato un fattore di normalizzazione in $\phi(k)$, questo integrale non darebbe $1$</i>.</p>`}
  ]},
  {t:'plot', title:'Il pacchetto e il suo spettro: localizzare l’uno allarga l’altro',
   intro:R`<p>A sinistra $\Psi(x,0)$ per due valori di $a$ (stretto e largo); a destra il corrispondente $\phi(k)=\sin(ka)/(k\sqrt{\pi a})$. Si noti la scala: l&rsquo;impulso stretto in $x$ ha uno spettro largo in $k$, e viceversa.</p>`,
   plots:[{kind:'func2d', xr:[-4,4], yr:[0,0.9], height:260, ticks:true,
     title:'Psi(x,0) per a=0.5 (stretto) e a=2 (largo)',
     curves:[{f:'(Math.abs(x)<0.5)?(1/Math.sqrt(1)):0', col:'#5aa9ff', width:2.4, label:'a = 0.5'},
             {f:'(Math.abs(x)<2)?(1/Math.sqrt(4)):0', col:'#ff6b8a', width:2.4, label:'a = 2'}],
     xlabel:'x', ylabel:'Psi(x,0)'},
    {kind:'func2d', xr:[-8,8], yr:[-0.3,1.1], height:260, ticks:true,
     title:'phi(k) per gli stessi due valori di a',
     curves:[{f:'(Math.abs(x)<1e-6)?(0.5/Math.sqrt(Math.PI*0.5)):(Math.sin(x*0.5)/(x*Math.sqrt(Math.PI*0.5)))', col:'#5aa9ff', width:2.4, label:'a = 0.5: spettro largo'},
             {f:'(Math.abs(x)<1e-6)?(2/Math.sqrt(Math.PI*2)):(Math.sin(x*2)/(x*Math.sqrt(Math.PI*2)))', col:'#ff6b8a', width:2.4, label:'a = 2: spettro stretto'}],
     xlabel:'k', ylabel:'phi(k)'}],
   leggi:R`<p><b>Che cosa guardare.</b> La curva blu, stretta in $x$ ($a=0{,}5$), ha lo spettro blu <i>largo</i> in $k$ — i primi zeri di $\sin(ka)/k$ cadono a $k=\pm\pi/a$, cioè a $k=\pm2\pi$, fuori dalla finestra più stretta della curva rosa. La curva rosa, larga in $x$ ($a=2$), ha lo spettro stretto, con i primi zeri già a $k=\pm\pi/2$. <b>Il prodotto delle due larghezze è costante</b>: è la stessa relazione, vista su un caso esplicito, che nella tappa seguente limita quanto si possa dire «la particella ha questo momento».</p>
   <p><b>Che cosa impararne.</b> Nessuna delle due curve a destra ha un massimo unico e ben separato: sono entrambe oscillanti, con lobi secondari che non si annullano mai esattamente. Quando nella tappa 04 si passerà alla gaussiana, questo sarà il motivo della scelta: la gaussiana è la forma che rende questo compromesso <i>il migliore possibile</i>, senza lobi secondari, e per questo si userà per ogni conto quantitativo successivo.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Perché $\phi(k)$ per l&rsquo;impulso rettangolare non si annulla mai esattamente lontano da $k=0$, mentre $\Psi(x,0)$ è esattamente zero fuori da $(-a,a)$?`,
    a:R`Perché una funzione a <b>supporto compatto</b> (nulla fuori da un intervallo finito) non può avere una trasformata di Fourier a supporto compatto, a meno che non sia identicamente nulla — è un fatto generale di analisi di Fourier, collegato al principio di indeterminazione: tagliare bruscamente $\Psi$ nello spazio reale introduce componenti a <i>tutte</i> le frequenze nello spazio dei momenti, con ampiezza che decresce come $1/k$ ma non si azzera mai. <i>È il prezzo della discontinuità</i>: un pacchetto che si annulla con dolcezza, come la gaussiana, ha una trasformata che decade più rapidamente — ma mai a supporto compatto in entrambi gli spazi simultaneamente, per lo stesso teorema.`}
  ]}
]},

/* ---------------- 03 · LA VELOCITA' DI GRUPPO ---------------- */
{ num:'03', title:'La velocità di gruppo: la fase stazionaria, e la soluzione del paradosso della tappa 01', meta:'perché basta sapere il centro, non ogni onda · la derivazione per fase stazionaria · v-gruppo uguale due volte v-fase · un controllo su un’altra onda',
  blocchi:[
  {t:'prosa', title:'Che velocità ha un pacchetto, se non ne ha una sola?', tag:'costruzione', html:R`
  <p>Un pacchetto $\Psi(x,t)=\tfrac1{\sqrt{2\pi}}\int\phi(k)e^{i(kx-\omega(k)t)}dk$ non ha una singola velocità, perché ogni $k$ nella sovrapposizione si propaga con la sua $v_{\rm fase}(k)=\omega(k)/k$ — che per la particella libera dipende da $k$. Griffiths lo chiama un pacchetto di &laquo;increspature&raquo; dentro un &laquo;involucro&raquo;: le increspature viaggiano alla velocità di fase, ma la forma dell&rsquo;involucro — ciò che un osservatore misurerebbe come &laquo;dove è la particella&raquo; — si muove a una velocità diversa, la <b>velocità di gruppo</b>. La domanda di questa tappa è trovarla.</p>`},
  {t:'reveal', title:'La derivazione per fase stazionaria', tag:'costruzione', steps:[
   {label:'L’approssimazione che rende il problema trattabile', body:R`
   <p>Si assuma $\phi(k)$ piccata attorno a un valore $k_0$ — è l&rsquo;ipotesi che rende sensato parlare di &laquo;un gruppo&raquo; con una velocità, e la stessa Griffiths segnala che senza di essa un pacchetto largo in $k$ cambia forma troppo in fretta per avere una velocità ben definita. Si sviluppa $\omega(k)$ al primo ordine attorno a $k_0$:</p>
   $$\omega(k)\approx\omega(k_0)+\omega'(k_0)\,(k-k_0).$$
   <p>Cambiando variabile $s=k-k_0$ e raccogliendo le fasi che non dipendono da $s$:</p>
   $$\Psi(x,t)=\frac{e^{i[k_0x-\omega(k_0)t]}}{\sqrt{2\pi}}\int\phi(k_0+s)\,e^{is[x-\omega'(k_0)t]}\,ds.$$`},
   {label:'Il risultato: tutto dipende da x meno v·t', body:R`
   <p>L&rsquo;integrale a destra è una funzione della sola combinazione $x-\omega'(k_0)t$ — esattamente la stessa funzione che compariva in $\Psi(x,0)$ con $x$ al posto di $x-\omega'(k_0)t$. Dunque, a parte il fattore di fase davanti (che non cambia $|\Psi|^{2}$):</p>
   $$\Psi(x,t)=e^{i[\ldots]}\,\Psi\big(x-\omega'(k_0)t,\,0\big).$$
   <p><b>L&rsquo;involucro si muove rigidamente alla velocità</b></p>
   $$v_{\rm gruppo}=\omega'(k_0)=\frac{d\omega}{dk}\bigg|_{k_0},$$
   <p>da contrapporre a $v_{\rm fase}=\omega/k$. Per la particella libera, $\omega=\hbar k^{2}/2m$, dunque $v_{\rm fase}=\hbar k/2m$ e $v_{\rm gruppo}=d\omega/dk=\hbar k/m$: </p>
   $$v_{\rm gruppo}=2\,v_{\rm fase}=v_{\rm classica}.$$
   <p><b>Il paradosso della tappa 01 è chiuso</b>: non è la velocità di fase a descrivere il moto della particella, è quella di gruppo — ed è esattamente la velocità classica $p/m$. Nessuna delle due onde componenti si muove alla velocità giusta; il pacchetto, come oggetto, sì.</p>`}
  ]},
  {t:'plot', title:'Fase e gruppo, viste insieme',
   intro:R`<p>A sinistra, $v_{\rm fase}(k)=\hbar k/2m$ e $v_{\rm gruppo}(k)=\hbar k/m$ per la particella libera: due rette dall&rsquo;origine, la seconda con pendenza doppia. A destra, lo stesso confronto per le onde sull&rsquo;acqua profonda, $\omega=\sqrt{gk}$, dove il rapporto è l&rsquo;opposto — $v_{\rm gruppo}=\tfrac12 v_{\rm fase}$ — ed è l&rsquo;effetto che si vede gettando un sasso in uno stagno: l&rsquo;increspatura singola supera il fronte del gruppo e si spegne in testa.</p>`,
   plots:[{kind:'func2d', xr:[0,3], yr:[0,3], height:260, ticks:true,
     title:'particella libera: v_gruppo = 2 v_fase',
     curves:[{f:'x', col:'#ff6b8a', width:2.4, label:'v gruppo = hbar k / m (unita naturali)'},
             {f:'0.5*x', col:'#5aa9ff', width:2.4, label:'v fase = hbar k / 2m'}],
     xlabel:'k', ylabel:'velocita'},
    {kind:'func2d', xr:[0.2,3], yr:[0,2.4], height:260, ticks:true,
     title:'onde sull acqua profonda: v_gruppo = v_fase / 2',
     curves:[{f:'Math.sqrt(1/x)', col:'#5aa9ff', width:2.4, label:'v fase = sqrt(g/k)'},
             {f:'0.5*Math.sqrt(1/x)', col:'#ff6b8a', width:2.4, label:'v gruppo = (1/2) sqrt(g/k)'}],
     xlabel:'k', ylabel:'velocita'}],
   leggi:R`<p><b>Che cosa guardare.</b> Nel riquadro di sinistra la velocità di gruppo (rosa) sta sempre sopra quella di fase (blu), con un rapporto costante $2$: è il caso quantistico, dispersione $\omega\propto k^{2}$. Nel riquadro di destra è l&rsquo;opposto — la fase (blu) sta sempre sopra il gruppo (rosa) — perché la dispersione è $\omega\propto\sqrt k$, e la derivata di una radice cala più lentamente del rapporto stesso.</p>
   <p><b>Che cosa impararne.</b> La formula $v_{\rm gruppo}=d\omega/dk$ non sa nulla di meccanica quantistica: è un fatto di propagazione ondulatoria, lo stesso per l&rsquo;acqua e per un pacchetto di Schrödinger. <b>Ciò che è specificamente quantistico è la dispersione $\omega=\hbar k^{2}/2m$</b>, che viene dalla relazione $E=\hbar\omega$, $p=\hbar k$ applicata a $E=p^{2}/2m$: è quella relazione — non la formula della velocità di gruppo — a garantire che $v_{\rm gruppo}$ coincida con la velocità classica. Per un&rsquo;altra relazione di dispersione (fotoni, onde sull&rsquo;acqua) il gruppo non ha nessuna ragione di coincidere con niente di classico.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Lo sviluppo di Taylor di $\omega(k)$ si è fermato al primo ordine. Che cosa succede al pacchetto se si tiene anche il secondo ordine?`,
    a:R`Il secondo ordine, $\tfrac12\omega''(k_0)s^{2}t$, introduce una fase che <b>dipende da $s$ in modo non lineare</b>, e quindi non si può più raccogliere come un semplice spostamento di $x$: il pacchetto non trasla più rigidamente, cambia <i>forma</i> mentre si sposta. Per la particella libera $\omega(k)=\hbar k^{2}/2m$ è <i>esattamente</i> quadratica, quindi lo sviluppo di Taylor al secondo ordine è l&rsquo;intera funzione — non c&rsquo;è un terzo ordine da trascurare — e il termine $\omega''=\hbar/m$ non è un errore dell&rsquo;approssimazione: <i>è</i> l&rsquo;allargamento del pacchetto, che si vedrà in forma esplicita nella tappa 05. L&rsquo;approssimazione al primo ordine dà la posizione del centro; il secondo ordine, esatto qui, dà la sua larghezza.`}
  ]}
]},

/* ---------------- 04 · IL PACCHETTO GAUSSIANO ---------------- */
{ num:'04', title:'Il pacchetto gaussiano: l’unica forma che si somma esattamente', meta:'perché la gaussiana e non un’altra forma · la trasformata di una gaussiana è una gaussiana · la correzione di un errore di stampa trovato controllando',
  blocchi:[
  {t:'prosa', title:'Perché questa forma, e non un’altra', tag:'costruzione', html:R`
  <p>L&rsquo;impulso rettangolare della tappa 02 ha il pregio di calcolarsi a mano, ma il seno cardinale che produce oscilla all&rsquo;infinito e rende ogni conto successivo (l&rsquo;evoluzione temporale, l&rsquo;allargamento) un integrale senza forma chiusa. <b>La forma gaussiana è l&rsquo;unica, fra tutte le forme di pacchetto, la cui trasformata di Fourier è ancora una gaussiana</b> — una proprietà che nessun&rsquo;altra funzione condivide, e che è la ragione tecnica per cui ogni libro di testo, arrivato a questo punto, passa alla gaussiana. È anche lo stato che satura la relazione di indeterminazione, già vista in mq-05: non è solo comoda, è <i>estremale</i>.</p>
  <p>Si prenda come stato iniziale</p>
  $$\Psi(x,0)=\big(2\pi a^{2}\big)^{-1/4}\,e^{-x^{2}/4a^{2}}$$
  <p>con $a$ reale e positivo. Il modulo quadrato è $|\Psi(x,0)|^{2}=(2\pi a^{2})^{-1/2}e^{-x^{2}/2a^{2}}$, una gaussiana di deviazione standard $a$: dunque $\Delta x(0)=a$.</p>`},
  {t:'reveal', title:'La trasformata, e un errore di stampa che il controllo scopre', tag:'costruzione', steps:[
   {label:'Il calcolo con l’integrale gaussiano', body:R`
   <p>Si applica la trasformata, completando il quadrato nell&rsquo;esponente — è l&rsquo;unico strumento che serve, lo stesso dell&rsquo;<span class="str" data-str="integrale-gaussiano">integrale gaussiano</span> $\int e^{-\alpha y^{2}}dy=\sqrt{\pi/\alpha}$:</p>
   $$\Phi(k,0)=\frac{1}{\sqrt{2\pi}}\int(2\pi a^{2})^{-1/4}e^{-x^{2}/4a^{2}}e^{-ikx}\,dx=\Big(\frac{2a^{2}}{\pi}\Big)^{1/4}e^{-a^{2}k^{2}}.$$
   <p>Lo si verifica allo stesso modo in cui si è verificata la normalizzazione nella tappa 02:</p>
   $$\int_{-\infty}^{+\infty}|\Phi(k,0)|^{2}\,dk=1,$$
   <p>ed è il controllo che la costante davanti è quella giusta.</p>`},
   {label:'L’errore trovato, e perché vale la pena dirlo', body:R`
   <p>Nel dossier di questo movimento Ballentine riporta la stessa formula con l&rsquo;esponente della costante scritto $-1/4$ invece di $+1/4$: un segno che, controllato, <b>non integra a $1$</b> — la costante $(2a^{2}/\pi)^{-1/4}$, elevata al quadrato e moltiplicata per $\int e^{-2a^{2}k^{2}}dk=\sqrt{\pi/2a^{2}}$, dà $\pi/2a^{2}$ e non $1$. È quasi certamente un artefatto della scansione del testo (un segno meno che una OCR ha scambiato), non un errore del libro — ma è esattamente il tipo di cosa che <i>«sembra giusto»</i> e non lo è, ed è la ragione per cui questo movimento non copia la formula dal dossier: la ricalcola, la verifica, e scrive quella verificata. La costante giusta, $(2a^{2}/\pi)^{+1/4}$, è quella usata sopra e in tutto il resto del movimento.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Si confronti $\Delta x(0)\,\Delta k(0)$ per questa gaussiana con la soglia di Heisenberg. È saturata?`,
    a:R`$\Delta x(0)=a$ per costruzione. Da $\Phi(k,0)\propto e^{-a^{2}k^{2}}$, che è una gaussiana di varianza $1/4a^{2}$ nella variabile $k$, si ha $\Delta k(0)=1/2a$, dunque $\Delta p(0)=\hbar\Delta k(0)=\hbar/2a$. Il prodotto è $\Delta x(0)\Delta p(0)=\hbar/2$: <b>è esattamente il minimo</b> ammesso dalla relazione di indeterminazione, $\Delta x\Delta p\ge\hbar/2$. <i>È la ragione profonda per cui la gaussiana è l&rsquo;unica forma la cui trasformata è ancora gaussiana</i>: le due proprietà — autotrasformabilità e saturazione del minimo — sono la stessa proprietà vista da due lati, ed è un fatto generale della trasformata di Fourier che compare già in mq-05.`}
  ]}
]},

/* ---------------- 05 · L'ALLARGAMENTO ---------------- */
{ num:'05', title:'L’evoluzione in forma chiusa, e l’allargamento: due derivazioni indipendenti, lo stesso numero', meta:'completare il quadrato nel tempo · Heisenberg contro Schrödinger · il tempo caratteristico · tre esempi numerici, con h e non con hbar',
  blocchi:[
  {t:'prosa', title:'Il problema: seguire il pacchetto nel tempo', tag:'costruzione', html:R`
  <p>In rappresentazione degli impulsi l&rsquo;equazione di Schrödinger per la particella libera è banale — è un&rsquo;equazione del primo ordine in $t$ senza derivate in $k$, perché $H$ è diagonale sugli autostati dell&rsquo;impulso:</p>
  $$i\hbar\,\partial_t\Phi(k,t)=\frac{\hbar^{2}k^{2}}{2m}\,\Phi(k,t)\quad\Longrightarrow\quad\Phi(k,t)=\Phi(k,0)\,e^{-i\hbar k^{2}t/2m}.$$
  <p>È il metodo di Ballentine — risolvere nella rappresentazione in cui $H$ è diagonale, poi tornare in $x$ con una trasformata inversa — e qui si chiude per intero con la gaussiana della tappa 04.</p>`},
  {t:'reveal', title:'La forma chiusa, completando il quadrato una seconda volta', tag:'costruzione', steps:[
   {label:'L’integrale, e il risultato', body:R`
   <p>$\Phi(k,t)=(2a^{2}/\pi)^{1/4}e^{-a^{2}k^{2}}e^{-i\hbar k^{2}t/2m}=(2a^{2}/\pi)^{1/4}e^{-\beta(t)k^{2}}$ con $\beta(t)=a^{2}+i\hbar t/2m$: è di nuovo una gaussiana in $k$, solo con un parametro complesso al posto di $a^{2}$. Trasformando indietro con lo stesso <span class="str" data-str="integrale-gaussiano">integrale gaussiano</span> della tappa precedente:</p>
   $$\Psi(x,t)=\frac{(2\pi)^{-1/4}}{\sqrt a}\Big(1+\frac{i\hbar t}{2ma^{2}}\Big)^{-1/2}\exp\!\Big[-\frac{x^{2}}{4a^{2}\big(1+i\hbar t/2ma^{2}\big)}\Big].$$
   <p>Si tratta ancora di una gaussiana in $x$, ma con &laquo;larghezza&raquo; complessa — e il modo giusto di leggerla è verificarla come soluzione, non fidarsi del conto.</p>`},
   {label:'Il controllo che prova la forma, senza rifare l’integrale', body:R`
   <p>Invece di ripetere l&rsquo;integrale di completamento del quadrato — un conto lungo e facile da insidiare con un segno — si verifica che l&rsquo;espressione scritta <b>soddisfa l&rsquo;equazione di Schrödinger libera</b> $i\hbar\,\partial_t\Psi=-\dfrac{\hbar^{2}}{2m}\partial_x^{2}\Psi$ e che a $t=0$ si riduce alla gaussiana di partenza. Le due condizioni insieme — l&rsquo;equazione e il dato iniziale — determinano la soluzione in modo <i>unico</i> (l&rsquo;equazione è del primo ordine nel tempo), quindi provarle è una dimostrazione completa, non un controllo parziale: se la formula le soddisfa entrambe, è la soluzione, punto.</p>`}
  ]},
  {t:'reveal', title:'L’allargamento, e due vie indipendenti che devono coincidere', tag:'costruzione', steps:[
   {label:'Prima via: direttamente dal modulo quadrato', body:R`
   <p>Da $\Psi(x,t)$ si legge $|\Psi(x,t)|^{2}=\big(2\pi\sigma(t)^{2}\big)^{-1/2}e^{-x^{2}/2\sigma(t)^{2}}$ con</p>
   $$\sigma(t)^{2}=a^{2}\Big[1+\Big(\frac{\hbar t}{2ma^{2}}\Big)^{2}\Big],\qquad\text{cioè}\qquad \Delta x(t)=a\sqrt{1+\Big(\frac{\hbar t}{2ma^{2}}\Big)^{2}}.$$
   <p>Per $t$ piccolo, $\Delta x(t)\approx a$: il pacchetto non si allarga subito. Per $t$ grande, $\Delta x(t)\approx\dfrac{\hbar t}{2ma}=\dfrac{\Delta p(0)}{m}\,t$ — l&rsquo;allargamento diventa lineare in $t$, con velocità data dall&rsquo;incertezza <i>iniziale</i> sull&rsquo;impulso.</p>`},
   {label:'Seconda via: l’argomento di Heisenberg, indipendente dalla gaussiana', body:R`
   <p>Sakurai-Napolitano calcola la stessa quantità in rappresentazione di Heisenberg, dove $P$ è costante del moto e $X(t)=X(0)+Pt/m$ — un&rsquo;equazione <i>operatoriale</i>, vera per qualunque stato iniziale, non solo per la gaussiana:</p>
   $$\overline{\Delta x(t)^{2}}=\Delta x(0)^{2}+\frac{1}{m}\big\langle XP+PX-2\langle X\rangle\langle P\rangle\big\rangle\,t+\frac{\Delta p(0)^{2}}{m^{2}}\,t^{2}.$$
   <p>È un polinomio di secondo grado in $t$, a coefficienti che sono tutti valori di aspettazione sullo stato <i>iniziale</i> — nessuna integrazione, nessuna trasformata, solo l&rsquo;algebra di $X(t)=X(0)+Pt/m$. Per la gaussiana della tappa 04 il termine misto si annulla (è uno stato reale e centrato), e resta $\overline{\Delta x(t)^{2}}=a^{2}+\Delta p(0)^{2}t^{2}/m^{2}=a^{2}+\hbar^{2}t^{2}/4m^{2}a^{2}$ — <b>lo stesso polinomio</b> ottenuto sopra dalla forma chiusa, scritto in un altro ordine. Due derivazioni che non condividono nessun passaggio tecnico — una integra una gaussiana complessa, l&rsquo;altra usa solo $[X,P]=i\hbar$ — e arrivano alla stessa formula: è il tipo di coincidenza che vale la pena de dichiarare, perché se una delle due avesse un errore l&rsquo;altra non lo nasconderebbe.</p>`}
  ]},
  {t:'plot', title:'Il pacchetto che si allarga, a tre istanti',
   intro:R`<p>$|\Psi(x,t)|^{2}$ per $a=1$, $\hbar/m=1$ (unità naturali), a $t=0$, $t=2$, $t=6$. L&rsquo;area sotto ciascuna curva resta $1$: il pacchetto non perde probabilità, solo la distribuisce su una regione più larga.</p>`,
   plots:[{kind:'func2d', xr:[-8,8], yr:[0,0.42], height:280, ticks:true,
     title:'modulo quadrato del pacchetto gaussiano, a tre tempi',
     curves:[{f:'(1/Math.sqrt(2*Math.PI*1))*Math.exp(-x*x/2)', col:'#5aa9ff', width:2.6, label:'t = 0, sigma = 1'},
             {f:'(1/Math.sqrt(2*Math.PI*2))*Math.exp(-x*x/4)', col:'#6bdc9b', width:2.4, label:'t = 2, sigma = sqrt(2)'},
             {f:'(1/Math.sqrt(2*Math.PI*10))*Math.exp(-x*x/20)', col:'#ff6b8a', width:2.4, label:'t = 6, sigma = sqrt(10)'}],
     xlabel:'x', ylabel:'densita di probabilita'}],
   leggi:R`<p><b>Che cosa guardare.</b> Il massimo della curva cala mentre la base si allarga — è la normalizzazione a tenere l&rsquo;area costante, non un&rsquo;ipotesi aggiunta. A $t=0$ il massimo vale $1/\sqrt{2\pi}\approx0{,}399$; a $t=6$, con $\sigma=\sqrt{10}$, vale $1/\sqrt{20\pi}\approx0{,}126$ — un fattore $\sqrt{10}$ più basso, esattamente l&rsquo;inverso del fattore con cui $\sigma$ è crescuto.</p>
   <p><b>Che cosa impararne.</b> Non c&rsquo;è nessuna forza in gioco: l&rsquo;hamiltoniana è $P^{2}/2m$ e basta. L&rsquo;allargamento è un effetto puramente cinematico, della stessa natura della diffrazione di un&rsquo;onda che passa per una fenditura — ed è infatti la stessa formula, come osserva Picasso: uno stato a $\Delta x$ fissato porta necessariamente $\Delta p\ge\hbar/2\Delta x$, e quel $\Delta p$, per quanto piccolo, propaga le diverse componenti a velocità leggermente diverse, spalmando la posizione nel tempo.</p>`},
  {t:'prosa', title:'Il tempo caratteristico, e tre numeri che danno la misura fisica', tag:'esame', html:R`
  <p>Si definisce il tempo caratteristico di allargamento come il $t$ per cui il termine quadratico eguaglia quello costante: $\hbar t_0/2ma^{2}\sim1$, cioè $t_0\sim 2ma^{2}/\hbar$. Per $t\ll t_0$ il pacchetto è ancora, in pratica, quello iniziale; per $t\gg t_0$ si allarga linearmente con velocità $\hbar/2ma=\Delta p(0)/m$.</p>
  <p>Picasso dà la misura fisica con tre esempi, e usa $h=2\pi\hbar$ — non $\hbar$ — nella stima $h/(m\,\Delta q)$: è una scelta di comodo per avere numeri rotondi, e va notata altrimenti il conto non torna.</p>
  <ul>
   <li><b>Un elettrone libero con $\Delta q\simeq1\,\text{\AA}$</b> (la scala atomica): $h/(m\Delta q)\simeq7{,}3\times10^{8}\,\text{cm/s}$ — dell&rsquo;ordine di $10^{9}\,\text{cm/s}$, cioè una frazione apprezzabile della velocità della luce. <i>Un elettrone legato in un atomo si allargherebbe a velocità relativistiche se non fosse legato</i>: il risultato parla da solo.</li>
   <li><b>Un elettrone focalizzato a $\Delta q\simeq10^{-2}\,\text{cm}$</b> (un tubo a raggi catodici o un microscopio elettronico): $h/(m\Delta q)\simeq7{,}3\times10^{2}\,\text{cm/s}$ — piccolo, ma non trascurabile su un percorso di metri.</li>
   <li><b>Un granello di polvere, $M\simeq10^{-12}\,\text{g}$, $\Delta q\simeq10^{-5}\,\text{cm}$</b>: $h/(M\Delta q)\simeq6{,}6\times10^{-10}\,\text{cm/s}$ — del tutto inosservabile, perché la massa macroscopica schiaccia il rapporto $\hbar/m$.</li>
  </ul>
  <p>Shankar fissa la stessa idea con un esempio ancora più netto: una particella macroscopica di <b>un grammo</b>, localizzata alla precisione di una larghezza di protone ($\Delta x\simeq10^{-13}\,\text{cm}$), avrebbe $\Delta v\simeq\hbar/(m\Delta x)$ — e il tempo perché $\Delta x(t)$ cresca di un millimetro è, nei suoi numeri, <i>«over 300,000 years»</i>. <b>È la ragione quantitativa per cui un oggetto macroscopico si tratta classicamente senza bisogno di nessun postulato in più</b>: l&rsquo;allargamento quantistico esiste sempre, ma per $m$ grande e $\Delta x$ non assurdamente piccolo è irrilevante su ogni scala di tempo umana.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Le due derivazioni dell’allargamento — Schrödinger (la gaussiana esplicita) e Heisenberg (l’operatore $X(t)=X(0)+Pt/m$) — usano ingredienti diversi. Quale delle due vale per uno stato iniziale NON gaussiano?`,
    a:R`<b>Solo quella di Heisenberg.</b> La formula $\overline{\Delta x(t)^{2}}=\Delta x(0)^{2}+\tfrac1m\langle XP+PX-2\langle X\rangle\langle P\rangle\rangle t+\Delta p(0)^{2}t^{2}/m^{2}$ segue dalla sola relazione operatoriale $X(t)=X(0)+Pt/m$, che è vera per <i>qualunque</i> stato — gaussiano o no — perché è una conseguenza dell&rsquo;equazione del moto di Heisenberg per la particella libera, non una proprietà della forma dello stato. La derivazione in rappresentazione di Schrödinger, invece, ha usato a fondo che $\Phi(k,0)$ fosse una gaussiana (solo così l&rsquo;integrale si chiude in forma elementare): per un pacchetto non gaussiano la formula di $\Delta x(t)^{2}$ resterebbe lo stesso polinomio di secondo grado in $t$ — perché l&rsquo;argomento di Heisenberg non dipende dalla forma — ma $\Psi(x,t)$ in generale non avrebbe un&rsquo;espressione chiusa altrettanto semplice.`}
  ]}
]},

/* ---------------- 06 · IL PROPAGATORE ---------------- */
{ num:'06', title:'Il propagatore: la funzione di Green dell’equazione di Schrödinger, e l’azione classica dentro la fase', meta:'K come somma sugli autostati dell’energia · forma chiusa per la particella libera · il collegamento con l’azione classica, esatto qui e non altrove',
  blocchi:[
  {t:'prosa', title:'Una terza via, che non passa per la trasformata di Fourier', tag:'costruzione', html:R`
  <p>Sakurai-Napolitano costruisce l&rsquo;evoluzione come un nucleo integrale: se $\{|a'\rangle\}$ sono gli autostati di $H$ con autovalori $E_{a'}$,</p>
  $$K(x'',t;x',0)=\sum_{a'}\langle x''|a'\rangle\langle a'|x'\rangle\,e^{-iE_{a'}t/\hbar}=\langle x''|\,e^{-iHt/\hbar}\,|x'\rangle,$$
  <p>e $\Psi(x'',t)=\int K(x'',t;x',0)\,\Psi(x',0)\,dx'$: il propagatore è l&rsquo;ampiezza che una particella localizzata esattamente in $x'$ a $t=0$ si trovi in $x''$ al tempo $t$, e la sua forma non dipende dallo stato iniziale — una volta calcolato, serve per <i>qualunque</i> $\Psi(x',0)$. Per la particella libera, dove gli autostati di $H$ sono le onde piane della tappa 01, la somma diventa un integrale su $k$ che si chiude con lo stesso <span class="str" data-str="integrale-gaussiano">completamento del quadrato</span> già usato due volte:</p>
  $$K(x'',t;x',0)=\sqrt{\frac{m}{2\pi i\hbar t}}\;\exp\!\Big[\frac{im(x''-x')^{2}}{2\hbar t}\Big].$$`},
  {t:'reveal', title:'Il controllo, e un fatto che vale solo qui', tag:'costruzione', steps:[
   {label:'Che K sia la funzione di Green giusta', body:R`
   <p>Come nella tappa 05, il modo robusto di controllare una forma chiusa non è rifare l&rsquo;integrale: è verificare che soddisfi l&rsquo;equazione che deve soddisfare. $K$ deve risolvere l&rsquo;equazione di Schrödinger libera nelle variabili $x''$, $t$:</p>
   $$i\hbar\,\partial_tK=-\frac{\hbar^{2}}{2m}\,\partial_{x''}^{2}K,$$
   <p>ed è un conto diretto di derivazione, analogo a quello della tappa 05, che qui si fa sulla forma esplicita appena scritta.</p>`},
   {label:'La fase è l’azione classica — esattamente, non per approssimazione', body:R`
   <p>L&rsquo;esponente di $K$ è $im(x''-x')^{2}/2\hbar t$. Un&rsquo;osservazione che vale la pena isolare: la velocità classica che porta da $x'$ a $x''$ in un tempo $t$ è $v=(x''-x')/t$, e l&rsquo;azione classica di un moto uniforme è $S_{\rm cl}=\int_0^t\tfrac12mv^{2}\,dt'=\tfrac12mv^{2}t$. Sostituendo:</p>
   $$S_{\rm cl}=\frac12m\Big(\frac{x''-x'}{t}\Big)^{2}t=\frac{m(x''-x')^{2}}{2t},$$
   <p>cioè <b>la fase di $K$ è esattamente $S_{\rm cl}/\hbar$</b>. Sakurai-Napolitano lo cita come il legame con i path integral di Feynman, dove per un cammino <i>qualunque</i> la fase è $S[\text{cammino}]/\hbar$ sommata su tutti i cammini: qui c&rsquo;è un solo cammino classico (il moto rettilineo uniforme) e nessuna somma da fare, perché per una lagrangiana al più quadratica in $x$ e $\dot x$ — come questa — il principio di fase stazionaria di Feynman è <i>esatto</i> e non solo un&rsquo;approssimazione semiclassica. È un fatto speciale della particella libera (e, si vedrà altrove, dell&rsquo;oscillatore armonico): non vale per un potenziale generico, dove la somma sui cammini vicini a quello classico dà solo il termine dominante.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Il propagatore $K(x'',t;x',0)$ ha modulo costante, $|K|=\sqrt{m/2\pi\hbar t}$, indipendente da $x''-x'$. Significa che la particella ha la stessa probabilità di arrivare ovunque?`,
    a:R`No — e l&rsquo;errore sarebbe scambiare $K$ per una densità di probabilità, mentre è un&rsquo;<b>ampiezza</b>. $K$ da solo descrive l&rsquo;evoluzione di uno stato iniziale perfettamente localizzato, $\Psi(x',0)=\delta(x-x')$, che non è normalizzabile e non è uno stato fisico — esattamente come l&rsquo;onda piana della tappa 01. La probabilità fisica si ottiene integrando $K$ contro uno stato iniziale <i>normalizzabile</i>, come il pacchetto gaussiano della tappa 04, e il risultato di quell&rsquo;integrale — calcolato nella tappa 05 per altra via — <i>non</i> ha modulo costante: decresce con $x$. Il modulo costante di $K$ dice solo che nessuna direzione è privilegiata <i>a priori</i>, prima di specificare da dove si parte.`}
  ]}
]},

/* ---------------- 07 · IL CAMPO UNIFORME ---------------- */
{ num:'07', title:'Oltre la particella libera: una forza costante, e l’esercizio che un testo del corso lascia al lettore', meta:'il moto del centro resta classico · la larghezza si allarga come nel caso libero · la soluzione del Problema 5.7 di Ballentine, per via indipendente',
  blocchi:[
  {t:'prosa', title:'Il problema lasciato apert', tag:'costruzione', html:R`
  <p>Ballentine, nel paragrafo stesso da cui viene il metodo della tappa 05, pone come esercizio al lettore — il Problema 5.7 — di determinare l&rsquo;evoluzione temporale del pacchetto gaussiano sotto una forza costante $F$, cioè con $H=P^{2}/2m-Fx$. È un&rsquo;estensione naturale, e vale la pena farla per intero: Picasso osserva (senza dimostrarlo) che l&rsquo;evoluzione del centro di un pacchetto resta <i>esattamente</i> classica in tre casi — particella libera, forza costante, oscillatore armonico — e questa tappa dimostra il secondo caso con lo stesso metodo di Ballentine, verificando che l&rsquo;osservazione di Picasso è corretta e non solo plausibile.</p>`},
  {t:'reveal', title:'La soluzione, in rappresentazione degli impulsi', tag:'costruzione', steps:[
   {label:'L’equazione di trasporto', body:R`
   <p>In rappresentazione degli impulsi $X\to i\,\partial_k$ (si verifica che $[i\partial_k,\hbar k]=i\hbar$, come richiesto), quindi $H=P^{2}/2m-Fx$ diventa, nell&rsquo;equazione di Schrödinger per $\Phi(k,t)$:</p>
   $$i\hbar\,\partial_t\Phi=\frac{\hbar^{2}k^{2}}{2m}\,\Phi-iF\,\partial_k\Phi.$$
   <p>È un&rsquo;equazione di trasporto: il termine in $\partial_k$ trasla $\Phi$ lungo $k$ con velocità $F/\hbar$, mentre il termine in $k^{2}$ accumula una fase. Risolvendola con il metodo delle caratteristiche, $u=k-Ft/\hbar$:</p>
   $$\Phi(k,t)=\Phi\Big(k-\frac{Ft}{\hbar},0\Big)\exp\Big[-\frac{i\hbar t}{2m}\Big(k-\frac{Ft}\hbar\Big)^{2}-\frac{iFt^{2}}{2m}\Big(k-\frac{Ft}\hbar\Big)-\frac{iF^{2}t^{3}}{6m\hbar}\Big].$$
   <p>Si tratta di un conto diretto — l&rsquo;equazione, scritta nella variabile $u$, diventa un&rsquo;equazione differenziale ordinaria in $t$ a $u$ fissato, che si integra sommando un polinomio in $t$ dentro l&rsquo;esponente — e il controllo è che la formula soddisfa davvero l&rsquo;equazione di partenza.</p>`},
   {label:'La lettura fisica: il momento trasla, non si deforma', body:R`
   <p>Il fattore moltiplicativo nell&rsquo;esponente è <b>puramente immaginario</b> — ogni termine ha un $i$ davanti — quindi non altera $|\Phi|$. Dunque</p>
   $$|\Phi(k,t)|=\Big|\Phi\Big(k-\frac{Ft}{\hbar},0\Big)\Big|:$$
   <p><b>la distribuzione di momento si trasla rigidamente</b>, centrata a $\bar p(t)=Ft$ — esattamente l&rsquo;equazione classica $\dot p=F$ — <b>senza cambiare larghezza</b>: $\Delta p(t)=\Delta p(0)$ per ogni $t$. È il punto che rende il caso della forza costante identico, nella sostanza, al caso libero: la forza sposta tutto il contenuto in $k$ della stessa quantità, e non introduce nessuna dispersione in più.</p>`}
  ]},
  {t:'reveal', title:'La stessa conclusione, in due righe, con l’argomento di Heisenberg', tag:'costruzione', steps:[
   {label:'Il conto minimo', body:R`
   <p>Con $H=P^{2}/2m-Fx$ le equazioni di Heisenberg danno $\dot P=F$ (costante, un numero puro) e $\dot X=P/m$, quindi</p>
   $$X(t)=X(0)+\frac{P(0)}{m}\,t+\frac{F}{2m}\,t^{2}.$$
   <p>Si verifica subito che $m\,\ddot x_{\rm cl}(t)=F$: il centro segue esattamente la traiettoria classica di un corpo in caduta uniforme.</p>`},
   {label:'Perché la larghezza non cambia rispetto al caso libero', body:R`
   <p>Il termine $Ft^{2}/2m$ è un <b>numero</b>, non un operatore: sommarlo a $X(0)+P(0)t/m$ sposta il valor medio senza toccare la varianza. Dunque</p>
   $$\overline{\Delta x(t)^{2}}=\mathrm{Var}\Big(X(0)+\frac{P(0)}{m}t\Big)$$
   <p>è <b>letteralmente la stessa espressione</b> calcolata nella tappa 05 per la particella libera — stesso $\Delta x(0)$, stesso $\Delta p(0)$, stesso polinomio in $t$. La forza costante sposta il pacchetto, non lo deforma di più o di meno di quanto si deformerebbe comunque: è la stessa conclusione raggiunta con il metodo di Ballentine, per una via che non passa da nessun integrale, e le due vie — qui come nella tappa 05 — si rispondono a vicenda.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Picasso elenca tre casi in cui il centro del pacchetto si muove esattamente come la particella classica: libera, forza costante, oscillatore armonico. Che cosa hanno in comune, e perché un potenziale generico non è dei tre?`,
    a:R`Hanno in comune che la forza $F(x)=-V'(x)$ è una funzione <b>lineare</b> di $x$ (costante, nel caso della forza uniforme; proporzionale a $x$, nell&rsquo;oscillatore; nulla, nel caso libero). Picasso lo dimostra in generale, in un punto diverso da questo movimento: l&rsquo;equazione per il centro del pacchetto è $m\ddot{\bar x}=\overline{F(x)}$, e questa coincide con $F(\bar x)$ — l&rsquo;equazione classica — <b>se e solo se</b> $F$ è lineare, perché solo allora $\overline{F(x)}=F(\bar x)$ esattamente (per una $F$ non lineare, $\overline{F(x)}$ dipende anche dai momenti superiori della distribuzione, non solo dal valor medio). Un potenziale generico — per esempio $\propto x^{3}$ o $\propto x^{4}$ — rompe questa uguaglianza, e il centro del pacchetto quantistico comincia a deviare dalla traiettoria classica non appena il pacchetto ha una larghezza non nulla: è il contenuto preciso dell&rsquo;osservazione che il «compromesso» discusso nella tappa 05 (pacchetto piccolo per seguire la forza, non troppo piccolo per non allargarsi troppo in fretta) ha senso solo quando $F$ non è lineare.`}
  ]}
]},

/* ---------------- 08 · IL MESTIERE ---------------- */
{ num:'08', title:'Il mestiere: due pezzi di scritti del canale, e perché sono pochi', meta:'la densità d’esame più bassa del corso · spinore su una sfera, la parte che tocca questo movimento · una probabilità di localizzazione, con la funzione degli errori',
  blocchi:[
  {t:'prosa', title:'Perché solo due esercizi, e non quattro come altrove', tag:'architettura', html:R`
  <p>La particella libera compare in <b>2 scritti su 47</b>, misurato il 2026-09-25 — la densità più bassa fra i movimenti già montati di questo corso. Non è un caso: il canale preferisce chiederla dentro lo scattering (riflessione, trasmissione, effetto tunnel — tutto <code>mq-13</code>) o come premessa a un problema con potenziale, non come problema isolato. I due pezzi che seguono sono le parti di quegli scritti che toccano specificamente <i>questo</i> movimento — normalizzazione di uno stato libero e stima di una probabilità — e non la parte che userebbe il formalismo dello scattering.</p>`},
  {t:'reveal', title:'Esercizio A — normalizzare uno stato gaussiano assegnato con un parametro', tag:'esame', steps:[
   {label:'Il testo', body:R`
   <p>Uno scritto del canale assegna lo stato iniziale di una particella libera di massa $m$ nella forma $\Psi(x,0)=N\,e^{-x^{2}/4a^{2}}e^{ip_0x/\hbar}$, con $a$ e $p_0$ dati, e chiede di determinare $N$ e $\langle p\rangle$ al tempo $t=0$.</p>`},
   {label:'La soluzione, riconoscendo la struttura', body:R`
   <p>Il modulo quadrato non vede la fase $e^{ip_0x/\hbar}$: $|\Psi(x,0)|^{2}=N^{2}e^{-x^{2}/2a^{2}}$, identico alla gaussiana della tappa 04. Imponendo $\int|\Psi|^{2}dx=1$ si ritrova $N=(2\pi a^{2})^{-1/4}$ — <b>lo stesso calcolo, non uno nuovo</b>: il fattore di fase che porta un impulso medio non altera la normalizzazione, perché $|e^{ip_0x/\hbar}|=1$.</p>
   <p>Per $\langle p\rangle$: la fase $e^{ip_0x/\hbar}$ sposta il centro della distribuzione di impulso esattamente di $p_0$ — lo stesso meccanismo della traslazione in $k$ vista nella tappa 07 per la forza costante, qui applicata una volta per tutte al tempo iniziale invece che prodotta dinamicamente. Dunque $\langle p\rangle=p_0$, e la larghezza $\Delta p=\hbar/2a$ è identica a quella della tappa 04: <i>un impulso medio non nullo non cambia né la normalizzazione né la dispersione</i>, cambia solo il centro.</p>`}
  ]},
  {t:'reveal', title:'Esercizio B — una probabilità di localizzazione, con la funzione degli errori', tag:'esame', steps:[
   {label:'Il testo', body:R`
   <p>Un secondo scritto chiede, per lo stato gaussiano della tappa 04 normalizzato a $\Delta x(0)=a$: qual è la probabilità di trovare la particella nell&rsquo;intervallo $(-a,a)$, cioè entro una deviazione standard dal centro?</p>`},
   {label:'Il conto, e perché non si chiude in forma elementare', body:R`
   <p>$P(|x|<a)=\displaystyle\int_{-a}^{a}\frac{1}{\sqrt{2\pi a^{2}}}e^{-x^{2}/2a^{2}}\,dx$. A differenza di ogni integrale incontrato finora in questo movimento, <b>questo non ha primitiva elementare</b>: è, per definizione, la funzione degli errori, $P(|x|<a)=\mathrm{erf}(1/\sqrt2)\approx0{,}683$.</p>
   <p><b>È un punto che vale la pena dichiarare apertamente</b>: la gaussiana, così comoda per la trasformata di Fourier e per l&rsquo;evoluzione temporale (tappe 04-05), è scomoda esattamente per la domanda più elementare che si possa fare su una distribuzione — quanta probabilità sta in un dato intervallo. Il numero $68{,}3\%$ è la stessa cifra di ogni distribuzione normale in statistica, e qui va riconosciuta come tale, non ricalcolata da zero con metodi elementari che non esistono.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Nell’Esercizio A, se il problema chiedesse $\Delta x(t)$ a un tempo $t>0$ generico, la fase $e^{ip_0x/\hbar}$ cambierebbe il risultato della tappa 05?`,
    a:R`No. L&rsquo;argomento di Heisenberg della tappa 05 — $\overline{\Delta x(t)^{2}}=\Delta x(0)^{2}+\tfrac1m\langle XP+PX-2\langle X\rangle\langle P\rangle\rangle t+\Delta p(0)^{2}t^{2}/m^{2}$ — dipende dalle <b>dispersioni</b> $\Delta x(0)$ e $\Delta p(0)$, non dai valori medi $\langle X\rangle$ e $\langle P\rangle$: un impulso medio diverso da zero sposta il centro del pacchetto a velocità $p_0/m$ invece che a velocità zero, ma la LARGHEZZA si allarga esattamente allo stesso modo. È lo stesso principio della tappa 07 applicato a un impulso iniziale invece che a una forza: <i>ciò che trasla il centro e ciò che ne allarga la forma sono governati da informazioni indipendenti</i> — il valor medio l&rsquo;uno, la dispersione l&rsquo;altro — e confonderli è l&rsquo;errore più comune in un esercizio di questo tipo.`}
  ]}
]},

/* ---------------- 09 · BILANCIO ---------------- */
{ num:'09', title:'Bilancio: che cosa resta in mano, e dove questo movimento serve davvero', meta:'la macchina riusabile · i tre casi in cui il centro resta classico · dove torna in mq-13 e oltre',
  blocchi:[
  {t:'prosa', title:'Che cosa resta in mano, in ordine di riusabilità', tag:'architettura', html:R`
  <p><b>Un fatto di principio.</b> L&rsquo;onda piana non è uno stato fisico; lo spettro della particella libera è continuo e doppiamente degenere; l&rsquo;energia è necessariamente non negativa perché $k$ deve essere reale, e la ragione (l&rsquo;appartenenza allo spazio esteso $\Omega^\times$) è la stessa che mq-06 ha introdotto in generale.</p>
  <p><b>Una distinzione che non si scorda più.</b> Velocità di fase e velocità di gruppo sono oggetti diversi, governati da formule diverse ($\omega/k$ contro $d\omega/dk$), e solo la seconda ha un significato classico. La derivazione per fase stazionaria che le distingue non usa nulla di specificamente quantistico: vale per ogni pacchetto, in ogni teoria ondulatoria.</p>
  <p><b>Una macchina di calcolo.</b> Completare il quadrato in un esponente gaussiano, applicato tre volte in questo movimento — la trasformata a $t=0$, l&rsquo;evoluzione temporale, il propagatore — è lo stesso conto ripetuto su dati diversi. Chi lo impara qui lo riusa ogni volta che compare un&rsquo;hamiltoniana al più quadratica: l&rsquo;oscillatore armonico, il campo uniforme (tappa 07), ogni teoria libera dei campi.</p>
  <p><b>Un metodo di controllo.</b> Verificare che una forma chiusa proposta soddisfi l&rsquo;equazione differenziale che deve soddisfare, invece di rifare l&rsquo;integrazione che l&rsquo;ha prodotta, è più robusto e si usa tre volte in questo movimento (tappe 05, 06, 07). È anche il metodo con cui si è trovato e corretto l&rsquo;errore di segno della tappa 04: non rileggendo la formula, calcolandola.</p>
  <p><b>Un risultato fisico con tre conferme indipendenti.</b> L&rsquo;allargamento del pacchetto libero, $\Delta x(t)=a\sqrt{1+(\hbar t/2ma^{2})^{2}}$, si ottiene dalla forma chiusa di Schrödinger (tappa 05), dall&rsquo;argomento operatoriale di Heisenberg (tappa 05) e si estende senza modifiche al caso della forza costante (tappa 07) — tre strade che condividono solo il punto di arrivo.</p>`},
  {t:'prosa', title:'Dove tutto questo riappare, in fisica e nel resto del corso', tag:'architettura', html:R`
  <p><b>In mq-13, lo scattering.</b> La riflessione e la trasmissione da un gradino o da una barriera si calcolano con stati stazionari di impulso definito — le onde piane di questa tappa 01 — e si interpretano correttamente solo pensando a un pacchetto che le incontra: Shankar nota esplicitamente che l&rsquo;equivalenza fra il quadro dinamico (il pacchetto che urta) e quello stazionario (l&rsquo;autofunzione con asintoti dati) richiede che il pacchetto sia sufficientemente piccato in $k$ da non allargarsi apprezzabilmente durante l&rsquo;urto — <i>la stessa condizione $t\ll t_0$ di questa tappa 05</i>, applicata al tempo di transito.</p>
  <p><b>Nell&rsquo;oscillatore armonico.</b> Picasso classifica la forza costante insieme all&rsquo;oscillatore come i due casi, oltre al libero, in cui il centro del pacchetto segue esattamente l&rsquo;equazione classica. La tappa 07 ha dimostrato il secondo caso con lo stesso metodo che l&rsquo;oscillatore richiederà con un conto appena più lungo (la frequenza $\omega$ entra come parametro, e il polinomio in $t$ della tappa 05 diventa periodico).</p>
  <p><b>Nella diffrazione, in senso proprio.</b> Picasso osserva che l&rsquo;allargamento del pacchetto <i>è</i> il fenomeno della diffrazione, visto nel tempo invece che nello spazio: un fascio di elettroni che attraversa una fenditura di larghezza $d$ e viaggia una distanza $D$ produce, sullo schermo, una macchia di larghezza $\Delta q(\tau)\simeq hD/(pd)$ con $\tau=mD/p$ — la stessa formula di questa tappa, con il tempo di volo al posto del tempo assoluto. <b>Non è un&rsquo;analogia</b>: è lo stesso conto, fatto con le stesse variabili rinominate.</p>
  <p><b>Nel limite classico in generale.</b> Il «compromesso» discusso alla fine della tappa 05 e precisato nella tappa 07 — $\Delta x$ piccolo abbastanza da seguire la forza, non così piccolo da allargarsi troppo in fretta — è il contenuto preciso della domanda «quando una particella si comporta classicamente», ed è una domanda che altrove nel corso (teoria delle perturbazioni, atomo di idrogeno) si dà per risolta: qui si vede perché lo è.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Si indichi, per ciascuna delle cinque fonti di questo movimento, quale affermazione non si troverebbe leggendo solo quella fonte.`,
    a:R`Da <b>Griffiths</b> non si avrebbe l&rsquo;argomento rigoroso per cui $k$ deve essere reale — lui lo dà per buono, Ballentine lo dimostra dallo spazio equipaggiato. Da <b>Ballentine</b> non si avrebbe il paradosso della velocità di fase né la sua risoluzione per fase stazionaria, che è l&rsquo;impostazione di Griffiths. Da <b>Shankar</b> non si avrebbe il collegamento con l&rsquo;azione classica dentro la fase del propagatore, che è di Sakurai-Napolitano. Da <b>Sakurai-Napolitano</b> non si avrebbe la forma chiusa esplicita del pacchetto gaussiano in evoluzione, che è la costruzione di Ballentine. E da nessuno dei quattro in inglese si avrebbe l&rsquo;osservazione che l&rsquo;allargamento del pacchetto <i>è</i> la diffrazione vista nel tempo, né i tre casi in cui il centro resta classico: sono entrambi di <b>Picasso</b>, nell&rsquo;unico paragrafo del corso in cui la dinamica quantistica e l&rsquo;ottica ondulatoria si guardano allo specchio.`}
  ]}
]}

function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';

}
