/* ===================================================================
   >>> CONTENUTO — Nucleo 04: Campi vettoriali <<<

   Tutta la matematica in R`...` (String.raw). Nelle formule si usano

   =================================================================== */

var TAPPE = [

/* ---------------- 00 · PERCHÉ QUESTO NUCLEO ---------------- */
{ num:'00', title:'Perché questo nucleo', meta:'AV Terracina, Parte IV · risolvere quando si può, capire il comportamento quando non si può',
  blocchi:[
  {t:'prosa', title:'I due volti dell&rsquo;esercizio d&rsquo;esame', tag:'mira d&rsquo;esame', html:R`
  <p>Le equazioni differenziali ordinarie sono l&rsquo;ultimo blocco di Analisi Vettoriale (Terracina, Parte IV), ed è il <b>punto debole</b> segnalato. Lo scritto le chiede in due modi opposti, ed entrambi vanno padroneggiati.</p>
  <div class="testo"><span class="src">Es.&nbsp;tipo · risolvere in forma chiusa</span>
  Risolvi il problema di Cauchy $\ y'+\dfrac{2}{x}\,y=x^3,\quad y(1)=0$. Poi $\ y'=xy^2$, $y(0)=1$.</div>
  <div class="testo"><span class="src">Es.&nbsp;tipo · capire senza risolvere (ritratto di fase)</span>
  Data $\ \dot x=x(1-x)$, traccia il ritratto di fase: trova i punti d&rsquo;equilibrio, classificane la stabilità, e descrivi cosa fa una soluzione con dato iniziale $x(0)=0{,}1$.</div>
  <p>Il primo tipo è <b>tecnica</b>: riconoscere il tipo (separabile, lineare, Bernoulli, a coefficienti costanti, di Eulero) e applicare la ricetta. Il secondo è <b>qualitativo</b>: un&rsquo;equazione $\dot x=f(x)$ è un <b>campo di velocità</b> sullo spazio degli stati, e il suo ritratto di fase racconta tutta la dinamica — equilibri, stabilità, tendenze all&rsquo;infinito — <b>senza risolvere nulla</b>. È la parte che alla maggior parte sfugge, e quella che questo nucleo blinda.</p>`},
  {t:'prosa', title:'Cosa saprai fare, uscendo di qui', tag:'performance attesa', html:R`
  <ul>
  <li>Enunciare il teorema di <b>esistenza e unicità</b> (Cauchy–Lipschitz) e riconoscere quando l&rsquo;unicità <b>fallisce</b> (dato non Lipschitz) o la soluzione <b>esplode</b> in tempo finito.</li>
  <li>Riconoscere e risolvere i cinque tipi d&rsquo;esame: <b>separabili</b>, <b>lineari del primo ordine</b> (fattore integrante), <b>Bernoulli</b> (sostituzione), <b>lineari a coefficienti costanti</b> (equazione caratteristica), <b>di Eulero</b> ($x^2y''+\dots$).</li>
  <li>Analizzare un&rsquo;equazione <b>autonoma 1D</b> $\dot x=f(x)$: equilibri ($f=0$), stabilità dal segno di $f$ (o di $f'$), e disegnare la retta di fase.</li>
  <li>Classificare un <b>sistema lineare 2×2</b> dagli autovalori — <b>nodo, sella, fuoco, centro</b> — col piano traccia–determinante, e disegnarne il ritratto di fase.</li>
  <li>Trattare un sistema <b>non lineare</b> per <b>linearizzazione</b> attorno ai punti fissi, e leggere il ritratto di fase (pendolo).</li>
  </ul>`}
]},

/* ---------------- 01 · ESISTENZA E UNICITÀ ---------------- */
{ num:'01', title:'Esistenza e unicità (Cauchy–Lipschitz)', meta:'$f$ Lipschitz in $x$ ⇒ soluzione locale unica · i due modi in cui il teorema può cadere',
  blocchi:[
  {t:'prosa', title:'Il problema di Cauchy e la domanda di fondo', tag:'first principles', html:R`
  <p>Un <b>problema di Cauchy</b> del primo ordine è $$\dot x=f(t,x),\qquad x(t_0)=x_0.$$ Prima di chiedersi <i>come</i> risolverlo, due domande più radicali: una soluzione <b>esiste</b>? Ed è <b>unica</b>? Non sono ovvie — e in fisica sono decisive: se il moto di un sistema deterministico non fosse unicamente determinato dallo stato iniziale, il determinismo stesso crollerebbe. Il teorema di Cauchy–Lipschitz dà la condizione che garantisce entrambe.</p>`},
  {t:'prosa', title:'Il teorema', tag:'enunciato', html:R`
  <p><b>Teorema (Cauchy–Lipschitz / Picard–Lindelöf).</b> Sia $f(t,x)$ continua in un intorno di $(t_0,x_0)$ e <b>Lipschitz in $x$</b> lÀ, cioè esista $L\gt0$ con $$|f(t,x_1)-f(t,x_2)|\le L\,|x_1-x_2|$$ per tutti gli $x_1,x_2$ vicini. Allora esiste un intorno di $t_0$ in cui il problema di Cauchy ha <b>una e una sola</b> soluzione $x(t)$ di classe $C^1$.</p>
  <p>La condizione di Lipschitz è più forte della continuità e più debole della derivabilità: se $f$ è $C^1$ in $x$ con $\partial_x f$ limitata, è automaticamente Lipschitz (prendi $L=\sup|\partial_x f|$). All&rsquo;esame, quasi sempre <b>basta guardare $\partial_x f$</b>: se esiste ed è limitata vicino al dato, esistenza e unicità sono garantite.</p>`},
  {t:'reveal', title:'Perché Lipschitz dà l&rsquo;unicità (l&rsquo;idea di Picard)', tag:'derivazione', steps:[
   {label:'Trasforma in equazione integrale', body:R`<p>Integrando $\dot x=f(t,x)$ da $t_0$ a $t$: $$x(t)=x_0+\int_{t_0}^t f\big(s,x(s)\big)\,ds.$$ Risolvere l&rsquo;EDO equivale a trovare una funzione $x$ che soddisfa questa identità: un <b>punto fisso</b> dell&rsquo;operatore $T[x](t)=x_0+\int_{t_0}^t f(s,x(s))\,ds$.</p>`},
   {label:'$T$ è una contrazione', body:R`<p>Date due candidate $x_1,x_2$, la condizione di Lipschitz dà $$|T[x_1](t)-T[x_2](t)|\le\int_{t_0}^t L\,|x_1(s)-x_2(s)|\,ds\le L\,|t-t_0|\cdot\max|x_1-x_2|.$$ Per $|t-t_0|$ piccolo il fattore $L|t-t_0|\lt1$: $T$ <b>avvicina</b> le funzioni. Per il teorema delle contrazioni (lo incontrerai da capo negli spazi di Banach, nucleo 08) esiste <b>un unico</b> punto fisso. Quel punto fisso È la soluzione, e l&rsquo;unicità del punto fisso È l&rsquo;unicità della soluzione. $\blacksquare$</p>
   <div class="note">Le iterate di Picard $x_{n+1}=T[x_n]$ partendo da $x_0(t)\equiv x_0$ <b>convergono</b> alla soluzione: è un metodo costruttivo, non solo un&rsquo;esistenza astratta.</div>`}
  ]},
  {t:'plot', title:'Quando l&rsquo;unicità fallisce, e quando la soluzione esplode',
   intro:R`Due patologie. A sinistra $\dot x=3x^{2/3}$, $x(0)=0$ (dato NON Lipschitz): infinite soluzioni. A destra $\dot x=x^2$, $x(0)=1$: la soluzione fugge all&rsquo;infinito in tempo finito.`,
   plots:[
    {kind:'func2d', f:'x>0 ? x*x*x : 0', xr:[-1.5,1.5], yr:[-0.5,3.5], height:320, title:'x(t)=t^3 e x(t)=0: due soluzioni dallo stesso dato (0,0)'},
    {kind:'func2d', f:'1/(1-x)', xr:[-2,0.97], yr:[0,12], height:320, title:'x(t)=1/(1-t): asintoto verticale a t=1 (esplosione)'}
   ],
   leggi:R`A sinistra $f(x)=3x^{2/3}$ ha derivata $\partial_x f=2x^{-1/3}$ che <b>esplode</b> in $x=0$: lÀ $f$ non è Lipschitz, e infatti dal dato $(0,0)$ partono <b>almeno due</b> soluzioni — quella nulla $x(t)\equiv0$ e $x(t)=t^3$ (verificalo: $\dot{(t^3)}=3t^2=3(t^3)^{2/3}$). Il determinismo si rompe: lo stato iniziale non basta a fissare il futuro. A destra $f(x)=x^2$ è liscia e Lipschitz <b>localmente</b>, quindi la soluzione è unica — ma solo <b>locale</b>: separando le variabili si trova $x(t)=\dfrac{1}{1-t}$, che ha un asintoto verticale a $t=1$. La soluzione esiste solo per $t\lt1$ e poi <b>esplode</b>. Lezione doppia: Lipschitz garantisce unicità ma <b>non</b> esistenza globale; il teorema è sempre <b>locale</b>, e l&rsquo;intervallo massimale va trovato a parte.`},
  {t:'gram', title:'Il vocabolario dell&rsquo;esistenza-unicità', rows:[
   [R`$\dot x=f(t,x)$`, R`EDO del primo ordine in <b>forma normale</b> (risolta rispetto a $\dot x$). Il punto: $\dot x=$ derivata rispetto al tempo.`],
   [R`Lipschitz in $x$`, R`$|f(t,x_1)-f(t,x_2)|\le L|x_1-x_2|$: $f$ non varia &laquo;troppo in fretta&raquo; in $x$. Sufficiente: $\partial_x f$ limitata.`],
   [R`soluzione <b>massimale</b>`, R`la soluzione estesa al più grande intervallo di tempo possibile. Può essere tutto $\mathbb R$ o finire in un&rsquo;esplosione (blow-up).`],
   [R`unicità locale`, R`due soluzioni con lo stesso dato coincidono in un intorno di $t_0$. Con Lipschitz, garantita; senza, può fallire.`]
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Il problema $\dot x=\sqrt{|x|}$, $x(0)=0$, ha soluzione unica?`,
    a:R`No. $f(x)=\sqrt{|x|}$ non è Lipschitz in $0$ ($\partial_x f$ esplode lÀ). Oltre a $x\equiv0$ c&rsquo;è $x(t)=\tfrac14 t^2$ per $t\ge0$ (e si possono &laquo;incollare&raquo; soluzioni che restano a zero per un po&rsquo; e poi partono): infinite soluzioni. Unicità persa esattamente dove Lipschitz cade.`},
   {q:R`Se $f$ è $C^1$ ovunque con $\partial_x f$ limitata su tutto $\mathbb R$, la soluzione è definita per ogni $t$?`,
    a:R`SÀ. Lipschitz globale (con $L=\sup|\partial_x f|$) impedisce l&rsquo;esplosione in tempo finito, quindi la soluzione è <b>globale</b>. È il caso, ad esempio, dei sistemi lineari $\dot x=Ax$: sempre definiti per ogni $t$. L&rsquo;esplosione ($x^2$) richiede una crescita più che lineare di $f$.`}
  ]}
]},

/* ---------------- 02 · METODI RISOLUTIVI ---------------- */
{ num:'02', title:'La cassetta degli attrezzi: i cinque tipi', meta:'separabili · lineari 1° ordine · Bernoulli · coefficienti costanti · Eulero (il ponte verso Metodi)',
  blocchi:[
  {t:'prosa', title:'Riconoscere il tipo è metà del lavoro', tag:'strategia d&rsquo;esame', html:R`
  <p>Non esiste un metodo unico: si <b>riconosce la forma</b> e si applica la ricetta giusta. Ecco le cinque che coprono lo scritto, in ordine di frequenza.</p>`},
  {t:'reveal', title:'1. Separabili: $\\dot x=g(t)\\,h(x)$', tag:'ricetta', steps:[
   {label:'Separa e integra', body:R`<p>Se il secondo membro si <b>fattorizza</b> in una funzione del solo tempo per una del solo stato, separa: $$\frac{dx}{h(x)}=g(t)\,dt\ \Rightarrow\ \int\frac{dx}{h(x)}=\int g(t)\,dt+C.$$ Poi risolvi per $x$ e imponi il dato per fissare $C$. <b>Attenzione</b> agli zeri di $h$: ogni $x^*$ con $h(x^*)=0$ è una soluzione costante $x\equiv x^*$, da non perdere (potrebbe essere quella giusta o un equilibrio).</p>`},
   {label:'Esempio: la separabile $y=xy^2$ (cioè $\\dot y=xy^2$)', body:R`<p>$\dfrac{dy}{y^2}=x\,dx\Rightarrow-\dfrac1y=\dfrac{x^2}{2}+C$. Col dato $y(0)=1$: $-1=0+C$, $C=-1$. Quindi $-\dfrac1y=\dfrac{x^2}{2}-1$, cioè $$y=\frac{1}{1-\frac{x^2}{2}}=\frac{2}{2-x^2}.$$ Definita per $|x|\lt\sqrt2$: di nuovo una soluzione locale che esplode al bordo. $\blacksquare$</p>`}
  ]},
  {t:'reveal', title:'2. Lineari del primo ordine: $\\dot x+a(t)x=b(t)$', tag:'ricetta', steps:[
   {label:'Fattore integrante', body:R`<p>Moltiplica per $\mu(t)=e^{\int a(t)\,dt}$. Il trucco è che il primo membro diventa una derivata esatta: $$\mu\dot x+\mu a\,x=\frac{d}{dt}(\mu x),$$ perché $\dot\mu=\mu a$. Quindi $\dfrac{d}{dt}(\mu x)=\mu b$, e integrando $$x(t)=\frac{1}{\mu(t)}\left(\int\mu(t)\,b(t)\,dt+C\right).$$</p>`},
   {label:'Esempio d&rsquo;apertura: $y^{\\prime}+\\tfrac2x\\,y=x^3$', body:R`<p>$a=\tfrac2x$, $\mu=e^{\int\frac2x dx}=e^{2\ln x}=x^2$. Allora $(x^2 y)'=x^2\cdot x^3=x^5$, quindi $x^2 y=\tfrac{x^6}{6}+C$, cioè $y=\tfrac{x^4}{6}+\tfrac{C}{x^2}$. Col dato $y(1)=0$: $0=\tfrac16+C\Rightarrow C=-\tfrac16$. $$y=\frac{x^4}{6}-\frac{1}{6x^2}=\frac{x^6-1}{6x^2}.\qquad\blacksquare$$</p>`}
  ]},
  {t:'reveal', title:'3. Bernoulli: $\\dot x+a(t)x=b(t)\\,x^n$', tag:'ricetta', steps:[
   {label:'La sostituzione che la linearizza', body:R`<p>Con $n\neq0,1$, dividi per $x^n$ e poni $z=x^{1-n}$. Allora $\dot z=(1-n)x^{-n}\dot x$, e l&rsquo;equazione diventa <b>lineare</b> in $z$: $$\dot z+(1-n)a(t)\,z=(1-n)b(t).$$ La risolvi col fattore integrante (metodo 2), poi torni a $x=z^{1/(1-n)}$.</p>`},
   {label:'Perché funziona', body:R`<p>La non-linearità $x^n$ è &laquo;assorbita&raquo; dal cambio di variabile: $z=x^{1-n}$ è scelto esattamente perché la sua derivata produce il fattore $x^{-n}$ che cancella il termine non lineare. È il primo esempio di una strategia generale — <b>trovare la variabile in cui il problema diventa lineare</b> — che ritroverai ovunque (fino alla trasformata di Fourier, nucleo 15, che linearizza le EDP). $\blacksquare$</p>`}
  ]},
  {t:'reveal', title:'4. Lineari a coefficienti costanti: $x^{\\prime\\prime}+p\\,x^{\\prime}+q\\,x=0$', tag:'ricetta', steps:[
   {label:'Equazione caratteristica', body:R`<p>Cerca soluzioni $x=e^{\lambda t}$: sostituendo, $e^{\lambda t}(\lambda^2+p\lambda+q)=0$, quindi $\lambda$ risolve l&rsquo;<b>equazione caratteristica</b> $\lambda^2+p\lambda+q=0$. Tre casi dal discriminante $\Delta=p^2-4q$:</p>
   <ul>
   <li>$\Delta\gt0$: due radici reali $\lambda_1\neq\lambda_2$ → $x=c_1 e^{\lambda_1 t}+c_2 e^{\lambda_2 t}$.</li>
   <li>$\Delta=0$: radice doppia $\lambda$ → $x=(c_1+c_2 t)e^{\lambda t}$ (il fattore $t$ per la seconda soluzione).</li>
   <li>$\Delta\lt0$: radici complesse $\alpha\pm i\beta$ → $x=e^{\alpha t}(c_1\cos\beta t+c_2\sin\beta t)$: oscillazione modulata.</li>
   </ul></p>`},
   {label:'Il significato fisico dei tre casi', body:R`<p>È l&rsquo;oscillatore smorzato $m\ddot x+\gamma\dot x+k x=0$: sovrasmorzato ($\Delta\gt0$, torna all&rsquo;equilibrio senza oscillare), criticamente smorzato ($\Delta=0$), sottosmorzato ($\Delta\lt0$, oscilla spegnendosi). La parte reale $\alpha$ dice se cresce o decade; la parte immaginaria $\beta$ dà la frequenza. Rivedrai questi tre casi come <b>autovalori</b> nel ritratto di fase (tappa 03). $\blacksquare$</p>`}
  ]},
  {t:'reveal', title:'5. Equazione di Eulero: $x^2 y^{\\prime\\prime}+a\\,x\\,y^{\\prime}+b\\,y=0$', tag:'ricetta · il ponte verso Metodi', steps:[
   {label:'La sostituzione giusta', body:R`<p>I coefficienti crescono come le potenze di $x$ che accompagnano le derivate: è il segnale di Eulero. Cerca $y=x^m$: allora $xy'=mx^m$, $x^2y''=m(m-1)x^m$, e l&rsquo;equazione diventa l&rsquo;<b>indiciale</b> $$m(m-1)+a\,m+b=0.$$ Le radici $m_1,m_2$ danno $y=c_1 x^{m_1}+c_2 x^{m_2}$ (con i casi doppia/complessa analoghi: $x^m\ln x$ per la doppia, $x^\alpha(\cos(\beta\ln x),\sin(\beta\ln x))$ per le complesse).</p>`},
   {label:'Perché è il ponte 7↔17', body:R`<p>Con la sostituzione $x=e^t$ l&rsquo;equazione di Eulero diventa una a <b>coefficienti costanti</b> in $t$: sono la stessa equazione in due vesti. Questo non è un caso isolato — è il tipo che ricompare nei problemi al contorno di Metodi (funzioni di Green per EDO, nucleo 16, e Sturm–Liouville): risolverla <b>una volta bene qui</b> ti copre AV <b>e</b> prepara metà del funzionale. È uno dei tre ponti espliciti fra i due corsi. $\blacksquare$</p>
   <div class="note">Regola-lampo per riconoscere il tipo: guarda gli esponenti. Coefficienti <b>costanti</b> → prova $e^{\lambda t}$. Coefficienti $\propto x^k$ davanti a $y^{(k)}$ → Eulero, prova $x^m$.</div>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Come distingui a colpo d&rsquo;occhio una lineare del primo ordine da una di Bernoulli?`,
    a:R`Guarda il membro con $x$: se compare solo $x$ alla prima potenza è <b>lineare</b> (fattore integrante diretto); se compare $x^n$ con $n\neq0,1$ è <b>Bernoulli</b> (sostituzione $z=x^{1-n}$, poi lineare). Bernoulli è &laquo;una lineare mascherata da una potenza&raquo;.`},
   {q:R`Perché nel caso di radice caratteristica doppia serve il fattore $t$ nella seconda soluzione?`,
    a:R`Perché $e^{\lambda t}$ da sola dà una sola soluzione, ma l&rsquo;equazione del secondo ordine ne richiede <b>due indipendenti</b>. Quando le due radici coincidono, la seconda soluzione &laquo;degenera&raquo; e il limite corretto è $t\,e^{\lambda t}$ (si ottiene per riduzione d&rsquo;ordine o come limite $\frac{e^{\lambda_2 t}-e^{\lambda_1 t}}{\lambda_2-\lambda_1}\to t e^{\lambda t}$).`}
  ]}
]},

/* ---------------- 03 · SISTEMI LINEARI E RITRATTO DI FASE ---------------- */
{ num:'03', title:'Sistemi lineari 2×2 e ritratto di fase', meta:'$\\dot{\\mathbf x}=A\\mathbf x$ · autovalori → nodo/sella/fuoco/centro · il piano traccia–determinante',
  blocchi:[
  {t:'prosa', title:'L&rsquo;equazione È un campo di velocità', tag:'il salto qualitativo', html:R`
  <p>Un sistema $\dot{\mathbf x}=A\mathbf x$ con $\mathbf x=(x,y)$ e $A$ matrice $2\times2$ assegna a <b>ogni punto</b> del piano un vettore velocità $A\mathbf x$: è un <b>campo vettoriale</b> (nucleo 4!). Le soluzioni sono le curve tangenti a questo campo in ogni istante — le <b>traiettorie</b>. L&rsquo;insieme di tutte le traiettorie è il <b>ritratto di fase</b>, e la sua forma è determinata dagli <b>autovalori</b> di $A$, senza risolvere l&rsquo;equazione.</p>
  <p>Perché gli autovalori? Se $\mathbf v$ è autovettore, $A\mathbf v=\lambda\mathbf v$, allora lungo la direzione $\mathbf v$ il sistema è $\dot s=\lambda s$: crescita/decadimento esponenziale puro. Gli autovettori sono le <b>direzioni privilegiate</b> (invarianti), gli autovalori dicono se lungo di esse si va verso l&rsquo;origine ($\lambda\lt0$) o via ($\lambda\gt0$), e quanto in fretta.</p>`},
  {t:'gram', title:'I quattro ritratti, dagli autovalori di $A$', rows:[
   [R`$\lambda_1,\lambda_2$ reali, stesso segno`, R`<b>NODO</b>. Entrambi $\lt0$: nodo stabile (tutto converge all&rsquo;origine). Entrambi $\gt0$: instabile (tutto diverge).`],
   [R`$\lambda_1,\lambda_2$ reali, segni opposti`, R`<b>SELLA</b>. Una direzione entra ($\lambda\lt0$), l&rsquo;altra esce ($\lambda\gt0$). Sempre <b>instabile</b>: le due separatrici.`],
   [R`$\alpha\pm i\beta$ complessi, $\alpha\neq0$`, R`<b>FUOCO</b> (spirale). $\alpha\lt0$: spirale che converge (stabile); $\alpha\gt0$: spirale che diverge.`],
   [R`$\pm i\beta$ immaginari puri ($\alpha=0$)`, R`<b>CENTRO</b>. Orbite chiuse attorno all&rsquo;origine: oscillazione perpetua, né converge né diverge.`]
  ]},
  {t:'prosa', title:'La scorciatoia: traccia e determinante', tag:'lo strumento d&rsquo;esame', html:R`
  <p>Non serve calcolare gli autovalori esplicitamente. Bastano $\tau=\text{tr}\,A=\lambda_1+\lambda_2$ e $\delta=\det A=\lambda_1\lambda_2$. Dall&rsquo;equazione caratteristica $\lambda^2-\tau\lambda+\delta=0$:</p>
  <ul>
  <li>$\delta\lt0$ → autovalori reali di segno opposto → <b>SELLA</b> (sempre instabile).</li>
  <li>$\delta\gt0$ e $\tau^2-4\delta\gt0$ → reali stesso segno → <b>NODO</b> (stabile se $\tau\lt0$).</li>
  <li>$\delta\gt0$ e $\tau^2-4\delta\lt0$ → complessi → <b>FUOCO</b> (stabile se $\tau\lt0$), o <b>CENTRO</b> se $\tau=0$.</li>
  </ul>
  <p>Regola di stabilità, in una riga: <b>stabile ⟺ $\tau\lt0$ e $\delta\gt0$</b> (entrambi gli autovalori con parte reale negativa). È il criterio che userai anche sui sistemi non lineari, linearizzati (tappa 04).</p>`},
  {t:'plot', title:'I quattro ritratti di fase, uno accanto all&rsquo;altro',
   intro:R`Ogni pannello è $\dot{\mathbf x}=A\mathbf x$ per una scelta di $A$; le linee sono traiettorie, le frecce il campo $A\mathbf x$. <b>Sella</b> e <b>fuoco stabile</b>:`,
   plots:[
    {kind:'phase', fx:'x', fy:'-y', xr:[-3,3], yr:[-3,3], n:15, seeds:[[2.5,0.3],[-2.5,0.3],[2.5,-0.3],[-2.5,-0.3],[0.3,2.5],[0.3,-2.5]], height:360, title:'SELLA: lambda = +1, -1 (instabile)'},
    {kind:'phase', fx:'-0.3*x-y', fy:'x-0.3*y', xr:[-3,3], yr:[-3,3], n:15, seeds:[[2.5,0],[0,2.5],[-2.2,1.2]], height:360, title:'FUOCO stabile: alpha=-0.3, spirale in dentro'}
   ],
   leggi:R`A sinistra la <b>sella</b> $\dot x=x,\ \dot y=-y$ (autovalori $+1,-1$): lungo l&rsquo;asse $y$ tutto <b>entra</b> ($\dot y=-y$, decadimento), lungo l&rsquo;asse $x$ tutto <b>esce</b> ($\dot x=x$, crescita). Le due rette sono le <b>separatrici</b>: quasi ogni traiettoria si avvicina lungo la stabile, poi fugge lungo l&rsquo;instabile — la forma a sella. Instabile per definizione, perché una direzione diverge. A destra un <b>fuoco stabile</b>: autovalori $-0{,}3\pm i$, parte reale negativa (spirale che converge), parte immaginaria non nulla (gira). È l&rsquo;oscillatore smorzato, e la spirale è <b>la stessa</b> che avevi visto convergere nel nucleo 0 come esempio di $x_k\to0$: qui capisci <i>perché</i> era una spirale — è una soluzione di un sistema con autovalori complessi a parte reale negativa. Il verso (orario/antiorario) e la rapidità di avvolgimento li leggi da $\beta$ e $\alpha$.`},
  {t:'esercizio', title:'Classifica e disegna', src:'Applicazione diretta · traccia–determinante',
   testo:R`Per il sistema $\dot x=x+2y,\ \dot y=3x+2y$, trova gli equilibri, classifica l&rsquo;origine e stabiliscine la stabilità.`,
   steps:[
    {label:'Matrice, traccia, determinante', body:R`<p>$A=\begin{pmatrix}1&2\\3&2\end{pmatrix}$. $\tau=1+2=3$, $\delta=1\cdot2-2\cdot3=2-6=-4$. L&rsquo;unico equilibrio è l&rsquo;origine (se $\det A\neq0$).</p>`},
    {label:'Classifica', body:R`<p>$\delta=-4\lt0$: autovalori reali di <b>segno opposto</b> → <b>SELLA</b>, <b>instabile</b>. (Verifica: $\lambda^2-3\lambda-4=0\Rightarrow\lambda=4,-1$, in effetti uno positivo e uno negativo.)</p>`},
    {label:'Le direzioni', body:R`<p>Separatrice instabile ($\lambda=4$): $(A-4I)\mathbf v=0\Rightarrow-3v_1+2v_2=0$, $\mathbf v=(2,3)$ — le traiettorie fuggono lungo questa. Separatrice stabile ($\lambda=-1$): $2v_1+2v_2=0$, $\mathbf v=(1,-1)$ — entrano lungo questa. Il ritratto è una sella con questi due assi obliqui. $\blacksquare$</p>`}
   ],
   nota:R`Metodo d&rsquo;esame, sempre lo stesso: (1) scrivi $A$; (2) $\tau,\delta$ → tipo e stabilità dal criterio; (3) se serve il disegno, trova gli autovettori per orientare gli assi. Tre righe e il ritratto è deciso senza risolvere l&rsquo;EDO.`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Un sistema ha $\tau=0$ e $\delta\gt0$. Che ritratto è, ed è stabile?`,
    a:R`Autovalori immaginari puri $\pm i\sqrt\delta$: è un <b>CENTRO</b>, orbite chiuse. È <b>stabile ma non asintoticamente</b> (le orbite non convergono all&rsquo;origine, ci girano attorno per sempre). È il caso di frontiera: una piccola perturbazione (traccia leggermente negativa/positiva) lo trasforma in fuoco stabile/instabile — per questo i centri sono &laquo;fragili&raquo; nei sistemi non lineari.`},
   {q:R`Perché la sella è sempre instabile, qualunque siano i dettagli?`,
    a:R`Perché ha un autovalore positivo ($\delta\lt0$ forza segni opposti): lungo quella direzione ogni perturbazione, per piccola che sia, <b>cresce</b> esponenzialmente. Basta una direzione di fuga per rendere instabile l&rsquo;equilibrio. Solo se <b>tutte</b> le direzioni convergono (entrambi $\lambda$ con parte reale $\lt0$) l&rsquo;equilibrio è stabile.`}
  ]}
]},

/* ---------------- 04 · SISTEMI NON LINEARI ---------------- */
{ num:'04', title:'Autonome non lineari: linearizzazione e pendolo', meta:'punti fissi · linearizzazione (Jacobiana) · il ritratto di fase del pendolo',
  blocchi:[
  {t:'prosa', title:'Localmente, un non lineare assomiglia al suo linearizzato', tag:'la strategia', html:R`
  <p>Per un sistema autonomo non lineare $\dot{\mathbf x}=\mathbf F(\mathbf x)$ non c&rsquo;è una formula generale. Ma il ritratto di fase si ricostruisce <b>a pezzi</b>: trova i <b>punti fissi</b> $\mathbf x^*$ (dove $\mathbf F(\mathbf x^*)=\mathbf 0$, velocità nulla, equilibri), poi <b>linearizza</b> attorno a ciascuno. Vicino a $\mathbf x^*$, $\mathbf F(\mathbf x)\approx J(\mathbf x^*)\,(\mathbf x-\mathbf x^*)$, dove $J$ è la <b>matrice Jacobiana</b> $\partial F_i/\partial x_j$ (nucleo 2!). Il comportamento locale è quello del sistema lineare $\dot{\boldsymbol\xi}=J\boldsymbol\xi$ — nodo, sella, fuoco o centro dagli autovalori di $J$.</p>
  <p><b>Teorema (Hartman–Grobman, in forma operativa).</b> Se il linearizzato è un nodo, una sella o un fuoco (autovalori con parte reale $\neq0$, punto <b>iperbolico</b>), il ritratto di fase non lineare vicino a $\mathbf x^*$ è <b>qualitativamente identico</b> a quello del linearizzato. L&rsquo;unico caso ambiguo è il <b>centro</b> ($\alpha=0$): lÀ la non-linearità decide, e può diventare fuoco stabile o instabile.</p>`},
  {t:'plot', title:'Il pendolo: due tipi di equilibrio nello stesso ritratto',
   intro:R`Il pendolo smorzato $\ddot\theta+0{,}3\dot\theta+\sin\theta=0$, cioè il sistema $\dot x=y,\ \dot y=-\sin x-0{,}3y$ ($x=\theta$ angolo, $y=\dot\theta$ velocità). Le linee sono traiettorie.`,
   plots:[
    {kind:'phase', fx:'y', fy:'-sin(x)-0.3*y', xr:[-6.5,6.5], yr:[-3.5,3.5], n:17, seeds:[[-6,0.5],[0,3],[0,-3],[3,2.5],[-3,-2.5],[1.5,0],[-1.5,0],[6,-0.5]], height:420, title:'pendolo smorzato: fuochi stabili (basso) e selle (verticale)'}
   ],
   leggi:R`Ci sono due famiglie di equilibri, e la figura le mostra entrambe. In $x=0,\pm2\pi,\dots$ (pendolo <b>in basso</b>, fermo) il linearizzato ha autovalori $-0{,}15\pm i$: <b>fuochi stabili</b>, e infatti le traiettorie ci <b>spiraleggiano dentro</b> — il pendolo oscilla spegnendosi verso il basso. In $x=\pm\pi,\pm3\pi,\dots$ (pendolo <b>in cima</b>, in equilibrio instabile) il linearizzato ha autovalori reali di segno opposto: <b>selle</b>, e vedi le traiettorie avvicinarsi lungo una direzione e fuggire lungo l&rsquo;altra. Le curve che <b>ondeggiano in alto senza spiraleggiare</b> sono il pendolo che gira a giostra (abbastanza energia da scavalcare la cima), quelle che spiraleggiano sono le oscillazioni smorzate. Senza risolvere niente, il ritratto racconta <b>tutta</b> la dinamica: dove si ferma, cosa è instabile, quali moti sono qualitativamente diversi. Togliendo lo smorzamento ($0{,}3\to0$) i fuochi diventano <b>centri</b> e le oscillazioni non si spengono più — energia conservata.`},
  {t:'esercizio', title:'Trova e classifica gli equilibri', src:'Tipo Terracina · sistema autonomo non lineare',
   testo:R`Per $\dot x=x(1-x)$ (equazione logistica, 1D), trova gli equilibri, classificane la stabilità e descrivi la soluzione con $x(0)=0{,}1$.`,
   steps:[
    {label:'Equilibri', body:R`<p>$f(x)=x(1-x)=0\Rightarrow x^*=0$ e $x^*=1$. Due equilibri.</p>`},
    {label:'Stabilità dal segno di $f^{\prime}$', body:R`<p>In 1D la stabilità si legge da $f'(x^*)$: stabile se $f'\lt0$. $f'(x)=1-2x$. In $x^*=0$: $f'(0)=1\gt0$ → <b>instabile</b>. In $x^*=1$: $f'(1)=-1\lt0$ → <b>stabile</b>.</p>`},
    {label:'La dinamica', body:R`<p>Per $0\lt x\lt1$, $f\gt0$: $x$ <b>cresce</b>. Con $x(0)=0{,}1$, la soluzione parte vicino all&rsquo;equilibrio instabile $0$, se ne allontana, e converge monotona all&rsquo;equilibrio stabile $x=1$ (la &laquo;capacità portante&raquo;). Nessuna oscillazione: in 1D le soluzioni sono <b>monotone</b> fra due equilibri consecutivi. $\blacksquare$</p>`}
   ],
   nota:R`In una dimensione il ritratto di fase è una <b>retta</b>: metti i pallini negli equilibri, frecce → dove $f\gt0$, frecce ← dove $f\lt0$. Un equilibrio è stabile se le frecce puntano verso di lui da entrambi i lati (pozzo), instabile se puntano via (sorgente). Niente oscillazioni, niente caos: quello richiede almeno due dimensioni (o il tempo esplicito).`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Perché il centro è l&rsquo;unico caso in cui non ci si può fidare della linearizzazione?`,
    a:R`Perché il centro ha autovalori con parte reale <b>esattamente</b> zero (punto non iperbolico): è il caso di frontiera fra spirale-in-dentro e spirale-in-fuori. I termini non lineari, per piccoli che siano, possono inclinare la bilancia da una parte o dall&rsquo;altra (fuoco stabile o instabile). Hartman–Grobman garantisce la fedeltà del linearizzato <b>solo</b> nei casi iperbolici (nodo, sella, fuoco).`},
   {q:R`Cosa rappresenta fisicamente una traiettoria chiusa (orbita) nel ritratto di fase?`,
    a:R`Un <b>moto periodico</b>: il sistema ritorna esattamente allo stato di partenza e ripete. Nel pendolo senza attrito sono le oscillazioni (attorno ai centri) e le rotazioni (in alto). In un sistema dissipativo le orbite chiuse isolate sono i <b>cicli limite</b> (es. l&rsquo;oscillatore di van der Pol) — ritmi autosostenuti, cuore dei modelli di battito cardiaco e reti neuronali.`}
  ]}
]},

/* ---------------- 05 · ESERCIZI ---------------- */
{ num:'05', title:'Esercizi — tocca a te', meta:'Prova prima, poi rivela · un tecnico completo e un qualitativo',
  blocchi:[
  {t:'prosa', title:'Istruzioni', tag:'come usarli', html:R`
  <p>Copri, prova, poi rivela un passo alla volta. Uno di ogni famiglia tecnica, più un&rsquo;analisi qualitativa completa — il tipo che sullo scritto separa chi &laquo;sa risolvere&raquo; da chi &laquo;capisce le equazioni&raquo;.</p>`},
  {t:'esercizio', title:'Esercizio 1 — lineare del primo ordine', src:'Tipo Terracina · fattore integrante',
   testo:R`Risolvi $y'-\dfrac{1}{x}y=x^2$, $y(1)=2$ (per $x\gt0$).`,
   steps:[
    {label:'Fattore integrante', body:R`<p>$a=-\tfrac1x$, $\mu=e^{\int-\frac1x dx}=e^{-\ln x}=\tfrac1x$. Allora $\left(\tfrac{y}{x}\right)'=\tfrac1x\cdot x^2=x$.</p>`},
    {label:'Integra e imponi il dato', body:R`<p>$\tfrac{y}{x}=\tfrac{x^2}{2}+C\Rightarrow y=\tfrac{x^3}{2}+Cx$. Col dato $y(1)=2$: $2=\tfrac12+C\Rightarrow C=\tfrac32$. $$y=\frac{x^3}{2}+\frac{3x}{2}=\frac{x^3+3x}{2}.\qquad\blacksquare$$</p>`}
   ],
   nota:R`Controllo veloce: $y(1)=\tfrac{1+3}{2}=2$ ✓. E $y'=\tfrac{3x^2+3}{2}$; verifica $y'-\tfrac yx=\tfrac{3x^2+3}{2}-\tfrac{x^2+3}{2}=\tfrac{2x^2}{2}=x^2$ ✓.`},
  {t:'esercizio', title:'Esercizio 2 — Bernoulli', src:'Tipo Terracina · sostituzione',
   testo:R`Risolvi $y'+y=xy^2$ (Bernoulli con $n=2$).`,
   steps:[
    {label:'Sostituzione', body:R`<p>$n=2$, poni $z=y^{1-2}=y^{-1}$, $z'=-y^{-2}y'$. Dividendo l&rsquo;equazione per $y^2$: $y^{-2}y'+y^{-1}=x$, cioè $-z'+z=x$, ovvero $z'-z=-x$.</p>`},
    {label:'Risolvi la lineare in $z$', body:R`<p>$\mu=e^{-x}$: $(e^{-x}z)'=-x e^{-x}$. Integrando per parti $\int-xe^{-x}dx=xe^{-x}+e^{-x}+C$, quindi $e^{-x}z=(x+1)e^{-x}+C$, $z=x+1+Ce^{x}$.</p>`},
    {label:'Torna a $y$', body:R`<p>$y=\dfrac1z=\dfrac{1}{x+1+Ce^{x}}$. $\blacksquare$ (La costante $C$ si fissa con un eventuale dato iniziale; nota l&rsquo;equilibrio $y\equiv0$, soluzione persa nella divisione per $y^2$.)</p>`}
   ],
   nota:R`Le due trappole di Bernoulli: (1) dividere per $y^n$ <b>perde</b> la soluzione costante $y\equiv0$ — recuperala a mano; (2) sbagliare il segno di $z'$ dalla regola di derivazione. Scrivi sempre $z'=(1-n)y^{-n}y'$ esplicitamente.`},
  {t:'esercizio', title:'Esercizio 3 — Eulero (il ponte)', src:'Tipo Terracina · equazione indiciale',
   testo:R`Risolvi $x^2 y''+2xy'-6y=0$ per $x\gt0$.`,
   steps:[
    {label:'Equazione indiciale', body:R`<p>Prova $y=x^m$: $m(m-1)+2m-6=0\Rightarrow m^2+m-6=0\Rightarrow(m+3)(m-2)=0$, radici $m=2,-3$.</p>`},
    {label:'Soluzione generale', body:R`<p>$$y=c_1 x^2+c_2 x^{-3}.\qquad\blacksquare$$ Due radici reali distinte, due potenze indipendenti. Con la sostituzione $x=e^t$ diventerebbe $\ddot y+\dot y-6y=0$, caratteristica $\lambda^2+\lambda-6=0$, stesse radici: la conferma che Eulero È una coefficienti-costanti travestita.</p>`}
   ],
   nota:R`Se le radici indiciali fossero state complesse $\alpha\pm i\beta$, la soluzione sarebbe $x^\alpha\big(c_1\cos(\beta\ln x)+c_2\sin(\beta\ln x)\big)$ — le oscillazioni sono in $\ln x$, non in $x$. Se doppia $m$: $x^m(c_1+c_2\ln x)$.`},
  {t:'esercizio', title:'Esercizio 4 — analisi qualitativa completa', src:'Tipo Terracina · ritratto di fase 2D',
   testo:R`Per il sistema $\dot x=y,\ \dot y=-x+x^3$ (senza smorzamento), trova gli equilibri, linearizza e classificali.`,
   steps:[
    {label:'Equilibri', body:R`<p>$\dot x=0\Rightarrow y=0$; $\dot y=0\Rightarrow-x+x^3=x(x^2-1)=0\Rightarrow x=0,\pm1$. Tre equilibri: $(0,0),(1,0),(-1,0)$.</p>`},
    {label:'Jacobiana', body:R`<p>$J=\begin{pmatrix}\partial_x\dot x&\partial_y\dot x\\\partial_x\dot y&\partial_y\dot y\end{pmatrix}=\begin{pmatrix}0&1\\-1+3x^2&0\end{pmatrix}.$</p>`},
    {label:'Classifica ogni equilibrio', body:R`<p><b>$(0,0)$:</b> $J=\begin{pmatrix}0&1\\-1&0\end{pmatrix}$, $\tau=0,\delta=1$ → autovalori $\pm i$ → <b>CENTRO</b> (attenzione: linearizzazione ambigua, ma qui il sistema è conservativo e il centro è vero). <b>$(\pm1,0)$:</b> $J=\begin{pmatrix}0&1\\2&0\end{pmatrix}$, $\tau=0,\delta=-2\lt0$ → autovalori $\pm\sqrt2$ reali opposti → <b>SELLA</b>, instabili. $\blacksquare$</p>
    <div class="note">Il ritratto: un centro al pozzo di potenziale in $0$ (oscillazioni) circondato da due selle in $\pm1$ (le cime delle barriere). È il &laquo;doppio pozzo&raquo;, archetipo delle transizioni e del tunneling in QM.</div>`}
   ],
   nota:R`Per i sistemi <b>conservativi</b> (come questo, $\ddot x=-V'(x)$ con $V=\tfrac{x^2}{2}-\tfrac{x^4}{4}$) i centri predetti dalla linearizzazione sono <b>affidabili</b>, perché l&rsquo;energia conservata forza orbite chiuse. È l&rsquo;eccezione alla cautela sui centri: quando c&rsquo;è una quantità conservata, il centro tiene.`},
  {t:'collaudo', title:'Controllo lampo finale', items:[
   {q:R`Davanti a un&rsquo;EDO d&rsquo;esame, qual è la prima domanda da farti?`,
    a:R`&laquo;Devo risolverla o analizzarla?&raquo; Se chiede una soluzione: riconosci il tipo (separabile / lineare / Bernoulli / coeff. costanti / Eulero) e applica la ricetta. Se chiede il comportamento (equilibri, stabilità, ritratto): non risolvere — trova i punti fissi, linearizza (Jacobiana), classifica dagli autovalori. Confondere i due approcci fa perdere tempo su un&rsquo;equazione che magari non si risolve in forma chiusa.`},
   {q:R`Cosa hanno in comune l&rsquo;equazione caratteristica (coeff. costanti), l&rsquo;indiciale (Eulero) e gli autovalori (sistemi)?`,
    a:R`Sono la <b>stessa idea</b>: cercare soluzioni della forma $e^{\lambda t}$ (o $x^m$) trasforma l&rsquo;equazione differenziale in un&rsquo;equazione <b>algebrica</b> per l&rsquo;esponente. Gli esponenti/autovalori codificano il comportamento (crescita, decadimento, oscillazione). È il primo assaggio dell&rsquo;analisi <b>spettrale</b> (nucleo 16): diagonalizzare l&rsquo;evoluzione.`}
  ]}
]},

/* ---------------- 06 · IL SENSO E LE ROTTE FISICHE ---------------- */
{ num:'06', title:'Il senso e le rotte fisiche', meta:'lo spazio delle fasi · Liouville e l&rsquo;ergodicità · la freccia del tempo verso la tesi',
  blocchi:[
  {t:'prosa', title:'Perché tutta la fisica è un ritratto di fase', tag:'significato', html:R`
  <p>L&rsquo;idea che $\dot{\mathbf x}=\mathbf F(\mathbf x)$ sia un campo di velocità nello <b>spazio degli stati</b> è forse la più importante di tutto il percorso, perché la fisica <b>è fatta cosÀ</b>.</p>
  <ul>
  <li><b>Meccanica.</b> Lo stato di un sistema è $(q,p)$ — posizione e impulso — e le equazioni di Hamilton $\dot q=\partial_p H,\ \dot p=-\partial_q H$ sono un campo vettoriale sullo <b>spazio delle fasi</b>. Il ritratto di fase È la dinamica: i centri sono i moti legati, le selle i punti di equilibrio instabile, le separatrici le soglie.</li>
  <li><b>Il pendolo</b> che hai disegnato è letteralmente il sistema meccanico più studiato, e i suoi due tipi di equilibrio (fuoco stabile in basso, sella in cima) sono la grammatica di ogni problema di stabilità.</li>
  <li><b>Sistemi dinamici e caos.</b> In tre o più dimensioni le traiettorie possono non chiudersi né convergere: nasce il <b>caos deterministico</b> (sensibilità alle condizioni iniziali, esponenti di Lyapunov), pur restando l&rsquo;evoluzione perfettamente unica.</li>
  </ul>`},
  {t:'prosa', title:'Liouville: il volume delle fasi non si comprime', tag:'il ponte alla statistica', html:R`
  <p>Un fatto che sembra tecnico e invece è il cardine della meccanica statistica: il flusso hamiltoniano <b>conserva il volume</b> nello spazio delle fasi. In linguaggio di questo nucleo, il campo $\mathbf F=(\partial_p H,-\partial_q H)$ ha <b>divergenza nulla</b> (nucleo 4): $$\nabla\!\cdot\!\mathbf F=\frac{\partial}{\partial q}\frac{\partial H}{\partial p}+\frac{\partial}{\partial p}\left(-\frac{\partial H}{\partial q}\right)=H_{pq}-H_{qp}=0$$ per Schwarz. È il <b>teorema di Liouville</b>: le traiettorie non hanno né sorgenti né pozzi nello spazio delle fasi, un pacchetto di stati iniziali si deforma ma non cambia volume. Da qui nasce la misura microcanonica e l&rsquo;idea di <b>ergodicità</b> — che nel tempo lungo un sistema visiti uniformemente la superficie di energia costante.</p>`},
  {t:'prolessi', title:'Prolessi — dal ritratto di fase alla freccia del tempo',
   oggetto:R`Un&rsquo;equazione $\dot{\mathbf x}=\mathbf F(\mathbf x)$ come <b>campo di velocità nello spazio degli stati</b>: equilibri, stabilità, e il volume delle fasi conservato (divergenza nulla del flusso hamiltoniano).`,
   rotte:[
    {dove:'Meccanica<br>classica', txt:R`Le equazioni di Hamilton <b>sono</b> un ritratto di fase su $(q,p)$; punti fissi = equilibri, centri = moti legati, selle = equilibri instabili. Il pendolo di questo nucleo è il caso di scuola.`},
    {dove:'Meccanica<br>statistica', txt:R`Liouville ($\nabla\!\cdot\!v=0$, il tuo nucleo 4) conserva il volume delle fasi: è la base della misura microcanonica e dell&rsquo;<b>ergodicità</b>. La statistica nasce dal rinunciare a seguire la singola traiettoria e misurare volumi.`},
    {dove:'Meccanica<br>quantistica', txt:R`L&rsquo;evoluzione $\dot{|\psi\rangle}=-\tfrac{i}{\hbar}H|\psi\rangle$ è un sistema lineare i cui &laquo;autovalori&raquo; sono le energie: diagonalizzare $H$ È trovare il ritratto di fase quantistico. Il &laquo;centro&raquo; conservativo diventa l&rsquo;evoluzione unitaria che conserva la norma.`}
   ],
   domanda:R`Quando un sistema deterministico &laquo;dimentica&raquo; le sue condizioni iniziali? Le equazioni sono reversibili e conservano il volume (Liouville), eppure il caffè si raffredda e non si riscalda mai da solo. La domanda che porti alla tesi: come nasce l&rsquo;<b>irreversibilità</b> termodinamica da una dinamica microscopicamente reversibile? La sensibilità alle condizioni iniziali (esponenti di Lyapunov) produce <b>mescolamento</b>, e il mescolamento è il ponte fra il ritratto di fase reversibile e la freccia del tempo — il filo che, via il paradosso di Loschmidt, arriva a ETH e alla decoerenza.`}
]}

];

var byId = {}; TAPPE.forEach(function(s){ byId[s.num]=s; });

var VKEY='pm-nucleo04-visited';
function loadSeen(){ try{ return new Set(JSON.parse(localStorage.getItem(VKEY)||'[]')); }catch(e){ return new Set(); } }
function saveSeen(s){ try{ localStorage.setItem(VKEY, JSON.stringify(Array.from(s))); }catch(e){} }
var SEEN = loadSeen();

function renderNav(active){
  var nav=document.getElementById('sidebar');
  nav.innerHTML='';
  var h=document.createElement('h2'); h.textContent='Nucleo 06 · le tappe'; nav.appendChild(h);
  TAPPE.forEach(function(s){
    var b=document.createElement('button');
    b.className='navitem'+(active===s.num?' active':'')+(SEEN.has(s.num)?' seen':'');
    b.innerHTML='<span class="dot"></span><span class="nx">'+s.num+'</span><span>'+s.title+'</span>';
    b.onclick=function(){ showTappa(s.num); };
    nav.appendChild(b);
  });
}

/* ---- renderer dei blocchi ---- */
function sectionProsa(title, tag, html){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var body=elFromHTML('<div class="open-body">'+html+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function sectionGram(title, rows){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag gramtag">grammatica</span></h3>';
  var inner='<table class="gramtab">';
  rows.forEach(function(r){ inner+='<tr><td class="gs">'+r[0]+'</td><td>'+r[1]+'</td></tr>'; });
  inner+='</table>';
  var body=elFromHTML('<div class="gramwrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
/* --- blocco PLOT: la figura non decora, si legge. Ogni plot porta una chiave di lettura. --- */
function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';
  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
    else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
    else if(b.t==='prolessi') m.appendChild(sectionProlessi(b));
    else if(b.t==='reveal')m.appendChild(sectionReveal(b.title,b.tag,b.steps));
    else if(b.t==='esercizio') m.appendChild(sectionEsercizio(b));
    else if(b.t==='collaudo')  m.appendChild(sectionCollaudo(b.title,b.items));
    else if(b.t==='plot')      m.appendChild(sectionPlot(b));
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}

/* deep-link: 04-campi-vettoriali.html#03 apre direttamente la tappa 03 */
window.addEventListener('DOMContentLoaded', function(){
  var h=(location.hash||'').replace('#','');
  showTappa(byId[h]?h:'00');
});
window.addEventListener('hashchange', function(){
  var h=(location.hash||'').replace('#','');
  if(byId[h]) showTappa(h);
});
