var CORSO = 'elettromagnetismo';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["equazione-delle-onde"] = {"nome":"Equazione delle onde","riga":"L'equazione $\\partial_t^{2}u=c^{2}\\nabla^{2}u$, le cui soluzioni sono profili che traslano con velocità $c$ senza cambiare forma.","serve":"Riconoscerla è già metà del lavoro: qualunque campo la soddisfi si propaga a velocità $c$, e in una dimensione ogni soluzione è la somma di un profilo che va a destra e uno che va a sinistra, $u=f(x-ct)+g(x+ct)$ (d'Alembert). La costante $c^{2}$ si legge dai coefficienti, e questo è il modo in cui in fisica la velocità di un'onda si SCOPRE invece di postularla — non serve sapere in anticipo che cosa si sta propagando.","esempio":"L'onda piana $u(x,t)=\\cos(kx-\\omega t)$ la risolve esattamente quando $\\omega=ck$: le due derivate seconde valgono $\\partial_t^{2}u=-\\omega^{2}u$ e $\\partial_x^{2}u=-k^{2}u$, e sostituendo nell'equazione i due membri si cancellano solo con quella relazione fra $\\omega$ e $k$.","pieno":{"file":"17-edp.html","tappa":"03","come":"d'Alembert, il cono di luce e la differenza fra propagazione e diffusione, nel nucleo delle EDP della fisica"},"qui":{"elettromagnetismo":{"serve":"È il punto d'arrivo del corso. Prendendo il rotore delle due equazioni di Maxwell col rotore, nel vuoto e senza sorgenti, ogni componente di $\\mathbf E$ e di $\\mathbf B$ obbedisce alla stessa equazione delle onde. Non si è aggiunta nessuna ipotesi: la velocità esce da due costanti misurate in laboratorio con magneti e condensatori, e coincide con quella della luce. Per questo il conto è un argomento e non un esercizio — è il momento in cui l'ottica diventa un capitolo dell'elettromagnetismo.","esempio":"Il conto lascia per ogni componente la forma $\\nabla^{2}E=\\mu_0\\varepsilon_0\\,\\partial_t^{2}E$, che confrontata con la forma standard dà $c=\\dfrac{1}{\\sqrt{\\mu_0\\varepsilon_0}}$. Con quel $c$, l'onda piana $\\cos\\!\\left(kx-\\dfrac{k}{\\sqrt{\\mu_0\\varepsilon_0}}\\,t\\right)$ la risolve identicamente, per ogni $k$: la propagazione non seleziona una frequenza, e il vuoto non disperde."}},"controllo":[{"tipo":"derivata","espr":"cos(k*x-w*t)","rispetto":["t","t"],"vale":"-w**2*cos(k*x-w*t)","dove":"esempio","appare":"-\\omega^{2}u"},{"tipo":"derivata","espr":"cos(k*x-w*t)","rispetto":["x","x"],"vale":"-k**2*cos(k*x-w*t)","dove":"esempio","appare":"-k^{2}u"},{"tipo":"uguale","sinistra":"diff(cos(k*x-c*k*t),t,t)-c**2*diff(cos(k*x-c*k*t),x,x)","vale":"0","dove":"esempio","appare":"\\omega=ck"},{"tipo":"uguale","sinistra":"diff(cos(k*x-k/sqrt(m0*e0)*t),x,x)-m0*e0*diff(cos(k*x-k/sqrt(m0*e0)*t),t,t)","vale":"0","ipotesi":{"m0":"positive","e0":"positive"},"dove":"qui.elettromagnetismo.esempio","appare":"\\mu_0\\varepsilon_0\\,\\partial_t^{2}"}]};
STRUM["trasformata-di-fourier"] = {"nome":"Trasformata di Fourier","riga":"L'operazione $\\hat f(k)=\\int f(x)\\,e^{-ikx}\\,dx$, che riscrive una funzione come sovrapposizione di onde piane e manda la derivata in una moltiplicazione per $ik$.","serve":"È lo strumento che rende ALGEBRICA un'equazione differenziale lineare a coefficienti costanti: con $\\partial_x$ che diventa $ik$, un'equazione differenziale in $x$ diventa un'equazione algebrica in $k$, si risolve, e si antitrasforma. Le due cose da non perdere sono la convenzione dei $2\\pi$, che cambia da testo a testo e va dichiarata una volta, e Plancherel, che dice che la trasformata conserva la norma $L^{2}$ — in fisica, l'energia.","esempio":"La gaussiana $f(x)=e^{-x^{2}/2}$ ha trasformata $\\int_{-\\infty}^{+\\infty}e^{-x^{2}/2}e^{-ikx}\\,dx=\\sqrt{2\\pi}\\,e^{-k^{2}/2}$: ancora una gaussiana, tanto più larga quanto l'originale è stretta. È il caso in cui si vede meglio il principio di indeterminazione come fatto puramente matematico.","pieno":{"file":"15-distribuzioni.html","tappa":"02","come":"le proprietà, la derivata che diventa un prodotto e Plancherel, nel nucleo delle distribuzioni"},"qui":{"elettromagnetismo":{"serve":"Serve appena si scrive un'onda generica invece di una monocromatica: ogni soluzione delle equazioni di Maxwell nel vuoto è una sovrapposizione di onde piane $e^{i(\\mathbf k\\cdot\\mathbf x-\\omega t)}$, e la trasformata è il modo di scomporla. Su ciascuna componente l'equazione delle onde si riduce alla relazione di dispersione, e la propagazione diventa un far girare fasi: ogni modo viaggia da solo, e nel vuoto tutti alla stessa velocità — per questo un impulso non si deforma.","esempio":"La sostituzione $\\partial_x\\to ik$ e $\\partial_t\\to-i\\omega$ manda le derivate seconde in $(ik)^{2}=-k^{2}$ e $(-i\\omega)^{2}=-\\omega^{2}$: l'equazione delle onde diventa $\\omega^{2}=c^{2}k^{2}$, cioè un'equazione di secondo grado al posto di una differenziale, e la sua radice positiva $\\omega=ck$ è la relazione di dispersione del vuoto."}},"controllo":[{"tipo":"integrale","espr":"exp(-x**2/2)*exp(-I*k*x)","var":"x","da":"-oo","a":"oo","vale":"sqrt(2*pi)*exp(-k**2/2)","ipotesi":{"k":"real"},"dove":"esempio","appare":"\\sqrt{2\\pi}\\,e^{-k^{2}/2}"},{"tipo":"uguale","sinistra":"(I*k)**2","vale":"-k**2","ipotesi":{"k":"real"},"dove":"qui.elettromagnetismo.esempio","appare":"-k^{2}"},{"tipo":"uguale","sinistra":"(-I*w)**2","vale":"-w**2","ipotesi":{"w":"real"},"dove":"qui.elettromagnetismo.esempio","appare":"-\\omega^{2}"},{"tipo":"uguale","sinistra":"(c*k)**2","vale":"c**2*k**2","dove":"qui.elettromagnetismo.esempio","appare":"c^{2}k^{2}"}]};
STRUM["flusso-di-un-campo"] = {"nome":"Flusso di un campo","riga":"L'integrale $\\iint_S\\mathbf F\\cdot\\hat n\\,dS$: quanta parte del campo attraversa la superficie, contata col segno che l'orientazione stabilisce.","serve":"Traduce «quanto passa attraverso» in un numero, e il numero dipende da due scelte che vanno dichiarate entrambe: la superficie e il verso della normale. Su una superficie chiusa la convenzione è normale uscente, e allora un flusso positivo significa che dentro c'è una sorgente netta. Dove il campo è parallelo alla superficie il contributo è nullo: conta solo la componente normale, mai il modulo.","esempio":"Per il campo radiale $\\mathbf F=\\mathbf r$ sulla sfera di raggio $R$ la normale uscente è $\\hat r$, e la componente normale vale $R$ in ogni punto, costante: il flusso è quel valore per l'area, $\\Phi=R\\cdot4\\pi R^{2}=4\\pi R^{3}$. Per $R=2$ fa $32\\pi$.","pieno":{"file":"03-curve-superfici.html","tappa":"04","come":"la definizione, il ruolo dell'orientazione e l'indipendenza dalla parametrizzazione, nel nucleo su curve e superfici"},"qui":{"elettromagnetismo":{"serve":"Il flusso di $\\mathbf E$ attraverso una superficie chiusa è l'unica cosa che la legge di Gauss controlla: dice quanto esce in totale, non quanto vale $\\mathbf E$ punto per punto. Da un solo numero si risale al campo soltanto se si sa già in che direzione punta e da cosa dipende — e quello lo decide la simmetria della distribuzione, non il teorema. Per questo la superficie si sceglie: dove $\\mathbf E$ è costante e normale, il flusso diventa modulo per area.","esempio":"Per una carica puntiforme $q$ al centro di una sfera di raggio $R$ il campo ha modulo $\\dfrac{q}{4\\pi\\varepsilon_0R^{2}}$ ed è ovunque normale alla sfera, quindi $\\Phi=\\dfrac{q}{4\\pi\\varepsilon_0R^{2}}\\cdot4\\pi R^{2}=\\dfrac{q}{\\varepsilon_0}$: il raggio è sparito. È il motivo per cui la legge di Gauss è una legge e non un conto — vale per qualunque superficie chiusa che racchiuda la carica."}},"controllo":[{"tipo":"uguale","sinistra":"R*4*pi*R**2","vale":"4*pi*R**3","dove":"esempio","appare":"4\\pi R^{3}"},{"tipo":"uguale","sinistra":"4*pi*2**3","vale":"32*pi","dove":"esempio","appare":"32\\pi"},{"tipo":"uguale","sinistra":"q/(4*pi*e0*R**2)*4*pi*R**2","vale":"q/e0","dove":"qui.elettromagnetismo.esempio","appare":"\\dfrac{q}{\\varepsilon_0}"},{"tipo":"derivata","espr":"q/(4*pi*e0*R**2)*4*pi*R**2","rispetto":["R"],"vale":"0","dove":"qui.elettromagnetismo.esempio","appare":"il raggio è sparito"}]};

/* ---------------- 00 · DI COSA PARLA QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Di cosa parla questo movimento', meta:'Elettromagnetismo · voce C.5 · il campo si stacca dalle sorgenti e va per conto suo',
  blocchi:[
  {t:'prosa', title:'Il salto concettuale', tag:'architettura', html:R`
  <p>In tutti i movimenti precedenti i campi erano <b>prodotti da qualcosa</b>: cariche, correnti, magneti. Se le sorgenti sparivano, i campi sparivano con loro.</p>
  <p>Con le equazioni complete (em-11) questo non è più vero. <b>$\vec E$ che varia genera $\vec B$; $\vec B$ che varia genera $\vec E$</b>: i due si sostengono a vicenda e possono propagarsi nel vuoto assoluto, lontanissimi da qualunque carica, indefinitamente. Un&rsquo;onda elettromagnetica partita da una stella un miliardo di anni fa viaggia ancora, e la stella può nel frattempo essere esplosa.</p>
  <p><b>Questo è il punto in cui «il campo» smette di essere un artificio di calcolo</b> per descrivere l&rsquo;azione fra cariche e diventa un oggetto fisico con vita propria: porta energia (em-06), porta quantità di moto, e in teoria quantistica porterà anche particelle. La domanda di em-06 — «dove sta l&rsquo;energia?» — qui ha una sola risposta possibile.</p>`}
]},

/* ---------------- 01 · L'ONDA PIANA ---------------- */
{ num:'01', title:'Londa piana: trasversale, e con E e B legati da c', meta:'la soluzione · perche e trasversale · perche E = cB · e perche sono in fase',
  blocchi:[
  {t:'prosa', title:'La soluzione, e le tre proprieta che ne discendono', tag:'costruzione', html:R`
  <p>Quella ricavata in em-11 è l&rsquo;<span class="str" data-str="equazione-delle-onde">equazione delle onde</span> di d&rsquo;Alembert, $\nabla^2\vec E=\dfrac{1}{c^2}\dfrac{\partial^2\vec E}{\partial t^2}$, una per ciascuna componente dei due campi. Ammette soluzioni della forma
  $$\vec E=\vec E_0\sin(kx-\omega t),\qquad \vec B=\vec B_0\sin(kx-\omega t),\qquad \omega=ck.$$
  Sostituendole nelle quattro equazioni di Maxwell si ottengono tre vincoli, e sono tutto il contenuto di questa tappa:</p>
  <ol>
   <li><b>trasversalità</b>: da $\nabla\cdot\vec E=0$ segue $\vec k\cdot\vec E_0=0$, e da $\nabla\cdot\vec B=0$ segue $\vec k\cdot\vec B_0=0$. <b>Nessuno dei due campi ha componente lungo la direzione di propagazione.</b> Non è un&rsquo;ipotesi: viene dal fatto che nel vuoto non ci sono sorgenti;</li>
   <li><b>ortogonalità</b>: dalla legge di Faraday segue $\vec B_0=\dfrac{\vec k\times\vec E_0}{\omega}$, quindi $\vec E\perp\vec B\perp\vec k$ e la terna è destrorsa;</li>
   <li><b>rapporto delle ampiezze</b>: dalla stessa relazione, $E_0=cB_0$. <b>In unità SI il campo magnetico di un&rsquo;onda è numericamente piccolissimo</b> — un fattore $3\times10^8$ sotto — e per questo l&rsquo;interazione della luce con la materia è quasi sempre dominata dal campo elettrico.</li>
  </ol>
  <p><b>E sono in fase</b>: si annullano insieme e sono massimi insieme. È un punto che confonde, perché suggerisce che nell&rsquo;istante in cui entrambi sono nulli l&rsquo;energia sia sparita. Non è così: l&rsquo;energia si è spostata, non annullata — nei punti vicini i campi sono massimi, e l&rsquo;onda <i>trasporta</i>. <b>Un&rsquo;onda progressiva non è un oscillatore</b>, dove l&rsquo;energia si scambia fra cinetica e potenziale nello stesso posto.</p>
  <p><b>Perché studiare solo l&rsquo;onda piana monocromatica non è una restrizione</b>, ed è la domanda giusta da farsi — un&rsquo;onda piana ha estensione infinita e dura da sempre, quindi non esiste. La risposta è che l&rsquo;equazione di d&rsquo;Alembert è <b>lineare</b>: le soluzioni si sommano. E la <span class="str" data-str="trasformata-di-fourier">trasformata di Fourier</span> dice che <i>qualunque</i> soluzione si scrive come sovrapposizione continua di onde piane, $\vec E(\vec r,t)=\displaystyle\int\!\tilde{\vec E}(\vec k)\,e^{i(\vec k\cdot\vec r-\omega t)}\,d^3k$. L&rsquo;onda piana non è il caso particolare che si studia per pigrizia: è la <b>base</b> in cui si sviluppa tutto il resto — un impulso laser, la luce di una stella, un pacchetto d&rsquo;onda.</p>
  <p>Due conseguenze che l&rsquo;esame usa. Primo: <b>un impulso corto è necessariamente largo in frequenza</b> — è la relazione $\Delta\omega\,\Delta t\gtrsim1$, che in meccanica quantistica, moltiplicata per $\hbar$, diventerà il principio di indeterminazione senza cambiare una riga di matematica. Secondo: nel vuoto tutte le componenti viaggiano alla stessa $c$ e il pacchetto <i>non si deforma</i>; in un mezzo dispersivo, dove $\omega(k)$ non è più lineare, si allarga — ed è lì che velocità di fase e velocità di gruppo smettono di coincidere. <b>Il trattamento completo di questo strumento è in Metodi</b> (movimento me-10), e questo è il punto in cui i due corsi si toccano.</p>`}
]},

/* ---------------- 02 · L'ENERGIA ---------------- */
{ num:'02', title:'Lenergia trasportata, e le due meta esattamente uguali', meta:'u = e0E^2/2 + B^2/2mu0 · perche i due termini si eguagliano · i valori medi',
  blocchi:[
  {t:'prosa', title:'Il fatto notevole', tag:'idea', html:R`
  <p>La densità di energia del campo elettromagnetico è la somma dei due contributi trovati in em-06 ed em-10:
  $$u=\frac{\varepsilon_0E^{2}}{2}+\frac{B^{2}}{2\mu_0}.$$
  In un&rsquo;onda piana, con $B=E/c$ e $c=1/\sqrt{\varepsilon_0\mu_0}$, il secondo termine diventa
  $$\frac{B^{2}}{2\mu_0}=\frac{E^{2}/c^{2}}{2\mu_0}=\frac{\varepsilon_0\mu_0E^{2}}{2\mu_0}=\frac{\varepsilon_0E^{2}}{2}.$$
  <b>I due termini sono identici, istante per istante e punto per punto</b>: <i>le due densità sono uguali</i>, e l&rsquo;energia è ripartita a metà esatta fra campo elettrico e campo magnetico. Quindi $u=\varepsilon_0E^{2}$, e il valor medio su un periodo è $\langle u\rangle=\dfrac{\varepsilon_0E_0^{2}}{2}$, di cui $\dfrac{\varepsilon_0E_0^{2}}{4}$ elettrica e altrettanta magnetica.</p>
  <div class="note"><b>Non è una coincidenza numerica</b>, ed è utile sapere da dove viene: l&rsquo;equipartizione fra i due campi discende direttamente dal fatto che $E_0=cB_0$, che a sua volta discende dalla legge di Faraday. <b>In un&rsquo;onda stazionaria non vale</b> — lì i due campi sono sfasati di un quarto di periodo e l&rsquo;energia oscilla avanti e indietro fra le due forme, come in un circuito LC. Il fatto che in un&rsquo;onda progressiva restino uguali è la firma del trasporto.</div>`}
]},

/* ---------------- 03 · IL VETTORE DI POYNTING ---------------- */
{ num:'03', title:'Il vettore di Poynting: dove va lenergia, e quanta', meta:'la definizione · il teorema di Poynting come bilancio · lintensita media · il resistore visto da fuori',
  blocchi:[
  {t:'prosa', title:'La definizione e il bilancio', tag:'costruzione', html:R`
  <p>Si definisce
  $$\vec S=\frac{\vec E\times\vec B}{\mu_0}\qquad[\text{W/m}^2],$$
  e manipolando le equazioni di Maxwell si dimostra il <b>teorema di Poynting</b>:
  $$\frac{\partial u}{\partial t}+\nabla\cdot\vec S=-\vec J\cdot\vec E.$$
  <b>È un&rsquo;equazione di continuità per l&rsquo;energia</b> — la stessa struttura di em-07 per la carica — con un termine sorgente: $\vec J\cdot\vec E$ è la potenza ceduta alla materia (l&rsquo;effetto Joule di em-07, con il segno che dice «energia che esce dal campo»). <b>$\vec S$ è quindi il flusso di energia</b>: quanta ne attraversa una superficie, e in che direzione.</p>
  <p>Per un&rsquo;onda piana $\vec S$ punta lungo $\vec k$ — l&rsquo;energia viaggia con l&rsquo;onda — e il suo valor medio è l&rsquo;<b>intensità</b>:
  $$I=\langle S\rangle=\frac{E_0^{2}}{2\mu_0c}=\frac{\varepsilon_0cE_0^{2}}{2}=c\,\langle u\rangle.$$
  <b>L&rsquo;ultima uguaglianza è la lettura migliore</b>: l&rsquo;intensità è la densità di energia moltiplicata per la velocità con cui scorre, esattamente come la portata di un fiume è densità per velocità.</p>`},
  {t:'prosa', title:'Il resistore, e la sorpresa che chiude em-07', tag:'idea', html:R`
  <p>Un filo cilindrico percorso da corrente, con una differenza di potenziale ai capi. Sulla sua superficie il campo elettrico ha una componente <b>lungo</b> il filo ($E=\rho J$, da em-07) e il campo magnetico è <b>tangenziale</b> (da em-08). Il prodotto vettoriale $\vec E\times\vec B$ punta quindi <b>verso l&rsquo;interno del filo</b>, radialmente.</p>
  <p>Calcolando il flusso di $\vec S$ entrante attraverso la superficie laterale si ottiene esattamente $RI^{2}$: <b>tutta la potenza dissipata nel resistore entra dai fianchi, portata dal campo che lo circonda</b>. Non arriva lungo il filo insieme agli elettroni.</p>
  <p>È la risposta alla domanda lasciata aperta in em-07, ed è controintuitiva al punto che vale la pena ripeterla: <b>i fili non trasportano l&rsquo;energia, la guidano</b>. L&rsquo;energia viaggia nel campo attorno ai conduttori. <b>È anche il motivo per cui un cavo coassiale funziona</b> — l&rsquo;energia scorre nell&rsquo;intercapedine fra i due conduttori, non nel rame — e perché ad alta frequenza la disposizione dei conduttori conta più della loro sezione.</p>`}
]},

/* ---------------- 04 · QUANTITÀ DI MOTO E PRESSIONE ---------------- */
{ num:'04', title:'La luce spinge: quantita di moto e pressione di radiazione', meta:'p = U/c · assorbimento contro riflessione · gli ordini di grandezza · le vele solari',
  blocchi:[
  {t:'prosa', title:'Il conto, e i due casi', tag:'regola operativa', html:R`
  <p>Un&rsquo;onda che trasporta energia $U$ trasporta anche quantità di moto
  $$p=\frac{U}{c},$$
  e questo produce una <b>pressione di radiazione</b>. Due casi, e la differenza è un fattore due:</p>
  <ul>
   <li><b>superficie assorbente</b>: tutta la quantità di moto viene ceduta, $P_{\text{rad}}=\dfrac{I}{c}$;</li>
   <li><b>superficie riflettente</b>: la quantità di moto viene invertita, quindi la variazione è doppia, $P_{\text{rad}}=\dfrac{2I}{c}$.</li>
  </ul>
  <p><b>Gli ordini di grandezza spiegano perché non ce ne accorgiamo mai.</b> La luce solare al livello del suolo ha $I\simeq1000$ W/m², quindi una pressione di circa $3\times10^{-6}$ Pa — <b>dieci miliardi di volte meno della pressione atmosferica</b>. Su una vela di un chilometro quadrato, però, fanno qualche newton che spinge <i>senza consumare carburante</i>: è il principio delle <b>vele solari</b>, e sono già state volate.</p>
  <div class="note"><b>Dove invece è dominante:</b> dentro le stelle massicce la pressione di radiazione regge una frazione importante del peso, e sopra un certo limite (luminosità di Eddington) soffia via gli strati esterni — è ciò che pone un tetto alla massa delle stelle. <b>È anche il meccanismo dietro le code delle comete</b>, che puntano sempre in direzione opposta al Sole indipendentemente dal moto della cometa. Chi farà Astrofisica ritrova questo conto al primo capitolo.</div>`}
]},

/* ---------------- 04b · ESERCIZI ---------------- */
{ num:'04b', title:'Esercizi — tocca a te', meta:'dal laser allintensita e al campo · la pressione su una vela · quanto spinge davvero la luce',
  blocchi:[
  {t:'esercizio', title:'1 · Dal fascio laser al campo elettrico',
   src:'il conto piu frequente su questo argomento: si da una potenza, si chiede un campo',
   testo:R`Un laser da $P=5$ mW ha un fascio di raggio $w=0{,}5$ mm. Calcola l'intensità, l'ampiezza del campo elettrico e quella del campo magnetico, e confrontali con i campi che si incontrano in laboratorio.`,
   steps:[
    {label:'Intensita e campo', body:R`
    <p>L'intensità è il <span class="str" data-str="flusso-di-un-campo">flusso</span> di energia per unità di area, cioè potenza su area: $I=\dfrac{P}{\pi w^{2}}=\dfrac{5\cdot10^{-3}}{\pi(5\cdot10^{-4})^{2}}\simeq6{,}4\cdot10^{3}\ \mathrm{W/m^{2}}$.</p>
    <p>Per un'onda piana $I=\tfrac12\varepsilon_0cE_0^{2}$, da cui</p>
    $$E_0=\sqrt{\frac{2I}{\varepsilon_0 c}}=\sqrt{\frac{2\cdot6{,}4\cdot10^{3}}{8{,}854\cdot10^{-12}\cdot3\cdot10^{8}}}\simeq2{,}2\cdot10^{3}\ \mathrm{V/m},$$
    <p>e $B_0=E_0/c\simeq7{,}3\cdot10^{-6}$ T.</p>`},
    {label:'Il confronto, che e la parte utile', body:R`
    <p>Duemila volt al metro è un campo <b>modesto</b>: mille volte meno di quello che fa scoccare una scintilla in aria. Il campo magnetico, sette microtesla, è <b>un sesto del campo terrestre</b>. Eppure quel fascio brucia la retina in un istante.</p>
    <p><b>La lezione è sulla differenza fra campo e intensità</b>: quello che fa danno non è il valore del campo ma la potenza concentrata su una piccola area e la sua capacità di essere focalizzata ancora di più. Un campo elettrostatico dieci volte più intenso, fra le armature di un condensatore, non brucia niente — perché non trasporta energia, sta fermo. <b>È il vettore di Poynting, non il campo, la grandezza pericolosa</b>, e questo esercizio serve a fissarlo con dei numeri.</p>`}
   ]},
  {t:'esercizio', title:'2 · La vela solare, e perche non e fantascienza ma quasi',
   src:'la pressione di radiazione applicata a un caso reale',
   testo:R`Alla distanza della Terra dal Sole l'intensità della radiazione solare è $I\simeq1361\ \mathrm{W/m^2}$ (la costante solare). Calcola la pressione su una superficie perfettamente riflettente, la forza su una vela di $1\ \mathrm{km^2}$, e confrontala con il peso di una vela di massa $100$ kg.`,
   steps:[
    {label:'Pressione e forza', body:R`
    <p>Per assorbimento totale $P_{\rm rad}=I/c$; per riflessione totale la quantità di moto si inverte e la pressione <b>raddoppia</b>:</p>
    $$P_{\rm rad}=\frac{2I}{c}=\frac{2\cdot1361}{3\cdot10^{8}}\simeq9{,}1\cdot10^{-6}\ \mathrm{Pa}.$$
    <p>Su un chilometro quadrato ($10^{6}\ \mathrm{m^2}$) la forza è $F\simeq9{,}1$ N. <b>Nove newton su un chilometro quadrato di vela</b>: il peso di un litro d'acqua.</p>`},
    {label:'Perche funziona lo stesso', body:R`
    <p>Sembra ridicolo, e invece no — perché nello spazio non c'è attrito e la spinta <b>non si esaurisce</b>. Con $100$ kg di massa l'accelerazione è $a=F/m\simeq0{,}09\ \mathrm{m/s^{2}}$, un centesimo di $g$: sembra poco, ma mantenuta per un mese dà $\Delta v=a\,t\simeq0{,}09\cdot2{,}6\cdot10^{6}\simeq2{,}3\cdot10^{5}$ m/s, cioè <b>230 km/s</b>. Nessun razzo chimico arriva lontanamente a tanto, perché deve portarsi dietro il propellente.</p>
    <p><b>Il confronto che chiude il ragionamento</b>: la stessa vela sulla Terra sentirebbe un peso di $mg\simeq980$ N, cento volte la spinta. E la figura qui sotto mostra dove conviene aprirla. La pressione di radiazione è trascurabile ovunque ci sia gravità o attrito, e dominante dove non ce ne sono — ed è per questo che conta per le vele solari, per la coda delle comete (che punta sempre <i>via</i> dal Sole, non all'indietro lungo l'orbita) e per l'equilibrio interno delle stelle, dove la pressione di radiazione contrasta il collasso gravitazionale.</p>`}
   ]},
  {t:'plot', title:'Lintensita solare con la distanza, e dove una vela smette di servire',
   intro:R`Intensità della radiazione solare in funzione della distanza dal Sole, in unità astronomiche. Alla Terra ($d=1$ UA) vale $1361\ \mathrm{W/m^2}$; la legge è $1/d^{2}$ perché la potenza totale si distribuisce su sfere sempre più grandi.`,
   plots:[
    {kind:'func2d', xr:[0.3,6], yr:[0,3], height:320,
     title:'a Marte meta, a Giove un venticinquesimo: la vela va usata partendo da vicino',
     xlabel:'distanza dal Sole (UA)', ylabel:'intensita / 1361 W m^-2',
     curves:[{f:'1/(x*x)', col:'#5eead4', width:2.8, label:'I(d) = I_terra / d^2'}],
     segs:[{x1:0.3, y1:1, x2:6, y2:1, col:'#4d5a6b', dash:true, width:1.2, label:'valore alla Terra', lx:4, ly:1.08}],
     marks:[{x:0.39, y:2.63, label:'Mercurio: 6.6 volte', col:'#d8a13a', left:true},
            {x:1, y:1, label:'Terra', col:'#ffffff'},
            {x:1.52, y:0.43, label:'Marte: 43%', col:'#b98cff'},
            {x:5.2, y:0.037, label:'Giove: 3.7%', col:'#ff6b6b', up:true}]}
   ],
   leggi:R`<p><b>La curva spiega la strategia di missione di qualunque vela solare</b>: si spinge dove la luce è intensa, cioè vicino al Sole, e poi si vola per inerzia. A Giove la spinta è il $3{,}7\%$ di quella terrestre — la vela di un chilometro quadrato dell'esercizio produrrebbe $0{,}34$ N, meno del peso di una mela sulla Terra.</p>
   <p>La stessa legge $1/d^{2}$ governa <b>tutto</b> ciò che una sorgente puntiforme irradia: è la conseguenza geometrica del fatto che la potenza si conserva e la superficie della sfera cresce come $d^{2}$. Vale per la luce di una stella, per il segnale di un'antenna, per il rumore di un'esplosione. <b>È la stessa struttura del campo coulombiano</b>, e per la stessa ragione: non perché l'elettromagnetismo lo imponga, ma perché lo spazio ha tre dimensioni.</p>
   <p>Nota però la differenza con il campo elettrostatico: <b>qui a calare come $1/d^{2}$ è l'intensità, non il campo</b>. Poiché $I\propto E_0^{2}$, l'ampiezza del campo di un'onda sferica cala come $1/d$ — molto più lentamente. È il motivo per cui un segnale radio si sente lontanissimo, e la ragione tecnica per cui un'onda che si stacca dalla sorgente sopravvive mentre un campo statico no.</p>`}
]},

/* ---------------- 04a · LA DERIVAZIONE DELL EQUAZIONE D ONDA ---------------- */
{ num:'04a', title:'Il conto che tira fuori londa dalle quattro equazioni', meta:'il doppio rotore · lidentita vettoriale · perche nel vuoto si disaccoppiano · e da dove esce c',
  blocchi:[
  {t:'prosa', title:'Tre righe, e nessuna ipotesi aggiunta', tag:'derivazione', html:R`
  <p>Vale la pena fare il conto per intero, perché è il momento in cui il corso produce la sua previsione più forte e perché non richiede niente che non sia già scritto nelle quattro equazioni.</p>
  <p>Nel vuoto — niente cariche, niente correnti — le equazioni sono</p>
  $$\nabla\cdot\vec E=0,\quad \nabla\cdot\vec B=0,\quad \nabla\times\vec E=-\frac{\partial\vec B}{\partial t},\quad \nabla\times\vec B=\mu_0\varepsilon_0\frac{\partial\vec E}{\partial t}.$$
  <p><b>Il problema è che sono accoppiate</b>: ciascuna delle due leggi con il rotore lega $\vec E$ a $\vec B$. Per separarle si prende il rotore di una delle due e si usa l&rsquo;altra per eliminare il campo indesiderato. Prendendo il rotore della terza:</p>
  $$\nabla\times(\nabla\times\vec E)=-\frac{\partial}{\partial t}(\nabla\times\vec B)=-\mu_0\varepsilon_0\frac{\partial^{2}\vec E}{\partial t^{2}}.$$
  <p>A sinistra si usa l&rsquo;identità vettoriale $\nabla\times(\nabla\times\vec E)=\nabla(\nabla\cdot\vec E)-\nabla^{2}\vec E$, e il primo termine è <b>nullo</b> perché nel vuoto $\nabla\cdot\vec E=0$. Resta</p>
  $$\nabla^{2}\vec E=\mu_0\varepsilon_0\frac{\partial^{2}\vec E}{\partial t^{2}},$$
  <p>che è l&rsquo;<span class="str" data-str="equazione-delle-onde">equazione delle onde</span> con velocità $v=1/\sqrt{\mu_0\varepsilon_0}$. Ripetendo il procedimento partendo dalla quarta si ottiene la stessa equazione per $\vec B$. <b>Le due sono identiche e disaccoppiate</b>: ciascun campo obbedisce da solo a un&rsquo;equazione d&rsquo;onda, pur restando legato all&rsquo;altro dalle equazioni di partenza.</p>
  <p><b>Il punto in cui il conto smette di essere matematica.</b> Sostituendo i due valori misurati in laboratorio — $\varepsilon_0$ da esperimenti di elettrostatica con condensatori, $\mu_0$ dalla forza fra due fili percorsi da corrente —</p>
  $$\frac{1}{\sqrt{\mu_0\varepsilon_0}}=\frac{1}{\sqrt{4\pi\cdot10^{-7}\cdot8{,}854\cdot10^{-12}}}\simeq3{,}00\cdot10^{8}\ \mathrm{m/s}.$$
  <p>Due costanti che non hanno niente a che fare con la luce — una viene da cariche ferme, l&rsquo;altra da fili percorsi da corrente continua — producono la velocità della luce. <b>Maxwell scrisse che «difficilmente possiamo evitare la conclusione che la luce consista nelle ondulazioni trasversali dello stesso mezzo che è causa dei fenomeni elettrici e magnetici»</b>, e questa frase è tutto ciò che questo movimento deve consegnare.</p>
  <div class="note"><b>Perché nel vuoto e non in generale.</b> Il passaggio chiave è l&rsquo;annullarsi di $\nabla(\nabla\cdot\vec E)$, che richiede assenza di cariche. In presenza di sorgenti si ottiene un&rsquo;equazione d&rsquo;onda <i>con termine noto</i>, cioè con una sorgente che genera l&rsquo;onda invece di lasciarla libera. È la differenza fra descrivere la propagazione e descrivere l&rsquo;irraggiamento — e spiega perché una carica ferma non irradia, una in moto uniforme nemmeno, e una accelerata sì.</div>`},
  {t:'plot', title:'Londa piana: i due campi, in fase e perpendicolari',
   intro:R`$E_y$ e $cB_z$ lungo la direzione di propagazione $x$, a un istante fissato. Le due curve sono <i>sovrapposte</i>: in un'onda piana nel vuoto $E=cB$ punto per punto, sempre.`,
   plots:[
    {kind:'func2d', xr:[0,12.6], yr:[-1.3,1.3], height:320,
     title:'stessa forma, stessa fase: i massimi coincidono, e coincidono gli zeri',
     xlabel:'x (in unita di 1/k)', ylabel:'ampiezza (unita arbitrarie)',
     curves:[
      {f:'sin(x)', col:'#5eead4', width:3.0, label:'E_y'},
      {f:'0.97*sin(x)', col:'#d8a13a', width:1.8, dash:true, label:'c B_z (scalato per vederlo)'}
     ],
     segs:[{x1:0, y1:0, x2:12.6, y2:0, col:'#4d5a6b', width:1}],
     marks:[{x:1.571, y:1, label:'E e B massimi insieme', col:'#5eead4', left:true},
            {x:3.1416, y:0, label:'e nulli insieme', col:'#b98cff', up:true}]}
   ],
   leggi:R`<p><b>La cosa da notare è che le due curve non sono sfasate</b>, e questo sorprende chi arriva dall'oscillatore meccanico, dove energia cinetica e potenziale si scambiano — quando una è massima l'altra è nulla. Qui no: campo elettrico e magnetico raggiungono il massimo <i>insieme</i> e si annullano insieme.</p>
   <p>Ne segue una conseguenza che vale la pena fissare: <b>la densità di energia di un'onda non è costante nel tempo</b>, pulsa fra zero e il doppio del suo valore medio, alla frequenza doppia. L'energia non oscilla fra le due forme — <i>viaggia</i>. È il contenuto del vettore di Poynting della tappa 03: in un'onda l'energia non resta sul posto scambiandosi di natura, si sposta a velocità $c$.</p>
   <p>La curva arancione è disegnata leggermente più piccola solo per renderla visibile: in realtà coincide esattamente con la verde. <b>Se in un esercizio risulta uno sfasamento fra $\vec E$ e $\vec B$, l'onda non è piana o non è nel vuoto</b> — dentro un conduttore, per esempio, i due campi sono sfasati di $45°$, e quello sfasamento è la firma dell'assorbimento.</p>`}
]},

/* ---------------- 04c · LA POLARIZZAZIONE ---------------- */
{ num:'04c', title:'La polarizzazione: la direzione che londa si porta dietro', meta:'lineare, circolare, ellittica · la legge di Malus · perche esiste solo per le onde trasversali',
  blocchi:[
  {t:'prosa', title:'Una proprieta che le onde sonore non hanno', tag:'struttura', html:R`
  <p>L&rsquo;equazione delle onde dice che $\vec E$ oscilla perpendicolarmente alla direzione di propagazione, ma non dice <i>in quale</i> delle infinite direzioni perpendicolari. Quella scelta è la <b>polarizzazione</b>, ed è un grado di libertà in più che un&rsquo;onda longitudinale — il suono, per esempio — non possiede: lì la direzione di oscillazione è fissata da quella di propagazione, e non c&rsquo;è niente da scegliere.</p>
  <p>Fissato $\hat z$ come direzione di propagazione, il campo più generale è la somma di due componenti perpendicolari con ampiezze e fasi indipendenti:</p>
  $$\vec E=\left(E_{0x}\cos(kz-\omega t),\ E_{0y}\cos(kz-\omega t+\delta),\ 0\right).$$
  <p>Tutto dipende dallo sfasamento $\delta$ fra le due:</p>
  <ul>
   <li><b>$\delta=0$ o $\pi$</b>: le due componenti raggiungono il massimo insieme, e la somma oscilla lungo una direzione <i>fissa</i>. È la <b>polarizzazione lineare</b>, inclinata di $\arctan(E_{0y}/E_{0x})$;</li>
   <li><b>$\delta=\pm\pi/2$ con $E_{0x}=E_{0y}$</b>: quando una componente è massima l&rsquo;altra è nulla, e il vettore $\vec E$ <b>ruota</b> mantenendo modulo costante. È la <b>polarizzazione circolare</b>, destra o sinistra a seconda del segno;</li>
   <li><b>negli altri casi</b> la punta di $\vec E$ descrive un&rsquo;<b>ellisse</b>, e i due casi precedenti ne sono i limiti degeneri.</li>
  </ul>
  <p><b>Il fatto strutturale</b>: due componenti indipendenti significano <b>due stati di polarizzazione</b> per ogni direzione di propagazione, e non di più. Quando in meccanica quantistica si scoprirà che il fotone ha spin $1$ ma solo due stati di elicità invece di tre, la ragione sarà esattamente questa — la massa nulla, che qui si manifesta come trasversalità.</p>`},
  {t:'prosa', title:'La legge di Malus, e come si misura una polarizzazione', tag:'derivazione', html:R`
  <p>Un <b>polarizzatore</b> lascia passare solo la componente del campo lungo il proprio asse. Se un&rsquo;onda polarizzata linearmente con ampiezza $E_0$ incide su un polarizzatore il cui asse forma un angolo $\theta$ con la direzione di polarizzazione, esce</p>
  $$E=E_0\cos\theta\quad\Longrightarrow\quad I=I_0\cos^{2}\theta,$$
  <p>che è la <b>legge di Malus</b>. Il quadrato viene dal fatto che l&rsquo;intensità va come il quadrato del campo — è la stessa ragione per cui i decibel e i valori efficaci hanno la forma che hanno.</p>
  <p><b>Il conto che sorprende, e che si chiede spesso all&rsquo;orale.</b> Luce naturale (non polarizzata) attraverso un polarizzatore: passa il $50\%$, perché mediando $\cos^{2}\theta$ su tutte le orientazioni si ottiene $\tfrac12$. Due polarizzatori incrociati a $90°$: <b>non passa niente</b>. Ma inserendone un terzo <i>in mezzo</i>, a $45°$, la luce ricompare — e ne passa</p>
  $$I=\frac{I_0}{2}\cos^{2}45°\cdot\cos^{2}45°=\frac{I_0}{8}.$$
  <p><b>Aggiungere un ostacolo fa passare più luce</b>, ed è un risultato che sembra impossibile finché non si capisce che il polarizzatore non <i>filtra</i> soltanto: <b>proietta</b>. Il terzo elemento ruota la polarizzazione di $45°$ a costo di metà intensità, e quello che arriva al terzo polarizzatore non è più ortogonale al suo asse. È l&rsquo;esperimento classico che anticipa la misura quantistica, dove la stessa struttura — proiezione su uno stato, non selezione fra stati preesistenti — è il cuore della teoria.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Perché gli occhiali da sole polarizzati riducono i riflessi dell'asfalto e dell'acqua?`,
    a:R`Perché la luce riflessa da una superficie orizzontale è <b>parzialmente polarizzata in orizzontale</b> — la riflessione non tratta allo stesso modo le due componenti, e a un angolo particolare (angolo di Brewster) la riflessa è polarizzata al $100\%$. Un polarizzatore con asse <i>verticale</i> la taglia quasi del tutto, lasciando passare la luce diffusa dall'oggetto che si vuole vedere, che invece non ha direzione privilegiata. <b>È applicazione diretta della legge di Malus con $\theta=90°$</b>, e il motivo per cui quegli occhiali vanno tenuti dritti: inclinando la testa di novanta gradi l'effetto sparisce.`},
   {q:R`Due onde polarizzate linearmente e perpendicolari fra loro, sfasate di $\pi/2$: che cosa si ottiene, e come si torna indietro?`,
    a:R`Si ottiene un'onda <b>circolare</b>, ed è la costruzione della tappa: due oscillazioni perpendicolari in quadratura danno un moto rotatorio, esattamente come nel moto circolare uniforme della meccanica, dove $x$ e $y$ oscillano sfasate di novanta gradi. <b>La decomposizione funziona anche al contrario</b>: qualunque onda circolare si scrive come somma di due lineari, e qualunque lineare come somma di due circolari opposte. Quale delle due basi si usi è una scelta di comodo — le lineari sono comode per i polarizzatori, le circolari per l'interazione con la materia magnetizzata e per la fisica delle particelle, dove l'elicità è la grandezza naturale.`},
   {q:R`Un'onda circolarmente polarizzata trasporta momento angolare?`,
    a:R`<b>Sì</b>, e si misura: un&rsquo;onda circolare che viene assorbita da un oggetto lo mette in rotazione. La densità di momento angolare vale $\pm U/\omega$ con $U$ l'energia — cioè, per un singolo fotone di energia $\hbar\omega$, esattamente $\pm\hbar$. <b>Lo spin del fotone è già tutto qui, in una proprietà classica dell'onda</b>: l'esperimento di Beth nel 1936 lo misurò con una lamina sospesa a un filo, anni prima che il concetto fosse familiare. Oggi la stessa proprietà si usa nelle pinzette ottiche per far ruotare oggetti microscopici senza toccarli, e in astronomia per misurare i campi magnetici delle nubi interstellari dalla polarizzazione della luce che le attraversa.`}
  ]}
]},

/* ---------------- 05 · IL SENSO ---------------- */
{ num:'05', title:'Il senso, e le rotte', meta:'cosa chiude, cosa apre, e lo spettro come una sola cosa',
  blocchi:[
  {t:'prosa', title:'Cosa lascia in mano', tag:'sintesi', html:R`
  <p><b>A monte.</b> em-11 ha chiuso le equazioni; qui si risolvono nel vuoto. Le densità di energia di em-06 ed em-10, che sembravano due contabilità separate, diventano le due metà esattamente uguali di una cosa sola che viaggia.</p>
  <p><b>Il punto.</b> Radio, microonde, infrarosso, luce, ultravioletto, raggi X e gamma sono <b>la stessa onda</b> a frequenze diverse — dai chilometri ai femtometri, venti ordini di grandezza descritti dalle stesse quattro equazioni. Le differenze che vediamo (attraversa i muri, scalda, abbronza, ionizza) dipendono solo da come quella frequenza interagisce con la materia, non dalla natura dell&rsquo;onda.</p>
  <p><b>A valle.</b> em-13 fa incontrare l&rsquo;onda con le superfici e ne ricava riflessione, rifrazione e polarizzazione — cioè tutta l&rsquo;ottica; em-14 mostra perché la velocità $c$ che compare qui non può dipendere dal riferimento.</p>`},
  {t:'prolessi', title:'Dove riappare questo movimento, nella fisica che farai',
   oggetto:R`<b>L&rsquo;onda elettromagnetica</b>: energia e quantità di moto che viaggiano nel campo, senza sorgenti né mezzo.`,
   rotte:[
    {dove:'Meccanica<br>quantistica', txt:R`Quantizzando l&rsquo;onda si ottiene il <b>fotone</b>, con $E=h\nu$ e $p=E/c$ — e la seconda relazione è <i>esattamente</i> quella di questa tappa, che quindi sopravvive intatta al passaggio quantistico. L&rsquo;effetto fotoelettrico e l&rsquo;effetto Compton sono i due esperimenti che lo mostrano.`},
    {dove:'Astrofisica', txt:R`Tutto ciò che sappiamo dell&rsquo;universo lontano arriva da queste onde: spettri, righe, redshift, fondo cosmico. La <b>pressione di radiazione</b> e il limite di Eddington governano la struttura delle stelle massicce e l&rsquo;accrescimento sui buchi neri.`},
    {dove:'Relativita', txt:R`Energia e quantità di moto del campo sono componenti del <b>tensore energia-impulso</b>; la relazione $p=U/c$ è il caso a massa nulla di $E^2=(pc)^2+(mc^2)^2$. <b>La luce ha quantità di moto senza avere massa</b>, e questo è possibile solo in relatività.`},
    {dove:'Tecnologia', txt:R`Antenne, fibre ottiche, radar, comunicazioni satellitari, pinzette ottiche, raffreddamento laser: <b>ogni tecnologia che trasmette informazione senza fili</b> è questo movimento. Le pinzette ottiche usano la pressione di radiazione per spostare singole cellule.`}
   ],
   domanda:R`Un&rsquo;onda trasporta energia e quantità di moto, ma non massa, e viaggia sempre a $c$ <b>in qualunque riferimento</b> — altrimenti le equazioni di Maxwell cambierebbero forma cambiando treno. <b>Domanda che porti avanti:</b> che cosa deve succedere allo spazio e al tempo perché una velocità possa essere la stessa per tutti? La risposta costa la simultaneità assoluta, e in cambio dà $E=mc^2$. Ma c&rsquo;è una seconda domanda, più sottile, che porta ancora più lontano: se l&rsquo;energia di un&rsquo;onda può essere piccola a piacere abbassando l&rsquo;ampiezza, perché un fotomoltiplicatore <b>o vede un fotone intero o non vede niente</b>? Lì l&rsquo;elettromagnetismo classico finisce davvero.`}
]}

];

function sectionPlot(b){

  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';
  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
    else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
    else if(b.t==='prolessi') m.appendChild(sectionProlessi(b));
    else if(b.t==='reveal')m.appendChild(sectionReveal(b.title,b.tag,b.steps));
    else if(b.t==='esercizio') m.appendChild(sectionEsercizio(b));
    else if(b.t==='collaudo')  m.appendChild(sectionCollaudo(b.title,b.items));
    else if(b.t==='plot')      m.appendChild(sectionPlot(b));
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}

/* deep-link: em-12-onde.html#03 apre direttamente la tappa 03 */
window.addEventListener('DOMContentLoaded', function(){
  var h=(location.hash||'').replace('#','');
  showTappa(byId[h]?h:'00');
});
window.addEventListener('hashchange', function(){
  var h=(location.hash||'').replace('#','');
  if(byId[h]) showTappa(h);
});
</script>
