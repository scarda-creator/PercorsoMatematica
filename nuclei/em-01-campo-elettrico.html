  .gramwrap{background:var(--grambg);border:1px solid #1f4d47;border-radius:12px;padding:6px 6px;}

  /* ---- STRUMENTI (repertorio condiviso: la scheda si apre DENTRO la frase) ----

  .str{color:var(--gram);border-bottom:1px dashed var(--gram);cursor:pointer;}
  .str:hover{background:var(--grambg);}
  .str::after{content:"\2666";font-size:.62em;vertical-align:.42em;margin-left:2px;opacity:.8;}
  .str.aperto::after{content:"\2715";}
  .str.rotto{color:#ff6b6b;border-bottom-color:#ff6b6b;cursor:help;}

  .pnbtn:hover{border-color:var(--accent);background:var(--panel2);}
  .pnbtn.next{text-align:right;}
  .pnbtn .k{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .pnbtn .t{font-weight:600;color:var(--accent2);}
  .pnbtn:disabled{opacity:.35;cursor:default;border-color:var(--border);background:var(--panel);}

  code{background:var(--panel2);border:1px solid var(--border);border-radius:5px;
    padding:1px 5px;font-size:.85em;color:var(--accent2);}
  .katex{font-size:1.02em;color:var(--txt);} .katex-display{margin:.5em 0;overflow-x:auto;overflow-y:hidden;}

  @media(max-width:860px){
    .shell{flex-direction:column;}

    .sidebar h2{width:100%;} .navitem{width:auto;}
    .main{padding:20px 16px 80px;}
  }

/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un
   rimando scritto nella prosa:

       <span class="str" data-str="serie-geometrica">la serie geometrica</span>

   Le schede citate da questo nucleo sono cucite qui sotto dal montaggio
   (assembla-nucleo.js): la pagina resta autosufficiente — niente fetch,
   niente sottocartelle da pubblicare — e un rimando a una scheda che non
   esiste FERMA la costruzione invece di arrivare in pagina rotto.
   Apertura: lo stesso gesto del collaudo (si clicca, il pannello compare,
   si typeset una volta sola), portato dentro la frase.
   =================================================================== */
var CORSO = 'elettromagnetismo';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["flusso-di-un-campo"] = {"nome":"Flusso di un campo","riga":"L'integrale $\\iint_S\\mathbf F\\cdot\\hat n\\,dS$: quanta parte del campo attraversa la superficie, contata col segno che l'orientazione stabilisce.","serve":"Traduce «quanto passa attraverso» in un numero, e il numero dipende da due scelte che vanno dichiarate entrambe: la superficie e il verso della normale. Su una superficie chiusa la convenzione è normale uscente, e allora un flusso positivo significa che dentro c'è una sorgente netta. Dove il campo è parallelo alla superficie il contributo è nullo: conta solo la componente normale, mai il modulo.","esempio":"Per il campo radiale $\\mathbf F=\\mathbf r$ sulla sfera di raggio $R$ la normale uscente è $\\hat r$, e la componente normale vale $R$ in ogni punto, costante: il flusso è quel valore per l'area, $\\Phi=R\\cdot4\\pi R^{2}=4\\pi R^{3}$. Per $R=2$ fa $32\\pi$.","pieno":{"file":"03-curve-superfici.html","tappa":"04","come":"la definizione, il ruolo dell'orientazione e l'indipendenza dalla parametrizzazione, nel nucleo su curve e superfici"},"qui":{"elettromagnetismo":{"serve":"Il flusso di $\\mathbf E$ attraverso una superficie chiusa è l'unica cosa che la legge di Gauss controlla: dice quanto esce in totale, non quanto vale $\\mathbf E$ punto per punto. Da un solo numero si risale al campo soltanto se si sa già in che direzione punta e da cosa dipende — e quello lo decide la simmetria della distribuzione, non il teorema. Per questo la superficie si sceglie: dove $\\mathbf E$ è costante e normale, il flusso diventa modulo per area.","esempio":"Per una carica puntiforme $q$ al centro di una sfera di raggio $R$ il campo ha modulo $\\dfrac{q}{4\\pi\\varepsilon_0R^{2}}$ ed è ovunque normale alla sfera, quindi $\\Phi=\\dfrac{q}{4\\pi\\varepsilon_0R^{2}}\\cdot4\\pi R^{2}=\\dfrac{q}{\\varepsilon_0}$: il raggio è sparito. È il motivo per cui la legge di Gauss è una legge e non un conto — vale per qualunque superficie chiusa che racchiuda la carica."}},"controllo":[{"tipo":"uguale","sinistra":"R*4*pi*R**2","vale":"4*pi*R**3","dove":"esempio","appare":"4\\pi R^{3}"},{"tipo":"uguale","sinistra":"4*pi*2**3","vale":"32*pi","dove":"esempio","appare":"32\\pi"},{"tipo":"uguale","sinistra":"q/(4*pi*e0*R**2)*4*pi*R**2","vale":"q/e0","dove":"qui.elettromagnetismo.esempio","appare":"\\dfrac{q}{\\varepsilon_0}"},{"tipo":"derivata","espr":"q/(4*pi*e0*R**2)*4*pi*R**2","rispetto":["R"],"vale":"0","dove":"qui.elettromagnetismo.esempio","appare":"il raggio è sparito"}]};
STRUM["campo-conservativo"] = {"nome":"Campo conservativo","riga":"Un campo che è il gradiente di una funzione, $\\mathbf F=\\nabla U$, e che perciò compie lungo un cammino un lavoro deciso solo dagli estremi.","serve":"Le tre proprietà — esiste un potenziale, il lavoro non dipende dal cammino, la circuitazione su ogni chiusa è nulla — sono equivalenti, e all'esame si usa quella che costa meno. Il rotore nullo è invece una condizione soltanto NECESSARIA: diventa sufficiente unicamente se il dominio è semplicemente connesso, e dimenticare quella clausola è l'errore classico, perché il controesempio non è patologico ma è il campo attorno a un filo.","esempio":"Il campo $\\mathbf F=(2xy,\\,x^{2})$ ha potenziale $U=x^{2}y$, perché $\\partial_xU=2xy$ e $\\partial_yU=x^{2}$; quindi il lavoro da $(0,0)$ a $(1,1)$ vale $U(1,1)-U(0,0)=1$, lungo qualunque cammino si scelga fra i due punti.","pieno":{"file":"04-campi-vettoriali.html","tappa":"05","come":"le tre caratterizzazioni equivalenti, la costruzione del potenziale per integrazione e il ruolo del dominio, nel nucleo sui campi vettoriali"},"qui":{"elettromagnetismo":{"serve":"In elettrostatica $\\mathbf E$ è conservativo, e l'intero apparato del potenziale $V$ poggia su questo: il lavoro per spostare una carica da $A$ a $B$ è $q(V_A-V_B)$ qualunque strada prenda, e solo per questo ha senso parlare di energia potenziale di una configurazione. La proprietà cade appena $\\mathbf B$ varia nel tempo: per Faraday la circuitazione di $\\mathbf E$ su una chiusa vale $-\\dfrac{d\\Phi_B}{dt}$, e un campo con circuitazione non nulla non ammette potenziale scalare.","esempio":"Per la carica puntiforme, il lavoro del campo di Coulomb su una carica di prova unitaria che va da $r_1$ a $r_2$ è $\\displaystyle\\int_{r_1}^{r_2}\\dfrac{q}{4\\pi\\varepsilon_0r^{2}}\\,dr=\\dfrac{q}{4\\pi\\varepsilon_0}\\left(\\dfrac{1}{r_1}-\\dfrac{1}{r_2}\\right)$: dipende solo dai due raggi, e l'angolo percorso non compare da nessuna parte. È la stessa cosa che dire $V\\propto 1/r$."}},"controllo":[{"tipo":"derivata","espr":"x**2*y","rispetto":["x"],"vale":"2*x*y","dove":"esempio","appare":"2xy"},{"tipo":"derivata","espr":"x**2*y","rispetto":["y"],"vale":"x**2","dove":"esempio","appare":"x^{2}"},{"tipo":"uguale","sinistra":"1**2*1-0**2*0","vale":"1","dove":"esempio","appare":"=1"},{"tipo":"integrale","espr":"q/(4*pi*e0*r**2)","var":"r","da":"r1","a":"r2","vale":"q/(4*pi*e0)*(1/r1-1/r2)","ipotesi":{"r":"positive","r1":"positive","r2":"positive"},"dove":"qui.elettromagnetismo.esempio","appare":"\\left(\\dfrac{1}{r_1}-\\dfrac{1}{r_2}\\right)"}]};
STRUM["campo-vettoriale"] = {"nome":"Campo vettoriale","riga":"Una funzione che a ogni punto dello spazio associa un vettore, scritta $\\mathbf{F}(x,y,z)=F_x\\,\\hat{\\imath}+F_y\\,\\hat{\\jmath}+F_z\\,\\hat{k}$ con le tre componenti funzioni del punto.","serve":"È il modo di dire «c'è qualcosa in ogni punto dello spazio, e ha una direzione». Serve perché permette di smettere di ragionare su coppie di oggetti che si attraggono a distanza e di ragionare su una proprietà dello spazio: la sorgente prepara il campo, e chi arriva dopo sente solo ciò che trova dove si trova.","esempio":"Il campo di una carica puntiforme $q$ nell'origine è $\\mathbf{E}=\\dfrac{q}{4\\pi\\varepsilon_0 r^{2}}\\hat{r}$: la direzione è radiale, il modulo dipende solo dalla distanza. Con $q=1$ e $4\\pi\\varepsilon_0=1$, nel punto $(3,4,0)$ si ha $r=5$, quindi il modulo vale $\\tfrac{1}{25}$ e il versore è $\\left(\\tfrac35,\\tfrac45,0\\right)$: la componente lungo $x$ è $\\tfrac{3}{125}$.","pieno":{"file":"04-campi-vettoriali.html","tappa":"00","come":"la trattazione completa, nel nucleo sui campi vettoriali di Analisi Vettoriale"},"qui":{"elettromagnetismo":{"serve":"È l'oggetto che l'intero corso studia: $\\mathbf{E}$ e $\\mathbf{B}$ sono campi vettoriali, e le quattro equazioni di Maxwell sono affermazioni su come le loro derivate spaziali si legano alle sorgenti. Tutto ciò che si impara dopo — flusso, circuitazione, divergenza, rotore — è un modo di interrogare un campo vettoriale.","esempio":"Per la carica puntiforme in $(3,4,0)$ con $q=1$ e $4\\pi\\varepsilon_0=1$: $r=5$, modulo $\\tfrac{1}{25}$, e la componente lungo $x$ vale $\\tfrac{3}{125}$. Le tre componenti non sono tre campi separati: ruotando gli assi si mescolano fra loro, ed è quello che rende $\\mathbf{E}$ un vettore e non una terna di numeri."}},"controllo":[{"tipo":"uguale","sinistra":"sqrt(3**2+4**2)","vale":"5","dove":"esempio","appare":"r=5"},{"tipo":"uguale","sinistra":"1/sqrt(3**2+4**2)**2","vale":"1/25","dove":"esempio","appare":"\\tfrac{1}{25}"},{"tipo":"uguale","sinistra":"(1/5**2)*(3/5)","vale":"3/125","dove":"esempio","appare":"\\tfrac{3}{125}"},{"tipo":"uguale","sinistra":"sqrt(3**2+4**2)","vale":"5","dove":"qui.elettromagnetismo.esempio","appare":"r=5"},{"tipo":"uguale","sinistra":"(1/5**2)*(3/5)","vale":"3/125","dove":"qui.elettromagnetismo.esempio","appare":"\\tfrac{3}{125}"}]};
STRUM["simmetrie"] = {"nome":"Simmetrie","riga":"L'insieme delle trasformazioni che lasciano identica la sorgente, e che perciò devono lasciare identico anche il campo che ne nasce.","serve":"È il ragionamento che decide la FORMA del campo prima di calcolarlo, e senza il quale la legge di Gauss non serve a niente: Gauss dà un solo numero — il flusso totale — e da un numero si ricava un campo soltanto se si sa già in che direzione punta e da quali variabili dipende. L'argomento ha una forma sola: se una trasformazione lascia identica la distribuzione di carica, lascia identico il campo; quindi ogni componente che quella trasformazione cambierebbe deve essere nulla, e ogni variabile che essa sposta non può comparire.","esempio":"Per un filo infinito uniformemente carico, la traslazione lungo il filo e la rotazione attorno a esso lasciano la carica identica: $\\mathbf E$ non può dipendere né da $z$ né dall'angolo. La riflessione nel piano perpendicolare al filo manderebbe $E_z$ in $-E_z$ lasciando uguale la sorgente, quindi $E_z=0$; resta la sola componente radiale $E_r(r)$. Solo a quel punto il cilindro coassiale è la superficie giusta, e Gauss dà $E_r\\cdot 2\\pi rL=\\dfrac{\\lambda L}{\\varepsilon_0}$, da cui $E_r=\\dfrac{\\lambda}{2\\pi\\varepsilon_0 r}$.","debito":"nessun nucleo del percorso tratta l'argomento di simmetria come strumento a sé: qui c'è la forma dell'argomento e non la sua giustificazione, che è di teoria dei gruppi e sta fuori dal percorso costruito finora. Quello che il percorso copre è il pezzo di destra — l'integrale di flusso, nel nucleo 03 tappa 04 — non il pezzo di sinistra che decide quale superficie scegliere.","controllo":[{"tipo":"uguale","sinistra":"(lam/(2*pi*e0*r))*2*pi*r*L","vale":"lam*L/e0","dove":"esempio","appare":"\\dfrac{\\lambda L}{\\varepsilon_0}"}]};
STRUM["cambio-di-variabile"] = {"nome":"Cambio di variabile in una densità","riga":"Una densità non si trasforma sostituendo ma porta il jacobiano: se $y=f(x)$ allora $p_Y(y)=\\sum_i p_X(x_i)\\,/\\,|f'(x_i)|$, sommato su tutti i rami $x_i$ con $f(x_i)=y$.","serve":"È l'unico punto in cui una densità si comporta diversamente da una funzione, ed è l'errore che si ripete. Ciò che è invariante è la probabilità dell'evento, $p_Y(y)|dy|=p_X(x)|dx|$: la densità no, perché è una probabilità per unità di qualcosa, e passando da $x$ a $y$ quell'unità si dilata o si comprime. Scrivere $p_Y(y)=p_X(x(y))$ e basta è attraente e sbagliato. Si scova senza rifare il conto con due prove da cinque secondi: la normalizzazione non torna, e le dimensioni restano quelle della variabile di partenza.","esempio":"Una particella uniforme su un disco di raggio $R$: $p(x,y)=1/(\\pi R^2)$. Passando alla sola distanza dal centro, il jacobiano è l'elemento d'area radiale $2\\pi r$, e resta $p(r)=2r/R^2$ su $[0,R]$, che infatti si normalizza a $1$. Il valor medio è $\\langle r\\rangle=2R/3$ — non $R/2$, che è la risposta di chi tratta $r$ come uniforme. La differenza fra i due numeri è esattamente il fattore $r$, cioè il fatto che lontano dal centro c'è più area.","pieno":{"file":"ms-03-probabilita.html","tappa":"01","come":"la regola dedotta dall'invarianza della probabilità, i rami molteplici e il caso radiale, nel movimento ms-03 di Meccanica Statistica"},"qui":{"meccanica-statistica":{"serve":"È metà della domanda più frequente dello scritto: «calcolare la densità di probabilità dell'energia di singola particella», «la densità di particelle $\\rho(r)$». L'altra metà è la marginalizzazione. Le scritture $d^2r=2\\pi r\\,dr$ e $d^3r=4\\pi r^2dr$ non sono formule da ricordare: sono questo cambio di variabile con gli angoli già integrati, e saperlo deducere è ciò che salva quando la simmetria è cilindrica invece che sferica. Attenzione al doppio jacobiano: $p(r)$ è una densità rispetto a $r$, $\\rho(r)$ è una densità per unità di volume, e fra le due ce n'è un altro.","esempio":"L'energia cinetica in due dimensioni. La misura radiale nel piano degli impulsi è la derivata dell'area del disco, $2\\pi p$; la sostituzione $\\varepsilon=p^2/2m$ ha $d\\varepsilon/dp=p/m$, e il jacobiano cancella esattamente il fattore $p$. Per questo in $d=2$ la densità dell'energia è l'esponenziale pura $\\beta e^{-\\beta\\varepsilon}$, senza prefattore, mentre in $d=3$ resta un $\\sqrt{\\varepsilon}$. Da quel solo fattore dipendono tutte le differenze qualitative fra i gas quantistici in dimensioni diverse."}},"controllo":[{"tipo":"integrale","espr":"2*r/R**2","var":"r","da":"0","a":"R","vale":"1","ipotesi":{"r":"positive","R":"positive"},"dove":"esempio","appare":"p(r)=2r/R^2"},{"tipo":"integrale","espr":"r*2*r/R**2","var":"r","da":"0","a":"R","vale":"2*R/3","ipotesi":{"r":"positive","R":"positive"},"dove":"esempio","appare":"2R/3"},{"tipo":"derivata","espr":"pi*p**2","rispetto":["p"],"vale":"2*pi*p","ipotesi":{"p":"positive"},"dove":"qui.meccanica-statistica.esempio","appare":"2\\pi p"},{"tipo":"derivata","espr":"p**2/(2*m)","rispetto":["p"],"vale":"p/m","ipotesi":{"p":"positive","m":"positive"},"dove":"qui.meccanica-statistica.esempio","appare":"p/m"},{"tipo":"integrale","espr":"b*exp(-b*e)","var":"e","da":"0","a":"oo","vale":"1","ipotesi":{"b":"positive","e":"positive"},"dove":"qui.meccanica-statistica.esempio","appare":"\\beta e^{-\\beta\\varepsilon}"}]};

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

{ num:'00', title:'Di cosa parla questo movimento', meta:'Elettromagnetismo · la radice del corso · 77 prove su 100 lo toccano',
  blocchi:[
  {t:'prosa', title:'Una frase, e il programma del movimento', tag:'first principles', html:R`
  <p>Due cariche ferme si attraggono o si respingono con una forza che Coulomb misurò nel 1785:
  $$\mathbf{F}_{12}=\frac{1}{4\pi\varepsilon_0}\frac{q_1q_2}{r^{2}}\,\hat r_{12}.$$
  È una legge completa: date le cariche e le posizioni, la forza si calcola. E allora la domanda vera di questo movimento non è «quanto vale la forza» — è <b>perché tutti i libri, subito dopo averla scritta, la abbandonano</b> e introducono un oggetto nuovo, il campo, che all'inizio sembra soltanto la stessa cosa divisa per $q$.</p>
  <p>In una frase: <i>si passa al campo perché la forza è una proprietà di una coppia, mentre il campo è una proprietà dello spazio</i> — e l'unica delle due che sopravvive quando le cariche si muovono, quando l'informazione viaggia a velocità finita, e quando lo spazio vuoto deve poter trasportare energia. Tutto il corso è il racconto di come quell'oggetto, introdotto qui per comodità, si scopre essere più reale delle cariche che lo generano.</p>
  <p><b>Ma attenzione a dove si spende il tempo.</b> Le cento prove d'esame di questo corso, dal 2008 al 2021, non chiedono quasi mai di discutere il concetto di campo. Chiedono di <b>calcolarlo</b>: <span class="av">dipolo</span> in 43 compiti, <span class="av">filo</span> in 41, <span class="av">disco</span> in 37, <span class="av">anello</span> in 26. «Linee di campo» compare una volta sola. La parte tecnica di questo movimento è quindi una sola cosa, ed è quella su cui insiste: <b>come si integra il campo di una distribuzione continua</b>.</p>`},
  {t:'prosa', title:'Cosa saprai fare, uscendo di qui', tag:'performance attesa', html:R`
  <ul>
  <li>Dire <b>perché</b> il campo non è solo «la forza per unità di carica», e cosa si romperebbe restando a Coulomb.</li>
  <li>Impostare da zero il campo di una <b>distribuzione continua</b>: scegliere $dq$, scrivere $d\mathbf{E}$, <b>usare la simmetria per uccidere le componenti</b> prima di integrare — che è il passo dove si vince o si perde tempo.</li>
  <li>Avere in mano, derivati e non memorizzati, i quattro casi che tornano sempre: <b>anello, disco, filo, semicirconferenza</b>.</li>
  <li>Riconoscere il <b>dipolo</b>, sapere perché il suo campo va come $1/r^3$ e non come $1/r^2$, e calcolare il <b>momento di dipolo di una distribuzione continua</b> — che è la forma in cui la domanda arriva davvero.</li>
  <li>Sapere che cosa la struttura $1/r^{2}$ rende possibile: è esattamente l'esponente per cui il <span class="str" data-str="flusso-di-un-campo">flusso</span> attraverso una superficie chiusa non dipende da quanto è lontana.</li>
  </ul>`},
  {t:'prolessi', title:'Dove porta', html:R`
  <p>Il risultato che qui appare come un fatto di calcolo — il campo di una carica va come $1/r^{2}$ — è in realtà la radice di due cose che il corso userà ovunque, e conviene vederle già adesso.</p>
  <p><b>La prima è geometrica.</b> Attraverso una sfera di raggio $r$ centrata sulla carica, il campo vale $\propto 1/r^{2}$ e l'area vale $4\pi r^{2}$: il prodotto — il flusso — non dipende da $r$. Non è una coincidenza aritmetica, è la ragione per cui esiste una legge che lega il flusso alla sola carica racchiusa, e con essa una versione <i>puntuale</i> dell'elettrostatica, $\nabla\cdot\mathbf{E}=\rho/\varepsilon_0$, al posto di una legge su coppie di cariche.</p>
  <p><b>La seconda è analitica.</b> $\dfrac{\hat r}{r^{2}}=-\nabla\dfrac{1}{r}$: il campo coulombiano è il gradiente di una funzione scalare, e questo lo rende <span class="str" data-str="campo-conservativo">conservativo</span>. Da lì nasce il potenziale, cioè la possibilità di sostituire tre funzioni dello spazio con una sola.</p>`}

/* ---------------- 01 · COULOMB E IL SUO GUASTO ---------------- */
{ num:'01', title:'Coulomb, e cosa non regge nell’azione a distanza', meta:'la legge · le due ipotesi nascoste · perché si abbandona',
  blocchi:[
  {t:'prosa', title:'La legge, e le due ipotesi che nasconde', tag:'first principles', html:R`
  <p>La legge di Coulomb, scritta per bene:
  $$\mathbf{F}_{12}=\frac{1}{4\pi\varepsilon_0}\frac{q_1q_2}{|\mathbf{r}_1-\mathbf{r}_2|^{2}}\,\hat r_{12},\qquad \frac{1}{4\pi\varepsilon_0}\simeq 8{,}99\cdot10^{9}\ \mathrm{N\,m^2/C^2}.$$
  Il pedice conta: $\hat r_{12}$ è il versore che va <b>da 2 verso 1</b>, cioè verso la carica su cui la forza agisce. Sbagliare verso è l'errore più banale e più frequente d'esame.</p>
  <p>Dentro questa formula ci sono <b>due ipotesi non scritte</b>, ed è utile vederle subito perché sono esattamente ciò che il corso smonterà:</p>
  <ul>
  <li><b>Le cariche sono ferme.</b> Non compare il tempo. Se $q_2$ si muove, quando $q_1$ se ne accorge?</li>
  <li><b>La forza è istantanea.</b> $\mathbf{r}_1$ e $\mathbf{r}_2$ sono valutate allo <i>stesso</i> istante. Ma allora spostando $q_2$ si manderebbe un segnale a velocità infinita.</li>
  </ul>`},
  {t:'reveal', title:'Perché questo è un guasto e non un dettaglio', html:R`
  <p>Immagina di spostare bruscamente $q_2$. Secondo Coulomb, $q_1$ sente subito una forza diversa: l'informazione «mi sono mossa» ha attraversato lo spazio in tempo zero. Le equazioni complete dell'elettromagnetismo dicono invece che quell'informazione viaggia a $c=1/\sqrt{\varepsilon_0\mu_0}$, e la conseguenza è più radicale di un ritardo: <b>per un intervallo di tempo l'energia non è né sulla prima carica né sulla seconda</b>. Se il bilancio energetico deve chiudere — e chiude, sperimentalmente — quell'energia sta in un terzo posto.</p>
  <p>Quel «terzo posto» è il campo, e questo è il motivo per cui non è un artificio di calcolo. La quantità che gli si attribuisce è una densità di energia per unità di volume, $u=\tfrac12\varepsilon_0E^{2}$, ed è una grandezza che si misura: lo spazio vuoto fra due piastre cariche contiene energia tanto quanto un volano contiene energia cinetica.</p>
  <p><b>Un ordine di grandezza, per non restare nell'astratto.</b> L'aria si ionizza — scocca la scintilla — attorno a $3\cdot10^{6}\ \mathrm{V/m}$; a quel campo la densità di energia vale $u=\tfrac12\varepsilon_0E^{2}\simeq 40\ \mathrm{J/m^3}$, che è pochissimo (un decimillesimo dell'energia di un grammo di zucchero) e spiega perché l'energia elettrostatica non è un modo pratico di immagazzinare energia. Dentro un atomo di idrogeno, alla distanza di Bohr $a_0=0{,}53\ $Å, il campo del protone vale invece $E=\dfrac{e}{4\pi\varepsilon_0a_0^{2}}\simeq5{,}1\cdot10^{11}\ \mathrm{V/m}$: cinque ordini di grandezza sopra la scintilla. È la ragione per cui la chimica è elettromagnetismo e la gravità non c'entra niente.</p>`},
  {t:'prosa', title:'Il principio di sovrapposizione, e la sua fragilità', tag:'struttura', html:R`
  <p>Con più cariche, le forze si sommano vettorialmente:
  $$\mathbf{F}_1=\sum_{k\ne1}\frac{1}{4\pi\varepsilon_0}\frac{q_1q_k}{r_{1k}^{2}}\,\hat r_{1k}.$$
  È un'affermazione <b>fisica</b>, non matematica: dice che la presenza di $q_3$ non altera il modo in cui $q_2$ agisce su $q_1$. Sperimentalmente regge benissimo; teoricamente è la linearità delle equazioni di Maxwell, e cade nei materiali non lineari e nell'elettrodinamica quantistica ad altissimi campi.</p>
  <p>Vale la pena tenerlo presente: <b>tutto il calcolo integrale di questo movimento poggia su questo principio</b>. Integrare il contributo di ogni pezzetto di carica ha senso solo perché i pezzetti non si disturbano a vicenda.</p>`}
  ]},

/* ---------------- 02 · IL CAMPO ---------------- */
{ num:'02', title:'Il campo: definizione, e cosa cambia davvero', meta:'la carica di prova · il limite $q_0\\to0$ · campo come proprietà dello spazio',
  blocchi:[
  {t:'prosa', title:'La definizione operativa', tag:'first principles', html:R`
  <p>Si mette nel punto $P$ una <b>carica di prova</b> $q_0$, si misura la forza, si divide:
  $$\mathbf{E}(P)=\lim_{q_0\to0}\frac{\mathbf{F}(P)}{q_0}.$$
  Il limite non è pedanteria: una carica di prova vera <b>disturba</b> le sorgenti, perché le attira o le respinge — su un conduttore le sposta materialmente, e allora il campo che si misura non è quello che c'era. Il limite dice: il campo è ciò che c'è <i>prima</i> che tu arrivi a misurarlo.</p>
  <p><b>E però va preso per quello che è.</b> Focardi, che scrive questa stessa definizione come sua (1-11) a p. 15, ci mette subito accanto l'avvertenza: <i>«tale limite non va inteso in senso strettamente matematico, perché il valore di qualsiasi carica non può scendere al di sotto di quello del quanto elementare»</i>. Non esiste una carica di prova arbitrariamente piccola: esiste l'elettrone. Il limite è fisico, non analitico — vuol dire «abbastanza piccola che l'induzione che provoca sia trascurabile», e $1{,}6\cdot10^{-19}\,\mathrm{C}$ lo è quasi sempre. È la prima volta, in questo corso, che una scrittura matematica va letta come una prescrizione sperimentale invece che come un'operazione: conviene prenderci l'abitudine subito, perché ricapita.</p>
  <p>Per una carica puntiforme $q$ nell'origine, dividendo Coulomb per $q_0$:
  $$\mathbf{E}(\mathbf{r})=\frac{1}{4\pi\varepsilon_0}\frac{q}{r^{2}}\,\hat r.$$
  È un <span class="str" data-str="campo-vettoriale">campo vettoriale</span>, e si misura in $\mathrm{N/C}$. La stessa unità si scrive anche $\mathrm{V/m}$, e le due scritture sono identiche perché un volt è un joule per coulomb: $\mathrm{N/C}=\mathrm{(J/m)/C}=\mathrm{V/m}$. Conviene tenerle entrambe in testa — la prima dice come il campo <i>agisce</i>, la seconda quanto lavoro compie su un metro.</p>`},
  {t:'gram', title:'Le tre letture della stessa formula', rows:[
    ['$\\mathbf{F}=q_0\\mathbf{E}$','<b>come si usa.</b> Dato il campo, la forza su una carica qualsiasi messa lì.'],
    ['$\\mathbf{E}=\\mathbf{F}/q_0$','<b>come si misura.</b> La definizione operativa: metti, misura, dividi.'],
    ['$\\mathbf{E}(\\mathbf{r})$ nota ovunque','<b>cosa è.</b> Una funzione dello spazio, indipendente da chi la sonda: la sorgente l’ha preparata e se ne è andata.']
  ]},
  {t:'reveal', title:'Il cambio che sembra banale e non lo è', html:R`
  <p>Dividere per $q_0$ sembra un gesto di comodità: si toglie di mezzo la carica di prova per non doverla riscrivere ogni volta. Ma il risultato ha una proprietà che la forza non aveva: <b>esiste anche dove non c'è niente</b>.</p>
  <p>La forza fra due cariche è un numero che riguarda una <i>coppia</i>: senza la seconda carica non ha senso. Il campo in un punto vuoto è definito lo stesso, e dice cosa succederebbe. Da oggetto relazionale a proprietà locale: è questo il passo, ed è ciò che rende possibile scrivere una legge <b>puntuale</b> — una relazione fra quanto il campo diverge in un punto e quanta carica c'è in quel punto, $\nabla\cdot\mathbf{E}=\rho/\varepsilon_0$ — invece di una legge che parla di coppie a distanza.</p>
  <p>Focardi mette questo passaggio in due righe che vale la pena tenere come definizione di lavoro (p. 16): l'introduzione del campo <i>«permette di separare l'azione dinamica tra cariche in due parti: a) un insieme di cariche dà origine a un campo $\mathbf{E}(\mathbf{r})$ nello spazio circostante; b) il campo produce una forza $\mathbf{F}=q\mathbf{E}$ su una carica $q$ ivi collocata»</i>. La conseguenza operativa è forte e spesso non viene notata: se due distribuzioni diverse producono <i>lo stesso</i> campo in una regione, per tutto ciò che accade in quella regione <b>sono la stessa cosa</b>. Si può studiare il moto di una carica conoscendo $\mathbf{E}$ e ignorando del tutto come siano fatte le sorgenti — ed è questo che rende il campo uno strumento e non una notazione.</p>`},
  {t:'plot', title:'Le due configurazioni elementari, viste come campo',
   intro:R`A sinistra una carica puntiforme positiva nell'origine: le frecce puntano tutte fuori, e la loro lunghezza cala come $1/r^{2}$. A destra due cariche opposte, $+q$ in $(-0{,}6\,;0)$ e $-q$ in $(+0{,}6\,;0)$ — il dipolo di cui si parlerà nella tappa 05.`,
   plots:[
    {kind:'field2d', xr:[-2,2], yr:[-2,2], n:13, height:300,
     title:'carica puntiforme positiva: campo radiale, intensita ~ 1/r^2',
     fx:'x/pow(x*x+y*y+0.04,1.5)', fy:'y/pow(x*x+y*y+0.04,1.5)',
     marks:[{x:0, y:0, label:'+q', col:'#ff6b6b'}]},
    {kind:'field2d', xr:[-2,2], yr:[-2,2], n:13, height:300,
     title:'due cariche opposte: il campo esce da +q ed entra in -q',
     fx:'(x+0.6)/pow((x+0.6)*(x+0.6)+y*y+0.04,1.5) - (x-0.6)/pow((x-0.6)*(x-0.6)+y*y+0.04,1.5)',
     fy:'y/pow((x+0.6)*(x+0.6)+y*y+0.04,1.5) - y/pow((x-0.6)*(x-0.6)+y*y+0.04,1.5)',
     marks:[{x:-0.6, y:0, label:'+q', col:'#ff6b6b'},
            {x:0.6, y:0, label:'-q', col:'#4c8dff'}]}
   ],
   leggi:R`<p>Guarda <b>dove le frecce sono lunghe</b>, non dove sono disegnate: è l'unica informazione che conta. A sinistra la lunghezza cala rapidamente, e a $r=2$ è già sedici volte minore che a $r=0{,}5$ — è $1/r^{2}$ che si vede a occhio.</p>
   <p>A destra succede la cosa che il conto della tappa 05 renderà quantitativa: <b>lontano dalla coppia le due frecce quasi si cancellano</b>, perché la carica totale è zero e i due contributi differiscono solo per la piccola distanza fra le sorgenti. Quel «quasi» è tutto il dipolo: ciò che sopravvive alla cancellazione va come $1/r^{3}$, non come $1/r^{2}$. Sul segmento fra le due cariche, invece, i contributi si <i>sommano</i> — ed è lì che il campo è più intenso.</p>
   <p>Nota anche ciò che la figura <b>non</b> dice: non ci sono «linee di campo» disegnate. Le prove di questo corso le chiedono una volta in cento, mentre chiedono di calcolare un campo in quasi tutte. La figura serve a controllare il verso e l'ordine di grandezza di un risultato ottenuto per via analitica, non a sostituirlo.</p>`}
  ]},

/* ---------------- 03 · IL METODO PER IL CONTINUO ---------------- */
{ num:'03', title:'Dal discreto al continuo: il metodo, una volta per tutte', meta:'$dq=\\lambda\\,dl$ · $\\sigma\\,dA$ · $\\rho\\,dV$ · la simmetria PRIMA dell’integrale',
  blocchi:[
  {t:'prosa', title:'I quattro passi, e sono sempre gli stessi', tag:'metodo', html:R`
  <p>La somma su cariche discrete diventa un integrale. Nella forma completa, con $\mathbf{r}$ il punto in cui si vuole il campo e $\mathbf{r}'$ la posizione del pezzetto di carica — è la (1-13) di Focardi, p. 16 —
  $$\mathbf{E}(\mathbf{r})=\int\frac{dq}{4\pi\varepsilon_0}\frac{(\mathbf{r}-\mathbf{r}')}{|\mathbf{r}-\mathbf{r}'|^{3}},$$
  dove il cubo a denominatore non è un esponente diverso da due: è $|\mathbf{r}-\mathbf{r}'|^{2}$ moltiplicato per il modulo che normalizza il vettore al numeratore. Scritta in modulo e versore diventa la forma che si usa a mano,
  $$\mathbf{E}(P)=\frac{1}{4\pi\varepsilon_0}\int\frac{dq}{r^{2}}\,\hat r,$$
  e così com'è è inutilizzabile — $\hat r$ cambia direzione punto per punto, e non si integra un versore variabile distrattamente. Focardi risolve la cosa nel modo generale, cioè proiettando: <i>«in pratica, conviene calcolare separatamente le componenti cartesiane»</i>, una per una, $E_x=\frac{1}{4\pi\varepsilon_0}\int\frac{(x-x')\,dq}{|\mathbf{r}-\mathbf{r}'|^{3}}$ e analoghe. È sempre corretto e quasi sempre lungo. I quattro passi qui sotto sono la versione che si usa all'esame: la stessa cosa, con la <span class="str" data-str="simmetrie">simmetria</span> usata <i>prima</i> di proiettare, per non calcolare le componenti che si sa già che moriranno.</p>
  <ol>
  <li><b>Scegli $dq$</b> secondo la dimensione della distribuzione: $dq=\lambda\,dl$ (filo, anello, bacchetta), $dq=\sigma\,dA$ (disco, piano, guscio), $dq=\rho\,dV$ (sfera piena). Le tre densità sono definite come derivate della carica rispetto alla dimensione giusta — $\rho=dq/dV$, $\sigma=dq/dS$, $\lambda=dq/dl$ — e Focardi (p. 15) avverte che «infinitesimo» qui è fisico, non matematico: $dV$ dev'essere abbastanza piccolo che $\rho$ non cambi al suo interno, e abbastanza grande da contenere un numero enorme di cariche elementari. È la stessa idea del continuo con cui in meccanica si passa dai punti materiali ai corpi estesi.</li>
  <li><b>Scrivi $dE$</b>, il <i>modulo</i> del contributo del pezzetto: $dE=\dfrac{1}{4\pi\varepsilon_0}\dfrac{dq}{r^{2}}$, con $r$ la distanza dal pezzetto al punto $P$.</li>
  <li><b>Uccidi le componenti con la simmetria.</b> Per ogni pezzetto, cerca il suo gemello che annulla una componente. Ciò che resta è una sola direzione, e allora si integra uno scalare.</li>
  <li><b>Integra</b>, con gli estremi giusti, e <b>controlla i limiti</b>: da lontano deve tornare una carica puntiforme.</li>
  </ol>`},
  {t:'reveal', title:'Il passo 3 è quello che separa chi finisce in tempo', html:R`
  <p>All'esame il passo 3 vale più del passo 4. Un integrale vettoriale in tre componenti su una geometria curva è quasi sempre fuori portata in mezz'ora; lo stesso problema, dopo aver osservato che due componenti su tre si cancellano a coppie, diventa un integrale elementare.</p>
  <p><b>La regola pratica:</b> disegna la distribuzione, prendi un pezzetto, e chiediti «quale altro pezzetto dà un contributo che cancella parte di questo?». Se la figura ha un asse di simmetria, <b>sopravvive solo la componente lungo quell'asse</b>. Se non ce l'ha — una semicirconferenza, una bacchetta vista di sbieco — sopravvivono due componenti e si integrano separatamente.</p>`},
  {t:'prosa', title:'Il controllo che salva dagli errori: il limite lontano', tag:'collaudo', html:R`
  <p>Ogni risultato va provato da lontano. Una distribuzione di carica totale $Q$, vista da molto distante, <b>non può distinguersi da una carica puntiforme</b>: il campo deve andare come $1/r^{2}$ con coefficiente $Q/4\pi\varepsilon_0$.</p>
  <p>Per l'anello, che si ricaverà fra poco, il campo sull'asse è $E_z=\dfrac{1}{4\pi\varepsilon_0}\dfrac{Qz}{(R^{2}+z^{2})^{3/2}}$. Per $z\gg R$ il denominatore va come $z^{3}$, quindi $E_z\to\dfrac{Q}{4\pi\varepsilon_0}\cdot\dfrac{1}{z^{2}}$: giusto. Un risultato che non supera questo controllo è sbagliato, e il controllo costa dieci secondi.</p>`}
  ]},

/* ---------------- 04 · I QUATTRO CASI ---------------- */
{ num:'04', title:'I quattro casi che cadono sempre', meta:'anello · disco · filo · semicirconferenza — derivati, non memorizzati',
  blocchi:[
  {t:'prosa', title:'Anello, sull’asse', tag:'derivazione', html:R`
  <p>Anello di raggio $R$, carica $Q$ uniforme, punto $P$ sull'asse a distanza $z$ dal centro.</p>
  <p><b>Simmetria.</b> Ogni pezzetto ha il suo diametralmente opposto: le componenti radiali si cancellano a coppie, sopravvive solo $E_z$. Ogni pezzetto dista $r=\sqrt{R^{2}+z^{2}}$ da $P$, uguale per tutti, e la sua componente lungo l'asse si ottiene moltiplicando per $\cos\theta=z/\sqrt{R^{2}+z^{2}}$.</p>
  $$E_z=\frac{1}{4\pi\varepsilon_0}\int\frac{dq}{R^{2}+z^{2}}\cdot\frac{z}{\sqrt{R^{2}+z^{2}}}=\frac{1}{4\pi\varepsilon_0}\frac{z}{(R^{2}+z^{2})^{3/2}}\int dq$$
  $$\boxed{\;E_z=\frac{1}{4\pi\varepsilon_0}\frac{Qz}{(R^{2}+z^{2})^{3/2}}\;}$$
  <p>L'integrale è uscito dal segno perché $r$ e $\cos\theta$ sono <i>gli stessi</i> per ogni pezzetto: è tutto qui il motivo per cui l'anello è il caso più facile, e per cui conviene ricondurci il disco.</p>`},
  {t:'reveal', title:'Dove il campo dell’anello è massimo (domanda d’esame ricorrente)', html:R`
  <p>In $z=0$ il campo è nullo (per simmetria), e per $z\to\infty$ tende a zero: quindi c'è un massimo. Derivando:
  $$\frac{d}{dz}\frac{z}{(R^{2}+z^{2})^{3/2}}=\frac{(R^2-2z^2)}{(R^{2}+z^{2})^{5/2}},$$
  che si annulla per $z=\dfrac{R}{\sqrt2}$. Il valore massimo vale $\dfrac{Q}{4\pi\varepsilon_0R^{2}}\cdot\dfrac{2}{3\sqrt3}$.</p>
  <p>Il fattore adimensionale $\dfrac{2}{3\sqrt3}\simeq0{,}385$ dice che il massimo è circa il 38% di quanto varrebbe il campo di tutta la carica concentrata a distanza $R$: l'anello è «meno efficiente» perché la sua carica è sparpagliata.</p>`},
  {t:'prosa', title:'Disco, sull’asse — l’anello integrato', tag:'derivazione', html:R`
  <p>Disco di raggio $R$, densità superficiale $\sigma$. Si taglia in anelli di raggio $s$ e spessore $ds$: ognuno porta $dq=\sigma\,2\pi s\,ds$, e per ognuno vale il risultato appena trovato.</p>
  $$E_z=\frac{1}{4\pi\varepsilon_0}\int_0^{R}\frac{z\,\sigma\,2\pi s\,ds}{(s^{2}+z^{2})^{3/2}}=\frac{\sigma z}{2\varepsilon_0}\left[-\frac{1}{\sqrt{s^{2}+z^{2}}}\right]_0^{R}$$
  $$\boxed{\;E_z=\frac{\sigma}{2\varepsilon_0}\left(1-\frac{z}{\sqrt{R^{2}+z^{2}}}\right)\;}$$
  <p><b>Il limite che conta.</b> Per $R\to\infty$ la frazione va a zero e la parentesi $\to 1$: resta $E=\dfrac{\sigma}{2\varepsilon_0}$, il campo del <b>piano infinito</b>, che non dipende dalla distanza. È un risultato da avere in testa, e vale la pena notare <i>perché</i> non dipende da $z$: allontanandosi, ogni pezzetto di piano contribuisce meno, ma si «vede» una porzione di piano più larga, e le due cose si compensano esattamente — compensazione che funziona solo perché l'esponente è $2$.</p>
  <p><b>Il limite opposto è altrettanto istruttivo.</b> Per $z\to0^{+}$ si ottiene $\sigma/2\varepsilon_0$; per $z\to0^{-}$, per simmetria, lo stesso valore con segno opposto. Attraversare un foglio carico fa dunque <b>saltare il campo</b> di $\sigma/\varepsilon_0$, e il salto è finito, non infinito: una densità superficiale è un'idealizzazione ragionevole. È il primo esempio di una regola generale — il campo è discontinuo attraverso una superficie carica, e continuo attraverso una distribuzione di volume.</p>`},
  {t:'plot', title:'Anello e disco sull’asse: dove il campo e massimo, e dove diventa piatto',
   intro:R`Campo lungo l'asse, in unità $Q/(4\pi\varepsilon_0R^{2})$ per l'anello e $\sigma/(2\varepsilon_0)$ per il disco, con $R=1$. Le ascisse sono $z/R$.`,
   plots:[
    {kind:'func2d', xr:[0,4], yr:[0,0.45], height:310,
     title:'anello: nullo al centro, massimo a z = R/sqrt(2), poi 1/z^2',
     xlabel:'z / R', ylabel:'E in unita di Q/(4 pi eps0 R^2)',
     curves:[{f:'x/pow(1+x*x,1.5)', col:'#5eead4', width:2.8, label:'anello (esatto)'},
             {f:'1/(x*x+1e-9)', col:'#ff6b6b', width:1.8, dash:true, label:'carica puntiforme'}],
     marks:[{x:0.7071, y:0.3849, label:'max: z=R/sqrt2, E=0.385', col:'#d8a13a', up:true},
            {x:0, y:0, label:'E=0 al centro', col:'#b98cff', up:true}]},
    {kind:'func2d', xr:[0,3], yr:[0,1.05], height:310,
     title:'disco: parte da 1 (il piano infinito) e decade',
     xlabel:'z / R', ylabel:'E in unita di sigma/(2 eps0)',
     curves:[{f:'1-x/sqrt(1+x*x)', col:'#5eead4', width:2.8, label:'disco (esatto)'},
             {f:'1', col:'#b98cff', width:2, dash:true, label:'piano infinito'}],
     marks:[{x:0.02, y:1, label:'sigma/(2 eps0)', col:'#d8a13a', up:true}]}
   ],
   leggi:R`<p>A sinistra: il campo dell'anello è <b>nullo al centro</b> — ogni pezzetto è compensato dal suo opposto — e nullo all'infinito, quindi in mezzo deve avere un massimo. Sta a $z=R/\sqrt2$ e vale il 38,5% di quanto varrebbe se tutta la carica fosse concentrata a distanza $R$: l'anello è «meno efficiente» perché la carica è sparpagliata e i contributi puntano in direzioni diverse. La tratteggiata rossa mostra che <b>oltre $z\simeq2R$ l'anello è indistinguibile da una carica puntiforme</b>: è lì che finisce il suo carattere di oggetto esteso.</p>
   <p>A destra: il disco parte dal valore del piano infinito e se ne stacca lentamente. A $z=R$ vale già solo il 29% di $\sigma/2\varepsilon_0$. <b>Il confronto fra i due pannelli dice la cosa importante</b>: al centro dell'anello il campo è zero, al centro del disco è massimo — e la differenza è tutta nel fatto che il disco ha carica <i>anche</i> vicino all'asse, dove non c'è nessun pezzetto opposto che la cancelli.</p>`},
  {t:'prosa', title:'Filo — prima finito, poi infinito come limite', tag:'derivazione', html:R`
  <p>Quasi tutti i testi fanno subito il filo infinito, che è più corto. Conviene il contrario, e per una ragione d'esame: <b>il filo infinito non esiste nelle tracce</b>, ci sono bacchette lunghe $2L$ — e chi ha in mano solo il risultato infinito, davanti a una bacchetta, deve ricominciare da zero.</p>
  <p>Bacchetta di lunghezza $2L$, densità $\lambda$ uniforme, punto $P$ sul <b>piano mediano</b> a distanza $d$. Coordinata $y$ lungo il filo con origine nel piede della perpendicolare, così che la bacchetta occupi $[-L,L]$.</p>
  <p><b>Simmetria.</b> Il pezzetto in $+y$ e quello in $-y$ danno contributi la cui componente parallela al filo è opposta: si cancellano a coppie. Sopravvive solo la componente perpendicolare, che si ottiene moltiplicando per $\cos\theta=d/\sqrt{d^{2}+y^{2}}$. Il pezzetto dista $\sqrt{d^{2}+y^{2}}$ da $P$, dunque:</p>
  $$E_\perp=\frac{\lambda}{4\pi\varepsilon_0}\int_{-L}^{L}\frac{dy}{d^{2}+y^{2}}\cdot\frac{d}{\sqrt{d^{2}+y^{2}}}=\frac{\lambda d}{4\pi\varepsilon_0}\int_{-L}^{L}\frac{dy}{(d^{2}+y^{2})^{3/2}}$$
  <p>L'integrale si fa con la <span class="str" data-str="cambio-di-variabile">sostituzione</span> $y=d\tan\varphi$, che manda $(d^{2}+y^{2})^{3/2}$ in $d^{3}/\cos^{3}\varphi$ e $dy$ in $d\,d\varphi/\cos^{2}\varphi$: resta $\frac{1}{d^{2}}\int\cos\varphi\,d\varphi=\frac{\sin\varphi}{d^{2}}$, e tornando a $y$ si ha $\sin\varphi=y/\sqrt{d^{2}+y^{2}}$. Quindi</p>
  $$\int_{-L}^{L}\frac{dy}{(d^{2}+y^{2})^{3/2}}=\left[\frac{y}{d^{2}\sqrt{d^{2}+y^{2}}}\right]_{-L}^{L}=\frac{2L}{d^{2}\sqrt{d^{2}+L^{2}}}$$
  $$\boxed{\;E_\perp=\frac{\lambda}{4\pi\varepsilon_0}\,\frac{2L}{d\sqrt{d^{2}+L^{2}}}\;}$$
  <p><b>I due limiti, e sono entrambi controlli.</b> Da vicinissimo ($L\gg d$) la radice diventa $L$ e resta $\dfrac{\lambda}{4\pi\varepsilon_0}\cdot\dfrac{2}{d}$, cioè</p>
  $$\boxed{\;E=\frac{\lambda}{2\pi\varepsilon_0 d}\;}$$
  <p>che è il filo infinito: lo stesso risultato che si ottiene mandando direttamente $L\to\infty$ nell'integrale, dove $\displaystyle\int_{-\infty}^{+\infty}\frac{dy}{(d^{2}+y^{2})^{3/2}}=\dfrac{2}{d^{2}}$. Da lontano ($d\gg L$) la radice diventa $d$ e resta $\dfrac{2\lambda L}{4\pi\varepsilon_0 d^{2}}=\dfrac{Q}{4\pi\varepsilon_0d^{2}}$ con $Q=2\lambda L$: la carica puntiforme. <b>Una formula che supera tutti e due i limiti è quasi certamente giusta</b>, e questi due costano dieci secondi ciascuno.</p>
  <p>Il $1/d$ invece di $1/d^{2}$ è la firma di una sorgente <b>estesa in una direzione</b>: da vicino non vedi una carica, vedi una linea. Il disco, esteso in due, non dipende affatto dalla distanza. Le tre leggi — $1/d^{2}$, $1/d$, costante — non sono tre formule da ricordare: sono <b>la stessa fisica vista a tre distanze diverse</b>, e la figura qui sotto le mette una accanto all'altra.</p>`},
  {t:'plot', title:'Le tre firme: punto, filo, piano — e il filo finito che le attraversa entrambe',
   intro:R`A sinistra, in unità arbitrarie, le tre leggi di potenza: carica puntiforme ($1/d^{2}$), filo infinito ($1/d$), piano infinito (costante). A destra il campo della bacchetta di semilunghezza $L=1$ sul piano mediano, confrontato con i suoi due limiti.`,
   plots:[
    {kind:'func2d', xr:[0.25,4], yr:[0,4], height:310,
     title:'le tre leggi di potenza (stessa scala, unita arbitrarie)',
     xlabel:'d', ylabel:'E(d)',
     curves:[{f:'1/(x*x)', col:'#5eead4', width:2.6, label:'punto: 1/d^2'},
             {f:'1/x', col:'#d8a13a', width:2.4, label:'filo: 1/d'},
             {f:'1', col:'#b98cff', width:2.2, label:'piano: costante'}]},
    {kind:'func2d', xr:[0.08,4], yr:[0,6], height:310,
     title:'bacchetta 2L=2: da vicino si comporta da filo, da lontano da carica puntiforme',
     xlabel:'d', ylabel:'E(d) in unita di lambda/(4 pi eps0)',
     curves:[{f:'2/(x*sqrt(x*x+1))', col:'#5eead4', width:2.8, label:'bacchetta (esatta)'},
             {f:'2/x', col:'#d8a13a', width:2, dash:true, label:'limite filo: 2/d'},
             {f:'2/(x*x)', col:'#ff6b6b', width:2, dash:true, label:'limite punto: 2L/d^2'}],
     marks:[{x:1, y:1.414, label:'d = L', col:'#ffffff', up:true}]}
   ],
   leggi:R`<p>Nel pannello di sinistra, <b>le tre curve non si incrociano mai due volte</b>: più la sorgente è estesa, più il campo è «piatto». È il senso geometrico dell'esponente — ogni dimensione in cui la sorgente si estende toglie una potenza a $1/d$.</p>
   <p>Il pannello di destra è quello che serve all'esame. La curva piena è la formula esatta della bacchetta; le due tratteggiate sono i suoi limiti. <b>Il punto segnato, $d=L$, è la soglia mentale</b>: molto più vicino di così la bacchetta è un filo infinito, molto più lontano è una carica puntiforme. Il rapporto fra il valore esatto e il filo infinito è $1/\sqrt{1+d^{2}/L^{2}}$, quindi a $d=L/2$ lo scarto è già $0{,}106$, cioè l'11%: «molto più vicino» vuol dire davvero <i>molto</i>. Quando una traccia dice «bacchetta lunga 20 cm, punto a 2 mm», sta dicendo <i>usa il filo infinito</i>; quando dice «a 3 m», sta dicendo <i>usa la carica puntiforme</i>. Riconoscere quale dei due regimi la traccia sta chiedendo vale più del conto esatto, perché il conto esatto in quei casi è tempo speso per una cifra decimale che non cambia la risposta.</p>`},
  {t:'prosa', title:'Semicirconferenza, al centro — quando la simmetria non basta', tag:'derivazione', html:R`
  <p>Semicirconferenza di raggio $R$, carica $Q$ uniforme, campo nel <b>centro</b>. Qui l'asse di simmetria è uno solo, e sopravvive una sola componente — ma per vederlo bisogna parametrizzare.</p>
  <p>Densità $\lambda=\dfrac{Q}{\pi R}$; il pezzetto ad angolo $\theta$ porta $dq=\lambda R\,d\theta$, dista $R$ dal centro, e la sua componente lungo l'asse di simmetria pesa $\sin\theta$:</p>
  $$E=\frac{\lambda R}{4\pi\varepsilon_0R^{2}}\int_0^{\pi}\sin\theta\,d\theta=\frac{\lambda}{4\pi\varepsilon_0R}\cdot 2=\frac{\lambda}{2\pi\varepsilon_0R}$$
  $$\boxed{\;E=\frac{Q}{2\pi^{2}\varepsilon_0R^{2}}\;}$$
  <p>Il $\pi^{2}$ a denominatore sorprende sempre, e viene da due posti diversi: un $\pi$ da $\lambda=Q/\pi R$, l'altro dal $4\pi\varepsilon_0$. Vale la pena rifare il conto e vedere i due $\pi$ separati, invece di fidarsi della formula.</p>`}
  ]},

/* ---------------- 05 · IL DIPOLO ---------------- */
{ num:'05', title:'Il dipolo: la configurazione più frequente dell’esame', meta:'momento $\\mathbf{p}$ · campo assiale e equatoriale · $1/r^3$ · il momento meccanico',
  blocchi:[
  {t:'prosa', title:'Definizione e campo lontano', tag:'derivazione', html:R`
  <p>Due cariche $+q$ e $-q$ a distanza $d$. Si definisce il <b>momento di dipolo</b> $\mathbf{p}=q\,\mathbf{d}$, orientato <i>dalla negativa alla positiva</i>.</p>
  <p><b>Sull'asse.</b> Mettiamo $+q$ in $z=+d/2$ e $-q$ in $z=-d/2$, e calcoliamo in un punto dell'asse a distanza $r$ dal centro. I due contributi hanno verso opposto e quasi si cancellano — ed è proprio la quasi-cancellazione a dare la legge di potenza. <b>Prima l'espressione esatta</b>, senza approssimare niente:</p>
  $$E_{\text{ass}}=\frac{q}{4\pi\varepsilon_0}\left[\frac{1}{(r-d/2)^{2}}-\frac{1}{(r+d/2)^{2}}\right]=\frac{q}{4\pi\varepsilon_0}\cdot\frac{2rd}{\left(r^{2}-d^{2}/4\right)^{2}}$$
  <p>— basta fare il denominatore comune: $(r+d/2)^{2}-(r-d/2)^{2}=2rd$, e il prodotto dei due denominatori è $(r^{2}-d^{2}/4)^{2}$. <b>Poi il limite di dipolo</b>, $r\gg d$: il $d^{2}/4$ è trascurabile davanti a $r^{2}$, il denominatore diventa $r^{4}$, e resta</p>
  $$E_{\text{ass}}\simeq\frac{q}{4\pi\varepsilon_0}\cdot\frac{2rd}{r^{4}}=\frac{2p}{4\pi\varepsilon_0r^{3}}.$$
  <p><b>Sul piano equatoriale</b> il conto è diverso e vale la pena farlo per intero, perché è quello che casca più spesso e perché il fattore $1/2$ non è ovvio. Il punto sta a distanza $r$ dal centro, nel piano $z=0$; ciascuna carica dista $s=\sqrt{r^{2}+d^{2}/4}$. I due contributi hanno <i>lo stesso</i> modulo $q/(4\pi\varepsilon_0s^{2})$, e le loro componenti radiali si cancellano: sopravvive solo la componente parallela all'asse, che si ottiene moltiplicando per $\cos\alpha=\dfrac{d/2}{s}$, e punta <b>da $+q$ verso $-q$</b>, cioè in verso opposto a $\mathbf{p}$. Sommando i due:</p>
  $$E_{\text{eq}}=2\cdot\frac{q}{4\pi\varepsilon_0\left(r^{2}+d^{2}/4\right)}\cdot\frac{d/2}{\sqrt{r^{2}+d^{2}/4}}=\frac{q\,d}{4\pi\varepsilon_0\left(r^{2}+d^{2}/4\right)^{3/2}}$$
  <p>— anche questa è esatta. Per $r\gg d$ il denominatore va come $r^{3}$ e resta</p>
  $$E_{\text{eq}}\simeq\frac{p}{4\pi\varepsilon_0r^{3}}.$$
  <p>Le due espressioni esatte, prima dei limiti, servono a qualcosa di concreto: quando una traccia chiede il campo a una distanza <i>confrontabile</i> con $d$ — e capita — l'approssimazione di dipolo è sbagliata, e bisogna avere sottomano la formula vera. Il conto approssimato in quel caso non è «meno preciso»: è di un altro problema.</p>
  <p><b>Il fatto strutturale:</b> il campo va come $1/r^{3}$, non $1/r^{2}$. Da lontano la carica totale è zero, quindi il termine $1/r^{2}$ sparisce e resta il primo termine non nullo dello sviluppo. È il primo esempio di una gerarchia — monopolo, dipolo, quadrupolo — in cui ogni ordine cala di una potenza in più.</p>`},
  {t:'reveal', title:'Il rapporto assiale/equatoriale, e un controllo numerico', html:R`
  <p>A parità di distanza, $E_{\text{ass}}/E_{\text{eq}}=2$: sull'asse il campo è esattamente il doppio. È una di quelle relazioni che all'esame si usano per controllare un risultato in tre secondi.</p>
  <p>Un controllo del passaggio approssimato: con $r=1$ e $d$ piccolo, $\dfrac{2}{(1+1)^{3/2}}=\dfrac{\sqrt2}{2}$ — il tipo di identità numerica che conviene verificare a mano quando si semplifica un'espressione, invece di fidarsi della penna.</p>`},
  {t:'prosa', title:'Il dipolo in campo esterno: forza nulla, momento no', tag:'struttura', html:R`
  <p>Un dipolo immerso in un campo <b>uniforme</b> $\mathbf{E}$ sente forza totale nulla ($+q\mathbf{E}-q\mathbf{E}=0$) ma un <b>momento meccanico</b>
  $$\boldsymbol{\tau}=\mathbf{p}\times\mathbf{E},$$
  che tende ad allinearlo al campo. L'energia potenziale associata è $U=-\mathbf{p}\cdot\mathbf{E}$, minima quando $\mathbf{p}$ è parallelo a $\mathbf{E}$.</p>
  <p>In campo <b>non</b> uniforme compare anche una forza netta $\mathbf{F}=(\mathbf{p}\cdot\nabla)\mathbf{E}$, e questo è il meccanismo per cui un pettine carico attira pezzetti di carta neutra: il campo non uniforme del pettine prima <i>induce</i> un dipolo nella carta — sposta di pochissimo le cariche dentro ogni molecola — e poi lo tira, perché la carica indotta più vicina al pettine sente un campo più intenso di quella più lontana. Due passaggi, ed entrambi necessari: in un campo uniforme la carta non si muoverebbe, e senza polarizzabilità nemmeno.</p>`},
  {t:'prosa', title:'Il momento di dipolo di una distribuzione continua — la forma in cui la domanda arriva', tag:'derivazione', html:R`
  <p>Fin qui $\mathbf{p}=q\mathbf{d}$ con due cariche puntiformi. Ma le tracce, quasi sempre, danno una <b>distribuzione continua globalmente neutra</b> e chiedono il suo momento di dipolo. La definizione che serve è l'estensione naturale della somma $\sum_i q_i\mathbf{r}_i$:</p>
  $$\mathbf{p}=\int \mathbf{r}'\,dq=\int\mathbf{r}'\lambda(\mathbf{r}')\,dl'\quad\text{oppure}\quad\int\mathbf{r}'\sigma\,dS'\quad\text{oppure}\quad\int\mathbf{r}'\rho\,dV'$$
  <p><b>Perché l'origine non conta</b> (e perché conviene dirlo prima di calcolare): cambiando origine, $\mathbf{r}'\to\mathbf{r}'+\mathbf{a}$, il momento cambia di $\mathbf{a}\int dq=\mathbf{a}\,Q_{\text{tot}}$. Se la distribuzione è neutra, $Q_{\text{tot}}=0$ e <b>$\mathbf{p}$ non dipende da dove si mette l'origine</b>. È la ragione per cui si può parlare del momento di dipolo di una molecola senza specificare rispetto a quale punto — e anche la ragione per cui, se la carica totale <i>non</i> è nulla, quel numero non significa granché da solo.</p>
  <p><b>Esempio 1 — la sbarretta</b> (Lacava, <i>Calcolo di momenti di dipolo</i>, es. 1). Sbarretta di lunghezza $\ell$ sull'asse $x$, centrata nell'origine, con densità $+\lambda$ per $x>0$ e $-\lambda$ per $x<0$. È neutra, e per simmetria solo $p_x$ può essere non nullo:</p>
  $$p_x=\int_{-\ell/2}^{0}x\,(-\lambda)\,dx+\int_{0}^{\ell/2}x\,\lambda\,dx=\lambda\left(\frac{\ell^{2}}{8}+\frac{\ell^{2}}{8}\right)=\frac{\lambda\ell^{2}}{4}$$
  <p><b>Il controllo che Lacava suggerisce, e che vale più del conto:</b> la carica positiva totale è $q=\lambda\ell/2$, e il suo baricentro sta in $x=\ell/4$; quella negativa, specularmente, in $x=-\ell/4$. Due cariche $\pm q$ a distanza $\ell/2$ danno $p=q\cdot\ell/2=\lambda\ell^{2}/4$: lo stesso numero. <b>Ogni distribuzione neutra equivale, quanto a dipolo, a due cariche puntiformi poste nei baricentri delle sue due metà</b> — e questo trasforma quasi ogni esercizio di questo tipo in un conto di baricentri, che è più corto e più difficile da sbagliare.</p>
  <p><b>Esempio 2 — l'anello con densità modulata</b> (stessa fonte, es. 2), che è il caso in cui l'integrale non si evita. Anello di raggio $R$ nel piano $z=0$ con $\lambda(\theta)=\lambda_0\cos\theta$, con $\theta$ misurato dall'asse $y$: la carica è positiva per $y>0$, negativa per $y<0$, e il totale è nullo. Con $dl'=R\,d\theta$ e le coordinate del punto corrente $(x,y)=(R\sin\theta,\,R\cos\theta)$:</p>
  $$p_x=\int_0^{2\pi}(R\sin\theta)(\lambda_0\cos\theta)R\,d\theta=\lambda_0R^{2}\int_0^{2\pi}\sin\theta\cos\theta\,d\theta=0$$
  $$p_y=\int_0^{2\pi}(R\cos\theta)(\lambda_0\cos\theta)R\,d\theta=\lambda_0R^{2}\int_0^{2\pi}\cos^{2}\theta\,d\theta=\pi\lambda_0R^{2}$$
  <p>Il primo integrale è nullo perché $\sin\theta\cos\theta=\tfrac12\sin2\theta$ ha media nulla su un periodo; il secondo vale $\pi$ perché $\int_0^{2\pi}\cos^{2}=\int_0^{2\pi}\sin^{2}$ e la loro somma è $2\pi$ — un modo di ottenerlo senza primitive, che conviene ricordare. Che $p_x$ sia nullo si poteva prevedere: la distribuzione è simmetrica rispetto all'asse $y$.</p>
  <p>E il controllo dei baricentri funziona anche qui: la carica positiva è $q_+=\int_{-\pi/2}^{\pi/2}\lambda_0\cos\theta\,R\,d\theta=2\lambda_0R$, e imponendo $p_y=q_+d$ si trova $d=\pi R/2$, che è esattamente la distanza fra i baricentri delle due semidistribuzioni. <b>Se i due metodi non danno lo stesso numero, l'errore è nell'integrale</b>, e quasi sempre è un $R$ dimenticato nel $dl'$.</p>`}
  ]},

/* ---------------- 06 · LA STRUTTURA ---------------- */
{ num:'06', title:'Perché l’esponente è esattamente 2', meta:'lo strato che il programma d’esame non contiene · cosa cadrebbe se cadesse',
  blocchi:[
  {t:'prosa', title:'Non è una misura fortunata: è una struttura', tag:'struttura', html:R`
  <p>L'esponente $2$ in $1/r^{2}$ sembra un dato sperimentale, e storicamente lo è stato. Ma è legato a tre cose che senza di esso crollerebbero, e vale la pena vederle prima di incontrarle:</p>
  <ul>
  <li><b>Il <span class="str" data-str="flusso-di-un-campo">flusso</span> è invariante.</b> Attraverso una sfera di raggio $r$ il campo vale $\propto1/r^{2}$ e l'area vale $4\pi r^{2}$: il prodotto non dipende da $r$. È vero <i>solo</i> con l'esponente 2 — con $1/r^{3}$ il flusso calerebbe come $1/r$, e non esisterebbe nessuna legge che lega il flusso alla sola carica racchiusa.</li>
  <li><b>Il campo dentro un guscio carico è nullo</b>. Newton dimostrò lo stesso per la gravità, e la dimostrazione usa la compensazione esatta fra l'area di un cono ($\propto r^{2}$) e l'intensità ($\propto1/r^{2}$). Cavendish ne fece la misura più precisa dell'esponente proprio cercando campo dentro un conduttore cavo.</li>
  <li><b>Il fotone ha massa nulla</b>. In elettrodinamica, un fotone massivo darebbe un potenziale di Yukawa $e^{-\mu r}/r$ invece di $1/r$. I limiti sperimentali su $|n-2|$ sono oggi dell'ordine di $10^{-16}$, e sono al tempo stesso limiti sulla massa del fotone.</li>
  </ul>`},
  {t:'reveal', title:'Cosa succede se cade un’ipotesi', html:R`
  <p><b>Se cadesse la linearità</b> (sovrapposizione), tutto il calcolo integrale del punto 03 sarebbe illegittimo: non si potrebbe sommare il contributo dei pezzetti. Succede davvero nei dielettrici a campo altissimo e nel vuoto quantistico.</p>
  <p><b>Se l'esponente non fosse 2</b>, il flusso dipenderebbe dal raggio, Gauss non sarebbe una legge ma un'approssimazione, e la forma locale $\nabla\cdot\mathbf{E}=\rho/\varepsilon_0$ non esisterebbe. Metà del corso è costruita su quell'esponente.</p>
  <p><b>Se le cariche si muovono</b>, tutto ciò che è scritto qui resta valido solo come approssimazione statica. La correzione non è un termine piccolo da aggiungere: è un secondo campo, che agisce solo su cariche in moto, con intensità dell'ordine di $v/c$ rispetto a quello elettrico. Per gli elettroni di conduzione in un filo, che si spostano a frazioni di millimetro al secondo, quel rapporto è dell'ordine di $10^{-13}$ — e nonostante questo il magnetismo di una calamita si vede a occhio nudo, perché nel filo la carica elettrica netta è nulla e il termine dominante è cancellato. Tutto il magnetismo, in un certo senso, è ciò che resta di una cancellazione quasi perfetta: la stessa struttura del dipolo, su scala diversa.</p>`}
  ]},

/* ---------------- 07 · ESERCIZI ---------------- */
{ num:'07', title:'Esercizi — tocca a te', meta:'presi dalla forma che ricorre nelle prove 2008-2021',
  blocchi:[
  {t:'esercizio', title:'1 · Bacchetta finita, sull’asse', html:R`
  <p>Bacchetta di lunghezza $L$, carica $Q$ uniforme, punto $P$ sull'asse della bacchetta a distanza $a$ dall'estremo più vicino. Calcola $E(P)$ e verifica il limite $a\gg L$.</p>`,
   sol:R`<p>Qui <b>non</b> serve la simmetria: tutti i contributi sono già paralleli. Con $\lambda=Q/L$ e $x$ misurata da $P$:
   $$E=\frac{\lambda}{4\pi\varepsilon_0}\int_a^{a+L}\frac{dx}{x^{2}}=\frac{\lambda}{4\pi\varepsilon_0}\left(\frac1a-\frac1{a+L}\right)=\frac{Q}{4\pi\varepsilon_0\,a(a+L)}.$$
   Per $a\gg L$ il denominatore $\to a^{2}$ e si ritrova la carica puntiforme. <b>Il controllo va sempre fatto</b>: se non tornasse, l'errore è quasi sempre negli estremi di integrazione.</p>`},
  {t:'esercizio', title:'2 · Due dischi affacciati', html:R`
  <p>Due dischi coassiali di raggio $R$ e densità $+\sigma$ e $-\sigma$, a distanza $h\ll R$. Campo in mezzo, e fuori.</p>`,
   sol:R`<p>Con $h\ll R$ ciascuno è quasi un piano infinito: $\sigma/2\varepsilon_0$ ciascuno. In mezzo i due contributi hanno <b>lo stesso verso</b> e si sommano: $E=\sigma/\varepsilon_0$. Fuori hanno verso opposto e si cancellano: $E\simeq0$. È il condensatore piano, e questo conto in tre righe è già tutta la sua fisica: campo uniforme dentro, nullo fuori, e proporzionale alla densità di carica e non alla distanza fra le piastre.</p>`},
  {t:'esercizio', title:'3 · Anello con un pezzo mancante', html:R`
  <p>Anello di raggio $R$ e densità $\lambda$ a cui manca un archetto di lunghezza $\ell\ll R$. Campo al <b>centro</b>.</p>`,
   sol:R`<p>Trucco della <b>sovrapposizione con segno</b>: anello completo (campo nullo al centro, per simmetria) meno un archetto di carica $\lambda\ell$ posto a distanza $R$. Quindi
   $$E=\frac{\lambda\ell}{4\pi\varepsilon_0R^{2}},$$
   diretto <i>verso</i> il buco se $\lambda>0$. Ricostruire l'oggetto come «tutto meno un pezzo» è il metodo più redditizio di questo movimento, e ricorre in molte prove.</p>`},
  {t:'collaudo', title:'Controlla di aver capito', html:R`
  <ol>
  <li>Perché nel campo dell'anello l'integrale $\int dq$ esce dal segno di integrale, e nel disco no?</li>
  <li>Il campo del piano infinito non dipende dalla distanza. Non viola il buon senso?</li>
  <li>Perché il dipolo va come $1/r^{3}$ e non come $1/r^{2}$?</li>
  <li>In quale dei quattro casi la simmetria <b>non</b> uccide due componenti su tre, e perché?</li>
  </ol>`,
   sol:R`<ol>
   <li>Perché per l'anello $r$ e $\cos\theta$ sono uguali per ogni pezzetto; nel disco cambiano col raggio $s$, quindi restano dentro.</li>
   <li>No: allontanandosi il campo di ogni pezzetto cala, ma si «vede» una porzione di piano più grande, e le due cose si compensano esattamente. È lo stesso bilanciamento che rende invariante il flusso.</li>
   <li>Perché la carica totale è nulla: il termine $1/r^{2}$ si cancella fra le due cariche e sopravvive il primo ordine successivo.</li>
   <li>Nella semicirconferenza: non c'è il gemello diametralmente opposto, quindi si cancella solo una componente e l'altra va integrata.</li>
   </ol>`}
  ]},

/* ---------------- 08 · IL SENSO ---------------- */
{ num:'08', title:'Il senso, e le rotte', meta:'cosa consegna · dove si ritrova in Quantistica e in Statistica',
  blocchi:[
  {t:'prosa', title:'Cosa consegna questo movimento', tag:'sintesi', html:R`
  <p>Due cose, e sono di natura diversa. La prima è <b>un metodo</b>: scegli $dq$, scrivi $dE$, uccidi le componenti con la simmetria, integra, controlla i limiti. Non è un metodo dell'elettrostatica — è il metodo di ogni interazione che si sommi linearmente sulle sorgenti, e ricompare identico con la legge di Biot-Savart al posto di quella di Coulomb quando le sorgenti sono correnti invece che cariche. Vale metà dei punti di ogni prova d'esame di questo corso.</p>
  <p>La seconda è <b>un oggetto</b>: il campo, introdotto qui come scorciatoia per non riscrivere la carica di prova, e destinato a diventare il protagonista. Il percorso che farà è una scala di autonomie crescenti: prima è solo un modo di scrivere la forza; poi è qualcosa che ha un <i>flusso</i>, cioè una proprietà geometrica propria; poi qualcosa che contiene <i>energia</i>, $u=\tfrac12\varepsilon_0E^{2}$, e quindi pesa nel bilancio; infine qualcosa che esiste <b>senza cariche</b>, si stacca dalle sorgenti e viaggia alla velocità della luce. Alla fine del corso l'oggetto ausiliario è l'unica cosa rimasta, e le cariche sono diventate le sue condizioni al contorno.</p>`},
  {t:'prolessi', title:'Le rotte fuori dal corso', html:R`
  <p><b>Verso la Quantistica.</b> La funzione $1/r$ di cui il campo coulombiano è il gradiente — l'energia potenziale $U=-\frac{e^{2}}{4\pi\varepsilon_0 r}$ fra protone ed elettrone — è il potenziale dell'atomo di idrogeno: l'unico problema quantistico a tre dimensioni risolubile esattamente, e la ragione per cui l'idrogeno è il banco di prova di tutta la teoria. La degenerazione «accidentale» dei suoi livelli, quella per cui l'energia dipende solo da $n$ e non da $\ell$, è una conseguenza diretta dell'esponente $2$ in Coulomb: in un potenziale $1/r^{1+\epsilon}$ le orbite non si chiuderebbero e quella degenerazione sparirebbe.</p>
  <p><b>Verso la Statistica.</b> L'interazione $1/r$ è a <i>lungo raggio</i>: non decade abbastanza in fretta perché l'energia di un sistema di cariche sia proporzionale al volume, e l'additività dell'energia è l'ipotesi su cui poggia la termodinamica ordinaria. È il motivo per cui i plasmi e i sistemi gravitazionali hanno una termodinamica anomala — capacità termiche negative, assenza di limite termodinamico — e, sul versante opposto, il motivo per cui in un conduttore la carica libera si dispone tutta sulla superficie: è la configurazione che minimizza l'energia di un'interazione che non si lascia schermare a corto raggio.</p>`}
  ]}

];


/* =================================================================== */
var byId = {}; TAPPE.forEach(function(s){ byId[s.num]=s; });

var VKEY='pm-nucleoem-01-visited';
function loadSeen(){ try{ return new Set(JSON.parse(localStorage.getItem(VKEY)||'[]')); }catch(e){ return new Set(); } }
function saveSeen(s){ try{ localStorage.setItem(VKEY, JSON.stringify(Array.from(s))); }catch(e){} }
var SEEN = loadSeen();

function renderNav(active){
  var nav=document.getElementById('sidebar');
  nav.innerHTML='';
  var h=document.createElement('h2'); h.textContent='Nucleo em-01 · le tappe'; nav.appendChild(h);
  TAPPE.forEach(function(s){
    var b=document.createElement('button');
    b.className='navitem'+(active===s.num?' active':'')+(SEEN.has(s.num)?' seen':'');
    b.innerHTML='<span class="dot"></span><span class="nx">'+s.num+'</span><span>'+s.title+'</span>';
    b.onclick=function(){ showTappa(s.num); };
    nav.appendChild(b);
  });
}

/* ---- renderer dei blocchi ---- */
function sectionProsa(title, tag, html){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var body=elFromHTML('<div class="open-body">'+html+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function sectionGram(title, rows){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag gramtag">grammatica</span></h3>';
  var inner='<table class="gramtab">';
  rows.forEach(function(r){ inner+='<tr><td class="gs">'+r[0]+'</td><td>'+r[1]+'</td></tr>'; });
  inner+='</table>';
  var body=elFromHTML('<div class="gramwrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
/* --- blocco PLOT: la figura non decora, si legge. Ogni plot porta una chiave di lettura. --- */
function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';
  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
    else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
    else if(b.t==='prolessi') m.appendChild(sectionProlessi(b));
    else if(b.t==='reveal')m.appendChild(sectionReveal(b.title,b.tag,b.steps));
    else if(b.t==='esercizio') m.appendChild(sectionEsercizio(b));
    else if(b.t==='collaudo')  m.appendChild(sectionCollaudo(b.title,b.items));
    else if(b.t==='plot')      m.appendChild(sectionPlot(b));
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}

/* deep-link: em-01-campo-elettrico.html#03 apre direttamente la tappa 03 */
window.addEventListener('DOMContentLoaded', function(){
  var h=(location.hash||'').replace('#','');
  showTappa(byId[h]?h:'00');
});
window.addEventListener('hashchange', function(){
  var h=(location.hash||'').replace('#','');
  if(byId[h]) showTappa(h);
});
</script>
