  .katex{font-size:1.02em;color:var(--txt);} .katex-display{margin:.5em 0;overflow-x:auto;overflow-y:hidden;}

/* ===================================================================

var CORSO = 'meccanica-statistica';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["stirling"] = {"nome":"Approssimazione di Stirling","riga":"Per $N$ grande, $\\ln N! = N\\ln N - N + \\tfrac12\\ln(2\\pi N) + O(1/N)$; quasi sempre bastano i primi due termini.","serve":"Il fattoriale nasce ogni volta che si contano configurazioni, e $N!$ con $N\\sim 10^{23}$ non e' un numero che si maneggia. Stirling lo trasforma in una funzione liscia e derivabile di $N$ — ed e' proprio la derivabilita', non la comodita', il punto: senza di essa non si potrebbe massimizzare un'entropia rispetto a un numero di occupazione.","esempio":"Con $N=10$: $\\ln 10! = 15{,}104$, mentre $N\\ln N - N = 13{,}026$ e il termine $\\tfrac12\\ln(2\\pi N)=2{,}070$ porta a $15{,}096$ — tre cifre esatte gia' a dieci. Il terzo termine e' trascurabile in termodinamica perche' cresce come $\\ln N$ contro $N$: su $N=10^{23}$ pesa $10^{-22}$ in relativo. Per questo in meccanica statistica si scrive $\\ln N!\\simeq N\\ln N-N$ e non si guarda indietro.","pieno":null,"qui":{"meccanica-statistica":{"serve":"E' lo strumento senza il quale il conteggio microcanonico non diventa termodinamica. $S=k\\ln\\Omega$ con $\\Omega$ pieno di fattoriali resta un'espressione; applicato Stirling, $S$ diventa una funzione estensiva di $N$, $V$, $E$ che si puo' derivare per ottenere temperatura e pressione.","esempio":"Nel gas ideale il conteggio corretto di Boltzmann divide per $N!$, e il suo logaritmo $-\\ln N!\\simeq -N\\ln N+N$ e' esattamente il termine che rende l'entropia estensiva e scioglie il paradosso di Gibbs. Togliere Stirling di li' significa non vedere piu' da dove viene il $-N\\ln N$ della Sackur-Tetrode."}}};
STRUM["delta-di-dirac"] = {"nome":"Delta di Dirac","riga":"Non è una funzione ma un funzionale, definito da $\\int f(x)\\,\\delta(x-a)\\,dx=f(a)$, che composto con una funzione si spezza sui suoi zeri come $\\delta(g(x))=\\sum_i \\delta(x-x_i)/|g'(x_i)|$.","serve":"Serve come macchina per cambiare variabile senza invertire nulla. La densità di $y=f(x)$ si scrive $p_Y(y)=\\int p_X(x)\\,\\delta(y-f(x))\\,dx$, e la delta produce da sola il fattore $1/|f'|$ che altrimenti andrebbe messo a mano: i rami molteplici si contano da soli invece di doverli ricordare. È la ragione pratica per cui il formalismo con la delta compare in ogni soluzione d'esame che tocchi una distribuzione, mentre il cambio di variabile esplicito compare quasi mai.","esempio":"$\\delta(x^2-a^2)$ con $a$ positivo. Gli zeri sono $x=\\pm a$; la derivata dell'argomento è $2x$, che in modulo vale $2a$ su entrambi. Quindi $\\delta(x^2-a^2)=\\dfrac{1}{2a}\\big[\\delta(x-a)+\\delta(x+a)\\big]$. Il caso si ripete identico in fisica statistica con $\\varepsilon=p^2/2m$ in una dimensione, dove i due rami $p=\\pm\\sqrt{2m\\varepsilon}$ contribuiscono entrambi — e dimenticarne uno dimezza la risposta.","pieno":{"file":"15-distribuzioni.html","tappa":"01","come":"le distribuzioni come funzionali, la delta e le sue proprietà, nel nucleo di Metodi"},"qui":{"meccanica-statistica":{"serve":"È lo strumento con cui si calcola la densità degli stati, cioè l'oggetto su cui poggia tutto il secondo tempo del corso: $g(\\varepsilon)=\\int d^dp\\,d^dq\\;\\delta(\\varepsilon-H)/h^d$. L'identità che si usa davvero non è la definizione ma questa: $\\delta(\\varepsilon-H)=\\partial_\\varepsilon\\,\\theta(\\varepsilon-H)$. Si scambia l'integrale con la derivata e ci si ritrova a calcolare il volume della regione dove l'hamiltoniana sta sotto $\\varepsilon$ — un integrale elementare — invece di un integrale con una delta dentro. La $g$ così ottenuta è pura geometria dello spazio delle fasi: non sa nulla della temperatura, e per questo resta identica quando si passa da Boltzmann a Fermi o a Bose.","esempio":"Particella libera in due dimensioni. Il volume della regione $p^2/2m$ sotto $\\varepsilon$ è il disco di area $2\\pi m\\varepsilon$; derivando rispetto a $\\varepsilon$ si ottiene $2\\pi m$, cioè una densità degli stati costante. Non è una curiosità: è la ragione per cui in due dimensioni una particella libera non condensa, e per cui le prove che chiedono la condensazione in $d=2$ mettono sempre un potenziale confinante, che porta la $g$ da costante a crescente."}},"controllo":[{"tipo":"derivata","espr":"x**2-a**2","rispetto":["x"],"vale":"2*x","ipotesi":{"x":"positive","a":"positive"},"dove":"esempio","appare":"2x"},{"tipo":"uguale","sinistra":"1/Abs(2*a)","vale":"1/(2*a)","ipotesi":{"a":"positive"},"dove":"esempio","appare":"\\dfrac{1}{2a}"},{"tipo":"derivata","espr":"2*pi*m*e","rispetto":["e"],"vale":"2*pi*m","ipotesi":{"m":"positive","e":"positive"},"dove":"qui.meccanica-statistica.esempio","appare":"2\\pi m"}]};
STRUM["moltiplicatori-di-lagrange"] = {"nome":"Moltiplicatori di Lagrange","riga":"Per rendere stazionaria $f$ sotto i vincoli $g_{i}=0$ si rende stazionaria $f-\\sum_i\\lambda_i g_i$ nelle variabili libere, trattando i $\\lambda_i$ come incognite in piu'.","serve":"Permette di massimizzare senza prima risolvere i vincoli — che e' quasi sempre impossibile quando le variabili sono $10^{23}$. In cambio si pagano tante incognite quante sono i vincoli, e si guadagna che i moltiplicatori hanno quasi sempre un significato fisico: non sono scorie del metodo, sono le grandezze coniugate ai vincoli.","esempio":"Massimizzare $f=xy$ sul vincolo $x+y=2$: si annulla il gradiente di $xy-\\lambda(x+y-2)$, da cui $y=\\lambda$, $x=\\lambda$ e quindi $x=y=1$, $\\lambda=1$, massimo $1$. Sostituendo il vincolo a mano si sarebbe trovato lo stesso, ma con due vincoli e cento variabili la sostituzione non si fa e questa si'.","pieno":null,"qui":{"meccanica-statistica":{"serve":"E' il modo in cui gli ensemble si DEDUCONO invece di essere postulati: si massimizza l'entropia di Gibbs $S=-k\\sum_i p_i\\ln p_i$ sotto i vincoli che le probabilita' sommino a uno e che l'energia media sia fissata, e la distribuzione di Boltzmann esce come conseguenza. I due moltiplicatori non restano anonimi: uno si rivela essere $\\beta=1/kT$, l'altro la normalizzazione.","esempio":"Da $\\partial_{p_i}\\big[-k\\sum p\\ln p-\\alpha(\\sum p-1)-\\beta'(\\sum pE-U)\\big]=0$ si ottiene $-k(\\ln p_i+1)-\\alpha-\\beta' E_i=0$, cioe' $p_i\\propto e^{-\\beta E_i}$ con $\\beta=\\beta'/k$. Il confronto con la termodinamica identifica poi $\\beta=1/kT$: il moltiplicatore del vincolo sull'energia E' l'inverso della temperatura."}}};
STRUM["integrale-gaussiano"] = {"nome":"Integrale gaussiano","riga":"$\\displaystyle\\int_{-\\infty}^{+\\infty} e^{-ax^{2}}\\,dx=\\sqrt{\\pi/a}$ per $a>0$, e $\\displaystyle\\int_{-\\infty}^{+\\infty} x^{2}e^{-ax^{2}}\\,dx=\\tfrac12\\sqrt{\\pi/a^{3}}$.","serve":"E' l'unico integrale che serve davvero sapere a memoria in meccanica statistica, perche' l'energia cinetica e' quadratica nell'impulso e quindi ogni integrazione sugli impulsi e' una gaussiana. Il trucco della dimostrazione — elevare al quadrato e passare in coordinate polari — vale la pena di vederlo una volta: e' il motivo per cui compare un $\\pi$ in una formula che di cerchi non parla.","esempio":"Da $I^{2}=\\iint e^{-a(x^{2}+y^{2})}dx\\,dy=2\\pi\\int_{0}^{\\infty}re^{-ar^{2}}dr=\\pi/a$ segue $I=\\sqrt{\\pi/a}$. I momenti superiori si ottengono derivando rispetto ad $a$ sotto il segno: $-\\partial_a I=\\int x^{2}e^{-ax^{2}}dx=\\tfrac12\\sqrt{\\pi}\\,a^{-3/2}$. Derivare rispetto a un parametro e' piu' rapido che integrare per parti, e funziona per tutti i momenti pari.","pieno":null,"qui":{"meccanica-statistica":{"serve":"La funzione di partizione di una particella libera e' un prodotto di tre gaussiane negli impulsi, e da li' esce la lunghezza d'onda termica $\\lambda=h/\\sqrt{2\\pi m k T}$ — che e' la grandezza con cui si misura quando un gas smette di essere classico.","esempio":"$\\int e^{-\\beta p^{2}/2m}dp=\\sqrt{2\\pi m/\\beta}$, quindi $Z_{1}=\\dfrac{V}{h^{3}}(2\\pi mkT)^{3/2}=V/\\lambda^{3}$. Lo stesso integrale col peso $p^{2}$ da' $\\langle p^{2}/2m\\rangle=\\tfrac12 kT$ per grado di liberta': l'equipartizione non e' un principio a parte, e' questo integrale."}}};
STRUM["trasformata-di-legendre"] = {"nome":"Trasformata di Legendre","riga":"Scambia una variabile con la sua derivata coniugata: da $f(x)$ si passa a $g(p)=f(x)-px$ con $p=df/dx$, e $dg=-x\\,dp$.","serve":"Serve quando la variabile naturale di una funzione non e' quella che si controlla in laboratorio. La trasformata non perde informazione — da $g$ si torna a $f$ — e cambia solo quale variabile e' indipendente. E' l'operazione che genera tutti i potenziali termodinamici l'uno dall'altro, e la stessa che porta dalla lagrangiana all'hamiltoniana.","esempio":"Con $f(x)=x^{2}$: $p=2x$, $x=p/2$, $g=x^{2}-px=p^{2}/4-p^{2}/2=-p^{2}/4$. Il segno negativo non e' un errore: per $f$ convessa la trasformata e' concava, e applicandola due volte si torna a $f$.","pieno":null,"qui":{"meccanica-statistica":{"serve":"E' il ponte fra gli ensemble. Il passaggio da microcanonico a canonico non e' solo un cambio di racconto — energia fissata contro temperatura fissata — e' una trasformata di Legendre dell'entropia, e questo spiega perche' i due ensemble danno gli stessi risultati all'equilibrio: la trasformata e' invertibile.","esempio":"Da $S(E)$ con $1/T=\\partial S/\\partial E$ si passa all'energia libera $F=E-TS$, funzione di $T$ invece che di $E$, con $dF=-S\\,dT-p\\,dV$. Lo stesso schema porta da $F$ al gran potenziale $\\Omega=F-\\mu N$ scambiando $N$ con $\\mu$: e' sempre la stessa operazione, applicata a una coppia coniugata diversa."}}};
STRUM["ordini-di-grandezza"] = {"nome":"Ordini di grandezza","riga":"Stimare una quantità alla potenza di dieci giusta: si tiene una cifra significativa, si sommano e si sottraggono gli esponenti, e si controlla che l'unità del risultato sia quella che si voleva.","serve":"A sapere se un risultato è plausibile prima di averlo calcolato con precisione, e ad accorgersi di un errore di impostazione quando c'è ancora tempo per rimediare. In astrofisica non è una comodità ma il modo normale di ragionare, per due ragioni: le grandezze in gioco vanno da $10^{-36}$ kg a $10^{53}$ kg e nessuna intuizione le copre, e i dati osservativi sono noti al dieci o al venti per cento, quindi una cifra significativa è spesso tutto ciò che il problema contiene davvero. Il controllo che smaschera più errori non è sul numero, è sull'**unità**: un conto che dovrebbe dare una densità e dà dei kg è sbagliato nell'impostazione, e nessun affinamento dell'aritmetica lo salverà. La seconda regola è il confronto con un termine noto — l'acqua per una densità, il Sole per una massa o una luminosità, il parsec per una distanza galattica — perché un numero senza metro non dice niente.","esempio":"Densità media del Sole, dalle due sole quantità stampate in calce al foglio d'esame, $M_\\odot=1{,}989\\cdot10^{30}$ kg e $R_\\odot=6{,}957\\cdot10^{8}$ m: $\\rho=\\dfrac{3M_\\odot}{4\\pi R_\\odot^{3}}=1410\\ \\mathrm{kg/m^3}$. Il confronto è immediato e istruttivo: è quasi una volta e mezza l'acqua, cioè il Sole è in media meno denso della Terra — una stella non è un sasso grande, è un gas tenuto insieme dal proprio peso.","pieno":{"file":"as-01-la-scala-del-cosmo.html","tappa":"01","come":"la gerarchia delle strutture cosmiche letta come scala di ordini di grandezza, e il tempo di luce come secondo asse della stessa tabella"},"controllo":[{"tipo":"numero","espr":"3*1.989e30/(4*pi*(6.957e8)**3)","vale":"1410","dove":"esempio","appare":"1410"}]};
STRUM["serie-geometrica"] = {"nome":"Serie geometrica","riga":"La somma $\\sum_{n\\ge 0} q^{n}$ vale $\\dfrac{1}{1-q}$ se $|q|\\lt 1$, e non esiste se $|q|\\ge 1$.","serve":"È l'unica serie di cui si conosce la somma in forma chiusa senza fatica, e per questo diventa il metro di tutte le altre: una serie si studia maggiorandola con una geometrica (criterio del rapporto, criterio della radice) o riconoscendola come geometrica travestita.","esempio":"Con $q=\\tfrac12$: $1+\\tfrac12+\\tfrac14+\\cdots=\\dfrac{1}{1-\\tfrac12}=2$. Con $q=-\\tfrac13$: $\\dfrac{1}{1+\\tfrac13}=\\tfrac34$. Con $q=1$ le somme parziali sono $N+1$ e se ne vanno: la formula $1/(1-q)$ non è una scorciatoia da usare fuori dal suo raggio.","pieno":{"file":"07-serie-funzioni.html","tappa":"04","come":"il raggio $R=1$, il grafico delle somme parziali e la cassetta dei trucchi che parte da qui, nella tappa sulle serie di potenze"},"qui":{"metodi-e-modelli":{"serve":"È il motore della serie di Laurent: lo sviluppo di $\\dfrac{1}{z-a}$ in potenze di $z$ o di $1/z$ è una geometrica, e quale delle due si sceglie decide in quale corona si sta sviluppando. Tutta la parte principale di Laurent nasce da qui.","esempio":"Per $\\dfrac{1}{z-2}$ con $|z|\\lt 2$ si scrive $-\\tfrac12\\cdot\\dfrac{1}{1-z/2}=-\\sum_{n\\ge0}\\dfrac{z^{n}}{2^{n+1}}$; in $z=1$ entrambi i membri valgono $-1$. Per $|z|\\gt 2$ si raccoglie invece $z$ e viene $\\sum_{n\\ge0}\\dfrac{2^{n}}{z^{n+1}}$, cioè solo potenze negative; in $z=4$ entrambi i membri valgono $\\tfrac12$."},"elettromagnetismo":{"serve":"Compare ogni volta che una configurazione si ripete con un fattore costante — catene di cariche immagine fra due piani conduttori, riflessioni multiple in una cavità — e la somma chiusa è ciò che rende il conto finito invece che infinito.","esempio":"Una carica fra due piani paralleli genera immagini a distanze crescenti, e il contributo al potenziale è una somma del tipo $\\sum_{n\\ge0} r^{n}$ con $r\\lt 1$ fissato dalla geometria. Con una riflettività $r=\\tfrac14$ la serie vale $\\tfrac43$: la catena è infinita, il potenziale no."}},"controllo":[{"tipo":"somma","espr":"(1/2)**n","var":"n","da":"0","a":"oo","vale":"2","dove":"esempio","appare":"=2"},{"tipo":"somma","espr":"(-1/3)**n","var":"n","da":"0","a":"oo","vale":"3/4","dove":"esempio","appare":"\\tfrac34"},{"tipo":"somma","espr":"-1**n/2**(n+1)","var":"n","da":"0","a":"oo","vale":"-1","dove":"qui.metodi-e-modelli.esempio","appare":"-1"},{"tipo":"somma","espr":"2**n/4**(n+1)","var":"n","da":"0","a":"oo","vale":"1/2","dove":"qui.metodi-e-modelli.esempio","appare":"\\tfrac12"},{"tipo":"somma","espr":"(1/4)**n","var":"n","da":"0","a":"oo","vale":"4/3","dove":"qui.elettromagnetismo.esempio","appare":"\\tfrac43"},{"tipo":"uguale","sinistra":"1/(1-2)","vale":"-1","dove":"qui.metodi-e-modelli.esempio","appare":"-1"},{"tipo":"uguale","sinistra":"1/(4-2)","vale":"1/2","dove":"qui.metodi-e-modelli.esempio","appare":"\\tfrac12"}]};
STRUM["funzione-gamma"] = {"nome":"Funzione Gamma","riga":"$\\Gamma(z)=\\displaystyle\\int_0^{\\infty}t^{z-1}e^{-t}\\,dt$, e da questa $\\displaystyle\\int_0^{\\infty}t^{k}e^{-at}\\,dt=\\dfrac{\\Gamma(k+1)}{a^{k+1}}$ per $a>0$.","serve":"E' il fattoriale esteso ai numeri non interi — $\\Gamma(n+1)=n!$ — e soprattutto e' la forma chiusa di TUTTI gli integrali del tipo «potenza per esponenziale». Sapere questa sola formula sostituisce una decina di integrazioni per parti, e permette di leggere a vista il risultato di un integrale appena si riconosce l'esponente della potenza.","esempio":"Da $\\Gamma(z+1)=z\\,\\Gamma(z)$, che si ottiene integrando per parti una volta, discende $\\Gamma(n+1)=n!$ per $n$ intero: $\\Gamma(1)=1$, $\\Gamma(2)=1$, $\\Gamma(3)=2$, $\\Gamma(4)=6$. Sui semi-interi il capostipite e' $\\Gamma(\\tfrac12)=\\sqrt\\pi$ — che e' l'integrale gaussiano travestito — e da li' $\\Gamma(\\tfrac32)=\\tfrac12\\sqrt\\pi$, $\\Gamma(\\tfrac52)=\\tfrac34\\sqrt\\pi$. Un integrale come $\\int_0^\\infty t^{2}e^{-at}dt$ vale dunque $\\Gamma(3)/a^{3}=2/a^{3}$, senza fare nessun conto.","pieno":null,"qui":{"meccanica-statistica":{"serve":"E' l'inventario degli integrali del canonico ridotto a una riga. Ogni funzione di partizione di singola particella e' un integrale di potenza per esponenziale — cambia solo l'esponente, e con esso la fisica: $t^{1/2}$ per il gas classico, $t^{2}$ per l'ultrarelativistico, $t^{3/n}$ per un potenziale $\\alpha r^{n}$. Riconoscere quale $\\Gamma$ si sta calcolando e' cio' che distingue chi risolve lo scritto in dieci minuti da chi lo risolve in un'ora.","esempio":"Per una particella relativistica con $\\varepsilon=cp$ la partizione porta $\\int_0^\\infty p^{2}e^{-\\beta cp}dp=\\Gamma(3)/(\\beta c)^{3}=2/(\\beta c)^{3}$, da cui $\\langle\\varepsilon\\rangle=3T$ invece dei $\\tfrac32T$ del caso non relativistico. Il fattore 3 contro $3/2$ viene per intero dall'esponente della potenza, cioe' dall'argomento della Gamma: la dipendenza dell'energia dalla quantita' di moto decide da sola quanto calore serve a scaldare il gas."}}};
STRUM["funzione-zeta-di-riemann"] = {"nome":"Funzione zeta di Riemann","riga":"$\\zeta(s)=\\sum_{n\\ge1} n^{-s}$, convergente per $s>1$; i valori che servono sono $\\zeta(3/2)\\simeq 2{,}612$, $\\zeta(2)=\\pi^{2}/6\\simeq1{,}645$, $\\zeta(3)\\simeq1{,}202$, $\\zeta(4)=\\pi^{4}/90$.","serve":"Compare tutte le volte che una somma su stati discreti viene approssimata con un integrale e si sviluppa l'integrando in serie geometrica: si scambiano somma e integrale e resta una zeta moltiplicata per una gamma. Non e' un abbellimento — il valore NUMERICO di $\\zeta(3/2)$ decide se una transizione di fase esiste.","esempio":"$\\displaystyle\\int_{0}^{\\infty}\\frac{x^{s-1}}{e^{x}-1}dx=\\Gamma(s)\\zeta(s)$, che si ottiene scrivendo $\\frac{1}{e^{x}-1}=\\sum_{n\\ge1}e^{-nx}$ e integrando termine a termine. Per $s=4$ da' $\\pi^{4}/15$, che e' la costante che compare nella legge di Stefan-Boltzmann.","pieno":null,"qui":{"meccanica-statistica":{"serve":"E' cio' che rende la condensazione di Bose-Einstein un fatto e non una possibilita'. Il numero di particelle negli stati eccitati e' limitato superiormente da un integrale che vale $\\zeta(3/2)$: siccome quel numero e' FINITO, oltre una certa densita' le particelle in eccesso non hanno dove stare se non nello stato fondamentale.","esempio":"La condizione critica e' $n\\lambda^{3}=\\zeta(3/2)\\simeq2{,}612$, che definisce $T_{c}$. In due dimensioni lo stesso conto porta a $\\zeta(1)$, che DIVERGE: gli stati eccitati accolgono qualunque numero di particelle e la condensazione non avviene. La dimensionalita' entra nel risultato attraverso l'argomento della zeta, e il confine e' esattamente $s=1$."}}};

function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';
  return h;
}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

/* ---------------- 00 · DI COSA PARLA QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Di cosa parla questo movimento', meta:'Meccanica Statistica · voce A.10 · il serbatoio che presta particelle, e la variabile che ne regola il prestito',
  blocchi:[
  {t:'prosa', title:'Il secondo baratto', tag:'architettura', html:R`
  <p>La meccanica statistica si costruisce per rinunce successive, e ogni rinuncia è un <b>baratto</b>: si cede il controllo su una grandezza e in cambio si ottiene un conto che si chiude. Il primo baratto è già stato fatto — si è smesso di fissare l&rsquo;energia di un sistema isolato e la si è lasciata fluttuare attorno a un valore medio imposto da un bagno termico, ricevendo in cambio la somma su <i>tutti</i> gli stati con peso $e^{-\beta H}$, che è molto più maneggevole di un conteggio vincolato su una superficie di energia costante. Il prezzo era un parametro nuovo, la temperatura; il guadagno era che il vincolo spariva dall&rsquo;integrale.</p>
  <p>Questo movimento fa lo stesso baratto una seconda volta, e sull&rsquo;altra grandezza conservata: <b>il numero di particelle</b>. Si mette il sistema a contatto con un serbatoio che scambia energia <i>e</i> materia, si smette di pretendere che $N$ sia un numero e lo si lascia fluttuare. Il parametro nuovo è il <b>potenziale chimico</b> $\mu$; il guadagno è enorme, e non è soltanto di comodità.</p>
  <p>Le due ragioni del baratto sono diverse, e conviene tenerle separate perché rispondono a domande diverse. La prima è <b>sperimentale</b>, e il capitolo 9 delle note di Grilli-Giardina (pag. 66) la mette in apertura: in un esperimento non si ha mai a che fare con un sistema davvero isolato, e non si misura mai direttamente l&rsquo;energia totale di un corpo macroscopico — per lo stesso motivo non si dovrebbe pretendere di specificare esattamente quante particelle ci siano, perché <i>quello non si conosce mai con precisione</i>: tutto ciò che un esperimento restituisce è il numero <b>medio</b>. La seconda ragione è <b>computazionale</b>, e la dichiara Crisanti (pag. 249): il vincolo $\sum_p n_p=N$ rende l&rsquo;uso del canonico «piuttosto scomodo» per un gas di particelle identiche, mentre il gran canonico «permette di ricavare i risultati in modo molto più comodo». Rimuovere il vincolo trasforma una somma vincolata sulle configurazioni in un prodotto libero sui livelli, ed è la differenza fra un conto che non si fa e un conto che si fa in tre righe.</p>
  <p>L&rsquo;apparato che ne esce ha tre pezzi, e vale la pena vederli subito tutti e tre perché il resto del movimento li costruisce uno alla volta. La <b>funzione di gran partizione</b>,</p>
  $$\mathcal Z(T,V,\mu)=\sum_{N=0}^{\infty}z^N\,Z(T,V,N),\qquad z\equiv e^{\beta\mu}$$
  <p>dove $z$ si chiama <b>fugacità</b> e $Z(T,V,N)$ è la funzione di partizione canonica a $N$ fissato. Il <b>gran potenziale</b> $\Omega=-T\log\mathcal Z$, che — e questo è il punto meno ovvio del movimento — vale esattamente $\Omega=-PV$, non per convenzione ma per una ragione che si dimostra. E infine il <b>numero di occupazione medio</b> di un singolo livello di energia $\varepsilon$,</p>
  $$\langle n_\varepsilon\rangle=\frac{1}{e^{\beta(\varepsilon-\mu)}\mp1}$$
  <p>che è la formula per cui, in pratica, tutto questo esiste.</p>
  <div class="note"><b>Due convenzioni e cinque disaccordi, dichiarati subito.</b> Entrambe le fonti pongono $k_B=1$: la temperatura è un&rsquo;energia, $\beta=1/T$, l&rsquo;entropia è un numero puro. Nelle tappe in cui si fanno i <b>numeri</b> $k_B$ torna esplicito, perché un ordine di grandezza si verifica in unità SI. Sulla <b>notazione</b> le due fonti divergono: Crisanti chiama la gran partizione $\mathcal Z(T,V,\mu)$, Grilli-Giardina la chiamano $Q(z,V,T)$, e molti manuali usano $\Xi$; qui si scrive $\mathcal Z$, e dove riporto una formula nella grafia dell&rsquo;altra fonte lo dico. Gli altri quattro disaccordi li incontreremo sul posto e li segnalerò lì: la condizione su $\mu$ per le occupazioni illimitate, che Grilli-Giardina chiudono e Crisanti lascia come annotazione aperta; la formula $E=-\partial_\beta\log\mathcal Z$, che Crisanti marca «da verificare» e il formulario di Grilli-Giardina dà per buona; la degenerazione di spin $g_s$, che una fonte porta e l&rsquo;altra pone uguale a uno; e l&rsquo;operatore densità gran canonico, che Crisanti scrive e Grilli-Giardina omettono di proposito. <b>Falcioni-Vulpiani non copre questo argomento</b> — una sola menzione in centotrentasette pagine, misurata: qui le fonti sono due, ed è un fatto, non una lacuna.</div>`},
  {t:'prosa', title:'Perche vale la pena, e come e fatto il movimento', tag:'architettura', html:R`
  <p><b>L&rsquo;obiezione naturale, e la risposta che regge tutto.</b> Lasciar fluttuare $N$ sembra una perdita secca di informazione: un gas in una bombola ha un numero di molecole ben definito, e descriverlo con un insieme in cui quel numero balla è descrivere un altro sistema. La risposta è quantitativa e si misura. La fluttuazione relativa del numero di particelle in un sistema normale va come $N^{-1/2}$: per una mole vuol dire una parte su $7{,}760\times10^{11}$. Un numero che fluttua di una parte su mille miliardi <b>è</b> un numero fissato, per qualunque uso sperimentale, e in cambio si ottiene un formalismo in cui i conti si chiudono. Questa è l&rsquo;equivalenza degli insiemi, e la tappa 05 la dimostra invece di invocarla.</p>
  <p>Ma l&rsquo;equivalenza <b>ha delle condizioni</b>, e il movimento non sarebbe onesto se non le esibisse: la fluttuazione relativa si scriverà come $\sqrt{T\kappa_T/V}$, con $\kappa_T$ la compressibilità isoterma, e va a zero come $V^{-1/2}$ <i>soltanto se $\kappa_T$ resta finita</i>. Nel punto in cui un sistema sta cambiando fase la compressibilità <b>diverge</b>, e là gli insiemi smettono di essere equivalenti: è la tappa 06, ed è il tipo di dettaglio che in un orale distingue chi ha capito da chi ha ripetuto.</p>
  <p><b>La rotta.</b> Si comincia dal serbatoio e dalla marginalizzazione che produce la distribuzione gran canonica, per le due strade che le fonti percorrono: quella «da principi fisici» col sottovolume e quella formale col moltiplicatore. Poi la funzione di gran partizione e la fugacità, con la sorpresa che l&rsquo;equazione di stato esce dalla <i>normalizzazione</i> e non da una derivata. Quindi il gran potenziale: cos&rsquo;è la trasformata di Legendre che ci porta, perché $\Omega=-PV$, e le tre derivate che spremono da $\Omega$ tutta la termodinamica. Le due tappe centrali sono le fluttuazioni con il loro ponte alla compressibilità e il punto in cui quel ponte si spezza. Poi il potenziale chimico: che cosa significa, perché per un gas classico è negativo e grande, come si fissa dalla densità. E infine la tappa che gli scritti usano senza nominare — <b>il numero di occupazione medio di un singolo livello</b> — costruita dal principio, con i due casi (occupazione illimitata e occupazione al più unitaria) ricavati sul posto come conseguenze dello stesso conto. Chiude il gran canonico quantistico, con un caso in cui $\mu$ vale zero e si capisce perché.</p>`}
]},

/* ---------------- 01 · IL SERBATOIO CHE PRESTA PARTICELLE ---------------- */
{ num:'01', title:'Il serbatoio che presta particelle: due strade per la stessa distribuzione', meta:'il sottovolume dentro il volume · lo sviluppo dell energia libera · il moltiplicatore e l integrazione di picco · beta mu e P come forze',
  blocchi:[
  {t:'reveal', title:'La strada fisica: un pezzo di gas dentro il gas', tag:'costruzione', steps:[
   {label:'Il taglio immaginario, e il fattore che conta i modi di tagliare', body:R`
   <p>La costruzione più pulita è quella che Grilli-Giardina svolgono a pag. 66-68 e che Crisanti rifà a pag. 215-216 con gli stessi passaggi: invece di immaginare un serbatoio esterno, si prende un sistema canonico ordinario — $N$ particelle, volume $V$, temperatura $T$ — e si <b>guarda dentro</b>, isolando con un taglio immaginario un sottovolume $V_1$. Le due parti si scambiano liberamente particelle attraverso una superficie che non esiste, e questo è esattamente un sistema aperto.</p>
   <p>Si pone $V=V_1+V_2$ e $N=N_1+N_2$ con $V_2\gg V_1$ e $N_2\gg N_1$: la parte grande farà da serbatoio. Trascurando le interazioni di bordo — che sono effetti di superficie, necessari perché l&rsquo;equilibrio si stabilisca ma trascurabili nel conto — l&rsquo;hamiltoniana si spezza, $H=H_1(P_1,Q_1,N_1)+H_2(P_2,Q_2,N_2)$. Si noti la forma: <b>è la stessa funzione valutata su argomenti diversi</b>, non due funzioni diverse.</p>
   <p>C&rsquo;è però un passaggio che Grilli-Giardina evidenziano e che è facile saltare. Nell&rsquo;integrale sullo spazio delle fasi delle $N$ particelle non interessa <i>quali</i> particelle stiano in $V_1$, ma solo <i>quante</i>: le particelle sono identiche, e scambiarne una di $V_1$ con una di $V_2$ non produce uno stato nuovo. Segregando i contributi secondo il valore di $N_1$ compare quindi il fattore binomiale</p>
   $$\frac{N!}{N_1!\,N_2!}$$
   <p>che conta in quanti modi si possono ripartire $N$ particelle in due insiemi con $N_1$ nel primo. È un fattore che <b>cancella</b> l&rsquo;$1/N!$ del conteggio di Boltzmann e lo sostituisce con $1/(N_1!N_2!)$, cioè con il conteggio corretto <i>separato</i> nei due sottosistemi — ed è per questo che alla fine comparirà una $Z_{N_2}$ genuina e non un residuo combinatorio.</p>
   <p>Vale la pena vedere quanto pesa quel fattore, perché la sua taglia è la ragione per cui la ripartizione «tipica» è così piccata. Per $N=100$ diviso in due metà uguali il logaritmo del binomiale vale $66{,}784$, contro il valore $69{,}315$ che si otterrebbe se ogni particella scegliesse indipendentemente da che parte stare — cioè $100\log2$. I due numeri differiscono per un termine di ordine $\log N$, che è la correzione di <span class="str" data-str="stirling">Stirling</span> al di là del termine dominante: la combinatoria dice che quasi tutte le ripartizioni hanno $N_1\simeq N/2$, e in seguito vedremo questo stesso fatto sotto forma di distribuzione di probabilità.</p>`},
   {label:'Lo sviluppo che fa comparire mu e P', body:R`
   <p>La probabilità di trovare il sottosistema nello stato $s_1$ con $N_1$ particelle si ottiene <b>marginalizzando</b>, cioè sommando la densità canonica congiunta su tutto ciò che riguarda $S_2$. Siccome l&rsquo;hamiltoniana si spezza, la somma su $s_2$ ricostruisce la funzione di partizione della parte grande:</p>
   $$\rho(s_1)=\sum_{s_2}\rho(s_1,s_2)=\frac{Z(T,V_2,N_2)}{Z(T,V,N)}\,e^{-\beta H_1(s_1)}$$
   <p>Ora si usa la relazione ponte del canonico — enunciata qui perché serve adesso: per un sistema a $T$, $V$, $N$ fissati l&rsquo;energia libera di Helmholtz è $F=-T\log Z$, cioè $Z=e^{-\beta F}$, e questa è la definizione operativa di $F$ in meccanica statistica. Il rapporto delle due partizioni diventa allora un&rsquo;esponenziale di una <i>differenza</i> di energie libere:</p>
   $$\frac{Z(T,V_2,N_2)}{Z(T,V,N)}=e^{-\beta[F(T,V_2,N_2)-F(T,V,N)]}$$
   <p>e siccome $V_2=V-V_1$ con $V_1\ll V$, e $N_2=N-N_1$ con $N_1\ll N$, quella differenza si sviluppa al primo ordine:</p>
   $$F(T,V-V_1,N-N_1)-F(T,V,N)\simeq-\left(\frac{\partial F}{\partial V}\right)_{T,N}V_1-\left(\frac{\partial F}{\partial N}\right)_{T,V}N_1=PV_1-\mu N_1$$
   <p>dove si sono riconosciute le due derivate parziali dell&rsquo;energia libera: la derivata rispetto al volume è per definizione meno la pressione, e la derivata rispetto al numero di particelle è per definizione il <b>potenziale chimico</b>. Sono definizioni termodinamiche, non conti; ma conviene vedere subito che non sono vuote, verificandole su un&rsquo;energia libera che conosciamo. Per un gas perfetto classico di $N$ particelle non interagenti in volume $V$ vale $F=-NT\left[\log\dfrac{V}{N\lambda^3}+1\right]$, con $\lambda$ la lunghezza termica di de Broglie; derivando,</p>
   $$\left(\frac{\partial F}{\partial N}\right)_{T,V}=T\log\frac{N\lambda^3}{V}\qquad\left(\frac{\partial F}{\partial V}\right)_{T,N}=-\frac{NT}{V}$$
   <p>La seconda è $-P$ con $P=NT/V$, cioè l&rsquo;equazione di stato; la prima è il potenziale chimico del gas classico, e ci tornerà per intero nella tappa 07. <b>Le derivate sono quelle del sistema grande</b>, non del sottosistema: $P$ e $\mu$ che compaiono qui sono proprietà del serbatoio.</p>`},
   {label:'Il risultato, e la sua lettura come tre forze', body:R`
   <p>Rimettendo lo sviluppo dentro l&rsquo;esponenziale si ottiene la <b>distribuzione gran canonica</b>:</p>
   $$\rho(s_1)=e^{-\beta[H(s_1)-\mu N_1(s_1)+PV_1]}$$
   <p>L&rsquo;indice $1$ a questo punto si può lasciar cadere, perché del sistema esterno non resta nulla se non tre numeri. Ed è qui che Crisanti (pag. 216) dà la lettura che vale l&rsquo;intera derivazione: $\beta$, $\mu$ e $P$ sono i parametri del sistema grande <b>che regolano quel che avverrà nel sistema piccolo, come fossero delle forze</b>. La temperatura regola quanta energia il sottosistema accetta; il potenziale chimico regola quante particelle accetta; la pressione regola quanto volume occupa. Tre grandezze <i>intensive</i>, imposte dall&rsquo;esterno, ciascuna coniugata a una grandezza <i>estensiva</i> lasciata libera.</p>
   <p>Questa è anche la risposta alla domanda «perché proprio $\mu$ e non qualcos&rsquo;altro»: $\mu$ non è stato scelto, è <b>uscito</b> dallo sviluppo come il coefficiente con cui $N_1$ entra nell&rsquo;esponente, esattamente come $\beta$ era uscito come il coefficiente di $H$. La struttura $e^{-\beta(H-\mu N)}$ non è un postulato: è il primo ordine di uno sviluppo di Taylor dell&rsquo;energia libera del resto del mondo.</p>`}
  ]},
  {t:'prosa', title:'La strada formale: il moltiplicatore, e la regola di calcolo', tag:'costruzione', html:R`
  <p>Crisanti arriva allo stesso punto per una seconda strada (pag. 214), e vale la pena percorrerla perché è quella che generalizza: dice <i>come si costruisce un insieme nuovo</i> quando si vuole lasciar libera una grandezza qualsiasi.</p>
  <p>Il punto di partenza è che in tutte le regole di calcolo viste finora il numero di particelle era imposto da un fattore $\delta(N-N(s))$ rimasto sempre implicito: si contavano solo gli stati con il numero giusto. Lasciar libero $N$ significa <b>sostituire quella <span class="str" data-str="delta-di-dirac">delta di Dirac</span> con una funzione che pesa invece di selezionare</b>:</p>
  $$\delta(N-N(s))\;\longrightarrow\;\Delta(N-N(s))=e^{-\lambda(N(s)-N)}$$
  <p>È la stessa mossa con cui, dal microcanonico, si era ottenuto il canonico sostituendo la delta sull&rsquo;energia con $e^{-\beta(H(s)-E)}$: il vincolo rigido diventa un vincolo morbido, e il parametro $\lambda$ è un <span class="str" data-str="moltiplicatori-di-lagrange">moltiplicatore di Lagrange</span> il cui valore va fissato imponendo che la media riproduca il valore voluto. Mettendo il sistema anche in contatto con un bagno termico si ottiene</p>
  $$\Gamma_{\beta,\lambda}(E,N)=\sum_s e^{-\beta(H(s)-E)}e^{-\lambda(N(s)-N)}=\int dE'dN'\,e^{-\beta(E'-E)-\lambda(N'-N)+S(E',N')}$$
  <p>dove nell&rsquo;ultimo passaggio si è inserito $1=\int dE'dN'\,\delta(E'-H(s))\delta(N'-N(s))$ e si è riconosciuto che la somma sugli stati a $E'$ e $N'$ fissati è $\Gamma(E',V,N')=e^{S(E',N')}$. L&rsquo;abuso di notazione — una somma su $N$ scritta come integrale — è di Crisanti e non cambia nulla nel limite termodinamico.</p>
  <p>Ora si fa <b>integrazione di picco</b>: l&rsquo;esponente è estensivo, cioè di ordine $N$, quindi l&rsquo;integrale è dominato dal suo massimo e le fluttuazioni attorno al massimo sono relativamente trascurabili. Il massimo si trova annullando le due derivate:</p>
   $$\frac{\partial}{\partial E'}\Big[-\beta(E'-E)-\lambda(N'-N)+S(E',N')\Big]=-\beta+\frac{\partial S}{\partial E}$$
   $$\frac{\partial}{\partial N'}\Big[-\beta(E'-E)-\lambda(N'-N)+S(E',N')\Big]=-\lambda+\frac{\partial S}{\partial N}$$
  <p>Annullarle significa imporre $(\partial S/\partial E)_N=\beta$ e $(\partial S/\partial N)_E=\lambda$, e le due derivate dell&rsquo;entropia hanno un nome termodinamico. Scrivendo la prima legge risolta rispetto a $dS$, cioè $dS=\frac1T dE+\frac PT dV-\frac\mu T dN$, si legge $(\partial S/\partial E)_{V,N}=1/T$ e $(\partial S/\partial N)_{E,V}=-\mu/T$. Quindi $\beta=1/T$, come già si sapeva, e</p>
  $$\lambda=-\beta\mu$$
  <p><b>Il moltiplicatore che coniuga il numero di particelle è meno beta mu.</b> Il segno non è decorativo: è la ragione per cui nella distribuzione compare $e^{+\beta\mu N}$ e non $e^{-\beta\mu N}$, cioè per cui alzare $\mu$ <i>favorisce</i> gli stati con molte particelle. E il peso finale, $\Gamma_{\beta,\lambda}=\sum_s e^{-\beta(H(s)-E)+\beta\mu(N(s)-N)}$, è lo stesso oggetto trovato per la strada fisica.</p>
  <p>Le due derivazioni si completano: la prima dice <i>che cosa sono</i> $\mu$ e $P$ (proprietà del serbatoio), la seconda dice <i>da dove vengono</i> (moltiplicatori che impongono le medie). Entrambe lasciano però una domanda aperta — come si passa da questa distribuzione a un oggetto con cui si calcola. È la prossima tappa, e la risposta è una funzione di partizione nuova.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Nella distribuzione $\rho(s)=e^{-\beta[H(s)-\mu N(s)+PV]}$ compare il volume $V$ del sottosistema, che però è fissato. Che cosa ci fa lì un termine costante?`,
    a:R`Fa da <b>normalizzazione</b>, ed è l&rsquo;osservazione da cui nascerà l&rsquo;equazione di stato. Il criterio invocato è che $\rho$ deve sommare a uno su tutti gli stati e su tutti i valori di $N$: il fattore $e^{-\beta PV}$ non dipende dallo stato, esce dalla somma, e imporre la normalizzazione lo lega a ciò che resta. Il risultato — che si ricava nella tappa seguente — è che l&rsquo;esponenziale di $\beta PV$ coincide con la gran partizione, cioè che la pressione si legge direttamente dal logaritmo della gran partizione senza derivare niente. Un termine «costante» che porta un&rsquo;equazione di stato non è una costante: è un&rsquo;incognita travestita.`},
   {q:R`Perché lo sviluppo di $F(T,V-V_1,N-N_1)$ si ferma al primo ordine? Non è un&rsquo;approssimazione che andrebbe controllata?`,
    a:R`Lo è, e la condizione è esattamente $V_1\ll V$ e $N_1\ll N$. Il criterio da riconoscere è che $F$ è <b>estensiva</b>, quindi le sue derivate seconde rispetto a $V$ e $N$ sono di ordine $1/V$: il termine di secondo ordine vale $O(V_1^2/V)$ contro il primo che vale $O(V_1)$, e il rapporto è $V_1/V\to0$. È lo stesso argomento con cui, nel canonico, si ferma al primo ordine lo sviluppo dell&rsquo;entropia del bagno. Se il sottosistema <i>non</i> fosse piccolo rispetto al serbatoio, la distribuzione gran canonica non varrebbe — e non è un caso di scuola: è ciò che succede a un grano di condensato in una trappola.`}
  ]}
]},

/* ---------------- 02 · LA GRAN PARTIZIONE E LA FUGACITA ---------------- */
{ num:'02', title:'La funzione di gran partizione, la fugacita, e una equazione di stato che esce dalla normalizzazione', meta:'somma pesata delle canoniche · trasformata di Laplace discreta · il gas classico in una riga · la distribuzione di N',
  blocchi:[
  {t:'reveal', title:'Dalla normalizzazione alla gran partizione', tag:'costruzione', steps:[
   {label:'Si impone che le probabilita sommino a uno', body:R`
   <p>Abbiamo una distribuzione ma non ancora una funzione di partizione. La si ottiene, come sempre, imponendo la normalizzazione — ma qui la somma corre su due indici, perché uno stato del sistema aperto è specificato dal punto nello spazio delle fasi <i>e</i> dal numero di particelle. Seguendo Crisanti (pag. 216) e Grilli-Giardina (pag. 69):</p>
   $$1=\sum_{s}\rho(s)=e^{-\beta PV}\sum_{N=0}^{\infty}e^{\beta\mu N}\sum_{s|N}e^{-\beta H(s)}$$
   <p>Non si è fatto altro che <b>riordinare la somma</b>: prima si raggruppano gli stati secondo quante particelle contengono, poi si somma sui gruppi. La somma interna, a $N$ fissato, è per definizione la funzione di partizione canonica $Z(T,V,N)$ — con dentro il suo $1/(h^{3N}N!)$, che non è sparito. Introducendo la <b>fugacità</b></p>
   $$z\equiv e^{\beta\mu}$$
   <p>la somma esterna diventa una serie di potenze in $z$ con coefficienti le partizioni canoniche, ed è quello che si chiama funzione di <b>gran partizione</b>. Dunque:</p>
   $$e^{\beta PV}=\sum_{N=0}^{\infty}z^N Z(T,V,N)\equiv\mathcal Z(T,V,z)$$
   <p>Si guardi che cosa è appena successo, perché è la sorpresa della tappa. <b>L&rsquo;equazione di stato è uscita dalla normalizzazione</b>, non da una derivata: imponendo che le probabilità sommino a uno si è ottenuto direttamente</p>
   $$\frac{PV}{T}=\log\mathcal Z(T,V,z)$$
   <p>Crisanti (pag. 217) lo sottolinea con queste parole: considerando la $\rho$ e la $\mathcal Z$ appena scritte «possiamo ottenere direttamente l&rsquo;equazione di stato». Nel canonico la pressione costava una derivata rispetto al volume; qui è il logaritmo della funzione di partizione, nudo. Grilli-Giardina aggiungono (pag. 69) l&rsquo;avvertenza che conta: <b>$P$ non è un parametro che noi fissiamo</b> — è una funzione di $T$, $\mu$ e $V$, e il fatto che appaia nella distribuzione non vuol dire che sia una variabile di controllo.</p>`},
   {label:'Una trasformata di Laplace, e che cosa coniuga cosa', body:R`
   <p>La struttura $\mathcal Z=\sum_N z^N Z_N$ merita un nome, e Crisanti (pag. 217) lo dà: «questo oggetto ricorda una trasformata di Laplace della funzione di partizione canonica (è una sommatoria anziché un integrale)». L&rsquo;osservazione non è estetica, ed è il modo giusto di tenere in testa tutto l&rsquo;impianto degli insiemi.</p>
   <p>Si confrontino le due costruzioni, scritte l&rsquo;una sotto l&rsquo;altra. Dal microcanonico al canonico si passa sommando sulle energie con peso $e^{-\beta E}$ il numero di stati a energia fissata: $Z=\sum_E e^{-\beta E}\Gamma(E)$, cioè una trasformata di Laplace di $\Gamma$ rispetto a $E$, con $\beta$ variabile coniugata. Dal canonico al gran canonico si somma sui numeri di particelle con peso $z^N=e^{\beta\mu N}$: $\mathcal Z=\sum_N e^{\beta\mu N}Z_N$, cioè una trasformata di Laplace di $Z$ rispetto a $N$, con $\beta\mu$ variabile coniugata. <b>Ogni insieme nuovo è una trasformata dell&rsquo;insieme precedente rispetto alla grandezza che si vuole liberare</b>, e la variabile coniugata è il moltiplicatore che compare nell&rsquo;esponente. È il motivo per cui la tappa 03 troverà, dal lato termodinamico, una trasformata di Legendre: Laplace sui pesi statistici e Legendre sui potenziali termodinamici sono la stessa operazione vista dai due lati del ponte.</p>
   <p>Una conseguenza immediata e utilissima: poiché $\mathcal Z$ è una serie di potenze in $z$ i cui coefficienti sono le partizioni canoniche, <b>la probabilità che il sistema contenga esattamente $N$ particelle</b> si legge dal termine $N$-esimo,</p>
   $$w(N)=\frac{z^N Z(T,V,N)}{\mathcal Z(T,V,z)}$$
   <p>con $\sum_{N=0}^{\infty}w(N)=1$ per costruzione. Il gran canonico non ha buttato via l&rsquo;informazione sul numero di particelle: l&rsquo;ha trasformata in una distribuzione di probabilità, e nella figura qui sotto si vedrà quanto stretta sia.</p>`},
   {label:'Il gas classico, che si chiude in una riga', body:R`
   <p>Mettiamo alla prova la macchina sul caso che conosciamo. Per $N$ particelle classiche non interagenti la partizione canonica è $Z(T,V,N)=z_1^N/N!$, dove $z_1$ è la partizione di <i>una</i> particella e l&rsquo;$N!$ è il conteggio di Boltzmann. Quel $z_1$ si calcola in tre <span class="str" data-str="integrale-gaussiano">integrali gaussiani</span>: l&rsquo;integrale sulle posizioni dà $V$, e ciascuna delle tre componenti dell&rsquo;impulso dà</p>
   $$\int_{-\infty}^{+\infty}dp_x\,e^{-\beta p_x^2/2m}=\sqrt{\frac{2\pi m}{\beta}}$$
   <p>cosicché $z_1=V/\lambda^3$ con la lunghezza termica $\lambda\equiv h/\sqrt{2\pi mT}$, il cui cubo vale</p>
   $$\lambda^3=\frac{h^3}{(2\pi mT)^{3/2}}$$
   <p>La partizione di una particella è dunque il numero di celle termiche di volume $\lambda^3$ che stanno dentro $V$. Ora si inserisce nella gran partizione, e succede la cosa bella: la serie è quella dell&rsquo;esponenziale.</p>
   $$\mathcal Z(T,V,z)=\sum_{N=0}^{\infty}\frac{(zz_1)^N}{N!}=e^{zz_1}$$
   <p>Da qui tutto esce in due passi. Il logaritmo è $\log\mathcal Z=zz_1$ — un monomio. Il numero medio di particelle, che nella tappa 04 si mostrerà essere $\langle N\rangle=z\,\partial_z\log\mathcal Z$, vale</p>
   $$z\frac{\partial}{\partial z}(zz_1)=zz_1$$
   <p>E l&rsquo;equazione di stato, che avevamo ottenuto dalla normalizzazione, dà $PV=T\log\mathcal Z=T\,zz_1=\langle N\rangle T$, cioè</p>
   $$PV=NT$$
   <p>Crisanti (pag. 218) osserva che la relazione $\langle N\rangle=zz_1$ «è sempre vera per sistemi di particelle indipendenti», e la usa per rifare in tre righe un esercizio che nel canonico ne richiedeva una pagina. È la prima prova che il baratto conviene: la stessa fisica, con un conto più corto.</p>`}
  ]},
  {t:'prosa', title:'La distribuzione del numero di particelle è una Poisson', tag:'grammatica', html:R`
  <p>Con $\mathcal Z=e^{zz_1}$ in mano possiamo scrivere esplicitamente la distribuzione $w(N)$ del gas classico, e il risultato è una vecchia conoscenza. Posto $\bar N\equiv zz_1$,</p>
  $$w(N)=\frac{z^N z_1^N/N!}{e^{zz_1}}=\frac{\bar N^{\,N}}{N!}e^{-\bar N}$$
  <p>cioè una <b>distribuzione di Poisson</b> di media $\bar N$. Non è un accidente: contare particelle indipendenti che entrano ed escono da una regione è esattamente il processo che la Poisson descrive, e la normalizzazione $\sum_{N=0}^{\infty}w(N)=1$ è la serie esponenziale letta al contrario. La varianza di una Poisson è uguale alla media, dunque $\langle\Delta N^2\rangle=\bar N$, e la <b>fluttuazione relativa</b> è</p>
  $$\frac{\sqrt{\langle\Delta N^2\rangle}}{\langle N\rangle}=\frac{1}{\sqrt{\bar N}}$$
  <p>Questo numero è la risposta quantitativa all&rsquo;obiezione della tappa 00. Per $\bar N=25$ vale $0{,}2$, cioè una fluttuazione del venti per cento: un sistema del genere non è affatto «a numero fissato». Per $\bar N=400$ vale $0{,}05$. Per un sistema macroscopico, con $\bar N$ dell&rsquo;ordine di $10^{23}$, vale una parte su mille miliardi. <b>L&rsquo;equivalenza fra canonico e gran canonico non è un teorema astratto: è l&rsquo;osservazione che una larghezza relativa che scala come $\bar N^{-1/2}$ diventa invisibile prima ancora di diventare macroscopica.</b></p>`},
  {t:'plot', title:'La distribuzione di N si stringe al crescere del sistema',
   intro:R`Distribuzione di probabilità del numero di particelle, disegnata nella variabile ridotta $x=N/\bar N$ e normalizzata a uno nel massimo, per tre taglie del sistema. A grande $\bar N$ la Poisson è indistinguibile da una gaussiana di larghezza relativa $\bar N^{-1/2}$, ed è questa forma che si vede qui.`,
   plots:[
    {kind:'func2d', xr:[0.6,1.4], yr:[0,1.15], height:330, ticks:6,
     title:'w(N) in variabile ridotta, per tre valori del numero medio',
     curves:[
      {f:'exp(-25*(x-1)*(x-1)/2)', col:'#ff6b6b', label:'N medio = 25: larghezza relativa 0,2'},
      {f:'exp(-100*(x-1)*(x-1)/2)', col:'#d8a13a', label:'N medio = 100: larghezza relativa 0,1'},
      {f:'exp(-400*(x-1)*(x-1)/2)', col:'#5eead4', label:'N medio = 400: larghezza relativa 0,05'}
     ],
     xlabel:'N / N medio', ylabel:'probabilita (normalizzata al massimo)'}
   ],
   leggi:R`<p><b>Che cosa guardare: la larghezza, non l&rsquo;altezza.</b> Tutte e tre le curve sono centrate sullo stesso punto $x=1$, cioè sul valore medio, e il loro massimo è stato normalizzato a uno per poterle confrontare. L&rsquo;unica differenza è la larghezza, e si restringe come $\bar N^{-1/2}$: quadruplicando il numero medio la campana si dimezza. Questo è il contenuto operativo dell&rsquo;equivalenza degli insiemi — a $\bar N$ grande, <b>chiedere «quante particelle ci sono» e chiedere «qual è il numero medio di particelle» sono la stessa domanda</b>, perché tutti i valori con probabilità apprezzabile stanno entro una frazione $\bar N^{-1/2}$ dalla media.</p>
   <p><b>Che cosa impararne per i conti.</b> Quando in un problema gran canonico si scrive $N$ senza dire «medio», non è sciatteria: è l&rsquo;uso legittimo del fatto che la distribuzione è piccata. Grilli-Giardina lo annotano espressamente a pag. 83 — la $N$ che si ricava da $z\,\partial_z\log\mathcal Z$ è in realtà $\langle N\rangle$, e tuttavia è stabile attorno al suo valore medio con fluttuazioni che scalano come $1/\sqrt N$. <b>Ma la stessa figura dice anche quando l&rsquo;uso non è legittimo</b>: la curva rossa, con venticinque particelle, è larga il venti per cento, e per un sistema così — una trappola con pochi atomi, un sito di adsorbimento, una regione microscopica di un fluido — il valore medio <i>non</i> è il valore tipico e l&rsquo;insieme che si sceglie cambia i numeri.</p>
   <p><b>Dove questa figura mente.</b> Disegna una campana simmetrica, mentre la Poisson è asimmetrica (ha una coda destra più lunga) e vive su interi. Le due differenze sono dello stesso ordine della larghezza relativa, cioè invisibili nella curva verde e appena percettibili in quella rossa — ed è esattamente la ragione per cui a $\bar N$ grande si può sostituire la Poisson con una gaussiana e poi la gaussiana con il suo massimo.</p>`}
]},

/* ---------------- 03 · IL GRAN POTENZIALE ---------------- */
{ num:'03', title:'Il gran potenziale: la trasformata di Legendre che scambia N con mu, e perche vale meno PV', meta:'da F a Omega · le variabili naturali · estensivita e relazione di Eulero · Sackur-Tetrode ritrovata',
  blocchi:[
  {t:'reveal', title:'La trasformata di Legendre, e che cosa scambia', tag:'costruzione', steps:[
   {label:'Il potenziale giusto per le variabili giuste', body:R`
   <p>Del lato statistico abbiamo $\mathcal Z$; del lato termodinamico ci serve il potenziale che le corrisponde. La regola che li lega è la stessa dei casi precedenti — il logaritmo della funzione di partizione, cambiato di segno e moltiplicato per $T$ — quindi si <i>definisce</i></p>
   $$\Omega(T,V,\mu)\equiv-T\log\mathcal Z(T,V,\mu)$$
   <p>e si chiama <b>gran potenziale</b>, o potenziale termodinamico grande. La domanda è che cosa sia, termodinamicamente. La risposta è che è la <span class="str" data-str="trasformata-di-legendre">trasformata di Legendre</span> dell&rsquo;energia libera di Helmholtz rispetto alla coppia coniugata $(N,\mu)$, e Crisanti (pag. 215) lo dice in questi termini: $\Omega$ è il gran potenziale «che si otteneva con la trasformazione di Legendre rispetto ad $S$, $N$» — cioè rispetto a entrambe le grandezze estensive che abbiamo liberato, l&rsquo;energia interna essendo il potenziale di partenza.</p>
   <p>Il meccanismo è quello di sempre: si ha un potenziale che dipende da una variabile estensiva, si vuole un potenziale che dipenda dalla variabile intensiva coniugata, e si sottrae il prodotto delle due. Partendo da $F(T,V,N)$, il cui differenziale è</p>
   $$dF=-S\,dT-P\,dV+\mu\,dN$$
   <p>si pone $\Omega\equiv F-\mu N$ e si differenzia, usando $d(\mu N)=\mu\,dN+N\,d\mu$:</p>
   $$d\Omega=dF-\mu\,dN-N\,d\mu=-S\,dT-P\,dV-N\,d\mu$$
   <p>Il termine in $dN$ si è cancellato e al suo posto è comparso un termine in $d\mu$. <b>Le variabili naturali di $\Omega$ sono $(T,V,\mu)$</b>, che sono esattamente le tre quantità fissate dal serbatoio — e questa coincidenza non è fortunata, è il senso stesso della costruzione: ogni insieme statistico ha il potenziale termodinamico le cui variabili naturali sono le grandezze che l&rsquo;insieme tiene ferme.</p>
   <p>Si noti la simmetria con la tappa precedente. Del lato statistico si è passati da $Z$ a $\mathcal Z$ con una trasformata di <i>Laplace</i> sul numero di particelle; del lato termodinamico si passa da $F$ a $\Omega$ con una trasformata di <i>Legendre</i> sulla stessa variabile. Sono la stessa operazione vista dai due capi del ponte $F=-T\log Z$: il logaritmo di una trasformata di Laplace, nel limite in cui l&rsquo;integrale è dominato dal suo massimo, <b>è</b> una trasformata di Legendre.</p>`},
   {label:'Il conto esplicito sul gas classico', body:R`
   <p>Prima di dimostrare la proprietà generale conviene vedere $\Omega$ in un caso in cui si conosce tutto. Per il gas perfetto classico l&rsquo;energia libera vale $F=-NT\left[\log\frac{V}{N\lambda^3}+1\right]$ e il potenziale chimico, come si è calcolato nella tappa 01, vale $\mu=T\log\frac{N\lambda^3}{V}$. Dunque</p>
   $$\Omega=F-\mu N=-NT\left[\log\frac{V}{N\lambda^3}+1\right]-NT\log\frac{N\lambda^3}{V}=-NT$$
   <p>I due logaritmi sono opposti e si elidono, e resta un risultato disarmante: <b>il gran potenziale di un gas perfetto è semplicemente meno $NT$</b>. Siccome per lo stesso gas vale $PV=NT$, si è appena verificato in un caso particolare che $\Omega=-PV$. Fra due passi vedremo che non è un caso particolare.</p>
   <p>Per poterci derivare sopra serve però $\Omega$ scritto nelle sue variabili naturali, cioè con $\mu$ al posto di $N$. Si inverte la relazione fra $\mu$ e $N$: da $\mu=T\log(N\lambda^3/V)$ segue $N=(V/\lambda^3)e^{\mu/T}$, e siccome $\lambda^{-3}$ vale $(2\pi mT)^{3/2}/h^3$ si ottiene</p>
   $$\Omega(T,V,\mu)=-a\,VT^{5/2}e^{\mu/T},\qquad a\equiv\frac{(2\pi m)^{3/2}}{h^3}$$
   <p>Questa è una funzione esplicita delle tre variabili giuste, e da qui in avanti si lavora soltanto derivando. Vale la pena notare la struttura, perché torna in ogni problema gran canonico: <b>$\Omega$ è lineare in $V$</b>, cresce come $T^{5/2}$ e dipende da $\mu$ solo attraverso la fugacità $e^{\mu/T}$.</p>`},
   {label:'Le tre derivate, sul caso esplicito', body:R`
   <p>Dal differenziale $d\Omega=-S\,dT-P\,dV-N\,d\mu$ si leggono le tre relazioni che servono, e le proviamo subito sulla $\Omega$ appena scritta. Rispetto al potenziale chimico:</p>
   $$\left(\frac{\partial\Omega}{\partial\mu}\right)_{T,V}=-a\,VT^{3/2}e^{\mu/T}$$
   <p>e il secondo membro è $-V e^{\mu/T}/\lambda^3$, cioè $-\langle N\rangle$: la prima relazione è verificata. Rispetto al volume:</p>
   $$\left(\frac{\partial\Omega}{\partial V}\right)_{T,\mu}=-a\,T^{5/2}e^{\mu/T}$$
   <p>che è $\Omega/V$, e quindi $P$ coincide con $-\Omega/V$: ecco di nuovo $\Omega=-PV$, stavolta come conseguenza della sola linearità in $V$. Rispetto alla temperatura, dove il conto è meno immediato perché $\mu/T$ dipende da $T$:</p>
   $$\left(\frac{\partial\Omega}{\partial T}\right)_{V,\mu}=-a\,VT^{3/2}e^{\mu/T}\left(\frac52-\frac{\mu}{T}\right)$$
   <p>Cambiando segno si ottiene l&rsquo;entropia. Riconoscendo di nuovo $aVT^{3/2}e^{\mu/T}$ come $\langle N\rangle$ e sostituendo $\mu=T\log(N\lambda^3/V)$:</p>
   $$S=N\left(\frac52-\frac{\mu}{T}\right)=N\left[\log\frac{V}{N\lambda^3}+\frac52\right]$$
   <p>che è <b>l&rsquo;equazione di Sackur-Tetrode</b>, ricomparsa da un insieme in cui il numero di particelle non è nemmeno fissato. È il controllo incrociato più forte che si possa chiedere a questa tappa: tre derivate di una sola funzione restituiscono tutta la termodinamica di un gas, e restituiscono la stessa termodinamica che si era ottenuta per altre strade.</p>`}
  ]},
  {t:'prosa', title:'Perche Omega vale esattamente meno PV, e non per convenzione', tag:'grammatica', html:R`
  <p>Il fatto che $\Omega=-PV$ è la proprietà più usata e meno spiegata del gran canonico. Vale la pena darne <b>tre</b> dimostrazioni indipendenti, perché ognuna illumina una faccia diversa, e perché all&rsquo;orale la domanda «perché meno pi vu?» è quasi certa.</p>
  <p><b>Prima dimostrazione: dalla normalizzazione.</b> È quella della tappa 02 e costa zero. Imponendo $\sum_s\rho(s)=1$ si era ottenuto $e^{\beta PV}=\mathcal Z$, cioè $PV=T\log\mathcal Z$. Ma $\Omega$ è definito come $-T\log\mathcal Z$, dunque $\Omega=-PV$ per confronto immediato. Crisanti (pag. 217) la presenta proprio così: ricordando che $\Omega=-T\log\mathcal Z$, «segue la $\Omega=-PV$». Il difetto di questa dimostrazione è che fa sembrare la relazione un&rsquo;identità notazionale, mentre è un fatto termodinamico.</p>
  <p><b>Seconda dimostrazione: dall&rsquo;estensività.</b> Questa è quella che spiega. $\Omega$ è una grandezza estensiva — raddoppiando il sistema raddoppia — e fra le sue tre variabili naturali $(T,V,\mu)$ <b>una sola è estensiva</b>, il volume: temperatura e potenziale chimico sono intensive e non cambiano se si raddoppia il sistema. Una funzione estensiva di una sola variabile estensiva è necessariamente proporzionale a quella variabile:</p>
  $$\Omega(T,V,\mu)=V\,\omega(T,\mu)$$
  <p>dove $\omega$ è una densità che dipende solo dalle due intensive. Derivando rispetto a $V$ a $T$ e $\mu$ fissati — e $\omega$ non dipende da $V$ — si ottiene</p>
  $$\frac{\partial\Omega}{\partial V}=\omega(T,\mu)$$
  <p>e siccome $P=-\partial\Omega/\partial V$, si ha $P=-\omega$ e quindi $\Omega=V\omega=-PV$. <b>La relazione $\Omega=-PV$ è la forma che prende il teorema di Eulero sulle funzioni omogenee di grado uno quando c&rsquo;è una sola variabile estensiva in gioco.</b> Ed è anche la ragione per cui non esiste un potenziale analogo con <i>tutte</i> le variabili intensive: un potenziale $\Omega(T,P,\mu)$ sarebbe estensivo senza dipendere da nessuna variabile estensiva, e quindi identicamente nullo — che è, letta al rovescio, la relazione di Gibbs-Duhem.</p>
  <p><b>Terza dimostrazione: dalla relazione di Eulero.</b> Integrando l&rsquo;estensività di $E$ si ottiene $E=TS-PV+\mu N$, e allora</p>
  $$\Omega=E-TS-\mu N=(TS-PV+\mu N)-TS-\mu N=-PV$$
  <p>Le tre strade sono coerenti, ma non equivalenti: la prima è un confronto di definizioni, la seconda un argomento di scala, la terza un&rsquo;identità termodinamica. <b>La seconda è quella da raccontare all&rsquo;orale</b>, perché è l&rsquo;unica che dice <i>perché</i> deve essere così e non altrimenti. E c&rsquo;è un avvertimento che Grilli-Giardina (pag. 69) mettono in corsivo e che conviene ripetere: $P$ <b>non è fissabile da noi</b>. Nel gran canonico si controllano $T$, $V$ e $\mu$; la pressione è una funzione di queste tre, non un&rsquo;altra manopola.</p>`},
  {t:'plot', title:'Il gran potenziale del gas classico nel piano delle sue variabili intensive',
   intro:R`Superficie di $-\Omega/V$, cioè della pressione, per il gas perfetto classico, in funzione della temperatura $T$ (in ascissa) e del potenziale chimico $\mu$ (in ordinata), in unità in cui $a=1$: la funzione disegnata è $T^{5/2}e^{\mu/T}$. Trascina per ruotare.`,
   plots:[
    {kind:'surface3d', f:'pow(x,2.5)*exp(y/x)', xr:[0.3,2], yr:[-3,0], n:32, height:400,
     title:'pressione del gas classico in funzione di T e mu',
     xlabel:'T', ylabel:'mu'}
   ],
   leggi:R`<p><b>Che cosa guardare: la parete a $\mu=0$ e il pavimento a $\mu$ molto negativo.</b> Lungo il bordo superiore, dove il potenziale chimico si avvicina a zero, la superficie sale ripidissima; lungo il bordo inferiore, dove $\mu$ è molto negativo, è schiacciata sullo zero. Il motivo è la dipendenza esponenziale: $e^{\mu/T}$ è la fugacità, e la fugacità è — come si vedrà nella tappa 07 — il numero $n\lambda^3$, cioè quante particelle stanno dentro una cella termica. <b>Il regime in cui il gas è classico è il pavimento di questa superficie</b>, non il suo bordo alto.</p>
   <p><b>Che cosa impararne sulle isoterme.</b> Si tagli la superficie a $T$ costante: si ottiene una curva che cresce esponenzialmente in $\mu$, e questo dice che a temperatura fissata alzare il potenziale chimico di un solo $T$ moltiplica la pressione per $e$. Si tagli invece a $\mu$ costante: la crescita è $T^{5/2}$ corretta dall&rsquo;esponenziale, ed è una crescita <i>molto</i> più rapida di quella lineare che si ha a $N$ fissato. Non è una contraddizione: a $\mu$ fissato, scaldare non solo agita le particelle, ne <b>chiama dentro altre</b>.</p>
   <p><b>Dove questa figura mente.</b> Disegna la superficie fin verso $\mu=0$, dove per un gas classico il conto non ha più senso: lì $n\lambda^3$ è di ordine uno e la statistica classica è fuori dal suo dominio. La superficie continua liscia perché la formula continua a essere calcolabile — ed è esattamente il modo in cui una formula sbagliata non si lamenta.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Se $\Omega=-PV$ e la pressione si ottiene da $\Omega$ derivando rispetto a $V$, non è un ragionamento circolare?`,
    a:R`No, e il punto è che i due $P$ entrano per porte diverse. Il criterio invocato è il <b>teorema di Eulero</b> per funzioni omogenee di grado uno: $\Omega$ si calcola dal microscopico, come $-T\log\mathcal Z$, senza sapere nulla di pressioni; l&rsquo;estensività impone che sia proporzionale a $V$; la <i>definizione</i> termodinamica di pressione è $P=-(\partial\Omega/\partial V)_{T,\mu}$; e la proporzionalità fa sì che quella derivata coincida con il rapporto $\Omega/V$. La circolarità ci sarebbe se si assumesse $\Omega=-PV$ per definire $P$ e poi si usasse $P$ per ricavare $\Omega$ — invece $\Omega$ viene da una somma di stati.`},
   {q:R`La trasformata di Legendre $\Omega=F-\mu N$ richiede che $\mu$ e $N$ siano in corrispondenza biunivoca. Quando questa condizione salta?`,
    a:R`Salta quando $N(\mu)$ non è invertibile, cioè quando $\partial N/\partial\mu$ si annulla o diverge. Il criterio da riconoscere è che $(\partial N/\partial\mu)_{T,V}=-\partial^2\Omega/\partial\mu^2$, e la tappa 05 mostrerà che questa stessa derivata seconda <b>è</b> la fluttuazione del numero di particelle. Dunque la trasformata di Legendre è invertibile esattamente finché la fluttuazione è finita e non nulla — e la sua divergenza è una transizione di fase, con un intero intervallo di densità che corrisponde a un solo valore di $\mu$. È il contenuto della tappa 06, e il fatto che lo si veda già qui, come patologia di una trasformazione di Legendre, non è un caso: <b>tutte le transizioni di fase sono, in una qualche variabile, una trasformata di Legendre che perde l&rsquo;inversa.</b>`}
  ]}
]},

/* ---------------- 04 · LE TRE DERIVATE ---------------- */
{ num:'04', title:'Le tre derivate che spremono la termodinamica, e la ricetta di calcolo', meta:'N dalla fugacita · entropia e pressione · l energia a z fissata e non a mu fissato · i sei passi del formulario',
  blocchi:[
  {t:'prosa', title:'Le tre derivate, e la loro forma in fugacita', tag:'regola operativa', html:R`
  <p>Il gran potenziale è una sola funzione, e tutta la termodinamica del sistema sta nelle sue tre derivate prime. Dal differenziale ricavato nella tappa precedente si legge, semplicemente confrontando i coefficienti:</p>
  $$S=-\left(\frac{\partial\Omega}{\partial T}\right)_{V,\mu}\qquad P=-\left(\frac{\partial\Omega}{\partial V}\right)_{T,\mu}\qquad \langle N\rangle=-\left(\frac{\partial\Omega}{\partial\mu}\right)_{T,V}$$
  <p>Nella pratica dei conti, però, il potenziale chimico compare quasi sempre attraverso la fugacità, perché è in $z$ che la gran partizione è una serie di potenze. Serve quindi tradurre le derivate. Poiché $z=e^{\beta\mu}$ si ha $\partial z/\partial\mu=\beta z$, e quindi l&rsquo;operatore $z\,\partial_z$ è lo stesso operatore di $T\,\partial_\mu$. Lo si verifica su una potenza qualsiasi della fugacità, che è il caso che serve davvero perché $\mathcal Z$ è una somma di potenze:</p>
  $$\frac{\partial}{\partial\mu}e^{k\beta\mu}=k\beta e^{k\beta\mu}$$
  <p>e moltiplicando per $T$ si ottiene $k\,z^k$, che è appunto $z\,\partial_z z^k$. La traduzione è dunque esatta termine a termine. Crisanti (pag. 219) la scrive nella forma $z\,\partial_z=\frac1\beta\partial_\mu$, Grilli-Giardina (pag. 69) nella forma $z\,\partial_z=T\,\partial_\mu$: è la stessa cosa scritta in due convenzioni, e non c&rsquo;è disaccordo.</p>
  <p>La forma operativa del numero medio di particelle diventa allora</p>
  $$\langle N\rangle=z\frac{\partial}{\partial z}\log\mathcal Z(T,V,z)$$
  <p>e questa è la formula che si usa in ogni esercizio. Vale la pena vedere <b>da dove viene direttamente</b>, senza passare da $\Omega$, perché la derivazione è di una riga e chiarisce che cosa si sta mediando. Con $w(N)=z^NZ_N/\mathcal Z$ la distribuzione del numero di particelle,</p>
  $$\langle N\rangle=\sum_{N=0}^{\infty}N\,w(N)=\frac{\sum_N N z^N Z_N}{\sum_N z^N Z_N}$$
  <p>e si riconosce che il numeratore è $z$ volte la derivata rispetto a $z$ del denominatore: applicare $z\,\partial_z$ a $\log\mathcal Z$ produce esattamente quel rapporto. <b>La derivata logaritmica rispetto alla fugacità è la media del numero di particelle</b>, come la derivata logaritmica rispetto a $\beta$ era la media dell&rsquo;energia. È la stessa macchina — una funzione generatrice — applicata alla seconda variabile.</p>`},
  {t:'reveal', title:'L energia: la formula che Crisanti lascia da verificare', tag:'costruzione', steps:[
   {label:'Il disaccordo fra le due fonti, e come si scioglie', body:R`
   <p>Qui le due fonti divergono, e la divergenza è istruttiva. Il formulario di Grilli-Giardina (pag. 105) elenca la <b>metodologia di calcolo</b> del gran canonico in sei passi — calcolare $\mathcal Z$; leggere $\beta PV=\log\mathcal Z$; ottenere $\langle N\rangle=z\,\partial_z\log\mathcal Z$; ottenere $E=-\partial_\beta\log\mathcal Z$; da $E(T,V,N)$ ricavare $C_V$; e infine l&rsquo;entropia integrando $C_V/T'$ — e dà il quarto passo per buono. Crisanti invece, nel punto corrispondente (pag. 251), scrive testualmente «forse vale la $E=-\partial_\beta\log\mathcal Z$, da verificare». È un&rsquo;annotazione aperta dell&rsquo;autore, non un errore: e vale la pena chiuderla qui, perché la risposta contiene una trappola d&rsquo;esame.</p>
   <p>La trappola è questa: <b>la formula vale, ma a fugacità fissata, non a potenziale chimico fissato</b>, e i due modi di derivare rispetto a $\beta$ danno risultati diversi. La ragione è che $z=e^{\beta\mu}$ dipende da $\beta$: tenere fermo $z$ significa lasciar variare $\mu$ come $1/\beta$, e viceversa. Verifichiamolo sul gas classico, dove conosciamo tutto.</p>`},
   {label:'Il conto a fugacita fissata', body:R`
   <p>Per il gas classico la gran partizione è $\mathcal Z=e^{zz_1}$, quindi</p>
   $$\log\mathcal Z=zz_1=Cz\beta^{-3/2},\qquad C\equiv\frac{V(2\pi m)^{3/2}}{h^3}$$
   <p>dove tutta la dipendenza da $\beta$ sta nel fattore $\beta^{-3/2}$ che viene dai tre integrali gaussiani sugli impulsi. Derivando a $z$ fissato:</p>
   $$\left(\frac{\partial\log\mathcal Z}{\partial\beta}\right)_{z}=-\frac32\,Cz\beta^{-5/2}$$
   <p>e cambiando segno, e riconoscendo che $Cz\beta^{-3/2}$ è $zz_1$, cioè $\langle N\rangle$:</p>
   $$E=\frac32\,Cz\beta^{-5/2}=\frac32\,\frac{zz_1}{\beta}=\frac32\langle N\rangle T$$
   <p>che è l&rsquo;energia del gas monoatomico. <b>La formula di Grilli-Giardina è verificata</b>, e l&rsquo;annotazione di Crisanti si chiude con un sì.</p>`},
   {label:'Il conto a potenziale chimico fissato, e la differenza', body:R`
   <p>Rifacciamo lo stesso conto tenendo fermo $\mu$ invece di $z$, cioè scrivendo esplicitamente $z=e^{\beta\mu}$ dentro la formula:</p>
   $$\left(\frac{\partial\log\mathcal Z}{\partial\beta}\right)_{\mu}=\mu\,Ce^{\beta\mu}\beta^{-3/2}-\frac32\,Ce^{\beta\mu}\beta^{-5/2}$$
   <p>Il primo addendo è $\mu$ per $\langle N\rangle$; il secondo è, per il conto precedente, meno $E$. Dunque</p>
   $$-\left(\frac{\partial\log\mathcal Z}{\partial\beta}\right)_{\mu}=E-\mu\langle N\rangle$$
   <p>Le due derivate differiscono per $\mu\langle N\rangle$, che non è affatto piccolo. <b>La regola operativa da portare all&rsquo;esame</b>: se si deriva rispetto a $\beta$ tenendo ferma la fugacità si ottiene l&rsquo;energia; se si tiene fermo il potenziale chimico si ottiene $E-\mu N$, cioè la quantità che effettivamente compare nell&rsquo;esponente della distribuzione gran canonica. La seconda non è sbagliata: è la media di $H-\mu N$, ed è coerente con il fatto che l&rsquo;insieme pesa proprio quella combinazione. Ma non è l&rsquo;energia, e chiamarla energia costa un esercizio.</p>`}
  ]},
  {t:'prosa', title:'La ricetta, e un esercizio che il gran canonico accorcia', tag:'regola operativa', html:R`
  <p>Mettendo insieme le tappe 02, 03 e 04 si ottiene una procedura chiusa, ed è utile averla scritta come lista perché è letteralmente ciò che si fa davanti a un compito. Seguo l&rsquo;ordine del formulario di Grilli-Giardina (pag. 105), aggiungendo dove serve.</p>
  <p><b>Uno.</b> Si calcola $\mathcal Z(T,V,z)$. Se le particelle sono indipendenti questo vuol dire, quasi sempre, fattorizzare su qualcosa — sui livelli, sui siti, sulle celle. <b>Due.</b> Si legge l&rsquo;equazione di stato da $\beta PV=\log\mathcal Z$, senza derivare. <b>Tre.</b> Si ottiene $\langle N\rangle=z\,\partial_z\log\mathcal Z$: questa è l&rsquo;equazione che lega $z$ ai dati del problema, e va <i>invertita</i>, perché nei problemi la densità è nota e la fugacità no. <b>Quattro.</b> Si ottiene $E=-\partial_\beta\log\mathcal Z$ a fugacità fissata. Il risultato è una $E(T,V,z)$: si sostituisce l&rsquo;inversione del passo tre per avere $E(T,V,N)$. <b>Cinque.</b> Si deriva rispetto a $T$ per il calore specifico. <b>Sei.</b> Se serve l&rsquo;entropia, o la si prende da $-\partial_T\Omega$, oppure si integra $C_V/T'$ da zero a $T$, che è la strada del terzo principio.</p>
  <p>Grilli-Giardina aggiungono al passo tre l&rsquo;avvertenza che vale l&rsquo;intera ricetta: <b>$z$ non dipenderà da $N$ ma da $\langle N\rangle$</b>, perché nel gran canonico il numero di particelle è libero. Nei conti si scrive $N$, e si intende la media.</p>
  <p>Un esempio di quanto accorci, preso da Crisanti (pag. 218). Si vuole la frazione media di particelle che si trovano in una certa regione $D_0$ dello spazio delle fasi di singola particella — una domanda d&rsquo;esame frequentissima, del tipo «quante molecole stanno sopra la quota $h$» o «quante hanno energia maggiore di $\varepsilon$». Nel canonico si imposta una funzione di partizione ristretta e si marginalizza. Nel gran canonico basta osservare che la regione $D_0$ è essa stessa un sistema aperto, con la stessa $T$ e lo stesso $\mu$ del resto: per un sistema di particelle indipendenti vale $\langle N\rangle=zz_1$, e applicandolo sia alla regione sia al tutto la fugacità si semplifica nel rapporto. Resta il rapporto fra due funzioni di partizione di <i>singola</i> particella, una ristretta e una totale, che è un integrale elementare. Il conto della tappa 10 lo svolge per esteso su un caso concreto, ed è l&rsquo;esempio di come questo insieme paghi anche in problemi in cui nessuno ha nominato il potenziale chimico.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Nel passo tre della ricetta si dice di invertire $\langle N\rangle=z\,\partial_z\log\mathcal Z$ per ricavare $z$. Perché non si può semplicemente lasciare il risultato in funzione di $z$?`,
    a:R`Perché $z$ non è un dato sperimentale. Il criterio da riconoscere è quale grandezza il problema <b>controlla</b>: in laboratorio si fissano la densità e la temperatura, non il potenziale chimico, e quindi una risposta scritta in funzione di $z$ non è ancora una risposta. L&rsquo;unica eccezione è il caso in cui il sistema sia davvero a contatto con un serbatoio esterno di cui si conosce $\mu$ — un gas adsorbito su una superficie, un semiconduttore a contatto con un altro — e lì $z$ è un dato e l&rsquo;inversione non serve. <b>La domanda da porsi è sempre: chi fissa il potenziale chimico, io o il sistema?</b>`}
  ]}
]},

/* ---------------- 05 · FLUTTUAZIONI E COMPRESSIBILITA ---------------- */
{ num:'05', title:'La fluttuazione del numero di particelle, e il ponte con la compressibilita', meta:'la derivata seconda logaritmica · da z a mu · estensivita e volume specifico · la radice di N',
  blocchi:[
  {t:'reveal', title:'La varianza e una seconda derivata logaritmica', tag:'costruzione', steps:[
   {label:'Perche la stessa macchina produce anche la varianza', body:R`
   <p>Una funzione generatrice non dà solo le medie: derivando una seconda volta dà le fluttuazioni, e il gran canonico non fa eccezione. Il punto di partenza è la media già scritta, $\langle N\rangle=z\,\partial_z\log\mathcal Z$, cioè esplicitamente il rapporto fra due serie. Applichiamole ancora $z\,\partial_z$ e vediamo che cosa esce.</p>
   <p>Derivando un rapporto $A/B$ si ottiene $A'/B-AB'/B^2$; qui $A=\sum_N Nz^NZ_N$ e $B=\sum_N z^NZ_N$, e l&rsquo;operatore $z\,\partial_z$ agendo su $z^N$ restituisce $Nz^N$. Il primo termine diventa quindi $\sum_N N^2z^NZ_N/B$, cioè $\langle N^2\rangle$, e il secondo diventa il quadrato della media. Dunque, come Crisanti verifica per esteso a pag. 219 e Grilli-Giardina a pag. 69:</p>
   $$\langle\Delta N^2\rangle=z\frac{\partial}{\partial z}\langle N\rangle$$
   <p>e, sostituendo la media con la sua espressione,</p>
   $$\langle\Delta N^2\rangle=z\frac{\partial}{\partial z}\left(z\frac{\partial}{\partial z}\log\mathcal Z\right)$$
   <p><b>La derivata seconda logaritmica rispetto alla fugacità è la varianza del numero di particelle</b>, come la derivata seconda rispetto a $\beta$ era la varianza dell&rsquo;energia. È la stessa struttura, ed è una struttura generale: il logaritmo di una funzione generatrice genera i <i>cumulanti</i>, di cui media e varianza sono i primi due.</p>
   <p>Proviamola sul gas classico, dove $\log\mathcal Z=zz_1$. La prima applicazione dà</p>
   $$z\frac{\partial}{\partial z}(zz_1)=zz_1$$
   <p>e la seconda, applicata allo stesso monomio, dà di nuovo $zz_1$. Quindi $\langle\Delta N^2\rangle=\langle N\rangle$: <b>varianza uguale alla media</b>, che è la firma della Poisson trovata nella tappa 02. Le due strade — la distribuzione esplicita e la derivata seconda — si incontrano, e infatti sommando $N\,w(N)$ con la $w$ di Poisson si ottiene</p>
   $$\sum_{N=0}^{\infty}N\,w(N)=\bar N$$`},
   {label:'Dalla fugacita al potenziale chimico, e la comparsa della pressione', body:R`
   <p>Per andare oltre il gas ideale bisogna tradurre la formula in linguaggio termodinamico, ed è qui che compare qualcosa di inatteso. Usando $z\,\partial_z=T\,\partial_\mu$ due volte, e ricordando che $\log\mathcal Z=PV/T$:</p>
   $$\langle\Delta N^2\rangle=T^2\frac{\partial^2}{\partial\mu^2}\left(\frac{PV}{T}\right)=TV\left(\frac{\partial^2P}{\partial\mu^2}\right)_{T,V}$$
   <p>Entrambe le fonti arrivano esattamente a questa formula e si fermano lì per un momento: Crisanti a pag. 219, Grilli-Giardina a pag. 70 con lo stesso passaggio scritto in $T$ invece che in $\beta$. <b>La fluttuazione del numero di particelle è una derivata seconda della pressione rispetto al potenziale chimico</b>, e questo è già notevole: una quantità statistica, che parla di quanto il sistema è incerto su quante particelle abbia, si è trasformata in una quantità puramente termodinamica, misurabile con un manometro.</p>
   <p>Resta da capire che cosa <i>sia</i> quella derivata seconda. Crisanti imposta il conto (pag. 219) facendo leva sull&rsquo;estensività dell&rsquo;energia libera, e conviene seguirlo. Se $F$ è estensiva si può scrivere $F(T,V,N)=N f(T,v)$ con $v\equiv V/N$ il <b>volume specifico</b>: tutta l&rsquo;estensività sta nel fattore $N$ davanti, e $f$ è una densità di energia libera per particella che dipende solo da variabili intensive. Derivando questa forma si ottengono pressione e potenziale chimico in funzione di $f$. Per la pressione, $\partial v/\partial V=1/N$, quindi</p>
   $$P=-\frac{\partial}{\partial V}\big[Nf(T,v)\big]=-\left(\frac{\partial f}{\partial v}\right)_T$$
   <p>Per il potenziale chimico si deriva rispetto a $N$ ricordando che anche $v$ dipende da $N$, con $\partial v/\partial N=-V/N^2=-v/N$:</p>
   $$\mu=\frac{\partial}{\partial N}\big[Nf(T,v)\big]=f-v\left(\frac{\partial f}{\partial v}\right)_T$$
   <p>Le due relazioni insieme dicono anche che $\mu$ è $f+Pv$, cioè l&rsquo;entalpia libera per particella: è la relazione $\mu=G/N$ vista da vicino.</p>`},
   {label:'La compressibilita isoterma, e il conto che chiude', body:R`
   <p>Ora il passaggio che Crisanti imposta e che le pagine del dossier lasciano a metà: si tratta di derivare $\mu$ rispetto a $v$ e di combinare con la pressione. Trattando $f$ come una funzione incognita di $v$ a $T$ fissata,</p>
   $$\frac{\partial}{\partial v}\left[f-v\frac{\partial f}{\partial v}\right]=-v\frac{\partial^2f}{\partial v^2}$$
   <p>— i due termini in $\partial f/\partial v$ si cancellano, e resta solo il pezzo con la derivata seconda. Siccome $P$ è meno la derivata prima di $f$, la derivata seconda di $f$ è meno la derivata prima di $P$, e quindi</p>
   $$\left(\frac{\partial\mu}{\partial v}\right)_T=v\left(\frac{\partial P}{\partial v}\right)_T$$
   <p>Questa è la relazione chiave. Dividendo le due derivate rispetto a $v$ si ottiene la derivata di $P$ rispetto a $\mu$, che per il gas ideale ($P=T/v$) vale</p>
   $$\left(\frac{\partial P}{\partial\mu}\right)_T=\frac1v$$
   <p>ed è un risultato che vale in generale, non solo per il gas ideale: la derivata della pressione rispetto al potenziale chimico è la <b>densità</b> $n=1/v$. Derivando ancora una volta rispetto a $\mu$, sempre sul gas ideale:</p>
   $$\left(\frac{\partial^2P}{\partial\mu^2}\right)_T=-\frac{1}{v^2}\cdot\frac{1}{v\,\partial P/\partial v}=\frac{1}{vT}$$
   <p>e rimettendo dentro la formula della fluttuazione</p>
   $$\langle\Delta N^2\rangle=TV\cdot\frac{1}{vT}=\frac Vv=N$$
   <p>Si ritrova la Poisson, per la terza strada indipendente. Ma il conto generale ha prodotto qualcosa di più della verifica: la combinazione $-1/(v^2\,\partial P/\partial v)$ che compare a metà strada è, a meno di un fattore $v$, la <b>compressibilità isoterma</b></p>
   $$\kappa_T\equiv-\frac1v\left(\frac{\partial v}{\partial P}\right)_T$$
   <p>che per il gas ideale vale $\dfrac vT$, cioè $1/P$. Riscritta con $\kappa_T$, la fluttuazione diventa</p>
   $$\langle\Delta N^2\rangle=\frac{N^2T\kappa_T}{V}=\frac{N^2T}{V}\cdot\frac{V}{NT}=N$$
   <p>dove l&rsquo;ultimo passaggio usa $\kappa_T=1/P$ e $PV=NT$ del gas ideale. La formula generale, che è il risultato da ricordare, è quella al centro: <b>la fluttuazione relativa del numero di particelle vale $\sqrt{T\kappa_T/V}$.</b></p>`}
  ]},
  {t:'prosa', title:'Che cosa dice davvero questa formula', tag:'sintesi', html:R`
  <p>Vale la pena spremere la formula $\langle\Delta N^2\rangle/N^2=T\kappa_T/V$, perché contiene tre informazioni distinte e in un orale si possono chiedere separatamente.</p>
  <p><b>Primo: la scala.</b> A densità e temperatura fissate, $\kappa_T$ è intensiva e $V$ cresce come $N$; dunque la fluttuazione relativa va come $V^{-1/2}$, cioè come $N^{-1/2}$. Per $N=10^{20}$ vale $10^{-10}$, e $\frac{1}{\sqrt N}\to0$ nel limite termodinamico. <b>Questa è l&rsquo;equivalenza fra insieme canonico e gran canonico, dimostrata e non invocata</b>: le due descrizioni danno lo stesso valore medio per ogni grandezza, e differiscono sulle fluttuazioni di $N$ in modo che si annulla come una potenza inversa della taglia.</p>
  <p><b>Secondo: il segno, e cosa impone.</b> La varianza è definita positiva, e la formula la lega a $\kappa_T$: quindi <b>la compressibilità isoterma di un sistema all&rsquo;equilibrio non può essere negativa</b>. Non è un&rsquo;assunzione, è una conseguenza. Un sistema con $\kappa_T<0$ risponderebbe a una compressione espandendosi, e il formalismo dice che non può esistere in equilibrio — il che, nella tappa seguente, diventa il criterio che taglia via i rami instabili delle isoterme.</p>
