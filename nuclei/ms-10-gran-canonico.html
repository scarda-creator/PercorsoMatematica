  <p><b>Terzo: la condizione nascosta.</b> Il ragionamento del primo punto ha usato che $\kappa_T$ sia <i>finita</i>. Se la compressibilità diverge, la fluttuazione relativa non va più come $N^{-1/2}$ e l&rsquo;equivalenza degli insiemi salta. Non è un&rsquo;ipotesi di scuola: la compressibilità diverge in ogni transizione di fase del primo ordine e nel punto critico, cioè proprio nelle situazioni che si vogliono studiare. È il contenuto della prossima tappa.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Il conto della fluttuazione è stato fatto due volte: una derivando $\log\mathcal Z$ e una passando dalla compressibilità. Che cosa aggiunge la seconda, se il risultato è lo stesso?`,
    a:R`Aggiunge che la fluttuazione è <b>misurabile</b>. Il criterio da riconoscere è che $z\,\partial_z\log\mathcal Z$ richiede di conoscere la funzione di partizione, cioè il modello microscopico; $T\kappa_T/V$ richiede soltanto una misura di compressibilità, che si fa con un pistone. Le due strade insieme costituiscono un <b>teorema di fluttuazione-dissipazione</b>: una fluttuazione spontanea all&rsquo;equilibrio è legata alla risposta del sistema a una perturbazione esterna. La verifica sperimentale più diretta è la diffusione della luce — le fluttuazioni di densità diffondono, e la loro intensità misura $\kappa_T$.`},
   {q:R`Per il gas ideale si è trovato $\langle\Delta N^2\rangle=N$ per tre strade. Ma in una bombola sigillata il numero di molecole non fluttua affatto. Contraddizione?`,
    a:R`No: sono due sistemi diversi, e il criterio che li distingue è <b>se esiste uno scambio</b>. In una bombola sigillata $N$ è rigorosamente fissato e l&rsquo;insieme giusto è il canonico, dove la varianza di $N$ è zero per costruzione. La formula $\langle\Delta N^2\rangle=N$ vale per una <i>regione</i> del gas delimitata da una superficie immaginaria, attraverso la quale le molecole passano davvero. Il contenuto dell&rsquo;equivalenza è che <b>tutte le altre grandezze</b> — energia, pressione, entropia per particella — vengono uguali nei due casi, a meno di correzioni relative di ordine $1/N$.`}
  ]}
]},

/* ---------------- 06 · DOVE L EQUIVALENZA SI ROMPE ---------------- */
{ num:'06', title:'Dove l equivalenza si rompe: la compressibilita che diverge', meta:'isoterme di van der Waals · il tratto piatto e il punto critico · la distribuzione che diventa bimodale · il livello fondamentale che si gonfia',
  blocchi:[
  {t:'prosa', title:'La condizione che era rimasta implicita', tag:'grammatica', html:R`
  <p>Fin qui il gran canonico ha funzionato senza attriti, e l&rsquo;impressione è che fissare $\mu$ invece di $N$ sia sempre lecito perché tanto la distribuzione è piccata. La formula della tappa precedente dice però che la piccatura ha un prezzo dichiarato:</p>
  $$\frac{\sqrt{\langle\Delta N^2\rangle}}{N}=\sqrt{\frac{T\kappa_T}{V}}$$
  <p>e va a zero come $V^{-1/2}$ <b>a condizione che $\kappa_T$ resti finita</b>. La domanda onesta è quindi: esistono sistemi fisici in cui la compressibilità isoterma diverge? La risposta è che esistono, sono i più interessanti, e sono esattamente quelli in cui la materia cambia fase.</p>
  <p>Conviene vedere come la divergenza entra. Con $s\equiv-(\partial P/\partial v)_T$ la compressibilità è $\kappa_T=1/(v\,s)$, e allora</p>
  $$\lim_{s\to0^+}\frac{1}{v\,s}=+\infty$$
  <p>Cioè: <b>la compressibilità diverge dove l&rsquo;isoterma diventa orizzontale</b>. Un&rsquo;isoterma orizzontale significa che si può cambiare il volume senza cambiare la pressione — che è la definizione operativa di una <i>coesistenza di fasi</i>: comprimendo un vapore saturo se ne liquefa una parte, il volume cala, e la pressione resta quella di saturazione.</p>`},
  {t:'reveal', title:'Le isoterme di van der Waals, e i due modi di appiattirsi', tag:'costruzione', steps:[
   {label:'L equazione, in forma ridotta', body:R`
   <p>Per avere qualcosa da derivare serve un&rsquo;equazione di stato che descriva davvero una transizione, e la più semplice è quella di van der Waals. In <b>forma ridotta</b> — cioè misurando pressione, volume e temperatura in unità dei loro valori critici — l&rsquo;equazione perde ogni parametro e diventa universale:</p>
   $$P=\frac{8T}{3v-1}-\frac{3}{v^2}$$
   <p>Il primo termine è la pressione cinetica corretta dal volume escluso, il secondo è l&rsquo;attrazione a coppie. Non deriviamo qui l&rsquo;equazione: la usiamo come <b>esempio concreto</b> di un sistema con una compressibilità che diverge, perché il fenomeno che ci interessa non dipende dai dettagli del modello.</p>
   <p>La derivata rispetto al volume specifico è</p>
   $$\frac{\partial P}{\partial v}=-\frac{24T}{(3v-1)^2}+\frac{6}{v^3}$$
   <p>e la derivata seconda</p>
   $$\frac{\partial^2P}{\partial v^2}=\frac{144T}{(3v-1)^3}-\frac{18}{v^4}$$`},
   {label:'Il punto critico: dove derivata prima e seconda si annullano insieme', body:R`
   <p>Il <b>punto critico</b> è per definizione il punto in cui l&rsquo;isoterma ha un flesso a tangente orizzontale, cioè dove si annullano insieme la derivata prima e la seconda. In unità ridotte deve cadere in $T=1$, $v=1$, e lo si verifica sostituendo. La pressione vale</p>
   $$\frac{8}{2}-3=1$$
   <p>come deve essere in unità ridotte. La derivata prima vale</p>
   $$-\frac{24}{4}+6=0$$
   <p>e la derivata seconda</p>
   $$\frac{144}{8}-18=0$$
   <p>Tutte e tre le condizioni sono soddisfatte simultaneamente, ed è questo che <i>definisce</i> il punto critico e fissa le unità ridotte. <b>Nel punto critico la compressibilità isoterma diverge</b>, perché il suo denominatore contiene $\partial P/\partial v$ che si annulla. La conseguenza sulla fluttuazione è immediata e drammatica: $\langle\Delta N^2\rangle/N^2=T\kappa_T/V$ non va più a zero come $1/N$, e le fluttuazioni di densità diventano macroscopiche. Si vedono a occhio nudo — è l&rsquo;<b>opalescenza critica</b>, il fatto che un fluido vicino al punto critico diventa lattiginoso perché le fluttuazioni di densità raggiungono la scala della lunghezza d&rsquo;onda della luce e la diffondono.</p>`},
   {label:'Sotto la temperatura critica: il tratto piatto, e la Legendre che perde l inversa', body:R`
   <p>Per $T<1$ l&rsquo;isoterma di van der Waals ha un tratto in cui $\partial P/\partial v>0$: comprimendo, la pressione <i>scende</i>. Quel ramo è meccanicamente instabile e — per l&rsquo;argomento della tappa precedente, che legava il segno di $\kappa_T$ alla positività di una varianza — <b>non può corrispondere a nessuno stato d&rsquo;equilibrio</b>. La termodinamica lo sostituisce con un segmento orizzontale (costruzione di Maxwell), lungo il quale liquido e vapore coesistono.</p>
   <p>Lungo tutto quel segmento $\partial P/\partial v=0$, dunque $\kappa_T=\infty$, dunque le fluttuazioni del numero di particelle sono <b>macroscopiche su un intero intervallo di densità</b> e non solo in un punto. Ed è qui che si vede il guasto dal lato del gran canonico, nel modo più nitido: a tutte le densità del segmento corrisponde <i>un solo</i> valore della pressione, e quindi — poiché $\partial P/\partial\mu=1/v$ è finita — un solo valore del potenziale chimico. La corrispondenza $N\leftrightarrow\mu$ non è più biunivoca: la trasformata di Legendre della tappa 03 <b>ha perso l&rsquo;inversa</b>, ed è esattamente la patologia che il secondo controllo lampo di quella tappa aveva anticipato.</p>
   <p>Che cosa fa, allora, il gran canonico? Non sbaglia: fa una cosa diversa. Fissando $\mu$ al valore di coesistenza, la distribuzione $w(N)$ smette di essere una campana e diventa <b>bimodale</b> — un picco alla densità del liquido, un picco a quella del vapore, e in mezzo un avvallamento la cui profondità cresce con la taglia del sistema. Il valore medio $\langle N\rangle$ cade allora nell&rsquo;avvallamento, cioè su un valore che il sistema non assume quasi mai. <b>Quando la distribuzione è bimodale, la media non è il valore tipico</b>, e tutte le formule che identificano i due — cioè tutto il gran canonico operativo — vanno maneggiate con cura. Questa è la forma precisa in cui gli insiemi cessano di essere equivalenti: non danno risposte diverse per errore, rispondono a domande diverse.</p>`}
  ]},
  {t:'plot', title:'Le isoterme, e le due maniere di diventare orizzontali',
   intro:R`Isoterme di van der Waals in unità ridotte, $P=8T/(3v-1)-3/v^2$, per tre temperature: sopra, al, e sotto il punto critico. In ascissa il volume specifico $v$, in ordinata la pressione $P$.`,
   plots:[
    {kind:'func2d', xr:[0.8,3.2], yr:[0.2,1.7], height:340, ticks:6,
     title:'isoterme ridotte di van der Waals',
     curves:[
      {f:'8*1.1/(3*x-1)-3/(x*x)', col:'#ff6b6b', label:'T = 1,1: monotona, compressibilita finita ovunque'},
      {f:'8/(3*x-1)-3/(x*x)', col:'#d8a13a', label:'T = 1: flesso orizzontale in v = 1, punto critico'},
      {f:'8*0.9/(3*x-1)-3/(x*x)', col:'#5eead4', label:'T = 0,9: tratto risalente, meccanicamente instabile'}
     ],
     xlabel:'v (volume specifico ridotto)', ylabel:'P (pressione ridotta)'}
   ],
   leggi:R`<p><b>Che cosa guardare: la pendenza, non la quota.</b> Sulla curva rossa ($T>T_c$) la pendenza è ovunque negativa e mai nulla: $\kappa_T$ è finita in ogni punto, le fluttuazioni di densità vanno come $N^{-1/2}$, e canonico e gran canonico sono equivalenti dovunque. Sulla curva gialla ($T=T_c$) c&rsquo;è <b>un punto solo</b> in cui la tangente è orizzontale, ed è il punto critico: lì e soltanto lì la compressibilità esplode. Sulla curva verde ($T<T_c$) la pendenza cambia segno due volte, e fra i due estremi c&rsquo;è un tratto in cui la pressione cresce col volume.</p>
   <p><b>Che cosa impararne.</b> Il tratto risalente della curva verde non descrive stati reali: la varianza del numero di particelle sarebbe negativa, che è impossibile. La natura lo sostituisce con un segmento orizzontale fra i due volumi di coesistenza, e lungo quel segmento la compressibilità è infinita <b>su un intervallo, non in un punto</b>. La differenza fra il punto critico e la coesistenza è tutta qui: nel primo caso l&rsquo;equivalenza degli insiemi salta in un punto isolato del diagramma di fase, nel secondo su una regione.</p>
   <p><b>Dove questa figura mente.</b> Disegna il tratto instabile come se fosse un pezzo di isoterma. Non lo è: è un artefatto dell&rsquo;equazione di van der Waals, che è una funzione analitica e quindi non sa produrre lo spigolo della coesistenza. Che il tratto sia un artefatto lo dice il formalismo di questa tappa — non un&rsquo;osservazione sperimentale — ed è un buon esempio di come un criterio statistico corregga un&rsquo;equazione di stato.</p>`},
  {t:'prosa', title:'Il secondo modo di rompere l equivalenza: un solo livello che si gonfia', tag:'costruzione', html:R`
  <p>C&rsquo;è una seconda maniera, del tutto diversa, in cui la fluttuazione relativa smette di andare come $N^{-1/2}$, e non richiede nessuna interazione fra le particelle. Riguarda le occupazioni dei singoli livelli, e conviene anticiparla qui perché è il caso in cui l&rsquo;equivalenza si rompe in un sistema <i>ideale</i>.</p>
  <p>Consideriamo un livello di energia $\varepsilon$ che può ospitare un numero illimitato di particelle. La tappa 08 mostrerà che la sua occupazione media vale $\langle n\rangle=x/(1-x)$ con $x=e^{-\beta(\varepsilon-\mu)}$, e che la serie converge solo se $x<1$, cioè $\mu<\varepsilon$. Applicando a questo singolo livello la stessa macchina della tappa 05 — la varianza è $z\,\partial_z$ della media, cioè $x\,\partial_x$ — si ottiene</p>
  $$\langle\Delta n^2\rangle=x\frac{\partial}{\partial x}\frac{x}{1-x}=\langle n\rangle(1+\langle n\rangle)$$
  <p>Si legga il risultato. Quando l&rsquo;occupazione è piccola, $\langle n\rangle\ll1$, la varianza è circa uguale alla media: si ritrova la Poisson, e la fluttuazione relativa è $\langle n\rangle^{-1/2}$, piccola se l&rsquo;occupazione è grande. Ma quando $\langle n\rangle\gg1$ la varianza vale $\langle n\rangle^2$, e la <b>fluttuazione relativa è di ordine uno</b>: il livello contiene un numero di particelle che fluttua quanto sé stesso, per quanto grande sia il sistema.</p>
  <p>Che questa non sia un&rsquo;ipotesi remota lo dice il comportamento del livello più basso. Ponendo $\varepsilon=0$ per il fondamentale, l&rsquo;occupazione media è $1/(e^{-\beta\mu}-1)$, e</p>
  $$\lim_{\mu\to0^-}\frac{1}{e^{-\beta\mu}-1}=+\infty$$
  <p>Cioè: <b>avvicinando il potenziale chimico allo zero, un solo livello può contenere una frazione macroscopica di tutte le particelle</b>, con fluttuazioni dello stesso ordine del suo contenuto. Grilli-Giardina (pag. 99) segnalano il fenomeno dal lato del conto: nelle somme sui livelli il termine con impulso nullo diverge quando $z\to1$, e quel singolo termine «può essere importante quanto l&rsquo;intera somma» — motivo per cui va estratto a mano prima di sostituire la somma con un integrale, perché la densità degli stati si annulla in $\varepsilon=0$ e l&rsquo;integrale gli darebbe peso zero.</p>
  <p>Qui le due fonti divergono su un punto di sostanza, e vale la pena dichiararlo. Grilli-Giardina (pag. 83, 99) chiudono la questione: la convergenza della serie geometrica richiede $e^{\beta(\mu-\varepsilon)}<1$ per ogni $\varepsilon$, e imponendolo sul livello fondamentale si ottiene <b>$\mu\le0$</b> per un sistema a occupazione illimitata. Crisanti, nel punto corrispondente (pag. 250), scrive invece una nota aperta: «questo se $\mu<\varepsilon_p$. Bisognerebbe approfondire. Forse è sufficiente considerare il fatto che la distribuzione non ha senso se questa condizione non si verifica». È la stessa condizione, ma una fonte la deriva e l&rsquo;altra la lascia come appunto — e conviene saperlo, perché in sede d&rsquo;esame la richiesta di <i>giustificare</i> il vincolo su $\mu$ è frequente e la risposta è la convergenza della geometrica, non un&rsquo;imposizione esterna.</p>`}
]},

/* ---------------- 07 · IL POTENZIALE CHIMICO ---------------- */
{ num:'07', title:'Il potenziale chimico: che cosa significa, che segno ha, come si fissa dalla densita', meta:'il costo di aggiungere una particella · equilibrio come uguaglianza di mu · il segno per un gas classico · i numeri',
  blocchi:[
  {t:'prosa', title:'Tre definizioni equivalenti, e quella che va tenuta in testa', tag:'grammatica', html:R`
  <p>Il potenziale chimico è comparso due volte senza che gli abbiamo mai dato un significato: come derivata dell&rsquo;energia libera nello sviluppo della tappa 01, e come moltiplicatore di Lagrange nella strada formale. È ora di dire che cos&rsquo;è.</p>
  <p>Le definizioni possibili sono tre, e sono la stessa cosa vista con vincoli diversi:</p>
  $$\mu=\left(\frac{\partial F}{\partial N}\right)_{T,V}\qquad\mu=\left(\frac{\partial E}{\partial N}\right)_{S,V}\qquad\mu=\left(\frac{\partial G}{\partial N}\right)_{T,P}$$
  <p>La prima è il costo in <i>energia libera</i> di aggiungere una particella al sistema tenendo fermi temperatura e volume; la seconda il costo in energia interna tenendo ferme entropia e volume; la terza il costo in entalpia libera a temperatura e pressione fisse. La terza ha un&rsquo;aggiunta preziosa: siccome $G$ è estensiva e le sue variabili naturali $(T,P)$ sono entrambe intensive, per il teorema di Eulero $G=\mu N$, e dunque <b>il potenziale chimico è l&rsquo;energia libera di Gibbs per particella</b>. È la formulazione da tenere in testa perché è quella che si usa in chimica, in elettrochimica e nei cambiamenti di fase.</p>
  <p>La definizione che conta per questo movimento è però la prima, e conviene leggerla al rovescio. Nel gran canonico $\mu$ non è un costo che si calcola: è una <b>manopola che il serbatoio tiene in mano</b>, e il sistema risponde regolando il proprio numero di particelle finché il costo marginale di una particella in più eguaglia quello che il serbatoio chiede. Di qui la regola di equilibrio: <b>due sistemi che possono scambiarsi particelle sono all&rsquo;equilibrio quando hanno lo stesso potenziale chimico</b>, esattamente come due sistemi che scambiano energia sono in equilibrio quando hanno la stessa temperatura. Crisanti usa proprio questo criterio (pag. 176-178) per ricavare la formula barometrica imponendo che $\mu$ sia costante lungo una colonna di gas in campo gravitazionale — il che, dato che a quote diverse la pressione è diversa, obbliga la densità a variare nel modo giusto.</p>
  <p>Una conseguenza che sorprende chi la incontra la prima volta: <b>le particelle fluiscono da potenziale chimico alto a potenziale chimico basso</b>, non da densità alta a densità bassa. Nella maggior parte dei casi le due cose coincidono, perché $\mu$ cresce con la densità; ma se i due sistemi hanno temperature diverse, o campi esterni diversi, o composizioni diverse, la densità può fluire «in salita» senza violare nulla. È il motivo per cui l&rsquo;osmosi funziona.</p>`},
  {t:'reveal', title:'Il segno, e il conto che lo fissa', tag:'costruzione', steps:[
   {label:'Come si inverte la relazione fra mu e la densita', body:R`
   <p>Nel gran canonico il potenziale chimico è la variabile di controllo, ma nei problemi è quasi sempre l&rsquo;incognita: si conosce la densità, e si vuole $\mu$. L&rsquo;inversione si fa con la formula del numero medio.</p>
   <p>Per un gas classico avevamo $\langle N\rangle=zz_1$ con $z_1=V/\lambda^3$. Tenendo conto della degenerazione di spin — che Grilli-Giardina portano esplicitamente e Crisanti pone uguale a uno — ogni livello orbitale conta $g_s=2S+1$ volte, e la relazione diventa</p>
   $$g_s\frac{V}{\lambda^3}e^{\mu/T}=N$$
   <p>Risolvendo per il potenziale chimico si ottiene la formula che ricompare in ogni esercizio:</p>
   $$\mu=T\log\frac{n\lambda^3}{g_s}$$
   <p>con $n=N/V$ la densità. Grilli-Giardina (pag. 100) la scrivono nella forma equivalente $\mu_{\rm cl}=-T\log\left(\frac{g_sV}{N}\left(\frac{2\pi mT}{h^2}\right)^{3/2}\right)$, che è la stessa cosa col logaritmo rovesciato e $\lambda$ scritta per esteso: <b>il disaccordo è solo di grafia, e conviene saper riconoscere le due forme perché i testi le alternano.</b></p>
   <p>Il modo giusto di leggere questa formula è che <b>il potenziale chimico misura, in unità di $T$, il logaritmo del numero di particelle per cella termica</b>. La quantità $n\lambda^3$ è il numero di particelle che stanno dentro un volume $\lambda^3$, cioè dentro il pacchetto d&rsquo;onda termico di una particella — la stessa quantità che decide se una statistica classica sia lecita.</p>`},
   {label:'Perche e negativo, e quanto', body:R`
   <p>Il segno segue subito. Una statistica classica è applicabile quando è raro che due particelle si contendano lo stesso stato, cioè quando $n\lambda^3\ll1$; ma allora il logaritmo è negativo, e <b>il potenziale chimico di un gas classico è negativo, e grande in modulo rispetto a $T$</b>. Non è un dettaglio tecnico: significa che aggiungere una particella a un gas rarefatto <i>abbassa</i> l&rsquo;energia libera, perché il guadagno entropico del volume disponibile batte il costo energetico. Ed è anche il motivo per cui la fugacità $z=e^{\mu/T}$ è piccola: la fugacità <b>è</b> $n\lambda^3/g_s$.</p>
   <p>Mettiamoci i numeri, con lo <span class="str" data-str="ordini-di-grandezza">strumento degli ordini di grandezza</span>, per l&rsquo;elio a temperatura e pressione ambiente ($T=300$ K, $P=1{,}013\times10^5$ Pa, $m=6{,}642\times10^{-27}$ kg). La densità è $n=P/k_BT$, la lunghezza termica è $\lambda=h/\sqrt{2\pi mk_BT}$, e il prodotto vale</p>
   <p style="text-align:center">$n\lambda^3\simeq3{,}129\times10^{-6}$</p>
   <p>cioè tre milionesimi di particella per cella termica: un gas classico con sei ordini di margine. Il potenziale chimico corrispondente è, in unità della temperatura,</p>
   <p style="text-align:center">$\mu/T\simeq-12{,}7$</p>
   <p>e in unità di energia, moltiplicando per $k_BT\simeq0{,}0259$ eV,</p>
   <p style="text-align:center">$\mu\simeq-0{,}33$ eV</p>
   <p><b>Questi tre numeri sono la taratura da portarsi dietro.</b> Un potenziale chimico di una dozzina di $T$ sotto lo zero è la firma di un gas classico ben rarefatto; un potenziale chimico che si avvicina a zero dal basso dice che le occupazioni stanno diventando di ordine uno; un potenziale chimico positivo, dell&rsquo;ordine dell&rsquo;energia di Fermi, dice che si è in un regime degenere e che la formula classica non è più nemmeno approssimativamente valida.</p>`},
   {label:'La dipendenza dalla temperatura, e dove la formula si suicida', body:R`
   <p>Che cosa fa $\mu$ al variare della temperatura, a densità fissata? Siccome $\lambda\propto T^{-1/2}$, si ha $n\lambda^3\propto T^{-3/2}$ e quindi</p>
   $$\mu(T)=T\log\!\big(n\lambda^3\big)=-\frac32T\log T+\text{cost}\cdot T$$
   <p>Scegliendo l&rsquo;unità di temperatura in modo che $n\lambda^3$ valga uno alla temperatura $1$, la costante sparisce e resta $\mu=-\frac32T\log T$. Derivando,</p>
   $$\frac{\partial}{\partial T}\left(-\frac32T\log T\right)=-\frac32\log T-\frac32$$
   <p>che si annulla in $T=1/e$, dove $\mu$ raggiunge il suo massimo, pari a $\frac{3}{2e}\simeq0{,}552$. E qui c&rsquo;è il punto: <b>per $T<1$ la formula classica dà un potenziale chimico positivo</b>, e un potenziale chimico positivo, come abbiamo visto nella tappa 06, è incompatibile con occupazioni illimitate. Il cambio di segno di $\mu$ non è un fenomeno fisico: è il modo in cui la formula classica dichiara di essere uscita dal proprio dominio, e cade esattamente dove $n\lambda^3$ raggiunge l&rsquo;unità.</p>
   <p>Se si ottuplica la densità, il punto di cambio di segno si sposta: la condizione $n\lambda^3=1$ diventa $8T^{-3/2}=1$, cioè $T$ pari a $8^{2/3}=4$, e la costante additiva vale $\log8\simeq2{,}0794$. <b>Più è denso il gas, più in alto in temperatura bisogna salire per poterlo trattare classicamente</b>, e la figura qui sotto mostra le due curve una accanto all&rsquo;altra.</p>`}
  ]},
  {t:'plot', title:'Il potenziale chimico classico contro la temperatura, a densita fissata',
   intro:R`Potenziale chimico di un gas classico in funzione della temperatura, a densità costante, in unità in cui $n\lambda^3=1$ a $T=1$ per la curva verde. La curva gialla è lo stesso gas a densità otto volte maggiore. Sopra l'asse orizzontale la formula classica non ha significato fisico.`,
   plots:[
    {kind:'func2d', xr:[0.08,4.5], yr:[-11,3], height:350, ticks:6,
     title:'mu(T) a densita fissata, per due densita',
     curves:[
      {f:'-1.5*x*log(x)', col:'#5eead4', label:'densita n: cambia segno a T = 1'},
      {f:'x*(2.0794-1.5*log(x))', col:'#d8a13a', label:'densita 8n: cambia segno a T = 4'}
     ],
     xlabel:'T (in unita della temperatura di degenerazione della curva verde)', ylabel:'mu'}
   ],
   leggi:R`<p><b>Che cosa guardare: dove ogni curva taglia lo zero.</b> Quel punto è, per costruzione, la temperatura alla quale $n\lambda^3$ vale uno — cioè la temperatura di degenerazione. A destra di quel punto il potenziale chimico è negativo e scende sempre più ripidamente: il gas è classico, e lo è tanto più quanto più fa caldo. A sinistra la curva sale sopra lo zero, e <b>lì il conto non descrive più niente</b>. Le due curve dicono che la stessa temperatura può essere «calda» per un gas rarefatto e «fredda» per uno otto volte più denso: la classicità non è una proprietà della temperatura, è una proprietà del prodotto $n\lambda^3$.</p>
   <p><b>Che cosa impararne per gli esercizi.</b> La pendenza della curva a destra è, cambiata di segno, l&rsquo;entropia per particella: dal differenziale del gran potenziale si ha $S=-\partial\Omega/\partial T$, e per unità di particella la relazione diventa $s=-\partial\mu/\partial T$ a pressione fissata. Che $\mu$ scenda ripido ad alta temperatura è quindi lo stesso fatto per cui l&rsquo;entropia di un gas cresce col logaritmo della temperatura. <b>Chi ricorda il grafico non ha bisogno di ricordare il segno della relazione</b>: basta guardare da che parte pende la curva.</p>
   <p><b>Dove questa figura mente.</b> Prolunga le curve nella regione a sinistra dello zero, dove la formula è fuori dominio. Il potenziale chimico vero di un gas di particelle a occupazione illimitata non supera mai lo zero — si appiattisce contro di esso e ci resta — mentre quello di particelle a occupazione unitaria tende a un valore positivo finito, l&rsquo;energia di Fermi. Grilli-Giardina riportano il confronto fra i tre andamenti nella loro figura 10.6, ed è il disegno da tenere accanto a questo.</p>`}
]},

/* ---------------- 08 · IL NUMERO DI OCCUPAZIONE MEDIO ---------------- */
{ num:'08', title:'Il numero di occupazione medio di un livello: la formula che gli scritti usano senza nominarla', meta:'un livello e un sistema aperto · la geometrica e la sua convergenza · occupazione illimitata e occupazione unitaria · il limite di occupazione piccola',
  blocchi:[
  {t:'prosa', title:'Perche questa e la tappa che conta', tag:'architettura', html:R`
  <p>Tutto quello che precede serve a costruire questa. Il gran canonico come <i>tecnica</i> — derivare l&rsquo;insieme, il gran potenziale, l&rsquo;equivalenza — è materia da orale, e va saputo derivare per intero. Ma in uno scritto il gran canonico compare quasi sempre travestito: il testo non dice «si usi l&rsquo;insieme gran canonico», dice «si consideri un sistema con livelli di energia $\varepsilon_i$» e chiede l&rsquo;energia media, il calore specifico, la magnetizzazione. E la porta d&rsquo;ingresso, ogni volta, è una formula sola: <b>il numero medio di particelle che occupano un dato livello</b>.</p>
  <p>La ragione per cui quella formula esiste, ed è così semplice, è un&rsquo;idea che vale la pena isolare prima di fare i conti. <b>Un singolo livello di energia è esso stesso un sistema aperto</b>, e il resto del gas gli fa da serbatoio: gli scambia particelle e gli impone la propria temperatura e il proprio potenziale chimico. Dunque la distribuzione gran canonica si applica al livello, con «stato» il numero $n$ di particelle che lo occupano, energia $n\varepsilon$ e numero di particelle $n$. Tutto l&rsquo;apparato costruito fin qui, applicato all&rsquo;oggetto più piccolo possibile.</p>
  <p>Questa mossa è anche la ragione tecnica per cui il gran canonico esiste. Nel canonico la somma sugli stati di un gas di particelle identiche è vincolata: $\sum_p n_p=N$, e Crisanti (pag. 249) annota che «il vincolo sul numero totale di particelle rende l&rsquo;uso del canonico piuttosto scomodo». Nel gran canonico si somma anche su $N$, e allora <b>il vincolo si può eliminare</b> perché tutte le configurazioni sono comunque incluse. Grilli-Giardina dedicano a questo passaggio una pagina intera con due figure (pag. 81-82), premettendo che «è un passaggio molto delicato e richiede una comprensione profonda delle quantità in gioco», e il nocciolo è l&rsquo;inversione</p>
  $$\sum_{\{n_p\}}\prod_p\;\longrightarrow\;\prod_p\sum_{n_p=0}$$
  <p>Prima della freccia la somma corre sulle <i>configurazioni</i> a $N$ fissato e il prodotto sui livelli; dopo, il prodotto fissa un livello e la somma corre su tutti i valori che quel livello può assumere, indipendentemente dagli altri. <b>La gran partizione di un gas ideale si fattorizza livello per livello</b>, e questo è l&rsquo;intero guadagno.</p>`},
  {t:'reveal', title:'Il conto, su un livello solo', tag:'costruzione', steps:[
   {label:'La gran partizione di un livello, e la sua condizione di esistenza', body:R`
   <p>Sia $\varepsilon$ l&rsquo;energia del livello e $n$ il numero di particelle che lo occupano. Lo stato del livello è specificato da $n$ e basta. Il peso gran canonico di quello stato è $e^{-\beta(n\varepsilon-\mu n)}$, e la gran partizione del livello si ottiene sommando su tutti i valori ammessi di $n$. Se non c&rsquo;è nessun limite all&rsquo;occupazione, $n$ corre su tutti gli interi non negativi e la somma è una <span class="str" data-str="serie-geometrica">serie geometrica</span> di ragione $e^{-\beta(\varepsilon-\mu)}$:</p>
   $$\mathcal Z_\varepsilon=\sum_{n=0}^{\infty}e^{-n\beta(\varepsilon-\mu)}=\frac{1}{1-e^{-\beta(\varepsilon-\mu)}}$$
   <p>Si osservi che la <b>condizione di convergenza è una condizione fisica</b> e non un tecnicismo: la serie converge se e solo se la ragione è minore di uno, cioè se $\varepsilon>\mu$. La richiesta deve valere per <i>ogni</i> livello, e quindi per il più basso: se il livello fondamentale ha energia nulla, si ottiene $\mu\le0$. È esattamente la condizione che Grilli-Giardina derivano a pag. 83 e che Crisanti lascia come nota aperta a pag. 250, e ora se ne vede l&rsquo;origine — <b>il potenziale chimico non può superare l&rsquo;energia del livello più basso, altrimenti la funzione di partizione non esiste.</b></p>
   <p>Conviene abbreviare ponendo $x\equiv e^{-\beta(\varepsilon-\mu)}$, che è la fugacità pesata dal fattore di Boltzmann del livello. Allora $\mathcal Z_\varepsilon$ è $1/(1-x)$ e il logaritmo è $-\log(1-x)$.</p>`},
   {label:'L occupazione media, per derivazione logaritmica', body:R`
   <p>Il numero medio di particelle nel livello si ottiene con la stessa formula di sempre, $\langle n\rangle=z\,\partial_z\log\mathcal Z_\varepsilon$; e siccome $x$ è proporzionale a $z$, l&rsquo;operatore $z\,\partial_z$ agisce come $x\,\partial_x$. Dunque</p>
   $$\langle n\rangle=x\frac{\partial}{\partial x}\log\frac{1}{1-x}=\frac{x}{1-x}$$
   <p>Rimettendo dentro l&rsquo;espressione di $x$ e dividendo numeratore e denominatore per $x$ si ottiene la forma canonica del risultato:</p>
   $$\langle n\rangle=\frac{e^{-\beta(\varepsilon-\mu)}}{1-e^{-\beta(\varepsilon-\mu)}}=\frac{1}{e^{\beta(\varepsilon-\mu)}-1}$$
   <p>Questa è la <b>distribuzione di Bose-Einstein</b>, ottenuta senza mai parlare di funzioni d&rsquo;onda simmetriche: è uscita dalla sola ipotesi che l&rsquo;occupazione di un livello non abbia limite superiore.</p>
   <p>Crisanti (pag. 250-251) la ricava per una strada leggermente diversa, che vale la pena conoscere perché si generalizza a sistemi in cui i livelli non sono indipendenti. Osservando che $n_p$ si può estrarre dalla somma derivando il peso rispetto all&rsquo;energia del livello, si ottiene la formula generale</p>
   $$\langle n_p\rangle=-\frac1\beta\frac{\partial}{\partial\varepsilon_p}\log\mathcal Z$$
   <p>Applicandola al nostro caso:</p>
   $$\frac{\partial}{\partial\varepsilon}\left[-\log\left(1-e^{-\beta(\varepsilon-\mu)}\right)\right]=-\frac{\beta}{e^{\beta(\varepsilon-\mu)}-1}$$
   <p>e moltiplicando per $-1/\beta$ si ritrova lo stesso risultato. <b>Le due derivazioni sono lo stesso conto</b>: derivare rispetto a $\log z$ conta le particelle, derivare rispetto a $\varepsilon_p$ conta le particelle in quel livello, e le due coincidono quando il livello è l&rsquo;unico posto dove $\varepsilon_p$ compare.</p>`},
   {label:'Il secondo caso: occupazione al piu unitaria', body:R`
   <p>Supponiamo ora che il livello possa contenere al massimo una particella, cioè $n\in\{0,1\}$. La somma ha due soli termini:</p>
   $$\mathcal Z_\varepsilon=1+e^{-\beta(\varepsilon-\mu)}$$
   <p>e non c&rsquo;è nessuna condizione di convergenza da imporre: <b>il potenziale chimico è libero di assumere qualunque valore, anche positivo.</b> Il logaritmo è $\log(1+x)$, e la derivazione dà</p>
   $$\langle n\rangle=x\frac{\partial}{\partial x}\log(1+x)=\frac{x}{1+x}$$
   <p>cioè, nella forma canonica,</p>
   $$\langle n\rangle=\frac{e^{-\beta(\varepsilon-\mu)}}{1+e^{-\beta(\varepsilon-\mu)}}=\frac{1}{e^{\beta(\varepsilon-\mu)}+1}$$
   <p>che è la <b>distribuzione di Fermi-Dirac</b>. La differenza rispetto al caso precedente è un solo segno al denominatore, e quel segno viene interamente da avere troncato la serie geometrica al primo termine invece di sommarla tutta.</p>
   <p>Vale la pena guardare subito le fluttuazioni, perché il segno cambia anche quelle. Applicando $x\,\partial_x$ alla media, come nella tappa 05,</p>
   $$\langle\Delta n^2\rangle=x\frac{\partial}{\partial x}\frac{x}{1+x}=\langle n\rangle(1-\langle n\rangle)$$
   <p>È la varianza di una variabile di Bernoulli, come deve essere: il livello è occupato o vuoto, con probabilità $\langle n\rangle$. Si confronti con il caso a occupazione illimitata, dove la varianza era $\langle n\rangle(1+\langle n\rangle)$: <b>lo stesso segno che distingue le due statistiche distingue anche le loro fluttuazioni</b>, e con conseguenze opposte. A occupazione unitaria la varianza si annulla quando il livello è pieno — un livello saturo non fluttua — mentre a occupazione illimitata la varianza esplode proprio dove l&rsquo;occupazione è grande.</p>
   <p>Le due formule si scrivono insieme come $\langle n\rangle=1/(e^{\beta(\varepsilon-\mu)}\mp1)$, con il segno meno per l&rsquo;occupazione illimitata e il più per quella unitaria; e in entrambi i casi $\varepsilon=\mu$ è un punto notevole, perché lì l&rsquo;esponente si annulla. Per l&rsquo;occupazione unitaria si ottiene $\langle n\rangle=\frac12$: <b>il potenziale chimico è il livello occupato esattamente a metà</b>, a qualunque temperatura. Per l&rsquo;occupazione illimitata $\varepsilon=\mu$ è invece il bordo del dominio, dove la formula diverge.</p>`},
   {label:'Il terzo caso: quando le occupazioni sono piccole', body:R`
   <p>Resta il regime che copre quasi tutti gli esercizi classici. Se l&rsquo;esponente $a\equiv\beta(\varepsilon-\mu)$ è grande, cioè se il livello è molto sopra il potenziale chimico, allora $e^{a}\gg1$ e l&rsquo;unità al denominatore è trascurabile in entrambe le formule. Formalmente, moltiplicando l&rsquo;occupazione per $e^{a}$,</p>
   $$\lim_{a\to+\infty}\frac{e^{a}}{e^{a}-1}=1$$
   <p>e lo stesso con il segno opposto: le due occupazioni diventano indistinguibili da $e^{-a}=ze^{-\beta\varepsilon}$, cioè dalla <b>statistica di Maxwell-Boltzmann</b>. Grilli-Giardina (pag. 99) lo dicono esattamente così: nel limite classico le particelle sono distribuite su molti stati, il numero di occupazione di ciascuno è molto minore di uno, e <i>le statistiche di Fermi, Boltzmann e Bose coincidono</i>.</p>
   <p>Conviene però vedere anche il <b>primo ordine oltre il limite</b>, perché è lì che si vede la differenza fra i due casi e perché è la domanda che un esame pone quando chiede «si calcoli la prima correzione quantistica». Sviluppando in $e^{-a}$:</p>
   $$\frac{1}{e^{a}-1}=e^{-a}+e^{-2a}+\cdots$$
   $$\frac{1}{e^{a}+1}=e^{-a}-e^{-2a}+\cdots$$
   <p>Il primo termine è comune ed è Maxwell-Boltzmann; il secondo ha segno opposto nei due casi. A occupazione illimitata la correzione <b>aumenta</b> l&rsquo;occupazione rispetto al valore classico, a occupazione unitaria la <b>diminuisce</b>. È la traduzione quantitativa dell&rsquo;idea che il vincolo di occupazione unitaria agisca come una repulsione effettiva e la sua assenza come un&rsquo;attrazione effettiva: nessuna forza, solo conteggio di stati.</p>
   <p>E la condizione del limite classico si traduce subito nel linguaggio della tappa 07. Che $\langle n\rangle\ll1$ per ogni livello significa che è piccola anche la fugacità, perché il livello più basso ha occupazione circa $z$; e la fugacità è $n\lambda^3/g_s$. <b>Il limite classico, la piccolezza della fugacità e la condizione $n\lambda^3\ll1$ sono lo stesso enunciato scritto in tre lingue</b>, e chi lo riconosce non deve ricordare tre cose.</p>`}
  ]},
  {t:'plot', title:'Le tre occupazioni, e la curva che le mette una contro l altra',
   intro:R`A sinistra: numero medio di occupazione in funzione di $a=\beta(\varepsilon-\mu)$, per occupazione illimitata (verde), classica (gialla) e unitaria (rossa). A destra: la curva parametrica che si ottiene mettendo in ascissa l'occupazione a vincolo unitario e in ordinata quella illimitata, al variare di $a$ da $6$ (vicino all'origine) a $0{,}25$.`,
   plots:[
    {kind:'func2d', xr:[-2,5], yr:[0,3], height:330, ticks:6,
     title:'occupazione media contro (eps - mu) / T',
     curves:[
      {f:'1/(exp(x)-1)', col:'#5eead4', label:'occupazione illimitata: diverge a a = 0'},
      {f:'exp(-x)', col:'#d8a13a', label:'classica: esponenziale pura'},
      {f:'1/(exp(x)+1)', col:'#ff6b6b', label:'occupazione unitaria: satura a 1, vale 1/2 in a = 0'}
     ],
     xlabel:'a = (eps - mu) / T', ylabel:'occupazione media'},
    {kind:'curve', x:'1/(exp(t)+1)', y:'1/(exp(t)-1)', tr:[0.25,6],
     xr:[0,0.5], yr:[0,3.6], equal:false, height:330,
     title:'occupazione illimitata contro occupazione unitaria',
     xlabel:'occupazione a vincolo unitario', ylabel:'occupazione illimitata'}
   ],
   leggi:R`<p><b>Nella prima figura, guardare a destra e a sinistra dello zero.</b> A destra, per $a$ grande, le tre curve si sovrappongono: già in $a=3$ stanno entro il cinque per cento. È il limite classico, e la figura dice che <b>non è un limite di alta temperatura ma di grande $a$</b> — cioè di potenziale chimico molto al di sotto dei livelli occupati. A sinistra le curve si separano nel modo che le definisce: la rossa non supera mai l&rsquo;unità perché il livello non può contenere più di una particella, la verde diverge avvicinandosi a $a=0$ perché non c&rsquo;è tetto, la gialla passa in mezzo ignorando la differenza. Il punto $a=0$ è dove il livello ha energia pari al potenziale chimico: la curva rossa vi passa a quota $\frac12$, e questo fissa il significato geometrico di $\mu$.</p>
   <p><b>Nella seconda figura, guardare la bisettrice.</b> Ogni punto della curva corrisponde a un valore di $a$, e le sue due coordinate sono le occupazioni che i due vincoli darebbero per quello stesso livello. Vicino all&rsquo;origine — occupazioni piccole, cioè $a$ grande — la curva è indistinguibile dalla bisettrice: <b>i due vincoli producono lo stesso numero, ed è il limite classico visto in un piano invece che in un grafico</b>. Allontanandosi dall&rsquo;origine la curva si impenna: quando il vincolo unitario darebbe $0{,}1$, quello illimitato dà $\frac18$, cioè un venticinque per cento in più, e il valore di $a$ corrispondente è $\log9\simeq2{,}197$. Più si sale, più lo scarto cresce, fino a diventare infinito quando l&rsquo;ascissa raggiunge $\frac12$.</p>
   <p><b>Che cosa impararne per lo scritto.</b> La domanda «si verifichi che ad alta temperatura si ritrova il risultato classico» chiede, in pratica, di mostrare che il problema vive vicino all&rsquo;origine della seconda figura. Il modo corretto di rispondere non è scrivere $T\to\infty$: è <b>dichiarare il parametro piccolo</b> — la fugacità, ovvero $n\lambda^3$ — verificarlo con i numeri del problema, e sostituire $\langle n\rangle\to ze^{-\beta\varepsilon}$ negli integrali.</p>`},
  {t:'plot', title:'Il potenziale chimico e il livello occupato a meta',
   intro:R`Curve di livello dell'occupazione media a vincolo unitario nel piano energia-temperatura, con energia in ascissa in unità di $\mu$ e temperatura in ordinata nelle stesse unità. Ogni curva è un insieme di punti in cui l'occupazione vale lo stesso numero.`,
   plots:[
    {kind:'contour', f:'1/(exp((x-1)/y)+1)', xr:[0,2], yr:[0.02,0.7],
     levels:[0.1,0.25,0.5,0.75,0.9], equal:false, height:340,
     title:'curve di livello dell occupazione a vincolo unitario',
     xlabel:'energia del livello, in unita di mu', ylabel:'temperatura, in unita di mu'}
   ],
   leggi:R`<p><b>Che cosa guardare: la curva verticale in mezzo.</b> La linea di livello $\frac12$ è una retta verticale in $\varepsilon=\mu$, e lo è <i>a qualunque temperatura</i>: è la traduzione grafica del fatto che l&rsquo;esponente si annulla lì e basta. <b>Il potenziale chimico è, letteralmente, il livello occupato a metà</b> — e questa è la definizione operativa da usare quando in un problema bisogna indovinare dove cada $\mu$.</p>
   <p><b>Che cosa impararne: le altre curve sono rette che si aprono a ventaglio.</b> Imponendo $\langle n\rangle=\frac{1}{10}$ si ottiene $e^{a}+1=10$, cioè $a=\log9$, cioè $\varepsilon=\mu+T\log9$: una retta di pendenza $\log9$ nel piano. Simmetricamente, $\langle n\rangle=\frac{9}{10}$ dà $\varepsilon=\mu-T\log9$. Le due rette si allontanano linearmente dalla verticale al crescere della temperatura, e la loro distanza è la <b>larghezza della zona di transizione</b>: vale circa $4{,}4\,T$ fra il dieci e il novanta per cento. A temperatura nulla il ventaglio si chiude e l&rsquo;occupazione diventa un gradino netto.</p>
   <p><b>Dove questa figura mente.</b> Tiene $\mu$ fissato mentre la temperatura varia, e questo in un sistema reale non succede: a numero di particelle fissato il potenziale chimico si muove con la temperatura, come mostra la figura della tappa 07. La figura va quindi letta come una mappa del <i>peso statistico</i> a $\mu$ dato, non come la storia di un sistema che si scalda.</p>`},
  {t:'prosa', title:'Come si riconosce, e come si usa', tag:'regola operativa', html:R`
  <p>Crisanti chiude la sezione (pag. 251) con una frase che vale la pena trattare come una regola: <b>«Tutta la meccanica statistica di questi sistemi si può ricavare conoscendo il numero medio di occupazione.»</b> È letteralmente vero, e la procedura è questa.</p>
  <p><b>Uno: si riconosce la struttura.</b> Se il sistema è fatto di parti indipendenti — livelli, siti, modi — che possono contenere un numero variabile di particelle, si è in un problema gran canonico anche se nessuno lo ha detto. I segnali: il testo elenca livelli di energia; chiede una frazione di occupazione; parla di un sistema a contatto con un gas o con un altro sistema; oppure introduce esplicitamente un potenziale chimico. <b>Due: si scrive la gran partizione di una parte sola</b>, sommando sui valori ammessi dell&rsquo;occupazione — che è sempre o una geometrica, o un polinomio con pochi termini. <b>Tre: si deriva</b>, ottenendo l&rsquo;occupazione media di quella parte. <b>Quattro: si fissa $\mu$</b> imponendo</p>
  $$N=\sum_p\langle n_p\rangle$$
  <p>che è anche la condizione di coerenza dell&rsquo;insieme: Crisanti (pag. 251) verifica che sommando le occupazioni medie su tutti i livelli si ritrova la stessa $\langle N\rangle$ ottenuta da $z\,\partial_z\log\mathcal Z$, e annota che questo «stabilisce la coerenza del gran canonico». <b>Cinque: si calcola tutto il resto</b> come somma pesata, $E=\sum_p\varepsilon_p\langle n_p\rangle$, e da $E$ il calore specifico.</p>
  <p>C&rsquo;è una sola trappola sistematica nel passo quattro, e va nominata perché costa punti. Quando i livelli sono fitti si sostituisce la somma con un integrale, $\sum_p\to\frac{g_sV}{h^3}\int d^3p$, e l&rsquo;integrale si scrive con la densità degli stati, che in tre dimensioni va come $\sqrt\varepsilon$. Gli integrali che ne risultano sono della forma</p>
  $$\int_0^\infty dy\,\frac{y^{1/2}}{e^{y}-1}=\Gamma\!\left(\tfrac32\right)\zeta\!\left(\tfrac32\right)\simeq2{,}315$$
  <p>dove compaiono la <span class="str" data-str="funzione-gamma">funzione Gamma di Eulero</span> e la <span class="str" data-str="funzione-zeta-di-riemann">funzione zeta di Riemann</span>. Ma la densità degli stati si annulla in $\varepsilon=0$, e quindi <b>la sostituzione somma-integrale dà peso nullo al livello fondamentale</b>. Grilli-Giardina (pag. 99-101) lo segnalano con enfasi: il termine con impulso nullo va estratto a mano <i>prima</i> di passare all&rsquo;integrale, perché — come si è visto nella tappa 06 — proprio quel termine può contenere una frazione macroscopica delle particelle. <b>Una sostituzione che sembra innocua perde esattamente lo stato più importante</b>, ed è il tipo di errore che non si vede rileggendo, perché il conto resta formalmente pulito.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`La derivazione del numero di occupazione tratta un singolo livello come un sistema aperto. Ma i livelli di un gas non sono indipendenti: le particelle sono le stesse. Dov&rsquo;è l&rsquo;inganno?`,
    a:R`Non c&rsquo;è inganno, e il criterio che lo garantisce è proprio l&rsquo;eliminazione del vincolo. Nel canonico i livelli <b>non</b> sono indipendenti, perché $\sum_pn_p=N$ lega le occupazioni fra loro: riempire un livello svuota gli altri. Nel gran canonico quel vincolo è stato tolto sommando anche su $N$, e la gran partizione si fattorizza esattamente, $\mathcal Z=\prod_p\mathcal Z_p$. Le occupazioni dei diversi livelli diventano quindi variabili aleatorie <b>statisticamente indipendenti</b>, e questa indipendenza è il prezzo — e il premio — di aver lasciato fluttuare $N$. L&rsquo;accoppiamento fra i livelli non è sparito: è stato riassunto in un solo numero, $\mu$, che è comune a tutti.`},
   {q:R`Nel limite classico le due statistiche coincidono. Vuol dire che la distinzione fra i due vincoli di occupazione è irrilevante per un gas rarefatto?`,
    a:R`Sui valori medi sì, sulle fluttuazioni no — ed è una distinzione che un esame può chiedere. Il criterio invocato sono le due varianze ricavate qui sopra, $\langle n\rangle(1\pm\langle n\rangle)$: quando $\langle n\rangle\ll1$ entrambe valgono circa $\langle n\rangle$, e in quel senso la distinzione svanisce. Ma il termine correttivo ha segno <b>opposto</b> nei due casi, e in un esperimento che misuri correlazioni — per esempio l&rsquo;interferometria di intensità, che conta coincidenze di arrivo — quel termine è proprio ciò che si misura. È il motivo per cui due fasci di particelle identiche mostrano un eccesso o un difetto di coincidenze anche quando sono così rarefatti che ogni valore medio è classico.`}
  ]}
]},

/* ---------------- 09 · IL GRAN CANONICO QUANTISTICO ---------------- */
{ num:'09', title:'Il gran canonico quantistico, e il caso in cui il potenziale chimico vale zero', meta:'operatore densita su spazio a numero indefinito · il postulato delle fasi casuali · il solido di Einstein · particelle non conservate',
  blocchi:[
  {t:'prosa', title:'L operatore densita, e un disaccordo di metodo fra le fonti', tag:'costruzione', html:R`
  <p>Tutto ciò che precede è stato scritto con somme su stati classici. Il passaggio al caso quantistico non cambia la struttura — cambia soltanto che cosa si somma — ma richiede un oggetto nuovo, e sulle due fonti si legge una divergenza di <i>metodo</i> che vale la pena dichiarare.</p>
  <p>Crisanti (pag. 241-244) lo scrive per esteso. La probabilità di uno stato diventa un <b>operatore densità</b>, e per il gran canonico esso deve agire su uno spazio di Hilbert con un numero indefinito di particelle: non basta che commuti con l&rsquo;hamiltoniana, deve commutare anche con l&rsquo;operatore numero. Generalizzando il caso canonico si ottiene</p>
  $$\hat\rho=\frac{1}{\mathcal Z}e^{-\beta(\hat H-\mu\hat N)}$$
  <p>e la funzione di gran partizione diventa una traccia:</p>
  $$\mathcal Z(T,V,\mu)={\rm Tr}\,e^{-\beta(\hat H-\mu\hat N)}$$
  <p>Grilli-Giardina (pag. 79) fanno l&rsquo;opposto, e lo dichiarano in una riga: l&rsquo;operatore densità gran canonico agisce su uno spazio di Hilbert con numero indefinito di particelle, «non lo scriviamo perché non ci serve», ed è sufficiente dire che la gran partizione è $\mathcal Z=\sum_Nz^NZ(T,V,N)$ con il legame alla termodinamica identico al caso classico. <b>Non è un disaccordo di sostanza ma di economia</b>: Grilli-Giardina hanno ragione che per i conti l&rsquo;operatore non serve, Crisanti ha ragione che senza scriverlo non si vede perché serva uno spazio di Fock. Qui si scrivono entrambe le cose, perché in un orale la domanda «su quale spazio agisce $\hat\rho$?» ha una risposta sola.</p>
  <p>Fissando $N$ e sommando su tutti gli stati a quel numero, poi cambiandolo e risommando, la traccia si riorganizza e la media di un&rsquo;osservabile diventa una <b>media pesata di medie canoniche</b>:</p>
  $$\langle G\rangle=\frac{1}{\mathcal Z}\sum_{N=0}^{\infty}z^N\langle G\rangle_N\,Z(T,V,N)$$
  <p>dove $\langle G\rangle_N$ è la media canonica a $N$ fissato e i pesi sono le $w(N)$ della tappa 02. <b>Il gran canonico non è un insieme nuovo: è una sovrapposizione di insiemi canonici, pesata dalla fugacità</b> — ed è la formulazione che chiarisce definitivamente in che senso i due insiemi siano equivalenti quando la $w(N)$ è piccata.</p>
  <p>C&rsquo;è un&rsquo;osservazione di Crisanti (pag. 241) che non si trova nell&rsquo;altra fonte e che merita di essere riportata, perché è una di quelle cose che si capiscono una volta sola. Costruendo il microcanonico quantistico in una rappresentazione diversa da quella dell&rsquo;energia, il postulato di uguale probabilità a priori <b>non basta</b>: serve un secondo postulato, quello delle <i>fasi casuali a priori</i>, che impone l&rsquo;assenza di interferenza fra i membri dell&rsquo;insieme. Crisanti lo chiama «una richiesta importante non aspettata», e osserva che è «tipicamente quantistica». La ragione è che in meccanica classica le probabilità si sommano, in meccanica quantistica si sommano le ampiezze: per poter trattare un insieme statistico come una miscela incoerente, e non come una sovrapposizione, bisogna dirlo esplicitamente. <b>La meccanica statistica quantistica non è la classica con somme discrete: ha un postulato in più.</b></p>`},
  {t:'reveal', title:'Un caso in cui mu vale zero: il solido di Einstein', tag:'costruzione', steps:[
   {label:'La partizione di un oscillatore quantistico', body:R`
   <p>Vale la pena chiudere con un esempio in cui il numero di occupazione medio ricompare da una porta del tutto diversa, perché illumina che cosa sia davvero il potenziale chimico. Crisanti (pag. 245-248) studia il modello di Einstein per le vibrazioni di un solido: $N$ oscillatori armonici indipendenti, tutti con la stessa frequenza $\omega$, quantizzati, con livelli $E_n=\hbar\omega(n+1/2)$.</p>
   <p>Il modello si tratta nel <b>canonico</b>, non nel gran canonico: gli oscillatori sono distinguibili — stanno in siti diversi del reticolo, e infatti non compare nessun $N!$ — e il loro numero è fissato. La partizione di un oscillatore è una <span class="str" data-str="serie-geometrica">serie geometrica</span> a meno del fattore di punto zero. Raccogliendo $e^{-\beta\hbar\omega/2}$,</p>
   $$\sum_{n=0}^{\infty}e^{-n\beta\hbar\omega}=\frac{1}{1-e^{-\beta\hbar\omega}}$$
   <p>e quindi, moltiplicando per il fattore raccolto e riconoscendo il seno iperbolico,</p>
   $$z_1=\frac{e^{-\beta\hbar\omega/2}}{1-e^{-\beta\hbar\omega}}=\frac{1}{2\sinh(\beta\hbar\omega/2)}$$
   <p>che è la forma in cui Crisanti la scrive. L&rsquo;energia libera è $F=NT\log\left(2\sinh\frac{\beta\hbar\omega}{2}\right)$.</p>`},
   {label:'L energia, e il numero medio di quanti', body:R`
   <p>L&rsquo;energia si ottiene derivando il logaritmo della partizione rispetto a $\beta$. Ponendo $x\equiv\beta\hbar\omega$ per comodità, si deriva rispetto a $x$ e si moltiplica per $\hbar\omega$:</p>
   $$\frac{\partial}{\partial(\beta\hbar\omega)}\Big[-\log\big(2\sinh(\beta\hbar\omega/2)\big)\Big]=-\frac{\cosh(\beta\hbar\omega/2)}{2\sinh(\beta\hbar\omega/2)}$$
   <p>cioè meno metà della cotangente iperbolica. Cambiando segno e moltiplicando per $\hbar\omega$ e per il numero di oscillatori si ottiene l&rsquo;energia per oscillatore, che conviene riscrivere separando il punto zero:</p>
   $$\frac{E}{N}=\hbar\omega\,\frac{\cosh(\beta\hbar\omega/2)}{2\sinh(\beta\hbar\omega/2)}=\hbar\omega\left[\frac12+\frac{1}{e^{\beta\hbar\omega}-1}\right]$$
   <p>Il primo termine è l&rsquo;energia di punto zero, indipendente dalla temperatura; il secondo è ciò che resta. E siccome l&rsquo;energia di un oscillatore nello stato $n$ vale $(n+\frac12)\hbar\omega$, confrontando le due scritture si legge il <b>numero medio di quanti</b>:</p>
   $$\bar n=\frac{1}{e^{\beta\hbar\omega}-1}$$
   <p><b>È la formula della tappa 08 con $\mu=0$.</b> Ed è arrivata da un conto canonico su oscillatori distinguibili, senza che nessuno abbia mai nominato un serbatoio di particelle.</p>`},
   {label:'Perche il potenziale chimico e zero, e che cosa vuol dire', body:R`
   <p>La coincidenza non è casuale, e la sua spiegazione è il modo più profondo di capire che cos&rsquo;è $\mu$. I quanti di vibrazione — i fononi — <b>non sono conservati</b>: scaldando il reticolo se ne creano, raffreddandolo scompaiono, e non esiste nessuna legge che ne fissi il numero. Ma il potenziale chimico è il moltiplicatore di Lagrange che impone il valore medio di una quantità conservata; se la quantità non è conservata, <b>non c&rsquo;è nessun vincolo da imporre e il moltiplicatore vale zero</b>. In termini termodinamici: il numero di fononi si aggiusta da solo per minimizzare l&rsquo;energia libera, e la condizione di minimo rispetto a $n$ è proprio $\partial F/\partial n=\mu=0$.</p>
   <p>Da qui una regola generale che vale la pena portarsi dietro: <b>un potenziale chimico esiste se e solo se esiste una legge di conservazione</b>. Le particelle materiali ordinarie hanno un $\mu$ perché il loro numero è conservato; fononi e fotoni non ce l&rsquo;hanno; e la lista dei potenziali chimici di un sistema è, in sostanza, la lista delle sue cariche conservate.</p>
   <p>Crisanti chiude con il calore specifico, che è il motivo storico per cui Einstein costruì il modello:</p>
   $$C_V=N\frac{e^{\beta\hbar\omega}}{(e^{\beta\hbar\omega}-1)^2}(\beta\hbar\omega)^2$$
   <p>Ad alta temperatura, cioè $x\to0$:</p>
   $$\lim_{x\to0}\frac{x^2e^{x}}{(e^{x}-1)^2}=1$$
   <p>e si ritrova $C_V=N$ per oscillatore, cioè la legge di Dulong e Petit, che per tre gradi di libertà dà $3N$ — il risultato classico dell&rsquo;equipartizione, valido perché ogni oscillatore ha due termini quadratici e ciascuno porta $T/2$. A bassa temperatura, cioè $x\to+\infty$:</p>
   $$\lim_{x\to+\infty}\frac{x^2e^{x}}{(e^{x}-1)^2}=0$$
   <p>e il calore specifico si annulla, come il terzo principio pretende. <b>Il modello di Einstein è il primo caso in cui una quantizzazione spiega la sparizione di un calore specifico</b>; Crisanti annota che si annulla però «troppo rapidamente» — come $e^{-\beta\hbar\omega}$ invece che come una potenza — ed è il difetto che il modello di Debye corregge permettendo frequenze diverse. La struttura del conto, però, è quella: occupazioni medie di modi indipendenti, sommate con la loro energia.</p>`}
  ]}
]},

/* ---------------- 10 · ESERCIZI ---------------- */
{ num:'10', title:'Esercizi — tocca a te', meta:'la frazione di particelle in una regione · l isoterma di adsorbimento · il sito che ospita al piu due particelle',
  blocchi:[
  {t:'esercizio', title:'1 · Quante particelle sopra la quota h, e quanto fluttuano',
   src:'Crisanti pag. 218: il rapporto N(D)/N rifatto con il gran canonico, che accorcia il conto canonico di una pagina',
   testo:R`Un gas classico di $N$ particelle di massa $m$ sta in un cilindro di sezione $A$ e altezza infinita, in campo gravitazionale uniforme $g$ e a temperatura $T$. Calcola il numero medio di particelle che si trovano sopra la quota $h$ e la sua fluttuazione, trattando la regione sopra $h$ come un sistema aperto. Confronta la varianza che si ottiene nel gran canonico con quella che darebbe il canonico a $N$ fissato, e stabilisci quando la differenza conta. Metti infine i numeri per l'azoto atmosferico a $300$ K e $h=1$ km.`,
   steps:[
    {label:'La regione come sistema aperto, e il rapporto di due partizioni', body:R`
    <p><b>Il primo passo è la mossa di riconoscimento</b>, ed è tutto l&rsquo;esercizio: la regione sopra la quota $h$ non ha pareti, scambia liberamente particelle col resto della colonna, e quindi è un sistema gran canonico con la stessa temperatura e lo stesso potenziale chimico del resto. Per un sistema di particelle indipendenti vale $\langle N\rangle=zz_1$, e applicando la relazione sia alla regione sia al cilindro intero la fugacità si semplifica nel rapporto. Resta</p>
    $$\frac{\langle N_h\rangle}{N}=\frac{z_1^{(h)}}{z_1}$$
    <p>cioè il rapporto fra due funzioni di partizione di <i>singola</i> particella, una ristretta alla regione e una totale. Gli integrali sugli impulsi sono identici sopra e sotto e si cancellano — è il punto che fa risparmiare mezza pagina — e resta il solo integrale sulla quota. In alto:</p>
    $$\int_h^{\infty}dz\,e^{-\beta mgz}=\frac{e^{-\beta mgh}}{\beta mg}$$
    <p>e su tutta la colonna:</p>
    $$\int_0^{\infty}dz\,e^{-\beta mgz}=\frac{1}{\beta mg}$$
    <p>Il rapporto è immediato:</p>
    $$p_h=\frac{e^{-\beta mgh}/(\beta mg)}{1/(\beta mg)}=e^{-\beta mgh}$$
    <p>dunque $\langle N_h\rangle=Ne^{-\beta mgh}$. <b>Il criterio invocato</b> è che in un gas ideale la distribuzione delle coordinate è il fattore di Boltzmann del potenziale esterno normalizzato, e che la fugacità è comune a tutte le regioni perché il potenziale chimico è uniforme all&rsquo;equilibrio — che è esattamente la condizione con cui Crisanti ricava la formula barometrica.</p>`},
    {label:'La fluttuazione, e la differenza fra i due insiemi', body:R`
    <p>Nel gran canonico la distribuzione del numero di particelle nella regione è la Poisson della tappa 02, quindi</p>
    $$\langle\Delta N_h^2\rangle=\langle N_h\rangle=Np_h$$
    <p>Nel canonico, invece, il numero totale è rigorosamente $N$: ogni particella sta sopra $h$ con probabilità $p_h$ indipendentemente dalle altre, quindi $N_h$ è <b>binomiale</b> e la sua varianza è $Np_h(1-p_h)$. Le due varianze non coincidono, e la loro differenza è</p>
    $$Np-Np(1-p)=Np^2$$
    <p>cioè $\langle N_h\rangle^2/N$. <b>La differenza relativa fra le due varianze è $p_h$</b>: trascurabile quando la regione contiene una frazione piccola del gas, e massima — pari a uno — quando la regione è tutto il cilindro, dove infatti il canonico dà varianza zero e il gran canonico no. <b>Il criterio da riconoscere</b> è che l&rsquo;equivalenza degli insiemi riguarda le grandezze medie sempre, e le fluttuazioni solo quando il sottosistema è piccolo rispetto al serbatoio: qui il «serbatoio» è il resto della colonna, e se la regione lo esaurisce il serbatoio non c&rsquo;è più.</p>`},
    {label:'I numeri, per l aria', body:R`
    <p>Per l&rsquo;azoto molecolare $m\simeq4{,}649\times10^{-26}$ kg; a $T=300$ K e $h=1000$ m l&rsquo;esponente vale</p>
    <p style="text-align:center">$\beta mgh\simeq0{,}1101$</p>
    <p>e quindi la frazione di molecole sopra il chilometro è</p>
    <p style="text-align:center">$p_h\simeq0{,}8958$</p>
    <p>cioè quasi il novanta per cento: l&rsquo;atmosfera isoterma è molto più alta di un chilometro. La scala che governa il decadimento è l&rsquo;<b>altezza di scala</b> $T/(mg)$, che vale</p>
    <p style="text-align:center">$\dfrac{T}{mg}\simeq9{,}084$ km</p>
    <p>ed è la quota a cui la densità si riduce di un fattore $e$. <b>La lettura da portare via</b>: il numero puro che decide il problema è il rapporto fra energia termica ed energia gravitazionale per molecola, e a temperatura ambiente quel rapporto mette la scala dell&rsquo;atmosfera a nove chilometri — dell&rsquo;ordine dell&rsquo;Everest, che è il motivo per cui in cima si respira male e non malissimo.</p>`}
   ]},
  {t:'esercizio', title:'2 · L isoterma di adsorbimento: un sito che ospita al piu una particella',
   src:'costruito sul numero di occupazione della tappa 08, nella forma in cui gli scritti lo chiedono senza nominare il gran canonico',
   testo:R`Una superficie porta $M$ siti di adsorbimento indipendenti. Ogni sito può essere vuoto oppure ospitare un solo atomo, che in quel caso ha energia $-\varepsilon_0$ con $\varepsilon_0>0$. La superficie è a contatto con un gas classico monoatomico a temperatura $T$ e pressione $P$. Calcola la frazione di siti occupati in funzione di $P$ e $T$, e determina la pressione alla quale metà dei siti è occupata. Valuta quella pressione per $\varepsilon_0=0{,}5$ eV, $T=300$ K e massa dell'atomo pari a quella dell'azoto molecolare.`,
   steps:[
    {label:'Il sito e un sistema aperto, e il gas fissa la fugacita', body:R`
    <p><b>Il riconoscimento</b>: il sito scambia atomi col gas, dunque è un sistema aperto e il gas gli fa da serbatoio, imponendogli la propria $T$ e il proprio $\mu$. Gli stati del sito sono due — vuoto ed occupato — quindi</p>
    $$\mathcal Z_{\rm sito}=1+z\,e^{\beta\varepsilon_0}$$
    <p>dove il peso dello stato occupato porta $z$ perché contiene una particella, ed $e^{\beta\varepsilon_0}$ perché la sua energia è $-\varepsilon_0$. La frazione di siti occupati è il numero di occupazione medio della tappa 08 con il vincolo unitario: posto $x=ze^{\beta\varepsilon_0}$, vale $\theta=x/(1+x)$.</p>
    <p>Resta da esprimere $z$ nei dati del problema, e qui interviene il gas: per un gas classico la fugacità è $n\lambda^3$, e usando $P=nT$ si ha $z=P\lambda^3/T$. Sostituendo e razionalizzando:</p>
    $$\theta=\frac{P\lambda^3e^{\varepsilon_0/T}/T}{1+P\lambda^3e^{\varepsilon_0/T}/T}=\frac{P}{P+P_0(T)}$$
    <p>con $P_0(T)\equiv\dfrac{T}{\lambda^3}e^{-\varepsilon_0/T}$. Questa è l&rsquo;<b>isoterma di Langmuir</b>: la copertura cresce linearmente con la pressione a basse pressioni e satura a uno ad alte pressioni, e $P_0$ è la pressione di semicopertura. <b>Il criterio invocato</b> è che il vincolo di occupazione unitaria produce una saturazione, mentre un sito a occupazione illimitata darebbe una copertura divergente: la forma stessa dell&rsquo;isoterma misura il vincolo.</p>`},
    {label:'I numeri, e che cosa ci dicono', body:R`
    <p>Con $\varepsilon_0=0{,}5$ eV e $T=300$ K, l&rsquo;esponente vale</p>
    <p style="text-align:center">$\varepsilon_0/T\simeq19{,}334$</p>
    <p>La lunghezza termica per una massa di azoto molecolare è</p>
    <p style="text-align:center">$\lambda\simeq1{,}9047\times10^{-11}$ m</p>
    <p>e mettendo tutto insieme la pressione di semicopertura vale</p>
    <p style="text-align:center">$P_0\simeq2{,}4$ kPa</p>
    <p>cioè circa due centesimi di atmosfera. <b>Che cosa impararne</b>: a pressione atmosferica ($10^5$ Pa) il rapporto $P/P_0$ vale una quarantina, e la copertura è del novantasette per cento — la superficie è satura. Per svuotarla servirebbe scendere sotto il kilopascal, oppure scaldare: $P_0$ dipende dalla temperatura attraverso $e^{-\varepsilon_0/T}$, e <b>l&rsquo;esponenziale di un&rsquo;energia di legame di mezzo elettronvolt è una leva enorme</b> — bastano un paio di centinaia di gradi in più per spostare $P_0$ di ordini di grandezza. È il principio del desorbimento termico, e il motivo per cui le camere da ultra-alto vuoto si cuociono prima di usarle.</p>`}
   ]},
  {t:'esercizio', title:'3 · Il sito che ospita al piu due particelle, e i due limiti',
   src:'il caso intermedio fra i due vincoli di occupazione della tappa 08: serve a verificare che la macchina funzioni anche quando il vincolo non e uno dei due estremi',
   testo:R`Un reticolo ha $M$ siti indipendenti. Ogni sito può contenere $0$, $1$ o $2$ particelle, con energie rispettivamente $0$, $\varepsilon$ e $2\varepsilon+U$, dove $U>0$ è il costo di mettere due particelle sullo stesso sito. Il reticolo è a contatto con un serbatoio a temperatura $T$ e potenziale chimico $\mu$. Calcola l'occupazione media di un sito, e discuti i due limiti $U\to+\infty$ e $U\to0$. Determina inoltre per quale valore di $\mu$ l'occupazione media vale esattamente uno quando $U=0$.`,
   steps:[
    {label:'La gran partizione del sito, con tre termini', body:R`
    <p>Si enumerano i tre stati con il loro peso $e^{-\beta(E-\mu n)}$. Posto $x\equiv e^{-\beta(\varepsilon-\mu)}$ e $w\equiv e^{-\beta U}$, lo stato vuoto pesa $1$, quello a una particella pesa $x$, quello a due pesa $x^2w$ — perché l&rsquo;energia è $2\varepsilon+U$ e il numero di particelle è due, cosicché l&rsquo;esponente è $-\beta(2\varepsilon-2\mu)-\beta U$. Dunque</p>
    $$\mathcal Z_{\rm sito}=1+x+wx^2$$
    <p>e l&rsquo;occupazione media si ottiene come sempre applicando $x\,\partial_x$ al logaritmo:</p>
    $$\langle n\rangle=x\frac{\partial}{\partial x}\log(1+x+wx^2)=\frac{x+2wx^2}{1+x+wx^2}$$
    <p><b>Il criterio invocato</b> è che l&rsquo;operatore $z\,\partial_z$ conta le particelle perché ogni potenza di $x$ porta l&rsquo;esponente giusto: il coefficiente $2$ davanti a $wx^2$ non è stato messo a mano, è uscito dalla derivata di $x^2$.</p>`},
    {label:'I due limiti, e il punto simmetrico', body:R`
    <p><b>Limite $U\to+\infty$</b>, cioè $w\to0$: la doppia occupazione costa troppo e si spegne.</p>
    $$\lim_{w\to0}\frac{x+2wx^2}{1+x+wx^2}=\frac{x}{1+x}$$
    <p>Si ritrova l&rsquo;occupazione a vincolo unitario della tappa 08: <b>un costo infinito di doppia occupazione è indistinguibile da un divieto</b>, ed è la ragione per cui in un metallo con forte repulsione sul sito gli elettroni si comportano come se il vincolo fosse più stretto di quello di Pauli.</p>
    <p><b>Limite $U\to0$</b>, cioè $w\to1$: resta $\langle n\rangle=(x+2x^2)/(1+x+x^2)$, che è la geometrica troncata al secondo termine. Non è né l&rsquo;una né l&rsquo;altra delle due statistiche canoniche: è il caso intermedio, e mostra che <b>la forma della distribuzione dipende dal vincolo di occupazione e non da un principio astratto</b>.</p>
    <p><b>Il punto simmetrico.</b> Chiedendo $\langle n\rangle=1$ con $w=1$ si ottiene $x+2x^2=1+x+x^2$, cioè $x^2=1$, cioè $x=1$ e dunque $\mu=\varepsilon$. Verifica diretta:</p>
    $$\frac{1+2}{1+1+1}=1$$
    <p>Il risultato ha un nome e una ragione: a $\mu=\varepsilon$ il sito è <b>simmetrico per scambio fra particelle e lacune</b> — lo stato vuoto e quello doppio hanno lo stesso peso — e quindi l&rsquo;occupazione media è per forza il valore centrale. <b>Il criterio da riconoscere</b>: quando una gran partizione è un polinomio palindromo in $x$ a meno di una potenza, l&rsquo;occupazione media è metà del massimo, a qualunque temperatura. È lo stesso argomento per cui, a vincolo unitario, $\varepsilon=\mu$ dà esattamente $\frac12$.</p>`}
   ]}
]},

/* ---------------- 11 · IL SENSO E LE ROTTE ---------------- */
{ num:'11', title:'Il senso, e le rotte', meta:'cosa lascia in mano · dove il potenziale chimico riappare in fisica · la domanda che porta avanti',
  blocchi:[
  {t:'prosa', title:'Cosa portarsi via', tag:'sintesi', html:R`
  <p><b>Il punto.</b> Il gran canonico è il canonico applicato una seconda volta, sulla seconda grandezza conservata. Si lascia fluttuare il numero di particelle, si paga con un parametro nuovo — il potenziale chimico — e si incassa che il vincolo $\sum_pn_p=N$ sparisce dalle somme. Tutto il formalismo sta in una funzione, $\mathcal Z=\sum_Nz^NZ(T,V,N)$, e in un potenziale, $\Omega=-T\log\mathcal Z$, che vale $\Omega=-PV$ per il teorema di Eulero applicato all&rsquo;unica variabile estensiva rimasta. Le sue tre derivate danno numero medio, entropia e pressione; la derivata seconda rispetto alla fugacità dà la fluttuazione.</p>
  <p><b>Che cosa ricordare, in ordine di durata.</b> Che l&rsquo;equazione di stato esce dalla <i>normalizzazione</i>, $PV=T\log\mathcal Z$, e non da una derivata. Che $\langle N\rangle=z\,\partial_z\log\mathcal Z$ è l&rsquo;equazione da invertire, perché nei problemi la densità è nota e la fugacità no. Che la fluttuazione relativa vale $\sqrt{T\kappa_T/V}$ e va a zero come $N^{-1/2}$ <b>a patto che la compressibilità resti finita</b> — e che dove non lo resta, cioè in una transizione di fase, gli insiemi cessano di essere equivalenti perché la distribuzione $w(N)$ diventa bimodale e la media smette di essere il valore tipico. Che il potenziale chimico di un gas classico vale $T\log(n\lambda^3/g_s)$, è negativo e grande in modulo, e che la sua positività è il segnale che la formula è uscita dal proprio dominio.</p>
  <p><b>E la formula che paga il conto.</b> Applicando l&rsquo;insieme a un livello solo si ottiene $\langle n_\varepsilon\rangle=\frac{1}{e^{\beta(\varepsilon-\mu)}\mp1}$, con il segno meno se l&rsquo;occupazione è illimitata e il più se è al massimo unitaria, e in entrambi i casi $\langle n\rangle\to e^{-\beta(\varepsilon-\mu)}$ quando le occupazioni sono piccole. <b>Questa è la formula che gli scritti usano senza chiamarla per nome</b>: una sola prova su quarantasette nomina «gran canonico», ma il potenziale chimico ne nomina quindici, e ogni volta che compare un numero di occupazione medio si sta lavorando qui. La strategia d&rsquo;attacco è sempre la stessa — riconoscere le parti indipendenti, scrivere la gran partizione di una parte sola, derivare, fissare $\mu$ dalla somma delle occupazioni, e solo alla fine calcolare energia e calore specifico.</p>
  <p>Una cosa sola, per chiudere, che non è una formula: <b>un potenziale chimico esiste se e solo se esiste una legge di conservazione</b>. I fononi non ne hanno, e la loro occupazione media è la stessa formula con $\mu=0$. La differenza fra una particella e un quanto di eccitazione, in meccanica statistica, è tutta qui.</p>`},
  {t:'prolessi', title:'Dove riappare questo movimento',
   oggetto:R`<b>Il potenziale chimico come variabile di controllo</b>: la grandezza intensiva coniugata a un numero conservato, che si allinea fra sistemi in contatto e che decide, livello per livello, quanto ciascuno stato sia occupato.`,
   rotte:[
    {dove:'Semiconduttori<br>e giunzioni', txt:R`In un solido il potenziale chimico degli elettroni si chiama <b>livello di Fermi</b>, ed è la sola quantità che decide la conduzione: quanti elettroni stiano in banda di conduzione è, letteralmente, l&rsquo;occupazione media calcolata qui, applicata a livelli separati da una lacuna di energia. Mettendo a contatto due pezzi di semiconduttore drogati diversamente, i loro livelli di Fermi devono allinearsi all&rsquo;equilibrio — è la condizione di equilibrio per scambio di particelle — e il prezzo dell&rsquo;allineamento è la <b>curvatura delle bande</b> e il campo di svuotamento della giunzione. Ogni diodo e ogni transistor sono, sotto, questo conto.`},
    {dove:'Elettrochimica<br>e membrane', txt:R`Quando le particelle sono cariche o il solvente può passare mentre il soluto no, la grandezza che si allinea è il <b>potenziale elettrochimico</b>, cioè $\mu$ più il lavoro elettrico per particella. La forza elettromotrice di una pila è una differenza di potenziali chimici fra le due semicelle; la pressione osmotica è il prezzo in pressione che serve a riportare in pari il potenziale chimico del solvente ai due lati di una membrana; e il potenziale di riposo di un neurone è l&rsquo;equilibrio fra un gradiente di concentrazione e uno elettrico, scritto con la stessa uguaglianza.`},
    {dove:'Astrofisica<br>e stelle', txt:R`L&rsquo;equilibrio di ionizzazione in una fotosfera stellare si scrive imponendo che il potenziale chimico dell&rsquo;atomo neutro eguagli la somma di quelli dello ione e dell&rsquo;elettrone — è l&rsquo;<b>equazione di Saha</b>, e da essa si legge la temperatura di una stella dalle righe del suo spettro. Salendo in densità, il potenziale chimico degli elettroni smette di essere negativo e diventa l&rsquo;energia di Fermi: il gas è degenere, la sua pressione non dipende più dalla temperatura, ed è quella pressione che tiene in piedi le nane bianche. <b>La stessa variabile racconta sia perché una stella brilla di un certo colore, sia perché il suo cadavere non collassa.</b>`},
    {dove:'Materia densa<br>e teoria dei campi', txt:R`In teoria quantistica dei campi a temperatura finita il potenziale chimico si associa a ogni carica conservata — numero barionico, stranezza, carica elettrica — e il diagramma di fase della materia forte si disegna nel piano $(T,\mu_B)$: temperatura in ascissa, potenziale chimico barionico in ordinata. Le collisioni fra ioni pesanti esplorano la regione ad alta $T$ e $\mu_B$ piccolo, l&rsquo;interno delle stelle di neutroni la regione opposta, e si congettura che fra le due ci sia un <b>punto critico</b> — dove, per l&rsquo;argomento della tappa 06, le fluttuazioni del numero di particelle diventano macroscopiche. Cercare quel punto significa, sperimentalmente, cercare fluttuazioni anomale nel numero di protoni prodotti.`}
   ],
   domanda:R`Abbiamo trattato $\mu$ come il prezzo di una particella, e abbiamo visto che vale zero quando le particelle non sono conservate. <b>Domanda che porti avanti:</b> ma la conservazione non è quasi mai esatta. I fononi non sono conservati affatto; gli atomi di un gas lo sono su ogni scala di tempo sperimentale; e in mezzo ci sono gli eccitoni in un semiconduttore, che si ricombinano in nanosecondi ma sopravvivono abbastanza a lungo da termalizzare fra loro — tanto che si parla di un loro potenziale chimico, e si arriva a condensarli. Che cosa distingue allora i due casi, se non un confronto fra <i>tempi</i>? La risposta è che il potenziale chimico è ben definito non quando una quantità è conservata in assoluto, ma quando il tempo in cui si conserva è molto più lungo del tempo di termalizzazione: è una nozione di <b>equilibrio parziale</b>, valida in una finestra temporale. Capire fin dove si possa spingere quella finestra — quanto a lungo un sistema possa comportarsi come se avesse una carica conservata che in realtà non ha — è la domanda che sta sotto tutta la fisica dei sistemi fuori equilibrio, e la ragione per cui la stessa formula di occupazione descrive sia un gas di atomi eterni sia un lampo di luce in un laser.`}
]}

];
