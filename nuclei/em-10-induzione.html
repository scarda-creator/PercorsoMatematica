<script>
"use strict";
const R = String.raw;

function typeset(el){
  if(el && window.renderMathInElement){
    try{ renderMathInElement(el,{delimiters:[
      {left:'$$',right:'$$',display:true},
      {left:'$',right:'$',display:false}

function elFromHTML(html){ var d=document.createElement('div'); d.innerHTML=html; return d; }

/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un
   rimando scritto nella prosa:

       <span class="str" data-str="serie-geometrica">la serie geometrica</span>

   Le schede citate da questo nucleo sono cucite qui sotto dal montaggio
   (assembla-nucleo.js): la pagina resta autosufficiente — niente fetch,
   niente sottocartelle da pubblicare — e un rimando a una scheda che non
   esiste FERMA la costruzione invece di arrivare in pagina rotto.
   Apertura: lo stesso gesto del collaudo (si clicca, il pannello compare,
   si typeset una volta sola), portato dentro la frase.
   =================================================================== */
var CORSO = 'elettromagnetismo';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["teorema-di-stokes"] = {"nome":"Teorema di Stokes","riga":"La circuitazione di un campo lungo una curva chiusa è il flusso del suo rotore attraverso una qualunque superficie che quella curva borda: $\\oint_{\\partial S}\\mathbf F\\cdot d\\mathbf r=\\int_S(\\nabla\\times\\mathbf F)\\cdot\\hat n\\,dS$.","serve":"Dice che la circuitazione dipende solo dal bordo e non dalla superficie scelta — ed è la licenza a deformare la superficie a piacere, che in fisica si usa continuamente. Letto nell'altro verso dà il significato del rotore: la circuitazione per unità di area, nel limite di un cappio piccolo. Il verso della normale e quello di percorrenza del bordo vanno legati dalla regola della mano destra, altrimenti il segno è casuale.","esempio":"Per il vortice $\\mathbf F=(-y,x,0)$ il rotore ha solo componente $z$, che vale $\\partial_x(x)-\\partial_y(-y)=2$. Sul disco di raggio $R$ nel piano $xy$ il flusso del rotore è quindi $2$ per l'area, $2\\pi R^{2}$; la circuitazione diretta sul cerchio, dove $\\mathbf F\\cdot d\\mathbf r$ vale $R^{2}\\,dt$, dà $\\int_0^{2\\pi}R^{2}\\,dt=2\\pi R^{2}$.","pieno":{"file":"05-teoremi-integrali.html","tappa":"03","come":"l'enunciato, l'orientazione coerente bordo-normale e l'indipendenza dalla superficie, nel nucleo dei teoremi integrali"},"qui":{"elettromagnetismo":{"serve":"È il ponte fra la forma integrale e la forma locale delle due leggi di circuitazione: Ampère, $\\oint\\mathbf B\\cdot d\\mathbf r=\\mu_0 I$, diventa $\\nabla\\times\\mathbf B=\\mu_0\\mathbf J$; Faraday, $\\oint\\mathbf E\\cdot d\\mathbf r=-\\dfrac{d\\Phi_B}{dt}$, diventa $\\nabla\\times\\mathbf E=-\\partial_t\\mathbf B$. E regge l'affermazione più usata dell'elettrostatica: se il rotore di $\\mathbf E$ è nullo su un dominio senza buchi, ogni circuitazione è nulla e il campo è conservativo.","esempio":"Per il filo rettilineo infinito percorso da una corrente il campo ha modulo $\\dfrac{\\mu_0 I}{2\\pi r}$ ed è tangente ai cerchi concentrici, quindi la circuitazione su un cerchio di raggio $r$ è $\\dfrac{\\mu_0 I}{2\\pi r}\\cdot 2\\pi r=\\mu_0 I$: il raggio scompare. Stokes dice che lo stesso valore si ottiene su qualunque cappio che allacci il filo, anche storto — è il bordo a contare, non la forma."}},"controllo":[{"tipo":"uguale","sinistra":"diff(x,x)-diff(-y,y)","vale":"2","dove":"esempio","appare":"=2"},{"tipo":"integrale","espr":"R**2","var":"t","da":"0","a":"2*pi","vale":"2*pi*R**2","dove":"esempio","appare":"2\\pi R^{2}"},{"tipo":"uguale","sinistra":"mu0*Ic/(2*pi*r)*2*pi*r","vale":"mu0*Ic","dove":"qui.elettromagnetismo.esempio","appare":"\\mu_0 I"}]};

function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';
  return h;
}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

/* ---------------- 00 · DI COSA PARLA QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Di cosa parla questo movimento', meta:'Elettromagnetismo · voce C.3 · 87 prove su 100, densita 5.3 · il movimento che rompe lelettrostatica',
  blocchi:[
  {t:'prosa', title:'Che cosa si rompe, ed e la cosa importante', tag:'architettura', html:R`
  <p>Fino a qui il campo elettrico era <b>conservativo</b>: $\oint\vec E\cdot d\vec\ell=0$, esisteva un potenziale, e le differenze di potenziale erano ben definite. Questo movimento distrugge quella proprietà.</p>
  <p>Faraday scopre che un <b>flusso magnetico variabile</b> produce una corrente in un circuito chiuso, anche senza generatori e senza cariche in moto che la spingano. La forza elettromotrice indotta è
  $$\mathcal E=-\frac{d\Phi_B}{dt},$$
  e poiché una fem è la circuitazione del campo elettrico lungo il circuito:
  $$\oint\vec E\cdot d\vec\ell=-\frac{d\Phi_B}{dt}\neq0.$$
  <b>Il campo elettrico indotto non è conservativo</b>: le sue linee si chiudono su se stesse, non nascono dalle cariche, e <b>non ammette un potenziale</b>. Da qui in poi «differenza di potenziale» va usata con cautela — in un circuito con induzione, il lavoro per portare una carica da A a B <i>dipende dal cammino</i>.</p>
  <p>La misura dice che è il secondo movimento più frequente del corso: <b>87 prove su 100</b>, densità 5.3, e quasi sempre in coppia con em-08.</p>`}
]},

/* ---------------- 01 · LA LEGGE E LENZ ---------------- */
{ num:'01', title:'La legge di Faraday, e il segno meno che vale meta esercizio', meta:'i tre modi di far variare il flusso · la legge di Lenz · perche il segno e obbligato',
  blocchi:[
  {t:'prosa', title:'I tre modi, e il segno', tag:'first principles', html:R`
  <p>Il flusso $\Phi_B=\int\vec B\cdot d\vec S$ può variare in tre modi, e ogni esercizio usa uno di questi o una combinazione:</p>
  <ol>
   <li><b>cambia $\vec B$</b> nel tempo (un elettromagnete alimentato in alternata, una corrente vicina che varia);</li>
   <li><b>cambia l&rsquo;area</b> del circuito (una sbarra che scorre su rotaie, una spira che entra o esce da una regione di campo);</li>
   <li><b>cambia l&rsquo;orientazione</b> (una spira che ruota: è l&rsquo;alternatore).</li>
  </ol>
  <p><b>Il segno meno è la legge di Lenz</b>, e va letto così: <i>la corrente indotta circola nel verso che si oppone alla variazione che l&rsquo;ha prodotta</i>. Se il flusso cresce, la corrente indotta genera un campo che lo contrasta; se cala, uno che lo sostiene.</p>
  <div class="note"><b>Perché il segno non poteva essere diverso, e questo è l&rsquo;argomento da saper ripetere.</b> Se la corrente indotta <i>assecondasse</i> la variazione, la aumenterebbe, producendo più corrente, che aumenterebbe ancora la variazione: una spira avvicinata a un magnete verrebbe risucchiata da sola, accelerando, e produrrebbe energia dal nulla. <b>Lenz è la conservazione dell&rsquo;energia scritta nel verso di una corrente</b>: non è una regola mnemonica, è un obbligo. E infatti il lavoro contro la forza frenante che si sente avvicinando un magnete a un anello conduttore è esattamente l&rsquo;energia dissipata nella corrente indotta.</div>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Una spira conduttrice cade attorno a un magnete fermo. Che cosa sente?`,
    a:R`Una <b>forza frenante</b>, sia mentre si avvicina sia mentre si allontana: in entrambi i casi la corrente indotta si oppone alla variazione, e in entrambi i casi il risultato è opporsi al <i>moto</i>. È il principio del <b>freno a correnti parassite</b> dei treni e delle giostre, e la ragione per cui un magnete lasciato cadere in un tubo di rame scende lentissimo. <b>L&rsquo;energia cinetica che perde finisce in calore</b> nel conduttore: Lenz è un bilancio energetico.`},
   {q:R`Perché non si può definire una «differenza di potenziale» in un circuito con induzione?`,
    a:R`Perché il potenziale esiste solo se $\oint\vec E\cdot d\vec\ell=0$ per ogni cammino, e qui non è zero. La conseguenza pratica è sorprendente: <b>due voltmetri collegati agli stessi due punti, ma con i cavi disposti da parti opposte rispetto alla regione di campo variabile, misurano valori diversi</b>. Non è un guasto dello strumento: il lavoro dipende davvero dal cammino, e ciò che il voltmetro legge dipende da quanto flusso concatena il suo circuito.`}
  ]}
]},

/* ---------------- 02 · LE DUE ORIGINI DELLA FEM ---------------- */
{ num:'02', title:'Le due origini della fem, e perche la stessa formula descrive due fisiche diverse', meta:'la sbarra sulle rotaie (forza di Lorentz) · il campo variabile (E indotto) · lalternatore',
  blocchi:[
  {t:'reveal', title:'Il caso della sbarra: la fem viene da Lorentz', tag:'costruzione', steps:[
   {label:'Il conto', body:R`
   <p>Una sbarra di lunghezza $L$ scorre con velocità $v$ su due rotaie, in un campo $\vec B$ perpendicolare al piano. L&rsquo;area del circuito cresce, quindi
   $$\mathcal E=-\frac{d\Phi_B}{dt}=-B\frac{dA}{dt}=BLv$$
   in modulo. <b>Ma la fem si può ottenere anche senza nominare il flusso</b>: i portatori dentro la sbarra si muovono con lei, e sentono la forza di Lorentz $q\vec v\times\vec B$, diretta lungo la sbarra. Quella forza separa le cariche fino a quando il campo elettrostatico che nasce la bilancia, e la tensione ai capi è $BLv$ — lo stesso numero.</p>`},
   {label:'Perche il fatto che coincidano non e ovvio', body:R`
   <p>Qui il campo magnetico è <b>statico</b>: non c&rsquo;è nessun campo elettrico indotto, il campo $\vec E$ è quello di separazione delle cariche, ed è conservativo. La fem viene interamente dalla <b>forza magnetica sui portatori in moto</b>. Nel caso della spira ferma con $\vec B$ variabile, invece, non c&rsquo;è nessuna carica in moto: la fem viene da un vero <b>campo elettrico indotto</b>, non conservativo.</p>
   <p><b>Due meccanismi fisici completamente diversi, descritti dalla stessa formula.</b> Einstein cita esattamente questa asimmetria nella prima pagina del lavoro del 1905 sulla relatività: il fenomeno osservabile — la corrente — dipende solo dal <i>moto relativo</i> fra magnete e spira, mentre la spiegazione classica è diversa nei due casi. <b>È uno dei punti da cui nasce la relatività</b>, e in em-14 si vedrà che i due meccanismi sono lo stesso visto da due riferimenti.</p>`}
  ]},
  {t:'prosa', title:'La spira rotante: da qui viene la corrente alternata', tag:'regola operativa', html:R`
  <p>Una bobina di $N$ spire e area $A$ ruota con velocità angolare $\omega$ in un campo uniforme $B$. Il flusso è $\Phi=NBA\cos(\omega t)$, quindi
  $$\mathcal E=NBA\omega\sin(\omega t).$$
  <b>Ecco da dove viene la corrente alternata</b>: non è una scelta tecnica, è ciò che una spira rotante produce naturalmente. L&rsquo;ampiezza cresce con $\omega$, ed è il motivo per cui le turbine girano veloci. <b>La fem è massima quando il flusso è nullo</b> — cioè quando la spira è nel piano del campo — e nulla quando il flusso è massimo: è la derivata, e in un esercizio è la domanda a trabocchetto più comune.</p>`}
]},

/* ---------------- 03 · IL CAMPO INDOTTO ---------------- */
{ num:'03', title:'Il campo elettrico indotto: linee chiuse, e niente potenziale', meta:'la forma locale · il solenoide con campo variabile · e il campo E fuori dal solenoide',
  blocchi:[
  {t:'prosa', title:'La forma locale, e un esempio che si calcola', tag:'costruzione', html:R`
  <p>Applicando il <span class="str" data-str="teorema-di-stokes">teorema di Stokes</span> alla circuitazione si ottiene la forma locale, che sarà la terza equazione di Maxwell:
  $$\nabla\times\vec E=-\frac{\partial\vec B}{\partial t}.$$
  <b>Il campo elettrico ha rotore non nullo dove il campo magnetico cambia.</b></p>
  <p><b>L&rsquo;esempio che cade agli esami</b>: un solenoide lungo di raggio $R$ con corrente variabile, quindi $B(t)$ uniforme dentro e nullo fuori. Per simmetria il campo indotto è tangenziale e dipende solo da $r$. Prendendo una circonferenza di raggio $r$:</p>
  <ul>
   <li><b>dentro</b> ($r<R$): $E\cdot2\pi r=\dot B\pi r^{2}$, quindi $E=\dfrac{\dot Br}{2}$ — cresce linearmente;</li>
   <li><b>fuori</b> ($r>R$): il flusso concatenato non cresce più, $E\cdot2\pi r=\dot B\pi R^{2}$, quindi $E=\dfrac{\dot BR^{2}}{2r}$ — decresce come $1/r$.</li>
  </ul>
  <p><b>Fuori dal solenoide il campo magnetico è nullo ma il campo elettrico non lo è.</b> È il fatto controintuitivo di questa tappa: un elettrone che passa a distanza dal solenoide viene accelerato pur non entrando mai in una regione con campo magnetico. <b>È il principio del betatrone</b>, e la versione quantistica di questa stessa osservazione è l&rsquo;effetto Aharonov-Bohm.</p>`},
  {t:'plot', title:'Il campo elettrico indotto dentro e fuori un solenoide',
   intro:R`$E(r)$ indotto da un solenoide di raggio $R$ con $\dot B$ costante, in unità $\dot BR/2$. Da confrontare con la figura del filo spesso in em-08.`,
   plots:[
    {kind:'func2d', xr:[0,4], yr:[0,1.15], height:330,
     title:'lineare dentro, 1/r fuori: fuori B e nullo ma E no',
     xlabel:'r / R', ylabel:'E indotto',
     curves:[{f:'x<1 ? x : 1/x', col:'#b98cff', width:2.6, label:'E(r)'}],
     segs:[{x1:1, y1:0, x2:1, y2:1.1, col:'#ff6b6b', dash:true, width:1.4, label:'R', lx:1.03, ly:1.05},
           {x1:1, y1:0, x2:4, y2:0, col:'#5eead4', width:3.0, label:'qui B = 0', lx:2.4, ly:0.06}],
     marks:[{x:1, y:1, label:'massimo sul bordo', col:'#d8a13a', up:true, left:true},
            {x:2.5, y:0.4, label:'E vivo dove B non ce', col:'#b98cff'}]}
   ],
   leggi:R`<b>La forma della curva è identica a quella del campo magnetico dentro e fuori un filo spesso (em-08)</b>, e non è una somiglianza estetica: in entrambi i casi una sorgente uniforme dentro un cilindro produce un campo tangenziale che cresce come $r$ dentro e cala come $1/r$ fuori. Lì la sorgente era la corrente, qui è $\dot B$ — e la matematica non distingue.<br><br>
   <b>Il punto da portare all&rsquo;esame è la linea verde</b>: fuori dal solenoide il campo magnetico è <i>esattamente zero</i>, eppure il campo elettrico indotto è vivo e decade lentamente. Una carica lasciata lì si mette in moto. Questo dice che «il campo agisce localmente» va preso sul serio: ciò che conta nel punto dove sta la carica è $\vec E$, e $\vec E$ c&rsquo;è — anche se la <i>causa</i> (il campo magnetico che varia) sta altrove.`}
]},

/* ---------------- 04 · AUTOINDUZIONE ED ENERGIA ---------------- */
{ num:'04', title:'Autoinduzione, circuito RL, ed energia nel campo magnetico', meta:'L come coefficiente geometrico · il solenoide · il transitorio RL · u = B^2/2mu0',
  blocchi:[
  {t:'prosa', title:'Il coefficiente di autoinduzione', tag:'costruzione', html:R`
  <p>La corrente di un circuito genera un campo, quindi un flusso <b>attraverso il circuito stesso</b>, proporzionale alla corrente: $\Phi=LI$, con $L$ dipendente solo dalla <b>geometria</b>. Se la corrente varia, il circuito induce una fem su se stesso:
  $$\mathcal E_L=-L\frac{dI}{dt},$$
  e per Lenz questa fem <b>si oppone alla variazione</b>: l&rsquo;induttanza è l&rsquo;inerzia dei circuiti.</p>
  <p>Per un solenoide di $n$ spire per metro, sezione $A$, lunghezza $l$: $B=\mu_0nI$, il flusso concatenato è $(nl)\cdot B A$, quindi
  $$L=\mu_0n^{2}Al=\mu_0n^{2}V.$$
  <b>Dipende dal quadrato di $n$</b>: una volta perché ogni spira produce campo, una seconda perché ogni spira lo concatena. È l&rsquo;errore più comune in questo conto, e il controllo dimensionale non lo intercetta.</p>`},
  {t:'prosa', title:'Il circuito RL, e il confronto con RC', tag:'esame', html:R`
  <p>Con un generatore $V_0$, una resistenza e un&rsquo;induttanza: $V_0=RI+L\dot I$, da cui
  $$I(t)=\frac{V_0}{R}\left(1-e^{-t/\tau}\right),\qquad \tau=\frac{L}{R}.$$
  <b>Il confronto con RC (em-07) è la cosa da avere in testa</b>, perché l&rsquo;esame chiede spesso l&rsquo;uno dopo l&rsquo;altro:</p>
  <ul>
   <li>nel <b>condensatore</b> la grandezza che non salta è la <b>tensione</b> (la carica non può cambiare istantaneamente): appena chiuso l&rsquo;interruttore si comporta come un <b>cortocircuito</b>, a regime come un circuito aperto;</li>
   <li>nell&rsquo;<b>induttanza</b> la grandezza che non salta è la <b>corrente</b>: appena chiuso l&rsquo;interruttore si comporta come un <b>circuito aperto</b> ($I=0$), a regime come un cortocircuito ($V_L=0$).</li>
  </ul>
  <p><b>Sono l&rsquo;uno il rovescio dell&rsquo;altro</b>, e con questa coppia si risolvono a vista tutte le domande «quanto vale la corrente subito dopo la chiusura / molto tempo dopo». La pendenza iniziale è $\dot I(0)=V_0/L$: l&rsquo;induttanza da sola decide quanto rapidamente parte la corrente, la resistenza decide dove si ferma.</p>`},
  {t:'prosa', title:'Lenergia nel campo magnetico', tag:'sintesi', html:R`
  <p>Il lavoro fatto dal generatore contro la fem autoindotta, integrato dal principio, dà
  $$U=\frac12LI^{2},$$
  il gemello magnetico di $\frac12CV^2$. E sostituendo $L=\mu_0n^2V$ e $B=\mu_0nI$ si trova che quell&rsquo;energia è
  $$U=\frac{B^{2}}{2\mu_0}\times\text{volume},\qquad u=\frac{B^{2}}{2\mu_0}.$$
  <b>Di nuovo l&rsquo;energia sta nel campo</b>, come in em-06 — e con la stessa struttura: una costante, il quadrato del campo, diviso due. Nel vuoto la densità totale sarà $u=\frac{\varepsilon_0E^{2}}{2}+\frac{B^{2}}{2\mu_0}$, ed è la forma che comparirà nelle onde (em-12), dove i due termini risultano <b>uguali fra loro</b> istante per istante.</p>`}
]},

/* ---------------- 05 · IL SENSO ---------------- */
{ num:'05', title:'Il senso, e le rotte', meta:'cosa chiude, cosa apre, e da dove nasce la relativita',
  blocchi:[
  {t:'prosa', title:'Cosa lascia in mano', tag:'sintesi', html:R`
  <p><b>A monte.</b> em-08 dava il campo delle correnti e il flusso; qui il flusso diventa una funzione del tempo e produce qualcosa di nuovo. La non esistenza dei monopoli ($\nabla\cdot\vec B=0$) è ciò che rende il flusso concatenato ben definito, e senza quella la legge di Faraday sarebbe ambigua.</p>
  <p><b>Il punto.</b> Il campo elettrico non è più il gradiente di un potenziale. <b>Questa è la rottura che rende possibile l&rsquo;onda elettromagnetica</b>: un campo che si sostiene da solo, senza cariche, con $\vec E$ e $\vec B$ che si generano a vicenda. Manca ancora un pezzo — che un campo elettrico variabile generi campo magnetico — ed è ciò che Maxwell aggiungerà in em-11.</p>
  <p><b>A valle.</b> em-10b tratta questo stesso circuito con generatori sinusoidali e scopre che $L$ diventa un&rsquo;impedenza $i\omega L$; em-11 chiude le quattro equazioni; em-12 le risolve nel vuoto e trova le onde.</p>`},
  {t:'prolessi', title:'Dove riappare questo movimento, nella fisica che farai',
   oggetto:R`<b>L&rsquo;induzione</b>: un campo che cambia nel tempo produce un campo elettrico che non deriva da nessun potenziale.`,
   rotte:[
    {dove:'Relativita', txt:R`L&rsquo;asimmetria fra «magnete fermo e spira in moto» e «spira ferma e magnete in moto» — stesso effetto, due spiegazioni diverse — è l&rsquo;<b>incipit del lavoro di Einstein del 1905</b>. La relatività nasce anche per rimuovere quell&rsquo;asimmetria, e in em-14 i due casi diventano lo stesso fenomeno in due riferimenti.`},
    {dove:'Meccanica<br>quantistica', txt:R`Il campo elettrico fuori dal solenoide ha un analogo quantistico ancora più netto: l&rsquo;<b>effetto Aharonov-Bohm</b>, in cui un elettrone che viaggia in una regione con $\vec B=0$ <i>e</i> $\vec E=0$ risente comunque del flusso racchiuso, attraverso il potenziale vettore. È la prova che $\vec A$ non è solo un artificio di calcolo.`},
    {dove:'Astrofisica<br>e plasmi', txt:R`La <b>dinamo</b>: un fluido conduttore in moto amplifica un campo magnetico per induzione, ed è così che Terra, Sole e galassie mantengono i loro campi. Senza rigenerazione il campo terrestre si spegnerebbe in poche decine di migliaia di anni.`},
    {dove:'Tecnologia', txt:R`Trasformatori, alternatori, motori, freni a correnti parassite, piani a induzione, ricarica wireless, sensori: <b>quasi tutta la tecnologia elettrica</b> è questa legge. La distribuzione dell&rsquo;energia in corrente alternata esiste perché il trasformatore funziona solo con flussi variabili.`}
   ],
   domanda:R`Il campo elettrico indotto esiste anche dove il campo magnetico è nullo, purché il flusso <i>racchiuso</i> stia cambiando. Ma «racchiuso» è una proprietà <b>topologica</b> del cammino, non locale. <b>Domanda che porti avanti:</b> come può un campo che agisce localmente dipendere da qualcosa che è definito globalmente? La risposta apre due strade che poi si incontrano: da un lato il potenziale vettore, che rende tutto di nuovo locale al prezzo di non essere osservabile; dall&rsquo;altro l&rsquo;idea che le grandezze fisiche possano dipendere da <b>classi di omotopia</b> dei cammini — la stessa struttura della polidromia in Metodi, e delle fasi geometriche in quantistica.`}
]}

function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
    else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
    else if(b.t==='prolessi') m.appendChild(sectionProlessi(b));
    else if(b.t==='reveal')m.appendChild(sectionReveal(b.title,b.tag,b.steps));
    else if(b.t==='esercizio') m.appendChild(sectionEsercizio(b));
    else if(b.t==='collaudo')  m.appendChild(sectionCollaudo(b.title,b.items));
    else if(b.t==='plot')      m.appendChild(sectionPlot(b));
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}

/* deep-link: em-10-induzione.html#03 apre direttamente la tappa 03 */
window.addEventListener('DOMContentLoaded', function(){
  var h=(location.hash||'').replace('#','');
  showTappa(byId[h]?h:'00');
});
window.addEventListener('hashchange', function(){
  var h=(location.hash||'').replace('#','');
  if(byId[h]) showTappa(h);
});
</script>
