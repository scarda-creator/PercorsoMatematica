  <p>Landau aggiunge un&rsquo;osservazione di simmetria che vale per tutti: $\boldsymbol\mu$ e $\mathbf s$ sono entrambi vettori assiali, e la proporzionalità è coerente. Un momento di dipolo elettrico proporzionale allo spin sarebbe invece in contraddizione con l&rsquo;inversione spaziale, perché $\mathbf d$ è un vettore polare, e con l&rsquo;inversione temporale, che cambia segno allo spin e non al dipolo. Per questo una particella elementare non può avere un momento di dipolo elettrico permanente se queste simmetrie valgono.</p>`},
  {t:'reveal', title:'Il modello vettoriale e la precessione di Thomas', tag:'Picasso', steps:[
   {label:'Landé come proiezione', body:R`
   <p>In un atomo con spin-orbita, $\mathbf L$ e $\mathbf S$ precedono rapidamente attorno a $\mathbf J$, che in un campo debole precede lentamente attorno a $\mathbf B$. Il momento magnetico $-\mu_{B}(\mathbf L+2\mathbf S)/\hbar$ non è parallelo a $\mathbf J$, e nella media sulla precessione veloce resta solo la sua componente lungo $\mathbf J$. È la versione classica dell&rsquo;argomento con cui Picasso ricava il fattore di Landé: dentro un livello di $J$ fissato $\mathbf S$ si può sostituire con $\frac{\mathbf S\cdot\mathbf J}{J(J+1)\hbar^{2}}\mathbf J$. Con $\mathbf S\cdot\mathbf J=\tfrac12(J^{2}+S^{2}-L^{2})$, la componente di $\mathbf L+2\mathbf S$ lungo $\mathbf J$ dà proprio il fattore $g_{J}$ di Landé.</p>`},
   {label:'Il campo visto dall elettrone', body:R`
   <p>Picasso legge anche l&rsquo;interazione spin-orbita come un effetto magnetico: nel riferimento dell&rsquo;elettrone il nucleo si muove e produce un campo magnetico, che agisce sul momento di spin. Il conto ingenuo dà un coefficiente proporzionale a $g$; quello giusto a $g-1$. <i>«Il termine $g-1$ anziché $g$ nella (16.20) non trova giustificazione nella presente trattazione: esso deriva dal fatto che il moto dell&rsquo;elettrone non è rettilineo uniforme e nel passaggio dai riferimenti di quiete istantanea dell&rsquo;elettrone (&ldquo;riferimenti tangenti&rdquo;) al riferimento di quiete del nucleo lo spin subisce una rotazione, detta precessione di Thomas. Una trattazione corretta, basata sull&rsquo;equazione relativistica di Dirac, fornisce, oltre al valore di $g$ ($=2$), il termine $-1$»</i>. Con $g=2$ il fattore è uno: l&rsquo;interazione è la metà di quella che darebbe il conto ingenuo.</p>`}
  ]}
]},
/* ---------------- 08 · LA HAMILTONIANA DI PAULI ---------------- */
{ num:'08', title:'La hamiltoniana di Pauli, e un modo di non dover aggiungere lo spin a mano', meta:'il termine di spin aggiunto a mano · la stessa formula delle matrici di Pauli con operatori che non commutano · il quadrato di sigma per pi · il fattore due che esce da solo · che cosa le fonti dicono di g uguale a 2 · una hamiltoniana che e un quadrato',
  blocchi:[
  {t:'prosa', title:'La hamiltoniana con lo spin', tag:'Pauli', html:R`
  <p>Per una particella con spin la hamiltoniana è quella della tappa 01 più il termine del momento magnetico intrinseco:</p>
   $$H=\frac{1}{2m}\Big(\mathbf p-\frac qc\mathbf A\Big)^{2}+q\phi-\boldsymbol\mu\cdot\mathbf B,\qquad\boldsymbol\mu=g\,\frac{q}{2mc}\,\mathbf S .$$
  <p>Landau la scrive così, con il termine aggiunto per la ragione già vista; gli appunti delle lezioni di Martinelli e Testa la chiamano equazione di Pauli e notano che, per una particella molto pesante o ferma, <i>«l&rsquo;applicazione di un campo magnetico esterno causerà una precessione dello spin, visto che è l&rsquo;unico termine che rimane»</i>. Weinberg la usa nella forma $-\mu_{e}\,\mathbf s\cdot\mathbf B/(\hbar/2)$ per i livelli di Landau con lo spin. Il valore $g=2$ è, in tutte le fonti, un dato: Picasso e Shankar lo attribuiscono all&rsquo;equazione di Dirac, gli appunti delle lezioni dicono il termine <i>«di natura empirica»</i>.</p>`},
  {t:'reveal', title:'Il quadrato di sigma per pi', tag:'derivazione', steps:[
   {label:'L identità con operatori', body:R`
   <p>Serve una sola identità delle <span class="str" data-str="matrici-di-pauli">matrici di Pauli</span>, $(\boldsymbol\sigma\cdot\mathbf a)(\boldsymbol\sigma\cdot\mathbf b)=\mathbf a\cdot\mathbf b+i\boldsymbol\sigma\cdot(\mathbf a\times\mathbf b)$, valida anche per vettori di operatori che commutano con le $\sigma$, purché si rispetti l&rsquo;ordine. Per una particella libera $(\boldsymbol\sigma\cdot\mathbf p)^{2}=p^{2}$, perché $\mathbf p\times\mathbf p=0$: scrivere l&rsquo;energia cinetica come $(\boldsymbol\sigma\cdot\mathbf p)^{2}/2m$ invece che come $p^{2}/2m$ non cambia niente.</p>`},
   {label:'Con il campo', body:R`
   <p>Ma se si fa la sostituzione minimale dopo, $\mathbf p\to\boldsymbol\pi=\mathbf p-\frac qc\mathbf A$, il prodotto vettoriale di $\boldsymbol\pi$ con sé stesso non è più nullo, perché le sue componenti non commutano: $(\boldsymbol\pi\times\boldsymbol\pi)_{z}=[\pi_{x},\pi_{y}]=\frac{i\hbar q}{c}B_{z}$, lo stesso commutatore delle velocità della tappa 02 moltiplicato per $M^{2}$. Allora</p>
   $$(\boldsymbol\sigma\cdot\boldsymbol\pi)^{2}=\pi^{2}-\frac{\hbar q}{c}\,\boldsymbol\sigma\cdot\mathbf B,$$
   <p>e quindi</p>
   $$\frac{(\boldsymbol\sigma\cdot\boldsymbol\pi)^{2}}{2m}=\frac{\pi^{2}}{2m}-\frac{q}{mc}\,\mathbf S\cdot\mathbf B,$$
   <p>che è la hamiltoniana di Pauli con $\boldsymbol\mu=\frac{q}{mc}\mathbf S$, cioè con $g=2$. Il termine di spin non è stato aggiunto: è uscito dall&rsquo;aver scritto l&rsquo;energia cinetica come un quadrato di matrici prima di accoppiare il campo.</p>`},
   {label:'Che cosa vuol dire, e che cosa no', body:R`
   <p>Il conto non dimostra che $g=2$: dimostra che, fra le due scritture equivalenti dell&rsquo;energia cinetica libera, quella con le $\sigma$ dà $g=2$ dopo l&rsquo;accoppiamento minimale e quella senza dà $g=0$. È l&rsquo;ombra non relativistica del risultato di Dirac, la cui equazione è lineare negli impulsi e contiene proprio $\boldsymbol\sigma\cdot\boldsymbol\pi$. Le fonti lette per questo movimento non fanno questo conto nel capitolo sulle particelle cariche, e non lo si attribuisce a nessuna di esse; il compito del 14-02-2020, risolto nella tappa 11, contiene esattamente questa identità, in una dimensione, sotto la forma: il quadrato dell&rsquo;operatore $Q_{1}$ del testo è la hamiltoniana $H_{0}$.</p>`}
  ]},
  {t:'prosa', title:'Una hamiltoniana che è un quadrato', tag:'conseguenze', html:R`
  <p>Se la hamiltoniana è $(\boldsymbol\sigma\cdot\boldsymbol\pi)^{2}/2m$, è il quadrato di un operatore hermitiano diviso per una costante positiva, e i suoi autovalori sono non negativi: $\langle\psi|H|\psi\rangle$ è la norma al quadrato di $\boldsymbol\sigma\cdot\boldsymbol\pi\,\psi$, divisa per $2m$. In un campo uniforme questo spiega perché, nel ventaglio della tappa 05, il livello più basso con lo spin ha energia esattamente zero: lo stato con $n=0$ e momento magnetico parallelo al campo ha l&rsquo;energia di punto zero del moto orbitale, $\tfrac12\hbar|\omega_{c}|$, compensata esattamente dall&rsquo;energia magnetica dello spin. Weinberg ne fa il conto nella sua (10.3.12), e la quasi degenerazione che osserva, rotta solo dalla correzione $\delta$, è la traccia di questa struttura. Con $g$ leggermente diverso da due il quadrato non è più esatto, e il livello più basso scende di poco sotto lo zero o sale di poco sopra.</p>`}
]},
/* ---------------- 09 · L EFFETTO AHARONOV-BOHM ---------------- */
{ num:'09', title:'L effetto Aharonov-Bohm: un campo che la particella non tocca', meta:'un potenziale che non si annulla fuori dal solenoide · la perlina sull anello di Griffiths · il toro di Ballentine e il guscio di Sakurai · la doppia fenditura con l integrale sui cammini · un quanto di flusso · nessuna deviazione media · il potenziale o il campo',
  blocchi:[
  {t:'prosa', title:'Il potenziale fuori dal solenoide', tag:'Stokes', html:R`
  <p>Un solenoide lunghissimo ha il campo magnetico solo all&rsquo;interno. Fuori il campo è nullo, ma il potenziale vettore no: per il <span class="str" data-str="teorema-di-stokes">teorema di Stokes</span> la sua circuitazione lungo qualunque curva che giri attorno al solenoide è uguale al flusso $\Phi$ che lo attraversa. Con la scelta a simmetria cilindrica, $A_{\varphi}=\Phi/2\pi\rho$ per $\rho$ maggiore del raggio del solenoide: un campo vettoriale con <span class="str" data-str="rotore">rotore</span> nullo e circuitazione $\Phi$. Gli appunti delle lezioni di Martinelli e Testa lo dicono così: poiché l&rsquo;equazione di Schrödinger contiene $\mathbf A$ e non $\mathbf B$, <i>«mi accorgo cioè della presenza del solenoide, nonostante questo non sia accessibile!»</i>. Griffiths: <i>«for a long time it was taken for granted that there could be no electromagnetic influences in regions where $\mathbf E$ and $\mathbf B$ are zero, any more than there can be in the classical theory. But in 1959 Aharonov and Bohm showed that the vector potential can affect the quantum behavior of a charged particle, even when it is moving through a region in which the field itself is zero»</i>.</p>`},
  {t:'reveal', title:'Tre versioni con stati legati', tag:'conti', steps:[
   {label:'La perlina di Griffiths', body:R`
   <p>Griffiths prende la versione più semplice: una particella carica vincolata su un anello di raggio $b$, attraversato lungo l&rsquo;asse da un solenoide di raggio minore. Sull&rsquo;anello la funzione d&rsquo;onda dipende solo dall&rsquo;angolo, la hamiltoniana è $\frac{1}{2m}\big(-\frac{i\hbar}{b}\frac{d}{d\varphi}-\frac{q\Phi}{2\pi b}\big)^{2}$ in unità SI, e le soluzioni sono $e^{in\varphi}$ con $n$ intero, per la continuità. Le energie sono</p>
   $$E_{n}=\frac{\hbar^{2}}{2mb^{2}}\Big(n-\frac{q\Phi}{2\pi\hbar}\Big)^{2},\qquad n=0,\pm1,\pm2,\dots$$
   <p>Senza flusso i livelli con $n$ e $-n$ coincidono; con il flusso la degenerazione si rompe, e i livelli dipendono da un campo che sull&rsquo;anello è nullo.</p>`},
   {label:'Il toro di Ballentine e il guscio di Sakurai', body:R`
   <p>Ballentine fa lo stesso per una particella chiusa in un toro di sezione rettangolare, con il flusso nel buco. Con $A_{\varphi}=\Phi/2\pi\rho$ la funzione d&rsquo;onda si separa come $R(\rho)e^{im\varphi}\sin[j\pi(z+s)/2s]$, e nell&rsquo;equazione radiale il termine centrifugo $m^{2}/\rho^{2}$ diventa $(m-F)^{2}/\rho^{2}$, con $F=\Phi q/2\pi\hbar c$ il flusso in unità naturali: <i>«the energy $E$ of the stationary state clearly must depend on the magnetic flux, even though the Schrödinger equation has been solved in the region $a\lt\rho\lt b$ and the flux is confined to the inaccessible region $\rho\lt a$»</i>. Sakurai propone lo stesso problema con un guscio cilindrico a pareti rigide, e conclude che la sostituzione nella derivata angolare <i>«results in an observable change in the energy spectrum [...] This is quite remarkable because the particle never &ldquo;touches&rdquo; the magnetic field»</i>.</p>`},
   {label:'Periodico nel flusso', body:R`
   <p>Nelle tre versioni lo spettro, come insieme, è periodico nel flusso: aggiungendo $\Phi_{0}=2\pi\hbar c/q$ (in unità SI $h/q$) il livello $n$ prende il posto del livello $n-1$. Un flusso pari a un multiplo intero di $\Phi_{0}$ non si vede.</p>`}
  ]},
  {t:'plot', title:'I livelli della perlina in funzione del flusso',
   intro:R`<p>Energie $E_{n}$ della perlina sull&rsquo;anello, in unità $\hbar^{2}/2mb^{2}$, in funzione del flusso in unità del quanto $\Phi_{0}=h/q$: $n=-2$ (viola), $-1$ (verde), $0$ (blu), $1$ (arancio), $2$ (grigio).</p>`,
   plots:[{kind:'func2d', xr:[-1.5,2.5], yr:[0,6], height:270, ticks:true,
     title:'Aharonov-Bohm legato: parabole spostate',
     curves:[{f:'(x+2)*(x+2)', col:'#c49bff', width:2.0, label:'n = -2'},
             {f:'(x+1)*(x+1)', col:'#6bdc9b', width:2.0, label:'n = -1'},
             {f:'x*x', col:'#5aa9ff', width:2.4, label:'n = 0'},
             {f:'(x-1)*(x-1)', col:'#ffb86b', width:2.0, label:'n = 1'},
             {f:'(x-2)*(x-2)', col:'#999999', width:2.0, label:'n = 2'}],
     xlabel:'Phi / Phi_0', ylabel:'E / (hbar^2 / 2 m b^2)'}],
   leggi:R`<p><b>Che cosa guardare.</b> A flusso nullo i livelli $n$ e $-n$ coincidono; a flusso $\tfrac12\Phi_{0}$ si incrociano $n=0$ e $n=1$, e lo stato fondamentale passa dall&rsquo;uno all&rsquo;altro. A flusso $\Phi_{0}$ la figura è identica a quella di partenza, con le etichette spostate di uno.</p>
   <p><b>Che cosa impararne.</b> L&rsquo;energia dello stato fondamentale è una funzione periodica del flusso con periodo $\Phi_{0}$: la particella sente il flusso modulo un quanto, e un solenoide con un numero intero di quanti è per lei invisibile.</p>`},
  {t:'reveal', title:'La doppia fenditura', tag:'integrale sui cammini', steps:[
   {label:'Sakurai e Shankar: una fase per famiglia di cammini', body:R`
   <p>Nella versione originale gli elettroni passano da una parte o dall&rsquo;altra di un solenoide schermato e interferiscono. Sakurai e Shankar usano l&rsquo;integrale sui cammini: con il potenziale vettore l&rsquo;azione di ogni cammino cambia di $\frac ec\int\mathbf A\cdot d\mathbf s$, e poiché fuori dal solenoide $\nabla\times\mathbf A=0$ l&rsquo;integrale dipende solo dagli estremi e dal lato del solenoide da cui il cammino passa. Tutti i cammini sopra acquistano una fase comune, tutti quelli sotto un&rsquo;altra, e la differenza è la circuitazione: $(e/\hbar c)\Phi_{B}$. L&rsquo;intensità nella regione di interferenza oscilla con il flusso con periodo <i>«a fundamental unit of magnetic flux, namely, $2\pi\hbar c/|e|=4.135\times10^{-7}$ gauss-cm$^{2}$»</i>, cioè $h/e$, circa $4{,}14\cdot10^{-15}$ weber in unità SI.</p>
   <p>Shankar aggiunge un&rsquo;immagine: la particella classica, che segue uno dei due cammini, può misurare solo $\nabla\times\mathbf A$ localmente, e lo trova nullo; la particella quantistica <i>«&ldquo;goes along $P_{1}$ and $P_{2}$&rdquo; (in the path integral sense) and by piecing together what happens along $P_{1}$ and $P_{2}$ [...] it can deduce not only the existence of $\mathbf B$, but also the total flux»</i>. In nota il paragone con l&rsquo;analisi complessa: è come dedurre l&rsquo;esistenza di un polo e il suo <span class="str" data-str="residuo">residuo</span> da un integrale lungo un cammino che gli gira attorno senza toccarlo.</p>`},
   {label:'Ballentine: nessuna deviazione media', body:R`
   <p>Ballentine aggiunge due osservazioni che le altre fonti non fanno. La prima: la forza di Lorentz media sulla particella è nulla, perché la funzione d&rsquo;onda è zero dove il campo è diverso da zero e viceversa; <i>«the positions of the fringes within the diffraction pattern shift systematically as the flux $\Phi$ is varied, but their intensities change simultaneously, so that the centroid of the diffraction pattern does not move»</i>. La seconda: il flusso magnetico non è quantizzato, e se lo fosse in multipli di $\Phi_{0}$ l&rsquo;effetto non si vedrebbe; la «quantizzazione del flusso» dei superconduttori è in multipli di $\pi\hbar c/e$, la metà, <i>«because current is carried by correlated pairs of electrons, whose charge is $q=2e$»</i>, ed è una proprietà dello stato superconduttore, non del campo. Infine l&rsquo;effetto è proporzionale alla carica: <i>«it has been experimentally confirmed that no AB effect occurs if neutrons are used instead of electrons»</i>, e il suo duale, l&rsquo;effetto Aharonov-Casher, è lo sfasamento fra due fasci di dipoli magnetici che girano attorno a una linea carica.</p>`}
  ]},
  {t:'plot', title:'Le frange spostate dal flusso',
   intro:R`<p>Intensità al centro dello schermo di una doppia fenditura simmetrica, in funzione del flusso in unità di $\Phi_{0}=h/e$ (blu), e la stessa intensità con un quarto di quanto in più (arancio), in funzione della posizione sullo schermo in unità della distanza fra le frange.</p>`,
   plots:[{kind:'func2d', xr:[0,3], yr:[0,1.05], height:240, ticks:true,
     title:'intensita contro il flusso',
     curves:[{f:'Math.pow(Math.cos(Math.PI*x),2)', col:'#5aa9ff', width:2.4, label:'centro dello schermo, contro Phi/Phi_0'},
             {f:'Math.pow(Math.cos(Math.PI*(x-0.25)),2)', col:'#ffb86b', width:2.0, label:'frange con Phi = Phi_0/4, contro la posizione'}],
     xlabel:'Phi / Phi_0  (blu)  ·  posizione / passo delle frange  (arancio)', ylabel:'intensita'}],
   leggi:R`<p><b>Che cosa guardare.</b> Al centro dello schermo l&rsquo;intensità torna uguale ogni volta che il flusso aumenta di un quanto, e si annulla a mezzo quanto. Con un flusso fisso le frange si spostano rigidamente: un quarto di quanto le sposta di un quarto di passo.</p>
   <p><b>Che cosa impararne.</b> Il flusso agisce come uno sfasatore fra i due cammini, esattamente come la differenza di potenziale nelle gabbie della tappa 03: in entrambi i casi nessuna forza agisce dove passa la particella.</p>`},
  {t:'prosa', title:'Il potenziale o il campo?', tag:'interpretazione', html:R`
  <p>Le fonti non rispondono allo stesso modo. Sakurai registra la tentazione e la frena: <i>«this point has led some people to conclude that in quantum mechanics it is $\mathbf A$ rather than $\mathbf B$ that is fundamental. It is to be noted, however, that the observable effects in both examples depend only on $\Phi_{B}$, which is directly expressible in terms of $\mathbf B$»</i>. Ballentine mette le due posizioni sullo stesso piano: <i>«if we adhere to the classical view that only the electric and magnetic fields are physically significant, then we must admit that in quantum mechanics they can have a nonlocal influence [...] Alternatively, we may grant that the potentials themselves are physically significant; however, they are subject to the requirement that all observable effects be invariant under gauge transformations. Both points of view are logically tenable»</i>, e preferisce la seconda. Shankar trova un equilibrio: <i>«although the particle responds to $\mathbf A$ and not directly to $\mathbf B$, the response is gauge invariant»</i>. Ballentine aggiunge che è un effetto topologico: dipende dal flusso racchiuso dai cammini disponibili, non dalla loro distanza dal flusso.</p>
  <p>Le date: Sakurai e Griffiths ricordano che lo stesso effetto era stato discusso dieci anni prima da Ehrenberg e Siday, nel 1949; Shankar cita l&rsquo;esperimento di Chambers del 1960, Sakurai quelli di Tonomura e collaboratori con un filamento di ferro magnetizzato.</p>`}
]},
/* ---------------- 10 · IL MONOPOLO ---------------- */
{ num:'10', title:'Il monopolo di Dirac: se esiste una carica magnetica, la carica elettrica è quantizzata', meta:'un campo radiale da un potenziale vettore · la linea singolare · nessun potenziale regolare ovunque · due potenziali e una trasformazione di gauge fra loro · la condizione di univocita · la piu piccola carica magnetica',
  blocchi:[
  {t:'reveal', title:'Il conto di Sakurai', tag:'Sakurai', steps:[
   {label:'Un potenziale per il campo radiale', body:R`
   <p>Sakurai chiude il suo paragrafo sulla gauge con <i>«one of the most remarkable predictions of quantum physics, which has yet to be verified experimentally»</i>. Un monopolo magnetico di carica $e_{M}$ nell&rsquo;origine avrebbe il campo $\mathbf B=e_{M}\hat{\mathbf r}/r^{2}$. Il potenziale $\mathbf A=\frac{e_{M}(1-\cos\theta)}{r\sin\theta}\hat{\boldsymbol\phi}$ lo produce: con il rotore in coordinate sferiche la componente radiale è $\frac{1}{r\sin\theta}\partial_{\theta}(A_{\phi}\sin\theta)=e_{M}/r^{2}$. Ma è singolare sul semiasse negativo, $\theta=\pi$.</p>`},
   {label:'Nessun potenziale regolare', body:R`
   <p>Non si può fare di meglio. Il flusso di $\mathbf B$ attraverso una superficie chiusa che racchiude il monopolo è $4\pi e_{M}$; se $\mathbf A$ fosse regolare dappertutto, quel flusso sarebbe l&rsquo;integrale di $\nabla\cdot(\nabla\times\mathbf A)$ sul volume interno, cioè zero. Sakurai propone allora due potenziali, $\mathbf A^{(I)}$ come sopra, valido fuori da un cono attorno al semiasse negativo, e $\mathbf A^{(II)}=-\frac{e_{M}(1+\cos\theta)}{r\sin\theta}\hat{\boldsymbol\phi}$, valido fuori da un cono attorno al semiasse positivo. Nella regione dove valgono entrambi danno lo stesso campo, e la loro differenza, $-\frac{2e_{M}}{r\sin\theta}\hat{\boldsymbol\phi}$, è il gradiente di $\Lambda=-2e_{M}\phi$: sono legati da una trasformazione di gauge.</p>`},
   {label:'La condizione', body:R`
   <p>Le funzioni d&rsquo;onda nelle due gauge, per una particella di carica $e$, sono legate da $\psi^{(II)}=\exp(-2iee_{M}\phi/\hbar c)\,\psi^{(I)}$. Entrambe devono essere a un sol valore, perché <i>«the wave function is simply an expansion coefficient for the state ket in terms of the position eigenkets»</i>. Facendo un giro completo sull&rsquo;equatore, il fattore deve tornare a uno:</p>
   $$\frac{2ee_{M}}{\hbar c}=\pm N,\qquad N=0,\pm1,\pm2,\dots$$
   <p><i>«So we arrive at a very far-reaching conclusion: the magnetic charges must be quantized in units of»</i> $\hbar c/2|e|$, che con $\alpha=e^{2}/\hbar c$ vale $|e|/2\alpha$, circa $68{,}5\,|e|$.</p>`}
  ]},
  {t:'prosa', title:'Che cosa dice, e che cosa no', tag:'interpretazione', html:R`
  <p>Sakurai è attento a non dire troppo: <i>«quantum mechanics does not predict that a magnetic monopole must exist. However, it unambiguously requires that if a magnetic monopole is ever found in nature, the magnitude of magnetic charge must be quantized»</i>. E la condizione si legge anche al contrario: <i>«it is amusing that once a magnetic monopole is assumed to exist, we can use (2.7.85) backward, so to speak, to explain why the electric charges are quantized, for example, why the proton charge cannot be 0.999972 times $|e|$»</i>; in nota, l&rsquo;uguaglianza fra le cariche di elettrone e protone è verificata a quattro parti su $10^{19}$. La condizione è di Dirac, del 1931; la derivazione con due potenziali è di Wu e Yang.</p>
  <p>Il conto è parente stretto dell&rsquo;effetto Aharonov-Bohm. Lì un flusso pari a un quanto è invisibile; qui il flusso totale del monopolo, $4\pi e_{M}$, deve essere un multiplo intero del quanto $2\pi\hbar c/e$ perché la linea singolare, il «filo di Dirac» che Sakurai menziona in nota, sia invisibile a ogni particella carica. Nei due casi la richiesta è la stessa: che la fase acquistata su un giro chiuso non si possa osservare, o che sia un multiplo di $2\pi$.</p>`}
]},
/* ---------------- 11 · COMPITO DEL 14-02-2020 ---------------- */
{ num:'11', title:'Un compito: la particella carica con spin su una retta in un campo (14-02-2020)', meta:'esame del 14 febbraio 2020 esercizio 1 · un oscillatore piu uno spin · lo spettro N per hbar omega e le degenerazioni · due operatori il cui quadrato e la hamiltoniana · la scrittura con gli operatori di salita e discesa · un campo non uniforme · una correzione al primo ordine che vale zero, e perche',
  blocchi:[
  {t:'prosa', title:'Il testo', tag:'esame', html:R`
  <p><i>«Una particella di carica $e$, massa $m$ e spin 1/2, vincolata a muoversi lungo l&rsquo;asse $x$, è immersa in un campo magnetico di intensità $B$ con potenziale vettore $\mathbf A=(0,Bx,0)$, $B\gt0$»</i>. La hamiltoniana, in unità di Gauss, è $H_{0}=H_{em}+\frac{|e|}{mc}\mathbf S\cdot\mathbf B$, dove $H_{em}$ è quella della particella libera nel campo ristretta all&rsquo;asse $x$, cioè con $p_{y}=p_{z}=0$. Le domande: (a) spettro e degenerazioni; (b) mostrare che $Q_{1}=\frac{1}{\sqrt{2m}}(p_{x}\sigma_{1}+m\omega x\sigma_{2})$ e $Q_{2}=\frac{1}{\sqrt{2m}}(p_{x}\sigma_{2}-m\omega x\sigma_{1})$, con $\omega=|e|B/mc$, sono hermitiani e hanno entrambi quadrato $H_{0}$, e spiegare perché allora gli autovalori di $H_{0}$ non sono negativi; (c) scrivere tutto con gli operatori di salita e discesa, calcolare l&rsquo;anticommutatore di $Q_{1}$ e $Q_{2}$ e i commutatori con $H_{0}$; (d) il campo prodotto da $\mathbf A=(0,B(x-\lambda x^{3}),0)$ e la perturbazione $V$ al primo ordine in $\lambda$; (e) la correzione al fondamentale.</p>`},
  {t:'reveal', title:'(a) Lo spettro', tag:'soluzione', steps:[
   {label:'Un oscillatore', body:R`
   <p>Con $\mathbf A=(0,Bx,0)$ e $p_{y}=0$ il termine $(p_{y}-\frac ecA_{y})^{2}$ diventa $\frac{e^{2}B^{2}}{c^{2}}x^{2}$, e la parte orbitale è un oscillatore armonico: $\frac{p_{x}^{2}}{2m}+\frac12m\omega^{2}x^{2}$ con $\omega=|e|B/mc$, la frequenza di ciclotrone. Il campo è $\nabla\times\mathbf A=(0,0,B)$, e il termine di spin è $\frac{|e|B}{mc}S_{z}=\omega S_{z}$. Quindi</p>
   $$H_{0}=\frac{p_{x}^{2}}{2m}+\frac12m\omega^{2}x^{2}+\omega S_{z},\qquad E=\hbar\omega\Big(n+\frac12\Big)\pm\frac12\hbar\omega .$$`},
   {label:'Le degenerazioni', body:R`
   <p>Le energie sono multipli interi di $\hbar\omega$: $E_{N}=N\hbar\omega$. Il livello $N=0$ ha un solo stato, $n=0$ con lo spin giù; ogni livello $N\ge1$ ne ha due, $n=N$ con lo spin giù e $n=N-1$ con lo spin su. È la quasi degenerazione dei livelli di Landau con $g=2$ che Weinberg e Landau notano, qui su una retta e senza la degenerazione dovuta al centro dell&rsquo;orbita, perché il moto lungo $y$ è stato tolto.</p>`}
  ]},
  {t:'reveal', title:'(b) e (c) Due radici quadrate della hamiltoniana', tag:'soluzione', steps:[
   {label:'Il quadrato', body:R`
   <p>Gli operatori sono hermitiani perché $p_{x}$ e $x$ lo sono, le $\sigma_{i}$ lo sono, e operatori orbitali e di spin commutano. Il quadrato di $Q_{1}$: i termini diagonali danno $\frac{1}{2m}(p_{x}^{2}+m^{2}\omega^{2}x^{2})$, quelli misti $\frac{\omega}{2}(p_{x}x\,\sigma_{1}\sigma_{2}+x\,p_{x}\sigma_{2}\sigma_{1})=\frac{\omega}{2}[p_{x},x]\,i\sigma_{3}=\frac{\hbar\omega}{2}\sigma_{3}$. Quindi il quadrato di $Q_{1}$ è esattamente $H_{0}$, e lo stesso vale per $Q_{2}$. Il testo chiede il calcolo dettagliato; la verifica qui è stata fatta applicando gli operatori a uno spinore generico di due funzioni.</p>
   <p>Perché gli autovalori non sono negativi: per ogni stato, $\langle\psi|H_{0}|\psi\rangle=\langle\psi|Q_{1}^{\dagger}Q_{1}|\psi\rangle=\|Q_{1}\psi\|^{2}\ge0$. Su un autostato di $H_{0}$ questo è l&rsquo;autovalore.</p>`},
   {label:'Gli operatori di salita e discesa', body:R`
   <p>Con $a=(m\omega x+ip_{x})/\sqrt{2m\hbar\omega}$ e $\sigma_{\pm}=\tfrac12(\sigma_{1}\pm i\sigma_{2})$ si ha $H_{0}=\hbar\omega(a^{\dagger}a+\tfrac12)+\tfrac12\hbar\omega\sigma_{3}$ e</p>
   $$Q_{1}=i\sqrt{\hbar\omega}\,\big(a^{\dagger}\sigma_{-}-a\,\sigma_{+}\big),\qquad Q_{2}=-\sqrt{\hbar\omega}\,\big(a^{\dagger}\sigma_{-}+a\,\sigma_{+}\big).$$
   <p>$Q_{1}$ e $Q_{2}$ scambiano gli stati $|n,\uparrow\rangle$ e $|n+1,\downarrow\rangle$, che hanno la stessa energia, e annullano $|0,\downarrow\rangle$: è il meccanismo della degenerazione. L&rsquo;anticommutatore è nullo, $\{Q_{1},Q_{2}\}=0$, e i commutatori $[Q_{i},H_{0}]$ sono nulli perché $H_{0}$ è il quadrato di ciascuno dei due: un operatore commuta con il proprio quadrato. In un linguaggio che il testo non usa, $Q_{1}$ e $Q_{2}$ sono le cariche di una supersimmetria, e $H_{0}$ è la loro hamiltoniana comune.</p>`}
  ]},
  {t:'reveal', title:'(d) e (e) Un campo non uniforme', tag:'soluzione', steps:[
   {label:'Il campo e la perturbazione', body:R`
   <p>Il nuovo potenziale dà il campo $B_{z}=\partial_{x}A_{y}=B(1-3\lambda x^{2})$, non più uniforme. La hamiltoniana diventa $\frac{p_{x}^{2}}{2m}+\frac{e^{2}B^{2}}{2mc^{2}}(x-\lambda x^{3})^{2}+\omega(1-3\lambda x^{2})S_{z}$, e al primo ordine in $\lambda$</p>
   $$V=-m\omega^{2}x^{4}-3\omega x^{2}S_{z}.$$`},
   {label:'La correzione al fondamentale', body:R`
   <p>Il fondamentale è $|0,\downarrow\rangle$, non degenere, con $S_{z}=-\hbar/2$. Con gli integrali gaussiani forniti dal testo, $\langle x^{2}\rangle=\hbar/2m\omega$ e $\langle x^{4}\rangle=3\hbar^{2}/4m^{2}\omega^{2}$, e</p>
   $$\Delta E=\lambda\Big[-m\omega^{2}\frac{3\hbar^{2}}{4m^{2}\omega^{2}}+3\omega\frac{\hbar}{2m\omega}\frac{\hbar}{2}\Big]=0 .$$
   <p>I due contributi, quello orbitale che abbassa e quello di spin che alza, si cancellano esattamente.</p>`},
   {label:'Perché fa zero', body:R`
   <p>Non è una coincidenza. La costruzione del punto (b) funziona per qualunque funzione $W(x)$ al posto di $m\omega x$: il quadrato di $\frac{1}{\sqrt{2m}}(p_{x}\sigma_{1}+W\sigma_{2})$ è $\frac{1}{2m}(p_{x}^{2}+W^{2})+\frac{\hbar}{2m}W'\sigma_{3}$. Con $W=m\omega(x-\lambda x^{3})$ è esattamente la nuova hamiltoniana, perché il campo non uniforme $B(1-3\lambda x^{2})$ è proprio la derivata del potenziale $B(x-\lambda x^{3})$. Quindi anche la hamiltoniana perturbata è un quadrato, non ha autovalori negativi, e questo vale per $\lambda$ positivo e negativo. Se la correzione al primo ordine fosse $\lambda E_{1}$ con $E_{1}\ne0$, per uno dei due segni di $\lambda$ il fondamentale scenderebbe sotto zero: quindi $E_{1}=0$. Il conto e l&rsquo;argomento dicono la stessa cosa da due lati.</p>`}
  ]},
  {t:'plot', title:'Il potenziale perturbato',
   intro:R`<p>Il potenziale orbitale $\tfrac12m\omega^{2}(x-\lambda x^{3})^{2}$ in unità $\hbar\omega$, con $x$ in unità della lunghezza $\sqrt{\hbar/m\omega}$, per $\lambda=0$ (blu) e $\lambda=0{,}05$ (arancio), e il campo relativo $1-3\lambda x^{2}$ (verde).</p>`,
   plots:[{kind:'func2d', xr:[-6,6], yr:[-2,6], height:260, ticks:true,
     title:'compito 14-02-2020: potenziale e campo',
     curves:[{f:'x*x/2', col:'#5aa9ff', width:2.2, label:'lambda = 0'},
             {f:'Math.pow(x-0.05*x*x*x,2)/2', col:'#ffb86b', width:2.4, label:'lambda = 0,05'},
             {f:'1-0.15*x*x', col:'#6bdc9b', width:2.0, label:'B(x) / B'}],
     xlabel:'x / sqrt(hbar / m omega)', ylabel:''}],
   leggi:R`<p><b>Che cosa guardare.</b> Vicino all&rsquo;origine le due curve del potenziale coincidono; lontano, quella con $\lambda$ si appiattisce, torna a zero a $x=\pm1/\sqrt\lambda\approx\pm4{,}47$ e poi risale. Il campo, verde, si annulla prima, a $x=\pm1/\sqrt{3\lambda}\approx\pm2{,}58$, e cambia segno.</p>
   <p><b>Che cosa impararne.</b> La teoria delle perturbazioni descrive lo stato concentrato attorno all&rsquo;origine, largo circa un&rsquo;unità, dove la perturbazione è piccola; le regioni lontane, dove il potenziale ha altri minimi, non entrano nel conto al primo ordine. È la condizione che il testo esprime chiedendo $\lambda$ molto piccolo.</p>`}
]},
/* ---------------- 12 · COMPITO DEL 15-02-2016 ---------------- */
{ num:'12', title:'Un compito: l idrogeno con il termine magnetico Lz piu 2Sz (15-02-2016)', meta:'esame del 15 febbraio 2016 · la hamiltoniana di Paschen e Back · che cosa commuta con J quadro e con J · misure di J quadro e di Jz su uno stato prodotto · un valor medio che oscilla con il campo · una rotazione sul fondamentale · l impulso quadro dal teorema del viriale',
  blocchi:[
  {t:'prosa', title:'Il testo', tag:'esame', html:R`
  <p><i>«Una particella di massa $m$, carica $q$ e spin 1/2 è vincolata a muoversi in tre dimensioni soggetta alla hamiltoniana seguente: $H=\frac{p^{2}}{2m}-\frac{e^{2}}{r}+\alpha\frac{L_{z}+2S_{z}}{\hbar}$, con $0\lt\alpha\ll E_{I}$»</i>, $E_{I}=me^{4}/2\hbar^{2}$. È l&rsquo;atomo di idrogeno in un campo magnetico lungo $z$ con $g=2$, senza il termine quadratico e senza la spin-orbita: il caso di campo forte di Picasso, con $\alpha=\mu_{B}B$. Le domande: (1) i commutatori $[H,J^{2}]$ e $[H,\mathbf J]$; (2) sullo stato $\frac{1}{\sqrt2}(|2,1,-1\rangle+i|2,1,1\rangle)\chi$, con $\chi$ autostato di $S_{x}$ con autovalore $+\hbar/2$, i risultati possibili delle misure di $J^{2}$ e $J_{z}$ con le probabilità, e $l(t)=\langle\psi,t|L_{x}^{2}|\psi,t\rangle$; (3) il valor medio di $e^{-i\pi J_{x}/4\hbar}$ sul fondamentale e quello di $p^{2}$.</p>`},
  {t:'reveal', title:'(1) I commutatori', tag:'soluzione', steps:[
   {label:'Con J quadro', body:R`
   <p>La parte coulombiana è invariante per rotazioni e commuta con $\mathbf J$. Il termine magnetico si scrive $\frac\alpha\hbar(J_{z}+S_{z})$; $J_{z}$ commuta con $J^{2}$, $S_{z}$ no. Con $J^{2}=L^{2}+S^{2}+2\mathbf L\cdot\mathbf S$ e i commutatori dello spin,</p>
   $$[H,J^{2}]=\frac\alpha\hbar[S_{z},2\mathbf L\cdot\mathbf S]=2i\alpha\,(L_{x}S_{y}-L_{y}S_{x}).$$
   <p>Il campo, accoppiandosi in modo diverso a $\mathbf L$ e a $\mathbf S$, rompe la conservazione del momento angolare totale: è la ragione per cui in campo forte i buoni numeri quantici sono $m_{l}$ e $m_{s}$, non $j$.</p>`},
   {label:'Con J', body:R`
   <p>Per le componenti: $[H,J_{z}]=0$, perché il campo è lungo $z$ e le rotazioni attorno a $z$ restano una simmetria; mentre $[H,J_{x}]=\frac\alpha\hbar[L_{z}+2S_{z},L_{x}+S_{x}]=i\alpha(L_{y}+2S_{y})$, e analogamente per $J_{y}$. La verifica è stata fatta con le matrici di $l=1$ e spin un mezzo, nello spazio di dimensione sei.</p>`}
  ]},
  {t:'reveal', title:'(2) Le misure e il valor medio', tag:'soluzione', steps:[
   {label:'J z', body:R`
   <p>Lo stato è un prodotto: una parte orbitale con $m_{l}=\pm1$, probabilità un mezzo ciascuno, e uno spin lungo $x$, con $m_{s}=\pm\tfrac12$, probabilità un mezzo ciascuno. I valori di $J_{z}=m_{l}+m_{s}$ sono $\pm\tfrac32\hbar$ e $\pm\tfrac12\hbar$, ciascuno con probabilità $\tfrac14$.</p>`},
   {label:'J quadro', body:R`
   <p>Con $l=1$ e $s=\tfrac12$, $j$ vale $\tfrac32$ o $\tfrac12$. Il proiettore sul sottospazio $j=\tfrac32$ si scrive senza tavole come $(J^{2}-\tfrac34\hbar^{2})/3\hbar^{2}$, perché vale uno su $j=\tfrac32$ e zero su $j=\tfrac12$. Il suo valor medio sullo stato dà</p>
   $$P\big(J^{2}=\tfrac{15}{4}\hbar^{2}\big)=\frac23,\qquad P\big(J^{2}=\tfrac34\hbar^{2}\big)=\frac13 .$$`},
   {label:'Il valor medio di Lx quadro', body:R`
   <p>Ogni componente $|m_{l},m_{s}\rangle$ evolve con la fase $e^{-iE_{2}t/\hbar}e^{-i\alpha(m_{l}+2m_{s})t/\hbar}$. L&rsquo;operatore $L_{x}^{2}$ agisce solo sulla parte orbitale e lega $m_{l}=1$ a $m_{l}=-1$; la parte di spin dà lo stesso contributo per i due valori di $m_{s}$. La fase relativa fra le componenti con $m_{l}=\pm1$ è $e^{2i\alpha t/\hbar}$, e il risultato è</p>
   $$l(t)=\frac{\hbar^{2}}{2}\Big(1+\sin\frac{2\alpha t}{\hbar}\Big).$$
   <p>Oscilla alla frequenza $2\alpha/\hbar$, il doppio della frequenza di Larmor orbitale: la distribuzione del momento angolare nel piano $xy$ ruota attorno a $z$, e $L_{x}^{2}$, che è invariante per rotazioni di $\pi$, ritorna dopo mezzo giro.</p>`}
  ]},
  {t:'plot', title:'Il valor medio di Lx quadro nel tempo',
   intro:R`<p>$l(t)/\hbar^{2}$ in funzione di $\alpha t/\hbar$ (blu), con i valori estremi $0$ e $1$ (grigio).</p>`,
   plots:[{kind:'func2d', xr:[0,7], yr:[-0.1,1.2], height:230, ticks:true,
     title:'compito 15-02-2016: l(t)',
     curves:[{f:'(1+Math.sin(2*x))/2', col:'#5aa9ff', width:2.4, label:'l(t) / hbar^2'},
             {f:'1+0*x', col:'#999999', width:1.0, label:'massimo'},
             {f:'0*x', col:'#999999', width:1.0, label:'minimo'}],
     xlabel:'alpha t / hbar', ylabel:''}],
   leggi:R`<p><b>Che cosa guardare.</b> Al tempo zero il valore è $\tfrac12\hbar^{2}$; il massimo, $\hbar^{2}$, arriva a $\alpha t/\hbar=\pi/4$, il minimo, zero, a $3\pi/4$. Il periodo è $\pi\hbar/\alpha$.</p>
   <p><b>Che cosa impararne.</b> Un valore di $L_{x}^{2}$ nullo vuol dire che lo stato orbitale è, in quell&rsquo;istante, l&rsquo;autostato $m_{x}=0$ di $L_{x}$: la precessione attorno al campo porta lo stato a ruotare fra orientazioni diverse nel piano, come un vettore classico che precede.</p>`},
  {t:'reveal', title:'(3) Il fondamentale', tag:'soluzione', steps:[
   {label:'Quale stato', body:R`
   <p>Con $0\lt\alpha\ll E_{I}$ il livello più basso viene da $n=1$, dove $l=0$ e $m_{l}=0$; il termine magnetico vale $2\alpha m_{s}$ e favorisce lo spin giù. Il fondamentale è $|1,0,0\rangle|\downarrow\rangle$, con energia $-E_{I}-\alpha$, non degenere.</p>`},
   {label:'La rotazione', body:R`
   <p>Su questo stato $J_{x}=S_{x}$, perché $\mathbf L$ dà zero su $l=0$, e $e^{-i\pi J_{x}/4\hbar}=e^{-i\pi\sigma_{x}/8}=\cos\frac\pi8-i\sigma_{x}\sin\frac\pi8$. Il valor medio è $\langle\downarrow|\cdots|\downarrow\rangle=\cos(\pi/8)$, circa $0{,}924$: la sovrapposizione fra lo stato e il suo ruotato di $45^{\circ}$, che per uno spin un mezzo è il coseno di metà angolo.</p>`},
   {label:'L impulso quadro', body:R`
   <p>Il campo non cambia la funzione d&rsquo;onda orbitale del fondamentale, che è la $1s$ dell&rsquo;idrogeno. Per il teorema del viriale l&rsquo;energia cinetica media è $E_{I}$, e quindi $\langle p^{2}\rangle=2mE_{I}=m^{2}e^{4}/\hbar^{2}$; il conto diretto con la funzione $e^{-r/a}$, $a=\hbar^{2}/me^{2}$, dà $\hbar^{2}/a^{2}$, lo stesso numero.</p>`}
  ]}
]},
/* ---------------- 13 · LE FONTI A CONFRONTO, E L ORALE ---------------- */
{ num:'13', title:'Dove le fonti divergono, e le domande d orale', meta:'da dove viene la hamiltoniana · che cosa e primitivo, il potenziale o la fase · la divisione in termini paramagnetico e diamagnetico · il potenziale o il campo nell effetto Aharonov-Bohm · un numero da correggere · che cosa ciascuna fonte mette al centro · domande d orale',
  blocchi:[
  {t:'prosa', title:'Quattro punti di disaccordo', tag:'fonti', html:R`
  <p><b>Da dove viene la hamiltoniana.</b> Picasso, Sakurai, Griffiths e Landau la prendono dalla meccanica classica con la sostituzione dell&rsquo;impulso; Weinberg dalla lagrangiana; Ballentine la deduce dal gruppo di Galileo, senza la meccanica classica, e trova che scalare e vettore sono gli unici potenziali possibili. Il termine di spin, per Landau, la sostituzione non lo dà, e va aggiunto; gli appunti delle lezioni lo dicono empirico; la tappa 08 mostra che scrivendo l&rsquo;energia cinetica come $(\boldsymbol\sigma\cdot\mathbf p)^{2}/2m$ esce da solo con $g=2$, un&rsquo;osservazione che non si attribuisce a nessuna fonte.</p>
  <p><b>Che cosa è primitivo.</b> Tutte le fonti partono dai potenziali e ricavano la fase. La lettura inversa, la fase locale che obbliga il potenziale, è accennata da Sakurai nella storia di Weyl, Fock e London e da Ballentine nella preferenza per i potenziali e nel riferimento alle teorie di gauge non abeliane; nessuna la svolge come derivazione. La tappa 04 la svolge e dichiara che cosa dà e che cosa no.</p>
  <p><b>Paramagnetico e diamagnetico.</b> Picasso divide la hamiltoniana dell&rsquo;atomo in un termine lineare nel campo, che dà l&rsquo;effetto Zeeman, e uno quadratico, diamagnetico, che trascura; Ballentine scrive la stessa hamiltoniana e avverte che <i>«the individual terms have no distinct physical significance because they are not separately invariant under gauge transformations»</i>, e che trascurare il termine quadratico è giustificato solo perché le funzioni d&rsquo;onda legate decadono esponenzialmente. Il risultato di Picasso è giusto; Ballentine spiega quando lo sarebbe meno.</p>
  <p><b>Il potenziale o il campo.</b> Davanti all&rsquo;effetto Aharonov-Bohm Sakurai ricorda che gli effetti dipendono dal flusso, esprimibile con il campo; Ballentine considera sostenibili entrambe le letture e preferisce i potenziali; Shankar dice che la particella risponde al potenziale ma in modo invariante; Griffiths scrive che <i>«in quantum mechanics the potentials play a more significant role»</i>.</p>`},
  {t:'prosa', title:'Correzioni e dichiarazioni', tag:'errata', html:R`
  <p><b>Weinberg, la correzione al momento dell&rsquo;elettrone.</b> Il valore $\delta=0{,}001165923$ stampato per l&rsquo;elettrone è quello del muone; per l&rsquo;elettrone la correzione è $0{,}00115965$, come si ricava dai valori di $g$ di Picasso e di Shankar. La tappa 05 lo mostra con i numeri.</p>
  <p><b>Picasso, il rapporto fra termine diamagnetico e paramagnetico.</b> La formula è illeggibile nel testo estratto; il valore $1{,}1\cdot10^{-6}$ della tappa 06 è calcolato qui, con il raggio di Bohr e $10^{4}$ gauss, e la conclusione di Picasso, che il termine si può trascurare, non dipende dal fattore numerico.</p>
  <p><b>Un errore mio, preso contando.</b> Nella prima stesura della tappa 06 avevo scritto che per $n=2$ i valori di $m_{l}+2m_{s}$ vanno da $-3$ a $3$; contando gli otto stati vanno da $-2$ a $2$, e la figura è stata rifatta.</p>
  <p><b>Che cosa non si è potuto aprire.</b> Il Sakurai italiano (§2.6) e il Cohen-Tannoudji indicati dalla mappa sono scansioni senza testo; le stesse sezioni di Sakurai sono state lette nell&rsquo;edizione inglese. Gli appunti delle lezioni di Martinelli e Testa hanno le formule illeggibili nel testo estratto, e se ne citano solo le frasi.</p>`},
  {t:'prosa', title:'Che cosa mette al centro ciascuna fonte', tag:'fonti', html:R`
  <p>Ballentine è la fonte più completa sul tema: l&rsquo;accoppiamento dal gruppo di Galileo, le velocità e i loro commutatori, la forza di Lorentz come operatore, i livelli di Landau senza scegliere il potenziale, i centri delle orbite, la degenerazione in quanti di flusso, Aharonov-Bohm con il toro e l&rsquo;interpretazione. Sakurai mette al centro l&rsquo;invarianza di gauge: dal potenziale costante alle gabbie, l&rsquo;operatore che compensa, la storia del nome, Aharonov-Bohm con l&rsquo;integrale sui cammini, il monopolo. Picasso è la fonte del corso: l&rsquo;atomo nel campo, l&rsquo;effetto Zeeman normale e anomalo, Landé, la precessione di Thomas. Weinberg aggiunge la lagrangiana e la forma della hamiltoniana trasformata; Shankar il momento magnetico, $g=2$ e le sue correzioni, il livello di Landau più basso fatto di funzioni analitiche; Griffiths i problemi, dai livelli di Landau alla perlina sull&rsquo;anello; Landau la velocità che non ha componenti determinate, la degenerazione in più dell&rsquo;elettrone, i momenti dei nucleoni e l&rsquo;argomento di simmetria sul dipolo elettrico. Gli appunti delle lezioni danno il punto di vista del corso: sostituzione minimale, termine di spin empirico, covarianza.</p>`},
  {t:'collaudo', title:'Domande d’orale', items:[
   {q:'Come si scrive la hamiltoniana di una particella carica in un campo elettromagnetico, e perché il campo magnetico non vi compare direttamente?', a:R`$H=(\mathbf p-\frac qc\mathbf A)^{2}/2m+q\phi$. Il campo magnetico non fa lavoro e non entra nell&rsquo;energia scritta con la velocità; ma la hamiltoniana è funzione della posizione e dell&rsquo;impulso canonico $\mathbf p=m\mathbf v+\frac qc\mathbf A$, e scritta così genera la forza di Lorentz. Ballentine la deduce dal gruppo di Galileo; le altre fonti dalla meccanica classica con la sostituzione dell&rsquo;impulso.`},
   {q:'Che differenza c è fra impulso canonico e impulso cinematico?', a:R`L&rsquo;impulso canonico $\mathbf p$ è il generatore delle traslazioni e soddisfa $[x_{i},p_{j}]=i\hbar\delta_{ij}$, ma dipende dalla gauge; l&rsquo;impulso cinematico $\mathbf p-\frac qc\mathbf A=m\mathbf v$ è invariante, ed è quello che ha significato fisico. Le sue componenti non commutano: $[\pi_{x},\pi_{y}]=\frac{i\hbar q}{c}B_{z}$.`},
   {q:'Che cos è una trasformazione di gauge in meccanica quantistica?', a:R`L&rsquo;insieme di tre sostituzioni: $\mathbf A\to\mathbf A+\nabla\Lambda$, $\phi\to\phi-\frac1c\partial_{t}\Lambda$, e $\psi\to e^{iq\Lambda/\hbar c}\psi$. Le prime due non cambiano i campi, la terza compensa nella funzione d&rsquo;onda la variazione dei potenziali. Sono invarianti densità, corrente, valori medi di posizione e velocità, energie; non lo sono l&rsquo;impulso canonico e la hamiltoniana come operatore.`},
   {q:'Perché si dice che la fase locale obbliga il potenziale vettore?', a:R`Se si vuole poter cambiare la fase della funzione d&rsquo;onda da punto a punto senza cambiare la fisica, la derivata ordinaria non va bene, perché agisce anche sulla fase. Serve una derivata $\nabla-\frac{iq}{\hbar c}\mathbf A$ con un campo che si trasformi compensando la fase: è il potenziale vettore, e il campo magnetico è il commutatore di due di queste derivate, la parte che nessuna scelta di fase toglie.`},
   {q:'Quali sono i livelli di energia in un campo magnetico uniforme, e quanto sono degeneri?', a:R`$(n+\frac12)\hbar\omega_{c}+\frac12mv_{z}^{2}$, con $\omega_{c}=|q|B/mc$: i livelli di Landau. Per ogni $n$ e $v_{z}$ la degenerazione è il numero di quanti di flusso $hc/q$ che attraversano il sistema, perché l&rsquo;energia non dipende dalla posizione del centro dell&rsquo;orbita, le cui coordinate sono una coppia coniugata. Per un elettrone con $g=2$ i livelli con $n$ e spin su e $n+1$ e spin giù coincidono.`},
   {q:'Che cos è l effetto Zeeman normale, e perché non basta?', a:R`In un campo uniforme il termine $\frac{e}{2mc}\mathbf L\cdot\mathbf B$ sposta i livelli di $\mu_{B}BM$, e con le regole di selezione ogni riga si divide in tre, alla distanza della frequenza di Larmor: un risultato che si spiega anche classicamente. Molte righe si dividono in più componenti non equidistanti: è lo Zeeman anomalo, che richiede lo spin con $g=2$ e il fattore di Landé.`},
   {q:'Che cosa mostra l effetto Aharonov-Bohm?', a:R`Che una particella carica che non entra mai nella regione dove c&rsquo;è il campo magnetico ne risente: i cammini che girano attorno al flusso acquistano una fase relativa $q\Phi/\hbar c$, le frange si spostano e i livelli legati cambiano. La forza media è nulla, l&rsquo;effetto è periodico nel flusso con periodo $hc/q$ e proporzionale alla carica. Se ne conclude che i potenziali hanno un ruolo fisico, o che il campo agisce in modo non locale; in entrambe le letture l&rsquo;effetto è invariante di gauge.`},
   {q:'Perché un monopolo magnetico implicherebbe la quantizzazione della carica?', a:R`Il campo di un monopolo non si ottiene da un potenziale regolare ovunque; due potenziali regolari in regioni diverse sono legati da una trasformazione di gauge con $\Lambda=-2e_{M}\phi$, e le funzioni d&rsquo;onda nelle due gauge differiscono per la fase $e^{-2iee_{M}\phi/\hbar c}$. Perché entrambe siano a un sol valore deve essere $2ee_{M}/\hbar c$ intero: il prodotto delle cariche elettrica e magnetica è quantizzato.`}
  ]}
]}

var byId = {}; TAPPE.forEach(function(s){ byId[s.num]=s; });

var VKEY='pm-nucleomq-20-visited';
function loadSeen(){ try{ return new Set(JSON.parse(localStorage.getItem(VKEY)||'[]')); }catch(e){ return new Set(); } }
function saveSeen(s){ try{ localStorage.setItem(VKEY, JSON.stringify(Array.from(s))); }catch(e){} }
var SEEN = loadSeen();

function renderNav(active){
  var nav=document.getElementById('sidebar');
  nav.innerHTML='';
  var h=document.createElement('h2'); h.textContent='Nucleo mq-20 · le tappe'; nav.appendChild(h);
  TAPPE.forEach(function(s){
    var b=document.createElement('button');
    b.className='navitem'+(active===s.num?' active':'')+(SEEN.has(s.num)?' seen':'');
    b.innerHTML='<span class="dot"></span><span class="nx">'+s.num+'</span><span>'+s.title+'</span>';
    b.onclick=function(){ showTappa(s.num); };
    nav.appendChild(b);
  });
}

/* ---- renderer dei blocchi ---- */
function sectionProsa(title, tag, html){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var body=elFromHTML('<div class="open-body">'+html+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function sectionGram(title, rows){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag gramtag">grammatica</span></h3>';
  var inner='<table class="gramtab">';
  rows.forEach(function(r){ inner+='<tr><td class="gs">'+r[0]+'</td><td>'+r[1]+'</td></tr>'; });
  inner+='</table>';
  var body=elFromHTML('<div class="gramwrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
/* --- blocco PLOT: la figura non decora, si legge. Ogni plot porta una chiave di lettura. --- */
function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';
  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionSvelabile(title, tag, html, sol){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var c=document.createElement('div'); c.className='collaudo-item';
  var q=document.createElement('div'); q.className='cq'; q.innerHTML=html||'';
  c.appendChild(q); typeset(q);
  if(sol){
    var a=document.createElement('div'); a.className='ca'; a.style.display='none';
    a.innerHTML='<b>Soluzione.</b> '+sol;
    var btn=document.createElement('button'); btn.className='reveal-btn small';
    btn.textContent='Rivela la soluzione';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a);
      btn.disabled=true; btn.classList.add('done'); btn.textContent='Soluzione rivelata'; };
    c.appendChild(btn); c.appendChild(a);
  }
  wrap.appendChild(c); return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    /* DUE SCHEMI, NON UNO — scoperto il 2026-10-06 provando le pagine vive. I movimenti
       scritti per primi (em-01..03, me-10b, i collaudi di gd-01..09 e di quattro em)
       usano una forma piu' semplice: `reveal` e `prolessi` con un solo `html`,
       `esercizio` e `collaudo` con `html` + `sol`. Il renderer ne conosceva una sola e
       chiamava `steps.forEach` su `undefined`: TypeError, e la tappa si fermava li' —
       62 blocchi in 17 movimenti su 74. Non si riscrive il contenuto per far contento
       il renderer: e' il renderer che deve leggere cio' che c'e'.
       E in fondo un ramo che NON muore: uno schema nuovo di domani deve far vedere un
       avviso in quella sezione, non spegnere la pagina sotto di se'. */
    try{
      if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
      else if(b.t==='prolessi') m.appendChild(b.rotte ? sectionProlessi(b)
                                   : sectionProsa(b.title,'prolessi',b.html));
      else if(b.t==='reveal')m.appendChild(b.steps ? sectionReveal(b.title,b.tag,b.steps)
                                   : sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='esercizio') m.appendChild(b.steps ? sectionEsercizio(b)
                                   : sectionSvelabile(b.title,'esercizio',b.html,b.sol));
      else if(b.t==='collaudo')  m.appendChild(b.items ? sectionCollaudo(b.title,b.items)
                                   : sectionSvelabile(b.title,'provi, poi riveli',b.html,b.sol));
      else if(b.t==='plot')      m.appendChild(sectionPlot(b));
      else m.appendChild(sectionProsa(b.title||'(blocco)', 'tipo sconosciuto: '+b.t,
                                      b.html||''));
    }catch(err){
      var avv=document.createElement('section'); avv.className='section';
      avv.innerHTML='<h3>'+(b.title||'(blocco)')+'<span class="tag">non reso</span></h3>'
        +'<p style="color:#ff6b6b">Questo blocco non si &egrave; potuto rendere ('
        +b.t+': '+err.message+'). Il resto della tappa continua sotto.</p>';
      m.appendChild(avv);
    }
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* I POP-UP DEGLI STRUMENTI. `cablaStrumenti` esisteva dal 18-09 e non la chiamava
     nessuno: i 229 rimandi del percorso erano <span> senza handler, e il clic non
     faceva niente. Nessun controllo poteva vederlo — la sintassi era valida, le schede
     c'erano tutte, le formule rendevano: il guasto esisteva solo a pagina viva. Qui, e
     dopo ogni inserimento successivo, perche' la tappa si rimonta da capo a ogni
     cambio e gli handler vanno riattaccati al DOM nuovo. */
  cablaStrumenti(m);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}
