var CORSO = 'meccanica-quantistica';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["commutatore"] = {"nome":"Commutatore","riga":"$[\\hat A,\\hat B]=\\hat A\\hat B-\\hat B\\hat A$, antisimmetrico, con la regola di Leibniz $[\\hat A,\\hat B\\hat C]=[\\hat A,\\hat B]\\hat C+\\hat B[\\hat A,\\hat C]$ e la relazione canonica $[\\hat x,\\hat p]=i\\hbar$.","serve":"E' la misura di quanto due operazioni dipendano dall'ordine, e qui l'ordine e' fisica: due osservabili che non commutano non hanno una base comune di autostati, quindi non si misurano insieme con precisione arbitraria. Quasi ogni conto che sembra magico — l'algebra del momento angolare, gli operatori di salita e discesa, il teorema di Ehrenfest — e' una manipolazione di commutatori fatta con quelle regole e nient'altro.","esempio":"Dalla regola di Leibniz, $[\\hat x,\\hat p^{2}]=[\\hat x,\\hat p]\\hat p+\\hat p[\\hat x,\\hat p]=2i\\hbar\\hat p$. E' il conto che fa uscire il teorema di Ehrenfest: la meccanica classica ricompare come relazione fra valori medi, e ricompare perche' quel commutatore vale proprio $2i\\hbar\\hat p$.","debito":"l'identita' di Jacobi si enuncia e non si dimostra; la corrispondenza fra commutatore e parentesi di Poisson — che e' l'idea di Dirac e non un'analogia decorativa — sta in mq-07, e li' va letta per intero.","controllo":[{"tipo":"uguale","sinistra":"I*hbar*p + p*I*hbar","vale":"2*I*hbar*p","ipotesi":{"hbar":"positive","p":"real"},"dove":"esempio","appare":"2i\\hbar\\hat p"},{"tipo":"simbolico","dove":"riga","appare":"[\\hat x,\\hat p]=i\\hbar","perche":"e' la relazione di commutazione canonica, il POSTULATO da cui discende il resto della teoria: non si dimostra, si assume, ed e' cio' che separa la meccanica quantistica dalla classica"}],"qui":{},"pieno":null};
STRUM["rotore"] = {"nome":"Rotore","riga":"Il campo $\\nabla\\times\\mathbf F$, la cui componente lungo $\\hat n$ misura la circuitazione di $\\mathbf F$ per unità di area attorno a $\\hat n$.","serve":"È la girandola locale: dove il rotore è nullo, una paletta infinitesima immersa nel campo non gira. Da qui il criterio più usato — un campo con rotore nullo su un dominio semplicemente connesso è conservativo — e la doppia ipotesi non è pedanteria: su un dominio bucato il criterio salta, e il controesempio (il vortice attorno a un filo escluso) è proprio il caso che si incontra in fisica.","esempio":"Il vortice $\\mathbf F=(-y,x)$ ha rotore $\\partial_x(x)-\\partial_y(-y)=2$: gira davvero, ed è costante su tutto il piano. Il campo radiale $\\mathbf F=(x,y)$ ha invece rotore $\\partial_x(y)-\\partial_y(x)=0$: si allontana dall'origine senza ruotare, e infatti è il gradiente di $\\tfrac12(x^{2}+y^{2})$.","pieno":{"file":"04-campi-vettoriali.html","tappa":"03","come":"divergenza e rotore insieme, con le loro letture geometriche e il calcolo in componenti, nel nucleo sui campi vettoriali"},"qui":{"elettromagnetismo":{"serve":"Le due equazioni di Maxwell col rotore sono quelle che accoppiano i campi: $\\nabla\\times\\mathbf E=-\\partial_t\\mathbf B$ e $\\nabla\\times\\mathbf B=\\mu_0\\mathbf J+\\mu_0\\varepsilon_0\\partial_t\\mathbf E$. Il rotore nullo di $\\mathbf E$ in statica è ciò che autorizza a scrivere il potenziale; appena $\\mathbf B$ varia nel tempo quel rotore non è più nullo, e il potenziale scalare da solo smette di bastare. Il rotore è quindi il posto esatto in cui l'elettrostatica finisce.","esempio":"Che non possa esistere un potenziale scalare quando $\\mathbf B$ varia si vede dall'identità $\\nabla\\times(\\nabla V)$, che è nulla per ogni $V$: se $\\mathbf E$ fosse $-\\nabla V$ il suo rotore sarebbe zero, mentre Faraday lo vuole uguale a $-\\partial_t\\mathbf B$. Sul campione $V=xy$ il gradiente è $(y,x)$ e il conto è $\\partial_x(x)-\\partial_y(y)=0$, come per qualunque altro $V$."}},"controllo":[{"tipo":"uguale","sinistra":"diff(x,x)-diff(-y,y)","vale":"2","dove":"esempio","appare":"=2"},{"tipo":"uguale","sinistra":"diff(y,x)-diff(x,y)","vale":"0","dove":"esempio","appare":"=0"},{"tipo":"uguale","sinistra":"diff(diff(x*y,y),x)-diff(diff(x*y,x),y)","vale":"0","dove":"qui.elettromagnetismo.esempio","appare":"=0"}]};
STRUM["operatore-unitario"] = {"nome":"Operatore unitario","riga":"Un operatore $\\hat U$ e' unitario quando $\\hat U^{\\dagger}\\hat U=\\hat U\\hat U^{\\dagger}=\\mathbb 1$, cioe' $\\hat U^{\\dagger}=\\hat U^{-1}$, il che equivale a conservare il prodotto interno: $\\langle \\hat U\\phi|\\hat U\\psi\\rangle=\\langle\\phi|\\psi\\rangle$ per ogni coppia di stati.","serve":"Conservare il prodotto interno vuol dire conservare le probabilita': ogni trasformazione fisica che non cambia gli esiti di una misura — un cambio di base, una traslazione, una rotazione, l'evoluzione temporale — e' unitaria. I suoi autovalori hanno modulo uno, e due osservabili legate da un operatore unitario hanno lo stesso spettro.","esempio":"La rotazione del piano $\\hat U=\\begin{pmatrix}\\cos\\theta&-\\sin\\theta\\\\\\sin\\theta&\\cos\\theta\\end{pmatrix}$ e' unitaria — il prodotto $\\hat U^{\\dagger}\\hat U$ ha sulla diagonale $\\cos^2\\theta+\\sin^2\\theta=1$ e zero fuori — e ha autovalori $e^{\\pm i\\theta}$, di modulo $|e^{i\\theta}|=1$. La matrice $S$ del cambio di base ortonormale e' unitaria per lo stesso motivo: manda una base ortonormale in un'altra.","debito":"la trasformata di Cayley $\\hat U=(\\hat A-i)/(\\hat A+i)$, che lega operatori autoaggiunti e unitari e con cui von Neumann risolve il problema agli autovalori in dimensione infinita, si cita e non si costruisce.","controllo":[{"tipo":"uguale","sinistra":"Abs(exp(I*theta))","vale":"1","ipotesi":{"theta":"real"},"dove":"esempio","appare":"|e^{i\\theta}|=1"},{"tipo":"uguale","sinistra":"Matrix([[cos(th),-sin(th)],[sin(th),cos(th)]]).T*Matrix([[cos(th),-sin(th)],[sin(th),cos(th)]])","vale":"Matrix([[1,0],[0,1]])","ipotesi":{"th":"real"},"dove":"esempio","appare":"\\cos^2\\theta+\\sin^2\\theta=1"}],"qui":{},"pieno":null};
STRUM["simmetrie"] = {"nome":"Simmetrie","riga":"L'insieme delle trasformazioni che lasciano identica la sorgente, e che perciò devono lasciare identico anche il campo che ne nasce.","serve":"È il ragionamento che decide la FORMA del campo prima di calcolarlo, e senza il quale la legge di Gauss non serve a niente: Gauss dà un solo numero — il flusso totale — e da un numero si ricava un campo soltanto se si sa già in che direzione punta e da quali variabili dipende. L'argomento ha una forma sola: se una trasformazione lascia identica la distribuzione di carica, lascia identico il campo; quindi ogni componente che quella trasformazione cambierebbe deve essere nulla, e ogni variabile che essa sposta non può comparire.","esempio":"Per un filo infinito uniformemente carico, la traslazione lungo il filo e la rotazione attorno a esso lasciano la carica identica: $\\mathbf E$ non può dipendere né da $z$ né dall'angolo. La riflessione nel piano perpendicolare al filo manderebbe $E_z$ in $-E_z$ lasciando uguale la sorgente, quindi $E_z=0$; resta la sola componente radiale $E_r(r)$. Solo a quel punto il cilindro coassiale è la superficie giusta, e Gauss dà $E_r\\cdot 2\\pi rL=\\dfrac{\\lambda L}{\\varepsilon_0}$, da cui $E_r=\\dfrac{\\lambda}{2\\pi\\varepsilon_0 r}$.","qui":{"meccanica-quantistica":{"serve":"Qui l'argomento di simmetria non decide la forma di un campo: decide la forma degli OPERATORI, ed è il modo in cui questo corso costruisce la teoria. Lo schema è lo stesso — una trasformazione che lascia identica la situazione fisica deve lasciare identica la descrizione — ma la conseguenza è più forte: ogni trasformazione di simmetria continua è realizzata da un operatore unitario, ogni operatore unitario continuo è l'esponenziale di un generatore autoaggiunto, e quel generatore è una quantità conservata. Impulso, momento angolare ed energia non si postulano: sono i generatori delle traslazioni, delle rotazioni e delle traslazioni temporali.","esempio":"Lo spazio è omogeneo, quindi traslare un sistema isolato non ne cambia la fisica: $\\hat U(a)=e^{-ia\\hat P/\\hbar}$ deve commutare con $\\hat H$. Al primo ordine in $a$ questo dà $[\\hat P,\\hat H]=0$, e quindi $\\dfrac{d}{dt}\\langle \\hat P\\rangle=0$: l'omogeneità dello spazio è la conservazione dell'impulso, e il passaggio da una all'altra è di due righe."}},"debito":"nessun nucleo del percorso tratta l'argomento di simmetria come strumento a sé: qui c'è la forma dell'argomento e non la sua giustificazione, che è di teoria dei gruppi e sta fuori dal percorso costruito finora. Quello che il percorso copre è il pezzo di destra — l'integrale di flusso, nel nucleo 03 tappa 04 — non il pezzo di sinistra che decide quale superficie scegliere.","controllo":[{"tipo":"uguale","sinistra":"(lam/(2*pi*e0*r))*2*pi*r*L","vale":"lam*L/e0","dove":"esempio","appare":"\\dfrac{\\lambda L}{\\varepsilon_0}"}]};
STRUM["polinomi-di-hermite"] = {"nome":"Polinomi di Hermite","riga":"$H_n$ sono le soluzioni polinomiali dell'equazione di Hermite, con $H_0=1$, $H_1=2\\xi$, $H_2=4\\xi^{2}-2$ e $H_3=8\\xi^{3}-12\\xi$, ortogonali con peso $e^{-\\xi^{2}}$.","serve":"Sono la parte polinomiale delle autofunzioni dell'oscillatore armonico. Il grado del polinomio da' il numero di nodi, e quindi l'ordine dei livelli: l'ennesimo stato eccitato ha esattamente ennesimi zeri. La parita' si alterna con il grado, ed e' il motivo per cui meta' degli elementi di matrice si annulla senza fare il conto.","esempio":"Il polinomio di grado due si annulla dove $4\\xi^{2}=2$, cioe' in due punti: due nodi, come vuole il grado. E la sua parita' pari fa si' che l'elemento di matrice della posizione fra lo stato fondamentale e il secondo eccitato sia nullo, perche' l'integrando e' dispari — una regola di selezione ottenuta guardando la simmetria invece di integrare.","debito":"la formula di Rodrigues, la funzione generatrice e le relazioni di ricorrenza stanno nei movimenti di Metodi sulle funzioni speciali; qui c'e' cio' che serve per leggere le autofunzioni.","controllo":[{"tipo":"uguale","sinistra":"4*(1/sqrt(2))**2","vale":"2","dove":"esempio","appare":"4\\xi^{2}=2"},{"tipo":"derivata","espr":"4*x**2-2","rispetto":["x"],"vale":"8*x","ipotesi":{"x":"real"},"dove":"riga","appare":"4\\xi^{2}-2"},{"tipo":"integrale","espr":"x*exp(-x**2)","var":"x","da":"-oo","a":"oo","vale":"0","dove":"esempio","appare":"l'integrando e' dispari"}],"qui":{},"pieno":null};
STRUM["ordini-di-grandezza"] = {"nome":"Ordini di grandezza","riga":"Stimare una quantità alla potenza di dieci giusta: si tiene una cifra significativa, si sommano e si sottraggono gli esponenti, e si controlla che l'unità del risultato sia quella che si voleva.","serve":"A sapere se un risultato è plausibile prima di averlo calcolato con precisione, e ad accorgersi di un errore di impostazione quando c'è ancora tempo per rimediare. In astrofisica non è una comodità ma il modo normale di ragionare, per due ragioni: le grandezze in gioco vanno da $10^{-36}$ kg a $10^{53}$ kg e nessuna intuizione le copre, e i dati osservativi sono noti al dieci o al venti per cento, quindi una cifra significativa è spesso tutto ciò che il problema contiene davvero. Il controllo che smaschera più errori non è sul numero, è sull'**unità**: un conto che dovrebbe dare una densità e dà dei kg è sbagliato nell'impostazione, e nessun affinamento dell'aritmetica lo salverà. La seconda regola è il confronto con un termine noto — l'acqua per una densità, il Sole per una massa o una luminosità, il parsec per una distanza galattica — perché un numero senza metro non dice niente.","esempio":"Densità media del Sole, dalle due sole quantità stampate in calce al foglio d'esame, $M_\\odot=1{,}989\\cdot10^{30}$ kg e $R_\\odot=6{,}957\\cdot10^{8}$ m: $\\rho=\\dfrac{3M_\\odot}{4\\pi R_\\odot^{3}}=1410\\ \\mathrm{kg/m^3}$. Il confronto è immediato e istruttivo: è quasi una volta e mezza l'acqua, cioè il Sole è in media meno denso della Terra — una stella non è un sasso grande, è un gas tenuto insieme dal proprio peso.","pieno":{"file":"as-01-la-scala-del-cosmo.html","tappa":"01","come":"la gerarchia delle strutture cosmiche letta come scala di ordini di grandezza, e il tempo di luce come secondo asse della stessa tabella"},"controllo":[{"tipo":"numero","espr":"3*1.989e30/(4*pi*(6.957e8)**3)","vale":"1410","dove":"esempio","appare":"1410"}]};
STRUM["elettronvolt"] = {"nome":"Elettronvolt","riga":"L'energia che un elettrone acquista attraversando una differenza di potenziale di un volt: $1\\ \\mathrm{eV}=1{,}602\\cdot10^{-19}$ J; divisa per $c^{2}$ è una massa, $1\\ \\mathrm{eV}/c^{2}=1{,}783\\cdot10^{-36}$ kg.","serve":"A leggere senza conversioni le tabelle in cui la fisica delle particelle e l'astrofisica scrivono le masse a riposo come energie — l'elettrone 0,511 MeV, il protone 938 MeV, il bosone di Higgs 125 GeV. La scelta non è una bizzarria di notazione: in un processo la quantità che si conserva è l'energia, e scrivere la massa già in energia dice a colpo d'occhio quali reazioni sono possibili e quante ne resta per l'energia cinetica o per i fotoni. L'elettronvolt ha anche un secondo mestiere, e in astrofisica è il più usato dei due: convertito in temperatura tramite $k_BT$ dà la scala termica a cui un processo di quella energia diventa frequente, e questo è ciò che permette di dire a che punto della storia dell'universo o a che profondità di una stella un certo processo si accende.","esempio":"Dalla massa del protone espressa come energia, $938{,}3$ MeV, si ricavano i chilogrammi in un passaggio: $m_p=938{,}3\\cdot10^{6}\\cdot1{,}783\\cdot10^{-36}=1{,}673\\cdot10^{-27}$ kg, che è il valore stampato in calce al foglio d'esame. Sul versante termico, $T=\\dfrac{1{,}602\\cdot10^{-19}}{1{,}381\\cdot10^{-23}}=11600$ K: un'energia di un elettronvolt corrisponde a poco più di undicimila kelvin, e siccome ionizzare l'idrogeno costa 13,6 eV si capisce subito perché serva una fotosfera da qualche decina di migliaia di kelvin per trovarlo ionizzato.","pieno":{"file":"as-01-la-scala-del-cosmo.html","tappa":"05","come":"le masse delle particelle elementari scritte come energie, con la conversione in chilogrammi e la gerarchia delle masse, nel movimento sulla scala del cosmo"},"controllo":[{"tipo":"numero","espr":"1.602177e-19/(2.99792458e8)**2*1e36","vale":"1.783","dove":"riga","appare":"1,783\\cdot10^{-36}"},{"tipo":"numero","espr":"938.3e6*1.783e-36*1e27","vale":"1.673","dove":"esempio","appare":"1,673\\cdot10^{-27}"},{"tipo":"numero","espr":"1.602e-19/1.381e-23","vale":"11600","dove":"esempio","appare":"11600"}]};
STRUM["matrici-di-pauli"] = {"nome":"Matrici di Pauli","riga":"Sono le tre matrici $2\\times2$ hermitiane a traccia nulla il cui quadrato e' l'identita' e il cui commutatore riproduce l'algebra del momento angolare, da cui lo spin $\\hat S_i=\\tfrac{\\hbar}{2}\\sigma_i$.","serve":"Sono la rappresentazione piu' piccola non banale del momento angolare, e insieme all'identita' formano una base di tutte le matrici due per due hermitiane: qualunque osservabile di un sistema a due stati e' una combinazione dell'identita' e delle tre. Ogni conto di spin un mezzo — Stern-Gerlach, precessione, risonanza magnetica, qubit — si riduce alla loro algebra.","esempio":"Siccome il quadrato di una combinazione unitaria delle tre e' l'identita', qualunque esponenziale collassa: l'operatore di rotazione dello spinore diventa $\\cos(\\theta/2)$ per l'identita' meno $i\\sin(\\theta/2)$ per la combinazione. Il mezzo nell'angolo e' la ragione per cui una rotazione di un giro intero cambia segno allo stato, perche' $\\cos(\\pi)=-1$.","debito":"la costruzione generale delle rappresentazioni di SU(2) e il suo legame con SO(3) stanno nel movimento sul momento angolare; qui c'e' il caso di spin un mezzo con le sue regole di calcolo.","controllo":[{"tipo":"uguale","sinistra":"cos(2*pi/2)","vale":"-1","dove":"esempio","appare":"\\cos(\\pi)=-1"},{"tipo":"uguale","sinistra":"cos(pi/3)**2+sin(pi/3)**2","vale":"1","dove":"esempio","appare":"\\sin(\\theta/2)"}],"qui":{},"pieno":null};
STRUM["teorema-di-stokes"] = {"nome":"Teorema di Stokes","riga":"La circuitazione di un campo lungo una curva chiusa è il flusso del suo rotore attraverso una qualunque superficie che quella curva borda: $\\oint_{\\partial S}\\mathbf F\\cdot d\\mathbf r=\\int_S(\\nabla\\times\\mathbf F)\\cdot\\hat n\\,dS$.","serve":"Dice che la circuitazione dipende solo dal bordo e non dalla superficie scelta — ed è la licenza a deformare la superficie a piacere, che in fisica si usa continuamente. Letto nell'altro verso dà il significato del rotore: la circuitazione per unità di area, nel limite di un cappio piccolo. Il verso della normale e quello di percorrenza del bordo vanno legati dalla regola della mano destra, altrimenti il segno è casuale.","esempio":"Per il vortice $\\mathbf F=(-y,x,0)$ il rotore ha solo componente $z$, che vale $\\partial_x(x)-\\partial_y(-y)=2$. Sul disco di raggio $R$ nel piano $xy$ il flusso del rotore è quindi $2$ per l'area, $2\\pi R^{2}$; la circuitazione diretta sul cerchio, dove $\\mathbf F\\cdot d\\mathbf r$ vale $R^{2}\\,dt$, dà $\\int_0^{2\\pi}R^{2}\\,dt=2\\pi R^{2}$.","pieno":{"file":"05-teoremi-integrali.html","tappa":"03","come":"l'enunciato, l'orientazione coerente bordo-normale e l'indipendenza dalla superficie, nel nucleo dei teoremi integrali"},"qui":{"elettromagnetismo":{"serve":"È il ponte fra la forma integrale e la forma locale delle due leggi di circuitazione: Ampère, $\\oint\\mathbf B\\cdot d\\mathbf r=\\mu_0 I$, diventa $\\nabla\\times\\mathbf B=\\mu_0\\mathbf J$; Faraday, $\\oint\\mathbf E\\cdot d\\mathbf r=-\\dfrac{d\\Phi_B}{dt}$, diventa $\\nabla\\times\\mathbf E=-\\partial_t\\mathbf B$. E regge l'affermazione più usata dell'elettrostatica: se il rotore di $\\mathbf E$ è nullo su un dominio senza buchi, ogni circuitazione è nulla e il campo è conservativo.","esempio":"Per il filo rettilineo infinito percorso da una corrente il campo ha modulo $\\dfrac{\\mu_0 I}{2\\pi r}$ ed è tangente ai cerchi concentrici, quindi la circuitazione su un cerchio di raggio $r$ è $\\dfrac{\\mu_0 I}{2\\pi r}\\cdot 2\\pi r=\\mu_0 I$: il raggio scompare. Stokes dice che lo stesso valore si ottiene su qualunque cappio che allacci il filo, anche storto — è il bordo a contare, non la forma."}},"controllo":[{"tipo":"uguale","sinistra":"diff(x,x)-diff(-y,y)","vale":"2","dove":"esempio","appare":"=2"},{"tipo":"integrale","espr":"R**2","var":"t","da":"0","a":"2*pi","vale":"2*pi*R**2","dove":"esempio","appare":"2\\pi R^{2}"},{"tipo":"uguale","sinistra":"mu0*Ic/(2*pi*r)*2*pi*r","vale":"mu0*Ic","dove":"qui.elettromagnetismo.esempio","appare":"\\mu_0 I"}]};
STRUM["residuo"] = {"nome":"Residuo","riga":"Il coefficiente $a_{-1}$ dello sviluppo di Laurent attorno a una singolarità isolata, cioè l'unico termine che sopravvive all'integrazione su un cerchietto attorno al punto.","serve":"È il numero che trasforma un integrale in una somma: tutto il resto della serie integra a zero su un giro chiuso, e resta $2\\pi i$ per la somma dei residui. Tre formule coprono quasi tutto — polo semplice $\\lim(z-z_0)f$; quoziente con polo semplice $P(z_0)/Q'(z_0)$, la più rapida perché non chiede di fattorizzare; polo di ordine $m$ con la derivata $(m-1)$-esima — e per l'ordine alto o per una singolarità essenziale conviene invece dividere le serie e leggere il coefficiente di $(z-z_0)^{-1}$.","esempio":"Con $f=\\dfrac{z}{z^{2}+1}$ in $z_0=i$ la formula del quoziente dà $\\dfrac{P(i)}{Q'(i)}=\\dfrac{i}{2i}=\\tfrac12$, senza fattorizzare nulla. Per $\\dfrac{e^{z}}{(z-2)^{3}}$ in $2$ il polo è di ordine $3$ e la formula con la derivata seconda dà $\\tfrac{e^{2}}{2}$. Per $\\dfrac{\\cos z-1}{z^{5}}$ in $0$ le formule sono peggio dello sviluppo: da $\\cos z-1=-\\tfrac{z^{2}}{2}+\\tfrac{z^{4}}{24}-\\cdots$ il coefficiente di $z^{-1}$ si legge direttamente, e vale $\\tfrac1{24}$.","pieno":{"file":"13-residui.html","tappa":"01","come":"le tre formule, il criterio di scelta e i casi svolti, nel nucleo sui residui"},"controllo":[{"tipo":"uguale","sinistra":"I/(2*I)","vale":"1/2","dove":"esempio","appare":"\\tfrac12"},{"tipo":"uguale","sinistra":"exp(2)/factorial(2)","vale":"exp(2)/2","dove":"esempio","appare":"\\tfrac{e^{2}}{2}"},{"tipo":"uguale","sinistra":"series(cos(z)-1, z, 0, 5).removeO()","vale":"-z**2/2 + z**4/24","dove":"esempio","appare":"-\\tfrac{z^{2}}{2}+\\tfrac{z^{4}}{24}"},{"tipo":"uguale","sinistra":"1/factorial(4)","vale":"1/24","dove":"esempio","appare":"\\tfrac1{24}"}]};

function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';
  return h;
}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

/* ---------------- 00 · DI COSA PARLA QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Di cosa parla questo movimento', meta:'Meccanica Quantistica · voci Q.21 e Q.24 · il campo entra attraverso i potenziali · la velocita non e l impulso · una fase locale che obbliga il potenziale vettore · materiale d orale piu che d esame',
  blocchi:[
  {t:'prosa', title:'Un campo che non fa lavoro e cambia tutto', tag:'architettura', html:R`
  <p>Ballentine apre il suo capitolo sulle particelle cariche avvertendo che il tema <i>«presents several difficult and unintuitive features»</i>, e che conviene ripassare la meccanica classica per vedere che <i>«some of these unintuitive features are not peculiar to the quantum theory, but rather that they are characteristic of motion in a magnetic field»</i>. La prima stranezza è già classica: la forza magnetica è perpendicolare alla velocità, non fa lavoro e non compare nell&rsquo;energia, eppure la hamiltoniana deve generare un moto che dal campo dipende. La risposta è che la hamiltoniana non si scrive con il campo ma con i potenziali, e che l&rsquo;impulso che vi compare non è $m\mathbf v$.</p>
  <p>La seconda stranezza è quantistica. I potenziali non sono unici: cambiando $\mathbf A$ di un gradiente i campi non cambiano. In meccanica classica questo dice che i potenziali sono un artificio; in meccanica quantistica il cambio di potenziale va accompagnato da un cambio di fase della funzione d&rsquo;onda, diverso da punto a punto, e il legame fra le due cose si può leggere nei due versi. Letto in un verso, dice che la teoria non dipende dalla scelta del potenziale. Letto nell&rsquo;altro, dice che se si vuole una teoria in cui la fase della funzione d&rsquo;onda si possa cambiare liberamente da punto a punto, il potenziale vettore deve esserci. L&rsquo;effetto Aharonov-Bohm mostra che questa non è una sottigliezza formale.</p>
  <p>La mappa del corso registra che il campo magnetico compare in tre scritti su 47 e l&rsquo;invarianza di gauge in nessuno: questa voce si prepara per l&rsquo;orale, e il movimento è scritto per la comprensione. I due compiti che ci sono vengono risolti per intero.</p>`},
  {t:'prosa', title:'Come è fatto il movimento', tag:'architettura', html:R`
  <p><b>Il primo blocco è come entra il campo.</b> La tappa 01 mette a confronto quattro modi di scrivere la hamiltoniana: la sostituzione dell&rsquo;impulso nella hamiltoniana classica, che usano Picasso, Sakurai, Griffiths e Landau; la deduzione dal gruppo di Galileo di Ballentine; la lagrangiana di Weinberg; e il termine di spin che, come avverte Landau, la sostituzione non dà. La 02 separa la velocità dall&rsquo;impulso e mostra che le componenti della velocità non commutano.</p>
  <p><b>Il secondo blocco è l&rsquo;invarianza di gauge.</b> La 03 la costruisce con Sakurai, partendo dal potenziale costante, e con Weinberg, che mostra che la hamiltoniana non è invariante ma le energie sì. La 04 legge la stessa identità all&rsquo;incontrario: la fase locale obbliga il potenziale vettore. Dichiara anche quale fonte dice che cosa, perché questo verso del ragionamento nelle fonti del corso è accennato e non svolto.</p>
  <p><b>Il terzo blocco sono i campi uniformi.</b> La 05 ricava i livelli di Landau in tre modi e conta la degenerazione in quanti di flusso. La 06 mette l&rsquo;atomo nel campo, con l&rsquo;effetto Zeeman normale di Picasso e la critica di Ballentine alla divisione in termine paramagnetico e diamagnetico. La 07 è il momento magnetico e la precessione, dal fattore di Landé alla precessione di Thomas. La 08 scrive la hamiltoniana di Pauli e mostra da dove può venire il fattore $g=2$.</p>
  <p><b>Il quarto blocco è la topologia.</b> La 09 è l&rsquo;effetto Aharonov-Bohm in tre versioni, con la domanda se sia più fondamentale il potenziale o il campo. La 10 è il monopolo di Dirac e la quantizzazione della carica. Le tappe 11 e 12 risolvono i due compiti; la 13 confronta le fonti e chiude con le domande d&rsquo;orale.</p>`}
]},
/* ---------------- 01 · COME ENTRA IL CAMPO ---------------- */
{ num:'01', title:'Come entra il campo: quattro modi di scrivere la stessa hamiltoniana', meta:'la lagrangiana classica e la forza di Lorentz · l impulso canonico · la sostituzione presa dalla meccanica analitica · il gruppo di Galileo di Ballentine · la lagrangiana di Weinberg · l ordine degli operatori · il termine di spin che manca · unita di Gauss e unita SI',
  blocchi:[
  {t:'reveal', title:'Il punto di partenza classico', tag:'meccanica analitica', steps:[
   {label:'La lagrangiana', body:R`
   <p>Ballentine riassume la teoria classica in tre equazioni. I campi si scrivono con i potenziali, $\mathbf E=-\nabla\phi-\frac1c\partial_{t}\mathbf A$ e $\mathbf B=\nabla\times\mathbf A$; la lagrangiana di una particella di massa $M$ e carica $q$ è</p>
   $$L=\frac{Mv^{2}}{2}-q\phi+\frac qc\,\mathbf v\cdot\mathbf A,$$
   <p>e le equazioni di Lagrange danno la forza di Lorentz: massa per accelerazione uguale a $q(\mathbf E+\mathbf v\times\mathbf B/c)$. Per un campo uniforme lungo $z$, con $\mathbf A=\tfrac12\mathbf B\times\mathbf r$, il conto è breve: l&rsquo;equazione per $x$ diventa $M\ddot x=\frac qc B\dot y$, che è la componente $x$ di $\frac qc\mathbf v\times\mathbf B$.</p>`},
   {label:'L impulso canonico, e una hamiltoniana senza campo', body:R`
   <p>L&rsquo;impulso canonico è $\mathbf p=\partial L/\partial\mathbf v=M\mathbf v+\frac qc\mathbf A$, e <i>«since $\mathbf p$, like $\mathbf A$, is changed by a gauge transformation, it too lacks a direct physical significance. However, it is of considerable mathematical importance»</i>: se la lagrangiana non dipende da una coordinata, si conserva l&rsquo;impulso canonico e non $Mv$. La hamiltoniana $\mathbf v\cdot\mathbf p-L$ vale $\tfrac12Mv^{2}+q\phi$: il campo magnetico non fa lavoro e non c&rsquo;è. <i>«How then can the Hamiltonian generate the motion of the particle, which does depend upon the magnetic field, when the magnetic field apparently does not enter into (11.6)? The answer lies in the fact that Hamiltonian is to be regarded as a function of position and momentum, not of position and velocity»</i>:</p>
   $$H=\frac{1}{2M}\Big(\mathbf p-\frac qc\mathbf A\Big)^{2}+q\phi .$$
   <p>Weinberg fa la stessa osservazione: se si riscrivesse il primo termine come $\sum m\dot{\mathbf x}^{2}/2$ <i>«then it would appear as if the dynamics of these particles was unaffected by the vector potential, but this is wrong»</i>, perché nelle relazioni di commutazione compare $\mathbf p$, non $m\dot{\mathbf x}$.</p>`}
  ]},
  {t:'prosa', title:'Quattro modi di passare alla meccanica quantistica', tag:'formalismi', html:R`
  <p><b>La sostituzione presa dalla meccanica classica.</b> È la via più diffusa. Picasso, per l&rsquo;atomo nel campo di radiazione: <i>«è noto dalla meccanica analitica che se $H_{0}$ è la hamiltoniana dell&rsquo;atomo in assenza di campo [...] la hamiltoniana $H$ dell&rsquo;atomo in presenza del campo si ottiene sostituendo al posto degli impulsi $\vec p_{\alpha}$ degli elettroni le espressioni»</i> $\vec p_{\alpha}+\frac ec\vec A(\vec q_{\alpha})$, con la carica dell&rsquo;elettrone $-e$. Sakurai: la hamiltoniana <i>«is taken from classical physics to be»</i> quella scritta sopra. Griffiths, nel problema 4.64, la chiama <i>«the classical Hamiltonian»</i> e fa la <i>«canonical substitution»</i> $\mathbf p\to(\hbar/i)\nabla$. Landau, dalla funzione di Hamilton classica: <i>«se la particella non ha spin, il passaggio alla meccanica quantistica avviene nel modo solito»</i>. Gli appunti delle lezioni di Martinelli e Testa la chiamano <i>«sostituzione minimale»</i>, e premettono che a rigore <i>«si dovrebbe usare la teoria formulata dall&rsquo;elettrodinamica quantistica»</i>, ma che trascurando il campo prodotto dalla particella stessa si può partire dalle leggi classiche.</p>
  <p><b>La deduzione dal gruppo di Galileo.</b> Ballentine non prende niente dalla meccanica classica. Nel §3.4 chiede quali interazioni con campi esterni siano compatibili con l&rsquo;invarianza di Galileo, mantenendo i generatori geometrici e cambiando solo il generatore delle traslazioni temporali. La velocità $\mathbf V=i[H,\mathbf Q]$ deve soddisfare $[G_{\alpha},V_{\beta}]=i\delta_{\alpha\beta}$ con $\mathbf G=M\mathbf Q$, quindi $\mathbf V-\mathbf P/M$ commuta con le tre coordinate e deve essere una funzione della posizione: $\mathbf V=\mathbf P/M-\mathbf A(\mathbf Q)$. Risolvendo per $H$, <i>«the most general form of the time evolution generator, or Hamiltonian, for a spinless particle interacting with external fields is»</i> $\{\mathbf P-\mathbf A\}^{2}/2M+W(\mathbf Q)$. E conclude: <i>«we have deduced that the only forms of interaction consistent with invariance under the Galilei group of transformations are a scalar potential $W(\mathbf Q)$ and a vector potential $\mathbf A(\mathbf Q)$»</i>. Aggiunge che $\mathbf A$ e $W$ non sono necessariamente i potenziali elettromagnetici: anche la gravità entra in $W$.</p>
  <p><b>La lagrangiana.</b> Weinberg parte dalla lagrangiana di più particelle cariche, ricava gli impulsi canonici e la hamiltoniana, e impone le relazioni di commutazione canoniche a $\mathbf x$ e $\mathbf p$. È la via della sostituzione, fatta un passo prima.</p>
  <p><b>Il termine che la sostituzione non dà.</b> Landau avverte: <i>«se invece la particella è dotata di spin, tale operazione è insufficiente. Ciò è dovuto al fatto che il momento magnetico intrinseco interagisce direttamente con il campo magnetico. Nella funzione classica di Hamilton questa interazione manca, poiché lo spin stesso, come effetto puramente quantistico, scompare nel passaggio al limite classico»</i>. Il termine $-\boldsymbol\mu\cdot\mathbf B$ va aggiunto a mano; gli appunti delle lezioni lo dicono <i>«di natura empirica»</i>. La tappa 08 mostra che c&rsquo;è un modo di non doverlo aggiungere.</p>`},
  {t:'reveal', title:'L ordine degli operatori', tag:'operatori', steps:[
   {label:'p e A non commutano', body:R`
   <p>In meccanica quantistica $\mathbf A$ è una funzione dell&rsquo;operatore posizione, e $\mathbf p$ non commuta con essa. Sakurai: <i>«because $\mathbf p$ and $\mathbf A$ do not commute, some care is needed in interpreting (2.7.20). The safest procedure is to write»</i> il quadrato come $p^{2}-\frac ec(\mathbf p\cdot\mathbf A+\mathbf A\cdot\mathbf p)+\frac{e^{2}}{c^{2}}A^{2}$, che è hermitiano. La differenza fra i due prodotti si calcola applicandoli a una funzione: $\mathbf P\cdot\mathbf A-\mathbf A\cdot\mathbf P=-i\hbar\,\nabla\cdot\mathbf A$, la (11.14) di Ballentine, la (111,6) di Landau. Se si sceglie $\nabla\cdot\mathbf A=0$ i due prodotti coincidono, e Picasso fa proprio questa scelta per scrivere $\vec p\cdot\vec A+\vec A\cdot\vec p=2\vec A\cdot\vec p$.</p>`},
   {label:'La forma esplicita', body:R`
   <p>Nella rappresentazione delle coordinate la hamiltoniana diventa, con la (11.15) di Ballentine,</p>
   $$H=-\frac{\hbar^{2}}{2M}\nabla^{2}+\frac{i\hbar q}{Mc}\mathbf A\cdot\nabla+\frac{i\hbar q}{2Mc}(\nabla\cdot\mathbf A)+\frac{q^{2}}{2Mc^{2}}A^{2}+q\phi,$$
   <p>e Ballentine avverte subito di non leggerla termine per termine: <i>«in spite of the apparent complexity, the sum of the first four terms is just the kinetic energy»</i>, e <i>«sometimes the first term is described as the kinetic energy, and the next three terms are described as paramagnetic and diamagnetic corrections. That is not correct, and indeed the individual terms have no distinct physical significance because they are not separately invariant under gauge transformations»</i>. La tappa 06 mostra che Picasso usa proprio quella divisione, e perché nel suo caso funziona.</p>`},
   {label:'Unità', body:R`
   <p>Le fonti usano unità di Gauss, con il fattore $1/c$ davanti al potenziale vettore, tranne Griffiths che usa le SI. Il passaggio è quello che il compito del 14-02-2020 scrive esplicitamente: <i>«se si desidera utilizzare il sistema internazionale, si sostituisca $e/c$ con $e$»</i>. Anche il segno della carica cambia da libro a libro: Sakurai scrive $e$ con $e\lt0$ per l&rsquo;elettrone, Picasso e Weinberg $-e$ con $e\gt0$, Ballentine una carica $q$ generica.</p>`}
  ]}
]},
/* ---------------- 02 · LA VELOCITA NON E L IMPULSO ---------------- */
{ num:'02', title:'La velocità non è l impulso, e le sue componenti non commutano', meta:'l operatore velocita dal commutatore con H · impulso canonico e cinematico · il commutatore fra due componenti della velocita e il campo · la forza di Lorentz come operatore · la corrente di probabilita · che cosa e invariante e che cosa no',
  blocchi:[
  {t:'prosa', title:'Due impulsi', tag:'operatori', html:R`
  <p>In meccanica quantistica la velocità si definisce come derivata temporale della posizione, cioè con il <span class="str" data-str="commutatore">commutatore</span> con la hamiltoniana. Con $H=(\mathbf P-\frac qc\mathbf A)^{2}/2M+q\phi$ si trova</p>
   $$\mathbf V=\frac{i}{\hbar}[H,\mathbf Q]=\frac1M\Big(\mathbf P-\frac qc\mathbf A\Big),$$
  <p>che è la versione quantistica della relazione classica fra impulso canonico e velocità. Sakurai lo commenta così: <i>«the operator $\mathbf p$, defined in this book to be the generator of translation, is not the same as $m\,d\mathbf x/dt$. Quite often $\mathbf p$ is called canonical momentum, as distinguished from kinematical (or mechanical) momentum»</i>, $\boldsymbol\Pi$, uguale a $m\,d\mathbf x/dt$ e a $\mathbf p-e\mathbf A/c$. Il commutatore di posizione e velocità è quello di posizione e impulso diviso per la massa, $[Q_{\alpha},V_{\beta}]=i\hbar\delta_{\alpha\beta}/M$; ma per l&rsquo;impulso cinematico Sakurai nota che il commutatore fra componenti diverse, nullo per l&rsquo;impulso canonico, <i>«does not vanish»</i>.</p>`},
  {t:'reveal', title:'Il commutatore delle velocità', tag:'derivazione', steps:[
   {label:'Il conto di Ballentine', body:R`
   <p>Ballentine calcola $[V_{x},V_{y}]$ applicandolo a una funzione. I termini $[P_{x},P_{y}]$ e $[A_{x},A_{y}]$ sono nulli; restano i termini misti, che con $P_{\alpha}=-i\hbar\partial_{\alpha}$ danno</p>
   $$[V_{x},V_{y}]\psi=\frac{i\hbar q}{M^{2}c}\Big(\frac{\partial A_{y}}{\partial x}-\frac{\partial A_{x}}{\partial y}\Big)\psi=\frac{i\hbar q}{M^{2}c}B_{z}\psi .$$
   <p>Poiché vale per ogni funzione, è un&rsquo;identità fra operatori, e in generale $[V_{\alpha},V_{\beta}]=i\frac{\hbar q}{M^{2}c}\epsilon_{\alpha\beta\gamma}B_{\gamma}$: <i>«the commutator of two components of velocity is proportional to the magnetic field in the remaining direction»</i>. Compare il <span class="str" data-str="rotore">rotore</span> del potenziale, cioè il campo, e non il potenziale: il risultato è lo stesso in qualunque gauge.</p>`},
   {label:'Che cosa significa', body:R`
   <p>Landau ne trae la conseguenza fisica: <i>«vediamo che in un campo magnetico gli operatori delle tre componenti della velocità di una particella (carica) risultano non commutare fra di loro. Questo significa che la particella non può avere contemporaneamente valori determinati della velocità in tutt&rsquo;e tre le direzioni»</i>. In un campo lungo $z$, $V_{z}$ commuta con le altre due, mentre $V_{x}$ e $V_{y}$ si comportano, a meno di costanti, come una coordinata e un impulso. È il fatto da cui la tappa 05 ricava i livelli di Landau senza scegliere nessun potenziale.</p>`},
   {label:'La forza di Lorentz come operatore', body:R`
   <p>Ballentine calcola anche la derivata della velocità. Scrivendo $H=\tfrac12M\,\mathbf V\cdot\mathbf V+q\phi$ e usando il commutatore delle velocità,</p>
   $$M\frac{d\mathbf V}{dt}=\frac12\,\frac qc\,(\mathbf V\times\mathbf B-\mathbf B\times\mathbf V)+q\mathbf E .$$
   <p><i>«This is just the operator for the Lorentz force, the only complication being that the magnetic field operator $\mathbf B$ (and also the electric field operator $\mathbf E$) is a function of $\mathbf Q$, and so $\mathbf B$ does not commute with $\mathbf V$»</i>. Per un campo uniforme le due forme del prodotto vettoriale coincidono: la componente $x$ di $M\,d\mathbf V/dt$, calcolata con il solo commutatore, è $\frac qc BV_{y}$. Sakurai chiama la versione per i valori medi <i>«Ehrenfest&rsquo;s theorem, written in the Heisenberg picture, for the charged particle in the presence of $\mathbf E$ and $\mathbf B$»</i>, e Griffiths la fa ricavare nel problema 4.64: se i campi sono uniformi sul pacchetto, la massa per la derivata di $\langle\mathbf v\rangle$ è $q(\mathbf E+\langle\mathbf v\rangle\times\mathbf B)$.</p>`}
  ]},
  {t:'prosa', title:'La corrente di probabilità', tag:'continuità', html:R`
  <p>Con il potenziale vettore cambia anche la corrente che compare nell&rsquo;equazione di continuità. Sakurai la scrive come $\mathbf j=(\hbar/m)\,\mathrm{Im}(\psi^{*}\nabla\psi)-(e/mc)\mathbf A|\psi|^{2}$, <i>«which is just what we expect from the substitution»</i> $\nabla\to\nabla-ie\mathbf A/\hbar c$; Ballentine come la parte reale di $\psi^{*}\big(\mathbf P/M-q\mathbf A/Mc\big)\psi$; Weinberg con la derivata covariante. Le tre forme coincidono. Scrivendo la funzione d&rsquo;onda come $\sqrt\rho\,e^{iS/\hbar}$, la corrente diventa $\rho\,(\nabla S-e\mathbf A/c)/m$: la densità per la velocità costruita con la fase, corretta dal potenziale. E l&rsquo;integrale della corrente su tutto lo spazio è il valor medio dell&rsquo;impulso cinematico diviso per la massa, <i>«not canonical momentum»</i>, nota Sakurai.</p>
  <p>Che cosa dipende dalla scelta del potenziale e che cosa no? Ballentine lo riassume per la teoria classica: <i>«in the presence of a magnetic field the momentum $\mathbf p$ is not an observable quantity, but nevertheless it plays an important mathematical role»</i>. La posizione, la velocità, la corrente, l&rsquo;energia sono invarianti; l&rsquo;impulso canonico no. La tappa 03 dimostra queste affermazioni.</p>`}
]},
/* ---------------- 03 · L INVARIANZA DI GAUGE ---------------- */
{ num:'03', title:'L invarianza di gauge: cambiare potenziale e cambiare fase', meta:'lo zero del potenziale e una fase globale · le gabbie metalliche di Sakurai · i potenziali che danno gli stessi campi · l operatore che compensa · la hamiltoniana non e invariante ma le energie si · la gauge come cambio di base · due potenziali per lo stesso campo uniforme',
  blocchi:[
  {t:'prosa', title:'Il caso più semplice: una costante', tag:'Sakurai', html:R`
  <p>Sakurai costruisce l&rsquo;idea partendo da un caso banale. In meccanica classica lo zero dell&rsquo;energia potenziale non ha significato. In meccanica quantistica, se si usa $V(\mathbf x)+V_{0}$ al posto di $V(\mathbf x)$, il vettore di stato evolve con lo stesso operatore moltiplicato per $\exp[-iV_{0}(t-t_{0})/\hbar]$: le energie si spostano tutte di $V_{0}$, le frequenze di Bohr, che dipendono da differenze di energia, no. <i>«Trivial as it may seem, we see here the first example of a class of transformations known as gauge transformations»</i>: un cambio di convenzione sui potenziali accompagnato da un cambio di fase dello stato, cioè da un <span class="str" data-str="operatore-unitario">operatore unitario</span>. Se la costante dipende dal tempo, la fase diventa $\exp[-\frac i\hbar\int V_{0}(t')dt']$.</p>
  <p>Ma le differenze di potenziale hanno conseguenze, e Sakurai le fa vedere con un esperimento ideale. Un fascio di particelle cariche si divide in due, ciascuna parte entra in una gabbia metallica, e mentre i pacchetti sono dentro si accende fra le gabbie una differenza di potenziale. Dentro una gabbia il potenziale è uniforme, il campo elettrico è nullo, e nessuna forza agisce. Eppure i due pacchetti acquistano fasi diverse, la cui differenza $\phi_{1}-\phi_{2}$ è $\frac1\hbar\int[V_{2}(t)-V_{1}(t)]dt$, e quando si ricombinano l&rsquo;intensità contiene un termine in $\cos(\phi_{1}-\phi_{2})$. <i>«So despite the fact that the particle experiences no force, there is an observable effect that depends on whether $V_{2}(t)-V_{1}(t)$ has been applied. Notice that this effect is purely quantum-mechanical; in the limit $\hbar\to0$, the interesting interference effect gets washed out because the oscillation of the cosine becomes infinitely rapid»</i>.</p>`},
  {t:'plot', title:'Le gabbie di Sakurai',
   intro:R`<p>Intensità nella regione di interferenza, in unità arbitrarie, in funzione dell&rsquo;integrale nel tempo della differenza di potenziale diviso per $\hbar$ (blu), e la stessa curva con $\hbar$ dieci volte più piccolo (arancio).</p>`,
   plots:[{kind:'func2d', xr:[0,20], yr:[0,2.1], height:240, ticks:true,
     title:'interferenza senza forza',
     curves:[{f:'1+Math.cos(x)', col:'#5aa9ff', width:2.4, label:'hbar'},
             {f:'1+Math.cos(10*x)', col:'#ffb86b', width:1.4, label:'hbar / 10'}],
     xlabel:'(1/hbar) integrale (V2 - V1) dt', ylabel:'intensita'}],
   leggi:R`<p><b>Che cosa guardare.</b> La curva blu oscilla lentamente: un massimo ogni volta che la fase relativa aumenta di $2\pi$. Con $\hbar$ dieci volte più piccolo la stessa differenza di potenziale produce oscillazioni dieci volte più fitte.</p>
   <p><b>Che cosa impararne.</b> Al limite $\hbar\to0$ le frange diventano infinitamente fitte e qualunque rivelatore di dimensione finita ne vede solo la media: l&rsquo;effetto sparisce, ed è per questo che la meccanica classica non lo conosce.</p>`},
  {t:'reveal', title:'I potenziali elettromagnetici', tag:'derivazione', steps:[
   {label:'Gli stessi campi', body:R`
   <p>I campi $\mathbf E=-\nabla\phi-\frac1c\partial_{t}\mathbf A$ e $\mathbf B=\nabla\times\mathbf A$ non cambiano se</p>
   $$\mathbf A\to\mathbf A+\nabla\Lambda,\qquad\phi\to\phi-\frac1c\frac{\partial\Lambda}{\partial t},$$
   <p>con $\Lambda$ funzione arbitraria: il rotore di un gradiente è nullo, e nel campo elettrico i due termini aggiunti si cancellano. Sakurai fa un esempio che conviene ricordare: per un campo uniforme lungo $z$ vanno bene sia $\mathbf A=(-\tfrac12By,\tfrac12Bx,0)$ sia $\mathbf A=(-By,0,0)$, e il secondo si ottiene dal primo con $\Lambda=-\tfrac12Bxy$. La traiettoria classica è la stessa elica; ma $p_{x}$ si conserva con il secondo potenziale e non con il primo. <i>«In general, the canonical momentum $\mathbf p$ is not a gauge-invariant quantity»</i>, mentre l&rsquo;impulso cinematico sì.</p>`},
   {label:'L operatore che compensa', body:R`
   <p>Sakurai chiede che i valori medi di posizione e impulso cinematico e la norma non cambino, e cerca l&rsquo;operatore $\mathcal G$ che lega lo stato nel nuovo potenziale a quello nel vecchio. Deve commutare con $\mathbf x$ e, trasformato con $\mathcal G$, l&rsquo;impulso cinematico nel nuovo potenziale, $\mathbf p-e\mathbf A/c-e\nabla\Lambda/c$, deve diventare quello nel vecchio, $\mathbf p-e\mathbf A/c$. La soluzione è</p>
   $$\mathcal G=\exp\Big(\frac{ie\Lambda(\mathbf x)}{\hbar c}\Big),\qquad\mathcal G^{\dagger}\,\mathbf p\,\mathcal G=\mathbf p+\frac ec\nabla\Lambda .$$
   <p>Nella rappresentazione delle coordinate è una fase che cambia da punto a punto: $\tilde\psi(\mathbf x',t)=\exp[ie\Lambda(\mathbf x')/\hbar c]\,\psi(\mathbf x',t)$. La densità non cambia, e la fase $S$ della funzione d&rsquo;onda cambia di $e\Lambda/c$, esattamente quanto serve perché la corrente $\rho(\nabla S-e\mathbf A/c)/m$ resti la stessa: <i>«this is highly satisfactory because we see that the probability flux [...] is then gauge invariant»</i>.</p>`},
   {label:'L equazione di Schrödinger', body:R`
   <p>Ballentine fa la verifica sull&rsquo;equazione intera, con i potenziali dipendenti dal tempo. Il cuore è l&rsquo;identità (11.19),</p>
   $$\Big(\frac\hbar i\nabla-\frac qc\mathbf A'\Big)e^{iq\chi/\hbar c}\Psi=e^{iq\chi/\hbar c}\Big(\frac\hbar i\nabla-\frac qc\mathbf A\Big)\Psi,$$
   <p>dove il gradiente della fase compensa il termine in più nel potenziale; e dal lato del tempo la derivata della fase compensa il termine in più nel potenziale scalare. Le due equazioni, prima e dopo la trasformazione, differiscono per un fattore di fase comune, e sono equivalenti. Ballentine sottolinea che il nome «trasformazione di gauge» in meccanica quantistica spetta all&rsquo;insieme delle tre sostituzioni, potenziale vettore, potenziale scalare e funzione d&rsquo;onda, <i>«rather than (11.2)»</i>, che riguarda i soli potenziali.</p>`}
  ]},
  {t:'prosa', title:'Che cosa è invariante: quattro risposte', tag:'fonti', html:R`
  <p><b>Weinberg: la hamiltoniana no, le energie sì.</b> Weinberg osserva che la lagrangiana non è invariante, cambia per una derivata totale, $\frac{d}{dt}\sum\frac{e_{n}}{c}\alpha(\mathbf x_{n},t)$, ma l&rsquo;azione sì, e quindi le equazioni del moto. E che <i>«the Hamiltonian, though, is not gauge-invariant»</i>: nel nuovo potenziale vale $H'=UHU^{-1}+i\hbar\,(dU/dt)\,U^{-1}$, con $U$ la fase. Se i campi non dipendono dal tempo e la trasformazione nemmeno, il secondo termine sparisce, $H'$ è unitariamente equivalente a $H$ e <i>«in cases where energies are well defined, they are gauge-invariant»</i>. In nota aggiunge il caso $\alpha=\lambda t$: è un cambio della costante additiva del potenziale elettrostatico, e sposta tutte le energie di un sistema di carica totale $Q$ della stessa quantità $-\lambda Q/c$, come il potenziale costante di Sakurai.</p>
  <p><b>Ballentine: la velocità e il suo spettro.</b> Dall&rsquo;identità (11.19) segue che il valor medio della velocità è invariante e quello dell&rsquo;impulso no. Di più: se $\psi$ è autofunzione di $V_{z}$ in un potenziale, $e^{iq\chi/\hbar c}\psi$ lo è nell&rsquo;altro con lo stesso autovalore, quindi <i>«the operators $P_{z}-qA_{z}/c$ and $P_{z}-qA'_{z}/c$ must have the same eigenvalue spectrum»</i>, anche se come operatori sono diversi.</p>
  <p><b>Shankar: un cambio di base.</b> Shankar dimostra l&rsquo;invarianza con l&rsquo;integrale sui cammini, dove l&rsquo;azione cambia solo per termini agli estremi, e conclude che <i>«the effect of the gauge transformation is equivalent to a change in the coordinate basis»</i>: ogni autostato della posizione viene moltiplicato per una fase, $|\mathbf r\rangle\to e^{iq\Lambda(\mathbf r)/\hbar c}|\mathbf r\rangle$, <i>«which of course cannot change the physics»</i>. Detto così, la gauge non è una trasformazione dello stato, ma della base in cui lo si scrive.</p>
  <p><b>Landau, e gli appunti delle lezioni: una non univocità, o una covarianza.</b> Landau parla di <i>«una peculiare non univocità dovuta alla non univocità dei potenziali del campo»</i>, che <i>«non incide su nessuna grandezza che abbia un significato fisico (nella definizione della quale non entrano esplicitamente i potenziali)»</i>. Gli appunti delle lezioni di Martinelli e Testa notano che in meccanica quantistica la trasformazione di gauge cambia apparentemente l&rsquo;equazione di Schrödinger, ma che <i>«ora tutto è definito a meno di una trasformazione unitaria $U$ che alla fine mi permette di ottenere lo stesso risultato di partenza: si dice che ora ho una covarianza rispetto a queste trasformazioni»</i>. Covarianza, non invarianza: l&rsquo;equazione cambia forma insieme alla funzione d&rsquo;onda, e le grandezze fisiche no.</p>`}
]},
/* ---------------- 04 · LA FASE CHE OBBLIGA IL POTENZIALE ---------------- */
{ num:'04', title:'Letta all incontrario: perché una fase locale obbliga il potenziale vettore', meta:'una fase globale non si vede · una fase che cambia da punto a punto rompe l equazione libera · la derivata che la ripara · il campo come commutatore delle derivate · la storia del nome secondo Sakurai · che cosa le fonti dicono e che cosa no',
  blocchi:[
  {t:'prosa', title:'Il ragionamento', tag:'principio di gauge', html:R`
  <p>La tappa 03 è partita dai potenziali: si cambia $\mathbf A$ di un gradiente, e per non cambiare la fisica si deve cambiare la fase della funzione d&rsquo;onda. La stessa identità si può leggere nell&rsquo;altro verso, e questa lettura è quella che la mappa del corso indica come il cuore della voce: perché la fase locale obbliga il potenziale vettore.</p>
  <p>Si parte da una <span class="str" data-str="simmetrie">simmetria</span> che nessuno discute: un vettore di stato e lo stesso vettore moltiplicato per una fase costante $e^{i\alpha}$ descrivono lo stesso stato. Ci si chiede allora se si possa scegliere la fase separatamente in ogni punto, $\psi(\mathbf x)\to e^{i\alpha(\mathbf x)}\psi(\mathbf x)$. La densità $|\psi|^{2}$ non cambia; ma l&rsquo;equazione di Schrödinger libera sì, perché la derivata agisce anche sulla fase:</p>
   $$-i\hbar\nabla\big(e^{i\alpha}\psi\big)=e^{i\alpha}\big(-i\hbar\nabla+\hbar\nabla\alpha\big)\psi .$$
  <p>Compare un termine in più, $\hbar\nabla\alpha$, che dipende dalla scelta arbitraria della fase. Per eliminarlo bisogna cambiare la derivata: al posto di $\nabla$ si usa $\mathbf D=\nabla-\frac{iq}{\hbar c}\mathbf A$, con un campo vettoriale $\mathbf A$ che, quando la fase cambia di $\alpha$, cambia di $\frac{\hbar c}{q}\nabla\alpha$. Allora</p>
   $$\mathbf D'\big(e^{i\alpha}\psi\big)=e^{i\alpha}\,\mathbf D\psi,$$
  <p>e l&rsquo;equazione con $\mathbf D$ al posto di $\nabla$ è la stessa in ogni scelta di fase. Lo stesso ragionamento per la derivata temporale richiede un potenziale scalare che cambi di $-\frac\hbar q\partial_{t}\alpha$. Con $\Lambda=\frac{\hbar c}{q}\alpha$ queste sono esattamente le trasformazioni di gauge della tappa 03, e $-i\hbar\mathbf D$ è esattamente $\mathbf p-\frac qc\mathbf A$: l&rsquo;accoppiamento minimale è la forma che deve avere una derivata per essere indifferente alla scelta locale della fase.</p>`},
  {t:'reveal', title:'Che cosa il ragionamento dà, e che cosa no', tag:'analisi', steps:[
   {label:'Il campo come curvatura', body:R`
   <p>Il potenziale $\mathbf A$ dipende dalla scelta delle fasi, ma qualcosa di esso no. Due derivate covarianti non commutano, e il loro commutatore è</p>
   $$[D_{x},D_{y}]=-\frac{iq}{\hbar c}\Big(\frac{\partial A_{y}}{\partial x}-\frac{\partial A_{x}}{\partial y}\Big)=-\frac{iq}{\hbar c}B_{z},$$
   <p>che è invariante perché il rotore di un gradiente è nullo. Il campo magnetico è la parte del potenziale che nessuna scelta di fase può togliere. È lo stesso fatto del commutatore delle velocità della tappa 02, scritto con le derivate: $\mathbf V=-i\hbar\mathbf D/M$.</p>`},
   {label:'Che cosa non dà', body:R`
   <p>Il ragionamento dice che, se si vuole l&rsquo;indifferenza alla fase locale, serve un campo che si trasformi in quel modo e che entri nella derivata in quel modo. Non dice perché la natura debba avere questa indifferenza, che è un&rsquo;ipotesi; non dà le equazioni di Maxwell, che descrivono come il campo stesso si propaga; e non fissa il valore della carica $q$, che compare come una costante di accoppiamento. Dice però una cosa notevole: la stessa costante moltiplica il potenziale per tutte le particelle con la stessa carica, perché la trasformazione del potenziale è una sola.</p>`},
   {label:'Il legame con Shankar', body:R`
   <p>La lettura di Shankar della tappa 03, la gauge come cambio della base delle posizioni, rende il ragionamento quasi ovvio. La fase di ciascun autostato $|\mathbf r\rangle$ è una convenzione; chiedere che la fisica non dipenda da quella convenzione punto per punto è chiedere l&rsquo;indifferenza alla fase locale. Con la sola derivata ordinaria non si può, perché la derivata confronta i valori della funzione in punti vicini, le cui fasi sono state scelte indipendentemente. Il potenziale vettore è ciò che dice come confrontarle.</p>`}
  ]},
  {t:'prosa', title:'La storia del nome, e che cosa dicono le fonti', tag:'fonti', html:R`
  <p>Sakurai racconta perché si dice «gauge». In tedesco <i>Eichinvarianz</i>, invarianza di scala: <i>«historically, H. Weyl unsuccessfully attempted to construct a geometric theory of electromagnetism based on Eichinvarianz by identifying the scale function $\Sigma(\mathbf x)$ in (2.7.58) and (2.7.59) with the vector potential $\mathbf A$ itself»</i>. Weyl immaginava che andando da un punto a un punto vicino le lunghezze si riscalassero del fattore $1+\boldsymbol\Sigma\cdot d\mathbf x$. <i>«With the birth of quantum mechanics, V. Fock and F. London realized the importance of the gauge-invariant combination»</i> $\nabla-ie\mathbf A/\hbar c$, <i>«and they recalled Weyl&rsquo;s earlier work by comparing $\Sigma$ with $i$ times $\mathbf A$. We are stuck with the term gauge invariance even though the quantum-mechanical analogue [...] would actually correspond to &ldquo;phase change&rdquo; rather than to &ldquo;scale change&rdquo;»</i>.</p>
  <p>Le fonti del corso arrivano fino alla soglia di questo ragionamento senza svolgerlo come derivazione. Sakurai dà la storia e la combinazione invariante. Ballentine, discutendo l&rsquo;effetto Aharonov-Bohm, preferisce considerare fisicamente significativi i potenziali, <i>«since the Hamiltonian and the Schrödinger equation are naturally expressed in terms of the potentials. This view is also more in keeping with the modern non-Abelian gauge theories of fundamental processes»</i>, e nel §7.6 ricorda che in teoria dei campi la carica genera una regola di superselezione <i>«provided one assumes that all observables are invariant under gauge transformations»</i>. Weinberg, Picasso, Griffiths, Shankar e Landau partono dai potenziali e arrivano alla fase. La lettura all&rsquo;incontrario, svolta qui sopra, è la stessa identità della tappa 03 (la (11.19) di Ballentine, la (2.7.54) di Sakurai) letta a partire dalla fase: non aggiunge un fatto, cambia che cosa si considera primitivo.</p>`}
]},
/* ---------------- 05 · I LIVELLI DI LANDAU ---------------- */
{ num:'05', title:'Il campo uniforme: i livelli di Landau in tre modi, e la degenerazione in quanti di flusso', meta:'dalle velocita che non commutano senza scegliere il potenziale · nella gauge di Landau con un oscillatore spostato · i centri delle orbite che non commutano · un stato per ogni quanto di flusso · il livello piu basso fatto di funzioni analitiche · il momento angolare che misura la posizione del centro · lo spin e la quasi degenerazione',
  blocchi:[
  {t:'reveal', title:'Primo modo: senza scegliere il potenziale', tag:'Ballentine', steps:[
   {label:'Un oscillatore fatto di velocità', body:R`
   <p>Ballentine ricava i livelli prima di scegliere qualunque potenziale. Con il campo lungo $z$, la hamiltoniana è $H=H_{xy}+H_{z}$ con $H_{xy}=\tfrac12M(V_{x}^{2}+V_{y}^{2})$ e $H_{z}=\tfrac12MV_{z}^{2}$, e i due pezzi commutano perché $V_{z}$ commuta con le altre velocità. Poiché $[V_{x},V_{y}]=i\hbar qB/M^{2}c$ è un numero, ponendo $V_{x}=\gamma Q'$ e $V_{y}=\gamma P'$ con $\gamma=(\hbar|q|B/M^{2}c)^{1/2}$ si ha $[Q',P']=i$, e</p>
   $$H_{xy}=\frac12\,\frac{\hbar|q|B}{Mc}\,\big(P'^{2}+Q'^{2}\big),$$
   <p>che ha la forma di un oscillatore: <i>«note that $Q'$ and $P'$ are only formal symbols and do not represent the position and momentum of the particle»</i>. Gli autovalori sono $(n+\tfrac12)\hbar|\omega_{c}|$, con $\omega_{c}=qB/Mc$ la frequenza di ciclotrone, e l&rsquo;energia totale è</p>
   $$E_{n}(v_{z})=\Big(n+\frac12\Big)\hbar|\omega_{c}|+\frac12Mv_{z}^{2},\qquad n=0,1,2,\dots$$
   <p><i>«This result is independent of the particular vector potential that may be used to generate the prescribed magnetic field»</i>. Il moto lungo il campo è libero; quello trasversale, che classicamente è un cerchio percorso con frequenza $\omega_{c}$ qualunque sia il raggio, ha livelli discreti separati da $\hbar|\omega_{c}|$.</p>`}
  ]},
  {t:'reveal', title:'Secondo modo: nella gauge di Landau', tag:'Landau e Weinberg', steps:[
   {label:'Un oscillatore spostato', body:R`
   <p>Landau, nel 1930, sceglie un potenziale che dipende da una sola coordinata. Ballentine usa $A_{x}=-yB$, Landau e Weinberg $A_{y}=xB$, come il compito del 14-02-2020: sono la stessa scelta con gli assi scambiati. Con $\mathbf A=(-yB,0,0)$ la hamiltoniana non contiene $x$ e $z$, quindi $P_{x}$ e $P_{z}$ si conservano e si cerca $\Psi=e^{i(k_{x}x+k_{z}z)}\varphi(y)$. Il termine $(\hbar k_{x}+qBy/c)^{2}$ si riscrive come $(qB/c)^{2}(y-y_{0})^{2}$ con $y_{0}=-\hbar k_{x}c/qB$, e per $\varphi$ resta l&rsquo;equazione di un oscillatore di frequenza $|\omega_{c}|$ centrato in $y_{0}$: le autofunzioni sono <span class="str" data-str="polinomi-di-hermite">polinomi di Hermite</span> per una gaussiana di larghezza $a_{m}=(\hbar c/|q|B)^{1/2}$, la lunghezza magnetica.</p>`},
   {label:'Un impulso che è una posizione', body:R`
   <p>La funzione trovata è un&rsquo;onda piana in $x$ e un pacchetto localizzato in $y$: non somiglia per niente a un&rsquo;orbita circolare, e l&rsquo;energia non dipende da $k_{x}$. Ballentine scioglie l&rsquo;enigma: in questa gauge $\hbar k_{x}$ <i>«does not describe motion in the $x$ direction, but rather position in the $y$ direction!»</i>, e la funzione d&rsquo;onda descrive, grosso modo, un insieme di orbite circolari con i centri distribuiti uniformemente lungo la retta $y=y_{0}$. Landau dice lo stesso: <i>«la grandezza $y_{0}$, che si conserva nel caso quantistico, corrisponde alla coordinata classica $y$ del centro della circonferenza»</i>.</p>`},
   {label:'I centri delle orbite non commutano', body:R`
   <p>Classicamente il centro dell&rsquo;orbita è $x_{0}=x+v_{y}/\omega_{c}$, $y_{0}=y-v_{x}/\omega_{c}$, ed è una costante del moto. Ballentine definisce gli operatori corrispondenti, $X_{0}=Q_{x}+V_{y}/\omega_{c}$ e $Y_{0}=Q_{y}-V_{x}/\omega_{c}$, che commutano con $H$ in qualunque gauge. Ma non commutano fra loro: con i commutatori della tappa 02,</p>
   $$[X_{0},Y_{0}]=-\frac{i\hbar c}{qB},$$
   <p>e quindi $\Delta X_{0}\Delta Y_{0}\ge\tfrac12a_{m}^{2}$. Landau: <i>«gli operatori $\hat x_{0}$ e $\hat y_{0}$ non commutano fra di loro, cosicché le coordinate $x_{0}$ e $y_{0}$ non possono avere contemporaneamente valori determinati»</i>. Il centro dell&rsquo;orbita è una coppia di variabili coniugate, come posizione e impulso.</p>`}
  ]},
  {t:'prosa', title:'La degenerazione: un stato per quanto di flusso', tag:'conteggio', html:R`
  <p>L&rsquo;energia non dipende dalla posizione del centro, e i livelli sono enormemente degeneri. Ballentine li conta in un rettangolo $D_{x}\times D_{y}$ con condizioni periodiche: $k_{x}=2\pi n_{x}/D_{x}$, e il centro $y_{0}$ deve stare nel rettangolo, il che dà $D_{x}D_{y}/2\pi a_{m}^{2}$ stati per ogni $n$ e $k_{z}$. <i>«This result suggests a simple geometrical interpretation, namely that each state is associated with an area of magnitude $2\pi a_{m}^{2}$ in the plane perpendicular to the magnetic field»</i>. E poiché in un campo $B$ l&rsquo;area $2\pi a_{m}^{2}$ racchiude un flusso $\Phi_{0}=hc/q$, <i>«the degeneracy factor of a Landau level is simply equal to the number of units of magnetic flux passing through the system»</i>. Landau scrive lo stesso numero come $eBS/2\pi\hbar c$, Weinberg come $eB_{z}A/2\pi\hbar c$.</p>
  <p>Gli ordini di grandezza, per un elettrone in un campo di un tesla, in unità SI: la separazione fra i livelli $\hbar eB/m_{e}$ è circa $0{,}116$ meV, la lunghezza magnetica $\sqrt{\hbar/eB}$ circa $25{,}7$ nm, la degenerazione per unità di area $eB/h$ circa $2{,}42\cdot10^{10}$ stati per centimetro quadrato. È il numero che, nei sistemi bidimensionali di elettroni, decide quanti livelli di Landau sono pieni, e da cui viene l&rsquo;effetto Hall quantistico.</p>
  <p>Shankar descrive il livello più basso in una forma che le altre fonti non danno. Con il potenziale simmetrico e la coordinata complessa $z=x+iy$, le funzioni del livello più basso sono tutte e sole quelle della forma $u(z)\,e^{-|z|^{2}/4\ell^{2}}$ con $u$ analitica: una base è $z^{m}e^{-|z|^{2}/4\ell^{2}}$, $m=0,1,2,\dots$, e la densità di probabilità della funzione $m$-esima ha il massimo sul cerchio di raggio $\sqrt{2m}\,\ell$. In un disco di raggio $R$ entrano tante funzioni quanti quanti di flusso passano per il disco, lo stesso conteggio di Ballentine. E Ballentine mostra che in questa gauge il momento angolare ha un significato inatteso: $L_{z}=\frac{qB}{2c}(R_{0}^{2}-r_{c}^{2})$, dove $r_{c}^{2}$, con autovalori $a_{m}^{2}(2n+1)$, misura l&rsquo;energia, e $R_{0}^{2}$, con autovalori $a_{m}^{2}(2\ell+1)$, la distanza del centro dall&rsquo;origine: a energia fissata, <i>«it has little to do with rotational motion, but is instead related to the radial position of the orbit center»</i>.</p>`},
  {t:'plot', title:'Il ventaglio dei livelli con lo spin',
   intro:R`<p>Energie di un elettrone libero nel piano in funzione del campo, in unità di $\mu_{B}\cdot1\,\mathrm T$, con $g=2$: i livelli $(n+\tfrac12)\cdot2\mu_{B}B\pm\mu_{B}B$ coincidono a gruppi e danno le rette $2N\mu_{B}B$, $N=0,1,2,3$ (colori); in tratteggio grigio i livelli senza spin, $(n+\tfrac12)\cdot2\mu_{B}B$.</p>`,
   plots:[{kind:'func2d', xr:[0,5], yr:[0,20], height:270, ticks:true,
     title:'livelli di Landau con lo spin',
     curves:[{f:'0*x', col:'#5aa9ff', width:2.4, label:'N = 0 (un solo stato)'},
             {f:'2*x', col:'#ffb86b', width:2.4, label:'N = 1 (due)'},
             {f:'4*x', col:'#6bdc9b', width:2.4, label:'N = 2 (due)'},
             {f:'6*x', col:'#c49bff', width:2.4, label:'N = 3 (due)'},
             {f:'x', col:'#999999', width:1.2, label:'senza spin, n = 0'},
             {f:'3*x', col:'#999999', width:1.2, label:'senza spin, n = 1'}],
     xlabel:'B (tesla)', ylabel:'E / (mu_B 1 T)'}],
   leggi:R`<p><b>Che cosa guardare.</b> Con lo spin il livello più basso ha energia zero per ogni campo, e ogni livello superiore raccoglie due famiglie: lo stato con $n$ e spin su e quello con $n+1$ e spin giù. Senza spin i livelli sarebbero a metà strada.</p>
   <p><b>Che cosa impararne.</b> Landau lo nota esplicitamente: per l&rsquo;elettrone <i>«i livelli energetici coincidono per gli stati con numeri quantici $n$, $\sigma=1/2$ e $n+1$, $\sigma=-1/2$»</i>. Weinberg scrive le energie come $\hbar\omega(n+\tfrac12\pm\tfrac{1+\delta}2)$ e parla di <i>«a near degeneracy»</i>: la coincidenza è esatta solo per $g=2$, e il piccolo scarto $\delta$ la rompe. Il compito del 14-02-2020, nella tappa 11, è questo stesso spettro su una retta.</p>`},
  {t:'prosa', title:'Un numero di Weinberg da controllare', tag:'errata', html:R`
  <p>Weinberg scrive il momento magnetico dell&rsquo;elettrone come $-e\hbar(1+\delta)/2m_{e}c$ con <i>«$\delta=0.001165923(8)$»</i>. Ma per l&rsquo;elettrone la correzione è $0{,}00115965\ldots$: è quella che si ricava dal $g=2{,}002\,319\,304\,361\,82$ di Picasso, $(g-2)/2$, e quella di Shankar, che scrive $g/2=1{,}0011596521884$. Il numero di Weinberg, $0{,}0011659$, coincide invece con la correzione anomala del muone. Le due grandezze differiscono di circa lo $0{,}5\%$, e nella formula di Weinberg conta solo che $\delta$ sia piccolo; ma il valore stampato non è quello dell&rsquo;elettrone.</p>`}
]},
/* ---------------- 06 · L ATOMO NEL CAMPO ---------------- */
{ num:'06', title:'L atomo nel campo: Picasso divide la hamiltoniana, Ballentine avverte che la divisione non è invariante', meta:'il potenziale simmetrico e il momento angolare · il termine lineare e quello quadratico · gli ordini di grandezza a diecimila gauss · l effetto Zeeman normale e il teorema di Larmor · perche trascurare il termine quadratico e ambiguo · campo forte e campo debole con lo spin · il fattore di Lande',
  blocchi:[
  {t:'reveal', title:'Picasso: tre termini', tag:'Picasso', steps:[
   {label:'Il potenziale simmetrico', body:R`
   <p>Picasso sceglie, per un campo uniforme, il potenziale $\vec A=\tfrac12\vec B\wedge\vec r$, a divergenza nulla. Con questa scelta il termine misto si scrive con il momento angolare: per ogni elettrone $\vec A\cdot\vec p=\tfrac12(\vec B\wedge\vec q)\cdot\vec p=\tfrac12\vec B\cdot(\vec q\wedge\vec p)$, e la hamiltoniana dell&rsquo;atomo diventa la sua (13.52),</p>
   $$H=H_{0}+\frac{e}{2mc}\vec L\cdot\vec B+\frac{e^{2}}{8mc^{2}}\sum_{\alpha}(\vec q_{\alpha}\wedge\vec B)^{2},$$
   <p>con $\vec L$ il momento angolare orbitale totale degli elettroni. Per il campo lungo $z$ il termine quadratico è $\frac{e^{2}B^{2}}{8mc^{2}}\sum(x_{\alpha}^{2}+y_{\alpha}^{2})$: un potenziale che cresce con la distanza dall&rsquo;asse del campo.</p>`},
   {label:'Gli ordini di grandezza', body:R`
   <p>Picasso prende come riferimento $10^{4}$ gauss, un tesla, un campo che in laboratorio <i>«si possono realizzare abbastanza agevolmente»</i>. Il secondo termine produce effetti dell&rsquo;ordine del magnetone di Bohr per il campo, $\mu_{B}=e\hbar/2m_{e}c$, circa $5{,}8\cdot10^{-9}$ eV/gauss, quindi, come <span class="str" data-str="ordini-di-grandezza">ordine di grandezza</span>, $10^{-4}$ <span class="str" data-str="elettronvolt">elettronvolt</span>. Il terzo, <i>«che è il termine responsabile del diamagnetismo dell&rsquo;atomo»</i>, vale circa $e^{2}B^{2}a^{2}/8mc^{2}$ con $a$ la dimensione dell&rsquo;atomo; il rapporto con il secondo è $eBa^{2}/4\hbar c$, che con il raggio di Bohr e $10^{4}$ gauss vale circa $1{,}1\cdot10^{-6}$. La formula con cui Picasso scrive questo rapporto è illeggibile nel testo estratto; la sua conclusione è che <i>«per questo motivo ci sentiamo d&rsquo;ora in poi autorizzati a trascurare nella (13.52) il termine diamagnetico»</i>.</p>`},
   {label:'Lo Zeeman normale', body:R`
   <p>Senza il termine quadratico la hamiltoniana è $H_{0}+\mu_{B}BL_{z}/\hbar$, e poiché $H_{0}$ commuta con $\vec L$ il problema si risolve esattamente: i livelli sono $E^{0}+\mu_{B}BM$, con $-L\le M\le L$. Ogni livello si divide in $2L+1$ sottolivelli equidistanti, separati da $\mu_{B}B$ indipendentemente dal livello. Con le regole di selezione $\Delta M=0,\pm1$ ogni riga dello spettro si divide in tre, alla frequenza originale e spostate di $\pm\mu_{B}B/h$. Picasso osserva che $\mu_{B}B/h=eB/4\pi mc$ <i>«è proprio la frequenza di Larmor. Ciò dimostra che la scissione delle righe spettrali (effetto Zeeman), già nota prima dell&rsquo;avvento della meccanica quantistica, è spiegabile, e fu spiegata, anche in termini classici»</i>. E subito dopo: <i>«il fatto è che però gli esperimenti confermano solo parzialmente quanto trovato»</i>.</p>`}
  ]},
  {t:'prosa', title:'Ballentine: una divisione che non è invariante', tag:'Ballentine', html:R`
  <p>Ballentine fa lo stesso conto con lo stesso potenziale, ottiene la stessa hamiltoniana (11.48), e lo stesso spostamento al primo ordine $e\hbar Bm/2Mc$. Poi aggiunge: <i>«although the calculation leading to (11.49) appears very simple, the approximation that was made is not above suspicion. We have, in effect, neglected the $A^{2}$ term in (11.46) compared with the term that is linear in $A$. But the division between those two terms is not gauge-invariant, and so the effect of neglecting the second order term is ambiguous»</i>. Si potrebbe dire che, scelto il potenziale simmetrico, si trascura un termine del secondo ordine in $B$; ma quel termine cresce come il quadrato della distanza dall&rsquo;asse, e <i>«becomes arbitrarily large at large distances, no matter how small $B$ may be, and so its neglect is not obviously justified»</i>.</p>
  <p>Che cosa salva il conto di Picasso? <i>«In this particular problem, we are saved by the fact that the eigenfunctions $\Psi_{n\ell m}$ decay exponentially at large distances, and this overpowers the divergence of $(\mathbf B\times\mathbf x)^{2}$. But, in general, an expansion in powers of $B$ can be very dangerous, no matter how small $B$ may be. For example, the eigenfunction (11.29) for an unbound particle in a magnetic field has no reasonable limit for $B\to0$»</i>: la gaussiana larga $a_{m}$ diventa infinitamente larga, e non tende a nessuna funzione della particella libera. Le due fonti non sono in contraddizione: Picasso fa il conto giusto per gli stati legati, Ballentine spiega perché è giusto e quando non lo sarebbe. È lo stesso avvertimento che Ballentine dà nella tappa 01 sulla lettura termine per termine della hamiltoniana.</p>
  <p>Per campi molto forti il termine quadratico domina, e il potenziale dell&rsquo;atomo diventa la perturbazione. Il termine $\frac{e^{2}}{8Mc^{2}}B^{2}\rho^{2}$, con $\rho$ la distanza dall&rsquo;asse, <i>«has the form of an attractive potential that increases in proportion to the square of the perpendicular distance from the axis of symmetry [...] Its effect is to squeeze the atom into a thin elongated shape»</i>. I livelli del moto trasversale sono allora $\hbar\omega_{c}[n+\tfrac12(m+|m|)+\tfrac12]$, la (11.52), degeneri in tutti gli $m\le0$: sono i livelli di Landau della tappa 05 scritti nella base del momento angolare.</p>`},
  {t:'reveal', title:'Con lo spin: campo forte e campo debole', tag:'Picasso', steps:[
   {label:'Perché g non può essere 1', body:R`
   <p>Picasso aggiunge il momento magnetico dello spin, $g\,\mu_{B}\vec S/\hbar$, e mostra prima che $g=1$ non funzionerebbe: la hamiltoniana diventerebbe $H_{at}+\mu_{B}BJ_{z}/\hbar$, che si risolve esattamente perché $J_{z}$ commuta con tutto, e darebbe di nuovo tre righe: <i>«si ritrova così l&rsquo;effetto Zeeman normale e resta inspiegato l&rsquo;effetto Zeeman anomalo»</i>. Con $g=2$ il termine $\mu_{B}B(L_{z}+2S_{z})/\hbar$ non commuta con l&rsquo;interazione spin-orbita contenuta in $H_{at}$, e il problema non è più risolubile esattamente.</p>`},
   {label:'Campo forte', body:R`
   <p>Se il campo è così forte che $\mu_{B}B$ supera di molto le separazioni di struttura fine, la spin-orbita si trascura e i livelli sono $E_{LS}+\mu_{B}B(M+2S_{z})$. Per l&rsquo;idrogeno le note del corso sullo spin scrivono $E_{n,l,m_{l},m_{s}}=E_{n}+\mu_{B}B(m_{l}+2m_{s})$, e osservano che dentro lo stesso $n$ i livelli sono equispaziati di $\mu_{B}B$: per $n=2$ i valori di $m_{l}+2m_{s}$ vanno da $-2$ a $2$. Picasso nota che per il litio, dove la separazione fra $2^{2}P_{1/2}$ e $2^{2}P_{3/2}$ è di circa $0{,}4\cdot10^{-4}$ eV, serve un campo molto maggiore di $10^{4}$ gauss; per gli atomi più pesanti è ancora peggio.</p>`},
   {label:'Campo debole e fattore di Landé', body:R`
   <p>Se invece $\mu_{B}B$ è piccolo rispetto alla struttura fine, come per il doppietto del sodio, separato di circa $2\cdot10^{-3}$ eV, la perturbazione si calcola dentro ciascun livello di $J$ fissato, dove $S_{z}$ ha lo stesso valor medio di $\frac{\vec S\cdot\vec J}{J(J+1)\hbar^{2}}J_{z}$. I livelli sono $E_{J}+\mu_{B}Bg_{J}J_{z}/\hbar$, con il fattore di Landé</p>
   $$g_{J}=1+\frac{J(J+1)+S(S+1)-L(L+1)}{2J(J+1)} .$$
   <p>Per un elettrone vale $2$ nel livello $^{2}S_{1/2}$, $\tfrac23$ nel $^{2}P_{1/2}$, $\tfrac43$ nel $^{2}P_{3/2}$: le separazioni fra sottolivelli cambiano da livello a livello, e le righe si dividono in più di tre componenti non equidistanti. È l&rsquo;effetto Zeeman anomalo.</p>`}
  ]},
  {t:'plot', title:'L idrogeno n = 2 in campo forte',
   intro:R`<p>Spostamenti dei sottolivelli del livello $n=2$ dell&rsquo;idrogeno in campo forte, $\mu_{B}B(m_{l}+2m_{s})$, in unità di $\mu_{B}\cdot1\,\mathrm T$, in funzione del campo in tesla: le rette con pendenza da $-2$ a $2$.</p>`,
   plots:[{kind:'func2d', xr:[0,3], yr:[-6.5,6.5], height:260, ticks:true,
     title:'Paschen-Back per n = 2',
     curves:[{f:'2*x', col:'#5aa9ff', width:2.0, label:'+2 (2p, m=1, su)'},
             {f:'x', col:'#ffb86b', width:2.0, label:'+1 (2s su; 2p m=0 su)'},
             {f:'0*x', col:'#6bdc9b', width:2.0, label:'0 (2p m=1 giu; 2p m=-1 su)'},
             {f:'-x', col:'#ffb86b', width:2.0, label:'-1 (2s giu; 2p m=0 giu)'},
             {f:'-2*x', col:'#5aa9ff', width:2.0, label:'-2 (2p, m=-1, giu)'}],
     xlabel:'B (tesla)', ylabel:'spostamento / (mu_B 1 T)'}],
   leggi:R`<p><b>Che cosa guardare.</b> Gli otto stati del livello $n=2$ si distribuiscono su cinque rette equispaziate: le pendenze $\pm1$ raccolgono due stati ciascuna (uno $2s$ e un $2p$ con $m_{l}=0$), la pendenza zero due stati $2p$ con $m_{l}$ e $m_{s}$ di segno opposto, le pendenze $\pm2$ uno stato ciascuna, il $2p$ con $m_{l}$ e $m_{s}$ dello stesso segno.</p>
   <p><b>Che cosa impararne.</b> Il fattore due dello spin rende le pendenze intere e il ventaglio regolare, come dicono le note; in campo debole la spin-orbita mescola $m_{l}$ e $m_{s}$, e le pendenze diventano $g_{J}m_{J}$, frazionarie.</p>`}
]},
/* ---------------- 07 · MOMENTO MAGNETICO E PRECESSIONE ---------------- */
{ num:'07', title:'Il momento magnetico e la precessione del momento angolare', meta:'la spira e il rapporto giromagnetico · una coppia che fa precedere invece di allineare · il momento orbitale in meccanica quantistica · il momento di spin per simmetria · g uguale a 2 e le sue correzioni · nucleoni · vettori assiali e momento di dipolo elettrico · il modello vettoriale e Lande · la precessione di Thomas',
  blocchi:[
  {t:'reveal', title:'La precessione classica, con Shankar', tag:'Shankar', steps:[
   {label:'Dalla spira all orbita', body:R`
   <p>Shankar parte dalla magnetostatica: una piccola spira percorsa da corrente in un campo uniforme subisce una coppia $\boldsymbol\mu\times\mathbf B$, con $\boldsymbol\mu$ il momento magnetico, e la sua energia di interazione è $-\boldsymbol\mu\cdot\mathbf B$. Una carica $q$ di massa $m$ su un&rsquo;orbita circolare di raggio $r$ con velocità $v$ è una spira con corrente $qv/2\pi r$ e area $\pi r^{2}$, quindi $\mu=qvr/2c$; poiché il momento angolare è $l=mvr$, il rapporto $\mu/l$, il rapporto giromagnetico, vale $\gamma=q/2mc$ qualunque sia l&rsquo;orbita.</p>`},
   {label:'Precedere, non allinearsi', body:R`
   <p>Una spira qualunque verrebbe ruotata dalla coppia fino ad allineare $\boldsymbol\mu$ con $\mathbf B$. <i>«This picture changes when $\boldsymbol\mu$ has its origin in angular momentum»</i>: l&rsquo;equazione del moto dà per la derivata di $\mathbf l$ il vettore $\gamma\,\mathbf l\times\mathbf B$, la variazione è perpendicolare a $\mathbf l$, e in un tempo $\Delta t$ la punta del vettore si sposta di $\gamma lB\sin\theta\,\Delta t$ su un cerchio di raggio $l\sin\theta$. Il momento angolare precede attorno al campo, con l&rsquo;angolo $\theta$ costante, alla frequenza $\omega=\gamma B$, indipendente dall&rsquo;angolo. È il giroscopio delle note del corso sullo spin e dell&rsquo;argomento di Stern del 1921.</p>`},
   {label:'Il momento orbitale in meccanica quantistica', body:R`
   <p>In meccanica quantistica il momento magnetico orbitale non si postula: si legge nella hamiltoniana. Con il potenziale simmetrico e trascurando il termine quadratico, il termine di interazione è $-\frac{q}{2mc}\mathbf L\cdot\mathbf B$, cioè $-\boldsymbol\mu\cdot\mathbf B$ con $\boldsymbol\mu=\frac{q}{2mc}\mathbf L$, <i>«exactly as in the classical case»</i>. Per l&rsquo;elettrone, con $q=-e$, è $-\frac{e}{2m_{e}c}\mathbf L$, la (13.58) di Picasso. E con il teorema di Ehrenfest $\langle\mathbf L\rangle$ precede attorno al campo come il vettore classico.</p>`}
  ]},
  {t:'plot', title:'Energia di un momento in un campo',
   intro:R`<p>Energia $-\mu B\cos\theta$ di un momento magnetico classico in funzione dell&rsquo;angolo con il campo, in unità $\mu B$ (blu), e le due sole energie permesse per un momento di spin un mezzo, $\mp\mu B$ (arancio e verde).</p>`,
   plots:[{kind:'func2d', xr:[0,180], yr:[-1.2,1.2], height:230, ticks:true,
     title:'continuo classico e due livelli quantistici',
     curves:[{f:'-Math.cos(x*Math.PI/180)', col:'#5aa9ff', width:2.4, label:'classico: -mu B cos theta'},
             {f:'-1+0*x', col:'#ffb86b', width:2.0, label:'spin parallelo al momento lungo B'},
             {f:'1+0*x', col:'#6bdc9b', width:2.0, label:'spin antiparallelo'}],
     xlabel:'theta (gradi)', ylabel:'E / (mu B)'}],
   leggi:R`<p><b>Che cosa guardare.</b> La curva classica prende ogni valore fra $-1$ e $1$; le due rette sono i soli valori quantistici, gli estremi della curva.</p>
   <p><b>Che cosa impararne.</b> Classicamente un momento che precede conserva l&rsquo;angolo e quindi l&rsquo;energia, qualunque essa sia; quantisticamente l&rsquo;energia ha due soli valori, e la precessione è quella dei valori medi, fra stati che sono sovrapposizioni dei due.</p>`},
  {t:'prosa', title:'Il momento di spin', tag:'g = 2', html:R`
  <p>Per lo spin Shankar usa un argomento di simmetria: ogni operatore sullo spazio di spin è combinazione dell&rsquo;identità e delle tre componenti dello spin, e un operatore vettoriale non può contenere l&rsquo;identità, quindi $\boldsymbol\mu=\gamma\mathbf S$. Scritto come $\gamma=-g\,e/2mc$, <i>«our present formalism does not tell us what $g$ is; to find it we must confront the above $H$ with experiment»</i>, e il valore sperimentale è molto vicino a due. <i>«Why is $g=2$? And why isn&rsquo;t it exactly equal to 2, which would be much prettier? Our formalism doesn&rsquo;t tell us»</i>: l&rsquo;equazione di Dirac dà due esattamente, l&rsquo;elettrodinamica quantistica le correzioni, in serie di potenze di $\alpha$. Shankar riporta il valore misurato, $g=2\,[1{,}0011596521884]$, e il paragone di Feynman: l&rsquo;accordo fra teoria ed esperimento equivale a misurare la distanza fra New York e Los Angeles a meno dello spessore di un capello.</p>
  <p>Per i nucleoni la situazione è diversa. Landau dà i momenti misurati in magnetoni nucleari, $e\hbar/2m_{p}c$: <i>«2,79 magnetoni nucleari, essendo il momento magnetico parallelo allo spin»</i> per il protone, e per il neutrone un momento <i>«antiparallelo allo spin ed uguale a 1,91 magnetone nucleare»</i>. Shankar li scrive come rapporti giromagnetici, circa $5{,}6$ e $-3{,}8$ in unità $e/2Mc$, il doppio dei numeri di Landau. Un neutrone, neutro, ha un momento magnetico: Shankar lo spiega con il fatto che può trovarsi in stati che contengono particelle cariche le cui cariche si compensano e i cui momenti no.</p>
