var STRUM = {};
STRUM["gradiente"] = {"nome":"Gradiente","riga":"Il vettore $\\nabla f=(\\partial_xf,\\partial_yf,\\partial_zf)$: punta nella direzione in cui $f$ cresce più in fretta, e il suo modulo è quel tasso di crescita.","serve":"Trasforma una funzione scalare in un campo vettoriale, e lo fa in modo che la derivata di $f$ lungo una direzione $\\hat u$ sia $\\nabla f\\cdot\\hat u$: il gradiente contiene tutte le derivate direzionali in un oggetto solo. La proprietà che si usa per disegnare è l'altra: il gradiente è perpendicolare alle superfici di livello di $f$, quindi conoscere il potenziale basta a sapere dove vanno le linee di campo.","esempio":"Per $f(x,y,z)=x^{2}+y^{2}+z^{2}$ il gradiente è $(2x,2y,2z)$, cioè $2\\mathbf r$: radiale, quindi perpendicolare alle sfere di livello, come dev'essere. Le superfici $f=\\text{cost}$ sono sfere e il gradiente le buca ad angolo retto.","pieno":{"file":"04-campi-vettoriali.html","tappa":"02","come":"l'operatore $\\nabla$, le derivate direzionali e l'ortogonalità ai livelli, nel nucleo sui campi vettoriali"},"qui":{"elettromagnetismo":{"serve":"Il campo elettrostatico è meno il gradiente del potenziale, $\\mathbf E=-\\nabla V$, e il segno meno dice che $\\mathbf E$ punta verso i potenziali decrescenti — dove una carica positiva scivolerebbe da sola. Poiché il gradiente è ortogonale alle superfici di livello, le linee di campo sono ovunque perpendicolari alle equipotenziali: è il modo più rapido per disegnare un campo di cui si conosce il potenziale, e l'unico controllo veloce su un disegno sbagliato.","esempio":"Per la carica puntiforme il potenziale è $V=\\dfrac{q}{4\\pi\\varepsilon_0 r}$, e la componente radiale del campo è $-\\dfrac{dV}{dr}=\\dfrac{q}{4\\pi\\varepsilon_0r^{2}}$: il potenziale va come $1/r$, il campo come $1/r^{2}$, e il quadrato nasce dalla derivata, non da un'ipotesi in più. Chi ricorda solo una delle due formule può sempre ricavare l'altra."}},"controllo":[{"tipo":"derivata","espr":"x**2+y**2+z**2","rispetto":["x"],"vale":"2*x","dove":"esempio","appare":"(2x,2y,2z)"},{"tipo":"derivata","espr":"x**2+y**2+z**2","rispetto":["z"],"vale":"2*z","dove":"esempio","appare":"2\\mathbf r"},{"tipo":"derivata","espr":"-q/(4*pi*e0*r)","rispetto":["r"],"vale":"q/(4*pi*e0*r**2)","dove":"qui.elettromagnetismo.esempio","appare":"\\dfrac{q}{4\\pi\\varepsilon_0r^{2}}"}]};
STRUM["ordini-di-grandezza"] = {"nome":"Ordini di grandezza","riga":"Stimare una quantità alla potenza di dieci giusta: si tiene una cifra significativa, si sommano e si sottraggono gli esponenti, e si controlla che l'unità del risultato sia quella che si voleva.","serve":"A sapere se un risultato è plausibile prima di averlo calcolato con precisione, e ad accorgersi di un errore di impostazione quando c'è ancora tempo per rimediare. In astrofisica non è una comodità ma il modo normale di ragionare, per due ragioni: le grandezze in gioco vanno da $10^{-36}$ kg a $10^{53}$ kg e nessuna intuizione le copre, e i dati osservativi sono noti al dieci o al venti per cento, quindi una cifra significativa è spesso tutto ciò che il problema contiene davvero. Il controllo che smaschera più errori non è sul numero, è sull'**unità**: un conto che dovrebbe dare una densità e dà dei kg è sbagliato nell'impostazione, e nessun affinamento dell'aritmetica lo salverà. La seconda regola è il confronto con un termine noto — l'acqua per una densità, il Sole per una massa o una luminosità, il parsec per una distanza galattica — perché un numero senza metro non dice niente.","esempio":"Densità media del Sole, dalle due sole quantità stampate in calce al foglio d'esame, $M_\\odot=1{,}989\\cdot10^{30}$ kg e $R_\\odot=6{,}957\\cdot10^{8}$ m: $\\rho=\\dfrac{3M_\\odot}{4\\pi R_\\odot^{3}}=1410\\ \\mathrm{kg/m^3}$. Il confronto è immediato e istruttivo: è quasi una volta e mezza l'acqua, cioè il Sole è in media meno denso della Terra — una stella non è un sasso grande, è un gas tenuto insieme dal proprio peso.","pieno":{"file":"as-01-la-scala-del-cosmo.html","tappa":"01","come":"la gerarchia delle strutture cosmiche letta come scala di ordini di grandezza, e il tempo di luce come secondo asse della stessa tabella"},"controllo":[{"tipo":"numero","espr":"3*1.989e30/(4*pi*(6.957e8)**3)","vale":"1410","dove":"esempio","appare":"1410"}]};
STRUM["prodotto-tensoriale"] = {"nome":"Prodotto tensoriale","riga":"Lo spazio di due sistemi e' $\\mathcal H_1\\otimes\\mathcal H_2$, di dimensione pari al PRODOTTO delle due e non alla somma, con base fatta dai prodotti degli elementi delle due basi.","serve":"E' il motivo per cui la meccanica quantistica non e' una teoria di particelle indipendenti messe accanto. La dimensione cresce come il prodotto, quindi la stragrande maggioranza degli stati non si scrive come prodotto di due stati singoli: quelli che non si scrivono cosi' sono gli stati entangled, e sono la regola, non l'eccezione.","esempio":"Due spin un mezzo: ogni fattore ha dimensione due, il prodotto ne ha $2\\cdot2=4$. Gli stati fattorizzati sono parametrizzati da due punti sulla sfera di Bloch, cioe' da quattro parametri reali, mentre lo spazio totale ne ha $2\\cdot4-2=6$: restano due dimensioni di stati che non si fattorizzano, e il singoletto e' uno di quelli.","debito":"la matrice densita' ridotta e la quantificazione dell'entanglement (entropia di von Neumann) non stanno qui: questa scheda da' la struttura, non la misura.","controllo":[{"tipo":"uguale","sinistra":"2*2","vale":"4","dove":"esempio","appare":"2\\cdot2=4"},{"tipo":"uguale","sinistra":"2*4-2","vale":"6","dove":"esempio","appare":"2\\cdot4-2=6"}],"qui":{},"pieno":null};
STRUM["matrici-di-pauli"] = {"nome":"Matrici di Pauli","riga":"Sono le tre matrici $2\\times2$ hermitiane a traccia nulla il cui quadrato e' l'identita' e il cui commutatore riproduce l'algebra del momento angolare, da cui lo spin $\\hat S_i=\\tfrac{\\hbar}{2}\\sigma_i$.","serve":"Sono la rappresentazione piu' piccola non banale del momento angolare, e insieme all'identita' formano una base di tutte le matrici due per due hermitiane: qualunque osservabile di un sistema a due stati e' una combinazione dell'identita' e delle tre. Ogni conto di spin un mezzo — Stern-Gerlach, precessione, risonanza magnetica, qubit — si riduce alla loro algebra.","esempio":"Siccome il quadrato di una combinazione unitaria delle tre e' l'identita', qualunque esponenziale collassa: l'operatore di rotazione dello spinore diventa $\\cos(\\theta/2)$ per l'identita' meno $i\\sin(\\theta/2)$ per la combinazione. Il mezzo nell'angolo e' la ragione per cui una rotazione di un giro intero cambia segno allo stato, perche' $\\cos(\\pi)=-1$.","debito":"la costruzione generale delle rappresentazioni di SU(2) e il suo legame con SO(3) stanno nel movimento sul momento angolare; qui c'e' il caso di spin un mezzo con le sue regole di calcolo.","controllo":[{"tipo":"uguale","sinistra":"cos(2*pi/2)","vale":"-1","dove":"esempio","appare":"\\cos(\\pi)=-1"},{"tipo":"uguale","sinistra":"cos(pi/3)**2+sin(pi/3)**2","vale":"1","dove":"esempio","appare":"\\sin(\\theta/2)"}],"qui":{},"pieno":null};
STRUM["traccia"] = {"nome":"Traccia di un operatore","riga":"La traccia e' la somma degli elementi diagonali, $\\operatorname{tr}\\hat A=\\sum_i\\langle i|\\hat A|i\\rangle$, e non dipende dalla base ortonormale scelta perche' e' invariante per permutazione ciclica: $\\operatorname{tr}(\\hat A\\hat B)=\\operatorname{tr}(\\hat B\\hat A)$, da cui $\\operatorname{tr}(\\hat U^{\\dagger}\\hat A\\hat U)=\\operatorname{tr}\\hat A$.","serve":"E' il modo di estrarre un numero da un operatore senza privilegiare una rappresentazione. Il valor medio di un'osservabile su uno stato si scrive $\\langle A\\rangle=\\operatorname{tr}(\\rho\\hat A)$ con $\\rho=|\\psi\\rangle\\langle\\psi|$, e questa forma — a differenza di $\\langle\\psi|\\hat A|\\psi\\rangle$ — vale identica per gli stati misti, dove $\\rho$ non e' piu' un proiettore: e' la porta verso la matrice densita' e la decoerenza.","esempio":"Per $A=\\begin{pmatrix}1&2\\\\3&4\\end{pmatrix}$ e $B=\\begin{pmatrix}0&1\\\\1&0\\end{pmatrix}$, pur essendo $AB\\neq BA$, le due tracce coincidono: $AB=\\begin{pmatrix}2&1\\\\4&3\\end{pmatrix}$ da' $\\operatorname{tr}(AB)=2+3=5$, mentre $BA=\\begin{pmatrix}3&4\\\\1&2\\end{pmatrix}$ da' $\\operatorname{tr}(BA)=3+2=5$. La traccia di un proiettore di rango uno vale $1$, e in generale la traccia di un proiettore e' la dimensione del sottospazio su cui proietta.","debito":"la traccia di un operatore in dimensione infinita esiste solo per la classe degli operatori a traccia (totalmente continui), e la costruzione rigorosa — $\\operatorname{tr}(\\hat A^{\\dagger}\\hat A)=\\sum_\\mu\\|\\hat A\\phi_\\mu\\|^2$ indipendente dalla base, von Neumann cap. II.11 — qui si cita. Si lavora col caso in cui la somma converge.","controllo":[{"tipo":"uguale","sinistra":"(Matrix([[1,2],[3,4]])*Matrix([[0,1],[1,0]])).trace()","vale":"5","dove":"esempio","appare":"\\operatorname{tr}(AB)=2+3=5"},{"tipo":"uguale","sinistra":"(Matrix([[0,1],[1,0]])*Matrix([[1,2],[3,4]])).trace()","vale":"5","dove":"esempio","appare":"\\operatorname{tr}(BA)=3+2=5"},{"tipo":"uguale","sinistra":"Matrix([[1,2],[3,4]])*Matrix([[0,1],[1,0]])","vale":"Matrix([[2,1],[4,3]])","dove":"esempio","appare":"AB=\\begin{pmatrix}2&1\\\\4&3\\end{pmatrix}"},{"tipo":"uguale","sinistra":"Matrix([[0,1],[1,0]])*Matrix([[1,2],[3,4]])","vale":"Matrix([[3,4],[1,2]])","dove":"esempio","appare":"BA=\\begin{pmatrix}3&4\\\\1&2\\end{pmatrix}"}],"qui":{},"pieno":null};
STRUM["proiezione-stereografica"] = {"nome":"Proiezione stereografica","riga":"Da un polo si proietta la sfera sul piano tangente al polo opposto: $\\sigma(x,y,z)=\\left(\\frac{x}{1-z},\\frac{y}{1-z}\\right)$ è un diffeomorfismo fra $S^{2}$ meno il polo nord e $\\mathbb{R}^{2}$, e la stessa formula funziona in ogni dimensione.","serve":"È la carta con cui si dimostra che la sfera è una varietà — due proiezioni, dai due poli, coprono tutto — ed è per questo la prima costruzione concreta del corso. Le due proprietà per cui la si sceglie fra tutte le mappe possibili sono che è **conforme** (conserva gli angoli, non le distanze) e che **manda circonferenze in circonferenze o rette**: una circonferenza che passa per il polo di proiezione diventa una retta, tutte le altre restano circonferenze. La seconda proprietà è ciò che la rende insostituibile quando si visualizza $S^{3}$: le fibre della fibrazione di Hopf sono cerchi, e dopo la proiezione restano cerchi — tranne una, quella che passa per il polo tolto, che diventa una retta. Il prezzo è che un punto va perso, e questo non è un difetto della carta ma un teorema: $S^{n}$ è compatta e $\\mathbb{R}^{n}$ no, quindi nessuna carta può coprire tutto.","esempio":"Il conto che si rifà ogni volta è la norma dell'immagine. Per $(x,y,z)\\in S^{2}$ vale $x^{2}+y^{2}=1-z^{2}$, quindi $\\lVert\\sigma(x,y,z)\\rVert^{2}=\\frac{1-z^{2}}{(1-z)^{2}}=\\frac{1+z}{1-z}$, dove la semplificazione è la differenza di quadrati. Da qui si legge tutto senza altri conti: l'equatore $z=0$ va nella circonferenza di raggio $1$, perché $\\frac{1+0}{1-0}=1$; l'emisfero sud $z\\lt0$ finisce dentro il disco unitario; avvicinandosi al polo nord $z\\to1$ la norma esplode, ed è il punto che manca. Il polo sud $z=-1$ va nell'origine, come dev'essere: $\\frac{1-1}{1+1}=0$.","debito":"la conformità e la proprietà «cerchi in cerchi» sono qui dichiarate e non dimostrate: la prima si prova calcolando la metrica indotta, che risulta un multiplo di quella euclidea, e la seconda si prova osservando che la proiezione è la restrizione di un'inversione. Entrambe stanno in Lee, cap. 1, e nessuna delle due serve per i conti del percorso.","controllo":[{"tipo":"uguale","sinistra":"1-z**2","vale":"(1-z)*(1+z)","dove":"esempio","appare":"1-z^{2}"},{"tipo":"uguale","sinistra":"(1-z**2)/(1-z)**2","vale":"(1+z)/(1-z)","dove":"esempio","appare":"\\frac{1+z}{1-z}"},{"tipo":"uguale","sinistra":"(1+0)/(1-0)","vale":"1","dove":"esempio","appare":"\\frac{1+0}{1-0}=1"},{"tipo":"uguale","sinistra":"(1-1)/(1+1)","vale":"0","dove":"esempio","appare":"\\frac{1-1}{1+1}=0"}]};
STRUM["operatore-unitario"] = {"nome":"Operatore unitario","riga":"Un operatore $\\hat U$ e' unitario quando $\\hat U^{\\dagger}\\hat U=\\hat U\\hat U^{\\dagger}=\\mathbb 1$, cioe' $\\hat U^{\\dagger}=\\hat U^{-1}$, il che equivale a conservare il prodotto interno: $\\langle \\hat U\\phi|\\hat U\\psi\\rangle=\\langle\\phi|\\psi\\rangle$ per ogni coppia di stati.","serve":"Conservare il prodotto interno vuol dire conservare le probabilita': ogni trasformazione fisica che non cambia gli esiti di una misura — un cambio di base, una traslazione, una rotazione, l'evoluzione temporale — e' unitaria. I suoi autovalori hanno modulo uno, e due osservabili legate da un operatore unitario hanno lo stesso spettro.","esempio":"La rotazione del piano $\\hat U=\\begin{pmatrix}\\cos\\theta&-\\sin\\theta\\\\\\sin\\theta&\\cos\\theta\\end{pmatrix}$ e' unitaria — il prodotto $\\hat U^{\\dagger}\\hat U$ ha sulla diagonale $\\cos^2\\theta+\\sin^2\\theta=1$ e zero fuori — e ha autovalori $e^{\\pm i\\theta}$, di modulo $|e^{i\\theta}|=1$. La matrice $S$ del cambio di base ortonormale e' unitaria per lo stesso motivo: manda una base ortonormale in un'altra.","debito":"la trasformata di Cayley $\\hat U=(\\hat A-i)/(\\hat A+i)$, che lega operatori autoaggiunti e unitari e con cui von Neumann risolve il problema agli autovalori in dimensione infinita, si cita e non si costruisce.","controllo":[{"tipo":"uguale","sinistra":"Abs(exp(I*theta))","vale":"1","ipotesi":{"theta":"real"},"dove":"esempio","appare":"|e^{i\\theta}|=1"},{"tipo":"uguale","sinistra":"Matrix([[cos(th),-sin(th)],[sin(th),cos(th)]]).T*Matrix([[cos(th),-sin(th)],[sin(th),cos(th)]])","vale":"Matrix([[1,0],[0,1]])","ipotesi":{"th":"real"},"dove":"esempio","appare":"\\cos^2\\theta+\\sin^2\\theta=1"}],"qui":{},"pieno":null};
STRUM["serie-di-potenze"] = {"nome":"Serie di potenze","riga":"Una somma $\\sum_{n\\ge0}a_n(x-x_0)^{n}$, che converge dentro un intervallo (in campo complesso: un disco) di raggio $R$ centrato in $x_0$ e diverge fuori.","serve":"È la classe di serie di funzioni che si comporta meglio di tutte: dentro il raggio converge uniformemente sui compatti, quindi si deriva e si integra termine a termine infinite volte, e i coefficienti sono quelli di Taylor. Il raggio si calcola col rapporto $|a_{n+1}/a_n|$ o con Cauchy–Hadamard, e sul bordo non si sa niente a priori: va studiato a parte.","esempio":"Per $\\sum_{n\\ge0}\\dfrac{x^{n}}{n!}$ il rapporto fra coefficienti consecutivi tende a $0$: il raggio è infinito e la somma è $e^{x}$ su tutto $\\mathbb{R}$. Per $\\sum_{n\\ge1}n\\,x^{n}$ tende invece a $1$, quindi $R=1$, e in $x=\\tfrac12$ la somma vale $2$.","pieno":{"file":"07-serie-funzioni.html","tappa":"04","come":"il raggio, la derivazione termine a termine e l'identità con Taylor, nel nucleo sulle serie di funzioni"},"qui":{"metodi-e-modelli":{"serve":"In campo complesso la serie di potenze non è una classe fra altre: è la definizione stessa di analitica, e il teorema che olomorfa $=$ analitica dice che ogni funzione derivabile in senso complesso è già una serie di potenze. Il raggio smette anche di essere un conto sui coefficienti e diventa geometria: è la distanza dal centro alla singolarità più vicina — ed è il primo dei due raggi della corona di Laurent.","esempio":"La regola geometrica spiega i raggi reali che sembravano arbitrari: $\\dfrac{1}{1+x^{2}}$ è liscia su tutto $\\mathbb{R}$, ma il suo sviluppo in $0$ ha raggio $1$, perché in $\\pm i$ la funzione esplode e $|i|=1$. Dentro quel raggio il conto chiude: in $z=\\tfrac12$ la serie $1-z^{2}+z^{4}-\\cdots$ vale $\\tfrac45$."}},"controllo":[{"tipo":"limite","espr":"1/(n+1)","var":"n","a":"oo","vale":"0","ipotesi":{"n":"positive"},"dove":"esempio","appare":"a $0$"},{"tipo":"limite","espr":"(n+1)/n","var":"n","a":"oo","vale":"1","ipotesi":{"n":"positive"},"dove":"esempio","appare":"a $1$"},{"tipo":"somma","espr":"n*(1/2)**n","var":"n","da":"1","a":"oo","vale":"2","dove":"esempio","appare":"vale $2$"},{"tipo":"uguale","sinistra":"Abs(I)","vale":"1","dove":"qui.metodi-e-modelli.esempio","appare":"|i|=1"},{"tipo":"somma","espr":"(-1)**n*(1/2)**(2*n)","var":"n","da":"0","a":"oo","vale":"4/5","dove":"qui.metodi-e-modelli.esempio","appare":"\\tfrac45"}]};
STRUM["simmetrie"] = {"nome":"Simmetrie","riga":"L'insieme delle trasformazioni che lasciano identica la sorgente, e che perciò devono lasciare identico anche il campo che ne nasce.","serve":"È il ragionamento che decide la FORMA del campo prima di calcolarlo, e senza il quale la legge di Gauss non serve a niente: Gauss dà un solo numero — il flusso totale — e da un numero si ricava un campo soltanto se si sa già in che direzione punta e da quali variabili dipende. L'argomento ha una forma sola: se una trasformazione lascia identica la distribuzione di carica, lascia identico il campo; quindi ogni componente che quella trasformazione cambierebbe deve essere nulla, e ogni variabile che essa sposta non può comparire.","esempio":"Per un filo infinito uniformemente carico, la traslazione lungo il filo e la rotazione attorno a esso lasciano la carica identica: $\\mathbf E$ non può dipendere né da $z$ né dall'angolo. La riflessione nel piano perpendicolare al filo manderebbe $E_z$ in $-E_z$ lasciando uguale la sorgente, quindi $E_z=0$; resta la sola componente radiale $E_r(r)$. Solo a quel punto il cilindro coassiale è la superficie giusta, e Gauss dà $E_r\\cdot 2\\pi rL=\\dfrac{\\lambda L}{\\varepsilon_0}$, da cui $E_r=\\dfrac{\\lambda}{2\\pi\\varepsilon_0 r}$.","qui":{"meccanica-quantistica":{"serve":"Qui l'argomento di simmetria non decide la forma di un campo: decide la forma degli OPERATORI, ed è il modo in cui questo corso costruisce la teoria. Lo schema è lo stesso — una trasformazione che lascia identica la situazione fisica deve lasciare identica la descrizione — ma la conseguenza è più forte: ogni trasformazione di simmetria continua è realizzata da un operatore unitario, ogni operatore unitario continuo è l'esponenziale di un generatore autoaggiunto, e quel generatore è una quantità conservata. Impulso, momento angolare ed energia non si postulano: sono i generatori delle traslazioni, delle rotazioni e delle traslazioni temporali.","esempio":"Lo spazio è omogeneo, quindi traslare un sistema isolato non ne cambia la fisica: $\\hat U(a)=e^{-ia\\hat P/\\hbar}$ deve commutare con $\\hat H$. Al primo ordine in $a$ questo dà $[\\hat P,\\hat H]=0$, e quindi $\\dfrac{d}{dt}\\langle \\hat P\\rangle=0$: l'omogeneità dello spazio è la conservazione dell'impulso, e il passaggio da una all'altra è di due righe."}},"debito":"nessun nucleo del percorso tratta l'argomento di simmetria come strumento a sé: qui c'è la forma dell'argomento e non la sua giustificazione, che è di teoria dei gruppi e sta fuori dal percorso costruito finora. Quello che il percorso copre è il pezzo di destra — l'integrale di flusso, nel nucleo 03 tappa 04 — non il pezzo di sinistra che decide quale superficie scegliere.","controllo":[{"tipo":"uguale","sinistra":"(lam/(2*pi*e0*r))*2*pi*r*L","vale":"lam*L/e0","dove":"esempio","appare":"\\dfrac{\\lambda L}{\\varepsilon_0}"}]};
STRUM["commutatore"] = {"nome":"Commutatore","riga":"$[\\hat A,\\hat B]=\\hat A\\hat B-\\hat B\\hat A$, antisimmetrico, con la regola di Leibniz $[\\hat A,\\hat B\\hat C]=[\\hat A,\\hat B]\\hat C+\\hat B[\\hat A,\\hat C]$ e la relazione canonica $[\\hat x,\\hat p]=i\\hbar$.","serve":"E' la misura di quanto due operazioni dipendano dall'ordine, e qui l'ordine e' fisica: due osservabili che non commutano non hanno una base comune di autostati, quindi non si misurano insieme con precisione arbitraria. Quasi ogni conto che sembra magico — l'algebra del momento angolare, gli operatori di salita e discesa, il teorema di Ehrenfest — e' una manipolazione di commutatori fatta con quelle regole e nient'altro.","esempio":"Dalla regola di Leibniz, $[\\hat x,\\hat p^{2}]=[\\hat x,\\hat p]\\hat p+\\hat p[\\hat x,\\hat p]=2i\\hbar\\hat p$. E' il conto che fa uscire il teorema di Ehrenfest: la meccanica classica ricompare come relazione fra valori medi, e ricompare perche' quel commutatore vale proprio $2i\\hbar\\hat p$.","debito":"l'identita' di Jacobi si enuncia e non si dimostra; la corrispondenza fra commutatore e parentesi di Poisson — che e' l'idea di Dirac e non un'analogia decorativa — sta in mq-07, e li' va letta per intero.","controllo":[{"tipo":"uguale","sinistra":"I*hbar*p + p*I*hbar","vale":"2*I*hbar*p","ipotesi":{"hbar":"positive","p":"real"},"dove":"esempio","appare":"2i\\hbar\\hat p"},{"tipo":"simbolico","dove":"riga","appare":"[\\hat x,\\hat p]=i\\hbar","perche":"e' la relazione di commutazione canonica, il POSTULATO da cui discende il resto della teoria: non si dimostra, si assume, ed e' cio' che separa la meccanica quantistica dalla classica"}],"qui":{},"pieno":null};
STRUM["teorema-della-divergenza"] = {"nome":"Teorema della divergenza","riga":"Il flusso uscente da una superficie chiusa è l'integrale della divergenza sul volume che racchiude: $\\oint_{\\partial V}\\mathbf F\\cdot\\hat n\\,dS=\\int_V\\nabla\\cdot\\mathbf F\\,dV$.","serve":"Scambia una domanda sul bordo con una sul volume. A destra c'è la divergenza, che è la densità di sorgente punto per punto; a sinistra il totale che esce. Si usa nei due versi: per calcolare un flusso scomodo con un integrale di volume comodo, e — in fisica soprattutto — per passare da una legge integrale a una legge locale, perché se due integrali di volume coincidono per OGNI volume allora coincidono gli integrandi.","esempio":"Per $\\mathbf F=\\mathbf r=(x,y,z)$ la divergenza vale $3$, quindi sulla palla di raggio $R$ il membro destro è $3\\cdot\\tfrac43\\pi R^{3}=4\\pi R^{3}$; il membro sinistro, calcolato come flusso, è il modulo $R$ per l'area $4\\pi R^{2}$, e dà lo stesso numero.","pieno":{"file":"05-teoremi-integrali.html","tappa":"02","come":"l'enunciato, la dimostrazione a fette e le ipotesi vere sul dominio, nel nucleo dei teoremi integrali"},"qui":{"elettromagnetismo":{"serve":"È il passaggio che trasforma la legge di Gauss integrale nella prima equazione di Maxwell, $\\nabla\\cdot\\mathbf E=\\rho/\\varepsilon_0$, e la conservazione della carica nell'equazione di continuità $\\nabla\\cdot\\mathbf J+\\partial_t\\rho=0$. La mossa è sempre la stessa: si scrive la legge su un volume arbitrario, si porta il flusso dentro come integrale di divergenza, e si osserva che un integrale nullo su OGNI volume obbliga l'integrando a essere nullo. L'arbitrarietà del volume non è un dettaglio: è tutta la dimostrazione.","esempio":"Per il campo di una carica puntiforme, di modulo $\\dfrac{q}{4\\pi\\varepsilon_0r^{2}}$ e diretto radialmente, la divergenza è nulla ovunque tranne nell'origine: in coordinate sferiche la divergenza di un campo radiale si scrive con $\\partial_r\\!\\left(r^{2}E_r\\right)$, e qui $r^{2}E_r$ non dipende da $r$, quindi la derivata fa $0$. Tutta la carica è finita nel punto escluso, ed è esattamente il buco che la $\\delta$ di Dirac serve a riempire."}},"controllo":[{"tipo":"uguale","sinistra":"diff(x,x)+diff(y,y)+diff(z,z)","vale":"3","dove":"esempio","appare":"vale $3$"},{"tipo":"uguale","sinistra":"3*(4/3)*pi*R**3","vale":"4*pi*R**3","dove":"esempio","appare":"4\\pi R^{3}"},{"tipo":"derivata","espr":"r**2*(q/(4*pi*e0*r**2))","rispetto":["r"],"vale":"0","dove":"qui.elettromagnetismo.esempio","appare":"la derivata fa $0$"}]};

function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';
  return h;
}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

/*MOVIMENTO
id:        mq-19 — lo spin
identita:  il grado di liberta' che non ha corrispettivo classico e che l'algebra del momento
           angolare aveva gia' previsto: il caso j = 1/2. Il filo: i fatti (lo Zeeman anomalo,
           Stern e Gerlach, con i numeri del 1922 rifatti) costringono a un momento angolare
           con due soli valori; le fonti lo introducono in sei modi diversi (postulato,
           generatore delle rotazioni, gruppo di Galileo, rappresentazione di dimensione
           minima); le matrici di Pauli si costruiscono dalle sole relazioni di commutazione e
           anticommutazione; ogni spinore e' lo stato "su" lungo qualche direzione; le rotazioni
           sono matrici di SU(2), e una rotazione di 2π cambia il segno dello stato: un segno
           che Sakurai fa misurare e che Ballentine dichiara inosservabile, e le due cose sono

/* ---------------- 00 · DI COSA PARLA QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Di cosa parla questo movimento', meta:'Meccanica Quantistica · voci Q.20 e Q.22 · un momento angolare con due soli valori · sei modi di introdurlo · il segno che una rotazione completa non cancella · che cosa dice una misura di spin',
  blocchi:[
  {t:'prosa', title:'Il sistema meno classico che ci sia', tag:'architettura', html:R`
  <p>Sakurai apre il suo libro con lo spin, e spiega perché: <i>«in a certain sense, a two-state system of the Stern-Gerlach type is the least classical, most quantum-mechanical system»</i>. Griffiths la pensa allo stesso modo sulla semplicità e al contrario sull&rsquo;ordine: <i>«in a mathematical sense, spin 1/2 is the simplest possible nontrivial quantum system, for it admits just two basis states»</i>, ma <i>«the price of mathematical simplicity is conceptual abstraction, and I prefer not to do it that way»</i>. Picasso arriva allo spin al capitolo 15, dopo l&rsquo;atomo di idrogeno, e dichiara nella prefazione che fra gli argomenti non inseriti c&rsquo;è proprio <i>«l&rsquo;esperimento di Stern e Gerlach»</i>. Lo stesso grado di libertà sta dunque al primo capitolo di un libro e fuori da un altro: è il primo segno che le fonti, qui, non raccontano la stessa storia.</p>
  <p>Che cosa c&rsquo;è da capire. L&rsquo;algebra del momento angolare ammette valori interi e semiinteri; le funzioni d&rsquo;onda sulla sfera ammettono solo gli interi. Lo spin è il caso in cui la natura usa i semiinteri: un momento angolare che non è il movimento di niente nello spazio, che ha due soli valori lungo qualunque direzione, e che si descrive con matrici due per due. Dirac lo dice in una riga: <i>«lo spin non corrisponde strettamente a nessun concetto della meccanica classica, cosicché il metodo dell&rsquo;analogia classica non è adatto per studiarlo»</i>.</p>`},
  {t:'prosa', title:'Come è fatto il movimento', tag:'architettura', html:R`
  <p><b>Il primo blocco sono i fatti.</b> La tappa 01 racconta che cosa costrinse a introdurre lo spin, lo Zeeman anomalo e l&rsquo;esperimento di Stern e Gerlach, rifacendo i numeri del 1922. La 02 segue Sakurai negli esperimenti in sequenza e nell&rsquo;analogia con la polarizzazione della luce, fino alla conclusione che lo spazio degli stati deve essere complesso.</p>
  <p><b>Il secondo blocco è il formalismo, e qui le fonti divergono.</b> La 03 mette a confronto sei modi di introdurre lo spin: come postulato (Picasso, Griffiths), come parte del generatore delle rotazioni di una funzione d&rsquo;onda a più componenti (Shankar, Landau, Dirac), come conseguenza del gruppo di Galileo (Ballentine), come la realizzazione di dimensione minima delle relazioni di commutazione (Sakurai). La 04 costruisce le matrici di Pauli dalle sole relazioni algebriche, con Picasso. La 05 mostra che ogni stato di spin $\tfrac12$ punta in una direzione dello spazio, e che per lo spin $1$ non è più vero.</p>
  <p><b>Il terzo blocco sono le rotazioni.</b> La 06 scrive la matrice di una rotazione finita e trova che una rotazione di $2\pi$ cambia il segno dello stato. La 07 mette a confronto Sakurai, che quel segno lo misura con l&rsquo;interferometria neutronica, e Ballentine, che dimostra che nessuna osservabile lo vede: le due cose sono vere insieme, e capire perché è il punto della tappa. La 08 è la precessione, cioè la rotazione fatta dal tempo.</p>
  <p><b>Il quarto blocco è la misura.</b> La 09 tratta Stern e Gerlach in meccanica quantistica, con la forza che diventa un impulso correlato allo spin. La 10 chiede che cosa voglia dire misurare uno spin, mettendo accanto Sakurai, Griffiths, Ballentine, l&rsquo;articolo del Giornale di Fisica e le interpretazioni del documento caricato da Giuseppe. Le tappe 11 e 12 risolvono due compiti. La 13 confronta le fonti e chiude con le domande d&rsquo;orale.</p>
  <p><b>Che cosa il movimento non fa.</b> La particella carica nel campo, con la hamiltoniana di Pauli completa e l&rsquo;invarianza di gauge, è un altro movimento; qui il campo agisce solo sul momento magnetico di una particella ferma o di un atomo neutro. La composizione di due spin e i coefficienti di Clebsch-Gordan sono anch&rsquo;essi altrove.</p>`}
]},
/* ---------------- 01 · I FATTI ---------------- */
{ num:'01', title:'I fatti: lo Zeeman anomalo e l esperimento del 1922, con i numeri rifatti', meta:'un numero pari di righe dove la teoria ne vuole uno dispari · la proposta di Stern del 1921 · la forza media e la precessione · il fascio che si allarga o si divide · un decimo di millimetro · che cosa pensavano di aver misurato',
  blocchi:[
  {t:'prosa', title:'Un numero pari di righe', tag:'spettri', html:R`
  <p>Le note del corso sullo spin partono dagli spettri. In un campo magnetico uniforme ogni riga si divide in righe equidistanti, e la spiegazione dell&rsquo;effetto Zeeman si basa su un momento magnetico proporzionale al momento angolare orbitale, $\mathbf M=\mu_{B}\mathbf L/\hbar$. Ma <i>«mentre questa teoria è confermata dall&rsquo;esperimento in alcuni casi (il cosiddetto effetto Zeeman &ldquo;normale&rdquo;), in altri casi (il cosiddetto effetto Zeeman &ldquo;anomalo&rdquo;) la teoria fallisce. L&rsquo;anomalia si rivela per gli atomi con numero atomico $Z$ dispari (in particolare, per l&rsquo;atomo di idrogeno): i loro livelli sono divisi in un numero pari di linee di Zeeman mentre, secondo la teoria, questo numero dovrebbe essere sempre dispari, essendo uguale a $(2l+1)$ con $l$ intero»</i>. Un numero pari di sottolivelli, $2j+1$ pari, vuol dire $j$ semiintero: l&rsquo;anomalia è il primo indizio che serve un momento angolare che le armoniche sferiche non possono dare.</p>
  <p>Picasso lega allo stesso indizio altri due «due»: i doppietti dei metalli alcalini e il fattore due del principio di esclusione. Per lui l&rsquo;ipotesi che le componenti dello spin abbiano soltanto due autovalori <i>«è direttamente connessa con altri &ldquo;due&rdquo; che abbiamo già incontrato»</i>. E aggiunge il fatto che fissa il momento magnetico: per spiegare lo Zeeman anomalo bisogna supporre un fattore $g\ne1$, e l&rsquo;equazione di Dirac prevede $g=2$, <i>«in ottimo accordo con i fatti sperimentali ($g=2{,}002\,319\,304\,361\,82(52)$: il cosiddetto &ldquo;$g-2$&rdquo; è spiegato dall&rsquo;elettrodinamica quantistica)»</i>.</p>`},
  {t:'prosa', title:'La proposta di Stern, nelle sue parole', tag:'storia', html:R`
  <p>La storia dell&rsquo;esperimento è raccontata con cura in una voce del Glossario del Giornale di Fisica del 2007, che riporta in traduzione l&rsquo;introduzione del lavoro di Stern del 1921. Il problema era la «quantizzazione spaziale»: nella teoria di Bohr e Sommerfeld la componente del momento angolare lungo il campo può prendere solo valori discreti, ma nessuno l&rsquo;aveva vista. Stern scrive: <i>«secondo la teoria classica ci si deve aspettare qualcosa di ben diverso. L&rsquo;effetto del campo magnetico consiste, secondo Larmor, nel fatto che tutti gli atomi eseguono una precessione intorno alla direzione del campo, cosicché l&rsquo;angolo, che la direzione del momento angolare forma con $B$, assume con continuità tutti i possibili valori per i differenti atomi»</i>. E propone il test: <i>«si può scegliere tra la concezione quantica e quella classica mediante un esperimento molto semplice. A questo scopo basta esaminare la deviazione che un fascio di atomi subisce in un appropriato campo magnetico non omogeneo»</i>.</p>
  <p>La teoria di Stern sta in tre righe. Un momento magnetico in un campo che varia nello spazio sente una forza; se l&rsquo;atomo precede rapidamente attorno al campo, le componenti trasverse del momento si mediano a zero e resta $\mathbf F=\mu_{z}\,\partial\mathbf B/\partial z$. Stern stima il periodo di precessione: per $B_{z}=1000$ gauss, cioè $0{,}1$ T, è <i>«pari a $7\times10^{-10}$ s»</i>. Con il rapporto giromagnetico orbitale $e/2m_{e}$ che Stern usa, il periodo è $4\pi m_{e}/eB$, e il conto dà proprio circa $7{,}1\cdot10^{-10}$ s; con il rapporto giromagnetico dello spin, doppio, sarebbe circa $3{,}6\cdot10^{-10}$ s. In entrambi i casi è un tempo minuscolo rispetto al tempo di volo nel magnete, e la media è giustificata.</p>
  <p>Le note del corso descrivono lo stesso ragionamento con le equazioni del giroscopio: la derivata del momento angolare è $\gamma\mathbf J\times\mathbf B$, il momento ruota attorno al campo mantenendo costante l&rsquo;angolo, e <i>«solo i valori mediati nel tempo di $M_{x}$ e $M_{y}$ possono avere un ruolo»</i>; di conseguenza <i>«misurare $HN$ equivale a misurare $M_{z}$ o $J_{z}$»</i>, dove $HN$ è la deflessione sulla lastra.</p>`},
  {t:'reveal', title:'Il campo che non può puntare solo lungo z', tag:'Maxwell', steps:[
   {label:'Le due equazioni che vincolano il magnete', body:R`
   <p>L&rsquo;articolo del Giornale di Fisica rifà il conto nel riferimento del laboratorio, dove valgono $\nabla\cdot\mathbf B=0$ e, fra le espansioni del magnete, $\nabla\times\mathbf B=0$. Se il campo è simmetrico rispetto al piano $yz$ e $B_{y}=0$, allora $B_{z}$ è pari in $x$ e $B_{x}$ dispari. La forza è il <span class="str" data-str="gradiente">gradiente</span> di $\boldsymbol\mu\cdot\mathbf B$, e nel piano di simmetria $x=0$ le relazioni $\partial B_{x}/\partial z=\partial B_{z}/\partial x=0$ e $\partial B_{x}/\partial x=-\partial B_{z}/\partial z$ la riducono a</p>
   $$F_{x}=-\mu_{x}\frac{\partial B_{z}}{\partial z},\qquad F_{y}=0,\qquad F_{z}=\mu_{z}\frac{\partial B_{z}}{\partial z}.$$
   <p>C&rsquo;è dunque anche una forza lungo $x$, inevitabile perché <i>«l&rsquo;equazione di Maxwell $\mathrm{div}\,\mathbf B=0$ implica che almeno una delle componenti $B_{x}$, $B_{y}$ deve essere diversa da zero»</i>; ma $\mu_{x}$ ruota con la precessione e la sua media è nulla.</p>`},
   {label:'Fuori dal piano di simmetria', body:R`
   <p>L&rsquo;articolo stima anche quanto ci si può allontanare dal piano. Con $\partial B_{z}/\partial z\approx10^{3}$ T/m e $B_{x}\approx-(\partial B_{z}/\partial z)\,x$ vicino al piano, per $x=4\times10^{-4}$ m, metà della fenditura, si ha $|B_{x}|\approx0{,}4$ T: non piccolo. Fuori dal piano il campo non è più diretto lungo $z$ e la media di $F_{x}$ non è più nulla, così che l&rsquo;immagine dovrebbe deformarsi; <i>«tuttavia, questa deformazione non appare nelle immagini osservate da Stern e Gerlach»</i>. La conclusione è che conviene guardare i dati vicino a $x=0$, dove la terza delle equazioni è esatta.</p>`}
  ]},
  {t:'prosa', title:'Due previsioni, e quella che vinse', tag:'esperimento', html:R`
  <p>Gli atomi escono da un forno, attraversano due diaframmi, passano fra le espansioni del magnete per $3{,}5$ cm e si depositano su una lastra di vetro. Se l&rsquo;ipotesi classica fosse giusta, la forza sarebbe $F_{z}=\mu\cos\theta\,\partial B_{z}/\partial z$ con $\theta$ distribuito su tutti i valori; se fosse giusta l&rsquo;ipotesi quantistica di Stern, $F_{z}=\pm\mu\,\partial B_{z}/\partial z$. <i>«Pertanto, usando un fascio di atomi, questo sarebbe semplicemente allargato dal campo magnetico nel primo caso; nel secondo, sarebbe diviso in due fasci distinti»</i>.</p>
  <p>Quanto è grande l&rsquo;effetto? La deflessione all&rsquo;uscita del magnete è $d=\tfrac12at^{2}=\mu\,(\partial B_{z}/\partial z)\,l^{2}/2Mv^{2}$, la (7) dell&rsquo;articolo. Con $\mu$ pari a un magnetone di Bohr, un gradiente di $10^{3}$ T/m, $l=3{,}5$ cm, la massa di un atomo d&rsquo;argento e una velocità fra $\sqrt{3kT/M}$ e $\sqrt{4kT/M}$, i due valori che Stern e Gerlach usarono secondo l&rsquo;articolo, con $T$ pari alla temperatura di fusione dell&rsquo;argento, $1235$ K, che l&rsquo;articolo cita per la radiazione del forno, le velocità sono circa $534$ m/s e $617$ m/s, e la deflessione circa $0{,}11$ mm e $0{,}083$ mm. È l&rsquo;<span class="str" data-str="ordini-di-grandezza">ordine di grandezza</span> di quello che Stern e Gerlach videro nel primo ciclo di misure: <i>«una macchia spostata di 1/10 mm nella direzione di $\partial B_{z}/\partial z$»</i>. La temperatura del forno è una stima fatta qui sulla base della nota dell&rsquo;articolo, non un dato del lavoro originale.</p>
  <p>Il secondo ciclo, con una fenditura stretta al posto del foro circolare, fu decisivo: l&rsquo;immagine si divise in due, e Stern e Gerlach <i>«conclusero che era valida l&rsquo;ipotesi quantica»</i>. Nel lavoro successivo misurarono il momento con una discrepanza dell&rsquo;ordine del dieci per cento e scrissero che <i>«il momento magnetico dell&rsquo;atomo di argento allo stato di vapore è un magnetone di Bohr»</i>. L&rsquo;articolo sottolinea l&rsquo;ironia: <i>«Stern e Gerlach pensavano di aver misurato un momento di dipolo magnetico di origine &ldquo;orbitale&rdquo;; oggi sappiamo che avevano di fatto misurato il momento di dipolo magnetico intrinseco dell&rsquo;elettrone di valenza dell&rsquo;atomo di argento»</i>. E ricorda che Stern avrebbe dovuto aspettarsi, per un momento orbitale con componente $\pm\hbar$, anche il valore zero, cioè tre macchie: le idee dell&rsquo;epoca <i>«non erano, a questo proposito, del tutto coerenti»</i>. L&rsquo;esperimento giusto, interpretato con la teoria sbagliata, aveva trovato la risposta giusta per un motivo che sarebbe stato capito solo tre anni dopo, con lo spin di Uhlenbeck e Goudsmit.</p>`},
  {t:'plot', title:'La macchia classica e le due macchie',
   intro:R`<p>Distribuzione delle deflessioni sulla lastra, in unità della deflessione massima e con area totale uno. Previsione classica con momenti orientati a caso (blu), allargata dalla larghezza del fascio; previsione per due soli valori di $\mu_{z}$ (arancio), con la stessa larghezza.</p>`,
   plots:[{kind:'func2d', xr:[-2,2], yr:[0,1.1], height:260, ticks:true,
     title:'Stern e Gerlach: allargamento o divisione',
     curves:[{f:'0.5/((1+Math.exp(-(x+1)/0.08))*(1+Math.exp((x-1)/0.08)))', col:'#5aa9ff', width:2.4, label:'classica: mu_z uniforme'},
             {f:'0.5*(Math.exp(-(x-1)*(x-1)/0.08)+Math.exp(-(x+1)*(x+1)/0.08))/Math.sqrt(0.08*Math.PI)', col:'#ffb86b', width:2.4, label:'quantistica: due valori'}],
     xlabel:'deflessione / deflessione massima', ylabel:'densita'}],
   leggi:R`<p><b>Che cosa guardare.</b> La curva classica è piatta: con le direzioni distribuite a caso nello spazio, la frazione di atomi con $\cos\theta$ in un intervallo è proporzionale alla larghezza dell&rsquo;intervallo, perché l&rsquo;elemento di angolo solido è $\sin\theta\,d\theta=-d(\cos\theta)$. Per esempio, i valori di $\cos\theta$ fra $\tfrac12$ e $1$ e quelli fra $-\tfrac14$ e $\tfrac14$ raccolgono la stessa frazione, un quarto. La curva quantistica è fatta di due picchi agli estremi e niente al centro.</p>
   <p><b>Che cosa impararne.</b> La differenza non è di grado, è di forma: un fascio allargato uniformemente contro due macchie separate. Su un punto l&rsquo;articolo del Giornale di Fisica va corretto: in una nota scrive che, nel caso classico, <i>«la sua intensità massima sarà ancora al centro dell&rsquo;immagine»</i>, perché il numero di atomi per unità di angolo è massimo a $\theta=\pi/2$. Ma la deflessione è proporzionale a $\cos\theta$, non a $\theta$, e per unità di deflessione la distribuzione è uniforme, come qui e come in Sakurai, per cui il fascio classico si sarebbe allargato <i>«more or less evenly over the expected range»</i>.</p>`},
  {t:'prosa', title:'Che cosa resta aperto, secondo l articolo', tag:'storia', html:R`
  <p>L&rsquo;articolo chiude con un problema che i libri di testo non menzionano. Nel 1922 Einstein ed Ehrenfest osservarono che, se il campo cambia lentamente rispetto alla precessione, l&rsquo;angolo fra momento e campo resta costante, e quindi gli atomi non possono allinearsi nelle due sole direzioni permesse <i>«senza influenze esterne quali la radiazione o le collisioni»</i>. Stimarono che l&rsquo;allineamento per radiazione richiederebbe circa $10^{9}$ s, contro i $10^{-4}$ s del volo nel magnete, e conclusero che nessuno dei due meccanismi che avevano considerato funzionava. L&rsquo;autore commenta: <i>«a mia conoscenza, le questioni poste da Einstein ed Ehrenfest sono rimaste senza risposta. Verosimilmente, l&rsquo;avvento della meccanica quantica ha favorito questa indifferenza»</i>, perché nella descrizione con un vettore di stato sovrapposizione di due autostati <i>«i problemi posti da Einstein ed Ehrenfest non hanno cittadinanza»</i>. La tappa 09 mostra come la meccanica quantistica risponde, senza nessun allineamento; la tappa 10 torna sulla domanda di che cosa significhi.</p>`}
]},
/* ---------------- 02 · GLI ESPERIMENTI IN SEQUENZA ---------------- */
{ num:'02', title:'Gli esperimenti in sequenza e la luce polarizzata: perché lo spazio degli stati è complesso', meta:'due apparati lungo z · uno lungo z e uno lungo x · il terzo che fa ricomparire il fascio eliminato · la trottola classica · i filtri polaroid · metà dell angolo · la polarizzazione circolare e i numeri complessi',
  blocchi:[
  {t:'prosa', title:'Tre disposizioni', tag:'Sakurai', html:R`
  <p>Sakurai costruisce il formalismo intero a partire da tre disposizioni di apparati di Stern e Gerlach in sequenza. Nella prima il fascio uscito dal forno passa per un apparato con il gradiente lungo $z$, il fascio $S_{z}-$ viene bloccato e il fascio $S_{z}+$ entra in un secondo apparato lungo $z$: ne esce un solo fascio, $S_{z}+$. <i>«This is perhaps not so surprising; after all, if the atom spins are up, they are expected to remain so»</i>.</p>
  <p>Nella seconda il secondo apparato ha il gradiente lungo $x$, e il fascio $S_{z}+$ si divide in $S_{x}+$ e $S_{x}-$ con intensità uguali. La tentazione è di dire che metà degli atomi ha $S_{z}+$ e $S_{x}+$, l&rsquo;altra metà $S_{z}+$ e $S_{x}-$. La terza disposizione la smentisce: si seleziona $S_{x}+$ e lo si manda in un terzo apparato lungo $z$, e ne escono due fasci, $S_{z}+$ e $S_{z}-$. <i>«This is a complete surprise because after the atoms emerged from the first apparatus, we made sure that the $S_{z}-$ component was completely blocked»</i>. Se il fascio uscito dal forno ha intensità uno, il primo apparato ne lascia passare metà, il secondo metà della metà, e ciascuno dei due fasci finali è un ottavo dell&rsquo;intensità iniziale.</p>
  <p>La conclusione di Sakurai è precisa: <i>«the selection of the $S_{x}+$ beam by the second apparatus ($SG\hat x$) completely destroys any previous information about $S_{z}$»</i>. E non è un limite della tecnica: <i>«it is to be clearly understood that the limitation we have encountered in determining $S_{z}$ and $S_{x}$ is not due to the incompetence of the experimentalist»</i>. Il paragone è con una trottola classica, per la quale <i>«by observing how fast the object is spinning in which direction, we can determine $\omega_{x}$, $\omega_{y}$, and $\omega_{z}$ simultaneously»</i>, e con esse tutte le componenti di $\mathbf L=I\boldsymbol\omega$.</p>`},
  {t:'prosa', title:'L analogia con i polaroid', tag:'Sakurai', html:R`
  <p>Per costruire il formalismo Sakurai prende in prestito una situazione classica. Un fascio di luce che passa per un filtro che seleziona la polarizzazione lungo $x$ e poi per uno lungo $y$ si spegne del tutto. Se fra i due si inserisce un filtro a $45^{\circ}$, dall&rsquo;ultimo esce di nuovo luce: la legge di Malus, $\cos^{2}$ dell&rsquo;angolo fra filtri successivi, dà un mezzo al secondo passaggio e un mezzo al terzo, cioè un quarto dell&rsquo;intensità uscita dal primo filtro. <i>«The selection of the $x'$-polarized beam by the second Polaroid destroys any previous information on light polarization»</i>, esattamente come nella terza disposizione di Stern e Gerlach.</p>
  <p>La corrispondenza è $S_{z}\pm\leftrightarrow$ polarizzazione lungo $x$ e lungo $y$, $S_{x}\pm\leftrightarrow$ polarizzazione lungo le diagonali a $45^{\circ}$. Ma c&rsquo;è un dettaglio che vale la pena notare subito: due polarizzazioni ortogonali formano un angolo di $90^{\circ}$, mentre spin su e spin giù puntano in direzioni opposte, a $180^{\circ}$. Gli angoli fra stati di spin, nello spazio degli stati, sono la metà degli angoli fra direzioni nello spazio fisico. È la prima comparsa dell&rsquo;angolo dimezzato che dominerà le tappe 05 e 06: la probabilità che uno spin preparato «su» lungo una direzione passi un filtro orientato a un angolo $\theta$ è $\cos^{2}(\theta/2)=\tfrac12(1+\cos\theta)$, contro il $\cos^{2}\theta$ di Malus.</p>`},
  {t:'plot', title:'Malus e lo spin',
   intro:R`<p>Frazione trasmessa in funzione dell&rsquo;angolo fra due selettori successivi: due polaroid (blu, $\cos^{2}\theta$) e due apparati di Stern e Gerlach per spin $\tfrac12$ (arancio, $\cos^{2}(\theta/2)$). Angolo in gradi.</p>`,
   plots:[{kind:'func2d', xr:[0,360], yr:[0,1.05], height:250, ticks:true,
     title:'legge di Malus e sua versione per lo spin 1/2',
     curves:[{f:'Math.pow(Math.cos(x*Math.PI/180),2)', col:'#5aa9ff', width:2.4, label:'polaroid: cos^2 theta'},
             {f:'Math.pow(Math.cos(x*Math.PI/360),2)', col:'#ffb86b', width:2.4, label:'spin 1/2: cos^2(theta/2)'}],
     xlabel:'angolo fra i due selettori (gradi)', ylabel:'frazione trasmessa'}],
   leggi:R`<p><b>Che cosa guardare.</b> La curva della luce si annulla a $90^{\circ}$ e torna a uno a $180^{\circ}$: un polaroid girato di mezzo giro è lo stesso polaroid. La curva dello spin si annulla solo a $180^{\circ}$, quando il secondo apparato seleziona la direzione opposta, e a $90^{\circ}$ vale un mezzo, il caso $S_{z}+$ seguito da $S_{x}$.</p>
   <p><b>Che cosa impararne.</b> Le due curve sono la stessa funzione con l&rsquo;angolo raddoppiato. Nella luce gli stati ortogonali sono direzioni a $90^{\circ}$; nello spin sono direzioni a $180^{\circ}$. Il formalismo lo traduce con vettori di stato che dipendono da $\theta/2$.</p>`},
  {t:'reveal', title:'Perché servono i numeri complessi', tag:'derivazione', steps:[
   {label:'Gli stati lungo x', body:R`
   <p>L&rsquo;analogia suggerisce di scrivere gli stati $S_{x}\pm$ come combinazioni di quelli $S_{z}\pm$, come la polarizzazione a $45^{\circ}$ è una combinazione di quelle lungo $x$ e $y$: $|S_{x};\pm\rangle=\big(|S_{z};+\rangle\pm|S_{z};-\rangle\big)/\sqrt2$. Ciascuno dà probabilità un mezzo per $S_{z}\pm$, come richiede la seconda disposizione.</p>`},
   {label:'Gli stati lungo y non trovano posto', body:R`
   <p>Ora gli stati $S_{y}\pm$. Per simmetria devono dare probabilità un mezzo sia per $S_{z}\pm$ sia per $S_{x}\pm$, e Sakurai osserva: <i>«it appears from (1.1.9) that we have already used up the available possibilities in writing $|S_{x};\pm\rangle$»</i>. Con coefficienti reali è impossibile: se $a|S_{z};+\rangle+b|S_{z};-\rangle$ ha $a^{2}=b^{2}=\tfrac12$ e deve dare anche $\tfrac12(a+b)^{2}=\tfrac12$, ne segue $2ab=0$, che contraddice $a^{2}=b^{2}=\tfrac12$. Il sistema di condizioni non ha soluzioni reali.</p>`},
   {label:'La luce circolare risolve', body:R`
   <p>La luce polarizzata circolarmente dà intensità uguali dietro un filtro $x$ e dietro un filtro $y$, eppure è diversa dalla polarizzazione a $45^{\circ}$: la componente $y$ oscilla in ritardo di un quarto di periodo, cioè con un fattore $e^{i\pi/2}=i$. La corrispondenza $S_{y}\pm\leftrightarrow$ polarizzazione circolare destra e sinistra dà</p>
   $$|S_{y};\pm\rangle=\frac{1}{\sqrt2}\big(|S_{z};+\rangle\pm i\,|S_{z};-\rangle\big),$$
   <p>e con questi stati le probabilità sono un mezzo rispetto sia agli stati lungo $z$ sia a quelli lungo $x$: per esempio $|\langle S_{x};+|S_{y};+\rangle|^{2}=\tfrac12$. Sakurai conclude: <i>«the two-dimensional vector space needed to describe the spin states of silver atoms must be a complex vector space [...] The fact that the necessity of complex numbers is already apparent in such an elementary example is rather remarkable»</i>.</p>`},
   {label:'Che cosa l analogia non dice', body:R`
   <p>Sakurai avverte di non aver parlato di fotoni: l&rsquo;analogia è fra i vettori di stato di un singolo atomo e i vettori di polarizzazione di un campo classico. Serve a indovinare la struttura, non a giustificarla. La giustificazione viene dal formalismo del momento angolare, che la tappa 04 usa per ricavare gli stessi vettori come autovettori delle matrici di spin.</p>`}
  ]}
]},
/* ---------------- 03 · SEI MODI DI INTRODURRE LO SPIN ---------------- */
{ num:'03', title:'Sei modi di introdurre lo spin, e che cosa ciascuno presuppone', meta:'il postulato per analogia di Picasso · la copia carbone di Griffiths · lo spin che i quattro postulati non coprono di Shankar · la rotazione degli assi di Landau · l ipotesi di Dirac · la definizione di Ballentine · la dimensione minima di Sakurai · la sfera che gira e perché non funziona',
  blocchi:[
  {t:'prosa', title:'Il punto', tag:'formalismi', html:R`
  <p>Tutte le fonti arrivano alle stesse matrici, ma partono da punti diversi, e il punto di partenza dice che cosa ciascuna considera fondamentale. La domanda da tenere in mente è: le relazioni di commutazione $[S_{x},S_{y}]=i\hbar S_{z}$ sono un postulato in più, o seguono da qualcosa che c&rsquo;era già? Il documento di sintesi sui postulati caricato da Giuseppe, nella sua tabella delle fonti, segna per Ballentine che il quinto postulato del corso, i generatori delle simmetrie proporzionali alle grandezze conservate, <i>«è il suo punto di partenza (cap. 3)»</i>. Per lo spin questa differenza diventa visibile.</p>`},
  {t:'reveal', title:'Postulato: Picasso, Griffiths e le note del corso', tag:'postulato', steps:[
   {label:'Picasso: per analogia con il momento magnetico', body:R`
   <p>Picasso parte dal momento magnetico. <i>«Assumiamo che, in analogia con la (13.58), il momento magnetico intrinseco $\vec\mu_{s}$ sia legato a un momento angolare intrinseco, o di spin, dalla relazione»</i> $\vec\mu_{s}=-g\,(e/2m_{e})\,\vec s$, con $g$ da determinare sperimentalmente. Poi: <i>«prendiamo le $\vec s$ come nuove variabili dinamiche per l&rsquo;elettrone. Siccome esse rappresentano un momento angolare devono essere soddisfatte le seguenti regole di commutazione»</i>, le stesse del momento orbitale, e <i>«assumiamo inoltre che le $s_{j}$ commutino con le $q$ e le $p$»</i>. Infine il dato sperimentale: <i>«per spiegare i fatti sperimentali dobbiamo ammettere che le componenti di $\vec s$ abbiano soltanto due autovalori distinti»</i>.</p>
   <p>Da qui segue tutto. Gli autovalori di una componente sono simmetrici rispetto allo zero, perché una rotazione di $\pi$ attorno a un asse ortogonale cambia segno alla componente, e distano $\hbar$, per l&rsquo;algebra generale: con due soli valori sono $\pm\tfrac12\hbar$. Allora ogni $s_{i}^{2}$ ha il solo autovalore $\tfrac14\hbar^{2}$ ed è un multiplo dell&rsquo;identità, e la somma dei tre quadrati, $s^{2}$, vale $\tfrac34\hbar^{2}$. Scritto come $s(s+1)\hbar^{2}$, dà $s=\tfrac12$: <i>«per questo motivo si dice che l&rsquo;elettrone è una particella di spin 1/2»</i>. E Picasso sottolinea la differenza con l&rsquo;orbitale: <i>«mentre $\vec L^{2}$ ha infiniti autovalori, $\vec s^{2}$ ha invece un solo autovalore»</i>.</p>`},
   {label:'Griffiths: una copia carbone, presa come postulato', body:R`
   <p>Griffiths: <i>«the algebraic theory of spin is a carbon copy of the theory of orbital angular momentum, beginning with the fundamental commutation relations»</i>, e in nota dichiara lo statuto: <i>«we shall take these as postulates for the theory of spin; the analogous formulas for orbital angular momentum were derived from the known form of the operators. In a more sophisticated treatment they can both be obtained from rotational invariance in three dimensions»</i>, con un rimando proprio a Ballentine. La differenza con l&rsquo;orbitale sta nelle autofunzioni: <i>«this time the eigenvectors are not spherical harmonics [...] and there is no a priori reason to exclude the half-integer values»</i>. E un fatto che rende lo spin più semplice: <i>«every elementary particle has a specific and immutable value of $s$»</i>, mentre $l$ cambia quando il sistema viene perturbato.</p>`},
   {label:'Le note del corso: i postulati di Pauli', body:R`
   <p>Le note del corso sullo spin seguono la via storica: <i>«prima di Dirac, Pauli sviluppò una teoria che consentiva allo spin di essere incorporato semplicemente nella meccanica quantistica non relativistica attraverso l&rsquo;aggiunta di alcuni postulati supplementari»</i>. I postulati sono quattro: (i) $\mathbf S$ è un momento angolare; (ii) gli operatori di spin agiscono in uno spazio di spin dove $S^{2}$ e $S_{z}$ formano un insieme completo; (iii) lo spazio totale è il <span class="str" data-str="prodotto-tensoriale">prodotto tensoriale</span> dello spazio orbitale per quello di spin, e le osservabili di spin commutano con quelle orbitali; (iv) l&rsquo;elettrone ha spin $\tfrac12$. Le note ricordano anche l&rsquo;ipotesi di Uhlenbeck e Goudsmit del 1925, <i>«l&rsquo;elettrone &ldquo;gira&rdquo;»</i>, con il rapporto giromagnetico doppio di quello orbitale.</p>`}
  ]},
  {t:'reveal', title:'Generatore delle rotazioni: Shankar, Landau, Dirac', tag:'rotazioni', steps:[
   {label:'Shankar: un esperimento che il formalismo sbaglia', body:R`
   <p>Shankar apre il capitolo dicendo che i suoi quattro postulati non bastano: lo spin <i>«has no classical counterpart. Consequently, neither can we obtain the spin operator by turning to Postulate II, nor can we immediately write down the quantum Hamiltonian that governs its time evolution»</i>. Poi un esperimento ideale: un elettrone preparato con impulso nullo ha funzione d&rsquo;onda costante, su cui $L_{z}$ dà zero, ma la misura del momento angolare lungo $z$ dà $\pm\hbar/2$. Quindi c&rsquo;è un momento angolare <i>«not associated with its orbital motion»</i>. Del nome «spin» Shankar dice: <i>«we adopt this nomenclature, but not the mechanical model that goes with it, for a consistent mechanical model doesn&rsquo;t exist»</i>.</p>
   <p>La costruzione è geometrica. Se la funzione d&rsquo;onda ha $n$ componenti, una rotazione fa due cose: riassegna i valori ai punti ruotati, e mescola le componenti fra loro. <i>«The differential operator $L$ does part (1), while an $n\times n$ matrix $S$ is responsible for part (2)»</i>. Il generatore è $J_{z}=L_{z}+S_{z}$, e poiché $\mathbf J$ e $\mathbf L$ soddisfano le relazioni di commutazione e $\mathbf S$ commuta con $\mathbf L$, anche $\mathbf S$ le soddisfa. Quale blocco scegliere, fra le matrici $(2j+1)\times(2j+1)$ dell&rsquo;algebra? <i>«The answer is given by the empirical fact that $S_{z}$ has only the eigenvalues $\pm\hbar/2$»</i>. Con una battuta, Shankar conta la dimensione: lo spin <i>«has doubled the size of Hilbert space; if it was $\infty$ dimensional before, now it is $2\infty$ dimensional, if you know what I mean»</i>.</p>`},
   {label:'Landau: le rotazioni del sistema di coordinate', body:R`
   <p>Landau arriva allo spin da una particella composta, per esempio un nucleo, che a riposo ha un momento angolare interno con $2L+1$ orientazioni: per descriverla come un tutto serve, oltre alle coordinate, una variabile discreta. Ma allora l&rsquo;origine del momento angolare <i>«non è più essenziale»</i>, e lo stesso si deve fare per le particelle elementari: <i>«questa proprietà delle particelle elementari è squisitamente quantistica (essa scompare nel passaggio al limite $\hbar\to0$) e, di conseguenza, non ammette un&rsquo;interpretazione classica»</i>. In nota, con una durezza rara: <i>«sarebbe assolutamente assurdo considerare il momento angolare &ldquo;intrinseco&rdquo; di una particella elementare come risultato della sua rotazione &ldquo;attorno al proprio asse&rdquo;»</i>.</p>
   <p>Le relazioni di commutazione Landau non le postula. Per lo spin <i>«tale deduzione perde senso in quanto l&rsquo;operatore dello spin agisce sulla variabile di spin e non sulle coordinate»</i>, quindi bisogna considerare la rotazione infinitesima <i>«in forma generale, come rotazione del sistema di coordinate»</i>: una rotazione attorno a $x$, una attorno a $y$, e le due inverse, danno una rotazione attorno a $z$ di un angolo pari al prodotto dei due. Il conto con le matrici di rotazione tridimensionali lo conferma: nel prodotto $R_{x}(a)R_{y}(b)R_{x}(-a)R_{y}(-b)$ il termine in $ab$ è esattamente il generatore delle rotazioni attorno a $z$. Le relazioni di commutazione sono quindi una proprietà delle rotazioni, non degli operatori differenziali, e valgono per qualunque momento angolare.</p>
   <p>Il limite classico è un&rsquo;osservazione che le altre fonti non fanno: poiché $s$ è fissato per ogni tipo di particella, il momento angolare di spin $\hbar s$ <i>«si annulla»</i> quando $\hbar\to0$, mentre per l&rsquo;orbitale il limite classico è $\hbar\to0$ e $l\to\infty$ con $\hbar l$ finito.</p>`},
   {label:'Dirac: un moto interno, ma senza analogia classica', body:R`
   <p>Dirac è più disponibile verso l&rsquo;immagine meccanica: <i>«il momento angolare di spin di una particella può essere immaginato come dovuto a un movimento interno della particella stessa, di modo che esso è associato a gradi di libertà diversi da quelli che descrivono il moto della particella nel suo insieme»</i>. Ma ne trae solo che le variabili di spin commutano con quelle orbitali, e aggiunge subito che l&rsquo;analogia classica non serve. La teoria si costruisce <i>«partendo semplicemente dall&rsquo;ipotesi che le componenti del momento angolare di spin siano connesse con gli operatori di rotazione allo stesso modo in cui lo sono le componenti del momento angolare orbitale»</i>. E la differenza decisiva: <i>«per un momento angolare di spin non esiste una rappresentazione di Schrödinger, e sono possibili ambedue i tipi di autovalori»</i>. Dove Landau dice «assurdo», Dirac dice «può essere immaginato»: il disaccordo è sull&rsquo;immagine, non sulla teoria.</p>`}
  ]},
  {t:'prosa', title:'Definizione: Ballentine, e la dimensione minima di Sakurai', tag:'simmetria', html:R`
  <p>Ballentine costruisce tutta la cinematica dal gruppo di Galileo, e lo spin entra come una possibilità che il gruppo lascia aperta. Per una particella libera i generatori delle rotazioni sono $\mathbf Q\times\mathbf P$; ma se esistono operatori che commutano con $\mathbf Q$ e $\mathbf P$, gradi di libertà interni, il generatore può contenere un pezzo in più: <i>«spin is, by definition, an internal contribution to the angular momentum, so that instead of (3.52) the rotation generators are of the form $\mathbf J=\mathbf Q\times\mathbf P+\mathbf S$ with $[\mathbf Q,\mathbf S]=[\mathbf P,\mathbf S]=0$»</i>. Le relazioni di commutazione di $\mathbf S$ non sono un postulato: seguono dal fatto che $\mathbf J$ genera le rotazioni e $\mathbf Q\times\mathbf P$ le soddisfa già. Ballentine ricava anche due conseguenze che le altre fonti danno per scontate: il generatore dei cambi di riferimento resta $\mathbf G=M\mathbf Q$ senza termini di spin, e l&rsquo;energia interna di una particella libera può dipendere dallo spin solo attraverso $\mathbf S\cdot\mathbf S$.</p>
  <p>Sakurai fa un&rsquo;osservazione di matematica e una di fisica. Di matematica: <i>«the lowest number, $N$, of dimensions in which the angular-momentum commutation relations (3.1.20) are realized is $N=2$»</i>. Di fisica: <i>«it is not a priori obvious that nature takes advantage of the lowest-dimensional realization of (3.1.20), but numerous experiments, from atomic spectroscopy to nuclear magnetic resonance, suffice to convince us that this is in fact the case»</i>. E in una nota del primo capitolo indica dove cercare la ragione: <i>«an understanding of the roots of this quantization lies in the application of relativity to quantum mechanics»</i>. Shankar dice lo stesso in nota: l&rsquo;equazione di Dirac porta automaticamente a una funzione d&rsquo;onda a più componenti, <i>«i.e., lead to spin»</i>.</p>
  <p>Messe in fila, le sei vie differiscono su dove sta l&rsquo;ipotesi. Picasso, Griffiths e le note la mettono nelle relazioni di commutazione e nel valore $\tfrac12$. Shankar, Landau e Dirac la mettono nella funzione d&rsquo;onda a più componenti e nel suo comportamento sotto rotazione, e ricavano le relazioni. Ballentine la mette nella struttura del gruppo di Galileo e definisce lo spin come ciò che resta del generatore. Sakurai nota che la natura ha scelto la realizzazione più piccola. Su un punto concordano tutte: il valore $\tfrac12$ per l&rsquo;elettrone è un dato sperimentale, che la meccanica quantistica non relativistica non spiega.</p>`},
  {t:'prosa', title:'La sfera che gira', tag:'modelli', html:R`
  <p>Il modello meccanico fallisce per ragioni quantitative, e vale la pena vederle. Griffiths, nel problema 4.30, chiede: se l&rsquo;elettrone fosse una sfera rigida con il raggio classico $r_{c}=e^{2}/4\pi\epsilon_{0}mc^{2}$, circa $2{,}82\cdot10^{-15}$ m, e momento angolare $\hbar/2$, quanto veloce si muoverebbe un punto dell&rsquo;equatore? Con il momento d&rsquo;inerzia di una sfera piena, $\tfrac25mr^{2}$, la velocità all&rsquo;equatore è $5\hbar/4mr_{c}$, circa $5{,}1\cdot10^{10}$ m/s, cioè circa $171$ volte la velocità della luce. Griffiths aggiunge che il raggio vero dell&rsquo;elettrone è molto più piccolo di $r_{c}$, <i>«but this only makes matters worse»</i>.</p>
  <p>È la stessa obiezione che, secondo l&rsquo;articolo del Giornale di Fisica, Lorentz fece a Goudsmit e Uhlenbeck prima della pubblicazione: <i>«se l&rsquo;elettrone è descritto come una sfera rotante, allora, per ottenere un momento magnetico pari ad un magnetone di Bohr, l&rsquo;elettrone dovrebbe essere troppo massivo o troppo grande»</i>. L&rsquo;articolo ne trae la conclusione: i momenti magnetici intrinseci <i>«non possono essere pensati come dovuti a correnti microscopiche»</i>. Griffiths, in una nota, segnala che esiste <i>«a contrary interpretation»</i>, un articolo di Ohanian del 1986 su che cosa sia lo spin; quell&rsquo;articolo non è fra le fonti del corso e non è stato aperto.</p>`}
]},
/* ---------------- 04 · LE MATRICI DI PAULI ---------------- */
{ num:'04', title:'Le matrici di Pauli costruite dalle sole relazioni algebriche', meta:'Picasso dagli anticommutatori · la fase che resta libera e come la si fissa · Dirac e il prodotto delle tre sigma · le proprieta che servono · ogni matrice due per due come combinazione · le funzioni di sigma sono lineari · spin 1 e spin 3/2 secondo Ballentine',
  blocchi:[
  {t:'reveal', title:'La costruzione di Picasso', tag:'derivazione', steps:[
   {label:'Gli anticommutatori', body:R`
   <p>Picasso costruisce la rappresentazione senza indovinarla. Sceglie la base in cui $s_{z}$ è diagonale, $s_{z}|\pm\rangle=\pm\tfrac12\hbar|\pm\rangle$, così che $s_{z}=\tfrac12\hbar\,\mathrm{diag}(1,-1)$, e scrive $s_{x}$ come la matrice hermitiana più generale, con elementi diagonali reali $a$, $c$ e fuori diagonale $b$, $b^{*}$. Per determinarli usa un fatto della tappa 03: $s_{x}^{2}$ è un multiplo dell&rsquo;identità, quindi commuta con tutto, e</p>
   $$0=[s_{x}^{2},s_{z}]=s_{x}[s_{x},s_{z}]+[s_{x},s_{z}]s_{x}=-i\hbar\,(s_{x}s_{y}+s_{y}s_{x}).$$
   <p>Ne segue, con le permutazioni cicliche, che le componenti dello spin anticommutano a due a due: $\{s_{x},s_{y}\}=\{s_{y},s_{z}\}=\{s_{z},s_{x}\}=0$, dove <i>«l&rsquo;espressione $\{\xi,\eta\}$ viene chiamata anticommutatore di $\xi$ e $\eta$»</i>. È una proprietà dello spin $\tfrac12$ soltanto: per spin più alti $s_{x}^{2}$ non è un multiplo dell&rsquo;identità.</p>`},
   {label:'La matrice di s_x, e la fase', body:R`
   <p>Imponendo $\{s_{z},s_{x}\}=0$ ai rappresentativi si ottiene $a=c=0$: $s_{x}$ ha solo elementi fuori diagonale. La condizione $s_{x}^{2}=\tfrac14\hbar^{2}$ dà $|b|=\tfrac12\hbar$, cioè $b=\tfrac12\hbar\,e^{i\varphi}$ con una fase arbitraria. Picasso spiega da dove viene l&rsquo;arbitrarietà: <i>«$b=\langle+|s_{x}|-\rangle$ riflette esattamente l&rsquo;arbitrarietà che le (15.7) lasciano sulle fasi dei vettori $|+\rangle$ e $|-\rangle$»</i>. Fissare la fase relativa della base equivale a fissare la fase di $b$, e la scelta $\varphi=0$ completa la rappresentazione: $s_{x}=\tfrac12\hbar\begin{pmatrix}0&1\\1&0\end{pmatrix}$.</p>`},
   {label:'s_y dal commutatore', body:R`
   <p>Infine $s_{y}$ si ottiene da $[s_{z},s_{x}]=i\hbar s_{y}$, e risulta $s_{y}=\tfrac12\hbar\begin{pmatrix}0&-i\\i&0\end{pmatrix}$. Scrivendo $\mathbf s=\tfrac12\hbar\boldsymbol\sigma$,</p>
   $$\sigma_{x}=\begin{pmatrix}0&1\\1&0\end{pmatrix},\qquad\sigma_{y}=\begin{pmatrix}0&-i\\i&0\end{pmatrix},\qquad\sigma_{z}=\begin{pmatrix}1&0\\0&-1\end{pmatrix}:$$
   <p><i>«le matrici $\sigma_{i}$ prendono il nome di <span class="str" data-str="matrici-di-pauli">matrici di Pauli</span> e la rappresentazione trovata rappresentazione di Pauli»</i>. Le stesse matrici compaiono, identiche, in Sakurai, Griffiths, Shankar, Ballentine, Landau e nelle note: la convenzione delle fasi qui è universale, a differenza di quella dei polinomi di Laguerre.</p>`},
   {label:'La via di Dirac', body:R`
   <p>Dirac fa lo stesso ragionamento con le $\sigma$ invece delle $s$: dalle relazioni di commutazione e da $\sigma_{z}^{2}=1$ ricava che <i>«ciascuna delle tre variabili dinamiche $\sigma_{x}$, $\sigma_{y}$, $\sigma_{z}$ deve anticommutare con le altre»</i>, e trova in più una relazione che lega tutte e tre: $\sigma_{x}\sigma_{y}\sigma_{z}=i$. Le sue equazioni (37.3)-(37.5), quadrati uguali a uno, anticommutazione e prodotto delle tre, sono per lui <i>«le equazioni fondamentali alle quali soddisfano le variabili di spin $\sigma$ che descrivono uno spin di modulo $\tfrac12$»</i>.</p>`}
  ]},
  {t:'prosa', title:'Le proprietà che servono', tag:'algebra', html:R`
  <p>Le fonti elencano le stesse proprietà in ordine diverso. Ogni $\sigma_{i}$ ha quadrato uno, <span class="str" data-str="traccia">traccia</span> nulla e determinante $-1$; due diverse anticommutano; il prodotto di due è $\sigma_{x}\sigma_{y}=i\sigma_{z}$ e cicliche. Griffiths le riassume in una sola formula, $\sigma_{j}\sigma_{k}=\delta_{jk}+i\sum_{l}\epsilon_{jkl}\sigma_{l}$, il suo problema 4.31; Sakurai e Shankar le combinano nell&rsquo;identità più usata negli esercizi,</p>
   $$(\boldsymbol\sigma\cdot\mathbf a)(\boldsymbol\sigma\cdot\mathbf b)=\mathbf a\cdot\mathbf b+i\,\boldsymbol\sigma\cdot(\mathbf a\times\mathbf b),$$
  <p>che vale anche per vettori di operatori che commutano con lo spin, purché, come avvertono le note del corso, <i>«$A$ e $B$ appaiano nello stesso ordine sul lato destro come sul lato sinistro»</i>. Il caso $\mathbf a=\mathbf b$ dà $(\boldsymbol\sigma\cdot\mathbf a)^{2}=|\mathbf a|^{2}$, e in particolare $(\boldsymbol\sigma\cdot\hat{\mathbf n})^{2}=1$ per ogni versore. Questa sola relazione renderà esplicita, nella tappa 06, qualunque rotazione.</p>
  <p>Shankar aggiunge una proprietà di struttura: con l&rsquo;identità come quarta matrice, $\mathrm{Tr}(\sigma_{\alpha}\sigma_{\beta})=2\delta_{\alpha\beta}$, e quindi le quattro matrici sono una base dello spazio delle matrici due per due. Ogni matrice si scrive $M=\sum_{\alpha}m_{\alpha}\sigma_{\alpha}$ con $m_{\alpha}=\tfrac12\mathrm{Tr}(M\sigma_{\alpha})$, a coefficienti reali se $M$ è hermitiana. Le note del corso lo dicono più semplicemente: <i>«questo è semplicemente dovuto al fatto che una matrice $2\times2$ ha solo quattro elementi»</i>. Shankar propone anche due esercizi che chiudono il quadro: una matrice che commuta con tutte e tre le $\sigma$ è un multiplo dell&rsquo;identità, e nessuna matrice non nulla anticommuta con tutte e tre.</p>
  <p>Landau trae una conseguenza pratica: <i>«ogni espressione scalare polinomiale, formata di matrici $\sigma$, si riduce a termini indipendenti da $\sigma$ e a termini di primo grado in $\sigma$; ne risulta che, in generale, ogni funzione scalare dell&rsquo;operatore $\sigma$ si riduce a una funzione lineare»</i>. Il suo problema 1 dà la formula: $f(a+\mathbf b\cdot\boldsymbol\sigma)$ ha la forma $A+\mathbf B\cdot\boldsymbol\sigma$, con $A=\tfrac12[f(a+b)+f(a-b)]$ e $\mathbf B=\tfrac{\mathbf b}{2b}[f(a+b)-f(a-b)]$, che si ottiene orientando l&rsquo;asse lungo $\mathbf b$, dove gli autovalori sono $a\pm b$. Per l&rsquo;esponenziale, per esempio, $e^{a+b\sigma_{x}}=e^{a}(\cosh b+\sigma_{x}\sinh b)$.</p>`},
  {t:'reveal', title:'Oltre lo spin 1/2: che cosa non si generalizza', tag:'Ballentine', steps:[
   {label:'Le potenze indipendenti', body:R`
   <p>Il problema 3 di Landau chiede quali potenze di $s_{z}$ siano indipendenti per spin $s$. L&rsquo;operatore $\prod_{\sigma}(s_{z}-\sigma)$, prodotto su tutti i $2s+1$ autovalori, dà zero su ogni funzione d&rsquo;onda, quindi $s_{z}^{2s+1}$ si esprime con potenze più basse. Per spin $\tfrac12$ è $s_{z}^{2}=\tfrac14\hbar^{2}$, per spin $1$ è $s_{z}^{3}=\hbar^{2}s_{z}$. La linearità delle funzioni delle $\sigma$ è il caso $s=\tfrac12$ di questa regola.</p>`},
   {label:'Spin 1: i quadrati commutano', body:R`
   <p>Ballentine scrive le matrici di spin $1$ e osserva che i quadrati $S_{x}^{2}$, $S_{y}^{2}$, $S_{z}^{2}$ non sono multipli dell&rsquo;identità ma commutano fra loro, e la loro somma è $2\hbar^{2}$. Quindi hanno autovettori comuni, e <i>«for any such eigenvector, two of the matrices must have the eigenvalue $\hbar^{2}$ and one must have the eigenvalue zero»</i>.</p>`},
   {label:'Spin 3/2: un argomento contro i valori nascosti', body:R`
   <p>Per spin $\tfrac32$ i quadrati delle componenti non commutano più, e Ballentine ne ricava un argomento interpretativo. Ogni $S_{i}^{2}$ ha autovalori $\tfrac94\hbar^{2}$ e $\tfrac14\hbar^{2}$, e la somma dei tre quadrati è $\tfrac{15}{4}\hbar^{2}$. Ma nessuna somma di tre numeri presi da $\{\tfrac94,\tfrac14\}$ fa $\tfrac{15}{4}$: le somme possibili sono $\tfrac34$, $\tfrac{11}{4}$, $\tfrac{19}{4}$, $\tfrac{27}{4}$. Ballentine conclude che non si può pensare che ciascuna componente abbia, istante per istante, uno dei suoi autovalori: <i>«one might have been inclined to regard quantum-mechanical variables as classical stochastic variables, each of which takes on one of its allowed eigenvalues at any instant of time [...] But the above example shows that this interpretation cannot be correct, at least not for angular momentum»</i>. È una versione aritmetica, in una riga, di un argomento che in generale richiede il teorema di Kochen e Specker.</p>`}
  ]}
]},
/* ---------------- 05 · OGNI SPINORE PUNTA DA QUALCHE PARTE ---------------- */
{ num:'05', title:'Ogni stato di spin un mezzo punta in una direzione, e per lo spin 1 non è più vero', meta:'la componente lungo n · gli autovettori con gli angoli dimezzati · quattro fonti e quattro fasi · contare i parametri · la sfera e la proiezione stereografica · l operatore di stato e il vettore di polarizzazione · spin 1 e gli stati che non puntano',
  blocchi:[
  {t:'prosa', title:'La componente lungo una direzione', tag:'autovettori', html:R`
  <p>Lungo il versore $\hat{\mathbf n}=(\sin\theta\cos\phi,\sin\theta\sin\phi,\cos\theta)$ la componente dello spin è $\tfrac12\hbar\,\hat{\mathbf n}\cdot\boldsymbol\sigma$, e Ballentine scrive la matrice esplicitamente:</p>
   $$\hat{\mathbf n}\cdot\boldsymbol\sigma=\begin{pmatrix}\cos\theta&e^{-i\phi}\sin\theta\\ e^{i\phi}\sin\theta&-\cos\theta\end{pmatrix}.$$
  <p>Ha autovalori $\pm1$, come deve per l&rsquo;isotropia dello spazio, e il conto diretto, con le formule di bisezione, dà gli autovettori normalizzati</p>
   $$|\hat{\mathbf n};+\rangle=\begin{pmatrix}e^{-i\phi/2}\cos(\theta/2)\\ e^{i\phi/2}\sin(\theta/2)\end{pmatrix},\qquad|\hat{\mathbf n};-\rangle=\begin{pmatrix}-e^{-i\phi/2}\sin(\theta/2)\\ e^{i\phi/2}\cos(\theta/2)\end{pmatrix}.$$
  <p>Gli angoli sono dimezzati, come la tappa 02 aveva anticipato: lo stato «su» lungo $-\hat{\mathbf z}$, cioè $\theta=\pi$, è ortogonale a quello lungo $+\hat{\mathbf z}$. Il valor medio dello spin nello stato $|\hat{\mathbf n};+\rangle$ è $\tfrac12\hbar\,\hat{\mathbf n}$, un vettore che punta proprio lungo $\hat{\mathbf n}$; e la probabilità di trovare $+\tfrac12\hbar$ lungo $z$ è $\cos^{2}(\theta/2)$.</p>`},
  {t:'prosa', title:'Quattro fonti, quattro fasi', tag:'convenzioni', html:R`
  <p>Gli stessi vettori compaiono in tutte le fonti, ma non con la stessa fase globale. Ballentine e Shankar scrivono la forma simmetrica qui sopra, con $e^{\mp i\phi/2}$. Sakurai ci arriva con due rotazioni, prima di $\beta$ attorno a $y$ e poi di $\alpha$ attorno a $z$, e ottiene la stessa forma con $\beta=\theta$, $\alpha=\phi$, notando che <i>«a phase common to both the upper and the lower components is devoid of physical significance»</i>. Griffiths, nel problema 4.35, dà la forma asimmetrica $(\cos(\theta/2),\,e^{i\phi}\sin(\theta/2))$ e avverte: <i>«you&rsquo;re always free to multiply by an arbitrary phase factor, say, $e^{i\phi}$, so your answer may not look exactly the same as mine»</i>. Le due forme differiscono per il fattore $e^{i\phi/2}$, e le probabilità sono le stesse. Negli esercizi d&rsquo;esame conviene scegliere una forma e tenerla, perché le fasi relative fra stati diversi contano quando si sommano ampiezze.</p>
  <p>Landau ottiene le probabilità senza autovettori, nel suo problema al §54. Se lo spin ha $s_{z}=\tfrac12$, il vettore medio è lungo $z$ e di modulo $\tfrac12$; proiettato su un asse $z'$ che forma un angolo $\theta$ con $z$, dà $\overline{s_{z'}}=\tfrac12\cos\theta$. D&rsquo;altra parte $\overline{s_{z'}}=\tfrac12(w_{+}-w_{-})$, con $w_{+}+w_{-}=1$, e le due equazioni danno $w_{\pm}=\tfrac12(1\pm\cos\theta)$, cioè $\cos^{2}(\theta/2)$ e $\sin^{2}(\theta/2)$. Il ragionamento funziona solo per spin $\tfrac12$, dove due numeri, $w_{+}$ e $w_{-}$, sono fissati da due condizioni.</p>`},
  {t:'reveal', title:'Ogni spinore è «su» lungo qualche direzione', tag:'parametri', steps:[
   {label:'Contare', body:R`
   <p>Ballentine e Shankar fanno la stessa osservazione contando i parametri. Uno spinore ha due componenti complesse, quattro numeri reali; la normalizzazione ne toglie uno e la fase globale un altro, e ne restano due, esattamente quanti gli angoli $\theta$ e $\phi$ di una direzione. Ballentine: <i>«any pure state vector of an $s=\tfrac12$ system can be associated with a spatial direction $\hat{\mathbf n}$ for which it is the $+\tfrac12\hbar$ eigenvector for the component of spin»</i>. Shankar ne trae il corollario inverso: dato il valor medio $\langle\mathbf S\rangle$, che contiene tre numeri, si ricostruisce lo stato, e <i>«every spinor in $V_{s}$ is an eigenket of some spin operator $\hat{\mathbf n}\cdot\mathbf S$ with eigenvalue $\hbar/2$»</i>.</p>`},
   {label:'La sfera e il piano', body:R`
   <p>La corrispondenza fra stati e direzioni ha una forma geometrica che vale la pena vedere. Il rapporto fra le componenti di $|\hat{\mathbf n};+\rangle$ è $e^{i\phi}\tan(\theta/2)$, e $\tan(\theta/2)=\sin\theta/(1+\cos\theta)$ è proprio la distanza dall&rsquo;origine del punto in cui la retta dal polo sud al punto $(\theta,\phi)$ della sfera unitaria buca il piano equatoriale. Il rapporto delle componenti è la <span class="str" data-str="proiezione-stereografica">proiezione stereografica</span> della direzione dello spin sul piano complesso: il polo nord va nello zero, lo stato «su» lungo $z$; il polo sud all&rsquo;infinito, lo stato «giù»; l&rsquo;equatore nel cerchio unitario, gli stati con probabilità un mezzo lungo $z$.</p>`}
  ]},
  {t:'prosa', title:'Stati misti: l operatore di stato', tag:'Ballentine', html:R`
  <p>Ballentine estende il conto agli stati che non sono descritti da un vettore. Un operatore due per due ha quattro parametri, quindi l&rsquo;operatore di stato più generale si scrive $\varrho=\tfrac12(1+\mathbf a\cdot\boldsymbol\sigma)$, con il fattore $\tfrac12$ che fissa la traccia a uno e $\mathbf a$ reale perché $\varrho$ sia hermitiano. Calcolando $\langle\sigma_{x}\rangle=\mathrm{Tr}(\varrho\sigma_{x})$ con le proprietà della tappa 04 si trova $\langle\boldsymbol\sigma\rangle=\mathbf a$: <i>«the vector $\mathbf a$ is called the polarization vector of the state»</i>. Gli autovalori di $\varrho$ sono $\tfrac12(1\pm|\mathbf a|)$, e poiché non possono essere negativi, $|\mathbf a|\le1$. Gli stati puri sono quelli con $|\mathbf a|=1$, la superficie della sfera; quelli misti stanno dentro; al centro, $\mathbf a=0$, c&rsquo;è lo stato non polarizzato, <i>«the simplest and most common example of a state that cannot be described by a state vector»</i>. Un modo compatto di distinguerli è la traccia del quadrato, $\mathrm{Tr}\,\varrho^{2}=\tfrac12(1+|\mathbf a|^{2})$, che vale uno solo per gli stati puri.</p>
  <p>Il fascio che esce dal forno di Stern e Gerlach è in questo stato: lo stesso operatore $\tfrac12\cdot1$ per qualunque direzione, e quindi metà degli atomi in alto e metà in basso qualunque sia l&rsquo;orientazione del magnete.</p>`},
  {t:'plot', title:'Spin 1/2 e spin 1 lungo un asse inclinato',
   intro:R`<p>Stato preparato con il massimo valore lungo $z$, misurato lungo un asse $z'$ che forma un angolo $\theta$ (in gradi) con $z$. Spin $\tfrac12$: probabilità di $+\tfrac12$ (blu). Spin $1$: probabilità di $+1$ (arancio), $0$ (verde), $-1$ (viola).</p>`,
   plots:[{kind:'func2d', xr:[0,180], yr:[0,1.05], height:260, ticks:true,
     title:'probabilita lungo un asse ruotato',
     curves:[{f:'Math.pow(Math.cos(x*Math.PI/360),2)', col:'#5aa9ff', width:2.4, label:'spin 1/2: +1/2'},
             {f:'Math.pow(1+Math.cos(x*Math.PI/180),2)/4', col:'#ffb86b', width:2.2, label:'spin 1: +1'},
             {f:'Math.pow(Math.sin(x*Math.PI/180),2)/2', col:'#6bdc9b', width:2.2, label:'spin 1: 0'},
             {f:'Math.pow(1-Math.cos(x*Math.PI/180),2)/4', col:'#c49bff', width:2.2, label:'spin 1: -1'}],
     xlabel:'theta (gradi)', ylabel:'probabilita'}],
