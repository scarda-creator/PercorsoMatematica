   leggi:R`<p><b>Che cosa guardare.</b> Per spin $\tfrac12$ la probabilità scende dolcemente da uno a zero. Per spin $1$ le tre probabilità sono $\tfrac14(1+\cos\theta)^{2}$, $\tfrac12\sin^{2}\theta$ e $\tfrac14(1-\cos\theta)^{2}$, i quadrati degli elementi della prima colonna della matrice di rotazione di spin $1$; a $90^{\circ}$ valgono $\tfrac14$, $\tfrac12$, $\tfrac14$, e la loro somma è uno per ogni angolo.</p>
   <p><b>Che cosa impararne.</b> La curva blu e quella arancione si somigliano, ma per spin $1$ c&rsquo;è un terzo esito, e non basta più una sola condizione sulla media per fissare le probabilità: è il motivo per cui l&rsquo;argomento di Landau vale solo per spin $\tfrac12$.</p>`},
  {t:'prosa', title:'Spin 1: stati che non puntano da nessuna parte', tag:'Ballentine', html:R`
  <p>Per spin $1$ il conteggio cambia. Uno stato ha tre componenti complesse, sei numeri reali, e tolte normalizzazione e fase ne restano quattro; gli autovettori di $\hat{\mathbf n}\cdot\mathbf S$ ne hanno solo due, gli angoli. Ballentine: <i>«unlike the case of $s=\tfrac12$, it is no longer true that every vector must be an eigenvector of the component of spin in some direction [...] Therefore the pure states of an $s=1$ system need not be associated with a spin eigenvalue in any spatial direction»</i>. Un esempio: lo stato $(1,1,0)/\sqrt2$ nella base di $S_{z}$ ha $\langle\mathbf S\rangle=\hbar\,(\tfrac{1}{\sqrt2},0,\tfrac12)$, di modulo $\tfrac{\sqrt3}{2}\hbar$. Gli autostati di $\hat{\mathbf n}\cdot\mathbf S$ con autovalore $\pm\hbar$ hanno $|\langle\mathbf S\rangle|=\hbar$, quelli con autovalore zero hanno $\langle\mathbf S\rangle=0$: questo stato non è nessuno dei due.</p>
  <p>Lo stesso vale per gli stati misti: l&rsquo;operatore di stato di spin $1$ ha otto parametri, il vettore di polarizzazione tre, e <i>«it is clear that polarization vector does not uniquely determine the state, unlike the case of $s=\tfrac12$»</i>. Lo spin $\tfrac12$ è l&rsquo;unico caso in cui stato e direzione si corrispondono uno a uno, ed è questa la ragione per cui, nel linguaggio comune, si parla di «spin che punta» in una direzione.</p>`}
]},
/* ---------------- 06 · LE ROTAZIONI FINITE ---------------- */
{ num:'06', title:'Le rotazioni finite, e la rotazione completa che cambia segno', meta:'l esponenziale che si somma in chiuso · gli spinori ruotano con meta angolo · i valori medi ruotano come vettori · sigma non e un vettore · SU(2) e SO(3) · due matrici per ogni rotazione · il segno di Landau di Ballentine e di Picasso · gli angoli di Eulero',
  blocchi:[
  {t:'reveal', title:'La matrice di una rotazione', tag:'derivazione', steps:[
   {label:'L esponenziale in forma chiusa', body:R`
   <p>Una rotazione di un angolo $\varphi$ attorno al versore $\hat{\mathbf n}$ è rappresentata, sugli stati, dall&rsquo;<span class="str" data-str="operatore-unitario">operatore unitario</span> $\exp(-i\mathbf S\cdot\hat{\mathbf n}\,\varphi/\hbar)$, che per spin $\tfrac12$ è $\exp(-i\boldsymbol\sigma\cdot\hat{\mathbf n}\,\varphi/2)$. In uno spazio di dimensione infinita un esponenziale di operatore non si somma quasi mai; qui sì. Shankar lo sottolinea: <i>«the fact that $(\hat{\mathbf n}\cdot\boldsymbol\sigma)^{2}=I$ greatly simplifies many computations and allows us to compute in closed form several operators [...] which are intractable in infinite-dimensional spaces»</i>. Separando nella <span class="str" data-str="serie-di-potenze">serie</span> le potenze pari, che valgono uno, da quelle dispari, che valgono $\boldsymbol\sigma\cdot\hat{\mathbf n}$, si ottiene la formula di Sakurai (3.2.44):</p>
   $$\exp\Big(\!-\frac{i\boldsymbol\sigma\cdot\hat{\mathbf n}\,\varphi}{2}\Big)=\cos\frac{\varphi}{2}-i\,\boldsymbol\sigma\cdot\hat{\mathbf n}\,\sin\frac{\varphi}{2}.$$
   <p>È anche il caso particolare della regola di Landau sulle funzioni delle $\sigma$, con $f$ l&rsquo;esponenziale e $\mathbf b$ immaginario.</p>`},
   {label:'Le due rotazioni più usate', body:R`
   <p>Attorno a $z$ la matrice è diagonale, $\mathrm{diag}(e^{-i\varphi/2},e^{i\varphi/2})$: le due componenti acquistano fasi opposte, di metà angolo. Attorno a $y$ è reale,</p>
   $$d^{1/2}(\beta)=\begin{pmatrix}\cos(\beta/2)&-\sin(\beta/2)\\ \sin(\beta/2)&\cos(\beta/2)\end{pmatrix},$$
   <p>ed è la matrice con cui Sakurai costruisce l&rsquo;autospinore di $\boldsymbol\sigma\cdot\hat{\mathbf n}$: partendo da $(1,0)$, una rotazione di $\beta$ attorno a $y$ e una di $\alpha$ attorno a $z$ danno esattamente $(e^{-i\alpha/2}\cos(\beta/2),\,e^{i\alpha/2}\sin(\beta/2))$. Per spin $1$ la stessa rotazione attorno a $y$ ha prima colonna $\big(\tfrac12(1+\cos\beta),\ \tfrac{1}{\sqrt2}\sin\beta,\ \tfrac12(1-\cos\beta)\big)$, e i quadrati di questi tre numeri sono le probabilità per spin $1$ lungo un asse inclinato.</p>`},
   {label:'I valori medi ruotano come vettori', body:R`
   <p>Sakurai controlla che l&rsquo;operatore ruoti davvero il sistema calcolando, in due modi, l&rsquo;effetto su $S_{x}$. Il primo usa le matrici esplicite, il secondo solo le relazioni di commutazione, e danno lo stesso risultato:</p>
   $$e^{iS_{z}\varphi/\hbar}\,S_{x}\,e^{-iS_{z}\varphi/\hbar}=S_{x}\cos\varphi-S_{y}\sin\varphi .$$
   <p>Quindi $\langle S_{x}\rangle\to\langle S_{x}\rangle\cos\varphi-\langle S_{y}\rangle\sin\varphi$, $\langle S_{y}\rangle\to\langle S_{y}\rangle\cos\varphi+\langle S_{x}\rangle\sin\varphi$, $\langle S_{z}\rangle$ invariato: <i>«the expectation value of the spin operator behaves as though it were a classical vector under rotation»</i>. Sakurai osserva che il secondo metodo, usando solo i commutatori, vale per qualunque momento angolare.</p>`},
   {label:'Sigma non è un vettore', body:R`
   <p>Sakurai aggiunge una precisazione che le altre fonti non fanno: sotto rotazione cambiano gli spinori, $\chi\to\exp(-i\boldsymbol\sigma\cdot\hat{\mathbf n}\varphi/2)\chi$, mentre le matrici $\sigma_{k}$ restano le stesse. <i>«So strictly speaking, despite its appearance, $\boldsymbol\sigma$ is not to be regarded as a vector; rather, it is $\chi^{\dagger}\boldsymbol\sigma\chi$ that obeys the transformation property of a vector»</i>. Il notazione $\boldsymbol\sigma$ in grassetto è un abuso utile: un terno di matrici fisse, i cui valori medi formano un vettore.</p>`}
  ]},
  {t:'prosa', title:'Il segno', tag:'2 pi greco', html:R`
  <p>Ora la sorpresa che Sakurai annuncia con un <i>«be prepared for a surprise!»</i>. Una rotazione attorno a $z$ moltiplica la componente su per $e^{-i\varphi/2}$ e quella giù per $e^{i\varphi/2}$. Per $\varphi=2\pi$ entrambe le fasi valgono $-1$, e lo stato cambia segno: <i>«the ket for the 360° rotated state differs from the original ket by a minus sign. We would need a 720° ($\varphi=4\pi$) rotation to get back to the same ket with a plus sign»</i>. Dalla formula in forma chiusa il risultato vale per ogni asse: $\exp(-i\boldsymbol\sigma\cdot\hat{\mathbf n}\,\pi)=-1$. Il segno sparisce dai valori medi, <i>«because $\mathbf S$ is sandwiched by $|\alpha\rangle$ and $\langle\alpha|$, both of which change sign»</i>.</p>
  <p>Landau e Ballentine danno la regola per spin qualunque. Landau integra la rotazione infinitesima attorno a $z$ e trova che le componenti di una funzione di spin $s$ si moltiplicano per $e^{i\sigma\varphi}$, che per $\varphi=2\pi$ è <i>«identico per tutti i $\sigma$ e uguale a $(-1)^{2s}$»</i>: <i>«le funzioni d&rsquo;onda di una particella di spin intero tornano al loro valore iniziale, mentre le funzioni d&rsquo;onda di particelle di spin semintero cambiano di segno»</i>. Ballentine scrive lo stesso per il momento angolare totale, $R(2\pi)|j,m\rangle=(-1)^{2j}|j,m\rangle$, e osserva che vale per ogni asse perché la rotazione non mescola valori diversi di $j$. Picasso lo dice in una frase dopo aver scritto l&rsquo;operatore di rotazione dell&rsquo;elettrone come prodotto di una parte orbitale e una di spin, lecito <i>«solo perché gli addendi all&rsquo;esponente $\vec L\cdot\hat n$ e $\vec s\cdot\hat n$ commutano»</i>: gli autovalori delle componenti di $\vec J$ sono semidispari, e la rotazione di $2\pi$ è $-1$.</p>`},
  {t:'plot', title:'Quattro pi greco',
   intro:R`<p>Stato inizialmente «su» lungo $z$, ruotato di un angolo $\varphi$ (in gradi) attorno a $y$. Ampiezza della componente «su», $\cos(\varphi/2)$ (blu); probabilità di trovare «su», $\cos^{2}(\varphi/2)$ (arancio); valor medio di $\sigma_{z}$, $\cos\varphi$ (verde).</p>`,
   plots:[{kind:'func2d', xr:[0,720], yr:[-1.1,1.1], height:260, ticks:true,
     title:'una rotazione di 360 gradi non basta per l ampiezza',
     curves:[{f:'Math.cos(x*Math.PI/360)', col:'#5aa9ff', width:2.4, label:'ampiezza cos(phi/2)'},
             {f:'Math.pow(Math.cos(x*Math.PI/360),2)', col:'#ffb86b', width:2.2, label:'probabilita'},
             {f:'Math.cos(x*Math.PI/180)', col:'#6bdc9b', width:2.2, label:'<sigma_z> = cos phi'}],
     xlabel:'angolo di rotazione (gradi)', ylabel:''}],
   leggi:R`<p><b>Che cosa guardare.</b> A $360^{\circ}$ la curva verde e quella arancione sono tornate a uno; la blu vale $-1$. Torna a $+1$ solo a $720^{\circ}$.</p>
   <p><b>Che cosa impararne.</b> Tutto ciò che si misura su un fascio ruotato per intero, probabilità e valori medi, ha periodo $2\pi$; l&rsquo;ampiezza ha periodo $4\pi$. Se il segno si possa vedere è la domanda della tappa 07.</p>`},
  {t:'prosa', title:'SU(2) e SO(3)', tag:'gruppi', html:R`
  <p>Sakurai chiama per nome i due gruppi. Le rotazioni dello spazio sono le matrici ortogonali tre per tre a determinante uno, il gruppo $SO(3)$, con tre parametri: nove elementi meno le sei condizioni di ortogonalità. Le matrici che ruotano gli spinori sono unitarie e unimodulari, il gruppo $SU(2)$, e hanno la forma generale</p>
   $$U(a,b)=\begin{pmatrix}a&b\\-b^{*}&a^{*}\end{pmatrix},\qquad|a|^{2}+|b|^{2}=1,$$
  <p>con $a$ e $b$ i parametri di Cayley e Klein, che <i>«were used to characterize complicated motions of gyroscopes in rigid-body kinematics»</i> molto prima della meccanica quantistica. Confrontando con la formula in forma chiusa, $\mathrm{Re}\,a=\cos(\varphi/2)$, $\mathrm{Im}\,a=-n_{z}\sin(\varphi/2)$, $\mathrm{Re}\,b=-n_{y}\sin(\varphi/2)$, $\mathrm{Im}\,b=-n_{x}\sin(\varphi/2)$, e il determinante è $\cos^{2}(\varphi/2)+|\hat{\mathbf n}|^{2}\sin^{2}(\varphi/2)=1$. Landau arriva alle stesse condizioni senza parlare di gruppi: il determinante uno perché la forma $\psi^{1}\varphi^{2}-\psi^{2}\varphi^{1}$ fra due spinori deve essere uno scalare, e l&rsquo;unitarietà perché la probabilità $|\psi^{1}|^{2}+|\psi^{2}|^{2}$ deve esserlo.</p>
  <p>I due gruppi non sono lo stesso gruppo. <i>«Consider a rotation by $2\pi$ and another one by $4\pi$. In the $SO(3)$ language the matrices representing a $2\pi$ rotation and a $4\pi$ rotation are both $3\times3$ identity matrices; however, in the $SU(2)$ language the corresponding matrices are $-1$ times the $2\times2$ identity matrix and the identity matrix itself»</i>. In generale $U$ e $-U$ producono la stessa rotazione dei valori medi, perché la matrice di rotazione si ottiene come $R_{kl}=\tfrac12\mathrm{Tr}(\sigma_{k}U\sigma_{l}U^{\dagger})$, dove $U$ compare due volte. La corrispondenza è due a uno, e i gruppi sono <i>«locally isomorphic»</i>: vicino all&rsquo;identità non si distinguono, lontano sì.</p>
  <p>Sakurai aggiunge un avvertimento pratico sugli angoli di Eulero: in meccanica classica la rotazione centrale si fa spesso attorno all&rsquo;asse $x$ del corpo, ma <i>«this convention is to be avoided in quantum mechanics»</i>, perché con la rotazione attorno a $y$ la matrice $d^{1/2}(\beta)$ è reale. Ballentine usa la convenzione di Sakurai, e chi incontra la matrice di rotazione di spin $\tfrac12$ in una forma diversa deve controllare quale asse è stato scelto.</p>`}
]},
/* ---------------- 07 · IL SEGNO SI VEDE O NO ---------------- */
{ num:'07', title:'Il segno di una rotazione completa: Sakurai lo misura, Ballentine dimostra che non si vede', meta:'l interferometro a neutroni · la differenza di campo fra due massimi · un fattore due fra le due ipotesi · la regola di superselezione · superselezione contro simmetria ordinaria · perche le due affermazioni sono vere insieme',
  blocchi:[
  {t:'prosa', title:'La domanda', tag:'interpretazione', html:R`
  <p>Il segno meno della tappa 06 è un fatto del formalismo. È anche un fatto fisico? Le due fonti più attente alla questione rispondono in modi che sembrano opposti. Sakurai descrive un esperimento che lo misura, e conclude che <i>«the nontrivial prediction (3.2.15) has been experimentally established in a direct manner»</i>. Ballentine dimostra che nessuna osservabile può distinguere uno stato dal suo ruotato di $2\pi$, e ne fa una regola di superselezione. Prima di decidere chi abbia ragione conviene leggerli tutti e due per intero.</p>`},
  {t:'reveal', title:'L esperimento descritto da Sakurai', tag:'Sakurai', steps:[
   {label:'Che cosa bisogna confrontare', body:R`
   <p>Sakurai comincia escludendo l&rsquo;ovvio: <i>«quite clearly, if every state ket in the universe is multiplied by a minus sign, there will be no observable effect. The only way to detect the predicted minus sign is to make a comparison between an unrotated state and a rotated state»</i>. Un fascio di neutroni termici quasi monoenergetici viene diviso in due cammini. Il cammino A non incontra campi; il cammino B attraversa una piccola regione con un campo magnetico statico, dove lo spin precede per un tempo $T$. All&rsquo;uscita, l&rsquo;ampiezza del cammino B ha acquistato il fattore $e^{\mp i\omega T/2}$, con $\omega$ la frequenza di precessione del neutrone, e i due cammini si ricombinano.</p>`},
   {label:'L intensità contro il campo', body:R`
   <p>L&rsquo;intensità nella regione di interferenza varia come $\cos(\mp\omega T/2+\delta)$, dove $\delta$ è la differenza di fase dei due cammini a campo nullo. Nell&rsquo;esperimento $T$ è fisso e si varia il campo, quindi $\omega$. Fra due massimi successivi $\omega T/2$ deve cambiare di $2\pi$, cioè $\omega T$ di $4\pi$. Con $\omega$ proporzionale al campo, $\omega=|\gamma_{n}|B$, e $T=l/v$, la differenza di campo fra due massimi è $\Delta B=4\pi v/(|\gamma_{n}|\,l)$; scritta con la lunghezza d&rsquo;onda ridotta $\bar\lambda=\hbar/m_{n}v$ e le unità gaussiane di Sakurai è la sua (3.2.25), $\Delta B=4\pi\hbar c/(e\,g_{n}\bar\lambda\,l)$.</p>
   <p>Il punto è il fattore $4\pi$: <i>«if, on the other hand, our description of spin $\tfrac12$ systems were incorrect and the ket were to return to its original ket with the same sign under a $2\pi$ rotation, the predicted value for $\Delta B$ would be just one-half of (3.2.25)»</i>. Due gruppi, Rauch e collaboratori e Werner e collaboratori, nel 1975, trovarono il valore con $4\pi$ <i>«to an accuracy of a fraction of a percent»</i>.</p>`},
   {label:'Un ordine di grandezza', body:R`
   <p>Sakurai non dà i numeri dell&rsquo;esperimento; un esempio fatto qui, con valori tipici, mostra la scala. Neutroni con lunghezza d&rsquo;onda di $1{,}8$ Å hanno velocità $h/m_{n}\lambda$ di circa $2200$ m/s; in una regione di campo lunga $2$ cm restano circa $9{,}1$ microsecondi. Con il rapporto giromagnetico del neutrone, circa $1{,}83\cdot10^{8}$ rad s$^{-1}$ T$^{-1}$, la differenza fra due massimi è di circa $75$ gauss se lo spinore ha periodo $4\pi$, e sarebbe di circa $38$ gauss se avesse periodo $2\pi$. Una differenza di un fattore due fra campi di qualche decina di gauss è facile da misurare.</p>`}
  ]},
  {t:'plot', title:'Le due previsioni',
   intro:R`<p>Intensità nella regione di interferenza, in unità arbitrarie, in funzione del campo nel cammino B (in gauss), con i numeri dell&rsquo;esempio. Previsione con lo spinore che cambia segno a $2\pi$ (blu, periodo circa $75$ G) e previsione ipotetica con lo spinore che torna uguale a $2\pi$ (arancio, periodo circa $38$ G).</p>`,
   plots:[{kind:'func2d', xr:[0,160], yr:[0,2.1], height:250, ticks:true,
     title:'interferometria neutronica: periodo in B',
     curves:[{f:'1+Math.cos(2*Math.PI*x/75.36)', col:'#5aa9ff', width:2.4, label:'spinore: periodo 4 pi'},
             {f:'1+Math.cos(2*Math.PI*x/37.68)', col:'#ffb86b', width:2.0, label:'ipotesi: periodo 2 pi'}],
     xlabel:'B (gauss)', ylabel:'intensita'}],
   leggi:R`<p><b>Che cosa guardare.</b> La curva blu ha massimi a $0$, $75$, $151$ gauss; l&rsquo;arancione a $0$, $38$, $75$, $113$, $151$. A $38$ gauss le due previsioni sono opposte: un massimo per una, un minimo per l&rsquo;altra.</p>
   <p><b>Che cosa impararne.</b> A $38$ gauss lo spin del cammino B ha compiuto una rotazione completa, $\omega T=2\pi$; l&rsquo;intensità è minima, quindi l&rsquo;ampiezza del cammino B è cambiata di segno rispetto a quella del cammino A. È un segno relativo fra due pezzi dello stesso stato, ed è questo che si misura.</p>`},
  {t:'reveal', title:'La regola di superselezione di Ballentine', tag:'Ballentine', steps:[
   {label:'Il postulato', body:R`
   <p>Ballentine parte dall&rsquo;intuizione comune: <i>«we are accustomed to thinking of a rotation through $2\pi$ as a trivial operation that leaves everything unchanged. Corresponding to this belief, we shall assume that all dynamical variables are invariant under $2\pi$ rotation»</i>, cioè $R(2\pi)AR^{-1}(2\pi)=A$ per ogni osservabile. Ma $R(2\pi)$ non è l&rsquo;identità: divide lo spazio in due sottospazi, quello dei momenti angolari interi, dove vale $+1$, e quello dei semiinteri, dove vale $-1$.</p>`},
   {label:'Nessun elemento di matrice fra i due sottospazi', body:R`
   <p>Se $|+\rangle$ sta nel primo e $|-\rangle$ nel secondo, dall&rsquo;uguaglianza fra $\langle+|R(2\pi)A|-\rangle$ e $\langle+|AR(2\pi)|-\rangle$ segue che $\langle+|A|-\rangle$ è uguale al proprio opposto, quindi zero. Nel linguaggio delle matrici: un&rsquo;osservabile che commuta con $\mathrm{diag}(1,-1)$ è diagonale a blocchi. <i>«Thus no physical observable can have nonvanishing matrix elements between states with integer angular momentum and states with half odd-integer angular momentum. This fact forms the basis of a superselection rule»</i>. La conseguenza è che negli stati $|+\rangle+e^{i\omega}|-\rangle$ la fase $\omega$ non si vede: qualunque valor medio è $\langle+|A|+\rangle+\langle-|A|-\rangle$, indipendente da $\omega$. E poiché anche la hamiltoniana è un&rsquo;osservabile, se gli elementi incrociati dell&rsquo;operatore di stato sono nulli all&rsquo;inizio restano nulli per sempre.</p>`},
   {label:'Superselezione contro simmetria ordinaria', body:R`
   <p>Ballentine distingue la superselezione da una <span class="str" data-str="simmetrie">simmetria</span> ordinaria come l&rsquo;invarianza per traslazioni, che ha l&rsquo;aspetto simile di una grandezza conservata. <i>«The difference is that there exist observables that do not commute with $\mathbf P$, such as the position $\mathbf Q$, but there are no observables that fail to commute with $R(2\pi)$. By measuring the position one can distinguish between states that differ only by a displacement, but there is no way to distinguish between states that differ only by a $2\pi$ rotation»</i>. Aggiunge che, nella meccanica quantistica delle particelle stabili, questa è l&rsquo;unica regola di superselezione; in teoria dei campi ce n&rsquo;è un&rsquo;altra, quella della carica elettrica. Il documento di sintesi caricato da Giuseppe colloca le regole di superselezione nella formulazione algebrica della meccanica quantistica e annota che sono state <i>«viste dal prof»</i>: è un&rsquo;affermazione del documento, che qui non si può controllare.</p>`}
  ]},
  {t:'prosa', title:'Perché hanno ragione tutti e due', tag:'sintesi', html:R`
  <p>Il contrasto si scioglie guardando a che cosa si applica la rotazione. Ballentine parla della rotazione dell&rsquo;intero sistema, un&rsquo;operazione geometrica che trasforma ogni stato e ogni osservabile; Sakurai parla di un pezzo dello stato, il cammino B, a cui un campo fa compiere una precessione mentre il cammino A resta fermo. Nel primo caso il segno moltiplica tutto, ed è, come dice Sakurai stesso, inosservabile. Nel secondo è un segno relativo fra due componenti dello stesso neutrone, entrambe nel sottospazio dei semiinteri, e la regola di superselezione non lo riguarda: vieta l&rsquo;interferenza fra momenti angolari interi e semiinteri, non fra due rami di uno spin $\tfrac12$.</p>
  <p>C&rsquo;è anche una differenza di natura, che Ballentine stesso sottolinea in un altro punto del libro parlando delle traslazioni: un generatore di simmetria descrive <i>«the purely geometric operation of displacing the system self-congruently to another location»</i>, mentre la precessione in un campo è evoluzione temporale, un processo fisico generato dalla hamiltoniana. La tappa 08 mostra che le due cose hanno la stessa matrice, ed è per questo che l&rsquo;esperimento di Sakurai «vede» una rotazione: ma il confronto è fra un ramo che ha subito il processo e uno che non lo ha subito. Le due fonti dicono quindi cose compatibili, e insieme dicono che cosa si intende esattamente quando si afferma che «uno spinore cambia segno per una rotazione di $2\pi$»: cambia segno rispetto a una copia non ruotata di sé stesso.</p>`}
]},
/* ---------------- 08 · LA PRECESSIONE ---------------- */
{ num:'08', title:'La precessione: la rotazione fatta dal tempo', meta:'la hamiltoniana di uno spin fermo in un campo · l evoluzione e una rotazione · il valor medio precede alla frequenza di Larmor · le probabilita oscillano · il periodo dello stato e il doppio · tre convenzioni di segno · elettroni protoni neutroni e muoni',
  blocchi:[
  {t:'prosa', title:'La hamiltoniana', tag:'dinamica', html:R`
  <p>Un momento magnetico in un campo ha energia $-\boldsymbol\mu\cdot\mathbf B$, e se il momento è proporzionale allo spin, $\boldsymbol\mu=\gamma\mathbf S$, la hamiltoniana di uno spin fermo è $H=-\gamma\mathbf B\cdot\mathbf S$. Griffiths la scrive così, con $\gamma$ il rapporto giromagnetico, e avverte in nota che è la hamiltoniana di una particella ferma: se la particella si muove c&rsquo;è anche l&rsquo;energia cinetica e la forza di Lorentz, <i>«which is not derivable from a potential energy function, and hence does not fit the Schrödinger equation as we have formulated it so far»</i>. Con il campo lungo $z$, $H=-\gamma B_{0}S_{z}$, gli autostati sono quelli di $S_{z}$ con energie $\mp\tfrac12\gamma B_{0}\hbar$, e <i>«the energy is lowest when the dipole moment is parallel to the field, just as it would be classically»</i>.</p>
  <p>Le convenzioni di segno cambiano da fonte a fonte, e conviene saperlo prima di confrontare formule. Griffiths usa unità SI e per l&rsquo;elettrone $\gamma=-e/m$, il doppio del valore classico. Sakurai usa unità gaussiane e una carica dell&rsquo;elettrone negativa, $e\lt0$, e scrive la hamiltoniana $-(e/m_{e}c)\,\mathbf S\cdot\mathbf B$ nella forma $\omega S_{z}$, con $\omega=|e|B/m_{e}c$. Picasso scrive il momento intrinseco come $-g\,(e/2m_{e})\,\vec s$, con $e$ positivo e il segno esplicito. Sono la stessa fisica: per l&rsquo;elettrone il momento magnetico è opposto allo spin, e la frequenza di precessione è $g\,|e|B/2m_{e}$, con $g\approx2$.</p>`},
  {t:'reveal', title:'L evoluzione è una rotazione', tag:'derivazione', steps:[
   {label:'Sakurai: la stessa matrice', body:R`
   <p>L&rsquo;operatore di evoluzione per $H=\omega S_{z}$ è $\exp(-iS_{z}\omega t/\hbar)$. Sakurai osserva: <i>«comparing this equation with (3.2.3), we see that the time-evolution operator here is precisely the same as the rotation operator in (3.2.3) with $\varphi$ set equal to $\omega t$. In this manner we see immediately why this Hamiltonian causes spin precession»</i>. Tutto ciò che la tappa 06 ha detto delle rotazioni attorno a $z$ vale con $\varphi=\omega t$: $\langle S_{x}\rangle_{t}=\langle S_{x}\rangle_{0}\cos\omega t-\langle S_{y}\rangle_{0}\sin\omega t$, $\langle S_{y}\rangle_{t}=\langle S_{y}\rangle_{0}\cos\omega t+\langle S_{x}\rangle_{0}\sin\omega t$, $\langle S_{z}\rangle$ costante.</p>`},
   {label:'Griffiths: l angolo di apertura', body:R`
   <p>Griffiths prende come stato iniziale $(\cos(\alpha/2),\sin(\alpha/2))$, lo spin «su» lungo una direzione che forma un angolo $\alpha$ con $z$ nel piano $xz$, e calcola i tre valori medi:</p>
   $$\langle S_{x}\rangle=\frac\hbar2\sin\alpha\cos(\gamma B_{0}t),\qquad\langle S_{y}\rangle=-\frac\hbar2\sin\alpha\sin(\gamma B_{0}t),\qquad\langle S_{z}\rangle=\frac\hbar2\cos\alpha .$$
   <p><i>«Evidently $\langle\mathbf S\rangle$ is tilted at a constant angle $\alpha$ to the $z$-axis, and precesses about the field at the Larmor frequency»</i> $\omega=\gamma B_{0}$, <i>«just as it would classically»</i>. In nota precisa la differenza: <i>«of course, in the classical case it is the angular momentum vector itself, not just its expectation value, that precesses around the magnetic field»</i>.</p>`},
   {label:'L equazione del moto', body:R`
   <p>Lo stesso risultato si ottiene senza risolvere niente, dall&rsquo;equazione di Heisenberg, che dà la derivata temporale di $S_{x}$ come $(i/\hbar)[H,S_{x}]$. Con $H=-\gamma B S_{z}$ e il <span class="str" data-str="commutatore">commutatore</span> $[S_{z},S_{x}]=i\hbar S_{y}$ il secondo membro è $\gamma B S_{y}$, che è proprio la componente $x$ di $\gamma\,\mathbf S\times\mathbf B$ per un campo lungo $z$. Le tre componenti danno l&rsquo;equazione classica del giroscopio, $d\mathbf S/dt=\gamma\,\mathbf S\times\mathbf B$, valida come equazione fra operatori e quindi per i valori medi: è il teorema di Ehrenfest che Griffiths cita, nella forma più semplice possibile perché la hamiltoniana è lineare nello spin.</p>`}
  ]},
  {t:'plot', title:'Precessione e probabilità',
   intro:R`<p>Spin inizialmente «su» lungo $x$ ($\alpha=\pi/2$), in un campo lungo $z$; tempo in unità di $1/\omega$. Valor medio di $S_{x}$ in unità $\hbar/2$ (blu), di $S_{y}$ (arancio), probabilità di trovare $+\hbar/2$ lungo $x$ (verde), parte reale della prima componente dello spinore, $\cos(\omega t/2)/\sqrt2$ in unità di $1/\sqrt2$ (viola).</p>`,
   plots:[{kind:'func2d', xr:[0,12.6], yr:[-1.1,1.1], height:270, ticks:true,
     title:'precessione di Larmor',
     curves:[{f:'Math.cos(x)', col:'#5aa9ff', width:2.4, label:'<S_x>'},
             {f:'Math.sin(x)', col:'#ffb86b', width:2.2, label:'<S_y>'},
             {f:'Math.pow(Math.cos(x/2),2)', col:'#6bdc9b', width:2.2, label:'P(S_x = +)'},
             {f:'Math.cos(x/2)', col:'#c49bff', width:1.8, label:'fase dello stato'}],
     xlabel:'omega t', ylabel:''}],
   leggi:R`<p><b>Che cosa guardare.</b> I valori medi e la probabilità tornano ai valori iniziali a $\omega t=2\pi\approx6{,}28$; la curva viola, che segue la fase della componente dello stato, a $2\pi$ vale $-1$ e torna a $+1$ solo a $4\pi\approx12{,}57$. La probabilità verde è $\cos^{2}(\omega t/2)=\tfrac12(1+\cos\omega t)$, cioè $\tfrac12(1+\langle\sigma_{x}\rangle)$.</p>
   <p><b>Che cosa impararne.</b> Sakurai lo riassume con due periodi: quello della precessione, $2\pi/\omega$, e quello del vettore di stato, $4\pi/\omega$, il doppio. Il secondo è quello misurato dall&rsquo;interferometro della tappa 07, dove il confronto con il cammino senza campo rende visibile la fase.</p>`},
  {t:'prosa', title:'Che cosa precede, e quanto in fretta', tag:'numeri', html:R`
  <p>Per l&rsquo;elettrone, con $g$ appena sopra due, la frequenza di precessione in un campo di un tesla è $g\,eB/2m_{e}$, circa $1{,}76\cdot10^{11}$ rad/s, cioè circa $28{,}0$ GHz: è la frequenza della risonanza di spin elettronico. Per il protone il rapporto giromagnetico è circa $2{,}675\cdot10^{8}$ rad s$^{-1}$ T$^{-1}$, e la frequenza in un tesla è circa $42{,}6$ MHz, la frequenza della risonanza magnetica nucleare negli ospedali. Il rapporto fra le due è circa $658$, poco meno del rapporto fra le masse, perché il fattore $g$ del protone è circa $5{,}59$ invece di due.</p>
  <p>Sakurai ricorda che la precessione è stata misurata direttamente sul muone, <i>«an electron-like particle that is, however, 210 times as heavy»</i>, sfruttando il fatto che <i>«electrons from muon decay tend to be emitted preferentially in the direction opposite to the muon spin»</i>: la direzione di emissione degli elettroni di decadimento fa da indicatore della direzione dello spin istante per istante. Picasso ricorda il valore del fattore $g$ dell&rsquo;elettrone con quattordici cifre, e il fatto che la sua differenza da due sia spiegata dall&rsquo;elettrodinamica quantistica; Sakurai, per il muone, <i>«we will here neglect very small corrections that arise from quantum field theory effects»</i>.</p>`}
]},
/* ---------------- 09 · STERN E GERLACH IN MECCANICA QUANTISTICA ---------------- */
{ num:'09', title:'Stern e Gerlach in meccanica quantistica: la forza diventa un impulso correlato allo spin', meta:'il campo di Griffiths con divergenza nulla · la forza classica e la media della precessione · il riferimento che si muove con l atomo · la fase che dipende da z e un impulso · la correlazione fra spin e impulso secondo Ballentine · perche non con elettroni liberi · i numeri per l argento',
  blocchi:[
  {t:'reveal', title:'Prima il conto semiclassico', tag:'Griffiths', steps:[
   {label:'Un campo che rispetta Maxwell', body:R`
   <p>Griffiths, nell&rsquo;esempio 4.4, prende un campo disomogeneo il più semplice possibile: $\mathbf B=-\alpha x\,\hat{\mathbf x}+(B_{0}+\alpha z)\,\hat{\mathbf z}$, con $B_{0}$ un campo uniforme intenso e $\alpha$ una piccola disomogeneità. Avverte che la componente $x$ non si può evitare: <i>«actually, what we&rsquo;d like is just the $z$ component, but unfortunately that&rsquo;s impossible, it would violate the electromagnetic law $\nabla\cdot\mathbf B=0$; like it or not, an $x$ component comes along for the ride»</i>. Il campo scelto ha divergenza nulla e anche rotore nullo, ed è quindi un campo magnetostatico lecito nel vuoto, coerente con il <span class="str" data-str="teorema-della-divergenza">teorema della divergenza</span> per un flusso che si conserva.</p>`},
   {label:'La forza, e la media', body:R`
   <p>La forza su un dipolo è $\mathbf F=\nabla(\mathbf m\cdot\mathbf B)$, che per questo campo vale $\gamma\alpha(-S_{x}\hat{\mathbf x}+S_{z}\hat{\mathbf z})$. <i>«But because of the Larmor precession about $B_{0}$, $S_{x}$ oscillates rapidly, and averages to zero; the net force is in the $z$ direction»</i>, $F_{z}=\gamma\alpha S_{z}$, e il fascio è deviato in proporzione alla componente $z$ dello spin. <i>«Classically we&rsquo;d expect a smear (because $S_{z}$ would not be quantized), but in fact the beam splits into $2s+1$ separate streams, beautifully demonstrating the quantization of angular momentum»</i>. È lo stesso ragionamento di Stern del 1921, con lo spin al posto del momento orbitale.</p>`},
   {label:'L obiezione di Griffiths a sé stesso', body:R`
   <p>Subito dopo Griffiths ammette il limite del conto: <i>«that argument was purely classical, up to the very final step; &ldquo;force&rdquo; has no place in a proper quantum calculation»</i>. E rifà il problema seguendo, lo dichiara in nota, il §9.1 di Ballentine.</p>`}
  ]},
  {t:'reveal', title:'Poi il conto quantistico', tag:'Griffiths e Ballentine', steps:[
   {label:'Nel riferimento dell atomo', body:R`
   <p>Nel riferimento che si muove con il fascio, l&rsquo;atomo è fermo e il campo si accende per il tempo $T$ in cui attraversa il magnete, poi si spegne. Trascurando la componente $x$, per le ragioni appena viste, la hamiltoniana è $-\gamma(B_{0}+\alpha z)S_{z}$ per $0\lt t\lt T$ e zero altrimenti. Ballentine la scrive nella forma ridotta $-cz\,\sigma_{z}$, con la costante $c$ che contiene gradiente e momento magnetico, e giustifica l&rsquo;idealizzazione: se $B_{0}$ è molto maggiore di $B_{x}$, la componente trasversa precede rapidamente e la sua forza si annulla in media, come mostrato <i>«by Alstrom, Hjorth, and Mattuck (1982), using a semiclassical analysis, and by Platt (1992) using a fully quantum-mechanical analysis»</i>. Il lavoro di Alstrøm, Hjorth e Mattuck è lo stesso che l&rsquo;articolo del Giornale di Fisica cita come critica della descrizione usuale nei libri.</p>`},
   {label:'Una fase che dipende da z', body:R`
   <p>Lo stato iniziale $a\chi_{+}+b\chi_{-}$ evolve con energie $\mp\tfrac12\gamma(B_{0}+\alpha z)\hbar$, ed esce dal magnete come</p>
   $$\chi=a\,e^{i\gamma T(B_{0}+\alpha z)/2}\,\chi_{+}+b\,e^{-i\gamma T(B_{0}+\alpha z)/2}\,\chi_{-}.$$
   <p>Il fattore $e^{\pm i\alpha\gamma Tz/2}$ è un&rsquo;onda piana in $z$: la componente su porta impulso $p_{z}=\alpha\gamma T\hbar/2$, quella giù l&rsquo;impulso opposto. <i>«Thus the beam splits in two, as before»</i>. E il conto è coerente con quello semiclassico: per $S_{z}=\hbar/2$, la forza $F_{z}=\gamma\alpha\hbar/2$ agisce per un tempo $T$ e dà proprio quell&rsquo;impulso.</p>`},
   {label:'Una correlazione, non una forza', body:R`
   <p>Ballentine trae la lezione: <i>«the effect of the interaction is to create a correlation between the spin and the momentum of the particle»</i>. Se lo stato iniziale ha una larghezza in impulso piccola rispetto all&rsquo;impulso impartito, la deviazione in su o in giù indica il segno di $\sigma_{z}$. E generalizza: <i>«the essential feature of any measurement procedure is the establishment of a correlation between the dynamical variable to be measured (the spin component $\sigma_{z}$ in this example), and some macroscopic indicator that can be directly observed (the upward or downward deflection of the beam in this example)»</i>. Il magnete non orienta gli spin, come temevano Einstein ed Ehrenfest: lascia le ampiezze $a$ e $b$ intatte e le attacca a due pacchetti che si allontanano.</p>`}
  ]},
  {t:'plot', title:'Il pacchetto che si divide',
   intro:R`<p>Densità di probabilità lungo $z$ sulla lastra, per uno spin preparato lungo una direzione a $60^{\circ}$ da $z$ ($|a|^{2}=\cos^{2}30^{\circ}=\tfrac34$, $|b|^{2}=\tfrac14$), in unità della deflessione; prima del magnete (blu) e dopo (arancio).</p>`,
   plots:[{kind:'func2d', xr:[-2,2], yr:[0,1.6], height:250, ticks:true,
     title:'Stern e Gerlach: due pacchetti con pesi |a|^2 e |b|^2',
     curves:[{f:'Math.exp(-x*x/0.08)/Math.sqrt(0.08*Math.PI)', col:'#5aa9ff', width:2.2, label:'prima'},
             {f:'(0.75*Math.exp(-(x-1)*(x-1)/0.08)+0.25*Math.exp(-(x+1)*(x+1)/0.08))/Math.sqrt(0.08*Math.PI)', col:'#ffb86b', width:2.4, label:'dopo'}],
     xlabel:'z / deflessione', ylabel:'densita'}],
   leggi:R`<p><b>Che cosa guardare.</b> Il pacchetto iniziale si divide in due, centrati a $\pm1$, con aree $\tfrac34$ e $\tfrac14$: le probabilità di $S_{z}=\pm\hbar/2$ per uno spin lungo $60^{\circ}$, $\cos^{2}(30^{\circ})$ e $\sin^{2}(30^{\circ})$. La larghezza dei due pacchetti è quella del pacchetto iniziale.</p>
   <p><b>Che cosa impararne.</b> La misura è una traduzione: la distribuzione di probabilità di una variabile interna, lo spin, diventa una distribuzione nello spazio, dove si può leggere con una lastra. Perché la traduzione sia fedele i due pacchetti non devono sovrapporsi, cioè la deflessione deve superare la larghezza: la condizione di Ballentine sugli impulsi.</p>`},
  {t:'prosa', title:'I numeri per l argento, e perché non con elettroni', tag:'stime', html:R`
  <p>Sakurai giustifica le traiettorie classiche dicendo che <i>«because the atom as a whole is very heavy, we expect that the classical concept of trajectory can be legitimately applied»</i>. I numeri lo confermano. Un atomo d&rsquo;argento a $534$ m/s ha lunghezza d&rsquo;onda di de Broglie di circa $6{,}9\cdot10^{-12}$ m, molto più piccola di qualunque dimensione dell&rsquo;apparato. L&rsquo;impulso impartito, $\mu_{B}(\partial B_{z}/\partial z)\,l/v$ con i valori della tappa 01, è circa $6{,}1\cdot10^{-25}$ kg m/s; l&rsquo;indeterminazione minima dell&rsquo;impulso per una fenditura larga $0{,}03$ mm, $\hbar/2\Delta z$ con $\Delta z$ metà della larghezza, è circa $3{,}5\cdot10^{-30}$ kg m/s, centomila volte più piccola. La condizione di Ballentine è soddisfatta con un margine enorme; la vera causa della larghezza delle macchie, dice l&rsquo;articolo del Giornale di Fisica, è <i>«la distribuzione maxwelliana della velocità degli atomi»</i>.</p>
  <p>Perché atomi neutri e non elettroni liberi? Griffiths: <i>«we make them neutral so as to avoid the large-scale deflection that would otherwise result from the Lorentz force, and heavy so we can construct localized wave packets and treat the motion in terms of classical particle trajectories. In practice, the Stern-Gerlach experiment doesn&rsquo;t work, for example, with a beam of free electrons»</i>. Ballentine dice lo stesso: per particelle cariche <i>«the deflection of a charged particle by the Lorentz force will obscure this spin-dependent deflection»</i>. E Sakurai spiega perché l&rsquo;argento si comporta come un elettrone solo: 46 dei 47 elettroni formano una nuvola a simmetria sferica senza momento angolare, e il momento magnetico dell&rsquo;atomo è quello dello spin del quarantasettesimo, l&rsquo;elettrone $5s$. Shankar aggiunge una precisazione che vale per tutti gli esperimenti di questo tipo: <i>«in practice one measures not the angular momentum, but a related quantity called magnetic moment»</i>.</p>`}
]},
/* ---------------- 10 · CHE COSA DICE UNA MISURA DI SPIN ---------------- */
{ num:'10', title:'Che cosa dice una misura di spin: le stesse previsioni lette in modi diversi', meta:'il dialogo di Griffiths con il realista · l indeterminazione per due componenti · Sakurai e l informazione distrutta · l esperimento di ricombinazione di Ballentine · la riduzione come effetto dell ambiente · Fuchs e Peres · il trilemma e le interpretazioni del documento · lo spin in EPR secondo Picasso',
  blocchi:[
  {t:'prosa', title:'Il dialogo di Griffiths', tag:'Griffiths', html:R`
  <p>Griffiths usa lo spin per mettere in scena il problema dell&rsquo;interpretazione. Una particella è nello stato $\chi_{+}$, «su» lungo $z$. Alla domanda sulla componente $z$ si risponde con certezza. Alla domanda sulla componente $x$ si risponde con una probabilità del cinquanta per cento per ciascun valore, e un interlocutore realista protesta: <i>«&ldquo;Are you telling me that you don&rsquo;t know the true state of that particle?&rdquo; On the contrary; I know precisely what the state of the particle is: $\chi_{+}$. &ldquo;Well, then, how come you can&rsquo;t tell me what the $x$-component of its spin is?&rdquo; Because it simply does not have a particular $x$-component of spin. Indeed, it cannot, for if both $S_{x}$ and $S_{z}$ were well-defined, the uncertainty principle would be violated»</i>.</p>
  <p>L&rsquo;indeterminazione si può calcolare. Nello stato $\chi_{+}$ le deviazioni standard di $S_{x}$ e $S_{y}$ valgono entrambe $\hbar/2$, e il loro prodotto $\hbar^{2}/4$ coincide con il minimo permesso dalla relazione $\Delta S_{x}\,\Delta S_{y}\ge\tfrac12|\langle[S_{x},S_{y}]\rangle|$, che qui vale $\tfrac12\hbar\,|\langle S_{z}\rangle|$: lo stato su lungo $z$ è uno stato di minima indeterminazione per le componenti trasverse. Lo sfidante allora misura $S_{x}$, trova $+\hbar/2$ e grida vittoria; Griffiths risponde che la misura ha cambiato lo stato, e che una nuova misura di $S_{z}$ darà metà delle volte il valore opposto. La conclusione: <i>«if you find your own comprehension slipping, from time to time [...] come back to the spin-1/2 system: it is the simplest and cleanest context for thinking through the conceptual paradoxes of quantum mechanics»</i>.</p>
  <p>Griffiths assegna anche a Stern e Gerlach un doppio ruolo: <i>«it serves both as the prototype for the preparation of a quantum state and as an illuminating model for a certain kind of quantum measurement»</i>. Si prepara un fascio in uno stato di spin bloccando gli altri fasci; si misura una componente registrando in quale contenitore finisce l&rsquo;atomo.</p>`},
  {t:'reveal', title:'Ballentine: ricombinare i fasci', tag:'Ballentine', steps:[
   {label:'L esperimento', body:R`
   <p>Ballentine porta un esperimento che mette alla prova l&rsquo;idea che la separazione dei fasci «riduca» lo stato. In un interferometro a neutroni ricavato da un unico cristallo di silicio, un fascio polarizzato lungo $+z$ viene diviso in due; in uno dei due un dispositivo capovolge lo spin; poi i fasci, separati di qualche centimetro, si ricombinano. Che stato di spin esce? Se la separazione avesse distrutto la coerenza, ci si aspetterebbe la miscela $\varrho_{inc}=\tfrac12(|+\rangle\langle+|+|-\rangle\langle-|)$, quella che suggerisce anche l&rsquo;ipotesi di riduzione. Se la coerenza si conserva, lo stato è puro, $(e^{i\alpha}|+\rangle+e^{i\beta}|-\rangle)/\sqrt2$.</p>`},
   {label:'Le due previsioni', body:R`
   <p>Entrambi gli stati danno $\langle\sigma_{z}\rangle=0$. Ma lo stato coerente ha $\langle\sigma_{x}\rangle=\cos(\alpha-\beta)$: <i>«whereas $\varrho_{inc}$ predicts no polarization in any direction, $\varrho_{coh}$ predicts the spin to be polarized in some direction within the $xy$ plane»</i>. Inserendo uno sfasatore in uno dei due cammini si varia $\alpha-\beta$, e l&rsquo;esperimento di Summhammer e collaboratori del 1982 trovò <i>«a periodic dependence of $\langle\sigma_{x}\rangle$ on the phase shift, and no such dependence of $\langle\sigma_{z}\rangle$, confirming that the coherent superposition (9.19) is the correct state»</i>.</p>`},
   {label:'Quando la riduzione c è', body:R`
   <p>Ballentine non nega che a volte lo stato si comporti come la miscela. Se i due cammini lasciano l&rsquo;ambiente in stati diversi, $|e_{1}\rangle$ e $|e_{2}\rangle$, lo stato di spin si ottiene con la <span class="str" data-str="traccia">traccia</span> parziale sull&rsquo;ambiente, e gli elementi fuori diagonale vengono moltiplicati per $\langle e_{2}|e_{1}\rangle$; il valor medio di $\sigma_{x}$ diventa $|\langle e_{2}|e_{1}\rangle|\cos(\alpha-\beta+\delta)$, con $\delta$ la fase della sovrapposizione. Se gli stati dell&rsquo;ambiente sono ortogonali, si ritrova esattamente $\varrho_{inc}$. Ma la conclusione è netta: <i>«this &ldquo;reduction&rdquo; of the state is not a new fundamental process, and, contrary to the impression given in some of the older literature, it has nothing specifically to do with measurement»</i>. È un effetto dell&rsquo;ambiente lasciato fuori dalla definizione del sistema.</p>`}
  ]},
  {t:'plot', title:'Coerenza e ambiente',
   intro:R`<p>Valor medio di $\sigma_{x}$ dopo la ricombinazione, in funzione della differenza di fase $\alpha-\beta$ (in radianti), per sovrapposizione degli stati dell&rsquo;ambiente $|\langle e_{2}|e_{1}\rangle|=1$ (blu), $0{,}5$ (arancio), $0$ (verde).</p>`,
   plots:[{kind:'func2d', xr:[0,12.6], yr:[-1.1,1.1], height:240, ticks:true,
     title:'ricombinazione degli spin: frange che si spengono',
     curves:[{f:'Math.cos(x)', col:'#5aa9ff', width:2.4, label:'ambiente invariato'},
             {f:'0.5*Math.cos(x)', col:'#ffb86b', width:2.2, label:'sovrapposizione 0,5'},
             {f:'0*x', col:'#6bdc9b', width:2.2, label:'ambiente ortogonale'}],
     xlabel:'alpha - beta', ylabel:'<sigma_x>'}],
   leggi:R`<p><b>Che cosa guardare.</b> Con l&rsquo;ambiente che non distingue i cammini le frange hanno ampiezza piena, come nell&rsquo;esperimento reale; con stati dell&rsquo;ambiente parzialmente sovrapposti si riducono; con stati ortogonali spariscono, e lo spin non è polarizzato in nessuna direzione.</p>
   <p><b>Che cosa impararne.</b> La differenza fra stato coerente e miscela non è un atto dell&rsquo;osservatore ma una proprietà fisica, misurabile, del modo in cui i due cammini interagiscono con il resto del mondo. È la decoerenza, che il documento di sintesi caricato da Giuseppe descrive come <i>«il segreto sussurrato alla folla»</i> e di cui dice che <i>«non è un&rsquo;interpretazione, ma serve a tutte»</i>.</p>`},
  {t:'prosa', title:'Le interpretazioni davanti agli stessi esperimenti', tag:'interpretazioni', html:R`
  <p>Le previsioni sono le stesse per tutti; cambia che cosa si dice che lo stato sia. Il documento di sintesi caricato da Giuseppe organizza le interpretazioni con il trilemma di Maudlin: tre affermazioni incompatibili, <i>«(A) $\psi$ è una descrizione completa del sistema; (B) $\psi$ evolve sempre linearmente (Schrödinger); (C) le misure hanno esiti unici e definiti»</i>, e ogni interpretazione è definita da quale abbandona. Applicato alla terza disposizione di Sakurai, quella in cui il fascio $S_{z}-$ ricompare:</p>
  <p>Nella lettura di Copenaghen, che il documento riassume come <i>«la domanda crea la risposta»</i>, l&rsquo;atomo non ha un valore di $S_{z}$ dopo il filtro lungo $x$: la frase di Sakurai sull&rsquo;informazione distrutta è letterale. Nella lettura statistica di Ballentine, per il documento <i>«la tavola attuariale»</i>, lo stato descrive l&rsquo;insieme degli atomi preparati allo stesso modo, e il filtro è, nella sua tabella, una <i>«selezione di un sotto-ensemble»</i>: non c&rsquo;è collasso, c&rsquo;è un nuovo insieme con una nuova preparazione. Nel QBism, <i>«le previsioni del tempo»</i>, lo stato è il grado di fiducia di chi fa l&rsquo;esperimento, e dopo ogni esito si aggiorna. Nei molti mondi i due fasci di ogni apparato sono due rami, e nessuno dei due è eliminato. L&rsquo;esperimento di ricombinazione di Ballentine è il punto dove queste letture devono rendere conto della stessa cosa: due rami che si ritrovano e interferiscono, finché l&rsquo;ambiente non li distingue.</p>
  <p>L&rsquo;articolo del Giornale di Fisica cita, in nota, la posizione più radicale, quella di Fuchs e Peres in un articolo intitolato <i>«La meccanica quantica non richiede alcuna &ldquo;interpretazione&rdquo;»</i>: <i>«la meccanica quantica non descrive la realtà fisica. Quello che fa è fornire un algoritmo per calcolare le probabilità di eventi macroscopici (&lsquo;clicks di rivelatori&rsquo;) che sono le conseguenze dei nostri interventi sperimentali»</i>. L&rsquo;autore dell&rsquo;articolo la usa per spiegare perché il problema di Einstein ed Ehrenfest sia stato dimenticato: in una teoria che è un algoritmo predittivo, la domanda su come gli atomi si orientino nel campo non ha posto. La tappa 09 ha dato una risposta più concreta: non si orientano, il magnete crea una correlazione.</p>`},
  {t:'prosa', title:'Lo spin nel paradosso di Einstein, Podolsky e Rosen', tag:'Picasso', html:R`
  <p>Picasso usa lo spin per la versione del paradosso dovuta a Bohm e Aharonov: due particelle di spin $\tfrac12$ prodotte in uno stato di singoletto, che si allontanano. Se si misura $s_{1z}$ e si trova $+\tfrac12$, si sa con certezza che $s_{2z}=-\tfrac12$. Con il criterio di realtà e il principio di località, $s_{2z}$ doveva avere quel valore già prima, e così $s_{1z}$: il sistema era nello stato con $s_{1z}$ positivo e $s_{2z}$ negativo, o nell&rsquo;opposto: una miscela. <i>«E così arriviamo ad un assurdo»</i>: entrambi quegli stati sono sovrapposizioni di singoletto e tripletto, ciascuno con probabilità un mezzo, e quindi <i>«una misura dello spin totale delle due particelle può anche fornire come risultato $S=1$»</i>, mentre nel singoletto non può. La conclusione di Picasso: <i>«criterio di realtà, principio di località e (completezza della) meccanica quantistica non possono convivere»</i>. Il teorema di Bell, nelle pagine successive, trasforma questo conflitto in disuguaglianze che gli esperimenti hanno deciso a favore della meccanica quantistica.</p>`}
]},
/* ---------------- 11 · COMPITO DEL 28-01-2020 ---------------- */
{ num:'11', title:'Un compito: Stern e Gerlach con il campo inclinato (28-01-2020)', meta:'esame del 28 gennaio 2020 esercizio 2 · la componente lungo il campo come combinazione · autovalori e autovettori con l angolo dimezzato · il valor medio di Sx sulle particelle selezionate · il rapporto dei conteggi nel secondo apparato · gli errori tipici',
  blocchi:[
  {t:'prosa', title:'Il testo', tag:'esame', html:R`
  <p><i>«Un fascio di particelle di spin 1/2 passa attraverso un dispositivo di Stern-Gerlach (SG) nel quale è presente un campo magnetico $\mathbf B_{1}$. Tale vettore giace nel piano $xz$ e forma un angolo $\theta$ rispetto all&rsquo;asse $z$. Sia $S_{\theta}$ la proiezione dell&rsquo;operatore di spin $\mathbf S$ lungo il campo magnetico»</i>. Le domande: (a) scrivere $S_{\theta}$ come combinazione di $S_{x}$ e $S_{z}$ e darne la matrice nella base di $S_{z}$; (b) autovalori e autovettori, come combinazioni degli spinori $\Psi^{1/2}_{\pm1/2}$; (c) selezionate le particelle con spin lungo il campo, il valor medio di $S_{x}$; (d) mandate le stesse particelle in un secondo apparato con il campo lungo $z$, il rapporto fra il numero di particelle negli stati $\Psi^{1/2}_{1/2}$ e $\Psi^{1/2}_{-1/2}$, che il testo suggerisce di calcolare come rapporto delle probabilità.</p>
  <p>Il testo identifica l&rsquo;osservabile misurata con la componente lungo il campo, che è la lettura semplificata delle tappe 01 e 09: in un apparato reale conta la direzione del gradiente, che con la geometria usuale coincide con quella del campo nel piano di simmetria.</p>`},
  {t:'reveal', title:'La soluzione', tag:'soluzione', steps:[
   {label:'(a) La matrice', body:R`
   <p>Il versore del campo è $(\sin\theta,0,\cos\theta)$, quindi $S_{\theta}=\sin\theta\,S_{x}+\cos\theta\,S_{z}$, e nella base di $S_{z}$, con le matrici di Pauli,</p>
   $$S_{\theta}=\frac\hbar2\begin{pmatrix}\cos\theta&\sin\theta\\ \sin\theta&-\cos\theta\end{pmatrix}.$$
   <p>È il caso $\phi=0$ della matrice $\tfrac12\hbar\,\hat{\mathbf n}\cdot\boldsymbol\sigma$: reale, perché il campo sta nel piano $xz$.</p>`},
   {label:'(b) Autovalori e autovettori', body:R`
   <p>Il quadrato della matrice è $\tfrac14\hbar^{2}$ per l&rsquo;identità, quindi gli autovalori sono $\pm\tfrac12\hbar$, come per qualunque componente dello spin. Gli autovettori normalizzati sono</p>
   $$\chi_{\theta,+}=\cos\frac\theta2\,\Psi^{1/2}_{1/2}+\sin\frac\theta2\,\Psi^{1/2}_{-1/2},\qquad\chi_{\theta,-}=-\sin\frac\theta2\,\Psi^{1/2}_{1/2}+\cos\frac\theta2\,\Psi^{1/2}_{-1/2},$$
   <p>a meno di una fase globale per ciascuno. Il controllo più rapido: per $\theta=0$ si ritrovano gli autovettori di $S_{z}$, per $\theta=\pi/2$ quelli di $S_{x}$, $(1,\pm1)/\sqrt2$ a meno del segno.</p>`},
   {label:'(c) Il valor medio di S_x', body:R`
   <p>Sulle particelle selezionate, nello stato $\chi_{\theta,+}$,</p>
   $$\langle S_{x}\rangle=\frac\hbar2\cdot2\cos\frac\theta2\sin\frac\theta2=\frac\hbar2\sin\theta .$$
   <p>È la componente $x$ del vettore $\tfrac12\hbar\,\hat{\mathbf n}$: il valor medio dello spin punta lungo il campo, come per ogni stato «su» lungo una direzione.</p>`},
   {label:'(d) Il rapporto nel secondo apparato', body:R`
   <p>Le probabilità di $S_{z}=\pm\tfrac12\hbar$ nello stato $\chi_{\theta,+}$ sono $\cos^{2}(\theta/2)$ e $\sin^{2}(\theta/2)$, e il rapporto dei conteggi è</p>
   $$\frac{N_{+}}{N_{-}}=\cot^{2}\frac\theta2 .$$
   <p>Per $\theta=60^{\circ}$ vale $3$, per $\theta=90^{\circ}$ vale $1$, e diverge per $\theta\to0$, quando il primo apparato è già lungo $z$ e nessuna particella esce «giù». Se il fascio iniziale era non polarizzato, il primo apparato ne lascia passare metà, e le frazioni del fascio iniziale nei due fasci finali sono $\tfrac12\cos^{2}(\theta/2)$ e $\tfrac12\sin^{2}(\theta/2)$.</p>`}
  ]},
  {t:'plot', title:'Le grandezze del compito in funzione dell angolo',
   intro:R`<p>In funzione dell&rsquo;angolo $\theta$ fra il campo e l&rsquo;asse $z$, in gradi: probabilità di $S_{z}=+\tfrac12\hbar$ nel secondo apparato (blu), probabilità di $S_{z}=-\tfrac12\hbar$ (arancio), $\langle S_{x}\rangle$ in unità $\hbar/2$ sulle particelle selezionate (verde).</p>`,
   plots:[{kind:'func2d', xr:[0,180], yr:[0,1.05], height:250, ticks:true,
     title:'compito 28-01-2020 esercizio 2',
     curves:[{f:'Math.pow(Math.cos(x*Math.PI/360),2)', col:'#5aa9ff', width:2.4, label:'P(+) nel secondo SG'},
             {f:'Math.pow(Math.sin(x*Math.PI/360),2)', col:'#ffb86b', width:2.4, label:'P(-) nel secondo SG'},
             {f:'Math.sin(x*Math.PI/180)', col:'#6bdc9b', width:2.2, label:'<S_x> / (hbar/2)'}],
     xlabel:'theta (gradi)', ylabel:''}],
   leggi:R`<p><b>Che cosa guardare.</b> Le due probabilità si incrociano a $90^{\circ}$, dove il rapporto vale uno; $\langle S_{x}\rangle$ è massimo proprio lì, e torna a zero a $180^{\circ}$, quando il primo apparato seleziona lo spin «giù» lungo $z$.</p>
   <p><b>Che cosa impararne.</b> Le probabilità dipendono dall&rsquo;angolo dimezzato, il valor medio dall&rsquo;angolo intero. È la doppia scala della tappa 02, e il punto dove si sbaglia più spesso.</p>`},
  {t:'prosa', title:'Gli errori che il compito invita a fare', tag:'trappole', html:R`
  <p>Il primo è scrivere gli autovettori con $\theta$ invece di $\theta/2$: $(\cos\theta,\sin\theta)$ è normalizzato e sembra plausibile, ma non è autovettore della matrice, e il controllo con $\theta=\pi$ lo smaschera subito, perché darebbe lo stato «giù» lungo $z$ con il segno sbagliato invece di un vettore ortogonale a quello «su». Il secondo è confondere il punto (c) con una probabilità: $\langle S_{x}\rangle$ non è la probabilità di trovare $+\tfrac12\hbar$ lungo $x$, che vale $\tfrac12(1+\sin\theta)$. Il terzo riguarda il punto (d): il rapporto chiesto è fra conteggi nel secondo apparato, e non dipende da quante particelle il primo apparato ha scartato.</p>`}
]},
/* ---------------- 12 · COMPITO DEL 25-06-2018 ---------------- */
{ num:'12', title:'Un compito: la precessione attorno a un asse inclinato e due misure in sequenza (25-06-2018)', meta:'esame del 25 giugno 2018 esercizio 1 · la misura di S lungo n su uno stato su lungo z · l evoluto in forma chiusa · il valor medio di Sy · la probabilita dopo un tempo T · la seconda misura dopo una prima che riparte da capo',
  blocchi:[
  {t:'prosa', title:'Il testo', tag:'esame', html:R`
  <p><i>«Si consideri una particella di spin 1/2 con Hamiltoniana $H=\frac{\mu_{0}B}{\hbar}\,\mathbf S\cdot\mathbf n$ dove $\mathbf n=(\sin\alpha,0,\cos\alpha)$ è un versore dato ($\alpha$ è dato) ed $\mathbf S$ l&rsquo;operatore di spin. Si consideri solo l&rsquo;evoluzione dello spin. Al tempo $t=0$, la particella si trova in uno stato»</i> $|\chi(0)\rangle$, autostato di $S_{z}$ con autovalore $\hbar/2$. (a) Che valori dà una misura di $\mathbf S\cdot\mathbf n$ a $t=0$, e con che probabilità? (b) L&rsquo;evoluto $\chi(t)$ e $\langle\chi(t)|S_{y}|\chi(t)\rangle$. (c) A $t=T$ si misura $S_{z}$: valori e probabilità; se il risultato è $\hbar/2$, che cosa dà una seconda misura di $S_{z}$ a $t=2T$?</p>`},
  {t:'reveal', title:'La soluzione', tag:'soluzione', steps:[
   {label:'(a) La misura lungo n', body:R`
   <p>I valori possibili sono $\pm\tfrac12\hbar$. Lo stato iniziale è «su» lungo $z$, e $\mathbf n$ forma con $z$ l&rsquo;angolo $\alpha$, quindi $P(+\tfrac12\hbar)=\cos^{2}(\alpha/2)$ e $P(-\tfrac12\hbar)=\sin^{2}(\alpha/2)$: le probabilità del compito precedente con i ruoli di stato e misura scambiati, che danno lo stesso risultato perché $|\langle a|b\rangle|^{2}$ è simmetrico.</p>`},
   {label:'(b) L evoluto in forma chiusa', body:R`
   <p>La hamiltoniana è $\tfrac12\mu_{0}B\,\mathbf n\cdot\boldsymbol\sigma$; con $\omega=\mu_{0}B/\hbar$ l&rsquo;operatore di evoluzione è una rotazione di angolo $\omega t$ attorno a $\mathbf n$, e per la formula in forma chiusa</p>
   $$e^{-iHt/\hbar}=\cos\frac{\omega t}2-i\,\mathbf n\cdot\boldsymbol\sigma\,\sin\frac{\omega t}2 .$$
   <p>Applicato a $(1,0)$ dà</p>
   $$\chi(t)=\begin{pmatrix}\cos\frac{\omega t}2-i\cos\alpha\sin\frac{\omega t}2\\ -i\sin\alpha\sin\frac{\omega t}2\end{pmatrix},$$
   <p>e il valor medio richiesto è</p>
   $$\langle\chi(t)|S_{y}|\chi(t)\rangle=-\frac\hbar2\sin\alpha\,\sin\omega t .$$
   <p>Il controllo con la precessione: il valor medio dello spin parte da $\tfrac12\hbar\hat{\mathbf z}$ e ruota attorno a $\mathbf n$ con derivata temporale $\omega\,\mathbf n\times\langle\mathbf S\rangle$; all&rsquo;inizio la derivata è $\omega\,\mathbf n\times\tfrac12\hbar\hat{\mathbf z}=-\tfrac12\hbar\omega\sin\alpha\,\hat{\mathbf y}$, e infatti la derivata di $\langle S_{y}\rangle$ in zero vale $-\tfrac12\hbar\omega\sin\alpha$.</p>`},
   {label:'(c) La misura a T', body:R`
   <p>Le probabilità di $S_{z}=\pm\tfrac12\hbar$ a $t=T$ sono i moduli quadri delle componenti:</p>
   $$P_{+}(T)=1-\sin^{2}\alpha\,\sin^{2}\frac{\omega T}2,\qquad P_{-}(T)=\sin^{2}\alpha\,\sin^{2}\frac{\omega T}2 .$$
   <p>Per $\alpha=\pi/2$, campo trasverso, lo spin si capovolge del tutto a $\omega T=\pi$; per $\alpha$ piccolo resta vicino a «su» per ogni $T$.</p>`},
   {label:'(c) La seconda misura a 2T', body:R`
   <p>Se a $T$ si trova $+\tfrac12\hbar$, dopo la misura lo stato è di nuovo $(1,0)$, e l&rsquo;evoluzione fra $T$ e $2T$ è la stessa fra $0$ e $T$. Le probabilità a $2T$ sono quindi le stesse di prima: $P_{+}=1-\sin^{2}\alpha\,\sin^{2}(\omega T/2)$. Senza la misura intermedia sarebbero state $1-\sin^{2}\alpha\,\sin^{2}(\omega T)$, calcolate con $2T$ al posto di $T$. La differenza è l&rsquo;effetto della misura: riporta lo stato al punto di partenza, e la probabilità di trovare «su» a entrambe le misure è $P_{+}(T)^{2}$.</p>`}
  ]},
  {t:'plot', title:'La probabilità di trovare su, nel tempo',
   intro:R`<p>Probabilità di $S_{z}=+\tfrac12\hbar$ in funzione di $\omega t$, senza misure intermedie, per $\alpha=30^{\circ}$ (blu), $60^{\circ}$ (arancio), $90^{\circ}$ (verde).</p>`,
   plots:[{kind:'func2d', xr:[0,12.6], yr:[0,1.05], height:250, ticks:true,
     title:'compito 25-06-2018 esercizio 1',
     curves:[{f:'1-Math.pow(Math.sin(Math.PI/6),2)*Math.pow(Math.sin(x/2),2)', col:'#5aa9ff', width:2.4, label:'alpha = 30 gradi'},
             {f:'1-Math.pow(Math.sin(Math.PI/3),2)*Math.pow(Math.sin(x/2),2)', col:'#ffb86b', width:2.4, label:'alpha = 60 gradi'},
             {f:'1-Math.pow(Math.sin(x/2),2)', col:'#6bdc9b', width:2.4, label:'alpha = 90 gradi'}],
     xlabel:'omega t', ylabel:'P(S_z = +)'}],
   leggi:R`<p><b>Che cosa guardare.</b> Il minimo, a $\omega t=\pi$, vale $\cos^{2}\alpha$: $0{,}75$, $0{,}25$ e $0$ per i tre angoli. È il momento in cui la precessione ha portato il valor medio dello spin più lontano da $z$, all&rsquo;angolo $2\alpha$.</p>
   <p><b>Che cosa impararne.</b> La precessione attorno a un asse inclinato non capovolge lo spin se l&rsquo;asse non è trasverso: il cono descritto dal valor medio ha semiapertura $\alpha$ attorno a $\mathbf n$, e $z$ sta sul bordo del cono. È il principio della risonanza magnetica, dove un campo trasverso nel riferimento rotante fa da asse a $90^{\circ}$.</p>`}
]},
/* ---------------- 13 · LE FONTI A CONFRONTO, E L ORALE ---------------- */
{ num:'13', title:'Dove le fonti divergono, e le domande d orale', meta:'dove sta l ipotesi · l immagine della trottola · una nota da correggere · il segno visibile e invisibile · la riduzione come processo o come selezione · che cosa ciascuna fonte mette al centro · che cosa non si e potuto aprire · domande d orale',
  blocchi:[
  {t:'prosa', title:'Quattro punti di disaccordo', tag:'fonti', html:R`
  <p><b>Dove sta l&rsquo;ipotesi.</b> Picasso, Griffiths e le note del corso postulano le relazioni di commutazione dello spin; Shankar, Landau e Dirac le ricavano dal comportamento sotto rotazione di una funzione d&rsquo;onda a più componenti; Ballentine le ricava dal gruppo di Galileo e definisce lo spin come la parte interna del generatore delle rotazioni; Sakurai osserva che la natura ha scelto la realizzazione di dimensione minima. Il valore $\tfrac12$ per l&rsquo;elettrone è in tutte un dato sperimentale. Il documento di sintesi caricato da Giuseppe, che mette a confronto i postulati del corso con quelli delle fonti, aiuta a leggere questa differenza: per Ballentine il postulato sui generatori delle simmetrie è il punto di partenza, e lo spin è la prova che la scelta rende.</p>
  <p><b>L&rsquo;immagine della trottola.</b> Landau la dichiara <i>«assolutamente assurda»</i>; Shankar adotta il nome ma non il modello, perché <i>«a consistent mechanical model doesn&rsquo;t exist»</i>; Dirac dice che lo spin <i>«può essere immaginato come dovuto a un movimento interno»</i>, pur escludendo l&rsquo;analogia classica come metodo; Griffiths fa calcolare la velocità all&rsquo;equatore, $171$ volte quella della luce, e segnala che esiste un&rsquo;interpretazione contraria. Il disaccordo è sull&rsquo;immagine, non sulle previsioni.</p>
  <p><b>Il segno della rotazione completa.</b> Sakurai lo dichiara misurato, Ballentine inosservabile. La tappa 07 mostra che parlano di due cose diverse: una rotazione dell&rsquo;intero sistema, che nessuna osservabile vede, e una precessione di metà dello stato, che l&rsquo;interferenza con l&rsquo;altra metà rende visibile.</p>
  <p><b>La riduzione.</b> Per Sakurai la selezione del secondo apparato <i>«completely destroys any previous information»</i>; per Griffiths la misura <i>«altered the particle&rsquo;s state»</i>; per Ballentine la riduzione <i>«is not a new fundamental process»</i> ma l&rsquo;effetto di un ambiente lasciato fuori dal sistema, e l&rsquo;esperimento di ricombinazione lo mostra. Le previsioni coincidono in tutti gli esperimenti di queste pagine; cambia la parola usata per descriverle.</p>`},
  {t:'prosa', title:'Una nota da correggere, e una stima dichiarata', tag:'errata', html:R`
  <p><b>L&rsquo;articolo del Giornale di Fisica, nota 8.</b> L&rsquo;articolo scrive che, nell&rsquo;ipotesi classica, l&rsquo;immagine allargata avrebbe ancora l&rsquo;intensità massima al centro, perché il numero di atomi per unità di angolo è massimo a $\theta=\pi/2$. Ma la deflessione è proporzionale a $\cos\theta$, e con le direzioni distribuite uniformemente sulla sfera la distribuzione di $\cos\theta$ è uniforme: l&rsquo;immagine classica sarebbe una banda di intensità costante. La tappa 01 lo verifica con l&rsquo;integrale, e Sakurai descrive la previsione classica nello stesso modo.</p>
  <p><b>La deflessione del 1922.</b> Il conto della tappa 01, che dà circa un decimo di millimetro come nel primo ciclo di misure, usa una temperatura del forno, $1235$ K, ricavata da una nota dell&rsquo;articolo che la cita per la radiazione del forno. Il lavoro originale di Stern e Gerlach non è fra le fonti, e il valore usato da loro non si è potuto controllare.</p>
  <p><b>L&rsquo;esempio numerico dell&rsquo;interferometro.</b> I numeri della tappa 07, $75$ e $38$ gauss, sono un esempio costruito qui con valori tipici; Sakurai non riporta i parametri sperimentali.</p>`},
  {t:'prosa', title:'Che cosa mette al centro ciascuna fonte', tag:'fonti', html:R`
  <p>Sakurai mette al centro l&rsquo;esperimento e la struttura: Stern e Gerlach in sequenza come porta d&rsquo;ingresso al formalismo, l&rsquo;analogia con la luce per dedurre che lo spazio è complesso, le rotazioni finite, $SU(2)$, l&rsquo;interferometria neutronica. Griffiths mette al centro i conti e le domande: le matrici, la precessione, Stern e Gerlach semiclassico e quantistico, il dialogo con il realista. Picasso è la fonte del corso e la più sobria: introduce lo spin per spiegare lo Zeeman anomalo, costruisce le matrici di Pauli dagli anticommutatori e dichiara di non trattare Stern e Gerlach. Ballentine porta i risultati che nessun altro ha: la definizione dal gruppo di Galileo, l&rsquo;operatore di stato e il vettore di polarizzazione, gli stati di spin $1$ che non puntano, l&rsquo;argomento con spin $\tfrac32$, la regola di superselezione, la ricombinazione. Shankar lega lo spin alla funzione d&rsquo;onda a più componenti e alla base delle quattro matrici. Landau e Dirac danno la prospettiva dei fondatori: le rotazioni del sistema di coordinate, il segno $(-1)^{2s}$, l&rsquo;assenza di una rappresentazione di Schrödinger. Le note del corso danno lo Zeeman anomalo e i postulati di Pauli; l&rsquo;articolo del Giornale di Fisica la storia, con il problema di Einstein ed Ehrenfest; il documento di sintesi la mappa delle interpretazioni.</p>
  <p><b>Che cosa non si è potuto aprire.</b> Il Sakurai italiano indicato dalla mappa e la nota manoscritta sullo Stern e Gerlach del corso sono scansioni senza testo; il Feynman vol. III, che dedica allo spin e a Stern e Gerlach due capitoli, anche. L&rsquo;articolo di Ohanian segnalato da Griffiths e i lavori originali di Stern e Gerlach non sono fra le fonti.</p>`},
  {t:'collaudo', title:'Domande d’orale', items:[
   {q:'Quali fatti sperimentali costringono a introdurre lo spin?', a:R`Lo Zeeman anomalo, con un numero pari di righe dove la teoria orbitale ne prevede $2l+1$, dispari; i doppietti dei metalli alcalini; l&rsquo;esperimento di Stern e Gerlach, che divide un fascio di atomi d&rsquo;argento in due invece di allargarlo. Un numero pari di stati, $2j+1$, richiede $j$ semiintero, che le armoniche sferiche non danno.`},
   {q:'Perché lo spin non si può rappresentare con una funzione degli angoli?', a:R`Perché le funzioni d&rsquo;onda sulla sfera, a un sol valore, danno solo momenti angolari interi, e lo spin dell&rsquo;elettrone è $\tfrac12$. Lo spin è un grado di libertà in più: lo spazio degli stati è il prodotto tensoriale dello spazio orbitale per uno spazio di dimensione $2s+1$, e Dirac nota che per lo spin non esiste una rappresentazione di Schrödinger.`},
   {q:'Come si costruiscono le matrici di Pauli senza indovinarle?', a:R`Si sceglie $s_{z}$ diagonale con autovalori $\pm\tfrac12\hbar$. Poiché $s_{x}^{2}$ è un multiplo dell&rsquo;identità, il commutatore di $s_{x}^{2}$ con $s_{z}$ è nullo, e questo dà l&rsquo;anticommutazione delle componenti. Allora $s_{x}$ ha diagonale nulla e modulo dell&rsquo;elemento fuori diagonale $\tfrac12\hbar$; la sua fase, che riflette la fase relativa della base, si sceglie nulla, e $s_{y}$ segue dal commutatore.`},
   {q:'Che cosa succede a uno spinore dopo una rotazione di 2 pi greco, e si vede?', a:R`Cambia segno: la matrice di rotazione $\cos(\varphi/2)-i\boldsymbol\sigma\cdot\hat{\mathbf n}\sin(\varphi/2)$ vale $-1$ a $\varphi=2\pi$. Una rotazione dell&rsquo;intero sistema non si vede, perché tutte le osservabili commutano con $R(2\pi)$; ma se si fa precedere di $2\pi$ solo una metà dello stato, come nell&rsquo;interferometro a neutroni, l&rsquo;interferenza con l&rsquo;altra metà mostra il segno, e il periodo in campo magnetico è quello di $4\pi$.`},
   {q:'Che differenza c è fra SU(2) e SO(3)?', a:R`$SO(3)$ sono le rotazioni dello spazio, matrici ortogonali tre per tre; $SU(2)$ le matrici unitarie a determinante uno che ruotano gli spinori. A ogni rotazione corrispondono due matrici di $SU(2)$, $U$ e $-U$: le rotazioni di $2\pi$ e $4\pi$ sono la stessa identità in $SO(3)$, ma $-1$ e $+1$ in $SU(2)$. I due gruppi sono localmente isomorfi.`},
   {q:'Perché ogni stato di spin 1/2 punta in una direzione, e per spin 1 no?', a:R`Uno spinore ha, tolte normalizzazione e fase, due parametri reali, quanti gli angoli di una direzione, e ogni spinore è autostato con autovalore $+\tfrac12\hbar$ della componente lungo una direzione. Per spin $1$ i parametri sono quattro e gli autostati delle componenti ne hanno due: esistono stati, come $(1,1,0)/\sqrt2$, con un valor medio dello spin di modulo intermedio, che non sono autostati di nessuna componente.`},
   {q:'Come si descrive Stern e Gerlach in meccanica quantistica?', a:R`Nel riferimento dell&rsquo;atomo la hamiltoniana è $-\gamma(B_{0}+\alpha z)S_{z}$ per il tempo $T$ di attraversamento. Le due componenti dello spinore acquistano fasi $e^{\pm i\alpha\gamma Tz/2}$, cioè impulsi opposti lungo $z$: il magnete crea una correlazione fra lo spin e l&rsquo;impulso, e la posizione sulla lastra legge lo spin. Le ampiezze restano quelle iniziali: nessun allineamento.`},
   {q:'Perché non si fa Stern e Gerlach con elettroni liberi?', a:R`Perché la forza di Lorentz su una particella carica in moto è molto più grande della forza sul momento magnetico e nasconde la deviazione dovuta allo spin. Si usano atomi neutri e pesanti, come l&rsquo;argento, il cui momento magnetico è quello dello spin dell&rsquo;elettrone $5s$, e per i quali le traiettorie sono quasi classiche.`},
   {q:'Che cosa dice l esperimento di ricombinazione di Ballentine sulla riduzione dello stato?', a:R`Che due fasci separati di qualche centimetro, uno dei quali ha lo spin capovolto, si ricombinano in uno stato coerente: $\langle\sigma_{x}\rangle$ dipende periodicamente dalla differenza di fase. La riduzione a una miscela avviene solo se i due cammini lasciano l&rsquo;ambiente in stati diversi; non è un processo legato alla misura in quanto tale.`}
  ]}
]}

/* --- blocco PLOT: la figura non decora, si legge. Ogni plot porta una chiave di lettura. --- */
function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';
  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionSvelabile(title, tag, html, sol){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var c=document.createElement('div'); c.className='collaudo-item';
  var q=document.createElement('div'); q.className='cq'; q.innerHTML=html||'';
  c.appendChild(q); typeset(q);
  if(sol){
    var a=document.createElement('div'); a.className='ca'; a.style.display='none';
    a.innerHTML='<b>Soluzione.</b> '+sol;
    var btn=document.createElement('button'); btn.className='reveal-btn small';
    btn.textContent='Rivela la soluzione';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a);
      btn.disabled=true; btn.classList.add('done'); btn.textContent='Soluzione rivelata'; };
    c.appendChild(btn); c.appendChild(a);
  }
  wrap.appendChild(c); return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    /* DUE SCHEMI, NON UNO — scoperto il 2026-10-06 provando le pagine vive. I movimenti
       scritti per primi (em-01..03, me-10b, i collaudi di gd-01..09 e di quattro em)
       usano una forma piu' semplice: `reveal` e `prolessi` con un solo `html`,
       `esercizio` e `collaudo` con `html` + `sol`. Il renderer ne conosceva una sola e
       chiamava `steps.forEach` su `undefined`: TypeError, e la tappa si fermava li' —
       62 blocchi in 17 movimenti su 74. Non si riscrive il contenuto per far contento
       il renderer: e' il renderer che deve leggere cio' che c'e'.
       E in fondo un ramo che NON muore: uno schema nuovo di domani deve far vedere un
       avviso in quella sezione, non spegnere la pagina sotto di se'. */
    try{
      if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
      else if(b.t==='prolessi') m.appendChild(b.rotte ? sectionProlessi(b)
                                   : sectionProsa(b.title,'prolessi',b.html));
      else if(b.t==='reveal')m.appendChild(b.steps ? sectionReveal(b.title,b.tag,b.steps)
                                   : sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='esercizio') m.appendChild(b.steps ? sectionEsercizio(b)
                                   : sectionSvelabile(b.title,'esercizio',b.html,b.sol));
      else if(b.t==='collaudo')  m.appendChild(b.items ? sectionCollaudo(b.title,b.items)
                                   : sectionSvelabile(b.title,'provi, poi riveli',b.html,b.sol));
      else if(b.t==='plot')      m.appendChild(sectionPlot(b));
      else m.appendChild(sectionProsa(b.title||'(blocco)', 'tipo sconosciuto: '+b.t,
                                      b.html||''));
    }catch(err){
      var avv=document.createElement('section'); avv.className='section';
      avv.innerHTML='<h3>'+(b.title||'(blocco)')+'<span class="tag">non reso</span></h3>'
        +'<p style="color:#ff6b6b">Questo blocco non si &egrave; potuto rendere ('
        +b.t+': '+err.message+'). Il resto della tappa continua sotto.</p>';
      m.appendChild(avv);
    }
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* I POP-UP DEGLI STRUMENTI. `cablaStrumenti` esisteva dal 18-09 e non la chiamava
     nessuno: i 229 rimandi del percorso erano <span> senza handler, e il clic non
     faceva niente. Nessun controllo poteva vederlo — la sintassi era valida, le schede
     c'erano tutte, le formule rendevano: il guasto esisteva solo a pagina viva. Qui, e
     dopo ogni inserimento successivo, perche' la tappa si rimonta da capo a ogni
     cambio e gli handler vanno riattaccati al DOM nuovo. */
  cablaStrumenti(m);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}

/* deep-link: mq-19-spin.html#03 apre direttamente la tappa 03 */
window.addEventListener('DOMContentLoaded', function(){
  var h=(location.hash||'').replace('#','');
  showTappa(byId[h]?h:'00');
});
window.addEventListener('hashchange', function(){
  var h=(location.hash||'').replace('#','');
  if(byId[h]) showTappa(h);
});
</script>
