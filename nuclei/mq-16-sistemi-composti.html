{ num:'11', title:'Dove la separazione si ferma: più di due corpi, e la massa finita del nucleo', meta:'con tre corpi il centro di massa si separa ma il resto no · l eccezione dei modi normali · cambiare variabili prima o dopo la quantizzazione · lo spostamento isotopico di Landau · il centro di massa spurio del modello a strati',
  blocchi:[
  {t:'prosa', title:'Il risultato che non si generalizza', tag:'limite', html:R`
  <p>Shankar, passando da due a $N$ particelle in una dimensione, scrive: <i>«all the results but one generalize from $N=2$ to arbitrary $N$. The only exception is the result from the last subsection: for $N\gt2$, one generally cannot, by using CM and relative coordinates (or other sets of coordinates) reduce the problem to $N$ independent one-particle problems»</i>. Il prodotto tensoriale, gli operatori di una particella, la separazione per hamiltoniane della classe A valgono per qualunque numero di parti. Quello che non vale è la riduzione del problema interagente a problemi di una particella.</p>
  <p>Conviene essere precisi su che cosa si perde. Il centro di massa di $N$ particelle con interazioni che dipendono solo dalle differenze delle posizioni si separa sempre: l&rsquo;impulso totale commuta con la hamiltoniana, e l&rsquo;energia cinetica del centro di massa si stacca come per due corpi. Restano $3(N-1)$ coordinate relative, e il problema in quelle coordinate non si spezza ulteriormente, perché ogni coppia interagisce con ogni altra. Nell&rsquo;atomo di elio, dopo aver tolto il centro di massa, restano due elettroni che si respingono e attraggono il nucleo, e quel problema non ha soluzione esatta.</p>`},
  {t:'reveal', title:'L’eccezione: hamiltoniane quadratiche e modi normali', tag:'eccezione', steps:[
   {label:'Che cosa dice Shankar', body:R`
   <p>Le eccezioni, continua Shankar, sono poche, <i>«the most familiar ones being Hamiltonians quadratic in the coordinates and momenta which may be reduced to a sum over oscillator Hamiltonians by the use of normal coordinates. In such cases the oscillators become independent and their energies add both in the classical and quantum cases»</i>. È il meccanismo che sta dietro ai fononi di un cristallo e alla teoria dei calori specifici.</p>`},
   {label:'Due oscillatori accoppiati', body:R`
   <p>Due particelle di massa $m$, ciascuna legata alla propria posizione di equilibrio con pulsazione $\omega$ e legate fra loro da una molla di costante $k$:</p>
   $$H=\frac{p_{1}^{2}+p_{2}^{2}}{2m}+\frac12m\omega^{2}(x_{1}^{2}+x_{2}^{2})+\frac12k(x_{1}-x_{2})^{2}.$$
   <p>Il termine di accoppiamento impedisce la separazione nelle variabili $x_{1},x_{2}$. Con le coordinate normali $x_{\rm I}=(x_{1}+x_{2})/\sqrt2$ e $x_{\rm II}=(x_{1}-x_{2})/\sqrt2$, e gli impulsi trasformati allo stesso modo, la trasformazione è una rotazione di quarantacinque gradi nel piano $(x_{1},x_{2})$: conserva la somma dei quadrati, e quindi le regole di commutazione e l&rsquo;energia cinetica. Il potenziale diventa</p>
   $$\frac12m\omega^{2}x_{\rm I}^{2}+\frac12\big(m\omega^{2}+2k\big)x_{\rm II}^{2},$$
   <p>due oscillatori indipendenti con pulsazioni $\omega_{\rm I}=\omega$ e $\omega_{\rm II}=\sqrt{\omega^{2}+2k/m}$. Le energie sono $(n_{\rm I}+\tfrac12)\hbar\omega_{\rm I}+(n_{\rm II}+\tfrac12)\hbar\omega_{\rm II}$. Il modo I è il moto del centro di massa, che la molla interna non sente; il modo II è il moto relativo, che la sente due volte.</p>`},
   {label:'Prima o dopo la quantizzazione', body:R`
   <p>L&rsquo;esercizio 10.1.3 di Shankar fa fare il conto in due modi: cambiare variabili nella hamiltoniana classica e poi quantizzare, oppure quantizzare nelle variabili originali e poi cambiare variabili nell&rsquo;equazione differenziale. I risultati coincidono, e Shankar dice quando: <i>«in general, one can change coordinates and then quantize or first quantize and then change variables in the differential equation, if the change of coordinates is canonical»</i>. Con una riserva: <i>«we are assuming that all the variables are Cartesian. As mentioned earlier in the book, if one wants to employ non-Cartesian coordinates, it is best to first quantize the Cartesian coordinates and then change variables in the differential equation»</i>. Il cambio al centro di massa è lineare e cartesiano, e per questo lo si può fare a piacere prima o dopo.</p>`}
  ]},
  {t:'plot', title:'Le due pulsazioni normali',
   intro:R`<p>Pulsazioni dei modi normali in unità di $\omega$, in funzione dell&rsquo;accoppiamento $\kappa=k/m\omega^{2}$: modo del centro di massa $\omega_{\rm I}/\omega=1$ (blu), modo relativo $\omega_{\rm II}/\omega=\sqrt{1+2\kappa}$ (arancio).</p>`,
   plots:[{kind:'func2d', xr:[0,4], yr:[0,3.2], height:250, ticks:true,
     title:'oscillatori accoppiati: pulsazioni normali',
     curves:[{f:'1', col:'#5aa9ff', width:2.4, label:'omega I (centro di massa)'},
             {f:'Math.sqrt(1+2*x)', col:'#ffb86b', width:2.4, label:'omega II (moto relativo)'}],
     xlabel:'kappa = k / m omega^2', ylabel:'pulsazione / omega'}],
   leggi:R`<p><b>Che cosa guardare.</b> A $\kappa=0$ le due pulsazioni coincidono e ogni livello $n_{\rm I}+n_{\rm II}=n$ è degenere $n+1$ volte, come nell&rsquo;oscillatore piano. Appena $\kappa\gt0$ la degenerazione si apre: il modo relativo sale, quello del centro di massa resta fermo. A $\kappa=4$ il rapporto è $3$.</p>
   <p><b>Che cosa impararne.</b> L&rsquo;interazione fra le due particelle tocca solo il moto relativo: è lo stesso fatto del problema a due corpi, visto in un caso in cui anche i potenziali esterni sono quadratici e quindi il centro di massa resta un oscillatore invece che una particella libera.</p>`},
  {t:'prosa', title:'Landau: la massa finita del nucleo nello spettro', tag:'fisica', html:R`
  <p>In un atomo con molti elettroni il nucleo non è fermo. Landau, nel paragrafo sullo spostamento isotopico, scrive che <i>«negli atomi leggeri la causa principale dello spostamento isotopico è il valore finito della massa del nucleo»</i>, e in nota spiega da dove viene il termine: <i>«nel sistema del centro di massa dell&rsquo;atomo la somma delle quantità di moto del nucleo e degli elettroni è nulla»</i>, quindi l&rsquo;impulso del nucleo è $-\sum_{i}\mathbf p_{i}$ e la sua energia cinetica è $(\sum_{i}\mathbf p_{i})^{2}/2M$. Le formule del paragrafo sono illeggibili nel testo estratto, e qui si scrive solo il conto che segue dalla frase citata. Sviluppando il quadrato per due elettroni,</p>
  $$\frac{(\mathbf p_{1}+\mathbf p_{2})^{2}}{2M}=\frac{\mathbf p_{1}^{2}+\mathbf p_{2}^{2}}{2M}+\frac{\mathbf p_{1}\cdot\mathbf p_{2}}{M}.$$
  <p>Il primo pezzo si aggiunge all&rsquo;energia cinetica di ciascun elettrone e la trasforma in quella con la massa ridotta: è la correzione dell&rsquo;idrogeno, che sposta tutti i livelli nella stessa proporzione. Il secondo è un termine nuovo, che accoppia gli impulsi di elettroni diversi e non si elimina con nessun cambio di variabili lineare: è il resto che il problema a due corpi non aveva, e il segno che con tre corpi la separazione non si chiude. Siccome dipende da $1/M$, cambia da un isotopo all&rsquo;altro, e contribuisce allo spostamento isotopico insieme al primo pezzo.</p>`},
  {t:'prosa', title:'Il centro di massa spurio del modello a strati', tag:'fisica', html:R`
  <p>Il secondo esempio di Landau viene dalla fisica nucleare, ed è il problema rovesciato. Nel modello a strati la funzione d&rsquo;onda del nucleo si costruisce come prodotto, o somma antisimmetrizzata di prodotti, di funzioni di singolo nucleone in un campo centrale. <i>«Ma una tale funzione non garantisce l&rsquo;immobilità del centro di massa benché il valore medio della velocità del centro di massa calcolato con l&rsquo;ausilio di questa funzione sia zero, questa stessa funzione conduce a probabilità finite per valori della velocità diversi da zero»</i>. Un prodotto di funzioni di singola particella non è, in generale, un prodotto di una funzione del centro di massa per una funzione delle coordinate relative: contiene un moto del centro di massa che fisicamente non c&rsquo;è.</p>
  <p>La cura che Landau riporta, di Gartenhaus e Schwartz, è togliere il centro di massa a mano negli operatori: sostituire ogni posizione $\mathbf r_{i}$ con $\mathbf r_{i}-\mathbf R$ e ogni impulso con $\mathbf p_{i}-\mathbf P/A$. Per il momento di dipolo elettrico $e\sum_{p}\mathbf r_{p}$, somma sui protoni, la sostituzione dà, con $Z$ protoni, $N$ neutroni e $A=Z+N$,</p>
  $$e\sum_{p}(\mathbf r_{p}-\mathbf R)=\frac{eN}{A}\sum_{p}\mathbf r_{p}-\frac{eZ}{A}\sum_{n}\mathbf r_{n},$$
  <p>dove si è usato $A\mathbf R=\sum_{p}\mathbf r_{p}+\sum_{n}\mathbf r_{n}$. I protoni contano con una carica efficace $eN/A$ e i neutroni, che non hanno carica, con $-eZ/A$: muovendosi spostano il centro di massa, e il centro di carica si sposta rispetto a esso. È il modo in cui il problema a due corpi riappare dentro un problema a molti corpi: il centro di massa va separato anche quando la descrizione approssimata non lo fa da sola.</p>`},
  {t:'prosa', title:'Il laboratorio e il centro di massa negli urti', tag:'fisica', html:R`
  <p>Lo stesso schema governa lo scattering. Picasso, all&rsquo;inizio della teoria degli urti, osserva che se le particelle del bersaglio non sono fisse, <i>«il problema si riconduce a quello di una particella di massa [...] soggetta al potenziale di interazione [...] fra le due particelle»</i>, dove la massa è quella ridotta delle due (la formula, nel testo estratto, è illeggibile), e che <i>«naturalmente poi si deve tradurre il risultato dal riferimento del centro di massa a quello del laboratorio (se già non coincidono)»</i>. Negli anelli di collisione con fasci uguali e opposti, come quelli che Picasso cita per gli urti fra protoni, i due riferimenti coincidono, e il centro di massa è fermo nel laboratorio. Landau usa la stessa riduzione per la teoria degli urti: <i>«con $m$ indicheremo la massa ridotta delle particelle collidenti»</i>.</p>`}
]},
/* ---------------- 12 · LE FONTI A CONFRONTO, E L ORALE ---------------- */
{ num:'12', title:'Dove le fonti divergono, e le domande d orale', meta:'tre strade per lo stesso spazio · che cosa ciascuna fonte mette al centro · lo stato parziale letto in modi diversi · la convenzione sulla coordinata relativa e sulla massa · domande d orale',
  blocchi:[
  {t:'prosa', title:'Che cosa ciascuna fonte mette al centro', tag:'fonti', html:R`
  <p>Il contenuto di questo movimento è lo stesso in tutti i libri, ma l&rsquo;ordine e l&rsquo;accento cambiano, e cambiando fanno vedere cose diverse.</p>
  <p><b>Picasso</b> tratta il problema a due corpi molto prima del prodotto tensoriale: la separazione del centro di massa sta nel capitolo sul campo centrale, come premessa all&rsquo;atomo di idrogeno, e il prodotto tensoriale arriva solo con lo spin e il principio di Pauli, presentato come <i>«sostanzialmente solo un problema di linguaggio e di notazioni»</i>. È la strada di chi vuole arrivare presto agli atomi. <b>Landau</b> fa lo stesso, con ancora meno parole: la riduzione a un corpo occupa le prime righe del capitolo sul campo centrale. <b>Shankar</b> fa il contrario: costruisce lo spazio a due particelle in due modi, dimostra che coincidono, e solo dopo separa il centro di massa, come esempio della classe B che si riduce alla classe A; è anche il solo a dire esplicitamente che il risultato non si generalizza a più di due corpi. <b>Ballentine</b> deduce il prodotto tensoriale dalla possibilità di preparare le parti indipendentemente, e dedica una sezione intera agli stati delle parti, cioè a quello che le altre fonti chiamano intreccio senza analizzarlo. <b>Griffiths</b> mette la funzione d&rsquo;onda a due particelle all&rsquo;inizio del capitolo sulle particelle identiche, e lascia la separazione del centro di massa a un problema. <b>Sakurai</b> usa il prodotto tensoriale come strumento per comporre i momenti angolari, e lo introduce dove serve, per lo spin e l&rsquo;orbita. Le note del corso, nell&rsquo;oscillatore tridimensionale, usano la separazione e poi la struttura tensoriale dei polinomi per passare alla base del momento angolare.</p>
  <p>All&rsquo;esame la domanda «che cos&rsquo;è il prodotto tensoriale» si può affrontare dalla parte di Picasso, con le funzioni d&rsquo;onda, da quella di Shankar, con le coppie di risultati di misura, o da quella di Ballentine, con le preparazioni. La domanda «perché si può separare il centro di massa» va affrontata con il cambio di variabili e la verifica che le nuove variabili sono canoniche, che è il punto su cui tutte le fonti concordano.</p>`},
  {t:'prosa', title:'Lo stato di una parte, letto in modi diversi', tag:'interpretazioni', html:R`
  <p>L&rsquo;operatore di stato parziale $\rho^{(1)}=\mathrm{Tr}^{(2)}\rho$ è definito allo stesso modo da tutti, ma il suo significato cambia con l&rsquo;interpretazione. Per Ballentine, che legge lo stato come descrizione di un insieme di sistemi preparati allo stesso modo, $\rho^{(1)}$ è semplicemente l&rsquo;oggetto che <i>«suffices for calculating the average of any dynamical variable that belongs exclusively to component 1»</i>, e il fatto che sia non puro quando il tutto è puro non pone nessun problema.</p>
  <p>Il documento di sintesi sui postulati che Giuseppe ha caricato, scritto da un compagno di corso, usa lo stesso strumento per la decoerenza: un sistema che si intreccia con l&rsquo;ambiente ha matrice densità ridotta $\rho_{S}=\mathrm{Tr}_{E}|\Psi\rangle\langle\Psi|$ che tende a una forma diagonale, e il documento avverte che questa <i>«trasforma una sovrapposizione in una matrice che sembra una miscela (miscela &lsquo;impropria&rsquo;, d&rsquo;Espagnat), ma non sceglie quale esito si realizza»</i>. È esattamente la situazione del singoletto della tappa 03: la matrice parziale di uno spin è $\tfrac12\mathbb 1$, la stessa di una miscela di spin su e giù, ma non è una miscela, perché il tutto è puro e le correlazioni con l&rsquo;altro spin ci sono. Ballentine mostra con l&rsquo;esempio della miscela $\tfrac12(|{+}{+}\rangle\langle{+}{+}|+|{-}{-}\rangle\langle{-}{-}|)$ che due stati diversi del tutto possono avere le stesse parti: la distinzione fra miscela «propria» e «impropria» del documento è la stessa cosa, detta dal lato delle interpretazioni.</p>
  <p>Per il conto non cambia niente: in ogni lettura la traccia parziale dà le probabilità giuste per le misure fatte su una parte sola. Cambia la risposta alla domanda «in che stato è la particella 1», che per Picasso ha senso solo per gli stati fattorizzati: <i>«in generale ha solo senso parlare di stati dell&rsquo;intero sistema»</i>.</p>`},
  {t:'prosa', title:'Due convenzioni da controllare prima di ogni conto', tag:'convenzioni', html:R`
  <p><b>La coordinata relativa.</b> Picasso e il compito del 28-01-2020 usano $\mathbf q_{1}-\mathbf q_{2}$, Griffiths nel problema 5.1 scrive $\mathbf r=\mathbf r_{1}-\mathbf r_{2}$ ma poi descrive il moto relativo come <i>«the motion of particle 2 with respect to particle 1»</i>, e il compito del 15-02-2019 usa $\mathbf r_{2}-\mathbf r_{1}$. Le energie non cambiano. Cambiano i segni delle funzioni d&rsquo;onda con $l$ dispari, e il segno di valori medi come quello dell&rsquo;operatore $S_{1z}x_{1}+S_{2z}x_{2}$ della tappa 09.</p>
  <p><b>La massa.</b> Quasi tutti i testi scrivono la hamiltoniana del moto relativo con $\mu$ e precisano $\mu=m/2$; il compito del 29-01-2019 chiama $m$ la massa ridotta. Nel primo caso la lunghezza dell&rsquo;oscillatore è $\sqrt{\hbar/\mu\omega}=\sqrt{2\hbar/m\omega}$, nel secondo $\sqrt{\hbar/m\omega}$. Un errore qui sposta di un fattore $\sqrt2$ ogni lunghezza e di un fattore due ogni valor medio di $r^{2}$.</p>`},
  {t:'collaudo', title:'Domande d’orale', items:[
   {q:R`Perché lo spazio di due particelle è il prodotto tensoriale e non la somma diretta degli spazi di una particella?`,
    a:R`Perché un risultato di misura sul sistema composto è una coppia di risultati, uno per particella, e serve un vettore di base per ogni coppia. Ballentine lo deduce dalle preparazioni: se le due parti si possono preparare indipendentemente in autostati di $A^{(1)}$ e $B^{(2)}$, per ogni coppia di autovalori deve esistere un autostato comune, e i prodotti $|a_{m}\rangle|b_{n}\rangle$ lo sono. Le dimensioni si moltiplicano. La somma diretta, dove le dimensioni si sommano, descrive un sistema che sta o in uno o nell&rsquo;altro insieme di stati, non in tutti e due contemporaneamente.`},
   {q:R`Mi dia un criterio per riconoscere uno stato intrecciato di due spin $\tfrac12$, e un esempio che inganna.`,
    a:R`Si scrive lo stato come $\sum c_{mn}|m,n\rangle$: è fattorizzato se e solo se $\det c=0$. L&rsquo;esempio che inganna è $\tfrac12(|{+}{+}\rangle+|{+}{-}\rangle+|{-}{+}\rangle+|{-}{-}\rangle)$, quattro termini ma determinante nullo: è il prodotto di due spin lungo $x$. Il singoletto ha determinante $\tfrac12$ ed è intrecciato. Un criterio equivalente è la purezza dello stato parziale: per il singoletto $\mathrm{Tr}(\rho^{(1)})^{2}=\tfrac12\lt1$.`},
   {q:R`Come si separa il moto del centro di massa? Mi dimostri che le nuove variabili sono canoniche.`,
    a:R`$\mathbf q=\mathbf q_{1}-\mathbf q_{2}$, $\mathbf Q=(m_{1}\mathbf q_{1}+m_{2}\mathbf q_{2})/M$, $\mathbf P=\mathbf p_{1}+\mathbf p_{2}$, $\mathbf p=(m_{2}\mathbf p_{1}-m_{1}\mathbf p_{2})/M$. Per bilinearità $[q_{x},p_{x}]=\tfrac{m_{2}+m_{1}}{M}i\hbar=i\hbar$, $[Q_{x},P_{x}]=\tfrac{m_{1}+m_{2}}{M}i\hbar=i\hbar$, $[Q_{x},p_{x}]=\tfrac{m_{1}m_{2}-m_{2}m_{1}}{M^{2}}i\hbar=0$, $[q_{x},P_{x}]=0$. L&rsquo;energia cinetica diventa $\mathbf P^{2}/2M+\mathbf p^{2}/2\mu$ perché i termini misti si cancellano, e se il potenziale dipende da $\mathbf q_{1}-\mathbf q_{2}$ la hamiltoniana è somma di un pezzo del centro di massa libero e di un pezzo relativo. Gli autostati sono $e^{i\mathbf K\cdot\mathbf Q}\psi(\mathbf q)$.`},
   {q:R`Che cosa succede allo spin quando separa il centro di massa?`,
    a:R`Niente: il cambio di variabili tocca solo posizioni e impulsi, e lo spin resta un fattore a parte. Lo spazio diventa $L^{2}(\mathbf Q)\otimes[L^{2}(\mathbf q)\otimes\text{spin}]$. Se la hamiltoniana contiene $\mathbf L\cdot\mathbf S$ o un potenziale che dipende da $\mathbf S_{1}\cdot\mathbf S_{2}$, lo spin resta accoppiato al moto relativo. E per particelle identiche, anche senza termini di spin, lo scambio è parità del moto relativo per scambio degli spin, e impone $l+S$ pari: per due fermioni di spin $\tfrac12$, $l$ pari con il singoletto e $l$ dispari con il tripletto.`},
   {q:R`Due fermioni identici di spin $\tfrac12$ in un oscillatore isotropo per il moto relativo, senza termini di spin: quali sono le degenerazioni dei primi tre livelli?`,
    a:R`Il livello $n$ ha $g_{n}=(n+1)(n+2)/2$ stati spaziali con $l$ della parità di $n$. Con la regola $l+S$ pari: $n=0$ solo singoletto, $1$ stato; $n=1$ solo tripletto, $3\cdot3=9$ stati; $n=2$ solo singoletto, $6$ stati. Per particelle distinguibili sarebbero $4$, $12$, $24$.`},
   {q:R`Perché la separazione delle variabili non risolve il problema a tre corpi?`,
    a:R`Perché il centro di massa si separa sempre, ma restano $3(N-1)$ coordinate relative e ogni coppia interagisce con ogni altra: nessun cambio di variabili rende la hamiltoniana una somma, tranne nel caso di hamiltoniane quadratiche, dove i modi normali danno oscillatori indipendenti. Nell&rsquo;atomo con più elettroni il segno visibile è il termine $\sum_{i\lt j}\mathbf p_{i}\cdot\mathbf p_{j}/M$, che viene dall&rsquo;energia cinetica del nucleo e accoppia elettroni diversi.`}
  ]}
]}

var byId = {}; TAPPE.forEach(function(s){ byId[s.num]=s; });

var VKEY='pm-nucleomq-16-visited';
function loadSeen(){ try{ return new Set(JSON.parse(localStorage.getItem(VKEY)||'[]')); }catch(e){ return new Set(); } }
function saveSeen(s){ try{ localStorage.setItem(VKEY, JSON.stringify(Array.from(s))); }catch(e){} }
var SEEN = loadSeen();

function renderNav(active){
  var nav=document.getElementById('sidebar');
  nav.innerHTML='';
  var h=document.createElement('h2'); h.textContent='Nucleo mq-16 · le tappe'; nav.appendChild(h);
  TAPPE.forEach(function(s){
    var b=document.createElement('button');
    b.className='navitem'+(active===s.num?' active':'')+(SEEN.has(s.num)?' seen':'');
    b.innerHTML='<span class="dot"></span><span class="nx">'+s.num+'</span><span>'+s.title+'</span>';
    b.onclick=function(){ showTappa(s.num); };
    nav.appendChild(b);
  });
}

/* ---- renderer dei blocchi ---- */
function sectionProsa(title, tag, html){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var body=elFromHTML('<div class="open-body">'+html+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function sectionGram(title, rows){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag gramtag">grammatica</span></h3>';
  var inner='<table class="gramtab">';
  rows.forEach(function(r){ inner+='<tr><td class="gs">'+r[0]+'</td><td>'+r[1]+'</td></tr>'; });
  inner+='</table>';
  var body=elFromHTML('<div class="gramwrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
/* --- blocco PLOT: la figura non decora, si legge. Ogni plot porta una chiave di lettura. --- */
function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';
  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionSvelabile(title, tag, html, sol){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var c=document.createElement('div'); c.className='collaudo-item';
  var q=document.createElement('div'); q.className='cq'; q.innerHTML=html||'';
  c.appendChild(q); typeset(q);
  if(sol){
    var a=document.createElement('div'); a.className='ca'; a.style.display='none';
    a.innerHTML='<b>Soluzione.</b> '+sol;
    var btn=document.createElement('button'); btn.className='reveal-btn small';
    btn.textContent='Rivela la soluzione';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a);
      btn.disabled=true; btn.classList.add('done'); btn.textContent='Soluzione rivelata'; };
    c.appendChild(btn); c.appendChild(a);
  }
  wrap.appendChild(c); return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    /* DUE SCHEMI, NON UNO — scoperto il 2026-10-06 provando le pagine vive. I movimenti
       scritti per primi (em-01..03, me-10b, i collaudi di gd-01..09 e di quattro em)
       usano una forma piu' semplice: `reveal` e `prolessi` con un solo `html`,
       `esercizio` e `collaudo` con `html` + `sol`. Il renderer ne conosceva una sola e
       chiamava `steps.forEach` su `undefined`: TypeError, e la tappa si fermava li' —
       62 blocchi in 17 movimenti su 74. Non si riscrive il contenuto per far contento
       il renderer: e' il renderer che deve leggere cio' che c'e'.
       E in fondo un ramo che NON muore: uno schema nuovo di domani deve far vedere un
       avviso in quella sezione, non spegnere la pagina sotto di se'. */
    try{
      if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
      else if(b.t==='prolessi') m.appendChild(b.rotte ? sectionProlessi(b)
                                   : sectionProsa(b.title,'prolessi',b.html));
      else if(b.t==='reveal')m.appendChild(b.steps ? sectionReveal(b.title,b.tag,b.steps)
                                   : sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='esercizio') m.appendChild(b.steps ? sectionEsercizio(b)
                                   : sectionSvelabile(b.title,'esercizio',b.html,b.sol));
      else if(b.t==='collaudo')  m.appendChild(b.items ? sectionCollaudo(b.title,b.items)
                                   : sectionSvelabile(b.title,'provi, poi riveli',b.html,b.sol));
      else if(b.t==='plot')      m.appendChild(sectionPlot(b));
      else m.appendChild(sectionProsa(b.title||'(blocco)', 'tipo sconosciuto: '+b.t,
                                      b.html||''));
    }catch(err){
      var avv=document.createElement('section'); avv.className='section';
      avv.innerHTML='<h3>'+(b.title||'(blocco)')+'<span class="tag">non reso</span></h3>'
        +'<p style="color:#ff6b6b">Questo blocco non si &egrave; potuto rendere ('
        +b.t+': '+err.message+'). Il resto della tappa continua sotto.</p>';
      m.appendChild(avv);
    }
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* I POP-UP DEGLI STRUMENTI. `cablaStrumenti` esisteva dal 18-09 e non la chiamava
     nessuno: i 229 rimandi del percorso erano <span> senza handler, e il clic non
     faceva niente. Nessun controllo poteva vederlo — la sintassi era valida, le schede
     c'erano tutte, le formule rendevano: il guasto esisteva solo a pagina viva. Qui, e
     dopo ogni inserimento successivo, perche' la tappa si rimonta da capo a ogni
     cambio e gli handler vanno riattaccati al DOM nuovo. */
  cablaStrumenti(m);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}
