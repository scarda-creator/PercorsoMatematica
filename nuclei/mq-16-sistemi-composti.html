  {t:'plot', title:'Il contrasto delle frange in coincidenza',
   intro:R`<p>Densità della particella 1 in coincidenza con la particella 2 in una finestra di larghezza $w$, $1+V\cos\phi$ con $V=\sin(qw/2)/(qw/2)$: finestra stretta $qw\to0$ (blu), $qw=\pi$ (arancio), $qw=2\pi$ (verde), in funzione della fase $\phi=(k_{a}-k_{a'})x_{1}$.</p>`,
   plots:[{kind:'func2d', xr:[0,12.6], yr:[0,2.1], height:250, ticks:true,
     title:'frange in coincidenza al variare della finestra su x2',
     curves:[{f:'1+Math.cos(x)', col:'#5aa9ff', width:2.4, label:'q w -> 0'},
             {f:'1+(2/Math.PI)*Math.cos(x)', col:'#ffb86b', width:2.2, label:'q w = pi'},
             {f:'1', col:'#6bdc9b', width:2.2, label:'q w = 2 pi'}],
     xlabel:'fase phi', ylabel:'densita relativa'}],
   leggi:R`<p><b>Che cosa guardare.</b> Il contrasto scende da $1$ a $2/\pi\approx0{,}64$ quando la finestra copre mezzo periodo, e a zero quando ne copre uno intero. La curva verde è la densità di una particella senza nessuna informazione sull&rsquo;altra.</p>
   <p><b>Che cosa impararne.</b> In uno stato intrecciato la coerenza non sta in nessuna delle due parti: lo stato parziale della particella 1 è una miscela, che non interferisce. Sta nel tutto, e la si recupera solo con domande che riguardano tutte e due le particelle. È la stessa cosa che si è vista per il singoletto, detta con le frange invece che con lo spin.</p>`}
]},
/* ---------------- 04 · LA SEPARAZIONE DELLE VARIABILI ---------------- */
{ num:'04', title:'La hamiltoniana che si spezza: separazione delle variabili e particella in una scatola', meta:'le due classi di Shankar · autostati prodotto ed energie somma · perché i prodotti bastano · l evoluzione che non crea intreccio · la scatola cubica e le sue degenerazioni, anche quella accidentale · contare gli stati',
  blocchi:[
  {t:'prosa', title:'Le due classi di problemi', tag:'architettura', html:R`
  <p>Lo stato di due particelle evolve con l&rsquo;equazione di Schrödinger del sistema composto, e Shankar divide subito i problemi in due classi. <b>Classe A</b>: la hamiltoniana è separabile, $H=H_{1}(X_{1},P_{1})+H_{2}(X_{2},P_{2})$. <b>Classe B</b>: non lo è, perché contiene un termine che dipende dalle variabili di tutte e due. <i>«Class A corresponds to two particles interacting with external potentials $V_{1}$ and $V_{2}$ but not with each other, while in class B there is no such restriction»</i>.</p>
  <p>Classicamente, la classe A vuol dire che <i>«the two particles evolve independently of each other. In particular, their energies are separately conserved and the total energy $E$ is $E_{1}+E_{2}$»</i>. Shankar mostra che lo stesso risultato riappare in meccanica quantistica, e il motivo è quello della tappa 02: $H_{1}\otimes\mathbb 1$ e $\mathbb 1\otimes H_{2}$ commutano, quindi hanno una base di autostati comuni, che sono i prodotti $|E_{1}\rangle\otimes|E_{2}\rangle$ degli autostati delle due hamiltoniane di una particella. Su di essi</p>
  $$H\,|E_{1}\rangle\otimes|E_{2}\rangle=(H_{1}|E_{1}\rangle)\otimes|E_{2}\rangle+|E_{1}\rangle\otimes(H_{2}|E_{2}\rangle)=(E_{1}+E_{2})\,|E_{1}\rangle\otimes|E_{2}\rangle .$$
  <p>Lo stato $|E_{1}\rangle\otimes|E_{2}\rangle$, dice Shankar, <i>«corresponds to particle 1 being in the energy eigenstate $|E_{1}\rangle$ and particle 2 being in the energy eigenstate $|E_{2}\rangle$»</i>: è la base del prodotto che si ottiene scegliendo in ogni fattore gli autostati dell&rsquo;energia invece che quelli della posizione.</p>`},
  {t:'reveal', title:'La stessa cosa nella rappresentazione delle coordinate', tag:'metodo', steps:[
   {label:'L’ansatz e la divisione', body:R`
   <p>Shankar rifà il conto nelle coordinate, <i>«to illustrate a useful technique that you will find in other textbooks»</i>. L&rsquo;equazione agli autovalori è</p>
   $$\Big[-\frac{\hbar^{2}}{2m_{1}}\frac{\partial^{2}}{\partial x_{1}^{2}}+V_{1}(x_{1})-\frac{\hbar^{2}}{2m_{2}}\frac{\partial^{2}}{\partial x_{2}^{2}}+V_{2}(x_{2})\Big]\psi=E\,\psi,$$
   <p>e si cerca una soluzione prodotto, $\psi(x_{1},x_{2})=\psi_{1}(x_{1})\psi_{2}(x_{2})$. Sostituendo e dividendo per il prodotto si ottiene a sinistra una funzione della sola $x_{1}$ più una funzione della sola $x_{2}$, e a destra la costante $E$. <i>«Since $x_{1}$ and $x_{2}$, and hence the two functions, may be varied independently, it follows that each function separately equals a constant»</i>: due equazioni di una particella con autovalori $E_{1}$ ed $E_{2}$, e la condizione $E=E_{1}+E_{2}$.</p>`},
   {label:'L’ansatz sembra troppo stretto, ma basta', body:R`
   <p>Griffiths, introducendo la separazione delle variabili per la prima volta, ammette che cercare soluzioni prodotto <i>«on its face, is an absurd restriction, and we cannot hope to get more than a tiny subset of all solutions in this way. But hang on»</i>. Il motivo per cui basta lo dà Picasso: trovato un insieme completo di autofunzioni di $H_{1}$ e uno di $H_{2}$, <i>«i loro prodotti in tutti i modi possibili (cioè per tutte le coppie $n$, $m$) sono un insieme completo (nello spazio delle funzioni di $X$ e $x$) di autofunzioni di $H$ con autovalori $E_{nm}=E_{1n}+E_{2m}$, per tutte le coppie $n$, $m$: tutto questo grazie al fatto che $H$ (ma potrebbe essere un operatore qualsiasi) è &lsquo;a variabili separate&rsquo;»</i>.</p>
   <p>È la completezza dei prodotti della tappa 01 applicata a due basi particolari. Ogni stato del sistema è una combinazione lineare di soluzioni separate, e la maggior parte degli stati non è separata. La separazione non dice che gli stati sono prodotti: dice che gli autostati dell&rsquo;energia si possono scegliere prodotti.</p>`},
   {label:'Quando la scelta non è unica', body:R`
   <p>C&rsquo;è una sottigliezza nel «si possono scegliere». Se due coppie diverse danno la stessa somma, cioè se $E_{1n}+E_{2m}$ coincide con $E_{1n'}+E_{2m'}$, il livello $E$ è degenere, e ogni combinazione lineare dei prodotti corrispondenti è ancora un autostato, anche se non è un prodotto. La separazione delle variabili fornisce allora <i>una</i> base dell&rsquo;autospazio, non l&rsquo;unica. È esattamente quello che succede nell&rsquo;oscillatore isotropo: la base dei prodotti cartesiani e la base del momento angolare descrivono lo stesso livello degenere con vettori diversi.</p>`}
  ]},
  {t:'prosa', title:'L’evoluzione nel tempo non crea intreccio', tag:'dinamica', html:R`
  <p>Se la hamiltoniana è separabile, l&rsquo;operatore di evoluzione si fattorizza per la regola dell&rsquo;esponenziale della tappa 02,</p>
  $$U(t)=e^{-iHt/\hbar}=e^{-iH_{1}t/\hbar}\otimes e^{-iH_{2}t/\hbar},$$
  <p>e uno stato inizialmente prodotto resta prodotto per sempre, con ciascun fattore che evolve con la propria hamiltoniana. Due sistemi che non interagiscono non si intrecciano. Il viceversa è altrettanto vero: uno stato inizialmente intrecciato resta intrecciato. Nel caso di due parti a due stati, l&rsquo;evoluzione moltiplica la matrice dei coefficienti a sinistra e a destra per due matrici unitarie, $c\to u_{1}\,c\,u_{2}^{T}$, e il determinante cambia solo di una fase, $\det c\to\det u_{1}\det u_{2}\det c$, quindi resta diverso da zero. Le correlazioni si creano solo con un&rsquo;interazione, cioè con un termine della classe B.</p>
  <p>Per la stessa ragione, nella classe A ciascuna particella si può studiare da sola. È quello che Picasso intende quando dice che una ragione per usare il linguaggio del prodotto tensoriale è che <i>«in particolari condizioni ci si può disinteressare di uno dei due sistemi e quindi ridursi allo studio di una sola particella: questo per esempio è quello che molte volte abbiamo espresso dicendo che il sistema è a &lsquo;variabili separate&rsquo;»</i>.</p>`},
  {t:'reveal', title:'La particella in una scatola', tag:'esempio', steps:[
   {label:'Tre buche in una', body:R`
   <p>La separazione non riguarda solo particelle diverse: riguarda coordinate diverse della stessa particella. Una particella chiusa in una scatola cubica di lato $L$, con le pareti impenetrabili, ha il potenziale nullo dentro e infinito fuori. Dentro, la hamiltoniana è la somma delle tre energie cinetiche cartesiane, e la condizione al bordo si spezza in tre condizioni, una per coordinata. È l&rsquo;esercizio 10.2.1 di Shankar e il problema 4.2 di Griffiths. Le autofunzioni sono il prodotto di tre funzioni della buca unidimensionale,</p>
   $$\psi_{n_{1}n_{2}n_{3}}(x,y,z)=\Big(\frac{2}{L}\Big)^{3/2}\sin\frac{n_{1}\pi x}{L}\,\sin\frac{n_{2}\pi y}{L}\,\sin\frac{n_{3}\pi z}{L},$$
   <p>con $n_{i}$ interi positivi, e le energie sono la somma:</p>
   $$E_{n_{1}n_{2}n_{3}}=\frac{\hbar^{2}\pi^{2}}{2mL^{2}}\big(n_{1}^{2}+n_{2}^{2}+n_{3}^{2}\big).$$
   <p>La normalizzazione si controlla fattore per fattore, perché l&rsquo;integrale triplo di un prodotto è il prodotto di tre integrali, ciascuno uguale a uno.</p>`},
   {label:'I primi livelli e le loro degenerazioni', body:R`
   <p>Il problema di Griffiths chiede i primi sei livelli e le loro degenerazioni. In unità di $\hbar^{2}\pi^{2}/2mL^{2}$ i valori di $n_{1}^{2}+n_{2}^{2}+n_{3}^{2}$ sono, in ordine: $3$ dalla terna $(1,1,1)$, non degenere; $6$ dalle permutazioni di $(2,1,1)$, tre volte degenere; $9$ da $(2,2,1)$, tre volte; $11$ da $(3,1,1)$, tre volte; $12$ da $(2,2,2)$, non degenere; $14$ dalle sei permutazioni di $(3,2,1)$, sei volte degenere. Griffiths commenta: <i>«in one dimension degenerate bound states do not occur, but in three dimensions they are very common»</i>.</p>
   <p>Queste degenerazioni hanno una causa visibile, la <span class="str" data-str="simmetrie">simmetria</span> del cubo: scambiare gli assi lascia la scatola uguale, e quindi permuta gli stati dello stesso livello. Una scatola con i lati $L_{1}\ne L_{2}\ne L_{3}$ incommensurabili non ha questa simmetria, e i livelli sono in generale tutti non degeneri.</p>`},
   {label:'La degenerazione che la simmetria non spiega', body:R`
   <p>La domanda (c) del problema di Griffiths chiede la degenerazione del quattordicesimo livello <i>«and why is this case interesting»</i>. Il quattordicesimo valore distinto di $n_{1}^{2}+n_{2}^{2}+n_{3}^{2}$ è $27$, che si ottiene in due modi senza relazione fra loro: $3^{2}+3^{2}+3^{2}$ e $5^{2}+1^{2}+1^{2}$. La prima terna è una sola, la seconda ha tre permutazioni, e il livello è quattro volte degenere. Le permutazioni spiegano il tre, ma nessuna simmetria del cubo trasforma $(3,3,3)$ in $(5,1,1)$: è una degenerazione accidentale, che viene dall&rsquo;aritmetica dei quadrati e non dalla geometria.</p>
   <p>Il caso è interessante perché rompe una regola che di solito funziona, quella per cui ogni degenerazione ha dietro una simmetria. Nel cubo la regola si salva solo in parte. Nell&rsquo;atomo di idrogeno la degenerazione «accidentale» in $l$ ha invece una simmetria nascosta dietro, e il confronto mostra che «accidentale» vuol dire soltanto «non spiegata dalle simmetrie che si sono guardate».</p>`}
  ]},
  {t:'plot', title:'Contare gli stati della scatola',
   intro:R`<p>Numero di terne $(n_{1},n_{2},n_{3})$ di interi positivi con $n_{1}^{2}+n_{2}^{2}+n_{3}^{2}\le\varepsilon$, stimato con il volume di un ottante di sfera $\tfrac{\pi}{6}\varepsilon^{3/2}$ (blu) e con la correzione di superficie $\tfrac{\pi}{6}\varepsilon^{3/2}-\tfrac{3\pi}{8}\varepsilon$ (arancio).</p>`,
   plots:[{kind:'func2d', xr:[0,120], yr:[0,700], height:270, ticks:true,
     title:'stati della scatola cubica sotto una data energia',
     curves:[{f:'Math.PI/6*Math.pow(x,1.5)', col:'#5aa9ff', width:2.2, label:'volume'},
             {f:'Math.max(0,Math.PI/6*Math.pow(x,1.5)-3*Math.PI/8*x)', col:'#ffb86b', width:2.4, label:'volume meno superficie'}],
     xlabel:'epsilon = E / (hbar^2 pi^2 / 2 m L^2)', ylabel:'numero di stati'}],
   leggi:R`<p><b>Che cosa guardare.</b> Il conteggio esatto per $\varepsilon=100$ dà $410$ stati. Il volume dell&rsquo;ottante dà circa $524$, troppo: conta anche i punti con qualche $n_{i}$ nullo, che non sono stati perché la funzione d&rsquo;onda si annullerebbe. Togliendo i tre quarti di disco sui piani coordinati si ottiene circa $406$, a meno dell&rsquo;uno per cento. Per $\varepsilon=900$ il conteggio esatto dà $13100$ e la stima con la superficie circa $13077$.</p>
   <p><b>Che cosa impararne.</b> Il numero di stati sotto un&rsquo;energia cresce come $E^{3/2}$, cioè come il volume della scatola per $(2mE)^{3/2}$: è il conteggio che sta dietro alla densità degli stati di un gas di particelle libere. La separazione delle variabili trasforma il problema in uno di aritmetica, contare i punti di un reticolo dentro una sfera, e il volume ne dà la parte principale.</p>`}
]},
/* ---------------- 05 · L OSCILLATORE TRIDIMENSIONALE ---------------- */
{ num:'05', title:'L oscillatore armonico tridimensionale: tre oscillatori, e lo stesso livello visto col momento angolare', meta:'la hamiltoniana come somma di tre · livelli e degenerazione (n+1)(n+2)/2 · parità · dalla base cartesiana alla base del momento angolare · il livello n=2 come un tensore · l oscillatore anisotropo e quello piano',
  blocchi:[
  {t:'prosa', title:'Tre oscillatori indipendenti', tag:'separazione', html:R`
  <p>L&rsquo;oscillatore isotropo in tre dimensioni ha la hamiltoniana $H=\mathbf p^{2}/2m+\tfrac12m\omega^{2}r^{2}$. Il potenziale dipende solo da $r$, e si potrebbe trattare come un problema in campo centrale. Picasso osserva però che <i>«è più semplice e più istruttivo procedere in modo diverso»</i>: riscrivere la hamiltoniana come somma di tre oscillatori unidimensionali,</p>
  $$H=\Big(\frac{p_{x}^{2}}{2m}+\frac12m\omega^{2}x^{2}\Big)+\Big(\frac{p_{y}^{2}}{2m}+\frac12m\omega^{2}y^{2}\Big)+\Big(\frac{p_{z}^{2}}{2m}+\frac12m\omega^{2}z^{2}\Big),$$
  <p><i>«perché in questo modo si vede che è a variabili separabili, per cui il problema si riconduce alla determinazione degli autovalori e degli autovettori di tre oscillatori unidimensionali, in questo caso identici, problema di cui già conosciamo la soluzione»</i>. Gli autovalori sono la somma, la (11.45) di Picasso:</p>
  $$E_{n_{1}n_{2}n_{3}}=\big(n_{1}+\tfrac12\big)\hbar\omega+\big(n_{2}+\tfrac12\big)\hbar\omega+\big(n_{3}+\tfrac12\big)\hbar\omega=\big(n+\tfrac32\big)\hbar\omega,\qquad n=n_{1}+n_{2}+n_{3}.$$
  <p>Le autofunzioni sono il prodotto di tre autofunzioni dell&rsquo;oscillatore unidimensionale. Con la variabile adimensionale $\boldsymbol\xi=\sqrt{m\omega/\hbar}\,\mathbf r$, che è quella delle note del corso, e i <span class="str" data-str="polinomi-di-hermite">polinomi di Hermite</span> $H_{0}=1$, $H_{1}=2\xi$, $H_{2}=4\xi^{2}-2$, si ha</p>
  $$\psi_{n_{1}n_{2}n_{3}}(\boldsymbol\xi)=\psi_{n_{1}}(\xi_{x})\,\psi_{n_{2}}(\xi_{y})\,\psi_{n_{3}}(\xi_{z}),\qquad \psi_{n}(\xi)=\Big(\frac{m\omega}{\hbar\pi}\Big)^{1/4}\frac{1}{\sqrt{2^{n}n!}}H_{n}(\xi)\,e^{-\xi^{2}/2}.$$
  <p>Il prodotto dei tre esponenziali è $e^{-\xi^{2}/2}$, che dipende solo dal modulo: il fattore gaussiano è a simmetria sferica, e tutta la dipendenza dagli angoli sta nei polinomi. Picasso aggiunge che <i>«ovviamente il metodo della separazione delle variabili permette di risolvere il problema anche se l&rsquo;oscillatore non è isotropo»</i>, cioè con tre pulsazioni diverse, e ci si torna alla fine della tappa.</p>`},
  {t:'reveal', title:'Degenerazione e parità', tag:'conti', steps:[
   {label:'Quanti modi di fare n', body:R`
   <p>Il livello $E_{n}$ ha tanti stati quante sono le terne di interi non negativi con somma $n$. Fissato $n_{1}$, restano $n-n_{1}+1$ modi di scegliere $n_{2}$ (da $0$ a $n-n_{1}$), e $n_{3}$ è determinato. Sommando su $n_{1}$:</p>
   $$g_{n}=\sum_{n_{1}=0}^{n}(n+1-n_{1})=\frac{(n+1)(n+2)}{2}.$$
   <p>È la (11.48) di Picasso, la (26) delle note di Martinelli, che ne scrive i primi valori: $1,3,6,10,\dots$, e l&rsquo;esercizio 10.2.3 di Shankar, che chiede di <i>«show that the degeneracy of a level with energy $E=(n+\tfrac32)\hbar\omega$ is $(n+1)(n+2)/2$»</i>. Griffiths pone la stessa domanda nel problema 4.43.</p>`},
   {label:'La parità di un livello', body:R`
   <p>Ogni $\psi_{n_{i}}$ ha parità $(-1)^{n_{i}}$, e quindi il prodotto ha parità $(-1)^{n_{1}+n_{2}+n_{3}}=(-1)^{n}$, la stessa per tutti gli stati del livello. Le note del corso lo dicono così: gli autostati della hamiltoniana <i>«sono anche autostati dell&rsquo;operatore di parità, che corrisponde alla trasformazione $\vec r\to-\vec r$, e commuta con l&rsquo;Hamiltoniana. La parità degli autostati è data da $(-1)^{n}=(-1)^{n_{x}}\times(-1)^{n_{y}}\times(-1)^{n_{z}}$»</i>. È un&rsquo;informazione decisiva nel passaggio alla base del momento angolare, perché uno stato con momento angolare $l$ ha parità $(-1)^{l}$.</p>`}
  ]},
  {t:'reveal', title:'Dalla base cartesiana alla base del momento angolare', tag:'struttura', steps:[
   {label:'Perché il livello deve contenere multipletti interi', body:R`
   <p>La hamiltoniana commuta con $L^{2}$ e con ciascuna componente $L_{i}$, perché è invariante per rotazioni. Le note di Martinelli ne traggono la conseguenza: si possono cercare stati che siano autostati comuni di $H$, $L^{2}$ e $L_{z}$, e <i>«autostati con lo stesso valore di $n$, che appartengono allo stesso multipletto di momento angolare e differiscono solo per il valore di $L_{z}$, sono necessariamente degeneri»</i>. Un livello contiene quindi multipletti interi, ciascuno di $2l+1$ stati, e per la parità tutti con $l$ pari se $n$ è pari, tutti con $l$ dispari se $n$ è dispari.</p>
   <p>Picasso ragiona allo stesso modo, livello per livello. Il fondamentale è non degenere, quindi è $l=0$; e in effetti $\psi_{000}$ è a simmetria sferica. Il livello $n=1$ è tre volte degenere: <i>«o è un livello con $l=1$ ($m=\pm1,0$) oppure $l=0$ tre volte: questa seconda possibilità è esclusa perché la parità del livello $n$-esimo è $(-1)^{n}$»</i>. Il livello $n=2$, sei volte degenere e pari, può contenere solo $l=2$ e $l=0$, cinque più uno.</p>`},
   {label:'Il livello n=1', body:R`
   <p>I tre stati cartesiani sono $\psi_{100}\propto\xi_{x}e^{-\xi^{2}/2}$, $\psi_{010}\propto\xi_{y}e^{-\xi^{2}/2}$, $\psi_{001}\propto\xi_{z}e^{-\xi^{2}/2}$. Il terzo dipende dagli angoli come $\cos\theta$, e non dipende da $\varphi$: è proporzionale a $Y_{1,0}$, con $l=1$, $m=0$. Gli altri due si combinano come nelle note del corso,</p>
   $$\psi_{\pm}=\frac{\mp\psi_{100}-i\,\psi_{010}}{\sqrt2}\propto\mp(\xi_{x}\pm i\xi_{y})\,e^{-\xi^{2}/2}\propto\xi\sin\theta\,e^{\pm i\varphi}e^{-\xi^{2}/2},$$
   <p>che sono proporzionali alle <span class="str" data-str="armoniche-sferiche">armoniche sferiche</span> $Y_{1,\pm1}$. Il controllo diretto è che $L_{z}=-i\hbar(x\partial_{y}-y\partial_{x})$ applicato a $(x+iy)e^{-r^{2}/2}$ dà $+\hbar$ volte la stessa funzione. Il livello $n=1$ è un solo tripletto $l=1$, e i tre stati cartesiani sono le sue componenti cartesiane, come $x,y,z$ sono le componenti di un vettore.</p>`},
   {label:'Il livello n=2, come un tensore', body:R`
   <p>Per $n=2$ i sei stati cartesiani sono $\psi_{200},\psi_{020},\psi_{002}$, con i polinomi $4\xi_{i}^{2}-2$, e $\psi_{110},\psi_{101},\psi_{011}$, con i prodotti $\xi_{i}\xi_{j}$. La chiave, nelle note di Martinelli, è che questi polinomi di secondo grado sono le componenti del tensore $\xi_{a}\xi_{b}$, e un tensore simmetrico si spezza in una traccia, che è uno scalare, e in una parte a traccia nulla, che ha cinque componenti. La parte antisimmetrica, che sarebbe un vettore, qui non c&rsquo;è: <i>«ovviamente, se $\vec V=\vec W$, la componente antisimmetrica si annulla»</i>.</p>
   <p>La traccia dà lo stato con $l=0$: sommando i tre stati diagonali si ottiene un polinomio che dipende solo da $\xi^{2}$,</p>
   $$\frac{\psi_{200}+\psi_{020}+\psi_{002}}{\sqrt3}\sim(4\xi^{2}-6)\,e^{-\xi^{2}/2},$$
   <p>che è la (36) delle note. La combinazione ortogonale con la stessa invarianza per rotazioni attorno a $z$ è $(-\psi_{200}-\psi_{020}+2\psi_{002})/\sqrt6$, il cui polinomio è proporzionale a $2z^{2}-x^{2}-y^{2}$, cioè a $r^{2}(3\cos^{2}\theta-1)$: è $l=2$, $m=0$. E la (41) delle note dà le due componenti estreme,</p>
   $$|2,2,\pm2\rangle=\frac{|200\rangle-|020\rangle}{2}\pm\frac{i\,|110\rangle}{\sqrt2},$$
   <p>dove a sinistra gli indici sono $n$, $l$, $m$ e a destra $n_{1}n_{2}n_{3}$. La funzione d&rsquo;onda è proporzionale a $(\xi_{x}\pm i\xi_{y})^{2}e^{-\xi^{2}/2}$, cioè a $\sin^{2}\theta\,e^{\pm2i\varphi}$. Il livello $n=2$ è un quintetto $l=2$ più un singoletto $l=0$, e la decomposizione è quella di un tensore simmetrico di rango due nella sua traccia e nella sua parte a traccia nulla.</p>`},
   {label:'Il caso generale', body:R`
   <p>Il livello $n$ contiene i valori $l=n,n-2,n-4,\dots$, fino a $1$ o a $0$, ciascuno una volta. Il conto torna: per $n=2k$ pari, $\sum_{j=0}^{k}(4j+1)=(2k+1)(k+1)$, che è proprio $(n+1)(n+2)/2$. Per $n=4$, per esempio, $l=4,2,0$ danno $9+5+1=15$ stati, e $5\cdot6/2=15$. Le note del corso ottengono lo stesso risultato risolvendo l&rsquo;equazione radiale con i polinomi di Laguerre, e trovano la condizione $n\ge l$ con $n-l$ pari.</p>`}
  ]},
  {t:'plot', title:'Le densità radiali dei primi livelli',
   intro:R`<p>Densità di probabilità radiale $\xi^{2}R_{nl}(\xi)^{2}$, normalizzata a uno: $n=0,\ l=0$ (blu), $n=1,\ l=1$ (arancio), $n=2,\ l=0$ (verde), $n=2,\ l=2$ (viola).</p>`,
   plots:[{kind:'func2d', xr:[0,4], yr:[0,1.25], height:280, ticks:true,
     title:'oscillatore 3D: densita radiali',
     curves:[{f:'4/Math.sqrt(Math.PI)*x*x*Math.exp(-x*x)', col:'#5aa9ff', width:2.4, label:'n=0 l=0'},
             {f:'8/(3*Math.sqrt(Math.PI))*Math.pow(x,4)*Math.exp(-x*x)', col:'#ffb86b', width:2.4, label:'n=1 l=1'},
             {f:'2/(3*Math.sqrt(Math.PI))*x*x*(2*x*x-3)*(2*x*x-3)*Math.exp(-x*x)', col:'#6bdc9b', width:2.4, label:'n=2 l=0'},
             {f:'16/(15*Math.sqrt(Math.PI))*Math.pow(x,6)*Math.exp(-x*x)', col:'#c49bff', width:2.4, label:'n=2 l=2'}],
     xlabel:'xi = r sqrt(m omega / hbar)', ylabel:'densita radiale'}],
   leggi:R`<p><b>Che cosa guardare.</b> I due stati del livello $n=2$ hanno la stessa energia ma densità radiali molto diverse: quello con $l=0$ ha un nodo in $\xi=\sqrt{3/2}$ e due gobbe, quello con $l=2$ una sola gobba spinta in fuori. Le costanti di normalizzazione vengono dagli <span class="str" data-str="integrale-gaussiano">integrali gaussiani</span> dei momenti di $e^{-\xi^{2}}$; quella di $n=2,\ l=0$ è $\tfrac{2}{3\sqrt\pi}$ perché $\int_{0}^{\infty}\xi^{2}(2\xi^{2}-3)^{2}e^{-\xi^{2}}d\xi=\tfrac32\sqrt\pi$.</p>
   <p><b>Che cosa impararne.</b> La degenerazione fra $l=0$ e $l=2$ non viene dalla simmetria per rotazioni, che lega solo gli stati dello stesso $l$, ma dal fatto che l&rsquo;oscillatore isotropo si separa in coordinate cartesiane. Lo stesso livello si descrive con sei prodotti cartesiani o con sei stati di momento angolare definito, e il passaggio fra le due basi è un cambio di base dentro l&rsquo;autospazio.</p>`},
  {t:'prosa', title:'Anisotropo, assiale, piano', tag:'varianti', html:R`
  <p>Con tre pulsazioni diverse la separazione funziona allo stesso modo, e le energie sono $(n_{1}+\tfrac12)\hbar\omega_{1}+(n_{2}+\tfrac12)\hbar\omega_{2}+(n_{3}+\tfrac12)\hbar\omega_{3}$. La degenerazione sparisce se le pulsazioni sono incommensurabili. Il caso intermedio che compare negli esercizi è quello assiale, $\omega_{x}=\omega_{y}=\omega_{\perp}\ne\omega_{z}$: le energie sono $(n_{x}+n_{y}+1)\hbar\omega_{\perp}+(n_{z}+\tfrac12)\hbar\omega_{z}$, il livello con $N$ quanti nel piano, $N=n_{x}+n_{y}$, ha degenerazione $N+1$, e si conserva solo $L_{z}$, perché il potenziale è invariante solo per rotazioni attorno a $z$. I numeri quantici buoni diventano $N$, $n_{z}$ e $m$, con $m=N,N-2,\dots,-N$.</p>
  <p>L&rsquo;oscillatore piano è l&rsquo;esercizio 10.2.2 di Shankar: energie $(n_{x}+n_{y}+1)\hbar\omega$, degenerazione $n+1$ per $n=n_{x}+n_{y}$, e parità $(-1)^{n}$; Shankar chiede di riscrivere i primi stati in coordinate polari, che è la versione piana del passaggio alla base del momento angolare: i due stati del livello $n=1$ diventano $\rho\,e^{\pm i\varphi}e^{-\rho^{2}/2}$, con $L_{z}=\pm\hbar$.</p>
  <p>Un errore frequente negli scritti è usare $\tfrac32\hbar\omega$ come energia di punto zero di un oscillatore che vive in una dimensione, o $\tfrac12\hbar\omega$ per uno in tre. L&rsquo;energia di punto zero conta i gradi di libertà, $\tfrac12\hbar\omega$ per ciascuno, ed è il primo controllo da fare quando un esercizio dà la hamiltoniana «del moto relativo» e non dice in quante dimensioni.</p>`}
]},
/* ---------------- 06 · IL PROBLEMA A DUE CORPI ---------------- */
{ num:'06', title:'Il problema a due corpi: centro di massa e moto relativo', meta:'il cambio di variabili di Picasso verificato da capo · le nuove variabili sono canoniche · l energia cinetica che si spezza · il centro di massa che va per conto suo · che cosa vuol dire nel sistema del centro di massa · la massa ridotta nei numeri',
  blocchi:[
  {t:'prosa', title:'Il problema', tag:'impostazione', html:R`
  <p>Due particelle di masse $m_{1}$ e $m_{2}$, isolate, che interagiscono con un potenziale che dipende solo dalla loro distanza. Picasso nota che l&rsquo;ipotesi è <i>«cosa certamente vera, se le particelle sono prive di struttura»</i>. La hamiltoniana è la (11.15):</p>
  $$H=\frac{\mathbf p_{1}^{2}}{2m_{1}}+\frac{\mathbf p_{2}^{2}}{2m_{2}}+V(|\mathbf q_{1}-\mathbf q_{2}|).$$
  <p>È un problema della classe B di Shankar: il potenziale dipende dalle coordinate di tutte e due le particelle, e nelle variabili $\mathbf q_{1},\mathbf q_{2}$ la hamiltoniana non si separa. Shankar dice che in generale un problema di questo tipo <i>«cannot be reduced to two independent single-particle problems»</i>; ma se il potenziale dipende solo dalla differenza delle coordinate, <i>«one can always»</i>, con il centro di massa e la coordinata relativa, ridurlo a due particelle fittizie indipendenti. Landau lo dice <i>«in modo analogo a come può essere fatto nella meccanica classica»</i>, e Griffiths chiude il problema 5.1 con la stessa osservazione: <i>«exactly the same decomposition occurs in classical mechanics; it reduces the two-body problem to an equivalent one-body problem»</i>.</p>`},
  {t:'reveal', title:'Il cambio di variabili, controllato passo per passo', tag:'derivazione', steps:[
   {label:'Le nuove variabili', body:R`
   <p>Il <span class="str" data-str="cambio-di-variabile">cambio di variabili</span> è la (11.16) di Picasso:</p>
   $$\mathbf q=\mathbf q_{1}-\mathbf q_{2},\qquad \mathbf Q=\frac{m_{1}\mathbf q_{1}+m_{2}\mathbf q_{2}}{m_{1}+m_{2}},\qquad \mathbf p=\frac{m_{2}\mathbf p_{1}-m_{1}\mathbf p_{2}}{m_{1}+m_{2}},\qquad \mathbf P=\mathbf p_{1}+\mathbf p_{2}.$$
   <p><i>«Il significato di $\mathbf q$ e $\mathbf Q$ è evidente; $\mathbf p$ e $\mathbf P$ sono definiti in modo da essere coniugati rispettivamente alle $\mathbf q$ e $\mathbf Q$»</i>. $\mathbf P$ è l&rsquo;impulso totale. $\mathbf p$ ha un significato meno ovvio: dividendo per la massa ridotta $\mu=m_{1}m_{2}/(m_{1}+m_{2})$ si ottiene $\mathbf p/\mu=\mathbf p_{1}/m_{1}-\mathbf p_{2}/m_{2}$, la velocità relativa. Il centro di massa e l&rsquo;impulso totale si scambiano i ruoli: nella posizione pesano le masse, nell&rsquo;impulso no; nella coordinata relativa le masse non pesano, nell&rsquo;impulso relativo sì.</p>`},
   {label:'Sono variabili canoniche', body:R`
   <p>Le regole di commutazione (11.17) sono $[q_{i},p_{j}]=[Q_{i},P_{j}]=i\hbar\delta_{ij}$, e tutti gli altri commutatori nulli. Si controllano con la bilinearità del commutatore, usando $[q_{1i},p_{1j}]=[q_{2i},p_{2j}]=i\hbar\delta_{ij}$ e il fatto che le variabili di particelle diverse commutano. Per esempio</p>
   $$[q_{x},p_{x}]=\Big[q_{1x}-q_{2x},\ \frac{m_{2}p_{1x}-m_{1}p_{2x}}{m_{1}+m_{2}}\Big]=\frac{m_{2}+m_{1}}{m_{1}+m_{2}}\,i\hbar=i\hbar,$$
   $$[Q_{x},p_{x}]=\frac{m_{1}m_{2}-m_{2}m_{1}}{(m_{1}+m_{2})^{2}}\,i\hbar=0,\qquad [q_{x},P_{x}]=(1-1)\,i\hbar=0 .$$
   <p>Il secondo zero è quello che conta: il centro di massa commuta con l&rsquo;impulso relativo, e la coordinata relativa con l&rsquo;impulso totale. È ciò che permette di trattare le due coppie come due particelle indipendenti. Shankar osserva che, siccome le nuove variabili <i>«are also canonical and Cartesian, the quantization condition is just»</i> quella solita, e si può cambiare variabili prima o dopo la quantizzazione senza differenza.</p>`},
   {label:'L’energia cinetica che si spezza', body:R`
   <p>Invertendo le relazioni, $\mathbf p_{1}=\tfrac{m_{1}}{M}\mathbf P+\mathbf p$ e $\mathbf p_{2}=\tfrac{m_{2}}{M}\mathbf P-\mathbf p$, con $M=m_{1}+m_{2}$. Sostituendo nell&rsquo;energia cinetica i termini misti si cancellano, e resta</p>
   $$\frac{\mathbf p_{1}^{2}}{2m_{1}}+\frac{\mathbf p_{2}^{2}}{2m_{2}}=\frac{\mathbf P^{2}}{2M}+\frac{\mathbf p^{2}}{2\mu}.$$
   <p>Il termine misto $\mathbf P\cdot\mathbf p$ ha coefficiente $\tfrac{1}{M}-\tfrac{1}{M}$: è lo stesso termine $P_{1}P_{2}$ che nella tappa 02 Shankar segnalava nell&rsquo;energia del centro di massa, e qui si cancella esattamente con il suo opposto nell&rsquo;energia del moto relativo. Il potenziale dipende dalla distanza $|\mathbf q_{1}-\mathbf q_{2}|$, che è il modulo $|\mathbf q|$ della coordinata relativa, e la hamiltoniana diventa la (11.18):</p>
   $$H=\frac{\mathbf P^{2}}{2M}+\frac{\mathbf p^{2}}{2\mu}+V(|\mathbf q|).$$`},
   {label:'La stessa cosa con le derivate', body:R`
   <p>Griffiths fa fare lo stesso conto nella rappresentazione delle coordinate, nel problema 5.1. Le posizioni si esprimono come $\mathbf r_{1}=\mathbf R+\tfrac{\mu}{m_{1}}\mathbf r$ e $\mathbf r_{2}=\mathbf R-\tfrac{\mu}{m_{2}}\mathbf r$, e per la regola della catena</p>
   $$\nabla_{1}=\frac{\mu}{m_{2}}\nabla_{R}+\nabla_{r},\qquad \nabla_{2}=\frac{\mu}{m_{1}}\nabla_{R}-\nabla_{r}.$$
   <p>Sostituendo nella somma dei laplaciani pesati, il termine misto $\nabla_{R}\cdot\nabla_{r}$ ha coefficiente $\tfrac{2\mu}{m_{1}m_{2}}-\tfrac{2\mu}{m_{1}m_{2}}=0$, e</p>
   $$\frac{1}{m_{1}}\nabla_{1}^{2}+\frac{1}{m_{2}}\nabla_{2}^{2}=\frac{1}{M}\nabla_{R}^{2}+\frac{1}{\mu}\nabla_{r}^{2}.$$
   <p>Il cambio di variabili ha jacobiano di modulo uno: in una dimensione la matrice di $(x_{1},x_{2})\mapsto(X,x)$ è $\begin{pmatrix}m_{1}/M&m_{2}/M\\1&-1\end{pmatrix}$, con determinante $-1$. Quindi $dx_{1}dx_{2}=dX\,dx$, e una funzione d&rsquo;onda normalizzata nelle vecchie variabili è normalizzata anche nelle nuove, senza fattori da aggiungere.</p>`}
  ]},
  {t:'prosa', title:'Il centro di massa va per conto suo', tag:'separazione', html:R`
  <p>La hamiltoniana è ora della classe A: $H=H_{1}+H_{2}$, con $H_{1}=\mathbf P^{2}/2M$ che dipende solo dalle variabili del centro di massa e $H_{2}=\mathbf p^{2}/2\mu+V(|\mathbf q|)$ solo da quelle relative. Picasso scrive che <i>«$H_{1}$ e $H_{2}$ non solo commutano ma, come vedremo fra poco, c&rsquo;è di più»</i>: il di più è che agiscono su fattori diversi dello spazio, che si scrive come prodotto $L^{2}(\mathbb R^{3}_{\mathbf Q})\otimes L^{2}(\mathbb R^{3}_{\mathbf q})$, e la separazione delle variabili della tappa 04 si applica così com&rsquo;è. Le autofunzioni sono i prodotti</p>
  $$\Psi(\mathbf X,\mathbf x)=\Phi(\mathbf X)\,\psi(\mathbf x),\qquad E=E_{1}+E_{2},$$
  <p>con $\Phi$ autofunzione della particella libera di massa $M$ e $\psi$ autofunzione della particella di massa $\mu$ nel potenziale $V$. Picasso lo sottolinea: le due equazioni <i>«si riferiscono a gradi di libertà diversi, quindi in sostanza a sistemi diversi»</i>, e siccome $H_{1}$ è libera, <i>«il problema è solo quello di determinare autovalori e autovettori di $H_{2}$, che è formalmente identica alla hamiltoniana di una particella di massa $\mu$ in un campo centrale»</i>.</p>
  <p>Le autofunzioni del centro di massa sono onde piane $e^{i\mathbf K\cdot\mathbf X}$, con energia $\hbar^{2}K^{2}/2M$. Shankar conclude: <i>«since the CM drifts along as a free particle, one usually chooses to study the problem in the CM frame. In this case $E_{\rm CM}=P_{\rm CM}^{2}/2M$ drops out of the energy, and the plane wave factor in $\psi$ representing CM motion becomes a constant. In short, one can forget all about the CM in the quantum theory just as in the classical theory»</i>.</p>`},
  {t:'prosa', title:'Che cosa vuol dire, esattamente, «nel sistema del centro di massa»', tag:'esami', html:R`
  <p>I testi d&rsquo;esame danno quasi sempre la hamiltoniana «nel sistema del centro di massa», cioè scrivono soltanto $H_{2}$. Dietro la frase ci sono tre fatti, che conviene saper dire. Il primo: l&rsquo;impulso totale $\mathbf P$ commuta con $H$, quindi si conserva, e si possono cercare autostati con $\mathbf P$ definito. Il secondo: nel riferimento in cui il centro di massa è fermo, $\mathbf K=0$, il fattore del centro di massa è una costante, e lo stato del sistema è descritto dalla sola $\psi(\mathbf x)$ del moto relativo. Il terzo, che i testi non dicono: lo stato con $\mathbf K=0$ è un autostato improprio, e il «sistema del centro di massa» è il modo pulito di dire che dal centro di massa non viene nessuna informazione utile, e si studia soltanto il fattore relativo.</p>
  <p>Due convenzioni cambiano da un testo all&rsquo;altro, e un errore su di esse non cambia le energie ma cambia i segni delle funzioni d&rsquo;onda. La coordinata relativa è $\mathbf r_{1}-\mathbf r_{2}$ nei compiti del 19-02-2021 e del 28-01-2020, ma $\mathbf r_{2}-\mathbf r_{1}$ in quello del 15-02-2019: le due scelte differiscono per la trasformazione $\mathbf r\to-\mathbf r$, cioè per la parità del moto relativo, e uno stato con momento angolare relativo $l$ cambia segno se $l$ è dispari. E la massa ridotta di due particelle uguali è $\mu=m/2$, come scrivono quasi tutti i testi; il compito del 29-01-2019 invece chiama $m$ direttamente la massa ridotta. Prima di scrivere $\hbar\omega$ conviene controllare quale massa compare sotto la radice.</p>
  <p>Nel sistema del centro di massa le posizioni delle due particelle sono $\mathbf r_{1}=\tfrac{\mu}{m_{1}}\mathbf r$ e $\mathbf r_{2}=-\tfrac{\mu}{m_{2}}\mathbf r$, e per masse uguali $\mathbf r_{1}=\mathbf r/2$, $\mathbf r_{2}=-\mathbf r/2$. È la formula che serve quando un esercizio chiede il valor medio di un operatore scritto con le coordinate delle singole particelle.</p>`},
  {t:'plot', title:'Quanto vale la massa ridotta',
   intro:R`<p>Rapporto $\mu/m_{1}=x/(1+x)$ in funzione del rapporto delle masse $x=m_{2}/m_{1}$ (blu), con i due limiti: $\mu\to m_{2}$ per $m_{2}\ll m_{1}$ (arancio) e $\mu\to m_{1}$ per $m_{2}\gg m_{1}$ (verde).</p>`,
   plots:[{kind:'func2d', xr:[0,10], yr:[0,1.1], height:260, ticks:true,
     title:'massa ridotta in unita di m1',
     curves:[{f:'x/(1+x)', col:'#5aa9ff', width:2.6, label:'mu / m1'},
             {f:'x', col:'#ffb86b', width:1.4, label:'mu = m2'},
             {f:'1', col:'#6bdc9b', width:1.4, label:'mu = m1'}],
     xlabel:'m2 / m1', ylabel:'mu / m1'}],
   leggi:R`<p><b>Che cosa guardare.</b> La massa ridotta è sempre minore della più piccola delle due masse, e vale la metà quando le masse sono uguali, $x=1$. Per l&rsquo;idrogeno $x=m_{p}/m_{e}\approx1836$ è fuori dal grafico verso destra, e $\mu/m_{e}=0{,}99946$.</p>
   <p><b>Che cosa impararne.</b> Il moto relativo «sente» la massa più leggera, corretta verso il basso dal rinculo della più pesante. Per un elettrone attorno a un nucleo la correzione è di qualche parte su diecimila; per due particelle uguali, come il positronio o due nucleoni, è un fattore due, e dimenticarla dimezza o raddoppia le energie.</p>`},
  {t:'reveal', title:'La massa ridotta nei numeri: i problemi di Griffiths', tag:'numeri', steps:[
   {label:'Idrogeno e deuterio', body:R`
   <p>Il problema 5.2 di Griffiths sfrutta il fatto che, per il problema 5.1, <i>«we can correct for the motion of the nucleus in hydrogen by simply replacing the electron mass with the reduced mass»</i>. I livelli dell&rsquo;idrogeno sono proporzionali alla massa, quindi l&rsquo;errore relativo che si commette usando $m_{e}$ invece di $\mu$ è $m_{e}/\mu-1=m_{e}/m_{p}$, cioè lo $0{,}054\%$. Fra idrogeno e deuterio la differenza delle masse ridotte separa le righe: per la riga rossa di Balmer ($n=3\to2$, $\lambda\approx656{,}5\ \mathrm{nm}$) le lunghezze d&rsquo;onda stanno nel rapporto inverso delle masse ridotte, $\lambda_{H}/\lambda_{D}=\mu_{D}/\mu_{H}$, e la separazione è di circa $0{,}18\ \mathrm{nm}$. È lo spostamento isotopico con cui il deuterio fu scoperto, e si misura con uno spettrometro ordinario.</p>`},
   {label:'Positronio e idrogeno muonico', body:R`
   <p>Nel positronio il protone è sostituito da un positrone, di massa uguale a quella dell&rsquo;elettrone: $\mu=m_{e}/2$, e l&rsquo;energia di legame è la metà di quella dell&rsquo;idrogeno con nucleo infinitamente pesante, $13{,}6/2=6{,}8\ \mathrm{eV}$ in <span class="str" data-str="elettronvolt">elettronvolt</span>. Nell&rsquo;idrogeno muonico l&rsquo;elettrone è sostituito da un muone, $206{,}77$ volte più pesante: $\mu/m_{e}=206{,}77/(1+206{,}77\,m_{e}/m_{p})\approx185{,}8$. La riga Lyman alfa, che con nucleo infinito sta a $121{,}5\ \mathrm{nm}$, si sposta a $121{,}5/185{,}8\approx0{,}654\ \mathrm{nm}$, nei raggi X. Qui la correzione della massa ridotta non è un dettaglio: è più del dieci per cento.</p>`},
   {label:'I doppietti di HCl', body:R`
   <p>Il problema 5.3 di Griffiths: il cloro ha due isotopi, di massa $35$ e $37$, e la molecola HCl vibra come un oscillatore di pulsazione $\omega=\sqrt{k/\mu}$, con la costante elastica $k$ uguale per i due isotopi perché dipende dagli elettroni. Le masse ridotte, in unità atomiche, sono $\mu_{35}=35/36$ e $\mu_{37}=37/38$, e il rapporto delle frequenze dà</p>
   $$\frac{\Delta\nu}{\nu}=1-\sqrt{\frac{\mu_{35}}{\mu_{37}}}\approx7{,}51\times10^{-4},$$
   <p>esattamente il valore che Griffiths chiede di mostrare. Ogni riga vibrazionale è un doppietto stretto, e il rapporto delle intensità è il rapporto delle abbondanze isotopiche.</p>`},
   {label:'La molecola rigida e la buca sferica', body:R`
   <p>Picasso dà due esempi dello stesso schema. Nella molecola biatomica a distanza fissa $d$, il moto relativo ha solo i gradi di libertà angolari, e la hamiltoniana è $\mathbf L^{2}/2I$ con $I=\mu d^{2}$ il momento d&rsquo;inerzia: le energie sono la (11.25), $E_{l}=\hbar^{2}l(l+1)/2I$, ciascuna degenere $2l+1$ volte, e Picasso nota che <i>«la teoria di Bohr fornisce il risultato corretto solo per grandi valori del numero quantico»</i>. Nella buca sferica di profondità $V_{0}$ e raggio $a$, uno stato legato esiste solo se $2\mu V_{0}a^{2}/\hbar^{2}\gt\pi^{2}/4$, e la massa è quella ridotta se a legarsi sono due particelle. Applicato a due nucleoni, con $\mu c^{2}\approx469{,}5\ \mathrm{MeV}$ e $a=2\ \mathrm{fm}$, il conto dà una profondità minima di circa $25{,}6\ \mathrm{MeV}$: una buca nucleare deve essere profonda qualche decina di MeV per tenere insieme il deutone, che infatti ha un solo stato legato.</p>`}
  ]}
]},
/* ---------------- 07 · LO SPIN NON SI SEPARA ---------------- */
{ num:'07', title:'Che cosa succede allo spin quando si separa il moto', meta:'lo spin è un fattore che il cambio di variabili non tocca · quattro forme di hamiltoniana e che cosa si separa in ciascuna · il momento angolare totale nelle nuove variabili · lo scambio di due particelle identiche nel centro di massa · la regola l più S pari',
  blocchi:[
  {t:'prosa', title:'Il fattore che il cambio di variabili non vede', tag:'struttura', html:R`
  <p>Due particelle con spin $s_{1}$ e $s_{2}$ hanno lo spazio degli stati</p>
  $$\mathcal H=L^{2}(\mathbb R^{3}_{\mathbf r_{1}})\otimes L^{2}(\mathbb R^{3}_{\mathbf r_{2}})\otimes\mathbb C^{2s_{1}+1}\otimes\mathbb C^{2s_{2}+1}.$$
  <p>Il cambio di variabili della tappa precedente è una trasformazione delle sole posizioni e dei soli impulsi: riorganizza i primi due fattori in $L^{2}(\mathbb R^{3}_{\mathbf Q})\otimes L^{2}(\mathbb R^{3}_{\mathbf q})$ e lascia intatti gli altri due. Lo spin non appartiene né al centro di massa né al moto relativo. È un terzo pezzo, e lo spazio, nelle variabili nuove, si scrive</p>
  $$\mathcal H=\underbrace{L^{2}(\mathbb R^{3}_{\mathbf Q})}_{\text{centro di massa}}\otimes\underbrace{L^{2}(\mathbb R^{3}_{\mathbf q})\otimes\mathbb C^{2s_{1}+1}\otimes\mathbb C^{2s_{2}+1}}_{\text{moto relativo e spin}}.$$
  <p>Il raggruppamento a destra non è una scelta estetica. Il centro di massa è libero se nella hamiltoniana non compare niente che dipenda da $\mathbf Q$ o da $\mathbf P$ oltre all&rsquo;energia cinetica $\mathbf P^{2}/2M$, e questo è vero nei problemi d&rsquo;esame. Lo spin, invece, può comparire accoppiato al moto relativo, e allora il problema «del moto relativo» è un problema sullo spazio $L^{2}(\mathbb R^{3}_{\mathbf q})\otimes\mathbb C^{2s_{1}+1}\otimes\mathbb C^{2s_{2}+1}$, che non si separa ulteriormente. Ballentine l&rsquo;ha detto in generale: posizione e spin sono gradi di libertà cinematicamente indipendenti, e lo spazio è un prodotto; ma che la hamiltoniana sia una somma è un&rsquo;altra questione.</p>`},
  {t:'reveal', title:'Quattro forme di hamiltoniana, e che cosa si separa', tag:'casi', steps:[
   {label:'Nessuna dipendenza dallo spin', body:R`
   <p>Se $H=\mathbf P^{2}/2M+H_{\rm rel}(\mathbf q,\mathbf p)$, con $H_{\rm rel}$ che non contiene lo spin, ogni livello del moto relativo è degenere $(2s_{1}+1)(2s_{2}+1)$ volte, perché lo stato di spin si sceglie liberamente. Per due particelle distinguibili di spin $\tfrac12$ il fattore è quattro. Per due particelle identiche questo non è più vero, come si vede sotto: il fattore è minore e dipende dal livello.</p>`},
   {label:'Un termine di solo spin', body:R`
   <p>Se $H=\mathbf P^{2}/2M+H_{\rm rel}(\mathbf q,\mathbf p)+H_{\rm spin}(\mathbf S_{1},\mathbf S_{2})$, per esempio con un termine $\mathbf S_{1}\cdot\mathbf S_{2}$ o un campo magnetico che agisce sullo spin totale, il problema si separa in tre: le energie sono $E_{\rm CM}+E_{\rm rel}+E_{\rm spin}$, e gli autostati sono prodotti di tre fattori. È la forma del compito del 28-01-2020, con $\mathbf S_{1}\cdot\mathbf S_{2}$, e di quello del 14-02-2020, con $\mathbf S_{1}\cdot\mathbf S_{2}$ e un campo $\mathbf B$ lungo $z$.</p>`},
   {label:'Spin accoppiato al moto relativo', body:R`
   <p>Se compare $\mathbf L\cdot\mathbf S$, o un potenziale che dipende dallo stato di spin, il moto relativo e lo spin non si separano più. Due esempi dagli scritti. Nel compito del 29-01-2019 il potenziale è $2m\omega^{2}x^{2}(1+2\mathbf S_{1}\cdot\mathbf S_{2}/\hbar^{2})^{2}$: la costante elastica dipende dallo spin totale, e lo spin decide la frequenza del moto relativo. Nel compito del 25-06-2018 la hamiltoniana contiene $\tfrac{\alpha}{\hbar}\mathbf L\cdot\mathbf S$, con $\mathbf L$ il momento angolare del moto relativo. In tutti e due i casi il centro di massa resta separato; ciò che non si separa è la coppia moto relativo più spin, e la si tratta trovando operatori che commutano con la sua hamiltoniana: $\mathbf S^{2}$ nel primo caso, $\mathbf J^{2}$, $\mathbf L^{2}$, $\mathbf S^{2}$ nel secondo.</p>`},
   {label:'Spin accoppiato alle singole posizioni', body:R`
   <p>Il caso più insidioso è un operatore scritto con le coordinate delle singole particelle. Nel compito del 29-01-2019 compare $\hat O=S_{1z}x_{1}+S_{2z}x_{2}$. Con masse uguali $x_{1}=X+x/2$ e $x_{2}=X-x/2$, e</p>
   $$\hat O=(S_{1z}+S_{2z})\,X+(S_{1z}-S_{2z})\,\frac{x}{2}.$$
   <p>Il primo termine accoppia lo spin al centro di massa, il secondo al moto relativo, e l&rsquo;operatore $S_{1z}-S_{2z}$ non conserva lo spin totale: collega il singoletto al tripletto con $S_{z}=0$. Se un termine del genere stesse nella hamiltoniana, il centro di massa non sarebbe più libero. È quello che succede a due particelle con momento magnetico in un campo non uniforme: la forza dipende dallo spin di ciascuna e dalla sua posizione, e il moto del centro di massa si accoppia agli spin. Nel compito l&rsquo;operatore è solo un&rsquo;osservabile, non un pezzo della hamiltoniana, e su stati con $S_{z}=0$ il primo termine dà zero.</p>`}
  ]},
  {t:'prosa', title:'Il momento angolare nelle nuove variabili', tag:'momento angolare', html:R`
  <p>Il momento angolare orbitale totale si spezza come l&rsquo;energia cinetica. La somma dei due momenti delle particelle è la somma di quello del centro di massa e di quello del moto relativo:</p>
  $$\mathbf r_{1}\times\mathbf p_{1}+\mathbf r_{2}\times\mathbf p_{2}=\mathbf R\times\mathbf P+\mathbf r\times\mathbf p .$$
  <p>Il conto è lo stesso dell&rsquo;energia cinetica: sostituendo $\mathbf r_{1}=\mathbf R+\tfrac{\mu}{m_{1}}\mathbf r$, $\mathbf p_{1}=\tfrac{m_{1}}{M}\mathbf P+\mathbf p$ e le analoghe per la particella 2, i termini misti $\mathbf R\times\mathbf p$ e $\mathbf r\times\mathbf P$ hanno coefficienti che si cancellano. Nel sistema del centro di massa, quando gli esercizi parlano di $\mathbf L$, intendono $\mathbf r\times\mathbf p$, il momento angolare del moto relativo: il compito del 25-06-2018 lo dice esplicitamente, <i>«se $\mathbf L$ è il momento angolare totale nel sistema del centro di massa»</i>. Il momento angolare totale del sistema nel centro di massa è allora $\mathbf J=\mathbf L+\mathbf S_{1}+\mathbf S_{2}$, con $\mathbf L$ relativo.</p>
  <p>Landau usa la stessa scomposizione per la parità di un sistema che si spezza in due: la parità del sistema è il prodotto delle parità intrinseche delle due parti per $(-1)^{l}$, con $l$ il momento angolare del moto relativo. Il suo esempio è un atomo in uno stato pari con momento nullo, che potrebbe energeticamente disintegrarsi in un elettrone libero e uno ione in uno stato dispari con momento nullo: <i>«è facile vedere che tale disintegrazione è di fatto impossibile (si dice che essa è proibita)»</i>, perché l&rsquo;elettrone dovrebbe avere momento relativo nullo e quindi parità relativa pari, e lo stato finale sarebbe dispari.</p>`},
  {t:'reveal', title:'Due particelle identiche nel centro di massa', tag:'scambio', steps:[
   {label:'Che cosa fa lo scambio alle nuove variabili', body:R`
   <p>Lo scambio di due particelle identiche manda $\mathbf r_{1}\leftrightarrow\mathbf r_{2}$, $\mathbf p_{1}\leftrightarrow\mathbf p_{2}$, e scambia anche gli spin. Con masse uguali, il centro di massa $(\mathbf r_{1}+\mathbf r_{2})/2$ e l&rsquo;impulso totale restano uguali, mentre la coordinata relativa e l&rsquo;impulso relativo cambiano segno. Lo scambio è quindi il prodotto di tre operazioni, una per fattore:</p>
   $$P_{12}=\mathbb 1_{\rm CM}\otimes\Pi_{\rm rel}\otimes P_{\rm spin},$$
   <p>con $\Pi_{\rm rel}$ la parità del moto relativo, $\mathbf r\to-\mathbf r$, e $P_{\rm spin}$ lo scambio dei due spin. Picasso lo usa nello scattering fra particelle identiche: la funzione d&rsquo;onda si scrive come prodotto di quella del centro di massa e di quella del moto relativo, e <i>«poiché $\Phi(\vec r_{1}+\vec r_{2})$ è simmetrica rispetto allo scambio di $\vec r_{1}$ con $\vec r_{2}$, è solo $\Psi(\vec r)$ che deve essere simmetrizzata o antisimmetrizzata»</i>, con l&rsquo;osservazione che $\vec r\to-\vec r$ equivale a $r\to r$, $\theta\to\pi-\theta$, $\phi\to\phi+\pi$.</p>`},
   {label:'Le due parità', body:R`
   <p>Uno stato del moto relativo con momento angolare $l$ ha parità $(-1)^{l}$, perché $Y_{lm}(\pi-\theta,\varphi+\pi)=(-1)^{l}Y_{lm}(\theta,\varphi)$. In una dimensione, dove non c&rsquo;è momento angolare, è la parità della funzione $\psi_{n}(x)$, che per l&rsquo;oscillatore e per la buca simmetrica è $(-1)^{n}$.</p>
   <p>Per due spin $\tfrac12$ lo scambio lascia invariati i tre stati di tripletto e cambia segno al singoletto. Lo si vede sulla base prodotto, e c&rsquo;è un&rsquo;identità che lo riassume: l&rsquo;operatore di scambio dei due spin è</p>
   $$P_{\rm spin}=\tfrac12\big(\mathbb 1+\boldsymbol\sigma_{1}\cdot\boldsymbol\sigma_{2}\big),$$
   <p>che vale $\tfrac12(1+1)=1$ sul tripletto e $\tfrac12(1-3)=-1$ sul singoletto, usando gli autovalori di $\boldsymbol\sigma_{1}\cdot\boldsymbol\sigma_{2}$ trovati nella tappa 02. Per due spin $1$ l&rsquo;analoga è $P_{\rm spin}=-\mathbb 1+\mathbf S_{1}\cdot\mathbf S_{2}+(\mathbf S_{1}\cdot\mathbf S_{2})^{2}$ in unità $\hbar=1$, e dà $+1$ per spin totale $S=2$ e $S=0$, $-1$ per $S=1$. In generale lo stato di spin totale $S$ di due spin $s$ ha simmetria $(-1)^{2s-S}$.</p>`},
   {label:'La regola', body:R`
   <p>Il postulato di simmetrizzazione chiede che lo stato di due particelle identiche sia simmetrico per scambio se sono bosoni (spin intero) e antisimmetrico se sono fermioni (spin semintero): $P_{12}=(-1)^{2s}$. Nel centro di massa, con il fattore del centro di massa simmetrico, la condizione diventa</p>
   $$(-1)^{l}\,(-1)^{2s-S}=(-1)^{2s}\quad\Longleftrightarrow\quad l+S\ \text{pari}.$$
   <p>La regola è la stessa per bosoni e fermioni, ed è quella che governa tutti gli esercizi con due particelle identiche. Per due fermioni di spin $\tfrac12$: <b>$l$ pari va con il singoletto, $l$ dispari con il tripletto</b>. In una dimensione: $n$ pari con il singoletto, $n$ dispari con il tripletto. Per due bosoni di spin $1$: $l$ pari con $S=0$ o $S=2$, $l$ dispari con $S=1$. Picasso la applica allo scattering protone-protone: due fermioni nello stesso stato di spin, cioè di tripletto, hanno parte spaziale antisimmetrica.</p>
   <p>La conseguenza sul conteggio è il punto che gli esercizi sfruttano. Per due fermioni di spin $\tfrac12$ in un oscillatore isotropo, il livello $n$ del moto relativo, che per particelle distinguibili avrebbe $4g_{n}$ stati, ne ha $g_{n}$ se $n$ è pari, tutti di singoletto, e $3g_{n}$ se $n$ è dispari, tutti di tripletto. Lo spin non si separa dal moto relativo nemmeno quando la hamiltoniana non lo contiene: la simmetria lo lega alla parità.</p>`}
  ]},
  {t:'plot', title:'Quanti stati per livello, distinguibili e identiche',
   intro:R`<p>Numero di stati del livello $n$ del moto relativo in un oscillatore isotropo, per due particelle di spin $\tfrac12$ e hamiltoniana indipendente dallo spin: distinguibili, $4g_{n}=2(n+1)(n+2)$ (blu); identiche, $g_{n}$ per $n$ pari e $3g_{n}$ per $n$ dispari (arancio, letto sugli interi).</p>`,
   plots:[{kind:'func2d', xr:[0,6], yr:[0,120], height:260, ticks:true,
     title:'stati per livello: distinguibili contro fermioni identici',
     curves:[{f:'2*(x+1)*(x+2)', col:'#5aa9ff', width:2.2, label:'distinguibili'},
             {f:'(2-Math.cos(Math.PI*x))*(x+1)*(x+2)/2', col:'#ffb86b', width:2.4, label:'identici (sugli interi)'}],
     xlabel:'n', ylabel:'numero di stati'}],
   leggi:R`<p><b>Che cosa guardare.</b> La curva arancione è $(2-\cos\pi n)\,g_{n}$, che sugli interi vale $g_{n}$ per $n$ pari e $3g_{n}$ per $n$ dispari: $1,9,6,30,15,63,\dots$ Per particelle distinguibili sarebbero $4,12,24,40,60,84,\dots$. I livelli pari perdono tre quarti degli stati, i dispari un quarto.</p>
   <p><b>Che cosa impararne.</b> Per livelli alti il rapporto fra le due curve, preso su due livelli consecutivi, tende a un mezzo: lo spazio delle particelle identiche è, a grandi linee, metà di quello delle distinguibili. Sui primi livelli non è così, i primi due danno $1+9=10$ contro $16$, e la metà è distribuita in modo diseguale fra pari e dispari. È proprio questa distribuzione che un esercizio chiede quando domanda «le degenerazioni dei primi livelli».</p>`},
  {t:'prosa', title:'Un esempio con due bosoni', tag:'esame', html:R`
  <p>Il compito del 15-07-2020 mette insieme tutto quello che precede con due particelle identiche di spin $1$: nel centro di massa</p>
  $$H=\frac{\mathbf p^{2}}{2\mu}+\frac12\mu\omega^{2}r^{2}+\frac{\omega}{\hbar}\mathbf J^{2},\qquad \mathbf J=\mathbf L+\mathbf S,\quad \mathbf S=\mathbf S_{1}+\mathbf S_{2}.$$
  <p>Le energie sono $(n+\tfrac32)\hbar\omega+\hbar\omega\,J(J+1)$. La regola dice $l+S$ pari. Nel livello $n=0$ c&rsquo;è solo $l=0$, quindi $S=0$ o $S=2$, e $J=S$: le energie sono $\tfrac32\hbar\omega$ per $J=0$ e $\tfrac{15}{2}\hbar\omega$ per $J=2$. Nel livello $n=1$ c&rsquo;è solo $l=1$, quindi $S=1$, e la <span class="str" data-str="clebsch-gordan">composizione</span> di $l=1$ con $S=1$ dà $J=0,1,2$: il valore più basso è $\tfrac52\hbar\omega$, con $J=0$. Nel livello $n=2$ ci sono $l=0$ e $l=2$, con $S=0$ o $S=2$, e $J=0$ si ottiene in due modi, $(l,S)=(0,0)$ e $(2,2)$: energia $\tfrac72\hbar\omega$, degenere due volte. Il quarto valore, $\tfrac92\hbar\omega$, viene da $n=1$ con $J=1$ e da $n=3$ con $l=1$, $S=1$, $J=0$.</p>
  <p>I primi tre livelli sono quindi $\tfrac32\hbar\omega$, $\tfrac52\hbar\omega$ e $\tfrac72\hbar\omega$, con degenerazioni $1$, $1$ e $2$. Senza la regola $l+S$ pari si conterebbero anche stati come $l=0$, $S=1$, $J=1$ a $\tfrac32\hbar\omega+2\hbar\omega$, che per due bosoni identici non esistono.</p>`}
]},
/* ---------------- 08 · COMPITO DEL 28-01-2020 ---------------- */
{ num:'08', title:'Un compito intero: due fermioni in un oscillatore, con S1 per S2 (28-01-2020)', meta:'esame del 28 gennaio 2020 esercizio 1 · il livello che la statistica sposta · fondamentale nove volte degenere · un incrocio fra singoletto e tripletto · la perturbazione che commuta e separa tutto · Lz e r quadro sul fondamentale',
  blocchi:[
  {t:'prosa', title:'Il testo', tag:'esame', html:R`
  <p>Il compito del 28-01-2020 dà, <i>«nel sistema di riferimento del centro di massa»</i>, la hamiltoniana di due particelle identiche di spin $\tfrac12$ e massa $m$:</p>
  $$H_{0}=\frac{\mathbf p^{2}}{2\mu}+\frac12\mu\omega^{2}r^{2}-\frac{4\omega}{\hbar}\,\mathbf S_{1}\cdot\mathbf S_{2},\qquad \mathbf r=\mathbf r_{1}-\mathbf r_{2},\quad \mu=\frac m2 .$$
  <p>Chiede (a) le energie del fondamentale e dei primi due stati eccitati, con le degenerazioni e le autofunzioni; (b) con la perturbazione $V=\lambda\frac{\omega}{\hbar}\big(\mathbf J^{2}+\hbar J_{z}\big)$, $\lambda\ll1$ positivo e $\mathbf J=\mathbf L+\mathbf S$, le energie degli stati con $E\lt E_{0}+\hbar\omega/2$; (c) i valori di $L_{z}$ con le probabilità sul fondamentale di $H_{0}+V$; (d) il valor medio di $r^{2}$ su quello stato. È la forma «moto relativo più un termine di solo spin» della tappa precedente, con l&rsquo;aggiunta della statistica.</p>`},
  {t:'reveal', title:'(a) I livelli di H0', tag:'soluzione', steps:[
   {label:'La separazione, e il termine di spin', body:R`
   <p>$H_{0}$ è la somma di un oscillatore isotropo per il moto relativo e di un operatore di solo spin. Il termine di spin si diagonalizza con lo spin totale, perché $\mathbf S_{1}\cdot\mathbf S_{2}$ vale $\tfrac14\hbar^{2}$ sul tripletto e $-\tfrac34\hbar^{2}$ sul singoletto:</p>
   $$-\frac{4\omega}{\hbar}\cdot\frac{\hbar^{2}}{4}=-\hbar\omega\ \ (S=1),\qquad -\frac{4\omega}{\hbar}\cdot\Big(-\frac{3\hbar^{2}}{4}\Big)=3\hbar\omega\ \ (S=0).$$
   <p>Senza la statistica, le energie sarebbero $(n+\tfrac32)\hbar\omega-\hbar\omega$ per il tripletto e $(n+\tfrac32)\hbar\omega+3\hbar\omega$ per il singoletto, per ogni $n$, e il fondamentale sarebbe $n=0$ con il tripletto, a $\tfrac12\hbar\omega$.</p>`},
   {label:'La regola che cambia tutto', body:R`
   <p>Le particelle sono fermioni identici di spin $\tfrac12$. Il livello $n$ dell&rsquo;oscillatore contiene solo $l$ con la parità di $n$, quindi $l+S$ pari vuol dire: <b>$n$ pari con il singoletto, $n$ dispari con il tripletto</b>. Lo stato $n=0$ con il tripletto non esiste. Le energie permesse sono</p>
   $$E_{n}^{\rm (tripletto)}=\Big(n+\frac12\Big)\hbar\omega\ \ (n\ \text{dispari}),\qquad E_{n}^{\rm (singoletto)}=\Big(n+\frac92\Big)\hbar\omega\ \ (n\ \text{pari}),$$
   <p>con degenerazioni $3g_{n}$ e $g_{n}$, $g_{n}=(n+1)(n+2)/2$.</p>`},
   {label:'I primi tre livelli', body:R`
   <p>In ordine crescente. Il <b>fondamentale</b> è $n=1$ con il tripletto: $E_{0}=\tfrac32\hbar\omega$, degenere $3\cdot3=9$ volte. Il <b>primo eccitato</b> è $n=3$ con il tripletto: $\tfrac72\hbar\omega$, degenere $3\cdot10=30$ volte. Il <b>secondo eccitato</b> è $n=0$ con il singoletto: $\tfrac92\hbar\omega$, non degenere. Il livello successivo è $n=5$ con il tripletto, a $\tfrac{11}{2}\hbar\omega$, con $63$ stati, poi $n=2$ con il singoletto a $\tfrac{13}{2}\hbar\omega$.</p>
   <p>L&rsquo;ordine è controintuitivo: il secondo eccitato ha il moto relativo nel suo stato più basso, e sta sopra due livelli in cui il moto relativo è eccitato. Il termine $-\tfrac{4\omega}{\hbar}\mathbf S_{1}\cdot\mathbf S_{2}$ favorisce il tripletto di $4\hbar\omega$, e la statistica obbliga il tripletto a stare sui livelli dispari: conviene pagare un quanto di oscillatore per avere il tripletto.</p>`},
   {label:'Le autofunzioni', body:R`
   <p>Il fondamentale è $\psi_{1,1,m}(\mathbf r)\,\chi_{1,M}$, con $m,M\in\{1,0,-1\}$ e $\chi_{1,M}$ gli stati di tripletto. Nella base cartesiana la parte spaziale è $\psi_{100},\psi_{010},\psi_{001}$, cioè $\xi_{x},\xi_{y},\xi_{z}$ per la gaussiana; nella base del momento angolare è $R_{11}(r)Y_{1m}$, con $R_{11}\propto r\,e^{-\mu\omega r^{2}/2\hbar}$. Il primo eccitato ha le dieci funzioni del livello $n=3$, che contiene $l=3$ e $l=1$, per i tre stati di tripletto. Il secondo eccitato è $\psi_{000}(\mathbf r)\,\chi_{0,0}$, la gaussiana per il singoletto. Si noti che con la convenzione del compito, $\mathbf r=\mathbf r_{1}-\mathbf r_{2}$, lo scambio manda $\mathbf r\to-\mathbf r$: le parti spaziali del tripletto sono dispari e quella del singoletto è pari, come deve essere.</p>`}
  ]},
  {t:'plot', title:'I livelli di H0 con e senza la statistica',
   intro:R`<p>Energie in unità $\hbar\omega$ in funzione di $n$, letto sugli interi: tripletto $n+\tfrac12$ (blu, permesso solo per $n$ dispari) e singoletto $n+\tfrac92$ (arancio, permesso solo per $n$ pari); la retta tratteggiata del tripletto passa anche per i valori pari, che la statistica vieta.</p>`,
   plots:[{kind:'func2d', xr:[0,6], yr:[0,11], height:270, ticks:true,
     title:'compito 28-01-2020: tripletto e singoletto',
     curves:[{f:'x+0.5', col:'#5aa9ff', width:2.4, label:'tripletto, n dispari'},
             {f:'x+4.5', col:'#ffb86b', width:2.4, label:'singoletto, n pari'},
             {f:'1.5', col:'#6bdc9b', width:1.2, label:'E0 = 3/2'},
             {f:'2', col:'#c49bff', width:1.2, label:'E0 + 1/2: soglia della domanda b'}],
     xlabel:'n', ylabel:'E / hbar omega'}],
   leggi:R`<p><b>Che cosa guardare.</b> Sulla retta blu i punti permessi sono $n=1,3,5$, a $\tfrac32,\tfrac72,\tfrac{11}{2}$; sulla arancione $n=0,2,4$, a $\tfrac92,\tfrac{13}{2},\tfrac{17}{2}$. Il punto $n=0$ della retta blu, a $\tfrac12$, sarebbe il fondamentale per particelle distinguibili, ed è vietato. La riga viola a $2\hbar\omega$ è la soglia della domanda (b): sotto ci sta solo il livello fondamentale.</p>
   <p><b>Che cosa impararne.</b> Le due rette si intrecciano: il singoletto a $n=0$ cade fra il tripletto a $n=3$ e quello a $n=5$. Con un coefficiente diverso davanti a $\mathbf S_{1}\cdot\mathbf S_{2}$ l&rsquo;ordine cambierebbe, e l&rsquo;esercizio chiede proprio di trovarlo, cosa che si fa solo dopo aver applicato la regola di scambio.</p>`},
  {t:'reveal', title:'(b), (c), (d) La perturbazione, Lz e r quadro', tag:'soluzione', steps:[
   {label:'(b) La perturbazione è già diagonale', body:R`
   <p>Sotto la soglia $E_{0}+\hbar\omega/2=2\hbar\omega$ c&rsquo;è solo il livello fondamentale, nove volte degenere. La perturbazione $V=\lambda\frac{\omega}{\hbar}(\mathbf J^{2}+\hbar J_{z})$ commuta con $H_{0}$, perché $\mathbf J^{2}$ e $J_{z}$ commutano con l&rsquo;oscillatore isotropo e con $\mathbf S_{1}\cdot\mathbf S_{2}$: è diagonale negli stati $|n=1,l=1,S=1;J,M\rangle$, e il risultato è esatto, non solo al primo ordine. Componendo $l=1$ con $S=1$ si ottiene $J=0,1,2$, e</p>
   $$E_{J,M}=\frac32\hbar\omega+\lambda\hbar\omega\,\big[J(J+1)+M\big].$$
   <p>I valori di $J(J+1)+M$ sono $0$ per $J=0$; $1,2,3$ per $J=1$; $4,5,6,7,8$ per $J=2$. Sono nove numeri diversi: la perturbazione toglie completamente la degenerazione, e i nove livelli sono equidistanti, a passo $\lambda\hbar\omega$. Siccome $J(J+1)+M\ge0$, la perturbazione non abbassa nessuno stato, e i livelli più alti di $H_{0}$ restano sopra la soglia. Tutti e nove stanno sotto $2\hbar\omega$ purché $8\lambda\lt\tfrac12$, che per $\lambda\ll1$ è vero.</p>`},
   {label:'(c) Lz sul fondamentale', body:R`
   <p>Il fondamentale di $H_{0}+V$ è lo stato con $J=0$, l&rsquo;unico con $J(J+1)+M=0$. Nella base $|m_{l}\rangle|m_{s}\rangle$ è la combinazione con $m_{l}+m_{s}=0$ che ha $\mathbf J^{2}=0$, con i <span class="str" data-str="clebsch-gordan">coefficienti di Clebsch-Gordan</span> di $1\otimes1\to0$:</p>
   $$|J=0\rangle=\frac{1}{\sqrt3}\big(|1\rangle|-1\rangle-|0\rangle|0\rangle+|-1\rangle|1\rangle\big).$$
   <p>Che $\mathbf J^{2}$ dia zero su questo vettore si controlla con le matrici di spin $1$ nel prodotto tensoriale, $\mathbf J=\mathbf L\otimes\mathbb 1+\mathbb 1\otimes\mathbf S$. Le probabilità di $L_{z}=\hbar,0,-\hbar$ sono i moduli quadri dei coefficienti: $\tfrac13$ ciascuna. Il risultato ha una ragione semplice: lo stato con $J=0$ è invariante per rotazioni, e nessuna direzione può essere privilegiata per $\mathbf L$.</p>`},
   {label:'(d) r quadro', body:R`
   <p>La parte spaziale del fondamentale è nel livello $n=1$ dell&rsquo;oscillatore. Per il teorema del viriale, in un oscillatore l&rsquo;energia potenziale media è metà dell&rsquo;energia, quindi $\tfrac12\mu\omega^{2}\langle r^{2}\rangle=\tfrac12(n+\tfrac32)\hbar\omega$, e</p>
   $$\langle r^{2}\rangle=\Big(n+\frac32\Big)\frac{\hbar}{\mu\omega}=\frac52\,\frac{\hbar}{\mu\omega}=\frac{5\hbar}{m\omega}\qquad(n=1,\ \mu=m/2).$$
   <p>Il controllo diretto è l&rsquo;integrale di $\xi^{2}$ su $|\psi_{001}|^{2}$, che dà $\tfrac52$ in unità $\hbar/\mu\omega$. Il valore non dipende da $J$, perché tutti gli stati del livello hanno la stessa parte radiale. Attenzione alla massa: la lunghezza dell&rsquo;oscillatore è quella con la massa ridotta, e scrivere $\hbar/m\omega$ invece di $\hbar/\mu\omega$ dimezza il risultato.</p>`}
  ]}
]},
/* ---------------- 09 · COMPITO DEL 29-01-2019 ---------------- */
{ num:'09', title:'Un compito intero: la frequenza che dipende dallo spin (29-01-2019)', meta:'esame del 29 gennaio 2019 esercizio 1 · due fermioni in una dimensione · il potenziale che vale per il singoletto e per il tripletto · ogni livello di tripletto coincide con uno di singoletto · lo stato fissato dalle misure · l operatore che mescola spin e posizioni',
  blocchi:[
  {t:'prosa', title:'Il testo', tag:'esame', html:R`
  <p>Due particelle identiche di spin $\tfrac12$ vincolate su una retta, <i>«soggette, nel sistema del centro di massa, alla Hamiltoniana»</i></p>
  $$H=\frac{p^{2}}{2m}+2m\omega^{2}x^{2}\Big(1+\frac{2\,\mathbf S_{1}\cdot\mathbf S_{2}}{\hbar^{2}}\Big)^{2},$$
  <p><i>«dove $x=x_{1}-x_{2}$ è la distanza relativa, $p$ il suo momento coniugato e $m$ la massa ridotta»</i>. Attenzione alla convenzione: qui $m$ è già la massa ridotta. Il testo chiede (a) autovalori, degenerazioni e autofunzioni; (b) lo stato più generale compatibile con tre informazioni: una misura dell&rsquo;energia dà con certezza $\tfrac92\hbar\omega$, una misura di $S_{z}$ dà con certezza $0$, e $\langle\mathbf S^{2}\rangle=\tfrac23\hbar^{2}$; (c) lo stato unico che rende minimo il valor medio di $\hat O=S_{1z}x_{1}+S_{2z}x_{2}$, con $x_{1}$ e $x_{2}$ le coordinate nel sistema del centro di massa.</p>`},
  {t:'reveal', title:'(a) Il potenziale dipende dallo spin', tag:'soluzione', steps:[
   {label:'Il fattore di spin', body:R`
   <p>Il fattore fra parentesi è una funzione di $\mathbf S_{1}\cdot\mathbf S_{2}$, quindi è diagonale negli stati di spin totale definito. Sul tripletto $2\mathbf S_{1}\cdot\mathbf S_{2}/\hbar^{2}=\tfrac12$, sul singoletto $-\tfrac32$:</p>
   $$\Big(1+\frac12\Big)^{2}=\frac94\ \ (S=1),\qquad \Big(1-\frac32\Big)^{2}=\frac14\ \ (S=0).$$
   <p>Il quadrato non è un capriccio del testo: senza di esso il potenziale del singoletto sarebbe negativo, una parabola rovesciata, e non ci sarebbero stati legati. Con il quadrato il potenziale è $2m\omega^{2}x^{2}\cdot\tfrac94=\tfrac12m(3\omega)^{2}x^{2}$ sul tripletto e $2m\omega^{2}x^{2}\cdot\tfrac14=\tfrac12m\omega^{2}x^{2}$ sul singoletto: due oscillatori, di pulsazione $3\omega$ e $\omega$.</p>`},
   {label:'La statistica', body:R`
   <p>Lo scambio delle due particelle manda $x\to-x$ e scambia gli spin. Gli autostati dell&rsquo;oscillatore hanno parità $(-1)^{n}$, e la regola della tappa 07 in una dimensione dice: <b>$n$ pari con il singoletto, $n$ dispari con il tripletto</b>. Le energie permesse sono</p>
   $$E^{(S=0)}_{n}=\Big(n+\frac12\Big)\hbar\omega\ \ (n\ \text{pari}),\qquad E^{(S=1)}_{n}=3\Big(n+\frac12\Big)\hbar\omega\ \ (n\ \text{dispari}),$$
   <p>con autofunzioni $\varphi^{(\omega)}_{n}(x)\chi_{0,0}$ e $\varphi^{(3\omega)}_{n}(x)\chi_{1,M}$, dove $\varphi^{(\Omega)}_{n}$ è l&rsquo;autofunzione dell&rsquo;oscillatore di massa $m$ e pulsazione $\Omega$, e $M=1,0,-1$.</p>`},
   {label:'Le degenerazioni: una coincidenza che non è un caso', body:R`
   <p>I livelli di singoletto sono $\tfrac12,\tfrac52,\tfrac92,\tfrac{13}{2},\tfrac{17}{2},\tfrac{21}{2},\dots$ in unità $\hbar\omega$, quelli di tripletto $\tfrac92,\tfrac{21}{2},\tfrac{33}{2},\dots$. Ogni livello di tripletto cade su un livello di singoletto. Il tripletto con $n=2j+1$ ha energia $3(2j+\tfrac32)\hbar\omega=(6j+\tfrac92)\hbar\omega$, e il singoletto con $n=2k$ ha $(2k+\tfrac12)\hbar\omega$: coincidono per $k=3j+2$, perché</p>
   $$2(3j+2)+\frac12=6j+\frac92 .$$
   <p>Quindi i livelli $(2k+\tfrac12)\hbar\omega$ sono non degeneri se $k$ non è della forma $3j+2$, e quattro volte degeneri (un singoletto e tre stati di tripletto) se lo è: il primo è $\tfrac92\hbar\omega$, con $n=4$ di singoletto e $n=1$ di tripletto, il secondo $\tfrac{21}{2}\hbar\omega$. La coincidenza viene dal rapporto intero fra le due pulsazioni, ed è la ragione per cui il testo sceglie proprio il valore $\tfrac92\hbar\omega$ nella domanda (b).</p>`}
  ]},
  {t:'plot', title:'Due oscillatori, una scala di livelli condivisa',
   intro:R`<p>Potenziale del singoletto $\tfrac12x^{2}$ (blu) e del tripletto $\tfrac92x^{2}$ (arancio), con $x$ in unità $\sqrt{\hbar/m\omega}$ ed energie in unità $\hbar\omega$; le righe orizzontali sono i livelli permessi più bassi: singoletto $\tfrac12$ e $\tfrac52$ (verde), livello condiviso $\tfrac92$ (viola).</p>`,
   plots:[{kind:'func2d', xr:[-3.5,3.5], yr:[0,6], height:280, ticks:true,
     title:'compito 29-01-2019: potenziali e livelli',
     curves:[{f:'0.5*x*x', col:'#5aa9ff', width:2.4, label:'singoletto: omega'},
             {f:'4.5*x*x', col:'#ffb86b', width:2.4, label:'tripletto: 3 omega'},
             {f:'0.5', col:'#6bdc9b', width:1.4, label:'1/2 e 5/2 (singoletto)'},
             {f:'2.5', col:'#6bdc9b', width:1.4, label:''},
             {f:'4.5', col:'#c49bff', width:2.0, label:'9/2: singoletto n=4 e tripletto n=1'}],
     xlabel:'x = x1 - x2', ylabel:'E / hbar omega'}],
   leggi:R`<p><b>Che cosa guardare.</b> Il tripletto ha una buca tre volte più stretta in frequenza, nove volte più ripida. Il suo stato più basso permesso, $n=1$, sta a $\tfrac92$, alla stessa energia del quinto stato del singoletto, $n=4$. Lo stato $n=0$ di tripletto, che starebbe a $\tfrac32$, è vietato dalla statistica, e non c&rsquo;è nessuna riga lì.</p>
   <p><b>Che cosa impararne.</b> Lo spin non entra nell&rsquo;energia come un termine additivo ma come un parametro del moto relativo: decide in quale buca si muove la coordinata relativa. È il caso estremo di spin che non si separa, e si risolve lo stesso diagonalizzando prima lo spin, che commuta con la hamiltoniana, e poi il moto relativo, settore per settore.</p>`},
  {t:'reveal', title:'(b) e (c) Lo stato fissato dalle misure, e l operatore misto', tag:'soluzione', steps:[
   {label:'(b) Lo stato più generale', body:R`
   <p>Energia $\tfrac92\hbar\omega$ con certezza: lo stato sta nell&rsquo;autospazio quattro volte degenere, $\varphi^{(\omega)}_{4}\chi_{0,0}$ e $\varphi^{(3\omega)}_{1}\chi_{1,M}$. $S_{z}=0$ con certezza: restano $\varphi^{(\omega)}_{4}\chi_{0,0}$ e $\varphi^{(3\omega)}_{1}\chi_{1,0}$. Lo stato è</p>
   $$\Psi=a\,\varphi^{(\omega)}_{4}(x)\,\chi_{0,0}+b\,\varphi^{(3\omega)}_{1}(x)\,\chi_{1,0},\qquad |a|^{2}+|b|^{2}=1 .$$
   <p>$\mathbf S^{2}$ vale $0$ sul primo termine e $2\hbar^{2}$ sul secondo, quindi $\langle\mathbf S^{2}\rangle=2\hbar^{2}|b|^{2}=\tfrac23\hbar^{2}$ dà $|b|^{2}=\tfrac13$ e $|a|^{2}=\tfrac23$. A meno di una fase globale, lo stato più generale è</p>
   $$\Psi=\sqrt{\frac23}\,\varphi^{(\omega)}_{4}\,\chi_{0,0}+\frac{e^{i\delta}}{\sqrt3}\,\varphi^{(3\omega)}_{1}\,\chi_{1,0},$$
   <p>con una fase relativa $\delta$ che le tre informazioni non fissano.</p>`},
   {label:'(c) L’operatore nel centro di massa', body:R`
   <p>Nel sistema del centro di massa, con masse uguali, $x_{1}=x/2$ e $x_{2}=-x/2$, e l&rsquo;operatore diventa $\hat O=(S_{1z}-S_{2z})\,x/2$. In generale ci sarebbe anche il termine $(S_{1z}+S_{2z})X$, che sugli stati con $S_{z}=0$ dà comunque zero. L&rsquo;operatore $S_{1z}-S_{2z}$ scambia singoletto e tripletto con $S_{z}=0$: dalla base prodotto,</p>
   $$(S_{1z}-S_{2z})\,\chi_{0,0}=\hbar\,\chi_{1,0},\qquad (S_{1z}-S_{2z})\,\chi_{1,0}=\hbar\,\chi_{0,0}.$$
   <p>Sul primo termine di $\Psi$ l&rsquo;operatore produce un tripletto, ortogonale al primo termine; sul secondo un singoletto, ortogonale al secondo. Sopravvivono solo gli elementi incrociati, e</p>
   $$\langle\hat O\rangle=\hbar\,I\,\mathrm{Re}(a^{*}b),\qquad I=\int\varphi^{(\omega)}_{4}(x)\,x\,\varphi^{(3\omega)}_{1}(x)\,dx .$$`},
   {label:'L’integrale, e il minimo', body:R`
   <p>L&rsquo;integrale mescola due oscillatori di pulsazioni diverse, e non è zero: le due funzioni hanno parità opposta, e $x$ è dispari, quindi l&rsquo;integrando è pari. Con le convenzioni standard dei polinomi di Hermite, coefficiente direttivo positivo, e la lunghezza $\ell=\sqrt{\hbar/m\omega}$, si ottiene un <span class="str" data-str="integrale-gaussiano">integrale gaussiano</span>:</p>
   $$I=-\frac{9\sqrt2\;3^{1/4}}{64}\,\ell\approx-0{,}2617\,\ell .$$
   <p>Con $a=\sqrt{2/3}$ e $b=e^{i\delta}/\sqrt3$, $\mathrm{Re}(a^{*}b)=\tfrac{\sqrt2}{3}\cos\delta$. Siccome $I\lt0$, il minimo si ha per $\cos\delta=1$, cioè $\delta=0$, e vale</p>
   $$\langle\hat O\rangle_{\min}=-\frac{\sqrt2}{3}\cdot\frac{9\sqrt2\;3^{1/4}}{64}\,\hbar\ell=-\frac{3\cdot3^{1/4}}{32}\,\hbar\ell\approx-0{,}1234\,\hbar\sqrt{\frac{\hbar}{m\omega}} .$$
   <p>Lo stato è $\Psi=\sqrt{2/3}\,\varphi^{(\omega)}_{4}\chi_{0,0}+\varphi^{(3\omega)}_{1}\chi_{1,0}/\sqrt3$. Una nota onesta: il segno di $I$ dipende dal segno scelto per le autofunzioni. Con un&rsquo;altra convenzione di fase per $\varphi_{1}$ o $\varphi_{4}$ il minimo cade in $\delta=\pi$; il valore minimo di $\langle\hat O\rangle$ è lo stesso, ed è quello che il testo chiede di rendere minimo.</p>`}
  ]}
]},
/* ---------------- 10 · COMPITO DEL 25-06-2018 ---------------- */
{ num:'10', title:'Un compito intero: lo spin dedotto dalla parte spaziale (25-06-2018)', meta:'esame del 25 giugno 2018 esercizio 2 · la funzione d onda y f(r) chi · la statistica decide lo spin · L quadro e Lz · J quadro e Jz senza tavole · lo spin orbita che travasa momento angolare fra L e S',
  blocchi:[
  {t:'prosa', title:'Il testo', tag:'esame', html:R`
  <p>Due particelle identiche di spin $\tfrac12$; nel sistema del centro di massa la funzione d&rsquo;onda è</p>
  $$\psi(\mathbf r)=A\,y\,f(r)\,\chi,\qquad \mathbf r=\mathbf r_{1}-\mathbf r_{2},\qquad \int_{0}^{\infty}dr\,r^{4}|f(r)|^{2}=1,$$
  <p>con $\chi$ <i>«un&rsquo;autofunzione normalizzata dello spin totale $S$ lungo l&rsquo;asse $z$ con autovalore zero, ovvero $S_{z}\chi=0$»</i>. Le domande: (a) la costante $A$ e $\mathbf S^{2}\chi$; (b) i risultati di una misura di $\mathbf L^{2}$ e $L_{z}$, <i>«se $\mathbf L$ è il momento angolare totale nel sistema del centro di massa»</i>; (c) gli stessi per $\mathbf J^{2}$ e $J_{z}$, con $\mathbf J=\mathbf L+\mathbf S$; (d) l&rsquo;evoluzione con $H=H_{0}+\tfrac{\alpha}{\hbar}\mathbf L\cdot\mathbf S$, dove $H_{0}\psi=E_{0}\psi$; (e) le probabilità di $L_{z}$ in funzione del tempo, e gli istanti in cui $L_{z}=0$ è più probabile.</p>
  <p>Il testo non dice quale sia lo stato di spin, oltre a $S_{z}=0$. Lo dice la statistica, ed è la prima cosa da vedere: questo è un esercizio sulla regola della tappa 07 travestito da esercizio sul momento angolare.</p>`},
  {t:'reveal', title:'(a) e (b) Normalizzazione, spin, momento orbitale', tag:'soluzione', steps:[
   {label:'Lo spin lo decide la parità', body:R`
   <p>La parte spaziale è $y\,f(r)=r\sin\theta\sin\varphi\,f(r)$, e cambia segno per $\mathbf r\to-\mathbf r$: è dispari. Per due fermioni lo stato totale deve essere antisimmetrico, quindi la parte di spin deve essere simmetrica, cioè di tripletto. L&rsquo;unico stato di tripletto con $S_{z}=0$ è $\chi_{1,0}=(|{+}{-}\rangle+|{-}{+}\rangle)/\sqrt2$. Il singoletto, che pure ha $S_{z}=0$, è escluso. Quindi</p>
   $$\mathbf S^{2}\chi=S(S+1)\hbar^{2}\chi=2\hbar^{2}\chi .$$`},
   {label:'La costante A', body:R`
   <p>Il modulo quadro integrato su tutto lo spazio si fattorizza in una parte radiale e una angolare, perché $y=r\sin\theta\sin\varphi$:</p>
   $$\int|\psi|^{2}d^{3}r=|A|^{2}\int_{0}^{\infty}r^{4}|f|^{2}dr\int\sin^{2}\theta\sin^{2}\varphi\,d\Omega=|A|^{2}\cdot1\cdot\frac{4\pi}{3}.$$
   <p>Il fattore $r^{4}$ viene da $y^{2}=r^{2}\sin^{2}\theta\sin^{2}\varphi$ per lo $r^{2}$ dell&rsquo;elemento di volume: è per questo che il testo dà la normalizzazione di $f$ con $r^{4}$. Quindi $A=\sqrt{3/4\pi}$, a meno di una fase.</p>`},
   {label:'L quadro e Lz', body:R`
   <p>La dipendenza angolare $\sin\theta\sin\varphi$ si scrive con le <span class="str" data-str="armoniche-sferiche">armoniche sferiche</span> di $l=1$, usando $Y_{1,\pm1}=\mp\sqrt{3/8\pi}\,\sin\theta\,e^{\pm i\varphi}$:</p>
   $$\sin\theta\sin\varphi=i\sqrt{\frac{2\pi}{3}}\,\big(Y_{1,1}+Y_{1,-1}\big).$$
   <p>Una misura di $\mathbf L^{2}$ dà $2\hbar^{2}$ con certezza. Una misura di $L_{z}$ dà $+\hbar$ o $-\hbar$, con probabilità $\tfrac12$ ciascuno, e mai $0$. In coordinate cartesiane è evidente: $y$ è la combinazione di $x+iy$ e $x-iy$ con pesi uguali, e non contiene $z$.</p>`}
  ]},
  {t:'reveal', title:'(c) J quadro e Jz', tag:'soluzione', steps:[
   {label:'Lo stato nella base prodotto', body:R`
   <p>Lo stato di momento angolare, a meno della fase $i$, è</p>
   $$|\psi\rangle=\frac{1}{\sqrt2}\big(|m_{l}{=}1\rangle+|m_{l}{=}-1\rangle\big)\otimes|m_{s}{=}0\rangle,$$
   <p>nel prodotto tensoriale di $l=1$ e $S=1$. $J_{z}=L_{z}+S_{z}$ vale $+\hbar$ sul primo termine e $-\hbar$ sul secondo: probabilità $\tfrac12$ ciascuno.</p>`},
   {label:'J quadro, con la matrice', body:R`
   <p>Componendo $1$ con $1$ si ottengono $J=0,1,2$. $J=0$ è escluso, perché ha $J_{z}=0$ e lo stato ha solo $J_{z}=\pm\hbar$. Restano $J=1$ e $J=2$. Il valor medio di $\mathbf J^{2}$, calcolato con la matrice $\mathbf J=\mathbf L\otimes\mathbb 1+\mathbb 1\otimes\mathbf S$ di dimensione nove, è $4\hbar^{2}$. Se $p$ è la probabilità di $J=2$, deve essere $6p+2(1-p)=4$, quindi $p=\tfrac12$. Il controllo diretto è il proiettore su $J=2$, $\Pi_{2}=\mathbf J^{2}(\mathbf J^{2}-2\hbar^{2})/(6\hbar^{2}\cdot4\hbar^{2})$, che si annulla su $J=0$ e $J=1$ e vale uno su $J=2$: il suo valor medio è $\tfrac12$.</p>
   <p>Una misura di $\mathbf J^{2}$ dà $6\hbar^{2}$ o $2\hbar^{2}$, con probabilità $\tfrac12$ ciascuno. Con i <span class="str" data-str="clebsch-gordan">coefficienti di Clebsch-Gordan</span> si arriva allo stesso risultato: $|1\rangle|0\rangle=(|2,1\rangle+|1,1\rangle)/\sqrt2$ e $|-1\rangle|0\rangle=(|2,-1\rangle-|1,-1\rangle)/\sqrt2$. La matrice evita le tavole e non sbaglia i segni.</p>`}
  ]},
  {t:'reveal', title:'(d) e (e) L’evoluzione con lo spin-orbita', tag:'soluzione', steps:[
   {label:'L’operatore L per S', body:R`
   <p>Siccome $\mathbf L\cdot\mathbf S=\tfrac12(\mathbf J^{2}-\mathbf L^{2}-\mathbf S^{2})$, con $l=1$ e $S=1$ vale $\tfrac12(6-2-2)\hbar^{2}=\hbar^{2}$ su $J=2$ e $\tfrac12(2-2-2)\hbar^{2}=-\hbar^{2}$ su $J=1$. Le energie sono $E_{0}+\alpha\hbar$ e $E_{0}-\alpha\hbar$. Si potrebbe scrivere lo stato nella base di $J$, far evolvere le fasi e tornare indietro. C&rsquo;è una strada più corta, che non usa nessuna tavola.</p>`},
   {label:'Il blocco due per due', body:R`
   <p>$\mathbf L\cdot\mathbf S$ commuta con $J_{z}$, quindi non mescola i due termini dello stato, che hanno $J_{z}=+\hbar$ e $J_{z}=-\hbar$. Nel sottospazio con $J_{z}=+\hbar$ ci sono due stati, $|m_{l}{=}1,m_{s}{=}0\rangle$ e $|m_{l}{=}0,m_{s}{=}1\rangle$. Scrivendo $\mathbf L\cdot\mathbf S=L_{z}S_{z}+\tfrac12(L_{+}S_{-}+L_{-}S_{+})$, il termine $L_{z}S_{z}$ è nullo su tutti e due, e il termine con salita e discesa li scambia con coefficiente $\tfrac12\cdot\sqrt2\hbar\cdot\sqrt2\hbar=\hbar^{2}$. Nel blocco</p>
   $$\mathbf L\cdot\mathbf S=\hbar^{2}\begin{pmatrix}0&1\\1&0\end{pmatrix},$$
   <p>cioè $\hbar^{2}\sigma_{x}$, e la stessa matrice vale nel blocco con $J_{z}=-\hbar$. L&rsquo;evoluzione con $\tfrac{\alpha}{\hbar}\mathbf L\cdot\mathbf S=\alpha\hbar\,\sigma_{x}$ è una rotazione:</p>
   $$e^{-i\alpha t\sigma_{x}}|1,0\rangle=\cos(\alpha t)\,|1,0\rangle-i\sin(\alpha t)\,|0,1\rangle .$$`},
   {label:'Lo stato al tempo t, e le probabilità', body:R`
   <p>Mettendo insieme i due blocchi e la fase di $H_{0}$:</p>
   $$\psi(t)=e^{-iE_{0}t/\hbar}\,\frac{1}{\sqrt2}\Big[\cos(\alpha t)\big(|1,0\rangle+|-1,0\rangle\big)-i\sin(\alpha t)\big(|0,1\rangle+|0,-1\rangle\big)\Big],$$
   <p>con la parte radiale $f(r)$ invariata. Le probabilità di $L_{z}$ sono</p>
   $$P(L_{z}=\pm\hbar)=\frac{\cos^{2}(\alpha t)}{2},\qquad P(L_{z}=0)=\sin^{2}(\alpha t),$$
   <p>e $L_{z}=0$ è certo agli istanti $t=(2k+1)\pi/2\alpha$, con $k$ intero non negativo.</p>`},
   {label:'Che cosa sta succedendo', body:R`
   <p>Il momento angolare totale $J_{z}$ si conserva, ma l&rsquo;interazione spin-orbita lo travasa fra la parte orbitale e lo spin. A $t=0$ è tutto orbitale, $L_{z}=\pm\hbar$ e $S_{z}=0$; a $t=\pi/2\alpha$ è tutto di spin, $L_{z}=0$ e $S_{z}=\pm\hbar$. Lo stato di spin, che all&rsquo;inizio era $\chi_{1,0}$, diventa una combinazione di $\chi_{1,1}$ e $\chi_{1,-1}$, ma resta di tripletto: $\mathbf S^{2}$ commuta con $\mathbf L\cdot\mathbf S$, e $\mathbf L^{2}$ anche, quindi la parità del moto relativo e la simmetria dello spin restano quelle iniziali, come la statistica richiede. Spin e moto relativo si scambiano momento angolare, e intanto restano legati dalla regola di scambio.</p>`}
  ]},
  {t:'plot', title:'Il travaso di momento angolare',
   intro:R`<p>Probabilità in funzione di $\alpha t$: $L_{z}=0$, cioè $\sin^{2}\alpha t$ (blu); $L_{z}=+\hbar$, uguale a quella di $L_{z}=-\hbar$, cioè $\tfrac12\cos^{2}\alpha t$ (arancio).</p>`,
   plots:[{kind:'func2d', xr:[0,6.3], yr:[0,1.05], height:250, ticks:true,
     title:'compito 25-06-2018: probabilita di Lz nel tempo',
     curves:[{f:'Math.sin(x)*Math.sin(x)', col:'#5aa9ff', width:2.4, label:'P(Lz = 0)'},
             {f:'0.5*Math.cos(x)*Math.cos(x)', col:'#ffb86b', width:2.4, label:'P(Lz = +hbar) = P(Lz = -hbar)'}],
     xlabel:'alpha t', ylabel:'probabilita'}],
   leggi:R`<p><b>Che cosa guardare.</b> La somma della curva blu con il doppio della arancione fa uno in ogni istante. La curva blu tocca uno a $\alpha t=\pi/2$ e $3\pi/2$, la arancione si annulla negli stessi punti. Il periodo dell&rsquo;oscillazione è $\pi/\alpha$, metà del periodo delle fasi $e^{\mp i\alpha t}$, perché le probabilità dipendono dalla differenza delle due energie, $2\alpha\hbar$.</p>
   <p><b>Che cosa impararne.</b> È un&rsquo;oscillazione fra due stati, la stessa matematica di uno spin in un campo trasverso, dentro lo spazio $l=1$ per $S=1$. Riconoscere il blocco due per due è più veloce che passare per la base di $\mathbf J$, e serve in tutti gli esercizi in cui una perturbazione commuta con $J_{z}$ ma non con $L_{z}$.</p>`}
]},
/* ---------------- 11 · DOVE IL METODO SI FERMA ---------------- */
