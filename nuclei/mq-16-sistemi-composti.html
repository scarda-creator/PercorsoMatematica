<title>Movimento mq-16 — Sistemi composti: prodotto tensoriale, separazione delle variabili, problema a due corpi</title>

<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

<!-- La barra di casa: un nucleo senza di lei e' un vicolo cieco - si arrivava qui
     e l'unica uscita era il tasto indietro del browser, che dall'app installata
     sulla schermata Home non c'e'. Porta anche i due movimenti accanto, letti
     dall'indice: l'ordine non e' scritto nel nucleo e non puo' sfasarsi. -->
<script defer src="../nav-tengri.js"></script>

<style>
  :root{
    --bg:#0e1117; --panel:#161b22; --panel2:#1c232d; --border:#2b333d;
    --txt:#eef3f8; --muted:#b9c4d1; --accent:#4c8dff; --accent2:#8fb0ff;
    --ok:#2ea043; --okbg:#10331b; --warn:#d8a13a; --warnbg:#332a10;
    --gram:#5eead4; --grambg:#0f2a26;
    --pro:#b98cff; --probg:#1a1430; --proline:#2a2247; --proedge:#3a2d5c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    font-size:17px;line-height:1.55;}
  a{color:var(--accent2);}
  .banner{background:var(--panel2);border-bottom:1px solid var(--border);color:var(--muted);
    font-size:.8rem;font-weight:600;text-align:center;padding:8px 12px;letter-spacing:.3px;}
  .banner b{color:var(--accent2);}
  .shell{display:flex;max-width:1180px;margin:0 auto;align-items:flex-start;}

  /* ---- SIDEBAR ---- */
  .sidebar{width:280px;flex:0 0 280px;padding:20px 12px 60px;position:sticky;top:0;
    max-height:100vh;overflow-y:auto;border-right:1px solid var(--border);}
  .sidebar h2{font-size:.72rem;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);
    margin:18px 8px 8px;}
  .navitem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:none;
    background:transparent;color:var(--txt);padding:9px 10px;border-radius:8px;cursor:pointer;
    font-size:.9rem;transition:.12s;border:1px solid transparent;}
  .navitem:hover{background:var(--panel2);}
  .navitem.active{background:#13233f;border-color:var(--accent);color:#fff;}
  .navitem .dot{width:7px;height:7px;border-radius:50%;background:transparent;flex:0 0 7px;
    border:1px solid var(--border);}
  .navitem.seen .dot{background:var(--ok);border-color:var(--ok);}
  .navitem .nx{color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto;}

  /* ---- MAIN ---- */
  .main{flex:1 1 auto;min-width:0;padding:24px 30px 90px;max-width:860px;}
  h1{font-size:1.5rem;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:.92rem;margin:0 0 18px;}
  .sfhead{border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:8px;}
  .sfhead h1{font-size:1.55rem;}
  .meta{color:var(--muted);font-size:.82rem;margin-top:6px;}

  .section{margin:26px 0;}
  .section > h3{font-size:1.02rem;color:var(--accent2);margin:0 0 10px;
    display:flex;align-items:center;gap:10px;}
  .section > h3 .tag{font-size:.66rem;font-weight:700;letter-spacing:.4px;background:var(--panel2);
    border:1px solid var(--border);color:var(--muted);padding:2px 8px;border-radius:20px;
    text-transform:uppercase;}
  /* --- blocchi figura --- */
  .section > h3 .tag.plottag{background:#101f2e;border-color:#1f3c57;color:#7ab8e0;}
  .plot-intro{color:var(--muted);font-size:.95rem;margin:0 0 12px;}
  .plot-row{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;
    background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;}
  .plot-row.due .plot-box{flex:1 1 300px;min-width:280px;}
  .plot-box{max-width:560px;}
  .plot-leggi{margin-top:10px;background:var(--panel2);border:1px solid var(--border);
    border-left:3px solid #4a8fc7;border-radius:0 10px 10px 0;padding:11px 14px;
    font-size:.93rem;color:var(--muted);}
  .plot-leggi b{color:#7ab8e0;}
  .plot-err{color:#ff6b6b;font-size:.85rem;}
  .open-body{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
  .open-body p:first-child{margin-top:0;} .open-body p:last-child{margin-bottom:0;}
  .open-body ul{margin:.4em 0;padding-left:1.2em;} .open-body li{margin:.35em 0;}

  .note{background:var(--panel2);border-left:3px solid var(--muted);border-radius:6px;
    padding:9px 12px;margin:12px 0;font-size:.9rem;color:var(--muted);}
  .note b{color:#ff9d6b;}
  .note.warn{background:var(--warnbg);border-left-color:var(--warn);color:#e0b85a;}
  .note.warn b{color:#f0c25a;}

  /* ---- GRAMMATICA ---- */
  .gramwrap{background:var(--grambg);border:1px solid #1f4d47;border-radius:12px;padding:6px 6px;}
  table.gramtab{border-collapse:collapse;width:100%;font-size:.92rem;}
  table.gramtab td{padding:9px 12px;vertical-align:top;border-bottom:1px solid #17332e;}
  table.gramtab tr:last-child td{border-bottom:none;}
  table.gramtab td.gs{white-space:nowrap;color:var(--gram);width:1%;
    border-right:1px solid #17332e;font-variant-numeric:tabular-nums;}
  .section > h3 .tag.gramtag{background:var(--grambg);border-color:#1f4d47;color:var(--gram);}

  /* ---- STRUMENTI (repertorio condiviso: la scheda si apre DENTRO la frase) ----
     Nessun accento nuovo: riusa il verde della grammatica, perche' uno strumento
     richiamato e' grammatica gia' spiegata altrove, non una quinta specie di blocco. */
  .str{color:var(--gram);border-bottom:1px dashed var(--gram);cursor:pointer;}
  .str:hover{background:var(--grambg);}
  .str::after{content:"\2666";font-size:.62em;vertical-align:.42em;margin-left:2px;opacity:.8;}
  .str.aperto::after{content:"\2715";}
  .str.rotto{color:#ff6b6b;border-bottom-color:#ff6b6b;cursor:help;}
  /* la scheda e' uno SPAN in display:block, non un div: i rimandi cadono dentro
     <p>, <li> e celle di tabella, dove un div e' HTML illegale. */
  .strcard{display:block;margin:10px 0;background:var(--grambg);border:1px solid #1f4d47;
    border-left:3px solid var(--gram);border-radius:0 10px 10px 0;padding:10px 14px;font-size:.9rem;}
  .strcard .sh{display:block;font-size:.66rem;font-weight:700;letter-spacing:.5px;
    text-transform:uppercase;color:var(--gram);margin-bottom:7px;}
  .strcard .sr{display:block;margin:5px 0;}
  .strcard .sk{color:var(--gram);font-weight:600;}

  /* ---- PROLESSI (preannuncio fisico) ---- */
  .prowrap{background:var(--probg);border:1px solid var(--proedge);border-radius:12px;padding:4px 4px 8px;}
  .prohead{padding:11px 14px 4px;color:var(--pro);font-size:.72rem;font-weight:700;letter-spacing:.7px;
    text-transform:uppercase;}
  .pro-oggetto{padding:2px 14px 11px;color:var(--muted);font-size:.92rem;border-bottom:1px solid var(--proline);
    margin-bottom:2px;} .pro-oggetto b{color:var(--txt);}
  table.protab{border-collapse:collapse;width:100%;font-size:.92rem;}
  table.protab td{padding:10px 12px;vertical-align:top;border-bottom:1px solid var(--proline);}
  table.protab tr:last-child td{border-bottom:none;}
  table.protab td.pd{white-space:nowrap;color:var(--pro);width:1%;font-weight:700;font-size:.78rem;
    letter-spacing:.3px;text-transform:uppercase;border-right:1px solid var(--proline);line-height:1.3;}
  .pro-domanda{margin:8px 8px 2px;background:#140d26;border:1px solid var(--proedge);
    border-left:3px solid var(--pro);border-radius:8px;padding:10px 14px;font-size:.92rem;}
  .pro-domanda b{color:var(--pro);}
  .section > h3 .tag.protag{background:var(--probg);border-color:var(--proedge);color:var(--pro);}

  /* ---- REVEAL ---- */
  .rsteps{display:flex;flex-direction:column;gap:12px;}
  .rstep{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 18px;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .rlabel{font-size:.7rem;font-weight:700;letter-spacing:.4px;color:var(--accent);
    text-transform:uppercase;margin-bottom:8px;}
  .rstep p:first-of-type{margin-top:0;} .rstep p:last-child{margin-bottom:0;}
  .rstep ul{margin:.4em 0;padding-left:1.2em;}
  .testo{background:#13233f;border:1px solid #2b4877;border-radius:12px;padding:14px 18px;margin-bottom:14px;}
  .testo .src{display:block;font-size:.74rem;font-style:italic;color:var(--accent2);margin-bottom:8px;
    text-transform:uppercase;letter-spacing:.3px;}
  .esame-nota{font-size:.9rem;color:var(--muted);font-style:italic;margin-top:12px;padding-left:12px;
    border-left:3px solid var(--border);}

  .reveal-btn{background:var(--accent);color:#fff;border:none;padding:11px 18px;border-radius:10px;
    font-size:.95rem;font-weight:600;cursor:pointer;margin-top:14px;transition:.12s;}
  .reveal-btn:hover:not(:disabled){background:var(--accent2);}
  .reveal-btn.small{padding:7px 14px;font-size:.85rem;margin-top:0;background:var(--panel2);
    color:var(--accent2);border:1px solid var(--border);}
  .reveal-btn.small:hover:not(:disabled){border-color:var(--accent);}
  .reveal-btn:disabled,.reveal-btn.done{background:var(--panel2);color:var(--muted);
    border:1px solid var(--border);cursor:default;}

  /* ---- COLLAUDO ---- */
  .collaudo-item{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 18px;margin-bottom:12px;}
  .cq{margin-bottom:10px;}
  .ca{margin-top:12px;background:var(--okbg);border:1px solid #235c33;border-radius:8px;
    padding:10px 14px;font-size:.94rem;}
  .ca b{color:#5fd980;}

  /* ---- PREV / NEXT ---- */
  .prevnext{display:flex;justify-content:space-between;gap:12px;margin-top:40px;
    border-top:1px solid var(--border);padding-top:20px;}
  .pnbtn{flex:1 1 0;background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:12px 16px;cursor:pointer;color:var(--txt);text-align:left;transition:.14s;font:inherit;}
  .pnbtn:hover{border-color:var(--accent);background:var(--panel2);}
  .pnbtn.next{text-align:right;}
  .pnbtn .k{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .pnbtn .t{font-weight:600;color:var(--accent2);}
  .pnbtn:disabled{opacity:.35;cursor:default;border-color:var(--border);background:var(--panel);}

  code{background:var(--panel2);border:1px solid var(--border);border-radius:5px;
    padding:1px 5px;font-size:.85em;color:var(--accent2);}
  .katex{font-size:1.02em;color:var(--txt);} .katex-display{margin:.5em 0;overflow-x:auto;overflow-y:hidden;}

  @media(max-width:860px){
    .shell{flex-direction:column;}
    .sidebar{width:100%;flex:none;position:static;max-height:none;border-right:none;
      border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:4px;}
    .sidebar h2{width:100%;} .navitem{width:auto;}
    .main{padding:20px 16px 80px;}
  }
</style>
</head>

<script>
"use strict";
const R = String.raw;

function typeset(el){
  if(el && window.renderMathInElement){
    try{ renderMathInElement(el,{delimiters:[
      {left:'$$',right:'$$',display:true},
      {left:'$',right:'$',display:false}
    ],throwOnError:false}); }catch(e){}
  }
}
function elFromHTML(html){ var d=document.createElement('div'); d.innerHTML=html; return d; }

/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un
   rimando scritto nella prosa:

       <span class="str" data-str="serie-geometrica">la serie geometrica</span>

   Le schede citate da questo nucleo sono cucite qui sotto dal montaggio
   (assembla-nucleo.js): la pagina resta autosufficiente — niente fetch,
   niente sottocartelle da pubblicare — e un rimando a una scheda che non
   esiste FERMA la costruzione invece di arrivare in pagina rotto.
   Apertura: lo stesso gesto del collaudo (si clicca, il pannello compare,
   si typeset una volta sola), portato dentro la frase.
   =================================================================== */
var CORSO = 'meccanica-quantistica';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["prodotto-tensoriale"] = {"nome":"Prodotto tensoriale","riga":"Lo spazio di due sistemi e' $\\mathcal H_1\\otimes\\mathcal H_2$, di dimensione pari al PRODOTTO delle due e non alla somma, con base fatta dai prodotti degli elementi delle due basi.","serve":"E' il motivo per cui la meccanica quantistica non e' una teoria di particelle indipendenti messe accanto. La dimensione cresce come il prodotto, quindi la stragrande maggioranza degli stati non si scrive come prodotto di due stati singoli: quelli che non si scrivono cosi' sono gli stati entangled, e sono la regola, non l'eccezione.","esempio":"Due spin un mezzo: ogni fattore ha dimensione due, il prodotto ne ha $2\\cdot2=4$. Gli stati fattorizzati sono parametrizzati da due punti sulla sfera di Bloch, cioe' da quattro parametri reali, mentre lo spazio totale ne ha $2\\cdot4-2=6$: restano due dimensioni di stati che non si fattorizzano, e il singoletto e' uno di quelli.","debito":"la matrice densita' ridotta e la quantificazione dell'entanglement (entropia di von Neumann) non stanno qui: questa scheda da' la struttura, non la misura.","controllo":[{"tipo":"uguale","sinistra":"2*2","vale":"4","dove":"esempio","appare":"2\\cdot2=4"},{"tipo":"uguale","sinistra":"2*4-2","vale":"6","dove":"esempio","appare":"2\\cdot4-2=6"}],"qui":{},"pieno":null};
STRUM["commutatore"] = {"nome":"Commutatore","riga":"$[\\hat A,\\hat B]=\\hat A\\hat B-\\hat B\\hat A$, antisimmetrico, con la regola di Leibniz $[\\hat A,\\hat B\\hat C]=[\\hat A,\\hat B]\\hat C+\\hat B[\\hat A,\\hat C]$ e la relazione canonica $[\\hat x,\\hat p]=i\\hbar$.","serve":"E' la misura di quanto due operazioni dipendano dall'ordine, e qui l'ordine e' fisica: due osservabili che non commutano non hanno una base comune di autostati, quindi non si misurano insieme con precisione arbitraria. Quasi ogni conto che sembra magico — l'algebra del momento angolare, gli operatori di salita e discesa, il teorema di Ehrenfest — e' una manipolazione di commutatori fatta con quelle regole e nient'altro.","esempio":"Dalla regola di Leibniz, $[\\hat x,\\hat p^{2}]=[\\hat x,\\hat p]\\hat p+\\hat p[\\hat x,\\hat p]=2i\\hbar\\hat p$. E' il conto che fa uscire il teorema di Ehrenfest: la meccanica classica ricompare come relazione fra valori medi, e ricompare perche' quel commutatore vale proprio $2i\\hbar\\hat p$.","debito":"l'identita' di Jacobi si enuncia e non si dimostra; la corrispondenza fra commutatore e parentesi di Poisson — che e' l'idea di Dirac e non un'analogia decorativa — sta in mq-07, e li' va letta per intero.","controllo":[{"tipo":"uguale","sinistra":"I*hbar*p + p*I*hbar","vale":"2*I*hbar*p","ipotesi":{"hbar":"positive","p":"real"},"dove":"esempio","appare":"2i\\hbar\\hat p"},{"tipo":"simbolico","dove":"riga","appare":"[\\hat x,\\hat p]=i\\hbar","perche":"e' la relazione di commutazione canonica, il POSTULATO da cui discende il resto della teoria: non si dimostra, si assume, ed e' cio' che separa la meccanica quantistica dalla classica"}],"qui":{},"pieno":null};
STRUM["traccia"] = {"nome":"Traccia di un operatore","riga":"La traccia e' la somma degli elementi diagonali, $\\operatorname{tr}\\hat A=\\sum_i\\langle i|\\hat A|i\\rangle$, e non dipende dalla base ortonormale scelta perche' e' invariante per permutazione ciclica: $\\operatorname{tr}(\\hat A\\hat B)=\\operatorname{tr}(\\hat B\\hat A)$, da cui $\\operatorname{tr}(\\hat U^{\\dagger}\\hat A\\hat U)=\\operatorname{tr}\\hat A$.","serve":"E' il modo di estrarre un numero da un operatore senza privilegiare una rappresentazione. Il valor medio di un'osservabile su uno stato si scrive $\\langle A\\rangle=\\operatorname{tr}(\\rho\\hat A)$ con $\\rho=|\\psi\\rangle\\langle\\psi|$, e questa forma — a differenza di $\\langle\\psi|\\hat A|\\psi\\rangle$ — vale identica per gli stati misti, dove $\\rho$ non e' piu' un proiettore: e' la porta verso la matrice densita' e la decoerenza.","esempio":"Per $A=\\begin{pmatrix}1&2\\\\3&4\\end{pmatrix}$ e $B=\\begin{pmatrix}0&1\\\\1&0\\end{pmatrix}$, pur essendo $AB\\neq BA$, le due tracce coincidono: $AB=\\begin{pmatrix}2&1\\\\4&3\\end{pmatrix}$ da' $\\operatorname{tr}(AB)=2+3=5$, mentre $BA=\\begin{pmatrix}3&4\\\\1&2\\end{pmatrix}$ da' $\\operatorname{tr}(BA)=3+2=5$. La traccia di un proiettore di rango uno vale $1$, e in generale la traccia di un proiettore e' la dimensione del sottospazio su cui proietta.","debito":"la traccia di un operatore in dimensione infinita esiste solo per la classe degli operatori a traccia (totalmente continui), e la costruzione rigorosa — $\\operatorname{tr}(\\hat A^{\\dagger}\\hat A)=\\sum_\\mu\\|\\hat A\\phi_\\mu\\|^2$ indipendente dalla base, von Neumann cap. II.11 — qui si cita. Si lavora col caso in cui la somma converge.","controllo":[{"tipo":"uguale","sinistra":"(Matrix([[1,2],[3,4]])*Matrix([[0,1],[1,0]])).trace()","vale":"5","dove":"esempio","appare":"\\operatorname{tr}(AB)=2+3=5"},{"tipo":"uguale","sinistra":"(Matrix([[0,1],[1,0]])*Matrix([[1,2],[3,4]])).trace()","vale":"5","dove":"esempio","appare":"\\operatorname{tr}(BA)=3+2=5"},{"tipo":"uguale","sinistra":"Matrix([[1,2],[3,4]])*Matrix([[0,1],[1,0]])","vale":"Matrix([[2,1],[4,3]])","dove":"esempio","appare":"AB=\\begin{pmatrix}2&1\\\\4&3\\end{pmatrix}"},{"tipo":"uguale","sinistra":"Matrix([[0,1],[1,0]])*Matrix([[1,2],[3,4]])","vale":"Matrix([[3,4],[1,2]])","dove":"esempio","appare":"BA=\\begin{pmatrix}3&4\\\\1&2\\end{pmatrix}"}],"qui":{},"pieno":null};
STRUM["matrici-di-pauli"] = {"nome":"Matrici di Pauli","riga":"Sono le tre matrici $2\\times2$ hermitiane a traccia nulla il cui quadrato e' l'identita' e il cui commutatore riproduce l'algebra del momento angolare, da cui lo spin $\\hat S_i=\\tfrac{\\hbar}{2}\\sigma_i$.","serve":"Sono la rappresentazione piu' piccola non banale del momento angolare, e insieme all'identita' formano una base di tutte le matrici due per due hermitiane: qualunque osservabile di un sistema a due stati e' una combinazione dell'identita' e delle tre. Ogni conto di spin un mezzo — Stern-Gerlach, precessione, risonanza magnetica, qubit — si riduce alla loro algebra.","esempio":"Siccome il quadrato di una combinazione unitaria delle tre e' l'identita', qualunque esponenziale collassa: l'operatore di rotazione dello spinore diventa $\\cos(\\theta/2)$ per l'identita' meno $i\\sin(\\theta/2)$ per la combinazione. Il mezzo nell'angolo e' la ragione per cui una rotazione di un giro intero cambia segno allo stato, perche' $\\cos(\\pi)=-1$.","debito":"la costruzione generale delle rappresentazioni di SU(2) e il suo legame con SO(3) stanno nel movimento sul momento angolare; qui c'e' il caso di spin un mezzo con le sue regole di calcolo.","controllo":[{"tipo":"uguale","sinistra":"cos(2*pi/2)","vale":"-1","dove":"esempio","appare":"\\cos(\\pi)=-1"},{"tipo":"uguale","sinistra":"cos(pi/3)**2+sin(pi/3)**2","vale":"1","dove":"esempio","appare":"\\sin(\\theta/2)"}],"qui":{},"pieno":null};
STRUM["clebsch-gordan"] = {"nome":"Coefficienti di Clebsch-Gordan","riga":"Sono il cambio di base fra quella disaccoppiata $|j_1m_1\\rangle|j_2m_2\\rangle$ e quella accoppiata $|JM\\rangle$, dove $J$ va da $|j_1-j_2|$ a $j_1+j_2$ a passi di uno e il coefficiente si annulla se $M$ non vale $m_1+m_2$.","serve":"Servono ogni volta che due momenti angolari si sommano — spin-orbita, due elettroni, spin nucleare ed elettronico — e serve la base in cui il momento totale e' definito. I coefficienti si leggono su tavola; cio' che va saputo a memoria e' quali valori del totale escono, e che senza la somma delle proiezioni il coefficiente e' zero.","esempio":"Due spin un mezzo danno un singoletto e un tripletto. Il conteggio torna, ed e' il primo controllo da fare su ogni composizione: $2\\cdot2=4$ stati nella base disaccoppiata, e $1+3=4$ in quella accoppiata. La dimensione non cambia mai, perche' e' solo un cambio di base.","debito":"le convenzioni di fase (Condon-Shortley) e le formule di ricorrenza non stanno qui. Le tavole dei vari testi differiscono proprio sulle fasi: quando se ne usa una, va dichiarata quale.","controllo":[{"tipo":"uguale","sinistra":"2*2","vale":"4","dove":"esempio","appare":"2\\cdot2=4"},{"tipo":"uguale","sinistra":"1+3","vale":"4","dove":"esempio","appare":"1+3=4"}],"qui":{},"pieno":null};
STRUM["simmetrie"] = {"nome":"Simmetrie","riga":"L'insieme delle trasformazioni che lasciano identica la sorgente, e che perciò devono lasciare identico anche il campo che ne nasce.","serve":"È il ragionamento che decide la FORMA del campo prima di calcolarlo, e senza il quale la legge di Gauss non serve a niente: Gauss dà un solo numero — il flusso totale — e da un numero si ricava un campo soltanto se si sa già in che direzione punta e da quali variabili dipende. L'argomento ha una forma sola: se una trasformazione lascia identica la distribuzione di carica, lascia identico il campo; quindi ogni componente che quella trasformazione cambierebbe deve essere nulla, e ogni variabile che essa sposta non può comparire.","esempio":"Per un filo infinito uniformemente carico, la traslazione lungo il filo e la rotazione attorno a esso lasciano la carica identica: $\\mathbf E$ non può dipendere né da $z$ né dall'angolo. La riflessione nel piano perpendicolare al filo manderebbe $E_z$ in $-E_z$ lasciando uguale la sorgente, quindi $E_z=0$; resta la sola componente radiale $E_r(r)$. Solo a quel punto il cilindro coassiale è la superficie giusta, e Gauss dà $E_r\\cdot 2\\pi rL=\\dfrac{\\lambda L}{\\varepsilon_0}$, da cui $E_r=\\dfrac{\\lambda}{2\\pi\\varepsilon_0 r}$.","qui":{"meccanica-quantistica":{"serve":"Qui l'argomento di simmetria non decide la forma di un campo: decide la forma degli OPERATORI, ed è il modo in cui questo corso costruisce la teoria. Lo schema è lo stesso — una trasformazione che lascia identica la situazione fisica deve lasciare identica la descrizione — ma la conseguenza è più forte: ogni trasformazione di simmetria continua è realizzata da un operatore unitario, ogni operatore unitario continuo è l'esponenziale di un generatore autoaggiunto, e quel generatore è una quantità conservata. Impulso, momento angolare ed energia non si postulano: sono i generatori delle traslazioni, delle rotazioni e delle traslazioni temporali.","esempio":"Lo spazio è omogeneo, quindi traslare un sistema isolato non ne cambia la fisica: $\\hat U(a)=e^{-ia\\hat P/\\hbar}$ deve commutare con $\\hat H$. Al primo ordine in $a$ questo dà $[\\hat P,\\hat H]=0$, e quindi $\\dfrac{d}{dt}\\langle \\hat P\\rangle=0$: l'omogeneità dello spazio è la conservazione dell'impulso, e il passaggio da una all'altra è di due righe."}},"debito":"nessun nucleo del percorso tratta l'argomento di simmetria come strumento a sé: qui c'è la forma dell'argomento e non la sua giustificazione, che è di teoria dei gruppi e sta fuori dal percorso costruito finora. Quello che il percorso copre è il pezzo di destra — l'integrale di flusso, nel nucleo 03 tappa 04 — non il pezzo di sinistra che decide quale superficie scegliere.","controllo":[{"tipo":"uguale","sinistra":"(lam/(2*pi*e0*r))*2*pi*r*L","vale":"lam*L/e0","dove":"esempio","appare":"\\dfrac{\\lambda L}{\\varepsilon_0}"}]};
STRUM["polinomi-di-hermite"] = {"nome":"Polinomi di Hermite","riga":"$H_n$ sono le soluzioni polinomiali dell'equazione di Hermite, con $H_0=1$, $H_1=2\\xi$, $H_2=4\\xi^{2}-2$ e $H_3=8\\xi^{3}-12\\xi$, ortogonali con peso $e^{-\\xi^{2}}$.","serve":"Sono la parte polinomiale delle autofunzioni dell'oscillatore armonico. Il grado del polinomio da' il numero di nodi, e quindi l'ordine dei livelli: l'ennesimo stato eccitato ha esattamente ennesimi zeri. La parita' si alterna con il grado, ed e' il motivo per cui meta' degli elementi di matrice si annulla senza fare il conto.","esempio":"Il polinomio di grado due si annulla dove $4\\xi^{2}=2$, cioe' in due punti: due nodi, come vuole il grado. E la sua parita' pari fa si' che l'elemento di matrice della posizione fra lo stato fondamentale e il secondo eccitato sia nullo, perche' l'integrando e' dispari — una regola di selezione ottenuta guardando la simmetria invece di integrare.","debito":"la formula di Rodrigues, la funzione generatrice e le relazioni di ricorrenza stanno nei movimenti di Metodi sulle funzioni speciali; qui c'e' cio' che serve per leggere le autofunzioni.","controllo":[{"tipo":"uguale","sinistra":"4*(1/sqrt(2))**2","vale":"2","dove":"esempio","appare":"4\\xi^{2}=2"},{"tipo":"derivata","espr":"4*x**2-2","rispetto":["x"],"vale":"8*x","ipotesi":{"x":"real"},"dove":"riga","appare":"4\\xi^{2}-2"},{"tipo":"integrale","espr":"x*exp(-x**2)","var":"x","da":"-oo","a":"oo","vale":"0","dove":"esempio","appare":"l'integrando e' dispari"}],"qui":{},"pieno":null};
STRUM["armoniche-sferiche"] = {"nome":"Armoniche sferiche","riga":"$Y_\\ell^{m}(\\theta,\\varphi)$ sono le autofunzioni simultanee di $\\hat L^{2}$, con autovalore $\\hbar^{2}\\ell(\\ell+1)$, e di $\\hat L_z$, con autovalore $\\hbar m$, ortonormali e complete sulla sfera.","serve":"Sono la parte angolare di ogni problema a simmetria sferica: appena il potenziale dipende solo dalla distanza, l'equazione si separa e la dipendenza angolare e' sempre una di queste, qualunque sia il potenziale. Cio' che cambia da problema a problema e' solo la parte radiale — per questo si imparano una volta e si riusano sempre.","esempio":"Per ogni $\\ell$ ci sono $2\\ell+1$ valori di $m$: e' la degenerazione essenziale di ogni livello a simmetria sferica, e non dipende dal potenziale. Per $\\ell=2$ vengono $2\\cdot2+1=5$ stati. La prima armonica e' costante, ed e' il motivo per cui lo stato fondamentale di un potenziale centrale e' sempre sfericamente simmetrico.","debito":"la costruzione esplicita dai polinomi di Legendre associati, e le formule di ricorrenza, non stanno qui: si usano gli enunciati e l'ortonormalita'.","controllo":[{"tipo":"uguale","sinistra":"2*2+1","vale":"5","dove":"esempio","appare":"2\\cdot2+1=5"},{"tipo":"simbolico","dove":"riga","appare":"\\hbar^{2}\\ell(\\ell+1)","perche":"e' l'autovalore del quadrato del momento angolare, che discende dall'algebra dei commutatori e non dalla forma esplicita delle armoniche. Si enuncia qui perche' e' cio' che le definisce"}],"qui":{},"pieno":null};
STRUM["integrale-gaussiano"] = {"nome":"Integrale gaussiano","riga":"$\\displaystyle\\int_{-\\infty}^{+\\infty} e^{-ax^{2}}\\,dx=\\sqrt{\\pi/a}$ per $a\\gt 0$, e $\\displaystyle\\int_{-\\infty}^{+\\infty} x^{2}e^{-ax^{2}}\\,dx=\\tfrac12\\sqrt{\\pi/a^{3}}$.","serve":"E' l'unico integrale che serve davvero sapere a memoria in meccanica statistica, perche' l'energia cinetica e' quadratica nell'impulso e quindi ogni integrazione sugli impulsi e' una gaussiana. Il trucco della dimostrazione — elevare al quadrato e passare in coordinate polari — vale la pena di vederlo una volta: e' il motivo per cui compare un $\\pi$ in una formula che di cerchi non parla.","esempio":"Da $I^{2}=\\iint e^{-a(x^{2}+y^{2})}dx\\,dy=\\int_0^\\infty 2\\pi r\\,e^{-ar^{2}}dr=\\pi/a$ segue $I=\\sqrt{\\pi/a}$. I momenti superiori si ottengono derivando rispetto ad $a$ sotto il segno: $-\\partial_a I=\\int x^{2}e^{-ax^{2}}dx=\\tfrac12\\sqrt{\\pi}\\,a^{-3/2}$. Derivare rispetto a un parametro e' piu' rapido che integrare per parti, e funziona per tutti i momenti pari.","debito":"il caso di esponente immaginario — l'integrale di Fresnel $\\int e^{iax^{2}}dx$, che si ottiene ruotando il cammino nel piano complesso e che in meccanica quantistica e' il propagatore libero — non sta qui: in tutte le gaussiane di questo percorso $a$ e' reale e positivo, e la convergenza non e' in discussione.","controllo":[{"tipo":"integrale","espr":"exp(-a*x**2)","var":"x","da":"-oo","a":"oo","vale":"sqrt(pi/a)","ipotesi":{"a":"positive","x":"real"},"dove":"riga","appare":"\\sqrt{\\pi/a}"},{"tipo":"integrale","espr":"x**2*exp(-a*x**2)","var":"x","da":"-oo","a":"oo","vale":"sqrt(pi/a**3)/2","ipotesi":{"a":"positive","x":"real"},"dove":"riga","appare":"\\tfrac12\\sqrt{\\pi/a^{3}}"},{"tipo":"integrale","espr":"2*pi*r*exp(-a*r**2)","var":"r","da":"0","a":"oo","vale":"pi/a","ipotesi":{"a":"positive","r":"positive"},"dove":"esempio","appare":"2\\pi r\\,e^{-ar^{2}}dr=\\pi/a"},{"tipo":"integrale","espr":"x**2*exp(-a*x**2)","var":"x","da":"-oo","a":"oo","vale":"sqrt(pi)*a**Rational(-3,2)/2","ipotesi":{"a":"positive","x":"real"},"dove":"esempio","appare":"\\tfrac12\\sqrt{\\pi}\\,a^{-3/2}"},{"tipo":"integrale","espr":"exp(-b*p**2/(2*m))","var":"p","da":"-oo","a":"oo","vale":"sqrt(2*pi*m/b)","ipotesi":{"b":"positive","m":"positive","p":"real"},"dove":"qui.meccanica-statistica.esempio","appare":"\\sqrt{2\\pi m/\\beta}"},{"tipo":"uguale","sinistra":"V/(h/sqrt(2*pi*m*k*T))**3","vale":"V*(2*pi*m*k*T)**Rational(3,2)/h**3","ipotesi":{"V":"positive","h":"positive","m":"positive","k":"positive","T":"positive"},"dove":"qui.meccanica-statistica.esempio","appare":"V/\\lambda^{3}"},{"tipo":"uguale","sinistra":"integrate(p**2/(2*m)*exp(-b*p**2/(2*m)),(p,-oo,oo))/integrate(exp(-b*p**2/(2*m)),(p,-oo,oo))","vale":"1/(2*b)","ipotesi":{"b":"positive","m":"positive","p":"real"},"dove":"qui.meccanica-statistica.esempio","appare":"1/2\\beta=\\tfrac12 kT"}],"pieno":null,"qui":{"meccanica-statistica":{"serve":"La funzione di partizione di una particella libera e' un prodotto di tre gaussiane negli impulsi, e da li' esce la lunghezza d'onda termica $\\lambda=h/\\sqrt{2\\pi m k T}$ — che e' la grandezza con cui si misura quando un gas smette di essere classico.","esempio":"$\\int e^{-\\beta p^{2}/2m}dp=\\sqrt{2\\pi m/\\beta}$, quindi $Z_{1}=\\dfrac{V}{h^{3}}(2\\pi mkT)^{3/2}=V/\\lambda^{3}$, che e' la stessa cosa scritta due volte perche' $\\lambda=h/\\sqrt{2\\pi mkT}$. Lo stesso integrale col peso $p^{2}$ da' $\\langle p^{2}/2m\\rangle=1/2\\beta=\\tfrac12 kT$ per grado di liberta': l'equipartizione non e' un principio a parte, e' questo integrale."}}};
STRUM["cambio-di-variabile"] = {"nome":"Cambio di variabile in una densità","riga":"Una densità non si trasforma sostituendo ma porta il jacobiano: se $y=f(x)$ allora $p_Y(y)=\\sum_i p_X(x_i)\\,/\\,|f'(x_i)|$, sommato su tutti i rami $x_i$ con $f(x_i)=y$.","serve":"È l'unico punto in cui una densità si comporta diversamente da una funzione, ed è l'errore che si ripete. Ciò che è invariante è la probabilità dell'evento, $p_Y(y)|dy|=p_X(x)|dx|$: la densità no, perché è una probabilità per unità di qualcosa, e passando da $x$ a $y$ quell'unità si dilata o si comprime. Scrivere $p_Y(y)=p_X(x(y))$ e basta è attraente e sbagliato. Si scova senza rifare il conto con due prove da cinque secondi: la normalizzazione non torna, e le dimensioni restano quelle della variabile di partenza.","esempio":"Una particella uniforme su un disco di raggio $R$: $p(x,y)=1/(\\pi R^2)$. Passando alla sola distanza dal centro, il jacobiano è l'elemento d'area radiale $2\\pi r$, e resta $p(r)=2r/R^2$ su $[0,R]$, che infatti si normalizza a $1$. Il valor medio è $\\langle r\\rangle=2R/3$ — non $R/2$, che è la risposta di chi tratta $r$ come uniforme. La differenza fra i due numeri è esattamente il fattore $r$, cioè il fatto che lontano dal centro c'è più area.","pieno":{"file":"ms-03-probabilita.html","tappa":"01","come":"la regola dedotta dall'invarianza della probabilità, i rami molteplici e il caso radiale, nel movimento ms-03 di Meccanica Statistica"},"qui":{"meccanica-statistica":{"serve":"È metà della domanda più frequente dello scritto: «calcolare la densità di probabilità dell'energia di singola particella», «la densità di particelle $\\rho(r)$». L'altra metà è la marginalizzazione. Le scritture $d^2r=2\\pi r\\,dr$ e $d^3r=4\\pi r^2dr$ non sono formule da ricordare: sono questo cambio di variabile con gli angoli già integrati, e saperlo deducere è ciò che salva quando la simmetria è cilindrica invece che sferica. Attenzione al doppio jacobiano: $p(r)$ è una densità rispetto a $r$, $\\rho(r)$ è una densità per unità di volume, e fra le due ce n'è un altro.","esempio":"L'energia cinetica in due dimensioni. La misura radiale nel piano degli impulsi è la derivata dell'area del disco, $2\\pi p$; la sostituzione $\\varepsilon=p^2/2m$ ha $d\\varepsilon/dp=p/m$, e il jacobiano cancella esattamente il fattore $p$. Per questo in $d=2$ la densità dell'energia è l'esponenziale pura $\\beta e^{-\\beta\\varepsilon}$, senza prefattore, mentre in $d=3$ resta un $\\sqrt{\\varepsilon}$. Da quel solo fattore dipendono tutte le differenze qualitative fra i gas quantistici in dimensioni diverse."}},"controllo":[{"tipo":"integrale","espr":"2*r/R**2","var":"r","da":"0","a":"R","vale":"1","ipotesi":{"r":"positive","R":"positive"},"dove":"esempio","appare":"p(r)=2r/R^2"},{"tipo":"integrale","espr":"r*2*r/R**2","var":"r","da":"0","a":"R","vale":"2*R/3","ipotesi":{"r":"positive","R":"positive"},"dove":"esempio","appare":"2R/3"},{"tipo":"derivata","espr":"pi*p**2","rispetto":["p"],"vale":"2*pi*p","ipotesi":{"p":"positive"},"dove":"qui.meccanica-statistica.esempio","appare":"2\\pi p"},{"tipo":"derivata","espr":"p**2/(2*m)","rispetto":["p"],"vale":"p/m","ipotesi":{"p":"positive","m":"positive"},"dove":"qui.meccanica-statistica.esempio","appare":"p/m"},{"tipo":"integrale","espr":"b*exp(-b*e)","var":"e","da":"0","a":"oo","vale":"1","ipotesi":{"b":"positive","e":"positive"},"dove":"qui.meccanica-statistica.esempio","appare":"\\beta e^{-\\beta\\varepsilon}"}]};
STRUM["elettronvolt"] = {"nome":"Elettronvolt","riga":"L'energia che un elettrone acquista attraversando una differenza di potenziale di un volt: $1\\ \\mathrm{eV}=1{,}602\\cdot10^{-19}$ J; divisa per $c^{2}$ è una massa, $1\\ \\mathrm{eV}/c^{2}=1{,}783\\cdot10^{-36}$ kg.","serve":"A leggere senza conversioni le tabelle in cui la fisica delle particelle e l'astrofisica scrivono le masse a riposo come energie — l'elettrone 0,511 MeV, il protone 938 MeV, il bosone di Higgs 125 GeV. La scelta non è una bizzarria di notazione: in un processo la quantità che si conserva è l'energia, e scrivere la massa già in energia dice a colpo d'occhio quali reazioni sono possibili e quante ne resta per l'energia cinetica o per i fotoni. L'elettronvolt ha anche un secondo mestiere, e in astrofisica è il più usato dei due: convertito in temperatura tramite $k_BT$ dà la scala termica a cui un processo di quella energia diventa frequente, e questo è ciò che permette di dire a che punto della storia dell'universo o a che profondità di una stella un certo processo si accende.","esempio":"Dalla massa del protone espressa come energia, $938{,}3$ MeV, si ricavano i chilogrammi in un passaggio: $m_p=938{,}3\\cdot10^{6}\\cdot1{,}783\\cdot10^{-36}=1{,}673\\cdot10^{-27}$ kg, che è il valore stampato in calce al foglio d'esame. Sul versante termico, $T=\\dfrac{1{,}602\\cdot10^{-19}}{1{,}381\\cdot10^{-23}}=11600$ K: un'energia di un elettronvolt corrisponde a poco più di undicimila kelvin, e siccome ionizzare l'idrogeno costa 13,6 eV si capisce subito perché serva una fotosfera da qualche decina di migliaia di kelvin per trovarlo ionizzato.","pieno":{"file":"as-01-la-scala-del-cosmo.html","tappa":"05","come":"le masse delle particelle elementari scritte come energie, con la conversione in chilogrammi e la gerarchia delle masse, nel movimento sulla scala del cosmo"},"controllo":[{"tipo":"numero","espr":"1.602177e-19/(2.99792458e8)**2*1e36","vale":"1.783","dove":"riga","appare":"1,783\\cdot10^{-36}"},{"tipo":"numero","espr":"938.3e6*1.783e-36*1e27","vale":"1.673","dove":"esempio","appare":"1,673\\cdot10^{-27}"},{"tipo":"numero","espr":"1.602e-19/1.381e-23","vale":"11600","dove":"esempio","appare":"11600"}]};

function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';
  return h;
}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

/* ---------------- 00 · DI COSA PARLA QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Di cosa parla questo movimento', meta:'Meccanica Quantistica · voce Q.17 · lo spazio di due sistemi · la hamiltoniana che si spezza · il centro di massa come prima mossa · lo spin che non si separa',
  blocchi:[
  {t:'prosa', title:'Due domande, una sola risposta', tag:'architettura', html:R`
  <p>Finora il sistema era una particella sola, e quasi sempre in una dimensione. Il passo che si fa qui sembra modesto, e Picasso lo presenta con understatement: <i>«quello che ci accingiamo a discutere è sostanzialmente solo un problema di linguaggio e di notazioni»</i>. Le domande sono due. La prima: se so descrivere la particella 1 da sola e la particella 2 da sola, qual è lo spazio degli stati del sistema fatto di tutte e due? La seconda: quando la hamiltoniana del sistema composto è fatta di pezzi che riguardano parti diverse, che cosa si guadagna?</p>
  <p>La risposta alla prima è il <span class="str" data-str="prodotto-tensoriale">prodotto tensoriale</span> degli spazi. La risposta alla seconda è la separazione delle variabili, che Griffiths chiama <i>«the physicist&rsquo;s first line of attack on any partial differential equation»</i>: una hamiltoniana somma di pezzi che agiscono su fattori diversi ha autostati che sono prodotti, ed energie che sono somme. Le due risposte sono una sola vista da due lati, e il movimento le tiene insieme dall&rsquo;inizio alla fine.</p>
  <p>Il guadagno più grande è il problema a due corpi. Due particelle che interagiscono con un potenziale che dipende solo dalla loro distanza sono un problema in sei variabili. Cambiando variabili, centro di massa e posizione relativa, il problema si spezza in una particella libera di massa totale più una particella di massa ridotta nel potenziale. Landau apre così il capitolo sul campo centrale: <i>«il problema del moto di due particelle interagenti nella meccanica quantistica può essere ridotto al problema di una sola particella, in modo analogo a come può essere fatto nella meccanica classica»</i>.</p>
  <p>Sugli scritti del corso è la prima mossa di quasi ogni problema. «Centro di massa» compare in 31 dei 47 scritti misurati, e i testi lo dicono senza spiegarlo: <i>«si risolva il problema nel sistema del centro di massa»</i>. Lo danno per fatto, e chi non sa esattamente che cosa vuol dire sbaglia tutto quello che viene dopo. Il punto che i testi sfruttano senza nominarlo è lo spin. Il cambio di variabili tocca le posizioni e gli impulsi, non lo spin: lo spin resta un fattore a parte, che la hamiltoniana può accoppiare al moto relativo, e che per due particelle identiche è legato alla parità del moto relativo. Quasi tutti gli esercizi con due particelle girano attorno a questo legame.</p>`},
  {t:'prosa', title:'Come è fatto il movimento', tag:'architettura', html:R`
  <p><b>Il primo blocco è la cinematica dei sistemi composti.</b> La tappa 01 costruisce lo spazio del sistema composto in tre modi, quelli di Picasso, Shankar e Ballentine, e mostra perché le dimensioni si moltiplicano invece di sommarsi. La 02 tratta gli operatori: quelli di una parte sola, quelli prodotto, le regole di calcolo, e i due esempi di Sakurai (orbita più spin, due spin). La 03 è la distinzione che il prodotto tensoriale introduce e che la fisica classica non conosce: stati fattorizzati e stati intrecciati, con l&rsquo;operatore di stato parziale di Ballentine e la sua classificazione.</p>
  <p><b>Il secondo blocco è il guadagno.</b> La 04 dà la separazione delle variabili in astratto e nella rappresentazione delle coordinate, e la applica alla particella in una scatola, dove la degenerazione fa la sua prima comparsa vera. La 05 è l&rsquo;oscillatore tridimensionale, con la degenerazione $(n+1)(n+2)/2$ e la decomposizione dei primi livelli negli stati di momento angolare, seguendo le note del corso. La 06 è il problema a due corpi, con il cambio di variabili verificato da capo e il significato fisico della massa ridotta.</p>
  <p><b>Il terzo blocco è lo spin, e gli esercizi.</b> La 07 dice che cosa succede allo spin quando si separa il moto, e ricava la regola che lega parità del moto relativo e spin totale per due particelle identiche. Le tappe 08, 09 e 10 risolvono tre compiti d&rsquo;esame veri, scelti perché ciascuno usa quella regola in un modo diverso. La 11 dice dove il metodo si ferma: con più di due corpi, e negli effetti piccoli ma misurabili della massa finita del nucleo. La 12 mette a confronto le fonti e chiude con le domande d&rsquo;orale.</p>
  <p><b>Che cosa il movimento non fa.</b> Non risolve l&rsquo;equazione radiale di una particella in un campo centrale, se non dove serve un risultato già noto (gli autovalori dell&rsquo;oscillatore, che si ottengono in coordinate cartesiane). Non costruisce la teoria generale della composizione dei momenti angolari: la usa nei due casi semplici che servono, e la verifica con le matrici. Non sviluppa la teoria delle particelle identiche oltre la regola di scambio per due particelle nel riferimento del centro di massa, che però è enunciata e motivata per intero, perché senza di essa nessuno dei compiti si risolve.</p>`}
]},
/* ---------------- 01 · LO SPAZIO DI DUE SISTEMI ---------------- */
{ num:'01', title:'Lo spazio di due sistemi: il prodotto tensoriale', meta:'tre costruzioni dello stesso spazio · Picasso nelle funzioni d onda · Shankar dalle misure di posizione · Ballentine dalle preparazioni indipendenti · perché le dimensioni si moltiplicano',
  blocchi:[
  {t:'prosa', title:'La domanda, nella rappresentazione delle coordinate', tag:'definizione', html:R`
  <p>Picasso pone la domanda nel modo più concreto possibile: <i>«sia $\mathcal H_{1}$ lo spazio degli stati della particella 1, $\mathcal H_{2}$ quello degli stati della particella 2 e $\mathcal H$ lo spazio degli stati del sistema composto; che relazione c&rsquo;è fra $\mathcal H_{1}$, $\mathcal H_{2}$ e $\mathcal H$?»</i>. E la affronta nella rappresentazione di Schrödinger, <i>«perché è più semplice»</i>. Lì la risposta si vede a occhio. $\mathcal H_{1}$ è lo spazio delle funzioni a quadrato sommabile $\varphi(x_{1})$, $\mathcal H_{2}$ quello delle $\chi(x_{2})$, e $\mathcal H$ quello delle funzioni a quadrato sommabile di due variabili $\Psi(x_{1},x_{2})$. Il modulo quadro $|\Psi(x_{1},x_{2})|^{2}$ è la densità di probabilità congiunta: Griffiths, nella sua forma tridimensionale, scrive che $|\Psi(\mathbf r_{1},\mathbf r_{2},t)|^{2}d^{3}\mathbf r_{1}d^{3}\mathbf r_{2}$ <i>«is the probability of finding particle 1 in the volume $d^{3}\mathbf r_{1}$ and particle 2 in the volume $d^{3}\mathbf r_{2}$»</i>, e che quindi la normalizzazione è un integrale su tutte e sei le coordinate.</p>
  <p>Il legame fra i tre spazi è questo: se $\varphi_{m}(x_{1})$ è una base ortonormale di $\mathcal H_{1}$ e $\chi_{n}(x_{2})$ una base ortonormale di $\mathcal H_{2}$, allora i prodotti $\varphi_{m}(x_{1})\chi_{n}(x_{2})$, presi per tutte le coppie $(m,n)$, sono una base di $\mathcal H$:</p>
  $$\Psi(x_{1},x_{2})=\sum_{m,n}c_{mn}\,\varphi_{m}(x_{1})\,\chi_{n}(x_{2}).$$
  <p>È la formula (15.1) di Picasso, che la riassume dicendo che <i>«$\mathcal H$ è il prodotto tensoriale di $\mathcal H_{1}$ e di $\mathcal H_{2}$»</i>, $\mathcal H=\mathcal H_{1}\otimes\mathcal H_{2}$.</p>`},
  {t:'reveal', title:'Perché i prodotti bastano', tag:'dimostrazione', steps:[
   {label:'L’argomento in due passi', body:R`
   <p>Che i prodotti di funzioni di una variabile generino tutte le funzioni di due variabili non è ovvio, e Shankar lo dimostra con un argomento che conviene sapere ripetere. Si prende una $\Psi(x_{1},x_{2})$ qualunque e si fissa $x_{1}$ a un valore $\bar x_{1}$. Quello che resta è una funzione della sola $x_{2}$, che si sviluppa nella base $\chi_{n}$:</p>
   $$\Psi(\bar x_{1},x_{2})=\sum_{n}C_{n}(\bar x_{1})\,\chi_{n}(x_{2}).$$
   <p>I coefficienti dipendono dal valore scelto per $\bar x_{1}$: sono funzioni di $\bar x_{1}$, e come tali si sviluppano a loro volta nella base $\varphi_{m}$, $C_{n}(\bar x_{1})=\sum_{m}c_{mn}\varphi_{m}(\bar x_{1})$. Rimettendo insieme e togliendo la barra si ottiene lo sviluppo nei prodotti.</p>`},
   {label:'Che cosa vuol dire in astratto', body:R`
   <p>Shankar traduce subito: lo sviluppo nei prodotti <i>«is the coordinate space version of the abstract result»</i> $|\psi\rangle=\sum_{m,n}c_{mn}|\omega_{1}\rangle\otimes|\omega_{2}\rangle$, <i>«which means $\mathbb V_{1\otimes2}=\mathbb V_{1}\otimes\mathbb V_{2}$»</i>. E aggiunge l&rsquo;osservazione che fa da ponte fra le due notazioni: <i>«in the coordinate basis, the direct product of the kets $|\omega_{1}\rangle$ and $|\omega_{2}\rangle$ becomes just the ordinary product of the corresponding wave functions»</i>. Il simbolo $\otimes$ non nasconde niente di misterioso: nella rappresentazione delle coordinate è il prodotto di due funzioni di variabili diverse.</p>`}
  ]},
  {t:'prosa', title:'La definizione astratta, e il prodotto scalare', tag:'definizione', html:R`
  <p>Fuori dalla rappresentazione delle coordinate, Picasso definisce il prodotto tensoriale attraverso le basi: se $|m\rangle_{1}$ è una base di $\mathcal H_{1}$ e $|n\rangle_{2}$ una base di $\mathcal H_{2}$, $\mathcal H$ è lo spazio in cui una base è data dalle coppie, scritte $|m,n\rangle$ o $|m\rangle|n\rangle$, <i>«ma l&rsquo;ordine è importante: $|m,n\rangle\ne|n,m\rangle$»</i>. Il primo posto è della particella 1, il secondo della 2. Il prodotto scalare è quello indotto dagli spazi di partenza,</p>
  $$\langle k,l|m,n\rangle=\langle k|m\rangle\,\langle l|n\rangle=\delta_{km}\,\delta_{ln},$$
  <p>e si estende per linearità a tutti i vettori. Picasso nota che la definizione non dipende, a meno di isomorfismi, dalla scelta delle basi: <i>«se si cambiano le basi in partenza, il risultato è equivalente ad un cambiamento di base in arrivo»</i>.</p>
  <p>Per due vettori prodotto qualunque la regola diventa $\langle u\otimes w|v\otimes z\rangle=\langle u|v\rangle\langle w|z\rangle$: il prodotto scalare di due prodotti è il prodotto dei prodotti scalari. In particolare la norma di un prodotto è il prodotto delle norme, e il prodotto di due vettori normalizzati è normalizzato. Con numeri: se $u=(1,i)$, $v=(2,1)$, $w=(1,1)$, $z=(3,-1)$, si ha $\langle u|v\rangle=2-i$ e $\langle w|z\rangle=2$. Il prodotto di Kronecker $u\otimes w=(1,1,i,i)$ e $v\otimes z=(6,-2,3,-1)$, e il loro prodotto scalare, con il complesso coniugato sul primo, vale</p>
  $$\langle u\otimes w|v\otimes z\rangle=6-2-3i+i=4-2i,$$
  <p>cioè proprio $(2-i)\cdot2$. La regola non è una convenzione aggiunta: è quello che si ottiene facendo il conto con le componenti.</p>`},
  {t:'prosa', title:'Shankar: il prodotto viene dalle misure', tag:'fisica', html:R`
  <p>Shankar arriva allo stesso spazio da un&rsquo;altra parte, che spiega <i>perché</i> lo spazio composto deve essere un prodotto. Per una particella sola, a ogni risultato $x_{1}$ di una misura di posizione corrisponde un vettore $|x_{1}\rangle$. Per due particelle, <i>«a position measurement will yield a pair of numbers $(x_{1},x_{2})$»</i>, e dopo la misura la particella 1 è in $|x_{1}\rangle$ e la 2 in $|x_{2}\rangle$: il vettore corrispondente si scrive $|x_{1}\rangle\otimes|x_{2}\rangle$. Ci vuole un vettore di base per ogni <i>coppia</i> di risultati, e le coppie sono tante quanto il prodotto dei risultati possibili.</p>
  <p>Shankar insiste che il simbolo indica un oggetto nuovo: <i>«$|x_{1}\rangle\otimes|x_{2}\rangle$ is a new object, quite unlike the inner product $\langle\psi_{1}|\psi_{2}\rangle$ or the outer product $|\psi_{1}\rangle\langle\psi_{2}|$, both of which involve two vectors from the same space»</i>. Il prodotto tensoriale, invece, mette insieme vettori di spazi diversi, ed è lineare in ciascuno dei due fattori:</p>
  $$(\alpha|u\rangle+\beta|v\rangle)\otimes|w\rangle=\alpha\,|u\rangle\otimes|w\rangle+\beta\,|v\rangle\otimes|w\rangle.$$
  <p>Il confronto che chiarisce tutto è con la somma diretta. Nella somma diretta $\mathbb V_{1}\oplus\mathbb V_{2}$ le dimensioni si sommano: <i>«in which case the dimensionalities of $\mathbb V_{1}$ and $\mathbb V_{2}$ add»</i>. Nel prodotto diretto si moltiplicano: <i>«the dimensionality of $\mathbb V_{1}\otimes\mathbb V_{2}$ is the product of the dimensionality of $\mathbb V_{1}$ and the dimensionality of $\mathbb V_{2}$»</i>. La somma diretta è lo spazio di un sistema che è <i>o</i> nel primo <i>o</i> nel secondo insieme di stati; il prodotto è lo spazio di un sistema che ha <i>contemporaneamente</i> uno stato del primo e uno del secondo.</p>`},
  {t:'prosa', title:'Ballentine: il prodotto viene dalle preparazioni indipendenti', tag:'fisica', html:R`
  <p>Ballentine dà la terza strada, che è la più fisica perché parte da ciò che si può fare in laboratorio. Se due componenti di un sistema si possono separare, <i>«it must be possible to prepare states for the separate components independently»</i>, con la precisazione tra parentesi: <i>«this is not to say that all states of the composite system must be of this character, but only that such independent state preparations must be possible»</i>.</p>
  <p>Allora: si può preparare la componente 1 in un autostato di un suo osservabile $A^{(1)}$ con autovalore $a_{m}$, e indipendentemente la componente 2 in un autostato di $B^{(2)}$ con autovalore $b_{n}$. Siccome le due preparazioni sono indipendenti, deve esistere un vettore di stato del sistema composto che è autostato comune di $A^{(1)}$ e $B^{(2)}$, <i>«and this must be true for all combinations of eigenvalues of the two operators»</i>. Le equazioni sono soddisfatte se il vettore congiunto ha la forma prodotto, $|a_{m},b_{n}\rangle=|a_{m}\rangle^{(1)}|b_{n}\rangle^{(2)}$, che Ballentine chiama <i>«Kronecker product»</i>. Ne segue la regola delle dimensioni: <i>«the Kronecker product between a vector in an $M$-dimensional space and a vector in an $N$-dimensional space is a vector in an $MN$-dimensional space ($M$ and $N$ may be infinite)»</i>.</p>
  <p>Le tre costruzioni dicono la stessa cosa da tre posti diversi. Picasso parte dalle funzioni d&rsquo;onda e ci trova il prodotto. Shankar parte dalle misure e trova che servono vettori per le coppie di risultati. Ballentine parte dalle preparazioni e trova che servono autostati comuni per tutte le coppie di autovalori. Chi studia per l&rsquo;orale fa bene a saperne almeno due, perché la domanda «perché il prodotto e non la somma?» è una domanda d&rsquo;esame.</p>`},
  {t:'plot', title:'Quanto cresce lo spazio di un sistema composto',
   intro:R`<p>Per $N$ particelle di spin $\tfrac12$, di cui si considera solo lo spin: dimensione del prodotto tensoriale $2^{N}$ (blu) e della somma diretta $2N$ (arancio), in funzione di $N$.</p>`,
   plots:[{kind:'func2d', xr:[1,10], yr:[0,1050], height:270, ticks:true,
     title:'prodotto tensoriale contro somma diretta, N spin 1/2',
     curves:[{f:'Math.pow(2,x)', col:'#5aa9ff', width:2.4, label:'prodotto: 2^N'},
             {f:'2*x', col:'#ffb86b', width:2.0, label:'somma: 2N'}],
     xlabel:'N', ylabel:'dimensione'}],
   leggi:R`<p><b>Che cosa guardare.</b> Fino a $N=2$ le due curve coincidono, perché $2\cdot2$ e $2+2$ valgono entrambi $4$, ed è una coincidenza che inganna chi impara il prodotto tensoriale sull&rsquo;esempio di due spin. Già a $N=3$ il prodotto vale $8$ contro $6$, a $N=10$ vale $1024$ contro $20$.</p>
   <p><b>Che cosa impararne.</b> Lo spazio di un sistema composto cresce in modo esponenziale nel numero delle parti, perché c&rsquo;è un vettore di base per ogni combinazione di stati delle parti. È la ragione per cui la meccanica quantistica di molti corpi è difficile da calcolare, e per cui ogni struttura che permette di spezzare il problema, come la separazione delle variabili delle tappe seguenti, vale tanto.</p>`},
  {t:'prosa', title:'Esempi di spazi composti, e una cosa da non confondere', tag:'esempi', html:R`
  <p>Gli esempi che servono negli esercizi sono pochi. Una particella in tre dimensioni ha lo spazio $L^{2}(\mathbb R^{3})$, che è il prodotto $L^{2}(\mathbb R)\otimes L^{2}(\mathbb R)\otimes L^{2}(\mathbb R)$, un fattore per ciascuna coordinata cartesiana: Shankar osserva che <i>«mathematically, the problem of a single particle in two dimensions (in terms of Cartesian coordinates) is equivalent to that of two particles in one dimension»</i>. Una particella di spin $s$ ha lo spazio $L^{2}(\mathbb R^{3})\otimes\mathbb C^{2s+1}$: Picasso scrive per l&rsquo;elettrone $\mathcal H=\mathcal H_{\rm orb}\otimes\mathcal H_{\rm spin}$, con il secondo fattore di dimensione due. Due spin $\tfrac12$ senza gradi di libertà spaziali hanno lo spazio $\mathbb C^{2}\otimes\mathbb C^{2}$, di dimensione quattro. Due particelle di spin $\tfrac12$ in tre dimensioni hanno lo spazio $L^{2}(\mathbb R^{3})\otimes L^{2}(\mathbb R^{3})\otimes\mathbb C^{2}\otimes\mathbb C^{2}$, e nella rappresentazione delle coordinate una funzione d&rsquo;onda è un insieme di quattro funzioni di sei variabili, una per ogni coppia di valori di $S_{1z}$ e $S_{2z}$.</p>
  <p>Una particella di spin $\tfrac12$ e una di spin $1$, di sole variabili di spin, hanno uno spazio di dimensione $2\times3=6$, mentre la somma diretta avrebbe dimensione $5$. Si ritroverà questo sei componendo i due spin: i sei stati si riorganizzano in un quartetto e un doppietto, quattro stati più due.</p>
  <p>La cosa da non confondere è la notazione. $|m,n\rangle$, $|m\rangle|n\rangle$, $|m\rangle\otimes|n\rangle$ e $|m\rangle_{1}|n\rangle_{2}$ sono lo stesso vettore. Ma $|m,n\rangle$ non va confuso con un ket di una particella sola con due numeri quantici, come $|l,m\rangle$ del momento angolare: lì i due numeri etichettano gli autovalori di due operatori sullo stesso spazio, e lo spazio non è un prodotto. Lo spazio delle $|l,m\rangle$ con $l$ fissato ha dimensione $2l+1$, non il prodotto di due dimensioni.</p>`}
]},
/* ---------------- 02 · GLI OPERATORI SUL PRODOTTO ---------------- */
{ num:'02', title:'Gli operatori sul prodotto: di una parte, di tutte e due, e le regole di calcolo', meta:'l operatore di una particella sola come prodotto per l identità · il prodotto di operatori e le sue regole · commutano sempre · indipendenza cinematica e non interazione · orbita più spin e due spin, con Sakurai',
  blocchi:[
  {t:'prosa', title:'L’operatore di una parte sola', tag:'definizione', html:R`
  <p>Se $\xi^{(1)}$ è una variabile dinamica della particella 1, per esempio la sua posizione o il suo impulso, essa è anche una variabile dinamica del sistema composto. Picasso precisa come agisce: <i>«l&rsquo;operatore su $\mathcal H$ ad essa associata agisce soltanto sulla componente $m$ della base $|m,n\rangle$ e quindi per gli stati fattorizzati $|A,B\rangle=|A\rangle|B\rangle$ solo su $|A\rangle$»</i>. Formalmente andrebbe scritto $\xi^{(1)}\otimes\mathbb 1^{(2)}$, con $\mathbb 1^{(2)}$ l&rsquo;identità sul secondo fattore; Picasso aggiunge che, <i>«per non appesantire troppo le notazioni»</i>, scriverà semplicemente $\xi^{(1)}$.</p>
  <p>Shankar costruisce la stessa cosa a partire dalla posizione. Il ket $|x_{1}\rangle\otimes|x_{2}\rangle$ descrive uno stato in cui la particella 1 è in $x_{1}$, quindi deve essere autostato dell&rsquo;operatore posizione della particella 1 sul sistema composto, $X_{1}^{(1)\otimes(2)}$, con autovalore $x_{1}$. E nota: <i>«$X_{1}^{(1)\otimes(2)}$ does not really care about the second ket $|x_{2}\rangle$, i.e., it acts trivially (as the identity) on $|x_{2}\rangle$ and acts on $|x_{1}\rangle$ just as $X_{1}^{(1)}$ did»</i>. Da qui la definizione generale del prodotto di due operatori, uno per spazio:</p>
  $$(\Omega^{(1)}\otimes\Lambda^{(2)})\,|\omega_{1}\rangle\otimes|\omega_{2}\rangle=\Omega^{(1)}|\omega_{1}\rangle\otimes\Lambda^{(2)}|\omega_{2}\rangle,$$
  <p>di cui l&rsquo;operatore di una parte sola è il caso con l&rsquo;identità al secondo posto. Ballentine usa la stessa definizione, e osserva che la scelta della notazione, apici $A^{(1)}$ o posto nel prodotto $A\otimes I$, <i>«is a matter of taste»</i>, purché sia chiaro su quale fattore agisce ogni operatore. E aggiunge la frase che conviene tenere a mente: <i>«of course, not all important operators have this simple form; in particular, interaction operators act nontrivially on both factors»</i>.</p>`},
  {t:'reveal', title:'Le regole di calcolo, una per una', tag:'regole', steps:[
   {label:'Il prodotto di prodotti', body:R`
   <p>Shankar raccoglie le proprietà nell&rsquo;esercizio 10.1.1, da verificare agendo sui vettori di base. La prima è la regola del prodotto misto: due operatori prodotto si moltiplicano fattore per fattore,</p>
   $$(\Omega\otimes\Gamma)(\theta\otimes\Lambda)=(\Omega\theta)\otimes(\Gamma\Lambda).$$
   <p>Si vede applicando a un vettore prodotto: $\theta\otimes\Lambda$ produce $\theta|u\rangle\otimes\Lambda|w\rangle$, e $\Omega\otimes\Gamma$ produce $\Omega\theta|u\rangle\otimes\Gamma\Lambda|w\rangle$. Sulle matrici, dove il prodotto tensoriale è il <span class="str" data-str="prodotto-tensoriale">prodotto di Kronecker</span>, la regola si controlla con quattro matrici $2\times2$ di simboli qualunque: la differenza fra i due membri è la matrice nulla $4\times4$.</p>`},
   {label:'Operatori di parti diverse commutano', body:R`
   <p>Dalla regola del prodotto misto segue subito che un operatore della particella 1 e uno della particella 2 <span class="str" data-str="commutatore">commutano</span>: $(\Omega\otimes\mathbb 1)(\mathbb 1\otimes\Lambda)$ e $(\mathbb 1\otimes\Lambda)(\Omega\otimes\mathbb 1)$ valgono entrambi $\Omega\otimes\Lambda$, quindi</p>
   $$[\,\Omega\otimes\mathbb 1,\ \mathbb 1\otimes\Lambda\,]=0 .$$
   <p>Ballentine lo ricava al contrario, dalla completezza degli autovettori comuni: <i>«the common eigenvectors (3.62) form a complete basis set, and hence the operators $A^{(1)}$ and $B^{(2)}$ must commute»</i>, e conclude che <i>«the position, momentum, and spin operators for particle 1 commute with the position, momentum, and spin operators for particle 2»</i>.</p>`},
   {label:'Le regole di commutazione si trasportano', body:R`
   <p>La terza proprietà dell&rsquo;esercizio di Shankar: se $[\Omega,\Lambda]=\Gamma$ sullo spazio della particella 1, allora $[\Omega\otimes\mathbb 1,\Lambda\otimes\mathbb 1]=\Gamma\otimes\mathbb 1$. Le regole di commutazione di una particella sopravvivono al passaggio al sistema composto. Con le due proprietà insieme si ottengono le regole canoniche per due particelle,</p>
   $$[X_{i},P_{j}]=i\hbar\,\delta_{ij},\qquad [X_{i},X_{j}]=[P_{i},P_{j}]=0,\qquad i,j=1,2,$$
   <p>e Shankar ne trae l&rsquo;identificazione che chiude il cerchio: lo spazio costruito come prodotto e lo spazio a due particelle costruito direttamente con gli autostati comuni di $X_{1}$ e $X_{2}$ hanno la stessa dimensione e operatori con le stesse regole di commutazione, quindi sono lo stesso spazio.</p>`},
   {label:'Traccia ed esponenziale', body:R`
   <p>Due regole ancora, che servono nei conti. La <span class="str" data-str="traccia">traccia</span> di un prodotto è il prodotto delle tracce, $\mathrm{Tr}(A\otimes B)=\mathrm{Tr}A\,\mathrm{Tr}B$, che è la (8.17) di Ballentine. E l&rsquo;esponenziale di una somma di operatori di parti diverse è il prodotto degli esponenziali:</p>
   $$e^{A\otimes\mathbb 1+\mathbb 1\otimes B}=e^{A}\otimes e^{B}.$$
   <p>La seconda vale perché i due addendi commutano, e quindi l&rsquo;esponenziale della somma si spezza come per i numeri. Controllata con $A=-ia\sigma_{z}$ e $B=-ib\sigma_{x}$, la differenza fra i due membri è nulla per ogni $a$ e $b$. È la regola che fa evolvere indipendentemente due sistemi che non interagiscono, e che fa fattorizzare le rotazioni nell&rsquo;esempio di Sakurai qui sotto.</p>`}
  ]},
  {t:'prosa', title:'Indipendenti non vuol dire non interagenti', tag:'concetto', html:R`
  <p>Ballentine fa una distinzione che evita molta confusione. Le proprietà appena viste valgono per qualunque coppia di gradi di libertà <i>«kinematically independent (not to be confused with noninteracting)»</i>, anche se non sono separabili fisicamente. L&rsquo;esempio è lo spin di una particella e la sua posizione: non si può portare lo spin di un elettrone da una parte e la sua posizione dall&rsquo;altra, ma lo spin commuta con la posizione e l&rsquo;impulso, e lo spazio è un prodotto. Lo stesso vale per le tre coordinate cartesiane di una particella, fra loro.</p>
  <p>Indipendenza cinematica è una proprietà dello <i>spazio</i> e degli operatori fondamentali: vuol dire che lo spazio è un prodotto e che le variabili dei due fattori commutano. Non interazione è una proprietà della <i>hamiltoniana</i>: vuol dire che la hamiltoniana è una somma di pezzi, ciascuno su un fattore. Due elettroni con la repulsione coulombiana sono cinematicamente indipendenti e interagenti; l&rsquo;operatore $e^{2}/|\mathbf Q^{(1)}-\mathbf Q^{(2)}|$, scrive Ballentine, è l&rsquo;operatore dell&rsquo;interazione e agisce su tutti e due i fattori. La separazione delle variabili delle tappe seguenti consiste nel trovare un cambio di variabili in cui la hamiltoniana torna a essere, almeno in parte, una somma.</p>
  <p>Shankar dà l&rsquo;esempio in cui la notazione compatta inganna: l&rsquo;energia cinetica del centro di massa di due particelle, scritta</p>
  $$T_{\rm CM}=\frac{(P_{1}+P_{2})^{2}}{2M}=\frac{P_{1}^{2}+P_{2}^{2}+2P_{1}P_{2}}{2M},$$
  <p><i>«which really means»</i> una somma in cui il termine misto è $2P_{1}^{(1)}\otimes P_{2}^{(2)}$. Il termine $P_{1}P_{2}$ non è un operatore di una particella: agisce su tutte e due. Si vedrà nella tappa 06 che cosa succede quando lo si combina con l&rsquo;energia cinetica del moto relativo.</p>`},
  {t:'reveal', title:'Sakurai: orbita più spin, e due spin', tag:'esempi', steps:[
   {label:'Una particella con spin', body:R`
   <p>Sakurai apre la sezione sulla composizione dei momenti angolari con lo spazio di una particella di spin $\tfrac12$: <i>«the base ket for a spin $\tfrac12$ particle may be visualized to be in the direct-product space of the infinite-dimensional ket space spanned by the position eigenkets $\{|\mathbf x'\rangle\}$ and the two-dimensional spin space spanned by $|+\rangle$ and $|-\rangle$»</i>,</p>
   $$|\mathbf x',\pm\rangle=|\mathbf x'\rangle\otimes|\pm\rangle,$$
   <p><i>«where any operator in the space spanned by $\{|\mathbf x'\rangle\}$ commutes with any operator in the two-dimensional space spanned by $|\pm\rangle$»</i>. La funzione d&rsquo;onda ha due componenti $\psi_{\pm}(\mathbf x')=\langle\mathbf x',\pm|\alpha\rangle$, e $|\psi_{\pm}(\mathbf x')|^{2}$ è la densità di probabilità di trovare la particella in $\mathbf x'$ con lo spin su o giù.</p>`},
   {label:'Il momento angolare totale e la rotazione che si fattorizza', body:R`
   <p>Il generatore delle rotazioni è la somma del momento orbitale e dello spin, $\mathbf J=\mathbf L+\mathbf S$, e Sakurai precisa: <i>«it is actually more obvious to write»</i></p>
   $$\mathbf J=\mathbf L\otimes\mathbb 1+\mathbb 1\otimes\mathbf S .$$
   <p>Siccome i due addendi commutano, l&rsquo;operatore di rotazione è il prodotto di una rotazione orbitale e di una rotazione dello spin, $\mathcal D(R)=\mathcal D^{\rm (orb)}(R)\otimes\mathcal D^{\rm (spin)}(R)$, esattamente per la regola dell&rsquo;esponenziale. Picasso scrive la stessa fattorizzazione come uguaglianza di esponenziali e annota tra parentesi: <i>«l&rsquo;ultimo passaggio è lecito solo perché gli addendi all&rsquo;esponente $\mathbf L\cdot\hat n$ e $\mathbf S\cdot\hat n$ commutano»</i>.</p>`},
   {label:'Due spin 1/2, nella base prodotto', body:R`
   <p>Il secondo esempio di Sakurai sono due spin $\tfrac12$ senza gradi di libertà orbitali: lo spin totale va inteso come $\mathbf S_{1}\otimes\mathbb 1+\mathbb 1\otimes\mathbf S_{2}$. Nella base prodotto $|{+}{+}\rangle,|{+}{-}\rangle,|{-}{+}\rangle,|{-}{-}\rangle$, con $\mathbf S_{i}=\tfrac{\hbar}{2}\boldsymbol\sigma_{i}$ e le <span class="str" data-str="matrici-di-pauli">matrici di Pauli</span>, la componente $z$ dello spin totale è</p>
   $$\frac{2}{\hbar}S_{z}=\sigma_{z}\otimes\mathbb 1+\mathbb 1\otimes\sigma_{z}=\mathrm{diag}(2,0,0,-2),$$
   <p>e l&rsquo;operatore che compare in quasi tutti gli esercizi con due spin, il prodotto scalare $\mathbf S_{1}\cdot\mathbf S_{2}=\tfrac{\hbar^{2}}{4}\sum_{k}\sigma_{k}\otimes\sigma_{k}$, ha la matrice</p>
   $$\frac{4}{\hbar^{2}}\,\mathbf S_{1}\cdot\mathbf S_{2}=\begin{pmatrix}1&0&0&0\\0&-1&2&0\\0&2&-1&0\\0&0&0&1\end{pmatrix}.$$
   <p>I suoi autovalori sono $1$ tre volte e $-3$ una volta: $\mathbf S_{1}\cdot\mathbf S_{2}$ vale $\tfrac14\hbar^{2}$ sui tre stati di tripletto e $-\tfrac34\hbar^{2}$ sullo stato di singoletto. Gli autovettori del blocco centrale sono $(|{+}{-}\rangle\pm|{-}{+}\rangle)/\sqrt2$, il segno più per il tripletto e il meno per il singoletto. La via breve è l&rsquo;identità $\mathbf S_{1}\cdot\mathbf S_{2}=\tfrac12(S^{2}-S_{1}^{2}-S_{2}^{2})$ con $S=1$ o $S=0$, che è il caso più semplice di <span class="str" data-str="clebsch-gordan">composizione di due momenti angolari</span>; la matrice fa vedere che i due conti coincidono senza bisogno di altro.</p>`}
  ]}
]},
/* ---------------- 03 · FATTORIZZATI E INTRECCIATI ---------------- */
{ num:'03', title:'Stati fattorizzati e stati intrecciati', meta:'la distinzione che il prodotto tensoriale introduce · il criterio del determinante · lo stato parziale di Ballentine · stati correlati e non correlati · il teorema del fattore puro · interferenza che c è solo nelle coincidenze',
  blocchi:[
  {t:'prosa', title:'Due tipi di vettori nello stesso spazio', tag:'definizione', html:R`
  <p>Nello spazio $\mathcal H_{1}\otimes\mathcal H_{2}$, osserva Picasso, ci sono vettori di due tipi. Ci sono quelli che si scrivono come un solo prodotto,</p>
  $$|X\rangle=\sum_{m,n}a_{m}b_{n}|m,n\rangle=\Big(\sum_{m}a_{m}|m\rangle\Big)\Big(\sum_{n}b_{n}|n\rangle\Big)=|A\rangle|B\rangle,$$
  <p><i>«che corrispondono a stati in cui il sottosistema 1 si trova nello stato $|A\rangle$ e il sottosistema 2 nello stato $|B\rangle$, e questi vengono detti stati fattorizzati»</i>. E ci sono quelli in cui i coefficienti $c_{mn}$ non si scrivono come prodotto $a_{m}b_{n}$, cioè $|X\rangle=|AB\rangle+|CD\rangle+\cdots$ senza che la somma si possa ridurre a un prodotto solo, <i>«nel qual caso si può solo parlare di stato dell&rsquo;intero sistema e non di stati dei singoli sottosistemi: questi sono detti entangled states, un termine che non è traducibile in italiano (stati &lsquo;confusi&rsquo;, stati &lsquo;intrecciati&rsquo;, ...)»</i>. Shankar dice la stessa cosa in una riga: <i>«not every element of $\mathbb V_{1}\otimes\mathbb V_{2}$ is a direct product»</i>.</p>
  <p>Nella fisica classica la distinzione non esiste. Lo stato di due particelle classiche è un punto nello spazio delle fasi di ciascuna, e conoscere lo stato del sistema vuol dire conoscere lo stato di ciascuna. In meccanica quantistica lo spazio composto contiene le <i>combinazioni lineari</i> di stati in cui ciascuna particella ha uno stato, e una combinazione lineare di prodotti in generale non è un prodotto. È il principio di sovrapposizione applicato al sistema composto, e non serve niente di più.</p>`},
  {t:'reveal', title:'Come si riconosce uno stato fattorizzato', tag:'criterio', steps:[
   {label:'Il criterio per due sistemi a due stati', body:R`
   <p>Si scrive lo stato come matrice di coefficienti: $|\Psi\rangle=\sum_{m,n}c_{mn}|m,n\rangle$, con $c$ matrice $2\times2$ se le due parti hanno due stati ciascuna. Lo stato è fattorizzato se e solo se $c_{mn}=a_{m}b_{n}$, cioè se la matrice $c$ è il prodotto di una colonna per una riga. Una matrice $2\times2$ non nulla è di questa forma se e solo se il suo determinante è zero:</p>
   $$|\Psi\rangle\ \text{fattorizzato}\iff c_{11}c_{22}-c_{12}c_{21}=0 .$$
   <p>Un verso è immediato, perché $a_{1}b_{1}a_{2}b_{2}-a_{1}b_{2}a_{2}b_{1}$ è identicamente nullo. L&rsquo;altro è il fatto che una matrice di rango uno ha le colonne proporzionali. Per parti con più stati il criterio diventa: la matrice dei coefficienti ha rango uno.</p>`},
   {label:'Tre esempi che ingannano', body:R`
   <p>Lo stato $\tfrac12\big(|{+}{+}\rangle+|{+}{-}\rangle+|{-}{+}\rangle+|{-}{-}\rangle\big)$ sembra intrecciato, perché è una somma di quattro termini. Ma la sua matrice ha tutti gli elementi uguali a $\tfrac12$ e determinante nullo: è il prodotto di due spin orientati lungo $x$, $\tfrac{1}{\sqrt2}(|+\rangle+|-\rangle)\otimes\tfrac{1}{\sqrt2}(|+\rangle+|-\rangle)$. Lo stato di singoletto $\tfrac{1}{\sqrt2}(|{+}{-}\rangle-|{-}{+}\rangle)$ ha matrice con zeri sulla diagonale e $\pm\tfrac{1}{\sqrt2}$ fuori, e determinante</p>
   $$\det c=0\cdot0-\tfrac{1}{\sqrt2}\cdot\Big(-\tfrac{1}{\sqrt2}\Big)=\tfrac12\ne0,$$
   <p>quindi non è fattorizzato, in nessuna base. Lo stato $\alpha|{+}{+}\rangle+\beta|{-}{-}\rangle$ è intrecciato appena $\alpha$ e $\beta$ sono tutti e due diversi da zero. Il numero di termini in una base data non dice niente: dice tutto il determinante, che non cambia, a meno di un fattore non nullo, se si cambiano le basi delle due parti.</p>`}
  ]},
  {t:'prosa', title:'Lo stato di una parte: l’operatore di stato parziale', tag:'Ballentine', html:R`
  <p>Se il sistema composto è in uno stato intrecciato, che cosa si può dire della particella 1 da sola? Ballentine pone la domanda così: <i>«can one define states for the components, or merely states for the system as a whole? Is the state of a composite system determined by the states of its parts?»</i>. La risposta alla prima domanda è sì, con uno strumento preciso. Se $R^{(1)}$ è una variabile della sola componente 1, il suo valor medio nello stato $\rho$ del sistema composto si scrive</p>
  $$\langle R^{(1)}\rangle=\mathrm{Tr}(\rho R^{(1)})=\mathrm{Tr}^{(1)}\big(\rho^{(1)}R^{(1)}\big),\qquad \rho^{(1)}=\mathrm{Tr}^{(2)}\rho,$$
  <p>dove $\mathrm{Tr}^{(2)}$ è la <span class="str" data-str="traccia">traccia</span> fatta solo sul secondo fattore, cioè, negli elementi di matrice, $\langle a_{m}|\rho^{(1)}|a_{m'}\rangle=\sum_{n}\langle a_{m}b_{n}|\rho|a_{m'}b_{n}\rangle$. Ballentine lo chiama <i>«partial state operator for component 1 (it is sometimes also called a reduced state operator)»</i>, e dimostra che ha le tre proprietà di un operatore di stato: traccia uno, hermitiano, non negativo. La terza si dimostra per assurdo: se fosse $\langle u|\rho^{(1)}|u\rangle\lt0$ per qualche $|u\rangle$, scegliendo una base con $|u\rangle$ come primo vettore si avrebbe $\sum_{n}\langle ub_{n}|\rho|ub_{n}\rangle\lt0$, impossibile perché $\rho$ è non negativo.</p>
  <p>Per il singoletto il conto si fa a mano. $\rho=|\Psi\rangle\langle\Psi|$ ha nella base prodotto quattro elementi non nulli, $\tfrac12$ sulle posizioni $({+}{-},{+}{-})$ e $({-}{+},{-}{+})$ e $-\tfrac12$ sulle due incrociate. La traccia sul secondo spin somma gli elementi con lo stesso indice della particella 2, e gli elementi incrociati non sopravvivono perché hanno indici diversi della particella 2. Resta</p>
  $$\rho^{(1)}=\mathrm{Tr}^{(2)}|\Psi\rangle\langle\Psi|=\begin{pmatrix}\tfrac12&0\\0&\tfrac12\end{pmatrix}=\tfrac12\mathbb 1,$$
  <p>lo stato non polarizzato. Lo stato del sistema è puro, ma lo stato di ciascuna parte non lo è: $\mathrm{Tr}\,(\rho^{(1)})^{2}=\tfrac12$, mentre uno stato puro avrebbe $1$. Ballentine commenta che i tre stati, $\rho^{(1)}$, $\rho^{(2)}$ e $\rho$, sono isotropi: <i>«in any chosen direction the spin component of either particle is equally likely to be $+\tfrac12$ or $-\tfrac12$. But the value $+\tfrac12$ for particle 1 is always associated with the value $-\tfrac12$ for particle 2, and vice versa»</i>.</p>`},
  {t:'reveal', title:'Correlati e non correlati: la classificazione di Ballentine', tag:'Ballentine', steps:[
   {label:'Lo stato del tutto non è determinato dalle parti', body:R`
   <p>Le due matrici parziali bastano per i valori medi di ogni variabile di una parte sola, ma non bastano a ricostruire lo stato del sistema, <i>«because they provide no information about correlations between components 1 and 2»</i>. Uno stato si dice non correlato se $\langle R^{(1)}R^{(2)}\rangle=\langle R^{(1)}\rangle\langle R^{(2)}\rangle$ per tutte le coppie di variabili, e in quel caso, e solo in quello, $\rho=\rho^{(1)}\otimes\rho^{(2)}$: <i>«this is the only case for which the total state is determined by the partial states of the components»</i>.</p>
   <p>La prova che le parti non determinano il tutto è il confronto fra due esempi di Ballentine. Il singoletto, puro, ha le parti non polarizzate. La miscela $\rho=\tfrac12\big(|{+}{+}\rangle\langle{+}{+}|+|{-}{-}\rangle\langle{-}{-}|\big)$, non pura, ha anch&rsquo;essa le parti non polarizzate, ma è un altro stato: nel singoletto gli spin sono opposti in ogni direzione, nella miscela sono uguali lungo $z$ e scorrelati lungo $x$. Due stati diversi del tutto con le stesse parti.</p>`},
   {label:'Le tavole, e il teorema del fattore puro', body:R`
   <p>Ballentine classifica tutte le combinazioni possibili di stati puri e non puri delle parti e del tutto. Le regole che ne escono sono tre. Se le due parti sono in stati puri, il tutto è puro e non correlato: è un prodotto. Se una parte è pura e l&rsquo;altra no, il tutto non è puro e non è correlato. Se le due parti non sono pure, il tutto può essere puro e correlato, come il singoletto, o non puro, correlato o non correlato.</p>
   <p>Lo strumento che esclude le altre combinazioni è il <i>«pure state factor theorem»</i>: se lo stato parziale $\rho^{(1)}$ è puro, allora $\rho=\rho^{(1)}\otimes\rho^{(2)}$, <i>«in other words, a pure partial state operator must be a factor of the total state operator»</i>. Una parte che ha uno stato puro non può avere correlazioni con il resto. Ballentine avverte che la dimostrazione <i>«is rather subtle»</i>, perché sembra di poter cambiare gli elementi di matrice incrociati senza toccare le parti; lo impedisce la non negatività di $\rho$, che la dimostrazione garantisce scrivendo $\rho$ nella sua forma spettrale.</p>`},
   {label:'Il paradosso degli spin tutti su', body:R`
   <p>Ballentine discute un paradosso che conviene saper sciogliere. Lo stato $|{\uparrow}\rangle\otimes|{\uparrow}\rangle\otimes|{\uparrow}\rangle\otimes\cdots$ ha tutti gli spin su, e sembra il massimo della correlazione; eppure è un prodotto, quindi non correlato. La soluzione: la correlazione è definita sulle distribuzioni di probabilità, e lungo $z$ non c&rsquo;è nessuna fluttuazione, <i>«and where there is no variability the degree of correlation is undefined»</i>. Lungo qualunque altra direzione le componenti fluttuano, e le fluttuazioni sono indipendenti. Avere tutti lo stesso valore senza fluttuazioni non è correlazione; correlazione è che le fluttuazioni di uno dicano qualcosa su quelle dell&rsquo;altro.</p>`}
  ]},
  {t:'plot', title:'Uno stato intrecciato nelle coordinate',
   intro:R`<p>Per lo stato $\Psi(x_{1},x_{2})=\tfrac{1}{\sqrt2}[\varphi_{0}(x_{1})\varphi_{1}(x_{2})+\varphi_{1}(x_{1})\varphi_{0}(x_{2})]$, con $\varphi_{0},\varphi_{1}$ i primi due stati dell&rsquo;oscillatore in unità adimensionali: densità di probabilità della particella 2 sapendo che la particella 1 è in $x_{1}=-1$ (blu), $x_{1}=0$ (arancio), $x_{1}=+1$ (verde).</p>`,
   plots:[{kind:'func2d', xr:[-3.5,3.5], yr:[0,0.85], height:280, ticks:true,
     title:'densità condizionata di x2 per tre valori di x1',
     curves:[{f:'(x-1)*(x-1)*Math.exp(-x*x)/(Math.sqrt(Math.PI)*1.5)', col:'#5aa9ff', width:2.4, label:'x1 = -1'},
             {f:'x*x*Math.exp(-x*x)/(Math.sqrt(Math.PI)*0.5)', col:'#ffb86b', width:2.4, label:'x1 = 0'},
             {f:'(x+1)*(x+1)*Math.exp(-x*x)/(Math.sqrt(Math.PI)*1.5)', col:'#6bdc9b', width:2.4, label:'x1 = +1'}],
     xlabel:'x2', ylabel:'densita condizionata'}],
   leggi:R`<p><b>Che cosa guardare.</b> La funzione d&rsquo;onda è $\pi^{-1/2}(x_{1}+x_{2})\,e^{-(x_{1}^{2}+x_{2}^{2})/2}$, quindi la densità di $x_{2}$ a $x_{1}$ fissato è proporzionale a $(x_{1}+x_{2})^{2}e^{-x_{2}^{2}}$, con integrale $\sqrt\pi\,(x_{1}^{2}+\tfrac12)$. Lo zero della curva si sposta in $x_{2}=-x_{1}$: la particella 2 non si trova mai nel punto simmetrico della particella 1.</p>
   <p><b>Che cosa impararne.</b> Se lo stato fosse un prodotto $\varphi(x_{1})\chi(x_{2})$, le tre curve sarebbero la stessa, $|\chi(x_{2})|^{2}$, qualunque fosse $x_{1}$: sapere dove è una particella non direbbe niente sull&rsquo;altra. Che la forma cambi con $x_{1}$ è la firma, nelle coordinate, di uno stato intrecciato.</p>`},
  {t:'prosa', title:'L’interferenza che c’è solo nelle coincidenze', tag:'Ballentine', html:R`
  <p>Ballentine chiude la sezione con l&rsquo;esempio più istruttivo. Una sorgente emette coppie di particelle con impulsi opposti; due aperture per lato lasciano passare solo due direzioni, e lo stato delle coppie che escono è</p>
  $$|\Psi_{12}\rangle=\tfrac{1}{\sqrt2}\big(|k_{a}\rangle|k_{b}\rangle+|k_{a'}\rangle|k_{b'}\rangle\big),$$
  <p>con gli impulsi delle due particelle correlati: se la 1 ha $\hbar k_{a}$, la 2 ha $\hbar k_{b}$. Con degli specchi si fanno sovrapporre i fasci $a$ e $a'$ a destra e $b$ e $b'$ a sinistra. Guardando un solo lato ci si aspetterebbe un sistema di frange, come nella doppia fenditura. Ma nella zona di sovrapposizione la densità congiunta è</p>
  $$|\Psi_{12}(x_{1},x_{2})|^{2}\propto1+\cos\big[(k_{a}-k_{a'})\cdot x_{1}+(k_{b}-k_{b'})\cdot x_{2}\big],$$
  <p>e integrando su $x_{2}$, cioè ignorando dove arriva la particella 2, il coseno si media a zero: <i>«no interference pattern exists in the single particle probability density. Only in the correlations between particles can interference be observed»</i>. Se invece si selezionano le particelle 1 rivelate in coincidenza con una particella 2 vicina a $x_{2}=0$, la loro densità è proporzionale a $1+\cos[(k_{a}-k_{a'})\cdot x_{1}]$, e le frange tornano.</p>
  <p>Il conto mostra anche che cosa succede fra i due estremi. Se si accettano le particelle 2 in una finestra di larghezza $w$ attorno a $x_{2}=0$, con $q=k_{b}-k_{b'}$ in una dimensione, la media del coseno sulla finestra vale</p>
  $$\frac1w\int_{-w/2}^{w/2}\cos(\phi+qy)\,dy=\cos\phi\,\frac{\sin(qw/2)}{qw/2},$$
  <p>e il contrasto delle frange è il fattore $\sin(qw/2)/(qw/2)$: uno per una finestra stretta, zero quando la finestra contiene un periodo intero, $qw=2\pi$. Le frange non sono distrutte: sono nascoste nelle correlazioni, e si vedono nella misura in cui si sa dove è finita l&rsquo;altra particella.</p>`},
