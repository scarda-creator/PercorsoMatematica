   {label:'Che cosa il teorema dà, e che cosa non dà', body:R`
   <p>Per il problema di Dirichlet valgono <b>esistenza</b> e <b>unicità</b> della soluzione. È un risultato forte e Mazzoldi lo accompagna con un&rsquo;ammissione che conviene prendere sul serio: «purtroppo, pur essendo garantita l&rsquo;esistenza e l&rsquo;unicità della soluzione, <b>non esiste un metodo generale di ricerca della soluzione</b>, come avviene per altre classi di equazioni differenziali». Si sa che la risposta c&rsquo;è e che è una sola; non si sa come scriverla.</p>
   <p>È una situazione insolita e fertile, e produce due atteggiamenti, entrambi legittimi. Il primo è <b>numerico</b>: la soluzione si può sempre ottenere al calcolatore, e in pratica così si fa. Il secondo è il più elegante e in questo movimento è l&rsquo;unico che useremo: <b>se riesci a esibire una soluzione, per qualunque via — anche indovinandola — l&rsquo;unicità ti garantisce che è <i>la</i> soluzione.</b> Non devi giustificare come l&rsquo;hai trovata. È l&rsquo;autorizzazione a barare, e il metodo delle cariche immagini (tappe 06 e 06b) non è altro che l&rsquo;uso sistematico di questa autorizzazione.</p>`},
   {label:'Le tre cose che il teorema di unicita regala, e che avevamo gia usato a credito', body:R`
   <p><b>Primo: la capacità esiste.</b> Questa è la risposta alla preoccupazione che Griffiths dichiarava a p. 104 e rimandava al capitolo 3. Si risolve una volta il problema con il conduttore a potenziale $V_0$; si ottiene un&rsquo;unica $V$ in tutto lo spazio, da cui per il teorema di Coulomb la densità $\sigma$ e per integrazione la carica $q_0$. Ora si moltiplichi il dato al contorno per $k$: la funzione $kV$ è ancora armonica, vale $kV_0$ sul conduttore e va ancora a zero all&rsquo;infinito — quindi <b>per unicità è la soluzione</b> del nuovo problema. Ma allora il campo è $k$ volte quello di prima <i>punto per punto</i>, e così $\sigma$, e così $q$. <b>Raddoppiare la tensione raddoppia la densità superficiale in ogni punto, senza riorganizzare niente</b>: la carica non si sposta. Quindi $q=CV$ con $C$ dipendente solo dalla geometria, e il rapporto è legittimo.</p>
   <p><b>Secondo: la sovrapposizione sui conduttori è lecita</b>, e questo autorizza la matrice del paragrafo seguente. Se $V^{(1)}$ risolve un problema e $V^{(2)}$ un altro con gli stessi conduttori e dati al contorno diversi, la somma risolve il problema con i dati sommati — perché Laplace è lineare e, di nuovo, per unicità non c&rsquo;è altra soluzione con cui confonderla.</p>
   <p><b>Terzo: lo schermo elettrostatico.</b> Mazzoldi lo elenca come conseguenza diretta: «dal fatto che se $V$ è costante su una superficie chiusa, essa è costante anche all&rsquo;interno, si derivano le proprietà di schermo elettrostatico in un conduttore cavo». La tappa 05 svolgerà l&rsquo;argomento per esteso, e lo confronterà con una dimostrazione alternativa che non usa Laplace.</p>
   <div class="note"><b>E qui si chiude anche il conto in sospeso della tappa 02.</b> Avevamo citato l&rsquo;avvertimento di Mazzoldi: la densità superficiale è un dato <i>locale</i> ma non <i>autonomo</i>. Ora si vede perché: $\sigma$ è determinata dalla soluzione del problema di Dirichlet, che dipende da <b>tutte</b> le cariche e da <b>tutti</b> i conduttori presenti nello spazio. Il teorema di Coulomb lega $E$ e $\sigma$ nello stesso punto; chi decide il valore di $\sigma$ in quel punto è l&rsquo;intero sistema.</div>`}
  ]},
  {t:'prosa', title:'I coefficienti di induzione elettrostatica, costruiti stato per stato', tag:'costruzione', html:R`
  <p>Il caso generale lo imposta <b>Bettini</b> nel §2.9, e la sua costruzione è istruttiva perché <i>non</i> risolve niente: estrae tutto dalla linearità. Si considerino $n$ conduttori — lui ne prende tre per concretezza, senza perdere generalità — contenuti nella cavità di un conduttore cavo, che fa da riferimento con potenziale $\varphi_0$ e porta sulla faccia interna la carica $Q_0$ opposta alla somma delle altre.</p>
  <p>Si costruiscono $n$ <b>stati</b> particolari. Nello stato $1$ si collegano con un filo tutti i conduttori tranne il primo al conduttore cavo, cosicché $\varphi_2=\varphi_3=\varphi_0$ e solo $\varphi_1$ è arbitrario. In questo stato le tre cariche sono <b>proporzionali a $\varphi_1-\varphi_0$</b> — e l&rsquo;argomento è quello appena dimostrato con l&rsquo;unicità: se la differenza raddoppia, raddoppia il campo in ogni punto e quindi ogni carica. Si battezzano i coefficienti di proporzionalità $C_{11},C_{21},C_{31}$. Si ripete per lo stato $2$ e per lo stato $3$. Poi si <b>sovrappone</b>: poiché Laplace è lineare, lo stato generale con potenziali arbitrari è la somma dei tre, e sommando le cariche si ottiene
  $$q_i=\sum_{j}C_{ij}\,(\varphi_j-\varphi_0).$$
  I $C_{ij}$ si chiamano <b>coefficienti di induzione elettrostatica</b> e hanno le dimensioni di una capacità. Se c&rsquo;è un solo conduttore interno si ricade nel condensatore, e $C_{11}$ è la sua capacità.</p>
  <p><b>Mazzoldi</b> lavora con la relazione inversa — il suo §4.4, che l&rsquo;indice colloca a p. 98 e di cui a p. 101 si legge l&rsquo;uso che ne fa — quella che esprime i potenziali in funzione delle cariche,
  $$V_i=\sum_j p_{ij}\,q_j,$$
  dove i $p_{ij}$ si chiamano <b>coefficienti di potenziale</b>, e osserva che nelle applicazioni pratiche conviene la forma di Bettini: «è più semplice controllare il potenziale dei vari conduttori», quindi i potenziali sono noti e le cariche sono le incognite. Le due matrici sono l&rsquo;una l&rsquo;inversa dell&rsquo;altra, e nessuna delle due si calcola in generale — <b>si calcolano in casi particolari, e il caso particolare che si calcola a mano è uno</b>.</p>`},
  {t:'reveal', title:'Il caso che si calcola fino in fondo: due sfere lontane', tag:'esame', steps:[
   {label:'La matrice dei coefficienti di potenziale', body:R`
   <p>Due sfere conduttrici di raggi $R_1$ e $R_2$ a distanza $d$ fra i centri, con $d$ molto maggiore dei raggi: l&rsquo;ipotesi serve a poter trattare la carica di ciascuna come uniforme sulla propria superficie e l&rsquo;interazione fra le due come interazione fra cariche puntiformi. Il potenziale della prima sfera è la somma del contributo della propria carica e di quello della seconda, e simmetricamente:
   $$p_{11}=\frac{1}{4\pi\varepsilon_0R_1},\qquad p_{22}=\frac{1}{4\pi\varepsilon_0R_2},\qquad p_{12}=p_{21}=\frac{1}{4\pi\varepsilon_0d}.$$
   <b>Guarda il terzo:</b> i due coefficienti incrociati sono uguali, e lo sono per una ragione banale in questo caso — la distanza fra due sfere è la stessa in entrambi i versi. Il fatto notevole è che <b>la simmetria $p_{ij}=p_{ji}$ vale sempre</b>, per conduttori di forma qualunque, e non è affatto banale: è il teorema di reciprocità, ed è il paragrafo che segue.</p>`},
   {label:'Linversione, e i due controlli che la convalidano', body:R`
   <p>Invertendo la matrice $2\times2$ si ottengono i coefficienti di induzione:
   $$C_{11}=\frac{4\pi\varepsilon_0R_1d^{2}}{d^{2}-R_1R_2},\qquad C_{12}=C_{21}=-\frac{4\pi\varepsilon_0R_1R_2\,d}{d^{2}-R_1R_2}.$$
   Due cose vanno lette, e sono i due controlli di qualunque matrice di questo tipo. Primo: <b>il coefficiente incrociato è negativo</b>. Deve esserlo: alzare il potenziale della prima sfera tenendo la seconda a potenziale zero <i>induce carica negativa</i> sulla seconda, e questo è un fatto generale — i $C_{ij}$ con $i\neq j$ sono sempre $\le0$. Secondo: il limite $d\to\infty$. Si trova $C_{11}\to4\pi\varepsilon_0R_1$, la capacità della sfera isolata, e $C_{12}\to0$: <b>a distanza infinita le due sfere si ignorano</b> e la matrice diventa diagonale. Se la tua matrice non fa questo nel limite di separazione infinita, hai sbagliato l&rsquo;inversione.</p>
   <p>C&rsquo;è anche una lettura fisica del denominatore $d^{2}-R_1R_2$: la capacità di ciascuna sfera è <b>aumentata</b> dalla presenza dell&rsquo;altra, e l&rsquo;aumento esplode quando $d^{2}\to R_1R_2$, cioè quando le sfere si avvicinano fino a toccarsi. Non è un&rsquo;informazione utilizzabile in quel limite — l&rsquo;ipotesi di distribuzione uniforme è già crollata molto prima — ma la direzione è giusta, ed è la stessa direzione del condensatore piano che diverge quando $h\to0$.</p>`},
   {label:'Lenergia di un sistema di conduttori, e il tranello del fattore un mezzo', body:R`
   <p>L&rsquo;energia elettrostatica di un sistema di conduttori ha una forma che compare identica in <b>Mazzoldi</b> (eq. 4.30, p. 111) e in <b>Bettini</b> (eq. 3.9, §3.3):
   $$U=\frac12\sum_i q_i\,V_i.$$
   La si ottiene osservando che su un conduttore la carica è superficiale e il potenziale <i>costante</i>, quindi l&rsquo;integrale generale $\frac12\int V\,dq$ si spezza in una somma con $V_i$ fuori dall&rsquo;integrale. Per un condensatore, con $q_1=q$ e $q_2=-q$,
   $$U=\frac12\left(qV_1+(-q)V_2\right),$$
   cioè $U=\frac12q\,\Delta V$: la terza delle tre espressioni della tappa 04, e il caso particolare torna come deve. Messo alla prova sul condensatore sferico con l&rsquo;armatura esterna a terra, dove $V_1=\frac{q}{4\pi\varepsilon_0}\left(\frac{1}{R_1}-\frac{1}{R_2}\right)$ e $V_2=0$, questa somma restituisce esattamente l&rsquo;energia $\frac{q^{2}}{8\pi\varepsilon_0}\left(\frac{1}{R_1}-\frac{1}{R_2}\right)$ che la tappa 04 aveva ottenuto <i>integrando il campo nello spazio</i>: due conti che non si parlano, stesso numero.</p>
   <p><b>Ma qui Bettini aggiunge un avvertimento che vale la pena non perdere</b>, perché questa formula è <i>formalmente identica</i> a quella per un sistema di cariche puntiformi e <b>significa una cosa diversa</b>. Per le cariche puntiformi, $V_i$ è il potenziale prodotto da <i>tutte le altre</i> cariche nel punto dove sta la $i$-esima: la carica non interagisce con sé stessa, e il fattore $\frac12$ serve solo a non contare due volte ogni coppia. Per i conduttori, $V_i$ è il potenziale del conduttore $i$, prodotto da <b>tutte le cariche del sistema, comprese quelle che stanno sul conduttore $i$ stesso</b>. L&rsquo;auto-energia c&rsquo;è, e deve esserci: è il lavoro per accumulare la carica su quel conduttore. Scambiare le due letture è il modo tipico di sbagliare un esercizio sull&rsquo;energia di due conduttori.</p>
   <p>L&rsquo;esempio che separa le due letture è l&rsquo;esempio 4.16 di Mazzoldi (p. 112): le due sfere lontane di prima. Applicando $U=\frac12\sum q_iV_i$ con i potenziali scritti sopra si ottiene
   $$U=\frac{q_1^{2}}{8\pi\varepsilon_0R_1}+\frac{q_2^{2}}{8\pi\varepsilon_0R_2}+\frac{q_1q_2}{4\pi\varepsilon_0d}.$$
   <b>Tre termini, e si leggono uno per uno.</b> I primi due sono $q_1^{2}/2C_1$ e $q_2^{2}/2C_2$: il lavoro per caricare ciascuna sfera, sempre positivo, e sono proprio i termini di auto-energia che la lettura «cariche puntiformi» avrebbe buttato via. Il terzo è l&rsquo;<b>energia mutua</b>, e il suo segno dipende dal segno relativo delle cariche: positivo se si respingono, negativo se si attraggono. Il fattore $\frac12$ è scomparso dal terzo termine e non dai primi due — ed è quello il contenuto dell&rsquo;avvertimento.</p>`}
  ]},
  {t:'prosa', title:'La reciprocita di Green, e un conto che la usa per fare in due righe quello che altrimenti non si fa', tag:'teorema', html:R`
  <p>La simmetria $p_{ij}=p_{ji}$ ha un nome e un contenuto sorprendente. <b>Griffiths</b> la propone come problema 3.43 (p. 158) con il <b>teorema di reciprocità di Green</b>, e la enuncia in una forma che vale la pena leggere due volte: si prendano due conduttori $a$ e $b$ di <i>forma e posizione qualunque</i>. Si carichi $a$ con carica $Q$ lasciando $b$ scarico, e si misuri il potenziale che $b$ assume: sia $V_{ab}$. Poi si scarichi tutto, si metta la <i>stessa</i> carica $Q$ su $b$ lasciando $a$ scarico, e si misuri il potenziale di $a$: sia $V_{ba}$. Allora
  $$V_{ab}=V_{ba},$$
  e Griffiths commenta: «un risultato sorprendente, dato che non abbiamo assunto nulla sulla forma o la disposizione dei conduttori».</p>
  <p>La dimostrazione è un integrale per parti fatto in due versi — Griffiths la suggerisce come traccia: si calcola $\int\vec E_1\cdot\vec E_2\,d\tau$ due volte, scrivendo prima $\vec E_1=-\nabla V_1$ e spostando la derivata su $\vec E_2$, poi $\vec E_2=-\nabla V_2$ e spostandola su $\vec E_1$. Ciò che esce dai due conti è la stessa quantità scritta in due modi, e l&rsquo;uguaglianza fra i due modi è il teorema. Lo strumento è lo stesso <span class="str" data-str="gradiente">gradiente</span> che lega campo e potenziale, usato in un&rsquo;identità integrale invece che punto per punto.</p>
  <p><b>E adesso la cosa che il teorema permette di fare, che è il motivo per cui non è una curiosità.</b> Griffiths la mette come problema 3.44: due armature piane parallele <b>entrambe a terra</b>, distanti $d$, e una carica puntiforme $q$ posta fra loro a distanza $x$ dalla prima. Si chiede la carica indotta su ciascuna armatura. Non c&rsquo;è simmetria da sfruttare e la distribuzione indotta è complicata; il metodo delle immagini richiederebbe una serie infinita di immagini, perché ogni immagine va riflessa nell&rsquo;altro piano. La reciprocità lo risolve in due righe, confrontando la situazione vera con una seconda distribuzione fittizia in cui la carica è rimossa e un&rsquo;armatura è portata a potenziale $V_0$. Il risultato è
  $$Q_1=q\left(\frac{x}{d}-1\right),\qquad Q_2=-q\,\frac{x}{d}.$$
  <b>Si legge come un partitore.</b> La carica si ripartisce fra le due armature in proporzione <i>inversa</i> alla distanza: se $q$ è attaccata alla prima armatura ($x\to0$) allora $Q_1\to-q$ e $Q_2\to0$; se è attaccata alla seconda ($x\to d$) succede il contrario, e in mezzo si interpola linearmente. E il controllo che chiude ogni esercizio di questo tipo:
  $$Q_1+Q_2=-q,$$
  cioè <b>induzione completa</b>: la carica fra due piani a terra è completamente schermata, e la somma delle cariche indotte è esattamente l&rsquo;opposto di quella che le induce. La linearità in $x$ è il fatto non ovvio, e vale la pena ricordarla: è lo stesso risultato che si otterrebbe sommando la serie infinita di immagini, ottenuto senza sommarla.</p>`}
]},

/* ---------------- 05 · LO SCHERMO ---------------- */
{ num:'05', title:'Schermo elettrostatico e gabbia di Faraday: perche funziona in un verso solo', meta:'la dimostrazione col potenziale · cosa schermi e cosa no · la messa a terra',
  blocchi:[
  {t:'prosa', title:'La dimostrazione, che non usa Gauss', tag:'costruzione', html:R`
  <p><b>Tesi</b>: in una cavità vuota dentro un conduttore in equilibrio il campo è nullo, qualunque sia la distribuzione di cariche <i>fuori</i>.</p>
  <p>Gauss da solo non basta: dice che il flusso attraverso una superficie nella cavità è nullo, non che il campo lo sia — potrebbe entrare da una parte e uscire dall&rsquo;altra. Servono <b>due dimostrazioni</b>, e non è ridondanza: i quattro libri ne danno due diverse, una elementare e una potente, e la differenza fra loro è contenuto.</p>
  <p><b>Prima dimostrazione, quella di Mazzoldi (p. 93): si usa la conservatività, e basta.</b> Gauss dà il primo passo: il campo è nullo nella massa del conduttore, quindi è nullo il flusso attraverso qualunque superficie chiusa interna al metallo, in particolare attraverso una che racchiuda la cavità — dunque la carica netta sulle pareti della cavità è <b>zero</b>. Ma zero in totale non vuol dire zero in ogni punto: potrebbero coesistere una regione $+q$ e una regione $-q$ sulle pareti. <b>Questa possibilità la uccide la seconda proprietà fondamentale del campo elettrostatico</b>, che è di essere <span class="str" data-str="campo-conservativo">conservativo</span>. Se sulle pareti ci fossero due distribuzioni di segno opposto, nella cavità esisterebbero linee di forza uscenti dalle positive ed entranti nelle negative. Si costruisca allora un cammino chiuso con un tratto $C_1$ che corre nella cavità lungo una linea di forza, dove il campo è diverso da zero e parallelo al cammino, e un tratto $C_2$ di ritorno interno al metallo, dove il campo è nullo. La circuitazione sarebbe il solo contributo di $C_1$, <b>diversa da zero</b>: assurdo. Quindi nella cavità il campo deve essere nullo lungo <i>ogni</i> cammino, e sulle pareti non può esserci carica.</p>
  <p><b>Seconda dimostrazione, quella implicita in Bettini e Griffiths: si usa il principio del massimo.</b> La parete della cavità è tutta allo stesso potenziale $V_0$, perché il conduttore è equipotenziale. Dentro la cavità non ci sono cariche, quindi $V$ è una <span class="str" data-str="funzione-armonica">funzione armonica</span>. Una funzione armonica non ha massimi né minimi interni: i suoi estremi stanno sul bordo. Ma qui il bordo è tutto allo stesso valore $V_0$, dunque massimo e minimo coincidono, dunque $V\equiv V_0$ in tutta la cavità e il campo $\vec E=-\nabla V$ è identicamente nullo.</p>
  <div class="note"><b>Quale delle due conviene sapere, e perché non è la stessa.</b> La prima è più <i>economica</i>: usa solo Gauss e la conservatività, non richiede Laplace, e all&rsquo;esame si scrive in quattro righe. La seconda costa di più, perché bisogna avere in mano l&rsquo;armonicità e il principio del massimo, ma <b>dà qualcosa che la prima non dà</b>: dimostra l&rsquo;unicità, quindi funziona anche quando la cavità non è vuota ma il dato al contorno è assegnato, e si estende identica a tutti i problemi di Dirichlet — l&rsquo;equazione del calore, il flusso irrotazionale incomprimibile, le funzioni olomorfe. La prima dimostrazione ti dice <i>che</i> la gabbia funziona; la seconda ti dice <b>perché appartiene a una famiglia</b>. Nessuna delle due è la versione ridotta dell&rsquo;altra, ed è per questo che stanno qui entrambe.</div>`},
  {t:'prosa', title:'Il verso che non funziona, e la messa a terra', tag:'regola operativa', html:R`
  <p><b>Dall&rsquo;esterno verso l&rsquo;interno lo schermo è perfetto</b>: dentro la cavità non arriva niente. <b>Dall&rsquo;interno verso l&rsquo;esterno no</b>: una carica $q$ nella cavità induce $-q$ sulla parete interna e $+q$ sulla superficie esterna, e quel $+q$ produce campo fuori. Chi sta fuori si accorge della carica — non di <i>dove</i> sia, perché la distribuzione esterna segue la forma della superficie esterna e ha dimenticato la posizione della sorgente.</p>
  <p><b>La messa a terra chiude anche quel verso.</b> Collegando il conduttore a terra, la carica $+q$ sulla faccia esterna se ne va e il potenziale è fissato a zero: fuori il campo è <b>nullo</b>. È il motivo per cui gli schermi dei cavi e le gabbie vere si collegano a massa, e all&rsquo;esame è la differenza fra «guscio isolato» (la faccia esterna porta carica) e «guscio a terra» (la faccia esterna è scarica).</p>
  <div class="note">La gabbia di Faraday reale ha buchi e funziona lo stesso, purché le maglie siano piccole rispetto alla lunghezza d&rsquo;onda del campo da schermare — che in elettrostatica è infinita, e per questo una rete va bene quanto una lastra. Il telefono dentro l&rsquo;ascensore perde il segnale per la stessa ragione, ma lì la lunghezza d&rsquo;onda è finita ed è il motivo per cui a volte il segnale passa.</div>`},
  {t:'prosa', title:'Bettini mette alla prova lo schermo con due domande, e la seconda e piu seria di quanto sembri', tag:'collaudo concettuale', html:R`
  <p>Il §2.10 di <b>Bettini</b> enuncia lo schermo in una forma più forte di quella che abbiamo dimostrato, e conviene leggerla per quello che dice: fissati i potenziali $\varphi_0,\varphi_1,\dots,\varphi_n$ dei conduttori contenuti nella cavità, il campo nella cavità e le cariche sui conduttori sono <b>determinati</b> — e dunque, <i>qualunque cosa</i> si faccia fuori dal conduttore esterno, in condizioni statiche nella cavità <b>non succede niente di osservabile</b>. Si possono spostare i corpi carichi esterni, cambiarne le cariche, «o anche depositare carica dall&rsquo;esterno sulla superficie esterna del conduttore esterno»: dentro, nulla.</p>
  <p>Questa versione è più forte perché non parla di una cavità <i>vuota</i>: dentro ci possono essere conduttori e cariche a piacere, e lo schermo vale lo stesso. <b>La ragione è l&rsquo;unicità</b>, non Gauss: il problema interno è un problema di Dirichlet con bordo la parete della cavità, e il dato al contorno è il potenziale della parete. Tutto ciò che sta fuori può <i>spostare il valore comune</i> del potenziale della parete, ma non può cambiare la soluzione interna, che dipende solo dalle <b>differenze</b>.</p>
  <p>Il problema 2.5 di Bettini (p. 94) è costruito esattamente su questa distinzione, e vale un esame intero: «sei dentro una gabbia di Faraday posata su supporti isolanti. Sai che la gabbia è collegata all&rsquo;esterno a un generatore di tensione costante da $100\ \mathrm{kV}$, ma non sai se il generatore è accesso o spento. <b>Toccheresti la parete della gabbia?</b>» La risposta è sì, e il ragionamento è quello appena fatto: tu e la gabbia siete <i>dentro</i> lo stesso schermo, al medesimo potenziale, e ciò che conta è la differenza di potenziale fra te e ciò che tocchi, che è nulla. Pericolosa è la <b>messa a terra</b>, non la tensione: è l&rsquo;operaio che lavora sulle linee ad alta tensione in elicottero, e il motivo per cui l&rsquo;uccello sul filo non muore. La condizione che renderebbe mortale il contatto è un secondo cammino verso un potenziale diverso — e i supporti isolanti citati nel problema sono precisamente l&rsquo;ipotesi che lo esclude.</p>`},
  {t:'prosa', title:'Lo schermo come strumento di misura: lesperimento di Williams, Faller e Hill', tag:'dove il teorema diventa misura', html:R`
  <p><b>Lacava</b>, nel §11.4 (p. 166), fa qualcosa che gli altri tre libri non fanno: prende la gabbia di Faraday e la usa come <b>apparato di precisione</b>. L&rsquo;idea è questa. Tutta la dimostrazione di questa tappa poggia, attraverso Gauss, sul fatto che la forza di Coulomb vada esattamente come $1/r^{2}$. <b>Se l&rsquo;esponente non fosse esattamente $2$</b> — equivalentemente, se il fotone avesse una massa non nulla, che nella teoria di Proca aggiunge al potenziale un fattore di smorzamento — allora il campo dentro una cavità conduttrice <i>non</i> sarebbe esattamente nullo, e resterebbe un residuo proporzionale alla deviazione.</p>
  <p>Williams, Faller e Hill nel 1971 hanno costruito il sistema minimo che trasforma questo in una misura: due gusci conduttori concentrici, il guscio esterno portato a una tensione <b>alternata</b> $V_0e^{i\omega t}$ di ampiezza elevata, e un rivelatore sensibilissimo collegato fra i due gusci che cerca il segnale residuo sul guscio interno. Con la correzione di massa del fotone il campo radiale fra i gusci acquista un termine aggiuntivo, proporzionale a $\mu^{2}V_0e^{i\omega t}r$ e non più a $1/r^{2}$ — un termine che <i>cresce</i> col raggio invece di decrescere, e che quindi non si può nascondere. <b>La misura è un&rsquo;assenza</b>: non si trova segnale, e il limite superiore sulla sua ampiezza diventa un limite superiore sulla massa del fotone, cioè sulla deviazione dell&rsquo;esponente da $2$.</p>
  <div class="note"><b>Perché questo cambia come si legge il resto del movimento.</b> Lo schermo elettrostatico non è un&rsquo;applicazione dell&rsquo;elettrostatica: è il <b>test più sensibile</b> di una delle sue ipotesi fondative, e lo è proprio perché il risultato previsto è <i>esattamente zero</i>. Un esperimento che misura zero può raggiungere una precisione che nessuna misura di un valore finito raggiunge, perché non ha bisogno di calibrazione assoluta — serve solo il rumore. È lo stesso motivo per cui i test di violazione della parità, del principio di equivalenza e della conservazione del numero barionico sono tutti esperimenti costruiti attorno a un&rsquo;assenza.</div>`},
  {t:'prosa', title:'Quanto tempo ci mette: il tempo di rilassamento, e dove questo movimento smette di valere', tag:'limite di validita', html:R`
  <p>In tutto il movimento lo schermo è stato <b>perfetto e istantaneo</b>: cambi il campo fuori, e dentro il campo è nullo, subito. Nessun conduttore reale lo è, e vale la pena sapere quanto dura la transizione, perché è la grandezza che separa l&rsquo;elettrostatica dal resto dell&rsquo;elettromagnetismo.</p>
  <p>La stima viene da un risultato che <b>Griffiths</b> propone come problema 7.3 (p. 291) e che è notevole in sé: dati due conduttori immersi in un materiale debolmente conduttivo di conducibilità $\sigma_c$, la resistenza fra loro e la capacità della stessa coppia non sono indipendenti, ma legate da
  $$R=\frac{\varepsilon_0}{\sigma_c\,C}.$$
  Il prodotto $RC$ non dipende dalla geometria: si semplifica, perché sia $R$ sia $C$ sono lo <i>stesso</i> integrale geometrico, una volta a numeratore e una a denominatore. La conseguenza è che se si carica la coppia e poi si stacca il generatore, la tensione decade come $V(t)=V_0e^{-t/\tau}$ con
  $$\tau=\frac{\varepsilon_0}{\sigma_c},$$
  e <b>questa quantità non contiene la forma dell&rsquo;apparato</b>: è una proprietà del materiale. Si chiama tempo di rilassamento della carica, ed è la risposta alla domanda «quanto ci mette un conduttore a riorganizzare le proprie cariche».</p>
  <p><b>E adesso il numero, che è dove tutto si rompe.</b> Per un buon metallo $\sigma_c$ è dell&rsquo;ordine di $6\cdot10^{7}\ \mathrm{S/m}$, da cui $\tau\simeq1{,}48\cdot10^{-19}\ \mathrm{s}$. È un tempo <i>assurdo</i>: cinque ordini di grandezza più <b>corto</b> del tempo medio fra due urti degli elettroni di conduzione, che in un metallo è dell&rsquo;ordine di $10^{-14}\ \mathrm{s}$. Un modello non può prevedere una risposta più rapida del tempo che i suoi portatori impiegano a cambiare direzione, e quindi <b>la formula sta dicendo che è fuori dal suo dominio</b>: la legge di Ohm, da cui discende, suppone che gli elettroni abbiano già raggiunto la velocità di deriva, e su $10^{-19}$ secondi non l&rsquo;hanno raggiunta.</p>
  <p>Il tempo di rilassamento vero è dunque un&rsquo;altra cosa, e sta attorno a $10^{-14}\,$-$\,10^{-16}\ \mathrm{s}$: l&rsquo;inverso della <b>frequenza di plasma</b>, cioè della frequenza con cui il gas di elettroni oscilla collettivamente attorno alla posizione di equilibrio quando lo si perturba. <b>Il risultato operativo, però, non cambia:</b> qualunque dei due numeri si prenda, un campo deve variare su tempi di quell&rsquo;ordine — frequenze ottiche o superiori — perché il conduttore non riesca a schermarlo. Per tutto ciò che è più lento, cioè per le onde radio, per la rete elettrica e per qualunque esperimento di elettrostatica, <b>lo schermo è istantaneo con eccellente approssimazione</b>, e la gabbia di Faraday è esatta.</p>
  <div class="note"><b>Due numeri di questa pagina non vengono dai quattro libri</b> — la conducibilità del rame e il tempo medio fra urti — e sono dichiarati come ordini di grandezza tabulati, non come risultati di questo movimento. Il conto che li usa, invece, è verificato: $\varepsilon_0/\sigma_c$ con $\sigma_c=6\cdot10^{7}\ \mathrm{S/m}$ dà il numero scritto sopra.</div>`}
]},

/* ---------------- 06 · LA CARICA IMMAGINE ---------------- */
{ num:'06', title:'La carica immagine: il piano conduttore, e il trucco che sostituisce un problema con un altro', meta:'unicita della soluzione · la densita indotta · la carica totale · la forza attrattiva',
  blocchi:[
  {t:'prosa', title:'Perche e lecito, ed e la parte che non si racconta mai', tag:'first principles', html:R`
  <p>Problema: una carica $q$ a distanza $d$ da un piano conduttore indefinito messo a terra. Il campo nella regione $z>0$ è quello di $q$ <b>più</b> quello delle cariche indotte sul piano, che non conosciamo. Sembra un problema circolare.</p>
  <p>Il <b>metodo delle immagini</b> lo spezza così: si <i>indovina</i> una configurazione fittizia — la carica $q$ più una carica $-q$ in posizione simmetrica, con il piano rimosso — e si verifica che produca $V=0$ su tutto il piano $z=0$, com&rsquo;è richiesto. <b>Perché questo basta:</b> nella regione $z>0$ le due configurazioni hanno la <i>stessa</i> carica vera e le <i>stesse</i> condizioni al contorno, e il <b>teorema di unicità</b> per l&rsquo;equazione di Laplace dice che la soluzione con quei dati è una sola. Quindi coincidono.</p>
  <p><b>Il metodo non è un trucco: è un teorema di unicità usato al contrario</b> — invece di risolvere l&rsquo;equazione, si esibisce una configurazione che soddisfa dato e bordo, e l&rsquo;unicità garantisce che sia <i>la</i> soluzione. Ed è valido <b>solo</b> nella regione fisica: nella zona $z<0$ il campo vero è nullo (siamo dentro il metallo), mentre la configurazione fittizia lì darebbe qualcosa. Chi usa l&rsquo;immagine per calcolare il campo dalla parte sbagliata prende zero.</p>
  <p><b>Il divieto ha una formulazione più tagliente, e Griffiths la dà in una parentesi</b> (p. 125): «non si possono mettere cariche immagine nella regione in cui si sta calcolando $V$; <i>questo cambierebbe $\rho$</i>, e staresti risolvendo l&rsquo;equazione di Poisson con la sorgente sbagliata». È il modo esatto di dirlo. L&rsquo;unicità garantisce che due soluzioni coincidano quando hanno <b>la stessa sorgente nella regione</b> e <b>lo stesso dato al bordo</b>. L&rsquo;immagine dentro la regione fisica violerebbe la prima delle due ipotesi, e il teorema non si applicherebbe più — non è una regola mnemonica, è il controllo di un&rsquo;ipotesi.</p>
  <p><b>Lacava</b> (§3.1) aggiunge l&rsquo;osservazione che mette ordine nella struttura, e vale la pena averla chiara perché spiega <i>perché</i> si possono sommare le due cose: nella regione esterna ai conduttori, la somma dei potenziali delle <b>cariche vere</b> è una <i>soluzione particolare</i> dell&rsquo;equazione di Poisson, mentre la somma dei potenziali delle <b>cariche immagine</b> è una soluzione dell&rsquo;equazione di Laplace associata. Il metodo delle immagini è dunque la struttura standard «particolare più omogenea» delle equazioni lineari, con l&rsquo;omogenea scelta per aggiustare il bordo. Detto così, smette di essere un trucco di geometria e diventa l&rsquo;unica cosa che si possa fare.</p>
  <p><b>C&rsquo;è anche il verso costruttivo, ed è il modo in cui il metodo è stato inventato.</b> Mazzoldi lo imposta al contrario di come lo abbiamo presentato (§4.10, p. 120), e il suo ordine è più illuminante. Si prendano $n$ cariche puntiformi e si tracci una <b>superficie equipotenziale</b> $\Sigma$ che separi $m$ di esse dalle altre: su $\Sigma$ le linee di campo sono per costruzione perpendicolari. Ora si sostituisca $\Sigma$, o un pezzo di essa, con un <b>foglio conduttore</b> tenuto al potenziale che $\Sigma$ aveva: <b>non cambia assolutamente nulla</b>, né il campo né il potenziale, perché le condizioni che il conduttore impone — equipotenzialità e campo normale — erano già soddisfatte. Si è così fabbricato un problema con conduttori <i>partendo dalla sua soluzione</i>. Il metodo delle immagini è questo processo letto all&rsquo;indietro: data una superficie conduttrice, si cerca quale sistema di cariche fittizie la avrebbe fra le proprie equipotenziali. <b>Il piano a potenziale zero è il piano mediano di una coppia $+q,-q$</b>, e questa è tutta la scoperta.</p>`},
  {t:'reveal', title:'Quello che lesame chiede: sigma, carica totale, forza', tag:'esame', steps:[
   {label:'La densita indotta', body:R`
   <p>Sul piano il campo è perpendicolare e vale, sommando i due contributi a distanza $r$ dal piede della perpendicolare,
   $$E_z(r)=-\frac{2}{4\pi\varepsilon_0}\frac{qd}{(r^{2}+d^{2})^{3/2}},$$
   e per il teorema di Coulomb $\sigma=\varepsilon_0E_z$:
   $$\sigma(r)=-\frac{qd}{2\pi(r^{2}+d^{2})^{3/2}}.$$
   <b>Negativa ovunque</b> (se $q>0$), massima in modulo sotto la carica, e decadente come $r^{-3}$.</p>`},
   {label:'La carica totale indotta, e il controllo che chiude', body:R`
   <p>Si integra su tutto il piano in coordinate polari, $dA=2\pi r\,dr$:
   $$\int_0^{\infty}\sigma(r)\,2\pi r\,dr=-q.$$
   <b>Esattamente $-q$</b>, e non è un caso: il piano a terra è in <b>induzione completa</b> con la carica, cioè tutte le linee di campo che partono da $q$ finiscono sul piano. Questo integrale è il controllo che gli scritti chiedono esplicitamente («si calcoli la carica elettrica totale indotta sul piano conduttore»), e se non viene $-q$ c&rsquo;è un errore in $\sigma$.</p>`},
   {label:'La forza', body:R`
   <p>La forza su $q$ è quella esercitata dall&rsquo;immagine, a distanza $2d$:
   $$F=\frac{q^{2}}{4\pi\varepsilon_0(2d)^{2}}=\frac{q^{2}}{16\pi\varepsilon_0d^{2}},$$
   <b>attrattiva</b>. Nota che è il <i>quarto</i> della forza fra due cariche $q$ e $-q$ a distanza $d$ — l&rsquo;errore tipico è dimenticare che la separazione è $2d$ e non $d$.</p>
   <p><b>Ma la forza «esercitata dall&rsquo;immagine» è un modo di dire, e vale la pena pagare il prezzo di verificarlo.</b> La forza vera su $q$ è quella esercitata dalla <i>carica indotta sul piano</i>, distribuita con la $\sigma(r)$ appena calcolata. Lacava la fa integrare come problema 3.1(a): si prende un anello elementare fra $r$ e $r+dr$, si tiene solo la componente lungo l&rsquo;asse — le componenti radiali si cancellano per simmetria — e si somma su tutto il piano:
   $$F=\int_0^{\infty}\frac{1}{4\pi\varepsilon_0}\frac{q\,\sigma(r)}{d^{2}+r^{2}}\cdot\frac{d}{\sqrt{d^{2}+r^{2}}}\,2\pi r\,dr=-\frac{q^{2}}{16\pi\varepsilon_0d^{2}}.$$
   <b>Esce lo stesso numero</b>, segno compreso. Non era scontato che dovesse: il metodo garantisce che il <i>campo</i> coincida nella regione fisica, e la forza su $q$ dipende dal campo nel punto dove sta $q$ — quindi in realtà sì, era garantito. Il valore del conto non è la sorpresa: è che una volta fatto, non si ha più bisogno di chiedersi se la forza dell&rsquo;immagine sia «reale».</p>`},
   {label:'Lenergia, dove limmagine mente — e i due modi di scoprirlo', body:R`
   <p>Qui il metodo delle immagini fa una cosa che non fa altrove: <b>dà il risultato sbagliato per una grandezza</b>, e conviene vedere esattamente dove e perché. Griffiths la mette in guardia in un paragrafo che apre con «Attenzione» (p. 124): «è facile farsi trasportare e dare per scontato che <i>tutto</i> sia uguale nei due problemi. L&rsquo;energia, però, non è uguale.»</p>
   <p>Per due cariche puntiformi $+q$ e $-q$ a distanza $2d$, senza conduttore, l&rsquo;energia di interazione in modulo è
   $$W_{\text{coppia}}=\frac{q^{2}}{8\pi\varepsilon_0d},$$
   mentre per la carica davanti al piano conduttore è la <b>metà</b>. Griffiths dà due argomenti indipendenti, e servono entrambi perché illuminano cose diverse.</p>
   <p><b>Primo argomento, dal campo.</b> L&rsquo;energia è $\frac{\varepsilon_0}{2}\int E^{2}\,d\tau$. Nel problema delle due cariche contribuiscono sia la regione $z>0$ sia la $z<0$, e per simmetria contribuiscono in parti uguali. Nel problema vero, invece, il campo è diverso da zero <b>solo nel semispazio $z>0$</b>: dentro il metallo è nullo. Stesso integrando, metà del dominio, metà dell&rsquo;energia. Questo argomento è compatto ma non dice <i>dove sia finita</i> l&rsquo;altra metà.</p>
   <p><b>Secondo argomento, dal lavoro, ed è quello che spiega.</b> Si porta $q$ dall&rsquo;infinito fino a distanza $d$ dal piano, opponendosi alla forza attrattiva. Il lavoro è
   $$\int_d^{\infty}\frac{1}{4\pi\varepsilon_0}\frac{q^{2}}{4z^{2}}\,dz=\frac{q^{2}}{16\pi\varepsilon_0d},$$
   esattamente la metà di $W_{\text{coppia}}$. E la frase di Griffiths che chiude la questione è questa: <b>«mentre muovo $q$ verso il conduttore, faccio lavoro soltanto su $q$. È vero che della carica indotta si sta spostando lungo il conduttore, ma questo non mi costa niente, perché tutto il conduttore è a potenziale zero.»</b> Nel problema delle due cariche, invece, se le porto dentro contemporaneamente faccio lavoro su <i>entrambe</i>, e il totale è doppio.</p>
   <div class="note"><b>La regola da portarsi via, e dice più di quanto sembri.</b> L&rsquo;immagine riproduce il <b>campo</b> nella regione fisica — quindi riproduce tutto ciò che è una funzione <i>locale</i> del campo in quella regione: forze, densità di carica, potenziali, momenti. Non riproduce le grandezze che si ottengono <b>integrando su tutto lo spazio</b>, perché «tutto lo spazio» è diverso nei due problemi. L&rsquo;energia è la prima di queste grandezze, e nel caso del piano il fattore è esattamente $\tfrac12$ per simmetria; <b>per un&rsquo;altra geometria il fattore non è $\tfrac12$</b> e va ricalcolato — con la sfera, per esempio, le due regioni non sono congruenti. Ricordare «è la metà» invece di «è l&rsquo;integrale sulla regione fisica» è il modo di sbagliare l&rsquo;esercizio sulla sfera.</div>`}
  ]},
  {t:'plot', title:'La carica indotta sul piano: dove si concentra, e quanto vale in tutto',
   intro:R`$\sigma(r)$ in unità di $q/d^2$, con $d=1$. In tratteggio il contributo cumulato $\int_0^r\sigma\,2\pi r'dr'$, cioè quanta carica è già stata raccolta entro il raggio $r$.`,
   plots:[
    {kind:'func2d', xr:[0,6], yr:[-1.05,0.12], height:350,
     title:'sigma(r) e la carica cumulata: meta della carica indotta sta entro r = 1.7 d',
     xlabel:'r / d', ylabel:'in unita di q',
     curves:[
      {f:'-1/(2*PI*pow(1+x*x,1.5))*6.2832', col:'#5eead4', width:2.4, label:'sigma(r) (scalata)'},
      {f:'-(1-1/sqrt(1+x*x))', col:'#d8a13a', width:2.2, dash:true, label:'carica raccolta entro r'}
     ],
     segs:[{x1:0, y1:-1, x2:6, y2:-1, col:'#ff6b6b', dash:true, width:1.4, label:'-q: il totale', lx:4.2, ly:-0.94},
           {x1:0, y1:0, x2:6, y2:0, col:'#4d5a6b', width:1},
           {x1:1.732, y1:-0.5, x2:1.732, y2:0, col:'#b98cff', dash:true, width:1.3, label:'meta della carica', lx:1.8, ly:-0.28}],
     marks:[{x:0, y:-1, label:'sigma massima sotto la carica', col:'#5eead4', up:true},
            {x:1.732, y:-0.5, label:'r = 1.73 d', col:'#b98cff'}]}
   ],
   leggi:R`La curva piena mostra che la carica indotta è <b>concentrata sotto la carica</b> e decade come $r^{-3}$: a tre $d$ di distanza è già quasi nulla. La tratteggiata è il conto cumulato, e vale $-q\left(1-\frac{1}{\sqrt{1+(r/d)^2}}\right)$: parte da zero, e <b>tende a $-q$</b> — la linea rossa. Questo è il controllo dell&rsquo;esercizio <i>visto</i>: la carica totale indotta è esattamente l&rsquo;opposto di quella che la induce, e ci arriva lentamente, con una coda che si estende molto più in là di dove $\sigma$ sembra ormai trascurabile.<br><br>
   <b>La lettura che vale un esercizio intero</b>: metà della carica indotta sta entro $r\simeq1{,}73\,d$, cioè entro meno di due volte la distanza della carica. Quando un compito chiede «la carica indotta entro un raggio $R$», la risposta è quella formula, e il suo limite per $R\to\infty$ è il controllo che dice se hai sbagliato un fattore.`}
]},

/* ---------------- 06b · LA SFERA, LINVERSIONE ---------------- */
{ num:'06b', title:'La sfera, e la legge di inversione che il piano non lasciava vedere', meta:'immagine per la sfera a terra · isolata · a potenziale fissato · la sfera in campo uniforme · il filo e il cilindro',
  blocchi:[
  {t:'prosa', title:'Perche il piano non bastava', tag:'architettura', html:R`
  <p>Il piano è il caso più semplice del metodo delle immagini, e proprio per questo nasconde la struttura: la posizione dell&rsquo;immagine è la riflessione speculare, la sua carica è l&rsquo;opposta, e la simmetria è così evidente che sembra la regola. <b>Non lo è.</b> Quando il conduttore è una sfera, l&rsquo;immagine non sta nel punto speculare e la sua carica non è $-q$ — e la legge che governa posizione e carica è quella vera, di cui il piano è un caso limite degenere.</p>
  <p>Questo è anche il punto in cui i quattro libri si separano. <b>Lacava</b> dedica alla sfera i §§3.3-3.4 e li svolge per intero, con tutte e quattro le varianti (sfera a terra, isolata e scarica, isolata e carica, a potenziale fissato) e poi con la sfera immersa in un campo uniforme. <b>Griffiths</b> la tratta come Esempio 3.2 e aggiunge l&rsquo;osservazione epistemologica che vale la pena citare. <b>Mazzoldi</b> la nomina e la lascia agli esercizi. <b>Bettini</b> la cita nell&rsquo;elenco delle cose da sapere e non la svolge. Qui si cuce la trattazione di Lacava con il commento di Griffiths.</p>`},
  {t:'reveal', title:'La carica puntiforme davanti a una sfera a terra', tag:'costruzione', steps:[
   {label:'Il conto diretto, e cosa lo fa chiudere', body:R`
   <p>Una carica $q$ sta a distanza $a$ dal centro di una sfera conduttrice di raggio $R<a$, <b>messa a terra</b>. Per simmetria l&rsquo;immagine va cercata sulla retta che unisce $q$ al centro, a distanza $b$ dal centro, con carica $q'$ da determinare. La condizione è che il potenziale dei due punti si annulli <i>su tutta</i> la superficie sferica.</p>
   <p>Lacava imposta il conto con il teorema del coseno. Detto $\theta$ l&rsquo;angolo fra la direzione di $q$ e il punto considerato sulla sfera, le due distanze sono $R_1=\sqrt{a^{2}+R^{2}-2aR\cos\theta}$ e $R_2=\sqrt{R^{2}+b^{2}-2bR\cos\theta}$. Imponendo $V=0$ e ponendo $q'=-yq$, cioè $yR_1=R_2$, si eleva al quadrato e si raccoglie: resta un&rsquo;espressione costante da una parte e un multiplo di $\cos\theta$ dall&rsquo;altra.</p>
   <p><b>Qui sta il momento in cui il metodo funziona o non funziona</b>, e vale la pena fermarsi: la relazione deve valere <i>per ogni</i> valore di $\cos\theta$, perché il potenziale deve annullarsi su tutta la sfera e non in qualche punto. Due espressioni che dipendono da $\cos\theta$ in modo diverso possono coincidere per ogni $\cos\theta$ solo se <b>entrambi i coefficienti sono nulli separatamente</b>. Si ottengono così <i>due</i> equazioni per le <i>due</i> incognite $y$ e $b$:
   $$y^{2}a^{2}+y^{2}R^{2}-R^{2}-b^{2}=0,\qquad y^{2}a-b=0.$$
   Il sistema ha soluzione, e <i>questo</i> è il miracolo: non la geometria, ma il fatto che il numero di condizioni al contorno indipendenti sia esattamente il numero di parametri liberi dell&rsquo;immagine. La seconda equazione dà $y^{2}=b/a$; sostituendola nella prima, il membro di sinistra si fattorizza in
   $$\frac{(a-b)(ab-R^{2})}{a},$$
   e i suoi due zeri sono le due soluzioni del problema.</p>
   <p>Le soluzioni sono dunque due: $b=a$ con $q'=-q$, che pone l&rsquo;immagine <b>sopra la carica</b> e dà potenziale nullo in tutto lo spazio (soluzione banale, da scartare), e la soluzione vera
   $$b=\frac{R^{2}}{a},\qquad q'=-q\,\frac{R}{a}.$$
   Fuori dalla sfera il potenziale è la somma dei due contributi, e dentro il conduttore è nullo come sulla superficie. Si verifica infatti che, con quei valori,
   $$\frac{q}{\sqrt{a^{2}+R^{2}-2aR\cos\theta}}-\frac{qR/a}{\sqrt{R^{2}+R^{4}/a^{2}-2(R^{2}/a)R\cos\theta}}=0$$
   identicamente in $\theta$.</p>`},
   {label:'La ragione geometrica, che e la cosa da ricordare', body:R`
   <p>C&rsquo;è un modo di ottenere lo stesso risultato senza algebra, e Lacava lo mette in nota come «soluzione più elegante»: <b>la superficie sferica è il luogo dei punti le cui distanze da due punti dati stanno in rapporto costante.</b> È una proprietà classica — in due dimensioni è il cerchio di Apollonio — e dice tutto, perché la condizione di potenziale nullo chiede precisamente che il rapporto $R_2/R_1$ sia <b>costante</b> su tutta la superficie, con valore pari a $-q'/q$. Quindi il luogo dove il potenziale di due cariche puntiformi di segno opposto si annulla <b>è</b> una sfera, automaticamente, e il problema si riduce a scegliere i due punti perché quella sfera sia la nostra. Imponendo l&rsquo;uguaglianza del rapporto nei due punti diametralmente opposti — il più vicino a distanza $a-R$ dalla carica e il più lontano a distanza $a+R$ — si legge subito che il rapporto vale $R/a$, e da lì $b=R^{2}/a$ e $q'=-qR/a$.</p>
   <p><b>La legge $b\,a=R^{2}$ ha un nome: è l&rsquo;inversione rispetto alla sfera.</b> Manda il punto a distanza $a$ nel punto a distanza $R^{2}/a$ sulla stessa semiretta: il fuori nel dentro, l&rsquo;infinito nel centro, e la sfera in sé stessa. Vale la pena vederla come la regola generale di cui il piano è il caso degenere — quando $R\to\infty$ con la carica a distanza $d$ dalla superficie, l&rsquo;inversione diventa la riflessione e il rapporto $R/a\to1$ restituisce $q'=-q$. <b>Il piano era un caso particolare dell&rsquo;inversione, non il contrario.</b></p>
   <p>E qui entra il commento di <b>Griffiths</b> (p. 125), che è onesto in un modo in cui i libri raramente sono: «questa soluzione è deliziosamente semplice, ma straordinariamente fortunata. Nel metodo delle immagini c&rsquo;è tanta arte quanta scienza, perché bisogna in qualche modo <i>farsi venire in mente</i> il problema ausiliario giusto. La prima persona che lo ha risolto così non poteva sapere in anticipo quale carica immagine usare né dove metterla. Presumibilmente partì da una carica arbitraria in un punto arbitrario dentro la sfera, calcolò il potenziale sulla sfera, e <i>poi</i> scoprì che con $q'$ e $b$ giusti il potenziale si annulla. <b>Ma è davvero un miracolo che una qualunque scelta funzioni: con un cubo invece di una sfera, per esempio, nessuna carica singola in nessun punto interno renderebbe nullo il potenziale sulla superficie.</b>»</p>
   <div class="note"><b>Perché questo non è aneddotica.</b> Dice esattamente qual è il dominio del metodo: funziona sulle superfici che sono <i>luoghi di rapporto costante di distanze</i>, cioè sfere, piani (sfere di raggio infinito) e, in due dimensioni, cilindri circolari. Per tutto il resto non esiste un&rsquo;immagine puntiforme, e il problema di Dirichlet va attaccato in un altro modo — sviluppi in armoniche, funzioni di Green, metodi numerici. <b>Se all&rsquo;esame il conduttore non è una sfera, un piano o un cilindro, non stai cercando un&rsquo;immagine.</b></div>`},
   {label:'La forza, e i due limiti che la convalidano', body:R`
   <p>La forza su $q$ è quella esercitata dall&rsquo;immagine, posta a distanza $a-b$ dalla carica, cioè a distanza $a-R^{2}/a$:
   $$F=\frac{1}{4\pi\varepsilon_0}\frac{q\,|q'|}{(a-b)^{2}}=\frac{1}{4\pi\varepsilon_0}\frac{q^{2}Ra}{(a^{2}-R^{2})^{2}},$$
   <b>sempre attrattiva</b>, come dev&rsquo;essere: la sfera a terra si carica del segno opposto. Due controlli.</p>
   <p><b>Primo, la carica lontana.</b> Per $a\gg R$ il denominatore va come $a^{4}$ e la forza come $q^{2}R/a^{3}$: <b>decade come la terza potenza</b>, non la seconda. È la firma di un&rsquo;interazione carica-dipolo, e il motivo è chiaro — da lontano la sfera appare come un dipolo indotto, il cui momento è proporzionale al campo che lo induce, cioè a $1/a^{2}$. Carica per dipolo indotto dà sempre $1/a^{3}$ di forza, ed è la stessa potenza con cui un atomo neutro viene attratto da uno ione.</p>
   <p><b>Secondo, la carica vicina.</b> Per $a\to R$ la forza diverge, e il modo in cui diverge è il controllo: posto $a=R+s$ con $s\ll R$, il denominatore $(a^{2}-R^{2})^{2}\simeq(2Rs)^{2}$ e la forza tende a $q^{2}/16\pi\varepsilon_0s^{2}$. <b>È esattamente la formula del piano</b>, con $s$ al posto di $d$: da vicinissimo la sfera è un piano, e il metodo lo sa.</p>`},
   {label:'Le tre varianti, che sono quelle che cadono negli scritti', body:R`
   <p>La sfera <b>a terra</b> è il caso base. Le altre tre si ottengono tutte aggiungendo una <b>seconda immagine nel centro</b>, e la ragione è sempre la stessa: una carica nel centro produce sulla superficie sferica un potenziale <i>costante</i>, quindi non rovina la condizione al contorno — sposta soltanto il valore del potenziale della sfera. Lacava le elenca così:</p>
   <ul>
    <li><b>Sfera isolata e inizialmente scarica.</b> La carica totale sulla sfera deve restare nulla, ma l&rsquo;immagine $q'$ rappresenta la carica indotta: serve dunque una carica aggiuntiva $q''=-q'=+qR/a$, <b>uniformemente distribuita</b>, cioè equivalente a una carica puntiforme nel centro. Il potenziale della sfera non è più zero ma $V_0=q''/4\pi\varepsilon_0R$.</li>
    <li><b>Sfera isolata con carica $Q$ preesistente.</b> Stessa logica: la carica da distribuire uniformemente è $q''=Q-q'$.</li>
    <li><b>Sfera tenuta a potenziale $V_0$ da un generatore.</b> Qui si fissa il potenziale e si lascia libera la carica: la seconda immagine è $q''=4\pi\varepsilon_0RV_0$, quella che da sola porterebbe la sfera a $V_0$.</li>
   </ul>
   <p>In tutti e tre i casi <b>la forza su $q$ è la somma delle forze esercitate da $q'$ e da $q''$</b>, e le due hanno in generale segno opposto. Da qui esce il risultato che Griffiths mette come problema 3.8 e che spiazza chi lo incontra la prima volta: una <b>sfera conduttrice neutra</b> attira comunque una carica puntiforme. Non c&rsquo;è carica netta, ma c&rsquo;è carica indotta <i>vicina</i> (negativa, sul lato della carica) e carica compensante <i>lontana</i> (positiva, distribuita su tutta la sfera, equivalente al centro): la vicina vince, e il saldo è attrattivo. <b>È il motivo per cui un oggetto carico attira qualunque conduttore neutro</b>, e il palloncino sfregato attacca al muro.</p>
   <div class="note"><b>Il contrasto con il piano, che è la cosa più facile da sbagliare.</b> Davanti al piano a terra l&rsquo;induzione è <b>completa</b>: la carica totale indotta è esattamente $-q$, perché tutte le linee di campo che partono da $q$ finiscono sul piano. Davanti alla sfera a terra <b>non lo è</b>: la carica totale indotta è $q'=-qR/a$, cioè solo una frazione $R/a$ di $q$. La ragione geometrica è visibile — la sfera intercetta solo una parte dell&rsquo;angolo solido visto da $q$, e le linee restanti scappano all&rsquo;infinito. <b>Se un esercizio sulla sfera a terra ti dà carica indotta $-q$, hai usato la ricetta del piano su una geometria che non la ammette.</b></div>`}
  ]},
  {t:'prosa', title:'La sfera conduttrice in un campo uniforme: il problema piu usato di tutti', tag:'esame', html:R`
  <p>Questo è il problema che compare in elettrostatica, in magnetostatica, nei dielettrici, nella fluidodinamica potenziale e nella teoria dello scattering, sempre con la stessa soluzione. Lacava (§3.4) lo ottiene dal risultato precedente con un passaggio al limite elegante: <b>un campo uniforme è quello che si vede a metà strada fra due cariche opposte molto lontane</b>. Si mette la sfera fra una carica $+q$ in $z=-d$ e una $-q$ in $z=+d$, si scrive per ciascuna la sua immagine secondo la regola dell&rsquo;inversione, e poi si manda $d\to\infty$ tenendo fisso il campo al centro.</p>
  <p>Nel limite, le due immagini — di carica $\mp qR/d$ e posizione $\mp R^{2}/d$ — si avvicinano fino a fondersi: <b>restano a distanza infinitesima l&rsquo;una dall&rsquo;altra con carica finita, cioè diventano un dipolo puntiforme</b> nel centro della sfera. Imponendo che il campo lontano valga $E_0$ si fissa tutto, e il risultato è una delle formule più riutilizzate della fisica:
  $$V(r,\theta)=-E_0\left(r-\frac{R^{3}}{r^{2}}\right)\cos\theta.$$
  Il primo termine è il potenziale del campo uniforme, $-E_0z$; il secondo è il potenziale di un dipolo di momento $p=4\pi\varepsilon_0R^{3}E_0$ nel centro. <b>Si annulla su $r=R$ per costruzione</b>, che è la condizione al contorno.</p>
  <p>Derivando si ottengono le due componenti del campo:
  $$E_r=-\frac{\partial V}{\partial r}=E_0\left(1+\frac{2R^{3}}{r^{3}}\right)\cos\theta,\qquad E_\theta=-\frac1r\frac{\partial V}{\partial\theta}=-E_0\left(1-\frac{R^{3}}{r^{3}}\right)\sin\theta,$$
  e sulla superficie accade quello che deve: <b>la componente tangente si annulla</b>, $E_\theta\to0$ per $r\to R$, cioè il campo arriva perpendicolare al conduttore, mentre la radiale vale
  $$E_r\to3E_0\cos\theta.$$
  <b>Tre volte il campo esterno ai poli.</b> Questo fattore $3$ è il numero da ricordare di tutta la tappa: una sfera conduttrice in un campo uniforme <b>triplica</b> il campo nel punto in cui la sua superficie è perpendicolare al campo esterno. È il legame quantitativo con il potere dispersivo delle punte della tappa 02 — una protuberanza sferica su una superficie piana dà un fattore $3$, una punta più affilata dà molto di più — ed è il motivo per cui le scariche partono dalle irregolarità e non dalle superfici lisce.</p>
  <p>Dal teorema di Coulomb segue immediatamente la densità indotta,
  $$\sigma(\theta)=3\varepsilon_0E_0\cos\theta,$$
  positiva su un emisfero e negativa sull&rsquo;altro. Due controlli chiudono il problema e sono quelli che gli scritti chiedono. <b>La carica totale è nulla</b>: integrando $\sigma$ su tutta la sfera, $\int_0^{\pi}3\varepsilon_0E_0\cos\theta\cdot2\pi R^{2}\sin\theta\,d\theta=0$, come dev&rsquo;essere perché la sfera è neutra e il campo esterno non le porta carica. <b>Il momento di dipolo invece non è nullo</b>, e si ottiene pesando $\sigma$ con $R\cos\theta$:
  $$\int_0^{\pi}3\varepsilon_0E_0\cos\theta\cdot R\cos\theta\cdot2\pi R^{2}\sin\theta\,d\theta=4\pi\varepsilon_0E_0R^{3},$$
  cioè esattamente il $p$ letto dal potenziale. <b>Le due strade coincidono</b>: il dipolo che si legge nel termine $R^{3}/r^{2}$ del potenziale è lo stesso che si ottiene integrando la carica che davvero sta sulla superficie.</p>
  <div class="note"><b>Perché la polarizzabilità di una sfera conduttrice è il suo volume (a meno di $4\pi\varepsilon_0$).</b> Da $p=4\pi\varepsilon_0R^{3}E_0$ si legge $\alpha=4\pi\varepsilon_0R^{3}$, cioè $3\varepsilon_0$ per il volume della sfera. È un risultato con una portata sproporzionata rispetto al conto che lo produce: dice che la risposta di un conduttore a un campo esterno è governata dalla sua <b>taglia geometrica</b> e non dal materiale — un conduttore perfetto non ha parametri da misurare. È il limite verso cui tende la polarizzabilità di una sferetta dielettrica quando la costante dielettrica diverge, ed è anche il motivo per cui le sezioni d&rsquo;urto di scattering di onde lunghe su oggetti conduttori dipendono dal volume al quadrato.</div>`},
  {t:'plot', title:'La sfera conduttrice nel campo uniforme: le equipotenziali e il campo che arriva perpendicolare',
   intro:R`A sinistra le curve di livello di $V=-E_0\left(r-\dfrac{R^{3}}{r^{2}}\right)\cos\theta$ in una sezione che contiene l&rsquo;asse; a destra lo stesso campo disegnato come campo vettoriale. Unità $R=1$, $E_0=1$, e dentro la sfera è imposto $V=0$ perché quello è il valore vero.`,
   plots:[
    {kind:'contour', f:'(hypot(x,y)<1 ? 0 : -x + x/pow(hypot(x,y),3))', xr:[-3,3], yr:[-2.2,2.2], height:330,
     title:'equipotenziali: la sfera e la superficie V=0, e lontano tornano piani paralleli',
     levels:[-2.4,-1.8,-1.2,-0.6,-0.3,0.3,0.6,1.2,1.8,2.4], col:'#5eead4', label:'V = cost',
     rings:[{r:1, x:0, y:0, col:'#ff6b6b', width:2.6, label:'la sfera: r = R, V = 0', lx:0, ly:1.62}]},
    {kind:'field2d', fx:'(hypot(x,y)<1 ? 0 : (1+2/pow(hypot(x,y),3))*x*x/(x*x+y*y) + (1-1/pow(hypot(x,y),3))*y*y/(x*x+y*y))',
     fy:'(hypot(x,y)<1 ? 0 : 3*x*y/pow(hypot(x,y),5))', xr:[-3,3], yr:[-2.2,2.2], n:17, height:330,
     title:'il campo: perpendicolare alla sfera, tre volte piu intenso ai poli, nullo allequatore',
     rings:[{r:1, x:0, y:0, col:'#ff6b6b', width:2.6}],
     marks:[{x:1, y:0, label:'qui E = 3E0', col:'#d8a13a', up:true},
            {x:0, y:1, label:'qui E = 0', col:'#b98cff', up:true}]}
   ],
   leggi:R`<b>Nella figura di sinistra ci sono tre cose da vedere.</b> Primo: la circonferenza rossa è la superficie del conduttore, dove $V$ vale zero, e <b>le equipotenziali vicine le si avvolgono attorno</b> invece di attraversarla — è questo che significa «condizione al contorno soddisfatta». Il livello zero stesso non è tracciato: coincide con la sfera e con il piano equatoriale, dove il disegno è già marcato in rosso. Secondo: lontano dalla sfera le equipotenziali tornano <b>rette parallele equispaziate</b>, perché il termine $R^{3}/r^{2}$ muore come $1/r^{2}$ e resta solo $-E_0z$: la perturbazione prodotta da un conduttore è locale, e già a due o tre raggi è quasi invisibile. Terzo: <b>le equipotenziali si infittiscono ai poli</b> e si allargano all&rsquo;equatore, e l&rsquo;infittirsi delle equipotenziali <i>è</i> il campo più intenso — il fattore $3$ si vede, non si ricorda.<br><br>
   <b>Nella figura di destra si legge il teorema di Coulomb.</b> Le frecce hanno tutte la stessa lunghezza — il motore le normalizza — e l&rsquo;intensità è nel <b>colore</b>: le frecce vicino ai poli passano alla tinta chiara perché lì il modulo supera il valore di soglia, mentre nel campo lontano restano scure a $E_0$. Quello che si legge nella direzione, invece, è il risultato: le frecce arrivano sulla sfera <b>ad angolo retto</b>, in ogni punto, che è la conseguenza (3) della tappa 01 disegnata. All&rsquo;equatore la freccia <b>sparisce</b>, perché il campo è esattamente nullo e il motore non disegna vettori nulli — e lì, dove il campo superficiale è nullo, è nulla anche la densità di carica, coerentemente con $\sigma\propto\cos\theta$. Si vede anche <i>come</i> le linee si riorganizzano: venendo da sinistra si piegano verso la sfera, la toccano perpendicolarmente, ed escono dall&rsquo;altra parte raddrizzandosi. <b>Il controllo che la figura rende immediato</b>: se in un tuo disegno una linea di campo tocca il conduttore obliquamente, la soluzione è sbagliata — e nessun conto serve per accorgersene.`},
  {t:'prosa', title:'Il filo e il cilindro: la stessa legge in due dimensioni', tag:'estensione', html:R`
  <p>Lacava chiude il capitolo (§3.5) con il caso bidimensionale, e vale la pena vederlo perché mostra che l&rsquo;inversione non era una proprietà della sfera. Un filo indefinito con densità lineare $\lambda$ è parallelo, a distanza $d$ dall&rsquo;asse, a un cilindro conduttore indefinito di raggio $R<d$ che porta densità $-\lambda$. Si cerca un <b>filo immagine</b> di densità $-\lambda$ a distanza $x$ dall&rsquo;asse, dentro il cilindro.</p>
  <p>Il potenziale di due fili opposti, misurato rispetto al piano mediano dove si annulla, è
  $$V(r,\theta)=-\frac{\lambda}{2\pi\varepsilon_0}\ln\frac{r_1}{r_2},$$
  con $r_1$ e $r_2$ le distanze dai due fili. La condizione da imporre è che la superficie laterale del cilindro sia equipotenziale, cioè che la componente tangente $E_\theta$ si annulli per $r=R$ a ogni $\theta$; il conto dà l&rsquo;equazione $[R^{2}+x^{2}]d-[R^{2}+d^{2}]x=0$, con la soluzione banale $x=d$ e quella vera
  $$x=\frac{R^{2}}{d}.$$
  <b>È la stessa legge di inversione della sfera</b>, con il raggio del cilindro al posto del raggio della sfera. Sostituendo si trova il potenziale del cilindro, $V(R)=-\dfrac{\lambda}{2\pi\varepsilon_0}\ln\dfrac{d}{R}$, e Lacava sottolinea il risultato generale che ne sta sotto: <b>due fili con densità opposte producono superfici equipotenziali cilindriche</b> — esattamente come due cariche opposte producono superfici equipotenziali sferiche. Il logaritmo al posto dell&rsquo;inverso del raggio, e tutto il resto identico.</p>
  <p><b>E un caso in più che val la pena saper riconoscere, perché è un esercizio classico e non richiede formule nuove:</b> due piani conduttori semi-infiniti a terra che si incontrano ad <b>angolo retto</b>, con una carica $q$ nello spigolo. Qui non basta un&rsquo;immagine: servono <b>tre</b> — le due riflessioni nei due piani, che però da sole non annullano il potenziale sui piani, più la riflessione della riflessione, di segno positivo, nel quadrante opposto. Griffiths lo mette come problema 3.10 e chiude con la domanda giusta: e se l&rsquo;angolo non fosse di $90^\circ$? Il metodo funziona <b>solo</b> per angoli della forma $\pi/n$ con $n$ intero, perché solo allora le riflessioni successive si chiudono in un numero finito di immagini invece di generarne infinite. Un angolo di $60^\circ$ si risolve con cinque immagini; un angolo di $50^\circ$ non si risolve così.</p>`}
]},

/* ---------------- 07 · ESERCIZI ---------------- */
{ num:'07', title:'Esercizi — tocca a te', meta:'tre forme che cadono davvero: gusci concentrici, condensatore che cambia, piano con immagine',
  blocchi:[
  {t:'esercizio', title:'Gusci concentrici con messa a terra',
   src:'forma ricorrente negli scritti 2008-2021 (cfr. 180705)',
   testo:R`Una sfera conduttrice di raggio $R_1$ porta carica $Q$. È circondata da un guscio conduttore fra $R_2$ e $R_3$, <b>messo a terra</b>. Determinare: le cariche su tutte le superfici, il campo in ogni regione, il potenziale della sfera interna, e la capacità del sistema.`,
   steps:[
    {label:'Le cariche', body:R`<p>Faccia interna del guscio ($R_2$): per induzione completa, $-Q$. Faccia esterna ($R_3$): il guscio è <b>a terra</b>, quindi non deve conservare la carica — e poiché per $r>R_3$ il campo deve essere nullo (altrimenti il potenziale non potrebbe valere zero sia su $R_3$ sia all&rsquo;infinito), la carica racchiusa totale è nulla: sulla faccia esterna resta <b>zero</b>.</p>`},
    {label:'Il campo', body:R`<p>$E=0$ per $r<R_1$ (dentro il metallo); $E=\frac{Q}{4\pi\varepsilon_0r^2}$ per $R_1<r<R_2$; $E=0$ nel guscio e <b>anche per $r>R_3$</b>. Il sistema, visto da fuori, è invisibile: è la messa a terra che lo rende tale.</p>`},
    {label:'Potenziale e capacita', body:R`<p>Partendo da $V(R_2)=0$: $V(R_1)=\frac{Q}{4\pi\varepsilon_0}\left(\frac1{R_1}-\frac1{R_2}\right)$. Quindi $C=Q/V(R_1)=\frac{4\pi\varepsilon_0R_1R_2}{R_2-R_1}$: <b>è il condensatore sferico</b>, e $R_3$ non compare. Il guscio esterno a terra ha reso il sistema un condensatore fra $R_1$ e $R_2$, punto.</p>`}
   ]},
  {t:'esercizio', title:'Il condensatore che cambia: isolato o collegato',
   src:'la domanda a due rami, frequentissima',
   testo:R`Un condensatore piano di armature $A$ e distanza $d$ è caricato a tensione $V_0$ e poi <b>scollegato</b>. Si allontanano le armature fino a $2d$. Calcolare la variazione di energia, e il lavoro fatto dall'operatore. Rifare il conto nel caso in cui il condensatore fosse rimasto <b>collegato</b> al generatore.`,
   steps:[
    {label:'Isolato', body:R`<p>$Q=C_0V_0$ resta costante, $C$ dimezza, quindi $U=\frac{Q^2}{2C}$ <b>raddoppia</b>: $\Delta U=+\frac12C_0V_0^2$. Tutto questo lavoro l&rsquo;ha fatto l&rsquo;operatore tirando contro l&rsquo;attrazione fra le armature, e infatti $F=\frac{\varepsilon_0E^2}{2}A$ è costante mentre $E$ non cambia — $L=Fd$ dà lo stesso numero.</p>`},
    {label:'Collegato', body:R`<p>$V_0$ resta costante, $C$ dimezza, quindi $U=\frac12CV_0^2$ <b>dimezza</b>: $\Delta U=-\frac14C_0V_0^2$. Ma il generatore ha <b>riassorbito</b> carica $\Delta Q=-\frac12C_0V_0$, e il bilancio completo richiede di contare anche il lavoro fatto sul generatore. <b>Morale operativa</b>: la domanda «isolato o collegato» va posta <i>prima</i> di scrivere qualunque formula, perché decide quale grandezza tenere fissa — ed è l&rsquo;unica cosa che distingue i due conti.</p>`}
   ]},
  {t:'esercizio', title:'Piano conduttore e carica: la densita e la sua coda',
   src:'cfr. 180621 — «determinare sigma e la carica totale indotta»',
   testo:R`Una carica $q$ è posta a distanza $d$ da un piano conduttore indefinito messo a terra. Determinare $\sigma(r)$, la carica totale indotta, e la frazione di carica indotta che si trova entro un raggio $R$ dal piede della perpendicolare.`,
   steps:[
    {label:'La strada', body:R`<p>Immagine $-q$ in $z=-d$; campo sul piano; $\sigma=\varepsilon_0E_z$; integrazione in polari. La frazione entro $R$ è $$\frac{Q_{\text{ind}}(R)}{-q}=1-\frac{1}{\sqrt{1+(R/d)^{2}}},$$ che per $R\to\infty$ tende a $1$ — il controllo. <b>La figura della tappa 06 è esattamente questa funzione</b>, ed è il motivo per cui conviene guardarla prima di rifare il conto.</p>`}
   ]},
  {t:'esercizio', title:'I due condensatori messi in parallelo, e lenergia che manca',
   src:'Mazzoldi, esempi 4.11 e 4.14 (pp. 107 e 110)',
   testo:R`Due condensatori di capacità $C_1$ e $C_2$ sono caricati separatamente alle differenze di potenziale $V_1$ e $V_2$, con $V_1\neq V_2$, e poi collegati fra loro <b>in parallelo</b> (armatura positiva con positiva). Determinare la differenza di potenziale finale e la variazione di energia elettrostatica del sistema. Commentare il segno del risultato.`,
   steps:[
    {label:'La tensione finale', body:R`<p>Collegate in parallelo, le due coppie di armature diventano <b>due soli conduttori</b>, quindi hanno la stessa differenza di potenziale $V$; la carica totale si conserva, $q_1+q_2$ resta $C_1V_1+C_2V_2$. Da $q=(C_1+C_2)V$:
    $$V=\frac{C_1V_1+C_2V_2}{C_1+C_2},$$
    cioè la <b>media delle tensioni pesata sulle capacità</b>, e quindi un valore intermedio fra $V_1$ e $V_2$. Mazzoldi fa notare che è la stessa ripartizione di due sfere conduttrici messe a contatto: non è un&rsquo;analogia, è lo stesso conto — due conduttori collegati, carica conservata, potenziale comune.</p>`},
    {label:'Lenergia, e il conto che sorprende', body:R`<p>Energia prima: $U_i=\frac12C_1V_1^{2}+\frac12C_2V_2^{2}$. Energia dopo: $U_f=\frac12(C_1+C_2)V^{2}$ con la $V$ appena trovata. Sostituendo e semplificando:
    $$\Delta U=-\frac12\frac{C_1C_2}{C_1+C_2}\,(V_1-V_2)^{2}.$$
    <b>È negativa sempre</b>, qualunque siano le capacità, e si annulla solo se $V_1=V_2$. L&rsquo;energia finale è <i>minore</i> di quella iniziale: collegare due condensatori a tensioni diverse <b>distrugge energia</b>.</p>
    <p><b>Dove va a finire, ed è la domanda che gli scritti pongono subito dopo.</b> Mazzoldi commenta che «lo spostamento delle cariche richiede un lavoro», il che è vero ma non chiude la questione: l&rsquo;elettrostatica da sola <i>non può</i> dire dove sia finita quell&rsquo;energia, perché non contiene alcun meccanismo dissipativo. La risposta sta fuori: durante il collegamento passa una corrente in un filo di resistenza non nulla, e l&rsquo;energia si dissipa in calore — e il fatto notevole è che $\Delta U$ <b>non dipende dalla resistenza</b>. Con un filo ideale a resistenza zero non si dissiperebbe per effetto Joule, ma il sistema diventerebbe un oscillatore e irradierebbe: l&rsquo;energia uscirebbe comunque, perché il bilancio è imposto dall&rsquo;elettrostatica degli stati iniziale e finale e non dal cammino. <b>È un&rsquo;ottima domanda d&rsquo;orale, e la risposta giusta comincia con «l&rsquo;elettrostatica non basta».</b></p>`}
   ]},
  {t:'esercizio', title:'Le quattro gocce che si fondono',
   src:'Bettini, problema 2.8 (p. 94)',
   testo:R`Quattro gocce d'acqua sferiche identiche vengono portate al potenziale $\varphi$ collegandole al polo positivo di una batteria, e poi scollegate. Le quattro gocce si fondono in una goccia sola. Qual è il potenziale della goccia finale?`,
   steps:[
    {label:'I due invarianti', body:R`<p>Due cose si conservano e una terza no, ed è tutto l&rsquo;esercizio. Si conserva la <b>carica</b>: le gocce sono isolate, quindi la goccia finale porta $Q=4q$ con $q=4\pi\varepsilon_0r\varphi$ la carica di una goccia di raggio $r$. Si conserva il <b>volume</b>, perché l&rsquo;acqua è incomprimibile, e quattro sfere di raggio $r$ danno una sfera di raggio $R=4^{1/3}r$. <b>Non</b> si conserva l&rsquo;energia, e nemmeno il potenziale — che è l&rsquo;unica grandezza di cui la domanda chiede conto.</p>`},
    {label:'Il conto, e perche il potenziale sale', body:R`<p>La goccia finale è un conduttore sferico isolato di capacità $4\pi\varepsilon_0R$, quindi
    $$V_f=4^{2/3}\varphi\simeq2{,}52\,\varphi.$$
    <b>Il potenziale aumenta di un fattore due e mezzo</b>, e la struttura del risultato si legge: la carica cresce come $4$, la capacità solo come $4^{1/3}$, e il rapporto fa $4^{2/3}$. <b>Il meccanismo generale</b>: fondendo delle gocce si riduce la superficie totale a parità di carica, quindi si concentra la densità superficiale, quindi si alza il campo e con esso il potenziale. È la ragione per cui le gocce cariche in una nuvola, fondendosi, raggiungono campi superficiali sempre più alti — fino alla rigidità dielettrica dell&rsquo;aria.</p>
    <p><b>Il controllo che smaschera l&rsquo;errore tipico:</b> chi risponde $4\varphi$ ha conservato la carica e dimenticato che anche il raggio cresce; chi risponde $\varphi$ ha applicato la regola dei conduttori collegati, che qui non si applica — le gocce <i>non</i> sono collegate alla fine, sono <b>una sola</b>, e l&rsquo;operazione ha cambiato la geometria. Un&rsquo;utile verifica dimensionale: il risultato deve essere un numero puro per $\varphi$, e $4^{2/3}$ lo è.</p>`}
   ]},
  {t:'esercizio', title:'Carica davanti a una sfera a terra: carica indotta e lavoro di estrazione',
   src:'forma composita da Lacava §3.3 e Griffiths es. 3.2 / prob. 3.7',
   testo:R`Una carica $q$ è posta a distanza $a$ dal centro di una sfera conduttrice di raggio $R<a$ messa a terra. Determinare: la carica totale indotta sulla sfera, la forza fra carica e sfera, e il lavoro che serve per portare la carica all'infinito.`,
   steps:[
    {label:'Carica indotta e forza', body:R`<p>L&rsquo;immagine è $q'=-qR/a$ a distanza $R^{2}/a$ dal centro, e la <b>carica totale indotta sulla sfera è esattamente $q'$</b>: la sfera a terra assume la carica che serve a mantenere nullo il potenziale, e quella carica è, per il teorema di unicità, la stessa dell&rsquo;immagine che riproduce il campo esterno. <b>Nota che non è $-q$</b>: l&rsquo;induzione non è completa, e la frazione intercettata è $R/a$. La forza è attrattiva e vale $\dfrac{q^{2}Ra}{4\pi\varepsilon_0(a^{2}-R^{2})^{2}}$.</p>`},
    {label:'Il lavoro, e il fattore un mezzo che ritorna', body:R`<p>Si integra la forza da $a$ all&rsquo;infinito, opponendosi all&rsquo;attrazione:
    $$\int_a^{\infty}\frac{q^{2}Ru}{4\pi\varepsilon_0(u^{2}-R^{2})^{2}}\,du=\frac{q^{2}R}{8\pi\varepsilon_0(a^{2}-R^{2})}.$$
    <b>Due controlli.</b> Primo, il limite $a\to\infty$: il lavoro tende a zero come $1/a^{2}$, coerentemente con una forza che va come $1/a^{3}$. Secondo, e questo è il controllo che vale la pena fare, il limite di <b>sfera grande</b>: posto $a=R+s$ con $s\ll R$, si ha $a^{2}-R^{2}\simeq2Rs$ e il lavoro tende a $q^{2}/16\pi\varepsilon_0s$ — che è <b>esattamente</b> il lavoro per allontanare una carica da un piano conduttore, cioè la metà dell&rsquo;energia della coppia carica-immagine. <b>Il fattore un mezzo della tappa 06 ricompare qui come caso limite</b>, e la sua comparsa è la prova che il conto è giusto: se avessi usato l&rsquo;energia della coppia invece dell&rsquo;integrale della forza, questo controllo avrebbe dato il doppio.</p>`}
   ]}
]},

/* ---------------- 08 · IL SENSO ---------------- */
{ num:'08', title:'Il senso, e le rotte', meta:'cosa chiude, cosa apre, e dove questo movimento riappare in fisica',
  blocchi:[
  {t:'prosa', title:'Cosa lascia in mano', tag:'sintesi', html:R`
  <p><b>A monte.</b> La legge di Gauss e il potenziale erano strumenti generali; qui incontrano la prima <b>condizione al contorno</b> vera — $\vec E=0$ nel metallo, $V$ fissato sulla terra — e da strumenti diventano un metodo che chiude gli esercizi. Ed è anche il punto in cui l&rsquo;elettrostatica smette di essere il calcolo del campo di cariche date e diventa un <b>problema di valori al contorno</b>: non si sa dove stiano le cariche, si sa a che potenziale stanno i conduttori, e sono le cariche l&rsquo;incognita.</p>
  <p><b>Il punto.</b> Un conduttore non è un materiale con proprietà da ricordare: è <b>un vincolo</b>. Tutto ciò che sappiamo sui conduttori è la lista delle conseguenze di quel vincolo, e per questo si può ricostruire in tre righe invece di impararlo.</p>
  <p><b>A valle, e sono tre direzioni fisiche.</b> La prima è <b>riempire il vuoto fra le armature</b>: un isolante polarizzabile al posto del vuoto moltiplica ogni capacità di questa pagina per la sua costante dielettrica, e il fattore fra i tre chilometri di lato del farad nel vuoto e il condensatore da un farad che sta in un cucchiaio è tutto lì. La seconda è prendere sul serio $\varepsilon_0E^2/2$, che qui è comparso <i>due volte per strade indipendenti</i> — come pressione elettrostatica e come densità di energia — e chiedersi se l&rsquo;energia stia davvero nel campo: la risposta arriva quando il campo si stacca dalle sorgenti e se ne va, cioè con le onde. La terza è <b>rimettere in moto le cariche</b>: tutto questo movimento vive sull&rsquo;ipotesi che abbiano finito di muoversi, e appena si lascia un cammino aperto l&rsquo;equilibrio diventa corrente stazionaria — con il tempo di rilassamento della tappa 05 a dire quanto velocemente il conduttore torna all&rsquo;equilibrio se lo si lascia in pace.</p>`},
  {t:'prolessi', title:'Dove riappare questo movimento, nella fisica che farai',
   oggetto:R`<b>Il conduttore come condizione al contorno</b>: una superficie su cui il potenziale è costante e il campo è perpendicolare.`,
   rotte:[
    {dove:'Metodi<br>matematici', txt:R`Il problema «trovare $V$ dato il potenziale sul bordo» è il <b>problema di Dirichlet</b> per l&rsquo;equazione di Laplace, e il metodo delle immagini è il modo elementare di costruirne la <b>funzione di Green</b>: si risolve per una sorgente puntiforme con bordo a zero, e poi si sovrappone. La carica immagine <i>è</i> il termine di bordo della funzione di Green del semispazio, e il teorema di reciprocità di Green della tappa 04b è la sua simmetria $G(x,y)=G(y,x)$.`},
    {dove:'Meccanica<br>quantistica', txt:R`La «particella in una scatola» è lo stesso problema al bordo con un&rsquo;altra equazione: condizioni su una superficie chiusa, spettro discreto di soluzioni. E l&rsquo;effetto Casimir nasce proprio da due piastre conduttrici che impongono condizioni al contorno al campo quantizzato.`},
    {dove:'Fisica dei<br>materiali', txt:R`La distinzione conduttore/isolante che qui è un&rsquo;ipotesi diventa un <b>risultato</b> della teoria a bande: gli elettroni sono liberi se la banda è parzialmente riempita. La schermatura acquista una <b>lunghezza</b> finita (Debye, Thomas-Fermi) invece di essere perfetta e istantanea.`},
    {dove:'Elettronica', txt:R`Ogni coppia di conduttori vicini è un condensatore <b>parassita</b>, e la capacità che qui è un esercizio diventa il limite di velocità dei circuiti reali: caricare quelle capacità costa tempo, ed è il motivo per cui i processori hanno una frequenza massima.`}
   ],
   domanda:R`Di quanto si concentra la carica su una punta, lo sappiamo solo per superfici <b>lisce</b>. Due sfere collegate danno $\sigma\propto1/R$; una sferetta in campo uniforme triplica il campo; e in generale la densità cresce come l&rsquo;inverso del raggio di curvatura. <b>Ma su uno spigolo vero il raggio di curvatura è zero</b> — il bordo di un&rsquo;armatura, l&rsquo;angolo di un parallelepipedo conduttore, la punta di un parafulmine idealizzata come un cono — e tutte le formule di questo movimento rispondono «infinito», che non è una risposta.<br><br>
   <b>Domanda da portare avanti:</b> come si comporta davvero $\sigma$ vicino a uno spigolo conduttore di apertura $\alpha$? L&rsquo;unico modo di saperlo è risolvere l&rsquo;equazione di Laplace nella geometria del cuneo, e la risposta non è né finita né semplicemente infinita: il campo va come una <b>potenza non intera</b> della distanza dallo spigolo, con un esponente che dipende dall&rsquo;angolo. Da un lato questo spiega perché le scariche partono dai bordi e perché gli apparati ad alta tensione si costruiscono arrotondati; dall&rsquo;altro apre una domanda matematica che il teorema di unicità della tappa 04b non vede: <b>la soluzione esiste ed è unica, ma ha derivata infinita sul bordo</b> — in che senso, allora, soddisfa l&rsquo;equazione <i>in ogni punto</i>? È la stessa domanda che in analisi porta alle soluzioni deboli, e in numerica al motivo per cui una mesh va infittita negli angoli.`}
]}

];
