<style>
  :root{
    --bg:#0e1117; --panel:#161b22; --panel2:#1c232d; --border:#2b333d;
    --txt:#eef3f8; --muted:#b9c4d1; --accent:#4c8dff; --accent2:#8fb0ff;
    --ok:#2ea043; --okbg:#10331b; --warn:#d8a13a; --warnbg:#332a10;
    --gram:#5eead4; --grambg:#0f2a26;
    --pro:#b98cff; --probg:#1a1430; --proline:#2a2247; --proedge:#3a2d5c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    font-size:17px;line-height:1.55;}
  a{color:var(--accent2);}
  .banner{background:var(--panel2);border-bottom:1px solid var(--border);color:var(--muted);
    font-size:.8rem;font-weight:600;text-align:center;padding:8px 12px;letter-spacing:.3px;}
  .banner b{color:var(--accent2);}
  .shell{display:flex;max-width:1180px;margin:0 auto;align-items:flex-start;}

  /* ---- SIDEBAR ---- */
  .sidebar{width:280px;flex:0 0 280px;padding:20px 12px 60px;position:sticky;top:0;
    max-height:100vh;overflow-y:auto;border-right:1px solid var(--border);}
  .sidebar h2{font-size:.72rem;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);
    margin:18px 8px 8px;}
  .navitem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:none;
    background:transparent;color:var(--txt);padding:9px 10px;border-radius:8px;cursor:pointer;
    font-size:.9rem;transition:.12s;border:1px solid transparent;}
  .navitem:hover{background:var(--panel2);}
  .navitem.active{background:#13233f;border-color:var(--accent);color:#fff;}
  .navitem .dot{width:7px;height:7px;border-radius:50%;background:transparent;flex:0 0 7px;
    border:1px solid var(--border);}
  .navitem.seen .dot{background:var(--ok);border-color:var(--ok);}
  .navitem .nx{color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto;}

  /* ---- MAIN ---- */
  .main{flex:1 1 auto;min-width:0;padding:24px 30px 90px;max-width:860px;}
  h1{font-size:1.5rem;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:.92rem;margin:0 0 18px;}
  .sfhead{border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:8px;}
  .sfhead h1{font-size:1.55rem;}
  .meta{color:var(--muted);font-size:.82rem;margin-top:6px;}

  .section{margin:26px 0;}
  .section > h3{font-size:1.02rem;color:var(--accent2);margin:0 0 10px;
    display:flex;align-items:center;gap:10px;}
  .section > h3 .tag{font-size:.66rem;font-weight:700;letter-spacing:.4px;background:var(--panel2);
    border:1px solid var(--border);color:var(--muted);padding:2px 8px;border-radius:20px;
    text-transform:uppercase;}
  /* --- blocchi figura --- */
  .section > h3 .tag.plottag{background:#101f2e;border-color:#1f3c57;color:#7ab8e0;}
  .plot-intro{color:var(--muted);font-size:.95rem;margin:0 0 12px;}
  .plot-row{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;
    background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;}
  .plot-row.due .plot-box{flex:1 1 300px;min-width:280px;}
  .plot-box{max-width:560px;}
  .plot-leggi{margin-top:10px;background:var(--panel2);border:1px solid var(--border);
    border-left:3px solid #4a8fc7;border-radius:0 10px 10px 0;padding:11px 14px;
    font-size:.93rem;color:var(--muted);}
  .plot-leggi b{color:#7ab8e0;}
  .plot-err{color:#ff6b6b;font-size:.85rem;}
  .open-body{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
  .open-body p:first-child{margin-top:0;} .open-body p:last-child{margin-bottom:0;}
  .open-body ul{margin:.4em 0;padding-left:1.2em;} .open-body li{margin:.35em 0;}

  .note{background:var(--panel2);border-left:3px solid var(--muted);border-radius:6px;
    padding:9px 12px;margin:12px 0;font-size:.9rem;color:var(--muted);}
  .note b{color:#ff9d6b;}
  .note.warn{background:var(--warnbg);border-left-color:var(--warn);color:#e0b85a;}
  .note.warn b{color:#f0c25a;}

  /* ---- GRAMMATICA ---- */
  .gramwrap{background:var(--grambg);border:1px solid #1f4d47;border-radius:12px;padding:6px 6px;}
  table.gramtab{border-collapse:collapse;width:100%;font-size:.92rem;}
  table.gramtab td{padding:9px 12px;vertical-align:top;border-bottom:1px solid #17332e;}
  table.gramtab tr:last-child td{border-bottom:none;}
  table.gramtab td.gs{white-space:nowrap;color:var(--gram);width:1%;
    border-right:1px solid #17332e;font-variant-numeric:tabular-nums;}
  .section > h3 .tag.gramtag{background:var(--grambg);border-color:#1f4d47;color:var(--gram);}

  /* ---- STRUMENTI (repertorio condiviso: la scheda si apre DENTRO la frase) ----
     Nessun accento nuovo: riusa il verde della grammatica, perche' uno strumento
     richiamato e' grammatica gia' spiegata altrove, non una quinta specie di blocco. */
  .str{color:var(--gram);border-bottom:1px dashed var(--gram);cursor:pointer;}
  .str:hover{background:var(--grambg);}
  .str::after{content:"\2666";font-size:.62em;vertical-align:.42em;margin-left:2px;opacity:.8;}
  .str.aperto::after{content:"\2715";}
  .str.rotto{color:#ff6b6b;border-bottom-color:#ff6b6b;cursor:help;}
  /* la scheda e' uno SPAN in display:block, non un div: i rimandi cadono dentro
     <p>, <li> e celle di tabella, dove un div e' HTML illegale. */
  .strcard{display:block;margin:10px 0;background:var(--grambg);border:1px solid #1f4d47;
    border-left:3px solid var(--gram);border-radius:0 10px 10px 0;padding:10px 14px;font-size:.9rem;}
  .strcard .sh{display:block;font-size:.66rem;font-weight:700;letter-spacing:.5px;
    text-transform:uppercase;color:var(--gram);margin-bottom:7px;}
  .strcard .sr{display:block;margin:5px 0;}
  .strcard .sk{color:var(--gram);font-weight:600;}

  /* ---- PROLESSI (preannuncio fisico) ---- */
  .prowrap{background:var(--probg);border:1px solid var(--proedge);border-radius:12px;padding:4px 4px 8px;}
  .prohead{padding:11px 14px 4px;color:var(--pro);font-size:.72rem;font-weight:700;letter-spacing:.7px;
    text-transform:uppercase;}
  .pro-oggetto{padding:2px 14px 11px;color:var(--muted);font-size:.92rem;border-bottom:1px solid var(--proline);
    margin-bottom:2px;} .pro-oggetto b{color:var(--txt);}
  table.protab{border-collapse:collapse;width:100%;font-size:.92rem;}
  table.protab td{padding:10px 12px;vertical-align:top;border-bottom:1px solid var(--proline);}
  table.protab tr:last-child td{border-bottom:none;}
  table.protab td.pd{white-space:nowrap;color:var(--pro);width:1%;font-weight:700;font-size:.78rem;
    letter-spacing:.3px;text-transform:uppercase;border-right:1px solid var(--proline);line-height:1.3;}
  .pro-domanda{margin:8px 8px 2px;background:#140d26;border:1px solid var(--proedge);
    border-left:3px solid var(--pro);border-radius:8px;padding:10px 14px;font-size:.92rem;}
  .pro-domanda b{color:var(--pro);}
  .section > h3 .tag.protag{background:var(--probg);border-color:var(--proedge);color:var(--pro);}

  /* ---- REVEAL ---- */
  .rsteps{display:flex;flex-direction:column;gap:12px;}
  .rstep{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 18px;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .rlabel{font-size:.7rem;font-weight:700;letter-spacing:.4px;color:var(--accent);
    text-transform:uppercase;margin-bottom:8px;}
  .rstep p:first-of-type{margin-top:0;} .rstep p:last-child{margin-bottom:0;}
  .rstep ul{margin:.4em 0;padding-left:1.2em;}
  .testo{background:#13233f;border:1px solid #2b4877;border-radius:12px;padding:14px 18px;margin-bottom:14px;}
  .testo .src{display:block;font-size:.74rem;font-style:italic;color:var(--accent2);margin-bottom:8px;
    text-transform:uppercase;letter-spacing:.3px;}
  .esame-nota{font-size:.9rem;color:var(--muted);font-style:italic;margin-top:12px;padding-left:12px;
    border-left:3px solid var(--border);}

  .reveal-btn{background:var(--accent);color:#fff;border:none;padding:11px 18px;border-radius:10px;
    font-size:.95rem;font-weight:600;cursor:pointer;margin-top:14px;transition:.12s;}
  .reveal-btn:hover:not(:disabled){background:var(--accent2);}
  .reveal-btn.small{padding:7px 14px;font-size:.85rem;margin-top:0;background:var(--panel2);
    color:var(--accent2);border:1px solid var(--border);}
  .reveal-btn.small:hover:not(:disabled){border-color:var(--accent);}
  .reveal-btn:disabled,.reveal-btn.done{background:var(--panel2);color:var(--muted);
    border:1px solid var(--border);cursor:default;}

  /* ---- COLLAUDO ---- */
  .collaudo-item{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 18px;margin-bottom:12px;}
  .cq{margin-bottom:10px;}
  .ca{margin-top:12px;background:var(--okbg);border:1px solid #235c33;border-radius:8px;
    padding:10px 14px;font-size:.94rem;}
  .ca b{color:#5fd980;}

  /* ---- PREV / NEXT ---- */
  .prevnext{display:flex;justify-content:space-between;gap:12px;margin-top:40px;
    border-top:1px solid var(--border);padding-top:20px;}
  .pnbtn{flex:1 1 0;background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:12px 16px;cursor:pointer;color:var(--txt);text-align:left;transition:.14s;font:inherit;}
  .pnbtn:hover{border-color:var(--accent);background:var(--panel2);}
  .pnbtn.next{text-align:right;}
  .pnbtn .k{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .pnbtn .t{font-weight:600;color:var(--accent2);}
  .pnbtn:disabled{opacity:.35;cursor:default;border-color:var(--border);background:var(--panel);}

  code{background:var(--panel2);border:1px solid var(--border);border-radius:5px;
    padding:1px 5px;font-size:.85em;color:var(--accent2);}
  .katex{font-size:1.02em;color:var(--txt);} .katex-display{margin:.5em 0;overflow-x:auto;overflow-y:hidden;}

  @media(max-width:860px){
    .shell{flex-direction:column;}
    .sidebar{width:100%;flex:none;position:static;max-height:none;border-right:none;
      border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:4px;}
    .sidebar h2{width:100%;} .navitem{width:auto;}
    .main{padding:20px 16px 80px;}
  }
</style>

/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che

var CORSO = 'elettromagnetismo';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["teorema-della-divergenza"] = {"nome":"Teorema della divergenza","riga":"Il flusso uscente da una superficie chiusa è l'integrale della divergenza sul volume che racchiude: $\\oint_{\\partial V}\\mathbf F\\cdot\\hat n\\,dS=\\int_V\\nabla\\cdot\\mathbf F\\,dV$.","serve":"Scambia una domanda sul bordo con una sul volume. A destra c'è la divergenza, che è la densità di sorgente punto per punto; a sinistra il totale che esce. Si usa nei due versi: per calcolare un flusso scomodo con un integrale di volume comodo, e — in fisica soprattutto — per passare da una legge integrale a una legge locale, perché se due integrali di volume coincidono per OGNI volume allora coincidono gli integrandi.","esempio":"Per $\\mathbf F=\\mathbf r=(x,y,z)$ la divergenza vale $3$, quindi sulla palla di raggio $R$ il membro destro è $3\\cdot\\tfrac43\\pi R^{3}=4\\pi R^{3}$; il membro sinistro, calcolato come flusso, è il modulo $R$ per l'area $4\\pi R^{2}$, e dà lo stesso numero.","pieno":{"file":"05-teoremi-integrali.html","tappa":"02","come":"l'enunciato, la dimostrazione a fette e le ipotesi vere sul dominio, nel nucleo dei teoremi integrali"},"qui":{"elettromagnetismo":{"serve":"È il passaggio che trasforma la legge di Gauss integrale nella prima equazione di Maxwell, $\\nabla\\cdot\\mathbf E=\\rho/\\varepsilon_0$, e la conservazione della carica nell'equazione di continuità $\\nabla\\cdot\\mathbf J+\\partial_t\\rho=0$. La mossa è sempre la stessa: si scrive la legge su un volume arbitrario, si porta il flusso dentro come integrale di divergenza, e si osserva che un integrale nullo su OGNI volume obbliga l'integrando a essere nullo. L'arbitrarietà del volume non è un dettaglio: è tutta la dimostrazione.","esempio":"Per il campo di una carica puntiforme, di modulo $\\dfrac{q}{4\\pi\\varepsilon_0r^{2}}$ e diretto radialmente, la divergenza è nulla ovunque tranne nell'origine: in coordinate sferiche la divergenza di un campo radiale si scrive con $\\partial_r\\!\\left(r^{2}E_r\\right)$, e qui $r^{2}E_r$ non dipende da $r$, quindi la derivata fa $0$. Tutta la carica è finita nel punto escluso, ed è esattamente il buco che la $\\delta$ di Dirac serve a riempire."}},"controllo":[{"tipo":"uguale","sinistra":"diff(x,x)+diff(y,y)+diff(z,z)","vale":"3","dove":"esempio","appare":"vale $3$"},{"tipo":"uguale","sinistra":"3*(4/3)*pi*R**3","vale":"4*pi*R**3","dove":"esempio","appare":"4\\pi R^{3}"},{"tipo":"derivata","espr":"r**2*(q/(4*pi*e0*r**2))","rispetto":["r"],"vale":"0","dove":"qui.elettromagnetismo.esempio","appare":"la derivata fa $0$"}]};
STRUM["funzione-armonica"] = {"nome":"Funzione armonica","riga":"Una funzione con laplaciano nullo, $\\nabla^{2}V=0$, cioè che in ogni punto vale esattamente la media dei suoi valori attorno a quel punto.","serve":"A sapere cosa fa una grandezza in una regione dove non ci sono sorgenti, senza risolvere niente. Due proprietà equivalenti fanno tutto il lavoro: la **proprietà della media** — il valore nel centro di una sfera è la media dei valori sulla sfera — e il **principio del massimo**, che ne è il corollario immediato: una funzione armonica non ha né massimi né minimi all'interno, e i suoi estremi stanno sempre sul bordo. Da qui segue l'unicità per il problema di Dirichlet: se due funzioni armoniche coincidono sul bordo, la loro differenza è armonica e nulla sul bordo, dunque ha massimo e minimo nulli, dunque è identicamente nulla. È il teorema che rende lecito *indovinare* una soluzione: trovata una qualsiasi funzione armonica con i dati al contorno giusti, è l'unica.","esempio":"La funzione $V=x^{2}-y^{2}$ è armonica, perché $\\partial^{2}_xV=2$ e $\\partial^{2}_yV=-2$ si cancellano. La proprietà della media si verifica a mano: il valore medio su una circonferenza di raggio $a$ centrata in $(x_0,y_0)$ è $\\dfrac{1}{2\\pi}\\int_0^{2\\pi}\\!\\big[(x_0+a\\cos\\theta)^{2}-(y_0+a\\sin\\theta)^{2}\\big]d\\theta=x_0^{2}-y_0^{2}$, cioè il valore nel centro, e **per ogni** $a$. L'origine è un punto critico, e non è né massimo né minimo: è una sella — che è l'unica cosa che un punto critico di una funzione armonica può essere.","pieno":{"file":"17-edp.html","tappa":"03","come":"la proprietà della media, il principio del massimo e il legame con le funzioni olomorfe, nel nucleo sulle equazioni alle derivate parziali"},"qui":{"elettromagnetismo":{"serve":"Nello spazio vuoto fra i conduttori non c'è carica, quindi il potenziale elettrostatico è armonico: $\\nabla^{2}V=-\\rho/\\varepsilon_0=0$. Tre risultati del corso sono il principio del massimo travestito. **Lo schermo elettrostatico**: la parete di una cavità vuota è tutta allo stesso potenziale $V_0$, e una funzione armonica che vale $V_0$ su tutto il bordo non può avere valori diversi dentro, quindi $V\\equiv V_0$ e $\\vec E=0$ — Gauss da solo non lo dimostrerebbe, perché dice che il flusso è nullo e non che il campo lo è. **Il teorema di Earnshaw**: una carica non può stare in equilibrio stabile in un campo elettrostatico, perché l'equilibrio stabile vorrebbe un minimo interno del potenziale. **L'unicità**, che è ciò che autorizza il metodo delle cariche immagini: si esibisce una configurazione fittizia che riproduce i dati al contorno e si dichiara chiusa la questione.","esempio":"Perché la cavità sia schermata serve che sia **vuota**. Se dentro c'è una carica $q$, nella cavità $\\rho\\neq0$, il potenziale non è armonico lì e il principio del massimo non si applica: il campo nella cavità vale $\\dfrac{q}{4\\pi\\varepsilon_0r^{2}}$, come se il conduttore non esistesse. Lo schermo funziona in un verso solo, e il verso lo decide proprio l'ipotesi di armonicità."}},"controllo":[{"tipo":"uguale","sinistra":"diff(x**2-y**2,x,2)+diff(x**2-y**2,y,2)","vale":"0","dove":"riga","appare":"\\nabla^{2}V=0"},{"tipo":"uguale","sinistra":"diff(1/sqrt(x**2+y**2+z**2),x,2)+diff(1/sqrt(x**2+y**2+z**2),y,2)+diff(1/sqrt(x**2+y**2+z**2),z,2)","vale":"0","dove":"qui.elettromagnetismo.serve","appare":"\\nabla^{2}V=-\\rho/\\varepsilon_0=0"},{"tipo":"uguale","sinistra":"(q/(4*pi*e0*r**2))*4*pi*r**2","vale":"q/e0","ipotesi":{"q":"positive","e0":"positive","r":"positive"},"dove":"qui.elettromagnetismo.esempio","appare":"\\dfrac{q}{4\\pi\\varepsilon_0r^{2}}"},{"tipo":"derivata","espr":"x**2-y**2","rispetto":["x","x"],"vale":"2","dove":"esempio","appare":"\\partial^{2}_xV=2"},{"tipo":"derivata","espr":"x**2-y**2","rispetto":["y","y"],"vale":"-2","dove":"esempio","appare":"\\partial^{2}_yV=-2"},{"tipo":"integrale","espr":"((x0+a*cos(theta))**2-(y0+a*sin(theta))**2)/(2*pi)","var":"theta","da":"0","a":"2*pi","vale":"x0**2-y0**2","dove":"esempio","appare":"=x_0^{2}-y_0^{2}"}]};
STRUM["flusso-di-un-campo"] = {"nome":"Flusso di un campo","riga":"L'integrale $\\iint_S\\mathbf F\\cdot\\hat n\\,dS$: quanta parte del campo attraversa la superficie, contata col segno che l'orientazione stabilisce.","serve":"Traduce «quanto passa attraverso» in un numero, e il numero dipende da due scelte che vanno dichiarate entrambe: la superficie e il verso della normale. Su una superficie chiusa la convenzione è normale uscente, e allora un flusso positivo significa che dentro c'è una sorgente netta. Dove il campo è parallelo alla superficie il contributo è nullo: conta solo la componente normale, mai il modulo.","esempio":"Per il campo radiale $\\mathbf F=\\mathbf r$ sulla sfera di raggio $R$ la normale uscente è $\\hat r$, e la componente normale vale $R$ in ogni punto, costante: il flusso è quel valore per l'area, $\\Phi=R\\cdot4\\pi R^{2}=4\\pi R^{3}$. Per $R=2$ fa $32\\pi$.","pieno":{"file":"03-curve-superfici.html","tappa":"04","come":"la definizione, il ruolo dell'orientazione e l'indipendenza dalla parametrizzazione, nel nucleo su curve e superfici"},"qui":{"elettromagnetismo":{"serve":"Il flusso di $\\mathbf E$ attraverso una superficie chiusa è l'unica cosa che la legge di Gauss controlla: dice quanto esce in totale, non quanto vale $\\mathbf E$ punto per punto. Da un solo numero si risale al campo soltanto se si sa già in che direzione punta e da cosa dipende — e quello lo decide la simmetria della distribuzione, non il teorema. Per questo la superficie si sceglie: dove $\\mathbf E$ è costante e normale, il flusso diventa modulo per area.","esempio":"Per una carica puntiforme $q$ al centro di una sfera di raggio $R$ il campo ha modulo $\\dfrac{q}{4\\pi\\varepsilon_0R^{2}}$ ed è ovunque normale alla sfera, quindi $\\Phi=\\dfrac{q}{4\\pi\\varepsilon_0R^{2}}\\cdot4\\pi R^{2}=\\dfrac{q}{\\varepsilon_0}$: il raggio è sparito. È il motivo per cui la legge di Gauss è una legge e non un conto — vale per qualunque superficie chiusa che racchiuda la carica."}},"controllo":[{"tipo":"uguale","sinistra":"R*4*pi*R**2","vale":"4*pi*R**3","dove":"esempio","appare":"4\\pi R^{3}"},{"tipo":"uguale","sinistra":"4*pi*2**3","vale":"32*pi","dove":"esempio","appare":"32\\pi"},{"tipo":"uguale","sinistra":"q/(4*pi*e0*R**2)*4*pi*R**2","vale":"q/e0","dove":"qui.elettromagnetismo.esempio","appare":"\\dfrac{q}{\\varepsilon_0}"},{"tipo":"derivata","espr":"q/(4*pi*e0*R**2)*4*pi*R**2","rispetto":["R"],"vale":"0","dove":"qui.elettromagnetismo.esempio","appare":"il raggio è sparito"}]};
STRUM["campo-conservativo"] = {"nome":"Campo conservativo","riga":"Un campo che è il gradiente di una funzione, $\\mathbf F=\\nabla U$, e che perciò compie lungo un cammino un lavoro deciso solo dagli estremi.","serve":"Le tre proprietà — esiste un potenziale, il lavoro non dipende dal cammino, la circuitazione su ogni chiusa è nulla — sono equivalenti, e all'esame si usa quella che costa meno. Il rotore nullo è invece una condizione soltanto NECESSARIA: diventa sufficiente unicamente se il dominio è semplicemente connesso, e dimenticare quella clausola è l'errore classico, perché il controesempio non è patologico ma è il campo attorno a un filo.","esempio":"Il campo $\\mathbf F=(2xy,\\,x^{2})$ ha potenziale $U=x^{2}y$, perché $\\partial_xU=2xy$ e $\\partial_yU=x^{2}$; quindi il lavoro da $(0,0)$ a $(1,1)$ vale $U(1,1)-U(0,0)=1$, lungo qualunque cammino si scelga fra i due punti.","pieno":{"file":"04-campi-vettoriali.html","tappa":"05","come":"le tre caratterizzazioni equivalenti, la costruzione del potenziale per integrazione e il ruolo del dominio, nel nucleo sui campi vettoriali"},"qui":{"elettromagnetismo":{"serve":"In elettrostatica $\\mathbf E$ è conservativo, e l'intero apparato del potenziale $V$ poggia su questo: il lavoro per spostare una carica da $A$ a $B$ è $q(V_A-V_B)$ qualunque strada prenda, e solo per questo ha senso parlare di energia potenziale di una configurazione. La proprietà cade appena $\\mathbf B$ varia nel tempo: per Faraday la circuitazione di $\\mathbf E$ su una chiusa vale $-\\dfrac{d\\Phi_B}{dt}$, e un campo con circuitazione non nulla non ammette potenziale scalare.","esempio":"Per la carica puntiforme, il lavoro del campo di Coulomb su una carica di prova unitaria che va da $r_1$ a $r_2$ è $\\displaystyle\\int_{r_1}^{r_2}\\dfrac{q}{4\\pi\\varepsilon_0r^{2}}\\,dr=\\dfrac{q}{4\\pi\\varepsilon_0}\\left(\\dfrac{1}{r_1}-\\dfrac{1}{r_2}\\right)$: dipende solo dai due raggi, e l'angolo percorso non compare da nessuna parte. È la stessa cosa STRUM["gradiente"] = {"nome":"Gradiente","riga":"Il vettore $\\nabla f=(\\partial_xf,\\partial_yf,\\partial_zf)$: punta nella direzione in cui $f$ cresce più in fretta, e il suo modulo è quel tasso di crescita.","serve":"Trasforma una funzione scalare in un campo vettoriale, e lo fa in modo che la derivata di $f$ lungo una direzione $\\hat u$ sia $\\nabla f\\cdot\\hat u$: il gradiente contiene tutte le derivate direzionali in un oggetto solo. La proprietà che si usa per disegnare è l'altra: il gradiente è perpendicolare alle superfici di livello di $f$, quindi conoscere il potenziale basta a sapere dove vanno le linee di campo.","esempio":"Per $f(x,y,z)=x^{2}+y^{2}+z^{2}$ il gradiente è $(2x,2y,2z)$, cioè $2\\mathbf r$: radiale, quindi perpendicolare alle sfere di livello, come dev'essere. Le superfici $f=\\text{cost}$ sono sfere e il gradiente le buca ad angolo retto.","pieno":{"file":"04-campi-vettoriali.html","tappa":"02","come":"l'operatore $\\nabla$, le derivate direzionali e l'ortogonalità ai livelli, nel nucleo sui campi vettoriali"},"qui":{"elettromagnetismo":{"serve":"Il campo elettrostatico è meno il gradiente del potenziale, $\\mathbf E=-\\nabla V$, e il segno meno dice che $\\mathbf E$ punta verso i potenziali decrescenti — dove una carica positiva scivolerebbe da sola. Poiché il gradiente è ortogonale alle superfici di livello, le linee di campo sono ovunque perpendicolari alle equipotenziali: è il modo più rapido per disegnare un campo di cui si conosce il potenziale, e l'unico controllo veloce su un disegno sbagliato.","esempio":"Per la carica puntiforme il potenziale è $V=\\dfrac{q}{4\\pi\\varepsilon_0 r}$, e la componente radiale del campo è $-\\dfrac{dV}{dr}=\\dfrac{q}{4\\pi\\varepsilon_0r^{2}}$: il potenziale va come $1/r$, il campo come $1/r^{2}$, e il quadrato nasce dalla derivata, non da un'ipotesi in più. Chi ricorda solo una delle due formule può sempre ricavare l'altra."}},"controllo":[{"tipo":"derivata","espr":"x**2+y**2+z**2","rispetto":[" function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';
  return h;
}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

/* ---------------- 00 · DI COSA PARLA QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Di cosa parla questo movimento', meta:'Elettromagnetismo · voce B.2 · 80 prove su 100 lo toccano, densita 7.0: e il secondo argomento del corso',
  blocchi:[
  {t:'prosa', title:'Una sola ipotesi, e tutto il resto viene da li', tag:'architettura', html:R`
  <p>Fin qui le cariche stavano dove qualcuno le aveva messe. In un <b>conduttore</b> non è così: le cariche sono <b>libere di muoversi</b>, e si muovono finché possono. L&rsquo;unica ipotesi di questo movimento è che abbiano <b>finito</b> di muoversi — si chiama <b>equilibrio elettrostatico</b> — e si scrive in due caratteri:
  $$\vec E=0\quad\text{dentro il metallo}.$$
  Se non fosse zero, una carica libera sentirebbe una forza e si sposterebbe, e non saremmo all&rsquo;equilibrio. <b>Tutto questo movimento è la lista delle conseguenze di quella riga</b>, e ogni esercizio d&rsquo;esame sui conduttori si risolve ripercorrendo quella lista.</p>
  <p>La misura dice perché conviene farlo bene: <b>80 prove su 100 fra il 2008 e il 2021</b> toccano questo movimento, con densità 7.0 — è il secondo argomento del corso dopo la corrente, e «condensatore» compare <b>232 volte</b> nella banca dati degli scritti. Non è un capitolo di teoria: è metà del compito.</p>`},
  {t:'prosa', title:'Cosa serve gia avere in mano', tag:'dipendenze', html:R`
  <p>Due risultati, e si enunciano qui in due righe perché servono subito. Il primo è il <b>metodo a strati</b>: la legge di Gauss dice che il flusso di $\vec E$ attraverso una superficie chiusa vale la carica racchiusa divisa $\varepsilon_0$, e quando il problema ha una simmetria — sferica, cilindrica, piana — si sceglie una superficie con quella simmetria, su cui il modulo del campo è costante, e il flusso diventa il prodotto campo per area. Si conta la carica dentro, si legge il campo. Qui quel metodo fa il suo terzo tempo e diventa quasi automatico, perché i conduttori aggiungono condizioni che chiudono i conti al posto tuo.</p>
  <p>Il secondo è il <b>potenziale</b> e la sua relazione col campo, $V(b)-V(a)=-\int_a^b\vec E\cdot d\vec\ell$, che esiste perché il campo elettrostatico è conservativo. Serve perché la <b>capacità</b> è un rapporto fra carica e differenza di potenziale, e perché «messo a terra» significa «potenziale fissato a zero», che è la condizione al contorno più frequente degli scritti.</p>`},
  {t:'prosa', title:'I quattro libri, e perche non dicono la stessa cosa', tag:'fonti', html:R`
  <p>Questo movimento è cucito su quattro testi, e vale la pena sapere <b>chi serve a cosa</b>, perché non sono quattro versioni dello stesso capitolo: sono quattro impostazioni diverse, e in due punti si contraddicono.</p>
  <ul>
   <li><b>Mazzoldi-Nigro-Voci</b>, vol. II cap. 4, è la trattazione nella lingua in cui studi, ed è l&rsquo;unica che arriva fino in fondo al <i>problema generale</i>: il §4.11 (pp. 125-126) dichiara che ogni esercizio con conduttori è un <b>problema di Dirichlet</b>, e da lì discende tutto il resto. È anche l&rsquo;unico dei quattro che avverte che «la densità locale di carica è determinata da tutte le cariche presenti» — una precisazione che smonta un fraintendimento del teorema di Coulomb.</li>
   <li><b>Griffiths</b> §§2.5.4 e 3.2 (pp. 104-106, 124-126) è il più rigoroso sui <i>metodi</i>, e ha il pregio raro di dire quando una cosa non è ovvia: a p. 104 si ferma a chiedersi perché raddoppiare $Q$ debba raddoppiare $\sigma$ <i>punto per punto</i> invece di riorganizzare la carica, ammette che con gli strumenti del capitolo 2 non lo sa dimostrare, e rimanda all&rsquo;unicità. La carica immagine, piano <i>e</i> sfera, la tratta per esteso.</li>
   <li><b>Lacava</b>, cap. 3 (pp. 33-46), dedica un capitolo intero al <b>metodo delle immagini</b> con quattro casi svolti — piano, sfera, sfera in campo uniforme, filo e cilindro — e dà la ragione geometrica per cui la sfera funziona, che gli altri tre tacciono. Il §11.4 (p. 166) racconta l&rsquo;esperimento che ha trasformato la gabbia di Faraday in una misura di precisione.</li>
   <li><b>Bettini</b>, vol. 3 §§2.6-2.10 (pp. 81-88), è quello che aggiunge gli <i>ordini di grandezza</i> e il caso generale dei <b>coefficienti di induzione elettrostatica</b>, cioè la matrice che lega cariche e potenziali di $n$ conduttori. È anche il libro in cui un numero stampato non torna, e il punto in cui non torna è segnalato nella tappa 04.</li>
  </ul>
  <div class="note"><b>Come leggere le citazioni che seguono.</b> Dove un passaggio viene da un libro preciso, il libro è nominato <i>nel punto</i> con la pagina. Dove due libri impostano la stessa cosa in modo diverso — e succede due volte, sulla dimostrazione della gabbia e sull&rsquo;energia della carica immagine — <b>sono riportate entrambe le strade</b>, perché la differenza fra le due è contenuto e non ridondanza: una è elementare e si ferma lì, l&rsquo;altra costa di più e generalizza.</div>`}
]},

/* ---------------- 01 · L'EQUILIBRIO ---------------- */
{ num:'01', title:'Lequilibrio elettrostatico: le quattro conseguenze, e sono tutte la stessa', meta:'E=0 dentro · niente carica di volume · superficie equipotenziale · campo perpendicolare alla superficie',
  blocchi:[
  {t:'prosa', title:'Le quattro conseguenze', tag:'first principles', html:R`
  <p>Da $\vec E=0$ nel volume del conduttore seguono quattro fatti, e conviene vederli come <b>uno solo detto in quattro modi</b>, perché all&rsquo;esame si usano indifferentemente.</p>
  <ol>
   <li><b>Nessuna carica netta nel volume.</b> Per la forma locale di Gauss, $\nabla\cdot\vec E=\rho/\varepsilon_0$ — che si ottiene applicando il <span class="str" data-str="teorema-della-divergenza">teorema della divergenza</span> alla legge di Gauss su un volume arbitrario — se $\vec E$ è identicamente nullo in una regione, la sua divergenza è nulla, quindi $\rho=0$ lì dentro. <b>Tutta la carica in eccesso sta sulla superficie</b>, in uno strato di spessore atomico che noi trattiamo come una $\sigma$.</li>
   <li><b>Il conduttore è un volume equipotenziale.</b> Fra due punti qualsiasi del metallo $V(b)-V(a)=-\int\vec E\cdot d\vec\ell=0$. Non solo la superficie: <b>tutto il corpo</b> è allo stesso potenziale, cavità comprese se non contengono cariche.</li>
   <li><b>Il campo esterno è perpendicolare alla superficie.</b> Se avesse una componente tangente, le cariche superficiali scorrerebbero lungo la superficie — e non sarebbe equilibrio. Quindi la superficie di un conduttore è una <b>superficie equipotenziale</b>, e le linee di campo ci arrivano ad angolo retto.</li>
   <li><b>Una cavità vuota è schermata.</b> Dentro una cavità priva di cariche il campo è <b>nullo</b>, qualunque cosa succeda fuori. È la gabbia di Faraday, e la dimostrazione sta nella tappa 05.</li>
  </ol>
  <div class="note"><b>L&rsquo;errore che costa punti, e si vede in ogni correzione:</b> «$\vec E=0$ dentro» vale nel <b>metallo</b>, non nelle cavità e non nei vuoti fra un guscio e l&rsquo;altro. In un sistema a strati il campo è nullo <i>solo</i> negli spessori conduttori, e vivo dappertutto altrove. Chi annulla il campo anche nella cavità perché «è dentro» sbaglia ogni sistema a gusci concentrici — cioè, statisticamente, l&rsquo;esercizio più frequente del corso.</div>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Una carica $+q$ è appesa al centro di una cavità sferica scavata dentro un conduttore neutro. Quanto vale il campo dentro la cavità?`,
    a:R`<b>Non è nullo</b>: vale $\frac{q}{4\pi\varepsilon_0r^2}$ come se il conduttore non ci fosse. La conseguenza (4) richiede una cavità <b>vuota</b>; qui la carica c&rsquo;è. Ciò che il conduttore fa è comparire una carica $-q$ sulla parete interna (perché una gaussiana dentro il metallo deve racchiudere carica netta nulla) e una $+q$ sulla superficie esterna, distribuita con la simmetria della <i>superficie esterna</i> e non con quella della cavità — <b>lo schermo funziona in un verso solo</b>.`},
   {q:R`Perché la carica in eccesso si dispone tutta sulla superficie, e non «un po' anche dentro»?`,
    a:R`Perché $\rho=\varepsilon_0\nabla\cdot\vec E$ e $\vec E\equiv0$ implica $\rho\equiv0$ <b>punto per punto</b>, non «in media». Non è una questione di repulsione fra cariche che le spinge il più lontano possibile — quella è l&rsquo;intuizione, non l&rsquo;argomento — è che un campo identicamente nullo ha divergenza identicamente nulla.`}
  ]},
  {t:'prosa', title:'Se dentro il campo e nullo, che cosa tiene gli elettroni dentro il metallo', tag:'dal macroscopico al microscopico', html:R`
  <p>Qui c&rsquo;è una domanda che il formalismo appena scritto rende urgente e che la maggior parte delle trattazioni salta. Gli elettroni di conduzione, dice <b>Bettini</b> (§3.4), «si muovono liberamente dentro il metallo come un gas», e sulla superficie <i>non ci sono pareti</i>. Dentro il metallo il campo macroscopico è nullo, e nulle sono la densità di volume e quella di superficie in assenza di carica netta. <b>Allora perché il gas di elettroni non evapora?</b></p>
  <p>La risposta di Bettini è che il campo macroscopico non è tutto il campo. In un guscio di spessore atomico attorno alla superficie una frazione degli elettroni esce <i>un poco</i>, a distanze estremamente piccole: si forma uno <b>strato doppio</b> — positivo appena dentro, negativo appena fuori — la cui carica superficiale <i>netta</i> è zero, e che perciò non compare in nessuna delle quattro conseguenze scritte sopra. Fra i due foglietti però il campo esiste, ed è un campo <b>microscopico</b>. L&rsquo;energia che serve a portare un elettrone attraverso quello strato è il <b>lavoro di estrazione</b> del metallo.</p>
  <p>Due conseguenze, e la seconda è sperimentale. Primo: il lavoro di estrazione <b>non entra</b> nell&rsquo;energia elettrostatica macroscopica, quella che calcoleremo nella tappa 04 — è energia di legame del materiale, e quando si dice «energia di un sistema di conduttori» si dà per fatto il lavoro di tenerli assieme a partire dagli atomi. Secondo: essendo prodotto dalla struttura dello strato superficiale, il lavoro di estrazione è una <b>proprietà della superficie e non del volume</b>, e dipende da come la superficie è stata lavorata — da ossidi, umidità, contaminanti. È il motivo per cui due campioni dello stesso metallo danno numeri diversi, e non è un difetto della misura.</p>
  <div class="note"><b>Dove questo torna, e non è un dettaglio da nota a piè di pagina.</b> La distinzione «campo macroscopico nullo, campo microscopico di superficie no» è la stessa che separa l&rsquo;elettrostatica dei conduttori dall&rsquo;effetto fotoelettrico e dall&rsquo;emissione termoionica. E fissa anche il limite di validità di tutto questo movimento: trattiamo $\sigma$ come una funzione liscia su una superficie geometrica, e quella è un&rsquo;astrazione buona su scale grandi rispetto allo strato doppio — cioè su tutto fuorché sullo strato stesso.</div>`},
  {t:'prosa', title:'Il teorema di Earnshaw: perche nessuna carica puo stare in equilibrio stabile', html:R`
  <p>C&rsquo;è un&rsquo;ultima conseguenza dell&rsquo;equilibrio, e Bettini la mette fra i punti da portarsi via dal capitolo (p. 94, punto 6): <b>in un campo elettrostatico non esiste equilibrio stabile per una carica</b>. Non è un enunciato sui conduttori, è un enunciato su $\nabla^2V=0$, e val la pena vederlo perché è il teorema che rende <i>necessari</i> i conduttori: non si può tenere ferma una carica con altre cariche, si può solo tenerla ferma con un vincolo materiale.</p>
  <p>L&rsquo;argomento sta in due righe. Una carica $q>0$ è in equilibrio stabile in un punto $P$ se $V$ ha lì un <b>minimo</b>, cioè se $V$ cresce in <i>tutte</i> le direzioni. Ma in una regione priva di cariche $V$ è <span class="str" data-str="funzione-armonica">armonica</span>, $\nabla^2V=0$: la somma delle tre derivate seconde è nulla, quindi <b>non possono essere tutte e tre positive</b>. Se una direzione sale, un&rsquo;altra scende. Un punto critico di una funzione armonica non è né massimo né minimo: è una <b>sella</b>.</p>
  <p>L&rsquo;esempio che <b>Mazzoldi</b> svolge a p. 125 è il più piccolo possibile e vale più di una dimostrazione generale. Si prenda
  $$V=h(x^{2}-y^{2}),$$
  con $h$ costante. Le derivate seconde sono
  $$\frac{\partial^{2}V}{\partial x^{2}}=2h,\qquad\frac{\partial^{2}V}{\partial y^{2}}=-2h,\qquad\nabla^{2}V=0,$$
  dunque è un potenziale elettrostatico lecito — esiste una configurazione di conduttori che lo realizza. Il campo è $\vec E=-\nabla V=-2h(x,-y)$, che si annulla <b>solo</b> nell&rsquo;origine: una carica messa lì è in equilibrio, e lungo una delle due direzioni ci torna, lungo l&rsquo;altra se ne scappa. <b>Equilibrio instabile, sempre, per costruzione.</b></p>`},
  {t:'plot', title:'Il potenziale a sella: perche lequilibrio elettrostatico di una carica non esiste',
   intro:R`Le curve di livello di $V=h(x^{2}-y^{2})$ con $h=1$, cioè le <b>superfici equipotenziali</b> viste in sezione. L&rsquo;origine è l&rsquo;unico punto dove $\vec E=0$.`,
   plots:[
    {kind:'contour', f:'x*x-y*y', xr:[-2,2], yr:[-1.9,1.9], height:360,
     levels:[-3,-2,-1,-0.35,0,0.35,1,2,3], col:'#5eead4', label:'V = cost',
     grad:{fx:'-2*x', fy:'2*y', label:'il campo E', n:11},
     marks:[{x:0, y:0, label:'E=0: lunico punto di equilibrio', col:'#ff6b6b'}]}
   ],
   leggi:R`<b>Che cosa guardare.</b> Le equipotenziali sono iperboli, e le due rette a $45^\circ$ sono il livello $V=0$: lungo di esse il potenziale non cambia. Le frecce sono $\vec E=-\nabla V$, e si vede subito la cosa che il teorema dice: <b>attorno all&rsquo;origine le frecce entrano da due lati e uscono dagli altri due</b>. Una carica positiva spostata lungo l&rsquo;asse $y$ viene richiamata verso l&rsquo;origine; spostata lungo l&rsquo;asse $x$ viene spinta via. Non esiste un punto del disegno circondato da frecce <i>tutte</i> entranti, e non può esistere: un tale punto sarebbe un minimo di $V$, e $\nabla^2V=0$ lo vieta.<br><br>
   <b>La lettura che vale un esercizio.</b> Questo è anche il disegno del <b>flusso nullo</b>: una qualsiasi curva chiusa attorno all&rsquo;origine ha tanto campo entrante quanto uscente, perché non racchiude carica. Figure come questa sono il modo rapido per smascherare un disegno di linee di campo sbagliato — ed è esattamente il problema 2.6 di Bettini (p. 94), che chiede di trovare <b>sette errori</b> in un disegno di linee di campo attorno a tre conduttori. I due errori che si trovano senza calcolare niente: una linea che parte e arriva sullo stesso conduttore carico, e una linea che non taglia la superficie ad angolo retto.`}
]},

/* ---------------- 02 · IL TEOREMA DI COULOMB ---------------- */
{ num:'02', title:'Il teorema di Coulomb: il campo appena fuori, e perche vale sigma/epsilon0 e non meta', meta:'il cilindretto di Gauss a cavallo della superficie · il confronto col piano infinito · la pressione elettrostatica',
  blocchi:[
  {t:'reveal', title:'La dimostrazione, e il confronto che spiazza', tag:'costruzione', steps:[
   {label:'Il cilindretto', body:R`
   <p>Si prende una superficie gaussiana a forma di pillola, piccolissima, a cavallo della superficie del conduttore: una base dentro il metallo, una appena fuori, e il mantello di altezza trascurabile. Tutto il conto è un <span class="str" data-str="flusso-di-un-campo">flusso</span> spezzato in tre pezzi, due dei quali sono zero.</p>
   <ul>
    <li>base interna: $\vec E=0$, flusso <b>nullo</b>;</li>
    <li>mantello: altezza $\to0$, flusso <b>trascurabile</b>;</li>
    <li>base esterna, area $dA$: il campo è perpendicolare alla superficie (conseguenza 3), quindi il flusso è $E\,dA$.</li>
   </ul>
   <p>La carica racchiusa è $\sigma\,dA$, e Gauss dà $E\,dA=\sigma dA/\varepsilon_0$:
   $$E=\frac{\sigma}{\varepsilon_0}.$$</p>`},
   {label:'Perche NON e sigma su due epsilon', body:R`
   <p>Un piano indefinito con densità superficiale $\sigma$, isolato nello spazio, produce un campo di modulo $E=\dfrac{\sigma}{2\varepsilon_0}$ da entrambi i lati; qui viene il doppio. <b>Non è un errore di fattore: sono due situazioni diverse.</b></p>
   <p>Nel piano isolato il campo esce da <b>entrambi</b> i lati, e la carica $\sigma dA$ si divide fra due flussi. Su un conduttore il campo da una parte è <b>zero</b>: tutta la carica alimenta un flusso solo, che quindi è doppio. Detto altrimenti: il campo appena fuori è la somma di quello prodotto dallo <i>strato locale</i> di carica ($\sigma/2\varepsilon_0$) e di quello prodotto da <b>tutto il resto del sistema</b> ($\sigma/2\varepsilon_0$ anch&rsquo;esso, perché dentro deve cancellare il primo). Fuori i due si sommano e fanno $\sigma/\varepsilon_0$; dentro si sottraggono e fanno zero.</p>`},
   {label:'La pressione elettrostatica, che nasce dalla stessa scomposizione', body:R`
   <p>Quella scomposizione risponde anche a una domanda insidiosa: <b>con quale campo si calcola la forza sulla carica superficiale?</b> Non con $\sigma/\varepsilon_0$ — quel campo include il contributo della carica stessa, che non può spingere se stessa. Con l&rsquo;<b>altro</b> pezzo, $\sigma/2\varepsilon_0$. Quindi la forza per unità di area è
   $$\frac{F}{A}=\sigma\cdot\frac{\sigma}{2\varepsilon_0}=\frac{\sigma^{2}}{2\varepsilon_0}=\frac{\varepsilon_0E^{2}}{2},$$
   ed è <b>sempre verso l&rsquo;esterno</b>: un conduttore carico tende a dilatarsi, qualunque sia il segno della carica. Quel $\varepsilon_0E^2/2$ è la <b>densità di energia del campo</b>, e il fatto che una pressione e una densità di energia abbiano le stesse dimensioni e lo stesso valore numerico non è una coincidenza: una pressione <i>è</i> un&rsquo;energia per unità di volume.</p>
   <p><b>Mazzoldi</b> la ricava come forza fra le armature di un condensatore nel §4.9, che l&rsquo;indice colloca a p. 115 e che non è fra le pagine aperte per questo movimento — la derivazione qui sopra è quella standard, non la sua. Aggiunge però a p. 126, in una pagina che abbiamo, una precisazione che vale la pena rileggere due volte, perché corregge un fraintendimento in cui è facilissimo cadere: «il termine <i>locale</i> non deve trarre in inganno». Il teorema di Coulomb dice che il campo appena fuori è determinato dalla $\sigma$ <b>in quel punto</b>, e questo è vero; ma non dice che la $\sigma$ in quel punto sia indipendente dal resto del mondo. <b>Il valore locale di $\sigma$ è l&rsquo;esito di un problema globale</b> — dipende dalla forma dell&rsquo;intero conduttore e da ogni altra carica presente nello spazio. Avvicinare un corpo carico a un conduttore non cambia la <i>relazione</i> fra $E$ e $\sigma$, cambia la $\sigma$. Lo stesso vale per la pressione elettrostatica: si calcola da un dato locale, ma quel dato lo decide tutto il sistema.</p>`},
   {label:'La stessa forza ricavata dallenergia, e il segno che tradisce', body:R`
   <p>C&rsquo;è una seconda strada per la forza, che non passa dalla carica superficiale e che negli scritti è spesso più rapida: il <b>lavoro virtuale</b>. Si sposta un&rsquo;armatura di un pezzetto e si guarda come cambia l&rsquo;energia. <b>Griffiths</b> la imposta così (problema 2.40, p. 106, e per esteso nel §4.4.4 a p. 195): se il sistema è <i>isolato</i>, l&rsquo;unico lavoro in gioco è quello meccanico, e la forza elettrica è
   $$F_x=-\frac{\partial U}{\partial x}\Big|_{Q},\qquad\frac{\partial U}{\partial x}\Big|_{Q}=\frac{Q^{2}}{2\varepsilon_0A},$$
   dove si è usato $U=Q^{2}/2C$ con $C=\varepsilon_0A/x$. La forza è negativa, cioè <b>attrattiva</b>, e il suo modulo è
   $$\frac{Q^{2}}{2\varepsilon_0A}=\frac{\sigma^{2}}{2\varepsilon_0}\,A:$$
   la pressione elettrostatica moltiplicata per l&rsquo;area, come dev&rsquo;essere. Le due strade — sommare le forze sulle cariche superficiali, derivare l&rsquo;energia rispetto alla geometria — danno lo stesso numero, e questa coincidenza è il controllo più rapido su un esercizio di forze fra conduttori.</p>
   <p><b>E ora la trappola, che è di segno.</b> Se il condensatore resta <b>collegato</b> a un generatore, $\Delta V$ è fisso e l&rsquo;energia è $U=\tfrac12C\,\Delta V^{2}$, cioè $U=\varepsilon_0AV^{2}/2x$, da cui
   $$\frac{\partial U}{\partial x}\Big|_{V}=-\frac{\varepsilon_0AV^{2}}{2x^{2}}.$$
   Preso alla lettera, $F=-\partial U/\partial x$ darebbe adesso una forza <i>positiva</i>, cioè repulsiva: assurdo, perché le armature portano cariche opposte e si attraggono qualunque cosa faccia il generatore. <b>L&rsquo;errore non è nel conto, è nel bilancio</b>: a $V$ fisso il generatore scambia carica, quindi fa lavoro, e l&rsquo;energia del condensatore non è più l&rsquo;unico serbatoio. Tenendo conto del generatore si ritrova $F_x=+\partial U/\partial x\big|_V$, e il modulo
   $$\frac{\varepsilon_0AV^{2}}{2x^{2}}=\frac{\sigma^{2}}{2\varepsilon_0}\,A$$
   è <b>lo stesso di prima</b>, con $\sigma=\varepsilon_0V/x$. Giustamente: la forza è una proprietà della configurazione di carica, e non sa chi la tiene lì. La regola operativa da portare all&rsquo;esame: <b>$F=-\partial U/\partial x$ a carica costante, $F=+\partial U/\partial x$ a potenziale costante</b>, e se non ti ricordi quale, fai il conto a carica costante — lì il segno non può ingannarti.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Su una sfera conduttrice isolata di raggio $R$ con carica $Q$: quanto vale $\sigma$, e quanto il campo appena fuori?`,
    a:R`$\sigma=\frac{Q}{4\pi R^2}$ per simmetria, e il campo appena fuori è $\frac{\sigma}{\varepsilon_0}=\frac{Q}{4\pi\varepsilon_0R^2}$ — che è <b>esattamente</b> il campo di una carica puntiforme $Q$ posta al centro, valutato in $r=R$. I due conti coincidono, come devono: è il teorema di Coulomb e Gauss che raccontano lo stesso fatto.`},
   {q:R`Su un conduttore non sferico, dove si accumula più carica?`,
    a:R`Dove la superficie è più <b>curva</b>: sulle punte. L&rsquo;argomento in una riga: la superficie è equipotenziale, e per due sferette collegate di raggi $R_1,R_2$ lo stesso potenziale $\frac{Q}{4\pi\varepsilon_0R}$ impone $\sigma R=\text{cost}$, cioè $\sigma\propto1/R$. Sulle punte $\sigma$ esplode, e con essa $E=\sigma/\varepsilon_0$ — da lì il <b>potere dispersivo delle punte</b> e il parafulmine.`}
  ]},
  {t:'prosa', title:'Il conto completo delle due sfere collegate, che e il modello di una punta', tag:'esame', html:R`
  <p>Quell&rsquo;argomento qualitativo in realtà si chiude in formule, e <b>Mazzoldi</b> lo fa a p. 93 (eq. 4.4-4.5). Due sfere conduttrici di raggi $R_1$ e $R_2$, lontane fra loro rispetto ai raggi — così che ciascuna veda una distribuzione uniforme sull&rsquo;altra — vengono collegate da un filo conduttore. Il sistema porta carica totale $Q$. Il filo le rende un <b>unico conduttore</b>, dunque un unico equipotenziale:
  $$V_1=V_2=\frac{Q}{4\pi\varepsilon_0(R_1+R_2)},$$
  e imponendo $V_1=V_2$ insieme alla conservazione della carica totale si trova come si spartisce la carica:
  $$q_1=\frac{R_1}{R_1+R_2}\,Q,\qquad q_2=\frac{R_2}{R_1+R_2}\,Q.$$
  Quindi
  $$\frac{q_1}{q_2}=\frac{R_1}{R_2}:$$
  <b>la carica si ripartisce proporzionalmente ai raggi</b>, cioè — vedremo nella tappa 04 che la capacità di una sfera isolata è $4\pi\varepsilon_0R$ — proporzionalmente alle capacità. Ma le <i>densità</i> fanno il contrario:
  $$\frac{\sigma_1}{\sigma_2}=\frac{R_2}{R_1},$$
  perché $\sigma=q/4\pi R^{2}$ e il raggio al quadrato vince sul raggio. E per il teorema di Coulomb i campi superficiali stanno nello stesso rapporto delle densità.</p>
  <div class="note"><b>Perché questo è il modello di una punta, e non un esercizio artificiale.</b> Un conduttore con una protuberanza affilata si comporta come la sfera piccola di questa coppia: prende <i>poca carica</i> e sviluppa <i>molta densità</i>, quindi molto campo. Se il campo supera la rigidità dielettrica dell&rsquo;aria si innesca una scarica, e il conduttore si scarica <b>dalla punta</b>: è il potere dispersivo, il parafulmine, e il motivo per cui le superfici degli apparati ad alta tensione si costruiscono arrotondate. Mazzoldi nota anche l&rsquo;uso inverso, più antico: la proporzionalità fra le due cariche e i due raggi è <b>il metodo con cui si ripartiva una carica nota in frazioni note</b>, per studiare la legge di Coulomb quando non esistevano strumenti di misura della carica.</div>`}
]},

/* ---------------- 03 · IL METODO A STRATI, TERZO TEMPO ---------------- */
{ num:'03', title:'Sistemi a gusci: il metodo che risolve lesercizio piu frequente del corso', meta:'induzione completa · messa a terra · la ricetta in cinque passi · il campo e il potenziale a tratti',
  blocchi:[
  {t:'prosa', title:'La ricetta, e non cambia mai', tag:'regola operativa', html:R`
  <p>La forma tipica dello scritto: una carica $Q_1$ su un conduttore sferico (o un filo, o un cilindro) di raggio $R_1$, circondato da un guscio conduttore fra $R_2$ e $R_3$, eventualmente <b>messo a terra</b>; si chiede il campo ovunque, le cariche su ogni superficie, il potenziale, la capacità. <b>Cinque passi, sempre gli stessi:</b></p>
  <ol>
   <li><b>Elenca le superfici</b>, dall&rsquo;interno verso l&rsquo;esterno, e dai un nome alla carica su ciascuna.</li>
   <li><b>Metti a zero il campo dentro ogni spessore metallico.</b> Una gaussiana che cammina dentro il metallo deve racchiudere carica netta nulla, $Q_{\text{int}}=0$: questo fissa la carica sulla faccia interna di ogni guscio, e vale l&rsquo;<b>induzione completa</b> — sulla faccia interna compare esattamente l&rsquo;opposto di ciò che sta più dentro.</li>
   <li><b>Conserva la carica di ogni conduttore isolato</b> (la somma delle sue due facce è la carica che gli hai dato). Se invece è <b>messo a terra</b>, questa condizione salta e la sostituisci con $V=0$: la terra fornisce o assorbe la carica che serve, e quasi sempre il risultato è che la <b>faccia esterna resta scarica</b>.</li>
   <li><b>Gauss regione per regione</b>: il campo in ogni zona dipende solo dalla carica totale racchiusa.</li>
   <li><b>Integra il campo</b> per il potenziale, partendo da dove lo conosci (l&rsquo;infinito, o la terra).</li>
  </ol>
  <div class="note"><b>Il controllo che smaschera gli errori</b>: il campo può <b>saltare</b> solo attraversando una superficie carica, e il salto vale $\sigma/\varepsilon_0$. Il potenziale invece è <b>continuo ovunque</b>, sempre, anche dove il campo salta — è l&rsquo;integrale di una funzione limitata. Se il tuo $V(r)$ ha un gradino, hai sbagliato un segno o un estremo.</div>`},
  {t:'plot', title:'Campo e potenziale attraverso un sistema a tre superfici',
   intro:R`Sfera conduttrice di raggio $R_1=1$ con carica $Q$, dentro un guscio conduttore neutro fra $R_2=2$ e $R_3=3$. In unità $Q/(4\pi\varepsilon_0)=1$.`,
   plots:[
    {kind:'func2d', xr:[0,5], yr:[-0.15,1.25], height:330,
     title:'E(r): nullo nel metallo, 1/r^2 nel vuoto — e i due salti',
     xlabel:'r', ylabel:'E(r)',
     curves:[{f:'x<1 ? 0 : (x<2 ? 1/(x*x) : (x<3 ? 0 : 1/(x*x)))', col:'#5eead4', width:2.6, label:'E(r)'}],
     segs:[{x1:1, y1:0, x2:1, y2:1.15, col:'#ff6b6b', dash:true, width:1.4, label:'R1', lx:1.02, ly:1.18},
           {x1:2, y1:0, x2:2, y2:1.15, col:'#4c8dff', dash:true, width:1.4, label:'R2', lx:2.02, ly:1.18},
           {x1:3, y1:0, x2:3, y2:1.15, col:'#4c8dff', dash:true, width:1.4, label:'R3', lx:3.02, ly:1.18},
           {x1:0, y1:0, x2:5, y2:0, col:'#4d5a6b', width:1}],
     marks:[{x:0.5, y:0, label:'dentro il conduttore: E=0', col:'#b98cff', up:true},
            {x:2.5, y:0, label:'dentro il guscio: E=0', col:'#b98cff', up:true}]},
    {kind:'func2d', xr:[0,5], yr:[0,1.35], height:330,
     title:'V(r): continuo ovunque, e piatto dentro ogni metallo',
     xlabel:'r', ylabel:'V(r)',
     curves:[{f:'x<1 ? (1/1-1/2+1/3) : (x<2 ? (1/x-1/2+1/3) : (x<3 ? 1/3 : 1/x))', col:'#d8a13a', width:2.6, label:'V(r)'}],
     segs:[{x1:1, y1:0, x2:1, y2:1.3, col:'#ff6b6b', dash:true, width:1.2},
           {x1:2, y1:0, x2:2, y2:1.3, col:'#4c8dff', dash:true, width:1.2},
           {x1:3, y1:0, x2:3, y2:1.3, col:'#4c8dff', dash:true, width:1.2}],
     marks:[{x:0.5, y:0.8333, label:'equipotenziale', col:'#b98cff', up:true},
            {x:2.5, y:0.3333, label:'equipotenziale', col:'#b98cff', up:true}]}
   ],
   leggi:R`<b>Le due figure insieme sono il controllo dell&rsquo;esercizio.</b> Il campo (sopra) è nullo in due intervalli — <i>dentro il metallo</i>, non dentro la cavità — e fra $R_1$ e $R_2$ vive tranquillo come se il guscio non ci fosse: quello è il punto che chi sbaglia annulla. I salti stanno solo dove c&rsquo;è carica superficiale: in $R_1$ sale, in $R_2$ crolla a zero (lì è comparsa la carica indotta $-Q$), in $R_3$ risale (lì è comparsa $+Q$, perché il guscio era neutro).<br><br>
   Il potenziale (sotto) <b>non salta mai</b>, ed è piatto esattamente dove il campo è nullo — un plateau per ogni conduttore, che è il significato grafico di «equipotenziale». Fuori da $R_3$ il potenziale è $1/r$ come se ci fosse solo $Q$ al centro: <b>visto da fuori, il guscio neutro non esiste</b>. Se avessi messo il guscio a terra, l&rsquo;ultimo tratto sarebbe schiacciato a zero e la faccia esterna resterebbe scarica: <i>quello</i> è ciò che «messo a terra» cambia nel disegno.`}
]},

/* ---------------- 04 · LA CAPACITÀ ---------------- */
{ num:'04', title:'La capacita e i condensatori: tre geometrie, e sono lo stesso conto', meta:'definizione · piano, cilindrico, sferico · serie e parallelo · lenergia immagazzinata',
  blocchi:[
  {t:'prosa', title:'Che cosa misura la capacita', tag:'grammatica', html:R`
  <p>Per un conduttore isolato, carica e potenziale sono <b>proporzionali</b> — raddoppia la carica e raddoppia il campo, quindi il potenziale. Il rapporto dipende solo dalla geometria e si chiama <b>capacità</b>:
  $$C=\frac{Q}{V}.$$
  Per una sfera isolata, $V=\frac{Q}{4\pi\varepsilon_0R}$ dà $C=4\pi\varepsilon_0R$: <b>la capacità è una lunghezza</b>, a meno di costanti. Più un conduttore è grande, più carica accetta a parità di potenziale.</p>
  <p>Un <b>condensatore</b> è una coppia di conduttori con cariche $+Q$ e $-Q$, e $C=Q/\Delta V$. La ricetta per calcolarlo è una sola, in tre passi: <b>si mette $Q$, si calcola il campo con Gauss, si integra per avere $\Delta V$, si divide</b>. Le tre geometrie classiche differiscono solo nel secondo passo.</p>
  <p><b>Una condizione in più, che quasi tutti i testi danno per scontata.</b> Perché $C$ sia una costante della geometria serve che fra i due conduttori ci sia <b>induzione completa</b>: tutte le linee che partono dall&rsquo;armatura positiva devono finire su quella negativa. Mazzoldi lo dice esplicitamente a p. 101 — «una relazione analoga sussiste per una qualsiasi coppia di conduttori fra i quali ci sia induzione completa» — e Bettini (§2.6) ne trae la conseguenza pratica: nei condensatori reali le superfici affacciate si fanno grandi rispetto alla distanza <i>proprio</i> per ottenerla, perché ai bordi qualche linea «scappa» e va a finire su un altro conduttore vicino, rendendo l&rsquo;induzione incompleta.</p>
  <div class="note"><b>C&rsquo;è un&rsquo;affermazione innocua in questa pagina che in realtà è un teorema, e Griffiths è l&rsquo;unico dei quattro che si ferma ad ammetterlo</b> (p. 104). Abbiamo detto: raddoppia $Q$ e raddoppia il campo. Ma come facciamo a sapere che raddoppiare la carica raddoppia la densità <i>punto per punto</i>, invece di riorganizzarla in un&rsquo;altra configurazione — magari quadruplicandola da una parte e dimezzandola dall&rsquo;altra, con la carica totale che fa comunque il doppio? Griffiths scrive: «il fatto è che questa preoccupazione è infondata: raddoppiare $Q$ raddoppia davvero $\sigma$ ovunque, non sposta la carica. La dimostrazione verrà nel capitolo 3; per ora dovrete credermi». Quella dimostrazione è il <b>teorema di unicità</b>, e in questo movimento sta nella tappa 04b: senza di esso la capacità non è un numero ben definito, è una speranza.</div>`},
  {t:'reveal', title:'Le tre geometrie, calcolate e non ricordate', tag:'costruzione', steps:[
   {label:'Piano', body:R`
   <p>Due armature di area $A$ a distanza $d$, campo uniforme $E=\sigma/\varepsilon_0=Q/(\varepsilon_0A)$ (teorema di Coulomb, tappa 02), quindi $\Delta V=Ed=\frac{Qd}{\varepsilon_0A}$ e
   $$C=\frac{\varepsilon_0A}{d}.$$
   Il campo è uniforme solo se $d\ll\sqrt A$: gli <b>effetti di bordo</b> si trascurano, ed è l&rsquo;unica approssimazione di tutta la tappa.</p>`},
   {label:'Cilindrico', body:R`
   <p>Due cilindri coassiali di raggi $R_1<R_2$ e lunghezza $L\gg R_2$. Gauss con una superficie cilindrica dà $E(r)=\frac{Q}{2\pi\varepsilon_0Lr}$, e integrando da $R_1$ a $R_2$:
   $$\Delta V=\frac{Q}{2\pi\varepsilon_0L}\ln\frac{R_2}{R_1}\quad\Longrightarrow\quad C=\frac{2\pi\varepsilon_0L}{\ln(R_2/R_1)}.$$
   <b>Il logaritmo è la firma della simmetria cilindrica</b> e torna in ogni esercizio con fili e cavi coassiali.</p>
   <p>Bettini lascia come esercizio (§2.7) il controllo che vale la pena fare una volta: per armature vicine, $h=R_2-R_1\ll R_1$, si sviluppa il logaritmo,
   $$\ln\frac{R_2}{R_1}=\ln\left(1+\frac{h}{R_1}\right)\simeq\frac{h}{R_1},$$
   e la capacità diventa $C\simeq\varepsilon_0\Sigma/h$, dove $\Sigma=2\pi R_1L$ è l&rsquo;area delle armature: <b>si ritrova il condensatore piano</b>, esattamente come succederà con la geometria sferica. Tutte e tre le formule sono la stessa formula vista da lontano.</p>`},
   {label:'Sferico, e i due limiti che valgono un controllo', body:R`
   <p>Due sfere concentriche: $E(r)=\frac{Q}{4\pi\varepsilon_0r^2}$ fra le armature, $\Delta V=\frac{Q}{4\pi\varepsilon_0}\left(\frac{1}{R_1}-\frac{1}{R_2}\right)$, quindi
   $$C=\frac{4\pi\varepsilon_0R_1R_2}{R_2-R_1}.$$
   <b>Due controlli che valgono più della formula.</b> Se $R_2\to\infty$ si ritrova la sfera isolata, $C=4\pi\varepsilon_0R_1$: una sfera sola è un condensatore la cui seconda armatura è l&rsquo;infinito. Se invece $R_2=R_1+d$ con $d$ piccolo, $C\to\frac{4\pi\varepsilon_0R_1^2}{d}=\frac{\varepsilon_0A}{d}$ con $A=4\pi R_1^2$: <b>si ritrova il condensatore piano</b>, come dev&rsquo;essere, perché da vicino ogni superficie è piatta.</p>`}
  ]},
  {t:'reveal', title:'Il condensatore reale: perche il campo DEVE uscire dai bordi, e come lo si sconfigge', tag:'dai conti alle cose', steps:[
   {label:'Perche gli effetti di bordo non sono un difetto di costruzione', body:R`
   <p>Si dice sempre «si trascurano gli effetti di bordo», come se fossero una sbavatura dei condensatori economici. Non lo sono: <b>un campo che si interrompe di colpo al bordo è impossibile</b>, e l&rsquo;argomento sta in una riga di <b>Mazzoldi</b> (p. 103, figura 4.26) — ripreso identico da <b>Griffiths</b> a p. 195 — che vale più di qualunque discussione qualitativa.</p>
   <p>Si supponga per assurdo che il campo sia uniforme e pari a $E$ fra le armature e esattamente nullo fuori, con un salto netto in corrispondenza del bordo. Si prenda allora un cammino chiuso rettangolare a cavallo del bordo: un lato dentro il condensatore, parallelo al campo, che contribuisce $Eh$; il lato opposto fuori, dove il campo sarebbe nullo, che contribuisce zero; i due lati corti perpendicolari al campo, che contribuiscono zero. Risultato: la circuitazione $\oint\vec E\cdot d\vec\ell$ vale $Eh$, <b>diversa da zero</b> — e questo contraddice il fatto che il campo elettrostatico è <span class="str" data-str="campo-conservativo">conservativo</span>.</p>
   <p>Quindi il campo <i>deve</i> deformarsi al bordo, e si deforma esattamente nel modo che azzera quella circuitazione: le linee si incurvano, escono all&rsquo;esterno, e la regione in cui lo fanno si chiama <b>regione di frangia</b>. Mazzoldi aggiunge l&rsquo;osservazione che chiude il cerchio con la tappa 03: <b>la configurazione sferica è l&rsquo;unica ideale, perché non ha bordi</b>. Le formule del condensatore piano e di quello cilindrico sono approssimate <i>per questa ragione</i>, e non per l&rsquo;approssimazione geometrica — nel piano infatti nessuna approssimazione geometrica viene fatta.</p>`},
   {label:'Lanello di guardia di Thomson, cioe come si misura un condensatore piano', body:R`
   <p>Se la frangia è inevitabile, la si può però <b>spostare fuori dalla zona che conta</b>. Il rimedio è di William Thomson e lo descrivono sia <b>Bettini</b> (§2.6, p. 82) sia <b>Mazzoldi</b> (p. 104) con parole quasi uguali: si divide ciascuna armatura in una parte centrale e in un <b>anello di guardia</b> complanare, separato da una fessura sottilissima e <b>tenuto allo stesso potenziale</b> della parte centrale.</p>
   <p>Il trucco è che l&rsquo;anello, essendo allo stesso potenziale, non altera il campo nella zona centrale, ma <b>eredita lui la frangia</b>: il bordo del sistema è ora il bordo dell&rsquo;anello, lontano. Il condensatore «vero» — quello di cui si misura la carica — è la parte centrale, dove il campo è uniforme con ottima precisione, e per esso $C=\varepsilon_0\Sigma/h$ vale praticamente esatta. <b>È il motivo per cui una formula approssimata può essere usata per misure di precisione</b>: non si rende esatta l&rsquo;approssimazione, si costruisce l&rsquo;apparato in cui l&rsquo;errore sta da un&rsquo;altra parte.</p>`},
   {label:'Gli ordini di grandezza, e perche il farad e unassurdita geometrica', body:R`
   <p>Il farad è un&rsquo;unità sproporzionata, e <b>Bettini</b> lo mostra con un conto che conviene rifare (§2.6, p. 81). Che armature servono per $C=1\ \mathrm{F}$ con $h=0{,}1\ \mathrm{mm}$? Da $S=Ch/\varepsilon_0$ si ottiene $S\simeq1{,}13\cdot10^{7}\ \mathrm{m^{2}}$, cioè un quadrato di lato $\simeq3{,}36\ \mathrm{km}$. All&rsquo;altro estremo, una ragionevole unità pratica: $\varepsilon_0\simeq8{,}85\ \mathrm{pF/m}$, e un condensatore piano di $1\ \mathrm{cm^{2}}$ con armature a $1\ \mathrm{mm}$ ha $C\simeq0{,}885\ \mathrm{pF}$ — <b>circa un picofarad</b>, ed è il numero da ricordare per stimare a occhio.</p>
   <p>Il confronto con le altre geometrie dice qualcosa sulla geometria stessa. Una <b>sfera isolata</b> di $1\ \mathrm{F}$ dovrebbe avere raggio $R=1/4\pi\varepsilon_0$, cioè $\simeq8{,}99\cdot10^{9}\ \mathrm{m}$: più di dieci volte il raggio del Sole. Un <b>condensatore sferico</b> di $1\ \mathrm{F}$ con le stesse armature a $0{,}1\ \mathrm{mm}$ ha invece raggio $\simeq948\ \mathrm{m}$ — grande, ma non assurdo. <b>Avvicinare la seconda armatura guadagna sette ordini di grandezza</b>, e questo è il contenuto fisico di «capacità»: non quanta carica un corpo può portare, ma quanto bene un secondo conduttore vicino neutralizza il potenziale che quella carica produce.</p>
   <div class="note"><b>Due note su questi numeri, e la prima è un errore in un libro.</b> Bettini, nello stesso punto, scrive che il condensatore sferico da $1\ \mathrm{F}$ con $0{,}1\ \mathrm{mm}$ di intercapedine ha raggio $300\ \mathrm{m}$. Il conto non torna: da $C\simeq4\pi\varepsilon_0R^{2}/h$ viene $R=\sqrt{Ch/4\pi\varepsilon_0}\simeq948\ \mathrm{m}$, e con $R=300\ \mathrm{m}$ si otterrebbero $0{,}1\ \mathrm{F}$ e non $1\ \mathrm{F}$. Il valore stampato è sbagliato di un fattore $\sqrt{10}$, mentre il conto gemello sul condensatore piano nella stessa pagina è giusto: è un refuso, non un&rsquo;impostazione diversa. <b>Il controllo che lo smaschera è gratuito</b> — il condensatore sferico ha area $4\pi R^{2}$, quindi il suo lato equivalente deve stare al lato del quadrato piano come $1$ a $\sqrt{4\pi}$, e $3360/\sqrt{4\pi}=948$.<br><br>
   La seconda nota è di <b>Griffiths</b>, in una nota a piè di pagina (p. 104) che è anche la cosa più divertente dei quattro libri: «nella seconda edizione affermavo che per trasportare un condensatore da $1\ \mathrm{F}$ servirebbe un carrello elevatore. Non è più così: oggi si compra un condensatore da $1\ \mathrm{F}$ che sta comodamente in un cucchiaio da minestra.» Non è una battuta: <b>è la misura di quanto lontano si vada riempiendo l&rsquo;intercapedine</b> — un dielettrico, o meglio il doppio strato di un supercondensatore — rispetto ai tre chilometri di lato che il vuoto richiede. Il meccanismo è il contenuto del movimento sui dielettrici; qui basta sapere che <b>il vuoto è il caso peggiore</b>, e che ogni numero di questa tappa è un limite inferiore.</div>`},
   {label:'Fin dove si puo caricare: la rigidita dielettrica, e il limite che esiste anche nel vuoto', body:R`
   <p>Un condensatore non si può caricare quanto si vuole, e il limite non è sulla carica ma sul <b>campo</b>. Ogni isolante ha un valore massimo di campo oltre il quale si ionizza e diventa conduttore: si chiama <b>rigidità dielettrica</b>, e <b>Mazzoldi</b> la discute a p. 144. La scarica apre un cammino conduttivo attraverso il materiale e, in un solido, lo distrugge in modo irreversibile; <b>Bettini</b> (§2.7) aggiunge che i buoni isolanti arrivano a decine di $\mathrm{MV/m}$ e che la rigidità dipende dalla purezza del materiale <i>e dallo stato delle superfici conduttrici</i> — pulizia, levigatezza — cioè, di nuovo, dalle punte.</p>
   <p>Il punto che si ricorda meno: <b>anche nel vuoto esiste una tensione massima</b>, pur essendo la rigidità dielettrica del vuoto formalmente infinita. Dati due conduttori separati dal vuoto, oltre una certa differenza di potenziale il campo superficiale sul conduttore a potenziale minore diventa abbastanza intenso da <b>strappare elettroni</b> dal metallo — ed è qui che ritorna il lavoro di estrazione della tappa 01, con il campo che inclina la barriera di superficie fino a renderla attraversabile. Gli elettroni così estratti vengono raccolti dall&rsquo;altro conduttore, e la scarica avviene nonostante non ci sia niente in mezzo da ionizzare.</p>
   <p><b>Conseguenza di progetto, e torna utile negli esercizi sui partitori:</b> se una data tensione non è sopportabile da un singolo condensatore, se ne collegano <i>più in serie</i>, così che il campo in ciascuno resti sotto la rigidità. La capacità equivalente cala — è il prezzo — ma il sistema non scarica. Il perché quella sia la configurazione giusta sta nel paragrafo seguente.</p>`}
  ]},
  {t:'prosa', title:'Serie e parallelo, e perche si sommano al contrario', tag:'regola operativa', html:R`
  <p><b>Parallelo</b> (stessa $\Delta V$, le cariche si sommano): $C=C_1+C_2$. <b>Serie</b> (stessa $Q$ per induzione completa, le tensioni si sommano):
  $$\frac1C=\frac1{C_1}+\frac1{C_2}\quad\Longrightarrow\quad C=\frac{C_1C_2}{C_1+C_2}.$$
  <b>Il modo di non confondersi</b> non è ricordare le formule ma chiedersi <i>che cosa è in comune</i>: in parallelo è la tensione, in serie è la carica. E un controllo di buon senso che funziona sempre: due condensatori in serie hanno capacità <b>minore</b> del più piccolo dei due (è come allontanare le armature), in parallelo <b>maggiore</b> del più grande (è come allargarle).</p>
  <p><b>Perché nella serie la carica è davvero la stessa, e non «approssimativamente».</b> L&rsquo;argomento è un effetto a catena di induzione completa, e lo si trova identico in <b>Bettini</b> (§2.8) e in <b>Mazzoldi</b> (p. 105): si immagina di prelevare la carica $Q$ dall&rsquo;ultima armatura a destra e portarla sulla prima a sinistra. Sulla seconda faccia del primo condensatore compare $-Q$ per induzione. Ora si guardi il <b>conduttore intermedio</b>, formato dalla faccia destra del primo condensatore e dalla faccia sinistra del secondo collegate da un filo: esso è <b>isolato e inizialmente neutro</b>, quindi la sua carica totale deve restare nulla — e se su una faccia c&rsquo;è $-Q$, sull&rsquo;altra c&rsquo;è necessariamente $+Q$. Il ragionamento si propaga fino alla fine della catena. <b>Quello che rende uguale la carica non è la geometria: è la conservazione della carica su ogni conduttore intermedio isolato</b>, e per questo la regola vale anche in regime variabile, dove la geometria non basterebbe.</p>
  <p>Una conseguenza operativa che Mazzoldi mette in fondo al §4.6 (p. 108) e che risparmia conti: se le due capacità sono molto diverse, <b>nel parallelo domina la più grande e nella serie la più piccola</b>. Nella serie, con $C_1\gg C_2$, si ha $C\simeq C_2$: aggiungere in serie un condensatore grande a uno piccolo non cambia quasi nulla. È il controllo di plausibilità da fare <i>prima</i> di risolvere qualunque rete.</p>
  <p><b>Il partitore capacitivo, cioè la serie usata al contrario.</b> Mazzoldi lo propone come esempio 4.9 e vale la pena svolgerlo per intero, perché è esattamente la forma in cui il partitore compare negli scritti. Tre condensatori in serie fra i punti $A$ e $B$, con $\Delta V=100\ \mathrm{V}$ e capacità equivalente $C=100\ \mathrm{pF}$; si vogliono i tre valori tali che, misurando i potenziali rispetto ad $A$, risulti $V_1=50\ \mathrm{V}$ e $V_2=70\ \mathrm{V}$. La carica è comune a tutti e vale $q=C\,\Delta V=10\ \mathrm{nC}$, e le tre tensioni <i>ai capi di ciascun condensatore</i> sono $50$, $20$ e $30$ volt. Da $C_i=q/\Delta V_i$:
  $$C_1=200\ \mathrm{pF},\qquad C_2=500\ \mathrm{pF},\qquad C_3\simeq333\ \mathrm{pF}.$$
  <b>Il controllo obbligatorio</b> è rimettere insieme la serie: la somma dei reciproci dà $100\ \mathrm{pF}$, cioè la capacità da cui si era partiti. Se non torna, l&rsquo;errore tipico è uno solo e si vede subito: <i>si sono usati i potenziali invece delle differenze di potenziale</i> — $70$ invece di $20$ per il secondo condensatore.</p>
  <p><b>L&rsquo;energia immagazzinata</b> si ottiene caricando poco per volta, $dU=V\,dq=\frac{q}{C}dq$, e integrando:
  $$U=\frac{Q^{2}}{2C}=\frac12C\,\Delta V^{2}=\frac12Q\,\Delta V.$$
  Nel condensatore piano questa diventa $U=\frac{\varepsilon_0E^{2}}{2}\,(Ad)$: <b>energia per unità di volume $\times$ volume fra le armature</b>. È lo stesso $\varepsilon_0E^2/2$ della pressione elettrostatica, e il fatto che compaia due volte per strade indipendenti è l&rsquo;indizio che l&rsquo;energia <i>sta nel campo</i> e non nelle cariche.</p>
  <p><b>Il controllo che vale la pena fare una volta nella vita, e poi mai più.</b> L&rsquo;affermazione «l&rsquo;energia sta nel campo» non è una riformulazione: è un&rsquo;altra formula, $U=\frac{\varepsilon_0}{2}\int E^{2}\,d\tau$, e il modo di crederci è verificare che dia lo <i>stesso</i> numero su una geometria in cui il campo non è uniforme. Mazzoldi lo fa nell&rsquo;esempio 4.13 (p. 109) sul condensatore sferico. Il campo fra le armature è $E=q/4\pi\varepsilon_0r^{2}$, il volume del guscio infinitesimo è $d\tau=4\pi r^{2}dr$, e l&rsquo;integrale si semplifica in modo spettacolare perché gli $r^{2}$ si combinano:
  $$\int_{R_1}^{R_2}\frac{\varepsilon_0}{2}\left(\frac{q}{4\pi\varepsilon_0r^{2}}\right)^{2}4\pi r^{2}\,dr=\frac{q^{2}}{8\pi\varepsilon_0}\left(\frac{1}{R_1}-\frac{1}{R_2}\right)=\frac{q^{2}}{2C}$$
  con $C$ la capacità sferica della pagina precedente. <b>Le due strade coincidono</b>, e nessuna delle due sapeva dell&rsquo;altra: una conta il lavoro fatto sulle cariche, l&rsquo;altra integra una densità nello spazio vuoto.</p>
  <p>Mazzoldi aggiunge il caso che gli scritti sfruttano: se l&rsquo;armatura esterna è <b>messa a terra</b>, l&rsquo;integrale sopra è tutta l&rsquo;energia e non ci sono altri termini. Se invece il guscio esterno è <b>isolato</b>, porta la carica $q$ sulla sua superficie esterna di raggio $R_3$, e nello spazio oltre $R_3$ c&rsquo;è un campo che immagazzina energia a parte:
  $$U_{\text{est}}=\frac{q^{2}}{8\pi\varepsilon_0R_3},$$
  che è $q^{2}/2C_3$ con $C_3=4\pi\varepsilon_0R_3$ la capacità del conduttore sferico isolato di raggio $R_3$. <b>Ogni regione in cui il campo è diverso da zero porta la sua quota</b>, e l&rsquo;energia totale è la somma: è la ragione per cui la domanda «il guscio è a terra o isolato?» cambia l&rsquo;energia e non solo le cariche.</p>`},
  {t:'prosa', title:'La lastra conduttrice infilata nel condensatore: il risultato che non dipende da dove la metti', tag:'esame', html:R`
  <p>Questo esperimento <b>Mazzoldi</b> lo usa a p. 127 come introduzione ai dielettrici, ma è un risultato di soli conduttori e cade negli scritti con il dielettrico sostituito dal metallo. Un condensatore piano di armature $\Sigma$ e distanza $h$ è caricato con carica $q_0$ e poi <b>isolato</b>, così che $q_0$ e quindi $E_0=\sigma_0/\varepsilon_0$ restino fissi. Si infila fra le armature, parallelamente a esse e <b>senza toccarle</b>, una lastra conduttrice neutra di spessore $s<h$.</p>
  <p>Sulle due facce della lastra compaiono per induzione completa due densità $\pm\sigma_0$, di segno tale da annullare il campo al suo interno — è l&rsquo;unica cosa che la lastra può fare, perché è un conduttore in equilibrio. Fuori dalla lastra invece il campo resta <b>identico</b>: le cariche indotte sono uguali e opposte a quelle delle armature affacciate, e il loro contributo esterno si cancella. Quindi la differenza di potenziale è l&rsquo;integrale di $E_0$ sul solo spessore <i>non occupato</i>:
  $$\Delta V=E_0\,(h-s),$$
  e la capacità sale a
  $$C=\frac{\varepsilon_0\Sigma}{h-s}.$$
  <b>Due cose da notare, e sono quelle che gli esercizi chiedono.</b> La prima: il risultato <i>non dipende dalla posizione</i> della lastra — può stare appiccicata a un&rsquo;armatura o nel mezzo, e $\Delta V$ è lo stesso, perché nel conto entra solo lo spessore sottratto. La seconda: inserire un conduttore <b>abbassa sempre la differenza di potenziale e alza sempre la capacità</b>, e nel limite $s\to h$ la capacità diverge — che è il modo in cui la formula dice che le armature si sono cortocircuitate.</p>
  <div class="note"><b>Come si vede, con lo strumento che avevano a disposizione:</b> Mazzoldi nota che la diminuzione di $\Delta V$ è visibile come <i>chiusura delle foglie</i> di un elettroscopio collegato in parallelo al condensatore, e che la carica indotta sulle facce della lastra si dimostra toccandone una con una sferetta conduttrice su manico isolante, e portando poi la sferetta a contatto con un elettroscopio. Non è aneddotica: l&rsquo;elettroscopio è un condensatore anch&rsquo;esso — asta e foglioline contro l&rsquo;involucro — con capacità molto piccola, e perché la misura non perturbi il sistema serve $C_s\ll C_0$. È il primo esempio di una regola che vale per tutta la strumentazione elettrostatica: <b>la condizione per non disturbare è una disuguaglianza fra capacità</b>.</div>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Un condensatore piano è carico e <b>isolato</b>. Allontani le armature: come cambiano $Q$, $E$, $\Delta V$, $U$?`,
    a:R`$Q$ resta (è isolato). $E=\sigma/\varepsilon_0$ resta, perché dipende solo dalla densità di carica e non dalla distanza. $\Delta V=Ed$ <b>cresce</b>. $C=Q/\Delta V$ <b>cala</b>. $U=\frac{Q^2}{2C}$ <b>cresce</b> — e l&rsquo;energia in più l&rsquo;hai messa tu, tirando contro l&rsquo;attrazione fra le armature. <b>Se invece il condensatore resta collegato al generatore</b> cambia tutto: è $\Delta V$ a restare fisso, $Q$ cala, e $U=\frac12C\Delta V^2$ <b>diminuisce</b>. La domanda «isolato o collegato?» va fatta prima di ogni conto: è lì che casca metà degli scritti.`},
   {q:R`Perché la capacità di una sfera isolata non contiene nessuna «seconda armatura»?`,
    a:R`Ce l&rsquo;ha: è l&rsquo;<b>infinito</b>, dove si è scelto $V=0$. Il limite $R_2\to\infty$ della formula sferica lo mostra esplicitamente. Ogni capacità è sempre <i>fra due cose</i>; quando se ne nomina una sola, l&rsquo;altra è il riferimento di potenziale — e infatti per un conduttore «messo a terra» la seconda armatura è letteralmente la terra.`}
  ]}
]},

/* ---------------- 04b · SISTEMI DI CONDUTTORI ---------------- */
{ num:'04b', title:'Sistemi di conduttori: la matrice che li lega, e il teorema che rende lecito tutto il resto', meta:'coefficienti di induzione · problema di Dirichlet · unicita della soluzione · reciprocita · energia di un sistema',
  blocchi:[
  {t:'prosa', title:'Il problema che non abbiamo ancora posto', tag:'architettura', html:R`
  <p>Fin qui abbiamo risolto configurazioni <b>a simmetria alta</b>: sfere concentriche, cilindri coassiali, armature piane. In tutte quante il campo lo dava Gauss, e la condizione $\vec E=0$ nel metallo serviva a contare le cariche indotte. Ma la voce del programma si chiama <i>Sistemi di conduttori</i>, e il problema generale è un altro: <b>dati $n$ conduttori di forma qualunque, in posizione qualunque, e noti i loro potenziali (o le loro cariche), trovare il campo in tutto lo spazio.</b> Qui Gauss non basta più — non esiste una superficie con la simmetria del problema, perché il problema non ha simmetria.</p>
  <p>Vale la pena porre il problema anche se non lo risolveremo in generale, per tre ragioni che si chiudono tutte nel giro di questa tappa. La prima: è il problema che <b>legittima</b> tutto ciò che abbiamo fatto, perché contiene il teorema che garantisce che la capacità sia un numero e non un&rsquo;impressione. La seconda: la sua struttura — <i>lineare</i> — è l&rsquo;unica cosa che serve sapere per risolvere gli esercizi con più conduttori senza simmetria, e produce la matrice dei coefficienti. La terza: dentro ci sta la dimostrazione della gabbia di Faraday, che la tappa 05 userà.</p>`},
  {t:'reveal', title:'Il problema di Dirichlet, e cosa garantisce esattamente', tag:'first principles', steps:[
   {label:'La forma del problema', body:R`
   <p>Nello spazio fra i conduttori non ci sono cariche, quindi $\rho=0$ e il potenziale obbedisce all&rsquo;equazione di Laplace, $\nabla^{2}V=0$: è una <span class="str" data-str="funzione-armonica">funzione armonica</span>. Sui conduttori il potenziale è <b>assegnato</b>, perché ciascuno è un equipotenziale a valore noto (lo fissa un generatore, o la terra). Il problema «trovare una funzione armonica in una regione, noti i suoi valori sul bordo» ha un nome: è il <b>problema di Dirichlet</b>, e <b>Mazzoldi</b> gli dedica il §4.11 (pp. 124-126), l&rsquo;unico dei quattro libri a farlo esplicitamente.</p>
   <p>C&rsquo;è una condizione in più, facile da dimenticare, e Mazzoldi la enuncia: il bordo non è fatto solo dai conduttori, c&rsquo;è anche <b>l&rsquo;infinito</b>. Perché la soluzione esterna sia determinata, $V$ deve andare a zero all&rsquo;infinito almeno come $1/r$ e la sua derivata radiale almeno come $1/r^{2}$. Questo richiede che i conduttori abbiano <b>dimensioni finite</b> — ed è esattamente il motivo per cui il filo indefinito, il piano indefinito e il cilindro indefinito, con cui facciamo esercizi tutti i giorni, hanno potenziali che divergono: non sono problemi di Dirichlet ben posti nello spazio intero, sono idealizzazioni locali. Il potenziale logaritmico del cilindro, che non va a zero all&rsquo;infinito, è il sintomo visibile di quella patologia.</p>`},
