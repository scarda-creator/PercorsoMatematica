  code{background:var(--panel2);border:1px solid var(--border);border-radius:5px;

  .katex{font-size:1.02em;color:var(--txt);} .katex-display{margin:.5em 0;overflow-x:auto;overflow-y:hidden;}

  @media(max-width:860px){
    .shell{flex-direction:column;}
    .sidebar{width:100%;flex:none;position:static;max-height:none;border-right:none;

    .sidebar h2{width:100%;} .navitem{width:auto;}
    .main{padding:20px 16px 80px;}
  }

<script>
"use strict";
const R = String.raw;

function typeset(el){
  if(el && window.renderMathInElement){
    try{ renderMathInElement(el,{delimiters:[

function elFromHTML(html){ var d=document.createElement('div'); d.innerHTML=html; return d; }

/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un
   rimando scritto nella prosa:

       <span class="str" data-str="serie-geometrica">la serie geometrica</span>

   Le schede citate da questo nucleo sono cucite qui sotto dal montaggio
   (assembla-nucleo.js): la pagina resta autosufficiente — niente fetch,
   niente sottocartelle da pubblicare — e un rimando a una scheda che non
   esiste FERMA la costruzione invece di arrivare in pagina rotto.
   Apertura: lo stesso gesto del collaudo (si clicca, il pannello compare,
   si typeset una volta sola), portato dentro la frase.
   =================================================================== */
var CORSO = 'meccanica-statistica';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["delta-di-dirac"] = {"nome":"Delta di Dirac","riga":"Non è una funzione ma un funzionale, definito da $\\int f(x)\\,\\delta(x-a)\\,dx=f(a)$, che composto con una funzione si spezza sui suoi zeri come $\\delta(g(x))=\\sum_i \\delta(x-x_i)/|g'(x_i)|$.","serve":"Serve come macchina per cambiare variabile senza invertire nulla. La densità di $y=f(x)$ si scrive $p_Y(y)=\\int p_X(x)\\,\\delta(y-f(x))\\,dx$, e la delta produce da sola il fattore $1/|f'|$ che altrimenti andrebbe messo a mano: i rami molteplici si contano da soli invece di doverli ricordare. È la ragione pratica per cui il formalismo con la delta compare in ogni soluzione d'esame che tocchi una distribuzione, mentre il cambio di variabile esplicito compare quasi mai.","esempio":"$\\delta(x^2-a^2)$ con $a$ positivo. Gli zeri sono $x=\\pm a$; la derivata dell'argomento è $2x$, che in modulo vale $2a$ su entrambi. Quindi $\\delta(x^2-a^2)=\\dfrac{1}{2a}\\big[\\delta(x-a)+\\delta(x+a)\\big]$. Il caso si ripete identico in fisica statistica con $\\varepsilon=p^2/2m$ in una dimensione, dove i due rami $p=\\pm\\sqrt{2m\\varepsilon}$ contribuiscono entrambi — e dimenticarne uno dimezza la risposta.","pieno":{"file":"15-distribuzioni.html","tappa":"01","come":"le distribuzioni come funzionali, la delta e le sue proprietà, nel nucleo di Metodi"},"qui":{"meccanica-statistica":{"serve":"È lo strumento con cui si calcola la densità degli stati, cioè l'oggetto su cui poggia tutto il secondo tempo del corso: $g(\\varepsilon)=\\int d^dp\\,d^dq\\;\\delta(\\varepsilon-H)/h^d$. L'identità che si usa davvero non è la definizione ma questa: $\\delta(\\varepsilon-H)=\\partial_\\varepsilon\\,\\theta(\\varepsilon-H)$. Si scambia l'integrale con la derivata e ci si ritrova a calcolare il volume della regione dove l'hamiltoniana sta sotto $\\varepsilon$ — un integrale elementare — invece di un integrale con una delta dentro. La $g$ così ottenuta è pura geometria dello spazio delle fasi: non sa nulla della temperatura, e per questo resta identica quando si passa da Boltzmann a Fermi o a Bose.","esempio":"Particella libera in due dimensioni. Il volume della regione $p^2/2m$ sotto $\\varepsilon$ è il disco di area $2\\pi m\\varepsilon$; derivando rispetto a $\\varepsilon$ si ottiene $2\\pi m$, cioè una densità degli stati costante. Non è una curiosità: è la ragione per cui in due dimensioni una particella libera non condensa, e per cui le prove che chiedono la condensazione in $d=2$ mettono sempre un potenziale confinante, che porta la $g$ da costante a crescente."}},"controllo":[{"tipo":"derivata","espr":"x**2-a**2","rispetto":["x"],"vale":"2*x","ipotesi":{"x":"positive","a":"positive"},"dove":"esempio","appare":"2x"},{"tipo":"uguale","sinistra":"1/Abs(2*a)","vale":"1/(2*a)","ipotesi":{"a":"positive"},"dove":"esempio","appare":"\\dfrac{1}{2a}"},{"tipo":"derivata","espr":"2*pi*m*e","rispetto":["e"],"vale":"2*pi*m","ipotesi":{"m":"positive","e":"positive"},"dove":"qui.meccanica-statistica.esempio","appare":"2\\pi m"}]};
STRUM["misura-nulla"] = {"nome":"Insieme di misura nulla","riga":"$A$ ha misura nulla se per ogni $\\varepsilon\\gt0$ esiste una famiglia numerabile di cubi che lo ricopre e la cui somma dei volumi è minore di $\\varepsilon$: «trascurabile» non vuol dire piccolo, vuol dire coperto a costo arbitrariamente basso.","serve":"È la nozione che permette di dire «quasi ogni» senza teoria della misura completa: non serve costruire Lebesgue, basta la definizione col ricoprimento, ed è per questo che entra in geometria differenziale senza dipendenze. Tre proprietà fanno tutto il lavoro, e sono le sole che si usano: (a) un'unione **numerabile** di insiemi di misura nulla ha misura nulla — è ciò che consente di ragionare carta per carta su una varietà, che di carte ne ha una base numerabile; (b) avere misura nulla è **invariante per diffeomorfismi**, anzi per mappe lisce fra aperti della stessa dimensione, quindi è una proprietà che la varietà possiede indipendentemente dalle carte scelte; (c) un insieme di misura nulla ha **parte interna vuota**, quindi il suo complementare è denso: da «i valori cattivi hanno misura nulla» segue sempre «ce n'è uno buono comunque vicino». La numerabilità in (a) non è un dettaglio tecnico: l'unione **non** numerabile dei punti di $[0,1]$, ciascuno di misura nulla, è $[0,1]$.","esempio":"I razionali di $[0,1]$ hanno misura nulla, pur essendo densi. Si enumerano, $q_1,q_2,\\dots$ — si può, sono numerabili — e attorno a $q_n$ si mette un intervallo di lunghezza $\\varepsilon/2^{n}$. Il ricoprimento c'è per costruzione, e la somma delle lunghezze è $\\sum_{n\\ge1}\\varepsilon/2^{n}=\\varepsilon$, arbitrariamente piccola. Il conto che regge tutto è la serie geometrica: si spende un budget finito distribuendolo su infiniti punti, perché i pezzi decrescono in modo sommabile. Lo stesso conto, rovesciato, dà l'insieme di Cantor: al passo $k$ restano $2^{k}$ intervalli di lunghezza $3^{-k}$, per una misura totale $(2/3)^{k}$, e $\\lim_{k\\to\\infty}(2/3)^{k}=0$ — misura nulla pur essendo più che numerabile, il che mostra che «numerabile» e «di misura nulla» sono condizioni diverse e la prima è solo sufficiente.","debito":"la misura di Lebesgue vera — $\\sigma$-additività, misurabilità, insiemi non misurabili — sta fuori dal percorso, e qui non serve: in geometria differenziale di «misura» si usa soltanto l'ideale degli insiemi trascurabili. Il teorema di Fubini per la misura nulla («se quasi ogni fetta è trascurabile nella fetta, l'insieme è trascurabile») si usa nella dimostrazione di Sard ed è ammesso senza prova.","controllo":[{"tipo":"somma","espr":"eps/2**n","var":"n","da":"1","a":"oo","vale":"eps","ipotesi":{"eps":"positive","n":"positive"},"dove":"esempio","appare":"\\sum_{n\\ge1}\\varepsilon/2^{n}=\\varepsilon"},{"tipo":"uguale","sinistra":"2**k*3**(-k)","vale":"(2/3)**k","ipotesi":{"k":"positive"},"dove":"esempio","appare":"(2/3)^{k}"},{"tipo":"limite","espr":"(2/3)**k","var":"k","a":"oo","vale":"0","ipotesi":{"k":"positive"},"dove":"esempio","appare":"\\lim_{k\\to\\infty}(2/3)^{k}=0"}]};
STRUM["disuguaglianza-di-schwarz"] = {"nome":"Disuguaglianza di Cauchy-Schwarz","riga":"$|\\langle\\phi|\\psi\\rangle|^{2}\\le\\langle\\phi|\\phi\\rangle\\,\\langle\\psi|\\psi\\rangle$, con l'uguaglianza se e solo se i due vettori sono proporzionali.","serve":"E' la disuguaglianza da cui nasce il principio di indeterminazione. Applicata agli scarti di due osservabili, e tenendo la sola parte immaginaria del prodotto scalare, da' un limite inferiore al prodotto delle due varianze pari al quadrato di $\\tfrac{1}{2i}\\langle[\\hat A,\\hat B]\\rangle$. L'indeterminazione non e' un postulato: e' Cauchy-Schwarz piu' un commutatore.","esempio":"Con posizione e impulso il commutatore vale $i\\hbar$, e la disuguaglianza diventa $\\sigma_x^{2}\\sigma_p^{2}\\ge\\hbar^{2}/4$, cioe' $\\sigma_x\\sigma_p\\ge\\hbar/2$. Il fattore un mezzo viene dal $2i$ al denominatore, non da una convenzione scelta.","debito":"la dimostrazione della disuguaglianza — il discriminante della norma quadra di una combinazione lineare — e' quella standard degli spazi con prodotto interno e non si ripete qui.","controllo":[{"tipo":"uguale","sinistra":"(1/(2*I)*(I*hbar))**2","vale":"hbar**2/4","ipotesi":{"hbar":"positive"},"dove":"esempio","appare":"\\hbar^{2}/4"},{"tipo":"uguale","sinistra":"sqrt(hbar**2/4)","vale":"hbar/2","ipotesi":{"hbar":"positive"},"dove":"esempio","appare":"\\hbar/2"}],"qui":{},"pieno":null};

function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';
  return h;
}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;

/* ---------------- 00 · PERCHÉ QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Perché questo movimento', meta:'la media di Gibbs è su copie mentali, la misura è su un sistema solo · e fra le due c’è un’ipotesi',
  blocchi:[
  {t:'prosa', title:'La domanda, posta con precisione', tag:'first principles', html:R`
  <p>La meccanica statistica calcola le medie <b>d&rsquo;insieme</b>: si pesa ogni microstato con $\rho$ e si integra su tutto lo spazio delle fasi. Il laboratorio misura invece medie <b>temporali</b>: uno strumento osserva <i>un</i> sistema per un certo tempo e restituisce la media di quel che è successo. Che le due coincidano non è ovvio — <b>è un&rsquo;ipotesi</b>, e si chiama ipotesi ergodica:
  $$\lim_{T\to\infty}\frac1T\int_0^T A\big(q(t),p(t)\big)\,dt \;=\; \int_\Gamma A(q,p)\,\rho(q,p)\,d\Gamma.$$</p>
  <p>A sinistra <b>una traiettoria</b> seguita a lungo; a destra <b>tutto lo spazio</b> pesato in un istante. L&rsquo;uguaglianza dice che, col tempo, una singola traiettoria «campiona» l&rsquo;intero spazio accessibile con le frequenze giuste. <b>Se è vera, il calcolo teorico e la misura parlano della stessa cosa.</b> Se è falsa, la meccanica statistica non ha fondamento — e in molti sistemi è falsa.</p>
  <p>Sciortino lo dice in una frase che vale come programma: <i>«affinché la teoria che cercheremo di sviluppare abbia un senso fisico, occorre che le due medie diano risultati compatibili. Questo implica anche che la dipendenza dallo stato iniziale debba scomparire»</i>. Le due condizioni sono distinte, e il seguito le affronta separatamente: l&rsquo;uguaglianza delle medie, e l&rsquo;indipendenza dal punto di partenza.</p>`},
  {t:'prosa', title:'Che cosa si dirà, e in che ordine', tag:'architettura', html:R`
  <p>Il percorso ha una forma precisa, e conviene averla in testa perché la conclusione capovolge l&rsquo;impostazione iniziale.</p>
  <ol>
  <li>Prima si <b>deriva</b> che cosa l&rsquo;ipotesi ergodica chieda esattamente: e la risposta, ottenuta con un trucco di due righe, è che <b>$\rho$ deve essere il tempo di soggiorno</b> della traiettoria. Non un assioma in più: una riscrittura di quello che si vuole.</li>
  <li>Poi si dà la definizione <b>seria</b> — insiemistica — e i due teoremi di <b>Birkhoff</b>, che risolvono la questione della dipendenza dal punto iniziale e riducono tutto a una condizione: che lo spazio delle fasi non sia scisso in sottoparti.</li>
  <li>Poi si guarda quanto quella condizione sia <b>fragile</b>: le costanti del moto la distruggono, KAM mostra che i tori resistono alle perturbazioni, e nei sistemi reali convivono isole regolari e mare caotico. Qui l&rsquo;ipotesi ergodica sembra crollare.</li>
  <li>Infine si mostra che <b>la domanda era mal posta</b>, ed è la parte che il corso mette in fondo e che vale il movimento: l&rsquo;ergodicità non serve <i>per ogni</i> osservabile. Per le osservabili sbagliate — quelle <b>prodotto</b> — il tempo necessario è $\propto\epsilon^{-\gamma N}$ e non si farà mai meccanica statistica; per quelle giuste — le <b>somme</b> — i teoremi di <b>Khinchin</b> danno la convergenza con un errore che va come $N^{-1/4}$, e soprattutto danno l&rsquo;<b>automediazione</b>. Ed è l&rsquo;automediazione, non l&rsquo;ergodicità, la ragione per cui la meccanica statistica funziona.</li>
  </ol>`}
]},

/* ---------------- 01 · LA TRAIETTORIA COME MISURA ---------------- */
{ num:'01', title:'La traiettoria come misura: da dove viene $\\rho$', meta:'il trucco della delta · $\\rho$ è il tempo di soggiorno · e le due definizioni alternative',
  blocchi:[
  {t:'reveal', title:'Che cosa deve essere $\\rho$, se le due medie coincidono', tag:'la derivazione che chiarisce tutto', steps:[
   {label:'La media che si misura', body:R`<p>Sperimentalmente si misura la quantità
   $$\bar O(q_0,p_0)=\frac1T\int_0^T O\big(q(t),p(t)\,\big|\,q_0,p_0\big)\,dt,$$
   dove $(q_0,p_0)$ sono i dati iniziali e la barra indica la media temporale. Nel membro destro c&rsquo;è una traiettoria e non c&rsquo;è nessuna $\rho$: è la media che lo strumento restituisce, e dipende — almeno in apparenza — dal punto di partenza.</p>`},
   {label:'Il trucco: inserire una delta', body:R`<p>Si usa la proprietà di normalizzazione della <span class="str" data-str="delta-di-dirac">delta di Dirac</span> in $6N$ dimensioni,
   $$\int dp^{3N}dq^{3N}\,\delta(q-q(t))\,\delta(p-p(t))=1,$$
   e la si inserisce dentro la definizione di $\bar O$:
   $$\bar O=\frac1T\int_0^T\!\!dt\int dp^{3N}dq^{3N}\,\delta(q-q(t))\,\delta(p-p(t))\,O\big(q(t),p(t)\big).$$
   Ora si sfrutta il fatto che le delta annullano l&rsquo;integrando fuori dal punto della traiettoria, cioè che $O(q(t),p(t))=O(q,p)$ dove le delta sono accese; e si scambia l&rsquo;ordine degli integrali:
   $$\bar O=\int dp^{3N}dq^{3N}\,O(q,p)\;\underbrace{\frac1T\int_0^T\delta(q-q(t))\,\delta(p-p(t))\,dt}_{\textstyle \text{questo deve essere }\rho}.$$</p>`},
   {label:'La conclusione, e cosa significa', body:R`<p>Il confronto con la media di Gibbs è immediato e obbliga a
   $$\rho(q,p)=\lim_{T\to\infty}\frac1T\int_0^T\delta(q-q(t))\,\delta(p-p(t))\,dt,$$
   dove $T$ è un tempo macroscopico molto maggiore dei tempi microscopici — in un gas, molto maggiore del tempo tipico fra due collisioni. <b>Questo è il contenuto esatto dell&rsquo;ipotesi ergodica</b>, ed è più illuminante della formulazione «la traiettoria visita tutto»: Sciortino lo mette come <b>Concetto Importante</b>, e vale la pena ripeterlo con le sue parole — <i>la traiettoria spende in vicinanza di un punto un tempo proporzionale alla probabilità di quel punto</i>.</p>
   <p><b>Perché questa forma cambia il modo di pensarci.</b> La densità $\rho$ smette di essere un oggetto postulato e diventa una <b>misura empirica</b>: è la frazione di tempo che il sistema passa in ogni regione. L&rsquo;ipotesi ergodica non chiede alla traiettoria di passare per ogni punto — chiede che <b>il tempo di soggiorno sia distribuito come la probabilità che si vuole usare</b>. E si vede subito anche dove può rompersi: se il tempo di soggiorno dipende da $(q_0,p_0)$, allora $\rho$ dipende dai dati iniziali, e l&rsquo;insieme statistico non descrive il sistema ma una particolare storia.</p>`}
  ]},
  {t:'prosa', title:'Le due definizioni alternative, e sono più utili di quanto sembri', tag:'grammatica', html:R`
  <p>Altre due formulazioni si usano continuamente, e fanno vedere aspetti diversi della stessa cosa.</p>
  <p><b>Prima.</b> Un sistema è <b>ergodico</b> se, partendo da un punto dello spazio delle fasi, nel tempo si può arrivare <i>arbitrariamente vicino</i> a qualsiasi altro punto accessibile — per esempio a qualsiasi punto di uguale energia, se il sistema è isolato. Si noti il «arbitrariamente vicino»: non «passare per», che sarebbe impossibile, e la ragione è dimensionale — una curva ha dimensione $1$, la superficie di energia ne ha $6N-1$, e una linea non riempie un volume.</p>
  <p><b>Seconda</b>, ed è la forma operativa: un sistema è ergodico <b>se il suo spazio delle fasi non è scisso in sottoparti</b>. È la formulazione che si può <i>controllare</i> in un caso concreto, perché scovare una partizione è più facile che verificare un limite: basta trovare una quantità conservata oltre l&rsquo;energia, oppure — come nella figura del pendolo — una separatrice che divide regioni che la dinamica non collega.</p>
  <p>Le tre formulazioni — tempo di soggiorno, densità dell&rsquo;orbita, indecomponibilità — sono equivalenti, e conviene averle tutte: all&rsquo;orale la domanda arriva in una delle tre lingue, e non sempre in quella in cui si è studiata.</p>`},
  {t:'plot', title:'La media temporale che converge, e non sa da dove è partita',
   intro:R`Andamento schematico di $\bar A(T)$ al crescere del tempo di osservazione, per due dati iniziali diversi nello stesso sistema ergodico. Le curve non sono calcolate da una dinamica: mostrano la forma della convergenza, che è ciò che il teorema di Birkhoff garantisce.`,
   plots:[
    {kind:'func2d', xr:[0.6,40], yr:[0.3,1.8], equal:false,
     curves:[
      {f:'1 + 0.8*sin(3*x)/x', col:'#5eead4', label:'media temporale, dato iniziale A'},
      {f:'1 - 1.1*cos(2.2*x+1)/x', col:'#ff9b6b', label:'media temporale, dato iniziale B'},
      {f:'1', col:'#b98cff', label:'media d insieme', dash:true}
     ],
     title:'ascissa: tempo di osservazione T · ordinata: media accumulata'}
   ],
   leggi:R`<p><b>Che cosa guardare</b>: due curve che partono da valori molto diversi — perché per tempi brevi la media risente di dove si è partiti — e convergono <i>entrambe</i> allo stesso limite, che è la media d&rsquo;insieme tratteggiata. L&rsquo;ampiezza dell&rsquo;oscillazione decade come $1/T$: è la forma tipica di una media accumulata su un segnale che si decorrela.</p>
   <p><b>Che cosa impararne, e sono due cose.</b> Primo: <b>l&rsquo;indipendenza dal dato iniziale non è gratis</b>, è ciò che il primo teorema di Birkhoff afferma e che vale «per quasi ogni» condizione iniziale — esistono dati iniziali eccezionali, e stanno in un insieme di <span class="str" data-str="misura-nulla">misura nulla</span>. Secondo: <b>il limite è un limite, non un valore raggiunto</b>. La domanda «quanto grande deve essere $T$» non ha risposta in questa figura, ed è esattamente la domanda che i teoremi di Birkhoff <i>non</i> affrontano — la affronta Khinchin, nella tappa 06.</p>
   <p><b>E l&rsquo;avvertenza sull&rsquo;onestà della figura</b>: le due curve sono funzioni scelte per avere la forma giusta, non l&rsquo;output di un&rsquo;integrazione. Serve a fissare l&rsquo;immagine della convergenza, non a dimostrarla; la dimostrazione è un teorema e sta nella tappa seguente.</p>`}

/* ---------------- 02 · LA DEFINIZIONE SERIA E BIRKHOFF ---------------- */
{ num:'02', title:'La definizione seria, e i due teoremi di Birkhoff', meta:'insiemi invarianti di misura zero o uno · esistenza del limite · indipendenza dal punto iniziale',
  blocchi:[
  {t:'prosa', title:'Perché «passa per ogni punto» è la definizione sbagliata', tag:'grammatica', html:R`
  <p>La formulazione ingenua — «la traiettoria passa per <b>tutti</b> i punti della superficie di energia» — è <b>falsa per ragioni di dimensione</b>: una curva ha dimensione $1$, la superficie di energia ne ha $6N-1$. Una linea non può riempire un volume. E c&rsquo;è un secondo motivo, già stabilito: traiettorie distinte non si incontrano mai, quindi una traiettoria non può passare per punti che appartengono ad altre orbite.</p>
  <p>La definizione corretta è insiemistica: il sistema è <b>ergodico</b> se ogni insieme <b>invariante</b> sotto il flusso ha misura <b>zero</b> oppure <b>uno</b>. In parole: <b>non esistono regioni non banali in cui il moto resti intrappolato</b>. Non «passa ovunque», ma «non c&rsquo;è nessun pezzo che può fare a meno del resto» — ed è la versione precisa della seconda definizione alternativa della tappa 01.</p>
  <div class="note">Qui la misura invariante fa un lavoro decisivo: è <b>lei</b> a dire quali insiemi sono trascurabili. Cambiando misura cambierebbero le eccezioni, e l&rsquo;enunciato direbbe un&rsquo;altra cosa. L&rsquo;invarianza del volume delle fasi non è un dettaglio tecnico: è ciò che rende la definizione di ergodicità indipendente dall&rsquo;istante in cui la si formula.</div>`},
  {t:'reveal', title:'I due teoremi di Birkhoff, come li enuncia il corso', tag:'teoremi', steps:[
   {label:'Primo: il limite esiste, e non dipende da dove parti', body:R`<p><b>Per quasi tutte le condizioni iniziali $X_0$</b>, la media su un tempo infinito
   $$\bar A(X_0)=\lim_{T\to\infty}\frac1T\int_0^T A\big(U^{t}X_0\big)\,dt$$
   <b>esiste</b>, e il limite <b>non dipende</b> dalla scelta del punto iniziale della traiettoria.</p>
   <p><b>Che cosa risolve, e non è poco.</b> Delle due condizioni poste all&rsquo;inizio — uguaglianza delle medie, e scomparsa della dipendenza dallo stato iniziale — questo teorema chiude la seconda, e la chiude <i>gratis</i>: non chiede ergodicità, chiede solo che il flusso conservi una misura di probabilità. Il prezzo è il «quasi tutte»: esistono condizioni iniziali eccezionali, e sono quelle di misura nulla.</p>`},
   {label:'Secondo: la condizione è l’indecomponibilità', body:R`<p><b>Affinché un sistema sia ergodico, lo spazio delle fasi non deve essere partizionato in sottoparti dalla dinamica prescelta.</b> Cioè: la traiettoria deve visitare tutto lo spazio delle fasi, non deve essere limitata a una sua parte — e Sciortino aggiunge l&rsquo;avvertenza che conta: <i>questo non vuol dire che la traiettoria debba visitare tutti i punti dello spazio delle fasi, ma che deve andare arbitrariamente vicino a ogni punto</i>.</p>
   <p><b>Il bilancio dopo Birkhoff</b>, ed è il punto da cui riparte il seguito. I due teoremi sono «già tranquillizzanti»: risolvono il problema delle condizioni iniziali e riducono l&rsquo;ergodicità a una sola condizione geometrica. <b>Ma non dicono nulla su quando debba essere grande $T$</b> — e mostrare l&rsquo;indecomponibilità richiesta dal secondo teorema, per un sistema concreto, non è affatto banale. Sono le due crepe: una sui tempi, una sulla verificabilità. La tappa 03 mostra quanto sia profonda la seconda, la tappa 06 chiude la prima.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`L&rsquo;oscillatore armonico è ergodico sulla sua superficie di energia?`,
    a:R`<b>Sì, ma banalmente</b>: la superficie di energia è una singola ellisse (curva chiusa) e la traiettoria la percorre tutta, quindi non esistono sottoinsiemi invarianti propri. Il caso interessante è l&rsquo;opposto: due oscillatori <b>indipendenti</b> con frequenze in rapporto razionale danno traiettorie <b>chiuse</b> che coprono solo una curva sul toro — <b>non ergodico</b>, perché quella curva è un invariante di misura nulla e il suo complementare di misura uno, ma esistono anche invarianti intermedi; con rapporto irrazionale la traiettoria è densa sul toro, e il sistema è ergodico. <b>Un&rsquo;intera proprietà fisica che dipende dall&rsquo;irrazionalità di un numero</b>: è il primo segnale che l&rsquo;ergodicità è una nozione delicata, non generica.`},
   {q:R`Perché un sistema <b>integrabile</b> (tante costanti del moto quanti gradi di libertà) non può essere ergodico?`,
    a:R`Perché ogni costante del moto ulteriore all&rsquo;energia <b>ritaglia</b> la superficie di energia in sottoinsiemi invarianti di misura né $0$ né $1$: il moto resta confinato su un <b>toro</b> di dimensione $n$ dentro una superficie di dimensione $2n-1$. Le medie temporali dipendono allora da <i>quale</i> toro, cioè dai valori iniziali delle costanti — e non coincidono con la media d&rsquo;insieme calcolata sull&rsquo;intera superficie. <b>Le leggi di conservazione sono nemiche dell&rsquo;ergodicità</b>, e per questo i sistemi molto simmetrici termalizzano male. È anche il motivo per cui una distribuzione di equilibrio deve essere funzione di <i>tutte</i> le costanti del moto, non della sola energia.`}
  ]}
]},

/* ---------------- 03 · TORI E CAOS ---------------- */
{ num:'03', title:'Tori che sopravvivono e mare caotico', meta:'KAM · la transizione non è brusca · una figura che è un esperimento numerico',
  blocchi:[
  {t:'prosa', title:'Cosa succede accendendo una perturbazione', tag:'il fatto sperimentale', html:R`
  <p>Se un sistema integrabile viene perturbato, l&rsquo;aspettativa ingenua è che diventi subito ergodico: le costanti del moto in eccesso non sono più conservate, quindi i tori che ritagliavano lo spazio dovrebbero dissolversi. Il <b>teorema KAM</b> (Kolmogorov&ndash;Arnold&ndash;Moser) dice il contrario: per perturbazione piccola, <b>la maggior parte dei tori sopravvive</b>, deformata ma intatta. Il sistema resta intrappolato, e l&rsquo;ergodicità non c&rsquo;è.</p>
  <p>Crescendo la perturbazione i tori si rompono <b>uno alla volta</b> — prima quelli con frequenze «quasi razionali», resistono più a lungo quelli il cui rapporto di frequenze è mal approssimabile dai razionali — e fra i tori superstiti si apre un <b>mare caotico</b>. Lo spazio delle fasi diventa un misto: isole di regolarità immerse nel disordine. <b>La transizione all&rsquo;ergodicità non è un interruttore, è un&rsquo;erosione</b>, e per buona parte del cammino la condizione di indecomponibilità del secondo teorema di Birkhoff è violata.</p>`},
  {t:'plot', title:'La mappa standard: la stessa dinamica, due intensità',
   intro:R`Iterazione di $p_{n+1}=p_n+K\sin q_n$, $q_{n+1}=q_n+p_{n+1}$ (mappa standard di Chirikov), su un toro. Ogni colore è <b>una sola</b> condizione iniziale, seguita per 600 passi.`,
   plots:[
    {kind:'iter2d', fq:'x + (y + 0.4*sin(x))', fp:'y + 0.4*sin(x)',
     xr:[0,6.28319], yr:[0,6.28319], wrapx:true, wrapy:true, iter:600, equal:true, ticks:false,
     w:400, height:380, title:'K=0.4: quasi ogni orbita resta su una curva (toro KAM)',
     seeds:[[0.1,0.55],[0.1,1.1],[0.1,1.65],[0.1,2.2],[0.1,2.75],[0.1,3.3],[0.1,3.85],[0.1,4.4],[0.1,4.95],[0.1,5.5],[0.1,6.0],[3.14159,3.14159],[3.34,3.14159],[3.54,3.14159]]},
    {kind:'iter2d', fq:'x + (y + 1.1*sin(x))', fp:'y + 1.1*sin(x)',
     xr:[0,6.28319], yr:[0,6.28319], wrapx:true, wrapy:true, iter:600, equal:true, ticks:false,
     w:400, height:380, title:'K=1.1: una sola orbita riempie il mare caotico',
     seeds:[[0.1,0.55],[0.1,1.1],[0.1,1.65],[0.1,2.2],[0.1,2.75],[0.1,3.3],[0.1,3.85],[0.1,4.4],[0.1,4.95],[0.1,5.5],[0.1,6.0],[3.14159,3.14159],[3.34,3.14159],[3.54,3.14159]]}
   ],
   leggi:R`<p><b>Questa figura non è un disegno: è un esperimento numerico</b>, gli stessi semi iterati con due valori del parametro. A sinistra ogni colore resta su una <b>curva</b>: sono i tori KAM, e ciascuna orbita conosce solo la propria — <b>il sistema non è ergodico</b>, perché quelle curve sono insiemi invarianti di misura né $0$ né $1$. A destra, con perturbazione più forte, la maggior parte dei colori si sparpaglia in una <b>nube</b> che riempie la stessa regione: lì una singola orbita visita quasi tutto, e le medie temporali cominciano ad avere senso.</p>
   <p>Ma si guardi bene: <b>restano le isole</b>, piccole zone regolari attorno ai punti fissi stabili, dove un&rsquo;orbita è ancora intrappolata. <b>Ecco perché l&rsquo;ergodicità è delicata</b>: nello stesso sistema, alla stessa energia, alcune condizioni iniziali termalizzano e altre no. Non è una proprietà del sistema soltanto: è una proprietà di <i>dove</i> si parte.</p>
   <p><b>E la conseguenza sul secondo teorema di Birkhoff</b>: la sua condizione — spazio delle fasi non partizionato — qui è violata a <i>qualunque</i> valore del parametro, perché un&rsquo;isola, anche piccolissima, è una sottoparte invariante di misura positiva. In senso stretto questo sistema non è ergodico mai. Che la meccanica statistica funzioni comunque è il paradosso che le due tappe finali sciolgono.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Se il mare caotico e le isole convivono, il sistema è ergodico o no?`,
    a:R`<b>Non</b> ergodico in senso stretto: le isole sono insiemi invarianti di misura positiva e minore di uno, che è esattamente la negazione della definizione. Ma il mare caotico può essere ergodico <b>al suo interno</b>, e se occupa gran parte del volume le previsioni statistiche funzionano <i>in pratica</i> per quasi tutte le condizioni iniziali. <b>È il primo esempio serio di una distinzione che ritorna</b>: la proprietà matematica esatta è falsa, la sua versione approssimata regge — e ciò che si misura in laboratorio è la seconda. Il modo rigoroso di dirlo è che la meccanica statistica non ha bisogno dell&rsquo;ergodicità sull&rsquo;intero $\Gamma$: ha bisogno che le osservabili che interessano non distinguano le isole dal mare, ed è la tappa 05.`}
  ]}
]},

/* ---------------- 04 · MESCOLAMENTO ---------------- */
{ num:'04', title:'Il mescolamento è più forte dell’ergodicità', meta:'ergodico non implica mescolante · perché serve il mixing per l’equilibrio · i tempi di Lyapunov',
  blocchi:[
  {t:'prosa', title:'Due proprietà che si confondono sempre', tag:'la distinzione che conta', html:R`
  <p><b>Ergodico</b> significa che le medie temporali convergono a quelle d&rsquo;insieme. <b>Mescolante</b> (mixing) è più forte: per ogni coppia di regioni $A,B$,
  $$\mu\big(\Phi_t(A)\cap B\big)\ \xrightarrow[t\to\infty]{}\ \mu(A)\,\mu(B).$$
  Cioè: dopo un tempo lungo, la frazione dell&rsquo;insieme $A$ che si trova in $B$ è la stessa <b>ovunque</b> — $A$ si è spalmato uniformemente, e sapere di essere partiti in $A$ non dice più nulla su dove ci si trova.</p>
  <p><b>Mescolante implica ergodico, non il viceversa.</b> Il controesempio è pulito: una <b>rotazione irrazionale</b> del cerchio è ergodica (l&rsquo;orbita è densa, le medie temporali funzionano) ma <b>non mescola</b> — un arco ruota rigidamente e resta un arco, non si spalma mai, e $\mu(\Phi_t(A)\cap B)$ continua a oscillare senza convergere. <b>Il gas che si diffonde in una stanza richiede il mescolamento, non la sola ergodicità</b>: l&rsquo;ergodicità garantisce le medie su tempi infiniti, il mescolamento garantisce che il sistema <i>si avvicini</i> all&rsquo;equilibrio e ci resti.</p>
  <div class="note">Il meccanismo del mescolamento è quello già visto nello shear: <b>stirare e ripiegare</b>. Non potendo comprimere il volume, l&rsquo;unico modo di spalmare una regione ovunque è allungarla in filamenti sempre più sottili che si intrecciano. Il tasso di allungamento è l&rsquo;<b>esponente di Lyapunov</b> $\lambda$: dove è positivo, due condizioni iniziali vicine si separano come $e^{\lambda t}$, ed è la definizione operativa di <b>caos</b>.</div>`},
  {t:'plot', title:'Stirare e ripiegare: l’unico modo di mescolare senza comprimere',
   intro:R`Un segmento di condizioni iniziali vicine <b>nel mare caotico</b>, seguito per 3, 30 e 300 passi della mappa standard ($K=1.1$). Il seme è stato scelto <b>misurando</b>: su una griglia 20×20, quest&rsquo;orbita passa da 3 celle a 26 a 106.`,
   plots:[
    {kind:'iter2d', fq:'x + (y + 1.1*sin(x))', fp:'y + 1.1*sin(x)',
     xr:[0,6.28319], yr:[0,6.28319], wrapx:true, wrapy:true, iter:3, equal:true, ticks:false,
     w:270, height:260, title:'dopo 3 passi: ancora insieme',
     seeds:[[2.094,4.189],[2.095,4.189],[2.096,4.189],[2.097,4.189],[2.098,4.189],[2.099,4.189],[2.100,4.189],[2.101,4.189],[2.102,4.189],[2.103,4.189],[2.104,4.189]]},
    {kind:'iter2d', fq:'x + (y + 1.1*sin(x))', fp:'y + 1.1*sin(x)',
     xr:[0,6.28319], yr:[0,6.28319], wrapx:true, wrapy:true, iter:30, equal:true, ticks:false,
     w:270, height:260, title:'dopo 30: il filamento si allunga',
     seeds:[[2.094,4.189],[2.095,4.189],[2.096,4.189],[2.097,4.189],[2.098,4.189],[2.099,4.189],[2.100,4.189],[2.101,4.189],[2.102,4.189],[2.103,4.189],[2.104,4.189]]},
    {kind:'iter2d', fq:'x + (y + 1.1*sin(x))', fp:'y + 1.1*sin(x)',
     xr:[0,6.28319], yr:[0,6.28319], wrapx:true, wrapy:true, iter:300, equal:true, ticks:false,
     w:270, height:260, title:'dopo 300: sparsi ovunque',
     seeds:[[2.094,4.189],[2.095,4.189],[2.096,4.189],[2.097,4.189],[2.098,4.189],[2.099,4.189],[2.100,4.189],[2.101,4.189],[2.102,4.189],[2.103,4.189],[2.104,4.189]]}
   ],
   leggi:R`<p>Undici condizioni iniziali che all&rsquo;inizio distano <b>un millesimo</b> l&rsquo;una dall&rsquo;altra, prese nel mare caotico. Dopo pochi passi sono ancora un gruppetto; dopo trenta si sono distese; dopo trecento sono <b>indistinguibili da una nuvola casuale</b> sparsa su tutta la regione caotica.</p>
   <p><b>Eppure il volume non è cambiato di un&rsquo;unghia</b> e la dinamica è perfettamente <b>deterministica e invertibile</b>: dando i valori esatti finali e girando il tempo all&rsquo;indietro, i punti tornerebbero al segmentino di partenza. <b>La perdita è nella nostra risoluzione, non nella fisica.</b></p>
   <p><b>E la scala di tempo è fissata dall&rsquo;esponente di Lyapunov</b>, con una conseguenza che conviene avere in numeri: migliorare la precisione iniziale di un fattore mille compra soltanto un tempo di predizione più lungo di
   $$\ln1000/\lambda=3\ln10/\lambda,$$
   cioè circa $6{,}9/\lambda$. Se $\lambda$ è dell&rsquo;ordine dell&rsquo;inverso del tempo di collisione, tre ordini di grandezza di precisione in più comprano sette collisioni di previsione. <b>È il motivo per cui il caos non è imprecisione, ma amplificazione dell&rsquo;imprecisione</b> — e perché nessun aumento di potenza di calcolo risolve il problema.</p>`}
]},

/* ---------------- 05 · PER QUALI OSSERVABILI ---------------- */
{ num:'05', title:'La domanda era mal posta: per quali osservabili serve l’ergodicità', meta:'osservabili prodotto e osservabili somma · il tempo $\\epsilon^{-\\gamma N}$ · e perché l’energia è una buona osservabile',
  blocchi:[
  {t:'prosa', title:'Il capovolgimento', tag:'architettura', html:R`
  <p>Fin qui l&rsquo;ergodicità è stata trattata come una proprietà <b>del sistema</b>: o lo spazio delle fasi è indecomponibile, o non lo è. Con quel criterio la situazione è disperata — KAM e le isole dicono che quasi nessun sistema realistico è ergodico in senso stretto, e la meccanica statistica dovrebbe non funzionare.</p>
  <p><b>La via d&rsquo;uscita, ed è quella che il corso prende, è che l&rsquo;ergodicità non serve per ogni osservabile.</b> Ciò che serve è che le <i>grandezze che si misurano</i> abbiano la stessa media temporale e d&rsquo;insieme; e questo dipende dall&rsquo;osservabile tanto quanto dal sistema. Sciortino lo mostra con due casi opposti, «perché ci danno una idea del tipo di osservabile per i quali il teorema ergodico vale»: uno microscopico e uno macroscopico.</p>`},
  {t:'reveal', title:'Il caso che non funziona: un’osservabile prodotto', tag:'derivazione', steps:[
   {label:'L’osservabile, e la sua media d’insieme', body:R`<p>Si definisca l&rsquo;osservabile
   $$A(X)=\begin{cases}1&\text{se }X\in G\\ 0&\text{altrimenti}\end{cases}$$
   dove $G$ è una regione finita di $\Gamma$, per comodità un ipercubo $6N$-dimensionale di lato $\epsilon$. Assumendo per semplicità il caso ideale $\rho=$ costante, la media statistica è
   $$\langle A\rangle=\frac{\epsilon^{6N}}{\text{Volume di }\Gamma},$$
   cioè essenzialmente il rapporto fra il volume di $G$ e quello dello spazio delle fasi. Fin qui nulla di strano: è un numero ben definito e piccolissimo.</p>`},
   {label:'Il tempo che servirebbe', body:R`<p>Perché la traiettoria campioni bene quel rapporto, deve trascorrere un tempo dell&rsquo;ordine di quello richiesto per <i>trovare</i> il volume $G$. Si assuma che <b>una singola</b> particella si trovi nella sua porzione di $G$ dopo un tempo
   $$\tau\sim\epsilon^{-\gamma},$$
   dove il valore di $\gamma$ è irrilevante e dipende dalla dinamica microscopica — l&rsquo;unica cosa che si sta dicendo è che la dinamica fissa quanto velocemente si esplora lo spazio. Ma perché <b>tutte</b> le particelle si trovino in $G$ <i>simultaneamente</i>, i tempi si moltiplicano:
   $$T\sim\tau^{N}\sim\epsilon^{-\gamma N}.$$
   <b>Un tempo esponenzialmente grande in $N$.</b></p>`},
   {label:'La conclusione, che è una rinuncia', body:R`<p>Quindi per osservabili <b>microscopici</b>, che sono di fatto il prodotto di ordine $N$ osservabili di singola particella — per esempio
   $$A(X)=\prod_n\chi_n(p_n,q_n)$$
   con $\chi_n$ dipendente dalla sola particella $n$ — <b>non sarà possibile fare meccanica statistica</b>. Non perché l&rsquo;ipotesi ergodica sia falsa: perché il tempo necessario perché diventi utile è più lungo di qualunque tempo fisico.</p>
   <p><b>Il numero che rende la cosa concreta.</b> Anche nel caso più benevolo — chiedere che tutte le particelle stiano nella metà «giusta» del recipiente — la probabilità è $2^{-N}$, e per $N$ appena pari a $23$ si ha
   $$2^{-23}=\frac{1}{8\,388\,608},$$
   cioè già una parte su otto milioni con <i>ventitré</i> particelle. Con $N\sim10^{23}$ il numero non ha nome. <b>Questa è la stessa stima del tempo di ricorrenza di Poincaré</b>, vista come limite dell&rsquo;ergodicità invece che come conseguenza di Liouville: e il fatto che le due stime coincidano non è un caso, perché entrambe contano quanto sia raro un macrostato particolare.</p>`}
  ]},
  {t:'prosa', title:'Il caso che funziona: un’osservabile somma', tag:'la distinzione decisiva', html:R`
  <p>Si passi a un&rsquo;osservabile macroscopica, cioè del tipo <b>somma</b> invece che prodotto:
  $$A(X)=\sum_n\chi_n(p_n,q_n).$$
  <b>L&rsquo;energia di un sistema è il caso classico di osservabile macroscopica</b>, e così sono la magnetizzazione, il numero di particelle in una regione, la pressione.</p>
  <p>La differenza rispetto al caso precedente è strutturale, e in una riga: <b>una variazione di $\chi_n$ ha un effetto $1/N$ su $A(X)$</b>. Cambiando lo stato di una particella, un prodotto può passare da un valore finito a zero; una somma cambia di una parte su $10^{23}$. Le funzioni somma sono dunque «buone» funzioni macroscopiche <b>perché non sono sensibili ai dettagli microscopici</b> — e questa insensibilità è esattamente ciò che rende superfluo esplorare tutto $\Gamma$.</p>
  <p><b>Il capovolgimento è compiuto.</b> La domanda «il sistema è ergodico?» era mal posta: la domanda giusta è «l&rsquo;osservabile che misuro è una somma o un prodotto?». E la risposta, per tutte le osservabili della termodinamica, è che sono somme. Resta da quantificare <i>quanto</i> bene convergono, e quanto tempo serve: è il contenuto dei teoremi di Khinchin.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Perché l&rsquo;isola KAM della figura precedente non rovina la misura dell&rsquo;energia?`,
    a:R`Perché l&rsquo;energia è un&rsquo;osservabile <b>somma</b> su $N$ costituenti, e le isole occupano una frazione piccola del volume delle fasi. Se anche una frazione $f$ dei gradi di libertà fosse intrappolata in regioni regolari, il loro contributo all&rsquo;energia totale sarebbe una frazione $f$ del totale — un errore, non una catastrofe. <b>Se invece l&rsquo;osservabile fosse un prodotto</b>, un solo grado di libertà intrappolato lo annullerebbe, e la media temporale non avrebbe nulla a che vedere con quella d&rsquo;insieme. <b>La robustezza non viene dal sistema: viene dalla forma dell&rsquo;osservabile.</b>`},
   {q:R`Il tempo $\tau^{N}$ compare anche altrove nel corso. Dove, e perché è lo stesso numero?`,
    a:R`Compare come <b>tempo di ricorrenza di Poincaré</b>, e come rarità dei macrostati lontani dall&rsquo;equilibrio — per esempio la probabilità $2^{-N}$ che tutte le particelle stiano in metà del recipiente. È lo stesso numero perché in tutti i casi si sta chiedendo che <b>$N$ condizioni indipendenti si verifichino simultaneamente</b>, e le probabilità si moltiplicano: un evento di probabilità $p$ per particella ha probabilità $p^{N}$ per il sistema, e tempo di attesa $p^{-N}$. <b>Tutta la meccanica statistica vive nello spazio fra $N$ e $e^{N}$</b>: le quantità che scalano come $N$ si misurano, quelle che scalano come $e^{-N}$ non si osservano mai.`}
  ]}
]},

/* ---------------- 06 · KHINCHIN E L’AUTOMEDIAZIONE ---------------- */
{ num:'06', title:'I teoremi di Khinchin, e l’automediazione', meta:'una disuguaglianza alla Chebyshev · lo scarto che va come $N^{-1/4}$ · e perché $T$ non deve essere grande',
  blocchi:[
  {t:'reveal', title:'La catena di disuguaglianze, per intero', tag:'derivazione', steps:[
   {label:'Il punto di partenza', body:R`<p>Per le osservabili «somma» Khinchin ha dimostrato teoremi validi quando l&rsquo;hamiltoniana del sistema è somma di hamiltoniane di singola particella — teoremi «simili a quelli utilizzati nella legge dei grandi numeri». Il primo dà un limite sulla probabilità che la <b>media temporale</b> $\bar f$ si discosti dalla media d&rsquo;insieme $\langle f\rangle$ di più di una quantità $a$:
   $$\mathrm{Prob}\Big(\big|\bar f-\langle f\rangle\big|>a\Big)<\frac{4}{a}\,\big\langle|f-\langle f\rangle|\big\rangle.$$
   È una disuguaglianza di tipo Chebyshev: lega la probabilità di uno scarto grande al valore medio dello scarto.</p>`},
   {label:'Si passa alla varianza', body:R`<p>Il membro destro contiene la media del <i>modulo</i> dello scarto, che è scomoda. Per la <span class="str" data-str="disuguaglianza-di-schwarz">disuguaglianza di Cauchy-Schwarz</span>
   $$\langle|f-\langle f\rangle|\rangle\le\langle(f-\langle f\rangle)^{2}\rangle^{1/2}=\sigma,$$
   e quindi, indicando con $\sigma^{2}$ la varianza,
   $$\mathrm{Prob}\Big(\big|\bar f-\langle f\rangle\big|>a\Big)<\frac{4\sigma}{a}.$$
   Dividendo per $\langle f\rangle$ si passa a scarti relativi:
   $$\mathrm{Prob}\left(\left|\frac{\bar f}{\langle f\rangle}-1\right|>\frac{a}{\langle f\rangle}\right)<\frac{4\sigma}{a}.$$</p>`},
   {label:'La scelta di $a$, e il risultato', body:R`<p>Ora entra la fisica dei grandi numeri. Per variabili indipendenti — ed è l&rsquo;ipotesi di hamiltoniana somma — <b>la media e la varianza scalano entrambe con $N$</b>: $\langle f\rangle=f_0N$ e $\sigma^{2}=s^{2}N$, cioè $\sigma=s\sqrt N$. Scegliendo $a=\sigma^{3/2}$, il membro sinistro diventa
   $$\frac{a}{\langle f\rangle}=\frac{(s\sqrt N)^{3/2}}{f_0N}=\frac{s^{3/2}}{f_0\,N^{1/4}},$$
   e il membro destro $4\sigma/a=4/\sigma^{1/2}$, anch&rsquo;esso decrescente in $N$. Si ottiene dunque
   $$\mathrm{Prob}\left(\left|\frac{\bar f}{\langle f\rangle}-1\right|>\frac{K_1}{N^{1/4}}\right)<\frac{K_2}{N^{1/4}},$$
   con $K_1,K_2$ costanti positive. <b>La differenza fra la media nel tempo e la media statistica tende a zero per $N\to\infty$</b>, e l&rsquo;esponente è $1/4$.</p>
   <p>Vale la pena mettere il numero: con $N\sim10^{23}$,
   $$10^{-23/4}\approx1{,}8\times10^{-6},$$
   cioè scarti relativi sotto la parte per milione, con probabilità di eccederli anch&rsquo;essa sotto la parte per milione. <b>L&rsquo;esponente $1/4$ è mediocre — molto peggio del $1/\sqrt N$ del teorema centrale del limite — e con $N$ così grande non importa affatto.</b> È un esempio di come, in questa materia, una stima brutta su $10^{23}$ valga più di una stima fine su $10$.</p>`}
  ]},
  {t:'prosa', title:'L’automediazione, che è il risultato più importante', tag:'il punto del movimento', html:R`
  <p>Sciortino aggiunge un&rsquo;osservazione che è più forte del teorema stesso, e che vale isolare: <b>la stessa derivazione vale anche per $f$</b>, non solo per la sua media temporale $\bar f$. In altre parole
  $$\mathrm{Prob}\left(\left|\frac{f}{\langle f\rangle}-1\right|>\frac{K_3}{N^{1/4}}\right)<\frac{K_4}{N^{1/4}},$$
  che dice che <b>le osservabili fisicamente rilevanti sono <i>automedianti</i> per grandi valori di $N$</b>: il loro valore <i>istantaneo</i> — non la loro media nel tempo — è già vicinissimo alla media d&rsquo;insieme, con probabilità vicinissima a uno.</p>
  <p><b>Questo scioglie il paradosso dei tempi</b>, che era rimasto aperto dai teoremi di Birkhoff. La domanda era: se l&rsquo;ergodicità garantisce solo medie su tempi infiniti, e i tempi di esplorazione sono $e^{N}$, perché un esperimento di dieci secondi funziona? La risposta è che <b>non c&rsquo;è niente da mediare</b>. Se l&rsquo;osservabile è automediante, una singola misura istantanea dà già il valore termodinamico; la media temporale serve a ridurre il rumore dello strumento, non a esplorare lo spazio delle fasi. Come dice Sciortino: se sono automedianti, «è lecito supporre che $T$ non debba essere particolarmente grande».</p>
  <p><b>E qui va detto che cosa è successo all&rsquo;ipotesi ergodica</b>: è stata quasi aggirata. Non si è dimostrato che i sistemi reali siano ergodici — non lo sono, come mostra KAM. Si è dimostrato che <i>per le osservabili che interessano</i> l&rsquo;ergodicità non serve, perché la concentrazione di misura dei grandi numeri fa il lavoro da sola. La meccanica statistica non poggia sull&rsquo;esplorazione dello spazio delle fasi: poggia sul fatto che <b>quasi tutto lo spazio delle fasi ha le stesse proprietà macroscopiche</b>.</p>`},
  {t:'plot', title:'Quanto vale una stima brutta su $10^{23}$',
   intro:R`Lo scarto relativo garantito da Khinchin, $K/N^{1/4}$, confrontato con il $1/\sqrt N$ del teorema centrale del limite. L’ascissa è il logaritmo decimale di $N$.`,
   plots:[
    {kind:'func2d', xr:[1,24], yr:[-13,0], equal:false,
     curves:[
      {f:'-x/4', col:'#ff9b6b', label:'log10 di N^(-1/4) — Khinchin'},
      {f:'-x/2', col:'#5eead4', label:'log10 di N^(-1/2) — teorema centrale del limite'},
      {f:'-6', col:'#b98cff', label:'la parte per milione', dash:true}
     ],
     title:'ascissa: log10 N · ordinata: log10 dello scarto relativo'}
   ],
   leggi:R`<p><b>Che cosa guardare</b>: due rette di pendenza diversa. Quella di Khinchin scende la metà di quanto scenda quella del teorema centrale del limite — a parità di $N$ la garanzia è molto più debole. <b>E che cosa impararne</b>: non importa. Entrambe attraversano la soglia della parte per milione ben prima di $N=10^{23}$, e per $\log_{10}N=23$ la stima di Khinchin dà $10^{-5{,}75}$, quella del limite centrale $10^{-11{,}5}$. Sono due numeri entrambi indistinguibili da zero per qualunque strumento.</p>
   <p><b>La morale operativa, che vale oltre questo teorema.</b> In meccanica statistica conviene sempre chiedersi <i>l&rsquo;esponente di $N$</i> prima di raffinare una stima: un errore che va come $N^{-1/4}$ e uno che va come $N^{-1/2}$ sono equivalenti nel limite termodinamico, mentre uno che va come $N^{0}$ è fatale e uno che va come $e^{-N}$ è invisibile. È la ragione per cui molte disuguaglianze di questa materia sono volutamente grossolane: la grossolanità costa poco e la dimostrazione costa meno.</p>`},
  {t:'prosa', title:'L’ipotesi che Khinchin richiede, e come la si recupera', tag:'il limite dichiarato', html:R`
  <p>I teoremi di Khinchin poggiano sull&rsquo;ipotesi che l&rsquo;hamiltoniana sia <b>somma di hamiltoniane indipendenti</b> — ed è una richiesta forte, perché un sistema interagente non la soddisfa. Il recupero avviene in due modi, e sono entrambi istruttivi.</p>
  <ul>
  <li><b>Interazioni a corto raggio.</b> Se le interazioni hanno raggio finito, si può considerare il sistema come <b>somma di sottosistemi indipendenti</b> — blocchi grandi rispetto al raggio d&rsquo;interazione, che interagiscono solo attraverso le loro superfici. Nel limite termodinamico il contributo di superficie diventa trascurabile rispetto a quello di volume, e le ipotesi di Khinchin si recuperano. <b>È la stessa condizione — corto raggio — che rendeva estensive le grandezze termodinamiche</b>, e non è una coincidenza: l&rsquo;additività e l&rsquo;indipendenza statistica sono due facce dello stesso fatto.</li>
  <li><b>Modi normali.</b> Un esempio già noto dalla meccanica: una trasformazione opportuna elimina <i>tutte</i> le interazioni fra le particelle a favore di modi normali indipendenti. Un solido armonico, che è manifestamente interagente nelle coordinate delle particelle, è esattamente una somma di oscillatori indipendenti nelle coordinate dei modi. Lì le ipotesi di Khinchin valgono alla lettera.</li>
  </ul>
  <p><b>E la crepa che resta aperta, dichiarata:</b> nei sistemi a lungo raggio — un plasma gravitazionale, una galassia — nessuno dei due recuperi funziona. Non c&rsquo;è raggio d&rsquo;interazione oltre il quale i blocchi si ignorino, l&rsquo;energia non è estensiva, e i teoremi di Khinchin non si applicano. È il territorio in cui la meccanica statistica standard non vale, e si incontrano fenomeni impossibili nel caso a corto raggio: calori specifici negativi, inequivalenza degli ensembles. <b>Vale la pena sapere dove si sta uscendo dal dominio di validità</b>, perché è la differenza fra un risultato sbagliato e un risultato fuori ipotesi.</p>`}
]},

/* ---------------- 07 · SENSO E ROTTE ---------------- */
{ num:'07', title:'Il senso e le rotte fisiche', meta:'ciò che regge davvero il calcolo statistico · e cosa lo sostituisce nel caso quantistico',
  blocchi:[
  {t:'prosa', title:'Il bilancio, in ordine di importanza', tag:'sintesi', html:R`
  <p><b>Che cosa si è stabilito.</b> L&rsquo;ipotesi ergodica, resa precisa, dice che $\rho$ è il tempo di soggiorno della traiettoria; i teoremi di Birkhoff garantiscono che il limite esista e non dipenda dal punto iniziale, per quasi ogni dato iniziale, e riducono l&rsquo;ergodicità a una sola condizione — l&rsquo;indecomponibilità dello spazio delle fasi. Quella condizione è <b>fragile</b>: le costanti del moto la violano, KAM mostra che i tori sopravvivono alle perturbazioni, e nei sistemi reali le isole regolari convivono col mare caotico. Il <b>mescolamento</b> è più forte dell&rsquo;ergodicità ed è ciò che serve perché un sistema <i>si avvicini</i> all&rsquo;equilibrio, con un tempo fissato dall&rsquo;esponente di Lyapunov.</p>
  <p><b>E la cosa più importante, che va detta per ultima perché capovolge tutto.</b> La meccanica statistica non poggia su nessuna di queste proprietà. Poggia sulla forma delle osservabili: per un&rsquo;osservabile <b>prodotto</b> il tempo necessario è $\epsilon^{-\gamma N}$ e non si farà mai statistica; per un&rsquo;osservabile <b>somma</b> i teoremi di Khinchin danno la convergenza come $N^{-1/4}$ e, soprattutto, l&rsquo;<b>automediazione</b> — il valore istantaneo è già quello termodinamico. <b>Il fondamento non è che la traiettoria visiti tutto: è che quasi tutto lo spazio delle fasi si somigli.</b> Chi risponde questo all&rsquo;orale ha detto la cosa giusta; chi si ferma a «si assume che la traiettoria visiti tutto» ha detto ciò che il corso passa cinque pagine a superare.</p>`},
  {t:'prolessi', title:'Dove riappare, nella fisica che verrà',
   oggetto:R`<b>L&rsquo;ergodicità, il mescolamento e l&rsquo;automediazione</b>: le tre risposte, di forza crescente e di natura diversa, alla domanda se una traiettoria sola possa parlare per l&rsquo;intero insieme.`,
   rotte:[
    {dove:'Fondamenti della<br>meccanica statistica', txt:R`È la giustificazione dell&rsquo;insieme microcanonico: se il sistema è ergodico sulla superficie di energia, la media temporale che si misura coincide con l&rsquo;integrale che si calcola. Boltzmann la propose come ipotesi; un secolo dopo è dimostrata solo per pochi modelli — biliardi di Sinai, sfere dure — e la giustificazione che tiene in piedi il calcolo, nel frattempo, è l&rsquo;automediazione.`},
    {dove:'Caos<br>hamiltoniano', txt:R`Esponenti di Lyapunov, KAM, transizione al caos: la mappa standard di queste figure è il ritratto standard del campo. La domanda «quanto è grande il mare caotico?» è quantitativa e si misura, e la risposta dipende dal parametro con una soglia netta.`},
    {dove:'Caos<br>quantistico', txt:R`Nei sistemi quantistici non esistono traiettorie, quindi l&rsquo;ergodicità classica non si trasporta. Il suo posto è preso dalla <b>statistica dei livelli</b> — distribuzione di Poisson per i sistemi integrabili, distribuzioni delle matrici casuali (GOE, GUE) per quelli il cui limite classico è caotico — e dalla struttura degli autostati: il segno del caos è la <i>repulsione dei livelli</i>.`},
    {dove:'ETH', txt:R`L&rsquo;<b>eigenstate thermalization hypothesis</b> è l&rsquo;analogo quantistico, ma sposta l&rsquo;affermazione: non sulle traiettorie, bensì sugli <b>elementi di matrice</b> delle osservabili negli autostati dell&rsquo;energia. Se quelli si comportano come quantità pseudo-casuali, <b>un singolo autostato contiene già i valori termici</b> — e non serve alcuna media temporale. Si noti la parentela con l&rsquo;automediazione di questa pagina: in entrambi i casi la conclusione è che non c&rsquo;è niente da mediare, perché la tipicità fa il lavoro.`}
   ],
   domanda:R`L&rsquo;ipotesi ergodica chiede che <i>una</i> traiettoria visiti tutto. Ma i tempi per farlo crescono come $\epsilon^{-\gamma N}$, e nessun esperimento dura così: il gas nella stanza raggiunge l&rsquo;equilibrio in <b>secondi</b>. <b>Quindi l&rsquo;ergodicità, anche quando è vera, spiega la cosa sbagliata</b> — spiega le medie su tempi infiniti, mentre l&rsquo;equilibrio è un fatto rapidissimo.<br><br><b>La domanda da portare avanti</b>: qual è la proprietà che rende l&rsquo;equilibrio <i>veloce</i>? Questa pagina ne offre due candidati, e non sono equivalenti. Il <b>mescolamento</b> con il suo tasso di Lyapunov, che è una proprietà della dinamica; e l&rsquo;<b>automediazione</b> di Khinchin, che è una proprietà della <i>coppia</i> sistema-osservabile e non richiede alcuna dinamica particolare. Il secondo è più economico e spiega di più: non ha bisogno di caos, e funziona anche per un sistema di oscillatori indipendenti, che non mescola nulla.<br><br>Ma resta scoperta una terza cosa, che nessuna delle due dice: <b>come mai il sistema, partito fuori equilibrio, ci arrivi</b>. L&rsquo;automediazione dice che quasi tutti gli stati sono d&rsquo;equilibrio, non che uno stato particolare vi si avvicini; il mescolamento dice che una regione si spalma, ma l&rsquo;entropia di Gibbs non cresce comunque. La risposta non riguarda solo il sistema: riguarda che cosa un osservatore <b>non risolve</b>, ed è per questo che il movimento seguente comincia dalla domanda su che cosa si butti via.`}
]}

var byId = {}; TAPPE.forEach(function(s){ byId[s.num]=s; });

var VKEY='pm-nucleo21-visited';
function loadSeen(){ try{ return new Set(JSON.parse(localStorage.getItem(VKEY)||'[]')); }catch(e){ return new Set(); } }
function saveSeen(s){ try{ localStorage.setItem(VKEY, JSON.stringify(Array.from(s))); }catch(e){} }
var SEEN = loadSeen();

function renderNav(active){
  var nav=document.getElementById('sidebar');
  nav.innerHTML='';
  var h=document.createElement('h2'); h.textContent='Nucleo 21 · le tappe'; nav.appendChild(h);
  TAPPE.forEach(function(s){
    var b=document.createElement('button');
    b.className='navitem'+(active===s.num?' active':'')+(SEEN.has(s.num)?' seen':'');
    b.innerHTML='<span class="dot"></span><span class="nx">'+s.num+'</span><span>'+s.title+'</span>';
    b.onclick=function(){ showTappa(s.num); };
    nav.appendChild(b);
  });
}

/* ---- renderer dei blocchi ---- */
function sectionProsa(title, tag, html){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var body=elFromHTML('<div class="open-body">'+html+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function sectionGram(title, rows){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag gramtag">grammatica</span></h3>';
  var inner='<table class="gramtab">';
  rows.forEach(function(r){ inner+='<tr><td class="gs">'+r[0]+'</td><td>'+r[1]+'</td></tr>'; });
  inner+='</table>';
  var body=elFromHTML('<div class="gramwrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
/* --- blocco PLOT: la figura non decora, si legge. Ogni plot porta una chiave di lettura. --- */
function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';
  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionSvelabile(title, tag, html, sol){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var c=document.createElement('div'); c.className='collaudo-item';
  var q=document.createElement('div'); q.className='cq'; q.innerHTML=html||'';
  c.appendChild(q); typeset(q);
  if(sol){
    var a=document.createElement('div'); a.className='ca'; a.style.display='none';
    a.innerHTML='<b>Soluzione.</b> '+sol;
    var btn=document.createElement('button'); btn.className='reveal-btn small';
    btn.textContent='Rivela la soluzione';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a);
      btn.disabled=true; btn.classList.add('done'); btn.textContent='Soluzione rivelata'; };
    c.appendChild(btn); c.appendChild(a);
  }
  wrap.appendChild(c); return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    /* DUE SCHEMI, NON UNO — scoperto il 2026-10-06 provando le pagine vive. I movimenti
       scritti per primi (em-01..03, me-10b, i collaudi di gd-01..09 e di quattro em)
       usano una forma piu' semplice: `reveal` e `prolessi` con un solo `html`,
       `esercizio` e `collaudo` con `html` + `sol`. Il renderer ne conosceva una sola e
       chiamava `steps.forEach` su `undefined`: TypeError, e la tappa si fermava li' —
       62 blocchi in 17 movimenti su 74. Non si riscrive il contenuto per far contento
       il renderer: e' il renderer che deve leggere cio' che c'e'.
       E in fondo un ramo che NON muore: uno schema nuovo di domani deve far vedere un
       avviso in quella sezione, non spegnere la pagina sotto di se'. */
    try{
      if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
      else if(b.t==='prolessi') m.appendChild(b.rotte ? sectionProlessi(b)
                                   : sectionProsa(b.title,'prolessi',b.html));
      else if(b.t==='reveal')m.appendChild(b.steps ? sectionReveal(b.title,b.tag,b.steps)
                                   : sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='esercizio') m.appendChild(b.steps ? sectionEsercizio(b)
                                   : sectionSvelabile(b.title,'esercizio',b.html,b.sol));
      else if(b.t==='collaudo')  m.appendChild(b.items ? sectionCollaudo(b.title,b.items)
                                   : sectionSvelabile(b.title,'provi, poi riveli',b.html,b.sol));
      else if(b.t==='plot')      m.appendChild(sectionPlot(b));
      else m.appendChild(sectionProsa(b.title||'(blocco)', 'tipo sconosciuto: '+b.t,
                                      b.html||''));
    }catch(err){
      var avv=document.createElement('section'); avv.className='section';
      avv.innerHTML='<h3>'+(b.title||'(blocco)')+'<span class="tag">non reso</span></h3>'
        +'<p style="color:#ff6b6b">Questo blocco non si &egrave; potuto rendere ('
        +b.t+': '+err.message+'). Il resto della tappa continua sotto.</p>';
      m.appendChild(avv);
    }
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* I POP-UP DEGLI STRUMENTI. `cablaStrumenti` esisteva dal 18-09 e non la chiamava
     nessuno: i 229 rimandi del percorso erano <span> senza handler, e il clic non
     faceva niente. Nessun controllo poteva vederlo — la sintassi era valida, le schede
     c'erano tutte, le formule rendevano: il guasto esisteva solo a pagina viva. Qui, e
     dopo ogni inserimento successivo, perche' la tappa si rimonta da capo a ogni
     cambio e gli handler vanno riattaccati al DOM nuovo. */
  cablaStrumenti(m);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}
