<style>
  :root{
    --bg:#0e1117; --panel:#161b22; --panel2:#1c232d; --border:#2b333d;
    --txt:#eef3f8; --muted:#b9c4d1; --accent:#4c8dff; --accent2:#8fb0ff;
    --ok:#2ea043; --okbg:#10331b; --warn:#d8a13a; --warnbg:#332a10;
    --gram:#5eead4; --grambg:#0f2a26;
    --pro:#b98cff; --probg:#1a1430; --proline:#2a2247; --proedge:#3a2d5c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    font-size:17px;line-height:1.55;}
  a{color:var(--accent2);}
  .banner{background:var(--panel2);border-bottom:1px solid var(--border);color:var(--muted);
    font-size:.8rem;font-weight:600;text-align:center;padding:8px 12px;letter-spacing:.3px;}
  .banner b{color:var(--accent2);}
  .shell{display:flex;max-width:1180px;margin:0 auto;align-items:flex-start;}

  /* ---- SIDEBAR ---- */
  .sidebar{width:280px;flex:0 0 280px;padding:20px 12px 60px;position:sticky;top:0;
    max-height:100vh;overflow-y:auto;border-right:1px solid var(--border);}
  .sidebar h2{font-size:.72rem;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);
    margin:18px 8px 8px;}
  .navitem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:none;
    background:transparent;color:var(--txt);padding:9px 10px;border-radius:8px;cursor:pointer;
    font-size:.9rem;transition:.12s;border:1px solid transparent;}
  .navitem:hover{background:var(--panel2);}
  .navitem.active{background:#13233f;border-color:var(--accent);color:#fff;}
  .navitem .dot{width:7px;height:7px;border-radius:50%;background:transparent;flex:0 0 7px;
    border:1px solid var(--border);}
  .navitem.seen .dot{background:var(--ok);border-color:var(--ok);}
  .navitem .nx{color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto;}

  /* ---- MAIN ---- */
  .main{flex:1 1 auto;min-width:0;padding:24px 30px 90px;max-width:860px;}
  h1{font-size:1.5rem;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:.92rem;margin:0 0 18px;}
  .sfhead{border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:8px;}
  .sfhead h1{font-size:1.55rem;}
  .meta{color:var(--muted);font-size:.82rem;margin-top:6px;}

  .section{margin:26px 0;}
  .section > h3{font-size:1.02rem;color:var(--accent2);margin:0 0 10px;
    display:flex;align-items:center;gap:10px;}
  .section > h3 .tag{font-size:.66rem;font-weight:700;letter-spacing:.4px;background:var(--panel2);
    border:1px solid var(--border);color:var(--muted);padding:2px 8px;border-radius:20px;
    text-transform:uppercase;}
  /* --- blocchi figura --- */
  .section > h3 .tag.plottag{background:#101f2e;border-color:#1f3c57;color:#7ab8e0;}
  .plot-intro{color:var(--muted);font-size:.95rem;margin:0 0 12px;}
  .plot-row{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;
    background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;}
  .plot-row.due .plot-box{flex:1 1 300px;min-width:280px;}
  .plot-box{max-width:560px;}
  .plot-leggi{margin-top:10px;background:var(--panel2);border:1px solid var(--border);
    border-left:3px solid #4a8fc7;border-radius:0 10px 10px 0;padding:11px 14px;
    font-size:.93rem;color:var(--muted);}
  .plot-leggi b{color:#7ab8e0;}
  .plot-err{color:#ff6b6b;font-size:.85rem;}
  .open-body{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
  .open-body p:first-child{margin-top:0;} .open-body p:last-child{margin-bottom:0;}
  .open-body ul{margin:.4em 0;padding-left:1.2em;} .open-body li{margin:.35em 0;}

  .note{background:var(--panel2);border-left:3px solid var(--muted);border-radius:6px;
    padding:9px 12px;margin:12px 0;font-size:.9rem;color:var(--muted);}
  .note b{color:#ff9d6b;}
  .note.warn{background:var(--warnbg);border-left-color:var(--warn);color:#e0b85a;}
  .note.warn b{color:#f0c25a;}

  /* ---- GRAMMATICA ---- */
  .gramwrap{background:var(--grambg);border:1px solid #1f4d47;border-radius:12px;padding:6px 6px;}
  table.gramtab{border-collapse:collapse;width:100%;font-size:.92rem;}
  table.gramtab td{padding:9px 12px;vertical-align:top;border-bottom:1px solid #17332e;}
  table.gramtab tr:last-child td{border-bottom:none;}
  table.gramtab td.gs{white-space:nowrap;color:var(--gram);width:1%;
    border-right:1px solid #17332e;font-variant-numeric:tabular-nums;}
  .section > h3 .tag.gramtag{background:var(--grambg);border-color:#1f4d47;color:var(--gram);}

  /* ---- STRUMENTI (repertorio condiviso: la scheda si apre DENTRO la frase) ----
     Nessun accento nuovo: riusa il verde della grammatica, perche' uno strumento
     richiamato e' grammatica gia' spiegata altrove, non una quinta specie di blocco. */
  .str{color:var(--gram);border-bottom:1px dashed var(--gram);cursor:pointer;}
  .str:hover{background:var(--grambg);}
  .str::after{content:"\2666";font-size:.62em;vertical-align:.42em;margin-left:2px;opacity:.8;}
  .str.aperto::after{content:"\2715";}
  .str.rotto{color:#ff6b6b;border-bottom-color:#ff6b6b;cursor:help;}
  /* la scheda e' uno SPAN in display:block, non un div: i rimandi cadono dentro
     <p>, <li> e celle di tabella, dove un div e' HTML illegale. */
  .strcard{display:block;margin:10px 0;background:var(--grambg);border:1px solid #1f4d47;
    border-left:3px solid var(--gram);border-radius:0 10px 10px 0;padding:10px 14px;font-size:.9rem;}
  .strcard .sh{display:block;font-size:.66rem;font-weight:700;letter-spacing:.5px;
    text-transform:uppercase;color:var(--gram);margin-bottom:7px;}
  .strcard .sr{display:block;margin:5px 0;}
  .strcard .sk{color:var(--gram);font-weight:600;}

  /* ---- PROLESSI (preannuncio fisico) ---- */
  .prowrap{background:var(--probg);border:1px solid var(--proedge);border-radius:12px;padding:4px 4px 8px;}
  .prohead{padding:11px 14px 4px;color:var(--pro);font-size:.72rem;font-weight:700;letter-spacing:.7px;
    text-transform:uppercase;}
  .pro-oggetto{padding:2px 14px 11px;color:var(--muted);font-size:.92rem;border-bottom:1px solid var(--proline);
    margin-bottom:2px;} .pro-oggetto b{color:var(--txt);}
  table.protab{border-collapse:collapse;width:100%;font-size:.92rem;}
  table.protab td{padding:10px 12px;vertical-align:top;border-bottom:1px solid var(--proline);}
  table.protab tr:last-child td{border-bottom:none;}
  table.protab td.pd{white-space:nowrap;color:var(--pro);width:1%;font-weight:700;font-size:.78rem;
    letter-spacing:.3px;text-transform:uppercase;border-right:1px solid var(--proline);line-height:1.3;}
  .pro-domanda{margin:8px 8px 2px;background:#140d26;border:1px solid var(--proedge);

  .pro-domanda b{color:var(--pro);}
  .section > h3 .tag.protag{background:var(--probg);border-color:var(--proedge);color:var(--pro);}

  /* ---- REVEAL ---- */
  .rsteps{display:flex;flex-direction:column;gap:12px;}
  .rstep{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 18px;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .rlabel{font-size:.7rem;font-weight:700;letter-spacing:.4px;color:var(--accent);
    text-transform:uppercase;margin-bottom:8px;}
  .rstep p:first-of-type{margin-top:0;} .rstep p:last-child{margin-bottom:0;}
  .rstep ul{margin:.4em 0;padding-left:1.2em;}
  .testo{background:#13233f;border:1px solid #2b4877;border-radius:12px;padding:14px 18px;margin-bottom:14px;}
  .testo .src{display:block;font-size:.74rem;font-style:italic;color:var(--accent2);margin-bottom:8px;
    text-transform:uppercase;letter-spacing:.3px;}
  .esame-nota{font-size:.9rem;color:var(--muted);font-style:italic;margin-top:12px;padding-left:12px;

  .reveal-btn{background:var(--accent);color:#fff;border:none;padding:11px 18px;border-radius:10px;
    font-size:.95rem;font-weight:600;cursor:pointer;margin-top:14px;transition:.12s;}
  .reveal-btn:hover:not(:disabled){background:var(--accent2);}
  .reveal-btn.small{padding:7px 14px;font-size:.85rem;margin-top:0;background:var(--panel2);
    color:var(--accent2);border:1px solid var(--border);}
  .reveal-btn.small:hover:not(:disabled){border-color:var(--accent);}
  .reveal-btn:disabled,.reveal-btn.done{background:var(--panel2);color:var(--muted);
    border:1px solid var(--border);cursor:default;}

  /* ---- COLLAUDO ---- */
  .collaudo-item{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 18px;margin-bottom:12px;}
  .cq{margin-bottom:10px;}
  .ca{margin-top:12px;background:var(--okbg);border:1px solid #235c33;border-radius:8px;
    padding:10px 14px;font-size:.94rem;}
  .ca b{color:#5fd980;}

  /* ---- PREV / NEXT ---- */
  .prevnext{display:flex;justify-content:space-between;gap:12px;margin-top:40px;
    border-top:1px solid var(--border);padding-top:20px;}
  .pnbtn{flex:1 1 0;background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:12px 16px;cursor:pointer;color:var(--txt);text-align:left;transition:.14s;font:inherit;}
  .pnbtn:hover{border-color:var(--accent);background:var(--panel2);}
  .pnbtn.next{text-align:right;}
  .pnbtn .k{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .pnbtn .t{font-weight:600;color:var(--accent2);}
  .pnbtn:disabled{opacity:.35;cursor:default;border-color:var(--border);background:var(--panel);}

  code{background:var(--panel2);border:1px solid var(--border);border-radius:5px;
    padding:1px 5px;font-size:.85em;color:var(--accent2);}
  .katex{font-size:1.02em;color:var(--txt);} .katex-display{margin:.5em 0;overflow-x:auto;overflow-y:hidden;}

  @media(max-width:860px){
    .shell{flex-direction:column;}
    .sidebar{width:100%;flex:none;position:static;max-height:none;border-right:none;
      border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:4px;}
    .sidebar h2{width:100%;} .navitem{width:auto;}
    .main{padding:20px 16px 80px;}
  }
</style>

<script>
"use strict";
const R = String.raw;

function typeset(el){
  if(el && window.renderMathInElement){
    try{ renderMathInElement(el,{delimiters:[
      {left:'$$',right:'$$',display:true},
      {left:'$',right:'$',display:false}
    ],throwOnError:false}); }catch(e){}
  }
}
function elFromHTML(html){ var d=document.createElement('div'); d.innerHTML=html; return d; }

/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un
   rimando scritto nella prosa:

       <span class="str" data-str="serie-geometrica">la serie geometrica</span>

   Le schede citate da questo nucleo sono cucite qui sotto dal montaggio
   (assembla-nucleo.js): la pagina resta autosufficiente — niente fetch,
   niente sottocartelle da pubblicare — e un rimando a una scheda che non
   esiste FERMA la costruzione invece di arrivare in pagina rotto.
   Apertura: lo stesso gesto del collaudo (si clicca, il pannello compare,
   si typeset una volta sola), portato dentro la frase.
   =================================================================== */
var CORSO = 'elettromagnetismo';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["teorema-di-stokes"] = {"nome":"Teorema di Stokes","riga":"La circuitazione di un campo lungo una curva chiusa è il flusso del suo rotore attraverso una qualunque superficie che quella curva borda: $\\oint_{\\partial S}\\mathbf F\\cdot d\\mathbf r=\\int_S(\\nabla\\times\\mathbf F)\\cdot\\hat n\\,dS$.","serve":"Dice che la circuitazione dipende solo dal bordo e non dalla superficie scelta — ed è la licenza a deformare la superficie a piacere, che in fisica si usa continuamente. Letto nell'altro verso dà il significato del rotore: la circuitazione per unità di area, nel limite di un cappio piccolo. Il verso della normale e quello di percorrenza del bordo vanno legati dalla regola della mano destra, altrimenti il segno è casuale.","esempio":"Per il vortice $\\mathbf F=(-y,x,0)$ il rotore ha solo componente $z$, che vale $\\partial_x(x)-\\partial_y(-y)=2$. Sul disco di raggio $R$ nel piano $xy$ il flusso del rotore è quindi $2$ per l'area, $2\\pi R^{2}$; la circuitazione diretta sul cerchio, dove $\\mathbf F\\cdot d\\mathbf r$ vale $R^{2}\\,dt$, dà $\\int_0^{2\\pi}R^{2}\\,dt=2\\pi R^{2}$.","pieno":{"file":"05-teoremi-integrali.html","tappa":"03","come":"l'enunciato, l'orientazione coerente bordo-normale e l'indipendenza dalla superficie, nel nucleo dei teoremi integrali"},"qui":{"elettromagnetismo":{"serve":"È il ponte fra la forma integrale e la forma locale delle due leggi di circuitazione: Ampère, $\\oint\\mathbf B\\cdot d\\mathbf r=\\mu_0 I$, diventa $\\nabla\\times\\mathbf B=\\mu_0\\mathbf J$; Faraday, $\\oint\\mathbf E\\cdot d\\mathbf r=-\\dfrac{d\\Phi_B}{dt}$, diventa $\\nabla\\times\\mathbf E=-\\partial_t\\mathbf B$. E regge l'affermazione più usata dell'elettrostatica: se il rotore di $\\mathbf E$ è nullo su un dominio senza buchi, ogni circuitazione è nulla e il campo è conservativo.","esempio":"Per il filo rettilineo infinito percorso da una corrente il campo ha modulo $\\dfrac{\\mu_0 I}{2\\pi r}$ ed è tangente ai cerchi concentrici, quindi la circuitazione su un cerchio di raggio $r$ è $\\dfrac{\\mu_0 I}{2\\pi r}\\cdot 2\\pi r=\\mu_0 I$: il raggio scompare. Stokes dice che lo stesso valore si ottiene su qualunque cappio che allacci il filo, anche storto — è il bordo a contare, non la forma."}},"controllo":[{"tipo":"uguale","sinistra":"diff(x,x)-diff(-y,y)","vale":"2","dove":"esempio","appare":"=2"},{"tipo":"integrale","espr":"R**2","var":"t","da":"0","a":"2*pi","vale":"2*pi*R**2","dove":"esempio","appare":"2\\pi R^{2}"},{"tipo":"uguale","sinistra":"mu0*Ic/(2*pi*r)*2*pi*r","vale":"mu0*Ic","dove":"qui.elettromagnetismo.esempio","appare":"\\mu_0 I"}]};
STRUM["rotore"] = {"nome":"Rotore","riga":"Il campo $\\nabla\\times\\mathbf F$, la cui componente lungo $\\hat n$ misura la circuitazione di $\\mathbf F$ per unità di area attorno a $\\hat n$.","serve":"È la girandola locale: dove il rotore è nullo, una paletta infinitesima immersa nel campo non gira. Da qui il criterio più usato — un campo con rotore nullo su un dominio semplicemente connesso è conservativo — e la doppia ipotesi non è pedanteria: su un dominio bucato il criterio salta, e il controesempio (il vortice attorno a un filo escluso) è proprio il caso che si incontra in fisica.","esempio":"Il vortice $\\mathbf F=(-y,x)$ ha rotore $\\partial_x(x)-\\partial_y(-y)=2$: gira davvero, ed è costante su tutto il piano. Il campo radiale $\\mathbf F=(x,y)$ ha invece rotore $\\partial_x(y)-\\partial_y(x)=0$: si allontana dall'origine senza ruotare, e infatti è il gradiente di $\\tfrac12(x^{2}+y^{2})$.","pieno":{"file":"04-campi-vettoriali.html","tappa":"03","come":"divergenza e rotore insieme, con le loro letture geometriche e il calcolo in componenti, nel nucleo sui campi vettoriali"},"qui":{"elettromagnetismo":{"serve":"Le due equazioni di Maxwell col rotore sono quelle che accoppiano i campi: $\\nabla\\times\\mathbf E=-\\partial_t\\mathbf B$ e $\\nabla\\times\\mathbf B=\\mu_0\\mathbf J+\\mu_0\\varepsilon_0\\partial_t\\mathbf E$. Il rotore nullo di $\\mathbf E$ in statica è ciò che autorizza a scrivere il potenziale; appena $\\mathbf B$ varia nel tempo quel rotore non è più nullo, e il potenziale scalare da solo smette di bastare. Il rotore è quindi il posto esatto in cui l'elettrostatica finisce.","esempio":"Che non possa esistere un potenziale scalare quando $\\mathbf B$ varia si vede dall'identità $\\nabla\\times(\\nabla V)$, che è nulla per ogni $V$: se $\\mathbf E$ fosse $-\\nabla V$ il suo rotore sarebbe zero, mentre Faraday lo vuole uguale a $-\\partial_t\\mathbf B$. Sul campione $V=xy$ il gradiente è $(y,x)$ e il conto è $\\partial_x(x)-\\partial_y(y)=0$, come per qualunque altro $V$."}},"controllo":[{"tipo":"uguale","sinistra":"diff(x,x)-diff(-y,y)","vale":"2","dove":"esempio","appare":"=2"},{"tipo":"uguale","sinistra":"diff(y,x)-diff(x,y)","vale":"0","dove":"esempio","appare":"=0"},{"tipo":"uguale","sinistra":"diff(diff(x*y,y),x)-diff(diff(x*y,x),y)","vale":"0","dove":"qui.elettromagnetismo.esempio","appare":"=0"}]};
STRUM["flusso-di-un-campo"] = {"nome":"Flusso di un campo","riga":"L'integrale $\\iint_S\\mathbf F\\cdot\\hat n\\,dS$: quanta parte del campo attraversa la superficie, contata col segno che l'orientazione stabilisce.","serve":"Traduce «quanto passa attraverso» in un numero, e il numero dipende da due scelte che vanno dichiarate entrambe: la superficie e il verso della normale. Su una superficie chiusa la convenzione è normale uscente, e allora un flusso positivo significa che dentro c'è una sorgente netta. Dove il campo è parallelo alla superficie il contributo è nullo: conta solo la componente normale, mai il modulo.","esempio":"Per il campo radiale $\\mathbf F=\\mathbf r$ sulla sfera di raggio $R$ la normale uscente è $\\hat r$, e la componente normale vale $R$ in ogni punto, costante: il flusso è quel valore per l'area, $\\Phi=R\\cdot4\\pi R^{2}=4\\pi R^{3}$. Per $R=2$ fa $32\\pi$.","pieno":{"file":"03-curve-superfici.html","tappa":"04","come":"la definizione, il ruolo dell'orientazione e l'indipendenza dalla parametrizzazione, nel nucleo su curve e superfici"},"qui":{"elettromagnetismo":{"serve":"Il flusso di $\\mathbf E$ attraverso una superficie chiusa è l'unica cosa che la legge di Gauss controlla: dice quanto esce in totale, non quanto vale $\\mathbf E$ punto per punto. Da un solo numero si risale al campo soltanto se si sa già in che direzione punta e da cosa dipende — e quello lo decide la simmetria della distribuzione, non il teorema. Per questo la superficie si sceglie: dove $\\mathbf E$ è costante e normale, il flusso diventa modulo per area.","esempio":"Per una carica puntiforme $q$ al centro di una sfera di raggio $R$ il campo ha modulo $\\dfrac{q}{4\\pi\\varepsilon_0R^{2}}$ ed è ovunque normale alla sfera, quindi $\\Phi=\\dfrac{q}{4\\pi\\varepsilon_0R^{2}}\\cdot4\\pi R^{2}=\\dfrac{q}{\\varepsilon_0}$: il raggio è sparito. È il motivo per cui la legge di Gauss è una legge e non un conto — vale per qualunque superficie chiusa che racchiuda la carica."}},"controllo":[{"tipo":"uguale","sinistra":"R*4*pi*R**2","vale":"4*pi*R**3","dove":"esempio","appare":"4\\pi R^{3}"},{"tipo":"uguale","sinistra":"4*pi*2**3","vale":"32*pi","dove":"esempio","appare":"32\\pi"},{"tipo":"uguale","sinistra":"q/(4*pi*e0*R**2)*4*pi*R**2","vale":"q/e0","dove":"qui.elettromagnetismo.esempio","appare":"\\dfrac{q}{\\varepsilon_0}"},{"tipo":"derivata","espr":"q/(4*pi*e0*R**2)*4*pi*R**2","rispetto":["R"],"vale":"0","dove":"qui.elettromagnetismo.esempio","appare":"il raggio è sparito"}]};

function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';
  return h;
}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');

/* ---------------- 00 · DI COSA PARLA QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Di cosa parla questo movimento', meta:'Elettromagnetismo · voce C.1 · 75 prove su 100, densita 4.7 · il corso cambia meta',
  blocchi:[
  {t:'prosa', title:'Che cosa e diverso, e conviene dirlo subito', tag:'architettura', html:R`
  <p>Il campo magnetico non è «il campo elettrico dei magneti». È un oggetto con regole diverse, e le differenze sono tre — vale la pena tenerle in testa fin dall&rsquo;inizio, perché ognuna cambia il metodo di calcolo:</p>
  <ul>
   <li><b>le sorgenti sono le correnti</b>, non le cariche. Non esistono cariche magnetiche: $\nabla\cdot\vec B=0$, il flusso attraverso ogni superficie chiusa è nullo, e <b>Gauss per $\vec B$ non serve a calcolare niente</b> — dice solo che le linee si chiudono su se stesse;</li>
   <li><b>la legge che si usa per calcolare è la circuitazione</b>, non il flusso: $\oint\vec B\cdot d\vec\ell=\mu_0I_{\text{conc}}$. In elettrostatica era l&rsquo;opposto (flusso di $\vec E$ utile, circuitazione nulla). <b>I due campi si scambiano i ruoli delle due leggi</b>, ed è la simmetria che li tiene insieme;</li>
   <li><b>la forza non è parallela al campo</b> ma perpendicolare sia a $\vec B$ sia alla velocità: $\vec F=q\vec v\times\vec B$. Da qui segue immediatamente che <b>il campo magnetico non fa lavoro</b>.</li>
  </ul>
  <p>Gli esami lo toccano in <b>75 prove su 100</b>, con densità 4.7, e quasi sempre insieme a em-10 (induzione): il tipico esercizio costruisce una geometria con corrente, chiede $\vec B$, e poi lo fa variare.</p>`}
]},

/* ---------------- 01 · LA FORZA DI LORENTZ ---------------- */
{ num:'01', title:'La forza di Lorentz: la definizione operativa, e che il campo magnetico non fa lavoro', meta:'F = qv x B · moto circolare e raggio di Larmor · forza su un filo · il momento su una spira',
  blocchi:[
  {t:'prosa', title:'La definizione, e la prima conseguenza', tag:'first principles', html:R`
  <p>Il campo magnetico si <b>definisce</b> tramite la forza che esercita su una carica in moto:
  $$\vec F=q\vec v\times\vec B.$$
  La prima conseguenza si legge in una riga: la potenza è $\vec F\cdot\vec v=q(\vec v\times\vec B)\cdot\vec v=0$, perché il prodotto vettoriale è perpendicolare a $\vec v$. <b>Il campo magnetico non fa lavoro</b>: può curvare una traiettoria, mai cambiare il modulo della velocità né l&rsquo;energia cinetica.</p>
  <p>Per un campo uniforme e $\vec v\perp\vec B$ la forza è centripeta e costante in modulo: il moto è <b>circolare uniforme</b> con
  $$r=\frac{mv}{qB}\ \text{(raggio di Larmor)},\qquad \omega=\frac{qB}{m}\ \text{(frequenza di ciclotrone)}.$$
  <b>Nota che $\omega$ non dipende dalla velocità</b>: è il motivo per cui il ciclotrone funziona con un campo alternato a frequenza fissa, e una delle poche formule di questo corso che vale la pena avere in memoria.</p>
  <div class="note"><b>Il paradosso del lavoro, che vale la pena sciogliere una volta.</b> Se $\vec B$ non fa lavoro, come fa una calamita a sollevare un chiodo? La risposta: il lavoro lo fanno le forze <i>interne</i> del materiale e, nel caso di un circuito, il generatore. Su un filo percorso da corrente la forza $I\vec\ell\times\vec B$ sposta il filo e sembra fare lavoro, ma l&rsquo;energia viene dal generatore che mantiene la corrente contro la fem indotta dal moto (em-10). <b>Il magnetico è sempre un intermediario, mai una sorgente di energia.</b></p></div>`},
  {t:'prosa', title:'Forza su un filo, e momento su una spira', tag:'regola operativa', html:R`
  <p>Sommando la forza su tutti i portatori di un tratto di filo si ottiene
  $$d\vec F=I\,d\vec\ell\times\vec B,$$
  e per un filo rettilineo in campo uniforme $F=BIL\sin\theta$. Due conseguenze che cadono spesso:</p>
  <ul>
   <li><b>fra due fili paralleli</b> a distanza $d$ la forza per unità di lunghezza è $\frac{\mu_0I_1I_2}{2\pi d}$: <b>attrattiva se le correnti sono concordi</b>, repulsiva se opposte. Attenzione: è il contrario dell&rsquo;elettrostatica, dove cariche concordi si respingono;</li>
   <li><b>su una spira chiusa in campo uniforme</b> la forza totale è <b>nulla</b> (l&rsquo;integrale di $d\vec\ell$ su un circuito chiuso è zero), ma il momento non lo è:
   $$\vec\tau=\vec m\times\vec B,\qquad \vec m=I\vec A,$$
   con $\vec m$ il <b>momento di dipolo magnetico</b>. È la struttura identica a quella del dipolo elettrico — momento $\vec p\times\vec E$, energia $-\vec p\cdot\vec E$ — e l&rsquo;energia associata è $U=-\vec m\cdot\vec B$: la spira tende ad allinearsi al campo. <b>È il principio del motore elettrico, e il modello di ogni momento magnetico atomico.</b></li>
  </ul>`},
  {t:'prosa', title:'La forza fra due fili, e come si e definito lampere', tag:'derivazione', html:R`
  <p>La prima delle due conseguenze merita il conto per intero, perché per settant&rsquo;anni ha <b>definito</b> un&rsquo;unità di misura del Sistema Internazionale.</p>
  <p>Il filo 1 produce alla distanza $d$ un campo $B_1=\dfrac{\mu_0I_1}{2\pi d}$, perpendicolare al piano dei due fili. Il filo 2, lungo $L$, ci sta immerso con la corrente perpendicolare a $\vec B_1$, quindi sente $F=B_1I_2L$, e dividendo per la lunghezza:</p>
  $$\frac{F}{L}=\frac{\mu_0I_1I_2}{2\pi d}.$$
  <p><b>La vecchia definizione dell&rsquo;ampere</b> (in vigore fino al 2019) era esattamente questa formula letta al contrario: un ampere è la corrente che, scorrendo in due fili paralleli indefiniti a un metro di distanza, produce una forza di $2\cdot10^{-7}$ newton per metro. Sostituendo $I_1=I_2=1$ A, $d=1$ m e $\mu_0=4\pi\cdot10^{-7}$:</p>
  $$\frac{F}{L}=\frac{4\pi\cdot10^{-7}\cdot1\cdot1}{2\pi\cdot1}=2\cdot10^{-7}\ \mathrm{N/m},$$
  <p>e si capisce da dove veniva quel $4\pi$ nel valore di $\mu_0$: <b>non era una costante misurata, era una scelta fatta apposta perché il numero tornasse</b>. Dal 2019 la definizione è cambiata — l&rsquo;ampere si fissa dalla carica dell&rsquo;elettrone — e di conseguenza $\mu_0$ è diventata una quantità <i>misurata</i>, non più esatta.</p>
  <p><b>Il verso, che è la metà dell&rsquo;esercizio.</b> Correnti concordi si attraggono, opposte si respingono: il contrario dell&rsquo;elettrostatica. Il modo di ricordarlo senza sbagliare non è la regola della mano destra applicata due volte — è troppo facile perdersi — ma questo: <b>due fili concordi sono un pezzo di solenoide</b>, e un solenoide si stringe su se stesso perché il campo interno è intenso e quello esterno quasi nullo. La natura preferisce la configurazione in cui le linee di campo si concatenano bene.</p>`}
]},

/* ---------------- 02 · BIOT-SAVART ---------------- */
{ num:'02', title:'Biot-Savart: il campo prodotto, e la spira sullasse', meta:'la legge elementare · la spira · il limite di dipolo · le bobine di Helmholtz',
  blocchi:[
  {t:'prosa', title:'La legge, e come si usa davvero', tag:'costruzione', html:R`
  <p>Il contributo al campo di un trattino di filo percorso da corrente è
  $$d\vec B=\frac{\mu_0}{4\pi}\frac{I\,d\vec\ell\times\hat r}{r^{2}}.$$
  È il gemello della legge di Coulomb: stesso $1/r^2$, stessa struttura di sovrapposizione. <b>La differenza sta nel prodotto vettoriale</b>, che rende il campo <i>perpendicolare</i> sia al filo sia al raggio — le linee girano attorno alla corrente invece di uscirne.</p>
  <p><b>Quando si usa e quando no.</b> Biot-Savart serve quando <b>non c&rsquo;è abbastanza simmetria</b> per Ampère: spire, archi di circonferenza, segmenti finiti. Quando la simmetria c&rsquo;è (filo indefinito, solenoide, toroide) è uno spreco: si usa Ampère e si finisce in tre righe. <b>La prima domanda davanti a un esercizio di magnetostatica è sempre: c&rsquo;è simmetria?</b></p>`},
  {t:'reveal', title:'La spira sullasse, che e il conto piu frequente', tag:'esame', steps:[
   {label:'Il campo', body:R`
   <p>Per una spira circolare di raggio $R$, nel punto dell&rsquo;asse a distanza $z$ dal centro, le componenti radiali dei contributi si cancellano per simmetria e restano quelle assiali:
   $$B(z)=\frac{\mu_0IR^{2}}{2(R^{2}+z^{2})^{3/2}}.$$</p>`},
   {label:'I due limiti, che sono il controllo', body:R`
   <p><b>Al centro</b> ($z=0$): $B=\dfrac{\mu_0I}{2R}$ — formula da avere in memoria, e da cui si ricava subito quella dell&rsquo;arco di circonferenza moltiplicando per la frazione di giro.</p>
   <p><b>Molto lontano</b> ($z\gg R$): $B\simeq\dfrac{\mu_0IR^{2}}{2z^{3}}$, cioè $B\propto\dfrac{\mu_0m}{2\pi z^{3}}$ con $m=I\pi R^{2}$. <b>Il campo di dipolo magnetico va come $1/z^3$</b>, esattamente come quello di dipolo elettrico: da lontano una spira e un magnetino sono indistinguibili. <b>E si vede perché non esiste un termine $1/z^2$</b>: quello sarebbe il campo di un monopolo, che non c&rsquo;è.</p>`},
   {label:'Le bobine di Helmholtz, e perche la distanza e proprio R', body:R`
   <p>Due spire uguali, coassiali, a distanza $d$. Al centro il campo è la somma dei due contributi. Per simmetria la derivata prima è nulla in mezzo, e si può chiedere di più: <b>annullare anche la derivata seconda</b>. Il conto dà una sola condizione, $d=R$ — la distanza uguale al raggio.</p>
   <p>Con quella scelta il campo attorno al centro è <b>piatto al secondo ordine</b>: una regione ampia di campo praticamente uniforme, senza bisogno di un solenoide. <b>È la configurazione standard di ogni laboratorio</b> che serva un campo uniforme accessibile da fuori, ed è un esempio pulito di come una condizione matematica — annullare una derivata — diventi una specifica costruttiva.</p>`}
  ]},
  {t:'plot', title:'La spira e le bobine di Helmholtz: dove il campo diventa piatto',
   intro:R`Campo sull&rsquo;asse, in unità $\mu_0I/(2R)$ e $R=1$: una spira sola, due spire a distanza $d=R$ (Helmholtz), e due spire troppo vicine o troppo lontane.`,
   plots:[
    {kind:'func2d', xr:[-1.6,1.6], yr:[0,1.6], height:350,
     title:'due spire a distanza uguale al raggio: campo piatto al centro',
     xlabel:'z / R', ylabel:'B (unita mu0 I / 2R)',
     curves:[
      {f:'1/pow(1+x*x,1.5)', col:'#4d5a6b', width:1.8, dash:true, label:'una spira sola'},
      {f:'1/pow(1+pow(x-0.5,2),1.5)+1/pow(1+pow(x+0.5,2),1.5)', col:'#5eead4', width:2.6, label:'Helmholtz: d=R'},
      {f:'1/pow(1+pow(x-0.15,2),1.5)+1/pow(1+pow(x+0.15,2),1.5)', col:'#d8a13a', width:1.8, label:'troppo vicine: d=0.3R'},
      {f:'1/pow(1+pow(x-1.0,2),1.5)+1/pow(1+pow(x+1.0,2),1.5)', col:'#b98cff', width:1.8, label:'troppo lontane: d=2R'}
     ],
     segs:[{x1:-1.6, y1:1.4311, x2:1.6, y2:1.4311, col:'#ff6b6b', dash:true, width:1.2, label:'il piatto di Helmholtz', lx:-1.5, ly:1.47}]}
   ],
   leggi:R`<b>Le tre configurazioni a due spire mostrano i tre comportamenti possibili</b>, e la figura è più eloquente del conto. Con le spire troppo <b>vicine</b> (oro) il campo ha un massimo netto al centro: si comporta come una spira sola più intensa. Troppo <b>lontane</b> (viola) compare un avvallamento in mezzo e due massimi sotto ciascuna bobina. Alla distanza <b>esatta $d=R$</b> (verde) i due comportamenti si compensano: la curva è piatta, e resta piatta per un tratto sorprendentemente ampio — circa $\pm0{,}3R$ con variazioni sotto l&rsquo;1%.<br><br>
   <b>La lettura che vale l&rsquo;esercizio</b>: la condizione di Helmholtz non è che «il campo è massimo» né «le due spire sono vicine». È che la <b>derivata seconda si annulla</b>, cioè che il massimo e l&rsquo;avvallamento si scambiano proprio lì. Guardando le tre curve si vede il passaggio: per $d<R$ c&rsquo;è un massimo, per $d>R$ un minimo, e nel mezzo il punto in cui il profilo non è né l&rsquo;uno né l&rsquo;altro.`}
]},

/* ---------------- 03 · LA LEGGE DI AMPÈRE ---------------- */
{ num:'03', title:'La legge di Ampere: la circuitazione, e le tre simmetrie che risolvono tutto', meta:'la ricetta · filo indefinito · filo spesso · solenoide e toroide',
  blocchi:[
  {t:'prosa', title:'La legge, e la ricetta identica a quella di Gauss', tag:'regola operativa', html:R`
  <p>$$\oint_\gamma\vec B\cdot d\vec\ell=\mu_0I_{\text{conc}},$$
  dove $I_{\text{conc}}$ è la corrente che attraversa <b>una qualunque</b> superficie che abbia $\gamma$ come bordo. La ricetta è la stessa di Gauss in em-02, con il flusso sostituito dalla circuitazione:</p>
  <ol>
   <li><b>la simmetria dà la forma</b> di $\vec B$ (direzione, e da quali coordinate dipende il modulo);</li>
   <li>si sceglie un cammino $\gamma$ su cui $\vec B$ sia <b>costante in modulo e parallelo</b> a $d\vec\ell$, così che la circuitazione sia $B\times(\text{lunghezza})$;</li>
   <li>si conta la corrente concatenata e si risolve.</li>
  </ol>
  <p><b>La legge vale sempre, ma serve a calcolare solo quando c&rsquo;è simmetria</b> — identico a Gauss. Senza simmetria resta vera e inutile, e si torna a Biot-Savart.</p>
  <p><b>La forma locale, in due righe.</b> Il <span class="str" data-str="teorema-di-stokes">teorema di Stokes</span> trasforma la circuitazione in un flusso di rotore, $\oint_{\partial S}\vec B\cdot d\vec\ell=\int_S(\nabla\times\vec B)\cdot\hat n\,dS$, mentre la corrente concatenata è il flusso della densità, $I_{\text{conc}}=\int_S\vec J\cdot\hat n\,dS$. Chiedendo l&rsquo;uguaglianza per <i>ogni</i> superficie $S$ — lo stesso argomento di arbitrarietà con cui em-02 ha prodotto la forma locale di Gauss — i due integrandi coincidono:
  $$\boxed{\;\nabla\times\vec B=\mu_0\vec J\;}$$
  Il <span class="str" data-str="rotore">rotore</span> di $\vec B$ è la densità di corrente: è <b>la sorgente puntuale del campo magnetico</b>, come $\rho/\varepsilon_0$ lo era per la divergenza di $\vec E$. Questa è la quarta equazione di Maxwell nella sua versione <b>stazionaria</b>, e in em-11 si vedrà che così com&rsquo;è <i>non può</i> essere completa: prendendone la divergenza si ottiene $\nabla\cdot\vec J=0$, che è falso ogni volta che un condensatore si carica. È da quella crepa che nasce la corrente di spostamento.</p>`},
  {t:'reveal', title:'I quattro casi che coprono gli esami', tag:'esame', steps:[
   {label:'Filo indefinito', body:R`
   <p>Simmetria cilindrica: $\vec B$ è tangente alle circonferenze attorno al filo e dipende solo da $r$. Con $\gamma$ una circonferenza: $B\cdot2\pi r=\mu_0I$, quindi
   $$B=\frac{\mu_0I}{2\pi r}.$$
   <b>Da confrontare col filo carico di em-02</b>, dove il campo elettrico era anch&rsquo;esso $\propto1/r$: stessa simmetria, stessa dipendenza — e cambia solo la <i>direzione</i>, radiale là, tangenziale qui.</p>`},
   {label:'Filo spesso, ed e il gemello della sfera carica', body:R`
   <p>Filo cilindrico di raggio $a$ con corrente $I$ distribuita uniformemente. Per $r<a$ la corrente concatenata è solo la frazione $I\frac{r^2}{a^2}$, quindi
   $$B_{\text{int}}(r)=\frac{\mu_0Ir}{2\pi a^{2}},\qquad B_{\text{est}}(r)=\frac{\mu_0I}{2\pi r}.$$
   <b>Cresce linearmente dentro, decresce come $1/r$ fuori, e in $r=a$ le due espressioni coincidono</b> — controllo obbligatorio in ogni esercizio di questo tipo. È la stessa struttura del campo elettrico di una sfera uniformemente carica (em-02), e riconoscerlo fa risparmiare metà del conto.</p>`},
   {label:'Solenoide e toroide', body:R`
   <p><b>Solenoide</b> indefinito, $n$ spire per unità di lunghezza: si sceglie un rettangolo con un lato dentro e uno fuori (dove $B=0$) e i lati corti perpendicolari al campo. Restano $B\,L=\mu_0nLI$, cioè
   $$B=\mu_0nI,$$
   <b>uniforme e indipendente dalla posizione dentro</b>: è il modo pratico di fare un campo magnetico uniforme.</p>
   <p><b>Toroide</b> con $N$ spire: cammino circolare dentro il toro, $B\cdot2\pi r=\mu_0NI$, quindi $B=\frac{\mu_0NI}{2\pi r}$ — <b>non uniforme</b>, decresce verso l&rsquo;esterno del toro. Fuori è nullo, e questa è la ragione per cui il toroide è la geometria preferita quando il campo non deve disperdersi.</p>`}
  ]},
  {t:'plot', title:'Il campo dentro e fuori un filo spesso',
   intro:R`$B(r)$ per un cilindro di raggio $a$ percorso da corrente uniforme, in unità $\mu_0I/(2\pi a)$.`,
   plots:[
    {kind:'func2d', xr:[0,4], yr:[0,1.15], height:330,
     title:'lineare dentro, 1/r fuori, e continuo sul bordo',
     xlabel:'r / a', ylabel:'B (unita mu0 I / 2 pi a)',
     curves:[{f:'x<1 ? x : 1/x', col:'#5eead4', width:2.6, label:'B(r)'}],
     segs:[{x1:1, y1:0, x2:1, y2:1.1, col:'#ff6b6b', dash:true, width:1.4, label:'a', lx:1.03, ly:1.05},
           {x1:0, y1:0, x2:4, y2:0, col:'#4d5a6b', width:1}],
     marks:[{x:1, y:1, label:'massimo sulla superficie', col:'#d8a13a', up:true, left:true}]}
   ],
   leggi:R`<b>Il massimo è sulla superficie del filo</b>, e le due espressioni si raccordano lì con continuità — se in un esercizio non si raccordano, c&rsquo;è un errore nel conto della corrente concatenata. Dentro il campo cresce perché la corrente concatenata cresce come $r^2$ mentre il cammino cresce come $r$: il rapporto dà $r$. Fuori la corrente concatenata è tutta, e resta solo $1/r$.<br><br>
   <b>Da confrontare con la figura della sfera carica in em-02</b>: è la stessa forma, con la stessa spiegazione. Quando due problemi diversi producono la stessa curva, di solito è perché condividono la simmetria e il modo in cui la sorgente si accumula — e riconoscerlo è più utile che ricordare due formule.`}
]},

/* ---------------- 04 · NON CI SONO MONOPOLI ---------------- */
{ num:'04', title:'Perche non esiste un Gauss utile per B', meta:'div B = 0 · linee chiuse · il flusso concatenato · cosa cambierebbe con i monopoli',
  blocchi:[
  {t:'prosa', title:'La legge, e la sua vera utilita', tag:'grammatica', html:R`
  <p>$$\nabla\cdot\vec B=0\qquad\Longleftrightarrow\qquad \oint_S\vec B\cdot d\vec S=0\ \text{per ogni superficie chiusa}.$$
  Non esistono sorgenti puntiformi di campo magnetico: le linee di $\vec B$ <b>non nascono e non muoiono</b>, si chiudono su se stesse — cioè il <span class="str" data-str="flusso-di-un-campo">flusso</span> attraverso qualunque superficie chiusa è zero, per qualunque configurazione di correnti. Se in elettrostatica Gauss era lo strumento di calcolo principale, qui la legge analoga <b>non calcola niente</b> — dice zero.</p>
  <p><b>Ma è tutt&rsquo;altro che inutile, e serve in due modi.</b> Primo: rende ben definito il <b>flusso concatenato</b> a un circuito, perché il flusso attraverso due superfici diverse che si appoggiano allo stesso bordo è lo <i>stesso</i>. Senza questo, la legge dell&rsquo;induzione di em-10 sarebbe ambigua. Secondo: garantisce che esista un <b>potenziale vettore</b> $\vec A$ con $\vec B=\nabla\times\vec A$ — perché un campo a divergenza nulla è sempre un rotore — e il potenziale vettore è l&rsquo;oggetto con cui l&rsquo;elettromagnetismo si scrive in relatività e in meccanica quantistica.</p>
  <div class="note"><b>Il legame con Analisi Vettoriale è diretto</b> e vale la pena nominarlo: «divergenza nulla ⟹ è un rotore» è il duale di «rotore nullo ⟹ è un gradiente», che dà il potenziale scalare dell&rsquo;elettrostatica. <b>I due potenziali della fisica nascono dai due teoremi gemelli</b>, e in entrambi i casi la condizione topologica sul dominio (semplicemente connesso, senza buchi) è ciò che rende vera l&rsquo;implicazione.</div>`},
  {t:'prosa', title:'Il potenziale vettore, e la liberta che si porta dietro', tag:'struttura', html:R`
  <p>Vale la pena spendere qualche riga in più su $\vec A$, perché è l&rsquo;oggetto con cui questo corso viene riscritto in tutti i corsi successivi, e perché porta con sé una proprietà che all&rsquo;inizio sembra un difetto.</p>
  <p><b>Non è unico.</b> Se $\vec B=\nabla\times\vec A$, allora anche $\vec A'=\vec A+\nabla\chi$ dà lo stesso campo, per qualunque funzione scalare $\chi$ — perché il rotore di un gradiente è identicamente nullo. Due potenziali vettori diversi descrivono <b>la stessa fisica</b>, e la trasformazione che li lega si chiama <b>trasformazione di gauge</b>.</p>
  <p>La libertà si usa: si sceglie $\chi$ in modo da semplificare le equazioni. In magnetostatica la scelta comoda è $\nabla\cdot\vec A=0$ (gauge di Coulomb), e con essa la legge di Ampère $\nabla\times\vec B=\mu_0\vec J$ diventa</p>
  $$\nabla^{2}\vec A=-\mu_0\vec J,$$
  <p>cioè <b>tre equazioni di Poisson indipendenti</b>, una per componente — la stessa equazione del potenziale elettrostatico, di cui si conoscono già le soluzioni. La soluzione si scrive quindi per analogia, senza rifare nulla:</p>
  $$\vec A(\vec r)=\frac{\mu_0}{4\pi}\int\frac{\vec J(\vec r')}{|\vec r-\vec r'|}\,dV'.$$
  <p><b>Questo è il motivo pratico per cui $\vec A$ esiste nei conti e non solo nei discorsi</b>: è un integrale <i>senza prodotti vettoriali</i>, dove ogni componente si somma da sola, mentre Biot-Savart obbliga a proiettare un prodotto vettoriale per ogni pezzetto di filo. Su geometrie storte è spesso la strada più corta: si calcola $\vec A$ sommando come si sommano gli scalari, e si deriva alla fine.</p>
  <div class="note"><b>E la domanda che resta aperta fino a Meccanica Quantistica.</b> Se $\vec A$ non è unico, è una comodità di calcolo o ha un significato fisico? La risposta classica è «comodità»: solo $\vec B$ si misura. Quella quantistica è diversa — l&rsquo;effetto Aharonov-Bohm mostra che una particella risente di $\vec A$ in una regione dove $\vec B$ è <i>esattamente nullo</i>, spostando le frange di interferenza. <b>L&rsquo;oggetto ausiliario risulta più fondamentale del campo che doveva aiutare a calcolare</b>, ed è una delle sorprese che rendono l&rsquo;elettromagnetismo il ponte verso il resto della fisica.</div>`}
]},

/* ---------------- 04b · ESERCIZI ---------------- */
{ num:'04b', title:'Esercizi — tocca a te', meta:'i tre strumenti che vivono di forza di Lorentz: selettore, spettrometro, ciclotrone',
  blocchi:[
  {t:'esercizio', title:'1 · Selettore di velocita e spettrometro di massa',
   src:'forma ricorrente negli scritti: campi incrociati piu moto circolare',
   testo:R`Ioni di carica $q$ e masse diverse entrano in una regione con $\vec E$ e $\vec B$ perpendicolari fra loro e alla velocità. Trova quale velocità attraversa la regione senza deviare. Gli ioni che passano entrano poi in una seconda regione con solo $\vec B'$: mostra che la posizione in cui colpiscono lo schermo misura la massa.`,
   steps:[
    {label:'Il selettore', body:R`
    <p>Le due forze sono opposte se i campi sono disposti bene: $qE$ da una parte, $qvB$ dall&rsquo;altra. Si compensano quando</p>
    $$qE=qvB\quad\Longrightarrow\quad v=\frac{E}{B}.$$
    <p><b>Il risultato non dipende né dalla carica né dalla massa</b>: passa una sola velocità, per tutti. È questo che rende il dispositivo un <i>selettore</i> e non un filtro di massa — e il motivo per cui va messo prima dello spettrometro, non dopo.</p>`},
    {label:'Lo spettrometro', body:R`
    <p>Nella seconda regione la forza è solo magnetica e perpendicolare alla velocità: il moto è circolare uniforme, con $qvB'=\dfrac{mv^{2}}{R}$, cioè</p>
    $$R=\frac{mv}{qB'}=\frac{mE}{qBB'}.$$
    <p>Lo ione colpisce lo schermo a distanza $2R$ dal punto d&rsquo;ingresso, e quella distanza è <b>proporzionale alla massa</b>: masse diverse, righe diverse. È lo spettrometro di massa, ed è così che si misurano gli isotopi.</p>
    <p><b>Il controllo dimensionale che conviene fare</b>: $[mE/(qBB')]$ deve essere una lunghezza. Con $E/B$ che è una velocità e $m v/(qB')$ che è il raggio di Larmor, torna. <b>Ogni volta che una formula mescola due campi diversi, il controllo dimensionale è l&rsquo;unico modo rapido di scoprire un $B$ al posto sbagliato.</b></p>`}
   ]},
  {t:'esercizio', title:'2 · Il ciclotrone, e perche a un certo punto smette di funzionare',
   src:'classico di fine capitolo, e ottima domanda da orale',
   testo:R`In un ciclotrone le particelle girano in un campo $B$ uniforme e vengono accelerate due volte per giro da una tensione alternata. Mostra che la frequenza necessaria non dipende dalla velocità, e spiega perché a energie alte il dispositivo non funziona più.`,
   steps:[
    {label:'La frequenza di ciclotrone', body:R`
    <p>Dal moto circolare, $R=\dfrac{mv}{qB}$, il periodo è $T=\dfrac{2\pi R}{v}=\dfrac{2\pi m}{qB}$, cioè</p>
    $$f_c=\frac{qB}{2\pi m}.$$
    <p><b>La velocità è sparita.</b> Una particella più veloce percorre un cerchio più grande <i>nello stesso tempo</i>: si può quindi accelerarla con una tensione alternata a frequenza fissa, e ogni giro guadagna energia restando in sincronia. È l&rsquo;idea che ha reso possibile l&rsquo;acceleratore.</p>`},
    {label:'Dove si rompe', body:R`
    <p>La cancellazione della velocità vale solo finché $m$ è costante. A energie relativistiche la massa efficace cresce come $\gamma m$, il periodo diventa $T=\dfrac{2\pi\gamma m}{qB}$ e <b>la particella arriva in ritardo</b> all&rsquo;appuntamento con la tensione acceleratrice: perde il sincronismo e smette di guadagnare energia.</p>
    <p>La soluzione — che è il motivo per cui le macchine moderne si chiamano diversamente — è <b>far variare la frequenza</b> durante l&rsquo;accelerazione (sincrociclotrone) o far crescere $B$ tenendo il raggio fisso (sincrotrone). <b>Il limite del ciclotrone non è tecnologico ma relativistico</b>, e si incontra già a qualche decina di MeV per i protoni: è uno dei pochi punti di un corso di elettromagnetismo in cui la relatività si presenta come vincolo pratico invece che come raffinamento concettuale.</p>`}
   ]},
  {t:'esercizio', title:'3 · La spira in campo non uniforme',
   src:'la domanda che separa chi ha capito il dipolo da chi ha imparato la formula',
   testo:R`Una piccola spira di momento magnetico $\vec m$ è immersa in un campo $\vec B$ non uniforme. La forza totale su di essa è ancora nulla? E in che direzione si muove?`,
   steps:[
    {label:'Perche la risposta cambia', body:R`
    <p>La forza totale su un circuito chiuso è $\oint I\,d\vec\ell\times\vec B$. In campo <b>uniforme</b> $\vec B$ esce dall&rsquo;integrale e resta $\oint d\vec\ell=0$: forza nulla. Se invece $\vec B$ cambia da punto a punto, non può uscire, e l&rsquo;integrale non è più garantito nullo.</p>
    <p>Sviluppando per una spira piccola si ottiene $\vec F=\nabla(\vec m\cdot\vec B)$: <b>la spira è attratta dove il campo è più intenso</b> se $\vec m$ è allineato a $\vec B$, respinta se è antiallineato. È la stessa struttura del dipolo elettrico attratto dal pettine carico, con $\vec m$ al posto di $\vec p$.</p>
    <p><b>Le due conseguenze che si vedono in laboratorio</b>: un pezzo di ferro (momenti che si allineano al campo) viene <i>attirato</i> da un magnete, mentre un materiale diamagnetico (momenti indotti antiallineati) viene <i>respinto</i> — ed è il motivo per cui una rana o una goccia d&rsquo;acqua possono levitare in un campo abbastanza disuniforme. <b>Il segno del momento indotto decide tutto</b>, e non dipende dal verso del campo: invertendo $\vec B$ si inverte anche $\vec m$, e il prodotto resta.</p>`}
   ]},
  {t:'collaudo', title:'Controlla di aver capito', html:R`
  <ol>
  <li>Perché il campo magnetico non compie lavoro, e allora come fa un motore elettrico a farlo?</li>
  <li>Due fili con correnti concordi si attraggono. Due fasci di elettroni paralleli, con la stessa velocità, si attraggono o si respingono?</li>
  <li>In quale verso gira una carica positiva vista da chi ha $\vec B$ che punta verso di lui?</li>
  </ol>`,
   sol:R`<ol>
   <li>Perché la forza $q\vec v\times\vec B$ è sempre perpendicolare a $\vec v$, e una forza perpendicolare allo spostamento non fa lavoro: può cambiare la direzione della velocità, mai il suo modulo. Il motore funziona perché il lavoro lo fa il <b>generatore</b> che mantiene la corrente: il campo magnetico si limita a convertire, ed è un intermediario, non una sorgente di energia.</li>
   <li><b>Si respingono</b>, ed è il caso in cui l'analogia col filo inganna. Due fasci di elettroni sono correnti concordi — quindi attrazione magnetica — ma sono anche due distribuzioni di carica negativa non compensata, quindi c'è una repulsione elettrostatica che nel filo non esisteva (lì il reticolo positivo la cancellava). Il conto dà un rapporto $v^{2}/c^{2}$ fra le due, e a velocità non relativistiche vince di gran lunga la repulsione elettrica.</li>
   <li>In verso <b>orario</b>. La forza $q\vec v\times\vec B$ con $\vec B$ uscente dal foglio e $\vec v$ verso destra punta verso il basso: la traiettoria curva in senso orario. È l'unico modo di non sbagliarsi — si prende un istante, si calcola il prodotto vettoriale, si guarda dove piega. Le regole mnemoniche funzionano finché non si cambia il segno della carica.</li>
   </ol>`}
]},

/* ---------------- 05 · IL SENSO ---------------- */
{ num:'05', title:'Il senso, e le rotte', meta:'cosa chiude, cosa apre, e dove il magnetismo si rivela essere relativita',
  blocchi:[
  {t:'prosa', title:'Cosa lascia in mano', tag:'sintesi', html:R`
  <p><b>A monte.</b> em-07 ha dato le correnti; qui diventano sorgenti di campo. Il metodo — trovare la simmetria, scegliere il cammino, contare la sorgente — è identico a quello di em-02, con la circuitazione al posto del flusso.</p>
  <p><b>Il punto.</b> Elettrico e magnetico non sono due teorie affiancate: sono <b>due facce che si scambiano i ruoli</b>. Per $\vec E$ è il flusso a dare le sorgenti e la circuitazione a essere nulla; per $\vec B$ è l&rsquo;opposto. In em-11 le quattro leggi staranno insieme, e la simmetria diventerà visibile.</p>
  <p><b>A valle.</b> em-09 mette la materia dentro il campo e introduce $\vec H$; em-10 fa variare il flusso e scopre l&rsquo;induzione; em-14 mostra che il campo magnetico è il campo elettrico <b>visto da un altro riferimento</b>, e che i due non potevano che esistere insieme.</p>`},
  {t:'prolessi', title:'Dove riappare questo movimento, nella fisica che farai',
   oggetto:R`<b>Il campo magnetico come effetto del moto delle cariche</b>, e la circuitazione come legge che lo genera.`,
   rotte:[
    {dove:'Relativita', txt:R`Il campo magnetico di un filo è il campo <b>elettrico</b> dello stesso filo visto da un riferimento in moto: la contrazione delle lunghezze sbilancia le densità di carica positive e negative e produce un campo elettrico netto, che nel riferimento del laboratorio chiamiamo magnetico. <b>Il magnetismo è relatività ristretta al primo ordine in $v/c$</b> — ed è il contenuto di em-14.`},
    {dove:'Meccanica<br>quantistica', txt:R`Il potenziale vettore $\vec A$, che qui sembra un artificio, diventa <b>l&rsquo;oggetto primario</b>: entra nell&rsquo;hamiltoniana come $(\vec p-q\vec A)^2/2m$, e l&rsquo;effetto Aharonov-Bohm mostra che un elettrone risente di $\vec A$ anche dove $\vec B=0$. La descrizione con i soli campi è incompleta.`},
    {dove:'Astrofisica', txt:R`Il campo magnetico galattico, quello stellare e quello delle pulsar governano l&rsquo;accrescimento, i getti e il trasporto di momento angolare. La <b>magnetoidrodinamica</b> nasce mettendo insieme queste leggi con quelle dei fluidi, e il congelamento del flusso è la stessa $\nabla\cdot\vec B=0$ applicata a un plasma in moto.`},
    {dove:'Materia<br>condensata', txt:R`Il momento magnetico della spira è il modello classico del <b>momento magnetico dell&rsquo;elettrone</b>; da lì nascono paramagnetismo e ferromagnetismo (em-09), e in meccanica quantistica lo spin — che ha momento magnetico senza essere una corrente che gira.`}
   ],
   domanda:R`Due cariche ferme si respingono con la forza di Coulomb. Le stesse due cariche, viste da un treno in corsa, sono <b>in moto</b>: quindi generano campi magnetici e si attraggono magneticamente, oltre a respingersi elettricamente. <b>Domanda che porti avanti:</b> due osservatori possono misurare forze diverse fra le stesse due cariche? La risposta è no, e salvarla richiede che si trasformino anche i <i>tempi</i> e le <i>lunghezze</i>: la coerenza dell&rsquo;elettromagnetismo <b>impone</b> la relatività ristretta invece di subirla. Storicamente è andata esattamente così, e in em-14 lo vedrai nel dettaglio.`}
]}

];

/* ---- renderer dei blocchi ---- */
function sectionProsa(title, tag, html){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var body=elFromHTML('<div class="open-body">'+html+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function sectionGram(title, rows){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag gramtag">grammatica</span></h3>';
  var inner='<table class="gramtab">';
  rows.forEach(function(r){ inner+='<tr><td class="gs">'+r[0]+'</td><td>'+r[1]+'</td></tr>'; });
  inner+='</table>';
  var body=elFromHTML('<div class="gramwrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
/* --- blocco PLOT: la figura non decora, si legge. Ogni plot porta una chiave di lettura. --- */
function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}

  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
    else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
    else if(b.t==='prolessi') m.appendChild(sectionProlessi(b));
    else if(b.t==='reveal')m.appendChild(sectionReveal(b.title,b.tag,b.steps));
    else if(b.t==='esercizio') m.appendChild(sectionEsercizio(b));
    else if(b.t==='collaudo')  m.appendChild(sectionCollaudo(b.title,b.items));
    else if(b.t==='plot')      m.appendChild(sectionPlot(b));
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}

/* deep-link: em-08-campo-magnetico.html#03 apre direttamente la tappa 03 */
window.addEventListener('DOMContentLoaded', function(){
  var h=(location.hash||'').replace('#','');
  showTappa(byId[h]?h:'00');
});
window.addEventListener('hashchange', function(){
  var h=(location.hash||'').replace('#','');
  if(byId[h]) showTappa(h);
});
</script>
