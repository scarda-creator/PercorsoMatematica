<style>
  :root{
    --bg:#0e1117; --panel:#161b22; --panel2:#1c232d; --border:#2b333d;
    --txt:#eef3f8; --muted:#b9c4d1; --accent:#4c8dff; --accent2:#8fb0ff;
    --ok:#2ea043; --okbg:#10331b; --warn:#d8a13a; --warnbg:#332a10;
    --gram:#5eead4; --grambg:#0f2a26;
    --pro:#b98cff; --probg:#1a1430; --proline:#2a2247; --proedge:#3a2d5c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    font-size:17px;line-height:1.55;}
  a{color:var(--accent2);}
  .banner{background:var(--panel2);border-bottom:1px solid var(--border);color:var(--muted);
    font-size:.8rem;font-weight:600;text-align:center;padding:8px 12px;letter-spacing:.3px;}
  .banner b{color:var(--accent2);}
  .shell{display:flex;max-width:1180px;margin:0 auto;align-items:flex-start;}

  /* ---- SIDEBAR ---- */
  .sidebar{width:280px;flex:0 0 280px;padding:20px 12px 60px;position:sticky;top:0;
    max-height:100vh;overflow-y:auto;border-right:1px solid var(--border);}
  .sidebar h2{font-size:.72rem;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);
    margin:18px 8px 8px;}
  .navitem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:none;
    background:transparent;color:var(--txt);padding:9px 10px;border-radius:8px;cursor:pointer;
    font-size:.9rem;transition:.12s;border:1px solid transparent;}
  .navitem:hover{background:var(--panel2);}
  .navitem.active{background:#13233f;border-color:var(--accent);color:#fff;}
  .navitem .dot{width:7px;height:7px;border-radius:50%;background:transparent;flex:0 0 7px;
    border:1px solid var(--border);}
  .navitem.seen .dot{background:var(--ok);border-color:var(--ok);}
  .navitem .nx{color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto;}

  /* ---- MAIN ---- */
  .main{flex:1 1 auto;min-width:0;padding:24px 30px 90px;max-width:860px;}
  h1{font-size:1.5rem;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:.92rem;margin:0 0 18px;}
  .sfhead{border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:8px;}
  .sfhead h1{font-size:1.55rem;}
  .meta{color:var(--muted);font-size:.82rem;margin-top:6px;}

  .section{margin:26px 0;}
  .section > h3{font-size:1.02rem;color:var(--accent2);margin:0 0 10px;
    display:flex;align-items:center;gap:10px;}
  .section > h3 .tag{font-size:.66rem;font-weight:700;letter-spacing:.4px;background:var(--panel2);
    border:1px solid var(--border);color:var(--muted);padding:2px 8px;border-radius:20px;
    text-transform:uppercase;}
  /* --- blocchi figura --- */
  .section > h3 .tag.plottag{background:#101f2e;border-color:#1f3c57;color:#7ab8e0;}
  .plot-intro{color:var(--muted);font-size:.95rem;margin:0 0 12px;}
  .plot-row{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;
    background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;}
  .plot-row.due .plot-box{flex:1 1 300px;min-width:280px;}
  .plot-box{max-width:560px;}
  .plot-leggi{margin-top:10px;background:var(--panel2);border:1px solid var(--border);
    border-left:3px solid #4a8fc7;border-radius:0 10px 10px 0;padding:11px 14px;
    font-size:.93rem;color:var(--muted);}
  .plot-leggi b{color:#7ab8e0;}
  .plot-err{color:#ff6b6b;font-size:.85rem;}
  .open-body{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
  .open-body p:first-child{margin-top:0;} .open-body p:last-child{margin-bottom:0;}
  .open-body ul{margin:.4em 0;padding-left:1.2em;} .open-body li{margin:.35em 0;}

  .note{background:var(--panel2);border-left:3px solid var(--muted);border-radius:6px;
    padding:9px 12px;margin:12px 0;font-size:.9rem;color:var(--muted);}
  .note b{color:#ff9d6b;}
  .note.warn{background:var(--warnbg);border-left-color:var(--warn);color:#e0b85a;}
  .note.warn b{color:#f0c25a;}

  /* ---- GRAMMATICA ---- */
  .gramwrap{background:var(--grambg);border:1px solid #1f4d47;border-radius:12px;padding:6px 6px;}
  table.gramtab{border-collapse:collapse;width:100%;font-size:.92rem;}
  table.gramtab td{padding:9px 12px;vertical-align:top;border-bottom:1px solid #17332e;}
  table.gramtab tr:last-child td{border-bottom:none;}
  table.gramtab td.gs{white-space:nowrap;color:var(--gram);width:1%;
    border-right:1px solid #17332e;font-variant-numeric:tabular-nums;}
  .section > h3 .tag.gramtag{background:var(--grambg);border-color:#1f4d47;color:var(--gram);}

  /* ---- STRUMENTI (repertorio condiviso: la scheda si apre DENTRO la frase) ----
     Nessun accento nuovo: riusa il verde della grammatica, perche' uno strumento
     richiamato e' grammatica gia' spiegata altrove, non una quinta specie di blocco. */
  .str{color:var(--gram);border-bottom:1px dashed var(--gram);cursor:pointer;}
  .str:hover{background:var(--grambg);}
  .str::after{content:"\2666";font-size:.62em;vertical-align:.42em;margin-left:2px;opacity:.8;}
  .str.aperto::after{content:"\2715";}
  .str.rotto{color:#ff6b6b;border-bottom-color:#ff6b6b;cursor:help;}
  /* la scheda e' uno SPAN in display:block, non un div: i rimandi cadono dentro
     <p>, <li> e celle di tabella, dove un div e' HTML illegale. */
  .strcard{display:block;margin:10px 0;background:var(--grambg);border:1px solid #1f4d47;
    border-left:3px solid var(--gram);border-radius:0 10px 10px 0;padding:10px 14px;font-size:.9rem;}
  .strcard .sh{display:block;font-size:.66rem;font-weight:700;letter-spacing:.5px;
    text-transform:uppercase;color:var(--gram);margin-bottom:7px;}
  .strcard .sr{display:block;margin:5px 0;}
  .strcard .sk{color:var(--gram);font-weight:600;}

  /* ---- PROLESSI (preannuncio fisico) ---- */
  .prowrap{background:var(--probg);border:1px solid var(--proedge);border-radius:12px;padding:4px 4px 8px;}
  .prohead{padding:11px 14px 4px;color:var(--pro);font-size:.72rem;font-weight:700;letter-spacing:.7px;
    text-transform:uppercase;}
  .pro-oggetto{padding:2px 14px 11px;color:var(--muted);font-size:.92rem;border-bottom:1px solid var(--proline);
    margin-bottom:2px;} .pro-oggetto b{color:var(--txt);}
  table.protab{border-collapse:collapse;width:100%;font-size:.92rem;}
  table.protab td{padding:10px 12px;vertical-align:top;border-bottom:1px solid var(--proline);}
  table.protab tr:last-child td{border-bottom:none;}
  table.protab td.pd{white-space:nowrap;color:var(--pro);width:1%;font-weight:700;font-size:.78rem;
    letter-spacing:.3px;text-transform:uppercase;border-right:1px solid var(--proline);line-height:1.3;}
  .pro-domanda{margin:8px 8px 2px;background:#140d26;border:1px solid var(--proedge);
    border-left:3px solid var(--pro);border-radius:8px;padding:10px 14px;font-size:.92rem;}
  .pro-domanda b{color:var(--pro);}
  .section > h3 .tag.protag{background:var(--probg);border-color:var(--proedge);color:var(--pro);}

  /* ---- REVEAL ---- */
  .rsteps{display:flex;flex-direction:column;gap:12px;}
  .rstep{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 18px;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .rlabel{font-size:.7rem;font-weight:700;letter-spacing:.4px;color:var(--accent);
    text-transform:uppercase;margin-bottom:8px;}
  .rstep p:first-of-type{margin-top:0;} .rstep p:last-child{margin-bottom:0;}
  .rstep ul{margin:.4em 0;padding-left:1.2em;}
  .testo{background:#13233f;border:1px solid #2b4877;border-radius:12px;padding:14px 18px;margin-bottom:14px;}
  .testo .src{display:block;font-size:.74rem;font-style:italic;color:var(--accent2);margin-bottom:8px;
    text-transform:uppercase;letter-spacing:.3px;}
  .esame-nota{font-size:.9rem;color:var(--muted);font-style:italic;margin-top:12px;padding-left:12px;
    border-left:3px solid var(--border);}

  .reveal-btn{background:var(--accent);color:#fff;border:none;padding:11px 18px;border-radius:10px;
    font-size:.95rem;font-weight:600;cursor:pointer;margin-top:14px;transition:.12s;}
  .reveal-btn:hover:not(:disabled){background:var(--accent2);}
  .reveal-btn.small{padding:7px 14px;font-size:.85rem;margin-top:0;background:var(--panel2);
    color:var(--accent2);border:1px solid var(--border);}
  .reveal-btn.small:hover:not(:disabled){border-color:var(--accent);}
  .reveal-btn:disabled,.reveal-btn.done{background:var(--panel2);color:var(--muted);
    border:1px solid var(--border);cursor:default;}

  /* ---- COLLAUDO ---- */
  .collaudo-item{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 18px;margin-bottom:12px;}
  .cq{margin-bottom:10px;}
  .ca{margin-top:12px;background:var(--okbg);border:1px solid #235c33;border-radius:8px;
    padding:10px 14px;font-size:.94rem;}
  .ca b{color:#5fd980;}

  /* ---- PREV / NEXT ---- */
  .prevnext{display:flex;justify-content:space-between;gap:12px;margin-top:40px;
    border-top:1px solid var(--border);padding-top:20px;}
  .pnbtn{flex:1 1 0;background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:12px 16px;cursor:pointer;color:var(--txt);text-align:left;transition:.14s;font:inherit;}
  .pnbtn:hover{border-color:var(--accent);background:var(--panel2);}
  .pnbtn.next{text-align:right;}
  .pnbtn .k{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .pnbtn .t{font-weight:600;color:var(--accent2);}
  .pnbtn:disabled{opacity:.35;cursor:default;border-color:var(--border);background:var(--panel);}

  code{background:var(--panel2);border:1px solid var(--border);border-radius:5px;
    padding:1px 5px;font-size:.85em;color:var(--accent2);}
  .katex{font-size:1.02em;color:var(--txt);} .katex-display{margin:.5em 0;overflow-x:auto;overflow-y:hidden;}

  @media(max-width:860px){
    .shell{flex-direction:column;}
    .sidebar{width:100%;flex:none;position:static;max-height:none;border-right:none;
      border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:4px;}
    .sidebar h2{width:100%;} .navitem{width:auto;}
    .main{padding:20px 16px 80px;}
  }
</style>

<script>

function typeset(el){

/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un
   rimando scritto nella prosa:

       <span class="str" data-str="serie-geometrica">la serie geometrica</span>

   Le schede citate da questo nucleo sono cucite qui sotto dal montaggio

   Apertura: lo stesso gesto del collaudo (si clicca, il pannello compare,
   si typeset una volta sola), portato dentro la frase.
   =================================================================== */
var CORSO = 'meccanica-quantistica';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["operatore-aggiunto"] = {"nome":"Operatore aggiunto e autoaggiunto","riga":"L'aggiunto e' definito da $\\langle\\phi|\\hat A\\psi\\rangle=\\langle\\hat A^{\\dagger}\\phi|\\psi\\rangle$ per ogni coppia di stati, e l'operatore e' autoaggiunto quando coincidono sia $\\hat A^{\\dagger}$ con $\\hat A$ sia i loro domini.","serve":"E' la condizione che rende un operatore un'osservabile: autovalori reali, e autovettori di autovalori distinti ortogonali. In dimensione finita «autoaggiunto» e «hermitiano» coincidono; in dimensione infinita no, e la differenza non e' pedanteria — l'operatore impulso su una semiretta e' hermitiano e non autoaggiunto, e infatti non e' un'osservabile.","esempio":"Se $\\hat A\\psi=a\\psi$ con $\\hat A$ autoaggiunto, allora $a\\langle\\psi|\\psi\\rangle=\\langle\\psi|\\hat A\\psi\\rangle=\\langle\\hat A\\psi|\\psi\\rangle=a^{*}\\langle\\psi|\\psi\\rangle$; siccome la norma non e' nulla segue $a=a^{*}$, cioe' l'autovalore e' reale. Tre righe, e sono la ragione per cui le osservabili si rappresentano cosi'.","debito":"la distinzione fra hermitiano e autoaggiunto in dimensione infinita — domini, estensioni, indici di difetto — e' il programma di von Neumann e sta fuori da questo percorso: qui si dichiara che esiste e si lavora nel caso buono. La regola di inversione dell'ordine nell'aggiunto di un prodotto si usa e non si dimostra.","controllo":[{"tipo":"uguale","sinistra":"conjugate(a)","vale":"a","ipotesi":{"a":"real"},"dove":"esempio","appare":"a=a^{*}"}],"qui":{},"pieno":null};
STRUM["operatore-unitario"] = {"nome":"Operatore unitario","riga":"Un operatore $\\hat U$ e' unitario quando $\\hat U^{\\dagger}\\hat U=\\hat U\\hat U^{\\dagger}=\\mathbb 1$, cioe' $\\hat U^{\\dagger}=\\hat U^{-1}$. Equivale a dire che conserva il prodotto interno: $\\langle \\hat U\\phi|\\hat U\\psi\\rangle=\\langle\\phi|\\psi\\rangle$ per ogni coppia di stati.","serve":"Conservare il prodotto interno vuol dire conservare le probabilita': ogni trasformazione fisica che non cambia gli esiti di una misura — un cambio di base, una traslazione, una rotazione, l'evoluzione temporale — e' unitaria. I suoi autovalori hanno modulo uno, e due osservabili legate da un operatore unitario hanno lo stesso spettro.","esempio":"La rotazione del piano $\\hat U=\\begin{pmatrix}\\cos\\theta&-\\sin\\theta\\\\\\sin\\theta&\\cos\\theta\\end{pmatrix}$ e' unitaria e ha autovalori $e^{\\pm i\\theta}$, di modulo $|e^{i\\theta}|=1$. La matrice $S$ del cambio di base ortonormale e' unitaria per lo stesso motivo: manda una base ortonormale in un'altra.","debito":"la trasformata di Cayley $\\hat U=(\\hat A-i)/(\\hat A+i)$, che lega operatori autoaggiunti e unitari e con cui von Neumann risolve il problema agli autovalori in dimensione infinita, si cita e non si costruisce.","controllo":[{"tipo":"uguale","sinistra":"Abs(exp(I*theta))","vale":"1","ipotesi":{"theta":"real"},"dove":"esempio","appare":"|e^{i\\theta}|=1"}],"qui":{},"pieno":null};
STRUM["cambio-di-variabile"] = {"nome":"Cambio di variabile in una densità","riga":"Una densità non si trasforma sostituendo ma porta il jacobiano: se $y=f(x)$ allora $p_Y(y)=\\sum_i p_X(x_i)\\,/\\,|f'(x_i)|$, sommato su tutti i rami $x_i$ con $f(x_i)=y$.","serve":"È l'unico punto in cui una densità si comporta diversamente da una funzione, ed è l'errore che si ripete. Ciò che è invariante è la probabilità dell'evento, $p_Y(y)|dy|=p_X(x)|dx|$: la densità no, perché è una probabilità per unità di qualcosa, e passando da $x$ a $y$ quell'unità si dilata o si comprime. Scrivere $p_Y(y)=p_X(x(y))$ e basta è attraente e sbagliato. Si scova senza rifare il conto con due prove da cinque secondi: la normalizzazione non torna, e le dimensioni restano quelle della variabile di partenza.","esempio":"Una particella uniforme su un disco di raggio $R$: $p(x,y)=1/(\\pi R^2)$. Passando alla sola distanza dal centro, il jacobiano è l'elemento d'area radiale $2\\pi r$, e resta $p(r)=2r/R^2$ su $[0,R]$, che infatti si normalizza a $1$. Il valor medio è $\\langle r\\rangle=2R/3$ — non $R/2$, che è la risposta di chi tratta $r$ come uniforme. La differenza fra i due numeri è esattamente il fattore $r$, cioè il fatto che lontano dal centro c'è più area.","pieno":{"file":"ms-03-probabilita.html","tappa":"01","come":"la regola dedotta dall'invarianza della probabilità, i rami molteplici e il caso radiale, nel movimento ms-03 di Meccanica Statistica"},"qui":{"meccanica-statistica":{"serve":"È metà della domanda più frequente dello scritto: «calcolare la densità di probabilità dell'energia di singola particella», «la densità di particelle $\\rho(r)$». L'altra metà è la marginalizzazione. Le scritture $d^2r=2\\pi r\\,dr$ e $d^3r=4\\pi r^2dr$ non sono formule da ricordare: sono questo cambio di variabile con gli angoli già integrati, e saperlo deducere è ciò che salva quando la simmetria è cilindrica invece che sferica. Attenzione al doppio jacobiano: $p(r)$ è una densità rispetto a $r$, $\\rho(r)$ è una densità per unità di volume, e fra le due ce n'è un altro.","esempio":"L'energia cinetica in due dimensioni. La misura radiale nel piano degli impulsi è la derivata dell'area del disco, $2\\pi p$; la sostituzione $\\varepsilon=p^2/2m$ ha $d\\varepsilon/dp=p/m$, e il jacobiano cancella esattamente il fattore $p$. Per questo in $d=2$ la densità dell'energia è l'esponenziale pura $\\beta e^{-\\beta\\varepsilon}$, senza prefattore, mentre in $d=3$ resta un $\\sqrt{\\varepsilon}$. Da quel solo fattore dipendono tutte le differenze qualitative fra i gas quantistici in dimensioni diverse."}},"controllo":[{"tipo":"integrale","espr":"2*r/R**2","var":"r","da":"0","a":"R","vale":"1","ipotesi":{"r":"positive","R":"positive"},"dove":"esempio","appare":"p(r)=2r/R^2"},{"tipo":"integrale","espr":"r*2*r/R**2","var":"r","da":"0","a":"R","vale":"2*R/3","ipotesi":{"r":"positive","R":"positive"},"dove":"esempio","appare":"2R/3"},{"tipo":"derivata","espr":"pi*p**2","rispetto":["p"],"vale":"2*pi*p","ipotesi":{"p":"positive"},"dove":"qui.meccanica-statistica.esempio","appare":"2\\pi p"},{"tipo":"derivata","espr":"p**2/(2*m)","rispetto":["p"],"vale":"p/m","ipotesi":{"p":"positive","m":"positive"},"dove":"qui.meccanica-statistica.esempio","appare":"p/m"},{"tipo":"integrale","espr":"b*exp(-b*e)","var":"e","da":"0","a":"oo","vale":"1","ipotesi":{"b":"positive","e":"positive"},"dove":"qui.meccanica-statistica.esempio","appare":"\\beta e^{-\\beta\\varepsilon}"}]};
STRUM["simmetrie"] = {"nome":"Simmetrie","riga":"L'insieme delle trasformazioni che lasciano identica la sorgente, e che perciò devono lasciare identico anche il campo che ne nasce.","serve":"È il ragionamento che decide la FORMA del campo prima di calcolarlo, e senza il quale la legge di Gauss non serve a niente: Gauss dà un solo numero — il flusso totale — e da un numero si ricava un campo soltanto se si sa già in che direzione punta e da quali variabili dipende. L'argomento ha una forma sola: se una trasformazione lascia identica la distribuzione di carica, lascia identico il campo; quindi ogni componente che quella trasformazione cambierebbe deve essere nulla, e ogni variabile che essa sposta non può comparire.","esempio":"Per un filo infinito uniformemente carico, la traslazione lungo il filo e la rotazione attorno a esso lasciano la carica identica: $\\mathbf E$ non può dipendere né da $z$ né dall'angolo. La riflessione nel piano perpendicolare al filo manderebbe $E_z$ in $-E_z$ lasciando uguale la sorgente, quindi $E_z=0$; resta la sola componente radiale $E_r(r)$. Solo a quel punto il cilindro coassiale è la superficie giusta, e Gauss dà $E_r\\cdot 2\\pi rL=\\dfrac{\\lambda L}{\\varepsilon_0}$, da cui $E_r=\\dfrac{\\lambda}{2\\pi\\varepsilon_0 r}$.","qui":{"meccanica-quantistica":{"serve":"Qui l'argomento di simmetria non decide la forma di un campo: decide la forma degli OPERATORI, ed è il modo in cui questo corso costruisce la teoria. Lo schema è lo stesso — una trasformazione che lascia identica la situazione fisica deve lasciare identica la descrizione — ma la conseguenza è più forte: ogni trasformazione di simmetria continua è realizzata da un operatore unitario, ogni operatore unitario continuo è l'esponenziale di un generatore autoaggiunto, e quel generatore è una quantità conservata. Impulso, momento angolare ed energia non si postulano: sono i generatori delle traslazioni, delle rotazioni e delle traslazioni temporali.","esempio":"Lo spazio è omogeneo, quindi traslare un sistema isolato non ne cambia la fisica: $\\hat U(a)=e^{-ia\\hat P/\\hbar}$ deve commutare con $\\hat H$. Al primo ordine in $a$ questo dà $[\\hat P,\\hat H]=0$, e quindi $\\dfrac{d}{dt}\\langle \\hat P\\rangle=0$: l'omogeneità dello spazio è la conservazione dell'impulso, e il passaggio da una all'altra è di due righe."}},"debito":"nessun nucleo del percorso tratta l'argomento di simmetria come strumento a sé: qui c'è la forma dell'argomento e non la sua giustificazione, che è di teoria dei gruppi e sta fuori dal percorso costruito finora. Quello che il percorso copre è il pezzo di destra — l'integrale di flusso, nel nucleo 03 tappa 04 — non il pezzo di sinistra che decide quale superficie scegliere.","controllo":[{"tipo":"uguale","sinistra":"(lam/(2*pi*e0*r))*2*pi*r*L","vale":"lam*L/e0","dove":"esempio","appare":"\\dfrac{\\lambda L}{\\varepsilon_0}"}]};
STRUM["commutatore"] = {"nome":"Commutatore","riga":"$[\\hat A,\\hat B]=\\hat A\\hat B-\\hat B\\hat A$, antisimmetrico, con la regola di Leibniz $[\\hat A,\\hat B\\hat C]=[\\hat A,\\hat B]\\hat C+\\hat B[\\hat A,\\hat C]$ e la relazione canonica $[\\hat x,\\hat p]=i\\hbar$.","serve":"E' la misura di quanto due operazioni dipendano dall'ordine, e qui l'ordine e' fisica: due osservabili che non commutano non hanno una base comune di autostati, quindi non si misurano insieme con precisione arbitraria. Quasi ogni conto che sembra magico — l'algebra del momento angolare, gli operatori di salita e discesa, il teorema di Ehrenfest — e' una manipolazione di commutatori fatta con quelle regole e nient'altro.","esempio":"Dalla regola di Leibniz, $[\\hat x,\\hat p^{2}]=[\\hat x,\\hat p]\\hat p+\\hat p[\\hat x,\\hat p]=2i\\hbar\\hat p$. E' il conto che fa uscire il teorema di Ehrenfest: la meccanica classica ricompare come relazione fra valori medi, e ricompare perche' quel commutatore vale proprio $2i\\hbar\\hat p$.","debito":"l'identita' di Jacobi si enuncia e non si dimostra; la corrispondenza fra commutatore e parentesi di Poisson — che e' l'idea di Dirac e non un'analogia decorativa — sta in mq-07, e li' va letta per intero.","controllo":[{"tipo":"uguale","sinistra":"I*hbar*p + p*I*hbar","vale":"2*I*hbar*p","ipotesi":{"hbar":"positive","p":"real"},"dove":"esempio","appare":"2i\\hbar\\hat p"},{"tipo":"simbolico","dove":"riga","appare":"[\\hat x,\\hat p]=i\\hbar","perche":"e' la relazione di commutazione canonica, il POSTULATO da cui discende il resto della teoria: non si dimostra, si assume, ed e' cio' che separa la meccanica quantistica dalla classica"}],"qui":{},"pieno":null};
STRUM["matrici-di-pauli"] = {"nome":"Matrici di Pauli","riga":"Sono le tre matrici $2\\times2$ hermitiane a traccia nulla il cui quadrato e' l'identita' e il cui commutatore riproduce l'algebra del momento angolare, da cui lo spin $\\hat S_i=\\tfrac{\\hbar}{2}\\sigma_i$.","serve":"Sono la rappresentazione piu' piccola non banale del momento angolare, e insieme all'identita' formano una base di tutte le matrici due per due hermitiane: qualunque osservabile di un sistema a due stati e' una combinazione dell'identita' e delle tre. Ogni conto di spin un mezzo — Stern-Gerlach, precessione, risonanza magnetica, qubit — si riduce alla loro algebra.","esempio":"Siccome il quadrato di una combinazione unitaria delle tre e' l'identita', qualunque esponenziale collassa: l'operatore di rotazione dello spinore diventa $\\cos(\\theta/2)$ per l'identita' meno $i\\sin(\\theta/2)$ per la combinazione. Il mezzo nell'angolo e' la ragione per cui una rotazione di un giro intero cambia segno allo stato, perche' $\\cos(\\pi)=-1$.","debito":"la costruzione generale delle rappresentazioni di SU(2) e il suo legame con SO(3) stanno nel movimento sul momento angolare; qui c'e' il caso di spin un mezzo con le sue regole di calcolo.","controllo":[{"tipo":"uguale","sinistra":"cos(2*pi/2)","vale":"-1","dove":"esempio","appare":"\\cos(\\pi)=-1"},{"tipo":"uguale","sinistra":"cos(pi/3)**2+sin(pi/3)**2","vale":"1","dove":"esempio","appare":"\\sin(\\theta/2)"}],"qui":{},"pieno":null};
STRUM["spazio-di-hilbert"] = {"nome":"Spazio di Hilbert","riga":"E' uno spazio vettoriale complesso con prodotto interno, completo nella norma che ne deriva e separabile, cosicche' ogni stato si scrive come somma numerabile $|\\psi\\rangle=\\sum_n c_n|n\\rangle$ con $c_n=\\langle n|\\psi\\rangle$.","serve":"E' la casa degli stati, e le tre parole della definizione fanno tre lavori diversi. Il prodotto interno da' le ampiezze, e quindi le probabilita'. La completezza garantisce che il limite di una successione di stati sia ancora uno stato: senza, uno sviluppo in serie potrebbe convergere fuori dallo spazio. La separabilita' permette di scrivere un vettore con una lista numerabile di coefficienti, cioe' di fare i conti.","esempio":"La relazione di completezza $\\sum_n|n\\rangle\\langle n|=\\hat 1$ e' lo strumento operativo piu' usato della teoria: infilata dentro un prodotto scalare lo spezza in una somma. La norma diventa $\\langle\\psi|\\psi\\rangle=\\sum_n|c_n|^{2}$, e se lo stato e' normalizzato quella somma vale uno: i moduli quadri dei coefficienti sono probabilita', e sommano a uno per costruzione.","debito":"la costruzione di $L^{2}$ come completamento, la misura di Lebesgue che serve a definirlo e il teorema di Riesz-Fischer stanno nei movimenti di Metodi; qui si usa il risultato.","controllo":[{"tipo":"somma","espr":"(1/2)**n","var":"n","da":"1","a":"oo","vale":"1","ipotesi":{"n":"positive-integer"},"dove":"esempio","appare":"sommano a uno"},{"tipo":"simbolico","dove":"esempio","appare":"\\sum_n|n\\rangle\\langle n|=\\hat 1","perche":"e' la relazione di completezza: i proiettori sugli elementi di una base ortonormale sommano all'identita'. E' la proprieta' che definisce una base completa, non un conto"}],"qui":{},"pieno":null};
STRUM["derivazione"] = {"nome":"Derivazione (regola di Leibniz)","riga":"Un operatore lineare $D$ su un'algebra che rispetta la regola del prodotto: $D(fg)=f\\,D(g)+g\\,D(f)$. È la proprietà che isola «derivare» fra tutti gli operatori lineari possibili.","serve":"È il modo algebrico di definire la derivata senza limiti, e serve ogni volta che si vuole derivare su un oggetto dove non c'è un rapporto incrementale da fare — su una varietà astratta, su un'algebra di matrici, su un anello di polinomi. La conseguenza operativa più usata è che **una derivazione è determinata dai suoi valori sui generatori**: su $\\mathbb{R}^{n}$ basta sapere quanto vale sulle coordinate $x^{1},\\dots,x^{n}$, e da lì Leibniz e la linearità danno tutto il resto. È il motivo per cui un vettore tangente, definito come derivazione, si scrive sempre come combinazione delle $\\partial/\\partial x^{i}$: non perché lo si sia scelto, ma perché non c'è altro. Un secondo fatto, che si dimostra in due righe e si usa continuamente: la **composizione** di due derivazioni non è una derivazione (compaiono derivate seconde), ma la loro **differenza incrociata** $DE-ED$ lo è, perché i termini secondi si cancellano a coppie.","esempio":"Su $\\mathbb{R}$, l'operatore $d/dx$ verificato sul prodotto $f=x^{2}$ e $g=x^{3}$: la regola dice $x^{2}\\cdot3x^{2}+x^{3}\\cdot2x$, cioè $5x^{4}$, e la derivata diretta di $x^{5}$ dà lo stesso $5x^{4}$. Il conto è banale ed è il punto: Leibniz non aggiunge informazione su $\\mathbb{R}$, dove la derivata si sa già fare. Aggiunge informazione quando è l'unica cosa che si ha — per esempio sull'algebra delle matrici, dove $D(A)=MA-AM$ per una matrice fissata $M$ è una derivazione, e la verifica di Leibniz consiste nello sviluppare $M(AB)-(AB)M$ e riconoscerlo come somma di $A\\,D(B)$ e $D(A)\\,B$, cosa che riesce perché i due termini $AMB$ introdotti dallo sviluppo compaiono con segni opposti e si cancellano.","debito":"che le derivazioni in un punto di una varietà siano esattamente i vettori tangenti è il teorema di gd-06 e non si ripete qui; il caso delle algebre non commutative è citato come esempio e non sviluppato.","controllo":[{"tipo":"uguale","sinistra":"x**2*3*x**2+x**3*2*x","vale":"5*x**4","ipotesi":{"x":"real"},"dove":"esempio","appare":"5x^{4}"},{"tipo":"derivata","espr":"x**5","rispetto":["x"],"vale":"5*x**4","ipotesi":{"x":"real"},"dove":"esempio","appare":"derivata diretta di $x^{5}$"}]};
STRUM["spettro"] = {"nome":"Spettro di un operatore","riga":"Lo spettro di un operatore e' l'insieme dei possibili esiti di una misura: i suoi autovalori. Puo' essere discreto (autovalori separati, autovettori in $\\mathcal H$), continuo (autovalori che riempiono un intervallo, autovettori non normalizzabili), o misto.","serve":"E' la quantita' che la fisica chiede davvero: scrivere l'hamiltoniana e trovarne lo spettro E' il problema d'esame. La distinzione discreto/continuo non e' tecnica — decide se un autostato e' uno stato preparabile (discreto) o una distribuzione che vive fuori dallo spazio di Hilbert (continuo), come l'onda piana e la delta.","esempio":"Per $\\sigma_z$ di Pauli lo spettro e' $\\{+1,-1\\}$, discreto; la somma dei due autovalori, cioe' la traccia, e' $1+(-1)=0$. Per l'operatore posizione lo spettro e' tutta la retta reale, continuo.","debito":"la costruzione rigorosa dello spettro continuo (teorema spettrale generalizzato, misura spettrale $E(\\lambda)$ di von Neumann) sta fuori da questo percorso: qui si dichiara che esiste e si lavora coi casi concreti. La separazione fra spettro continuo e spettro residuo non si tratta.","controllo":[{"tipo":"uguale","sinistra":"1+(-1)","vale":"0","dove":"esempio","appare":"1+(-1)=0"}],"qui":{},"pieno":null};
STRUM["trasformata-di-fourier"] = {"nome":"Trasformata di Fourier","riga":"L'operazione $\\hat f(k)=\\int f(x)\\,e^{-ikx}\\,dx$, che riscrive una funzione come sovrapposizione di onde piane e manda la derivata in una moltiplicazione per $ik$.","serve":"È lo strumento che rende ALGEBRICA un'equazione differenziale lineare a coefficienti costanti: con $\\partial_x$ che diventa $ik$, un'equazione differenziale in $x$ diventa un'equazione algebrica in $k$, si risolve, e si antitrasforma. Le due cose da non perdere sono la convenzione dei $2\\pi$, che cambia da testo a testo e va dichiarata una volta, e Plancherel, che dice che la trasformata conserva la norma $L^{2}$ — in fisica, l'energia.","esempio":"La gaussiana $f(x)=e^{-x^{2}/2}$ ha trasformata $\\int_{-\\infty}^{+\\infty}e^{-x^{2}/2}e^{-ikx}\\,dx=\\sqrt{2\\pi}\\,e^{-k^{2}/2}$: ancora una gaussiana, tanto più larga quanto l'originale è stretta. È il caso in cui si vede meglio il principio di indeterminazione come fatto puramente matematico.","pieno":{"file":"15-distribuzioni.html","tappa":"02","come":"le proprietà, la derivata che diventa un prodotto e Plancherel, nel nucleo delle distribuzioni"},"qui":{"elettromagnetismo":{"serve":"Serve appena si scrive un'onda generica invece di una monocromatica: ogni soluzione delle equazioni di Maxwell nel vuoto è una sovrapposizione di onde piane $e^{i(\\mathbf k\\cdot\\mathbf x-\\omega t)}$, e la trasformata è il modo di scomporla. Su ciascuna componente l'equazione delle onde si riduce alla relazione di dispersione, e la propagazione diventa un far girare fasi: ogni modo viaggia da solo, e nel vuoto tutti alla stessa velocità — per questo un impulso non si deforma.","esempio":"La sostituzione $\\partial_x\\to ik$ e $\\partial_t\\to-i\\omega$ manda le derivate seconde in $(ik)^{2}=-k^{2}$ e $(-i\\omega)^{2}=-\\omega^{2}$: l'equazione delle onde diventa $\\omega^{2}=c^{2}k^{2}$, cioè un'equazione di secondo grado al posto di una differenziale, e la sua radice positiva $\\omega=ck$ è la relazione di dispersione del vuoto."}},"controllo":[{"tipo":"integrale","espr":"exp(-x**2/2)*exp(-I*k*x)","var":"x","da":"-oo","a":"oo","vale":"sqrt(2*pi)*exp(-k**2/2)","ipotesi":{"k":"real"},"dove":"esempio","appare":"\\sqrt{2\\pi}\\,e^{-k^{2}/2}"},{"tipo":"uguale","sinistra":"(I*k)**2","vale":"-k**2","ipotesi":{"k":"real"},"dove":"qui.elettromagnetismo.esempio","appare":"-k^{2}"},{"tipo":"uguale","sinistra":"(-I*w)**2","vale":"-w**2","ipotesi":{"w":"real"},"dove":"qui.elettromagnetismo.esempio","appare":"-\\omega^{2}"},{"tipo":"uguale","sinistra":"(c*k)**2","vale":"c**2*k**2","dove":"qui.elettromagnetismo.esempio","appare":"c^{2}k^{2}"}]};

function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';
  return h;
}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

/* ---------------- 00 · DI COSA PARLA QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Di cosa parla questo movimento', meta:'Meccanica Quantistica · voci Q.12 e Q.13 · i due teoremi dimostrati · il segmento e la buca fino al numero · uno stato legato che lo schema non prevede',
  blocchi:[
  {t:'prosa', title:'La domanda, e perché la risposta non è un conto', tag:'architettura', html:R`
  <p>Una particella libera ha energia qualunque, e lo spettro è continuo. Chiudila fra due pareti e le energie possibili diventano una successione discreta. La domanda di questo movimento è <i>perché</i>, e la risposta che i manuali danno — «si impongono le condizioni al contorno e vengono fuori i numeri interi» — è vera e insufficiente: dice <i>come</i> si ottiene la quantizzazione in un caso particolare, non perché il confinamento la produca sempre, né quanti livelli ci siano, né perché nessuno di essi sia degenere.</p>
  <p>Il programma di questo corso chiede le due cose insieme, e le chiede per nome: <i>«Particella su un segmento. Buca rettangolare di potenziale, spettro discreto e spettro continuo. Teorema di non degenerazione»</i> e <i>«Proprietà generali delle soluzioni dell&rsquo;equazione di Schrödinger unidimensionale. Quantizzazione dei livelli energetici»</i>. I due <b>teoremi</b> — quello di degenerazione e quello di non degenerazione — non sono corollari dei due esercizi: sono ciò che spiega gli esercizi, e sono materia d&rsquo;orale. Qui si dimostrano.</p>
  <p>L&rsquo;ordine del movimento è quindi rovesciato rispetto a quello di un libro di testo. <b>Prima si stabilisce tutto ciò che si può dire senza risolvere niente</b>: la condizione di raccordo nei punti di discontinuità del potenziale, il fatto che le autofunzioni si possano prendere reali e a parità definita, il teorema algebrico che spiega <i>quando</i> un&rsquo;osservabile deve essere degenere, la lettura del segno della curvatura, il meccanismo per cui solo valori isolati di $E$ danno una soluzione accettabile, il teorema di oscillazione sui nodi, il teorema di non degenerazione con la sua dimostrazione, e lo schema che lega il tipo di spettro soltanto al tipo di regione lontano dall&rsquo;origine. <b>Poi</b> si risolvono i due casi del programma, e si vede che non c&rsquo;è niente da scoprire: si ritrova ciò che i teoremi avevano già imposto.</p>`},
  {t:'prosa', title:'Come è fatto il movimento', tag:'architettura', html:R`
  <p>La tappa 01 ricava le condizioni di raccordo integrando l&rsquo;equazione attraverso il salto del potenziale, e trova il caso eccezionale — la barriera infinita — in cui la derivata <i>non</i> è continua. La 02 dimostra le tre riduzioni che rendono il problema reale e simmetrico: $E$ reale, $\psi$ reale, parità definita, con l&rsquo;operatore di inversione spaziale costruito per intero. La 03 dimostra il teorema di degenerazione in forma algebrica e ne dà un modello minimo $2\times2$ che si può verificare a mano. La 04 è la lettura della curvatura: regioni di tipo I e II, flessi, zeri semplici. La 05 mostra perché $E>V_{\rm min}$, per due strade indipendenti, e perché lo spettro è discreto, con il problema di tiro. La 06 è il teorema di oscillazione e il conteggio dei nodi. La 07 è il teorema di non degenerazione, dimostrato col wronskiano, con l&rsquo;affinamento che lo rende utile anche per lo spettro continuo. La 08 è lo schema completo. La 09 risolve la particella su un segmento fino all&rsquo;ultimo coefficiente di Fourier e a un numero in elettronvolt. La 10 risolve la buca di profondità finita fino ai cinque livelli di un caso numerico, confrontando due convenzioni che sembrano diverse e non lo sono. La 11 esibisce uno stato legato che lo schema della 08 non prevede. La 12 tira il bilancio.</p>
  <p><b>Che cosa questo movimento non fa.</b> Non calcola coefficienti di riflessione e trasmissione, e non tratta l&rsquo;effetto tunnel: lì il problema è il moto <i>non</i> confinato in presenza di un ostacolo, l&rsquo;energia è sopra la barriera o la attraversa, e la domanda non è «quali energie sono permesse» ma «quale frazione passa». Non usa l&rsquo;approssimazione semiclassica né il metodo variazionale, che il programma esclude per nome. E non tratta l&rsquo;oscillatore armonico, che è l&rsquo;unico potenziale confinante risolubile per via algebrica e merita il suo posto: qui compare solo una volta, come caso in cui lo spettro è discreto per la ragione generale della tappa 05.</p>`}
]},

/* ---------------- 01 · LE CONDIZIONI DI RACCORDO ---------------- */
{ num:'01', title:'Le condizioni di raccordo: perché la derivata è continua, e il caso in cui non lo è', meta:'un potenziale discontinuo è un limite di potenziali continui · psi e psi-primo sopravvivono al limite · psi-secondo no · la barriera infinita come eccezione',
  blocchi:[
  {t:'prosa', title:'Il problema: un gradino non è un potenziale, è una schematizzazione', tag:'costruzione', html:R`
  <p>Tutti i problemi di questo movimento hanno un potenziale costante a tratti, con salti. È una comodità di calcolo, e Picasso insiste sul fatto che sia proprio quello: <i>«in diverse situazioni fisicamente interessanti può capitare di avere a che fare con potenziali $V(x)$ che in un intervallo molto piccolo (di ampiezza $\varepsilon$) passano da un valore $V_1$ ad un altro valore $V_2$»</i> — l&rsquo;elettrone vicino alla superficie di un metallo, dove il potenziale sale dell&rsquo;energia di estrazione nello spazio di pochi ångström. Il gradino vero e proprio si ottiene prendendo $\varepsilon\to0$.</p>
  <p>Ma un&rsquo;equazione differenziale del secondo ordine con un coefficiente discontinuo non ha soluzioni nel senso ordinario, e bisogna decidere che cosa si richiede a $\psi$ nel punto del salto. <b>La domanda non è matematicamente oziosa</b>, perché la risposta cambia il conto: se si richiede la continuità di $\psi$ e di $\psi'$ si ottengono due condizioni per ogni punto di raccordo, se si richiede solo quella di $\psi$ se ne ottiene una. Picasso dichiara la strada che <i>non</i> prende — <i>«questo problema può essere affrontato da un punto di vista matematico andando a studiare il dominio... che permette una definizione di $H$ come operatore autoaggiunto»</i>, e quello è il mestiere dello <span class="str" data-str="operatore-aggiunto">operatore aggiunto</span> — e prende quella fisica: si guarda <i>quali proprietà di continuità sopravvivono nel passaggio al limite</i>.</p>`},
  {t:'reveal', title:'Il conto, in tre righe, e cosa dice', tag:'costruzione', steps:[
   {label:'Integrare l’equazione attraverso il salto', body:R`
   <p>L&rsquo;equazione di Schrödinger stazionaria, scritta nella forma in cui la derivata seconda è isolata, è</p>
   $$\psi''(x)=\frac{2m}{\hbar^{2}}\big(V(x)-E\big)\psi(x).$$
   <p>Si integri fra $x=0$ e $x=\varepsilon$, cioè attraverso la regione in cui il potenziale sale:</p>
   $$\psi'(\varepsilon)-\psi'(0)=\frac{2m}{\hbar^{2}}\int_{0}^{\varepsilon}\big(V(x)-E\big)\psi(x)\,dx.$$
   <p>Tutto il contenuto sta nella stima del membro di destra. <b>Finché $V$ e $\psi$ restano limitati nell&rsquo;intervallo</b>, l&rsquo;integrale è l&rsquo;integrale di una funzione limitata su un intervallo di lunghezza $\varepsilon$, dunque è $O(\varepsilon)$ e tende a zero. Lo si vede su un modello esplicito: se il potenziale sale linearmente, $V(x)=V_{0}x/\varepsilon$, e $\psi$ vale approssimativamente la costante $\psi(0)$ sull&rsquo;intervallino,</p>
   $$\int_{0}^{\varepsilon}\Big(\frac{V_{0}x}{\varepsilon}-E\Big)dx=\frac{V_{0}\varepsilon}{2}-E\varepsilon,$$
   <p>e questa quantità svanisce nel limite:</p>
   $$\lim_{\varepsilon\to0}\Big(\frac{V_{0}\varepsilon}{2}-E\varepsilon\Big)=0.$$`},
   {label:'Le due conclusioni, e la terza che non vale', body:R`
   <p>Dunque $\psi'(\varepsilon)\to\psi'(0)$: <b>la derivata prima resta continua</b> nel limite di gradino. Lo stesso argomento, integrato una volta di più, dà la continuità di $\psi$ — che del resto è già garantita dal fatto che $\psi'$ è limitata. Quindi, per un salto <i>finito</i> del potenziale:</p>
   $$\psi\ \text{continua},\qquad \psi'\ \text{continua}.$$
   <p>Ciò che <b>non</b> sopravvive è la derivata seconda, e lo dice l&rsquo;equazione stessa: $\psi''$ è proporzionale a $(V-E)\psi$, e se $V$ salta e $\psi$ non si annulla là, allora $\psi''$ salta. Picasso lo scrive come limite a due facce,</p>
   $$\lim_{x\to0^{-}}\psi''(x)\neq\lim_{x\to0^{+}}\psi''(x),$$
   <p>e vale la pena fissare bene chi salta e chi no, perché è un errore d&rsquo;esame frequente: <i>si raccordano due quantità, $\psi$ e $\psi'$, e non tre</i>. La derivata seconda non è una condizione da imporre, è una conseguenza da accettare.</p>`},
   {label:'L’eccezione: una barriera infinita', body:R`
   <p>L&rsquo;argomento usava l&rsquo;ipotesi che $V$ fosse <b>limitato</b> nell&rsquo;intervallino. Se $V_{0}=\infty$ l&rsquo;ipotesi cade, l&rsquo;integrale non è più $O(\varepsilon)$, e la conclusione sulla derivata si perde: resta la continuità di $\psi$, non quella di $\psi'$. Questa non è una patologia da evitare, è esattamente la situazione della particella su un segmento, e si vede sul risultato: l&rsquo;autofunzione fondamentale del segmento $(0,a)$, che la tappa 09 ricava, è $\psi_1(x)=\sqrt{2/a}\,\sin(\pi x/a)$ all&rsquo;interno e zero all&rsquo;esterno. Fuori la derivata è nulla; dentro, in $x=0$, vale</p>
   $$\psi_1'(0^{+})=\frac{\pi}{a}\sqrt{\frac{2}{a}},$$
   <p>che non è zero per nessun $a$ finito. <b>La derivata salta, e deve saltare</b>: una funzione che si annulla identicamente da un lato e si stacca dall&rsquo;asse con pendenza non nulla dall&rsquo;altro è l&rsquo;unico modo di confinare esattamente una particella. Griffiths, nel paragrafo sul segmento, annuncia la regola e rimanda la dimostrazione — <i>«ordinarily, both $\psi$ and $d\psi/dx$ are continuous, but where the potential goes to infinity only the first of these applies... for now I hope you will trust me»</i>. Il conto che giustifica quella fiducia è quello appena fatto, ed è di Picasso.</p>`}
  ]},
  {t:'plot', title:'Il gradino come limite, e dove si perde la derivata',
   intro:R`<p>A sinistra: tre potenziali continui $V(x)=V_{0}/(1+e^{-x/\varepsilon})$ con $\varepsilon$ via via più piccolo. Il gradino non è un oggetto a sé: è ciò verso cui questa famiglia converge. A destra: la funzione d&rsquo;onda fondamentale del segmento, prolungata con lo zero fuori dalla buca, nel punto in cui la derivata salta.</p>`,
   plots:[{kind:'func2d', xr:[-2,2], yr:[-0.1,1.2], height:260, ticks:true,
     title:'V(x)/V0 per tre valori di epsilon',
     curves:[{f:'1/(1+Math.exp(-x/0.5))', col:'#5aa9ff', width:2.2, label:'epsilon = 0.5'},
             {f:'1/(1+Math.exp(-x/0.15))', col:'#9b8cff', width:2.2, label:'epsilon = 0.15'},
             {f:'1/(1+Math.exp(-x/0.02))', col:'#ff6b8a', width:2.4, label:'epsilon = 0.02 (quasi un gradino)'}],
     xlabel:'x', ylabel:'V / V0'},
    {kind:'func2d', xr:[-0.4,1.4], yr:[-0.2,1.6], height:260, ticks:true,
     title:'psi_1 del segmento (a=1), prolungata con zero',
     curves:[{f:'(x>0 && x<1)?Math.sqrt(2)*Math.sin(Math.PI*x):0', col:'#5aa9ff', width:2.6, label:'psi_1(x)'},
             {f:'(x>0 && x<0.25)?(Math.PI*Math.sqrt(2)*x):((x>-0.25&&x<=0)?0:0/0)', col:'#ffb86b', width:1.8, label:'tangente in x=0+, pendenza pi*sqrt(2)'}],
     xlabel:'x', ylabel:'psi_1'}],
   leggi:R`<p><b>Che cosa guardare.</b> Nel riquadro di sinistra le tre curve hanno tutte lo stesso valore iniziale e finale e differiscono solo per la larghezza della salita: l&rsquo;area sotto $(V-E)\psi$ nella zona di transizione si stringe come $\varepsilon$, e per questo nel limite il salto di $\psi'$ si annulla. Nel riquadro di destra, la curva arancione è la tangente a $\psi_1$ in $x=0^{+}$: ha pendenza $\pi\sqrt2\approx4{,}44$, mentre a sinistra di zero la funzione è piatta.</p>
   <p><b>Che cosa impararne.</b> La continuità di $\psi'$ non è un postulato sulla regolarità delle funzioni d&rsquo;onda: è un <i>teorema condizionato</i>, e la condizione è che il potenziale sia limitato. Dove la condizione cade — e cade solo nel caso idealizzato della parete impenetrabile — la conclusione cade con lei, e il salto della derivata che si vede a destra è la firma di quel limite idealizzato, non un errore. <b>Questo è il motivo per cui nella buca di profondità finita, nella tappa 10, si impongono DUE condizioni per ogni parete, e nel segmento, nella tappa 09, se ne impone UNA.</b></p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Se il potenziale contiene una delta di Dirac, $V(x)=-\alpha\,\delta(x)$, quali delle due condizioni di raccordo sopravvive?`,
    a:R`Sopravvive la continuità di $\psi$, <b>non</b> quella di $\psi'$ — e il salto della derivata si calcola con lo stesso integrale di questa tappa, che ora però <i>non</i> tende a zero: $\int_{-\varepsilon}^{+\varepsilon}(-\alpha\delta(x))\psi(x)dx=-\alpha\psi(0)$ indipendentemente da $\varepsilon$. Quindi $\psi'(0^{+})-\psi'(0^{-})=-\dfrac{2m\alpha}{\hbar^{2}}\psi(0)$. È lo stesso meccanismo della barriera infinita: la delta non è limitata, l&rsquo;ipotesi del teorema cade, e il salto resta. <i>La lezione generale è che la condizione di raccordo si ricava, non si ricorda</i>: si integra l&rsquo;equazione attraverso la singolarità e si guarda quanto resta.`},
   {q:R`Nel segmento, $\psi$ è continua in $x=0$ ma $\psi'$ salta. L&rsquo;equazione di Schrödinger è dunque violata in quel punto?`,
    a:R`No, ed è il punto delicato: l&rsquo;equazione <b>non è imposta</b> nel punto di discontinuità infinita, perché lì non ha senso — $V$ non è una funzione a valori finiti. La si impone separatamente in ciascuna regione dove $V$ è finito, e nel punto di confine si impongono le condizioni di raccordo che sopravvivono al limite. Detto in modo operativo: il problema del segmento non è «risolvere l&rsquo;equazione su tutto $\mathbb R$», è «risolverla su $(0,a)$ con $\psi(0)=\psi(a)=0$», e Picasso lo dichiara come regola generale — quelle condizioni <i>«vanno imposte tutte le volte che si vogliono trovare autofunzioni di $H$ quando $V_0=\infty$ per $|x|>a$, <b>e qualunque sia la forma di $V(x)$</b> per $|x|<a$»</i>. La parete infinita non è un pezzo del problema: è la sua frontiera.`}
  ]}
]},

/* ---------------- 02 · REALI E A PARITA' DEFINITA ---------------- */
{ num:'02', title:'Tre riduzioni gratuite: energia reale, autofunzioni reali, parità definita', meta:'perché si può lavorare in campo reale · l operatore di inversione spaziale costruito per intero · parità come autovalore · la completezza di pari e dispari',
  blocchi:[
  {t:'prosa', title:'Perché conviene spendere una tappa su questo', tag:'costruzione', html:R`
  <p>Prima di risolvere qualunque cosa conviene ridurre lo spazio in cui si cerca. Le tre riduzioni di questa tappa sono quelle che Griffiths mette, non per caso, come <i>primo problema</i> del capitolo: <i>«Prove the following three theorems: (a) for normalizable solutions, the separation constant $E$ must be real; (b) the time-independent wave function $\psi(x)$ can always be taken to be real; (c) if $V(x)$ is an even function then $\psi(x)$ can always be taken to be either even or odd»</i>. Sono tre, e insieme dicono che il problema unidimensionale si può sempre impostare <b>in campo reale e in uno dei due settori di parità</b>, cioè con metà delle incognite.</p>
  <p>La seconda riduzione ha un argomento di due righe. L&rsquo;equazione $\psi''=\frac{2m}{\hbar^{2}}(V-E)\psi$ ha coefficienti reali quando $V$ ed $E$ sono reali; dunque se $\psi$ è soluzione lo è anche $\psi^{*}$, e con essa lo sono le due combinazioni reali $\psi+\psi^{*}$ e $i(\psi-\psi^{*})$, cioè $2\,\mathrm{Re}\,\psi$ e $-2\,\mathrm{Im}\,\psi$. Picasso ne trae la conseguenza operativa: <i>«possiamo limitarci a considerare soltanto soluzioni reali»</i>, e la userà senza più dirlo in tutto il capitolo — per esempio quando scriverà l&rsquo;ortogonalità di due autofunzioni come l&rsquo;annullarsi dell&rsquo;integrale del loro prodotto, senza coniugati, annotando fra parentesi <i>«non abbiamo scritto $\psi_1^{*}(x)$ perché sappiamo che possiamo considerare funzioni d&rsquo;onda reali»</i>. <b>Attenzione a cosa questo NON dice</b>: non dice che ogni soluzione sia reale — $e^{ikx}$ non lo è — dice che si può <i>scegliere</i> una base reale per ciascun autospazio.</p>`},
  {t:'reveal', title:'La terza riduzione fatta per bene: l’operatore di inversione spaziale', tag:'costruzione', steps:[
   {label:'Due definizioni equivalenti, e quale si prende', body:R`
   <p>La parità si può introdurre in due modi, e la differenza non è stilistica. <b>Primo modo</b>: la trasformazione $q\mapsto-q$, $p\mapsto-p$ è canonica, dunque per il teorema di von Neumann esiste un <span class="str" data-str="operatore-unitario">operatore unitario</span> $I$ che la implementa: coniugando con $I$, la coordinata diventa $-q$ e l&rsquo;impulso $-p$. <b>Secondo modo</b>: si definisce $I$ dalla sua azione sugli stati,</p>
   $$I\psi(x)=\psi(-x),$$
   <p>e si dimostrano le proprietà. Picasso prende il secondo — <i>«seguiremo questa seconda possibilità»</i> — e la scelta ha un motivo didattico preciso: così $I$ è un oggetto che si manipola, non un oggetto che esiste per un teorema.</p>`},
   {label:'Le proprietà, dimostrate', body:R`
   <p><b>1. Applicato due volte, $I$ è l&rsquo;identità</b>: $\mathbb 1=I^{2}$, perché applicando due volte $x\mapsto-x$ si torna a $x$. Immediato, e porta tutto il resto.</p>
   <p><b>2. $I$ è autoaggiunto</b>, cioè $\langle A|I|B\rangle=\langle B|I|A\rangle^{*}$. La dimostrazione è un <span class="str" data-str="cambio-di-variabile">cambio di variabile</span>: nell&rsquo;integrale $\int\psi_A^{*}(x)\psi_B(-x)\,dx$ si pone $x\to-x$, il che scambia i limiti e cambia il segno del differenziale due volte, lasciando $\int\psi_A^{*}(-x)\psi_B(x)\,dx$; e quest&rsquo;ultimo è il complesso coniugato di $\int\psi_B^{*}(x)\psi_A(-x)dx$, cioè di $\langle B|I|A\rangle$.</p>
   <p><b>3. $I$ è unitario</b>, perché da 1 e 2 segue $I^{\dagger}=I=I^{-1}$. È un caso raro e comodo: un operatore che è contemporaneamente osservabile e trasformazione di <span class="str" data-str="simmetrie">simmetria</span>.</p>
   <p><b>4. I suoi autovalori sono $\pm1$</b>. Da $I\psi_\omega=\omega\psi_\omega$, applicando $I$ ancora una volta e usando che $\mathbb 1=I^{2}$, si ha $\psi_\omega=\omega^{2}\psi_\omega$, dunque $\omega^{2}=1$.</p>
   <p><b>5. Le autofunzioni sono le funzioni pari ($\omega=+1$) e dispari ($\omega=-1$)</b>, per la definizione stessa: $\psi(-x)=\pm\psi(x)$. <i>La parità di una funzione è l&rsquo;autovalore di un&rsquo;osservabile</i>, non una proprietà grafica.</p>
   <p><b>6. Le autofunzioni di $I$ sono complete</b>, e la dimostrazione è un&rsquo;identità che si verifica a vista:</p>
   $$\tfrac12\big(\psi(x)+\psi(-x)\big)+\tfrac12\big(\psi(x)-\psi(-x)\big)=\psi(x),$$
   <p>dove il primo addendo è pari e il secondo dispari. Ogni funzione è somma di una funzione pari e di una dispari, in un unico modo.</p>
   <p><b>7. $I$ anticommuta con $q$ e con $p$</b>: coniugando con $I$, la coordinata $q$ diventa $-q$ e l&rsquo;impulso $p$ diventa $-p$ — cioè $Iq$ e $qI$ differiscono per un segno, e lo stesso vale per $Ip$ e $pI$. <b>Per la coordinata</b>: applicare $Iq$ a un vettore dà, in rappresentazione di Schrödinger, la funzione $-x\psi_A(-x)$, mentre applicare $qI$ dà $+x\psi_A(-x)$. <b>Per l&rsquo;impulso</b>, con $\psi'=d\psi/dx$: applicare $Ip$ produce $-i\hbar\psi_A'(-x)$, perché prima si deriva e poi si riflette; applicare $pI$ produce $+i\hbar\psi_A'(-x)$, perché derivando la funzione già riflessa compare un segno in più dalla regola della catena. <i>È lo scambio d&rsquo;ordine a generare il segno</i>, e qui sta tutto il contenuto della proprietà.</p>`},
   {label:'Quando I commuta con H, e quanto vale questo', body:R`
   <p>Dalle due anticommutazioni segue subito che $I$ commuta con $p^{2}$, perché i due segni meno si elidono:</p>
   $$I\frac{p^{2}}{2m}I^{-1}=\frac{1}{2m}(IpI^{-1})(IpI^{-1})=\frac{(-p)(-p)}{2m}=\frac{p^{2}}{2m}.$$
   <p>Più in generale, coniugare con $I$ una qualunque funzione $f(q,p)$ la manda in $f(-q,-p)$, dunque <b>$I$ commuta con ogni hamiltoniana $H=p^{2}/2m+V(q)$ purché $V$ sia pari</b>. Lì, e solo lì, $H$ e $I$ hanno un insieme completo di autofunzioni simultanee, e la terza riduzione di Griffiths è giustificata.</p>
   <p>Landau ottiene la stessa conclusione <b>senza costruire nessun operatore</b>, e vale confrontare le due vie perché la differenza è istruttiva. Il suo argomento: se $V(x)=V(-x)$ l&rsquo;equazione è invariante per $x\to-x$, dunque $\psi(-x)$ è soluzione con la stessa energia, dunque <i>«coincidente a meno di un fattore costante con $\psi(x)$: $\psi(-x)=C\psi(x)$»</i>; cambiando ancora segno, $\psi(x)=C^{2}\psi(x)$, da cui $C=\pm1$. Tre righe e nessun formalismo. <b>Ma c&rsquo;è un prezzo, e Landau lo paga in una nota in calce</b>: quel passaggio usa che $\psi(-x)$ sia proporzionale a $\psi(x)$, cioè che il livello sia <i>non degenere</i> — <i>«in queste considerazioni si suppone che lo stato stazionario sia non degenere... in caso contrario, nel cambiamento di segno delle $x$ le due funzioni d&rsquo;onda relative ad uno stesso livello energetico potrebbero trasformarsi tra di loro»</i>. La via di Picasso, con $I$ come operatore e la completezza delle sue autofunzioni (proprietà 6), <b>non ha bisogno di quell&rsquo;ipotesi</b>: anche in un autospazio degenere si può sempre scegliere una base a parità definita. <i>Lo stesso risultato, con ipotesi diverse, e la differenza decide quale si può usare nella tappa 07 e quale no.</i></p>`}
  ]},
  {t:'reveal', title:'Il caso libero, come banco di prova', tag:'costruzione', steps:[
   {label:'Le autofunzioni simultanee di H e di I', body:R`
   <p>Per $V=0$ l&rsquo;hamiltoniana è $H=p^{2}/2m$ e le soluzioni a energia $E=\hbar^{2}k^{2}/2m$ sono le combinazioni di $e^{\pm ikx}$. Quali di queste sono anche autofunzioni di $I$? Le combinazioni simmetriche e antisimmetriche, cioè il coseno e il seno. Il coseno risolve l&rsquo;equazione:</p>
   $$-\frac{\hbar^{2}}{2m}\frac{d^{2}}{dx^{2}}\cos(kx)=\frac{\hbar^{2}k^{2}}{2m}\cos(kx),$$
   <p>ed è pari, dunque è autofunzione simultanea con $\omega=+1$; il seno fa lo stesso con $\omega=-1$. <b>Ma nessuna delle due è autofunzione di $p$</b>, e qui si vede la tensione che la tappa seguente trasformerà in teorema.</p>`},
   {label:'L’impulso scambia i due settori di parità', body:R`
   <p>Si applichi $p=-i\hbar\,d/dx$ al coseno:</p>
   $$-i\hbar\frac{d}{dx}\cos(kx)=i\hbar k\sin(kx).$$
   <p>Il risultato è, a meno di un fattore, <i>il seno</i>: l&rsquo;impulso porta l&rsquo;autofunzione pari in quella dispari. Siccome $p$ commuta con $H$, le due stanno alla stessa energia — e siccome sono indipendenti, quell&rsquo;energia è degenere almeno due volte. <b>Questo è il meccanismo</b>, e la tappa 03 lo riconoscerà come un caso particolare di un enunciato che non menziona né il coseno né l&rsquo;impulso.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Un potenziale è pari. Segue che ogni autofunzione dell&rsquo;energia è pari o dispari?`,
    a:R`<b>No</b>, e confondere le due cose è l&rsquo;errore che Landau isola nella sua nota in calce. Ciò che segue è che <i>si può scegliere</i> una base di autofunzioni a parità definita in ogni autospazio. Se un livello è degenere, una generica autofunzione di quell&rsquo;autospazio non ha parità definita: per la particella libera, $e^{ikx}$ è autofunzione dell&rsquo;energia in un potenziale pari ($V=0$) e non è né pari né dispari. L&rsquo;enunciato diventa «ogni autofunzione ha parità definita» <i>soltanto</i> quando il livello è non degenere — e quello, per lo spettro discreto unidimensionale, è il teorema della tappa 07. <i>L&rsquo;ordine logico conta: prima la non degenerazione, poi la parità obbligata.</i>`},
   {q:R`Si è detto che $I$ è autoaggiunto e unitario insieme. Che altro operatore di questo corso ha la stessa doppia natura, e perché è rilevante?`,
    a:R`Ogni operatore $A$ che sia un&rsquo;involuzione autoaggiunta, cioè con $\mathbb 1=A^{2}$ e con $A$ uguale al proprio aggiunto: sono le riflessioni e, più in generale, le simmetrie di ordine due. La rilevanza è pratica: <b>un operatore unitario può essere usato come trasformazione, un operatore autoaggiunto come osservabile misurabile</b>, e $I$ è entrambi — il che significa che la parità è una quantità conservata <i>e</i> un numero che si può misurare, con due soli esiti possibili. Un operatore unitario generico, come $e^{-iHt/\hbar}$, non è un&rsquo;osservabile; un&rsquo;osservabile generica, come $q$, non genera una trasformazione di simmetria del sistema. La coincidenza dei due ruoli è la ragione per cui la parità compare sia nelle regole di selezione (dove serve la conservazione) sia come etichetta dei livelli (dove serve l&rsquo;autovalore).`}
  ]}
]},

/* ---------------- 03 · IL TEOREMA DI DEGENERAZIONE ---------------- */
{ num:'03', title:'Il teorema di degenerazione: tre commutatori, e perché un livello DEVE essere degenere', meta:'l enunciato algebrico e la dimostrazione in tre righe · un modello minimo 2x2 verificabile a mano · il caso libero ritrovato per due strade',
  blocchi:[
  {t:'prosa', title:'Il problema: dire qualcosa sulla degenerazione senza conoscere lo spettro', tag:'costruzione', html:R`
  <p>Nella maggior parte dei problemi reali gli autovalori di un&rsquo;osservabile non si sanno calcolare. Picasso apre il paragrafo dichiarando che è questa la situazione normale, e che esistono comunque argomenti generali: <i>«in molti casi non è possibile determinare gli autovalori di un&rsquo;osservabile; ciò nonostante esistono argomenti generali che permettono di ottenere informazioni sul grado di degenerazione degli autovalori dell&rsquo;osservabile in questione»</i>, e annuncia dove li userà — <i>«avremo più volte l&rsquo;occasione di apprezzare l&rsquo;importanza di queste informazioni quando applicheremo la teoria svolta allo studio della struttura atomica e alla spettroscopia atomica»</i>. Il teorema che segue non costa niente da dimostrare ed è ciò che, in un atomo, dice <i>a priori</i> quanti stati stanno in un livello.</p>`},
  {t:'reveal', title:'Enunciato e dimostrazione', tag:'costruzione', steps:[
   {label:'L’enunciato', body:R`
   <p><b>Teorema di degenerazione.</b> Se due osservabili $\eta$ e $\zeta$ commutano entrambe con un&rsquo;osservabile $\xi$, ma non commutano fra loro,</p>
   $$[\xi,\eta]=0,\qquad[\xi,\zeta]=0,\qquad[\eta,\zeta]\neq0,$$
   <p>allora <b>$\xi$ è degenere</b>.</p>
   <p>Si noti cosa l&rsquo;enunciato <i>non</i> dice: non dice quale autovalore sia degenere, né quanto. Dice che almeno uno lo è. Il grado si ottiene caso per caso, e Picasso lo dichiara subito: <i>«questo teorema da solo non dice qual è il grado di degenerazione... a questo risultato si può arrivare caso per caso dalla conoscenza dettagliata di quante e quali osservabili commutano con $\xi$ e di quali sono le relazioni di commutazione fra di loro»</i>.</p>`},
   {label:'La dimostrazione, per assurdo, in tre righe', body:R`
   <p>Si supponga $\xi$ <i>non</i> degenere. Allora a ogni suo autovalore corrisponde un solo autovettore, a meno di un fattore. Siccome $\eta$ commuta con $\xi$, $\eta$ manda ogni autovettore di $\xi$ in un autovettore di $\xi$ con lo stesso autovalore — che per la non degenerazione è lo stesso vettore a meno di un fattore. Dunque <b>ogni autovettore di $\xi$ è autovettore di $\eta$</b>; e per lo stesso argomento è autovettore di $\zeta$. Allora $\eta$ e $\zeta$ hanno un insieme completo di autovettori simultanei, e due osservabili con una base comune commutano: $[\eta,\zeta]=0$, contro l&rsquo;ipotesi. Assurdo, dunque $\xi$ è degenere.</p>
   <p>Tutto il peso sta nel passaggio «un insieme completo di autovettori simultanei implica il <span class="str" data-str="commutatore">commutatore</span> nullo», che è il criterio di compatibilità già costruito in generale. <i>Il teorema è il suo contrappositivo</i>: se non commutano, la base comune non c&rsquo;è, e se la base comune non c&rsquo;è, la non degenerazione di $\xi$ è impossibile.</p>`}
  ]},
  {t:'reveal', title:'Un modello minimo, dove tutto è una matrice 2x2', tag:'costruzione', steps:[
   {label:'Perché costruirlo', body:R`
   <p>La dimostrazione per assurdo è corretta e non mostra il <i>meccanismo</i>. Il modello più piccolo in cui il teorema ha qualcosa da dire ha due dimensioni, e si scrive con le <span class="str" data-str="matrici-di-pauli">matrici di Pauli</span>. Si prenda</p>
   $$\xi=\mathbb 1=\begin{pmatrix}1&0\\0&1\end{pmatrix},\qquad \eta=\sigma_z=\begin{pmatrix}1&0\\0&-1\end{pmatrix},\qquad \zeta=\sigma_x=\begin{pmatrix}0&1\\1&0\end{pmatrix}.$$
   <p>L&rsquo;identità commuta con tutto, dunque le prime due ipotesi sono soddisfatte in modo banale. La terza richiede un conto:</p>
   $$[\sigma_x,\sigma_z]=\sigma_x\sigma_z-\sigma_z\sigma_x=\begin{pmatrix}0&-2\\2&0\end{pmatrix}=-2i\sigma_y\neq0.$$
   <p>Le ipotesi valgono tutte e tre, dunque $\xi$ deve essere degenere — e lo è in modo evidente: l&rsquo;identità ha l&rsquo;autovalore $1$ con molteplicità due. <b>Il modello non aggiunge informazione sul risultato; aggiunge la possibilità di vedere il meccanismo.</b></p>`},
   {label:'Il meccanismo, visto sui vettori', body:R`
   <p>Si parta dall&rsquo;autovettore di $\eta=\sigma_z$ con autovalore $+1$, cioè $(1,0)^{\mathsf T}$. Applicando $\zeta=\sigma_x$:</p>
   $$\sigma_x\begin{pmatrix}1\\0\end{pmatrix}=\begin{pmatrix}0\\1\end{pmatrix}.$$
   <p>Il risultato è <b>un altro vettore</b>, indipendente dal primo, ed è ancora autovettore di $\xi$ con lo stesso autovalore (lo è qualunque vettore, essendo $\xi$ l&rsquo;identità) ma con autovalore <i>opposto</i> di $\eta$. È esattamente ciò che accade al coseno nella tappa 02: l&rsquo;operatore $\zeta$ si muove <i>dentro</i> l&rsquo;autospazio di $\xi$, cambiando l&rsquo;etichetta di $\eta$. Siccome resta nell&rsquo;autospazio di $\xi$ e produce un vettore nuovo, quell&rsquo;autospazio ha dimensione almeno due. E applicando $\sigma_x$ una seconda volta non si ottiene niente di nuovo, perché $\mathbb 1=\sigma_x^{2}$: <i>la degenerazione garantita è almeno due, non più</i>.</p>`}
  ]},
  {t:'reveal', title:'Il caso libero, ritrovato per due strade', tag:'costruzione', steps:[
   {label:'Prima strada: si parte dagli autostati dell’impulso', body:R`
   <p>Per $H=p^{2}/2m$ si pone $\xi=H$, $\eta=p$, $\zeta=I$. Le ipotesi valgono: $H$ commuta con $p$ (sono funzioni l&rsquo;una dell&rsquo;altra), $H$ commuta con $I$ (tappa 02, perché $V=0$ è pari), e $p$ non commuta con $I$ (anticommuta, proprietà 7). Dunque $H$ è degenere.</p>
   <p>Il meccanismo: in rappresentazione di Schrödinger $I$ manda $e^{ip'x/\hbar}$ in $e^{-ip'x/\hbar}$, cioè</p>
   $$I|p'\rangle=|-p'\rangle,$$
   <p>e $|-p'\rangle$ è ancora autovettore di $H$ con lo stesso autovalore, perché $E$ dipende da $p'^{2}$. I due vettori sono indipendenti se $p'\neq0$, dunque il livello è degenere almeno due volte; applicando $I$ di nuovo non si ottiene nulla, perché $\mathbb 1=I^{2}$. <b>Esattamente la struttura del modello $2\times2$</b>, con $|{\pm}p'\rangle$ al posto di $(1,0)^{\mathsf T}$ e $(0,1)^{\mathsf T}$.</p>`},
   {label:'Seconda strada: si parte dagli autostati della parità', body:R`
   <p>Si scambino i ruoli: $\eta=I$, $\zeta=p$. Ora si parte dalle autofunzioni simultanee di $H$ e $I$, che la tappa 02 ha identificato in $\cos(p'x/\hbar)$ con $\omega=+1$ e $\sin(p'x/\hbar)$ con $\omega=-1$. Applicando il «terzo» operatore, cioè $p=-i\hbar\,d/dx$, al coseno si ottiene (a meno di fattori) il seno: un vettore nuovo, alla stessa energia. <b>La doppia degenerazione si ritrova identica</b>, partendo da una base completamente diversa.</p>
   <p>Che le due strade diano lo stesso risultato non è una verifica ridondante: è la prova che la degenerazione è una proprietà del livello, non dell&rsquo;etichetta che si è scelta per descriverlo. <i>Il teorema non dipende da chi si chiami $\eta$ e chi $\zeta$</i>, e infatti nell&rsquo;enunciato i due compaiono simmetricamente.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Per la particella su un segmento il potenziale è pari (rispetto al centro) e $H$ commuta con $I$. Perché il teorema di degenerazione non conclude che i livelli del segmento sono degeneri — dato che la tappa 09 mostrerà che non lo sono?`,
    a:R`Perché manca la terza ipotesi: <b>non esiste un&rsquo;osservabile $\eta$ che commuti con $H$ e non commuti con $I$</b>. Il candidato naturale, $p$, <i>non commuta con $H$</i> nel segmento — le pareti rompono l&rsquo;invarianza per traslazioni, e con essa la conservazione dell&rsquo;impulso. Il teorema richiede <b>due</b> osservabili che commutano con $\xi$, e nel segmento ce n&rsquo;è una sola. <i>È il modo giusto di leggere il teorema</i>: non è una macchina che produce degenerazione, è una macchina che la produce quando esistono due simmetrie incompatibili. Una simmetria sola non degenera nulla.`},
   {q:R`Il modello $2\times2$ ha $\xi=\mathbb 1$, che è degenere per ragioni banali. È una scelta onesta?`,
    a:R`È minima, e per questo è onesta solo se si dice che cosa dimostra e che cosa no. <b>Non dimostra</b> il teorema — quello è dimostrato in generale, e il modello non ne è un caso interessante perché la degenerazione dell&rsquo;identità si vede a occhio. <b>Dimostra</b> il meccanismo, cioè che $\zeta$ muove un autovettore di $\xi$ dentro il suo autospazio cambiandogli l&rsquo;autovalore di $\eta$, ed è quello che nel caso continuo è nascosto dietro i vettori impropri. Se si vuole un modello in cui $\xi$ non sia banale, basta prendere $\xi=\mathrm{diag}(1,1,2)$ in tre dimensioni con $\eta$ e $\zeta$ che agiscono nel blocco superiore: la struttura è la stessa, l&rsquo;autovalore $1$ è degenere e il $2$ no — <i>e si vede allora che il teorema parla di «almeno un autovalore», non di tutti</i>.`}
  ]}
]},

/* ---------------- 04 · LA LETTURA DELLA CURVATURA ---------------- */
{ num:'04', title:'La lettura della curvatura: regioni di tipo I e II, e che forma ha una soluzione prima di averla calcolata', meta:'il segno di psi-secondo diviso psi · concavità verso l asse o lontano · punti di inversione e flessi · gli zeri sono semplici',
  blocchi:[
  {t:'prosa', title:'Il problema: un’equazione del secondo ordine dice la curvatura', tag:'costruzione', html:R`
  <p>L&rsquo;equazione di Schrödinger stazionaria, scritta nella forma della tappa 01, non dà $\psi$: dà la sua <b>curvatura</b>, punto per punto, in funzione del valore di $\psi$ lì. Dividendo per $\psi$,</p>
  $$\frac{\psi''(x)}{\psi(x)}=\frac{2m}{\hbar^{2}}\big(V(x)-E\big),$$
  <p>e il membro di destra <i>non dipende da $\psi$</i>: dipende solo dal potenziale e dall&rsquo;energia che si è fissata. Questo è ciò che rende possibile una discussione qualitativa completa prima di risolvere qualunque cosa, ed è il contenuto del paragrafo 7.3 di Picasso, che apre giustificando l&rsquo;investimento: <i>«lo studio dei problemi unidimensionali non ha solo carattere accademico perché, come vedremo, in molti casi la risoluzione di un problema in più dimensioni viene ricondotta a quella di un problema unidimensionale (ad esempio particella in campo centrale...). Per questo motivo dedicheremo ampio spazio alla discussione delle caratteristiche generali»</i>. Non è una sezione preliminare: è la sezione che si riusa in tre dimensioni.</p>`},
  {t:'reveal', title:'Le due regioni, e cosa fa la funzione in ciascuna', tag:'costruzione', steps:[
   {label:'La partizione dell’asse', body:R`
   <p>Fissato un valore reale di $E$ — <b>non necessariamente un autovalore</b>, e questo è il punto metodologico: si discute la forma delle soluzioni per un $E$ qualunque, e solo dopo si vede per quali $E$ la soluzione è accettabile — l&rsquo;asse delle $x$ si divide in due specie di regioni:</p>
   <p><b>regioni di tipo I</b>, dove $V(x)<E$, cioè dove l&rsquo;energia cinetica classica sarebbe positiva; <b>regioni di tipo II</b>, dove $V(x)>E$, classicamente inaccessibili. I punti di confine, dove $V(x)=E$, sono i <b>punti di inversione</b>, perché classicamente là il moto si inverte.</p>
   <p>Dall&rsquo;equazione segue immediatamente il segno del rapporto $\psi''/\psi$: <b>negativo nelle regioni di tipo I, positivo nelle regioni di tipo II.</b> Tutto il resto di questa tappa è la lettura geometrica di questa riga.</p>`},
   {label:'Nel tipo I la funzione oscilla', body:R`
   <p>Il valore di $\psi''$ misura la concavità del grafico: se $\psi''>0$ la concavità è verso l&rsquo;alto, se $\psi''<0$ verso il basso. Nelle regioni di tipo I il rapporto $\psi''/\psi$ è negativo, dunque dove $\psi>0$ si ha $\psi''<0$ (concavità verso il basso) e dove $\psi<0$ si ha $\psi''>0$ (verso l&rsquo;alto). In entrambi i casi <b>la concavità è rivolta verso l&rsquo;asse</b>: la funzione viene continuamente richiamata verso lo zero, lo attraversa, viene richiamata di nuovo. <i>Questo è il comportamento oscillante</i>, e si verifica sul caso esplicito di una regione di tipo I con $V=0$, dove la soluzione è un seno:</p>
   $$\frac{\psi''(x)}{\psi(x)}=-\Big(\frac{n\pi}{a}\Big)^{2},$$
   <p>costante e negativa, come deve essere per $V-E$ costante e negativo.</p>`},
   {label:'Nel tipo II la funzione scappa', body:R`
   <p>Nelle regioni di tipo II il rapporto è positivo, dunque dove $\psi>0$ la concavità è verso l&rsquo;alto e dove $\psi<0$ verso il basso: <b>la concavità è rivolta lontano dall&rsquo;asse</b>. Una funzione così, una volta che si allontana dallo zero, accelera nell&rsquo;allontanarsi: il comportamento generico in una regione di tipo II <i>illimitata</i> è la divergenza esponenziale. Esiste una sola eccezione — la combinazione esatta che decade — e la tappa 05 mostrerà che è proprio il dover centrare quell&rsquo;unica eccezione, da due lati contemporaneamente, a quantizzare l&rsquo;energia.</p>
   <p>Il modello elementare è $\psi''=\kappa^{2}\psi$ con $\kappa$ reale, che ha soluzione generale $Ae^{\kappa x}+Be^{-\kappa x}$: due esponenziali, uno che diverge a destra e uno a sinistra, e nessun modo di avere entrambi i comportamenti buoni se non azzerando un coefficiente.</p>`},
   {label:'Flessi e zeri: due dettagli che servono nella tappa 06', body:R`
   <p><b>Nei punti di inversione $\psi$ ha un flesso</b>, perché lì $V-E=0$ e dunque $\psi''=0$: è il punto in cui la concavità cambia verso, passando da una regione all&rsquo;altra. <b>E $\psi$ ha un flesso anche in ogni suo zero</b>, per la stessa equazione: se $\psi(x_0)=0$ allora $\psi''(x_0)=0$. Lo si verifica sulla seconda autofunzione del segmento, che si annulla a metà:</p>
   $$\psi_2''(a/2)=0.$$
   <p><b>Gli zeri sono tutti semplici</b>, cioè $\psi$ e $\psi'$ non si annullano mai nello stesso punto. L&rsquo;argomento è di unicità, non di calcolo, e Picasso lo usa come un lemma: <i>«le soluzioni dell&rsquo;equazione di Schrödinger non possono avere zeri di ordine superiore al primo: se in un punto si annullano sia $\psi$ che $\psi'$ allora, siccome questi dati determinano univocamente la soluzione, $\psi$ è la soluzione identicamente nulla»</i>. Un&rsquo;equazione del secondo ordine è determinata da $\psi(x_0)$ e $\psi'(x_0)$; se sono entrambi nulli, la soluzione è lo zero. <i>Serve nella tappa 06 per contare i nodi e nella 07 per la parità dello stato fondamentale.</i></p>`}
  ]},
  {t:'plot', title:'Le due regioni, e le due forme',
   intro:R`<p>A sinistra un potenziale a doppia buca, $V(x)=(x^{2}-4)^{2}/8$, con una retta orizzontale all&rsquo;energia $E=1$: le regioni di tipo I sono quelle in cui la curva sta <i>sotto</i> la retta, le regioni di tipo II quelle in cui sta sopra. A destra le due forme archetipiche, su un intervallo in cui $\psi$ resta positiva: il coseno (tipo I, concavità verso l&rsquo;asse) e il cosinoiperbolico (tipo II, concavità lontano dall&rsquo;asse).</p>`,
   plots:[{kind:'func2d', xr:[-3.2,3.2], yr:[-0.3,3.2], height:280, ticks:true,
     title:'V(x) = (x^2-4)^2/8 e il livello E = 1',
     curves:[{f:'Math.pow(x*x-4,2)/8', col:'#5aa9ff', width:2.4, label:'V(x)'},
             {f:'1', col:'#ff6b8a', width:2.0, label:'E = 1'}],
     xlabel:'x', ylabel:'energia'},
    {kind:'func2d', xr:[-1.4,1.4], yr:[0,2.4], height:280, ticks:true,
     title:'le due forme: oscillante contro divergente',
     curves:[{f:'Math.cos(x)', col:'#5aa9ff', width:2.4, label:'tipo I: psi = cos x, concavita verso l asse'},
             {f:'Math.cosh(x)', col:'#ffb86b', width:2.4, label:'tipo II: psi = cosh x, concavita lontano dall asse'}],
     xlabel:'x', ylabel:'psi'}],
   leggi:R`<p><b>Che cosa guardare.</b> A sinistra la retta rosa taglia la curva blu in <b>quattro</b> punti di inversione, che si trovano dove $(x^{2}-4)^{2}$ vale $8$, cioè in $x=\pm\sqrt{4-2\sqrt2}\simeq\pm1{,}0824$ e $x=\pm\sqrt{4+2\sqrt2}\simeq\pm2{,}6131$. L&rsquo;asse resta diviso in cinque pezzi: <i>due regioni di tipo I</i> dentro le conche, dove la curva sta sotto la retta, e <i>tre regioni di tipo II</i> — le due esterne, illimitate, e la barriera centrale, dove $V(0)=2$ sta sopra $E=1$. A destra: entrambe le curve valgono $1$ in $x=0$ e hanno derivata nulla; <i>la differenza è tutta nel segno della curvatura</i>, e in mezzo secondo di grafico diventa la differenza fra una funzione che tornerà a zero e una che non ci tornerà mai.</p>
   <p><b>Che cosa impararne.</b> Il disegno di sinistra contiene già, senza nessun conto, due previsioni che la tappa 05 renderà quantitative: che per $E=1$ esistano stati legati (ci sono regioni di tipo II illimitate da entrambi i lati, dunque la funzione può decadere a entrambi gli estremi) e che la funzione d&rsquo;onda abbia ampiezza apprezzabile <i>nelle due conche e non in mezzo</i> — cioè che il doppio pozzo produca stati «distribuiti su due siti», che è il modello minimo del legame chimico. <b>La forma del grafico di $V$ determina la forma del grafico di $\psi$ prima che si risolva niente</b>, e questo è il contenuto della tappa.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Una funzione d&rsquo;onda proposta ha un massimo locale in un punto $x_0$ dove $V(x_0)>E$. È possibile?`,
    a:R`<b>No, se $\psi(x_0)>0$.</b> In un massimo $\psi''\le0$; ma in una regione di tipo II con $\psi>0$ l&rsquo;equazione impone $\psi''>0$ strettamente. Dunque una funzione positiva non può avere un massimo in una regione classicamente proibita — può avere un <i>minimo</i>. È uno dei controlli più rapidi su un grafico d&rsquo;esame: <i>si guarda dove sta la retta dell&rsquo;energia rispetto alla curva del potenziale, e si verifica che le gobbe stiano nel posto giusto</i>. Nelle regioni proibite la funzione è monotona o ha un minimo, mai una gobba verso l&rsquo;alto.`},
   {q:R`La discussione di questa tappa usa in modo essenziale che $\psi$ sia reale. Dove si romperebbe se $\psi$ fosse complessa?`,
    a:R`Si romperebbe il passaggio da «$\psi''/\psi$ ha segno fissato» a «la concavità del grafico è rivolta da quella parte», perché una funzione complessa non ha un grafico di cui parlare né una concavità. Si potrebbe lavorare su $|\psi|$, ma $|\psi|$ non soddisfa l&rsquo;equazione di Schrödinger e la relazione fra la sua curvatura e $V-E$ si perde. <b>È qui che la riduzione (b) della tappa 02 — le autofunzioni si possono prendere reali — smette di essere un&rsquo;eleganza e diventa lo strumento di lavoro</b>: tutta l&rsquo;analisi qualitativa dei problemi unidimensionali, e con essa il teorema di oscillazione, vive nella scelta della base reale.`}
  ]}
]},

/* ---------------- 05 · PERCHE' E > V_MIN, E PERCHE' LO SPETTRO E' DISCRETO ---------------- */
{ num:'05', title:'Perché l’energia sta sopra il minimo del potenziale, e perché i livelli sono isolati', meta:'due dimostrazioni indipendenti di E maggiore di V-min · il problema di tiro · perché il valore giusto di E è uno e non un intervallo · un conto di energia cinetica che chiude il cerchio',
  blocchi:[
  {t:'prosa', title:'La prima cosa che un potenziale confinante impone', tag:'costruzione', html:R`
  <p>Si consideri il caso in cui $V(x)\to+\infty$ per $x\to\pm\infty$: il potenziale confina da entrambi i lati, e qualunque $E$ si scelga le regioni esterne sono di tipo II. La prima domanda è quale sia l&rsquo;intervallo di energie in cui vale la pena cercare, e la risposta — <b>$E>V_{\rm min}$</b> — si ottiene in due modi che non si somigliano per niente, uno geometrico e uno variazionale. Che diano lo stesso risultato è un controllo, non una ridondanza: <i>il primo usa l&rsquo;equazione differenziale, il secondo non la usa affatto</i>.</p>`},
  {t:'reveal', title:'Prima dimostrazione: geometrica, con la tangente', tag:'costruzione', steps:[
   {label:'L’argomento di Picasso', body:R`
   <p>Si supponga $E<V_{\rm min}$. Allora <b>tutto</b> l&rsquo;asse è una regione di tipo II. Si prenda un punto $x_0$ in cui $\psi\neq0$, e si assuma $\psi(x_0)>0$ (se fosse negativa si cambia segno a $\psi$, lecito perché l&rsquo;equazione è omogenea). Si tracci la tangente al grafico in $x_0$.</p>
   <p>Siccome siamo in regione di tipo II e $\psi>0$, la concavità è rivolta verso l&rsquo;alto <i>per sempre</i>, dunque il grafico sta sempre al di sopra della sua tangente. Due casi:</p>
   <p>— se $\psi'(x_0)\ge0$, allora andando verso destra $\psi$ sta sopra una retta non decrescente e la concavità continua ad aumentarla: $\psi\to+\infty$ per $x\to+\infty$;</p>
   <p>— se $\psi'(x_0)<0$, lo stesso argomento verso <i>sinistra</i> dà $\psi\to+\infty$ per $x\to-\infty$.</p>
   <p><b>In nessun caso $\psi$ è accettabile</b>, e Picasso chiude così: <i>«in nessun caso $\psi(x)$ è accettabile»</i>. Non esiste nessuna soluzione normalizzabile, né limitata, con $E<V_{\rm min}$.</p>`},
   {label:'Perché l’argomento è più forte di quanto sembri', body:R`
