   $$W(r)=\frac{64k^{4}r^{2}\sin^{4}(kr)}{[A^{2}+s(r)]^{2}}-\frac{4k^{2}\big\{\sin^{2}(kr)+2kr\sin(2kr)\big\}}{A^{2}+s(r)}.$$
   <p>Vale dire che questa formula <b>è stata ricalcolata e non copiata</b>: il dossier di questo movimento è un testo passato per una scansione, e in una formula a quattro termini un segno perduto non si vede. Partendo dall&rsquo;espressione generale di $W$ in funzione di $f$, con $f=1/(A^{2}+s)$ e $s$ scritta per esteso, si ritrova la formula qui sopra termine per termine — i due contributi $-4k^{3}r\sin(2kr)/(A^{2}+s)$, uno dalla cotangente e uno da $f''$, si sommano nel $-8k^{3}r\sin(2kr)/(A^{2}+s)$ che compare raccolto, e il termine positivo viene da $2s'^{2}/(A^{2}+s)^{2}$.</p>
   <p>Il comportamento a grande distanza si legge dai termini dominanti. Per $r$ grande $A^{2}+s\simeq2k^{2}r^{2}$; il contributo della cotangente diventa $-2k\sin(2kr)/r$ e quello di $\tfrac12 f''/f$ un altro $-2k\sin(2kr)/r$, e la somma dei due è</p>
   $$-\frac{4k\sin(2kr)}{r}.$$
   <p>Il termine positivo è $O(1/r^{2})$ e non contribuisce. <b>Dunque il potenziale oscilla con ampiezza che decade come $1/r$</b>, e non tende a nessun limite — che è esattamente l&rsquo;ipotesi che lo schema della tappa 08 richiedeva.</p>`}
  ]},
  {t:'plot', title:'Lo stato legato e il potenziale che lo tiene',
   intro:R`<p>Per $k=2$ (dunque $E=k^{2}/2=2$) e $A^{2}=4$: a sinistra la funzione d&rsquo;onda $\Psi(r)=A^{2}\sin(kr)/(kr\,[A^{2}+s(r)])$, normalizzata a $\Psi(0)=1$, che decade come $r^{-3}$ ed è dunque a quadrato sommabile; a destra il potenziale $W(r)$ della formula qui sopra, con la sua coda oscillante. <b>I valori dei parametri sono scelti qui</b>, non letti nel libro: quelli di Ballentine sono riportati nella sua figura 10.4 e non li si è potuti leggere dal testo estratto.</p>`,
   plots:[{kind:'func2d', xr:[0.001,9], yr:[-0.2,1.1], height:290, ticks:true,
     title:'la funzione d onda: nodi, e decadimento come r^-3',
     curves:[{f:'4*Math.sin(2*x)/(2*x*(4 + 8*x*x - 4*x*Math.sin(4*x) - Math.cos(4*x) + 1))', col:'#5aa9ff', width:2.6, label:'Psi(r), E = 2 dentro il continuo'},
             {f:'0', col:'#666a75', width:1.2, label:'asse'}],
     xlabel:'r', ylabel:'Psi'},
    {kind:'func2d', xr:[0.001,9], yr:[-3.5,2.5], height:290, ticks:true,
     title:'il potenziale W(r): oscilla e non tende a niente',
     curves:[{f:'(64*16*x*x*Math.pow(Math.sin(2*x),4))/Math.pow(4 + 8*x*x - 4*x*Math.sin(4*x) - Math.cos(4*x) + 1,2) - (16*(Math.pow(Math.sin(2*x),2) + 4*x*Math.sin(4*x)))/(4 + 8*x*x - 4*x*Math.sin(4*x) - Math.cos(4*x) + 1)', col:'#ff6b8a', width:2.4, label:'W(r)'},
             {f:'2', col:'#9b8cff', width:1.8, label:'E = 2, il livello legato'},
             {f:'0', col:'#666a75', width:1.2, label:'asse'}],
     xlabel:'r', ylabel:'W'}],
   leggi:R`<p><b>Che cosa guardare.</b> A sinistra la funzione d&rsquo;onda ha infiniti nodi, nelle stesse posizioni di $\sin(2r)$, e un&rsquo;ampiezza che crolla: a $r=9$ è già dell&rsquo;ordine del millesimo. A destra il potenziale oscilla intorno a zero e la retta viola segna l&rsquo;energia del livello, $E=2$: <b>la retta sta sopra il potenziale quasi dappertutto</b>, e certamente sopra il suo valore asintotico. Classicamente, una particella con quell&rsquo;energia non sarebbe legata: scapperebbe.</p>
   <p><b>Che cosa impararne.</b> Il meccanismo che tiene lo stato non è una barriera, è <i>interferenza</i>, e Ballentine lo dice nei termini in cui va capito: <i>«using the analogy of wave propagation to describe the dynamics of the state, it seems that the mechanism which prevents the bound state from dispersing like ordinary positive energy states is the destructive interference of the waves reflected from the oscillations of $W(r)$»</i>. Le creste e le valli del potenziale sono spaziate come mezza lunghezza d&rsquo;onda della funzione, e le riflessioni successive si cancellano. <b>È il principio del rivestimento antiriflesso di una lente, usato al contrario</b>: là si sommano le riflessioni per annullare la trasmissione, qui si annullano le trasmissioni per imprigionare un&rsquo;onda che avrebbe energia per andarsene. Ed è la ragione per cui questo stato non ha analogo classico: una particella non interferisce con sé stessa, e l&rsquo;unico modo di confinarla è negarle l&rsquo;energia.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Questo controesempio invalida lo schema della tappa 08?`,
    a:R`<b>No: ne precisa l&rsquo;ipotesi.</b> Lo schema classifica i potenziali che tendono a un limite per $x\to\pm\infty$, e per quelli è corretto. Il potenziale di Stillinger e Herrick non è in quella classe, e per questo non contraddice nulla: esibisce un caso fuori dal dominio di applicabilità. <i>La differenza fra «un teorema è falso» e «un teorema ha un&rsquo;ipotesi che non si era notata» è tutta la differenza fra un errore e un chiarimento</i>, e nel caso specifico il chiarimento è prezioso perché l&rsquo;ipotesi è tacita in Picasso e dichiarata solo di passaggio in Landau. Chi sa che la classificazione vale «se $V$ tende a un limite» ha imparato lo schema; chi la ricorda come «il continuo è sempre doppiamente degenere sopra il bordo» ha imparato una regola falsa che per anni non lo smentirà.`},
   {q:R`Il metodo «si ricava il potenziale dalla funzione d&rsquo;onda» sembra permettere di costruire qualunque spettro. Qual è il limite?`,
    a:R`Il limite è la <b>non singolarità</b> di $W$, ed è un vincolo severo: la formula $W=E+\tfrac12\nabla^{2}\Psi/\Psi$ diverge in ogni nodo di $\Psi$ a meno che il laplaciano non vi si annulli allo stesso ordine, e tenere questa condizione su infiniti nodi è esattamente il lavoro che la costruzione di $s(r)$ svolge. Ballentine registra anche un limite di principio sulla <i>forma</i> del potenziale ottenibile: <i>«Stillinger and Herrick believe that no $f(r)$ that produces a single particle bound state in the continuum will lead to a potential that decays more rapidly than»</i> la coda $1/r$ trovata sopra — cioè uno stato legato nel continuo richiede un potenziale a lungo raggio, e non si può ottenere con un potenziale che si spenga rapidamente. <b>C&rsquo;è però un seguito fisicamente serio</b>, e nello stesso paragrafo: gli stessi autori argomentano che <i>«nonseparable multiparticle systems, such as two-electron atoms, may possess bound states in the continuum without such a contrived form of potential»</i>. <i>Non è una curiosità costruita a tavolino: è il fenomeno che negli atomi a due elettroni si chiama risonanza di Feshbach</i>, e che si misura.`}
  ]}
]},

/* ---------------- 12 · BILANCIO ---------------- */
{ num:'12', title:'Bilancio: che cosa resta in mano, e in che ordine si usa', meta:'i quattro strumenti riusabili · la catena logica dei teoremi, nell ordine giusto · dove tutto questo riappare in fisica · che cosa ciascuna fonte ha dato e nessun altra',
  blocchi:[
  {t:'prosa', title:'La catena logica, nell’ordine in cui va ricostruita', tag:'architettura', html:R`
  <p>Il contenuto di questo movimento non è una lista di risultati: è una <b>catena</b>, e se la si ricostruisce nell&rsquo;ordine sbagliato si ottengono argomenti circolari. L&rsquo;ordine è questo, e in un orale è ciò che distingue chi ha capito da chi ricorda.</p>
  <p><b>1.</b> Le condizioni di raccordo si ricavano integrando l&rsquo;equazione attraverso il salto. Due condizioni per un salto finito, una per un salto infinito.</p>
  <p><b>2.</b> Le autofunzioni si possono prendere reali, perché l&rsquo;equazione ha coefficienti reali. <i>Questo serve a tutto il resto</i>, perché l&rsquo;analisi qualitativa parla di grafici.</p>
  <p><b>3.</b> La curvatura è fissata dal segno di $V-E$: oscillazione dove l&rsquo;energia è sopra il potenziale, divergenza dove è sotto. Gli zeri sono semplici.</p>
  <p><b>4.</b> $E>V_{\rm min}$, per due vie indipendenti.</p>
  <p><b>5.</b> Il decadimento ai due estremi è una condizione in più del numero di costanti disponibili, dunque quantizza. <i>Lo spettro è discreto.</i></p>
  <p><b>6.</b> Il wronskiano di due autofunzioni allo stesso autovalore è costante, e si annulla se le due svaniscono da un solo lato. <i>Gli autovalori discreti sono non degeneri.</i></p>
  <p><b>7.</b> Dalla non degenerazione segue la parità obbligata (se $V$ è pari), e dal teorema di oscillazione il conteggio dei nodi. Le due insieme danno l&rsquo;alternanza delle parità e il fatto che il fondamentale sia pari e senza nodi.</p>
  <p><b>8.</b> Il tipo di spettro dipende solo dal tipo di regione all&rsquo;infinito — <i>purché il potenziale tenda a un limite</i>.</p>
  <p>Due inversioni d&rsquo;ordine da non fare. <b>La parità obbligata non viene prima della non degenerazione</b>: la via breve di Landau la presuppone, e il fatto che funzioni nei casi concreti non la rende un argomento. <b>Il teorema di oscillazione non viene prima della non degenerazione</b>: il suo enunciato presuppone che a ogni livello corrisponda <i>una</i> autofunzione da contare i nodi, e Picasso lo dichiara nel punto in cui lo scrive.</p>`},
  {t:'prosa', title:'Che cosa resta in mano, in ordine di riusabilità', tag:'architettura', html:R`
  <p><b>Un metodo di raccordo.</b> Si integra l&rsquo;equazione attraverso la singolarità e si guarda che cosa resta: funziona per il gradino (resta tutto), per la delta (salta la derivata), per la parete infinita (salta la derivata). <i>È un metodo, non tre regole da ricordare.</i></p>
  <p><b>Un metodo di conteggio.</b> Un&rsquo;equazione del secondo ordine ha due costanti; ogni condizione al contorno ne consuma una; quando le condizioni superano le costanti, la differenza ricade sull&rsquo;energia e la quantizza. Questo conteggio dice in anticipo se lo spettro sarà discreto, continuo non degenere o continuo doppiamente degenere, <i>senza risolvere nulla</i>, e si trasporta identico all&rsquo;equazione radiale di un problema tridimensionale.</p>
  <p><b>Due teoremi con le loro dimostrazioni.</b> Quello di degenerazione è algebrico e vale in qualunque dimensione: tre commutatori, e la conclusione. Quello di non degenerazione è analitico e vale solo in una dimensione su un dominio connesso: il wronskiano, e il punto in cui si annulla la costante. <i>Sono materia d&rsquo;orale e vanno sapute dimostrare, non citare.</i></p>
  <p><b>Una tecnica di soluzione grafica.</b> Due condizioni trascendenti e un vincolo quadratico diventano l&rsquo;intersezione fra due famiglie di curve e una circonferenza, e da quel disegno si leggono il numero di stati legati, l&rsquo;alternanza delle parità e i due casi limite. La stessa costruzione ricompare per ogni potenziale a tratti.</p>
  <p><b>Un controesempio che vale un&rsquo;ipotesi.</b> Uno stato discreto immerso nel continuo positivo esiste, e il suo potenziale si costruisce rovesciando l&rsquo;equazione. Ricordarlo serve a una cosa sola, ed è la più importante: <i>sapere quale ipotesi usava lo schema che si è imparato</i>.</p>`},
  {t:'prosa', title:'Dove tutto questo riappare, in fisica', tag:'architettura', html:R`
  <p><b>Nell&rsquo;equazione radiale.</b> Un problema a simmetria sferica si riduce, separando le variabili, a un&rsquo;equazione unidimensionale per $u(r)=r R(r)$ su $(0,\infty)$ con un potenziale efficace che include il termine centrifugo. Picasso dichiara che è questa la ragione per cui ha dedicato «ampio spazio» al caso unidimensionale, e Landau apre il suo paragrafo 21 nello stesso modo. <b>Tutto ciò che si è stabilito qui si applica là</b>, con una sola differenza che cambia il conteggio: il dominio è semi-illimitato e la condizione in $r=0$ sostituisce quella a $-\infty$.</p>
  <p><b>Nella fisica dei solidi.</b> Il caso che lo schema non copre — il potenziale periodico — è il caso di ogni cristallo, e il «compromesso fra discreto e continuo» che Picasso nomina in una riga è la struttura a bande. La doppia buca della figura della tappa 04, iterata infinite volte, <i>è</i> il modello a legame forte.</p>
  <p><b>Nella chimica.</b> Il bilancio della tappa 10 — lasciar uscire la funzione d&rsquo;onda costa in potenziale e fa risparmiare in cinetica — è il legame covalente. Due buche vicine producono uno stato simmetrico più basso e uno antisimmetrico più alto, e la differenza fra i due è l&rsquo;energia di legame della molecola.</p>
  <p><b>Nella nanofisica.</b> Il numero in elettronvolt della tappa 09 non è un esercizio: la dipendenza $E_1\propto a^{-2}$ è ciò che permette di scegliere il colore di emissione di un punto quantico scegliendone il diametro, e la dipendenza del numero di stati legati da $a\sqrt{V_0}$ è il criterio di progetto di una buca quantica in un laser a semiconduttore.</p>
  <p><b>Negli atomi a due elettroni.</b> Lo stato legato nel continuo della tappa 11 non resta una curiosità: la stessa condizione — un livello discreto alla stessa energia di un continuo — è ciò che in spettroscopia produce le risonanze autoionizzanti, e il loro profilo asimmetrico è la firma dell&rsquo;interferenza fra il canale legato e quello libero.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Si indichi, per ciascuna delle quattro fonti di questo movimento, quale affermazione non si troverebbe leggendo solo quella.`,
    a:R`Da <b>Picasso</b> non si avrebbe lo sviluppo completo di uno stato iniziale sul segmento con il controllo di Parseval, né le quattro proprietà con la dichiarazione di quali siano generali: è l&rsquo;impostazione di Griffiths. Da <b>Griffiths</b> non si avrebbe nessuno dei due teoremi — il teorema di degenerazione in forma algebrica non c&rsquo;è affatto, e quello di non degenerazione non è enunciato: sono di Picasso, con le dimostrazioni. Da <b>Landau</b> non si avrebbe l&rsquo;operatore di inversione spaziale costruito con le sue proprietà, perché Landau ricava la parità senza operatore — ma da lui, e non da Picasso, si ha l&rsquo;ipotesi dichiarata sui limiti del potenziale all&rsquo;infinito e la nota in calce che avverte che la via breve alla parità presuppone la non degenerazione. Da <b>Ballentine</b> non si avrebbe niente di tutto il resto del movimento — lui non tratta gli stati legati in una dimensione — ma solo da lui si ha lo stato legato immerso nel continuo, che è la cosa che dice quale ipotesi lo schema stesse usando. <i>E l&rsquo;affinamento «basta un solo lato» nella dimostrazione del wronskiano è l&rsquo;unico punto in cui due fonti dicono esattamente la stessa cosa nello stesso posto</i>, Picasso fra parentesi e Landau in corpo di testo: quando due autori si fermano a segnalare lo stesso dettaglio tecnico, il dettaglio è importante.`},
   {q:R`Un esame chiede: «si dimostri che gli autovalori discreti di una hamiltoniana unidimensionale sono non degeneri». Qual è il minimo che va scritto, e qual è l&rsquo;errore più probabile?`,
    a:R`<b>Il minimo:</b> due autofunzioni allo stesso $E$; si moltiplica ciascuna equazione per l&rsquo;altra funzione e si sottrae, ottenendo $\psi_1''\psi_2-\psi_2''\psi_1=0$; si riconosce il membro di sinistra come la derivata del wronskiano $\psi_1\psi_2'-\psi_1'\psi_2$; dunque il wronskiano è costante; la costante si valuta all&rsquo;infinito, dove entrambe le funzioni svaniscono perché $E$ è discreto, dunque è nulla; dall&rsquo;annullarsi del wronskiano segue l&rsquo;uguaglianza delle derivate logaritmiche e quindi $\psi_1=C\psi_2$. <b>L&rsquo;errore più probabile</b> è saltare la valutazione della costante, o farla in un punto generico: <i>è lì che sta tutto il teorema</i>, e un wronskiano costante senza il punto in cui si annulla non dimostra niente — come mostra la particella libera, dove il wronskiano è costante e vale $-k\neq0$. Il secondo errore più probabile è non dire che il dominio è connesso, che è ciò che permette l&rsquo;integrazione finale, e senza cui due buche infinite separate darebbero un controesempio.`}
  ]}
]}

var byId = {}; TAPPE.forEach(function(s){ byId[s.num]=s; });

var VKEY='pm-nucleomq-11-visited';
function loadSeen(){ try{ return new Set(JSON.parse(localStorage.getItem(VKEY)||'[]')); }catch(e){ return new Set(); } }
function saveSeen(s){ try{ localStorage.setItem(VKEY, JSON.stringify(Array.from(s))); }catch(e){} }
var SEEN = loadSeen();

function renderNav(active){
  var nav=document.getElementById('sidebar');
  nav.innerHTML='';
  var h=document.createElement('h2'); h.textContent='Nucleo mq-11 · le tappe'; nav.appendChild(h);
  TAPPE.forEach(function(s){
    var b=document.createElement('button');
    b.className='navitem'+(active===s.num?' active':'')+(SEEN.has(s.num)?' seen':'');
    b.innerHTML='<span class="dot"></span><span class="nx">'+s.num+'</span><span>'+s.title+'</span>';
    b.onclick=function(){ showTappa(s.num); };
    nav.appendChild(b);
  });
}

/* ---- renderer dei blocchi ---- */
function sectionProsa(title, tag, html){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var body=elFromHTML('<div class="open-body">'+html+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function sectionGram(title, rows){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag gramtag">grammatica</span></h3>';
  var inner='<table class="gramtab">';
  rows.forEach(function(r){ inner+='<tr><td class="gs">'+r[0]+'</td><td>'+r[1]+'</td></tr>'; });
  inner+='</table>';
  var body=elFromHTML('<div class="gramwrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
/* --- blocco PLOT: la figura non decora, si legge. Ogni plot porta una chiave di lettura. --- */
function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';
  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionSvelabile(title, tag, html, sol){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var c=document.createElement('div'); c.className='collaudo-item';

    var btn=document.createElement('button'); btn.className='reveal-btn small';
    btn.textContent='Rivela la soluzione';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a);
      btn.disabled=true; btn.classList.add('done'); btn.textContent='Soluzione rivelata'; };
    c.appendChild(btn); c.appendChild(a);
  }
  wrap.appendChild(c); return wrap;
}
function sectionCollaudo(title, items){

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    /* DUE SCHEMI, NON UNO — scoperto il 2026-10-06 provando le pagine vive. I movimenti
       scritti per primi (em-01..03, me-10b, i collaudi di gd-01..09 e di quattro em)
       usano una forma piu' semplice: `reveal` e `prolessi` con un solo `html`,
       `esercizio` e `collaudo` con `html` + `sol`. Il renderer ne conosceva una sola e
       chiamava `steps.forEach` su `undefined`: TypeError, e la tappa si fermava li' —
       62 blocchi in 17 movimenti su 74. Non si riscrive il contenuto per far contento
       il renderer: e' il renderer che deve leggere cio' che c'e'.
       E in fondo un ramo che NON muore: uno schema nuovo di domani deve far vedere un
       avviso in quella sezione, non spegnere la pagina sotto di se'. */
    try{
      if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
      else if(b.t==='prolessi') m.appendChild(b.rotte ? sectionProlessi(b)
                                   : sectionProsa(b.title,'prolessi',b.html));
      else if(b.t==='reveal')m.appendChild(b.steps ? sectionReveal(b.title,b.tag,b.steps)
                                   : sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='esercizio') m.appendChild(b.steps ? sectionEsercizio(b)
                                   : sectionSvelabile(b.title,'esercizio',b.html,b.sol));
      else if(b.t==='collaudo')  m.appendChild(b.items ? sectionCollaudo(b.title,b.items)
                                   : sectionSvelabile(b.title,'provi, poi riveli',b.html,b.sol));
      else if(b.t==='plot')      m.appendChild(sectionPlot(b));
      else m.appendChild(sectionProsa(b.title||'(blocco)', 'tipo sconosciuto: '+b.t,
                                      b.html||''));
    }catch(err){
      var avv=document.createElement('section'); avv.className='section';
      avv.innerHTML='<h3>'+(b.title||'(blocco)')+'<span class="tag">non reso</span></h3>'
        +'<p style="color:#ff6b6b">Questo blocco non si &egrave; potuto rendere ('
        +b.t+': '+err.message+'). Il resto della tappa continua sotto.</p>';
      m.appendChild(avv);
    }
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* I POP-UP DEGLI STRUMENTI. `cablaStrumenti` esisteva dal 18-09 e non la chiamava
     nessuno: i 229 rimandi del percorso erano <span> senza handler, e il clic non
     faceva niente. Nessun controllo poteva vederlo — la sintassi era valida, le schede
     c'erano tutte, le formule rendevano: il guasto esisteva solo a pagina viva. Qui, e
     dopo ogni inserimento successivo, perche' la tappa si rimonta da capo a ogni
     cambio e gli handler vanno riattaccati al DOM nuovo. */
  cablaStrumenti(m);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}
