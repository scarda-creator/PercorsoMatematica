   <p>Non si è usata nessuna proprietà del potenziale oltre a $V>E$ dappertutto: non la continuità, non la monotonia, non la forma. <b>La conclusione vale per qualunque $V$</b>, e questo è il motivo per cui Griffiths la propone come problema generale e non come osservazione su un caso: <i>«show that $E$ must exceed the minimum value of $V(x)$, for every normalizable solution to the time-independent Schrödinger equation»</i>, con il suggerimento che è esattamente l&rsquo;argomento qui sopra — <i>«if $E<V_{\rm min}$, then $\psi$ and its second derivative always have the same sign — argue that such a function cannot be normalized»</i>. Griffiths chiede anche l&rsquo;analogo classico, e vale dirlo: classicamente $E<V_{\rm min}$ significherebbe energia cinetica negativa, cioè impulso immaginario. <i>Il risultato quantistico è lo stesso del classico, per una ragione completamente diversa</i> — là è l&rsquo;impossibilità di una velocità immaginaria, qui è l&rsquo;impossibilità di normalizzare.</p>`}
  ]},
  {t:'reveal', title:'Seconda dimostrazione: variazionale, senza toccare l’equazione', tag:'costruzione', steps:[
   {label:'Il valor medio dell’hamiltoniana', body:R`
   <p>Per <i>ogni</i> stato $|A\rangle$, e in particolare per un autostato dell&rsquo;energia, il valor medio dell&rsquo;hamiltoniana si spezza in due pezzi:</p>
   $$\langle H\rangle=\langle T\rangle+\langle V\rangle\ge V_{\rm min}.$$
   <p>La disuguaglianza regge perché i due pezzi si stimano separatamente, e in modo elementare. <b>Il termine cinetico è non negativo</b>: $\langle T\rangle=\langle p^{2}\rangle/2m$, e $\langle p^{2}\rangle$ è la norma quadrata del vettore $p|A\rangle$ dello <span class="str" data-str="spazio-di-hilbert">spazio di Hilbert</span>, dunque non negativa per qualunque stato. <b>Il termine potenziale è almeno $V_{\rm min}$</b>: $\langle V\rangle=\int V(x)|\psi(x)|^{2}dx\ge V_{\rm min}\int|\psi|^{2}dx=V_{\rm min}$, perché $|\psi|^{2}$ è una densità di probabilità normalizzata. Sommando, $\langle H\rangle\ge V_{\rm min}$; e per un autostato $\langle H\rangle=E$.</p>
   <p>Picasso usa questa seconda via come alternativa dichiarata alla prima, rimandando all&rsquo;argomento già fatto per l&rsquo;oscillatore armonico. <i>Il vantaggio è che non si parla mai di grafici</i>: funziona identica in tre dimensioni e per qualunque numero di particelle, dove l&rsquo;argomento della tangente non si può nemmeno enunciare.</p>`},
   {label:'Un conto esplicito che chiude il cerchio', body:R`
   <p>Vale la pena vedere il bilancio su un caso dove tutto si calcola. Per il segmento $(0,a)$ con $V=0$ dentro, lo stato fondamentale è $\psi_1=\sqrt{2/a}\sin(\pi x/a)$ e il valor medio dell&rsquo;energia cinetica si ottiene per parti, come integrale del quadrato della derivata:</p>
   $$\langle T\rangle=\int_{0}^{a}\frac{\hbar^{2}}{2m}\big|\psi_1'(x)\big|^{2}dx=\frac{\pi^{2}\hbar^{2}}{2ma^{2}}.$$
   <p>Siccome $V=0$ dentro la buca, $\langle V\rangle=0$ e dunque $\langle H\rangle=\langle T\rangle$: il risultato coincide con l&rsquo;autovalore $E_1$ che la tappa 09 ricaverà in modo indipendente, risolvendo l&rsquo;equazione. <b>Che i due conti coincidano verifica entrambi</b>: il primo passa per un integrale, il secondo per una derivata seconda, e un errore in uno dei due si vedrebbe come discrepanza. E $V_{\rm min}=0<E_1$, come il teorema impone.</p>`}
  ]},
  {t:'reveal', title:'Il meccanismo della quantizzazione: un problema di tiro', tag:'costruzione', steps:[
   {label:'Che cosa si può scegliere, e che cosa no', body:R`
   <p>Sia ora $E>V_{\rm min}$. Allora esistono due punti $x_1<x_2$ tali che le regioni $x<x_1$ e $x>x_2$ sono di tipo II e in mezzo c&rsquo;è almeno una regione di tipo I. La domanda è: perché solo alcuni valori di $E$ danno una soluzione accettabile?</p>
   <p>Si parta da un punto $x_0$ nella regione II di sinistra. L&rsquo;equazione è del secondo ordine, dunque la soluzione è determinata da due dati: $\psi(x_0)$ e $\psi'(x_0)$. Il primo si può fissare a piacere, per omogeneità — moltiplicare $\psi$ per una costante dà ancora una soluzione — e si prenda $\psi(x_0)>0$. <b>Resta un solo parametro libero, $\psi'(x_0)$</b>, e con esso si deve centrare un bersaglio.</p>`},
   {label:'Il primo tiro: far decadere a sinistra', body:R`
   <p>Guardando verso $x\to-\infty$, in regione di tipo II, il comportamento dipende dal valore di $\psi'(x_0)$:</p>
   <p>— se $\psi'(x_0)$ è negativo, o positivo ma piccolo, allora $\psi\to+\infty$ per $x\to-\infty$ senza mai attraversare l&rsquo;asse;</p>
   <p>— se $\psi'(x_0)$ è positivo e grande, il grafico attraversa l&rsquo;asse e tende a $-\infty$;</p>
   <p>— <b>esiste dunque un valore intermedio</b>, per continuità, per cui $\psi\to0$ asintoticamente.</p>
   <p>Quel valore si prende, e <i>il parametro libero è finito</i>: la soluzione è ora completamente determinata, e nessuna libertà resta per aggiustare il comportamento all&rsquo;altro estremo.</p>`},
   {label:'Il secondo bersaglio, e perché quantizza', body:R`
   <p>Con la soluzione così fissata si guarda che cosa fa per $x\to+\infty$. Fra $x_1$ e $x_2$ la funzione oscilla (regione di tipo I), e arriva a $x_2$ con un certo valore e una certa pendenza. Da lì in poi è in regione di tipo II e <b>generica­mente diverge</b>: tre comportamenti sono possibili, e solo quello intermedio — il decadimento — è accettabile.</p>
   <p>Ma ormai non c&rsquo;è nessun parametro con cui aggiustare, <i>tranne $E$ stessa</i>. E $E$ entra nel conto in modo controllato: aumentare $E$ aumenta $|V-E|$ nella regione di tipo I, cioè aumenta la curvatura, cioè fa oscillare più in fretta la funzione fra $x_1$ e $x_2$, cioè cambia con quale pendenza arriva a $x_2$. <b>Partendo da $E$ appena sopra $V_{\rm min}$ e crescendo con continuità, si passa dalla divergenza verso l&rsquo;alto a quella verso il basso, e fra le due c&rsquo;è sempre un valore in cui la funzione decade.</b> Picasso lo dice così: <i>«tra le une e le altre c&rsquo;è sempre un valore di $E$ per cui $\psi(x)$ è una soluzione accettabile. Questi valori di $E$ — gli autovalori — chiaramente formano un insieme discreto»</i>.</p>
   <p>Ecco perché la quantizzazione è <b>un fatto di conteggio di condizioni</b>, non un postulato: un&rsquo;equazione del secondo ordine ha due costanti; una la consuma la normalizzazione, l&rsquo;altra il decadimento a un estremo; e il decadimento <i>all&rsquo;altro</i> estremo non ha più costanti a disposizione, quindi diventa una condizione su $E$. Una condizione su un parametro reale ha, generi­camente, soluzioni isolate.</p>`}
  ]},
  {t:'plot', title:'Il tiro, visto su un caso che si calcola',
   intro:R`<p>Nel segmento $(0,1)$ con pareti infinite la soluzione che si annulla a sinistra è $\psi(x)=\sin(kx)$ per ogni $k$: il primo bersaglio è centrato gratis. Il secondo bersaglio è $\psi(1)=0$, e lo si vede qui: tre valori vicini di $k$, e solo quello centrale arriva a zero in $x=1$. Gli altri due «mancano» da parti opposte, ed è esattamente la figura 7.7 di Picasso su un caso in cui le curve si disegnano in forma chiusa invece che qualitativamente.</p>`,
   plots:[{kind:'func2d', xr:[0,1.25], yr:[-1.3,1.3], height:300, ticks:true,
     title:'psi(x) = sin(kx) per tre valori di k, e il bersaglio in x = 1',
     curves:[{f:'Math.sin(2.5*Math.PI*x)', col:'#ffb86b', width:2.2, label:'k = 2.5 pi: manca per eccesso'},
             {f:'Math.sin(3*Math.PI*x)', col:'#5aa9ff', width:2.8, label:'k = 3 pi: CENTRA (autovalore)'},
             {f:'Math.sin(3.5*Math.PI*x)', col:'#ff6b8a', width:2.2, label:'k = 3.5 pi: manca per difetto'},
             {f:'0', col:'#666a75', width:1.2, label:'asse'}],
     xlabel:'x', ylabel:'psi'}],
   leggi:R`<p><b>Che cosa guardare.</b> In $x=1$ la curva arancione ($k=2{,}5\pi$) vale $\sin(2{,}5\pi)=+1$, la rosa ($k=3{,}5\pi$) vale $\sin(3{,}5\pi)=-1$, e solo la blu ($k=3\pi$) vale zero. Fra $2{,}5\pi$ e $3{,}5\pi$ il valore in $x=1$ passa con continuità da $+1$ a $-1$: <i>deve</i> attraversare lo zero, e lo attraversa una volta sola.</p>
   <p><b>Che cosa impararne.</b> La discretezza dello spettro è il teorema degli zeri applicato alla funzione $E\mapsto\psi_E(x_2)$ — dove $\psi_E$ è la soluzione che decade a sinistra. <b>La continuità in $E$ dà l&rsquo;esistenza dei livelli; la stretta monotonia fra due livelli consecutivi dà il fatto che siano isolati.</b> Si noti anche il conteggio dei nodi: la curva blu, che è l&rsquo;autofunzione, ha due zeri interni, e le due curve vicine ne hanno due e tre — i nodi aumentano con $k$, cioè con l&rsquo;energia, che è l&rsquo;osservazione da cui nasce la tappa 06.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Nel caso $V\to+\infty$ da entrambi i lati, quanti livelli ci sono?`,
    a:R`<b>Infiniti</b>, e l&rsquo;argomento non è il problema di tiro: è dimensionale. Picasso lo dà in una riga — <i>«il numero di autovalori deve essere infinito, perché lo spazio $\mathcal H$ dei vettori di stato ha dimensione infinita e... gli autovalori sono non degeneri»</i>. Se i livelli fossero in numero finito e ciascuno non degenere, le autofunzioni dell&rsquo;energia sarebbero un insieme finito, e un insieme finito non può essere una base completa di uno spazio di dimensione infinita — mentre le autofunzioni di un&rsquo;osservabile autoaggiunta devono essere complete. <i>È un argomento che usa il teorema di non degenerazione della tappa 07</i>, e per questo compare qui soltanto come annuncio: la catena logica è completezza + non degenerazione $\Rightarrow$ infinità dei livelli. In un potenziale che <i>non</i> confina da entrambi i lati, la completezza è garantita dall&rsquo;unione dello spettro discreto e di quello continuo, e il discreto può essere finito o vuoto.`},
   {q:R`Il problema di tiro dice che fra due autovalori consecutivi la soluzione diverge. Come si conta quanti autovalori ci sono sotto una data energia, in pratica?`,
    a:R`Si contano i <b>nodi</b> della soluzione che decade a sinistra, valutata a quell&rsquo;energia. Il numero di zeri che $\psi_E$ compie prima di $x_2$ cresce di uno ogni volta che $E$ attraversa un autovalore — ed è, nella sostanza, il teorema di oscillazione della tappa 06 usato al contrario. <i>È il modo in cui un calcolo numerico conta i livelli senza trovarli</i>: si integra l&rsquo;equazione da sinistra a destra a un&rsquo;energia di prova, si contano i cambi di segno, e quel numero è il numero di autovalori inferiori. In semiclassica lo stesso conteggio diventa la regola di quantizzazione di Bohr-Sommerfeld, in cui l&rsquo;integrale d&rsquo;azione su un periodo vale un multiplo intero di $h$ e misura quanti mezzi periodi ci stanno nella regione classicamente accessibile; ma quello è un altro corso.`}
  ]}
]},

/* ---------------- 06 · IL TEOREMA DI OSCILLAZIONE ---------------- */
{ num:'06', title:'Il teorema di oscillazione: lo stato fondamentale non ha nodi, l’n-esimo ne ha n', meta:'l argomento qualitativo dalla curvatura · la dimostrazione via ortogonalità per il primo eccitato · l enunciato generale e chi NON lo dimostra · tre convenzioni di indice',
  blocchi:[
  {t:'prosa', title:'Da dove viene l’idea', tag:'costruzione', html:R`
  <p>Il problema di tiro della tappa 05 ha già suggerito il fatto: aumentando $E$ aumenta la curvatura nella regione di tipo I, dunque la funzione oscilla più in fretta, dunque attraversa l&rsquo;asse più volte. Picasso lo deduce proprio così: <i>«aumentando l&rsquo;energia... soprattutto aumenta la curvatura di $\psi(x)$ nella regione fra $x_1$ e $x_2$, per cui $\psi(x)$ in questa regione può compiere più oscillazioni»</i>, e l&rsquo;autofunzione fondamentale <i>«non si annulla mai al finito, cioè non ha nodi»</i>.</p>
  <p>«Suggerire» però non è dimostrare, ed è utile vedere esattamente dove finisce l&rsquo;argomento qualitativo e dove comincia il teorema.</p>`},
  {t:'reveal', title:'Il pezzo che si dimostra: il primo eccitato DEVE avere un nodo', tag:'costruzione', steps:[
   {label:'L’argomento, in quattro righe', body:R`
   <p>Si ammetta il fatto sul fondamentale: $\psi_0$ non ha nodi, dunque ha segno definito (si prenda $\psi_0>0$ in tutto l&rsquo;intervallo). Si usi ora l&rsquo;ortogonalità fra autofunzioni di autovalori diversi, che vale per ogni osservabile autoaggiunta:</p>
   $$\int_{0}^{a}\psi_1(x)\psi_2(x)\,dx=0.$$
   <p>— qui scritta senza coniugati, perché la tappa 02 ha mostrato che si possono prendere funzioni reali, ed esibita su un caso concreto, le prime due autofunzioni del segmento. <b>Se $\psi_0$ ha segno definito e l&rsquo;integrale del prodotto è nullo, allora $\psi_1$ non può avere segno definito</b>: l&rsquo;integrale di un prodotto fra una funzione positiva e una funzione di segno costante sarebbe diverso da zero. Dunque $\psi_1$ cambia segno, dunque ha almeno un nodo. Picasso lo chiude in una riga: <i>«siccome $\psi_0(x)$ ha un segno definito, l&rsquo;integrale può essere nullo solo se $\psi_1(x)$ non ha un segno definito»</i>.</p>`},
   {label:'Che cosa resta non dimostrato, e chi lo dichiara', body:R`
   <p>L&rsquo;argomento dà «almeno un nodo», non «esattamente uno», e non si estende per induzione senza lavoro. L&rsquo;enunciato completo è il <b>teorema di oscillazione</b>: se $E_0<E_1<\dots<E_n<\dots$ sono gli autovalori discreti ordinati e $\psi_0,\psi_1,\dots$ le corrispondenti autofunzioni, allora $\psi_0$ non ha nodi, $\psi_1$ ne ha uno, e in generale $\psi_n$ ne ha $n$ (contati all&rsquo;interno del dominio).</p>
   <p><b>Picasso lo enuncia e dichiara di non dimostrarlo</b> — <i>«la validità di questo teorema, che non dimostriamo, è generale»</i> — e aggiunge due precisazioni che valgono più di molte dimostrazioni: la generalità non è ristretta al caso in cui $V$ abbia un solo minimo; e <i>«se $H$ possiede sia autovalori discreti che continui il teorema di oscillazione si applica però soltanto alle autofunzioni corrispondenti agli autovalori discreti»</i>. Nello stesso punto dichiara anche l&rsquo;ipotesi nascosta: <i>«è implicito nella formulazione di questo teorema che gli autovalori propri della hamiltoniana sono non degeneri, come dimostreremo fra poco»</i> — cioè il teorema di oscillazione <b>poggia</b> su quello della tappa 07, e non viceversa.</p>
   <p>Landau lo enuncia nella stessa forma e con lo stesso silenzio sulla dimostrazione, chiamandolo <i>«teorema delle oscillazioni»</i>, e dichiarando l&rsquo;ipotesi sul potenziale che Picasso lascia implicita: <i>«partiamo dal presupposto che, per $x\to\pm\infty$, la funzione $U(x)$ tenda a dei limiti finiti (ma non si richiede che sia monotona)»</i>. <b>Quell&rsquo;ipotesi è esattamente ciò che la tappa 11 romperà</b>, ed è la ragione per cui vale la pena averla letta qui invece di darla per scontata.</p>`},
   {label:'Tre convenzioni di indice, e un errore d’esame', body:R`
   <p>Lo stesso teorema è scritto in tre modi nelle tre fonti, e vale fissarli perché la confusione costa un esercizio:</p>
   <p>— <b>Picasso</b> numera da zero: $E_0$ è il fondamentale e $\psi_n$ ha $n$ nodi. Quindi $\psi_0$ ne ha zero.</p>
   <p>— <b>Landau</b> numera il livello dalla sua posizione in graduatoria: <i>«la funzione $\psi_n(x)$ corrispondente al $(n+1)$-esimo (in grandezza) autovalore $E_n$ si annulla $n$ volte (per valori finiti di $x$)»</i>. È la stessa cosa, detta contando i livelli da uno e le funzioni da zero.</p>
   <p>— <b>Griffiths</b>, nel segmento, numera da uno: $\psi_1$ è il fondamentale, e la sua proprietà 2 dice <i>«as you go up in energy, each successive state has one more node (zero-crossing): $\psi_1$ has none (the end points don&rsquo;t count), $\psi_2$ has one, $\psi_3$ has two»</i>. Quindi <b>$\psi_n$ di Griffiths ha $n-1$ nodi</b>.</p>
   <p>La parentesi di Griffiths — «the end points don&rsquo;t count» — e la nota in calce di Landau — <i>«se la particella può trovarsi solo su un segmento limitato dell&rsquo;asse delle $x$, bisogna parlare allora di zeri della funzione $\psi_n(x)$ su questo segmento»</i> — dicono la stessa cosa: <b>gli zeri agli estremi, imposti dalle condizioni al contorno, non sono nodi.</b> Se si contassero, ogni autofunzione del segmento avrebbe due nodi in più e il teorema sarebbe falso in tutte e tre le convenzioni.</p>
   <p>Sul segmento si verifica: la terza autofunzione, $\psi_3=\sqrt{2/a}\sin(3\pi x/a)$, ha due zeri interni, in $x=a/3$ e in</p>
   $$\psi_3(2a/3)=\sin(2\pi)=0.$$`}
  ]},
  {t:'plot', title:'I nodi che si contano',
   intro:R`<p>Le prime tre autofunzioni del segmento $(0,1)$. Si contino gli attraversamenti dell&rsquo;asse <i>interni</i>: zero, uno, due. Gli estremi non si contano, e si vede perché: lì ogni curva si annulla per costruzione, non per oscillazione.</p>`,
   plots:[{kind:'func2d', xr:[0,1], yr:[-1.6,1.6], height:300, ticks:true,
     title:'psi_1, psi_2, psi_3 nel segmento (a = 1)',
     curves:[{f:'Math.sqrt(2)*Math.sin(Math.PI*x)', col:'#5aa9ff', width:2.6, label:'psi_1: 0 nodi'},
             {f:'Math.sqrt(2)*Math.sin(2*Math.PI*x)', col:'#9b8cff', width:2.4, label:'psi_2: 1 nodo (x = 1/2)'},
             {f:'Math.sqrt(2)*Math.sin(3*Math.PI*x)', col:'#ff6b8a', width:2.4, label:'psi_3: 2 nodi (x = 1/3, 2/3)'},
             {f:'0', col:'#666a75', width:1.2, label:'asse'}],
     xlabel:'x', ylabel:'psi'}],
   leggi:R`<p><b>Che cosa guardare.</b> La curva blu non attraversa mai l&rsquo;asse fra $0$ e $1$; la viola lo attraversa una volta, esattamente al centro; la rosa due volte, a un terzo e a due terzi. <i>Le posizioni dei nodi sono equispaziate</i>, e questo è un accidente del potenziale costante: in un potenziale non costante i nodi si addensano dove l&rsquo;energia cinetica è maggiore, cioè dove $V$ è più basso.</p>
   <p><b>Che cosa impararne.</b> La figura mostra anche l&rsquo;alternanza di parità rispetto al centro del segmento, che è il risultato della tappa 07: la blu è pari rispetto a $x=1/2$, la viola dispari, la rosa pari. <b>Nodi e parità non sono due fatti indipendenti</b>: una funzione dispari rispetto al centro deve annullarsi al centro, quindi ha un numero dispari di nodi; una pari, se si annullasse al centro, avrebbe lì uno zero doppio (perché anche la derivata, che è dispari, si annullerebbe) — vietato dalla tappa 04. <i>È da qui che il teorema di oscillazione e quello di non degenerazione, messi insieme, costringono le parità ad alternarsi.</i></p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Per la particella libera le autofunzioni $\sin(kx)$ hanno infiniti nodi per ogni $k$, e l&rsquo;energia è arbitrariamente piccola. Il teorema di oscillazione è violato?`,
    a:R`No, perché <b>il teorema parla solo dello spettro discreto</b>, e Picasso lo dichiara nel punto in cui lo enuncia. Per lo spettro continuo l&rsquo;enunciato non ha nemmeno senso: non esiste un «$n$-esimo» autovalore da cui contare, perché gli autovalori non si possono ordinare in una successione, e le autofunzioni non sono normalizzabili. <i>Il numero di nodi di un&rsquo;autofunzione impropria è sempre infinito</i>, e non distingue un livello dall&rsquo;altro. È lo stesso motivo per cui il conteggio dei nodi della tappa 05 serve a contare quanti livelli <b>discreti</b> stanno sotto una data energia, e si ferma quando il discreto finisce.`},
   {q:R`L&rsquo;argomento dell&rsquo;ortogonalità dimostra che $\psi_1$ ha almeno un nodo. Perché non si può iterare per avere $\psi_2$ con almeno due?`,
    a:R`Perché l&rsquo;ortogonalità di $\psi_2$ con $\psi_0$ dice solo che $\psi_2$ cambia segno almeno una volta, e l&rsquo;ortogonalità con $\psi_1$ — che a sua volta cambia segno — <b>non dà nessuna conclusione immediata</b>: l&rsquo;integrale del prodotto di due funzioni che cambiano entrambe segno può annullarsi in infiniti modi, con un nodo o con cento. L&rsquo;argomento elementare dà una disuguaglianza sul numero di cambi di segno e si ferma lì. <i>La dimostrazione vera del teorema di oscillazione è un risultato di teoria di Sturm-Liouville</i> — il teorema di confronto di Sturm, che confronta gli zeri di due soluzioni di equazioni con coefficienti ordinati — e non è un corollario dell&rsquo;ortogonalità. Picasso e Landau lo omettono entrambi, e dichiararlo omesso è più onesto che presentare l&rsquo;argomento dell&rsquo;ortogonalità come se fosse la dimostrazione.`}
  ]}
]},

/* ---------------- 07 · IL TEOREMA DI NON DEGENERAZIONE ---------------- */
{ num:'07', title:'Il teorema di non degenerazione, dimostrato: il wronskiano, e perché basta un solo lato', meta:'la dimostrazione per intero · la costante del wronskiano e dove si annulla · l affinamento che salva lo spettro continuo · parità obbligata e alternanza',
  blocchi:[
  {t:'prosa', title:'L’enunciato, e perché è questo il cuore del movimento', tag:'costruzione', html:R`
  <p><b>Teorema di non degenerazione.</b> Per ogni sistema unidimensionale, gli autovalori <i>discreti</i> della hamiltoniana sono non degeneri.</p>
  <p>È l&rsquo;enunciato che il programma nomina per nome, ed è l&rsquo;esatto contrario di quello che vale per la particella libera, dove ogni livello è doppiamente degenere. La differenza non sta nell&rsquo;equazione — è la stessa — ma nella <b>condizione al contorno</b>: uno stato legato deve svanire all&rsquo;infinito, e quella richiesta consuma esattamente la libertà che nel caso libero produceva la degenerazione. La dimostrazione rende questa frase un conto.</p>`},
  {t:'reveal', title:'La dimostrazione, per intero', tag:'costruzione', steps:[
   {label:'Il punto di partenza: due autofunzioni allo stesso autovalore', body:R`
   <p>Siano $\psi_1$ e $\psi_2$ due autofunzioni di $H$ con lo stesso autovalore $E$. Entrambe soddisfano la stessa equazione:</p>
   $$\psi_1''=\frac{2m}{\hbar^{2}}\big(V-E\big)\psi_1,\qquad \psi_2''=\frac{2m}{\hbar^{2}}\big(V-E\big)\psi_2.$$
   <p>Si moltiplichi la prima per $\psi_2$, la seconda per $\psi_1$, e si sottragga. <b>Il membro di destra si cancella identicamente</b>, perché il fattore $\frac{2m}{\hbar^{2}}(V-E)$ è lo stesso nelle due equazioni — ed è qui che si usa, in modo essenziale, che l&rsquo;autovalore sia lo stesso. Resta che la combinazione $\psi_1''\psi_2-\psi_2''\psi_1$ è identicamente nulla.</p>`},
   {label:'Il wronskiano, e perché è una derivata esatta', body:R`
   <p>Quella combinazione non è un oggetto qualunque: è la derivata di un&rsquo;altra. Lo si verifica derivando, con la regola del prodotto, e i due termini misti si elidono:</p>
   $$\frac{d}{dx}\big(\psi_1\psi_2'-\psi_1'\psi_2\big)=\psi_1\psi_2''-\psi_1''\psi_2.$$
   <p>La quantità $W=\psi_1\psi_2'-\psi_1'\psi_2$ si chiama <b>wronskiano</b> delle due soluzioni, e il conto appena fatto dice che la sua <span class="str" data-str="derivazione">derivata</span> è il membro di sinistra dell&rsquo;equazione precedente, cioè zero. Dunque</p>
   $$\psi_1\psi_2'-\psi_1'\psi_2=\text{costante}.$$`},
   {label:'Dove si annulla la costante — ed è tutto il teorema', body:R`
   <p>La costante si determina guardando un solo punto, e conviene guardarne uno dove si sappia qualcosa: l&rsquo;infinito. <b>Siccome per ipotesi $E$ è un autovalore discreto, sia $\psi_1$ sia $\psi_2$ tendono a zero per $x\to\pm\infty$</b>, e con esse il wronskiano. Una costante che vale zero in un punto vale zero sempre:</p>
   $$\psi_1\psi_2'-\psi_1'\psi_2=0\quad\text{su tutto l'asse.}$$
   <p>Da qui in due passaggi. Dividendo per $\psi_1\psi_2$ dove non si annullano, si ottiene che le due derivate logaritmiche coincidono — $\psi_1'/\psi_1$ da una parte, $\psi_2'/\psi_2$ dall&rsquo;altra — e integrando $\log\psi_1=\log\psi_2+\text{cost}$, ossia $\psi_1=C\psi_2$. <b>Le due autofunzioni non sono indipendenti, dunque $E$ non è degenere.</b></p>
   <p>Il motivo per cui la costante moltiplicativa sopravvive e non si determina è che è <i>lei</i> la risposta: la derivata logaritmica non la vede,</p>
   $$\frac{d}{dx}\log\big(C\psi_2(x)\big)=\frac{\psi_2'(x)}{\psi_2(x)},$$
   <p>e questo è precisamente il contenuto fisico dell&rsquo;enunciato — l&rsquo;autospazio ha dimensione uno, e l&rsquo;unica libertà residua è la normalizzazione, che non è uno stato nuovo.</p>`},
   {label:'L’affinamento, che Picasso e Landau dichiarano entrambi', body:R`
   <p>C&rsquo;è un dettaglio nella dimostrazione che vale più di quanto sembri, e <b>entrambe le fonti lo segnalano nello stesso punto</b>. Per concludere che la costante è zero <i>non serve</i> che le due funzioni svaniscano da entrambi i lati: basta che svaniscano <b>da uno</b>. Picasso lo mette fra parentesi avvertendo che servirà: <i>«(si noti, e questo ci sarà utile in seguito: affinché la costante al secondo membro della (7.13) sia nulla, è sufficiente che $\psi_1$ e $\psi_2$ si annullino o per $x\to+\infty$ o per $x\to-\infty$)»</i>. Landau lo dice identico: <i>«si osservi, a questo scopo, che per la dimostrazione riportata prima è sufficiente (per lo spettro discreto) che le funzioni $\psi_1$ e $\psi_2$ si annullino all&rsquo;infinito almeno in una delle direzioni»</i>.</p>
   <p>È l&rsquo;osservazione che rende il teorema utile <b>anche per una parte dello spettro continuo</b>, e la tappa 08 la userà esattamente così: se il potenziale confina solo a sinistra, le autofunzioni improprie dello spettro continuo svaniscono comunque a $-\infty$, e dunque sono non degeneri malgrado non siano normalizzabili. <i>Senza l&rsquo;affinamento, metà dello schema della tappa 08 non si potrebbe dimostrare.</i></p>`}
  ]},
  {t:'reveal', title:'Il caso libero, come controprova: dove la costante NON si annulla', tag:'costruzione', steps:[
   {label:'Il conto', body:R`
   <p>Il modo migliore di controllare una dimostrazione è applicarla a un caso dove la tesi è falsa, e vedere quale passaggio si rompe. Per la particella libera $\psi_1=\sin(kx)$ e $\psi_2=\cos(kx)$ sono due soluzioni indipendenti con lo <i>stesso</i> autovalore $E=\hbar^{2}k^{2}/2m$. Il wronskiano:</p>
   $$\sin(kx)\cdot\big(-k\sin(kx)\big)-k\cos(kx)\cdot\cos(kx)=-k.$$
   <p><b>Costante, come il teorema prevede — e diversa da zero.</b> Il passaggio che si rompe è l&rsquo;ultimo e solo l&rsquo;ultimo: la derivata del wronskiano è nulla anche qui, ma non esiste nessun punto in cui le due funzioni svaniscano, nemmeno da un lato, perché nessuna delle due tende a zero all&rsquo;infinito. Non c&rsquo;è dove valutare la costante, e la costante non è zero.</p>`},
   {label:'Che cosa insegna', body:R`
   <p>La degenerazione dello spettro continuo e la non degenerazione di quello discreto <b>sono lo stesso teorema con un dato diverso</b>. In entrambi i casi il wronskiano è costante; in un caso quella costante è obbligata a zero da una condizione al contorno, nell&rsquo;altro no. Detto in termini di conteggio: un&rsquo;equazione del secondo ordine ha due soluzioni indipendenti, e la domanda è quante di esse <i>sopravvivono</i> alle richieste che si fanno. Due richieste (decadimento ai due estremi) lasciano una soluzione, e solo per valori isolati di $E$; una richiesta sola ne lascia una per <i>ogni</i> $E$; nessuna richiesta ne lascia due per ogni $E$. <i>Lo schema della tappa 08 non è altro che questo conteggio, scritto come tabella.</i></p>`}
  ]},
  {t:'reveal', title:'Le due conseguenze immediate: parità obbligata, e alternanza', tag:'costruzione', steps:[
   {label:'Parità obbligata', body:R`
   <p>Si supponga ora che il potenziale sia pari. La tappa 02 ha stabilito che $H$ e $I$ commutano, dunque hanno un insieme completo di autofunzioni simultanee — ma questo da solo permetterebbe che una generica autofunzione di $H$ non abbia parità definita, come accade per la particella libera. <b>Con la non degenerazione quella possibilità sparisce</b>: se l&rsquo;autospazio ha dimensione uno, l&rsquo;autofunzione a parità definita che vi si trova <i>è</i> l&rsquo;autofunzione, a meno di un fattore. Picasso lo scrive così: <i>«siccome gli autovalori discreti di $H$ sono non degeneri, ogni autofunzione di $H$ corrispondente ad un autovalore discreto deve essere anche autofunzione di $I$, cioè deve avere parità definita»</i>.</p>
   <p><b>Questo è il punto in cui l&rsquo;ordine logico dichiarato nella tappa 02 si paga.</b> La via di Landau alla parità presupponeva la non degenerazione; la via di Picasso, con l&rsquo;operatore $I$ e la completezza delle sue autofunzioni, non la presupponeva. Ora che la non degenerazione è dimostrata, le due vie convergono — ma soltanto ora, e soltanto per lo spettro discreto.</p>`},
   {label:'Alternanza: pari, dispari, pari, dispari', body:R`
   <p>Mettendo insieme la parità obbligata con il teorema di oscillazione si ottiene un risultato che si ricorda e si usa in ogni esercizio. L&rsquo;argomento, in tre passi, è quello di Picasso:</p>
   <p><b>1.</b> Una funzione a parità definita che si annulla in un punto $x\neq0$ si annulla anche in $-x$: <i>gli zeri vengono a coppie</i>, tranne eventualmente quello nell&rsquo;origine.</p>
   <p><b>2.</b> Una funzione <i>dispari</i> deve annullarsi nell&rsquo;origine, perché $f(0)=-f(0)$. Una funzione <i>pari</i>, invece, <b>non può</b> annullarsi nell&rsquo;origine: se lo facesse, anche la sua derivata — che è dispari — vi si annullerebbe, e si avrebbe uno zero di ordine due, vietato dalla tappa 04.</p>
   <p><b>3.</b> Dunque le funzioni pari hanno un numero <i>pari</i> di nodi e le dispari un numero <i>dispari</i>. Per il teorema di oscillazione $\psi_n$ ha $n$ nodi; dunque $\psi_0,\psi_2,\psi_4,\dots$ sono pari e $\psi_1,\psi_3,\dots$ sono dispari. <b>Le parità si alternano, e lo stato fondamentale è sempre pari.</b></p>
   <p>Landau arriva alla stessa conclusione per la via più corta — <i>«la funzione d&rsquo;onda dello stato fondamentale è pari: infatti, essa non può avere dei nodi mentre una funzione dispari si annulla in ogni caso per $x=0$»</i> — e la tappa 10 verificherà l&rsquo;alternanza su un caso numerico, dove i cinque livelli di una buca finita vengono fuori nell&rsquo;ordine pari, dispari, pari, dispari, pari senza che nessuno l&rsquo;abbia imposto.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`In tre dimensioni i livelli dell&rsquo;atomo di idrogeno sono degeneri. Il teorema è falso?`,
    a:R`No: il teorema dice <b>unidimensionale</b>, e l&rsquo;ipotesi è essenziale. Il passaggio che cade è il wronskiano: in una dimensione l&rsquo;equazione agli autovalori è un&rsquo;ODE del secondo ordine e la combinazione $\psi_1\psi_2'-\psi_1'\psi_2$ è una derivata esatta; in tre dimensioni l&rsquo;analogo è $\nabla\cdot(\psi_1\nabla\psi_2-\psi_2\nabla\psi_1)$, la cui integrazione dà un flusso attraverso una superficie e <i>non</i> una costante scalare che si annulla puntualmente. <b>La degenerazione dell&rsquo;idrogeno è invece una conseguenza del teorema di DEGENERAZIONE della tappa 03</b>: $H$ commuta con $L^{2}$ e con $L_z$, che commutano fra loro, ma anche con le componenti $L_x$ e $L_y$, che non commutano con $L_z$ — tre osservabili, due delle quali incompatibili, ed è la configurazione che quel teorema richiede. <i>I due teoremi non si contraddicono: si applicano in dimensioni diverse, e nel caso unidimensionale la seconda simmetria non c&rsquo;è.</i>`},
   {q:R`Il teorema vale per gli autovalori discreti. Un sistema unidimensionale può avere autovalori discreti DEGENERI in qualche circostanza?`,
    a:R`Sì, e vale sapere dove sta la falla: se il dominio è <b>disconnesso</b>. Due buche infinite separate da una barriera infinita sono, matematicamente, due problemi indipendenti, e i loro livelli coincidono se le buche hanno la stessa larghezza: un livello doppiamente degenere, con autofunzioni «tutta nella prima buca» e «tutta nella seconda». Il passaggio che si rompe è l&rsquo;integrazione finale, $\log\psi_1=\log\psi_2+\text{cost}$: quella costante è la stessa solo su un intervallo <i>connesso</i>, e con due componenti se ne hanno due. <i>È il caso che in fisica dello stato solido genera le bande</i>: una barriera alta ma finita riconnette il dominio, la degenerazione si rompe, e i due livelli si separano di una quantità esponenzialmente piccola nello spessore della barriera.`}
  ]}
]},

/* ---------------- 08 · LO SCHEMA COMPLETO ---------------- */
{ num:'08', title:'Lo schema completo: il tipo di spettro dipende solo dal tipo di regioni all’infinito', meta:'i quattro casi di Picasso · le forme asintotiche di Landau · perché II-II dà il discreto e I-I il doppiamente degenere · il quinto caso, le bande',
  blocchi:[
  {t:'prosa', title:'Che cosa si è accumulato, e come si organizza', tag:'architettura', html:R`
  <p>Le tappe 04-07 hanno prodotto quattro strumenti: il segno della curvatura decide se la funzione oscilla o diverge; $E$ deve stare sopra $V_{\rm min}$; il decadimento a un estremo consuma una costante e quello al secondo estremo quantizza; il wronskiano è costante e si annulla se le due soluzioni svaniscono <b>da un solo lato</b>. Messi insieme danno un risultato che è più forte di ciascuno di essi, e che Picasso formula come una classificazione: <b>per un dato potenziale e un dato intervallo di energie, il tipo di autovalori e il loro grado di degenerazione dipendono esclusivamente dal tipo di regione che si ha per $x\to-\infty$ e per $x\to+\infty$.</b> Non dalla forma del potenziale in mezzo, non dal numero di minimi, non dalla profondità: solo dai due comportamenti all&rsquo;infinito.</p>`},
  {t:'reveal', title:'I quattro casi, e la ragione di ciascuno', tag:'costruzione', steps:[
   {label:'La tabella', body:R`
   <table class="tab">
   <thead><tr><th>regione a $x\to-\infty$</th><th>regione a $x\to+\infty$</th><th><span class="str" data-str="spettro">spettro</span></th><th>degenerazione</th></tr></thead>
   <tbody>
   <tr><td>II</td><td>II (tutto l&rsquo;asse di tipo II)</td><td>nessun autovalore</td><td>&mdash;</td></tr>
   <tr><td>II</td><td>II</td><td>discreto</td><td>non degenere</td></tr>
   <tr><td>II</td><td>I &nbsp;(oppure I, II)</td><td>continuo</td><td>non degenere</td></tr>
   <tr><td>I</td><td>I</td><td>continuo</td><td>doppiamente degenere</td></tr>
   </tbody></table>
   <p>La prima e la seconda riga si distinguono per l&rsquo;esistenza, in mezzo, di almeno una regione di tipo I: se tutto l&rsquo;asse è di tipo II non c&rsquo;è nulla ($E<V_{\rm min}$, tappa 05); se c&rsquo;è una regione di tipo I in mezzo e due di tipo II ai lati, si è nel caso degli stati legati.</p>`},
   {label:'Riga 2: due decadimenti, dunque discreto e non degenere', body:R`
   <p>Entrambe le regioni esterne sono di tipo II: la soluzione deve decadere ai due estremi. La tappa 05 ha mostrato che questo si può fare solo per valori isolati di $E$ — <b>spettro discreto</b> — e la tappa 07 che allora il wronskiano si annulla — <b>non degenere</b>. È il caso di tutti gli stati legati di questo movimento: il segmento, la buca finita sotto il bordo, l&rsquo;oscillatore armonico.</p>
   <p>Nel caso particolare in cui $V\to+\infty$ da entrambi i lati, questa è la <i>sola</i> riga possibile, per qualunque $E$: lo spettro è interamente discreto e, per l&rsquo;argomento di completezza della tappa 05, infinito.</p>`},
   {label:'Riga 3: un decadimento solo, dunque continuo ma non degenere', body:R`
   <p>Un potenziale che diverge a $-\infty$ e tende a zero a $+\infty$, con $E>0$: a sinistra regione di tipo II, a destra di tipo I. Ora <b>non c&rsquo;è nessun bersaglio a destra</b>: la soluzione generale asintotica a destra è una combinazione di onde piane, e <i>ogni</i> combinazione resta limitata. Picasso lo dice con enfasi: <i>«contrariamente ai casi precedentemente discussi, non c&rsquo;è più il problema di trovare una soluzione che si comporti "bene" anche per $x\to+\infty$: nessuna $\psi(x)$ tende a zero per $x\to+\infty$, ma tutte le soluzioni restano limitate»</i>. Dunque <b>ogni $E>0$ è autovalore improprio: lo spettro è continuo.</b></p>
   <p>E la degenerazione? Qui serve l&rsquo;affinamento della tappa 07: le soluzioni accettabili <i>svaniscono</i> a $-\infty$, cioè da un lato — e tanto basta per annullare il wronskiano. Dunque <b>non degenere</b>, e Picasso lo argomenta anche in modo diretto: <i>«si capisce che è possibile per ogni $E$ trovare una soluzione della (7.11) che tende a zero per $x\to-\infty$, ma non più di una, a meno di un fattore»</i>. Landau dà la stessa cosa scrivendo le due forme asintotiche: a destra <i>«soluzioni del tipo onda piana stazionaria»</i> con $k=\sqrt{2mE}/\hbar$, a sinistra <i>«la soluzione non tendente all&rsquo;infinito»</i> — una sola delle due esponenziali — e commenta che <i>«la funzione d&rsquo;onda diminuisce esponenzialmente all&rsquo;interno della regione dove $E<U$»</i>.</p>`},
   {label:'Riga 4: nessun vincolo, dunque doppiamente degenere', body:R`
   <p>Un potenziale che tende a limiti finiti $V_1$ e $V_2$ ai due estremi, con $E>\max(V_1,V_2)$: entrambe le regioni esterne sono di tipo I. Ora le soluzioni asintotiche sono combinazioni di onde piane da <i>entrambi</i> i lati, e si verifica che ciascuna di esse risolve l&rsquo;equazione asintotica:</p>
   $$-\frac{\hbar^{2}}{2m}\frac{d^{2}}{dx^{2}}e^{-ik'x}+V_{2}e^{-ik'x}=\Big(V_{2}+\frac{\hbar^{2}k'^{2}}{2m}\Big)e^{-ik'x}$$
   <p>con $k'=\sqrt{2m(E-V_{2})}/\hbar$, e lo stesso per $e^{+ik'x}$. <b>Nessuna soluzione va scartata</b>, dunque sopravvivono tutte e due le soluzioni indipendenti dell&rsquo;equazione del secondo ordine, e Picasso conclude: <i>«siccome l&rsquo;equazione di Schrödinger è del secondo ordine, le soluzioni indipendenti sono due... e quindi ogni $E>V_2$ è autovalore improprio doppiamente degenere»</i>. Landau dà la stessa conclusione dalla stessa ragione — <i>«ciò è dovuto al fatto che... ambedue le soluzioni indipendenti soddisfano le condizioni richieste all&rsquo;infinito»</i> — e aggiunge la lettura fisica: <i>«il termine contenente $e^{ikx}$ corrisponde a una particella che si muove verso destra, e il termine contenente $e^{-ikx}$ a una particella che si muove verso sinistra»</i>.</p>
   <p>È il caso della particella libera, dove $V_1=V_2=0$, e la doppia degenerazione che quel caso esibisce non è una sua peculiarità: <b>è la riga 4 della tabella.</b></p>`},
   {label:'Il quinto caso, dichiarato e non trattato', body:R`
   <p>La tabella non esaurisce le possibilità, e Picasso lo dice: <i>«questi non sono tutti i casi possibili: può infatti accadere (come ad esempio nel caso di un potenziale $V(x)$ periodico) che per $x\to-\infty$ o per $x\to+\infty$, o per entrambi, si abbia un alternarsi di regioni I e II»</i>. Lì nessuna delle quattro righe si applica, e il risultato è <i>«una specie di "compromesso" fra gli autovalori discreti e quelli continui: i livelli energetici presentano una struttura a bande, cioè gruppi discreti di autovalori continui (le bande talvolta possono anche sovrapporsi parzialmente)»</i>.</p>
   <p>Vale registrare che questo è il caso di <b>tutta</b> la fisica dei solidi: un cristallo è un potenziale periodico, e la struttura a bande che Picasso lascia qui in una riga è ciò che distingue un conduttore da un isolante. Il fatto che lo schema non la copra non è un difetto dello schema — è il segnale che la periodicità è una condizione all&rsquo;infinito di specie diversa, e richiede strumenti propri.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Una buca rettangolare finita ha, al variare di $E$, quali righe della tabella?`,
    a:R`<b>Due</b>, e il confine è il bordo della buca. Per $0<E<V_0$ (misurando l&rsquo;energia dal fondo, come fa Picasso) le due regioni esterne sono di tipo II: riga 2, spettro discreto e non degenere, in numero finito. Per $E>V_0$ entrambe le regioni esterne diventano di tipo I: riga 4, spettro continuo e doppiamente degenere. <i>Lo stesso potenziale porta due righe diverse della tabella in due intervalli di energia diversi</i>, e questo è esattamente ciò che la voce Q.12 del programma chiede quando dice «buca rettangolare di potenziale, spettro discreto <b>e spettro continuo</b>»: non sono due problemi, è un problema con due regimi, e la tabella dice quale vale dove.`},
   {q:R`La tabella si basa sul tipo di regione all&rsquo;infinito. Che ipotesi sta usando sul potenziale, e non dice?`,
    a:R`Sta usando che <b>$V(x)$ tenda a un limite</b> (finito o infinito) per $x\to\pm\infty$, in modo che «il tipo di regione all&rsquo;infinito» sia una cosa ben definita. Landau la dichiara esplicitamente quando enuncia il teorema di oscillazione — <i>«partiamo dal presupposto che, per $x\to\pm\infty$, la funzione $U(x)$ tenda a dei limiti finiti»</i> — e Picasso la nomina solo in negativo, escludendo il caso periodico. <i>Un potenziale che oscilla all&rsquo;infinito senza tendere a niente, e senza essere periodico, non è coperto da nessuna riga</i>, e la tappa 11 mostra che in quel caso succede qualcosa che la tabella non prevede: un autovalore discreto dentro il continuo. <b>L&rsquo;ipotesi tacita non è una pignoleria: è il luogo dove la classificazione si rompe.</b>`}
  ]}
]},

/* ---------------- 09 · LA PARTICELLA SU UN SEGMENTO ---------------- */
{ num:'09', title:'La particella su un segmento, fino all’ultimo coefficiente', meta:'la condizione al contorno come regola generale · gli autovalori e la normalizzazione · ortogonalità dimostrata e completezza · uno stato iniziale sviluppato per intero, con Parseval come controllo · il numero in elettronvolt',
  blocchi:[
  {t:'prosa', title:'Il problema, e perché si risolve in dieci righe', tag:'costruzione', html:R`
  <p>È il caso più semplice della riga 2 della tabella, e tutto ciò che le tappe precedenti hanno stabilito si applica senza modifiche: lo spettro sarà discreto, infinito, non degenere, con parità alternate rispetto al centro e con $\psi_n$ dotata di $n-1$ nodi interni. <b>Non c&rsquo;è niente da scoprire; c&rsquo;è da calcolare.</b> Picasso dichiara proprio questo quando sceglie di non ricavarlo come limite della buca finita: <i>«potremmo partire dal caso già discusso in cui $V_0$ è finito e poi passare al limite $V_0\to\infty$, però è più istruttivo trattare il problema ex novo»</i>.</p>
  <p>Il potenziale è nullo in $(0,a)$ e infinito fuori, e la condizione al contorno è quella che la tappa 01 ha giustificato: <b>$\psi$ continua, dunque nulla agli estremi, e nessuna condizione sulla derivata.</b> Picasso la enuncia come regola generale, e vale ripetere la parte che si dimentica: quelle condizioni <i>«vanno imposte tutte le volte che si vogliono trovare autofunzioni di $H$ quando $V_0=\infty$ per $|x|>a$, e qualunque sia la forma di $V(x)$ per $|x|<a$»</i> — anche, per esempio, per un oscillatore armonico confinato in una scatola. La parete infinita non è parte del potenziale da risolvere: è il bordo del dominio.</p>`},
  {t:'reveal', title:'Autovalori e autofunzioni', tag:'costruzione', steps:[
   {label:'La soluzione generale e le due condizioni', body:R`
   <p>Dentro il segmento $V=0$, dunque</p>
   $$\psi''(x)=-k^{2}\psi(x),\qquad k=\frac{\sqrt{2mE}}{\hbar},$$
   <p>con soluzione generale $\psi(x)=A\sin kx+B\cos kx$. Si noti che si è assunto $E>0$: lecito per la tappa 05, perché $V_{\rm min}=0$.</p>
   <p>La condizione $\psi(0)=0$ dà $B=0$. La condizione $\psi(a)=0$ dà $A\sin ka=0$, e siccome $A=0$ darebbe la soluzione nulla, resta $\sin ka=0$, cioè $ka=n\pi$. Griffiths segnala il fatto curioso e centrale: <i>«the boundary condition at $x=a$ does not determine the constant $A$, but rather the constant $k$, and hence the possible values of $E$»</i>. <b>La seconda condizione al contorno non fissa un&rsquo;ampiezza: quantizza un&rsquo;energia</b>, ed è il meccanismo della tappa 05 visto nel caso in cui si risolve in forma chiusa.</p>
   <p>Gli interi da tenere sono i positivi: $n=0$ dà $\psi\equiv0$, e i negativi non danno nulla di nuovo perché il seno è dispari, cioè danno la stessa funzione a meno del segno — che è lo stesso stato.</p>`},
   {label:'Gli autovalori, e la verifica diretta', body:R`
   <p>Da $k_n=n\pi/a$ segue</p>
   $$E_n=\frac{\hbar^{2}k_n^{2}}{2m}=\frac{n^{2}\pi^{2}\hbar^{2}}{2ma^{2}},\qquad n=1,2,3,\dots$$
   <p>e la verifica per sostituzione diretta, che è il controllo da fare sempre perché non ripassa per il ragionamento che ha prodotto il risultato:</p>
   $$-\frac{\hbar^{2}}{2m}\frac{d^{2}}{dx^{2}}\Big[\sqrt{\tfrac{2}{a}}\sin\Big(\frac{n\pi x}{a}\Big)\Big]=\frac{n^{2}\pi^{2}\hbar^{2}}{2ma^{2}}\sqrt{\frac{2}{a}}\sin\Big(\frac{n\pi x}{a}\Big).$$
   <p>Griffiths commenta il contrasto con il caso classico senza addolcirlo: <i>«in radical contrast to the classical case, a quantum particle in the infinite square well cannot have just any old energy — it has to be one of these special allowed values»</i>.</p>`},
   {label:'La normalizzazione', body:R`
   <p>Resta $A$, e lo fissa la normalizzazione:</p>
   $$\int_{0}^{a}\frac{2}{a}\sin^{2}\Big(\frac{\pi x}{a}\Big)dx=1,$$
   <p>e lo stesso valore $A=\sqrt{2/a}$ serve per ogni $n$, perché l&rsquo;integrale generale vale</p>
   $$\int_{0}^{a}\frac{2}{a}\sin^{2}\Big(\frac{n\pi x}{a}\Big)dx=1\quad\text{per ogni }n\text{ intero}$$
   <p>— la media di $\sin^{2}$ su un numero intero di semiperiodi è $1/2$, qualunque sia quel numero. La fase di $A$ non ha significato fisico e si prende reale positiva. Dunque</p>
   $$\psi_n(x)=\sqrt{\frac{2}{a}}\,\sin\Big(\frac{n\pi x}{a}\Big),\qquad 0<x<a.$$`}
  ]},
  {t:'reveal', title:'Le quattro proprietà, e quali sono generali', tag:'costruzione', steps:[
   {label:'Parità e nodi', body:R`
   <p>Le $\psi_n$ sono <b>alternativamente pari e dispari rispetto al centro</b> del segmento, e hanno $n-1$ nodi interni: è l&rsquo;alternanza della tappa 07 e il teorema di oscillazione della 06, ritrovati su un caso esplicito. Griffiths, che numera da uno, scrive le due proprietà in questa convenzione — <i>«they are alternately even and odd, with respect to the center of the well: $\psi_1$ is even, $\psi_2$ is odd, $\psi_3$ is even»</i> e <i>«$\psi_1$ has none (the end points don&rsquo;t count), $\psi_2$ has one, $\psi_3$ has two»</i> — e in nota aggiunge il motivo per cui alcuni autori centrano la buca nell&rsquo;origine: così i pari diventano coseni e i dispari seni, e la parità si legge dalla formula.</p>`},
   {label:'Ortogonalità, dimostrata', body:R`
   <p>L&rsquo;ortogonalità non si assume: si calcola. Con la formula di prostaferesi il prodotto di due seni diventa una differenza di coseni, e l&rsquo;integrale su $(0,a)$ di $\cos\big(\frac{(m\mp n)\pi x}{a}\big)$ è un seno valutato in multipli interi di $\pi$, dunque zero. Sul caso $m=1$, $n=2$:</p>
   $$\int_{0}^{a}\psi_1(x)\psi_2(x)\,dx=0.$$
   <p>Griffiths segnala il punto in cui l&rsquo;argomento <i>non</i> funziona, e la domanda retorica vale come esercizio: <i>«note that this argument does not work if $m=n$. (Can you spot the point at which it fails?)»</i> — fallisce perché il denominatore $m-n$ si annulla, e in quel caso il valore è $1$ per normalizzazione. Le due cose insieme si scrivono con la delta di Kronecker: l&rsquo;integrale di $\psi_m\psi_n$ vale uno se gli indici coincidono e zero altrimenti, dunque <b>le autofunzioni sono ortonormali</b>.</p>`},
   {label:'Completezza, e che cosa è davvero', body:R`
   <p>La quarta proprietà è che ogni funzione sul segmento si sviluppa nelle $\psi_n$. Griffiths dichiara di non dimostrarla e dice che cos&rsquo;è: <i>«I&rsquo;m not about to prove the completeness of the functions $\sin(n\pi x/a)$, but if you&rsquo;ve studied advanced calculus you will recognize that [it] is nothing but the Fourier series for $f(x)$»</i>. <b>La completezza delle autofunzioni del segmento è il teorema di Dirichlet sulla serie di Fourier di seni</b>, e non è un fatto di meccanica quantistica: è lo stesso teorema che serve per sviluppare un&rsquo;onda su una corda vibrante fissata agli estremi, ed è lo strumento della <span class="str" data-str="trasformata-di-fourier">trasformata di Fourier</span> nella sua versione discreta.</p>
   <p>I coefficienti si estraggono con quello che Griffiths chiama <i>«Fourier&rsquo;s trick»</i>: si moltiplica lo sviluppo per $\psi_m$ e si integra, e l&rsquo;ortonormalità uccide tutti i termini tranne uno, lasciando $c_n=\int_0^a\psi_n(x)f(x)dx$.</p>
   <p>Griffiths è anche esplicito su quante di queste quattro proprietà siano peculiari del segmento: <i>«these four properties are extremely powerful, and they are not peculiar to the infinite square well. The first is true whenever the potential itself is a symmetric function; the second is universal, regardless of the shape of the potential»</i>. <b>Tradotto nei teoremi di questo movimento</b>: la prima è la parità obbligata della tappa 07 (vale per $V$ pari), la seconda è il teorema di oscillazione della tappa 06 (vale sempre), la terza e la quarta sono proprietà generali di ogni osservabile autoaggiunta.</p>`}
  ]},
  {t:'reveal', title:'Uno stato iniziale sviluppato per intero, con due controlli', tag:'esame', steps:[
   {label:'Il problema', body:R`
   <p>Si prenda l&rsquo;Example 2.2 di Griffiths: una particella nel segmento parte dallo stato</p>
   $$\Psi(x,0)=A\,x(a-x),\qquad 0\le x\le a,$$
   <p>cioè una parabola che si annulla agli estremi come deve. <b>Prima la normalizzazione.</b> Imponendo $\int_0^a|\Psi|^{2}dx=1$ si trova $A=\sqrt{30/a^{5}}$, e il controllo è diretto:</p>
   $$\int_{0}^{a}\frac{30}{a^{5}}x^{2}(a-x)^{2}dx=1.$$`},
   {label:'I coefficienti', body:R`
   <p>Con il trucco di Fourier, $c_n=\int_0^a\psi_n(x)\Psi(x,0)dx$. Il primo coefficiente vale</p>
   $$c_{1}=\int_{0}^{a}\sqrt{\tfrac{2}{a}}\sin\Big(\frac{\pi x}{a}\Big)\sqrt{\tfrac{30}{a^{5}}}\,x(a-x)\,dx=\frac{8\sqrt{15}}{\pi^{3}},$$
   <p>numericamente $0{,}999$ circa: <b>lo stato iniziale è quasi esattamente il fondamentale</b>, e questo è il motivo per cui una parabola e un seno, pur essendo funzioni diverse, si assomigliano così tanto a occhio.</p>
   <p>Il secondo coefficiente è nullo,</p>
   $$c_{2}=0,$$
   <p>e non per caso: $\Psi(x,0)$ è <i>pari</i> rispetto al centro del segmento, $\psi_2$ è dispari, e l&rsquo;integrale del prodotto di una funzione pari e una dispari su un intervallo simmetrico è zero. <b>Tutti i $c_n$ con $n$ pari si annullano per parità</b>, senza fare il conto — ed è l&rsquo;uso più economico del teorema della tappa 07. Il risultato generale è $c_n=8\sqrt{15}/(n\pi)^{3}$ per $n$ dispari, zero per $n$ pari.</p>`},
   {label:'Il controllo che chiude: Parseval', body:R`
   <p>Un coefficiente sbagliato di un fattore o di un esponente non si vede guardando la formula. Si vede sommando i quadrati, che devono fare uno:</p>
   $$\sum_{j=0}^{\infty}\Big(\frac{8\sqrt{15}}{(2j+1)^{3}\pi^{3}}\Big)^{2}=1.$$
   <p>È un controllo severo, perché coinvolge <i>tutti</i> i coefficienti insieme: la somma vale $\frac{960}{\pi^{6}}\sum_{n\ \rm dispari}n^{-6}$, e la serie dei reciproci delle seste potenze dispari vale $(1-2^{-6})\zeta(6)=\frac{63}{64}\cdot\frac{\pi^{6}}{945}$, il che dà esattamente $1$ dopo la cancellazione. <b>Se nel coefficiente ci fosse $n^{2}$ invece di $n^{3}$, o $8\sqrt{15}$ invece di $8\sqrt{15}$ con un fattore diverso, questa somma non darebbe uno.</b> E l&rsquo;interpretazione fisica di ogni addendo è la probabilità che una misura dell&rsquo;energia dia $E_{2j+1}$ — sulla quale Griffiths spende un avvertimento di linguaggio che vale riportare: <i>«some people like to say that $|c_n|^{2}$ is the "probability of finding the particle in the nth stationary state", but this is bad language; the particle is in the state $\Psi$, not $\psi_n$... you measure some observable, and what you get is a number»</i>.</p>`},
   {label:'Il numero, per sapere di che scala si parla', body:R`
   <p>Tutto questo resta aria finché non si mette un numero. Per un elettrone ($m=9{,}109\cdot10^{-31}$ kg) in un segmento di un ångström ($a=10^{-10}$ m), che è la scala di un atomo:</p>
   $$E_1=\frac{\pi^{2}\hbar^{2}}{2ma^{2}}\simeq37{,}60\ \text{eV}.$$
   <p>È lo stesso ordine di grandezza delle energie di legame atomiche (l&rsquo;idrogeno sta a $13{,}6$ eV), e <b>questa coincidenza di scala non è un caso</b>: è la ragione per cui il segmento, che come potenziale è una caricatura, è un modello utile. Il confinamento su una dimensione atomica produce spaziature di livelli dell&rsquo;ordine delle decine di elettronvolt, cioè nell&rsquo;ultravioletto; confinamento su scala di cento ångström — un punto quantico — le porta nel visibile, e il colore del punto quantico si calcola con questa formula.</p>`}
  ]},
  {t:'plot', title:'Le densità di probabilità, e lo stato iniziale contro il suo sviluppo',
   intro:R`<p>A sinistra $|\psi_n|^{2}$ per i primi tre livelli, con la densità classica uniforme per confronto: una particella classica con energia $E$ nel segmento passa lo stesso tempo in ogni punto, e la densità quantistica tende a quella uniforme solo per $n$ grande. A destra lo stato iniziale $\Psi(x,0)\propto x(a-x)$ dell&rsquo;Example 2.2 contro il suo primo addendo di Fourier $c_1\psi_1$: le due curve sono quasi indistinguibili, ed è quello che $c_1\simeq0{,}999$ significa.</p>`,
   plots:[{kind:'func2d', xr:[0,1], yr:[0,2.3], height:270, ticks:true,
     title:'densita di probabilita per n = 1, 2, 3 (a = 1)',
     curves:[{f:'2*Math.pow(Math.sin(Math.PI*x),2)', col:'#5aa9ff', width:2.4, label:'n = 1'},
             {f:'2*Math.pow(Math.sin(2*Math.PI*x),2)', col:'#9b8cff', width:2.0, label:'n = 2'},
             {f:'2*Math.pow(Math.sin(3*Math.PI*x),2)', col:'#ff6b8a', width:2.0, label:'n = 3'},
             {f:'1', col:'#666a75', width:1.4, label:'densita classica (uniforme)'}],
     xlabel:'x', ylabel:'|psi|^2'},
    {kind:'func2d', xr:[0,1], yr:[0,1.5], height:270, ticks:true,
     title:'Psi(x,0) = sqrt(30) x(1-x) contro c_1 psi_1',
     curves:[{f:'Math.sqrt(30)*x*(1-x)', col:'#5aa9ff', width:3.0, label:'Psi(x,0), lo stato vero'},
             {f:'(8*Math.sqrt(15)/Math.pow(Math.PI,3))*Math.sqrt(2)*Math.sin(Math.PI*x)', col:'#ffb86b', width:2.0, label:'c_1 psi_1, il primo addendo'}],
     xlabel:'x', ylabel:'Psi'}],
   leggi:R`<p><b>Che cosa guardare.</b> A sinistra, il fondamentale ha un solo massimo al centro e tocca il valore $2$, cioè il doppio della densità classica; il terzo livello ha tre gobbe e la sua media locale è già vicina a $1$. A destra, le due curve si staccano al massimo di poco più di un centesimo, e la differenza — che a occhio è invisibile — è interamente contenuta nei coefficienti dispari successivi, il cui peso complessivo è $1-c_1^{2}\simeq0{,}0014$.</p>
   <p><b>Che cosa impararne.</b> La figura di sinistra è il limite classico in azione: non è che $|\psi_n|^{2}$ tenda alla costante punto per punto — le oscillazioni restano, con ampiezza invariata — è che la loro <i>media locale</i> tende alla costante, e qualunque misura con risoluzione finita vede la media. <b>Il limite classico è un&rsquo;affermazione sulle medie, non sulle funzioni</b>, e questa figura è il posto più semplice del corso in cui lo si vede. La figura di destra dice invece una cosa pratica: in uno sviluppo su autostati, pochissimi termini bastano quasi sempre, e il motivo è che i coefficienti decadono come $n^{-3}$ — un decadimento che viene dalla regolarità dello stato iniziale, non dalla fortuna.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Lo stato $\Psi(x,0)=A\,x(a-x)$ non è un autostato dell&rsquo;energia. Che cosa fa nel tempo, e la sua densità di probabilità è stazionaria?`,
    a:R`Evolve come $\Psi(x,t)=\sum_n c_n\psi_n(x)e^{-iE_nt/\hbar}$, e la densità <b>non</b> è stazionaria: i termini di interferenza fra livelli diversi portano fattori $\cos[(E_m-E_n)t/\hbar]$ che non si cancellano. La frequenza più bassa presente è $(E_3-E_1)/\hbar=8\pi^{2}\hbar/(2ma^{2})$, perché i livelli pari sono assenti per parità: <i>lo stato respira con una sola frequenza dominante</i>, e il periodo corrispondente per un elettrone in un ångström è dell&rsquo;ordine di $10^{-17}$ s. È lo stesso meccanismo dell&rsquo;Example 2.1 di Griffiths, dove due soli autostati producono una densità che oscilla alla frequenza $(E_2-E_1)/\hbar$, con la morale che lui ne trae: <i>«notice that it took a linear combination of states (with different energies) to produce motion»</i>.`},
   {q:R`Il valor medio dell&rsquo;impulso in un autostato del segmento è nullo. L&rsquo;impulso è dunque una buona osservabile per questo sistema?`,
    a:R`Il valor medio è nullo, sì — $\psi_n$ è reale, e per una funzione d&rsquo;onda reale $\langle p\rangle=\int\psi(-i\hbar\psi')dx$ è immaginario puro <i>e</i> reale perché $p$ è autoaggiunto, dunque zero — ma <b>la domanda è malposta</b>: $p$ non commuta con $H$ nel segmento (le pareti rompono l&rsquo;invarianza per traslazioni), quindi non esistono autostati simultanei dell&rsquo;energia e dell&rsquo;impulso e $p$ non è conservato. La cosa si vede in modo brutale provando a calcolare $\langle p^{2}\rangle$ con la stessa logica: viene $2mE_n>0$, cioè $\Delta p=\hbar n\pi/a\neq0$ malgrado $\langle p\rangle=0$. <i>Lo stato non ha un impulso, ha una distribuzione di impulsi simmetrica</i> — ed è anche la ragione per cui nel segmento il teorema di degenerazione non si applica, come già visto nella tappa 03: manca la seconda osservabile che commuta con $H$.`}
  ]}
]},

/* ---------------- 10 · LA BUCA DI PROFONDITA' FINITA ---------------- */
{ num:'10', title:'La buca di profondità finita: la condizione trascendente, cinque livelli numerici, e due convenzioni che sembrano diverse', meta:'il raccordo che diventa un determinante · la soluzione grafica sulla circonferenza · il dizionario fra Picasso e Griffiths · sempre almeno uno stato legato · il limite di profondità infinita che ritrova il segmento',
  blocchi:[
  {t:'prosa', title:'Il problema, e la convenzione di Picasso', tag:'costruzione', html:R`
  <p>Il potenziale è nullo in $(-a,+a)$ e vale $V_0>0$ fuori. Si cercano gli <b>stati legati</b>, dunque $0<E<V_0$: energia sopra il fondo (tappa 05) e sotto il bordo, perché altrimenti le regioni esterne diventerebbero di tipo I e si passerebbe alla riga 4 della tabella. Dentro la buca la regione è di tipo I, e la soluzione oscilla:</p>
  $$\psi(x)=A\cos kx+A'\sin kx,\qquad k=\frac{\sqrt{2mE}}{\hbar},\qquad |x|<a.$$
  <p>Fuori le regioni sono di tipo II, e la soluzione è una combinazione di esponenziali reali con</p>
  $$\kappa=\frac{\sqrt{2m(V_0-E)}}{\hbar}.$$
  <p>La prima richiesta è l&rsquo;appartenenza a $L^{2}$, e <b>consuma metà dei coefficienti esterni</b>: a destra sopravvive solo $e^{-\kappa x}$, a sinistra solo $e^{+\kappa x}$. È il conteggio della tappa 05 fatto in forma algebrica.</p>`},
  {t:'reveal', title:'La parità dimezza il lavoro, e il raccordo diventa un determinante', tag:'costruzione', steps:[
   {label:'Usare il teorema prima di calcolare', body:R`
   <p>Il potenziale è pari, e l&rsquo;energia che si cerca è un autovalore discreto: per la tappa 07 l&rsquo;autofunzione ha <b>parità definita</b>. Picasso lo usa immediatamente: <i>«prima di imporre le condizioni di continuità osserviamo che $V(x)$ è pari in $x$. Quindi, siccome gli autovalori discreti sono non degeneri, gli stati legati hanno parità definita»</i>, e Griffiths fa lo stesso dichiarando il risparmio: <i>«we can save a little time by noting that this potential is an even function, so we can assume with no loss of generality that the solutions are either even or odd. The advantage of this is that we need only impose the boundary conditions on one side»</i>.</p>
   <p><b>Il risparmio è di un fattore due su tutto il conto</b>, e non è una furbizia di calcolo: è il teorema di non degenerazione che si paga da sé. Per gli stati pari si prende $A'=0$ dentro, e lo stesso coefficiente $B$ nelle due code:</p>
   $$\psi(x)=\begin{cases}Be^{+\kappa x},&x<-a\\ A\cos kx,&-a<x<+a\\ Be^{-\kappa x},&x>+a.\end{cases}$$`},
   {label:'Due equazioni lineari omogenee, e il determinante', body:R`
   <p>Si impongono le due condizioni di raccordo della tappa 01 — $\psi$ e $\psi'$ continue, perché il salto del potenziale è finito — nel solo punto $x=+a$:</p>
   $$A\cos ka=Be^{-\kappa a},\qquad kA\sin ka=\kappa Be^{-\kappa a}.$$
   <p>Questo è un <b>sistema lineare omogeneo</b> nelle due incognite $A$ e $B$, e qui sta il passaggio concettuale: un sistema omogeneo ha la sola soluzione nulla — cioè $\psi\equiv0$, che non è uno stato — <i>a meno che</i> il determinante dei coefficienti si annulli. Il determinante è</p>
   $$\det\begin{pmatrix}\cos ka&-e^{-\kappa a}\\ k\sin ka&-\kappa e^{-\kappa a}\end{pmatrix}=e^{-\kappa a}\big(k\sin ka-\kappa\cos ka\big),$$
   <p>e annullarlo, dividendo per $e^{-\kappa a}\cos ka$ che non è nullo, dà</p>
   $$k\tan ka=\kappa.$$
   <p><b>L&rsquo;energia non compare come incognita di un&rsquo;equazione algebrica, ma di un&rsquo;equazione trascendente</b>: sia $k$ sia $\kappa$ dipendono da $E$, e la condizione li lega. Per gli stati dispari lo stesso conto con il seno dentro dà</p>
   $$\frac{k}{\tan ka}=-\kappa.$$`},
   {label:'La soluzione grafica, su una circonferenza', body:R`
   <p>Le due condizioni si risolvono insieme con un cambio di variabile che le rende adimensionali. Si pone $\xi=ka$ e $\eta=\kappa a$, e le due equazioni diventano</p>
   $$\eta=\xi\tan\xi\quad(\text{stati pari}),\qquad \eta=-\frac{\xi}{\tan\xi}\quad(\text{stati dispari}).$$
   <p>Ma $\xi$ e $\eta$ non sono indipendenti: sommando i quadrati, l&rsquo;energia si cancella e resta un numero che dipende solo dalla buca,</p>
   $$\xi^{2}+\eta^{2}=\frac{2mEa^{2}}{\hbar^{2}}+\frac{2m(V_0-E)a^{2}}{\hbar^{2}}=\frac{2mV_{0}a^{2}}{\hbar^{2}},$$
   <p>cioè l&rsquo;equazione di una <b>circonferenza</b> nel primo quadrante del piano $(\xi,\eta)$, di raggio $\xi_{\rm max}=\sqrt{2mV_0a^{2}}/\hbar$. Gli stati legati sono le intersezioni fra la circonferenza e le due famiglie di rami di tangente. <i>Tutta la fisica della buca sta nel raggio di quella circonferenza</i>, cioè in un unico numero adimensionale che combina massa, profondità e larghezza.</p>`}
  ]},
  {t:'plot', title:'La soluzione grafica, per una buca con raggio 8',
   intro:R`<p>La circonferenza $\eta=\sqrt{\xi_{\rm max}^{2}-\xi^{2}}$ con $\xi_{\rm max}=8$, insieme ai rami di $\eta=\xi\tan\xi$ (stati pari) e $\eta=-\xi/\tan\xi$ (stati dispari). Ogni intersezione nel primo quadrante è uno stato legato. È la figura 8.5 di Picasso e la 2.18 di Griffiths, con un valore del raggio scelto perché i livelli siano abbastanza numerosi da vedere l&rsquo;alternanza.</p>`,
   plots:[{kind:'func2d', xr:[0,8.4], yr:[0,9], height:330, ticks:true,
     title:'xi tan xi, -xi/tan xi e la circonferenza di raggio 8',
     curves:[{f:'Math.sqrt(Math.max(0,64-x*x))', col:'#9b8cff', width:3.0, label:'circonferenza: xi^2 + eta^2 = 64'},
             {f:'x*Math.tan(x)', col:'#5aa9ff', width:2.2, label:'eta = xi tan xi (stati PARI)'},
             {f:'-x/Math.tan(x)', col:'#ff6b8a', width:2.2, label:'eta = -xi/tan xi (stati DISPARI)'}],
     xlabel:'xi = k a', ylabel:'eta = kappa a'}],
   leggi:R`<p><b>Che cosa guardare.</b> La curva viola scende da $8$ a zero; le curve blu e rosa salgono in rami successivi, con asintoti verticali a $\xi=\pi/2,3\pi/2,\dots$ (blu) e a $\xi=\pi,2\pi,\dots$ (rosa). Si contino le intersezioni con la viola: <b>cinque</b> — tre sulla blu e due sulla rosa — e si noti che <i>si alternano</i>: blu, rosa, blu, rosa, blu. Le ascisse, calcolate risolvendo numericamente le equazioni trascendenti, sono $1{,}3955$ (pari), $2{,}7859$ (dispari), $4{,}1648$ (pari), $5{,}5214$ (dispari), $6{,}8307$ (pari).</p>
   <p><b>Che cosa impararne.</b> L&rsquo;alternanza delle parità, che la tappa 07 ha dedotto da due teoremi generali, <b>qui esce da sola dal grafico</b>: i rami di $\xi\tan\xi$ e quelli di $-\xi/\tan\xi$ si alternano per costruzione, perché i loro asintoti si alternano. È una conferma indipendente e non una verifica circolare, perché il grafico non usa il teorema di oscillazione né quello di non degenerazione. E si vede anche il conteggio: <i>il numero di stati legati è il numero di rami che la circonferenza raggiunge</i>, cioè circa $\xi_{\rm max}/(\pi/2)$ arrotondato per eccesso — qui $8/(\pi/2)\simeq5{,}09$, dunque cinque.</p>`},
  {t:'reveal', title:'I numeri, e i due casi limite', tag:'esame', steps:[
   {label:'I cinque livelli, con il controllo che ciascuno risolve la sua equazione', body:R`
   <p>Un&rsquo;ascissa letta da un grafico non è un risultato finché non si verifica che annulli l&rsquo;equazione. Per $\xi_{\rm max}=8$ le cinque radici soddisfano $\xi\tan\xi-\sqrt{64-\xi^{2}}=0$ (pari) o $\xi/\tan\xi+\sqrt{64-\xi^{2}}=0$ (dispari) a meno di qualche unità sulla quarta cifra, e da esse si leggono le energie come frazione della profondità, perché $E/V_0=\xi^{2}/\xi_{\rm max}^{2}$:</p>
   <table class="tab">
   <thead><tr><th>$n$</th><th>parità</th><th>$\xi_n$</th><th>$E_n/V_0$</th></tr></thead>
   <tbody>
   <tr><td>0</td><td>pari</td><td>$1{,}3955$</td><td>$0{,}0304$</td></tr>
   <tr><td>1</td><td>dispari</td><td>$2{,}7859$</td><td>$0{,}1213$</td></tr>
   <tr><td>2</td><td>pari</td><td>$4{,}1648$</td><td>$0{,}2710$</td></tr>
   <tr><td>3</td><td>dispari</td><td>$5{,}5214$</td><td>$0{,}4763$</td></tr>
   <tr><td>4</td><td>pari</td><td>$6{,}8307$</td><td>$0{,}7290$</td></tr>
   </tbody></table>
   <p>Si noti la spaziatura: i livelli <b>non</b> stanno come $n^{2}$ — lo farebbero in una buca infinita — ma si infittiscono verso il bordo, perché avvicinandosi a $E=V_0$ la buca «si allarga» effettivamente, la coda esterna penetra di più, e la lunghezza d&rsquo;onda che ci sta dentro cresce.</p>`},
   {label:'Sempre almeno uno stato legato, e la soglia per il primo dispari', body:R`
   <p>Dalla figura si leggono due fatti generali. Il primo: <b>la circonferenza, per qualunque raggio, interseca sempre il primo ramo di $\xi\tan\xi$</b>, perché quel ramo parte dall&rsquo;origine. Dunque esiste <i>sempre</i> almeno uno stato legato, pari, per quanto poco profonda o stretta sia la buca. Picasso: <i>«qualunque sia il valore di $V_0$ e di $a$, esiste sempre almeno uno stato legato»</i>; Griffiths, con la buca scritta nell&rsquo;altra convenzione: <i>«it is interesting to note, however, that there is always one bound state, no matter how "weak" the well becomes»</i>. <b>È un risultato specificamente unidimensionale</b>: in tre dimensioni una buca sufficientemente debole non lega niente, ed è la ragione per cui il deutone esiste appena e un sistema neutrone-neutrone non esiste.</p>
   <p>Il secondo: il primo ramo di $-\xi/\tan\xi$ parte da $\xi=\pi/2$, dunque la circonferenza lo raggiunge solo se il raggio supera $\pi/2$. La condizione per l&rsquo;esistenza di almeno uno stato <i>dispari</i> è quindi $2mV_0a^{2}/\hbar^{2}>\pi^{2}/4$. Picasso la scrive esattamente così; Griffiths la scrive come $z_0<\pi/2$ per il caso in cui lo stato dispari scompare. <b>Sono la stessa soglia</b>, ed è il punto in cui conviene fare il dizionario fra le due convenzioni.</p>`},
   {label:'Il dizionario fra Picasso e Griffiths, e perché serve', body:R`
   <p>Le due fonti impostano la stessa buca in modo diverso, e un lettore che passi dall&rsquo;una all&rsquo;altra senza accorgersene ottiene formule che sembrano incompatibili. <b>Picasso</b> pone $V=0$ dentro e $V=V_0>0$ fuori, cerca $0<E<V_0$, e trova $k\tan ka=\kappa$. <b>Griffiths</b> pone $V=-V_0$ dentro e $V=0$ fuori, cerca $E<0$, e trova</p>
   $$\tan z=\sqrt{\Big(\frac{z_0}{z}\Big)^{2}-1},\qquad z=la,\quad z_0=\frac{a}{\hbar}\sqrt{2mV_0},$$
   <p>dove $l=\sqrt{2m(E+V_0)}/\hbar$ è il numero d&rsquo;onda interno e $\kappa_{\rm G}=\sqrt{-2mE}/\hbar$ quello esterno. Le due condizioni sono <i>la stessa</i>, e il dizionario è immediato: l&rsquo;energia di Griffiths è quella di Picasso traslata di $V_0$, dunque il suo $l$ è il $k$ di Picasso e il suo $\kappa_{\rm G}$ è il $\kappa$ di Picasso; quindi $z=\xi$, $z_0=\xi_{\rm max}$. Moltiplicando la relazione di Griffiths per $z$ e quadrando:</p>
   $$\Big(z\sqrt{\Big(\frac{z_0}{z}\Big)^{2}-1}\Big)^{2}=z_{0}^{2}-z^{2},$$
   <p>cioè $z\tan z=\sqrt{z_0^{2}-z^{2}}$, e il membro di destra è proprio $\eta$: si ritrova $\xi\tan\xi=\eta$, la condizione di Picasso. <b>La radice di Griffiths è la circonferenza di Picasso, scritta come funzione invece che come luogo geometrico.</b> Dichiararlo non è pedanteria: è il tipo di disaccordo apparente fra fonti che il metodo di questo percorso impone di esplicitare invece di scegliere una convenzione in silenzio.</p>`},
   {label:'Il limite di profondità infinita: si ritrova il segmento', body:R`
   <p>Per $V_0\to\infty$ il raggio della circonferenza cresce senza limite, e la prima intersezione si sposta verso l&rsquo;asintoto del primo ramo: $\xi\to\pi/2$, cioè $ka\to\pi/2$. L&rsquo;energia fondamentale tende dunque a</p>
   $$E_0\to\frac{\hbar^{2}}{2m}\Big(\frac{\pi}{2a}\Big)^{2}=\frac{\pi^{2}\hbar^{2}}{8ma^{2}},$$
   <p>e questo <b>deve</b> coincidere con il livello fondamentale del segmento della tappa 09, <i>a patto di ricordare che qui la buca è larga $2a$ e non $a$</i>:</p>
   $$\frac{\pi^{2}\hbar^{2}}{2m(2a)^{2}}=\frac{\pi^{2}\hbar^{2}}{8ma^{2}}.$$
   <p>Coincide. <i>È il controllo più importante di questa tappa</i>, perché lega due conti condotti in modo completamente diverso — uno algebrico con due condizioni al contorno, uno trascendente con una soluzione grafica e un passaggio al limite — e un errore in uno dei due si vedrebbe qui.</p>
   <p>E si vede anche come nasce la condizione al contorno del segmento. Picasso segue la funzione d&rsquo;onda nel limite: con $ka\to\pi/2$ si ha $\cos ka\to0$, dunque l&rsquo;ampiezza della coda esterna svanisce, e <i>«nel caso limite $V_0=\infty$ (buca di profondità infinita), $\psi_0(x)$ è diversa da zero soltanto all&rsquo;interno della buca e nulla al di fuori. Inoltre $\psi_0(x)$ resta continua e quindi nulla nei punti $x=\pm a$ mentre, invece, la derivata prima è discontinua»</i>. <b>È la conferma, per via indipendente, della conclusione della tappa 01</b>: la discontinuità della derivata non è un&rsquo;assunzione sul caso infinito, è ciò che il caso finito produce quando lo si spinge al limite.</p>`}
  ]},
  {t:'plot', title:'La coda che esce dalla buca',
   intro:R`<p>Lo stato fondamentale pari della buca con $\xi_{\rm max}=8$ (dunque $\xi=1{,}3955$, $\eta=7{,}877$), con $a=1$: $\cos(1{,}3955\,x)$ dentro, e la coda esponenziale raccordata fuori. Per confronto, il fondamentale della buca <i>infinita</i> della stessa larghezza, $\cos(\pi x/2)$, che è obbligato ad annullarsi al bordo.</p>`,
   plots:[{kind:'func2d', xr:[-2,2], yr:[-0.1,1.15], height:290, ticks:true,
     title:'stato fondamentale: buca finita contro buca infinita (a = 1)',
     curves:[{f:'(Math.abs(x)<1)?Math.cos(1.3955*x):Math.cos(1.3955)*Math.exp(-7.8773*(Math.abs(x)-1))', col:'#5aa9ff', width:2.8, label:'buca finita: coda non nulla fuori'},
             {f:'(Math.abs(x)<1)?Math.cos(Math.PI*x/2):0', col:'#ffb86b', width:2.2, label:'buca infinita: zero al bordo'},
             {f:'0', col:'#666a75', width:1.2, label:'asse'}],
     xlabel:'x', ylabel:'psi (normalizzata a psi(0)=1)'}],
   leggi:R`<p><b>Che cosa guardare.</b> In $x=\pm1$ la curva blu vale $\cos(1{,}3955)\simeq0{,}174$, non zero, e da lì decade con lunghezza caratteristica $1/\eta\simeq0{,}127$: la particella ha una probabilità non nulla di stare dove classicamente non potrebbe stare. La curva arancione, invece, tocca esattamente zero al bordo, e dentro oscilla <i>più in fretta</i> — il suo $\xi$ è $\pi/2\simeq1{,}571$ contro $1{,}3955$.</p>
   <p><b>Che cosa impararne.</b> Due letture, e la seconda è quella che si usa. Prima: la penetrazione nella regione proibita è la stessa cosa della concavità «lontano dall&rsquo;asse» della tappa 04, vista su un caso numerico — nella coda la funzione non torna mai indietro, decade e basta. Seconda: <b>l&rsquo;energia della buca finita è più bassa di quella della buca infinita della stessa larghezza</b> ($\xi=1{,}3955<\pi/2$), e la ragione è che la coda permette alla funzione d&rsquo;onda di «usare» una lunghezza d&rsquo;onda maggiore di quella che la larghezza nominale consentirebbe. Detto in termini di energia cinetica: <i>lasciar uscire un po&rsquo; la funzione d&rsquo;onda costa in energia potenziale e fa risparmiare in energia cinetica</i>, e il compromesso fissa il livello. È lo stesso bilancio che, in un doppio pozzo, abbassa l&rsquo;energia dello stato simmetrico rispetto a quello antisimmetrico e produce il legame chimico.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Una buca con $\xi_{\rm max}=8$ ha cinque stati legati. Quanti ne ha una buca con la stessa profondità e larghezza dimezzata?`,
    a:R`Il raggio della circonferenza è $\xi_{\rm max}=a\sqrt{2mV_0}/\hbar$, <b>proporzionale ad $a$</b>: dimezzando la larghezza il raggio passa da $8$ a $4$. Il conteggio $\lceil\xi_{\rm max}/(\pi/2)\rceil$ dà $\lceil2{,}55\rceil=3$: tre stati legati, due pari e uno dispari. <i>Il numero di stati legati scala come $a\sqrt{V_0}$</i>, cioè come la radice dell&rsquo;«area» della buca — ed è la stessa dipendenza che in semiclassica si legge come numero di celle di volume $h$ nello spazio delle fasi accessibile. Conseguenza pratica: per raddoppiare il numero di livelli basta raddoppiare la larghezza, mentre serve quadruplicare la profondità.`},
   {q:R`Nella condizione trascendente si è diviso per $\cos ka$. Che cosa accadrebbe se $\cos ka$ fosse nullo?`,
    a:R`Se $\cos ka=0$ la prima equazione di raccordo diventa $0=Be^{-\kappa a}$, dunque $B=0$: la coda esterna si annulla identicamente, e la seconda equazione dà $kA\sin ka=0$ con $\sin ka=\pm1$, dunque $A=0$ e la soluzione è nulla. <b>Quindi $\cos ka\neq0$ per ogni stato legato vero, e la divisione è lecita</b> — ma solo per $V_0$ <i>finito</i>. Il caso $\cos ka=0$ è precisamente il limite $V_0\to\infty$ della tappa: lì $B\to0$ è ciò che si vuole, e il sistema omogeneo smette di avere due incognite perché l&rsquo;esterno non esiste più. <i>Il passaggio al limite non è la sostituzione di un numero grande: è il cambio del problema</i>, da due condizioni per parete a una, e la divisione che qui è lecita là non lo sarebbe.`}
  ]}
]},

/* ---------------- 11 · LO STATO LEGATO CHE LO SCHEMA NON PREVEDE ---------------- */
{ num:'11', title:'Uno stato legato dentro il continuo: dove lo schema usava un’ipotesi senza dirlo', meta:'von Neumann e Wigner · la costruzione di Stillinger e Herrick · il potenziale ricavato dalla funzione d onda e non viceversa · la coda oscillante · perché non ha analogo classico',
  blocchi:[
  {t:'prosa', title:'L’ipotesi tacita, e perché vale la pena romperla', tag:'costruzione', html:R`
  <p>Lo schema della tappa 08 associa a ogni coppia di «tipi di regione all&rsquo;infinito» un tipo di spettro, e nella riga 4 dice: se entrambe le regioni esterne sono di tipo I, lo spettro è continuo e doppiamente degenere. In particolare <b>sopra il valore asintotico del potenziale non ci sono livelli discreti</b>, perché una funzione che oscilla a entrambi gli estremi non è normalizzabile.</p>
  <p>L&rsquo;ipotesi che rende questo un argomento è che «il tipo di regione all&rsquo;infinito» esista, cioè che $V$ tenda a un limite. Landau la dichiara; Picasso la nomina solo escludendo i potenziali periodici. <b>Che cosa succede se il potenziale, per $x\to\infty$, non tende a niente — se oscilla con ampiezza che va a zero come $1/r$ ma oscilla sempre?</b> La risposta è che lo schema si rompe, e il modo in cui si rompe è uno dei risultati più eleganti di questo capitolo della meccanica quantistica. Ballentine lo presenta nel paragrafo intitolato, senza perifrasi, «alcuni stati legati inusuali»:</p>
  <p><i>«all of the bound states considered so far have the property that the total energy of the state is less than the value of the potential energy at infinity. The system remains bound because it lacks sufficient energy to dissociate. This same property characterizes classical bound states. However, it is possible in quantum mechanics to have bound states that do not possess this property, and which therefore have no classical analog.»</i></p>
  <p>E attribuisce la costruzione: <i>«Stillinger and Herrick (1975), following an earlier suggestion by Von Neumann and Wigner, have constructed potentials that have discrete bound states embedded in the positive energy continuum»</i>.</p>`},
  {t:'reveal', title:'L’idea: ricavare il potenziale dalla funzione d’onda', tag:'costruzione', steps:[
   {label:'L’inversione del problema', body:R`
   <p>Il trucco è di una semplicità che spiazza. Normalmente si dà $V$ e si cerca $\psi$; qui si fa il contrario. Si scrive l&rsquo;equazione di Schrödinger (in unità $\hbar=1$, massa $=1$, come fa Ballentine) e si <b>risolve rispetto al potenziale</b>:</p>
   $$W=E+\frac{1}{2}\frac{\nabla^{2}\Psi}{\Psi}.$$
   <p>Data <i>qualunque</i> funzione $\Psi$ e <i>qualunque</i> numero $E$, questa formula produce un potenziale per cui $\Psi$ è autofunzione con autovalore $E$. Il mestiere sta tutto nelle due condizioni di accettabilità: che $\Psi$ sia normalizzabile (altrimenti non è uno stato legato) e che $W$ non sia singolare (altrimenti non è un potenziale). <b>La seconda condizione è il vincolo vero</b>, e Ballentine la enuncia in una riga che vale tutta la costruzione: <i>«for the potential to be nonsingular, the nodes of $\Psi$ must be matched by zeros of $\nabla^{2}\Psi$»</i> — i nodi di $\Psi$ fanno divergere il rapporto, a meno che il numeratore non si annulli con lo stesso ordine.</p>`},
   {label:'Il punto di partenza, e perché non basta', body:R`
   <p>Si parte dalla funzione libera a momento angolare nullo, $\Psi_0(\mathbf x)=\sin(kr)/kr$, che risolve l&rsquo;equazione con $W\equiv0$ ed energia $E=k^{2}/2$. La verifica si fa con il laplaciano radiale, che su una funzione della sola $r$ vale $\frac{1}{r}\frac{d^{2}}{dr^{2}}(r\Psi)$, e che per questa funzione dà $r\Psi_0=\sin(kr)/k$ e quindi:</p>
   $$-\frac{1}{2}\frac{1}{r}\frac{d^{2}}{dr^{2}}\Big(r\,\frac{\sin(kr)}{kr}\Big)=\frac{k^{2}}{2}\frac{\sin(kr)}{kr}.$$
   <p><b>Ma $\Psi_0$ non è normalizzabile</b>: decade come $1/r$, e $\int|\Psi_0|^{2}d^{3}x$ diverge come $\int dr$. È lo stesso difetto dell&rsquo;onda piana, e Ballentine lo registra come tale — <i>«it is unacceptable because the integral of $|\Psi_0|^{2}$ is not convergent»</i>. Il rimedio è moltiplicare per una funzione che decada: $\Psi=\Psi_0 f(r)$, con $f$ che vada a zero più rapidamente di $r^{-1/2}$.</p>`},
   {label:'La scelta di f, e il motivo di ogni ingrediente', body:R`
   <p>Sostituendo $\Psi=\Psi_0 f$ nella formula del potenziale si ottiene</p>
   $$W(r)=E-\frac{k^{2}}{2}+k\cot(kr)\frac{f'(r)}{f(r)}+\frac{1}{2}\frac{f''(r)}{f(r)},$$
   <p>e il primo pezzo si annulla scegliendo $E=k^{2}/2$. Resta un problema: $\cot(kr)$ ha poli negli zeri di $\sin(kr)$, cioè <b>esattamente nei nodi di $\Psi_0$</b>. Per tenere $W$ limitato serve che $f'/f$ si annulli in quei punti.</p>
   <p>Stillinger e Herrick lo ottengono costruendo $f$ come funzione di una variabile ausiliaria scelta su misura:</p>
   $$s(r)=8k^{2}\int_{0}^{r}r'\sin^{2}(kr')\,dr'=2k^{2}r^{2}-2kr\sin(2kr)-\cos(2kr)+1,$$
   <p>e Ballentine dichiara i due criteri che l&rsquo;hanno guidata, dicendo anche che la scelta non è unica — <i>«the principles guiding this choice (which is far from unique) are: that the integrand must be nonnegative, so that $s(r)$ will be a monotonic function of $r$; and that the integrand must be proportional to $\sin(kr)$, so that $ds(r)/dr$ will vanish at the zeros of $\sin(kr)$»</i>. Il secondo criterio si verifica derivando:</p>
   $$s'(r)=8k^{2}r\sin^{2}(kr),$$
   <p>che si annulla, insieme a $\sin(kr)$, in tutti i nodi. Prendendo poi $f=[A^{2}+s(r)]^{-1}$, la derivata logaritmica $f'/f$ vale $-s'/(A^{2}+s)$, che eredita gli zeri di $s'$ e cancella i poli della cotangente. <b>Ogni ingrediente della costruzione è lì per annullare una singolarità, e non per un&rsquo;altra ragione.</b></p>`},
   {label:'Il potenziale esplicito, e il controllo dell’algebra', body:R`
   <p>Con $f=[A^{2}+s]^{-1}$ il conto si chiude in forma elementare:</p>
