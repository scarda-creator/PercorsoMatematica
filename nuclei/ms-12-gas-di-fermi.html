   <p>Integrando per parti, il termine di bordo si annulla ai due estremi — in zero perch&eacute; c&rsquo;&egrave; $\varepsilon^a$, all&rsquo;infinito perch&eacute; il logaritmo va a zero esponenzialmente — e resta</p>
   $$\frac{PV}{T}=\frac{g_sC}{a}\int_0^{\infty}\varepsilon^{a}\,\frac{\beta ze^{-\beta\varepsilon}}{1+ze^{-\beta\varepsilon}}\,d\varepsilon$$
   <p>dove la frazione che &egrave; comparsa derivando il logaritmo &egrave;, letta al contrario, <b>esattamente la funzione di occupazione di Fermi</b>: dividendo sopra e sotto per $ze^{-\beta\varepsilon}$ si ottiene $1/(z^{-1}e^{\beta\varepsilon}+1)$. Dunque l&rsquo;integrale &egrave; $\beta$ per l&rsquo;integrale di $\varepsilon\cdot\varepsilon^{a-1}n(\varepsilon)$, cio&egrave; $\beta E/(g_sC)$ moltiplicato per i fattori giusti, e semplificando la temperatura resta</p>
   $$PV=\frac Ea$$
   <p>Grilli-Giardina (pag. 89) fa lo stesso conto nel caso $a=3/2$ e lo dichiara un teorema, aggiungendo la nota che conta: <i>&laquo;nonostante sia stata ricavata utilizzando la statistica di Fermi-Dirac, tale relazione vale anche nel caso bosonico&raquo;</i>. Il motivo si vede dalla derivazione: <b>il segno al denominatore della funzione di occupazione non &egrave; mai stato usato</b>. L&rsquo;unica cosa che conta &egrave; l&rsquo;esponente della densit&agrave; di stati.</p>`},
   {label:'Il caso tridimensionale e il valore a temperatura nulla', body:R`
   <p>Per un gas libero in tre dimensioni $a=3/2$, e l&rsquo;inverso di $3/2$ &egrave; $2/3$:</p>
   $$PV=\tfrac23E$$
   <p>relazione che vale a <i>ogni</i> temperatura e per entrambe le statistiche quantistiche, e che nel limite classico riproduce $PV=NT$ perch&eacute; l&igrave; $E=\tfrac32NT$. Crisanti (pag. 261) la ricava con lo stesso passaggio e la usa come controllo di consistenza di tutto il capitolo.</p>
   <p>A temperatura nulla si sostituisce l&rsquo;energia del mare di Fermi, $E=\tfrac35N\varepsilon_F$, e il prodotto dei due coefficienti d&agrave;</p>
   $$PV=\tfrac25N\varepsilon_F$$
   <p>cio&egrave;, dividendo per il volume e sostituendo $\varepsilon_F$,</p>
   $$P=\frac{2}{5}\,n\varepsilon_F=\frac{\hbar^2}{5m}\left(\frac{6\pi^2}{g_s}\right)^{2/3}n^{5/3}$$
   <p>Grilli-Giardina (pag. 92) chiude il paragrafo con la frase che d&agrave; il nome alla cosa: <i>&laquo;even at zero temperature, the gas has non-zero pressure, known as degeneracy pressure&raquo;</i>. Crisanti (pag. 279) lo dice in italiano e con una nota pratica: &laquo;dobbiamo esercitare una pressione per tenere le particelle ferme anche a $T=0$&raquo;.</p>
   <p><b>Disaccordo (d): un esponente sbagliato.</b> Nella stessa pagina Crisanti scrive la pressione con le correzioni termiche nella forma $\frac25\frac{\varepsilon_F}{v}\left[1+\frac{5}{12}\pi^2(\beta\varepsilon_F)^{2}\right]$, mentre due righe sopra l&rsquo;energia porta $(\beta\varepsilon_F)^{-2}$. L&rsquo;esponente giusto &egrave; il <b>negativo</b>, e lo si riconosce senza rifare nessun conto: la correzione deve <i>annullarsi</i> a temperatura nulla, cio&egrave; per $\beta\to\infty$, e $(\beta\varepsilon_F)^{+2}$ diverge. &Egrave; un refuso, ma &egrave; anche il tipo di controllo che conviene applicare a ogni formula copiata da un appunto: <b>si guarda dove deve andare, prima di guardare che cosa c&rsquo;&egrave; scritto</b>.</p>`},
   {label:'La stessa pressione per via termodinamica, e perche non si annulla', body:R`
   <p>C&rsquo;&egrave; una seconda strada, pi&ugrave; corta e pi&ugrave; illuminante, e conviene saperla percorrere perch&eacute; all&rsquo;orale &egrave; la risposta giusta alla domanda &laquo;perch&eacute; un gas a temperatura nulla ha pressione?&raquo;. A entropia costante — e a temperatura nulla l&rsquo;entropia &egrave; nulla, dunque costante — la pressione &egrave; meno la derivata dell&rsquo;energia rispetto al volume.</p>
   <p>L&rsquo;energia del mare di Fermi dipende dal volume perch&eacute; $\varepsilon_F$ dipende dalla densit&agrave;: sostituendo $n=N/V$ in $E=\tfrac35N\varepsilon_F$ si vede che $E=K\,V^{-2/3}$, con $K$ una costante che raccoglie $N$, la massa e le costanti universali. Derivando:</p>
   $$-\frac{\partial E}{\partial V}=\frac{2}{3}\frac{K}{V^{5/3}}=\frac23\frac EV$$
   <p>e siccome $E=\tfrac35N\varepsilon_F$, questo &egrave; di nuovo $\tfrac25n\varepsilon_F$. <b>Le due strade danno lo stesso numero</b>, e la seconda dice <i>perch&eacute;</i>: comprimere il gas riduce il volume, riduce lo spazio disponibile nello spazio delle fasi, costringe le particelle in livelli di impulso pi&ugrave; alto e quindi <b>aumenta l&rsquo;energia</b>. Un sistema la cui energia cresce quando lo si comprime spinge verso l&rsquo;esterno: questa &egrave; la definizione di pressione, e non c&rsquo;&egrave; bisogno di nessun moto termico.</p>
   <p>La dipendenza $P\propto n^{5/3}$ &egrave; la stessa di un&rsquo;adiabatica di gas monoatomico, ed &egrave; una coincidenza istruttiva: qui non c&rsquo;&egrave; nessuna adiabatica e nessun $\gamma=5/3$, c&rsquo;&egrave; solo il fatto che $\varepsilon_F\propto n^{2/3}$ e che la pressione &egrave; densit&agrave; per energia. Crisanti (pag. 264) avverte esplicitamente che le relazioni $C_P/C_V=5/3$ e $C_P-C_V=1$, da cui classicamente si ricaverebbe quell&rsquo;esponente, <b>non valgono nel caso quantistico</b>, mentre l&rsquo;equazione con l&rsquo;esponente s&igrave;, ottenuta &laquo;per vie del tutto indipendenti&raquo;.</p>`}
  ]},
  {t:'prosa', title:'Quanto vale davvero, e perche un metallo non implode', tag:'grammatica', html:R`
  <p>Con i numeri del rame della tappa 02 la pressione di degenerazione degli elettroni di conduzione vale $\simeq3{,}84\times10^{10}$ Pa, cio&egrave; circa $3{,}79\times10^{5}$ atmosfere. <b>Trecentottantamila atmosfere dentro un filo elettrico</b>, a qualunque temperatura, compresa quella di un frigorifero.</p>
  <p>La domanda ovvia &egrave; perch&eacute; il filo non esploda, e la risposta &egrave; che quella pressione &egrave; equilibrata dall&rsquo;attrazione elettrostatica fra gli elettroni e gli ioni del reticolo, che ha lo stesso ordine di grandezza. Il bilancio fra le due &egrave; ci&ograve; che fissa la <b>densit&agrave; di equilibrio di un metallo</b>, e quindi il suo modulo di compressibilit&agrave;: un modello a elettroni liberi che tenga conto solo della pressione di degenerazione e dell&rsquo;energia elettrostatica media sbaglia il modulo di un metallo alcalino di meno di un fattore due, che per un modello senza parametri liberi &egrave; molto.</p>
  <p>Lo stesso conto, senza il reticolo che lo bilanci, tiene in piedi un oggetto astronomico. In una <b>nana bianca</b> non ci sono ioni legati a distanze atomiche: c&rsquo;&egrave; un gas di elettroni degenere e i nuclei nudi, e la gravit&agrave; comprime. La stella si ferma dove la pressione di degenerazione uguaglia quella gravitazionale, e siccome la prima cresce come $n^{5/3}$ mentre la seconda cresce pi&ugrave; in fretta con la massa, esiste una massa oltre la quale nessun equilibrio &egrave; possibile. <b>Il passaggio che la determina &egrave; contenuto in questo movimento</b>: quando $p_F$ diventa confrontabile con $mc$ la relazione fra energia e impulso passa da $p^2/2m$ a $c|\vec p|$, l&rsquo;esponente della densit&agrave; di stati passa da $1/2$ a $2$, e la pressione passa da $n^{5/3}$ a $n^{4/3}$ — una potenza troppo debole per reggere.</p>
  <p><b>Che cosa non dice questo conto.</b> Non dice niente sulle interazioni fra gli elettroni, che qui sono state trascurate per ipotesi. In un metallo reale l&rsquo;interazione coulombiana fra elettroni &egrave; dello stesso ordine dell&rsquo;energia cinetica, e il fatto che il modello a particelle indipendenti funzioni comunque non &egrave; ovvio: &egrave; il contenuto della teoria del liquido di Fermi, che sta molto oltre questo corso. Qui basta sapere che il successo del modello libero &egrave; una circostanza da spiegare, non un fatto dovuto.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`La relazione $PV=\tfrac23E$ vale per bosoni, fermioni e per il gas classico. Come si fa a ottenere un risultato cos&igrave; generale da un conto fatto con la statistica di Fermi?`,
    a:R`Perch&eacute; il conto non usa mai la statistica. Il criterio invocato &egrave; l&rsquo;<b>integrazione per parti</b> applicata a $\log\mathcal Z$: l&rsquo;unico ingrediente &egrave; che la densit&agrave; di stati sia una potenza, $G\propto\varepsilon^{a-1}$, perch&eacute; &egrave; quella potenza a produrre il fattore $1/a$. La funzione di occupazione compare identica nei due membri e si cancella. La conseguenza &egrave; che $PV=E/a$ dipende solo da <b>dimensione e dispersione</b>, non dal tipo di particella: in tre dimensioni con $\varepsilon=p^2/2m$ d&agrave; $2/3$ per tutti e tre i gas, e con $\varepsilon=c|\vec p|$ d&agrave; $1/3$, che &egrave; la relazione della radiazione. Se in un compito si ottiene un coefficiente diverso, il conto sbagliato &egrave; quello della densit&agrave; di stati.`},
   {q:R`Un gas classico a temperatura nulla ha pressione nulla. Qui no. In quale punto esatto del ragionamento classico entra l&rsquo;errore?`,
    a:R`Nell&rsquo;assunzione, mai scritta ma sempre usata, che l&rsquo;energia di uno stato a $T=0$ sia zero. Il criterio da invocare &egrave; ancora il <b>principio di esclusione</b>: lo stato di minima energia compatibile con l&rsquo;antisimmetria non &egrave; quello con tutte le particelle a impulso nullo, e la sua energia $\tfrac35N\varepsilon_F$ dipende dal volume. La pressione &egrave; $-\partial E/\partial V$ a entropia costante, e una derivata non nulla di un&rsquo;energia non nulla d&agrave; una pressione non nulla. <b>Il punto da portarsi via</b>: la pressione non misura l&rsquo;agitazione termica, misura di quanto costa comprimere — e comprimere un gas di fermioni costa anche quando nulla si agita.`}
  ]}
]},

/* ---------------- 06 · LO SVILUPPO DI SOMMERFELD ---------------- */
{ num:'06', title:'Lo sviluppo di Sommerfeld, derivato invece che citato', meta:'integrare per parti per far comparire la campana · i tre integrali di riferimento · la formula generale · il potenziale chimico che scende',
  blocchi:[
  {t:'reveal', title:'Trasformare un integrale che non si sa fare in uno che si sa fare', tag:'costruzione', steps:[
   {label:'Il problema, e la mossa che lo risolve', body:R`
   <p>Tutte le grandezze del gas a temperatura finita hanno la stessa forma: l&rsquo;integrale di qualcosa per la funzione di occupazione,</p>
   $$I[H]=\int_0^{\infty}H(\varepsilon)\,n(\varepsilon)\,d\varepsilon$$
   <p>con $H=\mathcal AG(\varepsilon)$ per il numero di particelle e $H=\varepsilon\,\mathcal AG(\varepsilon)$ per l&rsquo;energia. L&rsquo;integrale non si sa fare, e il motivo &egrave; che $n(\varepsilon)$ &egrave; una funzione brutta su tutto l&rsquo;asse. Ma a bassa temperatura $n$ &egrave; quasi ovunque costante — vale uno o vale zero — e cambia solo in una striscia sottile attorno a $\mu$.</p>
   <p><b>La mossa &egrave; spostare la bruttezza sulla derivata.</b> Si definisce la primitiva del peso,</p>
   $$K(\varepsilon)=\int_0^{\varepsilon}H(\varepsilon')\,d\varepsilon'$$
   <p>e si integra per parti. Il termine di bordo &egrave; $[K\,n]_0^{\infty}$, che si annulla in zero perch&eacute; $K(0)=0$ e all&rsquo;infinito perch&eacute; $n$ va a zero esponenzialmente mentre $K$ cresce solo come una potenza. Resta</p>
   $$I[H]=\int_0^{\infty}K(\varepsilon)\left(-\frac{dn}{d\varepsilon}\right)d\varepsilon$$
   <p>e il guadagno &egrave; tutto qui: <b>$n$ &egrave; larga e piatta, ma la sua derivata &egrave; stretta e piccata</b>. Derivando la Fermi-Dirac rispetto all&rsquo;energia, e ponendo $x=(\varepsilon-\mu)/T$,</p>
   $$-\frac{dn}{d\varepsilon}=\frac1T\frac{e^{x}}{(e^{x}+1)^2}$$
   <p>che &egrave; una campana centrata in $\varepsilon=\mu$, alta $1/(4T)$ e larga qualche $T$. Crisanti (pag. 277) descrive la stessa cosa in una riga: &laquo;la derivata di questa curva ha un picco stretto in $\varepsilon=\varepsilon_F$, cio&egrave; la densit&agrave; varia solo in corrispondenza dell&rsquo;energia di Fermi&raquo;. A questo punto l&rsquo;integrale &egrave; diventato <b>una media locale di $K$ attorno a $\mu$</b>, e le medie locali si fanno con Taylor.</p>`},
   {label:'I tre integrali di riferimento, calcolati', body:R`
   <p>Si passa alla variabile $x$, cosicch&eacute; $d\varepsilon=T\,dx$ e il fattore $1/T$ si semplifica. Il limite inferiore diventa $x=-\mu/T$, e <b>lo si estende a $-\infty$</b>: l&rsquo;errore che si commette &egrave; l&rsquo;integrale della campana nella coda a sinistra, ed &egrave; dell&rsquo;ordine di $e^{-\mu/T}$. Crisanti (pag. 270) insiste su questo punto pi&ugrave; di quanto sembri necessario, e ha ragione: &laquo;l&rsquo;errore &egrave; esponenzialmente piccolo e trascurabile poich&eacute; un termine esponenzialmente piccolo &egrave; trascurabile rispetto a uno potenzialmente piccolo&raquo;. <b>&Egrave; la frase che definisce che cosa sia uno sviluppo asintotico</b>: la serie che si sta costruendo ha termini in potenze di $T$, e un termine $e^{-\mu/T}$ &egrave; pi&ugrave; piccolo di <i>ogni</i> potenza. Non lo si perde per sciatteria: lo si perde perch&eacute; nessuna potenza lo pu&ograve; rappresentare.</p>
   <p>Ora si sviluppa $K$ attorno a $\mu$, dove la campana &egrave; centrata:</p>
   $$K(\mu+Tx)=K(\mu)+K'(\mu)Tx+\tfrac12K''(\mu)T^2x^2+\mathcal O(T^3)$$
   <p>e restano tre integrali puri, indipendenti da tutto il resto del problema:</p>
   $$I_n=\int_{-\infty}^{+\infty}t^n\,\frac{e^{t}}{(e^{t}+1)^2}\,dt$$
   <p><b>Il primo.</b> L&rsquo;integrando &egrave; la derivata di una funzione elementare: derivando $-\frac{1}{e^{x}+1}$ si riproduce esattamente $e^{x}/(e^{x}+1)^2$. Valutando la primitiva agli estremi, dove vale $-1$ e $0$, si ottiene $I_0=1$.</p>
   <p><b>Il secondo &egrave; nullo per parit&agrave;.</b> Moltiplicando numeratore e denominatore per $e^{2t}$ si verifica che l&rsquo;integrando &egrave; pari,</p>
   $$\frac{e^{-t}}{(1+e^{-t})^2}=\frac{e^{t}}{(1+e^{t})^2}$$
   <p>dunque $t^1$ per una funzione pari &egrave; dispari e $I_1=0$. Grilli-Giardina (pag. 95) fa questa verifica esplicitamente, e non &egrave; pedanteria: &egrave; ci&ograve; che garantisce che <b>lo sviluppo proceda per potenze pari di $T$</b>, cio&egrave; che non esista nessuna correzione lineare. Se esistesse, il calore specifico del gas di Fermi sarebbe costante e non lineare.</p>
   <p><b>Il terzo</b> richiede un conto vero. Integrando per parti si riporta $I_2$ a $4\int_0^{\infty}u/(e^{u}+1)\,du$, e quell&rsquo;integrale si fa sviluppando il denominatore in serie geometrica, $\frac{1}{e^{u}+1}=\sum_{k\ge1}(-1)^{k+1}e^{-ku}$, e integrando termine a termine. Ogni termine d&agrave;</p>
   $$\int_0^{\infty}u\,e^{-ku}\,du=\frac{1}{k^2}$$
   <p>cosicch&eacute;</p>
   $$\int_0^{\infty}\frac{u}{e^{u}+1}\,du=\sum_{k\ge1}\frac{(-1)^{k+1}}{k^2}=\frac{\pi^2}{12}$$
   <p>dove la serie a segni alterni vale met&agrave; della <span class="str" data-str="funzione-zeta-di-riemann">zeta di Riemann</span> in due, e $\zeta(2)=\frac{\pi^2}{6}$. Moltiplicando per quattro:</p>
   $$I_2=\frac{4\pi^2}{12}=\frac{\pi^2}{3}$$
   <p>e numericamente $I_2$ vale $\simeq3{,}290$. Grilli-Giardina arriva allo stesso numero per una strada pi&ugrave; generale, definendo $\zeta$ con la <span class="str" data-str="funzione-gamma">Gamma</span> e ricavando $I_n=(n-1)!\,2n(1-2^{1-n})\Gamma(n)\zeta(n)$ per $n$ pari; il caso $n=2$ &egrave; quello che serve, e conviene saperlo ricavare a mano perch&eacute; la formula generale &egrave; facile da ricordare male.</p>`},
   {label:'La formula, e che cosa dice', body:R`
   <p>Mettendo insieme i tre pezzi — il termine costante con $I_0=1$, quello lineare che muore per parit&agrave;, e quello quadratico con $I_2=\pi^2/3$ moltiplicato per l&rsquo;$\tfrac12$ di Taylor — si ottiene lo <b>sviluppo di Sommerfeld</b>:</p>
   $$I[H]=\int_0^{\mu}H(\varepsilon)\,d\varepsilon+\frac{\pi^2}{6}T^2H'(\mu)+\mathcal O(T^4)$$
   <p>dove si &egrave; usato $K(\mu)=\int_0^\mu H$ e $K''(\mu)=H'(\mu)$. <b>Questa riga &egrave; tutto ci&ograve; che serve per il resto del movimento</b>, e vale la pena leggerla prima di usarla.</p>
   <p>Il primo termine &egrave; il risultato a temperatura nulla con $\mu$ al posto di $\varepsilon_F$: &egrave; il gradino. Il secondo &egrave; la prima correzione, ed &egrave; proporzionale a $T^2$ <i>e alla derivata del peso valutata al bordo</i>. Due conseguenze immediate. <b>La correzione vive solo al bordo</b>: nessuna propriet&agrave; di $H$ lontano da $\mu$ entra al primo ordine, il che &egrave; la traduzione matematica del fatto che solo la superficie di Fermi partecipa. E <b>se $H$ &egrave; costante la correzione svanisce</b>: un gas bidimensionale libero, che ha densit&agrave; di stati costante, ha potenziale chimico indipendente dalla temperatura a ogni ordine in potenze — un caso su cui si torner&agrave; nella tappa 07, perch&eacute; l&igrave; la verit&agrave; sta tutta nel termine esponenziale che lo sviluppo butta via.</p>`},
   {label:'Prima applicazione: il potenziale chimico a numero di particelle fissato', body:R`
   <p>Si applichi la formula al numero di particelle, che &egrave; la relazione da invertire. Con $H=\mathcal A\sqrt\varepsilon$ in tre dimensioni — la costante $\mathcal A$ raccoglie $g_s$, il volume e le costanti — il primo termine &egrave; $\tfrac23\mathcal A\mu^{3/2}$; per il secondo serve la derivata del peso, $\frac{\mathcal A}{2\sqrt\mu}$, e il prodotto $\frac{\pi^2}{6}T^2\cdot\frac{\mathcal A}{2\sqrt\mu}$ vale $\frac{\pi^2}{12}T^2\mathcal A\mu^{-1/2}$. Dunque</p>
   $$N=\mathcal A\left[\tfrac23\mu^{3/2}+\frac{\pi^2}{12}T^2\mu^{-1/2}\right]$$
   <p>Lo stesso $N$, a temperatura nulla, vale $\tfrac23\mathcal A\varepsilon_F^{3/2}$ — &egrave; la definizione di $\varepsilon_F$. Uguagliando le due espressioni e moltiplicando per $3/2$:</p>
   $$\varepsilon_F^{3/2}=\mu^{3/2}+\frac{\pi^2}{8}T^2\mu^{-1/2}=\mu^{3/2}\left[1+\frac{\pi^2}{8}\left(\frac T\mu\right)^2\right]$$
   <p>Si eleva alla potenza $2/3$, si sostituisce $\mu\simeq\varepsilon_F$ dentro la correzione (lecito perch&eacute; l&rsquo;errore che si commette &egrave; di ordine superiore) e si sviluppa con $(1+y)^{-2/3}\simeq1-\tfrac23y$. Il coefficiente che ne esce &egrave; $\tfrac23\cdot\frac{\pi^2}{8}$, cio&egrave; $\frac{\pi^2}{12}\left(\frac{T}{T_F}\right)^2$, e il risultato &egrave;</p>
   $$\mu=\varepsilon_F\left[1-\frac{\pi^2}{12}\left(\frac{T}{T_F}\right)^2+\mathcal O(T^4)\right]$$
   <p>identico in Crisanti (pag. 274) e in Grilli-Giardina (pag. 98), che ci arrivano per la stessa strada passando per la funzione $f_{3/2}(z)$ invece che per la formula generale. <b>Il potenziale chimico scende</b>, e scende quadraticamente.</p>`}
  ]},
  {t:'plot', title:'La finestra che la temperatura apre sulla superficie di Fermi',
   intro:R`La campana $-\partial n/\partial\varepsilon$ nel piano $(T,\varepsilon)$, in unit&agrave; in cui $\mu=1$: sull&rsquo;asse $x$ la temperatura da $0{,}05$ a $0{,}6$, sull&rsquo;asse $y$ l&rsquo;energia da $0$ a $2$. Trascina per ruotare.`,
   plots:[
    {kind:'surface3d', f:'exp((y-1)/x)/(x*pow(exp((y-1)/x)+1,2))', xr:[0.05,0.6], yr:[0,2], n:36, height:400,
     title:'derivata della funzione di occupazione, cambiata di segno',
     xlabel:'temperatura', ylabel:'energia del livello'}
   ],
   leggi:R`<p><b>Che cosa guardare: la cresta che si alza abbassando la temperatura.</b> Verso il bordo sinistro, dove $T$ &egrave; piccola, la campana &egrave; alta e strettissima; verso destra si abbassa e si allarga. Le due cose si compensano esattamente — <b>l&rsquo;area sotto la campana vale uno a ogni temperatura</b>, ed &egrave; l&rsquo;integrale $I_0$ asserito nella tappa. &Egrave; il motivo per cui il termine di ordine zero dello sviluppo non dipende da $T$: la finestra cambia forma ma non peso.</p>
   <p><b>Che cosa guardare: dove la cresta &egrave; centrata.</b> Su tutta la superficie la cresta sta a $\varepsilon=1$, cio&egrave; sul potenziale chimico, e non si sposta. Questo &egrave; ci&ograve; che rende legittimo sviluppare tutto attorno a $\mu$: la temperatura decide <i>quanto larga</i> &egrave; la finestra, non <i>dove</i> si apre. Il fatto che in un problema reale $\mu$ si sposti &egrave; un effetto separato, ed &egrave; il secondo ordine della stessa storia.</p>
   <p><b>Che cosa impararne per i conti.</b> Lo sviluppo di Sommerfeld &egrave; letteralmente la richiesta «questa campana &egrave; cos&igrave; stretta che, contro di essa, posso sostituire la funzione con la sua parabola osculatrice». La correzione $T^2$ nasce dal secondo momento della campana, $I_2$; il termine lineare non c&rsquo;&egrave; perch&eacute; la campana &egrave; simmetrica. <b>Ogni volta che si vede $\pi^2/6$ in una formula di stato solido, viene da qui.</b></p>
   <p><b>Dove questa figura mente.</b> Tiene $\mu$ fisso a uno mentre la tappa ha appena mostrato che a $N$ fissato scende come $T^2$: alla temperatura pi&ugrave; alta disegnata la cresta dovrebbe stare a circa $0{,}70$ invece che a $1$. E la superficie &egrave; tagliata dal riquadro: a $T=0{,}05$ la campana arriva a cinque, fuori dal grafico, che &egrave; il modo in cui il disegno dichiara che il limite $T\to0$ &egrave; singolare — la campana tende a una delta.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Lo sviluppo di Sommerfeld getta via un termine di ordine $e^{-\mu/T}$ e tiene termini di ordine $T^2$, $T^4$ e cos&igrave; via. A temperatura piccolissima l&rsquo;esponenziale non &egrave; forse il termine pi&ugrave; grande che resta?`,
    a:R`No, ed &egrave; esattamente il contrario: &egrave; il pi&ugrave; <i>piccolo</i>. Il criterio da invocare &egrave; l&rsquo;<b>ordine asintotico</b>: per $T\to0^+$ si ha $e^{-\mu/T}/T^k\to0$ per ogni $k$, cio&egrave; l&rsquo;esponenziale &egrave; infinitesimo di ordine superiore a <i>tutte</i> le potenze insieme. Per questo non compare in nessun termine della serie e la serie non lo pu&ograve; rappresentare: non &egrave; un&rsquo;approssimazione trascurata, &egrave; un oggetto che appartiene a un&rsquo;altra scala. Il rovescio della medaglia &egrave; che quando i termini di potenza si annullano tutti — come nel gas bidimensionale — quello che resta &egrave; proprio l&rsquo;esponenziale, e la serie di Sommerfeld d&agrave; zero pur non essendo la risposta esatta.`},
   {q:R`Qual &egrave; la strategia per applicare Sommerfeld a un esercizio nuovo, e qual &egrave; il passo in cui si sbaglia di solito?`,
    a:R`Tre passi. <b>Uno</b>: identificare il peso $H(\varepsilon)$, che &egrave; tutto ci&ograve; che moltiplica $n(\varepsilon)$ dentro l&rsquo;integrale — per il numero di particelle &egrave; $g_sG$, per l&rsquo;energia &egrave; $\varepsilon g_sG$, per l&rsquo;entropia &egrave; qualcosa d&rsquo;altro. <b>Due</b>: applicare la formula, che chiede solo $\int_0^\mu H$ e $H'(\mu)$. <b>Tre</b>, ed &egrave; il passo che si salta: <b>imporre che $N$ sia lo stesso a ogni temperatura</b>, cio&egrave; ricavare $\mu(T)$ e sostituirlo nelle altre grandezze. Chi calcola l&rsquo;energia con Sommerfeld e poi vi lascia dentro $\mu=\varepsilon_F$ ottiene un coefficiente sbagliato — e lo ottiene <i>sbagliato in modo plausibile</i>, perch&eacute; la struttura del risultato &egrave; giusta. Nel conto della tappa 08 i due contributi al coefficiente sono $-\pi^2/12$ dalla variazione di $\mu$ e $+\pi^2/4$ dalla formula: chi dimentica il primo sbaglia di tre volte.`}
  ]}
]},

/* ---------------- 07 · IL POTENZIALE CHIMICO CHE SCENDE ---------------- */
{ num:'07', title:'Il potenziale chimico che scende, e un caso in cui la serie e esatta e vale zero', meta:'perche deve scendere · il raccordo col gas classico · il gas bidimensionale risolto per intero · dove lo sviluppo non dice niente',
  blocchi:[
  {t:'reveal', title:'Perche mu deve scendere, e di quanto', tag:'costruzione', steps:[
   {label:'L argomento che si fa senza conti', body:R`
   <p>Il risultato della tappa 06 dice che il potenziale chimico cala quadraticamente con la temperatura. Prima di usarlo conviene capire perch&eacute; <i>deve</i> calare, perch&eacute; l&rsquo;argomento &egrave; pi&ugrave; robusto della formula e vale in qualunque dimensione.</p>
   <p>Il numero di particelle &egrave; l&rsquo;integrale della densit&agrave; di stati per l&rsquo;occupazione. Si tenga $\mu$ fisso e si alzi la temperatura: l&rsquo;occupazione di ogni livello <i>sopra</i> $\mu$ aumenta e quella di ogni livello <i>sotto</i> diminuisce, con variazioni che si compensano esattamente a coppie simmetriche rispetto a $\mu$. Ma la densit&agrave; di stati non &egrave; simmetrica: in tre dimensioni cresce come $\sqrt\varepsilon$, quindi i livelli che si riempiono sopra sono <b>pi&ugrave; numerosi</b> di quelli che si svuotano sotto. Il numero totale di particelle crescerebbe. Siccome deve restare fisso, $\mu$ deve scendere per compensare.</p>
   <p>Grilli-Giardina (pag. 92) fa esattamente questo ragionamento: &laquo;se $\mu$ rimanesse fissato, al crescere della temperatura l&rsquo;integrale divergerebbe, in quanto l&rsquo;integrando &egrave; una quantit&agrave; positiva crescente in $T$; poich&eacute; il numero di particelle dev&rsquo;essere fisso, $\mu$ deve necessariamente diminuire&raquo;. E aggiunge l&rsquo;osservazione che rende il fatto drammatico: <b>per temperature dell&rsquo;ordine di $T_F$ il potenziale chimico diventa negativo</b>, cio&egrave; il gas smette di comportarsi come un mare e comincia a comportarsi come un gas di Boltzmann.</p>
   <p><b>La lettura che vale la pena tenere.</b> Il segno della derivata di $\mu$ rispetto a $T$ ha lo stesso segno della derivata della densit&agrave; di stati al livello di Fermi, cambiato: dove $G$ cresce, $\mu$ scende. &Egrave; esattamente ci&ograve; che dice la formula di Sommerfeld, in cui la correzione &egrave; proporzionale a $H'(\mu)$. E predice un caso limite: <b>se $G$ &egrave; costante, $\mu$ non si muove</b>, ed &egrave; il caso bidimensionale di cui sotto.</p>`},
   {label:'Dove la serie smette di valere', body:R`
   <p>La formula $\mu=\varepsilon_F[1-\frac{\pi^2}{12}(T/T_F)^2]$ &egrave; il primo termine di uno sviluppo asintotico, e chiedersi fino a dove serva &egrave; parte del mestiere. Due numeri lo dicono.</p>
   <p>Il primo: alla temperatura di Fermi la correzione varrebbe $\pi^2/12$, e il potenziale chimico previsto sarebbe $\simeq0{,}178$ volte $\varepsilon_F$. Una correzione che si mangia l&rsquo;ottantadue per cento del termine principale non &egrave; una correzione: <b>la serie &egrave; gi&agrave; inservibile molto prima</b>. Il secondo: la formula, presa alla lettera, prevede un potenziale chimico nullo a $T/T_F\simeq1{,}103$, e negativo oltre. Il fatto che il segno vero cambi davvero attorno a $T_F$ &egrave; corretto, ma il valore preciso non lo si pu&ograve; ottenere da questa serie.</p>
   <p>La regola pratica che se ne ricava, e che vale per ogni uso di Sommerfeld in questo corso: <b>lo sviluppo serve per $T$ di qualche per cento di $T_F$</b>, che &egrave; esattamente il regime dei metalli a temperatura ambiente, dove $T/T_F$ vale qualche millesimo e la correzione &egrave; di qualche parte per milione. Fuori di l&igrave; non c&rsquo;&egrave; una serie migliore: c&rsquo;&egrave; il conto numerico, oppure il limite opposto, quello classico.</p>
   <p>Dalla parte calda la formula &egrave; un&rsquo;altra e si raccorda con questa. Nel limite di Boltzmann il potenziale chimico vale</p>
   $$\mu_{\rm cl}=-T\log\left[\frac{g_sV}{N}\left(\frac{2\pi mT}{h^2}\right)^{3/2}\right]$$
   <p>come scrivono Grilli-Giardina (pag. 100) e Falcioni-Vulpiani (pag. 73), il secondo con il fattore $2$ dello spin messo in evidenza al denominatore. <b>Cresce in valore assoluto come $-T\log T$</b>, quindi scende pi&ugrave; ripido di qualunque retta, e a temperature alte il gas ha un potenziale chimico molto negativo — che &egrave; la firma del regime classico. Le due espressioni, quella fredda e quella calda, descrivono i due estremi della stessa curva, e in mezzo non c&rsquo;&egrave; nessuna formula chiusa.</p>`},
   {label:'Il gas bidimensionale, dove tutto si fa esattamente', body:R`
   <p>C&rsquo;&egrave; un caso in cui l&rsquo;integrale si fa fino in fondo, ed &egrave; istruttivo proprio perch&eacute; smentisce l&rsquo;impressione che lo sviluppo di Sommerfeld sia sempre il meglio che si possa fare.</p>
   <p>In due dimensioni la densit&agrave; di stati &egrave; costante: dalla formula generale della tappa 03, con $\Omega_2=2\pi$ ed esponente nullo,</p>
   $$G_2=\frac{2\pi mA}{h^2}=\frac{mA}{2\pi\hbar^2}$$
   <p>Si ponga $\mathcal D_0=g_sG_2$, la densit&agrave; di stati totale. Allora</p>
   $$N=\mathcal D_0\int_0^{\infty}\frac{d\varepsilon}{e^{(\varepsilon-\mu)/T}+1}=\mathcal D_0\,T\log\left(1+e^{\mu/T}\right)$$
   <p>e l&rsquo;integrale &egrave; elementare perch&eacute; la primitiva di $1/(e^{u}+1)$ &egrave; $-\log\left(1+e^{-u}\right)$, come si verifica derivando. <b>Questa relazione &egrave; esatta a ogni temperatura</b>, e non &egrave; un&rsquo;approssimazione di niente.</p>
   <p>A temperatura nulla il logaritmo tende a $\mu/T$ e resta $N=\mathcal D_0\,\mu$, dunque l&rsquo;energia di Fermi vale</p>
   $$\varepsilon_F=\frac{2\pi\hbar^2}{g_sm}\,\frac NA$$
   <p>Invertendo la relazione esatta si ottiene il potenziale chimico a ogni temperatura:</p>
   $$\mu=T\log\left(e^{\varepsilon_F/T}-1\right)$$
   <p>e conviene riscriverla estraendo il termine dominante, cosa che si fa raccogliendo $e^{\varepsilon_F/T}$ dentro il logaritmo:</p>
   $$\mu=\varepsilon_F+T\log\left(1-e^{-\varepsilon_F/T}\right)$$
   <p><b>Ecco il punto.</b> La correzione al potenziale chimico &egrave; $T\log(1-e^{-\varepsilon_F/T})$, che per $T$ piccola vale circa $-T\,e^{-\varepsilon_F/T}$: &egrave; <b>esponenzialmente piccola</b>, non una potenza. Lo sviluppo di Sommerfeld, che produce solo potenze di $T$ moltiplicate per derivate di $G$, d&agrave; qui zero a tutti gli ordini — ed &egrave; <i>giusto</i>, perch&eacute; nessuna potenza compare. Il termine che lo sviluppo scarta senza rimorso, quello di ordine $e^{-\mu/T}$ di cui parla Crisanti a pag. 270, &egrave; in questo caso l&rsquo;intera risposta. E il limite si verifica direttamente: per $T\to0^+$ si ha $\mu\to\varepsilon_F$, come deve.</p>`}
  ]},
  {t:'plot', title:'Il potenziale chimico al variare della temperatura, per tre descrizioni',
   intro:R`Potenziale chimico in unit&agrave; di $\varepsilon_F$, in funzione di $T/T_F$. La parabola &egrave; la formula di Sommerfeld per un gas tridimensionale; la curva piatta &egrave; il risultato <i>esatto</i> per un gas bidimensionale; la curva ripida &egrave; il limite classico tridimensionale.`,
   plots:[
    {kind:'func2d', xr:[0.02,2.2], yr:[-2.2,1.25], height:350, ticks:6,
     title:'tre curve, due delle quali valgono solo a un estremo',
     curves:[
      {f:'1-pi*pi/12*x*x', col:'#4c8dff', label:'Sommerfeld in tre dimensioni'},
      {f:'x*log(exp(1/x)-1)', col:'#5eead4', label:'esatta in due dimensioni'},
      {f:'x*(-0.28471-1.5*log(x))', col:'#d8a13a', label:'limite classico, tre dimensioni', dash:true}
     ],
     segs:[{x1:0.02,y1:0,x2:2.2,y2:0,col:'#4d5a6b',width:1.2}],
     xlabel:'T / T_F', ylabel:'potenziale chimico / energia di Fermi'}
   ],
   leggi:R`<p><b>Che cosa guardare: dove le curve partono.</b> Tutte e due le curve valide a freddo partono da uno, cio&egrave; da $\varepsilon_F$, e lo fanno in due modi opposti. La blu se ne stacca subito, con pendenza nulla ma curvatura negativa — &egrave; il termine $T^2$. La verde resta <b>incollata a uno</b> per un tratto visibile, perch&eacute; la sua correzione &egrave; esponenziale: fino a $T/T_F\simeq0{,}3$ scende di meno di un tre per cento. Sono due comportamenti qualitativamente diversi, e la differenza sta tutta nell&rsquo;esponente della densit&agrave; di stati.</p>
   <p><b>Che cosa guardare: dove tagliano lo zero.</b> La blu taglia l&rsquo;asse a $T/T_F\simeq1{,}103$, la verde poco dopo. Il cambio di segno del potenziale chimico &egrave; il <b>confine fra regime degenere e regime classico</b>: sopra, il gas si comporta come un gas di Boltzmann, e infatti la curva tratteggiata — che l&igrave; comincia ad avere senso — prende il posto delle altre due. La curva classica vale $-0{,}285$ a $T=T_F$, e non &egrave; un caso che sia gi&agrave; negativa: il limite classico esiste solo dove $\mu$ lo &egrave;.</p>
   <p><b>Che cosa impararne per i conti.</b> Nessuna delle tre curve &egrave; valida ovunque, e la figura serve soprattutto a fissare i domini: Sommerfeld sotto qualche decimo di $T_F$, Boltzmann sopra $T_F$, il conto esatto solo dove esiste. <b>In un compito la prima cosa da stabilire &egrave; in quale dei due estremi ci si trova</b>, e il criterio &egrave; il confronto fra $T$ e $T_F$ — o, equivalentemente, fra $n\lambda^3$ e uno.</p>
   <p><b>Dove questa figura mente.</b> Mette sullo stesso grafico curve che descrivono <i>sistemi diversi</i>: la verde &egrave; bidimensionale, le altre due tridimensionali, e non vanno confrontate come se fossero approssimazioni successive della stessa cosa. E la blu &egrave; disegnata ben oltre il suo dominio di validit&agrave;: il suo andamento fra $0{,}5$ e $2{,}2$ non ha nessun valore quantitativo, ed &egrave; tracciato solo per mostrare dove la serie si smentisce da sola.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`In due dimensioni lo sviluppo di Sommerfeld d&agrave; correzione nulla a ogni ordine, eppure il potenziale chimico esatto <i>non</i> &egrave; costante. La serie &egrave; sbagliata?`,
    a:R`No: &egrave; corretta e incompleta, e la distinzione &egrave; il contenuto del caso. Il criterio &egrave; la <b>natura asintotica dello sviluppo</b>: una serie asintotica rappresenta la funzione a meno di termini che vanno a zero pi&ugrave; in fretta di ogni termine della serie. Qui la differenza fra la funzione e la serie &egrave; $T\log(1-e^{-\varepsilon_F/T})$, che per $T\to0^+$ &egrave; infinitesima di ordine superiore a ogni potenza di $T$: la serie, che &egrave; identicamente $\varepsilon_F$, la rappresenta correttamente <i>in quel senso</i>. <b>La lezione operativa</b>: quando tutti i termini di uno sviluppo asintotico si annullano, non si conclude che la grandezza sia costante — si conclude che l&rsquo;effetto &egrave; esponenzialmente piccolo, il che &egrave; un&rsquo;informazione diversa e altrettanto utile.`},
   {q:R`Un esercizio chiede $\mu(T)$ per un gas di fermioni. Come si decide se cercarlo esattamente o per sviluppo, e qual &egrave; il primo controllo da fare sul risultato?`,
    a:R`Si guarda l&rsquo;esponente della densit&agrave; di stati. <b>Se $G$ &egrave; costante</b> — gas libero bidimensionale, trappola armonica unidimensionale — l&rsquo;integrale del numero di particelle &egrave; elementare e si inverte esattamente: si ottiene $\mu=T\log(e^{\varepsilon_F/T}-1)$, e non serve nessuno sviluppo. <b>Se $G$ &egrave; una potenza non nulla</b>, l&rsquo;integrale non &egrave; elementare e si usa Sommerfeld. Il controllo da fare sempre, in entrambi i casi, sono i <b>due limiti</b>: per $T\to0$ il risultato deve tendere a $\varepsilon_F$, e per $T$ grande deve diventare negativo e andare come $-T\log T$. Un risultato che a temperatura nulla non d&agrave; $\varepsilon_F$ ha un errore nel conteggio degli stati; uno che resta positivo a temperature alte ha perso il segno.`}
  ]}
]},

/* ---------------- 08 · IL CALORE SPECIFICO LINEARE ---------------- */
{ num:'08', title:'Energia e calore specifico: perche lineare, e di quanto sbaglia l equipartizione', meta:'Sommerfeld applicato all energia · i due contributi al coefficiente · la frazione T su T di Fermi · il confronto col classico e il terzo principio',
  blocchi:[
  {t:'reveal', title:'L energia a temperatura finita, e i due contributi al coefficiente', tag:'costruzione', steps:[
   {label:'Applicare Sommerfeld al peso giusto', body:R`
   <p>L&rsquo;energia &egrave; l&rsquo;integrale di $\varepsilon$ per la densit&agrave; di stati per l&rsquo;occupazione, dunque il peso &egrave; $H(\varepsilon)=\mathcal A\varepsilon^{3/2}$ con $\mathcal A$ la stessa costante della tappa 06. La formula di Sommerfeld chiede due cose. Il primo termine &egrave; l&rsquo;integrale fino a $\mu$, che vale $\tfrac25\mathcal A\mu^{5/2}$; per il secondo serve la derivata del peso, $\tfrac32\mathcal A\sqrt\mu$, e moltiplicandola per $\pi^2T^2/6$ si ottiene $\frac{\pi^2}{4}T^2\mathcal A\sqrt\mu$. Dunque</p>
   $$E=\mathcal A\left[\tfrac25\mu^{5/2}+\frac{\pi^2}{4}T^2\sqrt\mu\right]$$
   <p>Fermarsi qui sarebbe l&rsquo;errore che la tappa 06 ha annunciato: dentro c&rsquo;&egrave; ancora $\mu$, che a $N$ fissato dipende dalla temperatura. <b>Il conto non &egrave; finito finch&eacute; non si sostituisce $\mu(T)$.</b></p>`},
   {label:'Sostituire il potenziale chimico, e i due pezzi che si sommano', body:R`
   <p>Si prenda $\mu=\varepsilon_F[1-\frac{\pi^2}{12}(T/\varepsilon_F)^2]$ e la si elevi a $5/2$. Al primo ordine nella correzione, $(1+y)^{5/2}\simeq1+\tfrac52y$, dunque il coefficiente diventa $\frac{5\pi^2}{24}$ e</p>
   $$\mu^{5/2}\simeq\varepsilon_F^{5/2}\left[1-\frac{5\pi^2}{24}\left(\frac{T}{\varepsilon_F}\right)^2\right]$$
   <p>Nel secondo termine, invece, basta $\sqrt\mu\simeq\sqrt{\varepsilon_F}$, perch&eacute; l&rsquo;errore che si commette &egrave; gi&agrave; di ordine $T^4$. Raccogliendo $\mathcal A\varepsilon_F^{5/2}$ restano due contributi al coefficiente di $(T/\varepsilon_F)^2$: uno negativo, $-\tfrac25\cdot\frac{5\pi^2}{24}$, che viene dalla discesa del potenziale chimico; e uno positivo, $+\frac{\pi^2}{4}$, che viene dalla formula di Sommerfeld. La loro somma vale $\frac{\pi^2}{6}$.</p>
   <p><b>Questo &egrave; il passaggio che decide il risultato</b>, ed &egrave; dove si perdono i compiti: i due contributi hanno segni opposti e il secondo &egrave; tre volte il primo, quindi chi dimentica la discesa di $\mu$ ottiene un coefficiente tre volte troppo grande. Raccogliendo il $\tfrac25$ davanti — cio&egrave; moltiplicando il contenuto della parentesi per $\tfrac52$ — il coefficiente finale diventa $\frac{5\pi^2}{12}\left(\frac{T}{T_F}\right)^2$, e siccome $\tfrac25\mathcal A\varepsilon_F^{5/2}$ &egrave; l&rsquo;energia a temperatura nulla, gi&agrave; calcolata nella tappa 04:</p>
   $$E=\tfrac35N\varepsilon_F\left[1+\frac{5\pi^2}{12}\left(\frac{T}{T_F}\right)^2\right]$$
   <p>che &egrave; il risultato di Crisanti (pag. 278) e di Grilli-Giardina (pag. 98), scritto identico nelle due fonti. Crisanti ci arriva per una strada diversa e pi&ugrave; laboriosa — integra per parti negli impulsi facendo comparire $p^5$, poi applica Sommerfeld all&rsquo;integrale in $y^{5/2}$ — e questa &egrave; una buona ragione per preferire la formula generale: <b>la stessa riga serve per l&rsquo;energia, per il numero di particelle e per qualunque altra grandezza</b>, senza rifare l&rsquo;integrazione per parti ogni volta.</p>`},
   {label:'Il calore specifico, e la forma generale che vale in ogni dimensione', body:R`
   <p>Il calore specifico a volume costante &egrave; la derivata dell&rsquo;energia rispetto alla temperatura, e la si fa direttamente sull&rsquo;espressione appena ottenuta. Il termine costante non contribuisce, quello quadratico d&agrave; un fattore $2T$:</p>
   $$C_V=\frac{\pi^2}{2}\,N\frac{T}{T_F}$$
   <p>identico a quello che Crisanti (pag. 276) riporta annotando &laquo;verificato su Huang&raquo;. <b>Il calore specifico di un gas di Fermi degenere &egrave; lineare nella temperatura e si annulla a temperatura nulla</b>, contro il valore costante $\tfrac32N$ dell&rsquo;equipartizione classica.</p>
   <p>Conviene per&ograve; ricavare anche la forma generale, perch&eacute; negli esercizi la dimensione cambia e il coefficiente $\pi^2/2$ no. Si parta dalla definizione, $C_V=\partial E/\partial T$ a $N$ fissato, e si osservi che a $N$ fissato si pu&ograve; sottrarre $\mu\,\partial N/\partial T$, che &egrave; nullo. Allora $C_V=\int d\varepsilon\,D(\varepsilon)(\varepsilon-\mu)\,\partial n/\partial T$, dove $D=g_sG$ &egrave; la densit&agrave; di stati totale. Con $x=(\varepsilon-\mu)/T$ si ha $\partial n/\partial T=\frac{x}{T}\frac{e^{x}}{(e^{x}+1)^2}$, e sostituendo $\varepsilon-\mu=Tx$ e $d\varepsilon=T\,dx$ compare esattamente l&rsquo;integrale $I_2$ della tappa 06. Se $D$ varia poco sulla scala $T$ la si valuta al bordo e resta</p>
   $$C_V=\frac{\pi^2}{3}\,T\,D(\varepsilon_F)$$
   <p><b>Questa &egrave; la formula da ricordare</b>, perch&eacute; separa ci&ograve; che dipende dal problema — la densit&agrave; di stati al livello di Fermi — da ci&ograve; che non ci dipende, il numero $\pi^2/3$. Il caso tridimensionale si ritrova sostituendo $D(\varepsilon_F)=\frac{3N}{2\varepsilon_F}$, che segue dal fatto che $N$ &egrave; l&rsquo;integrale di $D$ fino a $\varepsilon_F$ con $D\propto\sqrt\varepsilon$. In due dimensioni, dove $D$ &egrave; costante e vale $N/\varepsilon_F$, lo stesso conto d&agrave; $\frac{\pi^2}{3}N\frac{T}{T_F}$: <b>lo stesso andamento lineare con un coefficiente diverso</b>, ed &egrave; un controllo che conviene fare, perch&eacute; chi applica il $\pi^2/2$ tridimensionale a un problema bidimensionale sbaglia di un terzo.</p>`}
  ]},
  {t:'prosa', title:'Perche lineare: la frazione di gas che la temperatura riesce a muovere', tag:'grammatica', html:R`
  <p>Il coefficiente lo d&agrave; Sommerfeld, ma la <i>legge</i> — lineare invece che costante — si capisce senza fare nessun integrale, ed &egrave; la risposta che un orale chiede.</p>
  <p>Si scaldi il gas da zero a $T$. Una particella che stia parecchio sotto il livello di Fermi non pu&ograve; assorbire energia: per muoversi dovrebbe salire in un livello che dista meno di $T$ in energia, e tutti quei livelli sono occupati. <b>Le uniche particelle che possono cambiare stato sono quelle che stanno entro una fascia di larghezza dell&rsquo;ordine di $T$ dal bordo</b>, e la tappa 01 ha misurato quella fascia. La loro frazione sul totale &egrave; dell&rsquo;ordine di $T/T_F$, dunque il loro numero &egrave; $\Delta N\sim N\,T/T_F$; ciascuna guadagna un&rsquo;energia dell&rsquo;ordine di $T$. Perci&ograve;</p>
  <p style="text-align:center">$\Delta E\sim N\dfrac{T^2}{T_F}$, e derivando, $C_V\sim N\dfrac{T}{T_F}$.</p>
  <p>Crisanti (pag. 275) fa esattamente questa stima e ne trae $C_V=N\,T/T_F$, cio&egrave; la legge giusta con coefficiente uno. Due pagine dopo la corregge col conto esatto e ottiene il fattore $\pi^2/2$, che vale $\simeq4{,}935$. <b>Disaccordo (g), e vale la pena guardarlo per quello che &egrave;</b>: l&rsquo;euristica prende la legge e sbaglia il coefficiente di quasi cinque volte. Non &egrave; una critica all&rsquo;euristica — nessun argomento di ordini di grandezza pu&ograve; produrre un $\pi^2$ — ma &egrave; un avvertimento contro l&rsquo;uso del risultato euristico in un conto numerico. La regola: <b>l&rsquo;argomento della fascia serve per capire e per controllare l&rsquo;esponente, mai per dare un numero.</b></p>
  <p><b>Il terzo principio, che qui si verifica invece di postularlo.</b> Poich&eacute; $C_V=T\,\partial S/\partial T$, l&rsquo;entropia si ottiene integrando $C_V/T$ da zero a $T$; e siccome $C_V/T$ &egrave; costante, l&rsquo;integrale &egrave; immediato:</p>
  $$S=\frac{\pi^2}{2}\,N\frac{T}{T_F}$$
  <p>che tende a zero con la temperatura. Crisanti (pag. 276) fa lo stesso conto e osserva che il risultato &laquo;soddisfa il terzo principio della termodinamica&raquo;. Si noti la coincidenza numerica: <b>in questo regime entropia e calore specifico sono la stessa quantit&agrave;</b>, e non &egrave; un caso — succede ogni volta che il calore specifico &egrave; una potenza pura della temperatura con esponente uno.</p>`},
  {t:'plot', title:'Il calore specifico: la retta a freddo e il valore classico a caldo',
   intro:R`Calore specifico per particella, in unit&agrave; di $k_B$, in funzione di $T/T_F$. La retta &egrave; il risultato di Sommerfeld; l&rsquo;orizzontale &egrave; il valore classico $\tfrac32$; la curva &egrave; un raccordo <b>schematico</b>, costruito per avere la pendenza giusta all&rsquo;origine e il plateau giusto — non &egrave; il risultato di nessun conto.`,
   plots:[
    {kind:'func2d', xr:[0,3], yr:[0,2.0], height:340, ticks:6,
     title:'dalla retta quantistica al plateau classico',
     curves:[
      {f:'pi*pi/2*x', col:'#4c8dff', label:'Sommerfeld: pendenza pi al quadrato diviso due'},
      {f:'1.5', col:'#d8a13a', label:'equipartizione classica: tre mezzi', dash:true},
      {f:'1.5*(1-exp(-pi*pi/3*x))', col:'#5eead4', label:'raccordo schematico fra i due regimi'}
     ],
     segs:[{x1:0.304,y1:0,x2:0.304,y2:1.5,col:'#b98cff',dash:true,width:1.3,label:'dove la retta incontra il classico',lx:0.34,ly:1.62}],
     xlabel:'T / T_F', ylabel:'calore specifico per particella'}
   ],
   leggi:R`<p><b>Che cosa guardare: dove la retta incontra l&rsquo;orizzontale.</b> Accade a $T/T_F=3/\pi^2$, cio&egrave; a circa tre decimi della temperatura di Fermi. <b>&Egrave; la stima grossolana di dove finisce il regime degenere</b>, e non &egrave; un caso che sia lo stesso ordine di grandezza a cui la tappa 07 ha visto la serie di Sommerfeld smettere di funzionare: sono due sintomi della stessa cosa, cio&egrave; che a quelle temperature il bordo non &egrave; pi&ugrave; sottile rispetto al mare.</p>
   <p><b>Che cosa guardare: quanto &egrave; bassa la retta a sinistra.</b> Per un metallo a temperatura ambiente si sta a $T/T_F$ di qualche millesimo, cio&egrave; a un&rsquo;ascissa che in questa figura sarebbe indistinguibile da zero, e l&rsquo;ordinata vale poco pi&ugrave; di un centesimo. <b>Il calore specifico elettronico &egrave; quasi invisibile</b>, ed &egrave; per questo che il calore specifico misurato di un metallo a temperatura ambiente &egrave; quasi tutto dovuto alle vibrazioni del reticolo, non agli elettroni.</p>
   <p><b>Che cosa impararne per i conti.</b> L&rsquo;unica parte quantitativa della figura &egrave; la pendenza all&rsquo;origine, $\pi^2/2$ in tre dimensioni e $\pi^2/3$ in due. Il resto — dove esattamente il gas passa da un regime all&rsquo;altro — richiede un conto numerico che questo corso non chiede. <b>Se un esercizio chiede il calore specifico, chiede quella pendenza</b>, e il modo di ottenerla &egrave; sempre $\frac{\pi^2}{3}T\,D(\varepsilon_F)$ con la densit&agrave; di stati del problema.</p>
   <p><b>Dove questa figura mente.</b> La curva verde &egrave; un&rsquo;interpolazione inventata: ha la pendenza e il plateau giusti per costruzione, ma la sua forma in mezzo non corrisponde a nessun risultato. Il vero calore specifico ha un massimo poco sopra $T_F$ e poi scende al valore classico dall&rsquo;alto, cosa che questa curva non fa. E la figura ignora del tutto il reticolo, che in un metallo vero contribuisce un termine in $T^3$ e domina su tutto sopra pochi kelvin.</p>`},
  {t:'prosa', title:'Di quanto sbaglia l equipartizione, con i numeri del rame', tag:'grammatica', html:R`
  <p>Il confronto col risultato classico si fa in una riga. Il rapporto fra il calore specifico vero e quello che l&rsquo;equipartizione predirebbe &egrave;</p>
  $$\frac{C_V}{C_V^{\rm cl}}=\frac{\pi^2}{3}\frac{T}{T_F}$$
  <p>e per gli elettroni del rame a temperatura ambiente, con $T_F$ di ottantamila kelvin, vale circa l&rsquo;$1{,}2$ per cento. Detto al rovescio: <b>l&rsquo;equipartizione sovrastima il contributo elettronico di un fattore $\simeq83$</b>.</p>
  <p>Questo numero ha una storia. Prima della meccanica quantistica il modello di Drude descriveva i metalli come un gas di elettroni liberi classici, e prevedeva un contributo elettronico al calore specifico pari a $\tfrac32N k_B$ per mole di elettroni di conduzione — un contributo enorme, dello stesso ordine di quello del reticolo, che <b>nessun esperimento aveva mai visto</b>. Era una delle discrepanze aperte della fisica dei metalli, e non era una discrepanza di qualche per cento: era di due ordini di grandezza. La risposta &egrave; tutta in questa tappa: gli elettroni ci sono, sono liberi, e semplicemente <i>non possono assorbire calore</i> perch&eacute; quasi tutti gli stati in cui dovrebbero finire sono occupati.</p>
  <p><b>Il controllo sperimentale, e la forma in cui si fa.</b> Se il contributo elettronico &egrave; lineare in $T$ e quello del reticolo va come $T^3$, il calore specifico totale a bassa temperatura vale $\gamma T+\alpha T^3$; dividendo per $T$ si ottiene una retta in $T^2$, la cui intercetta &egrave; $\gamma$ e la cui pendenza &egrave; $\alpha$. <b>&Egrave; cos&igrave; che si misura la densit&agrave; di stati al livello di Fermi di un metallo</b>, perch&eacute; $\gamma$ vale $\frac{\pi^2}{3}k_B^2D(\varepsilon_F)$. La misura funziona, e i valori di $\gamma$ ottenuti in questo modo sono dello stesso ordine — ma non uguali — a quelli calcolati con il modello a elettroni liberi: la differenza si legge come una <i>massa efficace</i>, ed &egrave; da l&igrave; che comincia la fisica dei metalli vera.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Nel conto dell&rsquo;energia i due contributi al coefficiente sono $-\pi^2/12$ e $+\pi^2/4$. Da dove viene ciascuno, e che cosa succede se si dimentica il primo?`,
    a:R`Il positivo viene dalla <b>formula di Sommerfeld</b> applicata al peso $\varepsilon D(\varepsilon)$: &egrave; il termine $\frac{\pi^2}{6}T^2H'(\mu)$ con $H'=\tfrac32\mathcal A\sqrt\mu$. Il negativo viene dalla <b>discesa del potenziale chimico</b>: il primo termine dello sviluppo &egrave; $\int_0^\mu$, e $\mu$ &egrave; sceso, quindi si integra su un intervallo pi&ugrave; corto. Chi dimentica il secondo ottiene $\frac{\pi^2}{4}$ invece di $\frac{\pi^2}{6}$ nel coefficiente della parentesi, cio&egrave; un calore specifico <b>una volta e mezza</b> quello giusto. Il criterio che salva: il vincolo fisico &egrave; $N$ costante, non $\mu$ costante, e ogni volta che si usa Sommerfeld su un sistema a $N$ fissato la relazione per $N$ va imposta <i>prima</i> di calcolare qualunque altra cosa.`},
   {q:R`Come si riconosce, guardando un esercizio, se il calore specifico che chiede vale $\frac{\pi^2}{2}N\frac{T}{T_F}$ oppure qualcos&rsquo;altro?`,
    a:R`Si guarda la densit&agrave; di stati al livello di Fermi, perch&eacute; il criterio generale &egrave; $C_V=\frac{\pi^2}{3}T\,D(\varepsilon_F)$ e tutto il resto &egrave; conseguenza. Con $D\propto\varepsilon^{a-1}$ si ha $N=\frac{D(\varepsilon_F)\varepsilon_F}{a}$, dunque $D(\varepsilon_F)=aN/\varepsilon_F$ e <b>$C_V=\frac{\pi^2a}{3}N\frac{T}{T_F}$</b>: il coefficiente &egrave; $\pi^2a/3$, che d&agrave; $\pi^2/2$ per il gas libero tridimensionale ($a=3/2$), $\pi^2/3$ in due dimensioni e per la trappola armonica unidimensionale ($a=1$), $\pi^2/6$ in una dimensione ($a=1/2$). <b>Il trabocchetto</b>: con un potenziale esterno $D$ non &egrave; una potenza pura e la relazione fra $D(\varepsilon_F)$ e $N$ non &egrave; quella; l&igrave; si torna alla formula generale e si valuta $D$ al livello di Fermi calcolandolo, non deducendolo da $N$.`}
  ]}
]},

/* ---------------- 09 · ESERCIZI ---------------- */
{ num:'09', title:'Esercizi — tocca a te', meta:'l oscillatore bidimensionale · il gas piatto risolto esattamente · il potenziale a due gradini con lo spin',
  blocchi:[
  {t:'esercizio', title:'1 · Oscillatore armonico bidimensionale: livello di Fermi contato in due modi',
   src:'Crisanti pag. 279, esercizio di esonero del 18-3-2004, svolto qui per intero e completato con energia media e raggio',
   testo:R`$N$ particelle identiche di massa $m$ e spin $1/2$ sono confinate da un potenziale armonico bidimensionale, con hamiltoniana di singola particella $H=\frac{p^2}{2m}+\frac12m\omega^2r^2$. I livelli sono $\varepsilon_n=(n+1)\hbar\omega$ con degenerazione orbitale $n+1$. (a) Calcola l'energia di Fermi contando esattamente i livelli, e ritrovala per via semiclassica dal volume di spazio delle fasi. (b) Calcola l'energia media per particella a $T=0$. (c) Calcola il raggio quadratico medio della nuvola.`,
   steps:[
    {label:'a · Il conteggio esatto, e quello semiclassico', body:R`
    <p><b>Il riconoscimento</b>: a temperatura nulla si riempiono i livelli dal basso, dunque il problema &egrave; contare quanti stati stanno sotto un dato livello. Includendo lo spin, la degenerazione totale del livello $n$-esimo &egrave; $g(n)=2(n+1)$, e il numero di stati fino al livello $n$ compreso &egrave; una somma elementare:</p>
    $$N(n)=\sum_{k=0}^{n}2(k+1)=(n+1)(n+2)$$
    <p>Il livello di Fermi $n_F$ &egrave; quello che esaurisce le particelle, cio&egrave; la soluzione di $(n_F+1)(n_F+2)=N$. &Egrave; un&rsquo;equazione di secondo grado, e la radice positiva &egrave;</p>
    $$n_F=\sqrt{N+\tfrac14}-\tfrac32$$
    <p>che si verifica in una riga moltiplicando $(\sqrt{N+\tfrac14}-\tfrac12)(\sqrt{N+\tfrac14}+\tfrac12)$, differenza di quadrati che d&agrave; esattamente $N$. Per $N$ grande il mezzo e il tre mezzi sono trascurabili e resta $n_F\simeq\sqrt N$, dunque $\varepsilon_F\simeq\sqrt N\,\hbar\omega$.</p>
    <p><b>La verifica semiclassica</b>, che &egrave; il metodo da usare quando lo spettro non si conosce. Lo spazio delle fasi ha quattro dimensioni, e la regione $H\le\varepsilon$ &egrave; una palla quadridimensionale nelle variabili riscalate $u_i=p_i/\sqrt{2m}$ e $v_i=q_i\sqrt{m\omega^2/2}$, dove $H$ diventa la somma dei quattro quadrati. Il volume di una palla di raggio $\sqrt\varepsilon$ in quattro dimensioni &egrave; $\pi^2\varepsilon^2/2$, e lo jacobiano del cambio di variabile vale $4/\omega^2$ — la massa si semplifica fra impulsi e posizioni. Dividendo per $h^2$:</p>
    $$\Gamma(\varepsilon)=\frac{1}{h^2}\cdot\frac{4}{\omega^2}\cdot\frac{\pi^2\varepsilon^2}{2}=\frac{\varepsilon^2}{2\hbar^2\omega^2}$$
    <p>Moltiplicando per la degenerazione di spin e imponendo che il conto dia $N$:</p>
    $$N=g_s\Gamma(\varepsilon_F)=\frac{\varepsilon_F^2}{(\hbar\omega)^2}$$
    <p>da cui $\varepsilon_F=\sqrt N\,\hbar\omega$, <b>identico al conteggio esatto nel limite di grandi $N$</b>. La coincidenza non &egrave; casuale: per un oscillatore la regola di quantizzazione semiclassica &egrave; esatta a meno del mezzo, e il mezzo &egrave; ci&ograve; che si perde trascurando il $3/2$.</p>`},
    {label:'b · L energia media, senza rifare nessun integrale', body:R`
    <p>La densit&agrave; di stati totale &egrave; la derivata del conteggio,</p>
    $$D(\varepsilon)=\frac{2\varepsilon}{(\hbar\omega)^2}$$
    <p>cio&egrave; una potenza con esponente $a-1=1$, dunque $a=2$. <b>Qui si vede il vantaggio di avere riconosciuto l&rsquo;esponente</b>: la formula generale d&agrave; subito $\langle\varepsilon\rangle=\frac{a}{a+1}\varepsilon_F$ con $a=2$, e non serve altro. Chi vuole il conto esplicito lo fa in due righe:</p>
    $$E=\int_0^{\varepsilon_F}\varepsilon\,D(\varepsilon)\,d\varepsilon=\frac{2\varepsilon_F^3}{3(\hbar\omega)^2}$$
    <p>e dividendo per $N=\varepsilon_F^2/(\hbar\omega)^2$:</p>
    $$\frac EN=\frac23\varepsilon_F$$
    <p><b>Il controllo che conviene fare</b>: due terzi &egrave; maggiore dei tre quinti del gas libero tridimensionale, e deve esserlo, perch&eacute; qui l&rsquo;esponente della densit&agrave; di stati &egrave; pi&ugrave; grande e le particelle si addensano di pi&ugrave; verso il bordo. Se il risultato fosse venuto <i>minore</i> di $3/5$, il conto avrebbe un errore di esponente.</p>`},
    {label:'c · Il raggio, col teorema del viriale', body:R`
    <p>L&rsquo;ultima domanda chiede una media geometrica: quanto &egrave; larga la nuvola. Si pu&ograve; fare integrando la densit&agrave; spaziale del gas intrappolato, ma c&rsquo;&egrave; una scorciatoia che &egrave; anche la risposta giusta all&rsquo;orale. <b>Il teorema del viriale per un potenziale omogeneo di grado due</b> d&agrave; $\langle T\rangle=\langle V\rangle$ in ogni autostato, e quindi anche sommando su tutti gli stati occupati: l&rsquo;energia potenziale media per particella &egrave; met&agrave; dell&rsquo;energia media, cio&egrave; $\tfrac12\langle\varepsilon\rangle$. Dunque</p>
    $$\tfrac12m\omega^2\langle r^2\rangle=\tfrac12\cdot\tfrac23\varepsilon_F$$
    <p>e risolvendo</p>
    $$\langle r^2\rangle=\frac{2\varepsilon_F}{3m\omega^2}$$
    <p>Il raggio quadratico medio &egrave; la radice di questo, e cresce come $N^{1/4}$ perch&eacute; $\varepsilon_F$ cresce come $\sqrt N$. <b>Che cosa portarsi via</b>: una nuvola di fermioni intrappolati si allarga al crescere del numero di particelle, a differenza di un condensato di bosoni che resterebbe nello stato fondamentale della trappola. &Egrave; il modo pi&ugrave; diretto in cui il principio di esclusione si <i>vede</i> in un esperimento con atomi freddi, ed &egrave; proprio cos&igrave; che lo si &egrave; osservato la prima volta.</p>`}
   ]},
  {t:'esercizio', title:'2 · Gas bidimensionale di spin un mezzo: il caso che si risolve esattamente',
   src:'Crisanti pag. 335, esercizio proposto e non svolto nelle note, svolto qui per intero',
   testo:R`Un gas di fermioni di spin $1/2$ e massa $m$, con $H=\frac{p^2}{2m}$, &egrave; vincolato su una superficie di area $A$. Detta $\rho=N/A$ la densit&agrave; superficiale: (a) calcola $\varepsilon_F$ in funzione di $\rho$; (b) determina $\mu(T)$ esattamente; (c) verifica il limite per $T\to0$; (d) calcola il calore specifico a bassa temperatura.`,
   steps:[
    {label:'a · L energia di Fermi in due dimensioni', body:R`
    <p><b>Il riconoscimento</b>: in due dimensioni la densit&agrave; di stati &egrave; costante, perch&eacute; l&rsquo;esponente $d/2-1$ si annulla. Dalla formula generale, con $g_s=2$, la densit&agrave; totale vale $\mathcal D_0=2\cdot\frac{mA}{2\pi\hbar^2}$. Il conteggio a temperatura nulla &egrave; allora banale — l&rsquo;integrale di una costante — e d&agrave; $N=\mathcal D_0\varepsilon_F$, cio&egrave;</p>
    $$\varepsilon_F=\frac{2\pi\hbar^2}{g_sm}\,\frac NA=\frac{\pi\hbar^2\rho}{m}$$
    <p><b>Il fatto notevole</b>: in due dimensioni l&rsquo;energia di Fermi &egrave; <i>lineare</i> nella densit&agrave;, non $\rho^{2/3}$. La regola generale &egrave; $\varepsilon_F\propto\rho^{2/d}$, che d&agrave; $\rho^{2/3}$ in tre dimensioni, $\rho$ in due e $\rho^2$ in una. Un esercizio che chieda «come cambia $\varepsilon_F$ raddoppiando la densit&agrave;» ha risposte diverse nelle tre dimensioni, e il numero da ricordare &egrave; l&rsquo;esponente, non il prefattore.</p>`},
    {label:'b, c · Il potenziale chimico esatto e il suo limite', body:R`
    <p>Poich&eacute; $\mathcal D_0$ &egrave; costante, l&rsquo;integrale che fissa il numero di particelle si fa esattamente: la primitiva di $1/(e^{u}+1)$ &egrave; elementare, e si ottiene $N=\mathcal D_0T\log(1+e^{\mu/T})$. Uguagliando questa al valore a temperatura nulla, $\mathcal D_0\varepsilon_F$, e risolvendo per $\mu$:</p>
    $$\mu(T)=T\log\left(e^{\varepsilon_F/T}-1\right)$$
    <p><b>Nessuno sviluppo asintotico, nessuna approssimazione</b>: questa formula vale a ogni temperatura. Il limite richiesto dal quesito si verifica direttamente,</p>
    $$\lim_{T\to0^+}\mu(T)=\varepsilon_F$$
    <p>come deve essere. E riscrivendo la formula come $\mu=\varepsilon_F+T\log(1-e^{-\varepsilon_F/T})$ si legge la struttura della correzione: <b>esponenzialmente piccola in $\varepsilon_F/T$</b>, non una potenza. Chi avesse attaccato questo quesito con Sommerfeld avrebbe ottenuto $\mu=\varepsilon_F$ senza correzioni — risposta corretta ma muta, perch&eacute; l&rsquo;intero effetto vive fuori dalla serie.</p>
    <p>Per temperature alte la stessa formula si raccorda al regime classico: per $\varepsilon_F/T$ piccolo il logaritmo di $e^{\varepsilon_F/T}-1$ diventa il logaritmo di $\varepsilon_F/T$, che &egrave; negativo e grande in modulo. <b>Una formula sola copre entrambi i regimi</b>, ed &egrave; il vantaggio di avere un risultato esatto invece di due sviluppi.</p>`},
    {label:'d · Il calore specifico, e il coefficiente che non e quello di sempre', body:R`
    <p>La formula generale della tappa 08 chiede solo la densit&agrave; di stati al livello di Fermi, che qui &egrave; $\mathcal D_0=N/\varepsilon_F$. Dunque</p>
    $$C_V=\frac{\pi^2}{3}\,N\frac{T}{T_F}$$
    <p><b>Il coefficiente &egrave; $\pi^2/3$ e non $\pi^2/2$</b>, e questa &egrave; la trappola dell&rsquo;esercizio: il $\pi^2/2$ che tutti ricordano vale solo in tre dimensioni, perch&eacute; contiene il fattore $a=3/2$. La forma che si applica sempre &egrave; $C_V=\frac{\pi^2a}{3}N\frac{T}{T_F}$, e qui $a=1$.</p>
    <p><b>Un controllo che chiude l&rsquo;esercizio in modo elegante.</b> A questo punto si hanno due informazioni apparentemente in conflitto: il potenziale chimico non ha correzioni in potenze di $T$, eppure il calore specifico ce le ha. Non c&rsquo;&egrave; contraddizione, e capire perch&eacute; &egrave; il punto dell&rsquo;esercizio: la correzione al potenziale chimico &egrave; proporzionale alla <i>derivata</i> della densit&agrave; di stati, che qui &egrave; nulla; la correzione all&rsquo;energia &egrave; proporzionale alla derivata di $\varepsilon D(\varepsilon)$, che qui vale $\mathcal D_0$ e non &egrave; nulla. <b>Due grandezze diverse pesano derivate diverse</b>, e l&rsquo;unica difesa contro questo tipo di errore &egrave; applicare la formula di Sommerfeld al peso giusto ogni volta, invece di ricordare i risultati.</p>`}
   ]},
  {t:'esercizio', title:'3 · Un potenziale a due gradini con lo spin: densita di stati, soglia e energia',
   src:'Crisanti pag. 333-336, esercizio d esame svolto nelle note, qui ricontrollato e corretto in due punti',
   testo:R`$N$ fermioni identici in una dimensione, confinati in $0\le q\le L$, con hamiltoniana di singola particella $H=a|p|+V_0\sigma$ dove $\sigma=\pm1$ &egrave; una variabile interna a due valori. (a) Calcola la densit&agrave; di stati $G(\varepsilon)$. (b) Determina il numero massimo di particelle che il sistema pu&ograve; contenere affinch&eacute; a $T=0$ nessuna occupi stati con $\sigma=+1$, e ricava $\varepsilon_F(N)$ sotto quella soglia. (c) Raddoppiando quel numero di particelle, calcola l'energia a temperatura nulla.`,
   steps:[
    {label:'a · La densita di stati, che diventa una somma di gradini', body:R`
    <p><b>Il riconoscimento</b>: la variabile interna non &egrave; un grado di libert&agrave; continuo, quindi la misura degli stati &egrave; una somma sui suoi due valori per l&rsquo;integrale ordinario nello spazio delle fasi unidimensionale. Si parte dalla definizione con la delta:</p>
    $$G(\varepsilon)=\frac1h\sum_{\sigma=\pm1}\int_0^{L}dq\int_{-\infty}^{+\infty}dp\;\delta(\varepsilon-a|p|-V_0\sigma)$$
    <p>L&rsquo;integrale sulle posizioni d&agrave; $L$. Quello sugli impulsi si fa con la <span class="str" data-str="delta-di-dirac">delta composta</span>: l&rsquo;argomento si annulla per $|p|=(\varepsilon-V_0\sigma)/a$, cio&egrave; in <i>due</i> punti simmetrici, e in ciascuno il modulo della derivata vale $a$; ma i due punti esistono solo se l&rsquo;energia supera la soglia. Dunque</p>
    $$\int_{-\infty}^{+\infty}dp\,\delta(\varepsilon-a|p|-V_0\sigma)=\frac{2}{a}\theta(\varepsilon-V_0\sigma)$$
    <p>e sommando sui due valori di $\sigma$:</p>
    $$G(\varepsilon)=\frac{2L}{ha}\left[\theta(\varepsilon+V_0)+\theta(\varepsilon-V_0)\right]$$
    <p>identica a quella di Crisanti (pag. 333). <b>Che cosa leggere in questa formula.</b> La densit&agrave; di stati &egrave; costante a tratti: vale zero sotto $-V_0$, vale $\frac{2L}{ha}$ fra $-V_0$ e $V_0$ — dove solo il canale $\sigma=-1$ &egrave; aperto — e vale il doppio sopra $V_0$, dove si apre anche l&rsquo;altro. <b>Il gradino &egrave; l&rsquo;apertura di un canale</b>, ed &egrave; il meccanismo che rende l&rsquo;esercizio interessante: l&rsquo;energia di Fermi cade in uno dei due tratti, e da quale dipende tutta la risposta.</p>`},
    {label:'b · La soglia, e due sviste della fonte', body:R`
    <p>Chiedere che nessuna particella occupi stati con $\sigma=+1$ significa chiedere che il livello di Fermi non arrivi a $V_0$, che &egrave; l&rsquo;energia minima di quel canale. La condizione &egrave; dunque $\varepsilon_F\le V_0$, e il numero massimo di particelle &egrave; il conteggio degli stati fino a quella soglia, partendo dal fondo dello spettro che sta a $-V_0$:</p>
    $$N_{\max}=\frac{2L}{ha}\int_{-V_0}^{V_0}d\varepsilon=\frac{4LV_0}{ha}$$
    <p>Sotto quella soglia, con $N$ generico, lo stesso conteggio fermato a $\varepsilon_F$ d&agrave; $N=\frac{2L}{ha}(\varepsilon_F+V_0)$, cio&egrave;</p>
    $$\varepsilon_F=\frac{haN}{2L}-V_0$$
    <p>e si controlla che per $N=N_{\max}$ questa restituisce esattamente $V_0$.</p>
    <p><b>Disaccordo (e): due sviste nelle note, e il conto stesso le smentisce.</b> Crisanti a pag. 334 scrive «quindi occorre che $\varepsilon_F\le0$», ma due righe dopo calcola $N$ integrando <i>da $-V_0$ a $+V_0$</i>: le due cose non stanno insieme, e la seconda &egrave; quella giusta, perch&eacute; l&rsquo;estremo superiore di quell&rsquo;integrale <i>&egrave;</i> il livello di Fermi massimo ammesso. La condizione corretta &egrave; $\varepsilon_F\le V_0$. La seconda svista &egrave; a pag. 335, dove si legge «$\varepsilon_F=\frac{ha}{4L}N$»: quella non &egrave; l&rsquo;energia di Fermi, &egrave; l&rsquo;inversione di $N_{\max}$ rispetto a $V_0$, cio&egrave; la <b>soglia sull&rsquo;altezza del gradino</b> a numero di particelle fissato. Sono errori di etichetta, non di conto, ma in un compito costano il quesito. <b>Il controllo che li scova entrambi</b>: verificare che la formula per $\varepsilon_F$ dia $-V_0$ quando $N\to0$, cio&egrave; che a gas vuoto il livello di Fermi coincida col fondo dello spettro. La formula corretta lo fa; quella stampata no.</p>`},
    {label:'c · L energia a temperatura nulla col doppio delle particelle', body:R`
    <p>Con $N'=2N_{\max}$ il livello di Fermi sale sopra $V_0$ e il secondo canale si apre. Il conteggio ha ora due contributi:</p>
    $$N'=\frac{2L}{ha}\left[(\varepsilon_F+V_0)+(\varepsilon_F-V_0)\right]=\frac{4L\varepsilon_F}{ha}=\frac{8LV_0}{ha}$$
    <p>da cui $\varepsilon_F=2V_0$, il valore che Crisanti indica. <b>Si noti come $V_0$ sia sparito dal conteggio</b> sopra la soglia: i due canali sono spostati simmetricamente e le loro soglie si compensano, cosicch&eacute; il gas si comporta come se il potenziale non ci fosse. Questo <i>non</i> vale per l&rsquo;energia, che pesa ogni stato con la sua.</p>
    <p>L&rsquo;energia si calcola integrando $\varepsilon$ contro la densit&agrave; di stati, spezzando sui due canali con i rispettivi estremi inferiori:</p>
    $$E(0)=\frac{2L}{ha}\left[\int_{-V_0}^{2V_0}\varepsilon\,d\varepsilon+\int_{V_0}^{2V_0}\varepsilon\,d\varepsilon\right]=\frac{6LV_0^2}{ha}$$
    <p>perch&eacute; ciascuno dei due integrali vale $\tfrac32V_0^2$ — il primo perch&eacute; $4V_0^2-V_0^2$ diviso due fa tre mezzi, il secondo per lo stesso motivo con estremi diversi ma stessa differenza di quadrati. <b>Che i due integrali vengano uguali &egrave; una coincidenza di questi estremi</b>, non una simmetria: chi la assume in generale sbaglia il prossimo esercizio.</p>
    <p>L&rsquo;energia media per particella si ottiene dividendo per $N'$:</p>
    $$\frac{E}{N'}=\frac34V_0$$
    <p><b>Il controllo finale</b>: questo numero deve stare fra il fondo dello spettro, $-V_0$, e il livello di Fermi, $2V_0$, ed &egrave; l&igrave; dentro. Inoltre &egrave; positivo, il che dice che il gas &egrave; abbastanza degenere da riempire in prevalenza stati sopra lo zero — coerente col fatto che $\varepsilon_F$ &egrave; il doppio di $V_0$. Un risultato negativo, con questi dati, avrebbe segnalato un errore negli estremi di integrazione, che &egrave; l&rsquo;errore tipico di questa famiglia.</p>`}
   ]}
]},

/* ---------------- 10 · IL SENSO E LE ROTTE ---------------- */
{ num:'10', title:'Il senso, e le rotte', meta:'cosa lascia in mano · dove il mare di Fermi riappare in fisica · la domanda che porta avanti',
  blocchi:[
  {t:'prosa', title:'Cosa portarsi via', tag:'sintesi', html:R`
  <p><b>Il punto.</b> Lo stato fondamentale di un gas di fermioni non interagenti non &egrave; un problema di meccanica statistica: &egrave; un problema di conteggio. Si ordinano gli stati di singola particella per energia crescente, si riempiono dal basso uno per volta, e l&rsquo;energia dell&rsquo;ultimo riempito &egrave; l&rsquo;energia di Fermi. Tutto il resto — energia media, pressione, calore specifico — sono integrali sulla stessa densit&agrave; di stati, e la temperatura entra solo attraverso un bordo di larghezza $T$ attorno a quel livello.</p>
  <p><b>Che cosa ricordare, in ordine di durata.</b> Che $\varepsilon_F=\frac{\hbar^2}{2m}\left(\frac{6\pi^2n}{g_s}\right)^{2/3}$ in tre dimensioni, e che il fattore di spin va messo una volta sola. Che l&rsquo;impulso di Fermi &egrave; $\hbar$ diviso la distanza fra le particelle, cio&egrave; che il mare &egrave; un effetto di indeterminazione e non di temperatura. Che la macchina che risolve tutto &egrave; $G(\varepsilon)$, calcolata con la delta e con la theta che limita la regione accessibile, e che il numero che la riassume &egrave; l&rsquo;esponente $a$ tale che $G\propto\varepsilon^{a-1}$. Che da quell&rsquo;esponente seguono, senza altri conti, $\langle\varepsilon\rangle=\frac{a}{a+1}\varepsilon_F$, $PV=\frac Ea$ e il coefficiente del calore specifico. Che la forma generale del calore specifico &egrave; $C_V=\frac{\pi^2}{3}\,T\,D(\varepsilon_F)$, lineare perch&eacute; solo una frazione $T/T_F$ del gas pu&ograve; muoversi. E che la pressione non si annulla a temperatura nulla, perch&eacute; comprimere costa anche quando nulla si agita.</p>
  <p><b>La strategia d&rsquo;attacco, che &egrave; sempre la stessa.</b> Si scrive $H$ di singola particella; si calcola $G(\varepsilon)$ dalla definizione, con la theta se c&rsquo;&egrave; un potenziale; si riconosce l&rsquo;esponente; si impone $N=g_s\int_{\varepsilon_{\min}}^{\varepsilon_F}G\,d\varepsilon$ e si inverte per $\varepsilon_F$ — ricordando che il limite inferiore &egrave; il fondo dello spettro e non zero; si calcolano le medie richieste come rapporti di integrali; e solo se il testo chiede la temperatura si accende Sommerfeld, imponendo $N$ costante <i>prima</i> di calcolare qualunque altra cosa. Chi salta quest&rsquo;ultimo passo ottiene coefficienti sbagliati in modo plausibile, che &egrave; il modo peggiore di sbagliare.</p>
  <p><b>E una cosa che non &egrave; una formula.</b> Sette volte, in questo movimento, due fonti hanno detto cose diverse o una fonte si &egrave; contraddetta: il fattore di spin dentro o fuori la densit&agrave; di stati, l&rsquo;energia di Fermi scritta con e senza quel fattore, due temperature diverse chiamate quasi allo stesso modo, un esponente positivo dove ne serviva uno negativo, una condizione su $\varepsilon_F$ smentita dal conto che le sta sotto, un&rsquo;etichetta scambiata fra due grandezze, e una stima euristica sbagliata di cinque volte. Nessuno di questi difetti si vede rileggendo; tutti si vedono con un controllo indipendente. <b>Tre controlli sono sempre disponibili in questo campo</b>: una correzione termica deve annullarsi a temperatura nulla; l&rsquo;energia di Fermi deve tendere al fondo dello spettro quando il gas si svuota; e ogni media deve cadere fra il minimo e il massimo dell&rsquo;intervallo su cui &egrave; presa.</p>`},
  {t:'prolessi', title:'Dove riappare questo movimento',
   oggetto:R`<b>Il mare di Fermi</b> — un insieme di stati riempiti fino a un bordo — e <b>la densit&agrave; di stati al bordo</b>, $D(\varepsilon_F)$, che &egrave; l&rsquo;unico numero da cui dipende tutto ci&ograve; che il sistema fa a bassa temperatura.`,
   rotte:[
    {dove:'Stelle compatte<br>e il limite di Chandrasekhar', txt:R`Una <b>nana bianca</b> &egrave; una stella in cui la pressione di degenerazione degli elettroni regge la gravit&agrave;, e il conto &egrave; quello della tappa 05 applicato a densit&agrave; di $10^{9}$ chilogrammi al metro cubo. L&rsquo;equilibrio esiste perch&eacute; la pressione cresce come $n^{5/3}$; ma quando la densit&agrave; sale abbastanza l&rsquo;impulso di Fermi diventa confrontabile con $mc$, la relazione fra energia e impulso passa a $\varepsilon\simeq c|\vec p|$, l&rsquo;esponente della densit&agrave; di stati passa da un mezzo a due, e la pressione passa ad andare come $n^{4/3}$ — <b>troppo debole per reggere</b>, perch&eacute; anche l&rsquo;energia gravitazionale scala con quella potenza e il bilancio smette di dipendere dal raggio. La massa oltre la quale nessun equilibrio &egrave; possibile &egrave; il <b>limite di Chandrasekhar</b>, circa $1{,}4$ masse solari, e il suo valore si ottiene da questo movimento cambiando una sola cosa: la dispersione. Oltre quel limite il collasso prosegue finch&eacute; sono i <b>neutroni</b> a diventare degeneri, con lo stesso conto e una massa duemila volte maggiore — ed &egrave; per questo che una stella di neutroni &egrave; grande dieci chilometri invece che diecimila.`},
    {dove:'Metalli<br>e materia condensata', txt:R`Il calore specifico lineare in $T$ &egrave; la prima previsione quantitativa che distingue un metallo quantistico da uno classico, e misurarne il coefficiente $\gamma$ &egrave; il modo standard di <b>misurare la densit&agrave; di stati al livello di Fermi</b>: si riporta il calore specifico diviso per la temperatura in funzione di $T^2$, e l&rsquo;intercetta d&agrave; $\gamma=\frac{\pi^2}{3}k_B^2D(\varepsilon_F)$. Il fatto che il valore misurato non coincida con quello del gas libero si legge come <b>massa efficace</b>, e quel numero &egrave; il primo dato quantitativo sulla struttura a bande di un materiale. Lo stesso $D(\varepsilon_F)$ governa la suscettivit&agrave; magnetica di Pauli, la conducibilit&agrave; termica e la temperatura critica di un superconduttore nella teoria BCS. E la <b>superficie di Fermi</b> non &egrave; un&rsquo;astrazione: la si misura punto per punto con la fotoemissione risolta in angolo, e la sua forma decide se un materiale conduca, rifletta la luce o diventi magnetico.`},
    {dove:'Nuclei atomici<br>e materia nucleare', txt:R`Un nucleo &egrave; un sistema di protoni e neutroni che, in prima approssimazione, si muovono liberamente in una buca: &egrave; il <b>modello a gas di Fermi</b> del nucleo, e d&agrave; un&rsquo;energia di Fermi di circa trentotto megaelettronvolt con la densit&agrave; nucleare osservata. Da l&igrave; escono due numeri che entrano nella formula semiempirica di massa: il <b>termine di asimmetria</b>, che penalizza i nuclei con troppi neutroni rispetto ai protoni perch&eacute; le due specie riempiono due mari separati e sbilanciarli costa energia, e la <b>compressibilit&agrave;</b> della materia nucleare, che &egrave; la stessa derivata seconda dell&rsquo;energia rispetto al volume calcolata nella tappa 05. Il fatto che i nucleoni interagiscano fortemente e che il modello funzioni comunque &egrave; la stessa circostanza da spiegare che si incontra nei metalli.`},
    {dove:'Atomi freddi<br>e gas quantistici in laboratorio', txt:R`Dal 1999 si raffreddano gas di atomi fermionici — potassio 40, litio 6 — fino a temperature di qualche centesimo di $T_F$, in trappole armoniche come quella dell&rsquo;esercizio 1. L&igrave; il mare di Fermi si <b>fotografa</b>: si spegne la trappola, si lascia espandere la nuvola, e la distribuzione degli impulsi che si misura &egrave; la palla di raggio $p_F$ di questo movimento. La firma dell&rsquo;esclusione si vede a occhio confrontando due specie nella stessa trappola: la nuvola fermionica &egrave; pi&ugrave; larga di quella bosonica alla stessa temperatura, e il suo raggio cresce con il numero di particelle secondo la potenza calcolata nell&rsquo;esercizio 1. Su questi sistemi si accende e si spegne l&rsquo;interazione con un campo magnetico, e si osserva il passaggio continuo da un gas di Fermi a un superfluido di coppie — la transizione che collega questo movimento alla materia condensata.`}
   ],
   domanda:R`Tutto questo movimento poggia su un&rsquo;ipotesi che non &egrave; mai stata messa in discussione: le particelle <b>non interagiscono</b>, e lo stato del gas &egrave; specificato da quali livelli di singola particella siano occupati. Ma in un metallo l&rsquo;energia di interazione coulombiana fra gli elettroni &egrave; dello stesso ordine della loro energia cinetica, e in un nucleo l&rsquo;interazione forte &egrave; tutt&rsquo;altro che debole — eppure il modello a particelle indipendenti descrive bene entrambi. <b>Domanda che porti avanti:</b> perch&eacute; un modello senza interazioni funziona proprio dove le interazioni sono grandi? La risposta non &egrave; che siano piccole, ed &egrave; una delle idee pi&ugrave; belle della fisica del Novecento: le interazioni non spostano le particelle una per volta, ma <i>rinominano</i> l&rsquo;oggetto di cui si parla. Gli stati a bassa energia di un sistema di fermioni interagenti sono in corrispondenza uno a uno con quelli del gas libero, e ci&ograve; che li occupa non sono elettroni ma <b>quasiparticelle</b> — elettroni vestiti della deformazione che producono attorno a s&eacute; — con una massa diversa e una vita media finita. Il mare di Fermi sopravvive, la sua superficie sopravvive, il calore specifico resta lineare, e cambiano solo i coefficienti: ecco perch&eacute; misurarli d&agrave; informazione. Capire <i>fino a dove</i> questa corrispondenza regge, e che cosa succede dove si rompe — nei superconduttori, nei liquidi di Luttinger unidimensionali, nei metalli strani — &egrave; il punto da cui comincia tutta la teoria moderna della materia.`}
]}

function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';

}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    /* DUE SCHEMI, NON UNO — scoperto il 2026-10-06 provando le pagine vive. I movimenti
       scritti per primi (em-01..03, me-10b, i collaudi di gd-01..09 e di quattro em)
       usano una forma piu' semplice: `reveal` e `prolessi` con un solo `html`,
       `esercizio` e `collaudo` con `html` + `sol`. Il renderer ne conosceva una sola e
       chiamava `steps.forEach` su `undefined`: TypeError, e la tappa si fermava li' —
       62 blocchi in 17 movimenti su 74. Non si riscrive il contenuto per far contento
       il renderer: e' il renderer che deve leggere cio' che c'e'.
       E in fondo un ramo che NON muore: uno schema nuovo di domani deve far vedere un
       avviso in quella sezione, non spegnere la pagina sotto di se'. */
    try{
      if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
      else if(b.t==='prolessi') m.appendChild(b.rotte ? sectionProlessi(b)
                                   : sectionProsa(b.title,'prolessi',b.html));
      else if(b.t==='reveal')m.appendChild(b.steps ? sectionReveal(b.title,b.tag,b.steps)
                                   : sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='esercizio') m.appendChild(b.steps ? sectionEsercizio(b)
                                   : sectionSvelabile(b.title,'esercizio',b.html,b.sol));
      else if(b.t==='collaudo')  m.appendChild(b.items ? sectionCollaudo(b.title,b.items)
                                   : sectionSvelabile(b.title,'provi, poi riveli',b.html,b.sol));
      else if(b.t==='plot')      m.appendChild(sectionPlot(b));
      else m.appendChild(sectionProsa(b.title||'(blocco)', 'tipo sconosciuto: '+b.t,
                                      b.html||''));
    }catch(err){
      var avv=document.createElement('section'); avv.className='section';
      avv.innerHTML='<h3>'+(b.title||'(blocco)')+'<span class="tag">non reso</span></h3>'
        +'<p style="color:#ff6b6b">Questo blocco non si &egrave; potuto rendere ('
        +b.t+': '+err.message+'). Il resto della tappa continua sotto.</p>';
      m.appendChild(avv);
    }
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* I POP-UP DEGLI STRUMENTI. `cablaStrumenti` esisteva dal 18-09 e non la chiamava
     nessuno: i 229 rimandi del percorso erano <span> senza handler, e il clic non
     faceva niente. Nessun controllo poteva vederlo — la sintassi era valida, le schede
     c'erano tutte, le formule rendevano: il guasto esisteva solo a pagina viva. Qui, e
     dopo ogni inserimento successivo, perche' la tappa si rimonta da capo a ogni
     cambio e gli handler vanno riattaccati al DOM nuovo. */
  cablaStrumenti(m);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}
