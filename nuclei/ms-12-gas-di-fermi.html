var CORSO = 'meccanica-statistica';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["delta-di-dirac"] = {"nome":"Delta di Dirac","riga":"Non è una funzione ma un funzionale, definito da $\\int f(x)\\,\\delta(x-a)\\,dx=f(a)$, che composto con una funzione si spezza sui suoi zeri come $\\delta(g(x))=\\sum_i \\delta(x-x_i)/|g'(x_i)|$.","serve":"Serve come macchina per cambiare variabile senza invertire nulla. La densità di $y=f(x)$ si scrive $p_Y(y)=\\int p_X(x)\\,\\delta(y-f(x))\\,dx$, e la delta produce da sola il fattore $1/|f'|$ che altrimenti andrebbe messo a mano: i rami molteplici si contano da soli invece di doverli ricordare. È la ragione pratica per cui il formalismo con la delta compare in ogni soluzione d'esame che tocchi una distribuzione, mentre il cambio di variabile esplicito compare quasi mai.","esempio":"$\\delta(x^2-a^2)$ con $a$ positivo. Gli zeri sono $x=\\pm a$; la derivata dell'argomento è $2x$, che in modulo vale $2a$ su entrambi. Quindi $\\delta(x^2-a^2)=\\dfrac{1}{2a}\\big[\\delta(x-a)+\\delta(x+a)\\big]$. Il caso si ripete identico in fisica statistica con $\\varepsilon=p^2/2m$ in una dimensione, dove i due rami $p=\\pm\\sqrt{2m\\varepsilon}$ contribuiscono entrambi — e dimenticarne uno dimezza la risposta.","pieno":{"file":"15-distribuzioni.html","tappa":"01","come":"le distribuzioni come funzionali, la delta e le sue proprietà, nel nucleo di Metodi"},"qui":{"meccanica-statistica":{"serve":"È lo strumento con cui si calcola la densità degli stati, cioè l'oggetto su cui poggia tutto il secondo tempo del corso: $g(\\varepsilon)=\\int d^dp\\,d^dq\\;\\delta(\\varepsilon-H)/h^d$. L'identità che si usa davvero non è la definizione ma questa: $\\delta(\\varepsilon-H)=\\partial_\\varepsilon\\,\\theta(\\varepsilon-H)$. Si scambia l'integrale con la derivata e ci si ritrova a calcolare il volume della regione dove l'hamiltoniana sta sotto $\\varepsilon$ — un integrale elementare — invece di un integrale con una delta dentro. La $g$ così ottenuta è pura geometria dello spazio delle fasi: non sa nulla della temperatura, e per questo resta identica quando si passa da Boltzmann a Fermi o a Bose.","esempio":"Particella libera in due dimensioni. Il volume della regione $p^2/2m$ sotto $\\varepsilon$ è il disco di area $2\\pi m\\varepsilon$; derivando rispetto a $\\varepsilon$ si ottiene $2\\pi m$, cioè una densità degli stati costante. Non è una curiosità: è la ragione per cui in due dimensioni una particella libera non condensa, e per cui le prove che chiedono la condensazione in $d=2$ mettono sempre un potenziale confinante, che porta la $g$ da costante a crescente."}},"controllo":[{"tipo":"derivata","espr":"x**2-a**2","rispetto":["x"],"vale":"2*x","ipotesi":{"x":"positive","a":"positive"},"dove":"esempio","appare":"2x"},{"tipo":"uguale","sinistra":"1/Abs(2*a)","vale":"1/(2*a)","ipotesi":{"a":"positive"},"dove":"esempio","appare":"\\dfrac{1}{2a}"},{"tipo":"derivata","espr":"2*pi*m*e","rispetto":["e"],"vale":"2*pi*m","ipotesi":{"m":"positive","e":"positive"},"dove":"qui.meccanica-statistica.esempio","appare":"2\\pi m"}]};
STRUM["ordini-di-grandezza"] = {"nome":"Ordini di grandezza","riga":"Stimare una quantità alla potenza di dieci giusta: si tiene una cifra significativa, si sommano e si sottraggono gli esponenti, e si controlla che l'unità del risultato sia quella che si voleva.","serve":"A sapere se un risultato è plausibile prima di averlo calcolato con precisione, e ad accorgersi di un errore di impostazione quando c'è ancora tempo per rimediare. In astrofisica non è una comodità ma il modo normale di ragionare, per due ragioni: le grandezze in gioco vanno da $10^{-36}$ kg a $10^{53}$ kg e nessuna intuizione le copre, e i dati osservativi sono noti al dieci o al venti per cento, quindi una cifra significativa è spesso tutto ciò che il problema contiene davvero. Il controllo che smaschera più errori non è sul numero, è sull'**unità**: un conto che dovrebbe dare una densità e dà dei kg è sbagliato nell'impostazione, e nessun affinamento dell'aritmetica lo salverà. La seconda regola è il confronto con un termine noto — l'acqua per una densità, il Sole per una massa o una luminosità, il parsec per una distanza galattica — perché un numero senza metro non dice niente.","esempio":"Densità media del Sole, dalle due sole quantità stampate in calce al foglio d'esame, $M_\\odot=1{,}989\\cdot10^{30}$ kg e $R_\\odot=6{,}957\\cdot10^{8}$ m: $\\rho=\\dfrac{3M_\\odot}{4\\pi R_\\odot^{3}}=1410\\ \\mathrm{kg/m^3}$. Il confronto è immediato e istruttivo: è quasi una volta e mezza l'acqua, cioè il Sole è in media meno denso della Terra — una stella non è un sasso grande, è un gas tenuto insieme dal proprio peso.","pieno":{"file":"as-01-la-scala-del-cosmo.html","tappa":"01","come":"la gerarchia delle strutture cosmiche letta come scala di ordini di grandezza, e il tempo di luce come secondo asse della stessa tabella"},"controllo":[{"tipo":"numero","espr":"3*1.989e30/(4*pi*(6.957e8)**3)","vale":"1410","dove":"esempio","appare":"1410"}]};
STRUM["elettronvolt"] = {"nome":"Elettronvolt","riga":"L'energia che un elettrone acquista attraversando una differenza di potenziale di un volt: $1\\ \\mathrm{eV}=1{,}602\\cdot10^{-19}$ J; divisa per $c^{2}$ è una massa, $1\\ \\mathrm{eV}/c^{2}=1{,}783\\cdot10^{-36}$ kg.","serve":"A leggere senza conversioni le tabelle in cui la fisica delle particelle e l'astrofisica scrivono le masse a riposo come energie — l'elettrone 0,511 MeV, il protone 938 MeV, il bosone di Higgs 125 GeV. La scelta non è una bizzarria di notazione: in un processo la quantità che si conserva è l'energia, e scrivere la massa già in energia dice a colpo d'occhio quali reazioni sono possibili e quante ne resta per l'energia cinetica o per i fotoni. L'elettronvolt ha anche un secondo mestiere, e in astrofisica è il più usato dei due: convertito in temperatura tramite $k_BT$ dà la scala termica a cui un processo di quella energia diventa frequente, e questo è ciò che permette di dire a che punto della storia dell'universo o a che profondità di una stella un certo processo si accende.","esempio":"Dalla massa del protone espressa come energia, $938{,}3$ MeV, si ricavano i chilogrammi in un passaggio: $m_p=938{,}3\\cdot10^{6}\\cdot1{,}783\\cdot10^{-36}=1{,}673\\cdot10^{-27}$ kg, che è il valore stampato in calce al foglio d'esame. Sul versante termico, $T=\\dfrac{1{,}602\\cdot10^{-19}}{1{,}381\\cdot10^{-23}}=11600$ K: un'energia di un elettronvolt corrisponde a poco più di undicimila kelvin, e siccome ionizzare l'idrogeno costa 13,6 eV si capisce subito perché serva una fotosfera da qualche decina di migliaia di kelvin per trovarlo ionizzato.","pieno":{"file":"as-01-la-scala-del-cosmo.html","tappa":"05","come":"le masse delle particelle elementari scritte come energie, con la conversione in chilogrammi e la gerarchia delle masse, nel movimento sulla scala del cosmo"},"controllo":[{"tipo":"numero","espr":"1.602177e-19/(2.99792458e8)**2*1e36","vale":"1.783","dove":"riga","appare":"1,783\\cdot10^{-36}"},{"tipo":"numero","espr":"938.3e6*1.783e-36*1e27","vale":"1.673","dove":"esempio","appare":"1,673\\cdot10^{-27}"},{"tipo":"numero","espr":"1.602e-19/1.381e-23","vale":"11600","dove":"esempio","appare":"11600"}]};
STRUM["funzione-gamma"] = {"nome":"Funzione Gamma","riga":"$\\Gamma(z)=\\displaystyle\\int_0^{\\infty}t^{z-1}e^{-t}\\,dt$, e da questa $\\displaystyle\\int_0^{\\infty}t^{k}e^{-at}\\,dt=\\dfrac{\\Gamma(k+1)}{a^{k+1}}$ per $a>0$.","serve":"E' il fattoriale esteso ai numeri non interi — $\\Gamma(n+1)=n!$ — e soprattutto e' la forma chiusa di TUTTI gli integrali del tipo «potenza per esponenziale». Sapere questa sola formula sostituisce una decina di integrazioni per parti, e permette di leggere a vista il risultato di un integrale appena si riconosce l'esponente della potenza.","esempio":"Da $\\Gamma(z+1)=z\\,\\Gamma(z)$, che si ottiene integrando per parti una volta, discende $\\Gamma(n+1)=n!$ per $n$ intero: $\\Gamma(1)=1$, $\\Gamma(2)=1$, $\\Gamma(3)=2$, $\\Gamma(4)=6$. Sui semi-interi il capostipite e' $\\Gamma(\\tfrac12)=\\sqrt\\pi$ — che e' l'integrale gaussiano travestito — e da li' $\\Gamma(\\tfrac32)=\\tfrac12\\sqrt\\pi$, $\\Gamma(\\tfrac52)=\\tfrac34\\sqrt\\pi$. Un integrale come $\\int_0^\\infty t^{2}e^{-at}dt$ vale dunque $\\Gamma(3)/a^{3}=2/a^{3}$, senza fare nessun conto.","pieno":null,"qui":{"meccanica-statistica":{"serve":"E' l'inventario degli integrali del canonico ridotto a una riga. Ogni funzione di partizione di singola particella e' un integrale di potenza per esponenziale — cambia solo l'esponente, e con esso la fisica: $t^{1/2}$ per il gas classico, $t^{2}$ per l'ultrarelativistico, $t^{3/n}$ per un potenziale $\\alpha r^{n}$. Riconoscere quale $\\Gamma$ si sta calcolando e' cio' che distingue chi risolve lo scritto in dieci minuti da chi lo risolve in un'ora.","esempio":"Per una particella relativistica con $\\varepsilon=cp$ la partizione porta $\\int_0^\\infty p^{2}e^{-\\beta cp}dp=\\Gamma(3)/(\\beta c)^{3}=2/(\\beta c)^{3}$, da cui $\\langle\\varepsilon\\rangle=3T$ invece dei $\\tfrac32T$ del caso non relativistico. Il fattore 3 contro $3/2$ viene per intero dall'esponente della potenza, cioe' dall'argomento della Gamma: la dipendenza dell'energia dalla quantita' di moto decide da sola quanto calore serve a scaldare il gas."}}};
STRUM["cambio-di-variabile"] = {"nome":"Cambio di variabile in una densità","riga":"Una densità non si trasforma sostituendo ma porta il jacobiano: se $y=f(x)$ allora $p_Y(y)=\\sum_i p_X(x_i)\\,/\\,|f'(x_i)|$, sommato su tutti i rami $x_i$ con $f(x_i)=y$.","serve":"È l'unico punto in cui una densità si comporta diversamente da una funzione, ed è l'errore che si ripete. Ciò che è invariante è la probabilità dell'evento, $p_Y(y)|dy|=p_X(x)|dx|$: la densità no, perché è una probabilità per unità di qualcosa, e passando da $x$ a $y$ quell'unità si dilata o si comprime. Scrivere $p_Y(y)=p_X(x(y))$ e basta è attraente e sbagliato. Si scova senza rifare il conto con due prove da cinque secondi: la normalizzazione non torna, e le dimensioni restano quelle della variabile di partenza.","esempio":"Una particella uniforme su un disco di raggio $R$: $p(x,y)=1/(\\pi R^2)$. Passando alla sola distanza dal centro, il jacobiano è l'elemento d'area radiale $2\\pi r$, e resta $p(r)=2r/R^2$ su $[0,R]$, che infatti si normalizza a $1$. Il valor medio è $\\langle r\\rangle=2R/3$ — non $R/2$, che è la risposta di chi tratta $r$ come uniforme. La differenza fra i due numeri è esattamente il fattore $r$, cioè il fatto che lontano dal centro c'è più area.","pieno":{"file":"ms-03-probabilita.html","tappa":"01","come":"la regola dedotta dall'invarianza della probabilità, i rami molteplici e il caso radiale, nel movimento ms-03 di Meccanica Statistica"},"qui":{"meccanica-statistica":{"serve":"È metà della domanda più frequente dello scritto: «calcolare la densità di probabilità dell'energia di singola particella», «la densità di particelle $\\rho(r)$». L'altra metà è la marginalizzazione. Le scritture $d^2r=2\\pi r\\,dr$ e $d^3r=4\\pi r^2dr$ non sono formule da ricordare: sono questo cambio di variabile con gli angoli già integrati, e saperlo deducere è ciò che salva quando la simmetria è cilindrica invece che sferica. Attenzione al doppio jacobiano: $p(r)$ è una densità rispetto a $r$, $\\rho(r)$ è una densità per unità di volume, e fra le due ce n'è un altro.","esempio":"L'energia cinetica in due dimensioni. La misura radiale nel piano degli impulsi è la derivata dell'area del disco, $2\\pi p$; la sostituzione $\\varepsilon=p^2/2m$ ha $d\\varepsilon/dp=p/m$, e il jacobiano cancella esattamente il fattore $p$. Per questo in $d=2$ la densità dell'energia è l'esponenziale pura $\\beta e^{-\\beta\\varepsilon}$, senza prefattore, mentre in $d=3$ resta un $\\sqrt{\\varepsilon}$. Da quel solo fattore dipendono tutte le differenze qualitative fra i gas quantistici in dimensioni diverse."}},"controllo":[{"tipo":"integrale","espr":"2*r/R**2","var":"r","da":"0","a":"R","vale":"1","ipotesi":{"r":"positive","R":"positive"},"dove":"esempio","appare":"p(r)=2r/R^2"},{"tipo":"integrale","espr":"r*2*r/R**2","var":"r","da":"0","a":"R","vale":"2*R/3","ipotesi":{"r":"positive","R":"positive"},"dove":"esempio","appare":"2R/3"},{"tipo":"derivata","espr":"pi*p**2","rispetto":["p"],"vale":"2*pi*p","ipotesi":{"p":"positive"},"dove":"qui.meccanica-statistica.esempio","appare":"2\\pi p"},{"tipo":"derivata","espr":"p**2/(2*m)","rispetto":["p"],"vale":"p/m","ipotesi":{"p":"positive","m":"positive"},"dove":"qui.meccanica-statistica.esempio","appare":"p/m"},{"tipo":"integrale","espr":"b*exp(-b*e)","var":"e","da":"0","a":"oo","vale":"1","ipotesi":{"b":"positive","e":"positive"},"dove":"qui.meccanica-statistica.esempio","appare":"\\beta e^{-\\beta\\varepsilon}"}]};
STRUM["funzione-zeta-di-riemann"] = {"nome":"Funzione zeta di Riemann","riga":"$\\zeta(s)=\\sum_{n\\ge1} n^{-s}$, convergente per $s>1$; i valori che servono sono $\\zeta(3/2)\\simeq 2{,}612$, $\\zeta(2)=\\pi^{2}/6\\simeq1{,}645$, $\\zeta(3)\\simeq1{,}202$, $\\zeta(4)=\\pi^{4}/90$.","serve":"Compare tutte le volte che una somma su stati discreti viene approssimata con un integrale e si sviluppa l'integrando in serie geometrica: si scambiano somma e integrale e resta una zeta moltiplicata per una gamma. Non e' un abbellimento — il valore NUMERICO di $\\zeta(3/2)$ decide se una transizione di fase esiste.","esempio":"$\\displaystyle\\int_{0}^{\\infty}\\frac{x^{s-1}}{e^{x}-1}dx=\\Gamma(s)\\zeta(s)$, che si ottiene scrivendo $\\frac{1}{e^{x}-1}=\\sum_{n\\ge1}e^{-nx}$ e integrando termine a termine. Per $s=4$ da' $\\pi^{4}/15$, che e' la costante che compare nella legge di Stefan-Boltzmann.","pieno":null,"qui":{"meccanica-statistica":{"serve":"E' cio' che rende la condensazione di Bose-Einstein un fatto e non una possibilita'. Il numero di particelle negli stati eccitati e' limitato superiormente da un integrale che vale $\\zeta(3/2)$: siccome quel numero e' FINITO, oltre una certa densita' le particelle in eccesso non hanno dove stare se non nello stato fondamentale.","esempio":"La condizione critica e' $n\\lambda^{3}=\\zeta(3/2)\\simeq2{,}612$, che definisce $T_{c}$. In due dimensioni lo stesso conto porta a $\\zeta(1)$, che DIVERGE: gli stati eccitati accolgono qualunque numero di particelle e la condensazione non avviene. La dimensionalita' entra nel risultato attraverso l'argomento della zeta, e il confine e' esattamente $s=1$."}}};

function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';
  return h;
}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

/* ---------------- 00 · DI COSA PARLA QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Di cosa parla questo movimento', meta:'Meccanica Statistica · voci A.12 e A.13 · uno stato fondamentale che e un conteggio · e il bordo che porta tutta la termodinamica',
  blocchi:[
  {t:'prosa', title:'Un conteggio di stati, e un bordo largo T', tag:'architettura', html:R`
  <p>Ci sono due domande che quarantasei prove d&rsquo;esame su quarantasette finiscono per fare, e sono la stessa domanda in due tempi. La prima: <b>dato un sistema di $N$ fermioni identici e non interagenti, qual &egrave; il suo stato di energia minima?</b> La seconda: <b>quanto calore serve per scaldarlo di un grado?</b></p>
  <p>La prima risposta non ha nulla di statistico. A temperatura nulla ogni particella scende al livello pi&ugrave; basso disponibile, e la sola cosa che le impedisce di scendere tutte nello stesso &egrave; il principio di esclusione: un livello, una particella (per ciascuno stato di spin). Le particelle riempiono allora i livelli dal basso fino a esaurirsi, e lo stato fondamentale &egrave; completamente descritto da <b>dove si ferma il riempimento</b>. Quell&rsquo;energia si chiama <b>energia di Fermi</b>, $\varepsilon_F$, e trovarla &egrave; un problema di conteggio: <i>quanti stati ci sono sotto una data energia?</i></p>
  <p>La funzione che descrive l&rsquo;occupazione media di un livello di energia $\varepsilon$ a temperatura $T$ &egrave;</p>
  $$\langle n_\varepsilon\rangle=\frac{1}{e^{(\varepsilon-\mu)/T}+1}$$
  <p>e il primo lavoro del movimento &egrave; mostrare che a $T\to0$ questa diventa $\theta(\varepsilon_F-\varepsilon)$: uno sotto, zero sopra, e niente in mezzo. Il conteggio degli stati sotto $\varepsilon_F$ d&agrave; allora la formula che regge met&agrave; del corso,</p>
  $$\varepsilon_F=\frac{\hbar^2}{2m}\left(\frac{6\pi^2N}{g_sV}\right)^{2/3}$$
  <p>e da l&igrave; tutto il resto: l&rsquo;energia media per particella $E=\tfrac35N\varepsilon_F$, e una pressione che <b>non si annulla a temperatura nulla</b>, $P=\tfrac25\,n\varepsilon_F$, perch&eacute; le particelle non possono stare ferme tutte nello stesso posto.</p>
  <p>La seconda domanda &egrave; pi&ugrave; sottile, ed &egrave; la ragione per cui questo movimento esiste. Scaldando il gas di un po&rsquo;, <b>quasi nessuna particella pu&ograve; assorbire energia</b>: una particella che sta a met&agrave; del mare, per muoversi, dovrebbe salire in un livello gi&agrave; occupato, e non pu&ograve;. Solo quelle che stanno entro una fascia di larghezza $\sim T$ dal bordo hanno stati vuoti a portata. La frazione di gas che partecipa &egrave; dunque dell&rsquo;ordine di $T/T_F$, e il calore specifico che ne esce &egrave; <b>lineare in $T$</b> invece che costante:</p>
  $$C_V=\frac{\pi^2}{2}\,N\frac{T}{T_F}$$
  <p>Il coefficiente $\pi^2/2$ lo d&agrave; lo <b>sviluppo di Sommerfeld</b>, che &egrave; la sola tecnica asintotica di tutto il corso e che qui si deriva invece di citarla. Lo strumento che traduce ogni somma sui livelli in un integrale &egrave; sempre lo stesso, la <b>densit&agrave; degli stati</b></p>
  $$G(\varepsilon)=\int\frac{d^dq\,d^dp}{h^d}\,\delta(\varepsilon-H)$$
  <p>e Crisanti (pag. 260) le dedica la frase pi&ugrave; utile del capitolo: &laquo;per risolvere gli esercizi si parte sempre dal calcolo di questo termine&raquo;.</p>
  <div class="note"><b>Convenzioni, e sette disaccordi che incontreremo sul posto.</b> Crisanti e Grilli-Giardina pongono $k_B=1$ (la temperatura &egrave; un&rsquo;energia, $\beta=1/T$, $T_F$ e $\varepsilon_F$ sono lo stesso numero); Falcioni-Vulpiani tiene $k_B$ esplicito. Qui si scrive $k_B=1$ nei conti simbolici e lo si rimette quando si fanno i <b>numeri</b>, perch&eacute; un ordine di grandezza si controlla in unit&agrave; SI. I disaccordi veri, segnalati dove capitano, sono: <b>(a)</b> il fattore di spin $g_s$ dentro o fuori la densit&agrave; di stati; <b>(b)</b> la formula di $\varepsilon_F$, che Crisanti scrive senza $g_s$ e Grilli-Giardina con; <b>(c)</b> la &laquo;temperatura di degenerazione&raquo; di Crisanti, che non &egrave; la temperatura di Fermi; <b>(d)</b> un esponente sbagliato nella pressione a pag. 279; <b>(e)</b> due sviste nell&rsquo;esercizio a pag. 334-335, che il conto stesso smentisce; <b>(f)</b> la convenzione su $k_B$; <b>(g)</b> la stima euristica del calore specifico, che Crisanti corregge da s&eacute; due pagine dopo.</div>`},
  {t:'prosa', title:'Come e fatto il movimento, e la sequenza che l esame chiede sempre', tag:'architettura', html:R`
  <p><b>Il peso, misurato.</b> Su quarantasette prove d&rsquo;esame, <b>quarantasei</b> toccano questo argomento. «Energia di Fermi» o «temperatura di Fermi» compaiono in trentuno prove, e la condizione «$T=0$» in quarantaquattro. Non &egrave; un capitolo fra gli altri: &egrave; il modo in cui questo corso chiude quasi ogni scritto.</p>
  <p><b>La sequenza &egrave; fissa</b>, e il movimento la allena come tale. Un problema d&rsquo;esame d&agrave; un&rsquo;hamiltoniana di singola particella — spesso con un potenziale esterno o in un numero di dimensioni diverso da tre — e poi chiede, in quest&rsquo;ordine: <b>(1)</b> ricava $\varepsilon_F$ dal numero di particelle; <b>(2)</b> calcola l&rsquo;energia media per particella a temperatura nulla; <b>(3)</b> calcola una <b>media geometrica</b> — la distanza media dall&rsquo;origine, il raggio quadratico medio, l&rsquo;impulso medio. Sono tre integrali sulla stessa densit&agrave; di stati, e chi ha in mano la macchina li fa tutti e tre in cinque minuti. La quarta domanda, quando c&rsquo;&egrave;, &egrave; il calore specifico, e l&igrave; serve Sommerfeld.</p>
  <p><b>La rotta.</b> Si comincia dallo stato fondamentale e dal gradino, che &egrave; il limite di una formula ma si capisce meglio come conteggio; poi il calcolo di $\varepsilon_F$, $p_F$ e $T_F$ in tre dimensioni, con i numeri veri di un metallo; poi la stessa macchina in $d$ dimensioni, con una dispersione qualunque e con un potenziale esterno, che &egrave; il caso degli esercizi; poi le medie a temperatura nulla, cio&egrave; i punti (2) e (3) della sequenza; poi la pressione di degenerazione e perch&eacute; non si annulla. La seconda met&agrave; accende la temperatura: lo sviluppo di Sommerfeld derivato per intero, il potenziale chimico che scende, l&rsquo;energia e il calore specifico lineare, con il confronto numerico contro l&rsquo;equipartizione classica. Chiudono tre esercizi d&rsquo;esame veri, presi dalle note del corso.</p>
  <p><b>Che cosa questo movimento non fa.</b> Non ricava la distribuzione di Fermi-Dirac: la prende come data. Non tratta i bosoni, dove lo stesso conto porta a una transizione di fase invece che a un mare. E non va oltre il primo ordine in $T/T_F$, perch&eacute; l&rsquo;ordine successivo — il termine in $(T/T_F)^4$ — non compare in nessuna delle quarantasette prove.</p>`}
]},

/* ---------------- 01 · IL MARE DI FERMI ---------------- */
{ num:'01', title:'Il mare di Fermi: lo stato fondamentale di N fermioni, e il gradino che lo descrive', meta:'riempire dal basso · i due limiti della distribuzione · il potenziale chimico a temperatura nulla · la sfera nello spazio degli impulsi',
  blocchi:[
  {t:'reveal', title:'Costruire lo stato fondamentale mettendo una particella per stato', tag:'costruzione', steps:[
   {label:'Il riempimento, che e un problema di conteggio e non di statistica', body:R`
   <p>Si prendano $N$ fermioni identici non interagenti in un volume $V$, con hamiltoniana di singola particella $H=p^2/2m$. Poich&eacute; non interagiscono, l&rsquo;energia totale &egrave; la somma delle energie di singola particella, e lo stato del gas &egrave; completamente individuato dicendo <i>quanti</i> fermioni stanno in ciascuno stato di singola particella. Il principio di esclusione dice che quel numero vale zero oppure uno.</p>
   <p>Costruire lo stato fondamentale &egrave; allora un&rsquo;operazione meccanica: si ordinano i livelli di singola particella per energia crescente e si riempiono dal basso, uno per stato, finch&eacute; le particelle finiscono. Grilli-Giardina (pag. 90) descrive la cosa con un&rsquo;immagine che vale la pena tenere perch&eacute; corregge l&rsquo;intuizione sbagliata: <i>&laquo;filling up energy states with fermions is just like throwing balls into a box. With one exception: the energy states of free particles are not localized in position space; they are localized in momentum space&raquo;</i>. Le particelle non si ammucchiano in un angolo della scatola — la loro densit&agrave; spaziale &egrave; uniforme — si ammucchiano in una <b>palla nello spazio degli impulsi</b>.</p>
   <p>L&rsquo;energia dell&rsquo;ultimo livello riempito si chiama <b>energia di Fermi</b> e si scrive $\varepsilon_F$. Sotto di essa ogni stato &egrave; occupato, sopra ogni stato &egrave; vuoto: <b>lo stato fondamentale di un gas di fermioni non ha nessun parametro libero oltre a $N$</b>, ed &egrave; per questo che la prima domanda di ogni esercizio — «quanto vale $\varepsilon_F$?» — ha sempre una risposta e sempre la stessa forma.</p>
   <p>Si osservi subito che cosa questo ha di strano rispetto a un gas classico. Classicamente, a temperatura nulla, tutte le particelle stanno ferme nel minimo del potenziale e l&rsquo;energia totale &egrave; nulla. Qui no: <b>una sola particella pu&ograve; stare nel livello pi&ugrave; basso, e le altre $N-1$ devono salire</b>. L&rsquo;energia dello stato fondamentale &egrave; enorme, la pressione &egrave; enorme, e nessuna delle due dipende dalla temperatura. Crisanti lo annota a pag. 278 con una riga sola: &laquo;troviamo che le particelle non possono stare ferme a causa del principio di Pauli&raquo;.</p>`},
   {label:'Il gradino come limite della distribuzione di Fermi-Dirac', body:R`
   <p>Lo stesso stato si ottiene dalla distribuzione di Fermi-Dirac facendo tendere la temperatura a zero, ed &egrave; istruttivo vedere <i>come</i>. L&rsquo;occupazione media di un livello di energia $\varepsilon$ vale</p>
   $$\langle n_\varepsilon\rangle=\frac{1}{e^{(\varepsilon-\mu)/T}+1}$$
   <p>e dipende dall&rsquo;energia, dalla temperatura e dal potenziale chimico <i>soltanto</i> attraverso la combinazione $x=(\varepsilon-\mu)/T$. Si fissi $\mu$ e si mandi $T$ a zero dall&rsquo;alto.</p>
   <p><b>Livello sotto il potenziale chimico.</b> Allora $\varepsilon-\mu\lt0$, quindi $x\to-\infty$, l&rsquo;esponenziale va a zero e il denominatore tende a uno: $\langle n_\varepsilon\rangle\to1$. Il livello &egrave; <b>pieno</b>.</p>
   <p><b>Livello sopra il potenziale chimico.</b> Allora $\varepsilon-\mu\gt0$, quindi $x\to+\infty$, l&rsquo;esponenziale diverge e la frazione va a zero: $\langle n_\varepsilon\rangle\to0$. Il livello &egrave; <b>vuoto</b>.</p>
   <p><b>Esattamente al potenziale chimico</b> l&rsquo;esponente &egrave; nullo per ogni $T$, e l&rsquo;occupazione vale $\tfrac12$ a qualunque temperatura. &Egrave; la definizione operativa del potenziale chimico di un gas di fermioni: <b>il livello occupato a met&agrave;</b>, e siccome non dipende da $T$ &egrave; il punto attorno al quale la curva ruota mentre si irrigidisce.</p>
   <p>I due limiti insieme si scrivono $\theta(\mu-\varepsilon)$, la funzione a gradino di Heaviside. Grilli-Giardina (pag. 90) la mette esattamente cos&igrave;, e Crisanti (pag. 273) la commenta osservando che la distribuzione &laquo;&egrave; evidentemente dipendente dal segno dell&rsquo;esponente&raquo;: tutta la fisica del gas degenere sta nel fatto che a bassa temperatura quel segno &egrave; l&rsquo;unica cosa che conta.</p>`},
   {label:'Quanto e larga la zona in cui il gradino non e un gradino', body:R`
   <p>Il gradino &egrave; un limite, e negli esercizi la temperatura non &egrave; mai esattamente nulla. Conviene quindi misurare <i>quanto</i> &egrave; larga la zona in cui l&rsquo;occupazione non vale n&eacute; uno n&eacute; zero, perch&eacute; quella zona sar&agrave; l&rsquo;unica parte del gas che partecipa alla termodinamica.</p>
   <p>Si chieda dove l&rsquo;occupazione scende da $0{,}9$ a $0{,}1$. Da $\langle n\rangle=0{,}9$ segue $e^x+1=10/9$, cio&egrave; $x=-\log9$; da $\langle n\rangle=0{,}1$ segue $e^x+1=10$, cio&egrave; $x=\log9$. La larghezza in $x$ &egrave; dunque $2\log9\simeq4{,}394$, e siccome $x=(\varepsilon-\mu)/T$, <b>in energia la zona di transizione &egrave; larga circa quattro volte e mezzo la temperatura</b>. Crisanti (pag. 274) la stima in modo ancora pi&ugrave; spiccio, dicendo che &laquo;l&rsquo;unica zona in cui il denominatore non &egrave; $0$ oppure $1$&raquo; corrisponde a $\varepsilon-\varepsilon_F\simeq1/\beta$, cio&egrave; a una larghezza dell&rsquo;ordine di $T$: &egrave; la stessa cosa a meno del fattore numerico, e il fattore numerico non conta finch&eacute; si ragiona per ordini di grandezza.</p>
   <p><b>Il confronto che rende il gradino credibile.</b> Per gli elettroni di un metallo, come si vedr&agrave; nella tappa 02, $T_F$ vale qualche decina di migliaia di kelvin. A temperatura ambiente la fascia di transizione &egrave; dunque larga qualche millesimo di $\varepsilon_F$: disegnata in scala, la curva a temperatura ambiente &egrave; <b>indistinguibile dal gradino</b>. Ed &egrave; esattamente per questo che il calore specifico dei metalli &egrave; cos&igrave; piccolo — ma per lo stesso motivo il gradino puro non basta a calcolarlo, perch&eacute; il calore specifico &egrave; <i>tutto</i> dentro quella fascia sottile.</p>
   <p><b>Un&rsquo;avvertenza di Grilli-Giardina che conviene non saltare</b> (pag. 91). Scrivere $\mu(0)=\varepsilon_F$ &egrave;, a rigore, un abuso di notazione: nel gran canonico $T$ e $\mu$ sono variabili <i>indipendenti</i>, e non ha senso dire che una sia funzione dell&rsquo;altra. Quello che la formula significa davvero &egrave;: <i>se si vuole tenere fisso il numero medio di particelle</i> — e lo si vuole, perch&eacute; un esercizio d&agrave; $N$ — allora al variare di $T$ bisogna variare $\mu$ per compensare, e il valore che $\mu$ assume a temperatura nulla &egrave; $\varepsilon_F$. La tappa 07 far&agrave; esattamente questo conto.</p>`}
  ]},
  {t:'plot', title:'La Fermi-Dirac che si irrigidisce, e il punto attorno al quale ruota',
   intro:R`Occupazione media $\langle n\rangle$ in funzione dell&rsquo;energia misurata in unit&agrave; di $\varepsilon_F$, a potenziale chimico fissato $\mu=\varepsilon_F$, per tre valori del rapporto $T/T_F$: $0{,}3$, $0{,}1$ e $0{,}03$.`,
   plots:[
    {kind:'func2d', xr:[0,2], yr:[0,1.12], height:340, ticks:6,
     title:'tre temperature, e il gradino che si forma',
     curves:[
      {f:'1/(exp((x-1)/0.3)+1)', col:'#d8a13a', label:'T/T_F = 0,30'},
      {f:'1/(exp((x-1)/0.1)+1)', col:'#5eead4', label:'T/T_F = 0,10'},
      {f:'1/(exp((x-1)/0.03)+1)', col:'#4c8dff', label:'T/T_F = 0,03'}
     ],
     segs:[{x1:1,y1:0,x2:1,y2:1.12,col:'#b98cff',dash:true,width:1.4,label:'energia di Fermi',lx:1.05,ly:1.05}],
     xlabel:'energia / energia di Fermi', ylabel:'occupazione media'}
   ],
   leggi:R`<p><b>Che cosa guardare: il punto in cui le tre curve si incrociano.</b> Tutte e tre passano per la stessa quota, $\tfrac12$, esattamente sulla verticale tratteggiata. Non &egrave; una coincidenza grafica: in $\varepsilon=\mu$ l&rsquo;esponente si annulla a qualunque temperatura, e la curva <b>ruota attorno a quel punto</b> invece di traslare. Chi ricorda questo non sbaglia mai il disegno qualitativo in un orale.</p>
   <p><b>Che cosa guardare: come si irrigidisce.</b> Passando da $0{,}30$ a $0{,}03$ la fascia in cui la curva scende si restringe di dieci volte, perch&eacute; la sua larghezza &egrave; proporzionale a $T$ e non, per esempio, a $\sqrt T$. La curva blu &egrave; gi&agrave; quasi un gradino; per gli elettroni di un metallo a temperatura ambiente il rapporto $T/T_F$ vale qualche <i>millesimo</i>, cio&egrave; dieci volte pi&ugrave; stretto della blu, e a questa scala la transizione sarebbe invisibile.</p>
   <p><b>Che cosa impararne per i conti.</b> L&rsquo;area fra la curva a temperatura finita e il gradino &egrave; fatta di due pezzi uguali e opposti: quello che manca sotto $\varepsilon_F$ e quello che avanza sopra. Sono le particelle che la temperatura ha promosso, e sono <b>l&rsquo;unica cosa che si muove</b>. Tutti i conti delle tappe 06-08 sono modi diversi di misurare quei due pezzi.</p>
   <p><b>Dove questa figura mente.</b> Tiene $\mu$ fisso a $\varepsilon_F$ mentre in un problema a $N$ fissato il potenziale chimico <i>scende</i> al crescere della temperatura — e alla temperatura pi&ugrave; alta disegnata, quella con $T/T_F$ pari a $0{,}3$, sarebbe gi&agrave; sceso di circa l&rsquo;otto per cento. La figura della tappa 07 corregge questa bugia.</p>`},
  {t:'prosa', title:'La sfera di Fermi: dove vivono davvero le particelle', tag:'grammatica', html:R`
  <p>Il riempimento «dal basso» diventa geometria appena si dice quali sono i livelli. Per una particella libera in una scatola l&rsquo;energia dipende solo dal modulo dell&rsquo;impulso, $\varepsilon_{\vec p}=p^2/2m$, e ordinare i livelli per energia crescente significa ordinarli per <b>distanza dall&rsquo;origine nello spazio degli impulsi</b>. Riempirli dal basso significa riempire una palla.</p>
  <p>Si definisce allora l&rsquo;<b>impulso di Fermi</b> $p_F$ come l&rsquo;impulso dell&rsquo;ultimo livello occupato,</p>
  $$\varepsilon_F=\frac{p_F^2}{2m}$$
  <p>e lo stato fondamentale del gas si descrive in una riga: <b>tutti gli stati con $|\vec p|\lt p_F$ sono occupati, tutti quelli con $|\vec p|\gt p_F$ sono vuoti</b>. La palla si chiama <b>mare di Fermi</b>, e la sua buccia — l&rsquo;insieme dei punti con $|\vec p|=p_F$ — si chiama <b>superficie di Fermi</b>. Grilli-Giardina (pag. 91) avverte che quel nome non &egrave; una curiosit&agrave; lessicale: &laquo;the concept of a Fermi surface is extremely important in later applications to condensed matter physics&raquo;, ed &egrave; vero perch&eacute; <i>tutto</i> ci&ograve; che un metallo fa — condurre, riflettere, magnetizzarsi — lo fanno gli elettroni che stanno su quella buccia.</p>
  <p><b>Perch&eacute; la buccia e non il volume.</b> Le particelle nel cuore del mare sono circondate da stati occupati in ogni direzione: un campo elettrico che spinge un elettrone del centro non ha dove metterlo, perch&eacute; lo stato di arrivo &egrave; gi&agrave; pieno. Solo gli elettroni della buccia hanno stati vuoti appena fuori, e solo loro possono cambiare impulso. <b>Il gas di Fermi &egrave; un oggetto quasi completamente inerte con una pellicola attiva</b>, e questa singola frase spiega il calore specifico lineare, la conducibilit&agrave;, e perch&eacute; un metallo non &egrave; trasparente.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Se a $T=0$ ogni stato sotto $\varepsilon_F$ &egrave; occupato, il gas ha energia enorme. Ma l&rsquo;energia di uno stato fondamentale non dovrebbe essere la minima possibile?`,
    a:R`&Egrave; la minima possibile, e il malinteso sta nel confronto sbagliato. Il criterio invocato &egrave; il <b>principio di esclusione di Pauli</b>: lo spazio degli stati accessibili a $N$ fermioni identici non contiene la configurazione «tutte nel livello fondamentale», che semplicemente <i>non esiste</i> come stato antisimmetrico. Il minimo si cerca dentro l&rsquo;insieme degli stati ammessi, e l&igrave; il minimo &egrave; il mare pieno. Detto altrimenti: il determinante di Slater con due righe uguali vale zero, e uno stato di norma nulla non &egrave; uno stato.`},
   {q:R`Il gradino si ottiene mandando $T$ a zero <i>a $\mu$ fissato</i>. Ma in un esercizio non &egrave; $\mu$ a essere fissato, &egrave; $N$. Il limite &egrave; ancora lo stesso?`,
    a:R`S&igrave;, ed &egrave; l&rsquo;osservazione di Grilli-Giardina a pag. 91. Il criterio &egrave; l&rsquo;<b>equivalenza degli insiemi statistici</b>: a $N$ fissato il potenziale chimico diventa una funzione $\mu(T)$ determinata implicitamente dalla condizione $N=g_s\int d\varepsilon\,n(\varepsilon)G(\varepsilon)$, e la tappa 07 mostrer&agrave; che $\mu(T)\to\varepsilon_F$ per $T\to0$ con una correzione di ordine $(T/T_F)^2$. Siccome la correzione svanisce pi&ugrave; in fretta della larghezza del bordo, il gradino resta nel punto giusto. Ma l&rsquo;osservazione ha un morso: a temperatura <i>non</i> piccola il potenziale chimico si sposta parecchio, e chi continua a scrivere $\mu=\varepsilon_F$ sbaglia esattamente del termine che genera il calore specifico.`}
  ]}
]},

/* ---------------- 02 · ENERGIA, IMPULSO E TEMPERATURA DI FERMI ---------------- */
{ num:'02', title:'Energia, impulso e temperatura di Fermi: il conteggio fatto in due modi', meta:'la densita di stati con la delta · il conteggio diretto nella sfera · dove va il fattore di spin · i numeri veri di un metallo',
  blocchi:[
  {t:'reveal', title:'La densita degli stati, che e la macchina di tutti gli esercizi', tag:'costruzione', steps:[
   {label:'La definizione, e il trucco della theta', body:R`
   <p>Per contare quanti stati ci sono sotto una data energia serve un oggetto solo, la <b>densit&agrave; degli stati</b>: il numero di stati di singola particella con energia compresa fra $\varepsilon$ e $\varepsilon+d\varepsilon$, diviso per $d\varepsilon$. Nello spazio delle fasi, dove un volume $h^3$ corrisponde a uno stato, la definizione si scrive con una <span class="str" data-str="delta-di-dirac">delta di Dirac</span>:</p>
   $$G(\varepsilon)=\int\frac{d^3q\,d^3p}{h^3}\,\delta\left(\varepsilon-\frac{p^2}{2m}\right)$$
   <p>La delta seleziona la superficie di energia costante, e l&rsquo;integrale ne misura lo spessore. Crisanti (pag. 260) e Grilli-Giardina (pag. 87) calcolano questo integrale con lo stesso trucco, che conviene imparare perch&eacute; funziona anche quando la superficie non &egrave; una sfera: <b>si scrive la delta come derivata di una theta</b>,</p>
   $$\delta\left(\varepsilon-\frac{p^2}{2m}\right)=\frac{\partial}{\partial\varepsilon}\theta\left(\varepsilon-\frac{p^2}{2m}\right)$$
   <p>e si porta la derivata fuori dall&rsquo;integrale. Il vantaggio &egrave; che l&rsquo;integrale della theta &egrave; un <i>volume</i>, e i volumi si calcolano senza pensarci: la theta vale uno dove $p\lt\sqrt{2m\varepsilon}$ e zero altrove, dunque seleziona una palla di raggio $\sqrt{2m\varepsilon}$.</p>
   <p>L&rsquo;integrale sulle posizioni d&agrave; il volume $V$, e quello sugli impulsi &egrave; il volume della palla:</p>
   $$\int d^3p\,\theta\left(\varepsilon-\frac{p^2}{2m}\right)=\frac{4\pi}{3}(2m\varepsilon)^{3/2}$$
   <p>dove si &egrave; usato $d^3p=4\pi p^2dp$ e si &egrave; integrato fino al raggio della palla.</p>`},
   {label:'Il risultato in tre dimensioni, con la derivata fatta', body:R`
   <p>Resta da derivare rispetto all&rsquo;energia, ed &egrave; una derivata di una potenza:</p>
   $$\frac{\partial}{\partial\varepsilon}(2m\varepsilon)^{3/2}=3m\sqrt{2m\varepsilon}$$
   <p>— il $3/2$ dell&rsquo;esponente moltiplica il $2m$ della derivata interna e d&agrave; $3m$. Mettendo insieme i tre pezzi:</p>
   $$G(\varepsilon)=\frac{V}{h^3}\frac{4\pi}{3}\cdot3m\sqrt{2m\varepsilon}=2\pi V\left(\frac{2m}{h^2}\right)^{3/2}\sqrt{\varepsilon}$$
   <p>e questa forma compatta &egrave; quella che entrambe le note usano ovunque. <b>Due cose da leggere nel risultato.</b> La prima: la dipendenza dall&rsquo;energia &egrave; $\sqrt\varepsilon$, quindi $G$ <i>cresce</i> — a energie alte ci sono pi&ugrave; stati per unit&agrave; di energia, perch&eacute; la superficie della sfera cresce. La seconda: $G$ si annulla in $\varepsilon=0$, e questo per i fermioni non fa nessun danno, mentre per i bosoni &egrave; la crepa da cui nasce la condensazione.</p>
   <p><b>Disaccordo (a): dove va il fattore di spin.</b> Una particella di spin $S$ ha $g_s=2S+1$ stati interni per ogni stato orbitale, e il conteggio corretto li richiede tutti. Le due fonti lo mettono in due posti diversi. Grilli-Giardina (pag. 88) lo tiene <b>fuori</b> e scrive sempre $g_sG(\varepsilon)$, dichiarando $G(\varepsilon)\to g_sG(\varepsilon)$ come sostituzione da fare a mano. Crisanti (pag. 259) lo <b>incorpora</b> in $dN_\varepsilon$ e annota fra parentesi che «a volte si incorpora in $G$ anche il fattore $g$», precisando che l&rsquo;operazione &laquo;&egrave; lecito solo se l&rsquo;energia non dipende dallo spin&raquo;. Le due scritture danno lo stesso numero; <b>chi legge una fonte e scrive con l&rsquo;altra lo conta due volte</b>, e sbaglia $\varepsilon_F$ di un fattore $g_s^{2/3}$, che per gli elettroni vale $2^{2/3}\simeq1{,}587$. Non &egrave; un dettaglio: &egrave; il cinquantanove per cento. In questo movimento $G$ &egrave; <b>sempre senza spin</b>, e il fattore $g_s$ compare esplicito ogni volta che serve.</p>`},
   {label:'Il conteggio sotto il livello di Fermi, e la formula che ne esce', body:R`
   <p>Adesso il conto per cui tutto questo &egrave; stato costruito. A temperatura nulla l&rsquo;occupazione &egrave; il gradino, dunque il numero di particelle &egrave; semplicemente il numero di stati sotto $\varepsilon_F$:</p>
   $$N=g_s\int_0^{\varepsilon_F}G(\varepsilon)\,d\varepsilon=\frac{4\pi}{3}g_sV\left(\frac{2m}{h^2}\right)^{3/2}\varepsilon_F^{3/2}$$
   <p>dove si &egrave; usato $\int_0^{\varepsilon_F}\sqrt\varepsilon\,d\varepsilon=\tfrac23\varepsilon_F^{3/2}$ e il $2\pi$ del prefattore si &egrave; combinato con il $2/3$ dando $4\pi/3$.</p>
   <p>Invertendo rispetto a $\varepsilon_F$ e usando $h=2\pi\hbar$:</p>
   $$\varepsilon_F=\frac{\hbar^2}{2m}\left(\frac{6\pi^2N}{g_sV}\right)^{2/3}=\frac{\hbar^2}{2m}\left(\frac{6\pi^2n}{g_s}\right)^{2/3}$$
   <p>con $n=N/V$ la densit&agrave;. Il passaggio da $h$ a $\hbar$ nasconde un conto che vale la pena fare una volta, perch&eacute; &egrave; il punto in cui quasi tutti perdono un $\pi$: si parte da $\varepsilon_F=\frac{h^2}{2m}\left(\frac{3n}{4\pi g_s}\right)^{2/3}$, si scrive $h^2=4\pi^2\hbar^2$ e si raccoglie. Il coefficiente numerico che resta &egrave; $4\pi^2\left(\frac{3}{4\pi}\right)^{2/3}=15{,}19=\left(6\pi^2\right)^{2/3}$, e le due scritture sono la stessa.</p>
   <p><b>Disaccordo (b), e conta molto.</b> Crisanti (pag. 272-273) scrive $\varepsilon_F=\frac{\hbar^2}{2m}\left(\frac{6\pi^2}{v}\right)^{2/3}$ con $v=V/N$, cio&egrave; <b>senza</b> il fattore di spin, e solo a pag. 278, dopo aver finito tutti i conti, avverte: &laquo;va ricordato che pu&ograve; essere necessario considerare un fattore di spin $g=2s+1$ per effettuare un conteggio corretto del numero di stati, e che finora non abbiamo considerato&raquo;. Grilli-Giardina (pag. 91) lo porta dentro fin dall&rsquo;inizio. <b>La formula da usare all&rsquo;esame &egrave; quella con $g_s$</b>, perch&eacute; gli elettroni hanno spin; la formula di Crisanti &egrave; il caso $g_s=1$, cio&egrave; «fermioni privi di spin», che lui stesso definisce a pag. 233 una possibilit&agrave; &laquo;da un punto di vista meramente matematico&raquo;.</p>`}
  ]},
  {t:'prosa', title:'Lo stesso numero contato nello spazio degli impulsi', tag:'grammatica', html:R`
  <p>Il conto precedente &egrave; passato dalla densit&agrave; di stati, ma per un gas libero c&rsquo;&egrave; una strada pi&ugrave; corta che conviene saper percorrere, perch&eacute; negli esercizi con un vincolo geometrico &egrave; spesso l&rsquo;unica praticabile: <b>si conta direttamente il volume di spazio delle fasi occupato</b>. Ogni cella di volume $h^3$ ospita $g_s$ fermioni, e la regione occupata &egrave; il prodotto del volume $V$ per la palla di raggio $p_F$:</p>
  $$N=g_s\frac{V}{h^3}\frac{4\pi}{3}p_F^3$$
  <p>Crisanti (pag. 273) presenta questa come la lettura fisica dell&rsquo;energia di Fermi: &laquo;l&rsquo;energia di Fermi &egrave; l&rsquo;energia al di sotto della quale ci sono esattamente $N$ stati&raquo;. Scrivendo $h^3=8\pi^3\hbar^3$ e dividendo per $V$ si ottiene la densit&agrave; in funzione del raggio del mare,</p>
  $$n=\frac{g_sp_F^3}{6\pi^2\hbar^3}$$
  <p>che &egrave; la stessa relazione di prima letta al contrario. Invertendola:</p>
  $$p_F=\hbar\left(\frac{6\pi^2n}{g_s}\right)^{1/3}$$
  <p>— e si noti che &egrave; <i>esattamente</i> la radice quadrata di $2m\varepsilon_F$, come dev&rsquo;essere: la potenza $2/3$ dell&rsquo;energia &egrave; diventata $1/3$ dell&rsquo;impulso perch&eacute; l&rsquo;energia va come il quadrato dell&rsquo;impulso. <b>Il controllo di coerenza fra le due strade &egrave; gratis e va sempre fatto</b>: se il conteggio nello spazio degli impulsi e quello con la densit&agrave; di stati non danno lo stesso $\varepsilon_F$, uno dei due ha perso un fattore.</p>
  <p>Vale anche la pena guardare la forma del risultato prima dei numeri. L&rsquo;impulso di Fermi &egrave; $\hbar$ diviso la distanza media fra le particelle, a meno di un fattore d&rsquo;ordine uno: $p_F\sim\hbar n^{1/3}$. <b>&Egrave; il principio di indeterminazione</b> — confinare una particella in un volume $n^{-1}$ le costa un impulso $\hbar n^{1/3}$ — e dice che il mare di Fermi non &egrave; un fenomeno statistico ma cinematico. La statistica decide solo <i>quante</i> particelle devono pagare quel prezzo.</p>`},
  {t:'prosa', title:'I numeri veri, e la differenza fra due temperature che si chiamano quasi allo stesso modo', tag:'grammatica', html:R`
  <p>Un gas di Fermi degenere non &egrave; un&rsquo;astrazione: sta in ogni filo di rame. Si prendano gli elettroni di conduzione del rame, uno per atomo, con densit&agrave; $n\simeq8{,}5\times10^{28}$ elettroni al metro cubo e $g_s=2$. Con questi soli due dati (<span class="str" data-str="ordini-di-grandezza">ordini di grandezza</span>):</p>
  <p>&bull; l&rsquo;energia di Fermi vale $\varepsilon_F\simeq1{,}13\times10^{-18}$ J, cio&egrave; $\simeq7{,}05$ <span class="str" data-str="elettronvolt">elettronvolt</span>;</p>
  <p>&bull; la temperatura di Fermi $T_F=\varepsilon_F/k_B$ vale $\simeq8{,}18\times10^{4}$ K, cio&egrave; ottantamila kelvin;</p>
  <p>&bull; la velocit&agrave; di Fermi $v_F=p_F/m\simeq1{,}6\times10^{6}$ m/s, cio&egrave; mezzo per cento della velocit&agrave; della luce.</p>
  <p><b>Che cosa dicono questi tre numeri.</b> Il rame fonde a milletrecento kelvin, cio&egrave; a una temperatura sessanta volte pi&ugrave; bassa di $T_F$: <b>gli elettroni di un metallo sono degeneri in ogni condizione in cui il metallo esiste</b>, compreso il metallo fuso. Non c&rsquo;&egrave; nessun regime classico da raggiungere scaldando. E la velocit&agrave; di Fermi &egrave; centinaia di volte pi&ugrave; grande della velocit&agrave; termica che l&rsquo;equipartizione predirebbe a temperatura ambiente: quegli elettroni si muovono forte, e non perch&eacute; siano caldi.</p>
  <p><b>Disaccordo (c): due temperature diverse con lo stesso mestiere.</b> Crisanti (pag. 230) definisce una <b>temperatura di degenerazione</b> $T_0$ per la via opposta, chiedendo che la lunghezza d&rsquo;onda termica diventi paragonabile alla distanza fra le particelle, $n\lambda^3\simeq1$, e la tabula per tre sistemi — idrogeno gassoso $5\times10^{-2}$ K, elio liquido $2$ K, elettroni in un metallo $10^{4}$ K. Quella $T_0$ <i>non</i> &egrave; la temperatura di Fermi: sono due modi diversi di nominare lo stesso confine. Il loro rapporto &egrave; un numero puro che si calcola in due righe — con $\lambda^2=2\pi\hbar^2/(mk_BT)$ si ha $k_BT_0=\frac{2\pi\hbar^2}{m}n^{2/3}$, e dividendo per $k_BT_F$ con $g_s=2$ resta il rapporto $\frac{(3\pi^2)^{2/3}}{4\pi}\simeq0{,}762$. <b>Le due temperature stanno entro il venticinque per cento</b>, il che spiega perch&eacute; una tabella che dice $10^4$ e un conto che dice $8\times10^4$ non si contraddicono: sono lo stesso ordine di grandezza per densit&agrave; che differiscono di un fattore otto. Ma in un compito vanno tenute distinte, perch&eacute; la formula del calore specifico contiene $T_F$ e non $T_0$.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Nel calcolo di $G(\varepsilon)$ la delta &egrave; stata sostituita con la derivata di una theta. Non &egrave; un passaggio formale sospetto, visto che la delta non &egrave; una funzione?`,
    a:R`No, ed &egrave; anzi il modo pi&ugrave; pulito di definirla. Il criterio invocato &egrave; la <b>definizione distribuzionale della delta come derivata della funzione di Heaviside</b>, $\delta(u)=\theta'(u)$, che vale sotto integrale contro qualunque funzione di prova. Qui la funzione di prova &egrave; la misura $d^3p$, che &egrave; liscia, quindi lo scambio fra derivata e integrale &egrave; lecito. Il vantaggio pratico &egrave; enorme: l&rsquo;integrale della theta &egrave; un volume, e un volume si calcola in geometria elementare anche quando la superficie di energia costante non &egrave; una sfera — che &egrave; esattamente il caso degli esercizi con potenziale esterno.`},
   {q:R`L&rsquo;energia di Fermi cresce come $n^{2/3}$ e non dipende dalla massa in modo ovvio. Che cosa succede se si raddoppia la densit&agrave;, e che cosa se si raddoppia la massa?`,
    a:R`Raddoppiare la densit&agrave; moltiplica $\varepsilon_F$ per $2^{2/3}\simeq1{,}587$; raddoppiare la massa la <i>dimezza</i>, perch&eacute; $\varepsilon_F\propto1/m$. Il criterio da riconoscere &egrave; che $p_F$ dipende <b>solo</b> dalla geometria — &egrave; il raggio della palla che contiene $N$ celle di volume $h^3$ — mentre la massa entra solo dopo, convertendo l&rsquo;impulso in energia tramite $p_F^2/2m$. Da qui una conseguenza che torna in astrofisica: a parit&agrave; di densit&agrave; i neutroni, duemila volte pi&ugrave; pesanti degli elettroni, hanno un&rsquo;energia di Fermi duemila volte minore, ed &egrave; per questo che una stella di neutroni deve essere enormemente pi&ugrave; densa di una nana bianca per reggersi.`}
  ]}
]},

/* ---------------- 03 · LA MACCHINA IN D DIMENSIONI ---------------- */
{ num:'03', title:'La stessa macchina in d dimensioni, con una dispersione qualunque e con un potenziale esterno', meta:'la densita di stati generale · gli esponenti che cambiano · il caso ultrarelativistico · la trappola armonica e l area nello spazio delle fasi',
  blocchi:[
  {t:'reveal', title:'Un conto solo, tre parametri: dimensione, dispersione, potenziale', tag:'costruzione', steps:[
   {label:'La densita di stati in d dimensioni', body:R`
   <p>Gli esercizi di questo corso sono quasi sempre in una o due dimensioni, o con una dispersione diversa da $p^2/2m$, e rifare il conto ogni volta &egrave; una perdita di tempo. Conviene farlo una volta sola con tutto generico.</p>
   <p>In $d$ dimensioni la misura degli impulsi si scrive in coordinate sferiche come $d^dp=\Omega_d\,p^{d-1}dp$, dove $\Omega_d$ &egrave; la misura della sfera unitaria,</p>
   $$\Omega_d=\frac{2\pi^{d/2}}{\Gamma\left(\frac d2\right)}$$
   <p>con la <span class="str" data-str="funzione-gamma">funzione Gamma</span>. I valori che servono si controllano a memoria: $\Omega_1=2$ (i due segni dell&rsquo;impulso), $\Omega_2=2\pi$ (la circonferenza), $\Omega_3=4\pi$ (la sfera). Poi si usa la regola della delta composta, $\delta(f(p))=\delta(p-p_0)/|f'(p_0)|$ dove $p_0$ &egrave; la radice: con $\varepsilon=p^2/2m$ la radice &egrave; $p_0=\sqrt{2m\varepsilon}$ e la derivata vale $p_0/m$. Dunque</p>
   $$G_d(\varepsilon)=\frac{V_d}{h^d}\,\Omega_d\,p_0^{d-1}\frac{m}{p_0}=\frac{V_d}{h^d}\,\Omega_d\,m\,(2m\varepsilon)^{(d-2)/2}$$
   <p>e siccome $(2m\varepsilon)^{(d-2)/2}$ si fattorizza in $(2m)^{(d-2)/2}\varepsilon^{d/2-1}$, la dipendenza dall&rsquo;energia &egrave; <b>una potenza sola</b>, $\varepsilon^{d/2-1}$. Tutto il comportamento del gas dipende da quell&rsquo;esponente.</p>
   <p>I tre casi che compaiono nelle prove, con $\Omega_d$ gi&agrave; sostituito:</p>
   <p>&bull; <b>$d=3$</b>: esponente $1/2$, $G_3=2\pi V\left(\frac{2m}{h^2}\right)^{3/2}\sqrt\varepsilon$ — cresce, e si annulla all&rsquo;origine;</p>
   <p>&bull; <b>$d=2$</b>: esponente $0$, $G_2=\frac{2\pi mA}{h^2}$ — <b>costante</b>, ed &egrave; il caso pi&ugrave; comodo che esista perch&eacute; rende molti integrali elementari;</p>
   <p>&bull; <b>$d=1$</b>: esponente $-1/2$, $G_1=\frac{L}{h}\sqrt{\frac{2m}{\varepsilon}}$ — <b>diverge</b> all&rsquo;origine, il che per i fermioni &egrave; innocuo (la divergenza &egrave; integrabile) ma cambia tutti i coefficienti.</p>`},
   {label:'Cambiare dispersione, e la regola che tiene insieme tutti i casi', body:R`
   <p>Molti esercizi danno un&rsquo;hamiltoniana con una dipendenza dall&rsquo;impulso diversa dal quadrato: $\varepsilon=c|\vec p|$ per particelle ultrarelativistiche, $\varepsilon=a|\vec p|$ per un modello unidimensionale, e talvolta potenze qualunque. Il conto non cambia forma. Con $\varepsilon=\mathcal A\,p^{s}$ la radice &egrave; $p_0=(\varepsilon/\mathcal A)^{1/s}$ e la derivata vale $s\mathcal A\,p_0^{s-1}$, dunque</p>
   $$G_d(\varepsilon)=\frac{V_d\,\Omega_d}{h^d\,s\,\mathcal A}\,p_0^{\,d-s}$$
   <p>e poich&eacute; $p_0^{\,d-s}=(\varepsilon/\mathcal A)^{(d-s)/s}$ si ottiene la <b>regola generale</b>: la densit&agrave; di stati va come $\varepsilon^{d/s-1}$. Tutti i casi noti sono istanze di questa riga: gas libero in tre dimensioni, $d=3$, $s=2$, esponente $1/2$; gas ultrarelativistico in tre dimensioni, $d=3$, $s=1$, esponente $2$; gas relativistico in una dimensione, $d=1$, $s=1$, esponente $0$, cio&egrave; densit&agrave; di stati costante.</p>
   <p><b>Perch&eacute; conviene ricordare questa e non le formule singole.</b> Tre conseguenze si leggono direttamente dall&rsquo;esponente, senza rifare nessun conto. Primo, l&rsquo;energia media per particella a temperatura nulla, che la tappa 04 mostra valere $\frac{a}{a+1}\varepsilon_F$ quando $G\propto\varepsilon^{a-1}$. Secondo, l&rsquo;equazione di stato, che la tappa 05 mostra essere $PV=E/a$. Terzo, il coefficiente del calore specifico. Tre risultati da un numero solo: <b>l&rsquo;esponente della densit&agrave; di stati &egrave; il dato che riassume il problema</b>, ed &egrave; la prima cosa da scrivere quando si apre un compito.</p>
   <p>Per usarla servono i valori di $\Gamma$ nei mezzi interi, che si ricavano tutti da $\Gamma(x+1)=x\Gamma(x)$ e $\Gamma(1/2)=\sqrt\pi$: qui servono $\Gamma\left(\tfrac32\right)=\tfrac12\sqrt\pi$ e $\Gamma\left(\tfrac52\right)=\tfrac34\sqrt\pi$.</p>`},
   {label:'Accendere un potenziale esterno: la densita di stati diventa un integrale sulle posizioni', body:R`
   <p>Finora l&rsquo;integrale sulle posizioni ha dato banalmente il volume, perch&eacute; l&rsquo;hamiltoniana non dipendeva da $\vec q$. Con un potenziale esterno, $H=p^2/2m+V(\vec q)$, non &egrave; pi&ugrave; cos&igrave;, e il conto si fa <b>punto per punto</b>: attorno a $\vec q$ l&rsquo;energia cinetica disponibile &egrave; $\varepsilon-V(\vec q)$, quindi vale la formula del gas libero con l&rsquo;energia ridotta, e dove $V(\vec q)\gt\varepsilon$ non c&rsquo;&egrave; niente da contare. Il risultato &egrave;</p>
   $$G(\varepsilon)=\int\frac{d^dq}{h^d}\,\Omega_d\,m\,[2m(\varepsilon-V(\vec q))]^{(d-2)/2}\,\theta(\varepsilon-V(\vec q))$$
   <p>e la <b>theta non &egrave; un ornamento</b>: &egrave; la regione classicamente accessibile a quell&rsquo;energia, e dimenticarla &egrave; l&rsquo;errore pi&ugrave; frequente di questa famiglia di esercizi, perch&eacute; produce una radice di un numero negativo che spesso passa inosservata dentro un conto simbolico.</p>
   <p>Due casi concreti chiudono il quadro, e sono entrambi esercizi d&rsquo;esame veri. Il primo &egrave; un <b>potenziale costante a tratti</b>: la theta trasforma ogni tratto in un gradino che si accende alla sua soglia, e $G$ diventa una somma di termini del tipo $\theta(\varepsilon-V_j)$ moltiplicati per la formula libera con origine spostata. L&rsquo;esercizio 3 della tappa 09 &egrave; esattamente questo. Il secondo &egrave; la <b>trappola armonica</b>, ed &egrave; abbastanza bello da meritare il conto qui.</p>`},
   {label:'La trappola armonica: contare stati e misurare un area', body:R`
   <p>Si prenda un oscillatore armonico unidimensionale, $H=\frac{p^2}{2m}+\frac12m\omega^2q^2$. La regione dello spazio delle fasi con $H\le\varepsilon$ &egrave; l&rsquo;interno di un&rsquo;<b>ellisse</b>, con semiassi $p_{\max}=\sqrt{2m\varepsilon}$ lungo gli impulsi e $q_{\max}=\sqrt{2\varepsilon/(m\omega^2)}$ lungo le posizioni. L&rsquo;area di un&rsquo;ellisse &egrave; $\pi$ per il prodotto dei semiassi, e il prodotto si semplifica in modo notevole perch&eacute; la massa sparisce:</p>
   $$\pi\sqrt{2m\varepsilon}\,\sqrt{\frac{2\varepsilon}{m\omega^2}}=\frac{2\pi\varepsilon}{\omega}$$
   <p>Il numero di stati con energia minore di $\varepsilon$, per ciascuno stato di spin, &egrave; quell&rsquo;area divisa per $h$:</p>
   $$\Gamma(\varepsilon)=\frac{2\pi\varepsilon}{h\omega}=\frac{\varepsilon}{\hbar\omega}$$
   <p>Questo risultato merita di essere guardato: dice che <b>il numero di stati sotto $\varepsilon$ &egrave; il numero di quanti $\hbar\omega$ contenuti in $\varepsilon$</b>, cio&egrave; esattamente l&rsquo;indice del livello. &Egrave; il conto semiclassico che riproduce lo spettro $\varepsilon_n=(n+\tfrac12)\hbar\omega$ senza risolvere nessuna equazione di Schr&ouml;dinger, e la ragione &egrave; che per l&rsquo;oscillatore la quantizzazione di Bohr-Sommerfeld &egrave; esatta a meno del mezzo.</p>
   <p>Da qui l&rsquo;energia di Fermi &egrave; immediata: imponendo $N=g_s\Gamma(\varepsilon_F)$ si ottiene</p>
   $$\varepsilon_F=\frac{N\hbar\omega}{g_s}$$
   <p>e la densit&agrave; di stati &egrave; la derivata, $G(\varepsilon)=1/(\hbar\omega)$, costante — lo stesso esponente del gas libero bidimensionale, che &egrave; il motivo per cui una trappola armonica in $d$ dimensioni si comporta come un gas libero in $2d$.</p>`}
  ]},
  {t:'plot', title:'La regione occupata nello spazio delle fasi di una trappola armonica',
   intro:R`Il piano $(q,p)$ di un oscillatore armonico unidimensionale. La curva chiusa &egrave; il luogo $H=\varepsilon_F$, cio&egrave; $\frac{p^2}{2m}+\frac12m\omega^2q^2=\varepsilon_F$; il suo interno &egrave; la regione occupata a temperatura nulla. Unit&agrave; scelte in modo che i semiassi valgano $1{,}6$ e $1$.`,
   plots:[
    {kind:'curve', x:'1.6*cos(t)', y:'1.0*sin(t)', tr:[0,6.2832], height:330,
     title:'la superficie di Fermi di una trappola armonica e una ellisse',
     segs:[
      {x1:-1.6,y1:0,x2:1.6,y2:0,col:'#4d5a6b',width:1.2},
      {x1:0,y1:-1,x2:0,y2:1,col:'#4d5a6b',width:1.2},
      {x1:0,y1:0,x2:1.6,y2:0,col:'#d8a13a',width:2,arrow:true,label:'ampiezza massima',lx:0.8,ly:-0.16},
      {x1:0,y1:0,x2:0,y2:1,col:'#5eead4',width:2,arrow:true,label:'impulso massimo',lx:0.08,ly:0.6}
     ],
     xlabel:'posizione', ylabel:'impulso'}
   ],
   leggi:R`<p><b>Che cosa guardare: l&rsquo;area, non la forma.</b> La figura &egrave; un&rsquo;ellisse e non un cerchio perch&eacute; le due unit&agrave; sono diverse, ma la quantit&agrave; fisica &egrave; l&rsquo;<i>area</i> racchiusa, che vale $2\pi\varepsilon_F/\omega$ e non dipende dalla massa. Dividendola per $h$ si ottiene il numero di stati: <b>in una trappola armonica contare gli stati &egrave; letteralmente misurare un&rsquo;area</b>, e questo &egrave; il modo pi&ugrave; rapido di risolvere met&agrave; degli esercizi con potenziale esterno.</p>
   <p><b>Che cosa guardare: i due assi.</b> Il semiasse orizzontale &egrave; l&rsquo;ampiezza massima dell&rsquo;oscillazione classica di una particella con energia $\varepsilon_F$, quello verticale &egrave; il suo impulso massimo. Le particelle del mare di Fermi non stanno tutte in un punto: <b>occupano una regione estesa sia nelle posizioni sia negli impulsi</b>, e la particella pi&ugrave; energetica arriva fino al bordo della trappola. &Egrave; l&rsquo;analogo, per un gas intrappolato, del fatto che nel gas libero la palla occupata ha raggio $p_F$.</p>
   <p><b>Che cosa impararne per i conti.</b> Aumentare $N$ gonfia l&rsquo;ellisse, e siccome l&rsquo;area cresce linearmente con $\varepsilon_F$ mentre i semiassi crescono come $\sqrt{\varepsilon_F}$, raddoppiare il numero di particelle raddoppia l&rsquo;energia di Fermi ma allarga la nuvola solo di un fattore $\sqrt2$. In due dimensioni lo stesso ragionamento fatto in quattro dimensioni di spazio delle fasi d&agrave; $\varepsilon_F\propto\sqrt N$, che &egrave; il risultato dell&rsquo;esercizio 1 della tappa 09.</p>
   <p><b>Dove questa figura mente.</b> Disegna una superficie di Fermi <i>nello spazio delle fasi</i>, mentre per un gas libero la superficie di Fermi vive nello spazio dei soli impulsi. Le due cose coincidono solo perch&eacute; qui il potenziale confina le particelle: senza trappola, l&rsquo;ellisse si allungherebbe indefinitamente lungo l&rsquo;asse delle posizioni e l&rsquo;area sarebbe infinita — che &egrave; il modo geometrico di dire che un gas libero ha bisogno delle pareti della scatola.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`In una dimensione la densit&agrave; di stati diverge in $\varepsilon=0$. Non significa che ci sono infiniti stati a energia nulla, e quindi che il conteggio non ha senso?`,
    a:R`No, e il criterio da invocare &egrave; l&rsquo;<b>integrabilit&agrave; della singolarit&agrave;</b>. Ci&ograve; che ha significato fisico non &egrave; $G(\varepsilon)$ ma $\int G(\varepsilon)d\varepsilon$, e vicino all&rsquo;origine $\int_0\varepsilon^{-1/2}d\varepsilon$ converge: il numero di stati sotto una qualunque energia positiva &egrave; finito. La divergenza dice soltanto che in una dimensione i livelli si infittiscono verso il basso, il che &egrave; corretto — lo spettro $p_n\propto n$ d&agrave; $\varepsilon_n\propto n^2$, e livelli che crescono come $n^2$ sono fitti in basso e radi in alto. Per i bosoni lo stesso esponente ha invece una conseguenza drammatica, perch&eacute; l&igrave; l&rsquo;integrale da controllare porta un fattore $1/\varepsilon$ in pi&ugrave; e diverge.`},
   {q:R`Quale sequenza di mosse conviene fissare per attaccare un esercizio con un&rsquo;hamiltoniana che non &egrave; $p^2/2m$?`,
    a:R`Quattro mosse, sempre nello stesso ordine, ed &egrave; il <b>modus operandi</b> che questo corso premia. <b>Uno</b>: scrivere $G(\varepsilon)$ dalla definizione con la delta, senza cercare formule a memoria — la delta composta $\delta(f(p))=\delta(p-p_0)/|f'(p_0)|$ risolve tutti i casi con dispersione, e l&rsquo;integrale sulle posizioni con la theta risolve tutti i casi con potenziale. <b>Due</b>: identificare l&rsquo;esponente $a$ tale che $G\propto\varepsilon^{a-1}$, perch&eacute; da solo d&agrave; $\langle E\rangle/N$ e l&rsquo;equazione di stato. <b>Tre</b>: imporre $N=g_s\int_0^{\varepsilon_F}G\,d\varepsilon$ e invertire per $\varepsilon_F$, ricordando che il limite inferiore &egrave; il <i>minimo del potenziale</i> e non zero. <b>Quattro</b>: solo adesso calcolare le medie richieste. Chi inverte l&rsquo;ordine — per esempio cercando l&rsquo;energia prima di aver fissato $\varepsilon_F$ — si ritrova con una costante indeterminata e perde il compito.`}
  ]}
]},

/* ---------------- 04 · LE MEDIE A TEMPERATURA NULLA ---------------- */
{ num:'04', title:'Le medie a temperatura nulla: energia per particella, impulso medio, fluttuazione', meta:'un rapporto di due integrali · tre quinti di epsilon di Fermi · la media geometrica e il raggio · la sequenza che l esame chiede',
  blocchi:[
  {t:'reveal', title:'La macchina delle medie, e i tre integrali che ogni prova chiede', tag:'costruzione', steps:[
   {label:'La definizione, e perche e un rapporto', body:R`
   <p>A temperatura nulla ogni stato sotto $\varepsilon_F$ &egrave; occupato e ogni stato sopra &egrave; vuoto. La media di una qualunque grandezza $f$ che dipenda solo dall&rsquo;energia si calcola allora pesando $f$ con il numero di stati occupati a ciascuna energia, e normalizzando:</p>
   $$\langle f\rangle=\frac{\int_0^{\varepsilon_F}f(\varepsilon)G(\varepsilon)\,d\varepsilon}{\int_0^{\varepsilon_F}G(\varepsilon)\,d\varepsilon}$$
   <p>Tre osservazioni prima di usarla, e sono tre errori che si vedono nei compiti. <b>La prima</b>: il fattore di spin $g_s$ compare sopra e sotto e si semplifica, quindi in una media non serve — serve invece in $N$ e in $E$, che sono estensive. <b>La seconda</b>: la funzione di occupazione non compare, perch&eacute; vale identicamente uno nel dominio di integrazione; scriverla comunque non fa danno, ma chi la scrive a temperatura finita deve ricordarsi di estendere l&rsquo;integrale fino all&rsquo;infinito. <b>La terza</b>, la pi&ugrave; insidiosa: il peso &egrave; $G(\varepsilon)$, la <i>densit&agrave; di stati</i>, non una distribuzione di probabilit&agrave; uniforme in energia. A energie alte ci sono pi&ugrave; stati, e la media viene spinta verso l&rsquo;alto; &egrave; per questo che l&rsquo;energia media non vale $\varepsilon_F/2$, come si direbbe se i livelli fossero equispaziati in energia.</p>
   <p>Conviene fare il conto una volta sola con l&rsquo;esponente generico. Se $G(\varepsilon)=C\varepsilon^{a-1}$ — e la tappa 03 ha mostrato che <i>ogni</i> problema di questo corso ha questa forma, con $a=d/s$ — i due integrali sono elementari:</p>
   $$\int_0^{\varepsilon_F}\varepsilon\cdot\varepsilon^{a-1}d\varepsilon=\frac{\varepsilon_F^{a+1}}{a+1},\qquad\int_0^{\varepsilon_F}\varepsilon^{a-1}d\varepsilon=\frac{\varepsilon_F^{a}}{a}$$
   <p>e il loro rapporto d&agrave; la formula che vale in tutti i casi:</p>
   $$\langle\varepsilon\rangle=\frac{a}{a+1}\varepsilon_F$$`},
   {label:'Il caso tridimensionale, e il tre quinti', body:R`
   <p>Per un gas libero in tre dimensioni $a=3/2$, dunque $\langle\varepsilon\rangle=\frac{3/2}{5/2}\varepsilon_F$. Vale la pena vedere anche il conto esplicito, perch&eacute; &egrave; quello che si scrive all&rsquo;esame. Il numeratore &egrave; l&rsquo;energia totale,</p>
   $$E=g_s\int_0^{\varepsilon_F}\varepsilon\,G(\varepsilon)\,d\varepsilon=g_s\,2\pi V\left(\frac{2m}{h^2}\right)^{3/2}\tfrac25\varepsilon_F^{5/2}$$
   <p>perch&eacute; $\int_0^{\varepsilon_F}\varepsilon\sqrt\varepsilon\,d\varepsilon$ vale $\tfrac25\varepsilon_F^{5/2}$; il denominatore &egrave; il numero di particelle, gi&agrave; calcolato nella tappa 02 con $\tfrac23\varepsilon_F^{3/2}$ al posto della potenza. Il rapporto:</p>
   $$\frac EN=\frac{\tfrac25\varepsilon_F^{5/2}}{\tfrac23\varepsilon_F^{3/2}}=\frac35\varepsilon_F$$
   <p>e dunque $E=\tfrac35N\varepsilon_F$, che &egrave; il risultato che Crisanti (pag. 278) e Grilli-Giardina (pag. 92) scrivono entrambi nella stessa forma.</p>
   <p><b>Che cosa leggere nel tre quinti.</b> &Egrave; un numero maggiore di un mezzo, e il motivo &egrave; che gli stati si addensano verso l&rsquo;alto: la met&agrave; superiore del mare, in energia, contiene pi&ugrave; della met&agrave; delle particelle. Il conto generale lo dice meglio del caso particolare: $\langle\varepsilon\rangle/\varepsilon_F$ vale $a/(a+1)$, quindi $2/3$ per un gas bidimensionale libero o per una trappola armonica unidimensionale ($a=2$), $1/3$ in una dimensione ($a=1/2$), $3/4$ per un gas ultrarelativistico tridimensionale ($a=3$). <b>Pi&ugrave; l&rsquo;esponente &egrave; grande, pi&ugrave; le particelle si ammassano vicino alla superficie di Fermi</b>, e nel limite $a\to\infty$ la media tende a $\varepsilon_F$ — cio&egrave; a un gas in cui tutte le particelle stanno sul bordo.</p>
   <p><b>Il confronto col gas classico, che &egrave; il punto.</b> A temperatura nulla un gas classico ha energia esattamente zero. Qui l&rsquo;energia per particella &egrave; qualche elettronvolt, cio&egrave; l&rsquo;equivalente termico di decine di migliaia di kelvin, e <i>non dipende dalla temperatura</i>. Questa energia non &egrave; calore: &egrave; il prezzo cinematico dell&rsquo;esclusione.</p>`},
   {label:'La media geometrica: l impulso medio, e la fluttuazione dell energia', body:R`
   <p>La terza domanda della sequenza chiede quasi sempre una <b>media geometrica</b>: la distanza media dall&rsquo;origine nello spazio in cui il mare &egrave; una palla, cio&egrave; l&rsquo;impulso medio, oppure il raggio quadratico medio in una trappola. Il conto &egrave; lo stesso di prima fatto negli impulsi invece che nelle energie, e conviene farlo l&igrave; perch&eacute; l&agrave; la misura &egrave; semplice: il numero di stati con modulo fra $p$ e $p+dp$ &egrave; proporzionale a $p^2dp$ in tre dimensioni, e a $p^{d-1}dp$ in $d$. Dunque</p>
   $$\langle|\vec p|\rangle=\frac{\int_0^{p_F}p\cdot p^2dp}{\int_0^{p_F}p^2dp}=\frac{p_F^4/4}{p_F^3/3}=\frac34p_F$$
   <p>e in $d$ dimensioni, con lo stesso conto,</p>
   $$\langle|\vec p|\rangle=\frac{d}{d+1}p_F$$
   <p>Dividendo per la massa si ottiene la velocit&agrave; media, $\langle v\rangle=\tfrac34v_F$: <b>tre quarti della velocit&agrave; di Fermi</b>, che per il rame vuol dire pi&ugrave; di un milione di metri al secondo di velocit&agrave; media a temperatura nulla.</p>
   <p><b>Il controllo di coerenza da fare sempre.</b> Le due medie non sono indipendenti: $\langle\varepsilon\rangle=\langle p^2\rangle/2m$, e $\langle p^2\rangle$ si calcola con lo stesso integrale sostituendo $p^2$ a $p$, dando $\tfrac35p_F^2$. Dividendo per $2m$ si ritrova $\tfrac35\varepsilon_F$, come deve essere. Si noti invece che $\langle p\rangle^2=\tfrac9{16}p_F^2$ &egrave; <i>diverso</i> da $\langle p^2\rangle$: la media del quadrato non &egrave; il quadrato della media, e chi calcola l&rsquo;energia media come $\langle p\rangle^2/2m$ sbaglia del quindici per cento.</p>
   <p>Lo stesso conto d&agrave; anche la <b>larghezza</b> della distribuzione di energia, che &egrave; una domanda d&rsquo;orale frequente. Con $\int_0^{\varepsilon_F}\varepsilon^2\sqrt\varepsilon\,d\varepsilon$ uguale a $\tfrac27\varepsilon_F^{7/2}$ si ha</p>
   $$\langle\varepsilon^2\rangle=\frac{\tfrac27\varepsilon_F^{7/2}}{\tfrac23\varepsilon_F^{3/2}}=\frac37\varepsilon_F^2$$
   <p>e quindi la varianza vale</p>
   $$\langle\varepsilon^2\rangle-\langle\varepsilon\rangle^2=\left(\frac37-\frac9{25}\right)\varepsilon_F^2=\frac{12}{175}\varepsilon_F^2$$
   <p>La fluttuazione relativa dell&rsquo;energia di singola particella &egrave; dunque la radice di quel numero divisa per $3/5$, cio&egrave; circa $0{,}4364$. <b>&Egrave; una fluttuazione di ordine uno, e non svanisce nel limite termodinamico</b>: il mare di Fermi non &egrave; un insieme di particelle con quasi la stessa energia, &egrave; un insieme di particelle con energie sparse su tutto l&rsquo;intervallo. La cosa notevole &egrave; che quella dispersione enorme non produce nessuna fluttuazione <i>termica</i>, perch&eacute; lo stato &egrave; uno solo e non c&rsquo;&egrave; nulla di aleatorio in esso.</p>`}
  ]},
  {t:'plot', title:'La densita degli stati e la parte di essa che e occupata',
   intro:R`In grigio-verde la densit&agrave; degli stati di un gas libero tridimensionale, proporzionale a $\sqrt\varepsilon$; le altre due curve sono il prodotto $G(\varepsilon)\langle n_\varepsilon\rangle$, cio&egrave; la densit&agrave; degli stati <i>occupati</i>, a due temperature. L&rsquo;energia &egrave; in unit&agrave; di $\varepsilon_F$, la verticale tratteggiata &egrave; il livello di Fermi.`,
   plots:[
    {kind:'func2d', xr:[0,1.8], yr:[0,1.45], height:340, ticks:6,
     title:'stati disponibili e stati occupati',
     curves:[
      {f:'sqrt(x)', col:'#5eead4', label:'densita degli stati, proporzionale a radice di epsilon'},
      {f:'sqrt(x)/(exp((x-1)/0.05)+1)', col:'#4c8dff', label:'occupati a T/T_F = 0,05'},
      {f:'sqrt(x)/(exp((x-1)/0.25)+1)', col:'#d8a13a', label:'occupati a T/T_F = 0,25', dash:true}
     ],
     segs:[{x1:1,y1:0,x2:1,y2:1.45,col:'#b98cff',dash:true,width:1.4,label:'livello di Fermi',lx:1.03,ly:1.36}],
     xlabel:'energia / energia di Fermi', ylabel:'stati per unita di energia'}
   ],
   leggi:R`<p><b>Che cosa guardare: l&rsquo;area sotto la curva blu.</b> &Egrave; il numero di particelle, e siccome l&rsquo;integrale di $\sqrt\varepsilon$ fino a uno vale $2/3$, quell&rsquo;area &egrave; i due terzi del rettangolo di base uno e altezza uno. L&rsquo;area sotto la stessa curva <i>moltiplicata per l&rsquo;energia</i> &egrave; invece $2/5$: il rapporto fra le due, $3/5$, &egrave; l&rsquo;energia media per particella. <b>Tutta la tappa &egrave; contenuta in questa figura come rapporto di due aree.</b></p>
   <p><b>Che cosa guardare: dove sta il baricentro.</b> La curva pesa di pi&ugrave; a destra che a sinistra, perch&eacute; $\sqrt\varepsilon$ cresce, ed &egrave; questa asimmetria a spostare la media da $1/2$ a $3/5$. Si immagini invece una densit&agrave; di stati costante, come in due dimensioni: l&igrave; la figura sarebbe un rettangolo e la media sarebbe esattamente met&agrave;, cio&egrave; $a/(a+1)$ con $a=1$. La formula generale non &egrave; un&rsquo;astrazione: &egrave; la posizione del baricentro di questa figura al variare della sua forma.</p>
   <p><b>Che cosa impararne sulla temperatura.</b> La curva tratteggiata, a temperatura un quarto di $T_F$, ha perso un po&rsquo; di area appena sotto il livello di Fermi e l&rsquo;ha guadagnata appena sopra. Le due aree sono uguali — il numero di particelle non cambia — ma la seconda sta a energia pi&ugrave; alta, e la differenza &egrave; <i>tutta</i> l&rsquo;energia termica del gas. Guardando la figura si capisce perch&eacute; sar&agrave; proporzionale a $T^2$: il numero di particelle spostate &egrave; proporzionale a $T$, e ciascuna sale di un&rsquo;energia dell&rsquo;ordine di $T$.</p>
   <p><b>Dove questa figura mente.</b> Disegna le due curve con lo stesso potenziale chimico della curva a temperatura nulla, mentre a $T/T_F$ pari a $0{,}25$ il potenziale chimico sarebbe gi&agrave; sceso di circa il cinque per cento e la curva tratteggiata andrebbe traslata a sinistra. Ed &egrave; una figura a $N$ fissato solo per costruzione, non per come &egrave; disegnata: le aree sotto le tre curve non sono esattamente uguali.</p>`},
  {t:'prosa', title:'La sequenza da eseguire in un compito, nell ordine in cui va eseguita', tag:'grammatica', html:R`
  <p>Le quarantasei prove che toccano questo argomento chiedono quasi sempre le stesse tre cose, e le chiedono in quest&rsquo;ordine perch&eacute; ciascuna serve alla successiva. Conviene avere il <b>modus operandi</b> in mano prima di aprire il foglio.</p>
  <p><b>Primo: $\varepsilon_F$ dal numero di particelle.</b> Si scrive $G(\varepsilon)$ dalla definizione con la delta — mai a memoria — si impone $N=g_s\int_{\varepsilon_{\min}}^{\varepsilon_F}G\,d\varepsilon$ e si inverte. Il limite inferiore &egrave; il minimo dell&rsquo;energia di singola particella, che con un potenziale esterno non &egrave; zero. Qui si perdono punti in tre modi: dimenticando $g_s$, sbagliando il limite inferiore, e invertendo male una potenza frazionaria.</p>
  <p><b>Secondo: l&rsquo;energia media.</b> Si riconosce l&rsquo;esponente $a$ tale che $G\propto\varepsilon^{a-1}$ e si scrive $\langle\varepsilon\rangle=\frac{a}{a+1}\varepsilon_F$, oppure si rifanno i due integrali. Chi ha riconosciuto l&rsquo;esponente al primo punto qui non fa nessun conto nuovo. Attenzione al caso con potenziale esterno, dove $G$ non &egrave; una potenza pura e gli integrali vanno fatti davvero, spezzandoli sui tratti.</p>
  <p><b>Terzo: la media geometrica.</b> Impulso medio, raggio medio, velocit&agrave; media: si passa alla variabile in cui la misura degli stati &egrave; semplice — gli impulsi per un gas libero, lo spazio delle fasi per una trappola — e si fa lo stesso rapporto di integrali. Per la trappola armonica il pi&ugrave; rapido &egrave; il <b>teorema del viriale</b>: per un potenziale quadratico l&rsquo;energia potenziale media &egrave; met&agrave; dell&rsquo;energia totale, dunque $\tfrac12m\omega^2\langle r^2\rangle$ vale $\langle\varepsilon\rangle/2$ e il raggio quadratico medio esce senza integrare niente.</p>
  <p><b>La quarta domanda, quando c&rsquo;&egrave;</b>, &egrave; il calore specifico, e l&igrave; il gradino non basta pi&ugrave;: serve lo sviluppo di Sommerfeld, che &egrave; il mestiere delle tappe 06-08. Ma si noti che anche quella domanda comincia da $\varepsilon_F$, perch&eacute; il risultato si scrive in unit&agrave; di $T_F$. <b>Nessuna domanda di questa famiglia si pu&ograve; rispondere senza aver fatto bene la prima.</b></p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Se l&rsquo;energia media per particella &egrave; $\tfrac35\varepsilon_F$ e non $\tfrac12\varepsilon_F$, che cosa sarebbe dovuto succedere perch&eacute; venisse esattamente met&agrave;?`,
    a:R`Sarebbe dovuta essere costante la densit&agrave; di stati. Il criterio &egrave; quello della <b>media pesata</b>: $\langle\varepsilon\rangle=\frac{a}{a+1}\varepsilon_F$ vale $\tfrac12\varepsilon_F$ se e solo se $a=1$, cio&egrave; $G\propto\varepsilon^0$. Questo succede per un gas libero in <i>due</i> dimensioni e per una trappola armonica in <i>una</i>. In tre dimensioni $G$ cresce come $\sqrt\varepsilon$, il che equivale a dire che i livelli alti sono pi&ugrave; degeneri, e la media si sposta verso l&rsquo;alto. La lezione operativa: prima di calcolare una media in questo corso, si guarda l&rsquo;esponente — se non &egrave; zero, nessuna intuizione «a met&agrave;» funziona.`},
   {q:R`In un esercizio con $N$ fermioni in una trappola armonica tridimensionale, conviene calcolare il raggio quadratico medio integrando la densit&agrave; oppure c&rsquo;&egrave; una scorciatoia?`,
    a:R`C&rsquo;&egrave;, ed &egrave; il <b>teorema del viriale</b> nella forma per potenziali omogenei: se $V(\vec q)$ &egrave; omogenea di grado $k$, allora $2\langle T\rangle=k\langle V\rangle$, e per l&rsquo;oscillatore $k=2$ d&agrave; $\langle T\rangle=\langle V\rangle$, cio&egrave; ciascuna met&agrave; dell&rsquo;energia totale. Da qui $\tfrac12m\omega^2\langle r^2\rangle=\tfrac12\langle\varepsilon\rangle$ e il raggio esce in una riga, mentre l&rsquo;integrale diretto richiederebbe la densit&agrave; spaziale del gas intrappolato, che &egrave; un conto lungo. <b>Il trabocchetto</b>: il viriale vale per lo <i>stato</i>, non per la singola particella, quindi $\langle r^2\rangle$ cos&igrave; ottenuto &egrave; la media su tutte le particelle occupate — che &egrave; proprio quello che l&rsquo;esercizio chiede, ma non &egrave; il raggio della particella pi&ugrave; energetica, che &egrave; pi&ugrave; grande.`}
  ]}
]},

/* ---------------- 05 · LA PRESSIONE DI DEGENERAZIONE ---------------- */
{ num:'05', title:'La pressione di degenerazione: perche un gas freddo puo spingere', meta:'PV uguale E diviso per l esponente · integrazione per parti · il valore a temperatura nulla · la lettura termodinamica',
  blocchi:[
  {t:'reveal', title:'PV uguale E diviso per l esponente, per qualunque densita di stati a potenza', tag:'costruzione', steps:[
   {label:'L integrazione per parti, fatta una volta per tutte', body:R`
   <p>La pressione di un gas quantistico esce dalla normalizzazione del gran canonico, che lega il logaritmo della gran partizione al prodotto $PV$. Per un gas di fermioni, tradotta in integrale sull&rsquo;energia con la densit&agrave; di stati, la relazione &egrave;</p>
   $$\frac{PV}{T}=g_s\int_0^{\infty}G(\varepsilon)\log\left(1+ze^{-\beta\varepsilon}\right)d\varepsilon$$
   <p>con $z=e^{\beta\mu}$ la fugacit&agrave;. Questo integrale non si sa fare in forma chiusa, ma non serve: quello che serve &egrave; legarlo all&rsquo;energia, e per farlo basta un&rsquo;integrazione per parti. Si supponga $G(\varepsilon)=C\varepsilon^{a-1}$, che come si &egrave; visto copre tutti i casi del corso, e si scriva la potenza come derivata (<span class="str" data-str="cambio-di-variabile">cambio di variabile</span> e parte sono qui la stessa mossa):</p>
   $$\varepsilon^{a-1}=\frac1a\frac{d}{d\varepsilon}\varepsilon^{a}$$
