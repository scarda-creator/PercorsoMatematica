  .str{color:var(--gram);border-bottom:1px dashed var(--gram);cursor:pointer;}

<script>
"use strict";
const R = String.raw;

function typeset(el){
  if(el && window.renderMathInElement){
    try{ renderMathInElement(el,{delimiters:[
      {left:'$$',right:'$$',display:true},
      {left:'$',right:'$',display:false}
    ],throwOnError:false}); }catch(e){}
  }
}
function elFromHTML(html){ var d=document.createElement('div'); d.innerHTML=html; return d; }

/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un
   rimando scritto nella prosa:

       <span class="str" data-str="serie-geometrica">la serie geometrica</span>

   Le schede citate da questo nucleo sono cucite qui sotto dal montaggio
   (assembla-nucleo.js): la pagina resta autosufficiente — niente fetch,
   niente sottocartelle da pubblicare — e un rimando a una scheda che non
   esiste FERMA la costruzione invece di arrivare in pagina rotto.
   Apertura: lo stesso gesto del collaudo (si clicca, il pannello compare,
   si typeset una volta sola), portato dentro la frase.
   =================================================================== */
var CORSO = 'meccanica-statistica';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};


function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';
  return h;
}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

/* ===================================================================
   >>> CONTENUTO — Nucleo ms-00: La termodinamica che dobbiamo ritrovare: il bersaglio, prima del tiro <<<
   Modello dati: TAPPE[] ; ogni tappa ha blocchi[] con un tipo (t).
   Tipi: prosa | gram | reveal | esercizio | collaudo | prolessi | plot
   Tutta la matematica in R`...` (String.raw). Nelle formule si usano
   \lt \gt \le \ge (mai < > nudi, che l'HTML leggerebbe come tag).
   =================================================================== */

var TAPPE = [


/*MOVIMENTO
id:        ms-00 — la termodinamica che dobbiamo ritrovare
identita:  il bersaglio prima del tiro: quali leggi macroscopiche la meccanica statistica deve saper riprodurre, e con che vocabolario
copre:     A.1 — Richiami di termodinamica e meccanica classica
serve:     — (e' una radice del corso)
apre:      ms-01 (20-spazio-fasi.html), ms-03 (ms-03-probabilita.html)
profondita: servizio, non allenamento. Non e' un capitolo di termodinamica: e' l'elenco dei conti che ogni movimento successivo dovra' far tornare, scritto una volta sola perche' non venga rifatto quattordici volte. Tutte le grandezze qui elencate compaiono nelle prove (temperatura 47/47, pressione 30/47, entropia 17/47) ma nessuna come DOMANDA: compaiono come cose da calcolare con gli strumenti dei movimenti dopo.
generata:  2026-09-17 da mappa.json — non modificare a mano, si cambia la mappa
MOVIMENTO*/

/*CONTROLLO
[
 {"tipo":"derivata","espr":"-N*k*T*(log(V/N)+(3/2)*log(T)+c)","rispetto":["V"],
  "vale":"-N*k*T/V",
  "ipotesi":{"V":"positive","N":"positive","T":"positive","k":"positive"},
  "dove":"02","appare":"\\frac{NkT}{V}"},

 {"tipo":"derivata","espr":"-N*k*T*(log(V/N)+(3/2)*log(T)+c)","rispetto":["T"],
  "vale":"-N*k*(log(V/N)+(3/2)*log(T)+c+3/2)",
  "ipotesi":{"V":"positive","N":"positive","T":"positive","k":"positive"},
  "dove":"02","appare":"Nk\\left(\\ln\\frac{V}{N}+\\frac32\\ln T+c+\\frac32\\right)"},

 {"tipo":"derivata","espr":"-N*k*T*(log(V/N)+(3/2)*log(T)+c)","rispetto":["V","T"],
  "vale":"-N*k/V",
  "ipotesi":{"V":"positive","N":"positive","T":"positive","k":"positive"},
  "dove":"03","appare":"\\frac{\\partial^{2}F}{\\partial T\\,\\partial V}"},

 {"tipo":"derivata","espr":"-N*k*T*(log(V/N)+(3/2)*log(T)+c)","rispetto":["T","V"],
  "vale":"-N*k/V",
  "ipotesi":{"V":"positive","N":"positive","T":"positive","k":"positive"},
  "dove":"03","appare":"\\left(\\frac{\\partial P}{\\partial T}\\right)_{V}"},

 {"tipo":"derivata","espr":"(3/2)*N*k*T","rispetto":["T"],
  "vale":"(3/2)*N*k",
  "ipotesi":{"N":"positive","k":"positive"},
  "dove":"03","appare":"C_V=\\tfrac32 Nk"},

 {"tipo":"derivata","espr":"N*k*T/P","rispetto":["P"],
  "vale":"-N*k*T/P**2",
  "ipotesi":{"P":"positive","N":"positive","T":"positive","k":"positive"},
  "dove":"03","appare":"-NkT/P^{2}"},

 {"tipo":"uguale","sinistra":"(3/2)*N*k*T + N*k*T","vale":"(5/2)*N*k*T",
  "ipotesi":{"N":"positive","k":"positive","T":"positive"},
  "dove":"02","appare":"\\tfrac52NkT"},

 {"tipo":"uguale","sinistra":"1 - (Qh*Tc/Th)/Qh","vale":"1 - Tc/Th",
  "ipotesi":{"Qh":"positive","Th":"positive","Tc":"positive"},
  "dove":"01","appare":"1-\\frac{T_c}{T_h}"},

 {"tipo":"uguale","sinistra":"(Qh*Tc/Th)/Qh","vale":"Tc/Th",
  "ipotesi":{"Qh":"positive","Th":"positive","Tc":"positive"},
  "dove":"01","appare":"T_c/T_h"},

 {"tipo":"uguale","sinistra":"-N*k*T*(log(V/N)+(3/2)*log(T)+c) + T*(N*k*(log(V/N)+(3/2)*log(T)+c+3/2))",
  "vale":"(3/2)*N*k*T",
  "ipotesi":{"V":"positive","N":"positive","T":"positive","k":"positive"},
  "dove":"02","appare":"U=F+TS"}
]
CONTROLLO*/

/* ---------------- 00 · PERCHÉ QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Perché questo movimento', meta:'il bersaglio prima del tiro · si legge una volta e ci si torna, non si studia a memoria',
  blocchi:[
  {t:'prosa', title:'A cosa serve una pagina di termodinamica all’inizio di meccanica statistica', tag:'first principles', html:R`
  <p>La meccanica statistica non <i>aggiunge</i> leggi alla termodinamica: <b>le deriva</b>. Parte da $10^{23}$ particelle che obbediscono a Hamilton o a Schrödinger, e pretende di far uscire da lì l&rsquo;entropia, la pressione, il calore specifico — grandezze che nel mondo microscopico non esistono nemmeno come parole.</p>
  <p>Questo significa che <b>il bersaglio va conosciuto prima del tiro</b>. Ogni movimento successivo finisce con un conto di cui bisogna sapere, in anticipo, che cosa deve venire: il canonico deve produrre l&rsquo;energia libera di Helmholtz, il gran canonico il potenziale grande, il gas di Fermi un calore specifico che si annulla a $T\to0$ come deve per il terzo principio. Senza il bersaglio, un conto sbagliato ha lo stesso aspetto di uno giusto.</p>
  <p><b>Questo movimento non è un capitolo di termodinamica</b>, e non va studiato come tale. È l&rsquo;elenco dei conti che gli altri quattordici dovranno far tornare, messo in un posto solo perché non lo si riscriva quindici volte. Si legge una volta, e ci si torna quando serve.</p>`},
  {t:'prosa', title:'Cosa saprai fare, uscendo di qui', tag:'performance attesa', html:R`
  <ul>
  <li>Dire, data una situazione fisica, <b>quale potenziale termodinamico</b> è quello naturale — e quindi quale ensemble conviene.</li>
  <li>Passare da un potenziale all&rsquo;altro con la <b>trasformata di Legendre</b>, senza confondere quali variabili restano indipendenti.</li>
  <li>Estrarre da un potenziale, per sola derivazione, <b>tutta</b> la termodinamica del sistema: entropia, pressione, calore specifico, equazione di stato.</li>
  <li>Riconoscere una <b>relazione di Maxwell</b> per quello che è: il teorema di Schwarz applicato a un potenziale.</li>
  <li>Verificare un risultato di meccanica statistica contro i vincoli che la termodinamica impone <b>prima</b> di qualunque calcolo microscopico: estensività, positività di $C_V$, terzo principio.</li>
  </ul>`},
  {t:'prosa', title:'Il patto sulla notazione', tag:'grammatica', html:R`
  <p>Tre convenzioni che valgono in tutti i quindici movimenti, e che conviene fissare qui perché le fonti non concordano.</p>
  <ul>
  <li><b>$k$</b> è sempre la costante di Boltzmann (altrove $k_B$). Dove serve la costante dei gas si usa $R=N_Ak$.</li>
  <li><b>$\beta=1/kT$</b> compare ovunque al posto di $T$ nei conti: non è pigrizia, è che $\beta$ è la variabile in cui le espressioni sono <b>lineari</b> nell&rsquo;energia, e derivare rispetto a $\beta$ è più corto che derivare rispetto a $T$.</li>
  <li><b>Le grandezze estensive sono maiuscole</b> ($U$, $S$, $V$, $N$), le intensive minuscole o con indice ($T$, $P$, $\mu$). Una grandezza «per particella» si scrive esplicitamente come rapporto — $U/N$, $S/N$ — e non con una lettera nuova, perché è esattamente la forma in cui le prove d&rsquo;esame la chiedono.</li>
  </ul>`}
]},

/* ---------------- 01 · I DUE PRINCIPI ---------------- */
{ num:'01', title:'I due principi, detti come servono qui', meta:'il primo è contabilità dell’energia · il secondo è l’esistenza di una funzione di stato · e cosa questo vincola',
  blocchi:[
  {t:'prosa', title:'Macrostato: cosa si assume di sapere', tag:'grammatica', html:R`
  <p>Un <b>macrostato</b> di equilibrio è individuato da pochissimi numeri — tipicamente $(E,V,N)$, oppure $(T,V,N)$, oppure $(T,V,\mu)$. La scelta non è libera: sono le quantità <b>conservate</b> dalla dinamica microscopica, o quelle che un apparato macroscopico può fissare e controllare. Tutto il resto — dove sta ogni particella, con che impulso — è il <b>microstato</b>, e nessun esperimento macroscopico lo vede.</p>
  <p>Questa asimmetria è l&rsquo;intera materia in una frase: <b>c&rsquo;è un numero enorme di microstati compatibili con lo stesso macrostato</b>, e la termodinamica è ciò che resta quando si guarda solo il macrostato. Ogni volta che nei movimenti successivi comparirà un integrale su tutto lo spazio delle fasi, quello che si sta facendo è contare microstati compatibili con qualcosa che si sa.</p>`},
  {t:'reveal', title:'I due principi, e cosa ciascuno vieta', tag:'derivazione', steps:[
   {label:'Primo principio: contabilità', body:R`<p>$$dU=\delta Q-\delta W,\qquad \delta W=P\,dV \ \text{(caso semplice)}.$$</p>
   <p>$U$ è una <b>funzione di stato</b>: il suo differenziale è esatto, e su un ciclo chiuso l&rsquo;integrale di $dU$ si annulla. $\delta Q$ e $\delta W$ <b>non</b> lo sono — dipendono dal cammino, e per questo si scrivono con $\delta$ e non con $d$. Non è una finezza notazionale: è la ragione per cui «il calore contenuto in un corpo» è una frase priva di senso, mentre «l&rsquo;energia interna di un corpo» ne ha uno.</p>
   <p><b>Cosa vieta:</b> che si produca lavoro dal nulla. È il vincolo che ogni conto statistico soddisfa automaticamente, perché l&rsquo;energia è conservata dall&rsquo;hamiltoniana da cui si parte.</p>`},
   {label:'Secondo principio: esiste S', body:R`<p>Per una trasformazione <b>reversibile</b> esiste una funzione di stato $S$ con
   $$dS=\frac{\delta Q_{\rm rev}}{T},$$
   e per una trasformazione qualunque di un sistema <b>isolato</b> vale $dS\ge0$. Il contenuto forte non è la disuguaglianza: è che $1/T$ sia un <b>fattore integrante</b> — cioè che $\delta Q/T$, a differenza di $\delta Q$, sia un differenziale esatto. È da lì che nasce una funzione di stato dove prima c&rsquo;era solo un cammino.</p>
   <p><b>Cosa vieta:</b> che il calore passi spontaneamente dal freddo al caldo, e che una macchina ciclica fra due sorgenti superi il rendimento di Carnot. Per una macchina reversibile la variazione totale di entropia è nulla, quindi $Q_c/Q_h=T_c/T_h$, e il rendimento è
   $$\eta=1-\frac{Q_c}{Q_h}=1-\frac{T_c}{T_h}.$$
   <b>Questo</b> è il vincolo che la meccanica statistica deve rispettare e non viola mai — perché l&rsquo;$S$ che costruirà sarà, di nuovo, una funzione di stato.</p>`},
   {label:'Terzo principio, in una riga', body:R`<p>$S\to$ costante (convenzionalmente zero) per $T\to0$. Sembra marginale e invece è un <b>controllo potentissimo</b> sui risultati statistici: impone che $C_V\to0$ per $T\to0$. Il gas ideale classico <b>viola</b> questa condizione — il suo $C_V=\tfrac32Nk$ non si annulla mai — e quella violazione non è un errore di conto: è il segnale che a bassa temperatura la descrizione classica è finita. È la stessa crepa del paradosso di Gibbs, vista da un&rsquo;altra parete, e la ripareranno i gas quantistici.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Perché si scrive $\delta Q$ e non $dQ$, e che differenza pratica fa in un conto?`,
    a:R`Perché $Q$ non è una funzione di stato: la stessa coppia di stati iniziale e finale, raggiunta per due cammini diversi, scambia quantità di calore diverse. La differenza pratica è che <b>$\delta Q$ non si può integrare conoscendo solo gli estremi</b>: serve il cammino. $dU$ e $dS$ sì. Ed è per questo che in meccanica statistica si calcolano sempre $U$, $S$, $F$ — mai $Q$: le funzioni di stato sono le uniche che una media d&rsquo;insieme può produrre, perché una media d&rsquo;insieme non conosce nessun cammino.`},
   {q:R`La meccanica statistica «dimostra» il secondo principio?`,
    a:R`<b>No, e la risposta onesta è più interessante del sì.</b> Costruisce un&rsquo;entropia che, per i sistemi macroscopici, cresce con probabilità schiacciante — non con certezza. Le violazioni esistono e sono soppresse come $e^{-N}$: con $N\sim10^{23}$ sono più rare di qualunque evento mai osservato, ma non sono vietate. Il secondo principio passa quindi da <b>legge</b> a <b>enunciato probabilistico sul comportamento dei grandi numeri</b>, e questo è il punto che i movimenti ms-01, ms-02 e ms-05 sviluppano fino in fondo. Chi all&rsquo;orale risponde «sì, si dimostra» ha saltato l&rsquo;unica cosa interessante del corso.`}
  ]}
]},

/* ---------------- 02 · I POTENZIALI E LEGENDRE ---------------- */
{ num:'02', title:'I potenziali termodinamici e la trasformata di Legendre', meta:'un potenziale per ogni scelta di variabili indipendenti · e ciascuno è il prodotto di un ensemble',
  blocchi:[
  {t:'prosa', title:'Il problema che Legendre risolve', tag:'first principles', html:R`
  <p>Da $dU=T\,dS-P\,dV+\mu\,dN$ si legge che le variabili naturali di $U$ sono $(S,V,N)$: sono quelle rispetto a cui basta derivare per ottenere tutto il resto. Ma <b>l&rsquo;entropia non si controlla in laboratorio</b>: si controlla la temperatura, immergendo il sistema in un bagno. Serve una funzione che abbia $T$ fra le variabili naturali al posto di $S$, e che contenga la stessa informazione.</p>
  <p>Questo è esattamente ciò che fa la <b>trasformata di Legendre</b>: sottrarre il prodotto della variabile che si vuole eliminare per la sua coniugata. Con $F=U-TS$,
  $$dF=dU-T\,dS-S\,dT,$$
  e sostituendo $dU$ i due termini in $T\,dS$ si cancellano, lasciando $-S\,dT-P\,dV+\mu\,dN$: $F$ ha variabili naturali $(T,V,N)$. Il ruolo di $S$ e $T$ si è scambiato — dove $U$ dava $T=(\partial U/\partial S)_V$, ora $F$ dà $S=-(\partial F/\partial T)_V$. <b>Nessuna informazione è andata persa</b>, ed è questo il punto della trasformata: si cambia il sistema di coordinate, non il contenuto.</p>`},
  {t:'prosa', title:'I quattro potenziali, e l’ensemble che produce ciascuno', tag:'la tabella da ricordare', html:R`
  <table>
  <tr><th>potenziale</th><th>definizione</th><th>differenziale</th><th>variabili naturali</th><th>lo produce</th></tr>
  <tr><td>energia interna $U$</td><td>—</td><td>$T\,dS-P\,dV+\mu\,dN$</td><td>$S,V,N$</td><td><b>microcanonico</b> (ms-04)</td></tr>
  <tr><td>entalpia $H$</td><td>$U+PV$</td><td>$T\,dS+V\,dP+\mu\,dN$</td><td>$S,P,N$</td><td>— (serve in chimica, non qui)</td></tr>
  <tr><td>energia libera di Helmholtz $F$</td><td>$U-TS$</td><td>$-S\,dT-P\,dV+\mu\,dN$</td><td>$T,V,N$</td><td><b>canonico</b> (ms-06)</td></tr>
  <tr><td>potenziale grande $\Omega$</td><td>$F-\mu N$</td><td>$-S\,dT-P\,dV-N\,d\mu$</td><td>$T,V,\mu$</td><td><b>gran canonico</b> (ms-10)</td></tr>
  </table>
  <p><b>Questa tabella è la mappa del corso.</b> I tre ensemble che si costruiranno non sono tre tecniche alternative per lo stesso calcolo: ciascuno produce naturalmente <b>un</b> potenziale, cioè risponde a una domanda in un particolare sistema di variabili. Sapere quale potenziale serve dice subito quale ensemble usare — ed è la decisione che apre ogni esercizio.</p>
  <div class="note">Per un sistema estensivo vale l&rsquo;identità di Eulero $U=TS-PV+\mu N$, da cui segue $\Omega=-PV$: il potenziale grande <b>è</b> la pressione per il volume, cambiata di segno. È il motivo per cui il gran canonico è la via più corta all&rsquo;equazione di stato di un gas quantistico, e lo si userà in ms-11, ms-12 e ms-13 senza altre premesse.</div>`},
  {t:'reveal', title:'Il gas ideale classico, come banco di prova', tag:'esempio che si riusa', steps:[
   {label:'Da F si estrae tutto', body:R`<p>Anticipando il risultato che ms-06 ricaverà dal microscopico, per il gas ideale monoatomico
   $$F=-NkT\left(\ln\frac{V}{N}+\frac32\ln T+c\right).$$
   Da qui, per sola derivazione:
   $$P=-\left(\frac{\partial F}{\partial V}\right)_{T}=\frac{NkT}{V},\qquad S=-\left(\frac{\partial F}{\partial T}\right)_{V}=Nk\left(\ln\frac{V}{N}+\frac32\ln T+c+\frac32\right).$$
   La prima è <b>l&rsquo;equazione di stato</b>, ottenuta senza mai parlare di urti contro le pareti. La seconda è Sackur&ndash;Tetrode con la costante $c$ non ancora fissata.</p>`},
   {label:'E si torna indietro a U', body:R`<p>Da $U=F+TS$, i due logaritmi si cancellano e resta
   $$U=\tfrac32NkT,$$
   che è l&rsquo;<b>equipartizione</b>: $\tfrac12kT$ per grado di libertà quadratico, tre per particella. Il conto è breve ed è il modello di ogni verifica che si farà: <b>un potenziale, poi solo derivate</b>. Per l&rsquo;entalpia, $H=U+PV=\tfrac32NkT+NkT=\tfrac52NkT$.</p>
   <p>Da notare che $U$ <b>non dipende dal volume</b>: un gas ideale che si espande a temperatura costante non cambia energia interna. È il fatto che rende l&rsquo;espansione libera di Joule un esperimento decisivo, ed è anche il motivo per cui in quell&rsquo;espansione tutta la variazione di entropia è il $Nk\ln(V_f/V_i)$ che si incontrerà nel paradosso di Gibbs.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Perché non si può semplicemente scrivere $U$ in funzione di $T$ invece di passare per $F$?`,
    a:R`Si può <i>scrivere</i>, ma si perde informazione. $U(S,V)$ contiene tutta la termodinamica; $U(T,V)$ no — per ricostruire $S$ da $U(T,V)$ servirebbe integrare $dS=(1/T)(\partial U/\partial T)dT+\dots$, cioè servirebbe una costante che non c&rsquo;è più. <b>La trasformata di Legendre è l&rsquo;unico cambio di variabile che non perde niente</b>: sostituisce $S$ con $T$ <i>e</i> compensa sottraendo $TS$. Sostituire e basta è come ricordare la pendenza di una curva dimenticando dove passa.`},
   {q:R`Un sistema è chiuso in un recipiente rigido a contatto con un termostato. Quale potenziale è minimo all&rsquo;equilibrio, e quale ensemble si usa?`,
    a:R`Fissati $T$, $V$, $N$, all&rsquo;equilibrio è minima l&rsquo;<b>energia libera di Helmholtz</b> $F$ — che è il compromesso fra minimizzare $U$ e massimizzare $S$, pesato da $T$: $F=U-TS$. L&rsquo;ensemble è il <b>canonico</b>, e la sua funzione di partizione darà $F=-kT\ln Z$. A temperatura bassa vince il termine $U$ (ordine), ad alta vince $-TS$ (disordine): in una riga c&rsquo;è tutta la fenomenologia delle transizioni di fase.`}
  ]}
]},

/* ---------------- 03 · LE DERIVATE CHE SI USANO SEMPRE ---------------- */
{ num:'03', title:'Le derivate che si usano sempre', meta:'relazioni di Maxwell = teorema di Schwarz · risposte: $C_V$, $\\kappa_T$ · e i controlli di sanità',
  blocchi:[
  {t:'prosa', title:'Le relazioni di Maxwell non sono da imparare a memoria', tag:'grammatica', html:R`
  <p>Ogni potenziale è una funzione liscia di due variabili, quindi le sue derivate seconde miste commutano (Schwarz). Applicato a $F(T,V)$:
  $$\frac{\partial^{2}F}{\partial V\,\partial T}=\frac{\partial^{2}F}{\partial T\,\partial V} \;\Longrightarrow\; \left(\frac{\partial S}{\partial V}\right)_{T}=\left(\frac{\partial P}{\partial T}\right)_{V},$$
  perché $S=-\partial F/\partial T$ e $P=-\partial F/\partial V$. <b>Questa è una relazione di Maxwell</b>, e le altre tre si ottengono facendo lo stesso su $U$, $H$, $\Omega$. Non c&rsquo;è niente da memorizzare: c&rsquo;è da sapere quali sono le variabili naturali del potenziale e derivare due volte.</p>
  <p>A cosa servono in pratica: a sostituire una derivata <b>impossibile da misurare</b> con una misurabile. $(\partial S/\partial V)_T$ non si misura — nessuno strumento legge l&rsquo;entropia — mentre $(\partial P/\partial T)_V$ è un manometro e un termometro. Sul gas ideale entrambe valgono $Nk/V$, e il conto lo verifica in due righe.</p>`},
  {t:'prosa', title:'Le funzioni di risposta, e cosa la statistica dovrà dire di loro', tag:'il ponte verso ms-08', html:R`
  <p>Le <b>funzioni di risposta</b> misurano quanto una grandezza cambia quando si tira una leva:</p>
  <ul>
  <li><b>calore specifico a volume costante</b> $C_V=\left(\dfrac{\partial U}{\partial T}\right)_{V}$, che per una trasformazione reversibile si riscrive anche nella forma $T\,(\partial S/\partial T)_{V}$. Per il gas ideale monoatomico $C_V=\tfrac32 Nk$, costante — e per questo viola il terzo principio.</li>
  <li><b>compressibilità isoterma</b> $\kappa_T=-\dfrac1V\left(\dfrac{\partial V}{\partial P}\right)_{T}$. Per il gas ideale, da $V=NkT/P$ si ha $\partial V/\partial P=-NkT/P^{2}$ e quindi $\kappa_T=\frac1P$.</li>
  <li><b>coefficiente di dilatazione</b> $\alpha=\dfrac1V\left(\dfrac{\partial V}{\partial T}\right)_{P}$, che per il gas ideale vale $1/T$.</li>
  </ul>
  <p>La termodinamica dice che queste quantità sono <b>positive</b> — sia il calore specifico sia la compressibilità: è la condizione di stabilità dell&rsquo;equilibrio, e un risultato statistico che le facesse venire negative sarebbe sbagliato, o descriverebbe un sistema instabile che sta per separarsi in due fasi.</p>
  <p><b>Ma la meccanica statistica dice qualcosa di più forte, e qui va solo annunciato.</b> Ognuna di queste risposte risulterà uguale a una <b>fluttuazione</b>: $C_V$ alla varianza dell&rsquo;energia, $\kappa_T$ alla varianza del numero di particelle. La positività smetterà di essere un postulato di stabilità e diventerà una banalità — una varianza è un quadrato. È il contenuto di ms-08, ed è il punto in cui la termodinamica cessa di essere il bersaglio e diventa un <i>corollario</i>.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Un conto statistico produce, per un certo sistema, $C_V<0$. Prima di rifare il conto: cosa si può già dire?`,
    a:R`Che <b>o il conto è sbagliato, o il sistema non è in equilibrio stabile</b> — e la seconda possibilità è reale (i sistemi autogravitanti hanno $C_V<0$, e per questo una stella si scalda quando perde energia). In un esercizio d&rsquo;esame su un gas non interagente in un potenziale confinante, però, il sistema <i>è</i> stabile: $C_V<0$ significa errore. È il tipo di controllo che costa cinque secondi e salva un esercizio, e vale la pena farlo prima di consegnare, perché la termodinamica vincola il risultato <b>senza</b> rifare il calcolo.`},
   {q:R`Come si verifica in trenta secondi che una $S$ appena calcolata non è assurda?`,
    a:R`Tre controlli, in ordine di costo. <b>(1) Estensività</b>: raddoppiando $N$ e $V$ insieme, $S$ deve raddoppiare — quindi $V$ deve comparire come $V/N$, mai da solo (è il paradosso di Gibbs). <b>(2) Segno di $\partial S/\partial T$</b>: deve essere positivo, perché il prodotto $T\,\partial S/\partial T$ è il calore specifico, che è positivo. <b>(3) Limite $T\to0$</b>: $S$ deve tendere a una costante; se diverge a $-\infty$ (come fa Sackur&ndash;Tetrode) si è fuori dal dominio di validità classico, e la risposta giusta all&rsquo;orale non è «ho sbagliato» ma «qui serve la statistica quantistica».`}
  ]}
]},

/* ---------------- 04 · IL BERSAGLIO, MOVIMENTO PER MOVIMENTO ---------------- */
{ num:'04', title:'Il bersaglio, movimento per movimento', meta:'cosa ciascuno dei quattordici movimenti dovrà far tornare · da rileggere prima di ognuno',
  blocchi:[
  {t:'prosa', title:'La lista dei debiti che il corso contrae qui', tag:'sintesi operativa', html:R`
  <p>Ogni riga è un conto che un movimento successivo dovrà chiudere. Non sono anticipazioni: sono <b>condizioni di correttezza</b>, e conviene rileggere la riga corrispondente prima di affrontare il movimento.</p>
  <table>
  <tr><th>movimento</th><th>deve far tornare</th></tr>
  <tr><td><b>ms-04</b> microcanonico</td><td>$S=k\ln\Omega$ additiva, e l&rsquo;equipartizione $U=\tfrac32NkT$ per il gas ideale</td></tr>
  <tr><td><b>ms-05</b> entropia</td><td>l&rsquo;estensività di $S$ (paradosso di Gibbs), e $dS\ge0$ come enunciato probabilistico</td></tr>
  <tr><td><b>ms-06</b> canonico</td><td>$F=-kT\ln Z$, e da lì $P=NkT/V$ e Sackur&ndash;Tetrode</td></tr>
  <tr><td><b>ms-08</b> fluttuazioni</td><td>$C_V=\langle\Delta E^{2}\rangle/kT^{2}$, che <b>spiega</b> perché $C_V>0$</td></tr>
  <tr><td><b>ms-10</b> gran canonico</td><td>$\Omega=-kT\ln\Xi$ e l&rsquo;identità $\Omega=-PV$</td></tr>
  <tr><td><b>ms-12</b> gas di Fermi</td><td>$C_V\propto T$ a bassa temperatura: si annulla, come il terzo principio esige</td></tr>
  <tr><td><b>ms-13</b> condensazione</td><td>una transizione di fase, cioè una non-analiticità dei potenziali qui definiti</td></tr>
  <tr><td><b>ms-14</b> corpo nero</td><td>la legge di Stefan&ndash;Boltzmann, e $C_V\propto T^{3}$ per i fononi</td></tr>
  </table>
  <p><b>Il filo.</b> Tre delle otto righe riguardano $C_V$ a bassa temperatura, e non è un caso: <b>il gas ideale classico viola il terzo principio</b>, e tutto il secondo tempo del corso — statistiche quantistiche, Fermi, Bose, fononi — è la riparazione di quella singola violazione. Chi tiene in mente questa frase ha l&rsquo;architettura del corso in una riga, e sa perché il programma ha quella forma.</p>`},
  {t:'prolessi', title:'Dove va, da qui',
   oggetto:R`<b>La termodinamica come vincolo</b>: un insieme di identità fra derivate che qualunque teoria microscopica deve riprodurre, e che si usa per controllare i risultati invece che per ottenerli.`,
   rotte:[
    {dove:'ms-01 · ms-02<br>fondamenti', txt:R`Lo spazio delle fasi, Liouville, l&rsquo;ipotesi ergodica: il ponte fra la dinamica microscopica e le medie d&rsquo;insieme. È la risposta alla domanda «con che diritto si media».`},
    {dove:'ms-04 → ms-10<br>gli ensemble', txt:R`I tre ensemble, ciascuno con il suo potenziale naturale. La tabella della tappa 02 diventa lì un teorema per volta.`},
    {dove:'ms-11 → ms-14<br>quantistico', txt:R`Dove la termodinamica classica si rompe — $C_V$ che non si annulla, entropia che diverge a $T\to0$ — e dove la statistica quantistica la ripara.`},
    {dove:'Meccanica<br>Quantistica', txt:R`Lo stesso semestre, lo stesso cerchio: il punto 16 del programma (corpo nero) è la crisi da cui MQ parte. Chi segue i due corsi insieme arriva al corpo nero due volte, da due direzioni.`}
   ],
   domanda:R`<b>La domanda da tenere aperta mentre si studia il resto.</b> La termodinamica è stata costruita nell&rsquo;Ottocento senza sapere nulla di atomi, e regge. Come può una teoria essere <i>giusta</i> ignorando completamente ciò di cui parla?<br><br>La risposta che il corso costruisce è che la termodinamica è una <b>teoria efficace</b>: descrive ciò che sopravvive alla media su $10^{23}$ gradi di libertà, e ciò che sopravvive dipende pochissimo dai dettagli microscopici. È la stessa ragione per cui l&rsquo;equazione di stato del gas ideale vale per l&rsquo;elio e per l&rsquo;azoto. Tenere la domanda aperta serve a non leggere i quattordici movimenti come una derivazione dal basso soltanto: sono anche la spiegazione di <b>perché il basso non si vede</b>.`}
]}

];

  rows.forEach(function(r){ inner+='<tr><td class="gs">'+r[0]+'</td><td>'+r[1]+'</td></tr>'; });
  inner+='</table>';
  var body=elFromHTML('<div class="gramwrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
/* --- blocco PLOT: la figura non decora, si legge. Ogni plot porta una chiave di lettura. --- */
function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';
  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
    else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
    else if(b.t==='prolessi') m.appendChild(sectionProlessi(b));
    else if(b.t==='reveal')m.appendChild(sectionReveal(b.title,b.tag,b.steps));
    else if(b.t==='esercizio') m.appendChild(sectionEsercizio(b));
    else if(b.t==='collaudo')  m.appendChild(sectionCollaudo(b.title,b.items));
    else if(b.t==='plot')      m.appendChild(sectionPlot(b));
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}

/* deep-link: ms-00-termodinamica.html#03 apre direttamente la tappa 03 */
window.addEventListener('DOMContentLoaded', function(){
  var h=(location.hash||'').replace('#','');
  showTappa(byId[h]?h:'00');
});
window.addEventListener('hashchange', function(){
  var h=(location.hash||'').replace('#','');
  if(byId[h]) showTappa(h);
});
</script>
