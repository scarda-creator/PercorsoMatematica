<style>
  :root{
    --bg:#0e1117; --panel:#161b22; --panel2:#1c232d; --border:#2b333d;

  }
  *{box-sizing:border-box}

    font-size:.9rem;transition:.12s;border:1px solid transparent;}
  .navitem:hover{background:var(--panel2);}
  .navitem.active{background:#13233f;border-color:var(--accent);color:#fff;}
  .navitem .dot{width:7px;height:7px;border-radius:50%;background:transparent;flex:0 0 7px;
    border:1px solid var(--border);}
  .navitem.seen .dot{background:var(--ok);border-color:var(--ok);}
  .navitem .nx{color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto;}

  /* ---- MAIN ---- */
  .main{flex:1 1 auto;min-width:0;padding:24px 30px 90px;max-width:860px;}
  h1{font-size:1.5rem;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:.92rem;margin:0 0 18px;}
  .sfhead{border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:8px;}
  .sfhead h1{font-size:1.55rem;}
  .meta{color:var(--muted);font-size:.82rem;margin-top:6px;}

  .section{margin:26px 0;}
  .section > h3{font-size:1.02rem;color:var(--accent2);margin:0 0 10px;
    display:flex;align-items:center;gap:10px;}
  .section > h3 .tag{font-size:.66rem;font-weight:700;letter-spacing:.4px;background:var(--panel2);
    border:1px solid var(--border);color:var(--muted);padding:2px 8px;border-radius:20px;
    text-transform:uppercase;}
  /* --- blocchi figura --- */
  .section > h3 .tag.plottag{background:#101f2e;border-color:#1f3c57;color:#7ab8e0;}
  .plot-intro{color:var(--muted);font-size:.95rem;margin:0 0 12px;}
  .plot-row{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;
    background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;}
  .plot-row.due .plot-box{flex:1 1 300px;min-width:280px;}
  .plot-box{max-width:560px;}
  .plot-leggi{margin-top:10px;background:var(--panel2);border:1px solid var(--border);
    border-left:3px solid #4a8fc7;border-radius:0 10px 10px 0;padding:11px 14px;
    font-size:.93rem;color:var(--muted);}
  .plot-leggi b{color:#7ab8e0;}
  .plot-err{color:#ff6b6b;font-size:.85rem;}
  .open-body{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
  .open-body p:first-child{margin-top:0;} .open-body p:last-child{margin-bottom:0;}
  .open-body ul{margin:.4em 0;padding-left:1.2em;} .open-body li{margin:.35em 0;}

  .note{background:var(--panel2);border-left:3px solid var(--muted);border-radius:6px;
    padding:9px 12px;margin:12px 0;font-size:.9rem;color:var(--muted);}

  .note.warn{background:var(--warnbg);border-left-color:var(--warn);color:#e0b85a;}
  .note.warn b{color:#f0c25a;}

  /* ---- GRAMMATICA ---- */
  .gramwrap{background:var(--grambg);border:1px solid #1f4d47;border-radius:12px;padding:6px 6px;}
  table.gramtab{border-collapse:collapse;width:100%;font-size:.92rem;}
  table.gramtab td{padding:9px 12px;vertical-align:top;border-bottom:1px solid #17332e;}
  table.gramtab tr:last-child td{border-bottom:none;}
  table.gramtab td.gs{white-space:nowrap;color:var(--gram);width:1%;
    border-right:1px solid #17332e;font-variant-numeric:tabular-nums;}
  .section > h3 .tag.gramtag{background:var(--grambg);border-color:#1f4d47;color:var(--gram);}

  /* ---- STRUMENTI (repertorio condiviso: la scheda si apre DENTRO la frase) ----
     Nessun accento nuovo: riusa il verde della grammatica, perche' uno strumento
     richiamato e' grammatica gia' spiegata altrove, non una quinta specie di blocco. */
  .str{color:var(--gram);border-bottom:1px dashed var(--gram);cursor:pointer;}
  .str:hover{background:var(--grambg);}
  .str::after{content:"\2666";font-size:.62em;vertical-align:.42em;margin-left:2px;opacity:.8;}
  .str.aperto::after{content:"\2715";}
  .str.rotto{color:#ff6b6b;border-bottom-color:#ff6b6b;cursor:help;}
  /* la scheda e' uno SPAN in display:block, non un div: i rimandi cadono dentro

  .strcard{display:block;margin:10px 0;background:var(--grambg);border:1px solid #1f4d47;

  .strcard .sh{display:block;font-size:.66rem;font-weight:700;letter-spacing:.5px;

  .strcard .sk{color:var(--gram);font-weight:600;}

  table.protab td.pd{white-space:nowrap;color:var(--pro);width:1%;font-weight:700;font-size:.78rem;

  .pro-domanda{margin:8px 8px 2px;background:#140d26;border:1px solid var(--proedge);

  .testo{background:#13233f;border:1px solid #2b4877;border-radius:12px;padding:14px 18px;margin-bottom:14px;}

  .reveal-btn.small:hover:not(:disabled){border-color:var(--accent);}

  /* ---- COLLAUDO ---- */
  .collaudo-item{background:var(--panel);border:1px solid var(--border);border-radius:12px;

  .cq{margin-bottom:10px;}
  .ca{margin-top:12px;background:var(--okbg);border:1px solid #235c33;border-radius:8px;
    padding:10px 14px;font-size:.94rem;}

  /* ---- PREV / NEXT ---- */

  .pnbtn{flex:1 1 0;background:var(--panel);border:1px solid var(--border);border-radius:12px;

  .pnbtn:hover{border-color:var(--accent);background:var(--panel2);}
  .pnbtn.next{text-align:right;}
  .pnbtn .k{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .pnbtn .t{font-weight:600;color:var(--accent2);}
  .pnbtn:disabled{opacity:.35;cursor:default;border-color:var(--border);background:var(--panel);}

  code{background:var(--panel2);border:1px solid var(--border);border-radius:5px;
    padding:1px 5px;font-size:.85em;color:var(--accent2);}
  .katex{font-size:1.02em;color:var(--txt);} .katex-display{margin:.5em 0;overflow-x:auto;overflow-y:hidden;}

  @media(max-width:860px){
    .shell{flex-direction:column;}
    .sidebar{width:100%;flex:none;position:static;max-height:none;border-right:none;

    .sidebar h2{width:100%;} .navitem{width:auto;}
    .main{padding:20px 16px 80px;}
  }

/* ===================================================================

   =================================================================== */
var CORSO = 'meccanica-statistica';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["teorema-di-schwarz"] = {"nome":"Teorema di Schwarz","riga":"Se le derivate seconde miste di $f$ esistono e sono continue, allora non dipendono dall'ordine: $\\partial_x\\partial_y f=\\partial_y\\partial_x f$.","serve":"È l'ipotesi silenziosa di metà dei conti: ogni volta che si scambia l'ordine di due derivate — nel rotore di un gradiente, nelle relazioni di Maxwell della termodinamica, nella cancellazione dei termini secondi in una parentesi di Lie — si sta usando Schwarz senza nominarlo. Vale la pena sapere che è un teorema e non una regola di calcolo, perché **è falso senza la continuità**: esistono funzioni con entrambe le derivate miste definite ovunque e diverse in un punto. In pratica tutto ciò che si incontra è $C^{\\infty}$ e il teorema si applica sempre; il caso in cui conta davvero è quello inverso, quando l'asimmetria di un'espressione rispetto allo scambio di due derivate è il segnale che l'oggetto non è un gradiente e che lì c'è della geometria.","esempio":"Con $f(x,y)=x^{2}y^{3}$ si deriva prima in $y$, ottenendo $3x^{2}y^{2}$, e poi in $x$, ottenendo $6xy^{2}$. Nell'ordine opposto si deriva prima in $x$, ottenendo $2xy^{3}$, e poi in $y$: di nuovo $6xy^{2}$. I due cammini passano per espressioni diverse e arrivano allo stesso posto, ed è questo il contenuto del teorema — non che i passaggi intermedi si somiglino, ma che l'arrivo coincida. Il controesempio classico, che mostra dove sta il confine, è $g(x,y)=xy\\frac{x^{2}-y^{2}}{x^{2}+y^{2}}$ prolungata con $g(0,0)=0$: le due derivate miste nell'origine valgono $-1$ e $+1$, perché le derivate seconde esistono ma non sono continue lì.","debito":"la dimostrazione (via teorema del valor medio applicato due volte al rapporto incrementale doppio) sta in ogni corso di Analisi 2 e non è riportata; qui c'è l'enunciato e il confine.","controllo":[{"tipo":"derivata","espr":"x**2*y**3","rispetto":["y"],"vale":"3*x**2*y**2","ipotesi":{"x":"real","y":"real"},"dove":"esempio","appare":"3x^{2}y^{2}"},{"tipo":"derivata","espr":"x**2*y**3","rispetto":["y","x"],"vale":"6*x*y**2","ipotesi":{"x":"real","y":"real"},"dove":"esempio","appare":"6xy^{2}"},{"tipo":"derivata","espr":"x**2*y**3","rispetto":["x"],"vale":"2*x*y**3","ipotesi":{"x":"real","y":"real"},"dove":"esempio","appare":"2xy^{3}"}]};
STRUM["cambio-di-variabile"] = {"nome":"Cambio di variabile in una densità","riga":"Una densità non si trasforma sostituendo ma porta il jacobiano: se $y=f(x)$ allora $p_Y(y)=\\sum_i p_X(x_i)\\,/\\,|f'(x_i)|$, sommato su tutti i rami $x_i$ con $f(x_i)=y$.","serve":"È l'unico punto in cui una densità si comporta diversamente da una funzione, ed è l'errore che si ripete. Ciò che è invariante è la probabilità dell'evento, $p_Y(y)|dy|=p_X(x)|dx|$: la densità no, perché è una probabilità per unità di qualcosa, e passando da $x$ a $y$ quell'unità si dilata o si comprime. Scrivere $p_Y(y)=p_X(x(y))$ e basta è attraente e sbagliato. Si scova senza rifare il conto con due prove da cinque secondi: la normalizzazione non torna, e le dimensioni restano quelle della variabile di partenza.","esempio":"Una particella uniforme su un disco di raggio $R$: $p(x,y)=1/(\\pi R^2)$. Passando alla sola distanza dal centro, il jacobiano è l'elemento d'area radiale $2\\pi r$, e resta $p(r)=2r/R^2$ su $[0,R]$, che infatti si normalizza a $1$. Il valor medio è $\\langle r\\rangle=2R/3$ — non $R/2$, che è la risposta di chi tratta $r$ come uniforme. La differenza fra i due numeri è esattamente il fattore $r$, cioè il fatto che lontano dal centro c'è più area.","pieno":{"file":"ms-03-probabilita.html","tappa":"01","come":"la regola dedotta dall'invarianza della probabilità, i rami molteplici e il caso radiale, nel movimento ms-03 di Meccanica Statistica"},"qui":{"meccanica-statistica":{"serve":"È metà della domanda più frequente dello scritto: «calcolare la densità di probabilità dell'energia di singola particella», «la densità di particelle $\\rho(r)$». L'altra metà è la marginalizzazione. Le scritture $d^2r=2\\pi r\\,dr$ e $d^3r=4\\pi r^2dr$ non sono formule da ricordare: sono questo cambio di variabile con gli angoli già integrati, e saperlo deducere è ciò che salva quando la simmetria è cilindrica invece che sferica. Attenzione al doppio jacobiano: $p(r)$ è una densità rispetto a $r$, $\\rho(r)$ è una densità per unità di volume, e fra le due ce n'è un altro.","esempio":"L'energia cinetica in due dimensioni. La misura radiale nel piano degli impulsi è la derivata dell'area del disco, $2\\pi p$; la sostituzione $\\varepsilon=p^2/2m$ ha $d\\varepsilon/dp=p/m$, e il jacobiano cancella esattamente il fattore $p$. Per questo in $d=2$ la densità dell'energia è l'esponenziale pura $\\beta e^{-\\beta\\varepsilon}$, senza prefattore, mentre in $d=3$ resta un $\\sqrt{\\varepsilon}$. Da quel solo fattore dipendono tutte le differenze qualitative fra i gas quantistici in dimensioni diverse."}},"controllo":[{"tipo":"integrale","espr":"2*r/R**2","var":"r","da":"0","a":"R","vale":"1","ipotesi":{"r":"positive","R":"positive"},"dove":"esempio","appare":"p(r)=2r/R^2"},{"tipo":"integrale","espr":"r*2*r/R**2","var":"r","da":"0","a":"R","vale":"2*R/3","ipotesi":{"r":"positive","R":"positive"},"dove":"esempio","appare":"2R/3"},{"tipo":"derivata","espr":"pi*p**2","rispetto":["p"],"vale":"2*pi*p","ipotesi":{"p":"positive"},"dove":"qui.meccanica-statistica.esempio","appare":"2\\pi p"},{"tipo":"derivata","espr":"p**2/(2*m)","rispetto":["p"],"vale":"p/m","ipotesi":{"p":"positive","m":"positive"},"dove":"qui.meccanica-statistica.esempio","appare":"p/m"},{"tipo":"integrale","espr":"b*exp(-b*e)","var":"e","da":"0","a":"oo","vale":"1","ipotesi":{"b":"positive","e":"positive"},"dove":"qui.meccanica-statistica.esempio","appare":"\\beta e^{-\\beta\\varepsilon}"}]};
STRUM["derivazione"] = {"nome":"Derivazione (regola di Leibniz)","riga":"Un operatore lineare $D$ su un'algebra che rispetta la regola del prodotto: $D(fg)=f\\,D(g)+g\\,D(f)$. È la proprietà che isola «derivare» fra tutti gli operatori lineari possibili.","serve":"È il modo algebrico di definire la derivata senza limiti, e serve ogni volta che si vuole derivare su un oggetto dove non c'è un rapporto incrementale da fare — su una varietà astratta, su un'algebra di matrici, su un anello di polinomi. La conseguenza operativa più usata è che **una derivazione è determinata dai suoi valori sui generatori**: su $\\mathbb{R}^{n}$ basta sapere quanto vale sulle coordinate $x^{1},\\dots,x^{n}$, e da lì Leibniz e la linearità danno tutto il resto. È il motivo per cui un vettore tangente, definito come derivazione, si scrive sempre come combinazione delle $\\partial/\\partial x^{i}$: non perché lo si sia scelto, ma perché non c'è altro. Un secondo fatto, che si dimostra in due righe e si usa continuamente: la **composizione** di due derivazioni non è una derivazione (compaiono derivate seconde), ma la loro **differenza incrociata** $DE-ED$ lo è, perché i termini secondi si cancellano a coppie.","esempio":"Su $\\mathbb{R}$, l'operatore $d/dx$ verificato sul prodotto $f=x^{2}$ e $g=x^{3}$: la regola dice $x^{2}\\cdot3x^{2}+x^{3}\\cdot2x$, cioè $5x^{4}$, e la derivata diretta di $x^{5}$ dà lo stesso $5x^{4}$. Il conto è banale ed è il punto: Leibniz non aggiunge informazione su $\\mathbb{R}$, dove la derivata si sa già fare. Aggiunge informazione quando è l'unica cosa che si ha — per esempio sull'algebra delle matrici, dove $D(A)=MA-AM$ per una matrice fissata $M$ è una derivazione, e la verifica di Leibniz consiste nello sviluppare $M(AB)-(AB)M$ e riconoscerlo come somma di $A\\,D(B)$ e $D(A)\\,B$, cosa che riesce perché i due termini $AMB$ introdotti dallo sviluppo compaiono con segni opposti e si cancellano.","debito":"che le derivazioni in un punto di una varietà siano esattamente i vettori tangenti è il teorema di gd-06 e non si ripete qui; il caso delle algebre non commutative è citato come esempio e non sviluppato.","controllo":[{"tipo":"uguale","sinistra":"x**2*3*x**2+x**3*2*x","vale":"5*x**4","ipotesi":{"x":"real"},"dove":"esempio","appare":"5x^{4}"},{"tipo":"derivata","espr":"x**5","rispetto":["x"],"vale":"5*x**4","ipotesi":{"x":"real"},"dove":"esempio","appare":"derivata diretta di $x^{5}$"}]};
STRUM["trasformata-di-legendre"] = {"nome":"Trasformata di Legendre","riga":"Scambia una variabile con la sua derivata coniugata: da $f(x)$ si passa a $g(p)=f(x)-px$ con $p=df/dx$, e $dg=-x\\,dp$.","serve":"Serve quando la variabile naturale di una funzione non e' quella che si controlla in laboratorio. La trasformata non perde informazione — da $g$ si torna a $f$ — e cambia solo quale variabile e' indipendente. E' l'operazione che genera tutti i potenziali termodinamici l'uno dall'altro, e la stessa che porta dalla lagrangiana all'hamiltoniana.","esempio":"Con $f(x)=x^{2}$: $p=2x$, $x=p/2$, $g=x^{2}-px=p^{2}/4-p^{2}/2=-p^{2}/4$. Il segno negativo non e' un errore: per $f$ convessa la trasformata e' concava, e applicandola due volte si torna a $f$.","pieno":null,"qui":{"meccanica-statistica":{"serve":"E' il ponte fra gli ensemble. Il passaggio da microcanonico a canonico non e' solo un cambio di racconto — energia fissata contro temperatura fissata — e' una trasformata di Legendre dell'entropia, e questo spiega perche' i due ensemble danno gli stessi risultati all'equilibrio: la trasformata e' invertibile.","esempio":"Da $S(E)$ con $1/T=\\partial S/\\partial E$ si passa all'energia libera $F=E-TS$, funzione di $T$ invece che di $E$, con $dF=-S\\,dT-p\\,dV$. Lo stesso schema porta da $F$ al gran potenziale $\\Omega=F-\\mu N$ scambiando $N$ con $\\mu$: e' sempre la stessa operazione, applicata a una coppia coniugata diversa."}}};

function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';
  return h;
}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

/* ---------------- 00 · PERCHÉ QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Perché questo movimento', meta:'il bersaglio prima del tiro · si legge una volta e ci si torna, non si studia a memoria',
  blocchi:[
  {t:'prosa', title:'A cosa serve una pagina di termodinamica all’inizio di meccanica statistica', tag:'first principles', html:R`
  <p>La meccanica statistica non <i>aggiunge</i> leggi alla termodinamica: <b>le deriva</b>. Parte da $10^{23}$ particelle che obbediscono a Hamilton o a Schrödinger, e pretende di far uscire da lì l&rsquo;entropia, la pressione, il calore specifico — grandezze che nel mondo microscopico non esistono nemmeno come parole.</p>
  <p>Questo significa che <b>il bersaglio va conosciuto prima del tiro</b>. Ogni movimento successivo finisce con un conto di cui bisogna sapere, in anticipo, che cosa deve venire: il canonico deve produrre l&rsquo;energia libera di Helmholtz, il gran canonico il potenziale grande, il gas di Fermi un calore specifico che si annulla a $T\to0$ come deve per il terzo principio. Senza il bersaglio, un conto sbagliato ha lo stesso aspetto di uno giusto.</p>
  <p><b>Questo movimento non è un capitolo di termodinamica</b>, e non va studiato come tale. È l&rsquo;elenco dei conti che gli altri quattordici dovranno far tornare, messo in un posto solo perché non lo si riscriva quindici volte. Si legge una volta, e ci si torna quando serve.</p>
  <p>Una parola sul <b>livello</b>, perché decide come è scritto tutto il resto. Il capitolo di ripasso delle note di Sciortino dichiara in testa di seguire <i>Statistical Mechanics</i> di Huang, e quella dichiarazione è il metro: la termodinamica qui non è rifondata, è <b>ripresa come teoria fenomenologica i cui assiomi vengono dagli esperimenti</b>, con le conseguenze matematiche tirate fino in fondo. Sciortino lo dice esplicitamente e vale la pena leggerlo per intero, perché fissa l&rsquo;atteggiamento: le tre leggi «a prima vista sembrano semplici e ingenue, ma sono invece enormemente restrittive». Tutto questo movimento è il tentativo di far vedere <i>quanto</i> restrittive.</p>`},
  {t:'prosa', title:'Cosa saprai fare, uscendo di qui', tag:'performance attesa', html:R`
  <ul>
  <li>Dire, data una situazione fisica, <b>quale potenziale termodinamico</b> è quello naturale — e quindi quale ensemble conviene.</li>
  <li>Passare da un potenziale all&rsquo;altro con la <b>trasformata di Legendre</b>, sapendo <i>perché</i> non perde informazione e non solo come si scrive.</li>
  <li>Estrarre da un potenziale, per sola derivazione, <b>tutta</b> la termodinamica del sistema: entropia, pressione, calore specifico, equazione di stato.</li>
  <li>Riconoscere una <b>relazione di Maxwell</b> per quello che è: il teorema di Schwarz applicato a un potenziale — e ricostruirla, invece di ricordarla.</li>
  <li>Ricavare il <b>terzo principio nella forma che serve</b>: non «$S\to0$», ma «$C\to0$, e anche $\alpha\to0$», con la dimostrazione in quattro righe.</li>
  <li>Usare le <b>chain relations</b> fra derivate parziali per trasformare una derivata scomoda in una misurabile, e ottenere identità come $C_P-C_V=TV\alpha^{2}/K_T$.</li>
  <li>Verificare un risultato di meccanica statistica contro i vincoli che la termodinamica impone <b>prima</b> di qualunque calcolo microscopico: estensività, positività di $C_V$, terzo principio.</li>
  </ul>`},
  {t:'prosa', title:'Il patto sulla notazione', tag:'grammatica', html:R`
  <p>Quattro convenzioni che valgono in tutti i quindici movimenti, e che conviene fissare qui perché le fonti non concordano.</p>
  <ul>
  <li><b>$k$</b> è sempre la costante di Boltzmann (altrove $k_B$). Dove serve la costante dei gas si usa $R=N_Ak$; in unità CGS, come le usa Sciortino, $k=1{,}38\times10^{-16}$ erg/grado e $R=8{,}315$ J/grado.</li>
  <li><b>$\beta=1/kT$</b> compare ovunque al posto di $T$ nei conti: non è pigrizia, è che $\beta$ è la variabile in cui le espressioni sono <b>lineari</b> nell&rsquo;energia, e derivare rispetto a $\beta$ è più corto che derivare rispetto a $T$.</li>
  <li><b>Le grandezze estensive sono maiuscole</b> ($U$, $S$, $V$, $N$), le intensive minuscole o con indice ($T$, $P$, $\mu$). Una grandezza «per particella» si scrive esplicitamente come rapporto — $U/N$, $S/N$ — e non con una lettera nuova, perché è esattamente la forma in cui le prove d&rsquo;esame la chiedono.</li>
  <li><b>$F$ è l&rsquo;energia libera di Helmholtz</b>, non $A$. È un disaccordo reale fra le fonti: Sciortino, che segue Huang, scrive $A(V,T)=U-TS$; Crisanti e Grilli-Giardina scrivono $F$. Qui si usa $F$ perché è la lettera che compare nelle prove d&rsquo;esame — ma leggendo le note del docente si incontra $A$, ed è lo stesso oggetto.</li>
  </ul>`}
]},

/* ---------------- 01 · IL VOCABOLARIO, E LA SUPERFICIE DI STATO ---------------- */
{ num:'01', title:'Il vocabolario operativo, e la superficie di stato', meta:'stato ed equilibrio · quasi-statico non è reversibile · estensivo e intensivo · e la superficie su cui tutto vive',
  blocchi:[
  {t:'prosa', title:'Che cosa si assume di sapere: macrostato e microstato', tag:'grammatica', html:R`
  <p>Un <b>sistema termodinamico</b> è qualunque sistema macroscopico; i suoi <b>parametri termodinamici</b> sono le grandezze macroscopiche misurabili — pressione $P$, volume $V$, temperatura $T$, campo magnetico $H$ — e Sciortino insiste su una parola che è facile leggere distrattamente: sono <b>definiti sperimentalmente</b>. Non sono derivati da niente: sono ciò che un apparato legge. Uno <b>stato termodinamico</b> è specificato da tutti i valori dei parametri necessari, e l&rsquo;<b>equilibrio</b> è la condizione in cui lo stato non cambia nel tempo. Per convenzione, in termodinamica «stato» significa «stato di equilibrio» se non si dice altro.</p>
  <p>Un <b>macrostato</b> di equilibrio è dunque individuato da pochissimi numeri — tipicamente $(E,V,N)$, oppure $(T,V,N)$, oppure $(T,V,\mu)$. La scelta non è libera: sono le quantità <b>conservate</b> dalla dinamica microscopica, o quelle che un apparato macroscopico può fissare e controllare. Tutto il resto — dove sta ogni particella, con che impulso — è il <b>microstato</b>, e nessun esperimento macroscopico lo vede.</p>
  <p>Questa asimmetria è l&rsquo;intera materia in una frase: <b>c&rsquo;è un numero enorme di microstati compatibili con lo stesso macrostato</b>, e la termodinamica è ciò che resta quando si guarda solo il macrostato. Ogni volta che nei movimenti successivi comparirà un integrale su tutto lo spazio delle fasi, quello che si sta facendo è contare microstati compatibili con qualcosa che si sa.</p>`},
  {t:'prosa', title:'L’equazione di stato è una superficie, e il piano P-V ne è l’ombra', tag:'la geometria che regge tutto', html:R`
  <p>L&rsquo;<b>equazione di stato</b> è una relazione funzionale fra i parametri termodinamici all&rsquo;equilibrio,
  $$f(P,V,T)=0,$$
  e il suo effetto è <b>ridurre da tre a due il numero di variabili indipendenti</b>. Geometricamente: se si rappresenta lo stato come un punto nello spazio tridimensionale $P$-$V$-$T$, l&rsquo;equazione di stato definisce una <b>superficie</b>, e ogni punto su quella superficie è uno stato di equilibrio. I punti fuori non sono stati: non esistono.</p>
  <p>Da qui segue il significato esatto del <b>diagramma $P$-$V$</b>, che si usa continuamente senza pensarci: è la <b>proiezione</b> di quella superficie sul piano $P$-$V$. Ogni punto del diagramma è uno stato di equilibrio; una trasformazione reversibile è un <b>percorso continuo</b> sul diagramma, e i percorsi con nome — isoterme, adiabatiche, isocore — sono famiglie particolari di cammini su quella superficie. Una trasformazione <i>non</i> reversibile, invece, <b>non si può rappresentare in modo continuo</b> nello spazio $P$-$V$-$T$, perché i suoi stati intermedi non sono stati di equilibrio e quindi non stanno sulla superficie. Questo chiude una confusione ricorrente: quando si disegna una freccia tratteggiata per un&rsquo;espansione libera, quella freccia non è un cammino — è solo un promemoria dei due estremi.</p>`},
  {t:'plot', title:'La superficie di stato del gas ideale, e le sue isoterme',
   intro:'A sinistra la superficie $P=NkT/V$ nello spazio delle variabili: ruotala trascinando. A destra la stessa superficie vista dall’alto, cioè le curve di livello di $T$ nel piano $V$-$P$ — che sono le isoterme del diagramma $P$-$V$.',
   plots:[
    {kind:'surface3d', f:'1.0*y/(x+0.08)', xr:[0.25,3], yr:[0.3,3], n:40, title:'P = NkT/V  (asse x: V, asse y: T)'},
    {kind:'contour', f:'x*y', xr:[0.25,3], yr:[0.1,3.2], levels:[0.3,0.6,1.0,1.5,2.1], title:'isoterme: PV = NkT costante (x: V, y: P)'}
   ],
   leggi:R`<p><b>La superficie è l&rsquo;equazione di stato</b>, e il fatto che sia una superficie — non un volume — è il contenuto: fissati due parametri il terzo è determinato. Ruotandola si vede che non c&rsquo;è nessuna direzione privilegiata fra $P$, $V$ e $T$: la scelta di quali due tenere come indipendenti è nostra, non della fisica. È esattamente la libertà che la trasformata di Legendre organizzerà nella tappa 05.</p>
   <p><b>A destra, la stessa superficie proiettata</b>: ogni curva è un&rsquo;isoterma $PV=$ costante, e il diagramma $P$-$V$ che si disegna in ogni esercizio è questo. Si legge subito perché un&rsquo;isoterma è un&rsquo;iperbole e perché le isoterme non si incrociano mai — se si incrociassero, in quel punto lo stesso $(P,V)$ avrebbe due temperature, e l&rsquo;equazione di stato non sarebbe una funzione.</p>
   <p><b>E si vede il limite del disegno.</b> Un&rsquo;espansione libera di Joule porta il gas da un punto a un altro di questa superficie, ma <i>non lungo una curva tracciata su di essa</i>: durante l&rsquo;espansione il gas non è in equilibrio, non ha una pressione sola, e quindi non ha un punto. Le due estremità stanno sulla superficie, il tragitto non c&rsquo;è. Tenere questa immagine davanti agli occhi è il modo di non scrivere mai $\int P\,dV$ per una trasformazione irreversibile.</p>`},
  {t:'reveal', title:'Quasi-statico, reversibile, adiabatico: tre parole che non sono sinonimi', tag:'le distinzioni che l’esame usa', steps:[
   {label:'Quasi-statico', body:R`<p>Una trasformazione è <b>quasi-statica</b> se le condizioni esterne cambiano così lentamente che <i>in ogni istante</i> il sistema è approssimativamente all&rsquo;equilibrio. È una condizione sulla <b>velocità</b>: si confronta il tempo in cui si muove il pistone con il tempo che il gas impiega a riequilibrarsi.</p>`},
   {label:'Reversibile — e perché è di più', body:R`<p>Una trasformazione è <b>reversibile</b> se <i>può ripercorrere la sua storia</i>: invertendo il verso, sistema e ambiente tornano entrambi negli stati di partenza. Vale l&rsquo;implicazione in un verso solo — <b>reversibile $\Rightarrow$ quasi-statico</b> — e l&rsquo;inversa è falsa. Il controesempio è quello di Sciortino, e vale la pena tenerlo a mente perché è sorprendente: <b>un gas che si espande liberamente in elementi di volume infinitesimi successivi</b> — si apre un rubinetto per volta, ogni volta su un volumetto minuscolo — compie una trasformazione <i>quasi-statica</i>, perché a ogni passo il gas si riequilibra, <b>ma non reversibile</b>, perché nulla di ciò che è avvenuto si può disfare: non c&rsquo;è nessun modo di far rientrare il gas nel volumetto senza spendere lavoro dall&rsquo;esterno.</p>
   <p><b>Perché la distinzione conta in un conto.</b> La formula $dS=\delta Q/T$ vale <i>solo</i> per una trasformazione reversibile. Per l&rsquo;espansione libera quasi-statica $\delta Q=0$ a ogni passo, quindi chi applicasse quella formula concluderebbe $\Delta S=0$ — e sbaglierebbe, perché l&rsquo;entropia aumenta. Il modo corretto è quello della tappa 02: si calcola $\Delta S$ lungo un cammino <i>reversibile qualunque</i> fra gli stessi estremi, e si sfrutta che $S$ è funzione di stato.</p>`},
   {label:'Adiabatico, e il serbatoio', body:R`<p>Un sistema è <b>isolato termicamente</b> se non può scambiare calore con l&rsquo;esterno: lo si ottiene confinandolo con un <b>muro adiabatico</b>, e si chiama <b>adiabatica</b> qualunque trasformazione compiuta senza violare quell&rsquo;isolamento. Il concetto duale è il <b>serbatoio di calore</b> (o bagno, o termostato): un sistema talmente grande che cedere o assorbire una quantità <i>finita</i> di calore non ne cambia la temperatura.</p>
   <p>Questi due oggetti sono, in anticipo, i due ensembles del corso: il sistema col muro adiabatico e l&rsquo;energia fissata è il <b>microcanonico</b>; il sistema a contatto con il serbatoio è il <b>canonico</b>. Che siano introdotti qui come accessori di laboratorio e ricompaiano là come strutture matematiche non è una coincidenza: la scelta dell&rsquo;ensemble è la descrizione matematica di come il sistema è tenuto in mano.</p>`}
  ]},
  {t:'prosa', title:'Estensivo e intensivo, scritto in modo che si possa controllare', tag:'il controllo più economico che esista', html:R`
  <p>Una grandezza è <b>estensiva</b> se è proporzionale alla quantità di sostanza, <b>intensiva</b> se ne è indipendente. Detto così è una definizione che non si può usare per controllare niente. Sciortino la scrive invece in una forma <i>operativa</i>, e conviene adottarla: se $Q$ è estensiva allora si può sempre scrivere
  $$Q=N\,q\!\left(P,\frac{N}{V},T\right),$$
  mentre se è intensiva si scrive
  $$Q=q'\!\left(P,\frac{N}{V},T\right).$$
  <b>La forma dice tutto</b>: la dipendenza da $N$ e $V$ può entrare solo attraverso la <i>densità</i> $N/V$, più un fattore $N$ davanti nel caso estensivo. Nient&rsquo;altro è ammesso.</p>
  <p>Questo è il controllo più economico di tutto il corso, e va usato ogni volta. Un&rsquo;entropia che contenga $\ln V$ <b>da solo</b> — e non $\ln(V/N)$ — viola quella forma, e quindi non è estensiva: è il <b>paradosso di Gibbs</b>, riconosciuto in due secondi guardando la forma invece di rifare il conto. Il fatto che le grandezze termodinamiche si dividano così bene fra estensive e intensive, dice Sciortino, è «un fatto empirico importante» — cioè non un teorema: vale perché le forze molecolari sono a corto raggio, e cade per un sistema autogravitante, dove l&rsquo;energia di due parti accostate non è la somma delle energie.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Un&rsquo;espansione libera quasi-statica ha $\delta Q=0$ a ogni passo. Perché $\Delta S>0$?`,
    a:R`Perché $dS=\delta Q/T$ vale <b>solo per trasformazioni reversibili</b>, e quella non lo è. Il calcolo corretto usa il fatto che $S$ è funzione di stato: si sceglie un cammino <i>reversibile</i> qualunque fra gli stessi stati iniziale e finale — per il gas ideale, un&rsquo;espansione isoterma reversibile da $V_1$ a $V_2$ — e lungo quello si integra. Viene $\Delta S=Nk\ln(V_2/V_1)>0$. <b>La morale operativa</b>: l&rsquo;irreversibilità non si vede nel $\delta Q$, si vede nel confronto fra il $\Delta S$ calcolato su un cammino reversibile e lo zero scambiato in realtà.`},
   {q:R`Perché una trasformazione irreversibile non si può disegnare nel piano $P$-$V$?`,
    a:R`Perché ogni punto del piano $P$-$V$ è per costruzione uno <b>stato di equilibrio</b> — è la proiezione della superficie $f(P,V,T)=0$ — e durante una trasformazione irreversibile il sistema <i>non è</i> all&rsquo;equilibrio: non ha una pressione unica né una temperatura unica, quindi non ha un punto. Si possono disegnare gli estremi, non il cammino. <b>Conseguenza in un esercizio:</b> $W=\int P\,dV$ richiede che $P$ sia definita lungo il percorso, e quindi vale solo per trasformazioni quasi-statiche; per un&rsquo;espansione libera il lavoro si calcola dalla fisica del problema (è zero contro il vuoto), non dall&rsquo;integrale.`}
  ]}
]},

/* ---------------- 02 · I DUE PRINCIPI ---------------- */
{ num:'02', title:'I primi due principi, detti come servono qui', meta:'il primo è esattezza di un differenziale · il secondo è Kelvin, Clausius, e una funzione di stato che nasce da una disuguaglianza',
  blocchi:[
  {t:'reveal', title:'Il primo principio: non «l’energia si conserva», ma «$dU$ è esatto»', tag:'derivazione', steps:[
   {label:'L’enunciato, e cosa definisce', body:R`<p>In una trasformazione arbitraria, sia $\Delta Q$ il calore netto assorbito dal sistema e $\Delta W$ il lavoro netto svolto <i>dal</i> sistema. Il primo principio afferma che la quantità
   $$\Delta U=\Delta Q-\Delta W$$
   <b>è la stessa per tutte le trasformazioni</b> che portano da un dato stato iniziale a un dato stato finale. Letto così, il principio non è un&rsquo;affermazione sulla conservazione: è l&rsquo;affermazione che <b>esiste una funzione di stato</b> $U$, l&rsquo;energia interna, definita a meno di una costante additiva (si fissa uno stato di riferimento arbitrario e si misura $\Delta Q-\Delta W$ per arrivarci).</p>
   <p>Il fondamento sperimentale è l&rsquo;esperimento di Joule sull&rsquo;equivalenza fra calore ed energia meccanica; che $U$ sia <b>estensiva</b> è a sua volta un fatto empirico, che discende dal corto raggio delle forze molecolari — raddoppiando la massa raddoppia l&rsquo;energia.</p>`},
   {label:'In forma infinitesima, e la condizione di Schwarz', body:R`<p>$$dU=\delta Q-\delta W,\qquad \delta W=P\,dV\ \text{(caso semplice)},$$
   e il contenuto è che <b>$dU$ è un differenziale esatto</b>: $\int dU$ non dipende dal cammino. Questa proprietà non è condivisa da $\delta Q$ né da $\delta W$, e per questo si scrivono con $\delta$: «il calore contenuto in un corpo» è una frase priva di senso, «l&rsquo;energia interna di un corpo» ne ha uno.</p>
   <p>Vale la pena scrivere per esteso cosa significa «esatto», perché è la macchina che genera <i>tutte</i> le relazioni di Maxwell. Dato un differenziale $df=g(A,B)\,dA+h(A,B)\,dB$, la condizione di esattezza è
   $$\frac{\partial g}{\partial B}=\frac{\partial h}{\partial A}.$$
   Applicandola a $U=U(P,V)$, da $dU=(\partial U/\partial P)_V\,dP+(\partial U/\partial V)_P\,dV$ segue
   $$\frac{\partial}{\partial V}\!\left(\frac{\partial U}{\partial P}\right)_{V}=\frac{\partial}{\partial P}\!\left(\frac{\partial U}{\partial V}\right)_{P},$$
   che è il <span class="str" data-str="teorema-di-schwarz">teorema di Schwarz</span>. <b>Tutte le relazioni di Maxwell della tappa 07 sono questa singola identità</b>, scritta per i quattro potenziali invece che per $U(P,V)$: non c&rsquo;è niente di nuovo da imparare, solo da applicare.</p>`},
   {label:'Cosa vieta', body:R`<p>Che si produca lavoro dal nulla. È il vincolo che ogni conto statistico soddisfa <b>automaticamente</b>, perché l&rsquo;energia è conservata dall&rsquo;hamiltoniana da cui si parte — ed è la ragione per cui il primo principio non è mai il controllo interessante su un risultato di meccanica statistica. Il secondo lo è.</p>`}
  ]},
  {t:'prosa', title:'Il secondo principio: Kelvin, Clausius, e la parola «unico»', tag:'first principles', html:R`
  <p>Ci sono processi che rispettano la conservazione dell&rsquo;energia e non avvengono mai. Sciortino ne dà l&rsquo;esempio giusto: <i>un sasso appoggiato sul pavimento non si è mai visto raffreddarsi spontaneamente e sollevarsi fino al soffitto</i>, convertendo energia termica in energia potenziale. Il primo principio non lo vieta. Il secondo sì, e ha due formulazioni equivalenti:</p>
  <ul>
  <li><b>Kelvin.</b> Non esiste trasformazione il cui <i>unico</i> effetto sia estrarre calore da un serbatoio e convertirlo interamente in lavoro.</li>
  <li><b>Clausius.</b> Non esiste trasformazione il cui <i>unico</i> effetto sia estrarre calore da un serbatoio freddo e trasferirlo a uno caldo.</li>
  </ul>
  <p><b>In entrambe la parola chiave è «unico»</b>, e senza di essa l&rsquo;enunciato sarebbe falso. Basta un esempio, ed è quello da avere pronto all&rsquo;orale: si espanda un gas ideale in modo reversibile e <b>isotermo</b>. Poiché $\Delta U=0$ in quel processo — l&rsquo;energia interna del gas ideale dipende solo da $T$ — il lavoro svolto è <i>esattamente uguale</i> al calore assorbito:
  $$W=\int_{V_1}^{V_2}P\,dV=\int_{V_1}^{V_2}\frac{NkT}{V}\,dV=NkT\ln\frac{V_2}{V_1},$$
  e poiché $\Delta U=0$ il primo principio impone che il calore assorbito sia esattamente questa quantità. Quindi una certa quantità di calore <b>è stata convertita interamente in lavoro</b>, e Kelvin non è violato. Non lo è perché quello non è l&rsquo;unico effetto: alla fine <b>il gas occupa un volume maggiore</b>, e quel cambiamento è il prezzo. Chi ricorda l&rsquo;enunciato senza «unico» conclude che il processo è impossibile, e sbaglia.</p>
  <p>Le due formulazioni sono <b>equivalenti nel senso forte</b>: se una è falsa lo è anche l&rsquo;altra. La dimostrazione è breve e vale saperla, perché è il prototipo di tutti gli argomenti «accoppio due macchine e ottengo l&rsquo;assurdo».</p>
  <p><b>Clausius falsa $\Rightarrow$ Kelvin falsa.</b> Si supponga di avere un dispositivo $D$ che, come unico effetto, trasferisce calore $Q_c$ dal serbatoio freddo a quello caldo. Gli si affianchi una macchina di Carnot che prelevi $Q_h$ dal caldo, ceda esattamente $Q_c$ al freddo e produca lavoro $W=Q_h-Q_c$. Nel sistema composto il serbatoio freddo <b>non cambia stato</b> — riceve $Q_c$ dalla macchina e cede $Q_c$ a $D$ — quindi l&rsquo;unico effetto complessivo è prelevare $Q_h-Q_c$ dal solo serbatoio caldo e convertirlo interamente in lavoro. <b>È una violazione di Kelvin.</b></p>
  <p><b>Kelvin falsa $\Rightarrow$ Clausius falsa.</b> Si supponga di avere un dispositivo che, come unico effetto, converta in lavoro il calore $Q$ prelevato dal serbatoio caldo. Con quel lavoro si azioni all&rsquo;inverso una macchina di Carnot, cioè una pompa di calore: essa prende calore $Q_c$ dal freddo e cede $Q_c+Q$ al caldo. Bilancio complessivo: il caldo riceve $Q_c+Q$ e cede $Q$, cioè guadagna $Q_c$; il freddo perde $Q_c$; nessun lavoro netto esce. <b>L&rsquo;unico effetto è calore passato dal freddo al caldo, ed è una violazione di Clausius.</b> $\blacksquare$</p>
  <p>Si noti il ruolo della macchina di Carnot in entrambe le direzioni: serve perché è <b>reversibile</b>, e quindi può essere fatta girare al contrario senza costi aggiuntivi. Tutta la dimostrazione è l&rsquo;uso di quella reversibilità come «cambio di segno» a disposizione.</p>`},
  {t:'reveal', title:'Da una disuguaglianza a una funzione di stato: il teorema di Clausius', tag:'la derivazione che vale il movimento', steps:[
   {label:'Il teorema', body:R`<p>In qualunque trasformazione <b>ciclica</b> durante la quale la temperatura sia definita,
   $$\oint\frac{\delta Q}{T}\le0,$$
   con l&rsquo;uguaglianza se e solo se il ciclo è reversibile. Questo è il <b>teorema di Clausius</b>, e per ora è solo una disuguaglianza su un integrale di linea.</p>`},
   {label:'Come diventa la definizione di S', body:R`<p>Si scelga uno stato di riferimento arbitrario $O$. Per ogni stato $A$ si definisce
   $$S(A)=\int_{O}^{A}\frac{\delta Q}{T},$$
   <b>dove il cammino di integrazione è un qualunque percorso reversibile</b> che unisce $O$ ad $A$. La buona definizione è garantita dal teorema: per due cammini reversibili diversi il ciclo composto è reversibile, quindi $\oint\delta Q/T=0$, quindi i due integrali coincidono. <b>È qui che nasce una funzione di stato da un integrale dipendente dal cammino</b>, e il meccanismo è tutto nella parola «reversibile». Come $U$, anche $S$ è definita a meno di una costante additiva; la <i>differenza</i> fra due stati è invece completamente determinata:
   $$S(B)-S(A)=\int_{A}^{B}\frac{\delta Q}{T}\quad\text{(cammino reversibile)},$$
   e in forma infinitesima $dS=\delta Q/T$, differenziale esatto.</p>`},
   {label:'Le due proprietà che si usano sempre', body:R`<p><b>(a) Per una trasformazione arbitraria</b> — non necessariamente reversibile —
   $$\int_{A}^{B}\frac{\delta Q}{T}\le S(B)-S(A).$$
   La dimostrazione è tre righe e conviene saperla: si chiude un ciclo andando da $A$ a $B$ per il cammino arbitrario e tornando da $B$ ad $A$ per un cammino <i>reversibile</i>. Il teorema di Clausius dà $\int_A^B\delta Q/T+\int_B^A\delta Q/T\le0$; il secondo integrale, essendo su un cammino reversibile, vale $S(A)-S(B)$; quindi $\int_A^B\delta Q/T\le S(B)-S(A)$.</p>
   <p><b>(b) L&rsquo;entropia di un sistema isolato termicamente non decresce mai.</b> Immediata dalla (a): se il sistema è isolato, $\delta Q=0$ in ogni trasformazione, quindi $0\le S(B)-S(A)$, cioè $S(B)\ge S(A)$. Con l&rsquo;uguaglianza se la trasformazione è reversibile.</p>
   <p><b>La conseguenza che diventerà il programma del corso</b>: per un sistema isolato termicamente, <b>lo stato di equilibrio è lo stato di massima entropia compatibile con i vincoli esterni</b>. Questa frase, che qui è un corollario di una disuguaglianza empirica, in ms-04 diventerà un conteggio: il macrostato di equilibrio è quello realizzato dal maggior numero di microstati.</p>`}
  ]},
  {t:'prosa', title:'E un avvertimento che il docente mette per iscritto', tag:'onestà intellettuale', html:R`
  <p>Sciortino chiude il capitolo sul secondo principio con un&rsquo;osservazione che non è un&rsquo;aggiunta filosofica ma il ponte verso tutto il corso, e vale citarla: <i>«la seconda legge della termodinamica non può essere una rigorosa legge di natura. Il nostro universo è governato da leggi molecolari, la cui invarianza nel tempo nega l&rsquo;esistenza di qualsiasi fenomeno naturale che distingue tra passato e futuro… la seconda legge è corretta "in media", e nei fenomeni macroscopici le deviazioni sono così rare che, a tutti gli effetti pratici, non si verificano mai»</i>.</p>
  <p><b>Questo è il problema che la meccanica statistica esiste per affrontare</b>, e l&rsquo;ordine in cui lo fa è: le equazioni del moto sono invarianti per inversione temporale; l&rsquo;entropia che si costruirà cresce con probabilità schiacciante ma non con certezza; le violazioni sono soppresse come $e^{-N}$, e con $N\sim10^{23}$ sono più rare di qualunque evento mai osservato. Il secondo principio passa quindi da <b>legge</b> a <b>enunciato probabilistico sul comportamento dei grandi numeri</b>. Chi all&rsquo;orale risponde «sì, la meccanica statistica dimostra il secondo principio» ha saltato l&rsquo;unica cosa interessante.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Perché si scrive $\delta Q$ e non $dQ$, e che differenza pratica fa in un conto?`,
    a:R`Perché $Q$ non è una funzione di stato: la stessa coppia di stati iniziale e finale, raggiunta per due cammini diversi, scambia quantità di calore diverse. La differenza pratica è che <b>$\delta Q$ non si può integrare conoscendo solo gli estremi</b>: serve il cammino. $dU$ e $dS$ sì. Ed è per questo che in meccanica statistica si calcolano sempre $U$, $S$, $F$ — mai $Q$: le funzioni di stato sono le uniche che una media d&rsquo;insieme può produrre, perché una media d&rsquo;insieme non conosce nessun cammino.`},
   {q:R`Il teorema di Clausius è una disuguaglianza. Come può nascere da una disuguaglianza una funzione di stato?`,
    a:R`Perché la disuguaglianza <b>diventa uguaglianza sul sottoinsieme dei cicli reversibili</b>, e la definizione di $S$ usa <i>solo</i> quelli. Su cammini reversibili $\oint\delta Q/T=0$, cioè $\delta Q/T$ è un differenziale esatto, cioè esiste la funzione. La parte «$<$» della disuguaglianza non serve a definire $S$: serve, dopo, a dire in che verso $S$ si muove nei processi reali — è la proprietà (a), e da lì $dS\ge0$ per un sistema isolato. <b>Definizione e freccia del tempo vengono dai due rami dello stesso teorema.</b>`}
  ]}
]},

/* ---------------- 03 · CARNOT E LA SCALA ASSOLUTA ---------------- */
{ num:'03', title:'Il ciclo di Carnot, e la temperatura che diventa assoluta', meta:'il rendimento massimo · l’adiabatica reversibile del gas ideale · e perché $T$ smette di dipendere dal termometro',
  blocchi:[
  {t:'prosa', title:'Perché una macchina termica è lo strumento teorico giusto', tag:'architettura', html:R`
  <p>Il secondo principio, nella forma di Kelvin, vieta di convertire <i>tutto</i> il calore in lavoro. La domanda quantitativa successiva — <b>quanto</b> se ne può convertire — non è un dettaglio ingegneristico: la sua risposta non dipende dalla sostanza usata, e questa universalità è ciò che permette di definire una temperatura che non dipende dal termometro.</p>
  <p>Un <b>ciclo di Carnot</b> è un ciclo reversibile fra due soli serbatoi, a temperature $T_h>T_c$, composto da quattro rami: un&rsquo;espansione isoterma a $T_h$ (assorbe $Q_h$), un&rsquo;espansione adiabatica reversibile fino a $T_c$, una compressione isoterma a $T_c$ (cede $Q_c$), una compressione adiabatica che riporta a $T_h$. Poiché il ciclo è reversibile, il teorema di Clausius vale con l&rsquo;uguaglianza, e l&rsquo;integrale $\oint\delta Q/T$ si riduce ai due rami isotermi perché sugli adiabatici $\delta Q=0$:
  $$\frac{Q_h}{T_h}-\frac{Q_c}{T_c}=0\quad\Longrightarrow\quad \frac{Q_c}{Q_h}=\frac{T_c}{T_h}.$$
  Il rendimento è dunque
  $$\eta=\frac{W}{Q_h}=\frac{Q_h-Q_c}{Q_h}=1-\frac{Q_c}{Q_h}=1-\frac{T_c}{T_h},$$
  e <b>dipende solo dalle due temperature</b>, non dal gas, non dal volume, non dalla pressione.</p>
  <p><b>Ecco il vincolo che la meccanica statistica deve rispettare e non viola mai</b>, e il motivo è semplice: l&rsquo;$S$ che costruirà sarà, di nuovo, una funzione di stato, e il conto qui sopra usa <i>solo</i> quello. Un risultato statistico che producesse un rendimento superiore a $1-T_c/T_h$ segnalerebbe un errore, non una scoperta.</p>`},
  {t:'reveal', title:'L’adiabatica reversibile del gas ideale, ricavata e non citata', tag:'derivazione', steps:[
   {label:'L’equazione differenziale', body:R`<p>Su un&rsquo;adiabatica reversibile $\delta Q=0$, quindi il primo principio dà $dU=-P\,dV$. Per il gas ideale monoatomico $U=\tfrac32NkT$ (lo si ricava in ms-04 dal conteggio degli stati; qui è il bersaglio), quindi $dU=\tfrac32Nk\,dT$, e con $P=NkT/V$:
   $$\frac32Nk\,dT=-\frac{NkT}{V}\,dV \quad\Longrightarrow\quad \frac32\frac{dT}{T}=-\frac{dV}{V}.$$
   Le variabili si separano — è il <span class="str" data-str="cambio-di-variabile">cambio di variabile</span> più elementare che ci sia, e qui basta — e $Nk$ si semplifica: <b>l&rsquo;adiabatica non dipende dalla quantità di gas</b>.</p>`},
   {label:'Integrazione, e le due forme', body:R`<p>Integrando: $\tfrac32\ln T=-\ln V+\text{cost}$, cioè
   $$T\,V^{2/3}=\text{costante}.$$
   Per passare alla forma in $P$ e $V$ si sostituisce $T=PV/Nk$, ottenendo $PV^{5/3}=\text{costante}$. Le due scritture sono la stessa cosa a meno del fattore $Nk$, e conviene vederlo esplicitamente:
   $$P\,V^{5/3}=\frac{NkT}{V}\,V^{5/3}=Nk\,\cdot TV^{2/3}.$$
   L&rsquo;esponente $5/3$ è $\gamma=C_P/C_V$ per il gas monoatomico, e per una dispersione diversa cambia: <b>l&rsquo;adiabatica sente la forma dell&rsquo;hamiltoniana</b>, mentre l&rsquo;equazione di stato $PV=NkT$ no. È la stessa asimmetria che tornerà in ogni esercizio con un gas non standard.</p>`},
   {label:'Perché l’adiabatica è più ripida dell’isoterma', body:R`<p>Nel piano $P$-$V$, l&rsquo;isoterma ha pendenza $dP/dV=-P/V$, l&rsquo;adiabatica $-\gamma P/V$, con $\gamma>1$. <b>L&rsquo;adiabatica scende più rapidamente</b>, e la ragione fisica è diretta: espandendo adiabaticamente il gas non riceve calore, quindi si raffredda, quindi la pressione cala <i>sia</i> per l&rsquo;aumento di volume <i>sia</i> per il calo di temperatura. Su un&rsquo;isoterma solo il primo effetto agisce. Questo fatto è anche la ragione geometrica per cui $C_P>C_V$, e lo si riprende con i numeri nella tappa 07.</p>`}
  ]},
  {t:'plot', title:'Il ciclo di Carnot, nei due piani in cui va saputo disegnare',
   intro:'A sinistra i quattro rami nel piano $V$-$P$: due isoterme (iperboli) e due adiabatiche (più ripide). A destra lo stesso ciclo nel piano $S$-$T$, dove diventa un rettangolo — ed è lì che si legge il rendimento.',
   plots:[
    {kind:'curve', xr:[0.6,3.4], yr:[0.2,2.2], equal:false, title:'piano V-P: isoterme e adiabatiche',
     curves:[
      {x:'t', y:'2.1/t', tr:[0.8,1.6], col:'#ff9b6b', label:'isoterma T_h'},
      {x:'t', y:'0.95/t', tr:[1.45,2.9], col:'#5eead4', label:'isoterma T_c'},
      {x:'t', y:'2.1*pow(0.8,2/3)/pow(t,5/3)', tr:[1.6,2.9], col:'#b98cff', label:'adiabatica'},
      {x:'t', y:'0.95*pow(2.9,2/3)/pow(t,5/3)', tr:[0.8,1.45], col:'#d8a13a', label:'adiabatica'}
     ]},
    {kind:'curve', xr:[0.4,2.6], yr:[0.4,2.6], equal:false, title:'piano S-T: il ciclo e un rettangolo',
     curves:[
      {x:'t', y:'2.2', tr:[0.7,2.3], col:'#ff9b6b', label:'isoterma T_h: assorbe Q_h'},
      {x:'t', y:'0.9', tr:[0.7,2.3], col:'#5eead4', label:'isoterma T_c: cede Q_c'},
      {x:'2.3', y:'t', tr:[0.9,2.2], col:'#b98cff', label:'adiabatica: S costante'},
      {x:'0.7', y:'t', tr:[0.9,2.2], col:'#d8a13a', label:'adiabatica: S costante'}
     ]}
   ],
   leggi:R`<p><b>A sinistra si vede la sola cosa che serve ricordare del disegno</b>: le adiabatiche sono <i>più ripide</i> delle isoterme, quindi il ciclo si chiude e racchiude un&rsquo;area — e quell&rsquo;area è il lavoro $W=\oint P\,dV$. Se le adiabatiche avessero la stessa pendenza delle isoterme il ciclo degenererebbe e il lavoro sarebbe nullo: <b>è l&rsquo;eccedenza $\gamma>1$ che rende possibile una macchina termica</b>.</p>
   <p><b>A destra la figura fa il lavoro concettuale.</b> Nel piano $S$-$T$ un&rsquo;isoterma è un segmento orizzontale e un&rsquo;adiabatica reversibile è un segmento <i>verticale</i>, perché reversibile e $\delta Q=0$ significa $dS=0$: il ciclo di Carnot è <b>esattamente un rettangolo</b>. Il calore scambiato su un&rsquo;isoterma è $Q=T\,\Delta S$, cioè l&rsquo;area sotto il lato; quindi $Q_h=T_h\,\Delta S$ e $Q_c=T_c\,\Delta S$ <i>con lo stesso</i> $\Delta S$ — i due lati verticali hanno la stessa lunghezza perché $S$ è funzione di stato. Da qui $Q_c/Q_h=T_c/T_h$ <b>si legge</b>, e il rendimento $\eta=1-T_c/T_h$ è il rapporto fra l&rsquo;area del rettangolo e l&rsquo;area sotto il lato superiore.</p>
   <p><b>La morale da portare all&rsquo;orale</b>: il piano $S$-$T$ è il piano in cui il secondo principio è geometria elementare. Ogni volta che un conto su una macchina termica diventa confuso nel piano $P$-$V$, conviene ridisegnarlo qui — e si scopre che quasi tutti gli esercizi sui cicli sono aree di rettangoli e triangoli.</p>`},
  {t:'prosa', title:'La temperatura assoluta, e perché $T=0$ smette di essere una convenzione', tag:'first principles', html:R`
  <p>La scala di temperatura si può costruire operativamente, e Sciortino descrive la procedura: si misura $PV/Nk$ di un gas ideale alla temperatura di ebollizione e a quella di congelamento dell&rsquo;acqua, si traccia la retta fra i due punti, e si sceglie come origine della scala la sua <b>intercetta con l&rsquo;ascissa</b>; poi si divide l&rsquo;intervallo fra i due riferimenti in cento parti uguali. Il risultato è la scala Kelvin, e la sua universalità viene da quella del gas ideale — tutti i gas, sufficientemente diluiti, si comportano allo stesso modo.</p>
  <p><b>Ma a questo punto l&rsquo;origine $T=0$ è ancora una scelta arbitraria</b>: è dove capita di cadere l&rsquo;intercetta di una retta sperimentale. È il secondo principio a renderla assoluta, e il meccanismo è il rendimento di Carnot: poiché $\eta=1-T_c/T_h$ <b>non dipende dalla sostanza</b>, il rapporto $T_c/T_h$ è misurabile con una macchina termica reversibile senza usare alcun termometro a gas. Il rapporto fra due temperature diventa così una quantità definita dalla termodinamica stessa, e la scala resta fissata a meno di una sola costante moltiplicativa — che è la scelta del grado. <b>$T=0$ è allora il punto in cui $\eta=1$</b>: la temperatura a cui una macchina reversibile convertirebbe tutto il calore in lavoro. Che sia inaccessibile è il contenuto del terzo principio, ed è la tappa seguente.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Un ciclo reversibile fra due serbatoi ha rendimento $\eta=0{,}9$ con $T_c=300$ K. Che $T_h$ serve, e la risposta dice qualcosa?`,
    a:R`Da $\eta=1-T_c/T_h$ segue $T_h=T_c/(1-\eta)=300/0{,}1=3000$ K. <b>La cosa che dice</b> è quanto sia costoso il rendimento: per passare da $\eta=0{,}5$ ($T_h=600$ K) a $\eta=0{,}9$ bisogna quintuplicare la temperatura della sorgente calda, e per $\eta\to1$ serve $T_h\to\infty$ oppure $T_c\to0$. È il motivo strutturale per cui i motori reali stanno intorno al $30$–$40\%$: non è cattiva ingegneria, è che $T_c$ è l&rsquo;ambiente e $T_h$ è limitata dai materiali.`},
   {q:R`Perché nel ciclo di Carnot i due lati adiabatici hanno la stessa lunghezza nel piano $S$-$T$?`,
    a:R`Perché $S$ è una <b>funzione di stato</b>: percorrendo il ciclo si torna al punto di partenza, quindi $\oint dS=0$, quindi la variazione di entropia guadagnata sull&rsquo;isoterma calda è esattamente quella persa sulla fredda. I due lati verticali sono i due adiabatici, su cui $S$ non cambia, e collegano le stesse due ordinate $S_1$ e $S_2$. <b>È questo, e solo questo, a dare $Q_c/Q_h=T_c/T_h$</b>: con $Q=T\Delta S$ e lo stesso $\Delta S$, il rapporto dei calori è il rapporto delle temperature. Tutto il rendimento di Carnot è la funzione-di-statità dell&rsquo;entropia.`}
  ]}
]},

/* ---------------- 04 · IL TERZO PRINCIPIO, DERIVATO ---------------- */
{ num:'04', title:'Il terzo principio, e la conseguenza che nessuno enuncia', meta:'Nernst risolve un’ambiguità · da $S(0)=0$ segue $C\\to0$ · e anche $\\alpha\\to0$',
  blocchi:[
  {t:'prosa', title:'Il problema che Nernst risolve, e non è quello che sembra', tag:'first principles', html:R`
  <p>Il secondo principio definisce l&rsquo;entropia <b>a meno di una costante additiva</b>, e la definizione poggia sull&rsquo;esistenza di una trasformazione reversibile che colleghi lo stato di riferimento $O$ allo stato $A$. Finché $O$ e $A$ stanno sulla stessa superficie dell&rsquo;equazione di stato, quella trasformazione esiste sempre. <b>Ma se si considerano due sostanze diverse</b>, o due fasi metastabili della stessa sostanza, la superficie di stato può consistere di <i>pezzi disgiunti</i>: fra un punto dell&rsquo;uno e un punto dell&rsquo;altro non c&rsquo;è nessun cammino reversibile, e il secondo principio <b>non determina</b> la differenza di entropia.</p>
  <p>Questa è l&rsquo;ambiguità che Nernst risolse nel 1905, e l&rsquo;enunciato del terzo principio va letto come la sua risposta: <b>l&rsquo;entropia di un sistema allo zero assoluto è una costante universale, che si può porre uguale a zero</b>. La generalità sta in due punti: (a) vale per <i>qualsiasi</i> sistema, e (b) afferma $S=0$ a $T=0$ <b>indipendentemente dai valori di qualunque altro parametro</b> di cui $S$ possa dipendere. Dando a tutte le sostanze lo stesso punto di riferimento, la costante additiva sparisce e l&rsquo;entropia di ogni stato di ogni sistema diventa univoca.</p>
  <p><b>Detto così sembra una convenzione di comodo</b>, ed è invece un vincolo sperimentale forte, perché ha conseguenze misurabili che non riguardano lo zero assoluto. Sono queste che si usano, e vanno derivate.</p>`},
  {t:'reveal', title:'Da $S(0)=0$ segue che ogni capacità termica si annulla', tag:'derivazione in quattro righe', steps:[
   {label:'L’entropia come integrale della capacità termica', body:R`<p>Sia $R$ un cammino reversibile che collega lo stato a $T=0$ allo stato $A$, e $C_R(T)$ la capacità termica del sistema lungo $R$. Dal secondo principio, con $\delta Q=C_R\,dT$ lungo il cammino,
   $$S(A)=\int_{0}^{T_A}\frac{C_R(T)}{T}\,dT.$$
   Si noti che è un integrale con l&rsquo;estremo inferiore <b>a zero</b>, e che l&rsquo;integrando ha un $1/T$: è qui che sta tutto.</p>`},
   {label:'Lo sviluppo, e la condizione di convergenza', body:R`<p>Si sviluppi $C_R$ in serie di Taylor (<span class="str" data-str="derivazione">derivare sotto il segno di integrale</span> non serve: l&rsquo;estremo dipende da $T_A$ e si tratta a parte) intorno allo zero, $C_R(T)=C_R(0)+C_R'(0)\,T+\dots$, e si guardi l&rsquo;integrale con un estremo inferiore $T_0$ da mandare a zero:
   $$\int_{T_0}^{T_A}\frac{C_R(0)+C_R'(0)\,T+\dots}{T}\,dT=C_R(0)\,\ln\frac{T_A}{T_0}+C_R'(0)\,(T_A-T_0)+\dots$$
   Il primo termine <b>diverge logaritmicamente</b> per $T_0\to0$; tutti gli altri restano finiti. Ma il terzo principio impone che $S(A)$ sia finita — è zero a $T=0$ e cresce in modo finito — quindi l&rsquo;integrale deve convergere, quindi il coefficiente del termine divergente deve annullarsi:
   $$\boxed{C_R(T)\to0\quad\text{per}\quad T\to0.}$$
   In particolare $C_V\to0$ e $C_P\to0$, e la predizione è verificata sperimentalmente per tutte le sostanze esaminate.</p>`},
   {label:'La conseguenza meno ovvia: anche la dilatazione svanisce', body:R`<p>Dalla relazione di Maxwell su $G$, $\left(\partial S/\partial P\right)_T=-\left(\partial V/\partial T\right)_P$ (la si ricava nella tappa 05), e dal terzo principio nella sua forma forte — $S\to0$ <b>indipendentemente dagli altri parametri</b>, quindi anche indipendentemente da $P$ — segue che $\left(\partial S/\partial P\right)_T\to0$ per $T\to0$. Perciò
   $$\alpha(T)=\frac1V\left(\frac{\partial V}{\partial T}\right)_{P}\longrightarrow0\qquad (T\to0).$$
   <b>Un corpo, vicino allo zero assoluto, smette di dilatarsi.</b> È il punto (b) dell&rsquo;enunciato di Nernst che lavora: se $S(0)$ dipendesse dalla pressione, questa conclusione cadrebbe.</p>`}
  ]},
  {t:'plot', title:'Quali calori specifici il terzo principio ammette',
   intro:'Tre andamenti di $C(T)$ a bassa temperatura: la costante del gas ideale classico, il lineare del gas di Fermi, il cubico dei fononi. Solo due delle tre curve sono ammesse.',
   plots:[
    {kind:'func2d', xr:[0,1.4], yr:[0,1.7],
     curves:[
      {f:'1.5', col:'#ff9b6b', label:'C = 3Nk/2  (gas ideale classico) — VIETATO'},
      {f:'1.2*x', col:'#5eead4', label:'C ~ T  (gas di Fermi)'},
      {f:'1.3*x*x*x', col:'#b98cff', label:'C ~ T^3  (fononi, Debye)'}
     ], title:'C(T)/Nk in funzione di T (unita arbitrarie)'}
   ],
   leggi:R`<p><b>La curva arancione è il gas ideale classico</b>, $C_V=\tfrac32Nk$ costante a ogni temperatura. Non tende a zero, quindi <b>viola il terzo principio</b>, quindi l&rsquo;integrale $\int_0 C/T\,dT$ diverge e l&rsquo;entropia classica va a $-\infty$ per $T\to0$ — ed è esattamente ciò che fa la formula di Sackur-Tetrode. Questa violazione non è un errore di conto: è il segnale che a bassa temperatura la descrizione classica <b>è finita</b>.</p>
   <p><b>Le altre due sono le riparazioni</b>, e sono i risultati di due movimenti del corso: $C\propto T$ per il gas di Fermi degenere, $C\propto T^{3}$ per i fononi nel modello di Debye. Entrambe si annullano in zero, entrambe rendono l&rsquo;integrale convergente. Guardando la figura si vede anche <i>quanto</i> diversamente: a bassissima $T$ il contributo cubico è trascurabile rispetto al lineare, che è il motivo per cui nei metalli, sotto pochi kelvin, il calore specifico elettronico domina su quello reticolare.</p>
   <p><b>L&rsquo;uso pratico, e vale ogni volta.</b> Quando in un esercizio esce un $C(T)$, la prima cosa da guardare è il suo limite a zero: se non svanisce, o il conto è sbagliato, o si sta usando una statistica classica in un regime dove non vale. Questo controllo costa cinque secondi e non richiede di rifare nulla.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Il terzo principio dice «$S\to0$». Perché la forma utile è invece «$C\to0$»?`,
    a:R`Perché $S(0)$ non si misura e non compare in nessun esercizio, mentre $C(T)$ si misura e compare in tutti. La catena è: $S$ finita in zero $\Rightarrow$ l&rsquo;integrale $\int_0 (C/T)\,dT$ converge $\Rightarrow$ il termine costante dello sviluppo di $C$ è nullo $\Rightarrow$ $C\to0$. <b>Il terzo principio è, operativamente, un vincolo sul comportamento a bassa temperatura delle funzioni di risposta</b> — e in quella forma boccia il gas ideale classico, promuove Fermi e Debye, e fornisce un controllo gratuito su ogni risultato statistico.`},
   {q:R`Che cosa si romperebbe se l&rsquo;entropia allo zero assoluto dipendesse dalla pressione?`,
    a:R`Cadrebbe la conclusione $\alpha\to0$. La derivazione usa $(\partial S/\partial P)_T\to0$, che segue dal punto (b) dell&rsquo;enunciato di Nernst — $S=0$ a $T=0$ <i>qualunque</i> siano gli altri parametri. Se $S(0)$ dipendesse da $P$, quella derivata non sarebbe nulla e nulla vieterebbe a un corpo di dilatarsi allo zero assoluto. <b>È il caso in cui la parte dell&rsquo;enunciato che sembra ridondante è quella che fa il lavoro</b>: vale la pena notarlo, perché è il genere di dettaglio che distingue chi ha capito un principio da chi lo ha imparato.`}
  ]}
]},

/* ---------------- 05 · I POTENZIALI E LEGENDRE ---------------- */
{ num:'05', title:'I potenziali termodinamici e la trasformata di Legendre', meta:'un potenziale per ogni scelta di variabili · Legendre come intercetta e pendenza · il quadrato di Maxwell',
  blocchi:[
  {t:'prosa', title:'Il problema che Legendre risolve', tag:'first principles', html:R`
  <p>Da $dU=T\,dS-P\,dV+\mu\,dN$ si legge che le variabili naturali di $U$ sono $(S,V,N)$: sono quelle rispetto a cui basta derivare per ottenere tutto il resto. Ma <b>l&rsquo;entropia non si controlla in laboratorio</b>: si controlla la temperatura, immergendo il sistema in un bagno. Serve una funzione che abbia $T$ fra le variabili naturali al posto di $S$, e che contenga la stessa informazione.</p>
  <p>Detto in modo ingenuo si potrebbe pensare di «invertire $T=T(S,V)$ e sostituire», scrivendo $U(T,V)$. <b>Quella strada perde informazione</b>, e conviene vedere subito perché: $U(T,V)$ non basta a ricostruire $S$, perché ricostruirla richiederebbe di integrare e quindi una costante che non c&rsquo;è più. La trasformata di Legendre fa la sostituzione <i>compensando</i>, e la compensazione è tutto il contenuto.</p>`},
  {t:'reveal', title:'Legendre in generale: intercetta e pendenza, non «sottrai il prodotto»', tag:'la lettura che rende chiara la formula', steps:[
   {label:'Una curva descritta in due modi', body:R`<p>Sia $y(x)$ una funzione concava o convessa (la scheda della <span class="str" data-str="trasformata-di-legendre">trasformata di Legendre</span> ne porta la forma generale). Un punto sulla curva si può indicare con la coppia $(x,y)$, <b>oppure</b> con la coppia formata dalla <i>pendenza</i> $p=dy/dx$ in quel punto e dall&rsquo;<i>intercetta</i> $\psi$ della retta tangente in quel punto. La retta tangente ha equazione $Y=y+p\,(X-x)$, quindi la sua intercetta ($X=0$) è
   $$\psi=y(x)-p\,x.$$
   Questa è la trasformata di Legendre, e la formula non è una ricetta: <b>è l&rsquo;intercetta della tangente</b>. Il requisito di convessità serve perché la corrispondenza punto $\leftrightarrow$ tangente sia biunivoca: su una curva con un flesso, due punti diversi possono avere la stessa pendenza.</p>`},
   {label:'Che $\\psi$ dipenda solo da $p$ non è ovvio, e si dimostra', body:R`<p>A prima vista $\psi$ sembra dipendere da $x$ e da $p$ insieme. Si differenzia:
   $$d\psi=dy-p\,dx-x\,dp=dy-\frac{dy}{dx}dx-x\,dp=-x\,dp,$$
   perché i primi due termini si cancellano per definizione di $p$. <b>Resta solo $dp$</b>: quindi $\psi=\psi(p)$, e in più si è ottenuto gratis
   $$x=-\frac{d\psi}{dp}.$$
   Quest&rsquo;ultima è la regola per <b>tornare indietro</b>: inserendola in $\psi=y-px$ si ricostruisce $y(x)=\psi(p)+p\,\dfrac{d\psi}{dp}$. Le due funzioni $y(x)$ e $\psi(p)$ sono due rappresentazioni della stessa relazione funzionale, e <b>nel passaggio non si perde niente</b>. È questa reversibilità, non la formula, la ragione per cui la termodinamica usa Legendre e non una sostituzione qualunque.</p>`},
   {label:'Il caso da avere in mano', body:R`<p>Si prenda $y=x^{2}$. Allora $p=2x$, e
   $$\psi=y-px=x^{2}-2x\cdot x=-x^{2}=-\frac{p^{2}}{4}.$$
   Verifica del ritorno: $\dfrac{d\psi}{dp}=-\dfrac{p}{2}=-x$, cioè $x=-d\psi/dp$, come deve essere. <b>Si noti il segno</b>: la trasformata di una funzione convessa è concava, e questo scambio di convessità è la ragione per cui i principi di <i>massimo</i> per $S$ diventano principi di <i>minimo</i> per $F$ e $G$ — il contenuto della tappa 06.</p>`},
   {label:'E dove l’avevi già incontrata: da Lagrange a Hamilton', body:R`<p>Nel caso unidimensionale $L=L(q,v)$, si elimina $v$ in favore di $\partial L/\partial v$ definendo la trasformata $-H=L-\dfrac{\partial L}{\partial v}\,v$; ponendo $p=\partial L/\partial v$ si ottiene $-H(q,p)=L-pv$, cioè
   $$H(q,p)=p\,v-L(q,v),$$
   e il ritorno è $v=\partial H/\partial p$. <b>Il passaggio dalla meccanica lagrangiana a quella hamiltoniana è una trasformata di Legendre</b>, con $v$ al posto di $S$ e $p$ al posto di $T$. Vale la pena registrarlo perché significa che questo formalismo è già noto: il quadro delle variabili coniugate che regge la termodinamica è lo stesso che regge la meccanica, e nel movimento sullo spazio delle fasi le due cose si incontreranno esplicitamente.</p>`}
  ]},
  {t:'plot', title:'La trasformata di Legendre, vista',
   intro:'La parabola $y=x^{2}$ e la sua tangente nel punto $x_0=1$. L’intercetta della tangente con l’asse verticale è $\\psi(p)$, e la pendenza è $p$.',
   plots:[
    {kind:'func2d', xr:[-0.4,2.2], yr:[-1.6,4.2], equal:false,
     curves:[
      {f:'x*x', col:'#5eead4', label:'y = x^2'},
      {f:'2*x-1', col:'#ff9b6b', label:'tangente in x0=1: pendenza p=2'},
      {f:'3*x-2.25', col:'#b98cff', label:'tangente in x0=1.5: pendenza p=3', dash:true}
     ],
     marks:[{x:1, y:1, label:'punto (x0, y0)', col:'#ffffff'},
            {x:0, y:-1, label:'psi(2) = -1', col:'#ff9b6b', left:true},
            {x:0, y:-2.25, label:'psi(3) = -2.25', col:'#b98cff', left:true, up:false}],
     title:'la famiglia delle tangenti descrive la curva tanto bene quanto i suoi punti'}
   ],
   leggi:R`<p><b>Che cosa guardare</b>: la curva $y=x^{2}$ e due delle sue tangenti. Ogni tangente è individuata da due numeri, la pendenza $p$ e l&rsquo;intercetta $\psi$; e la figura mostra che <i>conoscere tutte le tangenti equivale a conoscere la curva</i> — la curva è l&rsquo;inviluppo delle sue tangenti. Questa è la ragione geometrica per cui la trasformata non perde informazione.</p>
   <p><b>Il conto sulla figura</b>: in $x_0=1$ si ha $p=2$ e l&rsquo;intercetta è $-1$, in accordo con $\psi=-p^{2}/4=-1$. In $x_0=1{,}5$ si ha $p=3$ e $\psi=-9/4=-2{,}25$. Muovendo il punto di tangenza verso destra la pendenza cresce e l&rsquo;intercetta <b>scende</b>, ed è il segno che rende $\psi$ concava dove $y$ è convessa.</p>
   <p><b>Come si legge in termodinamica.</b> Si metta $y=U$, $x=S$: la pendenza è $p=(\partial U/\partial S)_V=T$, e l&rsquo;intercetta è $\psi=U-TS=F$. <b>L&rsquo;energia libera di Helmholtz è l&rsquo;intercetta della tangente al grafico di $U(S)$</b>, e la temperatura è la sua pendenza. Tutta la tabella dei potenziali che segue è questa figura ripetuta, cambiando quale variabile si sacrifica.</p>`},
  {t:'prosa', title:'I cinque potenziali, e l’ensemble che produce ciascuno', tag:'la tabella da ricordare', html:R`
  <p>Applicando la costruzione a $U(S,V,N)$, una variabile per volta:</p>
  <table>
  <tr><th>potenziale</th><th>definizione</th><th>differenziale</th><th>variabili naturali</th><th>lo produce</th></tr>
  <tr><td>energia interna $U$</td><td>—</td><td>$T\,dS-P\,dV+\mu\,dN$</td><td>$S,V,N$</td><td><b>microcanonico</b></td></tr>
  <tr><td>entalpia $H$</td><td>$U+PV$</td><td>$T\,dS+V\,dP+\mu\,dN$</td><td>$S,P,N$</td><td>— (serve in chimica)</td></tr>
  <tr><td>energia libera di Helmholtz $F$ (in Huang e Sciortino: $A$)</td><td>$U-TS$</td><td>$-S\,dT-P\,dV+\mu\,dN$</td><td>$T,V,N$</td><td><b>canonico</b></td></tr>
  <tr><td>potenziale di Gibbs $G$</td><td>$F+PV$</td><td>$-S\,dT+V\,dP+\mu\,dN$</td><td>$T,P,N$</td><td>— (l&rsquo;insieme $NPT$)</td></tr>
  <tr><td>potenziale grande $\Omega$</td><td>$F-\mu N$</td><td>$-S\,dT-P\,dV-N\,d\mu$</td><td>$T,V,\mu$</td><td><b>gran canonico</b></td></tr>
  </table>
  <p>I due passaggi vanno visti scritti almeno una volta. Da $F=U-TS$:
  $$dF=dU-T\,dS-S\,dT=(T\,dS-P\,dV)-T\,dS-S\,dT=-P\,dV-S\,dT,$$
  e i due termini in $T\,dS$ si cancellano: <b>è la cancellazione il meccanismo della trasformata</b>. Da $G=F+PV$:
  $$dG=dF+P\,dV+V\,dP=-P\,dV-S\,dT+P\,dV+V\,dP=-S\,dT+V\,dP,$$
  e ora le variabili naturali sono $(T,P)$. Le tre funzioni $U(S,V)$, $F(T,V)$ e $G(T,P)$ <b>contengono la stessa informazione</b>.</p>
  <p><b>Questa tabella è la mappa del corso.</b> I tre ensemble che si costruiranno non sono tre tecniche alternative per lo stesso calcolo: ciascuno produce naturalmente <b>un</b> potenziale, cioè risponde a una domanda in un particolare sistema di variabili. Sapere quale potenziale serve dice subito quale ensemble usare — ed è la decisione che apre ogni esercizio.</p>
  <div class="note">Per un sistema estensivo vale l&rsquo;identità di Eulero $U=TS-PV+\mu N$, da cui $G=\mu N$ e $\Omega=-PV$: il potenziale grande <b>è</b> la pressione per il volume, cambiata di segno, e il potenziale di Gibbs è il potenziale chimico per il numero di particelle. Il primo fatto è il motivo per cui il gran canonico è la via più corta all&rsquo;equazione di stato di un gas quantistico; il secondo è la definizione operativa di $\mu$ come «energia libera per particella aggiunta a $T$ e $P$ fissate».</div>`},
  {t:'prosa', title:'Il quadrato di Maxwell: un modo di non ricordare le relazioni', tag:'mnemonica onesta', html:R`
  <p>Sciortino osserva che tutte le relazioni fra i potenziali e le loro derivate prime si leggono da un unico diagramma: <b>i quattro potenziali $U$, $F$, $G$, $H$ disposti ai lati di un quadrato, affiancati dai propri argomenti naturali ai vertici</b>. La derivata di un potenziale rispetto a uno dei suoi argomenti si trova percorrendo la diagonale che parte da quell&rsquo;argomento: <b>andando contro la freccia si prende un segno meno</b>. Così $(\partial F/\partial T)_V=-S$ e $(\partial F/\partial V)_T=-P$, mentre $(\partial G/\partial P)_T=+V$.</p>
  <p>Il quadrato, in forma testuale, con i potenziali fra le coppie di variabili che li governano:</p>
  <table>
  <tr><th></th><th>$T$</th><th>$P$</th></tr>
  <tr><td><b>$S$</b></td><td>— ($T$ e $S$ sono coniugate)</td><td>$H(S,P)$: $\ \partial H/\partial S=T$, $\ \partial H/\partial P=V$</td></tr>
  <tr><td><b>$V$</b></td><td>$F(T,V)$: $\ \partial F/\partial T=-S$, $\ \partial F/\partial V=-P$</td><td>— ($P$ e $V$ sono coniugate)</td></tr>
  </table>
  <p>con $U(S,V)$ — $\partial U/\partial S=T$, $\partial U/\partial V=-P$ — e $G(T,P)$ — $\partial G/\partial T=-S$, $\partial G/\partial P=V$ — a completare i quattro. <b>La regola dei segni in una frase</b>: il segno è meno ogni volta che la derivata restituisce una grandezza <i>estensiva</i> ($S$ o $V$) partendo da una <i>intensiva</i> ($T$ o $P$)… e non vale la pena impararla, perché si ricostruisce in tre secondi scrivendo il differenziale del potenziale, che è ciò che qui sopra è stato fatto per $F$ e per $G$. <b>Il diagramma è utile come controllo, non come sostituto del differenziale.</b></p>`},
  {t:'reveal', title:'Il gas ideale classico, come banco di prova di tutto il macchinario', tag:'esempio che si riusa', steps:[
   {label:'Da F si estrae tutto', body:R`<p>Anticipando il risultato che il canonico ricaverà dal microscopico, per il gas ideale monoatomico
   $$F=-NkT\left(\ln\frac{V}{N}+\frac32\ln T+c\right).$$
   Da qui, per sola derivazione:
   $$P=-\left(\frac{\partial F}{\partial V}\right)_{T}=\frac{NkT}{V},\qquad S=-\left(\frac{\partial F}{\partial T}\right)_{V}=Nk\left(\ln\frac{V}{N}+\frac32\ln T+c+\frac32\right).$$
   La prima è <b>l&rsquo;equazione di stato</b>, ottenuta senza mai parlare di urti contro le pareti. La seconda è Sackur&ndash;Tetrode con la costante $c$ non ancora fissata. Si noti che $V$ compare come $V/N$: la forma estensiva della tappa 01 è rispettata, e questo è il segno che il fattore $1/N!$ è già stato incluso.</p>`},
   {label:'E si torna indietro a U, H', body:R`<p>Da $U=F+TS$, i due logaritmi si cancellano e resta
   $$U=\tfrac32NkT,$$
   che è l&rsquo;<b>equipartizione</b>: $\tfrac12kT$ per grado di libertà quadratico, tre per particella. Il conto è breve ed è il modello di ogni verifica che si farà: <b>un potenziale, poi solo derivate</b>. Per l&rsquo;entalpia, $H=U+PV=\tfrac32NkT+NkT=\tfrac52NkT$.</p>
   <p>Da notare che $U$ <b>non dipende dal volume</b>: un gas ideale che si espande a temperatura costante non cambia energia interna. È il fatto che rende l&rsquo;espansione libera di Joule un esperimento decisivo, ed è anche il motivo per cui in quell&rsquo;espansione tutta la variazione di entropia è il $Nk\ln(V_f/V_i)$ del paradosso di Gibbs.</p>`},
   {label:'Il controllo su G, che chiude il cerchio', body:R`<p>Vale la pena fare il passaggio a $G$ per intero, perché è il punto in cui si verifica che il macchinario sia coerente. Sostituendo $V=NkT/P$ in $F$ e aggiungendo $PV=NkT$:
   $$G=F+PV=-NkT\left(\ln\frac{kT}{P}+\frac32\ln T+c\right)+NkT.$$
   Ora la relazione dal quadrato di Maxwell dice $V=(\partial G/\partial P)_T$. Derivando: il solo termine che dipende da $P$ è $+NkT\ln P$ dentro la parentesi cambiata di segno, e la sua derivata è
   $$\left(\frac{\partial G}{\partial P}\right)_{T}=\frac{NkT}{P}=V.\qquad\checkmark$$
   <b>Il volume è ricomparso come derivata del potenziale in cui era stato eliminato</b>, ed è la dimostrazione concreta che Legendre non ha perso nulla. Questo è il tipo di verifica che conviene fare una volta qui e mai più: dopo, la si dà per buona.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Perché non si può semplicemente scrivere $U$ in funzione di $T$ invece di passare per $F$?`,
    a:R`Si può <i>scrivere</i>, ma si perde informazione. $U(S,V)$ contiene tutta la termodinamica; $U(T,V)$ no — per ricostruire $S$ da $U(T,V)$ servirebbe integrare $dS=(1/T)(\partial U/\partial T)\,dT+\dots$, cioè servirebbe una costante che non c&rsquo;è più. <b>La trasformata di Legendre è l&rsquo;unico cambio di variabile che non perde niente</b>: sostituisce $S$ con $T$ <i>e</i> compensa sottraendo $TS$. Geometricamente, ricordare solo la pendenza è come ricordare l&rsquo;inclinazione di una retta dimenticando dove passa: l&rsquo;intercetta è l&rsquo;informazione che Legendre conserva.`},
   {q:R`Un sistema è chiuso in un recipiente rigido a contatto con un termostato. Quale potenziale è minimo all&rsquo;equilibrio, e quale ensemble si usa?`,
    a:R`Fissati $T$, $V$, $N$, all&rsquo;equilibrio è minima l&rsquo;<b>energia libera di Helmholtz</b> $F$ — che è il compromesso fra minimizzare $U$ e massimizzare $S$, pesato da $T$: $F=U-TS$. L&rsquo;ensemble è il <b>canonico</b>, e la sua funzione di partizione darà $F=-kT\ln Z$. A temperatura bassa vince il termine $U$ (ordine), ad alta vince $-TS$ (disordine): in una riga c&rsquo;è tutta la fenomenologia delle transizioni di fase. Se invece è la <i>pressione</i> a essere fissata e non il volume, il potenziale minimo è $G$ e l&rsquo;insieme è quello a $N$, $P$, $T$ costanti.`}
  ]}
]},

/* ---------------- 06 · IL LAVORO MASSIMO E I PRINCIPI DI MINIMO ---------------- */
{ num:'06', title:'Il lavoro massimo, e perché i potenziali si minimizzano', meta:'$W\\le-\\Delta F$ · il minimo di $F$ a $T,V$ fissati · il minimo di $G$ a $T,P$ fissati · e il pistone che trova la sua posizione',
  blocchi:[
  {t:'reveal', title:'Il significato fisico di $F$: il lavoro massimo estraibile', tag:'derivazione', steps:[
   {label:'La disuguaglianza', body:R`<p>Si faccia subire al sistema una trasformazione <b>isoterma</b> arbitraria — non necessariamente reversibile — dallo stato $A$ allo stato $B$. Dalla proprietà (a) del secondo principio, e poiché $T$ è costante lungo l&rsquo;isoterma e si può portare fuori dall&rsquo;integrale,
   $$\int_A^B\frac{\delta Q}{T}\le S(B)-S(A)\quad\Longrightarrow\quad \frac{\Delta Q}{T}\le\Delta S\quad\Longrightarrow\quad \Delta Q\le T\,\Delta S.$$
   Sostituendo il primo principio nella forma $\Delta Q=\Delta U+W$ (con $W$ il lavoro svolto <i>dal</i> sistema):
   $$\Delta U+W\le T\,\Delta S\quad\Longrightarrow\quad W\le-\Delta U+T\,\Delta S=-\Delta F.$$</p>`},
   {label:'Che cosa dice, ed è forte', body:R`<p>$$\boxed{W\le-\Delta F\qquad\text{(trasformazione isoterma)}}$$
   <b>In una trasformazione isoterma, la diminuzione dell&rsquo;energia libera di Helmholtz è il massimo lavoro che il sistema può svolgere</b>, e il massimo è raggiunto se e solo se la trasformazione è reversibile. È il motivo del nome: di tutta l&rsquo;energia interna, solo la parte $U-TS$ è «libera» di diventare lavoro; la parte $TS$ è vincolata.</p>
   <p>Si noti quanto è diverso dal primo principio. Il primo principio dice che il lavoro non può superare l&rsquo;energia fornita; questo dice che <b>non può superare nemmeno l&rsquo;energia libera</b>, che è meno. La differenza fra i due limiti è esattamente il calore che va disperso nel serbatoio, ed è il prezzo termodinamico dell&rsquo;irreversibilità.</p>`},
   {label:'E da qui il principio di minimo', body:R`<p>Se il sistema <b>non svolge lavoro</b> ($W=0$) e la trasformazione è isoterma, la disuguaglianza diventa
   $$\Delta F\le0:$$
   <b>a $T$ e $V$ costanti, $F$ non può che diminuire, quindi all&rsquo;equilibrio è minima.</b> Lo stesso ragionamento a $T$ e $P$ costanti dà il risultato per $G$: a pressione costante il lavoro è $W=P\,\Delta V$, quindi da $W\le-\Delta F$ segue $P\,\Delta V+\Delta F\le0$, cioè $\Delta(F+PV)\le0$, cioè
   $$\Delta G\le0.$$
   <b>A $T$ e $P$ costanti, all&rsquo;equilibrio è minimo il potenziale di Gibbs.</b></p>
   <p>Vale la pena notare il capovolgimento. Per un sistema <i>isolato</i> il criterio era <b>massimo</b> di $S$ (tappa 02); per un sistema a contatto con un bagno diventa <b>minimo</b> di $F$ o di $G$. Non sono due principi diversi: è lo stesso principio visto dopo una trasformata di Legendre, che scambia la convessità — come si vede nel segno di $\psi=-p^{2}/4$ della tappa 05. Il sistema più il bagno, insieme, massimizzano l&rsquo;entropia totale; guardando il solo sistema, quella massimizzazione si legge come una minimizzazione.</p>`}
  ]},
  {t:'prosa', title:'Il pistone che trova la sua posizione: il principio in atto', tag:'esempio svolto, dalle note del docente', html:R`
  <p>L&rsquo;esempio che Sciortino usa per rendere concreto il principio di minimo è breve e vale la pena rifarlo per intero, perché il metodo si ripete in ogni problema di equilibrio.</p>
