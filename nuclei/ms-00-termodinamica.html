  <p><b>Il problema.</b> Un gas in un cilindro è tenuto a temperatura costante. Un pistone scorrevole divide il volume totale $V$ in due parti $V_1$ e $V_2$, con pressioni $P_1$ e $P_2$. Il pistone viene lasciato libero di scorrere: qual è la sua posizione di equilibrio?</p>
  <p><b>La soluzione.</b> A $T$ e $V$ totali fissati, l&rsquo;equilibrio minimizza $F$ dell&rsquo;intero sistema. Se l&rsquo;equilibrio è stabilito, uno spostamento infinitesimo del pistone non deve cambiare $F$ — è la condizione di stazionarietà, $\delta F=0$. Ora $F$ è funzione di $V_1$, $V_2$ e $T$, quindi
  $$0=\delta F=\left(\frac{\partial F}{\partial V_1}\right)_{T}dV_1+\left(\frac{\partial F}{\partial V_2}\right)_{T}dV_2.$$
  Il vincolo è $V_1+V_2=V$ costante, quindi $dV_1=-dV_2$, e sostituendo
  $$\left(\frac{\partial F}{\partial V_1}\right)_{T}=\left(\frac{\partial F}{\partial V_2}\right)_{T}.$$
  Ma $(\partial F/\partial V)_T=-P$ dal quadrato di Maxwell, e dunque
  $$P_1=P_2.$$</p>
  <p><b>Perché l&rsquo;esempio è istruttivo e non banale.</b> La risposta — le pressioni si equalizzano — era ovvia dalla meccanica: un pistone libero si ferma quando le forze sulle due facce si bilanciano. Il punto è che <b>qui è stata ottenuta senza parlare di forze</b>, dalla sola minimizzazione di un potenziale sotto un vincolo. È il prototipo di tutti i problemi di equilibrio in cui la risposta meccanica <i>non</i> è ovvia: due fasi che coesistono, una reazione chimica che si arresta, un gas che si ripartisce fra due volumi a temperature diverse. In quei casi si scrive lo stesso $\delta(\text{potenziale})=0$ col vincolo, e si legge quale grandezza intensiva si equalizza. <b>La regola generale</b>: minimizzando a $V$ totale fissato si equalizza $P$; a $E$ totale fissato si equalizza $T$; a $N$ totale fissato si equalizza $\mu$. Le tre condizioni di equilibrio — termico, meccanico, chimico — sono tre volte questo conto.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Un sistema isolato massimizza $S$; uno a contatto con un bagno minimizza $F$. Sono due principi o uno?`,
    a:R`<b>Uno.</b> Il sistema totale (sistema + bagno) è isolato e massimizza l&rsquo;entropia totale $S_{\rm tot}=S+S_{\rm bagno}$. Poiché il bagno è grande, il calore $\delta Q$ che riceve gli cambia l&rsquo;entropia di $\delta Q/T$ con $T$ fissa, e $\delta Q$ è ciò che il sistema perde, cioè $-\Delta U$ (a volume costante). Quindi $\Delta S_{\rm tot}=\Delta S-\Delta U/T=-\Delta F/T$: <b>massimizzare $S_{\rm tot}$ è minimizzare $F$</b>, e il segno meno viene dalla divisione per $T>0$. È letteralmente la stessa condizione scritta in variabili diverse, ed è la ragione per cui in ms-04 il canonico si ricaverà marginalizzando il microcanonico su un sottosistema.`},
   {q:R`Un processo isotermo ha $\Delta F=-100$ J e svolge $80$ J di lavoro. Che si può dire?`,
    a:R`Che il processo è <b>possibile e irreversibile</b>: rispetta $W\le-\Delta F$ ($80\le100$), ma non con l&rsquo;uguaglianza. I $20$ J mancanti sono andati nel serbatoio come calore in eccesso rispetto al minimo, e corrispondono a una produzione di entropia $\Delta S_{\rm prod}=20/T$. Se invece si leggesse $W=120$ J il processo sarebbe <b>impossibile</b>: violerebbe il secondo principio pur rispettando il primo, ed è esattamente il tipo di errore che $W\le-\Delta F$ intercetta e $\Delta U=\Delta Q-\Delta W$ no.`}
  ]}
]},

/* ---------------- 07 · LE DERIVATE CHE SI USANO SEMPRE ---------------- */
{ num:'07', title:'Le derivate che si usano sempre', meta:'Maxwell = Schwarz · le chain relations · $C_P-C_V$ ricavata · e i controlli di sanità',
  blocchi:[
  {t:'prosa', title:'Le relazioni di Maxwell non sono da imparare a memoria', tag:'grammatica', html:R`
  <p>Ogni potenziale è una funzione liscia di due variabili, quindi le sue derivate seconde miste commutano (<span class="str" data-str="teorema-di-schwarz">Schwarz</span>). Applicato a $F(T,V)$:
  $$\frac{\partial^{2}F}{\partial V\,\partial T}=\frac{\partial^{2}F}{\partial T\,\partial V} \;\Longrightarrow\; \left(\frac{\partial S}{\partial V}\right)_{T}=\left(\frac{\partial P}{\partial T}\right)_{V},$$
  perché $S=-\partial F/\partial T$ e $P=-\partial F/\partial V$. <b>Questa è una relazione di Maxwell</b>, e le altre tre si ottengono facendo lo stesso su $U$, $H$, $G$. Non c&rsquo;è niente da memorizzare: c&rsquo;è da sapere quali sono le variabili naturali del potenziale e derivare due volte. Da $G(T,P)$, per esempio, esce $\left(\partial S/\partial P\right)_{T}=-\left(\partial V/\partial T\right)_{P}$ — la relazione che nella tappa 04 ha dato $\alpha\to0$ allo zero assoluto.</p>
  <p>A cosa servono in pratica: a sostituire una derivata <b>impossibile da misurare</b> con una misurabile. $(\partial S/\partial V)_T$ non si misura — nessuno strumento legge l&rsquo;entropia — mentre $(\partial P/\partial T)_V$ è un manometro e un termometro. Sul gas ideale entrambe valgono $Nk/V$, e il conto lo verifica in due righe derivando $F$ nei due ordini.</p>`},
  {t:'reveal', title:'Le chain relations, e a cosa servono davvero', tag:'strumento di calcolo', steps:[
   {label:'Le tre identità', body:R`<p>Per una funzione implicita $f(x,y,z)=0$ — e l&rsquo;equazione di stato è esattamente di questa forma — valgono tre identità fra derivate parziali, che Sciortino elenca come strumento di lavoro. Detta $w$ una funzione di una coppia fra $x,y,z$:
   $$\left(\frac{\partial x}{\partial y}\right)_{w}\left(\frac{\partial y}{\partial z}\right)_{w}=\left(\frac{\partial x}{\partial z}\right)_{w},$$
   $$\left(\frac{\partial x}{\partial y}\right)_{z}\left(\frac{\partial y}{\partial x}\right)_{z}=1,$$
   $$\left(\frac{\partial x}{\partial y}\right)_{z}\left(\frac{\partial y}{\partial z}\right)_{x}\left(\frac{\partial z}{\partial x}\right)_{y}=-1.$$
   <b>La terza è quella che sorprende</b>, per il segno meno: tre derivate cicliche non danno $+1$ ma $-1$. Il motivo è che nella catena il pedice cambia a ogni fattore, cioè si sta cambiando <i>quale</i> variabile si tiene ferma, e quel cambio costa un segno.</p>`},
   {label:'Le tre funzioni di risposta', body:R`<p>Si definiscono le tre quantità direttamente misurabili:
   $$\alpha=\frac1V\left(\frac{\partial V}{\partial T}\right)_{P}\ \text{(dilatazione)},\quad K_T=-\frac1V\left(\frac{\partial V}{\partial P}\right)_{T}\ \text{(compressibilità isoterma)},\quad K_S=-\frac1V\left(\frac{\partial V}{\partial P}\right)_{S}\ \text{(adiabatica)}.$$
   Il segno meno in $K_T$ e $K_S$ è messo perché il volume <i>cala</i> quando la pressione sale: così le compressibilità sono positive. Con le chain relations si riscrivono le due forme del $T\,dS$:
   $$T\,dS=C_V\,dT+\frac{\alpha T}{K_T}\,dV,\qquad T\,dS=C_P\,dT-\alpha T V\,dP,$$
   che sono l&rsquo;attrezzo con cui si calcola una variazione di entropia da quantità misurate.</p>`},
   {label:'E il risultato che ne segue: $C_P-C_V$', body:R`<p>Uguagliando le due espressioni di $T\,dS$ e ragionando lungo un cammino a $P$ costante si ottiene l&rsquo;identità generale
   $$C_P-C_V=\frac{TV\alpha^{2}}{K_T},$$
   valida per <b>qualunque</b> sostanza. Tre conseguenze immediate, e nessuna richiede un modello: il membro di destra è un quadrato diviso per una quantità positiva, quindi <b>$C_P\ge C_V$ sempre</b>; l&rsquo;uguaglianza vale solo se $\alpha=0$, cioè per una sostanza che non si dilata; e per $T\to0$ la differenza svanisce, coerentemente con il terzo principio che manda a zero sia $\alpha$ sia i due calori specifici.</p>
   <p><b>Sul gas ideale si verifica in tre righe.</b> Da $V=NkT/P$:
   $$\alpha=\frac1V\left(\frac{\partial (NkT/P)}{\partial T}\right)_{P}=\frac{Nk}{PV}=\frac1T,\qquad K_T=-\frac1V\left(\frac{\partial (NkT/P)}{\partial P}\right)_{T}=\frac{NkT}{P^{2}V}=\frac1P,$$
   dove la derivata rispetto a $P$ è $-NkT/P^{2}$ e il segno meno della definizione la rende positiva. Quindi
   $$C_P-C_V=\frac{TV\alpha^{2}}{K_T}=\frac{T\,V\,(1/T)^{2}}{1/P}=\frac{PV}{T}=Nk,$$
   cioè $C_P-C_V=Nk$ — la relazione di Mayer. Per il monoatomico, con $C_V=\tfrac32Nk$, si ha $C_P=\tfrac52Nk$ e quindi $\gamma=C_P/C_V=5/3$: <b>l&rsquo;esponente dell&rsquo;adiabatica della tappa 03 è stato ora ricavato, non assunto</b>.</p>`}
  ]},
  {t:'plot', title:'Perché $C_P>C_V$, in una figura',
   intro:'Un’isoterma e un’adiabatica per lo stesso punto nel piano $V$-$P$. La differenza di pendenza è la ragione geometrica della relazione di Mayer.',
   plots:[
    {kind:'func2d', xr:[0.6,2.6], yr:[0.2,2.6], equal:false,
     curves:[
      {f:'1.5/x', col:'#ff9b6b', label:'isoterma: P ~ 1/V, pendenza -P/V'},
      {f:'1.5/pow(x,5/3)', col:'#b98cff', label:'adiabatica: P ~ V^(-5/3), pendenza -gamma P/V'}
     ],
     marks:[{x:1, y:1.5, label:'stesso stato di partenza', col:'#ffffff'}],
     title:'a parita di aumento di volume, l adiabatica perde piu pressione'}
   ],
   leggi:R`<p><b>Che cosa guardare</b>: le due curve partono dallo stesso stato e si separano. Espandendo dello stesso $\Delta V$, l&rsquo;adiabatica scende più in basso, cioè <b>perde più pressione</b>. La ragione è che sull&rsquo;adiabatica il gas non riceve calore e quindi si raffredda: la pressione cala per due motivi invece di uno.</p>
   <p><b>Perché questa figura spiega $C_P>C_V$.</b> Si scaldi il gas di $dT$ a volume costante: tutto il calore va in energia interna, e ne serve $C_V\,dT$. Si scaldi ora di $dT$ a <i>pressione</i> costante: il gas, dilatandosi, <b>svolge lavoro $P\,dV$ verso l&rsquo;esterno</b>, e quel lavoro va fornito in più. Perciò $C_P\,dT=C_V\,dT+P\,dV$, e per il gas ideale $P\,dV=Nk\,dT$, da cui $C_P-C_V=Nk$. <b>La figura è la versione geometrica di questo bilancio</b>: la pendenza maggiore dell&rsquo;adiabatica è la stessa $\gamma>1$ che compare nel rapporto dei calori specifici, e vale anche l&rsquo;identità $\gamma=K_T/K_S$.</p>
   <p><b>Il caso generale non richiede il gas ideale</b>: $C_P-C_V=TV\alpha^{2}/K_T$ è positiva per ogni sostanza, perché è un quadrato diviso per una compressibilità positiva. L&rsquo;unico modo di avere $C_P=C_V$ è $\alpha=0$ — e succede davvero, nell&rsquo;acqua a $4$ gradi Celsius, dove la densità è massima e la dilatazione cambia segno.</p>`},
  {t:'prosa', title:'Le funzioni di risposta, e cosa la statistica dirà di loro', tag:'il ponte verso le fluttuazioni', html:R`
  <p>Raccogliendo, per il gas ideale monoatomico: $C_V=\tfrac32 Nk$ costante — e per questo <b>viola il terzo principio</b>; $\kappa_T=1/P$; $\alpha=1/T$. Nessuna di queste tre dipende da dettagli microscopici, e tutte si misurano.</p>
  <p>La termodinamica dice che queste quantità sono <b>positive</b> — sia i calori specifici sia le compressibilità: è la condizione di stabilità dell&rsquo;equilibrio, e un risultato statistico che le facesse venire negative sarebbe sbagliato, oppure descriverebbe un sistema instabile che sta per separarsi in due fasi.</p>
  <p><b>Ma la meccanica statistica dirà qualcosa di più forte, e qui va solo annunciato.</b> Ognuna di queste risposte risulterà uguale a una <b>fluttuazione</b>: $C_V$ alla varianza dell&rsquo;energia, $\kappa_T$ alla varianza del numero di particelle. La positività smetterà di essere un postulato di stabilità e diventerà una banalità — una varianza è un quadrato. È il punto in cui la termodinamica cessa di essere il bersaglio e diventa un <i>corollario</i>, ed è anche la ragione per cui un calore specifico negativo, quando si incontra, segnala che la distribuzione di probabilità sottostante non esiste come si credeva.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Un conto statistico produce, per un certo sistema, $C_V<0$. Prima di rifare il conto: cosa si può già dire?`,
    a:R`Che <b>o il conto è sbagliato, o il sistema non è in equilibrio stabile</b> — e la seconda possibilità è reale (i sistemi autogravitanti hanno $C_V<0$, e per questo una stella si scalda quando perde energia). In un esercizio d&rsquo;esame su un gas non interagente in un potenziale confinante, però, il sistema <i>è</i> stabile: $C_V<0$ significa errore. È il tipo di controllo che costa cinque secondi e salva un esercizio, e vale la pena farlo prima di consegnare, perché la termodinamica vincola il risultato <b>senza</b> rifare il calcolo.`},
   {q:R`Come si verifica in trenta secondi che una $S$ appena calcolata non è assurda?`,
    a:R`Tre controlli, in ordine di costo. <b>(1) Estensività</b>: nella forma operativa della tappa 01, $S$ deve essere $N s(P,N/V,T)$ — quindi $V$ deve comparire come $V/N$, mai da solo (è il paradosso di Gibbs). <b>(2) Segno di $\partial S/\partial T$</b>: deve essere positivo, perché $T\,\partial S/\partial T$ è il calore specifico, che è positivo. <b>(3) Limite $T\to0$</b>: $S$ deve tendere a una costante; se diverge a $-\infty$ (come fa Sackur&ndash;Tetrode) si è fuori dal dominio di validità classico, e la risposta giusta all&rsquo;orale non è «ho sbagliato» ma «qui serve la statistica quantistica, e il terzo principio dice esattamente perché».`},
   {q:R`Perché la terza chain relation ha un segno meno, mentre la seconda dà $1$?`,
    a:R`Perché nella seconda il pedice <b>non cambia</b>: $(\partial x/\partial y)_z$ e $(\partial y/\partial x)_z$ sono derivate della stessa relazione fra $x$ e $y$ a $z$ fisso, quindi sono reciproche e il prodotto è $1$. Nella terza il pedice cambia a ogni fattore — si tiene fermo prima $z$, poi $x$, poi $y$ — quindi non si sta componendo derivate della stessa funzione di una variabile. <b>Il modo rapido di convincersi</b> è provarla sul gas ideale con $x=P$, $y=V$, $z=T$: $(\partial P/\partial V)_T=-NkT/V^{2}$, $(\partial V/\partial T)_P=Nk/P$, $(\partial T/\partial P)_V=V/Nk$, e il prodotto è $-NkT/(PV)=-1$. Il segno viene dalla derivata a $T$ costante, l&rsquo;unica in cui pressione e volume vanno in direzioni opposte.`}
  ]}
]},

/* ---------------- 08 · IL BERSAGLIO, MOVIMENTO PER MOVIMENTO ---------------- */
{ num:'08', title:'Il bersaglio, movimento per movimento', meta:'cosa ciascuno dei quattordici movimenti dovrà far tornare · da rileggere prima di ognuno',
  blocchi:[
  {t:'prosa', title:'La lista dei debiti che il corso contrae qui', tag:'sintesi operativa', html:R`
  <p>Ogni riga è un conto che un movimento successivo dovrà chiudere. Non sono anticipazioni: sono <b>condizioni di correttezza</b>, e conviene rileggere la riga corrispondente prima di affrontare il movimento.</p>
  <table>
  <tr><th>movimento</th><th>deve far tornare</th></tr>
  <tr><td><b>ms-04</b> microcanonico</td><td>$S=k\ln\Omega$ additiva, e l&rsquo;equipartizione $U=\tfrac32NkT$ per il gas ideale</td></tr>
  <tr><td><b>ms-05</b> entropia</td><td>l&rsquo;estensività di $S$ (paradosso di Gibbs), e $dS\ge0$ come enunciato probabilistico</td></tr>
  <tr><td><b>ms-06</b> canonico</td><td>$F=-kT\ln Z$, e da lì $P=NkT/V$ e Sackur&ndash;Tetrode</td></tr>
  <tr><td><b>ms-07</b> mestiere del canonico</td><td>i $Z$ di sistemi concreti, e per ciascuno il confronto con $C_P-C_V=TV\alpha^{2}/K_T$</td></tr>
  <tr><td><b>ms-08</b> fluttuazioni</td><td>$C_V=\langle\Delta E^{2}\rangle/kT^{2}$, che <b>spiega</b> perché $C_V>0$</td></tr>
  <tr><td><b>ms-10</b> gran canonico</td><td>$\Omega=-kT\ln\Xi$ e l&rsquo;identità $\Omega=-PV$; e l&rsquo;insieme $NPT$ come terza scelta, con $G$ al posto di $\Omega$</td></tr>
  <tr><td><b>ms-12</b> gas di Fermi</td><td>$C_V\propto T$ a bassa temperatura: si annulla, come il terzo principio <i>esige</i></td></tr>
  <tr><td><b>ms-13</b> condensazione</td><td>una transizione di fase, cioè una non-analiticità dei potenziali qui definiti</td></tr>
  <tr><td><b>ms-14</b> corpo nero</td><td>la legge di Stefan&ndash;Boltzmann, e $C_V\propto T^{3}$ per i fononi</td></tr>
  </table>
  <p><b>Il filo.</b> Tre delle nove righe riguardano $C_V$ a bassa temperatura, e non è un caso: <b>il gas ideale classico viola il terzo principio</b>, e tutto il secondo tempo del corso — statistiche quantistiche, Fermi, Bose, fononi — è la riparazione di quella singola violazione. La derivazione della tappa 04 dice esattamente perché quella violazione è fatale e non cosmetica: manda a $-\infty$ l&rsquo;entropia. Chi tiene in mente questa frase ha l&rsquo;architettura del corso in una riga, e sa perché il programma ha quella forma.</p>`},
  {t:'prosa', title:'Che cosa di questo movimento cade allo scritto, e che cosa all’orale', tag:'economia dello studio', html:R`
  <p>Vale la pena essere espliciti, perché cambia come si usa questa pagina. Sulle <b>17 prove scritte</b> della squadra che tiene il corso, questo movimento compare in $3$, e mai come domanda: nessun compito chiede «enuncia il secondo principio» o «ricava $C_P-C_V$». Quello che i compiti chiedono è di <i>calcolare</i> $C_V$, $P$, $S$ per un sistema assegnato, usando gli strumenti dei movimenti successivi.</p>
  <p><b>All&rsquo;orale la situazione si capovolge.</b> I tre principi, la costruzione dei potenziali, il significato di $F$ come lavoro massimo, le relazioni di Maxwell e il terzo principio nella forma $C\to0$ sono esattamente il genere di domanda che un orale fa per capire se il formalismo è compreso o eseguito a memoria. Le derivazioni di questo movimento sono tutte brevi — il teorema di Clausius che genera $S$, il terzo principio che genera $C\to0$, Legendre come intercetta — e sono <b>tutte dicibili a voce in tre minuti</b>. È il miglior rapporto fra tempo di studio e copertura d&rsquo;esame di tutto il corso: si studiano una volta e coprono una domanda d&rsquo;orale intera.</p>
  <p><b>La cosa che invece va tenuta a portata di mano durante lo scritto</b> è la tabella dei potenziali e la lista dei tre controlli di sanità: estensività nella forma $N\,s(P,N/V,T)$, positività delle risposte, limite a $T\to0$. Tre controlli, trenta secondi, e intercettano la maggior parte degli errori di conto prima che diventino una risposta sbagliata consegnata.</p>`},
  {t:'prolessi', title:'Dove va, da qui',
   oggetto:R`<b>La termodinamica come vincolo</b>: un insieme di identità fra derivate che qualunque teoria microscopica deve riprodurre, e che si usa per controllare i risultati invece che per ottenerli.`,
   rotte:[
    {dove:'Fondamenti<br>dinamici', txt:R`Lo spazio delle fasi, il teorema di Liouville, l&rsquo;ipotesi ergodica: il ponte fra la dinamica microscopica e le medie d&rsquo;insieme. È la risposta alla domanda «con che diritto si media», che qui è rimasta aperta.`},
    {dove:'Gli ensemble', txt:R`I tre ensemble, ciascuno con il suo potenziale naturale. La tabella della tappa 05 diventa un teorema per volta: il microcanonico produce $U$, il canonico $F$, il gran canonico $\Omega$.`},
    {dove:'Statistica<br>quantistica', txt:R`Dove la termodinamica classica si rompe — $C_V$ che non si annulla, entropia che diverge a $T\to0$ — e dove la statistica quantistica la ripara, con i due andamenti $C\propto T$ e $C\propto T^{3}$ della figura della tappa 04.`},
    {dove:'Meccanica<br>Quantistica', txt:R`Lo stesso semestre, lo stesso cerchio: il corpo nero è la crisi da cui la meccanica quantistica parte. Chi segue i due corsi insieme arriva al corpo nero due volte, da due direzioni — e qui il terzo principio dice in anticipo <i>perché</i> quella crisi era inevitabile.`}
   ],
   domanda:R`<b>La domanda da tenere aperta mentre si studia il resto.</b> La termodinamica è stata costruita nell&rsquo;Ottocento senza sapere nulla di atomi, e regge. Come può una teoria essere <i>giusta</i> ignorando completamente ciò di cui parla?<br><br>La risposta che il corso costruisce è che la termodinamica è una <b>teoria efficace</b>: descrive ciò che sopravvive alla media su $10^{23}$ gradi di libertà, e ciò che sopravvive dipende pochissimo dai dettagli microscopici. È la stessa ragione per cui l&rsquo;equazione di stato del gas ideale vale per l&rsquo;elio e per l&rsquo;azoto, e per cui il rendimento di Carnot non dipende dalla sostanza. Tenere la domanda aperta serve a non leggere i quattordici movimenti come una derivazione dal basso soltanto: sono anche la spiegazione di <b>perché il basso non si vede</b>.<br><br>E c&rsquo;è un secondo verso della stessa domanda, che è quello che il corso rende affrontabile: <i>dove</i> la termodinamica smette di funzionare. Le sue derivazioni assumono estensività, e quindi forze a corto raggio; assumono equilibrio, e quindi cammini reversibili fra stati. Un sistema autogravitante viola la prima — e infatti ha $C_V<0$ — mentre un vetro viola la seconda: non è in equilibrio, e la sua entropia dipende da come lo si è raffreddato. Sono i due luoghi in cui la meccanica statistica moderna lavora, ed è anche il territorio del docente di questo corso.`}
]}

];

var byId = {}; TAPPE.forEach(function(s){ byId[s.num]=s; });

var VKEY='pm-nucleoms-00-visited';
function loadSeen(){ try{ return new Set(JSON.parse(localStorage.getItem(VKEY)||'[]')); }catch(e){ return new Set(); } }
function saveSeen(s){ try{ localStorage.setItem(VKEY, JSON.stringify(Array.from(s))); }catch(e){} }
var SEEN = loadSeen();

function renderNav(active){
  var nav=document.getElementById('sidebar');
  nav.innerHTML='';
  var h=document.createElement('h2'); h.textContent='Nucleo ms-00 · le tappe'; nav.appendChild(h);
  TAPPE.forEach(function(s){
    var b=document.createElement('button');
    b.className='navitem'+(active===s.num?' active':'')+(SEEN.has(s.num)?' seen':'');
    b.innerHTML='<span class="dot"></span><span class="nx">'+s.num+'</span><span>'+s.title+'</span>';
    b.onclick=function(){ showTappa(s.num); };
    nav.appendChild(b);
  });
}

/* ---- renderer dei blocchi ---- */
function sectionProsa(title, tag, html){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var body=elFromHTML('<div class="open-body">'+html+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function sectionGram(title, rows){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag gramtag">grammatica</span></h3>';
  var inner='<table class="gramtab">';
  rows.forEach(function(r){ inner+='<tr><td class="gs">'+r[0]+'</td><td>'+r[1]+'</td></tr>'; });
  inner+='</table>';
  var body=elFromHTML('<div class="gramwrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
/* --- blocco PLOT: la figura non decora, si legge. Ogni plot porta una chiave di lettura. --- */
function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';
  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionSvelabile(title, tag, html, sol){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var c=document.createElement('div'); c.className='collaudo-item';
  var q=document.createElement('div'); q.className='cq'; q.innerHTML=html||'';
  c.appendChild(q); typeset(q);
  if(sol){
    var a=document.createElement('div'); a.className='ca'; a.style.display='none';
    a.innerHTML='<b>Soluzione.</b> '+sol;
    var btn=document.createElement('button'); btn.className='reveal-btn small';
    btn.textContent='Rivela la soluzione';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a);
      btn.disabled=true; btn.classList.add('done'); btn.textContent='Soluzione rivelata'; };
    c.appendChild(btn); c.appendChild(a);
  }
  wrap.appendChild(c); return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    /* DUE SCHEMI, NON UNO — scoperto il 2026-10-06 provando le pagine vive. I movimenti
       scritti per primi (em-01..03, me-10b, i collaudi di gd-01..09 e di quattro em)
       usano una forma piu' semplice: `reveal` e `prolessi` con un solo `html`,
       `esercizio` e `collaudo` con `html` + `sol`. Il renderer ne conosceva una sola e
       chiamava `steps.forEach` su `undefined`: TypeError, e la tappa si fermava li' —
       62 blocchi in 17 movimenti su 74. Non si riscrive il contenuto per far contento
       il renderer: e' il renderer che deve leggere cio' che c'e'.
       E in fondo un ramo che NON muore: uno schema nuovo di domani deve far vedere un
       avviso in quella sezione, non spegnere la pagina sotto di se'. */
    try{
      if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
      else if(b.t==='prolessi') m.appendChild(b.rotte ? sectionProlessi(b)
                                   : sectionProsa(b.title,'prolessi',b.html));
      else if(b.t==='reveal')m.appendChild(b.steps ? sectionReveal(b.title,b.tag,b.steps)
                                   : sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='esercizio') m.appendChild(b.steps ? sectionEsercizio(b)
                                   : sectionSvelabile(b.title,'esercizio',b.html,b.sol));
      else if(b.t==='collaudo')  m.appendChild(b.items ? sectionCollaudo(b.title,b.items)
                                   : sectionSvelabile(b.title,'provi, poi riveli',b.html,b.sol));
      else if(b.t==='plot')      m.appendChild(sectionPlot(b));
      else m.appendChild(sectionProsa(b.title||'(blocco)', 'tipo sconosciuto: '+b.t,
                                      b.html||''));
    }catch(err){
      var avv=document.createElement('section'); avv.className='section';
      avv.innerHTML='<h3>'+(b.title||'(blocco)')+'<span class="tag">non reso</span></h3>'
        +'<p style="color:#ff6b6b">Questo blocco non si &egrave; potuto rendere ('
        +b.t+': '+err.message+'). Il resto della tappa continua sotto.</p>';
      m.appendChild(avv);
    }
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* I POP-UP DEGLI STRUMENTI. `cablaStrumenti` esisteva dal 18-09 e non la chiamava
     nessuno: i 229 rimandi del percorso erano <span> senza handler, e il clic non
     faceva niente. Nessun controllo poteva vederlo — la sintassi era valida, le schede
     c'erano tutte, le formule rendevano: il guasto esisteva solo a pagina viva. Qui, e
     dopo ogni inserimento successivo, perche' la tappa si rimonta da capo a ogni
     cambio e gli handler vanno riattaccati al DOM nuovo. */
  cablaStrumenti(m);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}
