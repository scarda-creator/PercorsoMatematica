<style>
  :root{
    --bg:#0e1117; --panel:#161b22; --panel2:#1c232d; --border:#2b333d;
    --txt:#eef3f8; --muted:#b9c4d1; --accent:#4c8dff; --accent2:#8fb0ff;
    --ok:#2ea043; --okbg:#10331b; --warn:#d8a13a; --warnbg:#332a10;
    --gram:#5eead4; --grambg:#0f2a26;
    --pro:#b98cff; --probg:#1a1430; --proline:#2a2247; --proedge:#3a2d5c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    font-size:17px;line-height:1.55;}

  .banner{background:var(--panel2);border-bottom:1px solid var(--border);color:var(--muted);

  .shell{display:flex;max-width:1180px;margin:0 auto;align-items:flex-start;}

  .navitem.active{background:#13233f;border-color:var(--accent);color:#fff;}
  .navitem .dot{width:7px;height:7px;border-radius:50%;background:transparent;flex:0 0 7px;
    border:1px solid var(--border);}
  .navitem.seen .dot{background:var(--ok);border-color:var(--ok);}
  .navitem .nx{color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto;}

  /* ---- MAIN ---- */
  .main{flex:1 1 auto;min-width:0;padding:24px 30px 90px;max-width:860px;}
  h1{font-size:1.5rem;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:.92rem;margin:0 0 18px;}
  .sfhead{border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:8px;}
  .sfhead h1{font-size:1.55rem;}
  .meta{color:var(--muted);font-size:.82rem;margin-top:6px;}

  .section{margin:26px 0;}
  .section > h3{font-size:1.02rem;color:var(--accent2);margin:0 0 10px;
    display:flex;align-items:center;gap:10px;}

    border:1px solid var(--border);color:var(--muted);padding:2px 8px;border-radius:20px;

  .section > h3 .tag.plottag{background:#101f2e;border-color:#1f3c57;color:#7ab8e0;}
  .plot-intro{color:var(--muted);font-size:.95rem;margin:0 0 12px;}
  .plot-row{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;
    background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;}
  .plot-row.due .plot-box{flex:1 1 300px;min-width:280px;}
  .plot-box{max-width:560px;}
  .plot-leggi{margin-top:10px;background:var(--panel2);border:1px solid var(--border);

  .plot-err{color:#ff6b6b;font-size:.85rem;}
  .open-body{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}

  .note{background:var(--panel2);border-left:3px solid var(--muted);border-radius:6px;

  .note.warn{background:var(--warnbg);border-left-color:var(--warn);color:#e0b85a;}
  .note.warn b{color:#f0c25a;}

  /* ---- GRAMMATICA ---- */
  .gramwrap{background:var(--grambg);border:1px solid #1f4d47;border-radius:12px;padding:6px 6px;}
  table.gramtab{border-collapse:collapse;width:100%;font-size:.92rem;}
  table.gramtab td{padding:9px 12px;vertical-align:top;border-bottom:1px solid #17332e;}
  table.gramtab tr:last-child td{border-bottom:none;}
  table.gramtab td.gs{white-space:nowrap;color:var(--gram);width:1%;
    border-right:1px solid #17332e;font-variant-numeric:tabular-nums;}
  .section > h3 .tag.gramtag{background:var(--grambg);border-color:#1f4d47;color:var(--gram);}

  /* ---- STRUMENTI (repertorio condiviso: la scheda si apre DENTRO la frase) ----
     Nessun accento nuovo: riusa il verde della grammatica, perche' uno strumento
     richiamato e' grammatica gia' spiegata altrove, non una quinta specie di blocco. */
  .str{color:var(--gram);border-bottom:1px dashed var(--gram);cursor:pointer;}
  .str:hover{background:var(--grambg);}
  .str::after{content:"\2666";font-size:.62em;vertical-align:.42em;margin-left:2px;opacity:.8;}
  .str.aperto::after{content:"\2715";}
  .str.rotto{color:#ff6b6b;border-bottom-color:#ff6b6b;cursor:help;}
  /* la scheda e' uno SPAN in display:block, non un div: i rimandi cadono dentro
     <p>, <li> e celle di tabella, dove un div e' HTML illegale. */
  .strcard{display:block;margin:10px 0;background:var(--grambg);border:1px solid #1f4d47;
    border-left:3px solid var(--gram);border-radius:0 10px 10px 0;padding:10px 14px;font-size:.9rem;}
  .strcard .sh{display:block;font-size:.66rem;font-weight:700;letter-spacing:.5px;
    text-transform:uppercase;color:var(--gram);margin-bottom:7px;}
  .strcard .sr{display:block;margin:5px 0;}
  .strcard .sk{color:var(--gram);font-weight:600;}

  .prowrap{background:var(--probg);border:1px solid var(--proedge);border-radius:12px;padding:4px 4px 8px;}

  table.protab{border-collapse:collapse;width:100%;font-size:.92rem;}
  table.protab td{padding:10px 12px;vertical-align:top;border-bottom:1px solid var(--proline);}
  table.protab tr:last-child td{border-bottom:none;}
  table.protab td.pd{white-space:nowrap;color:var(--pro);width:1%;font-weight:700;font-size:.78rem;

  .rsteps{display:flex;flex-direction:column;gap:12px;}
  .rstep{background:var(--panel);border:1px solid var(--border);border-radius:12px;

  .rlabel{font-size:.7rem;font-weight:700;letter-spacing:.4px;color:var(--accent);

  .rstep p:first-of-type{margin-top:0;} .rstep p:last-child{margin-bottom:0;}
  .rstep ul{margin:.4em 0;padding-left:1.2em;}
  .testo{background:#13233f;border:1px solid #2b4877;border-radius:12px;padding:14px 18px;margin-bottom:14px;}
  .testo .src{display:block;font-size:.74rem;font-style:italic;color:var(--accent2);margin-bottom:8px;
    text-transform:uppercase;letter-spacing:.3px;}
  .esame-nota{font-size:.9rem;color:var(--muted);font-style:italic;margin-top:12px;padding-left:12px;

  .reveal-btn{background:var(--accent);color:#fff;border:none;padding:11px 18px;border-radius:10px;
    font-size:.95rem;font-weight:600;cursor:pointer;margin-top:14px;transition:.12s;}
  .reveal-btn:hover:not(:disabled){background:var(--accent2);}
  .reveal-btn.small{padding:7px 14px;font-size:.85rem;margin-top:0;background:var(--panel2);
    color:var(--accent2);border:1px solid var(--border);}
  .reveal-btn.small:hover:not(:disabled){border-color:var(--accent);}
  .reveal-btn:disabled,.reveal-btn.done{background:var(--panel2);color:var(--muted);
    border:1px solid var(--border);cursor:default;}

  /* ---- COLLAUDO ---- */
  .collaudo-item{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 18px;margin-bottom:12px;}
  .cq{margin-bottom:10px;}
  .ca{margin-top:12px;background:var(--okbg);border:1px solid #235c33;border-radius:8px;
    padding:10px 14px;font-size:.94rem;}
  .ca b{color:#5fd980;}

  /* ---- PREV / NEXT ---- */
  .prevnext{display:flex;justify-content:space-between;gap:12px;margin-top:40px;
    border-top:1px solid var(--border);padding-top:20px;}
  .pnbtn{flex:1 1 0;background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:12px 16px;cursor:pointer;color:var(--txt);text-align:left;transition:.14s;font:inherit;}
  .pnbtn:hover{border-color:var(--accent);background:var(--panel2);}
  .pnbtn.next{text-align:right;}
  .pnbtn .k{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .pnbtn .t{font-weight:600;color:var(--accent2);}
  .pnbtn:disabled{opacity:.35;cursor:default;border-color:var(--border);background:var(--panel);}

  code{background:var(--panel2);border:1px solid var(--border);border-radius:5px;
    padding:1px 5px;font-size:.85em;color:var(--accent2);}
  .katex{font-size:1.02em;color:var(--txt);} .katex-display{margin:.5em 0;overflow-x:auto;overflow-y:hidden;}

  @media(max-width:860px){
    .shell{flex-direction:column;}
    .sidebar{width:100%;flex:none;position:static;max-height:none;border-right:none;
      border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:4px;}
    .sidebar h2{width:100%;} .navitem{width:auto;}
    .main{padding:20px 16px 80px;}
  }
</style>

<script>
"use strict";
const R = String.raw;

function typeset(el){
  if(el && window.renderMathInElement){
    try{ renderMathInElement(el,{delimiters:[
      {left:'$$',right:'$$',display:true},
      {left:'$',right:'$',display:false}
    ],throwOnError:false}); }catch(e){}

}
function elFromHTML(html){ var d=document.createElement('div'); d.innerHTML=html; return d; }

/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un
   rimando scritto nella prosa:

       <span class="str" data-str="serie-geometrica">la serie geometrica</span>

   Le schede citate da questo nucleo sono cucite qui sotto dal montaggio
   (assembla-nucleo.js): la pagina resta autosufficiente — niente fetch,
   niente sottocartelle da pubblicare — e un rimando a una scheda che non
   esiste FERMA la costruzione invece di arrivare in pagina rotto.
   Apertura: lo stesso gesto del collaudo (si clicca, il pannello compare,
   si typeset una volta sola), portato dentro la frase.
   =================================================================== */
var CORSO = 'meccanica-quantistica';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["trasformata-di-fourier"] = {"nome":"Trasformata di Fourier","riga":"L'operazione $\\hat f(k)=\\int f(x)\\,e^{-ikx}\\,dx$, che riscrive una funzione come sovrapposizione di onde piane e manda la derivata in una moltiplicazione per $ik$.","serve":"È lo strumento che rende ALGEBRICA un'equazione differenziale lineare a coefficienti costanti: con $\\partial_x$ che diventa $ik$, un'equazione differenziale in $x$ diventa un'equazione algebrica in $k$, si risolve, e si antitrasforma. Le due cose da non perdere sono la convenzione dei $2\\pi$, che cambia da testo a testo e va dichiarata una volta, e Plancherel, che dice che la trasformata conserva la norma $L^{2}$ — in fisica, l'energia.","esempio":"La gaussiana $f(x)=e^{-x^{2}/2}$ ha trasformata $\\int_{-\\infty}^{+\\infty}e^{-x^{2}/2}e^{-ikx}\\,dx=\\sqrt{2\\pi}\\,e^{-k^{2}/2}$: ancora una gaussiana, tanto più larga quanto l'originale è stretta. È il caso in cui si vede meglio il principio di indeterminazione come fatto puramente matematico.","pieno":{"file":"15-distribuzioni.html","tappa":"02","come":"le proprietà, la derivata che diventa un prodotto e Plancherel, nel nucleo delle distribuzioni"},"qui":{"elettromagnetismo":{"serve":"Serve appena si scrive un'onda generica invece di una monocromatica: ogni soluzione delle equazioni di Maxwell nel vuoto è una sovrapposizione di onde piane $e^{i(\\mathbf k\\cdot\\mathbf x-\\omega t)}$, e la trasformata è il modo di scomporla. Su ciascuna componente l'equazione delle onde si riduce alla relazione di dispersione, e la propagazione diventa un far girare fasi: ogni modo viaggia da solo, e nel vuoto tutti alla stessa velocità — per questo un impulso non si deforma.","esempio":"La sostituzione $\\partial_x\\to ik$ e $\\partial_t\\to-i\\omega$ manda le derivate seconde in $(ik)^{2}=-k^{2}$ e $(-i\\omega)^{2}=-\\omega^{2}$: l'equazione delle onde diventa $\\omega^{2}=c^{2}k^{2}$, cioè un'equazione di secondo grado al posto di una differenziale, e la sua radice positiva $\\omega=ck$ è la relazione di dispersione del vuoto."}},"controllo":[{"tipo":"integrale","espr":"exp(-x**2/2)*exp(-I*k*x)","var":"x","da":"-oo","a":"oo","vale":"sqrt(2*pi)*exp(-k**2/2)","ipotesi":{"k":"real"},"dove":"esempio","appare":"\\sqrt{2\\pi}\\,e^{-k^{2}/2}"},{"tipo":"uguale","sinistra":"(I*k)**2","vale":"-k**2","ipotesi":{"k":"real"},"dove":"qui.elettromagnetismo.esempio","appare":"-k^{2}"},{"tipo":"uguale","sinistra":"(-I*w)**2","vale":"-w**2","ipotesi":{"w":"real"},"dove":"qui.elettromagnetismo.esempio","appare":"-\\omega^{2}"},{"tipo":"uguale","sinistra":"(c*k)**2","vale":"c**2*k**2","dove":"qui.elettromagnetismo.esempio","appare":"c^{2}k^{2}"}]};
STRUM["elettronvolt"] = {"nome":"Elettronvolt","riga":"L'energia che un elettrone acquista attraversando una differenza di potenziale di un volt: $1\\ \\mathrm{eV}=1{,}602\\cdot10^{-19}$ J; divisa per $c^{2}$ è una massa, $1\\ \\mathrm{eV}/c^{2}=1{,}783\\cdot10^{-36}$ kg.","serve":"A leggere senza conversioni le tabelle in cui la fisica delle particelle e l'astrofisica scrivono le masse a riposo come energie — l'elettrone 0,511 MeV, il protone 938 MeV, il bosone di Higgs 125 GeV. La scelta non è una bizzarria di notazione: in un processo la quantità che si conserva è l'energia, e scrivere la massa già in energia dice a colpo d'occhio quali reazioni sono possibili e quante ne resta per l'energia cinetica o per i fotoni. L'elettronvolt ha anche un secondo mestiere, e in astrofisica è il più usato dei due: convertito in temperatura tramite $k_BT$ dà la scala termica a cui un processo di quella energia diventa frequente, e questo è ciò che permette di dire a che punto della storia dell'universo o a che profondità di una stella un certo processo si accende.","esempio":"Dalla massa del protone espressa come energia, $938{,}3$ MeV, si ricavano i chilogrammi in un passaggio: $m_p=938{,}3\\cdot10^{6}\\cdot1{,}783\\cdot10^{-36}=1{,}673\\cdot10^{-27}$ kg, che è il valore stampato in calce al foglio d'esame. Sul versante termico, $T=\\dfrac{1{,}602\\cdot10^{-19}}{1{,}381\\cdot10^{-23}}=11600$ K: un'energia di un elettronvolt corrisponde a poco più di undicimila kelvin, e siccome ionizzare l'idrogeno costa 13,6 eV si capisce subito perché serva una fotosfera da qualche decina di migliaia di kelvin per trovarlo ionizzato.","pieno":{"file":"as-01-la-scala-del-cosmo.html","tappa":"05","come":"le masse delle particelle elementari scritte come energie, con la conversione in chilogrammi e la gerarchia delle masse, nel movimento sulla scala del cosmo"},"controllo":[{"tipo":"numero","espr":"1.602177e-19/(2.99792458e8)**2*1e36","vale":"1.783","dove":"riga","appare":"1,783\\cdot10^{-36}"},{"tipo":"numero","espr":"938.3e6*1.783e-36*1e27","vale":"1.673","dove":"esempio","appare":"1,673\\cdot10^{-27}"},{"tipo":"numero","espr":"1.602e-19/1.381e-23","vale":"11600","dove":"esempio","appare":"11600"}]};
STRUM["ordini-di-grandezza"] = {"nome":"Ordini di grandezza","riga":"Stimare una quantità alla potenza di dieci giusta: si tiene una cifra significativa, si sommano e si sottraggono gli esponenti, e si controlla che l'unità del risultato sia quella che si voleva.","serve":"A sapere se un risultato è plausibile prima di averlo calcolato con precisione, e ad accorgersi di un errore di impostazione quando c'è ancora tempo per rimediare. In astrofisica non è una comodità ma il modo normale di ragionare, per due ragioni: le grandezze in gioco vanno da $10^{-36}$ kg a $10^{53}$ kg e nessuna intuizione le copre, e i dati osservativi sono noti al dieci o al venti per cento, quindi una cifra significativa è spesso tutto ciò che il problema contiene davvero. Il controllo che smaschera più errori non è sul numero, è sull'**unità**: un conto che dovrebbe dare una densità e dà dei kg è sbagliato nell'impostazione, e nessun affinamento dell'aritmetica lo salverà. La seconda regola è il confronto con un termine noto — l'acqua per una densità, il Sole per una massa o una luminosità, il parsec per una distanza galattica — perché un numero senza metro non dice niente.","esempio":"Densità media del Sole, dalle due sole quantità stampate in calce al foglio d'esame, $M_\\odot=1{,}989\\cdot10^{30}$ kg e $R_\\odot=6{,}957\\cdot10^{8}$ m: $\\rho=\\dfrac{3M_\\odot}{4\\pi R_\\odot^{3}}=1410\\ \\mathrm{kg/m^3}$. Il confronto è immediato e istruttivo: è quasi una volta e mezza l'acqua, cioè il Sole è in media meno denso della Terra — una stella non è un sasso grande, è un gas tenuto insieme dal proprio peso.","pieno":{"file":"as-01-la-scala-del-cosmo.html","tappa":"01","come":"la gerarchia delle strutture cosmiche letta come scala di ordini di grandezza, e il tempo di luce come secondo asse della stessa tabella"},"controllo":[{"tipo":"numero","espr":"3*1.989e30/(4*pi*(6.957e8)**3)","vale":"1410","dove":"esempio","appare":"1410"}]};

function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';
  return h;
}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';

{ num:'00', title:'Di cosa parla questo movimento', meta:'Meccanica Quantistica · voce Q.1 · un solo oggetto da consegnare al resto del corso: l’ampiezza che si somma',
  blocchi:[
  {t:'prosa', title:'Una cosa sola, e il corso ci poggia sopra', tag:'architettura', html:R`
  <p>Questo è il movimento più corto del corso, ed è un movimento di <b>servizio, non di allenamento</b>: nessuno dei quarantasette scritti d&rsquo;esame chiede le due fenditure, perché è materiale d&rsquo;orale e di motivazione. Il suo compito è consegnare al resto del corso <b>un solo oggetto</b> — l&rsquo;ampiezza di probabilità, un numero complesso che si somma <i>prima</i> di diventare probabilità — e togliere di mezzo, una volta per tutte, l&rsquo;idea che la funzione d&rsquo;onda sia un&rsquo;onda di materia che vibra nello spazio.</p>
  <p>La tesi da dimostrare si enuncia in una riga, ed è questa: <b>le due fenditure non chiedono una particella più piccola, chiedono che a sommarsi siano i numeri complessi e non le probabilità.</b> Tutto il resto — lo spazio di Hilbert, gli operatori autoaggiunti, le simmetrie su cui il programma costruisce la teoria — è la macchina che rende rigoroso questo fatto. Ma il fatto viene prima della macchina, ed è un fatto sperimentale: non si deduce, si osserva, e poi si cerca la matematica che lo descrive. Qui facciamo esattamente questo cammino, nello stesso ordine in cui lo fecero Born e de Broglie.</p>
  <p>La lezione centrale è una sottrazione, non un&rsquo;aggiunta. La fisica classica non sbaglia perché le manca un termine: sbaglia perché somma gli oggetti sbagliati. Somma <i>probabilità</i> — numeri reali non negativi, che possono solo accumularsi — mentre la natura somma <i>ampiezze</i> — numeri complessi, che possono cancellarsi. Il resto del movimento mostra, con i numeri e con gli esperimenti delle fonti, che questa sostituzione è obbligata.</p>`},
  {t:'prosa', title:'Un disaccordo di metodo fra le fonti, dichiarato subito', tag:'architettura', html:R`
  <p>Le fonti di questo corso <b>non concordano sul ruolo</b> delle due fenditure, e il disaccordo è istruttivo, quindi lo dichiaro invece di nasconderlo. Picasso (cap. 3-4), Shankar (cap. 3-4) e Feynman trattano il dualismo e l&rsquo;interferenza come <i>la porta d&rsquo;ingresso</i> alla teoria: si parte dall&rsquo;esperimento, si estrae l&rsquo;ampiezza, si costruisce il formalismo. Ballentine, che è il libro consigliato dal docente, prende la strada opposta: nella prefazione scrive che il suo approccio per simmetrie «<i>sostituisce gli argomenti euristici ma inconcludenti basati sull&rsquo;analogia e sul dualismo onda-particella, che tanto frustrano lo studente serio</i>». Per lui la doppia fenditura non è un fondamento ma un fenomeno da spiegare <i>dopo</i>, una volta che impulso, momento angolare e hamiltoniana sono stati ricavati dai gruppi di trasformazione dello spazio-tempo.</p>
  <p>Chi ha ragione? Nessuno dei due, nel senso che non è una domanda di verità ma di ordine didattico. Ballentine ha ragione che il dualismo onda-particella, preso come principio, è vago e genera più confusione che comprensione — e infatti questo movimento <b>non lo userà mai come principio</b>, solo come fenomeno che costringe a una scelta. Ma Shankar e Picasso hanno ragione che la doppia fenditura contiene, in miniatura e senza formalismo, quasi tutta la teoria: la sovrapposizione, la probabilità, il collasso, la natura complessa dell&rsquo;ampiezza. La scegliamo come primo movimento proprio per questo, consapevoli che il corso vero comincia dalle simmetrie: qui si prepara il terreno, lì si costruisce.</p>`},
  {t:'prosa', title:'Come è fatto il movimento', tag:'architettura', html:R`
  <p><b>La rotta.</b> Si comincia (tappa 01) con i tre esperimenti nella forma di Shankar: proiettili, onde, elettroni, e la contraddizione che nessuno dei due modelli classici regge da solo. La tappa 02 chiude la via di fuga più ovvia — «sarà un&rsquo;interazione fra le particelle» — mandando un quanto alla volta, come nell&rsquo;interferometro a neutroni di Picasso: l&rsquo;interferenza sopravvive, dunque è del <i>singolo</i> quanto. La tappa 03 estrae l&rsquo;oggetto: l&rsquo;ampiezza, la regola di Born, e il conto algebrico che mostra il termine d&rsquo;interferenza. La tappa 04 risponde alla domanda «perché proprio numeri <i>complessi</i>» con l&rsquo;interferometro di Mach-Zehnder. La tappa 05 porta la lunghezza d&rsquo;onda di de Broglie e i numeri che spiegano perché non vediamo interferire le palle da biliardo. La tappa 06 dice che cosa <i>è</i> e che cosa <i>non è</i> la $\psi$ — non un&rsquo;onda di materia — e introduce la sovrapposizione. La tappa 07 generalizza l&rsquo;ampiezza-che-si-somma nella somma sui cammini di Feynman, e mostra da lì come rinasce la meccanica classica. L&rsquo;ultima tappa raccoglie il senso e indica dove l&rsquo;ampiezza riappare nel resto della fisica.</p>`}
]},

/* ---------------- 01 · I TRE ESPERIMENTI ---------------- */
{ num:'01', title:'I tre esperimenti, e cosa non torna', meta:'proiettili · onde · elettroni · la contraddizione che nessun modello classico regge',
  blocchi:[
  {t:'reveal', title:'Lo stesso apparato, tre proiettili diversi', tag:'costruzione', steps:[
   {label:'I proiettili: le probabilità si sommano', body:R`
   <p>Shankar (§3.2) imposta l&rsquo;esperimento con tre sorgenti diverse davanti allo stesso schermo con due fenditure $S_1$ e $S_2$, e un rivelatore che conta gli arrivi in funzione della posizione $x$. Cominciamo con una mitragliatrice che spara proiettili macroscopici. Con la sola $S_1$ aperta si misura una distribuzione $P_1(x)$, un&rsquo;unica gobba centrata dietro $S_1$; con la sola $S_2$, una gobba $P_2(x)$ dietro $S_2$. Con entrambe aperte, il risultato è privo di sorprese:</p>
   $$P_{12}=P_1+P_2$$
   <p>Le probabilità si sommano, perché un proiettile che punta a $S_1$ «non ha modo di sapere», dice Shankar, se $S_2$ è aperta o chiusa: è localizzato, passa da una fenditura sola, e i due canali sono indipendenti. Questa è la firma di un corpuscolo, e si può rendere incontestabile sparando <b>un proiettile alla volta</b>: ciascuno arriva in un punto preciso, l&rsquo;istogramma si costruisce colpo dopo colpo, e la sua forma finale è $P_1+P_2$. Nessuna interferenza.</p>`},
   {label:'Le onde: le intensità no, si sommano le ampiezze', body:R`
   <p>Ora una sorgente di onde — acqua, o luce (Shankar §3.3). Con $S_1$ sola si misura un&rsquo;intensità $I_1$; con $S_2$ sola, $I_2$. Ma con entrambe aperte <b>non</b> si ottiene $I_1+I_2$: si ottiene una figura di frange, massimi e minimi alternati, e nei minimi l&rsquo;intensità scende <i>sotto</i> sia $I_1$ sia $I_2$, fino a zero. La ragione è che un&rsquo;onda non si somma attraverso la sua intensità, ma attraverso la sua <b>ampiezza</b>: se $h_1$ e $h_2$ sono le ampiezze (con segno e fase) delle due onde al rivelatore, l&rsquo;ampiezza totale è $h_1+h_2$ e l&rsquo;intensità è il suo modulo quadro. Dove le due ampiezze arrivano in controfase si cancellano, e l&rsquo;intensità è nulla benché ciascuna onda, da sola, portasse energia lì.</p>
   <p>Questa è la firma di un&rsquo;onda, e la differenza con i proiettili è netta: <b>i proiettili sommano le intensità, le onde sommano le ampiezze e poi fanno il modulo quadro</b>. Tenere a mente questa frase è già mezzo movimento.</p>`},
   {label:'Gli elettroni: arrivano a grani, si distribuiscono a frange', body:R`
   <p>Terzo proiettile: elettroni (Shankar §3.4), o fotoni, o neutroni. Quando arrivano, arrivano <b>a grani</b>, come proiettili: ogni elettrone fa un singolo puntino sul rivelatore, porta tutta la sua carica e la sua energia in forma localizzata, e il rivelatore o scatta o non scatta — non registra mai mezzo elettrone. Eppure, aperte entrambe le fenditure, l&rsquo;istogramma dei puntini, accumulato su molti elettroni, <b>è la figura di frange delle onde</b>, non la somma $P_1+P_2$ dei proiettili. L&rsquo;elettrone arriva come particella e si distribuisce come onda.</p>
   <p>È questo il punto di rottura. Non è che l&rsquo;elettrone sia «un po&rsquo; particella e un po&rsquo; onda» in senso vago: è che lo stesso oggetto obbedisce a una legge di conteggio (grani localizzati) e a una legge di distribuzione (somma di ampiezze) che nei due modelli classici sono <b>incompatibili</b>. La figura qui sotto mette a confronto ciò che si misurerebbe nei due casi.</p>`}
  ]},
  {t:'plot', title:'Le due leggi di somma, sullo stesso schermo',
   intro:R`A sinistra la legge dei proiettili, $P_1+P_2$: una gobba liscia, somma delle due distribuzioni di singola fenditura. Sovrapposta, la legge delle ampiezze, $|\psi_1+\psi_2|^2$: la stessa area totale, ma ridistribuita in frange. Il modello: ogni fenditura dà una gaussiana $e^{-x^2/18}$ di ampiezza, le frange vengono dal termine $\cos^2(\tfrac32 x)$.`,
   plots:[
    {kind:'func2d', xr:[-6,6], yr:[0,4.4], height:340, ticks:6,
     title:'proiettili contro ampiezze',
     curves:[
      {f:'2*exp(-x*x/18)', col:'#ff8a5c', width:2.6, label:'P₁+P₂ (proiettili)'},
      {f:'2*exp(-x*x/18)*(1+cos(3*x))', col:'#4c8dff', width:2.4, label:'|ψ₁+ψ₂|² (quanti)'}
     ],
     xlabel:'posizione sullo schermo x', ylabel:'numero di arrivi'}
   ],
   leggi:R`<p><b>Che cosa guardare.</b> Le due curve racchiudono <i>la stessa area</i> — stesso numero totale di arrivi — ma la curva blu la ridistribuisce. Al centro ($x=0$) la blu vale il <b>doppio</b> della arancione: lì le due ampiezze arrivano in fase e si rinforzano. Dove la blu tocca lo zero, le due ampiezze arrivano in controfase e si cancellano: in quei punti arrivano <b>meno</b> quanti con entrambe le fenditure aperte che con una sola. È l&rsquo;impossibilità, per un corpuscolo con traiettoria, di spiegare come l&rsquo;apertura di un secondo cammino possa <i>ridurre</i> gli arrivi in un punto.</p>`}

/* ---------------- 02 · UN QUANTO ALLA VOLTA ---------------- */
{ num:'02', title:'Un quanto alla volta: l’interferenza è del singolo', meta:'il neutrone solo nell’interferometro · il terzo stato che non è «né A né B» · perché non si aggiusta',
  blocchi:[
  {t:'prosa', title:'La via di fuga, e perché è chiusa', tag:'costruzione', html:R`
  <p>Davanti alla figura di frange fatta di puntini, la prima difesa del senso comune è: «gli elettroni interferiscono <i>fra loro</i>, come fanno le molecole d&rsquo;acqua; è un effetto collettivo del fascio». Picasso (§3.3) chiude questa via con l&rsquo;esperimento decisivo, e lo fa due volte. Prima con i fotoni: si abbassa l&rsquo;intensità della luce finché, in media, c&rsquo;è <b>un solo fotone per volta</b> nel tragitto dalla sorgente alla lastra. Sulla lastra, a breve esposizione, compaiono macchioline «disposte praticamente a caso»; ma «al crescere del tempo di esposizione la distribuzione delle macchioline gradatamente perde quell&rsquo;apparenza di casualità e va a formare la figura di interferenza». I fotoni non si incontrano mai, eppure la figura si forma: <b>l&rsquo;interferenza non è fra fotoni, è di ogni singolo fotone con sé stesso.</b></p>
  <p>Poi, ancora più netto, con i neutroni di un reattore in un interferometro: «l&rsquo;intensità è così bassa che quando un neutrone arriva su un rivelatore, il neutrone successivo non è ancora stato prodotto dentro il reattore». Un neutrone alla volta, e la legge d&rsquo;interferenza resta. Ballentine racconta la versione moderna di questo stesso fatto (introduzione, fenomeno della <i>diffrazione</i>): oggi si rivela l&rsquo;arrivo dei <b>singoli</b> elettroni e si vede la figura di diffrazione «emergere come un pattern statistico fatto di molti piccoli punti» (l&rsquo;esperimento di Tonomura, 1989). La conclusione è obbligata: <b>qualunque spiegazione dell&rsquo;interferenza deve riguardare il singolo quanto</b>, non la sua interazione con altri.</p>`},
  {t:'reveal', title:'Il terzo stato: «né dal foro A né dal foro B»', tag:'costruzione', steps:[
   {label:'Che cosa resta, dopo aver tolto l’interazione', body:R`
   <p>Se l&rsquo;interferenza è del singolo quanto, resta una domanda classica: da quale fenditura è passato? Picasso (§3.4) analizza le due uniche risposte classiche e le demolisce entrambe. Se l&rsquo;elettrone passa da $A$, allora è «come se $B$ fosse tappato», e dovrebbe distribuirsi secondo $P_A$ (la gobba di singola fenditura), arrivando anche nei punti che con entrambe le fenditure aperte sono <i>frange scure</i>, dove invece non arriva nessuno. Idem se passa da $B$. E se metà passa da $A$ e metà da $B$, il risultato è $P_A+P_B$, cioè la legge dei proiettili — che non è quella osservata.</p>
   <p>La conclusione di Picasso è precisa e va citata alla lettera: i quanti «non passano né da $A$ né da $B$ [...], ma è come se ognuno di essi passasse <i>contemporaneamente</i> da $A$ e da $B$». Esiste un <b>terzo stato</b> $C$, «definito dal fatto che entrambi i fori sono aperti», che «non è qualche volta $A$ e qualche volta $B$» e che «non ha diritto di cittadinanza nella fisica classica».</p>`},
   {label:'Perché non basta aggiustare', body:R`
   <p>Qui si misura la differenza fra <i>correggere</i> una teoria e <i>sostituirla</i>. Nessun aggiustamento della meccanica classica — una particella più piccola, una forza nuova, un&rsquo;incertezza strumentale — può produrre lo stato $C$, perché $C$ non è un difetto di conoscenza su quale traiettoria l&rsquo;elettrone abbia davvero seguito. Se l&rsquo;elettrone <i>avesse</i> una traiettoria definita, anche ignota a noi, allora nell&rsquo;esperimento di Davisson-Germer «si rifletterebbe su un ben determinato piano reticolare», e non si spiegherebbe perché la riflessione avviene solo agli angoli di Bragg, che richiedono la riflessione <b>simultanea</b> su molti piani. L&rsquo;ipotesi della traiettoria nascosta non è falsa per modestia epistemica: è falsa perché, assunta vera, predice il fenomeno sbagliato.</p>
   <p>Ciò che serve è un nuovo modo di descrivere lo stato. Picasso lo anticipa già qui: lo stato di un sistema quantistico è definito da «tutte le informazioni riguardanti il modo in cui esso è stato preparato», non da posizione e velocità. E lo stato $C$ dovrà essere costruito <i>a partire da</i> $A$ e $B$ in un modo che non sia né la loro alternativa né la loro miscela statistica. Quel modo è la somma di due ampiezze, ed è l&rsquo;oggetto della prossima tappa.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Perché l&rsquo;esperimento «un quanto alla volta» è più forte, e non solo più elegante, della versione a fascio intenso?`,
    a:R`Perché <b>falsifica una classe intera di spiegazioni</b> invece di aggiungere un dato. A fascio intenso, un sostenitore dell&rsquo;interpretazione classica può sempre dire «le frange nascono da un&rsquo;interazione collettiva fra i quanti». Mandandone uno alla volta — un fotone, o un neutrone il cui successore «non è ancora stato prodotto» — quella spiegazione non è più disponibile: non c&rsquo;è nessun secondo quanto con cui interagire, eppure la figura si forma lo stesso. Il criterio in gioco è quello di una <b>prova cruciale</b>: non si misura meglio la stessa cosa, si separa in modo netto due ipotesi che a fascio intenso restavano indistinguibili.`},
   {q:R`In che senso lo stato $C$ (entrambe aperte) «non è qualche volta $A$ e qualche volta $B$»?`,
    a:R`Nel senso che non è una <b>miscela statistica</b>: se lo fosse, la distribuzione sarebbe $P_A+P_B$, la legge dei proiettili, e non ci sarebbero frange. «Qualche volta $A$ e qualche volta $B$» descrive un&rsquo;ignoranza su quale traiettoria definita sia stata percorsa — ed è esattamente l&rsquo;ipotesi che la tappa demolisce. $C$ è invece una <b>sovrapposizione coerente</b>, in cui entrambi i cammini contribuiscono simultaneamente con la loro ampiezza e fase, e il termine d&rsquo;interferenza fra le due ampiezze è ciò che distingue una sovrapposizione da una miscela. La distinzione miscela/sovrapposizione è il cuore del concetto di coerenza, e tornerà come tale in tutto il corso.`}
  ]}
]},

/* ---------------- 03 · L'AMPIEZZA E LA REGOLA DI BORN ---------------- */
{ num:'03', title:'L’ampiezza, e la regola di Born', meta:'ψ numero complesso · |ψ|² è probabilità · il termine d’interferenza ricavato · massimo quadruplo, minimo nullo',
  blocchi:[
  {t:'prosa', title:'L’oggetto e la sua regola di lettura', tag:'costruzione', html:R`
  <p>Riprendiamo la frase-chiave della tappa 01: le onde sommano le ampiezze e poi fanno il modulo quadro. La mossa di Born, che Shankar (§3.4) attribuisce esplicitamente a lui, è assumere che <b>anche per i quanti valga questa legge</b>, dando però all&rsquo;ampiezza un&rsquo;interpretazione nuova. A ogni quanto si associa un&rsquo;ampiezza — Shankar la chiama «<i>probability amplitude or simply amplitude</i>» — un numero (in generale complesso) $\psi(x)$, il cui modulo quadro dà la <b>probabilità</b> di trovare il quanto in $x$:</p>
  <p style="text-align:center"><b>$|\psi(x)|^2$ è la densità di probabilità di rivelare il quanto in $x$.</b></p>
  <p>Questa è la <b>regola di Born</b>, e va presa per quello che è: un <i>postulato</i>, il ponte fra l&rsquo;oggetto matematico (un numero complesso) e ciò che si misura (un conteggio di arrivi). Non si deriva da niente di più elementare; si giustifica perché, assunta, rende conto di tutti gli esperimenti. Tutto il contenuto non banale sta nelle due parole «modulo quadro»: è il quadrato a distruggere l&rsquo;informazione di fase, ed è la fase, sopravvissuta nella somma e persa nel quadrato, a produrre l&rsquo;interferenza. Vediamolo in formule.</p>`},
  {t:'reveal', title:'La somma delle ampiezze, e il termine che nasce', tag:'costruzione', steps:[
   {label:'Due cammini, due ampiezze, una somma', body:R`
   <p>Nello stato $C$ con entrambe le fenditure aperte, al rivelatore arrivano due ampiezze: $\psi_1$, per il cammino che passa da $S_1$, e $\psi_2$, per quello da $S_2$. La regola è che l&rsquo;ampiezza totale è la loro <b>somma</b> (è questa la definizione dello stato $C$, ciò che lo rende diverso da una miscela):</p>
   $$\psi=\psi_1+\psi_2$$
   <p>La probabilità di arrivo è il modulo quadro di questa somma. Scrivendo $\psi_1=(a_1,a_2)$ e $\psi_2=(b_1,b_2)$ come coppie di parte reale e immaginaria, e svolgendo il modulo quadro come somma dei quadrati delle componenti, si trova l&rsquo;identità algebrica che regge tutto:</p>
   $$I_{12}=|\psi_1+\psi_2|^2=|\psi_1|^2+|\psi_2|^2+2\operatorname{Re}(\psi_1^{*}\psi_2)$$
   <p>I primi due termini sono le probabilità di singola fenditura, $P_1=|\psi_1|^2$ e $P_2=|\psi_2|^2$: è la parte che un corpuscolo avrebbe. Il terzo, $2\operatorname{Re}(\psi_1^{*}\psi_2)$, è il <b>termine d&rsquo;interferenza</b>, e non ha analogo classico. È la sola differenza fra $P_1+P_2$ (proiettili) e $|\psi_1+\psi_2|^2$ (quanti), e dipende dalla <i>fase relativa</i> delle due ampiezze.</p>`},
   {label:'Massimo quadruplo e minimo nullo', body:R`
   <p>Per vedere la figura di frange, scriviamo le due ampiezze in modulo e fase. Nel caso simmetrico le due fenditure danno moduli uguali, $\psi_1=A\,e^{i\delta_1}$ e $\psi_2=A\,e^{i\delta_2}$, e la fase relativa $\delta=\delta_1-\delta_2$ dipende dalla differenza di cammino fino al punto $x$. Il modulo quadro della somma dei due fasori è un conto di trigonometria elementare:</p>
   $$|e^{i\delta_1}+e^{i\delta_2}|^2=2+2\cos(\delta_1-\delta_2)$$
   <p>cosicché $I_{12}=A^2\big(2+2\cos\delta\big)$. La somma classica delle due intensità, $|\psi_1|^2+|\psi_2|^2$, vale invece $2A^2$, costante. Confrontiamo i due estremi. Nelle frange chiare, $\delta=0$, le due ampiezze sono in fase e</p>
   $$2+2\cos 0=4$$
   <p>cioè $I_{12}=4A^2$: il <b>doppio</b> della somma classica $2A^2$. Nelle frange scure, $\delta=\pi$, le due ampiezze sono in controfase e</p>
   $$2+2\cos\pi=0$$
   <p>cioè $I_{12}=0$: arriva <b>meno</b> che con una sola fenditura aperta. La probabilità oscilla fra $0$ e $4A^2$ attorno alla media $2A^2$, e la media è esattamente il valore classico — l&rsquo;interferenza <i>ridistribuisce</i> gli arrivi senza crearne né distruggerne. È la curva blu della figura in tappa 01, ora spiegata termine per termine.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Il termine d&rsquo;interferenza $2\operatorname{Re}(\psi_1^{*}\psi_2)$ è l&rsquo;unica differenza fra il caso quantistico e quello dei proiettili. Che cosa lo fa sparire, trasformando $|\psi_1+\psi_2|^2$ in $P_1+P_2$?`,
    a:R`Lo fa sparire <b>qualsiasi cosa renda indefinita o scorrelata la fase relativa</b> $\delta$ dei due cammini. Se un apparato «guarda» da quale fenditura passa il quanto, i due cammini acquistano fasi incontrollate e scorrelate: mediando sugli arrivi, $\langle\cos\delta\rangle\to0$, il termine d&rsquo;interferenza si annulla e resta $P_1+P_2$. Il criterio da ricordare è che l&rsquo;interferenza vive nella <b>coerenza di fase</b> fra i cammini, e muore quando l&rsquo;informazione su quale cammino sia stato preso diventa disponibile — la stessa distinzione sovrapposizione/miscela della tappa 02, qui scritta con il coseno.`}
  ]}
]},

/* ---------------- 04 · PERCHE NUMERI COMPLESSI ---------------- */
{ num:'04', title:'Perché proprio numeri complessi', meta:'le probabilità non si cancellano · un segno non basta · la fase continua di Mach-Zehnder',
  blocchi:[
  {t:'prosa', title:'Ciò che le probabilità non sanno fare', tag:'costruzione', html:R`
  <p>Abbiamo dato per scontato che l&rsquo;ampiezza sia un numero complesso. Ma perché non basta un numero reale, o addirittura la probabilità stessa? La risposta è la ragione d&rsquo;essere di tutto il formalismo, e si vede con due numeri. Una probabilità è un reale <b>non negativo</b>: sommando due probabilità il risultato è sempre maggiore o uguale a ciascuna delle due. Due probabilità non possono <i>cancellarsi</i>. Ma le frange scure esistono: nei minimi arriva meno che con una fenditura sola. Dunque l&rsquo;oggetto che si somma <b>deve poter diminuire quando lo si somma a un altro</b>, e una probabilità non lo fa mai.</p>
  <p>Un numero reale con segno già basterebbe per la cancellazione totale. Prendiamo due ampiezze reali opposte, $+1$ e $-1$. La loro somma, al quadrato, si annulla:</p>
  $$(1+(-1))^2=0$$
  <p>mentre le due probabilità, i quadrati presi separatamente, danno</p>
  $$1^2+(-1)^2=2$$
  <p>Ecco la cancellazione che una probabilità non può produrre: $2$ contro $0$. Un segno — cioè una fase che vale $0$ o $\pi$ — spiega le frange completamente chiare e quelle completamente scure. Ma le frange reali hanno <b>tutte le gradazioni intermedie</b>: l&rsquo;intensità varia con continuità da zero al massimo man mano che ci si sposta sullo schermo. Per questo serve di più di un segno.</p>`},
  {t:'reveal', title:'Mach-Zehnder: la fase che gira con continuità', tag:'costruzione', steps:[
   {label:'Un interferometro con una manopola per la fase', body:R`
   <p>Picasso (§3.2-3.3) usa l&rsquo;interferometro di Mach-Zehnder perché vi si può <b>variare la fase a piacere</b> e vedere l&rsquo;intensità rispondere con continuità. Un fascio entra, un primo specchio semi-trasparente lo divide in due cammini, due specchi li ripiegano, un secondo semi-trasparente li ricombina verso due rivelatori $R_1$ e $R_2$. Inserendo in un braccio una lastrina di vetro inclinabile si introduce uno sfasamento $\varphi$ regolabile fra i due cammini. Le intensità misurate, con l&rsquo;intensità entrante $I_0$, sono</p>
   $$I_1=\tfrac12 I_0\,(1+\cos\varphi),\qquad I_2=\tfrac12 I_0\,(1-\cos\varphi)$$
   <p>Ciascuna <b>oscilla con continuità</b> fra $0$ e $I_0$ al girare della manopola $\varphi$: non due soli valori, ma tutti quelli intermedi. Questo è ciò che un segno non può dare e una fase continua sì — e una fase continua è, per definizione, l&rsquo;argomento di un numero complesso $e^{i\varphi}$.</p>`},
   {label:'La conservazione, e la lettura complessa', body:R`
   <p>Nota che l&rsquo;energia non si perde: sommando le due uscite, i termini in $\cos\varphi$ si elidono e</p>
   $$I_1+I_2=\tfrac12 I_0\,(1+\cos\varphi)+\tfrac12 I_0\,(1-\cos\varphi)=I_0$$
   <p>per ogni $\varphi$. La fase <b>sposta</b> l&rsquo;intensità da un rivelatore all&rsquo;altro, non la crea né la distrugge — esattamente come nelle frange le due leggi hanno la stessa area. La lettura complessa unifica tutto: a ciascun cammino si associa un&rsquo;ampiezza $\tfrac{1}{\sqrt2}e^{i\theta_k}$ (il $\tfrac{1}{\sqrt2}$ perché ogni specchio semi-trasparente riduce l&rsquo;ampiezza di quel fattore, così che l&rsquo;intensità si dimezzi), e $I_1\propto|\,\text{somma delle ampiezze}\,|^2$ riproduce il $(1+\cos\varphi)$ attraverso lo stesso termine d&rsquo;interferenza della tappa 03. Il numero complesso non è una comodità di calcolo: è il <b>minimo oggetto</b> che porta insieme un modulo (che dà, al quadrato, la probabilità) e una fase continua (che dà l&rsquo;interferenza). La figura mostra le due uscite e la loro somma costante.</p>`}
  ]},
  {t:'plot', title:'Le due uscite dell’interferometro, e la somma che non cambia',
   intro:R`Le intensità $I_1=\tfrac12 I_0(1+\cos\varphi)$ e $I_2=\tfrac12 I_0(1-\cos\varphi)$ al variare dello sfasamento $\varphi$, in unità di $I_0$, e la loro somma, costante.`,
   plots:[
    {kind:'func2d', xr:[0,12.57], yr:[0,1.2], height:320, ticks:6,
     title:'I₁, I₂ e la loro somma',
     curves:[
      {f:'0.5*(1+cos(x))', col:'#4c8dff', width:2.4, label:'I₁/I₀'},
      {f:'0.5*(1-cos(x))', col:'#ff8a5c', width:2.4, label:'I₂/I₀'},
      {f:'0.5*(1+cos(x))+0.5*(1-cos(x))', col:'#6bdc9b', width:2.0, label:'(I₁+I₂)/I₀'}
     ],
     xlabel:'sfasamento φ', ylabel:'intensità / I₀'}
   ],
   leggi:R`<p><b>Che cosa guardare.</b> Le due curve oscillanti sono in <b>opposizione</b>: dove una è massima l&rsquo;altra è nulla. Questo è il termine d&rsquo;interferenza al lavoro, con la fase $\varphi$ al posto della posizione sullo schermo. La retta orizzontale è la loro somma: <b>piatta a $1$</b> per ogni $\varphi$. La fase ridistribuisce i quanti fra $R_1$ e $R_2$ senza perderne nessuno — la stessa conservazione che nelle due fenditure teneva costante l&rsquo;area sotto le curve.</p>`}
  ]
},

/* ---------------- 05 · LA LUNGHEZZA D'ONDA DI DE BROGLIE ---------------- */
{ num:'05', title:'La lunghezza d’onda di de Broglie, e perché non con i sassi', meta:'λ = h/p · elettroni e raggi X · le palle da biliardo · Bragg e Davisson-Germer',
  blocchi:[
  {t:'prosa', title:'Da dove viene la fase, e quanto è piccola', tag:'costruzione', html:R`
  <p>La fase che produce le frange non è arbitraria: avanza lungo il cammino come quella di un&rsquo;onda, con una lunghezza d&rsquo;onda che de Broglie, nel 1923, legò all&rsquo;impulso. Picasso (§2.8) ne dà la genesi: la condizione di quantizzazione di Bohr-Sommerfeld, che impone all&rsquo;integrale d&rsquo;azione $\oint p\,dq$ di valere un multiplo intero di $h$, si riscrive per un&rsquo;orbita come $L=n\,(h/p)$, cioè «le orbite permesse sono quelle che contengono un numero intero di lunghezze d&rsquo;onda», con la relazione — identica a quella dei fotoni —</p>
  $$\lambda=\frac{h}{p}$$
  <p>Per una particella libera non relativistica $p=\sqrt{2mE}$, dunque $\lambda=h/\sqrt{2mE}$. Questa è la <span class="str" data-str="trasformata-di-fourier">lunghezza d&rsquo;onda</span> della singola onda piana di impulso definito; un pacchetto localizzato ne è una sovrapposizione, e lo riprendiamo nella prossima tappa. Picasso avverte subito che <b>non è un&rsquo;onda elastica né elettromagnetica</b>: è «un terzo tipo di onde», che si manifesta solo attraverso l&rsquo;interferenza. Il punto decisivo di questo movimento è <i>quanto</i> piccola sia questa lunghezza, perché è lì che si decide se l&rsquo;interferenza è visibile o no.</p>`},
  {t:'reveal', title:'I numeri: elettroni, raggi X, palle da biliardo', tag:'costruzione', steps:[
   {label:'Un elettrone a un elettronvolt', body:R`
   <p>Mettiamo i numeri, in unità SI, con la scheda dell&rsquo;<span class="str" data-str="elettronvolt">elettronvolt</span> per convertire l&rsquo;energia. Per un elettrone di energia $E=1\,$eV$=1{,}602\times10^{-19}\,$J, massa $m_e=9{,}109\times10^{-31}\,$kg, costante di Planck $h=6{,}626\times10^{-34}\,$J·s:</p>
   $$\lambda=\frac{h}{\sqrt{2m_eE}}\approx 1{,}23\,\text{nm}$$
   <p>cioè poco più di dodici ångström — il valore che Picasso (§2.8) arrotonda a $12{,}4$ Å. È dell&rsquo;ordine delle distanze interatomiche. Salendo a $E=100\,$eV, poiché $\lambda\propto 1/\sqrt{E}$, la lunghezza scende di un fattore dieci, a $\lambda\approx 0{,}12\,$nm, cioè circa un ångström: <b>l&rsquo;ordine di grandezza dei raggi X e del passo reticolare di un cristallo</b>. Questo è ciò che rende l&rsquo;elettrone un&rsquo;ottima sonda ondulatoria: la sua lunghezza d&rsquo;onda, a energie da laboratorio, è paragonabile agli ostacoli che deve incontrare per diffrangere.</p>`},
   {label:'Una palla da biliardo, e perché non interferisce', body:R`
   <p>Ora lo stesso conto per un oggetto macroscopico, l&rsquo;esempio di Shankar (§3.4): una pallina di $1\,$g$=10^{-3}\,$kg che si muove a $1\,$cm/s$=10^{-2}\,$m/s, con impulso $p=10^{-5}\,$kg·m/s. La sua lunghezza d&rsquo;onda è</p>
   $$\lambda=\frac{h}{p}\approx 6{,}6\times10^{-29}\,\text{m}$$
   <p>Per apprezzare quanto sia assurdamente piccola, usiamo gli <span class="str" data-str="ordini-di-grandezza">ordini di grandezza</span>: rapportata al raggio del protone, $\sim10^{-15}\,$m, vale</p>
   $$\frac{\lambda}{10^{-15}\,\text{m}}\approx 6{,}6\times10^{-14}$$
   <p>cioè la lunghezza d&rsquo;onda della pallina è circa $10^{-13}$ volte il raggio di un protone. Nessun apparato può avere fenditure così vicine, e nessuno strumento può risolvere frange con quella spaziatura. Shankar dice la cosa esatta: «la natura ondulatoria della materia non è apparente per i fenomeni macroscopici perché $\hbar$ è così piccolo». Non è che le palle da biliardo non siano quantistiche — è che la loro lunghezza d&rsquo;onda è fuori da ogni scala osservabile.</p>`},
   {label:'Lo stesso, visto come angolo di frangia', body:R`
   <p>C&rsquo;è un secondo modo, più operativo, di dire la stessa cosa. In una figura di interferenza la spaziatura angolare delle frange è dell&rsquo;ordine di $\lambda/d$, con $d$ la distanza fra le fenditure. Per la pallina, anche con una fenditura stretta quanto $d=1\,$mm, l&rsquo;angolo della prima frangia sarebbe</p>
   $$\sin\theta\sim\frac{\lambda}{2d}\approx 3{,}3\times10^{-26}$$
   <p>un angolo che nessun rivelatore distinguerà mai dallo zero: le frange ci sono, ma sono infinitamente più fitte della risoluzione di qualunque strumento, e si vede solo la loro media — che è la legge classica $P_1+P_2$. Per l&rsquo;elettrone, al contrario, con $\lambda$ e $d$ entrambi dell&rsquo;ordine dell&rsquo;ångström l&rsquo;angolo è grande e le frange sono ben separate.</p>`}
  ]},
  {t:'prosa', title:'La prova: Bragg e Davisson-Germer', tag:'costruzione', html:R`
  <p>Che questa non sia un&rsquo;analogia ma un fatto lo provano Picasso (§2.8) e Ballentine (introduzione, fenomeno della diffrazione) con lo stesso esperimento. Bragg aveva mostrato che i raggi X riflessi da un cristallo danno massimi solo agli angoli che soddisfano $2d\sin\theta=n\lambda$, dove $d$ è il passo reticolare: l&rsquo;interferenza costruttiva fra i piani reticolari. Nel 1927 Davisson e Germer ripeterono l&rsquo;esperimento <b>sostituendo i raggi X con un fascio di elettroni</b>, e trovarono gli stessi massimi, alla stessa condizione: gli elettroni diffrangono come onde di lunghezza $\lambda=h/p$, confermando de Broglie. Ballentine aggiunge il dato moderno: la diffrazione elettronica è oggi un esperimento da laboratorio per studenti.</p>
  <p>Un conto d&rsquo;ordine di grandezza fissa la scala degli angoli. Nel caso simmetrico in cui la lunghezza d&rsquo;onda eguaglia il passo reticolare, $\lambda=d$, il primo massimo di Bragg è a $\sin\theta=\tfrac12$, cioè</p>
  $$\theta=30^\circ$$
  <p>un angolo largo, facilmente misurabile: è il motivo per cui si usano cristalli (con $d$ dell&rsquo;ordine dell&rsquo;ångström) come reticoli per elettroni di qualche decina di eV. La stessa condizione $2d\sin\theta=n\lambda$ che per gli elettroni dà angoli di decine di gradi, per la pallina da biliardo darebbe l&rsquo;angolo invisibile calcolato sopra: <b>una sola formula, due regimi, e la differenza sta tutta nella taglia di $\lambda$.</b></p>`}
]},

/* ---------------- 06 · NON E UN'ONDA DI MATERIA ---------------- */
{ num:'06', title:'Che cosa è, e che cosa non è, la ψ', meta:'non una densità di materia · un’onda per ogni quanto · il pacchetto come sovrapposizione · il principio di sovrapposizione',
  blocchi:[
  {t:'prosa', title:'Non è materia spalmata nello spazio', tag:'architettura', html:R`
  <p>Qui si paga il debito annunciato nel titolo del movimento: dire che cosa <i>è</i> la $\psi$, e soprattutto che cosa <b>non è</b>. La tentazione, dopo aver parlato di «onde di materia», è immaginare l&rsquo;elettrone come una sostanza spalmata nello spazio, la cui densità sia $|\psi|^2$. Questa immagine è <b>sbagliata</b>, e il motivo è già nei dati della tappa 01: l&rsquo;elettrone arriva sempre <i>intero</i>, in un punto, con tutta la sua carica ed energia. Se $|\psi|^2$ fosse una densità di materia, un elettrone passato per due fenditure arriverebbe spalmato su tutto lo schermo, e i rivelatori registrerebbero frazioni di carica in molti punti contemporaneamente. Non succede mai. $|\psi|^2$ non è <i>quanta materia c&rsquo;è</i> in $x$, è la <b>probabilità</b> di trovarvi, intero, l&rsquo;unico elettrone.</p>
  <p>Shankar (§3.4) lo dice nel modo più tagliente, ed è il punto che questo movimento consegna al corso: «un&rsquo;onda è associata non a un fascio di fotoni, ma a <b>ciascun fotone</b>». La $\psi$ non è un&rsquo;onda <i>nel</i> materiale, è un&rsquo;onda <i>di probabilità</i> che accompagna il singolo quanto. Un fascio intenso di quanti, tutti con la stessa $\psi$, riproduce i fenomeni di un&rsquo;onda classica, e l&rsquo;aspetto probabilistico resta nascosto; ma il fenomeno fondamentale è di uno alla volta, e l&rsquo;onda è sua.</p>`},
  {t:'reveal', title:'Il pacchetto, la normalizzazione, la sovrapposizione', tag:'costruzione', steps:[
   {label:'Un quanto localizzato è una somma di onde piane', body:R`
   <p>Se l&rsquo;onda piana $e^{i(kx-\omega t)}$ di de Broglie ha un impulso definito $p=\hbar k$, essa è distesa su tutto lo spazio: non descrive un quanto localizzato. Un quanto che <i>è</i> in una regione finita si descrive con un <b>pacchetto d&rsquo;onda</b>, cioè una <span class="str" data-str="trasformata-di-fourier">sovrapposizione</span> di onde piane di impulsi diversi. Più il pacchetto è stretto in $x$, più largo è il ventaglio di impulsi che lo compone — ed è già qui, come fatto puramente matematico sulla trasformata, la radice della relazione di indeterminazione che il programma svilupperà in Q.3.</p>
   <p>Perché $|\psi|^2$ sia una probabilità, il pacchetto deve essere <b>normalizzabile</b>: l&rsquo;integrale del modulo quadro su tutto lo spazio dev&rsquo;essere finito (e lo si pone uguale a $1$). Un esempio concreto è la gaussiana: con $\psi(x)\propto e^{-x^2/2}$ il modulo quadro è $e^{-x^2}$, e</p>
   $$\int_{-\infty}^{+\infty}e^{-x^2}\,dx=\sqrt{\pi}$$
   <p>finito: esiste quindi una costante davanti a $\psi$ che rende la probabilità totale uguale a $1$. È la differenza strutturale fra l&rsquo;onda piana ideale (impulso perfettamente definito, non normalizzabile, non uno stato fisico in senso stretto) e il pacchetto (localizzato, normalizzabile, uno stato fisico): la distinzione fra spettro continuo e stati normalizzabili che il corso riprenderà in Q.6.</p>`},
   {label:'Il principio di sovrapposizione', body:R`
   <p>Lo stato $C$ della tappa 02 — «entrambe le fenditure aperte» — era la somma di due stati. Picasso (cap. 4) eleva questa osservazione ad <b>assioma</b>, il <i>Principio di Sovrapposizione</i>: «gli stati di un sistema sono rappresentati dagli elementi (vettori) di uno spazio vettoriale $H$ sul corpo complesso», e «vettori proporzionali (con un fattore complesso) rappresentano lo stesso stato», cosicché gli stati sono i <b>raggi</b> di $H$. In simboli, se $|\psi_1\rangle$ e $|\psi_2\rangle$ sono stati possibili, lo è ogni loro combinazione a coefficienti complessi</p>
   <p style="text-align:center"><b>$\alpha|\psi_1\rangle+\beta|\psi_2\rangle$</b></p>
   <p>È il principio che Dirac pose a fondamento della sua assiomatizzazione, e che Shankar (§4.1) commenta così: la sovrapposizione in sé non è nuova — anche le corde vibranti si sovrappongono — ciò che è nuovo è la sua <b>interpretazione</b>, cioè che lo stato sovrapposto dia, alla misura, ora l&rsquo;uno ora l&rsquo;altro risultato con probabilità fissate dai moduli quadri dei coefficienti. Qui si chiude il cerchio: l&rsquo;ampiezza-che-si-somma della tappa 03 <b>è</b> questa combinazione lineare, e il corpo complesso su cui si fa la somma è esattamente ciò che la tappa 04 ha dimostrato necessario.</p>`},
   {label:'La coerenza, anche senza onde: lo spin', body:R`
   <p>Che la sovrapposizione sia più generale di un&rsquo;onda lo mostra Ballentine (introduzione, fenomeno della <i>coerenza</i>) con un sistema che non ha nulla di ondulatorio: lo spin di un neutrone. Lo stato polarizzato lungo $+x$, che indichiamo $|\psi_x\rangle$, si scrive come sovrapposizione coerente dei due stati lungo $\pm z$,</p>
   $$|\psi_x\rangle=\tfrac{1}{\sqrt2}\big(|{+}z\rangle+|{-}z\rangle\big)$$
   <p>e le due probabilità di misurare $\pm z$ valgono ciascuna $\tfrac12$, come conferma la somma dei moduli quadri dei coefficienti:</p>
   $$(1/\sqrt2)^2+(1/\sqrt2)^2=1$$
   <p>Ballentine mostra che, ricombinando <b>coerentemente</b> i due fasci $\pm z$, si ricostruisce lo stato $|\psi_x\rangle$ di partenza: la sovrapposizione «ha proprietà qualitativamente diverse da una miscela» dei suoi componenti. È la stessa distinzione sovrapposizione/miscela della tappa 02, qui su un grado di libertà discreto — la prova che l&rsquo;ampiezza complessa che si somma non è una proprietà delle onde, ma della teoria.</p>`}
  ]}
]},

/* ---------------- 07 · LA SOMMA SUI CAMMINI E IL LIMITE CLASSICO ---------------- */
{ num:'07', title:'La somma sui cammini, e come rinasce la meccanica classica', meta:'l’ampiezza come principio generale · il propagatore di Feynman · la fase stazionaria · il limite ℏ→0',
  blocchi:[
  {t:'prosa', title:'Le due fenditure come caso piccolo di una legge generale', tag:'sintesi', html:R`
  <p>La somma di due ampiezze delle tappe 03-04 è il caso più piccolo di un principio generale, quello che Feynman formulò nel 1948 e che Ballentine (§4.8) deriva come espressione del propagatore. L&rsquo;ampiezza per andare da un punto iniziale a uno finale è la <b>somma, su tutti i cammini possibili</b> che li collegano, di un&rsquo;ampiezza elementare per cammino,</p>
  <p style="text-align:center"><b>$e^{iS/\hbar}$, con $S$ l&rsquo;azione classica calcolata lungo quel cammino.</b></p>
  <p>Ogni cammino contribuisce con modulo uguale e fase $S/\hbar$. Le due fenditure sono la versione impoverita di questo: invece di <i>tutti</i> i cammini, l&rsquo;apparato ne seleziona due (uno per fenditura), e la loro differenza di fase è la differenza delle azioni divisa $\hbar$ — che si traduce, per una particella libera, nella differenza di cammino in unità di lunghezza d&rsquo;onda di de Broglie. L&rsquo;interferenza a due ampiezze è l&rsquo;integrale sui cammini ridotto a due termini.</p>`},
  {t:'reveal', title:'Perché il mondo macroscopico sembra classico', tag:'sintesi', steps:[
   {label:'La fase stazionaria sceglie la traiettoria', body:R`
   <p>Questa formulazione spiega, da sola, come rinasca la meccanica classica — e chiude il movimento rispondendo alla domanda della tappa 02: se non c&rsquo;è traiettoria, perché i sassi sembrano averne una? Quando l&rsquo;azione tipica $S$ è enorme rispetto a $\hbar$, la fase $S/\hbar$ gira vorticosamente al variare del cammino: cammini vicini hanno fasi completamente diverse e i loro contributi <b>si cancellano</b> fra loro, per lo stesso meccanismo d&rsquo;interferenza distruttiva delle frange scure. L&rsquo;unica eccezione è il cammino per cui l&rsquo;azione è <b>stazionaria</b>, $\delta S=0$: lì i cammini vicini hanno quasi la stessa fase e i contributi si sommano in modo costruttivo. Ma $\delta S=0$ è il principio di minima azione, cioè la condizione che <b>seleziona la traiettoria classica</b>. La traiettoria non è postulata: emerge come l&rsquo;unica regione di cammini che non si autocancella.</p>`},
   {label:'Un numero che dice tutto', body:R`
   <p>Quanto «enorme» deve essere $S$ perché questo accada? Basta un oggetto ordinario. Per un moto con azione dell&rsquo;ordine di $S\sim 0{,}01\,$J·s — una pallina che si muove per una frazione di secondo — la fase in unità di $\hbar=1{,}055\times10^{-34}\,$J·s vale</p>
   $$\frac{S}{\hbar}\approx 9{,}5\times10^{31}$$
   <p>radianti: un numero così grande che spostando il cammino di un&rsquo;inezia la fase compie miliardi di miliardi di giri. La cancellazione è totale ovunque tranne che sulla traiettoria classica, e il sasso «ha» una traiettoria con precisione sovrumana. Per l&rsquo;elettrone nelle due fenditure, invece, l&rsquo;azione in gioco è dell&rsquo;ordine di pochi $\hbar$: la fase di un paio di cammini è comparabile, non si cancella, e l&rsquo;interferenza sopravvive. <b>Lo stesso principio, due regimi</b> — ed è lo stesso $\hbar$ piccolo che, nella tappa 05, rendeva invisibile la lunghezza d&rsquo;onda del sasso. Il limite classico non è una teoria diversa: è ciò che resta della somma sui cammini quando $S/\hbar\to\infty$.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`La somma sui cammini assegna a ogni cammino la stessa <i>intensità</i> (modulo dell&rsquo;ampiezza) e una <i>fase</i> diversa. Se invece assegnasse a ogni cammino una probabilità reale, che cosa si perderebbe?`,
    a:R`Si perderebbe <b>tutta la fisica</b>, per la ragione della tappa 04: probabilità reali non negative non si cancellano, quindi la cancellazione dei cammini non-stazionari non avverrebbe, e <i>tutti</i> i cammini contribuirebbero positivamente. Non emergerebbe nessuna traiettoria privilegiata, e il limite classico non si recupererebbe. È la fase $S/\hbar$ — l&rsquo;argomento del numero complesso $e^{iS/\hbar}$ — a fare selezione: il criterio della <b>fase stazionaria</b> è la versione «su tutti i cammini» del termine d&rsquo;interferenza, e dipende in modo essenziale dal fatto che le ampiezze siano complesse.`}
  ]}
]},

/* ---------------- 08 · IL SENSO E LE ROTTE ---------------- */
{ num:'08', title:'Il senso, e le rotte', meta:'cosa lascia in mano · dove l’ampiezza riappare in fisica · la domanda che porta avanti',
  blocchi:[
  {t:'prosa', title:'Cosa portarsi via', tag:'sintesi', html:R`
  <p><b>Il punto.</b> Le due fenditure non chiedono di rimpicciolire la particella: chiedono di cambiare l&rsquo;oggetto che si somma. La fisica classica somma probabilità — reali, non negative, incapaci di cancellarsi — e non può produrre una frangia scura. La meccanica quantistica somma <b>ampiezze</b>, numeri complessi, e solo dopo la somma ne prende il modulo quadro (regola di Born) per ottenere la probabilità. Nel modulo quadro di una somma compare il termine d&rsquo;interferenza $2\operatorname{Re}(\psi_1^{*}\psi_2)$, assente nella somma classica: è lui, e lui solo, la differenza fra i due mondi.</p>
  <p><b>Che cosa ricordare, in ordine di durata.</b> Che l&rsquo;ampiezza dev&rsquo;essere <i>complessa</i>, perché serve un modulo (che al quadrato dà la probabilità) e una fase continua (che dà l&rsquo;interferenza con tutte le sue gradazioni): un segno solo spiega le frange estreme, non quelle intermedie. Che la fase avanza con la lunghezza d&rsquo;onda di de Broglie $\lambda=h/p$, e che il mondo sembra classico non perché le palle da biliardo siano speciali, ma perché la loro $\lambda$ è $10^{-13}$ volte il raggio di un protone — $\hbar$ è piccolo, non zero. Che la $\psi$ <b>non è un&rsquo;onda di materia</b>: l&rsquo;elettrone arriva sempre intero, e $|\psi|^2$ è la probabilità di trovarlo, non la densità di quanto ce n&rsquo;è. Che lo stato con entrambe le fenditure aperte è una <i>sovrapposizione</i> e non una <i>miscela</i>, distinzione che vive nel termine d&rsquo;interferenza e che è il senso fisico della coerenza. E che tutto questo è il caso a due termini della somma sui cammini, da cui la meccanica classica rinasce per fase stazionaria quando $S/\hbar\to\infty$.</p>
  <p>Di un movimento fatto di esperimenti semplici, ciò che resta è <b>un oggetto e una regola</b>: l&rsquo;ampiezza complessa, e il fatto che si somma prima di diventare probabilità. Il resto del corso costruisce lo spazio in cui questo oggetto vive (lo spazio di Hilbert), gli operatori che vi agiscono, e le simmetrie che li generano — ma l&rsquo;oggetto è questo, ed è stato consegnato.</p>`},
  {t:'prolessi', title:'Dove riappare questo movimento',
   oggetto:R`<b>L&rsquo;ampiezza complessa che si somma prima del modulo quadro</b>, e il termine d&rsquo;interferenza $2\operatorname{Re}(\psi_1^{*}\psi_2)$ che distingue una sovrapposizione coerente da una miscela.`,
   rotte:[
    {dove:'Il formalismo<br>di Dirac', txt:R`La «somma di ampiezze» diventa la <b>combinazione lineare di ket</b> in uno spazio di Hilbert, e il modulo quadro diventa il modulo quadro di un prodotto scalare, $|\langle\phi|\psi\rangle|^2$. Il principio di sovrapposizione enunciato qui è il primo postulato; la regola di Born, il secondo. Tutta l&rsquo;algebra di bra e ket è la grammatica che rende meccanico il «sommare ampiezze e poi fare il modulo quadro».`},
    {dove:'L’indeterminazione<br>e la misura', txt:R`Il pacchetto d&rsquo;onda come sovrapposizione di onde piane dà, come fatto sulla trasformata di Fourier, la relazione di indeterminazione posizione-impulso; e il microscopio di Heisenberg — che Picasso ricostruisce in §3.6 con $\Delta x\,\Delta p\sim h$ — ne è la lettura operativa. La distinzione sovrapposizione/miscela diventa il problema della misura e del collasso: che cosa fa sparire il termine d&rsquo;interferenza.`},
    {dove:'La somma sui cammini<br>e la teoria dei campi', txt:R`L&rsquo;ampiezza $e^{iS/\hbar}$ sommata su tutti i cammini è il <b>propagatore</b>, e la sua generalizzazione ai campi è l&rsquo;integrale funzionale, lo strumento con cui si quantizzano l&rsquo;elettromagnetismo e le interazioni fondamentali. La fase stazionaria che qui recupera la traiettoria classica è, lì, il limite classico di una teoria di campo.`},
    {dove:'La coerenza<br>e le tecnologie quantistiche', txt:R`La sovrapposizione coerente di stati discreti — lo spin $\tfrac{1}{\sqrt2}(|{+}z\rangle+|{-}z\rangle)$ di Ballentine — è il <b>qubit</b>, e il termine d&rsquo;interferenza è la risorsa che computazione e crittografia quantistiche sfruttano. La sua distruzione da parte dell&rsquo;ambiente è la <i>decoerenza</i>, il meccanismo che spiega perché il mondo macroscopico appare classico anche quando $\hbar$ non è trascurabile.`}
   ],
   domanda:R`Abbiamo detto che il termine d&rsquo;interferenza muore quando diventa disponibile l&rsquo;informazione su quale cammino sia stato preso, e che questo distingue una sovrapposizione da una miscela. <b>Domanda che porti avanti:</b> ma «diventa disponibile» a chi, e in che senso fisico? Non serve che un osservatore umano guardi; basta che l&rsquo;informazione si imprima da qualche parte nell&rsquo;ambiente — un fotone diffuso, un grado di libertà che si correla col cammino. Allora la frontiera fra sovrapposizione e miscela non è una linea fra «micro» e «macro», ma dipende da <i>quanto</i> un sistema è riuscito a non lasciare traccia di sé nell&rsquo;ambiente. Capire come e quanto velocemente questa traccia si formi — la decoerenza — è il problema da cui parte lo studio dei sistemi quantistici complessi, ed è dove il «sommare ampiezze» incontra la meccanica statistica.`}
]}

];

  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }

  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}

function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}

  var wrap=document.createElement('section'); wrap.className='section';

  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }

}

  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }

}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    /* DUE SCHEMI, NON UNO — scoperto il 2026-10-06 provando le pagine vive. I movimenti
       scritti per primi (em-01..03, me-10b, i collaudi di gd-01..09 e di quattro em)
       usano una forma piu' semplice: `reveal` e `prolessi` con un solo `html`,
       `esercizio` e `collaudo` con `html` + `sol`. Il renderer ne conosceva una sola e
       chiamava `steps.forEach` su `undefined`: TypeError, e la tappa si fermava li' —
       62 blocchi in 17 movimenti su 74. Non si riscrive il contenuto per far contento
       il renderer: e' il renderer che deve leggere cio' che c'e'.
       E in fondo un ramo che NON muore: uno schema nuovo di domani deve far vedere un
       avviso in quella sezione, non spegnere la pagina sotto di se'. */
    try{
      if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
      else if(b.t==='prolessi') m.appendChild(b.rotte ? sectionProlessi(b)
                                   : sectionProsa(b.title,'prolessi',b.html));
      else if(b.t==='reveal')m.appendChild(b.steps ? sectionReveal(b.title,b.tag,b.steps)
                                   : sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='esercizio') m.appendChild(b.steps ? sectionEsercizio(b)
                                   : sectionSvelabile(b.title,'esercizio',b.html,b.sol));
      else if(b.t==='collaudo')  m.appendChild(b.items ? sectionCollaudo(b.title,b.items)
                                   : sectionSvelabile(b.title,'provi, poi riveli',b.html,b.sol));
      else if(b.t==='plot')      m.appendChild(sectionPlot(b));
      else m.appendChild(sectionProsa(b.title||'(blocco)', 'tipo sconosciuto: '+b.t,
                                      b.html||''));
    }catch(err){
      var avv=document.createElement('section'); avv.className='section';
      avv.innerHTML='<h3>'+(b.title||'(blocco)')+'<span class="tag">non reso</span></h3>'
        +'<p style="color:#ff6b6b">Questo blocco non si &egrave; potuto rendere ('
        +b.t+': '+err.message+'). Il resto della tappa continua sotto.</p>';
      m.appendChild(avv);
    }
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* I POP-UP DEGLI STRUMENTI. `cablaStrumenti` esisteva dal 18-09 e non la chiamava
     nessuno: i 229 rimandi del percorso erano <span> senza handler, e il clic non
     faceva niente. Nessun controllo poteva vederlo — la sintassi era valida, le schede
     c'erano tutte, le formule rendevano: il guasto esisteva solo a pagina viva. Qui, e
     dopo ogni inserimento successivo, perche' la tappa si rimonta da capo a ogni
     cambio e gli handler vanno riattaccati al DOM nuovo. */
  cablaStrumenti(m);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}
