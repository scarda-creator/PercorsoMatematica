/* ===================================================================

   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un

   Apertura: lo stesso gesto del collaudo (si clicca, il pannello compare,

   =================================================================== */
var CORSO = 'astrofisica';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["principio-di-equivalenza"] = {"nome":"Principio di equivalenza","riga":"Un laboratorio in caduta libera e non rotante è indistinguibile, per qualunque esperimento fisico, da un laboratorio inerziale lontano da ogni massa: la gravità locale si cancella sostituendo il riferimento (Einstein, 1907).","serve":"È il ponte che permette di dedurre effetti di relatività generale senza conoscerne le equazioni: basta sostituire un campo gravitazionale uniforme $\\vec g$ con un riferimento non inerziale che accelera con $\\vec a=-\\vec g$, risolvere il problema nel riferimento accelerato — dove vale la relatività speciale — e tradurre il risultato indietro. Così si ottengono sia il redshift gravitazionale (confrontando un fotone emesso dal pavimento e ricevuto al soffitto di un ascensore accelerato con l'effetto Doppler) sia la curvatura dei raggi di luce (seguendo il percorso di un fotone in un ascensore che accelera lateralmente). Il principio non prova da solo le equazioni di campo: dice che la gravità e l'accelerazione sono la stessa cosa vista da due riferimenti, e questo basta a dedurre moltissimo prima di scrivere un solo tensore.","esempio":"Un ascensore fermo su un pianeta con $g=9{,}8\\ \\mathrm{m/s^2}$ e un ascensore nello spazio vuoto che accelera a $a=9{,}8\\ \\mathrm{m/s^2}$ sono equivalenti: un fotone lanciato orizzontalmente percorre, nei due casi, la stessa traiettoria parabolica rispetto alle pareti dell'ascensore. Il conto dice anche perché nessuno la vede mai: attraversando una cabina larga $3$ m il fotone ci impiega $t=3/c=1{,}001\\cdot10^{-8}$ s, e in quel tempo cade di $\\Delta y=\\tfrac12 g t^{2}=4{,}907\\cdot10^{-16}$ m — mezzo femtometro, più piccolo di un nucleo atomico.","pieno":{"file":"as-02-lo-spaziotempo-e-la-gravita.html","tappa":"03","come":"i tre principi di Einstein (relatività, equivalenza, Mach) e l'ascensore come dispositivo di calcolo, usato poi per derivare il redshift gravitazionale e la curvatura della luce"},"controllo":[{"tipo":"numero","espr":"(3/2.998e8)*1e8","vale":"1.001","dove":"esempio","appare":"1{,}001\\cdot10^{-8}"},{"tipo":"numero","espr":"(0.5*9.8*(3/2.998e8)**2)*1e16","vale":"4.907","dove":"esempio","appare":"4{,}907\\cdot10^{-16}"}]};
STRUM["parsec-e-parallasse"] = {"nome":"Parsec e parallasse","riga":"Il parsec è la distanza da cui il raggio dell'orbita terrestre è visto sotto un secondo d'arco: $1\\ \\mathrm{pc}=1\\,\\mathrm{UA}/1''=3{,}086\\cdot10^{16}$ m, e la distanza di una stella in parsec è l'inverso della sua parallasse in secondi d'arco.","serve":"A non portare mai un fattore di conversione a memoria. La definizione è geometrica e si ricostruisce in due righe: se $p$ è l'angolo sotto cui dalla stella si vede il semiasse maggiore dell'orbita terrestre, per angoli piccoli $p=R_{\\text{UA}}/d$, e scegliendo l'unità di distanza in modo che $p=1''$ corrisponda a $d=1$ si ottiene $d[\\mathrm{pc}]=1/p['']$. Il parsec non è un'unità più «astronomica» dell'anno luce: è l'unità in cui la misura che si fa davvero — un angolo — diventa direttamente una distanza, senza nessun conto intermedio. Nelle prove scritte di Astrofisica il valore $1\\ \\mathrm{pc}=3{,}086\\cdot10^{16}$ m è stampato in calce al foglio fra i dati: ciò che va saputo è l'inversione, non il numero.","esempio":"La stella più vicina, Proxima Centauri, ha parallasse $p=0{,}7687''$. Quindi $d=1/0{,}7687=1{,}301$ pc, e in anni luce $d=3{,}26/0{,}7687=4{,}24$ anni luce. Il controllo di coerenza è immediato: una parallasse inferiore al secondo d'arco vuol dire per forza una distanza superiore al parsec, e se il conto dà il contrario è stata invertita la frazione.","pieno":{"file":"as-01-la-scala-del-cosmo.html","tappa":"02","come":"la derivazione del parsec dalla parallasse annua e le conversioni fra unità astronomica, anno luce e parsec, nel movimento sulla scala del cosmo"},"controllo":[{"tipo":"numero","espr":"1.496e11/(pi/648000)/1e16","vale":"3.086","dove":"riga","appare":"3,086\\cdot10^{16}"},{"tipo":"numero","espr":"1/0.7687","vale":"1.301","dove":"esempio","appare":"1,301"},{"tipo":"numero","espr":"3.26/0.7687","vale":"4.24","dove":"esempio","appare":"4,24"},{"tipo":"numero","espr":"1.496e11/(pi/648000)/1e16","vale":"3.086","dove":"serve","appare":"3,086\\cdot10^{16}"}]};
STRUM["raggio-di-schwarzschild"] = {"nome":"Raggio di Schwarzschild","riga":"$r_s=2GM/c^{2}$: il raggio al quale il coefficiente temporale della metrica si annulla, e sotto il quale nessun segnale può più tornare indietro.","serve":"Si ottiene in due modi indipendenti, e vale la pena saperli dire entrambi perché uno è sbagliato e arriva giusto per caso, l'altro è quello vero. Newtonianamente, $r_s$ è il raggio per cui la velocità di fuga $v=\\sqrt{2GM/r}$ eguaglia $c$: il conto è fuori contesto, perché la relatività speciale non ammette velocità di fuga maggiori di $c$ nel senso newtoniano, e un fotone non 'fugge lentamente' per poi fermarsi. Il risultato è però numericamente corretto, e la ragione vera si vede nella metrica in campo debole derivata dal redshift gravitazionale: il coefficiente $g_{00}=1-2GM/(rc^{2})$ si annulla esattamente allo stesso $r$. È lì che il tempo proprio di un osservatore all'infinito smette di avere senso rispetto a un orologio fermo a quel raggio, e la singolarità è quella delle coordinate di Schwarzschild, non necessariamente dello spazio-tempo.","esempio":"Per il Sole, $M_\\odot=1{,}989\\cdot10^{30}$ kg, $r_s=2{,}954\\cdot10^{3}$ m: tre chilometri, contro un raggio reale di $6{,}957\\cdot10^{8}$ m — il Sole dista dal collasso un fattore $2{,}4\\cdot10^{5}$. Per la Terra, $r_s=8{,}866$ mm: comprimere tutta la massa terrestre dentro una sfera di meno di un centimetro di raggio la trasformerebbe in un buco nero.","pieno":{"file":"as-02-lo-spaziotempo-e-la-gravita.html","tappa":"09","come":"le due derivazioni del raggio di Schwarzschild nell'ordine in cui si dicono all'orale — l'argomento newtoniano della velocità di fuga e la singolarità del coefficiente metrico derivato dal redshift gravitazionale"},"controllo":[{"tipo":"uguale","sinistra":"sqrt(2*G*M/(2*G*M/c**2))","vale":"c","ipotesi":{"G":"positive","M":"positive","c":"positive"},"dove":"serve","appare":"v=\\sqrt{2GM/r}"},{"tipo":"numero","espr":"2*6.674e-11*1.989e30/(2.998e8)**2/1e3","vale":"2.954","dove":"esempio","appare":"2{,}954\\cdot10^{3}"},{"tipo":"numero","espr":"2*6.674e-11*5.97e24/(2.998e8)**2*1e3","vale":"8.866","dove":"esempio","appare":"8{,}866"}]};

function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';
  return h;
}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });

  {t:'prosa', title:'Il programma mette la gravità prima delle stelle, e non per caso', tag:'architettura', html:R`
  <p>La prima delle cinque parti del programma di de Bernardis elenca, nell&rsquo;ordine: spazio e tempo, particelle e forze, e poi — prima ancora di stelle, spettri o galassie — <i>«Teorie della Gravità. Equazioni di Einstein e loro uso in astrofisica e cosmologia»</i>. Non è un capitolo di cultura generale messo lì per completezza: è la scelta di costruire, prima di misurare qualunque cosa, gli strumenti con cui le misure vanno interpretate. Un redshift spettroscopico, una distanza, un intervallo di tempo osservato — nessuno di questi tre ha lo stesso significato in un campo gravitazionale forte che ha in uno debole, e il resto del corso li tratterà come se il significato fosse scontato.</p>
  <p><b>Questo movimento non deriva la relatività generale per intero.</b> Non costruisce la soluzione esatta di Schwarzschild, non arriva alle equazioni di Friedmann partendo da zero — quel lavoro appartiene a un altro momento del corso, quando la metrica di Robertson-Walker diventerà protagonista. Qui si fanno due cose più modeste e più usate: si capisce <b>perché</b> lo spazio e il tempo smettono di essere uno sfondo fisso quando c&rsquo;è gravità, e si portano a termine per intero i <b>due conti che tornano nei problemi</b> — il redshift gravitazionale e il raggio critico di Schwarzschild. Dieci prove della banca dati toccano questo movimento, con densità 2,8: non è un argomento marginale, è un argomento che si presenta sempre nella stessa forma.</p>`},
  {t:'prosa', title:'Cosa saprai fare, uscendo di qui', tag:'performance attesa', html:R`
  <ul>

  <li>Scrivere l&rsquo;intervallo spazio-temporale di Minkowski e dire perché è invariante, cioè perché due osservatori in moto relativo misurano lo stesso $ds^2$ anche se non misurano lo stesso $\Delta t$ e lo stesso $\Delta x$ separatamente.</li>
  <li>Enunciare il principio di equivalenza e usarlo come <b>dispositivo di calcolo</b>: sostituire un campo gravitazionale con un riferimento accelerato, risolvere lì il problema con la relatività speciale, tradurre il risultato indietro.</li>
  <li><b>Derivare il redshift gravitazionale</b> dall&rsquo;ascensore di Einstein, nell&rsquo;ordine esatto in cui si dice all&rsquo;orale, e applicarlo a un caso numerico vero (una nana bianca) senza il foglio dei dati.</li>
  <li>Derivare il <b>raggio di Schwarzschild in due modi indipendenti</b> — l&rsquo;argomento newtoniano della velocità di fuga e la singolarità del coefficiente della metrica — e dire perché il primo è concettualmente sbagliato pur arrivando al numero giusto.</li>

  <p>L&rsquo;esperimento di Michelson e Morley non si rifà qui per intero — appartiene alla relatività speciale di un corso precedente — ma la sua conclusione è il punto da cui questo movimento parte: <b>la velocità della luce misurata è la stessa in ogni direzione e in ogni riferimento inerziale</b>, contro ogni aspettativa di un etere che trascinasse la luce come un fluido trascina un&rsquo;onda sonora. De Bernardis lo riassume nella conclusione della sua lezione sulla relatività: <i>«Anche sperimentalmente (esperimento di Michelson-Morley per i fotoni, esperimento di Bruno Rossi sui muoni per le particelle massive) resta dimostrato che le trasformazioni valide in generale sono quelle di Lorentz»</i>.</p>
  <p>La parte nuova, e quella che vale la pena fare fino in fondo con i numeri, è il secondo esperimento citato: non un esperimento con la luce, ma con una particella <b>massiva</b> e <b>instabile</b>, che mette alla prova la dilatazione dei tempi in un modo impossibile da equivocare.</p>`},
  {t:'prosa', title:'Il paradosso dei muoni: più ne arrivano di quanti dovrebbero', tag:'il dato', html:R`
  <p>I muoni dei raggi cosmici si formano per decadimento dei pioni nell&rsquo;alta atmosfera, a un&rsquo;altezza tipica $h=9000$ m, e decadono con vita media $\tau_0=2{,}2\ \mu$s. Classicamente — cioè trattando il tempo come assoluto — un muone che viaggiasse alla velocità della luce percorrerebbe in una vita media
  $$d=c\,\tau_0=2{,}998\cdot10^{8}\cdot2{,}2\cdot10^{-6}=659{,}6\ \mathrm{m}.$$
  Per arrivare a terra da $9000$ m dovrebbe sopravvivere per
  $$\frac{h}{d}=\frac{9000}{659{,}6}=13{,}65$$
  vite medie, e la frazione che sopravvive dopo tante vite medie è $e^{-13{,}65}$. Fatto il conto,
  $$e^{-13{,}65}\cdot10^{6}=1{,}185,$$
  cioè <b>poco più di uno su un milione</b> dovrebbe raggiungere il suolo — un numero che de Bernardis arrotonda alla stessa conclusione: <i>«uno ogni milione che parte. Invece ne vediamo molti di più. Dov&rsquo;è l&rsquo;errore?»</i>. Non è un errore di conto: il conto classico è corretto <i>dato</i> che il tempo sia assoluto. L&rsquo;errore è nella premessa.</p>`},
  {t:'plot', title:'Il fattore che cresce senza limite quando la velocità si avvicina a $c$',
   intro:R`Sull’asse orizzontale $\beta=v/c$, su quello verticale il fattore di Lorentz $\gamma=1/\sqrt{1-\beta^2}$. Il punto segnato è quello dei muoni dei raggi cosmici, $\beta=0{,}98$.`,
   plots:[
    {kind:'func2d', f:'1/sqrt(1-x**2)', xr:[0,0.999], yr:[0,12], height:340, equal:false,
     title:'x = beta = v/c    y = gamma',
     marks:[{x:0.98, y:5.025, label:'muone, gamma=5,025', col:'#ff9b6b', up:true}]}
   ],
   leggi:R`<p><b>Che cosa guardare: la curva resta quasi piatta fino a metà, poi precipita verso l&rsquo;alto.</b> Per $\beta\lt0{,}5$ il fattore $\gamma$ è ancora sotto $1{,}2$ — la correzione relativistica della vita quotidiana, degli aerei e dei satelliti, è minuscola. Il muone sta già oltre il ginocchio della curva: a $\beta=0{,}98$, $\gamma=5{,}025$, e l&rsquo;orologio del muone, visto da terra, scorre cinque volte più lentamente del previsto classico.</p>
   <p><b>Che cosa impararne: la curva non ha un punto finale a $\beta=1$, ha un asintoto verticale.</b> Nessuna quantità di energia porta $\gamma$ a un valore finito per $\beta=1$: è la ragione algebrica, prima che fisica, per cui una particella con massa non raggiunge mai $c$. I muoni dei raggi cosmici, con $\beta=0{,}98$, sono già a un quinto della salita verso l&rsquo;infinito.</p>`},
  {t:'prosa', title:'Visto da terra: l’orologio del muone rallenta, e il conto torna', tag:'il riferimento del laboratorio', html:R`
  <p>Un muone con $v=0{,}98\,c$ ha $\gamma=1/\sqrt{1-0{,}98^2}=5{,}025$ — il punto segnato in figura. La relatività speciale dice che un orologio in moto, visto dal laboratorio, batte più lentamente di questo stesso fattore: la vita media <i>osservata da terra</i> non è $\tau_0$, ma
  $$\tau_{\mathrm{oss}}=\gamma\,\tau_0=5{,}025\cdot2{,}2=11{,}06\ \mu\mathrm{s}.$$
  In questo tempo, viaggiando a $0{,}98\,c$, il muone percorre
  $$c\,\tau_{\mathrm{oss}}=2{,}998\cdot10^{8}\cdot11{,}06\cdot10^{-6}=3{,}314\ \mathrm{km},$$
  e il numero di vite medie necessarie per attraversare i $9000$ m diventa
  $$\frac{9000}{3314}=2{,}715$$
  — non più quattordici, meno di tre. La frazione che sopravvive è ora
  $$e^{-2{,}715}=6{,}618\%,$$
  <b>sessantasei volte più grande della stima classica</b>, ed è il numero — non «molti di più» in modo vago, ma $6{,}618\%$ contro $0{,}0001185\%$ — che chiude il paradosso. De Bernardis arrotonda allo stesso ordine: <i>«65000 per ogni milione che parte»</i>, e $6{,}618\%$ di un milione è $66\,180$: la stessa cosa, con una cifra di differenza dovuta al valore rotondo di $\beta$ usato qui per il conto.</p>`},
  {t:'prosa', title:'Visto dal muone: non è il tempo che cambia, è lo spazio', tag:'il riferimento del muone', html:R`
  <p>C&rsquo;è un secondo modo di raccontare lo stesso risultato, ed è quello che rivela perché la relatività non è un trucco sul tempo isolato: <b>nel riferimento del muone, la sua vita media resta $\tau_0=2{,}2\ \mu$s</b> — un orologio non misura mai se stesso dilatato. Quello che cambia, visto dal muone, è lo spessore dell&rsquo;atmosfera: contratto del fattore $\gamma$,
  $$\frac{h}{\gamma}=\frac{9000}{5{,}025}=1{,}791\ \mathrm{km}$$
  invece di $9$ km. In una vita media propria, muovendosi a $0{,}98\,c$ nel proprio riferimento, il muone percorre
  $$v\,\tau_0=0{,}98\cdot2{,}998\cdot10^{8}\cdot2{,}2\cdot10^{-6}=646{,}4\ \mathrm{m},$$
  quindi il numero di vite medie per attraversare l&rsquo;atmosfera <i>contratta</i> è
  $$\frac{1791}{646{,}4}=2{,}771,$$
  e la frazione superstite $e^{-2{,}771}=6{,}261\%$ — <b>lo stesso risultato della tappa precedente, entro l&rsquo;arrotondamento di $\beta=0{,}98$</b>, ottenuto da un&rsquo;ipotesi opposta: lì il tempo del muone rallentava, qui è lo spazio della Terra a restringersi. I due racconti non sono approssimazioni l&rsquo;uno dell&rsquo;altro: sono lo stesso evento fisico — il muone che tocca il suolo — descritto da due osservatori che non concordano sul tempo trascorso né sulla distanza percorsa, ma concordano sul fatto che accade.</p>`},
  {t:'prosa', title:'Dove questo porta: spazio e tempo si fondono in una sola entità', tag:'il filo verso la metrica', html:R`
  <p>Questo è il punto in cui l&rsquo;esperimento smette di essere un curioso effetto cinematico e diventa un indizio strutturale. Due osservatori — il laboratorio e il muone — non misurano lo stesso $\Delta t$ né lo stesso $\Delta x$, eppure concordano su <i>quale evento accade</i>. Deve esistere una combinazione di $\Delta t$ e $\Delta x$ sulla quale concordano entrambi: se non esistesse, la fisica dipenderebbe da chi la guarda, e nessuna legge sarebbe scrivibile. De Bernardis chiude la lezione con la frase che anticipa esattamente la prossima tappa: <i>«Spazio e Tempo formano un&rsquo;unica entità, la metrica dello spazio quadridimensionale, in assenza di forze, è quella di Minkowski»</i>. È lì che si va adesso: non più due numeri che ciascun osservatore misura a modo suo, ma un singolo invariante che li lega.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Se il tempo fosse assoluto come in meccanica classica, quale frazione di muoni dovrebbe arrivare a terra, e quale arriva davvero?`,
    a:R`Classicamente, un muone impiegherebbe $13{,}65$ vite medie per percorrere $9000$ m anche viaggiando a $c$, e la frazione superstite sarebbe $e^{-13{,}65}\approx1{,}185$ per milione. Con la dilatazione relativistica dei tempi, l&rsquo;orologio del muone (visto da terra) rallenta di un fattore $\gamma=5{,}025$, il numero di vite medie scende a $2{,}715$, e la frazione superstite sale a $6{,}618\%$ — <b>circa sessantasei volte più grande</b>. La differenza fra i due numeri non è un dettaglio: è la misura diretta di quanto il tempo assoluto sia sbagliato a quella velocità.`},
   {q:R`Nel riferimento del muone, chi rallenta e chi si contrae?`,
    a:R`Nel riferimento del muone <b>nessun orologio del muone rallenta</b> — la sua vita media resta $2{,}2\ \mu$s, come sempre per un orologio che misura se stesso. Ciò che cambia è lo spessore dell&rsquo;atmosfera terrestre, contratto di un fattore $\gamma$ da $9000$ m a $1791$ m. I due racconti — tempo dilatato nel riferimento di terra, spazio contratto nel riferimento del muone — non sono in conflitto: sono due modi di descrivere lo stesso evento fisico, e danno (a meno di arrotondamento) la stessa frazione di sopravvissuti, $6{,}6\%$ circa.`}
  ]}
]},

/* ---------------- 02 · L'INTERVALLO SPAZIO-TEMPORALE ---------------- */
{ num:'02', title:'L’intervallo spazio-temporale: ciò su cui due osservatori concordano sempre', meta:'la metrica di Minkowski · un’identità algebrica, verificata · timelike, spacelike, null · verso una metrica che può curvarsi',
  blocchi:[
  {t:'prosa', title:'L’invariante che la tappa precedente ha promesso', tag:'la costruzione', html:R`
  <p>Due eventi nello spazio-tempo — l&rsquo;emissione di un fotone, l&rsquo;arrivo di un muone — sono separati da un intervallo di tempo $\Delta t$ e da uno spaziale $\Delta x$ (per semplicità, lungo un solo asse: la generalizzazione a tre dimensioni spaziali aggiunge solo altri due termini con lo stesso segno). Nessuno dei due separatamente è invariante: un osservatore in moto misura $\Delta t'$ e $\Delta x'$ diversi, legati ai primi dalle trasformazioni di Lorentz,
  $$\Delta t'=\gamma\left(\Delta t-\frac{v\,\Delta x}{c^{2}}\right),\qquad \Delta x'=\gamma(\Delta x-v\,\Delta t),\qquad \gamma=\frac{1}{\sqrt{1-v^2/c^2}}.$$
  La combinazione che resta identica in ogni riferimento inerziale è
  $$ds^{2}=c^{2}\Delta t^{2}-\Delta x^{2}$$
  — <b>l&rsquo;intervallo spazio-temporale</b>, e il segno relativo fra la parte temporale e quella spaziale (uno positivo, l&rsquo;altro negativo) è il contenuto fisico più importante di tutta la relatività speciale: dice che il tempo non si somma allo spazio come una quarta coordinata uguale alle altre, ma gli si oppone.</p>`},
  {t:'prosa', title:'L’invarianza non è un’affermazione, è un conto', tag:'la verifica, non la fede', html:R`
  <p>Vale la pena vederlo come un&rsquo;identità algebrica esplicita, non come un atto di fede nella parola «invariante». Lavorando per un momento in unità in cui $c=1$ — la struttura algebrica si vede meglio spoglia dei fattori di $c$, che si rimettono al loro posto per analisi dimensionale — le trasformazioni diventano $t'=\gamma(t-\beta x)$, $x'=\gamma(x-\beta t)$ con $\beta=v/c$ e $\gamma=1/\sqrt{1-\beta^2}$. Il calcolo diretto dà
  $$t'^{2}-x'^{2}=\frac{(t-\beta x)^{2}-(x-\beta t)^{2}}{1-\beta^{2}}=\frac{(1-\beta^{2})(t^{2}-x^{2})}{1-\beta^{2}}=t^{2}-x^{2}.$$
  Il fattore $(1-\beta^2)$ che compare al numeratore dopo aver espanso i due quadrati è esattamente quello che cancella il denominatore — non per un caso fortunato, ma perché le trasformazioni di Lorentz sono state costruite apposta per avere questa proprietà, allo stesso modo in cui le rotazioni nel piano sono costruite apposta per lasciare invariata la distanza euclidea $x^2+y^2$. L&rsquo;intervallo spazio-temporale è alla relatività ciò che la distanza è alla geometria euclidea, con un segno di differenza che cambia tutto.</p>`},
  {t:'prosa', title:'Tre tipi di separazione, e un esempio numerico vero', tag:'timelike, spacelike, null', html:R`
  <p>Il segno di $ds^2$ classifica la relazione causale fra due eventi, ed è lo stesso in tutti i riferimenti perché $ds^2$ è invariante:</p>
  <ul>
  <li><b>$ds^2\gt0$, separazione di tipo tempo (timelike):</b> esiste un riferimento in cui i due eventi accadono nello stesso punto, in momenti diversi — un segnale più lento della luce può collegarli, e la causalità ha senso.</li>
  <li><b>$ds^2\lt0$, separazione di tipo spazio (spacelike):</b> esiste un riferimento in cui accadono nello stesso istante, in punti diversi — nessun segnale può collegarli, e osservatori diversi possono disaccordare su quale dei due accada prima.</li>
  <li><b>$ds^2=0$, separazione di tipo luce (null):</b> solo la luce, viaggiando esattamente a $c$, collega i due eventi.</li>
  </ul>
  <p>Un esempio con i numeri di questo stesso movimento: due eventi separati da $\Delta t=1$ s e $\Delta x=10^{8}$ m (un decimo della distanza che la luce percorre in un secondo) danno
  $$ds^2=(c\,\Delta t)^2-\Delta x^2=\frac{(2{,}998\cdot10^{8})^2-(10^{8})^2}{10^{16}}\cdot10^{16}=7{,}988\cdot10^{16}\ \mathrm{m}^2\gt0:$$
  <b>separazione di tipo tempo</b>, perché $c\,\Delta t\gg\Delta x$. Un segnale luminoso ha tutto il tempo per collegare i due eventi e arrivare con margine; un osservatore abbastanza veloce (ma non superluminale) può trovarsi presente a entrambi.</p>`},
  {t:'prosa', title:'Dove questo porta: una metrica che smette di essere fissa', tag:'il filo verso l’equivalenza', html:R`
  <p>Marconi scrive la stessa combinazione in notazione tensoriale, quella che useranno le tappe seguenti:
  $$ds^{2}=g_{\mu\nu}\,dx^{\mu}dx^{\nu},$$
  con la convenzione di Einstein sugli indici ripetuti (una somma su $\mu,\nu=0,1,2,3$) e, in assenza di gravità, $g_{\mu\nu}$ che si riduce al tensore costante di Minkowski $\mathrm{diag}(1,-1,-1,-1)$ — esattamente i segni appena verificati. <b>La domanda che apre la tappa seguente è cosa succeda a $g_{\mu\nu}$ quando la gravità non è più assente.</b> La risposta di Einstein non è «niente, resta Minkowski ovunque tranne vicino a una massa»: è che $g_{\mu\nu}$ diventa esso stesso una funzione della posizione, determinata dalla distribuzione di massa-energia — e lo spazio-tempo, da sfondo, diventa un attore della fisica.</p>`}
]},

/* ---------------- 03 · IL PRINCIPIO DI EQUIVALENZA ---------------- */
{ num:'03', title:'Il principio di equivalenza: l’ascensore come macchina di calcolo', meta:'tre principi, uno fondante · l’ascensore di Einstein, 1907 · perché la relatività generale è non lineare',
  blocchi:[
  {t:'prosa', title:'Tre principi, e quale fa il lavoro', tag:'il punto di partenza di Einstein', html:R`
  <p>Marconi elenca i tre principi su cui Einstein fonda la relatività generale, ed è utile vederli insieme prima di usarne uno solo per tutto il resto del movimento:</p>
  <ol>
  <li><b>Il principio di relatività:</b> le leggi della fisica sono covarianti per trasformazioni di coordinate — hanno la stessa forma in tutti i sistemi di riferimento, non solo in quelli inerziali.</li>
  <li><b>Il principio di equivalenza:</b> massa inerziale e massa gravitazionale sono uguali, $m_i=m_g$, e di conseguenza in ogni punto dello spazio-tempo esiste un riferimento inerziale locale in cui la gravità è cancellata.</li>
  <li><b>Il principio di Mach:</b> le proprietà inerziali locali — e quindi la metrica $g_{\mu\nu}$ — sono determinate dalla distribuzione di materia ed energia.</li>
  </ol>
  <p>Il primo dice che la teoria deve essere scritta in forma tensoriale; il terzo dice che $g_{\mu\nu}$ deve rispondere a $T_{\mu\nu}$ — ed è il contenuto delle equazioni di campo della tappa 06. <b>Il secondo è quello che permette di calcolare risultati concreti senza ancora avere le equazioni di campo</b>, ed è il solo che serve per le prossime due tappe.</p>`},
  {t:'prosa', title:'L’ascensore di Einstein, enunciato come lo enuncia lui', tag:'1907', html:R`
  <p>De Bernardis cita la formulazione di Einstein quasi testualmente: <i>«Tutti i laboratori in caduta libera e non rotanti sono completamente equivalenti per tutti gli esperimenti fisici (Einstein, 1907)»</i>, e la versione concreta, quella con cui si calcola: <i>«una persona in un ascensore in caduta libera non sente il proprio peso, e non può capire se l&rsquo;ascensore si trova sulla terra ed è in caduta libera, oppure se si trova nello spazio lontano da altre masse. Viceversa un ascensore fermo sulla terra è indistinguibile da un ascensore nello spazio in accelerazione»</i> — con l&rsquo;accelerazione numericamente uguale a $g$. Questa è la formulazione su cui tutto il resto del movimento lavora: <span class="str" data-str="principio-di-equivalenza">un campo gravitazionale uniforme $\vec g$ e un riferimento che accelera con $\vec a=-\vec g$ sono lo stesso riferimento</span>, e qualunque esperimento fatto nell&rsquo;uno dà lo stesso risultato fatto nell&rsquo;altro.</p>
  <p>Il motivo per cui questo equivale a un metodo di calcolo, e non solo a un&rsquo;osservazione filosofica, è che il riferimento accelerato è un riferimento <b>della relatività speciale</b>, visto da fuori: dentro, un osservatore accelerato può ancora usare le trasformazioni di Lorentz istante per istante. Problemi che sembrerebbero richiedere la macchina completa della relatività generale — come la luce vista da un campo gravitazionale — diventano problemi di cinematica relativistica ordinaria, risolvibili con un ascensore e un cronometro.</p>`},
  {t:'prosa', title:'Perché la relatività generale è intrinsecamente non lineare', tag:'un’osservazione che anticipa la tappa 06', html:R`
  <p>Marconi segnala un punto che vale la pena avere in mente prima di arrivare alle equazioni di campo: il campo gravitazionale, a differenza del campo elettrico, <b>è sorgente di se stesso</b>. Un campo elettrico genera densità di energia, e quindi densità di massa inerziale — ma la massa non genera a sua volta carica elettrica, quindi il campo elettrico non si autoalimenta. Un campo gravitazionale genera densità di energia locale, e per $E=mc^2$ questa è densità di massa — che è <i>a sua volta</i> sorgente di campo gravitazionale. La gravità si piega su se stessa, ed è per questo che le equazioni che la descrivono non possono essere lineari come quelle di Maxwell: la non linearità non è un difetto della matematica che si userà, è una conseguenza fisica del fatto che la gravità gravita.</p>`}
]},

/* ---------------- 04 · IL REDSHIFT GRAVITAZIONALE ---------------- */
{ num:'04', title:'Il redshift gravitazionale, derivato dall’ascensore', meta:'l’ascensore accelerato, con i numeri · la formula generale, $z_g=GM/(Rc^2)$ · due verifiche storiche, una minuscola e una enorme',
  blocchi:[
  {t:'prosa', title:'Il montaggio: un fotone, un ascensore, un effetto Doppler', tag:'il dispositivo di calcolo', html:R`
  <p>Un fotone viene emesso dal pavimento di un ascensore e viaggia verso il soffitto, a distanza $h$. Per il principio di equivalenza, un ascensore fermo in un campo gravitazionale uniforme $g$ (diretto verso il pavimento) è indistinguibile da un ascensore nello spazio vuoto che <b>accelera verso l&rsquo;alto</b> con $a=g$. Nel secondo riferimento il problema è relatività speciale pura: il fotone parte a $t=0$ quando l&rsquo;ascensore è a velocità nulla, e arriva al soffitto dopo un tempo, al primo ordine, $t\simeq h/c$. In quell&rsquo;intervallo l&rsquo;ascensore — partito da velocità nulla, accelerando con $a=g$ — ha raggiunto la velocità
  $$v=a\,t=g\,\frac{h}{c},$$
  diretta verso l&rsquo;alto: <b>nella stessa direzione in cui il fotone sta viaggiando</b>. Il soffitto, cioè, si sta allontanando dal punto di emissione lungo la direzione di propagazione — esattamente come un ricevitore che scappa davanti a un&rsquo;onda che lo sta raggiungendo.</p>`},
  {t:'prosa', title:'L’effetto Doppler classico chiude il conto', tag:'la formula, e il segno', html:R`
  <p>Per un ricevitore che si allontana dalla sorgente nella direzione di propagazione, a velocità $v\ll c$, l&rsquo;effetto Doppler classico dà una frequenza osservata più bassa:
  $$\nu'=\nu\left(1-\frac{v}{c}\right)=\nu\left(1-\frac{gh}{c^{2}}\right).$$
  <b>Il fotone che sale perde frequenza — è redshiftato</b>, e il risultato è lo stesso identico conto che Marconi fa nell&rsquo;altra direzione (fotone dal soffitto al pavimento, blueshift): cambia solo il segno della velocità relativa, non la fisica. Scrivendo il redshift nella notazione standard,
  $$z_g=\frac{\lambda_{\mathrm{oss}}-\lambda_{\mathrm{em}}}{\lambda_{\mathrm{em}}}=\frac{\nu-\nu'}{\nu'}\simeq\frac{gh}{c^{2}}$$
  al primo ordine in $gh/c^2$. In un campo uniforme, $gh$ è esattamente la differenza di potenziale newtoniano $\Delta\varphi=\varphi(\mathrm{soffitto})-\varphi(\mathrm{pavimento})$ fra i due punti — e questo suggerisce la forma generale, valida anche in un campo non uniforme:
  $$z_g=\frac{\Delta\varphi}{c^{2}},\qquad \Delta\varphi=\varphi(r_{\mathrm{oss}})-\varphi(r_{\mathrm{em}}).$$</p>`},
  {t:'prosa', title:'La forma per una massa puntiforme, e un passaggio che si sbaglia spesso', tag:'il salto da ascensore a stella', html:R`
  <p>Per una stella di massa $M$ e raggio $R$, la luce emessa dalla fotosfera ($r=R$) e osservata a distanza infinita ($r\to\infty$, dove per convenzione $\varphi=0$) attraversa una differenza di potenziale
  $$\Delta\varphi=\varphi(\infty)-\varphi(R)=0-\left(-\frac{GM}{R}\right)=\frac{GM}{R}.$$
  Questo è il passaggio dove si sbaglia il segno più spesso: $\varphi$ è <i>negativo</i> vicino alla massa e <i>cresce</i> (si avvicina a zero) allontanandosi, quindi $\Delta\varphi$ fra un punto lontano e un punto vicino è <b>positivo</b>, non negativo. Sostituendo nella formula generale,
  $$z_g=\frac{\Delta\varphi}{c^{2}}=\frac{GM}{Rc^{2}}.$$
  <b>È sempre un redshift, non un blueshift</b>, per qualunque stella e qualunque osservatore più lontano della fotosfera: la luce che esce da una buca di potenziale perde sempre energia, non ne guadagna mai — a differenza del caso dell&rsquo;ascensore dove la direzione (su o giù) decideva il segno, qui la direzione è fissata dalla fisica del problema (si osserva sempre da fuori, mai da dentro la stella).</p>`},
  {t:'prosa', title:'Due verifiche storiche, agli estremi opposti della scala', tag:'dalla stella più densa alla Terra', html:R`
  <p><b>La prima verifica, enorme e storica.</b> Eddington propose nel 1924 un test su Sirio B, la nana bianca compagna di Sirio: con le stime di massa e raggio disponibili allora, il redshift gravitazionale previsto corrispondeva a una velocità equivalente $c\,z_g\simeq20$ km/s, e nel 1925 Adams misurò $19$ km/s — un accordo notevole per l&rsquo;epoca. <b>La seconda verifica, minuscola e di laboratorio.</b> Pound e Rebka, nel 1960, misurarono il redshift gravitazionale della luce che sale in una torre di $h=22{,}6$ m a Harvard, nel campo gravitazionale ordinario della Terra ($g=9{,}8\ \mathrm{m/s^2}$):
  $$z_g=\frac{gh}{c^{2}}=\frac{9{,}8\cdot22{,}6}{(2{,}998\cdot10^{8})^{2}}\cdot10^{15}=2{,}464\cdot10^{-15}.$$
  Per confronto, lo stesso conto su un palazzo di dieci metri darebbe $gh/c^2=1{,}090\cdot10^{-15}$ — <b>un numero quindici ordini di grandezza più piccolo di uno</b>, misurabile solo con l&rsquo;effetto Mössbauer e inconcepibile con qualunque orologio meccanico. Che lo stesso principio spieghi un effetto grande abbastanza da misurare con un telescopio del 1925 e un effetto piccolo abbastanza da richiedere la spettroscopia nucleare del 1960 è il genere di conferma che rende una teoria difficile da scartare.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Perché il fotone che sale dal pavimento al soffitto di un ascensore accelerato è redshiftato, e non blueshiftato?`,
    a:R`Perché nel riferimento equivalente (ascensore che accelera verso l&rsquo;alto), il soffitto — che riceve il fotone — si sta allontanando nella stessa direzione in cui il fotone viaggia: è un ricevitore che fugge davanti all&rsquo;onda, e un ricevitore che si allontana misura sempre una frequenza più bassa di quella emessa, qualunque sia il segno del campo. Se il fotone andasse nella direzione opposta (dal soffitto al pavimento), il pavimento si starebbe <i>avvicinando</i> al punto di emissione, e il risultato sarebbe un blueshift — stessa fisica, direzione invertita.`},
   {q:R`Perché la luce che esce da una stella è sempre redshiftata, mai blueshiftata, indipendentemente da dove si trovi l’osservatore?`,
    a:R`Perché il potenziale gravitazionale $\varphi=-GM/r$ cresce (si avvicina a zero) allontanandosi dalla stella, quindi $\Delta\varphi=\varphi_{\mathrm{oss}}-\varphi_{\mathrm{em}}$ è sempre positivo per un osservatore più lontano della fotosfera — e un $\Delta\varphi$ positivo dà sempre $z_g\gt0$, cioè redshift. Il caso dell&rsquo;ascensore aveva due direzioni possibili perché pavimento e soffitto sono simmetrici; una stella e un osservatore lontano non lo sono: si osserva sempre risalendo fuori dalla buca di potenziale, mai scendendoci dentro.`}
  ]}
]},

/* ---------------- 05 · LA CURVATURA DEI RAGGI DI LUCE ---------------- */
{ num:'05', title:'La curvatura dei raggi di luce, e perché anche lo spazio deve cambiare', meta:'lo stesso ascensore, accelerato lateralmente · un arco di cerchio, non una parabola a caso · il raggio $R=c^2/g$, con un numero che sorprende',
  blocchi:[
  {t:'prosa', title:'Lo stesso dispositivo, usato su un raggio orizzontale', tag:'la seconda applicazione dell’ascensore', html:R`
  <p>La tappa precedente ha mostrato che il principio di equivalenza cambia la parte <b>temporale</b> della metrica — il coefficiente di $dt^2$. Resta da chiedersi se cambi anche la parte <b>spaziale</b>, e la risposta si ottiene con lo stesso ascensore, usato in un modo diverso: un fotone che viaggia <i>orizzontalmente</i> da una parete all&rsquo;altra, mentre l&rsquo;ascensore accelera <i>verticalmente</i> con $a=g$.</p>
  <p>Nel tempo $t=l/c$ che il fotone impiega ad attraversare l&rsquo;ascensore (larghezza $l$), l&rsquo;ascensore si sposta verso l&rsquo;alto di
  $$\Delta l=\frac{1}{2}g\,t^{2}.$$
  Visto dall&rsquo;interno dell&rsquo;ascensore — cioè nel riferimento che per il principio di equivalenza è lo stesso di un campo gravitazionale statico — <b>il fotone non arriva dritto di fronte a dove è partito: arriva più in basso</b>, perché le pareti si sono spostate verso l&rsquo;alto mentre lui attraversava. La sua traiettoria, in quel riferimento, è curva.</p>`},
  {t:'plot', title:'Il percorso del fotone, visto dall’interno dell’ascensore accelerato',
   intro:'Nel riferimento dell’ascensore il fotone percorre un arco, non una retta: l’asse orizzontale è la distanza percorsa, l’asse verticale la caduta apparente rispetto a una traiettoria rettilinea. La curvatura qui è volutamente esagerata — nella realtà, per un campo come quello terrestre, è invisibile su qualunque scala di laboratorio.',
   plots:[
    {kind:'curve', x:'t', y:'-0.18*t**2', tr:[-3,3], xr:[-3.6,3.6], yr:[-2.2,0.6], height:320,
     title:'traiettoria del fotone nel riferimento accelerato (curvatura esagerata)',
     segs:[{x1:-3.4, y1:0, x2:3.4, y2:0, col:'#4d5a6b', dash:true, width:1.4, label:'percorso senza gravità', lx:0, ly:0.22}],
     marks:[{x:-3,y:-1.62,label:'fotone emesso',col:'#5eead4',left:true},
            {x:3,y:-1.62,label:'fotone ricevuto, più in basso',col:'#ff9b6b',up:true}]}
   ],
   leggi:R`<p><b>Che cosa guardare: la curva si stacca dalla retta tratteggiata, e si stacca sempre nella stessa direzione.</b> La retta tratteggiata è ciò che un fotone farebbe senza gravità — un percorso rettilineo a velocità costante. L&rsquo;arco è ciò che fa davvero nel riferimento accelerato: si incurva sempre verso il basso, perché l&rsquo;ascensore (e con lui ogni punto di riferimento fisso alle sue pareti) accelera verso l&rsquo;alto mentre il fotone attraversa.</p>
   <p><b>Che cosa impararne: questa curvatura è reale per chi sta nell&rsquo;ascensore, e per il principio di equivalenza è reale anche in un campo gravitazionale statico.</b> Non è un artefatto della scelta di riferimento accelerato: se l&rsquo;ascensore accelerato è indistinguibile da un ascensore fermo nel campo $g$, allora la luce si incurva <i>anche</i> in un campo gravitazionale statico, dove nessuno sta accelerando rispetto alle stelle fisse. È il passaggio concettuale più delicato di questa tappa, e anche il più importante: dice che la gravità deforma anche la geometria dello spazio, non solo lo scorrere del tempo.</p>`},
  {t:'prosa', title:'Il raggio di curvatura, e un numero che mette le cose in scala', tag:'R = c²/g', html:R`
  <p>Approssimando l&rsquo;arco con un arco di cerchio di raggio $R$ (lecito perché la deflessione è piccola), la geometria dà $R\simeq c^{2}/g$ — il conto di Marconi, che segue scrivendo la corda $l\simeq ct$ e la freccia $\Delta l=\tfrac12gt^2$ di un arco circolare, e risolvendo per $R$. Per il campo della Terra, $g=9{,}8\ \mathrm{m/s^2}$,
  $$R=\frac{c^{2}}{g}=\frac{(2{,}998\cdot10^{8})^{2}}{9{,}8}=9{,}171\cdot10^{15}\ \mathrm{m}.$$
  Il numero da solo dice poco; confrontato con il <span class="str" data-str="parsec-e-parallasse">parsec</span> del dizionario di as-01 dice molto di più:
  $$\frac{R}{1\ \mathrm{pc}}=\frac{9{,}171\cdot10^{15}}{3{,}086\cdot10^{16}}=0{,}297.$$
  <b>Il raggio di curvatura della luce nel campo gravitazionale terrestre è circa un terzo di parsec</b> — più grande di qualunque laboratorio, di qualunque edificio, persino dell&rsquo;intero pianeta Terra per molti ordini di grandezza. È il motivo per cui nessuno vede la luce curvarsi camminando per strada: la curvatura esiste, ma il raggio di curvatura è così enorme rispetto a qualunque scala umana che il percorso della luce appare rettilineo a tutti gli effetti pratici. Serve un campo molto più intenso — quello al bordo del disco solare, dove la deflessione della luce stellare fu misurata da Eddington nel 1919 — per renderla osservabile.</p>`},
  {t:'prosa', title:'Il filo verso le equazioni di campo', tag:'cosa manca ancora', html:R`
  <p>Questa tappa e la precedente hanno mostrato <i>che cosa</i> cambia nella metrica (il tempo si dilata, lo spazio si incurva) usando solo il principio di equivalenza e un ascensore. Non hanno mostrato <i>quanto</i> cambia in generale, per un campo qualsiasi, né da dove venga la forma precisa della relazione fra metrica e materia: quello richiede il terzo principio di Einstein, quello di Mach, e la macchina tensoriale che lo traduce in equazioni — il contenuto della prossima tappa.</p>`}
]},

/* ---------------- 06 · LE EQUAZIONI DI EINSTEIN ---------------- */
{ num:'06', title:'Le equazioni di Einstein: dalla metrica al tensore energia-impulso', meta:'il tensore di curvatura, passo per passo · le equazioni di campo, scritte per intero · il limite newtoniano, l’equazione di Poisson recuperata',
  blocchi:[
  {t:'prosa', title:'Il programma, in quattro passi', tag:'cosa serve costruire', html:R`
  <p>Il terzo principio di Einstein — quello di Mach — richiede di legare la geometria dello spazio-tempo alla distribuzione di materia ed energia. Marconi fissa il programma in quattro passi, e vale la pena tenerli distinti perché ciascuno risponde a una domanda diversa: <b>(1)</b> scegliere una forma del tensore metrico $g_{\mu\nu}$ compatibile con le simmetrie del problema; <b>(2)</b> scrivere il tensore energia-impulso $T_{\mu\nu}$ che descrive la materia presente; <b>(3)</b> scrivere le equazioni di campo, che diventano equazioni differenziali per le funzioni incognite dentro $g_{\mu\nu}$; <b>(4)</b> risolverle. Questo movimento costruisce il passo (3) — le equazioni stesse — e usa il passo (2) solo nella forma più semplice, quella di un fluido a riposo; i passi (1) e (4) per una metrica cosmologica sono il lavoro di un altro movimento.</p>`},
  {t:'prosa', title:'Dalla metrica al tensore di curvatura: un oggetto costruito, non postulato', tag:'Riemann, Ricci, Einstein', html:R`
  <p>A partire dal tensore metrico $g_{\mu\nu}$ e dalle sue derivate prime e seconde, si costruisce un unico oggetto — il <b>tensore di curvatura di Riemann</b>,
  $$R^{\lambda}{}_{\mu\nu\sigma}=\partial_\nu\Gamma^\lambda_{\mu\sigma}-\partial_\sigma\Gamma^\lambda_{\mu\nu}+\Gamma^\eta_{\mu\sigma}\Gamma^\lambda_{\eta\nu}-\Gamma^\eta_{\mu\nu}\Gamma^\lambda_{\eta\sigma},$$
  dove $\Gamma^\lambda_{\mu\nu}$ (i simboli di Christoffel, costruiti a loro volta da $g_{\mu\nu}$ e dalle sue derivate prime) misurano quanto la base di coordinate locali ruota da un punto all&rsquo;altro. Per contrazione si ottiene il <b>tensore di Ricci</b> $R_{\mu\nu}=R^\lambda{}_{\mu\lambda\nu}$ e la <b>curvatura scalare</b> $R=g^{\mu\nu}R_{\mu\nu}$, e da questi il <b>tensore di Einstein</b>
  $$G_{\mu\nu}=R_{\mu\nu}-\frac{1}{2}g_{\mu\nu}R.$$
  Non è un oggetto arbitrario: è, a meno di una costante moltiplicativa, l&rsquo;unica combinazione di $g_{\mu\nu}$ e delle sue derivate fino al secondo ordine che sia automaticamente a divergenza nulla — proprietà necessaria perché l&rsquo;altro membro dell&rsquo;equazione, $T_{\mu\nu}$, è a divergenza nulla per la conservazione dell&rsquo;energia e della quantità di moto.</p>`},
  {t:'prosa', title:'Il tensore energia-impulso di un fluido comovente', tag:'cosa c’è dall’altra parte', html:R`
  <p>Marconi scrive il tensore energia-impulso di un fluido con densità $\rho$ e pressione $p$ (grandezze comoventi) come
  $$T^{\mu\nu}=(\rho c^{2}+p)\,u^\mu u^\nu-p\,g^{\mu\nu},$$
  con $u^\mu$ la quadrivelocità. Per un fluido <b>a riposo</b> rispetto all&rsquo;espansione (il caso più semplice, e quello che serve qui), $u^\mu=(1,0,0,0)$, e la componente puramente temporale si riduce a $T^{00}=\rho c^{2}$ — <b>la densità di energia</b>, che è esattamente ciò che compare al secondo membro dell&rsquo;equazione di Poisson newtoniana, come si vedrà in due righe.</p>`},
  {t:'prosa', title:'Le equazioni di campo, per intero', tag:'il cuore della relatività generale', html:R`
  <p>Mettendo insieme i due membri, le equazioni di campo di Einstein sono
  $$G_{\mu\nu}=\frac{8\pi G}{c^{2}}T_{\mu\nu},\qquad\text{ovvero}\qquad R_{\mu\nu}-\frac12 g_{\mu\nu}R=\frac{8\pi G}{c^{2}}T_{\mu\nu}.$$
  Dopo averle scritte, Einstein si rese conto che era possibile aggiungere un termine proporzionale alla metrica stessa senza violare la divergenza nulla richiesta — la <b>costante cosmologica</b> $\Lambda$ — ottenendo la forma più generale $G_{\mu\nu}=\dfrac{8\pi G}{c^{2}}T_{\mu\nu}+\Lambda g_{\mu\nu}$, pensata in origine per permettere un universo statico. Da sedici componenti dell&rsquo;equazione tensoriale, la simmetria di $g_{\mu\nu}$ (e quindi di tutto ciò che ne deriva) ne rende indipendenti solo dieci, e le identità di Bianchi (la divergenza nulla di $G_{\mu\nu}$) ne tolgono altre quattro: restano <b>sei equazioni differenziali indipendenti</b> per determinare, in linea di principio, la geometria dello spazio-tempo generata da una data distribuzione di materia.</p>`},
  {t:'prosa', title:'Il limite newtoniano: Poisson deve tornare, ed è un controllo che si può fare', tag:'il recupero, non un atto di fede', html:R`
  <p>Un&rsquo;equazione di campo così generale deve, nel limite di campi debole e velocità piccole, ridursi a qualcosa di già conosciuto: l&rsquo;equazione di Poisson della gravitazione newtoniana, $\nabla^{2}\varphi=4\pi G\rho$. È un controllo che si può fare per intero con ciò che questo movimento ha già derivato. Dalla tappa 04, il coefficiente temporale della metrica in campo debole è $g_{00}=1+2\varphi/c^{2}$, da cui $\nabla^{2}g_{00}=(2/c^2)\nabla^2\varphi$. La componente $00$ delle equazioni di campo, nel limite statico e per un fluido a riposo ($T^{00}=\rho c^2$), si riduce a
  $$\nabla^{2}g_{00}=\frac{8\pi G}{c^{4}}T^{00}=\frac{8\pi G}{c^{4}}\rho c^{2}=\frac{8\pi G\rho}{c^{2}}.$$
  Sostituendo $\nabla^2 g_{00}=(2/c^2)\nabla^2\varphi$ a sinistra e risolvendo per $\nabla^2\varphi$:
  $$\frac{2}{c^{2}}\nabla^{2}\varphi=\frac{8\pi G\rho}{c^{2}}\ \Longrightarrow\ \nabla^{2}\varphi=\frac{8\pi G}{c^{4}}\cdot\rho c^{2}\cdot\frac{c^{2}}{2}=4\pi G\rho.$$
  <b>L&rsquo;equazione di Poisson torna esattamente</b>, con il coefficiente $8\pi G/c^2$ delle equazioni di campo fissato proprio per farla tornare — non è un numero scelto a caso, è l&rsquo;unico che riproduce la gravitazione newtoniana nel limite in cui la si conosce già. È lo stesso tipo di controllo, applicato a un&rsquo;equazione intera invece che a un numero isolato, di quelli già fatti nelle tappe 04 e 05: una teoria nuova si accetta quando riproduce quella vecchia nel regime dove quella vecchia funzionava.</p>`}
]},

/* ---------------- 07 · IL MESTIERE: IL RAGGIO DI SCHWARZSCHILD IN DUE MODI ---------------- */
{ num:'07', title:'Il mestiere: il raggio di Schwarzschild, in due modi che arrivano allo stesso numero', meta:'l’argomento sbagliato che arriva giusto · la singolarità del coefficiente, quella vera · tre stime, dal Sole alla Terra',
  blocchi:[
  {t:'prosa', title:'Il modo sbagliato, e perché conviene conoscerlo comunque', tag:'l’argomento newtoniano', html:R`
  <p>Un argomento puramente newtoniano: la velocità di fuga da una sfera di massa $M$ e raggio $r$ è $v_{fuga}=\sqrt{2GM/r}$, ottenuta uguagliando l&rsquo;energia cinetica all&rsquo;energia potenziale gravitazionale, $\tfrac12 v^2=GM/r$. Chiedendosi per quale raggio questa velocità di fuga eguagli $c$,
  $$c=\sqrt{\frac{2GM}{r_s}}\ \Longrightarrow\ r_s=\frac{2GM}{c^{2}}.$$
  <b>L&rsquo;argomento è concettualmente malfondato</b>: la meccanica newtoniana non ha un limite di velocità, e un fotone non è un proiettile che «quasi» riesce a scappare per poi fermarsi e ricadere — un fotone viaggia sempre a $c$, in qualunque punto, oppure non esiste come fotone. Eppure il numero che ne esce, $r_s=2GM/c^2$, è <b>esattamente</b> quello corretto secondo la relatività generale. Vale la pena saperlo dire proprio per questa ragione: è un esempio da manuale di argomento sbagliato che arriva al risultato giusto, e saperlo distinguere da una dimostrazione vera è parte del mestiere.</p>`},
  {t:'prosa', title:'Il modo giusto: la singolarità del coefficiente metrico', tag:'dove il risultato nasce davvero', html:R`
  <p>La ragione vera sta nel coefficiente $g_{00}$ della metrica in campo debole, derivato nella tappa 04 dal redshift gravitazionale: $g_{00}=1-2GM/(rc^2)$. <b>Questo coefficiente si annulla esattamente allo stesso raggio</b>,
  $$g_{00}(r_s)=1-\frac{2GM}{r_s c^{2}}=1-\frac{2GM}{(2GM/c^2)\,c^{2}}=1-1=0,$$
  e un coefficiente della metrica che si annulla segnala che qualcosa smette di avere il significato ordinario: il tempo proprio di un orologio fermo a quel raggio, misurato rispetto a un osservatore all&rsquo;infinito, richiederebbe di dividere per zero. La derivazione in campo debole di questo movimento non prova che $r_s$ sia davvero un orizzonte degli eventi — quello richiede la soluzione esatta di Schwarzschild, lavoro che questo movimento non fa — ma mostra <i>da dove nasce il numero</i>, e mostra che non è una coincidenza numerica fra due argomenti scollegati: lo stesso $g_{00}$ che ha dato il redshift gravitazionale dà anche il raggio critico.</p>`},
  {t:'plot', title:'Il coefficiente $g_{00}$, e il punto dove si annulla',
   intro:'Sull’asse orizzontale $x=r/r_s$, su quello verticale $g_{00}=1-1/x$. Il coefficiente si annulla esattamente a $x=1$ (il raggio di Schwarzschild) e tende a 1 per $x$ grande, cioè lontano dalla massa — il campo debole di tutte le tappe precedenti.',
   plots:[
    {kind:'func2d', f:'1-1/x', xr:[0.3,6], yr:[-2.2,1.3], height:340, equal:false,
     title:'x = r / r_s      y = g_00',
     marks:[{x:1, y:0, label:'r = r_s, g_00 = 0', col:'#ff9b6b', up:true},
            {x:5.5, y:1-1/5.5, label:'campo debole, g_00 -> 1', col:'#5eead4', up:true}],
     segs:[{x1:1, y1:-2.2, x2:1, y2:0, col:'#4d5a6b', dash:true, width:1.3}]}
   ],
   leggi:R`<p><b>Che cosa guardare: la curva attraversa lo zero esattamente a $x=1$, e non prima né dopo.</b> Per $x\lt1$ (cioè $r\lt r_s$) il coefficiente diventa negativo: in questa approssimazione di campo debole la formula non ha più il significato con cui è stata derivata — la derivazione della tappa 04 presuppone $GM/(rc^2)\ll1$, violato proprio dove la curva scende sotto zero — ma il punto in cui l&rsquo;approssimazione collassa è segnalato esattamente dallo stesso raggio che l&rsquo;argomento newtoniano aveva trovato.</p>
   <p><b>Che cosa impararne: ogni stella, pianeta o persona reale sta schiacciata contro l&rsquo;asse $y=1$, infinitamente a destra su questo grafico.</b> Per il Sole, $r/r_s$ alla superficie è circa $2{,}4\cdot10^{5}$: fuori scala rispetto a questo disegno per cinque ordini di grandezza. La parte della curva che si vede qui — quella vicina a $x=1$ — non corrisponde a nessun oggetto osservato in questo corso: è il regime delle stelle di neutroni e dei buchi neri, dove il campo debole smette del tutto di valere.</p>`},
  {t:'prosa', title:'Tre stime, fatte per intero', tag:'il mestiere', html:R`
  <p><b>Il Sole.</b> Con $M_\odot=1{,}989\cdot10^{30}$ kg (il valore del dizionario di as-01),
  $$r_s^\odot=\frac{2GM_\odot}{c^{2}}=\frac{2\cdot6{,}674\cdot10^{-11}\cdot1{,}989\cdot10^{30}}{(2{,}998\cdot10^{8})^{2}}=2{,}954\cdot10^{3}\ \mathrm{m}.$$
  <b>Tre chilometri</b>, contro un raggio reale $R_\odot=6{,}957\cdot10^{8}$ m: il Sole, per diventare un buco nero, dovrebbe comprimersi di un fattore
  $$\frac{R_\odot}{r_s^\odot}=\frac{6{,}957\cdot10^{8}}{2{,}954\cdot10^{3}}\simeq2{,}4\cdot10^{5}.$$
  Equivalentemente, la deviazione del coefficiente $g_{00}$ dall&rsquo;unità alla superficie del Sole è
  $$1-g_{00}(R_\odot)=\frac{r_s^\odot}{R_\odot}=\frac{2{,}954\cdot10^{3}}{6{,}957\cdot10^{8}}=4{,}246\cdot10^{-6}$$
  — lo stesso numero, letto come «quanto il Sole è lontano dal proprio orizzonte» oppure come «quanto la metrica alla superficie del Sole si allontana da quella piatta»: sono la stessa domanda.</p>
  <p><b>La Terra.</b> Con $M_\oplus=5{,}97\cdot10^{24}$ kg,
  $$r_s^\oplus=\frac{2GM_\oplus}{c^{2}}=2\cdot6{,}674\cdot10^{-11}\cdot5{,}97\cdot10^{24}/(2{,}998\cdot10^{8})^{2}\cdot10^{3}=8{,}866\ \mathrm{mm}.$$
  <b>Meno di un centimetro</b>: comprimere l&rsquo;intera massa della Terra dentro una sfera di quel raggio la trasformerebbe in un buco nero. Il raggio di <span class="str" data-str="raggio-di-schwarzschild">Schwarzschild</span> non richiede un oggetto esotico per esistere come numero — ogni massa ne ha uno, è solo che per gli oggetti ordinari sta a un fattore enorme sotto la loro dimensione reale.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`L’argomento newtoniano della velocità di fuga dà il raggio giusto. In che senso è comunque «sbagliato»?`,
    a:R`È sbagliato perché il ragionamento che lo produce — un proiettile lanciato con velocità $v$ che «quasi» non riesce a scappare, decelera, e ricade — non si applica a un fotone: la meccanica newtoniana non ha un limite di velocità, e un fotone viaggia sempre esattamente a $c$, non «quasi a $c$» per poi fermarsi. Il numero $r_s=2GM/c^2$ è corretto, ma la ragione vera è che il coefficiente $g_{00}$ della metrica — una quantità che l&rsquo;argomento newtoniano non conosce — si annulla a quello stesso raggio. Sono due derivazioni indipendenti che convergono sullo stesso numero: una è un&rsquo;analogia fortunata, l&rsquo;altra è la fisica.`},
   {q:R`Perché il raggio di Schwarzschild del Sole e quello della Terra sono entrambi così piccoli rispetto al raggio reale dell’oggetto?`,
    a:R`Perché $r_s/R=2GM/(Rc^2)$ è proprio la quantità che misura quanto un campo gravitazionale è «debole» nel senso di questo movimento — ed è la stessa quantità che è apparsa nella tappa 04 come $z_g$ (il redshift gravitazionale) per un oggetto di quella massa e quel raggio. Il Sole ha $z_g\sim4\cdot10^{-6}$ e la Terra ancora meno: tutti gli oggetti con cui si ha esperienza diretta vivono in un regime di campo debolissimo, ed è per questo che la relatività generale, pur essendo necessaria in linea di principio ovunque, correggeva la gravitazione newtoniana di frazioni minuscole per ogni oggetto del sistema solare prima delle stelle di neutroni e dei buchi neri.`}
  ]}
]},

/* ---------------- 08 · L'ESERCIZIO: SIRIO B ---------------- */
{ num:'08', title:'L’esercizio: il redshift gravitazionale di Sirio B, con i numeri di oggi', meta:'dichiarato: non di lezione, da un compito scritto · una nana bianca, non un’astrazione · perché la misura del 1925 e quella di oggi non coincidono',
  blocchi:[
  {t:'prosa', title:'Da dove viene questo esercizio, dichiarato per quello che è', tag:'non un esercizio di lezione', html:R`
  <p>Il dossier degli esercizi fatti a lezione (lezioni 2 e 3 in tutte le edizioni disponibili) non attribuisce a questo movimento nessun esercizio svolto in aula: una verifica a mano, oltre a quella automatica dichiarata nel campo <code>esercizi-lezione</code> della mappa, non ha trovato un problema su redshift gravitazionale o raggio di Schwarzschild dentro le diapositive delle lezioni 2 e 3. <b>Questo esercizio viene quindi da un compito scritto</b> — il compito 3 del 9 gennaio 2006, esercizio 3 — e va dichiarato come tale: non è ciò che de Bernardis ha svolto in classe, è ciò che il corso ha chiesto di saper fare per scritto, prima che l&rsquo;esame diventasse solo orale. Il contenuto è identico a quello richiesto adesso — la stessa formula, lo stesso tipo di dato — ed è per questo che vale la pena svolgerlo per intero: è esattamente il tipo di conto su cui cade la seconda domanda dell&rsquo;orale.</p>`},
  {t:'prosa', title:'Il problema, e il dato che conta', tag:'Sirio B, una nana bianca compatta', html:R`
  <p>Lo spettro di Sirio B — la nana bianca compagna di Sirio, osservato con lo spettrometro del telescopio spaziale Hubble — mostra le righe di Balmer dell&rsquo;idrogeno. Dati il compito: massa $M=0{,}98\,M_\odot=1{,}95\cdot10^{30}$ kg, raggio $R=6000$ km $=6{,}0\cdot10^{6}$ m. Si chiede il redshift gravitazionale delle righe spettrali emesse dalla superficie della stella.</p>`},
  {t:'prosa', title:'Lo svolgimento, con la formula della tappa 04', tag:'il conto, per intero', html:R`
  <p>Applicando $z_g=GM/(Rc^2)$ direttamente, senza bisogno di altro:
  $$z_g=\frac{GM}{Rc^{2}}=\frac{6{,}674\cdot10^{-11}\cdot1{,}95\cdot10^{30}}{6{,}0\cdot10^{6}\cdot(2{,}998\cdot10^{8})^{2}}=2{,}413\cdot10^{-4}.$$
  Tradotto in una velocità equivalente, come si fa in spettroscopia per confrontare redshift di origine diversa,
  $$c\,z_g=2{,}998\cdot10^{8}\cdot2{,}413\cdot10^{-4}=72{,}35\ \mathrm{km/s}.$$
  <b>Settantadue chilometri al secondo</b>, non venti. La differenza rispetto alla previsione di Eddington del 1924 ($c\,z_g\simeq20$ km/s, confermata da Adams a $19$ km/s) non è un errore di uno dei due conti: è la differenza fra le stime di massa e raggio disponibili nel 1924 e quelle moderne. Le nane bianche degli anni venti erano stimate più grandi e meno dense di quanto sono in realtà; con il raggio moderno, quattro volte più piccolo di quello usato da Eddington, lo stesso $GM$ diviso per un $R$ più piccolo dà un redshift più grande. <b>Non è la fisica che è cambiata: è quanto si sa su Sirio B.</b></p>`},
  {t:'prosa', title:'Un controllo di consistenza: la formula usata era lecita?', tag:'verificare l’approssimazione, non solo applicarla', html:R`
  <p>La formula $z_g=GM/(Rc^2)$ viene da una derivazione in campo debole (tappa 04), lecita quando $r_s/R\ll1$. Per Sirio B,
  $$\frac{r_s}{R}=\frac{2GM/c^2}{R}=\frac{2\cdot6{,}674\cdot10^{-11}\cdot1{,}95\cdot10^{30}/(2{,}998\cdot10^{8})^2}{6{,}0\cdot10^{6}}=4{,}827\cdot10^{-4}.$$
  <b>Meno di mezzo millesimo</b>: anche una nana bianca, con la sua densità straordinaria per un oggetto ordinario, resta un campo debolissimo nel senso di questo movimento — tre ordini di grandezza più debole del limite in cui l&rsquo;approssimazione comincerebbe a dare problemi seri. È il controllo che rende lecito l&rsquo;uso diretto della formula lineare invece della metrica di Schwarzschild esatta: un conto che molti libri di testo saltano, e che vale la pena fare sempre quando si applica una formula di campo debole a un oggetto compatto.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Perché il redshift gravitazionale misurato oggi su Sirio B (72 km/s equivalenti) è più grande di quello previsto da Eddington nel 1924 (20 km/s)?`,
    a:R`Perché $z_g=GM/(Rc^2)$ dipende dal rapporto fra massa e raggio, e le stime del raggio di Sirio B sono cambiate: nel 1924 si pensava la nana bianca più grande di quanto sia in realtà. Con il raggio moderno, più piccolo, lo stesso $GM$ diviso per un $R$ minore dà un redshift maggiore. La fisica (la formula, il principio) è identica nei due casi: è cambiata la conoscenza dell&rsquo;oggetto, non la teoria.`},
   {q:R`Perché vale la pena controllare $r_s/R$ prima di fidarsi di $z_g=GM/(Rc^2)$ per un oggetto compatto come una nana bianca?`,
    a:R`Perché quella formula viene da uno sviluppo in campo debole, valido quando $r_s/R\ll1$. Per Sirio B il rapporto è $4{,}827\cdot10^{-4}$ — piccolo, quindi l&rsquo;approssimazione è ancora ottima — ma per un oggetto più compatto (una stella di neutroni, dove $r_s/R$ può arrivare a qualche decimo) la stessa formula smetterebbe di essere accurata, e andrebbe usata la metrica di Schwarzschild esatta. Il controllo costa una riga e dice se il resto del conto è affidabile.`}
  ]}
]},

/* ---------------- 09 · ALL'ORALE ---------------- */
{ num:'09', title:'All’orale: le due derivazioni, nell’ordine in cui si dicono', meta:'il redshift gravitazionale, mossa per mossa · il raggio di Schwarzschild, le due vie dichiarate insieme · un controllo a mente, non un numero isolato',
  blocchi:[
  {t:'prosa', title:'Perché proprio queste due, e come sono collegate', tag:'quello che dice la mappa', html:R`
  <p>Il campo <code>orale.domanda-teorica</code> di questo movimento chiede entrambe le cose insieme: <i>«il redshift gravitazionale dal principio di equivalenza, e il raggio di Schwarzschild»</i>. Non sono due argomenti slegati messi in fila per comodità: <b>condividono lo stesso coefficiente della metrica</b>, $g_{00}=1-2GM/(rc^2)$, derivato una volta nella tappa 04 e riusato nella tappa 07 per trovare dove si annulla. Chi le racconta di seguito, nell&rsquo;ordine qui sotto, mostra di aver capito che sono la stessa fisica vista a due distanze diverse dalla stessa massa: vicino alla stella basta il coefficiente stesso per avere il redshift, al raggio critico il coefficiente si azzera e smette di avere senso.</p>`},
  {t:'reveal', title:'Le mosse del redshift gravitazionale, nell’ordine in cui si dicono', tag:'il copione, parte 1', steps:[
   {label:'Mossa 1 — enuncia il principio di equivalenza come dispositivo, non come slogan', body:R`<p>«Un campo gravitazionale uniforme $g$ è indistinguibile da un ascensore che accelera con $a=g$ nella direzione opposta. Questo mi permette di risolvere il problema nel riferimento accelerato, dove vale la relatività speciale ordinaria, e tradurre il risultato indietro.»</p>`},
   {label:'Mossa 2 — monta il fotone nell’ascensore, e dichiara l’approssimazione', body:R`<p>«Il fotone parte dal pavimento verso il soffitto, distanza $h$. Al primo ordine, il tempo di volo è $t=h/c$. In quel tempo, l&rsquo;ascensore accelerato raggiunge la velocità $v=g\,h/c$ — piccola rispetto a $c$, e qui userò l&rsquo;effetto Doppler classico, non quello relativistico, perché la correzione relativistica sarebbe un effetto del secondo ordine in $v/c$.»</p>`},
   {label:'Mossa 3 — applica Doppler, e dichiara il segno con un argomento fisico', body:R`<p>«Il soffitto si allontana nella direzione di propagazione del fotone: è un ricevitore che fugge davanti all&rsquo;onda, quindi misura una frequenza più bassa — $\nu'=\nu(1-v/c)=\nu(1-gh/c^2)$. Il fotone che sale perde frequenza: è redshiftato.»</p>`},
   {label:'Mossa 4 — generalizza da campo uniforme a potenziale qualsiasi', body:R`<p>«In campo uniforme, $gh$ è la differenza di potenziale newtoniano fra le due quote. Scrivo allora la forma generale $z_g=\Delta\varphi/c^2$, valida per qualunque campo, non solo quello uniforme.»</p>`},
   {label:'Mossa 5 — applica a una stella, e dichiara dove si sbaglia il segno', body:R`<p>«Per una stella di massa $M$ e raggio $R$, osservata da lontano dove $\varphi=0$: $\Delta\varphi=\varphi(\infty)-\varphi(R)=0-(-GM/R)=+GM/R$. Il segno è positivo perché ci si allontana dalla buca di potenziale, non ci si entra — ed è l&rsquo;errore più comune da dire ad alta voce sotto pressione. Il risultato è $z_g=GM/(Rc^2)$: sempre redshift, mai blueshift, per la luce che esce da una stella.»</p>`},
   {label:'Mossa 6 — chiudi con un numero vero, non con la sola formula', body:R`<p>«Per Sirio B, massa $0{,}98\,M_\odot$ e raggio $6000$ km: $z_g=2{,}413\cdot10^{-4}$, cioè $c\,z_g\simeq72$ km/s. È più grande della stima storica di Eddington del 1924 perché oggi si conosce un raggio più piccolo per la stella — non perché la fisica sia cambiata.»</p>`}
  ]},
  {t:'reveal', title:'Le mosse del raggio di Schwarzschild, dichiarate in due vie', tag:'il copione, parte 2', steps:[
   {label:'Mossa 1 — dichiara subito che userai due argomenti indipendenti', body:R`<p>«Il raggio di Schwarzschild si ottiene in due modi che danno lo stesso numero per ragioni diverse, e vale la pena dirli entrambi: uno è un argomento newtoniano concettualmente scorretto che arriva al risultato giusto, l&rsquo;altro è quello vero.»</p>`},
   {label:'Mossa 2 — la via sbagliata, dichiarata sbagliata mentre la fai', body:R`<p>«Newtonianamente, la velocità di fuga è $v_{fuga}=\sqrt{2GM/r}$. Chiedo per quale $r$ valga $c$: risolvendo, $r_s=2GM/c^2$. Dico subito perché l&rsquo;argomento è malfondato: un fotone non è un proiettile che quasi scappa e poi ricade, viaggia sempre esattamente a $c$. Il numero è corretto, il ragionamento che lo ha prodotto no.»</p>`},
   {label:'Mossa 3 — la via vera, che riusa il redshift appena derivato', body:R`<p>«La ragione vera sta nel coefficiente $g_{00}=1-2GM/(rc^2)$ che ho già derivato per il redshift gravitazionale. Chiedo per quale $r$ questo coefficiente si annulli: $1-2GM/(rc^2)=0 \Rightarrow r=2GM/c^2$. Stesso numero, questa volta per la ragione giusta — un coefficiente della metrica che si annulla, non una velocità che eguaglia $c$.»</p>`},
   {label:'Mossa 4 — dichiara cosa questa derivazione NON prova', body:R`<p>«Questa è una derivazione in campo debole: non prova che $r_s$ sia un vero orizzonte degli eventi, perché a quel raggio l&rsquo;approssimazione $GM/(rc^2)\ll1$ con cui ho derivato $g_{00}$ è già violata. Prova da dove nasce il numero, e che le due vie — velocità di fuga e singolarità metrica — non sono scollegate: condividono lo stesso $g_{00}$.»</p>`},
   {label:'Mossa 5 — chiudi con un numero concreto, per ancorare l’astrazione', body:R`<p>«Per il Sole, $r_s\simeq3$ km contro un raggio reale di circa $700\,000$ km: un fattore duecentoquarantamila. È la misura di quanto un oggetto ordinario sia lontano dal proprio orizzonte — ed è anche, letta al contrario, la stessa piccolezza del redshift gravitazionale che ho appena calcolato: sono la stessa fisica.»</p>`}
  ]}
]},

/* ---------------- 10 · I NUMERI DI QUESTO MOVIMENTO ---------------- */
{ num:'10', title:'I numeri di questo movimento', meta:'otto voci · le due formule, e i casi che le rendono concrete',
  blocchi:[
  {t:'prosa', title:'All’orale non c’è il foglio dei dati', tag:'otto voci, non una di più', html:R`
  <p>Come per ogni movimento di questo corso, l&rsquo;orale non porta in calce un foglio di costanti: queste otto voci sono quelle di cui vale la pena avere pronto il valore, o almeno la via per ricostruirlo in due righe.</p>
  <ul>
  <li><b>$c=2{,}998\cdot10^{8}$ m/s</b> — la costante invariante su cui tutto il movimento è costruito.</li>
  <li><b>$G=6{,}674\cdot10^{-11}$ N m² kg⁻²</b> — la costante di gravitazione, presente in ogni formula da qui in avanti.</li>
  <li><b>$\gamma=1/\sqrt{1-\beta^2}$; per $\beta=0{,}98$, $\gamma=5{,}025$</b> — il fattore di Lorentz, con il caso numerico dei muoni pronto all&rsquo;uso.</li>
  <li><b>Redshift gravitazionale: $z_g=\Delta\varphi/c^2=GM/(Rc^2)$</b> — sempre positivo per la luce che esce da una stella.</li>
  <li><b>Sirio B: $z_g=2{,}413\cdot10^{-4}$, cioè $c\,z_g\simeq72{,}35$ km/s</b> — il caso numerico pronto per l&rsquo;esercizio.</li>
  <li><b>Raggio di Schwarzschild: $r_s=2GM/c^2$</b> — in due vie, velocità di fuga newtoniana e singolarità del coefficiente metrico.</li>
  <li><b>$r_s^\odot=2{,}954\cdot10^{3}$ m $\simeq3$ km; $r_s^\oplus=8{,}866$ mm</b> — i due casi di riferimento, Sole e Terra.</li>
  <li><b>Equazioni di campo: $G_{\mu\nu}=8\pi G\,T_{\mu\nu}/c^2$</b>, con limite newtoniano $\nabla^2\varphi=4\pi G\rho$ — la forma completa e il controllo che la rende credibile.</li>
  </ul>`}
]},

/* ---------------- 11 · IL SENSO E LE ROTTE ---------------- */
{ num:'11', title:'Il senso, e dove questa metrica torna', meta:'le onde gravitazionali, la stessa equazione all’opera · perché solo di quadrupolo, e non di dipolo · dove va a finire questo spazio-tempo',
  blocchi:[
  {t:'prosa', title:'Le onde gravitazionali: una piccola perturbazione della stessa metrica', tag:'LIGO, e cosa c’è davvero dietro', html:R`
  <p>Le equazioni di campo della tappa 06, linearizzate per una piccola perturbazione $h_{\mu\nu}$ attorno alla metrica di Minkowski, $g_{\mu\nu}=\eta_{\mu\nu}+h_{\mu\nu}$ con $|h_{\mu\nu}|\ll1$, ammettono soluzioni che si propagano come onde — <b>onde gravitazionali</b>, che viaggiano alla velocità della luce trasportando energia, esattamente come previsto da Einstein nel 1916. Il registro delle lezioni riporta la prima prova indiretta della loro esistenza: il sistema binario di pulsar PSR 1913+16, scoperto da Hulse e Taylor nel 1974, il cui periodo orbitale diminuisce nel tempo esattamente della quantità prevista se il sistema sta irradiando energia in onde gravitazionali — un accordo, oggi, a meglio dell&rsquo;un per cento. La prima <b>misura diretta</b> è arrivata solo nel 2015, con gli interferometri LIGO: due buchi neri che si fondono in una galassia lontana, un segnale che ha fruttato il Nobel per la Fisica nel 2017 a Weiss, Thorne e Barish.</p>
  <p><b>Perché solo di quadrupolo, e non di dipolo come la luce.</b> La radiazione elettromagnetica di dipolo esiste perché esistono cariche di segno opposto, e un dipolo elettrico può variare nel tempo. La radiazione gravitazionale di dipolo richiederebbe una variazione nel tempo del momento di dipolo di <i>massa</i>, che è proporzionale alla quantità di moto totale del sistema: la sua conservazione la esclude per qualunque sistema isolato. La gravità ha una sola sorgente di segno (la massa-energia è sempre positiva), e il primo momento multipolare libero di variare — e quindi di irradiare — è il <b>quadrupolo</b>: è la ragione per cui le onde gravitazionali esistono <i>solo di quadrupolo</i>, e non prima.</p>`},
  {t:'prosa', title:'Dove va a finire questo spazio-tempo: il ponte verso la cosmologia', tag:'un’anticipazione dichiarata, non derivata', html:R`
  <p>Questo movimento ha costruito la metrica piatta di Minkowski (tappa 02) e ha mostrato come la massa la incurva localmente (tappe 04-06), fino al caso estremo in cui un coefficiente si annulla (tappa 07). C&rsquo;è una terza forma della stessa idea, che qui si nomina senza derivarla: una metrica <b>omogenea e isotropa su tutto lo spazio</b>, non curvata da un singolo oggetto compatto ma dalla distribuzione media di tutta la materia dell&rsquo;universo. Marconi la introduce con il nome che porta — la <b>metrica di Robertson-Walker</b> — a partire da un&rsquo;osservazione che il principio di equivalenza da solo non può dare: l&rsquo;isotropia della radiazione cosmica di fondo suggerisce che, su scale sufficientemente grandi, l&rsquo;universo sia il medesimo ovunque e in ogni direzione. Le stesse equazioni di campo scritte nella tappa 06, applicate a questa metrica invece che a una massa isolata, produrranno — in un altro momento del corso — le equazioni di Friedmann che descrivono l&rsquo;espansione dell&rsquo;universo intero. È lo stesso $G_{\mu\nu}=8\pi G\,T_{\mu\nu}/c^2$: cambia solo cosa si mette dentro $g_{\mu\nu}$.</p>
  <p>Il filo che lega tutto il movimento, dal paradosso dei muoni al raggio di Schwarzschild, è lo stesso che de Bernardis chiude con l&rsquo;esperimento di Michelson-Morley e che Marconi riapre con l&rsquo;argomento newtoniano della velocità di fuga: <b>un argomento che sembra plausibile e un conto che sembra tornare non bastano</b>. Il muone sembrava violare la fisica finché non si è fatto il conto fino in fondo; la velocità di fuga newtoniana dà il raggio giusto per la ragione sbagliata; la previsione di Eddington su Sirio B era corretta nella forma e superata nei numeri da dati migliori. In tutti e tre i casi la cosa che ha deciso non è stata l&rsquo;intuizione, è stato il conto fatto per intero — e questo, più di ogni singola formula, è ciò che questo movimento consegna al resto del corso.</p>`}
]}

];

function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';

  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }

  return wrap;
}

function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';

  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    /* DUE SCHEMI, NON UNO — scoperto il 2026-10-06 provando le pagine vive. I movimenti
       scritti per primi (em-01..03, me-10b, i collaudi di gd-01..09 e di quattro em)
       usano una forma piu' semplice: `reveal` e `prolessi` con un solo `html`,
       `esercizio` e `collaudo` con `html` + `sol`. Il renderer ne conosceva una sola e
       chiamava `steps.forEach` su `undefined`: TypeError, e la tappa si fermava li' —
       62 blocchi in 17 movimenti su 74. Non si riscrive il contenuto per far contento
       il renderer: e' il renderer che deve leggere cio' che c'e'.
       E in fondo un ramo che NON muore: uno schema nuovo di domani deve far vedere un
       avviso in quella sezione, non spegnere la pagina sotto di se'. */
    try{
      if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
      else if(b.t==='prolessi') m.appendChild(b.rotte ? sectionProlessi(b)
                                   : sectionProsa(b.title,'prolessi',b.html));
      else if(b.t==='reveal')m.appendChild(b.steps ? sectionReveal(b.title,b.tag,b.steps)
                                   : sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='esercizio') m.appendChild(b.steps ? sectionEsercizio(b)
                                   : sectionSvelabile(b.title,'esercizio',b.html,b.sol));
      else if(b.t==='collaudo')  m.appendChild(b.items ? sectionCollaudo(b.title,b.items)
                                   : sectionSvelabile(b.title,'provi, poi riveli',b.html,b.sol));
      else if(b.t==='plot')      m.appendChild(sectionPlot(b));
      else m.appendChild(sectionProsa(b.title||'(blocco)', 'tipo sconosciuto: '+b.t,
                                      b.html||''));
    }catch(err){
      var avv=document.createElement('section'); avv.className='section';
      avv.innerHTML='<h3>'+(b.title||'(blocco)')+'<span class="tag">non reso</span></h3>'
        +'<p style="color:#ff6b6b">Questo blocco non si &egrave; potuto rendere ('
        +b.t+': '+err.message+'). Il resto della tappa continua sotto.</p>';
      m.appendChild(avv);
    }
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* I POP-UP DEGLI STRUMENTI. `cablaStrumenti` esisteva dal 18-09 e non la chiamava
     nessuno: i 229 rimandi del percorso erano <span> senza handler, e il clic non
     faceva niente. Nessun controllo poteva vederlo — la sintassi era valida, le schede
     c'erano tutte, le formule rendevano: il guasto esisteva solo a pagina viva. Qui, e
     dopo ogni inserimento successivo, perche' la tappa si rimonta da capo a ogni
     cambio e gli handler vanno riattaccati al DOM nuovo. */
  cablaStrumenti(m);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}

/* deep-link: as-02-lo-spaziotempo-e-la-gravita.html#03 apre direttamente la tappa 03 */
window.addEventListener('DOMContentLoaded', function(){
  var h=(location.hash||'').replace('#','');
  showTappa(byId[h]?h:'00');
});
window.addEventListener('hashchange', function(){
  var h=(location.hash||'').replace('#','');
  if(byId[h]) showTappa(h);
});
