"use strict";

/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un
   rimando scritto nella prosa:

       <span class="str" data-str="serie-geometrica">la serie geometrica</span>

   Le schede citate da questo nucleo sono cucite qui sotto dal montaggio
   (assembla-nucleo.js): la pagina resta autosufficiente — niente fetch,
   niente sottocartelle da pubblicare — e un rimando a una scheda che non
   esiste FERMA la costruzione invece di arrivare in pagina rotto.
   Apertura: lo stesso gesto del collaudo (si clicca, il pannello compare,
   si typeset una volta sola), portato dentro la frase.
   =================================================================== */
var CORSO = 'geometria-differenziale';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["campo-vettoriale"] = {"nome":"Campo vettoriale","riga":"Una funzione che a ogni punto dello spazio associa un vettore, scritta $\\mathbf{F}(x,y,z)=F_x\\,\\hat{\\imath}+F_y\\,\\hat{\\jmath}+F_z\\,\\hat{k}$ con le tre componenti funzioni del punto.","serve":"È il modo di dire «c'è qualcosa in ogni punto dello spazio, e ha una direzione». Serve perché permette di smettere di ragionare su coppie di oggetti che si attraggono a distanza e di ragionare su una proprietà dello spazio: la sorgente prepara il campo, e chi arriva dopo sente solo ciò che trova dove si trova.","esempio":"Il campo di una carica puntiforme $q$ nell'origine è $\\mathbf{E}=\\dfrac{q}{4\\pi\\varepsilon_0 r^{2}}\\hat{r}$: la direzione è radiale, il modulo dipende solo dalla distanza. Con $q=1$ e $4\\pi\\varepsilon_0=1$, nel punto $(3,4,0)$ si ha $r=5$, quindi il modulo vale $\\tfrac{1}{25}$ e il versore è $\\left(\\tfrac35,\\tfrac45,0\\right)$: la componente lungo $x$ è $\\tfrac{3}{125}$.","pieno":{"file":"04-campi-vettoriali.html","tappa":"00","come":"la trattazione completa, nel nucleo sui campi vettoriali di Analisi Vettoriale"},"qui":{"elettromagnetismo":{"serve":"È l'oggetto che l'intero corso studia: $\\mathbf{E}$ e $\\mathbf{B}$ sono campi vettoriali, e le quattro equazioni di Maxwell sono affermazioni su come le loro derivate spaziali si legano alle sorgenti. Tutto ciò che si impara dopo — flusso, circuitazione, divergenza, rotore — è un modo di interrogare un campo vettoriale.","esempio":"Per la carica puntiforme in $(3,4,0)$ con $q=1$ e $4\\pi\\varepsilon_0=1$: $r=5$, modulo $\\tfrac{1}{25}$, e la componente lungo $x$ vale $\\tfrac{3}{125}$. Le tre componenti non sono tre campi separati: ruotando gli assi si mescolano fra loro, ed è quello che rende $\\mathbf{E}$ un vettore e non una terna di numeri."}},"controllo":[{"tipo":"uguale","sinistra":"sqrt(3**2+4**2)","vale":"5","dove":"esempio","appare":"r=5"},{"tipo":"uguale","sinistra":"1/sqrt(3**2+4**2)**2","vale":"1/25","dove":"esempio","appare":"\\tfrac{1}{25}"},{"tipo":"uguale","sinistra":"(1/5**2)*(3/5)","vale":"3/125","dove":"esempio","appare":"\\tfrac{3}{125}"},{"tipo":"uguale","sinistra":"sqrt(3**2+4**2)","vale":"5","dove":"qui.elettromagnetismo.esempio","appare":"r=5"},{"tipo":"uguale","sinistra":"(1/5**2)*(3/5)","vale":"3/125","dove":"qui.elettromagnetismo.esempio","appare":"\\tfrac{3}{125}"}]};
STRUM["teorema-di-schwarz"] = {"nome":"Teorema di Schwarz","riga":"Se le derivate seconde miste di $f$ esistono e sono continue, allora non dipendono dall'ordine: $\\partial_x\\partial_y f=\\partial_y\\partial_x f$.","serve":"È l'ipotesi silenziosa di metà dei conti: ogni volta che si scambia l'ordine di due derivate — nel rotore di un gradiente, nelle relazioni di Maxwell della termodinamica, nella cancellazione dei termini secondi in una parentesi di Lie — si sta usando Schwarz senza nominarlo. Vale la pena sapere che è un teorema e non una regola di calcolo, perché **è falso senza la continuità**: esistono funzioni con entrambe le derivate miste definite ovunque e diverse in un punto. In pratica tutto ciò che si incontra è $C^{\\infty}$ e il teorema si applica sempre; il caso in cui conta davvero è quello inverso, quando l'asimmetria di un'espressione rispetto allo scambio di due derivate è il segnale che l'oggetto non è un gradiente e che lì c'è della geometria.","esempio":"Con $f(x,y)=x^{2}y^{3}$ si deriva prima in $y$, ottenendo $3x^{2}y^{2}$, e poi in $x$, ottenendo $6xy^{2}$. Nell'ordine opposto si deriva prima in $x$, ottenendo $2xy^{3}$, e poi in $y$: di nuovo $6xy^{2}$. I due cammini passano per espressioni diverse e arrivano allo stesso posto, ed è questo il contenuto del teorema — non che i passaggi intermedi si somiglino, ma che l'arrivo coincida. Il controesempio classico, che mostra dove sta il confine, è $g(x,y)=xy\\frac{x^{2}-y^{2}}{x^{2}+y^{2}}$ prolungata con $g(0,0)=0$: le due derivate miste nell'origine valgono $-1$ e $+1$, perché le derivate seconde esistono ma non sono continue lì.","debito":"la dimostrazione (via teorema del valor medio applicato due volte al rapporto incrementale doppio) sta in ogni corso di Analisi 2 e non è riportata; qui c'è l'enunciato e il confine.","controllo":[{"tipo":"derivata","espr":"x**2*y**3","rispetto":["y"],"vale":"3*x**2*y**2","ipotesi":{"x":"real","y":"real"},"dove":"esempio","appare":"3x^{2}y^{2}"},{"tipo":"derivata","espr":"x**2*y**3","rispetto":["y","x"],"vale":"6*x*y**2","ipotesi":{"x":"real","y":"real"},"dove":"esempio","appare":"6xy^{2}"},{"tipo":"derivata","espr":"x**2*y**3","rispetto":["x"],"vale":"2*x*y**3","ipotesi":{"x":"real","y":"real"},"dove":"esempio","appare":"2xy^{3}"}]};
STRUM["derivazione"] = {"nome":"Derivazione (regola di Leibniz)","riga":"Un operatore lineare $D$ su un'algebra che rispetta la regola del prodotto: $D(fg)=f\\,D(g)+g\\,D(f)$. È la proprietà che isola «derivare» fra tutti gli operatori lineari possibili.","serve":"È il modo algebrico di definire la derivata senza limiti, e serve ogni volta che si vuole derivare su un oggetto dove non c'è un rapporto incrementale da fare — su una varietà astratta, su un'algebra di matrici, su un anello di polinomi. La conseguenza operativa più usata è che **una derivazione è determinata dai suoi valori sui generatori**: su $\\mathbb{R}^{n}$ basta sapere quanto vale sulle coordinate $x^{1},\\dots,x^{n}$, e da lì Leibniz e la linearità danno tutto il resto. È il motivo per cui un vettore tangente, definito come derivazione, si scrive sempre come combinazione delle $\\partial/\\partial x^{i}$: non perché lo si sia scelto, ma perché non c'è altro. Un secondo fatto, che si dimostra in due righe e si usa continuamente: la **composizione** di due derivazioni non è una derivazione (compaiono derivate seconde), ma la loro **differenza incrociata** $DE-ED$ lo è, perché i termini secondi si cancellano a coppie.","esempio":"Su $\\mathbb{R}$, l'operatore $d/dx$ verificato sul prodotto $f=x^{2}$ e $g=x^{3}$: la regola dice $x^{2}\\cdot3x^{2}+x^{3}\\cdot2x$, cioè $5x^{4}$, e la derivata diretta di $x^{5}$ dà lo stesso $5x^{4}$. Il conto è banale ed è il punto: Leibniz non aggiunge informazione su $\\mathbb{R}$, dove la derivata si sa già fare. Aggiunge informazione quando è l'unica cosa che si ha — per esempio sull'algebra delle matrici, dove $D(A)=MA-AM$ per una matrice fissata $M$ è una derivazione, e la verifica di Leibniz consiste nello sviluppare $M(AB)-(AB)M$ e riconoscerlo come somma di $A\\,D(B)$ e $D(A)\\,B$, cosa che riesce perché i due termini $AMB$ introdotti dallo sviluppo compaiono con segni opposti e si cancellano.","debito":"che le derivazioni in un punto di una varietà siano esattamente i vettori tangenti è il teorema di gd-06 e non si ripete qui; il caso delle algebre non commutative è citato come esempio e non sviluppato.","controllo":[{"tipo":"uguale","sinistra":"x**2*3*x**2+x**3*2*x","vale":"5*x**4","ipotesi":{"x":"real"},"dove":"esempio","appare":"5x^{4}"},{"tipo":"derivata","espr":"x**5","rispetto":["x"],"vale":"5*x**4","ipotesi":{"x":"real"},"dove":"esempio","appare":"derivata diretta di $x^{5}$"}]};

}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare

/* ---------------- 00 · DI COSA PARLA QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Di cosa parla questo movimento', meta:'Geometria Differenziale · voci G.23, G.24 · il corso cambia direzione',
  blocchi:[
  {t:'prosa', title:'La domanda', tag:'architettura', html:R`
  <p>Un <span class="str" data-str="campo-vettoriale">campo vettoriale</span> è una derivazione (gd-07): agisce sulle funzioni. Due campi $X$ e $Y$ si possono quindi <b>comporre</b>, e la domanda naturale è se l&rsquo;ordine conti.</p>
  <p><b>Conta.</b> «Muoversi lungo $X$ e poi lungo $Y$» non è la stessa cosa che l&rsquo;opposto, e la differenza è il contenuto di questo movimento. La sorpresa è che la differenza — che a priori sarebbe un operatore del <b>secondo</b> ordine — risulta essere ancora un <b>campo vettoriale</b>, cioè del primo ordine: i termini secondi si cancellano.</p>
  <p><b>È il movimento in cui il corso cambia direzione</b>: da qui in avanti si studiano i campi come <i>dinamica</i> — flussi, equazioni differenziali, gruppi di trasformazioni — e la parentesi è l&rsquo;oggetto algebrico che governa tutto.</p>
  <p><b>Perché la domanda non è oziosa.</b> Fino a gd-11 i campi vettoriali sono stati oggetti statici: si assegnano, si sommano, si moltiplicano per funzioni. Tutte operazioni che non richiedono di <i>muoversi</i>. La parentesi è la prima operazione fra campi che usa il fatto che un campo genera un moto, ed è per questo che apre la seconda metà del corso. <b>Il passaggio è da «un vettore in ogni punto» a «una legge di evoluzione»</b>, e la parentesi è ciò che rende algebrico un fenomeno dinamico.</p>
  <p><b>Come è fatto il movimento.</b> Prima la definizione e il conto della cancellazione, che è l&rsquo;unico punto tecnico e va fatto una volta a mano. Poi i due esempi in coordinate che Diverio svolge a lezione, che sono anche quelli che finiscono all&rsquo;esame. Poi il significato geometrico — il quadratino che non si chiude — che è la parte che si ricorda per sempre e che rende evidente perché la parentesi sia un oggetto del secondo ordine. Poi la struttura algebrica e i teoremi di naturalità, che sono ciò che serve per gd-13 e gd-14. Infine gli esercizi, fra cui il calcolo dell&rsquo;algebra delle rotazioni, che è letteralmente il momento angolare della meccanica quantistica scritto come campi vettoriali.</p>`}
]},

/* ---------------- 01 · LA DEFINIZIONE ---------------- */
{ num:'01', title:'La parentesi: il commutatore, e perche resta del primo ordine', meta:'la definizione · il conto in coordinate · la cancellazione dei termini secondi',
  blocchi:[
  {t:'prosa', title:'La definizione e il conto', tag:'costruzione', html:R`
  <p>Si definisce
  $$[X,Y]=XY-YX,$$
  dove il prodotto è la <b>composizione</b> come operatori sulle funzioni: $XY(f)=X(Y(f))$.</p>
  <p><b>Presi separatamente, $XY$ e $YX$ sono del secondo ordine</b>: applicano due derivate. Ma nella differenza i termini con le derivate seconde di $f$ compaiono due volte con segno opposto e <b>si cancellano</b>, perché le derivate parziali commutano (<span class="str" data-str="teorema-di-schwarz">teorema di Schwarz</span>). Resta
  $$[X,Y]^{k}=\sum_i\left(X^{i}\frac{\partial Y^{k}}{\partial x^{i}}-Y^{i}\frac{\partial X^{k}}{\partial x^{i}}\right),$$
  che è del primo ordine: <b>$[X,Y]$ è un campo vettoriale</b>.</p>
  <p><b>La cancellazione non è un caso fortunato</b>: è il fatto che il commutatore di due derivazioni è ancora una derivazione, cioè soddisfa Leibniz. Si verifica in due righe, ed è la ragione strutturale — <b>vale in qualunque algebra</b>, non solo per le funzioni lisce, ed è il motivo per cui le algebre di Lie compaiono ovunque.</p>`},
  {t:'reveal', title:'Il conto della cancellazione, per esteso', tag:'costruzione', steps:[
   {label:'Perche il prodotto XY non e un campo', body:R`
   <p>Conviene vedere prima il fallimento, perché è ciò che rende non ovvio il successo. Scrivendo $X=\sum_i X^{i}\partial_i$ e $Y=\sum_j Y^{j}\partial_j$, la composizione applicata a una funzione dà, per la regola del prodotto,</p>
   <p>$$XY(f)=\sum_{i,j}X^{i}\frac{\partial Y^{j}}{\partial x^{i}}\,\frac{\partial f}{\partial x^{j}}+\sum_{i,j}X^{i}Y^{j}\,\frac{\partial^{2}f}{\partial x^{i}\partial x^{j}}.$$</p>
   <p>Il primo addendo è del primo ordine in $f$; <b>il secondo no</b>, ed è quello che impedisce a $XY$ di essere una <span class="str" data-str="derivazione">derivazione</span>. Si può controllare direttamente sulla regola di Leibniz: $XY(fg)$ contiene un termine $X(f)Y(g)+X(g)Y(f)$ che non compare in $fXY(g)+gXY(f)$, e quel residuo è esattamente il pezzo di secondo ordine. <b>Un operatore del secondo ordine non è un vettore tangente</b>, e quindi $XY$ non è un campo: è solo un operatore differenziale.</p>`},
   {label:'Perche la differenza lo e', body:R`
   <p>Scambiando i ruoli di $X$ e $Y$ e sottraendo, il termine di secondo ordine diventa</p>
   <p>$$\sum_{i,j}\left(X^{i}Y^{j}-Y^{i}X^{j}\right)\frac{\partial^{2}f}{\partial x^{i}\partial x^{j}},$$</p>
   <p>e qui si incastrano due antisimmetrie. Il coefficiente è <b>antisimmetrico</b> nello scambio degli indici $i$ e $j$; la derivata seconda è <b>simmetrica</b> nello stesso scambio, ed è qui che entra Schwarz. <b>La contrazione di un oggetto antisimmetrico con uno simmetrico è nulla</b>: sommando su tutte le coppie, ogni termine si elide con quello di indici scambiati.</p>
   <p><b>Questa è la ragione vera, e vale la pena isolarla</b> perché è un meccanismo che ritorna: in elettromagnetismo è il motivo per cui il rotore di un gradiente è nullo, in relatività è il motivo per cui il tensore di torsione svanisce per una connessione simmetrica. <b>Ogni volta che un antisimmetrico incontra un simmetrico, qualcosa sparisce</b>, e sapere riconoscere quel pattern fa risparmiare interi conti.</p>
   <p>Resta soltanto il primo ordine, cioè l&rsquo;espressione in coordinate scritta sopra, e con essa la conclusione: <b>$[X,Y]$ è un campo vettoriale liscio</b>, definito senza scegliere coordinate — la formula in componenti è un modo di calcolarlo, non la sua definizione.</p>`},
   {label:'Un avvertimento sulle notazioni', body:R`
   <p>La scrittura $XY$ è comoda e ingannevole. <b>Non è un prodotto di vettori</b>: non esiste alcun prodotto fra campi vettoriali che dia un campo vettoriale, e se esistesse la parentesi non sarebbe interessante. È la composizione di due operatori, e il risultato vive in uno spazio più grande — quello degli operatori differenziali di ordine due — da cui la differenza riesce a tornare indietro.</p>
   <p><b>Conseguenza pratica da non sbagliare all&rsquo;esame</b>: la parentesi <i>non</i> è $\mathcal{C}^{\infty}$-bilineare. Moltiplicando $Y$ per una funzione $h$ si ottiene $[X,hY]=h[X,Y]+X(h)\,Y$, con un termine in più che non c&rsquo;è nelle operazioni tensoriali. <b>Questo è il segno che la parentesi non è un tensore</b>: il suo valore in un punto non dipende solo dai valori di $X$ e $Y$ in quel punto, ma da come variano attorno. Chiunque provi a calcolarla puntualmente sbaglia, ed è l&rsquo;errore più comune sull&rsquo;argomento.</p>`}
  ]}
]},

/* ---------------- 02 · I CONTI ---------------- */
{ num:'02', title:'Due conti da avere in mano', meta:'il primo esempio · il caso che genera una rotazione · e come si organizza il calcolo',
  blocchi:[
  {t:'reveal', title:'Gli esempi che Diverio fa in coordinate', tag:'esame', steps:[
   {label:'Il primo, elementare', body:R`
   <p>$X=\dfrac{\partial}{\partial x}$ e $Y=x\dfrac{\partial}{\partial y}$. Allora
   $$[X,Y]=\frac{\partial}{\partial y}.$$
   <b>Il risultato non è nullo</b>, e si legge così: muoversi in $x$ modifica <i>quanto</i> $Y$ spinge in $y$, e quel cambiamento è la parentesi. <b>Il conto va fatto una volta a mano</b>, applicando entrambi i membri a una funzione generica $f$ e vedendo i termini secondi elidersi.</p>
   <p><b>Il conto disteso</b>, che conviene aver visto almeno una volta: $XY(f)$ è la derivata in $x$ di $x\,\partial_y f$, cioè $\partial_y f+x\,\partial_x\partial_y f$ per la regola del prodotto; $YX(f)$ è $x\,\partial_y\partial_x f$. Sottraendo, i due termini secondi sono uguali per Schwarz e se ne vanno, e resta $\partial_y f$. <b>Il termine che sopravvive nasce dal derivare il coefficiente $x$ di $Y$, non la funzione $f$</b>, ed è sempre così: la parentesi misura la variazione dei coefficienti di un campo lungo l&rsquo;altro.</p>`},
   {label:'Il secondo, che produce una rotazione', body:R`
   <p>$X=y\dfrac{\partial}{\partial x}$ e $Y=x\dfrac{\partial}{\partial y}$. Il conto dà
   $$[X,Y]=y\frac{\partial}{\partial y}-x\frac{\partial}{\partial x}.$$
   <b>I due campi «di taglio» generano, commutando, un campo di dilatazione anisotropa.</b> È il fenomeno generale: parentesi di campi semplici producono campi nuovi, e l&rsquo;insieme dei campi generati è l&rsquo;<b>algebra di Lie</b> che quei campi generano — l&rsquo;oggetto che in gd-14 diventa protagonista.</p>
   <p><b>Vale la pena guardare i tre campi insieme.</b> $X$ e $Y$ sono le due «matrici di taglio» elementari, e il loro commutatore è la matrice diagonale con entrate opposte: in linguaggio di matrici $2\times2$ si stanno calcolando le relazioni dell&rsquo;algebra $\mathfrak{sl}_2$, la stessa che in meccanica quantistica governa lo spin e in analisi le rappresentazioni di $SL(2,\mathbb{R})$. <b>Tre campi che si chiudono fra loro sotto parentesi</b>: è il primo esempio di algebra di Lie di dimensione finita del corso, e non è un caso che sia anche il più usato in fisica.</p>`},
   {label:'Come si organizza il calcolo, per non sbagliarlo', body:R`
   <p>All&rsquo;esame la parentesi si calcola in coordinate, e la formula da usare è quella in componenti — non la definizione come commutatore, che è concettualmente primaria ma operativamente lenta. <b>La procedura è meccanica</b>: si scrivono i campi come liste di coefficienti, e per ogni componente $k$ del risultato si applica $X$ al coefficiente $Y^{k}$ e si sottrae $Y$ applicato a $X^{k}$.</p>
   <p><b>I due controlli che smascherano quasi ogni errore.</b> Primo: il risultato dev&rsquo;essere <i>antisimmetrico</i>, quindi rifacendo il conto a ruoli scambiati deve venire l&rsquo;opposto; è un controllo che costa dieci secondi. Secondo: se uno dei due campi ha coefficienti <b>costanti</b>, il termine che lo coinvolge come derivatore sparisce — perché derivare una costante dà zero — e il conto si dimezza. <b>Se due campi hanno entrambi coefficienti costanti la parentesi è nulla</b>, e infatti i campi coordinati $\partial_i$ commutano fra loro: è la ragione per cui esistono i sistemi di coordinate.</p>
   <p><b>L&rsquo;errore tipico</b> è dimenticare che il coefficiente va derivato e trattare la parentesi come se fosse un prodotto puntuale. Il sintomo è che viene zero troppo spesso. <b>Se in un esercizio la parentesi viene nulla, conviene chiedersi se sia un risultato o un sintomo</b> — a volte è vero, e allora c&rsquo;è dietro una ragione geometrica che vale la pena nominare.</p>`}
  ]}
]},

/* ---------------- 03 · IL SIGNIFICATO GEOMETRICO ---------------- */
{ num:'03', title:'Il quadratino che non si chiude', meta:'il percorso a quattro lati · perche il difetto e del secondo ordine · e il legame con MQ',
  blocchi:[
  {t:'prosa', title:'Che cosa misura, geometricamente', tag:'idea', html:R`
  <p><b>Il significato</b>: si parte da $p$, si scorre lungo $X$ per un tempo $t$, poi lungo $Y$ per $t$, poi indietro lungo $X$, poi indietro lungo $Y$. <b>Non si torna al punto di partenza</b>: il difetto di chiusura è
  $$t^{2}\,[X,Y](p)+O(t^{3}).$$
  <b>La parentesi è il difetto di chiusura del quadratino</b>, al secondo ordine. Se $[X,Y]=0$ i due flussi commutano e il quadratino si chiude — ed è esattamente la condizione per poter usare i due campi come <b>coordinate</b>.</p>
  <div class="note"><b>È il fatto che in meccanica quantistica diventa il principio di indeterminazione.</b> Posizione e impulso sono generatori di traslazioni (nello spazio e nel momento), non commutano, e $[\hat x,\hat p]=i\hbar$ è la stessa struttura: <i>misurare in un ordine o nell&rsquo;altro non dà lo stesso risultato, e la differenza è il commutatore</i>. La geometria di questa tappa e l&rsquo;algebra di quel principio sono lo stesso oggetto.</div>
  <p><b>Il caso di prima, seguito passo per passo</b>, perché il fenomeno si vede meglio su numeri che su una formula. Si prendano $X=\partial_x$ e $Y=x\,\partial_y$, e si parta dall&rsquo;origine. Scorrendo lungo $X$ per un tempo $t$ si arriva in $(t,0)$. Ora si scorre lungo $Y$: lì la velocità verticale è pari all&rsquo;ascissa, che vale $t$ e resta costante lungo questo tratto, quindi in un tempo $t$ si sale di $t^{2}$ in verticale, arrivando in $(t,t^{2})$. Si torna indietro lungo $X$ per un tempo $t$ e si arriva in $(0,t^{2})$. <b>Infine si scorre indietro lungo $Y$, e non succede niente</b>: l&rsquo;ascissa ora è nulla, quindi $Y$ è il campo nullo e il punto resta dov&rsquo;è.</p>
  <p><b>Si finisce in $(0,t^{2})$ invece che nell&rsquo;origine</b>, e lo scarto è $t^{2}$ nella direzione $\partial_y$ — cioè esattamente $t^{2}[X,Y]$, come previsto, e in questo caso senza nemmeno il resto $O(t^{3})$. <b>L&rsquo;asimmetria è tutta nel fatto che il tratto di andata lungo $Y$ avviene dove $x$ vale $t$ e quello di ritorno dove $x$ vale zero</b>: il campo $Y$ è diverso nei due posti, perché $X$ ha spostato il punto lì dove $Y$ è cambiato. È il meccanismo generale, spogliato di ogni tecnicismo.</p>
  <p><b>Perché il difetto è del secondo ordine e non del primo.</b> Al primo ordine i due percorsi — prima $X$ poi $Y$, oppure prima $Y$ poi $X$ — arrivano entrambi in $p+t(X+Y)$, perché a quell&rsquo;ordine si sommano semplicemente gli spostamenti e la somma è commutativa. <b>La non commutatività è invisibile al primo ordine, per ogni coppia di campi</b>, ed è il motivo per cui tutte le varietà «sembrano piatte» da vicino e tutti i campi «sembrano commutare». Bisogna guardare il termine successivo, e lì compare la parentesi.</p>`},
  {t:'plot', title:'Il quadratino che non si chiude',
   intro:R`Il difetto di chiusura dopo il percorso $X$, $Y$, $-X$, $-Y$ per un tempo $t$, in funzione di $t$: cresce come $t^{2}$ quando la parentesi non è nulla, ed è esattamente nullo quando lo è.`,
   plots:[
    {kind:'func2d', xr:[0,1], yr:[0,1.1], height:320,
     title:'difetto di chiusura: quadratico se [X,Y] non e nullo, zero se lo e',
     xlabel:'t', ylabel:'distanza dal punto di partenza',
     curves:[
      {f:'x*x', col:'#5eead4', width:2.6, label:'[X,Y] diverso da zero: cresce come t^2'},
      {f:'0', col:'#b98cff', width:2.2, dash:true, label:'[X,Y]=0: il quadratino si chiude'}
     ],
     marks:[{x:1, y:1, label:'il coefficiente e |[X,Y]|', col:'#d8a13a', left:true}]}
   ],
   leggi:R`<b>La curva verde è quadratica, non lineare</b>, e questo è il punto: al primo ordine i due percorsi coincidono sempre — la non commutatività è un effetto del <i>secondo</i> ordine. È il motivo per cui su scale piccole ogni varietà sembra piatta e ogni coppia di campi sembra commutare, e occorre guardare il termine successivo per vedere la struttura.<br><br>
   <b>La retta viola è il caso $[X,Y]=0$</b>: il quadratino si chiude esattamente, per ogni $t$, non solo al secondo ordine. Quando questo succede i due flussi si possono usare come sistema di coordinate — «vado $a$ lungo $X$ e $b$ lungo $Y$» è ben definito indipendentemente dall&rsquo;ordine — e il teorema di Frobenius dice che è proprio quella la condizione.`},
  {t:'plot', title:'Lo stesso quadratino, disegnato nel piano',
   intro:R`Il percorso concreto per $X=\partial_x$ e $Y=x\,\partial_y$ con $t=0{,}6$, a partire dall'origine. Sullo sfondo il campo $Y$, la cui intensità cresce con l'ascissa: è quella disomogeneità a produrre il difetto.`,
   plots:[

   ],
   leggi:R`<p><b>I tre segmenti percorsi sono tre, non quattro</b>, ed è il punto della figura: il quarto tratto — quello di ritorno lungo $Y$ — ha lunghezza zero, perché sull&rsquo;asse verticale il campo $Y$ è nullo. Il percorso si interrompe a mezz&rsquo;aria, e la distanza fra il punto d&rsquo;arrivo e quello di partenza è lo scarto.</p>
   <p><b>Le frecce dello sfondo spiegano perché.</b> $Y$ spinge verso l&rsquo;alto tanto più forte quanto più si è a destra, e il percorso sale dove le frecce sono lunghe mentre tornerebbe giù dove sono nulle. <b>Il difetto non viene da una proprietà astratta dei campi ma da questa disomogeneità</b>: se $Y$ fosse lo stesso in tutti i punti, l&rsquo;andata e il ritorno si compenserebbero e il quadratino si chiuderebbe.</p>
   <p><b>Il numero torna</b>: con $t=0{,}6$ lo scarto vale $0{,}36$, cioè $t^{2}$, e la direzione è verticale, cioè $\partial_y$. Confrontando con il risultato della tappa precedente, $[X,Y]=\partial_y$, si vede che la formula $t^{2}[X,Y]$ non è un&rsquo;approssimazione in questo esempio ma il valore esatto — accade perché i coefficienti sono lineari e i termini di ordine superiore sono identicamente nulli.</p>`}
]},

/* ---------------- 04 · LE PROPRIETÀ ---------------- */
{ num:'04', title:'Le proprieta: algebra di Lie, F-associati, sottovarieta', meta:'antisimmetria e Jacobi · la derivata di Lie · campi F-associati · e il teorema sulle sottovarieta',
  blocchi:[
  {t:'prosa', title:'La struttura algebrica', tag:'grammatica', html:R`
  <p>La parentesi è <b>bilineare</b>, <b>antisimmetrica</b> ($[X,Y]=-[Y,X]$) e soddisfa l&rsquo;<b>identità di Jacobi</b>
  $$[X,[Y,Z]]+[Y,[Z,X]]+[Z,[X,Y]]=0.$$
  Uno spazio vettoriale con un&rsquo;operazione così si chiama <b>algebra di Lie</b>: i campi vettoriali su $M$ ne formano una (di dimensione infinita), e in gd-14 se ne troverà una di dimensione finita dentro ogni gruppo di Lie.</p>
  <p><b>Jacobi non è associatività</b> — la parentesi <i>non</i> è associativa — ed è la sostituta giusta: dice che $[X,\cdot]$ è una derivazione della parentesi stessa. <b>In meccanica analitica la stessa identità vale per le parentesi di Poisson</b>, e non è una coincidenza: entrambe nascono da commutatori.</p>
  <p>Si scrive anche $\mathcal{L}_XY=[X,Y]$ e si chiama <b>derivata di Lie</b> di $Y$ lungo $X$: misura quanto $Y$ cambia mentre lo si trascina col flusso di $X$ (gd-15 ne darà la formula col flusso). <b>Due nomi per lo stesso oggetto</b>, e la scelta dipende da cosa si vuole enfatizzare: struttura algebrica, o variazione lungo un moto.</p>
  <p><b>Perché Jacobi è la forma giusta della domanda «è associativa?».</b> Per un&rsquo;operazione qualunque, l&rsquo;associatività dice che il modo di raggruppare non conta. Per un commutatore questo è falso, e lo si vede subito: $[X,[Y,Z]]$ e $[[X,Y],Z]$ sono diversi. Ciò che sopravvive è più debole e più utile: la somma dei tre raggruppamenti ciclici è nulla. <b>Riscritta come $[X,[Y,Z]]=[[X,Y],Z]+[Y,[X,Z]]$, l&rsquo;identità dice che prendere la parentesi con $X$ si comporta come una derivata rispetto alla parentesi</b> — stessa forma della regola di Leibniz, con la parentesi al posto del prodotto. È il motivo per cui l&rsquo;operatore $\operatorname{ad}_X=[X,\cdot]$ si chiama rappresentazione aggiunta e compare in tutta la teoria dei gruppi.</p>`},
  {t:'prosa', title:'F-associati, e il teorema sulle sottovarieta', tag:'regola operativa', html:R`
  <p>Due campi $X$ su $M$ e $\tilde X$ su $N$ si dicono <b>$F$-associati</b> se $dF(X_p)=\tilde X_{F(p)}$: $F$ trasporta l&rsquo;uno nell&rsquo;altro. <b>Teorema</b>: se $X\sim\tilde X$ e $Y\sim\tilde Y$, allora $[X,Y]\sim[\tilde X,\tilde Y]$. <b>La parentesi è naturale</b>, cioè compatibile con le mappe lisce — ed è ciò che la rende un oggetto geometrico e non un artificio di coordinate.</p>
  <p><b>Il corollario che Diverio usa il 03/12</b>: se $X$ e $Y$ sono <b>tangenti</b> a una sottovarietà immersa $S$, allora anche $[X,Y]$ lo è. La dimostrazione è immediata con l&rsquo;associazione: i campi ristretti a $S$ sono associati a quelli su $M$ via l&rsquo;inclusione.</p>
  <p><b>Perché la naturalità vale quanto il teorema.</b> Un campo vettoriale in generale <i>non</i> si può trasportare con una mappa liscia: se $F$ non è un diffeomorfismo, l&rsquo;immagine di un campo non è un campo — due punti diversi possono andare nello stesso punto con vettori diversi. La relazione di $F$-associazione è il surrogato: non trasporta, ma dice quando due campi già dati si corrispondono. <b>Il teorema afferma che questa corrispondenza sopravvive alla parentesi</b>, ed è ciò che permette di calcolarla nella carta più comoda sapendo che il risultato è lo stesso. Senza naturalità, la parentesi sarebbe una formula in coordinate senza significato geometrico.</p>
  <p><b>La conseguenza è il teorema di Frobenius</b> (fuori dal corso ma vicino): una distribuzione di piani tangenti è integrabile — cioè esistono sottovarietà tangenti a quei piani — <b>se e solo se</b> è chiusa rispetto alla parentesi. <b>La parentesi decide se un sistema di direzioni si può integrare</b>, ed è il ponte fra questo movimento e tutte le equazioni differenziali che seguono.</p>
  <p><b>Un modo di ricordare Frobenius senza dimostrarlo</b>: se le sottovarietà tangenti esistono, allora due campi tangenti a quei piani hanno flussi che restano dentro la sottovarietà, e il quadratino della tappa precedente si chiude <i>dentro</i> di essa — quindi anche il difetto di chiusura, cioè la parentesi, è tangente. <b>La direzione facile del teorema è questa, ed è un&rsquo;osservazione, non un conto</b>; la direzione difficile è che la condizione basta, e quella richiede costruire le sottovarietà.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Perché non si può definire la parentesi punto per punto, come si fa per la somma di due campi?`,
    a:R`Perché il valore di $[X,Y]$ in $p$ dipende dalle <b>derivate</b> dei coefficienti, quindi dai valori dei campi in un intorno di $p$ e non solo in $p$. Due campi che coincidono in un punto ma non attorno possono dare parentesi diverse. <b>È la differenza fra un&rsquo;operazione tensoriale e un operatore differenziale</b>, e si legge nella formula $[X,hY]=h[X,Y]+X(h)Y$: il termine $X(h)Y$ non è $\mathcal{C}^{\infty}$-lineare, e la sua presenza è la firma della non tensorialità.`},
   {q:R`I campi coordinati $\partial_1,\dots,\partial_n$ commutano fra loro. C'è un inverso?`,
    a:R`Sì, ed è il teorema che dà senso a tutto il movimento: se $X_1,\dots,X_k$ sono campi linearmente indipendenti in un punto e commutano a due a due, allora <b>esiste una carta locale in cui essi sono esattamente i campi coordinati</b>. Commutare e «essere un sistema di coordinate» sono la stessa cosa, letta in due lingue. <b>La parentesi è dunque l&rsquo;ostruzione a trovare coordinate adattate a una famiglia di direzioni</b>, ed è questo che la rende centrale e non un esercizio di algebra.`}
  ]}
]},

/* ---------------- 05 · ESERCIZI ---------------- */
{ num:'05', title:'Esercizi — tocca a te', meta:'campi che commutano · un coefficiente non lineare · e lalgebra delle rotazioni',
  blocchi:[
  {t:'esercizio', title:'1 · Due campi che commutano, e perche',
   src:'il caso in cui la parentesi e nulla per una ragione, non per caso',
   testo:R`Calcola $[X,Y]$ per $X=x\,\partial_x$ e $Y=y\,\partial_y$ su $\mathbb{R}^{2}$. Poi spiega geometricamente il risultato usando i flussi.`,
   steps:[
    {label:'Il conto', body:R`
    <p>Applicando la procedura: la prima componente del risultato è $X$ applicato al coefficiente di $\partial_x$ in $Y$ — che è zero — meno $Y$ applicato al coefficiente $x$, cioè $y\,\partial_y(x)$, di nuovo zero. La seconda componente è simmetrica e dà lo stesso. <b>La parentesi si annulla identicamente</b>.</p>
    <p>Rifacendolo con il commutatore su una funzione, per esercizio: $XY(f)$ è $x\,\partial_x(y\,\partial_y f)$, cioè $xy\,\partial_x\partial_y f$, perché $y$ non dipende da $x$ e passa fuori dalla derivata. Simmetricamente $YX(f)$ è $yx\,\partial_y\partial_x f$, e i due coincidono per Schwarz. <b>Qui la cancellazione è totale: non resta nemmeno il termine del primo ordine</b>, perché nessuno dei due campi ha coefficienti che dipendono dalla variabile dell&rsquo;altro.</p>`},
    {label:'La ragione geometrica', body:R`
    <p>Il flusso di $X$ è la dilatazione orizzontale — l&rsquo;ascissa viene moltiplicata per un fattore che cresce esponenzialmente col tempo — e quello di $Y$ è la dilatazione verticale, che agisce solo sull&rsquo;ordinata. <b>Le due trasformazioni toccano coordinate diverse e non si disturbano</b>: dilatare prima in orizzontale e poi in verticale dà lo stesso punto dell&rsquo;ordine opposto.</p>
    <p><b>Il criterio generale che si legge in questo esempio</b>: due campi commutano quando i loro flussi si possono eseguire in qualunque ordine, e questo succede tipicamente quando agiscono su «direzioni indipendenti» in un senso che si può rendere preciso. Per il teorema citato nel controllo lampo, ciò equivale a dire che esiste una carta in cui i due campi sono i campi coordinati: qui la carta c&rsquo;è ed è logaritmica, $u=\log x$ e $v=\log y$, dove i due campi diventano $\partial_u$ e $\partial_v$. <b>Trovare esplicitamente quella carta è il modo più convincente di verificare il risultato.</b></p>`}
   ]},
  {t:'esercizio', title:'2 · Un coefficiente non lineare',
   src:'il conto che mostra che la parentesi deriva i coefficienti',
   testo:R`Calcola $[X,Y]$ per $X=\partial_x$ e $Y=x^{2}\,\partial_y$, e confronta con il caso $Y=x\,\partial_y$ della tappa 02. Che cosa cambia nel difetto di chiusura del quadratino?`,
   steps:[
    {label:'Il conto e il confronto', body:R`
    <p>Il termine che sopravvive è la derivata del coefficiente di $Y$ lungo $X$, cioè la derivata di $x^{2}$ rispetto a $x$. Quindi la parentesi vale $2x\frac{\partial}{\partial y}$.</p>
    <p><b>La differenza col caso lineare è che ora la parentesi dipende dal punto</b>: nell&rsquo;origine è nulla, e cresce allontanandosi. Nel caso $Y=x\,\partial_y$ la parentesi era il campo costante $\partial_y$, uguale ovunque. <b>Si è passati da una non commutatività uniforme a una che varia</b>, ed è la situazione generica: la parentesi è un campo, e come ogni campo ha il diritto di cambiare da punto a punto.</p>`},
    {label:'Il quadratino, rifatto', body:R`
    <p>Ripetendo il percorso della tappa 03 a partire dall&rsquo;origine: si va in $(t,0)$, poi si sale con velocità pari a $x^{2}$, che lungo quel tratto vale $t^{2}$, per un tempo $t$, arrivando a quota $t^{3}$; si torna indietro in orizzontale e il quarto tratto è di nuovo nullo. <b>Lo scarto è $t^{3}$, non $t^{2}$</b>.</p>
    <p>Non è una contraddizione con la formula generale: quella dice che lo scarto è $t^{2}[X,Y](p)$, e <b>nell&rsquo;origine $[X,Y]$ vale zero</b>, quindi il termine principale svanisce e resta il successivo. <b>Partendo da un punto con $x\ne0$ lo scarto torna a essere quadratico</b>, con coefficiente $2x$. È un buon esercizio di controllo: la formula non è sbagliata, è che si è scelto il punto in cui il coefficiente si annulla, ed è lo stesso fenomeno per cui un massimo si riconosce dalla derivata seconda solo dove la prima è nulla.</p>`}
   ]},
  {t:'esercizio', title:'3 · Lalgebra delle rotazioni, che e il momento angolare',
   src:'il conto che collega questo movimento alla meccanica quantistica',
   testo:R`Su $\mathbb{R}^{3}$ si considerino i generatori delle rotazioni attorno ai tre assi: $L_1=y\,\partial_z-z\,\partial_y$, $L_2=z\,\partial_x-x\,\partial_z$, $L_3=x\,\partial_y-y\,\partial_x$. Calcola $[L_1,L_2]$ e confronta il risultato con le regole di commutazione del momento angolare.`,
   steps:[
    {label:'Il conto', body:R`
    <p>Applicando la procedura componente per componente, o svolgendo il commutatore su una funzione, tutti i termini secondi si elidono e restano soltanto quelli in cui $L_1$ deriva i coefficienti di $L_2$ e viceversa. Il risultato è $y\frac{\partial}{\partial x}-x\frac{\partial}{\partial y}$.</p>
    <p><b>Cioè $-L_3$</b>, e il segno non è un errore di conto: va guardato, perché è il punto interessante dell&rsquo;esercizio. I tre campi si chiudono fra loro — la parentesi di due di essi è (a meno di segno) il terzo — e <b>formano quindi un&rsquo;algebra di Lie tridimensionale dentro lo spazio infinito-dimensionale di tutti i campi su $\mathbb{R}^{3}$</b>. È l&rsquo;algebra $\mathfrak{so}(3)$, e in gd-14 la si ritroverà come spazio tangente al gruppo delle rotazioni.</p>`},
    {label:'Il segno, e perche torna con la meccanica quantistica', body:R`
    <p>In meccanica quantistica si scrive $[\hat L_x,\hat L_y]=i\hbar\hat L_z$, con il segno positivo, e sembra in contrasto con quanto appena calcolato. <b>Non lo è, ed è un buon esercizio di coerenza fra le due lingue.</b> Gli operatori quantistici sono $\hat L_k=-i\hbar L_k$, cioè i campi moltiplicati per $-i\hbar$. Calcolando il commutatore degli operatori si raccoglie un fattore $(-i\hbar)^{2}$, cioè $-\hbar^{2}$, che moltiplica il risultato geometrico $-L_3$ e dà $\hbar^{2}L_3$; d&rsquo;altra parte $i\hbar\hat L_z$ vale $i\hbar\cdot(-i\hbar L_3)$, di nuovo $\hbar^{2}L_3$. <b>Le due scritture coincidono, e la differenza di segno apparente è tutta nel fattore immaginario della convenzione fisica.</b></p>
    <p><b>Che cosa si è guadagnato a fare il conto in geometria.</b> Le regole di commutazione del momento angolare, che in un corso di MQ arrivano come postulato o come conto con gli operatori, qui sono un fatto sui campi vettoriali: <b>sono il difetto di chiusura del quadratino fatto con due rotazioni</b>. Ruotare di poco attorno a $x$, poi attorno a $y$, poi indietro attorno a $x$ e indietro attorno a $y$ non riporta l&rsquo;oggetto nella posizione iniziale, e ciò che resta è una piccola rotazione attorno a $z$. <b>È un fatto che si può verificare con un libro in mano</b>, e che l&rsquo;algebra degli operatori formalizza senza renderlo più vero.</p>`}
   ]}
]},

/* ---------------- 06 · IL SENSO ---------------- */
{ num:'06', title:'Il senso, e le rotte', meta:'cosa apre, e perche i commutatori sono ovunque in fisica',
  blocchi:[
  {t:'prosa', title:'Cosa lascia in mano', tag:'sintesi', html:R`
  <p><b>Il punto.</b> La non commutatività è misurabile, e la misura è ancora un oggetto dello stesso tipo. <b>Questa chiusura</b> — il commutatore di due campi è un campo — è ciò che rende possibile una teoria algebrica delle simmetrie infinitesime, e da lì arriva metà della fisica teorica.</p>
  <p><b>A valle.</b> gd-13 integra un campo e trova le curve integrali; gd-14 studia i campi invarianti su un gruppo e trova l&rsquo;algebra di Lie; gd-15 collega parentesi e flussi.</p>
  <p><b>Che cosa portarsi via, in ordine di durata.</b> L&rsquo;immagine del quadratino che non si chiude, che è il significato e si ricorda per sempre. La formula in componenti, che serve all&rsquo;esame e si riscrive dalla definizione in trenta secondi. Il fatto che la parentesi <i>non</i> sia tensoriale, che è l&rsquo;errore più costoso da commettere. E il meccanismo della cancellazione — antisimmetrico contro simmetrico — che è utile ben oltre questo movimento.</p>`},
  {t:'prolessi', title:'Dove riappare questo movimento',
   oggetto:R`<b>Il commutatore</b>: quanto due operazioni infinitesime non commutano, e il fatto che la risposta sia dello stesso tipo.`,
   rotte:[
    {dove:'Meccanica<br>quantistica', txt:R`$[\hat x,\hat p]=i\hbar$ è questa struttura: gli operatori sono generatori di trasformazioni, e il commutatore misura il difetto di chiusura. <b>Le regole di commutazione del momento angolare sono l&rsquo;algebra di Lie di $SO(3)$</b>, e lo spettro si ricava da esse per pura algebra.`},
    {dove:'Meccanica<br>analitica', txt:R`Le <b>parentesi di Poisson</b> hanno le stesse proprietà (bilineari, antisimmetriche, Jacobi), e il teorema di Noether è l&rsquo;affermazione che le quantità conservate formano un&rsquo;algebra di Lie. <b>Il passaggio classico-quantistico sostituisce $\{\cdot,\cdot\}$ con $\frac{1}{i\hbar}[\cdot,\cdot]$.</b>`},
    {dove:'Teoria<br>dei campi', txt:R`L&rsquo;algebra di Lie del gruppo di gauge determina la forma dell&rsquo;interazione; il termine $[A_\mu,A_\nu]$ nel tensore di Yang-Mills è letteralmente una parentesi, ed è la ragione per cui le teorie non abeliane hanno interazioni fra i bosoni di gauge mentre l&rsquo;elettromagnetismo no.`},
    {dove:'Controllo<br>e robotica', txt:R`Un sistema si puo' portare in direzioni che <b>non</b> sono generate direttamente dai comandi, usando i commutatori: e' il motivo per cui un'auto puo' parcheggiare lateralmente pur non potendo muoversi lateralmente. Il teorema di Chow-Rashevskii lo dice con questa algebra.`}
   ],
   domanda:R`Se $[X,Y]=0$ i flussi commutano e i due campi si possono usare come coordinate. <b>Domanda che porti avanti:</b> data una famiglia di direzioni in ogni punto — una <i>distribuzione</i> — quando esiste una famiglia di sottovarietà tangenti a quelle direzioni? La risposta è il <b>teorema di Frobenius</b>: se e solo se la distribuzione è chiusa per parentesi. In termodinamica è la condizione di integrabilità che distingue una forma differenziale esatta da una che non lo è, e <b>il calore non è una funzione di stato esattamente per questo</b>: la forma $\delta Q$ non è integrabile, e serve un fattore integrante — che è la temperatura, e produce l&rsquo;entropia.`}
]}

];

function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}

}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
    else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
    else if(b.t==='prolessi') m.appendChild(sectionProlessi(b));
    else if(b.t==='reveal')m.appendChild(sectionReveal(b.title,b.tag,b.steps));
    else if(b.t==='esercizio') m.appendChild(sectionEsercizio(b));
    else if(b.t==='collaudo')  m.appendChild(sectionCollaudo(b.title,b.items));
    else if(b.t==='plot')      m.appendChild(sectionPlot(b));
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}

/* deep-link: gd-12-parentesi-lie.html#03 apre direttamente la tappa 03 */
window.addEventListener('DOMContentLoaded', function(){
  var h=(location.hash||'').replace('#','');
  showTappa(byId[h]?h:'00');
});
window.addEventListener('hashchange', function(){
  var h=(location.hash||'').replace('#','');
  if(byId[h]) showTappa(h);
});
</script>
