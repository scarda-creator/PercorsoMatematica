/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un
   rimando scritto nella prosa:

       <span class="str" data-str="serie-geometrica">la serie geometrica</span>

   Le schede citate da questo nucleo sono cucite qui sotto dal montaggio
   (assembla-nucleo.js): la pagina resta autosufficiente — niente fetch,

   esiste FERMA la costruzione invece di arrivare in pagina rotto.
   Apertura: lo stesso gesto del collaudo (si clicca, il pannello compare,
   si typeset una volta sola), portato dentro la frase.
   =================================================================== */
var CORSO = 'meccanica-statistica';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["moltiplicatori-di-lagrange"] = {"nome":"Moltiplicatori di Lagrange","riga":"Per rendere stazionaria $f$ sotto i vincoli $g_{i}=0$ si rende stazionaria $f-\\sum_i\\lambda_i g_i$ nelle variabili libere, trattando i $\\lambda_i$ come incognite in piu'.","serve":"Permette di massimizzare senza prima risolvere i vincoli — che e' quasi sempre impossibile quando le variabili sono $10^{23}$. In cambio si pagano tante incognite quante sono i vincoli, e si guadagna che i moltiplicatori hanno quasi sempre un significato fisico: non sono scorie del metodo, sono le grandezze coniugate ai vincoli.","esempio":"Massimizzare $f=xy$ sul vincolo $x+y=2$: si annulla il gradiente di $xy-\\lambda(x+y-2)$, da cui $y=\\lambda$, $x=\\lambda$ e quindi $x=y=1$, $\\lambda=1$, massimo $1$. Sostituendo il vincolo a mano si sarebbe trovato lo stesso, ma con due vincoli e cento variabili la sostituzione non si fa e questa si'.","pieno":null,"qui":{"meccanica-statistica":{"serve":"E' il modo in cui gli ensemble si DEDUCONO invece di essere postulati: si massimizza l'entropia di Gibbs $S=-k\\sum_i p_i\\ln p_i$ sotto i vincoli che le probabilita' sommino a uno e che l'energia media sia fissata, e la distribuzione di Boltzmann esce come conseguenza. I due moltiplicatori non restano anonimi: uno si rivela essere $\\beta=1/kT$, l'altro la normalizzazione.","esempio":"Da $\\partial_{p_i}\\big[-k\\sum p\\ln p-\\alpha(\\sum p-1)-\\beta'(\\sum pE-U)\\big]=0$ si ottiene $-k(\\ln p_i+1)-\\alpha-\\beta' E_i=0$, cioe' $p_i\\propto e^{-\\beta E_i}$ con $\\beta=\\beta'/k$. Il confronto con la termodinamica identifica poi $\\beta=1/kT$: il moltiplicatore del vincolo sull'energia E' l'inverso della temperatura."}}};
STRUM["delta-di-dirac"] = {"nome":"Delta di Dirac","riga":"Non è una funzione ma un funzionale, definito da $\\int f(x)\\,\\delta(x-a)\\,dx=f(a)$, che composto con una funzione si spezza sui suoi zeri come $\\delta(g(x))=\\sum_i \\delta(x-x_i)/|g'(x_i)|$.","serve":"Serve come macchina per cambiare variabile senza invertire nulla. La densità di $y=f(x)$ si scrive $p_Y(y)=\\int p_X(x)\\,\\delta(y-f(x))\\,dx$, e la delta produce da sola il fattore $1/|f'|$ che altrimenti andrebbe messo a mano: i rami molteplici si contano da soli invece di doverli ricordare. È la ragione pratica per cui il formalismo con la delta compare in ogni soluzione d'esame che tocchi una distribuzione, mentre il cambio di variabile esplicito compare quasi mai.","esempio":"$\\delta(x^2-a^2)$ con $a$ positivo. Gli zeri sono $x=\\pm a$; la derivata dell'argomento è $2x$, che in modulo vale $2a$ su entrambi. Quindi $\\delta(x^2-a^2)=\\dfrac{1}{2a}\\big[\\delta(x-a)+\\delta(x+a)\\big]$. Il caso si ripete identico in fisica statistica con $\\varepsilon=p^2/2m$ in una dimensione, dove i due rami $p=\\pm\\sqrt{2m\\varepsilon}$ contribuiscono entrambi — e dimenticarne uno dimezza la risposta.","pieno":{"file":"15-distribuzioni.html","tappa":"01","come":"le distribuzioni come funzionali, la delta e le sue proprietà, nel nucleo di Metodi"},"qui":{"meccanica-statistica":{"serve":"È lo strumento con cui si calcola la densità degli stati, cioè l'oggetto su cui poggia tutto il secondo tempo del corso: $g(\\varepsilon)=\\int d^dp\\,d^dq\\;\\delta(\\varepsilon-H)/h^d$. L'identità che si usa davvero non è la definizione ma questa: $\\delta(\\varepsilon-H)=\\partial_\\varepsilon\\,\\theta(\\varepsilon-H)$. Si scambia l'integrale con la derivata e ci si ritrova a calcolare il volume della regione dove l'hamiltoniana sta sotto $\\varepsilon$ — un integrale elementare — invece di un integrale con una delta dentro. La $g$ così ottenuta è pura geometria dello spazio delle fasi: non sa nulla della temperatura, e per questo resta identica quando si passa da Boltzmann a Fermi o a Bose.","esempio":"Particella libera in due dimensioni. Il volume della regione $p^2/2m$ sotto $\\varepsilon$ è il disco di area $2\\pi m\\varepsilon$; derivando rispetto a $\\varepsilon$ si ottiene $2\\pi m$, cioè una densità degli stati costante. Non è una curiosità: è la ragione per cui in due dimensioni una particella libera non condensa, e per cui le prove che chiedono la condensazione in $d=2$ mettono sempre un potenziale confinante, che porta la $g$ da costante a crescente."}},"controllo":[{"tipo":"derivata","espr":"x**2-a**2","rispetto":["x"],"vale":"2*x","ipotesi":{"x":"positive","a":"positive"},"dove":"esempio","appare":"2x"},{"tipo":"uguale","sinistra":"1/Abs(2*a)","vale":"1/(2*a)","ipotesi":{"a":"positive"},"dove":"esempio","appare":"\\dfrac{1}{2a}"},{"tipo":"derivata","espr":"2*pi*m*e","rispetto":["e"],"vale":"2*pi*m","ipotesi":{"m":"positive","e":"positive"},"dove":"qui.meccanica-statistica.esempio","appare":"2\\pi m"}]};
STRUM["integrale-gaussiano"] = {"nome":"Integrale gaussiano","riga":"$\\displaystyle\\int_{-\\infty}^{+\\infty} e^{-ax^{2}}\\,dx=\\sqrt{\\pi/a}$ per $a>0$, e $\\displaystyle\\int_{-\\infty}^{+\\infty} x^{2}e^{-ax^{2}}\\,dx=\\tfrac12\\sqrt{\\pi/a^{3}}$.","serve":"E' l'unico integrale che serve davvero sapere a memoria in meccanica statistica, perche' l'energia cinetica e' quadratica nell'impulso e quindi ogni integrazione sugli impulsi e' una gaussiana. Il trucco della dimostrazione — elevare al quadrato e passare in coordinate polari — vale la pena di vederlo una volta: e' il motivo per cui compare un $\\pi$ in una formula che di cerchi non parla.","esempio":"Da $I^{2}=\\iint e^{-a(x^{2}+y^{2})}dx\\,dy=2\\pi\\int_{0}^{\\infty}re^{-ar^{2}}dr=\\pi/a$ segue $I=\\sqrt{\\pi/a}$. I momenti superiori si ottengono derivando rispetto ad $a$ sotto il segno: $-\\partial_a I=\\int x^{2}e^{-ax^{2}}dx=\\tfrac12\\sqrt{\\pi}\\,a^{-3/2}$. Derivare rispetto a un parametro e' piu' rapido che integrare per parti, e funziona per tutti i momenti pari.","pieno":null,"qui":{"meccanica-statistica":{"serve":"La funzione di partizione di una particella libera e' un prodotto di tre gaussiane negli impulsi, e da li' esce la lunghezza d'onda termica $\\lambda=h/\\sqrt{2\\pi m k T}$ — che e' la grandezza con cui si misura quando un gas smette di essere classico.","esempio":"$\\int e^{-\\beta p^{2}/2m}dp=\\sqrt{2\\pi m/\\beta}$, quindi $Z_{1}=\\dfrac{V}{h^{3}}(2\\pi mkT)^{3/2}=V/\\lambda^{3}$. Lo stesso integrale col peso $p^{2}$ da' $\\langle p^{2}/2m\\rangle=\\tfrac12 kT$ per grado di liberta': l'equipartizione non e' un principio a parte, e' questo integrale."}}};
STRUM["trasformata-di-legendre"] = {"nome":"Trasformata di Legendre","riga":"Scambia una variabile con la sua derivata coniugata: da $f(x)$ si passa a $g(p)=f(x)-px$ con $p=df/dx$, e $dg=-x\\,dp$.","serve":"Serve quando la variabile naturale di una funzione non e' quella che si controlla in laboratorio. La trasformata non perde informazione — da $g$ si torna a $f$ — e cambia solo quale variabile e' indipendente. E' l'operazione che genera tutti i potenziali termodinamici l'uno dall'altro, e la stessa che porta dalla lagrangiana all'hamiltoniana.","esempio":"Con $f(x)=x^{2}$: $p=2x$, $x=p/2$, $g=x^{2}-px=p^{2}/4-p^{2}/2=-p^{2}/4$. Il segno negativo non e' un errore: per $f$ convessa la trasformata e' concava, e applicandola due volte si torna a $f$.","pieno":null,"qui":{"meccanica-statistica":{"serve":"E' il ponte fra gli ensemble. Il passaggio da microcanonico a canonico non e' solo un cambio di racconto — energia fissata contro temperatura fissata — e' una trasformata di Legendre dell'entropia, e questo spiega perche' i due ensemble danno gli stessi risultati all'equilibrio: la trasformata e' invertibile.","esempio":"Da $S(E)$ con $1/T=\\partial S/\\partial E$ si passa all'energia libera $F=E-TS$, funzione di $T$ invece che di $E$, con $dF=-S\\,dT-p\\,dV$. Lo stesso schema porta da $F$ al gran potenziale $\\Omega=F-\\mu N$ scambiando $N$ con $\\mu$: e' sempre la stessa operazione, applicata a una coppia coniugata diversa."}}};

  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

/* ---------------- 00 · DI COSA PARLA QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Di cosa parla questo movimento', meta:'Meccanica Statistica · voce A.8 · perche risolvere in canonico un problema posto a energia fissata e legittimo',
  blocchi:[
  {t:'prosa', title:'La domanda che legittima tutto il resto del corso', tag:'architettura', html:R`
  <p>C&rsquo;è una crepa logica che percorre in silenzio ogni scritto di meccanica statistica, e che quasi nessuna prova rende esplicita. Il microcanonico descrive un sistema <b>isolato</b>, con energia fissata a $E$; il canonico descrive un sistema a <b>temperatura</b> fissata, in cui l&rsquo;energia è libera di fluttuare. Sono due situazioni fisiche diverse. Eppure, davanti a un problema formulato «$N$ particelle con energia totale $E$…», la soluzione standard passa immediatamente al canonico — scrive $Z_1$, la eleva alla $N$, deriva $\log Z$ — e nessuno batte ciglio. Perché è lecito? Se i due insiemi dessero termodinamiche diverse, risolvere in canonico un problema posto a energia fissata sarebbe semplicemente <b>sbagliato</b>.</p>
  <p style="text-align:center"><b>questo movimento dimostra che non lo è: nel limite termodinamico i due insiemi danno la stessa termodinamica, e la ragione è una sola parola — fluttuazioni.</b></p>
  <p>L&rsquo;argomento ha un cuore quantitativo e un&rsquo;anima concettuale. Il cuore è <b>un solo conto</b>: la varianza dell&rsquo;energia nel canonico vale $\langle H^2\rangle-\langle H\rangle^2=T^2C_V$, da cui la fluttuazione relativa $\Delta E/E\sim N^{-1/2}$. L&rsquo;anima è che, essendo quella fluttuazione relativa dell&rsquo;ordine di $10^{-12}$ per un sistema macroscopico, l&rsquo;energia nel canonico è <i>di fatto</i> fissata al suo valor medio — lo stesso valore che il microcanonico avrebbe imposto a mano. Da lì tre cose che questo movimento costruisce per intero: perché il picco della distribuzione dell&rsquo;energia si stringe, perché nel limite termodinamico i due insiemi coincidono, e — la domanda d&rsquo;orale che separa chi ha capito — <b>dove questa equivalenza si rompe</b>: transizioni di fase, interazioni a lungo raggio, calori specifici negativi.</p>
  <div class="note"><b>Due convenzioni, fissate all&rsquo;inizio.</b> Seguendo le note di Crisanti (docente del terzo canale) e di Gravina/Grilli-Giardina, poniamo la costante di Boltzmann $k=1$, così che $\beta=1/T$, l&rsquo;entropia $S=\log\Omega$ è un numero puro e la varianza dell&rsquo;energia è $T^2C_V$. Falcioni-Vulpiani tengono invece $k_B$ esplicito ($\beta=1/k_BT$) e scrivono la stessa varianza come $Nc_Vk_BT^2$: dove riporto una loro formula lo dichiaro, perché la differenza è solo di unità. La relazione ponte con la termodinamica, che useremo, è $F=-T\log Z$, con $F$ energia libera di Helmholtz.</p></div>`},
  {t:'prosa', title:'Come e fatto il movimento', tag:'architettura', html:R`
  <p><b>La rotta.</b> Prima il <b>conto centrale</b>: la varianza dell&rsquo;energia come derivata seconda di $\log Z$, e la sua identità con $T^2C_V$. Poi la <b>fluttuazione relativa</b> $\Delta E/E\sim1/\sqrt N$ e cosa significa nel limite termodinamico. Poi la <b>stessa storia raccontata dal microcanonico</b>: la spartizione dell&rsquo;energia fra sistema e bagno, l&rsquo;integrazione di picco con i <span class="str" data-str="moltiplicatori-di-lagrange">moltiplicatori di Lagrange</span> e l&rsquo;espansione gaussiana che dà la stessa larghezza — perché la verità non può dipendere dall&rsquo;insieme scelto. Poi il teorema vero e proprio, l&rsquo;<b>equivalenza degli insiemi</b>: perché $P(E)$ canonica diventa la $\delta(E-\langle H\rangle)$ microcanonica. Poi la <b>lettura generale</b> — la fluttuazione di una grandezza è la derivata della sua coniugata, cioè una suscettività: il primo assaggio di fluttuazione-dissipazione. Poi la <b>frontiera</b>, dove l&rsquo;equivalenza fallisce. Infine gli esercizi e le rotte.</p>`}
]},

/* ---------------- 01 · IL CONTO CENTRALE: LA VARIANZA COME DERIVATA SECONDA DI LOG Z ---------------- */
{ num:'01', title:'Il conto centrale: la varianza dell energia come derivata seconda di log Z', meta:'energia media come prima derivata · varianza come seconda derivata · l identita con T quadro C_V · il caso del gas ideale',
  blocchi:[
  {t:'reveal', title:'Dalla media alla varianza, derivando log Z', tag:'costruzione', steps:[
   {label:'L energia media e la prima derivata', body:R`
   <p>Partiamo dalla funzione di partizione $Z=\sum_s e^{-\beta H(s)}$, che nel canonico raccoglie il peso di Boltzmann su tutti i microstati. L&rsquo;<b>energia media</b> è la media del peso, e si ottiene derivando $Z$ rispetto a $\beta$. Il singolo termine deriva come $\partial_\beta e^{-\beta H}=-H\,e^{-\beta H}$, quindi</p>
   $$\frac{\partial Z}{\partial\beta}=-\sum_s H\,e^{-\beta H}=-Z\langle H\rangle\quad\Longrightarrow\quad \langle H\rangle=-\frac{1}{Z}\frac{\partial Z}{\partial\beta}=-\frac{\partial\log Z}{\partial\beta}.$$
   <p>Questo è il primo anello: $\langle H\rangle=-\dfrac{\partial\log Z}{\partial\beta}$. La media dell&rsquo;energia è meno la derivata prima del logaritmo della partizione. Ma il canonico offre di più: derivando <i>ancora</i> si ottiene non una media, bensì una <b>varianza</b>.</p>`},
   {label:'La varianza e la seconda derivata', body:R`
   <p>Deriviamo $\langle H\rangle$ un&rsquo;altra volta rispetto a $\beta$. Conviene partire da $\langle H\rangle=\dfrac{1}{Z}\sum_s H e^{-\beta H}$ e usare la regola del prodotto, ricordando $\partial_\beta Z=-Z\langle H\rangle$:</p>
   $$-\frac{\partial\langle H\rangle}{\partial\beta}=\frac{\sum_s H^2 e^{-\beta H}}{Z}-\left(\frac{\sum_s H e^{-\beta H}}{Z}\right)^{\!2}=\langle H^2\rangle-\langle H\rangle^2.$$
   <p>Il primo termine è $\langle H^2\rangle$, il secondo è $\langle H\rangle^2$: la loro differenza è, per definizione, la <b>varianza dell&rsquo;energia</b> $(\Delta E)^2$. Riconoscendo che $-\partial_\beta\langle H\rangle=\partial^2_\beta\log Z$ (è la derivata seconda del logaritmo, come si verifica derivando due volte), abbiamo l&rsquo;identità che regge tutto:</p>
   $$\boxed{\;\langle H^2\rangle-\langle H\rangle^2=\dfrac{\partial^2\log Z}{\partial\beta^2}\;}$$
   <p>La fluttuazione dell&rsquo;energia non è un dato in più da misurare: è già scritta dentro $Z$, ed è la sua curvatura in $\beta$. Crisanti (pag. 201) svolge esattamente questo passaggio, saltando i conti intermedi con la sigla «DDP» e arrivando alla stessa boxata.</p>`},
   {label:'L identita con il calore specifico', body:R`
   <p>Ora traduciamo la derivata in $\beta$ in una derivata in $T$, che è la variabile fisica. Da $\beta=1/T$ segue $\dfrac{d\beta}{dT}=-\dfrac{1}{T^2}$, dunque l&rsquo;operatore $\partial_\beta=-T^2\partial_T$. Applicandolo a $\langle H\rangle=E$,</p>
   $$\langle H^2\rangle-\langle H\rangle^2=-\frac{\partial\langle H\rangle}{\partial\beta}=T^2\frac{\partial E}{\partial T}=T^2C_V,$$
   <p>avendo riconosciuto il <b>calore specifico a volume costante</b> $C_V=\partial E/\partial T$. Ecco la relazione centrale, nella forma in cui va ricordata:</p>
   $$\boxed{\;\langle H^2\rangle-\langle H\rangle^2=T^2C_V\;}$$
   <p>È notevole per due ragioni. Primo, lega una <i>fluttuazione</i> (la varianza dell&rsquo;energia, una proprietà statistica dell&rsquo;equilibrio) a una <i>risposta</i> (il calore specifico, che misura quanta energia serve per scaldare il sistema): è un teorema di fluttuazione-dissipazione in forma elementare, e ci torniamo nella tappa 05. Secondo, siccome $C_V$ è una grandezza estensiva ($C_V\propto N$), questa formula è già la chiave dell&rsquo;equivalenza degli insiemi, che dimostriamo nella prossima tappa.</p>`}
  ]},
  {t:'prosa', title:'Il conto sul gas ideale, fino ai numeri', tag:'costruzione', html:R`
  <p>Verifichiamo la macchina su un caso dove tutto si calcola. Per il gas ideale monoatomico $\log Z=\text{cost}-\tfrac{3N}{2}\log\beta+N\log V$, e la sola parte che dipende da $\beta$ dà la prima derivata $\partial_\beta\log Z=-\dfrac{3N}{2\beta}$, quindi l&rsquo;energia media è $E=-\partial_\beta\log Z=\dfrac{3N}{2\beta}=\tfrac32 NT$ (equipartizione). La <b>varianza</b> è la derivata seconda: derivando ancora $-\tfrac{3N}{2}\log\beta$ due volte si trova</p>
  $$\langle H^2\rangle-\langle H\rangle^2=\frac{\partial^2\log Z}{\partial\beta^2}=\frac{\partial}{\partial\beta}\!\left(-\frac{3N}{2\beta}\right)=\dfrac{3N}{2\beta^2}=\frac32 NT^2.$$
  <p>Controllo incrociato con $T^2C_V$: da $E=\tfrac32 NT$ il calore specifico è $C_V=\dfrac{\partial E}{\partial T}=\tfrac32 N$, dunque $T^2C_V=\tfrac32 NT^2$. I due conti coincidono: la varianza calcolata come curvatura di $\log Z$ è la stessa che si ottiene da $T^2C_V$. La macchina è consistente, e abbiamo in mano il numero che serve per stimare quanto fluttua davvero l&rsquo;energia.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Perché la varianza dell&rsquo;energia è la derivata <i>seconda</i> di $\log Z$, e non la prima?`,
    a:R`Perché la prima derivata di $\log Z$ dà già la media, $\langle H\rangle=-\partial_\beta\log Z$: derivando una funzione generatrice si «tira giù» un fattore $H$ per volta. La derivata seconda tira giù $H^2$ e, per la regola del prodotto, sottrae il quadrato della media, lasciando esattamente $\langle H^2\rangle-\langle H\rangle^2$. <b>$\log Z$ è la funzione generatrice dei cumulanti dell&rsquo;energia</b>: la derivata $n$-esima dà l&rsquo;$n$-esimo cumulante, e la varianza è il secondo. Il criterio invocato è la struttura di funzione generatrice del logaritmo della partizione.`}
  ]}
]},

/* ---------------- 02 · LA FLUTTUAZIONE RELATIVA E IL LIMITE TERMODINAMICO ---------------- */
{ num:'02', title:'La fluttuazione relativa, e il limite termodinamico', meta:'lo scarto quadratico medio come radice di N · l ampiezza relativa come uno su radice di N · perche l energia e di fatto certa',
  blocchi:[
  {t:'prosa', title:'Assoluta contro relativa', tag:'costruzione', html:R`
  <p>La varianza $T^2C_V$ cresce con $N$, quindi in senso assoluto l&rsquo;energia fluttua <i>sempre di più</i> per sistemi grandi: lo scarto quadratico medio è $\sigma_E=\sqrt{T^2C_V}$, e per il gas ideale $\sigma_E=\sqrt{3N/2\cdot T^2}=T\sqrt{3N/2}$, che va come $\sqrt N$. Ma la domanda fisica giusta non è quanto fluttua l&rsquo;energia in assoluto: è quanto fluttua <b>rispetto al suo valore</b>. E l&rsquo;energia stessa, essendo estensiva, cresce come $N$: $E=\tfrac32 NT\propto N$. Il rapporto fra i due andamenti è la <b>fluttuazione relativa</b>:</p>
  $$\frac{\sigma_E}{E}=\frac{\sqrt{T^2C_V}}{E}\propto\frac{\sqrt N}{N}=\frac{1}{\sqrt N}.$$
  <p>Sui numeri del gas ideale, dove $\sigma_E=T\sqrt{3N/2}$ ed $E=\tfrac32 NT$:</p>
  $$\frac{\sigma_E}{E}=\frac{T\sqrt{3N/2}}{\tfrac32 NT}=\frac{\sqrt{3N/2}}{3N/2}=\sqrt{\dfrac{2}{3N}}\sim\frac{1}{\sqrt N}.$$
  <p>La struttura è generale, non un accidente del gas ideale: <b>ogni volta che una grandezza è la somma di $N$ contributi con fluttuazioni indipendenti</b>, la sua media cresce come $N$ e la sua deviazione standard come $\sqrt N$. È la legge dei grandi numeri, la stessa concentrazione delle misure che governa la statistica elementare, letta qui sull&rsquo;energia di un sistema termodinamico.</p>`},
  {t:'prosa', title:'Cosa significano dieci alla meno dodici', tag:'costruzione', html:R`
  <p>Mettiamo i numeri di un sistema macroscopico. Con $N\sim10^{23}$ particelle, la fluttuazione relativa dell&rsquo;energia è $\sqrt{2/(3N)}$, cioè dell&rsquo;ordine di $10^{-12}$. Significa che, in un sistema a temperatura fissata, l&rsquo;energia — pur essendo <i>in linea di principio</i> libera di assumere qualunque valore — si scosta dal suo valor medio di una parte su mille miliardi. Nessuno strumento la vedrebbe muoversi. <b>L&rsquo;energia, benché non fissata, è di fatto determinata</b>: il sistema canonico «sceglie» con certezza pratica l&rsquo;energia $\langle H\rangle$, ed è la stessa che il microcanonico avrebbe imposto per decreto. Crisanti (pag. 201) chiude proprio così: «le fluttuazioni di energia relative diminuiscono all&rsquo;aumentare di $N$, il che significa che nello stesso limite le differenze tra ensemble microcanonico e canonico praticamente si annullano».</p>
  <p>Questo è il senso operativo del <b>limite termodinamico</b> $N\to\infty$: non è un limite matematico astratto, ma la condizione in cui le fluttuazioni relative svaniscono e le grandezze termodinamiche diventano nette. Solo in questo limite «temperatura» ed «energia» sono entrambe ben definite per lo stesso sistema — cosa che, per un sistema di poche particelle, non è vera: un sistema piccolo a contatto con un termostato ha una temperatura, ma la sua energia oscilla in modo visibile.</p>`},
  {t:'plot', title:'La distribuzione dell energia si stringe al crescere di N',
   intro:R`In ascissa l'energia per particella $E/N$ (unità arbitrarie), centrata sul valor medio. In ordinata la densità di probabilità $P(E)$ dell'energia nel canonico, per tre valori crescenti di $N$. Il centro resta fermo, la larghezza relativa va come $1/\sqrt N$.`,
   plots:[
    {kind:'func2d', xr:[0,2], yr:[0,1.1], height:320, ticks:6,
     title:'distribuzione dell energia P(E) per N crescente',
     curves:[
      {f:'exp(-6*pow(x-1,2))', col:'#5eead4', label:'N piccolo: energia larga, fluttua molto'},
      {f:'exp(-60*pow(x-1,2))', col:'#d8a13a', label:'N medio: la campana si stringe'},
      {f:'exp(-600*pow(x-1,2))', col:'#ff6b6b', label:'N grande: energia quasi certa'}
     ],
     xlabel:'E/N (energia per particella)', ylabel:'P(E) normalizzata'}
   ],
   leggi:R`<p><b>Il centro non si muove, la larghezza sì.</b> Tutte e tre le campane sono centrate sulla stessa energia media per particella — quella che anche il microcanonico avrebbe fissato. Ciò che cambia con $N$ è quanto stretta è la distribuzione attorno a quel centro: la larghezza <i>assoluta</i> in $E$ cresce come $\sqrt N$, ma quella <i>relativa</i>, cioè rapportata al valor medio $E\propto N$, cala come $1/\sqrt N$.</p>
   <p><b>La curva rossa ($N$ grande) è già quasi una delta.</b> Con $N$ dell&rsquo;ordine del numero di Avogadro la larghezza relativa $\sim10^{-12}$ rende la distribuzione indistinguibile da un valore secco. È questo il motivo per cui l&rsquo;energia, nel canonico, «non fluttua» in pratica pur essendo libera di farlo.</p>
   <p><b>La lettura da portare all&rsquo;orale.</b> La stessa figura, letta al contrario, dice perché il canonico e il microcanonico coincidono: la campana canonica di larghezza $1/\sqrt N$ tende, per $N\to\infty$, alla $\delta$ microcanonica centrata sullo stesso punto. Lo dimostriamo formalmente nella tappa 04; qui basta vederlo.</p>`}
]},

/* ---------------- 03 · LA STESSA STORIA DAL MICROCANONICO ---------------- */
{ num:'03', title:'La stessa storia dal microcanonico: la spartizione dell energia', meta:'sistema piu bagno · l integrazione di picco con i moltiplicatori di Lagrange · l espansione gaussiana dell entropia · la larghezza come radice di N',
  blocchi:[
  {t:'prosa', title:'Perche rifarlo dal lato opposto', tag:'grammatica', html:R`
  <p>Abbiamo trovato $\Delta E/E\sim1/\sqrt N$ derivando $\log Z$, cioè <i>dentro</i> il canonico. Ma se l&rsquo;equivalenza degli insiemi è vera, la stessa fluttuazione deve emergere anche partendo dal <b>microcanonico</b> — altrimenti i due insiemi darebbero risposte diverse proprio sulla quantità che decide la loro equivalenza. Le note di Grilli-Giardina (cap. 5) la ricavano così, ed è istruttivo perché mostra la fluttuazione come una proprietà della <b>spartizione dell&rsquo;energia</b> fra le parti di un sistema isolato, senza mai nominare $Z$. La conclusione sarà la stessa, e la coincidenza non è un caso: è l&rsquo;equivalenza in azione.</p>`},
  {t:'reveal', title:'L integrazione di picco, passo per passo', tag:'costruzione', steps:[
   {label:'Il sistema diviso in due, a energia totale fissata', body:R`
   <p>Prendiamo un sistema <b>isolato</b> di energia totale $E$ e dividiamolo idealmente in due parti macroscopiche, $1$ e $2$, con interazione di superficie trascurabile: $H=H_1+H_2$, dunque $E=E_1+E_2$ è vincolata. Il numero di microstati del composto con la parte $1$ a energia $E_1$ è il prodotto $\Gamma_1(E_1)\,\Gamma_2(E-E_1)$, e la molteplicità totale si ottiene sommando su tutte le spartizioni possibili di $E_1$:</p>
   $$\Gamma(E)=\int dE_1\,\Gamma_1(E_1)\,\Gamma_2(E-E_1)=\int dE_1\,e^{S_1(E_1)+S_2(E-E_1)},$$
   <p>avendo scritto $\Gamma_i=e^{S_i}$ con $S_i=\log\Gamma_i$. Il fattore $\delta(E-E_1-E_2)$ che impone il vincolo è ciò che rende la <span class="str" data-str="delta-di-dirac">delta di Dirac</span> lo strumento naturale del microcanonico. La probabilità che la parte $1$ abbia energia $E_1$ è dunque $P(E_1)\propto e^{S_1(E_1)+S_2(E-E_1)}$: una competizione fra due entropie, una crescente in $E_1$ e una decrescente.</p>`},
   {label:'Il massimo vincolato e i moltiplicatori di Lagrange', body:R`
   <p>Poiché $S_1+S_2\sim O(N)$, l&rsquo;integrale è dominato dal suo <b>massimo</b>: è l&rsquo;integrazione di picco. Cerchiamo il massimo di $S_1(E_1)+S_2(E_2)$ sotto il vincolo $E_1+E_2=E$, e i <span class="str" data-str="moltiplicatori-di-lagrange">moltiplicatori di Lagrange</span> danno la condizione stazionaria sulla lagrangiana $f=S_1(E_1)+S_2(E_2)+\beta(E-E_1-E_2)$:</p>
   $$\frac{\partial S_1}{\partial E_1}=\beta,\qquad \frac{\partial S_2}{\partial E_2}=\beta.$$
   <p>Ma $\partial S/\partial E=1/T$ è la definizione termodinamica di temperatura, quindi il massimo è nel punto dove le due parti hanno la <b>stessa temperatura</b>:</p>
   $$\beta=\dfrac{1}{T_1}=\dfrac{1}{T_2}.$$
   <p>È l&rsquo;equilibrio termico ottenuto per via puramente combinatoria: la spartizione dell&rsquo;energia più probabile è quella che uguaglia le temperature. Chiamiamo $\tilde E_1$ il valore che realizza questo massimo. Grilli-Giardina (pag. 32) svolge esattamente questo conto, sottolineando che il vincolo <i>obbliga</i> a usare i moltiplicatori.</p>`},
   {label:'L espansione gaussiana e la larghezza', body:R`
   <p>Sviluppiamo $S_1+S_2$ al secondo ordine attorno a $\tilde E_1$. Il termine lineare si cancella (siamo al massimo, e il vincolo lega $E_1+E_2$), e resta il termine quadratico con le curvature. Definendo $\dfrac{1}{\sigma_i^2}\equiv-\dfrac{\partial^2 S_i}{\partial E_i^2}$, la distribuzione è una <b>gaussiana</b>. Per il gas ideale $S_i=\tfrac{3N_i}{2}\log E_i+\text{cost}$, e le due derivate danno tutto: $\dfrac{\partial S_i}{\partial E_i}=\dfrac{3N_i}{2E_i}$ (che uguagliato a $1/T$ ridà $E_i=\tfrac32 N_iT$), e la curvatura</p>
   $$\frac{\partial^2 S_i}{\partial E_i^2}=-\dfrac{3N_i}{2E_i^2}\quad\Longrightarrow\quad \frac{1}{\sigma_i^2}=\frac{3N_i}{2E_i^2}=\frac{C_{Vi}}{T^2}.$$
   <p>L&rsquo;ultima uguaglianza — che $-\partial^2 S/\partial E^2=C_V/T^2$ — è la stessa relazione fluttuazione-risposta della tappa 01, vista dal lato dell&rsquo;entropia: la curvatura dell&rsquo;entropia <i>è</i> l&rsquo;inverso del calore specifico. La larghezza della distribuzione di $E_1$ combina le due curvature come due gaussiane convolute, $\dfrac{1}{\sigma^2}=\dfrac{1}{\sigma_1^2}+\dfrac{1}{\sigma_2^2}$, cioè $\sigma^2=\dfrac{\sigma_1^2\sigma_2^2}{\sigma_1^2+\sigma_2^2}$. Poiché $\sigma_i^2\sim O(N)$, si ha $\sigma\sim\sqrt N$: <b>ritroviamo esattamente $\Delta E/E\sim1/\sqrt N$, senza aver mai scritto $Z$</b>.</p>`}
  ]},
  {t:'plot', title:'La spartizione piu probabile: due entropie in competizione',
   intro:R`In ascissa l'energia $E_1$ della parte $1$ (unità arbitrarie), con energia totale $E=2$. L'entropia $S_1(E_1)$ cresce, $S_2(E-E_1)$ decresce, e la loro somma $S_1+S_2$ ha un massimo netto: quella è la spartizione più probabile, dove le due temperature si uguagliano.`,
   plots:[
    {kind:'func2d', xr:[0.1,1.9], yr:[-3,0.6], height:320, ticks:6,
     title:'S1 crescente, S2 decrescente, e la loro somma piccata',
     curves:[
      {f:'log(x)', col:'#5eead4', label:'S1(E1): entropia della parte 1, cresce'},
      {f:'log(2-x)', col:'#d8a13a', label:'S2(E - E1): entropia del resto, decresce'},
      {f:'log(x)+log(2-x)', col:'#ff6b6b', label:'S1 + S2: massimo alla spartizione di equilibrio'}
     ],
     xlabel:'E1 (energia della parte 1)', ylabel:'entropia (unita arbitrarie)'}
   ],
   leggi:R`<p><b>Due spinte opposte, un compromesso.</b> Dare più energia alla parte $1$ (verso destra) fa crescere la sua entropia $S_1$ — la curva verde — ma toglie energia al resto, e $S_2$ cala — la curva ocra. La molteplicità del composto è governata dalla <b>somma</b>, la curva rossa, che ha un massimo dove le due spinte si bilanciano.</p>
   <p><b>Quel massimo è l&rsquo;equilibrio termico.</b> Nel punto di massimo $\partial S_1/\partial E_1=\partial S_2/\partial E_2$, cioè $\beta=\dfrac{1}{T_1}=\dfrac{1}{T_2}$: le due parti hanno la stessa temperatura. Non è un&rsquo;ipotesi, è dove la maggior parte dei microstati vive — l&rsquo;equilibrio come conteggio, non come postulato.</p>
   <p><b>La curvatura del picco è la fluttuazione.</b> Quanto è appuntito quel massimo decide quanto fluttua la spartizione dell&rsquo;energia: più stretto il picco, meno l&rsquo;energia della parte $1$ si scosta dal suo valore di equilibrio. La curvatura è $-\partial^2(S_1+S_2)/\partial E_1^2=1/\sigma^2$, e siccome $\sigma\sim\sqrt N$, per un sistema macroscopico il picco è così stretto che la spartizione è di fatto certa — la stessa storia di $1/\sqrt N$, vista sull&rsquo;entropia.</p>`},
  {t:'prosa', title:'La coincidenza non e un caso: e l equivalenza', tag:'costruzione', html:R`
  <p>Osserviamo il caso decisivo. Se la parte $2$ è un <b>bagno</b> molto più grande della parte $1$ ($N_2\gg N_1$), allora $\sigma_2^2\gg\sigma_1^2$ e la convoluzione degenera: $\dfrac{1}{\sigma^2}=\dfrac{1}{\sigma_1^2}+\dfrac{1}{\sigma_2^2}\to\dfrac{1}{\sigma_1^2}$, cioè $\sigma^2\to\sigma_1^2=T^2C_{V1}$. La larghezza della distribuzione dell&rsquo;energia del piccolo sistema è governata dal <i>suo</i> calore specifico, ed è precisamente $\langle(\Delta E)^2\rangle=T^2C_V$: la varianza canonica della tappa 01. <b>Il microcanonico del composto, marginalizzato sul bagno, riproduce la fluttuazione canonica del sottosistema.</b> È l&rsquo;equivalenza degli insiemi vista da vicino: lo stesso numero, $T^2C_V$, esce dalla curvatura di $\log Z$ nel canonico e dalla curvatura di $S$ nel microcanonico. Nella prossima tappa lo eleviamo a teorema.</p>`}
]},

/* ---------------- 04 · L EQUIVALENZA DEGLI INSIEMI ---------------- */
{ num:'04', title:'L equivalenza degli insiemi: perche le due termodinamiche coincidono', meta:'la campana canonica che diventa una delta · la trasformata di Legendre invertibile · perche tutte le grandezze coincidono',
  blocchi:[
  {t:'prosa', title:'La campana che diventa una delta', tag:'costruzione', html:R`
  <p>Mettiamo insieme i pezzi. Nel canonico la distribuzione dell&rsquo;energia è il prodotto della densità degli stati per il peso di Boltzmann,</p>
  $$P(E)\propto\Omega(E)\,e^{-\beta E},$$
  <p>ed è una gaussiana centrata su $\langle H\rangle$ con larghezza $\sigma_E=\sqrt{T^2C_V}$, cioè con ampiezza relativa $1/\sqrt N$. Che sia normalizzata, e quanto pesa la sua coda, si controlla con l&rsquo;<span class="str" data-str="integrale-gaussiano">integrale gaussiano</span>: $\displaystyle\int e^{-(E-\langle H\rangle)^2/2\sigma^2}\,dE=\sqrt{2\pi\sigma^2}$. Nel limite termodinamico $N\to\infty$ la larghezza relativa svanisce, e la gaussiana <b>collassa</b> sulla sua media: $P(E)\to\delta(E-\langle H\rangle)$. Ma $\delta(E-\langle H\rangle)$ è esattamente la distribuzione microcanonica, che fissa l&rsquo;energia a un valore. Dunque, nel limite termodinamico, la distribuzione dell&rsquo;energia canonica <i>è</i> quella microcanonica, centrata sul valore che il microcanonico avrebbe imposto.</p>
  <p>La conseguenza è l&rsquo;<b>equivalenza degli insiemi</b>: ogni grandezza termodinamica — $E$, $S$, $P$, $C_V$, le equazioni di stato — calcolata nei due insiemi dà lo <b>stesso</b> risultato, perché è calcolata sulla stessa distribuzione di energia. La scelta fra canonico e microcanonico, allora, non è una scelta fisica ma di <b>comodità</b>: si sceglie il canonico perché sostituisce il vincolo $\delta(H-E)$ con il peso liscio $e^{-\beta H}$, e trasforma un&rsquo;integrazione con punto di sella in derivate di $\log Z$.</p>`},
  {t:'prosa', title:'Perche l invertibilita della trasformata di Legendre lo garantisce', tag:'costruzione', html:R`
  <p>C&rsquo;è un secondo modo di vedere la stessa cosa, più algebrico e più profondo, che non passa dal limite ma dalla struttura. Il legame fra i due insiemi è la <span class="str" data-str="trasformata-di-legendre">trasformata di Legendre</span> che scambia l&rsquo;energia con la temperatura: dal microcanonico si parte da $S(E)$ con $1/T=\partial S/\partial E$, e passando al canonico si ottiene $F(T)=E-TS$ con $S=-\partial F/\partial T$. La trasformata di Legendre è <b>invertibile</b> quando la funzione è convessa (o concava): da $F(T)$ si torna a $S(E)$ senza perdere alcuna informazione. Se due descrizioni contengono la stessa informazione, scritta in variabili coniugate diverse, allora <b>devono</b> dare la stessa termodinamica. L&rsquo;equivalenza degli insiemi è, da questo punto di vista, semplicemente il fatto che $S(E)$ e $F(T)$ sono trasformate di Legendre l&rsquo;una dell&rsquo;altra.</p>
  <p>Un esempio numerico per fissare l&rsquo;invertibilità, con $f(x)=x^2$: la variabile coniugata è $p=f'(x)=2x$, dunque $x=p/2$, e la trasformata vale $g(p)=f(x)-px=(p/2)^2-p(p/2)=-\tfrac{p^2}{4}$. Da $g$ si torna a $f$ trasformando di nuovo: l&rsquo;operazione è la sua stessa inversa (a meno di segni), ed è questa reversibilità che garantisce l&rsquo;equivalenza. Il segno che si ribalta — da $f$ convessa a $g$ concava — è lo stesso per cui $F$ ha un <i>minimo</i> all&rsquo;equilibrio a $T$ fissata dove $S$ ha un <i>massimo</i> a $E$ fissata. <b>Notare il legame con la tappa 03</b>: la Legendre è invertibile precisamente quando $\partial^2 S/\partial E^2\ne0$, cioè quando $\sigma^2$ è finito e la gaussiana ha larghezza ben definita — le due condizioni di equivalenza, la statistica e l&rsquo;algebrica, sono la stessa condizione.</p>`},
  {t:'plot', title:'Le due curve che si sovrappongono',
   intro:R`In ascissa l'energia $E$ (unità arbitrarie). La curva canonica è la distribuzione $P(E)$, una gaussiana di larghezza $1/\sqrt N$; la curva microcanonica è (schematicamente) una $\delta$ centrata sullo stesso valore, qui una gaussiana strettissima. Le due selezionano la stessa energia.`,
   plots:[
    {kind:'func2d', xr:[0,2], yr:[0,1.1], height:320, ticks:6,
     title:'canonica (larga) e microcanonica (delta), stesso centro',
     curves:[
      {f:'exp(-25*pow(x-1,2))', col:'#5eead4', label:'canonica P(E): gaussiana di larghezza 1 su radice N'},
      {f:'exp(-900*pow(x-1,2))', col:'#ff6b6b', label:'microcanonica: delta centrata sul valor medio, limite N infinito'}
     ],
     xlabel:'E (energia)', ylabel:'distribuzione (normalizzata a picco)'}
   ],
   leggi:R`<p><b>Stesso centro, larghezze diverse.</b> La curva verde è la distribuzione dell&rsquo;energia nel canonico: ha una larghezza finita, perché a temperatura fissata l&rsquo;energia fluttua. La curva rossa è la sua controparte microcanonica, che fissa l&rsquo;energia — una $\delta$, qui disegnata come una gaussiana strettissima. Entrambe sono centrate sullo stesso valore $\langle H\rangle$.</p>
   <p><b>Il limite termodinamico chiude la forbice.</b> Al crescere di $N$ la curva verde si stringe fino a sovrapporsi alla rossa: la distribuzione canonica <i>diventa</i> quella microcanonica. Poiché tutte le grandezze termodinamiche si leggono da questa distribuzione, e la distribuzione è la stessa, le grandezze coincidono — è l&rsquo;equivalenza degli insiemi in una figura.</p>
   <p><b>Dove la figura mente, ed è il punto della tappa 06.</b> Questa sovrapposizione richiede che la campana verde <i>si stringa</i>, cioè che $\sigma_E/E\to0$. Se il calore specifico diverge, o se l&rsquo;energia non è additiva, la campana non si stringe — e le due curve restano diverse. Lì l&rsquo;equivalenza si rompe.</p>`}
]},

/* ---------------- 05 · LA FLUTTUAZIONE E UNA SUSCETTIVITA ---------------- */
{ num:'05', title:'La lettura generale: la fluttuazione di una grandezza e una suscettivita', meta:'il principio di Boltzmann-Einstein · fluttuazione uguale derivata della coniugata · energia e calore specifico, densita e compressibilita, magnetizzazione e suscettivita',
  blocchi:[
  {t:'prosa', title:'La regola dietro T quadro C_V', tag:'costruzione', html:R`
  <p>La relazione $\langle H^2\rangle-\langle H\rangle^2=T^2C_V$ non è un fatto isolato dell&rsquo;energia: è un caso di una regola generale, e riconoscerla è ciò che trasforma un conto in comprensione. La regola: <b>la varianza della fluttuazione di una grandezza è proporzionale alla derivata della sua variabile coniugata — cioè a una suscettività, o funzione di risposta.</b> L&rsquo;energia è coniugata a $\beta$, e la sua varianza è $\partial_\beta^2\log Z$, che è la risposta $C_V$; il numero di particelle è coniugato al potenziale chimico $\mu$, e la sua varianza è la compressibilità; la magnetizzazione è coniugata al campo $B$, e la sua varianza è la suscettività magnetica. Falcioni-Vulpiani (par. 5.3) lo enunciano esattamente così: «la varianza della fluttuazione di una data quantità è sempre proporzionale a un&rsquo;opportuna funzione di risposta».</p>
  <p>La cornice unificante è il <b>principio di Boltzmann-Einstein</b>. La probabilità di una fluttuazione macroscopica $\{\alpha_j\}$ attorno all&rsquo;equilibrio è $p(\alpha)\propto e^{\delta S(\alpha)/k_B}$, dove $\delta S$ è la variazione di entropia (più in generale, del potenziale termodinamico opportuno). Sviluppando $\delta S$ al secondo ordine attorno ai valori d&rsquo;equilibrio, $\delta S\simeq-\tfrac12\sum_{ij}\delta\alpha_i A_{ij}\delta\alpha_j$ con $A_{ij}=-\partial^2 S/\partial\alpha_i\partial\alpha_j$, si ottiene una gaussiana multivariata e</p>
  $$\langle\delta\alpha_i\,\delta\alpha_j\rangle=k_B\big(A^{-1}\big)_{ij}.$$
  <p>Le fluttuazioni sono l&rsquo;inversa della matrice delle curvature dell&rsquo;entropia — è la stessa struttura vista nella tappa 03, ora per un numero qualsiasi di variabili. E $A$ deve essere definita positiva: la differenza di entropia rispetto all&rsquo;equilibrio è negativa, cioè l&rsquo;equilibrio è un massimo di $S$. È la <b>stabilità termodinamica</b> scritta come positività delle fluttuazioni.</p>`},
  {t:'prosa', title:'Tre esempi, tre suscettivita', tag:'costruzione', html:R`
  <p><b>Energia e calore specifico.</b> È il caso già visto, che in convenzione $k_B$ esplicito (Falcioni-Vulpiani, eq. 5.37) si scrive $\langle(E-\langle E\rangle)^2\rangle=Nc_Vk_BT^2$: identico al nostro $T^2C_V$ con $C_V=Nc_V$ e $k_B=1$. La suscettività è $c_V=(\partial\langle E\rangle/\partial T)/N$.</p>
  <p><b>Densità e compressibilità.</b> Nel gran canonico, dove il numero di particelle fluttua, Crisanti (pag. 220) ricava $\langle(\Delta N)^2\rangle=\bar N T\kappa_T/v$, con $\kappa_T$ la compressibilità isotermica e $v=V/N$ il volume specifico. La suscettività, qui, è la compressibilità: quanto il volume risponde a una variazione di pressione. La struttura è identica a quella dell&rsquo;energia — «questa relazione è simile a quella trovata per il canonico», scrive Crisanti — e mostra che le fluttuazioni di densità sono trascurabili nel limite termodinamico purché $\kappa_T$ sia finita.</p>
  <p><b>Magnetizzazione e suscettività magnetica.</b> Per un sistema di spin, Falcioni-Vulpiani (eq. 5.40) danno $\langle(\delta m)^2\rangle=k_BT\chi/N$, con $\chi=\partial\langle m\rangle/\partial B$ la suscettività magnetica per particella. Di nuovo: la varianza della magnetizzazione <i>è</i> la sua risposta al campo. Concretamente, per un singolo spin a due livelli $\pm\varepsilon$ con partizione $Z_1=2\cosh(\beta\varepsilon)$, la fluttuazione di energia si legge derivando $\log Z_1$: la prima derivata dà $\partial_\beta\log Z_1=\varepsilon\tanh(\beta\varepsilon)$ (l&rsquo;energia media, a meno del segno), la seconda dà la varianza</p>
  $$\langle(\Delta E)^2\rangle_{\text{spin}}=\frac{\partial^2\log Z_1}{\partial\beta^2}=\dfrac{\varepsilon^2}{\cosh^2(\beta\varepsilon)},$$
  <p>che è massima a $\beta\varepsilon\sim1$ e svanisce nei due limiti — la firma di uno spettro limitato, che ritroviamo negli esercizi come anomalia di Schottky.</p>`},
  {t:'plot', title:'Fluttuazione e risposta sono la stessa curva',
   intro:R`In ascissa la temperatura $T$ in unità di $\varepsilon$, per un sistema a due livelli. In ordinata, sovrapposte, la varianza di energia per spin $\langle(\Delta E)^2\rangle=\varepsilon^2/\cosh^2(\beta\varepsilon)$ e il calore specifico $c_V=\langle(\Delta E)^2\rangle/T^2$. Sono lo stesso oggetto, legate da $1/T^2$.`,
   plots:[
    {kind:'func2d', xr:[0.1,3], yr:[0,1.1], height:320, ticks:6,
     title:'varianza di energia e calore specifico di un sistema a due livelli',
     curves:[
      {f:'1/pow(cosh(1/x),2)', col:'#5eead4', label:'varianza di energia = 1 su cosh quadro(1 su T)'},
      {f:'pow(1/x,2)/pow(cosh(1/x),2)', col:'#ff6b6b', label:'calore specifico c_V = varianza su T quadro (Schottky)'}
     ],
     xlabel:'T (in unita di epsilon)', ylabel:'ampiezza (unita arbitrarie)'}
   ],
   leggi:R`<p><b>La verde è una fluttuazione, la rossa una risposta — e sono legate.</b> La curva verde è la varianza dell&rsquo;energia di uno spin: cresce da zero (a $T$ bassa i due livelli sono congelati sul fondamentale, niente fluttuazioni), raggiunge un massimo quando $T\sim\varepsilon$ e i due livelli sono quasi equipopolati, poi cala (a $T$ alta sono saturi ed equipopolati, la fluttuazione si spegne).</p>
   <p><b>La rossa è la stessa curva divisa per $T^2$</b>: è il calore specifico, con il caratteristico picco dell&rsquo;<b>anomalia di Schottky</b>. Che le due curve abbiano la stessa forma non è una coincidenza grafica: è la relazione $\langle(\Delta E)^2\rangle=T^2c_V$ letta punto per punto. Misurare come il sistema <i>risponde</i> al calore (la rossa) equivale a misurare quanto la sua energia <i>fluttua</i> all&rsquo;equilibrio (la verde).</p>
   <p><b>Il senso profondo — il primo assaggio di fluttuazione-dissipazione.</b> Non serve perturbare il sistema per conoscerne la risposta: basta guardarlo fluttuare all&rsquo;equilibrio. È l&rsquo;idea che, portata fuori dall&rsquo;equilibrio, diventa il teorema di fluttuazione-dissipazione di Kubo, e che storicamente nasce dalla relazione di Einstein sul moto browniano — la stessa che lega la diffusione alla mobilità.</p>`}
]},

/* ---------------- 06 · DOVE L EQUIVALENZA SI ROMPE ---------------- */
{ num:'06', title:'Dove l equivalenza si rompe: transizioni, lungo raggio, calori specifici negativi', meta:'la condizione nascosta C_V positivo e additivita · le transizioni di fase · i sistemi gravitazionali e il calore specifico negativo · perche il canonico non lo puo vedere',
  blocchi:[
  {t:'prosa', title:'Le due ipotesi che abbiamo usato senza dirlo', tag:'costruzione', html:R`
  <p>Tutta la dimostrazione dell&rsquo;equivalenza poggia su due ipotesi che finora sono rimaste implicite, ed è saperle nominare che separa, all&rsquo;orale, chi ha capito da chi ha imparato il conto. Primo: <b>il calore specifico è positivo</b>, $C_V\gt0$, altrimenti $\sigma^2=T^2C_V$ non è una varianza e la gaussiana non ha senso. Secondo: <b>l&rsquo;energia è additiva</b>, cioè $E\propto N$ e $C_V\propto N$, il che richiede interazioni a <i>corto raggio</i> — solo così la fluttuazione relativa va come $1/\sqrt N$ e la campana si stringe. Quando una di queste due cade, la campana di $P(E)$ non si stringe più, e i due insiemi <b>smettono di coincidere</b>.</p>`},
  {t:'prosa', title:'Le transizioni di fase', tag:'costruzione', html:R`
  <p>Il primo luogo dove l&rsquo;equivalenza vacilla è la <b>transizione di fase</b>. Vicino a una transizione continua il calore specifico $C_V$ può <b>divergere</b>, e con esso la varianza dell&rsquo;energia $T^2C_V$: la lunghezza di correlazione diverge, le fluttuazioni diventano macroscopiche, e $P(E)$ non è più una gaussiana stretta. La compressibilità dà il segnale gemello nel gran canonico: Crisanti (pag. 220) definisce $\kappa_T=-\dfrac1V\Big(\dfrac{\partial V}{\partial P}\Big)_T$ e osserva che in condizioni stabili è positiva, ma <b>diventa negativa a una transizione di fase del primo ordine</b> — è la zona min-max dell&rsquo;isoterma di Van der Waals, dove $\kappa_T\lt0$ segnala l&rsquo;instabilità che la costruzione di Maxwell (la retta a aree uguali) corregge. Lì le fluttuazioni di densità non sono più trascurabili, e le grandezze calcolate in insiemi diversi possono differire. È il regime in cui la meccanica statistica diventa <b>teoria dei fenomeni critici</b>, e la comodità del canonico lascia il posto alla sottigliezza.</p>`},
  {t:'prosa', title:'Il lungo raggio e i calori specifici negativi', tag:'regola operativa', html:R`
  <p>Il secondo luogo, più radicale, è quello dei sistemi con <b>interazioni a lungo raggio</b>, dove l&rsquo;energia <i>non è additiva</i>. L&rsquo;esempio principe è gravitazionale — una stella, un ammasso globulare, una galassia. Per un sistema autogravitante vale il teorema del viriale $2K+U=0$, quindi l&rsquo;energia totale è $E=K+U=-K$; ma l&rsquo;energia cinetica media è la temperatura ($K\propto T$), dunque $E=-cT$ con $c\gt0$, e il calore specifico è</p>
  $$C_V=\frac{dE}{dT}=-c\lt0.$$
  <p>Un <b>calore specifico negativo</b>: la stella, cedendo energia, si <i>scalda</i> invece di raffreddarsi. È il motore dell&rsquo;evoluzione stellare e della catastrofe gravotermica, ed è impossibile per un sistema ordinario. Ora il punto cruciale per l&rsquo;equivalenza: <b>il canonico non può dare $C_V\lt0$</b>. Nel canonico, infatti, $C_V=\dfrac{\langle(\Delta E)^2\rangle}{T^2}\ge 0$ sempre, perché una varianza non è mai negativa. Dunque un sistema con $C_V\lt0$ <i>esiste</i> nel microcanonico ma è <b>invisibile</b> al canonico: i due insiemi rispondono diverso, e non c&rsquo;è alcun limite $N\to\infty$ che li riconcili. È l&rsquo;<b>inequivalenza degli insiemi</b>, e non è una patologia matematica: è la fisica dei sistemi non additivi, e tocca da vicino l&rsquo;astrofisica e la meccanica statistica dei sistemi complessi.</p>`},
  {t:'plot', title:'Il calore specifico che diverge, e la fluttuazione con lui',
   intro:R`In ascissa la temperatura $T$, con una transizione a $T_c=1$. In ordinata il calore specifico $C_V(T)$ (che diverge a $T_c$) e la varianza di energia $\langle(\Delta E)^2\rangle=T^2C_V$, che diverge con lui. Dove la fluttuazione esplode, l'equivalenza degli insiemi si rompe.`,
   plots:[
    {kind:'func2d', xr:[0.2,1.8], yr:[0,4], height:320, ticks:6,
     title:'calore specifico e varianza di energia vicino a una transizione',
     curves:[
      {f:'0.05/(pow(x-1,2)+0.015)', col:'#5eead4', label:'C_V(T): diverge alla transizione T_c'},
      {f:'pow(x,2)*0.05/(pow(x-1,2)+0.015)', col:'#ff6b6b', label:'varianza T quadro C_V: diverge con C_V'}
     ],
     xlabel:'T (temperatura)', ylabel:'C_V e varianza (unita arbitrarie)'}
   ],
   leggi:R`<p><b>Il picco è una divergenza.</b> La curva verde è il calore specifico che, avvicinandosi alla temperatura critica $T_c$, cresce senza limite (qui regolarizzato per poterlo disegnare). Lontano da $T_c$ vale la storia delle tappe precedenti — $C_V$ finito, fluttuazioni piccole, insiemi equivalenti; a $T_c$ tutto cambia.</p>
   <p><b>La varianza esplode con il calore specifico.</b> La curva rossa è $\langle(\Delta E)^2\rangle=T^2C_V$: dove $C_V$ diverge, la varianza dell&rsquo;energia diverge. La fluttuazione relativa $\Delta E/E$ non va più come $1/\sqrt N$, la campana di $P(E)$ non si stringe, e la sovrapposizione fra curva canonica e microcanonica della tappa 04 non avviene più.</p>
   <p><b>La lettura da portare all&rsquo;orale.</b> La domanda che separa è: «gli insiemi sono <i>sempre</i> equivalenti?». La risposta corretta è no, e si nominano i tre luoghi: transizioni di fase (dove $C_V$ diverge), interazioni a lungo raggio (dove $E$ non è additiva), calori specifici negativi (che il canonico, essendo $C_V\propto$ una varianza, non può nemmeno rappresentare). L&rsquo;equivalenza è la regola nel limite termodinamico dei sistemi additivi e stabili — non un teorema universale.</p>`}
]},

/* ---------------- 07 · ESERCIZI ---------------- */
{ num:'07', title:'Esercizi — tocca a te', meta:'le fluttuazioni del gas ideale · il sistema a due livelli e Schottky · perche un sistema autogravitante non sta nel canonico',
  blocchi:[
  {t:'esercizio', title:'1 · Le fluttuazioni di energia del gas ideale',
   src:'il conto che rende legittimo tutto il resto: quantificare quanto fluttua l energia e perche non si vede',
   testo:R`Per $N$ particelle di gas ideale monoatomico a temperatura $T$, calcola la varianza dell'energia $\langle(\Delta E)^2\rangle$ derivando due volte $\log Z$, verifica che coincide con $T^2C_V$, e stima la fluttuazione relativa $\Delta E/E$ per $N\sim10^{23}$. Commenta perché l'energia, pur libera di fluttuare, è di fatto determinata.`,
   steps:[
    {label:'La varianza come derivata seconda', body:R`
    <p>Da $\log Z=\text{cost}-\tfrac{3N}{2}\log\beta+N\log V$, la parte dipendente da $\beta$ è $-\tfrac{3N}{2}\log\beta$. La prima derivata dà $\partial_\beta\log Z=-\tfrac{3N}{2\beta}$ (l&rsquo;energia $E=\tfrac{3N}{2\beta}=\tfrac32 NT$); la seconda dà la varianza,</p>
    $$\langle(\Delta E)^2\rangle=\frac{\partial^2\log Z}{\partial\beta^2}=\dfrac{3N}{2\beta^2}=\frac32 NT^2.$$
    <p>Controllo con $T^2C_V$: da $E=\tfrac32 NT$, $C_V=\tfrac32 N$, dunque $T^2C_V=\tfrac32 NT^2$. Coincidono. <b>Il criterio invocato è la relazione fluttuazione-risposta $\langle(\Delta E)^2\rangle=\partial_\beta^2\log Z=T^2C_V$.</b></p>`},
    {label:'La fluttuazione relativa e la sua invisibilita', body:R`
    <p>Lo scarto quadratico medio è $\sigma_E=\sqrt{\tfrac32 NT^2}=T\sqrt{3N/2}$, e rapportato all&rsquo;energia $E=\tfrac32 NT$ dà la fluttuazione relativa</p>
    $$\frac{\sigma_E}{E}=\frac{\sqrt{3N/2}}{3N/2}=\sqrt{\dfrac{2}{3N}}.$$
    <p>Con $N\sim10^{23}$ vale circa $10^{-12}$. <b>Interpretazione</b>: a temperatura fissata l&rsquo;energia è libera di assumere qualunque valore, ma la probabilità che si scosti dal valor medio più di una parte su mille miliardi è praticamente nulla. È il senso quantitativo dell&rsquo;equivalenza col microcanonico: il canonico «sceglie» la stessa energia che il microcanonico impone. Il criterio è la legge dei grandi numeri — la deviazione standard di una somma di $N$ termini indipendenti va come $\sqrt N$, la somma come $N$.</p>`}
   ]},
  {t:'esercizio', title:'2 · Il sistema a due livelli e l anomalia di Schottky',
   src:'lo spettro limitato: la varianza ha un massimo, e con lei il calore specifico',
   testo:R`$N$ spin indipendenti e distinguibili hanno ciascuno due livelli $\pm\varepsilon$. Calcola la varianza dell'energia di singolo spin derivando $\log Z_1$, ricava il calore specifico $C_V$, e mostra che ha un massimo a temperatura intermedia e va a zero nei due limiti. Perché questo comportamento è impossibile per un grado di libertà continuo?`,
   steps:[
    {label:'La varianza dallo spettro discreto', body:R`
    <p>La partizione di singolo spin è $Z_1=e^{\beta\varepsilon}+e^{-\beta\varepsilon}=2\cosh(\beta\varepsilon)$. L&rsquo;energia media è $\langle E\rangle_1=-\partial_\beta\log Z_1=-\varepsilon\tanh(\beta\varepsilon)$, e la varianza è la derivata seconda:</p>
    $$\langle(\Delta E)^2\rangle_1=\frac{\partial^2\log Z_1}{\partial\beta^2}=\dfrac{\varepsilon^2}{\cosh^2(\beta\varepsilon)}.$$
    <p>È massima per $\beta\varepsilon\sim1$ e tende a zero sia per $\beta\varepsilon\to0$ (livelli equipopolati, alta $T$) sia per $\beta\varepsilon\to\infty$ (tutti sul fondamentale, bassa $T$).</p>`},
    {label:'Il calore specifico e il picco di Schottky', body:R`
    <p>Il calore specifico segue dalla relazione fluttuazione-risposta, $C_V=\langle(\Delta E)^2\rangle/T^2$ per spin, che per $N$ spin dà $C_V=N\dfrac{(\beta\varepsilon)^2}{\cosh^2(\beta\varepsilon)}$. In termini di $x=\beta\varepsilon$ ha la forma $\propto x^2/\cosh^2 x$, che <b>va a zero in entrambi i limiti</b> e ha un massimo a $x\sim1$: è l&rsquo;<b>anomalia di Schottky</b>. Nel limite di alta temperatura la funzione di Einstein associata soddisfa $\dfrac{x^2 e^x}{(e^x-1)^2}\to 1$ per $x\to0$, il valore di equipartizione. <b>Il criterio da riconoscere</b>: uno spettro <i>limitato superiormente</i> produce sempre un $C_V$ con un massimo e mai la costante di equipartizione, perché un sistema che non può assorbire energia oltre un tetto smette di scaldarsi. Un grado di libertà continuo, con spettro illimitato, non ha questo tetto e dà $C_V$ costante (o crescente).</p>`}
   ]},
  {t:'esercizio', title:'3 · Perche un sistema autogravitante non sta nel canonico',
   src:'la domanda d orale sull inequivalenza: distinguere cio che il microcanonico vede e il canonico no',
   testo:R`Usando il teorema del viriale, mostra che un sistema autogravitante ha calore specifico negativo. Poi dimostra che nel canonico $C_V\ge0$ sempre. Concludi discutendo perché per questo sistema microcanonico e canonico NON sono equivalenti, e quale dei due è quello fisicamente corretto.`,
   steps:[
    {label:'Il calore specifico negativo dal viriale', body:R`
    <p>Per un sistema autogravitante all&rsquo;equilibrio vale il teorema del viriale $2K+U=0$, con $K$ energia cinetica e $U$ potenziale (negativa). L&rsquo;energia totale è $E=K+U=K-2K=-K$. Ma l&rsquo;energia cinetica media è proporzionale alla temperatura, $K=cT$ con $c\gt0$ (equipartizione), quindi $E=-cT$ e</p>
    $$C_V=\frac{dE}{dT}=-c\lt 0.$$
    <p>Il sistema, cedendo energia (per esempio irraggiando), <i>aumenta</i> la sua temperatura: è la catastrofe gravotermica, il motore che accende le stelle. Il criterio è il teorema del viriale applicato a un potenziale a lungo raggio non additivo.</p>`},
    {label:'Perche il canonico non lo vede, e chi ha ragione', body:R`
    <p>Nel canonico il calore specifico è una varianza divisa per $T^2$: $C_V=\dfrac{\langle(\Delta E)^2\rangle}{T^2}\ge 0$, perché $\langle(\Delta E)^2\rangle=\langle H^2\rangle-\langle H\rangle^2$ non è mai negativa. Dunque il canonico <b>non può rappresentare</b> uno stato con $C_V\lt0$: matematicamente gli è precluso. Il microcanonico invece sì, perché fissa l&rsquo;energia e non richiede alcuna varianza positiva. Conclusione: per un sistema con calore specifico negativo i due insiemi danno risposte diverse — <b>non sono equivalenti</b> — e quello fisicamente corretto è il <b>microcanonico</b>, perché descrive il sistema isolato (la stella non è a contatto con un termostato infinito). <b>Il criterio invocato</b> è che l&rsquo;equivalenza degli insiemi richiede additività dell&rsquo;energia e $C_V\gt0$; violata l&rsquo;additività, cade l&rsquo;equivalenza, e la scelta dell&rsquo;insieme torna a essere una scelta fisica.</p>`}
   ]}
]},

{ num:'08', title:'Il senso, e le rotte', meta:'cosa lascia in mano, e dove le fluttuazioni diventano il cuore della fisica',
  blocchi:[
  {t:'prosa', title:'Cosa portarsi via', tag:'sintesi', html:R`
  <p><b>Il punto.</b> Risolvere in canonico un problema posto a energia fissata è legittimo perché, nel limite termodinamico, i due insiemi danno la stessa termodinamica — e la ragione è che l&rsquo;energia, pur libera di fluttuare nel canonico, ha una fluttuazione relativa $\Delta E/E\sim1/\sqrt N$ che la rende di fatto certa. Il tutto poggia su un solo conto: la varianza dell&rsquo;energia è la derivata seconda di $\log Z$, e vale $T^2C_V$. Da lì la fluttuazione relativa, l&rsquo;equivalenza degli insiemi come collasso della campana $P(E)$ sulla $\delta$ microcanonica, e la lettura generale — la fluttuazione di una grandezza è la derivata della sua coniugata, cioè una suscettività: energia/calore specifico, densità/compressibilità, magnetizzazione/suscettività magnetica.</p>
  <p><b>Che cosa ricordare, in ordine di durata.</b> La relazione centrale $\langle H^2\rangle-\langle H\rangle^2=\partial_\beta^2\log Z=T^2C_V$, e il fatto che $\log Z$ è la funzione generatrice dei cumulanti dell&rsquo;energia. Che $\Delta E/E\sim1/\sqrt N$ è la legge dei grandi numeri sull&rsquo;energia, e che è questo a far coincidere canonico e microcanonico. Che l&rsquo;equivalenza si legge anche come invertibilità della trasformata di Legendre fra $S(E)$ e $F(T)$. E soprattutto <b>dove l&rsquo;equivalenza si rompe</b>: transizioni di fase ($C_V$ diverge), interazioni a lungo raggio ($E$ non additiva), calori specifici negativi (che il canonico, avendo $C_V\ge0$ per costruzione, non può nemmeno vedere). <b>Di un movimento sottile, ciò che resta è: la fluttuazione è la curvatura, e la curvatura è la risposta.</b></p>`},

   oggetto:R`<b>La fluttuazione come suscettività</b>: la varianza di una grandezza all&rsquo;equilibrio è la derivata della sua variabile coniugata, cioè una funzione di risposta.`,
   rotte:[

   domanda:R`Abbiamo dimostrato che la distribuzione dell&rsquo;energia è una gaussiana stretta di larghezza $1/\sqrt N$, usando l&rsquo;espansione al secondo ordine dell&rsquo;entropia. <b>Domanda che porti avanti:</b> quella gaussiana è solo l&rsquo;<i>approssimazione</i> vicino al picco. La forma esatta della distribuzione, sulle code lontane dalla media, non è gaussiana — è governata da una <b>funzione tasso</b> $I(e)$ tale che $P(E)\sim e^{-N I(E/N)}$, di cui la gaussiana è lo sviluppo quadratico attorno al minimo. È la teoria delle grandi deviazioni, e la domanda «qual è la funzione tasso di questo sistema?» è più fine di «quanto vale la varianza?»: contiene tutta la termodinamica, comprese le transizioni di fase, che appaiono come <b>non-analiticità</b> di $I(e)$. Il fatto che $I$ sia convessa è l&rsquo;equivalenza degli insiemi; dove $I$ perde la convessità, gli insiemi divergono — ed è lì che questo movimento finisce e comincia la fisica dei sistemi complessi.`}

function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}

}

  SEEN.add(num); saveSeen(SEEN);

  var m=document.getElementById('main'); m.innerHTML='';

  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    /* DUE SCHEMI, NON UNO — scoperto il 2026-10-06 provando le pagine vive. I movimenti
       scritti per primi (em-01..03, me-10b, i collaudi di gd-01..09 e di quattro em)
       usano una forma piu' semplice: `reveal` e `prolessi` con un solo `html`,
       `esercizio` e `collaudo` con `html` + `sol`. Il renderer ne conosceva una sola e
       chiamava `steps.forEach` su `undefined`: TypeError, e la tappa si fermava li' —
       62 blocchi in 17 movimenti su 74. Non si riscrive il contenuto per far contento
       il renderer: e' il renderer che deve leggere cio' che c'e'.
       E in fondo un ramo che NON muore: uno schema nuovo di domani deve far vedere un
       avviso in quella sezione, non spegnere la pagina sotto di se'. */
    try{
      if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
      else if(b.t==='prolessi') m.appendChild(b.rotte ? sectionProlessi(b)
                                   : sectionProsa(b.title,'prolessi',b.html));
      else if(b.t==='reveal')m.appendChild(b.steps ? sectionReveal(b.title,b.tag,b.steps)
                                   : sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='esercizio') m.appendChild(b.steps ? sectionEsercizio(b)
                                   : sectionSvelabile(b.title,'esercizio',b.html,b.sol));
      else if(b.t==='collaudo')  m.appendChild(b.items ? sectionCollaudo(b.title,b.items)
                                   : sectionSvelabile(b.title,'provi, poi riveli',b.html,b.sol));
      else if(b.t==='plot')      m.appendChild(sectionPlot(b));
      else m.appendChild(sectionProsa(b.title||'(blocco)', 'tipo sconosciuto: '+b.t,
                                      b.html||''));
    }catch(err){
      var avv=document.createElement('section'); avv.className='section';
      avv.innerHTML='<h3>'+(b.title||'(blocco)')+'<span class="tag">non reso</span></h3>'
        +'<p style="color:#ff6b6b">Questo blocco non si &egrave; potuto rendere ('
        +b.t+': '+err.message+'). Il resto della tappa continua sotto.</p>';
      m.appendChild(avv);
    }
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* I POP-UP DEGLI STRUMENTI. `cablaStrumenti` esisteva dal 18-09 e non la chiamava
     nessuno: i 229 rimandi del percorso erano <span> senza handler, e il clic non
     faceva niente. Nessun controllo poteva vederlo — la sintassi era valida, le schede
     c'erano tutte, le formule rendevano: il guasto esisteva solo a pagina viva. Qui, e
     dopo ogni inserimento successivo, perche' la tappa si rimonta da capo a ogni
     cambio e gli handler vanno riattaccati al DOM nuovo. */
  cablaStrumenti(m);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}
