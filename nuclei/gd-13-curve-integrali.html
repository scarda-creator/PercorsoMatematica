/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un
   rimando scritto nella prosa:

       <span class="str" data-str="serie-geometrica">la serie geometrica</span>

   Le schede citate da questo nucleo sono cucite qui sotto dal montaggio
   (assembla-nucleo.js): la pagina resta autosufficiente — niente fetch,
   niente sottocartelle da pubblicare — e un rimando a una scheda che non
   esiste FERMA la costruzione invece di arrivare in pagina rotto.
   Apertura: lo stesso gesto del collaudo (si clicca, il pannello compare,
   si typeset una volta sola), portato dentro la frase.
   =================================================================== */
var CORSO = 'geometria-differenziale';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["campo-vettoriale"] = {"nome":"Campo vettoriale","riga":"Una funzione che a ogni punto dello spazio associa un vettore, scritta $\\mathbf{F}(x,y,z)=F_x\\,\\hat{\\imath}+F_y\\,\\hat{\\jmath}+F_z\\,\\hat{k}$ con le tre componenti funzioni del punto.","serve":"È il modo di dire «c'è qualcosa in ogni punto dello spazio, e ha una direzione». Serve perché permette di smettere di ragionare su coppie di oggetti che si attraggono a distanza e di ragionare su una proprietà dello spazio: la sorgente prepara il campo, e chi arriva dopo sente solo ciò che trova dove si trova.","esempio":"Il campo di una carica puntiforme $q$ nell'origine è $\\mathbf{E}=\\dfrac{q}{4\\pi\\varepsilon_0 r^{2}}\\hat{r}$: la direzione è radiale, il modulo dipende solo dalla distanza. Con $q=1$ e $4\\pi\\varepsilon_0=1$, nel punto $(3,4,0)$ si ha $r=5$, quindi il modulo vale $\\tfrac{1}{25}$ e il versore è $\\left(\\tfrac35,\\tfrac45,0\\right)$: la componente lungo $x$ è $\\tfrac{3}{125}$.","pieno":{"file":"04-campi-vettoriali.html","tappa":"00","come":"la trattazione completa, nel nucleo sui campi vettoriali di Analisi Vettoriale"},"qui":{"elettromagnetismo":{"serve":"È l'oggetto che l'intero corso studia: $\\mathbf{E}$ e $\\mathbf{B}$ sono campi vettoriali, e le quattro equazioni di Maxwell sono affermazioni su come le loro derivate spaziali si legano alle sorgenti. Tutto ciò che si impara dopo — flusso, circuitazione, divergenza, rotore — è un modo di interrogare un campo vettoriale.","esempio":"Per la carica puntiforme in $(3,4,0)$ con $q=1$ e $4\\pi\\varepsilon_0=1$: $r=5$, modulo $\\tfrac{1}{25}$, e la componente lungo $x$ vale $\\tfrac{3}{125}$. Le tre componenti non sono tre campi separati: ruotando gli assi si mescolano fra loro, ed è quello che rende $\\mathbf{E}$ un vettore e non una terna di numeri."}},"controllo":[{"tipo":"uguale","sinistra":"sqrt(3**2+4**2)","vale":"5","dove":"esempio","appare":"r=5"},{"tipo":"uguale","sinistra":"1/sqrt(3**2+4**2)**2","vale":"1/25","dove":"esempio","appare":"\\tfrac{1}{25}"},{"tipo":"uguale","sinistra":"(1/5**2)*(3/5)","vale":"3/125","dove":"esempio","appare":"\\tfrac{3}{125}"},{"tipo":"uguale","sinistra":"sqrt(3**2+4**2)","vale":"5","dove":"qui.elettromagnetismo.esempio","appare":"r=5"},{"tipo":"uguale","sinistra":"(1/5**2)*(3/5)","vale":"3/125","dove":"qui.elettromagnetismo.esempio","appare":"\\tfrac{3}{125}"}]};
STRUM["compattezza"] = {"nome":"Compattezza","riga":"Ogni ricoprimento aperto ammette un sottoricoprimento finito: è la proprietà che permette di passare da «vale vicino a ogni punto» a «vale su tutto», con un numero finito di passi.","serve":"È l'ipotesi che rende globali le conclusioni locali, ed è per questo che ricorre in ogni dimostrazione di geometria differenziale. In $\\mathbb{R}^n$ equivale a chiuso e limitato (Heine-Borel), ma su una varietà quell'equivalenza non si può usare come definizione, perché «limitato» richiede una distanza e una varietà non ne ha una privilegiata. La conseguenza che si usa più spesso è negativa: gli unici sottoinsiemi di $\\mathbb{R}^n$ che sono **insieme** aperti e compatti sono $\\emptyset$ e nient'altro — ed è l'argomento per cui una varietà compatta non può essere coperta da una sola carta.","esempio":"L'intervallo $(0,1)$ non è compatto, e si vede esibendo un ricoprimento senza sottoricoprimento finito: gli aperti $A_n=\\left(\\tfrac1n,1\\right)$ per $n\\ge2$ ricoprono $(0,1)$, perché ogni $x\\gt0$ sta in $A_n$ appena $\\tfrac1n\\lt x$, cioè appena $n\\gt1/x$. Ma una sottofamiglia finita $A_{n_1},\\dots,A_{n_k}$ ha un indice massimo $N$, quindi la sua unione è $\\left(\\tfrac1N,1\\right)$, e il punto $x=\\tfrac1{2N}$ resta fuori: è positivo, dunque sta in $(0,1)$, ed è minore di $\\tfrac1N$. Il conto che regge l'argomento è $\\lim_{n\\to\\infty}\\tfrac1n=0$: gli $A_n$ si avvicinano a coprire tutto, ma nessuno di essi contiene un intorno di $0$, e servirebbero tutti. Chiudendo l'intervallo, $[0,1]$ diventa compatto e quel ricoprimento smette di essere un ricoprimento — $0$ non sta in nessun $A_n$.","debito":"la dimostrazione del teorema di Heine-Borel e la teoria generale degli spazi compatti stanno fuori dal percorso: qui c'è l'uso che se ne fa. Nel corso di Diverio la compattezza entra come ipotesi (sfera, gruppi di Lie compatti) e come conclusione della locale compattezza delle varietà.","controllo":[{"tipo":"limite","espr":"1/n","var":"n","a":"oo","vale":"0","ipotesi":{"n":"positive"},"dove":"esempio","appare":"\\lim_{n\\to\\infty}\\tfrac1n=0"},{"tipo":"disuguaglianza","sinistra":"1/(2*N)","destra":"1/N","relazione":"<","ipotesi":{"N":"positive"},"dove":"esempio","appare":"minore di $\\tfrac1N$"}]};
STRUM["lipschitziana"] = {"nome":"Mappa lipschitziana","riga":"$|f(y)-f(x)|\\le L|y-x|$ con $L$ fisso: la mappa non può dilatare più di un fattore $L$, e quel fattore vale su tutta la scala, non solo nel limite infinitesimo.","serve":"È la forma quantitativa del controllo che la derivata dà solo puntualmente, ed è ciò che serve per stimare **volumi** invece che direzioni. Una mappa $C^1$ su un **compatto** è automaticamente lipschitziana con $L=\\max\\lVert df\\rVert$, per il teorema del valor medio applicato al segmento — e questa è la ragione per cui in geometria differenziale le stime si fanno sempre dopo aver ristretto a un cubo chiuso. La conseguenza che si usa è geometrica: un insieme di diametro $d$ va in un insieme di diametro $\\le Ld$, dunque un cubo di lato $\\ell$ finisce dentro un cubo di lato $L\\sqrt{n}\\,\\ell$, e i volumi si moltiplicano al più per $(L\\sqrt{n})^{n}$. Da qui segue in una riga che **una mappa lipschitziana manda insiemi di misura nulla in insiemi di misura nulla**: ricoprili con cubi di volume totale $\\varepsilon$, le immagini stanno in cubi di volume totale $\\le(L\\sqrt{n})^{n}\\varepsilon$, e la costante non dipende da $\\varepsilon$. Per mappe solo continue l'implicazione è falsa, e il controesempio è la curva di Peano.","esempio":"$f(x)=x^{2}$ su $[0,2]$ è lipschitziana e la costante si legge dalla derivata: $f'(x)=2x$, massima in $x=2$, dove vale $4$. Quindi $L=4$, e infatti $|y^{2}-x^{2}|=|y+x|\\,|y-x|\\le4|y-x|$ per $x,y\\in[0,2]$ — la fattorizzazione mostra che è proprio la stima del valor medio, con $|y+x|$ al posto di $|f'(\\xi)|$. La stessa $f$ su tutto $\\mathbb{R}$ **non** è lipschitziana: $|y+x|$ non è limitato, e nessuna costante regge. È il caso che spiega perché la lipschitzianità è una proprietà **sui compatti** e non una proprietà della formula: la liscezza è locale, la costante è globale, e il compatto è il ponte fra le due.","debito":"la teoria di Rademacher (una funzione lipschitziana è differenziabile quasi ovunque) e le funzioni assolutamente continue stanno fuori dal percorso: qui serve solo la direzione facile, da $C^1$ sul compatto a lipschitziana.","controllo":[{"tipo":"derivata","espr":"x**2","rispetto":["x"],"vale":"2*x","ipotesi":{"x":"positive"},"dove":"esempio","appare":"f'(x)=2x"},{"tipo":"numero","espr":"2*2","vale":"4","dove":"esempio","appare":"vale $4$"},{"tipo":"uguale","sinistra":"y**2-x**2","vale":"(y+x)*(y-x)","dove":"esempio","appare":"|y+x|\\,|y-x|"}]};

}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');

/* ---------------- 00 · DI COSA PARLA QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Di cosa parla questo movimento', meta:'Geometria Differenziale · voci G.25, R.7 · il campo diventa un moto',
  blocchi:[
  {t:'prosa', title:'Il cambio di sguardo', tag:'architettura', html:R`
  <p>Fin qui un <span class="str" data-str="campo-vettoriale">campo vettoriale</span> era un oggetto <b>statico</b>: una freccia per ogni punto. Ora diventa una <b>legge di moto</b>: «da qui, muoviti in questa direzione con questa velocità». Una <b>curva integrale</b> è una curva che obbedisce a quella legge,
  $$\dot\gamma(t)=X(\gamma(t)),$$
  cioè <b>una soluzione di un&rsquo;equazione differenziale ordinaria sulla varietà</b>.</p>
  <p>La domanda «esiste? è unica?» ha una risposta che si conosce già dall&rsquo;analisi (Cauchy-Lipschitz), e questo movimento fa due cose: mostra che la risposta si <b>trasporta</b> sulla varietà senza modifiche, e chiarisce che cosa resta di specifico — <b>la fuga in tempo finito</b>, che su una varietà ha un significato geometrico e non solo analitico.</p>
  <p><b>Perché il trasporto non è banale, pur essendo breve.</b> Un&rsquo;equazione differenziale in $\mathbb{R}^{n}$ si scrive con delle coordinate, e le coordinate su una varietà sono arbitrarie e locali. Se la nozione di soluzione dipendesse dalla carta, non ci sarebbe niente da fare: due osservatori con carte diverse troverebbero moti diversi. <b>L&rsquo;intero movimento poggia sul fatto che questo non accade</b>, e la ragione è già stata costruita — il vettore tangente è un oggetto geometrico (gd-06) e il differenziale di un cambio di carta lo trasporta correttamente. <b>La geometria ha fatto il lavoro prima, e qui se ne raccoglie il frutto.</b></p>
  <p><b>Che cosa resta di specificamente geometrico</b>, e non è poco. In $\mathbb{R}^{n}$ una soluzione che «esplode» va all&rsquo;infinito, e l&rsquo;infinito è una nozione familiare. Su una varietà qualunque l&rsquo;infinito non esiste: non c&rsquo;è una distanza privilegiata e non c&rsquo;è un bordo. <b>La domanda «che cosa succede quando una soluzione smette di esistere» va quindi riformulata da zero</b>, e la risposta — la fuga da ogni compatto — è il vero contenuto nuovo di questo movimento, oltre che l&rsquo;enunciato che in relatività generale definisce una singolarità.</p>
  <p><b>Come è fatto il movimento.</b> Prima la riduzione in carta e il teorema di Cauchy-Lipschitz, che è breve perché il lavoro è stato fatto altrove. Poi l&rsquo;esempio che esplode, che è quello che si porta all&rsquo;esame. Poi il lemma di fuga con la sua dimostrazione e i criteri di completezza, che sono la parte usata in gd-15. Poi l&rsquo;ipotesi che regge l&rsquo;unicità, con il controesempio che la isola. Infine gli esercizi, dove si calcolano tempi di vita espliciti.</p>`}
]},

/* ---------------- 01 · IN CARTA ---------------- */
{ num:'01', title:'In carta e un sistema di ODE, e questo basta', meta:'la lettura locale · il teorema di Cauchy-Lipschitz · e perche lunicita e globale',
  blocchi:[
  {t:'prosa', title:'La riduzione, e il teorema', tag:'costruzione', html:R`
  <p>Si prende una <b>carta locale</b> attorno al punto iniziale: la curva diventa $t\mapsto(x^1(t),\dots,x^n(t))$ e l&rsquo;equazione diventa il <b>sistema di equazioni ordinarie</b>
  $$\dot x^{i}=X^{i}(x^1,\dots,x^n),$$
  <b>del primo ordine, autonomo, con coefficienti lisci</b>. Il <b>problema di Cauchy</b> è quel sistema più il dato $x(0)=x_0$, ed è la forma in cui l'analisi sa già rispondere. <b>Tutto il trasporto della teoria sulla varietà consiste in questo passaggio</b>: la carta locale trasforma un problema geometrico in uno che si conosce. Il teorema di Cauchy-Lipschitz dà quindi, per ogni dato iniziale, <b>esistenza e unicità locali</b>, più la <b>dipendenza liscia dal dato iniziale</b>.</p>
  <p><b>Quest'ultima merita di essere enunciata bene, perché è la parte che si dimentica e serve più di tutte.</b> Non dice solo che la soluzione dipende con continuità dal punto di partenza: dice che la mappa
  $$(t,x_0)\ \longmapsto\ x(t;x_0)$$
  è <b>liscia in entrambe le variabili insieme</b>, su un intorno di $(0,x_0)$. Senza questo si avrebbe una famiglia di curve una per punto, senza nessun legame regolare fra loro; con questo si ha un oggetto solo, liscio, che muove tutti i punti contemporaneamente. <b>È la differenza fra avere infinite soluzioni e avere una deformazione della varietà</b>, ed è ciò che permette di derivare rispetto al dato iniziale — operazione che in meccanica corrisponde a studiare la stabilità di un'orbita rispetto a una perturbazione.</p>
  <p><b>Due punti che non sono automatici e vanno visti:</b></p>
  <ul>
   <li><b>l&rsquo;indipendenza dalla carta</b>: un cambio di carta trasforma il sistema in un altro sistema liscio, e le soluzioni si corrispondono. Quindi «essere curva integrale» è una proprietà geometrica;</li>
   <li><b>l&rsquo;unicità è globale</b>, non solo locale. Due soluzioni con lo stesso dato iniziale coincidono su tutto l&rsquo;intervallo comune: l&rsquo;insieme dove coincidono è <b>aperto</b> (per unicità locale) e <b>chiuso</b> (per continuità, e qui serve <b>Hausdorff</b>), quindi è tutto. <b>È lo stesso argomento «aperto e chiuso in un connesso» di gd-01</b>, ed è il punto in cui l&rsquo;ipotesi di Hausdorff lavora davvero: sulla retta con due origini l&rsquo;unicità fallirebbe.</li>
  </ul>
  <p>Ne segue che ogni punto ha una <b>curva integrale massimale</b>, definita su un intervallo aperto massimale $(a,b)\ni0$, unica.</p>`},
  {t:'reveal', title:'I tre passaggi che il trasporto richiede davvero', tag:'grammatica', steps:[
   {label:'Primo: la carta non cambia le soluzioni', body:R`
   <p>Sia $\varphi$ un cambio di carta. Se $\gamma$ è una curva integrale di $X$ nelle prime coordinate, la curva $\varphi\circ\gamma$ è integrale del campo trasportato: basta derivare la composizione con la regola della catena e usare la definizione di come si trasforma un campo. <b>Il conto è una riga, e il contenuto è tutto nella definizione di campo vettoriale come sezione del fibrato tangente</b>: se il campo si trasforma con il differenziale, l&rsquo;equazione si trasforma con lui.</p>
   <p><b>Vale la pena notare che cosa sarebbe andato storto con una definizione ingenua.</b> Se un campo fosse stato definito come «una funzione a valori in $\mathbb{R}^{n}$», cambiando carta le componenti si sarebbero trasformate come si trasformano le funzioni, cioè per sostituzione, e l&rsquo;equazione non sarebbe stata la stessa. <b>La regola di trasformazione con lo jacobiano non è una complicazione: è esattamente ciò che rende l&rsquo;equazione indipendente dalla carta</b>, e questo è il tipo di guadagno che si incassa tardi e giustifica tutte le definizioni astratte del primo blocco del corso.</p>`},
   {label:'Secondo: lunicita si incolla', body:R`
   <p>L&rsquo;unicità che l&rsquo;analisi fornisce è <i>locale</i>: due soluzioni con lo stesso dato coincidono in un intorno di $0$. Per ottenere l&rsquo;unicità su tutto l&rsquo;intervallo comune si usa l&rsquo;argomento di connessione. Sia $A$ l&rsquo;insieme dei tempi in cui le due soluzioni coincidono. <b>$A$ non è vuoto</b>, perché contiene $0$. <b>$A$ è aperto</b>: se coincidono in $t_1$, applicando l&rsquo;unicità locale con dato iniziale il valore comune in $t_1$ si ottiene che coincidono in un intorno. <b>$A$ è chiuso</b>: se $t_n$ tende a $t$ e in ogni $t_n$ i valori coincidono, per continuità coincidono anche in $t$ — e qui serve che i limiti siano unici, cioè <b>Hausdorff</b>.</p>
   <p>Un insieme non vuoto, aperto e chiuso dentro un intervallo — che è connesso — è l&rsquo;intervallo intero. <b>Questo argomento compare tre volte nel corso e vale la pena riconoscerlo come uno solo</b>: serve a promuovere una proprietà da locale a globale quando lo spazio è connesso, ed è il cavallo di battaglia della geometria differenziale.</p>`},
   {label:'Terzo: la curva massimale esiste', body:R`
   <p>Fissato il punto di partenza, si consideri la famiglia di tutte le soluzioni con quel dato iniziale, ciascuna sul proprio intervallo. Per il passaggio precedente due qualunque di esse coincidono sull&rsquo;intersezione dei domini, <b>quindi si possono incollare in un&rsquo;unica funzione definita sull&rsquo;unione di tutti gli intervalli</b>. Quell&rsquo;unione è un intervallo aperto contenente lo zero, ed è per costruzione il più grande possibile.</p>
   <p><b>Il risultato è che a ogni punto della varietà resta associato un unico oggetto</b>: la sua curva integrale massimale, con il suo intervallo di vita $(a,b)$. Gli estremi $a$ e $b$ sono numeri che dipendono dal punto, e possono essere infiniti oppure no. <b>Tutta la tappa seguente è lo studio di quando sono finiti</b>, perché è l&rsquo;unico fenomeno che resta da capire.</p>`}
  ]}
]},

/* ---------------- 02 · LA FUGA IN TEMPO FINITO ---------------- */
{ num:'02', title:'La fuga in tempo finito, e cosa significa su una varieta', meta:'lesempio x = x^2 · perche lintervallo non e tutto R · e il caso compatto',
  blocchi:[
  {t:'reveal', title:'Lesempio, e la lettura', tag:'idea', steps:[
   {label:'Il conto', body:R`
   <p>Su $M=\mathbb{R}$ si prenda $X=x^{2}\dfrac{\partial}{\partial x}$, cioè $\dot x=x^{2}$. Con dato iniziale $x_0>0$ la soluzione è
   $$x(t)=\frac{x_0}{1-x_0t},$$
   che <b>vale $x_0$ al tempo zero</b> e <b>esplode</b> per $t\to1/x_0$: la curva integrale massimale è definita solo su $(-\infty,\ 1/x_0)$.</p>`},
   {label:'Che cosa significa geometricamente', body:R`
   <p><b>La soluzione non «finisce»: esce dalla varietà.</b> In tempo finito raggiunge l&rsquo;infinito, che non è un punto di $\mathbb{R}$. Su una varietà generica il fenomeno si chiama <b>fuga da ogni compatto</b>: la curva, avvicinandosi all&rsquo;estremo dell&rsquo;intervallo, lascia definitivamente ogni sottoinsieme compatto.</p>
   <p><b>Il teorema di fuga</b>: se l&rsquo;intervallo massimale ha estremo finito $b$, allora per ogni compatto $K$ esiste $t<b$ oltre cui la curva è fuori da $K$. <b>Cioè: l&rsquo;unico modo di smettere di esistere è scappare.</b> Non ci sono altre patologie.</p>`},
   {label:'Il corollario che si usa sempre', body:R`
   <p><b>Se $M$ è compatta, ogni curva integrale è definita su tutto $\mathbb{R}$</b> — non c&rsquo;è dove scappare. Il campo si dice allora <b>completo</b>, e in gd-15 questo darà un flusso globale, cioè un gruppo a un parametro di diffeomorfismi.</p>
   <p>Lo stesso vale, senza compattezza, per i campi a <b>supporto compatto</b> e — più in generale — quando la crescita è controllata. <b>La lezione operativa</b>: la completezza non è una proprietà del campo in sé ma del rapporto fra il campo e la geometria in cui vive, e la compattezza è il modo più semplice di garantirla.</p>`}
  ]},
  {t:'plot', title:'Esplodere in tempo finito, e non esplodere',
   intro:R`Le soluzioni di $\dot x=x^{2}$ e $\dot x=x$ con lo stesso dato iniziale $x_0=1$: la prima ha un asintoto verticale, la seconda cresce per sempre restando definita.`,
   plots:[
    {kind:'func2d', xr:[0,2], yr:[0,8], height:330,
     title:'x^2 esplode a t=1; x cresce ma non esce mai dalla varieta',

     marks:[{x:0, y:1, label:'stesso dato iniziale', col:'#d8a13a', up:true}]}
   ],
   leggi:R`<b>Le due curve partono dallo stesso punto</b> e si separano subito: quella rossa ha un asintoto verticale a $t=1$, quella verde cresce esponenzialmente ma è definita per ogni $t$. <b>La differenza non è «quanto cresce» ma se la crescita è abbastanza rapida da percorrere una distanza infinita in tempo finito</b> — e la soglia è esattamente fra crescita lineare nel campo ($\dot x=x$, lipschitziano) e quadratica ($\dot x=x^2$, non lipschitziano globalmente).<br><br>
   <b>La lettura geometrica</b>: la curva rossa non «si ferma» a $t=1$, <i>esce</i> da $\mathbb{R}$. Se la varietà fosse stata compatta — per esempio $S^1$ invece di $\mathbb{R}$ — non ci sarebbe stato dove andare, e la soluzione sarebbe esistita per sempre.`}

/* ---------------- 03 · IL LEMMA DI FUGA ---------------- */
{ num:'03', title:'Il lemma di fuga, dimostrato, e i criteri di completezza', meta:'perche non ci sono altre patologie · il tempo di vita come integrale · e quando il campo e completo',
  blocchi:[
  {t:'prosa', title:'La dimostrazione, che e piu corta dellenunciato', tag:'costruzione', html:R`
  <p><b>Enunciato.</b> Sia $\gamma$ la curva integrale massimale di $X$ con intervallo $(a,b)$, e si supponga $b$ finito. Allora per ogni <span class="str" data-str="compattezza">compatto</span> $K\subseteq M$ esiste $t_K\lt b$ tale che $\gamma(t)\notin K$ per ogni $t\gt t_K$.</p>
  <p><b>Dimostrazione per assurdo, e sta in quattro righe.</b> Se così non fosse, esisterebbe un compatto $K$ e una successione di tempi $t_n\to b$ con $\gamma(t_n)\in K$. Per compattezza si estrae una sottosuccessione con $\gamma(t_{n_k})\to p\in K$. Attorno a $p$ il teorema di esistenza locale dà un intorno $U$ e un tempo $\varepsilon\gt0$ tali che <b>da ogni punto di $U$ la soluzione esiste almeno per un tempo $\varepsilon$</b> — ed è qui che si usa l&rsquo;uniformità del tempo di esistenza sui compatti, che è la parte non ovvia del teorema di Cauchy-Lipschitz. Prendendo $k$ abbastanza grande da avere $\gamma(t_{n_k})\in U$ e $t_{n_k}\gt b-\varepsilon$, si prolunga la soluzione oltre $b$: contraddizione con la massimalità.</p>
  <p><b>Che cosa ha fatto la compattezza</b>, perché è l&rsquo;unico ingrediente geometrico: ha trasformato «la curva torna infinite volte in $K$» in «la curva si avvicina a un punto preciso», e attorno a un punto preciso si può applicare un teorema locale. <b>Senza compattezza la successione non converge e l&rsquo;argomento muore</b> — e infatti l&rsquo;enunciato è falso senza: la curva può oscillare avvicinandosi a un buco della varietà senza accumularsi da nessuna parte.</p>
  <p><b>Il corollario è ciò che si usa</b>: se una curva integrale resta in un compatto, è definita per ogni tempo. Detto al contrario, <b>l&rsquo;unico modo di morire è andarsene</b> — non esiste una soluzione che «si ferma» restando al finito, o che diventa non liscia, o che si biforca. È un enunciato di rigidità, e la sua utilità pratica è che riduce ogni domanda di esistenza globale a una domanda di limitatezza.</p>`},
  {t:'prosa', title:'Il tempo di vita si calcola, in una dimensione', tag:'esame', html:R`
  <p>In dimensione uno la separazione delle variabili dà il tempo di vita come integrale, ed è il modo più economico di rispondere alla domanda «per quanto esiste». Per $\dot x=f(x)$ con $f\gt0$, il tempo impiegato per andare da $x_0$ all&rsquo;infinito è l&rsquo;integrale del reciproco:</p>
  <p>$$b-0=\int_{x_0}^{\infty}\frac{dx}{f(x)}.$$</p>
  <p><b>Per $f(x)=x^{2}$ si ottiene $\int_{x_0}^{\infty}\frac{dx}{x^{2}}=\frac{1}{x_0}$</b>, che è esattamente il tempo di esplosione trovato risolvendo l&rsquo;equazione — e si è ottenuto senza risolverla. <b>Per $f(x)=x$ l&rsquo;integrale del reciproco diverge logaritmicamente</b>, quindi il tempo di vita è infinito: la soluzione cresce per sempre senza mai arrivare. <b>La convergenza o meno di quell&rsquo;integrale è il criterio</b>, e si legge a occhio dall&rsquo;esponente.</p>
  <p><b>La regola che se ne ricava</b>: la crescita $x^{p}$ produce fuga in tempo finito se e solo se $p\gt1$, perché è esattamente la condizione di convergenza dell&rsquo;integrale all&rsquo;infinito. <b>La soglia è la crescita lineare</b>, e non è un caso: la crescita lineare è la crescita di un campo lipschitziano, e la lipschitzianità globale è precisamente l&rsquo;ipotesi che garantisce l&rsquo;esistenza globale nel teorema classico.</p>
  <p><b>Tre criteri di completezza, in ordine di forza decrescente e di utilità crescente.</b> Se $M$ è <b>compatta</b>, ogni campo è completo — è il corollario del lemma di fuga. Se $X$ ha <b>supporto compatto</b>, è completo anche su $M$ non compatta, perché fuori dal supporto le soluzioni sono costanti e dentro vale il caso precedente. Se $X$ è <b>limitato rispetto a una metrica completa</b> — cioè la sua norma non supera una costante — è completo, perché in tempo finito si può percorrere solo una distanza finita, e una palla chiusa in uno spazio metrico completo con curvatura ragionevole è compatta. <b>Il terzo è quello che si usa in fisica</b>, ed è il motivo per cui un campo di velocità limitato non produce mai singolarità in tempo finito.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Il campo $X=x^{2}\partial_x$ su $\mathbb{R}$ non è completo. Lo è la sua restrizione all'intervallo $(0,1)$?`,
    a:R`No, e peggiora: su $(0,1)$ la soluzione esce dalla varietà in un tempo ancora più breve, quando raggiunge $1$. <b>La completezza non migliora restringendo</b>, anzi tipicamente peggiora, perché si aggiungono bordi da cui scappare. Il caso opposto — compattificare — è quello che aiuta: sullo stesso campo esteso a $S^{1}$ tramite la proiezione stereografica il punto all&rsquo;infinito diventa un punto vero, la soluzione lo attraversa, e il campo diventa completo. <b>La completezza è una proprietà della coppia campo-varietà, mai del solo campo.</b>`},
   {q:R`Una curva integrale può tornare al punto di partenza?`,
    a:R`Sì, e allora è <b>periodica</b>: se $\gamma(t_1)=\gamma(0)$ con $t_1\gt0$, per unicità la soluzione si ripete con periodo $t_1$, e in particolare è definita per ogni tempo. <b>Le orbite periodiche sono automaticamente complete</b>, perché la loro immagine è compatta. Non può invece accadere che una curva integrale si autointersechi <i>senza</i> essere periodica: nel punto d&rsquo;intersezione ci sarebbero due soluzioni distinte con lo stesso dato iniziale, e l&rsquo;unicità lo vieta. <b>Le curve integrali di un campo liscio o sono iniettive o sono periodiche</b>, e non c&rsquo;è terza possibilità.`}
  ]}
]},

/* ---------------- 04 · L'IPOTESI CHE SERVE ---------------- */
{ num:'04', title:'Perche serve la lipschitzianita, e il controesempio', meta:'x = x^(2/3) · due soluzioni con lo stesso dato · e perche la liscezza basta',
  blocchi:[
  {t:'prosa', title:'Il controesempio classico', tag:'first principles', html:R`
  <p>L&rsquo;unicità richiede più della continuità. Per $\dot x=x^{2/3}$ con $x(0)=0$ ci sono <b>almeno due</b> soluzioni: quella identicamente nulla, e
  $$x(t)=\left(\frac{t}{3}\right)^{3},$$
  che verifica l&rsquo;equazione — si controlla derivando. <b>Il campo è continuo ma non <span class="str" data-str="lipschitziana">lipschitziano</span> in $0$</b> (<b>la derivata di $x^{2/3}$ esplode</b> lì), e l&rsquo;unicità cade.</p>
  <p><b>In questo corso il problema non si pone</b>, perché i campi sono <i>lisci</i> e quindi localmente lipschitziani. Ma vale la pena sapere qual è l&rsquo;ipotesi che sta lavorando: <b>non la liscezza in sé, ma la lipschitzianità locale</b>, che è molto meno. Il teorema vale per campi $C^1$, e in molte applicazioni fisiche è tutto ciò che si ha.</p>
  <p><b>Le soluzioni non sono due ma infinite</b>, ed è la cosa che rende il controesempio memorabile. Per ogni $c\ge0$ la funzione che vale zero fino al tempo $c$ e poi riparte come il cubo traslato è ancora una soluzione: è liscia abbastanza nel punto di raccordo, perché lì sia la funzione sia la sua derivata si annullano. <b>Il punto $x=0$ è una stazione da cui si può ripartire quando si vuole</b>, e questo è il ritratto esatto della perdita di determinismo: lo stato presente non contiene l&rsquo;informazione su quando il moto ricomincerà.</p>
  <div class="note"><b>Dove il problema si pone davvero.</b> In meccanica ci sono sistemi con forze non lipschitziane — urti, attrito secco, vincoli unilateri — e lì la non unicità <i>è</i> un fenomeno fisico, non un difetto del modello: significa che lo stato iniziale non determina il futuro, e serve informazione in più. <b>Il determinismo classico è un teorema, non un assioma</b>, e questo è il punto in cui si vede da quali ipotesi dipende.</div>
  <p><b>Perché la lipschitzianità è esattamente l&rsquo;ipotesi giusta</b>, e non una comoda approssimazione. La dimostrazione di unicità confronta due soluzioni $x$ e $y$ e stima la crescita della loro differenza: la derivata di $|x-y|$ è controllata da $|f(x)-f(y)|$, che per la lipschitzianità è al più $L|x-y|$. <b>Si ottiene così una disuguaglianza differenziale che, partendo da differenza nulla, forza la differenza a restare nulla</b> — è il lemma di Gronwall. Senza una costante $L$ la stima non si chiude, e la differenza può crescere partendo da zero: è precisamente ciò che fa il controesempio, dove la separazione delle due soluzioni avviene con velocità infinita nell&rsquo;istante iniziale.</p>`},
  {t:'plot', title:'Infinite soluzioni dallo stesso punto',
   intro:R`Le soluzioni di $\dot x=x^{2/3}$ con dato iniziale nullo: quella identicamente nulla, e le curve che restano ferme per un tempo $c$ a scelta e poi ripartono. Tutte passano per l'origine, tutte risolvono la stessa equazione.`,
   plots:[
    {kind:'func2d', xr:[0,3], yr:[-0.05,1.05], height:330,
     title:'lo stesso dato iniziale, tre futuri diversi (e ce ne sono infiniti)',
     xlabel:'t', ylabel:'x(t)',
     curves:[
      {f:'0', col:'#b98cff', width:2.6, label:'la soluzione nulla: resta ferma per sempre'},
      {f:'pow(x/3,3)', col:'#5eead4', width:2.4, label:'riparte subito: (t/3)^3'},
      {f:'x<1 ? 0 : pow((x-1)/3,3)', col:'#d8a13a', width:2.4, label:'riparte a t=1'},
      {f:'x<2 ? 0 : pow((x-2)/3,3)', col:'#ff6b6b', width:2.4, label:'riparte a t=2'}
     ],
     marks:[{x:0, y:0, label:'un solo dato iniziale', col:'#c9d4e0', up:true}]}
   ],
   leggi:R`<p><b>Quattro curve, un solo dato iniziale</b>, e sono un campione di una famiglia continua: una per ogni istante di ripartenza. Il determinismo è perduto non in modo marginale ma totale — sapere dove si è al tempo zero non dice nulla su dove si sarà al tempo due.</p>
   <p><b>Il punto di raccordo è liscio</b>, e questo è ciò che rende le curve soluzioni legittime e non trucchi. Nel momento della ripartenza la funzione vale zero e la sua derivata vale zero, quindi si incolla senza spigoli con il tratto costante. <b>La patologia non è nella regolarità della soluzione ma in quella del campo</b>, e il campo è continuo: è il grafico di $x^{2/3}$, che nell&rsquo;origine ha tangente verticale.</p>
   <p><b>Il confronto con la figura precedente chiude il quadro.</b> Lì il campo era liscio e il problema era che la soluzione se ne andava: esistenza persa, unicità salva. Qui il campo è continuo e non lipschitziano, e il problema è opposto: la soluzione esiste per sempre ma non è una. <b>I due teoremi sono indipendenti e falliscono per ragioni diverse</b>, ed è il motivo per cui Cauchy-Lipschitz ha due ipotesi e non una.</p>`}
]},

/* ---------------- 05 · ESERCIZI ---------------- */
{ num:'05', title:'Esercizi — tocca a te', meta:'un campo che esplode in tempo pi · lo stesso campo su un cerchio · e i campi lineari',
  blocchi:[
  {t:'esercizio', title:'1 · Il campo che vive esattamente un tempo pi greco',
   src:'il caso in cui il tempo di vita si calcola in due modi e coincide',
   testo:R`Sul dominio $\mathbb{R}$ si consideri $X=(1+x^{2})\,\partial_x$. Determina la curva integrale con $x(0)=0$, il suo intervallo massimale, e ricalcola il tempo di vita totale con l'integrale del reciproco.`,
   steps:[
    {label:'La soluzione, e lintervallo', body:R`
    <p>Separando le variabili si riconosce la primitiva dell&rsquo;arcotangente, e la soluzione con dato nullo è $x(t)=\tan t$. Si verifica direttamente derivando: la derivata della tangente è $1+\tan^{2}t$, cioè esattamente $1+x^{2}$ valutato sulla soluzione. <b>L&rsquo;intervallo massimale è $(-\pi/2,\ \pi/2)$</b>, perché la tangente esplode agli estremi.</p>
    <p><b>Da notare che si scappa in entrambe le direzioni del tempo</b>, a differenza dell&rsquo;esempio $\dot x=x^{2}$, dove la soluzione con dato positivo esisteva per tutto il passato. Qui il campo è positivo ovunque e limitato dal basso da $1$, quindi il punto si muove sempre verso destra a velocità almeno unitaria e non può che raggiungere gli estremi. <b>La vita totale è $\pi$</b>, e si può leggere questo numero come l&rsquo;area sotto una curva.</p>`},
    {label:'Il conto con lintegrale, e perche viene pi', body:R`
    <p>Il tempo per andare da $-\infty$ a $+\infty$ è l&rsquo;integrale del reciproco del campo su tutta la retta: $\int_{-\infty}^{\infty}\frac{dx}{1+x^{2}}=\pi$, che è la lunghezza dell&rsquo;intervallo trovato prima. <b>I due metodi coincidono, come devono</b>, e il secondo non ha richiesto di risolvere l&rsquo;equazione.</p>
    <p><b>Il significato del conto</b> vale più del risultato: il reciproco del campo è il <i>tempo speso per unità di spazio</i>, e integrarlo lungo il cammino dà il tempo totale. È la stessa idea con cui si calcola il tempo di percorrenza conoscendo la velocità in funzione della posizione, e in questa forma si applica a ogni campo unidimensionale che non si annulla. <b>Quando il campo si annulla in un punto, l&rsquo;integrale diverge lì</b> — e infatti un punto di equilibrio non si raggiunge mai in tempo finito, il che è un altro modo di enunciare l&rsquo;unicità.</p>`}
   ]},
  {t:'esercizio', title:'2 · Lo stesso campo, su una varieta compatta',
   src:'lesercizio che isola il ruolo della geometria: stesso campo, esito opposto',
   testo:R`Sul cerchio $S^{1}$, parametrizzato dall'angolo $\vartheta$, si consideri il campo $\partial_\vartheta$ di velocità angolare costante. È completo? E che cosa succede al campo $X=(1+x^{2})\partial_x$ dell'esercizio precedente se si identifica $\mathbb{R}$ con $S^{1}$ meno un punto?`,
   steps:[
    {label:'Il cerchio', body:R`
    <p>Il campo $\partial_\vartheta$ ha curve integrali $\vartheta(t)=\vartheta_0+t$, definite per ogni tempo: sono periodiche di periodo $2\pi$ e percorrono il cerchio all&rsquo;infinito. <b>È completo</b>, e lo si sapeva già senza conti dal corollario del lemma di fuga: $S^{1}$ è compatta.</p>
    <p><b>Vale la pena osservare che la stessa curva, letta in una carta, sembra fuggire.</b> Togliendo un punto al cerchio e usando una carta che lo manda in $\mathbb{R}$, la soluzione raggiunge l&rsquo;estremo della carta in tempo finito e la descrizione in coordinate si interrompe. <b>Non è la soluzione a finire, è la carta</b>, ed è precisamente la distinzione che questo movimento serve a stabilire: la fuga è un fatto sulla varietà, non sulla carta.</p>`},
    {label:'Il campo dellesercizio 1, compattificato', body:R`
    <p>La proiezione stereografica identifica $\mathbb{R}$ con $S^{1}$ meno il polo. Trasportando $X=(1+x^{2})\partial_x$ attraverso quella identificazione si ottiene un campo su $S^{1}$ meno un punto che — ed è il conto interessante — <b>si estende in modo liscio al punto mancante</b>, dove non si annulla. Il fattore $1+x^{2}$ è esattamente quello che compensa la contrazione della proiezione vicino al polo.</p>
    <p><b>Il campo esteso è completo</b>, e le sue curve integrali sono i giri del cerchio: ciò che in $\mathbb{R}$ appariva come una fuga all&rsquo;infinito in tempo $\pi/2$ è, sul cerchio, il passaggio attraverso il polo. <b>Dopo di che la soluzione riappare dall&rsquo;altra parte</b>, cioè da $-\infty$, e continua. La vita totale $\pi$ che si era calcolata è il tempo di un giro completo.</p>
    <p><b>È l&rsquo;esempio che riassume il movimento</b>: la stessa equazione, due varietà, due esiti opposti. La domanda «questa soluzione esiste per sempre?» non ha risposta finché non si dice <i>dove</i> vive, e questa è la ragione per cui il problema di Cauchy si studia su varietà e non solo in $\mathbb{R}^{n}$.</p>`}
   ]},
  {t:'esercizio', title:'3 · I campi lineari sono sempre completi',
   src:'il criterio che copre quasi tutto cio che si incontra in fisica',
   testo:R`Mostra che il campo $X=x\,\partial_x$ su $\mathbb{R}$ è completo, e generalizza: perché ogni campo lineare $\dot{\mathbf x}=A\mathbf x$ su $\mathbb{R}^{n}$ è completo, qualunque sia la matrice $A$?`,
   steps:[
    {label:'Il caso unidimensionale', body:R`
    <p>La soluzione con dato $x_0$ è $x_0e^{t}$: si verifica derivando, e la derivata riproduce la funzione stessa, cioè il campo valutato sulla soluzione. <b>È definita per ogni $t$ reale</b>, e cresce senza limite ma senza mai esplodere in tempo finito.</p>
    <p>Col criterio dell&rsquo;integrale si ritrova lo stesso: il tempo per andare da $x_0$ all&rsquo;infinito è l&rsquo;integrale del reciproco di $x$, che diverge logaritmicamente. <b>La crescita esponenziale della soluzione e la divergenza logaritmica dell&rsquo;integrale sono lo stesso fatto letto nei due versi</b>, e conviene tenerli associati perché è l&rsquo;esempio limite: qualunque crescita più che lineare del campo produce fuga, la lineare no.</p>`},
    {label:'Il caso generale, e perche la ragione e la lipschitzianita', body:R`
    <p>Una mappa lineare è globalmente lipschitziana, con costante la norma della matrice: la differenza delle immagini è la matrice applicata alla differenza, e la norma della matrice la controlla. <b>La lipschitzianità globale è l&rsquo;ipotesi sotto cui il teorema classico dà esistenza globale</b>, quindi ogni campo lineare è completo senza bisogno di risolverlo.</p>
    <p><b>Il conto esplicito conferma e dice di più</b>: la soluzione è l&rsquo;esponenziale della matrice applicata al dato iniziale, ed è definita per ogni tempo perché la serie dell&rsquo;esponenziale converge sempre. <b>Le curve integrali di un campo lineare formano quindi un gruppo a un parametro di trasformazioni lineari</b>, che è l&rsquo;esempio più semplice del flusso di gd-15 e il primo caso di gruppo di Lie a un parametro di gd-14.</p>
    <p><b>La conseguenza per la fisica</b>: ogni sistema lineare — oscillatori, circuiti, equazioni di Maxwell nel vuoto, l&rsquo;equazione di Schrödinger — è automaticamente completo, e le singolarità in tempo finito sono un fenomeno esclusivamente non lineare. <b>Quando si legge di una soluzione che esplode in tempo finito, la non linearità è sempre la causa</b>, e il grado di non linearità decide la soglia, come si è visto con l&rsquo;esponente $p\gt1$.</p>`}
   ]}
]},

/* ---------------- 06 · IL SENSO ---------------- */
{ num:'06', title:'Il senso, e le rotte', meta:'cosa apre, e dove le equazioni su varieta sono la regola',
  blocchi:[
  {t:'prosa', title:'Cosa lascia in mano', tag:'sintesi', html:R`
  <p><b>Il punto.</b> Un campo vettoriale <b>è</b> un&rsquo;equazione differenziale, e una varietà è il posto giusto in cui scriverla: le coordinate sono locali e arbitrarie, la soluzione no. <b>Tutta la teoria qualitativa dei sistemi dinamici vive in questo quadro</b>, e il vantaggio pratico è che lo spazio delle fasi di un sistema vincolato è una varietà, non uno spazio euclideo.</p>
  <p><b>A valle.</b> gd-15 raccoglie tutte le curve integrali in un unico oggetto — il flusso — e studia quando è globale; gd-16 e gd-17 passano alle equazioni alle derivate parziali del primo ordine, che si risolvono <i>proprio</i> con le curve integrali di un campo.</p>
  <p><b>Che cosa portarsi via, in ordine di durata.</b> Che un campo liscio determina un moto unico, e che l&rsquo;unico modo di smettere di esistere è uscire da ogni compatto. Il criterio dell&rsquo;integrale del reciproco, che risponde alla domanda sul tempo di vita senza risolvere l&rsquo;equazione. Il fatto che la compattezza garantisce la completezza, che è il corollario usato ovunque. E il controesempio $x^{2/3}$, che è il modo più rapido di ricordare che il determinismo è un teorema con ipotesi.</p>`},
  {t:'prolessi', title:'Dove riappare questo movimento',
   oggetto:R`<b>La curva integrale</b>: la soluzione di un&rsquo;equazione differenziale su uno spazio curvo.`,
   rotte:[
    {dove:'Meccanica<br>analitica', txt:R`Le equazioni di Hamilton sono le curve integrali del <b>campo hamiltoniano</b> sullo spazio delle fasi, che è una varietà. Il teorema di Liouville dice che quel flusso preserva il volume — un&rsquo;affermazione che ha senso solo in questo linguaggio.`},
    {dove:'Meccanica<br>statistica', txt:R`L&rsquo;<b>ipotesi ergodica</b> è un&rsquo;affermazione sulle curve integrali sulla superficie di energia costante: che una singola traiettoria visiti densamente la varietà. <b>Il quadro geometrico è questo</b>, e senza di esso l&rsquo;enunciato non si formula.`},
    {dove:'Relativita<br>generale', txt:R`Le <b>geodetiche</b> sono curve integrali di un campo sul fibrato tangente, e la questione della loro completezza — se esistono per ogni tempo proprio — <b>è</b> la definizione di singolarità dello spazio-tempo. I teoremi di Penrose-Hawking dicono che l&rsquo;incompletezza è inevitabile.`},
    {dove:'Sistemi<br>dinamici', txt:R`Punti fissi, orbite periodiche, attrattori, stabilita': tutta la teoria qualitativa e' lo studio delle curve integrali senza risolverle. <b>La linearizzazione attorno a un equilibrio</b> e' il differenziale di gd-06 applicato al campo.`}
   ],
   domanda:R`La soluzione di $\dot x=x^2$ esiste fino a $t=1/x_0$ e poi «esce dalla varietà». Ma in relatività generale le geodetiche incomplete non escono da nessuna parte: <b>lo spazio-tempo semplicemente finisce</b>. <b>Domanda che porti avanti:</b> che differenza c&rsquo;è fra una soluzione che scappa all&rsquo;infinito e una varietà che ha un buco? Formalmente nessuna — in entrambi i casi l&rsquo;intervallo massimale è limitato — e questo è esattamente il motivo per cui la definizione moderna di singolarità gravitazionale è <b>l&rsquo;incompletezza geodetica</b> e non «la curvatura diverge»: l&rsquo;unica cosa che si può affermare senza uscire dalla varietà è che il moto smette di essere definito.`}
]}

];

function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
    else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
    else if(b.t==='prolessi') m.appendChild(sectionProlessi(b));
    else if(b.t==='reveal')m.appendChild(sectionReveal(b.title,b.tag,b.steps));
    else if(b.t==='esercizio') m.appendChild(sectionEsercizio(b));
    else if(b.t==='collaudo')  m.appendChild(sectionCollaudo(b.title,b.items));
    else if(b.t==='plot')      m.appendChild(sectionPlot(b));
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}

/* deep-link: gd-13-curve-integrali.html#03 apre direttamente la tappa 03 */
window.addEventListener('DOMContentLoaded', function(){
  var h=(location.hash||'').replace('#','');
  showTappa(byId[h]?h:'00');
});
window.addEventListener('hashchange', function(){
  var h=(location.hash||'').replace('#','');
  if(byId[h]) showTappa(h);
});
