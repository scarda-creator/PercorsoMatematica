  <p>Si prende una <b>carta locale</b> attorno al punto iniziale: la curva diventa $t\mapsto(x^1(t),\dots,x^n(t))$ e l&rsquo;equazione diventa il <b>sistema di equazioni ordinarie</b>
  $$\dot x^{i}=X^{i}(x^1,\dots,x^n),$$
  <b>del primo ordine, autonomo, con coefficienti lisci</b>. Il <b>problema di Cauchy</b> è quel sistema più il dato $x(0)=x_0$, ed è la forma in cui l'analisi sa già rispondere. <b>Tutto il trasporto della teoria sulla varietà consiste in questo passaggio</b>: la carta locale trasforma un problema geometrico in uno che si conosce. Il teorema di Cauchy-Lipschitz dà quindi, per ogni dato iniziale, <b>esistenza e unicità locali</b>, più la <b>dipendenza liscia dal dato iniziale</b>.</p>
  <p><b>Quest'ultima merita di essere enunciata bene, perché è la parte che si dimentica e serve più di tutte.</b> Non dice solo che la soluzione dipende con continuità dal punto di partenza: dice che la mappa
  $$(t,x_0)\ \longmapsto\ x(t;x_0)$$
  è <b>liscia in entrambe le variabili insieme</b>, su un intorno di $(0,x_0)$. Senza questo si avrebbe una famiglia di curve una per punto, senza nessun legame regolare fra loro; con questo si ha un oggetto solo, liscio, che muove tutti i punti contemporaneamente. <b>È la differenza fra avere infinite soluzioni e avere una deformazione della varietà</b>, ed è ciò che permette di derivare rispetto al dato iniziale — operazione che in meccanica corrisponde a studiare la stabilità di un'orbita rispetto a una perturbazione.</p>
  <p><b>Due punti che non sono automatici e vanno visti:</b></p>
  <ul>
   <li><b>l&rsquo;indipendenza dalla carta</b>: un cambio di carta trasforma il sistema in un altro sistema liscio, e le soluzioni si corrispondono. Quindi «essere curva integrale» è una proprietà geometrica;</li>
   <li><b>l&rsquo;unicità è globale</b>, non solo locale. Due soluzioni con lo stesso dato iniziale coincidono su tutto l&rsquo;intervallo comune: l&rsquo;insieme dove coincidono è <b>aperto</b> (per unicità locale) e <b>chiuso</b> (per continuità, e qui serve <b>Hausdorff</b>), quindi è tutto. <b>È lo stesso argomento «aperto e chiuso in un connesso» di gd-01</b>, ed è il punto in cui l&rsquo;ipotesi di Hausdorff lavora davvero: sulla retta con due origini l&rsquo;unicità fallirebbe.</li>
  </ul>
  <p>Ne segue che ogni punto ha una <b>curva integrale massimale</b>, definita su un intervallo aperto massimale $(a,b)\ni0$, unica.</p>`}
]},

/* ---------------- 02 · LA FUGA IN TEMPO FINITO ---------------- */
{ num:'02', title:'La fuga in tempo finito, e cosa significa su una varieta', meta:'lesempio x = x^2 · perche lintervallo non e tutto R · e il caso compatto',
  blocchi:[
  {t:'reveal', title:'Lesempio, e la lettura', tag:'idea', steps:[
   {label:'Il conto', body:R`
   <p>Su $M=\mathbb{R}$ si prenda $X=x^{2}\dfrac{\partial}{\partial x}$, cioè $\dot x=x^{2}$. Con dato iniziale $x_0>0$ la soluzione è
   $$x(t)=\frac{x_0}{1-x_0t},$$
   che <b>vale $x_0$ al tempo zero</b> e <b>esplode</b> per $t\to1/x_0$: la curva integrale massimale è definita solo su $(-\infty,\ 1/x_0)$.</p>`},
   {label:'Che cosa significa geometricamente', body:R`
   <p><b>La soluzione non «finisce»: esce dalla varietà.</b> In tempo finito raggiunge l&rsquo;infinito, che non è un punto di $\mathbb{R}$. Su una varietà generica il fenomeno si chiama <b>fuga da ogni compatto</b>: la curva, avvicinandosi all&rsquo;estremo dell&rsquo;intervallo, lascia definitivamente ogni sottoinsieme compatto.</p>
   <p><b>Il teorema di fuga</b>: se l&rsquo;intervallo massimale ha estremo finito $b$, allora per ogni compatto $K$ esiste $t<b$ oltre cui la curva è fuori da $K$. <b>Cioè: l&rsquo;unico modo di smettere di esistere è scappare.</b> Non ci sono altre patologie.</p>`},
   {label:'Il corollario che si usa sempre', body:R`
   <p><b>Se $M$ è compatta, ogni curva integrale è definita su tutto $\mathbb{R}$</b> — non c&rsquo;è dove scappare. Il campo si dice allora <b>completo</b>, e in gd-15 questo darà un flusso globale, cioè un gruppo a un parametro di diffeomorfismi.</p>
   <p>Lo stesso vale, senza compattezza, per i campi a <b>supporto compatto</b> e — più in generale — quando la crescita è controllata. <b>La lezione operativa</b>: la completezza non è una proprietà del campo in sé ma del rapporto fra il campo e la geometria in cui vive, e la compattezza è il modo più semplice di garantirla.</p>`}
  ]},
  {t:'plot', title:'Esplodere in tempo finito, e non esplodere',
   intro:R`Le soluzioni di $\dot x=x^{2}$ e $\dot x=x$ con lo stesso dato iniziale $x_0=1$: la prima ha un asintoto verticale, la seconda cresce per sempre restando definita.`,
   plots:[
    {kind:'func2d', xr:[0,2], yr:[0,8], height:330,
     title:'x^2 esplode a t=1; x cresce ma non esce mai dalla varieta',
     xlabel:'t', ylabel:'x(t)',
     curves:[
      {f:'x<0.98 ? 1/(1-x) : 0/0', col:'#ff6b6b', width:2.6, label:'ẋ = x^2: esplode'},
      {f:'exp(x)', col:'#5eead4', width:2.4, label:'ẋ = x: definita sempre'}
     ],
     segs:[{x1:1, y1:0, x2:1, y2:8, col:'#ff6b6b', dash:true, width:1.5, label:'t=1/x_0', lx:1.03, ly:7.2}],
     marks:[{x:0, y:1, label:'stesso dato iniziale', col:'#d8a13a', up:true}]}
   ],
   leggi:R`<b>Le due curve partono dallo stesso punto</b> e si separano subito: quella rossa ha un asintoto verticale a $t=1$, quella verde cresce esponenzialmente ma è definita per ogni $t$. <b>La differenza non è «quanto cresce» ma se la crescita è abbastanza rapida da percorrere una distanza infinita in tempo finito</b> — e la soglia è esattamente fra crescita lineare nel campo ($\dot x=x$, lipschitziano) e quadratica ($\dot x=x^2$, non lipschitziano globalmente).<br><br>
   <b>La lettura geometrica</b>: la curva rossa non «si ferma» a $t=1$, <i>esce</i> da $\mathbb{R}$. Se la varietà fosse stata compatta — per esempio $S^1$ invece di $\mathbb{R}$ — non ci sarebbe stato dove andare, e la soluzione sarebbe esistita per sempre.`}
]},

/* ---------------- 03 · L'IPOTESI CHE SERVE ---------------- */
{ num:'03', title:'Perche serve la lipschitzianita, e il controesempio', meta:'x = x^(2/3) · due soluzioni con lo stesso dato · e perche la liscezza basta',
  blocchi:[
  {t:'prosa', title:'Il controesempio classico', tag:'first principles', html:R`
  <p>L&rsquo;unicità richiede più della continuità. Per $\dot x=x^{2/3}$ con $x(0)=0$ ci sono <b>almeno due</b> soluzioni: quella identicamente nulla, e
  $$x(t)=\left(\frac{t}{3}\right)^{3},$$
  che verifica l&rsquo;equazione — si controlla derivando. <b>Il campo è continuo ma non lipschitziano in $0$</b> (la derivata di $x^{2/3}$ esplode lì), e l&rsquo;unicità cade.</p>
  <p><b>In questo corso il problema non si pone</b>, perché i campi sono <i>lisci</i> e quindi localmente lipschitziani. Ma vale la pena sapere qual è l&rsquo;ipotesi che sta lavorando: <b>non la liscezza in sé, ma la lipschitzianità locale</b>, che è molto meno. Il teorema vale per campi $C^1$, e in molte applicazioni fisiche è tutto ciò che si ha.</p>
  <div class="note"><b>Dove il problema si pone davvero.</b> In meccanica ci sono sistemi con forze non lipschitziane — urti, attrito secco, vincoli unilateri — e lì la non unicità <i>è</i> un fenomeno fisico, non un difetto del modello: significa che lo stato iniziale non determina il futuro, e serve informazione in più. <b>Il determinismo classico è un teorema, non un assioma</b>, e questo è il punto in cui si vede da quali ipotesi dipende.</div>`}
]},

/* ---------------- 04 · IL SENSO ---------------- */
{ num:'04', title:'Il senso, e le rotte', meta:'cosa apre, e dove le equazioni su varieta sono la regola',
  blocchi:[
  {t:'prosa', title:'Cosa lascia in mano', tag:'sintesi', html:R`
  <p><b>Il punto.</b> Un campo vettoriale <b>è</b> un&rsquo;equazione differenziale, e una varietà è il posto giusto in cui scriverla: le coordinate sono locali e arbitrarie, la soluzione no. <b>Tutta la teoria qualitativa dei sistemi dinamici vive in questo quadro</b>, e il vantaggio pratico è che lo spazio delle fasi di un sistema vincolato è una varietà, non uno spazio euclideo.</p>
  <p><b>A valle.</b> gd-15 raccoglie tutte le curve integrali in un unico oggetto — il flusso — e studia quando è globale; gd-16 e gd-17 passano alle equazioni alle derivate parziali del primo ordine, che si risolvono <i>proprio</i> con le curve integrali di un campo.</p>`},
  {t:'prolessi', title:'Dove riappare questo movimento',
   oggetto:R`<b>La curva integrale</b>: la soluzione di un&rsquo;equazione differenziale su uno spazio curvo.`,
   rotte:[
    {dove:'Meccanica<br>analitica', txt:R`Le equazioni di Hamilton sono le curve integrali del <b>campo hamiltoniano</b> sullo spazio delle fasi, che è una varietà. Il teorema di Liouville dice che quel flusso preserva il volume — un&rsquo;affermazione che ha senso solo in questo linguaggio.`},
    {dove:'Meccanica<br>statistica', txt:R`L&rsquo;<b>ipotesi ergodica</b> è un&rsquo;affermazione sulle curve integrali sulla superficie di energia costante: che una singola traiettoria visiti densamente la varietà. <b>Il quadro geometrico è questo</b>, e senza di esso l&rsquo;enunciato non si formula.`},
    {dove:'Relativita<br>generale', txt:R`Le <b>geodetiche</b> sono curve integrali di un campo sul fibrato tangente, e la questione della loro completezza — se esistono per ogni tempo proprio — <b>è</b> la definizione di singolarità dello spazio-tempo. I teoremi di Penrose-Hawking dicono che l&rsquo;incompletezza è inevitabile.`},
    {dove:'Sistemi<br>dinamici', txt:R`Punti fissi, orbite periodiche, attrattori, stabilita': tutta la teoria qualitativa e' lo studio delle curve integrali senza risolverle. <b>La linearizzazione attorno a un equilibrio</b> e' il differenziale di gd-06 applicato al campo.`}
   ],
   domanda:R`La soluzione di $\dot x=x^2$ esiste fino a $t=1/x_0$ e poi «esce dalla varietà». Ma in relatività generale le geodetiche incomplete non escono da nessuna parte: <b>lo spazio-tempo semplicemente finisce</b>. <b>Domanda che porti avanti:</b> che differenza c&rsquo;è fra una soluzione che scappa all&rsquo;infinito e una varietà che ha un buco? Formalmente nessuna — in entrambi i casi l&rsquo;intervallo massimale è limitato — e questo è esattamente il motivo per cui la definizione moderna di singolarità gravitazionale è <b>l&rsquo;incompletezza geodetica</b> e non «la curvatura diverge»: l&rsquo;unica cosa che si può affermare senza uscire dalla varietà è che il moto smette di essere definito.`}
]}

var byId = {}; TAPPE.forEach(function(s){ byId[s.num]=s; });

var VKEY='pm-nucleogd-13-visited';
function loadSeen(){ try{ return new Set(JSON.parse(localStorage.getItem(VKEY)||'[]')); }catch(e){ return new Set(); } }
function saveSeen(s){ try{ localStorage.setItem(VKEY, JSON.stringify(Array.from(s))); }catch(e){} }
var SEEN = loadSeen();

function renderNav(active){
  var nav=document.getElementById('sidebar');
  nav.innerHTML='';
  var h=document.createElement('h2'); h.textContent='Nucleo gd-13 · le tappe'; nav.appendChild(h);
  TAPPE.forEach(function(s){
    var b=document.createElement('button');
    b.className='navitem'+(active===s.num?' active':'')+(SEEN.has(s.num)?' seen':'');
    b.innerHTML='<span class="dot"></span><span class="nx">'+s.num+'</span><span>'+s.title+'</span>';
    b.onclick=function(){ showTappa(s.num); };
    nav.appendChild(b);
  });
}

/* ---- renderer dei blocchi ---- */
function sectionProsa(title, tag, html){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var body=elFromHTML('<div class="open-body">'+html+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function sectionGram(title, rows){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag gramtag">grammatica</span></h3>';
  var inner='<table class="gramtab">';
  rows.forEach(function(r){ inner+='<tr><td class="gs">'+r[0]+'</td><td>'+r[1]+'</td></tr>'; });
  inner+='</table>';
  var body=elFromHTML('<div class="gramwrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
/* --- blocco PLOT: la figura non decora, si legge. Ogni plot porta una chiave di lettura. --- */
function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';
  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
    else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
    else if(b.t==='prolessi') m.appendChild(sectionProlessi(b));
    else if(b.t==='reveal')m.appendChild(sectionReveal(b.title,b.tag,b.steps));
    else if(b.t==='esercizio') m.appendChild(sectionEsercizio(b));
    else if(b.t==='collaudo')  m.appendChild(sectionCollaudo(b.title,b.items));
    else if(b.t==='plot')      m.appendChild(sectionPlot(b));
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}
