  :root{

  .str{color:var(--gram);border-bottom:1px dashed var(--gram);cursor:pointer;}

  code{background:var(--panel2);border:1px solid var(--border);border-radius:5px;

  .katex{font-size:1.02em;color:var(--txt);} .katex-display{margin:.5em 0;overflow-x:auto;overflow-y:hidden;}

  @media(max-width:860px){

    .sidebar{width:100%;flex:none;position:static;max-height:none;border-right:none;

<script>
"use strict";
const R = String.raw;

function typeset(el){
  if(el && window.renderMathInElement){
    try{ renderMathInElement(el,{delimiters:[
      {left:'$$',right:'$$',display:true},
      {left:'$',right:'$',display:false}
    ],throwOnError:false}); }catch(e){}
  }
}
function elFromHTML(html){ var d=document.createElement('div'); d.innerHTML=html; return d; }

/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un
   rimando scritto nella prosa:

       <span class="str" data-str="serie-geometrica">la serie geometrica</span>

   Le schede citate da questo nucleo sono cucite qui sotto dal montaggio
   (assembla-nucleo.js): la pagina resta autosufficiente — niente fetch,
   niente sottocartelle da pubblicare — e un rimando a una scheda che non
   esiste FERMA la costruzione invece di arrivare in pagina rotto.
   Apertura: lo stesso gesto del collaudo (si clicca, il pannello compare,
   si typeset una volta sola), portato dentro la frase.
   =================================================================== */
var CORSO = 'geometria-differenziale';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["omeomorfismo"] = {"nome":"Omeomorfismo","riga":"Una biiezione continua con inversa continua: due spazi omeomorfi sono lo stesso spazio scritto in due modi, per tutto ciò che la topologia sa vedere.","serve":"È la nozione di «uguale» che si usa quando si dice che una varietà è localmente come $\\mathbb{R}^n$. La richiesta che anche l'inversa sia continua non è pignoleria: senza di essa una biiezione continua può incollare cose lontane — l'applicazione $t\\mapsto(\\cos 2\\pi t,\\sin 2\\pi t)$ da $[0,1)$ alla circonferenza è continua e biunivoca, ma la sua inversa spezza la circonferenza in un punto, e infatti $[0,1)$ e $S^1$ non sono lo stesso spazio (uno è compatto, l'altro no). Le proprietà che si conservano per omeomorfismo — compattezza, connessione, dimensione, gruppo fondamentale — sono esattamente quelle di cui si può parlare su una varietà senza aver scelto una carta.","esempio":"L'intervallo aperto $(0,1)$ e la semiretta $(0,+\\infty)$ sono omeomorfi tramite $f(x)=\\dfrac{x}{1-x}$: è continua su $(0,1)$, manda $0^+$ in $0^+$ e $1^-$ in $+\\infty$, e la sua inversa è $g(y)=\\dfrac{y}{1+y}$, anch'essa continua. Che siano davvero una l'inversa dell'altra si verifica componendo: $g(f(x))=\\dfrac{x/(1-x)}{1+x/(1-x)}=x$. Ne segue che $(0,1)$ è omeomorfo anche a tutto $\\mathbb{R}$ (componendo con $y\\mapsto\\ln y$), il che dice una cosa che all'inizio sorprende: **la lunghezza non è una proprietà topologica**. Non lo è nemmeno l'essere limitato; lo è invece la compattezza, ed è per questo che $[0,1]$ non è omeomorfo a nessuno dei due.","debito":"nessun movimento del percorso tratta la topologia generale come argomento a sé: qui c'è ciò che serve per leggere la definizione di varietà. La classificazione di quali spazi sono omeomorfi a quali è il mestiere della topologia algebrica, e nel corso di Diverio entra solo per la numerabilità del gruppo fondamentale.","controllo":[{"tipo":"uguale","sinistra":"(x/(1-x))/(1+x/(1-x))","vale":"x","ipotesi":{"x":"positive"},"dove":"esempio","appare":"=x"}]};
STRUM["compattezza"] = {"nome":"Compattezza","riga":"Ogni ricoprimento aperto ammette un sottoricoprimento finito: è la proprietà che permette di passare da «vale vicino a ogni punto» a «vale su tutto», con un numero finito di passi.","serve":"È l'ipotesi che rende globali le conclusioni locali, ed è per questo che ricorre in ogni dimostrazione di geometria differenziale. In $\\mathbb{R}^n$ equivale a chiuso e limitato (Heine-Borel), ma su una varietà quell'equivalenza non si può usare come definizione, perché «limitato» richiede una distanza e una varietà non ne ha una privilegiata. La conseguenza che si usa più spesso è negativa: gli unici sottoinsiemi di $\\mathbb{R}^n$ che sono **insieme** aperti e compatti sono $\\emptyset$ e nient'altro — ed è l'argomento per cui una varietà compatta non può essere coperta da una sola carta.","esempio":"L'intervallo $(0,1)$ non è compatto, e si vede esibendo un ricoprimento senza sottoricoprimento finito: gli aperti $A_n=\\left(\\tfrac1n,1\\right)$ per $n\\ge2$ ricoprono $(0,1)$, perché ogni $x\\gt0$ sta in $A_n$ appena $\\tfrac1n\\lt x$, cioè appena $n\\gt1/x$. Ma una sottofamiglia finita $A_{n_1},\\dots,A_{n_k}$ ha un indice massimo $N$, quindi la sua unione è $\\left(\\tfrac1N,1\\right)$, e il punto $x=\\tfrac1{2N}$ resta fuori: è positivo, dunque sta in $(0,1)$, ed è minore di $\\tfrac1N$. Il conto che regge l'argomento è $\\lim_{n\\to\\infty}\\tfrac1n=0$: gli $A_n$ si avvicinano a coprire tutto, ma nessuno di essi contiene un intorno di $0$, e servirebbero tutti. Chiudendo l'intervallo, $[0,1]$ diventa compatto e quel ricoprimento smette di essere un ricoprimento — $0$ non sta in nessun $A_n$.","debito":"la dimostrazione del teorema di Heine-Borel e la teoria generale degli spazi compatti stanno fuori dal percorso: qui c'è l'uso che se ne fa. Nel corso di Diverio la compattezza entra come ipotesi (sfera, gruppi di Lie compatti) e come conclusione della locale compattezza delle varietà.","controllo":[{"tipo":"limite","espr":"1/n","var":"n","a":"oo","vale":"0","ipotesi":{"n":"positive"},"dove":"esempio","appare":"\\lim_{n\\to\\infty}\\tfrac1n=0"},{"tipo":"disuguaglianza","sinistra":"1/(2*N)","destra":"1/N","relazione":"<","ipotesi":{"N":"positive"},"dove":"esempio","appare":"minore di $\\tfrac1N$"}]};
STRUM["quoziente-topologico"] = {"nome":"Topologia quoziente","riga":"Si incollano punti dichiarandoli uguali, e si decide che un insieme è aperto nel quoziente quando la sua controimmagine è aperta sopra: è il modo di costruire spazi nuovi senza metterli dentro nessun ambiente.","serve":"È la seconda fabbrica di varietà, accanto ai grafici e ai prodotti, e produce proprio gli esempi che non si vedono come sottoinsiemi di $\\mathbb{R}^n$: il toro, il nastro di Möbius, lo spazio proiettivo. La regola pratica è sempre la stessa: una funzione definita sul quoziente è continua se e solo se, composta con la proiezione, è continua sopra — quindi si lavora sempre con i rappresentanti, controllando che il risultato non dipenda da quale si è scelto. Attenzione: **un quoziente di una varietà non è automaticamente una varietà**, e la proprietà che salta per prima è Hausdorff — la retta con due origini è proprio un quoziente mal riuscito.","esempio":"La circonferenza è $\\mathbb{R}/\\mathbb{Z}$: si dichiarano uguali due numeri che differiscono per un intero, e si manda la classe di $t$ nel punto $\\left(\\cos 2\\pi t,\\ \\sin 2\\pi t\\right)$. Perché la definizione sia lecita il risultato non deve dipendere dal rappresentante, e infatti $\\cos\\!\\left(2\\pi(t+1)\\right)=\\cos 2\\pi t$ e altrettanto per il seno: la mappa passa al quoziente. Ripetendo su due fattori si ottiene il toro $\\mathbb{T}^2=\\mathbb{R}^2/\\mathbb{Z}^2$, cioè il quadrato $[0,1]^2$ con i lati opposti incollati — lo spazio delle configurazioni del pendolo doppio, dove i due angoli sono definiti a meno di un giro. Le carte si prendono restringendo la proiezione a un quadratino di lato minore di $1$: lì è iniettiva, e la sua inversa dà le coordinate.","debito":"la verifica che il quoziente sia Hausdorff e a base numerabile va fatta caso per caso e qui non c'è: per il toro e per lo spazio proiettivo la si trova in Lee, Examples 1.4 e 1.5. Nel percorso, l'unico movimento che costruisce quozienti in dettaglio è gd-01.","controllo":[{"tipo":"uguale","sinistra":"cos(2*pi*(t+1))","vale":"cos(2*pi*t)","ipotesi":{"t":"real"},"dove":"esempio","appare":"\\cos\\!\\left(2\\pi(t+1)\\right)=\\cos 2\\pi t"},{"tipo":"simbolico","perche":"e' la notazione del quoziente di R^2 per il reticolo degli interi: si sta dando un nome allo spazio costruito, non calcolando un valore","dove":"esempio","appare":"\\mathbb{R}^2/\\mathbb{Z}^2"}]};

function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';
  return h;
}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;

/* ---------------- 00 · DI COSA PARLA QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Di cosa parla questo movimento', meta:'Geometria Differenziale · voci G.13, R.5 · il cuore del corso',
  blocchi:[
  {t:'prosa', title:'Il problema, detto bene', tag:'architettura', html:R`
  <p>Su una superficie dentro $\mathbb{R}^3$ un vettore tangente è una freccia: sta nello spazio ambiente ed è tangente alla superficie. <b>Su una varietà astratta quella descrizione non è disponibile</b>: non c&rsquo;è ambiente, e una freccia «che esce» non ha dove andare.</p>
  <p>Eppure il vettore tangente serve: è la velocità di una curva, è la direzione lungo cui derivare, è il dato iniziale di un&rsquo;equazione differenziale. <b>Bisogna definirlo usando solo ciò che c&rsquo;è sulla varietà</b> — cioè le funzioni lisce e le curve.</p>
  <p>Diverio dà due definizioni e mostra che coincidono. <b>Non è pedanteria</b>: la prima è quella che si usa per <i>capire</i>, la seconda quella che si usa per <i>dimostrare</i>, e la terza (in coordinate) quella che si usa per <i>calcolare</i>. Saper passare dall&rsquo;una all&rsquo;altra è il mestiere di questo corso.</p>`}

/* ---------------- 01 · LE DUE DEFINIZIONI ---------------- */
{ num:'01', title:'Velocita di curve, e derivazioni', meta:'la classe di equivalenza di curve · la regola di Leibniz · e perche coincidono',
  blocchi:[
  {t:'reveal', title:'Le due strade', tag:'costruzione', steps:[
   {label:'Prima: le velocita delle curve', body:R`
   <p>Si considerano le curve lisce $\gamma:(-\epsilon,\epsilon)\to M$ con $\gamma(0)=p$, e si dicono <b>equivalenti</b> due curve che, lette in una carta, hanno la stessa derivata in $0$. <b>Un vettore tangente è una classe di equivalenza</b>, e $T_pM$ è l&rsquo;insieme delle classi.</p>
   <p>La condizione non dipende dalla carta: cambiando carta si compone con una transizione, e la regola della catena moltiplica entrambe le derivate per la stessa jacobiana. <b>È il solito schema di gd-04, e qui è il passaggio che rende la definizione lecita.</b></p>
   <p><b>Il vantaggio</b>: è intuitiva, dice che un vettore è «una direzione con una velocità». <b>Lo svantaggio</b>: che $T_pM$ sia uno spazio <i>vettoriale</i> non si vede — sommare due classi di curve non ha senso ovvio.</p>`},
   {label:'Seconda: le derivazioni', body:R`
   <p>Una <b>derivazione</b> in $p$ è un&rsquo;applicazione lineare $v$ dalle funzioni lisce ai numeri che soddisfa la regola di Leibniz:
   $$v(fg)=v(f)\,g(p)+f(p)\,v(g).$$
   <b>È la caratterizzazione algebrica di «derivata direzionale»</b>: lineare e con la regola del prodotto. Si definisce $T_pM$ come lo spazio delle derivazioni.</p>
   <p><b>Il vantaggio è immediato</b>: le derivazioni si sommano e si moltiplicano per scalari, quindi $T_pM$ <b>è</b> uno spazio vettoriale senza bisogno di dimostrarlo. <b>Lo svantaggio</b>: sembra non avere niente a che fare con le frecce.</p>`},
   {label:'Perche sono la stessa cosa', body:R`
   <p>A una curva $\gamma$ si associa la derivazione $f\mapsto\frac{d}{dt}\big|_0 f(\gamma(t))$: derivare $f$ lungo la curva. <b>La corrispondenza è biiettiva</b>, e la dimostrazione non banale è la suriettività: ogni derivazione viene da una curva. Si fa in carta, mostrando che una derivazione è determinata dai suoi valori sulle funzioni coordinate.</p>
   <p><b>Un dettaglio tecnico che vale la pena notare</b>: la dimostrazione usa che una funzione liscia si scrive $f(x)=f(p)+\sum(x^i-p^i)g_i(x)$ con $g_i$ lisce (lemma di Hadamard), e per applicarla globalmente servono le <b>bump function di gd-05</b>. È il primo posto in cui la tappa precedente viene consumata davvero.</p>`}
  ]},
  {t:'prosa', title:'Perche i germi', tag:'idea', html:R`
  <p>Diverio lavora con i <b>germi</b>: due funzioni lisce definiscono lo stesso germe in $p$ se coincidono su un intorno di $p$. La ragione è che una derivazione è un oggetto <b>locale</b> — dipende solo dal comportamento di $f$ vicino a $p$ — e i germi sono il modo di dirlo senza giri di parole.</p>
  <p><b>Che sia davvero locale va dimostrato</b>, e la prova è graziosa: se $f\equiv0$ su un intorno $U$ di $p$, si prende una bump $\psi$ che vale $1$ fuori da $U$ e $0$ vicino a $p$; allora $f=\psi f$ ovunque, e per Leibniz $v(f)=v(\psi)f(p)+\psi(p)v(f)=0$. <b>Le bump servono anche qui</b>, e questo è il motivo per cui gd-05 viene prima.</p>`}
]},

/* ---------------- 02 · LA BASE COORDINATA ---------------- */
{ num:'02', title:'La base coordinata, e la dimensione', meta:'i vettori d/dx^i · dim T_pM = dim M · e come cambiano le componenti',
  blocchi:[
  {t:'prosa', title:'La base, e il cambio di base', tag:'grammatica', html:R`
  <p>In una carta $(U,\varphi)$ con coordinate $x^1,\dots,x^n$ si definiscono le derivazioni
  $$\left.\frac{\partial}{\partial x^{i}}\right|_p:\ f\ \longmapsto\ \frac{\partial(f\circ\varphi^{-1})}{\partial x^{i}}(\varphi(p)),$$
  cioè «derivo rispetto alla $i$-esima coordinata, leggendo $f$ in carta». <b>Sono $n$ derivazioni indipendenti e generano tutto</b>: quindi $\dim T_pM=\dim M$, e ogni vettore si scrive $v=\sum v^{i}\frac{\partial}{\partial x^{i}}$.</p>
  <p><b>Cambiando carta la base cambia</b>, e le componenti si trasformano con la <b>jacobiana della transizione</b>:
  $$\tilde v^{j}=\sum_i\frac{\partial\tilde x^{j}}{\partial x^{i}}\,v^{i}.$$
  <b>Questa formula è la definizione fisica di «vettore controvariante»</b>: in relatività e in meccanica analitica si <i>definisce</i> un vettore come un oggetto che si trasforma così. Qui non è una definizione: è un <b>teorema</b>, e l&rsquo;oggetto è stato costruito prima, senza coordinate.</p>
  <div class="note"><b>Il punto di vista che questo corso insegna e che vale la pena portare via</b>: in fisica si dice «un vettore è ciò che si trasforma come un vettore», e sembra una circolarità. Qui si vede che non lo è: il vettore esiste come derivazione, indipendentemente da ogni carta, e la legge di trasformazione è <i>conseguenza</i> del cambio di base. <b>Le due frasi dicono la stessa cosa, ma solo una delle due spiega perché.</b></div>`}
]},

/* ---------------- 03 · IL DIFFERENZIALE ---------------- */
{ num:'03', title:'Il differenziale: la jacobiana senza coordinate', meta:'la definizione · in carta e la matrice jacobiana · la regola della catena · lesempio delle polari',
  blocchi:[
  {t:'prosa', title:'La definizione e il calcolo', tag:'costruzione', html:R`
  <p>Data $F:M\to N$ liscia e $p\in M$, il <b>differenziale</b> $dF_p:T_pM\to T_{F(p)}N$ si definisce su una derivazione $v$ così:
  $$dF_p(v)(f)=v(f\circ F).$$
  In parole: <b>per derivare $f$ lungo l&rsquo;immagine, si deriva $f\circ F$ lungo l&rsquo;originale</b>. Sulle curve l&rsquo;interpretazione è ancora più semplice: la velocità della curva immagine.</p>
  <p><b>In coordinate, $dF_p$ è la matrice jacobiana</b> di $\psi\circ F\circ\varphi^{-1}$ nel punto. Quindi tutta l&rsquo;algebra lineare che si conosce si applica: rango, nucleo, immagine, invertibilità. E la <b>regola della catena</b> diventa $d(G\circ F)_p=dG_{F(p)}\circ dF_p$: la composizione di mappe corrisponde al prodotto di matrici. <b>È l&rsquo;enunciato più pulito della regola della catena che si possa dare</b>, e non contiene indici.</p>
  <p><b>L&rsquo;esempio da avere in mano</b>: il passaggio a coordinate polari $F(r,\theta)=(r\cos\theta,\ r\sin\theta)$ ha jacobiana
  $$dF=\begin{pmatrix}\cos\theta&-r\sin\theta\\ \sin\theta&r\cos\theta\end{pmatrix},$$
  con l&rsquo;entrata in alto a destra che è $-r\sin\theta$ e determinante che <b>vale $r$</b>. Il determinante si annulla in $r=0$: lì le polari non sono una carta, ed è la ragione per cui l&rsquo;origine va sempre esclusa. <b>Lo stesso $r$ è il fattore che compare nell&rsquo;integrale doppio in polari</b> — il determinante jacobiano di Analisi Vettoriale è questo differenziale.</p>`}
]},

/* ---------------- 04 · IMMERSIONI, SUBMERSIONI, RANGO ---------------- */
{ num:'04', title:'Immersioni, submersioni e rango costante', meta:'le definizioni · i due teoremi di forma normale · e la figura otto',
  blocchi:[
  {t:'prosa', title:'Le definizioni, e cosa dicono davvero', tag:'grammatica', html:R`
  <p>Si classifica $F$ in base al <b>rango</b> di $dF_p$:</p>
  <ul>
   <li><b>immersione</b>: $dF_p$ è <b>iniettivo</b> per ogni $p$. Localmente $F$ «infila» $M$ dentro $N$ senza schiacciarla;</li>
   <li><b>submersione</b>: $dF_p$ è <b>suriettivo</b> per ogni $p$. Localmente $F$ proietta $M$ su $N$;</li>
   <li><b>rango costante</b>: $\operatorname{rk}dF_p$ non dipende da $p$ (le prime due sono casi particolari).</li>
  </ul>
  <p><b>Il teorema del rango costante</b> dice che in quei casi esistono carte in cui $F$ si scrive nella <b>forma più semplice possibile</b>:
  $$(x^1,\dots,x^n)\ \longmapsto\ (x^1,\dots,x^k,0,\dots,0).$$
  <b>Cioè: a meno di cambi di coordinate, una mappa di rango costante è una proiezione seguita da un&rsquo;inclusione.</b> È il teorema più potente della tappa: riduce lo studio locale di qualunque mappa di rango costante a un&rsquo;unica forma normale.</p>
  <p>Due corollari che si usano continuamente: se $dF_p$ è <b>invertibile</b>, $F$ è un diffeomorfismo locale (<b>teorema di invertibilità locale</b> — e si vede subito perché $t\mapsto t^3$ di gd-04 fallisce in $0$); se $F$ è una submersione, le sue <b>fibre</b> sono sottovarietà, ed è il ponte con gd-08.</p>`},
  {t:'prosa', title:'La figura otto: immersione si, sottovarieta no', tag:'idea', html:R`
  <p>La curva $\gamma(t)=(\sin2t,\ \sin t)$ su $(-\pi,\pi)$ disegna una <b>figura a otto</b>. La sua velocità è $(2\cos 2t,\ \cos t)$, che <b>non si annulla mai</b> — le due componenti non hanno zeri comuni — quindi $\gamma$ è un&rsquo;<b>immersione iniettiva</b>.</p>
  <p><b>Eppure l&rsquo;immagine non è una sottovarietà</b>: nel punto di incrocio ogni intorno ha quattro rami, e non è omeomorfo a un intervallo. L&rsquo;errore sta nel credere che «immersione iniettiva» implichi «l&rsquo;immagine è una sottovarietà»: <b>manca una condizione topologica</b>, e la curva la viola perché i due estremi del dominio si avvicinano allo stesso punto dell&rsquo;immagine.</p>
  <p>La condizione che manca è la <b>propriezza</b>, ed è il contenuto di gd-09. <b>Questo esempio è il motivo per cui quel movimento esiste</b>: senza, si crederebbe che immergere basti.</p>`},
  {t:'plot', title:'La figura otto: velocita mai nulla, e un punto che rovina tutto',
   intro:R`La curva $(\sin 2t,\ \sin t)$ per $t\in(-\pi,\pi)$: iniettiva, con velocità mai nulla, e con un&rsquo;immagine che non è una sottovarietà.`,
   plots:[
    {kind:'curve', x:'sin(2*t)', y:'sin(t)', tr:[-3.1416,3.1416], xr:[-1.4,1.4], yr:[-1.3,1.3],

     marks:[{x:0, y:0, label:'qui lintorno ha quattro rami', col:'#ff6b6b'},
            {x:1, y:0.7071, label:'t = pi/4', col:'#5eead4'}]}
   ],
   leggi:R`<b>La curva è liscia, iniettiva, e la sua velocità non si annulla mai</b>: tutte le condizioni «differenziali» sono soddisfatte. Il problema è <i>topologico</i> e sta tutto nell&rsquo;origine: la curva ci passa una volta sola come punto del dominio, ma i valori $t\to\pm\pi$ si avvicinano a quello stesso punto dell&rsquo;immagine. Quindi <b>la mappa non è un omeomorfismo sull&rsquo;immagine</b>, e l&rsquo;immagine non eredita la struttura.<br><br>
   <b>La lezione da portare avanti</b>: le condizioni sul differenziale controllano il comportamento <i>locale</i> nel dominio, e non dicono nulla su come l&rsquo;immagine si richiude su se stessa. Ogni volta che in questo corso si vuole concludere qualcosa <b>sull&rsquo;immagine</b>, serve un&rsquo;ipotesi topologica in più — ed è sempre la stessa: la propriezza.`}
]},

/* ---------------- 04b · LA TERZA DEFINIZIONE, E PERCHE SONO TRE ---------------- */
{ num:'04b', title:'La terza definizione, e perche i libri ne danno tre', meta:'le derivazioni · le curve · le componenti con legge di trasformazione · quale conviene quando',
  blocchi:[
  {t:'prosa', title:'Tre definizioni dello stesso oggetto', tag:'architettura', html:R`
  <p>Il vettore tangente è definito, nei testi, in tre modi diversi. <b>Sono equivalenti</b>, e nessuno dei tre è «il vero»: ciascuno è comodo per cose diverse, e sapere passare dall&rsquo;uno all&rsquo;altro vale più che padroneggiarne uno solo.</p>
  <ul>
   <li><b>come classe di curve</b>: due curve passanti per $p$ sono equivalenti se in una carta — cioè attraverso un <span class="str" data-str="omeomorfismo">omeomorfismo</span> su un aperto euclideo — hanno la stessa derivata in quel punto. È la definizione più intuitiva — un vettore è una velocità — e la più comoda per <i>costruire</i> vettori: basta esibire una curva;</li>
   <li><b>come derivazione</b>: un&rsquo;applicazione lineare $v$ dalle funzioni lisce ai reali che soddisfa la regola di Leibniz $v(fg)=f(p)v(g)+g(p)v(f)$. È la definizione più astratta e la più comoda per <i>dimostrare</i>: non nomina carte, quindi tutto ciò che si prova con essa è automaticamente indipendente dalle coordinate;</li>
   <li><b>come $n$-upla di componenti con legge di trasformazione</b>: un vettore è un elenco di numeri $(v^{1},\dots,v^{n})$ associato a una carta, con la regola che cambiando carta le componenti diventano $\tilde v^{i}=\sum_j\frac{\partial\tilde x^{i}}{\partial x^{j}}v^{j}$. È la definizione dei fisici, ed è la più comoda per <i>calcolare</i>.</li>
  </ul>
  <p><b>Il fatto che le tre siano equivalenti non è ovvio e va dimostrato</b>, ed è il contenuto tecnico del movimento. L&rsquo;equivalenza fra curve e derivazioni richiede il lemma di Hadamard; quella fra derivazioni e componenti è il conto che identifica la base coordinata. <b>Ogni testo sceglie una delle tre come definizione e dimostra le altre due come teoremi</b>: Lee parte dalle derivazioni, molti corsi italiani dalle curve, i testi di fisica dalle componenti. Sapere che sono la stessa cosa permette di leggere qualunque libro senza restare spiazzati dalla prima pagina.</p>
  <p><b>La terza è quella che in relatività generale compare per prima</b>, spesso nella forma «un vettore è un oggetto che si trasforma come un vettore», che agli studenti di matematica suona circolare e non lo è: è la definizione per <i>proprietà di trasformazione</i>, e dice esattamente quale insieme di numeri merita quel nome. La sua equivalenza con le altre due è il contenuto della tappa 02 di questo movimento, dove si è visto che le componenti nella base coordinata si trasformano proprio con la jacobiana della transizione.</p>`},
  {t:'reveal', title:'Come si passa da una allaltra, in pratica', tag:'metodo', steps:[
   {label:'Da curva a derivazione', body:R`
   <p>Data una curva $\gamma$ con $\gamma(0)=p$, la derivazione associata è</p>
   $$v(f)=\left.\frac{d}{dt}\right|_{t=0}f(\gamma(t)),$$
   <p>cioè «deriva $f$ lungo la curva». La regola di Leibniz si eredita dalla regola del prodotto per le funzioni di una variabile: $\frac{d}{dt}(fg)(\gamma(t))=f\dot g+g\dot f$, valutata in $t=0$. <b>Non c&rsquo;è niente da verificare che non sia il calcolo di base</b>, ed è il motivo per cui questa direzione è sempre facile.</p>`},
   {label:'Da derivazione a componenti', body:R`
   <p>Fissata una carta, si applicano la derivazione alle funzioni coordinate: $v^{i}=v(x^{i})$. Questi $n$ numeri determinano $v$ completamente, perché ogni funzione liscia si scrive (localmente, per il lemma di Hadamard) come</p>
   $$f(x)=f(p)+\sum_i (x^{i}-p^{i})\,h_i(x),\qquad h_i(p)=\frac{\partial f}{\partial x^{i}}(p),$$
   <p>e applicando $v$ e usando Leibniz i termini si semplificano lasciando $v(f)=\sum_i v^{i}\frac{\partial f}{\partial x^{i}}(p)$. <b>È questo conto che dimostra che $\{\partial/\partial x^{i}\}$ è una base</b>, e quindi che $\dim T_pM=n$.</p>
   <p><b>Il punto tecnico nascosto</b>, che è anche il motivo per cui la definizione con le derivazioni funziona solo nel caso liscio: il lemma di Hadamard richiede $C^{\infty}$. Se si lavorasse con funzioni $C^{k}$, lo spazio delle derivazioni risulterebbe di dimensione <b>infinita</b>, e la teoria si romperebbe. <b>È una delle ragioni serie per cui si chiede la levigatezza infinita</b> e non ci si accontenta di $C^{1}$.</p>`},
   {label:'Da componenti a curva', body:R`
   <p>Il verso più semplice: date le componenti $(v^{i})$ in una carta $\varphi$, si prende la curva</p>
   $$\gamma(t)=\varphi^{-1}\left(\varphi(p)+t\,v\right),$$
   <p>cioè un segmento letto in carta e riportato sulla varietà. <b>Esiste sempre</b>, almeno per $t$ abbastanza piccolo da restare dentro $\varphi(U)$ — che è aperto, quindi contiene un intorno del punto — ed è la ragione per cui la corrispondenza fra vettori e classi di curve è suriettiva. Non è unica: infinite curve hanno la stessa velocità, e infatti la definizione è per classi di equivalenza.</p>
   <p><b>Questa costruzione è più utile di quanto sembri</b>, perché è il modo standard di trasformare un problema «esiste una curva con la proprietà tale?» in un problema di analisi in $\mathbb{R}^{n}$. Riapparirà con le curve integrali di un campo di vettori, dove l'esistenza locale sarà garantita dal teorema di Cauchy letto in carta — con la stessa identica mossa: si scende in carta, si usa un teorema di analisi, si risale.</p>`}
  ]},
  {t:'prosa', title:'Perche non si puo dire che un vettore e una freccia', tag:'first principles', html:R`
  <p>Su una superficie immersa in $\mathbb{R}^{3}$ un vettore tangente si disegna come una freccia che parte dal punto e giace nel piano tangente. <b>Quell&rsquo;immagine è corretta e non è una definizione</b>, per una ragione che vale la pena rendere esplicita: la freccia vive nello <i>spazio ambiente</i>, e una varietà astratta non ne ha uno.</p>
  <p>Due conseguenze pratiche, entrambe da tenere ferme:</p>
  <ul>
   <li><b>gli spazi tangenti in punti diversi sono spazi vettoriali diversi</b>, e non c&rsquo;è nessun modo canonico di identificarli. Non ha senso chiedersi se il vettore $v\in T_pM$ e il vettore $w\in T_qM$ siano «uguali» o «paralleli»: la domanda richiede una struttura in più — una connessione — che questo corso non introduce. <b>Sommarli è un errore, non un&rsquo;imprecisione</b>;</li>
   <li><b>non esiste «il vettore che punta verso un altro punto»</b>. In $\mathbb{R}^{n}$ si può, perché lo spazio è anche un gruppo e i punti si sottraggono; su una varietà no. È la stessa ragione per cui in relatività generale non si può dire che due velocità misurate in eventi lontani formino un certo angolo.</li>
  </ul>
  <p><b>Su una varietà <span class="str" data-str="compattezza">compatta</span> questa mancanza ha conseguenze visibili</b>: non potendo confrontare spazi tangenti lontani, non si può nemmeno «pettinare» in modo coerente un campo di vettori, e infatti sulla sfera ogni campo tangente continuo si annulla da qualche parte. Su una varietà non compatta il problema spesso non si pone, perché c&rsquo;è spazio per scappare all&rsquo;infinito.</p>
  <p><b>L&rsquo;unica struttura che c&rsquo;è, e basta per quasi tutto</b>, è che ciascun $T_pM$ è uno spazio vettoriale di dimensione $n$ e che la collezione di tutti gli spazi tangenti si incolla in modo liscio — cosa che sarà il fibrato tangente, il passo successivo. <b>La geometria differenziale è in buona parte l&rsquo;arte di fare senza l&rsquo;identificazione che in $\mathbb{R}^{n}$ si ha gratis</b>, e chi porta con sé l&rsquo;immagine della freccia senza questa avvertenza sbaglia proprio nei punti in cui il corso è interessante.</p>`}
]},

/* ---------------- 04c · ESERCIZI ---------------- */
{ num:'04c', title:'Esercizi — tocca a te', meta:'il tangente alla sfera calcolato in due modi · il differenziale del determinante · e le coordinate polari',
  blocchi:[
  {t:'esercizio', title:'1 · Lo spazio tangente alla sfera, per due strade',
   src:'il confronto fra il metodo astratto e quello con lambiente',
   testo:R`Calcola $T_pS^{2}$ per $p\in S^{2}\subset\mathbb{R}^{3}$ in due modi: (a) come sottospazio di $\mathbb{R}^{3}$, usando che $S^{2}$ è un insieme di livello; (b) usando la carta stereografica. Verifica che danno lo stesso.`,
   steps:[
    {label:'Con lambiente', body:R`
    <p>$S^{2}=F^{-1}(1)$ con $F(x)=|x|^{2}$. Una curva $\gamma$ sulla sfera soddisfa $|\gamma(t)|^{2}=1$; derivando in $t=0$:</p>
    $$2\,\langle\gamma(0),\dot\gamma(0)\rangle=0\quad\Longrightarrow\quad \dot\gamma(0)\perp p.$$
    <p>Quindi $T_pS^{2}=\{v\in\mathbb{R}^{3}:\langle v,p\rangle=0\}=p^{\perp}$, <b>il piano ortogonale al raggio</b>, di dimensione $2$. Vale la pena notare che l'inclusione «$\subseteq$» è quella appena dimostrata, mentre «$\supseteq$» richiede di esibire, per ogni $v\perp p$, una curva sulla sfera con quella velocità — e basta il cerchio massimo $\gamma(t)=p\cos(|v|t)+\frac{v}{|v|}\sin(|v|t)$, che sta sulla sfera e ha $\dot\gamma(0)=v$. <b>Le due inclusioni si dimostrano con tecniche diverse</b>: una derivando il vincolo, l'altra costruendo curve, ed è tipico dei conti sugli spazi tangenti. <b>La regola generale che ne esce</b>: per un insieme di livello di $F$, lo spazio tangente è il <i>nucleo del differenziale</i> $\ker dF_p$ — qui il nucleo di $v\mapsto2\langle p,v\rangle$.</p>`},
    {label:'Con la carta', body:R`
    <p>Nella carta stereografica $\varphi_N$ i vettori tangenti sono generati da $\partial/\partial u^{1}$ e $\partial/\partial u^{2}$: due vettori, quindi dimensione $2$. <b>Il conto è più rapido ma dà meno informazione</b>: dice la dimensione e una base, non dice «quale piano di $\mathbb{R}^{3}$» — perché in quel linguaggio $\mathbb{R}^{3}$ non esiste.</p>
    <p>Per confrontare si deve calcolare $d\iota$, il differenziale dell'inclusione $\iota:S^{2}\hookrightarrow\mathbb{R}^{3}$, e applicarlo ai due vettori della base: si ottengono due vettori di $\mathbb{R}^{3}$ ortogonali a $p$, che generano $p^{\perp}$. <b>Le due risposte coincidono, come devono</b>, e la morale è pratica: <b>quando c'è un ambiente conviene usarlo</b>, perché dà una descrizione concreta; quando non c'è, le carte bastano comunque.</p>`}
   ]},
  {t:'plot', title:'Il piano tangente come approssimazione, e come spazio a se',
   intro:R`La superficie $z=x^{2}-y^{2}$ con il piano tangente nel punto $(0{,}7,\,0{,}5)$. Trascina per ruotare: il piano tocca la superficie in un punto solo e la attraversa altrove, perché la sella ha curvature di segno opposto.`,
   plots:[
    {kind:'surface3d', f:'x*x-y*y', xr:[-1.6,1.6], yr:[-1.6,1.6], n:40, height:350,
     tangent:{x0:0.7, y0:0.5, span:0.7},
     title:'la superficie e il suo piano tangente: contatto del primo ordine'}
   ],
   leggi:R`<p><b>Il piano tangente approssima la superficie al primo ordine</b>: vicino al punto di contatto la differenza fra i due va a zero più rapidamente della distanza. È la definizione di differenziabilità, vista in tre dimensioni.</p>
   <p>Ma la figura mostra anche il limite dell'immagine, ed è la ragione per cui il corso non la usa come definizione. <b>Questo piano è disegnato dentro $\mathbb{R}^{3}$</b>, e la sua posizione — inclinata così, appoggiata lì — è informazione sull'immersione, non sulla superficie. Una superficie astratta ha lo stesso spazio tangente senza avere nessun piano dove metterlo.</p>
   <p>Nota infine che il piano <b>attraversa</b> la superficie invece di restarle da una parte: succede perché la sella curva verso l'alto in una direzione e verso il basso nell'altra. In un punto di massimo il piano resterebbe tutto sopra, in uno di minimo tutto sotto. <b>Quella distinzione è il segno della forma quadratica seconda</b>, e appartiene alla geometria con metrica — cioè al capitolo che questo corso non apre. <b>Il tangente vede solo il primo ordine, e del primo ordine non sa dire se si sta salendo su una collina o attraversando una sella.</b></p>`},
  {t:'esercizio', title:'2 · Il differenziale del determinante, e lalgebra di Lie di SL(n)',
   src:'il conto che lega questo movimento ai gruppi di matrici',
   testo:R`Calcola $d(\det)_I$, il differenziale del determinante nell'identità, e usalo per determinare lo spazio tangente a $SL(n,\mathbb{R})$ nell'identità.`,
   steps:[
    {label:'Il differenziale', body:R`
    <p>Si usa la definizione con le curve. Prendendo $\gamma(t)=I+tH$, che per $t$ piccolo sta in $GL(n)$:</p>
    $$\det(I+tH)=1+t\,\mathrm{tr}(H)+O(t^{2}),$$
    <p>perché nello sviluppo del determinante il termine lineare in $t$ raccoglie esattamente la somma dei minori diagonali, cioè la traccia. Derivando in $t=0$:</p>
    $$d(\det)_I(H)=\mathrm{tr}(H).$$
    <p><b>È uno dei conti più usati di tutta la matematica applicata</b>, e conviene ricordarlo nella forma generale $d(\det)_A(H)=\det(A)\,\mathrm{tr}(A^{-1}H)$, che per $A=I$ si riduce a questa. Si incontra ovunque compaia un cambio di variabili: la derivata del determinante jacobiano che governa come cambiano i volumi, l'equazione di Liouville in meccanica statistica, la formula per la variazione del determinante della metrica in relatività.</p>`},
    {label:'Lo spazio tangente', body:R`
    <p>$SL(n)=\det^{-1}(1)$, e lo spazio tangente è il nucleo del differenziale:</p>
    $$T_I\,SL(n)=\{H:\mathrm{tr}(H)=0\},$$
    <p>le matrici a <b>traccia nulla</b>. La dimensione è $n^{2}-1$, in accordo con il conto del rango già fatto. <b>Questo spazio si chiama $\mathfrak{sl}(n)$</b> ed è l'algebra di Lie del gruppo: tutta l'informazione infinitesima del gruppo è lì dentro.</p>
    <p><b>Lo stesso metodo dà $\mathfrak{o}(n)$</b>: derivando $A^{T}A=I$ lungo una curva $\gamma(t)$ con $\gamma(0)=I$ e $\dot\gamma(0)=H$ si ottiene $\dot\gamma^{T}\gamma+\gamma^{T}\dot\gamma=0$, che in $t=0$ dà $H^{T}+H=0$: le matrici <b>antisimmetriche</b>, di dimensione $\frac{n(n-1)}{2}$. Per $n=3$ sono tre parametri, e infatti una matrice antisimmetrica $3\times3$ si identifica con un vettore — il vettore velocità angolare, che è esattamente il modo in cui le rotazioni infinitesime compaiono in meccanica. <b>Vincolo simmetrico, tangente antisimmetrico</b>: è la regola che conviene tenere a mente, e che si ritrova ogni volta che un gruppo è definito da una forma bilineare da preservare.</p>`}
   ]},
  {t:'collaudo', title:'Controlla di aver capito', html:R`
  <ol>
  <li>Perché $\partial/\partial x^{i}$ dipende da tutta la carta e non solo dalla coordinata $x^{i}$?</li>
  <li>Il differenziale $dF_p$ è definito fra quali spazi, e perché non ha senso parlare della «matrice jacobiana di $F$» senza altro?</li>
  <li>Due varietà diffeomorfe hanno spazi tangenti isomorfi. Vale il viceversa?</li>
  </ol>`,
   sol:R`<ol>
   <li>Perché $\partial/\partial x^{1}$ significa «derivare rispetto a $x^{1}$ <b>tenendo fisse le altre coordinate</b>», e quali siano le altre dipende dalla carta. Cambiando le coordinate $x^{2},\dots,x^{n}$ ma lasciando $x^{1}$ invariata, il vettore $\partial/\partial x^{1}$ <b>cambia</b>. <b>È l'errore più comune del corso</b>, e la notazione lo favorisce: il simbolo nomina una sola coordinata e dipende da tutte. In relatività generale lo stesso equivoco genera confusione sulla differenza fra «derivata parziale» e «derivata covariante».</li>
   <li>Fra $T_pM$ e $T_{F(p)}N$, ed è un'applicazione <b>lineare fra spazi vettoriali astratti</b>. La matrice jacobiana è la sua rappresentazione <i>rispetto a due basi coordinate</i>, una in partenza e una in arrivo: cambiando carte la matrice cambia (per coniugio con le jacobiane delle transizioni) mentre l'applicazione lineare resta la stessa. <b>Il differenziale è l'oggetto, la jacobiana è la sua scrittura</b> — e questo è il motivo per cui il rango, che non dipende dalle basi, è una nozione geometrica.</li>
   <li><b>No, e clamorosamente no</b>: ogni varietà di dimensione $n$ ha tutti gli spazi tangenti isomorfi a $\mathbb{R}^{n}$, quindi la sfera e il toro — quest'ultimo costruibile come <span class="str" data-str="quoziente-topologico">quoziente</span> del piano, la prima no — hanno spazi tangenti isomorfi senza essere diffeomorfi. <b>Lo spazio tangente in un punto non sa niente della forma globale</b>: è un oggetto puramente locale, e tutta l'informazione interessante sta in <i>come</i> gli spazi tangenti si incollano al variare del punto. È esattamente questo il contenuto del fibrato tangente, e il motivo per cui esiste il movimento successivo.</li>
   </ol>`}
]},

/* ---------------- 05 · IL SENSO ---------------- */
{ num:'05', title:'Il senso, e le rotte', meta:'cosa apre, e dove il tangente riappare',
  blocchi:[
  {t:'prosa', title:'Cosa lascia in mano', tag:'sintesi', html:R`
  <p><b>Il punto.</b> Un vettore non è una freccia: è un <b>operatore di derivazione</b>. Questa sostituzione — da oggetto geometrico a oggetto algebrico — è ciò che rende possibile fare geometria senza ambiente, e si ripete a ogni livello: i campi vettoriali saranno derivazioni delle funzioni (gd-07), le parentesi di Lie saranno commutatori di derivazioni (gd-12), i flussi saranno esponenziali di derivazioni (gd-15).</p>
  <p><b>A valle.</b> gd-07 mette insieme tutti i $T_pM$ e ne fa una varietà; gd-08 usa il rango per riconoscere sottovarietà; gd-12 studia cosa succede quando due derivazioni non commutano.</p>`},
  {t:'prolessi', title:'Dove riappare questo movimento',
   oggetto:R`<b>Il vettore tangente come derivazione</b>, e il differenziale come approssimazione lineare senza coordinate.`,
   rotte:[
    {dove:'Meccanica<br>analitica', txt:R`Le <b>velocità generalizzate</b> $\dot q$ sono vettori tangenti allo spazio delle configurazioni, e la lagrangiana è una funzione sul <b>fibrato tangente</b> (gd-07). Il passaggio a $p=\partial L/\partial\dot q$ porta al fibrato <i>co</i>tangente, ed è la ragione geometrica per cui hamiltoniana e lagrangiana vivono su spazi diversi.`},
    {dove:'Relativita<br>generale', txt:R`La <b>quadrivelocità</b> è un vettore tangente allo spazio-tempo, e il fatto che i vettori vivano in spazi tangenti <i>diversi</i> in punti diversi è la ragione per cui confrontarli richiede una connessione — e da lì la curvatura.`},
    {dove:'Sistemi<br>dinamici', txt:R`Un sistema dinamico è un campo vettoriale: a ogni stato si assegna la <b>velocità con cui evolve</b>. La linearizzazione attorno a un equilibrio è il differenziale, e i suoi autovalori decidono la stabilità.`},
    {dove:'Ottimizzazione', txt:R`Il <b>gradiente</b> su una varietà ha senso solo con una metrica, ma il <b>differenziale</b> no: e' definito sempre. La distinzione fra i due — covariante e controvariante — nasce esattamente qui, e in ottimizzazione decide se un algoritmo e' indipendente dalla parametrizzazione.`}
   ],
   domanda:R`Lo spazio tangente in punti diversi è uno spazio vettoriale diverso: <b>non c&rsquo;è nessun modo canonico di confrontare un vettore in $p$ con uno in $q$</b>. In $\mathbb{R}^n$ sembra si possa (si traslano le frecce), ma quella è una struttura in più dello spazio euclideo, non della varietà. <b>Domanda che porti avanti:</b> che cosa serve per trasportare un vettore da un punto a un altro? La risposta è una <b>connessione</b>, la sua ambiguità lungo cammini diversi è la <b>curvatura</b>, e in fisica quell&rsquo;ambiguità è la fase di Berry e il campo di gauge. <b>Nel corso di Diverio non ci sono</b>: questo è precisamente il punto in cui il programma si ferma, e da cui parte la geometria riemanniana.`}
]}

];

/* ---- renderer dei blocchi ---- */
function sectionProsa(title, tag, html){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var body=elFromHTML('<div class="open-body">'+html+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function sectionGram(title, rows){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag gramtag">grammatica</span></h3>';
  var inner='<table class="gramtab">';
  rows.forEach(function(r){ inner+='<tr><td class="gs">'+r[0]+'</td><td>'+r[1]+'</td></tr>'; });
  inner+='</table>';
  var body=elFromHTML('<div class="gramwrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
/* --- blocco PLOT: la figura non decora, si legge. Ogni plot porta una chiave di lettura. --- */
function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';
  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
    else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
    else if(b.t==='prolessi') m.appendChild(sectionProlessi(b));
    else if(b.t==='reveal')m.appendChild(sectionReveal(b.title,b.tag,b.steps));
    else if(b.t==='esercizio') m.appendChild(sectionEsercizio(b));
    else if(b.t==='collaudo')  m.appendChild(sectionCollaudo(b.title,b.items));
    else if(b.t==='plot')      m.appendChild(sectionPlot(b));
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}
