/* ===================================================================

   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che

var CORSO = 'geometria-differenziale';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["classe-di-equivalenza"] = {"nome":"Classe di equivalenza e quoziente","riga":"Una relazione $\\sim$ riflessiva, simmetrica e transitiva spezza un insieme $X$ in classi disgiunte $[x]=\\{y\\in X:y\\sim x\\}$, e l'insieme delle classi e' il quoziente $X/\\!\\sim$.","serve":"E' il modo di DEFINIRE un oggetto che non si puo' esibire. Quando di una cosa si sa riconoscere quando due rappresentanti sono la stessa, ma non si ha un rappresentante privilegiato da indicare, si definisce l'oggetto come la classe stessa. Diverio lo dice cosi' nelle note sullo spazio tangente: e' lo stesso trucco con cui si definisce una direzione nel piano come classe di rette parallele — nessuna retta e' LA direzione, e la direzione e' tutte quelle rette insieme. Da li' viene la definizione del vettore tangente: su una varieta' non c'e' nessuna freccia da disegnare, quindi la velocita' di una curva si definisce come la classe di tutte le curve che le somigliano al primo ordine. La stessa mossa costruisce lo spazio proiettivo, il toro come quoziente del piano, i germi di funzioni e i gruppi quoziente.","esempio":"Su $\\mathbb{Z}$ si ponga $a\\sim b$ quando $3$ divide $a-b$. Le classi sono tre — $[0]$, $[1]$, $[2]$ — e sono disgiunte e coprono tutto $\\mathbb{Z}$, che e' sempre il caso: un quoziente e' una PARTIZIONE. Sul quoziente $\\mathbb{Z}/3\\mathbb{Z}$ la somma $[a]+[b]=[a+b]$ e' ben definita, e ben definita vuol dire che il risultato non dipende dal rappresentante scelto: presi $a'=4$ al posto di $a=1$ e $b'=5$ al posto di $b=2$, si ha $a'+b'=9$ e $a+b=3$, e le due classi coincidono perche' $3$ divide $9-3$. E' la verifica che si deve fare ogni volta che si definisce qualcosa su un quoziente, ed e' l'unica: il Lemma 3.3 delle note di Diverio — la velocita' di una curva non dipende dalla carta — e' esattamente questa verifica fatta per i vettori tangenti.","debito":"la topologia quoziente, cioe' come si rende continua la proiezione $\\pi:X\\to X/\\!\\sim$, sta nella scheda `quoziente-topologico`; qui si guarda la sola struttura insiemistica, che e' quella che serve per definire un vettore tangente.","controllo":[{"tipo":"uguale","sinistra":"Mod(4 + 5, 3)","vale":"Mod(1 + 2, 3)","dove":"esempio","appare":"$a'+b'=9$ e $a+b=3$"},{"tipo":"uguale","sinistra":"Mod(9 - 3, 3)","vale":"0","dove":"esempio","appare":"$3$ divide $9-3$"},{"tipo":"simbolico","dove":"esempio","appare":"[a]+[b]=[a+b]","perche":"e' la DEFINIZIONE della somma sul quoziente, cioe' la regola che si propone; che sia ben posta e' il contenuto delle due asserzioni che seguono, non di questa riga"}]};
STRUM["sommersione"] = {"nome":"Sommersione","riga":"Un'applicazione liscia $F:M\\to N$ il cui differenziale e surgettivo in ogni punto, cosa che richiede $\\dim M\\ge\\dim N$ e rende ogni fibra una sottovarieta.","serve":"a schiacciare una varieta su una di dimensione minore senza perdere struttura: in coordinate adatte una sommersione e sempre la proiezione $(x_1,\\dots,x_m)\\mapsto(x_1,\\dots,x_n)$, e questo rende locale ogni domanda su di essa. E la meta in uscita della coppia immersione/sommersione: l'immersione inietta il tangente, la sommersione lo proietta. Insieme danno il teorema del rango costante, che riduce lo studio locale di qualunque mappa di rango fisso a un'unica forma normale.","esempio":"$F:\\mathbb{R}^3\\to\\mathbb{R}^2$, $F(x,y,z)=(x^2+y^2+z^2-1,\\ z)$. Le due righe della jacobiana sono $(2x,2y,2z)$ e $(0,0,1)$, perche $\\partial_x(x^2+y^2+z^2-1)=2x$ e la seconda componente dipende da $z$ sola. Il minore sulle colonne $x$ e $z$ ha determinante $2x$: dove $x\\neq0$ il rango e $2$ e $F$ e una sommersione. Nel punto $(1,0,0)$ quel determinante vale $2$, quindi li $F$ e sommersione e la fibra $F^{-1}(0,0)$, la circonferenza equatoriale nel piano $z=0$, e una sottovarieta di dimensione $3-2=1$.","pieno":{"file":"gd-06-spazio-tangente.html","tappa":"07","come":"immersioni, sommersioni e il teorema del rango costante, con la forma normale"},"controllo":[{"tipo":"derivata","espr":"x**2+y**2+z**2-1","rispetto":["x"],"vale":"2*x","dove":"esempio","appare":"\\partial_x(x^2+y^2+z^2-1)=2x"},{"tipo":"uguale","sinistra":"Matrix([[2*x,2*z],[0,1]]).det()","vale":"2*x","dove":"esempio","appare":"ha determinante $2x$"},{"tipo":"uguale","sinistra":"Matrix([[2*1,2*0],[0,1]]).det()","vale":"2","dove":"esempio","appare":"quel determinante vale $2$"},{"tipo":"uguale","sinistra":"3-2","vale":"1","dove":"esempio","appare":"3-2=1"}]};
STRUM["valore-regolare"] = {"nome":"Valore regolare","riga":"$c$ e un valore regolare di $F:M\\to N$ quando il differenziale $dF_p$ e surgettivo in ogni punto di $F^{-1}(c)$, e in quel caso $F^{-1}(c)$ e una sottovarieta di dimensione $\\dim M-\\dim N$.","serve":"a riconoscere una sottovarieta senza esibire carte: si scrive l'insieme come luogo di zeri, si deriva, e si controlla che il differenziale non degeneri. E il criterio operativo per eccellenza, perche gli insiemi interessanti arrivano quasi sempre dati da equazioni. Attenzione al quantificatore: la richiesta e su tutti i punti della fibra, non su un punto scelto bene, e un valore non e regolare quando anche un solo punto della sua controimmagine e critico. Un valore fuori dall'immagine e regolare per vacuita, e la fibra vuota conta come sottovarieta.","esempio":"La sfera $S^2$ come fibra di $F(x,y,z)=x^2+y^2+z^2$. Le derivate parziali sono $\\partial_xF=2x$, $\\partial_yF=2y$, $\\partial_zF=2z$, dunque $dF_p=(2x,2y,2z)$ si annulla solo nell'origine, che sta in $F^{-1}(0)$ e non in $F^{-1}(1)$. Quindi $1$ e un valore regolare e la fibra $F^{-1}(1)$, che e la sfera, e una sottovarieta di dimensione $3-1=2$; mentre $0$ non lo e, e infatti $F^{-1}(0)$ e un punto solo. Lo stesso conto su $SL(2,\\mathbb{R})=\\det^{-1}(1)$: con $\\det=ad-bc$ si ha $\\partial_a\\det=d$, e nell'identita il differenziale vale $(1,0,0,1)\\neq0$, dunque $SL(2,\\mathbb{R})$ e una sottovarieta di $\\mathbb{R}^4$ di dimensione $4-1=3$.","pieno":{"file":"gd-08-valori-regolari.html","tappa":"02","come":"il teorema del valore regolare, l'uso in tre righe, e i gruppi di matrici"},"controllo":[{"tipo":"derivata","espr":"x**2+y**2+z**2","rispetto":["x"],"vale":"2*x","dove":"esempio","appare":"\\partial_xF=2x"},{"tipo":"derivata","espr":"x**2+y**2+z**2","rispetto":["y"],"vale":"2*y","dove":"esempio","appare":"\\partial_yF=2y"},{"tipo":"derivata","espr":"x**2+y**2+z**2","rispetto":["z"],"vale":"2*z","dove":"esempio","appare":"\\partial_zF=2z"},{"tipo":"uguale","sinistra":"3-1","vale":"2","dove":"esempio","appare":"3-1=2"},{"tipo":"derivata","espr":"a*d-b*c","rispetto":["a"],"vale":"d","dove":"esempio","appare":"\\partial_a\\det=d"},{"tipo":"uguale","sinistra":"4-1","vale":"3","dove":"esempio","appare":"4-1=3"}]};
STRUM["applicazione-propria"] = {"nome":"Applicazione propria","riga":"$F$ e propria quando la controimmagine di ogni compatto e compatta, ed e la condizione topologica che trasforma un'immersione iniettiva in un'immersione di sottovarieta.","serve":"a impedire che l'immagine si avvicini a se stessa senza toccarsi. Un'immersione iniettiva ha differenziale iniettivo in ogni punto e non identifica mai due punti, e cio nonostante la sua immagine puo non essere una sottovarieta: basta che due pezzi lontani nel dominio abbiano immagini arbitrariamente vicine. La propriezza lo vieta, perche un compatto dell'arrivo non puo avere controimmagine che fugge verso il bordo del dominio. Su un dominio compatto e automatica, ed e per questo che le patologie vivono tutte su domini aperti.","esempio":"La figura a otto $\\gamma(t)=(\\sin 2t,\\ \\sin t)$ su $(-\\pi,\\pi)$. E un'immersione, perche la velocita $(2\\cos 2t,\\ \\cos t)$ non si annulla mai: $\\cos t=0$ forza $t=\\pm\\pi/2$, e in $t=\\pi/2$ si ha $2\\cos 2t=-2\\neq0$. Ed e iniettiva. Ma non e propria: per $t\\to\\pi^-$ si ha $\\sin 2t\\to0$ e $\\sin t\\to0$, dunque la curva torna verso l'origine, che e anche $\\gamma(0)$. La controimmagine di un disco chiuso attorno all'origine contiene allora dei $t$ vicini a $\\pm\\pi$, e non e chiusa in $(-\\pi,\\pi)$: non e compatta. L'immagine non e una sottovarieta, perche nell'incrocio ogni intorno ha quattro rami.","pieno":{"file":"gd-09-immersioni-whitney.html","tappa":"01","come":"le applicazioni proprie come la condizione che mancava, col controesempio della figura a otto"},"controllo":[{"tipo":"limite","espr":"sin(2*t)","var":"t","a":"pi","verso":"-","vale":"0","dove":"esempio","appare":"\\sin 2t\\to0"},{"tipo":"limite","espr":"sin(t)","var":"t","a":"pi","verso":"-","vale":"0","dove":"esempio","appare":"\\sin t\\to0"},{"tipo":"uguale","sinistra":"2*cos(2*(pi/2))","vale":"-2","dove":"esempio","appare":"2\\cos 2t=-2"},{"tipo":"uguale","sinistra":"cos(pi/2)","vale":"0","dove":"esempio","appare":"\\cos t=0"}]};
STRUM["quoziente-topologico"] = {"nome":"Topologia quoziente","riga":"Si incollano punti dichiarandoli uguali, e si decide che un insieme è aperto nel quoziente quando la sua controimmagine è aperta sopra: è il modo di costruire spazi nuovi senza metterli dentro nessun ambiente.","serve":"È la seconda fabbrica di varietà, accanto ai grafici e ai prodotti, e produce proprio gli esempi che non si vedono come sottoinsiemi di $\\mathbb{R}^n$: il toro, il nastro di Möbius, lo spazio proiettivo. La regola pratica è sempre la stessa: una funzione definita sul quoziente è continua se e solo se, composta con la proiezione, è continua sopra — quindi si lavora sempre con i rappresentanti, controllando che il risultato non dipenda da quale si è scelto. Attenzione: **un quoziente di una varietà non è automaticamente una varietà**, e la proprietà che salta per prima è Hausdorff — la retta con due origini è proprio un quoziente mal riuscito.","esempio":"La circonferenza è $\\mathbb{R}/\\mathbb{Z}$: si dichiarano uguali due numeri che differiscono per un intero, e si manda la classe di $t$ nel punto $\\left(\\cos 2\\pi t,\\ \\sin 2\\pi t\\right)$. Perché la definizione sia lecita il risultato non deve dipendere dal rappresentante, e infatti $\\cos\\!\\left(2\\pi(t+1)\\right)=\\cos 2\\pi t$ e altrettanto per il seno: la mappa passa al quoziente. Ripetendo su due fattori si ottiene il toro $\\mathbb{T}^2=\\mathbb{R}^2/\\mathbb{Z}^2$, cioè il quadrato $[0,1]^2$ con i lati opposti incollati — lo spazio delle configurazioni del pendolo doppio, dove i due angoli sono definiti a meno di un giro. Le carte si prendono restringendo la proiezione a un quadratino di lato minore di $1$: lì è iniettiva, e la sua inversa dà le coordinate.","debito":"la verifica che il quoziente sia Hausdorff e a base numerabile va fatta caso per caso e qui non c'è: per il toro e per lo spazio proiettivo la si trova in Lee, Examples 1.4 e 1.5. Nel percorso, l'unico movimento che costruisce quozienti in dettaglio è function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

{ num:'00', title:'Di cosa parla questo movimento', meta:'Geometria Differenziale · voci G.13, R.5 · lezioni 8 e 9 · il cuore del corso',

  {t:'prosa', title:'Il problema, detto bene', tag:'architettura', html:R`
  <p>Su una superficie dentro $\mathbb{R}^3$ un vettore tangente è una freccia: sta nello spazio ambiente ed è tangente alla superficie. <b>Su una varietà astratta quella descrizione non è disponibile</b>: non c&rsquo;è ambiente, e una freccia «che esce» non ha dove andare. Peggio: su $M$ non si possono nemmeno sottrarre due punti, quindi il limite $\lim_{t\to0}\frac{\gamma(t)-p}{t}$ che definirebbe la velocità non si scrive.</p>
  <p>Eppure il vettore tangente serve, ed è la cosa di cui il resto del corso è fatto: è la velocità di una curva, è la direzione lungo cui derivare, è il dato iniziale di un&rsquo;equazione differenziale. <b>Bisogna definirlo usando solo ciò che c&rsquo;è sulla varietà</b> — cioè le curve, e le carte.</p>
  <p><b>La risposta, e vale la pena anticiparla perché è tutto il movimento</b>: su $M$ non c&rsquo;è nessuna freccia da disegnare, quindi si definisce la velocità di $\gamma$ come <i>ciò che tutte le curve con la stessa velocità hanno in comune</i> — cioè la <span class="str" data-str="classe-di-equivalenza">classe</span> di $\gamma$ stessa. È il trucco con cui si definisce una direzione nel piano come classe di rette parallele: nessuna retta è la direzione, e la direzione è tutte quelle rette insieme.</p>
  <div class="note"><b>Una nota sulla fonte, perché qui conta più del solito.</b> Il libro del corso è <b>Lee</b>, e Lee definisce il vettore tangente come <i>derivazione</i>. Diverio su questo punto si stacca dal libro e lo dichiara: «we follow our textbook quite closely, and whenever we depart from it you will find written notes like these. The tangent space is one of these occasions». Questo movimento segue le sue note. Le derivazioni ci sono, ma dove le mette lui — alla fine, come anticipazione di un isomorfismo che il corso dimostrerà più avanti.</div>`}
]},

{ num:'01', title:'Dalla retta tangente alla velocita: il programma in tre ingredienti', meta:'la migliore approssimazione lineare · il punto di vista cinematico · e cosa sopravvive su una varieta',
  blocchi:[
  {t:'prosa', title:'La retta tangente, e in che senso e la migliore', tag:'first principles', html:R`
  <p>Si parte da dove l&rsquo;intuizione funziona. Sia $f:I\to\mathbb{R}$ liscia, $\Gamma_f$ il suo grafico, $x_0\in I$ e $P=(x_0,f(x_0))$. La retta tangente a $\Gamma_f$ in $P$ è
  $$y=f(x_0)+f'(x_0)(x-x_0),$$
  e <b>«migliore approssimazione lineare» ha un senso preciso</b>, che conviene enunciare perché è l&rsquo;unico contenuto della frase. Per la formula di Taylor
  $$f(x)=f(x_0)+f'(x_0)(x-x_0)+O\big((x-x_0)^{2}\big),$$
  quindi mettendo $x$ nell&rsquo;equazione della retta invece che in $f$ si commette un errore <b>del secondo ordine</b>. Qualunque altra retta per $P$, con pendenza $m\neq f'(x_0)$, fa peggio: l&rsquo;errore vale $(f'(x_0)-m)(x-x_0)+O\big((x-x_0)^{2}\big)$, cioè è <b>del primo ordine</b>. <b>La tangente è l&rsquo;unica retta per $P$ il cui errore sparisce più in fretta della distanza</b>, e non c&rsquo;è niente di più da capire nella parola «tangente».</p>`},
  {t:'prosa', title:'Lo stesso oggetto, guardato come un moto', tag:'idea', html:R`
  <figure class="fig-nota">
   <img src="gd-06-fig-01.svg" alt="Il grafico di f, la retta tangente in P, una curva c(t) che ci passa sopra e la sua velocita c'(0)">
   <figcaption><b>Che cosa guardare.</b> Un punto si muove lungo il grafico e passa per $P$ al tempo $t=0$. <b>Qualunque sia il moto</b> — veloce, lento, avanti, indietro — la sua velocità punta lungo la retta tangente. Il disegno dice la cosa che la formula di Taylor non dice: la retta tangente non è una proprietà di $f$ soltanto, è <i>l&rsquo;insieme di tutte le velocità possibili</i> di tutti i moti che passano di lì.
   <span class="fonte">Figura di S. Diverio, note del corso 2026/27, ri-colorata.</span></figcaption>
  </figure>
  <p>Si consideri dunque una curva liscia $c:(-\varepsilon,\varepsilon)\to\mathbb{R}^2$ con $c(t)\in\Gamma_f$ per ogni $t$ e $c(0)=P$. Poiché la traiettoria sta sul grafico, si scrive $c(t)=\big(c_1(t),f(c_1(t))\big)$, e derivando con la regola della catena
  $$c'(0)=\big(\dot c_1(0),\ f'(x_0)\,\dot c_1(0)\big)=\dot c_1(0)\cdot\big(1,\ f'(x_0)\big).$$
  <b>Qualunque sia il moto, la velocità è un multiplo del vettore $(1,f'(x_0))$</b>, che è il vettore direttore della retta tangente. E viceversa ogni multiplo si realizza: basta percorrere il grafico alla velocità giusta.</p>
  <div class="note"><b>Per chi pensa in fisica.</b> Una pallina scorre senza attrito su un filo rigido piegato nella forma di $\Gamma_f$. Qualunque forza agisca, la pallina può muoversi <i>solo lungo il filo</i>, quindi la sua velocità è sempre tangente. La retta tangente è l&rsquo;insieme di tutte le velocità che la pallina può avere passando per $P$: niente di più, niente di meno.</div>`},
  {t:'prosa', title:'I tre ingredienti, e quale dei tre non sopravvive', tag:'architettura', html:R`
  <p>Guardando che cosa è servito per costruire la retta tangente a partire dai moti, si trovano <b>tre ingredienti</b>, e conviene separarli perché solo uno dà problemi:</p>
  <ol>
   <li><b>le curve che giacciono sull&rsquo;oggetto.</b> Ha senso su qualunque varietà: una curva su $M$ è semplicemente un&rsquo;applicazione liscia $\gamma:(-\varepsilon,\varepsilon)\to M$. <b>Nessun problema</b>;</li>
   <li><b>la derivata di una curva.</b> Qui si rompe: $\gamma$ ha valori in $M$, e in $M$ non si sottraggono punti, quindi $\lim_{t\to0}\frac{\gamma(t)-p}{t}$ <b>non si può scrivere</b>;</li>
   <li><b>il confronto fra moti diversi.</b> Si vuole poter dire che due curve «hanno la stessa velocità», e nel caso del grafico questo si leggeva confrontando due numeri.</li>
  </ol>
  <p>Il punto (2) è l&rsquo;unico ostacolo, e la via d&rsquo;uscita è quella che il corso usa da gd-02 in poi: <b>non si sa derivare su $M$, ma si sa derivare in carta</b>. Il programma di tutto il movimento è allora una frase sola: <b>lo spazio tangente in $p$ sarà l&rsquo;insieme di tutte le velocità possibili, in $p$, di tutti i moti possibili su $M$</b> — e «velocità» verrà definita passando per una carta, dopo aver verificato che la definizione non dipende dalla carta scelta.</p>`}
]},

/* ---------------- 02 · LA DEFINIZIONE ---------------- */
{ num:'02', title:'La definizione: curve a contatto del primo ordine', meta:'il Lemma 3.3 · la classe di equivalenza · il contatto del primo ordine come o(t)',
  blocchi:[
  {t:'prosa', title:'Il confronto in carta, e che non dipende dalla carta', tag:'teorema', html:R`
  <p>Una <b>curva per $p$</b> è un&rsquo;applicazione liscia $\gamma:(-\varepsilon,\varepsilon)\to M$ con $\gamma(0)=p$. L&rsquo;$\varepsilon$ non è fissato una volta per tutte: ogni curva porta il suo, e restringerlo non cambia niente di ciò che ci interessa, perché tutto accade vicino a $t=0$ — <b>si restringerà tacitamente ogni volta che serve</b>, per esempio per far stare la curva dentro il dominio di una carta.</p>
  <p>Se $(U,\varphi)$ è una carta in $p$, allora $\varphi\circ\gamma$ è una curva liscia in $\mathbb{R}^n$ definita per $|t|$ piccolo, e la sua velocità ordinaria $(\varphi\circ\gamma)'(0)\in\mathbb{R}^n$ <b>ha senso</b>. L&rsquo;idea naturale è dichiarare che due curve hanno la stessa velocità quando le loro immagini in carta ce l&rsquo;hanno. Prima di poterlo fare va controllato che non dipenda dalla carta, <b>altrimenti si starebbe definendo una proprietà delle carte e non di $M$</b>.</p>
  <p><b>Lemma (3.3 delle note).</b> Siano $\gamma_1,\gamma_2$ curve per $p$ e $(U,\varphi)$, $(V,\psi)$ carte in $p$. Se $(\varphi\circ\gamma_1)'(0)=(\varphi\circ\gamma_2)'(0)$, allora anche $(\psi\circ\gamma_1)'(0)=(\psi\circ\gamma_2)'(0)$.</p>
  <p><b>Dimostrazione.</b> Per $|t|$ piccolo $\gamma_i(t)\in U\cap V$, e là
  $$\psi\circ\gamma_i=(\psi\circ\varphi^{-1})\circ(\varphi\circ\gamma_i),$$
  dove la transizione $\psi\circ\varphi^{-1}$ è liscia fra aperti di $\mathbb{R}^n$. Adesso si è in $\mathbb{R}^n$, e la regola della catena ordinaria dà
  $$(\psi\circ\gamma_i)'(0)=J_{\psi\circ\varphi^{-1}}(\varphi(p))\ (\varphi\circ\gamma_i)'(0),\qquad i=1,2.$$
  <b>Le due velocità vengono moltiplicate per la stessa matrice</b>, quindi se erano uguali restano uguali. $\blacksquare$</p>
  <p><b>Questa è esattamente la verifica che ogni definizione per classi richiede</b>, e vale la pena riconoscerla come tale: è la stessa mossa che su $\mathbb{Z}/3\mathbb{Z}$ controlla che la somma non dipenda dal rappresentante.</p>`},
  {t:'prosa', title:'La definizione, e la figura che la spiega', tag:'grammatica', html:R`
  <p>Si pone allora $\gamma_1\sim\gamma_2$ quando, in una carta qualunque in $p$, le due hanno la stessa velocità — e per il lemma «in una» equivale a «in tutte». È una relazione di equivalenza.</p>
  <p><b>Definizione (3.4).</b> Lo <b>spazio tangente</b> a $M$ in $p$ è
  $$T_{M,p}=\{\text{curve per }p\}\big/\!\sim,$$
  e un <b>vettore tangente</b> è una classe $[\gamma]$.</p>
  <figure class="fig-nota">
   <img src="gd-06-fig-02.svg" alt="Un aperto U di R^n, due curve per p, e le loro velocita a e b disegnate come frecce">
   <figcaption><b>Che cosa guardare, e serve come termine di paragone.</b> Qui l&rsquo;aperto sta dentro $\mathbb{R}^{n}$, quindi le due velocità <b>si disegnano</b>: sono frecce vere, applicate in $p$, e il limite $\lim_{t\to0}\frac{c(t)-p}{t}$ si calcola perché i punti si sottraggono. <b>Tutto il movimento serve a recuperare questo disegno dove l&rsquo;ambiente non c&rsquo;è</b>, e la figura che segue mostra che cosa si perde.
   <span class="fonte">Figura di S. Diverio, note del corso 2026/27, ri-colorata.</span></figcaption>
  </figure>
  <figure class="fig-nota">
   <img src="gd-06-fig-03.svg" alt="La varieta M con un aperto U, due curve gamma1 e gamma2 per p, e la carta phi che le manda in R^n dove hanno la stessa freccia rossa">
   <figcaption><b>Che cosa guardare, ed è il cuore della costruzione.</b> A sinistra, su $M$, <b>non c&rsquo;è nessuna freccia disegnata</b> — e non è una mancanza del disegno: non c&rsquo;è proprio dove metterla. Le due curve $\gamma_1$ e $\gamma_2$ sono diverse. A destra, lette attraverso $\varphi$, hanno la stessa velocità ordinaria: la freccia rossa. <b>Il vettore tangente $[\gamma_1]=[\gamma_2]$ è la classe di tutte le curve che da quel lato danno quella freccia</b>, e la freccia vive in $\mathbb{R}^n$, non su $M$.
   <span class="fonte">Figura di S. Diverio, note del corso 2026/27, ri-colorata.</span></figcaption>
  </figure>
  <p>Da adesso si scriverà anche $\gamma'(0)=[\gamma]$: è la notazione che diventerà comoda quando si differenzieranno le mappe, e per ora si tiene $[\gamma]$ perché ricorda che si sta maneggiando una <i>classe</i>.</p>`},
  {t:'prosa', title:'Che cosa vuol dire davvero «stessa velocita»', tag:'idea', html:R`
  <p>Due osservazioni che costano poco e tolgono due dubbi ricorrenti.</p>
  <p><b>(a) Conta solo ciò che succede vicino a $t=0$.</b> Se due curve coincidono per $|t|$ piccolo hanno la stessa velocità; in particolare restringere l&rsquo;$\varepsilon$ non cambia il vettore tangente. <b>Il vettore tangente è un oggetto locale nel tempo</b>, non una proprietà della traiettoria intera.</p>
  <p><b>(b) «Stessa velocità» significa contatto del primo ordine.</b> In una carta, $\gamma_1\sim\gamma_2$ se e solo se
  $$\big\|\varphi(\gamma_1(t))-\varphi(\gamma_2(t))\big\|=o(t)\qquad (t\to0),$$
  e lo si vede sviluppando entrambe al primo ordine: partono dallo stesso punto $\varphi(p)$, quindi la differenza è $\big((\varphi\circ\gamma_1)'(0)-(\varphi\circ\gamma_2)'(0)\big)t+o(t)$, e si annulla più in fretta di $t$ esattamente quando le due derivate coincidono. <b>In parole: i due punti in movimento lasciano $p$ insieme, e cominciano a separarsi solo al second&rsquo;ordine.</b> È la stessa nozione di «migliore approssimazione» della tappa 01, spostata dalla retta alla curva.</p>
  <div class="note"><b>Il caso che chiude il cerchio.</b> Se $M=U$ è un aperto di $\mathbb{R}^n$ si può prendere la carta identica, e la definizione restituisce esattamente la velocità ordinaria: $T_{U,p}$ si identifica con $\mathbb{R}^n$. <b>La costruzione astratta non ha cambiato nulla dove già sapevamo la risposta</b>, ed è l&rsquo;unico modo di sapere che è quella giusta.</div>`}
]},

/* ---------------- 03 · LA CARTA LEGGE I VETTORI ---------------- */
{ num:'03', title:'La carta legge i vettori: la biiezione, e la struttura di spazio vettoriale', meta:'theta_phi e il Lemma 4.1 · il Lemma 4.2 e la jacobiana · la Proposizione 4.3 e lunicita',
  blocchi:[
  {t:'prosa', title:'La lettura in carta, e che e biiettiva', tag:'teorema', html:R`
  <p>Fissata una carta $(U,\varphi)$ in $p$, si definisce
  $$\theta_\varphi([\gamma])=(\varphi\circ\gamma)'(0),\qquad \theta_\varphi:T_{M,p}\to\mathbb{R}^n.$$
  <b>È la lettura del vettore tangente attraverso quella carta</b>, e il simbolo merita un nome proprio perché da qui in poi regge tutto.</p>
  <p><b>Lemma (4.1).</b> $\theta_\varphi$ è ben definita e biiettiva.</p>
  <p><b>Dimostrazione.</b> Ben definita e <i>iniettiva</i> per la definizione stessa di $\sim$: due curve hanno la stessa immagine sotto $\theta_\varphi$ esattamente quando sono equivalenti — l&rsquo;iniettività non è un teorema, è la relazione letta al rovescio. Per la <i>suriettività</i> si prende $a\in\mathbb{R}^n$: poiché $\varphi(U)$ è aperto, il punto $\varphi(p)+ta$ gli appartiene per $|t|<\varepsilon$ con $\varepsilon$ piccolo, e
  $$\gamma_a(t)=\varphi^{-1}\big(\varphi(p)+ta\big)$$
  è una curva per $p$ — liscia, perché $\varphi^{-1}$ è liscia. Allora $\varphi\circ\gamma_a(t)=\varphi(p)+ta$ e $\theta_\varphi([\gamma_a])=a$. $\blacksquare$</p>
  <p><b>$\gamma_a$ è la curva che, vista in carta, è il moto rettilineo con velocità $a$</b>: è la risposta standard a «esibisci una curva con quella velocità», e tornerà ogni volta che servirà costruire un vettore invece di riconoscerlo.</p>`},
  {t:'prosa', title:'Due carte, due letture, e la jacobiana che le lega', tag:'teorema', html:R`
  <p>Attenzione a una differenza che è facile perdere: <b>la relazione $\sim$ non dipende dalla carta, ma la biiezione $\theta_\varphi$ sì</b>. Lo stesso vettore tangente ha in generale immagini diverse sotto $\theta_\varphi$ e $\theta_\psi$. La buona notizia è che si sa esattamente come sono legate.</p>
  <p><b>Lemma (4.2).</b> Per due carte $(U,\varphi)$ e $(V,\psi)$ in $p$,
  $$\theta_\psi\circ\theta_\varphi^{-1}=J_{\psi\circ\varphi^{-1}}(\varphi(p)),$$
  cioè le due letture differiscono per la <b>matrice jacobiana del cambio di carte</b> nel punto. In particolare $\theta_\psi\circ\theta_\varphi^{-1}:\mathbb{R}^n\to\mathbb{R}^n$ è un <b>isomorfismo lineare</b>.</p>
  <p><b>Dimostrazione.</b> È il conto del Lemma 3.3 riletto: $\theta_\psi([\gamma])=(\psi\circ\gamma)'(0)=J_{\psi\circ\varphi^{-1}}(\varphi(p))\,\theta_\varphi([\gamma])$. E la jacobiana di un diffeomorfismo è invertibile. $\blacksquare$</p>
  <figure class="fig-nota">
   <img src="gd-06-fig-04.svg" alt="Lo stesso vettore tangente letto in due carte: a in quella di phi, b in quella di psi, legati dalla jacobiana del cambio">
   <figcaption><b>Che cosa guardare.</b> Un solo oggetto su $M$ — la classe $[\gamma]$ — e <b>due numeri diversi</b>, $a$ a sinistra e $b$ a destra. Non è un&rsquo;ambiguità: è il fatto che un vettore non <i>è</i> una $n$-upla, ma diventa una $n$-upla appena si sceglie una carta. Il passaggio dall&rsquo;una all&rsquo;altra è lineare e invertibile, ed è precisamente perché è <b>lineare</b> che nella prossima proposizione le somme e i multipli non dipendono dalla scelta.
   <span class="fonte">Figura di S. Diverio, note del corso 2026/27, ri-colorata.</span></figcaption>
  </figure>`},
  {t:'prosa', title:'La struttura di spazio vettoriale, e perche ce ne una sola', tag:'teorema', html:R`
  <p>Finora $T_{M,p}$ è solo un insieme. Adesso diventa uno spazio vettoriale, e il modo in cui lo diventa è istruttivo.</p>
  <p><b>Proposizione (4.3).</b> Esiste <b>una e una sola</b> struttura di spazio vettoriale reale su $T_{M,p}$ tale che, per ogni carta $(U,\varphi)$ in $p$, la biiezione $\theta_\varphi$ sia un isomorfismo lineare. In particolare $\dim T_{M,p}=n=\dim M$.</p>
  <p><b>Dimostrazione.</b> Si fissa <i>una</i> carta $\varphi$ e si trasporta la struttura di $\mathbb{R}^n$:
  $$v+w=\theta_\varphi^{-1}\big(\theta_\varphi(v)+\theta_\varphi(w)\big),\qquad \lambda v=\theta_\varphi^{-1}\big(\lambda\,\theta_\varphi(v)\big).$$
  Con queste operazioni $T_{M,p}$ è uno spazio vettoriale — tutti gli assiomi si ereditano da $\mathbb{R}^n$ — e $\theta_\varphi$ è lineare per costruzione. Sia ora $(V,\psi)$ un&rsquo;altra carta: per il Lemma 4.2
  $$\theta_\psi=\big(\theta_\psi\circ\theta_\varphi^{-1}\big)\circ\theta_\varphi=J_{\psi\circ\varphi^{-1}}(\varphi(p))\circ\theta_\varphi$$
  è composizione di due isomorfismi lineari, quindi è un isomorfismo lineare anch&rsquo;essa. <b>Equivalentemente: avendo usato $\psi$ al posto di $\varphi$ si sarebbero ottenute la stessa somma e gli stessi multipli.</b> L&rsquo;unicità è chiara, perché già la richiesta che <i>una sola</i> $\theta_\varphi$ sia lineare determina le operazioni. $\blacksquare$</p>
  <p><b>La morale, ed è il punto da portare via</b>: ogni carta offre un modo di leggere i vettori tangenti come $n$-uple; carte diverse danno letture diverse; <b>ma tutte differiscono per cambi lineari di coordinate, e un cambio lineare non cambia il significato di somme e multipli.</b> È per questo che la struttura è unica.</p>`},
  {t:'prosa', title:'Le operazioni senza carte, e la somma vista in carta', tag:'idea', html:R`
  <p>Vale la pena srotolare la definizione, perché due pezzi si descrivono <b>senza nominare carte</b> e questo dice che non sono artefatti della costruzione.</p>
  <ul>
   <li><b>il vettore nullo</b> è la velocità della curva costante $\gamma(t)\equiv p$: la velocità di un punto fermo;</li>
   <li><b>la moltiplicazione per uno scalare</b> $\lambda\neq0$ è $\lambda[\gamma]=[\gamma_\lambda]$ con $\gamma_\lambda(t)=\gamma(\lambda t)$, cioè <b>lo stesso moto percorso $\lambda$ volte più in fretta</b> (all&rsquo;indietro se $\lambda<0$). Infatti $(\varphi\circ\gamma_\lambda)'(0)=\lambda\,(\varphi\circ\gamma)'(0)$, che su una coordinata si legge: la derivata in $0$ di $x_0+\lambda t$ volte la velocità, ovvero $2x_0\lambda$ per la coordinata $x\mapsto x^2$ letta lungo $x_0+\lambda t$. Si noti che $\gamma_\lambda$ è definita su $(-\varepsilon/|\lambda|,\varepsilon/|\lambda|)$: ecco dove serve poter restringere l&rsquo;$\varepsilon$.</li>
  </ul>
  <p>La <b>somma</b>, invece, una descrizione senza carte non ce l&rsquo;ha, e il disegno dice perché.</p>
  <figure class="fig-nota">
   <img src="gd-06-fig-05.svg" alt="La somma di due velocita vista in carta: la curva somma ha per velocita la diagonale del parallelogramma">
   <figcaption><b>Che cosa guardare.</b> In carta si costruisce la curva $\varphi\circ\sigma=\varphi\circ\gamma_1+\varphi\circ\gamma_2-\varphi(p)$, e la sua velocità è la <b>diagonale del parallelogramma</b>. In un&rsquo;altra carta si otterrebbe una curva $\sigma$ <i>diversa</i>, ma con la <b>stessa velocità in $p$</b> — ed è esattamente ciò che la Proposizione 4.3 garantisce. La somma di due velocità è ben definita; la curva che la realizza no.
   <span class="fonte">Figura di S. Diverio, note del corso 2026/27, ri-colorata.</span></figcaption>
  </figure>`}
]},

/* ---------------- 04 · I VETTORI COORDINATI ---------------- */
{ num:'04', title:'I vettori coordinati, e il cambio di coordinate', meta:'la Definizione 5.1 · le componenti come derivate delle coordinate · la Proposizione 5.2',
  blocchi:[
  {t:'prosa', title:'Una carta non da solo la struttura: da una base', tag:'grammatica', html:R`
  <p>Sia $(U,\varphi)$ una carta in $p$, con funzioni componenti $\varphi=(x^1,\dots,x^n)$.</p>
  <p><b>Definizione (5.1).</b> Detta $e_1,\dots,e_n$ la base canonica di $\mathbb{R}^n$, i <b>vettori coordinati</b> in $p$ associati alla carta sono
  $$\left.\frac{\partial}{\partial x^{i}}\right|_p=\theta_\varphi^{-1}(e_i),\qquad i=1,\dots,n.$$
  <p>Geometricamente $\partial/\partial x^i|_p$ è la velocità in $t=0$ della <b>$i$-esima curva coordinata</b> $t\mapsto\varphi^{-1}(\varphi(p)+te_i)$: il moto lungo cui cambia solo la $i$-esima coordinata, a velocità unitaria, mentre tutte le altre restano congelate. <b>È la curva $\gamma_a$ del Lemma 4.1 con $a=e_i$</b>, e per il momento il simbolo $\partial/\partial x^i|_p$ è soltanto un nome: che sia un nome <i>ben scelto</i> si vedrà nella tappa 06.</p>
  <figure class="fig-nota">
   <img src="gd-06-fig-06.svg" alt="La griglia coordinata tirata indietro da phi inverso su M, e i due vettori coordinati in p come velocita delle curve coordinate">
   <figcaption><b>Che cosa guardare.</b> La griglia a destra è quadrata perché è in $\mathbb{R}^2$; a sinistra è la sua controimmagine tramite $\varphi$, e <b>si è storta</b>. I vettori coordinati in $p$ sono le velocità delle due curve della griglia che passano per $p$. <b>Non c&rsquo;è nessuna ragione perché siano perpendicolari o di lunghezza uno</b>: la griglia storta è la regola, non l&rsquo;eccezione — e su una varietà astratta «perpendicolare» e «lungo uno» non hanno nemmeno senso.
   <span class="fonte">Figura di S. Diverio, note del corso 2026/27, ri-colorata.</span></figcaption>
  </figure>
  <p>Poiché $\theta_\varphi$ è un isomorfismo lineare, i vettori coordinati sono una <b>base</b> di $T_{M,p}$. E le componenti di un vettore su quella base si leggono subito: se $v=[\gamma]$ e si scrive $\gamma^i=x^i\circ\gamma$ per le coordinate del punto in movimento, allora $\theta_\varphi([\gamma])=(\dot\gamma^1(0),\dots,\dot\gamma^n(0))$, cioè
  $$[\gamma]=\sum_{i=1}^{n}\dot\gamma^{i}(0)\,\left.\frac{\partial}{\partial x^{i}}\right|_p.$$
  <b>Le componenti di una velocità sono le derivate delle coordinate del punto in movimento</b>, come in un primo corso di meccanica. Non c&rsquo;è niente di più, e questa frase è tutto il contenuto operativo della definizione.</p>`},
  {t:'prosa', title:'Che succede cambiando carta', tag:'teorema', html:R`
  <p>Sia $(V,\psi)$ un&rsquo;altra carta in $p$, con $\psi=(y^1,\dots,y^n)$. Seguendo l&rsquo;abuso di notazione consueto si scrive il cambio di carte $\psi\circ\varphi^{-1}$ come $y=y(x)$, cioè si pensano le nuove coordinate $y^i=y^i(x^1,\dots,x^n)$ come funzioni delle vecchie; le entrate della jacobiana $J_{\psi\circ\varphi^{-1}}$ sono allora le derivate parziali $\partial y^i/\partial x^j$.</p>
  <p><b>Proposizione (5.2).</b> Se $v\in T_{M,p}$ ha componenti $(v^j)$ rispetto a $\varphi$ e $(w^i)$ rispetto a $\psi$, allora
  $$w^{i}=\sum_{j=1}^{n}\frac{\partial y^{i}}{\partial x^{j}}(\varphi(p))\,v^{j},$$
  e i vettori coordinati si trasformano con
  $$\left.\frac{\partial}{\partial x^{j}}\right|_p=\sum_{i=1}^{n}\frac{\partial y^{i}}{\partial x^{j}}(\varphi(p))\left.\frac{\partial}{\partial y^{i}}\right|_p.$$
  <b>Dimostrazione.</b> La prima è il Lemma 4.2 scritto in componenti. La seconda si ottiene applicando la prima a $v=\partial/\partial x^j|_p$, le cui componenti rispetto a $\varphi$ sono $v^k=\delta_{jk}$. $\blacksquare$</p>
  <p><b>Queste due formule sono la definizione fisica di «vettore controvariante»</b>: in relatività e in meccanica analitica si <i>definisce</i> un vettore come un oggetto che si trasforma così. Qui non è una definizione: è un <b>teorema</b>, e l&rsquo;oggetto è stato costruito prima, senza coordinate. La seconda formula <i>sembra</i> la regola della catena — e nella tappa 06 si vedrà che lo è letteralmente.</p>
  <div class="note"><b>Il punto di vista che vale la pena portare via.</b> In fisica si dice «un vettore è ciò che si trasforma come un vettore», e sembra una circolarità. Qui si vede che non lo è: il vettore esiste come classe di curve, indipendentemente da ogni carta, e la legge di trasformazione è <i>conseguenza</i> del cambio di base. <b>Le due frasi dicono la stessa cosa, ma solo una delle due spiega perché.</b></div>`}
]},

/* ---------------- 05 · LE POLARI ---------------- */
{ num:'05', title:'Lesempio che toglie un equivoco: le coordinate polari', meta:'d/dr e d/dtheta calcolati · la verifica cinematica · e perche non sono ne unitari ne ortogonali',
  blocchi:[
  {t:'prosa', title:'Il conto, fatto fino in fondo', tag:'esempio', html:R`
  <p>Su $\mathbb{R}^2$ si prendano la carta identica, con coordinate $(x,y)$, e la carta polare $(r,\theta)$, definita su $\mathbb{R}^2$ meno la semiretta chiusa $\{(x,0):x\le0\}$, con inversa $(r,\theta)\mapsto(r\cos\theta,\ r\sin\theta)$.</p>
  <p>Applicando la Proposizione 5.2 con $x=r\cos\theta$ e $y=r\sin\theta$, i coefficienti sono le derivate parziali di queste due, e vengono funzioni delle coordinate <i>polari</i> di $p$. Ma i vettori coordinati a destra sono quelli <i>cartesiani</i>, quindi è più coerente esprimere tutto nelle coordinate cartesiane di $p$, usando
  $$r=\sqrt{x^2+y^2},\qquad \cos\theta=\frac{x}{\sqrt{x^2+y^2}},\qquad \sin\theta=\frac{y}{\sqrt{x^2+y^2}}.$$
  Si ottiene
  $$\left.\frac{\partial}{\partial r}\right|_p=\frac{x}{\sqrt{x^2+y^2}}\left.\frac{\partial}{\partial x}\right|_p+\frac{y}{\sqrt{x^2+y^2}}\left.\frac{\partial}{\partial y}\right|_p,\qquad
  \left.\frac{\partial}{\partial\theta}\right|_p=-y\left.\frac{\partial}{\partial x}\right|_p+x\left.\frac{\partial}{\partial y}\right|_p.$$
  Identificando $T_{\mathbb{R}^2,p}=\mathbb{R}^2$: il vettore $\partial/\partial r|_p=(x,y)/\sqrt{x^2+y^2}$ è il versore che punta via dall&rsquo;origine, e $\partial/\partial\theta|_p=(-y,x)$ è il vettore posizione di $p$ <b>ruotato di un angolo retto</b>.</p>`},
  {t:'prosa', title:'La verifica cinematica, e la lezione', tag:'first principles', html:R`
  <p>Conviene ricontrollare per via cinematica, perché è lì che si vede la cosa che conta. La <b>curva coordinata $\theta$</b> per $p=(r\cos\theta_0,\ r\sin\theta_0)$ è
  $$t\longmapsto\big(r\cos(\theta_0+t),\ r\sin(\theta_0+t)\big),$$
  cioè un punto che corre sulla circonferenza di raggio $r$ con velocità angolare unitaria. Derivando in $t=0$ si ottiene $(-y,\ x)$, la cui lunghezza è $\sqrt{(-r\sin\theta_0)^2+(r\cos\theta_0)^2}$, che <b>ha lunghezza $r$, non $1$</b>. La <b>curva coordinata $r$</b> è invece $t\mapsto\big((r+t)\cos\theta_0,\ (r+t)\sin\theta_0\big)$, un punto che si allontana radialmente a velocità unitaria, e derivando dà $(\cos\theta,\ \sin\theta)$, di lunghezza uno.</p>
  <figure class="fig-nota">
   <img src="gd-06-fig-07.svg" alt="I vettori coordinati polari in p: d/dr lungo il raggio di lunghezza 1, d/dtheta tangente al cerchio di lunghezza r">
   <figcaption><b>Che cosa guardare, ed è l&rsquo;equivoco che questa figura toglie.</b> I due vettori sono disegnati con lunghezze <i>diverse</i>: $\partial/\partial r$ ha lunghezza $1$, $\partial/\partial\theta$ ha lunghezza $r$. <b>I vettori coordinati non hanno nessuna ragione di avere lunghezza uno, né di essere ortogonali</b> — qui sono ortogonali per caso, perché le polari sono una carta ortogonale, ma la lunghezza già non torna. Su una varietà astratta la domanda non si pone nemmeno: <b>lunghezze e angoli non esistono ancora</b>, perché non c&rsquo;è una metrica.
   <span class="fonte">Figura di S. Diverio, note del corso 2026/27, ri-colorata.</span></figcaption>
  </figure>
  <p><b>Perché l&rsquo;equivoco è dannoso e non innocuo</b>: in fisica si usano quasi sempre i versori $\hat r,\hat\theta$, che sono i vettori coordinati <i>normalizzati</i>, e si scrivono le velocità come $\dot r\,\hat r+r\dot\theta\,\hat\theta$. Quel fattore $r$ che compare nella seconda componente <b>è esattamente la lunghezza di $\partial/\partial\theta$</b>, rimessa a mano dopo averla tolta normalizzando. Chi confonde i due oggetti si trova dei fattori $r$ che compaiono e scompaiono senza ragione apparente.</p>`}
]},

/* ---------------- 06 · IL DIFFERENZIALE ---------------- */
{ num:'06', title:'Il differenziale: si spinge avanti la curva', meta:'la Definizione 6.1 · ben posto e lineare · la jacobiana in coordinate · le quattro proprieta',
  blocchi:[
  {t:'prosa', title:'La definizione, e perche e la piu naturale possibile', tag:'costruzione', html:R`
  <p>Qui si raccoglie il frutto della definizione per curve.</p>
  <p><b>Definizione (6.1).</b> Sia $F:M\to N$ liscia e $p\in M$. Il <b>differenziale</b> di $F$ in $p$ è
  $$d_pF:T_{M,p}\to T_{N,F(p)},\qquad d_pF\big([\gamma]\big)=[F\circ\gamma].$$
  <b>In parole: per spingere avanti una velocità, si spinge avanti il moto e se ne prende la velocità.</b> Non c&rsquo;è niente da inventare — ed è questo il vantaggio della definizione per curve rispetto a quella per derivazioni, dove il differenziale va definito con una formula.</p>
  <figure class="fig-nota">
   <img src="gd-06-fig-08.svg" alt="Il differenziale manda la velocita di gamma nella velocita della curva immagine F composto gamma">
   <figcaption><b>Che cosa guardare.</b> Nessuna formula: una curva su $M$, la sua immagine su $N$, e le due velocità. <b>Il differenziale è questo disegno</b>, e la Proposizione 6.2 serve soltanto a verificare che il risultato non dipenda da quale curva della classe si è presa.
   <span class="fonte">Figura di S. Diverio, note del corso 2026/27, ri-colorata.</span></figcaption>
  </figure>
  <p><b>Proposizione (6.2).</b> $d_pF$ è ben definito e lineare. Più precisamente, siano $(U,\varphi)$ una carta in $p$ e $(V,\psi)$ una carta in $F(p)$ con $F(U)\subseteq V$, e sia $\widehat F=\psi\circ F\circ\varphi^{-1}$ il <b>rappresentante locale</b> di $F$. Allora
  $$\theta_\psi\circ d_pF=J_{\widehat F}(\varphi(p))\circ\theta_\varphi,$$
  equivalentemente
  $$d_pF\left(\left.\frac{\partial}{\partial x^{j}}\right|_p\right)=\sum_{i=1}^{m}\frac{\partial\widehat F^{i}}{\partial x^{j}}(\varphi(p))\left.\frac{\partial}{\partial y^{i}}\right|_{F(p)}:$$
  <b>la matrice di $d_pF$ rispetto alle basi coordinate è la jacobiana del rappresentante locale.</b></p>
  <p><b>Dimostrazione.</b> Per continuità si può sempre restringere $U$ in modo che $F(U)\subseteq V$. Data una curva $\gamma$ per $p$, per $|t|$ piccolo vale $\psi\circ F\circ\gamma=\widehat F\circ(\varphi\circ\gamma)$, e la regola della catena in $\mathbb{R}^n$ dà
  $$\theta_\psi\big([F\circ\gamma]\big)=(\psi\circ F\circ\gamma)'(0)=J_{\widehat F}(\varphi(p))\,(\varphi\circ\gamma)'(0)=J_{\widehat F}(\varphi(p))\,\theta_\varphi\big([\gamma]\big).$$
  Il membro di destra dipende solo da $[\gamma]$, e $\theta_\psi$ è iniettiva: quindi $[F\circ\gamma]$ dipende solo da $[\gamma]$, cioè <b>$d_pF$ è ben definito</b>. E la formula dice che $d_pF=\theta_\psi^{-1}\circ J_{\widehat F}(\varphi(p))\circ\theta_\varphi$ è composizione di applicazioni lineari, quindi è lineare. $\blacksquare$</p>`},
  {t:'prosa', title:'Il cambio di notazione, e le quattro proprieta', tag:'grammatica', html:R`
  <p>Da qui in poi si scrive $\gamma'(0)=[\gamma]$, come annunciato. Con questa notazione la Definizione 6.1 si legge
  $$d_pF\big(\gamma'(0)\big)=(F\circ\gamma)'(0),$$
  <b>che è la forma più intuitiva possibile della regola della catena</b>. Più in generale, se $\gamma:I\to M$ è liscia e $t_0\in I$, la velocità in $t_0$ è $\gamma'(t_0)=\big[s\mapsto\gamma(t_0+s)\big]\in T_{M,\gamma(t_0)}$, e per ogni $t$ vale $(F\circ\gamma)'(t)=d_{\gamma(t)}F\big(\gamma'(t)\big)$.</p>
  <p><b>Proposizione (6.3).</b> Quattro proprietà, e la dimostrazione di ciascuna è una riga perché con le velocità è <i>associatività della composizione</i>:</p>
  <ol>
   <li><b>catena:</b> se $F:M\to N$ e $G:N\to P$ sono lisce, $d_p(G\circ F)=d_{F(p)}G\circ d_pF$. Infatti per ogni curva $\gamma$ per $p$: $d_p(G\circ F)([\gamma])=[G\circ(F\circ\gamma)]=d_{F(p)}G([F\circ\gamma])=d_{F(p)}G\big(d_pF([\gamma])\big)$;</li>
   <li><b>identità:</b> $d_p(\mathrm{id}_M)=\mathrm{id}_{T_{M,p}}$, ovvio dalla definizione;</li>
   <li><b>diffeomorfismi:</b> se $F$ è un diffeomorfismo, $d_pF$ è un isomorfismo, con inverso $d_{F(p)}(F^{-1})$ — si applicano (1) e (2) a $F^{-1}\circ F=\mathrm{id}_M$ e $F\circ F^{-1}=\mathrm{id}_N$;</li>
   <li><b>aperti:</b> se $W\subseteq M$ è aperto, $p\in W$ e $\iota:W\to M$ è l&rsquo;inclusione, allora $d_p\iota:T_{W,p}\to T_{M,p}$ è un isomorfismo. Ogni curva in $M$ per $p$ sta in $W$ per $|t|$ piccolo, quindi dopo aver ristretto l&rsquo;$\varepsilon$ è una curva in $W$: $d_p\iota$ è suriettiva, e le due dimensioni coincidono.</li>
  </ol>
  <p>Grazie a (4) <b>si identifica sempre $T_{W,p}$ con $T_{M,p}$</b>, e lo si fa senza dirlo. E da (3) segue una conseguenza tutt&rsquo;altro che ovvia a mani nude: <b>due varietà diffeomorfe hanno la stessa dimensione</b>.</p>
  <p><b>L&rsquo;esempio da avere in mano</b>, che collega tutto a quello che già si sa: il passaggio a coordinate polari $F(r,\theta)=(r\cos\theta,\ r\sin\theta)$ ha per rappresentante locale sé stesso, e jacobiana
  $$J_F=\begin{pmatrix}\cos\theta&-r\sin\theta\\ \sin\theta&r\cos\theta\end{pmatrix},$$
  con l&rsquo;entrata in alto a destra che è $-r\sin\theta$ e determinante che <b>vale $r$</b>. Il determinante si annulla in $r=0$: lì le polari non sono una carta, ed è la ragione per cui l&rsquo;origine va sempre esclusa. <b>Lo stesso $r$ è il fattore che compare nell&rsquo;integrale doppio in polari</b> — il determinante jacobiano di Analisi Vettoriale è questo differenziale.</p>`},
  {t:'prosa', title:'Le velocita derivano le funzioni, e il nome era ben scelto', tag:'idea', html:R`
  <p>Sia $f:M\to\mathbb{R}$ liscia. Allora $d_pf:T_{M,p}\to T_{\mathbb{R},f(p)}=\mathbb{R}$ è una forma lineare, data da
  $$d_pf\big(\gamma'(0)\big)=(f\circ\gamma)'(0)=\left.\frac{d}{dt}\right|_{t=0}f(\gamma(t)).$$
  <b>È il tasso di variazione di $f$ sentito da un punto che passa per $p$ con quella velocità</b>: la derivata di $f$ nella direzione del vettore tangente.</p>
  <p>Calcolandola sui vettori coordinati — Proposizione 6.2 con $N=\mathbb{R}$ e $\psi=\mathrm{id}$ — si ottiene
  $$d_pf\left(\left.\frac{\partial}{\partial x^{i}}\right|_p\right)=\frac{\partial\widehat f}{\partial x^{i}}(\varphi(p)),\qquad \widehat f=f\circ\varphi^{-1}.$$
  <b>Il vettore coordinato $\partial/\partial x^i|_p$, dato in pasto al differenziale di una funzione, restituisce esattamente la derivata parziale rispetto alla $i$-esima coordinata</b>: il nome era ben scelto, e adesso si sa perché.</p>
  <p>E dando entrambi i membri della seconda formula della Proposizione 5.2 in pasto a $d_pf$, si vede che quella formula <b>è</b> la regola della catena:
  $$\frac{\partial\widehat f}{\partial x^{j}}=\sum_{i}\frac{\partial\widetilde f}{\partial y^{i}}\frac{\partial y^{i}}{\partial x^{j}},\qquad \widetilde f=f\circ\psi^{-1}.$$
  <b>Non assomigliava alla regola della catena: lo era.</b></p>`}
]},

/* ---------------- 07 · IMMERSIONI, SOMMERSIONI, RANGO ---------------- */
{ num:'07', title:'Immersioni, sommersioni e rango costante', meta:'le definizioni · i due teoremi di forma normale · e la figura otto',
  blocchi:[
  {t:'prosa', title:'Le definizioni, e cosa dicono davvero', tag:'grammatica', html:R`
  <p>Avendo il differenziale come applicazione lineare, si classifica $F$ in base al <b>rango</b> di $d_pF$:</p>
  <ul>
   <li><b>immersione</b>: $d_pF$ è <b>iniettivo</b> per ogni $p$. Localmente $F$ «infila» $M$ dentro $N$ senza schiacciarla;</li>
   <li><b>sommersione</b>: $d_pF$ è <b>suriettivo</b> per ogni $p$. Localmente $F$ proietta $M$ su $N$;</li>
   <li><b>rango costante</b>: $\operatorname{rk}d_pF$ non dipende da $p$ (le prime due sono casi particolari).</li>
  </ul>
  $$F\ \text{immersione}\iff\forall p\in M\ \ d_pF\ \text{iniettivo},\qquad F\ \text{sommersione}\iff\forall p\in M\ \ d_pF\ \text{surgettivo}.$$
  <p><b>Il teorema del rango costante</b> dice che in quei casi esistono carte in cui $F$ si scrive nella <b>forma più semplice possibile</b>:
  $$(x^1,\dots,x^n)\ \longmapsto\ (x^1,\dots,x^k,0,\dots,0).$$
  <b>Cioè: a meno di cambi di coordinate, una mappa di rango costante è una proiezione seguita da un&rsquo;inclusione.</b> È il teorema più potente della tappa: riduce lo studio locale di qualunque mappa di rango costante a un&rsquo;unica forma normale.</p>
  <p>Due corollari che si usano continuamente: se $d_pF$ è <b>invertibile</b>, $F$ è un diffeomorfismo locale (<b>teorema di invertibilità locale</b> — e si vede subito perché $t\mapsto t^3$ di gd-04 fallisce in $0$); se $F$ è una <span class="str" data-str="sommersione">sommersione</span>, le sue <b>fibre</b> sono sottovarietà, di dimensione $\dim M-\dim N$ — ed è l&rsquo;enunciato che il criterio del <span class="str" data-str="valore-regolare">valore regolare</span> rende operativo, perché trasforma la verifica di «questo insieme è una sottovarietà» in un conto di derivate.</p>`},
  {t:'prosa', title:'La figura otto: immersione si, sottovarieta no', tag:'trappola', html:R`
  <p>La curva $\gamma(t)=(\sin2t,\ \sin t)$ su $(-\pi,\pi)$ disegna una <b>figura a otto</b>. La sua velocità è $(2\cos 2t,\ \cos t)$, che <b>non si annulla mai</b> — le due componenti non hanno zeri comuni — quindi $\gamma$ è un&rsquo;<b>immersione iniettiva</b>.</p>
  <p><b>Eppure l&rsquo;immagine non è una sottovarietà</b>: nel punto di incrocio ogni intorno ha quattro rami, e non è omeomorfo a un intervallo. L&rsquo;errore sta nel credere che «immersione iniettiva» implichi «l&rsquo;immagine è una sottovarietà»: <b>manca una condizione topologica</b>, e la curva la viola perché i due estremi del dominio si avvicinano allo stesso punto dell&rsquo;immagine.</p>
  <p>La condizione che manca è la <span class="str" data-str="applicazione-propria">propriezza</span>: la controimmagine di ogni compatto deve essere compatta, e qui non lo è — un disco chiuso attorno al punto di incrocio ha per controimmagine dei $t$ che si accumulano sui due estremi del dominio, dove non c&rsquo;è nessun punto che li raccolga.</p>`},
  {t:'plot', title:'La figura otto: velocita mai nulla, e un punto che rovina tutto',
   intro:R`La curva $(\sin 2t,\ \sin t)$ per $t\in(-\pi,\pi)$: iniettiva, con velocità mai nulla, e con un&rsquo;immagine che non è una sottovarietà.`,
   plots:[
    {kind:'curve', x:'sin(2*t)', y:'sin(t)', tr:[-3.1416,3.1416], xr:[-1.4,1.4], yr:[-1.3,1.3],
     height:340, title:'nellorigine passano due rami: nessun intorno e un intervallo',
     marks:[{x:0, y:0, label:'qui lintorno ha quattro rami', col:'#ff6b6b'},
            {x:1, y:0.7071, label:'t = pi/4', col:'#5eead4'}]}
   ],
   leggi:R`<b>La curva è liscia, iniettiva, e la sua velocità non si annulla mai</b>: tutte le condizioni «differenziali» sono soddisfatte. Il problema è <i>topologico</i> e sta tutto nell&rsquo;origine: la curva ci passa una volta sola come punto del dominio, ma i valori $t\to\pm\pi$ si avvicinano a quello stesso punto dell&rsquo;immagine. Quindi <b>la mappa non è un omeomorfismo sull&rsquo;immagine</b>, e l&rsquo;immagine non eredita la struttura.<br><br>
   <b>La lezione da portare avanti</b>: le condizioni sul differenziale controllano il comportamento <i>locale</i> nel dominio, e non dicono nulla su come l&rsquo;immagine si richiude su se stessa. Ogni volta che in questo corso si vuole concludere qualcosa <b>sull&rsquo;immagine</b>, serve un&rsquo;ipotesi topologica in più — ed è sempre la stessa: la propriezza.`}
]},

/* ---------------- 08 · LE ALTRE DUE DEFINIZIONI ---------------- */
{ num:'08', title:'Le altre due definizioni, e perche i libri ne danno tre', meta:'le derivazioni di Lee · le componenti dei fisici · e il dizionario per leggere il libro',
  blocchi:[
  {t:'prosa', title:'Le derivazioni, cioe la definizione del libro', tag:'architettura', html:R`
  <p>Le note lo mettono come anticipazione, ed è giusto tenerlo qui: a ogni $v\in T_{M,p}$ si associa l&rsquo;applicazione
  $$C^{\infty}(M)\longrightarrow\mathbb{R},\qquad f\longmapsto d_pf(v).$$
  È lineare, e soddisfa la <b>regola di Leibniz</b>
  $$v(fg)=v(f)\,g(p)+f(p)\,v(g),$$
  che si verifica derivando $t\mapsto f(\gamma(t))\,g(\gamma(t))$ in $t=0$ con la regola del prodotto. <b>Cioè è una <i>derivazione</i> in $p$, che è il modo in cui Lee definisce i vettori tangenti.</b></p>
  <p>Più avanti nel corso si vedrà che questa corrispondenza è un <b>isomorfismo</b> fra il nostro $T_{M,p}$ e lo spazio tangente del libro, e che sotto quell&rsquo;isomorfismo il nostro $d_pF(v)$ corrisponde alla derivazione $f\mapsto d_p(f\circ F)(v)$, che è la definizione di differenziale del libro. <b>Per ora è un&rsquo;anticipazione, non uno strumento</b>, e il corso non la usa.</p>
  <div class="note"><b>Perché il docente non parte da lì, visto che il libro lo fa.</b> La definizione per derivazioni ha un vantaggio vero: la struttura di spazio vettoriale è gratis, perché le derivazioni si sommano. Ma a prima vista una derivazione non ha niente a che fare con la figura che tutti abbiamo in mente — una freccia attaccata a un punto — e il prezzo è che il differenziale va <i>definito</i> con una formula invece che ottenuto spingendo avanti una curva. Con le velocità si paga la struttura vettoriale (la Proposizione 4.3) e si guadagna tutto il resto.</div>`},
  {t:'prosa', title:'Le componenti, cioe la definizione dei fisici', tag:'idea', html:R`
  <p>La terza definizione è quella che in relatività generale compare per prima: <b>un vettore è un elenco di numeri $(v^1,\dots,v^n)$ associato a una carta, con la regola che cambiando carta diventa $w^{i}=\sum_j\frac{\partial y^{i}}{\partial x^{j}}v^{j}$.</b> È la più comoda per <i>calcolare</i>, ed è spesso presentata nella forma «un vettore è un oggetto che si trasforma come un vettore», che agli studenti di matematica suona circolare.</p>
  <p><b>Non lo è, e la tappa 04 dice esattamente perché</b>: la legge di trasformazione non è una definizione arbitraria, è la Proposizione 5.2, cioè una conseguenza del Lemma 4.2. L&rsquo;oggetto esiste prima; i numeri vengono dopo, appena si sceglie una carta.</p>
  <p><b>Il riassunto operativo</b>, che vale più di qualunque preferenza fra le tre: le <b>curve</b> sono comode per <i>costruire</i> un vettore (basta esibire un moto); le <b>derivazioni</b> per <i>dimostrare</i> (non nominano carte, quindi ciò che si prova è automaticamente indipendente dalle coordinate); le <b>componenti</b> per <i>calcolare</i>. Ogni testo ne sceglie una come definizione e dimostra le altre due. <b>Saper passare dall&rsquo;una all&rsquo;altra vale più che padroneggiarne una sola</b>, ed è il motivo per cui questa tappa esiste.</p>`},
  {t:'prosa', title:'Il dizionario per leggere il libro', tag:'metodo', html:R`
  <p>Il libro del corso è Lee, e scrive le cose in modo diverso dalle note. Le note danno il dizionario, e conviene averlo sott&rsquo;occhio perché <b>la differenza è solo di notazione e non di sostanza</b>:</p>
  <table>
  <tr><th>Lee</th><th>le note, e questo movimento</th></tr>
  <tr><td>$T_{M,p}$, $d_pF$</td><td>$T_{M,p}$, $d_pF$</td></tr>
  <tr><td>coordinate $x^i,\tilde x^i$; componenti $v^i,\tilde v^i$</td><td>$x^i,y^i$; $v^i,w^i$</td></tr>
  <tr><td>vettori coordinati, formula (3.8)</td><td>Definizione 5.1</td></tr>
  <tr><td>differenziale in coordinate, formula (3.9)</td><td>Proposizione 6.2</td></tr>
  <tr><td>cambio di coordinate, formule (3.11) e (3.12)</td><td>Proposizione 5.2</td></tr>
  <tr><td>proprietà dei differenziali, Proposizioni 3.6 e 3.9</td><td>Proposizione 6.3</td></tr>
  <tr><td>velocità di una curva, Proposizione 3.24 e Corollario 3.25</td><td>Definizione 6.1</td></tr>
  </table>
  <p>Due avvertenze sulla lettura di Lee: scrive gli indici di coordinate e di componenti <b>in alto</b>, e usa la <b>convenzione di Einstein</b> — un indice ripetuto una volta in alto e una in basso è sommato, quindi $v^i\partial/\partial x^i|_p$ significa $\sum_i v^i\partial/\partial x^i|_p$. E il suo Corollario 3.25 dice che $d_pF(v)=(F\circ\gamma)'(0)$ per <i>una qualunque</i> curva con $\gamma(0)=p$ e $\gamma'(0)=v$: <b>per noi quello è la definizione</b>.</p>`}
]},

/* ---------------- 09 · ESERCIZI ---------------- */
{ num:'09', title:'Esercizi — tocca a te', meta:'il tangente alla sfera calcolato in due modi · il differenziale del determinante',
  blocchi:[
  {t:'esercizio', title:'1 · Lo spazio tangente alla sfera, per due strade',
   src:'il confronto fra il metodo astratto e quello con lambiente',
   testo:R`Calcola $T_{S^2,p}$ per $p\in S^{2}\subset\mathbb{R}^{3}$ in due modi: (a) come sottospazio di $\mathbb{R}^{3}$, usando che $S^{2}$ è un insieme di livello; (b) usando la carta stereografica. Verifica che danno lo stesso.`,
   steps:[
    {label:'Con lambiente', body:R`
    <p>$S^{2}=F^{-1}(1)$ con $F(x)=|x|^{2}$. Una curva $\gamma$ sulla sfera soddisfa $|\gamma(t)|^{2}=1$; derivando in $t=0$:</p>
    $$2\,\langle\gamma(0),\dot\gamma(0)\rangle=0\quad\Longrightarrow\quad \dot\gamma(0)\perp p.$$
    <p>Quindi $T_{S^2,p}=\{v\in\mathbb{R}^{3}:\langle v,p\rangle=0\}=p^{\perp}$, <b>il piano ortogonale al raggio</b>, di dimensione $2$. Vale la pena notare che l'inclusione «$\subseteq$» è quella appena dimostrata, mentre «$\supseteq$» richiede di esibire, per ogni $v\perp p$, una curva sulla sfera con quella velocità — e basta il cerchio massimo $\gamma(t)=p\cos(|v|t)+\frac{v}{|v|}\sin(|v|t)$, che sta sulla sfera e ha $\dot\gamma(0)=v$. <b>Le due inclusioni si dimostrano con tecniche diverse</b>: una derivando il vincolo, l'altra costruendo curve, ed è tipico dei conti sugli spazi tangenti. <b>La regola generale che ne esce</b>: per un insieme di livello di $F$, lo spazio tangente è il <i>nucleo del differenziale</i> $\ker d_pF$ — qui il nucleo di $v\mapsto2\langle p,v\rangle$.</p>`},
    {label:'Con la carta', body:R`
    <p>Nella carta stereografica $\varphi_N$ i vettori tangenti sono generati da $\partial/\partial u^{1}$ e $\partial/\partial u^{2}$: due vettori, quindi dimensione $2$. <b>Il conto è più rapido ma dà meno informazione</b>: dice la dimensione e una base, non dice «quale piano di $\mathbb{R}^{3}$» — perché in quel linguaggio $\mathbb{R}^{3}$ non esiste.</p>
    <p>Per confrontare si deve calcolare $d_p\iota$, il differenziale dell'inclusione $\iota:S^{2}\hookrightarrow\mathbb{R}^{3}$, e applicarlo ai due vettori della base: si ottengono due vettori di $\mathbb{R}^{3}$ ortogonali a $p$, che generano $p^{\perp}$. <b>Le due risposte coincidono, come devono</b>, e la morale è pratica: <b>quando c'è un ambiente conviene usarlo</b>, perché dà una descrizione concreta; quando non c'è, le carte bastano comunque.</p>`}
   ]},
  {t:'plot', title:'Il piano tangente come approssimazione, e come spazio a se',
   intro:R`La superficie $z=x^{2}-y^{2}$ con il piano tangente nel punto $(0{,}7,\,0{,}5)$. Trascina per ruotare: il piano tocca la superficie in un punto solo e la attraversa altrove, perché la sella ha curvature di segno opposto.`,
   plots:[
    {kind:'surface3d', f:'x*x-y*y', xr:[-1.6,1.6], yr:[-1.6,1.6], n:40, height:350,
     tangent:{x0:0.7, y0:0.5, span:0.7},
     title:'la superficie e il suo piano tangente: contatto del primo ordine'}
   ],
   leggi:R`<p><b>Il piano tangente approssima la superficie al primo ordine</b>: vicino al punto di contatto la differenza fra i due va a zero più rapidamente della distanza. È la definizione di differenziabilità, vista in tre dimensioni — ed è la stessa nozione di contatto del primo ordine della tappa 02, dove due curve erano equivalenti quando la loro differenza era $o(t)$.</p>
   <p>Ma la figura mostra anche il limite dell'immagine, ed è la ragione per cui il corso non la usa come definizione. <b>Questo piano è disegnato dentro $\mathbb{R}^{3}$</b>, e la sua posizione — inclinata così, appoggiata lì — è informazione sull'immersione, non sulla superficie. Una superficie astratta ha lo stesso spazio tangente senza avere nessun piano dove metterlo.</p>
   <p>Nota infine che il piano <b>attraversa</b> la superficie invece di restarle da una parte: succede perché la sella curva verso l'alto in una direzione e verso il basso nell'altra. In un punto di massimo il piano resterebbe tutto sopra, in uno di minimo tutto sotto. <b>Quella distinzione è il segno della forma quadratica seconda</b>, e appartiene alla geometria con metrica — cioè al capitolo che questo corso non apre. <b>Il tangente vede solo il primo ordine, e del primo ordine non sa dire se si sta salendo su una collina o attraversando una sella.</b></p>`},
  {t:'esercizio', title:'2 · Il differenziale del determinante, e lalgebra di Lie di SL(n)',
   src:'il conto che lega questo movimento ai gruppi di matrici',
   testo:R`Calcola $d_I(\det)$, il differenziale del determinante nell'identità, e usalo per determinare lo spazio tangente a $SL(n,\mathbb{R})$ nell'identità.`,
   steps:[
    {label:'Il differenziale', body:R`
    <p>Si usa la definizione con le curve, ed è il caso in cui si vede che conviene. Prendendo $\gamma(t)=I+tH$, che per $t$ piccolo sta in $GL(n)$:</p>
    $$\det(I+tH)=1+t\,\mathrm{tr}(H)+O(t^{2}),$$
    <p>perché nello sviluppo del determinante il termine lineare in $t$ raccoglie esattamente la somma dei minori diagonali, cioè la traccia. Derivando in $t=0$:</p>
    $$d_I(\det)(H)=\mathrm{tr}(H).$$
    <p><b>È uno dei conti più usati di tutta la matematica applicata</b>, e conviene ricordarlo nella forma generale $d_A(\det)(H)=\det(A)\,\mathrm{tr}(A^{-1}H)$, che per $A=I$ si riduce a questa. Si incontra ovunque compaia un cambio di variabili: la derivata del determinante jacobiano che governa come cambiano i volumi, l'equazione di Liouville in meccanica statistica, la formula per la variazione del determinante della metrica in relatività.</p>`},
    {label:'Lo spazio tangente', body:R`
    <p>$SL(n)=\det^{-1}(1)$, e lo spazio tangente è il nucleo del differenziale:</p>
    $$T_{SL(n),I}=\{H:\mathrm{tr}(H)=0\},$$
    <p>le matrici a <b>traccia nulla</b>. La dimensione è $n^{2}-1$, in accordo con il conto del rango già fatto. <b>Questo spazio si chiama $\mathfrak{sl}(n)$</b> ed è l'algebra di Lie del gruppo: tutta l'informazione infinitesima del gruppo è lì dentro.</p>
    <p><b>Lo stesso metodo dà $\mathfrak{o}(n)$</b>: derivando $A^{T}A=I$ lungo una curva $\gamma(t)$ con $\gamma(0)=I$ e $\dot\gamma(0)=H$ si ottiene $\dot\gamma^{T}\gamma+\gamma^{T}\dot\gamma=0$, che in $t=0$ dà $H^{T}+H=0$: le matrici <b>antisimmetriche</b>, di dimensione $\frac{n(n-1)}{2}$. Per $n=3$ sono tre parametri, e infatti una matrice antisimmetrica $3\times3$ si identifica con un vettore — il vettore velocità angolare, che è esattamente il modo in cui le rotazioni infinitesime compaiono in meccanica. <b>Vincolo simmetrico, tangente antisimmetrico</b>: è la regola che conviene tenere a mente, e che si ritrova ogni volta che un gruppo è definito da una forma bilineare da preservare.</p>`}
   ]},
  {t:'collaudo', title:'Controlla di aver capito', html:R`
  <ol>
  <li>Perché $\partial/\partial x^{i}$ dipende da tutta la carta e non solo dalla coordinata $x^{i}$?</li>
  <li>Il differenziale $d_pF$ è definito fra quali spazi, e perché non ha senso parlare della «matrice jacobiana di $F$» senza altro?</li>
  <li>Due varietà diffeomorfe hanno spazi tangenti isomorfi. Vale il viceversa?</li>
  <li>Nella Proposizione 4.3 si trasporta la struttura di $\mathbb{R}^n$ usando <i>una</i> carta. Perché il risultato non dipende da quale?</li>
  </ol>`,
   sol:R`<ol>
   <li>Perché $\partial/\partial x^{1}$ significa «derivare rispetto a $x^{1}$ <b>tenendo fisse le altre coordinate</b>», e quali siano le altre dipende dalla carta. Cambiando le coordinate $x^{2},\dots,x^{n}$ ma lasciando $x^{1}$ invariata, il vettore $\partial/\partial x^{1}$ <b>cambia</b>. <b>È l'errore più comune del corso</b>, e la notazione lo favorisce: il simbolo nomina una sola coordinata e dipende da tutte. In relatività generale lo stesso equivoco genera confusione sulla differenza fra «derivata parziale» e «derivata covariante».</li>
   <li>Fra $T_{M,p}$ e $T_{N,F(p)}$, ed è un'applicazione <b>lineare fra spazi vettoriali astratti</b>. La matrice jacobiana è la sua rappresentazione <i>rispetto a due basi coordinate</i>, una in partenza e una in arrivo: cambiando carte la matrice cambia (per coniugio con le jacobiane delle transizioni) mentre l'applicazione lineare resta la stessa. <b>Il differenziale è l'oggetto, la jacobiana è la sua scrittura</b> — e questo è il motivo per cui il rango, che non dipende dalle basi, è una nozione geometrica.</li>
   <li><b>No, e clamorosamente no</b>: ogni varietà di dimensione $n$ ha tutti gli spazi tangenti isomorfi a $\mathbb{R}^{n}$, quindi la sfera e il toro — quest'ultimo costruibile come <span class="str" data-str="quoziente-topologico">quoziente</span> del piano, la prima no — hanno spazi tangenti isomorfi senza essere diffeomorfi. <b>Lo spazio tangente in un punto non sa niente della forma globale</b>: è un oggetto puramente locale, e tutta l'informazione interessante sta in <i>come</i> gli spazi tangenti si incollano al variare del punto. È esattamente questo il contenuto del fibrato tangente, e il motivo per cui esiste il movimento successivo.</li>
   <li>Perché due letture diverse differiscono per $\theta_\psi\circ\theta_\varphi^{-1}$, che per il Lemma 4.2 è la <b>jacobiana del cambio di carte</b>, cioè un isomorfismo <i>lineare</i>. E un isomorfismo lineare manda somme in somme e multipli in multipli: trasportando la struttura con $\psi$ si ottengono le stesse operazioni che trasportandola con $\varphi$. <b>Se la transizione fosse solo un omeomorfismo la proposizione sarebbe falsa</b>, ed è il punto in cui la struttura <i>liscia</i> della varietà viene consumata.</li>
   </ol>`}
]},

/* ---------------- 10 · IL SENSO ---------------- */
{ num:'10', title:'Il senso, e le rotte', meta:'cosa apre, e dove il tangente riappare',
  blocchi:[
  {t:'prosa', title:'Cosa lascia in mano', tag:'sintesi', html:R`
  <p><b>Il punto.</b> Un vettore non è una freccia: è <b>la classe di tutti i moti che hanno quella velocità</b>. La freccia esiste, ma vive in $\mathbb{R}^n$ e ci arriva attraverso una carta — ed è la carta a darle le coordinate, non la varietà. Questa sostituzione è ciò che rende possibile fare geometria senza ambiente.</p>
  <p><b>La macchina, in tre righe.</b> $\theta_\varphi$ legge i vettori come $n$-uple; letture diverse differiscono per la jacobiana del cambio di carte; siccome quella è lineare, la struttura di spazio vettoriale è unica e il differenziale è la jacobiana del rappresentante locale. <b>Tutto il resto del movimento sono conseguenze di queste tre.</b></p>
  <p><b>A valle.</b> gd-07 mette insieme tutti i $T_{M,p}$ e ne fa una varietà — e lì le derivazioni torneranno, perché un campo vettoriale è comodo vederlo come operatore; gd-08 usa il rango per riconoscere sottovarietà; gd-12 studia cosa succede quando due derivazioni non commutano.</p>
  <div class="note"><b>Per chi pensa in meccanica.</b> Se $M$ è lo spazio delle configurazioni di un sistema, il fibrato tangente $TM$ è il suo <b>spazio degli stati</b>, e una lagrangiana è una funzione su $TM$. Questo risponde a un vecchio rompicapo: $\dot q$ è la derivata di $q$ o una variabile indipendente? <b>Su $TM$ è una coordinata indipendente</b>, e diventa la derivata di $q$ soltanto lungo il sollevamento $t\mapsto(\gamma(t),\gamma'(t))$ di una curva.</div>`},
  {t:'prolessi', title:'Dove riappare questo movimento',
   oggetto:R`<b>Il vettore tangente come classe di velocità</b>, e il differenziale come spinta in avanti di un moto.`,
   rotte:[
    {dove:'Meccanica<br>analitica', txt:R`Le <b>velocità generalizzate</b> $\dot q$ sono vettori tangenti allo spazio delle configurazioni, e la lagrangiana è una funzione sul <b>fibrato tangente</b> (gd-07). Il passaggio a $p=\partial L/\partial\dot q$ porta al fibrato <i>co</i>tangente, ed è la ragione geometrica per cui hamiltoniana e lagrangiana vivono su spazi diversi.`},
    {dove:'Relativita<br>generale', txt:R`La <b>quadrivelocità</b> è un vettore tangente allo spazio-tempo, e il fatto che i vettori vivano in spazi tangenti <i>diversi</i> in punti diversi è la ragione per cui confrontarli richiede una connessione — e da lì la curvatura.`},
    {dove:'Sistemi<br>dinamici', txt:R`Un sistema dinamico è un campo vettoriale: a ogni stato si assegna la <b>velocità con cui evolve</b>. La linearizzazione attorno a un equilibrio è il differenziale, e i suoi autovalori decidono la stabilità.`},
    {dove:'Ottimizzazione', txt:R`Il <b>gradiente</b> su una varietà ha senso solo con una metrica, ma il <b>differenziale</b> no: e' definito sempre. La distinzione fra i due — covariante e controvariante — nasce esattamente qui, e in ottimizzazione decide se un algoritmo e' indipendente dalla parametrizzazione.`}
   ],
   domanda:R`Lo spazio tangente in punti diversi è uno spazio vettoriale diverso: <b>non c&rsquo;è nessun modo canonico di confrontare un vettore in $p$ con uno in $q$</b>. In $\mathbb{R}^n$ sembra si possa (si traslano le frecce), ma quella è una struttura in più dello spazio euclideo, non della varietà. Sommare $v\in T_{M,p}$ e $w\in T_{M,q}$ non è un&rsquo;imprecisione: è un errore. <b>Domanda che porti avanti:</b> che cosa serve per trasportare un vettore da un punto a un altro? La risposta è una <b>connessione</b>, la sua ambiguità lungo cammini diversi è la <b>curvatura</b>, e in fisica quell&rsquo;ambiguità è la fase di Berry e il campo di gauge. <b>Nel corso di Diverio non ci sono</b>: questo è precisamente il punto in cui il programma si ferma, e da cui parte la geometria riemanniana.`}
]}

function sectionProsa(title, tag, html){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var body=elFromHTML('<div class="open-body">'+html+'</div>');

}

  rows.forEach(function(r){ inner+='<tr><td class="gs">'+r[0]+'</td><td>'+r[1]+'</td></tr>'; });

function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}

    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    /* DUE SCHEMI, NON UNO — scoperto il 2026-10-06 provando le pagine vive. I movimenti
       scritti per primi (em-01..03, me-10b, i collaudi di gd-01..09 e di quattro em)
       usano una forma piu' semplice: `reveal` e `prolessi` con un solo `html`,
       `esercizio` e `collaudo` con `html` + `sol`. Il renderer ne conosceva una sola e
       chiamava `steps.forEach` su `undefined`: TypeError, e la tappa si fermava li' —
       62 blocchi in 17 movimenti su 74. Non si riscrive il contenuto per far contento
       il renderer: e' il renderer che deve leggere cio' che c'e'.
       E in fondo un ramo che NON muore: uno schema nuovo di domani deve far vedere un
       avviso in quella sezione, non spegnere la pagina sotto di se'. */
    try{
      if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
      else if(b.t==='prolessi') m.appendChild(b.rotte ? sectionProlessi(b)
                                   : sectionProsa(b.title,'prolessi',b.html));
      else if(b.t==='reveal')m.appendChild(b.steps ? sectionReveal(b.title,b.tag,b.steps)
                                   : sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='esercizio') m.appendChild(b.steps ? sectionEsercizio(b)
                                   : sectionSvelabile(b.title,'esercizio',b.html,b.sol));
      else if(b.t==='collaudo')  m.appendChild(b.items ? sectionCollaudo(b.title,b.items)
                                   : sectionSvelabile(b.title,'provi, poi riveli',b.html,b.sol));
      else if(b.t==='plot')      m.appendChild(sectionPlot(b));
      else m.appendChild(sectionProsa(b.title||'(blocco)', 'tipo sconosciuto: '+b.t,
                                      b.html||''));
    }catch(err){
      var avv=document.createElement('section'); avv.className='section';
      avv.innerHTML='<h3>'+(b.title||'(blocco)')+'<span class="tag">non reso</span></h3>'
        +'<p style="color:#ff6b6b">Questo blocco non si &egrave; potuto rendere ('
        +b.t+': '+err.message+'). Il resto della tappa continua sotto.</p>';
      m.appendChild(avv);
    }
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* I POP-UP DEGLI STRUMENTI. `cablaStrumenti` esisteva dal 18-09 e non la chiamava
     nessuno: i 229 rimandi del percorso erano <span> senza handler, e il clic non
     faceva niente. Nessun controllo poteva vederlo — la sintassi era valida, le schede
     c'erano tutte, le formule rendevano: il guasto esisteva solo a pagina viva. Qui, e
     dopo ogni inserimento successivo, perche' la tappa si rimonta da capo a ogni
     cambio e gli handler vanno riattaccati al DOM nuovo. */
  cablaStrumenti(m);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}
