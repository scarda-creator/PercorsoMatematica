   leggi:R`<p>Le linee della griglia a sinistra sono rette; a destra sono <b>parabole</b>, perché $F$ non è lineare. Ma nel punto $F(p)$ le due parabole viola e arancione hanno per tangenti le due frecce, e le frecce sono le colonne di $J_F(1,\tfrac12)$, $(2,1)$ e $(-1,2)$. <b>Il differenziale vede delle curve soltanto le tangenti</b>: due parabole e due rette con le stesse tangenti in $F(p)$ avrebbero lo stesso differenziale.</p>
   <p>Tutte le frecce sono disegnate ridotte dello stesso fattore, quindi i rapporti si leggono: a destra ogni freccia è più lunga di un fattore $\sqrt5$ e ruotata di circa $26{,}6^\circ$ rispetto alla sua gemella di sinistra. <b>Le due frecce di destra restano perpendicolari e lunghe uguali</b>: in questo esempio $d_pF$ è una rotazione composta con una dilatazione, e lo è in ogni punto, perché le due colonne sono ortogonali in ogni punto — il prodotto scalare $2x\cdot(-2y)+2y\cdot2x$ è identicamente nullo. È la forma $\begin{pmatrix}a&-b\\b&a\end{pmatrix}$ che le condizioni di Cauchy-Riemann impongono alle funzioni olomorfe, e la ragione per cui le mappe olomorfe conservano gli angoli là dove la derivata non si annulla. Il determinante, $4(x^{2}+y^{2})$, si annulla solo nell&rsquo;origine: lì $z\mapsto z^{2}$ raddoppia gli angoli e smette di essere un diffeomorfismo locale.</p>
   <p>Generale: le colonne della jacobiana sono le velocità delle immagini delle linee coordinate. Accidentale: che restino ortogonali, che è la firma di una mappa olomorfa.</p>`},
  {t:'prosa', title:'La matrice dipende dalle carte, il rango no', tag:'teorema', html:R`
  <p>La jacobiana rappresenta $d_pF$ <i>in due basi</i>, una per parte, e cambiando le carte cambia. Se $\varphi'$ e $\psi'$ sono altre carte in $p$ e in $F(p)$, il nuovo rappresentante locale è $\widehat F'=(\psi'\circ\psi^{-1})\circ\widehat F\circ(\varphi\circ\varphi'^{-1})$, e la regola della catena dà
  $$J_{\widehat F'}=J_{\psi'\circ\psi^{-1}}\,J_{\widehat F}\,J_{\varphi\circ\varphi'^{-1}},$$
  dove i due fattori esterni sono jacobiane di cambi di carta, quindi invertibili.</p>
  <p>Sullo stesso esempio, si mettano le coordinate polari ai due capi: $(r,\theta)$ in partenza, $(R,\Theta)$ in arrivo. Siccome $(r\cos\theta)^{2}-(r\sin\theta)^{2}=r^{2}\cos2\theta$ e $2\,r\cos\theta\,r\sin\theta=r^{2}\sin2\theta$, la mappa diventa $(r,\theta)\mapsto(r^{2},\,2\theta)$: eleva al quadrato il raggio e raddoppia l&rsquo;angolo, ed è tutto. La sua jacobiana è
  $$J_{\widehat F'}=\begin{pmatrix}2r&0\\0&2\end{pmatrix},$$
  diagonale, e la si ritrova dalla formula precedente moltiplicando la jacobiana cartesiana a destra per quella delle polari in partenza e a sinistra per l&rsquo;inversa di quella delle polari in arrivo.</p>
  <p><b>Che cosa è cambiato e che cosa no.</b> In cartesiane il determinante era $4(x^{2}+y^{2})=4r^{2}$; in polari è $4r$. <b>Il determinante non è un invariante di $d_pF$</b>, e non poteva esserlo: per un&rsquo;applicazione lineare fra due spazi <i>diversi</i> il determinante non ha senso finché non si scelgono le basi, e scegliendole in modo indipendente ai due capi lo si moltiplica per due numeri qualsiasi — qui $r$ in partenza e $1/r^{2}$ in arrivo. <b>Il rango invece è invariante</b>, perché moltiplicare per matrici invertibili non lo cambia. È questo che rende ben poste le definizioni della tappa che segue: immersioni e sommersioni si definiscono sul rango del differenziale, e di tutto ciò che la jacobiana contiene il rango è l&rsquo;unica informazione che non dipende dalle carte.</p>`}
]},


/* ---------------- 07 · IMMERSIONI, SOMMERSIONI, RANGO ---------------- */
{ num:'08', title:'Immersioni, sommersioni e rango costante', meta:'le definizioni · i due teoremi di forma normale · e la figura otto',
  blocchi:[
  {t:'prosa', title:'Le definizioni, e cosa dicono davvero', tag:'grammatica', html:R`
  <p>Avendo il differenziale come applicazione lineare, si classifica $F$ in base al <b>rango</b> di $d_pF$:</p>
  <ul>
   <li><b>immersione</b>: $d_pF$ è <b>iniettivo</b> per ogni $p$. Localmente $F$ «infila» $M$ dentro $N$ senza schiacciarla;</li>
   <li><b>sommersione</b>: $d_pF$ è <b>suriettivo</b> per ogni $p$. Localmente $F$ proietta $M$ su $N$;</li>
   <li><b>rango costante</b>: $\operatorname{rk}d_pF$ non dipende da $p$ (le prime due sono casi particolari).</li>
  </ul>
  $$F\ \text{immersione}\iff\forall p\in M\ \ d_pF\ \text{iniettivo},\qquad F\ \text{sommersione}\iff\forall p\in M\ \ d_pF\ \text{surgettivo}.$$
  <p><b>Due esempi minimi, per fissarli.</b> La mappa $t\mapsto(\cos t,\sin t)$ da $\mathbb{R}$ a $\mathbb{R}^{2}$ è un&rsquo;immersione: la velocità $(-\sin t,\cos t)$ non si annulla mai, e una velocità non nulla è un differenziale iniettivo da $T_{\mathbb{R},t}\cong\mathbb{R}$. La proiezione $(x,y)\mapsto x$ da $\mathbb{R}^{2}$ a $\mathbb{R}$ è una sommersione: la jacobiana $(1,0)$ ha rango $1$ ovunque, e le fibre sono le rette verticali. <b>Immersione e sommersione sono la stessa condizione — rango massimo — vista dai due lati</b>, a seconda di quale delle due dimensioni è la più piccola. E il rango è ben definito perché, come si è visto nella tappa del differenziale, cambiando carte la jacobiana si moltiplica a destra e a sinistra per matrici invertibili.</p>\n  <p>Come sono fatte queste mappe vicino a un punto lo dice il teorema del rango costante, nella tappa che segue: a meno di cambiare coordinate, sono proiezioni seguite da inclusioni.</p>
  <p>Due corollari che si usano continuamente: se $d_pF$ è <b>invertibile</b>, $F$ è un diffeomorfismo locale (<b>teorema di invertibilità locale</b> — e si vede subito perché $t\mapsto t^3$, omeomorfismo liscio di $\mathbb{R}$ in sé, fallisce in $0$: la sua inversa $t\mapsto t^{1/3}$ non è derivabile lì); se $F$ è una <span class="str" data-str="sommersione">sommersione</span>, le sue <b>fibre</b> sono sottovarietà, di dimensione $\dim M-\dim N$ — ed è l&rsquo;enunciato che il criterio del <span class="str" data-str="valore-regolare">valore regolare</span> rende operativo, perché trasforma la verifica di «questo insieme è una sottovarietà» in un conto di derivate.</p>`},
  {t:'prosa', title:'La figura otto: immersione si, sottovarieta no', tag:'trappola', html:R`
  <p>La curva $\gamma(t)=(\sin2t,\ \sin t)$ su $(-\pi,\pi)$ disegna una <b>figura a otto</b>. La sua velocità è $(2\cos 2t,\ \cos t)$, che <b>non si annulla mai</b> — le due componenti non hanno zeri comuni — quindi $\gamma$ è un&rsquo;<b>immersione iniettiva</b>.</p>
  <p><b>Eppure l&rsquo;immagine non è una sottovarietà</b>: nel punto di incrocio ogni intorno ha quattro rami, e non è omeomorfo a un intervallo. L&rsquo;errore sta nel credere che «immersione iniettiva» implichi «l&rsquo;immagine è una sottovarietà»: <b>manca una condizione topologica</b>, e la curva la viola perché i due estremi del dominio si avvicinano allo stesso punto dell&rsquo;immagine.</p>
  <p>La condizione che manca è la <span class="str" data-str="applicazione-propria">propriezza</span>: la controimmagine di ogni compatto deve essere compatta, e qui non lo è — un disco chiuso attorno al punto di incrocio ha per controimmagine dei $t$ che si accumulano sui due estremi del dominio, dove non c&rsquo;è nessun punto che li raccolga.</p>`},
  {t:'plot', title:'La figura otto: velocita mai nulla, e un punto che rovina tutto',
   intro:R`La curva $(\sin 2t,\ \sin t)$ per $t\in(-\pi,\pi)$: iniettiva, con velocità mai nulla, e con un&rsquo;immagine che non è una sottovarietà.`,
   plots:[
    {kind:'curve', x:'sin(2*t)', y:'sin(t)', tr:[-3.1416,3.1416], xr:[-1.4,1.4], yr:[-1.3,1.3],
     height:340, title:'nell’origine passano due rami: nessun intorno e un intervallo',
     marks:[{x:0, y:0, label:'qui l’intorno ha quattro rami', col:'#ff6b6b'},
            {x:1, y:0.7071, label:'t = pi/4', col:'#5eead4'}]}
   ],
   leggi:R`<b>La curva è liscia, iniettiva, e la sua velocità non si annulla mai</b>: tutte le condizioni «differenziali» sono soddisfatte. Il problema è <i>topologico</i> e sta tutto nell&rsquo;origine: la curva ci passa una volta sola come punto del dominio, ma i valori $t\to\pm\pi$ si avvicinano a quello stesso punto dell&rsquo;immagine. Quindi <b>la mappa non è un omeomorfismo sull&rsquo;immagine</b>, e l&rsquo;immagine non eredita la struttura.<br><br>
   <b>La lezione da portare avanti</b>: le condizioni sul differenziale controllano il comportamento <i>locale</i> nel dominio, e non dicono nulla su come l&rsquo;immagine si richiude su se stessa. Ogni volta che in questo corso si vuole concludere qualcosa <b>sull&rsquo;immagine</b>, serve un&rsquo;ipotesi topologica in più — ed è sempre la stessa: la propriezza.`},
  {t:'plot', title:'Due immersioni: una iniettiva, una che passa due volte per lo stesso punto',
   intro:R`A sinistra l'immagine di $t\mapsto(\cos t,\sin t)$ — un'immersione di $\mathbb{R}$ in $\mathbb{R}^{2}$. A destra $t\mapsto(t^{2}-1,\,t^{3}-t)$, che ha differenziale sempre iniettivo ma non è iniettiva: si autointerseca.`,
   plots:[
    {kind:'curve', x:'cos(t)', y:'sin(t)', tr:[0,6.2832], height:310, equal:true,
     xr:[-1.5,1.5], yr:[-1.5,1.5],
     title:'immersione iniettiva: la circonferenza'},
    {kind:'curve', x:'t*t-1', y:'t*t*t-t', tr:[-1.8,1.8], height:310,
     xr:[-1.5,2.6], yr:[-2.5,2.5],
     title:'immersione NON iniettiva: il nodo passa due volte per l’origine',
     marks:[{x:0, y:0, label:'t=-1 e t=+1 finiscono qui', col:'#ff6b6b', up:true}]}
   ],
   leggi:R`<p><b>Le due curve sono entrambe immersioni</b> — il vettore tangente non si annulla mai — e questo mostra, come la figura otto qui sopra, che «immersione» è una condizione puramente <i>locale</i>: dice come la mappa si comporta vicino a ogni singolo punto del dominio, e non dice niente su cosa succede fra punti lontani.</p>
   <p>Nella figura di destra i valori $t=-1$ e $t=+1$ finiscono nello stesso punto del piano. Vicino a ciascuno dei due, separatamente, la curva è liscia e regolare; ma l'immagine complessiva ha un incrocio, e <b>un incrocio non è una sottovarietà</b> — togliendo il punto di incrocio, un suo intorno nell&rsquo;immagine si spezza in quattro pezzi, mentre un intervallo bucato si spezza in due.</p>
   <p><b>La morale che il corso userà più volte</b>: per ottenere una sottovarietà non basta un'immersione, serve un'<i>immersione iniettiva e propria</i> — dove «propria» chiede in più che le controimmagini dei compatti siano compatte, ed è la condizione che esclude anche la figura otto. La distinzione fra «immersa» e «incassata» nasce esattamente qui, e vale la pena tenerla ferma da subito: sono due parole diverse perché sono due oggetti diversi.</p>`}
]},

{ num:'09', title:'Il teorema del rango costante, e le sezioni locali delle sommersioni', meta:'l’enunciato esatto e le due forme normali · perche il rango deve essere costante · le sezioni locali · una sommersione disegnata',
  blocchi:[
  {t:'prosa', title:'Dal rango in un punto al rango in un intorno', tag:'architettura', html:R`
  <p>Il rango del differenziale in un punto dice come la mappa tratta le velocità in quel punto. Il teorema di questa tappa dice che, se il rango resta lo stesso in tutto un intorno, quella informazione lineare decide anche la forma della mappa vicino al punto: esistono coordinate in cui la mappa <i>è</i> la sua parte lineare. È il teorema che trasforma lo studio del differenziale in geometria, e da esso discendono i tre fatti che il resto del corso usa di continuo: le fibre di una sommersione sono sottovarietà, le sommersioni hanno sezioni locali, e un&rsquo;immersione è localmente un&rsquo;inclusione.</p>
  <p>La dimostrazione si fa in carta, dove il teorema è quello della funzione inversa dell&rsquo;Analisi applicato due volte — una per raddrizzare la parte di rango pieno, una per mostrare che il resto, avendo rango zero, non dipende dalle coordinate rimaste. Lee la scrive per intero (Teorema 4.12, stampata 81); qui interessa l&rsquo;enunciato esatto e il motivo di ciascuna ipotesi.</p>`},
  {t:'reveal', title:'Il teorema del rango, e perche vale la pena impararne l’enunciato esatto', tag:'costruzione', steps:[
   {label:'L’enunciato', body:R`
   <div class="note"><b>Teorema del rango costante.</b> Sia $F:M^{m}\to N^{n}$ liscia con rango <b>costante</b> $k$ in un intorno di $p$. Allora esistono carte $(U,\varphi)$ attorno a $p$ e $(V,\psi)$ attorno a $F(p)$, con $\varphi(p)=0$ e $\psi(F(p))=0$, in cui $F$ si legge</p>
   $$\psi\circ F\circ\varphi^{-1}(x^{1},\dots,x^{m})=(x^{1},\dots,x^{k},0,\dots,0).$$</div>
   <p><b>In parole: a meno di cambiare coordinate in partenza e in arrivo, ogni mappa di rango costante è una proiezione seguita da un&rsquo;inclusione.</b> Non ci sono altri comportamenti possibili. Tutto ciò che di complicato una mappa sembra fare è, localmente, un artefatto della scelta delle coordinate.</p>
   <p><b>L&rsquo;ipotesi di rango costante va letta con attenzione</b>, ed è il punto su cui <b>Lee</b> (capitolo 4) insiste più del docente: non basta che il rango sia $k$ nel punto, deve esserlo in <i>tutto un intorno</i>. Quando il rango è massimo l&rsquo;ipotesi è automatica — il rango non può scendere localmente, perché un minore non nullo resta non nullo per continuità — ma nei casi intermedi va verificata, e se cade il teorema è falso.</p>`},
   {label:'I due casi particolari, che sono quelli che si usano', body:R`
   <p>Quando il rango è massimo l&rsquo;enunciato si specializza, e queste due forme sono ciò che si applica davvero:</p>
   <ul>
    <li><b>immersione</b> ($k=m$): $F$ si legge $(x^{1},\dots,x^{m})\mapsto(x^{1},\dots,x^{m},0,\dots,0)$. Localmente <i>è</i> l&rsquo;inclusione canonica di $\mathbb{R}^{m}$ in $\mathbb{R}^{n}$;</li>
    <li><b>sommersione</b> ($k=n$): $F$ si legge $(x^{1},\dots,x^{m})\mapsto(x^{1},\dots,x^{n})$. Localmente <i>è</i> la proiezione canonica.</li>
   </ul>
   <p>Da qui discende subito il fatto che rende le sommersioni lo strumento più usato del corso: <b>le fibre di una sommersione sono sottovarietà</b> di dimensione $m-n$, perché nella forma normale la fibra è $\{x^{1}=c^{1},\dots,x^{n}=c^{n}\}$, cioè un pezzo di piano coordinato. <b>È il teorema dei valori regolari, e nasce da qui</b>: dire che $c$ è un valore regolare significa esattamente che $F$ è una sommersione in ogni punto della fibra.</p>`},
   {label:'Perche COSTANTE, e non solo in un punto', body:R`
   <p>L&rsquo;ipotesi che il rango sia costante <i>in un intorno</i> non è decorativa. Nel caso di rango massimo è automatica — il rango è semicontinuo inferiormente, cioè non può scendere all&rsquo;improvviso, e se è già al massimo non può nemmeno salire — ma nel caso generale va richiesta.</p>
   <p><b>Il controesempio che lo mostra</b>: $F(x,y)=(x,xy)$ da $\mathbb{R}^{2}$ a $\mathbb{R}^{2}$ ha jacobiana di determinante $x$, quindi rango $2$ per $x\ne0$ e rango $1$ sull&rsquo;asse $y$. Nell&rsquo;origine nessuna forma normale del teorema vale, e infatti l&rsquo;immagine di $F$ — il piano meno l&rsquo;asse $y$, più l&rsquo;origine — non è né un aperto né una sottovarietà. <b>Dove il rango salta, la geometria si rompe</b>, e questo è il motivo per cui in tutto il corso si lavora con ipotesi di rango.</p>`}
  ]},
  {t:'prosa', title:'Le sommersioni hanno sezioni locali', tag:'teorema', html:R`
  <p>Una sezione locale di una mappa $\pi:M\to N$ è una mappa $\sigma:U\to M$, definita su un aperto di $N$, con $\pi\circ\sigma=\mathrm{id}_U$: sceglie con continuità un punto in ciascuna fibra sopra $U$. Lee dimostra che <b>una mappa liscia è una sommersione se e solo se ogni punto del dominio sta nell'immagine di una sezione locale liscia</b> (Teorema 4.26, stampata 88; Fig. 4.4). Il verso «sommersione allora sezioni» viene dal teorema del rango: in coordinate adattate la sommersione è la proiezione $(x,y)\mapsto x$, e $x\mapsto(x,y_0)$ è una sezione. Il verso opposto è la regola della catena: da $\pi\circ\sigma=\mathrm{id}$ segue $d\pi\circ d\sigma=\mathrm{id}$, quindi $d\pi$ è suriettivo. Da qui seguono le proprietà che rendono le sommersioni così comode: sono mappe aperte, e una funzione sull'arrivo è liscia se e solo se lo è la sua composizione con la sommersione.</p>
  <p>Un esempio da disegnare è $F(x,y)=x^2+y^2$ dal piano bucato alla semiretta $(0,\infty)$. Il suo differenziale $(2x,2y)$ non è mai nullo fuori dall'origine, quindi è una sommersione; le fibre sono le circonferenze centrate nell'origine, e una sezione locale è $s\mapsto(\sqrt s,\ 0)$, che attraversa ogni fibra una volta. Verifica: $$F(\sqrt s,0)=s.$$</p>`},
  {t:'plot', title:'Una sommersione, le sue fibre, e una sezione',
   intro:R`La sommersione $F(x,y)=x^2+y^2$ dal piano bucato alla semiretta: le fibre sono circonferenze, la sezione $s\mapsto(\sqrt s,0)$ è il raggio che le attraversa.`,
   plots:[
    {kind:'curve', x:'0.5*cos(t)', y:'0.5*sin(t)', tr:[0,6.2832], height:300, equal:true,
     xr:[-2,2], yr:[-2,2],
     title:'fibre F = 0.25, 1, 2.25, 3.24 e la sezione lungo il semiasse positivo',
     rings:[{r:1,col:'#8ea0b8'},{r:1.5,col:'#8ea0b8'},{r:1.8,col:'#8ea0b8'}],
     segs:[{x1:0.05,y1:0,x2:1.95,y2:0,col:'#d8a13a',width:2.4,label:'sezione: s -> (radice di s, 0)',lx:1.0,ly:0.22}],
     marks:[{x:0.5,y:0,col:'#d8a13a'},{x:1,y:0,col:'#d8a13a'},{x:1.5,y:0,col:'#d8a13a'},{x:1.8,y:0,col:'#d8a13a'},{x:0,y:0,col:'#c084fc',hollow:true,label:'origine: esclusa'}]}
   ],
   leggi:R`<p>Ogni circonferenza è la fibra di un valore di $F$, il quadrato del raggio; il raggio arancione è l'immagine della sezione, e incontra ogni fibra in un punto solo, quello sul semiasse positivo. Qualunque altro raggio sarebbe una sezione altrettanto buona: le sezioni locali di una sommersione sono tante, e la loro abbondanza è ciò che le rende utili. L'origine è esclusa perché lì il differenziale si annulla e la fibra degenera in un punto. Generale: una sommersione è localmente una proiezione, e le sezioni sono i grafici trasversi alle fibre. Accidentale: la simmetria rotazionale.</p>`},
  {t:'collaudo', title:'Controlla di aver capito', html:R`
  <ol>
  <li>Perché il rango di una mappa non dipende dalle carte scelte?</li>
  <li>Una mappa da una varietà compatta a una connessa, che sia una sommersione, è necessariamente suriettiva. Perché?</li>
  <li>Esiste una sommersione da $S^{2}$ a $\mathbb{R}$?</li>
  </ol>`,
   sol:R`<ol>
   <li>Perché cambiando carta la jacobiana viene sostituita da $B\,J\,A^{-1}$, con $A$ e $B$ jacobiane delle transizioni — che sono <b>invertibili</b>, essendo jacobiane di diffeomorfismi. Moltiplicare per matrici invertibili non cambia il rango. <b>È lo stesso argomento con cui in algebra lineare il rango di un'applicazione non dipende dalle basi</b>, ed è il motivo per cui «rango» è una nozione geometrica e non una proprietà della scrittura.</li>
   <li>Perché una sommersione è una <b>mappa aperta</b> — segue dalla forma normale, dove è la proiezione canonica, che è aperta.
  $$F\ \text{sommersione}\ \Longrightarrow\ \forall A\subseteq M\ \text{aperto}\ \ F(A)\ \text{aperto in}\ N.$$ Quindi l'immagine è un aperto; ma è anche compatta (immagine continua di un compatto) quindi chiusa; e un sottoinsieme non vuoto aperto e chiuso di uno spazio connesso è tutto lo spazio. <b>Aperto e chiuso in un connesso</b> è lo schema che si incontra a ogni capitolo di questo corso.</li>
   <li><b>No</b>, e la risposta segue dal punto precedente. Una sommersione $S^{2}\to\mathbb{R}$ sarebbe suriettiva, ma $\mathbb{R}$ non è compatto mentre l'immagine di $S^{2}$ deve esserlo. <b>Più concretamente</b>: ogni funzione liscia su una varietà compatta ha un massimo, e in quel punto il differenziale si annulla — quindi il rango cade a zero e la sommersione non può essere tale ovunque. <b>La compattezza obbliga a esistere punti critici</b>, ed è l'osservazione da cui parte la teoria di Morse.</li>
   </ol>`}
]},


/* ---------------- 08 · LE ALTRE DUE DEFINIZIONI ---------------- */
{ num:'10', title:'Le altre due definizioni, e perche i libri ne danno tre', meta:'le derivazioni di Lee · le componenti dei fisici · e il dizionario per leggere il libro',
  blocchi:[
  {t:'prosa', title:'Le derivazioni, cioe la definizione del libro', tag:'architettura', html:R`
  <p>Le note lo mettono come anticipazione, ed è giusto tenerlo qui: a ogni $v\in T_{M,p}$ si associa l&rsquo;applicazione
  $$C^{\infty}(M)\longrightarrow\mathbb{R},\qquad f\longmapsto d_pf(v).$$
  È lineare, e soddisfa la <b>regola di Leibniz</b>
  $$v(fg)=v(f)\,g(p)+f(p)\,v(g),$$
  che si verifica derivando $t\mapsto f(\gamma(t))\,g(\gamma(t))$ in $t=0$ con la regola del prodotto. <b>Cioè è una <i>derivazione</i> in $p$, che è il modo in cui Lee definisce i vettori tangenti.</b></p>
  <p>Più avanti nel corso si vedrà che questa corrispondenza è un <b>isomorfismo</b> fra il nostro $T_{M,p}$ e lo spazio tangente del libro, e che sotto quell&rsquo;isomorfismo il nostro $d_pF(v)$ corrisponde alla derivazione $f\mapsto d_p(f\circ F)(v)$, che è la definizione di differenziale del libro. <b>Per ora è un&rsquo;anticipazione, non uno strumento</b>, e il corso non la usa.</p>
  <div class="note"><b>Perché il docente non parte da lì, visto che il libro lo fa.</b> La definizione per derivazioni ha un vantaggio vero: la struttura di spazio vettoriale è gratis, perché le derivazioni si sommano. Ma a prima vista una derivazione non ha niente a che fare con la figura che tutti abbiamo in mente — una freccia attaccata a un punto — e il prezzo è che il differenziale va <i>definito</i> con una formula invece che ottenuto spingendo avanti una curva. Con le velocità si paga la struttura vettoriale (la Proposizione 4.3) e si guadagna tutto il resto.</div>`},
  {t:'prosa', title:'Le componenti, cioe la definizione dei fisici', tag:'idea', html:R`
  <p>La terza definizione è quella che in relatività generale compare per prima: <b>un vettore è un elenco di numeri $(v^1,\dots,v^n)$ associato a una carta, con la regola che cambiando carta diventa $w^{i}=\sum_j\frac{\partial y^{i}}{\partial x^{j}}v^{j}$.</b> È la più comoda per <i>calcolare</i>, ed è spesso presentata nella forma «un vettore è un oggetto che si trasforma come un vettore», che agli studenti di matematica suona circolare.</p>
  <p><b>Non lo è, e la tappa 04 dice esattamente perché</b>: la legge di trasformazione non è una definizione arbitraria, è la Proposizione 5.2, cioè una conseguenza del Lemma 4.2. L&rsquo;oggetto esiste prima; i numeri vengono dopo, appena si sceglie una carta.</p>
  <p><b>Il riassunto operativo</b>, che vale più di qualunque preferenza fra le tre: le <b>curve</b> sono comode per <i>costruire</i> un vettore (basta esibire un moto); le <b>derivazioni</b> per <i>dimostrare</i> (non nominano carte, quindi ciò che si prova è automaticamente indipendente dalle coordinate); le <b>componenti</b> per <i>calcolare</i>. Ogni testo ne sceglie una come definizione e dimostra le altre due. <b>Saper passare dall&rsquo;una all&rsquo;altra vale più che padroneggiarne una sola</b>, ed è il motivo per cui questa tappa esiste.</p>`},
  {t:'prosa', title:'Il dizionario per leggere il libro', tag:'metodo', html:R`
  <p>Il libro del corso è Lee, e scrive le cose in modo diverso dalle note. Le note danno il dizionario, e conviene averlo sott&rsquo;occhio perché <b>la differenza è solo di notazione e non di sostanza</b>:</p>
  <table>
  <tr><th>Lee</th><th>le note, e questo movimento</th></tr>
  <tr><td>$T_{M,p}$, $d_pF$</td><td>$T_{M,p}$, $d_pF$</td></tr>
  <tr><td>coordinate $x^i,\tilde x^i$; componenti $v^i,\tilde v^i$</td><td>$x^i,y^i$; $v^i,w^i$</td></tr>
  <tr><td>vettori coordinati, formula (3.8)</td><td>Definizione 5.1</td></tr>
  <tr><td>differenziale in coordinate, formula (3.9)</td><td>Proposizione 6.2</td></tr>
  <tr><td>cambio di coordinate, formule (3.11) e (3.12)</td><td>Proposizione 5.2</td></tr>
  <tr><td>proprietà dei differenziali, Proposizioni 3.6 e 3.9</td><td>Proposizione 6.3</td></tr>
  <tr><td>velocità di una curva, Proposizione 3.24 e Corollario 3.25</td><td>Definizione 6.1</td></tr>
  </table>
  <p>Due avvertenze sulla lettura di Lee: scrive gli indici di coordinate e di componenti <b>in alto</b>, e usa la <b>convenzione di Einstein</b> — un indice ripetuto una volta in alto e una in basso è sommato, quindi $v^i\partial/\partial x^i|_p$ significa $\sum_i v^i\partial/\partial x^i|_p$. E il suo Corollario 3.25 dice che $d_pF(v)=(F\circ\gamma)'(0)$ per <i>una qualunque</i> curva con $\gamma(0)=p$ e $\gamma'(0)=v$: <b>per noi quello è la definizione</b>.</p>`}
]},

/* ---------------- 09 · ESERCIZI ---------------- */
{ num:'11', title:'Esercizi — tocca a te', meta:'il tangente alla sfera calcolato in due modi · il differenziale del determinante',
  blocchi:[
  {t:'esercizio', title:'1 · Lo spazio tangente alla sfera, per due strade',
   src:'il confronto fra il metodo astratto e quello con lambiente',
   testo:R`Calcola $T_{S^2,p}$ per $p\in S^{2}\subset\mathbb{R}^{3}$ in due modi: (a) come sottospazio di $\mathbb{R}^{3}$, usando che $S^{2}$ è un insieme di livello; (b) usando la carta stereografica. Verifica che danno lo stesso.`,
   steps:[
    {label:'Con l’ambiente', body:R`
    <p>$S^{2}=F^{-1}(1)$ con $F(x)=|x|^{2}$. Una curva $\gamma$ sulla sfera soddisfa $|\gamma(t)|^{2}=1$; derivando in $t=0$:</p>
    $$2\,\langle\gamma(0),\dot\gamma(0)\rangle=0\quad\Longrightarrow\quad \dot\gamma(0)\perp p.$$
    <p>Quindi $T_{S^2,p}=\{v\in\mathbb{R}^{3}:\langle v,p\rangle=0\}=p^{\perp}$, <b>il piano ortogonale al raggio</b>, di dimensione $2$. Vale la pena notare che l'inclusione «$\subseteq$» è quella appena dimostrata, mentre «$\supseteq$» richiede di esibire, per ogni $v\perp p$, una curva sulla sfera con quella velocità — e basta il cerchio massimo $\gamma(t)=p\cos(|v|t)+\frac{v}{|v|}\sin(|v|t)$, che sta sulla sfera e ha $\dot\gamma(0)=v$. <b>Le due inclusioni si dimostrano con tecniche diverse</b>: una derivando il vincolo, l'altra costruendo curve, ed è tipico dei conti sugli spazi tangenti. <b>La regola generale che ne esce</b>: per un insieme di livello di $F$, lo spazio tangente è il <i>nucleo del differenziale</i> $\ker d_pF$ — qui il nucleo di $v\mapsto2\langle p,v\rangle$.</p>`},
    {label:'Con la carta', body:R`
    <p>Nella carta stereografica $\varphi_N$ i vettori tangenti sono generati da $\partial/\partial u^{1}$ e $\partial/\partial u^{2}$: due vettori, quindi dimensione $2$. <b>Il conto è più rapido ma dà meno informazione</b>: dice la dimensione e una base, non dice «quale piano di $\mathbb{R}^{3}$» — perché in quel linguaggio $\mathbb{R}^{3}$ non esiste.</p>
    <p>Per confrontare si deve calcolare $d_p\iota$, il differenziale dell'inclusione $\iota:S^{2}\hookrightarrow\mathbb{R}^{3}$, e applicarlo ai due vettori della base: si ottengono due vettori di $\mathbb{R}^{3}$ ortogonali a $p$, che generano $p^{\perp}$. <b>Le due risposte coincidono, come devono</b>, e la morale è pratica: <b>quando c'è un ambiente conviene usarlo</b>, perché dà una descrizione concreta; quando non c'è, le carte bastano comunque.</p>`}
   ]},
  {t:'plot', title:'Il piano tangente alla sfera, e il cerchio massimo che lo riempie',

   plots:[
    {kind:'param3d', x:'sin(u)*cos(v)', y:'sin(u)*sin(v)', z:'cos(u)', ur:[0,3.14159], vr:[0,6.28319], nu:22, nv:30, height:360, pitch:-0.55, yaw:2.1,
     normal:{u0:0.8411, v0:0.4636, len:0.45},
     curves3d:[{x:'0.4074+(0.7778)*t',y:'-0.1852+(0)*t',z:'1.1852+(-0.7778)*t',tr:[0,1],n:24,col:'#4c8dff',width:1.8},{x:'1.1852+(-0.2593)*t',y:'-0.1852+(1.0371)*t',z:'0.4074+(-0.2593)*t',tr:[0,1],n:24,col:'#4c8dff',width:1.8},{x:'0.9259+(-0.7778)*t',y:'0.8519+(0)*t',z:'0.1481+(0.7778)*t',tr:[0,1],n:24,col:'#4c8dff',width:1.8},{x:'0.1481+(0.2593)*t',y:'0.8519+(-1.0371)*t',z:'0.9259+(0.2593)*t',tr:[0,1],n:24,col:'#4c8dff',width:1.8},{x:'0.7963+(-0.2593)*t',y:'-0.1852+(1.0371)*t',z:'0.7963+(-0.2593)*t',tr:[0,1],n:24,col:'#4c8dff',width:1},{x:'0.2778+(0.7778)*t',y:'0.3333+(0)*t',z:'1.0556+(-0.7778)*t',tr:[0,1],n:24,col:'#4c8dff',width:1},{x:'1.02*(0.6667*cos(t)+0.7071*sin(t))',y:'1.02*(0.3333*cos(t))',z:'1.02*(0.6667*cos(t)-0.7071*sin(t))',tr:[0,6.28319],n:160,col:'#d8a13a',width:3},{x:'0.6667+(0.3536)*t',y:'0.3333+(0)*t',z:'0.6667+(-0.3536)*t',tr:[0,1],n:24,col:'#ff6b6b',width:5}],
     title:'p, il piano tangente (blu), la normale (bianca), il cerchio massimo (arancione) e la sua velocità (rossa)'}
   ],
   leggi:R`<p>Il piano blu è $p^{\perp}=\{v\in\mathbb{R}^{3}:\langle v,p\rangle=0\}$ e la freccia bianca è la normale, che per la sfera è il punto stesso letto come vettore. È la Fig. 3.2 di Lee, dove il tangente «geometrico» a $S^{n-1}$ in un punto è proposto come lo spazio dei vettori ortogonali al raggio — e subito scartato come definizione, perché non dice nulla su come definire i vettori tangenti dove non c&rsquo;è uno spazio ambiente. Ed è la Fig. 5.12, dove lo stesso piano torna come <b>sottospazio</b> del tangente all&rsquo;ambiente: l&rsquo;inclusione $\iota:S^{2}\hookrightarrow\mathbb{R}^{3}$ è un&rsquo;immersione, $d_p\iota$ è iniettivo, e si identifica $T_{S^2,p}$ con la sua immagine.</p>
   <p>Il vettore $v=(1,0,-1)$ sta nel piano, perché $\langle p,v\rangle=\tfrac23-\tfrac23=0$. Il cerchio arancione — disegnato un soffio sopra la superficie, perché non ne venga coperto — è $\gamma(t)=p\cos t+u\sin t$ con $u=v/|v|$: siccome $p$ e $u$ sono unitari e ortogonali, $|\gamma(t)|^{2}=\cos^{2}t+\sin^{2}t=1$, quindi la curva sta sulla sfera, e $\gamma'(0)=u$ — il tratto rosso. È la curva del primo passo dell&rsquo;esercizio, e la caratterizzazione che c&rsquo;è dietro è la Proposizione 5.35 di Lee: <b>un vettore dell&rsquo;ambiente è tangente alla sottovarietà se e solo se è la velocità di una curva che resta nella sottovarietà</b>.</p>
   <p>Per l&rsquo;inclusione «$\supseteq$» Lee però non costruisce curve: conta le dimensioni (Proposizione 5.38). Siccome $F\circ\iota$ è costante, $d_pF\circ d_p\iota=0$, quindi il tangente sta nel nucleo di $d_pF$; il nucleo di $v\mapsto2\langle p,v\rangle$ ha dimensione $3-1=2$, come il tangente; e un sottospazio con la dimensione dello spazio che lo contiene è tutto lo spazio. <b>Il conto delle dimensioni sostituisce la costruzione</b>, ed è il motivo per cui il criterio del <span class="str" data-str="valore-regolare">valore regolare</span> regala gli spazi tangenti senza fatica. Generale: il tangente a un insieme di livello regolare è il nucleo del differenziale del vincolo. Accidentale: la sfera, dove quel nucleo si scrive come complemento ortogonale perché il vincolo è un quadrato della norma.</p>`},
  {t:'plot', title:'Il piano tangente come approssimazione, e come spazio a se',
   intro:R`La superficie $z=x^{2}-y^{2}$ con il piano tangente nel punto $(0{,}7,\,0{,}5)$. Trascina per ruotare: il piano tocca la superficie in un punto solo e la attraversa altrove, perché la sella ha curvature di segno opposto.`,
   plots:[
    {kind:'surface3d', f:'x*x-y*y', xr:[-1.6,1.6], yr:[-1.6,1.6], n:40, height:350,
     tangent:{x0:0.7, y0:0.5, span:0.7},
     title:'la superficie e il suo piano tangente: contatto del primo ordine'}
   ],
   leggi:R`<p><b>Il piano tangente approssima la superficie al primo ordine</b>: vicino al punto di contatto la differenza fra i due va a zero più rapidamente della distanza. È la definizione di differenziabilità, vista in tre dimensioni — ed è la stessa nozione di contatto del primo ordine della tappa 02, dove due curve erano equivalenti quando la loro differenza era $o(t)$.</p>
   <p>Ma la figura mostra anche il limite dell'immagine, ed è la ragione per cui il corso non la usa come definizione. <b>Questo piano è disegnato dentro $\mathbb{R}^{3}$</b>, e la sua posizione — inclinata così, appoggiata lì — è informazione sull'immersione, non sulla superficie. Una superficie astratta ha lo stesso spazio tangente senza avere nessun piano dove metterlo.</p>
   <p>Nota infine che il piano <b>attraversa</b> la superficie invece di restarle da una parte: succede perché la sella curva verso l'alto in una direzione e verso il basso nell'altra. In un punto di massimo il piano resterebbe tutto sopra, in uno di minimo tutto sotto. <b>Quella distinzione è il segno della forma quadratica seconda</b>, e appartiene alla geometria con metrica — cioè al capitolo che questo corso non apre. <b>Il tangente vede solo il primo ordine, e del primo ordine non sa dire se si sta salendo su una collina o attraversando una sella.</b></p>`},
  {t:'esercizio', title:'2 · Il differenziale del determinante, e l’algebra di Lie di SL(n)',
   src:'il conto che lega questo movimento ai gruppi di matrici',
   testo:R`Calcola $d_I(\det)$, il differenziale del determinante nell'identità, e usalo per determinare lo spazio tangente a $SL(n,\mathbb{R})$ nell'identità.`,
   steps:[
    {label:'Il differenziale', body:R`
    <p>Si usa la definizione con le curve, ed è il caso in cui si vede che conviene. Prendendo $\gamma(t)=I+tH$, che per $t$ piccolo sta in $GL(n)$:</p>
    $$\det(I+tH)=1+t\,\mathrm{tr}(H)+O(t^{2}),$$
    <p>perché nello sviluppo del determinante il termine lineare in $t$ raccoglie esattamente la somma dei minori diagonali, cioè la traccia. Derivando in $t=0$:</p>
    $$d_I(\det)(H)=\mathrm{tr}(H).$$
    <p><b>È uno dei conti più usati di tutta la matematica applicata</b>, e conviene ricordarlo nella forma generale $d_A(\det)(H)=\det(A)\,\mathrm{tr}(A^{-1}H)$, che per $A=I$ si riduce a questa. Si incontra ovunque compaia un cambio di variabili: la derivata del determinante jacobiano che governa come cambiano i volumi, l'equazione di Liouville in meccanica statistica, la formula per la variazione del determinante della metrica in relatività.</p>`},
    {label:'Lo spazio tangente', body:R`
    <p>$SL(n)=\det^{-1}(1)$, e lo spazio tangente è il nucleo del differenziale:</p>
    $$T_{SL(n),I}=\{H:\mathrm{tr}(H)=0\},$$
    <p>le matrici a <b>traccia nulla</b>. La dimensione è $n^{2}-1$, in accordo con il conto del rango già fatto. <b>Questo spazio si chiama $\mathfrak{sl}(n)$</b> ed è l'algebra di Lie del gruppo: tutta l'informazione infinitesima del gruppo è lì dentro.</p>
    <p><b>Lo stesso metodo dà $\mathfrak{o}(n)$</b>: derivando $A^{T}A=I$ lungo una curva $\gamma(t)$ con $\gamma(0)=I$ e $\dot\gamma(0)=H$ si ottiene $\dot\gamma^{T}\gamma+\gamma^{T}\dot\gamma=0$, che in $t=0$ dà $H^{T}+H=0$: le matrici <b>antisimmetriche</b>, di dimensione $\frac{n(n-1)}{2}$. Per $n=3$ sono tre parametri, e infatti una matrice antisimmetrica $3\times3$ si identifica con un vettore — il vettore velocità angolare, che è esattamente il modo in cui le rotazioni infinitesime compaiono in meccanica. <b>Vincolo simmetrico, tangente antisimmetrico</b>: è la regola che conviene tenere a mente, e che si ritrova ogni volta che un gruppo è definito da una forma bilineare da preservare.</p>`}
   ]},
  {t:'esercizio', title:'3 · La proiezione del toro sull’asse verticale',
   src:'il caso in cui il rango cade, e si vede dove',
   testo:R`Sia $\mathbb{T}^{2}\subset\mathbb{R}^{3}$ il toro di rivoluzione attorno all'asse $z$, e $h:\mathbb{T}^{2}\to\mathbb{R}$ la funzione altezza $h(x,y,z)=z$. Dove $h$ è una sommersione? Che cosa sono le sue fibre, e come cambiano attraversando i punti critici?`,
   steps:[
    {label:'Dove il rango cade', body:R`
    <p>$h$ è la restrizione di una mappa lineare dell'ambiente, quindi è liscia senza conti: la restrizione di una mappa liscia dell&rsquo;ambiente a una sottovarietà è liscia. Il suo differenziale in un punto del toro è la proiezione sulla direzione $z$ <i>ristretta allo spazio tangente</i>: si annulla esattamente dove il piano tangente al toro è <b>orizzontale</b>.</p>
    <p>Sul toro standard questo accade in <b>quattro</b> punti: il massimo assoluto, il minimo assoluto, e due punti di sella — quello più alto del «buco» interno e quello più basso. In tutti gli altri punti $h$ è una sommersione, e le sue fibre sono sottovarietà di dimensione $2-1=1$.</p>`},
    {label:'Come cambiano le fibre', body:R`
    <p>Al variare del livello $c$, la fibra $h^{-1}(c)$ cambia <b>tipo topologico</b> solo attraversando i quattro valori critici:</p>
    <ul>
     <li>sotto il minimo: <b>vuota</b>;</li>
     <li>fra minimo e prima sella: <b>una circonferenza</b>;</li>
     <li>fra le due selle: <b>due circonferenze</b>;</li>
     <li>fra seconda sella e massimo: <b>una circonferenza</b>;</li>
     <li>sopra il massimo: vuota di nuovo.</li>
    </ul>
    <p><b>Questa è la teoria di Morse in miniatura</b>, e il conto dice qualcosa di preciso: i punti critici di una funzione su una varietà compatta «sanno» la sua forma. Per il toro sono quattro e sono di tre tipi (min, due selle, max); per la sfera sarebbero due. L'ipotesi che rende il conto possibile e' la <span class="str" data-str="compattezza">compattezza</span>: su una varieta' non compatta una funzione puo' non avere ne' massimo ne' minimo, e l'argomento cade. <b>La differenza fra due e quattro è la differenza fra sfera e toro</b>, e si legge da una qualunque funzione altezza — il che è sorprendente, perché la funzione dipende da come il toro è messo nello spazio e il risultato no.</p>`}
   ]},
  {t:'plot', title:'La funzione altezza sul toro: dove il rango cade, e come cambiano le fibre',
   intro:R`Sezione del toro nel piano $(\rho,z)$ con $\rho=\sqrt{x^{2}+y^{2}}$, $R=2$, $r=1$. Le rette orizzontali sono i livelli di $h=z$; i quattro valori critici sono quelli in cui la retta è tangente alla sezione.`,
   plots:[
    {kind:'contour', f:'pow(sqrt(x*x+1e-9)-2,2)+y*y', xr:[0.3,3.7], yr:[-1.6,1.6], height:320,
     levels:[1], col:'#5eead4', label:'sezione del toro',
     title:'i quattro livelli critici: min, due selle, max',
     segs:[{x1:0.3, y1:-1, x2:3.7, y2:-1, col:'#ff6b6b', dash:true, width:1.5, label:'z=-r: minimo', lx:2.9, ly:-0.92},
           {x1:0.3, y1:0, x2:3.7, y2:0, col:'#d8a13a', dash:true, width:1.5, label:'z=0: le due selle', lx:2.9, ly:0.08},
           {x1:0.3, y1:1, x2:3.7, y2:1, col:'#b98cff', dash:true, width:1.5, label:'z=+r: massimo', lx:2.9, ly:1.08},
           {x1:0.3, y1:0.6, x2:3.7, y2:0.6, col:'#4d5a6b', width:1.2, label:'un livello regolare', lx:0.5, ly:0.68}]}
   ],
   leggi:R`<p><b>La sezione è una circonferenza, e ogni retta orizzontale la taglia in zero, uno o due punti.</b> Ruotando attorno all'asse, ciascuno di quei punti diventa una circonferenza del toro: ecco perché una fibra regolare è fatta di una o due circonferenze, e perché il numero cambia solo quando la retta è tangente.</p>
   <p>La retta grigia, a $z=0{,}6$, taglia la sezione in due punti — uno a $\rho$ piccolo e uno a $\rho$ grande — e la fibra corrispondente è fatta di <b>due</b> circonferenze, una interna e una esterna al buco. La retta arancione a $z=0$ le taglia entrambe nel punto di tangenza: è il livello in cui le due si fondono, e sono le <b>selle</b>.</p>
   <p><b>Il conto vale per qualunque toro comunque deformato</b>, purché resti un toro: i punti critici possono spostarsi e aumentare, ma la loro combinazione con segno — massimi meno selle più minimi — resta $0$, che è la caratteristica di Eulero del toro. <b>Per la sfera varrebbe $2$.</b> È un invariante topologico ottenuto contando i punti dove una derivata si annulla, ed è il primo assaggio di come l'analisi su una varietà riveli la sua forma.</p>`},
  {t:'collaudo', title:'Controlla di aver capito', html:R`
  <ol>
  <li>Perché $\partial/\partial x^{i}$ dipende da tutta la carta e non solo dalla coordinata $x^{i}$?</li>
  <li>Il differenziale $d_pF$ è definito fra quali spazi, e perché non ha senso parlare della «matrice jacobiana di $F$» senza altro?</li>
  <li>Due varietà diffeomorfe hanno spazi tangenti isomorfi. Vale il viceversa?</li>
  <li>Nella Proposizione 4.3 si trasporta la struttura di $\mathbb{R}^n$ usando <i>una</i> carta. Perché il risultato non dipende da quale?</li>
  </ol>`,
   sol:R`<ol>
   <li>Perché $\partial/\partial x^{1}$ significa «derivare rispetto a $x^{1}$ <b>tenendo fisse le altre coordinate</b>», e quali siano le altre dipende dalla carta. Cambiando le coordinate $x^{2},\dots,x^{n}$ ma lasciando $x^{1}$ invariata, il vettore $\partial/\partial x^{1}$ <b>cambia</b>. <b>È l'errore più comune del corso</b>, e la notazione lo favorisce: il simbolo nomina una sola coordinata e dipende da tutte. In relatività generale lo stesso equivoco genera confusione sulla differenza fra «derivata parziale» e «derivata covariante».</li>
   <li>Fra $T_{M,p}$ e $T_{N,F(p)}$, ed è un'applicazione <b>lineare fra spazi vettoriali astratti</b>. La matrice jacobiana è la sua rappresentazione <i>rispetto a due basi coordinate</i>, una in partenza e una in arrivo: cambiando carte la matrice cambia (per coniugio con le jacobiane delle transizioni) mentre l'applicazione lineare resta la stessa. <b>Il differenziale è l'oggetto, la jacobiana è la sua scrittura</b> — e questo è il motivo per cui il rango, che non dipende dalle basi, è una nozione geometrica.</li>
   <li><b>No, e clamorosamente no</b>: ogni varietà di dimensione $n$ ha tutti gli spazi tangenti isomorfi a $\mathbb{R}^{n}$, quindi la sfera e il toro — quest'ultimo costruibile come <span class="str" data-str="quoziente-topologico">quoziente</span> del piano, la prima no — hanno spazi tangenti isomorfi senza essere diffeomorfi. <b>Lo spazio tangente in un punto non sa niente della forma globale</b>: è un oggetto puramente locale, e tutta l'informazione interessante sta in <i>come</i> gli spazi tangenti si incollano al variare del punto. È esattamente questo il contenuto del fibrato tangente, e il motivo per cui esiste il movimento successivo.</li>
   <li>Perché due letture diverse differiscono per $\theta_\psi\circ\theta_\varphi^{-1}$, che per il Lemma 4.2 è la <b>jacobiana del cambio di carte</b>, cioè un isomorfismo <i>lineare</i>. E un isomorfismo lineare manda somme in somme e multipli in multipli: trasportando la struttura con $\psi$ si ottengono le stesse operazioni che trasportandola con $\varphi$. <b>Se la transizione fosse solo un omeomorfismo la proposizione sarebbe falsa</b>, ed è il punto in cui la struttura <i>liscia</i> della varietà viene consumata.</li>
   </ol>`}
]},

/* ---------------- 10 · IL SENSO ---------------- */
{ num:'12', title:'Il senso, e le rotte', meta:'cosa apre, e dove il tangente riappare',
  blocchi:[
  {t:'prosa', title:'Cosa lascia in mano', tag:'sintesi', html:R`
  <p><b>Il punto.</b> Un vettore non è una freccia: è <b>la classe di tutti i moti che hanno quella velocità</b>. La freccia esiste, ma vive in $\mathbb{R}^n$ e ci arriva attraverso una carta — ed è la carta a darle le coordinate, non la varietà. Questa sostituzione è ciò che rende possibile fare geometria senza ambiente.</p>
  <p><b>La macchina, in tre righe.</b> $\theta_\varphi$ legge i vettori come $n$-uple; letture diverse differiscono per la jacobiana del cambio di carte; siccome quella è lineare, la struttura di spazio vettoriale è unica e il differenziale è la jacobiana del rappresentante locale. <b>Tutto il resto del movimento sono conseguenze di queste tre.</b></p>
  <p><b>A valle.</b> Restano da mettere insieme tutti i $T_{M,p}$ in una varietà sola, il fibrato tangente — e lì le derivazioni torneranno, perché un campo vettoriale è comodo vederlo come operatore; il rango del differenziale servirà a riconoscere le sottovarietà; e si studierà che cosa succede quando due derivazioni non commutano.</p>
  <div class="note"><b>Per chi pensa in meccanica.</b> Se $M$ è lo spazio delle configurazioni di un sistema, il fibrato tangente $TM$ è il suo <b>spazio degli stati</b>, e una lagrangiana è una funzione su $TM$. Questo risponde a un vecchio rompicapo: $\dot q$ è la derivata di $q$ o una variabile indipendente? <b>Su $TM$ è una coordinata indipendente</b>, e diventa la derivata di $q$ soltanto lungo il sollevamento $t\mapsto(\gamma(t),\gamma'(t))$ di una curva.</div>`},
  {t:'prolessi', title:'Dove riappare questo movimento',
   oggetto:R`<b>Il vettore tangente come classe di velocità</b>, e il differenziale come spinta in avanti di un moto.`,
   rotte:[
    {dove:'Meccanica<br>analitica', txt:R`Le <b>velocità generalizzate</b> $\dot q$ sono vettori tangenti allo spazio delle configurazioni, e la lagrangiana è una funzione sul <b>fibrato tangente</b>. Il passaggio a $p=\partial L/\partial\dot q$ porta al fibrato <i>co</i>tangente, ed è la ragione geometrica per cui hamiltoniana e lagrangiana vivono su spazi diversi.`},
    {dove:'Relativita<br>generale', txt:R`La <b>quadrivelocità</b> è un vettore tangente allo spazio-tempo, e il fatto che i vettori vivano in spazi tangenti <i>diversi</i> in punti diversi è la ragione per cui confrontarli richiede una connessione — e da lì la curvatura.`},
    {dove:'Sistemi<br>dinamici', txt:R`Un sistema dinamico è un campo vettoriale: a ogni stato si assegna la <b>velocità con cui evolve</b>. La linearizzazione attorno a un equilibrio è il differenziale, e i suoi autovalori decidono la stabilità.`},
    {dove:'Ottimizzazione', txt:R`Il <b>gradiente</b> su una varietà ha senso solo con una metrica, ma il <b>differenziale</b> no: e' definito sempre. La distinzione fra i due — covariante e controvariante — nasce esattamente qui, e in ottimizzazione decide se un algoritmo e' indipendente dalla parametrizzazione.`}
   ],
   domanda:R`Lo spazio tangente in punti diversi è uno spazio vettoriale diverso: <b>non c&rsquo;è nessun modo canonico di confrontare un vettore in $p$ con uno in $q$</b>. In $\mathbb{R}^n$ sembra si possa (si traslano le frecce), ma quella è una struttura in più dello spazio euclideo, non della varietà. Sommare $v\in T_{M,p}$ e $w\in T_{M,q}$ non è un&rsquo;imprecisione: è un errore. <b>Domanda che porti avanti:</b> che cosa serve per trasportare un vettore da un punto a un altro? La risposta è una <b>connessione</b>, la sua ambiguità lungo cammini diversi è la <b>curvatura</b>, e in fisica quell&rsquo;ambiguità è la fase di Berry e il campo di gauge. <b>Nel corso di Diverio non ci sono</b>: questo è precisamente il punto in cui il programma si ferma, e da cui parte la geometria riemanniana.`}
]}

];

var byId = {}; TAPPE.forEach(function(s){ byId[s.num]=s; });

var VKEY='pm-nucleogd-06-visited';
function loadSeen(){ try{ return new Set(JSON.parse(localStorage.getItem(VKEY)||'[]')); }catch(e){ return new Set(); } }
function saveSeen(s){ try{ localStorage.setItem(VKEY, JSON.stringify(Array.from(s))); }catch(e){} }
var SEEN = loadSeen();

function renderNav(active){
  var nav=document.getElementById('sidebar');
  nav.innerHTML='';
  var h=document.createElement('h2'); h.textContent='Nucleo gd-06 · le tappe'; nav.appendChild(h);
  TAPPE.forEach(function(s){
    var b=document.createElement('button');
    b.className='navitem'+(active===s.num?' active':'')+(SEEN.has(s.num)?' seen':'');
    b.innerHTML='<span class="dot"></span><span class="nx">'+s.num+'</span><span>'+s.title+'</span>';
    b.onclick=function(){ showTappa(s.num); };
    nav.appendChild(b);
  });
}

/* ---- renderer dei blocchi ---- */
function sectionProsa(title, tag, html){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var body=elFromHTML('<div class="open-body">'+html+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function sectionGram(title, rows){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag gramtag">grammatica</span></h3>';
  var inner='<table class="gramtab">';
  rows.forEach(function(r){ inner+='<tr><td class="gs">'+r[0]+'</td><td>'+r[1]+'</td></tr>'; });
  inner+='</table>';
  var body=elFromHTML('<div class="gramwrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
/* --- blocco PLOT: la figura non decora, si legge. Ogni plot porta una chiave di lettura. --- */
function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';
  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionSvelabile(title, tag, html, sol){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var c=document.createElement('div'); c.className='collaudo-item';
  var q=document.createElement('div'); q.className='cq'; q.innerHTML=html||'';
  c.appendChild(q); typeset(q);
  if(sol){
    var a=document.createElement('div'); a.className='ca'; a.style.display='none';
    a.innerHTML='<b>Soluzione.</b> '+sol;
    var btn=document.createElement('button'); btn.className='reveal-btn small';
    btn.textContent='Rivela la soluzione';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a);
      btn.disabled=true; btn.classList.add('done'); btn.textContent='Soluzione rivelata'; };
    c.appendChild(btn); c.appendChild(a);
  }
  wrap.appendChild(c); return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    /* DUE SCHEMI, NON UNO — scoperto il 2026-10-06 provando le pagine vive. I movimenti
       scritti per primi (em-01..03, me-10b, i collaudi di gd-01..09 e di quattro em)
       usano una forma piu' semplice: `reveal` e `prolessi` con un solo `html`,
       `esercizio` e `collaudo` con `html` + `sol`. Il renderer ne conosceva una sola e
       chiamava `steps.forEach` su `undefined`: TypeError, e la tappa si fermava li' —
       62 blocchi in 17 movimenti su 74. Non si riscrive il contenuto per far contento
       il renderer: e' il renderer che deve leggere cio' che c'e'.
       E in fondo un ramo che NON muore: uno schema nuovo di domani deve far vedere un
       avviso in quella sezione, non spegnere la pagina sotto di se'. */
    try{
      if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
      else if(b.t==='prolessi') m.appendChild(b.rotte ? sectionProlessi(b)
                                   : sectionProsa(b.title,'prolessi',b.html));
      else if(b.t==='reveal')m.appendChild(b.steps ? sectionReveal(b.title,b.tag,b.steps)
                                   : sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='esercizio') m.appendChild(b.steps ? sectionEsercizio(b)
                                   : sectionSvelabile(b.title,'esercizio',b.html,b.sol));
      else if(b.t==='collaudo')  m.appendChild(b.items ? sectionCollaudo(b.title,b.items)
                                   : sectionSvelabile(b.title,'provi, poi riveli',b.html,b.sol));
      else if(b.t==='plot')      m.appendChild(sectionPlot(b));
      else m.appendChild(sectionProsa(b.title||'(blocco)', 'tipo sconosciuto: '+b.t,
                                      b.html||''));
    }catch(err){
      var avv=document.createElement('section'); avv.className='section';
      avv.innerHTML='<h3>'+(b.title||'(blocco)')+'<span class="tag">non reso</span></h3>'
        +'<p style="color:#ff6b6b">Questo blocco non si &egrave; potuto rendere ('
        +b.t+': '+err.message+'). Il resto della tappa continua sotto.</p>';
      m.appendChild(avv);
    }
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* I POP-UP DEGLI STRUMENTI. `cablaStrumenti` esisteva dal 18-09 e non la chiamava
     nessuno: i 229 rimandi del percorso erano <span> senza handler, e il clic non
     faceva niente. Nessun controllo poteva vederlo — la sintassi era valida, le schede
     c'erano tutte, le formule rendevano: il guasto esisteva solo a pagina viva. Qui, e
     dopo ogni inserimento successivo, perche' la tappa si rimonta da capo a ogni
     cambio e gli handler vanno riattaccati al DOM nuovo. */
  cablaStrumenti(m);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}

});

  var h=(location.hash||'').replace('#','');
