    text-transform:uppercase;}
  /* --- blocchi figura --- */

  /* --- figure importate da una dispensa del docente ---

  .fig-nota{background:var(--panel);border:1px solid var(--border);border-radius:12px;

  .str{color:var(--gram);border-bottom:1px dashed var(--gram);cursor:pointer;}

  table.protab tr:last-child td{border-bottom:none;}
  table.protab td.pd{white-space:nowrap;color:var(--pro);width:1%;font-weight:700;font-size:.78rem;

  .prevnext{display:flex;justify-content:space-between;gap:12px;margin-top:40px;

  .pnbtn{flex:1 1 0;background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:12px 16px;cursor:pointer;color:var(--txt);text-align:left;transition:.14s;font:inherit;}
  .pnbtn:hover{border-color:var(--accent);background:var(--panel2);}

  code{background:var(--panel2);border:1px solid var(--border);border-radius:5px;

  .katex{font-size:1.02em;color:var(--txt);} .katex-display{margin:.5em 0;overflow-x:auto;overflow-y:hidden;}

  @media(max-width:860px){
    .shell{flex-direction:column;}
    .sidebar{width:100%;flex:none;position:static;max-height:none;border-right:none;

<script>

const R = String.raw;

function typeset(el){

function elFromHTML(html){ var d=document.createElement('div'); d.innerHTML=html; return d; }

/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un
   rimando scritto nella prosa:

       <span class="str" data-str="serie-geometrica">la serie geometrica</span>

   Le schede citate da questo nucleo sono cucite qui sotto dal montaggio
   (assembla-nucleo.js): la pagina resta autosufficiente — niente fetch,

   Apertura: lo stesso gesto del collaudo (si clicca, il pannello compare,
   si typeset una volta sola), portato dentro la frase.
   =================================================================== */
var CORSO = 'topologia';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["gruppo"] = {"nome":"Gruppo","riga":"Un insieme $G$ con un'operazione associativa, un elemento neutro $e$ e, per ogni elemento, un inverso: $\\forall a\\ \\exists a^{-1}:\\ aa^{-1}=a^{-1}a=e$.","serve":"È la struttura che le simmetrie hanno sempre, qualunque cosa trasformino: composte danno una simmetria, la trasformazione nulla è una simmetria, ogni simmetria si disfa. Per questo in fisica si studiano i gruppi e non le singole trasformazioni: le rotazioni, le traslazioni, il gruppo di Galilei, le permutazioni di particelle identiche, le fasi $e^{i\\theta}$. La commutatività non è negli assiomi, e infatti le rotazioni nello spazio non commutano: è la radice del fatto che le componenti del momento angolare non commutano.","esempio":"Le rotazioni del piano $R_\\theta$ formano un gruppo commutativo: ruotare di $\\alpha$ e poi di $\\beta$ è ruotare di $\\alpha+\\beta$, il neutro è $R_0=I$, l'inverso di $R_\\theta$ è $R_{-\\theta}$. Le rotazioni dello spazio no: un quarto di giro attorno a $z$ seguito da uno attorno a $x$ non è la stessa cosa dell'ordine inverso. Un insieme che fallisce: $(\\mathbb{N},+)$, dove $1$ non ha inverso.","pieno":{"file":"tp-11-gruppi-e-azioni.html","tappa":"01","come":"gli assiomi con i quantificatori e il perché sono quelli, l'unicità di neutro e inverso, esempi e non esempi, l'ordine di un elemento"},"controllo":[{"tipo":"uguale","sinistra":"simplify(Matrix([[cos(al),-sin(al)],[sin(al),cos(al)]])*Matrix([[cos(be),-sin(be)],[sin(be),cos(be)]]) - Matrix([[cos(al+be),-sin(al+be)],[sin(al+be),cos(al+be)]]))","vale":"zeros(2,2)","dove":"esempio","appare":"ruotare di $\\alpha$ e poi di $\\beta$ è ruotare di $\\alpha+\\beta$","nota":"R_alpha R_beta = R_(alpha+beta)"},{"tipo":"simbolico","dove":"riga","appare":"\\forall a\\ \\exists a^{-1}:\\ aa^{-1}=a^{-1}a=e","perche":"assioma dell'inverso: definizione, non un conto"}]};
STRUM["omomorfismo"] = {"nome":"Omomorfismo","riga":"Una mappa fra due gruppi che rispetta il prodotto, $\\varphi(ab)=\\varphi(a)\\varphi(b)$, e il cui nucleo $\\ker\\varphi=\\{a:\\varphi(a)=e\\}$ è un sottogruppo normale, banale esattamente quando $\\varphi$ è iniettiva.","serve":"È la traduzione fra due gruppi che non tradisce la composizione, ed è il modo in cui un gruppo astratto diventa qualcosa che agisce: una simmetria in meccanica quantistica è un omomorfismo (a meno di una fase) dal gruppo delle trasformazioni agli operatori sullo spazio degli stati. Il nucleo misura quanto la traduzione confonde: due elementi hanno la stessa immagine esattamente quando differiscono per un elemento del nucleo, e il quoziente per il nucleo è isomorfo all'immagine. Vale identico per gli anelli, dove il nucleo è un ideale.","esempio":"L'esponenziale manda somme in prodotti, $e^{a+b}=e^a e^b$, quindi è un omomorfismo da $(\\mathbb{R},+)$ a $(\\mathbb{R}_{\\gt 0},\\cdot)$, iniettivo. La mappa $t\\mapsto e^{2\\pi it}$ da $(\\mathbb{R},+)$ alle fasi ha nucleo $\\mathbb{Z}$: avvolge la retta sul cerchio, un giro per ogni unità. Il determinante, $\\det(AB)=\\det A\\det B$, ha per nucleo le matrici di determinante uno.","pieno":{"file":"tp-11-gruppi-e-azioni.html","tappa":"03","come":"la definizione con gli esempi di Lee, ciò che si conserva da solo, nucleo e immagine, iniettività e nucleo banale, l'isomorfismo nella forma di Landau"},"controllo":[{"tipo":"uguale","sinistra":"simplify(exp(a+b)-exp(a)*exp(b))","vale":"0","dove":"esempio","appare":"e^{a+b}=e^a e^b"},{"tipo":"uguale","sinistra":"exp(2*pi*I*k)","vale":"1","ipotesi":{"k":"integer"},"dove":"esempio","appare":"ha nucleo $\\mathbb{Z}$","nota":"e^(2 pi i k) = 1 per ogni intero k"}]};
STRUM["gruppo-delle-permutazioni"] = {"nome":"Gruppo delle permutazioni","riga":"$S_N$ è l'insieme delle biiezioni di $\\{1,\\dots,N\\}$ in sé, con la composizione; ha $N!$ elementi, è generato dagli scambi di due oggetti, e il segno $\\operatorname{sgn}:S_N\\to\\{\\pm1\\}$ è un omomorfismo.","serve":"È il gruppo che agisce su un sistema di $N$ particelle identiche rinominandole: un'hamiltoniana fisica dev'essere invariante per ogni permutazione, perché due situazioni che differiscono solo per lo scambio di particelle identiche sono indistinguibili. Il segno è il numero che separa i due comportamenti possibili sotto scambio, bosoni e fermioni; l'ordine $N!$ è il fattore di Gibbs nel conteggio degli stati di un gas.","esempio":"$S_3$ ha $6$ elementi, le sei isometrie di un triangolo equilatero: tre riflessioni, che sono gli scambi e hanno segno $-1$, e due rotazioni di $120^\\circ$ e $240^\\circ$, che sono i cicli $(1\\,2\\,3)$ e $(1\\,3\\,2)$ e hanno segno $+1$, più l'identità. È il più piccolo gruppo non commutativo: $(1\\,2)(2\\,3)=(1\\,2\\,3)$ ma $(2\\,3)(1\\,2)=(1\\,3\\,2)$.","pieno":{"file":"tp-11-gruppi-e-azioni.html","tappa":"07","come":"cicli e trasposizioni, il segno definito come prodotto e dimostrato omomorfismo, le classi di coniugio per tipo di ciclo, S_3 come simmetrie del triangolo"},"controllo":[{"tipo":"uguale","sinistra":"factorial(3)","vale":"6","dove":"esempio","appare":"$S_3$ ha $6$ elementi"}]};
STRUM["traccia"] = {"nome":"Traccia di un operatore","riga":"La traccia e' la somma degli elementi diagonali, $\\operatorname{tr}\\hat A=\\sum_i\\langle i|\\hat A|i\\rangle$, e non dipende dalla base ortonormale scelta perche' e' invariante per permutazione ciclica: $\\operatorname{tr}(\\hat A\\hat B)=\\operatorname{tr}(\\hat B\\hat A)$, da cui $\\operatorname{tr}(\\hat U^{\\dagger}\\hat A\\hat U)=\\operatorname{tr}\\hat A$.","serve":"E' il modo di estrarre un numero da un operatore senza privilegiare una rappresentazione. Il valor medio di un'osservabile su uno stato si scrive $\\langle A\\rangle=\\operatorname{tr}(\\rho\\hat A)$ con $\\rho=|\\psi\\rangle\\langle\\psi|$, e questa forma — a differenza di $\\langle\\psi|\\hat A|\\psi\\rangle$ — vale identica per gli stati misti, dove $\\rho$ non e' piu' un proiettore: e' la porta verso la matrice densita' e la decoerenza.","esempio":"Per $A=\\begin{pmatrix}1&2\\\\3&4\\end{pmatrix}$ e $B=\\begin{pmatrix}0&1\\\\1&0\\end{pmatrix}$, pur essendo $AB\\neq BA$, le due tracce coincidono: $AB=\\begin{pmatrix}2&1\\\\4&3\\end{pmatrix}$ da' $\\operatorname{tr}(AB)=2+3=5$, mentre $BA=\\begin{pmatrix}3&4\\\\1&2\\end{pmatrix}$ da' $\\operatorname{tr}(BA)=3+2=5$. La traccia di un proiettore di rango uno vale $1$, e in generale la traccia di un proiettore e' la dimensione del sottospazio su cui proietta.","debito":"la traccia di un operatore in dimensione infinita esiste solo per la classe degli operatori a traccia (totalmente continui), e la costruzione rigorosa — $\\operatorname{tr}(\\hat A^{\\dagger}\\hat A)=\\sum_\\mu\\|\\hat A\\phi_\\mu\\|^2$ indipendente dalla base, von Neumann cap. II.11 — qui si cita. Si lavora col caso in cui la somma converge.","controllo":[{"tipo":"uguale","sinistra":"(Matrix([[1,2],[3,4]])*Matrix([[0,1],[1,0]])).trace()","vale":"5","dove":"esempio","appare":"\\operatorname{tr}(AB)=2+3=5"},{"tipo":"uguale","sinistra":"(Matrix([[0,1],[1,0]])*Matrix([[1,2],[3,4]])).trace()","vale":"5","dove":"esempio","appare":"\\operatorname{tr}(BA)=3+2=5"},{"tipo":"uguale","sinistra":"Matrix([[1,2],[3,4]])*Matrix([[0,1],[1,0]])","vale":"Matrix([[2,1],[4,3]])","dove":"esempio","appare":"AB=\\begin{pmatrix}2&1\\\\4&3\\end{pmatrix}"},{"tipo":"uguale","sinistra":"Matrix([[0,1],[1,0]])*Matrix([[1,2],[3,4]])","vale":"Matrix([[3,4],[1,2]])","dove":"esempio","appare":"BA=\\begin{pmatrix}3&4\\\\1&2\\end{pmatrix}"}],"qui":{},"pieno":null};
STRUM["operatore-unitario"] = {"nome":"Operatore unitario","riga":"Un operatore $\\hat U$ e' unitario quando $\\hat U^{\\dagger}\\hat U=\\hat U\\hat U^{\\dagger}=\\mathbb 1$, cioe' $\\hat U^{\\dagger}=\\hat U^{-1}$, il che equivale a conservare il prodotto interno: $\\langle \\hat U\\phi|\\hat U\\psi\\rangle=\\langle\\phi|\\psi\\rangle$ per ogni coppia di stati.","serve":"Conservare il prodotto interno vuol dire conservare le probabilita': ogni trasformazione fisica che non cambia gli esiti di una misura — un cambio di base, una traslazione, una rotazione, l'evoluzione temporale — e' unitaria. I suoi autovalori hanno modulo uno, e due osservabili legate da un operatore unitario hanno lo stesso spettro.","esempio":"La rotazione del piano $\\hat U=\\begin{pmatrix}\\cos\\theta&-\\sin\\theta\\\\\\sin\\theta&\\cos\\theta\\end{pmatrix}$ e' unitaria — il prodotto $\\hat U^{\\dagger}\\hat U$ ha sulla diagonale $\\cos^2\\theta+\\sin^2\\theta=1$ e zero fuori — e ha autovalori $e^{\\pm i\\theta}$, di modulo $|e^{i\\theta}|=1$. La matrice $S$ del cambio di base ortonormale e' unitaria per lo stesso motivo: manda una base ortonormale in un'altra.","debito":"la trasformata di Cayley $\\hat U=(\\hat A-i)/(\\hat A+i)$, che lega operatori autoaggiunti e unitari e con cui von Neumann risolve il problema agli autovalori in dimensione infinita, si cita e non si costruisce.","controllo":[{"tipo":"uguale","sinistra":"Abs(exp(I*theta))","vale":"1","ipotesi":{"theta":"real"},"dove":"esempio","appare":"|e^{i\\theta}|=1"},{"tipo":"uguale","sinistra":"Matrix([[cos(th),-sin(th)],[sin(th),cos(th)]]).T*Matrix([[cos(th),-sin(th)],[sin(th),cos(th)]])","vale":"Matrix([[1,0],[0,1]])","ipotesi":{"th":"real"},"dove":"esempio","appare":"\\cos^2\\theta+\\sin^2\\theta=1"}],"qui":{},"pieno":null};
STRUM["rappresentazione"] = {"nome":"Rappresentazione","riga":"Un omomorfismo $D:G\\to GL(V)$ che assegna a ogni elemento di un gruppo una mappa lineare invertibile di uno spazio vettoriale, con $D(gh)=D(g)D(h)$.","serve":"È il modo in cui una simmetria agisce sugli stati quantistici: linearmente, perché il trasformato di una sovrapposizione è la sovrapposizione dei trasformati, e in modo unitario, perché le probabilità si conservano. Due rappresentazioni che differiscono per un cambio di base sono la stessa, e il carattere $\\chi(g)=\\operatorname{tr}D(g)$ lo riconosce senza cercare il cambio di base. Ogni rappresentazione unitaria di dimensione finita si spezza in pezzi irriducibili, ed è su quei pezzi che si leggono degenerazioni e regole di selezione.","esempio":"Le rotazioni attorno a un asse agiscono su una funzione d'onda $e^{in\\varphi}$ moltiplicandola per una fase: $D_n(R_\\theta)=e^{in\\theta}$ è una rappresentazione di dimensione uno, ben definita solo per $n$ intero, e $n$ è il numero quantico magnetico. Il gruppo delle permutazioni di tre oggetti agisce su $\\mathbb{C}^3$ scambiando i vettori di base: è una rappresentazione di dimensione tre che si spezza in una retta invariante, generata da $(1,1,1)$, e in un piano.","pieno":{"file":"tp-12-rappresentazioni-e-schur.html","tappa":"01","come":"la definizione di Lee e la costruzione di Landau dalle funzioni d'onda, con sei esempi dalla banale alla rappresentazione sulle funzioni"},"controllo":[{"tipo":"uguale","sinistra":"simplify(exp(I*n*al)*exp(I*n*be) - exp(I*n*(al+be)))","vale":"0","dove":"esempio","appare":"$D_n(R_\\theta)=e^{in\\theta}$ è una rappresentazione","nota":"e^(in alpha) e^(in beta) = e^(in(alpha+beta)): rispetta il prodotto"},{"tipo":"simbolico","dove":"riga","appare":"D(gh)=D(g)D(h)","perche":"definizione di omomorfismo, non un conto"}]};
STRUM["commutatore"] = {"nome":"Commutatore","riga":"$[\\hat A,\\hat B]=\\hat A\\hat B-\\hat B\\hat A$, antisimmetrico, con la regola di Leibniz $[\\hat A,\\hat B\\hat C]=[\\hat A,\\hat B]\\hat C+\\hat B[\\hat A,\\hat C]$ e la relazione canonica $[\\hat x,\\hat p]=i\\hbar$.","serve":"E' la misura di quanto due operazioni dipendano dall'ordine, e qui l'ordine e' fisica: due osservabili che non commutano non hanno una base comune di autostati, quindi non si misurano insieme con precisione arbitraria. Quasi ogni conto che sembra magico — l'algebra del momento angolare, gli operatori di salita e discesa, il teorema di Ehrenfest — e' una manipolazione di commutatori fatta con quelle regole e nient'altro.","esempio":"Dalla regola di Leibniz, $[\\hat x,\\hat p^{2}]=[\\hat x,\\hat p]\\hat p+\\hat p[\\hat x,\\hat p]=2i\\hbar\\hat p$. E' il conto che fa uscire il teorema di Ehrenfest: la meccanica classica ricompare come relazione fra valori medi, e ricompare perche' quel commutatore vale proprio $2i\\hbar\\hat p$.","debito":"l'identita' di Jacobi si enuncia e non si dimostra; la corrispondenza fra commutatore e parentesi di Poisson — che e' l'idea di Dirac e non un'analogia decorativa — sta in mq-07, e li' va letta per intero.","controllo":[{"tipo":"uguale","sinistra":"I*hbar*p + p*I*hbar","vale":"2*I*hbar*p","ipotesi":{"hbar":"positive","p":"real"},"dove":"esempio","appare":"2i\\hbar\\hat p"},{"tipo":"simbolico","dove":"riga","appare":"[\\hat x,\\hat p]=i\\hbar","perche":"e' la relazione di commutazione canonica, il POSTULATO da cui discende il resto della teoria: non si dimostra, si assume, ed e' cio' che separa la meccanica quantistica dalla classica"}],"qui":{},"pieno":null};
STRUM["rappresentazione-irriducibile"] = {"nome":"Rappresentazione irriducibile e lemma di Schur","riga":"Una rappresentazione è irriducibile se nessun sottospazio, salvo zero e lo spazio intero, è invariante sotto tutto il gruppo, e per il lemma di Schur ogni operatore che commuta con tutte le sue trasformazioni è un multiplo dell'identità.","serve":"È lo strumento con cui la simmetria fissa le cose senza risolvere equazioni. Un'hamiltoniana che commuta con un gruppo è un multiplo dell'identità su ogni pezzo irriducibile, quindi la degenerazione di un livello è la dimensione dell'irriducibile; un operatore simmetrico non ha elementi di matrice fra irriducibili diverse, e quelle sono le regole di selezione. Nella forma di Ballentine vale per insiemi di operatori: siccome posizione e impulso formano un insieme irriducibile, due operatori con gli stessi commutatori con $Q$ e $P$ differiscono per una costante, ed è così che si ricavano i generatori di Galilei.","esempio":"Un elettrone su tre siti identici ha un'hamiltoniana che commuta con le permutazioni dei siti; lo spazio $\\mathbb{C}^3$ si spezza nella retta di $(1,1,1)$ e nel piano $x+y+z=0$, entrambi irriducibili, e su ciascuno l'hamiltoniana è un multiplo dell'identità: un livello singolo e un livello doppio. Sui reali il lemma fallisce: la rotazione di un quarto di giro commuta con tutte le rotazioni del piano senza essere un multiplo dell'identità.","pieno":{"file":"tp-12-rappresentazioni-e-schur.html","tappa":"04","come":"le due forme del lemma dimostrate in dimensione finita, il controesempio reale delle rotazioni del piano, i gruppi commutativi"},"controllo":[{"tipo":"uguale","sinistra":"Matrix([[0,-t,-t],[-t,0,-t],[-t,-t,0]])*Matrix([[1],[1],[1]])","vale":"-2*t*Matrix([[1],[1],[1]])","dove":"esempio","appare":"un livello singolo e un livello doppio","nota":"autovalore -2t sulla retta di (1,1,1)"},{"tipo":"uguale","sinistra":"Matrix([[0,-t,-t],[-t,0,-t],[-t,-t,0]])*Matrix([[1],[-1],[0]])","vale":"t*Matrix([ function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

/* ---------------- 00 · DI COSA PARLA QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Di cosa parla questo movimento', meta:'il gruppo che agisce con mappe lineari · una sola domanda, che cosa resta invariato · il lemma che la fisica usa davvero',
  blocchi:[
  {t:'prosa', title:'Dal gruppo che muove punti al gruppo che muove vettori', tag:'architettura', html:R`
  <p>In meccanica quantistica un <span class="str" data-str="gruppo">gruppo</span> di simmetria non muove punti dello spazio: muove <b>vettori di stato</b>, e lo fa in modo lineare, perché una sovrapposizione di stati trasformati è il trasformato della sovrapposizione. Una mappa che assegna a ogni elemento del gruppo un operatore lineare invertibile, rispettando la composizione, si chiama <b>rappresentazione</b>, ed è un <span class="str" data-str="omomorfismo">omomorfismo</span> dal gruppo agli operatori. Landau apre il paragrafo sulle rappresentazioni proprio così: si prende una funzione d'onda, le si applicano tutte le trasformazioni del gruppo, e si osserva che le funzioni ottenute «si trasformano linearmente l'una nell'altra» (Landau-Lifsic, vol. 3, cap. XII, §94, stampata 435).</p>
  <p>Da lì tutto segue da una sola domanda: <b>che cosa resta invariato</b>. Un sottospazio che il gruppo non fa mai uscire da sé spezza la rappresentazione in pezzi più piccoli; una rappresentazione che non si spezza è <b>irriducibile</b>. Il lemma di Schur dice la cosa che la fisica usa in continuazione: un operatore che commuta con tutte le trasformazioni di una rappresentazione irriducibile è un multiplo dell'identità. È lo strumento con cui Ballentine obbliga l'hamiltoniana di una particella libera ad avere la forma che ha, invece di postularla, ed è il motivo per cui i livelli energetici di un sistema simmetrico sono degeneri con molteplicità fissate dal gruppo.</p>
  <p>L'ordine del movimento:</p>
  <ol>
  <li>la rappresentazione, con gli esempi che servono (tappa 01);</li>
  <li>quando due rappresentazioni sono la stessa, il carattere che lo decide, e perché si può sempre supporle unitarie (tappa 02);</li>
  <li>sottospazi invarianti, riducibili e irriducibili, e la scomposizione in pezzi irriducibili (tappa 03);</li>
  <li>il lemma di Schur in dimensione finita, dimostrato, e il caso reale in cui fallisce (tappa 04);</li>
  <li>il lemma di Schur nella forma di Ballentine per insiemi di operatori, con la dimostrazione che posizione e impulso formano un insieme irriducibile (tappa 05);</li>
  <li>i caratteri e la loro ortogonalità, dimostrata a partire da Schur, con la tavola di $S_3$ (tappa 06);</li>
  <li>la conseguenza fisica: degenerazioni e regole di selezione, su un sistema di tre siti (tappa 07).</li>
  </ol>
  <p>Che cosa resta fuori: le rappresentazioni dei gruppi continui di rotazione e i coefficienti di Clebsch-Gordan si costruiscono dove si costruisce il momento angolare; qui SO(2) e SO(3) compaiono come esempi della definizione. La completa riducibilità per i gruppi compatti infiniti richiede la media sul gruppo con la misura di Haar, che nessun libro in casa sviluppa: si enuncia, e si dimostra per i gruppi finiti, dove la media è una somma.</p>`}
]},

/* ---------------- 01 · RAPPRESENTAZIONE ---------------- */
{ num:'01', title:'La rappresentazione: un gruppo che agisce con mappe lineari', meta:'la definizione come omomorfismo · la costruzione di Landau dalle funzioni d’onda · cinque esempi · fedele e banale',
  blocchi:[
  {t:'prosa', title:'La definizione, e da dove viene in Landau', tag:'grammatica', html:R`
  <p>Sia $V$ uno spazio vettoriale complesso (o reale) e $GL(V)$ il gruppo delle mappe lineari invertibili di $V$ in sé. Una <b>rappresentazione</b> di un gruppo $G$ su $V$ è un omomorfismo</p>
  $$D:G\to GL(V),\qquad \forall g,h\in G:\ D(gh)=D(g)\,D(h).$$
  <p>La dimensione di $V$ si chiama <b>dimensione</b> della rappresentazione. È la definizione di Lee, che la dà per i gruppi di Lie e la limita alla dimensione finita (cap. 7, stampata 169), e che aggiunge il termine <b>fedele</b> per una rappresentazione iniettiva: un gruppo con una rappresentazione fedele è isomorfo a un gruppo di matrici. Dal fatto che $D$ è un omomorfismo seguono gratis $D(e)=I$ e $D(g^{-1})=D(g)^{-1}$.</p>
  <p>Landau ci arriva dal lato opposto, ed è il lato del fisico (§94, stampate 435-436). Si parte da una funzione d'onda $\psi_1$ e le si applicano tutte le trasformazioni del gruppo: si ottengono $g$ funzioni, alcune linearmente dipendenti, e se ne scelgono $f$ indipendenti $\psi_1,\dots,\psi_f$. Ogni trasformazione $G$ manda ciascuna di esse in una combinazione lineare delle altre, $G\psi_i=\sum_k G_{ki}\psi_k$, e i coefficienti $G_{ki}$ formano la «matrice di trasformazione». Le funzioni si chiamano <b>base</b> della rappresentazione e il loro numero $f$ è la dimensione. Il fatto che il prodotto di due trasformazioni sia rappresentato dal prodotto delle matrici non è un'ipotesi, è il modo in cui si compongono gli operatori: è l'omomorfismo di Lee, visto da dentro un problema di meccanica quantistica.</p>`},
  {t:'prosa', title:'Cinque esempi, dal più povero al più ricco', tag:'esempi', html:R`
  <ul>
  <li><b>La banale</b>: $D(g)=1$ su $V=\mathbb{C}$, per ogni $g$. Ogni gruppo ce l'ha, e Landau la chiama «rappresentazione unità»: è quella di una funzione invariante sotto tutto il gruppo (stampata 439).</li>
  <li><b>Il segno</b>: su $\mathbb{C}$, $D(\sigma)=\operatorname{sgn}\sigma$ per le <span class="str" data-str="gruppo-delle-permutazioni">permutazioni</span> di $S_N$. È una rappresentazione di dimensione uno perché il segno è un omomorfismo verso $\{\pm1\}\subset GL(1,\mathbb{C})$.</li>
  <li><b>Le fasi di SO(2)</b>: per ogni intero $n$, $D_n(R_\theta)=e^{in\theta}$ su $\mathbb{C}$. È un omomorfismo perché $$e^{in\alpha}\,e^{in\beta}=e^{in(\alpha+\beta)},$$ ed è ben definita solo per $n$ intero, perché $\theta$ e $\theta+2\pi$ sono la stessa rotazione. È così che si trasforma una funzione d'onda $e^{in\varphi}$ ruotando il sistema attorno a un asse, e l'intero $n$ è il numero quantico magnetico.</li>
  <li><b>Le rotazioni stesse</b>: $SO(3)$ su $\mathbb{R}^3$ con la matrice di rotazione, o $SO(2)$ su $\mathbb{R}^2$. Si chiama rappresentazione <b>definente</b>: il gruppo è dato come gruppo di matrici, e la rappresentazione è l'identità.</li>
  <li><b>Le permutazioni su $\mathbb{C}^3$</b>: ogni $\sigma\in S_3$ agisce sulla base permutandone i vettori, $P_\sigma e_i=e_{\sigma(i)}$. Le matrici $P_\sigma$ hanno un solo $1$ per riga e per colonna, e rispettano il prodotto di $S_3$; per esempio, con la convenzione della composizione da destra, $$P_{(1\,2)}P_{(2\,3)}=P_{(1\,2\,3)}.$$ È la rappresentazione su cui si lavora in tutto il movimento, perché è la più piccola che non sia irriducibile.</li>
  </ul>
  <p>Un sesto esempio non ha dimensione finita ed è quello che conta in fisica: $G$ agisce sulle funzioni d'onda con $(D(g)\psi)(x)=\psi(g^{-1}x)$. È una rappresentazione sullo spazio di Hilbert di tutte le funzioni, e i pezzi di dimensione finita di Landau — le $f$ funzioni che si trasformano fra loro — sono i suoi sottospazi invarianti.</p>`}
]},

/* ---------------- 02 · EQUIVALENZA, CARATTERE, UNITARIETA ---------------- */
{ num:'02', title:'Quando due rappresentazioni sono la stessa, e perché si possono supporre unitarie', meta:'equivalenza come cambio di base · il carattere che non vede il cambio di base · la media sul gruppo che costruisce un prodotto scalare invariante',
  blocchi:[
  {t:'prosa', title:'Equivalenza e carattere', tag:'grammatica', html:R`
  <p>Due rappresentazioni $D$ e $D'$ di $G$ sulla stessa dimensione si dicono <b>equivalenti</b> se differiscono per un cambio di base:</p>
  $$D\sim D'\iff\exists S\ \text{invertibile}\ \ \forall g\in G:\ D'(g)=S\,D(g)\,S^{-1}.$$
  <p>Sono la stessa rappresentazione scritta in coordinate diverse; Landau lo dice così, che «non sono, evidentemente, sostanzialmente differenti», e da quel punto in poi chiama «diverse» solo le non equivalenti (stampata 437).</p>
  <p>Per riconoscere l'equivalenza senza cercare $S$ si usa la traccia. Il <b>carattere</b> di una rappresentazione è la funzione $\chi(g)=\operatorname{tr}D(g)$, la <span class="str" data-str="traccia">traccia</span> della sua matrice, e non cambia per cambio di base, perché la traccia di un prodotto non dipende dall'ordine ciclico dei fattori, $\operatorname{tr}(XY)=\operatorname{tr}(YX)$:</p>
  $$\operatorname{tr}(SAS^{-1})=\operatorname{tr}A.$$
  <p>Due conseguenze immediate, entrambe in Landau (stampata 437). Il carattere è costante sulle classi di coniugio, perché $\chi(hgh^{-1})=\operatorname{tr}(D(h)D(g)D(h)^{-1})=\chi(g)$: dipende dalla classe, non dall'elemento. E il carattere del neutro è la dimensione, perché $D(e)=I$. La tappa 06 mostra che per le rappresentazioni irriducibili il carattere decide l'equivalenza anche nell'altro verso: caratteri uguali, rappresentazioni equivalenti.</p>`},
  {t:'prosa', title:'Unitarie: l’argomento di Landau e la media di Weyl', tag:'costruzione', html:R`
  <p>In meccanica quantistica le simmetrie conservano le probabilità, quindi sono rappresentate da <span class="str" data-str="operatore-unitario">operatori unitari</span>. Landau lo ricava osservando che gli integrali $\int\psi_i^*\psi_k\,dq$ estesi a tutto lo spazio non cambiano ruotando o riflettendo le coordinate, e quindi una base ortonormale resta ortonormale: gli operatori del gruppo sono unitari, e in base ortonormale lo sono le loro matrici (stampata 436).</p>
  <p>C'è un fatto più forte, che vale anche quando il prodotto scalare non è dato dalla fisica: <b>ogni rappresentazione di un gruppo finito è equivalente a una unitaria</b>. Dato un prodotto scalare qualunque $\langle\cdot,\cdot\rangle$ su $V$, se ne costruisce uno nuovo facendone la media sul gruppo:</p>
  $$\langle u,v\rangle_G=\frac1{|G|}\sum_{g\in G}\langle D(g)u,\,D(g)v\rangle.$$
  <p>È ancora un prodotto scalare (somma di prodotti scalari, positiva su $u\ne0$), ed è invariante: $\langle D(h)u,D(h)v\rangle_G=\frac1{|G|}\sum_g\langle D(gh)u,D(gh)v\rangle=\langle u,v\rangle_G$, perché quando $g$ percorre il gruppo anche $gh$ lo percorre una volta sola. In una base ortonormale per $\langle\cdot,\cdot\rangle_G$ le matrici $D(g)$ sono unitarie. Per i gruppi compatti infiniti — $SO(3)$, $SU(2)$ — la somma diventa un integrale sul gruppo con una misura invariante, la misura di Haar, e il risultato resta vero; la costruzione di quella misura non è in nessun libro in casa, e qui si enuncia soltanto.</p>
  <p>Un esempio piccolo mostra che la media serve davvero. Il gruppo $\{e,s\}$ con $s^2=e$ agisce su $\mathbb{R}^2$ con</p>
  $$D(s)=\begin{pmatrix}1&1\\0&-1\end{pmatrix},\qquad D(s)^2=I,$$
  <p>quindi è una rappresentazione; ma non è ortogonale nel prodotto scalare usuale, perché</p>
  $$D(s)^TD(s)=\begin{pmatrix}1&1\\1&2\end{pmatrix}\ne I.$$
  <p>La media dà il prodotto scalare $\langle u,v\rangle_G=u^TMv$ con $M=\tfrac12\big(I+D(s)^TD(s)\big)=\begin{pmatrix}1&\tfrac12\\\tfrac12&\tfrac32\end{pmatrix}$, e in questo prodotto $D(s)$ è un'isometria:</p>
  $$D(s)^TMD(s)=M.$$`}
]},

/* ---------------- 03 · INVARIANTI E RIDUCIBILITA ---------------- */
{ num:'03', title:'Sottospazi invarianti: riducibile, irriducibile, completamente riducibile', meta:'il sottospazio che il gruppo non fa uscire · il complemento ortogonale invariante · la scomposizione in irriducibili · il controesempio non compatto',
  blocchi:[
  {t:'prosa', title:'Le definizioni', tag:'grammatica', html:R`
  <p>Un sottospazio $W\subseteq V$ è <b>invariante</b> per la <span class="str" data-str="rappresentazione">rappresentazione</span> $D$ se</p>
  $$\forall g\in G\ \ \forall w\in W:\ D(g)w\in W.$$
  <p>$\{0\}$ e $V$ lo sono sempre. La rappresentazione si dice <b>irriducibile</b> se non ha altri sottospazi invarianti, <b>riducibile</b> altrimenti. Landau la dice nel linguaggio delle funzioni di base: una rappresentazione è riducibile se con una trasformazione lineare le funzioni si separano in gruppi che «sotto l'azione di tutti gli elementi del gruppo» si trasformano «esclusivamente tra loro», e irriducibile se il numero di funzioni che si mescolano non si può diminuire (stampate 437-438). In una base adattata a $W$ le matrici di una rappresentazione riducibile hanno la forma a blocchi</p>
  $$D(g)=\begin{pmatrix}A(g)&B(g)\\0&C(g)\end{pmatrix},$$
  <p>dove $A$ è la rappresentazione ristretta a $W$. Se si riesce a scegliere la base in modo che anche $B(g)=0$ per ogni $g$, la rappresentazione si spezza nella <b>somma diretta</b> di due rappresentazioni più piccole, $D=A\oplus C$.</p>`},
  {t:'reveal', title:'Le rappresentazioni unitarie si spezzano sempre', tag:'teorema', steps:[
   {label:'Il complemento ortogonale di un invariante è invariante', body:R`<p>Se $D$ è unitaria e $W$ è invariante, allora $W^\perp$ è invariante. Sia $v\in W^\perp$: per ogni $w\in W$, $\langle w,D(g)v\rangle=\langle D(g)^\dagger w,v\rangle=\langle D(g^{-1})w,v\rangle=0$, perché $D(g^{-1})w\in W$. Quindi $D(g)v\in W^\perp$. La riga usa due cose: l'unitarietà, $D(g)^\dagger=D(g)^{-1}$, e il fatto che $D(g)^{-1}=D(g^{-1})$ sta ancora nella rappresentazione.</p>`},
   {label:'Completa riducibilità', body:R`<p>In dimensione finita, una rappresentazione unitaria è somma diretta di rappresentazioni irriducibili. Per induzione sulla dimensione: se $V$ è irriducibile si è finito; se no c'è un invariante proprio $W$, e $V=W\oplus W^\perp$ con entrambi invarianti e di dimensione minore. Combinato con la media di Weyl della tappa 02, vale per <b>ogni</b> rappresentazione di dimensione finita di un gruppo finito, ed è la frase di Landau «ogni rappresentazione riducibile può essere decomposta in rappresentazioni irriducibili» (stampata 438). La stessa irriducibile può comparire più volte: il numero di volte si chiama <b>molteplicità</b>.</p>`}
  ]},
  {t:'plot', title:'Un invariante senza complemento invariante: il taglio',
   intro:R`Il gruppo $(\mathbb{R},+)$ agisce su $\mathbb{R}^2$ con le matrici di taglio $D(t)=\begin{pmatrix}1&t\\0&1\end{pmatrix}$, cioè $(x,y)\mapsto(x+ty,\,y)$. La retta orizzontale è invariante; nessun'altra retta lo è.`,
   plots:[
    {kind:'curve', x:'t', y:'0', tr:[-2.2,2.2], height:290, equal:true,
     xr:[-2.4,2.6], yr:[-0.6,1.7],
     title:'la retta y = 0 (invariante) e il vettore (0,1) tagliato per t = 0.5, 1, 1.5',
     segs:[{x1:0,y1:0,x2:0,y2:1,col:'#5eead4',arrow:true,label:'(0,1)',lx:-0.25,ly:1.1},
           {x1:0,y1:0,x2:0.5,y2:1,col:'#8ee0c8',arrow:true},
           {x1:0,y1:0,x2:1,y2:1,col:'#d8a13a',arrow:true,label:'t = 1',lx:1.1,ly:1.15},
           {x1:0,y1:0,x2:1.5,y2:1,col:'#c084fc',arrow:true,label:'t = 1.5',lx:1.75,ly:1.15},
           {x1:-2.2,y1:1,x2:2.2,y2:1,col:'#8ea0b8',dash:true,label:'y = 1: ogni vettore resta alla sua altezza',lx:-0.9,ly:1.45}],
     marks:[{x:1.6,y:0,col:'#5eead4',label:'y = 0: i vettori qui non si muovono'}]}
   ],
   leggi:R`<p>Il conto che la figura disegna: due tagli si compongono sommando i parametri, $$\begin{pmatrix}1&s\\0&1\end{pmatrix}\begin{pmatrix}1&t\\0&1\end{pmatrix}=\begin{pmatrix}1&s+t\\0&1\end{pmatrix},$$ quindi $t\mapsto D(t)$ è una rappresentazione di $(\mathbb{R},+)$. La retta $y=0$ è invariante: i suoi vettori non si muovono affatto. Un'altra retta per l'origine, con un vettore $(a,b)$ e $b\ne0$, viene inclinata sempre di più al crescere di $t$, quindi non è invariante: la rappresentazione è riducibile ma <b>non</b> si spezza in somma diretta. La lezione è dove sta il guasto: il gruppo $(\mathbb{R},+)$ non è compatto, la media di Weyl non si può fare (la somma su infiniti elementi non converge), e nessun prodotto scalare rende unitari i tagli — una mappa unitaria conserva le lunghezze, e il taglio allunga $(0,1)$ senza limite. Generale: una rappresentazione non unitaria può avere invarianti senza complemento. Accidentale: la dimensione due.</p>`}

/* ---------------- 04 · SCHUR IN DIMENSIONE FINITA ---------------- */
{ num:'04', title:'Il lemma di Schur in dimensione finita', meta:'chi commuta con un irriducibile è un multiplo dell’identità · le mappe fra due irriducibili · perché sui reali fallisce · i gruppi commutativi hanno solo rappresentazioni di dimensione uno',
  blocchi:[
  {t:'reveal', title:'Il lemma, nelle sue due forme', tag:'teorema', steps:[
   {label:'Prima forma: il commutante', body:R`<p><b>Lemma di Schur (I).</b> Sia $D$ una rappresentazione irriducibile di $G$ su uno spazio <b>complesso</b> $V$ di dimensione finita, e sia $T:V\to V$ lineare con</p>
   $$\forall g\in G:\ T\,D(g)=D(g)\,T.$$
   <p>Allora $T=\lambda I$ per un $\lambda\in\mathbb{C}$.</p>
   <p><b>Dimostrazione.</b> Su $\mathbb{C}$ il polinomio caratteristico di $T$ ha una radice, quindi $T$ ha un autovalore $\lambda$, e l'autospazio $W=\ker(T-\lambda I)$ non è $\{0\}$. $W$ è invariante: se $Tw=\lambda w$, allora $T\,D(g)w=D(g)\,Tw=\lambda\,D(g)w$, cioè $D(g)w\in W$. Per l'irriducibilità $W=V$, cioè $T=\lambda I$. $\blacksquare$</p>
   <p>L'ingrediente è uno solo, e conviene vederlo nudo: <b>gli autospazi di un operatore che commuta con il gruppo sono invarianti</b>. È la stessa frase che in fisica produce le degenerazioni (tappa 07).</p>`},
   {label:'Seconda forma: le mappe fra due irriducibili', body:R`<p><b>Lemma di Schur (II).</b> Siano $D_1$ su $V_1$ e $D_2$ su $V_2$ irriducibili, e $T:V_1\to V_2$ lineare con $T\,D_1(g)=D_2(g)\,T$ per ogni $g$ (una mappa <b>che intreccia</b> le due rappresentazioni). Allora o $T=0$, o $T$ è un isomorfismo, e in tal caso $D_1$ e $D_2$ sono equivalenti.</p>
   <p><b>Dimostrazione.</b> $\ker T$ è invariante in $V_1$: se $Tv=0$ allora $T\,D_1(g)v=D_2(g)\,Tv=0$. L'immagine di $T$ è invariante in $V_2$: $D_2(g)\,Tv=T\,D_1(g)v$. Per l'irriducibilità il nucleo è $\{0\}$ o $V_1$, l'immagine è $\{0\}$ o $V_2$. Se $T\ne0$ il nucleo non è tutto $V_1$, quindi è $\{0\}$, e l'immagine non è $\{0\}$, quindi è $V_2$: $T$ è biiettiva. $\blacksquare$ Questa forma non ha bisogno dei complessi: usa solo nucleo e immagine.</p>`}
  ]},
  {t:'prosa', title:'Perché sui reali fallisce: le rotazioni del piano', tag:'esempi', html:R`
  <p>$SO(2)$ agisce su $\mathbb{R}^2$ con le matrici $R_\theta$, e questa rappresentazione reale è irriducibile: una retta per l'origine che fosse invariante sarebbe lasciata ferma da tutte le rotazioni, e la rotazione di $90^\circ$ non lascia ferma nessuna retta. Eppure la rotazione di un quarto di giro $J=\begin{pmatrix}0&-1\\1&0\end{pmatrix}$ commuta con ogni rotazione,</p>
  $$JR_\theta=R_\theta J,$$
  <p>e non è un multiplo dell'identità; anzi $J^2=-I$, cioè $J$ si comporta come l'unità immaginaria. La prima forma del lemma cade perché $J$ non ha autovalori reali, e la dimostrazione partiva proprio da un autovalore. Passando ai complessi il fenomeno si spiega: su $\mathbb{C}^2$ le rotazioni hanno gli autovettori comuni $(1,\mp i)$, per esempio</p>
  $$R_\theta\begin{pmatrix}1\\-i\end{pmatrix}=e^{i\theta}\begin{pmatrix}1\\-i\end{pmatrix},$$
  <p>quindi la rappresentazione complessa si spezza nelle due fasi $e^{i\theta}$ ed $e^{-i\theta}$ della tappa 01, con $n=\pm1$. Ciò che sui reali è irriducibile, sui complessi non lo è più. È uno dei motivi per cui la meccanica quantistica si fa su spazi complessi: lì Schur vale senza eccezioni.</p>`},
  {t:'plot', title:'Le rotazioni del piano e il quarto di giro che commuta con tutte',
   intro:R`Un vettore $v$, la sua immagine con una rotazione $R_\theta$, e le immagini con $J$: ruotare e poi applicare $J$ dà lo stesso vettore che applicare $J$ e poi ruotare.`,
   plots:[
    {kind:'curve', x:'cos(t)', y:'sin(t)', tr:[0,6.2832], height:300, equal:true,
     xr:[-1.6,1.7], yr:[-1.3,1.5],
     title:'v, R v, J v, e R J v = J R v',
     segs:[{x1:0,y1:0,x2:1,y2:0.0,col:'#5eead4',arrow:true,label:'v',lx:1.12,ly:-0.1},
           {x1:0,y1:0,x2:0.819,y2:0.574,col:'#d8a13a',arrow:true,label:'R v',lx:0.98,ly:0.68},
           {x1:0,y1:0,x2:0,y2:1,col:'#8ee0c8',arrow:true,label:'J v',lx:0.15,ly:1.12},
           {x1:0,y1:0,x2:-0.574,y2:0.819,col:'#c084fc',arrow:true,label:'J R v = R J v',lx:-0.9,ly:1.0}],
     marks:[]}
   ],
   leggi:R`<p>Le quattro frecce stanno sul cerchio unitario. $R$ ruota di $35^\circ$, $J$ di $90^\circ$: comporre le due rotazioni in un ordine o nell'altro ruota sempre di $125^\circ$, ed è il disegno di $JR_\theta=R_\theta J$. Ciò che la figura mostra e il conto da solo no è <b>perché</b> $J$ non può essere un multiplo dell'identità: un multiplo dell'identità lascia ogni vettore sulla sua retta, mentre $J$ porta $v$ su una retta perpendicolare. Generale: in un gruppo commutativo ogni elemento commuta con tutti, quindi sta nel commutante. Accidentale: l'angolo di $35^\circ$.</p>`},
  {t:'prosa', title:'Conseguenza: i gruppi commutativi', tag:'teorema', html:R`
  <p>Se $G$ è commutativo e $D$ è una sua rappresentazione complessa irriducibile di dimensione finita, allora $D$ ha <b>dimensione uno</b>. Ogni $D(h)$ commuta con tutti i $D(g)$, perché $D(h)D(g)=D(hg)=D(gh)=D(g)D(h)$; per Schur $D(h)=\lambda(h)I$; ma allora <b>ogni</b> sottospazio è invariante, e un'irriducibile con ogni sottospazio invariante ha dimensione uno. Landau lo enuncia come conseguenza della relazione fra dimensioni e ordine del gruppo (stampata 441). Per $SO(2)$ le irriducibili complesse sono quindi esattamente le fasi $e^{in\theta}$, $n\in\mathbb{Z}$, e una funzione d'onda sul cerchio si scompone nelle sue componenti di Fourier: la serie di Fourier è la scomposizione in irriducibili della rappresentazione di $SO(2)$ sulle funzioni.</p>`}
]},

/* ---------------- 05 · SCHUR DI BALLENTINE ---------------- */
{ num:'05', title:'Il lemma di Schur nella forma di Ballentine: insiemi di operatori', meta:'insieme autoaggiunto e irriducibile · la dimostrazione con gli autospazi · il verso inverso · posizione e impulso sono irriducibili · come lo usa la meccanica quantistica',
  blocchi:[
  {t:'reveal', title:'L’enunciato e la dimostrazione dell’appendice A', tag:'teorema', steps:[
   {label:'Insiemi invece di gruppi', body:R`<p>In meccanica quantistica spesso non si ha un gruppo ma un <b>insieme di operatori</b>: posizione e impulso, i generatori di una simmetria. Ballentine formula il lemma per questi (Appendice A, stampata 613). Un insieme $S$ di operatori è <b>autoaggiunto</b> se con ogni $T$ contiene anche $T^\dagger$; è <b>irriducibile</b> se nessun sottospazio, salvo $\{0\}$ e lo spazio intero, è invariante sotto tutti i suoi operatori.</p>
   <p><b>Lemma di Schur (Ballentine).</b> Un insieme autoaggiunto $S$ è irriducibile <b>se e solo se</b> ogni operatore che <span class="str" data-str="commutatore">commuta</span> con tutti gli elementi di $S$ è un multiplo dell'identità.</p>`},
   {label:'Irriducibile implica commutante banale', body:R`<p>Sia $R$ con $[T,R]=0$ per ogni $T\in S$. Poiché $S$ è autoaggiunto, anche $R^\dagger$ commuta con tutto $S$ (basta prendere l'aggiunto di $[T^\dagger,R]=0$), quindi si può scrivere $R=R_1+iR_2$ con $R_1=\tfrac12(R+R^\dagger)$ e $R_2=\tfrac1{2i}(R-R^\dagger)$ hermitiani e nel commutante: basta dimostrare la tesi per $R$ hermitiano. Siano $|\phi_n\rangle$ autovettori di $R$, $R|\phi_n\rangle=r_n|\phi_n\rangle$, e $V_m$ l'autospazio di autovalore $r_m$. Da $[T,R]=0$:</p>
   $$0=\langle\phi_m|(TR-RT)|\phi_n\rangle=(r_n-r_m)\,\langle\phi_m|T|\phi_n\rangle.$$
   <p>Se $r_n\ne r_m$, $T|\phi_n\rangle$ è ortogonale a $|\phi_m\rangle$, per ogni $T$: quindi il complemento ortogonale $V_m^\perp$ sarebbe invariante sotto tutto $S$, il che è escluso dall'irriducibilità. Dunque $R$ ha un solo autovalore, ed è un multiplo dell'identità. È la stessa idea della tappa 04 — un autospazio di qualcosa che commuta è invariante — scritta con gli elementi di matrice, che è la lingua di Ballentine.</p>`},
   {label:'Il verso inverso', body:R`<p>Se $S$ lasciasse invariante un sottospazio proprio $V_1$, sarebbe invariante anche $V_1^\perp$ (l'argomento della tappa 03, che qui usa l'autoaggiunzione di $S$ al posto dell'unitarietà). Si definisca $R$ uguale a $r_1$ su $V_1$ e a $r_2\ne r_1$ su $V_1^\perp$: commuta con ogni $T\in S$, perché $T$ non mescola i due pezzi, e non è un multiplo dell'identità (Ballentine, stampata 614). $\blacksquare$</p>`}
  ]},
  {t:'prosa', title:'Posizione e impulso formano un insieme irriducibile', tag:'costruzione', html:R`
  <p>Il caso che la meccanica quantistica usa è l'insieme $\{Q,P\}$ di una particella senza gradi di libertà interni. Ballentine lo dimostra nell'Appendice B (stampata 615) in rappresentazione delle coordinate, dove $Q$ moltiplica per $x$ e $P=-i\hbar\,\partial_x$, e mostra direttamente che ogni operatore che commuta con entrambi è un multiplo dell'identità; per il lemma, l'insieme è irriducibile.</p>
  <p>Il conto ha due passi. Se $M$ commuta con la moltiplicazione per $x$, commuta con la moltiplicazione per ogni funzione di $x$; applicando $M$ alla funzione costante $1$ si ottiene una funzione $m(x)=M1$, e allora $M(f)=M(f\cdot1)=f\,M1=f\,m$: <b>$M$ è la moltiplicazione per $m(x)$</b>. Se inoltre $M$ commuta con $\partial_x$, deve valere $\partial_x(m\psi)=m\,\partial_x\psi$ per ogni $\psi$, mentre la regola del prodotto dà</p>
  $$\partial_x\big(m\psi\big)-m\,\partial_x\psi=m'\psi.$$
  <p>Quindi $m'\psi=0$ per ogni $\psi$, cioè $m'=0$: $m$ è costante e $M=mI$.</p>
  <p>Come lo usa la fisica, nella forma che conviene ricordare: <b>se due operatori hanno gli stessi commutatori con tutti gli elementi di un insieme irriducibile, differiscono per un multiplo dell'identità</b>. Infatti la loro differenza commuta con tutto l'insieme. È lo schema con cui Ballentine ricava la forma dei generatori di Galilei: si trova un operatore costruito con $Q$ e $P$ che ha gli stessi commutatori del generatore cercato, e Schur dice che il generatore è quello, più una costante. Il lemma toglie la libertà: non c'è un'altra hamiltoniana, un altro momento angolare, un'altra velocità compatibili con le simmetrie, se non a meno di costanti. Se la particella ha gradi di libertà interni, come lo spin, $\{Q,P\}$ non è più irriducibile, perché un operatore che agisce solo sullo spin commuta con entrambi, e la conclusione non vale più nella stessa forma.</p>`}
]},

/* ---------------- 06 · CARATTERI E ORTOGONALITA ---------------- */
{ num:'06', title:'Caratteri e ortogonalità: le relazioni che Landau enuncia, dimostrate', meta:'la media che produce una mappa che intreccia · le relazioni di ortogonalità · la tavola dei caratteri di S3 · scomporre una rappresentazione contando',
  blocchi:[
  {t:'reveal', title:'L’ortogonalità degli elementi di matrice, da Schur', tag:'teorema', steps:[
   {label:'Che cosa enuncia Landau, e che cosa non dimostra', body:R`<p>Per un gruppo finito di ordine $g$ e due rappresentazioni irriducibili unitarie $D^{(\alpha)}$, $D^{(\beta)}$ di dimensioni $f_\alpha$, $f_\beta$, Landau scrive le relazioni di ortogonalità (94,7)-(94,9) e per la dimostrazione rimanda a «ogni corso speciale di teoria dei gruppi» (stampata 438). La dimostrazione è corta, e usa esattamente i due lemmi della tappa 04 più la media della tappa 02.</p>`},
   {label:'La media produce una mappa che intreccia', body:R`<p>Si prenda una matrice qualunque $X$ di dimensione $f_\alpha\times f_\beta$ e si faccia la media $$T=\sum_{g\in G}D^{(\alpha)}(g)\,X\,D^{(\beta)}(g^{-1}).$$ Per ogni $h$, rinominando $g'=hg$: $$D^{(\alpha)}(h)\,T=\sum_g D^{(\alpha)}(hg)\,X\,D^{(\beta)}(g^{-1})=\sum_{g'}D^{(\alpha)}(g')\,X\,D^{(\beta)}(g'^{-1}h)=T\,D^{(\beta)}(h).$$ Quindi $T$ intreccia le due rappresentazioni.</p>`},
   {label:'Schur conclude', body:R`<p>Se $\alpha\ne\beta$ (non equivalenti), la forma II dà $T=0$. Se $\alpha=\beta$, la forma I dà $T=\lambda I$, e la traccia fissa $\lambda$: $\operatorname{tr}T=\sum_g\operatorname{tr}X=g\operatorname{tr}X$, quindi $\lambda=g\operatorname{tr}X/f_\alpha$. Scegliendo per $X$ la matrice con un solo $1$ in posizione $(j,l)$ e usando l'unitarietà, $D(g^{-1})_{lk}=D(g)_{kl}^*$, si legge l'elemento $(i,k)$: $$\sum_{g\in G}D^{(\alpha)}_{ij}(g)\,D^{(\beta)}_{kl}(g)^*=\frac{g}{f_\alpha}\,\delta_{\alpha\beta}\,\delta_{ik}\,\delta_{jl}.$$ È la (94,9) di Landau. Ponendo $i=j$, $k=l$ e sommando su $i$ e $k$ si ottiene l'ortogonalità dei caratteri, la (94,10): $$\sum_{g\in G}\chi^{(\alpha)}(g)\,\chi^{(\beta)}(g)^*=g\,\delta_{\alpha\beta}.$$</p>`}
  ]},
  {t:'prosa', title:'La tavola dei caratteri di S3', tag:'esempi', html:R`
  <p>$S_3$ ha tre classi di coniugio, con $1$, $3$ e $2$ elementi: l'identità, le tre trasposizioni, i due cicli di lunghezza tre. Le irriducibili sono tre: la banale, il segno, e una di dimensione due, la <b>standard</b>, che è $S_3$ come gruppo delle simmetrie del triangolo agente sul piano. I caratteri, classe per classe:</p>
  <table style="margin:0.6em auto;border-collapse:collapse">
  <tr><th style="padding:0 1em"></th><th style="padding:0 1em">$e$ (1)</th><th style="padding:0 1em">$(1\,2)$ (3)</th><th style="padding:0 1em">$(1\,2\,3)$ (2)</th></tr>
  <tr><td style="padding:0 1em">banale</td><td style="text-align:center">$1$</td><td style="text-align:center">$1$</td><td style="text-align:center">$1$</td></tr>
  <tr><td style="padding:0 1em">segno</td><td style="text-align:center">$1$</td><td style="text-align:center">$-1$</td><td style="text-align:center">$1$</td></tr>
  <tr><td style="padding:0 1em">standard</td><td style="text-align:center">$2$</td><td style="text-align:center">$0$</td><td style="text-align:center">$-1$</td></tr>
  </table>
  <p>La riga della standard si legge sul triangolo: l'identità ha traccia $2$; una riflessione ha autovalori $1$ e $-1$, traccia $0$; una rotazione di $120^\circ$ ha traccia $2\cos120^\circ=-1$. L'ortogonalità si controlla sommando sulle classi con il peso del numero di elementi. Banale contro segno, banale contro standard, segno contro standard:</p>
  $$1\cdot1\cdot1+3\cdot1\cdot(-1)+2\cdot1\cdot1=0,$$
  $$1\cdot1\cdot2+3\cdot1\cdot0+2\cdot1\cdot(-1)=0,$$
  $$1\cdot1\cdot2+3\cdot(-1)\cdot0+2\cdot1\cdot(-1)=0,$$
  <p>e la norma della standard è l'ordine del gruppo, come dev'essere per un'irriducibile:</p>
  $$1\cdot2^2+3\cdot0^2+2\cdot(-1)^2=6.$$
  <p>Landau aggiunge due fatti che qui si enunciano con la sua fonte e senza dimostrazione: il numero di irriducibili è uguale al numero di classi (stampata 438), e la somma dei quadrati delle dimensioni è l'ordine del gruppo (stampata 441). Per $S_3$ sono tre e tre, e $$1^2+1^2+2^2=6.$$</p>`},
  {t:'prosa', title:'Scomporre contando: la rappresentazione di permutazione', tag:'costruzione', html:R`
  <p>L'ortogonalità dà la ricetta per scomporre una rappresentazione qualunque senza cercare i sottospazi. Se $D=\bigoplus_\alpha m_\alpha D^{(\alpha)}$, il carattere è $\chi=\sum_\alpha m_\alpha\chi^{(\alpha)}$, e proiettando sui caratteri irriducibili $$m_\alpha=\frac1g\sum_{g}\chi(g)\,\chi^{(\alpha)}(g)^*.$$ Per le permutazioni di $\mathbb{C}^3$ della tappa 01 il carattere è il numero di vettori di base fissati: $3$ sull'identità, $1$ su una trasposizione, $0$ su un ciclo di tre. Quindi:</p>
  $$m_{\text{banale}}=\tfrac16(3+3+0)=1,\qquad m_{\text{segno}}=\tfrac16(3-3+0)=0,\qquad m_{\text{std}}=\tfrac16(6+0+0)=1.$$
  <p>La rappresentazione di dimensione tre è la banale più la standard. La banale vive sulla retta generata da $(1,1,1)$, l'unico vettore che ogni permutazione lascia fermo; la standard vive sul piano ortogonale $x+y+z=0$. Il criterio di irriducibilità di Landau lo conferma: la norma del carattere non è $6$ ma</p>
  $$1\cdot3^2+3\cdot1^2+2\cdot0^2=12,$$
  <p>cioè $2g$. Qui va precisata una frase di Landau: per una rappresentazione riducibile la somma dei quadrati dei caratteri è $g\sum_\alpha m_\alpha^2$, e Landau la scrive «uguale a $ng$, dove $n$ è il numero di rappresentazioni irriducibili contenute» (stampata 439). Le due formule coincidono solo se nessuna irriducibile compare due volte; contando $n$ con le molteplicità la formula di Landau sarebbe sbagliata, quindi va letta come $\sum m_\alpha^2$. Qui le due irriducibili sono diverse e compaiono una volta, e $12=2\cdot6$ in entrambe le letture.</p>`},
  {t:'plot', title:'La standard dentro la permutazione: il triangolo nel piano x + y + z = 0',
   intro:R`I tre vettori di base $e_1,e_2,e_3$ proiettati sul piano $x+y+z=0$: le loro proiezioni formano tre frecce a $120^\circ$, e le permutazioni le scambiano come le simmetrie di un triangolo.`,
   plots:[
    {kind:'curve', x:'0.816*cos(t)', y:'0.816*sin(t)', tr:[0,6.2832], height:300, equal:true,
     xr:[-1.4,1.4], yr:[-1.0,1.25],
     title:'proiezioni di e1, e2, e3 sul piano ortogonale a (1,1,1)',
     segs:[{x1:0,y1:0,x2:0,y2:0.816,col:'#5eead4',arrow:true,label:'e1 - (1,1,1)/3',lx:0.55,ly:0.9},
           {x1:0,y1:0,x2:-0.707,y2:-0.408,col:'#d8a13a',arrow:true,label:'e2 - (1,1,1)/3',lx:-0.95,ly:-0.6},
           {x1:0,y1:0,x2:0.707,y2:-0.408,col:'#c084fc',arrow:true,label:'e3 - (1,1,1)/3',lx:0.95,ly:-0.6}],
     marks:[{x:0,y:0,col:'#8ea0b8',label:'(1,1,1) esce dal foglio: la banale'}]}
   ],
   leggi:R`<p>Il disegno è il piano $x+y+z=0$ visto dall'alto, con la retta della banale perpendicolare al foglio nel punto centrale. Le proiezioni dei tre vettori di base hanno la stessa lunghezza $\sqrt{2/3}\approx0{,}816$ e sono a $120^\circ$; una trasposizione scambia due frecce e lascia la terza, cioè è una riflessione del triangolo, e un ciclo le ruota di un terzo di giro. È la rappresentazione standard di $S_3$ vista dentro quella di permutazione, ed è lo stesso triangolo delle simmetrie di $S_3$. Generale: in ogni rappresentazione di permutazione la somma dei vettori di base genera una copia della banale. Accidentale: che il complemento sia irriducibile, vero per $S_N$ su $\mathbb{C}^N$ ma da dimostrare caso per caso per altri gruppi.</p>`}
]},

/* ---------------- 07 · DEGENERAZIONI ---------------- */
{ num:'07', title:'Perché serve: degenerazioni e regole di selezione', meta:'un’hamiltoniana che commuta col gruppo · gli autospazi portano rappresentazioni · tre siti e un livello doppio · elementi di matrice che si annullano',
  blocchi:[
  {t:'prosa', title:'Gli autospazi di un’hamiltoniana simmetrica', tag:'teorema', html:R`
  <p>Sia $U(g)$ una rappresentazione unitaria del gruppo di simmetria sullo spazio degli stati, e $H$ un'hamiltoniana che commuta con tutto il gruppo, $[H,U(g)]=0$ per ogni $g$. Allora ogni autospazio di $H$ è invariante — è lo stesso argomento della prima forma di Schur — e quindi porta una rappresentazione del gruppo. Se quella rappresentazione è <span class="str" data-str="rappresentazione-irriducibile">irriducibile</span>, <b>la degenerazione del livello è la dimensione dell'irriducibile</b>, e il gruppo la fissa prima di qualunque conto dinamico. Landau chiama questo il principio di classificazione dei termini (§96, stampata 448): ogni livello è etichettato dall'irriducibile secondo cui si trasformano le sue autofunzioni. Una degenerazione più grande di quella imposta dal gruppo si dice <b>accidentale</b>, e di solito segnala una simmetria in più che non si era vista.</p>
  <p>Detto con Schur: scomposto lo spazio in irriducibili, $H$ ristretta a ciascun blocco irriducibile commuta con il gruppo e quindi è un multiplo dell'identità. La diagonalizzazione di $H$ si riduce a decidere quanto vale quel multiplo, una volta per ogni irriducibile.</p>`},
  {t:'prosa', title:'Tre siti identici', tag:'esempi', html:R`
  <p>Un elettrone che salta fra tre siti identici ai vertici di un triangolo — tre punti quantici, o l'anello di tre atomi di carbonio di una molecola — ha l'hamiltoniana di salto, con ampiezza $t$ fra ogni coppia di siti,</p>
  $$H=\begin{pmatrix}0&-t&-t\\-t&0&-t\\-t&-t&0\end{pmatrix}.$$
  <p>Scambiare due siti non cambia niente, quindi $H$ commuta con le matrici di permutazione; per esempio $$HP_{(1\,2)}=P_{(1\,2)}H.$$ La tappa 06 ha già scomposto $\mathbb{C}^3$ sotto $S_3$: la banale sulla retta di $(1,1,1)$ e la standard sul piano $x+y+z=0$. Per Schur $H$ è un multiplo dell'identità su ciascuno dei due pezzi, quindi ha al più <b>due</b> livelli, e quello sul piano è <b>doppiamente degenere</b>. Basta un vettore per pezzo per leggerli:</p>
  $$H\begin{pmatrix}1\\1\\1\end{pmatrix}=-2t\begin{pmatrix}1\\1\\1\end{pmatrix},\qquad H\begin{pmatrix}1\\-1\\0\end{pmatrix}=t\begin{pmatrix}1\\-1\\0\end{pmatrix}.$$
  <p>Lo stato fondamentale, per $t\gt0$, è la sovrapposizione simmetrica con energia $-2t$; sopra c'è un livello doppio a $+t$. Nessuna equazione secolare di terzo grado: il gruppo ha fatto il lavoro.</p>`},
  {t:'plot', title:'I livelli dei tre siti: la simmetria decide la degenerazione',
   intro:R`I due livelli di $H$, in unità di $t$, con la loro degenerazione e l'irriducibile di $S_3$ che li etichetta.`,
   plots:[
    {kind:'curve', x:'t', y:'-2.6', tr:[-1.6,1.6], height:260, equal:false,
     xr:[-2.2,2.4], yr:[-2.8,1.8],
     title:'energia in unità di t: un livello singolo a -2 (banale), un livello doppio a +1 (standard)',
     segs:[{x1:-1,y1:-2,x2:1,y2:-2,col:'#5eead4',width:3,label:'-2t: banale, (1,1,1)',lx:0,ly:-1.7},
           {x1:-1,y1:1.05,x2:1,y2:1.05,col:'#d8a13a',width:3},
           {x1:-1,y1:0.95,x2:1,y2:0.95,col:'#d8a13a',width:3,label:'+t, due volte: standard',lx:0,ly:1.4}],
     marks:[]}
   ],
   leggi:R`<p>Le due linee arancioni sovrapposte sono lo stesso livello contato due volte: la degenerazione è la dimensione della rappresentazione standard. La somma delle energie, $-2t+t+t=0$, è la traccia di $H$, che è zero perché la diagonale è nulla. Se si rompe la simmetria — un sito diverso dagli altri due — il gruppo si riduce allo scambio dei due siti rimasti uguali, la standard non è più irriducibile, e il livello doppio si separa in due. Generale: la degenerazione imposta è la dimensione dell'irriducibile. Accidentale: i valori $-2$ e $1$, che dipendono dalla forma di $H$ e non dal gruppo.</p>`},
  {t:'prosa', title:'Regole di selezione', tag:'teorema', html:R`
  <p>La seconda forma di Schur dà l'altra metà del raccolto. Se un operatore $A$ commuta con il gruppo — per esempio una perturbazione simmetrica — e $|\alpha,i\rangle$, $|\beta,k\rangle$ sono stati che si trasformano secondo irriducibili non equivalenti $\alpha\ne\beta$, allora</p>
  $$\langle\beta,k|A|\alpha,i\rangle=0.$$
  <p>Infatti $A$ ristretto al sottospazio di $\alpha$ e proiettato su quello di $\beta$ è una mappa che intreccia due irriducibili diverse, quindi è nulla. Una perturbazione simmetrica non mescola mai livelli di simmetria diversa. Landau sviluppa il caso generale, in cui anche l'operatore si trasforma secondo una rappresentazione e la regola dice quali transizioni sono permesse (§97, stampate 451-454): è il linguaggio delle regole di selezione della spettroscopia.</p>`}
]},

/* ---------------- 08 · ESERCIZI ---------------- */
{ num:'08', title:'Esercizi — tocca a te', meta:'cinque esercizi con soluzione · una prova per capire se il movimento è passato',
  blocchi:[
  {t:'esercizio', title:'1 · Le irriducibili di Z3', html:R`
  <p>Trova tutte le rappresentazioni irriducibili complesse del gruppo ciclico $\mathbb{Z}_3=\{0,1,2\}$ con la somma modulo $3$, e verifica l'ortogonalità dei caratteri fra la banale e una delle altre.</p>`,
   sol:R`<p>Il gruppo è commutativo, quindi le irriducibili hanno dimensione uno (tappa 04): sono omomorfismi $\chi:\mathbb{Z}_3\to\mathbb{C}\setminus\{0\}$, fissati da $\chi(1)=\omega$ con $\omega^3=1$. Le scelte sono tre, $\omega=1,e^{2\pi i/3},e^{4\pi i/3}$, e $\chi_k(m)=e^{2\pi ikm/3}$: tre irriducibili, quante le classi (ogni elemento è una classe). L'ortogonalità fra la banale e $\chi_1$ è la somma delle radici terze dell'unità, $$1+e^{2\pi i/3}+e^{4\pi i/3}=0.$$ È la trasformata di Fourier discreta: i caratteri di $\mathbb{Z}_n$ sono le sue armoniche.</p>`},
  {t:'esercizio', title:'2 · Il commutante delle rotazioni del piano', html:R`
  <p>Trova tutte le matrici reali $2\times2$ che commutano con ogni $R_\theta$, e mostra che formano un campo isomorfo a $\mathbb{C}$.</p>`,
   sol:R`<p>Basta imporre la commutazione con $J=R_{\pi/2}$. Con $T=\begin{pmatrix}a&b\\c&d\end{pmatrix}$, da $TJ=JT$ segue $d=a$ e $c=-b$, quindi $T=aI-bJ$. Viceversa $aI+bJ$ commuta con ogni $R_\theta=\cos\theta\,I+\sin\theta\,J$. Poiché $J^2=-I$, la mappa $aI+bJ\mapsto a+ib$ rispetta somma e prodotto, ed è biiettiva: il commutante è $\mathbb{C}$. È la forma esatta in cui Schur fallisce sui reali: il commutante di un'irriducibile reale non è sempre $\mathbb{R}$, può essere $\mathbb{C}$ o i quaternioni.</p>`},
  {t:'esercizio', title:'3 · Il taglio non si rende unitario', html:R`
  <p>Mostra che non esiste un prodotto scalare su $\mathbb{R}^2$ in cui tutte le matrici di taglio $D(t)$ della tappa 03 siano isometrie.</p>`,
   sol:R`<p>In un prodotto scalare $\langle u,v\rangle=u^TMv$ con $M$ definita positiva, un'isometria conserva la norma di ogni vettore. Si prenda $v=(0,1)$: $D(t)v=(t,1)$, e $\|D(t)v\|^2=M_{11}t^2+2M_{12}t+M_{22}$, un polinomio di secondo grado in $t$ con $M_{11}\gt0$, che non può essere costante. Quindi nessun $M$ funziona. Il gruppo $(\mathbb{R},+)$ non è compatto e la media di Weyl non esiste: è per questo.</p>`},
  {t:'esercizio', title:'4 · Segno per standard', html:R`
  <p>Il prodotto della rappresentazione segno per la standard di $S_3$ è la rappresentazione $\sigma\mapsto\operatorname{sgn}\sigma\,D_{\text{std}}(\sigma)$. Calcolane il carattere e di' se è irriducibile e a quale è equivalente.</p>`,
   sol:R`<p>Il carattere è il prodotto dei caratteri: $(1\cdot2,\ (-1)\cdot0,\ 1\cdot(-1))=(2,0,-1)$. È la riga della standard, quindi la rappresentazione è irriducibile (norma $6$) ed è equivalente alla standard: caratteri uguali di irriducibili implicano equivalenza (tappa 06). Geometricamente: moltiplicare le riflessioni per $-1$ dà ancora le simmetrie di un triangolo, con gli assi ruotati di $90^\circ$.</p>`},
  {t:'esercizio', title:'5 · Rompere la simmetria dei tre siti', html:R`
  <p>Nell'hamiltoniana dei tre siti cambia l'energia del sito $3$ in $\varepsilon\ne0$. Quale sottogruppo di $S_3$ resta una simmetria, e che cosa succede al livello doppio?</p>`,
   sol:R`<p>Resta lo scambio dei siti $1$ e $2$, cioè il sottogruppo $\{e,(1\,2)\}$, che è commutativo: le sue irriducibili hanno dimensione uno (la banale e il segno), quindi il gruppo non impone più nessuna degenerazione. Il vettore $(1,-1,0)$, antisimmetrico nello scambio, è ancora autovettore con energia $t$, perché ha componente nulla sul sito $3$; l'altro stato che era degenere si mescola con lo stato simmetrico, e il livello doppio si separa. È il caso tipico di una perturbazione che abbassa la simmetria e toglie una degenerazione.</p>`},
  {t:'collaudo', title:'Controlla di aver capito', html:R`
  <ol>
  <li>Che cosa usa la dimostrazione della prima forma di Schur che non vale sui reali?</li>
  <li>Perché il carattere è costante sulle classi di coniugio?</li>
  <li>Perché la media di Weyl richiede un gruppo finito o compatto?</li>
  <li>Nella dimostrazione di Ballentine, perché basta considerare operatori hermitiani nel commutante?</li>
  <li>Perché un'hamiltoniana che commuta con il gruppo ha autospazi che portano una rappresentazione?</li>
  <li>Se lo spin è presente, perché il lemma applicato a $\{Q,P\}$ non dà più la stessa conclusione?</li>
  </ol>`,
   sol:R`<ol>
   <li>L'esistenza di un autovalore: su $\mathbb{C}$ il polinomio caratteristico ha sempre una radice, su $\mathbb{R}$ no, e la rotazione di $90^\circ$ è il controesempio.</li>
   <li>Perché $\chi(hgh^{-1})=\operatorname{tr}(D(h)D(g)D(h)^{-1})$ e la traccia è invariante per coniugio.</li>
   <li>Perché la media richiede di sommare (o integrare con una misura finita e invariante) su tutto il gruppo; su $(\mathbb{R},+)$ la somma diverge e il taglio mostra che il risultato è falso.</li>
   <li>Perché il commutante di un insieme autoaggiunto è chiuso per aggiunzione, quindi ogni suo elemento è combinazione di due hermitiani che vi appartengono.</li>
   <li>Perché se $H\psi=E\psi$ allora $HU(g)\psi=U(g)H\psi=EU(g)\psi$: $U(g)$ non fa uscire dall'autospazio.</li>
   <li>Perché un operatore che agisce solo sullo spin commuta con $Q$ e con $P$ senza essere un multiplo dell'identità: $\{Q,P\}$ non è più irriducibile.</li>
   </ol>`}
]},

function renderNav(active){
  var nav=document.getElementById('sidebar');
  nav.innerHTML='';

/* ---- renderer dei blocchi ---- */
function sectionProsa(title, tag, html){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var body=elFromHTML('<div class="open-body">'+html+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function sectionGram(title, rows){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag gramtag">grammatica</span></h3>';
  var inner='<table class="gramtab">';
  rows.forEach(function(r){ inner+='<tr><td class="gs">'+r[0]+'</td><td>'+r[1]+'</td></tr>'; });
  inner+='</table>';
  var body=elFromHTML('<div class="gramwrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
/* --- blocco PLOT: la figura non decora, si legge. Ogni plot porta una chiave di lettura. --- */
function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';
  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionSvelabile(title, tag, html, sol){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var c=document.createElement('div'); c.className='collaudo-item';
  var q=document.createElement('div'); q.className='cq'; q.innerHTML=html||'';
  c.appendChild(q); typeset(q);
  if(sol){
    var a=document.createElement('div'); a.className='ca'; a.style.display='none';
    a.innerHTML='<b>Soluzione.</b> '+sol;
    var btn=document.createElement('button'); btn.className='reveal-btn small';
    btn.textContent='Rivela la soluzione';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a);
      btn.disabled=true; btn.classList.add('done'); btn.textContent='Soluzione rivelata'; };
    c.appendChild(btn); c.appendChild(a);
  }
  wrap.appendChild(c); return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    /* DUE SCHEMI, NON UNO — scoperto il 2026-10-06 provando le pagine vive. I movimenti
       scritti per primi (em-01..03, me-10b, i collaudi di gd-01..09 e di quattro em)
       usano una forma piu' semplice: `reveal` e `prolessi` con un solo `html`,
       `esercizio` e `collaudo` con `html` + `sol`. Il renderer ne conosceva una sola e
       chiamava `steps.forEach` su `undefined`: TypeError, e la tappa si fermava li' —
       62 blocchi in 17 movimenti su 74. Non si riscrive il contenuto per far contento
       il renderer: e' il renderer che deve leggere cio' che c'e'.
       E in fondo un ramo che NON muore: uno schema nuovo di domani deve far vedere un
       avviso in quella sezione, non spegnere la pagina sotto di se'. */
    try{
      if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
      else if(b.t==='prolessi') m.appendChild(b.rotte ? sectionProlessi(b)
                                   : sectionProsa(b.title,'prolessi',b.html));
      else if(b.t==='reveal')m.appendChild(b.steps ? sectionReveal(b.title,b.tag,b.steps)
                                   : sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='esercizio') m.appendChild(b.steps ? sectionEsercizio(b)
                                   : sectionSvelabile(b.title,'esercizio',b.html,b.sol));
      else if(b.t==='collaudo')  m.appendChild(b.items ? sectionCollaudo(b.title,b.items)
                                   : sectionSvelabile(b.title,'provi, poi riveli',b.html,b.sol));
      else if(b.t==='plot')      m.appendChild(sectionPlot(b));
      else m.appendChild(sectionProsa(b.title||'(blocco)', 'tipo sconosciuto: '+b.t,
                                      b.html||''));
    }catch(err){
      var avv=document.createElement('section'); avv.className='section';
      avv.innerHTML='<h3>'+(b.title||'(blocco)')+'<span class="tag">non reso</span></h3>'
        +'<p style="color:#ff6b6b">Questo blocco non si &egrave; potuto rendere ('
        +b.t+': '+err.message+'). Il resto della tappa continua sotto.</p>';
      m.appendChild(avv);
    }
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* I POP-UP DEGLI STRUMENTI. `cablaStrumenti` esisteva dal 18-09 e non la chiamava
     nessuno: i 229 rimandi del percorso erano <span> senza handler, e il clic non
     faceva niente. Nessun controllo poteva vederlo — la sintassi era valida, le schede
     c'erano tutte, le formule rendevano: il guasto esisteva solo a pagina viva. Qui, e
     dopo ogni inserimento successivo, perche' la tappa si rimonta da capo a ogni
     cambio e gli handler vanno riattaccati al DOM nuovo. */
  cablaStrumenti(m);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}
