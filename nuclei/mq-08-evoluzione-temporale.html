   leggi:R`<p><b>Che cosa guardare.</b> Nel riquadro di sinistra le due curve non coincidono mai, salvo nell&rsquo;origine: la rossa è sempre «più ripida» della blu, e la loro differenza — la curva gialla — è una <i>retta</i> con pendenza $-3\sigma^{2}$, perché per un cubico la correzione al secondo ordine è esatta. Nel riquadro di destra, con forza lineare, le due curve coincidono esattamente e la differenza è identicamente nulla a qualunque $\sigma$: <b>la larghezza del pacchetto non ha nessun effetto</b>.</p>
   <p><b>Che cosa impararne.</b> La differenza fra i due riquadri non dipende da $\hbar$ e non dipende dalla meccanica quantistica: dipende solo dal fatto che per una funzione non lineare la media dell&rsquo;immagine non è l&rsquo;immagine della media, che è la disuguaglianza di Jensen vista all&rsquo;opera. <i>Il teorema di Ehrenfest è esatto esattamente dove Jensen è un&rsquo;uguaglianza, cioè per le funzioni affini.</i> Si noti anche la direzione dello scarto: per $q_0>0$ la media della forza è più negativa, cioè il pacchetto è richiamato verso l&rsquo;origine più di quanto una particella classica nella stessa posizione sarebbe — perché la coda lontana del pacchetto sente una forza molto più grande e la coda vicina una molto più piccola, e il cubo non compensa.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Se le correzioni a Ehrenfest non dipendono da $\hbar$, in che cosa consiste allora la differenza fra la meccanica quantistica e un ensemble classico?`,
    a:R`In tutto ciò che la distribuzione nello spazio delle fasi non cattura, e nel caso della buca Ballentine lo nomina con precisione: le ricorrenze periodiche tardive dello stato quantistico «<i>are due to the interference of reflected waves and to the discreteness of the quantum spectrum, which are essentially nonclassical</i>». <b>Le due differenze vere sono l&rsquo;interferenza e la discretezza dello spettro</b>, e nessuna delle due compare nelle equazioni per $\langle x\rangle$ e $\langle p\rangle$. L&rsquo;ensemble classico, dopo un po&rsquo;, si spalma uniformemente e lì resta per sempre; lo stato quantistico si ricostruisce periodicamente, perché le sue fasi sono commensurabili. <i>Questo è il motivo per cui l&rsquo;accordo fra quantistico e classico vale per un intervallo di tempo e non per sempre</i>, e il tempo di validità è tanto più lungo quanto più $T_{\mathrm{qm}}$ è grande — cioè quanto più $\hbar$ è piccolo rispetto alle grandezze in gioco.`},
   {q:R`Il teorema dà $m\,d^{2}\langle x\rangle/dt^{2}=\langle F\rangle$ in modo esatto. Non basta questo a dire che il baricentro si muove come una particella classica?`,
    a:R`No, e la ragione è in una parola: <i>come una particella classica soggetta a quale forza?</i> L&rsquo;equazione esatta dice che il baricentro accelera come impone $\langle F(\hat x)\rangle$, che è una quantità che dipende dall&rsquo;intera distribuzione e <b>non è una funzione di $\langle x\rangle$</b>. Per sapere come si muove il baricentro bisogna conoscere la forma del pacchetto a ogni istante, cioè risolvere il problema completo: l&rsquo;equazione esatta non è un&rsquo;equazione chiusa per $\langle x\rangle$, e quindi non è una legge del moto. Diventa una legge del moto solo con l&rsquo;approssimazione $\langle F\rangle\approx F(\langle x\rangle)$, ed è quella — e solo quella — che è il teorema di Ehrenfest propriamente detto. <i>La distinzione fra «identità esatta» e «equazione chiusa» è l&rsquo;intero contenuto della tappa</i>, ed è il tipo di sottigliezza che si perde quando si cita il teorema senza dimostrarlo.`},
   {q:R`Nella buca, il periodo quantistico vale $4mL^{2}/\pi\hbar$ e quello classico $2L/v$. Per quale velocità i due coincidono?`,
    a:R`Uguagliando, $2L/v=4mL^{2}/\pi\hbar$ dà $v=\pi\hbar/2mL$, cioè un impulso $p=\pi\hbar/2L$, che è <b>metà dell&rsquo;impulso del livello fondamentale</b> $p_1=\pi\hbar/L$. In altri termini i due periodi coincidono solo per una particella così lenta da essere sotto lo stato fondamentale, cioè in un regime in cui la descrizione classica non ha alcun senso. <i>Per ogni stato fisicamente sensato $T_{\mathrm{qm}}\gg T_{cl}$</i>: con $n$ livelli eccitati tipici, il rapporto è dell&rsquo;ordine di $n$, e per $n$ grande — cioè nel regime semiclassico — la ricorrenza quantistica avviene dopo un numero enorme di periodi classici. È così che il paradosso si dissolve senza che nessuna delle due formule sia sbagliata: <b>sono due tempi diversi, e nel limite classico il secondo diventa inosservabile.</b>`}
  ]}
]},

/* ---------------- 09 · IL DECADIMENTO NON È ESPONENZIALE ---------------- */
{ num:'09', title:'Il decadimento non è esponenziale, e la ragione è nello spettro', meta:'da dove viene la legge esponenziale · la parabola a tempi brevi · lorentziana e Fourier · il teorema di Khalfin · che cosa questo smonta',
  blocchi:[
  {t:'prosa', title:'Perché un movimento sull’evoluzione temporale deve arrivare qui', tag:'architettura', html:R`
  <p>La legge del decadimento esponenziale è una delle poche formule che tutti ricordano, e si insegna come se fosse una conseguenza della meccanica quantistica. <b>Non lo è: è in conflitto con essa</b>, e il conflitto è esatto e dimostrabile in mezza pagina. Ballentine lo mostra in un paragrafo che chiude il capitolo sui fenomeni dipendenti dal tempo, e la conclusione è netta: «<i>the familiar exponential &ldquo;law&rdquo; of decay must, in fact, be an approximation whose validity depends on special properties of the unstable states that occur commonly</i>».</p>
  <p>Vale qui per tre motivi. Il primo è che è una conseguenza diretta della struttura costruita in questo movimento — lo sviluppo in autostati dell&rsquo;energia e le fasi — e quindi è il posto giusto in cui sta. Il secondo è che è il controesempio più netto all&rsquo;abitudine di pensare l&rsquo;evoluzione quantistica come un processo senza memoria. Il terzo è che obbliga a guardare la <i>funzione spettrale</i> di uno stato, che è l&rsquo;oggetto che decide la forma dell&rsquo;evoluzione e che di solito resta implicito.</p>`},
  {t:'reveal', title:'Da dove viene la legge esponenziale, e che cosa assume davvero', tag:'costruzione', steps:[
   {label:'L’argomento probabilistico, in tre righe', body:R`
   <p>Si indichi con $u(t)$ l&rsquo;evento «il sistema non è ancora decaduto all&rsquo;istante $t$», e con $P(t_2,t_1)$ la probabilità che sia ancora integro a $t_2$ sapendo che lo era a $t_1$. Due assunzioni, e Ballentine le enuncia una per una.</p>
   <p><b>Prima</b>: la probabilità dipende solo dall&rsquo;informazione a $t_1$, e «<i>the history earlier than $t_1$ is irrelevant</i>». È l&rsquo;assenza di memoria.</p>
   <p><b>Seconda</b>: «<i>since the laws of nature do not depend on the particular epoch</i>», la probabilità dipende solo dalla differenza, $P(t_2,t_1)=P(t_2-t_1)$. È l&rsquo;omogeneità del tempo — la stessa che nella tappa 01 ha permesso di scrivere $U(t)$ invece di $U(t,t_0)$.</p>
   <p>Per tre istanti $t_1<t_2<t_3$, essere integro a $t_3$ implica esserlo stato a $t_2$, e applicando la regola del prodotto delle probabilità condizionate si ottiene l&rsquo;equazione funzionale</p>
   $$P(t_3-t_1)=P(t_3-t_2)\,P(t_2-t_1).$$
   <p>La sua unica soluzione continua è l&rsquo;esponenziale, $P(t)=e^{-\lambda t}$ con $\lambda>0$ perché $P$ non può superare uno. Da lì si ricava la probabilità di decadere in un intervallo, $1-e^{-\lambda(t_2-t_1)}$, e la probabilità di decadimento per unità di tempo a intervalli brevi:</p>
   $$\lim_{\delta t\to0}\frac{1-e^{-\lambda\,\delta t}}{\delta t}=\lambda.$$
   <p><b>Si noti che in questa derivazione non c&rsquo;è una sola riga di meccanica quantistica.</b> È una conseguenza della sola assenza di memoria, e questo è esattamente il punto: se la legge quantistica non è esponenziale, allora l&rsquo;evoluzione quantistica <i>ha</i> memoria.</p>`},
   {label:'La legge quantistica, e il conto che la smonta', body:R`
   <p>Si prepari il sistema a $t=0$ nello stato $\Psi_u$ e si definisca l&rsquo;ampiezza di sopravvivenza come la proiezione dello stato evoluto su quello iniziale:</p>
   $$A(t)=\langle\Psi_u|e^{-iHt/\hbar}|\Psi_u\rangle,\qquad P_u(t)=|A(t)|^{2}.$$
   <p>Si sviluppi l&rsquo;esponenziale in serie: $A(t)=1-i\langle H\rangle t/\hbar-\langle H^{2}\rangle t^{2}/2\hbar^{2}+\cdots$. Il modulo quadro, con $a=\langle H\rangle/\hbar$ e $b=\langle H^{2}\rangle/\hbar^{2}$, si ottiene moltiplicando per il coniugato:</p>
   $$\Big(1-iat-\tfrac12bt^{2}\Big)\Big(1+iat-\tfrac12bt^{2}\Big)=1+a^{2}t^{2}-bt^{2}+\tfrac14b^{2}t^{4}.$$
   <p>I termini in $t$ e in $t^{3}$ si cancellano identicamente — e questa cancellazione è il cuore del risultato. Fermandosi al secondo ordine,</p>
   $$P_u(t)=1-\frac{\big\langle(H-\langle H\rangle)^{2}\big\rangle}{\hbar^{2}}\,t^{2}.$$
   <p><b>A tempi brevi la probabilità di sopravvivenza è una parabola, non un esponenziale</b>, e la differenza non è quantitativa: un esponenziale ha derivata non nulla in zero, una parabola ce l&rsquo;ha nulla. Ballentine: «<i>if $\langle H\rangle$ and $\langle H^{2}\rangle$ are finite, it follows that $P_u(t)$ must be parabolic in form, rather than exponential, for short times</i>».</p>
   <p>Il coefficiente è la <i>varianza dell&rsquo;energia</i> nello stato iniziale, cioè la stessa quantità che compare nella relazione di indeterminazione tempo-energia. <i>Uno stato con energia ben definita decade lentamente all&rsquo;inizio</i>, e uno con energia definitissima — un autostato — non decade affatto, perché la varianza è nulla.</p>`},
   {label:'Dove è finita la memoria: il termine di rigenerazione', body:R`
   <p>Ballentine individua con precisione da dove viene la deviazione. Si scriva lo stato evoluto separando la componente lungo lo stato iniziale da tutto il resto,</p>
   $$e^{-iHt/\hbar}|\Psi_u\rangle=A(t)|\Psi_u\rangle+|\Phi(t)\rangle,\qquad\langle\Psi_u|\Phi(t)\rangle=0,$$
   <p>dove $|\Phi(t)\rangle$ descrive i prodotti di decadimento. Applicando l&rsquo;evoluzione per un ulteriore tempo $t'$ e proiettando di nuovo:</p>
   $$A(t+t')=A(t)A(t')+\langle\Psi_u|e^{-iHt'/\hbar}|\Phi(t)\rangle.$$
   <p>Se il secondo termine fosse nullo, $A$ soddisferebbe l&rsquo;equazione funzionale dell&rsquo;esponenziale e la legge sarebbe esponenziale esatta. <b>Quel termine è la memoria</b>, e Ballentine lo dice con l&rsquo;immagine giusta: «<i>the undecayed state is being at least partially regenerated</i>». I prodotti di decadimento, evolvendo, non restano ortogonali allo stato iniziale — una parte dell&rsquo;ampiezza torna indietro.</p>
   <p><i>Questo è il punto in cui la meccanica quantistica si separa dal modello probabilistico</i>: il modello assume che un sistema decaduto resti decaduto, l&rsquo;evoluzione unitaria non lo permette, perché è invertibile e nessuna informazione si perde.</p>`}
  ]},
  {t:'reveal', title:'La funzione spettrale decide tutto, e solo la lorentziana dà l’esponenziale', tag:'costruzione', steps:[
   {label:'L’ampiezza è una trasformata di Fourier', body:R`
   <p>Si sviluppi lo stato iniziale negli autostati dell&rsquo;energia — è la ricetta della tappa 04 — e si sostituisca nell&rsquo;ampiezza:</p>
   $$A(t)=\sum_n\big|\langle E_n|\Psi_u\rangle\big|^{2}e^{-iE_nt/\hbar}=\int\eta(E)\,e^{-iEt/\hbar}\,dE,$$
   <p>dove</p>
   $$\eta(E)=\sum_n\big|\langle E_n|\Psi_u\rangle\big|^{2}\delta(E-E_n)$$
   <p>è la <b>funzione spettrale</b> dello stato: la distribuzione di probabilità dell&rsquo;energia, che la tappa 04 ha dimostrato essere congelata. Se lo spettro è continuo la somma diventa integrale e $\eta$ è una funzione ordinaria.</p>
   <p>Quindi: <b>l&rsquo;ampiezza di sopravvivenza è la <span class="str" data-str="trasformata-di-fourier">trasformata di Fourier</span> della distribuzione di energia dello stato iniziale.</b> Ballentine ne trae la conseguenza che chiude ogni speranza di una legge universale: «<i>the only restriction on $\eta(E)$ is that it cannot be negative, it appears that there can be no universal decay law for unstable states. Every different choice for the spectral content of the initial state leads to a different time dependence of the decay.</i>»</p>
   <p>È un risultato di struttura, non un calcolo: <i>la forma del decadimento è determinata dalla forma dello spettro, e viceversa</i>, perché la trasformata di Fourier è invertibile.</p>`},
   {label:'La lorentziana, e perché sfugge all’argomento della parabola', body:R`
   <p>Si cerchi quale $\eta$ dia l&rsquo;esponenziale. La risposta è la distribuzione di Breit-Wigner, cioè una lorentziana di centro $E_0$ e semilarghezza $\tfrac12\lambda\hbar$,</p>
   $$\eta(E)=\frac{\tfrac12\lambda\hbar/\pi}{(E-E_0)^{2}+(\tfrac12\lambda\hbar)^{2}},$$
   <p>che è normalizzata, come si verifica con l&rsquo;integrale elementare</p>
   $$\int_{-\infty}^{+\infty}\frac{\tfrac12\lambda\hbar/\pi}{(E-E_0)^{2}+(\tfrac12\lambda\hbar)^{2}}\,dE=1.$$
   <p>La sua trasformata di Fourier si calcola con un integrale di contorno, chiudendo nel semipiano dove l&rsquo;esponenziale decade e raccogliendo il residuo del polo semplice, e dà</p>
   $$A(t)=\exp\Big(-\tfrac12\lambda t-\frac{iE_0t}{\hbar}\Big),$$
   <p>cioè $P(t)=e^{-\lambda t}$ esattamente. Ballentine: «<i>only a state with a Lorentzian spectral function can have an exactly exponential decay law</i>», e l&rsquo;«only» è garantito dall&rsquo;unicità della trasformata.</p>
   <p>Ma allora dov&rsquo;è finita la parabola a tempi brevi? <b>L&rsquo;argomento non si applica</b>, e il motivo è bellissimo: la lorentziana «<i>has no finite moments</i>». Gli integrali $\langle H^{n}\rangle=\int E^{n}\eta(E)\,dE$ divergono perché le code vanno come $E^{-2}$, quindi lo sviluppo di Taylor usato sopra non esiste. <i>La varianza dell&rsquo;energia di uno stato con spettro lorentziano è infinita</i>, e la parabola aveva come coefficiente proprio quella varianza.</p>`},
   {label:'Il teorema di Khalfin: il limite inferiore dello spettro', body:R`
   <p>Resta un ultimo colpo, e viene da un fatto fisico elementare. <b>Ogni sistema fisico reale ha un&rsquo;energia minima</b>: esiste $E_{\min}$ tale che $\eta(E)=0$ per $E<E_{\min}$. Una lorentziana invece ha code su tutta la retta reale, inclusi i valori arbitrariamente negativi — quindi <i>nessuno stato fisico ha esattamente una funzione spettrale lorentziana</i>.</p>
   <p>Il troncamento delle code ha una conseguenza che Ballentine attribuisce a Khalfin (1958): «<i>the existence of a lower bound to the spectrum implies that at sufficiently long times the decay must be slower than any exponential</i>».</p>
   <p>Si legga la portata dell&rsquo;enunciato: non «un po&rsquo; diverso», ma <b>più lento di <i>ogni</i> esponenziale</b> — tipicamente una legge di potenza. Quindi la curva di sopravvivenza reale ha tre regimi: una parabola a tempi brevissimi, un esponenziale in mezzo (dove si misura, e dove la lorentziana è un&rsquo;ottima approssimazione), e una coda a potenza a tempi lunghissimi. <i>Nessuno dei due estremi è stato mai osservato in modo pulito</i>, perché il regime esponenziale copre decine di vite medie, ma entrambi sono conseguenze inevitabili della struttura.</p>
   <p>Ballentine chiude segnalando dove la lorentziana nasce in modo naturale — «<i>the virtual bound state of resonant scattering</i>» — e citando il modello esattamente risolubile di Winter (1961), in cui uno stato instabile decade per effetto tunnel attraverso una barriera. <b>Il legame fra riga lorentziana e decadimento esponenziale è lo stesso fatto letto in due domini di Fourier</b>: la larghezza $\Gamma=\lambda\hbar$ di una riga spettrale e la vita media $\tau=1/\lambda$ soddisfano $\Gamma\tau=\hbar$, che è la relazione di indeterminazione tempo-energia nella sua unica forma in cui è un teorema e non un&rsquo;analogia.</p>`}
  ]},
  {t:'plot', title:'Tre regimi, e la riga spettrale che li produce',
   intro:R`<p>A sinistra: la probabilità di sopravvivenza secondo l&rsquo;esponenziale puro $e^{-t}$, la parabola a tempi brevi $1-t^{2}/2$ (con varianza d&rsquo;energia unitaria) e una coda a potenza $0{,}02/t^{2}$ che la supera per tempi lunghi. A destra: la funzione spettrale lorentziana normalizzata con $\tfrac12\lambda\hbar=1$ e, per confronto, una gaussiana di uguale altezza — le code sono la differenza che conta.</p>`,
   plots:[{kind:'func2d', xr:[0,6], yr:[0,1.05], height:250, ticks:true,
     title:'sopravvivenza: parabola, esponenziale, coda a potenza',
     curves:[{f:'Math.exp(-x)', col:'#5aa9ff', width:2.4, label:'e^(−λt)'},
             {f:'1-x*x/2', col:'#6bdc9b', width:2.2, dash:true, label:'1 − ⟨ΔH⟩²t²/ħ²'},
             {f:'0.02/(x*x)', col:'#ff6b8a', width:2.2, label:'coda a potenza'}],
     xlabel:'λt', ylabel:'P(t)'},
    {kind:'func2d', xr:[-6,6], yr:[0,0.36], height:250, ticks:true,
     title:'lorentziana contro gaussiana: tutto sta nelle code',
     curves:[{f:'1/(Math.PI*(x*x+1))', col:'#5aa9ff', width:2.4, label:'lorentziana'},
             {f:'Math.exp(-x*x*Math.PI*Math.PI/4)/Math.PI', col:'#ffc24a', width:2.2, dash:true, label:'gaussiana di pari altezza'}],
     xlabel:'(E − E₀)/(λħ/2)', ylabel:'η(E)'}],
   leggi:R`<p><b>Che cosa guardare.</b> A sinistra, vicino all&rsquo;origine la parabola verde sta <i>sopra</i> l&rsquo;esponenziale blu e lo tocca con tangente orizzontale, mentre l&rsquo;esponenziale parte con pendenza $-1$: è la differenza che il conto ha dimostrato. A destra fuori dal grafico, la curva rossa a potenza incrocia l&rsquo;esponenziale attorno a $\lambda t\simeq5$ e da lì in poi è sempre sopra. Nel riquadro di destra, le due distribuzioni si somigliano al centro e divergono alle estremità: a cinque larghezze dal centro la lorentziana vale ancora un centesimo del massimo, la gaussiana è scesa di decine di ordini di grandezza.</p>
   <p><b>Che cosa impararne.</b> Le code della funzione spettrale decidono il comportamento a tempi <i>brevi</i>, e il centro decide quello a tempi lunghi — che è il verso opposto dell&rsquo;intuizione e discende dalla trasformata di Fourier, dove alto e largo si scambiano. <b>La lorentziana dà l&rsquo;esponenziale esatto proprio perché ha code grasse</b>, cioè momenti infiniti, cioè nessuna parabola iniziale; una gaussiana, che ha tutti i momenti finiti, dà necessariamente una parabola iniziale e <i>non</i> un esponenziale. Si noti che questo collega tre cose che sembravano separate: la forma della riga spettrale misurata in laboratorio, la legge temporale del decadimento, e l&rsquo;esistenza o meno della varianza dell&rsquo;energia — sono la stessa informazione in tre linguaggi.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Se $P_u(t)$ è parabolica a tempi brevi, che cosa succede se si fanno moltissime misure ravvicinate su un sistema instabile?`,
    a:R`Il decadimento <b>rallenta, e al limite si ferma</b>. È l&rsquo;effetto Zenone quantistico, ed è una conseguenza diretta del conto di questa tappa. Se si misura $N$ volte a intervalli $t/N$, ogni misura riazzera l&rsquo;evoluzione e la probabilità di sopravvivere a tutte è $[P_u(t/N)]^{N}\simeq[1-\sigma_E^{2}t^{2}/N^{2}\hbar^{2}]^{N}\to1$ per $N\to\infty$, perché l&rsquo;esponente $t^{2}/N^{2}$ va a zero più in fretta di quanto $N$ cresca. <i>Con una legge esponenziale questo non accadrebbe</i>: $[e^{-\lambda t/N}]^{N}=e^{-\lambda t}$, indipendente da $N$. <b>L&rsquo;effetto Zenone esiste se e solo se la legge non è esponenziale a tempi brevi</b>, ed è stato osservato sperimentalmente — il che rende il risultato di questa tappa un fatto misurato e non una sottigliezza formale.`},
   {q:R`Il decadimento radioattivo è misurato come esponenziale con grandissima precisione, su decine di vite medie. Dove sono finiti i regimi non esponenziali?`,
    a:R`Fuori dalla finestra osservabile, da entrambi i lati, ed è per questo che la legge «funziona». Il regime parabolico dura un tempo dell&rsquo;ordine di $\hbar/\sigma_E$ con $\sigma_E$ la larghezza energetica dello stato: per un nucleo radioattivo è dell&rsquo;ordine di $10^{-20}$ secondi o meno, mentre la vita media può essere di anni. Il regime a potenza comincia quando la sopravvivenza è scesa a valori come $10^{-30}$, cioè dopo settanta vite medie, e lì non restano abbastanza nuclei nemmeno in una mole. <b>La finestra esponenziale copre tutto ciò che si può contare</b>, e questo è il senso preciso in cui Ballentine la chiama «<i>an approximation whose validity depends on special properties of the unstable states that occur commonly</i>». <i>La legge è ottima e non è esatta, e sapere dove non è esatta è ciò che permette di cercarla dove si rompe</i> — che è esattamente ciò che fanno gli esperimenti sull&rsquo;effetto Zenone.`}
  ]}
]},

/* ---------------- 10 · SPIN IN CAMPO MAGNETICO ---------------- */
{ num:'10', title:'Spin in campo magnetico: precessione, risonanza, e il sistema a due stati', meta:'il problema risolto nei due schemi · l’equazione vettoriale valida per campi qualsiasi · il riferimento rotante · la formula di Rabi · e perché vale per ogni sistema a due livelli',
  blocchi:[
  {t:'prosa', title:'Perché questo esempio e non un altro', tag:'architettura', html:R`
  <p>Tutto quello che precede è stato dimostrato in generale. Questa tappa lo mette alla prova su un sistema che si risolve <i>esattamente</i> e che è, nei fatti, l&rsquo;unico sistema dinamico che gli esercizi di questo corso chiedono di risolvere per intero: una particella di spin $1/2$ in campo magnetico.</p>
  <p>La scelta non è arbitraria, e Ballentine la giustifica alla fine del paragrafo con un&rsquo;osservazione che estende la portata di tutto: «<i>The only property of a spin $1/2$ system that was essential to this analysis is that the state space be two-dimensional, and hence analogous results will hold for any two-state system.</i>» Un atomo in cui solo due livelli sono popolati, due stati di polarizzazione, due pozzi di un doppio buca, un qubit: <b>la matematica è la stessa, e si impara una volta</b>.</p>`},
  {t:'reveal', title:'Precessione, risolta in Schrödinger e in Heisenberg', tag:'costruzione', steps:[
   {label:'L’hamiltoniana, e l’evoluzione in Schrödinger', body:R`
   <p>Una particella con spin ha un momento magnetico proporzionale allo spin, $\boldsymbol\mu=\gamma\mathbf S$, e l&rsquo;interazione con un campo $\mathbf B$ dà $H=-\boldsymbol\mu\cdot\mathbf B=-\gamma\mathbf B\cdot\mathbf S$. Il fattore giromagnetico dipende dalla particella — per l&rsquo;elettrone $\gamma_e\simeq-e/m_ec$, per il protone $\gamma_p=2{,}79\,e/m_pc$, per il neutrone $\gamma_n=-1{,}91\,e/m_pc$ — e il suo <i>segno</i> cambia il verso della precessione.</p>
   <p>Con campo costante $B_0$ lungo $z$ e $\mathbf S=\tfrac12\hbar\boldsymbol\sigma$ in termini delle <span class="str" data-str="matrici-di-pauli">matrici di Pauli</span>, l&rsquo;hamiltoniana è $H=-\tfrac12\gamma\hbar B_0\sigma_z$, diagonale. I suoi autovettori sono $|+\rangle$ e $|-\rangle$ con energie $\mp\tfrac12\gamma\hbar B_0$, e applicando la ricetta della tappa 04 — sviluppare e appiccicare le fasi — lo stato generico è</p>
   $$|\Psi(t)\rangle=a_1e^{i\omega_0t/2}|+\rangle+a_2e^{-i\omega_0t/2}|-\rangle,\qquad \omega_0=\gamma B_0.$$
   <p>Si prenda il caso $a_1=a_2=1/\sqrt2$, cioè uno spin inizialmente diretto lungo $x$. I valori medi delle componenti si calcolano moltiplicando le matrici:</p>
   $$\langle\sigma_x\rangle_t=\cos\omega_0t,$$
   $$\langle\sigma_y\rangle_t=-\sin\omega_0t,$$
   <p>mentre $\langle\sigma_z\rangle_t=0$ per ogni $t$. <b>Il vettore dei valori medi ruota nel piano $xy$ con velocità angolare $\omega_0$</b>, modulo costante: è la precessione di Larmor. Si noti il meccanismo: le due componenti hanno la stessa probabilità e la loro <i>fase relativa</i> avanza di $\omega_0t$, che è esattamente il contenuto della tappa 04 — la frequenza è la differenza delle energie diviso $\hbar$.</p>`},
   {label:'Lo stesso risultato in Heisenberg, e un guadagno in più', body:R`
   <p>Lo schema di Heisenberg dà il risultato in forma più forte, e vale farlo perché è il caso in cui il vantaggio si vede. L&rsquo;equazione del moto per la componente $x$ con campo arbitrario è</p>
   $$\frac{dS_x'}{dt}=\frac{i}{\hbar}\big[H,S_x'\big]=\frac{i}{\hbar}\big[-\gamma\mathbf B\cdot\mathbf S,S_x'\big]=\gamma\big(-S_z'B_y+S_y'B_z\big),$$
   <p>dove l&rsquo;apice indica l&rsquo;operatore di Heisenberg. Le tre componenti si raccolgono in un&rsquo;equazione vettoriale:</p>
   $$\frac{d\mathbf S'}{dt}=\mathbf S'\times\gamma\mathbf B.$$
   <p>Ballentine sottolinea l&rsquo;ambito: «<i>This equation is valid for arbitrary time-dependent magnetic fields.</i>» <b>È l&rsquo;equazione del moto di un momento angolare classico in un campo magnetico, identica</b> — altro esempio di ciò che la tappa 05 prometteva: in Heisenberg le equazioni sono quelle classiche.</p>
   <p>Per campo costante lungo $z$ la soluzione è, come già visto nella tappa 05,</p>
   $$S_x'(t)=S_x'(0)\cos\omega_0t+S_y'(0)\sin\omega_0t,$$
   <p>con l&rsquo;analoga per $S_y'$ e $S_z'(t)=S_z'(0)$. E qui il guadagno: Ballentine osserva che la precessione avviene «<i>regardless of the magnitude of the spin, and regardless of the initial state (which need not be a pure state)</i>». <i>Il conto in Schrödinger valeva per uno spin $1/2$ in uno stato puro particolare; questo vale per ogni spin e ogni stato, incluse le miscele statistiche</i> — ed è lo stesso tipo di vantaggio che la tappa 06 aveva sfruttato per lo sparpagliamento del pacchetto.</p>`}
  ]},
  {t:'plot', title:'La precessione: tre componenti, e il vettore che gira',
   intro:R`<p>A sinistra, i tre valori medi $\langle\sigma_x\rangle=\cos\omega_0t$, $\langle\sigma_y\rangle=-\sin\omega_0t$ e $\langle\sigma_z\rangle=0$ per uno spin inizialmente diretto lungo $x$. A destra, la traiettoria del vettore $(\langle\sigma_x\rangle,\langle\sigma_y\rangle)$ nel piano, che è una circonferenza percorsa in verso orario.</p>`,
   plots:[{kind:'func2d', xr:[0,12.6], yr:[-1.2,1.2], height:250, ticks:true,
     title:'le tre componenti in funzione di ω₀t',
     curves:[{f:'Math.cos(x)', col:'#5aa9ff', width:2.4, label:'⟨σx⟩'},
             {f:'-Math.sin(x)', col:'#ff6b8a', width:2.4, label:'⟨σy⟩'},
             {f:'0', col:'#6bdc9b', width:2.0, dash:true, label:'⟨σz⟩'}],
     xlabel:'ω₀t', ylabel:'valor medio'},
    {kind:'curve', xr:[-1.3,1.3], yr:[-1.3,1.3], height:250, ticks:true,
     title:'la traiettoria nel piano xy',
     fx:'Math.cos(t)', fy:'-Math.sin(t)', tr:[0,6.2832],
     xlabel:'⟨σx⟩', ylabel:'⟨σy⟩'}],
   leggi:R`<p><b>Che cosa guardare.</b> Le due curve oscillanti sono in quadratura, e il verso conta: quando $\langle\sigma_x\rangle$ comincia a scendere, $\langle\sigma_y\rangle$ diventa negativa — quindi il vettore gira <i>in senso orario</i> guardando dall&rsquo;alto, cioè in verso negativo attorno a $z$. La componente lungo il campo resta nulla per sempre, e il modulo del vettore nel piano è costante e pari a uno.</p>
   <p><b>Che cosa impararne.</b> Il verso della rotazione è il dettaglio che si sbaglia, e Ballentine avverte che la situazione «<i>is complicated by the following fact</i>»: un momento magnetico positivo in un campo diretto positivamente precede in verso <i>negativo</i>, perché $\omega_0=\gamma B_0$ entra nelle fasi con il segno che si è visto. <b>Il modo sicuro di controllarlo è guardare quale componente è in anticipo sull&rsquo;altra</b>, come si fa in questa figura, invece di fidarsi di una regola mnemonica. Si noti anche che la figura è <i>esattamente</i> la stessa che si otterrebbe per un giroscopio classico con momento magnetico: il contenuto quantistico non sta nella traiettoria dei valori medi — Ehrenfest è esatto qui, perché l&rsquo;hamiltoniana è lineare negli operatori di spin — ma nel fatto che una misura di $\sigma_z$ dia sempre $\pm1$ e mai zero, cosa che il grafico del valor medio non mostra.</p>`},
  {t:'reveal', title:'La risonanza: eliminare il tempo passando a un riferimento che gira', tag:'costruzione', steps:[
   {label:'Il problema, e perché non serve la teoria delle perturbazioni', body:R`
   <p>Con il solo campo statico non si può né assorbire né cedere energia: lo spettro è fisso e le probabilità di energia sono congelate. Per indurre transizioni serve un campo dipendente dal tempo, e Ballentine prende il caso più pulito — un campo rotante nel piano $xy$,</p>
   $$\mathbf B_1(t)=\hat{\mathbf i}B_1\cos\omega t+\hat{\mathbf j}B_1\sin\omega t,$$
   <p>che si sovrappone al campo statico $B_0$ lungo $z$. Un campo <i>oscillante</i> lungo una direzione fissa, che è il caso sperimentale comune, si scrive come somma di questo e di uno controrotante.</p>
   <p>L&rsquo;hamiltoniana diventa dipendente dal tempo, e si scrive compattamente usando la rotazione generata da $S_z$:</p>
   $$H=-\gamma B_0S_z-\gamma B_1\,e^{-i\omega tS_z/\hbar}S_xe^{i\omega tS_z/\hbar}.$$
   <p><b>Questo problema si risolve esattamente</b>, e la ragione per cui vale sottolinearlo è che il programma di questo corso esclude le perturbazioni dipendenti dal tempo: qui non ce n&rsquo;è bisogno, perché la dipendenza temporale è una <i>rotazione</i> e una rotazione si può annullare girando insieme a lei.</p>`},
   {label:'Il riferimento rotante, e l’hamiltoniana efficace', body:R`
   <p>Si definisca lo stato visto dal riferimento che ruota con $\mathbf B_1$,</p>
   $$|\Phi\rangle=e^{i\omega tS_z/\hbar}|\Psi\rangle,$$
   <p>e si riscriva l&rsquo;equazione di Schrödinger per $|\Phi\rangle$. Derivando la definizione nasce un termine in più — la derivata dell&rsquo;esponenziale, che dà $\omega S_z$ — e il risultato è un&rsquo;equazione con hamiltoniana <b>indipendente dal tempo</b>:</p>
   $$i\hbar\frac{\partial}{\partial t}|\Phi\rangle=-\big\lbrace(\gamma B_0+\omega)S_z+\gamma B_1S_x\big\rbrace|\Phi\rangle=H_{\text{eff}}|\Phi\rangle.$$
   <p>Ballentine traduce il risultato in parole, e la traduzione è più utile della formula: «<i>with respect to a frame of reference rotating along with $\mathbf B_1$ at the rate $\omega$, the motion of the magnetic moment is the same as it would be in an effective static magnetic field whose $x$ component is $B_1$ and whose $z$ component is $B_0+\omega/\gamma$</i>».</p>
   <p><b>Il campo efficace lungo $z$ è ridotto di $\omega/\gamma$</b>, e questo è il meccanismo della risonanza: scegliendo $\omega$ si può annullare la componente $z$, e allora nel riferimento rotante resta solo $B_1$ lungo $x$.</p>`},
   {label:'Il conto esatto, e la formula di Rabi', body:R`
   <p>Posti $\omega_0=\gamma B_0$ e $\omega_1=\gamma B_1$, l&rsquo;hamiltoniana efficace in termini di Pauli è</p>
   $$H_{\text{eff}}=-\tfrac12\hbar\big\lbrace(\omega_0+\omega)\sigma_z+\omega_1\sigma_x\big\rbrace=-\tfrac12\hbar\alpha\,\sigma_a,$$
   <p>dove $\sigma_a$ è la componente di $\boldsymbol\sigma$ lungo una direzione intermedia nel piano $zx$ e</p>
   $$\alpha=\sqrt{(\omega_0+\omega)^{2}+\omega_1^{2}}.$$
   <p>Siccome $\sigma_a^{2}=1$, l&rsquo;esponenziale si somma in forma chiusa — è l&rsquo;identità che vale per ogni matrice di quadrato unitario:</p>
   $$e^{ix\sigma_a}=\cos x+i\sigma_a\sin x.$$
   <p>Da qui l&rsquo;operatore di evoluzione è una matrice $2\times2$ esplicita, e partendo dallo stato $|+\rangle$ si legge l&rsquo;ampiezza di trovare lo spin rovesciato. La probabilità di spin-flip dopo che il campo rotante ha agito per un tempo $T$ è la <b>formula di Rabi</b>:</p>
   $$P_{+\to-}(T)=\Big(\frac{\omega_1}{\alpha}\sin\frac{\alpha T}{2}\Big)^{2}.$$
   <p>Si guardi la struttura. L&rsquo;ampiezza massima dell&rsquo;oscillazione è</p>
   $$\frac{\omega_1^{2}}{(\omega_0+\omega)^{2}+\omega_1^{2}}\le1,$$
   <p>e vale uno <i>soltanto</i> quando $\omega_0+\omega=0$, cioè $\omega=-\gamma B_0$: è la <b>condizione di risonanza</b>. Fuori risonanza lo spin non si rovescia mai completamente, per quanto a lungo si aspetti — e questo è il contenuto fisico della risonanza, non la semplice idea che «si assorbe meglio».</p>
   <p>In risonanza $\alpha=\omega_1$ e la formula si riduce a</p>
   $$\Big(\frac{\omega_1}{\alpha}\sin\frac{\alpha T}{2}\Big)^{2}\Big|_{\alpha=\omega_1}=\sin^{2}\frac{\omega_1T}{2},$$
   <p>che oscilla fra zero e uno. Ballentine spiega il meccanismo in una riga: «<i>When $\omega_0+\omega=0$, the effect of the rotation exactly cancels the effect of the static field $B_0$ in the $z$ direction, and the magnetic moment precesses around field $B_1$ which points along the $x$ axis of the rotating frame.</i>» Scegliendo il prodotto $\omega_1T=\gamma B_1T$ <b>si può ruotare il momento magnetico di un angolo qualunque</b> — ed è esattamente ciò che si fa negli esperimenti di risonanza magnetica nucleare con gli impulsi detti $\pi/2$ e $\pi$.</p>`}
  ]},
  {t:'plot', title:'La curva di risonanza, e le oscillazioni di Rabi',
   intro:R`<p>A sinistra, la massima probabilità di spin-flip $\omega_1^{2}/[(\omega_0+\omega)^{2}+\omega_1^{2}]$ in funzione del disaccordo $\omega_0+\omega$, per tre valori dell&rsquo;ampiezza del campo rotante: $\omega_1=0{,}3$, $1$ e $2$. A destra, la probabilità in funzione della durata $T$, in risonanza e con due disaccordi diversi, a $\omega_1=1$ fissato.</p>`,
   plots:[{kind:'func2d', xr:[-4,4], yr:[0,1.1], height:250, ticks:true,
     title:'curva di risonanza: ampiezza massima contro disaccordo',
     curves:[{f:'0.09/(x*x+0.09)', col:'#5aa9ff', width:2.4, label:'ω₁ = 0,3: risonanza stretta'},
             {f:'1/(x*x+1)', col:'#6bdc9b', width:2.2, label:'ω₁ = 1'},
             {f:'4/(x*x+4)', col:'#ffc24a', width:2.2, label:'ω₁ = 2: risonanza larga'}],
     xlabel:'ω₀ + ω', ylabel:'P massima'},
    {kind:'func2d', xr:[0,13], yr:[0,1.1], height:250, ticks:true,
     title:'oscillazioni di Rabi in funzione della durata T',
     curves:[{f:'Math.pow(Math.sin(x/2),2)', col:'#5aa9ff', width:2.4, label:'in risonanza'},
             {f:'Math.pow(Math.sin(Math.sqrt(2)*x/2),2)/2', col:'#ffc24a', width:2.2, label:'disaccordo = 1'},
             {f:'Math.pow(Math.sin(Math.sqrt(5)*x/2),2)/5', col:'#ff6b8a', width:2.2, label:'disaccordo = 2'}],
     xlabel:'ω₁T', ylabel:'P(+→−)'}],
   leggi:R`<p><b>Che cosa guardare.</b> A sinistra le tre curve sono lorentziane di larghezza $\omega_1$: più forte è il campo rotante, più larga è la risonanza. A destra, in risonanza la probabilità arriva a uno e torna a zero periodicamente; fuori risonanza l&rsquo;oscillazione è <i>più rapida</i> — la frequenza è $\alpha>\omega_1$ — ma l&rsquo;ampiezza è ridotta e il massimo non si raggiunge mai.</p>
   <p><b>Che cosa impararne.</b> Due fatti operativi. Il primo è il compromesso fra selettività e velocità: un campo debole dà una risonanza stretta, quindi selettiva in frequenza, ma impiega un tempo lungo per rovesciare lo spin, perché il periodo di Rabi è $2\pi/\omega_1$. <i>Non si può avere insieme alta risoluzione spettrale e manipolazione veloce</i>, ed è una relazione di indeterminazione fra durata e banda, non un limite tecnologico. Il secondo: la forma lorentziana della curva di risonanza non è un caso — <b>è la stessa lorentziana della tappa precedente</b>, e per la stessa ragione, cioè la trasformata di Fourier di un&rsquo;evoluzione con una frequenza caratteristica. Riga spettrale, legge di decadimento e curva di risonanza sono tre manifestazioni dello stesso oggetto matematico.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Perché la risonanza richiede un campo <i>rotante</i>? Un campo oscillante lungo $x$ non basterebbe?`,
    a:R`Basta, ed è quello che si usa in laboratorio, ma il conto esatto diventa più difficile e Ballentine spiega come si riporta a questo: un campo oscillante lungo $x$ si decompone «<i>as a superposition of $\mathbf B_1(t)$ and a counterrotating field</i>», cioè in due campi rotanti di ampiezza dimezzata e versi opposti. Vicino alla risonanza <b>solo uno dei due è risonante</b>, perché l&rsquo;altro ha disaccordo $\simeq2\omega_0$ e dalla curva di risonanza si legge che il suo effetto è soppresso di un fattore $(\omega_1/2\omega_0)^{2}$. Trascurare il termine controrotante è l&rsquo;<i>approssimazione di onda rotante</i>, e ciò che resta è esattamente il problema risolto qui. Si noti che l&rsquo;approssimazione è controllata e non arbitraria: la correzione è calcolabile e si chiama spostamento di Bloch-Siegert. <b>Il campo rotante non è una semplificazione comoda: è la base in cui il problema è esattamente risolubile</b>, e l&rsquo;altro caso si riporta a questo.`},
   {q:R`La formula di Rabi dà una probabilità che oscilla e torna a zero. Ma in un esperimento di risonanza magnetica si misura un assorbimento, che non torna indietro. Dov&rsquo;è la differenza?`,
    a:R`Nell&rsquo;assenza, in questo conto, di qualunque meccanismo irreversibile. L&rsquo;evoluzione descritta qui è <b>unitaria e perfettamente reversibile</b>: lo spin assorbe energia dal campo e gliela restituisce, periodicamente, per sempre. In un campione reale ci sono moltissimi spin con ambienti leggermente diversi — quindi $\omega_0$ leggermente diverse — e le loro oscillazioni di Rabi si sfasano: la media sul campione si smorza e si osserva un assorbimento netto. <i>È lo stesso meccanismo per cui un ensemble classico si spalma mentre ogni traiettoria resta periodica</i>, visto nella tappa 08 sulla buca. <b>L&rsquo;irreversibilità non è nell&rsquo;equazione, è nella media su un insieme</b>, ed è un buon promemoria di che cosa manchi davvero all&rsquo;evoluzione unitaria quando si vuole descrivere un fenomeno di laboratorio.`}
  ]}
]},

/* ---------------- 11 · BILANCIO E PROBLEMI ---------------- */
{ num:'11', title:'Bilancio, e i quattro problemi di dinamica del capitolo', meta:'che cosa è stato assunto e che cosa dedotto · tre errori tipici · 3.8, 3.9, 3.10, 3.12 svolti · dove tutto questo riappare in fisica',
  blocchi:[
  {t:'prosa', title:'Che cosa si è assunto, e che cosa ne è uscito', tag:'architettura', html:R`
  <p>Conviene separare le due liste, perché il rapporto fra la loro lunghezza è il contenuto del movimento.</p>
  <p><b>Assunto</b>: che l&rsquo;evoluzione fra due istanti sia lineare, unitaria e componga come un gruppo; che per forze indipendenti dal tempo non ci siano istanti privilegiati; e che il generatore della traslazione temporale sia $-H/\hbar$ con $H$ l&rsquo;energia. Tre proprietà strutturali e una identificazione fisica. <i>Nessuna di esse parla di onde, di particelle o di $\psi$.</i></p>
  <p><b>Dedotto</b>: l&rsquo;esistenza e la forma esponenziale di $U$; l&rsquo;equazione di Schrödinger dipendente dal tempo e la sua forma operatoriale; la conservazione della probabilità con la corrente; la caratterizzazione completa degli stati stazionari; la ricetta di calcolo per qualunque valor medio, con le frequenze di Bohr; lo schema di Heisenberg e le equazioni di Hamilton per operatori; le costanti del moto, con la conservazione dell&rsquo;intera distribuzione; il teorema di Ehrenfest e i suoi limiti; la non-esponenzialità del decadimento; e la precessione e la risonanza di spin per esteso.</p>
  <p>Il rapporto è quattro a dieci, e vale notare dove si è pagato. <i>La sola ipotesi con contenuto empirico è l&rsquo;identificazione $K=-H/\hbar$</i>, e perfino quella non è arbitraria: la giustificano l&rsquo;analogia classica di Picasso e, più solidamente, l&rsquo;argomento di Dirac che le equazioni di Heisenberg abbiano la stessa forma delle equazioni canoniche. Tutto il resto è la struttura della simmetria temporale, tradotta.</p>`},
  {t:'reveal', title:'Tre errori tipici, e come si riconoscono', tag:'esempio', steps:[
   {label:'Mescolare i due schemi', body:R`
   <p>È l&rsquo;errore che Ballentine vieta per nome, e in uno scritto si manifesta come un fattore di frequenza sbagliato. <b>Il sintomo</b>: nel conto compaiono insieme uno stato con una $t$ dentro e un operatore con una $t$ dentro. <b>Il controllo</b>: in Schrödinger gli operatori non portano mai $t$, salvo dipendenza intrinseca da un campo esterno; in Heisenberg lo stato è sempre quello iniziale. <i>Se entrambi portano $t$, si sta contando il moto due volte.</i></p>`},
   {label:'Credere che la fase globale conti, o che quella relativa non conti', body:R`
   <p>Sono due errori speculari e si fanno nello stesso esercizio. <b>Il primo</b>: calcolare laboriosamente $e^{-iE_1t/\hbar}$ raccolto a fattore comune e credere che cambi qualcosa. Non cambia nulla, e raccoglierlo <i>semplifica il conto</i>: in una sovrapposizione di due livelli conviene sempre raccogliere la fase del primo e lasciare solo $e^{-i\omega_{21}t}$ sul secondo. <b>Il secondo</b>: dimenticare la fase relativa iniziale, cioè trattare $(|1\rangle+|2\rangle)/\sqrt2$ e $(|1\rangle+i|2\rangle)/\sqrt2$ come lo stesso stato. La tappa 04 ha mostrato che differiscono per un quarto di periodo in <i>tutti</i> i valori medi non diagonali. <i>La regola: una fase comune a tutti i coefficienti si butta, una fase su un coefficiente solo si tiene.</i></p>`},
   {label:'Confondere costante del moto e stato stazionario', body:R`
   <p>Il sintomo tipico è una frase come «<i>$\hat x$ non dipende dal tempo perché lo stato è stazionario, quindi $\hat x$ è una costante del moto</i>». La prima metà è vera, la seconda non segue. <b>Il controllo in una riga</b>: una costante del moto deve commutare con $H$, e la verifica si fa sul commutatore, mai sullo stato. <i>In uno stato stazionario tutto è costante e niente lo è per merito proprio.</i></p>`}
  ]},
  {t:'reveal', title:'I quattro problemi di dinamica del capitolo, svolti', tag:'costruzione',
   intro:R`<p>Sono i problemi del capitolo 3 di Ballentine che riguardano la dinamica e non la cinematica delle simmetrie. Si riportano nella lingua originale e si risolvono.</p>
   <p><b>3.8.</b> «<i>Calculate the position operator in the Heisenberg picture, $Q_H(t)$, for a free particle.</i>»</p>
   <p><b>3.9.</b> «<i>Use the equation of motion for a state operator $\rho(t)$ to show that a pure state cannot evolve into a nonpure state, and vice versa.</i>»</p>
   <p><b>3.10.</b> «<i>If the Hamiltonian is of the form $H=H_0+H_1$, the so-called interaction picture may be obtained by the following transformation… Find the equation of motion for the state vector and the state operator, and show that their time dependence is due only to the &ldquo;interaction&rdquo; term $H_1$.</i>»</p>
   <p><b>3.12.</b> «<i>If the Hamiltonian of a two-component system is of the form $H=H_1\otimes I+I\otimes H_2$ (i.e. no interaction between the components), show that the time development operator has the form $U(t)=U_1(t)\otimes U_2(t)$.</i>»</p>`,
   steps:[
   {label:'3.8 — la particella libera, e il commutatore a tempi diversi', body:R`
   <p>Con $H=P^{2}/2M$ l&rsquo;equazione di Heisenberg per l&rsquo;impulso dà $dP_H/dt=(i/\hbar)[H,P]=0$, quindi $P_H(t)=P$. Per la posizione, $dQ_H/dt=(i/\hbar)[H,Q_H]=P_H/M=P/M$, costante, e integrando con $Q_H(0)=Q$:</p>
   $$Q_H(t)=Q+\frac{P}{M}t,\qquad \frac{d\hat Q_H}{dt}=\frac{\hat P}{M}.$$
   <p>La risposta è una riga, ma vale estrarne il seguito che la tappa 05 ha anticipato. Il commutatore della posizione <b>a due tempi diversi</b> non è nullo:</p>
   $$\big[Q_H(t_1),Q_H(t_2)\big]=\frac{t_2}{M}\big[Q,P\big]+\frac{t_1}{M}\big[P,Q\big]=\frac{i\hbar(t_2-t_1)}{M}.$$
   <p>Il conto si fa sviluppando la bilinearità del <span class="str" data-str="commutatore">commutatore</span>: i due termini $[Q,Q]$ e $[P,P]$ sono nulli, restano i due incrociati, e il secondo entra con il segno rovesciato per antisimmetria. <i>Due misure di posizione a istanti diversi non sono compatibili</i>, e l&rsquo;incompatibilità cresce linearmente con l&rsquo;intervallo di tempo: è la stessa informazione dello sparpagliamento del pacchetto, scritta come relazione algebrica invece che come varianza.</p>`},
   {label:'3.9 — la purezza non si crea e non si distrugge', body:R`
   <p>Uno stato è puro se e solo se $\mathrm{Tr}\lbrace\rho^{2}\rbrace=1$; per una miscela è strettamente minore di uno. L&rsquo;evoluzione è $\rho(t)=U\rho_0U^{\dagger}$, quindi</p>
   $$\rho^{2}(t)=U\rho_0U^{\dagger}U\rho_0U^{\dagger}=U\rho_0^{2}U^{\dagger},$$
   <p>dove si è usata l&rsquo;unitarietà per cancellare la coppia centrale. Prendendo la traccia e usandone la ciclicità:</p>
   $$\mathrm{Tr}\{\rho^{2}(t)\}=\mathrm{Tr}\{\rho^{2}(t_0)\}.$$
   <p><b>La purezza è una costante del moto</b>, e quindi uno stato puro resta puro e una miscela resta una miscela con la stessa purezza. <i>Questo è il problema della misura visto dalla parte dell&rsquo;algebra</i>: il collasso trasforma uno stato puro in una miscela, quindi non può essere un&rsquo;evoluzione unitaria — e nessuna hamiltoniana, per complicata che sia, lo produrrà mai.</p>`},
   {label:'3.10 — il quadro di interazione, il terzo che non è un terzo', body:R`
   <p>Si definisca $|\Psi_I(t)\rangle=e^{i(t-t_0)H_0/\hbar}|\Psi_S(t)\rangle$. Derivando e usando l&rsquo;equazione di Schrödinger per $|\Psi_S\rangle$ con $H=H_0+H_1$, i termini in $H_0$ si cancellano:</p>
   $$i\hbar\frac{d}{dt}|\Psi_I(t)\rangle=H_1^{I}(t)\,|\Psi_I(t)\rangle,\qquad H_1^{I}(t)=e^{i(t-t_0)H_0/\hbar}H_1e^{-i(t-t_0)H_0/\hbar}.$$
   <p>Analogamente per l&rsquo;operatore di stato, $d\rho_I/dt=-(i/\hbar)[H_1^{I},\rho_I]$. <b>Nel quadro di interazione si muovono <i>entrambi</i></b>: gli stati sotto l&rsquo;azione della sola interazione, gli operatori sotto l&rsquo;azione della sola parte libera. Non è una violazione del divieto di mescolare i due schemi, perché è una terza scelta coerente e non un ibrido: il controllo è che $\langle R\rangle_t$ esce identico, come il problema chiede di verificare, e la verifica è di nuovo la ciclicità della traccia.</p>
   <p><i>Serve ogni volta che la parte libera è risolubile e l&rsquo;interazione è piccola</i>, perché isola la dipendenza temporale «difficile» in un unico posto — ed è la base su cui si costruisce la teoria delle perturbazioni dipendenti dal tempo, che il programma di questo corso non chiede.</p>`},
   {label:'3.12 — due sistemi che non si parlano', body:R`
   <p>Con $H=H_1\otimes I+I\otimes H_2$ i due addendi <b>commutano fra loro</b>, perché ciascuno agisce come identità sul fattore in cui l&rsquo;altro agisce: $(H_1\otimes I)(I\otimes H_2)=H_1\otimes H_2=(I\otimes H_2)(H_1\otimes I)$. Per operatori che commutano l&rsquo;esponenziale della somma è il prodotto degli esponenziali, dunque</p>
   $$U(t)=e^{-itH_1/\hbar}\otimes e^{-itH_2/\hbar}.$$
   <p>La conseguenza fisica è quella che conta: <b>uno stato inizialmente fattorizzato resta fattorizzato per sempre</b>, perché $U_1\otimes U_2$ applicato a $|\psi\rangle\otimes|\varphi\rangle$ dà $U_1|\psi\rangle\otimes U_2|\varphi\rangle$. <i>L&rsquo;entanglement non può nascere senza interazione</i>, e il «senza interazione» ha qui il significato tecnico preciso che l&rsquo;hamiltoniana sia una somma di quel tipo. Il rovescio è il motivo per cui l&rsquo;entanglement è ubiquo: basta un termine $H_{12}$ qualunque, per piccolo che sia, e la fattorizzazione si perde.</p>`}
   ],
   nota:R`<p><b>I problemi del capitolo che questo movimento non svolge, e perché.</b> Il 3.1 (generatore delle dilatazioni), il 3.2 (multipli dell&rsquo;identità e identità di Jacobi), il 3.3 e il 3.4 (sviluppo di $e^{xA}Be^{-xA}$ e Baker-Campbell-Hausdorff), il 3.5 (identità di Leibniz per i commutatori), il 3.6 ($\mathbf Q\times\mathbf P$ come generatore delle rotazioni), il 3.7 (il boost a tempo $t$) e il 3.11 (traccia del prodotto di Kronecker) riguardano la <i>cinematica</i> delle simmetrie e non la dinamica: sono il contenuto di un altro lavoro, dove l&rsquo;algebra dei dieci generatori viene costruita.</p>`},
  {t:'prosa', title:'Il senso, e le rotte: dove questo riappare in fisica', tag:'architettura', html:R`
  <p>La struttura costruita qui — un generatore, un&rsquo;evoluzione unitaria, due descrizioni equivalenti, una distribuzione spettrale che decide la forma del moto — non resta in meccanica quantistica. Vale indicare dove la si ritrova, perché sono rotte e non curiosità.</p>
  <p><b>La teoria quantistica dei campi.</b> Il quadro di interazione del problema 3.10, che qui è un esercizio, è <i>il</i> formalismo con cui si calcola in teoria dei campi: la serie di Dyson per $U_I(t)$ e i diagrammi di Feynman sono il suo sviluppo perturbativo. Dirac lo anticipa nel capitolo sull&rsquo;elettrodinamica, dove dice che «<i>per stabilire l&rsquo;invarianza per trasformazioni di Lorentz di una teoria quantistica dei campi, lo schema di Heisenberg è il più adatto</i>» mentre «<i>per risolvere particolari problemi, sarà ancora necessario lo schema di Schrödinger</i>». <b>La scelta fra i due quadri, che qui sembra una questione di comodità, là diventa la scelta fra manifesta covarianza e calcolabilità.</b></p>
  <p><b>La risonanza magnetica, e il controllo quantistico.</b> La tappa 10 è, letteralmente, la teoria della risonanza magnetica nucleare: gli impulsi $\pi/2$ e $\pi$ con cui si manipolano gli spin in una macchina di risonanza sono scelte del prodotto $\omega_1T$. La stessa matematica governa i qubit — un&rsquo;operazione logica su un qubit <i>è</i> una rotazione di Rabi — e la fedeltà di una porta quantistica si degrada esattamente per i motivi che la curva di risonanza mostra.</p>
  <p><b>La decoerenza e il problema della misura.</b> Il problema 3.9 dimostra che l&rsquo;evoluzione unitaria conserva la purezza, quindi non può produrre il collasso. Il problema 3.12 dice che l&rsquo;entanglement richiede interazione. Mettendo insieme i due si ottiene il programma della teoria della decoerenza: un sistema che interagisce con un ambiente si <i>entangla</i> con esso, e lo stato ridotto del solo sistema — ottenuto tracciando via l&rsquo;ambiente — diventa una miscela pur restando il tutto in uno stato puro. <i>La purezza non si distrugge: si nasconde nelle correlazioni</i>, e la tappa 08 sul limite classico è il primo passo di quella stessa strada.</p>
  <p><b>La fisica delle risonanze.</b> La lorentziana della tappa 09 è il profilo di ogni risonanza in fisica delle particelle: una particella instabile <i>è</i> un polo nel piano complesso dell&rsquo;energia, e la sua massa e la sua larghezza sono parte reale e parte immaginaria di quel polo. Misurare la larghezza di una risonanza al collisore e misurare la vita media di un decadimento sono la stessa misura, legate da $\Gamma\tau=\hbar$.</p>
  <p><b>E la domanda che resta aperta.</b> Tutto questo movimento descrive un&rsquo;evoluzione reversibile: $U$ è invertibile, l&rsquo;informazione non si perde, la purezza si conserva, e nessuna freccia del tempo compare da nessuna parte. Eppure i sistemi decadono, i pacchetti si allargano, le medie si smorzano. <i>Nessuno di questi fenomeni è irreversibile nelle equazioni</i> — lo diventa quando si media su un insieme, o si traccia via un ambiente, o si rinuncia a seguire le fasi. <b>La freccia del tempo non è nella dinamica che questo movimento ha costruito</b>, ed è la stessa situazione della meccanica statistica classica: la domanda su dove sia è una delle poche che attraversano tutta la fisica senza una risposta che metta tutti d&rsquo;accordo.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Il bilancio dice che la sola ipotesi con contenuto empirico è $K=-H/\hbar$. Ma anche l&rsquo;unitarietà sembra un&rsquo;ipotesi fisica: perché non conta?`,
    a:R`Perché non è un&rsquo;ipotesi sulla <i>natura</i>, è un&rsquo;ipotesi su che cosa sia una probabilità. Richiedere che $U$ sia unitario equivale a richiedere che la somma delle probabilità resti uno, cioè che il sistema continui a esistere e a trovarsi in <b>qualche</b> stato — che non è un fatto sperimentale sul mondo ma la condizione perché il formalismo descriva una distribuzione di probabilità. La prova che sia così è che Ballentine la <i>deduce</i> dall&rsquo;hermiticità di $H$, e l&rsquo;hermiticità a sua volta è la condizione perché gli autovalori siano reali, cioè perché le energie siano numeri misurabili. <i>La catena «le probabilità sommano a uno → $H$ hermitiana → $U$ unitaria» non tocca mai un fatto contingente.</i> L&rsquo;identificazione $K=-H/\hbar$ invece sì: dice <b>quale</b> operatore, fra tutti gli autoaggiunti possibili, genera il tempo per un dato sistema fisico, ed è l&rsquo;unico punto in cui bisogna guardare il mondo.`},
   {q:R`Se l&rsquo;evoluzione è unitaria e reversibile, in che senso si può dire che il decadimento di un nucleo è un processo irreversibile?`,
    a:R`Nel senso che <i>praticamente</i> non si inverte, non nel senso che le equazioni lo vietino. L&rsquo;identità di Ballentine della tappa 09 — $A(t+t')=A(t)A(t')+\langle\Psi_u|e^{-iHt'/\hbar}|\Phi(t)\rangle$ — dice esplicitamente che l&rsquo;ampiezza dello stato non decaduto <b>viene parzialmente rigenerata</b>, cioè che una parte del processo torna indietro. La rigenerazione è piccola perché i prodotti di decadimento si allontanano e la loro sovrapposizione con lo stato iniziale diventa minuscola, ma non è mai esattamente nulla — ed è proprio quel residuo a produrre la coda non esponenziale di Khalfin. <b>L&rsquo;irreversibilità è una proprietà dello stato e del numero di gradi di libertà, non dell&rsquo;equazione del moto</b>: per invertire il decadimento bisognerebbe rimandare indietro tutti i prodotti con le fasi esatte, che è possibile in linea di principio e impossibile in laboratorio. <i>È la stessa risposta che la meccanica statistica dà alla domanda sul secondo principio</i>, e non è un caso che la struttura sia identica.`}
  ]}

var byId = {}; TAPPE.forEach(function(s){ byId[s.num]=s; });

var VKEY='pm-nucleomq-08-visited';
function loadSeen(){ try{ return new Set(JSON.parse(localStorage.getItem(VKEY)||'[]')); }catch(e){ return new Set(); } }
function saveSeen(s){ try{ localStorage.setItem(VKEY, JSON.stringify(Array.from(s))); }catch(e){} }
var SEEN = loadSeen();

function renderNav(active){
  var nav=document.getElementById('sidebar');
  nav.innerHTML='';
  var h=document.createElement('h2'); h.textContent='Nucleo mq-08 · le tappe'; nav.appendChild(h);
  TAPPE.forEach(function(s){
    var b=document.createElement('button');
    b.className='navitem'+(active===s.num?' active':'')+(SEEN.has(s.num)?' seen':'');
    b.innerHTML='<span class="dot"></span><span class="nx">'+s.num+'</span><span>'+s.title+'</span>';
    b.onclick=function(){ showTappa(s.num); };
    nav.appendChild(b);
  });
}

/* ---- renderer dei blocchi ---- */
function sectionProsa(title, tag, html){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var body=elFromHTML('<div class="open-body">'+html+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function sectionGram(title, rows){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag gramtag">grammatica</span></h3>';
  var inner='<table class="gramtab">';
  rows.forEach(function(r){ inner+='<tr><td class="gs">'+r[0]+'</td><td>'+r[1]+'</td></tr>'; });
  inner+='</table>';
  var body=elFromHTML('<div class="gramwrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
/* --- blocco PLOT: la figura non decora, si legge. Ogni plot porta una chiave di lettura. --- */
function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';
  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionSvelabile(title, tag, html, sol){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var c=document.createElement('div'); c.className='collaudo-item';
  var q=document.createElement('div'); q.className='cq'; q.innerHTML=html||'';
  c.appendChild(q); typeset(q);
  if(sol){
    var a=document.createElement('div'); a.className='ca'; a.style.display='none';
    a.innerHTML='<b>Soluzione.</b> '+sol;
    var btn=document.createElement('button'); btn.className='reveal-btn small';
    btn.textContent='Rivela la soluzione';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a);
      btn.disabled=true; btn.classList.add('done'); btn.textContent='Soluzione rivelata'; };
    c.appendChild(btn); c.appendChild(a);
  }
  wrap.appendChild(c); return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    /* DUE SCHEMI, NON UNO — scoperto il 2026-10-06 provando le pagine vive. I movimenti
       scritti per primi (em-01..03, me-10b, i collaudi di gd-01..09 e di quattro em)
       usano una forma piu' semplice: `reveal` e `prolessi` con un solo `html`,
       `esercizio` e `collaudo` con `html` + `sol`. Il renderer ne conosceva una sola e
       chiamava `steps.forEach` su `undefined`: TypeError, e la tappa si fermava li' —
       62 blocchi in 17 movimenti su 74. Non si riscrive il contenuto per far contento
       il renderer: e' il renderer che deve leggere cio' che c'e'.
       E in fondo un ramo che NON muore: uno schema nuovo di domani deve far vedere un
       avviso in quella sezione, non spegnere la pagina sotto di se'. */
    try{
      if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
      else if(b.t==='prolessi') m.appendChild(b.rotte ? sectionProlessi(b)
                                   : sectionProsa(b.title,'prolessi',b.html));
      else if(b.t==='reveal')m.appendChild(b.steps ? sectionReveal(b.title,b.tag,b.steps)
                                   : sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='esercizio') m.appendChild(b.steps ? sectionEsercizio(b)
                                   : sectionSvelabile(b.title,'esercizio',b.html,b.sol));
      else if(b.t==='collaudo')  m.appendChild(b.items ? sectionCollaudo(b.title,b.items)
                                   : sectionSvelabile(b.title,'provi, poi riveli',b.html,b.sol));
      else if(b.t==='plot')      m.appendChild(sectionPlot(b));
      else m.appendChild(sectionProsa(b.title||'(blocco)', 'tipo sconosciuto: '+b.t,
                                      b.html||''));
    }catch(err){
      var avv=document.createElement('section'); avv.className='section';
      avv.innerHTML='<h3>'+(b.title||'(blocco)')+'<span class="tag">non reso</span></h3>'
        +'<p style="color:#ff6b6b">Questo blocco non si &egrave; potuto rendere ('
        +b.t+': '+err.message+'). Il resto della tappa continua sotto.</p>';
      m.appendChild(avv);
    }
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* I POP-UP DEGLI STRUMENTI. `cablaStrumenti` esisteva dal 18-09 e non la chiamava
     nessuno: i 229 rimandi del percorso erano <span> senza handler, e il clic non
     faceva niente. Nessun controllo poteva vederlo — la sintassi era valida, le schede
     c'erano tutte, le formule rendevano: il guasto esisteva solo a pagina viva. Qui, e
     dopo ogni inserimento successivo, perche' la tappa si rimonta da capo a ogni
     cambio e gli handler vanno riattaccati al DOM nuovo. */
  cablaStrumenti(m);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}
