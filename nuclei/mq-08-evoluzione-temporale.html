    a:R`In nessun senso che corrisponda a una traiettoria, e questa è una delle cose che il formalismo dice con più chiarezza del linguaggio corrente. Nello stato fondamentale $\langle\hat{\mathbf p}\rangle=0$, $\langle\hat{\mathbf x}\rangle=0$, e la densità di probabilità è una funzione del tempo costante — <b>non c&rsquo;è niente che cambi</b>. Ciò che <i>non</i> è zero è $\langle\hat p^{2}\rangle$, cioè l&rsquo;energia cinetica media, che è positiva e sostanziale: lo stato ha una dispersione di impulso, non un impulso. La figura mentale corretta non è un elettrone fermo e nemmeno uno che orbita, ma una distribuzione stazionaria di probabilità con larghezza in posizione e in impulso legate dalla <span class="str" data-str="disuguaglianza-di-schwarz">disuguaglianza</span> di indeterminazione. <i>L&rsquo;energia cinetica di uno stato stazionario è il prezzo della localizzazione</i>, non la misura di un moto.`},
   {q:R`La dimostrazione del verso difficile divide per $C(t)$. È lecito? E se $C$ si annullasse a qualche istante?`,
    a:R`Non può annullarsi, e il motivo è l&rsquo;unitarietà. Se $C(t_1)=0$ per qualche $t_1$, allora $|A,t_1\rangle$ sarebbe il vettore nullo, che ha norma zero; ma l&rsquo;evoluzione conserva la norma, quindi avrebbe norma zero anche $|A,0\rangle$, che quindi non rappresenterebbe nessuno stato. <b>La divisione è lecita proprio perché $U$ è unitario</b>, e questo è un buon esempio di come un&rsquo;ipotesi apparentemente tecnica — l&rsquo;unitarietà — renda legittimo un passaggio algebrico molte pagine dopo. Vale la pena notare anche il contrario: in un modello con potenziale complesso, dove la norma non si conserva, $C(t)$ decresce esponenzialmente ma resta diverso da zero per ogni $t$ finito, e l&rsquo;argomento sopravvive — portando però a un «autovalore» $E$ complesso, che è esattamente il modo in cui si descrivono gli stati quasi-stazionari.`},
   {q:R`Picasso dice che un oscillatore in uno stato con soli $n$ pari ha periodo $T/2$, e che questo non ha analogo classico. Ma un oscillatore classico che parte dal centro con velocità nulla non si muove affatto. Non è quello il caso corrispondente?`,
    a:R`No, e la differenza è istruttiva. Lo stato con soli $n$ pari <b>non è fermo</b>: la sua funzione d&rsquo;onda cambia forma nel tempo, il suo $\langle\hat x^{2}\rangle$ oscilla, e semplicemente ritorna su sé stessa dopo $T/2$ invece che dopo $T$. L&rsquo;analogo classico di «ritorna dopo mezzo periodo» sarebbe una traiettoria che dopo mezzo periodo ripassa per lo stesso punto <i>con la stessa velocità</i>, e nello spazio delle fasi di un oscillatore armonico una traiettoria chiusa ha un solo periodo: non esiste. Il motivo profondo è che lo stato quantistico non è un punto dello spazio delle fasi ma una distribuzione, e una distribuzione <b>simmetrica rispetto all&rsquo;origine</b> torna in sé dopo mezza rotazione dello spazio delle fasi, perché la rotazione di $\pi$ è l&rsquo;inversione e la distribuzione è invariante per inversione. <i>Il periodo dimezzato è una proprietà della simmetria della distribuzione, e le traiettorie non hanno simmetrie di quel tipo perché sono punti.</i>`}
  ]}
]},

/* ---------------- 04 · LA RICETTA: SOLO LE FASI RELATIVE SI MUOVONO ---------------- */
{ num:'04', title:'Come si calcola davvero: sviluppare in autostati, e guardare solo le fasi relative', meta:'la formula che risolve tutto · perché le probabilità di energia sono congelate · frequenze di Bohr · tre esempi svolti per intero',
  blocchi:[
  {t:'prosa', title:'Perché questa tappa sta qui e non in appendice', tag:'architettura', html:R`
  <p>Questa è la tappa che l&rsquo;esame chiede. La misura su quarantasette scritti del corso dice che l&rsquo;evoluzione temporale compare in venticinque di essi con trentotto menzioni, e <i>quasi sempre nella stessa forma</i>: dato uno stato al tempo zero come combinazione di autostati dell&rsquo;energia, si calcoli il valore di aspettazione di un&rsquo;osservabile al tempo $t$.</p>
  <p>Mettere il mestiere in fondo, come esercizi applicativi, sarebbe la scelta sbagliata per una ragione precisa: <b>la ricetta non è una conseguenza tecnica della teoria, è la teoria vista da vicino</b>. Ciò che la rende meccanica è un solo fatto — nell&rsquo;evoluzione temporale si muovono soltanto le <i>fasi relative</i> fra componenti di energia diversa — e quel fatto è la stessa cosa che la tappa 03 ha dimostrato, letta su una sovrapposizione invece che su un autostato. Chi ha capito la 03 ha già in mano la 04; chi impara la ricetta senza la 03 sbaglia tutte le volte che la fase conta e non se ne accorge.</p>`},
  {t:'reveal', title:'La formula che risolve il problema, e le sue due letture', tag:'costruzione', steps:[
   {label:'Lo sviluppo, e la formula (9.14)', body:R`
   <p>Applicare direttamente $e^{-iHt/\hbar}$ a un vettore è, come dice Picasso, «<i>non molto agevole</i>». Il modo che funziona è un altro: si sviluppa lo stato iniziale nella base degli autovettori di $H$ e si lascia che l&rsquo;esponenziale agisca su ciascun termine, dove è un numero. Con spettro discreto,</p>
   $$|A,0\rangle=\sum_n a_n|E_n\rangle,\qquad a_n=\langle E_n|A,0\rangle,$$
   <p>e applicando l&rsquo;operatore di evoluzione termine a termine</p>
   $$|A,t\rangle=\sum_n a_n\,e^{-iE_nt/\hbar}|E_n\rangle.$$
   <p>Picasso ne trae la conseguenza di metodo: «<i>il problema di determinare l&rsquo;evoluzione temporale di uno stato è completamente risolto se conosciamo gli autovettori e autovalori della hamiltoniana $H$</i>», e da qui il ruolo privilegiato di $H$ fra tutte le osservabili. Con spettro continuo la somma diventa un integrale,</p>
   $$|A,t\rangle=\int\varphi(E)\,e^{-iEt/\hbar}|E\rangle\,dE,\qquad \varphi(E)=\langle E|A,0\rangle,$$
   <p>e per una particella libera, dove conviene etichettare gli autostati con l&rsquo;impulso invece che con l&rsquo;energia, si scrive $|A,t\rangle=\int\varphi(p)e^{-iE(p)t/\hbar}|p\rangle\,dp$ con $E(p)=p^{2}/2m$.</p>`},
   {label:'Prima lettura: le probabilità di energia sono congelate', body:R`
   <p>Il coefficiente $n$-esimo al tempo $t$ è $a_n e^{-iE_nt/\hbar}$, e il suo modulo quadro è</p>
   $$|a_n|^{2}=|\langle E_n|A,0\rangle|^{2},$$
   <p>identico a quello iniziale perché la fase ha modulo uno. <b>La distribuzione di probabilità dell&rsquo;energia non cambia mai</b>, qualunque sia lo stato e qualunque sia l&rsquo;hamiltoniana. Non è un caso particolare: è la conservazione dell&rsquo;energia nella sua forma quantistica più forte, che non riguarda il valor medio ma l&rsquo;intera distribuzione — ed è il caso $K=H$ del teorema che la tappa 07 dimostrerà in generale.</p>
   <p>La conseguenza operativa è immediata e sorprende sempre: se un esercizio chiede «qual è la probabilità di misurare l&rsquo;energia $E_2$ al tempo $t$?», <i>la risposta non dipende da $t$</i> e il conto si fa a $t=0$. Chi si mette a calcolare l&rsquo;evoluzione sta sprecando tempo.</p>`},
   {label:'Seconda lettura: l’unica cosa che si muove sono le fasi relative', body:R`
   <p>Se le probabilità di energia sono congelate, che cosa si muove? Le <b>fasi relative</b>. Il valor medio di un&rsquo;osservabile $\hat R$ sullo stato evoluto è</p>
   $$\langle R\rangle_t=\sum_{n,k}a_n^{*}a_k\,R_{nk}\,e^{-i(E_k-E_n)t/\hbar},\qquad R_{nk}=\langle E_n|\hat R|E_k\rangle,$$
   <p>e qui si legge tutto. I termini <b>diagonali</b> ($n=k$) hanno esponente nullo e danno un contributo costante, $\sum_n|a_n|^{2}R_{nn}$. I termini <b>fuori diagonale</b> oscillano con frequenze</p>
   $$\omega_{nk}=\frac{E_k-E_n}{\hbar}.$$
   <p>Quindi: <i>un valor medio dipende dal tempo se e solo se l&rsquo;osservabile ha elementi di matrice fuori diagonale fra due autostati dell&rsquo;energia entrambi popolati e con energie diverse</i>. Le tre condizioni sono congiuntive, e basta che una cada perché il valor medio sia costante.</p>
   <p>Questa è la ricetta completa, in quattro passi: <b>(1)</b> sviluppare lo stato iniziale in autostati di $H$; <b>(2)</b> appiccicare a ciascun coefficiente la sua fase $e^{-iE_nt/\hbar}$; <b>(3)</b> per un valor medio, scrivere la doppia somma e tenere solo le coppie con $R_{nk}\neq0$; <b>(4)</b> leggere le frequenze come differenze di energia diviso $\hbar$.</p>`},
   {label:'Le frequenze di Bohr, e la voce di Dirac', body:R`
   <p>Le $\omega_{nk}$ non sono una comodità di calcolo: sono le frequenze che si osservano negli spettri. Dirac ci arriva nello schema di Heisenberg, dove la stessa struttura compare come dipendenza temporale degli elementi di matrice, e ne dà l&rsquo;interpretazione fisica (pag. stampata 162):</p>
   <p><i>«La legge di variazione data dalla [29.5] risulta semplicemente periodica con frequenza data da [29.6] che dipende soltanto dalla differenza dell&rsquo;energia dei due stati stazionari a cui si riferisce l&rsquo;elemento di matrice. Questo risultato è strettamente connesso con la legge di combinazione spettroscopica e con la condizione di Bohr per le frequenze.»</i></p>
   <p>Vale soffermarsi sull&rsquo;espressione «legge di combinazione spettroscopica»: è la regola empirica di Rydberg e Ritz, scoperta trent&rsquo;anni prima della meccanica quantistica, secondo cui le frequenze delle righe di un atomo sono <i>differenze</i> di una lista di termini invece che multipli di una fondamentale. <b>Qui quella legge non è spiegata a posteriori: è una conseguenza algebrica della struttura $e^{-i(E_k-E_n)t/\hbar}$</b>, e non poteva essere altrimenti. È uno dei casi in cui il formalismo restituisce un fatto sperimentale senza che glielo si sia messo dentro.</p>`}
  ]},
  {t:'reveal', title:'Primo esempio svolto: due livelli, e quando la fase conta', tag:'esempio', steps:[
   {label:'Il conto generale', body:R`
   <p>Il caso più piccolo contiene già tutto. Si prendano due autostati dell&rsquo;energia $|E_1\rangle$ e $|E_2\rangle$ e lo stato iniziale</p>
   $$|A,0\rangle=\frac{|E_1\rangle+|E_2\rangle}{\sqrt2}.$$
   <p>Sia $\hat R$ un&rsquo;osservabile con $R_{11}=R_{22}=0$ e $R_{12}=R_{21}=r$ reale — cioè puramente fuori diagonale, come lo è $\hat x$ fra due stati di parità opposta. La doppia somma ha solo due termini:</p>
   $$\langle R\rangle_t=\tfrac12\Big(r\,e^{-i(E_2-E_1)t/\hbar}+r\,e^{+i(E_2-E_1)t/\hbar}\Big)=r\cos\frac{(E_2-E_1)t}{\hbar}.$$
   <p><b>Il valor medio oscilla con ampiezza $r$ e frequenza di Bohr $\omega_{21}$</b>, e parte dal valore massimo perché i due coefficienti sono in fase a $t=0$.</p>
   <p>Si cambi ora una cosa sola: lo stato iniziale diventi $(|E_1\rangle+i|E_2\rangle)/\sqrt2$, che ha le stesse probabilità di energia. Il prodotto $a_1^{*}a_2$ vale ora $i/2$ invece di $1/2$, e ripetendo il conto si ottiene $\langle R\rangle_t=-r\sin\omega_{21}t$: la stessa oscillazione, sfasata di un quarto di periodo, che a $t=0$ parte da zero. <i>Due stati con la stessa distribuzione di energia e fasi relative diverse sono stati fisicamente diversi</i>, e questa è la risposta alla domanda «quando la fase conta».</p>`},
   {label:'La regola in forma utilizzabile', body:R`
   <p>Conviene fissarla, perché è il discrimine che gli esercizi mettono alla prova:</p>
   <p><b>La fase globale non conta mai. La fase relativa conta sempre, tranne quando l&rsquo;osservabile è diagonale.</b></p>
   <p>Moltiplicare tutto lo stato per $e^{i\theta}$ non cambia nessun valor medio, perché $\theta$ compare in $a_n^{*}a_k$ due volte con segni opposti. Moltiplicare <i>un solo</i> coefficiente per $e^{i\theta}$ cambia la fase di tutti i termini fuori diagonale che lo contengono, quindi cambia $\langle R\rangle_t$ per ogni $\hat R$ non diagonale — ma non cambia nulla per un&rsquo;osservabile che commuta con $H$ e ha quindi, nella base comune, solo elementi diagonali. <i>Le osservabili compatibili con l&rsquo;energia sono cieche alle fasi relative</i>, e sono esattamente le costanti del moto della tappa 07. Le due affermazioni sono la stessa.</p>`}
  ]},
  {t:'reveal', title:'Secondo esempio: la particella nella buca, con i numeri', tag:'esempio', steps:[
   {label:'Lo stato, e gli elementi di matrice della posizione', body:R`
   <p>Si prenda una particella confinata in $[0,L]$ da pareti impenetrabili, con</p>
   $$\psi_n(x)=\sqrt{\frac{2}{L}}\sin\frac{n\pi x}{L},\qquad E_n=\frac{n^{2}\pi^{2}\hbar^{2}}{2mL^{2}},$$
   <p>e lo stato iniziale $\psi(x,0)=(\psi_1+\psi_2)/\sqrt2$. L&rsquo;osservabile sia la posizione. Servono tre integrali, e due si fanno per simmetria. I diagonali danno il centro della buca:</p>
   $$\frac{2}{L}\int_0^{L}x\sin^{2}\frac{\pi x}{L}\,dx=\frac{L}{2},$$
   <p>e lo stesso vale per $\psi_2$, perché $|\psi_n|^{2}$ è simmetrica rispetto al centro per ogni $n$. L&rsquo;elemento fuori diagonale richiede il conto, e si fa con la formula di Werner $\sin A\sin B=\tfrac12[\cos(A-B)-\cos(A+B)]$ seguita da due integrazioni per parti:</p>
   $$\frac{2}{L}\int_0^{L}x\sin\frac{\pi x}{L}\sin\frac{2\pi x}{L}\,dx=-\frac{16L}{9\pi^{2}}.$$
   <p>Il conto intermedio, che serve per entrambi i coseni, è</p>
   $$\int_0^{L}x\cos\frac{n\pi x}{L}\,dx=\Big(\frac{L}{n\pi}\Big)^{2}\big[(-1)^{n}-1\big]=-\frac{2L^{2}}{\pi^{2}n^{2}}\ \ (n\ \text{dispari}),$$
   <p>cioè $-2L^{2}/\pi^{2}$ per $n=1$ e $-2L^{2}/9\pi^{2}$ per $n=3$ — e si noti che per $n$ pari l&rsquo;integrale si annulla, il che è il motivo per cui qui compaiono solo i due dispari. La loro semidifferenza, moltiplicata per $2/L$, dà il risultato. <i>Il segno negativo non è un dettaglio</i>: dice da che parte della buca si trova il pacchetto all&rsquo;istante iniziale.</p>`},
   {label:'Il risultato, e la frequenza', body:R`
   <p>Mettendo insieme, con $a_1=a_2=1/\sqrt2$ e $\langle1|\hat x|2\rangle$ reale,</p>
   $$\langle x\rangle_t=\frac{L}{2}-\frac{16L}{9\pi^{2}}\cos\omega_{21}t,$$
   <p>dove la frequenza è la differenza delle due energie diviso $\hbar$:</p>
   $$\omega_{21}=\frac{E_2-E_1}{\hbar}=\frac{3\pi^{2}\hbar}{2mL^{2}}.$$
   <p>L&rsquo;ampiezza dell&rsquo;oscillazione, in unità della lunghezza della buca, è</p>
   $$\frac{16}{9\pi^{2}}\simeq0{,}180,$$
   <p>quindi il baricentro della distribuzione oscilla fra $0{,}32\,L$ e $0{,}68\,L$: <b>sta sempre nel terzo centrale della buca e non arriva mai vicino alle pareti</b>, pur essendo la particella descritta da una funzione d&rsquo;onda che si estende su tutto l&rsquo;intervallo. È un buon promemoria del fatto che $\langle x\rangle$ è un baricentro di probabilità e non una posizione.</p>
   <p>Si noti anche che l&rsquo;oscillazione è <i>sinusoidale pura</i>, con una sola frequenza, perché gli stati accesi sono due. Con tre stati accesi comparirebbero tre frequenze — $\omega_{21}$, $\omega_{31}$ e $\omega_{32}$ — e il moto non sarebbe più sinusoidale; sarebbe comunque periodico, perché per la buca le energie stanno in rapporto intero, ma per un potenziale generico non lo sarebbe affatto.</p>`}
  ]},
  {t:'plot', title:'Il baricentro che oscilla, e la densità che lo produce',
   intro:R`<p>A sinistra, $\langle x\rangle_t/L=\tfrac12-\tfrac{16}{9\pi^{2}}\cos\omega_{21}t$ in funzione di $\omega_{21}t$, con le due linee orizzontali ai valori estremi $0{,}32$ e $0{,}68$. A destra, la densità $|\psi(x,t)|^{2}$ per la sovrapposizione $(\psi_1+\psi_2)/\sqrt2$ in tre istanti: $\omega_{21}t=0$ (coefficienti in fase), $\pi/2$ e $\pi$ (in opposizione), con $L=1$.</p>`,
   plots:[{kind:'func2d', xr:[0,12.6], yr:[0.25,0.75], height:250, ticks:true,
     title:'⟨x⟩/L in funzione di ω₂₁t',
     curves:[{f:'0.5-0.18*Math.cos(x)', col:'#5aa9ff', width:2.4, label:'⟨x⟩/L'},
             {f:'0.68', col:'#8aa0b8', width:1.2, dash:true, label:'0,68'},
             {f:'0.32', col:'#8aa0b8', width:1.2, dash:true, label:'0,32'},
             {f:'0.5', col:'#6bdc9b', width:1.2, dash:true, label:'centro della buca'}],
     xlabel:'ω₂₁t', ylabel:'⟨x⟩/L'},
    {kind:'func2d', xr:[0,1], yr:[0,2.6], height:250, ticks:true,
     title:'|ψ(x,t)|² in tre istanti',
     curves:[{f:'Math.pow(Math.sin(Math.PI*x)+Math.sin(2*Math.PI*x),2)', col:'#5aa9ff', width:2.4, label:'ω₂₁t = 0'},
             {f:'Math.pow(Math.sin(Math.PI*x),2)+Math.pow(Math.sin(2*Math.PI*x),2)', col:'#ffc24a', width:2.2, label:'ω₂₁t = π/2'},
             {f:'Math.pow(Math.sin(Math.PI*x)-Math.sin(2*Math.PI*x),2)', col:'#ff6b8a', width:2.4, label:'ω₂₁t = π'}],
     xlabel:'x/L', ylabel:'L|ψ|²'}],
   leggi:R`<p><b>Che cosa guardare.</b> A sinistra la curva è un coseno rovesciato che parte dal minimo: a $t=0$ il baricentro è a sinistra del centro, come il segno negativo dell&rsquo;elemento di matrice prevedeva. A destra, le tre densità hanno tutte lo stesso integrale — la norma si conserva — ma forme diverse: la blu è schiacciata sulla sinistra, la rossa sulla destra, e la gialla è simmetrica. La gialla è esattamente la somma dei due moduli quadri senza termine di interferenza, perché a un quarto di periodo le due componenti sono in quadratura e il termine incrociato, che è la parte reale del prodotto, si annulla.</p>
   <p><b>Che cosa impararne.</b> Il moto del baricentro <i>è</i> il battimento fra due componenti, e la gobba che si sposta da sinistra a destra è il termine di interferenza che cambia segno. Si legga la curva gialla come il caso di riferimento: <b>quello è l&rsquo;aspetto che avrebbe la densità se le due componenti non interferissero</b>, cioè se si trattasse di una miscela statistica di due stati invece che di una sovrapposizione coerente. La differenza fra le tre curve è la differenza fra sovrapposizione e miscela, e la miscela corrisponde al caso in cui la fase relativa non esiste — ed è, non per caso, l&rsquo;unico caso in cui il baricentro non si muove.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Nell&rsquo;esempio della buca, si cambi lo stato iniziale in $(\psi_1+\psi_3)/\sqrt2$. Il baricentro oscilla ancora?`,
    a:R`<b>No, resta fermo in $L/2$.</b> La ragione è di simmetria, e si vede senza fare l&rsquo;integrale: rispetto al centro della buca $\psi_1$ e $\psi_3$ hanno la <i>stessa</i> parità (entrambe simmetriche rispetto a $x=L/2$), mentre $\psi_2$ è antisimmetrica. L&rsquo;elemento di matrice $\langle1|\hat x|3\rangle$ è l&rsquo;integrale del prodotto di due funzioni simmetriche per la coordinata misurata dal centro, che è antisimmetrica: l&rsquo;integrando è antisimmetrico e l&rsquo;integrale si annulla. <i>La regola generale è che $\hat x$ connette solo stati di parità opposta</i>, cioè stati con $n$ di parità diversa, e questa è la regola di selezione di dipolo elettrico nella sua forma più nuda. Si noti la lezione di metodo: nella ricetta in quattro passi, il passo 3 — «tenere solo le coppie con $R_{nk}\neq0$» — spesso si risolve con un argomento di simmetria e non con un integrale.`},
   {q:R`Un esercizio chiede $\langle\hat H\rangle_t$ per uno stato qualunque. Si deve fare la doppia somma?`,
    a:R`No, e riconoscerlo vale qualche minuto in uno scritto. $\hat H$ è diagonale nella sua stessa base: $H_{nk}=E_n\delta_{nk}$, quindi la doppia somma collassa sulla diagonale e tutti gli esponenziali diventano $e^{0}=1$. Il risultato è $\langle H\rangle_t=\sum_n|a_n|^{2}E_n$, <b>costante e calcolabile a $t=0$</b>. È la conservazione dell&rsquo;energia, e in questo formalismo è un&rsquo;identità banale invece che un teorema — il che è il segno che si sta usando la base giusta. <i>La stessa cosa vale per qualunque funzione di $\hat H$</i>, e più in generale per ogni osservabile che commuti con $H$: lì la base comune esiste, la matrice è diagonale a blocchi, e gli unici termini fuori diagonale sopravvissuti connettono stati <b>degeneri</b>, per i quali $E_k-E_n=0$ e la fase è comunque uno.`},
   {q:R`La distribuzione di probabilità dell&rsquo;energia è congelata. Come si concilia questo con un atomo eccitato che decade emettendo un fotone di energia ben precisa?`,
    a:R`Il punto è che l&rsquo;atomo da solo <b>non è il sistema</b>. Il teorema vale per un sistema chiuso con hamiltoniana data, e lì la distribuzione di $H$ non si muove mai. Un atomo che decade è accoppiato al campo elettromagnetico, e l&rsquo;hamiltoniana del sistema completo è $H_{\text{atomo}}+H_{\text{campo}}+H_{\text{interazione}}$: la distribuzione di <i>quella</i> è congelata, ed è la conservazione dell&rsquo;energia totale che si osserva nella riga spettrale. Ciò che si muove è la distribuzione di $H_{\text{atomo}}$ da solo, che non commuta con l&rsquo;hamiltoniana completa e quindi non è una costante del moto. <i>Il teorema non vieta i decadimenti: vieta che l&rsquo;energia totale cambi.</i> La tappa 09 riprende il filo e mostra che proprio da questa struttura segue che il decadimento non può essere esattamente esponenziale.`}
  ]}
]},

/* ---------------- 05 · LO SCHEMA DI HEISENBERG ---------------- */
{ num:'05', title:'Lo schema di Heisenberg: spostare il moto dagli stati alle osservabili', meta:'la costruzione di Dirac come movimento dello spazio dei ket · la ciclicità della traccia in Ballentine · l’equazione di Heisenberg · e il divieto di mescolare',
  blocchi:[
  {t:'prosa', title:'Il problema, e perché la risposta è «entrambe le cose»', tag:'architettura', html:R`
  <p>Il valor medio di un&rsquo;osservabile, che è l&rsquo;unica cosa che si misura, contiene l&rsquo;operatore di evoluzione due volte:</p>
  $$\langle R\rangle_t=\langle A,0|\,U^{\dagger}(t)\,\hat R\,U(t)\,|A,0\rangle.$$
  <p>Picasso lo mette nel modo più diretto possibile: ci sono «<i>le due possibilità equivalenti di scaricare l&rsquo;operatore di evoluzione temporale $U(t)$ sui vettori di stato</i>» — e allora $\langle R\rangle_t=\langle A,t|\hat R|A,t\rangle$, che è lo schema di Schrödinger — «<i>oppure di scaricare $U(t)$ e $U(t)^{\dagger}$ sulle osservabili</i>», e allora $\langle R\rangle_t=\langle A,0|\hat R(t)|A,0\rangle$, che è lo schema di Heisenberg.</p>
  <p>Non è una ridefinizione cosmetica, ed è il motivo per cui questa tappa non si può saltare: <b>nello schema di Heisenberg le equazioni del moto sono le stesse della meccanica classica</b>, e quel fatto — che Dirac usa come argomento per identificare $H$ con l&rsquo;energia — è la giuntura fra le due teorie. Chi lavora solo in Schrödinger ha un&rsquo;equazione d&rsquo;onda che non somiglia a niente di classico; chi passa a Heisenberg ritrova le equazioni di Hamilton, scritte per operatori.</p>`},
  {t:'reveal', title:'La costruzione di Dirac: una trasformazione unitaria che mette i ket in quiete', tag:'costruzione', steps:[
   {label:'L’idea, nella sua immagine', body:R`
   <p>Dirac non definisce lo schema di Heisenberg per decreto: lo <i>costruisce</i>, applicando a tutto lo spazio dei ket una trasformazione unitaria che dipende dal tempo. Sia $T$ l&rsquo;operatore di evoluzione (la sua notazione); si trasforma ogni ket secondo $|a^{*}\rangle=T^{-1}|a\rangle$. L&rsquo;immagine che ne dà è precisa e vale citarla (pag. stampata 154):</p>
   <p><i>«Essa va pertanto immaginata come l&rsquo;applicazione di un movimento continuo (consistente di rotazioni e di deformazioni uniformi) all&rsquo;intero spazio dei vettori ket.»</i></p>
   <p>L&rsquo;effetto è quello voluto: un ket che si muoveva secondo l&rsquo;equazione di Schrödinger diventa, sotto questa trasformazione, un ket fermo. Nelle sue parole, «<i>la trasformazione riduce alla quiete i ket corrispondenti a stati di moto indisturbato</i>». <b>Lo spazio si muove insieme agli stati, e rispetto allo spazio in movimento gli stati sono fermi</b>; è esattamente il passaggio a un sistema di riferimento solidale, trasportato nello spazio di Hilbert.</p>
   <p>Ma una trasformazione unitaria va applicata a <i>tutto</i>, altrimenti le relazioni fra le quantità non restano invarianti: anche ai bra e agli operatori. Un operatore si trasforma per coniugazione, $\hat v_t=T^{-1}\hat vT$, e qui sta il prezzo da pagare: «<i>Un operatore lineare in quiete si trasforma in generale in un operatore lineare in movimento</i>». Siccome una variabile dinamica non dipende dal tempo nello schema di Schrödinger, dopo la trasformazione ne dipende.</p>`},
   {label:'La frase che dice che cosa sia davvero la scelta', body:R`
   <p>Dirac riassume la situazione in una frase che vale più di una pagina di formalismo (pag. 155):</p>
   <p><i>«La condizione fisica del sistema dinamico a un istante qualunque si traduce in una relazione determinata tra le variabili dinamiche e lo stato; una variazione delle condizioni fisiche nel tempo può essere imputata sia a un cambiamento dello stato, rimanendo in quiete le variabili dinamiche, il che ci fornisce lo schema di Schrödinger, sia a un cambiamento delle variabili dinamiche, rimanendo in quiete lo stato, il che ci fornisce lo schema di Heisenberg.»</i></p>
   <p>Il punto da portarsi via è nella prima riga, non nelle due alternative: <b>ciò che è fisico è la <i>relazione</i> fra stato e variabili dinamiche</b>, e attribuire il cambiamento all&rsquo;uno o alle altre è una scelta di descrizione, come scegliere se far ruotare il vettore o gli assi.</p>`},
   {label:'L’equazione del moto di Heisenberg, derivata', body:R`
   <p>Si parte dalla definizione, scritta senza inverso: $T\hat v_t=\hat vT$. Derivando rispetto a $t$ ed usando l&rsquo;equazione differenziale di $T$ si ottiene, nella notazione moderna,</p>
   $$\frac{d\hat R_H(t)}{dt}=\frac{i}{\hbar}\big[H_H(t),\hat R_H(t)\big],$$
   <p>dove $H_H=U^{\dagger}HU$. Picasso la ricava dallo stesso conto, con l&rsquo;avvertenza che è la fonte dell&rsquo;errore più comune in questa tappa: «<i>attenzione all&rsquo;ordine degli operatori!</i>». E osserva che per un&rsquo;hamiltoniana indipendente dal tempo $H$ commuta con $U(t)$ e con $U^{\dagger}(t)$, quindi $H_H=H$ e l&rsquo;indice si può omettere.</p>
   <p>La forma generale, che tiene conto anche di un operatore con dipendenza temporale propria, è quella di Ballentine:</p>
   $$\frac{dR_H(t)}{dt}=\frac{i}{\hbar}\big[H_H(t),R_H(t)\big]+\Big(\frac{\partial R}{\partial t}\Big)_H,$$
   <p>dove l&rsquo;ultimo termine, dice, «<i>occurs only if the operator $R$ has an intrinsic time dependence</i>» — il caso di un potenziale esterno variabile, o di una componente di un tensore definita rispetto a un sistema di coordinate in moto. <b>Va distinto con cura dalla dipendenza temporale acquisita per coniugazione</b>: la prima c&rsquo;è anche in Schrödinger, la seconda no.</p>`},
   {label:'L’analogia classica, e l’argomento di Dirac su che cosa sia H', body:R`
   <p>Picasso dichiara il risultato senza mezzi termini: <i>«le equazioni di Heisenberg sono formalmente identiche alle equazioni del moto classiche»</i>, con il commutatore diviso $i\hbar$ al posto della <span class="str" data-str="parentesi-di-poisson">parentesi di Poisson</span>. Le differenze sono due e lui le classifica: una «sostanziale» — le classiche sono equazioni per funzioni numeriche, queste per operatori — e una «meno sostanziale», l&rsquo;ordinamento dei fattori.</p>
   <p>Dirac fa della stessa identità un uso più forte, e vale seguirlo perché risponde a una domanda che altrimenti resta aperta: <i>perché l&rsquo;operatore che genera il tempo dovrebbe essere l&rsquo;energia?</i> La sua risposta non è un postulato ma un argomento (pag. 157):</p>
   <p><i>«Si ottiene così un&rsquo;analogia fra le equazioni di moto classiche in forma hamiltoniana e le equazioni di moto quantistiche nella forma di Heisenberg. Quest&rsquo;analogia fornisce una giustificazione all&rsquo;ipotesi che l&rsquo;operatore lineare $H$ introdotto nel paragrafo precedente rappresenti in meccanica quantistica l&rsquo;energia del sistema.»</i></p>
   <p>E ne trae la definizione di che cosa voglia dire «dare un sistema dinamico»: in meccanica classica basta la hamiltoniana in funzione di coordinate e momenti; in meccanica quantistica, dice, «<i>un sistema dinamico è matematicamente definito quando sia data la sua energia in funzione di variabili dinamiche le cui relazioni di commutazione siano note</i>». <b>Le relazioni di commutazione prendono il posto della struttura canonica</b>, ed è l&rsquo;unica cosa che bisogna aggiungere all&rsquo;espressione dell&rsquo;energia per avere una teoria.</p>
   <p>Dirac mette anche il limite dell&rsquo;analogia, in una nota a piè di pagina che val la pena conoscere perché è una trappola reale: l&rsquo;ipotesi che la hamiltoniana quantistica sia la stessa funzione di quella classica «<i>porta a risultati utili solo quando sia applicata al caso in cui le coordinate dinamiche e i momenti coniugati si riferiscono a un sistema di assi cartesiani, e non a coordinate curvilinee più generali</i>». <i>In coordinate sferiche il momento coniugato al raggio non è $-i\hbar\,\partial/\partial r$</i>, e chi lo assume sbaglia.</p>`}
  ]},
  {t:'reveal', title:'La costruzione di Ballentine: i due quadri escono dalla ciclicità della traccia', tag:'costruzione', steps:[
   {label:'Un’espressione, due raggruppamenti', body:R`
   <p>Ballentine arriva agli stessi due schemi per una strada che li rende <i>simultaneamente</i> visibili, e vale conoscerla perché chiarisce in che senso sono equivalenti. Il valor medio di un&rsquo;osservabile su uno stato descritto dall&rsquo;operatore di stato $\rho$ è $\langle R\rangle_t=\mathrm{Tr}\lbrace\rho(t)R\rbrace$, e sostituendo l&rsquo;evoluzione $\rho(t)=U\rho_0U^{\dagger}$ si ottiene un prodotto di quattro operatori sotto traccia. Usando l&rsquo;invarianza della <span class="str" data-str="traccia">traccia</span> per permutazione ciclica,</p>
   $$\mathrm{Tr}\{U\rho_0U^{\dagger}R\}=\mathrm{Tr}\{\rho_0U^{\dagger}RU\}.$$
   <p>A sinistra i primi tre fattori sono l&rsquo;operatore di stato al tempo $t$: è lo schema di Schrödinger. A destra gli ultimi tre sono l&rsquo;operatore di Heisenberg</p>
   $$R_H(t)=U^{\dagger}(t,t_0)\,R\,U(t,t_0).$$
   <p><b>È la stessa espressione, raggruppata in due modi.</b> La formulazione di Ballentine ha un vantaggio concreto su quella di Picasso e Dirac: non richiede che lo stato sia puro, perché $\rho$ può essere un operatore di stato generico, e quindi copre anche le miscele statistiche.</p>`},
   {label:'Perché i segni dei commutatori sono opposti, e il divieto', body:R`
   <p>Le due equazioni del moto hanno segni opposti nel commutatore:</p>
   $$\frac{d\rho(t)}{dt}=-\frac{i}{\hbar}\big[H,\rho(t)\big],\qquad \frac{dR_H(t)}{dt}=+\frac{i}{\hbar}\big[H,R_H(t)\big],$$
   <p>e Ballentine spiega perché in una riga che chiude la questione: «<i>It makes no difference whether $\rho$ moves &ldquo;forward&rdquo; (Schrödinger picture) or $R$ moves &ldquo;backward&rdquo; (Heisenberg picture). It is the oppositeness of these two possible motions that is responsible for the difference of sign.</i>»</p>
   <p>E subito dopo l&rsquo;avvertenza, che è una regola operativa e non una raccomandazione di stile: «<i>It should be obvious that those two equations are mutually exclusive and will never be used together. One may use either the Schrödinger picture or the Heisenberg picture, but one must not combine parts of the two.</i>»</p>
   <p><b>Il modo tipico di violarla</b> è usare uno stato che evolve e, nello stesso conto, un operatore che evolve: si conta il moto due volte e si ottiene un&rsquo;oscillazione a frequenza doppia, o nulla. Il controllo per accorgersene è sempre lo stesso: in Heisenberg lo stato è $|A,0\rangle$ e non porta mai una $t$; in Schrödinger gli operatori non la portano mai, salvo dipendenza intrinseca.</p>`},
   {label:'Il controllo esplicito su uno spin, dove il conto si chiude', body:R`
   <p>Vale verificare su un caso dove tutto è calcolabile. Si prenda uno spin $1/2$ in campo magnetico costante lungo $z$, con $H=-\tfrac12\gamma\hbar B_0\sigma_z=-\tfrac12\hbar\omega_0\sigma_z$. L&rsquo;operatore di evoluzione è $U(t)=e^{-iHt/\hbar}=e^{i\omega_0t\sigma_z/2}$, e l&rsquo;operatore di Heisenberg corrispondente a $\sigma_x$ si calcola con l&rsquo;esponenziale delle <span class="str" data-str="matrici-di-pauli">matrici di Pauli</span>:</p>
   $$\sigma_x^{H}(t)=\sigma_x\cos\omega_0t+\sigma_y\sin\omega_0t.$$
   <p>Si legga che cosa dice: <b>l&rsquo;operatore che misura la componente $x$ dello spin, nello schema di Heisenberg, ruota nel piano $xy$ con velocità angolare $\omega_0$</b>. È la precessione, vista dalla parte delle osservabili invece che degli stati — e la tappa 10 la ritroverà dalla parte degli stati, con lo stesso risultato per i valori medi. La verifica che le due letture coincidano è il controllo più onesto dell&rsquo;equivalenza fra i quadri, perché i due conti non si somigliano affatto.</p>`}
  ]},
  {t:'gram', title:'I due schemi, affiancati', rows:[
   ['','schema di Schrödinger','schema di Heisenberg'],
   ['chi si muove','il vettore di stato (o $\\rho$)','gli operatori delle osservabili'],
   ['stato al tempo t','|A,t⟩ = U(t)|A,0⟩','|A,0⟩, fisso per sempre'],
   ['osservabile al tempo t','R, fissa','R_H(t) = U† R U'],
   ['equazione del moto','iħ d|A,t⟩/dt = H|A,t⟩','dR_H/dt = (i/ħ)[H, R_H]'],
   ['segno nel commutatore','meno (per $\\rho$)','più'],
   ['somiglianza classica','nessuna: è un’equazione d’onda','totale: sono le equazioni di Hamilton'],
   ['costante del moto','osservabile che commuta con $H$','osservabile che non dipende da $t$'],
   ['quando conviene','problemi concreti, spettri, probabilità','struttura, simmetrie, limite classico'],
   ['incognite da trovare','i coefficienti di un vettore','gli elementi di matrice di un operatore']
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Dirac dice che la forma di Schrödinger «è la più utile per problemi pratici». Perché, se le due sono equivalenti?`,
    a:R`Per un motivo di conteggio, e lui lo dice esplicitamente (pag. 160): le incognite dell&rsquo;equazione d&rsquo;onda «<i>sono i numeri che formano l&rsquo;insieme rappresentativo di un vettore ket</i>», mentre l&rsquo;equazione di Heisenberg, scritta in una rappresentazione, avrebbe come incognite «<i>i numeri che formano l&rsquo;insieme rappresentativo della variabile dinamica</i>». <b>Un vettore in uno spazio a $N$ dimensioni ha $N$ componenti; un operatore ne ha $N^{2}$.</b> Risolvere Heisenberg significa risolvere il quadrato delle equazioni, e per lo spettro continuo la differenza è fra una funzione di una variabile e una di due. Dirac aggiunge però il motivo per cui l&rsquo;altra forma resta indispensabile: «<i>è importante in quanto fornisce un&rsquo;analogia immediata con la meccanica classica e ci mette in grado di vedere in che modo le varie caratteristiche della teoria classica, quali le leggi di conservazione menzionate sopra, vengono trasferite nella meccanica quantistica</i>». <i>Una forma è per calcolare, l&rsquo;altra per capire</i>, e la tappa 06 userà la seconda proprio dove la prima sarebbe un disastro.`},
   {q:R`Nello schema di Heisenberg gli operatori dipendono dal tempo. Allora anche le loro relazioni di commutazione cambiano?`,
    a:R`<b>No, e il motivo è che la trasformazione è unitaria.</b> Se $A_H=U^{\dagger}AU$ e $B_H=U^{\dagger}BU$, allora $[A_H,B_H]=U^{\dagger}[A,B]U$, cioè il commutatore si trasforma come un operatore qualunque. In particolare, se $[A,B]=i\hbar$ — un multiplo dell&rsquo;identità — allora $[A_H,B_H]=U^{\dagger}(i\hbar)U=i\hbar$, <i>identico</i>, perché l&rsquo;identità commuta con tutto. Quindi $[\hat q(t),\hat p(t)]=i\hbar$ a ogni istante, con gli operatori <b>allo stesso tempo</b>. Dirac lo dice in forma generale: «<i>Poiché questa connessione è data da una trasformazione unitaria, tutte le relazioni algebriche e funzionali sono le stesse per ambedue i tipi di variabili dinamiche</i>». Attenzione però: i commutatori a <i>tempi diversi</i>, come $[\hat q(t_1),\hat q(t_2)]$, in generale <b>non</b> sono nulli e portano informazione dinamica vera — per la particella libera valgono $i\hbar(t_2-t_1)/m$, e sono il modo in cui la dinamica entra nell&rsquo;algebra.`}
  ]}
]},

/* ---------------- 06 · I CONTI IN HEISENBERG ---------------- */
{ num:'06', title:'I conti in Heisenberg: l’oscillatore integrato come in meccanica classica, e il pacchetto che si allarga', meta:'il trucco per calcolare i commutatori a tempo t · l’oscillatore in tre righe · la larghezza che è una parabola · tre numeri che decidono tutto',
  blocchi:[
  {t:'prosa', title:'Il problema circolare, e il modo di uscirne', tag:'architettura', html:R`
  <p>Le equazioni di Heisenberg per una particella con $H=\hat p^{2}/2m+V(\hat q)$ sono</p>
  $$\dot{\hat q}(t)=\frac{i}{\hbar}\big[H,\hat q(t)\big],\qquad \dot{\hat p}(t)=\frac{i}{\hbar}\big[H,\hat p(t)\big],$$
  <p>e Picasso pone subito la domanda che chiunque provi a usarle incontra: «<i>Come si fa a calcolare i commutatori fra $q(t)$, $p(t)$ ed $H$ se ancora non sappiamo come $q(t)$ e $p(t)$ si esprimono in termini di $q$ e $p$ (cioè se ancora non abbiamo risolto le equazioni del moto)?</i>»</p>
  <p>Il problema è reale: per scrivere l&rsquo;equazione differenziale sembra servire la sua soluzione. <b>La via d&rsquo;uscita è riportare tutto a $t=0$</b>, usando la forma dell&rsquo;equazione prima che si semplifichi.</p>`},
  {t:'reveal', title:'Il trucco, e le equazioni di Hamilton per operatori', tag:'costruzione', steps:[
   {label:'Riportare il commutatore all’istante zero', body:R`
   <p>Si scriva il commutatore con gli operatori di evoluzione in vista:</p>
   $$\big[H,\hat q(t)\big]=U^{\dagger}(t)\big[H,\hat q\big]U(t),$$
   <p>che vale perché $H$ commuta con $U$ e si possono inserire due coppie $UU^{\dagger}$. Ora il commutatore a destra è fra operatori <i>a tempo zero</i>, cioè fra oggetti noti, e si calcola in rappresentazione delle coordinate:</p>
   $$\big[H,\hat q\big]=-\frac{i\hbar}{m}\hat p.$$
   <p>Rimettendolo dentro e usando che la coniugazione di $\hat p$ dà $\hat p(t)$:</p>
   $$\big[H,\hat q(t)\big]=-\frac{i\hbar}{m}\,U^{\dagger}(t)\,\hat p\,U(t)=-\frac{i\hbar}{m}\hat p(t).$$
   <p>Lo stesso con l&rsquo;impulso, dove il contributo viene dal potenziale: $[H,\hat p]=[V(\hat q),\hat p]=i\hbar V'(\hat q)$, e coniugando, $[H,\hat p(t)]=i\hbar V'(\hat q(t))$.</p>
   <p><i>Il meccanismo è lo stesso che si è usato nella tappa precedente per i commutatori a tempo uguale</i>: una coniugazione unitaria non cambia le relazioni algebriche, quindi una relazione vera a $t=0$ resta vera a ogni $t$ purché tutti gli operatori che vi compaiono siano presi allo stesso istante.</p>`},
   {label:'Il risultato: le equazioni di Hamilton, per operatori', body:R`
   <p>Sostituendo nelle equazioni del moto si ottiene</p>
   $$\dot{\hat q}(t)=\frac{\hat p(t)}{m},\qquad \dot{\hat p}(t)=-V'\big(\hat q(t)\big),$$
   <p>che Picasso commenta: sono «<i>formalmente uguali alle equazioni classiche di Hamilton</i>». La seconda è la seconda legge di Newton, scritta per operatori.</p>
   <p><b>Vale fermarsi su quanto questo sia notevole.</b> Non si tratta di un limite, di un&rsquo;approssimazione o di una corrispondenza euristica: le equazioni della meccanica quantistica, in questo schema e per questa classe di hamiltoniane, <i>sono</i> le equazioni di Newton. Ciò che cambia è l&rsquo;oggetto a cui si applicano — operatori invece che numeri — e tutto il contenuto quantistico sta nelle relazioni di commutazione fra le condizioni iniziali, non nella forma delle equazioni.</p>`},
   {label:'L’oscillatore armonico, integrato come in meccanica classica', body:R`
   <p>Per $V=\tfrac12m\omega^{2}q^{2}$ le equazioni diventano lineari, e Picasso osserva che «<i>siccome le equazioni del moto sono lineari, l&rsquo;integrazione si effettua come nel caso classico</i>». La soluzione generale è $\hat q(t)=A\cos\omega t+B\sin\omega t$ con $A$ e $B$ <b>operatori</b>, determinati dalle condizioni iniziali $\hat q(0)=\hat q$ e $\dot{\hat q}(0)=\hat p/m$:</p>
   $$\hat q(t)=\hat q\cos\omega t+\frac{\hat p}{m\omega}\sin\omega t,\qquad \hat p(t)=\hat p\cos\omega t-m\omega\hat q\sin\omega t.$$
   <p>Che risolva l&rsquo;equazione si controlla derivando due volte:</p>
   $$\frac{d^{2}}{dt^{2}}\Big(\hat q\cos\omega t+\frac{\hat p}{m\omega}\sin\omega t\Big)=-\omega^{2}\Big(\hat q\cos\omega t+\frac{\hat p}{m\omega}\sin\omega t\Big),$$
   <p>che è $\ddot{\hat q}=-\omega^{2}\hat q$, cioè $m\ddot{\hat q}=-m\omega^{2}\hat q$. E a mezzo periodo:</p>
   $$\hat q(\pi/\omega)=\hat q\cos\pi+\frac{\hat p}{m\omega}\sin\pi=-\hat q,$$
   <p>con analogamente $\hat p(\pi/\omega)=-\hat p$. <b>Questo è lo stesso risultato che la tappa 03 aveva ottenuto nello schema di Schrödinger</b>, dove diceva che l&rsquo;evoluzione per mezzo periodo realizza l&rsquo;inversione spaziale. Averlo ritrovato per una strada completamente diversa — lì contando fasi, qui integrando un&rsquo;equazione differenziale — è il controllo di consistenza che l&rsquo;equivalenza fra i due schemi promette.</p>`}
  ]},
  {t:'reveal', title:'Il pacchetto libero si allarga, e il conto che lo dimostra', tag:'costruzione', steps:[
   {label:'Due righe di soluzione, e una parabola', body:R`
   <p>Il caso $V=0$ è dove lo schema di Heisenberg paga più che altrove, perché dà in due righe un risultato che in Schrödinger richiede di propagare un integrale di Fourier. Integrando le equazioni con $V=0$:</p>
   $$\hat p(t)=\hat p,\qquad \hat q(t)=\hat q+\frac{\hat p}{m}t.$$
   <p>Ora si calcoli la larghezza della distribuzione di posizione, $(\Delta q(t))^{2}=\langle\hat q(t)^{2}\rangle-\langle\hat q(t)\rangle^{2}$, ricordando che $\hat q$ e $\hat p$ <i>non commutano</i> e quindi il quadrato di una loro somma contiene il loro anticommutatore. Il risultato è una funzione quadratica del tempo:</p>
   $$(\Delta q(t))^{2}=(\Delta q)^{2}+\frac{t}{m}\Big(\langle\hat q\hat p+\hat p\hat q\rangle-2\langle\hat q\rangle\langle\hat p\rangle\Big)+\frac{t^{2}}{m^{2}}(\Delta p)^{2},$$
   <p>dove tutte le medie sono prese sullo stato iniziale. Picasso la scrive come la sua (9.33) e osserva la cosa che conta: è «<i>una funzione quadratica di $t$, definita positiva</i>».</p>
   <p>Si scriva $a+bt+ct^{2}$ con $a=(\Delta q)^{2}>0$ e $c=(\Delta p)^{2}/m^{2}>0$. Il coefficiente $b$, che è un&rsquo;anticorrelazione fra posizione e impulso, <b>può avere qualunque segno</b>, e il suo segno decide se il pacchetto all&rsquo;istante iniziale si sta allargando o restringendo. Il vertice della parabola sta in</p>
   $$t_0=-\frac{b}{2c},\qquad (\Delta q)^{2}_{\min}=a-\frac{b^{2}}{4c}.$$
   <p><b>Quindi: se $b<0$ il pacchetto prima si stringe, raggiunge il minimo a $t_0>0$, e poi si allarga per sempre.</b> Se $b\ge0$ si allarga da subito. In nessun caso può allargarsi e poi restringersi: <i>una parabola con la concavità verso l&rsquo;alto ha un solo minimo</i>, e il fatto che $c>0$ è garantito dall&rsquo;indeterminazione in impulso, che non può essere nulla per uno stato normalizzabile.</p>`},
   {label:'La stima asintotica, e perché l’indeterminazione la rende inevitabile', body:R`
   <p>Per tempi grandi domina il termine quadratico, e</p>
   $$\lim_{t\to\infty}\frac{\Delta q(t)}{t}=\frac{\hbar}{m\,\Delta q}$$
   <p>se si assume che il pacchetto parta da uno stato di minima indeterminazione, dove $\Delta p\simeq\hbar/\Delta q$. È la stima (9.34) di Picasso, e lui sottolinea che «<i>mette bene in evidenza quali sono i parametri caratteristici da cui dipende la velocità di sparpagliamento: $\hbar$, $m$ e $\Delta q$</i>».</p>
   <p>La forma della formula contiene già la morale, ed è una morale sgradevole per chi sperasse di recuperare la traiettoria classica stringendo il pacchetto: <b>la velocità di allargamento è <i>inversamente</i> proporzionale alla larghezza iniziale</b>. Più si localizza la particella all&rsquo;inizio, più in fretta la si perde. Picasso ci torna nella tappa seguente del suo discorso: «<i>si può essere tentati di concludere che tanto più $\Delta q$ è piccolo, tanto meglio vale l&rsquo;approssimazione classica: in effetti le cose non stanno così</i>». Il regime classico è un <i>compromesso</i>, non un limite da spingere.</p>`},
   {label:'I tre numeri, e il fatto che lo sparpagliamento è la diffrazione', body:R`
   <p>Picasso valuta la velocità di allargamento in tre casi, e i numeri decidono la questione meglio di ogni argomento.</p>
   <p><b>Elettrone libero con $\Delta q=1$ ångström.</b> Con $\hbar=1{,}05\times10^{-34}$ J s e $m=9{,}11\times10^{-31}$ kg,</p>
   $$\frac{\hbar}{m\,\Delta q}\simeq1{,}16\times10^{6}\ \mathrm{m\,s^{-1}},$$
   <p>cioè $10^{8}$ cm al secondo. Picasso commenta: «<i>Questo risultato si commenta da solo</i>». Un elettrone localizzato alla scala atomica smette di essere localizzato in un tempo dell&rsquo;ordine di $10^{-18}$ secondi.</p>
   <p><b>Elettrone con $\Delta q=10^{-3}$ cm</b>, per esempio focalizzato in un tubo a raggi catodici: si scende a $10^{3}$ cm s$^{-1}$. Sembra ancora molto, ma la scala giusta non è la velocità assoluta: «<i>un elettrone di energia $>10^{4}$ eV dovrebbe percorrere una distanza di circa $10^{4}$ cm affinché lo sparpagliamento risulti dell&rsquo;ordine del $\Delta q$ iniziale</i>». Cento metri di volo per raddoppiare la larghezza — gli strumenti funzionano.</p>
   <p><b>Granello di polvere</b> di massa $10^{-12}$ g e $\Delta q=10^{-4}$ cm: $10^{-9}$ cm s$^{-1}$. Un centimetro in trent&rsquo;anni.</p>
   <p>E infine l&rsquo;osservazione che toglie alla faccenda ogni aria di misteriosità quantistica: lo sparpagliamento «<i>non è altro che il ben noto fenomeno della diffrazione che si manifesta in ogni problema di natura ondulatoria</i>». Un fascio di elettroni di impulso $p$ che attraversa una fenditura di larghezza $d$ e raggiunge uno schermo a distanza $D$ impiega $\tau\simeq mD/p$, e applicando la stima si ottiene la dimensione trasversale del pacchetto sullo schermo</p>
   $$\Delta q(\tau)\simeq\frac{\hbar D}{p\,d}=\frac{\lambda D}{d},$$
   <p><b>che è la formula della diffrazione da fenditura singola.</b> <i>Allargamento del pacchetto e figura di diffrazione sono lo stesso fenomeno, calcolato in due linguaggi.</i></p>`}
  ]},
  {t:'plot', title:'La larghezza del pacchetto: una parabola in t², e la radice che si vede',
   intro:R`<p>$(\Delta q(t))^{2}=a+bt+ct^{2}$ con $a=1$, $c=1$ e tre valori del termine incrociato: $b=-1{,}6$ (pacchetto che converge), $b=0$ (minimo all&rsquo;istante iniziale) e $b=+1{,}2$ (già divergente). A destra la stessa cosa come $\Delta q(t)$, cioè la radice quadrata, che è la quantità con significato fisico.</p>`,
   plots:[{kind:'func2d', xr:[0,3], yr:[0,9], height:250, ticks:true,
     title:'(Δq)² in funzione di t',
     curves:[{f:'1-1.6*x+x*x', col:'#5aa9ff', width:2.4, label:'b = −1,6: prima si stringe'},
             {f:'1+x*x', col:'#6bdc9b', width:2.2, label:'b = 0: minimo in t = 0'},
             {f:'1+1.2*x+x*x', col:'#ff6b8a', width:2.2, label:'b = +1,2: subito largo'}],
     xlabel:'t', ylabel:'(Δq)²'},
    {kind:'func2d', xr:[0,3], yr:[0,3], height:250, ticks:true,
     title:'Δq(t), e l’asintoto lineare',
     curves:[{f:'Math.sqrt(1-1.6*x+x*x)', col:'#5aa9ff', width:2.4, label:'Δq con b = −1,6'},
             {f:'Math.sqrt(1+x*x)', col:'#6bdc9b', width:2.2, label:'Δq con b = 0'},
             {f:'x', col:'#ffc24a', width:1.6, dash:true, label:'asintoto Δp·t/m'}],
     xlabel:'t', ylabel:'Δq'}],
   leggi:R`<p><b>Che cosa guardare.</b> Le tre parabole hanno la stessa concavità e lo stesso valore iniziale: differiscono solo per la pendenza in zero, che è $b$. Quella blu scende fino a $t_0=0{,}8$ toccando $(\Delta q)^{2}_{\min}=1-0{,}64=0{,}36$, cioè $\Delta q=0{,}6$, e da lì risale. A destra, le curve della radice partono tutte da $\Delta q=1$ e si appoggiano alla stessa retta per tempi grandi: <b>l&rsquo;asintoto non dipende da $b$</b>, perché il termine lineare diventa trascurabile.</p>
   <p><b>Che cosa impararne.</b> Due cose. La prima è che <i>un pacchetto può restringersi, ma solo per un tempo finito e solo una volta</i>: è la convergenza di un fascio verso un fuoco, e dopo il fuoco il fascio diverge — il parallelo ottico è esatto, perché è lo stesso fenomeno. La seconda è l&rsquo;asintoto: la larghezza cresce <b>linearmente</b> nel tempo con pendenza $\Delta p/m$, che è semplicemente la dispersione delle velocità. Letta così la formula non ha niente di quantistico: un gruppo di particelle classiche con velocità distribuite su un intervallo $\Delta v$ si sparpaglia esattamente così. <i>Ciò che è quantistico non è lo sparpagliamento, ma il fatto che $\Delta p$ non possa essere zero</i> — ed è l&rsquo;indeterminazione a vietarlo, dato che $\Delta q$ è finito.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Se $\hat p(t)=\hat p$ per la particella libera, perché $\Delta q$ cresce mentre $\Delta p$ resta costante? Non dovrebbe il prodotto violare l&rsquo;indeterminazione?`,
    a:R`La disuguaglianza è $\Delta q\,\Delta p\ge\hbar/2$, cioè un <b>limite inferiore</b>: il prodotto può crescere quanto vuole e non viola nulla. Ciò che accade è che uno stato di minima indeterminazione, dopo un tempo finito, <i>smette</i> di esserlo e diventa sempre più lontano dal minimo. La ragione fisica è che la correlazione fra posizione e impulso cresce: il pacchetto libero sviluppa un «chirp», cioè le componenti veloci si trovano davanti e le lente dietro, e quel termine di correlazione — che è proprio il $b$ della formula, valutato a tempo $t$ invece che a zero — è ciò che tiene il prodotto sopra il minimo. <b>Il minimo si può riottenere solo a prezzo di un&rsquo;operazione fisica</b>, non dall&rsquo;evoluzione libera, e questo è un caso particolare del fatto che l&rsquo;evoluzione unitaria non può ridurre l&rsquo;entropia di uno stato.`},
   {q:R`Lo schema di Heisenberg ha dato la larghezza del pacchetto senza mai scrivere la funzione d&rsquo;onda. Si poteva fare anche in Schrödinger?`,
    a:R`Sì, ma costa molto di più. In Schrödinger bisogna scrivere $\psi(x,0)$, trasformarla in Fourier per ottenere $\varphi(k)$, moltiplicare per $e^{-i\hbar k^{2}t/2m}$, antitrasformare, e poi calcolare due integrali per $\langle x\rangle$ e $\langle x^{2}\rangle$. Per una gaussiana si riesce — gli integrali sono tutti <span class="str" data-str="integrale-gaussiano">gaussiani</span> — ma <b>il risultato ottenuto vale solo per quella gaussiana</b>, mentre il conto in Heisenberg vale <i>per ogni stato iniziale</i>, perché la relazione $\hat q(t)=\hat q+\hat pt/m$ è un&rsquo;identità fra operatori e non dipende da niente. È il miglior esempio di quando conviene lo schema di Heisenberg: <i>quando si vuole una proprietà strutturale dell&rsquo;evoluzione invece del risultato su uno stato specifico</i>. La tappa 08 sfrutterà lo stesso vantaggio per il teorema di Ehrenfest.`},
   {q:R`Il granello di polvere si allarga di un centimetro in trent&rsquo;anni. Vuol dire che dopo abbastanza tempo è «sparpagliato» su un centimetro?`,
    a:R`Secondo questo conto sì, e la risposta corretta è che <b>il conto non si applica</b>, perché un granello di polvere non è un sistema libero e isolato: urta molecole d&rsquo;aria miliardi di volte al secondo, assorbe ed emette fotoni termici, e ciascuna di queste interazioni è di fatto una misura di posizione che ricolassa la sua distribuzione su una scala molto più piccola. Il tempo di decoerenza di un granello in aria a temperatura ambiente è dell&rsquo;ordine di $10^{-30}$ secondi, incomparabilmente più corto dei trent&rsquo;anni. <i>Il calcolo del pacchetto libero dice cosa farebbe un granello isolato nell&rsquo;universo</i>, e la sua funzione qui è di mostrare che nemmeno in quel caso estremo l&rsquo;effetto sarebbe osservabile — il che è un argomento <b>a fortiori</b>, non una previsione.`}
  ]}
]},

/* ---------------- 07 · COSTANTI DEL MOTO ---------------- */
{ num:'07', title:'Costanti del moto: la forma forte del teorema, e perché non sono stati stazionari', meta:'la derivazione di Picasso · la distribuzione intera e non la media · la distinzione che quasi tutti sbagliano · le tre conservazioni di Dirac',
  blocchi:[
  {t:'prosa', title:'La domanda, posta nel modo giusto', tag:'architettura', html:R`
  <p>La tappa 03 ha chiesto quali <i>stati</i> non si muovono. Qui si chiede il contrario: quali <i>osservabili</i> hanno un valor medio che non cambia — e la differenza sta in una parola, perché la richiesta è che non cambi <b>su ogni stato</b>, non su uno particolare. Picasso la pone esattamente così: «<i>Ci chiediamo ora se esistono osservabili tali che per ogni stato del sistema e per ogni $t$</i>» il valor medio sia costante.</p>
  <p>La risposta è il teorema di Noether in meccanica quantistica, nella sua forma più usata, e la sua dimostrazione è di tre righe. Ciò che richiede attenzione non è il teorema ma la sua <i>portata</i>, dove Ballentine dice qualcosa di più forte di Picasso, e il suo confine con la stazionarietà, dove si sbaglia con grande regolarità.</p>`},
  {t:'reveal', title:'La dimostrazione, e perché «per ogni stato» è l’ipotesi che lavora', tag:'costruzione', steps:[
   {label:'Da un’uguaglianza fra medie a un’identità fra operatori', body:R`
   <p>Si richieda $\langle\xi\rangle_t=\langle\xi\rangle_0$ per ogni stato, cioè</p>
   $$\langle A,0|\,U^{\dagger}(t)\,\hat\xi\,U(t)\,|A,0\rangle=\langle A,0|\,\hat\xi\,|A,0\rangle\quad\text{per ogni }|A,0\rangle.$$
   <p>Da un&rsquo;uguaglianza fra valori medi su <i>tutti</i> gli stati segue l&rsquo;uguaglianza fra gli operatori — è il fatto che un operatore è determinato dai suoi valori medi, che per operatori autoaggiunti si dimostra per polarizzazione. Dunque</p>
   $$U^{\dagger}(t)\,\hat\xi\,U(t)=\hat\xi.$$
   <p><b>Qui si vede perché l&rsquo;ipotesi «per ogni stato» è quella che lavora</b>: su un singolo stato l&rsquo;uguaglianza fra medie non direbbe nulla sugli operatori, e infatti la tappa 03 ha mostrato che su uno stato stazionario <i>ogni</i> osservabile ha media costante senza che nessuna sia una costante del moto.</p>`},
   {label:'Il commutatore, e il viceversa', body:R`
   <p>L&rsquo;identità deve valere per ogni $t$, quindi la si può derivare. Con $U(t)=e^{-iHt/\hbar}$, la derivata del primo membro è</p>
   $$\frac{i}{\hbar}U^{\dagger}(t)\big[H,\hat\xi\big]U(t),$$
   <p>e ponendo $t=0$, dove $U=1$, resta</p>
   $$\big[H,\hat\xi\big]=0.$$
   <p>Il viceversa è immediato: se $\hat\xi$ commuta con $H$ commuta con ogni funzione di $H$, quindi con $U(t)$, quindi la coniugazione la lascia invariata. <b>Le due condizioni sono equivalenti</b>, e Picasso chiama le osservabili che le soddisfano <i>costanti del moto</i>, osservando che la definizione corrisponde a quella classica tramite il postulato di quantizzazione: se $[H,\xi]=0$ allora anche la parentesi di Poisson classica si annulla.</p>
   <p>Aggiunge poi il teorema che rende utile la nozione: <i>se $\hat\xi$ è una costante del moto e $|A,0\rangle$ è un suo autovettore con autovalore $\xi'$, lo è anche $|A,t\rangle$.</i> Cioè il vettore di stato resta per sempre nel sottospazio etichettato da quell&rsquo;autovalore. <b>È questo che permette di spezzare un problema in settori</b>: se il momento angolare si conserva, uno stato con $\ell=2$ ha $\ell=2$ per sempre, e l&rsquo;equazione si risolve dentro quel sottospazio invece che in tutto lo spazio di Hilbert.</p>`},
   {label:'La forma forte: non la media, la distribuzione intera', body:R`
   <p>Ballentine va più in là, e il passo in più costa una riga ma cambia l&rsquo;enunciato. Se $[H,K]=0$ allora $H$ commuta anche con <i>ogni funzione</i> $f(K)$, perché una funzione di un operatore si costruisce dal suo calcolo funzionale sullo spettro. Quindi è costante non solo $\langle K\rangle$ ma $\langle f(K)\rangle$ per ogni $f$.</p>
   <p>La scelta giusta di $f$ chiude la questione: si prenda la funzione a gradino $\theta(x-K)$, che vale uno quando $K<x$ e zero altrimenti. Il suo valor medio è, per costruzione,</p>
   $$\langle\theta(x-K)\rangle=\mathrm{Prob}(K<x\,|\,\rho),$$
   <p>cioè la funzione di ripartizione di $K$. Ballentine conclude: «<i>Therefore the probability distribution $\mathrm{Prob}(K<x|\rho)$ is independent of time, regardless of the initial state. Such a quantity $K$ is called a constant of motion.</i>»</p>
   <p><b>La differenza fra le due versioni è sostanziale.</b> «Il valor medio non cambia» è compatibile con una distribuzione che si allarga da una parte e si restringe dall&rsquo;altra tenendo fermo il baricentro; «la distribuzione non cambia» esclude anche quello. <i>Una costante del moto quantistica è congelata in ogni suo momento, non solo nel primo</i>, e questa è la versione che serve per dire che una misura di $K$ dà lo stesso istogramma a qualunque istante la si faccia.</p>`}
  ]},
  {t:'reveal', title:'La distinzione che si sbaglia: costante del moto non è stato stazionario', tag:'costruzione', steps:[
   {label:'I due quantificatori, scambiati', body:R`
   <p>Ballentine la isola in un paragrafo apposta, e vale riprodurne la struttura perché la differenza è <i>solo</i> nell&rsquo;ordine dei quantificatori.</p>
   <p><b>Stato stazionario</b>: esiste uno stato particolare — un autovettore di $H$ — tale che <i>per ogni</i> osservabile la media e la distribuzione sono costanti.</p>
   <p><b>Costante del moto</b>: esiste un&rsquo;osservabile particolare — una che commuta con $H$ — tale che <i>per ogni</i> stato la media e la distribuzione sono costanti.</p>
   <p>Le sue parole: «<i>In a stationary state the averages and probabilities of all dynamical variables are independent of time, whereas a constant of motion has its average and probabilities independent of time for all states.</i>» <b>Nel primo caso è fissato lo stato e si quantifica sulle osservabili; nel secondo è fissata l&rsquo;osservabile e si quantifica sugli stati.</b></p>
   <p>Un esempio che separa i due casi: per una particella libera, $\hat p$ è una costante del moto (commuta con $H=\hat p^{2}/2m$) ma uno stato con impulso ben definito non esiste come stato normalizzabile; viceversa, in una buca, lo stato $\psi_3$ è stazionario e lì anche $\hat x$ ha media costante, pur non essendo $\hat x$ una costante del moto — e infatti nella sovrapposizione $(\psi_1+\psi_2)/\sqrt2$ della tappa 04 la sua media oscilla.</p>`},
   {label:'Il caso in cui le due cose si incontrano', body:R`
   <p>Ballentine chiude mostrando che cosa si guadagna quando entrambe le condizioni valgono. Se $[K,H]=0$, i due operatori hanno un sistema completo di autovettori comuni; gli autovettori di $H$ descrivono stati stazionari; dunque «<i>it is possible to prepare stationary states in which both the energy and the dynamical variable described by $K$ have unique values without statistical dispersion</i>».</p>
   <p>È la base di tutta la classificazione spettroscopica: uno stato atomico si etichetta con $n,\ell,m$ perché $\hat L^{2}$ e $\hat L_z$ sono costanti del moto e si possono diagonalizzare insieme a $H$. <i>Gli autovalori delle costanti del moto sono i numeri quantici</i>, e la ragione per cui esistono numeri quantici è che esistono simmetrie.</p>`},
   {label:'Le tre conservazioni, nella voce di Dirac', body:R`
   <p>Dirac arriva alle stesse conclusioni nello schema di Heisenberg, dove la definizione di costante del moto è più diretta — un operatore che non dipende dal tempo — e ne trae il bilancio per un sistema isolato (pag. stampata 159). L&rsquo;energia è costante del moto perché $H$ commuta con sé stessa; le traslazioni lasciano invariata l&rsquo;energia totale di un sistema isolato, «<i>è evidente dal punto di vista fisico che, se le variabili dinamiche vengono traslate tutte in un certo modo, l&rsquo;energia totale deve restare immutata</i>», e dunque gli operatori di traslazione commutano con $H$ e l&rsquo;impulso totale si conserva; e lo stesso argomento con le rotazioni dà il momento angolare. La conclusione, nelle sue parole:</p>
   <p><i>«Le leggi di conservazione dell&rsquo;energia, della quantità di moto e del momento angolare sono valide in meccanica quantistica per un sistema isolato nello schema di Heisenberg, come lo sono in meccanica classica.»</i></p>
   <p>Si noti che Dirac mette una condizione tecnica che vale ricordare: perché $\hat\xi$ sia costante del moto deve commutare con $H$ <i>a ogni istante</i>, il che in generale «<i>è possibile soltanto se $H$ è costante</i>». <b>Con un&rsquo;hamiltoniana dipendente dal tempo le conservazioni cadono</b>, ed è la stessa ragione per cui lì non c&rsquo;è gruppo a un parametro: un sistema che scambia energia con l&rsquo;esterno non è isolato, e l&rsquo;esterno è proprio ciò che la dipendenza esplicita da $t$ rappresenta.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`L&rsquo;operatore $\hat x(t)=\hat x+\hat pt/m$ della particella libera ha, nello schema di Heisenberg, una dipendenza esplicita dal tempo. È una costante del moto?`,
    a:R`No, ed è il caso che chiarisce il criterio. Nello schema di Heisenberg una costante del moto è un operatore che <b>non dipende dal tempo</b>, e $\hat x(t)$ dipende. Il criterio equivalente in Schrödinger è $[H,\hat x]=0$, che è falso: $[H,\hat x]=-i\hbar\hat p/m$. <i>L&rsquo;impulso invece lo è</i>, perché $\hat p(t)=\hat p$. Vale però una precisazione fine: esiste una combinazione che <b>è</b> costante del moto pur contenendo esplicitamente il tempo, cioè $\hat x-\hat pt/m$ — la posizione iniziale, riletta a tempo $t$ — e la sua derivata totale si annulla perché la dipendenza esplicita cancella quella dovuta al commutatore. È l&rsquo;analogo quantistico del generatore dei boost, e la sua esistenza è il motivo per cui il gruppo di Galilei ha dieci generatori e non sette.`},
   {q:R`Se una costante del moto ha distribuzione congelata, come può un esperimento di diffusione cambiare l&rsquo;impulso di una particella, visto che l&rsquo;impulso totale si conserva?`,
    a:R`Perché ciò che si conserva è l&rsquo;impulso <b>totale</b>, e la particella diffusa non è il sistema totale. In una diffusione da un bersaglio fisso l&rsquo;hamiltoniana contiene un potenziale $V(\hat x)$ che non commuta con $\hat p$ della particella: l&rsquo;impulso della sola particella <i>non</i> è una costante del moto, ed è per questo che può cambiare. Se invece si tratta il bersaglio come un corpo dinamico, l&rsquo;hamiltoniana completa è invariante per traslazioni <i>congiunte</i> dei due e l&rsquo;impulso totale è conservato — con la sua intera distribuzione, non solo la media. <b>Il criterio pratico è guardare quale traslazione lascia $H$ invariata</b>: traslare la sola particella cambia $V(\hat x)$, traslare tutto no. <i>Il teorema non è mai violato: è sempre riferito a un sistema sbagliato.</i>`}
  ]}
]},

/* ---------------- 08 · EHRENFEST, E DOVE SMETTE DI VALERE ---------------- */
{ num:'08', title:'Il teorema di Ehrenfest, e il «beyond»: né necessario né sufficiente', meta:'i due commutatori · l’approssimazione esatta solo per forza lineare · la voce di Heisenberg nel 1930 · le correzioni che non dipendono da ħ · il controesempio delle due pareti',
  blocchi:[
  {t:'prosa', title:'Che cosa si vuole, e che cosa si otterrà davvero', tag:'architettura', html:R`
  <p>La domanda del limite classico, posta da Picasso in due punti, è questa: «<i>quali stati quantistici del sistema ammettono, con buona approssimazione, una descrizione classica</i>», e «<i>in quali condizioni lo schema classico e quello quantistico forniscono, con buona approssimazione, gli stessi risultati per l&rsquo;evoluzione temporale</i>».</p>
  <p>La risposta tradizionale è il teorema di Ehrenfest: i valori medi di posizione e impulso obbediscono alle equazioni classiche, quindi il baricentro del pacchetto segue una traiettoria newtoniana. <b>Questa tappa dimostra il teorema per intero e poi mostra che la risposta è insufficiente</b>, seguendo Ballentine, che riporta un risultato esplicito: «<i>Ehrenfest&rsquo;s theorem is neither necessary nor sufficient to define the classical regime</i>». La frase è forte e lui la giustifica nei due versi, con un controesempio per ciascuno.</p>
  <p>La conclusione a cui si arriverà è meno comoda e più corretta della solita: il limite classico della meccanica quantistica non è <i>una</i> traiettoria, ma un <b>ensemble</b> di traiettorie classiche. Ballentine lo anticipa fin dall&rsquo;inizio del capitolo: «<i>in a generic case, the classical limit of a quantum state is an ensemble of classical trajectories, not a single classical trajectory</i>».</p>`},
  {t:'reveal', title:'Il teorema, dimostrato per intero', tag:'costruzione', steps:[
   {label:'I due commutatori, calcolati e non citati', body:R`
   <p>Si lavora nello schema di Heisenberg con $H=\hat p^{2}/2m+V(\hat x)$, dove il conto è più corto. Servono due commutatori, e vale calcolarli in rappresentazione delle coordinate su una funzione d&rsquo;onda arbitraria $\psi$, perché così il risultato è dimostrato e non assunto.</p>
   <p><b>Primo.</b> Il potenziale commuta con $\hat x$, quindi contribuisce solo il termine cinetico:</p>
   $$\big[\hat H,\hat x\big]\psi=-\frac{\hbar^{2}}{2m}\Big(x\,\psi''-(x\psi)''\Big)=\frac{\hbar^{2}}{m}\psi',$$
   <p>dove si è usato $(x\psi)''=2\psi'+x\psi''$. In forma operatoriale, $[\hat H,\hat x]=-i\hbar\hat p/m$, e quindi</p>
   $$\frac{d\hat x}{dt}=\frac{i}{\hbar}\big[\hat H,\hat x\big]=\frac{\hat p}{m}.$$
   <p><b>Secondo.</b> L&rsquo;energia cinetica commuta con $\hat p$, quindi contribuisce solo il potenziale:</p>
   $$\big[\hat H,\hat p\big]\psi=-i\hbar\Big(V\psi'-(V\psi)'\Big)=i\hbar\,V'\psi,$$
   <p>dove si è usato $(V\psi)'=V'\psi+V\psi'$. Dunque</p>
   $$\frac{d\hat p}{dt}=\frac{i}{\hbar}\big[\hat H,\hat p\big]=-V'(\hat x)=F(\hat x),$$
   <p>con $F$ l&rsquo;operatore di forza. <i>Questi sono esattamente i conti della tappa 06, rifatti per esteso</i>: lì servivano a integrare le equazioni, qui a prendere le medie.</p>`},
   {label:'Le medie, e l’unico passaggio che è un’approssimazione', body:R`
   <p>Si prenda il valor medio di entrambe le equazioni su uno stato qualunque. La media è lineare, quindi passa attraverso:</p>
   $$\frac{d\langle\hat x\rangle}{dt}=\frac{\langle\hat p\rangle}{m},\qquad \frac{d\langle\hat p\rangle}{dt}=\big\langle F(\hat x)\big\rangle.$$
   <p><b>Queste due sono esatte.</b> Non c&rsquo;è approssimazione, non c&rsquo;è ipotesi sullo stato, non c&rsquo;è limite di nessun tipo: valgono per qualunque funzione d&rsquo;onda e qualunque potenziale.</p>
   <p>Il passaggio successivo invece è il punto debole, e va isolato. Per concludere che $\langle\hat x\rangle$ segue una traiettoria classica servirebbe</p>
   $$\big\langle F(\hat x)\big\rangle\approx F\big(\langle\hat x\rangle\big),$$
   <p>cioè che la media della funzione sia la funzione della media. <b>Questo è falso in generale</b>, ed è vero esattamente quando $F$ è una funzione <i>lineare</i> di $x$. Picasso elenca i tre casi in cui vale senza approssimazione: particella libera, forza costante, forza armonica.</p>
   <p>Fatto il passaggio, si ottiene $m\,d^{2}\langle\hat x\rangle/dt^{2}=F(\langle\hat x\rangle)$, che è la seconda legge di Newton per il baricentro. <i>Qui si paga il debito della tappa 01</i>: il segno scelto per $K=-H/\hbar$ è quello che produce $+F$ invece di $-F$, e con la scelta opposta il baricentro accelererebbe nel verso sbagliato.</p>`},
   {label:'Quanto grande è l’errore: lo sviluppo di Picasso e la correzione di Ballentine', body:R`
   <p>Si quantifichi lo scarto. Picasso sviluppa la forza attorno al valor medio, $F(x)=F(\bar q)+F'(\bar q)(x-\bar q)+R(x)$ con $R$ che raccoglie tutte le potenze oltre la prima, e prendendo la media osserva che il termine lineare scompare — perché $\langle x-\bar q\rangle=0$ — e resta</p>
   $$\big\langle F(\hat x)\big\rangle-F(\bar q)=\big\langle R(\hat x)\big\rangle.$$
   <p>Il primo termine di $R$ dà il contributo dominante, $\tfrac12F''(\bar q)\langle(\Delta x)^{2}\rangle$, ed è questa la correzione che Ballentine scrive come sua (14.9):</p>
   $$\frac{dp_0}{dt}=F(q_0)+\tfrac12\big\langle(\delta Q)^{2}\big\rangle\frac{\partial^{2}F}{\partial q_0^{2}}+\cdots$$
   <p>Vale verificare la formula su un caso dove si può fare tutto esattamente. Si prenda una forza cubica $F(x)=-kx^{3}$ e uno stato con distribuzione di posizione gaussiana di media $q_0$ e larghezza $\sigma$. Il momento terzo di una gaussiana è</p>
   $$\langle x^{3}\rangle=q_0^{3}+3q_0\sigma^{2},$$
   <p>quindi lo scarto esatto fra media della forza e forza della media vale $-3kq_0\sigma^{2}$. La formula di correzione, con $F''=-6kx$, predice $\tfrac12\sigma^{2}(-6kq_0)$, e i due coincidono:</p>
   $$\big\langle F(\hat Q)\big\rangle-F(q_0)=-3kq_0\sigma^{2}=\tfrac12\sigma^{2}F''(q_0).$$
   <p>Per un cubico la correzione al secondo ordine è <i>esatta</i>, perché la derivata quarta è nulla e la serie si tronca. <b>Il criterio di validità di Ehrenfest si legge dalla formula</b>: serve che $F''$ sia piccola sulla scala di $\sigma$, cioè — come dice Picasso — che «<i>la forza deve essere buona ed il pacchetto deve essere piccolo</i>», e più precisamente che la variazione di $F$ su un intervallo dell&rsquo;ordine di $\Delta q$ sia trascurabile.</p>`}
  ]},
  {t:'reveal', title:'La voce di Heisenberg: il teorema nel 1930, e il pacchetto che si diffonde', tag:'esempio', steps:[
   {label:'Dove Heisenberg lo mette, e perché lì', body:R`
   <p>Heisenberg espone il teorema di Ehrenfest nel capitolo sulla critica dei concetti, tre anni dopo l&rsquo;articolo originale, e il contesto in cui lo mette è istruttivo quanto il teorema. Sta discutendo che cosa produca una misura di posizione su un elettrone atomico: il risultato, dice, «<i>può così essere rappresentato, nello schema matematico della teoria dei quanti, mediante un pacchetto di probabilità nello spazio delle configurazioni</i>», pacchetto la cui grandezza «<i>sarà data dall&rsquo;esattezza della misura di posizione</i>».</p>
   <p>E poi la frase che inquadra tutto, prima ancora di cominciare il conto: «<i>Questo pacchetto descrive una traiettoria simile alla traiettoria di una particella nella teoria classica e, in generale, contemporaneamente si diffonde.</i>»</p>
   <p><b>Le due cose sono dette nella stessa riga</b> — la traiettoria e la diffusione — e questo è il punto che la presentazione scolastica del teorema perde. Heisenberg non presenta Ehrenfest come il ponte che salva la meccanica classica: lo presenta come la <i>metà</i> buona di un fenomeno la cui altra metà è lo sparpagliamento.</p>`},
   {label:'Il suo conto, e l’attribuzione', body:R`
   <p>Heisenberg dichiara che non svilupperà la questione per esteso, rimandando a Kennard e a Darwin, e scrive: «<i>Esponiamo solo una semplice trattazione di Ehrenfest</i>», con la nota a piè di pagina «<i>P. EHRENFEST, Z. Phys. 45, 455 (1927)</i>».</p>
   <p>Il conto che fa è quello in rappresentazione delle coordinate, e il cammino è esattamente quello che si rifà qui sopra con i commutatori, ma scritto con gli integrali: si parte dal valor medio</p>
   $$\bar q=\int q\,\psi^{*}\psi\,dv,$$
   <p>lo si deriva rispetto al tempo usando l&rsquo;equazione di Schrödinger per $\psi$ e la sua coniugata, e si <b>integra per parti</b>. Una seconda derivazione rispetto al tempo dà l&rsquo;equazione per l&rsquo;accelerazione del baricentro. Le formule di quelle pagine sono mutilate dall&rsquo;OCR e non si ricostruiscono: ciò che si cita è la conclusione, che Heisenberg scrive con la stessa cautela con cui Ballentine la smonterà sessant&rsquo;anni dopo:</p>
   <p><i>«Quest&rsquo;equazione mostra che il pacchetto di probabilità descrive approssimativamente una traiettoria in senso classico»</i>, nella condizione che <i>«$\psi^{*}\psi$ rappresenti un pacchetto di probabilità tale che $V$ non vari sensibilmente nella zona da esso occupata»</i>.</p>
   <p>Si confronti con l&rsquo;enunciato moderno: è la stessa condizione — la forza deve essere quasi lineare sulla larghezza del pacchetto — e la stessa cautela, «approssimativamente». <b>La versione originale è più prudente della versione che circola nei manuali</b>, e il «beyond» di Ballentine è in buona misura il recupero di una prudenza che si era persa per strada.</p>`},
   {label:'Il seguito che Heisenberg aggiunge, e che quasi nessuno riporta', body:R`
   <p>Subito dopo il teorema, Heisenberg apre una questione che non è nel teorema: «<i>Cade qui a proposito un&rsquo;osservazione sulla velocità di diffusione del pacchetto d&rsquo;onde.</i>» E dà un criterio per stimare quanti periodi un pacchetto possa compiere prima di spalmarsi su tutto il dominio atomico.</p>
   <p>L&rsquo;argomento è elegante e vale riprodurlo perché anticipa un fatto generale: «<i>se il pacchetto d&rsquo;onde non si diffondesse, sarebbe possibile un&rsquo;analisi in serie di Fourier della distribuzione di carica, in cui comparirebbero solo multipli interi di una frequenza fondamentale. In realtà, nella teoria dei quanti, le vibrazioni di frequenza superiore non corrispondono a multipli interi della fondamentale.</i>»</p>
   <p><b>Si legga che cosa sta dicendo.</b> Un moto periodico ha uno spettro di frequenze armonico, cioè multipli interi di una fondamentale. Le frequenze di Bohr della tappa 04, $\omega_{nk}=(E_k-E_n)/\hbar$, sono armoniche <i>soltanto</i> se i livelli sono equispaziati — e lo sono per l&rsquo;oscillatore armonico, non per l&rsquo;atomo di idrogeno dove $E_n\propto-1/n^{2}$. <i>La non-armonicità dello spettro è la causa della diffusione del pacchetto</i>, e il tempo di diffusione si stima dallo scarto fra le frequenze e i multipli interi. È la stessa cosa che la tappa 06 ha ricavato dallo sparpagliamento libero, vista nello spazio delle frequenze invece che in quello delle posizioni — e la <span class="str" data-str="trasformata-di-fourier">trasformata di Fourier</span> è ciò che collega le due letture.</p>`}
  ]},
  {t:'reveal', title:'Il «beyond»: né necessario né sufficiente, e due controesempi', tag:'costruzione', steps:[
   {label:'Non sufficiente: l’oscillatore armonico', body:R`
   <p>Il teorema di Ehrenfest vale <i>esattamente</i> per l&rsquo;oscillatore armonico, perché la forza è lineare e l&rsquo;approssimazione non è un&rsquo;approssimazione. Se il teorema definisse il regime classico, un oscillatore quantistico dovrebbe comportarsi classicamente in ogni suo aspetto. <b>Non lo fa</b>, e Ballentine lo liquida in una riga: «<i>Yet a quantum oscillator has discrete energy levels, which make its thermodynamic properties quite different from those of the classical oscillator.</i>»</p>
   <p>Il caso più noto è il calore specifico: un oscillatore classico in equilibrio termico ha energia media $k_BT$ indipendente dalla frequenza, uno quantistico la ha solo per $k_BT\gg\hbar\omega$ e la perde esponenzialmente sotto quella soglia. È il risultato di Einstein sul calore specifico dei solidi, ed è interamente non classico in un sistema dove Ehrenfest vale alla lettera. <i>Un teorema sulle medie di posizione e impulso non può dire nulla sulla discretezza dello spettro</i>, perché quest&rsquo;ultima non compare nelle medie.</p>`},
   {label:'Non necessario: la particella fra due pareti', body:R`
   <p>Il verso opposto richiede un sistema dove Ehrenfest <i>fallisce</i> e il comportamento resta classico, e Ballentine lo costruisce con la buca a pareti impenetrabili in $[0,L]$. Lo stato generico si sviluppa come nella tappa 04,</p>
   $$\psi(x,t)=\sum_{n=1}^{\infty}c_n\sin(k_nx)\,e^{-iE_nt/\hbar},\qquad k_n=\frac{n\pi}{L},\ E_n=\frac{\pi^{2}\hbar^{2}}{2mL^{2}}n^{2},$$
   <p>e siccome tutte le frequenze $E_n/\hbar$ sono multipli interi della più bassa, $\omega_1=\pi^{2}\hbar/2mL^{2}$, la funzione d&rsquo;onda è <b>periodica</b> con periodo</p>
   $$T_{\mathrm{qm}}=\frac{2\pi}{\omega_1}=\frac{4mL^{2}}{\pi\hbar}.$$
   <p>Ballentine osserva che questo periodo «<i>bears no relation to the classical period of a particle with speed $v$</i>», che è $T_{cl}=2L/v$. Le due quantità non si somigliano nemmeno dimensionalmente nel modo giusto: $T_{\mathrm{qm}}$ non contiene la velocità e <i>diverge</i> per $\hbar\to0$, quindi nel limite classico diventa irrilevante — che è il modo in cui il paradosso si scioglie.</p>
   <p>Il conto numerico che lui riporta — stato gaussiano con $a=0{,}1$ e $v=20$ in unità $\hbar=m=L=1$ — dà il risultato che chiude la questione. <b>«Ehrenfest&rsquo;s theorem, which predicts $\langle x\rangle$ to follow a classical trajectory, is very inaccurate, even before the first reflection.»</b> E però: «<i>the failure of Ehrenfest&rsquo;s theorem does not indicate nonclassical behavior; the quantum state and the classical ensemble are in close agreement, even though Ehrenfest&rsquo;s theorem is not applicable</i>».</p>
   <p>Cioè il confronto giusto non era con <i>una</i> traiettoria ma con un <b>ensemble</b> di traiettorie classiche con la stessa distribuzione iniziale di posizione e impulso — e quel confronto regge. Perfino la larghezza $\Delta x$ è data correttamente dalla teoria classica, e il suo comportamento non monotono «<i>is caused by the folding of the ensemble upon itself when it is reflected from a wall</i>». A tempi lunghi l&rsquo;ensemble classico riempie uniformemente la buca e</p>
   $$\Delta x\to\frac{L}{2\sqrt3}\simeq0{,}2887\,L,$$
   <p>che è la deviazione standard di una distribuzione uniforme su un intervallo di lunghezza $L$.</p>`},
   {label:'Perché le correzioni NON sono di origine quantistica', body:R`
   <p>Resta il punto più fine, ed è quello che spiega <i>perché</i> Ehrenfest non poteva essere la risposta. Ballentine osserva dei termini correttivi: «<i>they are not essentially quantum-mechanical in origin, as is evidenced by the fact that they do not depend explicitly on $\hbar$</i>».</p>
   <p>La dimostrazione è un confronto. Un ensemble classico è descritto da una densità $\rho_c(q,p,t)$ nello spazio delle fasi che obbedisce all&rsquo;equazione di Liouville</p>
   $$\frac{\partial\rho_c}{\partial t}=-\frac{p}{M}\frac{\partial\rho_c}{\partial q}-F(q)\frac{\partial\rho_c}{\partial p},$$
   <p>e calcolando le medie $q_c$ e $p_c$, derivandole e integrando per parti si ottengono $dq_c/dt=p_c/m$ e $dp_c/dt=\int F(q)\rho_c\,dq\,dp$. Sviluppando quest&rsquo;ultima in potenze di $\delta q=q-q_c$:</p>
   $$\frac{dp_c}{dt}=F(q_c)+\tfrac12\big\langle(\delta q)^{2}\big\rangle_c\frac{\partial^{2}F}{\partial q_c^{2}}+\cdots$$
   <p><b>È la stessa identica formula del caso quantistico</b>, con $\langle(\delta q)^{2}\rangle_c$ al posto di $\langle(\delta Q)^{2}\rangle$. Ballentine conclude: «<i>The centroid of a classical ensemble need not follow a classical trajectory if the width of the probability distribution is not negligible.</i>»</p>
   <p>La morale, ed è la cosa da portarsi via da tutta la tappa: <i>il fallimento di Ehrenfest non misura la quantisticità di un sistema, misura la larghezza della sua distribuzione</i> — e una distribuzione larga la può avere anche una teoria perfettamente classica. Un fascio di palle da biliardo con velocità leggermente diverse non segue, come insieme, nessuna traiettoria di palla da biliardo.</p>`}
  ]},
  {t:'plot', title:'Dove Ehrenfest si rompe: media della forza contro forza della media',
   intro:R`<p>Forza cubica $F(x)=-x^{3}$, e una distribuzione gaussiana di posizione centrata in $q_0$ con larghezza $\sigma=0{,}6$. In blu la forza della media, $F(q_0)=-q_0^{3}$; in rosso la media della forza, $\langle F\rangle=-(q_0^{3}+3q_0\sigma^{2})$; in giallo la loro differenza, $-3q_0\sigma^{2}$, che è la correzione. Sull&rsquo;asse orizzontale la posizione media $q_0$.</p>`,
   plots:[{kind:'func2d', xr:[-2,2], yr:[-10,10], height:250, ticks:true,
     title:'forza della media e media della forza, per F = −x³',
     curves:[{f:'-x*x*x', col:'#5aa9ff', width:2.4, label:'F(⟨x⟩)'},
             {f:'-(x*x*x+3*x*0.36)', col:'#ff6b8a', width:2.4, label:'⟨F(x)⟩, σ = 0,6'},
             {f:'-3*x*0.36', col:'#ffc24a', width:1.8, dash:true, label:'differenza = ½σ²F″'}],
     xlabel:'q₀', ylabel:'forza'},
    {kind:'func2d', xr:[-2,2], yr:[-10,10], height:250, ticks:true,
     title:'la stessa cosa per una forza lineare, F = −4x',
     curves:[{f:'-4*x', col:'#5aa9ff', width:2.4, label:'F(⟨x⟩)'},
             {f:'-4*x', col:'#ff6b8a', width:1.4, dash:true, label:'⟨F(x)⟩: coincide'},
             {f:'0', col:'#ffc24a', width:1.8, label:'differenza = 0'}],
     xlabel:'q₀', ylabel:'forza'}],
