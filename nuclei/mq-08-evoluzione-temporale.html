<style>
  :root{

  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;

  .banner{background:var(--panel2);border-bottom:1px solid var(--border);color:var(--muted);

  /* ---- SIDEBAR ---- */

  .navitem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:none;

  .navitem .dot{width:7px;height:7px;border-radius:50%;background:transparent;flex:0 0 7px;
    border:1px solid var(--border);}
  .navitem.seen .dot{background:var(--ok);border-color:var(--ok);}
  .navitem .nx{color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto;}

  /* ---- MAIN ---- */
  .main{flex:1 1 auto;min-width:0;padding:24px 30px 90px;max-width:860px;}
  h1{font-size:1.5rem;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:.92rem;margin:0 0 18px;}
  .sfhead{border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:8px;}
  .sfhead h1{font-size:1.55rem;}
  .meta{color:var(--muted);font-size:.82rem;margin-top:6px;}

  .section{margin:26px 0;}
  .section > h3{font-size:1.02rem;color:var(--accent2);margin:0 0 10px;
    display:flex;align-items:center;gap:10px;}
  .section > h3 .tag{font-size:.66rem;font-weight:700;letter-spacing:.4px;background:var(--panel2);
    border:1px solid var(--border);color:var(--muted);padding:2px 8px;border-radius:20px;
    text-transform:uppercase;}
  /* --- blocchi figura --- */
  .section > h3 .tag.plottag{background:#101f2e;border-color:#1f3c57;color:#7ab8e0;}
  .plot-intro{color:var(--muted);font-size:.95rem;margin:0 0 12px;}
  .plot-row{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;
    background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;}
  .plot-row.due .plot-box{flex:1 1 300px;min-width:280px;}
  .plot-box{max-width:560px;}
  .plot-leggi{margin-top:10px;background:var(--panel2);border:1px solid var(--border);
    border-left:3px solid #4a8fc7;border-radius:0 10px 10px 0;padding:11px 14px;

  .plot-leggi b{color:#7ab8e0;}
  .plot-err{color:#ff6b6b;font-size:.85rem;}
  .open-body{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}

  .open-body ul{margin:.4em 0;padding-left:1.2em;} .open-body li{margin:.35em 0;}

  .note{background:var(--panel2);border-left:3px solid var(--muted);border-radius:6px;
    padding:9px 12px;margin:12px 0;font-size:.9rem;color:var(--muted);}
  .note b{color:#ff9d6b;}
  .note.warn{background:var(--warnbg);border-left-color:var(--warn);color:#e0b85a;}
  .note.warn b{color:#f0c25a;}

  /* ---- GRAMMATICA ---- */
  .gramwrap{background:var(--grambg);border:1px solid #1f4d47;border-radius:12px;padding:6px 6px;}
  table.gramtab{border-collapse:collapse;width:100%;font-size:.92rem;}
  table.gramtab td{padding:9px 12px;vertical-align:top;border-bottom:1px solid #17332e;}
  table.gramtab tr:last-child td{border-bottom:none;}
  table.gramtab td.gs{white-space:nowrap;color:var(--gram);width:1%;
    border-right:1px solid #17332e;font-variant-numeric:tabular-nums;}
  .section > h3 .tag.gramtag{background:var(--grambg);border-color:#1f4d47;color:var(--gram);}

  /* ---- STRUMENTI (repertorio condiviso: la scheda si apre DENTRO la frase) ----
     Nessun accento nuovo: riusa il verde della grammatica, perche' uno strumento
     richiamato e' grammatica gia' spiegata altrove, non una quinta specie di blocco. */
  .str{color:var(--gram);border-bottom:1px dashed var(--gram);cursor:pointer;}
  .str:hover{background:var(--grambg);}
  .str::after{content:"\2666";font-size:.62em;vertical-align:.42em;margin-left:2px;opacity:.8;}
  .str.aperto::after{content:"\2715";}
  .str.rotto{color:#ff6b6b;border-bottom-color:#ff6b6b;cursor:help;}
  /* la scheda e' uno SPAN in display:block, non un div: i rimandi cadono dentro
     <p>, <li> e celle di tabella, dove un div e' HTML illegale. */
  .strcard{display:block;margin:10px 0;background:var(--grambg);border:1px solid #1f4d47;
    border-left:3px solid var(--gram);border-radius:0 10px 10px 0;padding:10px 14px;font-size:.9rem;}
  .strcard .sh{display:block;font-size:.66rem;font-weight:700;letter-spacing:.5px;
    text-transform:uppercase;color:var(--gram);margin-bottom:7px;}
  .strcard .sr{display:block;margin:5px 0;}
  .strcard .sk{color:var(--gram);font-weight:600;}

  /* ---- PROLESSI (preannuncio fisico) ---- */
  .prowrap{background:var(--probg);border:1px solid var(--proedge);border-radius:12px;padding:4px 4px 8px;}

  table.protab{border-collapse:collapse;width:100%;font-size:.92rem;}
  table.protab td{padding:10px 12px;vertical-align:top;border-bottom:1px solid var(--proline);}
  table.protab tr:last-child td{border-bottom:none;}
  table.protab td.pd{white-space:nowrap;color:var(--pro);width:1%;font-weight:700;font-size:.78rem;
    letter-spacing:.3px;text-transform:uppercase;border-right:1px solid var(--proline);line-height:1.3;}
  .pro-domanda{margin:8px 8px 2px;background:#140d26;border:1px solid var(--proedge);
    border-left:3px solid var(--pro);border-radius:8px;padding:10px 14px;font-size:.92rem;}
  .pro-domanda b{color:var(--pro);}
  .section > h3 .tag.protag{background:var(--probg);border-color:var(--proedge);color:var(--pro);}

  /* ---- REVEAL ---- */
  .rsteps{display:flex;flex-direction:column;gap:12px;}
  .rstep{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 18px;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .rlabel{font-size:.7rem;font-weight:700;letter-spacing:.4px;color:var(--accent);
    text-transform:uppercase;margin-bottom:8px;}
  .rstep p:first-of-type{margin-top:0;} .rstep p:last-child{margin-bottom:0;}
  .rstep ul{margin:.4em 0;padding-left:1.2em;}
  .testo{background:#13233f;border:1px solid #2b4877;border-radius:12px;padding:14px 18px;margin-bottom:14px;}
  .testo .src{display:block;font-size:.74rem;font-style:italic;color:var(--accent2);margin-bottom:8px;
    text-transform:uppercase;letter-spacing:.3px;}
  .esame-nota{font-size:.9rem;color:var(--muted);font-style:italic;margin-top:12px;padding-left:12px;

  .reveal-btn{background:var(--accent);color:#fff;border:none;padding:11px 18px;border-radius:10px;

  .reveal-btn:hover:not(:disabled){background:var(--accent2);}
  .reveal-btn.small{padding:7px 14px;font-size:.85rem;margin-top:0;background:var(--panel2);
    color:var(--accent2);border:1px solid var(--border);}
  .reveal-btn.small:hover:not(:disabled){border-color:var(--accent);}
  .reveal-btn:disabled,.reveal-btn.done{background:var(--panel2);color:var(--muted);
    border:1px solid var(--border);cursor:default;}

  /* ---- COLLAUDO ---- */
  .collaudo-item{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 18px;margin-bottom:12px;}
  .cq{margin-bottom:10px;}
  .ca{margin-top:12px;background:var(--okbg);border:1px solid #235c33;border-radius:8px;
    padding:10px 14px;font-size:.94rem;}
  .ca b{color:#5fd980;}

  /* ---- PREV / NEXT ---- */
  .prevnext{display:flex;justify-content:space-between;gap:12px;margin-top:40px;
    border-top:1px solid var(--border);padding-top:20px;}
  .pnbtn{flex:1 1 0;background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:12px 16px;cursor:pointer;color:var(--txt);text-align:left;transition:.14s;font:inherit;}
  .pnbtn:hover{border-color:var(--accent);background:var(--panel2);}
  .pnbtn.next{text-align:right;}
  .pnbtn .k{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .pnbtn .t{font-weight:600;color:var(--accent2);}
  .pnbtn:disabled{opacity:.35;cursor:default;border-color:var(--border);background:var(--panel);}

  code{background:var(--panel2);border:1px solid var(--border);border-radius:5px;
    padding:1px 5px;font-size:.85em;color:var(--accent2);}
  .katex{font-size:1.02em;color:var(--txt);} .katex-display{margin:.5em 0;overflow-x:auto;overflow-y:hidden;}

  @media(max-width:860px){
    .shell{flex-direction:column;}
    .sidebar{width:100%;flex:none;position:static;max-height:none;border-right:none;
      border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:4px;}
    .sidebar h2{width:100%;} .navitem{width:auto;}
    .main{padding:20px 16px 80px;}
  }
</style>

<script>

const R = String.raw;

function typeset(el){

function elFromHTML(html){ var d=document.createElement('div'); d.innerHTML=html; return d; }

/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un
   rimando scritto nella prosa:

       <span class="str" data-str="serie-geometrica">la serie geometrica</span>

   Le schede citate da questo nucleo sono cucite qui sotto dal montaggio
   (assembla-nucleo.js): la pagina resta autosufficiente — niente fetch,
   niente sottocartelle da pubblicare — e un rimando a una scheda che non
   esiste FERMA la costruzione invece di arrivare in pagina rotto.
   Apertura: lo stesso gesto del collaudo (si clicca, il pannello compare,
   si typeset una volta sola), portato dentro la frase.
   =================================================================== */
var CORSO = 'meccanica-quantistica';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["spazio-di-hilbert"] = {"nome":"Spazio di Hilbert","riga":"E' uno spazio vettoriale complesso con prodotto interno, completo nella norma che ne deriva e separabile, cosicche' ogni stato si scrive come somma numerabile $|\\psi\\rangle=\\sum_n c_n|n\\rangle$ con $c_n=\\langle n|\\psi\\rangle$.","serve":"E' la casa degli stati, e le tre parole della definizione fanno tre lavori diversi. Il prodotto interno da' le ampiezze, e quindi le probabilita'. La completezza garantisce che il limite di una successione di stati sia ancora uno stato: senza, uno sviluppo in serie potrebbe convergere fuori dallo spazio. La separabilita' permette di scrivere un vettore con una lista numerabile di coefficienti, cioe' di fare i conti.","esempio":"La relazione di completezza $\\sum_n|n\\rangle\\langle n|=\\hat 1$ e' lo strumento operativo piu' usato della teoria: infilata dentro un prodotto scalare lo spezza in una somma. La norma diventa $\\langle\\psi|\\psi\\rangle=\\sum_n|c_n|^{2}$, e se lo stato e' normalizzato quella somma vale uno: i moduli quadri dei coefficienti sono probabilita', e sommano a uno per costruzione.","debito":"la costruzione di $L^{2}$ come completamento, la misura di Lebesgue che serve a definirlo e il teorema di Riesz-Fischer stanno nei movimenti di Metodi; qui si usa il risultato.","controllo":[{"tipo":"somma","espr":"(1/2)**n","var":"n","da":"1","a":"oo","vale":"1","ipotesi":{"n":"positive-integer"},"dove":"esempio","appare":"sommano a uno"},{"tipo":"simbolico","dove":"esempio","appare":"\\sum_n|n\\rangle\\langle n|=\\hat 1","perche":"e' la relazione di completezza: i proiettori sugli elementi di una base ortonormale sommano all'identita'. E' la proprieta' che definisce una base completa, non un conto"}],"qui":{},"pieno":null};
STRUM["operatore-aggiunto"] = {"nome":"Operatore aggiunto e autoaggiunto","riga":"L'aggiunto e' definito da $\\langle\\phi|\\hat A\\psi\\rangle=\\langle\\hat A^{\\dagger}\\phi|\\psi\\rangle$ per ogni coppia di stati, e l'operatore e' autoaggiunto quando coincidono sia $\\hat A^{\\dagger}$ con $\\hat A$ sia i loro domini.","serve":"E' la condizione che rende un operatore un'osservabile: autovalori reali, e autovettori di autovalori distinti ortogonali. In dimensione finita «autoaggiunto» e «hermitiano» coincidono; in dimensione infinita no, e la differenza non e' pedanteria — l'operatore impulso su una semiretta e' hermitiano e non autoaggiunto, e infatti non e' un'osservabile.","esempio":"Se $\\hat A\\psi=a\\psi$ con $\\hat A$ autoaggiunto, allora $a\\langle\\psi|\\psi\\rangle=\\langle\\psi|\\hat A\\psi\\rangle=\\langle\\hat A\\psi|\\psi\\rangle=a^{*}\\langle\\psi|\\psi\\rangle$; siccome la norma non e' nulla segue $a=a^{*}$, cioe' l'autovalore e' reale. Tre righe, e sono la ragione per cui le osservabili si rappresentano cosi'.","debito":"la distinzione fra hermitiano e autoaggiunto in dimensione infinita — domini, estensioni, indici di difetto — e' il programma di von Neumann e sta fuori da questo percorso: qui si dichiara che esiste e si lavora nel caso buono. La regola di inversione dell'ordine nell'aggiunto di un prodotto si usa e non si dimostra.","controllo":[{"tipo":"uguale","sinistra":"conjugate(a)","vale":"a","ipotesi":{"a":"real"},"dove":"esempio","appare":"a=a^{*}"}],"qui":{},"pieno":null};
STRUM["spettro"] = {"nome":"Spettro di un operatore","riga":"Lo spettro di un operatore e' l'insieme dei possibili esiti di una misura — i suoi autovalori — e puo' essere discreto (autovalori separati, autovettori in $\\mathcal H$), continuo (autovalori che riempiono un intervallo, autovettori non normalizzabili), o misto.","serve":"E' la quantita' che la fisica chiede davvero: scrivere l'hamiltoniana e trovarne lo spettro E' il problema d'esame. La distinzione discreto/continuo non e' tecnica — decide se un autostato e' uno stato preparabile (discreto) o una distribuzione che vive fuori dallo spazio di Hilbert (continuo), come l'onda piana e la delta.","esempio":"Per $\\sigma_z=\\begin{pmatrix}1&0\\\\0&-1\\end{pmatrix}$ lo spettro e' $\\{+1,-1\\}$, discreto, e i due invarianti della matrice lo riassumono senza risolvere l'equazione secolare: la somma degli autovalori e' la traccia, $\\operatorname{tr}\\sigma_z=0$, il loro prodotto e' il determinante, $\\det\\sigma_z=-1$. Per l'operatore posizione lo spettro e' tutta la retta reale, continuo, e gli autovettori sono delte di Dirac.","debito":"la costruzione rigorosa dello spettro continuo (teorema spettrale generalizzato, misura spettrale $E(\\lambda)$ di von Neumann) sta fuori da questo percorso: qui si dichiara che esiste e si lavora coi casi concreti. La separazione fra spettro continuo e spettro residuo non si tratta.","controllo":[{"tipo":"uguale","sinistra":"Matrix([[1,0],[0,-1]]).trace()","vale":"0","dove":"esempio","appare":"\\operatorname{tr}\\sigma_z=0"},{"tipo":"uguale","sinistra":"Matrix([[1,0],[0,-1]]).det()","vale":"-1","dove":"esempio","appare":"\\det\\sigma_z=-1"}],"qui":{},"pieno":null};
STRUM["commutatore"] = {"nome":"Commutatore","riga":"$[\\hat A,\\hat B]=\\hat A\\hat B-\\hat B\\hat A$, antisimmetrico, con la regola di Leibniz $[\\hat A,\\hat B\\hat C]=[\\hat A,\\hat B]\\hat C+\\hat B[\\hat A,\\hat C]$ e la relazione canonica $[\\hat x,\\hat p]=i\\hbar$.","serve":"E' la misura di quanto due operazioni dipendano dall'ordine, e qui l'ordine e' fisica: due osservabili che non commutano non hanno una base comune di autostati, quindi non si misurano insieme con precisione arbitraria. Quasi ogni conto che sembra magico — l'algebra del momento angolare, gli operatori di salita e discesa, il teorema di Ehrenfest — e' una manipolazione di commutatori fatta con quelle regole e nient'altro.","esempio":"Dalla regola di Leibniz, $[\\hat x,\\hat p^{2}]=[\\hat x,\\hat p]\\hat p+\\hat p[\\hat x,\\hat p]=2i\\hbar\\hat p$. E' il conto che fa uscire il teorema di Ehrenfest: la meccanica classica ricompare come relazione fra valori medi, e ricompare perche' quel commutatore vale proprio $2i\\hbar\\hat p$.","debito":"l'identita' di Jacobi si enuncia e non si dimostra; la corrispondenza fra commutatore e parentesi di Poisson — che e' l'idea di Dirac e non un'analogia decorativa — sta in mq-07, e li' va letta per intero.","controllo":[{"tipo":"uguale","sinistra":"I*hbar*p + p*I*hbar","vale":"2*I*hbar*p","ipotesi":{"hbar":"positive","p":"real"},"dove":"esempio","appare":"2i\\hbar\\hat p"},{"tipo":"simbolico","dove":"riga","appare":"[\\hat x,\\hat p]=i\\hbar","perche":"e' la relazione di commutazione canonica, il POSTULATO da cui discende il resto della teoria: non si dimostra, si assume, ed e' cio' che separa la meccanica quantistica dalla classica"}],"qui":{},"pieno":null};
STRUM["operatore-unitario"] = {"nome":"Operatore unitario","riga":"Un operatore $\\hat U$ e' unitario quando $\\hat U^{\\dagger}\\hat U=\\hat U\\hat U^{\\dagger}=\\mathbb 1$, cioe' $\\hat U^{\\dagger}=\\hat U^{-1}$, il che equivale a conservare il prodotto interno: $\\langle \\hat U\\phi|\\hat U\\psi\\rangle=\\langle\\phi|\\psi\\rangle$ per ogni coppia di stati.","serve":"Conservare il prodotto interno vuol dire conservare le probabilita': ogni trasformazione fisica che non cambia gli esiti di una misura — un cambio di base, una traslazione, una rotazione, l'evoluzione temporale — e' unitaria. I suoi autovalori hanno modulo uno, e due osservabili legate da un operatore unitario hanno lo stesso spettro.","esempio":"La rotazione del piano $\\hat U=\\begin{pmatrix}\\cos\\theta&-\\sin\\theta\\\\\\sin\\theta&\\cos\\theta\\end{pmatrix}$ e' unitaria — il prodotto $\\hat U^{\\dagger}\\hat U$ ha sulla diagonale $\\cos^2\\theta+\\sin^2\\theta=1$ e zero fuori — e ha autovalori $e^{\\pm i\\theta}$, di modulo $|e^{i\\theta}|=1$. La matrice $S$ del cambio di base ortonormale e' unitaria per lo stesso motivo: manda una base ortonormale in un'altra.","debito":"la trasformata di Cayley $\\hat U=(\\hat A-i)/(\\hat A+i)$, che lega operatori autoaggiunti e unitari e con cui von Neumann risolve il problema agli autovalori in dimensione infinita, si cita e non si costruisce.","controllo":[{"tipo":"uguale","sinistra":"Abs(exp(I*theta))","vale":"1","ipotesi":{"theta":"real"},"dove":"esempio","appare":"|e^{i\\theta}|=1"},{"tipo":"uguale","sinistra":"Matrix([[cos(th),-sin(th)],[sin(th),cos(th)]]).T*Matrix([[cos(th),-sin(th)],[sin(th),cos(th)]])","vale":"Matrix([[1,0],[0,1]])","ipotesi":{"th":"real"},"dove":"esempio","appare":"\\cos^2\\theta+\\sin^2\\theta=1"}],"qui":{},"pieno":null};
STRUM["traccia"] = {"nome":"Traccia di un operatore","riga":"La traccia e' la somma degli elementi diagonali, $\\operatorname{tr}\\hat A=\\sum_i\\langle i|\\hat A|i\\rangle$, e non dipende dalla base ortonormale scelta perche' e' invariante per permutazione ciclica: $\\operatorname{tr}(\\hat A\\hat B)=\\operatorname{tr}(\\hat B\\hat A)$, da cui $\\operatorname{tr}(\\hat U^{\\dagger}\\hat A\\hat U)=\\operatorname{tr}\\hat A$.","serve":"E' il modo di estrarre un numero da un operatore senza privilegiare una rappresentazione. Il valor medio di un'osservabile su uno stato si scrive $\\langle A\\rangle=\\operatorname{tr}(\\rho\\hat A)$ con $\\rho=|\\psi\\rangle\\langle\\psi|$, e questa forma — a differenza di $\\langle\\psi|\\hat A|\\psi\\rangle$ — vale identica per gli stati misti, dove $\\rho$ non e' piu' un proiettore: e' la porta verso la matrice densita' e la decoerenza.","esempio":"Per $A=\\begin{pmatrix}1&2\\\\3&4\\end{pmatrix}$ e $B=\\begin{pmatrix}0&1\\\\1&0\\end{pmatrix}$, pur essendo $AB\\neq BA$, le due tracce coincidono: $AB=\\begin{pmatrix}2&1\\\\4&3\\end{pmatrix}$ da' $\\operatorname{tr}(AB)=2+3=5$, mentre $BA=\\begin{pmatrix}3&4\\\\1&2\\end{pmatrix}$ da' $\\operatorname{tr}(BA)=3+2=5$. La traccia di un proiettore di rango uno vale $1$, e in generale la traccia di un proiettore e' la dimensione del sottospazio su cui proietta.","debito":"la traccia di un operatore in dimensione infinita esiste solo per la classe degli operatori a traccia (totalmente continui), e la costruzione rigorosa — $\\operatorname{tr}(\\hat A^{\\dagger}\\hat A)=\\sum_\\mu\\|\\hat A\\phi_\\mu\\|^2$ indipendente dalla base, von Neumann cap. II.11 — qui si cita. Si lavora col caso in cui la somma converge.","controllo":[{"tipo":"uguale","sinistra":"(Matrix([[1,2],[3,4]])*Matrix([[0,1],[1,0]])).trace()","vale":"5","dove":"esempio","appare":"\\operatorname{tr}(AB)=2+3=5"},{"tipo":"uguale","sinistra":"(Matrix([[0,1],[1,0]])*Matrix([[1,2],[3,4]])).trace()","vale":"5","dove":"esempio","appare":"\\operatorname{tr}(BA)=3+2=5"},{"tipo":"uguale","sinistra":"Matrix([[1,2],[3,4]])*Matrix([[0,1],[1,0]])","vale":"Matrix([[2,1],[4,3]])","dove":"esempio","appare":"AB=\\begin{pmatrix}2&1\\\\4&3\\end{pmatrix}"},{"tipo":"uguale","sinistra":"Matrix([[0,1],[1,0]])*Matrix([[1,2],[3,4]])","vale":"Matrix([[3,4],[1,2]])","dove":"esempio","appare":"BA=\\begin{pmatrix}3&4\\\\1&2\\end{pmatrix}"}],"qui":{},"pieno":null};
STRUM["parentesi-di-poisson"] = {"nome":"Parentesi di Poisson","riga":"$\\{f,g\\}=\\sum_k\\Big(\\dfrac{\\partial f}{\\partial q_k}\\dfrac{\\partial g}{\\partial p_k}-\\dfrac{\\partial f}{\\partial p_k}\\dfrac{\\partial g}{\\partial q_k}\\Big)$: l'operazione antisimmetrica che, date due funzioni sullo spazio delle fasi, dice di quanto la prima cambia lungo il flusso generato dalla seconda.","serve":"A leggere la meccanica hamiltoniana come una teoria di trasformazioni invece che di traiettorie. Ogni funzione $g(q,p)$ genera una trasformazione canonica infinitesima, $\\delta f=\\varepsilon\\{f,g\\}$, e l'evoluzione temporale e' il caso particolare $g=H$: $\\dot f=\\{f,H\\}$. Da qui escono due cose che non si vedono nelle equazioni di Newton: una quantita' si conserva esattamente quando la trasformazione che genera lascia invariata $H$, e le parentesi fra le coordinate — $\\{q_j,p_k\\}=\\delta_{jk}$ — sono l'unica struttura che una trasformazione canonica deve preservare.","esempio":"Per $H=\\dfrac{p^2}{2m}+V(q)$ con un grado di liberta' le due parentesi fondamentali sono le equazioni di Hamilton riscritte. La coordinata: $\\{q,H\\}=\\dfrac{\\partial q}{\\partial q}\\dfrac{\\partial H}{\\partial p}-\\dfrac{\\partial q}{\\partial p}\\dfrac{\\partial H}{\\partial q}=\\dfrac{p}{m}$, cioe' $\\dot q=p/m$. L'impulso: $\\{p,H\\}=-\\dfrac{\\partial V}{\\partial q}$, cioe' $\\dot p=-V'(q)$, la seconda legge di Newton. E la parentesi fondamentale, calcolata dalla definizione, vale $\\{q,p\\}=1$.","debito":"la dimostrazione che le parentesi di Poisson sono invarianti per trasformazioni canoniche non c'e' qui: e' il contenuto di un corso di meccanica analitica. Qui si usa il fatto, e si usa nella forma che serve — una trasformazione e' canonica quando preserva $\\{q_j,p_k\\}=\\delta_{jk}$.","qui":{"meccanica-quantistica":{"serve":"A capire da dove viene il commutatore, invece di impararlo. L'idea di Dirac e' che la corrispondenza $\\{f,g\\}\\to\\dfrac{1}{i\\hbar}[\\hat f,\\hat g]$ non sia un'analogia decorativa ma la struttura che sopravvive: la trasformazione canonica infinitesima generata da $g$ diventa la trasformazione unitaria infinitesima generata dall'operatore autoaggiunto corrispondente, e il teorema di Noether classico — $\\{g,H\\}=0$ implica $g$ conservata — diventa $[\\hat K,\\hat H]=0$ implica $\\langle \\hat K\\rangle$ costante.","esempio":"Per $H=\\dfrac{p^2}{2m}+V(q)$ si ha $\\{p,H\\}=-\\dfrac{\\partial V}{\\partial q}$: l'impulso si conserva esattamente quando il potenziale non dipende da $q$, cioe' quando il sistema e' invariante per traslazioni. Il conto quantistico corrispondente da' $[\\hat p,\\hat H]=-i\\hbar\\,V'(\\hat q)$, con la stessa conclusione e lo stesso meccanismo."}},"controllo":[{"tipo":"uguale","sinistra":"diff(q,q)*diff(p,p)-diff(q,p)*diff(p,q)","vale":"1","dove":"esempio","appare":"\\{q,p\\}=1"},{"tipo":"uguale","sinistra":"diff(q,q)*diff(p**2/(2*m)+V(q),p)-diff(q,p)*diff(p**2/(2*m)+V(q),q)","vale":"p/m","ipotesi":{"V":"funzione","m":"positive","p":"real","q":"real"},"dove":"esempio","appare":"=\\dfrac{p}{m}"},{"tipo":"uguale","sinistra":"-diff(p**2/(2*m)+V(q),q)","vale":"-diff(V(q),q)","ipotesi":{"V":"funzione","m":"positive","p":"real","q":"real"},"dove":"esempio","appare":"\\{p,H\\}=-\\dfrac{\\partial V}{\\partial q}"}],"pieno":null};
STRUM["polinomi-di-hermite"] = {"nome":"Polinomi di Hermite","riga":"$H_n$ sono le soluzioni polinomiali dell'equazione di Hermite, con $H_0=1$, $H_1=2\\xi$, $H_2=4\\xi^{2}-2$ e $H_3=8\\xi^{3}-12\\xi$, ortogonali con peso $e^{-\\xi^{2}}$.","serve":"Sono la parte polinomiale delle autofunzioni dell'oscillatore armonico. Il grado del polinomio da' il numero di nodi, e quindi l'ordine dei livelli: l'ennesimo stato eccitato ha esattamente ennesimi zeri. La parita' si alterna con il grado, ed e' il motivo per cui meta' degli elementi di matrice si annulla senza fare il conto.","esempio":"Il polinomio di grado due si annulla dove $4\\xi^{2}=2$, cioe' in due punti: due nodi, come vuole il grado. E la sua parita' pari fa si' che l'elemento di matrice della posizione fra lo stato fondamentale e il secondo eccitato sia nullo, perche' l'integrando e' dispari — una regola di selezione ottenuta guardando la simmetria invece di integrare.","debito":"la formula di Rodrigues, la funzione generatrice e le relazioni di ricorrenza stanno nei movimenti di Metodi sulle funzioni speciali; qui c'e' cio' che serve per leggere le autofunzioni.","controllo":[{"tipo":"uguale","sinistra":"4*(1/sqrt(2))**2","vale":"2","dove":"esempio","appare":"4\\xi^{2}=2"},{"tipo":"derivata","espr":"4*x**2-2","rispetto":["x"],"vale":"8*x","ipotesi":{"x":"real"},"dove":"riga","appare":"4\\xi^{2}-2"},{"tipo":"integrale","espr":"x*exp(-x**2)","var":"x","da":"-oo","a":"oo","vale":"0","dove":"esempio","appare":"l'integrando e' dispari"}],"qui":{},"pieno":null};
STRUM["disuguaglianza-di-schwarz"] = {"nome":"Disuguaglianza di Cauchy-Schwarz","riga":"$|\\langle\\phi|\\psi\\rangle|^{2}\\le\\langle\\phi|\\phi\\rangle\\,\\langle\\psi|\\psi\\rangle$, con l'uguaglianza se e solo se i due vettori sono proporzionali.","serve":"E' la disuguaglianza da cui nasce il principio di indeterminazione. Applicata agli scarti di due osservabili, e tenendo la sola parte immaginaria del prodotto scalare, da' un limite inferiore al prodotto delle due varianze pari al quadrato di $\\tfrac{1}{2i}\\langle[\\hat A,\\hat B]\\rangle$. L'indeterminazione non e' un postulato: e' Cauchy-Schwarz piu' un commutatore.","esempio":"Con posizione e impulso il commutatore vale $i\\hbar$, e la disuguaglianza diventa $\\sigma_x^{2}\\sigma_p^{2}\\ge\\hbar^{2}/4$, cioe' $\\sigma_x\\sigma_p\\ge\\hbar/2$. Il fattore un mezzo viene dal $2i$ al denominatore, non da una convenzione scelta.","debito":"la dimostrazione della disuguaglianza — il discriminante della norma quadra di una combinazione lineare — e' quella standard degli spazi con prodotto interno e non si ripete qui.","controllo":[{"tipo":"uguale","sinistra":"(1/(2*I)*(I*hbar))**2","vale":"hbar**2/4","ipotesi":{"hbar":"positive"},"dove":"esempio","appare":"\\hbar^{2}/4"},{"tipo":"uguale","sinistra":"sqrt(hbar**2/4)","vale":"hbar/2","ipotesi":{"hbar":"positive"},"dove":"esempio","appare":"\\hbar/2"}],"qui":{},"pieno":null};
STRUM["matrici-di-pauli"] = {"nome":"Matrici di Pauli","riga":"Sono le tre matrici $2\\times2$ hermitiane a traccia nulla il cui quadrato e' l'identita' e il cui commutatore riproduce l'algebra del momento angolare, da cui lo spin $\\hat S_i=\\tfrac{\\hbar}{2}\\sigma_i$.","serve":"Sono la rappresentazione piu' piccola non banale del momento angolare, e insieme all'identita' formano una base di tutte le matrici due per due hermitiane: qualunque osservabile di un sistema a due stati e' una combinazione dell'identita' e delle tre. Ogni conto di spin un mezzo — Stern-Gerlach, precessione, risonanza magnetica, qubit — si riduce alla loro algebra.","esempio":"Siccome il quadrato di una combinazione unitaria delle tre e' l'identita', qualunque esponenziale collassa: l'operatore di rotazione dello spinore diventa $\\cos(\\theta/2)$ per l'identita' meno $i\\sin(\\theta/2)$ per la combinazione. Il mezzo nell'angolo e' la ragione per cui una rotazione di un giro intero cambia segno allo stato, perche' $\\cos(\\pi)=-1$.","debito":"la costruzione generale delle rappresentazioni di SU(2) e il suo legame con SO(3) stanno nel movimento sul momento angolare; qui c'e' il caso di spin un mezzo con le sue regole di calcolo.","controllo":[{"tipo":"uguale","sinistra":"cos(2*pi/2)","vale":"-1","dove":"esempio","appare":"\\cos(\\pi)=-1"},{"tipo":"uguale","sinistra":"cos(pi/3)**2+sin(pi/3)**2","vale":"1","dove":"esempio","appare":"\\sin(\\theta/2)"}],"qui":{},"pieno":null};
STRUM["integrale-gaussiano"] = {"nome":"Integrale gaussiano","riga":"$\\displaystyle\\int_{-\\infty}^{+\\infty} e^{-ax^{2}}\\,dx=\\sqrt{\\pi/a}$ per $a\\gt 0$, e $\\displaystyle\\int_{-\\infty}^{+\\infty} x^{2}e^{-ax^{2}}\\,dx=\\tfrac12\\sqrt{\\pi/a^{3}}$.","serve":"E' l'unico integrale che serve davvero sapere a memoria in meccanica statistica, perche' l'energia cinetica e' quadratica nell'impulso e quindi ogni integrazione sugli impulsi e' una gaussiana. Il trucco della dimostrazione — elevare al quadrato e passare in coordinate polari — vale la pena di vederlo una volta: e' il motivo per cui compare un $\\pi$ in una formula che di cerchi non parla.","esempio":"Da $I^{2}=\\iint e^{-a(x^{2}+y^{2})}dx\\,dy=\\int_0^\\infty 2\\pi r\\,e^{-ar^{2}}dr=\\pi/a$ segue $I=\\sqrt{\\pi/a}$. I momenti superiori si ottengono derivando rispetto ad $a$ sotto il segno: $-\\partial_a I=\\int x^{2}e^{-ax^{2}}dx=\\tfrac12\\sqrt{\\pi}\\,a^{-3/2}$. Derivare rispetto a un parametro e' piu' rapido che integrare per parti, e funziona per tutti i momenti pari.","debito":"il caso di esponente immaginario — l'integrale di Fresnel $\\int e^{iax^{2}}dx$, che si ottiene ruotando il cammino nel piano complesso e che in meccanica quantistica e' il propagatore libero — non sta qui: in tutte le gaussiane di questo percorso $a$ e' reale e positivo, e la convergenza non e' in discussione.","controllo":[{"tipo":"integrale","espr":"exp(-a*x**2)","var":"x","da":"-oo","a":"oo","vale":"sqrt(pi/a)","ipotesi":{"a":"positive","x":"real"},"dove":"riga","appare":"\\sqrt{\\pi/a}"},{"tipo":"integrale","espr":"x**2*exp(-a*x**2)","var":"x","da":"-oo","a":"oo","vale":"sqrt(pi/a**3)/2","ipotesi":{"a":"positive","x":"real"},"dove":"riga","appare":"\\tfrac12\\sqrt{\\pi/a^{3}}"},{"tipo":"integrale","espr":"2*pi*r*exp(-a*r**2)","var":"r","da":"0","a":"oo","vale":"pi/a","ipotesi":{"a":"positive","r":"positive"},"dove":"esempio","appare":"2\\pi r\\,e^{-ar^{2}}dr=\\pi/a"},{"tipo":"integrale","espr":"x**2*exp(-a*x**2)","var":"x","da":"-oo","a":"oo","vale":"sqrt(pi)*a**Rational(-3,2)/2","ipotesi":{"a":"positive","x":"real"},"dove":"esempio","appare":"\\tfrac12\\sqrt{\\pi}\\,a^{-3/2}"},{"tipo":"integrale","espr":"exp(-b*p**2/(2*m))","var":"p","da":"-oo","a":"oo","vale":"sqrt(2*pi*m/b)","ipotesi":{"b":"positive","m":"positive","p":"real"},"dove":"qui.meccanica-statistica.esempio","appare":"\\sqrt{2\\pi m/\\beta}"},{"tipo":"uguale","sinistra":"V/(h/sqrt(2*pi*m*k*T))**3","vale":"V*(2*pi*m*k*T)**Rational(3,2)/h**3","ipotesi":{"V":"positive","h":"positive","m":"positive","k":"positive","T":"positive"},"dove":"qui.meccanica-statistica.esempio","appare":"V/\\lambda^{3}"},{"tipo":"uguale","sinistra":"integrate(p**2/(2*m)*exp(-b*p**2/(2*m)),(p,-oo,oo))/integrate(exp(-b*p**2/(2*m)),(p,-oo,oo))","vale":"1/(2*b)","ipotesi":{"b":"positive","m":"positive","p":"real"},"dove":"qui.meccanica-statistica.esempio","appare":"1/2\\beta=\\tfrac12 kT"}],"pieno":null,"qui":{"meccanica-statistica":{"serve":"La funzione di partizione di una particella libera e' un prodotto di tre gaussiane negli impulsi, e da li' esce la lunghezza d'onda termica $\\lambda=h/\\sqrt{2\\pi m k T}$ — che e' la grandezza con cui si misura quando un gas smette di essere classico.","esempio":"$\\int e^{-\\beta p^{2}/2m}dp=\\sqrt{2\\pi m/\\beta}$, quindi $Z_{1}=\\dfrac{V}{h^{3}}(2\\pi mkT)^{3/2}=V/\\lambda^{3}$, che e' la stessa cosa scritta due volte perche' $\\lambda=h/\\sqrt{2\\pi mkT}$. Lo stesso integrale col peso $p^{2}$ da' $\\langle p^{2}/2m\\rangle=1/2\\beta=\\tfrac12 kT$ per grado di liberta': l'equipartizione non e' un principio a parte, e' questo integrale."}}};
STRUM["trasformata-di-fourier"] = {"nome":"Trasformata di Fourier","riga":"L'operazione $\\hat f(k)=\\int f(x)\\,e^{-ikx}\\,dx$, che riscrive una funzione come sovrapposizione di onde piane e manda la derivata in una moltiplicazione per $ik$.","serve":"È lo strumento che rende ALGEBRICA un'equazione differenziale lineare a coefficienti costanti: con $\\partial_x$ che diventa $ik$, un'equazione differenziale in $x$ diventa un'equazione algebrica in $k$, si risolve, e si antitrasforma. Le due cose da non perdere sono la convenzione dei $2\\pi$, che cambia da testo a testo e va dichiarata una volta, e Plancherel, che dice che la trasformata conserva la norma $L^{2}$ — in fisica, l'energia.","esempio":"La gaussiana $f(x)=e^{-x^{2}/2}$ ha trasformata $\\int_{-\\infty}^{+\\infty}e^{-x^{2}/2}e^{-ikx}\\,dx=\\sqrt{2\\pi}\\,e^{-k^{2}/2}$: ancora una gaussiana, tanto più larga quanto l'originale è stretta. È il caso in cui si vede meglio il principio di indeterminazione come fatto puramente matematico.","pieno":{"file":"15-distribuzioni.html","tappa":"02","come":"le proprietà, la derivata che diventa un prodotto e Plancherel, nel nucleo delle distribuzioni"},"qui":{"elettromagnetismo":{"serve":"Serve appena si scrive un'onda generica invece di una monocromatica: ogni soluzione delle equazioni di Maxwell nel vuoto è una sovrapposizione di onde piane $e^{i(\\mathbf k\\cdot\\mathbf x-\\omega t)}$, e la trasformata è il modo di scomporla. Su ciascuna componente l'equazione delle onde si riduce alla relazione di dispersione, e la propagazione diventa un far girare fasi: ogni modo viaggia da solo, e nel vuoto tutti alla stessa velocità — per questo un impulso non si deforma.","esempio":"La sostituzione $\\partial_x\\to ik$ e $\\partial_t\\to-i\\omega$ manda le derivate seconde in $(ik)^{2}=-k^{2}$ e $(-i\\omega)^{2}=-\\omega^{2}$: l'equazione delle onde diventa $\\omega^{2}=c^{2}k^{2}$, cioè un'equazione di secondo grado al posto di una differenziale, e la sua radice positiva $\\omega=ck$ è la relazione di dispersione del vuoto."}},"controllo":[{"tipo":"integrale","espr":"exp(-x**2/2)*exp(-I*k*x)","var":"x","da":"-oo","a":"oo","vale":"sqrt(2*pi)*exp(-k**2/2)","ipotesi":{"k":"real"},"dove":"esempio","appare":"\\sqrt{2\\pi}\\,e^{-k^{2}/2}"},{"tipo":"uguale","sinistra":"(I*k)**2","vale":"-k**2","ipotesi":{"k":"real"},"dove":"qui.elettromagnetismo.esempio","appare":"-k^{2}"},{"tipo":"uguale","sinistra":"(-I*w)**2","vale":"-w**2","ipotesi":{"w":"real"},"dove":"qui.elettromagnetismo.esempio","appare":"-\\omega^{2}"},{"tipo":"uguale","sinistra":"(c*k)**2","vale":"c**2*k**2","dove":"qui.elettromagnetismo.esempio","appare":"c^{2}k^{2}"}]};

function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';
  return h;
}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

/* ---------------- 00 · DI COSA PARLA QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Di cosa parla questo movimento', meta:'Meccanica Quantistica · voce Q.9 · il tempo come decima simmetria · Schrödinger come corollario · due schemi e nessun terzo · dove Ehrenfest smette di valere',
  blocchi:[
  {t:'prosa', title:'La domanda che fino a qui non si era posta', tag:'architettura', html:R`
  <p>Tutto l&rsquo;apparato costruito finora descrive un sistema <i>a un istante</i>: lo <span class="str" data-str="spazio-di-hilbert">spazio di Hilbert</span> dei suoi stati, le osservabili come <span class="str" data-str="operatore-aggiunto">operatori autoaggiunti</span>, lo <span class="str" data-str="spettro">spettro</span> che dice quali valori si possono leggere, il <span class="str" data-str="commutatore">commutatore</span> che dice quali misure si possono fare insieme. Picasso apre il capitolo sull&rsquo;evoluzione temporale dichiarando esattamente questo: «<i>le discussioni che abbiamo fatto fino ad ora riguardavano gli stati del sistema ad un determinato istante e non ci siamo ancora chiesti come cambiano gli stati al passare del tempo</i>» (pag. stampata 149).</p>
  <p>La domanda si pone negli stessi termini in cui si pone in meccanica classica — noto lo stato a un istante e note le interazioni, determinare lo stato a ogni altro istante — ma <b>la risposta qui non è un postulato nuovo</b>. È il caso $\alpha=t$ di una macchina già montata: ogni famiglia unitaria a un parametro è l&rsquo;esponenziale di un generatore autoaggiunto, e il generatore <i>è</i> la quantità conservata corrispondente. Delle dieci trasformazioni del gruppo di Galilei nove sono state sfruttate; la decima è la traslazione temporale, e il suo generatore si chiama hamiltoniana.</p>
  <p>Il guadagno di procedere così non è formale. <b>L&rsquo;equazione di Schrödinger, in questo movimento, non si assume: si ottiene derivando</b> — e ciò che si assume al suo posto sono tre cose molto più povere (che l&rsquo;evoluzione sia lineare, che sia unitaria, che componga come un gruppo a un parametro), più una sola identificazione fisica, $K=-H/\hbar$, che Picasso giustifica con l&rsquo;analogia classica e Dirac con la forma delle equazioni che ne risultano.</p>`},
  {t:'prosa', title:'Il teorema, in tre righe, e le tre domande che apre', tag:'architettura', html:R`
  <p><b>Prima riga.</b> Se l&rsquo;evoluzione fra due istanti è un <span class="str" data-str="operatore-unitario">operatore unitario</span> $U(t_2,t_1)$ che compone come un gruppo e le forze non dipendono dal tempo, allora $U$ dipende solo dalla differenza dei due istanti ed è l&rsquo;esponenziale di un generatore autoaggiunto (teorema di Stone). Quel generatore, a meno del fattore $-1/\hbar$, è l&rsquo;hamiltoniana.</p>
  <p><b>Seconda riga.</b> Derivare rispetto al tempo l&rsquo;esponenziale dà l&rsquo;equazione di Schrödinger dipendente dal tempo, $i\hbar\,d|A,t\rangle/dt=H|A,t\rangle$; e siccome l&rsquo;equazione differenziale, a differenza dell&rsquo;esponenziale, non usa che $H$ sia costante, essa <i>sopravvive</i> al caso dipendente dal tempo mentre la soluzione in forma chiusa no.</p>
  <p><b>Terza riga.</b> Quello che è fisicamente osservabile non è il vettore di stato né l&rsquo;operatore, ma il valor medio $\langle R\rangle_t$; e quel valor medio contiene $U$ due volte, una a destra e una a sinistra. Si può attribuire il movimento al vettore (schema di Schrödinger) o all&rsquo;operatore (schema di Heisenberg), e i due modi danno le stesse previsioni perché conta <i>solo il movimento relativo</i> dei due.</p>
  <p>Le tre domande che questo apre, e a cui il movimento risponde: <i>che cosa resta fermo</i> (tappe 03 e 07 — e le due risposte, stato stazionario e costante del moto, sono diverse e si confondono di continuo); <i>come si calcola in pratica</i> (tappe 04 e 06, che sono il mestiere dello scritto); <i>in che senso questo contiene la meccanica classica</i> (tappe 08 e 09, dove si scopre che la risposta ingenua — «il pacchetto segue la traiettoria» — è sbagliata in un modo istruttivo).</p>`},
  {t:'prosa', title:'Come è fatto il movimento', tag:'architettura', html:R`
  <p><b>La rotta.</b> La tappa 01 costruisce $U(t)$ dalle sole proprietà di gruppo e arriva al teorema di Stone, con le due letture dell&rsquo;unitarietà — richiesta fisica in Picasso, conseguenza dell&rsquo;hermiticità in Ballentine. La 02 deriva l&rsquo;equazione di Schrödinger, la scrive in rappresentazione delle coordinate e ne ricava la conservazione della probabilità in forma di equazione di continuità. La 03 dimostra nei due versi che gli stati stazionari sono tutti e soli gli autostati dell&rsquo;energia. La 04 è la tappa d&rsquo;esame: lo sviluppo in autostati, i fattori di fase, e l&rsquo;osservazione che decide tutti gli esercizi — <i>l&rsquo;unica cosa che si muove sono le fasi relative</i> — con tre esempi svolti per intero e le frequenze di Bohr. La 05 costruisce lo schema di Heisenberg per la strada di Dirac, che è una trasformazione unitaria applicata all&rsquo;intero spazio, e per quella di Ballentine, che è la ciclicità della <span class="str" data-str="traccia">traccia</span>. La 06 lo usa per calcolare: l&rsquo;oscillatore integrato come in meccanica classica, e lo sparpagliamento del pacchetto libero con i numeri. La 07 raccoglie le costanti del moto nella forma forte di Ballentine e le distingue dagli stati stazionari. La 08 è il teorema di Ehrenfest con le sue correzioni e con la dimostrazione che <i>non è né necessario né sufficiente</i> per il comportamento classico. La 09 smonta la legge esponenziale del decadimento. La 10 risolve per intero lo spin in campo magnetico, statico e rotante, che è il sistema a due stati di tutti i problemi. La 11 tira il bilancio e svolge i problemi di dinamica del capitolo.</p>
  <p><b>Che cosa questo movimento non fa.</b> Non risolve nessuna equazione di Schrödinger stazionaria: il problema agli autovalori di $H$ — buca, barriera, oscillatore, atomo — è un&rsquo;altra cosa, e qui lo spettro di $H$ si suppone noto ogni volta che serve. Non tratta le perturbazioni dipendenti dal tempo, che il programma di questo corso esclude per nome: la risonanza di spin della tappa 10 è risolta <i>esattamente</i>, con un cambio di riferimento, e non in teoria delle perturbazioni. Non costruisce lo spettro del momento angolare, anche se lo spin compare come spazio a due dimensioni nella tappa 10 — lì serve solo che lo spazio sia bidimensionale, e Ballentine lo dichiara esplicitamente. E non entra nel problema della misura: l&rsquo;evoluzione unitaria descritta qui vale, come dice Picasso, «<i>se nell&rsquo;intervallo $(0,t)$ non si effettuano misure sul sistema</i>».</p>`}
]},

/* ---------------- 01 · IL TEMPO COME DECIMA SIMMETRIA ---------------- */
{ num:'01', title:'Il tempo come decima simmetria: da tre ipotesi povere al teorema di Stone', meta:'lineare, unitario, gruppo a un parametro · perché le forze costanti bastano · due letture dell’unitarietà · il generatore è l’hamiltoniana',
  blocchi:[
  {t:'prosa', title:'Le tre ipotesi, e perché sono poche', tag:'architettura', html:R`
  <p>Si scriva $|A,0\rangle$ per lo stato del sistema all&rsquo;istante zero e $|A,t\rangle$ per lo stato allo stesso istante $t$, e si assuma che il secondo sia determinato dal primo. Picasso è esplicito sulla portata di questa assunzione e sul suo limite: è lecita «<i>se nell&rsquo;intervallo $(0,t)$ non si effettuano misure sul sistema poiché, essendo lo stato del sistema dopo una misura determinato solo statisticamente, verrebbe meno ogni relazione causale</i>» (pag. 149). <b>L&rsquo;evoluzione unitaria e la misura sono due processi diversi</b>, e tutto questo movimento descrive il primo.</p>
  <p>Posto questo, si assume</p>
  $$|A,t\rangle=U(t,0)\,|A,0\rangle$$
  <p>con tre richieste, e conviene vedere che cosa ciascuna compra.</p>
  <p><b>(i) $U$ è lineare.</b> Serve perché le relazioni di sovrapposizione si mantengano: se $|C,0\rangle=\alpha|A,0\rangle+\beta|B,0\rangle$ allora, per linearità, $|C,t\rangle=\alpha|A,t\rangle+\beta|B,t\rangle$. Senza di essa, la combinazione di due stati evolverebbe in qualcosa che non è la combinazione dei due evoluti, e il principio di sovrapposizione — che è l&rsquo;unica cosa che distingue questa teoria da una teoria di probabilità classica — non sopravvivrebbe a un intervallo di tempo.</p>
  <p><b>(ii) $U$ è unitaria.</b> Serve perché i prodotti scalari non cambino:</p>
  $$\langle A,t|B,t\rangle=\langle A,0|U^{\dagger}(t,0)U(t,0)|B,0\rangle=\langle A,0|B,0\rangle,$$
  <p>cioè perché le probabilità di transizione siano le stesse a ogni istante, e in particolare perché la norma si conservi — uno stato normalizzato resta normalizzato, e la probabilità totale resta uno. La condizione che si sta imponendo è</p>
  $$U^{\dagger}(t,t_0)\,U(t,t_0)=1.$$
  <p><b>(iii) $U$ compone.</b> Evolvere da $t_0$ a $t_1$ e poi da $t_1$ a $t_2$ deve dare lo stesso risultato di evolvere direttamente da $t_0$ a $t_2$:</p>
  $$U(t_2,t_1)\,U(t_1,t_0)=U(t_2,t_0).$$
  <p>Picasso la ottiene in una riga inserendo la definizione due volte su un ket arbitrario. <i>È la proprietà più debole delle tre e produrrà il risultato più forte</i>, perché è l&rsquo;unica che lega fra loro i valori dell&rsquo;operatore a tempi diversi.</p>`},
  {t:'reveal', title:'Dalle tre ipotesi alla forma esponenziale', tag:'costruzione', steps:[
   {label:'Perché serve che le forze non dipendano dal tempo', body:R`
   <p>Finora $U(t,t_0)$ dipende da due argomenti. Se però il sistema è soggetto a forze indipendenti dal tempo, allora <i>nessun istante è privilegiato</i>: l&rsquo;evoluzione fra mezzogiorno e mezzogiorno più un secondo è la stessa fra mezzanotte e mezzanotte più un secondo. Formalmente, $U$ dipende solo dalla differenza $t-t_0$ e si può scrivere $U(t)=U(t,0)$. La legge di composizione diventa allora una legge di gruppo a un parametro:</p>
   $$U(t_1)\,U(t_2)=U(t_2)\,U(t_1)=U(t_1+t_2).$$
   <p>Si noti il contenuto in più rispetto alla forma a due argomenti: gli operatori di evoluzione <b>commutano fra loro</b>, perché la somma dei due tempi non dipende dall&rsquo;ordine. Questo è vero solo nel caso stazionario, ed è esattamente ciò che si perderà con un&rsquo;hamiltoniana dipendente dal tempo.</p>`},
   {label:'Il teorema di Stone, e la somiglianza che non è una somiglianza', body:R`
   <p>Una famiglia di operatori unitari a un parametro, continua e con $U(0)=1$, che soddisfa la legge di gruppo, <b>è l&rsquo;esponenziale di un operatore autoaggiunto</b>:</p>
   $$U(t)=e^{iKt},\qquad K=K^{\dagger}.$$
   <p>Questo è il teorema di Stone, e Picasso lo cita per nome (pag. 150). La dimostrazione è la stessa che si fa per ogni famiglia a un parametro — si deriva la legge di gruppo rispetto al secondo argomento, si valuta nell&rsquo;origine, si ottiene un&rsquo;equazione differenziale operatoriale del primo ordine con condizione iniziale $U(0)=1$ — e il contenuto è che <i>la trasformazione a parametro finito è determinata dalla sua derivata nell&rsquo;origine</i>.</p>
   <p>Picasso aggiunge l&rsquo;osservazione che apre tutto il resto: «<i>Si noti la somiglianza fra l&rsquo;operatore di evoluzione temporale nella forma (9.4) e l&rsquo;operatore di traslazione spaziale $U(a)$ definito nella (6.22)</i>». <b>Non è una somiglianza: è lo stesso teorema applicato a due dei dieci generatori dello stesso gruppo.</b> Le traslazioni spaziali e quelle temporali sono entrambe sottogruppi a un parametro del gruppo di Galilei, e il teorema di Stone non sa distinguerli.</p>`},
   {label:'L’identificazione K = −H/ħ, e che cosa costa', body:R`
   <p>Il teorema dà la forma dell&rsquo;operatore ma non dice chi sia $K$. Picasso lo dichiara: $K$ «<i>è un&rsquo;osservabile che riassume in sé la dinamica del sistema</i>», e l&rsquo;analogia con la traslazione spaziale «<i>ci suggerisce di postulare che $K$ sia proporzionale alla hamiltoniana $H$ del sistema</i>». La ragione, nelle sue parole, viene dalla meccanica classica:</p>
   <p><i>«Infatti dalla teoria (classica) delle trasformazioni canoniche sappiamo che, così come l&rsquo;impulso $p$ è il generatore delle traslazioni spaziali, $H$ è il generatore delle traslazioni temporali.»</i></p>
   <p>Nel linguaggio delle <span class="str" data-str="parentesi-di-poisson">parentesi di Poisson</span> questo è il fatto che $\dot f=\lbrace f,H\rbrace$: l&rsquo;evoluzione temporale è il flusso generato da $H$ sullo spazio delle fasi, esattamente come la traslazione è il flusso generato da $p$. La costante di proporzionalità deve avere le dimensioni dell&rsquo;inverso di un&rsquo;azione, e si pone</p>
   $$K=-\frac{H}{\hbar},\qquad U(t)=e^{-iHt/\hbar}.$$
   <p>Picasso è onesto sul <i>segno</i>: la scelta «<i>sarà giustificata dall&rsquo;esigenza che, in opportune condizioni, la meccanica quantistica riproduca i risultati della meccanica classica</i>». Non è una convenzione libera — il segno opposto darebbe un limite classico con il tempo rovesciato — ma a questo punto del discorso non è ancora dimostrato, e si dichiara come debito. <b>Il debito viene pagato nella tappa 08</b>, dove il teorema di Ehrenfest produce $m\ddot{\langle q\rangle}=\langle F\rangle$ con il segno giusto e non con quello sbagliato.</p>`}
  ]},
  {t:'reveal', title:'Due letture dell’unitarietà, e perché la seconda è più profonda', tag:'costruzione', steps:[
   {label:'Ballentine: l’unitarietà non si assume, si deduce', body:R`
   <p>Picasso assume che $U$ sia unitario e ne deduce la conservazione delle probabilità. Ballentine fa il percorso inverso, e vale seguirlo perché l&rsquo;ordine logico è diverso. Lui parte dall&rsquo;equazione differenziale</p>
   $$\frac{\partial}{\partial t}U(t,t_0)=-\Big(\frac{i}{\hbar}\Big)H(t)\,U(t,t_0),$$
   <p>con $U(t_0,t_0)=1$, e <i>non</i> assume niente su $U$. Deriva allora il prodotto $U^{\dagger}U$ usando quell&rsquo;equazione e la sua aggiunta:</p>
   $$\frac{\partial}{\partial t}\big(U^{\dagger}U\big)=\frac{i}{\hbar}\big(U^{\dagger}H^{\dagger}U-U^{\dagger}HU\big).$$
   <p>Il secondo membro si annulla <b>se e solo se</b> $H(t)=H^{\dagger}(t)$. In quel caso $U^{\dagger}U$ è costante nel tempo, e siccome vale $1$ all&rsquo;istante iniziale vale $1$ sempre. Ballentine conclude: «<i>Thus $U(t,t_0)$ is unitary provided that $H(t)$ is Hermitian</i>» (pag. stampata 89).</p>
   <p>La differenza fra le due letture è reale. Per Picasso l&rsquo;unitarietà è una <i>richiesta fisica</i> sulla dinamica, e l&rsquo;hermiticità di $H$ viene dal fatto che $H$ è un&rsquo;osservabile. Per Ballentine l&rsquo;hermiticità di $H$ è il dato — $H$ è un generatore di simmetria, e lo è per il teorema di Wigner — e l&rsquo;unitarietà è ciò che ne segue. <b>La seconda lettura è più profonda perché spiega l&rsquo;unitarietà invece di imporla</b>, e perché copre anche il caso in cui $H$ dipende dal tempo, dove la forma esponenziale non esiste.</p>`},
   {label:'Il caso dipendente dal tempo, e che cosa si perde', body:R`
   <p>Se $H$ non dipende da $t$, l&rsquo;equazione differenziale si integra e dà</p>
   $$U(t,t_0)=e^{-i(t-t_0)H/\hbar}.$$
   <p>Se invece $H(t)$ dipende dal tempo, Ballentine è netto: «<i>in general, no simple closed form can be given for $U(t,t_0)$</i>». E Picasso dice perché, nel punto esatto in cui la dimostrazione cade: la soluzione ha la stessa forma «<i>eccettuato il caso in cui $H(t_1)$ e $H(t_2)$ commutano per ogni $t_1,t_2$</i>». Se le hamiltoniane a istanti diversi non commutano, <b>non si può nemmeno scrivere l&rsquo;esponenziale dell&rsquo;integrale</b>, perché l&rsquo;esponenziale di una somma di operatori non commutanti non è il prodotto degli esponenziali.</p>
   <p>Ciò che resta valido anche lì è l&rsquo;equazione differenziale, l&rsquo;hermiticità, e quindi l&rsquo;unitarietà. <i>Questo è il motivo per cui la forma differenziale della dinamica è più fondamentale della forma integrata</i>, e non solo più comoda: la seconda è un caso particolare della prima, e il caso particolare è «$H$ non dipende dal tempo».</p>`},
   {label:'La legge di gruppo, controllata su un autostato', body:R`
   <p>Vale verificare la legge di gruppo dove si può fare il conto, cioè su un autovettore dell&rsquo;energia. Se $H|E_n\rangle=E_n|E_n\rangle$, allora l&rsquo;operatore $U(t)=e^{-iHt/\hbar}$ agisce su $|E_n\rangle$ moltiplicandolo per un numero, e la legge di gruppo diventa un&rsquo;identità fra esponenziali complessi:</p>
   $$e^{-iE_nt_1/\hbar}e^{-iE_nt_2/\hbar}=e^{-iE_n(t_1+t_2)/\hbar}.$$
   <p>Il modulo di ciascun fattore è uno, perché $E_n$ è reale — ed è qui che l&rsquo;hermiticità di $H$ si traduce in conservazione della probabilità nel modo più diretto: <b>un autovalore reale dà una fase, un autovalore con parte immaginaria darebbe una crescita o uno smorzamento</b>. La derivata, che servirà fra poco, è</p>
   $$\frac{d}{dt}e^{-iE_nt/\hbar}=-\frac{iE_n}{\hbar}e^{-iE_nt/\hbar}.$$
   <p>Si tenga presente l&rsquo;ordine logico: questa verifica usa che lo spettro di $H$ sia noto, mentre il teorema di Stone non lo usa. <i>Il teorema vale anche per un&rsquo;hamiltoniana di cui non si sa risolvere il problema agli autovalori</i>, ed è per questo che si può costruire la dinamica prima di saper risolvere un solo sistema concreto.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Perché la legge di composizione $U(t_1)U(t_2)=U(t_1+t_2)$ vale solo per forze indipendenti dal tempo, se la composizione $U(t_2,t_1)U(t_1,t_0)=U(t_2,t_0)$ vale sempre?`,
    a:R`Perché sono due affermazioni diverse. La seconda dice che evolvere in due passi è come evolvere in uno, e vale qualunque sia la dipendenza di $H$ dal tempo: è solo la consistenza della definizione. La prima dice in più che <b>l&rsquo;operatore dipende solo dalla durata e non dall&rsquo;istante di partenza</b>, cioè che $U(t_2,t_1)=U(t_2-t_1)$, e questa è un&rsquo;omogeneità del tempo che un&rsquo;hamiltoniana dipendente da $t$ rompe per costruzione. Un atomo investito da un impulso laser evolve diversamente se l&rsquo;impulso arriva prima o dopo, pur evolvendo consistentemente in entrambi i casi. <i>La conseguenza tecnica è che senza omogeneità il teorema di Stone non si applica</i>, perché non c&rsquo;è nessun gruppo a un parametro di cui prendere il generatore.`},
   {q:R`Il teorema di Stone dà $U(t)=e^{iKt}$ con $K$ autoaggiunto. Perché allora si scrive $K=-H/\hbar$ e non semplicemente $K=H$, assorbendo tutto in una ridefinizione?`,
    a:R`Perché $K$ e $H$ hanno dimensioni diverse, e la differenza non è cosmetica. L&rsquo;argomento di un esponenziale deve essere adimensionale, quindi $[K]=[\text{tempo}]^{-1}$: $K$ è una <i>frequenza</i>. L&rsquo;hamiltoniana invece è un&rsquo;energia, perché deve ridursi alla funzione di Hamilton classica nel limite appropriato. La costante che converte le due è $\hbar$, e questo è lo stesso ruolo che $\hbar$ gioca fra il generatore delle traslazioni (un numero d&rsquo;onda) e l&rsquo;impulso. <b>Si potrebbe lavorare con $K$ e non nominare mai l&rsquo;energia</b>, e in effetti tutta la struttura del gruppo di Galilei si scrive così: ma allora il confronto con la meccanica classica — che è l&rsquo;unico modo di sapere <i>quale</i> operatore sia l&rsquo;hamiltoniana di un dato sistema — non si potrebbe fare. <i>$\hbar$ entra nella teoria esattamente dove i generatori geometrici incontrano le variabili dinamiche</i>, e qui è una di quelle volte.`},
   {q:R`Se $U$ deve conservare i prodotti scalari, perché non potrebbe essere antiunitario, come il teorema di Wigner ammette?`,
    a:R`Perché la famiglia è <b>continua</b> e contiene l&rsquo;identità. L&rsquo;argomento è quello della radice quadrata: $U(t)=U(t/2)U(t/2)$, e il prodotto di due operatori antiunitari è unitario, quindi ogni $U(t)$ è il quadrato di qualcosa e dunque unitario qualunque cosa sia $U(t/2)$. Inoltre $U(0)=1$ è unitario, e per continuità non si può passare da unitario ad antiunitario senza salto. <i>Il ramo antiunitario resta necessario per le simmetrie discrete</i> — l&rsquo;inversione temporale $t\to-t$, che non è un elemento di nessuna famiglia continua, è antiunitaria — ma non ha niente a che fare con l&rsquo;evoluzione temporale, che è il flusso continuo generato da $H$. <b>Le due cose si chiamano entrambe «tempo» e sono oggetti matematici di specie diversa.</b>`}
  ]}
]},

/* ---------------- 02 · L'EQUAZIONE DI SCHRÖDINGER COME COROLLARIO ---------------- */
{ num:'02', title:'L’equazione di Schrödinger come corollario, e la conservazione della probabilità', meta:'derivare l’esponenziale · la forma operatoriale · la rappresentazione delle coordinate · l’equazione di continuità e la corrente',
  blocchi:[
  {t:'prosa', title:'Che cosa significa che l’equazione «si ottiene»', tag:'architettura', html:R`
  <p>Nel corso tipico l&rsquo;equazione di Schrödinger compare come postulato, giustificata per analogia con l&rsquo;equazione delle onde e con la relazione di de Broglie. Qui compare come <i>derivata</i>, nel senso letterale: si prende la soluzione già nota in forma esponenziale e la si deriva rispetto al tempo. Vale essere chiari su che cosa questo dimostri e che cosa no. <b>Non dimostra la meccanica quantistica</b>: le ipotesi sono state fatte nella tappa precedente, e sono lì che va guardato il contenuto fisico. Dimostra che l&rsquo;equazione d&rsquo;onda non è <i>un&rsquo;assunzione in più</i> — è la forma infinitesima di assunzioni già fatte, e una volta che si accetta che il tempo sia una simmetria continua non resta nessuna libertà su quale equazione scrivere.</p>`},
  {t:'reveal', title:'Dalla forma integrata alla forma differenziale', tag:'costruzione', steps:[
   {label:'La derivazione, e la nota tecnica di Picasso che vale leggere', body:R`
   <p>Si parte da</p>
   $$|A,t\rangle=e^{-iHt/\hbar}\,|A,0\rangle$$
   <p>e si deriva rispetto a $t$. Picasso, in un inciso che è più importante di quanto sembri, spiega perché si può derivare l&rsquo;esponenziale con le regole ordinarie: «<i>per la derivata dell&rsquo;operatore $e^{-iHt/\hbar}$ si possono seguire le ordinarie regole di derivazione come se $H$ fosse un numero: difatti nell&rsquo;espressione $e^{-iHt/\hbar}$ non c&rsquo;è nulla che non commuti con $H$</i>» (pag. 151).</p>
   <p><b>Questa è la condizione esatta, e va isolata perché è la fonte di quasi tutti gli errori di calcolo con gli esponenziali di operatori.</b> La regola $de^{A(t)}/dt=A'(t)e^{A(t)}$ è valida quando $A(t)$ commuta con $A'(t)$, e qui lo fa perché $A=-iHt/\hbar$ e $A'=-iH/\hbar$ differiscono per un numero. Appena nell&rsquo;esponente compare qualcosa che non commuta con $H$ — per esempio un&rsquo;hamiltoniana dipendente dal tempo — la regola cade, ed è lo stesso motivo per cui lì non esiste forma chiusa.</p>
   <p>Fatta la derivata e moltiplicato per $i\hbar$:</p>
   $$i\hbar\frac{d}{dt}|A,t\rangle=H\,|A,t\rangle.$$
   <p>È l&rsquo;<b>equazione di Schrödinger dipendente dal tempo</b>.</p>`},
   {label:'Perché l’equazione è più generale della soluzione da cui viene', body:R`
   <p>Qui c&rsquo;è il punto logico che vale il paragrafo. L&rsquo;equazione è stata dedotta da una formula valida solo per forze indipendenti dal tempo, ma Picasso osserva che essa «<i>contrariamente alla (9.6), mantiene la sua validità anche nel caso di forze dipendenti dal tempo</i>»: in quel caso $H$ dipende esplicitamente dal parametro numerico $t$, e l&rsquo;equazione continua a dire quale sia la derivata dello stato.</p>
   <p>Questo è il rovescio esatto di come si procede di solito. <i>Si è usata un&rsquo;ipotesi forte per arrivare a un&rsquo;equazione che non ne ha bisogno</i>, e poi si è buttata l&rsquo;ipotesi. L&rsquo;operazione è legittima perché a questo punto l&rsquo;equazione si può assumere come definizione della dinamica, e il caso stazionario ne diventa una conseguenza invece che il presupposto — che è, non a caso, l&rsquo;ordine in cui Ballentine la presenta.</p>
   <p>Si noti inoltre che è un&rsquo;equazione <b>del primo ordine</b> nel tempo, e che questo è un fatto fisico e non una scelta: significa che lo stato iniziale determina tutto il futuro senza bisogno di una «velocità iniziale». L&rsquo;equazione delle onde classica è del secondo ordine e richiede due dati iniziali; qui ne basta uno, e la ragione è che la funzione d&rsquo;onda è <i>complessa</i> e porta già in sé l&rsquo;informazione che in meccanica classica sta nell&rsquo;impulso.</p>`},
   {label:'La forma operatoriale, che serve subito', body:R`
   <p>Lo stesso conto, fatto senza applicare nulla a un ket particolare, dà un&rsquo;equazione per l&rsquo;operatore. Si scrive l&rsquo;equazione di Schrödinger per $|A,t\rangle=U(t)|A,0\rangle$:</p>
   $$i\hbar\frac{d}{dt}U(t)\,|A,0\rangle=H(t)\,U(t)\,|A,0\rangle,$$
   <p>e siccome $|A,0\rangle$ è arbitrario — Picasso aggiunge, con l&rsquo;onestà che conviene imitare, «<i>ignorando, come al solito, i domain problems</i>» — i due operatori coincidono:</p>
   $$i\hbar\frac{d}{dt}U(t)=H(t)\,U(t).$$
   <p>È la stessa equazione che Ballentine prende come punto di partenza, e servirà due volte: nella tappa 05 per derivare l&rsquo;equazione di Heisenberg, e nella 07 per il teorema di conservazione. <b>L&rsquo;avvertenza sui «domain problems» non è una formalità</b>: un operatore non limitato come $H$ non è definito su tutto lo spazio di Hilbert, e «per ogni ket» significa in realtà «per ogni ket di un insieme denso nel dominio». La conclusione resta, ma è il tipo di dettaglio che distingue un&rsquo;identità dimostrata da una scritta.</p>`}
  ]},
  {t:'reveal', title:'In rappresentazione delle coordinate, e la conservazione della probabilità', tag:'costruzione', steps:[
   {label:'L’equazione d’onda', body:R`
   <p>Proiettando sull&rsquo;autobase impropria della posizione, con $\psi(x,t)=\langle x|A,t\rangle$ e $\hat p\to-i\hbar\,\partial/\partial x$, l&rsquo;equazione diventa un&rsquo;equazione alle derivate parziali:</p>
   $$i\hbar\frac{\partial\psi(x,t)}{\partial t}=-\frac{\hbar^{2}}{2m}\frac{\partial^{2}\psi}{\partial x^{2}}+V(x,t)\,\psi(x,t).$$
   <p>Che l&rsquo;operatore cinetico agisca così si controlla sull&rsquo;onda piana, dove il conto è esatto:</p>
   $$-\frac{\hbar^{2}}{2m}\frac{d^{2}}{dx^{2}}e^{ikx}=\frac{\hbar^{2}k^{2}}{2m}e^{ikx},$$
   <p>cioè l&rsquo;onda piana è autofunzione dell&rsquo;energia cinetica con autovalore $\hbar^{2}k^{2}/2m$ — la relazione di dispersione non relativistica, che qui esce dal formalismo e non si postula.</p>`},
   {label:'L’equazione di continuità, e che cosa misura la corrente', body:R`
   <p>Si moltiplichi l&rsquo;equazione d&rsquo;onda per $\psi^{*}$, si prenda la coniugata moltiplicata per $\psi$, e si sottragga. I termini con $V$ si cancellano — <i>purché $V$ sia reale</i>, che è l&rsquo;hermiticità di $H$ vista da vicino — e restano le derivate seconde, che si riscrivono come derivata di un flusso. Il risultato è</p>
   $$\frac{\partial\rho}{\partial t}+\nabla\cdot\mathbf J=0$$
   <p>con $\rho=|\psi|^{2}$ la densità di probabilità e</p>
   $$\mathbf J=\frac{\hbar}{2im}\big(\psi^{*}\nabla\psi-\psi\nabla\psi^{*}\big)$$
   <p>la densità di corrente di probabilità. Picasso la chiama per quello che è: «<i>una equazione di conservazione, analoga all&rsquo;equazione di conservazione della carica</i>», che «<i>esprime la conservazione della probabilità</i>».</p>
   <p>Vale valutarla su un&rsquo;onda piana $\psi=e^{i(kx-\omega t)}$, dove dà il risultato che chiarisce il significato della formula:</p>
   $$\frac{\hbar}{2im}\Big(\psi^{*}\frac{\partial\psi}{\partial x}-\psi\frac{\partial\psi^{*}}{\partial x}\Big)=\frac{\hbar k}{m}.$$
   <p>Cioè <b>la corrente è la densità (qui uguale a uno) per la velocità $\hbar k/m=p/m$</b>: è esattamente la struttura di una corrente di materia in fluidodinamica, densità per velocità. E si noti perché la formula ha quella forma con la differenza fra $\psi^{*}\psi'$ e il suo coniugato: serve a estrarre la <i>parte immaginaria</i> di $\psi^{*}\nabla\psi$, e una funzione d&rsquo;onda reale ha corrente nulla. <i>Una funzione d&rsquo;onda reale descrive uno stato in cui niente si muove</i> — ed è la ragione per cui gli stati legati unidimensionali, che si possono sempre scegliere reali, non trasportano corrente.</p>`}
  ]},
  {t:'plot', title:'La corrente è densità per velocità: due onde con lo stesso modulo e corrente diversa',
   intro:R`<p>A sinistra, le parti reale e immaginaria di un pacchetto gaussiano in moto, $\psi(x)=e^{-x^{2}/2}e^{3ix}$: il modulo è la gaussiana, la fase ruota. A destra, la densità $|\psi|^{2}$ (identica per i due casi) e la densità di corrente $J(x)=\hbar k|\psi|^{2}/m$ con $k=3$ e con $k=0$, in unità in cui $\hbar=m=1$.</p>`,
   plots:[{kind:'func2d', xr:[-3.2,3.2], yr:[-1.2,1.2], height:250, ticks:true,
     title:'parte reale e immaginaria del pacchetto in moto',
     curves:[{f:'Math.exp(-x*x/2)*Math.cos(3*x)', col:'#5aa9ff', width:2.2, label:'Re ψ'},
             {f:'Math.exp(-x*x/2)*Math.sin(3*x)', col:'#ff6b8a', width:2.2, label:'Im ψ'},
             {f:'Math.exp(-x*x/2)', col:'#6bdc9b', width:1.6, dash:true, label:'|ψ|'}],
     xlabel:'x', ylabel:'ψ'},
    {kind:'func2d', xr:[-3.2,3.2], yr:[-0.3,3.3], height:250, ticks:true,
     title:'densità e corrente: lo stesso modulo, due correnti',
     curves:[{f:'Math.exp(-x*x)', col:'#6bdc9b', width:2.2, label:'ρ = |ψ|²'},
             {f:'3*Math.exp(-x*x)', col:'#ffc24a', width:2.4, label:'J con k = 3'},
             {f:'0', col:'#8aa0b8', width:1.8, dash:true, label:'J con k = 0 (ψ reale)'}],
     xlabel:'x', ylabel:'ρ, J'}],
   leggi:R`<p><b>Che cosa guardare.</b> Nel riquadro di sinistra le due curve oscillanti hanno la stessa inviluppante — la gaussiana verde — e sono sfasate di un quarto di periodo: è il modo in cui si vede una fase $e^{ikx}$ in un grafico reale. Nel riquadro di destra la curva verde è la stessa in tutti e due i casi considerati, mentre la corrente è tre volte più alta con $k=3$ ed esattamente nulla con $k=0$.</p>
   <p><b>Che cosa impararne.</b> <i>La densità di probabilità non contiene tutta l&rsquo;informazione sullo stato.</i> Due funzioni d&rsquo;onda con lo stesso $|\psi|$ e fasi diverse descrivono situazioni fisiche diverse — una ferma e una in moto — e ciò che le distingue è la corrente, cioè il gradiente della fase. È la ragione per cui la funzione d&rsquo;onda deve essere complessa: una teoria con $\psi$ reale potrebbe descrivere dove si trova la particella, non dove sta andando. Si noti anche il legame con l&rsquo;equazione di continuità: qui $J$ è costante in $x$ rispetto a $\rho$ a meno del fattore $\hbar k/m$, quindi $\nabla\cdot\mathbf J$ è non nullo e la densità effettivamente cambia nel tempo — il pacchetto si muove, come deve.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`L&rsquo;equazione di continuità è stata dedotta assumendo $V$ reale. Che cosa succede se si scrive un potenziale complesso, come si fa in certi modelli di assorbimento?`,
    a:R`La probabilità smette di conservarsi, ed è esattamente l&rsquo;effetto che quei modelli vogliono. Se $V=V_R-iV_I$ con $V_I>0$, i termini con il potenziale non si cancellano più nella sottrazione e lasciano un termine di sorgente: $\partial\rho/\partial t+\nabla\cdot\mathbf J=-2V_I\rho/\hbar$, cioè la probabilità totale decresce esponenzialmente con tasso $2V_I/\hbar$. <b>Un potenziale complesso è un modo di dire «la particella sparisce da questo problema»</b> — assorbita, o uscita da un canale che non si sta descrivendo. Il legame con la struttura di questa tappa è diretto: $V$ complesso significa $H$ non hermitiana, quindi $U$ non unitaria, quindi norma non conservata. <i>Le tre cose sono la stessa cosa detta a tre livelli</i>, e il conto di Ballentine sulla derivata di $U^{\dagger}U$ lo dimostra in una riga.`},
   {q:R`Se l&rsquo;equazione di Schrödinger è del primo ordine nel tempo e del secondo nello spazio, come può essere compatibile con la relatività, dove spazio e tempo stanno sullo stesso piano?`,
    a:R`<b>Non lo è, e non pretende di esserlo</b>: l&rsquo;equazione scritta qui è non relativistica, e lo si vede proprio dall&rsquo;asimmetria fra gli ordini di derivazione. Il motivo strutturale sta a monte di questa tappa: il gruppo che si è usato per costruire i generatori è quello di Galilei, non quello di Poincaré, e nel gruppo di Galilei il tempo è un parametro assoluto mentre nelle trasformazioni di Lorentz si mescola con lo spazio. La relazione di dispersione $E=\hbar^{2}k^{2}/2m$ verificata qui sopra è quella newtoniana, non $E^{2}=p^{2}c^{2}+m^{2}c^{4}$. <i>Le equazioni relativistiche si ottengono rifacendo questo stesso cammino con l&rsquo;altro gruppo</i> — Klein-Gordon dal caso scalare, Dirac dal caso spinoriale — e in entrambe le derivate temporale e spaziale compaiono allo stesso ordine.`}
  ]}
]},

/* ---------------- 03 · STATI STAZIONARI ---------------- */
{ num:'03', title:'Gli stati stazionari sono tutti e soli gli autostati dell’energia', meta:'una dimostrazione nei due versi · il fattore di fase è inosservabile · nessun valor medio si muove · perché lo spettro continuo rovina l’enunciato',
  blocchi:[
  {t:'prosa', title:'Che cosa si vuole dimostrare, e perché non è ovvio', tag:'architettura', html:R`
  <p>Uno stato si dice <b>stazionario</b> se non cambia nel tempo. Scritto così sembra una definizione vuota, e la cura sta nel ricordare che <i>lo stato non è il vettore</i>: due vettori che differiscono per un fattore complesso non nullo rappresentano lo stesso stato. Quindi la condizione corretta è che $|A,t\rangle$ e $|A,0\rangle$ siano proporzionali per ogni $t$,</p>
  $$|A,t\rangle=C(t)\,|A,0\rangle,$$
  <p>con $C(t)$ un numero che può dipendere dal tempo. Picasso la scrive così (sua 9.11) e dimostra il teorema:</p>
  <p><b>Gli stati stazionari del sistema sono tutti e soli gli autostati di $H$.</b></p>
  <p>Il verso facile è immediato, e quasi ogni testo si ferma lì. Il verso difficile — che <i>soltanto</i> gli autostati lo siano — è quello che dà informazione, perché esclude che possano esistere altre configurazioni ferme, e la sua dimostrazione è un piccolo capolavoro di economia che vale seguire per intero.</p>`},
  {t:'reveal', title:'La dimostrazione, nei due versi', tag:'costruzione', steps:[
   {label:'Verso facile: gli autostati sono stazionari', body:R`
   <p>Sia $H|E\rangle=E|E\rangle$. L&rsquo;operatore di evoluzione è una funzione di $H$, e una funzione di un operatore agisce su un suo autovettore moltiplicando per la stessa funzione dell&rsquo;autovalore:</p>
   $$U(t)\,|E\rangle=e^{-iHt/\hbar}|E\rangle=e^{-iEt/\hbar}|E\rangle.$$
   <p>Il vettore si moltiplica per un numero di modulo uno, dunque la sua <i>direzione</i> nello spazio di Hilbert non cambia, dunque lo stato è lo stesso. <b>Il fattore $e^{-iEt/\hbar}$ non è osservabile</b> perché è una fase globale, e una fase globale cade in ogni prodotto scalare contro sé stessa.</p>`},
   {label:'Verso difficile: solo gli autostati lo sono', body:R`
   <p>Sia ora $|A,t\rangle=C(t)|A,0\rangle$ con $C(t)$ generico, e si inserisca questa forma nell&rsquo;equazione di Schrödinger. A sinistra la derivata temporale agisce solo su $C$, perché $|A,0\rangle$ è un vettore fisso; a destra $H$ agisce solo sul ket. Si ottiene</p>
   $$i\hbar\dot C(t)\,|A,0\rangle=C(t)\,H\,|A,0\rangle,$$
   <p>e dividendo per $C(t)$, che non è nullo perché lo stato esiste,</p>
   $$i\hbar\frac{\dot C(t)}{C(t)}|A,0\rangle=H|A,0\rangle.$$
   <p>Ora l&rsquo;argomento, e sta tutto in una frase di Picasso: «<i>Siccome il secondo membro non dipende da $t$, lo stesso deve valere per il primo</i>». Dunque la quantità $i\hbar\dot C/C$ è una <b>costante</b>, che si chiama $E$; e sostituendola si ottiene $H|A,0\rangle=E|A,0\rangle$, cioè $|A,0\rangle$ è autovettore di $H$.</p>
   <p>È il tipo di argomento che vale imparare come schema, perché ricorre: <i>un&rsquo;uguaglianza in cui un membro dipende da una variabile e l&rsquo;altro no forza entrambi a essere costanti</i>. È lo stesso passaggio con cui si separano le variabili in un&rsquo;equazione alle derivate parziali, ed è la ragione profonda per cui la «separazione delle variabili» in meccanica quantistica produce sempre un problema agli autovalori dell&rsquo;energia.</p>
   <p>Resta da trovare $C$. L&rsquo;equazione $i\hbar\dot C=EC$ con $C(0)=1$ si integra subito:</p>
   $$C(t)=e^{-iEt/\hbar},$$
   <p>in accordo con il verso facile — <b>e il cerchio si chiude</b>: la dimostrazione del verso difficile ha riprodotto esattamente il fattore di fase del verso facile, il che è un controllo di consistenza che non costa niente e che vale sempre fare.</p>`},
   {label:'La conseguenza: in uno stato stazionario niente si muove', body:R`
   <p>Se lo stato non cambia, nessuna misura può dare un risultato che dipende dal tempo. Vale verificarlo sul formalismo, perché il meccanismo per cui accade è istruttivo. Il valor medio di un&rsquo;osservabile $\hat R$ sullo stato al tempo $t$ è</p>
   $$\langle R\rangle_t=\langle A,t|\hat R|A,t\rangle=\langle A,0|U^{\dagger}(t)\,\hat R\,U(t)|A,0\rangle,$$
   <p>e su un autostato dell&rsquo;energia i due operatori di evoluzione diventano numeri coniugati fra loro:</p>
   $$\langle E_n|e^{+iE_nt/\hbar}\,\hat R\,e^{-iE_nt/\hbar}|E_n\rangle=\langle E_n|\hat R|E_n\rangle.$$
   <p>Le due fasi si cancellano. <b>Si noti che questo non usa niente su $\hat R$</b>: vale per <i>ogni</i> osservabile, inclusa una che non commuta con $H$. Ballentine lo rinforza osservando che lo stesso argomento applicato a tutte le funzioni di $\hat R$ dà di più: «<i>In a stationary state the averages and probabilities of all dynamical variables are independent of time</i>» — non solo le medie, ma le intere distribuzioni di probabilità.</p>
   <p>Dirac arriva alla stessa conclusione con un&rsquo;enfasi diversa, e vale la citazione perché mette l&rsquo;accento sull&rsquo;osservazione invece che sul formalismo: «<i>La probabilità di ottenere un risultato particolare facendo un&rsquo;osservazione su di esso è indipendente dall&rsquo;istante in cui si compie l&rsquo;osservazione stessa</i>» (pag. stampata 161).</p>`}
  ]},
  {t:'reveal', title:'Dove l’enunciato si incrina: spettro continuo, e oscillatori che oscillano', tag:'esempio', steps:[
   {label:'Se H ha solo spettro continuo, non c’è nessuno stato stazionario', body:R`
   <p>Picasso mette l&rsquo;avvertenza nel punto giusto, cioè subito dopo aver detto che la stazionarietà è quasi più importante dell&rsquo;evoluzione: «<i>per esempio, se $H$ ha solo autovalori continui, non esistono autostati propri e quindi nessuno stato è rigorosamente stazionario</i>».</p>
   <p>Il motivo è che un&rsquo;autofunzione dello spettro continuo non è normalizzabile e quindi non rappresenta uno stato fisico. Una particella libera non ha stati stazionari: ogni stato normalizzabile è una sovrapposizione di onde piane con un intervallo di energie, e <b>una sovrapposizione di autostati con energie diverse non è stazionaria</b> — è esattamente il caso della tappa seguente. L&rsquo;onda piana $e^{ikx}$ sembra stazionaria perché il suo modulo quadro è costante, ma non è uno stato: è un oggetto improprio, utile come elemento di base, con norma infinita.</p>
   <p>Il modo corretto di dirlo è che <i>la stazionarietà rigorosa è un privilegio dello spettro discreto</i>, e che per lo spettro continuo esistono solo stati approssimativamente stazionari per tempi lunghi quanto si vuole ma finiti — che è precisamente ciò di cui parlerà la tappa sul decadimento.</p>`},
   {label:'Anche con spettro discreto, gli stati stazionari non sono tutto', body:R`
   <p>Picasso fa l&rsquo;osservazione con una battuta che vale ricordare: anche se $H$ ha solo autovalori discreti, «<i>non esistono solo gli stati stazionari: gli oscillatori possono ben oscillare!</i>».</p>
   <p>Il caso è l&rsquo;oscillatore armonico unidimensionale, con $E_n=\hbar\omega(n+\tfrac12)$. Uno stato generico si sviluppa come $|A,0\rangle=\sum_n a_n|n\rangle$ ed evolve in</p>
   $$|A,t\rangle=e^{-i\omega t/2}\sum_n a_n\,e^{-in\omega t}|n\rangle.$$
   <p>Dopo un periodo classico $T=2\pi/\omega$ ogni fattore $e^{-in\omega T}$ vale uno, mentre il fattore globale $e^{-i\omega T/2}$ vale $-1$. Picasso: «<i>quindi lo stato è tornato lo stesso, anche se il vettore ha cambiato di segno: in effetti il fattore di fase comune è del tutto ininfluente</i>». <b>L&rsquo;evoluzione degli stati non stazionari dell&rsquo;oscillatore è periodica con lo stesso periodo del moto classico</b>, il che è un&rsquo;eccezione fortunata dovuta al fatto che i livelli sono equispaziati.</p>`},
   {label:'Il caso a periodo dimezzato, che non ha analogo classico', body:R`
   <p>Se però nello sviluppo sono accesi <i>solo</i> i coefficienti con $n$ pari (funzione d&rsquo;onda pari) o solo quelli con $n$ dispari (funzione dispari), allora le fasi $e^{-in\omega t}$ si ripetono già dopo mezzo periodo, e il periodo dello stato è $T/2$. Picasso: «<i>questo fatto, come del resto l&rsquo;esistenza di stati stazionari, non ha analogo classico</i>».</p>
   <p>Il conto generale dopo mezzo periodo è più interessante del caso particolare. Per uno stato qualsiasi,</p>
   $$|A,t+T/2\rangle=e^{-i\pi/2}\sum_n a_n(-1)^{n}|n\rangle,$$
   <p>e siccome l&rsquo;operatore di inversione spaziale $I$ agisce sugli autostati dell&rsquo;oscillatore come $I|n\rangle=(-1)^{n}|n\rangle$ — i <span class="str" data-str="polinomi-di-hermite">polinomi di Hermite</span> hanno la parità del loro grado — la somma a destra è $I|A,t\rangle$. Quindi</p>
   $$|A,t+T/2\rangle=-i\,I\,|A,t\rangle,$$
   <p>cioè la funzione d&rsquo;onda dopo mezzo periodo è, a meno della fase $-i$, la riflessa rispetto all&rsquo;origine. <b>Il sottoprodotto è notevole e Picasso lo isola</b>: siccome l&rsquo;evoluzione per mezzo periodo di un oscillatore <i>qualunque</i> realizza l&rsquo;inversione spaziale, se ne ricava una rappresentazione dell&rsquo;operatore di parità che non dipende dal sistema,</p>
   $$I=i\,e^{-i\pi\left(\hat p^{2}/(m\hbar\omega)+m\omega\hat x^{2}/\hbar\right)/2}\quad\text{con }m\text{ e }\omega\text{ arbitrari}.$$
   <p><i>Si legga che cosa dice</i>: la riflessione dello spazio si può ottenere lasciando evolvere il sistema per mezzo periodo in un oscillatore armonico fittizio, qualunque siano la massa e la frequenza scelte. È un esempio di come una simmetria discreta possa essere realizzata da un elemento di un gruppo continuo — e dell&rsquo;arbitrarietà dei parametri si può fare un controllo: il risultato non deve dipendere da $m$ e $\omega$, e infatti non ne dipende, perché il mezzo periodo si riscala insieme a loro.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Se in uno stato stazionario nessun valor medio dipende dal tempo, in che senso l&rsquo;elettrone dell&rsquo;atomo di idrogeno nello stato fondamentale «si muove»?`,
