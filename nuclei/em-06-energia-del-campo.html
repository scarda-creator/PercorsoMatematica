function typeset(el){

/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un
   rimando scritto nella prosa:

       <span class="str" data-str="serie-geometrica">la serie geometrica</span>

   Le schede citate da questo nucleo sono cucite qui sotto dal montaggio
   (assembla-nucleo.js): la pagina resta autosufficiente — niente fetch,
   niente sottocartelle da pubblicare — e un rimando a una scheda che non
   esiste FERMA la costruzione invece di arrivare in pagina rotto.
   Apertura: lo stesso gesto del collaudo (si clicca, il pannello compare,
   si typeset una volta sola), portato dentro la frase.
   =================================================================== */
var CORSO = 'elettromagnetismo';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};


function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';
  return h;
}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

/* ---------------- 00 · DI COSA PARLA QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Di cosa parla questo movimento', meta:'Elettromagnetismo · voce B.1 · 60 prove · la domanda e interpretativa, e la risposta cambia la fisica',
  blocchi:[
  {t:'prosa', title:'Una domanda che sembra oziosa e non lo e', tag:'architettura', html:R`
  <p>Per mettere insieme un sistema di cariche bisogna fare lavoro contro le forze elettriche, e quel lavoro resta immagazzinato: si può riprendere lasciando che il sistema si smonti. Fin qui nessuna sorpresa. La domanda è <b>dove</b> stia quell&rsquo;energia mentre il sistema è fermo.</p>
  <p>Ci sono due risposte, e <b>danno sempre lo stesso numero</b>:</p>

  </ul>
  <p>In elettrostatica la scelta è indifferente e sembra questione di gusto. <b>Smette di esserlo con i campi variabili</b>: quando un&rsquo;onda elettromagnetica viaggia nel vuoto, trasporta energia in una regione dove di cariche non ce n&rsquo;è nessuna. A quel punto l&rsquo;unica descrizione che regge è la seconda, e questo movimento è dove la si adotta.</p>`}

  dove $V_i$ è il potenziale prodotto in $i$ da <b>tutte le altre</b> cariche.</p>

{ num:'02', title:'Lenergia nel campo: la stessa energia, riattribuita allo spazio', meta:'la densita u · lintegrale su TUTTO lo spazio · il condensatore come verifica',
  blocchi:[
  {t:'prosa', title:'La riscrittura, e cosa cambia', tag:'idea', html:R`
  <p>Partendo da $W=\frac12\int\rho V\,dV$, si sostituisce $\rho=\varepsilon_0\nabla\cdot\vec E$, si integra per parti e si manda la superficie all&rsquo;infinito (dove il contributo svanisce, perché $V\sim1/r$ ed $E\sim1/r^2$ mentre la superficie cresce come $r^2$). Resta
  $$W=\int_{\text{tutto lo spazio}}\frac{\varepsilon_0E^{2}}{2}\,dV,\qquad u=\frac{\varepsilon_0E^{2}}{2}.$$
  <b>Due cose sono cambiate</b>, e vanno notate entrambe. Primo: l&rsquo;integrale è su <b>tutto lo spazio</b>, non sulla regione dove ci sono cariche — l&rsquo;energia sta anche nel vuoto. Secondo: $u$ è <b>definita positiva</b>, mentre l&rsquo;energia di due cariche opposte è negativa. Non è una contraddizione: nel conto col campo l&rsquo;energia negativa viene dal fatto che il campo totale in mezzo è <i>più piccolo</i> della somma dei due separati, quindi il totale è minore delle due autoenergie prese a parte.</p>`},
  {t:'prosa', title:'Il condensatore, che verifica tutto in due righe', tag:'regola operativa', html:R`
  <p>In un condensatore piano il campo è uniforme fra le armature e nullo fuori. Allora l&rsquo;integrale è banale: densità per volume,
  $$W=\frac{\varepsilon_0E^{2}}{2}\cdot(Ad),$$
  e sostituendo $E=\Delta V/d$ e $C=\varepsilon_0A/d$ si ritrova $W=\frac12C\Delta V^{2}$, <b>la stessa formula ottenuta in em-04 caricando poco per volta</b>. Due strade completamente diverse — una contabilità sul lavoro fatto dal generatore, una somma di energia sparsa nello spazio — che danno lo stesso numero. <b>È questa coincidenza che rende credibile l&rsquo;idea che l&rsquo;energia stia davvero nel campo.</b></p>`}
]},

   <p><b>Secondo</b>: per un <b>guscio</b> sferico (tutta la carica sulla superficie, campo interno nullo) resta solo il pezzo esterno, $W=\frac{Q^{2}}{8\pi\varepsilon_0R}$, che è <b>minore</b> di quello della sfera piena. Coerente: a parità di carica e raggio, spingere tutto sulla superficie <i>costa meno</i> che riempire il volume, perché le cariche stanno mediamente più lontane fra loro. <b>Ed è anche il motivo per cui un conduttore lo fa spontaneamente</b>: em-04 diceva che la carica va sulla superficie per un argomento di divergenza; qui si vede che è anche la configurazione di energia minima, che è sempre la stessa cosa detta meglio.</p>`}

/* ---------------- 04 · L'AUTOENERGIA ---------------- */
{ num:'04', title:'Lautoenergia che diverge, e cosa ci dice', meta:'il limite R->0 · perche il conto discreto e quello continuo non coincidono · il raggio classico dellelettrone',
  blocchi:[
  {t:'prosa', title:'La divergenza, e la sua interpretazione', tag:'idea', html:R`
  <p>Se si fa tendere $R\to0$ tenendo $Q$ fissa, l&rsquo;energia $\frac{3Q^{2}}{20\pi\varepsilon_0R}$ <b>diverge</b>. Una carica puntiforme ha energia elettrostatica infinita: il campo va come $1/r^2$, la densità come $1/r^4$, e l&rsquo;integrale $\int u\,4\pi r^2dr$ non converge all&rsquo;origine.</p>
  <p><b>Questa è la ragione profonda per cui i due conti della tappa 00 non coincidono sempre.</b> La formula discreta $\frac12\sum q_iV_i$ esclude l&rsquo;autopotenziale e dà un numero finito; la formula col campo include <b>tutto</b>, autoenergie comprese, e per cariche puntiformi è infinita. Sulla differenza fra due configurazioni — che è ciò che si misura — le autoenergie si <b>cancellano</b>, e i due conti tornano a coincidere. <b>Morale operativa: le energie assolute vanno maneggiate con sospetto, le differenze no.</b></p>
  <p>Storicamente si è provato a prendere sul serio la divergenza: uguagliando $\frac{e^{2}}{4\pi\varepsilon_0r_e}$ a $m_ec^{2}$ si ottiene il <b>raggio classico dell&rsquo;elettrone</b>, $r_e\simeq2{,}8\times10^{-15}$ m. Non è la dimensione dell&rsquo;elettrone — che negli esperimenti risulta puntiforme entro limiti molto più piccoli — ma la scala a cui l&rsquo;elettrostatica classica smette di avere senso da sola. <b>Il problema non si risolve in questo corso</b>: in teoria quantistica dei campi la divergenza resta e viene <i>rinormalizzata</i>, cioè assorbita nella massa osservata. È lo stesso meccanismo che in Metodi hai incontrato come regolarizzazione: una quantità infinita che non è osservabile, e una differenza finita che lo è.</p>`}
]},

/* ---------------- 05 · CON I DIELETTRICI ---------------- */
{ num:'05', title:'Con i dielettrici, e il lavoro sulle armature', meta:'u = D·E/2 · la forza come derivata dellenergia · a carica o a tensione costante',
  blocchi:[
  {t:'prosa', title:'La densita generalizzata', tag:'regola operativa', html:R`
  <p>In presenza di materia la densità di energia diventa
  $$u=\frac12\vec D\cdot\vec E=\frac12\varepsilon_0\varepsilon_rE^{2},$$
  che per $\varepsilon_r=1$ si riduce al caso del vuoto. <b>Attenzione a cosa contiene</b>: questa espressione include il lavoro fatto per <i>polarizzare</i> il materiale, non solo quello per creare il campo. È la ragione per cui con lo stesso campo un dielettrico immagazzina $\varepsilon_r$ volte più energia.</p>`},
  {t:'prosa', title:'Le forze come derivate dellenergia, e il segno', tag:'esame', html:R`
  <p>Il metodo che chiude quasi tutti gli esercizi di questo tipo: si scrive $U$ in funzione di un parametro geometrico $x$ (distanza fra le armature, quanto è inserita una lastra) e si deriva. Ma <b>il segno dipende da cosa si tiene fisso</b>:</p>
  <ul>
   <li><b>a carica costante</b> (condensatore isolato): $F=-\dfrac{\partial U}{\partial x}$. Il sistema è isolato, l&rsquo;energia può solo venire da $U$;</li>
   <li><b>a tensione costante</b> (collegato al generatore): $F=+\dfrac{\partial U}{\partial x}$. Il segno si inverte perché il generatore fornisce anche l&rsquo;energia per mantenere $V$, e nel bilancio completo il suo contributo è il doppio della variazione di $U$.</li>
  </ul>
  <p><b>Il controllo che salva dal segno sbagliato è fisico e non algebrico</b>: la forza su un dielettrico che entra in un condensatore è <i>attrattiva verso l&rsquo;interno</i> in entrambi i casi — il materiale viene risucchiato. Se il tuo conto dà una forza espulsiva, hai usato la regola del caso sbagliato. <b>Fai sempre quel controllo prima di consegnare</b>: è più rapido che ricontrollare la derivata.</p>`}
]},

/* ---------------- 06 · IL SENSO ---------------- */
{ num:'06', title:'Il senso, e le rotte', meta:'cosa chiude, cosa apre, e dove lenergia del campo diventa indispensabile',
  blocchi:[
  {t:'prosa', title:'Cosa lascia in mano', tag:'sintesi', html:R`
  <p><b>A monte.</b> em-03 dava il potenziale, em-04 la pressione elettrostatica $\varepsilon_0E^2/2$, em-05 il fattore $\varepsilon_r$. Qui quei tre pezzi si rivelano <b>lo stesso oggetto</b>: la densità di energia del campo, incontrata prima come pressione e poi come energia immagazzinata.</p>
  <p><b>Il punto.</b> L&rsquo;energia si può attribuire al campo, e in elettrostatica è una scelta. <b>Da em-12 in poi non lo è più</b>: un&rsquo;onda che viaggia nel vuoto trasporta energia senza cariche, e il vettore di Poynting dirà anche in quale direzione. Questo movimento prepara quel passaggio.</p>`},

    {dove:'Meccanica<br>quantistica', txt:R`L&rsquo;energia del vuoto — quella dei modi del campo anche senza fotoni — produce l&rsquo;<b>effetto Casimir</b>, la forza fra due piastre nel vuoto. Il conto si fa sommando $\frac12\hbar\omega$ su tutti i modi, ed è lo stesso tipo di divergenza vista nella tappa 04, regolarizzata con la funzione zeta.`},

   ],

/* ---- renderer dei blocchi ---- */
function sectionProsa(title, tag, html){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var body=elFromHTML('<div class="open-body">'+html+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function sectionGram(title, rows){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag gramtag">grammatica</span></h3>';
  var inner='<table class="gramtab">';
  rows.forEach(function(r){ inner+='<tr><td class="gs">'+r[0]+'</td><td>'+r[1]+'</td></tr>'; });

  var body=elFromHTML('<div class="gramwrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
/* --- blocco PLOT: la figura non decora, si legge. Ogni plot porta una chiave di lettura. --- */
function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}

}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';

}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
    else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
    else if(b.t==='prolessi') m.appendChild(sectionProlessi(b));
    else if(b.t==='reveal')m.appendChild(sectionReveal(b.title,b.tag,b.steps));
    else if(b.t==='esercizio') m.appendChild(sectionEsercizio(b));
    else if(b.t==='collaudo')  m.appendChild(sectionCollaudo(b.title,b.items));
    else if(b.t==='plot')      m.appendChild(sectionPlot(b));
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}
