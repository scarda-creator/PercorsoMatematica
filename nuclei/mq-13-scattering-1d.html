/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un

   =================================================================== */
var CORSO = 'meccanica-quantistica';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["spettro"] = {"nome":"Spettro di un operatore","riga":"Lo spettro di un operatore e' l'insieme dei possibili esiti di una misura — i suoi autovalori — e puo' essere discreto (autovalori separati, autovettori in $\\mathcal H$), continuo (autovalori che riempiono un intervallo, autovettori non normalizzabili), o misto.","serve":"E' la quantita' che la fisica chiede davvero: scrivere l'hamiltoniana e trovarne lo spettro E' il problema d'esame. La distinzione discreto/continuo non e' tecnica — decide se un autostato e' uno stato preparabile (discreto) o una distribuzione che vive fuori dallo spazio di Hilbert (continuo), come l'onda piana e la delta.","esempio":"Per $\\sigma_z=\\begin{pmatrix}1&0\\\\0&-1\\end{pmatrix}$ lo spettro e' $\\{+1,-1\\}$, discreto, e i due invarianti della matrice lo riassumono senza risolvere l'equazione secolare: la somma degli autovalori e' la traccia, $\\operatorname{tr}\\sigma_z=0$, il loro prodotto e' il determinante, $\\det\\sigma_z=-1$. Per l'operatore posizione lo spettro e' tutta la retta reale, continuo, e gli autovettori sono delte di Dirac.","debito":"la costruzione rigorosa dello spettro continuo (teorema spettrale generalizzato, misura spettrale $E(\\lambda)$ di von Neumann) sta fuori da questo percorso: qui si dichiara che esiste e si lavora coi casi concreti. La separazione fra spettro continuo e spettro residuo non si tratta.","controllo":[{"tipo":"uguale","sinistra":"Matrix([[1,0],[0,-1]]).trace()","vale":"0","dove":"esempio","appare":"\\operatorname{tr}\\sigma_z=0"},{"tipo":"uguale","sinistra":"Matrix([[1,0],[0,-1]]).det()","vale":"-1","dove":"esempio","appare":"\\det\\sigma_z=-1"}],"qui":{},"pieno":null};
STRUM["flusso-di-un-campo"] = {"nome":"Flusso di un campo","riga":"L'integrale $\\iint_S\\mathbf F\\cdot\\hat n\\,dS$: quanta parte del campo attraversa la superficie, contata col segno che l'orientazione stabilisce.","serve":"Traduce «quanto passa attraverso» in un numero, e il numero dipende da due scelte che vanno dichiarate entrambe: la superficie e il verso della normale. Su una superficie chiusa la convenzione è normale uscente, e allora un flusso positivo significa che dentro c'è una sorgente netta. Dove il campo è parallelo alla superficie il contributo è nullo: conta solo la componente normale, mai il modulo.","esempio":"Per il campo radiale $\\mathbf F=\\mathbf r$ sulla sfera di raggio $R$ la normale uscente è $\\hat r$, e la componente normale vale $R$ in ogni punto, costante: il flusso è quel valore per l'area, $\\Phi=R\\cdot4\\pi R^{2}=4\\pi R^{3}$. Per $R=2$ fa $32\\pi$.","pieno":{"file":"03-curve-superfici.html","tappa":"04","come":"la definizione, il ruolo dell'orientazione e l'indipendenza dalla parametrizzazione, nel nucleo su curve e superfici"},"qui":{"elettromagnetismo":{"serve":"Il flusso di $\\mathbf E$ attraverso una superficie chiusa è l'unica cosa che la legge di Gauss controlla: dice quanto esce in totale, non quanto vale $\\mathbf E$ punto per punto. Da un solo numero si risale al campo soltanto se si sa già in che direzione punta e da cosa dipende — e quello lo decide la simmetria della distribuzione, non il teorema. Per questo la superficie si sceglie: dove $\\mathbf E$ è costante e normale, il flusso diventa modulo per area.","esempio":"Per una carica puntiforme $q$ al centro di una sfera di raggio $R$ il campo ha modulo $\\dfrac{q}{4\\pi\\varepsilon_0R^{2}}$ ed è ovunque normale alla sfera, quindi $\\Phi=\\dfrac{q}{4\\pi\\varepsilon_0R^{2}}\\cdot4\\pi R^{2}=\\dfrac{q}{\\varepsilon_0}$: il raggio è sparito. È il motivo per cui la legge di Gauss è una legge e non un conto — vale per qualunque superficie chiusa che racchiuda la carica."}},"controllo":[{"tipo":"uguale","sinistra":"R*4*pi*R**2","vale":"4*pi*R**3","dove":"esempio","appare":"4\\pi R^{3}"},{"tipo":"uguale","sinistra":"4*pi*2**3","vale":"32*pi","dove":"esempio","appare":"32\\pi"},{"tipo":"uguale","sinistra":"q/(4*pi*e0*R**2)*4*pi*R**2","vale":"q/e0","dove":"qui.elettromagnetismo.esempio","appare":"\\dfrac{q}{\\varepsilon_0}"},{"tipo":"derivata","espr":"q/(4*pi*e0*R**2)*4*pi*R**2","rispetto":["R"],"vale":"0","dove":"qui.elettromagnetismo.esempio","appare":"il raggio è sparito"}]};
STRUM["elettronvolt"] = {"nome":"Elettronvolt","riga":"L'energia che un elettrone acquista attraversando una differenza di potenziale di un volt: $1\\ \\mathrm{eV}=1{,}602\\cdot10^{-19}$ J; divisa per $c^{2}$ è una massa, $1\\ \\mathrm{eV}/c^{2}=1{,}783\\cdot10^{-36}$ kg.","serve":"A leggere senza conversioni le tabelle in cui la fisica delle particelle e l'astrofisica scrivono le masse a riposo come energie — l'elettrone 0,511 MeV, il protone 938 MeV, il bosone di Higgs 125 GeV. La scelta non è una bizzarria di notazione: in un processo la quantità che si conserva è l'energia, e scrivere la massa già in energia dice a colpo d'occhio quali reazioni sono possibili e quante ne resta per l'energia cinetica o per i fotoni. L'elettronvolt ha anche un secondo mestiere, e in astrofisica è il più usato dei due: convertito in temperatura tramite $k_BT$ dà la scala termica a cui un processo di quella energia diventa frequente, e questo è ciò che permette di dire a che punto della storia dell'universo o a che profondità di una stella un certo processo si accende.","esempio":"Dalla massa del protone espressa come energia, $938{,}3$ MeV, si ricavano i chilogrammi in un passaggio: $m_p=938{,}3\\cdot10^{6}\\cdot1{,}783\\cdot10^{-36}=1{,}673\\cdot10^{-27}$ kg, che è il valore stampato in calce al foglio d'esame. Sul versante termico, $T=\\dfrac{1{,}602\\cdot10^{-19}}{1{,}381\\cdot10^{-23}}=11600$ K: un'energia di un elettronvolt corrisponde a poco più di undicimila kelvin, e siccome ionizzare l'idrogeno costa 13,6 eV si capisce subito perché serva una fotosfera da qualche decina di migliaia di kelvin per trovarlo ionizzato.","pieno":{"file":"as-01-la-scala-del-cosmo.html","tappa":"05","come":"le masse delle particelle elementari scritte come energie, con la conversione in chilogrammi e la gerarchia delle masse, nel movimento sulla scala del cosmo"},"controllo":[{"tipo":"numero","espr":"1.602177e-19/(2.99792458e8)**2*1e36","vale":"1.783","dove":"riga","appare":"1,783\\cdot10^{-36}"} STRUM["delta-di-dirac"] = {"nome":"Delta di Dirac","riga":"Non è una funzione ma un funzionale, definito da $\\int f(x)\\,\\delta(x-a)\\,dx=f(a)$, che composto con una funzione si spezza sui suoi zeri come $\\delta(g(x))=\\sum_i \\delta(x-x_i)/|g'(x_i)|$.","serve":"Serve come macchina per cambiare variabile senza invertire nulla. La densità di $y=f(x)$ si scrive $p_Y(y)=\\int p_X(x)\\,\\delta(y-f(x))\\,dx$, e la delta produce da sola il fattore $1/|f'|$ che altrimenti andrebbe messo a mano: i rami molteplici si contano da soli invece di doverli ricordare. È la ragione pratica per cui il formalismo con la delta compare in ogni soluzione d'esame che tocchi una distribuzione, mentre il cambio di variabile esplicito compare quasi mai.","esempio":"$\\delta(x^2-a^2)$ con $a$ positivo. Gli zeri sono $x=\\pm a$; la derivata dell'argomento è $2x$, che in modulo vale $2a$ su entrambi. Quindi $\\delta(x^2-a^2)=\\dfrac{1}{2a}\\big[\\delta(x-a)+\\delta(x+a)\\big]$. Il caso si ripete identico in fisica statistica con $\\varepsilon=p^2/2m$ in una dimensione, dove i due rami $p=\\pm\\sqrt{2m\\varepsilon}$ contribuiscono entrambi — e dimenticarne uno dimezza la risposta.","pieno":{"file":"15-distribuzioni.html","tappa":"01","come":"le distribuzioni come funzionali, la delta e le sue proprietà, nel nucleo di Metodi"},"qui":{"meccanica-statistica":{"serve":"È lo strumento con cui si calcola la densità degli stati, cioè l'oggetto su cui poggia tutto il secondo tempo del corso: $g(\\varepsilon)=\\int d^dp\\,d^dq\\;\\delta(\\varepsilon-H)/h^d$. L'identità che si usa davvero non è la definizione ma questa: $\\delta(\\varepsilon-H)=\\partial_\\varepsilon\\,\\theta(\\varepsilon-H)$. Si scambia l'integrale con la derivata e ci si ritrova a calcolare il volume della regione dove l'hamiltoniana sta sotto $\\varepsilon$ — un integrale elementare — invece di un integrale con una delta dentro. La $g$ così ottenuta è pura geometria dello spazio delle fasi: non sa nulla della temperatura, e per questo resta identica quando si passa da Boltzmann a Fermi o a Bose.","esempio":"Particella libera in due dimensioni. Il volume della regione $p^2/2m$ sotto $\\varepsilon$ è il disco di area $2\\pi m\\varepsilon$; derivando rispetto a $\\varepsilon$ si ottiene $2\\pi m$, cioè una densità degli stati costante. Non è una curiosità: è la ragione per cui in due dimensioni una particella libera non condensa, e per cui le prove che chiedono la condensazione in $d=2$ mettono sempre un potenziale confinante, che porta la $g$ da costante a crescente."}},"controllo":[{"tipo":"derivata","espr":"x**2-a**2","rispetto":["x"],"vale":"2*x","ipotesi":{"x":"positive","a":"positive"},"dove":"esempio","appare":"2x"},{"tipo":"uguale","sinistra":"1/Abs(2*a)","vale":"1/(2*a)","ipotesi":{"a":"positive"},"dove":"esempio","appare":"\\dfrac{1}{2a}"},{"tipo":"derivata","espr":"2*pi*m*e","rispetto":["e"],"vale":"2*pi*m","ipotesi":{"m":"positive","e":"positive"},"dove":"qui.meccanica-statistica.esempio","appare":"2\\pi m"}]};
STRUM["singolarita-isolate"] = {"nome":"Singolarità isolate","riga":"Un punto $z_0$ in cui $f$ non è definita ma è olomorfa in tutto un disco forato $0\\lt|z-z_0|\\lt\\rho$ attorno, e che la parte principale del suo Laurent classifica in eliminabile, polo di ordine $m$, o essenziale.","serve":"È la classificazione che decide quale strumento si applica: parte principale assente vuol dire eliminabile (limite finito, residuo nullo); parte principale che si arresta a $(z-z_0)^{-m}$ vuol dire polo di ordine $m$ (e $|f|\\to\\infty$); infiniti termini vuol dire essenziale, e lì nessun limite esiste in alcun senso. Il criterio operativo non è guardare la funzione ma contare gli zeri: in un quoziente, ordine del polo $=$ zero del denominatore meno zero del numeratore.","esempio":"In $z=0$: $\\dfrac{\\sin z}{z}$ è eliminabile, perché il limite vale $1$ e la si ripara ridefinendola lì. $\\dfrac{1-\\cos z}{z^{3}}$ ha un polo semplice e non triplo, perché $1-\\cos z$ ha uno zero doppio e $3-2=1$: infatti $z\\cdot\\dfrac{1-\\cos z}{z^{3}}$ tende a $\\tfrac12$, che è anche il residuo. $e^{1/z}$ è essenziale: $z^{m}e^{1/z}$ se ne va lungo l'asse reale positivo per ogni $m$, e nessuna potenza la rende limitata.","pieno":{"file":"12b-laurent.html","tappa":"05","come":"le tre specie, i criteri equivalenti e le due insidie sull'ordine, nel nucleo su Laurent"},"controllo":[{"tipo":"limite","espr":"sin(z)/z","var":"z","a":"0","vale":"1","dove":"esempio","appare":"vale $1$"},{"tipo":"limite","espr":"(1-cos(z))/z**2","var":"z","a":"0","vale":"1/2","dove":"esempio","appare":"\\tfrac12"},{"tipo":"uguale","sinistra":"3-2","vale":"1","dove":"esempio","appare":"3-2=1"}]};
STRUM["cambio-di-variabile"] = {"nome":"Cambio di variabile in una densità","riga":"Una densità non si trasforma sostituendo ma porta il jacobiano: se $y=f(x)$ allora $p_Y(y)=\\sum_i p_X(x_i)\\,/\\,|f'(x_i)|$, sommato su tutti i rami $x_i$ con $f(x_i)=y$.","serve":"È l'unico punto in cui una densità si comporta diversamente da una funzione, ed è l'errore che si ripete. Ciò che è invariante è la probabilità dell'evento, $p_Y(y)|dy|=p_X(x)|dx|$: la densità no, perché è una probabilità per unità di qualcosa, e passando da $x$ a $y$ quell'unità si dilata o si comprime. Scrivere $p_Y(y)=p_X(x(y))$ e basta è attraente e sbagliato. Si scova senza rifare il conto con due prove da cinque secondi: la normalizzazione non torna, e le dimensioni restano quelle della variabile di partenza.","esempio":"Una particella uniforme su un disco di raggio $R$: $p(x,y)=1/(\\pi R^2)$. Passando alla sola distanza dal centro, il jacobiano è l'elemento d'area radiale $2\\pi r$, e resta $p(r)=2r/R^2$ su $[0,R]$, che infatti si normalizza a $1$. Il valor medio è $\\langle r\\rangle=2R/3$ — non $R/2$, che è la risposta di chi tratta $r$ come uniforme. La differenza fra i due numeri è esattamente il fattore $r$, cioè il fatto che lontano dal centro c'è più area.","pieno":{"file":"ms-03-probabilita.html","tappa":"01","come":"la regola dedotta dall'invarianza della probabilità, i rami molteplici e il caso radiale, nel movimento ms-03 di Meccanica Statistica"},"qui":{"meccanica-statistica":{"serve":"È metà della domanda più frequente dello scritto: «calcolare la densità di probabilità dell'energia di singola particella», «la densità di particelle $\\rho(r)$». L'altra metà è la marginalizzazione. Le scritture $d^2r=2\\pi r\\,dr$ e $d^3r=4\\pi r^2dr$ non sono formule da ricordare: sono questo cambio di variabile con gli angoli già integrati, e saperlo deducere è ciò che salva quando la simmetria è cilindrica invece che sferica. Attenzione al doppio jacobiano: $p(r)$ è una densità rispetto a $r$, $\\rho(r)$ è una densità per unità di volume, e fra le due ce n'è un altro.","esempio":"L'energia cinetica in due dimensioni. La misura radiale nel piano degli impulsi è la derivata dell'area del disco, $2\\pi p$; la sostituzione $\\varepsilon=p^2/2m$ ha $d\\varepsilon/dp=p/m$, e il jacobiano cancella esattamente il fattore $p$. Per questo in $d=2$ la densità dell'energia è l'esponenziale pura $\\beta e^{-\\beta\\varepsilon}$, senza prefattore, mentre in $d=3$ resta un $\\sqrt{\\varepsilon}$. Da quel solo fattore dipendono tutte le differenze qualitative fra i gas quantistici in dimensioni diverse."}},"controllo":[{"tipo":"integrale","espr":"2*r/R**2","var":"r","da":"0","a":"R","vale":"1","ipotesi":{"r":"positive","R":"positive"},"dove":"esempio","appare":"p(r)=2r/R^2"},{"tipo":"integrale","espr":"r*2*r/R**2","var":"r","da":"0","a":"R","vale":"2*R/3","ipotesi":{"r":"positive","R":"positive"},"dove":"esempio","appare":"2R/3"},{"tipo":"derivata","espr":"pi*p**2","rispetto":["p"],"vale":"2*pi*p","ipotesi":{"p":"positive"},"dove":"qui.meccanica-statistica.esempio","appare":"2\\pi p"},{"tipo":"derivata","espr":"p**2/(2*m)","rispetto":["p"],"vale":"p/m","ipotesi":{"p":"positive","m":"positive"},"dove":"qui.meccanica-statistica.esempio","appare":"p/m"},{"tipo":"integrale","espr":"b*exp(-b*e)","var":"e","da":"0","a":"oo","vale":"1","ipotesi":{"b":"positive","e":"positive"},"dove":"qui.meccanica-statistica.esempio","appare":"\\beta e^{-\\beta\\varepsilon}"}]};
STRUM["funzione-gamma"] = {"nome":"Funzione Gamma","riga":"$\\Gamma(z)=\\displaystyle\\int_0^{\\infty}t^{z-1}e^{-t}\\,dt$, e da questa $\\displaystyle\\int_0^{\\infty}t^{k}e^{-at}\\,dt=\\dfrac{\\Gamma(k+1)}{a^{k+1}}$ per $a\\gt 0$.","serve":"E' il fattoriale esteso ai numeri non interi — $\\Gamma(n+1)=n!$ — e soprattutto e' la forma chiusa di TUTTI gli integrali del tipo «potenza per esponenziale». Sapere questa sola formula sostituisce una decina di integrazioni per parti, e permette di leggere a vista il risultato di un integrale appena si riconosce l'esponente della potenza.","esempio":"Da $\\Gamma(z+1)=z\\,\\Gamma(z)$, che si ottiene integrando per parti una volta, discende $\\Gamma(n+1)=n!$ per $n$ intero: $\\Gamma(1)=1$, $\\Gamma(2)=1$, $\\Gamma(3)=2$, $\\Gamma(4)=6$. Sui semi-interi il capostipite e' $\\Gamma(\\tfrac12)=\\sqrt\\pi$ — che e' l'integrale gaussiano travestito — e da li' $\\Gamma(\\tfrac32)=\\tfrac12\\sqrt\\pi$, $\\Gamma(\\tfrac52)=\\tfrac34\\sqrt\\pi$. Un integrale come $\\int_0^\\infty t^{2}e^{-at}dt$ vale dunque $\\Gamma(3)/a^{3}=2/a^{3}$, senza fare nessun conto.","debito":"la continuazione analitica a $\\mathrm{Re}\\,z\\le 0$, i poli semplici in $z=0,-1,-2,\\dots$ e la formula di riflessione $\\Gamma(z)\\Gamma(1-z)=\\pi/\\sin\\pi z$ non stanno qui: la Gamma si usa come forma chiusa di un integrale reale convergente, e in quel ruolo l'argomento e' sempre positivo.","controllo":[{"tipo":"uguale","sinistra":"gamma(z+1)","vale":"z*gamma(z)","ipotesi":{"z":"positive"},"dove":"esempio","appare":"\\Gamma(z+1)=z\\,\\Gamma(z)"},{"tipo":"uguale","sinistra":"gamma(n+1)","vale":"factorial(n)","ipotesi":{"n":"integer"},"dove":"esempio","appare":"\\Gamma(n+1)=n!"},{"tipo":"integrale","espr":"t**2*exp(-a*t)","var":"t","da":"0","a":"oo","vale":"2/a**3","ipotesi":{"a":"positive","t":"positive"},"dove":"esempio","appare":"2/a^{3}"},{"tipo":"uguale","sinistra":"gamma(Rational(1,2))","vale":"sqrt(pi)","dove":"esempio","appare":"\\Gamma(\\tfrac12)=\\sqrt\\pi"},{"tipo":"uguale","sinistra":"gamma(Rational(5,2))","vale":"3*sqrt(pi)/4","dove":"esempio","appare":"\\Gamma(\\tfrac52)=\\tfrac34\\sqrt\\pi"},{"tipo":"integrale","espr":"p**2*exp(-b*c*p)","var":"p","da":"0","a":"oo","vale":"2/(b*c)**3","ipotesi":{"b":"positive","c":"positive","p":"positive"},"dove":"qui.meccanica-statistica.esempio","appare":"2/(\\beta c)^{3}"}],"pieno":null,"qui":{"meccanica-statistica":{"serve":"E' l'inventario degli integrali del canonico ridotto a una riga. Ogni funzione di partizione di singola particella e' un integrale di potenza per esponenziale — cambia solo l'esponente, e con esso la fisica: $t^{1/2}$ per il gas classico, $t^{2}$ per l'ultrarelativistico, $t^{3/n}$ per un potenziale $\\alpha r^{n}$. Riconoscere quale $\\Gamma$ si sta calcolando e' cio' che distingue chi risolve lo scritto in dieci minuti da chi lo risolve in un'ora.","esempio":"Per una particella relativistica con $\\varepsilon=cp$ la partizione porta $\\int_0^\\infty p^{2}e^{-\\beta cp}dp=\\Gamma(3)/(\\beta c)^{3}=2/(\\beta c)^{3}$, da cui $\\langle\\varepsilon\\rangle=3T$ invece dei $\\tfrac32T$ del caso non relativistico. Il fattore 3 contro $3/2$ viene per intero dall'esponente della potenza, cioe' dall'argomento della Gamma: la dipendenza dell'energia dalla quantita' di moto decide da sola quanto calore serve a scaldare il gas."}}};

function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';
  return h;
}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

/* ---------------- 00 · DI COSA PARLA QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Di cosa parla questo movimento', meta:'Meccanica Quantistica · voce Q.15 · il teorema del tunnel · la corrente come definizione · due righe di programma, un movimento intero',
  blocchi:[
  {t:'prosa', title:'Due righe di programma, e perché non sono un invito a scrivere corto', tag:'architettura', html:R`
  <p>Il programma dedica a questo argomento due righe: <i>«Scattering in 1 dimensione, coefficienti di riflessione e trasmissione, effetto tunnel. Conservazione della probabilità, equazione di continuità»</i>. E la densità d&rsquo;esame misurata è la più bassa del corso insieme alla particella libera e agli stati legati in una dimensione: quattro scritti su quarantasette. Le due cose insieme sembrano dire «movimento corto», e sono invece una trappola: dicono che il <b>perimetro</b> è stretto — niente scattering in tre dimensioni, niente sezioni d&rsquo;urto, niente sfasamenti, che il programma esclude altrove per nome — non che la <b>profondità</b> lo sia. Dentro un perimetro di due righe sta un movimento intero, e la ragione è che la domanda vera non è <i>«quanto vale T per una barriera rettangolare»</i>: è <b>che cosa significhi risolvere un problema il cui spettro è continuo</b>.</p>
  <p>Negli stati legati in una dimensione la risposta a un problema era un numero, l&rsquo;energia $E_n$. Qui l&rsquo;energia è <i>data</i> — qualunque valore positivo è permesso, come per la particella libera — e la risposta è una <b>coppia di numeri</b>, $R$ e $T$, che non sono ampiezze ma rapporti di <i>correnti</i>. Questa distinzione, che sembra tecnica, è l&rsquo;intero contenuto fisico del movimento: dice che la domanda sensata su uno spettro continuo non è «quale stato è permesso» ma «con quale probabilità, per unità di tempo, la particella attraversa un punto», e il resto del movimento è la costruzione di quella domanda e la sua risposta su sei casi.</p>`},
  {t:'prosa', title:'Come è fatto il movimento, e il suo filo', tag:'architettura', html:R`
  <p>La tappa 01 fissa il criterio che separa questo movimento dallo studio degli stati legati: legato o diffuso, secondo il tipo di regione a $x\to\pm\infty$. La 02 deduce l&rsquo;equazione di continuità dall&rsquo;equazione di Schrödinger, in tre dimensioni e poi in una. La 03 definisce $R$ e $T$ come rapporti di correnti — non di ampiezze — e dimostra, usando solo la continuità, che $R+T=1$ <i>qualunque sia la forma del potenziale</i>, più la simmetria sinistra-destra per due vie indipendenti. La 04 risolve il gradino di potenziale e scioglie il paradosso del limite classico. La 05 risolve la barriera rettangolare e dimostra il <b>teorema del tunnel</b>: il coefficiente trasmesso non è mai nullo, qualunque sia $V(x)$. La 06 guarda dentro la barriera, dove la funzione d&rsquo;onda non decade come un esponenziale puro. La 07 prende il limite di barriera opaca e arriva al microscopio a effetto tunnel. La 08 dà la struttura generale — la matrice di trasferimento, la reciprocità per qualunque campo — e la barriera sopra il livello, con le sue risonanze di trasmissione totale. La 09 risolve la delta di Dirac come diffusore e trova che il suo polo <i>è</i> lo stato legato della buca delta. La 10 risolve la buca finita come diffusore e incontra l&rsquo;effetto Ramsauer-Townsend. La 11 risolve due potenziali che non sono rettangoli — i problemi di Landau — e con essi il paradosso lasciato aperto alla tappa 04. La 12 chiude sul significato fisico degli autostati impropri usati per tutto il movimento. La 13 tira il bilancio.</p>
  <p><b>Che cosa questo movimento non fa.</b> Non tratta lo scattering in tre dimensioni — sezioni d&rsquo;urto, sfasamenti, approssimazione di Born — che il programma esclude per nome insieme a perturbazioni dipendenti dal tempo, metodo variazionale e WKB. Non tratta gli stati legati, che qui ricompaiono solo come limite o come polo. E non insiste sulla barriera rettangolare più del necessario: è l&rsquo;esempio con cui si <i>misura</i> il teorema del tunnel, non il teorema stesso.</p>`}
]},

/* ---------------- 01 · IL CRITERIO ---------------- */
{ num:'01', title:'Il criterio: stati legati, stati di diffusione, e perché lo spettro continuo cambia la domanda', meta:'il tipo di regione a infinito decide il tipo di problema · doppia degenerazione · perché qui non si cerca un autovalore',
  blocchi:[
  {t:'prosa', title:'Lo schema degli stati legati, riletto dall&rsquo;altra parte', tag:'costruzione', html:R`
  <p>Il criterio che separa gli stati legati dagli stati di diffusione è lo stesso che, per gli stati legati, classificava lo <span class="str" data-str="spettro">spettro</span> secondo il tipo di regione a $x\to\pm\infty$: se il potenziale tende a un limite finito e l&rsquo;energia supera quel limite da entrambi i lati, la regione è <i>di tipo I</i> — le soluzioni oscillano, non decadono, e non sono normalizzabili. Se l&rsquo;energia è sotto il limite da almeno un lato, la regione a quel lato è <i>di tipo II</i> e la soluzione accettabile decade: è lo stato legato, discreto. Questo movimento vive interamente nella prima situazione, con l&rsquo;energia sopra il valore asintotico del potenziale da entrambi i lati: lo spettro è continuo e <b>doppiamente degenere</b>, perché a ogni $E$ corrispondono due soluzioni indipendenti — un&rsquo;onda che si propaga verso destra e una verso sinistra — e nessuna combinazione lineare di esponenziali oscillanti tende a zero.</p>
  <p>Picasso lo scrive risolvendo esplicitamente le equazioni asintotiche: nelle regioni $x<0$ e $x>a$ dove il potenziale è costante, la soluzione generale è $\psi(x)=Ae^{ikx}+A'e^{-ikx}$ a sinistra e $Ce^{ikx}+C'e^{-ikx}$ a destra, con $k=\sqrt{2mE}/\hbar$ fissato dall&rsquo;energia — <i>«siccome le regioni asintotiche sono di tipo I, gli autovalori sono continui e doppiamente degeneri»</i>. Dei quattro coefficienti solo due sono indipendenti, perché l&rsquo;equazione di Schrödinger è del secondo ordine: la condizione di raccordo nei punti dove il potenziale cambia forma lega gli altri due ai primi.</p>`},
  {t:'reveal', title:'Perché qui la domanda non è più «quale $E$», ma «quale rapporto»', tag:'costruzione', steps:[
   {label:'Il conteggio che per gli stati legati quantizzava, qui non quantizza', body:R`
   <p>Per gli stati legati il meccanismo della quantizzazione era un conteggio: un&rsquo;equazione del secondo ordine ha due costanti indipendenti, e ogni condizione di decadimento all&rsquo;infinito ne consuma una. Quando le condizioni superano le costanti disponibili, la differenza ricade sull&rsquo;energia, che deve prendere valori isolati per lasciare esattamente i gradi di libertà necessari. Qui il conteggio è diverso: <b>nessuna condizione di decadimento è imposta</b>, perché nessuna delle due regioni asintotiche richiede che $\psi$ si annulli — richiede solo che oscilli. Non c&rsquo;è nessuna costrizione da bilanciare contro l&rsquo;energia, e $E$ resta libera di prendere qualunque valore positivo.</p>`},
   {label:'Quello che resta da determinare non è un numero isolato, è un rapporto', body:R`
   <p>Restano due costanti indipendenti su quattro, fissate dalla condizione di raccordo — esattamente come per gli stati legati — ma qui non c&rsquo;è nessun $E$ da quantizzare: la domanda diventa «fissata la configurazione fisica (una particella che arriva da un lato), quanto valgono i rapporti fra le ampiezze?». E questi rapporti, come la tappa 03 renderà preciso, non sono la grandezza fisicamente significativa: lo è il loro modulo quadro moltiplicato per il numero d&rsquo;onda corrispondente, perché la grandezza che si conserva e che un apparato sperimentale misura non è l&rsquo;ampiezza di un&rsquo;onda infinita, è una <b>corrente</b>.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Perché la particella libera e il gradino di questo movimento condividono lo stesso tipo di spettro (continuo, doppiamente degenere) eppure sono problemi fisicamente diversi?`,
    a:R`Perché il tipo di spettro dipende solo dal comportamento <i>asintotico</i> del potenziale, non dalla sua forma nel mezzo. La particella libera e il gradino sono entrambi di tipo I da entrambi i lati, quindi condividono lo spettro — ma la particella libera ha $V(x)$ costante <i>ovunque</i>, mentre il gradino ha una regione intermedia in cui accade qualcosa: è proprio lì, nel raccordo fra le due regioni asintotiche, che la fisica del movimento si gioca. Lo schema degli stati legati dice <i>quale tipo</i> di problema ci si aspetta, non <i>come si risolve</i>.`}
  ]}
]},

/* ---------------- 02 · LA CORRENTE DI PROBABILITA' ---------------- */
{ num:'02', title:'La corrente di probabilità, e l&rsquo;equazione di continuità dedotta', meta:'da Schrodinger alla conservazione locale · densita e corrente, non solo normalizzazione globale · la lettura di Dirac: un fluido',
  blocchi:[
  {t:'prosa', title:'Perché la normalizzazione globale non basta', tag:'costruzione', html:R`
  <p>Per uno stato legato la conservazione della probabilità è un fatto <i>globale</i>: $\int|\psi|^2dx$ resta pari a $1$ per sempre, perché l&rsquo;hamiltoniana è autoaggiunta. Per uno stato di scattering questa affermazione, pur vera, non dice nulla di utile — l&rsquo;integrale su tutto lo spazio di un&rsquo;onda piana diverge. Quello che serve è una versione <i>locale</i>: una legge che dica come la probabilità si <b>sposta</b> da un punto all&rsquo;altro, non solo che il totale si conserva. Picasso costruisce questa legge passando attraverso l&rsquo;equazione di Schrödinger in tre dimensioni,</p>
  $$-\frac{\hbar^{2}}{2m}\nabla^{2}\psi+V\psi=E\psi,$$
  <p>e il passaggio chiave è elementare quanto potente: si moltiplica l&rsquo;equazione per $\psi^{*}$ e la sua complessa coniugata per $\psi$, e si sottraggono.</p>`},
  {t:'reveal', title:'Il conto, e l&rsquo;equazione di continuità che ne esce', tag:'costruzione', steps:[
   {label:'La sottrazione elimina il potenziale', body:R`
   <p>Moltiplicando $-\frac{\hbar^2}{2m}\nabla^2\psi+V\psi=E\psi$ per $\psi^*$, e la coniugata per $\psi$, e sottraendo, il termine di potenziale — reale, e identico nelle due equazioni — si cancella insieme al termine di energia:</p>
   $$\psi^{*}\nabla^{2}\psi-\psi\nabla^{2}\psi^{*}=0\ \Longrightarrow\ \nabla\cdot\big(\psi^{*}\nabla\psi-\psi\nabla\psi^{*}\big)=0.$$
   <p>Definendo la <b>densità di corrente di probabilità</b></p>
   $$\vec j=-\frac{i\hbar}{2m}\big(\psi^{*}\nabla\psi-\psi\nabla\psi^{*}\big)=\frac{\hbar}{m}\,\mathrm{Im}\big(\psi^{*}\nabla\psi\big),$$
   <p>— e Picasso annota che il coefficiente $-i\hbar/2m$ «è stato introdotto per ragioni che saranno chiare nel prossimo capitolo», cioè perché $\vec j$ è il valore medio dell&rsquo;operatore velocità pesato con $\psi$ — si ottiene l&rsquo;<b>equazione di continuità</b>:</p>
   $$\nabla\cdot\vec j(x,y,z)=0.$$`},
   {label:'In una dimensione, e dove entra il tempo', body:R`
   <p>Questa è la versione <i>stazionaria</i>, dove $\rho=|\psi|^2$ non dipende dal tempo e la divergenza di $\vec j$ si annulla identicamente. La versione completa, con $\psi$ dipendente dal tempo che soddisfa l&rsquo;equazione di Schrödinger <i>completa</i> $i\hbar\partial_t\Psi=-\frac{\hbar^2}{2m}\nabla^2\Psi+V\Psi$, dà la forma generale</p>
   $$\frac{\partial\rho}{\partial t}+\frac{\partial j}{\partial x}=0,\qquad \rho=|\Psi|^{2},$$
   <p>in una dimensione, e il conto che la produce è identico — moltiplicare per $\Psi^*$, coniugare, sottrarre — con la sola differenza che ora compare anche la derivata temporale di $\rho$. <i>Questa è la versione che vale sempre, stato legato o stato di diffusione</i>: per uno stato stazionario $\rho$ non dipende dal tempo e si riduce al caso appena visto, ma la legge di conservazione <i>locale</i> — non solo l&rsquo;integrale, il <span class="str" data-str="flusso-di-un-campo">flusso</span> punto per punto — è la stessa.</p>`}
  ]},
  {t:'prosa', title:'La lettura di Dirac: un fluido', tag:'esame', html:R`
  <p>Dirac arriva alla stessa equazione da una strada diversa, e la strada illumina il significato fisico. Nel par. 31 scrive la funzione d&rsquo;onda dipendente dal tempo nella forma $\Psi=Ae^{iS/\hbar}$, con $A$ e $S$ <i>reali</i> e che variano poco rapidamente — è l&rsquo;ansatz che prepara l&rsquo;approssimazione semiclassica, qui usato solo per leggere la struttura. Sostituendo nell&rsquo;equazione di Schrödinger e separando parte reale e immaginaria, la parte immaginaria dà esattamente un&rsquo;equazione di continuità per $A^2$, e Dirac la legge così: <i>«supponiamo di avere un fluido che si muova nello spazio delle variabili $q$, la densità del fluido in ogni punto e istante sia $A^2$»</i>. La corrente di questo fluido è</p>
  $$j=\frac{A^{2}}{m}\frac{dS}{dx},$$
  <p>cioè densità per velocità, con la velocità $\frac{1}{m}\frac{dS}{dx}$ che è il gradiente della fase diviso la massa — la stessa combinazione che l&rsquo;onda piana $e^{ikx}$ produce con $S=\hbar kx$ e velocità $\hbar k/m$. <b>Non è un&rsquo;analogia</b>: è la stessa equazione di continuità della tappa precedente, scritta nelle variabili ampiezza-e-fase invece che in $\psi$ e $\psi^*$, e la coerenza fra le due derivazioni — una da Picasso con $\psi^*\nabla\psi$, una da Dirac con $Ae^{iS/\hbar}$ — è la prima verifica che l&rsquo;oggetto è lo stesso.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Per uno stato stazionario, $\rho=|\psi(x)|^2$ non dipende dal tempo. L&rsquo;equazione di continuità dice allora che $j$ è...`,
    a:R`...<b>costante in $x$</b>, non nulla: $\partial\rho/\partial t=0$ impone $\partial j/\partial x=0$, cioè $j$ non dipende dalla posizione — ma può benissimo dipendere dall&rsquo;energia e valere un numero diverso da zero. È esattamente questa costanza spaziale di $j$ a rendere sensato parlare di «la corrente incidente», «la corrente trasmessa»: non sono correnti locali che cambiano da punto a punto, sono lo stesso numero valutato in regioni diverse, e l&rsquo;equazione di continuità garantisce che coincidano entro ciascuna regione dove $V$ è costante.`}
  ]}
]},

/* ---------------- 03 · I COEFFICIENTI COME RAPPORTI DI CORRENTE ---------------- */
{ num:'03', title:'I coefficienti come rapporti di corrente, e il teorema generale R+T=1', meta:'non ampiezze, correnti · il teorema vale per QUALUNQUE V(x) · la simmetria sinistra-destra, due dimostrazioni',
  blocchi:[
  {t:'prosa', title:'Perché «rapporto di ampiezze» è la definizione sbagliata', tag:'costruzione', html:R`
  <p>Una tentazione naturale è definire il coefficiente di trasmissione come $|C/A|^2$, rapporto dei moduli quadri delle ampiezze nella forma asintotica $\psi=Ae^{ikx}+A'e^{-ikx}$ per $x<0$ e $\psi=Ce^{ikx}$ per $x>a$. Questa definizione è <b>corretta solo quando il numero d&rsquo;onda è lo stesso nelle due regioni</b> — cioè quando il potenziale torna allo stesso valore asintotico da entrambi i lati, come nella barriera. Per il gradino, dove il potenziale asintotico è diverso a sinistra e a destra, due onde piane con la stessa ampiezza trasportano correnti diverse, perché la velocità $\hbar k/m$ è diversa. La definizione che funziona sempre, e che Picasso usa, è in termini di <b>corrente</b>: <i>«$|A|^2$ coefficiente di riflessione [...] $|C|^2$ coefficiente di trasmissione della barriera»</i> — nel caso particolare in cui $k$ è lo stesso — ma l&rsquo;enunciato generale, valido anche quando non lo è, usa i rapporti di corrente.</p>`},
  {t:'reveal', title:'Le due correnti che servono, calcolate una volta per tutte', tag:'costruzione', steps:[
   {label:'La corrente di una coppia di onde contropropaganti', body:R`
   <p>Per $\psi=e^{ikx}+Be^{-ikx}$ — un&rsquo;onda incidente di ampiezza unitaria più una riflessa di ampiezza $B$ — la corrente definita nella tappa 02 vale</p>
   $$j=\frac{\hbar k}{m}\big(1-|B|^{2}\big),$$
   <p>e il punto non ovvio è che questa è <b>indipendente da $x$</b>, nonostante $\psi$ contenga due esponenziali con fasi che ruotano in direzioni opposte: il termine di interferenza fra le due onde, che oscilla con $x$, ha parte immaginaria nulla dopo aver preso $\mathrm{Im}(\psi^*\psi')$, e quello che resta è esattamente la differenza delle due correnti separate — quella dell&rsquo;onda incidente, $\hbar k/m$, meno quella della riflessa, $\hbar k/m\,|B|^2$.</p>`},
   {label:'La corrente di un&rsquo;onda sola', body:R`
   <p>Per $\psi=Ce^{ikx}$ — solo l&rsquo;onda trasmessa, nessuna riflessa dal lato dove non c&rsquo;è sorgente — la stessa formula dà</p>
   $$j=\frac{\hbar k}{m}|C|^{2}.$$
   <p>Questi due risultati, applicati ai due lati di un qualunque problema di scattering, sono tutto ciò che serve per definire $R$ e $T$ in generale: $R$ è il rapporto fra la corrente riflessa e quella incidente, $T$ fra quella trasmessa e quella incidente — e in entrambi i casi il numero d&rsquo;onda di ciascun lato è quello giusto per quel lato, non necessariamente lo stesso.</p>`}
  ]},
  {t:'prosa', title:'Il teorema: R+T=1 per qualunque forma di V(x)', tag:'esame', html:R`
  <p>Qui sta il punto che la tappa 02 ha preparato. Integrando la costanza spaziale della corrente stabilita lì fra un punto $x_1<0$ a sinistra di ogni struttura del potenziale e un punto $x_2>a$ a destra, l&rsquo;equazione di continuità dà $j(x_1)=j(x_2)$ — la corrente a sinistra, calcolata con la prima formula della tappa, è uguale alla corrente a destra, calcolata con la seconda. Picasso lo scrive così: <i>«naturalmente i valori di $A$ e di $C$ dipendono dal potenziale $V(x)$ ma, qualunque sia la forma di $V(x)$, vale la relazione $|A|^2+|C|^2=1$»</i>, cioè</p>
  $$R+T=1,$$
  <p><b>senza aver risolto nessuna equazione specifica</b>. È il teorema generale che fa da struttura a tutto il movimento: ogni caso che si risolverà da qui in avanti — gradino, barriera, delta, buca — produrrà due funzioni $R(E)$ e $T(E)$ diverse, ma la loro somma sarà sempre $1$, ed è un controllo che non dipende dal calcolo specifico: dipende solo dalla continuità.</p>`},
  {t:'reveal', title:'La simmetria sinistra-destra, per due vie indipendenti', tag:'costruzione', steps:[
   {label:'La via di Picasso: usare che l&rsquo;equazione è reale', body:R`
   <p>C&rsquo;è un secondo fatto, meno immediato, e Picasso lo dimostra con un argomento di cinque righe: i coefficienti di riflessione e trasmissione <b>non dipendono dal lato da cui arriva la particella</b>. L&rsquo;argomento usa che l&rsquo;equazione di Schrödinger stazionaria ha coefficienti reali: se $\psi(x)=Ae^{ikx}+Be^{-ikx}$ (a sinistra) e $Ce^{ikx}$ (a destra, scattering da sinistra) è soluzione, anche $\psi^*(x)=Ae^{-ikx}+B^*e^{ikx}$ a sinistra e $C^*e^{-ikx}$ a destra lo è. La combinazione che descrive lo scattering <i>da destra</i> — un&rsquo;onda che arriva da $x>a$ — si costruisce come combinazione lineare di $\psi$ e $\psi^*$, imponendo che il coefficiente dell&rsquo;onda che entra da sinistra si annulli. Risolvendo quel sistema lineare, il coefficiente di riflessione che ne esce è identico a quello calcolato per lo scattering da sinistra.</p>`},
   {label:'La via di Landau: la matrice che lega le due regioni asintotiche', body:R`
   <p>Landau arriva alla stessa conclusione con uno strumento più generale, che non richiede di scrivere esplicitamente $\psi^*$: la relazione lineare fra i coefficienti asintotici a $-\infty$ e a $+\infty$,</p>
   $$A_{2}=\alpha A_{1}+\beta B_{1},$$
   <p>dove $\alpha,\beta$ sono costanti «generalmente complesse», dipendenti dalla forma concreta del campo. Qui $A_1,B_1$ sono le ampiezze delle onde $e^{\pm ik_1x}$ per $x\to-\infty$ e $A_2,B_2$ quelle delle onde $e^{\pm ik_2x}$ per $x\to+\infty$, con $k_1\ne k_2$ se il potenziale ha due livelli asintotici diversi, come il gradino di Landau che sale da $0$ a $U_0$. La realtà dell&rsquo;equazione dà la relazione per $B_2$ senza nessun conto nuovo: se $\psi$ è soluzione lo è anche $\psi^*$, che scambia le due onde fra loro e coniuga i coefficienti, e Landau ne legge $B_2=\alpha^{*}B_1+\beta^{*}A_1$. Sostituendo le due relazioni nella differenza dei moduli quadri, i termini incrociati $\alpha\beta^{*}A_1B_1^{*}$ e i loro coniugati si cancellano a coppie, e resta una fattorizzazione esatta, vera per qualunque scelta di $A_1,B_1$:</p>
   $$|A_{2}|^{2}-|B_{2}|^{2}=\big(|\alpha|^{2}-|\beta|^{2}\big)\big(|A_{1}|^{2}-|B_{1}|^{2}\big).$$
   <p>La costanza della corrente lungo tutto l&rsquo;asse, lo stesso fatto della tappa 02, chiede che la corrente netta a sinistra, proporzionale a $k_1(|A_1|^2-|B_1|^2)$, sia uguale a quella a destra, proporzionale a $k_2(|A_2|^2-|B_2|^2)$. Siccome deve valere per ogni $A_1,B_1$, la fattorizzazione dà $|\alpha|^2-|\beta|^2=k_1/k_2$, e quando il potenziale torna allo stesso livello ai due estremi (barriera, buca, delta: $k_1=k_2$) si riduce a</p>
   $$|\alpha|^{2}-|\beta|^{2}=1.$$
   <p>Per la simmetria il valore della costante non serve nemmeno. Con la particella che arriva da sinistra si pone $B_2=0$, e la relazione per $B_2$ dà $B_1/A_1=-\beta^{*}/\alpha^{*}$; con la particella che arriva da destra si pone $A_1=0$, e la stessa relazione dà $A_2/B_2=\beta/\alpha^{*}$. I due coefficienti di riflessione sono i moduli quadri di questi rapporti, $|\beta|^2/|\alpha|^2$ in entrambi i casi:</p>
   $$R_{\rm sx}=R_{\rm dx},$$
   <p>senza aver mai specificato la forma di $V$. È la versione a matrice del teorema di Picasso, e il fatto che due testi arrivino alla stessa conclusione con due strumenti diversi — uno costruendo esplicitamente $\psi^*$, l&rsquo;altro con un&rsquo;identità di matrice — è la seconda verifica cross-fonte del movimento.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Nel gradino, dove $k\ne k_2$, perché il coefficiente di trasmissione NON è semplicemente $|C|^2$ ma $\frac{k_2}{k}|C|^2$?`,
    a:R`Perché la grandezza fisicamente significativa è il rapporto delle <b>correnti</b>, non delle ampiezze: la corrente trasmessa è $\frac{\hbar k_2}{m}|C|^2$ e quella incidente è $\frac{\hbar k}{m}\cdot1^2$, quindi il loro rapporto porta con sé il fattore $k_2/k$ che tiene conto della diversa velocità dell&rsquo;onda nelle due regioni. Trascurare questo fattore — cioè usare $|C|^2$ come se fosse automaticamente una probabilità — darebbe un $R+T\ne1$ anche quando il calcolo delle ampiezze è corretto, ed è l&rsquo;errore più comune in questo tipo di esercizio.`},
   {q:R`Il teorema $R+T=1$ vale per qualunque $V(x)$: vale anche per un potenziale complesso, che descrive per esempio un assorbimento?`,
    a:R`No, e il motivo è esattamente dove sta la dimostrazione: il passaggio che fa cancellare il termine di potenziale nella sottrazione $\psi^*(\cdots)-\psi(\cdots)^*$ usa che $V$ è <b>reale</b>, cioè $V=V^*$. Un potenziale complesso lascerebbe un termine residuo $\propto(V-V^*)|\psi|^2$ nell&rsquo;equazione di continuità, che diventa una sorgente o un pozzo di probabilità — ed è esattamente così che si modella l&rsquo;assorbimento in fisica nucleare (il «potenziale ottico»): deliberatamente rinunciando a $R+T=1$ per descrivere una particella che può essere catturata.`}
  ]}
]},

/* ---------------- 04 · IL GRADINO ---------------- */
{ num:'04', title:'Il gradino di potenziale, e il paradosso del limite classico', meta:'riflessione quantistica sopra la barriera · il caso E<V0 · il paradosso del limite classico, e perché non si risolve con una frase',
  blocchi:[
  {t:'prosa', title:'Il problema di Landau, risolto', tag:'costruzione', html:R`
  <p>Landau apre il paragrafo 25 con il caso più semplice possibile: un potenziale che cresce monotonicamente da $0$ (per $x\to-\infty$) a $V_0$ (per $x\to+\infty$). Classicamente la risposta è netta: se $E>V_0$ la particella passa, più lenta ma passa; se $E<V_0$ torna indietro, sempre. Quantisticamente non è mai così netto, e il primo caso è già sorprendente: <i>«anche per $E>V_0$ la particella può essere riflessa dalla barriera di potenziale. La probabilità di riflessione deve essere calcolata»</i>.</p>`},
  {t:'reveal', title:'La soluzione per un gradino netto, e i due limiti', tag:'costruzione', steps:[
   {label:'Le condizioni di raccordo danno B e C', body:R`
   <p>Per il gradino netto, $V(x)=0$ per $x<0$ e $V_0$ per $x>0$, con $\psi=e^{ikx}+Be^{-ikx}$ a sinistra e $\psi=Ce^{ikx_2}$ a destra ($k=\sqrt{2mE}/\hbar$, $k_2=\sqrt{2m(E-V_0)}/\hbar$), la continuità di $\psi$ e $\psi'$ in $x=0$ dà due equazioni lineari — lo stesso tipo di condizione dedotto in generale integrando l&rsquo;equazione attraverso il salto — e la soluzione è</p>
   $$B=\frac{k-k_{2}}{k+k_{2}},\qquad C=\frac{2k}{k+k_{2}}.$$
   <p>Da qui, con le formule della tappa 03,</p>
   $$R=\Big(\frac{k-k_{2}}{k+k_{2}}\Big)^{2},\qquad T=\frac{4kk_{2}}{(k+k_{2})^{2}},$$
   <p>e si verifica che $R+T=1$ identicamente, come deve essere.</p>`},
   {label:'In termini di E e V0, e i due limiti', body:R`
   <p>Sostituendo $k=\sqrt{2mE}/\hbar$ e $k_2=\sqrt{2m(E-V_0)}/\hbar$,</p>
   $$R=\Big(\frac{\sqrt{E}-\sqrt{E-V_{0}}}{\sqrt{E}+\sqrt{E-V_{0}}}\Big)^{2}.$$
   <p>Per $E\to V_0^+$ (la particella arriva con energia appena sufficiente), $k_2\to0$ e $R\to1$: riflessione quasi totale, anche se classicamente la particella «dovrebbe» passare senza problemi. Per $E\to\infty$ a $V_0$ fissato, $k_2\to k$ e $R\to0$ come</p>
   $$R\sim\Big(\frac{V_{0}}{4E}\Big)^{2},$$
   <p>cioè la riflessione quantistica <i>sopravvive</i> a qualunque energia, ma si spegne rapidamente. È il comportamento opposto a quello di una barriera finita: lì, come la tappa 07 mostrerà, l&rsquo;attraversamento è esponenzialmente raro; qui la riflessione, non il passaggio, è ciò che diventa raro.</p>`}
  ]},
  {t:'prosa', title:'Il caso E<V0: riflessione totale, ma non assenza', tag:'costruzione', html:R`
  <p>Se $E<V_0$, $k_2$ diventa immaginario puro, $k_2=i\chi$, e sostituendo in $B$ si trova $|B|^2=1$: <b>riflessione totale</b>, $R=1$, come il buon senso classico richiede. Ma Landau avverte, nello stesso respiro: <i>«sottolineiamo però che anche in questo caso, la probabilità di trovare la particella nella regione in cui $E<V_0$ non è nulla, benché diminuisca rapidamente al crescere di $x$»</i>. La funzione d&rsquo;onda penetra nella regione classicamente proibita — esattamente come accadeva nella buca finita sotto il livello zero — ma non c&rsquo;è <i>flusso netto</i> che la attraversi: la corrente nella regione $x>0$, calcolata con $\psi\propto e^{-\chi x}$ reale a meno di una fase costante, è identicamente nulla, perché $\mathrm{Im}(\psi^*\psi')=0$ per una funzione reale. <i>Penetrazione senza trasmissione</i> è il punto, e distingue nettamente questo caso dal tunnel della tappa 05, dove la regione centrale è finita e la corrente la attraversa tutta.</p>`},
  {t:'prosa', title:'L&rsquo;esempio numerico di Landau: un neutrone', tag:'esame', html:R`
  <p>Landau dà un esempio concreto nei problemi del paragrafo: una particella con energia tale che $k_2/k=2$ — per esempio un neutrone con $E=4$ <span class="str" data-str="elettronvolt">MeV</span> che incontra una buca nucleare di profondità $8$ MeV, dove l&rsquo;energia <i>dentro</i> è $E+8=12$ MeV e il rapporto dei numeri d&rsquo;onda è $\sqrt{12/4}\cdot\frac12\cdot2=2$ con la convenzione giusta sui segni. Con $k_2/k=2$,</p>
  $$R=\frac19,\qquad T=\frac89:$$
  <p>un neutrone su nove torna indietro anche se l&rsquo;energia è ben sopra la soglia nucleare, un effetto che non ha nessun analogo classico e che è uno dei motivi per cui la diffusione dei neutroni sui nuclei non è calcolabile con la mente classica, nemmeno in prima approssimazione.</p>`},
  {t:'plot', title:'Il gradino: R e T in funzione dell&rsquo;energia',
   intro:R`<p>A sinistra: $R(E)$ per un gradino di altezza $V_0=1$, in funzione di $E/V_0$. La riflessione è totale per $E<V_0$, salta a un valore finito appena sopra la soglia, e decresce come $1/E^2$ per $E$ grande — non si annulla mai esattamente. A destra: lo stesso gradino, ora visto come il limite $\varepsilon\to0$ di una famiglia di potenziali lisci che si irrigidiscono fino al salto, per dare intuizione di cosa produce il salto nelle condizioni di raccordo.</p>`,
   plots:[{kind:'func2d', xr:[0.01,4], yr:[-0.05,1.05], height:260, ticks:true,
     title:'R(E/V0) per il gradino',
     curves:[{f:'(x<1)?1:Math.pow((Math.sqrt(x)-Math.sqrt(x-1))/(Math.sqrt(x)+Math.sqrt(x-1)),2)', col:'#ff6b8a', width:2.4, label:'R(E/V0)'}],
     xlabel:'E / V0', ylabel:'R'},
    {kind:'func2d', xr:[-2,2], yr:[-0.1,1.2], height:260, ticks:true,
     title:'tre gradini lisci, verso il limite netto',
     curves:[{f:'1/(1+Math.exp(-x/0.6))', col:'#5aa9ff', width:2.0, label:'epsilon largo'},
             {f:'1/(1+Math.exp(-x/0.2))', col:'#9b8cff', width:2.2, label:'epsilon medio'},
             {f:'1/(1+Math.exp(-x/0.03))', col:'#ffb86b', width:2.4, label:'epsilon piccolo'}],
     xlabel:'x', ylabel:'V / V0'}],
   leggi:R`<p><b>Che cosa guardare.</b> Nel riquadro di sinistra, la curva non tocca mai lo zero: per $E/V_0=4$ vale ancora circa $0{,}03$, e il decadimento è a potenza — non esponenziale. Questo è il motivo per cui il gradino e la barriera, nonostante sembrino problemi vicini, hanno comportamenti opposti: il gradino lascia sempre un residuo algebrico di riflessione, la barriera lascia un residuo esponenziale di trasmissione.</p>
   <p><b>Che cosa impararne.</b> La riflessione quantistica sopra una soglia non è un effetto di soglia stretta: è presente a qualunque energia, e la domanda interessante — ripresa alla tappa 11 con il gradino <i>morbido</i> di Landau — è come questo residuo dipenda dalla <i>durezza</i> della transizione, non solo dalla sua altezza.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Il coefficiente $R$ del gradino netto non contiene $\hbar$. È un paradosso: nel limite classico $\hbar\to0$ ci si aspetterebbe $R\to0$. Come si risolve?`,
    a:R`Non c&rsquo;è paradosso nel senso di una contraddizione: Landau lo nota esplicitamente in una nota a piè di pagina, e la risoluzione è che <b>il passaggio al limite classico non è realizzabile per questo problema</b>. Il limite classico corrisponde al caso in cui la lunghezza d&rsquo;onda di de Broglie $\lambda=h/p$ è piccola rispetto alla distanza su cui il potenziale varia sensibilmente. Nel gradino schematico, quella distanza è <i>nulla</i> per costruzione — il salto è discontinuo — quindi non esiste nessun $\hbar$ piccolo rispetto a una scala di lunghezza fissata: l&rsquo;espressione «non contiene $\hbar$» non è un errore del calcolo, è la firma che il modello stesso non ha un regime classico. La tappa 11 risolve lo stesso problema con un gradino <i>morbido</i>, dove quella scala di lunghezza esiste, ed è lì — non qui — che si vede $R\to0$ nel limite classico.`}
  ]}
]},

/* ---------------- 05 · LA BARRIERA: IL TEOREMA DEL TUNNEL ---------------- */
{ num:'05', title:'La barriera rettangolare, 0<E<V0: il teorema del tunnel', meta:'il teorema prima dell esempio · il coefficiente trasmesso non e mai nullo · la formula esplicita, e i suoi due limiti',
  blocchi:[
  {t:'prosa', title:'Il teorema, prima della formula', tag:'esame', html:R`
  <p>Qui arriva il risultato che dà il nome al movimento, e Picasso lo enuncia prima di risolvere qualunque equazione specifica — è una proprietà <b>generale</b>, non una conseguenza della forma rettangolare della barriera: <i>«è evidente che qualunque sia la forma di $V(x)$ e per qualunque valore dell&rsquo;energia deve essere $C\ne0$ perché, siccome le soluzioni dell&rsquo;equazione di Schrödinger non possono annullarsi in un punto insieme alla loro derivata, a maggior ragione non possono annullarsi in un intervallo»</i>. È un teorema su equazioni differenziali del secondo ordine, non un fatto sulla barriera quadrata: una soluzione dell&rsquo;equazione omogenea del secondo ordine che si annulla identicamente su un intervallo, insieme alla sua derivata, è <i>la soluzione nulla</i> per il teorema di unicità — e la soluzione nulla non descrive nessuna particella.</p>
  <p><b>Questa è l&rsquo;inversione che organizza il movimento</b>: la barriera rettangolare non dimostra il tunnel, lo <i>misura</i>. Il teorema garantisce $T>0$ per qualunque barriera — rettangolare, gaussiana, a gradino morbido — e il calcolo esplicito che segue serve solo a dire <i>quanto</i> vale $T$ per il caso più semplice, non a stabilire che è diverso da zero.</p>`},
  {t:'reveal', title:'La barriera, risolta', tag:'costruzione', steps:[
   {label:'Le quattro condizioni di raccordo', body:R`
   <p>Per $V(x)=V_0$ in $0<x<a$ e zero altrove, con $0<E<V_0$, la forma delle soluzioni è $\psi=e^{ikx}+Be^{-ikx}$ per $x<0$, $\psi=Be^{\chi x}+B'e^{-\chi x}$ per $0<x<a$ (reale, perché $E<V_0$ rende l&rsquo;equazione del tipo a decadimento), $\psi=Ce^{ik(x-a)}$ per $x>a$, con $k=\sqrt{2mE}/\hbar$ e $\chi=\sqrt{2m(V_0-E)}/\hbar$. Le quattro condizioni — continuità di $\psi$ e $\psi'$ a $x=0$ e a $x=a$ — sono quattro equazioni lineari nelle quattro incognite $B,\,B_{\rm int},\,B'_{\rm int},\,C$, e risolvendole (è un sistema lineare $4\times4$, risolto qui con l&rsquo;algebra, non con un argomento nuovo) si trova</p>
   $$T=|C|^{2}=\frac{4k^{2}\chi^{2}}{4k^{2}\chi^{2}+(k^{2}+\chi^{2})^{2}\sinh^{2}(\chi a)}.$$`},
   {label:'In E e V0, e il controllo R+T=1', body:R`
   <p>Usando $k^2+\chi^2=2mV_0/\hbar^2$ — la somma non dipende da $E$, solo da $V_0$ — l&rsquo;espressione diventa</p>
   $$T=\frac{4E(V_{0}-E)}{4E(V_{0}-E)+V_{0}^{2}\sinh^{2}(\chi a)},\qquad \chi=\frac{\sqrt{2m(V_{0}-E)}}{\hbar},$$
   <p>e $R=1-T$ si verifica essere esattamente ciò che il calcolo diretto di $|B|^2$ produce: $R+T=1$, come il teorema generale della tappa 03 impone. Questa è la formula di Picasso (8.34), identica a quella del Problema 2.35 di Griffiths — due libri, stessa barriera, stessa espressione fino all&rsquo;ultima parentesi.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Il teorema del tunnel dice che $T>0$ sempre. Vale anche per $E=0$ esattamente?`,
    a:R`Il teorema richiede $V(x)-E$ positivo (regione classicamente proibita) perché la soluzione sia del tipo a decadimento esponenziale, non oscillante — ma l&rsquo;argomento di unicità (nessuna soluzione del secondo ordine si annulla su un intervallo insieme alla derivata) non usa affatto il segno di $E$: vale identicamente. Il caso $E\to0$ è singolare per un motivo diverso — $k\to0$ rende l&rsquo;onda incidente non normalizzabile nel modo standard — ma non per il teorema del tunnel in sé, che resta vero: $T\to4E\chi_0^{-2}a^{-2}\cdot(\ldots)$, un numero piccolo ma mai zero, salvo il limite banale $E=0$ dove non c&rsquo;è più niente che si propaghi.`}
  ]}
]},

/* ---------------- 06 · L'INTERNO DELLA BARRIERA ---------------- */
{ num:'06', title:'L&rsquo;interno della barriera: non è un decadimento esponenziale semplice', meta:'psi dentro la barriera non decade monotonicamente · il teorema della pendenza nulla · due combinazioni, non una',
  blocchi:[
  {t:'prosa', title:'L&rsquo;errore di intuizione più comune', tag:'avvertenza', html:R`
  <p>L&rsquo;immagine mentale standard del tunnel — una curva che entra nella barriera ed esce più piccola, decadendo come $e^{-\chi x}$ — è sbagliata, e Ballentine lo segnala esplicitamente: <i>«contrary to the qualitative sketches that are sometimes seen, the behavior of $\Psi(x)$ inside the barrier is not simply an exponential decay»</i>. La ragione è nella soluzione stessa, della tappa 05: dentro la barriera $\psi=Be^{\chi x}+B'e^{-\chi x}$ è la somma di un esponenziale <i>crescente</i> e uno <i>decrescente</i>, non uno dei due isolato — a differenza del caso degli stati legati, dove la richiesta di normalizzabilità eliminava uno dei due termini. Qui nessuna normalizzabilità lo vieta, e in generale $B\ne0$.</p>`},
  {t:'reveal', title:'Il teorema della pendenza nulla', tag:'costruzione', steps:[
   {label:'Cosa impone la continuità, applicata al modulo', body:R`
   <p>Ballentine nota un vincolo che non è ovvio a prima vista: poiché $\Psi$ e $d\Psi/dx$ sono entrambe continue alla faccia d&rsquo;uscita $x=a$, anche $|\Psi|$ e $d|\Psi|/dx$ lo sono. Ma a destra di $x=a$ c&rsquo;è soltanto l&rsquo;onda trasmessa $Ce^{ikx}$, che ha $|\Psi|=|C|$ <b>costante</b> — quindi la sua derivata è nulla. Per continuità,</p>
   $$\frac{d|\psi|^{2}}{dx}\Big|_{x=a}=0$$
   <p>deve valere anche calcolato da dentro la barriera, con $\psi=Be^{\chi x}+B'e^{-\chi x}$. Il calcolo diretto di $|\psi|^2$ dentro la barriera e della sua derivata in $x=a$ confirma il vincolo.</p>`},
   {label:'La conseguenza: il modulo decresce sempre, ma non come un esponenziale puro', body:R`
   <p>La conseguenza fisica, nella parole di Ballentine: <i>«hence it is always the case that $|\Psi|$ has a zero slope at the exit surface of the barrier, which implies that the decay can never be exactly exponential»</i> — un esponenziale puro ha pendenza proporzionale al valore stesso, mai nulla a meno che il valore non sia zero. <b>Nessuna delle due componenti separate ha pendenza nulla in generale</b>: è solo la loro <i>somma</i>, con i coefficienti giusti fissati dal raccordo, a produrla. Ballentine dà anche un caso limite che chiarisce la geometria: per $E=V_0$ esattamente, l&rsquo;equazione dentro la barriera ha $\chi=0$ e la soluzione non è più esponenziale ma <b>lineare</b> in $x$ — e una retta con pendenza nulla in un punto è semplicemente una retta orizzontale, che è il caso degenere più semplice del teorema.</p>`}
  ]},
  {t:'prosa', title:'Da dove viene il flusso, se il modulo decresce', tag:'costruzione', html:R`
  <p>Il punto che a prima vista sembra in tensione con l&rsquo;esistenza di una corrente netta attraverso la barriera — se $|\psi|$ decresce, come può esserci flusso? — si risolve notando che la corrente non dipende dal modulo da solo, ma dalla fase: <i>«the complex nature of $\Psi(x)$ and the progressive increase of its phase are essential for it to carry a nonzero flux»</i>. Dentro la barriera $\psi$ non è reale — a differenza del caso $E<V_0$ del gradino nella tappa 04, dove la riflessione era totale e $\psi$ si poteva prendere reale a meno di una fase globale costante — perché qui i due coefficienti $B$ e $B'$ sono in generale complessi e con fasi relative diverse, e la fase di $\psi$ avanza man mano che $x$ cresce. La corrente, calcolata dentro la barriera con questa fase che avanza, risulta esattamente uguale alla corrente dell&rsquo;onda trasmessa fuori: $j_{\rm dentro}=j_{\rm trasmessa}$, com&rsquo;era garantito fin dall&rsquo;inizio dalla costanza spaziale di $j$ dimostrata alla tappa 02 — qui è solo verificata sul caso esplicito.</p>`},
  {t:'plot', title:'La funzione d&rsquo;onda dentro la barriera, caso di Ballentine',
   intro:R`<p>$E=0{,}16$, $V_0=1$, $a=1$ (unità $\hbar=2M=1$ di Ballentine): la parte reale di $\psi$ dentro la barriera prima scende, poi risale — non è un decadimento monotono.</p>`,
   plots:[{kind:'func2d', xr:[-1,2], yr:[-1,1.3], height:270, ticks:true,
     title:'Re(psi) per il caso di Ballentine (E=0.16, V0=1, a=1)',
     curves:[{f:'(x<0)?(Math.cos(0.4*x)-0.4568*Math.cos(0.4*x)-0.6807*(-Math.sin(0.4*x))*(-1)):((x>=0&&x<=1)?(0.4572*Math.exp(0.9165*(x))*0+0.1229*Math.exp(0.9165*x)+0.4199*Math.exp(-0.9165*x)):(0.4752*Math.cos(0.4*(x-1))-0.3192*(-Math.sin(0.4*(x-1)))))', col:'#5aa9ff', width:2.2, label:'Re(psi) (profilo qualitativo)'}],
     xlabel:'x', ylabel:'Re(psi)'}],
   leggi:R`<p><b>Che cosa guardare.</b> Nella regione $0<x<1$ (la barriera) la curva non è un singolo esponenziale: è la somma di una parte crescente e una decrescente con pesi diversi, ed è questo a produrre il minimo interno che Ballentine descrive — <i>«the real part of $\Psi$ first decreases, and then begins to increase»</i>.</p>
   <p><b>Che cosa impararne.</b> La forma qualitativa che si insegna di solito — una curva che decade monotonicamente dentro la barriera — è un&rsquo;approssimazione valida solo quando la barriera è <i>molto opaca</i> ($\chi a\gg1$), il caso della tappa 07, dove il termine crescente $Be^{\chi x}$ diventa trascurabile rispetto a quello decrescente su quasi tutto l&rsquo;intervallo. Per una barriera sottile o poco alta, come qui, i due termini sono comparabili ovunque e il comportamento monotono non c&rsquo;è.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Se dentro la barriera $\psi$ fosse reale a meno di una fase costante globale (come nel caso $E<V_0$ del gradino), che cosa succederebbe alla corrente trasmessa?`,
    a:R`Si annullerebbe: una funzione reale a meno di una fase <i>costante</i> ha $\mathrm{Im}(\psi^*\psi')=0$ ovunque, perché la fase non dipende da $x$ e quindi non contribuisce alla derivata in modo che generi una parte immaginaria netta. Questo è esattamente il motivo per cui nel gradino con $E<V_0$ — dove effettivamente $\psi$ a destra può essere presa reale a meno di una fase globale — $T=0$ identicamente: non c&rsquo;è nessuna barriera <i>finita</i> da attraversare, la regione proibita si estende all&rsquo;infinito, e lì sì che il decadimento puro senza fase che avanza è la soluzione fisica.`}
  ]}
]},

/* ---------------- 07 · IL LIMITE OPACO, E IL MICROSCOPIO A EFFETTO TUNNEL ---------------- */
{ num:'07', title:'Il limite di barriera opaca, e il microscopio a effetto tunnel', meta:'T diventa esponenziale in a · la correzione a Ballentine, dichiarata e verificata · Binnig 1982, e perché funziona solo con elettroni',
  blocchi:[
  {t:'prosa', title:'Quando sinh domina: il regime esponenziale', tag:'costruzione', html:R`
  <p>Per una barriera larga o alta, $\chi a\gg1$, $\sinh(\chi a)\approx\frac12 e^{\chi a}$ domina il denominatore della formula della tappa 05, e</p>
  $$T\simeq\frac{16E(V_{0}-E)}{V_{0}^{2}}\,e^{-2\chi a}:$$
  <p>la trasmissione cade esponenzialmente con lo spessore della barriera, con un prefattore che dipende solo dal rapporto $E/V_0$. È questo regime, non la formula esatta della tappa 05, quello che rende il tunnel osservabile e misurabile sperimentalmente — e quello su cui si basa il microscopio a effetto tunnel.</p>`},
  {t:'reveal', title:'Una correzione dichiarata, non nascosta', tag:'avvertenza', steps:[
   {label:'Il numero che Ballentine stampa, e il numero che il calcolo dà', body:R`
   <p>Nell&rsquo;estratto di Ballentine disponibile, l&rsquo;equazione (4.38) — il limite per $\beta a\gg1$ della sua (4.37), che è la stessa formula della tappa 05 scritta con $\beta$ al posto di $\chi$ — riporta il prefattore come $4E(V_0-E)/V_0^2$. Ricalcolando il limite $\lim_{a\to\infty}T\,e^{2\chi a}$ direttamente dalla formula esatta (4.37), verificata identica a quella della tappa 05, il risultato è</p>
   $$\lim_{a\to\infty}T\,e^{2\chi a}=\frac{16E(V_{0}-E)}{V_{0}^{2}},$$
   <p>cioè <b>quattro volte</b> il valore stampato. La formula esatta di partenza è verificata corretta — coincide con quella della tappa 05, a sua volta verificata indipendentemente — quindi la discrepanza sta nel passaggio al limite stampato nel testo disponibile, con tutta probabilità un artefatto della scansione (una cifra o un quadrato perso), non un errore concettuale dell&rsquo;autore: il valore $16$, non $4$, è quello che questo movimento usa.</p>`},
   {label:'Perché non è un dettaglio da ignorare', body:R`
   <p>Il fattore numerico non cambia la fisica qualitativa — l&rsquo;esponenziale $e^{-2\chi a}$ resta identico, e Figura 4.4 di Ballentine (il grafico di $\log T$ contro $a$) non distingue le due costanti, visibili solo nell&rsquo;intercetta. Ma è esattamente il tipo di numero che un esperimento di STM usa per calibrare: la tappa 08 lo userà per stimare $T$ a distanze atomiche, e un fattore $4$ sbagliato nel prefattore produrrebbe una stima sistematicamente fuori per un fattore $4$ — piccolo rispetto alla sensibilità esponenziale alla distanza, ma non trascurabile in un confronto quantitativo. <i>Verificare prima di citare</i> è la regola che questo punto applica alla lettera.</p>`}
  ]},
  {t:'prosa', title:'Il microscopio a effetto tunnel', tag:'esame', html:R`
  <p>L&rsquo;applicazione storica è quella di Binnig, Rohrer e colleghi (1982): una punta metallica affilata, separata da un vuoto sottile da una superficie conduttrice, realizza esattamente il modello della barriera rettangolare, con $V_0-E$ uguale alla <b>funzione lavoro</b> del metallo — l&rsquo;energia che separa il livello di Fermi dentro il metallo dal vuoto. Per un elettrone con funzione lavoro tipica di $4\,\mathrm{eV}$,</p>
  $$\chi\approx1{,}025\ \text{\AA}^{-1},$$
  <p>cioè la trasmissione cambia di un fattore</p>
  $$e^{2\chi\cdot1\,\text{\AA}}\approx7{,}76$$
  <p>per ogni angstrom di distanza — una sensibilità enorme, che è esattamente ciò che rende il microscopio capace di risolvere irregolarità di superficie dello spessore di un decimo di angstrom, come Ballentine riporta: <i>«the very sensitive dependence of the tunneling current on the distance of the metal tip from the surface is utilized in the scanning tunneling microscope, which is able to measure surface irregularities as small as $0{,}1$ angstrom»</i>.</p>`},
  {t:'prosa', title:'Perché con un protone non funzionerebbe', tag:'costruzione', html:R`
  <p>Il coefficiente $\chi=\sqrt{2m(V_0-E)}/\hbar$ dipende dalla massa sotto radice: a parità di $V_0-E$, un protone ha</p>
  $$\chi_{p}/\chi_{e}=\sqrt{m_{p}/m_{e}}\approx42{,}85,$$
  <p>cioè quarantatré volte più grande. Poiché $T$ cade come $e^{-2\chi a}$, lo stesso spessore di barriera che dà $T\sim10^{-1}$ per un elettrone darebbe per un protone un esponente quarantatré volte più negativo — un numero così piccolo da essere fisicamente nullo per qualunque scopo pratico, a quelle stesse distanze. Questo è il motivo fisico, non un dettaglio tecnico, per cui l&rsquo;effetto tunnel a distanze atomiche è un fenomeno elettronico: la stessa fisica, applicata a particelle alfa su barriere nucleari larghe pochi fermi ma profonde decine di MeV — l&rsquo;esempio che Shankar cita, <i>«an $\alpha$ particle trapped in the nuclei by a barrier [...] every once in a while [...] manages to penetrate the barrier and come out»</i> — è ciò che rende possibile il decadimento alfa, con vite medie che vanno da microsecondi a miliardi di anni secondo quanto $\chi a$ è grande.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Il decadimento alfa ha vite medie che vanno da frazioni di secondo a più di $10^{10}$ anni, per nuclei con energie di decadimento che differiscono solo di un fattore 2 o 3. Che cosa, in questa tappa, spiega una variazione così estrema a partire da una variazione così piccola?`,
    a:R`L&rsquo;esponenziale $e^{-2\chi a}$: una variazione modesta nell&rsquo;energia $E$ (quindi in $V_0-E$) cambia $\chi$ di una frazione modesta, ma $\chi$ compare moltiplicato per $a$ — la larghezza effettiva della barriera coulombiana, che per un nucleo pesante è dell&rsquo;ordine di decine di fermi — <i>dentro un esponenziale</i>. Una variazione del 10% in $\chi a$ cambia $T$, e quindi il tasso di decadimento, di un fattore $e^{0{,}2\chi a}$ che per $\chi a\sim50$ è dell&rsquo;ordine di $e^{10}\approx2\times10^4$: bastano pochi raddoppi di questo tipo di sensibilità per produrre le quindici cifre di differenza osservate. È la legge di Geiger-Nuttall, ed è la stessa matematica di questa tappa applicata a una barriera coulombiana invece che rettangolare.`}
  ]}
]},

/* ---------------- 08 · LA STRUTTURA GENERALE, E LA BARRIERA SOPRA IL LIVELLO ---------------- */
{ num:'08', title:'La struttura generale: la matrice di trasferimento, e la barriera sopra il livello', meta:'la stessa barriera per E>V0 · risonanze di trasmissione totale · perche la figura 8.8 di Picasso sceglie proprio 2mV0a^2/hbar^2=9',
  blocchi:[
  {t:'prosa', title:'Da chi dentro a chi fuori, in generale', tag:'costruzione', html:R`
  <p>Ballentine organizza tutto il calcolo della barriera attorno a una <b>matrice di trasferimento</b> $[P]$, che lega i coefficienti a sinistra a quelli a destra, $\binom{A_1}{B_1}=[P]\binom{A_2}{B_2}$, costruita componendo le matrici delle due condizioni di raccordo. Il vantaggio dichiarato è che <i>«this transfer matrix method can obviously be generalized to calculate the transmission through any series of potential wells and barriers in one dimension»</i>: ogni barriera o buca aggiuntiva si traduce in un fattore di matrice in più da moltiplicare, senza risolvere un sistema lineare più grande. $R$ e $T$ si leggono direttamente dagli elementi di $[P]$,</p>
  $$R=\Big|\frac{P_{21}}{P_{11}}\Big|^{2},\qquad T=\Big|\frac{1}{P_{11}}\Big|^{2},$$
  <p>ed è la stessa struttura della relazione $A_2=\alpha A_1+\beta B_1$ di Landau vista alla tappa 03, con $\alpha=1/P_{11}^{*}$ a meno di convenzioni — due formalismi diversi, stessa fisica.</p>`},
  {t:'prosa', title:'La barriera per E>V0: nessun raccordo nuovo, solo χ immaginario', tag:'costruzione', html:R`
  <p>La formula della tappa 05 si estende al caso $E>V_0$ con una sola sostituzione algebrica, che Picasso segnala esplicitamente: $\chi\to ik_2$ con $k_2=\sqrt{2m(E-V_0)}/\hbar$, che trasforma $\sinh$ in $\sin$ (a meno di un fattore $i$ che si cancella nel modulo quadro):</p>
  $$T=\frac{4k^{2}k_{2}^{2}}{4k^{2}k_{2}^{2}+(k^{2}-k_{2}^{2})^{2}\sin^{2}(k_{2}a)}.$$
  <p>Non è un calcolo nuovo: è lo stesso calcolo, continuato analiticamente in una regione di energia diversa — la stessa funzione olomorfa di $E$, letta sopra e sotto la soglia $V_0$.</p>`},
  {t:'reveal', title:'Le risonanze: dove la barriera diventa trasparente', tag:'esame', steps:[
   {label:'La condizione', body:R`
   <p>Quando $k_2a=n\pi$ con $n$ intero, $\sin(k_2a)=0$ e il denominatore della formula si riduce al solo primo termine: $T=1$ esattamente, <b>trasmissione totale</b>, anche attraverso una barriera di altezza $V_0$ finita. È lo stesso tipo di condizione — un numero intero di semi-lunghezze d&rsquo;onda dentro la regione centrale — che produrrà la trasparenza della buca nella tappa 10, e non è un caso: in entrambi i casi la condizione di risonanza è che l&rsquo;onda dentro la regione centrale, riflessa avanti e indietro dalle due pareti, interferisca costruttivamente con se stessa esattamente come in una cavità ottica.</p>`},
   {label:'Il caso numerico di Picasso: perché 2mV0a²/ħ²=9', body:R`
   <p>Picasso riporta in figura 8.8 il caso $2mV_0a^2/\hbar^2=9$, dichiarando che per un elettrone con $V_0=1\,\mathrm{eV}$ corrisponde ad $a\approx6\,\text{\AA}$ — una scelta non casuale, perché con questo valore la prima risonanza sopra la barriera cade a</p>
   $$E/V_{0}\approx2{,}097,$$
   <p>abbastanza vicina a $V_0$ da essere visibile nello stesso grafico che mostra anche il regime $E<V_0$, e abbastanza lontana da non confondersi con la soglia. È lo stesso principio della «finestra giusta» che guida la scelta dei parametri in ogni esempio numerico di questo movimento: un valore scelto per rendere visibile il fenomeno, non arbitrario.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`La condizione di risonanza $k_2a=n\pi$ è identica, dimensionalmente, alla condizione di quantizzazione della particella su un segmento a pareti infinite. È una coincidenza?`,
    a:R`No: entrambe le condizioni dicono che un numero intero di semi-lunghezze d&rsquo;onda entra nell&rsquo;intervallo $(0,a)$. Nel segmento la condizione fissa l&rsquo;<i>energia permessa</i>, perché lì le pareti sono infinite e non c&rsquo;è nessun&rsquo;altra onda con cui confrontarsi. Qui le pareti sono di altezza finita, l&rsquo;energia è libera di variare continuamente, e la stessa condizione — invece di selezionare uno stato — seleziona le energie alle quali l&rsquo;onda riflessa dalle due pareti si cancella esattamente con sé stessa, lasciando passare tutto. È la stessa matematica (un&rsquo;onda stazionaria dentro una cavità) applicata a due problemi fisici diversi: uno di spettro discreto, uno di trasmissione continua.`}
  ]}
]},

/* ---------------- 09 · LA DELTA DI DIRAC COME DIFFUSORE ---------------- */
{ num:'09', title:'La delta di Dirac come diffusore, e il polo che è uno stato legato', meta:'un calcolo diverso, non un nuovo principio · il polo nel piano complesso di k · la buca e la barriera a delta hanno lo stesso R e T',
  blocchi:[
  {t:'prosa', title:'Lo stesso schema, un potenziale più singolare', tag:'costruzione', html:R`
  <p>Per $V(x)=-\alpha\,\delta(x)$ ($\alpha>0$, buca a delta), la condizione di raccordo non è quella «ordinaria» delle tappe precedenti — qui $\psi$ resta continua ma $\psi'$ salta, con il salto proporzionale a $\psi(0)$, come accade per ogni potenziale con una singolarità a <span class="str" data-str="delta-di-dirac">delta</span>: integrando l&rsquo;equazione di Schrödinger fra $-\epsilon$ e $+\epsilon$ e mandando $\epsilon\to0$, l&rsquo;unico termine che sopravvive accanto al salto di $\psi'$ è l&rsquo;integrale della delta. Con $\psi=e^{ikx}+Be^{-ikx}$ a sinistra e $Fe^{ikx}$ a destra, le due condizioni (continuità di $\psi$, salto di $\psi'$ pari a $-2m\alpha\psi(0)/\hbar^2$) danno il sistema che Griffiths risolve esplicitamente, con $\beta=m\alpha/(\hbar^2k)$:</p>`},
  {t:'reveal', title:'B, F, e i coefficienti', tag:'costruzione', steps:[
   {label:'La soluzione del sistema', body:R`
   <p>Risolvendo le due equazioni lineari,</p>
   $$B=\frac{-\beta}{\beta+i},\qquad F=\frac{i}{\beta+i},$$
   <p>da cui</p>
   $$R=\frac{\beta^{2}}{1+\beta^{2}},\qquad T=\frac{1}{1+\beta^{2}},$$
   <p>e si verifica $R+T=1$ — ancora il teorema della tappa 03, applicato a un potenziale che non è nemmeno una funzione ordinaria.</p>`},
   {label:'In termini dell&rsquo;energia di legame della buca', body:R`
   <p>Sostituendo $\beta^2=m\alpha^2/(2\hbar^2E)$,</p>
   $$T=\frac{1}{1+|E_{b}|/E},\qquad |E_{b}|=\frac{m\alpha^{2}}{2\hbar^{2}},$$
   <p>dove $|E_b|$ è, come si trova risolvendo direttamente il problema agli stati legati della buca delta, <i>esattamente l&rsquo;energia di legame dell&rsquo;unico stato legato della buca delta</i>. La trasmissione attraverso la buca si scrive naturalmente nei termini dello stato legato che quella stessa buca sostiene — non è un&rsquo;osservazione decorativa, è il contenuto della prossima parte.</p>`}
  ]},
  {t:'reveal', title:'Il polo che è lo stato legato', tag:'esame', steps:[
   {label:'Dove F diverge', body:R`
   <p>Il coefficiente di trasmissione $F=i/(\beta+i)$, scritto in funzione di $k$ con $\beta=m\alpha/(\hbar^2k)$, ha un polo dove $1-i\beta=0$, cioè</p>
   $$k_{\rm polo}=\frac{im\alpha}{\hbar^{2}}:$$
   <p>un valore <b>immaginario puro</b> di $k$, al di fuori dell&rsquo;asse reale dove vive la fisica degli stati di scattering.</p>`},
   {label:'L&rsquo;energia a quel polo', body:R`
   <p>Sostituendo questo $k$ immaginario in $E=\hbar^2k^2/(2m)$,</p>
   $$E_{\rm polo}=-\frac{m\alpha^{2}}{2\hbar^{2}}:$$
   <p>esattamente l&rsquo;energia dell&rsquo;unico stato legato della buca delta, calcolata con un metodo completamente diverso (risolvere direttamente l&rsquo;equazione per $E<0$). <b>Il <span class="str" data-str="singolarita-isolate">polo</span> del coefficiente di trasmissione, nel piano complesso del numero d&rsquo;onda, è lo stato legato</b>: non una coincidenza numerica, ma un fatto strutturale — lo stato legato è la soluzione che l&rsquo;equazione di scattering continua ad avere anche quando l&rsquo;onda incidente, formalmente, non esiste più (perché $k$ non è reale). È il meccanismo con cui la teoria della diffusione, in problemi più generali, individua gli stati legati senza risolverli separatamente: si cercano i poli di $T(k)$ nel semipiano superiore di $k$ complesso.</p>`}
  ]},
  {t:'prosa', title:'La buca e la barriera a delta hanno lo stesso R e T', tag:'avvertenza', html:R`
  <p>Griffiths osserva un fatto che sorprende a prima vista: cambiando il segno di $\alpha$ — passando dalla buca ($\alpha>0$) alla barriera a delta ($\alpha<0$) — <i>«this kills the bound state, of course [...] on the other hand, the reflection and transmission coefficients, which depend only on $\alpha^2$, are unchanged. Strange to say, the particle is just as likely to pass through the barrier as to cross over the well!»</i>. La ragione algebrica è immediata: $\beta^2=m\alpha^2/(2\hbar^2E)$ dipende solo dal quadrato di $\alpha$, quindi $R$ e $T$ non vedono il segno. Classicamente l&rsquo;asimmetria è totale — una barriera infinita non si attraversa mai, qualunque sia l&rsquo;energia — e Griffiths lo sottolinea: <i>«classical scattering problems are pretty dull [...] quantum scattering problems are much richer»</i>. La delta, proprio per la sua singolarità, rende quest&rsquo;asimmetria classica invisibile a $R$ e $T$: è forse il caso in cui la differenza fra intuizione classica e risposta quantistica è più netta di tutto il movimento.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Il teorema del tunnel della tappa 05 richiede che la barriera sia un intervallo finito. La delta è un potenziale concentrato in un punto: il teorema si applica?`,
    a:R`Sì, e proprio perché è il caso limite più estremo: il teorema dice che $\psi$ non può annullarsi, insieme alla derivata, su un <i>intervallo</i> — e una delta, per quanto singolare nel punto $x=0$, lascia $\psi$ perfettamente regolare (anche se con derivata discontinua) su tutto il resto dell&rsquo;asse. Non c&rsquo;è nessun intervallo su cui $\psi$ debba annullarsi, quindi il teorema non è nemmeno sotto tensione: la trasmissione $T=1/(1+\beta^2)$ è strettamente positiva per ogni $\beta$ finito, cioè per ogni $\alpha$ ed $E$ finiti, ed è solo nel limite $\alpha\to\infty$ (barriera infinitamente intensa) che $T\to0$.`}
  ]}
]},

/* ---------------- 10 · LA BUCA FINITA COME DIFFUSORE ---------------- */
{ num:'10', title:'La buca finita come diffusore: trasparenza e l&rsquo;effetto Ramsauer-Townsend', meta:'la stessa buca degli stati legati, ora sopra il livello zero · trasparenza totale alle energie del segmento infinito · la delta come limite comune di barriera e buca',
  blocchi:[
  {t:'prosa', title:'Un oggetto già noto, una domanda nuova', tag:'costruzione', html:R`
  <p>La buca rettangolare finita $V(x)=-V_0$ per $|x|<a$, zero altrove, è lo stesso potenziale che sostiene un numero finito di stati legati per $E<0$. Qui la domanda è diversa: che cosa succede per $E>0$, dove non ci sono più livelli discreti, solo diffusione? Griffiths risolve il sistema di raccordo in $x=\pm a$ con la stessa tecnica delle tappe precedenti — qui la soluzione interna è oscillante, $l=\sqrt{2m(E+V_0)}/\hbar$ al posto del $\chi$ decrescente della barriera — e il risultato (2.169) è</p>`},
  {t:'reveal', title:'Trasparenza totale: l&rsquo;effetto Ramsauer-Townsend', tag:'esame', steps:[
   {label:'La formula, e la condizione di trasparenza', body:R`
   <p>Il coefficiente di trasmissione per la buca è</p>
   $$T=\Big[1+\frac{V_{0}^{2}}{4E(E+V_{0})}\sin^{2}(2la)\Big]^{-1},\qquad l=\frac{\sqrt{2m(E+V_{0})}}{\hbar}.$$
   <p>Quando $\sin(2la)=0$, cioè $2la=n\pi$, $T=1$ esattamente — la stessa struttura di risonanza della barriera alla tappa 08, qui per una buca attrattiva. Risolvendo la condizione per l&rsquo;energia,</p>
   $$E_{n}+V_{0}=\frac{n^{2}\pi^{2}\hbar^{2}}{2m(2a)^{2}}:$$
   <p>le energie di trasparenza totale sono <b>esattamente le energie permesse del segmento infinito</b> di larghezza $2a$ — lo stesso segmento a pareti infinite, qui visto non come spettro discreto isolato ma come il luogo dove un continuo diventa invisibile al diffusore.</p>`},
   {label:'Il nome del fenomeno, e un numero', body:R`
   <p>Questo fenomeno — un fascio di particelle che attraversa la buca senza riflettersi affatto, a energie particolari — è osservato in laboratorio e si chiama <b>effetto Ramsauer-Townsend</b>, originariamente misurato per elettroni diffusi da atomi di gas nobile. Il primo livello di trasparenza, con $V_0=1$, $2m=\hbar=1$, $a=1$ (unità di Griffiths), cade a</p>
   $$E_{1}\approx1{,}467,$$
