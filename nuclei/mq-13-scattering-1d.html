   <p>e i successivi crescono come $n^2$, esattamente come i livelli discreti dello stesso segmento se $V_0$ fosse infinito.</p>`}
  ]},
  {t:'prosa', title:'La delta come limite comune di barriera e buca', tag:'costruzione', html:R`
  <p>Un controllo di consistenza chiude il cerchio apertosi alla tappa 09. Se si prende una barriera di larghezza $w\to0$ e altezza $\alpha/w\to\infty$ in modo che l&rsquo;area $\alpha$ resti fissa — la stessa costruzione con cui si definisce la delta di Dirac come limite di un rettangolo, già usata per gli stati legati — il coefficiente di trasmissione della tappa 05 tende esattamente a $T=1/(1+m\alpha^2/(2\hbar^2E))$, cioè il risultato della delta trovato alla tappa 09. La stessa costruzione applicata alla buca di questa tappa, con $V_0=\alpha/w\to\infty$ e $w\to0$, dà <b>lo stesso limite</b>:</p>
  $$\lim_{w\to0}T_{\rm barriera}(\alpha)=\lim_{w\to0}T_{\rm buca}(\alpha).$$
  <p>È lo stesso fatto osservato da Griffiths alla tappa 09 — barriera e buca a delta condividono $R$ e $T$ — ma qui si vede <i>come ci si arriva</i>: non è una coincidenza della delta, è il limite comune di due famiglie di potenziali che, allargate, sarebbero visibilmente diverse (una spinge fuori, una attira dentro) e che il limite di area fissa rende indistinguibili per la diffusione, pur restando distinguibili per gli stati legati (la barriera non ne ha nessuno, la buca ne ha esattamente uno).</p>`},
  {t:'plot', title:'La buca finita: trasparenza alle energie del segmento',
   intro:R`<p>$T(E)$ per la buca di Griffiths, in unità $V_0=1$, $2m=\hbar=1$, $a=1$: i picchi di trasparenza totale cadono esattamente alle energie $E_n$ del segmento infinito corrispondente.</p>`,
   plots:[{kind:'func2d', xr:[0.1,10], yr:[-0.05,1.1], height:270, ticks:true,
     title:'T(E) per la buca finita (Ramsauer-Townsend)',
     curves:[{f:'1/(1+(1/(4*x*(x+1)))*Math.pow(Math.sin(2*Math.sqrt(x+1)),2))', col:'#5aa9ff', width:2.2, label:'T(E)'}],
     xlabel:'E (unita di V0)', ylabel:'T'}],
   leggi:R`<p><b>Che cosa guardare.</b> I picchi dove $T$ tocca esattamente $1$ sono alle energie $E_n+V_0=n^2\pi^2\hbar^2/(2m(2a)^2)$: con i parametri del grafico, il primo è vicino a $E\approx1{,}47$. Fra un picco e l&rsquo;altro $T$ scende ma non si annulla mai del tutto, a differenza della barriera dove la trasmissione può diventare arbitrariamente piccola.</p>
   <p><b>Che cosa impararne.</b> La buca, essendo attrattiva, non ha mai un regime «opaco» come la barriera: l&rsquo;onda al suo interno oscilla sempre (non decade mai esponenzialmente), quindi $T$ resta dell&rsquo;ordine dell&rsquo;unità su tutto lo spettro, con le sole oscillazioni dovute all&rsquo;interferenza. È l&rsquo;immagine speculare della tappa 07: lì l&rsquo;esponenziale domina e produce un regime di trasmissione piccola; qui l&rsquo;oscillazione domina e produce un regime di trasmissione quasi sempre alta.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Per $V_0\to\infty$ a $a$ fissato, le energie di trasparenza $E_n+V_0=n^2\pi^2\hbar^2/(2m(2a)^2)$ sembrano richiedere $E_n\to-\infty$, che è assurdo per un'energia di scattering. Che cosa non va in questo ragionamento?`,
    a:R`Il ragionamento applica il limite alla formula nel modo sbagliato: la formula lega $E_n+V_0$ (non $E_n$ da solo) alle energie del segmento, e per $V_0\to\infty$ le energie di trasparenza $E_n$ *restano positive e finite* solo se non si manda $V_0$ all'infinito mantenendo $n$ fisso — bisogna far crescere anche $n$ in proporzione. Nel limite in cui $V_0\to\infty$ a $E_n$ fisso, la formula descrive correttamente il fatto che occorrono indici $n$ sempre più alti: la trasparenza esiste sempre, a patto di guardare armoniche sempre più fini della stessa condizione $2la=n\pi$. Non è un paradosso, è un promemoria che le formule asintotiche si leggono con la variabile giusta tenuta fissa.`}
  ]}
]},

/* ---------------- 11 · I PROBLEMI DI LANDAU: DUE POTENZIALI CHE NON SONO RETTANGOLI ---------------- */
{ num:'11', title:'Due potenziali che non sono rettangoli: i problemi di Landau', meta:'il gradino morbido, risolto con le ipergeometriche · il paradosso della tappa 04, sciolto · la barriera-buca 1/cosh^2, trasparente a energie precise',
  blocchi:[
  {t:'prosa', title:'Perché serve un potenziale che non sia un rettangolo', tag:'costruzione', html:R`
  <p>Ogni calcolo delle tappe precedenti ha usato un potenziale costante a tratti, e questo lascia una domanda aperta: quanto di ciò che si è trovato dipende dalla forma rettangolare, e quanto è generale? Landau risolve due problemi con potenziali <i>lisci</i> — risolubili esattamente in termini di funzioni ipergeometriche — che permettono di rispondere, e il primo scioglie direttamente il paradosso lasciato aperto alla tappa 04.</p>`},
  {t:'reveal', title:'Il gradino morbido: $U_0/(1+e^{-\\alpha x})$', tag:'esame', steps:[
   {label:'La soluzione, e il coefficiente di riflessione', body:R`
   <p>Per questo potenziale — un gradino che sale con dolcezza controllata dal parametro $\alpha$, invece che discontinuamente — l&rsquo;equazione di Schrödinger si trasforma, con il <span class="str" data-str="cambio-di-variabile">cambio di variabile</span> $\xi=-e^{-\alpha x}$, in un&rsquo;equazione ipergeometrica, e la soluzione che soddisfa le condizioni asintotiche giuste dà, dopo un calcolo che usa la formula di riflessione di Euler $\Gamma(z)\Gamma(1-z)=\pi/\sin(\pi z)$ — lo <span class="str" data-str="funzione-gamma">strumento</span> che rende l&rsquo;espressione finale compatta —</p>
   $$R=\frac{\sinh^{2}\!\big[\pi(k_{1}-k_{2})/\alpha\big]}{\sinh^{2}\!\big[\pi(k_{1}+k_{2})/\alpha\big]}.$$`},
   {label:'Il limite che risolve il paradosso', body:R`
   <p>Per $\alpha\to\infty$ — gradino sempre più brusco, verso il limite netto — questa espressione tende a</p>
   $$\alpha\to\infty:\ R\to\Big(\frac{k_{1}-k_{2}}{k_{1}+k_{2}}\Big)^{2},$$
   <p>cioè esattamente il risultato del gradino netto della tappa 04: il calcolo liscio <i>contiene</i> il calcolo discontinuo come caso limite, confermando che non c&rsquo;è nulla di patologico nella formula originaria. Ma ora, a differenza del gradino netto, esiste una scala di lunghezza reale, $1/\alpha$, e si può prendere il limite classico correttamente: a $\alpha$ <i>fissato</i> e $E\to\infty$ (cioè lunghezza d&rsquo;onda piccola rispetto a $1/\alpha$),</p>
   $$E\to\infty\ (\alpha\ \text{fissato}):\ R\to0,$$
   <p>esponenzialmente. <b>Il paradosso della tappa 04 si scioglie qui, non con una frase ma con un secondo calcolo</b>: il limite classico esiste, è $R\to0$, e richiede che la transizione sia liscia su una scala confrontabile con la lunghezza d&rsquo;onda — esattamente la condizione che il gradino schematico, per costruzione, non può soddisfare.</p>`}
  ]},
  {t:'reveal', title:'La barriera-buca $U_0/\\cosh^2(\\alpha x)$: trasparente a energie precise', tag:'esame', steps:[
   {label:'Il risultato, e perché conta', body:R`
   <p>Il secondo problema di Landau, con potenziale $U(x)=U_0/\cosh^2(\alpha x)$ — una collinetta (o una conca, se $U_0<0$) liscia, senza spigoli — dà un coefficiente di trasmissione che diventa esattamente $1$ quando</p>
   $$\cos\!\Big[\frac{\pi(2n+1)}{2}\Big]=0$$
   <p>compare come fattore nullo nella formula generale, condizione che si traduce in un vincolo sulla <i>profondità</i> del potenziale (non sull&rsquo;energia, come nelle risonanze delle tappe 08 e 10):</p>
   $$|U_{0}|=\frac{\hbar^{2}\alpha^{2}}{2m}\,n(n+1).$$
   <p>Per queste profondità particolari — e solo per queste — <b>ogni</b> particella, a <b>qualunque</b> energia positiva, passa sopra la buca senza riflettersi affatto.</p>`},
   {label:'Perché questo caso conta più del rettangolo', body:R`
   <p>È un fenomeno che la buca rettangolare della tappa 10 non ha: lì la trasparenza totale esiste solo a energie isolate, qui esiste <i>per tutte le energie contemporaneamente</i>, pagata scegliendo la profondità giusta del potenziale. È la prova più diretta che la trasparenza non è un artefatto della forma rettangolare: esiste, in forma anche più forte, per un potenziale completamente liscio, e distingue nettamente il caso quantistico (dove certe forme di potenziale sono invisibili a certe energie, o a tutte) dal caso classico (dove un ostacolo attrattivo rallenta sempre e basta, mai in modo che la velocità asintotica torni identica).</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Il gradino morbido e il gradino netto condividono lo stesso valore di R per α→∞. Significa che il gradino morbido, per α molto grande ma finito, è «quasi uguale» al gradino netto a tutte le energie?`,
    a:R`No, ed è il punto sottile: il limite $\alpha\to\infty$ è preso a <i>$k_1,k_2$ fissati</i>, cioè a energia fissata e larghezza della transizione che tende a zero rispetto a quella scala. Per energie sufficientemente alte da avere lunghezza d&rsquo;onda confrontabile con $1/\alpha$ — che è sempre possibile per $E$ grande a $\alpha$ fissato, come mostra l&rsquo;altro limite della stessa tappa — il comportamento liscio ($R\to0$ esponenzialmente) e quello netto ($R$ a potenza, mai nullo) sono radicalmente diversi. «Gradino quasi netto» è una descrizione che vale solo finché l&rsquo;energia non è troppo alta per la scala $\alpha$ scelta: i due limiti della stessa formula non sono intercambiabili.`}
  ]}
]},

/* ---------------- 12 · IL PACCHETTO D'ONDE ---------------- */
{ num:'12', title:'Il pacchetto d&rsquo;onde, e perché si lavora con autostati impropri', meta:'un onda piana non e uno stato fisico · perche il calcolo stazionario risponde comunque a una domanda dipendente dal tempo · il limite di Dirac',
  blocchi:[
  {t:'prosa', title:'Il disagio che Picasso dichiara', tag:'avvertenza', html:R`
  <p>Tutto il movimento ha lavorato con stati della forma $e^{ikx}+Be^{-ikx}$, che non sono normalizzabili e quindi non sono stati fisici: Picasso lo dichiara senza girarci attorno, <i>«è vero che $\psi_E(x)$ è una autofunzione impropria della hamiltoniana, e quindi non rappresenta uno stato fisico»</i>. E tuttavia l&rsquo;intero movimento ha trattato $R$ e $T$ come probabilità fisiche di un evento — riflessione o trasmissione di una particella vera. La domanda che questa tappa chiude è: con quale diritto?</p>`},
  {t:'prosa', title:'La risposta: pacchetti, non onde singole', tag:'costruzione', html:R`
  <p>Picasso stesso indica la via: <i>«sappiamo che esistono stati fisici le cui funzioni d&rsquo;onda approssimano $\psi_E(x)$»</i> — un pacchetto costruito come combinazione lineare (un integrale, non una somma discreta) di autostati impropri con energie concentrate in un intervallo stretto attorno a $E$, localizzato a sinistra all&rsquo;istante iniziale. Shankar rende preciso il meccanismo: se il pacchetto è «sharply localized in momentum space», allora $R$ e $T$ calcolati sugli autostati stazionari dipendono solo dall&rsquo;impulso medio del pacchetto, non dalla sua forma dettagliata — ed è questo, non una licenza poetica, che giustifica l&rsquo;uso delle onde piane. Griffiths lo chiama «il miracolo matematico»: combinazioni lineari di stati spalmati su tutto lo spazio, con dipendenza temporale quasi triviale ciascuno, producono un oggetto concentrato in un punto mobile con un comportamento nel tempo tutt&rsquo;altro che triviale.</p>`},
  {t:'reveal', title:'La lettura di Dirac: quando il pacchetto è legittimo', tag:'esame', steps:[
   {label:'La condizione di validità, dalla tappa 02', body:R`
   <p>Dirac, costruendo lo stesso pacchetto dalla sua lettura a fluido della tappa 02, trova la condizione precisa sotto cui l&rsquo;approssimazione $\Psi=Ae^{iS/\hbar}$ — con $A$ e $S$ che evolvono secondo le leggi classiche, equazione di Hamilton-Jacobi per $S$ ed equazione di continuità per $A^2$ — è legittima: bisogna poter trascurare i termini in $\hbar$ che generano la correzione quantistica, il che richiede</p>
   $$\frac{1}{A}\frac{dA}{dq}\ll\frac{1}{\hbar}\frac{dS}{dq}:$$
   <p>l&rsquo;ampiezza deve variare apprezzabilmente solo su distanze che comprendono molte lunghezze d&rsquo;onda. È la condizione sotto cui un pacchetto si comporta, nel moto del suo centro, come una particella classica — e sotto cui, equivalentemente, è legittimo parlare di «la particella che arriva da sinistra con energia $E$» come se fosse un&rsquo;onda piana sola.</p>`},
   {label:'Che cosa succede se la condizione non vale', body:R`
   <p>Dirac stesso segnala il limite: risolvendo più esattamente, <i>«la precisione con cui le coordinate e gli impulsi possono avere simultaneamente dei valori numerici non può rimanere, durante tutto il moto, quella massima [...] diminuirà con l&rsquo;evolversi del moto, poiché il pacchetto d&rsquo;onde è soggetto a uno "spargimento"»</i> — la dispersione del pacchetto nel tempo, un fenomeno che non ha nulla a che vedere con lo scattering in sé, ma che pone un limite a quanto a lungo l&rsquo;approssimazione «particella con impulso definito» resta buona. Per i tempi dell&rsquo;interazione con una barriera atomica o nucleare, lo spargimento è trascurabile; non lo è necessariamente per tempi macroscopici.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Se gli autostati impropri non sono stati fisici, perché il movimento non ha mai costruito esplicitamente un pacchetto — un integrale su k — per nessuno dei sei casi risolti?`,
    a:R`Perché, come questa tappa ha stabilito, $R(E)$ e $T(E)$ calcolati sugli autostati stazionari <b>sono già</b> ciò che un pacchetto stretto in energia misurerebbe — non c&rsquo;è nessun calcolo aggiuntivo da fare, l&rsquo;integrale sul pacchetto si ridurrebbe, nel limite di un pacchetto sufficientemente stretto, esattamente ai valori già trovati. Costruire il pacchetto esplicitamente servirebbe solo per calcolare fenomeni che $R(E)$ e $T(E)$ da soli non catturano — il tempo di attraversamento della barriera, per esempio, o la deformazione della forma del pacchetto trasmesso — che sono al di là del perimetro di questo movimento e richiedono, come Griffiths osserva, di «turn the problem over to a computer».`}
  ]}
]},

/* ---------------- 13 · BILANCIO ---------------- */
{ num:'13', title:'Bilancio: il teorema che tiene tutto insieme, e il perimetro', meta:'una catena di sei calcoli, un solo teorema dietro · cosa ciascuna fonte ha dato e nessun altra · dove tutto questo riappare',
  blocchi:[
  {t:'prosa', title:'La catena logica, in ordine', tag:'architettura', html:R`
  <p><b>1.</b> Il tipo di spettro (tappa 01) dipende solo dal comportamento asintotico del potenziale: qui, continuo e doppiamente degenere, perché l&rsquo;energia supera i due limiti asintotici.</p>
  <p><b>2.</b> La conservazione della probabilità non è solo globale: è <b>locale</b>, l&rsquo;equazione di continuità (tappa 02), dedotta dall&rsquo;equazione di Schrödinger moltiplicata per $\psi^*$ e sottratta dalla sua coniugata.</p>
  <p><b>3.</b> $R$ e $T$ si definiscono come rapporti di <b>corrente</b>, non di ampiezza (tappa 03), e dalla sola equazione di continuità segue $R+T=1$ per <i>qualunque</i> forma di $V(x)$, oltre alla simmetria sinistra-destra.</p>
  <p><b>4.</b> Il gradino (tappa 04) mostra che la riflessione quantistica sopravvive a qualunque energia sopra la soglia, e che il suo paradosso apparente nel limite classico è un limite mal posto, non una contraddizione.</p>
  <p><b>5.</b> Il <b>teorema del tunnel</b> (tappa 05) — il coefficiente trasmesso non è mai nullo per nessuna barriera finita, qualunque sia la sua forma — precede e organizza il calcolo esplicito della barriera rettangolare, che lo <i>misura</i> senza <i>dimostrarlo</i>.</p>
  <p><b>6.</b> Dentro la barriera (tappa 06), $\psi$ non decade come un esponenziale puro: è la somma di due esponenziali, vincolata dalla continuità ad avere pendenza nulla del modulo alla faccia d&rsquo;uscita.</p>
  <p><b>7.</b> Nel limite di barriera opaca (tappa 07), $T$ diventa esponenziale nello spessore — il regime che rende il tunnel misurabile, dal microscopio a effetto tunnel al decadimento alfa.</p>
  <p><b>8.</b> La stessa barriera, continuata analiticamente sopra $V_0$ (tappa 08), produce risonanze di trasmissione totale — la stessa condizione di cavità che tornerà per la buca.</p>
  <p><b>9-10.</b> Delta e buca finita (tappe 09-10) applicano lo stesso schema a due potenziali agli estremi opposti — uno singolare, uno attrattivo — e il polo del coefficiente di trasmissione della delta <i>è</i> lo stato legato: la diffusione e lo stato legato non sono due teorie separate, sono la stessa funzione di $k$ complesso, letta su due regioni diverse del piano.</p>
  <p><b>11.</b> I problemi di Landau (tappa 11) mostrano che nulla di essenziale dipende dalla forma rettangolare: lo stesso teorema del tunnel, lo stesso tipo di risonanza, valgono per potenziali lisci — e il gradino morbido scioglie il paradosso lasciato aperto alla tappa 04.</p>
  <p><b>12.</b> Tutto il calcolo è stato fatto su autostati impropri (tappa 12), legittimo perché $R(E)$ e $T(E)$ sono ciò che un pacchetto stretto in energia misurerebbe — non un&rsquo;approssimazione a parte, ma il contenuto fisico vero del calcolo stazionario.</p>`},
  {t:'prosa', title:'Che cosa ciascuna fonte ha dato, e nessun&rsquo;altra', tag:'architettura', html:R`
  <p>Da <b>Picasso</b> viene il teorema del tunnel enunciato prima dell&rsquo;esempio, la derivazione generale di $R+T=1$ dalla continuità in tre dimensioni, e la dimostrazione della simmetria sinistra-destra con $\psi^*$. Da <b>Griffiths</b> vengono la delta come diffusore con il confronto esplicito barriera/buca, e la buca finita con l&rsquo;effetto Ramsauer-Townsend: nessuno dei due è in Picasso, che non tratta questi due casi. Da <b>Ballentine</b> viene il formalismo a matrice di trasferimento, il teorema della pendenza nulla dentro la barriera, e l&rsquo;applicazione storica allo STM — nessuno dei tre è negli altri testi, ed è anche l&rsquo;unica fonte in cui si è trovato un numero da correggere, dichiarato e verificato piuttosto che copiato. Da <b>Landau</b> vengono i due problemi con potenziali lisci e la dimostrazione della reciprocità via matrice $\alpha,\beta$: senza Landau, l&rsquo;intero movimento resterebbe ancorato a potenziali costanti a tratti, e il paradosso della tappa 04 resterebbe aperto. Da <b>Dirac</b> viene la lettura a fluido dell&rsquo;equazione di continuità e la condizione precisa di validità del limite a pacchetto: nessun altro testo del movimento dà la condizione quantitativa, solo l&rsquo;argomento qualitativo. Da <b>Shankar</b>, una pagina sola, viene la giustificazione operativa del perché $R,T$ stazionari si applicano a pacchetti fisici, e l&rsquo;esempio del decadimento alfa che chiude la tappa 07.</p>`},
  {t:'prosa', title:'Dove tutto questo riappare, in fisica', tag:'architettura', html:R`
  <p><b>Nella fisica dei semiconduttori.</b> Il tunnel attraverso una barriera sottile è il meccanismo di funzionamento del diodo tunnel e della memoria flash, dove un elettrone attraversa uno strato isolante di pochi nanometri esattamente con la fisica della tappa 07.</p>
  <p><b>Nella fisica nucleare.</b> Il decadimento alfa (tappa 07) e la fusione nucleare nelle stelle — dove due nuclei devono attraversare la barriera coulombiana repulsiva per fondersi, a energie termiche ben sotto la barriera — sono entrambi applicazioni dirette del teorema del tunnel della tappa 05, con barriere coulombiane invece che rettangolari.</p>
  <p><b>Nella teoria della diffusione in generale.</b> Il legame fra poli di $T(k)$ e stati legati (tappa 09) è il punto di partenza della teoria della matrice $S$, che generalizza a tre dimensioni e a potenziali qualunque il programma seguito qui su sei casi esplicitamente risolubili.</p>
  <p><b>Nella spettroscopia.</b> Le risonanze di trasmissione (tappe 08, 10) sono il meccanismo dietro le risonanze di Ramsauer-Townsend osservate nella diffusione di elettroni su gas nobili, e la loro cugina nella diffusione nucleare — un fascio che attraversa un nucleo pesante senza essere diffuso, a energie particolari.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Si indichi, in una frase ciascuna, perché il teorema del tunnel (tappa 05) non si potrebbe dimostrare restando dentro lo schema degli stati legati.`,
    a:R`Lo schema degli stati legati classificava lo spettro a partire dalla normalizzabilità delle soluzioni all&rsquo;infinito — un concetto che presuppone una soluzione che decade, cioè uno stato legato. Il teorema del tunnel riguarda invece una soluzione che oscilla da entrambi i lati e deve solo <i>non annullarsi identicamente su un intervallo finito</i>: è un argomento di unicità delle equazioni differenziali, non di comportamento asintotico, e per questo vale indipendentemente dal tipo di spettro — ma il tipo di problema in cui diventa interessante (una regione centrale dove la soluzione è esponenziale, fra due regioni dove oscilla) è specifico della diffusione, non degli stati legati.`},
   {q:R`Un esame chiede: «si enunci e si dimostri il teorema del tunnel». Qual è la dimostrazione minima?`,
    a:R`<b>Enunciato:</b> per qualunque potenziale $V(x)$ limitato su un intervallo finito $(0,a)$ e nullo altrove, con energia $E$ qualunque, il coefficiente di trasmissione $T$ è strettamente positivo. <b>Dimostrazione minima:</b> si suppone per assurdo $C=0$ nella forma asintotica $\psi\to Ce^{ikx}$ per $x>a$; questo implicherebbe $\psi(a)=\psi'(a)=0$ per continuità dalle condizioni di raccordo (l&rsquo;onda a destra sarebbe identicamente nulla); ma l&rsquo;equazione di Schrödinger è un&rsquo;equazione differenziale lineare del secondo ordine, e per il teorema di unicità la soluzione con $\psi(a)=\psi'(a)=0$ è identicamente nulla su tutto l&rsquo;asse — in particolare per $x<0$, dove però $\psi$ deve contenere l&rsquo;onda incidente di ampiezza data e diversa da zero: contraddizione. Dunque $C\ne0$, e $T=|C|^2$ (a meno del fattore di corrente) è strettamente positivo.`}
  ]}
]}

/* ---- renderer dei blocchi ---- */
function sectionProsa(title, tag, html){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var body=elFromHTML('<div class="open-body">'+html+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function sectionGram(title, rows){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag gramtag">grammatica</span></h3>';
  var inner='<table class="gramtab">';
  rows.forEach(function(r){ inner+='<tr><td class="gs">'+r[0]+'</td><td>'+r[1]+'</td></tr>'; });
  inner+='</table>';
  var body=elFromHTML('<div class="gramwrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
/* --- blocco PLOT: la figura non decora, si legge. Ogni plot porta una chiave di lettura. --- */
function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';
  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionSvelabile(title, tag, html, sol){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var c=document.createElement('div'); c.className='collaudo-item';
  var q=document.createElement('div'); q.className='cq'; q.innerHTML=html||'';
  c.appendChild(q); typeset(q);
  if(sol){
    var a=document.createElement('div'); a.className='ca'; a.style.display='none';
    a.innerHTML='<b>Soluzione.</b> '+sol;
    var btn=document.createElement('button'); btn.className='reveal-btn small';
    btn.textContent='Rivela la soluzione';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a);
      btn.disabled=true; btn.classList.add('done'); btn.textContent='Soluzione rivelata'; };
    c.appendChild(btn); c.appendChild(a);
  }
  wrap.appendChild(c); return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    /* DUE SCHEMI, NON UNO — scoperto il 2026-10-06 provando le pagine vive. I movimenti
       scritti per primi (em-01..03, me-10b, i collaudi di gd-01..09 e di quattro em)
       usano una forma piu' semplice: `reveal` e `prolessi` con un solo `html`,
       `esercizio` e `collaudo` con `html` + `sol`. Il renderer ne conosceva una sola e
       chiamava `steps.forEach` su `undefined`: TypeError, e la tappa si fermava li' —
       62 blocchi in 17 movimenti su 74. Non si riscrive il contenuto per far contento
       il renderer: e' il renderer che deve leggere cio' che c'e'.
       E in fondo un ramo che NON muore: uno schema nuovo di domani deve far vedere un
       avviso in quella sezione, non spegnere la pagina sotto di se'. */
    try{
      if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
      else if(b.t==='prolessi') m.appendChild(b.rotte ? sectionProlessi(b)
                                   : sectionProsa(b.title,'prolessi',b.html));
      else if(b.t==='reveal')m.appendChild(b.steps ? sectionReveal(b.title,b.tag,b.steps)
                                   : sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='esercizio') m.appendChild(b.steps ? sectionEsercizio(b)
                                   : sectionSvelabile(b.title,'esercizio',b.html,b.sol));
      else if(b.t==='collaudo')  m.appendChild(b.items ? sectionCollaudo(b.title,b.items)
                                   : sectionSvelabile(b.title,'provi, poi riveli',b.html,b.sol));
      else if(b.t==='plot')      m.appendChild(sectionPlot(b));
      else m.appendChild(sectionProsa(b.title||'(blocco)', 'tipo sconosciuto: '+b.t,
                                      b.html||''));
    }catch(err){
      var avv=document.createElement('section'); avv.className='section';
      avv.innerHTML='<h3>'+(b.title||'(blocco)')+'<span class="tag">non reso</span></h3>'
        +'<p style="color:#ff6b6b">Questo blocco non si &egrave; potuto rendere ('
        +b.t+': '+err.message+'). Il resto della tappa continua sotto.</p>';
      m.appendChild(avv);
    }
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* I POP-UP DEGLI STRUMENTI. `cablaStrumenti` esisteva dal 18-09 e non la chiamava
     nessuno: i 229 rimandi del percorso erano <span> senza handler, e il clic non
     faceva niente. Nessun controllo poteva vederlo — la sintassi era valida, le schede
     c'erano tutte, le formule rendevano: il guasto esisteva solo a pagina viva. Qui, e
     dopo ogni inserimento successivo, perche' la tappa si rimonta da capo a ogni
     cambio e gli handler vanno riattaccati al DOM nuovo. */
  cablaStrumenti(m);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}

/* deep-link: mq-13-scattering-1d.html#03 apre direttamente la tappa 03 */
window.addEventListener('DOMContentLoaded', function(){
  var h=(location.hash||'').replace('#','');
  showTappa(byId[h]?h:'00');
});
window.addEventListener('hashchange', function(){
  var h=(location.hash||'').replace('#','');
  if(byId[h]) showTappa(h);
});
</script>
