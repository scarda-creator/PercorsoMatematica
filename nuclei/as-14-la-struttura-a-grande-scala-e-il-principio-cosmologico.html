<style>
  :root{
    --bg:#0e1117; --panel:#161b22; --panel2:#1c232d; --border:#2b333d;

    --ok:#2ea043; --okbg:#10331b; --warn:#d8a13a; --warnbg:#332a10;

    --pro:#b98cff; --probg:#1a1430; --proline:#2a2247; --proedge:#3a2d5c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;

  .banner{background:var(--panel2);border-bottom:1px solid var(--border);color:var(--muted);

  .sidebar{width:280px;flex:0 0 280px;padding:20px 12px 60px;position:sticky;top:0;
    max-height:100vh;overflow-y:auto;border-right:1px solid var(--border);}

  .navitem:hover{background:var(--panel2);}
  .navitem.active{background:#13233f;border-color:var(--accent);color:#fff;}
  .navitem .dot{width:7px;height:7px;border-radius:50%;background:transparent;flex:0 0 7px;
    border:1px solid var(--border);}
  .navitem.seen .dot{background:var(--ok);border-color:var(--ok);}
  .navitem .nx{color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto;}

  /* ---- MAIN ---- */
  .main{flex:1 1 auto;min-width:0;padding:24px 30px 90px;max-width:860px;}
  h1{font-size:1.5rem;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:.92rem;margin:0 0 18px;}
  .sfhead{border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:8px;}
  .sfhead h1{font-size:1.55rem;}
  .meta{color:var(--muted);font-size:.82rem;margin-top:6px;}

  .section{margin:26px 0;}
  .section > h3{font-size:1.02rem;color:var(--accent2);margin:0 0 10px;
    display:flex;align-items:center;gap:10px;}
  .section > h3 .tag{font-size:.66rem;font-weight:700;letter-spacing:.4px;background:var(--panel2);
    border:1px solid var(--border);color:var(--muted);padding:2px 8px;border-radius:20px;
    text-transform:uppercase;}

  .section > h3 .tag.plottag{background:#101f2e;border-color:#1f3c57;color:#7ab8e0;}
  .plot-intro{color:var(--muted);font-size:.95rem;margin:0 0 12px;}
  .plot-row{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;
    background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;}
  .plot-row.due .plot-box{flex:1 1 300px;min-width:280px;}
  .plot-box{max-width:560px;}
  .plot-leggi{margin-top:10px;background:var(--panel2);border:1px solid var(--border);

    font-size:.93rem;color:var(--muted);}
  .plot-leggi b{color:#7ab8e0;}
  .plot-err{color:#ff6b6b;font-size:.85rem;}
  .open-body{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}

  .note{background:var(--panel2);border-left:3px solid var(--muted);border-radius:6px;

  .note.warn{background:var(--warnbg);border-left-color:var(--warn);color:#e0b85a;}
  .note.warn b{color:#f0c25a;}

  /* ---- GRAMMATICA ---- */
  .gramwrap{background:var(--grambg);border:1px solid #1f4d47;border-radius:12px;padding:6px 6px;}
  table.gramtab{border-collapse:collapse;width:100%;font-size:.92rem;}
  table.gramtab td{padding:9px 12px;vertical-align:top;border-bottom:1px solid #17332e;}
  table.gramtab tr:last-child td{border-bottom:none;}
  table.gramtab td.gs{white-space:nowrap;color:var(--gram);width:1%;
    border-right:1px solid #17332e;font-variant-numeric:tabular-nums;}
  .section > h3 .tag.gramtag{background:var(--grambg);border-color:#1f4d47;color:var(--gram);}

  /* ---- STRUMENTI (repertorio condiviso: la scheda si apre DENTRO la frase) ----
     Nessun accento nuovo: riusa il verde della grammatica, perche' uno strumento
     richiamato e' grammatica gia' spiegata altrove, non una quinta specie di blocco. */
  .str{color:var(--gram);border-bottom:1px dashed var(--gram);cursor:pointer;}
  .str:hover{background:var(--grambg);}
  .str::after{content:"\2666";font-size:.62em;vertical-align:.42em;margin-left:2px;opacity:.8;}
  .str.aperto::after{content:"\2715";}
  .str.rotto{color:#ff6b6b;border-bottom-color:#ff6b6b;cursor:help;}
  /* la scheda e' uno SPAN in display:block, non un div: i rimandi cadono dentro
     <p>, <li> e celle di tabella, dove un div e' HTML illegale. */
  .strcard{display:block;margin:10px 0;background:var(--grambg);border:1px solid #1f4d47;
    border-left:3px solid var(--gram);border-radius:0 10px 10px 0;padding:10px 14px;font-size:.9rem;}
  .strcard .sh{display:block;font-size:.66rem;font-weight:700;letter-spacing:.5px;

  .strcard .sk{color:var(--gram);font-weight:600;}

  table.protab td{padding:10px 12px;vertical-align:top;border-bottom:1px solid var(--proline);}
  table.protab tr:last-child td{border-bottom:none;}
  table.protab td.pd{white-space:nowrap;color:var(--pro);width:1%;font-weight:700;font-size:.78rem;

  .section > h3 .tag.protag{background:var(--probg);border-color:var(--proedge);color:var(--pro);}

  /* ---- REVEAL ---- */
  .rsteps{display:flex;flex-direction:column;gap:12px;}

  .rlabel{font-size:.7rem;font-weight:700;letter-spacing:.4px;color:var(--accent);

  .rstep p:first-of-type{margin-top:0;} .rstep p:last-child{margin-bottom:0;}
  .rstep ul{margin:.4em 0;padding-left:1.2em;}
  .testo{background:#13233f;border:1px solid #2b4877;border-radius:12px;padding:14px 18px;margin-bottom:14px;}
  .testo .src{display:block;font-size:.74rem;font-style:italic;color:var(--accent2);margin-bottom:8px;

  .esame-nota{font-size:.9rem;color:var(--muted);font-style:italic;margin-top:12px;padding-left:12px;

  .collaudo-item{background:var(--panel);border:1px solid var(--border);border-radius:12px;

  .cq{margin-bottom:10px;}
  .ca{margin-top:12px;background:var(--okbg);border:1px solid #235c33;border-radius:8px;
    padding:10px 14px;font-size:.94rem;}
  .ca b{color:#5fd980;}

  /* ---- PREV / NEXT ---- */
  .prevnext{display:flex;justify-content:space-between;gap:12px;margin-top:40px;
    border-top:1px solid var(--border);padding-top:20px;}
  .pnbtn{flex:1 1 0;background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:12px 16px;cursor:pointer;color:var(--txt);text-align:left;transition:.14s;font:inherit;}
  .pnbtn:hover{border-color:var(--accent);background:var(--panel2);}
  .pnbtn.next{text-align:right;}
  .pnbtn .k{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .pnbtn .t{font-weight:600;color:var(--accent2);}
  .pnbtn:disabled{opacity:.35;cursor:default;border-color:var(--border);background:var(--panel);}

  code{background:var(--panel2);border:1px solid var(--border);border-radius:5px;
    padding:1px 5px;font-size:.85em;color:var(--accent2);}
  .katex{font-size:1.02em;color:var(--txt);} .katex-display{margin:.5em 0;overflow-x:auto;overflow-y:hidden;}

  @media(max-width:860px){
    .shell{flex-direction:column;}
    .sidebar{width:100%;flex:none;position:static;max-height:none;border-right:none;
      border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:4px;}
    .sidebar h2{width:100%;} .navitem{width:auto;}
    .main{padding:20px 16px 80px;}
  }
</style>

const R = String.raw;

function typeset(el){

/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un
   rimando scritto nella prosa:

       <span class="str" data-str="serie-geometrica">la serie geometrica</span>

   Le schede citate da questo nucleo sono cucite qui sotto dal montaggio
   (assembla-nucleo.js): la pagina resta autosufficiente — niente fetch,
   niente sottocartelle da pubblicare — e un rimando a una scheda che non
   esiste FERMA la costruzione invece di arrivare in pagina rotto.
   Apertura: lo stesso gesto del collaudo (si clicca, il pannello compare,
   si typeset una volta sola), portato dentro la frase.
   =================================================================== */
var CORSO = 'astrofisica';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["magnitudine"] = {"nome":"Magnitudine (relazione di Pogson)","riga":"La magnitudine è una scala logaritmica di flusso, $m-m_o=-2{,}5\\log(F/F_o)$: al crescere del flusso la magnitudine diminuisce, e un fattore $100$ in flusso corrisponde esattamente a $5$ magnitudini.","serve":"A confrontare flussi che differiscono di molti ordini di grandezza con numeri piccoli e maneggevoli, e a tradurre un rapporto di flusso in una differenza che si somma e si sottrae come un numero ordinario. Il coefficiente $2{,}5$ non è arbitrario: viene dal vincolo storico che le sei classi di Ipparco (una differenza di $5$ «grandezze») corrispondessero a un fattore $100$ in flusso misurato fotometricamente, da cui $100^{1/5}=2{,}512$ come fattore per una sola magnitudine. Applicata al confronto fra la magnitudine a distanza vera $D$ e quella a distanza standard di $10$ pc (la magnitudine assoluta $M$), la stessa relazione dà il modulo di distanza $M=m+5-5\\log D(\\mathrm{pc})-A$.","esempio":"Un ammasso di $N=2000$ stelle identiche ha magnitudine apparente complessiva $4{,}3$: poiché è il flusso, non la magnitudine, che si somma linearmente ($F_{\\mathrm{ammasso}}=N F_\\star$), la magnitudine di una singola stella è $m_\\star=m_{\\mathrm{ammasso}}+2{,}5\\log N=4{,}3+2{,}5\\log(2000)=12{,}55$ — non $4{,}3/2000$.","pieno":{"file":"as-03-che-cosa-si-misura-davvero.html","tappa":"05","come":"la derivazione storica del fattore 2,512 da Ipparco e Pogson, la relazione generale, e la magnitudine limite di occhio e telescopio; il modulo di distanza è derivato nella tappa 06 dello stesso movimento"},"controllo":[{"tipo":"numero","espr":"100**(1.0/5)","vale":"2.512","dove":"serve","appare":"2{,}512"},{"tipo":"numero","espr":"4.3+2.5*log(2000,10)","vale":"12.55","dove":"esempio","appare":"12{,}55"}]};
STRUM["parsec-e-parallasse"] = {"nome":"Parsec e parallasse","riga":"Il parsec è la distanza da cui il raggio dell'orbita terrestre è visto sotto un secondo d'arco: $1\\ \\mathrm{pc}=1\\,\\mathrm{UA}/1''=3{,}086\\cdot10^{16}$ m, e la distanza di una stella in parsec è l'inverso della sua parallasse in secondi d'arco.","serve":"A non portare mai un fattore di conversione a memoria. La definizione è geometrica e si ricostruisce in due righe: se $p$ è l'angolo sotto cui dalla stella si vede il semiasse maggiore dell'orbita terrestre, per angoli piccoli $p=R_{\\text{UA}}/d$, e scegliendo l'unità di distanza in modo che $p=1''$ corrisponda a $d=1$ si ottiene $d[\\mathrm{pc}]=1/p['']$. Il parsec non è un'unità più «astronomica» dell'anno luce: è l'unità in cui la misura che si fa davvero — un angolo — diventa direttamente una distanza, senza nessun conto intermedio. Nelle prove scritte di Astrofisica il valore $1\\ \\mathrm{pc}=3{,}086\\cdot10^{16}$ m è stampato in calce al foglio fra i dati: ciò che va saputo è l'inversione, non il numero.","esempio":"La stella più vicina, Proxima Centauri, ha parallasse $p=0{,}7687''$. Quindi $d=1/0{,}7687=1{,}301$ pc, e in anni luce $d=3{,}26/0{,}7687=4{,}24$ anni luce. Il controllo di coerenza è immediato: una parallasse inferiore al secondo d'arco vuol dire per forza una distanza superiore al parsec, e se il conto dà il contrario è stata invertita la frazione.","pieno":{"file":"as-01-la-scala-del-cosmo.html","tappa":"02","come":"la derivazione del parsec dalla parallasse annua e le conversioni fra unità astronomica, anno luce e parsec, nel movimento sulla scala del cosmo"},"controllo":[{"tipo":"numero","espr":"1.496e11/(pi/648000)/1e16","vale":"3.086","dove":"riga","appare":"3,086\\cdot10^{16}"},{"tipo":"numero","espr":"1/0.7687","vale":"1.301","dove":"esempio","appare":"1,301"},{"tipo":"numero","espr":"3.26/0.7687","vale":"4.24","dove":"esempio","appare":"4,24"},{"tipo":"numero","espr":"1.496e11/(pi/648000)/1e16","vale":"3.086","dove":"serve","appare":"3,086\\cdot10^{16}"}]};
STRUM["angolo-piccolo"] = {"nome":"Angolo piccolo","riga":"Per $\\theta\\ll1$ radiante valgono $\\sin\\theta\\simeq\\tan\\theta\\simeq\\theta$, e un oggetto di dimensione trasversa $l$ posto a distanza $d\\gg l$ sottende l'angolo $\\theta\\simeq l/d$.","serve":"È l'approssimazione su cui poggia tutta la geometria osservativa: l'unica grandezza che un telescopio misura direttamente è un angolo, e trasformarlo in una lunghezza richiede solo questa relazione più una distanza nota. L'errore relativo che si commette è controllato e piccolissimo: dallo sviluppo $\\sin\\theta=\\theta-\\theta^{3}/6+\\dots$ segue che $\\theta$ sovrastima $\\sin\\theta$ di una frazione $\\theta^{2}/6$, quindi per il disco solare — l'oggetto più grande del cielo insieme alla Luna, e già solo mezzo grado — si sbaglia di una parte su settantamila. Per qualunque oggetto extrasolare l'approssimazione è esatta a tutti gli effetti pratici. La regola pratica che ne segue vale più della formula: un angolo in radianti si legge subito come rapporto fra due lunghezze, e i secondi d'arco esistono solo perché il radiante è troppo grande — $1''=4{,}848\\cdot10^{-6}$ rad.","esempio":"La Luna ha diametro $l=3{,}476\\cdot10^{6}$ m e dista $d=3{,}844\\cdot10^{8}$ m, quindi sottende $\\theta=\\dfrac{3{,}476\\cdot10^{6}}{3{,}844\\cdot10^{8}}=9{,}043\\cdot10^{-3}$ rad, che in gradi sono $\\theta=9{,}043\\cdot10^{-3}\\cdot180/\\pi=0{,}518$ gradi. L'errore dell'approssimazione, $\\theta^{2}/6$, vale una parte su settantamila: invisibile rispetto a qualunque incertezza osservativa.","pieno":{"file":"as-01-la-scala-del-cosmo.html","tappa":"03","come":"l'angolo sotteso come unica grandezza direttamente misurabile, con la stima dell'errore dell'approssimazione di angolo piccolo"},"controllo":[{"tipo":"numero","espr":"pi/648000*1e6","vale":"4.848","dove":"serve","appare":"4,848"},{"tipo":"numero","espr":"3.476e6/3.844e8*1e3","vale":"9.043","dove":"esempio","appare":"9,043\\cdot10^{-3}"},{"tipo":"numero","espr":"3.476e6/3.844e8*180/pi","vale":"0.518","dove":"esempio","appare":"0,518"}]};
STRUM["ordini-di-grandezza"] = {"nome":"Ordini di grandezza","riga":"Stimare una quantità alla potenza di dieci giusta: si tiene una cifra significativa, si sommano e si sottraggono gli esponenti, e si controlla che l'unità del risultato sia quella che si voleva.","serve":"A sapere se un risultato è plausibile prima di averlo calcolato con precisione, e ad accorgersi di un errore di impostazione quando c'è ancora tempo per rimediare. In astrofisica non è una comodità ma il modo normale di ragionare, per due ragioni: le grandezze in gioco vanno da $10^{-36}$ kg a $10^{53}$ kg e nessuna intuizione le copre, e i dati osservativi sono noti al dieci o al venti per cento, quindi una cifra significativa è spesso tutto ciò che il problema contiene davvero. Il controllo che smaschera più errori non è sul numero, è sull'**unità**: un conto che dovrebbe dare una densità e dà dei kg è sbagliato nell'impostazione, e nessun affinamento dell'aritmetica lo salverà. La seconda regola è il confronto con un termine noto — l'acqua per una densità, il Sole per una massa o una luminosità, il parsec per una distanza galattica — perché un numero senza metro non dice niente.","esempio":"Densità media del Sole, dalle due sole quantità stampate in calce al foglio d'esame, $M_\\odot=1{,}989\\cdot10^{30}$ kg e $R_\\odot=6{,}957\\cdot10^{8}$ m: $\\rho=\\dfrac{3M_\\odot}{4\\pi R_\\odot^{3}}=1410\\ \\mathrm{kg/m^3}$. Il confronto è immediato e istruttivo: è quasi una volta e mezza l'acqua, cioè il Sole è in media meno denso della Terra — una stella non è un sasso grande, è un gas tenuto insieme dal proprio peso.","pieno":{"file":"as-01-la-scala-del-cosmo.html","tappa":"01","come":"la gerarchia delle strutture cosmiche letta come scala di ordini di grandezza, e il tempo di luce come secondo asse della stessa tabella"},"controllo":[{"tipo":"numero","espr":"3*1.989e30/(4*pi*(6.957e8)**3)","vale":"1410","dove":"esempio","appare":"1410"}]};

function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

{ num:'00', title:'Perché questo movimento: il cielo è piatto, l’universo no', meta:'dal 2D al 3D · una scala di distanze · il principio che autorizza la cosmologia',
  blocchi:[
  {t:'prosa', title:'Un problema di coordinate', tag:'architettura', html:R`
  <p>Il cielo ci arriva proiettato. Di ogni galassia misuriamo due angoli, ascensione retta e declinazione, e un flusso; la terza coordinata, la distanza, non si vede. La lezione 16 del 2020 imposta il problema esattamente così: <i>«in un sistema di riferimento polare la proiezione 2D dà le due coordinate angolari, mentre la distanza dà la coordinata radiale»</i>. Tutta la prima metà di questo movimento è la costruzione di quella coordinata radiale, un gradino alla volta, perché <i>«non possiamo misurare le distanze cosmiche con un righello, e quindi abbiamo bisogno di altre definizioni operative di distanza»</i>.</p>
  <p>La seconda metà usa la mappa tridimensionale per rispondere a una domanda che sembra filosofica e non lo è: l&rsquo;universo è lo stesso dappertutto? Se la risposta è sì su scale abbastanza grandi, e se è lo stesso in tutte le direzioni, allora la geometria dello spazio-tempo non è più libera. Resta una sola funzione del tempo, il fattore di scala, e una sola costante, il segno della curvatura. È la metrica di Robertson-Walker,</p>
  <p>$$ds^2=c^2dt^2-a(t)^2\left[\frac{d\chi^2}{1-k\chi^2}+\chi^2\left(d\theta^2+\sin^2\theta\,d\phi^2\right)\right],$$</p>
  <p>da cui partono le equazioni di Friedmann, la storia termica e il fondo cosmico. Il valore di questo movimento, come dice la mappa del corso, non sta nei conti, che sono pochi e corti, ma nel dire <b>perché si può assumere</b> ciò che la cosmologia assume. All&rsquo;orale la domanda è una catena di vincoli: «se l&rsquo;universo fosse anisotropo, allora&hellip;; se fosse isotropo intorno a noi ma non omogeneo, allora&hellip;».</p>
  <p>L&rsquo;ordine è quello delle lezioni 16b, 16c e 17 del 2020, con il capitolo 2-3 del Marconi dove le slide saltano un passaggio: la distribuzione proiettata e la sua statistica; la parallasse e i satelliti astrometrici; il diagramma HR come righello; le candele standard, Cefeidi, supernovae Ia e galassie; il redshift e la legge di Hubble, che arriva come sorpresa mentre si cercava altro; le survey tridimensionali e il calo delle fluttuazioni con la scala; il passaggio dall&rsquo;isotropia all&rsquo;omogeneità; e infine la catena che porta alla metrica. Gli strumenti di calcolo sono quelli delle <span class="str" data-str="magnitudine">magnitudini</span>, della <span class="str" data-str="parsec-e-parallasse">parallasse</span> e dell&rsquo;<span class="str" data-str="angolo-piccolo">approssimazione di angolo piccolo</span>, più una costante attenzione agli <span class="str" data-str="ordini-di-grandezza">ordini di grandezza</span>.</p>`}
]},

/* ---------------- 01 · LA DISTRIBUZIONE PROIETTATA ---------------- */
{ num:'01', title:'La distribuzione proiettata: Poisson, ammassi, conteggi', meta:'galassie per grado quadrato · la sovradensità degli ammassi · N(>F) ∝ F^{-3/2}',
  blocchi:[
  {t:'prosa', title:'Che cosa si vede guardando lontano', tag:'osservazione', html:R`
  <p>La lezione 16b apre con la distribuzione delle galassie sul cielo: <i>«se guardiamo più lontano, le galassie sono distribuite in modo statisticamente isotropo sulla sfera celeste»</i>. L&rsquo;immagine di riferimento è la survey APM (Automatic Plate Machine), un milione di galassie su circa un decimo del cielo, digitalizzate da lastre fotografiche: a occhio è una tessitura fine, con grumi e filamenti appena accennati, senza direzioni privilegiate.</p>
  <p>La descrizione quantitativa ha due livelli. Al primo, <i>«il numero di galassie che si contano in un grado quadrato di cielo segue una statistica di Poisson»</i>: se in media ce ne sono $\bar N$ per cella, la deviazione standard del conteggio è $\sqrt{\bar N}$ e la fluttuazione relativa è</p>
  <p>$$\frac{\sigma_N}{\bar N}=\frac{1}{\sqrt{\bar N}},$$</p>
  <p>così che con cento galassie per cella ci si aspetta una fluttuazione del $10\%$ anche se le galassie fossero disposte del tutto a caso. È il rumore di fondo contro cui va misurata qualunque struttura. Al secondo livello, <i>«sono presenti correlazioni, e quindi leggere deviazioni dalla statistica poissoniana. Nella distribuzione 2-D queste deviazioni sono minime, mentre sono molto importanti per la distribuzione 3-D»</i>. La proiezione lava le strutture, perché lungo ogni linea di vista si sommano galassie a distanze diverse che non hanno niente a che fare l&rsquo;una con l&rsquo;altra: un ammasso a 100 Mpc e un vuoto a 300 Mpc nella stessa direzione si compensano.</p>
  <p>Il numero medio per cella dipende dalla profondità: <i>«osservazioni più sensibili saranno più profonde, e conteranno anche galassie molto distanti»</i>. Questa dipendenza è già una prova di omogeneità, ed è conveniente farne il conto ora. In uno spazio euclideo riempito uniformemente di sorgenti tutte della stessa luminosità $L$, con densità $n$, quelle più brillanti di un flusso $F$ sono quelle entro la distanza $D$ tale che $F=L/4\pi D^2$, cioè</p>
  <p>$$D(F)=\left(\frac{L}{4\pi F}\right)^{1/2},\qquad N(>F)=\frac{4\pi}{3}n\,D(F)^3=\frac{4\pi n}{3}\left(\frac{L}{4\pi F}\right)^{3/2}\propto F^{-3/2}.$$</p>
  <p>La pendenza $-3/2$ non dipende da $L$, quindi vale anche per una miscela di luminosità diverse: ogni classe dà la sua legge $F^{-3/2}$ e la somma mantiene la pendenza. Passando alle magnitudini, $F\propto10^{-0.4m}$, la stessa legge diventa</p>
  <p>$$N(<m)\propto\left(10^{-2m/5}\right)^{-3/2}=10^{3m/5},$$</p>
  <p>cioè il numero di galassie cresce di un fattore $10^{0.6}\approx 4$ per ogni magnitudine in più. Una deviazione da questa pendenza a flussi deboli dice che le sorgenti non sono distribuite uniformemente oppure che lo spazio non è euclideo o che le sorgenti evolvono: è il test che negli anni Cinquanta e Sessanta servì contro l&rsquo;universo stazionario usando le radiosorgenti.</p>`},
  {t:'prosa', title:'Ammassi e vuoti', tag:'le deviazioni', html:R`
  <p>Le zone in cui la densità di galassie è più alta sono gli ammassi. La lezione dà un numero che conviene ricordare: <i>«la sovradensità può raggiungere il 100%, mai molto di più»</i>, nel senso dei conteggi in celle di qualche megaparsec. Gli ammassi si vedono meglio in raggi X che in ottico, perché tra una galassia e l&rsquo;altra c&rsquo;è gas caldo che emette per bremsstrahlung; le slide mostrano la Vergine, Coma e il cluster RXJ1347.5-1145 con le galassie ottiche sovrapposte all&rsquo;emissione X. La slide scrive $10^4$ K per la temperatura di quel gas; per emettere raggi X di qualche keV servono in realtà $10^7$-$10^8$ K, perché $kT=1$ keV corrisponde a $1{,}16\cdot10^7$ K, e lo si dichiara come refuso.</p>
  <p>Esistono anche zone sottodense, i vuoti, <i>«ma la loro presenza è stata evidenziata solo con lo studio della distribuzione 3-D»</i>. È il primo esempio di un fatto che tornerà: la proiezione nasconde l&rsquo;informazione che serve. Per vederla bisogna la terza coordinata.</p>`}
]},

/* ---------------- 02 · IL PRIMO GRADINO ---------------- */
{ num:'02', title:'Il primo gradino: la parallasse, il parsec, i satelliti astrometrici', meta:'p = R/d · 1 pc = 3,086·10¹³ km · il telescopio a griglia · Hipparcos e Gaia',
  blocchi:[
  {t:'prosa', title:'Un moto apparente con il periodo di un anno', tag:'geometria', html:R`
  <p>Il metodo geometrico è l&rsquo;unico che non presuppone niente sulla fisica delle sorgenti, e per questo regge tutta la scala. La lezione lo introduce da un&rsquo;osservazione astrometrica: misurando con grande accuratezza la posizione di alcune stelle nel tempo, ad esempio la stella di Barnard, si trova che il loro moto apparente è <i>«la sovrapposizione di un moto rettilineo e di uno oscillatorio»</i>. Quello rettilineo è il moto proprio, il moto vero della stella rispetto al Sole proiettato sul cielo. Quello oscillatorio ha il periodo di un anno, ed è la <span class="str" data-str="parsec-e-parallasse">parallasse annua</span>: le stelle vicine appaiono proiettate in posizioni diverse sullo sfondo delle stelle lontane a seconda di dove si trova la Terra nella sua orbita.</p>
  <p>Con $R=1$ UA $=1{,}496\cdot10^8$ km raggio dell&rsquo;orbita e $d$ distanza della stella, l&rsquo;angolo sotteso dal raggio dell&rsquo;orbita è, per <span class="str" data-str="angolo-piccolo">angoli piccoli</span>, semplicemente $p=R/d$. Il parsec è la distanza a cui $p=1''$, cioè $4{,}848\cdot10^{-6}$ rad:</p>
  <p>$$1\ \mathrm{pc}=\frac{1{,}496\cdot10^{8}\ \mathrm{km}}{4{,}848\cdot10^{-6}}=3{,}086\cdot10^{13}\ \mathrm{km}=3{,}26\ \text{anni luce},$$</p>
  <p>e la distanza in parsec è il reciproco della parallasse in secondi d&rsquo;arco, $d(\mathrm{pc})=1/p('')$. La slide scrive $3{,}06\cdot10^{13}$ km: la cifra corretta è $3{,}086$, lo si dichiara come refuso di battitura. La stella più vicina, Proxima Centauri, ha $p=0{,}77''$; nessuna stella ha parallasse di un secondo d&rsquo;arco, e questo dà la scala del problema: anche le stelle vicine richiedono misure al decimo di secondo d&rsquo;arco.</p>`},
  {t:'prosa', title:'Come si misura una posizione: dal cerchio meridiano al telescopio a griglia', tag:'strumento', html:R`
  <p>Per secoli lo strumento astrometrico è stato il cerchio meridiano, un telescopio con un solo grado di libertà, la declinazione, con l&rsquo;asse di rotazione orizzontale e perpendicolare al meridiano. Si registra l&rsquo;istante di transito e la declinazione: <i>«in questo modo si usa la rotazione terrestre come un sensibilissimo strumento di misura»</i> dell&rsquo;ascensione retta.</p>
  <p>Il metodo elettro-ottico che lo sostituisce è il telescopio a griglia: nel piano focale c&rsquo;è una fitta griglia di fenditure di passo $P$ e dietro un fotomoltiplicatore. L&rsquo;immagine della stella, che si muove sul piano focale con velocità $\dot x=F\dot\theta$ ($F$ lunghezza focale, $\dot\theta$ velocità angolare apparente), passa alternativamente su fenditure e su barre, e il fotomoltiplicatore produce un segnale alternato di frequenza</p>
  <p>$$f=\frac{\dot x}{P}=\frac{F\dot\theta}{P}.$$</p>
  <p>Per fissare le idee con numeri miei: una stella all&rsquo;equatore celeste si muove per la rotazione terrestre a $15''$/s, cioè $7{,}27\cdot10^{-5}$ rad/s; con $F=2$ m e $P=20\ \mu$m la frequenza è $f=2\cdot7{,}27\cdot10^{-5}/2\cdot10^{-5}=7{,}27$ Hz. Il treno di impulsi si confronta con un orologio elettronico a frequenza molto più alta, e l&rsquo;istante di passaggio su ogni fenditura si ricava con la precisione del periodo del clock, o dell&rsquo;imprecisione del passo se la griglia non è perfetta. Il passaggio al centro del telescopio si stima mediando su tutte le fenditure, e la precisione migliora come la radice del numero di fenditure attraversate: è lo stesso $1/\sqrt N$ dei conteggi di Poisson, applicato ora a misure indipendenti dello stesso istante.</p>
  <p>Hipparcos combina sullo stesso piano focale i fasci di due telescopi puntati a $58^\circ$ l&rsquo;uno dall&rsquo;altro, con un fotomoltiplicatore «imaging»: dallo sfasamento dei due segnali misura la posizione relativa di due stelle lontane in cielo, e così costruisce un sistema di riferimento rigido su tutta la sfera, senza dipendere dall&rsquo;atmosfera e dalla rifrazione. Il catalogo principale contiene $118\,218$ stelle con posizione, parallasse e moto proprio a meglio di 2 millesimi di secondo d&rsquo;arco. Il conto della lezione su che cosa voglia dire è immediato: una distanza è misurata al $10\%$ se l&rsquo;errore sulla parallasse è un decimo della parallasse stessa, quindi $p=10\sigma_p=20$ mas, cioè</p>
  <p>$$d_{10\%}=\frac{1}{10\,\sigma_p}=\frac{1}{0{,}02''}=50\ \mathrm{pc},$$</p>
  <p>circa 160 anni luce, come dice la slide. Il catalogo ausiliario Tycho-2 ne ha $2\,539\,913$ con precisione simile. Gaia, lanciato il 19 dicembre 2013, porta la misura a un miliardo di stelle e, ripetendo le osservazioni a distanza di anni, migliora molto i moti propri.</p>
  <p>Tra i risultati di Hipparcos la lezione ricorda la deflessione della luce da parte del Sole, la prova dell&rsquo;eclisse del 1919 (la slide scrive 1917) ripetuta su tutto il cielo. Il conto, che è mio, mostra perché serva quella precisione. La deflessione di un raggio che passa a una distanza angolare $\varepsilon$ dal Sole, visto da un osservatore a 1 UA, è $\alpha=(2GM_\odot/c^2\,\mathrm{UA})(1+\cos\varepsilon)/\sin\varepsilon$; al bordo solare vale $1{,}75''$, a $90^\circ$ dal Sole vale</p>
  <p>$$\alpha(90^\circ)=\frac{2GM_\odot}{c^2\cdot1\,\mathrm{UA}}=4{,}07\ \mathrm{mas},$$</p>
  <p>il doppio della precisione di Hipparcos: misurabile su tutto il cielo, e infatti va corretta in ogni posizione del catalogo.</p>`}
]},

/* ---------------- 03 · IL DIAGRAMMA HR COME RIGHELLO ---------------- */
{ num:'03', title:'Il diagramma HR come righello: il modulo di distanza e la Grande Nube', meta:'m − M = 5 log(D/10 pc) · B − V come termometro · la LMC a 50 kpc',
  blocchi:[
  {t:'prosa', title:'Il diagramma assoluto', tag:'calibrazione', html:R`
  <p>Il primo frutto della parallasse è il diagramma di Hertzsprung-Russell assoluto. Per le stelle di Hipparcos si misura il flusso e, sapendo la distanza, si ricava la luminosità. In linguaggio astronomico, la <span class="str" data-str="magnitudine">magnitudine apparente</span> è $m_V=-2{,}5\log F_V+\mathrm{cost}$, e la magnitudine assoluta $M_V$ è per definizione la magnitudine che la stella avrebbe a 10 pc. Siccome il flusso scala come l&rsquo;inverso del quadrato della distanza,</p>
  <p>$$m-M=-2{,}5\log_{10}\frac{F(D)}{F(10\,\mathrm{pc})}=-2{,}5\log_{10}\left(\frac{10\,\mathrm{pc}}{D}\right)^2=5\log_{10}\frac{D}{10\,\mathrm{pc}},$$</p>
  <p>il <i>modulo di distanza</i>, che si inverte in $D=10\,\mathrm{pc}\cdot10^{(m-M)/5}$. Sull&rsquo;altro asse sta l&rsquo;indice di colore, il rapporto tra i flussi in due bande, ad esempio blu (440 nm) e visuale (550 nm): $B-V=m_B-m_V$. È un termometro. Per un corpo nero la lezione dà $B-V=-2{,}5\log[B(\nu_B,T)/B(\nu_V,T)]\approx-1{,}21+7090/T$, empiricamente $B-V=-0{,}865+8540/T$. Per una stella a 5800 K la relazione empirica dà</p>
  <p>$$B-V=-0{,}865+\frac{8540}{5800}=0{,}607,$$</p>
  <p>vicino al valore del Sole, $0{,}65$; e invertendola con $B-V=0{,}65$ si trova $T=8540/(0{,}65+0{,}865)=5637$ K, a qualche percento dalla temperatura efficace solare. La differenza tra la formula del corpo nero e quella empirica nasce dal fatto che le stelle non sono corpi neri: le righe di assorbimento, più fitte nel blu, abbassano il flusso $B$ rispetto al corpo nero della stessa temperatura.</p>
  <p>Il diagramma HR di Hipparcos ha la sequenza principale, le giganti, le nane bianche, ognuna in una posizione assoluta. Può essere confrontato con il diagramma <i>relativo</i>, in magnitudini apparenti, di un gruppo di stelle più distanti tutte alla stessa distanza: un ammasso, o una galassia vicina. <i>«La differenza tra i due diagrammi sarà dovuta solo alla distanza»</i>: lo stesso punto della sequenza principale ha $M$ nel primo e $m$ nel secondo, e $m-M$ è il modulo di distanza dell&rsquo;intero gruppo. Si usano gruppi numerosi di stelle per mediare via le variazioni locali, di composizione chimica e di età, che spostano la relazione $L(T)$ della singola stella.</p>`},
  {t:'prosa', title:'La Grande Nube di Magellano, e una slide che si contraddice', tag:'esempio', html:R`
  <p>Uno di questi gruppi è la Grande Nube di Magellano, una piccola galassia satellite della nostra, con migliaia di stelle tutte più o meno alla stessa distanza. Dal confronto tra il diagramma HR della LMC ottenuto da HST e quello di Hipparcos la lezione ricava la distanza <i>«con una precisione di circa 10%»</i>, limitata dalla diversa composizione chimica. La slide scrive due espressioni, $D_{\rm LMC}=10\,\mathrm{pc}\cdot10^{(22-4)/5}$ e $D_{\rm LMC}=10\,\mathrm{pc}\cdot10^{(19{,}25-0{,}75)/5}$, entrambe uguali a 50 kpc. Non lo sono. La seconda dà</p>
  <p>$$10\,\mathrm{pc}\cdot10^{18{,}5/5}=50{,}1\ \mathrm{kpc},$$</p>
  <p>ma la prima, con modulo 18, dà $10\,\mathrm{pc}\cdot10^{18/5}=39{,}8$ kpc. Il modulo giusto della LMC è $18{,}5$, che corrisponde a $5\log_{10}(5\cdot10^4/10)=18{,}49$; la prima coppia di numeri, letta probabilmente da un punto del diagramma diverso, va presa come illustrazione del metodo e non come misura. Lo si dichiara: chi la usasse all&rsquo;esame sbaglierebbe la distanza del $20\%$.</p>`}
]},

/* ---------------- 04 · LE CANDELE STANDARD ---------------- */
{ num:'04', title:'Le candele standard: Cefeidi, supernovae Ia, galassie', meta:'D_L = (L/4πF)^{1/2} · periodo-luminosità · il limite di Chandrasekhar come calibratore · L ∝ v⁴',
  blocchi:[
  {t:'prosa', title:'La distanza di luminosità', tag:'definizione', html:R`
  <p>Oltre il dominio della parallasse ogni metodo ha la stessa struttura, che la slide <i>Distance Indicators</i> scrive in due righe. Se di una sorgente si conosce a priori la luminosità $L$ e si misura il flusso $F$, da $F=L/4\pi D^2$ si ricava la distanza; se se ne conosce a priori la dimensione $\ell$ e si misura l&rsquo;angolo $\theta$, da $\theta=\ell/D$ si ricava la distanza. Le due definizioni operative sono la <b>distanza di luminosità</b></p>
  <p>$$D_L=\left(\frac{L}{4\pi F}\right)^{1/2}$$</p>
  <p>e la distanza di diametro angolare $D_A=\ell/\theta$. Nello spazio euclideo e statico sono la stessa cosa; in un universo in espansione, come si vedrà, no. Le sorgenti di $L$ nota sono le <i>candele standard</i>, e <i>«vengono calibrate utilizzando una sequenza di metodi di stima di distanze sempre più grandi»</i>: parallassi, Cefeidi, Tully-Fisher, supernovae. Ogni gradino è calibrato sul precedente e ne eredita l&rsquo;errore, che per questo si chiama scala delle distanze.</p>`},
  {t:'prosa', title:'Le Cefeidi: una stella che dice la sua luminosità con il periodo', tag:'secondo gradino', html:R`
  <p>Le Cefeidi sono stelle pulsanti, che si trovano tra la sequenza principale e il ramo delle giganti rosse. La pulsazione è la contrazione ed espansione dell&rsquo;involucro esterno che si scalda e si raffredda, la valvola di Eddington: uno strato in cui l&rsquo;elio è parzialmente ionizzato diventa più opaco quando è compresso, trattiene la radiazione, si espande, diventa trasparente, si raffredda e ricade. Osservando le Cefeidi della LMC, tutte alla stessa distanza, si vede che il periodo è ben correlato con la luminosità. La calibrazione della lezione, da Udalski e collaboratori (1999), per le Cefeidi fondamentali è</p>
  <p>$$V=-2{,}765\log_{10}P[\mathrm{giorni}]+17{,}044 .$$</p>
  <p>La slide la chiama $M_V$, ma con quella costante è la magnitudine <i>apparente</i> nella LMC: lo si vede dal fatto che una Cefeide di 10 giorni avrebbe $M_V=14{,}3$, più debole del Sole di dieci magnitudini, mentre la stessa slide dice che <i>«$M_V=-4$, quindi sono circa 100 volte più luminose delle giganti rosse»</i>. Per passare all&rsquo;assoluta si sottrae il modulo della LMC, $18{,}5$: $M_V=-2{,}765\log P-1{,}456$, e per $P=10$ giorni $M_V=-4{,}2$, in accordo con il $-4$ della slide. Lo si dichiara come imprecisione di notazione.</p>
  <p>Con la relazione assoluta in mano, una Cefeide di 30 giorni ha</p>
  <p>$$M_V=-2{,}765\log_{10}30+17{,}044-18{,}5=-5{,}54,$$</p>
  <p>e in M100, dove sono visibili una trentina di Cefeidi, a 16,1 Mpc (modulo $5\log_{10}(1{,}61\cdot10^7/10)=31{,}03$) apparirebbe di magnitudine $25{,}5$, alla portata di HST. La slide dice che sono visibili fino a 50 Mpc: lì il modulo è $5\log_{10}(5\cdot10^7/10)=33{,}49$, e una Cefeide da $M_V=-4$ avrebbe $m\approx29{,}5$; servono le Cefeidi più lunghe, fino a $M_V\approx-6$, per restare intorno a $27{,}5$. È il limite reale del secondo gradino.</p>`},
  {t:'plot', title:'La relazione periodo-luminosità delle Cefeidi',
   intro:R`Magnitudine V contro log P (giorni). In ciano la calibrazione della lezione nella LMC (Udalski 1999), magnitudine apparente; in oro la stessa relazione trasportata in assoluta con il modulo 18,5. I punti marcano le Cefeidi di 10 e 30 giorni. L'asse verticale cresce verso il basso nel senso astronomico solo nella lettura: qui numeri più grandi sono stelle più deboli.`,
   plots:[
    {kind:'func2d', xr:[0.3,1.8], yr:[-8,18], height:300, equal:false,
     title:'log P (giorni)      V',
     curves:[{f:'-2.765*x+17.044', col:'#5eead4', label:'V apparente nella LMC'},
             {f:'-2.765*x+17.044-18.5', col:'#d8a13a', label:'M_V assoluta'}],
     marks:[{x:1, y:-4.22, label:'10 d: M = -4,2', col:'#d8a13a', up:true},
            {x:1.477, y:-5.54, label:'30 d: M = -5,5', col:'#d8a13a', up:false},
            {x:1, y:14.28, label:'10 d nella LMC: V = 14,3', col:'#5eead4', up:true}]}
   ],
   leggi:R`<p><b>Che cosa guardare:</b> le due rette sono parallele, separate dal modulo di distanza 18,5: la pendenza, cioè quanto la luminosità cresce con il periodo, si misura in un posto qualunque dove le Cefeidi stanno alla stessa distanza; lo zero, cioè la luminosità assoluta, richiede una distanza indipendente, dalla parallasse o dal diagramma HR.</p>
   <p><b>Che cosa impararne:</b> un errore del 10% sulla distanza della LMC sposta lo zero di 0,2 magnitudini e si propaga, identico, a tutte le distanze ricavate con le Cefeidi, e da lì alla costante di Hubble. È per questo che la LMC è il punto più discusso della scala.</p>`},
  {t:'prosa', title:'Le supernovae Ia: il limite di Chandrasekhar come calibratore', tag:'terzo gradino', html:R`
  <p>Per andare oltre servono sorgenti molto più luminose. Le supernovae sono esplosioni di stelle <i>«che avvengono quando la gravità non può più essere contrastata dalla pressione»</i>. La lezione 16c ricorda il destino in funzione della massa iniziale: sotto $0{,}4\,M_\odot$ la stella non fonde l&rsquo;elio e finisce come nana bianca di elio; tra $0{,}4$ e $4\,M_\odot$ non arriva al ferro e finisce come nana bianca di carbonio e ossigeno; sopra, costruisce un nucleo di ferro che, superato $1{,}4\,M_\odot$, collassa in meno di un secondo fino a densità nucleari, rimbalza e manda un&rsquo;onda d&rsquo;urto che espelle gli strati esterni. La luminosità è di $1$-$4\cdot10^9\,L_\odot$, per settimane: una sola stella brilla come una galassia.</p>
  <p>Le supernovae di tipo I non hanno righe dell&rsquo;idrogeno, e quelle di tipo Ia sono esplosioni termonucleari di nane bianche in sistemi doppi: la compagna gigante rossa cede materia, la massa si avvicina al limite di Chandrasekhar, la pressione degli elettroni degeneri non regge più, il nucleo si scalda fino alla combustione esplosiva di carbonio e ossigeno in $^{56}$Ni. La ragione per cui sono candele standard sta tutta in una frase della slide: <i>«siccome la composizione e la massa iniziale sono le stesse per tutte le nane bianche vicino alla massa di Chandrasekhar, la luminosità assoluta è circa la stessa per tutte»</i>. La curva di luce è alimentata dalla catena radioattiva $^{56}\mathrm{Ni}\to{}^{56}\mathrm{Co}\to{}^{56}\mathrm{Fe}$; la slide dà 5,6 e 79 giorni, che vanno letti come scale di tempo dei due decadimenti (i tempi di dimezzamento tabulati sono 6,1 e 77 giorni, valori standard e non delle fonti). Si applicano correzioni empiriche, la più nota delle quali lega la luminosità al massimo alla rapidità del declino: le più luminose calano più lentamente.</p>
  <p>Al massimo $M_V\approx-19$. In luminosità solari, con $M_{V,\odot}=4{,}83$,</p>
  <p>$$\frac{L}{L_\odot}=10^{0{,}4(4{,}83+19)}=3{,}4\cdot10^{9},$$</p>
  <p>dentro l&rsquo;intervallo della lezione. Le sette SN Ia della slide di Suntzeff (1999) sono quelle esplose in galassie con Cefeidi: è il punto in cui il terzo gradino si aggancia al secondo.</p>`},
  {t:'prosa', title:'Le galassie come candele: Tully-Fisher', tag:'il gradino intermedio', html:R`
  <p>La lezione indica una terza famiglia: <i>«le galassie hanno una caratteristica che permette di misurarne la luminosità assoluta: la dispersione di velocità»</i>, misurata con l&rsquo;allargamento Doppler delle righe, $\Delta\lambda/\lambda=v/c$. Più massa c&rsquo;è, più velocemente orbitano le stelle; e più massa, più stelle, più luce. Le slide non scrivono la legge; l&rsquo;argomento che segue è quello standard e lo dichiaro come mio. Per una spirale con velocità di rotazione $v$ e raggio $R$, $v^2=GM/R$; se il rapporto massa-luminosità $\Upsilon=M/L$ e la brillanza superficiale $\Sigma=L/R^2$ sono gli stessi per tutte le spirali, eliminando $R$ e $M$:</p>
  <p>$$v^4=\frac{G^2M^2}{R^2}=G^2\Upsilon^2L^2\frac{\Sigma}{L}\quad\Longrightarrow\quad L=\frac{v^4}{G^2\Upsilon^2\Sigma}\propto v^4 .$$</p>
  <p>È la relazione di Tully-Fisher; per le ellittiche, con la dispersione $\sigma$ al posto di $v$, è quella di Faber-Jackson. Un fattore 2 nella velocità è un fattore 16 nella luminosità, cioè 3 magnitudini: il metodo è sensibile, e la dispersione osservata intorno alla relazione, qualche decimo di magnitudine, dà distanze al $10$-$20\%$ per galassie singole fino a un centinaio di Mpc.</p>`}
]},

/* ---------------- 05 · REDSHIFT E LEGGE DI HUBBLE ---------------- */
{ num:'05', title:'La terza coordinata dal redshift, e una legge che non si cercava', meta:'z = Δλ/λ · cz = H₀D · due esercizi con i numeri · 1/H₀ = 14 miliardi di anni',
  blocchi:[
  {t:'prosa', title:'Che cosa si trova misurando le velocità', tag:'la sorpresa', html:R`
  <p>Con i metodi di distanza in mano si potrebbe, galassia per galassia, cercare una Cefeide o una SN Ia o misurare una dispersione di velocità, e trasformare la mappa 2D in una 3D. È lentissimo. Le slide prendono un&rsquo;altra strada: misurare le velocità, con la spettroscopia. Se la sorgente si muove, le serie di righe di lunghezza d&rsquo;onda nota appaiono spostate, e si definisce</p>
  <p>$$z=\frac{\lambda_{\rm oss}-\lambda_{\rm lab}}{\lambda_{\rm lab}}=\frac{\Delta\lambda}{\lambda},$$</p>
  <p>che per velocità piccole è $v/c$. Le righe di riferimento della slide sono il doppietto H e K del calcio ionizzato (393 e 397 nm), la serie di Balmer dell&rsquo;idrogeno (410, 434, 486, 656 nm), il magnesio a 518 nm, il sodio a 589 nm. Per i quasar, galassie attive con un buco nero supermassivo al centro e righe di emissione a redshift anche maggiori di 1, la lista si allunga nell&rsquo;ultravioletto: Ly$\alpha$ a 1216 Å, CIV a 1549, CIII] a 1909, MgII a 2799 Å. Il punto delicato, dice la lezione, è che per galassie lontane il rapporto segnale-rumore delle righe può essere basso e poche righe cadono nella banda dello spettrometro, così che riconoscere quale riga è quale diventa il vero problema; la condizione che lo risolve è che lo stesso $z$ valga per tutte, $\lambda_{\rm oss}/\lambda_{\rm lab}=1+z$ per ogni riga.</p>
  <p>Se le velocità fossero distribuite a caso, come le molecole di un gas, si misurerebbero $z$ positivi e negativi. Invece, <i>«a parte poche galassie molto vicine, z è sempre \gt  0, e può essere anche molto grande»</i>: nella survey PSCz (Saunders e collaboratori, 2000, 18351 galassie entro circa 60 Mpc) l&rsquo;istogramma di $cz$ sale fino a decine di migliaia di km/s, tutti positivi. E, combinando con le distanze, <i>«le galassie sembrano allontanarsi tutte da noi, e con velocità sempre più alta tanto più sono distanti»</i>. È la legge di Hubble,</p>
  <p>$$cz=H_0D,$$</p>
  <p>ottenuta nelle slide con tre gradini diversi, le Cefeidi (Madore 1999), Tully-Fisher e le SN Ia (Riess): stessa retta. La costante vale circa 70 km/s/Mpc, e il suo inverso è un tempo,</p>
  <p>$$\frac{1}{H_0}=\frac{3{,}086\cdot10^{19}\ \mathrm{km}}{70\ \mathrm{km/s}}=4{,}41\cdot10^{17}\ \mathrm{s}=13{,}97\cdot10^9\ \text{anni},$$</p>
  <p>il $1/(1{,}4\cdot10^{10}$ anni$)$ della lezione. Il commento della slide è il centro del movimento: <i>«siamo partiti per studiare la distribuzione nello spazio delle galassie e abbiamo trovato invece una legge fondamentale della dinamica dell&rsquo;Universo, a prima vista sorprendente»</i>. Ma serve subito anche al proposito iniziale: una volta calibrata, la legge di Hubble è essa stessa un indicatore di distanza, $D=cz/H_0$, e con uno spettro si ha la terza coordinata.</p>`},
  {t:'reveal', title:'Esercizio: H₀ dalle supernovae Ia (prova del 14/09/2007)', tag:'svolto', steps:[
   {label:'Il testo', body:R`<p>Nel diagramma della prova si riportano le magnitudini apparenti di SN Ia in funzione di $z$, con magnitudine assoluta $M=-19$. Si valuti la costante di Hubble. Dalla figura: a $z=0{,}01$ si legge $m=13{,}8$, a $z=0{,}1$ si legge $m=19$.</p>`},
   {label:'L’impostazione', body:R`<p>Due relazioni: il modulo di distanza, $D=10\,\mathrm{pc}\cdot10^{(m-M)/5}$, e la legge di Hubble, $H_0=cz/D$. Insieme: $H_0=cz/(10\,\mathrm{pc}\cdot10^{(m-M)/5})$, come nella soluzione della raccolta.</p>`},
   {label:'Il primo punto', body:R`<p>$m-M=13{,}8+19=32{,}8$, quindi $D=10^{32{,}8/5+1}$ pc $=36{,}3$ Mpc. Con $cz=2998$ km/s: $H_0=2998/36{,}3=82{,}6$ km/s/Mpc, l&rsquo;83 della soluzione.</p>`},
   {label:'Il secondo punto', body:R`<p>$m-M=38$, $D=10^{8{,}6}$ pc $=398$ Mpc, $cz=29\,979$ km/s, $H_0=75{,}3$ km/s/Mpc. La media dei due è $78{,}9$, il 79 della soluzione.</p>`},
   {label:'Che cosa manca', body:R`<p>La soluzione stessa lo dice: un procedimento corretto pesa tutti i punti con le loro incertezze in un fit, e tiene conto della deviazione dalla linearità quando $z$ comincia a essere confrontabile con 1. Il punto a $z=0{,}01$ ha un problema in più: $cz=3000$ km/s non è molto più grande delle velocità peculiari, qualche centinaio di km/s, che si sommano all&rsquo;espansione; a $z=0{,}1$ pesano dieci volte meno. È per questo che il secondo valore è più affidabile, anche se più lontano.</p>`}
  ]},
  {t:'plot', title:'Il diagramma di Hubble delle SN Ia',
   intro:R`Magnitudine apparente al massimo contro redshift per candele con M = −19, calcolata da m = M + 5 log₁₀(cz/H₀ / 10 pc) per tre valori di H₀. I due punti sono le letture della prova del 2007.`,
   plots:[
    {kind:'func2d', xr:[0.005,0.12], yr:[12,21], height:300, equal:false,
     title:'z      m',
     curves:[{f:'-19+5*log(2.998e5*x/60*1e5)/log(10)', col:'#b98cff', label:'H0 = 60', dash:true},
             {f:'-19+5*log(2.998e5*x/70*1e5)/log(10)', col:'#5eead4', label:'H0 = 70'},
             {f:'-19+5*log(2.998e5*x/80*1e5)/log(10)', col:'#d8a13a', label:'H0 = 80', dash:true}],
     marks:[{x:0.01, y:13.8, label:'z = 0,01: m = 13,8', col:'#f87171', up:true},
            {x:0.1, y:19, label:'z = 0,1: m = 19', col:'#f87171', up:false}]}
   ],
   leggi:R`<p><b>Che cosa guardare:</b> in scala lineare di z le curve sono logaritmi, e si separano di una costante: un cambio di H₀ da 70 a 80 sposta tutto di 5 log₁₀(8/7) ≈ 0,29 magnitudini. I due punti della prova stanno tra 70 e 80 e più vicini a 80 il primo, che risente delle velocità peculiari.</p>
   <p><b>Che cosa impararne:</b> la pendenza di questa curva non dipende da M né da H₀, che spostano solo lo zero; è per questo che il diagramma di Hubble delle SN Ia misura la forma della legge velocità-distanza anche senza calibrazione, e la calibrazione con le Cefeidi serve solo per H₀.</p>`},
  {t:'prosa', title:'L’applicazione della lezione: Hubble da z e diametro angolare', tag:'secondo esercizio', html:R`
  <p>La lezione propone un esercizio da fare con immagini e spettri reali, basato sul secondo indicatore, la dimensione. L&rsquo;idea è che galassie morfologicamente simili abbiano avuto un&rsquo;evoluzione simile e quindi dimensioni simili: si usano solo spirali, perché è più facile riconoscere un gruppo di morfologia omogenea, e perché in formazione stellare hanno sia righe di emissione (le righe «nebulari» del gas ionizzato dalle stelle giovani) sia righe di assorbimento, mentre le ellittiche, vecchie, solo assorbimento. Il diametro medio delle spirali di quel tipo è 22 kpc. Dalle immagini si misura l&rsquo;angolo $\theta$ lungo l&rsquo;asse maggiore, fino all&rsquo;ultimo punto dove si vede luce (per non sottostimarlo, e per non farsi ingannare dall&rsquo;inclinazione), con la scala dell&rsquo;immagine $1/f$ in rad/mm; dagli spettri $z$ con la riga K del calcio. Allora $D(\mathrm{Mpc})=22/\theta(\mathrm{mrad})$, e si grafica $cz$ contro $D$.</p>
  <p>Per NGC 2276 la slide marca $0{,}6$ mrad: $D=22/0{,}6=36{,}7$ Mpc. Il redshift che segue è mio, per mostrare l&rsquo;ultimo passo: se la riga K, a 3933,7 Å in laboratorio, cade a 3965,4 Å, $z=31{,}7/3933{,}7=0{,}00806$, $cz=2416$ km/s, e la pendenza di questa sola galassia è</p>
  <p>$$H_0=\frac{2416\ \mathrm{km/s}}{36{,}7\ \mathrm{Mpc}}=65{,}9\ \mathrm{km/s/Mpc}.$$</p>
  <p>Un punto solo non basta: la dispersione delle dimensioni vere delle spirali, decine di percento, si scarica tutta su $D$, ed è la media su molte galassie che dà una retta.</p>`},
  {t:'prosa', title:'Velocità più grandi della luce?', tag:'il problema del redshift', html:R`
  <p>Ai quasar con $z>1$ l&rsquo;interpretazione Doppler classica, $v=cz$, dà $v>c$. La lezione prova allora con il Doppler della relatività speciale per moto lungo la linea di vista, $1+z=\sqrt{(1+\beta)/(1-\beta)}$, che si inverte in</p>
  <p>$$\beta=\frac{v}{c}=\frac{(1+z)^2-1}{(1+z)^2+1},$$</p>
  <p>e per $z=3$ dà $\beta=15/17=0{,}882$: sotto $c$, ma vicinissimo. La domanda che segue nella slide è quella giusta: <i>«ma quanta energia serve per accelerare la massa di una galassia fino a una velocità vicina a c?»</i>. Con $\gamma=1/\sqrt{1-\beta^2}=2{,}125$ e una galassia di $10^{11}\,M_\odot$, l&rsquo;energia cinetica è $(\gamma-1)Mc^2=2{,}0\cdot10^{58}$ J, l&rsquo;energia di riposo di centomila miliardi di masse solari convertita interamente: <i>«energie cinetiche spaventose»</i>, dice la lezione 17, che non esistono. La conclusione è che <i>«il redshift delle galassie lontane non è dovuto a velocità fisiche di allontanamento»</i>: le lunghezze d&rsquo;onda si allungano perché lo spazio si espande. Il Marconi lo dice in una riga: <i>«le galassie non stanno allontanandosi da noi, è l&rsquo;Universo che si sta espandendo»</i>. Che cosa questo voglia dire con precisione richiede una metrica, ed è il punto d&rsquo;arrivo di questo movimento.</p>`},
  {t:'plot', title:'Doppler classico e relativistico contro z',
   intro:R`Velocità in unità di c che si attribuirebbe a una galassia di redshift z: in oro la lettura classica v = cz, in ciano quella della relatività speciale. La linea tratteggiata è β = 1.`,
   plots:[
    {kind:'func2d', xr:[0,5], yr:[0,2], height:260, equal:false,
     title:'z      v/c',
     curves:[{f:'x', col:'#d8a13a', label:'classico: v/c = z'},
             {f:'(pow(1+x,2)-1)/(pow(1+x,2)+1)', col:'#5eead4', label:'relativistico'},
             {f:'1', col:'#94a3b8', label:'v = c', dash:true}],
     marks:[{x:3, y:0.882, label:'z = 3: β = 0,882', col:'#5eead4', up:true}]}
   ],
   leggi:R`<p><b>Che cosa guardare:</b> le due curve coincidono fino a z ≈ 0,1, dove l'errore della lettura classica è del 5%; oltre si separano, e la classica attraversa c a z = 1.</p>
   <p><b>Che cosa impararne:</b> la curva relativistica salva la relatività ristretta ma non la fisica: chiede energie impossibili. Nessuna delle due curve è quella giusta per le galassie lontane; il redshift cosmologico è un'altra cosa, e la sua relazione con la distanza dipende dalla storia dell'espansione.</p>`}
]},

/* ---------------- 06 · LE SURVEY 3D E LA SCALA DELL'OMOGENEITÀ ---------------- */
{ num:'06', title:'Le survey tridimensionali e la scala oltre la quale l’universo è liscio', meta:'Las Campanas, 2dF, SDSS · ⟨(ΔN/N)²⟩ contro r · IRAS, radiosorgenti, fondo X, fondo a microonde',
  blocchi:[
  {t:'prosa', title:'Costruire la mappa', tag:'osservazione', html:R`
  <p>Con la legge di Hubble come indicatore, la terza coordinata costa uno spettro. Alcuni telescopi sono stati dedicati a misurare sistematicamente i redshift di un gran numero di galassie: la Las Campanas Redshift Survey, circa 25000 galassie nel 1996; la 2dF, al telescopio anglo-australiano di 4 m, con uno spettrometro a fibre ottiche automatizzato che prende centinaia di spettri insieme, circa 250000 galassie; la Sloan Digital Sky Survey, con un telescopio dedicato, redshift e immagini di più di un milione di galassie. La figura della 2dF (Colless e collaboratori, 2001) mostra due ventagli in coordinate (ascensione retta, $z$): la tessitura liscia della proiezione si apre in filamenti, muri e vuoti grandi decine di Mpc. È la struttura «a spugna» che il Marconi cita come argomento a favore del principio cosmologico, perché è ubiqua: la stessa tessitura in ogni direzione.</p>
  <p>Ma la lezione è onesta sul punto che disturba: <i>«via via che si aumenta la sensibilità delle survey di galassie si scoprono strutture sempre più grandi, e di solito confrontabili con le dimensioni stesse della survey»</i>. Se fosse sempre così, l&rsquo;omogeneità non arriverebbe mai, e l&rsquo;universo sarebbe un frattale. La risposta è quantitativa: bisogna misurare come le fluttuazioni dei conteggi dipendono dalla scala.</p>`},
  {t:'prosa', title:'Le fluttuazioni contro la scala', tag:'la misura', html:R`
  <p>Si sposta a caso nella survey una sfera, o una scatola, di dimensione $r$ e si contano le galassie che contiene, $N$; la grandezza che misura le strutture è la varianza relativa, $\langle(\Delta N/N)^2\rangle$, depurata dal rumore di Poisson. La lezione, dai dati di Peacock e Dodds (1994), dà $\langle(\Delta N/N)^2\rangle\approx1$ per $r=20\,h^{-1}$ Mpc: <i>«spostando a caso una sfera di circa 30 Mpc di diametro non è difficile trovare zone molto sottodense (grandi vuoti) o molto sovradense (ammassi di galassie)»</i>, nel senso di contrasti dell&rsquo;ordine dell&rsquo;unità. E aggiunge che <i>«a scale molto più grandi (es. 300 Mpc) l&rsquo;universo dovrebbe essere molto più omogeneo»</i>. I valori a $150\,h^{-1}$ Mpc nella slide estratta sono illeggibili (si leggono $0{,}4$ e $0{,}1$ senza poter dire quale sia la varianza e quale la radice); lo dichiaro, e uso invece il dato di IRAS, che è chiaro.</p>
  <p>La survey di galassie IRAS, selezionata in flusso nell&rsquo;infrarosso, con tutti i redshift misurati fino a 300 Mpc e la maggior parte delle galassie intorno a 150 Mpc, dà in scatole cubiche di lato 40 Mpc una fluttuazione dei conteggi del $50\%$, $\langle(\Delta N/N)^2\rangle^{1/2}=0{,}5\pm0{,}1$ (Saunders 1991, Strauss 1992). Contro l&rsquo;ordine dell&rsquo;unità sulle scale degli ammassi.</p>
  <p>Per legare i due numeri serve un modello, e quello che uso è mio: la funzione di correlazione delle galassie è una legge di potenza con pendenza circa $1{,}8$ (valore standard, non dalle slide), e la varianza su una scala $r$ ne eredita la pendenza, $\langle(\Delta N/N)^2\rangle\propto r^{-1{,}8}$, cioè $\Delta N/N\propto r^{-0{,}9}$. Normalizzando a 1 per 20 Mpc,</p>
  <p>$$\frac{\Delta N}{N}(40\,\mathrm{Mpc})=\left(\frac{40}{20}\right)^{-0{,}9}=0{,}54,\qquad\frac{\Delta N}{N}(150\,\mathrm{Mpc})=\left(\frac{150}{20}\right)^{-0{,}9}=0{,}163 .$$</p>
  <p>Il primo numero è dentro l&rsquo;errore di IRAS, $0{,}5\pm0{,}1$: il modello regge. Il secondo dice che a 150 Mpc le fluttuazioni sono già scese a una parte su sei, e a 300 Mpc, la scala della slide, a meno del $10\%$. La legge di potenza non può continuare per sempre, e il dato più profondo di tutti dice che non lo fa.</p>`},
  {t:'plot', title:'Fluttuazione dei conteggi contro la scala',
   intro:R`ΔN/N contro r (Mpc) nel modello a legge di potenza ΔN/N = (r/20 Mpc)^(−0,9), normalizzato a 1 per 20 Mpc come nella lezione. Il punto rosso è la misura IRAS a 40 Mpc (0,5 ± 0,1); la linea tratteggiata il livello del 3% del fondo X.`,
   plots:[
    {kind:'func2d', xr:[10,400], yr:[0,1.6], height:280, equal:false,
     title:'r (Mpc)      ΔN/N',
     curves:[{f:'pow(x/20,-0.9)', col:'#5eead4', label:'(r/20)^-0,9'},
             {f:'0.03', col:'#94a3b8', label:'3% (fondo X)', dash:true}],
     marks:[{x:40, y:0.5, label:'IRAS 40 Mpc: 0,5', col:'#f87171', up:true},
            {x:20, y:1, label:'20 Mpc: ~1', col:'#d8a13a', up:true},
            {x:150, y:0.163, label:'150 Mpc: 0,16', col:'#d8a13a', up:true}]}
   ],
   leggi:R`<p><b>Che cosa guardare:</b> sotto i 20-30 Mpc le fluttuazioni sono dell'ordine dell'unità, e l'universo è grumoso; sopra i 100 Mpc la curva è già sotto 0,2 e continua a scendere senza fermarsi.</p>
   <p><b>Che cosa impararne:</b> «omogeneo» non vuol dire uniforme: vuol dire che la varianza dei conteggi tende a zero quando la scala cresce. È esattamente il criterio che la lezione usa per escludere l'universo isotropo ma non omogeneo.</p>`},
  {t:'prosa', title:'Isotropia sempre migliore con la profondità', tag:'tre sonde', html:R`
  <p>Tre sonde più profonde delle galassie completano il quadro, e la lezione le ordina per distanza. La prima sono le 30000 radiosorgenti più brillanti a 6 cm (Gregory e Condon 1991): radiogalassie e quasar a migliaia di Mpc, $z\approx1$, oggetti peculiari e rari, quindi un campionamento profondo ma sparso, che perde il dettaglio fine. Nella proiezione polare <i>«l&rsquo;isotropia della distribuzione a larga scala è evidente»</i>. La seconda è il fondo X tra 2 e 20 keV, prodotto da miriadi di sorgenti non risolte fino a $z\approx1$: fuori dal piano galattico <i>«la densità colonnare di materia che emette su box di $3^\circ\times3^\circ$ è isotropa entro meglio del $3\%$»</i>. La terza è il fondo a microonde, che viene da ancora più lontano, e la cui isotropia è <i>«migliore dello 0,01%»</i>, una parte su diecimila; dopo aver tolto il dipolo dovuto al moto della Terra, le anisotropie intrinseche sono di una parte su centomila.</p>
  <p>Il ragionamento della lezione 16c che lega tutto è questo: <i>«la tendenza a una distribuzione sempre più isotropa con l&rsquo;aumentare della profondità del campione c&rsquo;è. Questo è un segno di omogeneità»</i>. Ma è solo un segno, e la tappa che segue spiega perché, e che cosa serve per farne una prova.</p>`}
]},

/* ---------------- 07 · DALL'ISOTROPIA ALL'OMOGENEITÀ ---------------- */
{ num:'07', title:'Dall’isotropia all’omogeneità: il principio cosmologico', meta:'un controesempio sferico · i due osservatori · Copernico come ipotesi fisica · l’espansione uniforme dà v = H₀r',
  blocchi:[
  {t:'prosa', title:'Isotropia non è omogeneità', tag:'il controesempio', html:R`
  <p>Le due proprietà sono diverse e conviene tenerle distinte. Un universo è <b>isotropo</b> intorno a un punto se, da quel punto, ogni direzione è equivalente; è <b>omogeneo</b> se ogni punto è equivalente a ogni altro. Le osservazioni della tappa precedente misurano solo la prima, e solo intorno a noi.</p>
  <p>La lezione costruisce subito il controesempio: <i>«potremmo costruire un modello di universo isotropo ma non omogeneo, a simmetria sferica, in cui c&rsquo;è un gradiente di densità radiale. Questo sarebbe compatibile con le osservazioni, ma richiederebbe che la nostra posizione nell&rsquo;universo fosse vicino al centro di simmetria. Un altro osservatore lontano dalla nostra posizione osserverebbe un universo molto anisotropo»</i>. Le obiezioni sono due, e di natura diversa. La prima è filosofica: <i>«dal punto di vista post-copernicano questo modello è molto insoddisfacente»</i>, perché ci rimette al centro. La seconda è fisica: <i>«la migliore evidenza contro questo modello è la tendenza a zero di $\langle(\Delta N/N)^2\rangle$ per conteggi sempre più profondi»</i>. In un universo con un gradiente radiale la varianza dei conteggi in celle a distanze diverse non tenderebbe a zero, perché celle lontane e celle vicine avrebbero densità medie diverse; il fatto che tenda a zero, come nella figura precedente, dice che la densità media è la stessa a tutte le distanze esplorate.</p>`},
  {t:'prosa', title:'L’argomento dei due osservatori', tag:'la dimostrazione', html:R`
  <p>Il passo da «copernicano» a «dimostrato» è un argomento geometrico che la lezione disegna con due osservatori e qualche sfera. Supponiamo che due osservatori, A e B, vedano entrambi un universo isotropo. L&rsquo;isotropia intorno a B implica che tutti i punti alla stessa distanza da B, ad esempio C, D, E su una sfera centrata in B, abbiano la stessa densità. Ma ognuno di quei punti è anche a una certa distanza da A, e l&rsquo;isotropia intorno ad A dice che tutti i punti della sfera centrata in A che passa per C hanno la densità di C. Le sfere centrate in A e quelle centrate in B si intersecano, e ogni intersezione trasporta il valore della densità da una sfera all&rsquo;altra: <i>«tutto il volume tra le due sfere deve avere la stessa densità, perché formato da sfere che intersecano la sfera rossa. Aumentando il diametro delle sfere si arriva a dimostrare che tutto l&rsquo;universo è omogeneo»</i>.</p>
  <p>Il teorema, detto con precisione, è: <b>isotropia intorno a ogni punto implica omogeneità</b>, e bastano anzi due punti distinti più un argomento di continuità. L&rsquo;ipotesi copernicana serve esattamente a fornire il secondo osservatore: non sappiamo che l&rsquo;universo è isotropo intorno ad A, ma se non siamo in un posto speciale, lo è. Il contrario non vale: un universo omogeneo può essere anisotropo, ad esempio con un campo magnetico uniforme o un&rsquo;espansione più veloce in una direzione, e allora lo vedrebbero anisotropo tutti allo stesso modo. Per questo l&rsquo;isotropia del fondo a una parte su centomila è il dato decisivo: esclude anche l&rsquo;anisotropia omogenea, almeno all&rsquo;epoca in cui il fondo è stato emesso e lungo tutto il cammino fino a noi.</p>`},
  {t:'prosa', title:'Il principio e il suo prezzo', tag:'l’enunciato', html:R`
  <p>Da qui l&rsquo;enunciato della lezione 16c: <i>«L&rsquo;Universo è isotropo ed omogeneo a grandi scale ($\gt 100$ Mpc). È un principio che permette di semplificare enormemente il modello di universo, definendo una densità media uguale ovunque, e funzione solo del tempo cosmico»</i>. Il Marconi lo formula in termini di osservatori: <i>«non siamo osservatori collocati in una posizione particolare dell&rsquo;universo»</i>, e ogni osservatore fondamentale in qualunque altra parte vedrebbe <i>«la stessa espansione di Hubble, le stesse proprietà della CMB, la stessa struttura delle galassie su grande scala»</i>. Il riassunto della lezione 17 tiene insieme le tre gambe: l&rsquo;isotropia osservata di galassie, radiosorgenti e fondi, l&rsquo;evidenza delle survey 3D, e le considerazioni copernicane.</p>
  <p>Il prezzo è la scala. Il principio è falso sotto i 100 Mpc, dove ci sono galassie, ammassi e vuoti, e il movimento sulla formazione delle strutture si occupa esattamente di quelle deviazioni come piccole perturbazioni su un fondo omogeneo. Ed è un&rsquo;ipotesi sul presente estesa al passato: il fondo a microonde dice che a $z\approx1100$ l&rsquo;universo era omogeneo a una parte su centomila, quindi l&rsquo;estensione è giustificata, e anzi più lontano si guarda meglio regge.</p>`},
  {t:'prosa', title:'Omogeneità più Hubble: l’espansione uniforme', tag:'il primo vincolo', html:R`
  <p>Il primo vincolo che il principio impone alla dinamica è nel Marconi (eq. 2.45-2.47). Un&rsquo;espansione si dice uniforme se le distanze tra due punti qualsiasi aumentano dello stesso fattore in un dato intervallo: per le galassie $1,\dots,n$ a distanze $r_i$ da un osservatore qualunque,</p>
  <p>$$\frac{r_1(t_2)}{r_1(t_1)}=\frac{r_2(t_2)}{r_2(t_1)}=\dots=\alpha .$$</p>
  <p>La velocità di recessione della galassia $i$ è allora</p>
  <p>$$v_i=\frac{r_i(t_2)-r_i(t_1)}{t_2-t_1}=\frac{\alpha r_i(t_1)-r_i(t_1)}{t_2-t_1}=\frac{\alpha-1}{t_2-t_1}\,r_i(t_1)=H_0\,r_i(t_1),$$</p>
  <p>con la stessa $H_0=(\alpha-1)/(t_2-t_1)$ per tutte. Un&rsquo;espansione uniforme produce automaticamente una relazione $v\propto r$, e la vede identica ogni osservatore: è l&rsquo;unica legge velocità-distanza compatibile con l&rsquo;omogeneità. Al contrario, una legge $v\propto r^2$ vista da noi, trasportata in un&rsquo;altra galassia, non sarebbe più una legge di potenza in $r$, e quell&rsquo;osservatore vedrebbe un universo diverso. Il Marconi aggiunge l&rsquo;osservazione che chiude il problema del redshift: la relazione vale anche quando $v>c$, e <i>«non è affatto in contraddizione con la relatività speciale; i punti partecipano semplicemente all&rsquo;espansione uniforme dello spazio e non c&rsquo;è connessione causale tra loro. La velocità di recessione non è una velocità con cui si può trasmettere un segnale»</i>.</p>`}
]},

/* ---------------- 08 · PERCHÉ LA METRICA È ROBERTSON-WALKER ---------------- */
{ num:'08', title:'Perché la metrica è Robertson-Walker: la catena dei vincoli', meta:'tempo cosmico · a(t) universale · curvatura costante nello spazio · R_c ∝ a · tre geometrie e una funzione',
  blocchi:[
  {t:'prosa', title:'La catena, un anello alla volta', tag:'l’argomento da orale', html:R`
  <p>La metrica è la formula che dà l&rsquo;intervallo tra due eventi, e in principio ha dieci funzioni incognite di quattro coordinate. Il principio cosmologico le riduce a una sola funzione di una variabile. La catena va detta così.</p>
  <p><b>Primo anello: un tempo cosmico.</b> Se l&rsquo;universo è omogeneo, esiste una famiglia di osservatori, quelli che si muovono con il fluido medio delle galassie, per i quali il mondo appare isotropo; il postulato di Weyl (Marconi, cap. 3) dice che le loro linee d&rsquo;universo non si intersecano se non in un punto del passato, e i loro orologi sincronizzati lì misurano un <i>tempo cosmico</i> $t$ comune. Se in punti diversi il tempo scorresse diversamente, i punti sarebbero distinguibili: la lezione 17 lo dice con le parole <i>«per il principio cosmologico, non c&rsquo;è motivo che il tempo scorra in modo diverso in punti diversi. Il termine di distanza temporale è quindi semplicemente $c\,dt$»</i>. E non ci sono termini misti $dt\,dx$: se ci fossero, definirebbero una direzione privilegiata, contro l&rsquo;isotropia.</p>
  <p><b>Secondo anello: un fattore di scala universale.</b> L&rsquo;espansione deve essere uniforme, per la tappa precedente, quindi tutte le distanze proprie cambiano dello stesso fattore. Il Marconi lo scrive come rapporto: $\rho_i(t_1)/\rho_i(t_2)=\rho_j(t_1)/\rho_j(t_2)$ per ogni coppia $i,j$ e ogni coppia di tempi, e l&rsquo;unica possibilità è che quel rapporto sia una funzione universale $a(t_1)/a(t_2)$. Normalizzando $a(t_0)=1$, la distanza propria è $\rho(t)=a(t)\,\chi$, con $\chi$ la distanza <i>comovente</i>, un&rsquo;etichetta costante attaccata a ogni galassia. Lo stesso fattore deve valere anche per le distanze trasverse, altrimenti l&rsquo;espansione sarebbe anisotropa.</p>
  <p><b>Terzo anello: la geometria spaziale ha curvatura costante.</b> A tempo cosmico fissato, lo spazio tridimensionale è omogeneo e isotropo. Le geometrie con questa proprietà sono soltanto tre: piatta, sferica (curvatura positiva) e iperbolica (curvatura negativa), con la curvatura che ha lo stesso valore in ogni punto e in ogni direzione. Se la curvatura variasse da punto a punto, i punti si distinguerebbero misurando triangoli; se variasse con la direzione, le direzioni.</p>
  <p><b>Quarto anello: la curvatura scala come $a^{-2}$.</b> È il passaggio che il Marconi fa con più cura (eq. 3.77-3.79). La distanza propria trasversa tra due punti separati da un angolo $\Delta\omega$ in uno spazio sferico di raggio di curvatura $R_c(t)$ è $\Delta\ell(t)=R_c(t)\sin(\rho(t)/R_c(t))\,\Delta\omega$, e per l&rsquo;espansione uniforme deve crescere come $a(t)$. Con $\rho=a\chi$ la condizione diventa</p>
  <p>$$\frac{R_c(t)}{a(t)}\sin\left[\frac{a(t)\chi}{R_c(t)}\right]=R_c(t_0)\sin\left[\frac{\chi}{R_c(t_0)}\right]\ \ \text{per ogni }t,$$</p>
  <p>e siccome il membro di destra non dipende dal tempo, l&rsquo;unica possibilità è $R_c(t)=a(t)R_c(t_0)$: il raggio di curvatura si dilata con l&rsquo;universo, e la curvatura $K=1/R_c^2$ va come $1/a^2$. La lezione 17 definisce allora $k=Ka^2$, costante. Il segno di $k$ non può cambiare: il tipo di geometria resta lo stesso per sempre.</p>
  <p><b>Conclusione.</b> Rimangono un numero, $k$, e una funzione, $a(t)$. Tutto il resto è fissato dalla simmetria, prima di qualunque equazione di Einstein: <i>«la metrica di Robertson-Walker è indipendente dall&rsquo;assunzione che la dinamica sia descritta dalle equazioni della relatività generale»</i>, dice il Marconi. La fisica, cioè il contenuto di materia ed energia, entra solo nel determinare $a(t)$.</p>`},
  {t:'prosa', title:'La curvatura vista da dentro: la sfera', tag:'il conto di lezione 17', html:R`
  <p>Per vedere come la curvatura entra nella metrica, la lezione 17 fa il conto su una sfera di raggio $R$, uno spazio bidimensionale curvo. Un punto è individuato dagli angoli $(\theta,\phi)$; la distanza tra punti vicini è $d\ell^2=R^2d\theta^2+(R\sin\theta)^2d\phi^2$. Si introduca la coordinata polare «del piano» $r=R\sin\theta$, il raggio della circonferenza per quel punto. Allora $dr=R\cos\theta\,d\theta$ e</p>
  <p>$$R^2d\theta^2=\frac{dr^2}{\cos^2\theta}=\frac{dr^2}{1-r^2/R^2},$$</p>
  <p>così che</p>
  <p>$$d\ell^2=\frac{dr^2}{1-Kr^2}+r^2d\phi^2,\qquad K=\frac{1}{R^2}.$$</p>
  <p>Il fattore $1/(1-Kr^2)$ è l&rsquo;intera differenza dal piano: per $K\to0$ si torna a $d\ell^2=dr^2+r^2d\phi^2$. La lezione lo legge con i triangoli: su una sfera la somma degli angoli di un triangolo supera $\pi$, e il teorema di Pitagora diventa $\cos(c/R)=\cos(a/R)\cos(b/R)$, che per lati piccoli rispetto a $R$ si riduce a $c^2=a^2+b^2$. Un abitante della sfera si accorge della curvatura solo con triangoli grandi quanto $R$: lo stesso vale per noi nello spazio.</p>
  <p>Il passaggio a tre dimensioni sostituisce $d\phi^2$ con l&rsquo;angolo solido $d\theta^2+\sin^2\theta\,d\phi^2$; aggiungendo il tempo cosmico, $r(t)=a(t)\chi$ e $K(t)=k/a(t)^2$, si arriva alla forma della lezione 17,</p>
  <p>$$ds^2=c^2dt^2-a(t)^2\left[\frac{d\chi^2}{1-k\chi^2}+\chi^2\left(d\theta^2+\sin^2\theta\,d\phi^2\right)\right],$$</p>
  <p>la metrica di Robertson-Walker. Il Marconi la scrive anche nella forma equivalente con $R^2\sin^2(r/R)$ davanti all&rsquo;angolo solido, che rende esplicito che nello spazio sferico la circonferenza a distanza comovente $r$ cresce meno di $2\pi r$, e nell&rsquo;iperbolico, con $\sinh$, di più.</p>`},
  {t:'prosa', title:'Che cosa resta da fare', tag:'il senso', html:R`
  <p>Il movimento finisce dove la cosmologia comincia. La metrica dice come si misurano le distanze, non come cambia $a(t)$: per quello servono le equazioni di Einstein, che con questa metrica si riducono all&rsquo;equazione di Friedmann. Dice però già come si propaga la luce, e da lì viene la spiegazione del redshift lasciata aperta alla tappa 05: un raggio di luce che viaggia in uno spazio che si dilata si dilata con lui, e $1+z=a(t_0)/a(t_{\rm em})$, senza alcuna velocità fisica in gioco. Gli esercizi di questa parte, la legge di Hubble dalle SN Ia e da $z$ e diametro angolare, sono la versione a piccolo redshift di quella relazione; a grande redshift le distanze di luminosità e di diametro angolare smettono di coincidere, ed è la metrica a dire di quanto.</p>`}
]},

/* ---------------- 09 · COLLAUDO ---------------- */
{ num:'09', title:'Collaudo: le domande che l’esame fa su questa parte', meta:'catena dei vincoli · scala delle distanze · trappole',
  blocchi:[
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Perché la pendenza −3/2 dei conteggi N(>F) è una prova di omogeneità e non dipende dalla luminosità delle sorgenti?`,
    a:R`Perché in uno spazio euclideo uniformemente popolato ogni classe di luminosità dà $N(>F)\propto L^{3/2}F^{-3/2}$: la luminosità entra nella costante, non nell&rsquo;esponente, e la somma su classi diverse conserva l&rsquo;esponente. Una pendenza diversa segnala densità che cambia con la distanza, o evoluzione, o geometria non euclidea.`},
   {q:R`La slide sulla LMC scrive 10 pc·10^{(22−4)/5} = 50 kpc. È giusto?`,
    a:R`No: $10^{18/5}\cdot10$ pc $=39{,}8$ kpc. Il modulo della LMC è 18,5, che dà 50 kpc; l&rsquo;altra espressione della slide, con $(19{,}25-0{,}75)$, è quella corretta.`},
   {q:R`Un universo isotropo intorno a noi è necessariamente omogeneo?`,
    a:R`No: un modello a simmetria sferica con gradiente radiale di densità è isotropo dal centro e non omogeneo. Serve l&rsquo;isotropia intorno a un secondo punto (ipotesi copernicana), e allora l&rsquo;argomento delle sfere che si intersecano dà l&rsquo;omogeneità. L&rsquo;evidenza fisica contro il gradiente è che $\langle(\Delta N/N)^2\rangle$ tende a zero con la profondità.`},
   {q:R`E un universo omogeneo è necessariamente isotropo?`,
    a:R`No: può espandersi più velocemente in una direzione, o contenere un campo vettoriale uniforme. Tutti lo vedrebbero anisotropo allo stesso modo. È l&rsquo;isotropia del fondo a microonde, a $10^{-5}$, a escluderlo.`},
   {q:R`Perché nella metrica RW la curvatura spaziale deve scalare come 1/a²?`,
    a:R`Perché le distanze trasverse devono crescere come $a(t)$ come quelle radiali (espansione uniforme e isotropa), e in uno spazio curvo la distanza trasversa contiene $R_c\sin(\rho/R_c)$: l&rsquo;uguaglianza per ogni $t$ impone $R_c(t)=a(t)R_c(t_0)$, quindi $K\propto a^{-2}$ e $k=Ka^2$ costante.`},
   {q:R`Una galassia ha z = 2. Con quale velocità si allontana?`,
    a:R`La domanda è mal posta: il redshift cosmologico non è un Doppler. Il Doppler classico darebbe $2c$, quello relativistico $0{,}8c$ ($\beta=8/10$), ed entrambi sono letture sbagliate. Ciò che è definito è $1+z=a(t_0)/a(t_{\rm em})=3$: l&rsquo;universo si è dilatato di un fattore 3 mentre la luce viaggiava.`},
   {q:R`Perché il punto a z = 0,01 dell’esercizio delle SN Ia dà un H₀ meno affidabile di quello a z = 0,1?`,
    a:R`Perché $cz=3000$ km/s è paragonabile alle velocità peculiari delle galassie, qualche centinaio di km/s, che si sommano al flusso di Hubble; a $z=0{,}1$ la stessa velocità peculiare è un errore dieci volte più piccolo.`}
  ]}
]}

function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}

  var wrap=document.createElement('section'); wrap.className='section';

}
