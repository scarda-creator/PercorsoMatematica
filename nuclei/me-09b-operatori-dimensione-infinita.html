function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

/* ---------------- 00 · IL FILO ---------------- */
{ num:'00', title:'Di cosa parla questo movimento', meta:'Metodi · note §7-9 · il punto in cui l\'analisi funzionale diventa meccanica quantistica',
  blocchi:[
  {t:'prosa', title:'Una frase, e il programma del movimento', tag:'first principles', html:R`
  <p>In dimensione finita un operatore è una matrice: si scrive, si applica a qualunque vettore, e non c'è altro da dire. Esposito apre questa parte delle note con una frase che conviene prendere alla lettera — <i>la teoria degli operatori lineari infinito-dimensionali è la base matematica della meccanica quantistica</i> — e il passo che la rende vera è uno solo:</p>
  <p style="text-align:center"><i>in dimensione infinita un operatore non agisce su tutto lo spazio. <b>Il suo dominio è parte della sua definizione</b>, e due domini diversi sono due operatori diversi anche se la formula è la stessa.</i></p>
  <p>Da questa frase, e non da altro, discendono tutte le cose che il corso chiede in questo blocco:</p>
  <ul>
  <li>la distinzione fra <b>simmetrico</b> e <b>auto-aggiunto</b>, che in dimensione finita non esiste perché lì i domini sono sempre tutto lo spazio;</li>
  <li>il fatto che $[\hat X,\hat P]=i\mathbb{1}$ sia <b>impossibile</b> per matrici finite, e quindi che la meccanica quantistica non possa vivere in dimensione finita;</li>
  <li>il <b>teorema di Heisenberg</b>, che non è un principio fisico ma una disuguaglianza di Schwarz travestita;</li>
  <li>lo <b>spettro continuo</b>, cioè autofunzioni che risolvono l'equazione agli autovalori ma non stanno nello spazio — sono distribuzioni (me-09), ed è per questo che me-09 viene prima;</li>
  <li>il <b>momento angolare orbitale</b> e le <b>armoniche sferiche</b>, che sono il primo esempio non banale in cui tutto questo apparato produce numeri.</li>
  </ul>
  <p><b>Quanto in profondità, e perché così.</b> Sulle 26 prove d'esame di Metodi in banca dati questo movimento è toccato da <b>8</b>, con densità 10,6. Il conto però va letto insieme a un secondo fatto: è anche il movimento che <b>regge il corso di Meccanica Quantistica</b> del terzo anno, dove la stessa materia torna come oggetto e non come strumento. Il taglio scelto qui è di conseguenza: i tre esercizi d'esame della tappa 08 sono svolti per intero perché <i>quelli</i> sono ciò che l'esame chiede, mentre le parti che le note lasciano come cenno — le armoniche sferiche esplicite — restano cenno anche qui, e si dice dove vanno a finire.</p>`},
  {t:'prosa', title:'Cosa saprai fare, uscendo di qui', tag:'performance attesa', html:R`
  <ul>
  <li>Dato un operatore differenziale e un dominio con condizioni al bordo, <b>decidere se è simmetrico o auto-aggiunto</b> facendo il conto dei termini di bordo. È l'esercizio 3 della prova del 07/07/2025, sette punti, e la prima domanda vale quanto le altre due insieme.</li>
  <li>Risolvere l'<b>equazione agli autovalori</b> per un operatore differenziale, imporre le condizioni al bordo e ottenere lo spettro — discreto se le condizioni quantizzano, continuo altrimenti.</li>
  <li>Normalizzare le autofunzioni, <b>in senso ordinario</b> se lo spettro è discreto e <b>in senso distribuzionale</b> ($\langle f_k|f_q\rangle=\delta(k-q)$) se è continuo, e sapere perché sono due conti diversi.</li>
  <li>Sviluppare una funzione assegnata nella base delle autofunzioni, cioè calcolare i coefficienti — che è sempre l'ultimo punto di questi esercizi.</li>
  <li>Dimostrare $[\hat X,\hat P]=i\mathbb{1}$ e <b>dedurne</b> il principio di indeterminazione, invece di ricordarlo.</li>
  <li>Verificare che uno stato assegnato <b>satura</b> Heisenberg, cioè che la disuguaglianza vale con l'uguale, e dire quali due condizioni lo rendono possibile.</li>
  <li>Ricavare $\hat L_z=-i\partial_\varphi$ e $\hat L^2$ in coordinate sferiche, e trovare che gli autovalori di $\hat L_z$ sono <b>interi</b> per una ragione di periodicità e non per un postulato.</li>

  <p>Questo movimento poggia su me-07 (operatori, aggiunto, teoria spettrale in dimensione finita), su me-08 ($L^2$, basi, completezza) e su me-09 (distribuzioni, $\delta$ di Dirac: senza quelle, lo spettro continuo non è dicibile). Apre me-10, perché la trasformata di Fourier è — letteralmente — il teorema spettrale applicato all'operatore impulso sulla retta.</p>`}

/* ---------------- 01 · IL DOMINIO È PARTE DELL'OPERATORE ---------------- */
{ num:'01', title:'Il dominio di definizione: la cosa nuova, e gli unici due operatori che servono', meta:'note §7.A · $\\hat X$ e $\\hat P$ · due controesempi espliciti · perché in dimensione finita non succedeva',

  {t:'prosa', title:'I due operatori del corso', tag:'definizione', html:R`
  <p>Tutto il blocco gira attorno a due operatori, che sono anche i due che compaiono più spesso in meccanica quantistica:</p>
  $$(\hat Xf)(x)=x\,f(x)\qquad\text{[posizione]},\qquad\qquad (\hat Pf)(x)=-i\,\frac{df}{dx}(x)\qquad\text{[impulso]}.$$
  <p>Sono scritti in unità $\hbar=1$: Calogero li scrive con l'$\hbar$ davanti, $p=-i\hbar\,d/dx$, e la differenza è solo di unità. Ogni altro operatore del corso — l'hamiltoniana $\hat H=\hat P^2/2m+V(\hat X)$, il momento angolare $\hat L=\hat X\times\hat P$, gli operatori di salita e discesa — si costruisce da questi due.</p>
  <p>La novità non è la formula: è che <b>bisogna dire su quali funzioni agiscono</b>. In dimensione finita la domanda non si pone, perché una matrice $N\times N$ agisce su tutto $\mathbb{C}^N$ e il risultato è sempre in $\mathbb{C}^N$. Qui no: si può partire da una funzione che sta in $L^2$ e uscirne.</p>`},
  {t:'reveal', title:'Il primo controesempio: una funzione di $L^2$ la cui derivata non è in $L^2$', tag:'controesempio', steps:[
   {label:'La funzione', body:R`<p>Su $L^2[-1,1]$ si prenda $f(x)=x^{-1/4}$. Sta nello spazio: il quadrato è $|x|^{-1/2}$, che è integrabile perché l'esponente sta sopra $-1$,
   $$\int_{-1}^{1}dx\,|x|^{-1/2}=4\lt \infty.$$</p>`},
   {label:'Cosa fa $\\hat P$', body:R`<p>Derivando, $\hat Pf(x)=\dfrac{i}{4}x^{-5/4}$, che per $x\to0$ cresce come $|x|^{-5/4}$. (Le note stampano qui un segno meno; la derivata di $x^{-1/4}$ è $-\frac14x^{-5/4}$, e moltiplicata per $-i$ dà $+\frac{i}{4}x^{-5/4}$. Sul modulo quadro, che è ciò che serve, non cambia nulla.) Il suo modulo quadro va come $|x|^{-5/2}$, e ora l'esponente sta <b>sotto</b> $-1$:
   $$\int_{-1}^{1}dx\,|\hat Pf(x)|^2=\frac{1}{16}\int_{-1}^{1}\frac{dx}{|x|^{5/2}}=\infty.$$</p>`},
   {label:'La morale', body:R`<p>$f\in L^2[-1,1]$ ma $\hat Pf\notin L^2[-1,1]$: l'operatore ha <b>portato il vettore fuori dallo spazio</b>. Non è una patologia rara — è il caso generico, ed è la ragione per cui $D(\hat P)$ va dichiarato:
   $$D(\hat P)=\bigl\{f\in L^2\ \big|\ f'\in L^2\bigr\}.$$</p>`}
  ]},
  {t:'reveal', title:'Il secondo controesempio: succede anche a $\\hat X$, che non deriva niente', tag:'controesempio', steps:[
   {label:'La funzione', body:R`<p>Su $L^2(\mathbb{R})$ si prenda $f(x)=(1+x^2)^{-1/2}$. Il quadrato è $1/(1+x^2)$, la cui primitiva è l'arcotangente:
   $$\int_{-\infty}^{\infty}\frac{dx}{1+x^2}=\pi\lt \infty,$$
   quindi $f\in L^2(\mathbb{R})$.</p>`},
   {label:'Cosa fa $\\hat X$', body:R`<p>$\hat Xf(x)=x(1+x^2)^{-1/2}$, che per $|x|\to\infty$ tende a $\pm1$: non decade affatto. Il suo modulo quadro tende a $1$ e l'integrale su tutta la retta diverge. Di nuovo $\hat Xf\notin L^2(\mathbb{R})$, e il dominio giusto è
   $$D(\hat X)=\bigl\{f\in L^2(\mathbb{R})\ \big|\ xf\in L^2(\mathbb{R})\bigr\}.$$</p>`},
   {label:'Perché questo esempio conta più del primo', body:R`<p>Perché $\hat X$ <b>non deriva</b>: moltiplica e basta. Se anche un operatore così mite esce dallo spazio, allora il problema del dominio non è un accidente della derivata — è strutturale della dimensione infinita. In $\mathbb{C}^N$ moltiplicare le componenti per i numeri $1,\dots,N$ è innocuo perché i numeri sono finiti; su $L^2(\mathbb{R})$ la variabile $x$ non è limitata, e la coda di $f$ deve decadere <b>abbastanza in fretta</b> da compensarla.</p>`}
  ]},
  {t:'prosa', title:'La frase da portare all\'esame', tag:'economia', html:R`
  <p><b>Domini diversi corrispondono a operatori con proprietà diverse.</b> Nelle prove questo si manifesta in un modo solo, ma ricorrente: il testo dà una formula ($-i\,d/dx$, oppure $d^2/dx^2+2$) <b>e</b> un insieme di condizioni al bordo, e le due cose insieme sono l'operatore. Cambiando le condizioni al bordo cambiano l'auto-aggiunzione (tappa 02) e lo spettro (tappa 05) — e l'esame chiede esattamente quelle due cose.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`$\hat P$ e $\hat X$ hanno lo stesso dominio?`,
    a:R`No, e non c'è ragione perché l'abbiano: $D(\hat P)$ chiede che la <b>derivata</b> sia a quadrato sommabile, $D(\hat X)$ che lo sia $xf$. La funzione $x^{-1/4}$ su $[-1,1]$ sta in $D(\hat X)$ e non in $D(\hat P)$; una funzione liscia che decade come $1/|x|$ all'infinito sta in $D(\hat P)$ e non in $D(\hat X)$. Quando si scrive $\hat X\hat P$ bisogna quindi stare nell'intersezione — ed è il motivo tecnico per cui il commutatore della tappa 03 si calcola su funzioni di prova regolari e a decrescenza rapida, cioè sullo spazio di Schwartz di me-09.`},
   {q:R`In dimensione finita, perché non si parlava mai di dominio?`,
    a:R`Perché una matrice $N\times N$ manda $\mathbb{C}^N$ in $\mathbb{C}^N$ e non c'è niente da verificare: il dominio è sempre tutto lo spazio, sempre lo stesso, e quindi non distingue nulla. Tutta la ricchezza di questo movimento è la comparsa di un secondo dato — il dominio — accanto alla formula.`}
  ]}
]},

/* ---------------- 02 · SIMMETRICO CONTRO AUTO-AGGIUNTO ---------------- */
{ num:'02', title:'Aggiunto, simmetrico, auto-aggiunto: la distinzione che l\'esame chiede', meta:'note §7.B · Calogero §4.2 · il termine di bordo · Dirichlet contro periodiche',
  blocchi:[
  {t:'prosa', title:'Le tre definizioni, nell\'ordine in cui vanno tenute', tag:'definizione', html:R`
  <p>L'<b>aggiunto</b> si definisce come in dimensione finita (me-07), spostando l'operatore da un lato all'altro del prodotto scalare:
  $$\langle f|A g\rangle=\langle A^\dagger f|g\rangle\qquad \forall f\in D(A^\dagger),\ g\in D(A).$$
  La differenza è che adesso $D(A)$ e $D(A^\dagger)$ <b>sono due insiemi, e non è detto che coincidano</b>. Di qui le due nozioni che in dimensione finita collassano in una:</p>
  <ul>
  <li>$A$ è <b>simmetrico</b> se $\langle Af|g\rangle=\langle f|Ag\rangle$ per ogni $f,g\in D(A)$;</li>
  <li>$A$ è <b>auto-aggiunto</b> (o hermitiano, e nel corso i due termini sono sinonimi) se è simmetrico <i>e inoltre</i> i suoi due domini, quello di $A$ e quello di $A^\dagger$, sono lo stesso insieme.</li>
  </ul>
  <p>Detta operativamente: essere simmetrico significa che la relazione vale sulle funzioni del dominio; essere auto-aggiunto significa in più che <b>non c'è nessuna funzione fuori dal dominio per cui la relazione continuerebbe a valere</b>. Il dominio è già il più grande possibile. È questa seconda metà che le prove chiedono di verificare, ed è quella che si dimentica.</p>`},
  {t:'reveal', title:'Dove nasce la differenza: il termine di bordo, in una riga', tag:'derivazione', steps:[
   {label:'Il conto, che è sempre lo stesso', body:R`<p>Per $\hat P=-i\,d/dx$ su $L^2[a,b]$, integrando per parti:
   $$\langle \hat Pg|f\rangle=\int_a^b dx\,\Bigl(-i\frac{dg}{dx}\Bigr)^{\!*}f=\Bigl[i\,g^*(x)f(x)\Bigr]_a^b+\int_a^b dx\,g^*(x)\Bigl(-i\frac{df}{dx}\Bigr)=i\bigl(g^*(b)f(b)-g^*(a)f(a)\bigr)+\langle g|\hat Pf\rangle.$$</p>`},
   {label:'Cosa dice il conto', body:R`<p>La simmetria vale <b>se e solo se il termine di bordo si annulla</b>. Tutto il mestiere di questa tappa è: guardare le condizioni al bordo che il testo impone, e chiedersi <i>quanto</i> serve chiedere a $g$ perché quel termine sparisca.</p>
   <p>Sulla retta intera il termine di bordo non si vede mai, perché una funzione di $L^2(\mathbb{R})$ deve annullarsi asintoticamente: è per questo che Calogero, che lavora su $-\infty\lt x\lt\infty$, dimostra direttamente che $D=d/dx$ è <b>antihermitiano</b> ($D^\dagger=-D$) e quindi che $\hat P=-iD$ è hermitiano. Le due trattazioni non si contraddicono: Calogero sceglie lo spazio in cui il bordo non c'è, Esposito guarda cosa succede quando c'è.</p>`}
  ]},
  {t:'gram', title:'Lo stesso operatore, due domini, due risposte diverse', rows:[
   [R`<b>Dirichlet</b><br>$f(a)=f(b)=0$`, R`Il termine di bordo si annulla <b>per ogni $f$ del dominio, qualunque sia $g$</b>. Quindi su $g$ non serve chiedere niente: $D(\hat P^\dagger)$ è più grande di $D(\hat P)$. L'operatore è <b>simmetrico ma non auto-aggiunto</b>. Conseguenza brutale, che si vede nella tappa 06: <b>non ha spettro</b>. L'equazione agli autovalori $f_\lambda=\alpha_\lambda e^{i\lambda x}$ con $f(a)=0$ costringe $\alpha_\lambda=0$.`],
   [R`<b>Periodiche</b><br>$f(a)=f(b)$`, R`Da sola questa condizione non annulla il bordo: resta $i\,f(b)\bigl(g^*(b)-g^*(a)\bigr)$, che sparisce solo se anche $g(a)=g(b)$. Allora i due domini coincidono e l'operatore è <b>auto-aggiunto</b>. Lo spettro è discreto, $\lambda_n=2\pi n/(b-a)$, e la base delle autofunzioni è quella della <b>serie di Fourier</b>.`],
   [R`<b>Antiperiodiche</b><br>$f(b)=-f(a)$`, R`Il caso della prova del 07/07/2025: i due segni meno si moltiplicano, il termine di bordo si annulla se e solo se anche $g(b)=-g(a)$, i due domini coincidono, e l'operatore è <b>auto-aggiunto</b>. Lo spettro viene $\lambda_n=\pi(2n+1)$ su $[0,1]$: gli stessi modi di Fourier, spostati di mezzo passo.`],
   [R`<b>$\hat X$ su $\mathbb{R}$</b>`, R`Nessun bordo e nessuna derivata: $\langle \hat Xg|f\rangle=\int dx\,(xg)^*f=\int dx\,g^*(xf)=\langle g|\hat Xf\rangle$ perché $x$ è reale. E anche i due domini coincidono. <b>Auto-aggiunto</b>, senza fatica.`]
  ]},
  {t:'reveal', title:'Che la differenza non sia pedanteria: il conto che fallisce fuori dal dominio', tag:'esempio motore', steps:[
   {label:'La domanda', body:R`<p>Si può obiettare: se $\langle \hat Pf|g\rangle=\langle f|\hat Pg\rangle$ vale per le funzioni <i>buone</i>, perché preoccuparsi di quelle fuori dal dominio? Esposito risponde con un conto esplicito. Si prende $g(x)=e^{-(x-1)^2}$, che è in $D(\hat P)$, e
   $$f(x)=\frac{e^{-x^2}}{|x|^{1/4}}\in L^2(\mathbb{R}),\qquad\text{ma}\qquad f\notin D(\hat P).$$</p>`},
   {label:'Perché $f$ non è nel dominio', body:R`<p>Derivando,
   $$f'(x)=-\frac14\frac{\operatorname{sgn}(x)}{|x|^{5/4}}e^{-x^2}-\frac{2x}{|x|^{1/4}}e^{-x^2},$$
   e vicino all'origine $|f'|^2\sim|x|^{-5/2}$, non integrabile: $f'\notin L^2(\mathbb{R})$. È lo stesso meccanismo del controesempio della tappa 01, con il fattore gaussiano messo lì solo per uccidere la coda all'infinito e isolare il problema nell'origine.</p>`},
   {label:'I due prodotti scalari', body:R`<p>Il primo esiste:
   $$\langle f|\hat Pg\rangle=-i\int_{-\infty}^{\infty}dx\,\frac{e^{-x^2}}{|x|^{1/4}}\frac{d}{dx}e^{-(x-1)^2}=2i\int_{-\infty}^{\infty}dx\,\frac{x-1}{|x|^{1/4}}e^{-x^2}e^{-(x-1)^2}\lt \infty,$$
   perché l'integrando va come $|x|^{-1/4}$ nell'origine (integrabile) e decade esponenzialmente. Il secondo no: dentro $\langle \hat Pf|g\rangle$ compare
   $$-\frac{i}{4}\int_{-\infty}^{\infty}dx\,\frac{\operatorname{sgn}(x)}{|x|^{5/4}}e^{-x^2}e^{-(x-1)^2},$$
   il cui integrando si comporta come $1/|x|^{5/4}$ nell'origine e <b>non è integrabile</b>.</p>`},
   {label:'La conclusione', body:R`<p>Non è che i due numeri siano diversi: il secondo <b>non è un numero</b>. $\hat Pf$ non è un vettore dello spazio di Hilbert, e la scrittura $\langle \hat Pf|g\rangle$ perde significato come prodotto scalare. Ecco perché la clausola sull'uguaglianza dei due domini è sostanza e non forma: dice che l'insieme su cui l'operatore ha senso è <b>lo stesso</b> da entrambi i lati del prodotto scalare.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`All'esame basta mostrare che il termine di bordo si annulla?`,
    a:R`No, e questo è il punto che vale metà del voto. Mostrare che il termine di bordo si annulla per $f,g$ entrambe nel dominio dimostra la <b>simmetria</b>. Per l'auto-aggiunzione bisogna aggiungere la frase che identifica i domini: «il termine di bordo si annulla <i>solo se</i> anche $g$ soddisfa la stessa condizione, dunque i due domini coincidono». Nella soluzione ufficiale del 07/07/2025 la frase c'è, ed è esplicitamente contrapposta a «piuttosto che solamente simmetrico».`},
   {q:R`Perché l'operatore con condizioni di Dirichlet è quello «rotto» se è il caso più familiare dalla fisica?`,
    a:R`Perché familiare è $-d^2/dx^2$ con Dirichlet (la corda vibrante, la buca infinita), non $-i\,d/dx$. La derivata <b>seconda</b> produce due termini di bordo e la condizione di Dirichlet li annulla entrambi in modo simmetrico fra $f$ e $g$: quell'operatore è auto-aggiunto e ha lo spettro che tutti conoscono. È la derivata <b>prima</b>, con un solo termine di bordo, a essere schizzinosa. Conviene tenerli separati in testa: l'ordine dell'operatore decide quante condizioni al bordo servono.`}
  ]}
]},

/* ---------------- 03 · COMMUTATORE CANONICO ---------------- */
{ num:'03', title:'Unitari, e la relazione di commutazione canonica', meta:'note §7.C-D · Calogero §4.2 es. 8 · il conto della traccia · perché la MQ non entra in dimensione finita',
  blocchi:[
  {t:'prosa', title:'Unitari: niente di nuovo', tag:'definizione', html:R`
  <p>In completa analogia col caso finito-dimensionale, $U$ è <b>unitario</b> se $UU^\dagger=\mathbb{1}$, cioè $U^\dagger=U^{-1}$. Gli unitari preservano il prodotto scalare, e la dimostrazione è la stessa riga di me-07:
  $$\langle Uf|Ug\rangle=\langle f|U^\dagger Ug\rangle=\langle f|g\rangle.$$
  In fisica sono gli operatori che rappresentano <b>trasformazioni</b> (traslazioni, rotazioni, evoluzione temporale), e la conservazione del prodotto scalare è la conservazione della probabilità.</p>`},
  {t:'reveal', title:'Il commutatore di posizione e impulso, dimostrato', tag:'derivazione', steps:[
   {label:'L\'enunciato', body:R`<p>$$\bigl[\hat X,\hat P\bigr]=i\,\mathbb{1}.$$ In unità ordinarie $[\hat X,\hat P]=i\hbar$. È <b>la</b> relazione della meccanica quantistica, e qui è un teorema di due righe.</p>`},
   {label:'Il conto', body:R`<p>Si applica il commutatore a una $f$ generica, ricordando che $\hat P$ deriva <i>tutto</i> quello che ha a destra — è lì che nasce il termine in più:
   $$\bigl[\hat X,\hat P\bigr]f(x)=x\Bigl(-i\frac{df}{dx}\Bigr)-\Bigl(-i\frac{d}{dx}\Bigr)\bigl(xf(x)\bigr)=-ix\frac{df}{dx}+i\Bigl(f(x)+x\frac{df}{dx}\Bigr)=i\,f(x).$$
   I due termini con $x\,df/dx$ si cancellano, e sopravvive il pezzo prodotto dalla regola di Leibniz sul prodotto $xf$.</p>`},
   {label:'Cosa si è usato, e cosa no', body:R`<p>Non si è usata nessuna proprietà di $f$ se non la derivabilità: il risultato è un'identità fra operatori, valida sul dominio comune. È questo il senso della $\mathbb{1}$ a destra — il commutatore non è il numero $i$, è $i$ <b>volte l'identità</b>, cioè un operatore.</p>`}
  ]},
  {t:'reveal', title:'Perché questa relazione esclude la dimensione finita', tag:'argomento strutturale', steps:[
   {label:'Il conto della traccia', body:R`<p>Per qualunque coppia di matrici $A,B$ di dimensione $n\times n$ vale la ciclicità della traccia, e quindi
   $$\operatorname{Tr}[A,B]=\operatorname{Tr}(AB)-\operatorname{Tr}(BA)=0.$$</p>`},
   {label:'La contraddizione', body:R`<p>Ma la traccia del membro destro è $\operatorname{Tr}(i\,\mathbb{1}_n)=i\,n$, che è diverso da zero per ogni $n$ finito. Quindi <b>nessuna coppia di matrici finite</b> può soddisfare $[\hat X,\hat P]=i\mathbb{1}$.</p>`},
   {label:'Cosa se ne ricava', body:R`<p>Non è un tecnicismo: è la ragione per cui la meccanica quantistica di una particella <b>deve</b> vivere in uno spazio di Hilbert infinito-dimensionale. Il conto funziona perché in dimensione infinita la traccia di $\mathbb{1}$ non è un numero, e la manipolazione $\operatorname{Tr}(AB)=\operatorname{Tr}(BA)$ non è lecita per operatori non di classe traccia. L'argomento è dovuto a Wintner e Wielandt, ed è il tipo di ragionamento che vale la pena saper rifare a mente: <i>traccia di un commutatore, zero; traccia di $i\mathbb{1}$, non zero; fine</i>.</p>`}
  ]},
  {t:'prosa', title:'Un unitario che si incontra all\'esame: l\'operatore di traslazione', tag:'cucitura', html:R`
  <p>Fra gli esercizi di Calogero §4.2 ce n'è uno che sembra un giochino e invece è la chiave di un esercizio d'esame: dimostrare che
  $$e^{\alpha\frac{d}{dx}}f(x)=f(x+\alpha).$$
  La dimostrazione è la serie di Taylor letta al contrario: $e^{\alpha D}=\sum_n \alpha^nD^n/n!$, e applicata a $f$ dà $\sum_n \alpha^nf^{(n)}(x)/n!$, che è lo sviluppo di $f$ attorno a $x$ valutato in $x+\alpha$. Cioè: <b>l'esponenziale della derivata trasla</b>.</p>
  <p>Perché conta. L'esercizio 4 della prova del <b>05/05/2025</b> chiede autovalori e autovettori di $A=e^{-i\,d/dx}$, e detto così sembra un mostro. Letto con la formula qui sopra, $A$ è la traslazione di $-i$ — ma soprattutto è $A=e^{-\hat P}$ a meno di un fattore, cioè una <b>funzione dell'operatore impulso</b>. Due operatori che sono funzione l'uno dell'altro commutano, e quindi hanno le stesse autofunzioni: le onde piane. Il conto completo è nella tappa 08; il punto qui è che la scorciatoia non è un trucco d'esame, è la stessa formula $h(A)=\sum_n h(\lambda_n)|f_n\rangle\langle f_n|$ della teoria spettrale (tappa 06) letta da destra a sinistra.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`$[\hat X,\hat P]=i$: perché non $-i$?`,
    a:R`Il segno è tutto nella regola di Leibniz. $\hat P\hat X f=-i(xf)'=-i(f+xf')$, mentre $\hat X\hat Pf=-ixf'$. La differenza $\hat X\hat P-\hat P\hat X$ lascia $+if$. Se si definisse l'impulso con l'altro segno, $\hat P=+i\,d/dx$, il commutatore verrebbe $-i$: la convenzione di segno di $\hat P$ e quella del commutatore sono la stessa scelta fatta una volta sola.`},
   {q:R`Il commutatore di due operatori hermitiani è hermitiano?`,
    a:R`No: è <b>anti</b>-hermitiano. Da $(AB)^\dagger=B^\dagger A^\dagger=BA$ segue $[A,B]^\dagger=(AB-BA)^\dagger=BA-AB=-[A,B]$. È l'osservazione che rende naturale la $i$ davanti: $i[A,B]$ è hermitiano, e infatti in $[\hat X,\hat P]=i\mathbb{1}$ il membro destro è $i$ volte un operatore hermitiano, come deve essere. Lo stesso fatto ricompare nella dimostrazione di Heisenberg della tappa 04, dove $\langle C\rangle$ risulta immaginario puro.`}
  ]}
]},

/* ---------------- 04 · IL TEOREMA DI HEISENBERG ---------------- */
{ num:'04', title:'Il teorema di Heisenberg: Schwarz travestito', meta:'note §7.E · Calogero §4.9 · dimostrazione completa · le due condizioni di saturazione',
  blocchi:[
  {t:'prosa', title:'Che cos\'è, e che cosa non è', tag:'inquadramento', html:R`
  <p>Calogero è netto su questo punto e conviene ripeterlo: la disuguaglianza di Heisenberg è <b>un teorema sugli spazi di Hilbert</b>, dimostrabile nell'ambito della teoria svolta finora, e non un principio fisico. Diventa il «principio di indeterminazione» solo quando si aggiunge l'interpretazione: gli operatori sono osservabili, $\langle\cdot\rangle_\psi$ è il valor medio delle misure, e $\Delta$ è la dispersione dei risultati.</p>
  <p>Enunciato. Siano $A,B$ hermitiani su $\mathcal H$, con $[A,B]=C$. Allora per ogni $|\psi\rangle\in\mathcal H$
  $$\langle\Delta A^2\rangle_\psi\,\langle\Delta B^2\rangle_\psi\ \ge\ \frac14\bigl|\langle C\rangle_\psi\bigr|^2,\qquad \Delta A\equiv A-\langle A\rangle_\psi\mathbb{1}.$$</p>`},
  {t:'reveal', title:'La dimostrazione, in quattro mosse', tag:'derivazione', steps:[
   {label:'1 · Gli scarti hanno lo stesso commutatore', body:R`<p>$\langle A\rangle_\psi$ e $\langle B\rangle_\psi$ sono <b>numeri</b>, e i numeri commutano con tutto:
   $$[\Delta A,\Delta B]=[A-\langle A\rangle_\psi,\,B-\langle B\rangle_\psi]=[A,B]=C.$$
   Questa è la mossa che permette di lavorare con gli scarti invece che con gli operatori, senza perdere il commutatore.</p>`},
   {label:'2 · Schwarz sui due vettori spostati', body:R`<p>Si applica la disuguaglianza di Schwarz (me-06) ai vettori $\Delta A|\psi\rangle$ e $\Delta B|\psi\rangle$:
   $$\bigl\|\Delta A|\psi\rangle\bigr\|^2\,\bigl\|\Delta B|\psi\rangle\bigr\|^2\ \ge\ \bigl|\langle \Delta A\,\psi|\Delta B\,\psi\rangle\bigr|^2.$$
   Il membro sinistro è già il prodotto delle due varianze: usando l'hermiticità di $\Delta A$,
   $$\bigl\|\Delta A|\psi\rangle\bigr\|^2=\langle\psi|\Delta A^\dagger\Delta A|\psi\rangle=\langle\psi|\Delta A^2|\psi\rangle=\langle\Delta A^2\rangle_\psi.$$</p>`},
   {label:'3 · Spezzare il prodotto in parte simmetrica e antisimmetrica', body:R`<p>Ogni prodotto di operatori si scrive come anticommutatore più commutatore:
   $$\Delta A\,\Delta B=\underbrace{\tfrac12(\Delta A\Delta B+\Delta B\Delta A)}_{\text{hermitiano}}+\underbrace{\tfrac12(\Delta A\Delta B-\Delta B\Delta A)}_{\text{anti-hermitiano},\ =\,C/2}.$$
   Il primo pezzo è hermitiano, quindi il suo valor medio è <b>reale</b>; il secondo è anti-hermitiano, quindi il suo valor medio è <b>immaginario puro</b>. Il conto che lo stabilisce sta in una riga:
   $$\langle C\rangle_\psi^*=\langle\psi|(\Delta A\Delta B-\Delta B\Delta A)|\psi\rangle^*=\langle\psi|(\Delta A\Delta B-\Delta B\Delta A)^\dagger|\psi\rangle=-\langle C\rangle_\psi.$$</p>`},
   {label:'4 · Il modulo quadro si spezza, e si butta un pezzo', body:R`<p>Un numero reale e uno immaginario puro sono ortogonali nel piano complesso: il modulo quadro della somma è la somma dei moduli quadri. Quindi
   $$\langle\Delta A^2\rangle_\psi\langle\Delta B^2\rangle_\psi\ \ge\ \frac14\Bigl\{\bigl|\langle C\rangle_\psi\bigr|^2+\bigl|\langle \Delta A\Delta B+\Delta B\Delta A\rangle_\psi\bigr|^2\Bigr\}\ \ge\ \frac14\bigl|\langle C\rangle_\psi\bigr|^2,$$
   dove l'ultimo passaggio butta via un termine non negativo. <b>Le due disuguaglianze usate sono esattamente le due condizioni di saturazione</b>, e il passo successivo le legge.</p>`}
  ]},
  {t:'prosa', title:'Il caso $\\hat X,\\hat P$, e quando vale l\'uguale', tag:'conseguenze', html:R`
  <p>Con $A=\hat X$, $B=\hat P$ e $C=i\mathbb{1}$ si ha $\langle C\rangle_\psi=i$ per <b>qualunque</b> stato normalizzato, e il teorema diventa il risultato celebre
  $$\sigma_X\,\sigma_P\ \ge\ \frac12\qquad(\hbar=1),$$
  con $\sigma_X=\sqrt{\langle\Delta\hat X^2\rangle_\psi}$ e $\sigma_P=\sqrt{\langle\Delta\hat P^2\rangle_\psi}$. Che il membro destro non dipenda dallo stato è una peculiarità del commutatore canonico: per $\hat L_x$ e $\hat L_y$, dove $C=i\hat L_z$, il limite inferiore <b>dipende</b> dallo stato, e può essere nullo.</p>
  <p>L'uguaglianza vale se e solo se cadono entrambe le disuguaglianze usate nella dimostrazione:</p>
  <ul>
  <li>$\Delta A|\psi\rangle$ e $\Delta B|\psi\rangle$ sono <b>linearmente dipendenti</b> (è il caso di uguaglianza in Schwarz);</li>
  <li>$\langle \Delta A\Delta B+\Delta B\Delta A\rangle_\psi=0$, cioè l'anticommutatore ha valor medio nullo.</li>
  </ul>
  <p>Calogero aggiunge l'avvertenza che si dimentica: la dimostrazione assume implicitamente che $|\psi\rangle$ <b>non sia autostato</b> né di $A$ né di $B$, altrimenti uno dei due vettori è identicamente nullo e la disuguaglianza si riduce a $0\ge0$, vera e vuota.</p>`},
  {t:'esercizio', title:'La gaussiana satura Heisenberg', src:'Set 2 di Caprini-Esposito, esercizio 9 · Calogero §4.9 esercizio 2',
   testo:R`Data $\psi(x)=\sqrt{\dfrac{\alpha}{\sqrt\pi}}\,e^{-\frac12\alpha^2(x-x_0)^2+ip_0x}$, si verifichi che $\langle\Delta \hat X^2\rangle_\psi\langle\Delta \hat P^2\rangle_\psi=\frac14$, e si controlli che $\Delta \hat X|\psi\rangle$ e $\Delta \hat P|\psi\rangle$ sono linearmente dipendenti.`,
   steps:[
    {label:'Perché questo stato e non un altro', body:R`<p>È il <b>pacchetto d'onda gaussiano</b>: centrato in $x_0$ nello spazio delle posizioni, centrato in $p_0$ in quello degli impulsi, con larghezze $1/(\sqrt2\alpha)$ e $\alpha/\sqrt2$. Il parametro $\alpha$ scambia precisione in posizione con precisione in impulso, e il prodotto resta fisso: è la disuguaglianza vista come <b>bilancia</b>.</p>`},
    {label:'I quattro valori medi', body:R`<p>Tutti e quattro sono integrali gaussiani. La normalizzazione è già $1$, e vengono
    $$\langle \hat X\rangle=x_0,\qquad \langle \hat X^2\rangle=x_0^2+\frac{1}{2\alpha^2},\qquad \langle \hat P\rangle=p_0,\qquad \langle \hat P^2\rangle=p_0^2+\frac{\alpha^2}{2}.$$
    Il fattore $e^{ip_0x}$ non tocca $|\psi|^2$, quindi non entra nei momenti di $\hat X$; entra invece in quelli di $\hat P$, ed è lui a spostare il centro dell'impulso da $0$ a $p_0$.</p>`},
    {label:'Le varianze e il prodotto', body:R`<p>$$\langle\Delta \hat X^2\rangle=\langle \hat X^2\rangle-\langle \hat X\rangle^2=\frac{1}{2\alpha^2},\qquad \langle\Delta \hat P^2\rangle=\langle \hat P^2\rangle-\langle \hat P\rangle^2=\frac{\alpha^2}{2},$$
    e il prodotto vale $\frac{1}{2\alpha^2}\cdot\frac{\alpha^2}{2}$, cioè esattamente $\frac14$: la gaussiana <b>satura</b>.</p>`},
    {label:'La dipendenza lineare, che spiega il perché', body:R`<p>Applicando gli scarti alla funzione:
    $$\Delta \hat X\,\psi=(x-x_0)\psi,\qquad \Delta \hat P\,\psi=\bigl(-i\partial_x-p_0\bigr)\psi=i\alpha^2(x-x_0)\psi.$$
    I due vettori sono proporzionali, col fattore $i\alpha^2$: è <b>la</b> condizione di Schwarz. E poiché il fattore è immaginario puro, anche il valor medio dell'anticommutatore si annulla. Le due condizioni di saturazione non sono due accidenti, sono la stessa proprietà della gaussiana guardata due volte.</p>
    <p>Conseguenza da tenere per la MQ: gli <b>stati coerenti</b> dell'oscillatore armonico sono esattamente le funzioni che saturano Heisenberg, e la loro forma gaussiana non è un caso — è ciò che la condizione di proporzionalità $\Delta \hat P\psi\propto\Delta \hat X\psi$ impone risolvendola come equazione differenziale del primo ordine.</p>`}
   ]}
]},

/* ---------------- 05 · LO SPETTRO IN DIMENSIONE INFINITA ---------------- */
{ num:'05', title:'Spettro discreto, continuo, e la loro ortonormalità', meta:'note §8 · Calogero §4.10 · autofunzioni che non stanno nello spazio',
  blocchi:[
  {t:'prosa', title:'Tre tipi di spettro, e perché in dimensione finita ce n\'era uno solo', tag:'architettura', html:R`
  <p>In dimensione finita lo spettro di una matrice è l'insieme delle radici del polinomio caratteristico: una lista finita di numeri, ciascuno con i suoi autovettori dentro lo spazio. In dimensione infinita l'insieme si arricchisce, e le note distinguono due casi (tre, a essere precisi, ma il terzo — lo spettro residuo — il corso non lo tratta):</p>
  <ul>
  <li><b>Spettro discreto.</b> Una famiglia numerabile di autovalori $\lambda_n\in\mathbb{C}$ con autofunzioni <i>vere</i>, $|f_n\rangle\in\mathcal H$ e non nulle: $A|f_n\rangle=\lambda_n|f_n\rangle$.</li>
  <li><b>Spettro continuo.</b> L'equazione $A|f_\lambda\rangle=\lambda|f_\lambda\rangle$ ha soluzione, ma la soluzione <b>non appartiene a $\mathcal H$</b>: è tipicamente una distribuzione definita su $\mathcal S(\mathbb{R})$ (me-09), oppure una funzione di $L^2_{\rm loc}$ ma non di $L^2$.</li>
  </ul>
  <p>L'esempio da tenere in testa è l'onda piana $e^{ikx}$: risolve $\hat Pf=kf$ per ogni $k$ reale, ha modulo costante, e $\int_{\mathbb{R}}dx\,|e^{ikx}|^2=\infty$. <b>Non è un vettore dello spazio.</b> Eppure è il mattone con cui si costruisce ogni funzione di $L^2(\mathbb{R})$ — è la trasformata di Fourier, ed è il contenuto della tappa 06.</p>`},
  {t:'gram', title:'Le tre relazioni di ortonormalità nel caso misto', rows:[
   [R`$\langle f_n|f_m\rangle=\delta_{nm}$`, R`Fra autofunzioni <b>discrete</b>: la delta di Kronecker di sempre, e l'integrale è un numero.`],
   [R`$\langle f_n|f_\lambda\rangle=0$`, R`Fra una discreta e una continua: sono sempre ortogonali. È il fatto che permette di trattare le due parti dello spettro separatamente.`],
   [R`$\langle f_\lambda|f_{\lambda'}\rangle=\delta(\lambda-\lambda')$`, R`Fra due <b>continue</b>: non un numero, ma una <b>distribuzione</b> in $\lambda-\lambda'$, da intendersi sotto il segno di integrale in $\lambda$. Qui la $\delta$ di me-09 non è un'analogia: è il solo modo in cui la scrittura ha senso.`]
  ]},
  {t:'reveal', title:'L\'onda piana come limite di funzioni vere: il conto di regolarizzazione', tag:'derivazione', steps:[
   {label:'Il problema', body:R`<p>Dire «$e^{ikx}$ è autofunzione di $\hat P$ con autovalore $k$» è scorretto se preso alla lettera, perché $e^{ikx}\notin L^2(\mathbb{R})$ e $\hat P$ è definito su $L^2$. Il modo onesto di dirlo è: esiste una successione di funzioni <b>vere</b> che diventa autofunzione nel limite.</p>`},
   {label:'La regolarizzatrice gaussiana', body:R`<p>Si smorza l'onda con una gaussiana larga $\Sigma$:
   $$f_\Sigma(x)=e^{-x^2/2\Sigma^2}\frac{e^{ikx}}{\sqrt{2\pi}}\in L^2(\mathbb{R}).$$
   Applicando $\hat P$ e sottraendo $k f_\Sigma$, il pezzo $k$ si cancella e resta solo ciò che la gaussiana ha aggiunto:
   $$\hat Pf_\Sigma-kf_\Sigma=i\frac{x}{\Sigma^2}f_\Sigma.$$</p>`},
   {label:'La norma dello scarto tende a zero', body:R`<p>$$\bigl\|\hat Pf_\Sigma-kf_\Sigma\bigr\|^2=\int_{-\infty}^{\infty}dx\,\frac{x^2}{\Sigma^4}\frac{e^{-x^2/\Sigma^2}}{2\pi}=\frac{1}{4\sqrt\pi\,\Sigma}\ \xrightarrow[\Sigma\to\infty]{}\ 0.$$
   Nel limite $\Sigma\to\infty$ la funzione $f_\Sigma$ diventa autofunzione di $\hat P$ con autovalore $k\in\mathbb{R}$, nel senso della norma di $L^2$.</p>
   <p><b>Nota sulla fonte.</b> Nelle note il risultato di questo integrale compare come $1/(4\sqrt\pi\,\Sigma^3)$. Il conto — $\int dx\,x^2e^{-x^2/\Sigma^2}=\frac{\sqrt\pi}{2}\Sigma^3$, diviso $2\pi\Sigma^4$ — dà $\Sigma$ al denominatore alla prima potenza. La conclusione non cambia di una virgola (entrambe le espressioni tendono a zero), ma il numero scritto qui è quello giusto, ed è asserito nel blocco di controllo di questo nucleo.</p>`},
   {label:'L\'ortonormalità, con la stessa tecnica', body:R`<p>Anche $\langle f_k|f_q\rangle$ si calcola regolarizzando, stavolta con $e^{-\epsilon x^2}$:
   $$\int_{-\infty}^{\infty}dx\,e^{-i(k-q)x}\frac{e^{-\epsilon x^2}}{2\pi}=\frac{e^{-(k-q)^2/4\epsilon}}{2\sqrt\pi\sqrt\epsilon}\ \xrightarrow[\epsilon\to0^+]{}\ \delta(k-q),$$
   riconoscendo la <b>gaussiana stretta</b> che tende alla $\delta$, cioè una delle rappresentazioni viste in me-09. L'ortonormalità in senso distribuzionale non è un assioma aggiunto a mano: è il limite di un conto ordinario.</p>`}
  ]},
  {t:'prosa', title:'Da cosa dipende, in pratica, se lo spettro è discreto o continuo', tag:'economia', html:R`
  <p>All'esame la domanda «lo spettro è discreto o continuo?» si risolve quasi sempre guardando <b>due cose</b>, e Calogero §4.10 le dice in linguaggio fisico:</p>
  <ul>
  <li><b>Il dominio è limitato o le condizioni al bordo quantizzano?</b> Su $[a,b]$ con condizioni periodiche, $e^{i\lambda a}=e^{i\lambda b}$ costringe $\lambda$ a una griglia: spettro <b>discreto</b>. Sulla retta intera non c'è nessuna condizione da imporre e ogni $k$ reale passa: spettro <b>continuo</b>.</li>
  <li><b>Le soluzioni sono normalizzabili?</b> Per l'hamiltoniana $H=-\frac{1}{2m}\frac{d^2}{dx^2}+V$, se $V\to+\infty$ all'infinito la particella è confinata e le autofunzioni decadono: spettro discreto e non degenere, autofunzioni complete. Se $V\to0$, gli stati di energia <b>negativa</b> restano confinati (spettro discreto, e per un potenziale ragionevole in numero <i>finito</i>), mentre quelli di energia <b>positiva</b> oscillano fino all'infinito e non sono normalizzabili: spettro continuo. Stati legati contro stati di diffusione, ed è la stessa dicotomia di prima scritta in fisica.</li>
  </ul>
  <p>Il caso limite che chiarisce tutto è l'oscillatore armonico, $V=\frac12kx^2$: potenziale che diverge, dunque spettro puramente discreto, e infatti $E_n=\hbar\omega(n+\frac12)$ con autofunzioni $H_n(\alpha x)e^{-\alpha^2x^2/2}$ — i polinomi di Hermite di me-08, che ricompaiono qui come autofunzioni di un operatore invece che come risultato di Gram-Schmidt. Sono la stessa base ottenuta per la seconda strada.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Un'autofunzione dello spettro continuo si può normalizzare a uno?`,
    a:R`No, e il tentativo è l'errore più comune: $\int dx\,|e^{ikx}|^2$ diverge, quindi non esiste nessuna costante che la porti a norma $1$. La normalizzazione corretta è <b>alla delta</b>, $\langle f_k|f_q\rangle=\delta(k-q)$, ed è quella che fissa il fattore $1/\sqrt{2\pi}$ dell'onda piana. Operativamente: se dopo aver risolto l'equazione agli autovalori l'integrale di normalizzazione diverge, non si è sbagliato il conto — si è nello spettro continuo, e va cambiata la condizione che si impone.`},
   {q:R`Perché l'operatore impulso con condizioni di Dirichlet non ha spettro?`,
    a:R`Perché la soluzione dell'equazione agli autovalori è $f_\lambda(x)=\alpha_\lambda e^{i\lambda x}$, che non si annulla mai: imporre $f(a)=0$ obbliga $\alpha_\lambda=0$, cioè l'autofunzione nulla, che per definizione non conta. Nessun $\lambda$ sopravvive. È la conferma operativa della tappa 02: quell'operatore è <b>solo simmetrico</b>, e il teorema spettrale — che vale per gli auto-aggiunti — non gli si applica. La distinzione fra simmetrico e auto-aggiunto si vede qui, e non è pedante: decide se un operatore ha o non ha autovalori.`}
  ]}
]},

/* ---------------- 06 · IL TEOREMA SPETTRALE ---------------- */
{ num:'06', title:'Il teorema spettrale, e i tre esempi che sono tutto il resto del corso', meta:'note §8.A · base generalizzata · risoluzione dell\'identità · Fourier come caso particolare',
  blocchi:[
  {t:'prosa', title:'L\'enunciato', tag:'teorema', html:R`
  <p>Sia $A$ auto-aggiunto: coincide col proprio aggiunto, e il suo dominio e quello dell'aggiunto sono lo stesso insieme — la clausola della tappa 02, che ora si vede a cosa serviva. Allora:</p>
  <ol>
  <li>lo spettro discreto è fatto di autovalori <b>reali</b> $\lambda_n\in\mathbb{R}$, e le autofunzioni si possono prendere ortonormali;</li>
  <li>anche lo spettro continuo ha autovalori reali, e le sue autofunzioni sono distribuzioni su $\mathcal S(\mathbb{R})$, ortonormali nel senso distribuzionale;</li>
  <li>le $f_n$ e le $f_\lambda$ insieme formano una <b>base generalizzata</b>: per ogni $|f\rangle\in\mathcal H$
  $$|f\rangle=\sum_n\alpha_n|f_n\rangle+\int d\lambda\,\alpha(\lambda)|f_\lambda\rangle.$$</li>
  </ol>
  <p>La sottigliezza che vale la pena notare, perché è quella che rende il teorema non banale: $|f_\lambda\rangle\notin\mathcal H$, eppure $|f\rangle\in\mathcal H$. <b>È solo l'integrale pesato</b> $\int d\lambda\,\alpha(\lambda)|f_\lambda\rangle$ a riprodurre un elemento dello spazio: le singole onde piane no, la loro sovrapposizione sì. Chi ha in mente il pacchetto d'onda sa già di cosa si parla.</p>`},
  {t:'reveal', title:'Le tre identità che seguono, e che sono quelle che si usano', tag:'derivazione', steps:[
   {label:'I coefficienti sono proiezioni', body:R`<p>Si proietta lo sviluppo su $\langle f_n|$ e su $\langle f_\lambda|$, usando le tre relazioni di ortonormalità della tappa 05:
   $$\langle f_n|f\rangle=\sum_m\alpha_m\delta_{nm}=\alpha_n,\qquad \langle f_\lambda|f\rangle=\int d\lambda'\,\alpha(\lambda')\delta(\lambda-\lambda')=\alpha(\lambda).$$
   Cioè: i coefficienti si <b>calcolano</b>, non si indovinano, e la formula è la stessa in dimensione finita.</p>`},
   {label:'Parseval', body:R`<p>Calcolando $\langle f|f\rangle$ con lo sviluppo:
   $$\langle f|f\rangle=\sum_n|\alpha_n|^2+\int d\lambda\,|\alpha(\lambda)|^2.$$
   La norma del vettore è la norma dei suoi coefficienti — l'isomorfismo con $\ell^2$ di me-08, esteso alla parte continua. In me-10 questa stessa identità, per l'operatore impulso, prende il nome di <b>Plancherel</b>.</p>`},
   {label:'La risoluzione dell\'identità', body:R`<p>Sostituendo $\alpha_n=\langle f_n|f\rangle$ nello sviluppo si ottiene
   $$|f\rangle=\sum_n|f_n\rangle\langle f_n|f\rangle+\int d\lambda\,|f_\lambda\rangle\langle f_\lambda|f\rangle,$$
   e poiché vale per ogni $|f\rangle$, l'operatore fra le due estremità è l'identità:
   $$\sum_n|f_n\rangle\langle f_n|+\int d\lambda\,|f_\lambda\rangle\langle f_\lambda|=\mathbb{1}.$$
   È la <b>completezza</b> scritta come operatore, ed è lo strumento con cui in meccanica quantistica si inseriscono basi dentro i conti («inserisco un uno»).</p>`},
   {label:'Funzioni di un operatore', body:R`<p>Esattamente come in dimensione finita (me-07), data $h:\mathbb{R}\to\mathbb{C}$ sufficientemente regolare:
   $$h(A)=\sum_n h(\lambda_n)|f_n\rangle\langle f_n|+\int d\lambda\,h(\lambda)|f_\lambda\rangle\langle f_\lambda|.$$
   Applicare una funzione a un operatore significa applicarla ai suoi autovalori e lasciare stare gli autovettori. È la formula che rende immediato l'esercizio del 05/05/2025 sulla traslazione, e in MQ è quella che definisce $e^{-iHt}$.</p>`}
  ]},
  {t:'gram', title:'I tre esempi del teorema, che sono tre pezzi di programma', rows:[
   [R`<b>$\hat P$ su $L^2[a,b]$</b><br>periodiche<br><i>→ serie di Fourier</i>`, R`$-if_\lambda'=\lambda f_\lambda$ dà $f_\lambda=\alpha_\lambda e^{i\lambda x}$; la condizione $f(a)=f(b)$ impone $e^{i\lambda(a-b)}=1$, cioè $\lambda_n=\frac{2\pi n}{b-a}$ con $n\in\mathbb{Z}$. Spettro <b>puramente discreto</b>, autofunzioni normalizzate $f_n(x)=\frac{1}{\sqrt{b-a}}e^{i2\pi nx/(b-a)}$, ortonormali per calcolo diretto. Il teorema spettrale dice allora che ogni $f\in L^2[a,b]$ si sviluppa su quelle: <b>è la serie di Fourier</b>, e non ci sarebbe bisogno di dimostrarla di nuovo in me-10.`],
   [R`<b>$\hat P$ su $L^2(\mathbb{R})$</b><br><i>→ trasformata di Fourier</i>`, R`Nessuna condizione al bordo: la soluzione formale $f_k(x)=e^{ikx}/\sqrt{2\pi}$ non è in $L^2(\mathbb{R})$ e va intesa come distribuzione (tappa 05). Il teorema spettrale dà $f(x)=\int_{-\infty}^{\infty}\frac{dk}{\sqrt{2\pi}}e^{ikx}\alpha(k)$, che è <b>precisamente la trasformata di Fourier inversa</b>, con $\alpha(k)=\langle f_k|f\rangle$ la trasformata diretta. Fourier non è un capitolo a parte: è il teorema spettrale dell'impulso sulla retta.`],
   [R`<b>$\hat X$ su $L^2(\mathbb{R})$</b><br><i>→ la $\delta$, e una tautologia</i>`, R`$xf_\lambda(x)=\lambda f_\lambda(x)$ obbliga $f_\lambda$ ad annullarsi ovunque tranne in $x=\lambda$: l'unica soluzione è la distribuzione $f_\lambda(x)=\delta(x-\lambda)$, e infatti $x\,\delta(x-\lambda)=\lambda\,\delta(x-\lambda)$ è un'identità nota di me-09. Lo sviluppo spettrale diventa $f(x)=\int d\lambda\,\langle f_\lambda|f\rangle\,\delta(x-\lambda)=f(x)$: una <b>tautologia</b>. Ed è giusto che lo sia — lavorare nella base della posizione significa scrivere la funzione d'onda come funzione di $x$, cioè non fare niente.`]
  ]},
  {t:'prosa', title:'Il senso della tabella', tag:'sintesi', html:R`
  <p>Le tre righe non sono tre esempi: sono <b>le due rappresentazioni della meccanica quantistica e il ponte fra loro</b>. La base della posizione ($\hat X$) è quella in cui lo stato si scrive $\psi(x)$; la base dell'impulso ($\hat P$ su $\mathbb{R}$) è quella in cui si scrive $\tilde\psi(k)$; il passaggio fra le due è la trasformata di Fourier, ed è la ragione strutturale per cui posizione e impulso non si possono affinare insieme — sono legate da una trasformata, e una trasformata stretta ha immagine larga. Heisenberg (tappa 04) e la tabella qui sopra dicono la stessa cosa in due lingue.</p>`}
]},

/* ---------------- 07 · IL MOMENTO ANGOLARE ORBITALE ---------------- */
{ num:'07', title:'Il momento angolare orbitale: l\'esempio in cui tutto l\'apparato produce numeri', meta:'note §9 · algebra su(2) · coordinate sferiche · gli interi che escono dalla periodicità',
  blocchi:[
  {t:'prosa', title:'La definizione, e perché le componenti sono hermitiane', tag:'costruzione', html:R`
  <p>Su $L^2(\mathbb{R}^3)$ si prendono gli operatori vettoriali $\hat{\mathbf P}f=-i\nabla f$ e $\hat{\mathbf X}f=\mathbf xf$, e si definisce il momento angolare in completa analogia col caso classico:
  $$\hat{\mathbf L}=\hat{\mathbf X}\times\hat{\mathbf P}=-i\,\mathbf x\times\nabla,\qquad\text{per componenti}\quad \hat L_i=\varepsilon_{ijk}\hat X_j\hat P_k.$$
  L'hermiticità di ciascuna componente non è ovvia — è il prodotto di due operatori hermitiani, e quello in generale non è hermitiano — ma il conto si chiude grazie all'antisimmetria di $\varepsilon$:
  $$\hat L_i^\dagger=\varepsilon_{ijk}(\hat X_j\hat P_k)^\dagger=\varepsilon_{ijk}\hat P_k^\dagger\hat X_j^\dagger=\varepsilon_{ijk}\hat P_k\hat X_j=\varepsilon_{ijk}\bigl(\hat X_j\hat P_k-i\delta_{jk}\bigr)=\hat L_i,$$
  perché $\varepsilon_{ijj}=0$: la contrazione di un tensore antisimmetrico con uno simmetrico è nulla. <b>Il termine che il commutatore canonico produce viene ucciso dall'antisimmetria</b>, ed è per questo che il prodotto incrociato $\hat X_j\hat P_k$ con $j\ne k$ è innocuo mentre $\hat X\hat P$ non lo sarebbe.</p>`},
  {t:'reveal', title:'L\'algebra: le tre componenti non commutano', tag:'derivazione', steps:[
   {label:'Il conto su una coppia', body:R`<p>Con $\hat L_x=-i(y\partial_z-z\partial_y)$ e $\hat L_y=-i(z\partial_x-x\partial_z)$, applicando il commutatore a una $f$ e usando Leibniz su ogni termine (i termini in cui la derivata cade su una coordinata indipendente si annullano, $\partial_zy=\partial_zx=0$), tutti i pezzi con derivate seconde si cancellano a coppie e resta
   $$[\hat L_x,\hat L_y]f=(x\partial_y-y\partial_x)f=i\hat L_zf.$$</p>`},
   {label:'La forma generale', body:R`<p>$$[\hat L_i,\hat L_j]=i\sum_{k}\varepsilon_{ijk}\hat L_k,$$
   che è <b>l'algebra $\mathfrak{su}(2)$</b>. La conseguenza fisica è immediata via Heisenberg: due componenti diverse del momento angolare non sono simultaneamente misurabili, e il limite inferiore $\frac14|\langle \hat L_z\rangle|^2$ dipende dallo stato.</p>`},
   {label:'Ma il modulo quadro commuta con tutte', body:R`<p>Si mostra (è l'esercizio che le note lasciano) che
   $$[\hat L^2,\hat L_i]=0\qquad\forall i,$$
   dove $\hat L^2$ è la somma dei quadrati delle tre componenti, $\hat L_x^2+\hat L_y^2+\hat L_z^2$.
   Dunque $\hat L^2$ e <b>una</b> componente — per convenzione $\hat L_z$ — sono compatibili e si diagonalizzano simultaneamente (me-07): si cercano le funzioni che sono autofunzioni di entrambi. Quelle funzioni sono le armoniche sferiche.</p>`}
  ]},
  {t:'reveal', title:'In coordinate sferiche, dove il conto diventa fattibile', tag:'derivazione', steps:[
   {label:'Il gradiente sferico', body:R`<p>$$\nabla=\hat{\mathbf r}\,\partial_r+\frac{\hat{\boldsymbol\theta}}{r}\partial_\theta+\frac{\hat{\boldsymbol\varphi}}{r\sin\theta}\partial_\varphi,\qquad \mathbf x=r\,\hat{\mathbf r}.$$
   Usando $\hat{\mathbf r}\times\hat{\mathbf r}=0$, $\hat{\mathbf r}\times\hat{\boldsymbol\theta}=\hat{\boldsymbol\varphi}$ e $\hat{\mathbf r}\times\hat{\boldsymbol\varphi}=-\hat{\boldsymbol\theta}$, il termine radiale sparisce del tutto:
   $$\hat{\mathbf L}=-i\,\mathbf x\times\nabla=-i\Bigl[\hat{\boldsymbol\varphi}\,\partial_\theta-\frac{\hat{\boldsymbol\theta}}{\sin\theta}\partial_\varphi\Bigr].$$
   <b>Il momento angolare non contiene $\partial_r$</b>: agisce solo sugli angoli, ed è la ragione per cui in un potenziale centrale la parte angolare e quella radiale si separano.</p>`},
   {label:'$\\hat L_z$, e da lì gli interi', body:R`<p>Proiettando lungo $\hat{\mathbf z}=\cos\theta\,\hat{\mathbf r}-\sin\theta\,\hat{\boldsymbol\theta}$ si ottiene la formula più usata di tutto il capitolo:
   $$\hat L_z=-i\,\partial_\varphi.$$
   L'equazione agli autovalori è $-i\psi_\lambda'(\varphi)=\lambda\psi_\lambda(\varphi)$, cioè $\psi_\lambda(\varphi)=Ne^{i\lambda\varphi}$. Ma $\varphi$ è un <b>angolo</b>, e la funzione deve essere periodica, $\psi(\varphi+2\pi)=\psi(\varphi)$:
   $$e^{2\pi i\lambda}=1\ \Longrightarrow\ \lambda=m\in\mathbb{Z}.$$
   La normalizzazione fissa $N$: $|N|^2\int_0^{2\pi}d\varphi=2\pi|N|^2=1$, dunque
   $$\psi_m(\varphi)=\frac{1}{\sqrt{2\pi}}e^{im\varphi}.$$</p>
   <p><b>Questo è il punto di tutto il movimento visto in un caso.</b> La quantizzazione del momento angolare non è un postulato: è la condizione al bordo — qui la periodicità dell'angolo — che sceglie un sottoinsieme discreto degli autovalori. Identico meccanismo dell'impulso su $[a,b]$ con condizioni periodiche (tappa 06): stesso operatore, stessa condizione, stessa griglia di interi.</p>`},
   {label:'$\\hat L^2$, e dove va a finire', body:R`<p>Applicando due volte $\hat{\mathbf L}$ e derivando i versori sferici ($\partial_\theta\hat{\boldsymbol\theta}=-\hat{\mathbf r}$, $\partial_\varphi\hat{\boldsymbol\varphi}=-\sin\theta\,\hat{\mathbf r}-\cos\theta\,\hat{\boldsymbol\theta}$, $\partial_\varphi\hat{\boldsymbol\theta}=\cos\theta\,\hat{\boldsymbol\varphi}$) si arriva alla forma compatta
   $$\hat L^2=-\Bigl[\frac{1}{\sin\theta}\partial_\theta\bigl(\sin\theta\,\partial_\theta\bigr)+\frac{1}{\sin^2\theta}\partial_\varphi^2\Bigr].$$
   È <b>esattamente</b> la parte angolare del laplaciano: $\nabla^2=\frac{1}{r^2}\partial_r(r^2\partial_r)-\hat L^2/r^2$. Le sue autofunzioni simultanee con $\hat L_z$ sono le <b>armoniche sferiche</b> $Y_\ell^m(\theta,\varphi)$, con
   $$\hat L^2Y_\ell^m=\ell(\ell+1)Y_\ell^m,\qquad \hat L_zY_\ell^m=m\,Y_\ell^m,\qquad \ell=0,1,2,\dots,\quad m=-\ell,\dots,\ell.$$</p>`}
  ]},
  {t:'prosa', title:'Fin dove arriva il corso, e dove continua', tag:'confine dichiarato', html:R`
  <p>Le note di Caprini ed Esposito si fermano qui: le armoniche sferiche sono <b>nominate</b> come autofunzioni simultanee, e non costruite. Questo nucleo fa lo stesso, e lo dichiara invece di lasciarlo intendere. Chi vuole il pezzo mancante lo trova dove il programma lo mette davvero:</p>
  <ul>
  <li>la <b>costruzione algebrica</b> ($\hat L_\pm=\hat L_x\pm i\hat L_y$, lo spettro $\ell(\ell+1)$ dedotto dagli operatori di salita e discesa) è materia di Meccanica Quantistica, e Calogero ne dà un cenno nel capitolo 3 fra gli esempi di operatori;</li>
  <li>la <b>costruzione analitica</b> passa dai polinomi associati di Legendre, $Y_\ell^m\propto P_\ell^m(\cos\theta)e^{im\varphi}$, cioè dalla famiglia di me-08 vista in $\cos\theta$ invece che in $x$. È il punto in cui i polinomi ortogonali del modulo di analisi funzionale si saldano con l'atomo di idrogeno.</li>
  </ul>
  <p>Due autofunzioni concrete valgono più di un elenco, e sono verificate nel blocco di controllo: $Y_1^0\propto\cos\theta$ ha $\hat L^2Y=2Y$ (cioè $\ell=1$, $\ell(\ell+1)=2$) e $\hat L_zY=0$; $Y_2^1\propto\sin\theta\cos\theta\,e^{i\varphi}$ ha $\hat L^2Y=6Y$ ($\ell=2$) e $\hat L_zY=1\cdot Y$ ($m=1$). Applicare l'operatore differenziale a queste due e ritrovare $2$ e $6$ è il modo più rapido di convincersi che la formula di $\hat L^2$ sopra è quella giusta.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Perché si diagonalizzano $\hat L^2$ e $\hat L_z$, e non $\hat L_x$ e $\hat L_y$ insieme?`,
    a:R`Perché $[\hat L_x,\hat L_y]=i\hat L_z\ne0$: non sono compatibili, e per me-07 due operatori che non commutano non ammettono in generale una base comune di autovettori. $\hat L^2$ invece commuta con tutte e tre, quindi si può accoppiare a <b>una</b> componente qualsiasi; la scelta di $z$ è pura convenzione, e si vede dal fatto che $\hat L_z=-i\partial_\varphi$ è la più semplice nelle coordinate scelte — ma è la scelta delle coordinate ad averla resa semplice.`},
   {q:R`Da dove viene il fatto che $m$ è intero, e non da dove viene $\ell$?`,
    a:R`$m$ intero viene dalla <b>periodicità in $\varphi$</b>, ed è il conto fatto qui sopra: due righe, nessuna algebra. Il vincolo su $\ell$ — intero non negativo, con $|m|\le\ell$ — richiede invece lo studio dell'equazione in $\theta$ (regolarità ai poli $\theta=0,\pi$) oppure l'argomento algebrico con gli operatori di salita, e nessuno dei due sta in queste note. Sapere <i>quale</i> dei due fatti si è dimostrato e quale si è citato è parte di ciò che questo nucleo deve lasciare.`}
  ]}
]},

/* ---------------- 08 · PALESTRA ---------------- */
{ num:'08', title:'Palestra: i tre esercizi d\'esame di questo movimento', meta:'07/07/2025 n.3 · 20/01/2025 n.4 · 05/05/2025 n.4 · le tre forme in cui il tema si presenta',
  blocchi:[
  {t:'prosa', title:'Le tre forme, e come si riconoscono', tag:'strategia', html:R`
  <p>Negli otto appelli in cui questo movimento compare, la domanda ha sempre una di tre forme, e riconoscerla in trenta secondi vale più di qualunque conto:</p>
  <ul>
  <li><b>«Si mostri che è auto-aggiunto, se ne calcolino autovalori e autovettori, si sviluppi $f$»</b> — tre punti in fila, e sono le tappe 02, 05, 06 nell'ordine. È la forma più comune e la più remunerativa: la prima parte è il conto del termine di bordo, sempre lo stesso.</li>
  <li><b>«Si trovi lo spettro dell'operatore ...»</b> con una derivata seconda e due condizioni al bordo — è un'ODE a coefficienti costanti da risolvere, e la trappola sta sempre nel <b>caso degenere</b>, cioè nel valore del parametro per cui le due radici coincidono.</li>
  <li><b>«Si trovino autovalori e autovettori di $e^{\text{qualcosa}}$»</b> — non si risolve nessuna equazione: si riconosce che l'operatore è <b>funzione</b> di un altro di cui si conosce lo spettro, e si applica $h(A)$.</li>
  </ul>`},
  {t:'esercizio', title:'Auto-aggiunzione, spettro e sviluppo per $-i\\,d/dx$ antiperiodico', src:'prova del 07/07/2025, esercizio 3 (7 punti)',
   testo:R`Si consideri $A=-i\dfrac{d}{dx}$ sul dominio $D(A)=\bigl\{(f,f')\in L^2[0,1],\ f\in C[0,1]\bigr\}$ con la condizione al bordo $f(1)=-f(0)$. (3.1) Si mostri che $A$ è auto-aggiunto su $L^2[0,1]$. (3.2) Se ne calcolino autovettori e autovalori. (3.3) Si sviluppi $f(x)=1$ nella base ortonormale degli autovettori.`,
   steps:[
    {label:'3.1 · Il termine di bordo, e la frase che vale il punto', body:R`<p>Integrando per parti in $L^2[0,1]$:
    $$\langle f|Ag\rangle=\int_0^1dx\,f^*(x)\Bigl(-i\frac{dg}{dx}\Bigr)=\Bigl[-i\,f^*g\Bigr]_0^1+\int_0^1dx\,\Bigl(-i\frac{df}{dx}\Bigr)^{\!*}g=-i\bigl(f^*(1)g(1)-f^*(0)g(0)\bigr)+\langle Af|g\rangle.$$
    Con $g(1)=-g(0)$ dal dominio e $f(1)=-f(0)$ dalla stessa condizione imposta a $f$, il termine di bordo diventa $-i\bigl((-f^*(0))(-g(0))-f^*(0)g(0)\bigr)=0$: i due segni meno si moltiplicano e i due termini si elidono.</p>
    <p>La frase che chiude: il termine si annulla <b>se e solo se</b> anche $f$ soddisfa l'antiperiodicità, dunque i due domini coincidono e l'operatore è auto-aggiunto, <i>e non solamente simmetrico</i>. Senza questa frase si è dimostrata la simmetria e basta.</p>`},
    {label:'3.2 · Gli autovalori escono dalla condizione al bordo', body:R`<p>$-if'=\lambda f$ dà $f(x)=f_0e^{i\lambda x}$ — la stessa soluzione di sempre, perché l'operatore è sempre lo stesso. La condizione $f(1)=-f(0)$ impone
    $$f_0e^{i\lambda}=-f_0\ \Longrightarrow\ e^{i\lambda}=-1\ \Longrightarrow\ \lambda_n=\pi(2n+1),\quad n\in\mathbb{Z}.$$
    <b>Gli interi dispari per $\pi$</b>: rispetto al caso periodico ($\lambda_n=2\pi n$) la griglia è la stessa spaziata di $2\pi$, ma spostata di mezzo passo. Il segno meno al bordo si è trasformato in uno spostamento dello spettro.</p>`},
    {label:'3.2b · La normalizzazione', body:R`<p>$$\langle f_n|f_m\rangle=|f_0|^2\int_0^1dx\,e^{2\pi i(m-n)x}=|f_0|^2\,\delta_{nm},$$
    perché per $n\ne m$ l'esponenziale compie un numero intero di giri e l'integrale si annulla, mentre per $n=m$ l'integrando è $1$. Dunque si può scegliere $f_0=1$: le autofunzioni sono già normalizzate. Spettro <b>discreto</b> — come deve essere su un intervallo limitato con condizioni che quantizzano.</p>`},
    {label:'3.3 · Lo sviluppo di $f=1$', body:R`<p>Poiché $A$ è auto-aggiunto, il teorema spettrale garantisce che le $\{f_n\}$ siano una base, e i coefficienti sono proiezioni:
    $$c_n=\langle f_n|1\rangle=\int_0^1dx\,e^{-i\pi(2n+1)x}=\frac{e^{-i\pi(2n+1)}-1}{-i\pi(2n+1)}=\frac{2}{i\pi(2n+1)},$$
    dove si è usato $e^{-i\pi(2n+1)}=-1$ (esponente dispari). Quindi
    $$1=\sum_{n=-\infty}^{\infty}\frac{2}{i\pi(2n+1)}\,e^{i\pi(2n+1)x}.$$</p>
    <p>Controllo di sanità che conviene fare a mente: in $x=\tfrac12$ gli esponenziali valgono $e^{i\pi(n+1/2)}=i(-1)^n$, e la serie diventa $\sum_n\frac{2(-1)^n}{\pi(2n+1)}$ — la serie di Leibniz, che somma a $1$ contando anche gli $n$ negativi. La formula regge.</p>`}
   ]},
  {t:'esercizio', title:'Lo spettro di $d^2/dx^2+2$ con Dirichlet, e la trappola del caso degenere', src:'prova del 20/01/2025, esercizio 4 (8 punti)',
   testo:R`Si trovi lo spettro dell'operatore $A=\dfrac{d^2}{dx^2}+2$, definito sul dominio delle funzioni differenziabili due volte e tali che $f(0)=f(1)=0$.`,
   steps:[
    {label:'L\'equazione agli autovalori è un\'ODE a coefficienti costanti', body:R`<p>$Af=\lambda f$ si scrive $f''+(2-\lambda)f=0$. Si cercano soluzioni esponenziali $e^{\alpha x}$ con $\alpha^2+2-\lambda=0$, cioè
    $$\alpha_\pm=\pm\sqrt{\lambda-2}.$$
    Finché $\lambda\ne2$ le due radici sono distinte e la soluzione generale è $f_\lambda(x)=A_+e^{\sqrt{\lambda-2}\,x}+A_-e^{-\sqrt{\lambda-2}\,x}$.</p>`},
    {label:'Le due condizioni al bordo', body:R`<p>Da $f_\lambda(0)=0$ segue $A_-=-A_+$. Da $f_\lambda(1)=0$ segue
    $$A_+\bigl(e^{\sqrt{\lambda-2}}-e^{-\sqrt{\lambda-2}}\bigr)=0\ \Longrightarrow\ e^{2\sqrt{\lambda-2}}=1\ \Longrightarrow\ 2\sqrt{\lambda_n-2}=2\pi ni\ \Longrightarrow\ \lambda_n=2-n^2\pi^2.$$
    Gli autovalori sono <b>reali</b>, come il teorema spettrale impone per un operatore auto-aggiunto (qui la derivata seconda con Dirichlet lo è: due termini di bordo, entrambi annullati simmetricamente), e sono tutti $\le2$.</p>`},
    {label:'La trappola: $n=0$', body:R`<p>Per $n=0$ si avrebbe $\lambda_0=2$, ma è proprio il caso escluso all'inizio: lì $\alpha_+=\alpha_-=0$, le due soluzioni esponenziali <b>degenerano</b> nella stessa, e la soluzione generale dell'ODE non è più quella scritta sopra ma
    $$f_2(x)=A+Bx.$$
    Imponendo $f_2(0)=0$ si ha $A=0$; imponendo $f_2(1)=0$ si ha $B=0$. L'autofunzione è identicamente nulla, quindi $\lambda_0=2$ <b>non appartiene allo spettro</b>:
    $$\lambda_n=2-n^2\pi^2,\qquad n\in\mathbb{Z}\setminus\{0\}.$$</p>
    <p>Questo passaggio è il motivo per cui l'esercizio vale otto punti e non quattro. La regola generale da portarsi via: quando un'ODE a coefficienti costanti ha il discriminante nullo, la seconda soluzione indipendente è la prima <b>moltiplicata per $x$</b>, e va trattata a parte. È lo stesso fatto che in me-11 governa le radici multiple dell'equazione caratteristica.</p>`}
   ]},
  {t:'esercizio', title:'Autovalori di $e^{-i\\,d/dx}$: quando non si risolve nessuna equazione', src:'prova del 05/05/2025, esercizio 4 (6 punti)',
   testo:R`Si trovino autovalori e autovettori (possibilmente nello spazio delle distribuzioni regolari) dell'operatore $A=e^{-i\frac{d}{dx}}$, definito come operatore auto-aggiunto su tutto $\mathbb{R}$.`,
   steps:[
    {label:'La mossa: $A$ è funzione di $\\hat P$', body:R`<p>Risolvere direttamente $Af=af$ sarebbe un'equazione funzionale. Invece si osserva che $A$ è costruito con $d/dx$, quindi
    $$\bigl[A,\hat P\bigr]=0.$$
    Due operatori che commutano hanno una base di autovettori comuni (me-07): gli autovettori di $A$ sono <b>gli stessi</b> di $\hat P$ sulla retta, cioè le onde piane $f_k(x)=e^{ikx}$ — da intendersi, come vuole la tappa 05, come distribuzioni regolari.</p>`},
    {label:'Gli autovalori, per serie', body:R`<p>Si espande l'esponenziale in serie di potenze e si applica all'onda piana, dove ogni derivata porta giù un $ik$:
    $$Af_k(x)=\sum_{n=0}^{\infty}\frac{(-i)^n}{n!}\frac{d^n}{dx^n}e^{ikx}=\sum_{n=0}^{\infty}\frac{(-i)^n(ik)^n}{n!}e^{ikx}=\sum_{n=0}^{\infty}\frac{k^n}{n!}e^{ikx}=e^{k}f_k(x).$$
    Lo spettro è dunque <b>continuo</b>, con autovalori $e^k$ al variare di $k\in\mathbb{R}$, cioè tutti i reali positivi.</p>`},
    {label:'Le due letture, e quale serve', body:R`<p>Il conto si può leggere in due modi, ed entrambi sono corretti: come <b>traslazione</b> ($e^{\alpha d/dx}f(x)=f(x+\alpha)$ con $\alpha=-i$, dunque $A f_k(x)=e^{ik(x-i)}=e^{k}e^{ikx}$, e si ritrova lo stesso risultato in una riga), oppure come <b>funzione dell'operatore</b> $A=h(\hat P)$ con $h(\lambda)=e^{-i\cdot i\lambda}=e^{\lambda}$, per cui $h$ agisce sugli autovalori e lascia stare gli autovettori.</p>
    <p>La seconda lettura è quella che conviene tenere, perché è la formula generale della tappa 06 e si applica a qualunque esponenziale di operatore — compreso $e^{-i\hat Ht}$, l'evoluzione temporale. Una nota di onestà: l'operatore di questo esercizio, avendo autovalori reali positivi ma non di modulo uno, <b>non è unitario</b> e la dicitura «auto-aggiunto» del testo va presa come l'indicazione di lavorare sulla retta intera senza condizioni al bordo, che è ciò che serve per la soluzione.</p>`}
   ]}
]},

/* ---------------- 09 · PROLESSI ---------------- */
{ num:'09', title:'Dove riappare, dopo', meta:'me-10 · me-11 · Meccanica Quantistica · e il resto della fisica',
  blocchi:[
  {t:'prolessi', title:'Dove riappare questo nucleo, nella fisica che farai',
   oggetto:R`<b>Gli operatori in dimensione infinita</b>: il dominio come parte dell'operatore, l'auto-aggiunzione come condizione perché lo spettro esista, il teorema spettrale con la sua parte continua, e il commutatore canonico con la sua conseguenza.`,
   rotte:[
    {dove:'Meccanica quantistica<br>(III anno, 12 CFU)', txt:R`Questo movimento <b>è</b> il formalismo di quel corso, scritto in anticipo e senza l'interpretazione. Gli stati sono vettori di $L^2$, le osservabili sono operatori auto-aggiunti, i risultati possibili di una misura sono gli autovalori — reali perché l'operatore è auto-aggiunto, ed è per questo che la clausola sull'uguaglianza dei due domini non è pedanteria ma fisica. La probabilità di ottenere $a_n$ è $|\langle a_n|\psi\rangle|^2$, cioè il modulo quadro del coefficiente dello sviluppo spettrale, e $\sum_n P_n=1$ è la risoluzione dell'identità. Heisenberg è il teorema della tappa 04 più l'interpretazione dello scarto quadratico medio come dispersione delle misure.`},
    {dove:'Analisi di Fourier<br>(me-10)', txt:R`La tabella della tappa 06 lo dice già: la serie di Fourier è il teorema spettrale per $\hat P$ su un intervallo con condizioni periodiche, la trasformata è lo stesso teorema sulla retta. Plancherel è Parseval per la parte continua dello spettro. Chi arriva a me-10 avendo capito questa tappa non deve imparare Fourier: deve solo imparare le stime di convergenza, che sono la parte che qui non c'è.`},
    {dove:'ODE ed EDP<br>(me-11, me-12)', txt:R`Il metodo di separazione delle variabili produce, per la parte spaziale, <b>sempre</b> un problema agli autovalori con condizioni al bordo: è ciò che si è fatto qui tre volte nella palestra. Le funzioni di Green (me-12) sono l'inverso di un operatore differenziale, e la loro costruzione spettrale $G=\sum_n\frac{|f_n\rangle\langle f_n|}{\lambda_n}$ è la formula $h(A)$ della tappa 06 con $h(\lambda)=1/\lambda$ — motivo per cui l'esistenza della funzione di Green dipende da se zero sta o non sta nello spettro.`},
    {dove:'Meccanica statistica<br>(III anno)', txt:R`La matrice densità $\rho=e^{-\beta H}/Z$ è una funzione di operatore, e la funzione di partizione $Z=\operatorname{Tr}e^{-\beta H}=\sum_ne^{-\beta E_n}$ è la traccia calcolata nella base spettrale di $H$ — cioè il teorema spettrale usato come strumento di calcolo. Il fatto che lo spettro sia discreto o continuo decide se si somma o si integra, ed è la differenza fra un gas confinato e uno libero.`},
    {dove:'Momento angolare<br>e atomi', txt:R`L'algebra $\mathfrak{su}(2)$ della tappa 07 è il primo esempio di algebra di Lie che si incontra, e la struttura che se ne ricava — autovalori $\ell(\ell+1)$ e $m$, con $|m|\le\ell$ — è la stessa per lo spin, dove però $\ell$ può essere semintero perché non c'è nessuna funzione d'onda periodica in $\varphi$ a imporre gli interi. Il confronto fra i due casi è il modo più veloce per capire da dove viene lo spin.`},
    {dove:'Teoria dei campi<br>e oltre', txt:R`L'osservazione della tappa 03 — $[\hat X,\hat P]=i\mathbb{1}$ non ha rappresentazioni finito-dimensionali — è il primo esempio del tipo di argomento che struttura tutta la fisica teorica moderna: si postula un'algebra di commutatori e si chiede quali spazi possano realizzarla. In teoria dei campi l'algebra canonica è fra campi e momenti coniugati, e la stessa domanda produce lo spazio di Fock.`}
   ]}
]}

/* =================================================================== */
var byId = {}; TAPPE.forEach(function(s){ byId[s.num]=s; });

var VKEY='pm-nucleome-09b-visited';
function loadSeen(){ try{ return new Set(JSON.parse(localStorage.getItem(VKEY)||'[]')); }catch(e){ return new Set(); } }
function saveSeen(s){ try{ localStorage.setItem(VKEY, JSON.stringify(Array.from(s))); }catch(e){} }
var SEEN = loadSeen();

function renderNav(active){
  var nav=document.getElementById('sidebar');
  nav.innerHTML='';
  var h=document.createElement('h2'); h.textContent='Nucleo me-09b · le tappe'; nav.appendChild(h);
  TAPPE.forEach(function(s){
    var b=document.createElement('button');
    b.className='navitem'+(active===s.num?' active':'')+(SEEN.has(s.num)?' seen':'');
    b.innerHTML='<span class="dot"></span><span class="nx">'+s.num+'</span><span>'+s.title+'</span>';
    b.onclick=function(){ showTappa(s.num); };
    nav.appendChild(b);
  });
}

/* ---- renderer dei blocchi ---- */
function sectionProsa(title, tag, html){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var body=elFromHTML('<div class="open-body">'+html+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function sectionGram(title, rows){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag gramtag">grammatica</span></h3>';
  var inner='<table class="gramtab">';
  rows.forEach(function(r){ inner+='<tr><td class="gs">'+r[0]+'</td><td>'+r[1]+'</td></tr>'; });
  inner+='</table>';
  var body=elFromHTML('<div class="gramwrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
/* --- blocco PLOT: la figura non decora, si legge. Ogni plot porta una chiave di lettura. --- */
function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';
  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
    else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
    else if(b.t==='prolessi') m.appendChild(sectionProlessi(b));
    else if(b.t==='reveal')m.appendChild(sectionReveal(b.title,b.tag,b.steps));
    else if(b.t==='esercizio') m.appendChild(sectionEsercizio(b));
    else if(b.t==='collaudo')  m.appendChild(sectionCollaudo(b.title,b.items));
    else if(b.t==='plot')      m.appendChild(sectionPlot(b));
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}

/* deep-link: me-09b-operatori-dimensione-infinita.html#03 apre direttamente la tappa 03 */
window.addEventListener('DOMContentLoaded', function(){
  var h=(location.hash||'').replace('#','');
  showTappa(byId[h]?h:'00');
});
window.addEventListener('hashchange', function(){
  var h=(location.hash||'').replace('#','');
  if(byId[h]) showTappa(h);
});
</script>
