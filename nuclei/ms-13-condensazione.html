    $$T_c=hc\left[\frac{N}{8\pi V\zeta(3)}\right]^{1/3}$$
    <p>dove il fattore $8\pi$ nasce da $4\pi\cdot2$. <b>Il controllo dimensionale</b>: $hc$ ha le dimensioni di energia per lunghezza, e la parentesi ha quelle di un inverso di lunghezza — torna. <b>Il controllo di struttura</b>: $T_c\propto n^{1/3}$, cio&egrave; $T_c\propto n^{1/\alpha}$ con $\alpha=3$, che &egrave; la regola generale. La frazione condensata vale $1-(T/T_c)^3$: parte da $T_c$ con pendenza $3$, cio&egrave; <b>il doppio</b> del caso non relativistico tridimensionale.</p>
    <p><b>Due dimensioni.</b> Con $G=2\pi A\varepsilon/(h^2c^2)$ e l&rsquo;integrale $\Gamma(2)\zeta(2)=\pi^2/6$:</p>
    $$N=\frac{2\pi A}{h^2c^2}\,T_c^2\,\frac{\pi^2}{6}$$
    <p>da cui $T_c=hc\sqrt{3N/(\pi^3A)}$, e la frazione condensata vale $1-(T/T_c)^2$. <b>Qui la pendenza in $T_c$ &egrave; $2$</b>, e l&rsquo;osservazione da fare &egrave; che il gas relativistico bidimensionale e il gas non relativistico in trappola armonica bidimensionale hanno lo <i>stesso</i> $\alpha$: stessa forma della transizione, prefattori diversi.</p>
    <p><b>La tabella degli esponenti</b>, che &egrave; la risposta compatta all&rsquo;intero esercizio: per $H=c|\vec p\,|$ si ha $\alpha=d$, quindi frazione condensata $1-(T/T_c)^d$, energia sotto la soglia $E\propto T^{d+1}$, calore specifico $C_V\propto T^d$ e valore alla soglia $C_V(T_c)/N$ pari a $d(d+1)\zeta(d+1)/\zeta(d)$. Per $d=3$ quel numero vale $12\,\zeta(4)/\zeta(3)$, cio&egrave; circa $10{,}8$, contro l&rsquo;asintoto classico $\alpha=3$: <b>il picco &egrave; molto pi&ugrave; pronunciato che nel caso non relativistico</b>, ed &egrave; il segno che per $\alpha>2$ il calore specifico sviluppa una discontinuit&agrave; vera invece di una cuspide.</p>`},
    {label:'c · La variante unidimensionale con trappola lineare', body:R`
    <p>Crisanti chiude il suggerimento con «si pu&ograve; verificare cosa accade in $D=1$ se $H=c|p|+b|q|$», e la verifica &egrave; il punto dell&rsquo;esercizio. Con $a=1$ e $b=1$ in una dimensione, la formula generale d&agrave; $\alpha=1/1+1/1=2$: <b>la condensazione esiste</b>, e in un sistema unidimensionale che senza il potenziale non condenserebbe a nessuna temperatura.</p>
    <p>Il conto esplicito &egrave; istruttivo perch&eacute; la regione di spazio delle fasi &egrave; un <b>rombo</b> invece di un cerchio. La condizione $c|p|+\gamma|q|\le\varepsilon$ definisce nel piano $(q,p)$ un quadrilatero con diagonali $2\varepsilon/c$ e $2\varepsilon/\gamma$, la cui area &egrave; met&agrave; del prodotto delle diagonali, cio&egrave; $2\varepsilon^2/(c\gamma)$. Dividendo per $h$ e derivando, $G(\varepsilon)=4\varepsilon/(hc\gamma)$, cio&egrave; <b>lineare in $\varepsilon$</b>, esattamente come il gas relativistico bidimensionale. Con l&rsquo;integrale $\Gamma(2)\zeta(2)=\pi^2/6$ si ottiene $T_c=\sqrt{3Nhc\gamma/(2\pi^2)}$ e frazione condensata $1-(T/T_c)^2$.</p>
    <p><b>Che cosa portarsi via da questo esercizio.</b> Tre sistemi completamente diversi — un gas relativistico su un piano, un gas non relativistico in una trappola armonica su un piano, un gas relativistico in una trappola lineare su una retta — hanno $\alpha=2$ e quindi <b>la stessa transizione</b>: stesso esponente della frazione condensata, stesso $\zeta(2)$, stessa struttura del calore specifico. <b>La condensazione di Bose-Einstein non sa niente della fisica del sistema: sa soltanto un esponente.</b> &Egrave; il modo pi&ugrave; economico di ricordare l&rsquo;intero movimento, e il modo pi&ugrave; rapido di risolvere un esercizio che non si &egrave; mai visto.</p>`}
   ]}
]},

/* ---------------- 10 · IL SENSO E LE ROTTE ---------------- */
{ num:'10', title:'Il senso, e le rotte', meta:'cosa lascia in mano · dove la condensazione riappare in fisica · la domanda che porta avanti',
  blocchi:[
  {t:'prosa', title:'Cosa portarsi via', tag:'sintesi', html:R`
  <p><b>Il punto.</b> Gli stati di energia non nulla di un gas di bosoni possono contenere, a temperatura e volume fissati, soltanto un numero finito di particelle; le altre non hanno dove andare se non nel livello fondamentale. Il tetto esiste perch&eacute; il potenziale chimico non pu&ograve; superare il fondo dello spettro, e questo perch&eacute; una serie geometrica deve convergere. Tutto il resto del movimento &egrave; il calcolo di quel tetto e delle sue conseguenze.</p>
  <p><b>Che cosa ricordare, in ordine di durata.</b> Che la domanda vera non &egrave; «quanto vale $T_c$» ma «$T_c$ esiste?», e che la risposta sta in un esponente: con $G(\varepsilon)\propto\varepsilon^{\alpha-1}$ vicino al fondo dello spettro, la condensazione esiste se e solo se $\alpha>1$, perch&eacute; l&rsquo;integrando si comporta come $\varepsilon^{\alpha-2}$. Che $\alpha=d/a+d/b$ per un&rsquo;hamiltoniana a potenze, con il termine $d/b$ assente per una scatola. Che da $\alpha$ seguono, senza altri conti, la frazione condensata $1-(T/T_c)^\alpha$, l&rsquo;energia $E\propto T^{\alpha+1}$, la relazione $PV=E/\alpha$, l&rsquo;entropia per particella eccitata $(\alpha+1)\zeta(\alpha+1)/\zeta(\alpha)$ e il calore specifico alla soglia $\alpha(\alpha+1)\zeta(\alpha+1)/\zeta(\alpha)$. Che nel caso di scuola — gas libero non relativistico in tre dimensioni — $\alpha=3/2$ e il criterio critico &egrave; $n\lambda^3=g_s\zeta(3/2)$, cio&egrave; «i pacchetti d&rsquo;onda cominciano a sovrapporsi». E che la pressione della fase condensata non dipende dal volume, perch&eacute; il condensato non spinge.</p>
  <p><b>La strategia d&rsquo;attacco, che &egrave; sempre la stessa.</b> Si scrive $H$ di singola particella e si trova il fondo dello spettro, spostandovi l&rsquo;origine delle energie — perch&eacute; il vincolo &egrave; $\mu\le\varepsilon_{\min}$ e non $\mu\le0$. Si calcola $G(\varepsilon)$ dalla definizione con la delta e il trucco della theta. Si legge $\alpha$ dal comportamento vicino al fondo. Si confronta con uno: se $\alpha\le1$ la risposta &egrave; «non esiste» e si motiva con la divergenza dell&rsquo;integrale, che vale l&rsquo;intero quesito. Se $\alpha>1$ si impone $z=1$, si riduce l&rsquo;integrale con $\Gamma(\alpha)\zeta(\alpha)$ e si inverte. <b>Il livello fondamentale va separato sempre</b>, anche quando risulta trascurabile: scriverlo costa una riga, dimenticarlo costa l&rsquo;esercizio.</p>
  <p><b>E una cosa che non &egrave; una formula.</b> Sette volte, in questo movimento, una fonte ha detto una cosa diversa da un&rsquo;altra o da se stessa: la convenzione su $k_B$; il fattore di spin messo dove si semplifica; due riquadri con $g_{3/2}$ al posto di $g_{5/2}$ e una temperatura di troppo; un $z/(z-1)$ per $z/(1-z)$; una $\lambda_0^3$ capovolta; una tabella di temperature che non si ricava dalla formula stampata sopra di essa; e una classificazione della transizione che il calore specifico calcolato due pagine prima contraddice. <b>Nessuno di questi difetti si vede rileggendo, e tutti si vedono con un controllo indipendente.</b> Quattro controlli sono sempre disponibili in questo campo, e costano secondi: <b>dimensionale</b> — $C_V/N$ &egrave; adimensionale, una densit&agrave; si divide per $\lambda^3$ e non si moltiplica; <b>di segno</b> — un&rsquo;occupazione non pu&ograve; essere negativa; <b>di limite</b> — ogni formula deve raccordarsi al valore classico ad alta temperatura; <b>di indipendenza</b> — una formula scritta in funzione di $T/T_c$ e $N$ non pu&ograve; contenere $g_s$, che &egrave; gi&agrave; stato consumato nella definizione di $T_c$.</p>`},
  {t:'prolessi', title:'Dove riappare questo movimento',
   oggetto:R`<b>L&rsquo;occupazione macroscopica di un singolo stato quantistico</b> — un numero di ordine $N$ di particelle nello stesso stato di singola particella, descritte da un&rsquo;unica funzione d&rsquo;onda con una fase definita — e il <b>criterio di esistenza come convergenza di un integrale</b>, cio&egrave; l&rsquo;idea che una transizione di fase possa dipendere solo da un esponente della densit&agrave; degli stati.`,
   rotte:[
    {dove:'Superfluidità<br>e l elio-4', txt:R`Sotto $2{,}18$ K l&rsquo;elio-4 liquido scorre senza viscosit&agrave;, risale le pareti del recipiente e conduce calore in modo anomalo. Il legame con questo movimento &egrave; stato proposto da London nel 1938 e resta sostanzialmente corretto: la fase superfluida &egrave; una fase condensata. Ma <b>il conto di questo movimento non basta a spiegare la superfluidit&agrave;</b>, e capire perch&eacute; &egrave; il passo successivo pi&ugrave; ricco. Un condensato ideale non &egrave; superfluido: le sue eccitazioni sono particelle libere con $\varepsilon=p^2/2m$, e a qualunque velocit&agrave; del flusso esiste un&rsquo;eccitazione che dissipa. Serve lo <b>spettro di Landau</b>, con un tratto lineare a piccoli impulsi — i fononi — che nasce dalle <i>interazioni</i>: solo allora esiste una velocit&agrave; critica sotto la quale la dissipazione &egrave; cinematicamente proibita. La frazione condensata dell&rsquo;elio-4 a temperatura nulla, misurata per diffusione di neutroni, vale circa il dieci per cento, non il cento: <b>il condensato e il superfluido non sono la stessa cosa</b>, e la frazione superfluida arriva al cento per cento mentre quella condensata resta piccola.`},
    {dove:'Atomi ultrafreddi<br>e la fisica quantistica a tavolino', txt:R`Nel 1995 Cornell, Wieman e Ketterle hanno condensato rubidio e sodio a poche centinaia di nanokelvin, con le temperature critiche calcolate nella tappa 06, e hanno preso il Nobel nel 2001. Ci&ograve; che quella tecnica ha aperto non &egrave; la verifica di questo conto — che nessuno dubitava — ma un <b>laboratorio di sistemi quantistici a molti corpi su misura</b>: l&rsquo;interazione fra gli atomi si accende e si spegne con un campo magnetico attraverso le risonanze di Feshbach, la dimensionalit&agrave; si sceglie schiacciando la trappola, e un reticolo ottico realizza un modello di Hubbard con i parametri che si vogliono. Si osservano l&rsquo;interferenza fra due condensati — la prova diretta che hanno una fase — i vortici quantizzati, il passaggio da superfluido a isolante di Mott, e la <b>termalizzazione di un sistema isolato</b>, che &egrave; la domanda aperta della meccanica statistica quantistica.`},
    {dove:'Coppie di Cooper<br>e la superconduttività', txt:R`Gli elettroni sono fermioni e non condensano, ma <b>due elettroni legati formano un bosone</b>, e questo &egrave; il meccanismo della superconduttivit&agrave;. Nella teoria BCS un&rsquo;attrazione debolissima mediata dai fononi lega elettroni di impulso e spin opposti in <b>coppie di Cooper</b>, e il condensato di quelle coppie porta la corrente senza resistenza. La parentela con questo movimento non &egrave; metaforica: il parametro d&rsquo;ordine &egrave; della stessa specie — un&rsquo;ampiezza complessa con una fase — e la rottura di simmetria &egrave; la stessa. La differenza &egrave; che le coppie sono grandi e sovrapposte, mentre gli atomi di un condensato sono puntiformi; nei gas fermionici ultrafreddi si pu&ograve; passare <b>con continuit&agrave;</b> da un regime all&rsquo;altro girando una manopola, e il passaggio BEC-BCS &egrave; oggi uno dei banchi di prova della teoria dei sistemi fortemente correlati.`},
    {dove:'Fotoni, polaritoni<br>e la materia oscura', txt:R`La condizione che questo movimento richiede — <b>un numero di particelle conservato</b> — sembrava escludere i fotoni, e per settant&rsquo;anni si &egrave; detto che un condensato di luce non esiste. Nel 2010 &egrave; stato realizzato, intrappolando la luce in una microcavit&agrave; con un colorante che la rediffonde invece di assorbirla, imponendo cos&igrave; la conservazione che la natura non fornisce. Lo stesso vale per i <b>polaritoni</b> di cavit&agrave;, met&agrave; luce e met&agrave; eccitazione elettronica, che condensano a temperature di decine di kelvin perch&eacute; la loro massa efficace &egrave; minuscola — e la formula di $T_c$ va come $1/m$. All&rsquo;estremo opposto di scala, alcuni candidati a <b>materia oscura</b> — assioni, bosoni ultraleggeri — sarebbero oggi in uno stato condensato su scale galattiche, e il criterio che si userebbe per dirlo &egrave; quello della tappa 01: confrontare la lunghezza d&rsquo;onda termica con la distanza media.`}
   ],
   domanda:R`Tutto questo movimento poggia su un&rsquo;ipotesi che non &egrave; mai stata messa in discussione: le particelle <b>non interagiscono</b>. Il risultato &egrave; sorprendentemente buono — indovina l&rsquo;esistenza della transizione, il meccanismo, l&rsquo;ordine di grandezza della temperatura — e sorprendentemente cattivo su una cosa sola: <b>gli esponenti critici</b>. Il calore specifico dell&rsquo;elio-4 non ha una cuspide finita ma una divergenza logaritmica, e la frazione condensata non si annulla con esponente uno. <b>Domanda che porti avanti:</b> perch&eacute; un&rsquo;interazione arbitrariamente debole cambia gli esponenti critici, mentre non cambia n&eacute; l&rsquo;esistenza della transizione n&eacute; la temperatura a cui avviene in modo drammatico? La risposta &egrave; una delle idee pi&ugrave; profonde della fisica del Novecento, e non &egrave; che l&rsquo;interazione sia grande: &egrave; che <b>vicino a un punto critico le fluttuazioni diventano correlate su ogni scala di lunghezza</b>, e in quel regime nessuna quantit&agrave; &egrave; piccola perch&eacute; nessuna scala &egrave; privilegiata. Gli esponenti critici non dipendono dai dettagli dell&rsquo;interazione ma solo dalla <b>dimensionalit&agrave;</b> e dalla <b>simmetria del parametro d&rsquo;ordine</b> — il gas ideale sta in una classe, l&rsquo;elio reale in un&rsquo;altra — e la macchina che lo spiega &egrave; il <b>gruppo di rinormalizzazione</b>. Capire perch&eacute; una teoria senza interazioni indovini tutto tranne gli esponenti, e quale sia esattamente il ruolo dell&rsquo;esponente $\alpha$ di questo movimento in quel linguaggio, &egrave; il punto da cui comincia la teoria moderna delle transizioni di fase.`}

function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}

}

  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    /* DUE SCHEMI, NON UNO — scoperto il 2026-10-06 provando le pagine vive. I movimenti
       scritti per primi (em-01..03, me-10b, i collaudi di gd-01..09 e di quattro em)
       usano una forma piu' semplice: `reveal` e `prolessi` con un solo `html`,
       `esercizio` e `collaudo` con `html` + `sol`. Il renderer ne conosceva una sola e
       chiamava `steps.forEach` su `undefined`: TypeError, e la tappa si fermava li' —
       62 blocchi in 17 movimenti su 74. Non si riscrive il contenuto per far contento
       il renderer: e' il renderer che deve leggere cio' che c'e'.
       E in fondo un ramo che NON muore: uno schema nuovo di domani deve far vedere un

    try{

                                   : sectionProsa(b.title,'prolessi',b.html));
      else if(b.t==='reveal')m.appendChild(b.steps ? sectionReveal(b.title,b.tag,b.steps)
                                   : sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='esercizio') m.appendChild(b.steps ? sectionEsercizio(b)
                                   : sectionSvelabile(b.title,'esercizio',b.html,b.sol));
      else if(b.t==='collaudo')  m.appendChild(b.items ? sectionCollaudo(b.title,b.items)
                                   : sectionSvelabile(b.title,'provi, poi riveli',b.html,b.sol));
      else if(b.t==='plot')      m.appendChild(sectionPlot(b));
      else m.appendChild(sectionProsa(b.title||'(blocco)', 'tipo sconosciuto: '+b.t,
                                      b.html||''));
    }catch(err){
      var avv=document.createElement('section'); avv.className='section';
      avv.innerHTML='<h3>'+(b.title||'(blocco)')+'<span class="tag">non reso</span></h3>'
        +'<p style="color:#ff6b6b">Questo blocco non si &egrave; potuto rendere ('
        +b.t+': '+err.message+'). Il resto della tappa continua sotto.</p>';
      m.appendChild(avv);
    }
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* I POP-UP DEGLI STRUMENTI. `cablaStrumenti` esisteva dal 18-09 e non la chiamava
     nessuno: i 229 rimandi del percorso erano <span> senza handler, e il clic non
     faceva niente. Nessun controllo poteva vederlo — la sintassi era valida, le schede
     c'erano tutte, le formule rendevano: il guasto esisteva solo a pagina viva. Qui, e
     dopo ogni inserimento successivo, perche' la tappa si rimonta da capo a ogni
     cambio e gli handler vanno riattaccati al DOM nuovo. */
  cablaStrumenti(m);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}

  var h=(location.hash||'').replace('#','');
  showTappa(byId[h]?h:'00');
});
window.addEventListener('hashchange', function(){
  var h=(location.hash||'').replace('#','');
  if(byId[h]) showTappa(h);
});
