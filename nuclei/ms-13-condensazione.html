var CORSO = 'meccanica-statistica';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["funzione-zeta-di-riemann"] = {"nome":"Funzione zeta di Riemann","riga":"$\\zeta(s)=\\sum_{n\\ge1} n^{-s}$, convergente per $s>1$; i valori che servono sono $\\zeta(3/2)\\simeq 2{,}612$, $\\zeta(2)=\\pi^{2}/6\\simeq1{,}645$, $\\zeta(3)\\simeq1{,}202$, $\\zeta(4)=\\pi^{4}/90$.","serve":"Compare tutte le volte che una somma su stati discreti viene approssimata con un integrale e si sviluppa l'integrando in serie geometrica: si scambiano somma e integrale e resta una zeta moltiplicata per una gamma. Non e' un abbellimento — il valore NUMERICO di $\\zeta(3/2)$ decide se una transizione di fase esiste.","esempio":"$\\displaystyle\\int_{0}^{\\infty}\\frac{x^{s-1}}{e^{x}-1}dx=\\Gamma(s)\\zeta(s)$, che si ottiene scrivendo $\\frac{1}{e^{x}-1}=\\sum_{n\\ge1}e^{-nx}$ e integrando termine a termine. Per $s=4$ da' $\\pi^{4}/15$, che e' la costante che compare nella legge di Stefan-Boltzmann.","pieno":null,"qui":{"meccanica-statistica":{"serve":"E' cio' che rende la condensazione di Bose-Einstein un fatto e non una possibilita'. Il numero di particelle negli stati eccitati e' limitato superiormente da un integrale che vale $\\zeta(3/2)$: siccome quel numero e' FINITO, oltre una certa densita' le particelle in eccesso non hanno dove stare se non nello stato fondamentale.","esempio":"La condizione critica e' $n\\lambda^{3}=\\zeta(3/2)\\simeq2{,}612$, che definisce $T_{c}$. In due dimensioni lo stesso conto porta a $\\zeta(1)$, che DIVERGE: gli stati eccitati accolgono qualunque numero di particelle e la condensazione non avviene. La dimensionalita' entra nel risultato attraverso l'argomento della zeta, e il confine e' esattamente $s=1$."}}};
STRUM["delta-di-dirac"] = {"nome":"Delta di Dirac","riga":"Non è una funzione ma un funzionale, definito da $\\int f(x)\\,\\delta(x-a)\\,dx=f(a)$, che composto con una funzione si spezza sui suoi zeri come $\\delta(g(x))=\\sum_i \\delta(x-x_i)/|g'(x_i)|$.","serve":"Serve come macchina per cambiare variabile senza invertire nulla. La densità di $y=f(x)$ si scrive $p_Y(y)=\\int p_X(x)\\,\\delta(y-f(x))\\,dx$, e la delta produce da sola il fattore $1/|f'|$ che altrimenti andrebbe messo a mano: i rami molteplici si contano da soli invece di doverli ricordare. È la ragione pratica per cui il formalismo con la delta compare in ogni soluzione d'esame che tocchi una distribuzione, mentre il cambio di variabile esplicito compare quasi mai.","esempio":"$\\delta(x^2-a^2)$ con $a$ positivo. Gli zeri sono $x=\\pm a$; la derivata dell'argomento è $2x$, che in modulo vale $2a$ su entrambi. Quindi $\\delta(x^2-a^2)=\\dfrac{1}{2a}\\big[\\delta(x-a)+\\delta(x+a)\\big]$. Il caso si ripete identico in fisica statistica con $\\varepsilon=p^2/2m$ in una dimensione, dove i due rami $p=\\pm\\sqrt{2m\\varepsilon}$ contribuiscono entrambi — e dimenticarne uno dimezza la risposta.","pieno":{"file":"15-distribuzioni.html","tappa":"01","come":"le distribuzioni come funzionali, la delta e le sue proprietà, nel nucleo di Metodi"},"qui":{"meccanica-statistica":{"serve":"È lo strumento con cui si calcola la densità degli stati, cioè l'oggetto su cui poggia tutto il secondo tempo del corso: $g(\\varepsilon)=\\int d^dp\\,d^dq\\;\\delta(\\varepsilon-H)/h^d$. L'identità che si usa davvero non è la definizione ma questa: $\\delta(\\varepsilon-H)=\\partial_\\varepsilon\\,\\theta(\\varepsilon-H)$. Si scambia l'integrale con la derivata e ci si ritrova a calcolare il volume della regione dove l'hamiltoniana sta sotto $\\varepsilon$ — un integrale elementare — invece di un integrale con una delta dentro. La $g$ così ottenuta è pura geometria dello spazio delle fasi: non sa nulla della temperatura, e per questo resta identica quando si passa da Boltzmann a Fermi o a Bose.","esempio":"Particella libera in due dimensioni. Il volume della regione $p^2/2m$ sotto $\\varepsilon$ è il disco di area $2\\pi m\\varepsilon$; derivando rispetto a $\\varepsilon$ si ottiene $2\\pi m$, cioè una densità degli stati costante. Non è una curiosità: è la ragione per cui in due dimensioni una particella libera non condensa, e per cui le prove che chiedono la condensazione in $d=2$ mettono sempre un potenziale confinante, che porta la $g$ da costante a crescente."}},"controllo":[{"tipo":"derivata","espr":"x**2-a**2","rispetto":["x"],"vale":"2*x","ipotesi":{"x":"positive","a":"positive"},"dove":"esempio","appare":"2x"},{"tipo":"uguale","sinistra":"1/Abs(2*a)","vale":"1/(2*a)","ipotesi":{"a":"positive"},"dove":"esempio","appare":"\\dfrac{1}{2a}"},{"tipo":"derivata","espr":"2*pi*m*e","rispetto":["e"],"vale":"2*pi*m","ipotesi":{"m":"positive","e":"positive"},"dove":"qui.meccanica-statistica.esempio","appare":"2\\pi m"}]};
STRUM["serie-geometrica"] = {"nome":"Serie geometrica","riga":"La somma $\\sum_{n\\ge 0} q^{n}$ vale $\\dfrac{1}{1-q}$ se $|q|\\lt 1$, e non esiste se $|q|\\ge 1$.","serve":"È l'unica serie di cui si conosce la somma in forma chiusa senza fatica, e per questo diventa il metro di tutte le altre: una serie si studia maggiorandola con una geometrica (criterio del rapporto, criterio della radice) o riconoscendola come geometrica travestita.","esempio":"Con $q=\\tfrac12$: $1+\\tfrac12+\\tfrac14+\\cdots=\\dfrac{1}{1-\\tfrac12}=2$. Con $q=-\\tfrac13$: $\\dfrac{1}{1+\\tfrac13}=\\tfrac34$. Con $q=1$ le somme parziali sono $N+1$ e se ne vanno: la formula $1/(1-q)$ non è una scorciatoia da usare fuori dal suo raggio.","pieno":{"file":"07-serie-funzioni.html","tappa":"04","come":"il raggio $R=1$, il grafico delle somme parziali e la cassetta dei trucchi che parte da qui, nella tappa sulle serie di potenze"},"qui":{"metodi-e-modelli":{"serve":"È il motore della serie di Laurent: lo sviluppo di $\\dfrac{1}{z-a}$ in potenze di $z$ o di $1/z$ è una geometrica, e quale delle due si sceglie decide in quale corona si sta sviluppando. Tutta la parte principale di Laurent nasce da qui.","esempio":"Per $\\dfrac{1}{z-2}$ con $|z|\\lt 2$ si scrive $-\\tfrac12\\cdot\\dfrac{1}{1-z/2}=-\\sum_{n\\ge0}\\dfrac{z^{n}}{2^{n+1}}$; in $z=1$ entrambi i membri valgono $-1$. Per $|z|\\gt 2$ si raccoglie invece $z$ e viene $\\sum_{n\\ge0}\\dfrac{2^{n}}{z^{n+1}}$, cioè solo potenze negative; in $z=4$ entrambi i membri valgono $\\tfrac12$."},"elettromagnetismo":{"serve":"Compare ogni volta che una configurazione si ripete con un fattore costante — catene di cariche immagine fra due piani conduttori, riflessioni multiple in una cavità — e la somma chiusa è ciò che rende il conto finito invece che infinito.","esempio":"Una carica fra due piani paralleli genera immagini a distanze crescenti, e il contributo al potenziale è una somma del tipo $\\sum_{n\\ge0} r^{n}$ con $r\\lt 1$ fissato dalla geometria. Con una riflettività $r=\\tfrac14$ la serie vale $\\tfrac43$: la catena è infinita, il potenziale no."}},"controllo":[{"tipo":"somma","espr":"(1/2)**n","var":"n","da":"0","a":"oo","vale":"2","dove":"esempio","appare":"=2"},{"tipo":"somma","espr":"(-1/3)**n","var":"n","da":"0","a":"oo","vale":"3/4","dove":"esempio","appare":"\\tfrac34"},{"tipo":"somma","espr":"-1**n/2**(n+1)","var":"n","da":"0","a":"oo","vale":"-1","dove":"qui.metodi-e-modelli.esempio","appare":"-1"},{"tipo":"somma","espr":"2**n/4**(n+1)","var":"n","da":"0","a":"oo","vale":"1/2","dove":"qui.metodi-e-modelli.esempio","appare":"\\tfrac12"},{"tipo":"somma","espr":"(1/4)**n","var":"n","da":"0","a":"oo","vale":"4/3","dove":"qui.elettromagnetismo.esempio","appare":"\\tfrac43"},{"tipo":"uguale","sinistra":"1/(1-2)","vale":"-1","dove":"qui.metodi-e-modelli.esempio","appare":"-1"},{"tipo":"uguale","sinistra":"1/(4-2)","vale":"1/2","dove":"qui.metodi-e-modelli.esempio","appare":"\\tfrac12"}]};
STRUM["funzione-gamma"] = {"nome":"Funzione Gamma","riga":"$\\Gamma(z)=\\displaystyle\\int_0^{\\infty}t^{z-1}e^{-t}\\,dt$, e da questa $\\displaystyle\\int_0^{\\infty}t^{k}e^{-at}\\,dt=\\dfrac{\\Gamma(k+1)}{a^{k+1}}$ per $a>0$.","serve":"E' il fattoriale esteso ai numeri non interi — $\\Gamma(n+1)=n!$ — e soprattutto e' la forma chiusa di TUTTI gli integrali del tipo «potenza per esponenziale». Sapere questa sola formula sostituisce una decina di integrazioni per parti, e permette di leggere a vista il risultato di un integrale appena si riconosce l'esponente della potenza.","esempio":"Da $\\Gamma(z+1)=z\\,\\Gamma(z)$, che si ottiene integrando per parti una volta, discende $\\Gamma(n+1)=n!$ per $n$ intero: $\\Gamma(1)=1$, $\\Gamma(2)=1$, $\\Gamma(3)=2$, $\\Gamma(4)=6$. Sui semi-interi il capostipite e' $\\Gamma(\\tfrac12)=\\sqrt\\pi$ — che e' l'integrale gaussiano travestito — e da li' $\\Gamma(\\tfrac32)=\\tfrac12\\sqrt\\pi$, $\\Gamma(\\tfrac52)=\\tfrac34\\sqrt\\pi$. Un integrale come $\\int_0^\\infty t^{2}e^{-at}dt$ vale dunque $\\Gamma(3)/a^{3}=2/a^{3}$, senza fare nessun conto.","pieno":null,"qui":{"meccanica-statistica":{"serve":"E' l'inventario degli integrali del canonico ridotto a una riga. Ogni funzione di partizione di singola particella e' un integrale di potenza per esponenziale — cambia solo l'esponente, e con esso la fisica: $t^{1/2}$ per il gas classico, $t^{2}$ per l'ultrarelativistico, $t^{3/n}$ per un potenziale $\\alpha r^{n}$. Riconoscere quale $\\Gamma$ si sta calcolando e' cio' che distingue chi risolve lo scritto in dieci minuti da chi lo risolve in un'ora.","esempio":"Per una particella relativistica con $\\varepsilon=cp$ la partizione porta $\\int_0^\\infty p^{2}e^{-\\beta cp}dp=\\Gamma(3)/(\\beta c)^{3}=2/(\\beta c)^{3}$, da cui $\\langle\\varepsilon\\rangle=3T$ invece dei $\\tfrac32T$ del caso non relativistico. Il fattore 3 contro $3/2$ viene per intero dall'esponente della potenza, cioe' dall'argomento della Gamma: la dipendenza dell'energia dalla quantita' di moto decide da sola quanto calore serve a scaldare il gas."}}};
STRUM["integrale-gaussiano"] = {"nome":"Integrale gaussiano","riga":"$\\displaystyle\\int_{-\\infty}^{+\\infty} e^{-ax^{2}}\\,dx=\\sqrt{\\pi/a}$ per $a>0$, e $\\displaystyle\\int_{-\\infty}^{+\\infty} x^{2}e^{-ax^{2}}\\,dx=\\tfrac12\\sqrt{\\pi/a^{3}}$.","serve":"E' l'unico integrale che serve davvero sapere a memoria in meccanica statistica, perche' l'energia cinetica e' quadratica nell'impulso e quindi ogni integrazione sugli impulsi e' una gaussiana. Il trucco della dimostrazione — elevare al quadrato e passare in coordinate polari — vale la pena di vederlo una volta: e' il motivo per cui compare un $\\pi$ in una formula che di cerchi non parla.","esempio":"Da $I^{2}=\\iint e^{-a(x^{2}+y^{2})}dx\\,dy=2\\pi\\int_{0}^{\\infty}re^{-ar^{2}}dr=\\pi/a$ segue $I=\\sqrt{\\pi/a}$. I momenti superiori si ottengono derivando rispetto ad $a$ sotto il segno: $-\\partial_a I=\\int x^{2}e^{-ax^{2}}dx=\\tfrac12\\sqrt{\\pi}\\,a^{-3/2}$. Derivare rispetto a un parametro e' piu' rapido che integrare per parti, e funziona per tutti i momenti pari.","pieno":null,"qui":{"meccanica-statistica":{"serve":"La funzione di partizione di una particella libera e' un prodotto di tre gaussiane negli impulsi, e da li' esce la lunghezza d'onda termica $\\lambda=h/\\sqrt{2\\pi m k T}$ — che e' la grandezza con cui si misura quando un gas smette di essere classico.","esempio":"$\\int e^{-\\beta p^{2}/2m}dp=\\sqrt{2\\pi m/\\beta}$, quindi $Z_{1}=\\dfrac{V}{h^{3}}(2\\pi mkT)^{3/2}=V/\\lambda^{3}$. Lo stesso integrale col peso $p^{2}$ da' $\\langle p^{2}/2m\\rangle=\\tfrac12 kT$ per grado di liberta': l'equipartizione non e' un principio a parte, e' questo integrale."}}};
STRUM["ordini-di-grandezza"] = {"nome":"Ordini di grandezza","riga":"Stimare una quantità alla potenza di dieci giusta: si tiene una cifra significativa, si sommano e si sottraggono gli esponenti, e si controlla che l'unità del risultato sia quella che si voleva.","serve":"A sapere se un risultato è plausibile prima di averlo calcolato con precisione, e ad accorgersi di un errore di impostazione quando c'è ancora tempo per rimediare. In astrofisica non è una comodità ma il modo normale di ragionare, per due ragioni: le grandezze in gioco vanno da $10^{-36}$ kg a $10^{53}$ kg e nessuna intuizione le copre, e i dati osservativi sono noti al dieci o al venti per cento, quindi una cifra significativa è spesso tutto ciò che il problema contiene davvero. Il controllo che smaschera più errori non è sul numero, è sull'**unità**: un conto che dovrebbe dare una densità e dà dei kg è sbagliato nell'impostazione, e nessun affinamento dell'aritmetica lo salverà. La seconda regola è il confronto con un termine noto — l'acqua per una densità, il Sole per una massa o una luminosità, il parsec per una distanza galattica — perché un numero senza metro non dice niente.","esempio":"Densità media del Sole, dalle due sole quantità stampate in calce al foglio d'esame, $M_\\odot=1{,}989\\cdot10^{30}$ kg e $R_\\odot=6{,}957\\cdot10^{8}$ m: $\\rho=\\dfrac{3M_\\odot}{4\\pi R_\\odot^{3}}=1410\\ \\mathrm{kg/m^3}$. Il confronto è immediato e istruttivo: è quasi una volta e mezza l'acqua, cioè il Sole è in media meno denso della Terra — una stella non è un sasso grande, è un gas tenuto insieme dal proprio peso.","pieno":{"file":"as-01-la-scala-del-cosmo.html","tappa":"01","come":"la gerarchia delle strutture cosmiche letta come scala di ordini di grandezza, e il tempo di luce come secondo asse della stessa tabella"},"controllo":[{"tipo":"numero","espr":"3*1.989e30/(4*pi*(6.957e8)**3)","vale":"1410","dove":"esempio","appare":"1410"}]};

function schedaHTML(s){

  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';

  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';

}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

/* ---------------- 00 · DI COSA PARLA QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Di cosa parla questo movimento', meta:'Meccanica Statistica · voce A.14 · un tetto finito sugli stati eccitati · e la domanda vera: la condensazione esiste?',
  blocchi:[
  {t:'prosa', title:'Un tetto finito, e le particelle che devono andare da qualche parte', tag:'architettura', html:R`
  <p>Questo movimento nasce da una sola osservazione, e tutto il resto ne discende meccanicamente. <b>Il numero di particelle che gli stati di energia non nulla possono contenere, a temperatura e volume fissati, e&grave; limitato superiormente</b> — e in tre dimensioni quel limite &egrave; un numero finito. Se si mettono nella scatola pi&ugrave; particelle di quante il tetto ne ammetta, le particelle in eccesso non spariscono: vanno tutte nell&rsquo;unico posto che non &egrave; stato contato, il livello di energia minima. Quell&rsquo;accumulo si chiama <b>condensato di Bose-Einstein</b>, ed &egrave; una transizione di fase che avviene <i>senza che le particelle si tocchino</i>.</p>
  <p>L&rsquo;oggetto di partenza &egrave; il numero medio di occupazione di un livello di energia $\varepsilon$ per particelle a funzione d&rsquo;onda simmetrica,</p>
  $$\langle n_\varepsilon\rangle=\frac{1}{e^{(\varepsilon-\mu)/T}-1}$$
  <p>che differisce da quella dei fermioni per un segno solo, e quel segno cambia tutto. Con il $+1$ l&rsquo;occupazione di un livello non supera mai uno; con il $-1$ <b>diverge</b> quando $\varepsilon$ si avvicina a $\mu$. Falcioni-Vulpiani (pag. 42) ricava entrambe per massimizzazione della molteplicit&agrave; e chiama $\mu$ «un parametro che si introduce per fissare il numero di particelle nel sistema»: &egrave; la lettura giusta da tenere, perch&eacute; tutta la storia che segue &egrave; il racconto di che cosa succede a quel parametro quando non ce la fa pi&ugrave; a fissare niente.</p>
  <p>La divergenza obbliga $\mu$ a stare sotto tutti i livelli, dunque sotto il livello fondamentale: $\mu\le0$ se si sceglie l&rsquo;origine delle energie sul fondo dello spettro. E siccome l&rsquo;occupazione cresce con $\mu$, il massimo numero di particelle collocabili negli stati eccitati si ottiene mettendo $\mu=0$. In tre dimensioni quel massimo &egrave; <b>finito</b>, e la condizione che lo satura si scrive in una riga:</p>
  $$n\lambda^3=g_s\zeta(3/2)$$
  <p>dove $\lambda=h/\sqrt{2\pi mk_BT}$ &egrave; la lunghezza d&rsquo;onda termica, $g_s=2s+1$ la degenerazione di spin e $\zeta$ la <span class="str" data-str="funzione-zeta-di-riemann">funzione zeta di Riemann</span>, con $\zeta(3/2)\simeq2{,}612$. A sinistra c&rsquo;&egrave; il numero di particelle contenute nel volume termico di una di esse; a destra un numero puro. <b>La condensazione comincia quando i pacchetti d&rsquo;onda cominciano a sovrapporsi</b>, e la costante numerica che decide «quanto» &egrave; un valore della zeta.</p>
  <p>Sotto quella soglia le particelle in eccesso si accumulano nel fondamentale, e la frazione che ci finisce si scrive</p>
  $$\frac{N_0}{N}=1-\left(\frac{T}{T_c}\right)^{3/2}$$
  <p>Da qui escono tutte le grandezze termodinamiche: un&rsquo;energia che va a zero con la temperatura (al contrario di un gas di fermioni), una pressione che <b>non dipende dal volume</b>, un calore specifico che sale come $T^{3/2}$, tocca un massimo in $T_c$ e ridiscende al valore classico con una <b>cuspide</b>.</p>
  <div class="note"><b>Convenzioni, e sette punti in cui le fonti non concordano o sbagliano.</b> Crisanti e Grilli-Giardina pongono $k_B=1$ (la temperatura &egrave; un&rsquo;energia, $\beta=1/T$); Falcioni-Vulpiani tiene $k_B$ esplicito. Qui si scrive $k_B=1$ nei conti simbolici e lo si rimette quando si fanno i <b>numeri</b>. I punti segnalati sul posto sono: <b>(a)</b> la convenzione su $k_B$; <b>(b)</b> il fattore di spin, esplicito in Grilli-Giardina e assente in Crisanti, che per&ograve; poi lo rimette dove si semplifica; <b>(c)</b> due riquadri di Crisanti a pag. 299 con $g_{3/2}$ al posto di $g_{5/2}$ e una $T$ di troppo; <b>(d)</b> un $z/(z-1)$ per $z/(1-z)$ a pag. 293; <b>(e)</b> una $\lambda_0^3$ capovolta a pag. 295; <b>(f)</b> una tabella di temperature che non si riproduce con la formula stampata sopra di essa; <b>(g)</b> la classificazione della transizione, dove Crisanti conclude «primo ordine» e il calore specifico dice il contrario.</div>`},
  {t:'prosa', title:'Il peso misurato, e perché la versione d-dimensionale non è un di più', tag:'architettura', html:R`
  <p><b>Il peso.</b> Su quarantasette prove d&rsquo;esame, <b>quarantacinque</b> toccano questo argomento, con una densit&agrave; di $15{,}5$: &egrave; la pi&ugrave; alta della materia, e questo &egrave; il movimento-firma del corso. La parola «condensazione» compare in quarantaquattro prove, «temperatura di condensazione» in diciannove.</p>
  <p><b>E la versione che le prove chiedono non &egrave; quella dei libri.</b> Il gas libero in tre dimensioni — quello che sta nei capitoli di Crisanti e di Grilli-Giardina — &egrave; il caso di scuola, e negli scritti compare quasi mai da solo. La formula che ricorre &egrave; un&rsquo;altra: <i>determinare, se esiste, la temperatura di condensazione</i>, per un gas in un <b>potenziale esterno $V(\vec r)$</b> e in un numero di <b>dimensioni $d$</b> che non &egrave; tre. In quella formulazione la risposta pu&ograve; benissimo essere «non esiste», e saperlo dire — con il motivo — vale quanto saper calcolare $T_c$.</p>
  <p>La ragione per cui la risposta cambia sta tutta in un esponente. La densit&agrave; degli stati di singola particella, definita come</p>
  $$G(\varepsilon)=\int\frac{d^dq\,d^dp}{h^d}\,\delta(\varepsilon-H)$$
  <p>con una <span class="str" data-str="delta-di-dirac">delta di Dirac</span>, per le hamiltoniane degli esercizi &egrave; sempre una potenza, $G(\varepsilon)\propto\varepsilon^{\alpha-1}$. <b>Il numero di particelle collocabili negli stati eccitati &egrave; finito se e solo se $\alpha>1$</b>, perch&eacute; l&rsquo;integrale che lo calcola converge in $\varepsilon=0$ solo allora. Un numero solo — $\alpha$ — decide tre cose: se la condensazione esiste, quanto vale $T_c$, e con quale potenza la frazione condensata si annulla. Per il gas libero in tre dimensioni $\alpha=3/2$; in due dimensioni $\alpha=1$ e <b>la condensazione non c&rsquo;&egrave;</b>; ma per un gas in due dimensioni dentro una <b>trappola armonica</b> $\alpha=2$ e la condensazione torna — ed &egrave; il caso che gli esperimenti veri usano.</p>
  <p><b>La rotta.</b> Si parte dal tetto: da dove viene il vincolo $\mu\le0$, e perch&eacute; il massimo numero di particelle negli stati eccitati &egrave; finito. Poi il potenziale chimico che sale al raffreddarsi e si incolla a zero, con il confronto contro la formula classica, che sbaglia il punto di arrivo di quasi il novanta per cento. Poi la temperatura critica in tre dimensioni, con i numeri veri dell&rsquo;elio liquido e di un gas di rubidio in trappola. Poi — ed &egrave; il cuore concettuale — il <b>termine $p=0$ perduto</b> nella sostituzione della somma con l&rsquo;integrale: si mostra prima il conto ingenuo che fa <i>sparire</i> le particelle, poi si ripara. Poi la frazione condensata. Poi il <b>caso generale</b> in $d$ dimensioni e con potenziale esterno, che &egrave; il criterio operativo d&rsquo;esame. Poi energia, entropia, pressione e calore specifico con la sua cuspide. Poi la domanda su che specie di transizione sia. Chiudono tre esercizi d&rsquo;esame veri.</p>
  <p><b>Che cosa questo movimento non fa.</b> Non ricava la distribuzione di Bose-Einstein da zero: la prende come data e ne mostra solo il passaggio che serve. Non tratta il gas di fotoni e di fononi, dove il numero di particelle non si conserva e la condensazione non pu&ograve; esistere per un motivo diverso. E non affronta le <b>interazioni</b>, che sono ci&ograve; che separa questo modello dall&rsquo;elio superfluido vero — la differenza fra i $3{,}13$ kelvin che il conto predice e i $2{,}18$ che si misurano.</p>`}
]},

/* ---------------- 01 · IL TETTO ---------------- */
{ num:'01', title:'Il tetto: perché gli stati eccitati non possono contenere più di un numero finito di particelle', meta:'la serie geometrica che impone il vincolo · il potenziale chimico costretto sotto il fondo · il massimo calcolato con Gamma e zeta · il tetto letto come volume',
  blocchi:[
  {t:'reveal', title:'Da dove viene davvero il vincolo sul potenziale chimico', tag:'costruzione', steps:[
   {label:'La gran partizione di un livello bosonico è una serie geometrica, e non sempre converge', body:R`
   <p>Si prenda un gas di $N$ bosoni identici non interagenti, e si lavori nel gran canonico — che &egrave; l&rsquo;unico insieme in cui i conti di un gas quantistico si fanno, perch&eacute; l&rsquo;occupazione dei livelli diventa indipendente livello per livello. Lo stato del gas &egrave; specificato dai <b>numeri di occupazione</b> $\{n_p\}$, e per i bosoni ciascuno di essi va da zero a infinito: non c&rsquo;&egrave; nessun principio che li limiti, ed &egrave; l&rsquo;unica differenza rispetto ai fermioni.</p>
   <p>La gran partizione si fattorizza sui livelli, e la fattorizzazione &egrave; il passaggio da cui esce tutto. Grilli-Giardina (pag. 82-83) lo descrive con cura, perch&eacute; qui si scambia una somma su <i>configurazioni</i> con un prodotto di somme su <i>occupazioni</i>: «poich&eacute; $N$ va da $0$ a $\infty$ ogni livello $p$ pu&ograve; essere occupato da $0$ a $\infty$ particelle (almeno per i bosoni)». Il fattore relativo al livello di energia $\varepsilon$ &egrave; allora</p>
   $$\Xi_\varepsilon=\sum_{n\ge0}\left(ze^{-\beta\varepsilon}\right)^n=\frac{1}{1-ze^{-\beta\varepsilon}}$$
   <p>dove $z=e^{\beta\mu}$ &egrave; la <b>fugacit&agrave;</b>. &Egrave; una <span class="str" data-str="serie-geometrica">serie geometrica</span> di ragione $ze^{-\beta\varepsilon}$, e <b>converge solo se la ragione &egrave; minore di uno</b>. Questa non &egrave; una sottigliezza matematica da mettere in nota: &egrave; il vincolo fisico del movimento. La condizione dev&rsquo;essere soddisfatta per <i>ogni</i> livello, e il pi&ugrave; esigente &egrave; quello di energia minima. Se si pone l&rsquo;origine delle energie sul fondo dello spettro, cio&egrave; $\varepsilon_{\min}=0$, la richiesta diventa $z<1$, e passando al logaritmo</p>
   <p style="text-align:center">$\mu<0$ &nbsp;&nbsp;per un gas di bosoni, a ogni temperatura.</p>
   <p>Grilli-Giardina (pag. 83) la ricava esattamente cos&igrave;: «nel ricavare $Q$ per il caso bosonico, abbiamo supposto la progressione geometrica essere convergente; ci&ograve; &egrave; vero solo se $e^{\beta(\mu-\varepsilon_p)}<1$. Tale condizione dev&rsquo;essere soddisfatta per ogni $\varepsilon_p$, in particolare richiedendolo per $\varepsilon_p=0$ otteniamo che nei bosoni $\mu<0$». <b>Nel gas di fermioni non c&rsquo;&egrave; niente di simile</b>: l&igrave; la somma su $n_p$ ha due soli termini, $\Xi_\varepsilon=1+ze^{-\beta\varepsilon}$, che converge sempre, e la fugacit&agrave; pu&ograve; assumere qualunque valore positivo. Crisanti (pag. 280) mette i due casi a confronto in una riga sola: per i bosoni «$z$ pu&ograve; variare solo tra $0$ ed $1$», mentre «ricordiamo che nella statistica di Fermi era necessario invece che $z\in[0,\infty[$».</p>`},
   {label:'L occupazione media, e la sua monotonia nel potenziale chimico', body:R`
   <p>Dal logaritmo del fattore di livello si ottiene l&rsquo;occupazione media derivando rispetto alla fugacit&agrave;, che &egrave; il modo standard di far scendere un numero di particelle da una funzione di partizione:</p>
   $$\langle n_\varepsilon\rangle=z\frac{\partial}{\partial z}\log\Xi_\varepsilon=\frac{1}{z^{-1}e^{\beta\varepsilon}-1}$$
   <p>e ricordando che $z^{-1}$ vale $e^{-\beta\mu}$ si ritrova la forma annunciata, $\langle n_\varepsilon\rangle=\left(e^{\beta(\varepsilon-\mu)}-1\right)^{-1}$. Due cose vanno lette prima di andare avanti, e la seconda &egrave; il motore di tutto il movimento.</p>
   <p><b>La prima: l&rsquo;occupazione diverge quando $\varepsilon\to\mu^+$.</b> Un livello la cui energia si avvicina al potenziale chimico pu&ograve; ospitare un numero arbitrariamente grande di particelle. Nel gas di fermioni l&rsquo;analoga quantit&agrave; tende a $1/2$ e non succede niente; qui succede tutto.</p>
   <p><b>La seconda: l&rsquo;occupazione di ogni livello cresce con $\mu$.</b> Derivando,</p>
   $$\frac{\partial\langle n_\varepsilon\rangle}{\partial\mu}=\frac{\beta}{4\sinh^2\left[\beta(\varepsilon-\mu)/2\right]}$$
   <p>— la forma con il seno iperbolico non &egrave; un vezzo: rende la <b>positivit&agrave; manifesta</b>, perch&eacute; un quadrato &egrave; positivo e $\beta$ anche, senza bisogno di discutere segni. Dunque il numero totale di particelle collocabili negli stati di energia non nulla,</p>
   $$N_{\rm ecc}(\mu)=g_s\int_{0^+}^{\infty}\frac{G(\varepsilon)}{e^{\beta(\varepsilon-\mu)}-1}\,d\varepsilon$$
   <p>&egrave; una funzione <i>strettamente crescente</i> di $\mu$ su tutto l&rsquo;intervallo ammesso $\mu\in(-\infty,0)$. Ne segue la domanda che decide l&rsquo;intero movimento: <b>quanto vale il suo estremo superiore, cio&egrave; il limite per $\mu\to0^-$?</b> Se fosse infinito, per ogni $N$ esisterebbe un $\mu$ che lo realizza e non ci sarebbe niente da raccontare. Se &egrave; finito, per $N$ abbastanza grande <i>non esiste alcun $\mu$</i> che soddisfi il vincolo, e qualcosa deve cedere.</p>`},
   {label:'Il massimo, calcolato: densità degli stati, Gamma e zeta', body:R`
   <p>Per rispondere serve la densit&agrave; degli stati. Per una particella libera di massa $m$ in un volume $V$ tridimensionale, con $H=p^2/2m$, si parte dalla definizione con la <span class="str" data-str="delta-di-dirac">delta di Dirac</span> e si usa il trucco che Crisanti (pag. 285) e Grilli-Giardina (pag. 99) adoperano entrambi: si scrive la delta come derivata in $\varepsilon$ di una funzione a gradino, perch&eacute; <b>l&rsquo;integrale di una theta &egrave; un volume</b> e i volumi si calcolano senza pensarci. La theta seleziona la palla $p<\sqrt{2m\varepsilon}$, e con la misura radiale $4\pi p^2dp$:</p>
   $$\int_0^{\sqrt{2m\varepsilon}}4\pi p^2\,dp=\frac{4\pi}{3}(2m\varepsilon)^{3/2}$$
   <p>Resta da derivare rispetto all&rsquo;energia, ed &egrave; una derivata di potenza in cui il $3/2$ dell&rsquo;esponente si moltiplica con il $2m$ della derivata interna:</p>
   $$\frac{\partial}{\partial\varepsilon}(2m\varepsilon)^{3/2}=3m\sqrt{2m\varepsilon}$$
   <p>Rimettendo insieme i tre pezzi — il volume $V$ dall&rsquo;integrale sulle posizioni, il $1/h^3$ della cella di spazio delle fasi, e la derivata appena fatta:</p>
   $$G(\varepsilon)=\frac{V}{h^3}\frac{4\pi}{3}\cdot3m\sqrt{2m\varepsilon}=2\pi V\left(\frac{2m}{h^2}\right)^{3/2}\sqrt{\varepsilon}$$
   <p>ed &egrave; la forma che entrambe le note usano ovunque. <b>Si fissi nella mente il comportamento a energia piccola</b>: $G(\varepsilon)\to0$ come $\sqrt\varepsilon$. Per i fermioni questo non fa nessun danno; qui &egrave; la crepa da cui uscir&agrave; il condensato, e Crisanti (pag. 281) lo annota con una frase che vale la pena tenere: «si vede che $\lim_{\varepsilon\to0}G(\varepsilon)=0$ e quindi $G(\varepsilon)$ conta male il numero di stati per $\varepsilon=0$».</p>
   <p>Adesso il massimo. Si pone $\mu=0$ e si sostituisce $y=\beta\varepsilon$. L&rsquo;integrale da fare &egrave; della famiglia</p>
   $$\int_0^{\infty}\frac{y^{1/2}}{e^y-1}\,dy$$
   <p>e Crisanti (pag. 287-288) lo risolve con un procedimento che conviene imparare una volta perch&eacute; funziona per <i>ogni</i> esponente e ritorna in tutti gli esercizi. Si riscrive il denominatore come serie geometrica di ragione $e^{-y}$:</p>
   $$\sum_{k\ge1}e^{-ku}=\frac{1}{e^u-1}$$
   <p>si scambia somma e integrale, e ogni termine diventa un integrale di Eulero:</p>
   $$\int_0^{\infty}\sqrt y\,e^{-ky}\,dy=\frac{\sqrt\pi}{2k^{3/2}}$$
   <p>dove $\sqrt\pi/2=\Gamma(3/2)$ &egrave; un valore della <span class="str" data-str="funzione-gamma">funzione Gamma</span>, e il $k^{-3/2}$ nasce dal riscalamento $x=ky$. Sommando su $k$ resta una zeta:</p>
   $$\sum_{k\ge1}\frac{1}{k^{3/2}}=\zeta(3/2)$$
   <p>e mettendo insieme le due:</p>
   $$\int_0^{\infty}\frac{y^{1/2}}{e^y-1}\,dy=\Gamma(3/2)\,\zeta(3/2)\simeq2{,}3152$$
   <p>La regola generale che ne esce, e che vale la pena imparare perch&eacute; serve in ogni esercizio del movimento, &egrave; che $\int_0^\infty y^{x-1}(e^y-1)^{-1}dy$ vale $\Gamma(x)\,\zeta(x)$ per ogni $x>1$: Crisanti la scrive cos&igrave; a pag. 288 e aggiunge «negli esercizi questi integrali si lasciano indicati». Il controllo che conviene fare una volta &egrave; su un secondo esponente, perch&eacute; quello con $x=5/2$ servir&agrave; per l&rsquo;energia:</p>
   $$\int_0^{\infty}\frac{y^{3/2}}{e^y-1}\,dy=\Gamma(5/2)\,\zeta(5/2)\simeq1{,}7833$$
   <p>Rimettendo i prefattori e riportando $T$ al suo posto — la sostituzione $y=\beta\varepsilon$ d&agrave; un $T$ dal differenziale e un $T^{1/2}$ dalla radice, cio&egrave; $T^{3/2}$ in tutto — il massimo &egrave;</p>
   $$N_{\rm ecc}^{\max}=g_s\,2\pi V\left(\frac{2m}{h^2}\right)^{3/2}T^{3/2}\Gamma(3/2)\zeta(3/2)=g_sV\left(\frac{2\pi mT}{h^2}\right)^{3/2}\zeta(3/2)$$
   <p>Quel prefattore ha un nome. La <b>lunghezza d&rsquo;onda termica</b> $\lambda=h/\sqrt{2\pi mT}$ — che Crisanti (pag. 230) introduce dal prodotto di indeterminazione su un pacchetto d&rsquo;onda, e Grilli-Giardina (pag. 56) dalla funzione di partizione di singola particella, che &egrave; un <span class="str" data-str="integrale-gaussiano">integrale gaussiano</span> — soddisfa</p>
   $$\frac{1}{\lambda^3}=\left(\frac{2\pi mT}{h^2}\right)^{3/2}$$
   <p>per cui il risultato prende la forma compatta</p>
   $$N_{\rm ecc}^{\max}=\frac{g_sV}{\lambda^3}\,\zeta(3/2)$$
   <p><b>&Egrave; finito.</b> A temperatura e volume fissati gli stati di energia non nulla non possono contenere pi&ugrave; di quel numero di particelle, qualunque cosa si faccia al potenziale chimico. Diviso per il volume, il vincolo si legge come una condizione sulla densit&agrave;: $n\lambda^3\le g_s\zeta(3/2)$.</p>`}
  ]},
  {t:'plot', title:'L occupazione media che esplode mentre il potenziale chimico sale verso zero',
   intro:R`Occupazione media $\langle n_\varepsilon\rangle$ in funzione dell&rsquo;energia, in unit&agrave; in cui $T=1$, per tre valori del potenziale chimico: $\mu=-0{,}5$, $\mu=-0{,}1$ e $\mu=-0{,}01$. Il riquadro &egrave; tagliato a dodici: la curva pi&ugrave; alta esce dal grafico.`,
   plots:[
    {kind:'func2d', xr:[0,3], yr:[0,12], height:340, ticks:6,
     title:'tre potenziali chimici, e il livello fondamentale che si riempie',
     curves:[
      {f:'1/(exp(x+0.5)-1)', col:'#d8a13a', label:'mu = -0,50'},
      {f:'1/(exp(x+0.1)-1)', col:'#5eead4', label:'mu = -0,10'},
      {f:'1/(exp(x+0.01)-1)', col:'#4c8dff', label:'mu = -0,01'}
     ],
     marks:[{x:0,y:1.541,label:'1,541',col:'#d8a13a'},{x:0,y:9.508,label:'9,508',col:'#5eead4'}],
     xlabel:'energia del livello (in unità di T)', ylabel:'occupazione media'}
   ],
   leggi:R`<p><b>Che cosa guardare: il valore all&rsquo;origine.</b> Le tre curve differiscono <i>solo</i> vicino a $\varepsilon=0$. Sul livello fondamentale l&rsquo;occupazione vale $1{,}541$ per $\mu=-0{,}5$, sale a $9{,}508$ per $\mu=-0{,}1$, e a $99{,}5$ per $\mu=-0{,}01$ — dieci volte tanto ogni volta che $|\mu|$ si divide per dieci, perch&eacute; per $|\mu|\ll T$ vale $\langle n_0\rangle\simeq T/|\mu|$. <b>Non c&rsquo;&egrave; nessun tetto su questo numero</b>, ed &egrave; l&rsquo;unico livello di cui si possa dire.</p>
   <p><b>Che cosa guardare: la coda, che non si muove.</b> Gi&agrave; a $\varepsilon=2T$ le tre curve sono indistinguibili. Il potenziale chimico governa il fondo dello spettro e quasi niente altro: spostarlo da $-0{,}5$ a $-0{,}01$ aggiunge decine di particelle nel fondamentale e praticamente nessuna sopra. &Egrave; il motivo per cui il tetto sugli stati eccitati esiste — quelle particelle in pi&ugrave; <i>non hanno dove andare</i> se non in basso.</p>
   <p><b>Che cosa impararne per i conti.</b> L&rsquo;integrale che calcola $N_{\rm ecc}$ pesa queste curve con $G(\varepsilon)\propto\sqrt\varepsilon$, che vale <b>zero</b> proprio dove le curve divergono. Il prodotto $\sqrt\varepsilon/(e^{\beta\varepsilon}-1)$ si comporta come $1/(\beta\sqrt\varepsilon)$, che &egrave; integrabile: la divergenza dell&rsquo;occupazione viene soffocata dalla scarsit&agrave; di stati, e il risultato resta finito. Tutta la tappa 06 consiste nel chiedersi quando questo soffocamento riesce e quando no.</p>
   <p><b>Dove questa figura mente.</b> Disegna il livello fondamentale come un punto su una curva continua, mentre in un sistema finito lo spettro &egrave; discreto e il fondamentale &egrave; un livello <i>isolato</i>, separato dal successivo da un salto minuscolo ma non nullo. &Egrave; esattamente la differenza che la tappa 04 mostrer&agrave; essere decisiva: nel continuo il fondamentale ha misura nulla e sparisce, nel discreto no.</p>`},
  {t:'prosa', title:'Il tetto letto come volume, e perché il regime classico lo vede da lontano', tag:'grammatica', html:R`
  <p>Il vincolo $n\lambda^3\le g_s\zeta(3/2)$ merita di essere letto prima di essere usato, perch&eacute; contiene la fisica dell&rsquo;intero movimento in una forma che si ricorda senza formule. La quantit&agrave; $\lambda^3$ &egrave; il <b>volume termico</b> di una particella: le dimensioni del pacchetto d&rsquo;onda che la rappresenta alla temperatura $T$. Crisanti (pag. 229) la introduce esattamente cos&igrave;: «gli atomi di un gas sono nella realt&agrave; dei pacchetti d&rsquo;onde. Si possono descrivere come palle da biliardo ad alte temperature, poich&eacute; le loro dimensioni sono molto pi&ugrave; piccole delle distanze medie tra particelle. Tuttavia, quando le temperature si abbassano, le sovrapposizioni tra le funzioni d&rsquo;onda delle particelle non sono pi&ugrave; trascurabili».</p>
  <p>Allora $n\lambda^3$ &egrave; il <b>numero di particelle che stanno dentro il volume termico di una di esse</b>, e il criterio dice: finch&eacute; quel numero &egrave; minore di $2{,}612\,g_s$ le particelle riescono a starsene negli stati eccitati; oltre, no. <b>La condensazione non &egrave; un effetto di bassa temperatura n&eacute; di alta densit&agrave;: &egrave; un effetto di sovrapposizione</b>, e le due strade per ottenerla — raffreddare a densit&agrave; fissa, comprimere a temperatura fissa — sono la stessa strada percorsa in due direzioni.</p>
  <p><b>Il confronto con il regime classico chiarisce le scale</b> (<span class="str" data-str="ordini-di-grandezza">ordini di grandezza</span>). Grilli-Giardina (pag. 56) ricava la condizione di validit&agrave; della statistica di Maxwell-Boltzmann chiedendo che l&rsquo;occupazione media di ogni stato sia molto minore di uno, e trova $\lambda^3/v\ll1$, cio&egrave; esattamente la stessa combinazione con il verso opposto; ne d&agrave; anche l&rsquo;interpretazione giusta: «if you imagine our gas particles as being wavepackets with a width of $\lambda$ then you can think of each particle as occupying a volume $\lambda^3$. This has a nice interpretation: the quantity $N\lambda^3/V$ that appears in the expression for the chemical potential can be thought of as the fraction of space occupied by the particles». Il gas classico vive dove quella frazione &egrave; minuscola; la condensazione comincia dove vale un paio di unit&agrave;. <b>In mezzo non c&rsquo;&egrave; nessuna barriera</b>: &egrave; la stessa curva, e questo &egrave; il punto che rende sorprendente che ne esca una transizione di fase.</p>
  <p>Vale anche la pena osservare che cosa NON entra nel criterio. Non entra l&rsquo;interazione, perch&eacute; non c&rsquo;&egrave;. Non entra la forma del contenitore. Non entra la massa se non attraverso $\lambda$. <b>Entrano soltanto la densit&agrave;, la temperatura e la simmetria della funzione d&rsquo;onda</b> — e quest&rsquo;ultima solo attraverso il segno $-1$ al denominatore. Una transizione di fase che dipende da un segno &egrave; una cosa che vale la pena di aver visto una volta.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Il vincolo $\mu\le0$ &egrave; stato ricavato chiedendo che una serie geometrica converga. Non &egrave; un argomento matematico che nasconde la fisica, invece di mostrarla?`,
    a:R`&Egrave; il contrario: la divergenza della serie <i>&egrave;</i> la fisica. Il criterio invocato &egrave; la <b>condizione di convergenza della serie geometrica</b>, $|q|<1$ con $q=ze^{-\beta\varepsilon}$, e il suo significato &egrave; diretto: se la serie diverge, la gran partizione del livello &egrave; infinita, cio&egrave; il <b>numero medio di particelle su quel livello &egrave; infinito</b>. Un potenziale chimico sopra il livello fondamentale descriverebbe un sistema che risucchia dal serbatoio un numero illimitato di particelle: non &egrave; uno stato di equilibrio, &egrave; un&rsquo;instabilit&agrave;. Il conto e il fatto fisico sono la stessa cosa detta due volte. La spia che conviene ricordare per gli esercizi: <b>se in un problema bosonico viene fuori $\mu>\varepsilon_{\min}$, non &egrave; una soluzione da discutere, &egrave; un segnale che si &egrave; trascurato il livello fondamentale</b>.`},
   {q:R`Qual &egrave; la strategia per rispondere alla domanda «questo gas condensa?», e da dove si comincia?`,
    a:R`Si comincia <b>sempre</b> dalla densit&agrave; degli stati, e mai dalla temperatura. La sequenza &egrave;: <b>(1)</b> scrivere $H$ di singola particella e calcolare $G(\varepsilon)$ dalla definizione con la delta, usando il trucco della theta quando c&rsquo;&egrave; un potenziale esterno; <b>(2)</b> guardare il comportamento di $G$ a energia piccola e leggerne l&rsquo;esponente, cio&egrave; l&rsquo;$\alpha$ tale che $G\propto\varepsilon^{\alpha-1}$; <b>(3)</b> chiedersi se $\int_0 G(\varepsilon)\,d\varepsilon/(e^{\beta\varepsilon}-1)$ converge in zero — e poich&eacute; l&agrave; l&rsquo;occupazione si comporta come $1/(\beta\varepsilon)$, l&rsquo;integrando va come $\varepsilon^{\alpha-2}$ e la risposta dipende solo dal segno di $\alpha-1$. Il criterio che regge il passaggio &egrave; il <b>criterio del confronto per integrali impropri</b>: $\int_0\varepsilon^{-s}d\varepsilon$ converge se e solo se $s<1$. Solo se la risposta &egrave; «converge» si passa a calcolare $T_c$; altrimenti la risposta all&rsquo;esercizio &egrave; «non esiste», e va motivata con questo integrale, non con una frase.`}
  ]}
]},

/* ---------------- 02 · IL POTENZIALE CHIMICO CHE SI INCOLLA A ZERO ---------------- */
{ num:'02', title:'Il potenziale chimico che sale raffreddando, e si incolla a zero', meta:'le funzioni di Bose e il loro valore massimo · la pendenza infinita in z uguale a uno · la formula classica che sbaglia il punto di arrivo · quanto vale davvero mu sotto la transizione',
  blocchi:[
  {t:'reveal', title:'La corsa fra due lati di una equazione, e chi la perde', tag:'costruzione', steps:[
   {label:'Le funzioni di Bose, e il tetto scritto come valore di una funzione', body:R`
   <p>Conviene dare un nome alla famiglia di integrali della tappa precedente, perch&eacute; tutte e due le note lo fanno e negli esercizi si scrive cos&igrave;. Si definiscono le <b>funzioni di Bose</b></p>
   $$g_\nu(z)=\sum_{n\ge1}\frac{z^n}{n^\nu}$$
   <p>— sono i polilogaritmi, e la serie converge per $|z|\le1$ quando $\nu>1$. Ripetendo il conto della tappa 01 con $z$ tenuto generico invece che posto a uno si ottiene l&rsquo;identit&agrave; integrale che le collega alla densit&agrave; degli stati: la funzione $g_{3/2}(z)$ vale $(2/\sqrt\pi)\int_0^\infty y^{1/2}(z^{-1}e^y-1)^{-1}dy$, e Crisanti (pag. 280) la scrive esattamente in questa forma. Il numero di particelle negli stati eccitati diventa allora, in tre dimensioni,</p>
   $$\frac{N_{\rm ecc}}{V}=\frac{g_s}{\lambda^3}\,g_{3/2}(z)$$
   <p>Le due propriet&agrave; che contano sono entrambe in Crisanti (pag. 283). <b>La prima: il valore in $z=1$ &egrave; finito</b>, e vale</p>
   $$g_{3/2}(1)=\zeta(3/2)\simeq2{,}6124$$
   <p>il che ribadisce il tetto in un&rsquo;altra lingua: $g_{3/2}$ non supera mai $2{,}612$ su tutto l&rsquo;intervallo ammesso $z\in[0,1]$. <b>La seconda: la derivata in $z=1$ diverge</b>. Derivando la serie termine a termine si ottiene la regola che abbassa l&rsquo;indice di uno,</p>
   $$z\frac{dg_{3/2}}{dz}=g_{1/2}(z)$$
   <p>e in $z=1$ quella serie &egrave; $\sum_{n\ge1}n^{-1/2}$, che diverge — il criterio &egrave; il <b>confronto con l&rsquo;integrale</b>, perch&eacute;</p>
   $$\int_1^{\infty}\frac{dy}{\sqrt y}=+\infty$$
   <p>Crisanti lo annota in una riga: «&egrave; immediato che la derivata in $z=1$ diverge, ma il suo valore &egrave; finito». <b>Valore finito e pendenza infinita</b> sono esattamente le due propriet&agrave; che producono una transizione di fase: la funzione arriva al suo tetto con tangente verticale, cio&egrave; ci arriva <i>di colpo</i>.</p>
   <p>Di passaggio, la derivata positiva dice anche che $g_{3/2}$ &egrave; crescente, cio&egrave; che a ogni valore ammissibile del membro di sinistra corrisponde <b>uno e un solo</b> $z$. &Egrave; il controllo che Crisanti (pag. 280) fa prima di procedere, scrivendo la derivata come integrale di una quantit&agrave; manifestamente positiva: finch&eacute; una soluzione esiste, &egrave; unica.</p>`},
   {label:'Raffreddare a densità fissata: chi cresce e chi non può', body:R`
   <p>Adesso la corsa. Si tenga fissato il numero di particelle $N$ e il volume $V$, cio&egrave; la densit&agrave; $n$, e si abbassi la temperatura. Il membro di sinistra dell&rsquo;equazione che fissa la fugacit&agrave; &egrave; $n\lambda^3/g_s$, e la lunghezza d&rsquo;onda termica cresce al raffreddarsi:</p>
   $$n\lambda^3=\frac{nh^3}{(2\pi m)^{3/2}}\,T^{-3/2}$$
   <p>cio&egrave; <b>cresce senza limite</b> come $T^{-3/2}$. Il membro di destra, $g_{3/2}(z)$, pu&ograve; inseguire soltanto alzando $z$, e $z$ non pu&ograve; superare uno. <b>La corsa &egrave; persa in partenza</b>: esiste una temperatura, e una sola, in cui il sinistro raggiunge il valore massimo che il destro sa produrre. Al di sotto l&rsquo;equazione, cos&igrave; com&rsquo;&egrave; scritta, <i>non ha soluzione</i>.</p>
   <p>Questo &egrave; il punto in cui conviene fermarsi invece di correre al risultato, perch&eacute; qui si annida l&rsquo;errore che la tappa 04 mette a nudo. Un&rsquo;equazione di questo tipo, in fisica, non «non ha soluzione»: vuol dire che si &egrave; scritta male. Crisanti (pag. 281-282) lo tratta graficamente, ed &egrave; il disegno mentale da tenere: «grafichiamo $g_{3/2}(z)$; grafichiamo $\lambda^3z/(v(1-z))$; la loro somma deve fare $\lambda^3/v$». Il secondo pezzo, quello che qui non &egrave; ancora comparso, &egrave; il termine che salva l&rsquo;equazione — e Crisanti lo dichiara subito: «&egrave; chiave per capire cosa accade, e rappresentava $\bar n_0/V$, una frazione finita di stati nello stato fondamentale».</p>
   <p><b>Il comportamento del potenziale chimico</b> segue senza altri conti. Ad alta temperatura $n\lambda^3$ &egrave; minuscolo, dunque $g_{3/2}(z)$ &egrave; minuscolo, dunque $z\simeq n\lambda^3/g_s$ &egrave; vicino a zero e $\mu=T\log z$ &egrave; molto negativo. Raffreddando, $z$ sale, $\mu$ sale, e arriva a zero <b>a temperatura finita</b>: arrivato l&igrave;, non pu&ograve; andare oltre e ci resta incollato. &Egrave; un comportamento che non ha analogo classico e nemmeno fermionico — per i fermioni $\mu$ sale fino all&rsquo;energia di Fermi e si ferma l&igrave; perch&eacute; ci arriva <i>asintoticamente</i>, senza nessun vincolo che glielo imponga.</p>`},
   {label:'La formula classica, e di quanto sbaglia il punto di arrivo', body:R`
   <p>Vale la pena vedere quanto una descrizione classica mancherebbe il bersaglio, perch&eacute; l&rsquo;errore &egrave; grande e istruttivo. Nel limite di Boltzmann l&rsquo;occupazione media &egrave; $\langle n_\varepsilon\rangle\simeq e^{\beta(\mu-\varepsilon)}$, l&rsquo;integrale si fa con la sola gaussiana e il potenziale chimico vale</p>
   $$\mu_{\rm cl}=-T\log\left(\frac{g_sv}{\lambda^3}\right)$$
   <p>come scrivono Grilli-Giardina (pag. 100) — che lo ricavano imponendo che $e^{-\beta\mu}$ valga $g_sV(2\pi mT/h^2)^{3/2}/N$ — e Crisanti nella parte classica. &Egrave; la prima approssimazione della curva vera, e coincide con essa a temperature alte.</p>
   <p><b>Dove questa formula manda $\mu$ a zero?</b> Il logaritmo si annulla quando il volume termico $\lambda^3$ eguaglia $g_sv$, cio&egrave; quando il numero $n\lambda^3$ vale $g_s$. Ma il criterio vero, quello della tappa 01, pretende che $n\lambda^3$ valga $g_s\zeta(3/2)$. Siccome $n\lambda^3$ va come $T^{-3/2}$, il rapporto fra le due temperature &egrave; un numero puro:</p>
   $$\frac{T_{\rm cl}}{T_c}=\zeta(3/2)^{2/3}\simeq1{,}8968$$
   <p><b>La formula classica fa incollare il potenziale chimico a zero a una temperatura quasi doppia di quella vera</b>, e nella fascia in mezzo prevede addirittura $\mu>0$ — che per un gas di bosoni &egrave; vietato, perch&eacute; renderebbe negativa l&rsquo;occupazione del fondamentale. Non &egrave; un errore quantitativo: &egrave; la spia che la descrizione classica &egrave; gi&agrave; fuori dal suo dominio ben prima della transizione. La sfumatura da tenere in mente, e che l&rsquo;esercizio d&rsquo;esame punisce, &egrave; che <b>non c&rsquo;&egrave; nessuna singolarit&agrave; a $T_{\rm cl}$</b>: quella temperatura non esiste in natura, &egrave; solo il punto dove una formula sbagliata si accorge di esserlo.</p>`},
   {label:'Quanto vale davvero mu sotto la transizione, e perché «zero» è una approssimazione ottima', body:R`
   <p>Sotto $T_c$ si dice che $\mu=0$, e conviene sapere in che senso. L&rsquo;occupazione del livello fondamentale &egrave; $N_0=(e^{-\beta\mu}-1)^{-1}$, e per $|\mu|\ll T$ si sviluppa l&rsquo;esponenziale. Il limite che regola il passaggio &egrave;</p>
   $$\lim_{\mu\to0^-}\frac{\mu}{e^{-\mu/T}-1}=-T$$
   <p>cio&egrave; $N_0\simeq-T/\mu$, e invertendo</p>
   $$\mu\simeq-\frac{T}{N_0}$$
   <p><b>Il potenziale chimico non &egrave; zero: &egrave; dell&rsquo;ordine di $T$ diviso il numero di Avogadro.</b> Con $N_0\sim10^{22}$ particelle e $T\sim1$ K si ha $|\mu|/k_B\sim10^{-22}$ K (<span class="str" data-str="ordini-di-grandezza">ordini di grandezza</span>). Grilli-Giardina (pag. 101) lo scrive con una notazione che dice tutto, $\mu=0^-$, e aggiunge che per $T<T_c$ «il potenziale chimico &egrave; infinitesimo e negativo».</p>
   <p>Questo numero non &egrave; una curiosit&agrave;: &egrave; ci&ograve; che rende la transizione un fenomeno di <b>limite termodinamico</b>. In un sistema con dieci particelle $|\mu|$ sarebbe un decimo di $T$, cio&egrave; una quantit&agrave; ordinaria, e non ci sarebbe nessuno spigolo in nessuna curva. La condensazione &egrave; netta solo perch&eacute; $1/N$ &egrave; indistinguibile da zero — e la tappa 04 mostrer&agrave; che &egrave; esattamente lo stesso $1/N$ a decidere se il termine del fondamentale conti o no.</p>
   <div class="note"><b>Disaccordo (e): una $\lambda_0^3$ capovolta.</b> Crisanti a pag. 295 scrive per $N/V$ l&rsquo;espressione $(2\pi\hbar^2/(mT_0))^{3/2}g_{3/2}(1)$, che &egrave; $\lambda_0^3$ e non $1/\lambda_0^3$: una densit&agrave; scritta come un volume. A pag. 284 la stessa quantit&agrave; compare giusta, $(mT_0/2\pi\hbar^2)^{3/2}g_{3/2}(1)$, con l&rsquo;osservazione «rappresentano $N/V$». &Egrave; un refuso, non un errore di conto — i risultati successivi usano la versione corretta — ma <b>il controllo che lo scova &egrave; dimensionale e costa tre secondi</b>: $\lambda$ &egrave; una lunghezza, dunque $\lambda^3$ &egrave; un volume, dunque una densit&agrave; ci va <i>divisa</i>. Chi copia la riga di pag. 295 in un compito ottiene una temperatura critica elevata a $-1$.</div>`}
  ]},
  {t:'plot', title:'La funzione di Bose che arriva al suo tetto con tangente verticale',
   intro:R`$g_{3/2}(z)$ in funzione della fugacit&agrave; $z$, sull&rsquo;intervallo in cui la fugacit&agrave; pu&ograve; vivere. La linea tratteggiata &egrave; il tetto $\zeta(3/2)$. La curva disegnata &egrave; lo sviluppo di Robinson a tre termini, $\zeta(3/2)-2\sqrt{\pi\alpha}-\zeta(1/2)\alpha+\tfrac12\zeta(-1/2)\alpha^2$ con $\alpha=-\log z$, che su questo intervallo si discosta dalla serie esatta di meno del mezzo per cento: in $z=e^{-1/100}$ la serie vale $2{,}2725$, e lo sviluppo pure.`,
   plots:[
    {kind:'func2d', xr:[0.5,1], yr:[0,2.95], height:340, ticks:6,
     title:'valore finito, pendenza infinita',
     curves:[
      {f:'2.612375-2*sqrt(PI*(-log(x)))+1.4603545*(-log(x))-0.1039431*pow(log(x),2)', col:'#4c8dff', label:'g_3/2(z)'}
     ],
     segs:[{x1:0.5,y1:2.612375,x2:1,y2:2.612375,col:'#b98cff',dash:true,width:1.4,label:'tetto: zeta(3/2)',lx:0.72,ly:2.75}],
     marks:[{x:1,y:2.612375,label:'2,612',col:'#b98cff',left:true,up:true}],
     xlabel:'fugacità z', ylabel:'g 3/2 (z)'}
   ],
   leggi:R`<p><b>Che cosa guardare: il punto in alto a destra.</b> La curva finisce su un valore finito, $2{,}612$, ma ci arriva con <b>pendenza verticale</b>. Sono due fatti indipendenti e servono tutti e due: se il valore fosse infinito non ci sarebbe nessun tetto e nessuna transizione; se la pendenza fosse finita, la densit&agrave; degli stati eccitati risponderebbe dolcemente al variare di $z$ e non ci sarebbe niente di singolare.</p>
   <p><b>Che cosa guardare: la forma della salita.</b> Vicino a $z=1$ la curva sale come $-2\sqrt{\pi\alpha}$ con $\alpha=-\log z$, cio&egrave; come la <i>radice</i> della distanza dal bordo. &Egrave; questa radice quadrata — non la funzione, non il suo valore — a generare l&rsquo;esponente $3/2$ della frazione condensata e la cuspide del calore specifico. Un esercizio in dimensione diversa cambia l&rsquo;indice $\nu$, e con esso la potenza con cui la curva tocca il tetto: l&igrave; cambiano tutti gli esponenti della transizione.</p>
   <p><b>Che cosa impararne per i conti.</b> L&rsquo;equazione che fissa la fugacit&agrave; &egrave; «questa curva deve valere $n\lambda^3/g_s$». Raffreddando, il numero a destra sale, e il punto di lavoro scivola verso destra. <b>La transizione &egrave; il momento in cui il punto di lavoro raggiunge il bordo del grafico</b>, non un momento in cui succede qualcosa alla curva. Tutta la singolarit&agrave; della transizione &egrave; nel fatto che il dominio di $z$ <i>finisce</i>.</p>
   <p><b>Dove questa figura mente.</b> Disegna una curva liscia fino a $z=1$ incluso, mentre la derivata l&igrave; non esiste: il tratto finale &egrave; disegnato dal campionamento del canvas, non dalla matematica. E si ferma a $z=0{,}5$ perch&eacute; lo sviluppo usato perde precisione ad $\alpha$ grande: la serie esatta continua fino a $z=0$, dove vale zero.</p>`},
  {t:'plot', title:'Dove il potenziale chimico si incolla, e dove la formula classica crede che si incolli',
   intro:R`Potenziale chimico in unit&agrave; di $k_BT_c$, in funzione di $T/T_c$, per un gas di bosoni senza spin. La curva piena &egrave; il risultato esatto sotto la transizione ($\mu=0$) e lo sviluppo vicino a $T_c$ appena sopra; la tratteggiata &egrave; la formula classica $\mu_{\rm cl}=-T\log(v/\lambda^3)$, esatta su tutto il tratto disegnato.`,
   plots:[
    {kind:'func2d', xr:[0.35,2.3], yr:[-0.8,0.9], height:340, ticks:6,
     title:'il tratto piatto, e i due punti in cui una curva tocca lo zero',
     curves:[
      {f:'-1.5*x*log(x)+x*log(2.612375)', col:'#d8a13a', dash:true, label:'classico (esatto)'},
      {f:'x<1?0:(x<1.2?-x*pow(2.612375*(1-pow(x,-1.5)),2)/(4*PI):1e9)', col:'#4c8dff', width:2.6, label:'Bose'}
     ],
     segs:[{x1:1,y1:-0.8,x2:1,y2:0.35,col:'#5eead4',dash:true,width:1.4,label:'T_c',lx:1.03,ly:0.3}],
     marks:[{x:1,y:0,label:'qui si incolla',col:'#4c8dff'},{x:1.8968,y:0,label:'1,8968',col:'#d8a13a',up:true}],
     xlabel:'T / T_c', ylabel:'mu / (k_B T_c)'}
   ],
   leggi:R`<p><b>Che cosa guardare: il tratto orizzontale.</b> A sinistra di $T_c$ la curva blu &egrave; <i>esattamente</i> piatta sullo zero, e non per approssimazione grafica: il valore vero &egrave; $-T/N_0$, cio&egrave; venti ordini di grandezza sotto la risoluzione di qualunque disegno. Il potenziale chimico non pu&ograve; salire perch&eacute; sopra di lui c&rsquo;&egrave; il livello fondamentale, e l&igrave; si ferma.</p>
   <p><b>Che cosa guardare: i due zeri.</b> La curva classica tratteggiata taglia l&rsquo;asse a $T/T_c=1{,}8968$, quasi il doppio. Nella fascia fra $1$ e $1{,}897$ essa prevede $\mu>0$, cio&egrave; una zona in cui la formula classica <b>viola un vincolo di consistenza</b> del gas che pretende di descrivere — e questa, non il confronto numerico, &egrave; la ragione per cui la si abbandona.</p>
   <p><b>Che cosa impararne per i conti.</b> In un problema d&rsquo;esame, prima di lanciarsi in Bose, conviene stimare $n\lambda^3$: se vale molto meno di uno si &egrave; nel regime classico e le funzioni $g$ si possono troncare al primo termine, $g_\nu(z)\simeq z$; se vale attorno a due o pi&ugrave;, non c&rsquo;&egrave; scorciatoia e si deve passare da $\zeta(3/2)$. <b>Il numero che decide quale strada prendere &egrave; sempre lo stesso</b>, e si calcola in due righe.</p>
   <p><b>Dove questa figura mente.</b> La curva blu &egrave; disegnata solo fino a $T/T_c=1{,}2$, e l&igrave; usa l&rsquo;inversione a due termini dello sviluppo vicino al bordo, che a $1{,}2$ sbaglia $\mu$ di circa il venti per cento su un valore gi&agrave; piccolissimo. Pi&ugrave; in alto la curva vera scende e si avvicina alla tratteggiata da sotto, senza mai toccarla: la si &egrave; omessa invece di disegnarla a occhio.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Anche nel gas di fermioni il potenziale chimico tende a un valore fisso raffreddando, l&rsquo;energia di Fermi. Che differenza c&rsquo;&egrave; con questo «incollarsi» a zero?`,
    a:R`La differenza &egrave; fra un limite e un <b>vincolo</b>, e si vede nel dominio della fugacit&agrave;. Per i fermioni la serie di occupazione ha due soli termini e converge sempre: $z$ vive in $[0,\infty)$, $\mu$ pu&ograve; assumere qualunque valore reale, e il fatto che tenda a $\varepsilon_F$ &egrave; la <i>soluzione</i> di un&rsquo;equazione, raggiunta con una correzione continua in $T^2$. Per i bosoni il criterio invocato &egrave; la <b>condizione di convergenza della serie geometrica</b>, che chiude il dominio: $z\in[0,1]$, e $\mu=0$ non &egrave; un limite asintotico ma un <i>bordo</i>, raggiunto a temperatura finita e poi non pi&ugrave; abbandonato. La conseguenza osservabile &egrave; che le grandezze termodinamiche bosoniche hanno una <b>singolarit&agrave;</b> in $T_c$ — una cuspide nel calore specifico — mentre quelle fermioniche sono analitiche ovunque.`},
   {q:R`Il tetto di $g_{3/2}$ vale $2{,}612$. Che cosa succederebbe se valesse infinito, e in quali sistemi succede davvero?`,
    a:R`Non ci sarebbe nessuna condensazione: per ogni densit&agrave; e ogni temperatura l&rsquo;equazione che chiede a $g_{3/2}(z)$ di valere $n\lambda^3/g_s$ avrebbe una soluzione con $z<1$, il livello fondamentale resterebbe con un&rsquo;occupazione ordinaria e la termodinamica sarebbe una funzione liscia di $T$. Il criterio da invocare &egrave; sempre lo stesso — <b>la convergenza dell&rsquo;integrale $\int_0\varepsilon^{\alpha-2}d\varepsilon$</b> — e succede davvero ogni volta che $\alpha\le1$: il gas libero in <b>due</b> dimensioni, dove $g_1(z)=-\log(1-z)$ &egrave; illimitata, e il gas libero in una dimensione. In due dimensioni si pu&ograve; addirittura risolvere per intero: da $n\lambda^2$ pari a $-\log(1-z)$ segue $z=1-e^{-n\lambda^2}$, che &egrave; strettamente minore di uno a ogni temperatura finita, con $\mu=T\log\left(1-e^{-n\lambda^2}\right)$ esponenzialmente vicino a zero ma mai uguale. <b>&Egrave; il modo pi&ugrave; pulito di vedere che $T_c=0$</b>: non che la condensazione «quasi» avvenga, ma che il suo punto di arrivo sia lo zero assoluto.`}
  ]}
]},

/* ---------------- 03 · LA TEMPERATURA CRITICA IN TRE DIMENSIONI ---------------- */
{ num:'03', title:'La temperatura critica del gas libero in tre dimensioni, e i numeri veri', meta:'imporre z uguale a uno e invertire · le tre scritture della stessa formula · elio liquido e atomi in trappola · una tabella che non si riproduce',
  blocchi:[
  {t:'reveal', title:'Dal criterio alla formula, e dalla formula ai kelvin', tag:'costruzione', steps:[
   {label:'Invertire il criterio critico', body:R`
   <p>La temperatura critica &egrave; definita come quella in cui il tetto viene raggiunto esattamente, cio&egrave; in cui l&rsquo;equazione ha soluzione $z=1$ e non oltre. Si impone dunque</p>
   $$n\lambda_c^3=g_s\zeta(3/2)$$
   <p>e si inverte rispetto alla temperatura. Con $\lambda^3$ pari a $(h^2/2\pi mT)^{3/2}$ la condizione diventa che $(h^2/2\pi mT_c)^{3/2}$ valga $g_s\zeta(3/2)/n$; elevando alla $2/3$ e isolando $T_c$ resta $h^2n^{2/3}/\left(2\pi m(g_s\zeta(3/2))^{2/3}\right)$, e usando $h=2\pi\hbar$ per far comparire la costante ridotta:</p>
   $$T_c=\frac{2\pi\hbar^2}{mk_B}\left(\frac{n}{g_s\zeta(3/2)}\right)^{2/3}$$
   <p>dove si &egrave; rimesso $k_B$ per avere kelvin invece di joule, secondo la convenzione di Falcioni-Vulpiani. <b>Tre cose vanno lette prima dei numeri.</b> La prima: $T_c$ cresce come $n^{2/3}$, esattamente come l&rsquo;energia di Fermi di un gas di fermioni — non &egrave; una coincidenza, &egrave; la stessa combinazione $\hbar^2n^{2/3}/m$, cio&egrave; l&rsquo;unica energia che si pu&ograve; costruire con una massa, una densit&agrave; e la costante di Planck. La seconda: $T_c$ va come $1/m$, quindi <b>le particelle leggere condensano pi&ugrave; in alto</b>, ed &egrave; il motivo per cui l&rsquo;elio-4 ce la fa a due kelvin e un gas di rubidio ha bisogno di centomila volte meno. La terza: il fattore di spin entra alla potenza $-2/3$, cio&egrave; <b>una degenerazione interna maggiore abbassa $T_c$</b>, perch&eacute; offre pi&ugrave; stati eccitati in cui le particelle possono nascondersi.</p>
   <div class="note"><b>Disaccordo (b): dove sta il fattore di spin.</b> Grilli-Giardina (pag. 99-100) lo porta esplicito dappertutto, scrivendo $g_s\int G(\varepsilon)\,n(\varepsilon)\,d\varepsilon$ e riportandolo nella formula di $T_c$. Crisanti (pag. 284) scrive la stessa formula <b>senza</b> $g_s$, cio&egrave; nel caso $g_s=1$, e la giustifica implicitamente perch&eacute; l&rsquo;esempio che ha in mente &egrave; l&rsquo;elio-4, che ha spin zero. Poi per&ograve; a pag. 294 reintroduce un $g$ nell&rsquo;energia, dove <b>non ci va</b>: si semplifica contro quello nascosto in $N$, come si vedr&agrave; nella tappa 07. La regola operativa: <b>si porta $g_s$ esplicito ovunque e lo si lascia semplificare da solo</b>; chi lo mette a mano solo dove se lo ricorda sbaglia una volta su due.</div>`},
   {label:'Le tre scritture della stessa formula, e come riconoscerle', body:R`
   <p>La stessa temperatura compare nelle due note in tre forme diverse, e all&rsquo;esame conviene riconoscerle a colpo d&rsquo;occhio invece di ricavarle. Grilli-Giardina (pag. 100) la scrive partendo dall&rsquo;integrale non ridotto, quindi con la <span class="str" data-str="funzione-gamma">Gamma</span> in evidenza:</p>
   $$T_c=\frac{\hbar^2}{2m}\left(\frac{4\pi^2}{g_s\Gamma(3/2)\zeta(3/2)}\right)^{2/3}\left(\frac NV\right)^{2/3}$$
   <p>e ne d&agrave; la versione numerica $3{,}31\,g_s^{-2/3}\hbar^2n^{2/3}/m$. Crisanti (pag. 283-284) la scrive con il volume specifico, $T_0=(2\pi\hbar^2/m)\left(vg_{3/2}(1)\right)^{-2/3}$. <b>Sono la stessa cosa</b>, e il controllo si fa sul coefficiente numerico: la forma di Grilli-Giardina d&agrave;</p>
   $$\frac12\left(\frac{4\pi^2}{\Gamma(3/2)\zeta(3/2)}\right)^{2/3}\simeq3{,}3125$$
   <p>e la forma compatta d&agrave; lo stesso numero per un&rsquo;altra strada,</p>
   $$\frac{2\pi}{\zeta(3/2)^{2/3}}\simeq3{,}3125$$
   <p>— che coincidano non &egrave; ovvio guardandole, e la ragione &egrave; l&rsquo;identit&agrave;
   $$\Gamma(3/2)=\sqrt\pi/2$$
   <p>che che trasforma $4\pi^2/\Gamma(3/2)$ in $8\pi^{3/2}$ e rende $(4\pi^2)^{2/3}$ pari a $(2\pi)^{4/3}$. <b>Il controllo numerico di coerenza fra due scritture &egrave; gratis e va sempre fatto</b>: un $\pi$ perso in un passaggio non si vede rileggendo la formula, si vede confrontando due numeri.</p>
   <p>Crisanti aggiunge una terza lettura che negli esercizi &egrave; comoda: a temperatura fissata si pu&ograve; definire un <b>volume specifico critico</b> $v_0=\lambda^3/g_{3/2}(1)$, e «la regione di condensazione si pu&ograve; quindi definire come quella in cui $T<T_0$ oppure $v<v_0$». Sono due tagli della stessa superficie bidimensionale nello spazio $(P,v,T)$, e un problema che chieda «a quale densit&agrave; condensa a temperatura ambiente» va attaccato dalla seconda.</p>`},
   {label:'I numeri veri, e quanto la teoria senza interazioni azzecca', body:R`
   <p>Il caso storico &egrave; l&rsquo;<b>elio-4 liquido</b>, che ha spin nucleare ed elettronico entrambi nulli, dunque $g_s=1$. La densit&agrave; del liquido a bassa temperatura corrisponde a circa $2{,}18\times10^{28}$ atomi al metro cubo, e con $m=4{,}0026$ unit&agrave; di massa atomica la formula d&agrave; (<span class="str" data-str="ordini-di-grandezza">ordini di grandezza</span>)</p>
   $$T_c\simeq3{,}13\ \text{K}$$
   <p>in ottimo accordo con il valore che Crisanti riporta a pag. 299: «si determina un valore teorico $T_0=3{,}14$ K mentre la misura sperimentale per He-4 fornisce un valore $T_0=2{,}18$ K». <b>Lo scarto &egrave; del quaranta per cento, ed &egrave; tutto interazione</b>: l&rsquo;elio liquido non &egrave; un gas ideale, i suoi atomi si respingono a corto raggio, e la repulsione ostacola l&rsquo;accumulo nello stato fondamentale. Crisanti conclude con misura: «poich&eacute; alla fine le interazioni, che abbiamo trascurato, in realt&agrave; ci sono, possiamo affermare che l&rsquo;accordo teoria-esperimento non &egrave; poi cos&igrave; male». &Egrave; il giudizio giusto: un modello senza nessun parametro libero che indovina la temperatura di una transizione entro il quaranta per cento ha capito il meccanismo, anche se sbaglia il numero.</p>
   <p>Il caso moderno &egrave; un gas di <b>rubidio-87</b> in trappola magnetica, dove la condensazione &egrave; stata osservata per la prima volta nel 1995. L&igrave; la densit&agrave; &egrave; nove ordini di grandezza pi&ugrave; bassa — attorno a $2{,}6\times10^{19}$ atomi al metro cubo, un milionesimo della densit&agrave; dell&rsquo;aria — e la massa duecento volte pi&ugrave; grande, per cui la formula d&agrave; una temperatura critica dell&rsquo;ordine di $162$ nanokelvin. <b>Questo &egrave; il rovescio istruttivo del caso dell&rsquo;elio</b>: a densit&agrave; cos&igrave; basse le interazioni sono davvero trascurabili, il gas ideale &egrave; una descrizione eccellente, e il prezzo da pagare &egrave; una temperatura un miliardo di volte pi&ugrave; bassa. Non si pu&ograve; avere entrambe le cose: o il gas &egrave; abbastanza rarefatto da essere ideale, o &egrave; abbastanza denso da condensare a temperature raggiungibili.</p>
   <div class="note"><b>Disaccordo (f): una tabella che non si riproduce con la formula stampata sopra di essa.</b> Crisanti (pag. 230) definisce la <b>temperatura di degenerazione</b> $T_0$ dalla condizione $n\lambda^3\simeq1$, che d&agrave; $k_BT_0=(2\pi\hbar^2/m)n^{2/3}$, e la tabula per tre sistemi: idrogeno gassoso a $2\times10^{19}$ cm$^{-3}$ con $T_0=5\times10^{-2}$ K, elio liquido a $2\times10^{22}$ cm$^{-3}$ con $T_0=2$ K, elettroni in un metallo a $1\times10^{22}$ cm$^{-3}$ con $T_0=10^{4}$ K. Rifacendo il conto con la sua formula e le sue densit&agrave; vengono invece $0{,}111$ K, $5{,}61$ K e $25{,}8$ migliaia di kelvin: <b>i tre valori tabulati sono due-tre volte pi&ugrave; bassi</b>. Due di essi ($0{,}111/1{,}897\simeq0{,}059$ e $25{,}8/1{,}897\simeq13{,}6$) si avvicinano molto a quello che si otterrebbe usando il criterio con $\zeta(3/2)$ al posto di $1$, cio&egrave; alla vera $T_c$; l&rsquo;entrata dell&rsquo;elio, $2$ K, non &egrave; n&eacute; l&rsquo;una n&eacute; l&rsquo;altra — &egrave; vicina al punto lambda misurato. <b>Conclusione operativa: quella tabella si usa per gli ordini di grandezza e mai per un numero</b>, e la temperatura di degenerazione non va confusa con la temperatura critica, da cui differisce per il fattore puro $\zeta(3/2)^{2/3}$.</p></div>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Un esercizio d&rsquo;esame d&agrave; una densit&agrave; e chiede $T_c$. Qual &egrave; la sequenza da eseguire, e quale controllo si fa alla fine?`,
    a:R`<b>(1)</b> Calcolare $G(\varepsilon)$ dalla definizione con la delta — mai partire dalla formula di $T_c$, che vale solo per il gas libero in tre dimensioni. <b>(2)</b> Scrivere $N=g_s\int_0^\infty G(\varepsilon)(e^{\beta\varepsilon}-1)^{-1}d\varepsilon$ con $z=1$, cio&egrave; imporre di essere esattamente alla soglia. <b>(3)</b> Ridurre l&rsquo;integrale con la sostituzione $y=\beta\varepsilon$ e il risultato $\Gamma(x)\zeta(x)$, che &egrave; il criterio tecnico invocato ogni volta. <b>(4)</b> Invertire rispetto a $T_c$. <b>Il controllo finale &egrave; dimensionale e va sempre fatto</b>: $T_c$ deve venire proporzionale a $\hbar^2n^{2/d}/m$ in $d$ dimensioni per una dispersione quadratica, perch&eacute; quella &egrave; l&rsquo;unica energia costruibile con i dati. Se compare una massa al numeratore o un $\hbar$ alla prima potenza, si &egrave; perso un passaggio.`},
   {q:R`Perch&eacute; un gas di elettroni in un metallo, che &egrave; molto pi&ugrave; degenere di qualunque condensato mai prodotto, non condensa?`,
    a:R`Perch&eacute; gli elettroni sono fermioni, e il criterio che decide non &egrave; la degenerazione ma la <b>simmetria della funzione d&rsquo;onda</b>. Il numero $n\lambda^3$ per gli elettroni di un metallo a temperatura ambiente vale migliaia, cio&egrave; centinaia di volte sopra la soglia $\zeta(3/2)$, e se fossero bosoni sarebbero condensati da un pezzo; ma il <b>principio di esclusione di Pauli</b> proibisce a due di essi di occupare lo stesso stato, quindi il livello fondamentale ne ospita al massimo $g_s$, e la somma sugli stati non ha nessun termine singolare da perdere. Il punto da portarsi via &egrave; che <b>il conto della densit&agrave; degli stati e della lunghezza d&rsquo;onda termica &egrave; identico per le due specie</b>: cambia soltanto il segno al denominatore della distribuzione, e da quel segno dipende se il sistema costruisce un mare di Fermi oppure un condensato. Una nota a margine che vale: coppie legate di elettroni <i>sono</i> bosoni, ed &egrave; da l&igrave; che passa la superconduttivit&agrave;.`}
  ]}
]},

/* ---------------- 04 · IL TERMINE p=0 PERDUTO ---------------- */
{ num:'04', title:'Il termine di impulso nullo, perduto nella sostituzione della somma con l integrale', meta:'il conto ingenuo che fa sparire le particelle · dove sta lo zero per infinito · la separazione del livello fondamentale · e perché il condensato non fa pressione',
  blocchi:[
  {t:'reveal', title:'Prima il conto sbagliato, e la conclusione assurda a cui porta', tag:'costruzione', steps:[
   {label:'Il passaggio che sembra innocuo', body:R`
   <p>Tutto quello che si &egrave; scritto finora poggia su una sostituzione che in meccanica statistica si fa cento volte senza pensarci: nel limite termodinamico i livelli di impulso diventano fitti e la somma su di essi si scrive come integrale,</p>
   $$\sum_{\vec p}\;\longrightarrow\;\frac{g_sV}{h^3}\int d^3p$$
   <p>Crisanti (pag. 233) la introduce come un&rsquo;identit&agrave; del limite termodinamico, e in tutto il resto della meccanica statistica lo &egrave;. Da l&igrave; segue la forma integrale del numero di particelle, cio&egrave; l&rsquo;equazione con cui si &egrave; lavorato fin qui:</p>
   $$N=\frac{g_sV}{\lambda^3}\,g_{3/2}(z)$$
   <p>Adesso si prenda questa equazione sul serio e la si porti sotto $T_c$, tenendo fissi $N$ e $V$ come il problema pretende. Poich&eacute; $g_{3/2}(z)\le\zeta(3/2)$ e $\lambda^{-3}$ diminuisce raffreddando, il membro di destra ha un massimo, e sotto $T_c$ quel massimo &egrave; <b>minore di $N$</b>. L&rsquo;equazione, presa alla lettera, dice che il numero di particelle &egrave; diminuito.</p>
   <p>Grilli-Giardina (pag. 100) si ferma esattamente qui, e vale la pena riportare il passaggio per intero perch&eacute; &egrave; il modo giusto di trattare un risultato che non torna: <i>&laquo;What happens if we try to decrease the temperature below $T_c$? Taken at face value, equation (10.12) tells us that the number of particles should decrease. But that&rsquo;s a stupid conclusion! It says that we can make particles disappear by making them cold. Where did they go? We may be working in the grand canonical ensemble, but in the thermodynamic limit we expect $\Delta N\sim1/\sqrt N$ which is too small to explain our missing particles. Where did we misplace them? It looks as if we made a mistake in the calculation. In fact, we did make a mistake in the calculation. It happened right at the beginning when we replaced the sum with the integral.&raquo;</i></p>
   <p><b>Questa &egrave; la crepa da cui esce il condensato</b>, e conviene guardarla mentre &egrave; ancora una crepa. Non si tratta di un&rsquo;approssimazione un po&rsquo; grossolana che d&agrave; un errore del qualche per cento: si tratta di una formula che, sotto $T_c$, perde una <i>frazione finita</i> delle particelle — e a temperatura nulla le perde tutte.</p>`},
   {label:'Dov è l errore: uno zero moltiplicato per un infinito', body:R`
   <p>La sostituzione somma-integrale assegna a ciascun livello un peso proporzionale alla densit&agrave; degli stati, e in tre dimensioni</p>
   $$\lim_{\varepsilon\to0}G(\varepsilon)=0$$
   <p>come si &egrave; gi&agrave; osservato nella tappa 01. <b>Il livello fondamentale riceve peso nullo.</b> Nella somma discreta quel livello c&rsquo;era ed era uno dei termini; nell&rsquo;integrale ha misura nulla e sparisce. Grilli-Giardina lo dice in nota con tre parole: «it is given a zero weight».</p>
   <p>Finora questo non sarebbe un problema — un termine su $10^{22}$ non si vede — se non fosse che <b>proprio quel termine pu&ograve; diventare macroscopico</b>. La sua occupazione, ponendo $\varepsilon=0$ nella distribuzione, vale</p>
   $$\frac{1}{z^{-1}e^{\beta\cdot0}-1}=\frac{z}{1-z}$$
   <p>e diverge per $z\to1^-$. Si sta dunque moltiplicando uno zero (il peso) per un infinito (l&rsquo;occupazione), e <b>il prodotto non &egrave; zero: dipende da come i due limiti si prendono</b>. Grilli-Giardina (pag. 99) lo segnala prima ancora di arrivare al problema: «for the ideal Bose gas the summands diverge as $z\to1$, because the single term corresponding to $p=0$ diverges. Thus the single term $p=0$ may be as important as the entire sum».</p>
   <p><b>Quanto vicino a uno deve stare $z$ perch&eacute; il termine conti?</b> Invertendo l&rsquo;occupazione,</p>
   $$\frac{z}{1-z}=\frac{1}{1-z}-1$$
   <p>dunque avere $N_0$ particelle nel fondamentale richiede una fugacit&agrave; tale che
   $$1-z=\frac{1}{N_0+1}$$
   <p> Per $N_0$ dell&rsquo;ordine di $N$ serve che $z$ disti da uno di <b>una parte su $N$</b>: nel limite termodinamico &egrave; indistinguibile da uno, ed &egrave; il motivo per cui l&rsquo;equazione senza quel termine sembra funzionare fino all&rsquo;ultimo istante e poi cede di colpo.</p>`},
   {label:'Perché si perde UN solo termine, e non i primi dieci', body:R`
   <p>Resta una domanda che il conto ingenuo non pone e che invece decide se la riparazione &egrave; onesta: se l&rsquo;integrale sbaglia sul livello fondamentale, perch&eacute; non sbaglia anche sul primo eccitato, sul secondo, e cos&igrave; via? La risposta &egrave; quantitativa, e Crisanti (pag. 282) la imposta stimando il primo livello eccitato di una scatola cubica di lato $L$, dove l&rsquo;impulso minimo non nullo &egrave; $2\pi\hbar/L$ e quindi $\varepsilon_1=(2\pi\hbar)^2/(2mV^{2/3})$.</p>
   <p>Per $\varepsilon_1\ll T$ l&rsquo;occupazione si espande — il limite che regge il passaggio &egrave;</p>
   $$\langle n_1\rangle\simeq\frac{T}{\varepsilon_1}$$
   <p>ottenuto da $\lim_{\varepsilon\to0^+}\varepsilon/(e^{\varepsilon/T}-1)=T$ — e siccome $\varepsilon_1\propto V^{-2/3}$, si ha $\langle n_1\rangle\propto V^{2/3}$. Crisanti conclude: «$\frac1Vn_1\simeq V^{-1/3}$; $n_2$ ancora pi&ugrave; rapidamente, eccetera. In altre parole $n_1,n_2,\dots$ diventano piccoli e sono quindi valutati dall&rsquo;integrale, tutti tranne $n_0$».</p>
   <p><b>I numeri rendono l&rsquo;argomento indiscutibile.</b> Per l&rsquo;elio-4 in un cubo di un centimetro di lato, il primo livello eccitato sta a</p>
   $$\frac{\varepsilon_1}{k_B}\simeq2{,}39\times10^{-14}\ \text{K}$$
   <p>e a un kelvin la sua occupazione vale</p>
   $$\langle n_1\rangle\simeq4{,}18\times10^{13}$$
   <p>che &egrave; un numero enorme in assoluto, ma su $10^{22}$ particelle &egrave; una parte su $2\times10^{8}$. <b>Il fondamentale, invece, ne pu&ograve; ospitare la met&agrave;.</b> La differenza fra i due casi non &egrave; di natura ma di scala: l&rsquo;occupazione di un livello va come $T/(\varepsilon-\mu)$, e per il fondamentale quel denominatore &egrave; $|\mu|\sim T/N$, mentre per il primo eccitato &egrave; $\varepsilon_1\sim V^{-2/3}$. Il primo &egrave; pi&ugrave; piccolo del secondo di ordini di grandezza, e <b>&egrave; per questo che si separa un termine e uno solo</b>.</p>`},
   {label:'La riparazione, e che cosa il condensato NON fa', body:R`
   <p>La cura &egrave; minima e si scrive in una riga: <b>si stacca il termine $p=0$ dalla somma e si sostituisce con l&rsquo;integrale solo il resto</b>. Grilli-Giardina (pag. 99) le d&agrave; un nome, «such a process is called regularization of the integral», e le due equazioni di stato diventano quelle che Crisanti (pag. 280) usa da subito:</p>
   $$\frac1v=\frac{g_s}{\lambda^3}g_{3/2}(z)+\frac1V\frac{z}{1-z}$$
   $$\frac PT=\frac{g_s}{\lambda^3}g_{5/2}(z)-\frac1V\log(1-z)$$
   <p><b>Adesso l&rsquo;equazione ha sempre soluzione</b>, a ogni temperatura e a ogni densit&agrave;, perch&eacute; il secondo addendo del numero di particelle &egrave; illimitato: per quanto grande sia $1/v$, esiste uno $z<1$ che lo realizza. La transizione non &egrave; pi&ugrave; un&rsquo;equazione che smette di funzionare — &egrave; il passaggio da un regime in cui il secondo addendo &egrave; trascurabile a uno in cui porta tutto il carico.</p>
   <p>Il termine aggiunto alla pressione merita invece un&rsquo;osservazione a parte, perch&eacute; contiene un risultato fisico forte. Sotto $T_c$ si ha $1-z\simeq1/N_0$, quindi $-\log(1-z)\simeq\log N_0$, e diviso per il volume:</p>
   $$\frac{\log N}{N}\to0$$
   <p>nel limite termodinamico, essendo $V$ proporzionale a $N$ a densit&agrave; fissata. <b>Il condensato non contribuisce alla pressione.</b> &Egrave; un fatto che vale la pena tenere separato dalla matematica che lo produce: le particelle nello stato di impulso nullo <i>non urtano le pareti</i>, perch&eacute; non hanno impulso da trasferire. Per lo stesso motivo non contribuiranno all&rsquo;energia, e nemmeno all&rsquo;entropia. <b>Il condensato &egrave; termodinamicamente inerte</b>, e tutto ci&ograve; che si misurer&agrave; sotto $T_c$ lo produce la sola frazione eccitata.</p>
   <div class="note"><b>Disaccordo (d): un segno che cambia il senso.</b> Crisanti a pag. 293, riscrivendo le due equazioni all&rsquo;inizio del capitolo di approfondimento, stampa il termine del fondamentale come $\frac1V\frac{z}{z-1}$, con il denominatore invertito. Alle pag. 280 e 283 lo stesso termine &egrave; scritto giusto, $\frac1V\frac{z}{1-z}$, e tutti i conti successivi usano quello. <b>Il controllo che lo scova in due secondi &egrave; il segno</b>: per $0<z<1$ la versione stampata a pag. 293 &egrave; <i>negativa</i>, cio&egrave; direbbe che il livello fondamentale contiene un numero negativo di particelle. Un&rsquo;occupazione &egrave; un conteggio e non pu&ograve; essere negativa: quando in un conto bosonico compare un numero di particelle negativo, il primo posto dove guardare non &egrave; l&rsquo;algebra ma il vincolo $\mu\le0$ e i segni al denominatore.</div>`}
  ]},
  {t:'plot', title:'I due addendi dell equazione, e perché con il secondo la soluzione esiste sempre',
   intro:R`I due termini che, sommati, devono dare $\lambda^3/v$: in blu la parte degli stati eccitati, $g_{3/2}(z)$, limitata da $\zeta(3/2)$; in oro la parte del livello fondamentale, $(\lambda^3/V)\,z/(1-z)$, illimitata. Per rendere le due curve confrontabili sullo stesso disegno si &egrave; scelto un sistema minuscolo, con $\lambda^3/V$ posto a $0{,}05$, cio&egrave; una ventina di celle termiche in tutto.`,
   plots:[
