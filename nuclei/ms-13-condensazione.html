    {kind:'func2d', xr:[0.5,1], yr:[0,5.4], height:340, ticks:6,
     title:'una funzione con il tetto, una senza, e la loro somma',
     curves:[
      {f:'2.612375-2*sqrt(PI*(-log(x)))+1.4603545*(-log(x))-0.1039431*pow(log(x),2)', col:'#4c8dff', label:'stati eccitati'},
      {f:'0.05*x/(1-x)', col:'#d8a13a', label:'livello fondamentale'},
      {f:'2.612375-2*sqrt(PI*(-log(x)))+1.4603545*(-log(x))-0.1039431*pow(log(x),2)+0.05*x/(1-x)', col:'#5eead4', width:2.6, label:'somma'}
     ],
     segs:[{x1:0.5,y1:2.612375,x2:1,y2:2.612375,col:'#b98cff',dash:true,width:1.4,label:'zeta(3/2)',lx:0.68,ly:2.42}],
     xlabel:'fugacità z', ylabel:'contributi a lambda^3 / v'}
   ],
   leggi:R`<p><b>Che cosa guardare: la curva oro, che non ha tetto.</b> Finch&eacute; $z$ sta lontano da uno il termine del fondamentale &egrave; invisibile — a $z=0{,}8$ vale $0{,}2$ contro i $2{,}2$ della curva blu. Ma sale come $1/(1-z)$ e supera qualunque valore. <b>&Egrave; per questo che la somma (verde) non ha tetto</b>, e per questo l&rsquo;equazione ha soluzione a ogni temperatura: il conto ingenuo si era limitato alla curva blu, che un tetto ce l&rsquo;ha.</p>
   <p><b>Che cosa guardare: dove le due si incrociano.</b> Il punto in cui la curva oro raggiunge la blu &egrave; l&rsquo;ingresso nella regione di condensazione: da l&igrave; in poi pi&ugrave; della met&agrave; delle particelle sta nel fondamentale. In questo sistema giocattolo l&rsquo;incrocio &egrave; ben visibile attorno a $z=0{,}98$; <b>in un sistema vero sta a $1-z\sim10^{-22}$</b>, cio&egrave; incollato al bordo destro, e le due curve sembrano non incontrarsi mai fino all&rsquo;istante in cui tutto succede in una volta.</p>
   <p><b>Che cosa impararne per i conti.</b> Nel limite termodinamico la curva oro degenera in un <b>muro verticale</b> posto esattamente in $z=1$: vale zero dovunque e infinito l&igrave;. Ed &egrave; proprio questa degenerazione che giustifica il modo in cui si risolvono gli esercizi — sopra $T_c$ si ignora il termine del fondamentale e si chiede a $g_{3/2}(z)$ di valere $n\lambda^3/g_s$; sotto $T_c$ si pone $z=1$ e si ricava $N_0$ per differenza. <b>Non si risolve mai l&rsquo;equazione completa</b>, e questa figura mostra perch&eacute; non serva farlo.</p>
   <p><b>Dove questa figura mente.</b> Il valore scelto per $\lambda^3/V$, cio&egrave; $0{,}05$, non descrive nessun sistema fisico: in un gas reale quel rapporto &egrave; dell&rsquo;ordine di $10^{-22}$, e la curva oro resterebbe schiacciata sull&rsquo;asse fino a un&rsquo;inezia dal bordo. Si &egrave; ingrandita di venti ordini di grandezza per poterla disegnare accanto all&rsquo;altra, e il prezzo &egrave; che l&rsquo;incrocio appare graduale mentre in realt&agrave; &egrave; una discontinuit&agrave; a tutti gli effetti pratici.</p>`},
  {t:'prosa', title:'La lezione oltre il caso: quando una somma non si può fare integrale', tag:'grammatica', html:R`
  <p>Vale la pena isolare che cosa &egrave; successo, perch&eacute; il meccanismo ritorna in fisica ben oltre questo movimento. Sostituire una somma con un integrale significa sostituire una misura discreta con una continua, e la sostituzione &egrave; lecita quando <b>nessun singolo addendo pesa quanto una frazione finita del totale</b>. &Egrave; una condizione sul comportamento della successione, non sulla sua lunghezza: si pu&ograve; avere $10^{22}$ termini e avere ugualmente un termine che li domina tutti.</p>
  <p>Qui la condizione salta perch&eacute; due cose accadono insieme e nessuna delle due, da sola, basterebbe. <b>La prima</b>: la densit&agrave; degli stati si annulla al fondo dello spettro, cosicch&eacute; la misura continua assegna peso nullo proprio al punto interessante. <b>La seconda</b>: la funzione da integrare diverge in quel medesimo punto, e diverge in modo controllato dal parametro $\mu$ che il vincolo sul numero di particelle spinge esattamente l&igrave;. La combinazione &egrave; una singolarit&agrave; di tipo $\delta$ nascosta dentro un integrando apparentemente regolare — e il modo corretto di trattarla &egrave; quello adottato: scriverla a parte, tenerla come un termine finito, e integrare il resto.</p>
  <p><b>Il controllo che generalizza</b>, ed &egrave; quello da portare agli esercizi: ogni volta che si sostituisce una somma con un integrale in presenza di un parametro che pu&ograve; avvicinarsi a una singolarit&agrave; dell&rsquo;integrando, si verifica separatamente il termine estremo. In pratica, in questo corso: <b>il termine del livello fondamentale va sempre separato in un problema bosonico, anche quando poi risulta trascurabile</b>. Scriverlo e vederlo svanire costa una riga; dimenticarlo costa l&rsquo;intero esercizio, perch&eacute; l&rsquo;errore non si manifesta come un numero sbagliato ma come una domanda senza risposta.</p>
  <p>Una nota che chiarisce l&rsquo;immagine, e che entrambe le fonti riportano da Huang: la parola «condensazione» qui non descrive niente che succeda nello spazio. Grilli-Giardina (pag. 102) lo scrive in maiuscoletto di avvertenza: <i>&laquo;it should be emphasized that this refers only to condensation in momentum space; no condensation actually occurs in the gas&raquo;</i>. Le particelle condensate riempiono il volume in modo <b>perfettamente uniforme</b> — sono nello stato di impulso nullo, dunque la loro funzione d&rsquo;onda &egrave; costante su tutta la scatola. Non c&rsquo;&egrave; nessuna goccia sul fondo del recipiente: c&rsquo;&egrave; un accumulo in un punto dello spazio degli <i>impulsi</i>, che &egrave; il pi&ugrave; delocalizzato degli stati possibili.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Se il problema nasce dal fatto che la densit&agrave; degli stati si annulla in zero, non basterebbe usare una $G(\varepsilon)$ pi&ugrave; accurata, che tenga conto del livello discreto?`,
    a:R`Non basterebbe, e capire perch&eacute; chiarisce la natura del fenomeno. Qualunque densit&agrave; degli stati <b>continua</b> assegna misura nulla a un punto: il criterio invocato &egrave; che <b>un singolo punto ha misura di Lebesgue nulla</b>, e nessun raffinamento della funzione $G$ pu&ograve; cambiarlo. Ci&ograve; che serve non &egrave; una $G$ migliore ma una $G$ di tipo diverso, cio&egrave; una misura con una componente atomica: formalmente si scriverebbe $G(\varepsilon)\to G_{\rm cont}(\varepsilon)+\delta(\varepsilon)$, e la delta &egrave; precisamente il termine che si &egrave; separato a mano. La versione operativa, che &egrave; quella da usare in un compito, &egrave; la separazione: la si scrive, si valuta il termine estremo, e se risulta trascurabile lo si butta <i>dopo</i> averlo guardato.`},
   {q:R`Grilli-Giardina osserva che nel gran canonico le fluttuazioni del numero di particelle vanno come $1/\sqrt N$, e che sono troppo piccole per spiegare le particelle mancanti. Perch&eacute; quel controllo &egrave; il passaggio decisivo del suo argomento?`,
    a:R`Perch&eacute; elimina l&rsquo;unica scappatoia plausibile prima di dichiarare l&rsquo;errore. Il calcolo &egrave; fatto nel gran canonico, dove $N$ non &egrave; fissato ma fluttua: si potrebbe sperare che la «sparizione» delle particelle sia un artefatto dell&rsquo;insieme scelto e che nel canonico non succeda. Il criterio che chiude la porta &egrave; l&rsquo;<b>equivalenza degli insiemi statistici nel limite termodinamico</b>, nella forma quantitativa $\Delta N/N\sim1/\sqrt N$: le fluttuazioni relative sono di ordine $10^{-11}$, mentre la discrepanza da spiegare &egrave; una <b>frazione finita</b> di $N$ — a temperatura nulla, tutte le particelle. Undici ordini di grandezza separano la spiegazione comoda dal fatto da spiegare, e solo dopo averlo verificato si ha il diritto di dire «abbiamo sbagliato il conto». <b>&Egrave; il modello di come si tratta un risultato assurdo</b>: prima si escludono le spiegazioni innocue con una stima, poi si cerca l&rsquo;errore.`}
  ]}
]},

/* ---------------- 05 · LA FRAZIONE CONDENSATA ---------------- */
{ num:'05', title:'La frazione condensata e il suo andamento sotto la temperatura critica', meta:'contare per differenza invece che per somma · la potenza tre mezzi · la pendenza in T critica · il parametro d ordine di una transizione senza interazioni',
  blocchi:[
  {t:'reveal', title:'Contare il condensato per differenza', tag:'costruzione', steps:[
   {label:'Il numero di particelle eccitate, e il solo posto da cui può venire la temperatura', body:R`
   <p>Sotto $T_c$ la fugacit&agrave; &egrave; incollata a uno a meno di una parte su $N$, dunque il numero di particelle negli stati eccitati &egrave; il massimo possibile, e vale esattamente</p>
   $$N_{\rm ecc}(T)=\frac{g_sV}{\lambda^3}\,\zeta(3/2)$$
   <p>Questa espressione ha una propriet&agrave; che rende il conto banale: <b>l&rsquo;unica grandezza che dipende dalla temperatura &egrave; $\lambda^{-3}$</b>, tutto il resto &egrave; fissato dal problema. E alla temperatura critica, per definizione, il massimo coincide con il numero totale: $N_{\rm ecc}(T_c)=N$. Basta allora fare il rapporto delle due, e i prefattori se ne vanno tutti:</p>
   $$\frac{N_{\rm ecc}(T)}{N}=\frac{\lambda_c^3}{\lambda^3}=\left(\frac{T}{T_c}\right)^{3/2}$$
   <p>Grilli-Giardina (pag. 101) esegue questo passaggio con una mossa di notazione che vale la pena copiare: definisce una funzione $\tilde N(T)$ «che non ha alcun significato fisico, dipendente dalla temperatura, e riproducente $N$ per $T=T_c$», cio&egrave; il membro di destra dell&rsquo;equazione senza il termine del fondamentale. Sopra $T_c$ quella funzione non &egrave; niente; sotto $T_c$ diventa il <i>numero vero</i> di particelle eccitate. <b>&Egrave; lo stesso oggetto che cambia significato attraversando la transizione</b>, ed &egrave; il modo pi&ugrave; economico di scrivere il conto. Crisanti (pag. 284-285) arriva allo stesso risultato per la via lunga, moltiplicando e dividendo per $T_0$ e riconoscendo che «gli ultimi fattori rappresentano $N/V$».</p>`},
   {label:'La frazione condensata, e come la si legge', body:R`
   <p>Le particelle che non stanno negli stati eccitati stanno nel fondamentale, e non c&rsquo;&egrave; altro posto: $N=N_0+N_{\rm ecc}$. Dunque</p>
   $$\frac{N_0}{N}=1-\left(\frac{T}{T_c}\right)^{3/2}$$
   <p>e questa singola formula contiene tutto il comportamento del condensato. A $T=T_c$ vale zero; a $T=0$ vale uno, cio&egrave; <b>tutte</b> le particelle sono nello stato fondamentale. Fra i due estremi cresce in modo monotono, e i due valori che conviene avere in testa per orientarsi sono: a met&agrave; della temperatura critica il condensato &egrave; gi&agrave; il</p>
   $$1-2^{-3/2}\simeq0{,}6464$$
   <p>cio&egrave; quasi due terzi del gas, e anche appena sotto la soglia — al novanta per cento di $T_c$ — c&rsquo;&egrave; gi&agrave;</p>
   $$1-(0{,}9)^{3/2}\simeq0{,}1462$$
   <p>cio&egrave; una particella su sette. <b>La crescita &egrave; ripida fin dall&rsquo;inizio</b>, e il motivo si legge nella derivata:</p>
   $$\frac{d}{dt}\left(1-t^{3/2}\right)=-\tfrac32\sqrt t$$
   <p>che in $t=1$ vale $-3/2$. Vicino alla transizione dunque $N_0/N\simeq\tfrac32\left(1-T/T_c\right)$: <b>l&rsquo;esordio &egrave; lineare con pendenza tre mezzi</b>. Un abbassamento dell&rsquo;uno per cento sotto $T_c$ porta gi&agrave; l&rsquo;uno e mezzo per cento del gas nel condensato, che per un campione macroscopico significa $10^{20}$ particelle nello stesso stato quantistico.</p>
   <p>La generalizzazione &egrave; immediata e verr&agrave; usata negli esercizi: se la densit&agrave; degli stati va come $\varepsilon^{\alpha-1}$, l&rsquo;unico esponente che cambia &egrave; quello, e $N_{\rm ecc}\propto T^\alpha$ al posto di $T^{3/2}$. <b>L&rsquo;esponente della frazione condensata &egrave; lo stesso numero $\alpha$ che decide se la condensazione esista</b>, e in un compito si legge dalla densit&agrave; degli stati prima ancora di fare qualunque integrale.</p>`}
  ]},
  {t:'plot', title:'Le due frazioni che si scambiano il gas attraversando la transizione',
   intro:R`Frazione di particelle nel condensato, $1-(T/T_c)^{3/2}$, e frazione negli stati eccitati, $(T/T_c)^{3/2}$, in funzione di $T/T_c$. Sopra la transizione la prima &egrave; identicamente nulla.`,
   plots:[
    {kind:'func2d', xr:[0,1.6], yr:[0,1.25], height:340, ticks:6,
     title:'il condensato che nasce a T critica con pendenza tre mezzi',
     curves:[
      {f:'x<1?1-pow(x,1.5):0', col:'#4c8dff', width:2.6, label:'condensato N0/N'},
      {f:'x<1?pow(x,1.5):1', col:'#5eead4', label:'stati eccitati'},
      {f:'x<1?1.5*(1-x):1e9', col:'#d8a13a', dash:true, label:'tangente in T_c'}
     ],
     segs:[{x1:1,y1:0,x2:1,y2:1.15,col:'#b98cff',dash:true,width:1.4,label:'T_c',lx:1.05,ly:1.1}],
     marks:[{x:0.5,y:0.6464,label:'0,6464',col:'#4c8dff'}],
     xlabel:'T / T_c', ylabel:'frazione'}
   ],
   leggi:R`<p><b>Che cosa guardare: l&rsquo;angolo in $T_c$.</b> La curva blu esce dallo zero con pendenza finita e non nulla — la tratteggiata &egrave; la sua tangente, di coefficiente $3/2$. Non &egrave; una partenza dolce: il condensato <b>non</b> si accende gradualmente, si accende con una derivata che salta da zero a tre mezzi. Questo salto nella derivata prima del parametro d&rsquo;ordine &egrave; la firma della transizione, e ricompare come cuspide nel calore specifico.</p>
   <p><b>Che cosa guardare: le due curve si sommano a uno ovunque.</b> Non c&rsquo;&egrave; nessun terzo posto dove le particelle possano stare, e ogni particella che lascia gli stati eccitati finisce nello stesso identico stato quantistico. <b>&Egrave; ci&ograve; che distingue questa transizione da una condensazione ordinaria</b>: non si forma una fase nuova con una struttura propria, si popola uno stato che c&rsquo;era gi&agrave;.</p>
   <p><b>Che cosa impararne per i conti.</b> L&rsquo;esponente $3/2$ non &egrave; un numero da ricordare: &egrave; l&rsquo;$\alpha$ della densit&agrave; degli stati del gas libero in tre dimensioni. In una trappola armonica tridimensionale diventa $3$, e la curva blu parte molto pi&ugrave; piatta; in una trappola bidimensionale diventa $2$. <b>Un esercizio che chieda «come varia $N_0/N$ con la temperatura» chiede in realt&agrave; l&rsquo;esponente della densit&agrave; degli stati</b>, e si risponde in una riga senza integrare niente.</p>
   <p><b>Dove questa figura mente.</b> Disegna la frazione condensata come esattamente nulla sopra $T_c$, mentre il valore vero &egrave; $N_0=z/(1-z)$ con $z<1$, cio&egrave; un numero piccolo ma positivo: a $1{,}1\,T_c$ il fondamentale contiene qualche migliaio di particelle. Su $10^{22}$ &egrave; zero a tutti gli effetti, ma «zero» qui significa «di ordine $N^0$ invece che $N^1$», e non «nessuna».</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`La frazione condensata &egrave; continua in $T_c$ e la sua derivata no. Che tipo di parametro d&rsquo;ordine &egrave;, e a che cosa somiglia?`,
    a:R`&Egrave; un parametro d&rsquo;ordine che si annulla con <b>esponente uno</b> avvicinandosi alla transizione da sotto — cio&egrave; $N_0/N\propto(T_c-T)^1$ — e questo lo mette nella stessa classe formale della magnetizzazione di un ferromagnete in teoria di campo medio, dove per&ograve; l&rsquo;esponente &egrave; $1/2$. La differenza si chiarisce guardando quale sia l&rsquo;oggetto fisico: nel condensato il parametro d&rsquo;ordine «vero», quello che compare nella teoria di Landau, &egrave; l&rsquo;<b>ampiezza</b> della funzione d&rsquo;onda macroscopica, $\psi_0\propto\sqrt{N_0/N}$, e quella si annulla con esponente $1/2$ come la magnetizzazione di campo medio. Il criterio da tenere: quando si confrontano esponenti critici fra sistemi diversi bisogna confrontare <b>grandezze omologhe</b>, e per un condensato l&rsquo;omologa della magnetizzazione &egrave; l&rsquo;ampiezza, non la popolazione.`},
   {q:R`Sotto $T_c$ il numero di particelle eccitate dipende da $T$ e da $V$ ma <b>non</b> dal numero totale $N$. Come pu&ograve; essere, visto che le particelle sono $N$?`,
    a:R`&Egrave; corretto, ed &egrave; la propriet&agrave; pi&ugrave; strana della fase condensata. Il criterio che lo regge &egrave; che sotto $T_c$ la fugacit&agrave; &egrave; <b>bloccata al valore $z=1$</b>, e quindi l&rsquo;integrale che conta gli stati eccitati non contiene pi&ugrave; nessun parametro libero: vale $g_sV\zeta(3/2)/\lambda^3$ e basta. Aggiungere particelle al sistema, a $T$ e $V$ fissati, <b>non ne mette nemmeno una negli stati eccitati</b>: vanno tutte nel fondamentale. La conseguenza osservabile &egrave; la pressione: poich&eacute; la pressione la fanno solo le particelle eccitate, <b>comprimere il gas sotto $T_c$ non ne aumenta la pressione</b>, e l&rsquo;isoterma diventa orizzontale. &Egrave; il comportamento di un vapore in equilibrio con il suo liquido, ottenuto qui senza nessuna forza attrattiva fra le particelle.`}
  ]}
]},

/* ---------------- 06 · IL CASO GENERALE: d DIMENSIONI E POTENZIALE ESTERNO ---------------- */
{ num:'06', title:'Il caso generale: d dimensioni, dispersione qualunque, potenziale esterno', meta:'un esponente solo governa tutto · il criterio di esistenza come convergenza di un integrale · niente condensazione in due dimensioni libere · ma si dentro una trappola',
  blocchi:[
  {t:'reveal', title:'Un esponente solo, e da dove viene', tag:'costruzione', steps:[
   {label:'La densità degli stati per una hamiltoniana a potenze', body:R`
   <p>Le hamiltoniane di singola particella che compaiono nelle prove d&rsquo;esame sono quasi tutte della forma</p>
   $$H=A|\vec p\,|^{a}+B|\vec q\,|^{b}$$
   <p>in $d$ dimensioni, con $a=2$ per una dispersione non relativistica, $a=1$ per una ultrarelativistica, $b=2$ per una trappola armonica, $b=1$ per una trappola lineare, e il caso «scatola» ottenuto mandando $b\to\infty$, cio&egrave; un potenziale che vale zero dentro un volume $V$ e infinito fuori. <b>Per tutte queste la densit&agrave; degli stati &egrave; una potenza</b>, e l&rsquo;esponente si calcola una volta sola.</p>
   <p>Si parte dal volume di spazio delle fasi sotto una data energia, $\Gamma(\varepsilon)=h^{-d}\int d^dq\,d^dp\,\theta(\varepsilon-H)$, e si esegue il riscalamento che &egrave; il cuore del conto: si pone $\vec p=(\varepsilon/A)^{1/a}\vec u$ e $\vec q=(\varepsilon/B)^{1/b}\vec v$. Con questa sostituzione la condizione $H<\varepsilon$ diventa $|\vec u|^a+|\vec v|^b<1$, cio&egrave; una regione <b>fissa</b> che non dipende pi&ugrave; da $\varepsilon$, e tutta la dipendenza dall&rsquo;energia esce dagli jacobiani: $d^dp$ porta un fattore $\varepsilon^{d/a}$ e $d^dq$ un fattore $\varepsilon^{d/b}$. Dunque $\Gamma(\varepsilon)\propto\varepsilon^{\,d/a+d/b}$, e derivando</p>
   $$G(\varepsilon)\propto\varepsilon^{\alpha-1},\qquad \alpha=\frac da+\frac db$$
   <p><b>Tutta la geometria del problema — dimensione, dispersione, potenziale — si condensa in questo unico numero.</b> Per la scatola il secondo addendo si annulla, perch&eacute; l&rsquo;integrale sulle posizioni d&agrave; semplicemente $V$ e non porta energia: resta $\alpha=d/a$. Il caso gi&agrave; visto — gas libero non relativistico in tre dimensioni — d&agrave; $\alpha=3/2$, coerente con la $\sqrt\varepsilon$ della tappa 01.</p>
   <p>Vale la pena svolgere per intero il caso che serve agli esperimenti veri, la <b>trappola armonica isotropa in tre dimensioni</b>, perch&eacute; compare in met&agrave; degli esercizi moderni. Con $H=p^2/2m+\tfrac12m\omega^2q^2$ le variabili riscalate sono $u_i=p_i/\sqrt{2m}$ e $v_i=q_i\sqrt{m\omega^2/2}$, e in esse $H$ diventa la somma di sei quadrati: la regione $H<\varepsilon$ &egrave; una <b>palla in sei dimensioni</b> di raggio $\sqrt\varepsilon$, il cui volume &egrave; $\pi^3\varepsilon^3/6$. Lo jacobiano — la massa si semplifica fra impulsi e posizioni — vale
   $$(2m)^{3/2}\left(\frac{2}{m\omega^2}\right)^{3/2}=\frac{8}{\omega^3}$$
   <p>e dividendo per $h^3$:</p></p>
   $$\Gamma(\varepsilon)=\frac{1}{h^3}\cdot\frac{8}{\omega^3}\cdot\frac{\pi^3\varepsilon^3}{6}=\frac{\varepsilon^3}{6(\hbar\omega)^3}$$
   <p>dove il passaggio da $h$ a $\hbar$ mangia esattamente gli $8\pi^3$. Derivando,</p>
   $$G(\varepsilon)=\frac{\varepsilon^2}{2(\hbar\omega)^3}$$
   <p>cio&egrave; $\alpha=3$, come la formula generale prevede con $d=3$, $a=2$, $b=2$. <b>La trappola raddoppia l&rsquo;esponente rispetto alla scatola</b>, e si vedr&agrave; fra poco che &egrave; esattamente ci&ograve; che permette alla condensazione di esistere dove altrimenti non esisterebbe.</p>`},
   {label:'Il criterio di esistenza: un integrale che converge o non converge', body:R`
   <p>Adesso la domanda vera. Il massimo numero di particelle collocabili negli stati eccitati &egrave;</p>
   $$N_{\rm ecc}^{\max}=g_sC\int_0^{\infty}\frac{\varepsilon^{\alpha-1}}{e^{\beta\varepsilon}-1}\,d\varepsilon$$
   <p>e la condensazione esiste <b>se e solo se questo integrale &egrave; finito</b>. All&rsquo;estremo superiore non c&rsquo;&egrave; mai problema, perch&eacute; l&rsquo;esponenziale al denominatore schiaccia qualunque potenza. Tutto si decide in zero, dove l&rsquo;esponenziale si linearizza: il limite che regge il passaggio &egrave; $\lim_{\varepsilon\to0^+}\varepsilon/(e^{\beta\varepsilon}-1)=1/\beta$, cio&egrave; l&rsquo;occupazione si comporta come</p>
   $$\frac{1}{\beta\varepsilon}$$
   <p>e l&rsquo;integrando come $\varepsilon^{\alpha-2}/\beta$. Il criterio invocato &egrave; il <b>confronto per integrali impropri</b>, e i tre casi che contano si vedono a occhio:</p>
   $$\int_0^1\varepsilon^{-1/2}\,d\varepsilon=2$$
   <p>converge — &egrave; il caso $\alpha=3/2$, il gas libero in tre dimensioni;</p>
   $$\int_0^1\varepsilon^{-1}\,d\varepsilon=+\infty$$
   <p>diverge logaritmicamente — &egrave; il caso <b>marginale</b> $\alpha=1$, il gas libero in due dimensioni;</p>
   $$\int_0^1\varepsilon^{-3/2}\,d\varepsilon=+\infty$$
   <p>diverge di potenza — &egrave; il caso $\alpha=1/2$, il gas libero in una dimensione. <b>La regola &egrave; una sola e si scrive in tre parole: la condensazione esiste se e solo se $\alpha>1$.</b></p>
   <p>Lo stesso verdetto si legge da un&rsquo;altra parte, ed &egrave; un controllo che conviene fare perch&eacute; costa zero. Quando l&rsquo;integrale converge il suo valore &egrave; $\Gamma(\alpha)\zeta(\alpha)T^\alpha$, e <b>la zeta di Riemann ha un polo semplice in $1$</b>: $\zeta(\alpha)\to+\infty$ per $\alpha\to1^+$. Il numero che dovrebbe essere il tetto diverge esattamente dove l&rsquo;integrale smette di convergere. Le due spie — <span class="str" data-str="funzione-zeta-di-riemann">la zeta che esplode</span> e l&rsquo;integrale che diverge — sono lo stesso fatto guardato da due parti, e in un compito basta citarne una.</p>
   <p>Quando invece $\alpha>1$ si ottiene la <b>temperatura critica generale</b>, imponendo che il massimo eguagli $N$: $T_c=\left[N/\left(g_sC\,\Gamma(\alpha)\zeta(\alpha)\right)\right]^{1/\alpha}$, e la frazione condensata segue con lo stesso esponente,</p>
   $$\frac{N_0}{N}=1-\left(\frac{T}{T_c}\right)^{\alpha}$$
   <p>Tre risultati da un numero solo. <b>Questo &egrave; il contenuto operativo del movimento</b>, e negli scritti sostituisce per intero il caso di scuola.</p>`},
   {label:'I casi che le prove chiedono, e il più istruttivo di tutti', body:R`
   <p>Mettendo insieme $\alpha=d/a+d/b$ con il criterio $\alpha>1$ si ottiene la tabella che vale la pena saper ricostruire in trenta secondi.</p>
   <p><b>Gas libero in una scatola</b>, $\alpha=d/a$. Non relativistico ($a=2$): $\alpha=3/2$ in tre dimensioni, condensa; $\alpha=1$ in due, <b>non condensa</b>; $\alpha=1/2$ in una, non condensa. Ultrarelativistico ($a=1$, cio&egrave; $H=c|\vec p\,|$): $\alpha=d$, quindi condensa in tre e in <b>due</b> dimensioni, e non in una. &Egrave; esattamente la risposta che Crisanti (pag. 292) d&agrave; all&rsquo;esercizio proposto: «c&rsquo;&egrave; condensazione per $D=2,3$».</p>
   <p><b>Gas in una trappola armonica</b>, $\alpha=d/a+d/2$. Non relativistico: $\alpha=d$, quindi $\alpha=3$ in tre dimensioni, $\alpha=2$ in <b>due</b>, $\alpha=1$ in una. <b>Trappola lineare</b> ($b=1$) con dispersione ultrarelativistica in una dimensione, cio&egrave; $H=c|p|+\gamma|q|$: $\alpha=1+1=2$, e condensa — ed &egrave; il suggerimento con cui Crisanti chiude lo stesso esercizio, «si pu&ograve; verificare cosa accade in $D=1$ se $H=c|p|+b|q|$».</p>
   <p><b>Il caso pi&ugrave; istruttivo &egrave; il confronto fra le due righe in due dimensioni</b>, e vale la pena dirlo con precisione perch&eacute; &egrave; il punto che gli esercizi mettono alla prova. Un gas di bosoni non interagenti confinato su una superficie piatta <i>non condensa a nessuna temperatura finita</i>: $\alpha=1$, l&rsquo;integrale diverge, il tetto non esiste. Lo stesso gas, sulla stessa superficie, tenuto insieme da un potenziale armonico invece che da una parete, <b>condensa</b>: $\alpha=2$, e la temperatura critica &egrave; finita. <b>Il potenziale esterno non cambia la fisica delle particelle — cambia la densit&agrave; degli stati</b>, e siccome tutto dipende da quella, cambia la risposta.</p>
   <p>La ragione fisica, e conviene tenerla perch&eacute; l&rsquo;esponente si dimentica: un potenziale confinante <b>toglie stati a bassa energia</b>. In una scatola una particella con energia piccolissima pu&ograve; comunque stare in qualunque punto del volume, e questo le d&agrave; molti stati; in una trappola una particella con energia piccolissima &egrave; costretta vicino al minimo del potenziale, e i suoi stati sono pochi. Meno stati a bassa energia significa un integrale che converge meglio, cio&egrave; un tetto che esiste.</p>
   <p><b>I numeri del laboratorio.</b> Per la trappola tridimensionale, con $G=\varepsilon^2/2(\hbar\omega)^3$, il conto d&agrave; $N=T_c^3\Gamma(3)\zeta(3)/\left(2(\hbar\omega)^3\right)$, dove</p>
   $$\int_0^{\infty}\frac{y^2}{e^y-1}\,dy=\Gamma(3)\zeta(3)\simeq2{,}4041$$
   <p>e siccome $\Gamma(3)=2$ il due si semplifica e resta la formula compatta $T_c=\hbar\omega\left(N/\zeta(3)\right)^{1/3}$. Con una trappola da cento hertz e centomila atomi la temperatura critica vale $209{,}5$ nanokelvin (<span class="str" data-str="ordini-di-grandezza">ordini di grandezza</span>). Per la trappola bidimensionale, con $G=\varepsilon/(\hbar\omega)^2$, serve invece</p>
   $$\int_0^{\infty}\frac{y}{e^y-1}\,dy=\Gamma(2)\zeta(2)\simeq1{,}6449$$
   <p>cio&egrave; $\pi^2/6$ perch&eacute; $\Gamma(2)=1$, da cui $T_c=\hbar\omega\sqrt{6N}/\pi$: con gli stessi parametri, $1183$ nanokelvin. <b>&Egrave; sei volte pi&ugrave; alta che in tre dimensioni</b>, il che &egrave; il rovescio pratico di quanto detto sopra — meno dimensioni, meno stati eccitati disponibili, condensazione pi&ugrave; facile.</p>`}
  ]},
  {t:'plot', title:'L integrando che decide, e i quattro modi in cui si comporta vicino a zero',
   intro:R`L&rsquo;integrando $\varepsilon^{\alpha-1}/(e^{\varepsilon}-1)$, in unit&agrave; $\beta=1$, per quattro valori dell&rsquo;esponente: $\alpha=1/2$ (gas libero in una dimensione), $\alpha=1$ (gas libero in due dimensioni), $\alpha=3/2$ (gas libero in tre) e $\alpha=3$ (trappola armonica in tre).`,
   plots:[
    {kind:'func2d', xr:[0.02,4], yr:[0,6], height:340, ticks:6,
     title:'due curve la cui area è infinita, due la cui area è finita',
     curves:[
      {f:'pow(x,-0.5)/(exp(x)-1)', col:'#ff6b6b', label:'alpha = 1/2 : diverge'},
      {f:'1/(exp(x)-1)', col:'#d8a13a', label:'alpha = 1 : diverge'},
      {f:'sqrt(x)/(exp(x)-1)', col:'#5eead4', label:'alpha = 3/2 : converge'},
      {f:'x*x/(exp(x)-1)', col:'#4c8dff', label:'alpha = 3 : converge'}
     ],
     xlabel:'energia (in unità di T)', ylabel:'integrando'}
   ],
   leggi:R`<p><b>Che cosa guardare: il bordo sinistro.</b> Tre curve vanno all&rsquo;infinito avvicinandosi a zero e una no, ma non &egrave; questo che decide: decide <i>quanto in fretta</i>. La rossa esplode come $\varepsilon^{-3/2}$ e la sua area diverge; l&rsquo;oro come $\varepsilon^{-1}$ e l&rsquo;area diverge di poco, logaritmicamente; la verde come $\varepsilon^{-1/2}$ e l&rsquo;area &egrave; <b>finita</b> pur essendo la curva illimitata. La blu non diverge affatto. <b>Una curva illimitata pu&ograve; avere area finita</b>, ed &egrave; l&rsquo;unica cosa che questa figura deve insegnare.</p>
   <p><b>Che cosa guardare: la curva oro, che &egrave; il caso da ricordare.</b> &Egrave; il gas libero in due dimensioni, il confine esatto fra i due comportamenti. Sta appena dalla parte sbagliata, e la divergenza &egrave; cos&igrave; debole — un logaritmo — che non la si vede nel disegno: la si deve <i>calcolare</i>. Questo &egrave; il motivo per cui il caso bidimensionale &egrave; la domanda d&rsquo;esame preferita: a occhio sembra condensare come gli altri.</p>
   <p><b>Che cosa impararne per i conti.</b> La coda destra &egrave; identica per tutte e quattro e non contribuisce mai al verdetto: guardarla &egrave; tempo perso. <b>Tutto il giudizio si fa sviluppando l&rsquo;integrando attorno a $\varepsilon=0$</b>, e per farlo basta sostituire $e^{\beta\varepsilon}-1$ con $\beta\varepsilon$ e leggere l&rsquo;esponente rimasto. In un compito sono due righe: densit&agrave; degli stati, esponente, confronto con $\varepsilon^{-1}$.</p>
   <p><b>Dove questa figura mente.</b> Il riquadro parte da $\varepsilon=0{,}02$ e taglia a sei: le tre curve divergenti continuano oltre il bordo, e la differenza fra loro sta tutta nel pezzo che non si vede. &Egrave; una limitazione onesta del disegno e non un difetto del ragionamento — proprio perch&eacute; la regione decisiva &egrave; invisibile, la si deve trattare per via analitica.</p>`},
  {t:'plot', title:'La regione di esistenza: l esponente in funzione della dimensione, e la soglia',
   intro:R`L&rsquo;esponente $\alpha=d/a+d/b$ in funzione della dimensione $d$, per tre famiglie di problemi, con la soglia $\alpha=1$ tratteggiata. Sopra la linea la condensazione esiste, sotto no; esattamente sulla linea &egrave; il caso marginale, in cui non esiste.`,
   plots:[
    {kind:'func2d', xr:[0,3.6], yr:[0,7.2], height:340, ticks:6,
     title:'tre rette, e una soglia',
     curves:[
      {f:'x/2', col:'#ff6b6b', label:'scatola, non relativistico'},
      {f:'x', col:'#5eead4', label:'trappola armonica, oppure scatola ultrarelativistica'},
      {f:'2*x', col:'#4c8dff', label:'trappola armonica, ultrarelativistico'}
     ],
     segs:[{x1:0,y1:1,x2:3.6,y2:1,col:'#b98cff',dash:true,width:1.6,label:'soglia alpha = 1',lx:2.6,ly:1.35}],
     marks:[{x:2,y:1,label:'gas piatto: marginale',col:'#ff6b6b',up:true},{x:1,y:1,label:'d=1',col:'#5eead4',left:true,up:true},{x:3,y:1.5,label:'caso di scuola',col:'#ff6b6b'}],
     xlabel:'dimensione d', ylabel:'esponente alpha'}
   ],
   leggi:R`<p><b>Che cosa guardare: dove ciascuna retta taglia la soglia.</b> La rossa — gas libero non relativistico, la situazione pi&ugrave; comune — la taglia in $d=2$: &egrave; il celebre risultato che in due dimensioni un gas di Bose libero non condensa, e lo si legge qui come un&rsquo;intersezione invece che come un teorema da ricordare. La verde la taglia in $d=1$, la blu in $d=1/2$, cio&egrave; mai per una dimensione intera: <b>una trappola armonica con dispersione lineare condensa in qualunque dimensione fisica</b>.</p>
   <p><b>Che cosa guardare: la pendenza, che &egrave; $1/a+1/b$.</b> Rendere la dispersione pi&ugrave; «piatta» (passare da $p^2$ a $|p|$) e aggiungere un potenziale confinante fanno la <i>stessa cosa</i> alla retta: la inclinano di pi&ugrave;. Sono due modi diversi di ridurre il numero di stati a bassa energia, e il grafico mostra che il sistema non li distingue.</p>
   <p><b>Che cosa impararne per i conti.</b> Davanti a un esercizio nuovo non si cerca il caso nella memoria: si leggono $d$, $a$ e $b$ dall&rsquo;hamiltoniana, si somma $d/a+d/b$, e si confronta con uno. <b>Il conto dura dieci secondi e non richiede nessun integrale</b>; l&rsquo;integrale serve dopo, e solo se la risposta &egrave; affermativa. Attenzione al caso «scatola», che &egrave; $b\to\infty$ e quindi $d/b=0$: &egrave; l&rsquo;unico in cui il secondo addendo sparisce.</p>
   <p><b>Dove questa figura mente.</b> Disegna $d$ come una variabile continua, mentre le dimensioni fisiche sono tre numeri interi; i punti fra di essi non corrispondono a nessun sistema, se non nel senso formale in cui la dimensionalit&agrave; effettiva di un sistema molto anisotropo pu&ograve; essere frazionaria. E tratta $\alpha=1$ come parte della regione «non condensa», il che &egrave; corretto ma nasconde che il caso marginale &egrave; qualitativamente diverso dagli altri: l&igrave; la divergenza &egrave; logaritmica, e basta un termine correttivo — una trappola debolissima, un sistema finito — per farla tornare finita.</p>`},
  {t:'prosa', title:'Il modus operandi, nell ordine in cui va eseguito', tag:'sintesi', html:R`
  <p>Il formato della domanda d&rsquo;esame &egrave; fisso — <i>determinare, se esiste, la temperatura di condensazione</i> — e la risposta si costruisce sempre nello stesso ordine. Vale la pena averla come procedura, perch&eacute; il tempo perso agli scritti si perde quasi tutto nei primi due passi.</p>
  <p><b>Primo: identificare lo spettro e il suo fondo.</b> Si scrive $H$ di singola particella e si trova l&rsquo;energia minima $\varepsilon_{\min}$. <b>L&rsquo;origine delle energie va spostata sul fondo</b>, perch&eacute; il vincolo &egrave; $\mu\le\varepsilon_{\min}$ e non $\mu\le0$: un esercizio con un potenziale che vale $-V_0$ da qualche parte ha il vincolo l&igrave;. Chi salta questo passo scrive l&rsquo;integrale con l&rsquo;estremo inferiore sbagliato, e da quel punto in poi nessun conto pu&ograve; salvarlo.</p>
  <p><b>Secondo: calcolare $G(\varepsilon)$ dalla definizione</b>, con la <span class="str" data-str="delta-di-dirac">delta</span> scritta come derivata di una theta. Non si cerca la formula giusta fra quelle memorizzate: si fa l&rsquo;integrale, che con il trucco della theta &egrave; un volume elementare. Se l&rsquo;hamiltoniana &egrave; a potenze, il riscalamento della tappa d&agrave; l&rsquo;esponente senza fare niente.</p>
  <p><b>Terzo: leggere $\alpha$ e decidere.</b> Si scrive $G(\varepsilon)\propto\varepsilon^{\alpha-1}$ nell&rsquo;intorno del fondo dello spettro — <i>solo</i> l&igrave;, perch&eacute; solo l&igrave; conta — e si confronta $\alpha$ con uno. Se $\alpha\le1$ la risposta &egrave; «non esiste», e va scritta con il motivo: l&rsquo;integrale $\int_0\varepsilon^{\alpha-2}d\varepsilon$ diverge, dunque gli stati eccitati possono assorbire qualunque numero di particelle e la fugacit&agrave; non arriva mai a uno. <b>Una risposta negativa motivata vale l&rsquo;intero quesito</b>; una risposta negativa nuda non vale niente.</p>
  <p><b>Quarto, solo se $\alpha>1$: imporre $z=1$ e invertire.</b> Si scrive $N=g_sC\,T_c^\alpha\Gamma(\alpha)\zeta(\alpha)$ e si risolve per $T_c$. Il valore di $\zeta(\alpha)$ si lascia indicato, come Crisanti raccomanda, a meno che non sia uno dei noti — $\zeta(2)=\pi^2/6$, $\zeta(3)\simeq1{,}202$, $\zeta(3/2)\simeq2{,}612$, $\zeta(5/2)\simeq1{,}341$.</p>
  <p><b>Quinto: le domande di contorno</b>, che sono sempre le stesse tre. La frazione condensata &egrave; $1-(T/T_c)^\alpha$. L&rsquo;energia della fase condensata &egrave; portata dai soli eccitati. E un&rsquo;eventuale media geometrica — raggio quadratico medio della nuvola, distanza dall&rsquo;origine — si fa integrando la densit&agrave; spaziale, oppure con il <b>teorema del viriale</b> se il potenziale &egrave; omogeneo.</p>
  <p><b>Il controllo che scova l&rsquo;errore pi&ugrave; frequente</b>: verificare che $\alpha$ ottenuto dal riscalamento coincida con quello letto nel comportamento di $G$ vicino a zero. Se non coincidono si &egrave; sbagliato il conto del volume di spazio delle fasi, quasi sempre dimenticando che in una trappola l&rsquo;integrale sulle posizioni <b>non</b> d&agrave; un volume fisso.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`In due dimensioni con una trappola armonica la condensazione esiste, in due dimensioni libere no. Ma un potenziale armonico &egrave; sempre presente in un laboratorio, almeno debolmente. Allora il caso «libero» esiste davvero?`,
    a:R`La domanda &egrave; giusta e la risposta &egrave; che il caso libero &egrave; il <b>limite termodinamico</b> del caso in trappola, e i due limiti non commutano. Se la trappola ha frequenza $\omega$ e si manda $\omega\to0$ tenendo $N$ fisso, la temperatura critica $T_c=\hbar\omega\sqrt{6N}/\pi$ <b>va a zero</b>: la condensazione c&rsquo;&egrave; formalmente ma a temperature irraggiungibili. Il criterio che regola il confronto &egrave; che in un sistema <i>finito</i> la condensazione esiste sempre — c&rsquo;&egrave; un livello fondamentale discreto e a temperatura abbastanza bassa lo si popola — e il teorema «niente condensazione in due dimensioni» &egrave; un enunciato sul limite $N\to\infty$ a densit&agrave; fissata. La conseguenza sperimentale &egrave; concreta: i condensati bidimensionali osservati in laboratorio esistono <b>perch&eacute;</b> il campione &egrave; finito e intrappolato, e il loro comportamento dipende dai parametri della trappola in un modo che il gas tridimensionale non ha.`},
   {q:R`Due esercizi diversi danno $H=c|\vec p\,|$ in due dimensioni e $H=p^2/2m+\tfrac12m\omega^2r^2$ in due dimensioni. Entrambi hanno $\alpha=2$. Le due condensazioni sono la stessa cosa?`,
    a:R`Nelle <b>proprieta critiche</b> s&igrave;, nei <b>numeri</b> no, e distinguere le due cose &egrave; il punto. Poich&eacute; $\alpha$ &egrave; lo stesso, coincidono: l&rsquo;esistenza della transizione, l&rsquo;esponente della frazione condensata — $1-(T/T_c)^2$ in entrambi i casi — l&rsquo;andamento dell&rsquo;energia sotto $T_c$, che va come $T^{3}$ in entrambi, e il valore di $\zeta$ che compare, cio&egrave; $\zeta(2)=\pi^2/6$. Non coincidono il <b>prefattore</b> $C$ della densit&agrave; degli stati e quindi la $T_c$ numerica: nel primo caso $C$ contiene l&rsquo;area e $c^2$, nel secondo contiene $(\hbar\omega)^{-2}$ e nessuna area, perch&eacute; la trappola fissa lei l&rsquo;estensione della nuvola. Il criterio da portarsi via &egrave; che <b>$\alpha$ governa la forma della transizione e il prefattore governa la scala</b>: due sistemi con lo stesso $\alpha$ appartengono alla stessa classe, e in un compito la parte concettuale &egrave; gi&agrave; risolta quando si &egrave; letto l&rsquo;esponente.`}
  ]}
]},

/* ---------------- 07 · TERMODINAMICA SOTTO LA TRANSIZIONE, E LA CUSPIDE ---------------- */
{ num:'07', title:'Energia, pressione, entropia e il calore specifico con la sua cuspide', meta:'solo gli eccitati portano qualcosa · la pressione che non dipende dal volume · il calore specifico continuo con derivata discontinua · e due riquadri sbagliati nelle note',
  blocchi:[
  {t:'reveal', title:'Le grandezze di stato sotto T critica', tag:'costruzione', steps:[
   {label:'L energia: portata dai soli eccitati, e che va a zero', body:R`
   <p>Sotto $T_c$ ogni grandezza estensiva si calcola dimenticando il condensato, perch&eacute; le particelle nel fondamentale hanno energia nulla, impulso nullo ed entropia nulla. Crisanti (pag. 294) lo mette in una riga: «le particelle nello stato fondamentale danno un contributo all&rsquo;energia pari a $0$, quindi per calcolare l&rsquo;energia dobbiamo considerare quelle che non sono nello stato fondamentale». L&rsquo;energia &egrave; dunque</p>
   $$E=\int_0^{\infty}\varepsilon\,g_sG(\varepsilon)\,\frac{d\varepsilon}{e^{\beta\varepsilon}-1}=\frac32\frac{g_sVT}{\lambda^3}\zeta(5/2)$$
   <p>dove si &egrave; usato l&rsquo;integrale con esponente $5/2$ della tappa 01, e il $3/2$ esce da $\Gamma(5/2)=\tfrac32\Gamma(3/2)$ combinato con il $2\pi$ del prefattore. Dividendo per $N=g_sV\zeta(3/2)/\lambda_c^3$ e usando che il rapporto $\lambda_c^3/\lambda^3$ vale $(T/T_c)^{3/2}$ resta la forma che serve:</p>
   $$\frac EN=\frac32\,T\left(\frac{T}{T_c}\right)^{3/2}\frac{\zeta(5/2)}{\zeta(3/2)}$$
   <p>Grilli-Giardina (pag. 102) la scrive con le Gamma non semplificate, $\Gamma(5/2)\zeta(5/2)/\left(\Gamma(3/2)\zeta(3/2)\right)\cdot NT^{5/2}/T_c^{3/2}$, che &egrave; la stessa cosa perch&eacute; il rapporto delle Gamma vale $3/2$. <b>Due letture.</b> La prima: $E\propto T^{5/2}$, dunque $E\to0$ per $T\to0$, e Crisanti (pag. 285) sottolinea il contrasto con i fermioni — «quando $T\to0$ abbiamo che $E\to0$ (non come nel caso dei fermioni), poich&eacute; le particelle non contribuiscono all&rsquo;energia (possono scendere tutte)». <b>Un gas di bosoni a temperatura nulla ha energia nulla</b>; un gas di fermioni ne ha una enorme, perch&eacute; l&rsquo;esclusione costringe le particelle a salire. La seconda: a fattore c&rsquo;&egrave; esattamente la frazione eccitata $(T/T_c)^{3/2}$, moltiplicata per $\tfrac32T$ e corretta del rapporto</p>
   $$\frac{\zeta(5/2)}{\zeta(3/2)}\simeq0{,}5135$$
   <p>cio&egrave; <b>una particella eccitata di un gas di Bose porta circa met&agrave; dell&rsquo;energia che l&rsquo;equipartizione le assegnerebbe</b>. La ragione &egrave; che la statistica di Bose ammucchia le particelle nei livelli bassi, e l&rsquo;energia media per particella ne risulta abbassata. Quel fattore $\zeta(5/2)/\zeta(3/2)$ &egrave; la misura quantitativa dell&rsquo;«attrazione statistica» dei bosoni.</p>
   <div class="note"><b>Disaccordo (b), secondo tempo: un $g$ che non ci va.</b> Crisanti a pag. 295 scrive $E=\tfrac32NTg(T/T_0)^{3/2}\zeta(5/2)/\zeta(3/2)$, con il fattore di spin <b>dentro</b>. Non ci va: il $g$ che compare in $E=\tfrac32gVT\zeta(5/2)/\lambda^3$ si semplifica contro quello nascosto in $N=gV\zeta(3/2)/\lambda_0^3$ quando si fa il rapporto, e il risultato finale non pu&ograve; dipendere da $g_s$ — se dipendesse, aggiungere uno stato di spin cambierebbe l&rsquo;energia per particella a $T/T_c$ fissato, che &egrave; impossibile perch&eacute; $T_c$ &egrave; gi&agrave; stata definita tenendo conto di $g_s$. L&rsquo;errore nasce da pag. 295, dove la relazione per $N/V$ era stata scritta senza $g$. <b>Il controllo che lo scova: ogni formula espressa in termini di $T/T_c$ e $N$ non pu&ograve; contenere $g_s$</b>, perch&eacute; $g_s$ &egrave; gi&agrave; stato consumato nella definizione di $T_c$.</div>`},
   {label:'La pressione, che non dipende dal volume — e il perché', body:R`
   <p>La relazione fra pressione ed energia si ricava per parti e vale per qualunque densit&agrave; degli stati a potenza. Partendo da $PV/T=-\sum_p\log(1-ze^{-\beta\varepsilon_p})$, sostituendo la somma con l&rsquo;integrale e integrando per parti con $v=C\varepsilon^\alpha/\alpha$ si ottiene $PV=E/\alpha$. Il controllo numerico sul caso $\alpha=3/2$, $z=1$, che &egrave; quello che serve, si fa confrontando i due integrali:</p>
   $$\int_0^{\infty}\sqrt y\,\left(-\log\left(1-e^{-y}\right)\right)dy=\Gamma(3/2)\,\zeta(5/2)\simeq1{,}1889$$
   <p>e l&rsquo;integrale dell&rsquo;energia valeva $\Gamma(5/2)\zeta(5/2)$: il rapporto fra i due &egrave;
   $$\frac{\Gamma(3/2)}{\Gamma(5/2)}=\frac23$$
   <p>cio&egrave; esattamente $1/\alpha$. Dunque $PV=\tfrac23E$, e Crisanti (pag. 279) annota che questa relazione «vale per bosoni, fermioni, ed anche nel caso di Boltzmann» — perch&eacute; nella derivazione la statistica non entra, entra solo l&rsquo;esponente della densit&agrave; degli stati.</p>
   <p>Sostituendo l&rsquo;energia si ottiene il risultato pi&ugrave; strano della fase condensata:</p>
   $$P=\frac{g_sT}{\lambda^3}\,\zeta(5/2)$$
   <p><b>La pressione non dipende dal volume specifico.</b> Crisanti (pag. 295) lo dichiara esplicitamente — «$P_0$ &egrave; la pressione dovuta solo alle particelle che non sono nello stato fondamentale, e non dipende da $v$» — e la conseguenza &egrave; drastica: sotto $T_c$ <b>l&rsquo;isoterma &egrave; orizzontale</b>, la compressibilit&agrave; &egrave; infinita, e comprimere il gas non aumenta la pressione. Il meccanismo fisico &egrave; trasparente una volta visto: comprimendo a temperatura fissata si aumenta la densit&agrave;, ma il numero di particelle eccitate per unit&agrave; di volume &egrave; fissato da $T$ e da nient&rsquo;altro, quindi <b>le particelle in pi&ugrave; finiscono tutte nel condensato, che non spinge</b>. &Egrave; il comportamento di un vapore saturo sopra il suo liquido — con la differenza che qui non c&rsquo;&egrave; nessun liquido, e nessuna forza attrattiva.</p>
   <p>Il valore numerico alla soglia si legge senza conti: alla temperatura critica $n\lambda^3$ vale $g_s\zeta(3/2)$, dunque $P_c=nT_c\zeta(5/2)/\zeta(3/2)$, cio&egrave; <b>circa la met&agrave; della pressione che un gas classico avrebbe alla stessa densit&agrave; e temperatura</b>. La statistica di Bose abbassa la pressione, esattamente come abbassa l&rsquo;energia, e per lo stesso motivo.</p>`},
   {label:'L entropia: zero nel condensato, e costante per ogni particella eccitata', body:R`
   <p>L&rsquo;entropia si ottiene dal potenziale gran canonico. Sotto $T_c$ vale $\mu=0$, dunque $\Omega=F$, e da $S=\beta(E+PV-\mu N)$ con $PV=\tfrac23E$:</p>
   $$S=\frac53\frac ET=\frac52N\left(\frac{T}{T_c}\right)^{3/2}\frac{\zeta(5/2)}{\zeta(3/2)}$$
   <p>Crisanti (pag. 295) segue questa strada e si ferma a fare la domanda giusta — «perch&eacute; $\Omega=F$? $N$ non &egrave; $=0$» — rispondendo da s&eacute; che &egrave; perch&eacute; $\mu=0$. Il punto vale la pena di essere ripetuto perch&eacute; &egrave; il genere di passaggio che in un compito si salta: <b>il termine $\mu N$ scompare non perch&eacute; $N$ sia piccolo, ma perch&eacute; $\mu$ &egrave; nullo</b>, e lo &egrave; solo nella fase condensata.</p>
   <p>Il risultato ha una lettura che vale la pena isolare. Dividendo l&rsquo;entropia per il numero di particelle <i>eccitate</i>, che &egrave; $N(T/T_c)^{3/2}$, il fattore di temperatura si cancella e resta un numero puro:</p>
   $$\frac{S}{N_{\rm ecc}}=\frac52\frac{\zeta(5/2)}{\zeta(3/2)}\simeq1{,}2838$$
   <p>in unit&agrave; di $k_B$. <b>Ogni particella eccitata porta sempre la stessa entropia, e ogni particella condensata ne porta zero.</b> Crisanti lo commenta con la frase giusta: «l&rsquo;entropia &egrave; portata solo dalle particelle che sono nello stato non condensato (quelle nello stato condensato hanno entropia nulla, come deve essere poich&eacute; l&rsquo;entropia &egrave; legata al moto, e quindi le particelle ferme non contribuiscono)». Da qui segue anche che $S\to0$ per $T\to0$, cio&egrave; che <b>il terzo principio &egrave; soddisfatto</b>: il condensato &egrave; uno stato quantistico singolo, la sua molteplicit&agrave; &egrave; uno, e il logaritmo di uno &egrave; zero.</p>`},
   {label:'Il calore specifico: la potenza tre mezzi, il massimo sopra il classico, e la cuspide', body:R`
   <p>Il calore specifico sotto $T_c$ si ottiene derivando l&rsquo;energia, e siccome $E\propto T^{5/2}$ la derivata &egrave; semplicemente $\tfrac52E/T$:</p>
   $$C_V=\frac{15}{4}N\left(\frac{T}{T_c}\right)^{3/2}\frac{\zeta(5/2)}{\zeta(3/2)}$$
   <p>cio&egrave; <b>cresce come $T^{3/2}$</b> partendo da zero. Crisanti (pag. 299) lo confronta con il caso dei fotoni e dei fononi, dove il calore specifico va come $T^3$, e ne d&agrave; la ragione corretta: «questo poich&eacute; la densit&agrave; degli stati &egrave; pi&ugrave; alta per particelle, rispetto ai fotoni, e quindi ci sono un maggior numero di modi di eccitazione disponibili». In termini dell&rsquo;esponente: per un gas massivo $\alpha=3/2$ e $C_V\propto T^\alpha$; per i fotoni $\alpha=3$.</p>
   <p><b>Il valore alla soglia &egrave; il numero pi&ugrave; interessante del movimento.</b> Ponendo $T=T_c$:</p>
   $$\frac{C_V(T_c)}{N}=\frac{15}{4}\frac{\zeta(5/2)}{\zeta(3/2)}\simeq1{,}9257$$
   <p>e questo &egrave; <b>maggiore</b> del valore classico $3/2$, del ventotto per cento. Siccome ad alta temperatura il calore specifico deve tornare al valore classico, la curva <b>sale sopra il valore classico, tocca il massimo esattamente in $T_c$, e poi ridiscende</b>. Non c&rsquo;&egrave; nessun salto: il calore specifico &egrave; continuo.</p>
   <p>Per vedere che &egrave; continuo serve l&rsquo;espressione sopra la transizione, che si ottiene derivando l&rsquo;energia <i>tenendo conto che $z$ dipende da $T$</i> attraverso il vincolo su $N$. Il risultato standard &egrave;</p>
   $$\frac{C_V}{N}=\frac{15}{4}\frac{g_{5/2}(z)}{g_{3/2}(z)}-\frac94\frac{g_{3/2}(z)}{g_{1/2}(z)}$$
   <p>e i suoi due limiti si leggono senza fare conti. <b>Per $T\to T_c^+$</b> si ha $z\to1$, e $g_{1/2}(1)$ diverge — &egrave; la serie $\sum n^{-1/2}$ della tappa 02 — dunque il secondo termine <i>svanisce</i> e resta $\tfrac{15}4\zeta(5/2)/\zeta(3/2)$, cio&egrave; lo stesso $1{,}9257$ di sotto: <b>la continuit&agrave; &egrave; garantita dalla divergenza di $g_{1/2}$</b>, che &egrave; il medesimo fatto matematico che genera la transizione. <b>Per $T\to\infty$</b> si ha $z\to0$ e tutte le $g_\nu(z)\simeq z$, quindi i due rapporti valgono uno e resta</p>
   $$\tfrac{15}4-\tfrac94=\tfrac32$$
   <p>il valore di equipartizione. Una formula sola copre i due regimi, ed &egrave; questo il vantaggio di aver tenuto le $g$ invece di svilupparle.</p>
   <p><b>La cuspide, quantificata.</b> Se il valore &egrave; continuo, la <i>derivata</i> non lo &egrave;. Da sotto, derivando la potenza $3/2$,</p>
   $$\frac{d}{dt}\left[\frac{15}{4}\frac{\zeta(5/2)}{\zeta(3/2)}t^{3/2}\right]=\frac{45}{8}\sqrt t\,\frac{\zeta(5/2)}{\zeta(3/2)}$$
   <p>che in $t=1$ vale $+2{,}8885$ in unit&agrave; di $N/T_c$. Da sopra si deve sviluppare il secondo termine, e il conto usa lo sviluppo di Robinson della tappa 02: da $g_{3/2}(z)\simeq\zeta(3/2)-2\sqrt{\pi\alpha}$ con $\alpha=-\log z$, imponendo a $g_{3/2}$ il valore $\zeta(3/2)t^{-3/2}$ si ricava $\sqrt\alpha\simeq\tfrac{3}{4\sqrt\pi}\zeta(3/2)(t-1)$; sostituendo in $g_{1/2}\simeq\sqrt{\pi/\alpha}$ il secondo termine cresce linearmente in $t-1$ con coefficiente</p>
   $$\frac{27}{16\pi}\zeta(3/2)^2\simeq3{,}6658$$
   <p>Sottraendolo si ottiene la pendenza da sopra,</p>
   $$\frac{45}{8}\frac{\zeta(5/2)}{\zeta(3/2)}-\frac{27}{16\pi}\zeta(3/2)^2\simeq-0{,}7773$$
   <p><b>La derivata del calore specifico passa da $+2{,}89$ a $-0{,}78$ attraversando $T_c$</b>, con un salto di $3{,}666$ in unit&agrave; di $Nk_B/T_c$. &Egrave; questa discontinuit&agrave; nella derivata terza dell&rsquo;energia libera — cio&egrave; nella derivata del calore specifico — la vera firma matematica della transizione.</p>
   <div class="note"><b>Disaccordo (c): due riquadri sbagliati, e il conto di Crisanti che li smentisce.</b> A pag. 299 Crisanti riassume energia e calore specifico in due riquadri, e in entrambi compare $g_{3/2}$ dove va $g_{5/2}$: scrive $E/N=\tfrac32(vT/\lambda^3)g_{3/2}(z)$ e per $C_V/N$ l&rsquo;espressione $\tfrac{15}4(v/\lambda^3)g_{3/2}(z)-\tfrac94g_{3/2}/g_{1/2}$. Che sia $g_{5/2}$ lo dimostra il suo stesso conto di pag. 294, dove ricava $E=\tfrac32gVT\zeta(5/2)/\lambda^3$ — e $\zeta(5/2)$ &egrave; $g_{5/2}(1)$, non $g_{3/2}(1)$. C&rsquo;&egrave; un secondo errore nello stesso riquadro: la riga per $T<T_0$ del calore specifico &egrave; scritta $\tfrac{15}4(vT/\lambda^3)g_{3/2}(1)$, con una <b>$T$ di troppo</b> che la rende dimensionalmente sbagliata, perch&eacute; $C_V/N$ &egrave; adimensionale in unit&agrave; $k_B=1$ e $v/\lambda^3$ lo &egrave; gi&agrave;. Anche questa &egrave; smentita da lui stesso a pag. 295, dove scrive $C_V=\tfrac52E/T\sim T^{3/2}$. <b>Due controlli indipendenti scovano entrambi gli errori</b>: quello dimensionale, e il limite classico — con $g_{3/2}$ al primo termine e $v/\lambda^3$ pari a $1/g_{3/2}(z)$ sopra $T_c$, il primo termine varrebbe $15/4$ costante e il calore specifico ad alta temperatura tenderebbe a $15/4-9/4$ soltanto per caso, senza passare dal rapporto giusto.</div>`}
  ]},
  {t:'plot', title:'Il calore specifico: la cuspide in T critica, e il ritorno al valore classico',
   intro:R`Calore specifico per particella, in unit&agrave; di $k_B$, in funzione di $T/T_c$. Il tratto sotto $T_c$ &egrave; esatto, $\tfrac{15}4(\zeta(5/2)/\zeta(3/2))\,t^{3/2}$. Il tratto sopra &egrave; un raccordo che riproduce <i>esattamente</i> il valore e la pendenza in $T_c$ e il limite classico $3/2$ all&rsquo;infinito; la curva vera richiede l&rsquo;inversione numerica di $g_{3/2}$ e non ha forma chiusa.`,
   plots:[
    {kind:'func2d', xr:[0,3], yr:[0,2.25], height:340, ticks:6,
     title:'continua nel valore, discontinua nella pendenza',
     curves:[
      {f:'x<1?1.9256717*pow(x,1.5):1e9', col:'#4c8dff', width:2.6, label:'esatto, T < T_c'},
      {f:'x<1?1e9:1.5+0.4256717*exp(-1.826*(x-1))', col:'#5eead4', width:2.6, label:'raccordo, T > T_c'},
      {f:'1.5', col:'#d8a13a', dash:true, label:'valore classico 3/2'}
     ],
     segs:[{x1:1,y1:0,x2:1,y2:2.1,col:'#b98cff',dash:true,width:1.4,label:'T_c',lx:1.06,ly:2.05}],
     marks:[{x:1,y:1.9256717,label:'1,9257',col:'#b98cff',left:true,up:true}],
     xlabel:'T / T_c', ylabel:'C_V / (N k_B)'}
   ],
   leggi:R`<p><b>Che cosa guardare: il vertice.</b> Le due curve si incontrano nello stesso punto — non c&rsquo;&egrave; salto — ma arrivano con pendenze diverse: $+2{,}89$ da sinistra, $-0{,}78$ da destra. <b>&Egrave; un angolo, non un gradino</b>, e la distinzione conta: un salto nel calore specifico sarebbe una transizione del secondo ordine nella classificazione di Ehrenfest, un angolo &egrave; del terzo.</p>
   <p><b>Che cosa guardare: il massimo sta sopra la retta classica.</b> Il gas di Bose, alla sua temperatura critica, ha un calore specifico del ventotto per cento pi&ugrave; grande di quello di un gas classico alla stessa densit&agrave;. Il motivo &egrave; che l&rsquo;accumulo statistico nei livelli bassi rende l&rsquo;energia una funzione <i>pi&ugrave; ripida</i> della temperatura in quella regione, e l&rsquo;eccesso si riassorbe scaldando.</p>
   <p><b>Che cosa impararne per i conti.</b> In un esercizio con $\alpha$ diverso da $3/2$ tutti i numeri cambiano ma la struttura no: sotto la soglia $C_V/N$ vale $\alpha(\alpha+1)(T/T_c)^\alpha\zeta(\alpha+1)/\zeta(\alpha)$, ad alta temperatura tende ad $\alpha$, e il valore in $T_c$ &egrave; $\alpha$ moltiplicato per $(\alpha+1)\zeta(\alpha+1)/\zeta(\alpha)$, che &egrave; sempre maggiore di uno. <b>La cuspide c&rsquo;&egrave; sempre, per ogni $\alpha>1$</b>, e per $\alpha>2$ il calore specifico sviluppa perfino una discontinuit&agrave; vera.</p>
   <p><b>Dove questa figura mente.</b> Il tratto a destra &egrave; un&rsquo;esponenziale scelta per avere il valore e la pendenza giusti in $T_c$ e l&rsquo;asintoto giusto: la curva vera decade in modo un po&rsquo; diverso, e in particolare si avvicina a $3/2$ come una potenza e non come un&rsquo;esponenziale. La forma qualitativa — monotona decrescente, senza altri punti notevoli — &egrave; per&ograve; quella vera, ed &egrave; ci&ograve; che la figura deve mostrare.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Sotto $T_c$ la pressione non dipende dal volume. Che cosa succede allora se si comprime il gas fino a volume quasi nullo?`,
    a:R`Il conto dice che la pressione resta $g_sT\zeta(5/2)/\lambda^3$ finch&eacute; si &egrave; nella regione condensata, e il criterio che regge la cosa &egrave; che <b>il numero di particelle eccitate per unit&agrave; di volume dipende solo da $T$</b>: comprimendo, tutte le particelle in eccesso vanno nel fondamentale, che non contribuisce alla pressione. L&rsquo;isoterma &egrave; orizzontale, la compressibilit&agrave; isoterma $-\tfrac1v(\partial v/\partial P)_T$ diverge, e il gas si comporta come un sistema a due fasi in coesistenza, con la «fase condensata» di volume specifico nullo. <b>Dove il modello cede &egrave; ovvio e va detto</b>: comprimere davvero un gas reale fino a volumi piccoli lo fa diventare un liquido o un solido, cioe' fa entrare in gioco proprio le interazioni che qui sono state poste a zero. Il risultato &egrave; corretto entro il modello e falso in laboratorio, ed &egrave; il limite pi&ugrave; onesto da conoscere di tutto il capitolo.`},
   {q:R`Il calore specifico &egrave; continuo in $T_c$, e la continuit&agrave; dipende dal fatto che $g_{1/2}(1)$ diverge. Se $g_{1/2}(1)$ fosse finita, che cosa si osserverebbe?`,
    a:R`Si osserverebbe un <b>salto</b> nel calore specifico, cio&egrave; una transizione del secondo ordine nella classificazione di Ehrenfest invece del terzo. Il criterio invocato &egrave; che $g_{1/2}=\sum n^{-1/2}$ diverge per il <b>confronto con l&rsquo;integrale</b> $\int_1^\infty y^{-1/2}dy$, e il secondo termine di $C_V$, che sopra $T_c$ &egrave; $\tfrac94g_{3/2}/g_{1/2}$, si annulla solo grazie a quel denominatore infinito. E questo non &egrave; un esercizio ipotetico: <b>succede davvero per $\alpha>2$</b>, dove il ruolo di $g_{1/2}$ &egrave; preso da $g_{\alpha-1}$, che in $z=1$ &egrave; <i>finita</i> — per una trappola armonica tridimensionale, con $\alpha=3$, il calore specifico ha un salto vero in $T_c$. La conseguenza osservabile &egrave; che <b>la natura della singolarit&agrave; dipende dall&rsquo;esponente della densit&agrave; degli stati</b>, e non &egrave; una propriet&agrave; universale della condensazione di Bose-Einstein.`}
  ]}
]},

/* ---------------- 08 · CHE SPECIE DI TRANSIZIONE ---------------- */
{ num:'08', title:'Che specie di transizione è: una transizione di fase senza interazioni', meta:'la sola statistica come causa · calore latente e Clapeyron sulla linea di transizione · una classificazione contesa fra le fonti · e perché l elio vero si comporta diversamente',
  blocchi:[
  {t:'reveal', title:'Una transizione che non ha bisogno di forze, e come la si classifica', tag:'costruzione', steps:[
   {label:'Il fatto strano, detto con precisione', body:R`
   <p>Vale la pena dichiarare esattamente che cosa &egrave; sorprendente, perch&eacute; l&rsquo;affermazione «una transizione di fase senza interazioni» viene ripetuta spesso e capita raramente. In tutti i modelli standard di transizione di fase — Ising, van der Waals, liquido-gas — la transizione nasce da una <b>competizione</b> fra un&rsquo;energia di interazione che vuole ordinare e l&rsquo;entropia che vuole disordinare, e il punto critico &egrave; dove le due si pareggiano. Qui non c&rsquo;&egrave; nessuna energia di interazione: l&rsquo;hamiltoniana &egrave; una somma di termini di singola particella, e le particelle non si accorgono l&rsquo;una dell&rsquo;altra.</p>
   <p><b>Che cosa prende il posto dell&rsquo;interazione &egrave; il vincolo di simmetria della funzione d&rsquo;onda.</b> Le particelle non interagiscono dinamicamente, ma non sono nemmeno indipendenti: lo spazio degli stati accessibili a $N$ bosoni non &egrave; il prodotto di $N$ spazi di singola particella, &egrave; il suo <i>sottospazio simmetrico</i>. Questo vincolo cinematico produce una correlazione statistica — la ben nota tendenza dei bosoni a occupare lo stesso stato — che ha lo stesso effetto qualitativo di un&rsquo;attrazione, e infatti si chiama a volte «attrazione di scambio». Il numero che la misura, in questo movimento, &egrave; il rapporto $\zeta(5/2)/\zeta(3/2)$ della tappa 07: l&rsquo;energia media per particella &egrave; la met&agrave; di quella classica, come se ci fosse un pozzo di potenziale che non c&rsquo;&egrave;.</p>
   <p><b>Il parametro d&rsquo;ordine</b> &egrave; la popolazione del livello fondamentale, o meglio l&rsquo;ampiezza della funzione d&rsquo;onda macroscopica che la descrive, e la simmetria che si rompe &egrave; la fase di quell&rsquo;ampiezza. &Egrave; la stessa rottura di simmetria che sta sotto la superfluidit&agrave; e la superconduttivit&agrave;, ed &egrave; la ragione per cui questo movimento, scritto con un gas che non esiste, apre su met&agrave; della fisica della materia condensata.</p>`},
   {label:'Calore latente e Clapeyron: la lettura da primo ordine', body:R`
   <p>Sulla linea di transizione il gas si pu&ograve; descrivere come una miscela di due fasi, e la descrizione &egrave; quantitativa. Crisanti (pag. 296) ricava per prima cosa la forma della linea. Sulla linea $\lambda^3$ vale $v\,\zeta(3/2)$ e la pressione vale $T\zeta(5/2)/\lambda^3$, dunque $P=\left(\zeta(5/2)/\zeta(3/2)\right)T/v$; e dalla prima, poich&eacute; $\lambda^3\propto T^{-3/2}$, si ha $T\propto v^{-2/3}$. Combinando, la pressione va come
   $$v^{-2/3}\cdot v^{-1}=v^{-5/3}$$
   <p>cio&egrave; il prodotto $Pv^{5/3}$ &egrave; costante lungo la linea, perch&eacute;</p>
   $$v^{-2/3}\cdot v^{-1}\cdot v^{5/3}=1$$
   <p>&Egrave; la legge di un&rsquo;adiabatica di gas monoatomico, e non &egrave; una coincidenza: l&rsquo;entropia per particella eccitata &egrave; costante, quindi muoversi lungo la linea di transizione &egrave; muoversi a entropia specifica fissata.</p>
   <p>Il calore latente si ottiene dalla differenza di entropia fra le due fasi. La fase condensata ha entropia nulla, quella gassosa ha l&rsquo;entropia calcolata nella tappa 07, dunque il calore latente per particella &egrave; $L=T\Delta s$ con $\Delta s$ pari all&rsquo;entropia per particella eccitata:</p>
   $$L=\frac52\frac{\zeta(5/2)}{\zeta(3/2)}\,T\simeq1{,}2838\,T$$
   <p>Crisanti (pag. 297) verifica che questo &egrave; consistente con l&rsquo;<b>equazione di Clapeyron</b>: derivando rispetto a $T$ la pressione di evaporazione $T\zeta(5/2)/\lambda^3$ si ottiene per $dP_0/dT$ il valore $L/(T\Delta v)$, con $\Delta v=v_c$, dato che «quando le due fasi coesistono la fase gassosa ha volume specifico $v_c$ mentre quella condensata ha volume specifico nullo». Da qui la sua conclusione, a pag. 298: «quindi la condensazione di Bose-Einstein &egrave; una transizione di fase del primo ordine».</p>`},
   {label:'La classificazione contesa, e come si scioglie', body:R`
   <p>Qui le fonti non concordano con se stesse, e il disaccordo &egrave; istruttivo abbastanza da meritare di essere sciolto invece di scelto.</p>
   <p><b>La tesi «primo ordine»</b> ha argomenti veri: c&rsquo;&egrave; un calore latente, c&rsquo;&egrave; un tratto orizzontale nell&rsquo;isoterma, ci sono due fasi con volumi specifici diversi, e Clapeyron funziona. Crisanti (dietro Huang) la adotta.</p>
   <p><b>La tesi contraria</b> ha un argomento che le sta accanto nella stessa pagina: a pag. 298 Crisanti riporta la classificazione moderna, «primo ordine: sono quelle che coinvolgono un calore latente... continue, o del secondo ordine: queste non sono associate ad alcun calore latente. Esempi di transizioni di fase del secondo ordine sono la transizione ferromagnetica, <b>la transizione superfluida</b>» — e la transizione superfluida &egrave; proprio questa. E il calore specifico calcolato nella tappa 07 &egrave; <b>continuo</b> in $T_c$: nessun calore latente viene assorbito attraversando $T_c$ a densit&agrave; fissata.</p>
   <p><b>Lo scioglimento sta nel cammino.</b> Le due affermazioni parlano di due percorsi diversi nello spazio $(P,v,T)$. Attraversare la linea <b>lungo un&rsquo;isoterma</b>, comprimendo a temperatura fissata, &egrave; primo ordine: si passa da $v>v_c$ a $v<v_c$, si attraversa un tratto di coesistenza, si assorbe calore latente. Attraversare la linea <b>raffreddando a densit&agrave; fissata</b> &egrave; continuo: il parametro d&rsquo;ordine cresce da zero con continuit&agrave;, il calore specifico &egrave; continuo, e la prima discontinuit&agrave; compare nella sua derivata — cio&egrave; nella derivata terza dell&rsquo;energia libera, che nella scala di Ehrenfest &egrave; <b>terzo ordine</b>.</p>
   <p><b>Il fatto che rende compatibili le due letture</b> &egrave; la degenerazione della fase condensata: il condensato ha volume specifico <i>nullo</i>. Nelle transizioni ordinarie le due fasi in coesistenza hanno volumi specifici finiti e distinti, e la regione di coesistenza &egrave; una striscia bidimensionale nel piano $(P,v)$; qui una delle due &egrave; schiacciata su $v=0$, la «regione di coesistenza» degenera, e la fase condensata <i>giace sulla linea di transizione</i> invece di occupare un&rsquo;area. In una situazione degenere cos&igrave;, i criteri costruiti per il caso generico danno risposte diverse a seconda di quale si applichi — e questa &egrave; la risposta completa, non una via di mezzo.</p>
   <p><b>Che cosa scrivere all&rsquo;esame</b>, se la domanda arriva: che il calore specifico &egrave; continuo con derivata discontinua, dunque nella classificazione di Ehrenfest &egrave; del terzo ordine; che lungo un&rsquo;isoterma esiste un calore latente $L=\tfrac52(\zeta(5/2)/\zeta(3/2))T$ e la transizione si presenta come del primo ordine; e che le due cose non si contraddicono perch&eacute; la fase condensata ha volume specifico nullo. <b>Citare una sola delle due &egrave; incompleto anche quando &egrave; quella che il libro dice.</b></p>`},
   {label:'E l elio vero, che si comporta diversamente', body:R`
   <p>Ultimo controllo di realt&agrave;, ed &egrave; quello che mette il modello al suo posto. L&rsquo;elio-4 liquido ha una transizione a $2{,}18$ K, contro i $3{,}13$ K che il gas ideale predice: uno scarto del</p>
   $$\frac{3{,}13-2{,}18}{3{,}13}\times100\simeq30{,}4$$
   <p>per cento. Ma la discrepanza pi&ugrave; interessante non &egrave; nella temperatura: &egrave; nella <b>forma</b> del calore specifico. Quello calcolato qui ha una cuspide finita; quello misurato nell&rsquo;elio-4 ha una <b>divergenza logaritmica</b>, e la curva ha una forma cos&igrave; caratteristica che la transizione si chiama «punto lambda» dalla lettera greca che ne disegna il profilo.</p>
   <p><b>Che cosa insegna questa differenza.</b> Non che il modello sia sbagliato, ma che appartiene a una <i>classe di universalit&agrave; diversa</i>. Le interazioni, per quanto deboli, cambiano il comportamento critico: il gas ideale ha gli esponenti del cosiddetto modello sferico, l&rsquo;elio reale quelli del modello $XY$ tridimensionale. Il meccanismo — le particelle si accumulano in uno stato di singola particella e rompono una simmetria di fase — sopravvive intatto; i numeri che descrivono <i>come</i> ci si arriva no. <b>&Egrave; la situazione tipica delle transizioni di fase</b>: il modello senza interazioni indovina l&rsquo;esistenza, il meccanismo e l&rsquo;ordine di grandezza, e sbaglia gli esponenti critici, che dipendono solo da dimensionalit&agrave; e simmetria.</p>
   <p>Una nota finale che chiude il cerchio sulla conservazione del numero di particelle. Crisanti (pag. 300) riporta da Huang l&rsquo;osservazione che «perch&eacute; si formi un condensato &egrave; necessario che il numero di particelle si conservi. Per questo motivo non si &egrave; osservato un condensato di fotoni (che spariscono nel vuoto)», e aggiunge di suo — correttamente — che «oggi si &egrave; osservato anche un BEC di fotoni». <b>Il punto tecnico &egrave; giusto e vale la pena capirlo</b>: in un gas di fotoni all&rsquo;equilibrio il numero di particelle non &egrave; vincolato, dunque non c&rsquo;&egrave; nessun potenziale chimico da spingere contro un bordo, dunque nessuna transizione. Il condensato di fotoni osservato nel 2010 esiste proprio perch&eacute; l&rsquo;esperimento <i>impone</i> la conservazione del numero, confinando la luce in una microcavit&agrave; con un colorante che rediffonde i fotoni senza assorbirli. La condensazione, anche qui, segue il vincolo.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Se non ci sono interazioni, che cosa «rompe» la simmetria? Un sistema non interagente non dovrebbe avere un&rsquo;energia libera analitica?`,
    a:R`L&rsquo;energia libera di un sistema non interagente &egrave; analitica a <b>volume finito</b>, e questo &egrave; il punto. Il criterio invocato &egrave; che <b>una singolarit&agrave; termodinamica esiste solo nel limite termodinamico</b>: a $N$ finito il potenziale chimico vale $-T/N_0$, che &egrave; piccolo ma non nullo, tutte le funzioni di stato sono liscie, e non c&rsquo;&egrave; nessuna transizione. La non-analiticit&agrave; compare <i>come limite</i> di una successione di funzioni analitiche, ed &egrave; esattamente lo stesso meccanismo del modello di Ising. Ci&ograve; che il caso bosonico dimostra &egrave; che <b>per avere una transizione di fase non serve un&rsquo;interazione: serve un limite termodinamico e un vincolo</b>. Qui il vincolo &egrave; la simmetria della funzione d&rsquo;onda, che restringe lo spazio degli stati e produce correlazioni senza forze.`},
   {q:R`Come si riconosce, in un problema d&rsquo;esame, quale classificazione della transizione la domanda stia chiedendo?`,
    a:R`Dalla <b>variabile che il testo tiene fissa</b>, ed &egrave; l&rsquo;unica cosa da leggere. Se il problema parla di isoterme, di compressione, di volume specifico critico o chiede il calore latente, sta percorrendo un&rsquo;isoterma e la risposta &egrave; la lettura da primo ordine, con $L=\tfrac52(\zeta(5/2)/\zeta(3/2))T$ e Clapeyron. Se parla di raffreddamento a densit&agrave; fissata, di frazione condensata in funzione di $T$, o chiede il calore specifico, sta attraversando in temperatura e la risposta &egrave; la lettura continua, con la cuspide. <b>Il controllo che evita la figuraccia</b>: se si &egrave; appena calcolato un calore specifico continuo, non si pu&ograve; concludere «transizione del primo ordine» due righe dopo senza dire su quale cammino — sono i due fatti che la fonte del corso giustappone, e riprodurne la giustapposizione senza lo scioglimento &egrave; l&rsquo;errore da non fare.`}
  ]}
]},

/* ---------------- 09 · ESERCIZI ---------------- */
{ num:'09', title:'Esercizi — tocca a te', meta:'il potenziale a gradini in una dimensione, dove la condensazione non c è · e la dispersione lineare in una, due, tre dimensioni',
  blocchi:[
  {t:'esercizio', title:'1 · Potenziale a tre gradini in una dimensione: dimostrare che la condensazione NON esiste',
   src:'Crisanti pag. 289-292, esercizio d esame del 2014, quesito bosonico (D5) svolto qui per intero e completato',
   testo:R`$N$ particelle identiche non interagenti in una dimensione, confinate in $0\le q\le3L$, con $H=\frac{p^2}{2m}+V(q)$ e potenziale a gradini: $V=0$ per $0\le q\le L$, $V=V_0$ per $L\le q\le2L$, $V=2V_0$ per $2L\le q\le3L$. Nel caso di <b>bosoni di spin nullo</b>, discutere la possibilit&agrave; di una condensazione di Bose-Einstein.`,
   steps:[
    {label:'a · La densità degli stati, calcolata e non ricordata', body:R`
    <p><b>Il riconoscimento.</b> Si tratta di un problema unidimensionale con potenziale a tratti costanti: la densit&agrave; degli stati &egrave; la somma di tre contributi, uno per tratto, ciascuno acceso da una theta quando l&rsquo;energia supera la soglia di quel tratto. Si parte dalla definizione con la <span class="str" data-str="delta-di-dirac">delta</span> scritta come derivata di una theta, come nella tappa 01.</p>
    <p>Per un singolo tratto di lunghezza $L$ a potenziale nullo, l&rsquo;integrale della theta sullo spazio delle fasi &egrave; l&rsquo;area della regione $|p|\le\sqrt{2m\varepsilon}$, cio&egrave; la «palla unidimensionale» — un segmento di lunghezza $2\sqrt{2m\varepsilon}$ — moltiplicata per $L$ e divisa per $h$:</p>
    $$\frac1h\cdot2\sqrt{2m\varepsilon}\cdot L=\frac{2L}{h}\sqrt{2m\varepsilon}$$
    <p>Derivando rispetto all&rsquo;energia:</p>
    $$\frac{\partial}{\partial\varepsilon}\frac{2L}{h}\sqrt{2m\varepsilon}=\frac{L\sqrt{2m}}{h\sqrt\varepsilon}$$
    <p>e sommando i tre tratti, ciascuno con la sua soglia, si ottiene la densit&agrave; degli stati completa</p>
    $$G(\varepsilon)=\frac{L\sqrt{2m}}{h}\left[\frac{\theta(\varepsilon)}{\sqrt\varepsilon}+\frac{\theta(\varepsilon-V_0)}{\sqrt{\varepsilon-V_0}}+\frac{\theta(\varepsilon-2V_0)}{\sqrt{\varepsilon-2V_0}}\right]$$
    <p>identica a quella che Crisanti ricava a pag. 291 nel quesito fermionico dello stesso compito. <b>Si noti che le theta attraversano la derivata</b>: derivare una theta darebbe una delta, che moltiplicata per la radice che si annulla nello stesso punto d&agrave; contributo nullo — &egrave; il passaggio che Crisanti liquida con «poich&eacute; le funzioni $\theta$ attraversano le derivate», e che conviene aver capito una volta.</p>`},
    {label:'b · Il verdetto, dall esponente e da un integrale', body:R`
    <p><b>Il fondo dello spettro &egrave; $\varepsilon=0$</b> — il tratto a potenziale nullo esiste — dunque il vincolo sul potenziale chimico &egrave; $\mu\le0$ e l&rsquo;integrale che conta gli stati eccitati parte da zero. Nell&rsquo;intorno di zero solo il primo dei tre termini &egrave; acceso, e</p>
    $$G(\varepsilon)\propto\varepsilon^{-1/2}$$
    <p>cio&egrave; un esponente $\alpha-1$ pari a $-1/2$, e dunque <b>$\alpha=1/2$</b>. La regola della tappa 06 d&agrave; immediatamente la risposta: $\alpha\le1$, dunque <b>nessuna condensazione</b>. Ma il quesito chiede di discutere, e la discussione &egrave; il conto.</p>
    <p>Il massimo numero di particelle collocabili negli stati eccitati &egrave;</p>
    $$N_{\rm ecc}^{\max}=\int_0^{\infty}\frac{G(\varepsilon)}{e^{\beta\varepsilon}-1}\,d\varepsilon$$
    <p>e il comportamento dell&rsquo;integrando in zero si ottiene linearizzando l&rsquo;esponenziale: l&rsquo;occupazione va come $1/(\beta\varepsilon)$, dunque l&rsquo;integrando va come</p>
    $$\varepsilon^{-3/2}$$
    <p>cio&egrave; una potenza il cui integrale <b>diverge</b> in zero, come si &egrave; verificato nella tappa 06. Dunque $N_{\rm ecc}^{\max}$ &egrave; infinito: per qualunque numero di particelle e qualunque temperatura esiste un $\mu<0$ che soddisfa il vincolo, la fugacit&agrave; non arriva mai a uno, il livello fondamentale non diventa mai macroscopicamente occupato. <b>La condensazione non esiste a nessuna temperatura finita.</b></p>
    <p>Questa &egrave; la conclusione di Crisanti (pag. 292), che l&rsquo;esprime cos&igrave;: «$G(\varepsilon)/(e^{\beta\varepsilon}-1)\sim\varepsilon^{-3/2}$, che non &egrave; integrabile, vale a dire $N\to\infty$. Ne segue che non c&rsquo;&egrave; condensazione di Bose-Einstein». <b>Una correzione di forma alla sua riga</b>, che vale per chi la ricopia: nel passaggio precedente scrive «$G(\varepsilon)/(e^{\beta\varepsilon}-1)\to\theta(\varepsilon)/\sqrt\varepsilon$», che &egrave; il comportamento della sola $G$ e non del rapporto — il rapporto ha in pi&ugrave; l&rsquo;$1/(\beta\varepsilon)$, e sono proprio quei due fattori messi insieme a dare l&rsquo;esponente $-3/2$. La conclusione &egrave; giusta, il passaggio scritto no, e chi lo riproduce all&rsquo;esame perde il punto pi&ugrave; importante del quesito.</p>`},
    {label:'c · Il controllo che chiude, e la variante che ribalta la risposta', body:R`
    <p><b>Il controllo indipendente</b>, e conviene farlo perch&eacute; costa una riga: il risultato non pu&ograve; dipendere da $V_0$ n&eacute; dal numero di gradini, perch&eacute; l&rsquo;unica cosa che conta &egrave; il comportamento di $G$ vicino al <i>fondo</i> dello spettro, e i gradini superiori si accendono a energie finite. Un potenziale a cento gradini, o a gradini di altezza diversa, o addirittura un potenziale continuo purch&eacute; limitato e con un minimo su un tratto di lunghezza finita, d&agrave; la stessa risposta. <b>Il verdetto dipende solo dalla dimensionalit&agrave; e dalla dispersione</b>, e $d=1$ con $\varepsilon\propto p^2$ &egrave; irrimediabilmente sotto soglia.</p>
    <p><b>La variante che ribalta la risposta</b>, ed &egrave; il quesito che un esaminatore aggiunge per distinguere chi ha capito. Si sostituisca il potenziale a gradini con un potenziale <b>confinante</b>, per esempio armonico, $V(q)=\tfrac12m\omega^2q^2$, sempre in una dimensione. Allora $\alpha=d/a+d/b=1/2+1/2=1$: ancora marginale, ancora nessuna condensazione. Ma con un potenziale <b>lineare</b>, $V=\gamma|q|$, si ha $b=1$ e $\alpha=1/2+1=3/2$, cio&egrave; <b>la condensazione esiste</b>, con esattamente lo stesso esponente del gas libero in tre dimensioni. <b>Un potenziale abbastanza confinante rende condensabile un sistema unidimensionale</b>, e la ragione &egrave; sempre la stessa: sottrae stati a bassa energia.</p>
    <p>Per completezza il conto della temperatura critica in quel caso: la densit&agrave; degli stati &egrave; $G\propto\sqrt\varepsilon$ con prefattore $C=\sqrt{2m}/(h\gamma)\cdot2$, il conteggio d&agrave; $N=C\,T_c^{3/2}\Gamma(3/2)\zeta(3/2)$, e invertendo $T_c=\left[N/\left(C\Gamma(3/2)\zeta(3/2)\right)\right]^{2/3}$. <b>La frazione condensata &egrave; $1-(T/T_c)^{3/2}$</b>, la stessa del gas libero tridimensionale, perch&eacute; l&rsquo;esponente &egrave; lo stesso — ed &egrave; l&rsquo;osservazione da fare all&rsquo;orale, perch&eacute; mostra che due sistemi fisicamente incomparabili appartengono alla stessa classe.</p>`}
   ]},
  {t:'esercizio', title:'2 · Dispersione lineare in una, due e tre dimensioni: dove condensa e a che temperatura',
   src:'Crisanti pag. 292, esercizio proposto e non svolto nelle note («si può provare il seguente esercizio»), svolto qui per intero',
   testo:R`Particelle bosoniche indipendenti di spin nullo con hamiltoniana di singola particella $H=c\,|\vec p\,|$, confinate in una scatola di dimensione $d$, con $d=1,2,3$. (a) Verificare per quali dimensioni esiste la condensazione di Bose-Einstein. (b) Nei casi in cui esiste, determinare $T_c$ e l&rsquo;andamento di $N_0/N$ in funzione di $T$. (c) Discutere il caso $d=1$ con $H=c|p|+\gamma|q|$.`,
   steps:[
    {label:'a · Le tre densità di stati, e il verdetto', body:R`
    <p><b>Il riconoscimento.</b> La dispersione &egrave; lineare, dunque $a=1$; la scatola non porta energia, dunque il termine $d/b$ &egrave; nullo; la formula generale d&agrave; subito $\alpha=d$. Ma conviene fare i conti espliciti, perch&eacute; il prefattore serve per $T_c$ e perch&eacute; un esaminatore chiede la densit&agrave; degli stati.</p>
    <p><b>In tre dimensioni</b>, la regione $c|\vec p\,|\le\varepsilon$ &egrave; una palla di raggio $\varepsilon/c$, e con la misura radiale $4\pi p^2dp$:</p>
    $$\int_0^{\varepsilon/c}4\pi p^2\,dp=\frac{4\pi}{3}\frac{\varepsilon^3}{c^3}$$
    <p>da cui, moltiplicando per $V/h^3$ e derivando in $\varepsilon$:</p>
    $$G(\varepsilon)=\frac{4\pi V}{h^3c^3}\varepsilon^2$$
    <p>cio&egrave; $\alpha=3$. <b>In due dimensioni</b> la regione &egrave; un disco di raggio $\varepsilon/c$, e con la misura radiale $2\pi p\,dp$:</p>
    $$\int_0^{\varepsilon/c}2\pi p\,dp=\frac{\pi\varepsilon^2}{c^2}$$
    <p>che moltiplicata per $A/h^2$ e derivata d&agrave; $G(\varepsilon)=2\pi A\varepsilon/(h^2c^2)$, cio&egrave; $\alpha=2$. <b>In una dimensione</b> la regione &egrave; un segmento di lunghezza $2\varepsilon/c$, che moltiplicato per $L/h$ e derivato d&agrave; $G=2L/(hc)$, costante: $\alpha=1$.</p>
    <p><b>Il verdetto</b>, applicando il criterio $\alpha>1$: la condensazione esiste per $d=3$ e per $d=2$, e <b>non esiste</b> per $d=1$. &Egrave; esattamente la risposta che Crisanti indica fra parentesi — «c&rsquo;&egrave; condensazione per $D=2,3$» — e vale la pena notare quanto sia diverso dal caso non relativistico, dove la soglia cade fra due e tre invece che fra uno e due. <b>Una dispersione pi&ugrave; piatta favorisce la condensazione</b>, perch&eacute; a energia fissata mette a disposizione meno stati vicino al fondo.</p>
    <p>Per $d=1$ la motivazione da scrivere: $G$ &egrave; costante, l&rsquo;integrando va come $1/(\beta\varepsilon)$ e l&rsquo;integrale diverge logaritmicamente. Come nel caso del gas piatto non relativistico, questo &egrave; il caso <b>marginale</b>: la divergenza &egrave; la pi&ugrave; debole possibile, e si pu&ograve; addirittura risolvere per intero — da $N=\left(2LT/hc\right)\left(-\log(1-z)\right)$ segue una fugacit&agrave; esponenzialmente vicina a uno ma sempre minore, con $T_c=0$.</p>`},
    {label:'b · Le temperature critiche, e le frazioni condensate', body:R`
    <p><b>Tre dimensioni.</b> Imponendo $z=1$ e sostituendo $y=\beta\varepsilon$:</p>
    $$N=\frac{4\pi V}{h^3c^3}\,T_c^3\int_0^{\infty}\frac{y^2}{e^y-1}\,dy$$
    <p>e l&rsquo;integrale vale $\Gamma(3)\zeta(3)\simeq2{,}4041$, cio&egrave; $2\zeta(3)$ dato che $\Gamma(3)=2$. Invertendo:</p>
