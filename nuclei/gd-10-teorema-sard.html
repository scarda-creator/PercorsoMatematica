<script>
"use strict";
const R = String.raw;

function typeset(el){
  if(el && window.renderMathInElement){
    try{ renderMathInElement(el,{delimiters:[
      {left:'$$',right:'$$',display:true},
      {left:'$',right:'$',display:false}
    ],throwOnError:false}); }catch(e){}
  }
}
function elFromHTML(html){ var d=document.createElement('div'); d.innerHTML=html; return d; }

/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un
   rimando scritto nella prosa:

       <span class="str" data-str="serie-geometrica">la serie geometrica</span>

   Le schede citate da questo nucleo sono cucite qui sotto dal montaggio
   (assembla-nucleo.js): la pagina resta autosufficiente — niente fetch,
   niente sottocartelle da pubblicare — e un rimando a una scheda che non
   esiste FERMA la costruzione invece di arrivare in pagina rotto.
   Apertura: lo stesso gesto del collaudo (si clicca, il pannello compare,
   si typeset una volta sola), portato dentro la frase.
   =================================================================== */
var CORSO = 'geometria-differenziale';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};


function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';
  return h;
}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

/* ===================================================================
   >>> CONTENUTO — Nucleo gd-10: Il teorema di Sard, dimostrato: perché i valori critici sono quasi nessuno <<<
   Modello dati: TAPPE[] ; ogni tappa ha blocchi[] con un tipo (t).
   Tipi: prosa | gram | reveal | esercizio | collaudo | prolessi | plot
   Tutta la matematica in R`...` (String.raw). Nelle formule si usano

   =================================================================== */

var TAPPE = [


/*MOVIMENTO
id:        gd-10 — il teorema di Sard, dimostrato
identita:  perché i valori critici sono quasi nessuno, e come si dimostra
copre:     G.21
serve:     gd-09 (gd-09-immersioni-whitney.html)
apre:      gd-17 (gd-17-trasversalita.html)
registro:  Lezioni del 19/11 e 22/11/2019 — base dell'induzione, riduzione al caso euclideo, le tre tappe
generata:  2026-09-18 da mappa.json — non modificare a mano, si cambia la mappa
MOVIMENTO*/

/*CONTROLLO
[
 {"tipo":"uguale","sinistra":"(delta/k)**n*k**n","vale":"delta**n",
  "ipotesi":{"delta":"positive","k":"positive","n":"positive"},
  "dove":"02","appare":"\\delta^{n}"},

 {"tipo":"limite","espr":"k**n*(C/k**2)**n","var":"k","a":"oo","vale":"0",
  "ipotesi":{"k":"positive","C":"positive","n":"positive"},
  "dove":"02","appare":"tende a zero"},

 {"tipo":"uguale","sinistra":"n*2-n","vale":"n",
  "ipotesi":{"n":"positive"},
  "dove":"02","appare":"<b>quando $n$ è grande</b>"},

 {"tipo":"simbolico","dove":"01","appare":"\\operatorname{Crit}(F)",
  "perche":"e' la notazione dell'insieme dei punti critici, definito nella riga stessa"},

 {"tipo":"simbolico","dove":"02","appare":"|F(y)-F(x)-dF_x(y-x)|\\le C|y-x|^{2}",
  "perche":"e' la stima di Taylor al secondo ordine con costante C non specificata: un enunciato dell'analisi, non un valore"}
]
CONTROLLO*/

/* ---------------- 00 · DI COSA PARLA QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Di cosa parla questo movimento', meta:'Geometria Differenziale · voce G.21 · due lezioni intere per un solo teorema',
  blocchi:[
  {t:'prosa', title:'Perche vale due lezioni', tag:'architettura', html:R`
  <p>Il teorema del valore regolare (gd-08) funziona <b>solo sui valori regolari</b>, e finora nulla garantiva che ce ne fossero. Whitney (gd-09) ha usato il fatto che «quasi tutte» le proiezioni vanno bene, senza dimostrarlo. <b>Sard è il teorema che rende legittimi entrambi</b>:</p>
  <p style="text-align:center"><b>l&rsquo;insieme dei valori critici di una mappa liscia ha misura nulla.</b></p>
  <p><b>Sempre.</b> Per ogni mappa liscia fra varietà qualsiasi, senza ipotesi di compattezza, di rango, di niente. È uno dei teoremi più forti e meno intuitivi del corso — e Diverio, che per il resto è essenziale, gli dedica <b>due lezioni intere</b> e lo dimostra per esteso. Questo movimento segue quella dimostrazione.</p>
  <div class="note"><b>Attenzione a cosa NON dice.</b> Sard parla dei <b>valori</b> (nel codominio), non dei <b>punti</b> critici (nel dominio): l&rsquo;insieme dei punti critici può essere enorme. Per la funzione costante $F\equiv0$ su $\mathbb{R}^n$ <i>tutti</i> i punti sono critici, e infatti l&rsquo;insieme dei valori critici è $\{0\}$ — un punto, di misura nulla. <b>È la distinzione di gd-08, e qui è tutto il contenuto dell&rsquo;enunciato.</b></div>`}
]},

/* ---------------- 01 · L'ENUNCIATO ---------------- */
{ num:'01', title:'Lenunciato preciso, e le riduzioni preliminari', meta:'la forma generale · riduzione al caso euclideo · perche basta il locale',
  blocchi:[
  {t:'prosa', title:'Lenunciato e le due riduzioni', tag:'grammatica', html:R`
  <p><b>Teorema (Sard).</b> Sia $F:M\to N$ liscia fra varietà. Allora l&rsquo;insieme dei valori critici $F(\operatorname{Crit}(F))$ ha misura nulla in $N$. Equivalentemente: <b>quasi ogni punto di $N$ è un valore regolare</b>.</p>
  <p><b>Prima riduzione: al caso euclideo.</b> Misura nulla è una nozione locale e invariante per diffeomorfismi (gd-08), e una varietà ha una base <b>numerabile</b> di carte. Un&rsquo;unione numerabile di insiemi di misura nulla ha misura nulla. Quindi <b>basta dimostrare il teorema per $F:U\subseteq\mathbb{R}^n\to\mathbb{R}^m$</b>. Ecco perché in gd-01 si era richiesta la base numerabile: senza, questa riduzione salta.</p>
  <p><b>Seconda riduzione: si può lavorare su un cubo</b>. $U$ è unione numerabile di cubi chiusi contenuti in $U$, quindi basta stimare il contributo di ciascun cubo compatto — e lì si hanno stime uniformi, perché le derivate sono limitate sui compatti.</p>
  <p><b>La struttura della dimostrazione è un&rsquo;induzione su $n$</b> (la dimensione del dominio), e la base è il caso $n=0$, banale. Il passo induttivo si spezza in tre tappe, ed è il contenuto delle due lezioni.</p>`}
]},

/* ---------------- 02 · IL CUORE ---------------- */
{ num:'02', title:'Il cuore della dimostrazione: perche il conteggio funziona', meta:'il caso facile m>n · la stima di Taylor · e il conto dei cubetti',
  blocchi:[
  {t:'reveal', title:'Il meccanismo, nel caso piu limpido', tag:'costruzione', steps:[
   {label:'Il caso m > n, che si fa a mano', body:R`
   <p>Se la dimensione d&rsquo;arrivo è <b>maggiore</b> di quella di partenza, <i>tutti</i> i punti sono critici (il differenziale non può essere suriettivo), e l&rsquo;enunciato diventa: <b>l&rsquo;immagine di una mappa liscia da $\mathbb{R}^n$ a $\mathbb{R}^m$ con $m>n$ ha misura nulla</b>. Cioè: una curva non riempie il piano, una superficie non riempie lo spazio.</p>
   <p><b>Ed è falso per mappe solo continue</b> — la curva di Peano (gd-08) riempie un quadrato. Quindi la liscezza è essenziale, e la dimostrazione deve usarla: lo fa con la <b>lipschitzianità sui compatti</b>, che controlla di quanto una mappa può dilatare.</p>`},
   {label:'Il conto dei cubetti, ed e tutta lidea', body:R`
   <p>Si prende un cubo di lato $\delta$ e lo si divide in $k^{n}$ cubetti di lato $\delta/k$: il volume totale è ancora <b>$\delta^{n}$</b>, il che è ovvio ma serve per non perdersi.</p>
   <p>Su un cubetto che contiene un punto critico $x$, la <b>stima di Taylor</b> dà
   $$|F(y)-F(x)-dF_x(y-x)|\le C|y-x|^{2}.$$
   Il termine lineare $dF_x$ manda tutto in un sottospazio di dimensione $<m$ (perché $x$ è critico), quindi <b>l&rsquo;immagine del cubetto sta in un «piattino» sottile</b>: largo quanto il cubetto nelle direzioni dell&rsquo;immagine del differenziale, e spesso solo $C(\delta/k)^{2}$ nelle altre.</p>
   <p>Il volume di quel piattino è dell&rsquo;ordine di $(\delta/k)^{n}\cdot(C/k^{2})^{m-n}$, e sommando sui $k^{n}$ cubetti si ottiene una quantità che, al crescere di $k$, <b>tende a zero</b>. <b>È il conto che chiude il caso, ed è tutto qui</b>: il termine quadratico di Taylor batte il conteggio dei cubetti.</p>`},
   {label:'Le tre tappe del caso generale', body:R`
   <p>Nel caso generale si stratifica l&rsquo;insieme critico secondo <b>quante derivate si annullano</b>:
   $$\operatorname{Crit}(F)\supseteq C_1\supseteq C_2\supseteq\cdots$$
   dove $C_j$ è dove si annullano tutte le derivate fino all&rsquo;ordine $j$. Le tre tappe sono:</p>
   <ol>
    <li><b>$F(\operatorname{Crit}\setminus C_1)$ ha misura nulla</b>: qui il differenziale non è nullo, si usa l&rsquo;ipotesi induttiva su una sottovarietà di dimensione minore (è qui che serve l&rsquo;induzione su $n$);</li>
    <li><b>$F(C_j\setminus C_{j+1})$ ha misura nulla</b> per ogni $j$: si applica Fubini per la misura nulla, riducendo la dimensione;</li>
    <li><b>$F(C_j)$ ha misura nulla per $j$ abbastanza grande</b>: con tante derivate nulle la stima di Taylor è di ordine alto, e il conto dei cubetti chiude. Serve $j>m/n-1$, cioè <b>quando $n$ è grande</b> basta un ordine modesto.</li>
   </ol>
   <p><b>L&rsquo;ordine finito di derivate che serve è il motivo per cui Sard richiede $C^k$ con $k$ abbastanza grande</b>, e non vale per mappe solo $C^1$ in dimensioni alte — un fatto che sorprende e che Diverio segnala.</p>`}
  ]}
]},

/* ---------------- 03 · LE CONSEGUENZE ---------------- */
{ num:'03', title:'Le conseguenze, e perche il teorema si usa piu di quanto si dimostri', meta:'quasi ogni valore e regolare · la genericita · e il ruolo in Whitney e trasversalita',
  blocchi:[
  {t:'prosa', title:'Che cosa autorizza a fare', tag:'regola operativa', html:R`
  <ul>
   <li><b>Quasi ogni fibra è una sottovarietà.</b> Combinando con gd-08: per quasi ogni $c$, $F^{-1}(c)$ è una sottovarietà liscia di dimensione $\dim M-\dim N$. <b>È l&rsquo;enunciato che si usa davvero</b>, e permette di dire «perturbando di poco il livello, l&rsquo;insieme diventa liscio»;</li>
   <li><b>la genericità.</b> «Per quasi ogni scelta» diventa un argomento rigoroso: nelle dimostrazioni di gd-09 (proiezioni buone per Whitney) e gd-17 (perturbazioni che rendono trasversi) il passaggio chiave è sempre «l&rsquo;insieme delle scelte cattive è l&rsquo;immagine dei punti critici di qualche mappa ausiliaria, quindi ha misura nulla»;</li>
   <li><b>l&rsquo;esistenza senza costruzione.</b> Sard non esibisce un valore regolare: dice che ce ne sono quasi tutti. <b>È un teorema di esistenza puro</b>, e in questo somiglia più alla teoria della misura che alla geometria.</li>
  </ul>
  <p><b>Il modo giusto di ricordarlo</b>: una mappa liscia <i>non può schiacciare troppo</i>. Può avere un insieme critico enorme nel dominio, ma le immagini di quei punti si comprimono in un insieme trascurabile. La liscezza impone che la compressione, dove avviene, sia quadratica — e il quadratico batte il conteggio.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`La funzione costante ha tutti i punti critici. Contraddice Sard?`,
    a:R`No, e anzi chiarisce l&rsquo;enunciato: i punti critici sono <b>tutti</b>, ma i <i>valori</i> critici sono un punto solo — l&rsquo;unico valore assunto — e un punto ha misura nulla in $\mathbb{R}^m$ per $m\ge1$. <b>Sard non limita quanto può essere grande l&rsquo;insieme critico nel dominio</b>, solo quanto può essere grande la sua immagine.`},
   {q:R`Perché la curva di Peano non è un controesempio?`,
    a:R`Perché non è <b>liscia</b>: è continua e basta. La dimostrazione usa la stima di Taylor al secondo ordine, che richiede almeno $C^2$; senza derivate non c&rsquo;è nessun controllo sulla dilatazione dei cubetti, e una mappa continua può davvero mandare un insieme di misura nulla su uno di misura piena. <b>È l&rsquo;esempio che dice quale ipotesi sta lavorando</b>, ed è il motivo per cui gd-08 lo introduce prima.`}
  ]}
]},

/* ---------------- 04 · IL SENSO ---------------- */
{ num:'04', title:'Il senso, e le rotte', meta:'cosa chiude, e dove la genericita e uno strumento',

  <p><b>A valle.</b> gd-17 usa Sard per la trasversalità, che è la forma in cui la genericità entra nei problemi concreti. E chiude il primo blocco del corso: da gd-11 in poi si passa ai campi, ai flussi, alle equazioni.</p>`},

    {dove:'Meccanica<br>statistica', txt:R`Le superfici di energia costante sono lisce per quasi ogni valore di E: e' Sard applicato all'hamiltoniana, ed e' cio' che rende ben definita la misura microcanonica senza doverlo verificare caso per caso.`}

   domanda:R`Sard dice che i valori critici sono trascurabili <b>in misura</b>. Ma esistono mappe lisce i cui valori critici sono <b>densi</b> — trascurabili in misura eppure presenti ovunque. <b>Domanda che porti avanti:</b> «piccolo in misura» e «piccolo topologicamente» (magro, di prima categoria) sono nozioni diverse e incompatibili: esiste una decomposizione di $\mathbb{R}$ in due insiemi, uno di misura nulla e uno magro. <b>Quale delle due è la nozione giusta di «trascurabile» in fisica?</b> Dipende dalla domanda — e in teoria KAM (che incontrerai in meccanica statistica) la risposta è delicata proprio perché i tori invarianti che sopravvivono sono di misura grande ma topologicamente sottili.`}

/* =================================================================== */
var byId = {}; TAPPE.forEach(function(s){ byId[s.num]=s; });

var VKEY='pm-nucleogd-10-visited';
function loadSeen(){ try{ return new Set(JSON.parse(localStorage.getItem(VKEY)||'[]')); }catch(e){ return new Set(); } }
function saveSeen(s){ try{ localStorage.setItem(VKEY, JSON.stringify(Array.from(s))); }catch(e){} }
var SEEN = loadSeen();

function renderNav(active){
  var nav=document.getElementById('sidebar');
  nav.innerHTML='';
  var h=document.createElement('h2'); h.textContent='Nucleo gd-10 · le tappe'; nav.appendChild(h);
  TAPPE.forEach(function(s){
    var b=document.createElement('button');
    b.className='navitem'+(active===s.num?' active':'')+(SEEN.has(s.num)?' seen':'');
    b.innerHTML='<span class="dot"></span><span class="nx">'+s.num+'</span><span>'+s.title+'</span>';
    b.onclick=function(){ showTappa(s.num); };
    nav.appendChild(b);
  });
}

/* ---- renderer dei blocchi ---- */
function sectionProsa(title, tag, html){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var body=elFromHTML('<div class="open-body">'+html+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function sectionGram(title, rows){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag gramtag">grammatica</span></h3>';
  var inner='<table class="gramtab">';
  rows.forEach(function(r){ inner+='<tr><td class="gs">'+r[0]+'</td><td>'+r[1]+'</td></tr>'; });
  inner+='</table>';
  var body=elFromHTML('<div class="gramwrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
/* --- blocco PLOT: la figura non decora, si legge. Ogni plot porta una chiave di lettura. --- */
function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';
  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
    else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
    else if(b.t==='prolessi') m.appendChild(sectionProlessi(b));
    else if(b.t==='reveal')m.appendChild(sectionReveal(b.title,b.tag,b.steps));
    else if(b.t==='esercizio') m.appendChild(sectionEsercizio(b));
    else if(b.t==='collaudo')  m.appendChild(sectionCollaudo(b.title,b.items));
    else if(b.t==='plot')      m.appendChild(sectionPlot(b));
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}

/* deep-link: gd-10-teorema-sard.html#03 apre direttamente la tappa 03 */
window.addEventListener('DOMContentLoaded', function(){
  var h=(location.hash||'').replace('#','');
  showTappa(byId[h]?h:'00');
});
window.addEventListener('hashchange', function(){
  var h=(location.hash||'').replace('#','');
  if(byId[h]) showTappa(h);
});
