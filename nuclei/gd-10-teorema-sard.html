/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un

var CORSO = 'geometria-differenziale';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["misura-nulla"] = {"nome":"Insieme di misura nulla","riga":"$A$ ha misura nulla se per ogni $\\varepsilon\\gt0$ esiste una famiglia numerabile di cubi che lo ricopre e la cui somma dei volumi è minore di $\\varepsilon$: «trascurabile» non vuol dire piccolo, vuol dire coperto a costo arbitrariamente basso.","serve":"È la nozione che permette di dire «quasi ogni» senza teoria della misura completa: non serve costruire Lebesgue, basta la definizione col ricoprimento, ed è per questo che entra in geometria differenziale senza dipendenze. Tre proprietà fanno tutto il lavoro, e sono le sole che si usano: (a) un'unione **numerabile** di insiemi di misura nulla ha misura nulla — è ciò che consente di ragionare carta per carta su una varietà, che di carte ne ha una base numerabile; (b) avere misura nulla è **invariante per diffeomorfismi**, anzi per mappe lisce fra aperti della stessa dimensione, quindi è una proprietà che la varietà possiede indipendentemente dalle carte scelte; (c) un insieme di misura nulla ha **parte interna vuota**, quindi il suo complementare è denso: da «i valori cattivi hanno misura nulla» segue sempre «ce n'è uno buono comunque vicino». La numerabilità in (a) non è un dettaglio tecnico: l'unione **non** numerabile dei punti di $[0,1]$, ciascuno di misura nulla, è $[0,1]$.","esempio":"I razionali di $[0,1]$ hanno misura nulla, pur essendo densi. Si enumerano, $q_1,q_2,\\dots$ — si può, sono numerabili — e attorno a $q_n$ si mette un intervallo di lunghezza $\\varepsilon/2^{n}$. Il ricoprimento c'è per costruzione, e la somma delle lunghezze è $\\sum_{n\\ge1}\\varepsilon/2^{n}=\\varepsilon$, arbitrariamente piccola. Il conto che regge tutto è la serie geometrica: si spende un budget finito distribuendolo su infiniti punti, perché i pezzi decrescono in modo sommabile. Lo stesso conto, rovesciato, dà l'insieme di Cantor: al passo $k$ restano $2^{k}$ intervalli di lunghezza $3^{-k}$, per una misura totale $(2/3)^{k}$, e $\\lim_{k\\to\\infty}(2/3)^{k}=0$ — misura nulla pur essendo più che numerabile, il che mostra che «numerabile» e «di misura nulla» sono condizioni diverse e la prima è solo sufficiente.","debito":"la misura di Lebesgue vera — $\\sigma$-additività, misurabilità, insiemi non misurabili — sta fuori dal percorso, e qui non serve: in geometria differenziale di «misura» si usa soltanto l'ideale degli insiemi trascurabili. Il teorema di Fubini per la misura nulla («se quasi ogni fetta è trascurabile nella fetta, l'insieme è trascurabile») si usa nella dimostrazione di Sard ed è ammesso senza prova.","controllo":[{"tipo":"somma","espr":"eps/2**n","var":"n","da":"1","a":"oo","vale":"eps","ipotesi":{"eps":"positive","n":"positive"},"dove":"esempio","appare":"\\sum_{n\\ge1}\\varepsilon/2^{n}=\\varepsilon"},{"tipo":"uguale","sinistra":"2**k*3**(-k)","vale":"(2/3)**k","ipotesi":{"k":"positive"},"dove":"esempio","appare":"(2/3)^{k}"},{"tipo":"limite","espr":"(2/3)**k","var":"k","a":"oo","vale":"0","ipotesi":{"k":"positive"},"dove":"esempio","appare":"\\lim_{k\\to\\infty}(2/3)^{k}=0"}]};
STRUM["lipschitziana"] = {"nome":"Mappa lipschitziana","riga":"$|f(y)-f(x)|\\le L|y-x|$ con $L$ fisso: la mappa non può dilatare più di un fattore $L$, e quel fattore vale su tutta la scala, non solo nel limite infinitesimo.","serve":"È la forma quantitativa del controllo che la derivata dà solo puntualmente, ed è ciò che serve per stimare **volumi** invece che direzioni. Una mappa $C^1$ su un **compatto** è automaticamente lipschitziana con $L=\\max\\lVert df\\rVert$, per il teorema del valor medio applicato al segmento — e questa è la ragione per cui in geometria differenziale le stime si fanno sempre dopo aver ristretto a un cubo chiuso. La conseguenza che si usa è geometrica: un insieme di diametro $d$ va in un insieme di diametro $\\le Ld$, dunque un cubo di lato $\\ell$ finisce dentro un cubo di lato $L\\sqrt{n}\\,\\ell$, e i volumi si moltiplicano al più per $(L\\sqrt{n})^{n}$. Da qui segue in una riga che **una mappa lipschitziana manda insiemi di misura nulla in insiemi di misura nulla**: ricoprili con cubi di volume totale $\\varepsilon$, le immagini stanno in cubi di volume totale $\\le(L\\sqrt{n})^{n}\\varepsilon$, e la costante non dipende da $\\varepsilon$. Per mappe solo continue l'implicazione è falsa, e il controesempio è la curva di Peano.","esempio":"$f(x)=x^{2}$ su $[0,2]$ è lipschitziana e la costante si legge dalla derivata: $f'(x)=2x$, massima in $x=2$, dove vale $4$. Quindi $L=4$, e infatti $|y^{2}-x^{2}|=|y+x|\\,|y-x|\\le4|y-x|$ per $x,y\\in[0,2]$ — la fattorizzazione mostra che è proprio la stima del valor medio, con $|y+x|$ al posto di $|f'(\\xi)|$. La stessa $f$ su tutto $\\mathbb{R}$ **non** è lipschitziana: $|y+x|$ non è limitato, e nessuna costante regge. È il caso che spiega perché la lipschitzianità è una proprietà **sui compatti** e non una proprietà della formula: la liscezza è locale, la costante è globale, e il compatto è il ponte fra le due.","debito":"la teoria di Rademacher (una funzione lipschitziana è differenziabile quasi ovunque) e le funzioni assolutamente continue stanno fuori dal percorso: qui serve solo la direzione facile, da $C^1$ sul compatto a lipschitziana.","controllo":[{"tipo":"derivata","espr":"x**2","rispetto":["x"],"vale":"2*x","ipotesi":{"x":"positive"},"dove":"esempio","appare":"f'(x)=2x"},{"tipo":"numero","espr":"2*2","vale":"4","dove":"esempio","appare":"vale $4$"},{"tipo":"uguale","sinistra":"y**2-x**2","vale":"(y+x)*(y-x)","dove":"esempio","appare":"|y+x|\\,|y-x|"}]};
STRUM["compattezza"] = {"nome":"Compattezza","riga":"Ogni ricoprimento aperto ammette un sottoricoprimento finito: è la proprietà che permette di passare da «vale vicino a ogni punto» a «vale su tutto», con un numero finito di passi.","serve":"È l'ipotesi che rende globali le conclusioni locali, ed è per questo che ricorre in ogni dimostrazione di geometria differenziale. In $\\mathbb{R}^n$ equivale a chiuso e limitato (Heine-Borel), ma su una varietà quell'equivalenza non si può usare come definizione, perché «limitato» richiede una distanza e una varietà non ne ha una privilegiata. La conseguenza che si usa più spesso è negativa: gli unici sottoinsiemi di $\\mathbb{R}^n$ che sono **insieme** aperti e compatti sono $\\emptyset$ e nient'altro — ed è l'argomento per cui una varietà compatta non può essere coperta da una sola carta.","esempio":"L'intervallo $(0,1)$ non è compatto, e si vede esibendo un ricoprimento senza sottoricoprimento finito: gli aperti $A_n=\\left(\\tfrac1n,1\\right)$ per $n\\ge2$ ricoprono $(0,1)$, perché ogni $x\\gt0$ sta in $A_n$ appena $\\tfrac1n\\lt x$, cioè appena $n\\gt1/x$. Ma una sottofamiglia finita $A_{n_1},\\dots,A_{n_k}$ ha un indice massimo $N$, quindi la sua unione è $\\left(\\tfrac1N,1\\right)$, e il punto $x=\\tfrac1{2N}$ resta fuori: è positivo, dunque sta in $(0,1)$, ed è minore di $\\tfrac1N$. Il conto che regge l'argomento è $\\lim_{n\\to\\infty}\\tfrac1n=0$: gli $A_n$ si avvicinano a coprire tutto, ma nessuno di essi contiene un intorno di $0$, e servirebbero tutti. Chiudendo l'intervallo, $[0,1]$ diventa compatto e quel ricoprimento smette di essere un ricoprimento — $0$ non sta in nessun $A_n$.","debito":"la dimostrazione del teorema di Heine-Borel e la teoria generale degli spazi compatti stanno fuori dal percorso: qui c'è l'uso che se ne fa. Nel corso di Diverio la compattezza entra come ipotesi (sfera, gruppi di Lie compatti) e come conclusione della locale compattezza delle varietà.","controllo":[{"tipo":"limite","espr":"1/n","var":"n","a":"oo","vale":"0","ipotesi":{"n":"positive"},"dove":"esempio","appare":"\\lim_{n\\to\\infty}\\tfrac1n=0"},{"tipo":"disuguaglianza","sinistra":"1/(2*N)","destra":"1/N","relazione":"<","ipotesi":{"N":"positive"},"dove":"esempio","appare":"minore di $\\tfrac1N$"}]};

  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';
  return h;
}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

/* ---------------- 00 · DI COSA PARLA QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Di cosa parla questo movimento', meta:'Geometria Differenziale · voce G.21 · due lezioni intere per un solo teorema',
  blocchi:[
  {t:'prosa', title:'Perche vale due lezioni', tag:'architettura', html:R`
  <p>Il teorema del valore regolare (gd-08) funziona <b>solo sui valori regolari</b>, e finora nulla garantiva che ce ne fossero. Whitney (gd-09) ha usato il fatto che «quasi tutte» le proiezioni vanno bene, senza dimostrarlo. <b>Sard è il teorema che rende legittimi entrambi</b>:</p>
  <p style="text-align:center"><b>l&rsquo;insieme dei valori critici di una mappa liscia ha misura nulla.</b></p>
  <p><b>Sempre.</b> Per ogni mappa liscia fra varietà qualsiasi, senza ipotesi di compattezza, di rango, di niente. È uno dei teoremi più forti e meno intuitivi del corso — e Diverio, che per il resto è essenziale, gli dedica <b>due lezioni intere</b> e lo dimostra per esteso. Questo movimento segue quella dimostrazione.</p>
  <div class="note"><b>Attenzione a cosa NON dice.</b> Sard parla dei <b>valori</b> (nel codominio), non dei <b>punti</b> critici (nel dominio): l&rsquo;insieme dei punti critici può essere enorme. Per la funzione costante $F\equiv0$ su $\mathbb{R}^n$ <i>tutti</i> i punti sono critici, e infatti l&rsquo;insieme dei valori critici è $\{0\}$ — un punto, di misura nulla. <b>È la distinzione di gd-08, e qui è tutto il contenuto dell&rsquo;enunciato.</b></div>
  <p><b>Come è fatto il movimento</b>, perché la dimostrazione è lunga e conviene sapere dove si sta andando. Prima si enuncia e si riduce: il teorema su varietà qualsiasi diventa, in tre righe, un teorema su un cubo di $\mathbb{R}^{n}$ — ed è la parte che costa meno e che si dimentica più in fretta. Poi si monta l&rsquo;attrezzo, cioè la nozione di <span class="str" data-str="misura-nulla">insieme di misura nulla</span> con le tre sole proprietà che servono: nulla di teoria della misura, solo ricoprimenti e serie geometriche. Poi il cuore: il conto dei cubetti, che è l&rsquo;unica idea vera e sta in mezza pagina. Infine gli esercizi, dove si calcolano insiemi critici espliciti e si vede il conto funzionare su numeri.</p>
  <p><b>Una cosa da tenere a mente dall&rsquo;inizio</b>: Sard non è un teorema di geometria, è un teorema di <i>analisi</i> travestito. La geometria serve solo a ridurre il problema al caso euclideo; da lì in poi si stima, si ricopre, si somma una serie. <b>Chi cerca l&rsquo;intuizione geometrica del perché i valori critici siano pochi non la trova</b>, e non perché sia nascosta: è che la ragione è quantitativa, e sta nel fatto che il resto di Taylor è quadratico mentre il conteggio dei cubetti è lineare in ciascuna direzione. Il movimento insiste su questo punto perché è l&rsquo;unico che, saputo, permette di ricostruire la dimostrazione senza ricordarla.</p>`}
]},

/* ---------------- 01 · L'ENUNCIATO ---------------- */
{ num:'01', title:'Lenunciato preciso, e le riduzioni preliminari', meta:'la forma generale · riduzione al caso euclideo · perche basta il locale',
  blocchi:[
  {t:'prosa', title:'Lenunciato e le due riduzioni', tag:'grammatica', html:R`
  <p><b>Teorema (Sard).</b> Sia $F:M\to N$ liscia fra varietà. Allora l&rsquo;insieme dei valori critici $F(\operatorname{Crit}(F))$ ha misura nulla in $N$. Equivalentemente: <b>quasi ogni punto di $N$ è un valore regolare</b>.</p>
  <p><b>Prima riduzione: al caso euclideo.</b> Misura nulla è una nozione locale e invariante per diffeomorfismi (gd-08), e una varietà ha una base <b>numerabile</b> di carte. Un&rsquo;unione numerabile di insiemi di misura nulla ha misura nulla. Quindi <b>basta dimostrare il teorema per $F:U\subseteq\mathbb{R}^n\to\mathbb{R}^m$</b>. Ecco perché in gd-01 si era richiesta la base numerabile: senza, questa riduzione salta.</p>
  <p><b>Seconda riduzione: si può lavorare su un cubo</b>. $U$ è unione numerabile di cubi chiusi contenuti in $U$, quindi basta stimare il contributo di ciascun cubo compatto — e lì si hanno stime uniformi, perché le derivate sono limitate sui compatti.</p>
  <p><b>La struttura della dimostrazione è un&rsquo;induzione su $n$</b> (la dimensione del dominio), e la base è il caso $n=0$, banale. Il passo induttivo si spezza in tre tappe, ed è il contenuto delle due lezioni.</p>`},
  {t:'prosa', title:'Che cosa vuol dire «misura nulla» su una varieta, che una misura non ce lha', tag:'definizione', html:R`
  <p>Qui c&rsquo;è un punto delicato che conviene sciogliere subito, perché l&rsquo;enunciato sembra chiedere più di quanto il corso abbia costruito. <b>Una varietà astratta non ha una misura canonica</b>: per averne una servirebbe una metrica riemanniana, oppure una forma di volume, e nessuna delle due è stata introdotta. Dire «$A\subseteq N$ ha misura nulla» sembra quindi privo di senso.</p>
  <p>Non lo è, e la ragione è che <b>l&rsquo;essere trascurabile non richiede di sapere quanto misura ciò che non lo è</b>. La definizione si dà per carte: $A$ ha misura nulla in $N$ se per ogni carta $(V,\psi)$ l&rsquo;insieme $\psi(A\cap V)$ ha misura nulla in $\mathbb{R}^{m}$ nel senso elementare dei ricoprimenti. Perché la definizione sia sensata deve essere <b>indipendente dalla carta scelta</b>, e lo è: i cambi di carta sono diffeomorfismi, i diffeomorfismi sono <span class="str" data-str="lipschitziana">lipschitziani</span> sui compatti, e una mappa lipschitziana manda insiemi di misura nulla in insiemi di misura nulla. <b>È tutta qui la verifica</b>, ed è la stessa ragione per cui basta controllare su una famiglia numerabile di carte invece che su tutte.</p>
  <p><b>Si noti che cosa si è guadagnato e che cosa no.</b> Si è guadagnato l&rsquo;ideale degli insiemi trascurabili, cioè la possibilità di dire «quasi ogni punto». Non si è guadagnata la misura: su $N$ non c&rsquo;è nessun numero che dica quanto è grande un aperto, e Sard non ne ha bisogno. <b>È un esempio limpido della strategia di tutto il corso</b> — prendere di una struttura solo la parte invariante, e scoprire che quella parte basta per il teorema che interessa.</p>
  <p><b>Sulle ipotesi di regolarità.</b> L&rsquo;enunciato come lo si usa richiede $F$ di classe $C^{\infty}$, e in questo corso «liscia» vuol dire quello. La versione ottimale, dovuta a Sard stesso, chiede $F$ di classe $C^{k}$ con $k\ge\max(1,\,n-m+1)$, ed è <b>tagliente</b>: per ogni $k$ più piccolo esistono controesempi, costruiti da Whitney. Vale la pena registrarlo perché è controintuitivo: <b>non basta $C^{1}$, e quanta regolarità serve dipende da quanto il dominio è più grande del codominio</b>. Quando $n\le m$ una derivata basta; quando $n$ supera $m$ di molto, servono molte derivate, e il motivo si vedrà nella terza tappa della dimostrazione — le derivate che si annullano sono esattamente ciò che si spende per far chiudere il conto.</p>
  <p><b>Il caso $m\gt n$ merita un nome a parte</b> perché è quello che si usa più spesso e si dimostra da solo. Se il codominio ha dimensione maggiore del dominio, il differenziale non può essere suriettivo in nessun punto, quindi <i>ogni</i> punto è critico e $\operatorname{Crit}(F)$ è tutto il dominio. L&rsquo;enunciato di Sard degenera allora in: <b>l&rsquo;immagine di una mappa liscia da $\mathbb{R}^{n}$ a $\mathbb{R}^{m}$ con $m\gt n$ ha misura nulla</b>. È il lemma che Whitney usa in gd-09 nella forma «l&rsquo;insieme delle direzioni cattive è l&rsquo;immagine di una mappa da uno spazio di dimensione minore, quindi è trascurabile», e sarà anche il primo caso che la dimostrazione affronta.</p>`}
]},

/* ---------------- 02 · LA MACCHINA DELLA MISURA NULLA ---------------- */
{ num:'02', title:'La macchina: tre fatti sulla misura nulla, e nientaltro', meta:'lunione numerabile · il trasporto lipschitziano · Fubini per i trascurabili',
  blocchi:[
  {t:'prosa', title:'I tre fatti, e perche bastano', tag:'costruzione', html:R`
  <p>Prima di entrare nella dimostrazione conviene montare l&rsquo;attrezzatura, che è sorprendentemente povera: <b>tre fatti, nessuno dei quali richiede la misura di Lebesgue</b>. La definizione di partenza è quella elementare: $A\subseteq\mathbb{R}^{m}$ ha misura nulla se per ogni $\varepsilon\gt0$ esiste una famiglia numerabile di cubi che lo ricopre con somma dei volumi minore di $\varepsilon$.</p>
  <p><b>Fatto 1 — l&rsquo;unione numerabile.</b> Se $A_1,A_2,\dots$ hanno misura nulla, la loro unione ha misura nulla. Si dimostra in una riga distribuendo il budget: si ricopre $A_n$ con cubi di volume totale $\varepsilon\,2^{-n}$, e la somma dei budget è $\sum_{n\ge1}\varepsilon\,2^{-n}=\varepsilon$. <b>È la serie geometrica che regge l&rsquo;intero teorema</b>, e ricomparirà identica altre due volte. La <i>numerabilità</i> non è decorativa: l&rsquo;unione non numerabile dei punti di $[0,1]$, ciascuno trascurabile, è $[0,1]$.</p>
  <p><b>Fatto 2 — il trasporto.</b> Una mappa lipschitziana manda insiemi di misura nulla in insiemi di misura nulla, e una mappa $C^{1}$ è lipschitziana su ogni <span class="str" data-str="compattezza">compatto</span>. Anche questo si vede subito: se $|f(y)-f(x)|\le L|y-x|$, un cubo di lato $\ell$ finisce dentro un cubo di lato $L\sqrt{n}\,\ell$, e i volumi si moltiplicano al più per la costante $(L\sqrt{n})^{n}$, che non dipende da $\varepsilon$. <b>Una costante fissa davanti a una quantità arbitrariamente piccola resta arbitrariamente piccola</b>, ed è tutto ciò che serve.</p>
  <p><b>Fatto 3 — Fubini per i trascurabili.</b> Se $A\subseteq\mathbb{R}^{m}=\mathbb{R}\times\mathbb{R}^{m-1}$ è tale che per <i>ogni</i> $t$ la fetta $A\cap(\{t\}\times\mathbb{R}^{m-1})$ ha misura nulla dentro la fetta, allora $A$ ha misura nulla. <b>Questo è l&rsquo;unico fatto che si prende in prestito e non si dimostra</b>: la prova richiede la teoria della misura, ed è il debito dichiarato del movimento. L&rsquo;intuizione però è onesta: una fetta di spessore $2t$ attorno a un iperpiano ha volume che va a zero con $t$, e l&rsquo;insieme sta dentro l&rsquo;unione di fette sempre più sottili.</p>
  <p><b>Perché questi tre e non altri.</b> Il Fatto 1 è ciò che permette di passare dal locale al globale — carte, cubi, strati dell&rsquo;insieme critico: tutto viene spezzato in famiglie numerabili. Il Fatto 2 è ciò che rende la nozione geometrica, cioè indipendente dalle coordinate, e insieme è lo strumento di stima. Il Fatto 3 è ciò che permette di <b>abbassare la dimensione</b>, ed è quindi il motore dell&rsquo;induzione. <b>La dimostrazione di Sard è, letteralmente, questi tre fatti applicati in ordine</b> — e chi li ha in mano può ricostruirla senza averla memorizzata.</p>`},
  {t:'plot', title:'La stessa serie geometrica, letta nei due versi',
   intro:R`In ascissa il numero $k$ di passi. La curva che scende è la misura che resta dell'insieme di Cantor dopo $k$ suddivisioni; quella che sale è la frazione di budget $\varepsilon$ già spesa per ricoprire i primi $k$ razionali. Due situazioni opposte, e lo stesso conto sotto.`,
   plots:[
    {kind:'func2d', xr:[0,12], yr:[0,1.08], height:330, ticks:6,
     title:'misura residua di Cantor, e budget speso sui razionali',
     curves:[
      {f:'pow(2/3,x)', col:'#5eead4', label:'Cantor: misura residua (2/3)^k -> 0'},
      {f:'1-pow(2,-x)', col:'#d8a13a', label:'razionali: budget speso (1-2^-k) -> 1'}
     ],
     xlabel:'k (passi)', ylabel:'frazione'}
   ],
   leggi:R`<p><b>La curva verde dice che un insieme può essere più che numerabile e avere misura nulla.</b> Al passo $k$ dell&rsquo;insieme di Cantor restano $2^{k}$ intervalli di lunghezza $3^{-k}$, cioè misura totale $(2/3)^{k}\to0$, eppure l&rsquo;insieme limite ha la cardinalità del continuo. Quindi «numerabile» è sufficiente per essere trascurabile, non necessario — e questo conta, perché l&rsquo;insieme dei valori critici di una mappa qualsiasi non ha nessuna ragione di essere numerabile.</p>
   <p><b>La curva gialla dice la cosa complementare</b>: un insieme può essere denso — presente in ogni intervallo, per piccolo che sia — e costare comunque poco. Dopo dodici razionali si è speso il 99,98% di un budget che era già arbitrariamente piccolo, e i restanti infiniti punti si coprono con quel che avanza. <b>«Trascurabile in misura» e «piccolo nel senso della topologia» sono nozioni scorrelate</b>, e la figura mostra entrambe le direzioni dello scarto.</p>
   <p><b>Perché questa figura sta qui e non fra gli esempi di analisi.</b> Nella dimostrazione di Sard la distribuzione del budget con pesi $2^{-n}$ compare tre volte: nel Fatto 1, nella riduzione alle carte e nella somma sugli strati $C_j$. <b>È l&rsquo;unico meccanismo con cui si spende una quantità finita su infiniti oggetti</b>, e tenerlo davanti agli occhi rende leggibili passaggi che altrimenti sembrano magici.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Perché il Fatto 1 richiede che la famiglia sia numerabile, se ogni pezzo è trascurabile comunque?`,
    a:R`Perché la dimostrazione distribuisce un budget $\varepsilon$ in pesi $\varepsilon\,2^{-n}$, e questo si può fare solo su una lista indicizzata dai naturali. Con una famiglia non numerabile non esiste nessuna assegnazione di pesi positivi con somma finita, e infatti l&rsquo;enunciato è falso: ogni punto di $[0,1]$ è trascurabile, la loro unione no. <b>La numerabilità non è un'ipotesi tecnica da aggirare: è esattamente ciò che rende finita la spesa.</b>`},
   {q:R`Dove entra la compattezza, visto che l'enunciato di Sard non la richiede?`,
    a:R`Non entra nell&rsquo;enunciato, entra nelle stime. La liscezza dà il controllo delle derivate <i>punto per punto</i>; per stimare volumi serve una costante <b>uniforme</b>, e una costante uniforme si ottiene solo su un compatto. Per questo la seconda riduzione spezza l&rsquo;aperto $U$ in una famiglia numerabile di cubi chiusi: su ciascuno la costante di Lipschitz esiste, e il Fatto 1 rimette insieme i pezzi. <b>La compattezza non è ipotesi del teorema ma è ipotesi di ogni suo passo</b>, ed è il motivo per cui la riduzione ai cubi viene prima di tutto il resto.`}
  ]}
]},

/* ---------------- 03 · IL CUORE ---------------- */
{ num:'03', title:'Il cuore della dimostrazione: perche il conteggio funziona', meta:'il caso facile m>n · la stima di Taylor · e il conto dei cubetti',
  blocchi:[
  {t:'reveal', title:'Il meccanismo, nel caso piu limpido', tag:'costruzione', steps:[
   {label:'Il caso m > n, che si fa a mano', body:R`
   <p>Se la dimensione d&rsquo;arrivo è <b>maggiore</b> di quella di partenza, <i>tutti</i> i punti sono critici (il differenziale non può essere suriettivo), e l&rsquo;enunciato diventa: <b>l&rsquo;immagine di una mappa liscia da $\mathbb{R}^n$ a $\mathbb{R}^m$ con $m>n$ ha misura nulla</b>. Cioè: una curva non riempie il piano, una superficie non riempie lo spazio.</p>
   <p><b>Ed è falso per mappe solo continue</b> — la curva di Peano (gd-08) riempie un quadrato. Quindi la liscezza è essenziale, e la dimostrazione deve usarla: lo fa con la <b>lipschitzianità sui compatti</b>, che controlla di quanto una mappa può dilatare.</p>
   <p><b>Il conto, per esteso, nel caso più semplice.</b> Sia $F:[0,1]\to\mathbb{R}^{2}$ liscia. Su un compatto $F$ è lipschitziana con costante $L$. Si divide $[0,1]$ in $k$ intervallini di lunghezza $1/k$: l&rsquo;immagine di ciascuno ha diametro al più $L/k$, quindi sta in un quadrato di lato $L/k$ e area $L^{2}/k^{2}$. Sommando sui $k$ intervallini, l&rsquo;immagine totale è coperta da area $k\cdot L^{2}/k^{2}=L^{2}/k$, che va a zero. <b>Non serve nessuna informazione sul differenziale: basta che la mappa non dilati troppo, e la differenza di dimensione fa il resto.</b> È il primo caso, ed è già tutta la logica del teorema in miniatura: si conta quanti pezzi e quanto è grande ciascuno, e si guarda chi vince.</p>`},
   {label:'Il conto dei cubetti, ed e tutta lidea', body:R`
   <p>Si prende un cubo di lato $\delta$ e lo si divide in $k^{n}$ cubetti di lato $\delta/k$: il volume totale è ancora <b>$\delta^{n}$</b>, il che è ovvio ma serve per non perdersi.</p>
   <p>Su un cubetto che contiene un punto critico $x$, la <b>stima di Taylor</b> dà
   $$|F(y)-F(x)-dF_x(y-x)|\le C|y-x|^{2}.$$
   Il termine lineare $dF_x$ manda tutto in un sottospazio di dimensione $<m$ (perché $x$ è critico), quindi <b>l&rsquo;immagine del cubetto sta in un «piattino» sottile</b>: largo quanto il cubetto nelle direzioni dell&rsquo;immagine del differenziale, e spesso solo $C(\delta/k)^{2}$ nelle altre.</p>
   <p>Il volume di quel piattino è dell&rsquo;ordine di $(\delta/k)^{n}\cdot\bigl(C(\delta/k)^{2}\bigr)^{m-n}$, e sommando sui $k^{n}$ cubetti si ottiene $\delta^{n}\,(C\delta^{2}/k^{2})^{m-n}$, una quantità che, al crescere di $k$, <b>tende a zero</b>. <b>È il conto che chiude il caso, ed è tutto qui</b>: il termine quadratico di Taylor batte il conteggio dei cubetti.</p>
   <p><b>Dove sta esattamente la vittoria</b>, perché è il punto che vale la pena isolare. Raffinando la griglia si guadagna e si perde insieme: il numero di cubetti cresce come $k^{n}$, e il volume di ciascun piattino cala. Se non ci fosse il termine quadratico — cioè se l&rsquo;immagine del cubetto fosse grande quanto il cubetto — i due effetti si compenserebbero esattamente e il volume totale resterebbe $\delta^{n}$ per sempre: nessuna informazione. <b>L&rsquo;esponente $2$ del resto di Taylor è ciò che rompe il pareggio</b>, e rompe di quanto lo dice l&rsquo;esponente $m-n$: ogni dimensione in cui il differenziale non arriva contribuisce un fattore $k^{-2}$ in più. Per questo il caso difficile non è $m$ grande ma $m$ vicino a $n$: lì il margine è minimo, e infatti è lì che serve la stratificazione.</p>`},
   {label:'Le tre tappe del caso generale', body:R`
   <p>Nel caso generale si stratifica l&rsquo;insieme critico secondo <b>quante derivate si annullano</b>:
   $$\operatorname{Crit}(F)\supseteq C_1\supseteq C_2\supseteq\cdots$$
   dove $C_j$ è dove si annullano tutte le derivate fino all&rsquo;ordine $j$. Le tre tappe sono:</p>
   <ol>
    <li><b>$F(\operatorname{Crit}\setminus C_1)$ ha misura nulla</b>: qui il differenziale non è nullo, si usa l&rsquo;ipotesi induttiva su una sottovarietà di dimensione minore (è qui che serve l&rsquo;induzione su $n$);</li>
    <li><b>$F(C_j\setminus C_{j+1})$ ha misura nulla</b> per ogni $j$: si applica Fubini per la misura nulla, riducendo la dimensione;</li>
    <li><b>$F(C_j)$ ha misura nulla per $j$ abbastanza grande</b>: con tante derivate nulle la stima di Taylor è di ordine alto, e il conto dei cubetti chiude. Serve $j>m/n-1$, cioè <b>quando $n$ è grande</b> basta un ordine modesto.</li>
   </ol>
   <p><b>L&rsquo;ordine finito di derivate che serve è il motivo per cui Sard richiede $C^k$ con $k$ abbastanza grande</b>, e non vale per mappe solo $C^1$ in dimensioni alte — un fatto che sorprende e che Diverio segnala.</p>`},
   {label:'Perche le tre tappe sono tre, e non una', body:R`
   <p>Vale la pena capire perché non si può fare tutto con il conto dei cubetti, visto che nella terza tappa funziona. La risposta è che <b>il conto dei cubetti ha bisogno che il resto di Taylor sia di ordine abbastanza alto</b>, e l&rsquo;ordine disponibile dipende da quante derivate si annullano. Nei punti dove il differenziale è critico ma non nullo se ne annulla una sola, il resto è solo quadratico, e il margine $k^{-2(m-n)}$ può non bastare quando $n$ è molto maggiore di $m$.</p>
   <p>Le tre tappe sono quindi <b>tre regimi diversi dello stesso problema</b>, affrontati con tre tecniche:</p>
   <ul>
    <li><b>Poco degenere</b> ($\operatorname{Crit}\setminus C_1$): il differenziale non è nullo, quindi qualche derivata parziale non si annulla, e per il teorema della funzione implicita l&rsquo;insieme critico è localmente contenuto in una <b>ipersuperficie liscia</b>. Restringendosi a quella si ha una mappa definita su una varietà di dimensione $n-1$, e si applica l&rsquo;ipotesi induttiva. <b>Qui lo strumento è l&rsquo;induzione</b>, e questa tappa è la ragione per cui la dimostrazione è induttiva su $n$.</li>
    <li><b>Mediamente degenere</b> ($C_j\setminus C_{j+1}$): qui tutte le derivate fino all&rsquo;ordine $j$ si annullano ma una di ordine $j+1$ no. Si sceglie una coordinata rispetto a cui quella derivata non si annulla, si ottiene che l&rsquo;insieme sta in un&rsquo;ipersuperficie di livello, e si applica <b>Fubini</b> fetta per fetta. <b>Qui lo strumento è l&rsquo;abbassamento di dimensione nel codominio.</b></li>
    <li><b>Molto degenere</b> ($C_j$ con $j$ grande): tutte le derivate fino a un ordine alto si annullano, il resto di Taylor è $O(|y-x|^{j+1})$, e il conto dei cubetti dà un margine $k^{n-(j+1)(m-n)}$ che si può rendere negativo scegliendo $j$ grande. <b>Qui lo strumento è la stima diretta</b>, ed è il solo punto in cui si vede da dove esce l&rsquo;ipotesi di regolarità finita.</li>
   </ul>
   <p><b>La cosa notevole è che i tre regimi si incollano con il Fatto 1.</b> L&rsquo;insieme critico è l&rsquo;unione di $\operatorname{Crit}\setminus C_1$, dei livelli intermedi $C_j\setminus C_{j+1}$ per $j$ da $1$ a $J-1$, e di $C_J$: una famiglia <i>finita</i>, dentro una dimostrazione che di famiglie numerabili ne usa continuamente. <b>La struttura è quella di una scala</b>: ogni gradino è trattato con l&rsquo;arma che lì funziona, e la somma dei gradini è trascurabile perché ciascuno lo è.</p>`}
  ]},
  {t:'plot', title:'Chi vince fra il numero dei cubetti e il volume di ciascuno',
   intro:R`In ascissa il numero $k$ di suddivisioni per lato. In ordinata il volume totale dei piattini che ricoprono l'immagine, normalizzato a $1$ per $k=1$. Il caso piatto in alto è ciò che accadrebbe senza il termine quadratico di Taylor.`,
   plots:[
    {kind:'func2d', xr:[1,10], yr:[0,1.12], height:330, ticks:6,
     title:'volume totale del ricoprimento al crescere di k',
     curves:[
      {f:'1', col:'#ff6b6b', label:'senza il termine quadratico: resta delta^n, nessuna informazione'},
      {f:'pow(x,-2)', col:'#d8a13a', label:'m-n=1: volume ~ k^-2'},
      {f:'pow(x,-4)', col:'#5eead4', label:'m-n=2: volume ~ k^-4'}
     ],
     xlabel:'k (suddivisioni per lato)', ylabel:'volume del ricoprimento'}
   ],
   leggi:R`<p><b>La curva rossa è il pareggio</b>, ed è la situazione da cui si parte: $k^{n}$ cubetti di volume $(\delta/k)^{n}$ fanno sempre $\delta^{n}$, per ogni $k$. Raffinare la griglia, da solo, non dimostra niente — ed è l&rsquo;errore in cui si cade rileggendo la dimostrazione troppo in fretta, perché sembra che l&rsquo;infittimento sia l&rsquo;argomento. Non lo è: l&rsquo;argomento è che l&rsquo;<i>immagine</i> di un cubetto è più piccola del cubetto stesso in almeno una direzione.</p>
   <p><b>Le due curve che scendono sono ciò che la criticità regala.</b> Ogni dimensione in cui il differenziale non arriva schiaccia il piattino di un fattore $C\delta^{2}/k^{2}$, e l&rsquo;esponente è $m-n$. Il salto fra giallo e verde è quindi il salto fra «il codominio ha una dimensione in più» e «ne ha due»: a $k=4$ il primo ha già ridotto il volume a un sedicesimo, il secondo a un duecentocinquantaseiesimo. <b>La convergenza non è marginale, è polinomiale con esponente pari</b>, e questo spiega perché il caso $m\gt n$ si dimostri in mezza pagina.</p>
   <p><b>Il caso difficile è invisibile in questa figura</b>, ed è giusto dirlo. Quando $n$ è molto maggiore di $m$ l&rsquo;esponente $m-n$ diventa negativo e il conto <i>non</i> chiude: le curve, per così dire, salirebbero. È esattamente la situazione in cui serve la stratificazione — annullare più derivate alza l&rsquo;esponente del resto di Taylor da $2$ a $j+1$, e con $j$ abbastanza grande la curva torna a scendere. <b>La figura mostra il caso in cui il teorema è facile, e per contrasto dice dove è difficile.</b></p>`}
]},

/* ---------------- 04 · ESERCIZI ---------------- */
{ num:'04', title:'Esercizi — tocca a te', meta:'insiemi critici espliciti · il conto dei cubetti sui numeri · e un controesempio da costruire',
  blocchi:[
  {t:'esercizio', title:'1 · Tre mappe, e i loro valori critici',
   src:'il modo piu rapido per fissare la differenza fra punti critici e valori critici',
   testo:R`Per ciascuna mappa, determina l'insieme dei punti critici e l'insieme dei valori critici, e verifica direttamente l'enunciato di Sard: (a) $f(x)=x^{3}-3x$ da $\mathbb{R}$ in $\mathbb{R}$; (b) $g(x,y)=x^{2}+y^{2}$ da $\mathbb{R}^{2}$ in $\mathbb{R}$; (c) $H(x,y)=(x,y^{3})$ da $\mathbb{R}^{2}$ in $\mathbb{R}^{2}$.`,
   steps:[
    {label:'Le prime due, dove si conta sulle dita', body:R`
    <p><b>(a)</b> La derivata è $3x^{2}-3$, che si annulla in $x=\pm1$: due punti critici. I valori corrispondenti sono $f(1)=-2$ e $f(-1)=2$, quindi l&rsquo;insieme dei valori critici è $\{-2,2\}$ — <b>due punti, misura nulla in $\mathbb{R}$</b>. Ogni altro livello è regolare, e infatti $f^{-1}(c)$ è un insieme finito di punti, cioè una sottovarietà di dimensione $1-1=0$, per ogni $c$ diverso da $\pm2$. Per $c=\pm2$ la controimmagine ha tre punti di cui uno doppio: la struttura di varietà sopravvive come insieme ma il teorema del valore regolare non si applica, e non deve.</p>
    <p><b>(b)</b> Il gradiente è $(2x,2y)$, nullo solo nell&rsquo;origine: <b>un solo punto critico</b>, e un solo valore critico, $g(0,0)=0$. Le controimmagini dei valori positivi sono circonferenze, cioè sottovarietà di dimensione $2-1=1$; la controimmagine di $0$ è un punto, che ha dimensione sbagliata; le controimmagini dei valori negativi sono vuote, e <b>il vuoto è una sottovarietà per convenzione</b>, il che non è una furbizia ma la ragione per cui l&rsquo;enunciato del teorema del valore regolare non ha eccezioni.</p>
    <p><b>Da notare il confronto</b>: in (a) l&rsquo;insieme critico è minuscolo e in (b) pure, ma questo è un accidente di esempi facili. Il punto di Sard è che <i>anche quando l&rsquo;insieme critico è enorme</i> la sua immagine è trascurabile, ed è il caso (c) a mostrarlo.</p>`},
    {label:'La terza, dove linsieme critico e infinito', body:R`
    <p><b>(c)</b> La matrice jacobiana di $H(x,y)=(x,y^{3})$ è diagonale con entrate $1$ e $3y^{2}$, quindi il determinante è $3y^{2}$, che si annulla su tutta la retta $y=0$. <b>L&rsquo;insieme dei punti critici è una retta intera</b>: un insieme infinito, non numerabile, di misura nulla in $\mathbb{R}^{2}$ ma certamente non «pochi punti».</p>
    <p>L&rsquo;immagine di quella retta è $\{(x,0)\}$, cioè di nuovo una retta, e <b>una retta ha misura nulla in $\mathbb{R}^{2}$</b>: Sard è verificato. Si noti che qui l&rsquo;immagine non si è compressa affatto — la mappa ristretta a $y=0$ è l&rsquo;identità — e ciò nonostante il valore critico è trascurabile, semplicemente perché una retta è trascurabile nel piano. <b>È il caso che insegna a non cercare la compressione dove non c&rsquo;è</b>: Sard non dice che l&rsquo;immagine si schiaccia, dice che sta in un insieme trascurabile, e le due cose coincidono solo nel caso $m=n$ con differenziale degenere.</p>
    <p><b>Una domanda che vale la pena porsi su (c)</b>: $H$ è una biiezione di $\mathbb{R}^{2}$ in sé, continua con inversa continua, eppure ha un insieme critico enorme. Non c&rsquo;è contraddizione con niente, ma spiega perché la nozione di valore regolare non è invariante per omeomorfismi e lo è per diffeomorfismi: $H^{-1}(x,y)=(x,y^{1/3})$ non è liscia, e infatti $H$ è un omeomorfismo ma non un diffeomorfismo.</p>`}
   ]},
  {t:'esercizio', title:'2 · Il conto dei cubetti, sui numeri',
   src:'lesercizio che rende non memorizzabile la dimostrazione, perche la fa fare',
   testo:R`Sia $F:[0,\delta]\to\mathbb{R}^{2}$ liscia, con $n=1$ e $m=2$. Esegui il conto dei cubetti con $k$ suddivisioni e scrivi il volume totale del ricoprimento in funzione di $k$. Poi ripeti con $n=2$, $m=3$ e stabilisci quale dei due converge più in fretta.`,
   steps:[
    {label:'Il caso n=1, m=2', body:R`
    <p>Si divide $[0,\delta]$ in $k$ intervallini di lunghezza $\delta/k$. Su ciascuno, essendo tutti i punti critici (siamo nel caso $m\gt n$), l&rsquo;immagine sta in un rettangolo largo $\delta/k$ nella direzione dell&rsquo;immagine del differenziale e spesso quanto dice il resto di Taylor, cioè $C(\delta/k)^{2}$, nell&rsquo;altra. L&rsquo;area di un rettangolino è dunque $(\delta/k)\cdot C(\delta/k)^{2}$, e moltiplicando per i $k$ intervallini resta $C\delta^{3}/k^{2}$.</p>
    <p><b>Attenzione al fattore che si perde sempre</b>: lo spessore è $C$ per il <i>quadrato del lato del cubetto</i>, non $C/k^{2}$. I due coincidono solo se si è posto $\delta=1$, ed è la normalizzazione tacita con cui la formula compatta viene scritta in molti libri. Tenere $\delta$ esplicito costa un simbolo e salva l&rsquo;omogeneità dimensionale del risultato — qui l&rsquo;area viene $\delta^{3}$, cioè una lunghezza al cubo divisa per $k^{2}$, e se venisse $\delta^{1}$ sarebbe il segnale che si è perso un fattore.</p>
    <p><b>Il limite per $k\to\infty$ è zero</b>, quindi l&rsquo;immagine si ricopre con area arbitrariamente piccola: ha misura nulla. <b>Una curva liscia non riempie il piano</b>, e questo è il conto che lo dimostra — sei righe, nessuna teoria della misura.</p>`},
    {label:'Il caso n=2, m=3, e il confronto', body:R`
    <p>Ora i cubetti sono $k^{2}$, ciascuno di lato $\delta/k$. Il piattino immagine è largo $\delta/k$ in due direzioni — quelle dell&rsquo;immagine del differenziale — e spesso $C(\delta/k)^{2}$ nella terza, quindi ha volume $(\delta/k)^{2}\cdot C(\delta/k)^{2}=C\delta^{4}/k^{4}$. Moltiplicando per i $k^{2}$ cubetti resta $C\delta^{4}/k^{2}$.</p>
    <p><b>I due convergono alla stessa velocità</b>, entrambi come $k^{-2}$, e non è un caso: in entrambi i casi manca <i>una sola</i> dimensione, $m-n=1$, e la formula generale $\delta^{n}\,(C\delta^{2}/k^{2})^{m-n}$ dice che <b>la velocità di convergenza dipende solo da $m-n$</b>, non separatamente da $n$ e da $m$. Il numero dei cubetti cresce come $k^{n}$ e il volume di ciascuno cala come $k^{-n}$ per la parte «larga»: quei due si cancellano esattamente, sempre, ed è la curva rossa della figura precedente. <b>Ciò che resta dopo la cancellazione è solo il fattore quadratico, elevato al numero di direzioni mancanti.</b></p>
    <p><b>La morale operativa</b>: in sede d&rsquo;esame il conto si rifà, non si cita. Sono tre fattori — quanti pezzi, quanto è largo, quanto è spesso — e il terzo è l&rsquo;unico che porta informazione. <b>Chi ricorda solo «Taylor quadratico batte il conteggio» ricostruisce il resto in trenta secondi</b>; chi ricorda la formula finale e non il meccanismo, se sbaglia un esponente non ha modo di accorgersene.</p>`}
   ]},
  {t:'esercizio', title:'3 · Costruire il controesempio continuo',
   src:'lesercizio che isola lipotesi, mostrando cosa succede a toglierla',
   testo:R`Spiega perché la curva di Peano non contraddice Sard, e individua il punto preciso della dimostrazione che smette di funzionare per una mappa solo continua.`,
   steps:[
    {label:'Dove si rompe la catena', body:R`
    <p>La curva di Peano è una mappa continua e suriettiva da $[0,1]$ al quadrato $[0,1]^{2}$. Se Sard valesse per le mappe continue, si avrebbe $m\gt n$ con immagine di misura piena: contraddizione. Quindi qualche passo deve rompersi, e vale la pena trovarlo invece di accontentarsi di «non è liscia».</p>
    <p><b>Il passo che si rompe è il Fatto 2</b>, il trasporto. Una mappa continua su un compatto è <i>uniformemente</i> continua ma non lipschitziana: il modulo di continuità può essere arbitrariamente cattivo. Senza una costante $L$, l&rsquo;immagine di un intervallino di lunghezza $\delta/k$ non ha nessun bound sul diametro che vada a zero <b>alla stessa velocità</b>, e il conto dei cubetti non parte proprio. Per la curva di Peano, in effetti, l&rsquo;immagine di un intervallino di lunghezza $4^{-j}$ è un quadratino di lato $2^{-j}$: il diametro va come la <i>radice</i> della lunghezza, e quella radice è precisamente ciò che permette di riempire il piano.</p>
    <p><b>Il conto che chiude</b>: con $k=4^{j}$ intervallini, ciascuno con immagine di area $(2^{-j})^{2}=4^{-j}$, l&rsquo;area totale è $4^{j}\cdot4^{-j}=1$ per ogni $j$. <b>È la curva rossa della figura precedente</b> — il pareggio esatto, nessuna informazione, per sempre. La liscezza non serve a rendere l&rsquo;argomento elegante: serve a rompere quel pareggio, ed è l&rsquo;unica cosa che lo rompe.</p>`},
    {label:'E perche C^1 non basta in dimensione alta', body:R`
    <p>C&rsquo;è un secondo controesempio, meno famoso e più sottile, che conviene almeno sapere che esiste: <b>Whitney costruì una funzione $C^{1}$ da $\mathbb{R}^{2}$ in $\mathbb{R}$ il cui insieme critico contiene un arco lungo il quale la funzione non è costante</b>. L&rsquo;immagine di quell&rsquo;arco è allora un intervallo, che in $\mathbb{R}$ ha misura positiva: Sard fallisce in classe $C^{1}$.</p>
    <p>Dove fallisce la dimostrazione in questo caso? Nella <b>terza tappa</b>. La stratificazione richiede che, salendo negli strati $C_j$, il resto di Taylor diventi di ordine sempre più alto, e questo richiede derivate che in classe $C^{1}$ non esistono. Con $n=2$ e $m=1$ la condizione $k\ge\max(1,n-m+1)=2$ dice che serve $C^{2}$, e il controesempio vive esattamente nel buco fra $C^{1}$ e $C^{2}$. <b>La soglia non è un artefatto della dimostrazione: è tagliente</b>, e questo è raro abbastanza da valere la pena ricordarlo.</p>`}
   ]}
]},

/* ---------------- 05 · LE CONSEGUENZE ---------------- */
{ num:'05', title:'Le conseguenze, e perche il teorema si usa piu di quanto si dimostri', meta:'quasi ogni valore e regolare · la genericita · e il ruolo in Whitney e trasversalita',
  blocchi:[
  {t:'prosa', title:'Che cosa autorizza a fare', tag:'regola operativa', html:R`
  <ul>
   <li><b>Quasi ogni fibra è una sottovarietà.</b> Combinando con gd-08: per quasi ogni $c$, $F^{-1}(c)$ è una sottovarietà liscia di dimensione $\dim M-\dim N$. <b>È l&rsquo;enunciato che si usa davvero</b>, e permette di dire «perturbando di poco il livello, l&rsquo;insieme diventa liscio»;</li>
   <li><b>la genericità.</b> «Per quasi ogni scelta» diventa un argomento rigoroso: nelle dimostrazioni di gd-09 (proiezioni buone per Whitney) e gd-17 (perturbazioni che rendono trasversi) il passaggio chiave è sempre «l&rsquo;insieme delle scelte cattive è l&rsquo;immagine dei punti critici di qualche mappa ausiliaria, quindi ha misura nulla»;</li>
   <li><b>l&rsquo;esistenza senza costruzione.</b> Sard non esibisce un valore regolare: dice che ce ne sono quasi tutti. <b>È un teorema di esistenza puro</b>, e in questo somiglia più alla teoria della misura che alla geometria.</li>
  </ul>
  <p><b>Il modo giusto di ricordarlo</b>: una mappa liscia <i>non può schiacciare troppo</i>. Può avere un insieme critico enorme nel dominio, ma le immagini di quei punti si comprimono in un insieme trascurabile. La liscezza impone che la compressione, dove avviene, sia quadratica — e il quadratico batte il conteggio.</p>
  <p><b>Una conseguenza che si usa senza nominarla</b>, e che vale la pena rendere esplicita: poiché un insieme di misura nulla ha parte interna vuota, il complementare dei valori critici è <b>denso</b>. Quindi non solo «esiste un valore regolare»: ne esiste uno <i>arbitrariamente vicino a qualunque valore assegnato</i>. È questa la forma in cui il teorema entra negli argomenti di perturbazione — «sposto il livello di $\epsilon$ e diventa regolare» — e la densità, non la misura, è ciò che rende l&rsquo;argomento utilizzabile. La misura serve a dimostrare la densità; poi si dimentica.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`La funzione costante ha tutti i punti critici. Contraddice Sard?`,
    a:R`No, e anzi chiarisce l&rsquo;enunciato: i punti critici sono <b>tutti</b>, ma i <i>valori</i> critici sono un punto solo — l&rsquo;unico valore assunto — e un punto ha misura nulla in $\mathbb{R}^m$ per $m\ge1$. <b>Sard non limita quanto può essere grande l&rsquo;insieme critico nel dominio</b>, solo quanto può essere grande la sua immagine.`},
   {q:R`Perché la curva di Peano non è un controesempio?`,
    a:R`Perché non è <b>liscia</b>: è continua e basta. La dimostrazione usa la stima di Taylor al secondo ordine, che richiede almeno $C^2$; senza derivate non c&rsquo;è nessun controllo sulla dilatazione dei cubetti, e una mappa continua può davvero mandare un insieme di misura nulla su uno di misura piena. <b>È l&rsquo;esempio che dice quale ipotesi sta lavorando</b>, ed è il motivo per cui gd-08 lo introduce prima.`},
   {q:R`Sard garantisce che esista un valore regolare. Garantisce anche di poterlo trovare?`,
    a:R`No, ed è una limitazione reale, non filosofica. La dimostrazione è per ricoprimenti e non costruisce niente: dice che l&rsquo;insieme cattivo si copre a costo arbitrariamente piccolo, non dove stia un punto buono. In pratica, quando serve un valore regolare <b>si prende un valore a caso e si verifica</b>, ed è legittimo proprio perché quasi tutti lo sono. <b>È la differenza fra un teorema di misura e un algoritmo</b>, e in gd-17 la si ritrova identica: la perturbazione che rende trasversi esiste, ma va scelta a tentoni.`}
  ]}
]},

/* ---------------- 06 · IL SENSO ---------------- */
{ num:'06', title:'Il senso, e le rotte', meta:'cosa chiude, e dove la genericita e uno strumento',
  blocchi:[
  {t:'prosa', title:'Cosa lascia in mano', tag:'sintesi', html:R`
  <p><b>Il punto.</b> «Generico» diventa una nozione tecnica: una proprietà è generica se vale fuori da un insieme di misura nulla. <b>Sard è il teorema che popola quella nozione di esempi</b>, e da qui in avanti gli argomenti del tipo «perturbando di poco si può assumere che…» sono legittimi.</p>
  <p><b>A valle.</b> gd-17 usa Sard per la trasversalità, che è la forma in cui la genericità entra nei problemi concreti. E chiude il primo blocco del corso: da gd-11 in poi si passa ai campi, ai flussi, alle equazioni.</p>
  <p><b>Che cosa conviene portarsi via, in ordine di durata.</b> L&rsquo;enunciato, che si ricorda per sempre e si usa ogni settimana. La distinzione punti/valori, che è il solo modo di non sbagliare l&rsquo;applicazione. Il meccanismo del conto dei cubetti, che si ricostruisce in trenta secondi se si ricorda la frase «il quadratico batte il conteggio». La stratificazione in tre tappe, che si ricorda per la durata dell&rsquo;esame e poi si ritrova nel libro quando serve. <b>Di una dimostrazione di due lezioni, ciò che resta a lungo è una frase e una distinzione</b> — e va bene così, purché la frase sia quella che permette di rifare il conto.</p>`},
  {t:'prolessi', title:'Dove riappare questo movimento',
   oggetto:R`<b>La genericità</b>: ciò che vale per quasi ogni scelta, e l&rsquo;argomento che lo rende rigoroso.`,
   rotte:[
    {dove:'Sistemi<br>dinamici', txt:R`I sistemi <b>strutturalmente stabili</b> sono generici in senso analogo, e i teoremi di biforcazione dicono che le degenerazioni accadono solo su insiemi di misura nulla nello spazio dei parametri: <b>è il motivo per cui certi comportamenti «non si vedono mai» pur essendo possibili</b>.`},
    {dove:'Teoria<br>dei campi', txt:R`Gli argomenti di genericità sono onnipresenti: si assume che le configurazioni siano in posizione generale per evitare singolarità non fisiche. Il <b>fine tuning</b> di un parametro è esattamente stare su un insieme di misura nulla, e questo è il fondamento matematico dell&rsquo;obiezione di naturalezza.`},
    {dove:'Ottimizzazione', txt:R`«Per quasi ogni dato il minimo è non degenere» è un teorema di tipo Sard, ed è ciò che giustifica i metodi che assumono l&rsquo;hessiana invertibile. <b>I casi degeneri esistono ma non si incontrano</b>, a meno che la struttura del problema non li imponga.`},
    {dove:'Meccanica<br>statistica', txt:R`Le superfici di energia costante sono lisce per quasi ogni valore di E: e' Sard applicato all'hamiltoniana, ed e' cio' che rende ben definita la misura microcanonica senza doverlo verificare caso per caso.`}
   ],
   domanda:R`Sard dice che i valori critici sono trascurabili <b>in misura</b>. Ma esistono mappe lisce i cui valori critici sono <b>densi</b> — trascurabili in misura eppure presenti ovunque. <b>Domanda che porti avanti:</b> «piccolo in misura» e «piccolo topologicamente» (magro, di prima categoria) sono nozioni diverse e incompatibili: esiste una decomposizione di $\mathbb{R}$ in due insiemi, uno di misura nulla e uno magro. <b>Quale delle due è la nozione giusta di «trascurabile» in fisica?</b> Dipende dalla domanda — e in teoria KAM (che incontrerai in meccanica statistica) la risposta è delicata proprio perché i tori invarianti che sopravvivono sono di misura grande ma topologicamente sottili.`}
]}

];


/* =================================================================== */
var byId = {}; TAPPE.forEach(function(s){ byId[s.num]=s; });

var VKEY='pm-nucleogd-10-visited';
function loadSeen(){ try{ return new Set(JSON.parse(localStorage.getItem(VKEY)||'[]')); }catch(e){ return new Set(); } }
function saveSeen(s){ try{ localStorage.setItem(VKEY, JSON.stringify(Array.from(s))); }catch(e){} }
var SEEN = loadSeen();

function renderNav(active){
  var nav=document.getElementById('sidebar');
  nav.innerHTML='';
  var h=document.createElement('h2'); h.textContent='Nucleo gd-10 · le tappe'; nav.appendChild(h);
  TAPPE.forEach(function(s){
    var b=document.createElement('button');
    b.className='navitem'+(active===s.num?' active':'')+(SEEN.has(s.num)?' seen':'');
    b.innerHTML='<span class="dot"></span><span class="nx">'+s.num+'</span><span>'+s.title+'</span>';
    b.onclick=function(){ showTappa(s.num); };
    nav.appendChild(b);
  });
}

/* ---- renderer dei blocchi ---- */
function sectionProsa(title, tag, html){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var body=elFromHTML('<div class="open-body">'+html+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function sectionGram(title, rows){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag gramtag">grammatica</span></h3>';
  var inner='<table class="gramtab">';
  rows.forEach(function(r){ inner+='<tr><td class="gs">'+r[0]+'</td><td>'+r[1]+'</td></tr>'; });
  inner+='</table>';
  var body=elFromHTML('<div class="gramwrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
/* --- blocco PLOT: la figura non decora, si legge. Ogni plot porta una chiave di lettura. --- */
function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';
  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
    else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
    else if(b.t==='prolessi') m.appendChild(sectionProlessi(b));
    else if(b.t==='reveal')m.appendChild(sectionReveal(b.title,b.tag,b.steps));
    else if(b.t==='esercizio') m.appendChild(sectionEsercizio(b));
    else if(b.t==='collaudo')  m.appendChild(sectionCollaudo(b.title,b.items));
    else if(b.t==='plot')      m.appendChild(sectionPlot(b));
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}

/* deep-link: gd-10-teorema-sard.html#03 apre direttamente la tappa 03 */
window.addEventListener('DOMContentLoaded', function(){
  var h=(location.hash||'').replace('#','');
  showTappa(byId[h]?h:'00');
});
window.addEventListener('hashchange', function(){
  var h=(location.hash||'').replace('#','');
  if(byId[h]) showTappa(h);
});
