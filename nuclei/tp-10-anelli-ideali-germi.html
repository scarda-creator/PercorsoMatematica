<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

<!-- La barra di casa: un nucleo senza di lei e' un vicolo cieco - si arrivava qui
     e l'unica uscita era il tasto indietro del browser, che dall'app installata
     sulla schermata Home non c'e'. Porta anche i due movimenti accanto, letti
     dall'indice: l'ordine non e' scritto nel nucleo e non puo' sfasarsi. -->
<script defer src="../nav-tengri.js"></script>

<style>
  :root{
    --bg:#0e1117; --panel:#161b22; --panel2:#1c232d; --border:#2b333d;
    --txt:#eef3f8; --muted:#b9c4d1; --accent:#4c8dff; --accent2:#8fb0ff;
    --ok:#2ea043; --okbg:#10331b; --warn:#d8a13a; --warnbg:#332a10;
    --gram:#5eead4; --grambg:#0f2a26;
    --pro:#b98cff; --probg:#1a1430; --proline:#2a2247; --proedge:#3a2d5c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    font-size:17px;line-height:1.55;}
  a{color:var(--accent2);}
  .banner{background:var(--panel2);border-bottom:1px solid var(--border);color:var(--muted);
    font-size:.8rem;font-weight:600;text-align:center;padding:8px 12px;letter-spacing:.3px;}
  .banner b{color:var(--accent2);}
  .shell{display:flex;max-width:1180px;margin:0 auto;align-items:flex-start;}

  /* ---- SIDEBAR ---- */
  .sidebar{width:280px;flex:0 0 280px;padding:20px 12px 60px;position:sticky;top:0;
    max-height:100vh;overflow-y:auto;border-right:1px solid var(--border);}
  .sidebar h2{font-size:.72rem;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);
    margin:18px 8px 8px;}
  .navitem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:none;
    background:transparent;color:var(--txt);padding:9px 10px;border-radius:8px;cursor:pointer;
    font-size:.9rem;transition:.12s;border:1px solid transparent;}
  .navitem:hover{background:var(--panel2);}
  .navitem.active{background:#13233f;border-color:var(--accent);color:#fff;}
  .navitem .dot{width:7px;height:7px;border-radius:50%;background:transparent;flex:0 0 7px;
    border:1px solid var(--border);}
  .navitem.seen .dot{background:var(--ok);border-color:var(--ok);}
  .navitem .nx{color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto;}

  /* ---- MAIN ---- */
  .main{flex:1 1 auto;min-width:0;padding:24px 30px 90px;max-width:860px;}
  h1{font-size:1.5rem;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:.92rem;margin:0 0 18px;}
  .sfhead{border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:8px;}
  .sfhead h1{font-size:1.55rem;}
  .meta{color:var(--muted);font-size:.82rem;margin-top:6px;}

  .section{margin:26px 0;}
  .section > h3{font-size:1.02rem;color:var(--accent2);margin:0 0 10px;
    display:flex;align-items:center;gap:10px;}
  .section > h3 .tag{font-size:.66rem;font-weight:700;letter-spacing:.4px;background:var(--panel2);
    border:1px solid var(--border);color:var(--muted);padding:2px 8px;border-radius:20px;
    text-transform:uppercase;}
  /* --- blocchi figura --- */
  .section > h3 .tag.plottag{background:#101f2e;border-color:#1f3c57;color:#7ab8e0;}
  .plot-intro{color:var(--muted);font-size:.95rem;margin:0 0 12px;}
  .plot-row{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;
    background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;}
  .plot-row.due .plot-box{flex:1 1 300px;min-width:280px;}
  .plot-box{max-width:560px;}
  .plot-leggi{margin-top:10px;background:var(--panel2);border:1px solid var(--border);
    border-left:3px solid #4a8fc7;border-radius:0 10px 10px 0;padding:11px 14px;
    font-size:.93rem;color:var(--muted);}
  .plot-leggi b{color:#7ab8e0;}
  .plot-err{color:#ff6b6b;font-size:.85rem;}
  .open-body{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
  .open-body p:first-child{margin-top:0;} .open-body p:last-child{margin-bottom:0;}
  .open-body ul{margin:.4em 0;padding-left:1.2em;} .open-body li{margin:.35em 0;}

  .note{background:var(--panel2);border-left:3px solid var(--muted);border-radius:6px;
    padding:9px 12px;margin:12px 0;font-size:.9rem;color:var(--muted);}
  .note b{color:#ff9d6b;}
  .note.warn{background:var(--warnbg);border-left-color:var(--warn);color:#e0b85a;}
  .note.warn b{color:#f0c25a;}

  /* ---- GRAMMATICA ---- */
  .gramwrap{background:var(--grambg);border:1px solid #1f4d47;border-radius:12px;padding:6px 6px;}
  table.gramtab{border-collapse:collapse;width:100%;font-size:.92rem;}
  table.gramtab td{padding:9px 12px;vertical-align:top;border-bottom:1px solid #17332e;}
  table.gramtab tr:last-child td{border-bottom:none;}
  table.gramtab td.gs{white-space:nowrap;color:var(--gram);width:1%;
    border-right:1px solid #17332e;font-variant-numeric:tabular-nums;}
  .section > h3 .tag.gramtag{background:var(--grambg);border-color:#1f4d47;color:var(--gram);}

  /* ---- STRUMENTI (repertorio condiviso: la scheda si apre DENTRO la frase) ----
     Nessun accento nuovo: riusa il verde della grammatica, perche' uno strumento
     richiamato e' grammatica gia' spiegata altrove, non una quinta specie di blocco. */
  .str{color:var(--gram);border-bottom:1px dashed var(--gram);cursor:pointer;}
  .str:hover{background:var(--grambg);}
  .str::after{content:"\2666";font-size:.62em;vertical-align:.42em;margin-left:2px;opacity:.8;}
  .str.aperto::after{content:"\2715";}
  .str.rotto{color:#ff6b6b;border-bottom-color:#ff6b6b;cursor:help;}
  /* la scheda e' uno SPAN in display:block, non un div: i rimandi cadono dentro
     <p>, <li> e celle di tabella, dove un div e' HTML illegale. */
  .strcard{display:block;margin:10px 0;background:var(--grambg);border:1px solid #1f4d47;
    border-left:3px solid var(--gram);border-radius:0 10px 10px 0;padding:10px 14px;font-size:.9rem;}
  .strcard .sh{display:block;font-size:.66rem;font-weight:700;letter-spacing:.5px;
    text-transform:uppercase;color:var(--gram);margin-bottom:7px;}
  .strcard .sr{display:block;margin:5px 0;}
  .strcard .sk{color:var(--gram);font-weight:600;}

  /* ---- PROLESSI (preannuncio fisico) ---- */
  .prowrap{background:var(--probg);border:1px solid var(--proedge);border-radius:12px;padding:4px 4px 8px;}
  .prohead{padding:11px 14px 4px;color:var(--pro);font-size:.72rem;font-weight:700;letter-spacing:.7px;
    text-transform:uppercase;}
  .pro-oggetto{padding:2px 14px 11px;color:var(--muted);font-size:.92rem;border-bottom:1px solid var(--proline);
    margin-bottom:2px;} .pro-oggetto b{color:var(--txt);}
  table.protab{border-collapse:collapse;width:100%;font-size:.92rem;}
  table.protab td{padding:10px 12px;vertical-align:top;border-bottom:1px solid var(--proline);}
  table.protab tr:last-child td{border-bottom:none;}
  table.protab td.pd{white-space:nowrap;color:var(--pro);width:1%;font-weight:700;font-size:.78rem;
    letter-spacing:.3px;text-transform:uppercase;border-right:1px solid var(--proline);line-height:1.3;}
  .pro-domanda{margin:8px 8px 2px;background:#140d26;border:1px solid var(--proedge);
    border-left:3px solid var(--pro);border-radius:8px;padding:10px 14px;font-size:.92rem;}
  .pro-domanda b{color:var(--pro);}
  .section > h3 .tag.protag{background:var(--probg);border-color:var(--proedge);color:var(--pro);}

  /* ---- REVEAL ---- */
  .rsteps{display:flex;flex-direction:column;gap:12px;}
  .rstep{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 18px;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .rlabel{font-size:.7rem;font-weight:700;letter-spacing:.4px;color:var(--accent);
    text-transform:uppercase;margin-bottom:8px;}
  .rstep p:first-of-type{margin-top:0;} .rstep p:last-child{margin-bottom:0;}
  .rstep ul{margin:.4em 0;padding-left:1.2em;}
  .testo{background:#13233f;border:1px solid #2b4877;border-radius:12px;padding:14px 18px;margin-bottom:14px;}
  .testo .src{display:block;font-size:.74rem;font-style:italic;color:var(--accent2);margin-bottom:8px;
    text-transform:uppercase;letter-spacing:.3px;}
  .esame-nota{font-size:.9rem;color:var(--muted);font-style:italic;margin-top:12px;padding-left:12px;
    border-left:3px solid var(--border);}

  .reveal-btn{background:var(--accent);color:#fff;border:none;padding:11px 18px;border-radius:10px;
    font-size:.95rem;font-weight:600;cursor:pointer;margin-top:14px;transition:.12s;}
  .reveal-btn:hover:not(:disabled){background:var(--accent2);}
  .reveal-btn.small{padding:7px 14px;font-size:.85rem;margin-top:0;background:var(--panel2);
    color:var(--accent2);border:1px solid var(--border);}
  .reveal-btn.small:hover:not(:disabled){border-color:var(--accent);}
  .reveal-btn:disabled,.reveal-btn.done{background:var(--panel2);color:var(--muted);
    border:1px solid var(--border);cursor:default;}

  /* ---- COLLAUDO ---- */
  .collaudo-item{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 18px;margin-bottom:12px;}
  .cq{margin-bottom:10px;}
  .ca{margin-top:12px;background:var(--okbg);border:1px solid #235c33;border-radius:8px;
    padding:10px 14px;font-size:.94rem;}
  .ca b{color:#5fd980;}

  /* ---- PREV / NEXT ---- */
  .prevnext{display:flex;justify-content:space-between;gap:12px;margin-top:40px;
    border-top:1px solid var(--border);padding-top:20px;}
  .pnbtn{flex:1 1 0;background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:12px 16px;cursor:pointer;color:var(--txt);text-align:left;transition:.14s;font:inherit;}
  .pnbtn:hover{border-color:var(--accent);background:var(--panel2);}
  .pnbtn.next{text-align:right;}
  .pnbtn .k{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .pnbtn .t{font-weight:600;color:var(--accent2);}
  .pnbtn:disabled{opacity:.35;cursor:default;border-color:var(--border);background:var(--panel);}

  code{background:var(--panel2);border:1px solid var(--border);border-radius:5px;
    padding:1px 5px;font-size:.85em;color:var(--accent2);}
  .katex{font-size:1.02em;color:var(--txt);} .katex-display{margin:.5em 0;overflow-x:auto;overflow-y:hidden;}

  @media(max-width:860px){
    .shell{flex-direction:column;}
    .sidebar{width:100%;flex:none;position:static;max-height:none;border-right:none;
      border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:4px;}
    .sidebar h2{width:100%;} .navitem{width:auto;}
    .main{padding:20px 16px 80px;}
  }
</style>

<script>
"use strict";
const R = String.raw;

function typeset(el){
  if(el && window.renderMathInElement){
    try{ renderMathInElement(el,{delimiters:[
      {left:'$$',right:'$$',display:true},
      {left:'$',right:'$',display:false}
    ],throwOnError:false}); }catch(e){}
  }
}
function elFromHTML(html){ var d=document.createElement('div'); d.innerHTML=html; return d; }

/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un
   rimando scritto nella prosa:

       <span class="str" data-str="serie-geometrica">la serie geometrica</span>

   Le schede citate da questo nucleo sono cucite qui sotto dal montaggio
   (assembla-nucleo.js): la pagina resta autosufficiente — niente fetch,
   niente sottocartelle da pubblicare — e un rimando a una scheda che non
   esiste FERMA la costruzione invece di arrivare in pagina rotto.
   Apertura: lo stesso gesto del collaudo (si clicca, il pannello compare,
   si typeset una volta sola), portato dentro la frase.
   =================================================================== */
var CORSO = 'topologia';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["anello-dei-germi"] = {"nome":"Anello dei germi","riga":"Classi di equivalenza di coppie $(U,f)$ con $U$ intorno aperto di $p$: $E(p)$ dimentica dove due funzioni differiscono, ricorda solo come si comportano arbitrariamente vicino a $p$.","serve":"È il modo algebrico di dire «proprietà locale in $p$» senza fissare un dominio: due funzioni con domini diversi ma che coincidono vicino a $p$ sono lo stesso oggetto. Su $E(p)$ somma e prodotto si definiscono componente per componente sull'intersezione dei domini, e lo rendono un anello commutativo unitario — l'unità è il germe della funzione costante $1$. È il dominio su cui si definiscono le derivazioni, e quindi lo spazio tangente: una derivazione deve vedere solo il comportamento locale di una funzione, ed $E(p)$ è precisamente l'oggetto che ha già dimenticato tutto il resto.","esempio":"$f(x)=x^2$ su tutto $\\mathbb{R}$ e $g$ definita da $g(x)=x^2$ per $|x|\\lt1$ e $g(x)=2-x^2$ per $|x|\\ge1$ sono funzioni globalmente diverse — $g$ non è nemmeno $C^\\infty$ in generale se il raccordo non è liscio, ma supponendo che lo sia, $f$ e $g$ **rappresentano lo stesso germe in $p=0$**: coincidono su tutto l'intervallo $(-1,1)$, un intorno di $0$. Nel germe $f=g\\in E(0)$ non c'è più traccia di come le due funzioni si comportino per $|x|\\ge1$: un conto di verifica, $f(1/2)=(1/2)^2=1/4$ e $g(1/2)$ con lo stesso valore perché $1/2\\in(-1,1)$, conferma l'accordo nel punto scelto.","pieno":{"file":"tp-10-anelli-ideali-germi.html","tappa":"05","come":"la costruzione completa di E(p), con la relazione di equivalenza dimostrata e le operazioni di anello"},"controllo":[{"tipo":"uguale","sinistra":"(Rational(1,2))**2","vale":"1/4","dove":"esempio","appare":"f(1/2)=(1/2)^2=1/4"}]};
STRUM["ideale-massimale"] = {"nome":"Ideale massimale","riga":"Un ideale proprio non contenuto in nessun ideale proprio più grande: quozientando l'anello per lui si ottiene sempre un campo.","serve":"È il criterio algebrico con cui si riconosce quando un quoziente $A/I$ è un campo, cioè quando ogni elemento non nullo è invertibile: succede esattamente se $I$ è massimale. Nell'anello dei germi $E(p)$ l'ideale $M(p)=\\{f : f(p)=0\\}$ è l'unico ideale massimale — ogni altro ideale proprio è contenuto in lui — e un germe è invertibile esattamente quando non sta in $M(p)$, cioè quando $f(p)\\ne0$. È il criterio pratico con cui si decide, in un conto, se un germe ammette inverso senza dover costruirlo esplicitamente.","esempio":"In $\\mathbb{Z}$, l'ideale $5\\mathbb{Z}$ è massimale: il quoziente $\\mathbb{Z}/5\\mathbb{Z}$ è un campo, e lo si verifica trovando l'inverso di ogni classe non nulla — $2\\cdot3=6$, che è $1$ più un multiplo di $5$, dunque $3$ è l'inverso di $2$ modulo $5$. L'ideale $4\\mathbb{Z}$ invece **non** è massimale: è contenuto propriamente in $2\\mathbb{Z}$, e nel quoziente $\\mathbb{Z}/4\\mathbb{Z}$ la classe di $2$ non è invertibile — anzi $2\\cdot2=4$ è un multiplo di $4$, quindi $2$ è uno zero-divisore, il segno più diretto che il quoziente non è un campo.","pieno":{"file":"tp-10-anelli-ideali-germi.html","tappa":"06","come":"M(p) costruito come nucleo della valutazione, con la dimostrazione che è l'unico ideale massimale di E(p)"},"controllo":[{"tipo":"uguale","sinistra":"2*3","vale":"6","dove":"esempio","appare":"2\\cdot3=6"},{"tipo":"uguale","sinistra":"2*2","vale":"4","dove":"esempio","appare":"2\\cdot2=4"}]};
STRUM["derivazione"] = {"nome":"Derivazione (regola di Leibniz)","riga":"Un operatore lineare $D$ su un'algebra che rispetta la regola del prodotto: $D(fg)=f\\,D(g)+g\\,D(f)$. È la proprietà che isola «derivare» fra tutti gli operatori lineari possibili.","serve":"È il modo algebrico di definire la derivata senza limiti, e serve ogni volta che si vuole derivare su un oggetto dove non c'è un rapporto incrementale da fare — su una varietà astratta, su un'algebra di matrici, su un anello di polinomi. La conseguenza operativa più usata è che **una derivazione è determinata dai suoi valori sui generatori**: su $\\mathbb{R}^{n}$ basta sapere quanto vale sulle coordinate $x^{1},\\dots,x^{n}$, e da lì Leibniz e la linearità danno tutto il resto. È il motivo per cui un vettore tangente, definito come derivazione, si scrive sempre come combinazione delle $\\partial/\\partial x^{i}$: non perché lo si sia scelto, ma perché non c'è altro. Un secondo fatto, che si dimostra in due righe e si usa continuamente: la **composizione** di due derivazioni non è una derivazione (compaiono derivate seconde), ma la loro **differenza incrociata** $DE-ED$ lo è, perché i termini secondi si cancellano a coppie.","esempio":"Su $\\mathbb{R}$, l'operatore $d/dx$ verificato sul prodotto $f=x^{2}$ e $g=x^{3}$: la regola dice $x^{2}\\cdot3x^{2}+x^{3}\\cdot2x$, cioè $5x^{4}$, e la derivata diretta di $x^{5}$ dà lo stesso $5x^{4}$. Il conto è banale ed è il punto: Leibniz non aggiunge informazione su $\\mathbb{R}$, dove la derivata si sa già fare. Aggiunge informazione quando è l'unica cosa che si ha — per esempio sull'algebra delle matrici, dove $D(A)=MA-AM$ per una matrice fissata $M$ è una derivazione, e la verifica di Leibniz consiste nello sviluppare $M(AB)-(AB)M$ e riconoscerlo come somma di $A\\,D(B)$ e $D(A)\\,B$, cosa che riesce perché i due termini $AMB$ introdotti dallo sviluppo compaiono con segni opposti e si cancellano.","debito":"che le derivazioni in un punto di una varietà siano esattamente i vettori tangenti è il teorema di gd-06 e non si ripete qui; il caso delle algebre non commutative è citato come esempio e non sviluppato.","controllo":[{"tipo":"uguale","sinistra":"x**2*3*x**2+x**3*2*x","vale":"5*x**4","ipotesi":{"x":"real"},"dove":"esempio","appare":"5x^{4}"},{"tipo":"derivata","espr":"x**5","rispetto":["x"],"vale":"5*x**4","ipotesi":{"x":"real"},"dove":"esempio","appare":"derivata diretta di $x^{5}$"}]};

function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';
  return h;
}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

/* ===================================================================
   >>> CONTENUTO — Nucleo tp-10: Anelli, ideali, e l anello dei germi <<<
   Modello dati: TAPPE[] ; ogni tappa ha blocchi[] con un tipo (t).
   Tipi: prosa | gram | reveal | esercizio | collaudo | prolessi | plot
   Tutta la matematica in R`...` (String.raw). Nelle formule si usano
   \lt \gt \le \ge (mai < > nudi, che l'HTML leggerebbe come tag).
   =================================================================== */

var TAPPE = [


/*MOVIMENTO
id:        tp-10 — anelli, ideali, e l'anello dei germi

/* ---------------- 00 · DI COSA PARLA QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Di cosa parla questo movimento', meta:'il buco misurato dentro geodiff · quattro oggetti algebrici dati per noti · il piano: fino a E(p) e M(p), non oltre',
  blocchi:[
  {t:'prosa', title:'Il secondo buco, indipendente dal primo', tag:'architettura', html:R`
  <p>I nove movimenti precedenti hanno chiuso il buco <i>topologico</i> davanti a geodiff. Ce n'era un secondo, misurato dalla stessa ricerca che ha aperto questa mappa: nei diciassette movimenti gd-*, la parola «derivazione» compare in nove file, ma «anello dei germi» e «ideale massimale» non compaiono mai. Geodiff definisce lo spazio tangente $T_pM$ come lo spazio delle <b>derivazioni</b> sull'anello dei germi $E(p)$ — una frase che contiene, senza nominarli, quattro oggetti algebrici: <b>anello</b>, <b>ideale</b>, <b>quoziente</b>, e il teorema che quozientare per un ideale <b>massimale</b> produce un <b>campo</b>. Questo movimento li costruisce, in questo ordine, e si ferma esattamente dove la mappa lo dichiara: a $E(p)$ e al suo ideale massimale $M(p)$.</p>
  <div class="note"><b>Cosa questo movimento non fa, e perche'.</b> Non e' un corso di algebra astratta: moduli, algebre di Lie, gruppi di Lie — le sezioni 2.3-2.5 del programma di recupero — non si rifanno qui, perche' stanno gia' in gd-12, gd-14 e nei nove movimenti che usano le derivazioni. Un prerequisito che duplica il corso che prepara fa perdere tempo due volte. Qui si prende solo la catena algebrica che porta a $E(p)$ e $M(p)$, e ci si ferma.</p>`}
]},

/* ---------------- 01 · ANELLO COMMUTATIVO UNITARIO ---------------- */
{ num:'01', title:'Lanello commutativo unitario: la struttura che il corso presuppone', meta:'gli assiomi, motivati non elencati · perche serve piu di un gruppo · il primo esempio non banale',
  blocchi:[
  {t:'reveal', title:'Dagli assiomi al primo esempio che conta davvero', tag:'first principles', steps:[
   {label:'Perche non basta un gruppo', body:R`
   <p>Un insieme di funzioni si somma e si moltiplica — due operazioni, non una sola. Un gruppo (una sola operazione, con inverso) non basta a descrivere questa struttura: serve un oggetto con <b>due</b> operazioni che interagiscono fra loro tramite la distributivita'. Questo e' esattamente cio' che un <b>anello</b> formalizza.</p>`},
   {label:'La definizione', body:R`
   <div class="note">Un <b>anello commutativo unitario</b> $A$ e' un insieme con due operazioni $+$ e $\cdot$ tali che: $(A,+)$ e' un gruppo abeliano (con elemento neutro $0$); $\cdot$ e' associativa, commutativa, con elemento neutro $1\neq0$; vale la distributivita' $a\cdot(b+c)=a\cdot b+a\cdot c$ per ogni $a,b,c\in A$.</div>
   <p>Gli esempi familiari: $\mathbb{Z}$, $\mathbb{Q}$, $\mathbb{R}$, $\mathbb{C}$ sono tutti anelli commutativi unitari (i primi tre non sono campi solo $\mathbb{Z}$, perche' non ogni elemento non nullo ha inverso moltiplicativo — $2$ non ha inverso intero).</p>`},
   {label:'Il primo esempio che non e un insieme di numeri', body:R`
   <p>L'esempio che conta per questo movimento e' diverso: per un aperto $U\subseteq\mathbb{R}^n$, l'insieme $C^\infty(U)$ delle funzioni lisce su $U$, con somma e prodotto punto per punto, e' un anello commutativo unitario — l'unita' e' la funzione costante $1$. E' la stessa struttura algebrica di $\mathbb{Z}$ o $\mathbb{R}$, applicata a oggetti che fino a questo momento si erano sempre pensati come «funzioni», non come «elementi di un anello». <b>Questo cambio di prospettiva — vedere le funzioni come elementi di una struttura algebrica, non solo come regole di calcolo — e' il primo passo di tutto il movimento.</b></p>`}
  ]}
]},

/* ---------------- 02 · OMOMORFISMI E IDEALI ---------------- */
{ num:'02', title:'Omomorfismi di anelli, e ideali', meta:'cosa deve rispettare una funzione fra anelli · ideale: chiuso per somma, assorbe per moltiplicazione · lesempio in Z',
  blocchi:[
  {t:'reveal', title:'Due definizioni, con lesempio che le rende concrete subito', tag:'costruzione', steps:[
   {label:'Omomorfismo di anelli', body:R`
   <p>Un'applicazione $\varphi:A\to B$ fra anelli e' un <b>omomorfismo</b> se rispetta entrambe le operazioni e le unita': $\varphi(a+b)=\varphi(a)+\varphi(b)$, $\varphi(ab)=\varphi(a)\varphi(b)$, $\varphi(1_A)=1_B$. E' l'analogo, per gli anelli, di un'applicazione lineare per gli spazi vettoriali o di un'applicazione continua per gli spazi topologici: la funzione che «non rompe» la struttura.</p>`},
   {label:'Ideale: un sottoinsieme speciale, non un sottoanello', body:R`
   <p>Un <b>ideale</b> $I\subseteq A$ e' un sottoinsieme tale che: $(I,+)$ e' un sottogruppo di $(A,+)$; e per ogni $a\in I$ e $r\in A$ (non solo $r\in I$), $ra\in I$ — $I$ «assorbe» la moltiplicazione per <b>qualunque</b> elemento dell'anello, non solo per i propri. E' questa seconda condizione, piu' forte della chiusura di un sottoanello, che rende possibile costruire un quoziente (tappa 03). Un ideale $I\neq A$ si dice <b>proprio</b>.</p>`},
   {label:'Lesempio canonico: gli ideali di Z', body:R`
   <p>In $\mathbb{Z}$, per ogni $n\in\mathbb{N}$, l'insieme $n\mathbb{Z}=\{\dots,-2n,-n,0,n,2n,\dots\}$ dei multipli di $n$ e' un ideale: e' un sottogruppo additivo, e il prodotto di un multiplo di $n$ per <b>qualunque</b> intero resta un multiplo di $n$. Si puo' dimostrare (ed e' un fatto che si usa spesso senza dimostrarlo) che <b>ogni</b> ideale di $\mathbb{Z}$ e' di questa forma: $\mathbb{Z}$ e' un «anello a ideali principali». Nessun ideale di $\mathbb{Z}$ e' generato da due numeri indipendenti in modo essenziale — e' sempre il multiplo di uno solo, il loro massimo comun divisore.</p>`}
  ]}
]},

/* ---------------- 03 · ANELLO QUOZIENTE E TEOREMA DI ISOMORFISMO ---------------- */
{ num:'03', title:'Lanello quoziente, e il teorema fondamentale di omomorfismo', meta:'A/I costruito come insieme di classi laterali · la struttura di anello sul quoziente · il teorema, enunciato e usato',
  blocchi:[
  {t:'prosa', title:'Perche un ideale, e non un sottoanello qualunque, permette di quozientare', tag:'first principles', html:R`
  <p>Dato un ideale $I\subseteq A$, si definisce su $A$ la relazione $a\sim b$ se $a-b\in I$. E' una relazione di equivalenza (riflessiva perche' $0\in I$; simmetrica perche' $I$ e' chiuso per l'opposto; transitiva perche' $I$ e' chiuso per somma). Le classi di equivalenza si scrivono $a+I$, e l'insieme delle classi e' l'<b>anello quoziente</b> $A/I$.</p>
  <p><b>Qui e' dove la condizione «assorbe per qualunque $r\in A$» entra in modo essenziale.</b> Per definire il prodotto sul quoziente, $(a+I)(b+I):=ab+I$, bisogna controllare che non dipenda dai rappresentanti scelti: se $a'=a+i_1$ e $b'=b+i_2$ con $i_1,i_2\in I$, allora $a'b'=ab+ai_2+i_1b+i_1i_2$, e i tre termini aggiuntivi stanno tutti in $I$ — $ai_2$ e $i_1 b$ perche' $I$ assorbe la moltiplicazione per <b>qualunque</b> elemento di $A$ (non solo per elementi di $I$), $i_1i_2$ perche' $I$ e' chiuso rispetto al prodotto per elementi di $A$ applicato a se stesso. <b>Un semplice sottoanello non basterebbe</b>: la moltiplicazione per un elemento esterno potrebbe far uscire dal sottoinsieme, e il prodotto sul quoziente non sarebbe ben definito.</p>`},
  {t:'reveal', title:'Il teorema fondamentale di omomorfismo', tag:'dimostrazione', steps:[
   {label:'Lenunciato', body:R`
   <p><b>Teorema.</b> Sia $\varphi:A\to B$ un omomorfismo di anelli surgettivo. Allora $\ker\varphi=\{a\in A:\varphi(a)=0\}$ e' un ideale di $A$, e l'anello quoziente $A/\ker\varphi$ e' isomorfo a $B$.</p>`},
   {label:'Perche il nucleo e un ideale', body:R`
   <p>Se $a\in\ker\varphi$ e $r\in A$, $\varphi(ra)=\varphi(r)\varphi(a)=\varphi(r)\cdot0=0$, dunque $ra\in\ker\varphi$: e' esattamente la condizione di assorbimento della tappa 02. $(\ker\varphi,+)$ e' un sottogruppo perche' $\varphi$ e' un omomorfismo di gruppi additivi.</p>`},
   {label:'Lisomorfismo', body:R`
   <p>Si definisca $\bar\varphi:A/\ker\varphi\to B$, $\bar\varphi(a+\ker\varphi)=\varphi(a)$: e' ben definita (se $a-a'\in\ker\varphi$, $\varphi(a)=\varphi(a')$), e' un omomorfismo (eredita le proprieta' di $\varphi$), e' iniettiva ($\bar\varphi(a+\ker\varphi)=0$ implica $\varphi(a)=0$ cioe' $a\in\ker\varphi$ cioe' $a+\ker\varphi=0+\ker\varphi$), ed e' surgettiva perche' $\varphi$ lo e'. <b>$\bar\varphi$ e' un isomorfismo.</b></p>`}
  ]}
]},

/* ---------------- 04 · IDEALE MASSIMALE E CAMPO QUOZIENTE ---------------- */
{ num:'04', title:'Ideale massimale: quando il quoziente e un campo', meta:'la definizione · Z/5Z campo contro Z/4Z non campo · il criterio che si usera per M(p)',
  blocchi:[
  {t:'prosa', title:'La definizione', tag:'grammatica', html:R`
  <p>Un ideale proprio $I\subsetneq A$ e' <b>massimale</b> se non esiste nessun ideale $J$ con $I\subsetneq J\subsetneq A$ — $I$ e' il piu' grande possibile, restando proprio. Il fatto centrale di questa tappa, che si usera' per intero nella prossima: <b>$A/I$ e' un campo se e solo se $I$ e' massimale.</b></p>`},
  {t:'reveal', title:'Un confronto concreto: Z/5Z contro Z/4Z', tag:'dimostrazione', steps:[
   {label:'Z/5Z e un campo: ogni classe non nulla e invertibile', body:R`
   <p>Nel quoziente $\mathbb{Z}/5\mathbb{Z}$, la classe di $2$ ammette inverso: $2\cdot3=6$, e $6$ e' congruo a $1$ modulo $5$ (differiscono per $5$, un multiplo di $5$), dunque la classe di $3$ e' l'inversa della classe di $2$. Lo stesso vale per $1,3,4$ (si verifica caso per caso, essendo $5$ primo): <b>ogni classe non nulla e' invertibile, $\mathbb{Z}/5\mathbb{Z}$ e' un campo</b>, e di conseguenza $5\mathbb{Z}$ e' un ideale massimale di $\mathbb{Z}$.</p>`},
   {label:'Z/4Z non e un campo: uno zero-divisore lo dimostra', body:R`
   <p>Nel quoziente $\mathbb{Z}/4\mathbb{Z}$, la classe di $2$ <b>non</b> e' invertibile: $2\cdot2=4$, che e' congruo a $0$ modulo $4$ — il prodotto di $2$ con se stesso, nessuno dei due nullo, da' la classe nulla. Un elemento cosi' si chiama <b>zero-divisore</b>, e la sua esistenza basta a escludere che l'anello sia un campo (in un campo, $xy=0$ implica $x=0$ o $y=0$). <b>$\mathbb{Z}/4\mathbb{Z}$ non e' un campo, e $4\mathbb{Z}$ non e' massimale</b> — coerentemente, $4\mathbb{Z}\subsetneq2\mathbb{Z}\subsetneq\mathbb{Z}$: $4\mathbb{Z}$ e' contenuto propriamente in un ideale proprio piu' grande.</p>`},
   {label:'Il criterio che conta per la tappa 06', body:R`
   <p>Il confronto mostra il meccanismo che tp-10 usera' per $E(p)$: un ideale e' massimale quando quozientare per lui «non lascia scampo» a elementi non invertibili — ogni classe diversa da zero deve avere un inverso. E' precisamente il criterio che la tappa 06 verifichera' per $M(p)\subset E(p)$, con lo stesso schema di questo confronto ma in un anello di funzioni invece che di interi.</p>`}
  ]}
]},

/* ---------------- 05 · IL GERME DI FUNZIONE ---------------- */
{ num:'05', title:'Il germe di funzione: E(p) costruito per intero', meta:'coppie (U,f) e la relazione che le identifica · dimostrazione che e di equivalenza · le operazioni ben definite',
  blocchi:[
  {t:'prosa', title:'Il problema che il germe risolve', tag:'first principles', html:R`
  <p>Una derivazione (tappa 07) deve vedere solo il comportamento <b>locale</b> di una funzione vicino a $p$ — due funzioni che coincidono in un intorno di $p$, per quanto diverse altrove, devono essere indistinguibili per una derivazione in $p$. Serve dunque un oggetto algebrico che «dimentichi» dove due funzioni smettono di coincidere, e ricordi solo il loro comportamento arbitrariamente vicino a $p$: questo e' l'<span class="str" data-str="anello-dei-germi">anello dei germi</span>.</p>`},
  {t:'reveal', title:'La costruzione, dimostrata per intero', tag:'dimostrazione', steps:[
   {label:'Linsieme di partenza', body:R`
   <p>Fissato $p\in\mathbb{R}^n$, sia $\mathcal{E}(p)=\{(U,f):U\subseteq\mathbb{R}^n\text{ aperto},\ p\in U,\ f\in C^\infty(U)\}$ (Manetti, stampata 10) — tutte le coppie possibili di un aperto contenente $p$ e una funzione liscia su quell'aperto, senza nessuna relazione fra loro per ora.</p>`},
   {label:'La relazione, e perche e di equivalenza', body:R`
   <p>Si dichiari $(U,f)\sim(V,g)$ se esiste un intorno aperto $W\subseteq U\cap V$ di $p$ con $f|_W\equiv g|_W$. <b>Riflessiva</b>: $(U,f)\sim(U,f)$ prendendo $W=U$. <b>Simmetrica</b>: ovvia dalla simmetria di $f|_W\equiv g|_W$. <b>Transitiva</b>: se $(U,f)\sim(V,g)$ via $W$ e $(V,g)\sim(Z,h)$ via $Y$, allora su $W\cap Y$ (aperto, contiene $p$) si ha sia $f\equiv g$ che $g\equiv h$, dunque $f\equiv h$ su $W\cap Y\subseteq U\cap Z$: $(U,f)\sim(Z,h)$.</p>`},
   {label:'Lanello E(p)', body:R`
   <p>$E(p):=\mathcal{E}(p)/\!\sim$ e' l'<b>anello dei germi</b> in $p$. La somma di due germi $[U,f]$ e $[V,g]$ si definisce rappresentandola con la coppia $(U\cap V,\,f+g)$, e il prodotto allo stesso modo con $(U\cap V,\,f\cdot g)$: le operazioni sono ben definite (non dipendono dai rappresentanti scelti, per lo stesso tipo di verifica fatta per il prodotto sul quoziente in tappa 03), e rendono $E(p)$ un anello commutativo unitario — l'unita' e' il germe della funzione costante $1$. Per ogni germe $f=[U,f]\in E(p)$, il valore $f(p)$ e' ben definito: tutti i rappresentanti coincidono in un intorno di $p$, dunque in particolare in $p$.</p>
   <p>Un conto per vedere due rappresentanti diversi dello stesso germe: $f(x)=x^2$ su tutto $\mathbb{R}$, e $g$ che coincide con $f$ su $(-1,1)$ ma e' definita diversamente fuori da quell'intervallo. Per $x=1/2\in(-1,1)$, $(1/2)^2=1/4$ in entrambi i casi: i due rappresentanti concordano dove serve, e definiscono lo stesso germe in $p=0$, qualunque cosa succeda a $g$ per $|x|\ge1$.</p>`}
  ]},
  {t:'plot', title:'Due rappresentanti dello stesso germe in p=0',
   intro:R`$f(x)=x^2$ su tutto $\mathbb{R}$ (continua) e $g(x)$, che coincide con $f$ su $(-1,1)$ e poi si allontana (tratteggiata): stesso germe in $0$, funzioni diverse altrove.`,
   plots:[
    {kind:'func2d', f:'x*x', tr:[-1.8,1.8], height:300, equal:false,
     xr:[-1.9,1.9], yr:[-0.3,3.2],
     title:'f(x)=x^2 (continua) e g (tratteggiata oltre x=1 e x=-1): stesso germe in 0',
     segs:[{x1:1,y1:1,x2:1.8,y2:-0.2, col:'#d8a13a', dash:true, width:1.8},
           {x1:-1,y1:1,x2:-1.8,y2:-0.2, col:'#d8a13a', dash:true, width:1.8}],
     marks:[{x:0,y:0, label:'p=0: qui il germe e definito', col:'#5eead4', up:true},
            {x:1,y:1, label:'x=1: il confine dellaccordo', col:'#8ea0b8', up:true},
            {x:-1,y:1, label:'x=-1', col:'#8ea0b8', up:true}]}
   ],
   leggi:R`<p>La curva continua e' $f(x)=x^2$. Dentro $(-1,1)$ anche $g$ coincide esattamente con questa parabola — e' per questo che le due funzioni rappresentano lo stesso elemento di $E(0)$. Fuori da quell'intervallo (tratteggiato), $g$ puo' fare qualunque cosa: scendere, impennarsi, non essere nemmeno definita. <b>Il germe non vede quella parte</b>: $[\mathbb{R},f]=[(-1,1),g|_{(-1,1)}]$ in $E(0)$, perche' la definizione di $\sim$ chiede solo un intorno di accordo, non l'intero dominio.</p>`}
]},

/* ---------------- 06 · LIDEALE MASSIMALE M(p) ---------------- */
{ num:'06', title:'Lideale massimale M(p): il nucleo della valutazione', meta:'ev_p come omomorfismo surgettivo · M(p)=ker(ev_p) massimale per il teorema di isomorfismo · il Lemma 1.5: invertibilita e unicita',
  blocchi:[
  {t:'prosa', title:'Lomomorfismo di valutazione', tag:'grammatica', html:R`
  <p>Si definisca $\mathrm{ev}_p:E(p)\to\mathbb{R}$, $\mathrm{ev}_p(f)=f(p)$ — ben definita, come visto alla tappa 05. E' un omomorfismo di anelli: $\mathrm{ev}_p(f+g)=(f+g)(p)=f(p)+g(p)$, $\mathrm{ev}_p(fg)=f(p)g(p)$, $\mathrm{ev}_p(1)=1$. Ed e' <b>surgettiva</b>: per ogni $c\in\mathbb{R}$, il germe della funzione costante $c$ ha valutazione $c$.</p>`},
  {t:'reveal', title:'M(p) e massimale, per il teorema gia dimostrato', tag:'dimostrazione', steps:[
   {label:'Applicare il teorema della tappa 03', body:R`
   <p>Si definisca $M(p):=\ker(\mathrm{ev}_p)=\{f\in E(p):f(p)=0\}$ (Manetti, Definizione e commento, stampata 11). Per il teorema fondamentale di omomorfismo (tappa 03), applicato a $\mathrm{ev}_p$ surgettiva: $M(p)$ e' un ideale di $E(p)$, e $E(p)/M(p)$ e' isomorfo a $\mathbb{R}$. <b>$\mathbb{R}$ e' un campo</b>, dunque $E(p)/M(p)$ e' un campo, dunque — per il fatto enunciato in tappa 04 — <span class="str" data-str="ideale-massimale">$M(p)$ e' un ideale massimale</span>. Nessun argomento nuovo: e' lo stesso teorema di tappa 03, applicato a un omomorfismo specifico.</p>`},
   {label:'Il Lemma 1.5, parte 1: invertibilita', body:R`
   <p><b>Un germe $f\in E(p)$ e' invertibile se e solo se $f(p)\neq0$.</b> Se $f$ e' invertibile con inverso $g$, $f(p)g(p)=(fg)(p)=1(p)=1$, dunque $f(p)\neq0$. Viceversa, se $f(p)\neq0$ con rappresentante $(U,f)$, l'insieme $V=\{x\in U:f(x)\neq0\}$ e' aperto (controimmagine di $\mathbb{R}\setminus\{0\}$ sotto $f$ continua) e contiene $p$; su $V$, $f$ non si annulla mai, dunque $1/f$ e' ben definita e liscia su $V$, e $[V,1/f]$ e' l'inverso cercato.</p>`},
   {label:'Il Lemma 1.5, parte 2: M(p) e lunico massimale', body:R`
   <p><b>Ogni ideale proprio di $E(p)$ e' contenuto in $M(p)$.</b> Sia $I\subsetneq E(p)$ proprio: non puo' contenere nessun elemento invertibile (se $f\in I$ fosse invertibile, $1=f\cdot f^{-1}\in I$ per la proprieta' di assorbimento, e allora $I=E(p)$, assurdo). Per la parte 1, un germe non invertibile e' esattamente un germe con $f(p)=0$, cioe' un elemento di $M(p)$: dunque $I\subseteq M(p)$. <b>Non esiste nessun ideale massimale diverso da $M(p)$</b>, perche' ogni ideale proprio, massimale o no, e' gia' contenuto in lui.</p>`}
  ]}
]},

/* ---------------- 07 · PERCHE SERVE: VERSO LO SPAZIO TANGENTE ---------------- */
{ num:'07', title:'Perche serve: la derivazione su E(p), e il debito verso gd-06', meta:'derivazione, definita qui per completezza lessicale · lo spazio tangente come Der(E(p),R) · il debito su m_p/m_p^2',
  blocchi:[
  {t:'prosa', title:'Derivazione: la definizione, per chiudere il vocabolario', tag:'grammatica', html:R`
  <p>Una <span class="str" data-str="derivazione">derivazione</span> su $E(p)$ e' un'applicazione $\mathbb{R}$-lineare $\delta:E(p)\to\mathbb{R}$ che soddisfa la <b>regola di Leibniz</b>: $\delta(fg)=f(p)\delta(g)+g(p)\delta(f)$ per ogni $f,g\in E(p)$. Lo spazio tangente $T_pM$ e', per definizione, lo spazio di tutte le derivazioni su $E(p)$ (Manetti, Definizione 1.6, stampata 12) — questo movimento si ferma qui, dichiarando la definizione per completezza lessicale: <b>la dimostrazione che questo spazio e' isomorfo a $\mathbb{R}^n$, e tutto cio' che segue, e' il lavoro di gd-06</b>, gia' scritto e verificato, e non si ripete.</p>`},
  {t:'prosa', title:'Un debito dichiarato: la caratterizzazione via m_p/m_p^2', tag:'sintesi', html:R`
  <p>Abate-Tovena (Esercizio 2.60, stampata 122) offre una seconda caratterizzazione algebrica dello spazio tangente, piu' profonda di quella appena citata: posto $\mathfrak{m}_p=M(p)$, lo spazio $T_pM$ e' canonicamente isomorfo al <b>duale</b> dello spazio vettoriale quoziente $\mathfrak{m}_p/\mathfrak{m}_p^2$ (dove $\mathfrak{m}_p^2$ e' l'ideale generato dai prodotti di due elementi di $\mathfrak{m}_p$). E' un risultato elegante — collega lo spazio tangente a una costruzione puramente algebrica sull'ideale massimale, senza menzionare le derivazioni — ma va oltre la catena che questo movimento si era proposto di costruire (anello, ideale, quoziente, massimale): richiede la nozione di ideale generato da un prodotto e di spazio duale, nessuna delle quali e' nelle chiavi dichiarate dalla mappa. <b>Il debito e' dichiarato, non sviluppato</b>: se gd-06 o un movimento futuro ne avra' bisogno, la fonte e' gia' individuata.</p>`}
]},

/* ---------------- 08 · ESERCIZI ---------------- */
{ num:'08', title:'Esercizi — tocca a te', meta:'un ideale non massimale in un anello di funzioni · invertibilita a mano · collaudo',
  blocchi:[
  {t:'esercizio', title:'1 · Un ideale non massimale in C-infinito(R)', html:R`
  <p>Sia $I=\{f\in C^\infty(\mathbb{R}): f(0)=0 \text{ e } f(1)=0\}$ — le funzioni lisce che si annullano in <b>entrambi</b> i punti $0$ e $1$. Dimostra che $I$ e' un ideale di $C^\infty(\mathbb{R})$, e che non e' massimale.</p>`,
   sol:R`<p>$I$ e' un ideale: se $f,g\in I$, $(f+g)(0)=0+0=0$ e $(f+g)(1)=0$, dunque $f+g\in I$ (sottogruppo additivo); e se $f\in I$, $r\in C^\infty(\mathbb{R})$, $(rf)(0)=r(0)\cdot0=0$ e $(rf)(1)=0$, dunque $rf\in I$ (assorbimento). Non e' massimale: l'insieme $J=\{f:f(0)=0\}$ (annullarsi solo in $0$) e' anch'esso un ideale (stesso argomento), e $I\subsetneq J\subsetneq C^\infty(\mathbb{R})$ — $I$ e' strettamente contenuto in $J$ (ogni funzione di $I$ si annulla anche in $1$, ma non viceversa: $f(x)=x-1$ sta in $J$ non in $I$), e $J$ e' proprio (la funzione costante $1$ non sta in $J$). <b>$I$ e' contenuto propriamente in un ideale proprio piu' grande, dunque non e' massimale</b> — coerentemente con il Lemma 1.5: l'ideale massimale che contiene $I$ per il punto di valutazione $0$ e' $M(0)=J$, non $I$ stesso.</p>`},
  {t:'esercizio', title:'2 · Invertibilita a mano', html:R`
  <p>Il germe in $p=0$ di $f(x)=\sin(x)+2$ e' invertibile in $E(0)$? E quello di $g(x)=x\cos(x)$?</p>`,
   sol:R`<p>$f(0)=\sin(0)+2=0+2=2\neq0$: per il Lemma 1.5, <b>$f$ e' invertibile</b> in $E(0)$ — l'inverso esplicito e' $[V,1/(\sin x+2)]$ su un intorno $V$ di $0$ dove $\sin x+2$ non si annulla mai (il che vale ovunque, dato che $\sin x\ge-1>-2$). $g(0)=0\cdot\cos(0)=0$: per il Lemma 1.5, <b>$g$ non e' invertibile</b>, cioe' $g\in M(0)$ — non serve calcolare nessun inverso per saperlo, basta valutare in $p$.</p>`},
  {t:'collaudo', title:'Controlla di aver capito', html:R`
  <ol>
  <li>Perche' la condizione «$I$ assorbe la moltiplicazione per qualunque $r\in A$», e non solo per $r\in I$, e' essenziale per definire il prodotto sul quoziente $A/I$?</li>
  <li>Enuncia il teorema fondamentale di omomorfismo, e di' come si applica a $\mathrm{ev}_p:E(p)\to\mathbb{R}$.</li>
  <li>Perche' $\mathbb{Z}/4\mathbb{Z}$ non e' un campo, e cosa dice questo sulla massimalita' di $4\mathbb{Z}$?</li>
  <li>Enuncia il Lemma 1.5 nelle sue due parti, e di' quale delle due garantisce che $M(p)$ sia <i>l'unico</i> ideale massimale, non solo uno fra tanti.</li>
  <li>Perche' questo movimento si ferma alla definizione di derivazione e non dimostra che $T_pM\cong\mathbb{R}^n$?</li>
  </ol>`,
   sol:R`<ol>
   <li>Perche' il prodotto $(a+I)(b+I)=ab+I$ deve essere indipendente dai rappresentanti: cambiando $a$ in $a+i_1$, il prodotto cambia di $i_1b$, che deve stare in $I$ per non alterare la classe — e $b$ e' un elemento <i>qualunque</i> di $A$, non necessariamente di $I$. Un sottoanello chiuso solo per prodotti interni non lo garantirebbe.</li>
   <li>Se $\varphi:A\to B$ e' un omomorfismo surgettivo, $A/\ker\varphi\cong B$. Applicato a $\mathrm{ev}_p$ (surgettiva su $\mathbb{R}$): $E(p)/M(p)\cong\mathbb{R}$, e siccome $\mathbb{R}$ e' un campo, $M(p)$ e' massimale.</li>
   <li>Perche' la classe di $2$ soddisfa $2\cdot2=4\equiv0$, uno zero-divisore: un campo non ne ammette. Questo dice che $4\mathbb{Z}$ non e' massimale, coerentemente con $4\mathbb{Z}\subsetneq2\mathbb{Z}\subsetneq\mathbb{Z}$.</li>
   <li>Parte 1: $f$ invertibile sse $f(p)\neq0$. Parte 2: ogni ideale proprio e' contenuto in $M(p)$. E' la <b>parte 2</b> a garantire l'unicita': qualunque altro ideale massimale, essendo proprio, sarebbe contenuto in $M(p)$, e per massimalita' (non puo' essere contenuto propriamente in nulla di proprio) dovrebbe coincidere con $M(p)$.</li>
   <li>Perche' la mappa assegna a questo movimento solo la catena algebrica (anello, ideale, quoziente, massimale) che porta a $E(p)$ e $M(p)$: dimostrare $T_pM\cong\mathbb{R}^n$ e' un risultato di geometria differenziale, non di algebra, ed e' gia' scritto per intero in gd-06. Ripeterlo qui duplicherebbe lavoro gia' fatto.</li>
   </ol>`}
]},

/* ---------------- 09 · IL SENSO ---------------- */
{ num:'09', title:'Il senso, e la chiusura del prerequisito', meta:'cosa lascia in mano · il prerequisito di topologia si chiude qui, per intero · dove riappare nella fisica',
  blocchi:[
  {t:'prosa', title:'Cosa lascia in mano, e la chiusura di tutti e dieci i movimenti', tag:'sintesi', html:R`
  <p><b>Il punto.</b> Quattro oggetti algebrici — anello, ideale, quoziente, massimale — bastano a costruire $E(p)$ e $M(p)$ dal nulla, e lo stesso teorema (fondamentale di omomorfismo) che li lega si applica due volte in questo movimento: una volta in astratto (tappa 03), una volta su $\mathrm{ev}_p$ per ottenere che $M(p)$ e' massimale (tappa 06). Non e' un caso che lo stesso argomento ricompaia: e' il segno che la catena algebrica scelta era quella giusta, non una fra tante equivalenti.</p>
  <p><b>Il prerequisito si chiude qui, per intero.</b> Dieci movimenti, due buchi indipendenti — quello topologico (tp-01…tp-09, che costruiva il linguaggio sotto «localmente omeomorfo a $\mathbb{R}^n$» e tutto cio' che una varieta' richiede) e quello algebrico (questo movimento, che costruisce il linguaggio sotto «spazio delle derivazioni sull'anello dei germi») — entrambi misurati nello stesso giorno, entrambi colmati. Giuseppe puo' ora aprire gd-01 senza incontrare una parola che non ha mai incontrato prima.</p>`},
  {t:'prolessi', title:'Dove riappare questo movimento, nella fisica che farai',
   oggetto:R`<b>Lanello e lideale come linguaggio che riconosce quando una struttura locale puo essere isolata da un intero sistema</b> — dagli anelli di operatori in meccanica quantistica agli ideali di invarianti in meccanica statistica.`,
   rotte:[
    {dove:'Meccanica<br>quantistica', txt:R`Gli operatori lineari su uno spazio di Hilbert formano un'algebra (un anello non commutativo, con la composizione come prodotto); gli operatori che annullano un sottospazio fissato formano un ideale sinistro. Il concetto di «spettro» di un operatore, centrale in meccanica quantistica, e' definito algebricamente in termini molto vicini a quelli di questo movimento: $\lambda$ e' nello spettro di $A$ se $A-\lambda\,\mathrm{id}$ non e' invertibile nell'algebra degli operatori — lo stesso criterio di invertibilita' legato a un ideale massimale, in un contesto a dimensione infinita.`},
    {dove:'Geometria<br>differenziale', txt:R`Ogni movimento gd-* che parla di spazio tangente, campo vettoriale, o differenziale di un'applicazione sta lavorando, sotto la superficie, con $E(p)$ e le sue derivazioni — l'oggetto che questo movimento ha costruito da zero. $M(p)$ in particolare riappare quando si definiscono i covettori (l'esercizio di Abate su $\mathfrak{m}_p/\mathfrak{m}_p^2$, qui dichiarato come debito): lo spazio cotangente e' precisamente quel quoziente, visto da un'angolazione puramente algebrica.`},
    {dove:'Meccanica<br>statistica', txt:R`Le funzioni termodinamiche (energia, entropia, pressione) formano un anello di funzioni sullo spazio dei parametri di stato, e le relazioni di Maxwell sono, in sostanza, l'affermazione che certe combinazioni di derivate commutano — un fatto che si formalizza piu' facilmente nel linguaggio delle derivazioni di questo movimento che in quello del calcolo elementare. Non e' un'applicazione diretta, ma il vocabolario e' lo stesso.`}
   ],
   domanda:R`Questo movimento ha dichiarato un debito preciso verso $\mathfrak{m}_p/\mathfrak{m}_p^2$ come caratterizzazione algebrica alternativa dello spazio tangente. <b>Domanda per chi legge gd-06, l'ultima di questo prerequisito:</b> le due definizioni di spazio tangente — come spazio delle derivazioni su $E(p)$, e come duale di $\mathfrak{m}_p/\mathfrak{m}_p^2$ — danno davvero lo stesso spazio? E se si', qual e' l'isomorfismo esplicito fra le due costruzioni, e cosa dice sul perche' la geometria differenziale preferisce la prima alla seconda?`}
]}

var byId = {}; TAPPE.forEach(function(s){ byId[s.num]=s; });

var VKEY='pm-nucleotp-10-visited';
function loadSeen(){ try{ return new Set(JSON.parse(localStorage.getItem(VKEY)||'[]')); }catch(e){ return new Set(); } }
function saveSeen(s){ try{ localStorage.setItem(VKEY, JSON.stringify(Array.from(s))); }catch(e){} }
var SEEN = loadSeen();

function renderNav(active){
  var nav=document.getElementById('sidebar');
  nav.innerHTML='';
  var h=document.createElement('h2'); h.textContent='Nucleo tp-10 · le tappe'; nav.appendChild(h);
  TAPPE.forEach(function(s){
    var b=document.createElement('button');
    b.className='navitem'+(active===s.num?' active':'')+(SEEN.has(s.num)?' seen':'');
    b.innerHTML='<span class="dot"></span><span class="nx">'+s.num+'</span><span>'+s.title+'</span>';
    b.onclick=function(){ showTappa(s.num); };
    nav.appendChild(b);
  });
}

/* ---- renderer dei blocchi ---- */
function sectionProsa(title, tag, html){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var body=elFromHTML('<div class="open-body">'+html+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function sectionGram(title, rows){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag gramtag">grammatica</span></h3>';
  var inner='<table class="gramtab">';
  rows.forEach(function(r){ inner+='<tr><td class="gs">'+r[0]+'</td><td>'+r[1]+'</td></tr>'; });
  inner+='</table>';
  var body=elFromHTML('<div class="gramwrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
/* --- blocco PLOT: la figura non decora, si legge. Ogni plot porta una chiave di lettura. --- */
function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';
  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionSvelabile(title, tag, html, sol){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var c=document.createElement('div'); c.className='collaudo-item';
  var q=document.createElement('div'); q.className='cq'; q.innerHTML=html||'';
  c.appendChild(q); typeset(q);
  if(sol){
    var a=document.createElement('div'); a.className='ca'; a.style.display='none';
    a.innerHTML='<b>Soluzione.</b> '+sol;
    var btn=document.createElement('button'); btn.className='reveal-btn small';
    btn.textContent='Rivela la soluzione';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a);
      btn.disabled=true; btn.classList.add('done'); btn.textContent='Soluzione rivelata'; };
    c.appendChild(btn); c.appendChild(a);
  }
  wrap.appendChild(c); return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    /* DUE SCHEMI, NON UNO — scoperto il 2026-10-06 provando le pagine vive. I movimenti
       scritti per primi (em-01..03, me-10b, i collaudi di gd-01..09 e di quattro em)
       usano una forma piu' semplice: `reveal` e `prolessi` con un solo `html`,
       `esercizio` e `collaudo` con `html` + `sol`. Il renderer ne conosceva una sola e
       chiamava `steps.forEach` su `undefined`: TypeError, e la tappa si fermava li' —
       62 blocchi in 17 movimenti su 74. Non si riscrive il contenuto per far contento
       il renderer: e' il renderer che deve leggere cio' che c'e'.
       E in fondo un ramo che NON muore: uno schema nuovo di domani deve far vedere un
       avviso in quella sezione, non spegnere la pagina sotto di se'. */
    try{
      if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
      else if(b.t==='prolessi') m.appendChild(b.rotte ? sectionProlessi(b)
                                   : sectionProsa(b.title,'prolessi',b.html));
      else if(b.t==='reveal')m.appendChild(b.steps ? sectionReveal(b.title,b.tag,b.steps)
                                   : sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='esercizio') m.appendChild(b.steps ? sectionEsercizio(b)
                                   : sectionSvelabile(b.title,'esercizio',b.html,b.sol));
      else if(b.t==='collaudo')  m.appendChild(b.items ? sectionCollaudo(b.title,b.items)
                                   : sectionSvelabile(b.title,'provi, poi riveli',b.html,b.sol));
      else if(b.t==='plot')      m.appendChild(sectionPlot(b));
      else m.appendChild(sectionProsa(b.title||'(blocco)', 'tipo sconosciuto: '+b.t,
                                      b.html||''));
    }catch(err){
      var avv=document.createElement('section'); avv.className='section';
      avv.innerHTML='<h3>'+(b.title||'(blocco)')+'<span class="tag">non reso</span></h3>'
        +'<p style="color:#ff6b6b">Questo blocco non si &egrave; potuto rendere ('
        +b.t+': '+err.message+'). Il resto della tappa continua sotto.</p>';
      m.appendChild(avv);
    }
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* I POP-UP DEGLI STRUMENTI. `cablaStrumenti` esisteva dal 18-09 e non la chiamava
     nessuno: i 229 rimandi del percorso erano <span> senza handler, e il clic non
     faceva niente. Nessun controllo poteva vederlo — la sintassi era valida, le schede
     c'erano tutte, le formule rendevano: il guasto esisteva solo a pagina viva. Qui, e
     dopo ogni inserimento successivo, perche' la tappa si rimonta da capo a ogni
     cambio e gli handler vanno riattaccati al DOM nuovo. */
  cablaStrumenti(m);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}
