function typeset(el){

function elFromHTML(html){ var d=document.createElement('div'); d.innerHTML=html; return d; }

/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un
   rimando scritto nella prosa:

       <span class="str" data-str="serie-geometrica">la serie geometrica</span>

   Le schede citate da questo nucleo sono cucite qui sotto dal montaggio
   (assembla-nucleo.js): la pagina resta autosufficiente — niente fetch,
   niente sottocartelle da pubblicare — e un rimando a una scheda che non
   esiste FERMA la costruzione invece di arrivare in pagina rotto.
   Apertura: lo stesso gesto del collaudo (si clicca, il pannello compare,
   si typeset una volta sola), portato dentro la frase.
   =================================================================== */
var CORSO = 'elettromagnetismo';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};


function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';
  return h;
}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

  <p>Abbiamo quattro leggi. Tre sono definitive: Gauss per $\vec E$ (em-02), Gauss per $\vec B$ (em-08), Faraday (em-10). La quarta — Ampère — <b>è sbagliata</b>, e questo movimento la ripara.</p>
  <p>Il difetto non è un dettaglio tecnico: è una <b>contraddizione logica</b> con la conservazione della carica, e si vede in un esperimento elementare che abbiamo già incontrato — un condensatore in carica. Il termine che manca lo aggiunge Maxwell nel 1865, per pura coerenza, senza nessun esperimento che lo richiedesse.</p>
  <p><b>E da quel termine esce la luce.</b> Le equazioni corrette ammettono soluzioni ondulatorie che viaggiano a $1/\sqrt{\varepsilon_0\mu_0}$ — un numero costruito con due costanti misurate con bilance e magneti, che risulta uguale alla velocità della luce misurata dagli astronomi. <b>È il più grande momento di unificazione della fisica classica</b>, e succede in questo movimento.</p>`}

  {t:'prosa', title:'Lesperimento mentale che rompe la legge', tag:'first principles', html:R`
  <p>La legge di Ampère dice
  $$\oint_\gamma\vec B\cdot d\vec\ell=\mu_0I_{\text{conc}},$$
  dove $I_{\text{conc}}$ è la corrente che attraversa <b>una qualunque</b> superficie con bordo $\gamma$. Quel «qualunque» è essenziale: se il risultato dipendesse dalla superficie scelta, la legge non definirebbe niente.</p>
  <p><b>Ora si prenda un circuito che sta caricando un condensatore</b>, e come $\gamma$ una circonferenza attorno al filo:</p>
  <ul>
   <li>scegliendo come superficie un <b>disco</b> che taglia il filo: la corrente $i$ lo attraversa, e $\oint\vec B\cdot d\vec\ell=\mu_0i$;</li>
   <li>scegliendo una superficie a <b>sacchetto</b> che passa <i>fra le armature</i> del condensatore: <b>nessuna carica la attraversa</b>, e il conto dà zero.</li>
  </ul>
  <p>Due superfici con lo stesso bordo, due risultati diversi. <b>La legge di Ampère, così com&rsquo;è, è auto-contraddittoria</b> ogni volta che la corrente non è stazionaria.</p>
  <div class="note"><b>Non è un caso patologico costruito ad arte</b>, ed è importante capirlo. In em-07 lo avevamo già visto arrivare: $\nabla\cdot\vec J=0$ vale <i>solo</i> in regime stazionario, e la legge di Ampère nella forma di em-08 presuppone proprio quello — perché la divergenza di un rotore è identicamente nulla, quindi $\nabla\times\vec B=\mu_0\vec J$ implica $\nabla\cdot\vec J=0$ <b>sempre</b>. La legge non è approssimata: è incompatibile con la conservazione della carica appena qualcosa cambia nel tempo.</div>`}
]},

/* ---------------- 02 · LA CORRENTE DI SPOSTAMENTO ---------------- */
{ num:'02', title:'La corrente di spostamento: il termine dedotto, non misurato', meta:'la richiesta di coerenza · il conto sul condensatore · le due correnti che si passano il testimone',
  blocchi:[
  {t:'reveal', title:'Come si trova il termine mancante', tag:'costruzione', steps:[
   {label:'La richiesta', body:R`
   <p>Serve un termine $\vec J_d$ da aggiungere a $\vec J$ tale che $\nabla\cdot(\vec J+\vec J_d)=0$ <b>sempre</b>, anche fuori dallo stazionario. Dall&rsquo;equazione di continuità $\nabla\cdot\vec J=-\dfrac{\partial\rho}{\partial t}$, e da Gauss $\rho=\varepsilon_0\nabla\cdot\vec E$:
   $$\nabla\cdot\vec J=-\varepsilon_0\frac{\partial}{\partial t}(\nabla\cdot\vec E)=-\nabla\cdot\left(\varepsilon_0\frac{\partial\vec E}{\partial t}\right).$$
   Quindi il termine cercato è
   $$\vec J_d=\varepsilon_0\frac{\partial\vec E}{\partial t},$$
   la <b>corrente di spostamento</b>. <b>Non è stata misurata: è stata dedotta</b> dall&rsquo;obbligo che due leggi già note non si contraddicano.</p>`},
   {label:'La verifica sul condensatore', body:R`
   <p>Fra le armature il campo è $E=\dfrac{q}{\varepsilon_0A}$, quindi il flusso è $\Phi_E=\dfrac{q}{\varepsilon_0}$ e
   $$\varepsilon_0\frac{d\Phi_E}{dt}=\frac{dq}{dt}=i.$$
   <b>La corrente di spostamento fra le armature è esattamente uguale alla corrente di conduzione nel filo.</b> L&rsquo;ambiguità della tappa 01 sparisce: qualunque superficie si scelga, la somma «conduzione + spostamento» che la attraversa è la stessa. Il disco intercetta $i$ di conduzione; il sacchetto intercetta $i$ di spostamento.</p>`},
   {label:'Che cosa e davvero, e che cosa non e', body:R`
   <p><b>Non è una corrente</b>: non ci sono cariche che si muovono fra le armature (nel vuoto non c&rsquo;è nulla da muovere). È un <b>campo elettrico che varia</b>, e il contenuto fisico dell&rsquo;equazione è:
   $$\text{un campo elettrico variabile genera campo magnetico,}$$
   esattamente come un campo magnetico variabile genera campo elettrico (em-10). <b>Il nome «corrente» è storico</b> e viene dal modello meccanico dell&rsquo;etere che Maxwell usava; è rimasto anche dopo che il modello è caduto.</p>
   <p><b>Con questo termine la teoria si chiude su se stessa</b>: $\vec E$ che varia fa $\vec B$, $\vec B$ che varia fa $\vec E$. Non serve più nessuna carica per sostenere i campi, e questa è la porta da cui entrano le onde.</p>`}
  ]},
  {t:'plot', title:'Le due correnti durante la carica: il testimone che passa',
   intro:R`Carica di un condensatore attraverso una resistenza: corrente di conduzione nel filo e corrente di spostamento fra le armature, in unità $V_0/R$ e $\tau=1$.`,
   plots:[
    {kind:'func2d', xr:[0,4], yr:[0,1.15], height:330,
     title:'sono la stessa curva: dove finisce la conduzione comincia lo spostamento',
     xlabel:'t / tau', ylabel:'corrente',
     curves:[
      {f:'exp(-x)', col:'#5eead4', width:3.0, label:'conduzione nel filo'},
      {f:'exp(-x)', col:'#d8a13a', width:1.4, dash:true, label:'spostamento fra le armature'}
     ],
     segs:[{x1:0, y1:0, x2:4, y2:0, col:'#4d5a6b', width:1}],
     marks:[{x:1, y:0.3679, label:'coincidono a ogni istante', col:'#b98cff'}]}
   ],
   leggi:R`<b>Le due curve sono sovrapposte, e questo è tutto il punto</b>: la corrente di spostamento fra le armature vale istante per istante quanto quella di conduzione nel filo. Non è un&rsquo;approssimazione né una media su un periodo — è un&rsquo;identità, e discende direttamente dalla conservazione della carica.<br><br>
   <b>Il modo di guardarla che conviene portare all&rsquo;esame</b>: la corrente non si interrompe mai. Nel filo è fatta di elettroni che si spostano; fra le armature è fatta di un campo elettrico che cresce. <b>Il circuito è sempre chiuso</b>, anche quando fisicamente è interrotto da un condensatore — e questa è la ragione per cui in alternata «la corrente passa» attraverso un condensatore (em-10b) senza che nessuna carica lo attraversi davvero.`}
]},

/* ---------------- 03 · LE QUATTRO EQUAZIONI ---------------- */
{ num:'03', title:'Le quattro equazioni, in forma locale e integrale', meta:'il quadro completo · cosa dice ciascuna in una frase · la simmetria e dove si rompe',
  blocchi:[
  {t:'prosa', title:'Il quadro', tag:'sintesi', html:R`
  <p><b>Nel vuoto, in forma locale:</b></p>
  $$\nabla\cdot\vec E=\frac{\rho}{\varepsilon_0}\qquad\text{(1) le cariche sono sorgenti di }\vec E$$
  $$\nabla\cdot\vec B=0\qquad\text{(2) non ci sono cariche magnetiche}$$
  $$\nabla\times\vec E=-\frac{\partial\vec B}{\partial t}\qquad\text{(3) un }\vec B\text{ che varia genera }\vec E$$
  $$\nabla\times\vec B=\mu_0\vec J+\mu_0\varepsilon_0\frac{\partial\vec E}{\partial t}\qquad\text{(4) le correnti e un }\vec E\text{ che varia generano }\vec B$$
  <p>A queste va aggiunta la forza di Lorentz $\vec F=q(\vec E+\vec v\times\vec B)$, che è ciò che collega i campi al moto della materia: <b>le equazioni dicono come i campi nascono, Lorentz dice cosa fanno</b>. Insieme sono l&rsquo;intero elettromagnetismo classico — e stanno in cinque righe.</p>
  <p><b>La simmetria fra i due campi è quasi perfetta, e dove si rompe è interessante</b>: se esistessero cariche magnetiche, le equazioni (2) e (3) avrebbero i loro termini di sorgente e la simmetria sarebbe completa. Dirac mostrò nel 1931 che l&rsquo;esistenza di <i>un solo</i> monopolo magnetico nell&rsquo;universo spiegherebbe perché la carica elettrica è <b>quantizzata</b>. Non ne è mai stato trovato uno.</p>`},
  {t:'prosa', title:'Nei materiali, e perche si usano D e H', tag:'regola operativa', html:R`
  <p>Con la materia, le due equazioni con le sorgenti si riscrivono usando i campi «contabili» di em-05 ed em-09:
  $$\nabla\cdot\vec D=\rho_{\text{lib}},\qquad \nabla\times\vec H=\vec J_{\text{lib}}+\frac{\partial\vec D}{\partial t},$$
  mentre le altre due restano identiche — perché non contengono sorgenti. <b>È la forma che si usa in pratica</b>, ed è tutta la ragione per cui $\vec D$ e $\vec H$ sono stati introdotti: nelle equazioni compaiono solo le cariche e le correnti che controlliamo.</p>`}
]},

/* ---------------- 04 · LA LUCE ---------------- */
{ num:'04', title:'Il numero che era la luce', meta:'come si ricava lequazione delle onde · il calcolo di c da due costanti da laboratorio · cosa vuol dire',
  blocchi:[
  {t:'reveal', title:'Da quattro equazioni a unonda', tag:'costruzione', steps:[
   {label:'Il passaggio', body:R`
   <p>Nel vuoto ($\rho=0$, $\vec J=0$) si prende il rotore della (3) e si usa la (4):
   $$\nabla\times(\nabla\times\vec E)=-\frac{\partial}{\partial t}(\nabla\times\vec B)=-\mu_0\varepsilon_0\frac{\partial^{2}\vec E}{\partial t^{2}}.$$
   Con l&rsquo;identità $\nabla\times(\nabla\times\vec E)=\nabla(\nabla\cdot\vec E)-\nabla^{2}\vec E$ e la (1) con $\rho=0$, resta
   $$\nabla^{2}\vec E=\mu_0\varepsilon_0\frac{\partial^{2}\vec E}{\partial t^{2}}.$$
   <b>È l&rsquo;equazione di d&rsquo;Alembert</b> — la stessa delle onde su una corda, incontrata in Metodi (me-11) — con velocità di propagazione $v=1/\sqrt{\varepsilon_0\mu_0}$. Lo stesso conto fatto con $\vec B$ dà la stessa equazione.</p>`},
   {label:'Il numero', body:R`
   <p>$\varepsilon_0$ si misura con condensatori, $\mu_0$ con fili percorsi da corrente: <b>due esperimenti da tavolo, nessuno dei quali ha a che fare con la luce</b>. Mettendo i numeri:
   $$\frac{1}{\sqrt{\varepsilon_0\mu_0}}=2{,}998\times10^{8}\ \text{m/s},$$
   che è la velocità della luce misurata dagli astronomi con le lune di Giove e in laboratorio con le ruote dentate.</p>
   <p><b>La conclusione di Maxwell è una delle frasi più audaci della storia della fisica</b>: «difficilmente possiamo evitare la conclusione che la luce consista di ondulazioni trasversali dello stesso mezzo che è causa dei fenomeni elettrici e magnetici». <b>L&rsquo;ottica smette di essere una disciplina separata</b> e diventa un capitolo dell&rsquo;elettromagnetismo — ed è quello che studierai in em-13.</p>`},
   {label:'E la crepa che ne segue', body:R`
   <p>C&rsquo;è un dettaglio che all&rsquo;epoca sembrò un problema tecnico e non lo era: quelle equazioni dicono che la luce va a $c$, <b>ma rispetto a che cosa?</b> In meccanica newtoniana le velocità si sommano, quindi $c$ dovrebbe dipendere dal riferimento — e le equazioni di Maxwell, cambiate di riferimento con Galileo, <b>cambiano forma</b>.</p>
   <p>Per cinquant&rsquo;anni si cercò il mezzo di riferimento (l&rsquo;etere), senza trovarlo. La soluzione fu abbandonare le trasformazioni di Galileo, non le equazioni di Maxwell: <b>è la relatività ristretta</b>, ed è il contenuto di em-14. Queste quattro equazioni sono già relativistiche: lo erano vent&rsquo;anni prima che qualcuno se ne accorgesse.</p>`}
  ]}
]},

/* ---------------- 05 · IL SENSO ---------------- */
{ num:'05', title:'Il senso, e le rotte', meta:'cosa chiude, cosa apre, e il metodo di Maxwell come lezione',
  blocchi:[
  {t:'prosa', title:'Cosa lascia in mano', tag:'sintesi', html:R`
  <p><b>A monte.</b> Tutti i movimenti precedenti sono <b>casi particolari</b> di queste quattro equazioni: l&rsquo;elettrostatica è ciò che resta quando si annullano le derivate temporali, la magnetostatica quando le correnti sono stazionarie. Non c&rsquo;è niente da tenere a mente separatamente.</p>
  <p><b>Il punto, che è anche una lezione di metodo.</b> Maxwell non ha aggiunto quel termine perché un esperimento lo chiedesse: l&rsquo;ha aggiunto perché <b>due leggi che credeva vere si contraddicevano</b>. La coerenza matematica ha prodotto una previsione fisica — le onde — verificata vent&rsquo;anni dopo da Hertz. <b>È il modello di come funziona la fisica teorica</b>, ed è la ragione per cui vale la pena prendere sul serio un&rsquo;incoerenza anche quando «in pratica non dà fastidio».</p>
  <p><b>A valle.</b> em-12 risolve queste equazioni nel vuoto e studia le onde; em-13 ne deduce l&rsquo;ottica; em-14 mostra che erano relativistiche dall&rsquo;inizio.</p>`},
  {t:'prolessi', title:'Dove riappare questo movimento, nella fisica che farai',
   oggetto:R`<b>Le equazioni di Maxwell</b>: una teoria di campo chiusa, che si sostiene senza sorgenti.`,
   rotte:[
    {dove:'Relativita', txt:R`Scritte con il tensore $F^{\mu\nu}$ diventano <b>due</b> equazioni invece di quattro: $\partial_\mu F^{\mu\nu}=\mu_0J^\nu$ e l&rsquo;identità di Bianchi. La forma covariante rende manifesto ciò che em-14 dimostra: elettrico e magnetico sono componenti di un solo oggetto.`},
    {dove:'Teoria<br>dei campi', txt:R`Maxwell è la <b>teoria di gauge</b> più semplice: l&rsquo;invarianza $U(1)$ del potenziale determina la forma delle equazioni. Da lì, generalizzando il gruppo, nascono le interazioni deboli e forti — <b>tutto il Modello Standard è costruito su questo schema</b>.`},
    {dove:'Meccanica<br>quantistica', txt:R`Quantizzando il campo si ottengono i <b>fotoni</b>; l&rsquo;elettrodinamica quantistica che ne segue è la teoria fisica più accuratamente verificata che esista (momento magnetico dell&rsquo;elettrone, dodici cifre).`},
    {dove:'Numerica', txt:R`Risolvere queste quattro equazioni su un reticolo (metodo FDTD) è il pane della progettazione di antenne, fibre, circuiti ad alta frequenza e dispositivi fotonici: sono equazioni <b>che si integrano al calcolatore</b> ogni giorno, in ingegneria.`}
   ],
   domanda:R`Maxwell ha aggiunto un termine per coerenza, e ne è uscita la luce. <b>Domanda che porti avanti, ed è metodologica prima che fisica:</b> quante volte si può ripetere questa mossa? Dirac lo rifece nel 1928 — cercando un&rsquo;equazione quantistica compatibile con la relatività trovò l&rsquo;<b>antimateria</b>, che nessuno aveva chiesto; Pauli inventò il neutrino per salvare la conservazione dell&rsquo;energia. <b>Quando la coerenza formale di una teoria predice oggetti nuovi, sotto quali condizioni le si può credere?</b> Non c&rsquo;è una risposta generale, e la storia contiene sia successi clamorosi sia vicoli ciechi eleganti — ma sapere che la domanda esiste cambia il modo in cui si guarda una derivazione.`}
]}

];

var byId = {}; TAPPE.forEach(function(s){ byId[s.num]=s; });

var VKEY='pm-nucleoem-11-visited';
function loadSeen(){ try{ return new Set(JSON.parse(localStorage.getItem(VKEY)||'[]')); }catch(e){ return new Set(); } }
function saveSeen(s){ try{ localStorage.setItem(VKEY, JSON.stringify(Array.from(s))); }catch(e){} }
var SEEN = loadSeen();

function renderNav(active){
  var nav=document.getElementById('sidebar');
  nav.innerHTML='';
  var h=document.createElement('h2'); h.textContent='Nucleo em-11 · le tappe'; nav.appendChild(h);
  TAPPE.forEach(function(s){
    var b=document.createElement('button');
    b.className='navitem'+(active===s.num?' active':'')+(SEEN.has(s.num)?' seen':'');
    b.innerHTML='<span class="dot"></span><span class="nx">'+s.num+'</span><span>'+s.title+'</span>';
    b.onclick=function(){ showTappa(s.num); };
    nav.appendChild(b);
  });
}

/* ---- renderer dei blocchi ---- */
function sectionProsa(title, tag, html){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var body=elFromHTML('<div class="open-body">'+html+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function sectionGram(title, rows){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag gramtag">grammatica</span></h3>';
  var inner='<table class="gramtab">';
  rows.forEach(function(r){ inner+='<tr><td class="gs">'+r[0]+'</td><td>'+r[1]+'</td></tr>'; });
  inner+='</table>';
  var body=elFromHTML('<div class="gramwrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
/* --- blocco PLOT: la figura non decora, si legge. Ogni plot porta una chiave di lettura. --- */
function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';
  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
    else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
    else if(b.t==='prolessi') m.appendChild(sectionProlessi(b));
    else if(b.t==='reveal')m.appendChild(sectionReveal(b.title,b.tag,b.steps));
    else if(b.t==='esercizio') m.appendChild(sectionEsercizio(b));
    else if(b.t==='collaudo')  m.appendChild(sectionCollaudo(b.title,b.items));
    else if(b.t==='plot')      m.appendChild(sectionPlot(b));
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}
