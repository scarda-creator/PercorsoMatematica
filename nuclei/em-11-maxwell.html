<style>
  :root{
    --bg:#0e1117; --panel:#161b22; --panel2:#1c232d; --border:#2b333d;

  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);

  .navitem .dot{width:7px;height:7px;border-radius:50%;background:transparent;flex:0 0 7px;

  /* ---- MAIN ---- */
  .main{flex:1 1 auto;min-width:0;padding:24px 30px 90px;max-width:860px;}

  .sfhead{border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:8px;}

  .meta{color:var(--muted);font-size:.82rem;margin-top:6px;}

  .section{margin:26px 0;}
  .section > h3{font-size:1.02rem;color:var(--accent2);margin:0 0 10px;

  .section > h3 .tag{font-size:.66rem;font-weight:700;letter-spacing:.4px;background:var(--panel2);

  .plot-intro{color:var(--muted);font-size:.95rem;margin:0 0 12px;}
  .plot-row{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;

  .section > h3 .tag.gramtag{background:var(--grambg);border-color:#1f4d47;color:var(--gram);}

  /* ---- STRUMENTI (repertorio condiviso: la scheda si apre DENTRO la frase) ----
     Nessun accento nuovo: riusa il verde della grammatica, perche' uno strumento
     richiamato e' grammatica gia' spiegata altrove, non una quinta specie di blocco. */
  .str{color:var(--gram);border-bottom:1px dashed var(--gram);cursor:pointer;}
  .str:hover{background:var(--grambg);}
  .str::after{content:"\2666";font-size:.62em;vertical-align:.42em;margin-left:2px;opacity:.8;}
  .str.aperto::after{content:"\2715";}
  .str.rotto{color:#ff6b6b;border-bottom-color:#ff6b6b;cursor:help;}
  /* la scheda e' uno SPAN in display:block, non un div: i rimandi cadono dentro
     <p>, <li> e celle di tabella, dove un div e' HTML illegale. */
  .strcard{display:block;margin:10px 0;background:var(--grambg);border:1px solid #1f4d47;

  table.protab td.pd{white-space:nowrap;color:var(--pro);width:1%;font-weight:700;font-size:.78rem;

  .cq{margin-bottom:10px;}

  .prevnext{display:flex;justify-content:space-between;gap:12px;margin-top:40px;

  .pnbtn{flex:1 1 0;background:var(--panel);border:1px solid var(--border);border-radius:12px;

  .pnbtn:hover{border-color:var(--accent);background:var(--panel2);}
  .pnbtn.next{text-align:right;}
  .pnbtn .k{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}

  .pnbtn:disabled{opacity:.35;cursor:default;border-color:var(--border);background:var(--panel);}

  code{background:var(--panel2);border:1px solid var(--border);border-radius:5px;
    padding:1px 5px;font-size:.85em;color:var(--accent2);}
  .katex{font-size:1.02em;color:var(--txt);} .katex-display{margin:.5em 0;overflow-x:auto;overflow-y:hidden;}

  @media(max-width:860px){
    .shell{flex-direction:column;}
    .sidebar{width:100%;flex:none;position:static;max-height:none;border-right:none;

    .sidebar h2{width:100%;} .navitem{width:auto;}
    .main{padding:20px 16px 80px;}
  }
</style>

<script>
"use strict";
const R = String.raw;

function typeset(el){
  if(el && window.renderMathInElement){
    try{ renderMathInElement(el,{delimiters:[
      {left:'$$',right:'$$',display:true},
      {left:'$',right:'$',display:false}
    ],throwOnError:false}); }catch(e){}
  }
}
function elFromHTML(html){ var d=document.createElement('div'); d.innerHTML=html; return d; }

/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un
   rimando scritto nella prosa:

       <span class="str" data-str="serie-geometrica">la serie geometrica</span>

   Le schede citate da questo nucleo sono cucite qui sotto dal montaggio
   (assembla-nucleo.js): la pagina resta autosufficiente — niente fetch,
   niente sottocartelle da pubblicare — e un rimando a una scheda che non
   esiste FERMA la costruzione invece di arrivare in pagina rotto.
   Apertura: lo stesso gesto del collaudo (si clicca, il pannello compare,
   si typeset una volta sola), portato dentro la frase.
   =================================================================== */
var CORSO = 'elettromagnetismo';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["teorema-della-divergenza"] = {"nome":"Teorema della divergenza","riga":"Il flusso uscente da una superficie chiusa è l'integrale della divergenza sul volume che racchiude: $\\oint_{\\partial V}\\mathbf F\\cdot\\hat n\\,dS=\\int_V\\nabla\\cdot\\mathbf F\\,dV$.","serve":"Scambia una domanda sul bordo con una sul volume. A destra c'è la divergenza, che è la densità di sorgente punto per punto; a sinistra il totale che esce. Si usa nei due versi: per calcolare un flusso scomodo con un integrale di volume comodo, e — in fisica soprattutto — per passare da una legge integrale a una legge locale, perché se due integrali di volume coincidono per OGNI volume allora coincidono gli integrandi.","esempio":"Per $\\mathbf F=\\mathbf r=(x,y,z)$ la divergenza vale $3$, quindi sulla palla di raggio $R$ il membro destro è $3\\cdot\\tfrac43\\pi R^{3}=4\\pi R^{3}$; il membro sinistro, calcolato come flusso, è il modulo $R$ per l'area $4\\pi R^{2}$, e dà lo stesso numero.","pieno":{"file":"05-teoremi-integrali.html","tappa":"02","come":"l'enunciato, la dimostrazione a fette e le ipotesi vere sul dominio, nel nucleo dei teoremi integrali"},"qui":{"elettromagnetismo":{"serve":"È il passaggio che trasforma la legge di Gauss integrale nella prima equazione di Maxwell, $\\nabla\\cdot\\mathbf E=\\rho/\\varepsilon_0$, e la conservazione della carica nell'equazione di continuità $\\nabla\\cdot\\mathbf J+\\partial_t\\rho=0$. La mossa è sempre la stessa: si scrive la legge su un volume arbitrario, si porta il flusso dentro come integrale di divergenza, e si osserva che un integrale nullo su OGNI volume obbliga l'integrando a essere nullo. L'arbitrarietà del volume non è un dettaglio: è tutta la dimostrazione.","esempio":"Per il campo di una carica puntiforme, di modulo $\\dfrac{q}{4\\pi\\varepsilon_0r^{2}}$ e diretto radialmente, la divergenza è nulla ovunque tranne nell'origine: in coordinate sferiche la divergenza di un campo radiale si scrive con $\\partial_r\\!\\left(r^{2}E_r\\right)$, e qui $r^{2}E_r$ non dipende da $r$, quindi la derivata fa $0$. Tutta la carica è finita nel punto escluso, ed è esattamente il buco che la $\\delta$ di Dirac serve a riempire."}},"controllo":[{"tipo":"uguale","sinistra":"diff(x,x)+diff(y,y)+diff(z,z)","vale":"3","dove":"esempio","appare":"vale $3$"},{"tipo":"uguale","sinistra":"3*(4/3)*pi*R**3","vale":"4*pi*R**3","dove":"esempio","appare":"4\\pi R^{3}"},{"tipo":"derivata","espr":"r**2*(q/(4*pi*e0*r**2))","rispetto":["r"],"vale":"0","dove":"qui.elettromagnetismo.esempio","appare":"la derivata fa $0$"}]};
STRUM["rotore"] = {"nome":"Rotore","riga":"Il campo $\\nabla\\times\\mathbf F$, la cui componente lungo $\\hat n$ misura la circuitazione di $\\mathbf F$ per unità di area attorno a $\\hat n$.","serve":"È la girandola locale: dove il rotore è nullo, una paletta infinitesima immersa nel campo non gira. Da qui il criterio più usato — un campo con rotore nullo su un dominio semplicemente connesso è conservativo — e la doppia ipotesi non è pedanteria: su un dominio bucato il criterio salta, e il controesempio (il vortice attorno a un filo escluso) è proprio il caso che si incontra in fisica.","esempio":"Il vortice $\\mathbf F=(-y,x)$ ha rotore $\\partial_x(x)-\\partial_y(-y)=2$: gira davvero, ed è costante su tutto il piano. Il campo radiale $\\mathbf F=(x,y)$ ha invece rotore $\\partial_x(y)-\\partial_y(x)=0$: si allontana dall'origine senza ruotare, e infatti è il gradiente di $\\tfrac12(x^{2}+y^{2})$.","pieno":{"file":"04-campi-vettoriali.html","tappa":"03","come":"divergenza e rotore insieme, con le loro letture geometriche e il calcolo in componenti, nel nucleo sui campi vettoriali"},"qui":{"elettromagnetismo":{"serve":"Le due equazioni di Maxwell col rotore sono quelle che accoppiano i campi: $\\nabla\\times\\mathbf E=-\\partial_t\\mathbf B$ e $\\nabla\\times\\mathbf B=\\mu_0\\mathbf J+\\mu_0\\varepsilon_0\\partial_t\\mathbf E$. Il rotore nullo di $\\mathbf E$ in statica è ciò che autorizza a scrivere il potenziale; appena $\\mathbf B$ varia nel tempo quel rotore non è più nullo, e il potenziale scalare da solo smette di bastare. Il rotore è quindi il posto esatto in cui l'elettrostatica finisce.","esempio":"Che non possa esistere un potenziale scalare quando $\\mathbf B$ varia si vede dall'identità $\\nabla\\times(\\nabla V)$, che è nulla per ogni $V$: se $\\mathbf E$ fosse $-\\nabla V$ il suo rotore sarebbe zero, mentre Faraday lo vuole uguale a $-\\partial_t\\mathbf B$. Sul campione $V=xy$ il gradiente è $(y,x)$ e il conto è $\\partial_x(x)-\\partial_y(y)=0$, come per qualunque altro $V$."}},"controllo":[{"tipo":"uguale","sinistra":"diff(x,x)-diff(-y,y)","vale":"2","dove":"esempio","appare":"=2"},{"tipo":"uguale","sinistra":"diff(y,x)-diff(x,y)","vale":"0","dove":"esempio","appare":"=0"},{"tipo":"uguale","sinistra":"diff(diff(x*y,y),x)-diff(diff(x*y,x),y)","vale":"0","dove":"qui.elettromagnetismo.esempio","appare":"=0"}]};
STRUM["flusso-di-un-campo"] = {"nome":"Flusso di un campo","riga":"L'integrale $\\iint_S\\mathbf F\\cdot\\hat n\\,dS$: quanta parte del campo attraversa la superficie, contata col segno che l'orientazione stabilisce.","serve":"Traduce «quanto passa attraverso» in un numero, e il numero dipende da due scelte che vanno dichiarate entrambe: la superficie e il verso della normale. Su una superficie chiusa la convenzione è normale uscente, e allora un flusso positivo significa che dentro c'è una sorgente netta. Dove il campo è parallelo alla superficie il contributo è nullo: conta solo la componente normale, mai il modulo.","esempio":"Per il campo radiale $\\mathbf F=\\mathbf r$ sulla sfera di raggio $R$ la normale uscente è $\\hat r$, e la componente normale vale $R$ in ogni punto, costante: il flusso è quel valore per l'area, $\\Phi=R\\cdot4\\pi R^{2}=4\\pi R^{3}$. Per $R=2$ fa $32\\pi$.","pieno":{"file":"03-curve-superfici.html","tappa":"04","come":"la definizione, il ruolo dell'orientazione e l'indipendenza dalla parametrizzazione, nel nucleo su curve e superfici"},"qui":{"elettromagnetismo":{"serve":"Il flusso di $\\mathbf E$ attraverso una superficie chiusa è l'unica cosa che la legge di Gauss controlla: dice quanto esce in totale, non quanto vale $\\mathbf E$ punto per punto. Da un solo numero si risale al campo soltanto se si sa già in che direzione punta e da cosa dipende — e quello lo decide la simmetria della distribuzione, non il teorema. Per questo la superficie si sceglie: dove $\\mathbf E$ è costante e normale, il flusso diventa modulo per area.","esempio":"Per una carica puntiforme $q$ al centro di una sfera di raggio $R$ il campo ha modulo $\\dfrac{q}{4\\pi\\varepsilon_0R^{2}}$ ed è ovunque normale alla sfera, quindi $\\Phi=\\dfrac{q}{4\\pi\\varepsilon_0R^{2}}\\cdot4\\pi R^{2}=\\dfrac{q}{\\varepsilon_0}$: il raggio è sparito. È il motivo per cui la legge di Gauss è una legge e non un conto — vale per qualunque superficie chiusa che racchiuda la carica."}},"controllo":[{"tipo":"uguale","sinistra":"R*4*pi*R**2","vale":"4*pi*R**3","dove":"esempio","appare":"4\\pi R^{3}"},{"tipo":"uguale","sinistra":"4*pi*2**3","vale":"32*pi","dove":"esempio","appare":"32\\pi"},{"tipo":"uguale","sinistra":"q/(4*pi*e0*R**2)*4*pi*R**2","vale":"q/e0","dove":"qui.elettromagnetismo.esempio","appare":"\\dfrac{q}{\\varepsilon_0}"},{"tipo":"derivata","espr":"q/(4*pi*e0*R**2)*4*pi*R**2","rispetto":["R"],"vale":"0","dove":"qui.elettromagnetismo.esempio","appare":"il raggio è sparito"}]};

function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';
  return h;
}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];

/* ---------------- 00 · DI COSA PARLA QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Di cosa parla questo movimento', meta:'Elettromagnetismo · voce C.4 · il punto in cui il corso si chiude e ne comincia un altro',
  blocchi:[
  {t:'prosa', title:'Dove siamo arrivati, e cosa non torna', tag:'architettura', html:R`
  <p>Abbiamo quattro leggi. Tre sono definitive: Gauss per $\vec E$ (em-02), Gauss per $\vec B$ (em-08), Faraday (em-10). La quarta — Ampère — <b>è sbagliata</b>, e questo movimento la ripara.</p>
  <p>Il difetto non è un dettaglio tecnico: è una <b>contraddizione logica</b> con la conservazione della carica, e si vede in un esperimento elementare che abbiamo già incontrato — un condensatore in carica. Il termine che manca lo aggiunge Maxwell nel 1865, per pura coerenza, senza nessun esperimento che lo richiedesse.</p>
  <p><b>E da quel termine esce la luce.</b> Le equazioni corrette ammettono soluzioni ondulatorie che viaggiano a $1/\sqrt{\varepsilon_0\mu_0}$ — un numero costruito con due costanti misurate con bilance e magneti, che risulta uguale alla velocità della luce misurata dagli astronomi. <b>È il più grande momento di unificazione della fisica classica</b>, e succede in questo movimento.</p>`}
]},

/* ---------------- 01 · IL DIFETTO DI AMPÈRE ---------------- */
{ num:'01', title:'Il difetto di Ampere: due superfici, due risposte', meta:'il condensatore in carica · lambiguita della superficie · e perche non e un caso patologico',
  blocchi:[
  {t:'prosa', title:'Lesperimento mentale che rompe la legge', tag:'first principles', html:R`
  <p>La legge di Ampère dice
  $$\oint_\gamma\vec B\cdot d\vec\ell=\mu_0I_{\text{conc}},$$
  dove $I_{\text{conc}}$ è la corrente che attraversa <b>una qualunque</b> superficie con bordo $\gamma$. Quel «qualunque» è essenziale: se il risultato dipendesse dalla superficie scelta, la legge non definirebbe niente.</p>
  <p><b>Ora si prenda un circuito che sta caricando un condensatore</b>, e come $\gamma$ una circonferenza attorno al filo:</p>
  <ul>
   <li>scegliendo come superficie un <b>disco</b> che taglia il filo: la corrente $i$ lo attraversa, e $\oint\vec B\cdot d\vec\ell=\mu_0i$;</li>
   <li>scegliendo una superficie a <b>sacchetto</b> che passa <i>fra le armature</i> del condensatore: <b>nessuna carica la attraversa</b>, e il conto dà zero.</li>
  </ul>
  <p>Due superfici con lo stesso bordo, due risultati diversi. <b>La legge di Ampère, così com&rsquo;è, è auto-contraddittoria</b> ogni volta che la corrente non è stazionaria.</p>
  <div class="note"><b>Non è un caso patologico costruito ad arte</b>, ed è importante capirlo. In em-07 lo avevamo già visto arrivare: $\nabla\cdot\vec J=0$ vale <i>solo</i> in regime stazionario, e la legge di Ampère nella forma di em-08 presuppone proprio quello — perché la divergenza di un rotore è identicamente nulla, quindi $\nabla\times\vec B=\mu_0\vec J$ implica $\nabla\cdot\vec J=0$ <b>sempre</b>. La legge non è approssimata: è incompatibile con la conservazione della carica appena qualcosa cambia nel tempo.</div>`}
]},

/* ---------------- 02 · LA CORRENTE DI SPOSTAMENTO ---------------- */
{ num:'02', title:'La corrente di spostamento: il termine dedotto, non misurato', meta:'la richiesta di coerenza · il conto sul condensatore · le due correnti che si passano il testimone',
  blocchi:[
  {t:'reveal', title:'Come si trova il termine mancante', tag:'costruzione', steps:[
   {label:'La richiesta', body:R`
   <p>Serve un termine $\vec J_d$ da aggiungere a $\vec J$ tale che $\nabla\cdot(\vec J+\vec J_d)=0$ <b>sempre</b>, anche fuori dallo stazionario. Dall&rsquo;equazione di continuità $\nabla\cdot\vec J=-\dfrac{\partial\rho}{\partial t}$, e da Gauss $\rho=\varepsilon_0\nabla\cdot\vec E$:
   $$\nabla\cdot\vec J=-\varepsilon_0\frac{\partial}{\partial t}(\nabla\cdot\vec E)=-\nabla\cdot\left(\varepsilon_0\frac{\partial\vec E}{\partial t}\right).$$
   Quindi il termine cercato è
   $$\vec J_d=\varepsilon_0\frac{\partial\vec E}{\partial t},$$
   la <b>corrente di spostamento</b>. <b>Non è stata misurata: è stata dedotta</b> dall&rsquo;obbligo che due leggi già note non si contraddicano.</p>`},
   {label:'La verifica sul condensatore', body:R`
   <p>Fra le armature il campo è $E=\dfrac{q}{\varepsilon_0A}$, quindi il flusso è $\Phi_E=\dfrac{q}{\varepsilon_0}$ e
   $$\varepsilon_0\frac{d\Phi_E}{dt}=\frac{dq}{dt}=i.$$
   <b>La corrente di spostamento fra le armature è esattamente uguale alla corrente di conduzione nel filo.</b> L&rsquo;ambiguità della tappa 01 sparisce: qualunque superficie si scelga, la somma «conduzione + spostamento» che la attraversa è la stessa. Il disco intercetta $i$ di conduzione; il sacchetto intercetta $i$ di spostamento.</p>`},
   {label:'Che cosa e davvero, e che cosa non e', body:R`
   <p><b>Non è una corrente</b>: non ci sono cariche che si muovono fra le armature (nel vuoto non c&rsquo;è nulla da muovere). È un <b>campo elettrico che varia</b>, e il contenuto fisico dell&rsquo;equazione è:
   $$\text{un campo elettrico variabile genera campo magnetico,}$$
   esattamente come un campo magnetico variabile genera campo elettrico (em-10). <b>Il nome «corrente» è storico</b> e viene dal modello meccanico dell&rsquo;etere che Maxwell usava; è rimasto anche dopo che il modello è caduto.</p>
   <p><b>Con questo termine la teoria si chiude su se stessa</b>: $\vec E$ che varia fa $\vec B$, $\vec B$ che varia fa $\vec E$. Non serve più nessuna carica per sostenere i campi, e questa è la porta da cui entrano le onde.</p>`}
  ]},
  {t:'plot', title:'Le due correnti durante la carica: il testimone che passa',
   intro:R`Carica di un condensatore attraverso una resistenza: corrente di conduzione nel filo e corrente di spostamento fra le armature, in unità $V_0/R$ e $\tau=1$.`,
   plots:[
    {kind:'func2d', xr:[0,4], yr:[0,1.15], height:330,
     title:'sono la stessa curva: dove finisce la conduzione comincia lo spostamento',
     xlabel:'t / tau', ylabel:'corrente',
     curves:[
      {f:'exp(-x)', col:'#5eead4', width:3.0, label:'conduzione nel filo'},
      {f:'exp(-x)', col:'#d8a13a', width:1.4, dash:true, label:'spostamento fra le armature'}
     ],
     segs:[{x1:0, y1:0, x2:4, y2:0, col:'#4d5a6b', width:1}],
     marks:[{x:1, y:0.3679, label:'coincidono a ogni istante', col:'#b98cff'}]}
   ],
   leggi:R`<b>Le due curve sono sovrapposte, e questo è tutto il punto</b>: la corrente di spostamento fra le armature vale istante per istante quanto quella di conduzione nel filo. Non è un&rsquo;approssimazione né una media su un periodo — è un&rsquo;identità, e discende direttamente dalla conservazione della carica.<br><br>
   <b>Il modo di guardarla che conviene portare all&rsquo;esame</b>: la corrente non si interrompe mai. Nel filo è fatta di elettroni che si spostano; fra le armature è fatta di un campo elettrico che cresce. <b>Il circuito è sempre chiuso</b>, anche quando fisicamente è interrotto da un condensatore — e questa è la ragione per cui in alternata «la corrente passa» attraverso un condensatore (em-10b) senza che nessuna carica lo attraversi davvero.`}
]},

/* ---------------- 03 · LE QUATTRO EQUAZIONI ---------------- */
{ num:'03', title:'Le quattro equazioni, in forma locale e integrale', meta:'il quadro completo · cosa dice ciascuna in una frase · la simmetria e dove si rompe',
  blocchi:[
  {t:'prosa', title:'Il quadro', tag:'sintesi', html:R`
  <p><b>Nel vuoto, in forma locale:</b></p>
  $$\nabla\cdot\vec E=\frac{\rho}{\varepsilon_0}\qquad\text{(1) le cariche sono sorgenti di }\vec E$$
  $$\nabla\cdot\vec B=0\qquad\text{(2) non ci sono cariche magnetiche}$$
  $$\nabla\times\vec E=-\frac{\partial\vec B}{\partial t}\qquad\text{(3) un }\vec B\text{ che varia genera }\vec E$$
  $$\nabla\times\vec B=\mu_0\vec J+\mu_0\varepsilon_0\frac{\partial\vec E}{\partial t}\qquad\text{(4) le correnti e un }\vec E\text{ che varia generano }\vec B$$
  <p><b>Come si leggono, e perché sono esattamente quattro.</b> Un campo vettoriale in tre dimensioni è determinato — date le condizioni al contorno — da due sole informazioni: dove <i>nasce</i> e dove <i>ruota</i>. È il teorema di Helmholtz, ed è la ragione strutturale per cui c&rsquo;è una divergenza e un rotore per ciascun campo, e niente altro. Le (1) e (2) fissano le sorgenti con la <span class="str" data-str="teorema-della-divergenza">divergenza</span>: $\vec E$ nasce dalle cariche, $\vec B$ non nasce da niente. Le (3) e (4) fissano la vorticità con il <span class="str" data-str="rotore">rotore</span>, e la novità dell&rsquo;elettrodinamica sta tutta lì — <b>ciascuno dei due campi ruota attorno alla variazione dell&rsquo;altro</b>. In statica quei due termini sparivano e le equazioni si spezzavano in due teorie separate; con le derivate temporali diventano un sistema accoppiato, e un sistema accoppiato di questa forma ha soluzioni che si propagano.</p>
  <p>A queste va aggiunta la forza di Lorentz $\vec F=q(\vec E+\vec v\times\vec B)$, che è ciò che collega i campi al moto della materia: <b>le equazioni dicono come i campi nascono, Lorentz dice cosa fanno</b>. Insieme sono l&rsquo;intero elettromagnetismo classico — e stanno in cinque righe.</p>
  <p><b>La simmetria fra i due campi è quasi perfetta, e dove si rompe è interessante</b>: se esistessero cariche magnetiche, le equazioni (2) e (3) avrebbero i loro termini di sorgente e la simmetria sarebbe completa. Dirac mostrò nel 1931 che l&rsquo;esistenza di <i>un solo</i> monopolo magnetico nell&rsquo;universo spiegherebbe perché la carica elettrica è <b>quantizzata</b>. Non ne è mai stato trovato uno.</p>`},
  {t:'prosa', title:'Nei materiali, e perche si usano D e H', tag:'regola operativa', html:R`
  <p>Con la materia, le due equazioni con le sorgenti si riscrivono usando i campi «contabili» di em-05 ed em-09:
  $$\nabla\cdot\vec D=\rho_{\text{lib}},\qquad \nabla\times\vec H=\vec J_{\text{lib}}+\frac{\partial\vec D}{\partial t},$$
  mentre le altre due restano identiche — perché non contengono sorgenti. <b>È la forma che si usa in pratica</b>, ed è tutta la ragione per cui $\vec D$ e $\vec H$ sono stati introdotti: nelle equazioni compaiono solo le cariche e le correnti che controlliamo.</p>`}
]},

/* ---------------- 04 · LA LUCE ---------------- */
{ num:'04', title:'Il numero che era la luce', meta:'come si ricava lequazione delle onde · il calcolo di c da due costanti da laboratorio · cosa vuol dire',
  blocchi:[
  {t:'reveal', title:'Da quattro equazioni a unonda', tag:'costruzione', steps:[
   {label:'Il passaggio', body:R`
   <p>Nel vuoto ($\rho=0$, $\vec J=0$) si prende il rotore della (3) e si usa la (4):
   $$\nabla\times(\nabla\times\vec E)=-\frac{\partial}{\partial t}(\nabla\times\vec B)=-\mu_0\varepsilon_0\frac{\partial^{2}\vec E}{\partial t^{2}}.$$
   Con l&rsquo;identità $\nabla\times(\nabla\times\vec E)=\nabla(\nabla\cdot\vec E)-\nabla^{2}\vec E$ e la (1) con $\rho=0$, resta
   $$\nabla^{2}\vec E=\mu_0\varepsilon_0\frac{\partial^{2}\vec E}{\partial t^{2}}.$$
   <b>È l&rsquo;equazione di d&rsquo;Alembert</b> — la stessa delle onde su una corda, incontrata in Metodi (me-11) — con velocità di propagazione $v=1/\sqrt{\varepsilon_0\mu_0}$. Lo stesso conto fatto con $\vec B$ dà la stessa equazione.</p>`},
   {label:'Il numero', body:R`
   <p>$\varepsilon_0$ si misura con condensatori, $\mu_0$ con fili percorsi da corrente: <b>due esperimenti da tavolo, nessuno dei quali ha a che fare con la luce</b>. Mettendo i numeri:
   $$\frac{1}{\sqrt{\varepsilon_0\mu_0}}=2{,}998\times10^{8}\ \text{m/s},$$
   che è la velocità della luce misurata dagli astronomi con le lune di Giove e in laboratorio con le ruote dentate.</p>
   <p><b>La conclusione di Maxwell è una delle frasi più audaci della storia della fisica</b>: «difficilmente possiamo evitare la conclusione che la luce consista di ondulazioni trasversali dello stesso mezzo che è causa dei fenomeni elettrici e magnetici». <b>L&rsquo;ottica smette di essere una disciplina separata</b> e diventa un capitolo dell&rsquo;elettromagnetismo — ed è quello che studierai in em-13.</p>`},
   {label:'E la crepa che ne segue', body:R`
   <p>C&rsquo;è un dettaglio che all&rsquo;epoca sembrò un problema tecnico e non lo era: quelle equazioni dicono che la luce va a $c$, <b>ma rispetto a che cosa?</b> In meccanica newtoniana le velocità si sommano, quindi $c$ dovrebbe dipendere dal riferimento — e le equazioni di Maxwell, cambiate di riferimento con Galileo, <b>cambiano forma</b>.</p>
   <p>Per cinquant&rsquo;anni si cercò il mezzo di riferimento (l&rsquo;etere), senza trovarlo. La soluzione fu abbandonare le trasformazioni di Galileo, non le equazioni di Maxwell: <b>è la relatività ristretta</b>, ed è il contenuto di em-14. Queste quattro equazioni sono già relativistiche: lo erano vent&rsquo;anni prima che qualcuno se ne accorgesse.</p>`}
  ]}
]},

/* ---------------- 04a · ESERCIZI ---------------- */
{ num:'04a', title:'Esercizi — tocca a te', meta:'il condensatore in carica visto con Ampere-Maxwell · il campo magnetico dentro un condensatore',
  blocchi:[
  {t:'esercizio', title:'1 · Il campo magnetico dentro un condensatore che si carica',
   src:'il conto che rende tangibile la corrente di spostamento',
   testo:R`Un condensatore piano circolare di raggio $R$ viene caricato con corrente costante $I$. Trova il campo magnetico $B(r)$ nello spazio fra le armature, dentro e fuori il raggio $R$, e confronta con quello di un filo percorso dalla stessa corrente.`,
   steps:[
    {label:'Dentro il condensatore', body:R`
    <p>Fra le armature non c'è corrente di conduzione, ma il campo elettrico cresce: $E=\dfrac{\sigma}{\varepsilon_0}=\dfrac{q}{\varepsilon_0\pi R^{2}}$, quindi $\dfrac{dE}{dt}=\dfrac{I}{\varepsilon_0\pi R^{2}}$, uniforme su tutta l'area.</p>
    <p>Applicando Ampère-Maxwell a una circonferenza di raggio $r<R$, il flusso del termine di spostamento attraverso il disco è proporzionale all'area:</p>
    $$B\cdot 2\pi r=\mu_0\varepsilon_0\frac{dE}{dt}\pi r^{2}=\mu_0 I\frac{r^{2}}{R^{2}}\quad\Longrightarrow\quad B=\frac{\mu_0 I r}{2\pi R^{2}}.$$
    <p><b>Cresce linearmente con $r$</b>, esattamente come dentro un filo cilindrico percorso da corrente uniforme. Non è un caso: in entrambi i casi la «corrente» racchiusa cresce come $r^{2}$ mentre il cammino cresce come $r$.</p>`},
    {label:'Fuori, e il confronto', body:R`
    <p>Per $r>R$ tutto il flusso di spostamento è già racchiuso, e resta</p>
    $$B=\frac{\mu_0 I}{2\pi r},$$
    <p><b>identico al campo di un filo</b> percorso dalla stessa corrente. Dall'esterno il condensatore in carica è indistinguibile da un tratto di filo: il campo magnetico non si accorge che il circuito è interrotto.</p>
    <p><b>È il senso preciso in cui la corrente di spostamento «chiude» il circuito.</b> E si può stimare quanto valga: con $I=1$ A e $R=5$ cm, a $r=R$ si ha $B=\dfrac{4\pi\cdot10^{-7}\cdot1}{2\pi\cdot0{,}05}=4\cdot10^{-6}$ T, cioè quattro microtesla — un decimo del campo terrestre. <b>Misurabile, e infatti misurato</b>: non è un artificio contabile ma un campo che esiste.</p>`}
   ]},
  {t:'plot', title:'Il campo magnetico dentro e fuori il condensatore in carica',
   intro:R`$B(r)$ in unità di $\mu_0I/(2\pi R)$, con $R$ il raggio delle armature. La curva è identica a quella di un filo cilindrico percorso da corrente uniforme — e non è una somiglianza, è lo stesso conto.`,
   plots:[
    {kind:'func2d', xr:[0,4], yr:[0,1.15], height:320,
     title:'lineare dentro, 1/r fuori: il condensatore si comporta come un filo',
     xlabel:'r / R', ylabel:'B in unita di mu0 I / (2 pi R)',
     curves:[{f:'x<1 ? x : 1/x', col:'#5eead4', width:2.8, label:'B(r)'}],
     segs:[{x1:1, y1:0, x2:1, y2:1.1, col:'#ff6b6b', dash:true, width:1.4, label:'bordo delle armature', lx:1.05, ly:1.1}],
     marks:[{x:1, y:1, label:'massimo sul bordo', col:'#d8a13a', up:true, left:true}]}
   ],
   leggi:R`<p><b>Il massimo sta esattamente sul bordo delle armature</b>, e vale $\mu_0I/(2\pi R)$: lo stesso valore che si misurerebbe alla stessa distanza da un filo percorso da $I$. Da lì in poi le due situazioni sono <i>indistinguibili</i>, e questo è il contenuto operativo della corrente di spostamento — dall'esterno, un circuito con un condensatore e uno senza producono lo stesso campo magnetico.</p>
   <p>Dentro, la crescita lineare dice che il campo «vede» solo la frazione di corrente di spostamento racchiusa dal cammino, e quella frazione va come $r^{2}/R^{2}$ perché $dE/dt$ è uniforme sull'area. <b>Chi ha già fatto il filo spesso riconosce la curva</b>, e riconoscerla è il punto: due problemi fisicamente diversissimi — cariche che scorrono nel rame, campo elettrico che cresce nel vuoto — danno la stessa figura perché la struttura matematica è la stessa.</p>`},
  {t:'prosa', title:'Le quattro equazioni nella materia, e perche cambiano forma', tag:'sintesi', html:R`
  <p>Le quattro equazioni scritte finora valgono <b>sempre</b>, purché $\rho$ e $\vec J$ contino <i>tutte</i> le cariche e le correnti — comprese quelle di polarizzazione e quelle amperiane, che non si controllano. Dentro un materiale quella scrittura è corretta e inutilizzabile, per la stessa ragione già incontrata con i dielettrici: le sorgenti ignote dipendono dal campo che si vuole calcolare.</p>
  <p>Il rimedio è lo stesso, applicato due volte: si spostano le sorgenti ignote dall&rsquo;altra parte dell&rsquo;uguale, definendo $\vec D=\varepsilon_0\vec E+\vec P$ e $\vec H=\vec B/\mu_0-\vec M$. Le quattro equazioni diventano</p>
  $$\nabla\cdot\vec D=\rho_{\text{lib}},\qquad \nabla\cdot\vec B=0,$$
  $$\nabla\times\vec E=-\frac{\partial\vec B}{\partial t},\qquad \nabla\times\vec H=\vec J_{\text{lib}}+\frac{\partial\vec D}{\partial t}.$$
  <p><b>Tre osservazioni che vale la pena fissare.</b> Primo: le due equazioni omogenee <i>non cambiano</i>, perché non hanno sorgenti da nascondere — $\vec E$ e $\vec B$ restano i campi fondamentali, quelli che compaiono nella forza di Lorentz. Secondo: la corrente di spostamento nella materia è $\partial\vec D/\partial t$, che contiene anche il termine $\partial\vec P/\partial t$ — e <b>quello sì che è una corrente di cariche vere</b>, le cariche di polarizzazione che oscillano. Terzo: il sistema <b>non è chiuso</b> finché non si aggiungono le relazioni costitutive $\vec D=\varepsilon\vec E$ e $\vec B=\mu\vec H$, che non sono leggi fisiche fondamentali ma descrizioni del materiale, valide finché è lineare.</p>
  <p><b>La conseguenza che conta per il seguito</b>: ripetendo dentro un mezzo lineare il conto che nel vuoto dà l&rsquo;equazione d&rsquo;onda, si ottiene la stessa equazione con $\varepsilon\mu$ al posto di $\varepsilon_0\mu_0$. La velocità di propagazione diventa $v=1/\sqrt{\varepsilon\mu}$, minore di $c$, e il rapporto $n=c/v=\sqrt{\varepsilon_r\mu_r}$ è <b>l&rsquo;indice di rifrazione</b>. L&rsquo;ottica, a questo punto, non è un capitolo nuovo: è l&rsquo;elettromagnetismo in un materiale, e i due movimenti che seguono non fanno altro che sviluppare questa frase.</p>`},
  {t:'prosa', title:'Le quattro condizioni al contorno, dedotte tutte insieme', tag:'metodo', html:R`
  <p>Ogni equazione di Maxwell, applicata a una superficie di separazione fra due mezzi, produce una condizione di raccordo. Le quattro si ricavano con due sole costruzioni geometriche, e conviene vederle insieme perché sono lo strumento con cui si risolve qualunque problema di riflessione, rifrazione o schermatura.</p>
  <p><b>Costruzione uno: il cilindretto schiacciato</b>, con le basi parallele alla superficie e l&rsquo;altezza che tende a zero. Applicato alle due equazioni con la divergenza, il <span class="str" data-str="flusso-di-un-campo">flusso</span> laterale svanisce e restano le due basi:</p>
  $$D_{2\perp}-D_{1\perp}=\sigma_{\text{lib}},\qquad B_{2\perp}=B_{1\perp}.$$
  <p><b>Costruzione due: il rettangolino schiacciato</b>, con i lati lunghi paralleli alla superficie. Applicato alle due equazioni con il rotore — cioè alle circuitazioni — i lati corti non contribuiscono e restano i due lunghi:</p>
  $$E_{2\parallel}=E_{1\parallel},\qquad H_{2\parallel}-H_{1\parallel}=K_{\text{lib}}.$$
  <p><b>Lo schema è sempre lo stesso e vale la pena impararlo come schema</b>, non come quattro formule: le equazioni con la <i>divergenza</i> danno condizioni sulle componenti <b>perpendicolari</b>, quelle con il <i>rotore</i> sulle componenti <b>parallele</b>. E i salti compaiono solo dove ci sono sorgenti concentrate sulla superficie — una densità superficiale di carica libera, una corrente superficiale libera. In assenza di quelle, <b>tutte e quattro le grandezze si raccordano con continuità</b>.</p>
  <p>Nel caso statico queste condizioni erano già comparse due alla volta, separatamente per i dielettrici e per i materiali magnetici. Qui si vede che erano quattro facce della stessa costruzione, e che valgono <i>anche con i campi variabili</i> — il che è esattamente ciò che serve per trattare un&rsquo;onda che incide su una superficie. <b>Non sono un&rsquo;appendice del corso: sono il meccanismo per cui la luce si riflette.</b></p>`},
  {t:'collaudo', title:'Controlla di aver capito', html:R`
  <ol>
  <li>Se la corrente di spostamento non fosse stata aggiunta, quale delle quattro equazioni sarebbe incompatibile con la conservazione della carica?</li>
  <li>Il termine $\varepsilon_0\partial\vec E/\partial t$ è una corrente vera? Ci sono cariche che si muovono?</li>
  <li>Perché la simmetria fra le quattro equazioni è imperfetta?</li>
  </ol>`,
   sol:R`<ol>
   <li>La legge di <b>Ampère</b>. Prendendo la divergenza di $\nabla\times\vec B=\mu_0\vec J$ si ottiene $0=\mu_0\nabla\cdot\vec J$, cioè $\nabla\cdot\vec J=0$ sempre — che è vero solo in regime stazionario. Con il termine di Maxwell si ottiene invece $\nabla\cdot\vec J+\partial\rho/\partial t=0$, l'equazione di continuità. <b>Il termine non è stato aggiunto per far tornare un esperimento: è stato dedotto da una richiesta di coerenza matematica</b>, e questo è ciò che rende la storia di Maxwell diversa da tutte le altre di questo corso.</li>
   <li><b>No, e il nome è la cosa peggiore di tutta questa storia.</b> Nel vuoto fra le armature non c'è nessuna carica in moto, e nessun mezzo che si sposta. È un campo elettrico che varia, e il nome «corrente» è storico — deriva dal modello meccanico dell'etere con cui Maxwell arrivò al risultato. <b>Il nome è fuorviante e il termine è reale</b>: produce campo magnetico come una corrente vera, e il conto dell'esercizio qui sopra lo mostra quantitativamente.</li>
   <li>Perché manca il monopolo magnetico. Con esso le equazioni avrebbero una sorgente scalare e una vettoriale ciascuna, e sarebbero perfettamente simmetriche sotto lo scambio $\vec E\leftrightarrow c\vec B$. <b>L'asimmetria non è formale ma sperimentale</b>: nessuno ha mai osservato una carica magnetica, e i limiti sperimentali sono severissimi. Dirac mostrò che l'esistenza di un solo monopolo in tutto l'universo spiegherebbe perché la carica elettrica è quantizzata — un argomento che lega due fatti apparentemente scollegati, e il motivo per cui li si cerca ancora — nei raggi cosmici, nei materiali magnetici esotici e nei dati degli acceleratori, finora senza successo.</li>
   </ol>`}
]},

/* ---------------- 04b · I POTENZIALI, E LA LIBERTA DI GAUGE ---------------- */
{ num:'04b', title:'Quattro equazioni diventano due: i potenziali e il gauge', meta:'A e V al posto di E e B · le due equazioni omogenee diventano identita · la scelta di Lorenz · lequazione donda per i potenziali',
  blocchi:[
  {t:'prosa', title:'Perche conviene cambiare incognite', tag:'idea', html:R`
  <p>Le quattro equazioni hanno sei incognite — le componenti di $\vec E$ e $\vec B$ — legate fra loro. C&rsquo;è un modo di ridurle, e nasce dall&rsquo;osservare che <b>due delle quattro non contengono sorgenti</b>: $\nabla\cdot\vec B=0$ e la legge di Faraday. Quelle due non dicono come i campi sono prodotti, dicono <i>che forma possono avere</i> — e una condizione sulla forma si soddisfa meglio con una scrittura adatta che con un&rsquo;equazione da risolvere.</p>
  <p>Da $\nabla\cdot\vec B=0$ segue che $\vec B$ è un rotore: $\vec B=\nabla\times\vec A$. Sostituendo in Faraday,</p>
  $$\nabla\times\vec E=-\frac{\partial}{\partial t}(\nabla\times\vec A)\quad\Longrightarrow\quad \nabla\times\left(\vec E+\frac{\partial\vec A}{\partial t}\right)=0,$$
  <p>e un campo a rotore nullo è un gradiente: $\vec E+\dfrac{\partial\vec A}{\partial t}=-\nabla V$, cioè</p>
  $$\vec E=-\nabla V-\frac{\partial\vec A}{\partial t}.$$
  <p><b>Le due equazioni omogenee sono ora soddisfatte identicamente</b>, per costruzione: qualunque $V$ e $\vec A$ si scelgano, i campi che ne derivano le rispettano. Restano da imporre solo le altre due, e le incognite sono scese da sei a quattro. <b>Il termine $-\partial\vec A/\partial t$ è la novità</b>: è il campo elettrico indotto, quello non conservativo, e la sua comparsa qui spiega perché nel caso statico il potenziale scalare bastava.</p>`},
  {t:'prosa', title:'La liberta di gauge, e come si usa', tag:'struttura', html:R`
  <p>I potenziali non sono unici. La trasformazione</p>
  $$\vec A\to\vec A+\nabla\chi,\qquad V\to V-\frac{\partial\chi}{\partial t}$$
  <p>lascia $\vec E$ e $\vec B$ <b>identici</b>, per qualunque funzione $\chi(\vec r,t)$: nel primo caso perché il rotore di un gradiente è nullo, nel secondo perché i due termini aggiunti si cancellano. <b>È la stessa libertà vista in magnetostatica, estesa al caso dipendente dal tempo</b> — e ora coinvolge anche il potenziale scalare, che quindi non ha più il significato di «energia per unità di carica» se non a gauge fissato.</p>
  <p>Si sfrutta imponendo una condizione che semplifichi le equazioni. La scelta che rende manifesta la struttura relativistica è il <b>gauge di Lorenz</b>,</p>
  $$\nabla\cdot\vec A+\frac{1}{c^{2}}\frac{\partial V}{\partial t}=0,$$
  <p>con la quale le due equazioni con sorgente diventano <b>simmetriche e disaccoppiate</b>:</p>
  $$\Box V=\frac{\rho}{\varepsilon_0},\qquad \Box\vec A=\mu_0\vec J,\qquad \Box=\nabla^{2}-\frac{1}{c^{2}}\frac{\partial^{2}}{\partial t^{2}}.$$
  <p><b>Sono quattro equazioni d&rsquo;onda identiche</b>, una per ciascun potenziale, ciascuna con la propria sorgente. Tutto l&rsquo;elettromagnetismo è contenuto lì dentro, e la forma è la più semplice che assuma in qualunque scrittura: un operatore d&rsquo;onda uguale a una sorgente.</p>
  <div class="note"><b>Due cose che questa scrittura rende evidenti e che nelle quattro equazioni erano nascoste.</b> La prima: i potenziali si propagano a velocità $c$ come i campi, con un <i>ritardo</i> — la soluzione è l&rsquo;integrale sulle sorgenti valutate al tempo $t-|\vec r-\vec r'|/c$, i cosiddetti potenziali ritardati, ed è la forma precisa in cui «niente viaggia più veloce della luce» entra nell&rsquo;elettromagnetismo. La seconda: $(V/c,\vec A)$ si trasforma come un quadrivettore e $\Box$ è invariante, quindi la scrittura è già relativistica senza che si sia fatto nulla per renderla tale. <b>Il gauge di Lorenz non è una scelta fra tante: è quella che non rompe la simmetria che c&rsquo;era già.</b></div>`},
  {t:'prosa', title:'Perche la liberta di gauge e piu di una comodita', tag:'struttura', html:R`
  <p>Vale la pena chiudere il movimento su questo punto, perché è quello che collega l&rsquo;elettromagnetismo a tutto il resto della fisica del Novecento.</p>
  <p>Finora il gauge è apparso come una seccatura utile: i potenziali non sono unici, quindi si sceglie la versione comoda. Ma si può rovesciare il ragionamento e <b>partire dalla libertà per dedurre la teoria</b>. Si chiede che la descrizione sia invariante sotto una trasformazione locale — una che si può fare in modo diverso in ogni punto dello spazio e del tempo — e si scopre che quell&rsquo;invarianza <i>obbliga</i> a introdurre un campo che si trasformi come $\vec A\to\vec A+\nabla\chi$. <b>Il campo elettromagnetico non è più un dato sperimentale da descrivere: è ciò che deve esistere perché una simmetria valga localmente.</b></p>
  <p>Questa è la logica con cui si costruiscono tutte le teorie fondamentali attuali. Cambiando il gruppo di simmetria — da quello abeliano dell&rsquo;elettromagnetismo a gruppi non commutativi — si ottengono l&rsquo;interazione debole e quella forte, con la stessa struttura e con campi di gauge che questa volta interagiscono anche fra loro. <b>Il conto fatto qui sopra, in un corso di elettromagnetismo classico, è il prototipo di quella costruzione</b>, e la parola «gauge» che compare in tutta la fisica delle particelle viene esattamente da questa libertà nella scelta di $\chi$.</p>
  <p>C&rsquo;è anche una conseguenza immediata e concreta, che si incontra appena si fa meccanica quantistica: nell&rsquo;hamiltoniana di una particella carica compare $\vec p-q\vec A$, non il campo. <b>La teoria quantistica è scritta nei potenziali</b>, non nei campi — e poiché i potenziali non sono unici, la funzione d&rsquo;onda deve cambiare fase quando si cambia gauge, in modo che tutto ciò che si misura resti identico. Quella richiesta di coerenza, presa sul serio, è l&rsquo;origine dell&rsquo;intera struttura.</p>`}
]},

/* ---------------- 05 · IL SENSO ---------------- */
{ num:'05', title:'Il senso, e le rotte', meta:'cosa chiude, cosa apre, e il metodo di Maxwell come lezione',
  blocchi:[
  {t:'prosa', title:'Cosa lascia in mano', tag:'sintesi', html:R`
  <p><b>A monte.</b> Tutti i movimenti precedenti sono <b>casi particolari</b> di queste quattro equazioni: l&rsquo;elettrostatica è ciò che resta quando si annullano le derivate temporali, la magnetostatica quando le correnti sono stazionarie. Non c&rsquo;è niente da tenere a mente separatamente.</p>
  <p><b>Il punto, che è anche una lezione di metodo.</b> Maxwell non ha aggiunto quel termine perché un esperimento lo chiedesse: l&rsquo;ha aggiunto perché <b>due leggi che credeva vere si contraddicevano</b>. La coerenza matematica ha prodotto una previsione fisica — le onde — verificata vent&rsquo;anni dopo da Hertz. <b>È il modello di come funziona la fisica teorica</b>, ed è la ragione per cui vale la pena prendere sul serio un&rsquo;incoerenza anche quando «in pratica non dà fastidio».</p>
  <p><b>A valle.</b> em-12 risolve queste equazioni nel vuoto e studia le onde; em-13 ne deduce l&rsquo;ottica; em-14 mostra che erano relativistiche dall&rsquo;inizio.</p>`},
  {t:'prolessi', title:'Dove riappare questo movimento, nella fisica che farai',
   oggetto:R`<b>Le equazioni di Maxwell</b>: una teoria di campo chiusa, che si sostiene senza sorgenti.`,
   rotte:[
    {dove:'Relativita', txt:R`Scritte con il tensore $F^{\mu\nu}$ diventano <b>due</b> equazioni invece di quattro: $\partial_\mu F^{\mu\nu}=\mu_0J^\nu$ e l&rsquo;identità di Bianchi. La forma covariante rende manifesto ciò che em-14 dimostra: elettrico e magnetico sono componenti di un solo oggetto.`},
    {dove:'Teoria<br>dei campi', txt:R`Maxwell è la <b>teoria di gauge</b> più semplice: l&rsquo;invarianza $U(1)$ del potenziale determina la forma delle equazioni. Da lì, generalizzando il gruppo, nascono le interazioni deboli e forti — <b>tutto il Modello Standard è costruito su questo schema</b>.`},
    {dove:'Meccanica<br>quantistica', txt:R`Quantizzando il campo si ottengono i <b>fotoni</b>; l&rsquo;elettrodinamica quantistica che ne segue è la teoria fisica più accuratamente verificata che esista (momento magnetico dell&rsquo;elettrone, dodici cifre).`},
    {dove:'Numerica', txt:R`Risolvere queste quattro equazioni su un reticolo (metodo FDTD) è il pane della progettazione di antenne, fibre, circuiti ad alta frequenza e dispositivi fotonici: sono equazioni <b>che si integrano al calcolatore</b> ogni giorno, in ingegneria.`}
   ],
   domanda:R`Maxwell ha aggiunto un termine per coerenza, e ne è uscita la luce. <b>Domanda che porti avanti, ed è metodologica prima che fisica:</b> quante volte si può ripetere questa mossa? Dirac lo rifece nel 1928 — cercando un&rsquo;equazione quantistica compatibile con la relatività trovò l&rsquo;<b>antimateria</b>, che nessuno aveva chiesto; Pauli inventò il neutrino per salvare la conservazione dell&rsquo;energia. <b>Quando la coerenza formale di una teoria predice oggetti nuovi, sotto quali condizioni le si può credere?</b> Non c&rsquo;è una risposta generale, e la storia contiene sia successi clamorosi sia vicoli ciechi eleganti — ma sapere che la domanda esiste cambia il modo in cui si guarda una derivazione.`}
]}

];

function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';
  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
    else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
    else if(b.t==='prolessi') m.appendChild(sectionProlessi(b));
    else if(b.t==='reveal')m.appendChild(sectionReveal(b.title,b.tag,b.steps));
    else if(b.t==='esercizio') m.appendChild(sectionEsercizio(b));
    else if(b.t==='collaudo')  m.appendChild(sectionCollaudo(b.title,b.items));
    else if(b.t==='plot')      m.appendChild(sectionPlot(b));
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}

/* deep-link: em-11-maxwell.html#03 apre direttamente la tappa 03 */
window.addEventListener('DOMContentLoaded', function(){
  var h=(location.hash||'').replace('#','');
  showTappa(byId[h]?h:'00');
});
window.addEventListener('hashchange', function(){
  var h=(location.hash||'').replace('#','');
  if(byId[h]) showTappa(h);
});
</script>
