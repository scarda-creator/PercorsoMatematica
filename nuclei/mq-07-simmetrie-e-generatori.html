<style>
  :root{
    --bg:#0e1117; --panel:#161b22; --panel2:#1c232d; --border:#2b333d;
    --txt:#eef3f8; --muted:#b9c4d1; --accent:#4c8dff; --accent2:#8fb0ff;
    --ok:#2ea043; --okbg:#10331b; --warn:#d8a13a; --warnbg:#332a10;
    --gram:#5eead4; --grambg:#0f2a26;
    --pro:#b98cff; --probg:#1a1430; --proline:#2a2247; --proedge:#3a2d5c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    font-size:17px;line-height:1.55;}
  a{color:var(--accent2);}
  .banner{background:var(--panel2);border-bottom:1px solid var(--border);color:var(--muted);
    font-size:.8rem;font-weight:600;text-align:center;padding:8px 12px;letter-spacing:.3px;}
  .banner b{color:var(--accent2);}
  .shell{display:flex;max-width:1180px;margin:0 auto;align-items:flex-start;}

  /* ---- SIDEBAR ---- */
  .sidebar{width:280px;flex:0 0 280px;padding:20px 12px 60px;position:sticky;top:0;
    max-height:100vh;overflow-y:auto;border-right:1px solid var(--border);}
  .sidebar h2{font-size:.72rem;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);
    margin:18px 8px 8px;}
  .navitem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:none;
    background:transparent;color:var(--txt);padding:9px 10px;border-radius:8px;cursor:pointer;
    font-size:.9rem;transition:.12s;border:1px solid transparent;}
  .navitem:hover{background:var(--panel2);}
  .navitem.active{background:#13233f;border-color:var(--accent);color:#fff;}
  .navitem .dot{width:7px;height:7px;border-radius:50%;background:transparent;flex:0 0 7px;
    border:1px solid var(--border);}
  .navitem.seen .dot{background:var(--ok);border-color:var(--ok);}
  .navitem .nx{color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto;}

  /* ---- MAIN ---- */
  .main{flex:1 1 auto;min-width:0;padding:24px 30px 90px;max-width:860px;}
  h1{font-size:1.5rem;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:.92rem;margin:0 0 18px;}
  .sfhead{border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:8px;}
  .sfhead h1{font-size:1.55rem;}
  .meta{color:var(--muted);font-size:.82rem;margin-top:6px;}

  .section{margin:26px 0;}
  .section > h3{font-size:1.02rem;color:var(--accent2);margin:0 0 10px;
    display:flex;align-items:center;gap:10px;}
  .section > h3 .tag{font-size:.66rem;font-weight:700;letter-spacing:.4px;background:var(--panel2);
    border:1px solid var(--border);color:var(--muted);padding:2px 8px;border-radius:20px;
    text-transform:uppercase;}
  /* --- blocchi figura --- */
  .section > h3 .tag.plottag{background:#101f2e;border-color:#1f3c57;color:#7ab8e0;}
  .plot-intro{color:var(--muted);font-size:.95rem;margin:0 0 12px;}
  .plot-row{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;
    background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;}
  .plot-row.due .plot-box{flex:1 1 300px;min-width:280px;}
  .plot-box{max-width:560px;}
  .plot-leggi{margin-top:10px;background:var(--panel2);border:1px solid var(--border);
    border-left:3px solid #4a8fc7;border-radius:0 10px 10px 0;padding:11px 14px;
    font-size:.93rem;color:var(--muted);}
  .plot-leggi b{color:#7ab8e0;}
  .plot-err{color:#ff6b6b;font-size:.85rem;}
  .open-body{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
  .open-body p:first-child{margin-top:0;} .open-body p:last-child{margin-bottom:0;}
  .open-body ul{margin:.4em 0;padding-left:1.2em;} .open-body li{margin:.35em 0;}

  .note{background:var(--panel2);border-left:3px solid var(--muted);border-radius:6px;
    padding:9px 12px;margin:12px 0;font-size:.9rem;color:var(--muted);}
  .note b{color:#ff9d6b;}
  .note.warn{background:var(--warnbg);border-left-color:var(--warn);color:#e0b85a;}
  .note.warn b{color:#f0c25a;}

  /* ---- GRAMMATICA ---- */
  .gramwrap{background:var(--grambg);border:1px solid #1f4d47;border-radius:12px;padding:6px 6px;}
  table.gramtab{border-collapse:collapse;width:100%;font-size:.92rem;}
  table.gramtab td{padding:9px 12px;vertical-align:top;border-bottom:1px solid #17332e;}
  table.gramtab tr:last-child td{border-bottom:none;}
  table.gramtab td.gs{white-space:nowrap;color:var(--gram);width:1%;
    border-right:1px solid #17332e;font-variant-numeric:tabular-nums;}
  .section > h3 .tag.gramtag{background:var(--grambg);border-color:#1f4d47;color:var(--gram);}

  /* ---- STRUMENTI (repertorio condiviso: la scheda si apre DENTRO la frase) ----
     Nessun accento nuovo: riusa il verde della grammatica, perche' uno strumento
     richiamato e' grammatica gia' spiegata altrove, non una quinta specie di blocco. */
  .str{color:var(--gram);border-bottom:1px dashed var(--gram);cursor:pointer;}
  .str:hover{background:var(--grambg);}
  .str::after{content:"\2666";font-size:.62em;vertical-align:.42em;margin-left:2px;opacity:.8;}
  .str.aperto::after{content:"\2715";}
  .str.rotto{color:#ff6b6b;border-bottom-color:#ff6b6b;cursor:help;}
  /* la scheda e' uno SPAN in display:block, non un div: i rimandi cadono dentro
     <p>, <li> e celle di tabella, dove un div e' HTML illegale. */
  .strcard{display:block;margin:10px 0;background:var(--grambg);border:1px solid #1f4d47;
    border-left:3px solid var(--gram);border-radius:0 10px 10px 0;padding:10px 14px;font-size:.9rem;}
  .strcard .sh{display:block;font-size:.66rem;font-weight:700;letter-spacing:.5px;
    text-transform:uppercase;color:var(--gram);margin-bottom:7px;}
  .strcard .sr{display:block;margin:5px 0;}
  .strcard .sk{color:var(--gram);font-weight:600;}

  /* ---- PROLESSI (preannuncio fisico) ---- */
  .prowrap{background:var(--probg);border:1px solid var(--proedge);border-radius:12px;padding:4px 4px 8px;}
  .prohead{padding:11px 14px 4px;color:var(--pro);font-size:.72rem;font-weight:700;letter-spacing:.7px;
    text-transform:uppercase;}
  .pro-oggetto{padding:2px 14px 11px;color:var(--muted);font-size:.92rem;border-bottom:1px solid var(--proline);
    margin-bottom:2px;} .pro-oggetto b{color:var(--txt);}
  table.protab{border-collapse:collapse;width:100%;font-size:.92rem;}
  table.protab td{padding:10px 12px;vertical-align:top;border-bottom:1px solid var(--proline);}
  table.protab tr:last-child td{border-bottom:none;}
  table.protab td.pd{white-space:nowrap;color:var(--pro);width:1%;font-weight:700;font-size:.78rem;
    letter-spacing:.3px;text-transform:uppercase;border-right:1px solid var(--proline);line-height:1.3;}
  .pro-domanda{margin:8px 8px 2px;background:#140d26;border:1px solid var(--proedge);
    border-left:3px solid var(--pro);border-radius:8px;padding:10px 14px;font-size:.92rem;}
  .pro-domanda b{color:var(--pro);}
  .section > h3 .tag.protag{background:var(--probg);border-color:var(--proedge);color:var(--pro);}

  /* ---- REVEAL ---- */
  .rsteps{display:flex;flex-direction:column;gap:12px;}
  .rstep{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 18px;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .rlabel{font-size:.7rem;font-weight:700;letter-spacing:.4px;color:var(--accent);
    text-transform:uppercase;margin-bottom:8px;}
  .rstep p:first-of-type{margin-top:0;} .rstep p:last-child{margin-bottom:0;}
  .rstep ul{margin:.4em 0;padding-left:1.2em;}
  .testo{background:#13233f;border:1px solid #2b4877;border-radius:12px;padding:14px 18px;margin-bottom:14px;}
  .testo .src{display:block;font-size:.74rem;font-style:italic;color:var(--accent2);margin-bottom:8px;
    text-transform:uppercase;letter-spacing:.3px;}
  .esame-nota{font-size:.9rem;color:var(--muted);font-style:italic;margin-top:12px;padding-left:12px;
    border-left:3px solid var(--border);}

  .reveal-btn{background:var(--accent);color:#fff;border:none;padding:11px 18px;border-radius:10px;
    font-size:.95rem;font-weight:600;cursor:pointer;margin-top:14px;transition:.12s;}
  .reveal-btn:hover:not(:disabled){background:var(--accent2);}
  .reveal-btn.small{padding:7px 14px;font-size:.85rem;margin-top:0;background:var(--panel2);
    color:var(--accent2);border:1px solid var(--border);}
  .reveal-btn.small:hover:not(:disabled){border-color:var(--accent);}
  .reveal-btn:disabled,.reveal-btn.done{background:var(--panel2);color:var(--muted);
    border:1px solid var(--border);cursor:default;}

  /* ---- COLLAUDO ---- */
  .collaudo-item{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 18px;margin-bottom:12px;}
  .cq{margin-bottom:10px;}
  .ca{margin-top:12px;background:var(--okbg);border:1px solid #235c33;border-radius:8px;
    padding:10px 14px;font-size:.94rem;}
  .ca b{color:#5fd980;}

  /* ---- PREV / NEXT ---- */
  .prevnext{display:flex;justify-content:space-between;gap:12px;margin-top:40px;
    border-top:1px solid var(--border);padding-top:20px;}
  .pnbtn{flex:1 1 0;background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:12px 16px;cursor:pointer;color:var(--txt);text-align:left;transition:.14s;font:inherit;}
  .pnbtn:hover{border-color:var(--accent);background:var(--panel2);}
  .pnbtn.next{text-align:right;}
  .pnbtn .k{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .pnbtn .t{font-weight:600;color:var(--accent2);}
  .pnbtn:disabled{opacity:.35;cursor:default;border-color:var(--border);background:var(--panel);}

  code{background:var(--panel2);border:1px solid var(--border);border-radius:5px;
    padding:1px 5px;font-size:.85em;color:var(--accent2);}
  .katex{font-size:1.02em;color:var(--txt);} .katex-display{margin:.5em 0;overflow-x:auto;overflow-y:hidden;}

  @media(max-width:860px){
    .shell{flex-direction:column;}
    .sidebar{width:100%;flex:none;position:static;max-height:none;border-right:none;
      border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:4px;}
    .sidebar h2{width:100%;} .navitem{width:auto;}
    .main{padding:20px 16px 80px;}
  }
</style>

<script>
"use strict";
const R = String.raw;

function typeset(el){
  if(el && window.renderMathInElement){
    try{ renderMathInElement(el,{delimiters:[
      {left:'$$',right:'$$',display:true},
      {left:'$',right:'$',display:false}
    ],throwOnError:false}); }catch(e){}

}
function elFromHTML(html){ var d=document.createElement('div'); d.innerHTML=html; return d; }

/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un
   rimando scritto nella prosa:

       <span class="str" data-str="serie-geometrica">la serie geometrica</span>

   Le schede citate da questo nucleo sono cucite qui sotto dal montaggio
   (assembla-nucleo.js): la pagina resta autosufficiente — niente fetch,
   niente sottocartelle da pubblicare — e un rimando a una scheda che non
   esiste FERMA la costruzione invece di arrivare in pagina rotto.
   Apertura: lo stesso gesto del collaudo (si clicca, il pannello compare,
   si typeset una volta sola), portato dentro la frase.
   =================================================================== */
var CORSO = 'meccanica-quantistica';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["spazio-di-hilbert"] = {"nome":"Spazio di Hilbert","riga":"E' uno spazio vettoriale complesso con prodotto interno, completo nella norma che ne deriva e separabile, cosicche' ogni stato si scrive come somma numerabile $|\\psi\\rangle=\\sum_n c_n|n\\rangle$ con $c_n=\\langle n|\\psi\\rangle$.","serve":"E' la casa degli stati, e le tre parole della definizione fanno tre lavori diversi. Il prodotto interno da' le ampiezze, e quindi le probabilita'. La completezza garantisce che il limite di una successione di stati sia ancora uno stato: senza, uno sviluppo in serie potrebbe convergere fuori dallo spazio. La separabilita' permette di scrivere un vettore con una lista numerabile di coefficienti, cioe' di fare i conti.","esempio":"La relazione di completezza $\\sum_n|n\\rangle\\langle n|=\\hat 1$ e' lo strumento operativo piu' usato della teoria: infilata dentro un prodotto scalare lo spezza in una somma. La norma diventa $\\langle\\psi|\\psi\\rangle=\\sum_n|c_n|^{2}$, e se lo stato e' normalizzato quella somma vale uno: i moduli quadri dei coefficienti sono probabilita', e sommano a uno per costruzione.","debito":"la costruzione di $L^{2}$ come completamento, la misura di Lebesgue che serve a definirlo e il teorema di Riesz-Fischer stanno nei movimenti di Metodi; qui si usa il risultato.","controllo":[{"tipo":"somma","espr":"(1/2)**n","var":"n","da":"1","a":"oo","vale":"1","ipotesi":{"n":"positive-integer"},"dove":"esempio","appare":"sommano a uno"},{"tipo":"simbolico","dove":"esempio","appare":"\\sum_n|n\\rangle\\langle n|=\\hat 1","perche":"e' la relazione di completezza: i proiettori sugli elementi di una base ortonormale sommano all'identita'. E' la proprieta' che definisce una base completa, non un conto"}],"qui":{},"pieno":null};
STRUM["operatore-aggiunto"] = {"nome":"Operatore aggiunto e autoaggiunto","riga":"L'aggiunto e' definito da $\\langle\\phi|\\hat A\\psi\\rangle=\\langle\\hat A^{\\dagger}\\phi|\\psi\\rangle$ per ogni coppia di stati, e l'operatore e' autoaggiunto quando coincidono sia $\\hat A^{\\dagger}$ con $\\hat A$ sia i loro domini.","serve":"E' la condizione che rende un operatore un'osservabile: autovalori reali, e autovettori di autovalori distinti ortogonali. In dimensione finita «autoaggiunto» e «hermitiano» coincidono; in dimensione infinita no, e la differenza non e' pedanteria — l'operatore impulso su una semiretta e' hermitiano e non autoaggiunto, e infatti non e' un'osservabile.","esempio":"Se $\\hat A\\psi=a\\psi$ con $\\hat A$ autoaggiunto, allora $a\\langle\\psi|\\psi\\rangle=\\langle\\psi|\\hat A\\psi\\rangle=\\langle\\hat A\\psi|\\psi\\rangle=a^{*}\\langle\\psi|\\psi\\rangle$; siccome la norma non e' nulla segue $a=a^{*}$, cioe' l'autovalore e' reale. Tre righe, e sono la ragione per cui le osservabili si rappresentano cosi'.","debito":"la distinzione fra hermitiano e autoaggiunto in dimensione infinita — domini, estensioni, indici di difetto — e' il programma di von Neumann e sta fuori da questo percorso: qui si dichiara che esiste e si lavora nel caso buono. La regola di inversione dell'ordine nell'aggiunto di un prodotto si usa e non si dimostra.","controllo":[{"tipo":"uguale","sinistra":"conjugate(a)","vale":"a","ipotesi":{"a":"real"},"dove":"esempio","appare":"a=a^{*}"}],"qui":{},"pieno":null};
STRUM["commutatore"] = {"nome":"Commutatore","riga":"$[\\hat A,\\hat B]=\\hat A\\hat B-\\hat B\\hat A$, antisimmetrico, con la regola di Leibniz $[\\hat A,\\hat B\\hat C]=[\\hat A,\\hat B]\\hat C+\\hat B[\\hat A,\\hat C]$ e la relazione canonica $[\\hat x,\\hat p]=i\\hbar$.","serve":"E' la misura di quanto due operazioni dipendano dall'ordine, e qui l'ordine e' fisica: due osservabili che non commutano non hanno una base comune di autostati, quindi non si misurano insieme con precisione arbitraria. Quasi ogni conto che sembra magico — l'algebra del momento angolare, gli operatori di salita e discesa, il teorema di Ehrenfest — e' una manipolazione di commutatori fatta con quelle regole e nient'altro.","esempio":"Dalla regola di Leibniz, $[\\hat x,\\hat p^{2}]=[\\hat x,\\hat p]\\hat p+\\hat p[\\hat x,\\hat p]=2i\\hbar\\hat p$. E' il conto che fa uscire il teorema di Ehrenfest: la meccanica classica ricompare come relazione fra valori medi, e ricompare perche' quel commutatore vale proprio $2i\\hbar\\hat p$.","debito":"l'identita' di Jacobi si enuncia e non si dimostra; la corrispondenza fra commutatore e parentesi di Poisson — che e' l'idea di Dirac e non un'analogia decorativa — sta in mq-07, e li' va letta per intero.","controllo":[{"tipo":"uguale","sinistra":"I*hbar*p + p*I*hbar","vale":"2*I*hbar*p","ipotesi":{"hbar":"positive","p":"real"},"dove":"esempio","appare":"2i\\hbar\\hat p"},{"tipo":"simbolico","dove":"riga","appare":"[\\hat x,\\hat p]=i\\hbar","perche":"e' la relazione di commutazione canonica, il POSTULATO da cui discende il resto della teoria: non si dimostra, si assume, ed e' cio' che separa la meccanica quantistica dalla classica"}],"qui":{},"pieno":null};
STRUM["spettro"] = {"nome":"Spettro di un operatore","riga":"Lo spettro di un operatore e' l'insieme dei possibili esiti di una misura — i suoi autovalori — e puo' essere discreto (autovalori separati, autovettori in $\\mathcal H$), continuo (autovalori che riempiono un intervallo, autovettori non normalizzabili), o misto.","serve":"E' la quantita' che la fisica chiede davvero: scrivere l'hamiltoniana e trovarne lo spettro E' il problema d'esame. La distinzione discreto/continuo non e' tecnica — decide se un autostato e' uno stato preparabile (discreto) o una distribuzione che vive fuori dallo spazio di Hilbert (continuo), come l'onda piana e la delta.","esempio":"Per $\\sigma_z=\\begin{pmatrix}1&0\\\\0&-1\\end{pmatrix}$ lo spettro e' $\\{+1,-1\\}$, discreto, e i due invarianti della matrice lo riassumono senza risolvere l'equazione secolare: la somma degli autovalori e' la traccia, $\\operatorname{tr}\\sigma_z=0$, il loro prodotto e' il determinante, $\\det\\sigma_z=-1$. Per l'operatore posizione lo spettro e' tutta la retta reale, continuo, e gli autovettori sono delte di Dirac.","debito":"la costruzione rigorosa dello spettro continuo (teorema spettrale generalizzato, misura spettrale $E(\\lambda)$ di von Neumann) sta fuori da questo percorso: qui si dichiara che esiste e si lavora coi casi concreti. La separazione fra spettro continuo e spettro residuo non si tratta.","controllo":[{"tipo":"uguale","sinistra":"Matrix([[1,0],[0,-1]]).trace()","vale":"0","dove":"esempio","appare":"\\operatorname{tr}\\sigma_z=0"},{"tipo":"uguale","sinistra":"Matrix([[1,0],[0,-1]]).det()","vale":"-1","dove":"esempio","appare":"\\det\\sigma_z=-1"}],"qui":{},"pieno":null};
STRUM["operatore-unitario"] = {"nome":"Operatore unitario","riga":"Un operatore $\\hat U$ e' unitario quando $\\hat U^{\\dagger}\\hat U=\\hat U\\hat U^{\\dagger}=\\mathbb 1$, cioe' $\\hat U^{\\dagger}=\\hat U^{-1}$, il che equivale a conservare il prodotto interno: $\\langle \\hat U\\phi|\\hat U\\psi\\rangle=\\langle\\phi|\\psi\\rangle$ per ogni coppia di stati.","serve":"Conservare il prodotto interno vuol dire conservare le probabilita': ogni trasformazione fisica che non cambia gli esiti di una misura — un cambio di base, una traslazione, una rotazione, l'evoluzione temporale — e' unitaria. I suoi autovalori hanno modulo uno, e due osservabili legate da un operatore unitario hanno lo stesso spettro.","esempio":"La rotazione del piano $\\hat U=\\begin{pmatrix}\\cos\\theta&-\\sin\\theta\\\\\\sin\\theta&\\cos\\theta\\end{pmatrix}$ e' unitaria — il prodotto $\\hat U^{\\dagger}\\hat U$ ha sulla diagonale $\\cos^2\\theta+\\sin^2\\theta=1$ e zero fuori — e ha autovalori $e^{\\pm i\\theta}$, di modulo $|e^{i\\theta}|=1$. La matrice $S$ del cambio di base ortonormale e' unitaria per lo stesso motivo: manda una base ortonormale in un'altra.","debito":"la trasformata di Cayley $\\hat U=(\\hat A-i)/(\\hat A+i)$, che lega operatori autoaggiunti e unitari e con cui von Neumann risolve il problema agli autovalori in dimensione infinita, si cita e non si costruisce.","controllo":[{"tipo":"uguale","sinistra":"Abs(exp(I*theta))","vale":"1","ipotesi":{"theta":"real"},"dove":"esempio","appare":"|e^{i\\theta}|=1"},{"tipo":"uguale","sinistra":"Matrix([[cos(th),-sin(th)],[sin(th),cos(th)]]).T*Matrix([[cos(th),-sin(th)],[sin(th),cos(th)]])","vale":"Matrix([[1,0],[0,1]])","ipotesi":{"th":"real"},"dove":"esempio","appare":"\\cos^2\\theta+\\sin^2\\theta=1"}],"qui":{},"pieno":null};
STRUM["parentesi-di-poisson"] = {"nome":"Parentesi di Poisson","riga":"$\\{f,g\\}=\\sum_k\\Big(\\dfrac{\\partial f}{\\partial q_k}\\dfrac{\\partial g}{\\partial p_k}-\\dfrac{\\partial f}{\\partial p_k}\\dfrac{\\partial g}{\\partial q_k}\\Big)$: l'operazione antisimmetrica che, date due funzioni sullo spazio delle fasi, dice di quanto la prima cambia lungo il flusso generato dalla seconda.","serve":"A leggere la meccanica hamiltoniana come una teoria di trasformazioni invece che di traiettorie. Ogni funzione $g(q,p)$ genera una trasformazione canonica infinitesima, $\\delta f=\\varepsilon\\{f,g\\}$, e l'evoluzione temporale e' il caso particolare $g=H$: $\\dot f=\\{f,H\\}$. Da qui escono due cose che non si vedono nelle equazioni di Newton: una quantita' si conserva esattamente quando la trasformazione che genera lascia invariata $H$, e le parentesi fra le coordinate — $\\{q_j,p_k\\}=\\delta_{jk}$ — sono l'unica struttura che una trasformazione canonica deve preservare.","esempio":"Per $H=\\dfrac{p^2}{2m}+V(q)$ con un grado di liberta' le due parentesi fondamentali sono le equazioni di Hamilton riscritte. La coordinata: $\\{q,H\\}=\\dfrac{\\partial q}{\\partial q}\\dfrac{\\partial H}{\\partial p}-\\dfrac{\\partial q}{\\partial p}\\dfrac{\\partial H}{\\partial q}=\\dfrac{p}{m}$, cioe' $\\dot q=p/m$. L'impulso: $\\{p,H\\}=-\\dfrac{\\partial V}{\\partial q}$, cioe' $\\dot p=-V'(q)$, la seconda legge di Newton. E la parentesi fondamentale, calcolata dalla definizione, vale $\\{q,p\\}=1$.","debito":"la dimostrazione che le parentesi di Poisson sono invarianti per trasformazioni canoniche non c'e' qui: e' il contenuto di un corso di meccanica analitica. Qui si usa il fatto, e si usa nella forma che serve — una trasformazione e' canonica quando preserva $\\{q_j,p_k\\}=\\delta_{jk}$.","qui":{"meccanica-quantistica":{"serve":"A capire da dove viene il commutatore, invece di impararlo. L'idea di Dirac e' che la corrispondenza $\\{f,g\\}\\to\\dfrac{1}{i\\hbar}[\\hat f,\\hat g]$ non sia un'analogia decorativa ma la struttura che sopravvive: la trasformazione canonica infinitesima generata da $g$ diventa la trasformazione unitaria infinitesima generata dall'operatore autoaggiunto corrispondente, e il teorema di Noether classico — $\\{g,H\\}=0$ implica $g$ conservata — diventa $[\\hat K,\\hat H]=0$ implica $\\langle \\hat K\\rangle$ costante.","esempio":"Per $H=\\dfrac{p^2}{2m}+V(q)$ si ha $\\{p,H\\}=-\\dfrac{\\partial V}{\\partial q}$: l'impulso si conserva esattamente quando il potenziale non dipende da $q$, cioe' quando il sistema e' invariante per traslazioni. Il conto quantistico corrispondente da' $[\\hat p,\\hat H]=-i\\hbar\\,V'(\\hat q)$, con la stessa conclusione e lo stesso meccanismo."}},"controllo":[{"tipo":"uguale","sinistra":"diff(q,q)*diff(p,p)-diff(q,p)*diff(p,q)","vale":"1","dove":"esempio","appare":"\\{q,p\\}=1"},{"tipo":"uguale","sinistra":"diff(q,q)*diff(p**2/(2*m)+V(q),p)-diff(q,p)*diff(p**2/(2*m)+V(q),q)","vale":"p/m","ipotesi":{"V":"funzione","m":"positive","p":"real","q":"real"},"dove":"esempio","appare":"=\\dfrac{p}{m}"},{"tipo":"uguale","sinistra":"-diff(p**2/(2*m)+V(q),q)","vale":"-diff(V(q),q)","ipotesi":{"V":"funzione","m":"positive","p":"real","q":"real"},"dove":"esempio","appare":"\\{p,H\\}=-\\dfrac{\\partial V}{\\partial q}"}],"pieno":null};
STRUM["trasformata-di-legendre"] = {"nome":"Trasformata di Legendre","riga":"Scambia una variabile con la sua derivata coniugata: da $f(x)$ si passa a $g(p)=f(x)-px$ con $p=df/dx$, e $dg=-x\\,dp$.","serve":"Serve quando la variabile naturale di una funzione non e' quella che si controlla in laboratorio. La trasformata non perde informazione — da $g$ si torna a $f$ — e cambia solo quale variabile e' indipendente. E' l'operazione che genera tutti i potenziali termodinamici l'uno dall'altro, e la stessa che porta dalla lagrangiana all'hamiltoniana.","esempio":"Con $f(x)=x^{2}$: la coniugata e' $p=2x$, si inverte in $x=p/2$, e $g=x^{2}-px=p^{2}/4-p^{2}/2=-p^{2}/4$. Il segno negativo non e' un errore: per $f$ convessa la trasformata e' concava, e il conto si richiude perche' $dg/dp=-p/2=-x$, che e' proprio la regola $dg=-x\\,dp$ letta all'indietro.","debito":"la definizione variazionale $g(p)=\\sup_x\\,[\\,px-f(x)\\,]$ — quella che regge anche dove $f$ non e' differenziabile, e che fissa il segno una volta per tutte — non sta qui: si usa la forma differenziale, valida per $f$ convessa e liscia, che e' il caso di tutti i potenziali termodinamici di questo percorso.","controllo":[{"tipo":"derivata","espr":"x**2","rispetto":["x"],"vale":"2*x","ipotesi":{"x":"real"},"dove":"esempio","appare":"p=2x"},{"tipo":"uguale","sinistra":"(p/2)**2-p*(p/2)","vale":"-p**2/4","ipotesi":{"p":"real"},"dove":"esempio","appare":"p^{2}/4-p^{2}/2=-p^{2}/4"},{"tipo":"derivata","espr":"-p**2/4","rispetto":["p"],"vale":"-p/2","ipotesi":{"p":"real"},"dove":"esempio","appare":"dg/dp=-p/2=-x"},{"tipo":"derivata","espr":"3*N*k*log(E)/2","rispetto":["E"],"vale":"3*N*k/(2*E)","ipotesi":{"N":"positive","k":"positive","E":"positive"},"dove":"qui.meccanica-statistica.esempio","appare":"\\partial S/\\partial E=3Nk/2E"}],"pieno":null,"qui":{"meccanica-statistica":{"serve":"E' il ponte fra gli ensemble. Il passaggio da microcanonico a canonico non e' solo un cambio di racconto — energia fissata contro temperatura fissata — e' una trasformata di Legendre dell'entropia, e questo spiega perche' i due ensemble danno gli stessi risultati all'equilibrio: la trasformata e' invertibile.","esempio":"Da $S(E)$ con $1/T=\\partial S/\\partial E$ si passa all'energia libera $F=E-TS$, funzione di $T$ invece che di $E$, con $dF=-S\\,dT-p\\,dV$. Sul gas ideale si vede coi numeri: $S=\\tfrac32Nk\\ln E+\\text{cost}$ da' $1/T=\\partial S/\\partial E=3Nk/2E$, cioe' $E=\\tfrac32NkT$. Lo stesso schema porta da $F$ al gran potenziale $\\Omega=F-\\mu N$ scambiando $N$ con $\\mu$: e' sempre la stessa operazione, applicata a una coppia coniugata diversa."}}};
STRUM["derivazione"] = {"nome":"Derivazione (regola di Leibniz)","riga":"Un operatore lineare $D$ su un'algebra che rispetta la regola del prodotto: $D(fg)=f\\,D(g)+g\\,D(f)$. È la proprietà che isola «derivare» fra tutti gli operatori lineari possibili.","serve":"È il modo algebrico di definire la derivata senza limiti, e serve ogni volta che si vuole derivare su un oggetto dove non c'è un rapporto incrementale da fare — su una varietà astratta, su un'algebra di matrici, su un anello di polinomi. La conseguenza operativa più usata è che **una derivazione è determinata dai suoi valori sui generatori**: su $\\mathbb{R}^{n}$ basta sapere quanto vale sulle coordinate $x^{1},\\dots,x^{n}$, e da lì Leibniz e la linearità danno tutto il resto. È il motivo per cui un vettore tangente, definito come derivazione, si scrive sempre come combinazione delle $\\partial/\\partial x^{i}$: non perché lo si sia scelto, ma perché non c'è altro. Un secondo fatto, che si dimostra in due righe e si usa continuamente: la **composizione** di due derivazioni non è una derivazione (compaiono derivate seconde), ma la loro **differenza incrociata** $DE-ED$ lo è, perché i termini secondi si cancellano a coppie.","esempio":"Su $\\mathbb{R}$, l'operatore $d/dx$ verificato sul prodotto $f=x^{2}$ e $g=x^{3}$: la regola dice $x^{2}\\cdot3x^{2}+x^{3}\\cdot2x$, cioè $5x^{4}$, e la derivata diretta di $x^{5}$ dà lo stesso $5x^{4}$. Il conto è banale ed è il punto: Leibniz non aggiunge informazione su $\\mathbb{R}$, dove la derivata si sa già fare. Aggiunge informazione quando è l'unica cosa che si ha — per esempio sull'algebra delle matrici, dove $D(A)=MA-AM$ per una matrice fissata $M$ è una derivazione, e la verifica di Leibniz consiste nello sviluppare $M(AB)-(AB)M$ e riconoscerlo come somma di $A\\,D(B)$ e $D(A)\\,B$, cosa che riesce perché i due termini $AMB$ introdotti dallo sviluppo compaiono con segni opposti e si cancellano.","debito":"che le derivazioni in un punto di una varietà siano esattamente i vettori tangenti è il teorema di gd-06 e non si ripete qui; il caso delle algebre non commutative è citato come esempio e non sviluppato.","controllo":[{"tipo":"uguale","sinistra":"x**2*3*x**2+x**3*2*x","vale":"5*x**4","ipotesi":{"x":"real"},"dove":"esempio","appare":"5x^{4}"},{"tipo":"derivata","espr":"x**5","rispetto":["x"],"vale":"5*x**4","ipotesi":{"x":"real"},"dove":"esempio","appare":"derivata diretta di $x^{5}$"}]};
STRUM["delta-di-dirac"] = {"nome":"Delta di Dirac","riga":"Non è una funzione ma un funzionale, definito da $\\int f(x)\\,\\delta(x-a)\\,dx=f(a)$, che composto con una funzione si spezza sui suoi zeri come $\\delta(g(x))=\\sum_i \\delta(x-x_i)/|g'(x_i)|$.","serve":"Serve come macchina per cambiare variabile senza invertire nulla. La densità di $y=f(x)$ si scrive $p_Y(y)=\\int p_X(x)\\,\\delta(y-f(x))\\,dx$, e la delta produce da sola il fattore $1/|f'|$ che altrimenti andrebbe messo a mano: i rami molteplici si contano da soli invece di doverli ricordare. È la ragione pratica per cui il formalismo con la delta compare in ogni soluzione d'esame che tocchi una distribuzione, mentre il cambio di variabile esplicito compare quasi mai.","esempio":"$\\delta(x^2-a^2)$ con $a$ positivo. Gli zeri sono $x=\\pm a$; la derivata dell'argomento è $2x$, che in modulo vale $2a$ su entrambi. Quindi $\\delta(x^2-a^2)=\\dfrac{1}{2a}\\big[\\delta(x-a)+\\delta(x+a)\\big]$. Il caso si ripete identico in fisica statistica con $\\varepsilon=p^2/2m$ in una dimensione, dove i due rami $p=\\pm\\sqrt{2m\\varepsilon}$ contribuiscono entrambi — e dimenticarne uno dimezza la risposta.","pieno":{"file":"15-distribuzioni.html","tappa":"01","come":"le distribuzioni come funzionali, la delta e le sue proprietà, nel nucleo di Metodi"},"qui":{"meccanica-statistica":{"serve":"È lo strumento con cui si calcola la densità degli stati, cioè l'oggetto su cui poggia tutto il secondo tempo del corso: $g(\\varepsilon)=\\int d^dp\\,d^dq\\;\\delta(\\varepsilon-H)/h^d$. L'identità che si usa davvero non è la definizione ma questa: $\\delta(\\varepsilon-H)=\\partial_\\varepsilon\\,\\theta(\\varepsilon-H)$. Si scambia l'integrale con la derivata e ci si ritrova a calcolare il volume della regione dove l'hamiltoniana sta sotto $\\varepsilon$ — un integrale elementare — invece di un integrale con una delta dentro. La $g$ così ottenuta è pura geometria dello spazio delle fasi: non sa nulla della temperatura, e per questo resta identica quando si passa da Boltzmann a Fermi o a Bose.","esempio":"Particella libera in due dimensioni. Il volume della regione $p^2/2m$ sotto $\\varepsilon$ è il disco di area $2\\pi m\\varepsilon$; derivando rispetto a $\\varepsilon$ si ottiene $2\\pi m$, cioè una densità degli stati costante. Non è una curiosità: è la ragione per cui in due dimensioni una particella libera non condensa, e per cui le prove che chiedono la condensazione in $d=2$ mettono sempre un potenziale confinante, che porta la $g$ da costante a crescente."}},"controllo":[{"tipo":"derivata","espr":"x**2-a**2","rispetto":["x"],"vale":"2*x","ipotesi":{"x":"positive","a":"positive"},"dove":"esempio","appare":"2x"},{"tipo":"uguale","sinistra":"1/Abs(2*a)","vale":"1/(2*a)","ipotesi":{"a":"positive"},"dove":"esempio","appare":"\\dfrac{1}{2a}"},{"tipo":"derivata","espr":"2*pi*m*e","rispetto":["e"],"vale":"2*pi*m","ipotesi":{"m":"positive","e":"positive"},"dove":"qui.meccanica-statistica.esempio","appare":"2\\pi m"}]};
STRUM["simmetrie"] = {"nome":"Simmetrie","riga":"L'insieme delle trasformazioni che lasciano identica la sorgente, e che perciò devono lasciare identico anche il campo che ne nasce.","serve":"È il ragionamento che decide la FORMA del campo prima di calcolarlo, e senza il quale la legge di Gauss non serve a niente: Gauss dà un solo numero — il flusso totale — e da un numero si ricava un campo soltanto se si sa già in che direzione punta e da quali variabili dipende. L'argomento ha una forma sola: se una trasformazione lascia identica la distribuzione di carica, lascia identico il campo; quindi ogni componente che quella trasformazione cambierebbe deve essere nulla, e ogni variabile che essa sposta non può comparire.","esempio":"Per un filo infinito uniformemente carico, la traslazione lungo il filo e la rotazione attorno a esso lasciano la carica identica: $\\mathbf E$ non può dipendere né da $z$ né dall'angolo. La riflessione nel piano perpendicolare al filo manderebbe $E_z$ in $-E_z$ lasciando uguale la sorgente, quindi $E_z=0$; resta la sola componente radiale $E_r(r)$. Solo a quel punto il cilindro coassiale è la superficie giusta, e Gauss dà $E_r\\cdot 2\\pi rL=\\dfrac{\\lambda L}{\\varepsilon_0}$, da cui $E_r=\\dfrac{\\lambda}{2\\pi\\varepsilon_0 r}$.","qui":{"meccanica-quantistica":{"serve":"Qui l'argomento di simmetria non decide la forma di un campo: decide la forma degli OPERATORI, ed è il modo in cui questo corso costruisce la teoria. Lo schema è lo stesso — una trasformazione che lascia identica la situazione fisica deve lasciare identica la descrizione — ma la conseguenza è più forte: ogni trasformazione di simmetria continua è realizzata da un operatore unitario, ogni operatore unitario continuo è l'esponenziale di un generatore autoaggiunto, e quel generatore è una quantità conservata. Impulso, momento angolare ed energia non si postulano: sono i generatori delle traslazioni, delle rotazioni e delle traslazioni temporali.","esempio":"Lo spazio è omogeneo, quindi traslare un sistema isolato non ne cambia la fisica: $\\hat U(a)=e^{-ia\\hat P/\\hbar}$ deve commutare con $\\hat H$. Al primo ordine in $a$ questo dà $[\\hat P,\\hat H]=0$, e quindi $\\dfrac{d}{dt}\\langle \\hat P\\rangle=0$: l'omogeneità dello spazio è la conservazione dell'impulso, e il passaggio da una all'altra è di due righe."}},"debito":"nessun nucleo del percorso tratta l'argomento di simmetria come strumento a sé: qui c'è la forma dell'argomento e non la sua giustificazione, che è di teoria dei gruppi e sta fuori dal percorso costruito finora. Quello che il percorso copre è il pezzo di destra — l'integrale di flusso, nel nucleo 03 tappa 04 — non il pezzo di sinistra che decide quale superficie scegliere.","controllo":[{"tipo":"uguale","sinistra":"(lam/(2*pi*e0*r))*2*pi*r*L","vale":"lam*L/e0","dove":"esempio","appare":"\\dfrac{\\lambda L}{\\varepsilon_0}"}]};
STRUM["matrici-di-pauli"] = {"nome":"Matrici di Pauli","riga":"Sono le tre matrici $2\\times2$ hermitiane a traccia nulla il cui quadrato e' l'identita' e il cui commutatore riproduce l'algebra del momento angolare, da cui lo spin $\\hat S_i=\\tfrac{\\hbar}{2}\\sigma_i$.","serve":"Sono la rappresentazione piu' piccola non banale del momento angolare, e insieme all'identita' formano una base di tutte le matrici due per due hermitiane: qualunque osservabile di un sistema a due stati e' una combinazione dell'identita' e delle tre. Ogni conto di spin un mezzo — Stern-Gerlach, precessione, risonanza magnetica, qubit — si riduce alla loro algebra.","esempio":"Siccome il quadrato di una combinazione unitaria delle tre e' l'identita', qualunque esponenziale collassa: l'operatore di rotazione dello spinore diventa $\\cos(\\theta/2)$ per l'identita' meno $i\\sin(\\theta/2)$ per la combinazione. Il mezzo nell'angolo e' la ragione per cui una rotazione di un giro intero cambia segno allo stato, perche' $\\cos(\\pi)=-1$.","debito":"la costruzione generale delle rappresentazioni di SU(2) e il suo legame con SO(3) stanno nel movimento sul momento angolare; qui c'e' il caso di spin un mezzo con le sue regole di calcolo.","controllo":[{"tipo":"uguale","sinistra":"cos(2*pi/2)","vale":"-1","dove":"esempio","appare":"\\cos(\\pi)=-1"},{"tipo":"uguale","sinistra":"cos(pi/3)**2+sin(pi/3)**2","vale":"1","dove":"esempio","appare":"\\sin(\\theta/2)"}],"qui":{},"pieno":null};
STRUM["prodotto-tensoriale"] = {"nome":"Prodotto tensoriale","riga":"Lo spazio di due sistemi e' $\\mathcal H_1\\otimes\\mathcal H_2$, di dimensione pari al PRODOTTO delle due e non alla somma, con base fatta dai prodotti degli elementi delle due basi.","serve":"E' il motivo per cui la meccanica quantistica non e' una teoria di particelle indipendenti messe accanto. La dimensione cresce come il prodotto, quindi la stragrande maggioranza degli stati non si scrive come prodotto di due stati singoli: quelli che non si scrivono cosi' sono gli stati entangled, e sono la regola, non l'eccezione.","esempio":"Due spin un mezzo: ogni fattore ha dimensione due, il prodotto ne ha $2\\cdot2=4$. Gli stati fattorizzati sono parametrizzati da due punti sulla sfera di Bloch, cioe' da quattro parametri reali, mentre lo spazio totale ne ha $2\\cdot4-2=6$: restano due dimensioni di stati che non si fattorizzano, e il singoletto e' uno di quelli.","debito":"la matrice densita' ridotta e la quantificazione dell'entanglement (entropia di von Neumann) non stanno qui: questa scheda da' la struttura, non la misura.","controllo":[{"tipo":"uguale","sinistra":"2*2","vale":"4","dove":"esempio","appare":"2\\cdot2=4"},{"tipo":"uguale","sinistra":"2*4-2","vale":"6","dove":"esempio","appare":"2\\cdot4-2=6"}],"qui":{},"pieno":null};
STRUM["traccia"] = {"nome":"Traccia di un operatore","riga":"La traccia e' la somma degli elementi diagonali, $\\operatorname{tr}\\hat A=\\sum_i\\langle i|\\hat A|i\\rangle$, e non dipende dalla base ortonormale scelta perche' e' invariante per permutazione ciclica: $\\operatorname{tr}(\\hat A\\hat B)=\\operatorname{tr}(\\hat B\\hat A)$, da cui $\\operatorname{tr}(\\hat U^{\\dagger}\\hat A\\hat U)=\\operatorname{tr}\\hat A$.","serve":"E' il modo di estrarre un numero da un operatore senza privilegiare una rappresentazione. Il valor medio di un'osservabile su uno stato si scrive $\\langle A\\rangle=\\operatorname{tr}(\\rho\\hat A)$ con $\\rho=|\\psi\\rangle\\langle\\psi|$, e questa forma — a differenza di $\\langle\\psi|\\hat A|\\psi\\rangle$ — vale identica per gli stati misti, dove $\\rho$ non e' piu' un proiettore: e' la porta verso la matrice densita' e la decoerenza.","esempio":"Per $A=\\begin{pmatrix}1&2\\\\3&4\\end{pmatrix}$ e $B=\\begin{pmatrix}0&1\\\\1&0\\end{pmatrix}$, pur essendo $AB\\neq BA$, le due tracce coincidono: $AB=\\begin{pmatrix}2&1\\\\4&3\\end{pmatrix}$ da' $\\operatorname{tr}(AB)=2+3=5$, mentre $BA=\\begin{pmatrix}3&4\\\\1&2\\end{pmatrix}$ da' $\\operatorname{tr}(BA)=3+2=5$. La traccia di un proiettore di rango uno vale $1$, e in generale la traccia di un proiettore e' la dimensione del sottospazio su cui proietta.","debito":"la traccia di un operatore in dimensione infinita esiste solo per la classe degli operatori a traccia (totalmente continui), e la costruzione rigorosa — $\\operatorname{tr}(\\hat A^{\\dagger}\\hat A)=\\sum_\\mu\\|\\hat A\\phi_\\mu\\|^2$ indipendente dalla base, von Neumann cap. II.11 — qui si cita. Si lavora col caso in cui la somma converge.","controllo":[{"tipo":"uguale","sinistra":"(Matrix([[1,2],[3,4]])*Matrix([[0,1],[1,0]])).trace()","vale":"5","dove":"esempio","appare":"\\operatorname{tr}(AB)=2+3=5"},{"tipo":"uguale","sinistra":"(Matrix([[0,1],[1,0]])*Matrix([[1,2],[3,4]])).trace()","vale":"5","dove":"esempio","appare":"\\operatorname{tr}(BA)=3+2=5"},{"tipo":"uguale","sinistra":"Matrix([[1,2],[3,4]])*Matrix([[0,1],[1,0]])","vale":"Matrix([[2,1],[4,3]])","dove":"esempio","appare":"AB=\\begin{pmatrix}2&1\\\\4&3\\end{pmatrix}"},{"tipo":"uguale","sinistra":"Matrix([[0,1],[1,0]])*Matrix([[1,2],[3,4]])","vale":"Matrix([[3,4],[1,2]])","dove":"esempio","appare":"BA=\\begin{pmatrix}3&4\\\\1&2\\end{pmatrix}"}],"qui":{},"pieno":null};
STRUM["polinomi-di-hermite"] = {"nome":"Polinomi di Hermite","riga":"$H_n$ sono le soluzioni polinomiali dell'equazione di Hermite, con $H_0=1$, $H_1=2\\xi$, $H_2=4\\xi^{2}-2$ e $H_3=8\\xi^{3}-12\\xi$, ortogonali con peso $e^{-\\xi^{2}}$.","serve":"Sono la parte polinomiale delle autofunzioni dell'oscillatore armonico. Il grado del polinomio da' il numero di nodi, e quindi l'ordine dei livelli: l'ennesimo stato eccitato ha esattamente ennesimi zeri. La parita' si alterna con il grado, ed e' il motivo per cui meta' degli elementi di matrice si annulla senza fare il conto.","esempio":"Il polinomio di grado due si annulla dove $4\\xi^{2}=2$, cioe' in due punti: due nodi, come vuole il grado. E la sua parita' pari fa si' che l'elemento di matrice della posizione fra lo stato fondamentale e il secondo eccitato sia nullo, perche' l'integrando e' dispari — una regola di selezione ottenuta guardando la simmetria invece di integrare.","debito":"la formula di Rodrigues, la funzione generatrice e le relazioni di ricorrenza stanno nei movimenti di Metodi sulle funzioni speciali; qui c'e' cio' che serve per leggere le autofunzioni.","controllo":[{"tipo":"uguale","sinistra":"4*(1/sqrt(2))**2","vale":"2","dove":"esempio","appare":"4\\xi^{2}=2"},{"tipo":"derivata","espr":"4*x**2-2","rispetto":["x"],"vale":"8*x","ipotesi":{"x":"real"},"dove":"riga","appare":"4\\xi^{2}-2"},{"tipo":"integrale","espr":"x*exp(-x**2)","var":"x","da":"-oo","a":"oo","vale":"0","dove":"esempio","appare":"l'integrando e' dispari"}],"qui":{},"pieno":null};
STRUM["armoniche-sferiche"] = {"nome":"Armoniche sferiche","riga":"$Y_\\ell^{m}(\\theta,\\varphi)$ sono le autofunzioni simultanee di $\\hat L^{2}$, con autovalore $\\hbar^{2}\\ell(\\ell+1)$, e di $\\hat L_z$, con autovalore $\\hbar m$, ortonormali e complete sulla sfera.","serve":"Sono la parte angolare di ogni problema a simmetria sferica: appena il potenziale dipende solo dalla distanza, l'equazione si separa e la dipendenza angolare e' sempre una di queste, qualunque sia il potenziale. Cio' che cambia da problema a problema e' solo la parte radiale — per questo si imparano una volta e si riusano sempre.","esempio":"Per ogni $\\ell$ ci sono $2\\ell+1$ valori di $m$: e' la degenerazione essenziale di ogni livello a simmetria sferica, e non dipende dal potenziale. Per $\\ell=2$ vengono $2\\cdot2+1=5$ stati. La prima armonica e' costante, ed e' il motivo per cui lo stato fondamentale di un potenziale centrale e' sempre sfericamente simmetrico.","debito":"la costruzione esplicita dai polinomi di Legendre associati, e le formule di ricorrenza, non stanno qui: si usano gli enunciati e l'ortonormalita'.","controllo":[{"tipo":"uguale","sinistra":"2*2+1","vale":"5","dove":"esempio","appare":"2\\cdot2+1=5"},{"tipo":"simbolico","dove":"riga","appare":"\\hbar^{2}\\ell(\\ell+1)","perche":"e' l'autovalore del quadrato del momento angolare, che discende dall'algebra dei commutatori e non dalla forma esplicita delle armoniche. Si enuncia qui perche' e' cio' che le definisce"}],"qui":{},"pieno":null};
STRUM["integrale-gaussiano"] = {"nome":"Integrale gaussiano","riga":"$\\displaystyle\\int_{-\\infty}^{+\\infty} e^{-ax^{2}}\\,dx=\\sqrt{\\pi/a}$ per $a\\gt 0$, e $\\displaystyle\\int_{-\\infty}^{+\\infty} x^{2}e^{-ax^{2}}\\,dx=\\tfrac12\\sqrt{\\pi/a^{3}}$.","serve":"E' l'unico integrale che serve davvero sapere a memoria in meccanica statistica, perche' l'energia cinetica e' quadratica nell'impulso e quindi ogni integrazione sugli impulsi e' una gaussiana. Il trucco della dimostrazione — elevare al quadrato e passare in coordinate polari — vale la pena di vederlo una volta: e' il motivo per cui compare un $\\pi$ in una formula che di cerchi non parla.","esempio":"Da $I^{2}=\\iint e^{-a(x^{2}+y^{2})}dx\\,dy=\\int_0^\\infty 2\\pi r\\,e^{-ar^{2}}dr=\\pi/a$ segue $I=\\sqrt{\\pi/a}$. I momenti superiori si ottengono derivando rispetto ad $a$ sotto il segno: $-\\partial_a I=\\int x^{2}e^{-ax^{2}}dx=\\tfrac12\\sqrt{\\pi}\\,a^{-3/2}$. Derivare rispetto a un parametro e' piu' rapido che integrare per parti, e funziona per tutti i momenti pari.","debito":"il caso di esponente immaginario — l'integrale di Fresnel $\\int e^{iax^{2}}dx$, che si ottiene ruotando il cammino nel piano complesso e che in meccanica quantistica e' il propagatore libero — non sta qui: in tutte le gaussiane di questo percorso $a$ e' reale e positivo, e la convergenza non e' in discussione.","controllo":[{"tipo":"integrale","espr":"exp(-a*x**2)","var":"x","da":"-oo","a":"oo","vale":"sqrt(pi/a)","ipotesi":{"a":"positive","x":"real"},"dove":"riga","appare":"\\sqrt{\\pi/a}"},{"tipo":"integrale","espr":"x**2*exp(-a*x**2)","var":"x","da":"-oo","a":"oo","vale":"sqrt(pi/a**3)/2","ipotesi":{"a":"positive","x":"real"},"dove":"riga","appare":"\\tfrac12\\sqrt{\\pi/a^{3}}"},{"tipo":"integrale","espr":"2*pi*r*exp(-a*r**2)","var":"r","da":"0","a":"oo","vale":"pi/a","ipotesi":{"a":"positive","r":"positive"},"dove":"esempio","appare":"2\\pi r\\,e^{-ar^{2}}dr=\\pi/a"},{"tipo":"integrale","espr":"x**2*exp(-a*x**2)","var":"x","da":"-oo","a":"oo","vale":"sqrt(pi)*a**Rational(-3,2)/2","ipotesi":{"a":"positive","x":"real"},"dove":"esempio","appare":"\\tfrac12\\sqrt{\\pi}\\,a^{-3/2}"},{"tipo":"integrale","espr":"exp(-b*p**2/(2*m))","var":"p","da":"-oo","a":"oo","vale":"sqrt(2*pi*m/b)","ipotesi":{"b":"positive","m":"positive","p":"real"},"dove":"qui.meccanica-statistica.esempio","appare":"\\sqrt{2\\pi m/\\beta}"},{"tipo":"uguale","sinistra":"V/(h/sqrt(2*pi*m*k*T))**3","vale":"V*(2*pi*m*k*T)**Rational(3,2)/h**3","ipotesi":{"V":"positive","h":"positive","m":"positive","k":"positive","T":"positive"},"dove":"qui.meccanica-statistica.esempio","appare":"V/\\lambda^{3}"},{"tipo":"uguale","sinistra":"integrate(p**2/(2*m)*exp(-b*p**2/(2*m)),(p,-oo,oo))/integrate(exp(-b*p**2/(2*m)),(p,-oo,oo))","vale":"1/(2*b)","ipotesi":{"b":"positive","m":"positive","p":"real"},"dove":"qui.meccanica-statistica.esempio","appare":"1/2\\beta=\\tfrac12 kT"}],"pieno":null,"qui":{"meccanica-statistica":{"serve":"La funzione di partizione di una particella libera e' un prodotto di tre gaussiane negli impulsi, e da li' esce la lunghezza d'onda termica $\\lambda=h/\\sqrt{2\\pi m k T}$ — che e' la grandezza con cui si misura quando un gas smette di essere classico.","esempio":"$\\int e^{-\\beta p^{2}/2m}dp=\\sqrt{2\\pi m/\\beta}$, quindi $Z_{1}=\\dfrac{V}{h^{3}}(2\\pi mkT)^{3/2}=V/\\lambda^{3}$, che e' la stessa cosa scritta due volte perche' $\\lambda=h/\\sqrt{2\\pi mkT}$. Lo stesso integrale col peso $p^{2}$ da' $\\langle p^{2}/2m\\rangle=1/2\\beta=\\tfrac12 kT$ per grado di liberta': l'equipartizione non e' un principio a parte, e' questo integrale."}}};

function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';
  return h;
}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

           mette le simmetrie resta un fatto dichiarato dal programma.
voci-fondative:
           DIRAC, pagine stampate 136-148 nel dossier delle voci, in italiano con OCR
           sporco: si cita solo cio' che si legge senza ambiguita', e nessuna formula si
           ricostruisce dall'OCR. E' la voce centrale di questo movimento, perche' il §25
           dei Principi, «OPERATORI DI TRASLAZIONE», e' il luogo in cui l'idea nasce.
           Tre contributi. Il primo e' la DEFINIZIONE OPERATIVA di traslazione (pag.
           137): tradurre uno stato o un'osservabile e' «un processo perfettamente
           definito dal punto di vista fisico», perche' basta traslare tutto l'apparato
           che prepara lo stato o misura l'osservabile. Il secondo e' il problema della
           fase, posto da lui prima di chiunque altro (pag. 137-139): «La traslazione di
           un ket non è tuttavia così ben definita», e cio' che fissa il fattore di fase a
           uno solo per tutti i ket e' l'invarianza delle relazioni di sovrapposizione. Il
           terzo e' il risultato (pag. 142): «la componente x dell'impulso totale del
           sistema è uguale a i*hbar volte l'operatore di traslazione d_x», che Dirac
           commenta con una riga da citare — «Questo è un risultato fondamentale che dà un
           nuovo significato agli operatori di traslazione». E alla stessa pagina c'e' la
           lettura geometrica delle relazioni canoniche: le condizioni che stabiliscono che
           p_x, p_y e p_z commutino fra loro «risultano ora connesse al fatto che le
           traslazioni in direzioni diverse sono operazioni invertibili». Il §26 (pag.
           143-148) per la tesi che regge tutto il movimento: «le trasformazioni unitarie
           della teoria quantistica sono l'analogo delle trasformazioni di contatto della
           teoria classica», con la dimostrazione che una trasformazione unitaria
           infinitesima U = 1 + i*eps*F da' a* - a = i*eps*(Fa - aF), «formalmente la
           stessa espressione di una trasformazione di contatto infinitesima classica».
           LANDAU-LIFSITS vol. III, pagine stampate 126-129 e 360-362 nel dossier delle
           voci, in italiano. Due contributi, e il primo e' la frase che da' senso
           all'intera tappa sulla parita' (pag. 127): «Nella meccanica classica,
           l'invarianza della funzione di Hamilton rispetto all'inversione non porta a
           nuove leggi di conservazione. Nella meccanica quantistica, invece, la
           situazione è profondamente diversa». Da li' la definizione dell'operatore di
           inversione, P^2 = 1, gli autovalori +1 e -1, la parita' (-1)^l dedotta dalle
           armoniche sferiche, e le regole di selezione per scalari veri, pseudoscalari,
           vettori polari e vettori assiali (30,4) e (30,5). Il secondo e' il §79 (pag.
           360-362): la regola di non incrocio di Wigner e von Neumann (1929) — in una
           molecola biatomica possono intersecarsi soltanto i termini di diversa simmetria
           — che Landau dichiara essere «in realtà un teorema generale della meccanica
           quantistica».
           HEISENBERG non entra in questo movimento, e va detto invece di riempire il
           buco: il suo contributo e' interpretativo e sta sull'indeterminazione e sul
           microscopio a raggi gamma, non sulle simmetrie. Nessuna pagina delle sue

/* ---------------- 00 · DI COSA PARLA QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Di cosa parla questo movimento', meta:'Meccanica Quantistica · voci Q.7 e Q.8 · il capitolo che il docente consiglia · gli operatori dedotti invece che postulati · la parità, prima legge di conservazione solo quantistica',
  blocchi:[
  {t:'prosa', title:'Un corso che comincia dalle simmetrie, e perché questo cambia tutto', tag:'architettura', html:R`
  <p>I movimenti precedenti hanno costruito l&rsquo;apparato: lo <span class="str" data-str="spazio-di-hilbert">spazio di Hilbert</span>, le osservabili come <span class="str" data-str="operatore-aggiunto">operatori autoaggiunti</span>, il <span class="str" data-str="commutatore">commutatore</span> che decide la compatibilità, lo <span class="str" data-str="spettro">spettro</span> continuo e gli stati che non si normalizzano. Tutto quell&rsquo;apparato, come dice Ballentine aprendo il capitolo che questo movimento segue, «<i>has by itself very little physical content</i>»: non si può risolvere un solo problema fisico finché non si hanno le <b>regole di corrispondenza</b> che dicono quale operatore rappresenta quale variabile dinamica (pag. stampata 63).</p>
  <p>Ci sono due modi di darsi quelle regole, e la scelta fra i due è ciò che distingue questo corso da quasi ogni altro. Il primo modo è l&rsquo;analogia: si guarda l&rsquo;espressione classica $p^2/2m+V$, si sostituisce $p\to-i\hbar\,\partial/\partial x$, si giustifica la sostituzione con l&rsquo;onda di de Broglie e si va avanti. Il secondo modo è <b>dedurre gli operatori dalle simmetrie dello spazio-tempo</b>. Ballentine dichiara di seguire il secondo nella prefazione, e dice perché: le simmetrie «<i>are exploited in Chapter 3 in order to derive the fundamental operators for momentum, angular momentum, and the Hamiltonian</i>», al posto degli «<i>heuristic but inconclusive arguments based upon analogy and wave-particle duality</i>». È il libro che il docente di questo canale consiglia, ed è il capitolo 3 il motivo.</p>
  <p>Il guadagno non è di eleganza. <b>Il commutatore canonico $[\hat q,\hat p]=i\hbar$, che ogni corso assume come postulato, in questo movimento si dimostra</b> — e si dimostra a partire da un fatto geometrico elementare: traslare l&rsquo;origine delle coordinate sposta il valore della posizione e lascia intatto quello dell&rsquo;impulso. Allo stesso modo si ottengono la forma $\hat J=\hat Q\times\hat P$ del momento angolare, la forma $\hat H=\hat P^2/2M$ dell&rsquo;energia libera, e — risultato che quasi nessun manuale mostra — il fatto che le <i>uniche</i> interazioni compatibili con l&rsquo;invarianza di Galilei siano un potenziale scalare e un potenziale vettore.</p>`},
  {t:'prosa', title:'Il teorema, in tre righe, e le tre domande che apre', tag:'architettura', html:R`
  <p>L&rsquo;ossatura logica del movimento si scrive in tre righe, e vale leggerle una volta prima di cominciare perché tutto il resto è il loro svolgimento.</p>
  <p><b>Prima riga (Wigner).</b> Una trasformazione di simmetria deve conservare i moduli dei prodotti scalari, perché quelli sono le probabilità; e ogni mappa che li conserva è realizzata da un operatore <span class="str" data-str="operatore-unitario">unitario</span> oppure antiunitario. Per le trasformazioni <i>continue</i> resta solo la prima possibilità.</p>
  <p><b>Seconda riga (il generatore).</b> Una famiglia unitaria a un parametro con $U(0)=1$ e $U(s_1+s_2)=U(s_1)U(s_2)$ è l&rsquo;esponenziale di un operatore autoaggiunto: $U(s)=e^{iKs}$. L&rsquo;operatore $K$ si chiama <b>generatore</b>, e determina la trasformazione per ogni $s$, non solo per $s$ infinitesimo.</p>
  <p><b>Terza riga (Noether).</b> Se $H$ è invariante sotto quella famiglia, allora $[H,K]=0$, e allora non solo il valor medio di $K$ ma <i>tutta la sua distribuzione di probabilità</i> è indipendente dal tempo. <b>Il generatore di una simmetria è la quantità conservata</b>: l&rsquo;impulso perché genera le traslazioni, il momento angolare perché genera le rotazioni, l&rsquo;energia perché genera le traslazioni temporali.</p>
  <p>Le tre domande che questo apre, e a cui il movimento risponde, sono: <i>da dove viene la forma esplicita dei generatori</i> (tappe 04-06), <i>che cosa si osserva in laboratorio quando una simmetria c&rsquo;è</i> (tappe 07-08, e la risposta non è solo «qualcosa si conserva»: è anche «certi livelli sono degeneri» e «certe righe spettrali non si vedono»), e <i>che cosa succede con le simmetrie discrete</i>, che non hanno generatore (tappa 09).</p>`},
  {t:'prosa', title:'Come è fatto il movimento', tag:'architettura', html:R`
  <p><b>La rotta.</b> La tappa 01 fa il lavoro in meccanica classica, perché il programma di questo corso chiede le simmetrie «in MQ <i>e in meccanica hamiltoniana</i>» e perché senza di essa la mossa di Dirac non si capisce: le <span class="str" data-str="parentesi-di-poisson">parentesi di Poisson</span>, la trasformazione canonica generata da una funzione, e il teorema di Noether nella sua forma più breve. La 02 definisce che cosa sia una simmetria in meccanica quantistica e dimostra il teorema di Wigner nelle sue conseguenze, con la definizione operativa che ne dà Dirac — traslare uno stato vuol dire traslare l&rsquo;apparato che lo prepara — e con il problema della fase, che tre autori diversi incontrano e risolvono in tre modi. La 03 costruisce il generatore e ne ricava l&rsquo;esponenziale. La 04 è la prima tappa che produce fisica: l&rsquo;impulso <i>è</i> il generatore delle traslazioni, dimostrato per tre strade indipendenti, e il commutatore canonico ne è un corollario. La 05 calcola l&rsquo;algebra completa del gruppo di Galilei, con il metodo del prodotto quadruplo, e trova dentro di essa la massa come costante irremovibile. La 06 è il cuore: dai dieci generatori si deducono velocità, impulso, momento angolare e hamiltoniana, e $\hbar$ entra nella teoria come fattore di conversione fra generatori geometrici e variabili dinamiche. La 07 dimostra il teorema di conservazione nelle due direzioni e distingue costante del moto da stato stazionario. La 08 raccoglie la terza conseguenza, quella che si dimentica: le degenerazioni — il reticolo e il teorema di Bloch, le degenerazioni «accidentali» dell&rsquo;idrogeno, la regola di non incrocio. La 09 è la parità, dalla definizione fino alla sua violazione misurata nel 1956. La 10 tira il bilancio e svolge gli esercizi del capitolo.</p>
  <p><b>Che cosa questo movimento non fa.</b> Non svolge la dinamica: l&rsquo;operatore di evoluzione compare nella tappa 06 come il generatore del tempo e nella 07 come ciò che commuta con le costanti del moto, ma l&rsquo;equazione di Schrödinger come problema da risolvere, i due quadri e il teorema di Ehrenfest sono il contenuto di un altro lavoro, e qui si usa solo $i\hbar\,d|\Psi\rangle/dt=H|\Psi\rangle$ come definizione del generatore temporale. Non costruisce lo spettro del momento angolare: la tappa 06 dimostra che $\hat J=\hat Q\times\hat P$ e che le sue componenti chiudono l&rsquo;algebra $[\hat J_\alpha,\hat J_\beta]=i\hbar\varepsilon_{\alpha\beta\gamma}\hat J_\gamma$, e la soluzione di quell&rsquo;algebra — gli autovalori, gli operatori di salita, le armoniche sferiche — è un capitolo a sé. Non tratta lo spin se non per dire dove entra nel ragionamento di Jordan (caso (ii) della tappa 06) e per enunciare $[\hat S_\alpha,\hat S_\beta]=i\hbar\varepsilon_{\alpha\beta\gamma}\hat S_\gamma$. E non tratta l&rsquo;inversione temporale oltre il minimo necessario a esibire una simmetria <i>antiunitaria</i> e la degenerazione di Kramers che ne segue: è l&rsquo;unico punto in cui il ramo scartato del teorema di Wigner torna a servire.</p>`}
]},

/* ---------------- 01 · LA SIMMETRIA PRIMA DELLA MECCANICA QUANTISTICA ---------------- */
{ num:'01', title:'La simmetria prima della meccanica quantistica: Hamilton, Poisson, Noether', meta:'il programma chiede anche la meccanica hamiltoniana · ogni funzione genera un flusso · il teorema di Noether è una antisimmetria · dove il classico non dà niente',
  blocchi:[
  {t:'prosa', title:'Perché si comincia da qui, e non è un ripasso', tag:'architettura', html:R`
  <p>Il programma di questo corso chiede le «<i>simmetrie in MQ e in meccanica hamiltoniana</i>», e l&rsquo;accostamento non è una concessione al passato. La meccanica hamiltoniana è il posto in cui la parola «simmetria» ha già il significato tecnico che servirà: non «la figura è bella da entrambi i lati», ma <b>una trasformazione che preserva una struttura</b>. E la struttura preservata, in meccanica hamiltoniana, è una sola: le <span class="str" data-str="parentesi-di-poisson">parentesi di Poisson</span> fra le coordinate.</p>
  <p>Il punto di partenza è la <span class="str" data-str="trasformata-di-legendre">trasformata di Legendre</span> che porta dalla lagrangiana all&rsquo;hamiltoniana e, con essa, dallo spazio delle configurazioni allo <b>spazio delle fasi</b>: un sistema a $n$ gradi di libertà non è più un punto che si muove con una velocità, è un punto $(q_1,\dots,q_n,p_1,\dots,p_n)$ in uno spazio a $2n$ dimensioni. Questa non è una riscrittura cosmetica. Nello spazio delle fasi coordinate e impulsi sono <i>sullo stesso piano</i>, e diventa possibile chiedersi che cosa faccia una trasformazione che li mescola — domanda che nel formalismo di Newton non si può nemmeno formulare, perché lì $p$ è una conseguenza di $q$ e non una variabile indipendente.</p>
  <p>Ciò che segue è la risposta classica a tre domande, e sono le stesse tre a cui le tappe 02-07 risponderanno in meccanica quantistica: <i>che cosa genera una trasformazione</i>, <i>quando una trasformazione è una simmetria</i>, <i>che cosa si conserva quando lo è</i>. La corrispondenza fra le due risposte non è un&rsquo;analogia pedagogica: è la tesi di Dirac, che la tappa 02 citerà alla lettera, ed è il motivo per cui questa tappa non si può saltare.</p>`},
  {t:'reveal', title:'Ogni funzione sullo spazio delle fasi genera una trasformazione', tag:'costruzione', steps:[
   {label:'La definizione, e la sola struttura che conta', body:R`
   <p>Date due funzioni $f(q,p)$ e $g(q,p)$ sullo spazio delle fasi, la loro parentesi di Poisson è</p>
   $$\{f,g\}=\sum_k\Big(\frac{\partial f}{\partial q_k}\frac{\partial g}{\partial p_k}-\frac{\partial f}{\partial p_k}\frac{\partial g}{\partial q_k}\Big).$$
   <p>È bilineare, antisimmetrica — $\{f,g\}=-\{g,f\}$ — e soddisfa l&rsquo;identità di Jacobi. Applicata alle coordinate stesse dà le <b>parentesi fondamentali</b>: con un solo grado di libertà, $\partial q/\partial q=1$, $\partial p/\partial p=1$ e le derivate incrociate nulle, quindi</p>
   $$\{q,p\}=1,$$
   <p>mentre $\{q,q\}=\{p,p\}=0$ per antisimmetria. Con più gradi di libertà la stessa definizione dà $\{q_j,p_k\}=\delta_{jk}$.</p>
   <p><b>Una trasformazione si dice canonica quando preserva queste parentesi</b>, e nient&rsquo;altro è richiesto. È una definizione sorprendentemente povera, e la sua povertà è la sua forza: non si chiede che la trasformazione conservi l&rsquo;energia, né che rispetti la separazione fra coordinate e impulsi, né che venga da un cambiamento di sistema di riferimento. Si chiede solo che l&rsquo;unica relazione algebrica fra le variabili sopravviva.</p>`},
   {label:'Il flusso generato da g, e perché è canonico', body:R`
   <p>Si prenda una funzione $g(q,p)$ qualunque e si definisca, per $\varepsilon$ infinitesimo, lo spostamento</p>
   $$\delta q=\varepsilon\frac{\partial g}{\partial p},\qquad \delta p=-\varepsilon\frac{\partial g}{\partial q}.$$
   <p>Si verifica subito che questa trasformazione è canonica al primo ordine. Le nuove variabili sono $Q=q+\delta q$ e $P=p+\delta p$, e la loro parentesi vale</p>
   $$\{Q,P\}=1+\varepsilon\Big(\frac{\partial^2 g}{\partial q\,\partial p}-\frac{\partial^2 g}{\partial p\,\partial q}\Big)+O(\varepsilon^2),$$
   <p>e il termine di ordine $\varepsilon$ si annulla per il teorema di Schwarz: le due derivate seconde miste sono uguali. <b>Questo è il risultato che rende la parentesi di Poisson lo strumento centrale</b>: non esiste una funzione privilegiata che generi trasformazioni canoniche — le generano <i>tutte</i>, e ciascuna ne genera una diversa.</p>
   <p>La variazione di una qualunque osservabile $f$ sotto quel flusso si calcola con la regola della catena:</p>
   $$\delta f=\frac{\partial f}{\partial q}\delta q+\frac{\partial f}{\partial p}\delta p=\varepsilon\Big(\frac{\partial f}{\partial q}\frac{\partial g}{\partial p}-\frac{\partial f}{\partial p}\frac{\partial g}{\partial q}\Big),$$
   <p>cioè, in forma compatta,</p>
   $$\delta f=\varepsilon\{f,g\}.$$
   <p>La funzione $g$ si chiama per questo il <b>generatore</b> della trasformazione, e vale la pena notare che cosa significhi la formula: la parentesi di Poisson <i>è</i> la derivata di $f$ lungo il flusso di $g$. Shankar la scrive così a pag. stampata 287 proprio per poterne costruire l&rsquo;immagine quantistica, e nella tappa 02 si vedrà che l&rsquo;immagine è $\delta \hat f=-\tfrac{i\varepsilon}{\hbar}[\hat f,\hat G]$ con lo stesso $\varepsilon$ e lo stesso ruolo.</p>`},
   {label:'Tre generatori, tre trasformazioni, e nessuna coincidenza', body:R`
   <p>Si guardi che cosa generano le funzioni più semplici, perché i tre casi che seguono sono esattamente i tre che la tappa 06 ritroverà in meccanica quantistica.</p>
   <p><b>$g=p$ genera le traslazioni.</b> Con $g=p$ si ha $\partial g/\partial p=1$ e $\partial g/\partial q=0$, quindi $\delta q=\varepsilon$ e $\delta p=0$: il punto si sposta parallelamente all&rsquo;asse delle $q$ e l&rsquo;impulso non cambia. È <i>la</i> traslazione spaziale, e l&rsquo;impulso ne è il generatore.</p>
   <p><b>$g=L_z=xp_y-yp_x$ genera le rotazioni attorno a $z$.</b> Qui $\delta x=\varepsilon\,\partial L_z/\partial p_x=-\varepsilon y$ e $\delta y=+\varepsilon x$, che è la rotazione infinitesima di angolo $\varepsilon$; e sugli impulsi, $\delta p_x=-\varepsilon\,\partial L_z/\partial x=-\varepsilon p_y$, $\delta p_y=+\varepsilon p_x$, cioè la stessa rotazione applicata al vettore impulso. Un generatore ruota <i>tutto</i>, come deve.</p>
   <p><b>$g=H$ genera l&rsquo;evoluzione temporale.</b> Con $g=H$ le due formule del flusso diventano $\delta q=\varepsilon\,\partial H/\partial p$ e $\delta p=-\varepsilon\,\partial H/\partial q$, cioè le equazioni di Hamilton con $\varepsilon=dt$. Quindi l&rsquo;evoluzione nel tempo non è un processo di natura diversa dalle trasformazioni di simmetria: <b>è il flusso generato da una particolare funzione</b>, e in forma compatta</p>
   $$\dot f=\{f,H\}$$
   <p>per ogni osservabile $f$ che non dipenda esplicitamente dal tempo (se ne dipende si aggiunge $\partial f/\partial t$). Per $H=p^2/2m+V(q)$ i due casi espliciti si calcolano dalla definizione: la parentesi con la coordinata dà</p>
   $$\{q,H\}=\dfrac{p}{m},$$
   <p>cioè $\dot q=p/m$, la relazione fra impulso e velocità; e la parentesi con l&rsquo;impulso dà</p>
   $$\{p,H\}=-V'(q),$$
   <p>cioè $\dot p=-V'(q)$, la seconda legge di Newton. Le due leggi di Newton sono <i>un caso particolare</i> della formula del flusso, e il caso particolare è «prendi $g=H$».</p>`}
  ]},
  {t:'plot', title:'Il flusso di un generatore, disegnato nello spazio delle fasi',
   intro:R`<p>Lo spazio delle fasi di un grado di libertà, con $q$ sull&rsquo;asse orizzontale e $p$ sul verticale. Le frecce sono il campo $(\delta q,\delta p)=\varepsilon(\partial g/\partial p,-\partial g/\partial q)$: a sinistra per $g=p$, a destra per $g=H=(p^2+q^2)/2$, l&rsquo;oscillatore armonico in unità in cui $m=\omega=1$. Le curve bianche a destra sono tre traiettorie seguite dal flusso.</p>`,
   plots:[{kind:'phase', xr:[-2.2,2.2], yr:[-2.2,2.2], height:260, ticks:true,
     title:'il flusso di g = p: traslazione pura',
     fx:'1', fy:'0', n:13, xlabel:'q', ylabel:'p'},
    {kind:'phase', xr:[-2.2,2.2], yr:[-2.2,2.2], height:260, ticks:true,
     title:'il flusso di g = H: rotazione nello spazio delle fasi',
     fx:'y', fy:'-x', n:13, seeds:[[0.6,0],[1.2,0],[1.8,0]], xlabel:'q', ylabel:'p'}],
   leggi:R`<p><b>Che cosa guardare.</b> A sinistra tutte le frecce sono uguali e orizzontali: il flusso generato dall&rsquo;impulso sposta ogni punto dello spazio delle fasi della stessa quantità nella stessa direzione, e non tocca la coordinata verticale. È la traslazione, e si vede a occhio che conserva le aree — cosa che ogni flusso generato da una funzione fa, perché il campo $(\partial g/\partial p,-\partial g/\partial q)$ ha divergenza nulla per il teorema di Schwarz. A destra le frecce girano, e le tre traiettorie sono circonferenze concentriche: il flusso generato dall&rsquo;hamiltoniana dell&rsquo;oscillatore è una rotazione rigida dello spazio delle fasi.</p>
   <p><b>Che cosa impararne.</b> Le due figure sono lo <i>stesso tipo</i> di oggetto, e questo è il contenuto della tappa. L&rsquo;evoluzione temporale non è dipinta in modo diverso dalla traslazione: cambia la funzione generatrice, non la natura dell&rsquo;operazione. Da qui si legge anche il teorema della prossima sezione: se le frecce di destra — il flusso del tempo — sono <i>tangenti</i> alle curve di livello di un&rsquo;altra funzione $g$, allora $g$ non cambia durante il moto. Nel disegno di destra, $g=H$ stessa ha questa proprietà in modo banale (il flusso è tangente alle sue curve di livello, che sono le circonferenze): è la conservazione dell&rsquo;energia, vista come geometria.</p>`},
  {t:'reveal', title:'Il teorema di Noether in meccanica hamiltoniana è una antisimmetria', tag:'costruzione', steps:[
   {label:'La dimostrazione, in due righe', body:R`
   <p>Si supponga che l&rsquo;hamiltoniana sia <b>invariante</b> sotto il flusso generato da $g$, cioè che il valore di $H$ non cambi quando si sposta il punto lungo quel flusso. Per la formula appena ottenuta, l&rsquo;invarianza si scrive</p>
   $$\delta H=\varepsilon\{H,g\}=0\quad\Longleftrightarrow\quad \{H,g\}=0.$$
   <p>Ma la parentesi di Poisson è antisimmetrica, quindi $\{H,g\}=-\{g,H\}$, e per la formula del moto $\{g,H\}=\dot g$. Mettendo insieme le due cose:</p>
   $$\dot g=\{g,H\}=-\{H,g\}=0.$$
   <p><b>Il generatore della simmetria è la quantità conservata</b>, e la dimostrazione è tutta qui: una antisimmetria letta nei due versi. La stessa parentesi, $\{g,H\}$, dice <i>due cose diverse</i> a seconda di quale argomento si consideri il generatore: se è $g$, misura quanto cambia $H$ sotto la simmetria; se è $H$, misura quanto cambia $g$ nel tempo. Che le due letture coincidano a meno del segno è l&rsquo;intero teorema.</p>
   <p>Il verso inverso vale ugualmente: se $\dot g=0$ allora $\{H,g\}=0$ e il flusso generato da $g$ lascia $H$ invariata. <b>Simmetria e costante del moto non sono due fatti collegati: sono lo stesso fatto scritto in due modi.</b></p>`},
   {label:'I tre casi, e il conto che li chiude', body:R`
   <p>Applicato ai tre generatori della sezione precedente, il teorema dà i tre risultati che si imparano a memoria al primo anno — e qui si vede perché siano tre casi di uno.</p>
   <p><b>Omogeneità dello spazio.</b> Se $H$ non dipende da $q$, cioè se traslare il sistema non ne cambia l&rsquo;energia, allora $\{p,H\}=-\partial V/\partial q=0$: l&rsquo;impulso si conserva. Il conto è immediato per $H=p^2/2m+V(q)$, perché la parentesi con $p$ seleziona esattamente la derivata del potenziale e nient&rsquo;altro.</p>
   <p><b>Isotropia dello spazio.</b> Se $H$ è invariante per rotazioni attorno a $z$, cioè se $V$ dipende solo da $r=\sqrt{x^2+y^2+z^2}$, allora $\{L_z,H\}=0$ e $L_z$ si conserva. Vale la pena fare il conto almeno una volta: $\{L_z,H\}=\{xp_y-yp_x,\,p^2/2m+V\}$, e il pezzo cinetico dà $(p_xp_y-p_yp_x)/m=0$, mentre il pezzo potenziale dà $-x\,\partial V/\partial y+y\,\partial V/\partial x$, che per $V=V(r)$ vale $V'(r)(-xy/r+yx/r)=0$.</p>
   <p><b>Omogeneità del tempo.</b> Se $H$ non dipende esplicitamente da $t$, allora $\dot H=\{H,H\}=0$ per antisimmetria: l&rsquo;energia si conserva. Questo caso è notevole perché la dimostrazione è <i>vuota</i> — non serve calcolare niente, basta che la parentesi di una funzione con se stessa sia nulla — e la stessa vacuità si ritroverà in meccanica quantistica, dove $[H,H]=0$ è altrettanto banale.</p>`},
   {label:'Dove il classico non dà niente, e perché va segnato adesso', body:R`
   <p>C&rsquo;è una trasformazione che lascia invariata l&rsquo;hamiltoniana di un sistema isolato e che <b>non produce nessuna legge di conservazione classica</b>: l&rsquo;inversione spaziale $\mathbf r\to-\mathbf r$. La ragione è strutturale e si vede dal teorema appena dimostrato: l&rsquo;inversione non è una trasformazione <i>continua</i>, quindi non esiste nessun $\varepsilon$ infinitesimo e nessuna funzione $g$ che la generi. Senza generatore non c&rsquo;è niente da conservare.</p>
   <p>Landau lo dice in una riga che vale tenere a mente fin da ora, perché è il motivo per cui la tappa 09 esiste: «<i>Nella meccanica classica, l&rsquo;invarianza della funzione di Hamilton rispetto all&rsquo;inversione non porta a nuove leggi di conservazione. Nella meccanica quantistica, invece, la situazione è profondamente diversa</i>» (vol. III, pag. stampata 127). La differenza non è un dettaglio tecnico: è il primo punto in cui la meccanica quantistica <i>ha più simmetrie utili</i> della classica, e la ragione è che in meccanica quantistica una trasformazione si rappresenta con un operatore anche quando non è continua, e un operatore ha autovalori anche quando non è un esponenziale.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Il teorema di Noether che si vede nei corsi di meccanica analitica parte da una lagrangiana invariante e costruisce una corrente conservata. Quello di questa tappa parte da una parentesi di Poisson nulla. Sono lo stesso teorema?`,
    a:R`Sono due facce dello stesso, e la differenza di forma dipende da quale struttura si sceglie come primitiva. La versione lagrangiana parte dall&rsquo;azione: se la lagrangiana è invariante sotto una famiglia di trasformazioni a un parametro, esiste una combinazione delle coordinate e delle velocità la cui derivata temporale è nulla <i>sulle soluzioni delle equazioni del moto</i>. La versione hamiltoniana parte dalla struttura di Poisson: se $H$ è invariante sotto il flusso generato da $g$, allora $g$ è costante lungo il moto. Il legame è la trasformata di Legendre, che manda la famiglia di trasformazioni lagrangiane nel flusso generato dalla corrispondente $g$. La differenza che conta per questo corso è un&rsquo;altra: la versione hamiltoniana <b>nomina il generatore</b>. Nella versione lagrangiana la quantità conservata si costruisce con una ricetta; nella versione hamiltoniana essa <i>è</i> l&rsquo;oggetto che genera la simmetria, e questa identificazione è ciò che sopravvive alla quantizzazione — mentre la ricetta lagrangiana no.`},
   {q:R`Se ogni funzione sullo spazio delle fasi genera una trasformazione canonica, perché non ogni funzione è conservata?`,
    a:R`Perché generare una trasformazione e generare una <i>simmetria</i> sono cose diverse. Qualunque $g$ genera un flusso, e quel flusso è canonico: questo è un fatto di geometria dello spazio delle fasi, vero indipendentemente da quale sia il sistema fisico. Che quel flusso sia una simmetria dipende invece dall&rsquo;hamiltoniana: serve $\{H,g\}=0$, e quella è una condizione su $H$, non su $g$. Esempio concreto con $H=p^2/2m+kq^2/2$: la funzione $g=p$ genera le traslazioni, sempre; ma $\{p,H\}=-kq$, diverso da zero, quindi l&rsquo;impulso dell&rsquo;oscillatore armonico non si conserva — e giustamente, perché la molla gli fa cambiare velocità. Lo stesso generatore è una simmetria per la particella libera e non per l&rsquo;oscillatore. La trasformazione esiste in entrambi i casi; nel secondo, applicarla produce un sistema fisicamente diverso.`},
   {q:R`La figura mostra che il flusso generato da una funzione conserva le aree. Che cosa c&rsquo;entra questo con la meccanica quantistica?`,
    a:R`C&rsquo;entra per via di che cosa sostituisce l&rsquo;area. La conservazione delle aree nello spazio delle fasi — il teorema di Liouville — dice che il flusso canonico non comprime né dilata i volumi, e la ragione tecnica è che il campo $(\partial g/\partial p,-\partial g/\partial q)$ ha divergenza nulla. In meccanica quantistica l&rsquo;oggetto che non si comprime è la <i>norma</i>: la trasformazione che corrisponde a un flusso canonico è unitaria, e l&rsquo;unitarietà è esattamente la conservazione del prodotto scalare. Le due affermazioni hanno la stessa funzione nelle rispettive teorie — garantiscono che la trasformazione non crei né distrugga probabilità — e vengono dalla stessa fonte, cioè dall&rsquo;antisimmetria della struttura (parentesi di Poisson da un lato, commutatore dall&rsquo;altro). Non è un&rsquo;analogia vaga: la tappa 02 mostrerà che la richiesta di conservare le probabilità è <i>ciò che impone</i> l&rsquo;unitarietà, come la richiesta di preservare $\{q,p\}=1$ impone la canonicità.`}
  ]}
]},

/* ---------------- 02 · CHE COS'È UNA SIMMETRIA IN MECCANICA QUANTISTICA ---------------- */
{ num:'02', title:'Che cos’è una simmetria in meccanica quantistica: il teorema di Wigner', meta:'si conservano le probabilità, non i vettori · unitario oppure antiunitario · l’argomento della radice quadrata · la fase, vista da tre autori',
  blocchi:[
  {t:'prosa', title:'Che cosa deve restare identico, e perché la risposta non è «lo stato»', tag:'costruzione', html:R`
  <p>Tradurre «la fisica non cambia» in una condizione matematica richiede una scelta, e la scelta sbagliata è la più naturale. Non si può chiedere che una trasformazione di simmetria lasci invariato il vettore di stato, perché allora non trasformerebbe niente. Non si può chiedere nemmeno che lasci invariata l&rsquo;energia di uno stato arbitrario — Shankar lo osserva aprendo il capitolo 11 (pag. stampata 279): una particella in uno stato generico «<i>has neither a well-defined position nor a well-defined energy</i>», quindi quella richiesta non è nemmeno formulabile.</p>
  <p>Ciò che deve restare identico è <b>l&rsquo;insieme delle previsioni osservabili</b>, e in meccanica quantistica le previsioni osservabili sono di due specie: gli autovalori che una misura può dare, e le probabilità con cui li dà. Ballentine le elenca come due condizioni esplicite (pag. stampata 63-64). <b>Prima</b>: se $A|\varphi_n\rangle=a_n|\varphi_n\rangle$, dopo la trasformazione deve valere $A'|\varphi_n'\rangle=a_n|\varphi_n'\rangle$ con gli <i>stessi</i> autovalori, perché $A'$ rappresenta un&rsquo;osservabile «<i>essentially similar to A, differing only by transformation to another frame of reference</i>», e osservabili equivalenti devono avere lo stesso insieme di valori possibili. <b>Seconda</b>: se $|\psi\rangle=\sum_n c_n|\varphi_n\rangle$ e $|\psi'\rangle=\sum_n c_n'|\varphi_n'\rangle$, allora</p>
  $$|c_n|^2=|c_n'|^2,\qquad\text{cioè}\qquad |\langle\varphi_n|\psi\rangle|^2=|\langle\varphi_n'|\psi'\rangle|^2,$$
  <p>perché quei numeri «<i>express the equality of probabilities for equivalent events in the two frames of reference</i>».</p>
  <p>Si noti con precisione che cosa <i>non</i> è richiesto: non è richiesto che $\langle\varphi|\psi\rangle$ si conservi, ma solo il suo <b>modulo</b>. È una richiesta più debole, ed è la richiesta giusta — perché due vettori che differiscono per una fase descrivono lo stesso stato fisico, e pretendere la conservazione della fase significherebbe pretendere di più di quanto la fisica dica. Tutta la struttura della tappa esce da questa debolezza: proprio perché si chiede solo il modulo, la risposta contiene un caso in più di quello che si aspetterebbe.</p>`},
  {t:'reveal', title:'Il teorema di Wigner, e il caso in più', tag:'costruzione', steps:[
   {label:'L’enunciato', body:R`
   <p><b>Teorema (Wigner).</b> Ogni applicazione dello spazio dei vettori in sé che conservi il valore di $|\langle\varphi|\psi\rangle|$ può essere realizzata da un operatore $U$,</p>
   $$|\psi\rangle\to|\psi'\rangle=U|\psi\rangle,\qquad |\varphi\rangle\to|\varphi'\rangle=U|\varphi\rangle,$$
   <p>con $U$ <i>unitario</i> (e quindi lineare) <b>oppure</b> <i>antiunitario</i> (e quindi antilineare). Una dimostrazione elementare è quella di Bargmann (1964); Ballentine la cita e non la riporta, e qui si fa lo stesso — ciò che serve è il contenuto delle due alternative.</p>
   <p><b>Caso (a): $U$ unitario.</b> Per definizione $UU^\dagger=U^\dagger U=I$, e allora</p>
