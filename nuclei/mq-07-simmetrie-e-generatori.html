   <p>«<i>Such a quantity $K$ is called a constant of motion.</i>» E questa è la definizione precisa, non «il valor medio non cambia»: non cambia nessun momento, nessuna varianza, nessuna probabilità di trovare un valore in un intervallo. Se all&rsquo;istante iniziale c&rsquo;è il trenta per cento di probabilità che l&rsquo;impulso stia fra due valori, quel trenta per cento è lo stesso a ogni tempo successivo. <i>Il valor medio costante è una conseguenza, e la più debole fra quelle disponibili.</i></p>`},
   {label:'I tre esempi, e come si controlla che valgano', body:R`
   <p>I tre casi del teorema sono i tre generatori identificati nella tappa 06:</p>
   <p><b>Invarianza per traslazioni spaziali, e l&rsquo;impulso è una costante del moto.</b> Il controllo si fa in due righe. In una dimensione, con $H=-\tfrac{\hbar^{2}}{2m}\tfrac{d^{2}}{dx^{2}}+V(x)$ e $\hat p=-i\hbar\,d/dx$, il commutatore applicato a una funzione d&rsquo;onda qualunque dà</p>
   $$[H,\hat p]\psi=i\hbar\,V'(x)\,\psi(x).$$
   <p>Tutti i termini con la derivata terza di $\psi$ si cancellano, e sopravvive il solo termine in cui la derivata colpisce il potenziale. <b>L&rsquo;impulso si conserva se e solo se $V'=0$</b>, cioè se il potenziale è costante — che è esattamente l&rsquo;invarianza per traslazioni. Il commutatore <i>è</i> la forza, a meno di $i\hbar$: l&rsquo;equazione $d\langle\hat p\rangle/dt=-\langle V'\rangle$ è la seconda legge di Newton in valor medio, e qui esce come caso particolare della formula generale.</p>
   <p><b>Invarianza per rotazioni, e il momento angolare è una costante del moto.</b> In tre dimensioni, con $H=-\tfrac{\hbar^{2}}{2m}\nabla^{2}+V(r)$ e un potenziale che dipende <i>solo</i> dal modulo $r=\sqrt{x^{2}+y^{2}+z^{2}}$, applicando il commutatore con $J_3=-i\hbar(x\partial_y-y\partial_x)$ a una funzione arbitraria si ottiene</p>
   $$[H,J_3]\psi=0.$$
   <p>Il conto non è banale: la derivata rispetto a $x$ del potenziale produce $V'(r)\,x/r$ per la regola della catena, e il termine $x\cdot y/r-y\cdot x/r$ si annulla. <b>E vale controllare che il conto sappia anche rispondere diversamente</b>, perché un controllo che dà zero in ogni caso non controlla niente. Si prenda un potenziale che rompe la simmetria sferica, il più semplice possibile: $V=x$, cioè una forza uniforme lungo $x$. Lo stesso commutatore dà</p>
   $$[H,J_3]\psi=-i\hbar\,y\,\psi,$$
   <p>diverso da zero — e il membro di destra ha un&rsquo;interpretazione precisa. La forza associata a quel potenziale è</p>
   $$\mathbf F=-\nabla V=(-1,0,0),$$
   <p>e la componente $z$ del momento della forza vale</p>
   $$(\mathbf r\times\mathbf F)_3=y.$$
   <p>Inserendo il commutatore nella formula della derivata del valor medio, i due fattori immaginari si cancellano e resta</p>
   $$\frac{d}{dt}\langle J_3\rangle=\langle y\rangle=\langle(\mathbf r\times\mathbf F)_3\rangle.$$
   <p><b><i>Il commutatore con $H$ restituisce la coppia</i></b>, come il commutatore con l&rsquo;impulso restituiva la forza. Le due equazioni di Newton — quella per l&rsquo;impulso e quella per il momento angolare — sono lo stesso teorema di questa tappa, applicato a due generatori diversi, e scritto nel caso in cui la simmetria è rotta.</p>
   <p><b>Invarianza per traslazioni temporali, e l&rsquo;energia è conservata.</b> Questo caso è degenere in modo istruttivo: se $H$ non dipende da $t$, allora $H$ commuta con sé stesso, e la formula della derivata del valor medio dice che $H$ rappresenta una quantità conservata. Il generatore e l&rsquo;hamiltoniana sono lo <i>stesso</i> operatore, quindi «$H$ è invariante sotto le traslazioni temporali» e «$H$ non dipende dal tempo» sono la stessa affermazione. È il motivo per cui la conservazione dell&rsquo;energia non ha, in meccanica quantistica, una dimostrazione separata.</p>`}
  ]},
  {t:'reveal', title:'Costante del moto non è stato stazionario', tag:'costruzione', steps:[
   {label:'Lo stato stazionario, e i due quantificatori scambiati', body:R`
   <p>Ballentine mette in guardia esplicitamente: «<i>The concept of a constant of motion should not be confused with the concept of a stationary state.</i>» Vale seguire il perché, perché la distinzione è l&rsquo;unica cosa di questa tappa che si sbaglia leggendo in fretta.</p>
   <p>Si supponga $H$ indipendente da $t$ e si prenda come stato iniziale un autovettore dell&rsquo;energia, $|\Psi(0)\rangle=|E_n\rangle$ con $H|E_n\rangle=E_n|E_n\rangle$. La soluzione dell&rsquo;equazione del moto è semplicemente</p>
   $$|\Psi(t)\rangle=e^{-iE_nt/\hbar}|E_n\rangle,$$
   <p>cioè lo stato acquista una fase e nient&rsquo;altro. Allora, per <i>qualunque</i> osservabile $R$,</p>
   $$\langle R\rangle=\langle\Psi(t)|R|\Psi(t)\rangle=\langle E_n|R|E_n\rangle,$$
   <p>perché le due fasi coniugate si cancellano. E considerando funzioni di $R$ si ottiene che tutta la distribuzione $\mathrm{Prob}(R<x|\Psi)$ è indipendente dal tempo. <b>In uno stato stazionario non cambia niente, di nessuna osservabile.</b></p>
   <p>Si confronti con la costante del moto, e si guardi dove sta la parola «tutti»:</p>
   <p>— <b>stato stazionario</b>: <i>un</i> particolare stato, in cui le distribuzioni di <i>tutte</i> le osservabili sono costanti nel tempo;<br>
   — <b>costante del moto</b>: <i>una</i> particolare osservabile, la cui distribuzione è costante nel tempo in <i>tutti</i> gli stati.</p>
   <p>I due quantificatori sono scambiati, e le due nozioni non si implicano in nessuno dei due versi. L&rsquo;impulso di una particella libera è una costante del moto, e un pacchetto gaussiano in moto non è affatto uno stato stazionario — la sua posizione media si sposta. Viceversa, in uno stato stazionario di un atomo tutte le medie sono costanti, e la posizione non è per questo una costante del moto: in un altro stato dello stesso atomo la posizione media si muove.</p>`},
   {label:'Il battimento, e perché il tempo entra solo per differenze di energia', body:R`
   <p>Il caso che illumina la distinzione è la <i>sovrapposizione</i> di due stati stazionari, perché è il più semplice in cui qualcosa si muove davvero. Si prenda</p>
   $$|\Psi(t)\rangle=\tfrac{1}{\sqrt2}\Big(e^{-iE_1t/\hbar}|E_1\rangle+e^{-iE_2t/\hbar}|E_2\rangle\Big),$$
   <p>e si calcoli il valor medio di un&rsquo;osservabile $R$ i cui elementi di matrice fra i due autostati valgono $R_{11}$, $R_{22}$ e $R_{12}=R_{21}=\varrho$ reale. I termini diagonali non dipendono dal tempo; i due termini incrociati portano le fasi, e la loro somma è</p>
   $$\frac{e^{-i\omega t}+e^{i\omega t}}{2}=\cos\omega t,\qquad \omega=\frac{E_2-E_1}{\hbar},$$
   <p>cosicché</p>
   $$\langle R\rangle_t=\tfrac12(R_{11}+R_{22})+\varrho\cos\omega t.$$
   <p><b>Il valor medio oscilla</b>, con una frequenza fissata dalla <i>differenza</i> delle due energie. E qui si raccoglie un debito della tappa 06: la hamiltoniana era determinata a meno della costante additiva $E_0$, e l&rsquo;argomento allora era «nessun esperimento misura un&rsquo;energia assoluta». Questo conto lo dimostra. Aggiungere $E_0$ a $H$ sposta entrambe le energie della stessa quantità, lascia $\omega$ identica, e moltiplica lo stato per una fase globale $e^{-iE_0t/\hbar}$ che si cancella in ogni valor medio. <b>Il tempo entra nelle predizioni della meccanica quantistica soltanto attraverso differenze di energia</b>, e l&rsquo;indeterminazione di $E_0$ non è un difetto della derivazione: è la registrazione esatta di questo fatto.</p>
   <p>Si osservi anche che se $R$ fosse una costante del moto l&rsquo;oscillazione non ci sarebbe. Una costante del moto commuta con $H$, dunque — per il teorema sui commutatori nulli — ha una base di autovettori in comune con $H$, e i suoi elementi di matrice fra autostati di energia <i>diversa</i> sono nulli: $\varrho=0$, e il valor medio resta piatto. <i>Il termine oscillante esiste solo per le osservabili che non si conservano</i>, ed è questa la ragione per cui gli spettri si vedono: una riga spettrale è una frequenza di battimento fra due livelli, visibile perché l&rsquo;operatore di dipolo non commuta con l&rsquo;hamiltoniana.</p>`}
  ]},
  {t:'plot', title:'Che cosa oscilla e che cosa non oscilla: media di un’osservabile nel tempo',
   intro:R`<p>L&rsquo;asse orizzontale è $\omega t$ in radianti, con $\omega=(E_2-E_1)/\hbar$. La curva blu è $\langle R\rangle_t$ in una sovrapposizione dei due stati stazionari, con la media dei due elementi diagonali posta a uno e con l&rsquo;elemento fuori diagonale $\varrho$ posto a sei decimi; la verde è la stessa osservabile in uno dei due stati stazionari puri; la gialla è una costante del moto, in qualunque stato.</p>`,
   plots:[{kind:'func2d', xr:[0,13], yr:[0,2], height:250, ticks:true,
     title:'sovrapposizione, stato stazionario, costante del moto',
     curves:[{f:'1+0.6*Math.cos(x)', col:'#5aa9ff', width:2.4, label:'⟨R⟩ nella sovrapposizione'},
             {f:'1.2', col:'#6bdc9b', width:2.0, dash:true, label:'⟨R⟩ in uno stato stazionario'},
             {f:'0.5', col:'#ffc24a', width:2.0, label:'⟨K⟩, costante del moto'}],
     xlabel:'ωt', ylabel:'valor medio'}],
   leggi:R`<p><b>Che cosa guardare.</b> Tre curve, due piatte e una che oscilla — ma le due piatte lo sono per ragioni completamente diverse, e questa è l&rsquo;intera lettura della figura. La verde è piatta perché lo <i>stato</i> è speciale: è un autostato dell&rsquo;energia, e in quello stato nessuna osservabile si muove. La gialla è piatta perché l&rsquo;<i>osservabile</i> è speciale: è una costante del moto, e resta piatta anche nella sovrapposizione che fa oscillare la blu.</p>
   <p><b>Che cosa impararne.</b> Se si disponesse di un solo esperimento, misurando $\langle R\rangle$ due volte e trovando lo stesso valore non si saprebbe quale dei due casi si ha davanti. Il modo di distinguerli è <i>cambiare stato</i>: una costante del moto resta piatta in ogni stato che si prepari, uno stato stazionario smette di essere speciale appena si guarda un&rsquo;altra osservabile — che però, in quello stato, è anch&rsquo;essa piatta. La prova operativa è dunque: <b>per decidere se $R$ è una costante del moto si cambia lo stato; per decidere se lo stato è stazionario si cambia l&rsquo;osservabile.</b> Si noti infine che l&rsquo;ampiezza dell&rsquo;oscillazione della blu è $\varrho=R_{12}$, cioè un elemento di matrice <i>fuori diagonale</i> fra livelli di energia diversa: è la stessa quantità che, per l&rsquo;operatore di dipolo elettrico, decide se una riga spettrale si vede o no.</p>`},
  {t:'reveal', title:'La terza conseguenza: gli autovalori classificano gli stati stazionari', tag:'costruzione', steps:[
   {label:'Due operatori che commutano, e una base comune', body:R`
   <p>C&rsquo;è una conseguenza ulteriore che Ballentine ricava nelle ultime righe del §3.8 e che è il ponte verso il resto di questo movimento. Se $[K,H]=0$, i due operatori possiedono un insieme completo di autovettori <i>comuni</i>. Siccome gli autovettori di $H$ descrivono stati stazionari, questo significa che</p>
   <p><b>è possibile preparare stati stazionari in cui sia l&rsquo;energia sia la quantità conservata $K$ hanno valori definiti, senza dispersione statistica.</b></p>
   <p>E Ballentine chiude con una frase che sembra una nota pratica e invece è un programma: «<i>The eigenvalues of such constants of motion are very useful in classifying stationary states.</i>»</p>
   <p>Vale capire perché sia un programma. Un livello energetico, in generale, non è un singolo stato: è un autospazio, e può avere dimensione maggiore di uno. Gli autovalori delle costanti del moto <b>etichettano le direzioni dentro quell&rsquo;autospazio</b>, e sono gli unici numeri disponibili per farlo che abbiano un significato fisico — perché sono conservati, quindi l&rsquo;etichetta non cambia nel tempo. È il motivo per cui gli stati di un atomo si scrivono $|n,\ell,m\rangle$ e non con tre numeri qualunque: $\ell$ e $m$ sono autovalori di operatori che commutano con l&rsquo;hamiltoniana, e Picasso lo dice esattamente così al §13.6 (pag. stampata 214) elencando quali osservabili si possono includere nell&rsquo;insieme completo di un atomo isolato — «<i>comunque complicata sia la hamiltoniana</i>», aggiunge, perché l&rsquo;argomento non dipende dalla forma di $H$ ma solo dalle sue simmetrie.</p>
   <p>La domanda che questo apre, e che la tappa 08 raccoglie, è <i>perché</i> un livello dovrebbe avere dimensione maggiore di uno. La risposta è che la simmetria produce tre conseguenze osservabili e non una: la conservazione, che è il contenuto di questa tappa; la <b>degenerazione</b> dei livelli; e il fatto che certi elementi di matrice siano nulli, cioè che certe transizioni non avvengano.</p>`}
  ]},
  {t:'reveal', title:'Noether, e che cosa cambia rispetto al classico', tag:'architettura', steps:[
   {label:'La stessa struttura, tre differenze', body:R`
   <p>La tappa 01 ha stabilito la versione classica: ogni funzione $g$ sullo spazio delle fasi genera una trasformazione canonica, $\delta f=\varepsilon\{f,g\}$; prendendo $g=H$ si ottiene l&rsquo;equazione del moto $\dot f=\{f,H\}$; e l&rsquo;antisimmetria della parentesi fa il resto — se $g$ è una simmetria, cioè $\{H,g\}=0$, allora $\dot g=\{g,H\}=0$ e $g$ si conserva. Il teorema di Noether, nella sua forma più breve, <i>è</i> l&rsquo;antisimmetria della parentesi di Poisson.</p>
   <p>La struttura quantistica è la stessa con $\{\cdot,\cdot\}\to[\cdot,\cdot]/i\hbar$, ed è il contenuto della tesi di Dirac citata nella tappa 02 — «<i>le trasformazioni unitarie della teoria quantistica sono l&rsquo;analogo delle trasformazioni di contatto della teoria classica</i>». Ma tre cose non sono le stesse, e vale elencarle perché sono il guadagno di questa tappa:</p>
   <p><b>(i) Si conserva più di un valore.</b> In meccanica classica una quantità conservata è un numero che non cambia lungo la traiettoria. Qui ciò che non cambia è una <i>distribuzione di probabilità</i> intera, e l&rsquo;affermazione sul valor medio è il suo corollario più debole. La ragione tecnica è che $H$ commuta con ogni funzione del generatore, e in meccanica classica l&rsquo;enunciato corrispondente non ha contenuto aggiuntivo perché non c&rsquo;è dispersione da conservare.</p>
   <p><b>(ii) La conservazione è esatta sui singoli valori, non solo sulle medie.</b> Un autostato di una costante del moto resta un autostato con lo stesso autovalore: se all&rsquo;istante iniziale la misura di $K$ dà con certezza il valore $k$, lo darà con certezza a ogni tempo. Questo è il senso forte in cui gli autovalori possono fare da etichetta.</p>
   <p><b>(iii) Esistono simmetrie senza generatore.</b> È la differenza più grossa, e non ha nessun analogo classico utile. Una trasformazione <i>discreta</i> — l&rsquo;inversione degli assi, la riflessione, il cambio di segno del tempo — non appartiene a nessuna famiglia a un parametro, quindi non ha un generatore autoaggiunto e nulla di ciò che questa tappa ha dimostrato le si applica direttamente. Eppure dà luogo a una legge di conservazione, e a una classificazione degli stati, e a regole di selezione misurabili. Il meccanismo è diverso — l&rsquo;operatore che la realizza è esso stesso l&rsquo;osservabile conservata, invece di esserne l&rsquo;esponente — ed è il contenuto della tappa 09.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Il teorema dice che $[H,K]=0$ implica che la distribuzione di $K$ non cambia nel tempo. Ma $[H,H]=0$ sempre, anche per un&rsquo;hamiltoniana dipendente dal tempo. L&rsquo;energia è dunque sempre conservata?`,
    a:R`No, e il punto in cui l&rsquo;argomento si rompe è esattamente l&rsquo;avvertenza di Ballentine sul caso $H=H(t)$. La formula della derivata del valor medio ha <i>due</i> termini: quello con il commutatore e quello con $\partial R/\partial t$, che c&rsquo;è quando l&rsquo;operatore ha una dipendenza temporale intrinseca. Per $R=H$ con $H$ dipendente dal tempo il primo termine si annulla, ma il secondo no, e si ottiene $d\langle H\rangle/dt=\langle\partial H/\partial t\rangle$ — che è diverso da zero. Fisicamente: un atomo in un campo elettrico oscillante assorbe ed emette energia, e non c&rsquo;è niente di paradossale, perché il sistema non è isolato. <b>La condizione che conta non è $[H,K]=0$ da sola, ma quella insieme a $\partial K/\partial t=0$</b>, e il teorema si applica ai generatori di simmetria perché per loro la seconda è automatica: sono costruiti dalla geometria dello spazio-tempo, che non dipende dal tempo. L&rsquo;hamiltoniana è l&rsquo;unico generatore per cui la seconda condizione può fallire, perché è l&rsquo;unico che le interazioni ridefiniscono — come la tappa 06 ha stabilito.`},
   {q:R`Nel calcolo $[H,\hat p]\psi=i\hbar V'(x)\psi$ il risultato è proporzionale alla forza. Ma la forza, in generale, non è nulla: allora l&rsquo;impulso non si conserva quasi mai. Che cosa resta del teorema?`,
    a:R`Resta tutto, e la domanda scambia due cose: la simmetria del <i>sistema</i> con la simmetria dello <i>spazio</i>. Lo spazio è omogeneo — è il fatto geometrico da cui la tappa 04 ha dedotto il commutatore canonico — ma un particolare sistema fisico può non essere invariante per traslazioni, perché c&rsquo;è un potenziale che distingue i punti. In quel caso l&rsquo;impulso del sistema non si conserva, e giustamente: una pallina su un piano inclinato accelera. <b>Il teorema non dice «l&rsquo;impulso si conserva»: dice «l&rsquo;impulso si conserva se e solo se il potenziale è invariante per traslazioni»</b>, e il commutatore misura di quanto la seconda condizione è violata. Vale notare due casi intermedi che l&rsquo;espressione rende immediati. Se $V$ dipende solo da $x$ ma non da $y$ e $z$, allora $[H,\hat p_y]=[H,\hat p_z]=0$: si conservano <i>due componenti su tre</i>, e questo è ciò che si usa risolvendo un problema con un piano di simmetria. Se $V$ è periodico, $V(x+a)=V(x)$, l&rsquo;impulso non si conserva ma si conserva qualcos&rsquo;altro — il generatore di una traslazione <i>discreta</i>, e la tappa 08 mostra che cosa ne consegue.`},
   {q:R`La figura mostra che il valor medio oscilla con frequenza $(E_2-E_1)/\hbar$. Ma la sovrapposizione dei due autostati è uno stato ben definito dell&rsquo;atomo: perché l&rsquo;atomo «sa» di due livelli invece di stare in uno dei due?`,
    a:R`Perché «stare in uno dei due» non è una proprietà che uno stato arbitrario abbia. La sovrapposizione $\tfrac{1}{\sqrt2}(|E_1\rangle+|E_2\rangle)$ è uno stato legittimo — lo spazio degli stati è lineare, ed è il primo assioma — e in esso l&rsquo;energia non ha un valore definito: una misura dà $E_1$ o $E_2$ con probabilità un mezzo ciascuna, e quelle due probabilità <i>non cambiano nel tempo</i>, perché l&rsquo;energia è una costante del moto. Ciò che cambia nel tempo è la fase <i>relativa</i> fra le due componenti, e sono le fasi relative a essere osservabili — esattamente come nella tappa 04, dove la traslazione di un singolo autostato dell&rsquo;impulso era invisibile e quella di una sovrapposizione spostava il pacchetto. <b>Il battimento non è l&rsquo;atomo che oscilla fra due livelli</b>: è un&rsquo;osservabile che non commuta con $H$ — tipicamente il dipolo elettrico, che è dispari e quindi connette livelli di parità opposta — il cui valor medio dipende dalla fase relativa. Si noti il controllo di coerenza: se si misurasse l&rsquo;energia, la fase relativa diventerebbe inosservabile e l&rsquo;oscillazione sparirebbe, perché dopo la misura lo stato è uno dei due autostati. L&rsquo;oscillazione è una proprietà dello stato preparato, non un moto interno del sistema.`}
  ]}
]},

/* ---------------- 08 · LA CONSEGUENZA CHE SI DIMENTICA: LE DEGENERAZIONI ---------------- */
{ num:'08', title:'La conseguenza che si dimentica: le degenerazioni dei livelli', meta:'quando c è degenerazione la simmetria del mondo non è la simmetria degli autostati · il reticolo e il teorema di Bloch · la regola di non incrocio di Wigner e von Neumann · Kramers, e una simmetria antiunitaria',
  blocchi:[
  {t:'prosa', title:'Tre conseguenze, non una', tag:'architettura', html:R`
  <p>La tappa 07 ha dimostrato la prima conseguenza di una simmetria: qualcosa si conserva. Ma una simmetria produce <b>tre</b> effetti osservabili, e gli altri due si incontrano in laboratorio più spesso del primo:</p>
  <p><b>la degenerazione dei livelli</b> — certi stati diversi hanno esattamente la stessa energia, e la coincidenza non è una coincidenza;<br>
  <b>le regole di selezione</b> — certi elementi di matrice sono esattamente nulli, quindi certe transizioni non avvengono e certe righe spettrali non si vedono.</p>
  <p>Questa tappa raccoglie la seconda; la terza è il contenuto della tappa 09, dove la simmetria in questione è discreta e il meccanismo è diverso.</p>
  <p>Il fatto strutturale da cui tutto discende è uno, e Sakurai-Napolitano lo enuncia nel modo più memorabile parlando del reticolo cristallino: <b>«<i>When there is such degeneracy, the symmetry of the world need not be the symmetry of energy eigenkets</i>»</b> (pag. stampata 281). Cioè: se un livello è degenere, un autostato dell&rsquo;energia <i>non è obbligato</i> a essere un autostato della simmetria — perché la simmetria, agendo su di esso, lo manda in un altro stato della stessa energia invece che in un multiplo di sé. Ed è precisamente questa libertà che <i>produce</i> la degenerazione: il livello deve essere grande abbastanza da contenere tutte le immagini.</p>
  <p>La logica, in una riga: se $[H,K]=0$ e $|E\rangle$ è autostato di $H$, allora $K|E\rangle$ è ancora autostato di $H$ con lo <i>stesso</i> autovalore. Se il livello è non degenere, i due vettori devono essere proporzionali e $|E\rangle$ è anche autostato di $K$. Se il livello è degenere, non devono — e $K$ ruota il livello dentro sé stesso.</p>`},
  {t:'reveal', title:'Il reticolo: una degenerazione infinita, e la banda che ne nasce', tag:'esempio', steps:[
   {label:'Barriere infinite: infiniti stati fondamentali', body:R`
   <p>L&rsquo;esempio su cui si vede lavorare la degenerazione è una particella in un potenziale periodico, e Sakurai-Napolitano lo imposta nel caso limite in cui si ragiona a mani nude: barriere di altezza <i>infinita</i> fra siti adiacenti del reticolo. Qui la simmetria non è una traslazione qualunque ma la traslazione <b>discreta</b> di un passo reticolare, realizzata da un operatore $\tau(a)$ che commuta con $H$ — e si noti subito che una traslazione discreta non appartiene a nessuna famiglia a un parametro, quindi <i>non ha un generatore</i> nel senso della tappa 03.</p>
   <p>Con barriere infinite, uno stato in cui la particella è completamente localizzata nell&rsquo;$n$-esimo sito è un autostato dell&rsquo;energia: $H|n\rangle=E_0|n\rangle$, e la sua funzione d&rsquo;onda $\langle x'|n\rangle$ è diversa da zero solo in quel sito. Ma lo stesso vale per ogni altro sito, con la stessa energia: «<i>so actually there are denumerably infinite ground states</i>». <b>La degenerazione è numerabilmente infinita</b>, e la ragione è la simmetria di traslazione del reticolo.</p>
   <p>Ora il punto che la frase di apertura annunciava. L&rsquo;operatore di traslazione reticolare manda un sito nel successivo,</p>
   $$\tau(a)|n\rangle=|n+1\rangle,$$
   <p>quindi <b>$|n\rangle$ è autostato di $H$ e NON è autostato di $\tau(a)$</b> — pur essendo $\tau(a)$ una simmetria. «<i>This is quite consistent with our earlier theorem on symmetry because we have an infinitefold degeneracy.</i>» Il compito diventa allora trovare un autostato <i>simultaneo</i> dei due, e il mestiere è lo stesso che si usa per la doppia buca simmetrica: non $|R\rangle$ né $|L\rangle$ sono autostati della parità, ma le loro combinazioni simmetrica e antisimmetrica sì. Qui la combinazione giusta è una serie:</p>
   $$|\theta\rangle=\sum_{n=-\infty}^{+\infty}e^{in\theta}|n\rangle,\qquad-\pi\le\theta\le\pi.$$
   <p>Che sia autostato di $H$ è ovvio, perché ogni $|n\rangle$ lo è con la stessa energia. Che sia autostato di $\tau(a)$ si vede applicandolo e ribattezzando l&rsquo;indice: $\tau(a)|\theta\rangle=\sum e^{in\theta}|n+1\rangle=\sum e^{i(n-1)\theta}|n\rangle=e^{-i\theta}|\theta\rangle$. <b>L&rsquo;autovalore è una fase, e lo stato simultaneo è parametrizzato da un numero continuo $\theta$</b> — mentre l&rsquo;energia resta $E_0$, indipendente da $\theta$.</p>`},
   {label:'Barriere finite: la degenerazione si rompe e diventa una banda', body:R`
   <p>Si abbassino ora le barriere a un&rsquo;altezza grande ma finita. Lo stato localizzato $|n\rangle$ esiste ancora con la stessa proprietà $\tau(a)|n\rangle=|n+1\rangle$, ma la sua funzione d&rsquo;onda ha una coda che sconfina nei siti vicini, per effetto tunnel. Gli elementi diagonali di $H$ restano tutti uguali per invarianza traslazionale, $\langle n|H|n\rangle=E_0$; gli elementi fra siti lontani sono trascurabili, e si assume che contino solo i primi vicini — <i>approssimazione di legame forte</i>, «<i>tight-binding approximation</i>» — ponendo $\langle n\pm1|H|n\rangle=-\Delta$. Allora</p>
   $$H|n\rangle=E_0|n\rangle-\Delta|n+1\rangle-\Delta|n-1\rangle,$$
   <p>e <b>$|n\rangle$ non è più un autostato dell&rsquo;energia</b>. Si applichi $H$ alla combinazione $|\theta\rangle$, che è ancora autostato di $\tau(a)$ perché quel conto non è cambiato. I due termini fuori diagonale producono, raccogliendo $|n\rangle$, un fattore</p>
   $$e^{-i\theta}+e^{i\theta}=2\cos\theta,$$
   <p>e quindi</p>
   $$H|\theta\rangle=(E_0-2\Delta\cos\theta)|\theta\rangle.$$
   <p><b>L&rsquo;energia ora dipende da $\theta$</b>, e questa è la differenza che conta: «<i>The degeneracy is lifted as $\Delta$ becomes finite, and we have a continuous distribution of energy eigenvalues</i>». Gli autovalori riempiono un intervallo, la cui larghezza è</p>
   $$(E_0+2\Delta)-(E_0-2\Delta)=4\Delta,$$
   <p>cioè <b>quattro volte l&rsquo;ampiezza di salto fra primi vicini</b>. È la banda di energia di un solido, e la si è ottenuta senza risolvere nessuna equazione differenziale: l&rsquo;unico ingrediente è stato classificare gli stati con l&rsquo;autovalore di una simmetria.</p>
   <p>Lo stesso ragionamento dà il <b>teorema di Bloch</b>. Per la funzione d&rsquo;onda dello stato traslato si ha da un lato $\langle x'|\tau(a)|\theta\rangle=\langle x'-a|\theta\rangle$ — facendo agire $\tau(a)$ sul bra — e dall&rsquo;altro $e^{-i\theta}\langle x'|\theta\rangle$, facendolo agire sul ket. Uguagliando, e ponendo $\theta=ka$, la soluzione è</p>
   $$\langle x'|\theta\rangle=e^{ikx'}u_k(x'),$$
   <p>con $u_k$ periodica di periodo $a$. <i>La funzione d&rsquo;onda è un&rsquo;onda piana modulata da una funzione periodica.</i> E Sakurai-Napolitano mette l&rsquo;osservazione che rende il teorema potente: «<i>Notice that the only fact we used was that $|\theta\rangle$ is an eigenket of $\tau(a)$. In particular, the theorem holds even if the tight-binding approximation breaks down.</i>» <b>Il teorema di Bloch non dipende da nessuna approssimazione: dipende solo dalla simmetria.</b> Al variare di $\theta$ da $-\pi$ a $\pi$, il vettore d&rsquo;onda $k$ varia da $-\pi/a$ a $\pi/a$, che è la prima zona di Brillouin.</p>`}
  ]},
  {t:'plot', title:'La banda: come una degenerazione infinita diventa un intervallo continuo',
   intro:R`<p>L&rsquo;energia $E(\theta)=E_0-2\Delta\cos\theta$ in funzione di $\theta$ fra $-\pi$ e $\pi$, con $E_0=1$ e tre valori dell&rsquo;ampiezza di salto: $\Delta=0$ (barriere infinite), $\Delta=0{,}1$ e $\Delta=0{,}25$.</p>`,
   plots:[{kind:'func2d', xr:[-3.2,3.2], yr:[0.3,1.7], height:250, ticks:true,
     title:'E(θ) per tre altezze di barriera',
     curves:[{f:'1', col:'#ffc24a', width:2.2, label:'Δ = 0: livello unico, degenere'},
             {f:'1-0.2*Math.cos(x)', col:'#6bdc9b', width:2.2, label:'Δ = 0,1: banda stretta'},
             {f:'1-0.5*Math.cos(x)', col:'#5aa9ff', width:2.4, label:'Δ = 0,25: banda larga'}],
     xlabel:'θ = ka', ylabel:'E'}],
   leggi:R`<p><b>Che cosa guardare.</b> La curva gialla è piatta: a $\Delta=0$ tutti i valori di $\theta$ danno la stessa energia, cioè la degenerazione è completa e il parametro $\theta$ non si vede in nessuna misura di energia. Le altre due sono coseni rovesciati, e la loro <i>escursione verticale</i> è esattamente $4\Delta$: $0{,}4$ per la verde, $1{,}0$ per la blu. Il minimo è sempre in $\theta=0$ e il massimo ai bordi della zona, $\theta=\pm\pi$.</p>
   <p><b>Che cosa impararne.</b> Il parametro $\theta$ esiste in tutti e tre i casi — è l&rsquo;autovalore della simmetria, e la sua esistenza non dipende da $\Delta$ — ma <b>diventa osservabile solo quando la degenerazione si rompe</b>. Finché le barriere sono infinite, $\theta$ etichetta stati fisicamente indistinguibili quanto all&rsquo;energia; appena c&rsquo;è tunnel, $\theta$ <i>è</i> l&rsquo;energia, riscalata. Questo è il modello di come funziona ogni classificazione per simmetria: l&rsquo;etichetta la fornisce la simmetria, il valore fisico lo fornisce ciò che la rompe. Si noti anche il verso della dipendenza da $\Delta$: più le barriere sono basse, più la banda è larga — cioè <i>la delocalizzazione costa o guadagna energia</i>, e un elettrone che può saltare fra siti ha accesso a stati che un elettrone intrappolato non ha. È la ragione per cui i metalli conducono.</p>`},
  {t:'reveal', title:'La regola di non incrocio: due livelli con la stessa simmetria non si toccano', tag:'costruzione', steps:[
   {label:'Il modello a due livelli, risolto', body:R`
   <p>Si prenda il sistema più piccolo in cui due livelli possono avvicinarsi: uno spazio a due dimensioni, con hamiltoniana</p>
   $$H=\begin{pmatrix}E_1&V\\V&E_2\end{pmatrix},$$
   <p>dove $E_1$ ed $E_2$ sono le energie dei due stati in assenza di accoppiamento e $V>0$ è l&rsquo;elemento fuori diagonale che li connette. Gli autovalori si trovano risolvendo l&rsquo;equazione caratteristica $(E_1-E)(E_2-E)-V^{2}=0$, e sono</p>
   $$E_\pm=\frac{E_1+E_2}{2}\pm\sqrt{\Big(\frac{E_1-E_2}{2}\Big)^{2}+V^{2}}.$$
   <p>Che siano le radici giuste si controlla in un modo che non richiede di rifare la radice quadrata: la somma e il prodotto degli autovalori di una matrice $2\times2$ sono la sua traccia e il suo determinante, e qui</p>
   $$E_++E_-=E_1+E_2,$$
   $$E_+E_-=E_1E_2-V^{2}.$$
   <p>Entrambe tornano, quindi i due numeri scritti sopra sono effettivamente le radici dell&rsquo;equazione caratteristica.</p>
   <p>Ora la cosa che conta, ed è il <b>divario</b>:</p>
   $$E_+-E_-=\sqrt{(E_1-E_2)^{2}+4V^{2}}.$$
   <p>Si immagini di variare un parametro esterno — la distanza fra due nuclei in una molecola, un campo applicato — in modo che $E_1$ ed $E_2$ si avvicinino fino a coincidere. Nel punto in cui si incontrerebbero, $E_1=E_2$, il divario <b>non si annulla</b>:</p>
   $$E_+-E_-=2V.$$
   <p><b>I due livelli non si incrociano: si avvicinano fino a $2V$ e poi si respingono.</b> E la condizione per cui si incrocerebbero è una sola, $V=0$, cioè che l&rsquo;elemento di matrice che li connette sia <i>esattamente</i> nullo. Non piccolo: nullo.</p>`},
   {label:'Quando V è esattamente nullo, e il teorema di Wigner e von Neumann', body:R`
   <p>Un elemento di matrice è esattamente nullo quando una simmetria lo impone — ed è qui che questa tappa si allaccia alla terza conseguenza, quella delle regole di selezione. Landau-Lifsits imposta il discorso sulle molecole biatomiche e lo conclude in termini generali. Gli stati elettronici si classificano con gli autovalori degli operatori che commutano con l&rsquo;hamiltoniana — la proiezione del momento angolare sull&rsquo;asse, gli operatori di riflessione e di inversione, lo scambio degli elettroni — e, come stabilito nei paragrafi sulla parità, «<i>per una grandezza scalare il cui operatore commuta con gli operatori del momento angolare e dell&rsquo;inversione nell&rsquo;origine, gli elementi di matrice sono diversi da zero solo per transizioni fra gli stati con lo stesso momento e la stessa parità</i>». <b>Due stati di simmetria diversa hanno $V=0$ per ragioni di simmetria, non per caso.</b></p>
   <p>La conclusione, con l&rsquo;attribuzione che Landau dà per esteso:</p>
   <p><i>«in una molecola biatomica possono intersecarsi soltanto i termini di diversa simmetria, mentre l&rsquo;intersezione di termini con una stessa simmetria è impossibile (E. Wigner, J. von Neumann, 1929). Se da un calcolo approssimato risulta che due termini con una stessa simmetria si intersecano, nell&rsquo;approssimazione successiva questi termini risulteranno separati.»</i></p>
   <p>Quella seconda frase è una regola operativa, e val la pena averla in mano: <b>un incrocio fra livelli della stessa simmetria, trovato in un calcolo approssimato, è un artefatto dell&rsquo;approssimazione</b> e sparisce all&rsquo;ordine successivo. Chi vede due curve di livello che si tagliano, in un conto perturbativo, deve chiedersi se i due stati abbiano la stessa simmetria — e se l&rsquo;hanno, il taglio non c&rsquo;è.</p>
   <p>Landau sottolinea anche la portata del risultato, e vale citarlo perché corregge un&rsquo;impressione che il contesto molecolare suggerisce: <i>«questo risultato si riferisce non soltanto alla molecola biatomica, ma è in realtà un teorema generale della meccanica quantistica che vale sempre quando l&rsquo;hamiltoniano ha un certo parametro e, di conseguenza, i suoi autovalori sono funzioni di questo parametro»</i>. La condizione generale, in linguaggio di teoria dei gruppi, è che i due termini si riferiscano a <b>rappresentazioni irriducibili diverse</b> del gruppo di simmetria dell&rsquo;hamiltoniana.</p>
   <p>C&rsquo;è anche l&rsquo;eccezione apparente, e Landau la risolve in modo istruttivo: nello ione $\mathrm H_2^{+}$ certi termini con la stessa simmetria rispetto a rotazioni e riflessioni <i>possono</i> intersecarsi, perché sono caratterizzati anche da due numeri quantici ellittici. Ma la separabilità delle variabili nell&rsquo;equazione di Schrödinger «<i>significa che il suo hamiltoniano ha una simmetria più alta di quanto non risulti dalle sue proprietà geometriche</i>»: rispetto al gruppo di simmetria <i>totale</i>, quei termini sono di tipo diverso e la regola vale. <b>L&rsquo;eccezione non smentisce il teorema: segnala una simmetria che non si era vista.</b> È la stessa logica con cui, due passi più sotto, si spiegano le degenerazioni dette «accidentali».</p>`}
  ]},
  {t:'plot', title:'Incrocio evitato: due livelli che si respingono, e due che si tagliano',
   intro:R`<p>Un parametro esterno $\lambda$ sull&rsquo;asse orizzontale, con $E_1=\lambda$ ed $E_2=-\lambda$: senza accoppiamento i due livelli si incrociano in $\lambda=0$. Le due curve blu sono $E_\pm$ con accoppiamento $V=0{,}3$; le due tratteggiate sono i livelli non accoppiati, $V=0$.</p>`,
   plots:[{kind:'func2d', xr:[-1.5,1.5], yr:[-1.6,1.6], height:260, ticks:true,
     title:'E±(λ) con e senza accoppiamento',
     curves:[{f:'Math.sqrt(x*x+0.09)', col:'#5aa9ff', width:2.4, label:'E₊, V = 0,3'},
             {f:'-Math.sqrt(x*x+0.09)', col:'#5aa9ff', width:2.4, label:'E₋, V = 0,3'},
             {f:'x', col:'#ffc24a', width:1.6, dash:true, label:'E₁ = λ, V = 0'},
             {f:'-x', col:'#ff6b8a', width:1.6, dash:true, label:'E₂ = −λ, V = 0'}],
     xlabel:'λ', ylabel:'E'}],
   leggi:R`<p><b>Che cosa guardare.</b> Le due tratteggiate si tagliano nell&rsquo;origine: è l&rsquo;incrocio che un calcolo senza accoppiamento predice. Le due blu no — si avvicinano fino a una distanza minima di $2V=0{,}6$ e poi si allontanano, scambiandosi l&rsquo;andamento asintotico. Lontano dall&rsquo;origine le blu e le tratteggiate sono indistinguibili: l&rsquo;accoppiamento conta solo dove i due livelli sono vicini quanto $V$.</p>
   <p><b>Che cosa impararne.</b> Due cose, e la seconda è quella che si usa. La prima: il divario minimo misura direttamente l&rsquo;elemento di matrice che connette i due stati, e quindi <i>guardando uno spettro si legge un elemento di matrice</i> — è il metodo con cui si misurano gli accoppiamenti. La seconda: <b>ciò che si scambia nella regione di incrocio evitato non sono le energie ma i caratteri degli stati</b>. A $\lambda\ll0$ lo stato inferiore somiglia a $|2\rangle$, a $\lambda\gg0$ somiglia a $|1\rangle$, e nella regione centrale è una mescolanza a metà. Se si varia $\lambda$ molto lentamente il sistema segue la curva blu e cambia natura — passaggio adiabatico; se si varia in fretta <i>salta</i> da una curva all&rsquo;altra conservando la propria natura. È la ragione per cui gli incroci evitati sono il punto in cui la chimica avviene, e la ragione per cui un calcolo che li rappresenta come incroci veri sbaglia la fisica e non solo il numero.</p>`},
  {t:'reveal', title:'Le degenerazioni «accidentali», e che cosa significa spiegarne una', tag:'esempio', steps:[
   {label:'Che cosa conta come spiegazione', body:R`
   <p>Shankar apre il §15.4 con una domanda metodologica invece che con un conto, e vale seguirla perché fissa lo standard: «<i>first let us decide what it means to explain any degeneracy</i>». Il caso già compreso è la degenerazione $(2\ell+1)$ in $m$ a $\ell$ fissato, e la spiegazione ha tre passi:</p>
   <p><b>(1)</b> si identifica una simmetria dell&rsquo;hamiltoniana. Se $H$ dipende solo dalle «lunghezze» dei vettori operatori — $\mathbf P\cdot\mathbf P$, $\mathbf R\cdot\mathbf R$, $\mathbf L\cdot\mathbf L$ — è invariante per rotazioni.<br>
   <b>(2)</b> si trovano i generatori della simmetria, uno per ogni parametro libero che la definisce: per le rotazioni sono le tre componenti di $\mathbf L$, e per il teorema della tappa 07 sono tutte conservate.<br>
   <b>(3)</b> si costruisce con i generatori un operatore che <i>sposta</i> fra gli stati degeneri. Per le rotazioni è $L_-=L_x-iL_y$, che abbassa $m$ di una unità; e siccome $[L_-,H]=0$, abbassare $m$ non cambia l&rsquo;energia.</p>
   <p>«<i>This explains the degeneracy in $m$, for, starting with the state of highest $m$ at a given $\ell$, we can go down all the way to the lowest $m$ without changing the energy.</i>» <b>Spiegare una degenerazione significa esibire un operatore che connette gli stati degeneri e che commuta con l&rsquo;hamiltoniana.</b> Non basta osservare che le energie coincidono: bisogna produrre la scala che le percorre.</p>`},
   {label:'L’idrogeno e l’oscillatore: due simmetrie nascoste', body:R`
   <p>Ci sono due degenerazioni che questo schema non spiega al primo colpo, e che per questo si chiamano «accidentali»: nell&rsquo;atomo di idrogeno tutti gli stati con lo stesso $n$ hanno la stessa energia, <i>anche se hanno $\ell$ diverso</i>; e nell&rsquo;oscillatore armonico isotropo gli stati si raggruppano in livelli che mescolano $\ell$ che differiscono di due. La rotazione non le spiega, perché la rotazione non cambia $\ell$.</p>
   <p><b>L&rsquo;idrogeno.</b> Shankar è onesto sul punto difficile: «<i>Unfortunately the only obvious symmetry of the Coulomb Hamiltonian is rotational invariance. The additional symmetry, the one we are after, is very subtle and clearest in momentum space. We will not discuss it.</i>» E qui fa una mossa metodologica che vale imparare: <i>se non si trova la simmetria, si cercano i suoi generatori</i>, perché i generatori di una simmetria sono quantità conservate, e le quantità conservate di un problema si possono trovare senza conoscere la simmetria. Il problema di Coulomb ne ha una in più del momento angolare: il <b>vettore di Runge-Lenz</b>, conservato classicamente perché è ciò che fissa l&rsquo;orientamento dell&rsquo;ellisse. Le sue tre componenti sono dunque i generatori cercati.</p>
   <p>Il terzo passo si completa scrivendo il vettore in forma sferica e osservando che agendo su $|n\,\ell\,\ell\rangle$ produce uno stato di <i>uguale energia</i>, perché commuta con $H$, ma di momento angolare <i>maggiore di uno</i>: si comporta come il prodotto $|1\,1\rangle\otimes|\ell\,\ell\rangle=|\ell+1,\ell+1\rangle$. «<i>Using $\mathbf N$ we can connect all the different $\ell$ states at a given $n$, and using $L_-$ we can connect all the $m$ states at a given $\ell$.</i>» <b>Due scale invece di una, e il reticolo di stati degeneri è percorso per intero.</b> La degenerazione non era accidentale: era la traccia di una simmetria che non si vede guardando lo spazio delle configurazioni.</p>
   <p><b>L&rsquo;oscillatore isotropo.</b> Qui la simmetria si rivela riscrivendo $H$. Si definisce un vettore <i>complesso</i> le cui parti reale e immaginaria sono proporzionali a $\mathbf R$ e $\mathbf P$, e le componenti di quel vettore e del suo aggiunto sono gli operatori di abbassamento e innalzamento dei tre oscillatori lungo $x$, $y$, $z$. In quelle variabili l&rsquo;hamiltoniana è invariante sotto un gruppo più grande delle rotazioni — le rotazioni agiscono su tre numeri reali, il gruppo vero agisce su tre numeri complessi — e gli operatori costruiti con quel gruppo cambiano $\ell$ di due unità, che è esattamente la struttura osservata.</p>
   <p><b>La lezione generale</b>, ed è la stessa dell&rsquo;eccezione di Landau sullo ione $\mathrm H_2^{+}$: una degenerazione che le simmetrie geometriche non spiegano <i>non</i> è un caso. È un&rsquo;informazione su una simmetria dell&rsquo;hamiltoniana che non è geometrica, e il modo di trovarla è cercare le quantità conservate in più.</p>`}
  ]},
  {t:'reveal', title:'Kramers: una degenerazione imposta da una simmetria antiunitaria', tag:'esempio', steps:[
   {label:'L’inversione temporale non dà una legge di conservazione', body:R`
   <p>Resta un caso che chiude il cerchio con il teorema di Wigner della tappa 02, e che è l&rsquo;unico punto di questo movimento in cui il ramo <i>scartato</i> di quel teorema torna a servire. La tappa 02 aveva stabilito che una trasformazione di simmetria è realizzata da un operatore unitario oppure antiunitario, e che per le trasformazioni <i>continue</i> resta solo la prima possibilità. L&rsquo;inversione temporale non è continua, e il suo operatore — lo si chiami $\Theta$ — è <b>antiunitario</b>.</p>
   <p>La prima conseguenza è negativa, e Sakurai-Napolitano la dichiara subito. Anche quando $[\Theta,H]=0$, «<i>unlike the parity case, this does not lead to an interesting conservation law</i>», e la ragione è che</p>
   $$\Theta\,U(t,t_0)\neq U(t,t_0)\,\Theta$$
   <p>pur essendo $\Theta$ commutante con $H$: l&rsquo;operatore di evoluzione contiene $i$, e un operatore antilineare ne cambia il segno. «<i>As a result, there is no such thing as the “conservation of time-reversal quantum number.”</i>» <b>Tutto l&rsquo;apparato della tappa 07 non si applica</b>, e non perché manchi il generatore — anche la parità ne è priva, e lì una legge di conservazione c&rsquo;è — ma perché l&rsquo;antilinearità rompe il passaggio fra la simmetria e l&rsquo;evoluzione temporale.</p>
   <p>C&rsquo;è però una conseguenza non banale, e in due specie diverse. La prima è una restrizione di fase: la <i>realtà</i> della funzione d&rsquo;onda di uno stato non degenere, per un sistema senza spin. La seconda è una degenerazione, ed è il punto di questa tappa.</p>`},
   {label:'Θ² = −1, e due livelli dove ce ne sarebbe stato uno', body:R`
   <p>Siano $|n\rangle$ un autostato dell&rsquo;energia e $\Theta|n\rangle$ il suo invertito nel tempo. Dalla commutazione con $H$ segue che i due hanno la <i>stessa</i> energia: $H\Theta|n\rangle=\Theta H|n\rangle=E_n\Theta|n\rangle$. La domanda è se siano lo stesso stato. Se lo fossero, potrebbero differire al più per una fase, $\Theta|n\rangle=e^{i\delta}|n\rangle$; applicando $\Theta$ di nuovo, e ricordando che $\Theta$ è antilineare e coniuga le costanti,</p>
   $$\Theta^{2}|n\rangle=\Theta e^{i\delta}|n\rangle=e^{-i\delta}\Theta|n\rangle=e^{-i\delta}e^{i\delta}|n\rangle=|n\rangle,$$
   <p>cioè $\Theta^{2}=+1$. <b>Ma per un sistema con momento angolare semintero $\Theta^{2}$ vale sempre $-1$</b>, e lo si verifica sulla rappresentazione più piccola. Per uno spin un mezzo l&rsquo;operatore di inversione temporale è $\Theta=-i\sigma_y\mathcal K$, con $\mathcal K$ la coniugazione complessa e $\sigma_y$ una delle <span class="str" data-str="matrici-di-pauli">matrici di Pauli</span>; applicandolo due volte, la parte antilineare coniuga la matrice e</p>
   $$(-i\sigma_y)(-i\sigma_y)^{*}=-\mathbb 1.$$
   <p>I due risultati sono incompatibili, quindi l&rsquo;ipotesi di partenza è falsa: <b>$|n\rangle$ e $\Theta|n\rangle$ devono essere stati <i>distinti</i> con la stessa energia, cioè c&rsquo;è una degenerazione.</b> «<i>This means, for instance, that for a system composed of an odd number of electrons in an external electric field, each energy level must be at least twofold degenerate no matter how complicated $\mathbf E$ may be.</i>»</p>
   <p>Si pesi la clausola «<i>no matter how complicated</i>»: non c&rsquo;è nessuna ipotesi di simmetria <i>spaziale</i> sul campo. Un cristallo con una struttura locale arbitrariamente storta, senza nessun asse e nessun piano di riflessione, ha comunque tutti i livelli almeno doppi se il numero di elettroni è dispari. <b>È una degenerazione garantita da una simmetria che non ha niente a che fare con la geometria dello spazio.</b> E si rompe nel modo che l&rsquo;argomento prevede: un campo <i>magnetico</i> contiene termini come $\mathbf S\cdot\mathbf B$ e $\mathbf p\cdot\mathbf A+\mathbf A\cdot\mathbf p$, che sono dispari sotto inversione temporale, quindi $\Theta H\neq H\Theta$ e la degenerazione di Kramers si solleva.</p>
   <p>La nota storica che Sakurai-Napolitano aggiunge dice qualcosa sul metodo e vale riportarla: «<i>Historically, Kramers inferred degeneracy of this kind by looking at explicit solutions of the Schrödinger equation; subsequently, Wigner pointed out that Kramers degeneracy is a consequence of time-reversal invariance.</i>» <b>Una degenerazione trovata risolvendo, e spiegata dieci anni dopo da una simmetria</b> — che è la storia di questa intera tappa, ripetuta una terza volta dopo le degenerazioni «accidentali» e dopo l&rsquo;eccezione dello ione $\mathrm H_2^{+}$.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Nel reticolo, l&rsquo;operatore di traslazione $\tau(a)$ commuta con $H$ ed è una simmetria, ma lo stato localizzato $|n\rangle$ non ne è autostato. La tappa 07 non diceva che gli autovalori delle costanti del moto classificano gli stati stazionari?`,
    a:R`Lo diceva, e lo dice ancora: il teorema garantisce l&rsquo;esistenza di un insieme <i>completo</i> di autovettori comuni a $H$ e $\tau(a)$, non che <i>ogni</i> autovettore di $H$ sia autovettore di $\tau(a)$. La differenza esiste solo in presenza di degenerazione, ed è la frase di Sakurai-Napolitano citata all&rsquo;inizio di questa tappa. Concretamente: il livello $E_0$ del reticolo con barriere infinite è degenere infinite volte, e in quell&rsquo;autospazio enorme esistono <i>molte</i> basi — quella dei $|n\rangle$, utile per dire dove sta la particella, e quella dei $|\theta\rangle$, che è la base comune che il teorema promette. <b>La base dei siti è una scelta legittima che però non diagonalizza la simmetria</b>, e il prezzo si vede appena si accende il tunnel: con $\Delta\neq0$ i $|n\rangle$ smettono di essere autostati dell&rsquo;energia, mentre i $|\theta\rangle$ restano autostati di entrambi e danno la banda. La morale operativa è che quando un livello è degenere si <i>sceglie</i> la base, e la scelta giusta è quasi sempre quella che diagonalizza le simmetrie — perché è l&rsquo;unica che resta buona quando la degenerazione si rompe.`},
   {q:R`La regola di non incrocio dice che due livelli della stessa simmetria non si toccano mai. Ma il livello $n=2$ dell&rsquo;idrogeno contiene stati con $\ell=0$ e $\ell=1$ che hanno la stessa energia: non è un incrocio, è una coincidenza esatta. Dove sta la differenza?`,
    a:R`Nella simmetria dei due stati, e la risposta è lo stesso meccanismo dell&rsquo;eccezione di Landau sullo ione $\mathrm H_2^{+}$. Gli stati con $\ell=0$ e $\ell=1$ <b>non hanno la stessa simmetria</b>: appartengono a rappresentazioni irriducibili diverse del gruppo delle rotazioni, e per questo l&rsquo;elemento di matrice dell&rsquo;hamiltoniana fra loro è esattamente nullo — e un $V$ esattamente nullo è precisamente la condizione sotto la quale il modello a due livelli di questa tappa predice un incrocio vero. La loro degenerazione è quindi permessa dal teorema di Wigner e von Neumann, non un&rsquo;eccezione. <i>Ma resta da spiegare perché avvenga</i>, e quella è la questione delle degenerazioni «accidentali»: il teorema dice che <i>può</i> succedere, il vettore di Runge-Lenz dice perché <i>succede</i>. <b>I due enunciati fanno lavori opposti</b>: la regola di non incrocio proibisce coincidenze fra stati della stessa simmetria, la simmetria nascosta spiega coincidenze fra stati di simmetria diversa. Fra i due non resta spazio per una coincidenza davvero accidentale, ed è questo il contenuto profondo della tappa.`},
   {q:R`La degenerazione di Kramers vale «qualunque sia la complessità del campo elettrico», e si rompe con un campo magnetico. Ma un campo magnetico è prodotto da correnti, che sono cariche in moto: perché l&rsquo;inversione temporale distingue i due casi?`,
    a:R`Perché nei due casi si sta invertendo il tempo di <i>sistemi diversi</i>, e Sakurai-Napolitano mette l&rsquo;avvertenza esattamente qui. Quando si tratta $\mathbf B$ come campo <b>esterno</b>, non lo si cambia sotto inversione temporale: l&rsquo;elettrone atomico è considerato un sistema quantistico chiuso, e l&rsquo;operatore $\Theta$ si applica a lui e non al mondo. In quel conto $\mathbf S$ e $\mathbf p$ sono dispari, $\mathbf B$ è un parametro fisso, e i termini $\mathbf S\cdot\mathbf B$ e $\mathbf p\cdot\mathbf A$ cambiano segno: l&rsquo;hamiltoniana non è invariante e Kramers cade. Il campo elettrico invece non rompe niente, perché $\mathbf E$ accoppia al potenziale elettrostatico, che è una funzione <i>reale della posizione</i> — e la posizione è pari sotto inversione temporale. <b>La distinzione è fra invertire il tempo del sistema e invertire il tempo dell&rsquo;universo</b>: se si invertisse tutto, comprese «<i>even the currents in the wire that produces the $\mathbf B$ field</i>», il campo magnetico cambierebbe segno e l&rsquo;invarianza si ripristinerebbe — ma quella non è la trasformazione che interessa, perché la domanda fisica è se <i>questo</i> elettrone, in <i>quel</i> campo, abbia livelli doppi.`}
  ]}
]},

/* ---------------- 09 · LA PARITÀ ---------------- */
{ num:'09', title:'La parità: la prima legge di conservazione che la meccanica classica non dà', meta:'una simmetria discreta non ha generatore ed è essa stessa l osservabile · la linearità dimostrata col commutatore canonico · parità alternata e stato fondamentale sempre pari · le regole di selezione, e la violazione del 1956',
  blocchi:[
  {t:'prosa', title:'La frase di Landau, e perché questa tappa esiste', tag:'architettura', html:R`
  <p>Tutte le simmetrie di questo movimento, fino a qui, sono state <i>continue</i>: famiglie a un parametro, ciascuna con il suo generatore autoaggiunto, e il generatore era la quantità conservata. L&rsquo;inversione spaziale $\mathbf x\to-\mathbf x$ non è di questa specie. Non c&rsquo;è nessun parametro da far tendere a zero: o si invertono gli assi o non si invertono, e non esiste un&rsquo;inversione infinitesima. Quindi <b>non c&rsquo;è nessun generatore</b>, e tutto l&rsquo;apparato delle tappe 03-07 non si applica.</p>
  <p>Eppure una legge di conservazione c&rsquo;è, ed è una legge che in meccanica classica <i>non esiste</i>. Landau-Lifsits lo dice in due frasi, ed è la ragione per cui questa tappa sta in questo movimento:</p>
  <p><i>«Nella meccanica classica, l&rsquo;invarianza della funzione di Hamilton rispetto all&rsquo;inversione non porta a nuove leggi di conservazione. Nella meccanica quantistica, invece, la situazione è profondamente diversa.»</i> (pag. stampata 127)</p>
  <p>Vale fermarsi un istante su <i>perché</i> sia diversa, perché la risposta è il contenuto strutturale dell&rsquo;intera tappa. In meccanica classica una simmetria serve per il tramite del suo generatore: la trasformazione è utile solo se è generata da una funzione, e quella funzione è la quantità conservata. Una trasformazione discreta non è generata da niente, quindi non produce niente. In meccanica quantistica la simmetria è realizzata da un <b>operatore</b> — e un operatore autoaggiunto <i>è già</i> un&rsquo;osservabile. Non serve estrarne un generatore: <b>l&rsquo;operatore che realizza la simmetria è esso stesso la quantità conservata</b>, e i suoi autovalori sono i valori misurabili. Dove il classico ha bisogno di un passaggio in più che non è disponibile, il quantistico non ha bisogno di nessun passaggio.</p>
  <p>La tappa segue questo filo: si dimostra che l&rsquo;operatore di parità deve essere lineare (e la dimostrazione passa dal commutatore canonico della tappa 04), si trova che ha autovalori $\pm1$, si vede che cosa questo impone alle autofunzioni in una dimensione, si deduce l&rsquo;assenza di momenti di dipolo permanenti, si ricavano le regole di selezione — che sono la conseguenza <i>misurabile</i> — e si chiude con l&rsquo;esperimento del 1956 che ha mostrato che la natura non rispetta questa simmetria.</p>`},
  {t:'reveal', title:'L’operatore di parità deve essere lineare, e lo decide il commutatore canonico', tag:'costruzione', steps:[
   {label:'La definizione per azione sugli operatori', body:R`
   <p>L&rsquo;operatore si indica con $\Pi$ — Ballentine spiega la scelta della lettera: «<i>since the symbol $P$ is already in use for momentum, and also for probability</i>» — e si definisce non per la sua azione sugli stati ma per <b>come trasforma le osservabili</b>:</p>
   $$\Pi\mathbf Q\Pi^{-1}=-\mathbf Q,\qquad\Pi\mathbf P\Pi^{-1}=-\mathbf P.$$
   <p>Da queste due segue immediatamente che il momento angolare orbitale $\mathbf L=\mathbf Q\times\mathbf P$ <i>non</i> cambia, perché è il prodotto di due oggetti che cambiano entrambi segno. Picasso lo registra nella forma $I\mathbf LI^{-1}=\mathbf L$ e ne trae la conseguenza giusta: «<i>$\mathbf L$ è quindi uno scalare</i>» rispetto all&rsquo;inversione (§10.4, pag. stampata 171). La proprietà si estende <i>per definizione</i> a qualunque momento angolare, spin compreso:</p>
   $$\Pi\mathbf J\Pi^{-1}=\mathbf J.$$
   <p>Che sia per definizione e non per deduzione va detto: lo spin non è $\mathbf Q\times\mathbf P$, e il suo comportamento sotto inversione è una scelta — quella che lo fa comportare come un momento angolare, cioè come un <b>vettore assiale</b>. Un vettore polare (posizione, impulso, campo elettrico) cambia segno sotto inversione; un vettore assiale (momento angolare, spin, campo magnetico) non cambia. È la distinzione su cui si reggono le regole di selezione in fondo alla tappa, e su cui si regge l&rsquo;argomento dell&rsquo;esperimento del 1956.</p>`},
   {label:'Lineare o antilineare? Lo decide [Q,P] = iℏ', body:R`
   <p>Il teorema di Wigner, enunciato nella tappa 02, lascia due possibilità: una trasformazione di simmetria è realizzata da un operatore unitario (lineare) oppure antiunitario (antilineare). Per le trasformazioni <i>continue</i> la tappa 02 aveva escluso la seconda con l&rsquo;argomento della radice quadrata. Per una simmetria discreta quell&rsquo;argomento non c&rsquo;è, e la domanda si riapre. Ballentine la decide con un conto di tre righe, e <b>il conto usa il commutatore canonico</b> — cioè il risultato della tappa 04.</p>
   <p>Si trasformi la relazione $Q_\alpha P_\alpha-P_\alpha Q_\alpha=i\hbar$ con $\Pi$:</p>
   $$\Pi Q_\alpha\Pi^{-1}\Pi P_\alpha\Pi^{-1}-\Pi P_\alpha\Pi^{-1}\Pi Q_\alpha\Pi^{-1}=\Pi\,i\hbar\,\Pi^{-1}.$$
   <p>A sinistra i due segni meno si cancellano a coppie e si riottiene $Q_\alpha P_\alpha-P_\alpha Q_\alpha$. A destra resta $\Pi i\Pi^{-1}\hbar$. L&rsquo;uguaglianza è dunque compatibile con la relazione di partenza <b>se e solo se</b></p>
   $$\Pi\,i\,\Pi^{-1}=i,$$
   <p>e questo è vero se $\Pi$ è lineare, falso se è antilineare — perché un operatore antilineare coniuga le costanti e darebbe $-i$. <b>Quindi l&rsquo;operatore di parità è unitario, e non può essere antiunitario</b>, con $\Pi^{-1}=\Pi^\dagger$.</p>
   <p>Si noti dove si è appoggiato l&rsquo;argomento. Non su una proprietà geometrica dell&rsquo;inversione, ma sul fatto che posizione e impulso abbiano quel commutatore — cioè, risalendo la catena della tappa 04, sull&rsquo;<i>omogeneità dello spazio</i>. È l&rsquo;unico punto di questo movimento in cui una proprietà della traslazione decide qualcosa su una simmetria che non c&rsquo;entra niente con le traslazioni, e vale registrarlo come esempio di quanto l&rsquo;algebra sia vincolante: fissato $[\hat q,\hat p]=i\hbar$, non si è più liberi di scegliere la natura degli operatori che lo rispettano.</p>
   <p>Resta da fissare $\Pi^{2}$. Due inversioni consecutive non producono nessun cambiamento, quindi $|\Psi\rangle$ e $\Pi^{2}|\Psi\rangle$ descrivono lo stesso stato e $\Pi^{2}$ può differire dall&rsquo;identità al più per una fase. Le equazioni di definizione non la fissano — ogni fase in $\Pi$ si cancella con quella in $\Pi^{-1}$ — e si sceglie uno:</p>
   $$\Pi=\Pi^{-1}=\Pi^\dagger.$$
   <p><b>Questa è la proprietà che rende la parità un&rsquo;osservabile</b>: $\Pi$ è autoaggiunto <i>e</i> unitario, caso raro, e da $\Pi^{2}=1$ segue che i suoi autovalori sono $\pm1$. Ballentine commenta la scelta alternativa in una nota: con $\Pi^{2}=e^{i\theta}$ si otterrebbe $\Pi\Psi(x)=e^{i\theta/2}\Psi(-x)$, e «<i>this would only be a complicating nuisance, without any physical significance</i>». Landau arriva allo stesso punto con un passaggio diverso, partendo dall&rsquo;azione sulla funzione d&rsquo;onda invece che sugli operatori: $P\psi(\mathbf r)=\psi(-\mathbf r)$, l&rsquo;azione ripetuta è l&rsquo;identità, dunque $P^{2}=1$ e $P=\pm1$ — «<i>le autofunzioni dell&rsquo;operatore d&rsquo;inversione spaziale o non cambiano affatto sotto la sua azione, o cambiano di segno. Nel primo caso la funzione d&rsquo;onda (e lo stato corrispondente) si dice pari, nel secondo caso dispari.</i>»</p>`},
   {label:'L’azione sui ket e sulle funzioni d’onda', body:R`
   <p>Resta da ricavare, invece di assumere, che $\Pi$ faccia alla funzione d&rsquo;onda ciò che si aspetta. Si applichi $\Pi$ a un autovettore della posizione, usando la definizione:</p>
   $$\Pi Q_\alpha|\mathbf x\rangle=\Pi x_\alpha|\mathbf x\rangle=x_\alpha\Pi|\mathbf x\rangle,$$
   <p>e, d&rsquo;altra parte, inserendo $\Pi^{-1}\Pi$ e usando $\Pi\mathbf Q\Pi^{-1}=-\mathbf Q$,</p>
   $$\Pi Q_\alpha|\mathbf x\rangle=\Pi Q_\alpha\Pi^{-1}\Pi|\mathbf x\rangle=-Q_\alpha\Pi|\mathbf x\rangle.$$
   <p>Confrontando: $Q_\alpha(\Pi|\mathbf x\rangle)=-x_\alpha(\Pi|\mathbf x\rangle)$, cioè <b>$\Pi|\mathbf x\rangle$ è autovettore della posizione con autovalore $-\mathbf x$</b>. Siccome quegli autovettori sono unici a meno di una fase, e scegliendo la fase uno,</p>
   $$\Pi|\mathbf x\rangle=|-\mathbf x\rangle,$$
   <p>e per la funzione d&rsquo;onda</p>
   $$\Pi\Psi(\mathbf x)\equiv\langle\mathbf x|\Pi|\Psi\rangle=\langle-\mathbf x|\Psi\rangle=\Psi(-\mathbf x).$$
   <p>Ogni funzione pari è autofunzione con autovalore $+1$, ogni funzione dispari con autovalore $-1$. E siccome una funzione qualunque si decompone nella somma della sua parte pari e della sua parte dispari, <i>lo spazio di Hilbert si spezza in due sottospazi ortogonali</i>, e $\Pi$ è la differenza dei due proiettori. Questo è il contenuto operativo di «la parità è un&rsquo;osservabile con due soli valori possibili».</p>`}
  ]},
  {t:'reveal', title:'Una dimensione: parità alternata, e lo stato fondamentale sempre pari', tag:'costruzione', steps:[
   {label:'I due teoremi di Picasso, e il wronskiano che li lega', body:R`
   <p>In una dimensione la parità produce un risultato che non si vede altrimenti, e Picasso lo costruisce in tre passi al §7.4. I primi due sono teoremi generali sull&rsquo;equazione di Schrödinger unidimensionale, indipendenti dalla parità.</p>
   <p><b>Teorema di oscillazione.</b> «<i>Siano $E_0<E_1<\cdots<E_n\cdots$ gli autovalori discreti della hamiltoniana ordinati in senso crescente e $\psi_0(x),\psi_1(x),\cdots$ le corrispondenti autofunzioni. Allora $\psi_0(x)$ non ha nodi, $\psi_1$ ha un nodo, $\cdots$, $\psi_n(x)$ ha $n$ nodi.</i>» Picasso dichiara di non dimostrarlo, ma ne dà l&rsquo;argomento qualitativo: aumentando l&rsquo;energia aumenta la curvatura di $\psi$ nella regione classicamente accessibile, quindi la funzione compie più oscillazioni. E ne dà anche una conferma parziale e rigorosa: se $\psi_0$ non si annulla mai, allora le autofunzioni eccitate <i>devono</i> avere nodi, perché sono ortogonali a $\psi_0$ — e un integrale $\int\psi_0\psi_1\,dx$ con $\psi_0$ di segno definito può annullarsi solo se $\psi_1$ cambia segno.</p>
   <p><b>Teorema di non degenerazione.</b> «<i>Per ogni sistema unidimensionale gli autovalori discreti della hamiltoniana sono non degeneri.</i>» Questo Picasso lo dimostra, e la dimostrazione è l&rsquo;argomento del wronskiano. Siano $\psi_1$ e $\psi_2$ due autofunzioni dello stesso autovalore $E$; si moltiplica la prima equazione per $\psi_2$, la seconda per $\psi_1$ e si sottrae membro a membro. Il termine con il potenziale si cancella, e resta un&rsquo;espressione che è una derivata esatta:</p>
   $$\frac{d}{dx}\big(\psi_1'\psi_2-\psi_1\psi_2'\big)=\psi_1''\psi_2-\psi_1\psi_2'',$$
   <p>cioè la quantità fra parentesi — il <b>wronskiano</b> — ha derivata nulla ed è quindi costante. Siccome $E$ è un autovalore discreto, entrambe le funzioni si annullano all&rsquo;infinito e la costante è zero. Allora $\psi_1'/\psi_1=\psi_2'/\psi_2$, cioè $\tfrac{d}{dx}\log\psi_1=\tfrac{d}{dx}\log\psi_2$, che integrata dà $\psi_1=C\psi_2$: le due funzioni non sono indipendenti, dunque $E$ è non degenere.</p>
   <p>Picasso aggiunge una precisazione che vale avere: «<i>affinché la costante al secondo membro sia nulla, è sufficiente che $\psi_1$ e $\psi_2$ si annullino o per $x\to+\infty$ o per $x\to-\infty$</i>». Basta <i>un</i> estremo, e questo rende il teorema applicabile anche agli autovalori impropri di un potenziale che diverge da un solo lato — caso che Picasso sfrutta subito dopo per concludere che anche lì lo spettro continuo è non degenere.</p>`},
   {label:'V pari: il teorema sulla parità, e perché il fondamentale non può essere dispari', body:R`
   <p>Si aggiunga ora l&rsquo;ipotesi che il potenziale sia una funzione pari, $V(x)=V(-x)$. Allora la hamiltoniana commuta con l&rsquo;operatore di inversione, $[H,I]=0$, dunque i due hanno un insieme completo di autofunzioni simultanee. Ma — e questo è il passo in cui il teorema di non degenerazione paga —</p>
   <p><b>siccome gli autovalori discreti di $H$ sono NON degeneri, ogni autofunzione di $H$ corrispondente a un autovalore discreto deve essere anche autofunzione di $I$, cioè deve avere parità definita.</b></p>
   <p>Non «si può scegliere una base di parità definita»: <i>ogni</i> autofunzione ce l&rsquo;ha, perché il livello è unidimensionale e non c&rsquo;è spazio per ruotare. È esattamente il contrario del caso del reticolo nella tappa 08, dove la degenerazione infinita permetteva autostati dell&rsquo;energia che <i>non</i> erano autostati della simmetria.</p>
   <p>Ora si combina con il teorema di oscillazione, e Picasso fa il conteggio dei nodi. Una funzione a parità definita che si annulla in $x\neq0$ si annulla anche in $-x$: i nodi vengono in coppie. In più <b>le funzioni dispari devono annullarsi nell&rsquo;origine</b>, perché $f(0)=-f(0)=0$. Le funzioni pari invece, se si annullassero nell&rsquo;origine, avrebbero lì anche la derivata nulla — la derivata di una funzione pari è dispari — e questo è impossibile: «<i>le soluzioni dell&rsquo;equazione di Schrödinger non possono avere zeri di ordine superiore al primo: se in un punto si annullano sia $\psi$ che $\psi'$ allora, siccome questi dati determinano univocamente la soluzione, $\psi$ è la soluzione identicamente nulla</i>». Dunque <b>le funzioni pari hanno un numero pari di nodi e le dispari un numero dispari</b>, e combinando con il teorema di oscillazione:</p>
   <p>«<i>le corrispondenti autofunzioni $\psi_0(x),\psi_1(x),\cdots,\psi_n(x),\cdots$ sono alternativamente pari e dispari, e in particolare la funzione d&rsquo;onda dello stato fondamentale è sempre pari.</i>»</p>
   <p>L&rsquo;esempio canonico sono i <span class="str" data-str="polinomi-di-hermite">polinomi di Hermite</span>, le cui proprietà di parità si leggono direttamente dai loro termini: $H_n$ contiene solo potenze della stessa parità di $n$. Per i primi gradi:</p>
   $$H_2(-x)=H_2(x),\qquad H_3(-x)=-H_3(x),$$
   <p>e siccome le autofunzioni dell&rsquo;oscillatore armonico sono $\psi_n(x)\propto H_n(x)e^{-x^{2}/2}$ con l&rsquo;esponenziale pari, la parità di $\psi_n$ è quella di $H_n$, cioè $(-1)^{n}$. <b>Il teorema generale e il caso esplicito coincidono</b>, come devono: il fondamentale dell&rsquo;oscillatore è una gaussiana, pari e senza nodi.</p>`}
  ]},
  {t:'plot', title:'Parità alternata: le prime quattro autofunzioni dell’oscillatore armonico',
   intro:R`<p>Le funzioni $\psi_n(x)\propto H_n(x)e^{-x^{2}/2}$ per $n=0,1,2,3$, in unità in cui $m=\omega=\hbar=1$, riscalate per stare tutte nello stesso riquadro. I polinomi sono $H_0=1$, $H_1=2x$, $H_2=4x^{2}-2$, $H_3=8x^{3}-12x$.</p>`,
   plots:[{kind:'func2d', xr:[-3.6,3.6], yr:[-1.15,1.15], height:270, ticks:true,
     title:'ψ₀ pari, ψ₁ dispari, ψ₂ pari, ψ₃ dispari',
     curves:[{f:'Math.exp(-x*x/2)', col:'#5aa9ff', width:2.2, label:'ψ₀ (0 nodi, pari)'},
             {f:'x*Math.exp(-x*x/2)', col:'#6bdc9b', width:2.2, label:'ψ₁ (1 nodo, dispari)'},
             {f:'(2*x*x-1)*Math.exp(-x*x/2)/1.6', col:'#ffc24a', width:2.0, label:'ψ₂ (2 nodi, pari)'},
             {f:'(2*x*x*x-3*x)*Math.exp(-x*x/2)/2.6', col:'#ff6b8a', width:2.0, label:'ψ₃ (3 nodi, dispari)'}],
     xlabel:'x', ylabel:'ψ'}],
   leggi:R`<p><b>Che cosa guardare.</b> Il conteggio dei nodi, e la loro posizione. $\psi_0$ non attraversa mai l&rsquo;asse; $\psi_1$ lo attraversa una volta e lo fa <i>nell&rsquo;origine</i>; $\psi_2$ due volte, simmetricamente attorno all&rsquo;origine ma <b>non</b> nell&rsquo;origine; $\psi_3$ tre volte, di cui una nell&rsquo;origine e due simmetriche. Questa è la regola del conteggio in forma visiva: i nodi vengono a coppie simmetriche, più eventualmente uno nell&rsquo;origine, e quello nell&rsquo;origine c&rsquo;è se e solo se la funzione è dispari.</p>
   <p><b>Che cosa impararne.</b> La parità non è un&rsquo;etichetta aggiunta dall&rsquo;esterno: è <i>leggibile dal grafico</i>, e ciò che la determina è il numero di nodi, che a sua volta è determinato dall&rsquo;ordine del livello. <b>Non esiste nessun potenziale pari il cui stato fondamentale sia dispari</b>, e la figura mostra perché: una funzione dispari è costretta ad annullarsi nell&rsquo;origine, quindi ha almeno un nodo, quindi per il teorema di oscillazione non è il livello più basso. L&rsquo;argomento non usa nessuna proprietà dell&rsquo;oscillatore — vale per la buca quadrata, per il potenziale a quartica, per qualunque $V$ pari con spettro discreto — e questo è il modo di distinguere, guardando una figura, ciò che è generale da ciò che è accidentale: il profilo delle curve dipende dall&rsquo;oscillatore, l&rsquo;alternanza no.</p>`},
  {t:'reveal', title:'La parità del momento angolare, e il controesempio dei due elettroni', tag:'costruzione', steps:[
   {label:'Perché (−1)^ℓ, in due modi', body:R`
   <p>Sotto inversione spaziale le coordinate angolari si trasformano come $\theta\to\pi-\theta$ e $\varphi\to\varphi+\pi$, e le <span class="str" data-str="armoniche-sferiche">armoniche sferiche</span> acquistano un segno:</p>
   $$Y_{\ell m}(\pi-\theta,\varphi+\pi)=(-1)^{\ell}Y_{\ell m}(\theta,\varphi).$$
   <p>Il segno si ottiene fattorizzando i due effetti. La dipendenza azimutale è $e^{im\varphi}$, e lo spostamento $\varphi\to\varphi+\pi$ la moltiplica per $e^{im\pi}=(-1)^{m}$. La dipendenza polare è un polinomio associato di Legendre in $\cos\theta$, e $\cos(\pi-\theta)=-\cos\theta$: vale l&rsquo;identità $P_\ell^{m}(-u)=(-1)^{\ell-m}P_\ell^{m}(u)$, che per i primi gradi si verifica direttamente —</p>
   $$P_3^{1}(-x)=P_3^{1}(x),\qquad P_2^{1}(-x)=-P_2^{1}(x),$$
   <p>cioè il segno $(-1)^{\ell-m}$ con $\ell=3$ e $m=1$ nel primo caso, dove è positivo, e con $\ell=2$ e $m=1$ nel secondo, dove è negativo. Il prodotto dei due fattori è</p>
   $$(-1)^{\ell-m}(-1)^{m}=(-1)^{\ell},$$
   <p>dove il valore di $m$ si cancella — e che si cancelli non è un caso: deve essere così, perché la parità non può dipendere dall&rsquo;orientamento scelto per l&rsquo;asse polare. Dunque</p>
   $$\Pi|\ell,m\rangle=(-1)^{\ell}|\ell,m\rangle.$$
   <p>Picasso arriva allo stesso risultato per una strada che vale conoscere perché è più corta e più geometrica. Le armoniche sferiche di ordine $\ell$ sono «<i>il prodotto di $r^{-\ell}$ per un polinomio omogeneo di grado $\ell$ nelle $x,y,z$</i>», e per $\ell=1$ le tre funzioni, scritte in coordinate cartesiane, sono proporzionali a $(x\pm iy)/r$ e $z/r$. Sotto inversione il modulo $r$ non cambia, e un polinomio omogeneo di grado $\ell$ nelle coordinate acquista il fattore $(-1)^{\ell}$ — per $\ell=1$:</p>
   $$\frac{-x-iy}{r}=-\frac{x+iy}{r}.$$
   <p>Picasso fa anche l&rsquo;osservazione di consistenza che collega i due risultati: siccome $I$ è uno <i>scalare</i> rispetto alle rotazioni, «<i>tutti gli stati con lo stesso $\ell$ ed $m$ compreso fra $-\ell$ e $+\ell$ hanno la stessa parità</i>» — e questa è la stessa ragione per cui $m$ si è cancellato nel conto di sopra, enunciata come proprietà di simmetria invece che come fatto algebrico.</p>`},
   {label:'Dove la regola non si estende: due elettroni', body:R`
   <p>Il risultato $\Pi|\ell,m\rangle=(-1)^{\ell}$ vale per <i>una</i> particella, e Ballentine mette subito il confine: «<i>The same result does not extend to the eigenfunctions of total angular momentum for a multiparticle system.</i>»</p>
   <p>L&rsquo;esempio è un atomo a due elettroni. Un autovettore del momento angolare orbitale totale si costruisce combinando i momenti individuali con i coefficienti di accoppiamento,</p>
   $$|\ell_1,\ell_2,L,M\rangle=\sum_{m_1,m_2}(\ell_1,\ell_2,m_1,m_2|L,M)\,|\ell_1,m_1\rangle\otimes|\ell_2,m_2\rangle,$$
   <p>e siccome la parità di ogni addendo è $(-1)^{\ell_1}(-1)^{\ell_2}$, indipendente da $m_1$ e $m_2$, l&rsquo;intero stato ha parità</p>
   $$\Pi|\ell_1,\ell_2,L,M\rangle=(-1)^{\ell_1+\ell_2}|\ell_1,\ell_2,L,M\rangle.$$
   <p><b>E in generale $(-1)^{\ell_1+\ell_2}\neq(-1)^{L}$.</b> Due elettroni con $\ell_1=\ell_2=1$ possono accoppiarsi a $L=0,1,2$; la parità dello stato vale $(-1)^{\ell_1+\ell_2}$ con $\ell_1+\ell_2=2$, cioè è <i>pari in tutti e tre i casi</i>, mentre il fattore $(-1)^{L}$ darebbe alternativamente pari, dispari e pari. Ballentine conclude: «<i>Thus we see that, in general, the parity of an angular momentum state is not determined by its total angular momentum.</i>»</p>
   <p>È un avvertimento operativo e vale isolarlo, perché è un errore che si fa: <b>la parità è un numero quantico indipendente</b>, e per un sistema a più particelle va calcolata dai momenti angolari individuali, non dedotta da quello totale. Nella classificazione degli stati atomici è esattamente per questo che la parità compare come etichetta a sé, accanto a $L$ e $M$ — e Picasso, elencando l&rsquo;insieme completo di osservabili compatibili di un atomo isolato, la mette in lista separatamente: «<i>oltre alla hamiltoniana $H_0$, il quadrato del momento angolare orbitale totale $\mathbf L^{2}$, una componente di $\mathbf L$, diciamo $L_z$, e l&rsquo;operatore di inversione spaziale $I$</i>» (§13.6, pag. stampata 214).</p>`}
  ]},
  {t:'reveal', title:'Nessun momento di dipolo elettrico permanente, e la sua eccezione', tag:'esempio', steps:[
   {label:'Il teorema, e le due ipotesi che gli servono', body:R`
   <p>Questo è il risultato della parità con la conseguenza fisica più diretta, e ha una struttura che vale imitare: due ipotesi, una conclusione forte, e un controesempio appena si rimuove la seconda ipotesi.</p>
   <p>L&rsquo;operatore di dipolo elettrico di un sistema di particelle è $\mathbf d=\sum_jq_j\mathbf Q_j$, somma di cariche per posizioni, quindi è un vettore <i>polare</i> e ha parità dispari: $\Pi\mathbf d\Pi^{-1}=-\mathbf d$. Si consideri uno stato stazionario $|\Psi\rangle$ e si inseriscano due coppie $\Pi^{-1}\Pi$ nel valor medio:</p>
   $$\langle\Psi|\mathbf d|\Psi\rangle=\langle\Psi|\Pi^{-1}\Pi\mathbf d\Pi^{-1}\Pi|\Psi\rangle=-\langle\Psi'|\mathbf d|\Psi'\rangle,$$
   <p>dove $|\Psi'\rangle=\Pi|\Psi\rangle$. Finora è solo algebra. Ora entrano le ipotesi. <b>Prima ipotesi</b>: l&rsquo;hamiltoniana è invariante per inversione, $\Pi H\Pi^{-1}=H$. Allora da $H|\Psi\rangle=E|\Psi\rangle$ segue, inserendo $\Pi^{-1}\Pi$, che $H|\Psi'\rangle=E|\Psi'\rangle$: anche lo stato invertito è stazionario con la <i>stessa</i> energia. <b>Seconda ipotesi</b>: quel livello è <i>non degenere</i>. Allora i due autovettori non possono essere indipendenti, dunque $\Pi|\Psi\rangle=c|\Psi\rangle$ con $c=\pm1$. Sostituendo:</p>
   $$\langle\Psi|\mathbf d|\Psi\rangle=-c^{2}\langle\Psi|\mathbf d|\Psi\rangle=-\langle\Psi|\mathbf d|\Psi\rangle,$$
   <p>e un numero uguale al proprio opposto è zero. <b>Se l&rsquo;hamiltoniana è invariante per inversione spaziale e lo stato è non degenere, non c&rsquo;è momento di dipolo elettrico spontaneo in quello stato.</b></p>
   <p>Ballentine insiste sulla seconda ipotesi: «<i>The second condition of nondegeneracy must not be forgotten, because the theorem fails if it does not hold.</i>» E dà il controesempio, che è l&rsquo;idrogeno. Gli stati $|n,\ell,m\rangle$ hanno parità $(-1)^{\ell}$ e quindi, per l&rsquo;argomento qui sopra, dipolo nullo. Ma il primo livello eccitato, $n=2$, è <b>quattro volte degenere</b> — contiene $\ell=0$ e i tre stati $\ell=1$, che hanno parità opposta — e il vettore</p>
   $$\frac{|2,0,0\rangle+|2,1,0\rangle}{\sqrt2}$$
   <p>è uno stato stazionario con dipolo medio <i>non nullo</i>. <b>L&rsquo;idrogeno nel primo stato eccitato può esibire un dipolo elettrico spontaneo</b>, e la ragione è la degenerazione «accidentale» in $\ell$ che la tappa 08 ha spiegato con il vettore di Runge-Lenz. <i>Le tre conseguenze della simmetria interagiscono</i>: la degenerazione prodotta da una simmetria nascosta permette una violazione di un divieto imposto da un&rsquo;altra simmetria.</p>`},
   {label:'La condizione necessaria, e un modello in cui si calcola tutto', body:R`
   <p>La condizione generale è questa: «<i>The necessary condition for a state to exhibit a spontaneous electric dipole moment is that it be a linear combination of even parity and odd parity components.</i>» Il perché si vede nel modo più semplice su una funzione d&rsquo;onda di una particella. Se $\Psi$ ha parità definita, pari o dispari, allora $|\Psi(x)|^{2}$ è simmetrica per inversione e il dipolo medio $q\int|\Psi|^{2}x\,d^{3}x$ si annulla per simmetria. Se invece $\Psi=a\Psi_{\text{pari}}+b\Psi_{\text{dispari}}$, il modulo quadro contiene il termine incrociato $2ab\,\Psi_{\text{pari}}\Psi_{\text{dispari}}$, che è <i>dispari</i>, e la densità di probabilità non è più simmetrica.</p>
   <p>Vale costruirne un modello esplicito, perché il conto chiude la questione in tre integrali. Si prenda, in una dimensione,</p>
   $$\Psi(x)\propto(1+x)\,e^{-x^{2}/2},$$
   <p>che è la somma di una parte pari ($1$) e di una dispari ($x$) moltiplicate per la stessa gaussiana. La densità è $|\Psi|^{2}\propto(1+x)^{2}e^{-x^{2}}$, e il calcolo del valor medio della posizione richiede due <span class="str" data-str="integrale-gaussiano">integrali gaussiani</span>. Il numeratore:</p>
   $$\int_{-\infty}^{+\infty}x\,(1+x)^{2}e^{-x^{2}}dx=\sqrt{\pi},$$
   <p>e il denominatore, cioè la normalizzazione:</p>
   $$\int_{-\infty}^{+\infty}(1+x)^{2}e^{-x^{2}}dx=\frac{3\sqrt{\pi}}{2}.$$
   <p>Il rapporto dà</p>
   $$\langle x\rangle=\frac{2}{3},$$
   <p>diverso da zero. <b>Il dipolo è lì</b>, e si misura il doppio del contributo del termine incrociato diviso la norma. Per confronto, lo stesso conto su uno stato a parità definita dà zero esattamente,</p>
   $$\int_{-\infty}^{+\infty}x\,e^{-x^{2}}dx=0,$$
   <p>perché l&rsquo;integrando è il prodotto di una funzione dispari per una pari, dunque dispari, e l&rsquo;integrale su un dominio simmetrico di una funzione dispari è nullo. <i>Si noti che questo secondo integrale non richiede nessun conto</i>: la parità lo decide, ed è il caso più elementare del tipo di argomento che le regole di selezione generalizzano.</p>`}
  ]},
  {t:'plot', title:'Dove sta il dipolo: due densità di probabilità, una simmetrica e una no',
   intro:R`<p>Due densità normalizzate: in blu $|\Psi|^{2}=(1+x)^{2}e^{-x^{2}}$ divisa per $\tfrac32\sqrt\pi$, lo stato a parità mista; in verde $e^{-x^{2}}/\sqrt\pi$, lo stato a parità definita. In giallo, per confronto, la parte dispari del modulo quadro della prima, $2x\,e^{-x^{2}}/(\tfrac32\sqrt\pi)$ — il termine incrociato che produce il dipolo.</p>`,
   plots:[{kind:'func2d', xr:[-2.6,2.6], yr:[-0.5,1.1], height:260, ticks:true,
     title:'parità mista contro parità definita',
     curves:[{f:'(1+x)*(1+x)*Math.exp(-x*x)/(1.5*Math.sqrt(Math.PI))', col:'#5aa9ff', width:2.4, label:'parità mista'},
             {f:'Math.exp(-x*x)/Math.sqrt(Math.PI)', col:'#6bdc9b', width:2.2, dash:true, label:'parità definita'},
             {f:'2*x*Math.exp(-x*x)/(1.5*Math.sqrt(Math.PI))', col:'#ffc24a', width:1.8, label:'termine incrociato'}],
     xlabel:'x', ylabel:'densità'}],
   leggi:R`<p><b>Che cosa guardare.</b> La curva verde è simmetrica rispetto all&rsquo;asse verticale: per ogni $x$ positivo c&rsquo;è tanta probabilità quanta in $-x$, quindi il baricentro è nell&rsquo;origine. La blu non lo è: ha il massimo spostato a destra, un gobba alta da un lato e una coda schiacciata dall&rsquo;altro, e si annulla esattamente in $x=-1$ — dove il fattore $(1+x)$ cambia segno. La curva gialla, che è la parte dispari della blu, mostra da dove viene l&rsquo;asimmetria: è positiva a destra e negativa a sinistra, e la sua integrazione contro $x$ dà il dipolo.</p>
   <p><b>Che cosa impararne.</b> Il baricentro della blu sta in $\langle x\rangle=2/3$, e il valore si legge nella figura come lo spostamento del «centro di massa» della curva. <b>Il punto da portarsi via è che la parità mista non è una proprietà esotica: è ciò che accade a qualunque sovrapposizione di due stati di parità opposta</b> — e due stati di parità opposta hanno la stessa energia solo se il livello è degenere, che è precisamente l&rsquo;ipotesi che il teorema richiede di escludere. Si noti anche il legame con la tappa 07: il termine incrociato è un elemento di matrice fuori diagonale fra stati di parità opposta, cioè la stessa quantità $\varrho$ che faceva oscillare il valor medio nel battimento. In un livello <i>non</i> degenere le due componenti avrebbero energie diverse, il termine incrociato oscillerebbe nel tempo con frequenza $(E_2-E_1)/\hbar$, e il dipolo medio si annullerebbe in media — <i>per questo il teorema parla di dipolo «permanente»</i>, e la degenerazione è ciò che lo rende permanente invece che oscillante.</p>`},
  {t:'reveal', title:'Le regole di selezione: la conseguenza che si misura', tag:'esempio', steps:[
   {label:'Le quattro regole di Landau, e l’argomento che le produce', body:R`
