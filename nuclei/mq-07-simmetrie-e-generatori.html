   <p><b>Che cosa impararne.</b> Il commutatore è un&rsquo;informazione <i>locale</i> sul gruppo, e questa figura è il motivo per cui ciò non è una limitazione. L&rsquo;identità $[J_1,J_2]=iJ_3$ è vera come identità fra generatori, cioè come affermazione sulla derivata seconda del prodotto quadruplo nell&rsquo;origine; <b>non</b> è vera come affermazione su rotazioni di angolo finito, e la figura mostra quanto in fretta diventi falsa. Ciò che recupera il finito dall&rsquo;infinitesimo non è questa approssimazione ma l&rsquo;esponenziale: $e^{i\theta J_3}$ è esatto per ogni $\theta$, e la ragione è il teorema della tappa 03 — non un&rsquo;estrapolazione, ma la soluzione di un&rsquo;equazione differenziale che vale su tutto l&rsquo;intervallo.</p>`},
  {t:'reveal', title:'Rotazione e boost: la catena a cinque passi, e i due limiti', tag:'costruzione', steps:[
   {label:'Le cinque righe di coordinate', body:R`
   <p>La coppia $J_1,G_2$ è il caso in cui la catena di trasformazioni è più lunga e in cui conviene seguire che cosa si cancella. Il prodotto quadruplo</p>
   $$e^{i\varepsilon G_2}e^{i\varepsilon J_1}e^{-i\varepsilon G_2}e^{-i\varepsilon J_1}=I+\varepsilon^{2}[J_1,G_2]+\cdots$$
   <p>corrisponde a una rotazione di $\varepsilon$ attorno a $x_1$, una velocità $-\varepsilon$ lungo $x_2$, e le loro inverse. Al secondo ordine in $\varepsilon$ le coordinate fanno questo (Ballentine, pag. stampata 72):</p>
   $$(x_1,x_2,x_3)\to(x_1,\;x_2\cos\varepsilon-x_3\sin\varepsilon,\;x_2\sin\varepsilon+x_3\cos\varepsilon)$$
   $$\to(x_1,\;x_2\cos\varepsilon-x_3\sin\varepsilon-\varepsilon t,\;x_2\sin\varepsilon+x_3\cos\varepsilon)$$
   $$\to(x_1,\;x_2-\varepsilon t\cos\varepsilon,\;x_3+\varepsilon t\sin\varepsilon)$$
   $$\to(x_1,\;x_2-\varepsilon t\cos\varepsilon+\varepsilon t,\;x_3+\varepsilon t\sin\varepsilon)$$
   $$\to(x_1,\;x_2,\;x_3+\varepsilon^{2}t).$$
   <p>Il terzo passo è quello che richiede attenzione: la rotazione inversa riporta $x_2$ e $x_3$ ai loro valori, <i>ma agisce anche sul termine $-\varepsilon t$ che il boost ha appena introdotto</i>, e lo distribuisce fra le due componenti con i coseni e i seni. Il quarto passo (il boost inverso) cancella soltanto la parte che il boost diretto aveva messo lungo $x_2$ <b>senza il coseno</b>, e il residuo è ciò che resta.</p>`},
   {label:'I due limiti che dicono quale residuo sopravvive', body:R`
   <p>Il passaggio dall&rsquo;ultima all&rsquo;ultima-meno-uno è quello che Ballentine scrive come «<i>to the second order in $\varepsilon$</i>», e vale aprirlo perché è lì che il risultato si decide. Il residuo nella seconda componente è $\varepsilon t(1-\cos\varepsilon)$, quello nella terza è $\varepsilon t\sin\varepsilon$. Siccome lo scarto dall&rsquo;identità del prodotto quadruplo è di ordine $\varepsilon^{2}$, ciò che conta è il comportamento di ciascun residuo <i>diviso $\varepsilon^{2}$</i>:</p>
   $$\lim_{\varepsilon\to0}\frac{\varepsilon t\sin\varepsilon}{\varepsilon^{2}}=t,\qquad\lim_{\varepsilon\to0}\frac{\varepsilon t-\varepsilon t\cos\varepsilon}{\varepsilon^{2}}=0.$$
   <p><b>Il primo residuo sopravvive, il secondo no</b>: $\sin\varepsilon\simeq\varepsilon$ mentre $1-\cos\varepsilon\simeq\varepsilon^{2}/2$, quindi il termine lungo $x_2$ è di ordine $\varepsilon^{3}$ e scompare dall&rsquo;ordine che interessa. Resta uno spostamento della terza coordinata proporzionale a $t$, cioè — per definizione — <i>una velocità</i> $\varepsilon^{2}$ lungo $x_3$. Il prodotto dei quattro unitari differisce dunque al più per una fase da $e^{i\varepsilon^{2}G_3}$, e</p>
   $$[J_1,G_2]=iG_3+(?)I.$$
   <p>Ripetendo per le altre componenti, e con lo stesso trattamento per una rotazione e uno spostamento spaziale — «<i>the treatment of a rotation and a space displacement is very similar</i>» —</p>
   $$[J_\alpha,G_\beta]=i\varepsilon_{\alpha\beta\gamma}G_\gamma+(?)I,\qquad[J_\alpha,P_\beta]=i\varepsilon_{\alpha\beta\gamma}P_\gamma+(?)I.$$
   <p>Queste due relazioni hanno un nome e un significato: dicono che $G$ e $P$ sono <b>operatori 3-vettoriali</b>. Ballentine lo definisce in nota: «<i>Any object that transforms under rotations in the same way as the coordinate $x$ or position operator $Q$ is called a 3-vector</i>», e le relazioni appena ottenute implicano che $J$, $G$ e $P$ lo siano tutti e tre. È una classificazione che tornerà decisiva nella tappa 06, dove serve per escludere certi termini da $G$: un termine che <i>non</i> si trasforma come un 3-vettore non può stare in un oggetto che lo fa.</p>`}
  ]},
  {t:'reveal', title:'I multipli dell’identità: tre tipi, e l’identità di Jacobi come strumento di calcolo', tag:'costruzione', steps:[
   {label:'La classificazione, e le prime cancellazioni gratis', body:R`
   <p>Restano da sistemare tutti i $(?)I$. Ballentine li divide in tre tipi, e la divisione è la parte concettualmente più ricca del capitolo (pag. stampata 73):</p>
   <p><b>(a)</b> quelli determinabili da condizioni di consistenza; <b>(b)</b> quelli arbitrari ma eliminabili con una scelta convenzionale delle fasi di certi vettori; <b>(c)</b> quelli <i>irremovibili e fisicamente significativi</i>.</p>
   <p>Prima di tutto, due cancellazioni gratuite. I commutatori sono antisimmetrici, $[K_\mu,K_\nu]=-[K_\nu,K_\mu]$, quindi ogni operatore commuta con sé stesso: <b>quando $\alpha=\beta$ non ci può essere nessun multiplo dell&rsquo;identità</b> in $[P_\alpha,P_\beta]$, in $[G_\alpha,G_\beta]$ e in $[J_\alpha,J_\beta]$. Non è una scelta, è aritmetica.</p>
   <p>Lo strumento per il resto è l&rsquo;identità di Jacobi,</p>
   $$[[K_\mu,K_\nu],K_\lambda]+[[K_\nu,K_\lambda],K_\mu]+[[K_\lambda,K_\mu],K_\nu]=0,$$
   <p>riscritta nella forma che Ballentine chiama più conveniente,</p>
   $$[[K_\mu,K_\nu],K_\lambda]=[[K_\lambda,K_\nu],K_\mu]+[[K_\mu,K_\lambda],K_\nu].$$
   <p>Perché funzioni come <i>strumento di calcolo</i> c&rsquo;è un&rsquo;osservazione da fare, e Ballentine la fa in una riga: «<i>The unknown multiples of identity have no effect inside the commutators</i>». Un multiplo dell&rsquo;identità commuta con tutto, quindi quando compare <i>dentro</i> un commutatore esterno sparisce. Questo è l&rsquo;unico motivo per cui si possono dedurre informazioni sui $(?)I$ senza conoscerli: si costruisce un&rsquo;identità in cui compaiono solo dentro, e l&rsquo;identità vincola i generatori.</p>`},
   {label:'Il tipo (a): [P,H]=0, con Jacobi in tre righe', body:R`
   <p>L&rsquo;esempio che Ballentine svolge è il modello di tutti gli altri. Si prendano $K_\mu=J_2$, $K_\nu=P_3$, $K_\lambda=H$. L&rsquo;identità di Jacobi nella forma conveniente dà</p>
   $$[[J_2,P_3],H]=[[H,P_3],J_2]+[[J_2,H],P_3].$$
   <p>Ora si sostituisce ciò che si sa. A sinistra $[J_2,P_3]=iP_1+?I$; a destra $[H,P_3]$ e $[J_2,H]$ sono entrambi dei puri $?I$. Riga per riga:</p>
   $$[(iP_1+?I),H]=[?I,J_2]+[?I,P_3]$$
   $$i[P_1,H]=0+0.$$
   <p>I tre multipli dell&rsquo;identità sono scomparsi — quello di sinistra perché sta dentro un commutatore, i due di destra perché <i>sono</i> l&rsquo;intero argomento di un commutatore — e resta un&rsquo;informazione pulita sul generatore. Ripetendo per ciascun asse:</p>
   $$[P_\alpha,H]=0.$$
   <p><b>Questo è il teorema di conservazione dell&rsquo;impulso</b>, ottenuto prima di aver detto che $P$ sia l&rsquo;impulso e prima di aver detto che $H$ sia l&rsquo;energia: è l&rsquo;affermazione che il generatore delle traslazioni spaziali commuta con il generatore delle traslazioni temporali, cioè che spostare e aspettare sono operazioni che si possono scambiare. La tappa 07 ne trarrà le conseguenze osservabili.</p>
   <p>Con lo stesso metodo — «<i>the way to apply this method in general should be evident from this example</i>», e la ricetta è: si scelgono $K_\mu,K_\nu$ il cui commutatore genera uno degli operatori di interesse, e $K_\lambda$ l&rsquo;altro — si ottengono</p>
   $$[P_\alpha,P_\beta]=0,\qquad[G_\alpha,G_\beta]=0,\qquad[J_\alpha,H]=0.$$`},
   {label:'Il tipo (b): la fase che si può ridefinire, e un sistema lineare che decide', body:R`
   <p>Il caso di $[J_\alpha,J_\beta]$ è diverso: il multiplo dell&rsquo;identità resta arbitrario, ma si può portare a zero <i>cambiando convenzione</i>. L&rsquo;antisimmetria impone che abbia la forma</p>
   $$[J_\alpha,J_\beta]=i\varepsilon_{\alpha\beta\gamma}J_\gamma+i\varepsilon_{\alpha\beta\gamma}b_\gamma I,$$
   <p>con $b_\gamma$ numeri reali, e la sostituzione $J_\alpha+b_\alpha I\to J_\alpha$ lo elimina dando $[J_\alpha,J_\beta]=i\varepsilon_{\alpha\beta\gamma}J_\gamma$. Che cosa si è fatto, concretamente? Si è sostituito l&rsquo;operatore di rotazione $e^{-i\theta J_\alpha}$ con $e^{i\theta b_\alpha}e^{-i\theta J_\alpha}$, cioè si è rimpiazzato $|\Psi'\rangle=U|\Psi\rangle$ con $e^{i\theta b_\alpha}|\Psi'\rangle$. <b>E questo è lecito perché la fase assoluta di un vettore di stato non ha significato fisico</b>: è lo stesso argomento della tappa 02 sul problema della fase, usato qui come risorsa invece che come fastidio.</p>
   <p>Per $[J_\alpha,G_\beta]$ e $[J_\alpha,P_\beta]$ l&rsquo;argomento è più lungo e passa per un punto che vale isolare, perché è un pezzo di algebra lineare che decide un fatto fisico. Jacobi con $J_1,J_2,G_3$ dà</p>
   $$[J_3,G_3]=[J_1,G_1]+[J_2,G_2],$$
   <p>cioè, ponendo $X_\alpha=[J_\alpha,G_\alpha]$, l&rsquo;equazione $X_3=X_1+X_2$. Siccome i tre assi si possono permutare ciclicamente, valgono anche $X_1=X_2+X_3$ e $X_2=X_3+X_1$. La matrice dei coefficienti di questo sistema omogeneo ha determinante</p>
   $$\det A=-4,$$
   <p>diverso da zero, e quindi <b>il sistema ammette solo la soluzione nulla</b>: $[J_\alpha,G_\alpha]=0$ esattamente, senza nessun multiplo dell&rsquo;identità residuo. Non è un&rsquo;ipotesi di comodo e non è una convenzione: è tre equazioni lineari in tre incognite. Con un secondo uso di Jacobi ($J_3,J_1,G_3$) si ottiene $[J_\alpha,G_\beta]=-[J_\beta,G_\alpha]$, e l&rsquo;antisimmetria permette di scrivere il multiplo residuo nella forma $i\varepsilon_{\alpha\beta\gamma}b_\gamma I$, eliminabile con la sostituzione $G_\alpha+b_\alpha I\to G_\alpha$. Risultato:</p>
   $$[J_\alpha,G_\beta]=i\varepsilon_{\alpha\beta\gamma}G_\gamma,\qquad[J_\alpha,P_\beta]=i\varepsilon_{\alpha\beta\gamma}P_\gamma.$$
   <p>E una volta stabiliti questi, un terzo uso di Jacobi (con $J_1,G_2,H$) chiude anche il commutatore fra boost e tempo, questa volta <i>senza</i> punti di domanda:</p>
   $$[G_\alpha,H]=iP_\alpha.$$`}
  ]},
  {t:'reveal', title:'Il caso (c): la massa, e perché non si può togliere', tag:'esempio', steps:[
   {label:'Due usi di Jacobi, e una costante che resta', body:R`
   <p>Resta una sola coppia: $G_\alpha$ e $P_\beta$. E qui il metodo che ha cancellato tutti i multipli dell&rsquo;identità precedenti si ferma, lasciandone uno in piedi.</p>
   <p>Primo uso di Jacobi, con $J_1,G_2,P_1$:</p>
   $$[[J_1,G_2],P_1]=[[P_1,G_2],J_1]+[[J_1,P_1],G_2],$$
   $$i[G_3,P_1]=0+0,$$
   <p>dove il primo termine di destra è nullo perché $[P_1,G_2]$ è un puro multiplo dell&rsquo;identità e il secondo perché $[J_1,P_1]$ lo è anch&rsquo;esso. Dunque $[G_\alpha,P_\beta]=0$ per $\alpha\neq\beta$: <b>i boost lungo un asse commutano con le traslazioni lungo un asse diverso</b>, esattamente.</p>
   <p>Secondo uso, identico ma con $P_3$ al posto di $P_1$:</p>
   $$[[J_1,G_2],P_3]=[[P_3,G_2],J_1]+[[J_1,P_3],G_2],$$
   $$i[G_3,P_3]=0-i[P_2,G_2],$$
   <p>da cui $[G_\alpha,P_\alpha]=[G_\beta,P_\beta]$: <b>il commutatore fra boost e traslazione lungo lo stesso asse è lo stesso numero per tutti e tre gli assi</b>, ma Jacobi non dice <i>quale</i>. Combinando con la relazione già nota — che quel commutatore è un puro multiplo dell&rsquo;identità — si ottiene la nona e ultima relazione:</p>
   $$[G_\alpha,P_\beta]=i\delta_{\alpha\beta}MI,$$
   <p>con $M$ una costante reale. Ed è un vicolo cieco deliberato: «<i>The value of $M$ is not determined by any of the equations at our disposal</i>».</p>`},
   {label:'Perché è irremovibile, e che cosa significa che lo sia', body:R`
   <p>Si potrebbe sperare di eliminare $M$ come si sono eliminati i $b_\gamma$, aggiungendo multipli dell&rsquo;identità ai generatori. Ballentine chiude questa via con due argomenti, e il secondo è più forte del primo. Il primo: «<i>It cannot be eliminated by adding multiples of $I$ to any of the generators</i>» — la forma della relazione non lo permette, perché $M$ moltiplica l&rsquo;identità <i>a destra</i> di un commutatore fra due generatori distinti, e una ridefinizione $G_\alpha+c I\to G_\alpha$ non cambia $[G_\alpha,P_\beta]$, dato che $[cI,P_\beta]=0$. Il secondo: «<i>That option is, in any case, no longer available to us, since we have already used up such freedom for all generators except $H$</i>». <b>La libertà di fase è una risorsa finita e la si è già spesa.</b></p>
   <p>Il verdetto è una frase che vale citare per intero, perché è la conclusione dell&rsquo;intero capitolo 3 di Ballentine: «<i>It is mathematically irremovable, and will turn out to have a physical significance</i>» (pag. stampata 76).</p>
   <p>Il significato fisico è la <b>massa</b>, e la tappa 06 lo dimostrerà identificando $G_\alpha=MQ_\alpha$. Ma il punto strutturale si può enunciare già adesso, e capovolge il modo in cui la massa viene normalmente introdotta. In un corso standard la massa entra nella hamiltoniana come un parametro del sistema, scritto a mano: $H=p^{2}/2m+V$. Qui la massa <i>non</i> è un parametro che si sceglie: è <b>l&rsquo;unico numero che la struttura del gruppo di Galilei non riesce a cancellare</b>, e per questo etichetta la rappresentazione. Due particelle di massa diversa non sono lo stesso sistema con un numero diverso dentro: sono due <i>rappresentazioni unitarie inequivalenti</i> dello stesso gruppo di simmetria.</p>
   <p>Si noti dove va a finire, in questa lettura, il fatto che la fase di uno stato sia non osservabile. Era un fastidio nella tappa 02, è diventato una risorsa nel tipo (b), e qui è <i>la sorgente della massa</i>: $M$ sta nell&rsquo;algebra precisamente perché la rappresentazione unitaria del gruppo si porta dietro un fattore di fase, cioè perché $U(\tau_2)U(\tau_1)=e^{i\omega}U(\tau_2\tau_1)$ invece di $U(\tau_2\tau_1)$. <b>Senza quella fase, la meccanica quantistica galileiana non avrebbe massa.</b> È il motivo per cui il problema della fase, incontrato tre volte in tre tappe, non era un dettaglio tecnico da smaltire.</p>`}
  ]},
  {t:'gram', title:'La tabella (3.35): nove relazioni, e l’intera cinematica non relativistica', rows:[
   ['$[P_\alpha,P_\beta]=0$', 'le traslazioni in direzioni diverse commutano — è il «regalo» di Dirac della tappa 04, qui dimostrato con Jacobi invece che assunto.'],
   ['$[G_\alpha,G_\beta]=0$', 'due boost in direzioni diverse commutano. Vero in Galilei, <b>falso in Lorentz</b>: lì il commutatore di due boost è una rotazione, ed è l&rsquo;origine della precessione di Thomas. La differenza fra i due gruppi vive in questa riga.'],
   ['$[J_\alpha,J_\beta]=i\varepsilon_{\alpha\beta\gamma}J_\gamma$', 'l&rsquo;algebra del momento angolare, ottenuta da tre matrici $3\times3$ e un prodotto quadruplo. Chiusa su sé stessa: le rotazioni formano un sottogruppo.'],
   ['$[J_\alpha,P_\beta]=i\varepsilon_{\alpha\beta\gamma}P_\gamma$', '$P$ è un 3-vettore: ruotando il sistema, l&rsquo;impulso ruota come un vettore.'],
   ['$[J_\alpha,G_\beta]=i\varepsilon_{\alpha\beta\gamma}G_\gamma$', '$G$ è un 3-vettore. Servirà nella tappa 06 per escludere da $G$ ogni termine proporzionale all&rsquo;identità.'],
   ['$[G_\alpha,P_\beta]=i\delta_{\alpha\beta}MI$', '<b>la massa.</b> L&rsquo;unico multiplo dell&rsquo;identità che sopravvive, e l&rsquo;unica relazione in cui compare un numero che l&rsquo;algebra non determina.'],
   ['$[P_\alpha,H]=0$', 'conservazione dell&rsquo;impulso, in forma algebrica.'],
   ['$[G_\alpha,H]=iP_\alpha$', 'boost e tempo non commutano, e lo scarto è una traslazione. È la relazione che nella tappa 06 forza $H=P^{2}/2M$.'],
   ['$[J_\alpha,H]=0$', 'conservazione del momento angolare, in forma algebrica.']
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Tutta questa tappa calcola commutatori eseguendo trasformazioni <i>sulle coordinate</i>, cioè su $\mathbb R^{3}$. Ma i generatori $J_\alpha$, $P_\alpha$, $G_\alpha$, $H$ sono operatori sullo spazio di Hilbert, che non è $\mathbb R^{3}$. Perché il conto sulle coordinate dice qualcosa sugli operatori?`,
    a:R`Perché l&rsquo;informazione che si estrae non riguarda gli operatori ma il <b>gruppo</b>, e il gruppo è lo stesso nei due casi. L&rsquo;argomento ha due gambe. La prima è la chiusura: una successione di trasformazioni dello spazio-tempo è un&rsquo;altra trasformazione dello spazio-tempo, e questo è un fatto su $\mathbb R^{4}$ che si verifica sulle coordinate. La seconda è che gli unitari $U(\tau)$ rappresentano quel gruppo <i>a meno di una fase</i>: se quattro trasformazioni delle coordinate si compongono dando $\tau_{\text{ris}}$, i quattro unitari corrispondenti si compongono dando $e^{i\omega}U(\tau_{\text{ris}})$. Quindi il commutatore dei generatori è determinato dal gruppo fino a un multiplo dell&rsquo;identità, che è precisamente il residuo di quella fase. Le costanti di struttura $c^{\lambda}_{\mu\nu}$ si leggono sulle coordinate perché appartengono al gruppo; i $b_{\mu\nu}$ no, perché appartengono alla <i>rappresentazione</i>, e per questo richiedono un lavoro separato — tre tipi, Jacobi, le ridefinizioni di fase. La massa è il punto in cui le due cose si separano in modo osservabile: è un numero che non si legge sulle coordinate.`},
   {q:R`Nel calcolo di $[G_1,H]$ il risultato è uno spostamento di $-\varepsilon^{2}$, indipendente da $t$. Ma la catena di coordinate conteneva termini in $\varepsilon t$, e $t$ cresce indefinitamente. Come può il risultato non dipendere dal tempo?`,
    a:R`Perché i due termini in $\varepsilon t$ si cancellano esattamente, e quello che resta viene dal <i>disaccordo</i> fra i due, non da nessuno dei due. Riscrivendo il passo decisivo: il boost diretto sottrae $\varepsilon t$ valutato al tempo corrente; il boost inverso aggiunge $\varepsilon(t-\varepsilon)$, perché nel frattempo lo spostamento temporale ha cambiato il tempo. La somma è $-\varepsilon t+\varepsilon t-\varepsilon^{2}=-\varepsilon^{2}$. Il termine grande si cancella, il residuo è il prodotto dei due parametri infinitesimi — ed è il motivo per cui questo è un effetto <i>del secondo ordine</i> e non del primo. Il significato: il commutatore non misura «quanto fa un boost» (quello cresce col tempo) ma «quanto l&rsquo;ordine delle due operazioni conta», e l&rsquo;ordine conta per una quantità che non dipende da quando le si esegue. Se dipendesse da $t$, $[G_\alpha,H]$ non potrebbe essere una combinazione lineare di generatori a coefficienti costanti, e l&rsquo;intera struttura algebrica cadrebbe.`},
   {q:R`$[G_\alpha,P_\beta]=i\delta_{\alpha\beta}MI$ è l&rsquo;unica relazione con un multiplo dell&rsquo;identità irremovibile. Che cosa cambierebbe nella fisica se $M$ fosse zero?`,
    a:R`Cambierebbe che i boost commuterebbero con le traslazioni, e che l&rsquo;oggetto $G$ non potrebbe essere proporzionale alla posizione. La tappa 06 ottiene $G_\alpha=MQ_\alpha$ proprio risolvendo quella relazione contro $[Q_\alpha,P_\beta]=i\delta_{\alpha\beta}I$: con $M=0$ la soluzione $G=MQ$ degenera in $G=0$, e un generatore nullo genera la trasformazione identica — cioè i boost non farebbero <i>niente</i> agli stati. Un sistema di massa nulla, in meccanica quantistica galileiana, è un sistema per cui cambiare sistema di riferimento inerziale non ha nessun effetto: non esiste come teoria dinamica, e questo è il modo algebrico di dire che la meccanica non relativistica non sa trattare i fotoni. Si osservi che è un&rsquo;affermazione <i>sul gruppo</i> e non sulla dinamica: non si è ancora scritta nessuna hamiltoniana. La relatività risolve il problema perché nel gruppo di Poincaré la massa non è una carica centrale ma un invariante di Casimir, $P^{\mu}P_\mu$, e il valore zero è ammesso senza far collassare la rappresentazione.`}
  ]}
]},

/* ---------------- 06 · DA GENERATORI A OSSERVABILI, E DOVE ENTRA hbar ---------------- */
{ num:'06', title:'Da generatori a osservabili: il metodo di Jordan, e dove entra la costante di Planck', meta:'il cuore del capitolo · il lemma di Schur usato quattro volte · la hamiltoniana forzata, non postulata · la forma unica delle interazioni compatibili con Galilei',
  blocchi:[
  {t:'prosa', title:'Dieci oggetti geometrici, e la domanda che li fa diventare fisica', tag:'architettura', html:R`
  <p>La tappa 05 ha prodotto una tabella di nove relazioni fra dieci operatori. Di quei dieci operatori, finora, non si sa <i>niente</i> in senso fisico: sono i generatori di dieci trasformazioni dello spazio-tempo, e la notazione $P$, $J$, $G$, $H$ è stata scelta in anticipo per suggerire dove si andrà — Ballentine lo ammette («<i>the notation has been suggestively chosen in anticipation of the results that will be established in this section</i>», pag. stampata 76) — ma l&rsquo;anticipazione non è una dimostrazione.</p>
  <p>La domanda di questa tappa è dunque: <b>quale osservabile è ciascuno di quei dieci operatori?</b> E la risposta sorprendente è che l&rsquo;invarianza di Galilei basta a determinarla <i>completamente</i>, assumendo una sola osservabile: la posizione. Il metodo è di T. F. Jordan (1975), e Ballentine lo dichiara come la fonte principale del capitolo. Il risultato, al termine della tappa, è che $P$, $J$, $H$ sono proporzionali a impulso, momento angolare ed energia, che la costante di proporzionalità è <b>una sola per tutti e tre</b>, e che quella costante è $\hbar^{-1}$ — che entra qui nella teoria, per la prima volta, come un fattore di conversione fra geometria e dinamica.</p>
  <p>Il valore di questa strada si misura su ciò che <i>non</i> usa. Non usa l&rsquo;onda di de Broglie, non usa la regola di sostituzione $p\to-i\hbar\partial_x$, non usa l&rsquo;analogia con la meccanica classica. Usa: la posizione come osservabile, l&rsquo;algebra della tappa 05, e il <span class="str" data-str="spazio-di-hilbert">lemma di Schur</span> applicato quattro volte. In cambio produce qualcosa che la strada standard non produce mai: la <b>forma unica</b> delle interazioni compatibili con l&rsquo;invarianza galileiana, cioè la risposta alla domanda «perché l&rsquo;elettromagnetismo si accoppia alla materia proprio così».</p>`},
  {t:'reveal', title:'L’operatore di velocità, e come il tempo entra nella teoria', tag:'costruzione', steps:[
   {label:'La posizione, e le due ipotesi che la reggono', body:R`
   <p>Si parte dall&rsquo;unica osservabile assunta. L&rsquo;operatore di posizione $\mathbf Q=(Q_1,Q_2,Q_3)$ è definito dalla sua azione sugli autovettori impropri,</p>
   $$Q_\alpha|\mathbf x\rangle=x_\alpha|\mathbf x\rangle,\qquad\alpha=1,2,3,$$
   <p>e ha <span class="str" data-str="spettro">spettro</span> continuo e illimitato. Ballentine è esplicito sul fatto che qui ci sono <b>due</b> ipotesi, non una, e vale registrarle perché delimitano l&rsquo;intera costruzione: «<i>first, that space is a continuum; and second, that all three components of the position operator are mutually commutative, and so possess a common set of eigenvectors</i>».</p>
   <p>La prima è inevitabile: «<i>unavoidable if we are to use continuous transformations</i>» — senza un continuo non esistono le famiglie a un parametro della tappa 03, e senza quelle non esistono i generatori. Ballentine aggiunge che «<i>may need revision in a theory that attempts to treat gravitation, and hence space–time, quantum-mechanically</i>», ma che a livello atomico e nucleare non c&rsquo;è ragione di dubitarne. La seconda ipotesi — la commutatività delle tre componenti — significa, in termini fisici, <b>che è possibile preparare uno stato localizzato arbitrariamente vicino a un punto</b>, e Ballentine la riprende discutendo i sistemi composti avvertendo che «<i>may not be acceptable in relativistic quantum theory</i>».</p>
   <p>Si cerca ora un operatore di velocità, e lo si cerca definendolo <i>per ciò che deve fare</i>: la media della velocità deve essere la derivata temporale della media della posizione, in ogni stato,</p>
   $$\frac{d}{dt}\langle\mathbf Q\rangle=\langle\mathbf V\rangle.$$
   <p>Non è una definizione circolare, perché il membro di sinistra non contiene $\mathbf V$: contiene la posizione e il modo in cui lo stato dipende dal tempo. E il modo in cui lo stato dipende dal tempo lo dà <i>uno dei dieci generatori</i>.</p>`},
   {label:'Il tempo dal generatore, e V = i[H,Q]', body:R`
   <p>La trasformazione temporale $t\to t'=t+s$ agisce sui vettori di stato come ogni altra trasformazione del gruppo, cioè con l&rsquo;esponenziale del suo generatore. Ma c&rsquo;è l&rsquo;inversione fra trasformazioni dello spazio delle funzioni e trasformazioni delle coordinate, già incontrata nella tappa 02:</p>
   $$|\Psi(t)\rangle\to e^{isH}|\Psi(t)\rangle=|\Psi(t-s)\rangle.$$
   <p>Si ponga $s=t$: si ottiene $|\Psi(t)\rangle=e^{-itH}|\Psi(0)\rangle$, e derivando,</p>
   $$\frac{d}{dt}|\Psi(t)\rangle=-iH|\Psi(t)\rangle.$$
   <p><b>Questa è l&rsquo;equazione di Schrödinger</b> — con $\hbar=1$, e ripristinando le dimensioni $i\hbar\,d|\Psi\rangle/dt=H|\Psi\rangle$ — e si osservi da dove è venuta: non è un postulato della dinamica, è l&rsquo;affermazione che <i>$H$ genera le traslazioni temporali</i>. Picasso dice la stessa cosa in italiano, al §9.1, e la sua frase è il modo più compatto di tenerla a mente: «<i>così come l&rsquo;impulso $p$ è il generatore delle traslazioni spaziali, $H$ è il generatore delle traslazioni temporali</i>» (pag. stampata 150). Il teorema di Stone, che Picasso richiama nello stesso paragrafo, è ciò che garantisce che l&rsquo;esponenziale esista e sia unico: a ogni gruppo unitario fortemente continuo a un parametro corrisponde <i>uno e un solo</i> generatore autoaggiunto.</p>
   <p>Ora il conto. Si scriva la derivata del valor medio con la regola del prodotto e si sostituisca due volte l&rsquo;equazione del moto, una per il bra e una per il ket:</p>
   $$\langle\Psi|\mathbf V|\Psi\rangle=i\langle\Psi|H\mathbf Q|\Psi\rangle-i\langle\Psi|\mathbf QH|\Psi\rangle=i\langle\Psi|[H,\mathbf Q]|\Psi\rangle.$$
   <p>Siccome l&rsquo;uguaglianza vale per ogni stato, i due operatori coincidono:</p>
   $$\mathbf V=i[H,\mathbf Q].$$
   <p><b>Ma è una vittoria a metà, e Ballentine lo dice subito</b>: «<i>But it is only expressed in terms of $H$, whose form is not yet determined</i>». Si ha la velocità in funzione dell&rsquo;hamiltoniana, e dell&rsquo;hamiltoniana non si sa ancora niente tranne che genera il tempo. Il resto della tappa serve a determinarla — e la determinerà <i>senza scriverla</i>, cioè deducendola dall&rsquo;algebra.</p>`}
  ]},
  {t:'reveal', title:'I commutatori della posizione con i generatori restanti', tag:'costruzione', steps:[
   {label:'Rotazione: la posizione è un 3-vettore, e lo si dimostra', body:R`
   <p>Il commutatore $[Q_\alpha,P_\beta]=i\delta_{\alpha\beta}I$ è il risultato della tappa 04, ottenuto confrontando due espressioni per l&rsquo;osservabile traslata. Qui si fa la stessa cosa con le rotazioni, e il conto merita di essere visto perché il confronto è meno immediato.</p>
   <p>Una rotazione di angolo infinitesimo $\theta$ attorno all&rsquo;asse $\hat n$ manda $\mathbf x\to\mathbf x'=\mathbf x+\theta\hat n\times\mathbf x$. Sui ket di posizione agisce l&rsquo;esponenziale del generatore,</p>
   $$|\mathbf x\rangle\to|\mathbf x\rangle'=e^{-i\theta\hat n\cdot\mathbf J}|\mathbf x\rangle=|\mathbf x'\rangle,$$
   <p>e sull&rsquo;operatore posizione la legge di trasformazione delle osservabili, sviluppata al primo ordine,</p>
   $$Q_\alpha\to Q'_\alpha=e^{-i\theta\hat n\cdot\mathbf J}Q_\alpha e^{i\theta\hat n\cdot\mathbf J}=Q_\alpha-i\theta[\hat n\cdot\mathbf J,Q_\alpha]+O(\theta^{2}).$$
   <p>Ora il confronto. Da un lato, per definizione di osservabile trasformata, $Q'_\alpha|\mathbf x\rangle'=x_\alpha|\mathbf x\rangle'$. Dall&rsquo;altro, siccome $|\mathbf x'\rangle$ è autovettore di $\mathbf Q$ con autovalore $\mathbf x'$,</p>
   $$Q_\alpha|\mathbf x'\rangle=x'_\alpha|\mathbf x'\rangle=(\mathbf x+\theta\hat n\times\mathbf x)_\alpha|\mathbf x'\rangle=(\mathbf Q'+\theta\hat n\times\mathbf Q')_\alpha|\mathbf x\rangle'.$$
   <p>I vettori $|\mathbf x'\rangle=|\mathbf x\rangle'$ formano un insieme completo, dunque $\mathbf Q=\mathbf Q'+\theta\hat n\times\mathbf Q'$, cioè al primo ordine $\mathbf Q'=\mathbf Q-\theta\hat n\times\mathbf Q$. Confrontando con lo sviluppo dell&rsquo;esponenziale si ottiene $[\hat n\cdot\mathbf J,\mathbf Q]=-i\hat n\times\mathbf Q$, e proiettando su un versore arbitrario $\hat u$,</p>
   $$[\hat n\cdot\mathbf J,\hat u\cdot\mathbf Q]=i(\hat n\times\hat u)\cdot\mathbf Q,$$
   <p>ossia, per componenti,</p>
   $$[J_\alpha,Q_\beta]=i\varepsilon_{\alpha\beta\gamma}Q_\gamma.$$
   <p><b>Questa relazione È la definizione di 3-vettore</b>, nel senso di Ballentine: «<i>Any operator that satisfies [this] in place of $\mathbf Q$ is a 3-vector operator</i>». E la tabella (3.35) della tappa 05 dice allora che $\mathbf J$, $\mathbf G$ e $\mathbf P$ sono tutti e tre operatori 3-vettoriali — un fatto che fra tre passaggi servirà per eliminare un termine indesiderato.</p>`},
   {label:'Boost: la posizione non si accorge di un boost istantaneo', body:R`
   <p>Resta $\mathbf G$. Il boost genera uno spostamento nello <i>spazio delle velocità</i>, così come $\mathbf P$ ne genera uno nello spazio ordinario:</p>
   $$e^{i\mathbf v\cdot\mathbf G}\mathbf Ve^{-i\mathbf v\cdot\mathbf G}=\mathbf V-\mathbf vI.$$
   <p>L&rsquo;analisi si semplifica trattando solo l&rsquo;effetto <i>istantaneo</i> a $t=0$, e Ballentine giustifica la scelta: «<i>Since there is nothing special about the instant $t=0$, there is no real loss of generality</i>» — il caso generale a tempo $t$ è il problema 3.7 di fine capitolo, che la tappa 10 svolge. A $t=0$ la posizione non è toccata dalla trasformazione istantanea: il boost cambia la velocità, e lo spostamento che ne consegue è $vt$, che a $t=0$ è nullo. Dunque</p>
   $$[G_\alpha,Q_\beta]=0.$$
   <p>A questo punto i commutatori della posizione con tutti e quattro i tipi di generatore sono stabiliti: $[Q_\alpha,P_\beta]=i\delta_{\alpha\beta}I$ dalla tappa 04, $[J_\alpha,Q_\beta]=i\varepsilon_{\alpha\beta\gamma}Q_\gamma$ e $[G_\alpha,Q_\beta]=0$ qui, e $[H,\mathbf Q]$ è — per definizione della velocità — ciò che resta da determinare. <b>Si noti la struttura del ragionamento</b>: fin qui si sono solo dedotte relazioni, non forme. Il passo successivo è quello che trasforma relazioni in forme, e lo strumento è un teorema di algebra.</p>`}
  ]},
  {t:'plot', title:'Ruotare e traslare non commutano: il quadrilatero aperto, con i numeri',
   intro:R`<p>I due campi sono i flussi dei due generatori nel piano $(x_1,x_2)$: a sinistra quello della traslazione lungo $x_1$, a destra quello della rotazione attorno a $x_3$, cioè il campo $(-x_2,x_1)$. Sono le due trasformazioni il cui commutatore è $[J_3,Q_1]=iQ_2$.</p>`,
   plots:[{kind:'field2d', xr:[-2,2], yr:[-2,2], height:250, ticks:true,
     title:'flusso della traslazione lungo x₁',
     fx:'1', fy:'0', n:11, xlabel:'x₁', ylabel:'x₂'},
    {kind:'field2d', xr:[-2,2], yr:[-2,2], height:250, ticks:true,
     title:'flusso della rotazione attorno a x₃',
     fx:'-y', fy:'x', n:11, xlabel:'x₁', ylabel:'x₂'}],
   leggi:R`<p><b>Che cosa guardare.</b> A sinistra tutte le frecce sono identiche: il flusso della traslazione sposta ogni punto nello stesso modo, e <i>non dipende da dove si è</i>. A destra le frecce cambiano direzione e modulo da punto a punto: il flusso della rotazione dipende dalla posizione, e nell&rsquo;origine è nullo. <b>È questa dipendenza dal punto la ragione geometrica per cui i due flussi non commutano</b>: se li si esegue in ordine diverso, il secondo agisce su un punto diverso e quindi agisce diversamente.</p>
   <p><b>Che cosa impararne, con i numeri.</b> Si parta dal punto $(1,0)$ e si prenda $\varepsilon=0{,}3$. Ruotando prima e traslando poi si arriva in $(1{,}255;\,0{,}2955)$; traslando prima e ruotando poi, in $(1{,}242;\,0{,}3842)$. Lo scarto fra i due, calcolato in forma chiusa per $\varepsilon$ qualunque, è</p>
   $$\big(\varepsilon(1-\cos\varepsilon),\,-\varepsilon\sin\varepsilon\big),$$
   <p>e il suo comportamento per $\varepsilon$ piccolo è la firma del commutatore: la prima componente è di ordine $\varepsilon^{3}$ e scompare, la seconda è</p>
   $$\lim_{\varepsilon\to0}\frac{-\varepsilon\sin\varepsilon}{\varepsilon^{2}}=-1,$$
   <p>cioè esattamente $-\varepsilon^{2}$. <b>Il quadrilatero non si chiude, e il lato che manca è uno spostamento di $-\varepsilon^{2}$ lungo $x_2$</b> — che è il contenuto letterale di $[J_3,Q_1]=iQ_2$. Si confronti con la tappa 05: lì, nel calcolo di $[J_1,G_2]$, uno dei due residui sopravviveva e l&rsquo;altro no, con gli stessi due ordini $\varepsilon^{2}$ e $\varepsilon^{3}$ e per la stessa ragione — $\sin\varepsilon\simeq\varepsilon$ mentre $1-\cos\varepsilon\simeq\varepsilon^{2}/2$. <i>Non è un&rsquo;analogia: è lo stesso conto, fatto su due coppie di generatori diverse.</i></p>`},
  {t:'reveal', title:'Il lemma di Schur, e perché G = MQ non ammette alternative', tag:'costruzione', steps:[
   {label:'L’insieme irriducibile, e che cosa commuta con esso', body:R`
   <p>La relazione $(3.35\text{f})$, $[G_\alpha,P_\beta]=i\delta_{\alpha\beta}MI$, è soddisfatta da $G_\alpha=MQ_\alpha$: basta confrontarla con il commutatore canonico. Ma <i>soddisfatta</i> non significa <i>unica</i>, e la differenza fra le due cose è tutto ciò che serve dimostrare.</p>
   <p>Si osservi che $\mathbf G-M\mathbf Q$ commuta con $\mathbf P$ — per costruzione, i due commutatori con $\mathbf P$ sono uguali e si cancellano — e commuta anche con $\mathbf Q$, perché $[G_\alpha,Q_\beta]=0$ dal passo precedente e $[Q_\alpha,Q_\beta]=0$ per ipotesi. Dunque $\mathbf G-M\mathbf Q$ <b>commuta con l&rsquo;intero insieme $\{\mathbf Q,\mathbf P\}$</b>.</p>
   <p>E qui entra il teorema. Se la particella non ha gradi di libertà interni, l&rsquo;insieme $\{\mathbf Q,\mathbf P\}$ è <b>irriducibile</b>, e per il lemma di Schur ogni operatore che commuta con un insieme irriducibile è un multiplo dell&rsquo;identità. Ballentine ne dà anche la versione informale, che è quella da ricordare: «<i>If an operator commutes with $Q_\alpha$ then it must not be a function of $P_\alpha$, since the commutator of $Q_\alpha$ and $P_\alpha$ never vanishes on any vector. Similarly, if it commutes with $P_\alpha$ it must not be a function of $Q_\alpha$. If the operator is independent of both $\mathbf Q$ and $\mathbf P$, and if there are no internal degrees of freedom, then it can only be a multiple of the identity.</i>»</p>
   <p>Si ha dunque $G_\alpha=MQ_\alpha+c_\alpha I$. <b>E il termine costante muore per un argomento di simmetria, non di algebra</b>: $G_\alpha$ deve soddisfare $(3.35\text{e})$, cioè deve trasformarsi come la componente di un 3-vettore. Il termine $MQ_\alpha$ lo fa, perché $[J_\alpha,Q_\beta]=i\varepsilon_{\alpha\beta\gamma}Q_\gamma$; il termine $c_\alpha I$ <i>non può</i>, perché commuta con $J_\alpha$ e quindi si trasforma come uno scalare. Quindi $c_\alpha=0$ e</p>
   $$G_\alpha=MQ_\alpha.$$
   <p><b>La massa della tappa 05 ha trovato il suo significato</b>: la costante irremovibile dell&rsquo;algebra è il fattore che converte la posizione nel generatore dei boost. E si capisce retrospettivamente perché fosse irremovibile — toglierla significherebbe poter cambiare sistema di riferimento inerziale senza toccare lo stato.</p>`},
   {label:'Il momento angolare: J = Q × P, e il controllo esplicito', body:R`
   <p>Lo stesso schema, applicato a $\mathbf J$, dà il momento angolare. Si verifica — ed è il problema 3.6 di Ballentine, svolto nella tappa 10 — che $\mathbf J=\mathbf Q\times\mathbf P$ soddisfa le relazioni $(3.35\text{c,d,e})$ e la $[J_\alpha,Q_\beta]=i\varepsilon_{\alpha\beta\gamma}Q_\gamma$. Dalla $(3.35\text{d})$ e da quest&rsquo;ultima segue che $\mathbf J-\mathbf Q\times\mathbf P$ commuta con l&rsquo;insieme irriducibile $\{\mathbf Q,\mathbf P\}$, dunque per Schur è $J_\alpha=(\mathbf Q\times\mathbf P)_\alpha+c_\alpha I$, e le costanti devono annullarsi per soddisfare $(3.35\text{c})$ — questa volta non per un argomento di 3-vettore ma perché l&rsquo;algebra $[J_\alpha,J_\beta]=i\varepsilon_{\alpha\beta\gamma}J_\gamma$ non ammette l&rsquo;aggiunta di costanti, come la tappa 05 ha stabilito. Quindi</p>
   $$\mathbf J=\mathbf Q\times\mathbf P.$$
   <p>Che questa espressione <i>chiuda</i> l&rsquo;algebra delle rotazioni non è ovvio, e conviene controllarlo per esteso almeno una volta, in rappresentazione di Schrödinger e con $\hbar=1$. Con $J_1=-i(y\partial_z-z\partial_y)$ e $J_2=-i(z\partial_x-x\partial_z)$, applicando il commutatore a una funzione arbitraria $\psi(x,y,z)$:</p>
   $$[J_1,J_2]\psi=\Big(x\frac{\partial\psi}{\partial y}-y\frac{\partial\psi}{\partial x}\Big)=iJ_3\psi.$$
   <p>Tutti i termini in cui una derivata seconda colpisce $\psi$ si cancellano a coppie — è la <span class="str" data-str="derivazione">regola di Leibniz</span> che agisce due volte in senso opposto — e sopravvivono soltanto i termini in cui la derivata colpisce una <i>coordinata</i>. <b>È la stessa struttura del commutatore canonico</b> della tappa 04, dove l&rsquo;unico termine superstite era quello in cui la derivata colpiva il fattore $x$. Vale registrarlo come regola di lettura: in rappresentazione di Schrödinger, un commutatore non nullo è sempre un residuo della regola di Leibniz.</p>`}
  ]},
  {t:'reveal', title:'La hamiltoniana è forzata, non postulata', tag:'costruzione', steps:[
   {label:'Dalla relazione [G,H] = iP alla forma di H', body:R`
   <p>Resta l&rsquo;ultimo generatore, ed è quello che decide la dinamica. Si parte dalla $(3.35\text{h})$, $[G_\alpha,H]=iP_\alpha$, e si sostituisce il risultato appena ottenuto $G_\alpha=MQ_\alpha$. Dividendo per $M$:</p>
   $$[Q_\alpha,H]=\frac{iP_\alpha}{M}.$$
   <p>Si verifica immediatamente che $H=\mathbf P\cdot\mathbf P/2M$ soddisfa questa equazione. Non è unica — <i>ancora</i> — ma la differenza $H-\mathbf P\cdot\mathbf P/2M$ commuta con $\mathbf Q$ per quanto appena scritto, e commuta con $\mathbf P$ per la $(3.35\text{g})$, $[P_\alpha,H]=0$. Terzo uso del lemma di Schur, e la differenza è un multiplo dell&rsquo;identità:</p>
   $$H=\frac{\mathbf P\cdot\mathbf P}{2M}+E_0.$$
   <p>E da qui la velocità, che la prima parte della tappa aveva lasciato in sospeso:</p>
   $$\mathbf V=\frac{\mathbf P}{M}.$$
   <p><b>Si misuri il peso di questo risultato.</b> L&rsquo;energia cinetica di una particella libera non è stata scritta per analogia con $\tfrac12mv^{2}$ e non è stata postulata: è l&rsquo;<i>unica</i> forma compatibile con il fatto che il gruppo di Galilei agisca sugli stati. La costante additiva $E_0$ è l&rsquo;unica libertà residua, ed è precisamente la libertà di scegliere lo zero dell&rsquo;energia — che è la stessa libertà che si ha in meccanica classica, e per la stessa ragione: nessun esperimento misura un&rsquo;energia assoluta.</p>`},
   {label:'Il controllo in rappresentazione di Schrödinger', body:R`
   <p>Vale rifare il conto per esteso, in una dimensione e con le dimensioni ripristinate, per vedere che la velocità viene davvero $p/M$. Con $H=-\tfrac{\hbar^{2}}{2M}\tfrac{d^{2}}{dx^{2}}$ e $\hat Q$ che moltiplica per $x$, il commutatore $[H,\hat Q]$ applicato a $\psi$ è</p>
   $$-\frac{\hbar^{2}}{2M}\Big(\frac{d^{2}}{dx^{2}}(x\psi)-x\frac{d^{2}\psi}{dx^{2}}\Big)=-\frac{\hbar^{2}}{M}\frac{d\psi}{dx}.$$
   <p>Il conto è di nuovo Leibniz: $(x\psi)''=x\psi''+2\psi'$, il termine $x\psi''$ si cancella e resta $2\psi'$, che il fattore $\tfrac12$ riduce a uno. Moltiplicando per $i/\hbar$ come prescrive $\mathbf V=\tfrac{i}{\hbar}[H,\mathbf Q]$:</p>
   $$\frac{i}{\hbar}\Big(-\frac{\hbar^{2}}{M}\frac{d\psi}{dx}\Big)=-\frac{i\hbar}{M}\frac{d\psi}{dx},$$
   <p>e il membro di destra è $\hat p\psi/M$ con $\hat p=-i\hbar\,d/dx$. <b>Velocità uguale impulso diviso massa</b>, e nessuno l&rsquo;ha assunto: è una conseguenza di tre applicazioni del lemma di Schur e di una tabella di commutatori letta sulle coordinate.</p>`}
  ]},
  {t:'reveal', title:'Dove entra la costante di Planck, e perché non si può dedurre', tag:'esempio', steps:[
   {label:'Quattro quantità, una sola costante', body:R`
   <p>Si raccolgano i risultati. Con $\mathbf Q$ e $\mathbf V$ gli operatori di posizione e velocità, si è ottenuto</p>
   $$\mathbf P=M\mathbf V,\qquad H=\tfrac12M\,\mathbf V\cdot\mathbf V+E_0,\qquad \mathbf J=\mathbf Q\times M\mathbf V.$$
   <p>Se $M$ fosse la massa, queste sarebbero <i>esattamente</i> le forme familiari dell&rsquo;impulso, dell&rsquo;energia e del momento angolare. Ma $M$ non è stata identificata: è semplicemente la costante irremovibile dell&rsquo;algebra. Ballentine trae l&rsquo;unica conclusione lecita, e la scrive come una catena di rapporti uguali (pag. stampata 81):</p>
   $$\frac{M}{\text{massa}}=\frac{P}{\text{impulso}}=\frac{H}{\text{energia}}=\frac{J}{\text{momento angolare}}=\text{una costante fondamentale}=\hbar^{-1}.$$
   <p><b>Questo è il punto più profondo del capitolo, e il più facile da leggere di sfuggita.</b> Non si è dimostrato che $P$ sia l&rsquo;impulso: si è dimostrato che i quattro generatori stanno alle quattro quantità fisiche nello <i>stesso</i> rapporto, e che quindi esiste una sola costante di conversione fra il mondo geometrico dei generatori e il mondo dinamico delle osservabili. Quella costante è $\hbar$, «<i>hereby introduced into the theory as a fundamental constant</i>».</p>
   <p>E non si può dedurre: «<i>Its value can only be determined from experiment</i>». Ballentine dà il valore accettato al 1986 — $\hbar=1{,}054573\times10^{-34}$ joule-secondi — e indica il primo fenomeno del libro che ne permette una misura: la diffrazione di particelle da un cristallo, la riflessione di Bragg. Aggiunge una precisazione di nomenclatura che vale fare propria: «<i>The parameter $\hbar$ is sometimes referred to as “Planck&rsquo;s constant”, but strictly speaking, Planck&rsquo;s constant is $h=2\pi\hbar$</i>».</p>
   <p>Si noti che cosa <b>non</b> dice questo risultato. Non dice che $\hbar$ sia piccolo, né che il limite classico si ottenga per $\hbar\to0$: dice che i generatori delle simmetrie hanno dimensioni di un inverso di azione e le osservabili dimensioni di un&rsquo;azione, e che il ponte fra le due ha una scala. <b>La meccanica quantistica non ha una costante perché è «quantizzata»: ha una costante perché identifica due cose che in meccanica classica sono distinte</b> — la geometria dello spazio-tempo e le variabili dinamiche.</p>`},
   {label:'La notazione convenzionale, e la trappola che nasconde', body:R`
   <p>A questo punto Ballentine riscrive tutto nella notazione usuale, e l&rsquo;operazione è innocua solo se si sa che è stata fatta. Si ridefiniscono i simboli $M$, $\mathbf P$, $\mathbf J$ e $H$ perché siano <i>uguali</i> a massa, impulso, momento angolare ed energia invece che proporzionali: cioè, dove prima si scriveva uno di quei quattro simboli, da ora si scrive $M/\hbar$, $\mathbf P/\hbar$, $\mathbf J/\hbar$, $H/\hbar$. Gli operatori unitari diventano</p>
   $$e^{-i\mathbf a\cdot\mathbf P/\hbar},\qquad e^{-i\theta\hat n\cdot\mathbf J/\hbar},\qquad e^{-itH/\hbar}.$$
   <p><b>La trappola, e Ballentine la segnala esplicitamente</b>: «<i>When using the equations of Sec. 3.3 in future, one should first perform the substitutions</i>». Le nove relazioni della tabella (3.35) sono scritte <i>prima</i> della ridefinizione, quindi nella convenzione $\hbar=1$. Chi le usa dopo deve reinserire $\hbar$ dove serve, e il modo più sicuro è l&rsquo;alternativa che Ballentine offre: «<i>Alternatively one may simply think of them as being expressed in units such that $\hbar=1$</i>». Nella forma dimensionale, per esempio, $[G_\alpha,P_\beta]=i\delta_{\alpha\beta}MI$ diventa $[G_\alpha,P_\beta]=i\hbar\delta_{\alpha\beta}MI$ e $[Q_\alpha,P_\beta]=i\delta_{\alpha\beta}I$ diventa il commutatore canonico $[\hat q_\alpha,\hat p_\beta]=i\hbar\delta_{\alpha\beta}$.</p>
   <p>Questa è anche la risposta alla domanda che la tappa 04 aveva lasciato aperta. Lì, nella derivazione di Sakurai, si era ottenuto $[\hat x_i,\hat K_j]=i\delta_{ij}$ con $\mathbf K$ di dimensioni di un inverso di lunghezza, e si era osservato che $\mathbf K$ non <i>poteva</i> essere l&rsquo;impulso ma soltanto l&rsquo;impulso diviso una costante con le dimensioni di un&rsquo;azione. <b>Quella costante è $\hbar$, e questa tappa ha dimostrato che è la stessa per tutti e quattro i generatori</b> — che è precisamente ciò che la derivazione di Sakurai, prendendo in prestito l&rsquo;identificazione da fuori, non poteva dire.</p>`}
  ]},
  {t:'reveal', title:'Caso (ii): lo spin, e dove entra nel ragionamento', tag:'costruzione', steps:[
   {label:'Che cosa cambia quando l’insieme non è più irriducibile', body:R`
   <p>Tutta la costruzione precedente poggia su un&rsquo;ipotesi: che $\{\mathbf Q,\mathbf P\}$ sia irriducibile, cioè che gli unici operatori che commutano con la posizione e con l&rsquo;impulso siano i multipli dell&rsquo;identità. Se la particella ha gradi di libertà <i>interni</i> questo è falso per definizione — «<i>Internal degrees of freedom, by definition, are independent of the center of mass degrees of freedom, and they must be represented by operators that are independent of both $\mathbf Q$ and $\mathbf P$</i>» — e il lemma di Schur non si applica nella forma usata sopra. Vale la pena seguire che cosa sopravvive e che cosa no, perché il risultato è che <b>quasi tutto sopravvive</b>.</p>
   <p>Lo spin è, per definizione, un contributo interno al momento angolare, quindi al posto di $\mathbf J=\mathbf Q\times\mathbf P$ si ha</p>
   $$\mathbf J=\mathbf Q\times\mathbf P+\mathbf S,\qquad[\mathbf Q,\mathbf S]=[\mathbf P,\mathbf S]=0.$$
   <p>Siccome $\mathbf J$ deve soddisfare l&rsquo;algebra delle rotazioni $(3.35\text{c})$ e il primo termine la soddisfa già, <b>deve soddisfarla anche $\mathbf S$ da solo</b>:</p>
   $$[S_\alpha,S_\beta]=i\varepsilon_{\alpha\beta\gamma}S_\gamma.$$
   <p>Questa è l&rsquo;algebra dello spin, ottenuta senza postularla: è l&rsquo;unica algebra che un contributo interno al momento angolare <i>può</i> avere. La sua rappresentazione di dimensione due sono le <span class="str" data-str="matrici-di-pauli">matrici di Pauli</span>, con $\mathbf S=\tfrac{\hbar}{2}\boldsymbol\sigma$.</p>
   <p>Per $\mathbf G$ il ragionamento si ripete con una complicazione e si chiude. $\mathbf G-M\mathbf Q$ commuta ancora con $\mathbf Q$ e $\mathbf P$, ma ora può essere una funzione di $\mathbf S$. E qui Ballentine usa un argomento che vale isolare: <i>l&rsquo;unica funzione di $\mathbf S$ che sia un 3-vettore è un multiplo di $\mathbf S$ stesso</i>, perché dall&rsquo;algebra segue $\mathbf S\times\mathbf S=i\mathbf S$ e quindi «<i>no new vector operator can be formed by taking higher powers of $\mathbf S$</i>». Dunque $\mathbf G=M\mathbf Q+c\mathbf S$; ma la $(3.35\text{b})$ richiede che le tre componenti di $\mathbf G$ commutino fra loro, e le componenti di $\mathbf S$ non commutano — quindi $c=0$ e <b>$\mathbf G=M\mathbf Q$ anche qui</b>.</p>
   <p>Per $H$ cambia solo la costante: l&rsquo;argomento che portava a $H=\mathbf P\cdot\mathbf P/2M+E_0$ regge, ma ora $E_0$ può essere funzione di $\mathbf S$. La $(3.35\text{i})$, $[\mathbf J,H]=0$, impone $[\mathbf S,E_0]=0$, e l&rsquo;unico oggetto costruibile con $\mathbf S$ che commuti con tutte le sue componenti è $\mathbf S\cdot\mathbf S$: dunque $E_0$ è un multiplo di $\mathbf S\cdot\mathbf S$, cioè un <b>contributo interno all&rsquo;energia</b>. E siccome $[E_0,\mathbf Q]=0$, l&rsquo;identificazione $\mathbf V=\mathbf P/M$ resta valida intatta.</p>`}
  ]},
  {t:'reveal', title:'Caso (iii): la forma unica delle interazioni compatibili con Galilei', tag:'esempio', steps:[
   {label:'Perché le interazioni cambiano H e non P', body:R`
   <p>Finora si è trattata una particella libera. Le interazioni modificano l&rsquo;evoluzione temporale dello stato, e si tiene conto di questo conservando la forma dell&rsquo;equazione del moto $d|\Psi\rangle/dt=-iH|\Psi\rangle$ e modificando $H$, che da qui in avanti si chiama <b>hamiltoniana</b> e non più generatore delle traslazioni temporali. Il prezzo è che si rinuncia alle tre relazioni $(3.35\text{g,h,i})$, quelle che contengono $H$.</p>
   <p>Ma perché proprio $H$ e non $\mathbf P$? La domanda è legittima e Ballentine le dedica un paragrafo che è il più bel pezzo di prosa del capitolo, e che vale riportare per intero perché risponde con un&rsquo;immagine invece che con una formula:</p>
   <p><i>«If the system under consideration were a self-propelled machine, we could imagine it displacing itself through space under its own power, consuming fuel, expelling exhaust, and dropping worn-out parts along the way. If $\mathbf P$ generated that kind of displacement, then the form of the operators $\mathbf P$ certainly would be altered by the interactions that were responsible for the displacement. But that is not what we mean by the operation of space displacement. Rather, we mean the purely geometric operation of displacing the system self-congruently to another location.»</i></p>
   <p><b>La distinzione è fra uno spostamento che il sistema SUBISCE e uno spostamento che il sistema COMPIE.</b> I generatori di simmetria generano il primo: prendere il sistema e metterlo altrove, identico a sé stesso. Per questo le interazioni non li toccano. $H$ invece viene ridefinito: non è più lo spostamento geometrico lungo l&rsquo;asse dei tempi, è il generatore dell&rsquo;<i>evoluzione dinamica</i> — e quella sì che dipende dalle forze in gioco.</p>
   <p>L&rsquo;operatore di velocità resta definito da $\mathbf V=i[H,\mathbf Q]$, perché quella forma veniva dall&rsquo;equazione del moto e non dalle relazioni abbandonate; ma il suo valore esplicito cambierà, dato che $H$ è cambiato.</p>`},
   {label:'La velocità più generale, e la hamiltoniana che ne segue', body:R`
   <p>L&rsquo;unico vincolo su $H$ viene dal suo legame con la velocità, e il comportamento della velocità sotto boost è noto: $e^{i\mathbf v\cdot\mathbf G}\mathbf Ve^{-i\mathbf v\cdot\mathbf G}=\mathbf V-\mathbf vI$, che sviluppata al primo ordine dà</p>
   $$[G_\alpha,V_\beta]=i\delta_{\alpha\beta}I.$$
   <p>L&rsquo;identificazione $G_\alpha=MQ_\alpha$ resta valida, «<i>because its derivation did not make use of any commutators involving $H$</i>» — e questa è la ragione per cui la demolizione di tre relazioni su nove non manda per aria tutto il resto. Ora: $\mathbf V=\mathbf P/M$ è ancora <i>una</i> soluzione, ma non più l&rsquo;unica. Dalla relazione appena scritta e dalla $(3.35\text{f})$ segue che $\mathbf V-\mathbf P/M$ commuta con $\mathbf G=M\mathbf Q$, cioè con $\mathbf Q$; e siccome in assenza di gradi di libertà interni le tre componenti di $\mathbf Q$ formano un insieme commutante <i>completo</i>, un operatore che commuta con esse deve essere una funzione di $\mathbf Q$. Quarta applicazione dello stesso tipo di argomento, e la forma più generale della velocità è</p>
   $$\mathbf V=\frac{\mathbf P}{M}-\mathbf A(\mathbf Q).$$
   <p>Resta da risolvere $\mathbf V=i[H,\mathbf Q]$ per $H$. Una soluzione è $H_0=(\mathbf P-\mathbf A)^{2}/2M$, come si verifica direttamente; e $H-H_0$ commuta allora con l&rsquo;insieme commutante completo $(Q_1,Q_2,Q_3)$, dunque è una funzione di $\mathbf Q$. La forma più generale dell&rsquo;hamiltoniana di una particella senza spin che interagisce con campi esterni è pertanto</p>
   $$H=\frac{(\mathbf P-\mathbf A)^{2}}{2M}+W(\mathbf Q).$$
   <p><b>E questo è il risultato che quasi nessun manuale mostra.</b> «<i>With this result, we have deduced that the only forms of interaction consistent with invariance under the Galilei group of transformations are a scalar potential $W(\mathbf Q)$ and a vector potential $\mathbf A(\mathbf Q)$.</i>» Non è che l&rsquo;elettromagnetismo si accoppi <i>così</i> per una scelta felice: è che <b>non esiste nessun altro modo di accoppiare qualcosa a una particella quantistica non relativistica</b>. Entrambi i potenziali possono dipendere dal tempo; come operatori possono essere funzioni di $\mathbf Q$ ma devono essere indipendenti da $\mathbf P$.</p>
   <p>Ballentine aggiunge due avvertenze che impediscono di trarre una conclusione più forte del dovuto. La prima: $\mathbf A$ e $W$ <i>non</i> si identificano necessariamente con i potenziali elettromagnetici, perché sono funzioni arbitrarie e non devono soddisfare le equazioni di Maxwell — «<i>For example, the Newtonian gravitational potential can also be included in the scalar $W$</i>». La seconda: il caso di un campo esterno non limita la generalità, perché le interazioni <i>fra</i> particelle si includono trattando le altre particelle come sorgenti di campo. L&rsquo;esempio che dà è l&rsquo;interazione coulombiana fra due elettroni, $W=e^{2}/|\mathbf Q^{(1)}-\mathbf Q^{(2)}|$.</p>
   <p>Il controllo esplicito, in una dimensione, chiude il cerchio con la prima parte della tappa. Con $H_0=\tfrac{1}{2M}\big(\hat p-A(x)\big)^{2}$ e $\hat p=-i\hbar\,d/dx$:</p>
   $$\frac{i}{\hbar}[H_0,\hat x]\psi=\frac{1}{M}\Big(-i\hbar\frac{d\psi}{dx}-A(x)\psi\Big),$$
   <p>cioè $\mathbf V=(\mathbf P-\mathbf A)/M$ come previsto. <b>Si noti che il conto non richiede di sapere nulla di $A$</b>: vale per ogni funzione $A(x)$, ed è questo il senso in cui la forma è <i>unica</i>.</p>`}
  ]},
  {t:'reveal', title:'Sistemi composti, e il prodotto di Kronecker', tag:'costruzione', steps:[
   {label:'Perché lo spazio di un sistema composto è un prodotto', body:R`
   <p>I risultati ottenuti riguardano una particella. Per generalizzarli a un sistema con due componenti separabili, Ballentine parte da un requisito operativo invece che da un postulato: <b>deve essere possibile preparare gli stati delle due componenti in modo indipendente</b>. «<i>This is not to say that all states of the composite system must be of this character, but only that such independent state preparations must be possible.</i>»</p>
   <p>Da qui segue tutto. Se $A^{(1)}$ è un&rsquo;osservabile della componente 1 e $B^{(2)}$ una della componente 2, si può preparare uno stato in cui $A^{(1)}$ ha un valore definito, e quello stato è un autovettore di $A^{(1)}$; esiste l&rsquo;analogo per $B^{(2)}$; e siccome le due manipolazioni sono indipendenti, <i>per ogni coppia di autovalori</i> deve esistere un autovettore congiunto. L&rsquo;esistenza di autovettori comuni per ogni coppia di autovalori equivale alla commutatività:</p>
   $$[A^{(1)}_i,B^{(2)}_j]=0\quad\text{per ogni }i,j.$$
   <p>In particolare posizione, impulso e spin della particella 1 commutano con posizione, impulso e spin della particella 2. Lo spazio degli stati è il <span class="str" data-str="prodotto-tensoriale">prodotto tensoriale</span> dei due, e la stessa proprietà vale non solo per componenti fisicamente separabili ma per qualunque coppia di gradi di libertà <i>cinematicamente</i> indipendenti — «<i>not to be confused with noninteracting</i>». Il caso dello spin del paragrafo precedente ne è un esempio, e lo è anche la commutatività delle tre componenti della posizione, che era stata introdotta per ipotesi: «<i>In physical terms, this is equivalent to assuming that it is possible to prepare a state that localizes a particle arbitrarily closely to a point.</i>»</p>
   <p>Sugli stati fattorizzati $|\Psi\rangle=|\psi\rangle^{(1)}\otimes|\varphi\rangle^{(2)}$ la distribuzione di probabilità congiunta si fattorizza,</p>
   $$\mathrm{Prob}\{(A=a_m)\,\&\,(B=b_n)|\Psi\}=|\langle a_m|\psi\rangle^{(1)}|^{2}\,|\langle b_n|\varphi\rangle^{(2)}|^{2},$$
   <p>cioè le due osservabili sono statisticamente indipendenti. Ballentine mette subito l&rsquo;avvertenza: «<i>It should be emphasized that this factored, or uncorrelated, state is a very special kind of state</i>». <b>Lo stato fattorizzato è l&rsquo;eccezione, non la regola</b>, e la classificazione di tutti gli stati possibili di un sistema composto è il contenuto di un altro capitolo.</p>`},
   {label:'Il prodotto di Kronecker, e una traccia che si fattorizza', body:R`
   <p>Il problema 3.11 di fine capitolo chiede di dimostrare una proprietà del prodotto di Kronecker che vale sapere a memoria, perché è il modo più rapido di controllare un conto su sistemi composti. Il prodotto di Kronecker di due matrici, $M=A\otimes B$, è definito per elementi come $M_{\alpha\gamma,\beta\delta}=A_{\alpha\beta}B_{\gamma\delta}$, con le righe di $M$ etichettate dalla coppia $\alpha\gamma$ e le colonne da $\beta\delta$. L&rsquo;asserto è che la <span class="str" data-str="traccia">traccia</span> si fattorizza.</p>
   <p>La dimostrazione è una riga — la traccia somma gli elementi con $\alpha=\beta$ e $\gamma=\delta$, cioè $\sum_{\alpha\gamma}A_{\alpha\alpha}B_{\gamma\gamma}=(\sum_\alpha A_{\alpha\alpha})(\sum_\gamma B_{\gamma\gamma})$ — e un esempio numerico la rende verificabile. Con</p>
   $$A=\begin{pmatrix}1&2\\3&4\end{pmatrix},\qquad B=\begin{pmatrix}5&6\\7&8\end{pmatrix},$$
   <p>il prodotto di Kronecker è una matrice $4\times4$ e la sua traccia vale</p>
   $$\operatorname{Tr}(A\otimes B)=65=(\operatorname{Tr}A)(\operatorname{Tr}B),$$
   <p>con $\operatorname{Tr}A=5$ e $\operatorname{Tr}B=13$. Il problema 3.12 dà la conseguenza dinamica: se l&rsquo;hamiltoniana di un sistema a due componenti è $H=H_1\otimes I+I\otimes H_2$, cioè <i>senza</i> interazione fra le componenti, allora l&rsquo;operatore di evoluzione si fattorizza, $U(t)=U_1(t)\otimes U_2(t)$ con $U_j(t)=e^{-itH_j/\hbar}$. <b>È l&rsquo;enunciato preciso di «due sistemi che non interagiscono evolvono separatamente»</b>, e la ragione per cui è vero è che i due addendi di $H$ commutano: solo allora l&rsquo;esponenziale di una somma è il prodotto degli esponenziali.</p>`}
  ]},
  {t:'reveal', title:'Perché questa strada e non la quantizzazione canonica', tag:'architettura', steps:[
   {label:'La regola di sostituzione, e l’obiezione epistemologica', body:R`
   <p>Il metodo di questa tappa va confrontato con quello che quasi tutti i corsi usano, e il confronto è il §3.6 di Ballentine. La strada alternativa parte dalle <span class="str" data-str="parentesi-di-poisson">parentesi di Poisson</span> della tappa 01: siccome la relazione classica $\{q_\alpha,p_\beta\}=\delta_{\alpha\beta}$ corrisponde alla relazione quantistica $[Q_\alpha,P_\beta]=i\hbar\delta_{\alpha\beta}$, l&rsquo;analogia suggerisce che esista una regola che assegna a ogni funzione classica $r(q,p)$ un operatore $O(r)$ tale che</p>
   $$[O(r),O(s)]=i\hbar\,O(\{r,s\}).$$
   <p>Una regola generale di questo tipo si chiama <i>quantizzare</i> il sistema classico. Ballentine solleva due obiezioni, e la prima non è tecnica:</p>
   <p><i>«If the quantum-mechanical equations can be obtained from those of classical mechanics by a substitution rule, then the content of quantum theory must be logically contained within classical mechanics, with only a translation key being required to read it out. This seems implausible. Surely quantum theory is more general in its physical content than is classical theory, with the results of the classical theory being recoverable as a limiting case of quantum theory, but not the other way around.»</i></p>
   <p><b>È un&rsquo;obiezione sulla direzione della freccia logica</b>, e si applica anche a chi usa la regola di sostituzione «solo come scorciatoia»: se la teoria più generale si deduce dalla meno generale per traduzione, qualcosa nella descrizione non torna. Ballentine rivendica che il metodo di Jordan non ha questo difetto: «<i>Although analogies with classical expressions for the momentum and kinetic energy of a particle were used to interpret certain operators, the derivation of the operators was based entirely on quantum-mechanical principles, with no use being made of the equations of classical mechanics.</i>» L&rsquo;analogia classica è servita a <i>dare il nome</i> a $P$, $J$ e $H$; non a ricavarli.</p>`},
   {label:'L’obiezione tecnica, e i teoremi di impossibilità', body:R`
   <p>La seconda obiezione è una questione di coerenza interna, e si trasforma in teoremi. Le equazioni classiche in forma di parentesi di Poisson sono indipendenti dalla scelta delle coordinate generalizzate, quindi si vorrebbe che la regola di sostituzione lo fosse anche. Inoltre, se $r(q,p)$ va in $O(r)$, per consistenza si vorrebbe che una funzione $f(r(q,p))$ andasse <i>nella stessa funzione dell&rsquo;operatore</i>:</p>
   $$O(f(r))=f(O(r)).$$
   <p>Sono due richieste ragionevoli, e insieme sono <b>impossibili</b>. Ballentine cita tre lavori che dimostrano l&rsquo;impossibilità di regole generali di quantizzazione che le soddisfino: Abraham e Marsden (1978), Arens e Babbitt (1965), Margenau e Cohen (1967). <i>Non è una difficoltà pratica</i>: è un teorema che dice che la mappa cercata non esiste.</p>
   <p>Un&rsquo;ambiguità concreta che chiunque incontra: a quale operatore corrisponde la funzione classica $qp$? A $\hat Q\hat P$, a $\hat P\hat Q$, al loro ordinamento simmetrico $\tfrac12(\hat Q\hat P+\hat P\hat Q)$? Le tre differiscono per multipli di $i\hbar$, le prime due non sono nemmeno autoaggiunte, e la regola di sostituzione non dice quale scegliere. La tappa 10 incontrerà proprio questo oggetto, perché il generatore delle dilatazioni è l&rsquo;ordinamento simmetrico — e l&rsquo;argomento che costringe a quella scelta non è una regola di quantizzazione ma, ancora una volta, la richiesta di autoaggiuntezza.</p>
   <p>Ballentine è onesto sul prezzo della sua strada: «<i>Our method, based on the symmetries of space–time, does not yield a general rule for assigning an operator to an arbitrary classical function of coordinates and momenta.</i>» Non c&rsquo;è una ricetta universale. Ma aggiunge che la teoria non sembra soffrirne, «<i>$(3.60)$ being the most general case encountered in practice</i>» — cioè la forma $(\mathbf P-\mathbf A)^{2}/2M+W(\mathbf Q)$ copre tutto ciò che si incontra davvero. <b>Si confronti il bilancio</b>: la quantizzazione canonica offre una regola generale che non esiste; il metodo delle simmetrie offre una forma unica per i casi che servono.</p>`}
  ]},
  {t:'prosa', title:'Il minimo di dinamica che serve al resto del movimento', tag:'architettura', html:R`
  <p>Il §3.7 di Ballentine svolge le equazioni del moto, e questo movimento non le svolge: sono il contenuto di un altro lavoro. Ma due formule di quel paragrafo servono alla tappa 07 e vanno messe a disposizione qui, dove il generatore del tempo è appena stato identificato.</p>
  <p>La prima è l&rsquo;operatore di evoluzione. Dato lo stato a $t=t_0$, la soluzione di $d|\Psi\rangle/dt=-\tfrac{i}{\hbar}H(t)|\Psi\rangle$ si scrive $|\Psi(t)\rangle=U(t,t_0)|\Psi(t_0)\rangle$, con $U$ che soddisfa la stessa equazione e $U(t_0,t_0)=1$. <b>$U$ è unitario se e solo se $H$ è autoaggiunto</b>, e la dimostrazione è di due righe: derivando $U^\dagger U$ si ottiene $\tfrac{i}{\hbar}(U^\dagger H^\dagger U-U^\dagger HU)$, che si annulla esattamente quando $H^\dagger=H$. Se $H$ non dipende dal tempo, $U(t,t_0)=e^{-i(t-t_0)H/\hbar}$; se ne dipende, in generale non esiste forma chiusa. <i>Questo è il punto in cui l&rsquo;autoaggiuntezza dell&rsquo;hamiltoniana smette di essere un requisito formale</i>: è ciò che conserva la probabilità nel tempo.</p>
  <p>La seconda è la derivata temporale di un valor medio. Con lo stato descritto da un operatore di stato $\rho(t)=U\rho_0U^\dagger$ e la media $\langle R\rangle_t=\operatorname{Tr}\{\rho(t)R\}$, si ottiene</p>
  $$\frac{d}{dt}\langle R\rangle_t=\operatorname{Tr}\Big\{\frac{i}{\hbar}\rho(t)[H,R]+\rho(t)\frac{\partial R}{\partial t}\Big\},$$
  <p>dove il secondo termine c&rsquo;è solo se l&rsquo;operatore $R$ ha una dipendenza temporale <i>intrinseca</i> — il potenziale di un campo esterno variabile, o la componente di un tensore definito rispetto a un sistema di coordinate in moto. <b>È la formula da cui la tappa 07 fa uscire il teorema di conservazione</b>, e si osservi che vale per stati qualunque, non solo per stati puri: è scritta con la <span class="str" data-str="traccia">traccia</span> e un operatore di stato, non con un bra e un ket.</p>
  <p>Un&rsquo;avvertenza di Ballentine sui due quadri, perché è un errore che si fa: nel quadro di Schrödinger la dipendenza dal tempo la porta lo stato, in quello di Heisenberg la portano le osservabili, $R_H(t)=U^\dagger RU$, con l&rsquo;equazione $dR_H/dt=\tfrac{i}{\hbar}[H_H,R_H]+(\partial R/\partial t)_H$. I due sono equivalenti perché «<i>the physically significant quantity $\langle R\rangle_t$ depends only on the relative motion of $\rho$ and $R$</i>» — e la differenza di segno fra le due equazioni del moto viene dall&rsquo;oppostezza dei due movimenti. «<i>It should be obvious that those two equations are mutually exclusive and will never be used together.</i>»</p>`},
  {t:'reveal', title:'Postulare i commutatori o derivarli: la mappa dei testi del corso', tag:'formalismi', steps:[
   {label:'Chi li postula', body:R`
   <p>Picasso li postula, nel §4.12: <i>«Postulato di quantizzazione: i commutatori (4.47) sono proporzionali alle corrispondenti parentesi di Poisson»</i>, e poi fissa la costante a $i\hbar$ con un argomento di dimensioni e di hermitianità. Shankar li mette nel secondo postulato, in forma di elementi di matrice: $X$ e $P$ sono rappresentati da operatori hermitiani con $\langle x|X|x'\rangle=x\,\delta(x-x')$ e $\langle x|P|x'\rangle=-i\hbar\,\delta'(x-x')$. Da qui $P$ agisce sulle funzioni d&rsquo;onda come $-i\hbar\,d/dx$, e il commutatore canonico è un conto di una riga: su una funzione qualsiasi, $XP-PX$ dà $i\hbar f$. È la strada di Dirac, che passa dalle parentesi di Poisson al commutatore.</p>`},
   {label:'Chi li deriva', body:R`
   <p>Ballentine li deriva, ed è la strada di questa tappa: i generatori delle simmetrie del gruppo di Galilei, identificati con le osservabili, hanno commutatori fissati dalla struttura del gruppo. Secondo la sintesi dei postulati preparata dall&rsquo;amico di Giuseppe, le note manoscritte del professore fanno la stessa scelta con il loro quinto postulato, che la sintesi riporta come <i>«il generatore di una trasformazione di simmetria è proporzionale all&rsquo;operatore dell&rsquo;osservabile conservata; la costante è $\hbar$»</i>; da lì derivano l&rsquo;equazione di Schrödinger, l&rsquo;impulso come generatore delle traslazioni e le relazioni canoniche, e alle pagine 108-110 le note indicano l&rsquo;alternativa di postularle direttamente. Le note non sono in questo ritaglio: l&rsquo;attribuzione è della sintesi.</p>
   <p>Un dettaglio da non confondere all&rsquo;orale: la sintesi riferisce che le note del professore chiamano il loro quinto postulato «postulato di quantizzazione», lo stesso nome che Picasso dà alla regola dei commutatori. Sono due postulati diversi con lo stesso nome, uno sui generatori e uno sui commutatori.</p>`},
   {label:'Perché le due strade danno la stessa teoria', body:R`
   <p>La sintesi indica il ponte matematico nel teorema di Stone, che lega i gruppi unitari a un parametro ai loro generatori autoaggiunti, e nel teorema di Stone e von Neumann, che garantisce che una rappresentazione irriducibile delle relazioni canoniche sia unica a meno di equivalenze unitarie: per questo le due strade portano alla stessa teoria. Osserva anche che il postulato sui generatori è <i>«il postulato più neutrale»</i>, condiviso da tutte le interpretazioni, ed è la ragione per cui Ballentine può partire da lì. La dimostrazione del teorema di Stone e von Neumann non è fra le fonti aperte; ciò che qui si verifica è il passo di Shankar dalla rappresentazione di $P$ al commutatore.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Il lemma di Schur è usato quattro volte in questa tappa, e ogni volta l&rsquo;argomento è «commuta con tutto, quindi è un multiplo dell&rsquo;identità». Ma nel caso (ii), con lo spin, lo stesso argomento non si applica. Che cosa esattamente cambia?`,
    a:R`Cambia l&rsquo;insieme rispetto a cui si chiede l&rsquo;irriducibilità. Il lemma di Schur dice che un operatore che commuta con un insieme <i>irriducibile</i> è un multiplo dell&rsquo;identità, e «irriducibile» significa che non esiste un sottospazio proprio invariante — equivalentemente, nel linguaggio di Ballentine, che non esistono operatori non banali che commutino con tutto l&rsquo;insieme. Per una particella senza gradi di libertà interni $\{\mathbf Q,\mathbf P\}$ è irriducibile, e l&rsquo;argomento informale lo rende plausibile: chi commuta con $\mathbf Q$ non può dipendere da $\mathbf P$, chi commuta con $\mathbf P$ non può dipendere da $\mathbf Q$, e non resta niente. Con lo spin resta qualcosa: gli operatori $\mathbf S$ commutano con $\mathbf Q$ e con $\mathbf P$ per definizione di grado di libertà interno, quindi $\{\mathbf Q,\mathbf P\}$ non è più irriducibile e il lemma non si applica. <b>La conclusione cambia nella forma minima possibile</b>: dove prima si concludeva «multiplo dell&rsquo;identità», ora si conclude «funzione di $\mathbf S$», e poi si usano altre relazioni dell&rsquo;algebra per eliminare quella funzione. Per $\mathbf G$ la elimina $[G_\alpha,G_\beta]=0$; per $E_0$ non la elimina niente, e infatti $E_0$ resta una funzione di $\mathbf S\cdot\mathbf S$ — cioè l&rsquo;energia interna esiste davvero.`},
   {q:R`La tappa dimostra che $H=(\mathbf P-\mathbf A)^{2}/2M+W(\mathbf Q)$ è l&rsquo;unica forma compatibile con l&rsquo;invarianza di Galilei. Ma l&rsquo;hamiltoniana di un oscillatore armonico accoppiato a un campo, o quella di una particella con interazione spin-orbita $\propto\mathbf S\cdot\mathbf L$, non hanno quella forma. C&rsquo;è una contraddizione?`,
    a:R`No, e distinguere i tre casi chiarisce l&rsquo;enunciato. <b>Primo</b>: l&rsquo;oscillatore armonico <i>ha</i> quella forma, con $\mathbf A=0$ e $W(\mathbf Q)=\tfrac12M\omega^{2}\mathbf Q\cdot\mathbf Q$. Qualunque potenziale scalare, per complicato che sia, è un caso particolare di $W(\mathbf Q)$: la restrizione non è sulla forma di $W$ ma sul fatto che $W$ dipenda da $\mathbf Q$ e non da $\mathbf P$. <b>Secondo</b>: l&rsquo;interazione spin-orbita cade fuori perché la derivazione assume esplicitamente «<i>only a spinless particle</i>» e, soprattutto, perché usa che le tre componenti di $\mathbf Q$ formino un insieme commutante <i>completo</i> — cosa che è falsa se ci sono gradi di libertà interni. Con lo spin la conclusione si indebolisce: $\mathbf V-\mathbf P/M$ può essere funzione di $\mathbf Q$ <i>e di</i> $\mathbf S$, e compaiono termini come $\mathbf S\cdot\mathbf L$. <b>Terzo</b>, e più importante: l&rsquo;enunciato è condizionato all&rsquo;invarianza <i>galileiana</i>. Un&rsquo;interazione che non la rispetta — per esempio una dipendenza da $\mathbf P$ che non sia nella combinazione $(\mathbf P-\mathbf A)$ — è matematicamente scrivibile e fisicamente esclusa dal fatto che tutti gli osservatori inerziali non relativistici devono vedere la stessa fisica. Il teorema non dice che cosa si può scrivere: dice che cosa è compatibile con la simmetria, e il suo valore sta esattamente lì.`},
   {q:R`$\hbar$ entra come costante di conversione fra generatori e variabili dinamiche, e il suo valore «si può determinare solo dall&rsquo;esperimento». Ma non si potrebbe scegliere $\hbar=1$ e dire che la domanda non esiste?`,
    a:R`Si può, e Ballentine stesso lo propone come alternativa — «<i>one may simply think of them as being expressed in units such that $\hbar=1$</i>» — ma la scelta sposta la domanda invece di scioglierla. Porre $\hbar=1$ significa <i>misurare l&rsquo;impulso in inversi di lunghezza e l&rsquo;energia in inversi di tempo</i>: perfettamente lecito, e in quelle unità non c&rsquo;è nessuna costante da misurare. Ciò che resta da misurare è il <b>rapporto</b> fra quelle unità e quelle in cui si fa laboratorio: quante «lunghezze inverse» stanno in un chilogrammo-metro-al-secondo. Quel rapporto è un fatto sperimentale, e nessuna scelta di unità lo cancella. <i>La distinzione da tenere è fra una costante dimensionale e una adimensionale</i>: $\hbar$ è della prima specie, e per le costanti di quella specie la domanda «quanto vale» è sempre la domanda «in quali unità», mentre per le seconde — la costante di struttura fine $\alpha\simeq1/137$, che Picasso usa al §13.5 per stimare la vita media di uno stato eccitato — il valore è un fatto sulla natura che nessuna scelta di unità tocca. Che $\hbar$ sia della prima specie è anche la ragione per cui il «limite classico per $\hbar\to0$» va maneggiato con attenzione: una quantità dimensionale non è piccola in sé, è piccola rispetto a un&rsquo;altra quantità con le stesse dimensioni — l&rsquo;azione tipica del problema.`}
  ]}
]},

/* ---------------- 07 · IL TEOREMA DI CONSERVAZIONE, NEI DUE VERSI ---------------- */
{ num:'07', title:'Il teorema di conservazione, nei due versi, e che cosa si conserva davvero', meta:'invarianza infinitesima e invarianza finita si implicano · non il valor medio ma tutta la distribuzione · costante del moto non è stato stazionario · il tempo entra solo per differenze di energia',
  blocchi:[
  {t:'prosa', title:'Il teorema, e perché ha bisogno di tre enunciati e non di uno', tag:'architettura', html:R`
  <p>Le tappe 05 e 06 hanno prodotto gli operatori. Questa tappa produce la ragione per cui li si chiama <i>quantità conservate</i>, e lo fa con più cura di quanto l&rsquo;espressione «il generatore di una simmetria si conserva» suggerisca. Ci sono tre cose distinte da dimostrare, e confonderle è il modo normale di fraintendere il teorema:</p>
  <p><b>Primo</b>, che l&rsquo;invarianza dell&rsquo;hamiltoniana sotto la trasformazione <i>finita</i> e sotto quella <i>infinitesima</i> siano la stessa condizione. Non è ovvio: una è un&rsquo;affermazione per ogni valore del parametro, l&rsquo;altra una condizione su una derivata nell&rsquo;origine.</p>
  <p><b>Secondo</b>, che ciò che non cambia nel tempo non sia soltanto il valor medio del generatore, ma <i>l&rsquo;intera distribuzione di probabilità</i> dei suoi valori. È la differenza fra «in media si conserva» e «si conserva», e la seconda è un&rsquo;affermazione molto più forte.</p>
  <p><b>Terzo</b>, che «costante del moto» e «stato stazionario» siano concetti diversi, e che la differenza stia in <i>quale</i> dei due quantificatori è universale: in uno stato stazionario non cambiano nel tempo le medie di <b>tutte</b> le osservabili; di una costante del moto non cambia nel tempo la media in <b>tutti</b> gli stati.</p>
  <p>Il risultato algebrico che regge i tre enunciati è una riga sola, e vale averla in mente leggendo il resto: se $U(s)=e^{isK}$ è una famiglia unitaria continua con generatore autoaggiunto $K$, allora <b>$H$ è invariante sotto quella famiglia se e solo se $[H,K]=0$</b>.</p>`},
  {t:'reveal', title:'L’invarianza, e i due versi dell’implicazione', tag:'costruzione', steps:[
   {label:'Dal finito all’infinitesimo', body:R`
   <p>Dire che l&rsquo;hamiltoniana è invariante sotto la trasformazione $U(s)$ significa che trasformare il sistema non cambia la sua hamiltoniana:</p>
   $$U(s)HU^{-1}(s)=H,$$
   <p>o equivalentemente $[H,U(s)]=0$ — l&rsquo;equivalenza è immediata moltiplicando a destra per $U(s)$. Ballentine avverte di non confondere questo $U(s)$ con l&rsquo;operatore di evoluzione $U(t,t_0)$ della tappa 06: «<i>This operator $U(s)$ should not be confused with the time development operator</i>». Sono due famiglie unitarie diverse, e il teorema parla della prima.</p>
   <p>Si faccia $s$ infinitesimo, $U(s)=1+isK+O(s^{2})$, e si sviluppi la condizione di invarianza. Al primo ordine in $s$ resta</p>
   $$[H,K]=0.$$
   <p>Fin qui è il verso facile: <b>l&rsquo;invarianza per ogni $s$ implica l&rsquo;invarianza per $s$ infinitesimo</b>, e quest&rsquo;ultima è la relazione di commutazione. Ballentine lo dice in una riga: «<i>The invariance of $H$ under the continuous transformation $U(s)$ for all $s$ clearly implies invariance under the infinitesimal transformation, and hence the commutation relation.</i>»</p>`},
   {label:'Il verso difficile, e perché è gratis', body:R`
   <p>Il verso inverso è quello che conta, perché nella pratica ciò che si verifica è sempre un commutatore — si guarda l&rsquo;hamiltoniana, si guarda il generatore, e si calcola. Se da $[H,K]=0$ non seguisse l&rsquo;invarianza <i>finita</i>, quel calcolo non dimostrerebbe che il sistema ha la simmetria.</p>
   <p>E invece segue, e segue da una sola osservazione: <b>$U(s)$ è una funzione di $K$</b>. Il teorema della tappa 03 dice che ogni famiglia unitaria a un parametro è l&rsquo;esponenziale del suo generatore, cioè $U(s)=e^{isK}$, e un operatore che commuta con $K$ commuta con qualunque funzione di $K$ — basta guardare la serie di potenze, in cui compaiono solo potenze di $K$. Quindi $[H,K]=0$ implica $[H,U(s)]=0$ per ogni $s$, e Ballentine conclude: «<i>Thus invariance under an infinitesimal transformation implies invariance under the corresponding finite continuous transformations.</i>»</p>
   <p><b>Questo è il punto in cui il teorema della tappa 03 paga il suo prezzo.</b> Senza la forma esponenziale — cioè senza il teorema di Stone, che Picasso enuncia al §9.1 — l&rsquo;equivalenza fra invarianza infinitesima e finita andrebbe dimostrata caso per caso, e in generale sarebbe falsa: per una famiglia di trasformazioni che <i>non</i> sia un gruppo a un parametro, la derivata nell&rsquo;origine non determina niente. È l&rsquo;esponenziale a trasportare un&rsquo;informazione locale su tutto l&rsquo;intervallo, e lo fa perché risolve un&rsquo;equazione differenziale, non perché approssima.</p>
   <p>Un&rsquo;avvertenza che Ballentine aggiunge e che vale registrare: se $H=H(t)$ dipende dal tempo, per trarre conseguenze utili dall&rsquo;invarianza occorre che le due condizioni valgano <i>per ogni $t$</i>. «<i>Usually $H$ will be independent of $t$ in the practical cases that we shall encounter</i>», ma il caso di un campo esterno variabile — che la tappa 06 ha mostrato essere ammesso dall&rsquo;invarianza di Galilei, con $\mathbf A$ e $W$ dipendenti dal tempo — è precisamente il caso in cui bisogna controllarlo.</p>`}
  ]},
  {t:'reveal', title:'Non il valor medio: tutta la distribuzione', tag:'costruzione', steps:[
   {label:'Il passaggio che quasi nessun corso fa', body:R`
   <p>I generatori delle trasformazioni di simmetria non hanno dipendenza temporale intrinseca, $\partial K/\partial t=0$: sono costruiti dalla geometria dello spazio-tempo, non da un campo esterno che varia. Allora la formula della derivata di un valor medio, scritta in chiusura della tappa 06, si riduce al solo termine con il commutatore, e l&rsquo;invarianza lo annulla:</p>
   $$\frac{d}{dt}\langle K\rangle_t=0.$$
   <p>Qui la maggior parte delle esposizioni si ferma, e dice «la quantità si conserva». Ballentine fa un passo in più, e il passo cambia il contenuto del teorema. Siccome $H$ commuta con $K$, <b>commuta anche con qualunque funzione $f(K)$</b> — stessa osservazione del verso difficile qui sopra, stessa ragione — quindi non solo $\langle K\rangle$ è indipendente dal tempo, ma lo è $\langle f(K)\rangle$ per ogni $f$.</p>
   <p>Ora si scelga una funzione particolare: la funzione a gradino $\theta(x-K)$, che vale $1$ per argomento positivo e $0$ per argomento negativo. Il suo valor medio è</p>
   $$\langle\theta(x-K)\rangle=\mathrm{Prob}(K<x|\rho),$$
   <p>cioè <i>la funzione di distribuzione cumulativa</i> di $K$ nello stato $\rho$. Dunque</p>
   <p><b>la probabilità $\mathrm{Prob}(K<x|\rho)$ è indipendente dal tempo, per ogni $x$ e qualunque sia lo stato iniziale.</b></p>
