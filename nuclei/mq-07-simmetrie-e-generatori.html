   $$\langle\varphi'|\psi'\rangle=(\langle\varphi|U^\dagger)(U|\psi\rangle)=\langle\varphi|\psi\rangle.$$
   <p>Una trasformazione <span class="str" data-str="operatore-unitario">unitaria</span> conserva <i>il valore complesso</i> del prodotto scalare, non soltanto il suo modulo: conserva più di quanto le si fosse chiesto.</p>
   <p><b>Caso (b): $U$ antiunitario.</b> Un operatore antilineare soddisfa per definizione $Uc|\psi\rangle=c^*U|\psi\rangle$: porta fuori i coefficienti complessi coniugandoli. Se è anche antiunitario, allora $\langle\varphi'|\psi'\rangle=\langle\varphi|\psi\rangle^*$ — il prodotto scalare si coniuga, e il suo modulo resta lo stesso. La condizione imposta è soddisfatta anche così, e <b>questo caso non si può scartare per decreto</b>: è una possibilità reale, e nella tappa 08 si vedrà che una simmetria antiunitaria — l&rsquo;inversione temporale — produce una degenerazione che nessuna simmetria unitaria produrrebbe.</p>`},
   {label:'Perché le trasformazioni continue sono lineari: l’argomento della radice quadrata', body:R`
   <p>Il caso antiunitario, però, è incompatibile con la continuità, e l&rsquo;argomento che lo mostra è di una semplicità che vale memorizzare — è tre righe e non usa niente.</p>
   <p>Ballentine lo enuncia così (pag. stampata 64): «<i>Only linear operators can describe continuous transformations because every continuous transformation has a square root</i>». Si supponga che $U(\ell)$ descriva uno spostamento di una distanza $\ell$. Lo stesso spostamento si può ottenere con due spostamenti di $\ell/2$, quindi</p>
   $$U(\ell)=U(\ell/2)\,U(\ell/2).$$
   <p>Ora, <b>il prodotto di due operatori antilineari è lineare</b>: la seconda coniugazione complessa annulla la prima. Quindi, <i>qualunque</i> sia il carattere di $U(\ell/2)$ — lineare o antilineare — il prodotto $U(\ell)$ è lineare. E poiché un operatore continuo non può passare in modo discontinuo da lineare ad antilineare al variare di $\ell$, l&rsquo;operatore deve essere lineare per ogni $\ell$.</p>
   <p>Si guardi la struttura dell&rsquo;argomento, perché è lo schema di quasi tutte le dimostrazioni di questa tappa: <b>si usa la legge di composizione del gruppo per vincolare l&rsquo;oggetto algebrico che lo rappresenta</b>. Qui la legge è «mezzo spostamento più mezzo spostamento fa uno spostamento», e il vincolo che ne segue è la linearità. Nella tappa 03 la stessa legge darà l&rsquo;esponenziale, e nella tappa 05 darà l&rsquo;intera algebra dei commutatori. Gli operatori antilineari restano necessari per certe simmetrie <i>discrete</i>, dove non esiste nessuna radice quadrata da prendere.</p>`},
   {label:'Come si trasformano le osservabili: la derivazione di A → UAU⁻¹', body:R`
   <p>Fissata la trasformazione dei vettori, quella delle osservabili non è libera: deve essere tale che le osservabili trasformate stiano con gli stati trasformati nella stessa relazione in cui le originali stavano con gli originali. La condizione è la prima delle due di Ballentine: se $A|\varphi_n\rangle=a_n|\varphi_n\rangle$ allora $A'|\varphi_n'\rangle=a_n|\varphi_n'\rangle$. Si sostituisce $|\varphi_n'\rangle=U|\varphi_n\rangle$:</p>
   $$A'U|\varphi_n\rangle=a_nU|\varphi_n\rangle\ \Longrightarrow\ U^{-1}A'U|\varphi_n\rangle=a_n|\varphi_n\rangle.$$
   <p>Si sottrae l&rsquo;equazione agli autovalori di partenza, $A|\varphi_n\rangle=a_n|\varphi_n\rangle$, e si ottiene</p>
   $$(A-U^{-1}A'U)|\varphi_n\rangle=0.$$
   <p>Questa vale per ogni elemento dell&rsquo;insieme completo $\{|\varphi_n\rangle\}$, dunque per un vettore arbitrario, dunque l&rsquo;operatore fra parentesi è l&rsquo;operatore nullo. Si conclude</p>
   $$A\to A'=UAU^{-1}.$$
   <p><b>Due osservazioni che si perdono se si prende questa formula come definizione invece che come teorema.</b> La prima: il passaggio decisivo è la <i>completezza</i> della base — senza di essa «vale su ogni $|\varphi_n\rangle$» non implica «vale su ogni vettore», e la formula resterebbe indimostrata. La seconda: la formula dice che osservabili e stati si trasformano in modo <i>opposto</i>, perché $U$ compare una volta a destra e una volta a sinistra con l&rsquo;inversa. È questa opposizione che rende equivalenti il punto di vista attivo e quello passivo, e che nella tappa 07 produrrà la differenza di segno fra l&rsquo;equazione del moto degli stati e quella degli operatori.</p>`}
  ]},
  {t:'reveal', title:'La definizione operativa di Dirac, e il problema della fase in tre voci', tag:'esempio', steps:[
   {label:'Dirac: traslare uno stato vuol dire traslare l’apparato', body:R`
   <p>C&rsquo;è una domanda che il formalismo nasconde: <i>che cosa significa</i>, fisicamente, traslare uno stato? Dirac la affronta per primo, nel §25 dei <i>Principi</i>, e la sua risposta è la più concreta che sia stata data. La traslazione di uno stato o di un&rsquo;osservabile, scrive, è «<i>un processo perfettamente definito dal punto di vista fisico</i>» per una ragione precisa: «<i>per traslare uno stato o un&rsquo;osservabile di un tratto $\delta x$ nella direzione dell&rsquo;asse x, dovremo semplicemente traslare tutto il dispositivo usato per preparare tale stato, (oppure tutto il dispositivo richiesto per misurare tale osservabile) di un tratto $\delta x$ nella stessa direzione, e il dispositivo così traslato definirà lo stato o l&rsquo;osservabile traslati</i>» (pag. stampata 137).</p>
   <p>Questa non è una glossa divulgativa: è la definizione che rende la trasformazione <b>un dato di fatto sperimentale invece di una costruzione matematica</b>. Lo stato traslato esiste perché si sa come prepararlo — si sposta il banco ottico — e tutto quello che la teoria deve fare è dire quale operatore lo rappresenti. Ed è anche la ragione per cui, in questo corso, le simmetrie vengono prima degli operatori e non dopo: l&rsquo;operazione fisica è più primitiva dell&rsquo;oggetto matematico che la descrive.</p>
   <p>Dirac osserva subito dopo che la stessa definizione <i>non</i> funziona in modo indolore sui ket: «<i>La traslazione di un ket non è tuttavia così ben definita</i>» (pag. 137). Se si trasla uno stato si ottiene un nuovo stato perfettamente definito, ma quello determina solo la <b>direzione</b> del ket traslato, non il ket; e nemmeno imporre che la lunghezza sia la stessa basta, «<i>poiché può venire ancora moltiplicato per un arbitrario fattore di fase</i>».</p>`},
   {label:'Che cosa fissa la fase, secondo Dirac', body:R`
   <p>La soluzione di Dirac è la prima apparizione di un argomento che in questo movimento tornerà tre volte. A prima vista si potrebbe pensare che ogni ket traslato porti un fattore di fase arbitrario <i>diverso</i>; ma il fattore deve essere lo stesso per tutti, e lo si dimostra «<i>con l&rsquo;aiuto del seguente argomento</i>»: si usa «<i>la legge secondo la quale le relazioni di sovrapposizione fra stati sono invarianti per traslazione</i>».</p>
   <p>Il ragionamento, per esteso. Una relazione di sovrapposizione fra stati è un&rsquo;equazione lineare fra i ket, per esempio $|R\rangle=c_1|A\rangle+c_2|B\rangle$. Se le relazioni di sovrapposizione sono invarianti, i ket traslati devono soddisfare <i>la stessa</i> equazione con gli stessi coefficienti:</p>
   $$|R_d\rangle=c_1|A_d\rangle+c_2|B_d\rangle.$$
   <p>Se ciascun ket traslato portasse una fase indipendente, i ket così ottenuti soddisferebbero un&rsquo;equazione lineare con coefficienti <i>diversi</i> da $c_1$ e $c_2$ — cioè descriverebbero una sovrapposizione diversa, e la relazione non sarebbe invariante. Resta dunque una sola arbitrarietà: «<i>un unico fattore di fase arbitrario che li moltiplica tutti</i>». E poiché la condizione «i ket traslati sono funzioni lineari di quelli non traslati» è esattamente la definizione di operatore lineare, ciascun ket traslato è il risultato dell&rsquo;applicazione di un operatore lineare $D$,</p>
   $$|P_d\rangle=D|P\rangle,$$
   <p>con $D$ indeterminato «<i>per un fattore numerico arbitrario di modulo uno</i>». <b>Dirac ottiene così, nel 1930 e senza nominare Wigner, metà del teorema della sezione precedente</b>: la linearità dedotta dall&rsquo;invarianza delle sovrapposizioni.</p>`},
   {label:'Lo stesso problema in Ballentine e in Shankar, e perché i tre non si contraddicono', body:R`
   <p>Il problema della fase riemerge due volte, in forme che sembrano diverse e sono la stessa.</p>
   <p><b>Ballentine lo trova nella legge di composizione.</b> Se $\tau_2\tau_1$ e $\tau_3$ sono la stessa trasformazione dello spazio-tempo, si deve richiedere che $U(\tau_2)U(\tau_1)|\Psi\rangle$ e $U(\tau_3)|\Psi\rangle$ descrivano lo stesso stato — ma «<i>this does not mean that they must be the same vector</i>», perché due vettori che differiscono per una fase sono fisicamente equivalenti. Quindi la legge di composizione degli operatori unitari non è quella del gruppo, ma</p>
   $$U(\tau_2\tau_1)=e^{i\omega(\tau_2,\tau_1)}\,U(\tau_2)U(\tau_1)$$
   <p>con $\omega$ reale (pag. stampata 67). E c&rsquo;è un punto fine, che Ballentine chiude in una riga: si potrebbe pensare che la fase $\omega$ dipenda anche da $|\Psi\rangle$, «<i>but in that case U would not be a linear operator</i>» — e il teorema di Wigner dice che per una trasformazione continua $U$ è lineare. La fase può dipendere dalle due trasformazioni, non dallo stato. <b>Questa $\omega$ non è un residuo da ignorare: nella tappa 05 produrrà i termini $(?)I$ nei commutatori, e uno di essi non si potrà eliminare — sarà la massa.</b></p>
   <p><b>Shankar lo trova nella scelta dell&rsquo;azione su $|x\rangle$.</b> Costruendo l&rsquo;operatore di traslazione sembra ovvio porre $T(\varepsilon)|x\rangle=|x+\varepsilon\rangle$: se la particella era in $x$, deve finire in $x+\varepsilon$. Shankar mostra che quella scelta «<i>was too restrictive</i>» (pag. stampata 283): la forma generale compatibile con l&rsquo;intuizione porta un fattore di fase dipendente dalla posizione, $T(\varepsilon)|x\rangle=e^{ig(x)}|x+\varepsilon\rangle$, e con quella forma generale il valor medio dell&rsquo;impulso <i>non</i> resta invariato. È la richiesta $\langle P\rangle\to\langle P\rangle$ che elimina $g$ riducendola a una costante innocua, scegliibile nulla. Il suo commento è esatto: la scelta ingenua non era sbagliata, era insufficientemente giustificata — e «<i>this situation reappears when we go to two or three dimensions and when we consider rotations</i>».</p>
   <p>Le tre voci dicono dunque la stessa cosa in tre ordini diversi, e la differenza non è di sostanza ma di <i>cosa si assume e cosa si deduce</i>: Dirac assume l&rsquo;invarianza delle sovrapposizioni e deduce che la fase è unica; Ballentine assume la linearità (via Wigner) e deduce che la fase non dipende dallo stato; Shankar assume l&rsquo;invarianza del valor medio dell&rsquo;impulso e deduce che la fase è costante. Tre vincoli diversi, lo stesso residuo.</p>`},
   {label:'Attivo e passivo: due letture, e l’avvertenza che tutti e tre ripetono', body:R`
   <p>Resta da fissare una convenzione, e qui la pedanteria è ripagata perché è il punto in cui si sbaglia segno.</p>
   <p>Nel <b>punto di vista attivo</b> si trasforma l&rsquo;oggetto rispetto a un sistema di coordinate fisso: lo stato diventa $|\psi'\rangle=U|\psi\rangle$ e corrisponde a spostare fisicamente la particella verso destra di $\varepsilon$. Nel <b>punto di vista passivo</b> non succede niente agli stati, e sono gli operatori a cambiare: $X\to T^\dagger XT$, che fisicamente corrisponde a spostare l&rsquo;ambiente — il sistema di coordinate, le sorgenti dei campi esterni — verso sinistra della stessa quantità. Shankar dimostra l&rsquo;equivalenza delle due letture in tre passi (pag. stampata 281): si prende il valor medio dell&rsquo;equazione fra operatori, si osserva che gli operatori coinvolti sono hermitiani e che $|\psi\rangle$ è arbitrario, quindi si può scegliere come autovettore, quindi tutti gli autovalori si annullano, quindi l&rsquo;operatore si annulla.</p>
   <p>Ballentine aggiunge l&rsquo;avvertenza, e la mette fra parentesi con un punto esclamativo: i due punti di vista sono equivalenti e la scelta è di gusto, «<i>the only danger, which must be carefully avoided, is to inadvertently switch from one point of view to the other in the same analysis!</i>» (pag. stampata 68). Sakurai dice la stessa cosa in forma più secca a proposito della traslazione: «<i>In this book we try not to use this approach. Obviously it is important that we do not mix the two approaches!</i>» (pag. stampata 43). <b>Qui si adotta il punto di vista attivo</b>, come Ballentine, e dove si userà l&rsquo;altro lo si dirà.</p>
   <p>C&rsquo;è una conseguenza di questa scelta che va registrata adesso perché è controintuitiva. Quando il vettore astratto $|\Psi\rangle$ si rappresenta come funzione delle coordinate, <b>la trasformazione sulla funzione è l&rsquo;inversa di quella sulle coordinate</b>. Ballentine lo deriva così: la nuova funzione vale nel punto trasformato quanto la vecchia valeva nel punto di partenza, $\Psi'(\tau x)=\Psi(x)$; ponendo $\tau x=x'$ si ha $\Psi'(x')=\Psi(\tau^{-1}x')$, e quindi</p>
   $$U(\tau)\,\Psi(x)=\Psi(\tau^{-1}x).$$
   <p>È il motivo per cui l&rsquo;operatore che <i>sposta avanti</i> una funzione d&rsquo;onda la valuta <i>indietro</i>, e la tappa 04 lo ritroverà nella forma di Picasso $U(a)\psi(x)=\psi(x-a)$: niente paradosso, è la stessa riga letta due volte.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Se le trasformazioni di simmetria continue sono unitarie, e l&rsquo;unitarietà conserva il prodotto scalare completo, perché il teorema di Wigner si enuncia chiedendo solo la conservazione del modulo?`,
    a:R`Perché chiedere di meno è ciò che rende il teorema un teorema. Se si assumesse la conservazione del valore complesso di $\langle\varphi|\psi\rangle$, l&rsquo;unitarietà sarebbe praticamente l&rsquo;ipotesi e non ci sarebbe niente da dimostrare — e, peggio, si escluderebbe per ipotesi una classe di trasformazioni che in natura esiste. Il teorema parte dal minimo che la fisica garantisce — le probabilità, cioè i moduli quadri — e conclude che le possibilità sono <i>soltanto due</i>. Il guadagno è doppio: nel caso continuo si ottiene gratuitamente la conservazione della fase relativa, che non era stata chiesta; nel caso discreto si scopre un ramo in più, quello antiunitario, che è esattamente dove vive l&rsquo;inversione temporale. Un&rsquo;ipotesi più forte avrebbe cancellato il ramo invece di trovarlo.`},
   {q:R`L&rsquo;argomento della radice quadrata usa il fatto che ogni traslazione di $\ell$ si scompone in due di $\ell/2$. L&rsquo;inversione spaziale non si scompone in due «mezze inversioni»?`,
    a:R`No, e capire perché è capire la differenza fra una simmetria continua e una discreta. Una «mezza inversione» dovrebbe essere un&rsquo;operazione $S$ con $S^2=\Pi$, cioè una trasformazione che applicata due volte manda $\mathbf r$ in $-\mathbf r$. Nello spazio tridimensionale una rotazione di $\pi$ attorno a un asse non è l&rsquo;inversione (lascia fisso l&rsquo;asse), e in generale l&rsquo;inversione ha determinante $-1$ mentre il quadrato di qualunque trasformazione lineare reale ha determinante positivo: nessuna radice quadrata reale esiste nel gruppo. Questo è il punto: il gruppo delle inversioni ha due soli elementi, $\{I,\Pi\}$, e fra loro non c&rsquo;è niente — non esiste un cammino continuo di trasformazioni che porti dall&rsquo;identità all&rsquo;inversione restando dentro il gruppo. Senza cammino non c&rsquo;è parametro, senza parametro non c&rsquo;è derivata, senza derivata non c&rsquo;è generatore. L&rsquo;operatore di parità esiste e si costruisce (tappa 09), ma non è l&rsquo;esponenziale di niente, e per questo la grandezza che conserva non è un numero reale qualunque ma solo un segno.`},
   {q:R`Se la fase $\omega$ nella legge di composizione è «fisicamente irrilevante», perché Ballentine la porta avanti per otto pagine invece di porla a zero?`,
    a:R`Perché «irrilevante» descrive il singolo vettore, non l&rsquo;algebra. Una fase globale su un vettore non ha significato fisico, questo è vero e non è in discussione; ma la fase <i>relativa</i> fra i due modi di comporre due trasformazioni è una proprietà del gruppo di simmetria, e di quella non si può disporre a piacere. L&rsquo;effetto si vede nei commutatori: la legge con la fase impone che $[K_\mu,K_\nu]$ sia una combinazione lineare dei generatori <b>più un multiplo dell&rsquo;identità</b>, e quel multiplo è diverso da zero proprio perché $\omega$ non è nulla. Nella tappa 05 i multipli dell&rsquo;identità si dividono in tre tipi: alcuni si determinano con l&rsquo;identità di Jacobi, altri si cancellano ridefinendo le fasi di certi vettori, e uno — quello in $[G_\alpha,P_\beta]$ — <i>non si cancella in nessun modo</i>. Quel residuo è la massa della particella. Porre $\omega=0$ all&rsquo;inizio avrebbe fatto sparire la massa dalla teoria, che è il modo più caro possibile di risparmiare una riga.`}
  ]}
]},

/* ---------------- 03 · IL GENERATORE ---------------- */
{ num:'03', title:'Il generatore: da una trasformazione infinitesima a una finita', meta:'una famiglia a un parametro · l’hermiticità dedotta dall’unitarietà · l’equazione differenziale che dà l’esponenziale · il teorema di Stone e il dominio',
  blocchi:[
  {t:'prosa', title:'L’ipotesi minima: una famiglia a un parametro', tag:'costruzione', html:R`
  <p>Si consideri una famiglia di operatori unitari $U(s)$ che dipendono da un solo parametro continuo $s$, con due proprietà:</p>
  $$U(0)=I,\qquad U(s_1+s_2)=U(s_1)\,U(s_2).$$
  <p>La prima dice che a parametro nullo non succede niente; la seconda che comporre due trasformazioni della famiglia dà una trasformazione della stessa famiglia, con il parametro sommato. Ballentine annota una cosa che vale sapere per non preoccuparsene: si può sempre scegliere il parametro di un gruppo di operatori a un parametro in modo che queste relazioni siano soddisfatte, «<i>but the proof is not needed here because the operations that we shall treat (displacements, rotations about an axis, Galilei transformations to a moving frame of reference) obviously satisfy them</i>» (pag. stampata 65).</p>
  <p>Due osservazioni prima di procedere. La prima: la legge di composizione è scritta <i>senza</i> il fattore di fase della tappa 02, e questo è legittimo per una famiglia a un parametro — la fase si può riassorbire ridefinendo $U(s)\to e^{i\lambda s}U(s)$, che equivale a traslare il generatore di un multiplo dell&rsquo;identità. Il prezzo si paga quando si mettono insieme <i>più</i> famiglie, e quello è il contenuto della tappa 05. La seconda: l&rsquo;operatore $U(s)$ è unitario per ogni $s$, non solo per $s$ piccolo; quello che si farà nel seguito è estrarre dall&rsquo;informazione su $s$ infinitesimo l&rsquo;informazione su tutti gli $s$. <b>Che questo sia possibile è il risultato della tappa, e non è ovvio: significa che una trasformazione finita non contiene più informazione della sua versione infinitesima.</b></p>`},
  {t:'reveal', title:'Il generatore è autoaggiunto, e lo dice l’unitarietà', tag:'costruzione', steps:[
   {label:'L’espansione al primo ordine', body:R`
   <p>Se si lascia che $s$ diventi molto piccolo, la trasformazione unitaria risultante si scrive come</p>
   $$U(s)=I+\frac{dU}{ds}\Big|_{s=0}s+O(s^2).$$
   <p>La condizione di unitarietà $UU^\dagger=I$ deve valere per <i>ogni</i> valore di $s$, quindi i coefficienti di ogni potenza di $s$ devono tornare separatamente. Al primo ordine</p>
   $$UU^\dagger=I+s\Big(\frac{dU}{ds}+\frac{dU^\dagger}{ds}\Big)\Big|_{s=0}+O(s^2),$$
   <p>e perché questo sia uguale a $I$ indipendentemente da $s$, il coefficiente di $s$ deve annullarsi: la derivata di $U$ e quella di $U^\dagger$ in zero sono l&rsquo;una l&rsquo;opposta dell&rsquo;altra, cioè la derivata è <i>anti-autoaggiunta</i>. Un operatore anti-autoaggiunto si scrive sempre come $i$ volte un operatore <span class="str" data-str="operatore-aggiunto">autoaggiunto</span>, e si pone per definizione</p>
   $$\frac{dU}{ds}\Big|_{s=0}=iK,\qquad K=K^\dagger.$$
   <p>L&rsquo;operatore autoaggiunto $K$ si chiama <b>generatore</b> della famiglia. Il fattore $i$ non è una decorazione: è ciò che converte l&rsquo;anti-autoaggiunzione in autoaggiunzione, ed è la ragione per cui in meccanica quantistica le quantità conservate — che devono essere osservabili, quindi autoaggiunte — compaiono sempre dentro un esponenziale immaginario.</p>`},
   {label:'Il conto, fatto con un generatore concreto', body:R`
   <p>Vale la pena vedere la cancellazione del primo ordine su un caso in cui si può moltiplicare tutto per esteso. Si prenda $K$ reale (un numero, o un operatore che commuta con se stesso, che è lo stesso ai fini di questo conto) e si moltiplichi la trasformazione infinitesima per la sua aggiunta:</p>
   $$(1+i\varepsilon K)(1-i\varepsilon K)=1+\varepsilon^{2}K^{2}.$$
   <p>I due termini di ordine $\varepsilon$ — uno con $+i$ e uno con $-i$ — si cancellano esattamente, e resta un errore di ordine $\varepsilon^2$: la trasformazione è unitaria <i>fino al primo ordine</i>, che è tutto ciò che si richiede a una trasformazione infinitesima. Sakurai fa lo stesso conto per l&rsquo;operatore di traslazione (pag. stampata 44) e lo commenta nel modo giusto: «<i>terms of second order in dx' have been ignored for an infinitesimal translation</i>».</p>
   <p>Si noti che la cancellazione <b>richiede $K=K^\dagger$</b>: se $K$ non fosse autoaggiunto, il coefficiente di $\varepsilon$ sarebbe $i(K-K^\dagger)$, diverso da zero, e la norma dello stato cambierebbe al primo ordine — cioè la probabilità totale non sarebbe conservata. L&rsquo;autoaggiunzione del generatore e la conservazione della probabilità sono la stessa condizione.</p>`}
  ]},
  {t:'reveal', title:'Dall’infinitesimo al finito: l’equazione differenziale', tag:'costruzione', steps:[
   {label:'Derivare la legge di composizione', body:R`
   <p>Ecco il passaggio che fa il lavoro, ed è un passaggio di una riga che si riesce a riprodurre a memoria solo se si è capito perché funziona. Si parte dalla legge di composizione e si <span class="str" data-str="derivazione">deriva</span> rispetto a $s_2$, valutando poi in $s_2=0$:</p>
   $$\frac{\partial}{\partial s_2}U(s_1+s_2)\Big|_{s_2=0}=U(s_1)\frac{d}{ds_2}U(s_2)\Big|_{s_2=0}.$$
   <p>A sinistra, derivare rispetto a $s_2$ una funzione della sola somma $s_1+s_2$ e porre $s_2=0$ dà la derivata della funzione calcolata in $s_1$. A destra, il fattore $U(s_1)$ è una costante rispetto a $s_2$ e la derivata dell&rsquo;altro fattore in zero è $iK$ per definizione. Quindi</p>
   $$\frac{dU(s)}{ds}\Big|_{s=s_1}=U(s_1)\,iK.$$
   <p>Poiché $s_1$ è arbitrario, questa è un&rsquo;<b>equazione differenziale del primo ordine per tutta la famiglia</b>, con la condizione iniziale $U(0)=I$. La soluzione è unica, e si verifica per sostituzione:</p>
   $$U(s)=e^{iKs}.$$
   <p>Il controllo è immediato — derivando l&rsquo;esponenziale rispetto al parametro si ritrova se stesso moltiplicato per il generatore,</p>
   $$\frac{d}{ds}e^{iKs}=iK\,e^{iKs}=iK\,U(s)$$
   <p>— e la legge di composizione è soddisfatta perché gli esponenti si sommano:</p>
   $$e^{iKs_1}e^{iKs_2}=e^{iK(s_1+s_2)}.$$
   <p>Questo secondo controllo non è pleonastico: è lecito sommare gli esponenti <i>perché</i> l&rsquo;esponente contiene lo stesso operatore $K$ in entrambi i fattori, e un operatore commuta con se stesso. Per due generatori diversi la stessa manipolazione è falsa, ed è esattamente da quella falsità che nascerà l&rsquo;algebra della tappa 05.</p>`},
   {label:'Che cosa si è guadagnato, detto con precisione', body:R`
   <p>La frase di Ballentine è: «<i>Thus the operator for any finite transformation is determined by the generator of infinitesimal transformations</i>» (pag. stampata 66). Vale leggerla come un&rsquo;affermazione di economia informativa. Una trasformazione finita — ruotare di sessanta gradi, traslare di un metro — è, come operatore sullo spazio di Hilbert, un oggetto complicato: agisce su infinite dimensioni e non si scrive in forma chiusa in generale. <b>Ma non contiene nessuna informazione che non sia già nel suo generatore</b>, che è un singolo operatore autoaggiunto, cioè un&rsquo;osservabile.</p>
   <p>Da qui in avanti il programma del movimento è determinato: per conoscere tutte le simmetrie continue di un sistema basta conoscere i loro generatori, e per conoscere i generatori basta conoscere la loro algebra. La tappa 04 trova il generatore delle traslazioni, la 05 l&rsquo;algebra di tutti e dieci i generatori dello spazio-tempo galileiano, la 06 ne deduce le variabili dinamiche. <i>Non si costruirà mai più un operatore unitario finito</i>, tranne che per gli esempi.</p>`},
   {label:'Il teorema di Stone, e il dominio che non si vede', body:R`
   <p>Il passaggio dall&rsquo;infinitesimo al finito, scritto come sopra, è un conto formale: si deriva un operatore come se fosse un numero. In dimensione infinita questo richiede attenzione, e il teorema che la fornisce si chiama <b>teorema di Stone</b>. Picasso lo invoca esattamente dove serve, costruendo l&rsquo;operatore di evoluzione temporale: se la famiglia soddisfa $U(t_1)U(t_2)=U(t_1+t_2)$, «<i>si può dimostrare (teorema di Stone)</i>» che $U(t)=e^{iKt}$ con $K$ autoaggiunto (pag. stampata 150). L&rsquo;enunciato preciso è una corrispondenza biunivoca: i gruppi unitari a un parametro <i>fortemente continui</i> sono in bigezione con gli operatori autoaggiunti, e l&rsquo;autoaggiunzione qui include la specificazione del dominio.</p>
   <p>Perché il dominio conti, lo si vede con l&rsquo;esempio che Picasso mette in nota a pag. stampata 109. L&rsquo;operatore di traslazione in rappresentazione di Schrödinger agisce come $e^{-a\,d/dx}$, e per scrivere quella serie esponenziale servono <i>tutte</i> le derivate della funzione d&rsquo;onda: l&rsquo;identità $U(a)\psi(x)=\psi(x-a)$ si dimostra prima «<i>per ogni funzione intera (cioè una funzione la cui serie di Taylor converge per ogni $a$)</i>», e solo dopo si estende. L&rsquo;estensione funziona per un motivo che vale registrare: quelle funzioni «<i>costituiscono un insieme denso in $L_2$</i>» e l&rsquo;operatore conserva la norma, $\|U(a)\psi_A(x)\|=\|\psi_A(x)\|$, quindi l&rsquo;identità «<i>si estende per continuità senza problemi</i>» a ogni elemento di $L_2$.</p>
   <p><b>Lo schema di questo argomento è generale e vale la pena averlo in testa</b>: si dimostra un&rsquo;identità su un insieme denso dove i conti si possono fare, si osserva che l&rsquo;operatore è limitato (qui: isometrico), e la continuità fa il resto. È il motivo per cui in questo movimento si può derivare senza remore pur trattando operatori illimitati come $\hat P$: gli oggetti che si esponenziano sono unitari, e gli unitari sono limitati. Lo spazio denso su cui i conti sono lecitissimi è lo spazio di Schwartz $\mathcal S$ — le funzioni infinitamente derivabili che si annullano all&rsquo;infinito più rapidamente di ogni polinomio — e Picasso osserva che su di esso «<i>tutti i polinomi $P(x_j,-i\hbar\,\partial/\partial x_j)$ sono ben definiti come operatori</i>», il che copre ogni generatore che comparirà nel seguito.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Il generatore è definito come la derivata di $U(s)$ in zero. Ma $U(s)$ dipende dalla convenzione di fase: se si sostituisce $U(s)$ con $e^{i\lambda s}U(s)$, la famiglia è ancora unitaria e soddisfa ancora la legge di composizione. Che cosa succede al generatore?`,
    a:R`Si sposta di un multiplo dell&rsquo;identità: $K\to K+\lambda I$. Lo si vede derivando in zero il prodotto, perché la derivata di $e^{i\lambda s}$ in zero è $i\lambda$. La conseguenza è duplice e va tenuta in mente per la tappa 05. Da un lato è una <b>libertà reale</b>: significa che il valore numerico di un generatore non ha, da solo, significato fisico assoluto — e infatti è questa libertà che si consuma per far sparire alcuni dei multipli dell&rsquo;identità nei commutatori. Dall&rsquo;altro lato la libertà è <b>finita</b>: ogni generatore ne ha una copia, e una volta usata per aggiustare un commutatore non è più disponibile per un altro. Ballentine lo nota esattamente quando arriva alla massa: la possibilità di aggiungere multipli dell&rsquo;identità «<i>is, in any case, no longer available to us, since we have already used up such freedom for all generators except H</i>». Il conteggio di questa libertà è ciò che rende la massa irremovibile, e non una svista.`},
   {q:R`Se $U(s)=e^{iKs}$ per ogni $s$, perché la tappa 04 si prende la briga di derivare l&rsquo;operatore di traslazione finita come limite di $N$ traslazioni di $a/N$, come fa Shankar?`,
    a:R`Perché le due derivazioni assumono cose diverse, e tenerle entrambe serve. L&rsquo;argomento di questa tappa assume la legge di composizione come ipotesi e ne deduce l&rsquo;esponenziale risolvendo un&rsquo;equazione differenziale: è il più potente, perché non usa nessuna proprietà particolare della traslazione. L&rsquo;argomento di Shankar costruisce la traslazione finita come $T(a)=\lim_{N\to\infty}[T(a/N)]^N$ e riconosce nel limite la definizione analitica dell&rsquo;esponenziale: è il più <i>concreto</i>, perché mostra che la legge di composizione non è un&rsquo;ipotesi aggiuntiva ma un fatto geometrico — «<i>a translation by a followed by a translation by b equals a translation by a + b</i>», che «<i>has nothing to do with quantum mechanics and is true whether you are talking about a quantum system or a sack of potatoes</i>». La verifica che $T(a)T(b)=T(a+b)$, che Shankar fa alla fine pur avendola presupposta, è un controllo di coerenza fra la legge di composizione degli <i>operatori</i> e quella delle <i>trasformazioni</i> che essi rappresentano — e quando questo controllo fallisce (tappa 05, rotazioni e traslazioni insieme) non è la fine del mondo: è la scoperta dei commutatori.`},
   {q:R`Il teorema di Stone richiede la continuità forte. Esiste una famiglia unitaria a un parametro che soddisfa la legge di composizione e non ha generatore?`,
    a:R`Sì, e sono esempi patologici che si costruiscono solo rinunciando alla continuità. Il contenuto fisico della richiesta è questo: $U(s)|\psi\rangle$ deve tendere a $|\psi\rangle$ in norma quando $s\to0$, cioè una trasformazione piccola deve produrre uno stato vicino. Senza quella richiesta si possono esibire famiglie di operatori unitari con la legge di composizione giusta e nessun comportamento derivabile, e per esse non esiste un operatore autoaggiunto $K$. La ragione per cui il caso non ci interessa è fisica e non matematica: le trasformazioni che questo movimento tratta sono spostamenti, rotazioni e cambi di riferimento, cioè operazioni che si eseguono gradualmente, e per esse la continuità non è un&rsquo;ipotesi tecnica ma la descrizione di che cosa si fa in laboratorio. La patologia, al contrario, è quello che serve per le simmetrie discrete: lì non c&rsquo;è nessun parametro da far tendere a zero, e l&rsquo;operatore esiste senza essere l&rsquo;esponenziale di niente.`}
  ]}
]},

/* ---------------- 04 · L'IMPULSO COME GENERATORE DELLE TRASLAZIONI ---------------- */
{ num:'04', title:'L’impulso come generatore delle traslazioni, e il commutatore canonico come conseguenza', meta:'tre derivazioni indipendenti · Sakurai assiomatico, Shankar attivo, Dirac originale · la traslazione finita è una serie di Taylor · il commutatore canonico dimostrato, non postulato',
  blocchi:[
  {t:'prosa', title:'La domanda, e perché si risponde tre volte', tag:'costruzione', html:R`
  <p>La tappa 03 ha stabilito che una famiglia di trasformazioni continue è determinata da un generatore autoaggiunto. Resta la domanda che decide se tutto questo sia fisica o algebra: <b>chi è il generatore delle traslazioni spaziali?</b></p>
  <p>La risposta è l&rsquo;impulso, e qui la si ottiene tre volte, da tre punti di partenza diversi. Non è ridondanza: i tre argomenti assumono cose diverse, e la differenza fra ciò che assumono è il contenuto. <b>Sakurai</b> parte da quattro proprietà <i>richieste</i> all&rsquo;operatore di traslazione e trova il commutatore fra il generatore e la posizione, senza mai dire chi sia il generatore: l&rsquo;identificazione con l&rsquo;impulso gli arriva da fuori. <b>Shankar</b> parte dall&rsquo;azione sulle funzioni d&rsquo;onda, $\psi(x)\to\psi(x-\varepsilon)$, e trova la forma differenziale esplicita del generatore. <b>Dirac</b> parte dalla definizione operativa della traslazione e dalle condizioni quantiche già note per $p_x$, e dimostra che l&rsquo;operatore di traslazione <i>soddisfa le stesse condizioni</i>, quindi coincide con l&rsquo;impulso a meno di una costante che si può porre a zero.</p>
  <p>Alla fine della tappa si ottiene qualcosa in più delle tre risposte: <b>il commutatore canonico $[\hat q,\hat p]=i\hbar$ smette di essere un postulato</b>. Nella versione di Ballentine (§3.4) esce da un fatto puramente geometrico — se si sposta l&rsquo;origine, la posizione misurata cambia e l&rsquo;impulso no — e questo è il motivo per cui questo corso mette le simmetrie prima di tutto il resto. Il commutatore canonico non è l&rsquo;assioma da cui parte la meccanica quantistica: è il modo in cui la meccanica quantistica registra la struttura dello spazio.</p>`},
  {t:'reveal', title:'Prima strada: le quattro proprietà di Sakurai', tag:'costruzione', steps:[
   {label:'Che cosa si richiede, e perché quelle quattro cose', body:R`
   <p>Si parta dall&rsquo;azione sui ket di posizione. L&rsquo;operatore di traslazione infinitesima $\mathcal T(d\mathbf x')$ è definito dalla richiesta</p>
   $$\mathcal T(d\mathbf x')|\mathbf x'\rangle=|\mathbf x'+d\mathbf x'\rangle,$$
   <p>«<i>where a possible arbitrary phase factor is set to unity by convention</i>» — ed è la fase di cui la tappa 02 ha discusso la natura. Sakurai osserva immediatamente il fatto che più conta per non confondersi: «<i>Obviously $|\mathbf x'\rangle$ is not an eigenket of the infinitesimal translation operator</i>» (pag. stampata 43). Un autostato della posizione non è un autostato della traslazione, e la ragione è ovvia a dirsi: la traslazione lo manda in un <i>altro</i> ket, non in un multiplo di sé.</p>
   <p>L&rsquo;effetto su uno stato arbitrario si ottiene sviluppando sulla base delle posizioni e ribattezzando la variabile d&rsquo;integrazione:</p>
   $$\mathcal T(d\mathbf x')|\alpha\rangle=\int d^3x'\,|\mathbf x'+d\mathbf x'\rangle\langle \mathbf x'|\alpha\rangle=\int d^3x'\,|\mathbf x'\rangle\langle \mathbf x'-d\mathbf x'|\alpha\rangle,$$
   <p>«<i>because the integration is over all space and $\mathbf x'$ is just an integration variable</i>». Dunque la funzione d&rsquo;onda dello stato traslato si ottiene sostituendo $\mathbf x'-d\mathbf x'$ al posto di $\mathbf x'$ — ed è la relazione inversa già incontrata nella tappa 02, qui ottenuta con un cambio di nome sotto il segno di integrale.</p>
   <p>Le quattro proprietà che si richiedono, una per una e con il motivo di ciascuna, sono: <b>(i) unitarietà</b>, $\mathcal T^\dagger\mathcal T=I$, imposta dalla conservazione della probabilità — se $|\alpha\rangle$ è normalizzato lo deve essere anche il traslato; <b>(ii) composizione</b>, $\mathcal T(d\mathbf x'')\mathcal T(d\mathbf x')=\mathcal T(d\mathbf x'+d\mathbf x'')$, perché due traslazioni successive sono una traslazione con il vettore somma; <b>(iii) inversione</b>, $\mathcal T(-d\mathbf x')=\mathcal T^{-1}(d\mathbf x')$, perché traslare nel verso opposto disfa la traslazione; <b>(iv) limite</b>, $\mathcal T\to I$ per $d\mathbf x'\to0$, con la differenza da $I$ del primo ordine in $d\mathbf x'$.</p>`},
   {label:'La forma che le soddisfa tutte, e il commutatore che ne esce', body:R`
   <p>Sakurai dimostra che tutte e quattro sono soddisfatte dalla forma</p>
   $$\mathcal T(d\mathbf x')=1-i\mathbf K\cdot d\mathbf x',$$
   <p>con le componenti di $\mathbf K$ operatori hermitiani. La verifica di (i) è la cancellazione del primo ordine già vista nella tappa 03; la (ii) si verifica moltiplicando due fattori e trascurando il secondo ordine; la (iii) e la (iv) sono immediate.</p>
   <p>Ora il passaggio che produce il risultato, e vale seguirlo riga per riga perché è il modello di una classe intera di argomenti. Si applica l&rsquo;operatore posizione al ket traslato, in due ordini diversi:</p>
   $$\hat{\mathbf x}\,\mathcal T(d\mathbf x')|\mathbf x'\rangle=\hat{\mathbf x}|\mathbf x'+d\mathbf x'\rangle=(\mathbf x'+d\mathbf x')|\mathbf x'+d\mathbf x'\rangle,$$
   $$\mathcal T(d\mathbf x')\,\hat{\mathbf x}|\mathbf x'\rangle=\mathbf x'\,\mathcal T(d\mathbf x')|\mathbf x'\rangle=\mathbf x'|\mathbf x'+d\mathbf x'\rangle.$$
   <p>Sottraendo, il commutatore agisce come</p>
   $$[\hat{\mathbf x},\mathcal T(d\mathbf x')]\,|\mathbf x'\rangle=d\mathbf x'\,|\mathbf x'+d\mathbf x'\rangle\simeq d\mathbf x'\,|\mathbf x'\rangle,$$
   <p>dove l&rsquo;errore commesso nell&rsquo;ultimo passaggio «<i>is of second order in $d\mathbf x'$</i>»: sostituire $|\mathbf x'+d\mathbf x'\rangle$ con $|\mathbf x'\rangle$ in un termine che è già del primo ordine. Poiché $|\mathbf x'\rangle$ è un ket di posizione qualunque e quei ket formano un insieme completo, si ha un&rsquo;identità fra operatori:</p>
   $$[\hat{\mathbf x},\mathcal T(d\mathbf x')]=d\mathbf x'.$$
   <p>Sostituendo la forma esplicita, $-i\hat{\mathbf x}\,\mathbf K\cdot d\mathbf x'+i\mathbf K\cdot d\mathbf x'\,\hat{\mathbf x}=d\mathbf x'$, e poiché $d\mathbf x'$ è arbitrario in direzione e modulo si conclude, componente per componente,</p>
   $$[\hat x_i,\hat K_j]=i\,\delta_{ij}.$$
   <p><b>Che cosa si è ottenuto e che cosa no.</b> Si è ottenuta la relazione di commutazione fra la posizione e il generatore, senza aver mai detto chi sia il generatore. $\mathbf K$ ha le dimensioni di un inverso di lunghezza, come si vede dalla forma di $\mathcal T$, quindi non <i>può</i> essere l&rsquo;impulso: può essere l&rsquo;impulso diviso per una costante con le dimensioni di un&rsquo;azione. Questa è la posizione esatta in cui $\hbar$ deve entrare nella teoria, e la tappa 06 mostrerà che la costante non si può dedurre dalle simmetrie — va misurata.</p>`}
  ]},
  {t:'reveal', title:'Seconda strada: l’azione sulle funzioni d’onda', tag:'costruzione', steps:[
   {label:'Sviluppare i due membri al primo ordine', body:R`
   <p>Shankar prende la strada più diretta. Si parte da ciò che la traslazione fa alla funzione d&rsquo;onda: se $\psi_\varepsilon$ è la funzione d&rsquo;onda dello stato traslato di $\varepsilon$ verso destra, allora</p>
   $$\psi_\varepsilon(x)=\psi(x-\varepsilon),$$
   <p>«<i>the wave function $\psi_\varepsilon(x)$ is obtained by translating (without distortion) the wave function $\psi(x)$ by an amount $\varepsilon$ to the right</i>» (pag. stampata 282). L&rsquo;esempio che Shankar dà è il più chiaro possibile: se $\psi$ è una gaussiana centrata nell&rsquo;origine, $\psi(x-\varepsilon)$ è una gaussiana identica centrata in $x=\varepsilon$.</p>
   <p>Si scriva l&rsquo;operatore nella forma della tappa 03, con la costante scelta in anticipo per far tornare le dimensioni:</p>
   $$T(\varepsilon)=I-\frac{i\varepsilon}{\hbar}\hat G+O(\varepsilon^2),$$
   <p>e si sviluppino al primo ordine in $\varepsilon$ i due membri dell&rsquo;uguaglianza $T(\varepsilon)\psi(x)=\psi(x-\varepsilon)$. A sinistra</p>
   $$\psi(x)-\frac{i\varepsilon}{\hbar}\hat G\psi(x);$$
   <p>a destra, lo sviluppo di Taylor</p>
   $$\psi(x-\varepsilon)=\psi(x)-\varepsilon\frac{d\psi}{dx}+O(\varepsilon^2).$$
   <p>Uguagliando i coefficienti di $\varepsilon$ si ottiene $-\tfrac{i}{\hbar}\hat G\psi=-\psi'$, cioè</p>
   $$\hat G\psi(x)=-i\hbar\frac{d\psi}{dx}.$$
   <p>Il generatore delle traslazioni è l&rsquo;operatore differenziale $-i\hbar\,d/dx$, che è <b>l&rsquo;operatore impulso in rappresentazione di Schrödinger</b>. Shankar lo commenta nel modo giusto: «<i>We see that exactly as in classical mechanics, the momentum is the generator of (infinitesimal) translations</i>». L&rsquo;hermiticità di $\hat G$, che la tappa 03 richiedeva, qui è un fatto da verificare e si verifica integrando per parti: il termine di bordo si annulla sulle funzioni che vanno a zero all&rsquo;infinito, e resta il segno che l&rsquo;unità immaginaria compensa.</p>`},
   {label:'La conservazione dell’impulso, dedotta in quattro righe', body:R`
   <p>Avendo il generatore, la legge di conservazione segue subito, e Shankar la ottiene prima di aver costruito l&rsquo;operatore finito. L&rsquo;invarianza per traslazioni si definisce come</p>
   $$T^\dagger(\varepsilon)\,H\,T(\varepsilon)=H,$$
   <p>cioè: l&rsquo;hamiltoniana vista dal sistema traslato è la stessa. Si sostituisce $T=I-i\varepsilon \hat P/\hbar$, si sviluppa, e il termine di ordine $\varepsilon$ dà</p>
   $$\langle\psi|[\hat P,H]|\psi\rangle=0$$
   <p>per ogni stato, dunque $[\hat P,H]=0$ come operatori. La conclusione è che il valor medio dell&rsquo;impulso non cambia nel tempo, e il passaggio da $[\hat P,H]=0$ a $\tfrac{d}{dt}\langle \hat P\rangle=0$ è il contenuto del teorema di Ehrenfest, che si enuncia così e basta: la derivata temporale del valor medio di un&rsquo;osservabile è il valor medio del suo commutatore con $H$, diviso $i\hbar$. La tappa 07 riprende questo punto e lo rafforza — non si conserva solo il valor medio.</p>
   <p>Shankar fa anche la derivazione <i>passiva</i>, e conviene vederla perché è più corta. Si richiede che la traslazione agisca sugli operatori come agisce sulle variabili classiche: $T^\dagger XT=X+\varepsilon I$ e $T^\dagger PT=P$. La prima, sviluppata al primo ordine con $T=I-i\varepsilon G/\hbar$, dà $-\tfrac{i\varepsilon}{\hbar}[X,G]=\varepsilon I$, cioè $[X,G]=i\hbar I$, che permette di concludere $G=P+f(X)$; la seconda dà $[P,G]=0$, che elimina $f(X)$ riducendola a una costante, scelta nulla. <b>Si noti la struttura</b>: le due richieste classiche — la posizione si sposta, l&rsquo;impulso no — si traducono in due commutatori, e i due commutatori insieme determinano il generatore <i>univocamente</i>. Una sola delle due non basterebbe, ed è lo stesso motivo per cui la scelta ingenua $T|x\rangle=|x+\varepsilon\rangle$ della tappa 02 era troppo restrittiva: lì si imponeva solo la prima.</p>`}
  ]},
  {t:'reveal', title:'Terza strada: il §25 dei Principi, dove l’idea nasce', tag:'esempio', steps:[
   {label:'L’operatore di traslazione di Dirac, e le sue due condizioni', body:R`
   <p>Dirac costruisce la cosa dall&rsquo;altro capo, e il suo ordine logico è il rovescio dei due precedenti: lui ha già le <i>condizioni quantiche</i> — le relazioni di commutazione fra $q$ e $p$, dedotte nel capitolo precedente dall&rsquo;analogia con le parentesi di Poisson — e vuole capire che cosa significhino. Il §25 serve a questo: «<i>Possiamo chiarire ulteriormente le nostre idee sul significato di alcune delle condizioni quantiche, effettuando uno studio degli operatori di traslazione</i>» (pag. stampata 137).</p>
   <p>Definito l&rsquo;operatore lineare $D$ che trasla i ket, Dirac ricava due condizioni che $D$ deve soddisfare, imponendo che <i>ogni equazione simbolica</i> fra ket, bra e variabili dinamiche resti invariante per traslazione — «<i>per il fatto che tale equazione ha un significato fisico che non dovrà venire alterato dalla traslazione</i>». Dall&rsquo;invarianza di un prodotto scalare $\langle Q|P\rangle=c$ ottiene che $D$ è unitario; dall&rsquo;invarianza di un&rsquo;equazione del tipo $v|P\rangle=|Q\rangle$ ottiene la legge di trasformazione delle variabili dinamiche, che è la $v_d=DvD^{-1}$ della tappa 02 — e osserva che «<i>l&rsquo;arbitrario fattore numerico di modulo uno, a meno del quale è definito $D$, non influisce su $v_d$</i>».</p>
   <p>Poi passa all&rsquo;infinitesimo. Per continuità fisica un ket traslato di $\delta x$ deve tendere a quello di partenza, e deve esistere il limite del rapporto incrementale: quel limite è un operatore lineare che Dirac chiama <b>l&rsquo;operatore di traslazione per la direzione x</b> e indica con $d_x$. Per $\delta x$ piccolo si ha $D=1+\delta x\,d_x$, e sostituendo nella condizione di unitarietà si trova che «<i>$d_x$ è un operatore lineare immaginario puro</i>» — cioè $i\hbar d_x$ è reale, nel suo linguaggio, ossia autoaggiunto nel nostro. Sostituendo nella legge di trasformazione delle variabili dinamiche si ottiene</p>
   $$\lim_{\delta x\to0}\frac{v_d-v}{\delta x}=d_xv-vd_x,$$
   <p>cioè: <b>il commutatore con $d_x$ è la derivata della variabile dinamica rispetto alla traslazione.</b> Ed è lo stesso ruolo che nella tappa 01 aveva la parentesi di Poisson con il generatore.</p>`},
   {label:'Il risultato, e la riga con cui Dirac lo commenta', body:R`
   <p>Ora il colpo. Dirac considera l&rsquo;apparato costruito per misurare $x$ e lo trasla di $\delta x$: quell&rsquo;apparato misurerà $x-\delta x$, perché l&rsquo;origine si è spostata. Confrontando con la formula precedente per $v=x$ si ottiene la condizione quantica che lega $d_x$ a $x$ — nel nostro linguaggio, $[d_x,x]=-1$ — e con un ragionamento analogo si trova che $y$, $z$, $p_x$, $p_y$, $p_z$ e le variabili dinamiche interne, «<i>le quali non vengono alterate dalla traslazione, devono commutare con $d_x$</i>».</p>
   <p>Confrontando questi risultati con le condizioni quantiche già note, si vede che $i\hbar d_x$ soddisfa <i>esattamente le stesse</i> relazioni di $p_x$. Dunque la loro differenza $p_x-i\hbar d_x$ commuta con tutte le variabili dinamiche, e perciò «<i>deve essere un numero</i>»; quel numero è reale e «<i>può essere reso nullo mediante un&rsquo;opportuna scelta dell&rsquo;arbitrario numero immaginario puro che può essere aggiunto a $d_x$</i>». Si ottiene allora, parole sue, che «<i>la componente x dell&rsquo;impulso totale del sistema è uguale a $i\hbar$ volte l&rsquo;operatore di traslazione $d_x$</i>».</p>
   <p>E il commento, che è la riga da portarsi via: «<i>Questo è un risultato fondamentale che dà un nuovo significato agli operatori di traslazione</i>» (pag. stampata 142). Si noti in che <i>direzione</i> va il guadagno per lui. Dirac non sta scoprendo l&rsquo;impulso: l&rsquo;impulso ce l&rsquo;ha già, definito come il momento canonicamente coniugato alla coordinata. Sta scoprendo che quell&rsquo;oggetto algebrico <b>ha un significato geometrico</b> — genera gli spostamenti — e la novità, per lui, è nel significato nuovo dell&rsquo;operatore di traslazione. Settant&rsquo;anni dopo Ballentine percorre la stessa freccia al contrario: parte dalla geometria e ne deduce l&rsquo;algebra. È la stessa identità letta nei due versi, e averla vista nei due versi è la ragione per cui questa tappa ha tre derivazioni invece di una.</p>`},
   {label:'Il regalo: perché gli impulsi commutano fra loro', body:R`
   <p>Nella stessa pagina Dirac aggiunge un&rsquo;osservazione che da sola giustifica la lettura dell&rsquo;originale, e che nessun manuale moderno fa. Le condizioni quantiche «<i>che stabiliscono che $p_x$, $p_y$ e $p_z$ commutino fra di loro risultano ora connesse al fatto che le traslazioni in direzioni diverse sono operazioni invertibili</i>» (pag. stampata 142).</p>
   <p>Si legga bene che cosa afferma. La relazione $[\hat p_x,\hat p_y]=0$, che in un corso standard è uno dei postulati — o una conseguenza immediata della rappresentazione differenziale, dato che le derivate parziali commutano per il teorema di Schwarz — <b>è la trascrizione di un fatto geometrico elementare</b>: traslare prima in $x$ e poi in $y$ dà lo stesso punto che traslare prima in $y$ e poi in $x$. Non è una proprietà della meccanica quantistica; è una proprietà dello spazio euclideo, e la meccanica quantistica si limita a registrarla.</p>
   <p>Questa osservazione è il seme dell&rsquo;intera tappa 05. Se i generatori commutano <i>perché</i> le trasformazioni corrispondenti commutano, allora i generatori che <b>non</b> commutano corrispondono a trasformazioni che non commutano — e il valore del commutatore si può <i>calcolare</i> guardando di quanto le due trasformazioni non commutano. Da qui esce tutta l&rsquo;algebra del gruppo di Galilei, inclusa l&rsquo;algebra del momento angolare, senza mai scrivere un operatore differenziale.</p>`}
  ]},
  {t:'reveal', title:'La traslazione finita: una serie di Taylor travestita da esponenziale', tag:'costruzione', steps:[
   {label:'Il limite di N traslazioni, e la serie', body:R`
   <p>Per la traslazione finita di un tratto $a$ si può invocare il risultato generale della tappa 03, oppure costruirla come fa Shankar: si divide l&rsquo;intervallo $a$ in $N$ parti, ciascuna delle quali è infinitesima nel limite, e si compongono le $N$ traslazioni:</p>
   $$T(a)=\lim_{N\to\infty}\Big[T(a/N)\Big]^{N}=\lim_{N\to\infty}\Big(I-\frac{ia\hat P}{N\hbar}\Big)^{N}=e^{-ia\hat P/\hbar}.$$
   <p>Il limite è lecito, nota Shankar, «<i>since $\hat P$ is the only operator in the picture and commutes with everything in sight, i.e., behaves like a c number</i>» — e questa precisazione non è pedante: la stessa manipolazione con <i>due</i> operatori diversi nell&rsquo;esponente è falsa, e la formula di Baker-Campbell-Hausdorff (problema 3.4 di Ballentine) dice di quanto.</p>
   <p>In rappresentazione di Schrödinger $\hat P=-i\hbar\,d/dx$, quindi l&rsquo;esponenziale diventa</p>
   $$e^{-ia\hat P/\hbar}=e^{-a\,d/dx}=\sum_{n=0}^{\infty}\frac{(-a)^{n}}{n!}\frac{d^{n}}{dx^{n}},$$
   <p>e applicato a una funzione dà <b>esattamente la serie di Taylor di $\psi(x-a)$ attorno a $x$</b>. Questo è il punto in cui l&rsquo;operatore astratto si riconosce: l&rsquo;esponenziale del generatore <i>è</i> l&rsquo;operatore di sviluppo in serie, e l&rsquo;identità</p>
   $$U(a)\psi(x)=\psi(x-a)$$
   <p>è la (6.30) di Picasso (pag. stampata 109), dimostrata lì prima sulle funzioni intere e poi estesa per densità — come la tappa 03 ha discusso.</p>`},
   {label:'Il controllo su un’onda piana, dove la serie si somma in forma chiusa', body:R`
   <p>Su una funzione generica la serie di Taylor non si somma; su un&rsquo;onda piana sì, e il conto è il modo più rapido di convincersi che l&rsquo;esponenziale fa ciò che si dice. Si prenda $\psi(x)=e^{ikx}$. Ogni derivata moltiplica per $ik$, quindi</p>
   $$\sum_{n=0}^{\infty}\frac{(-a)^{n}}{n!}(ik)^{n}=e^{-ika},$$
   <p>e il risultato applicato all&rsquo;onda dà $e^{-ika}e^{ikx}=e^{ik(x-a)}=\psi(x-a)$. <b>La serie si è sommata nell&rsquo;esponenziale di un numero</b>, e la ragione è che l&rsquo;onda piana è un&rsquo;autofunzione dell&rsquo;operatore impulso: su un autovettore l&rsquo;esponenziale di un operatore diventa l&rsquo;esponenziale del suo autovalore. È l&rsquo;osservazione che rende calcolabile ogni esponenziale di generatore, in ogni tappa che segue: non si esponenzia un operatore, si esponenzia un autovalore per volta.</p>
   <p>Il risultato ha anche un contenuto fisico che vale enunciare. Una traslazione cambia un autostato dell&rsquo;impulso <i>solo per una fase</i>, $e^{-ika}$ — cioè non lo cambia affatto, fisicamente. Un autostato dell&rsquo;impulso è dunque invariante per traslazione: l&rsquo;unico stato che «non si accorge» di essere stato spostato è quello completamente delocalizzato, e questo è il senso in cui l&rsquo;autostato dell&rsquo;impulso è l&rsquo;autostato della simmetria che l&rsquo;impulso genera.</p>`}
  ]},
  {t:'plot', title:'La traslazione come serie di Taylor: i primi tre troncamenti',
   intro:R`<p>La curva blu è una gaussiana $\psi(x)=e^{-x^{2}}$; la curva verde è la stessa traslata di $a=1$, cioè $\psi(x-1)$ — il risultato esatto di $e^{-a\,d/dx}$. Le altre due sono i troncamenti della serie di Taylor al primo e al secondo ordine, costruiti con le derivate di $\psi$ nel punto. La prima derivata vale</p>
   $$\frac{d}{dx}e^{-x^{2}}=-2x\,e^{-x^{2}},$$
   <p>e la seconda $(4x^{2}-2)e^{-x^{2}}$.</p>`,
   plots:[{kind:'func2d', xr:[-2.5,3.5], yr:[-0.6,1.6], height:270, ticks:true,
     title:'ψ(x), la traslata esatta, e due troncamenti della serie',
     curves:[{f:'Math.exp(-x*x)', col:'#5aa9ff', width:2.2, label:'ψ(x)'},
             {f:'Math.exp(-(x-1)*(x-1))', col:'#6bdc9b', width:2.4, label:'ψ(x−1), esatta'},
             {f:'Math.exp(-x*x)+2*x*Math.exp(-x*x)', col:'#ffc24a', width:1.8, dash:true, label:'1° ordine'},
             {f:'Math.exp(-x*x)+2*x*Math.exp(-x*x)+(4*x*x-2)*Math.exp(-x*x)/2', col:'#ff6b8a', width:1.8, dash:true, label:'2° ordine'}],
     xlabel:'x', ylabel:'ψ'}],
   leggi:R`<p><b>Che cosa guardare.</b> La curva verde è la blu spostata a destra di uno, senza deformazione: è ciò che l&rsquo;operatore $e^{-a\,d/dx}$ produce, e la sua forma identica alla blu è la traduzione visiva del fatto che la traslazione è unitaria — non schiaccia, non allarga, non cambia la norma. I due troncamenti tratteggiati, invece, si avvicinano alla verde solo nella regione dove la blu è apprezzabilmente diversa da zero, e <i>divergono</i> ai bordi: il troncamento al secondo ordine assume valori negativi, che per una funzione d&rsquo;onda gaussiana non hanno senso.</p>
   <p><b>Che cosa impararne.</b> Due cose, ed è la seconda quella che paga. La prima: la serie di Taylor converge alla traslata, ma non uniformemente in modo utile — bisogna sommarla <i>tutta</i> per ottenere uno spostamento rigido, e ogni troncamento finito produce una funzione che non è una traslata di niente. La seconda, più importante: <b>l&rsquo;esponenziale di un operatore non si può troncare se si vuole conservare la struttura</b>. I troncamenti non sono unitari — la curva rossa ha norma diversa dalla blu — e perdere l&rsquo;unitarietà significa perdere la conservazione della probabilità. È il motivo per cui in tutto questo movimento le trasformazioni finite si tengono in forma esponenziale chiusa e si sviluppano solo per <i>dedurre</i> relazioni fra generatori, mai per calcolare uno stato.</p>`},
  {t:'reveal', title:'Il commutatore canonico, dimostrato', tag:'costruzione', steps:[
   {label:'L’argomento di Ballentine: spostare l’origine', body:R`
   <p>Ed ecco il risultato che dà il titolo al movimento. Nell&rsquo;impostazione di Ballentine (§3.4) il commutatore canonico non si postula: si ottiene da un argomento in cui l&rsquo;unico ingrediente fisico è che spostare l&rsquo;origine delle coordinate cambia la posizione misurata e lascia l&rsquo;impulso.</p>
   <p>Si parte dall&rsquo;azione della traslazione sugli autovettori di posizione, che è la definizione stessa dell&rsquo;operatore (punto di vista attivo, $\hbar=1$ in questa sezione come fa Ballentine):</p>
   $$|\mathbf x\rangle\to|\mathbf x\rangle'=e^{-i\mathbf a\cdot\mathbf P}|\mathbf x\rangle=|\mathbf x+\mathbf a\rangle.$$
   <p>L&rsquo;osservabile posizione si trasforma di conseguenza, con la legge della tappa 02:</p>
   $$\mathbf Q\to\mathbf Q'=e^{-i\mathbf a\cdot\mathbf P}\,\mathbf Q\,e^{i\mathbf a\cdot\mathbf P}.$$
   <p>Ora si impone la condizione che <i>definisce</i> $\mathbf Q'$ come osservabile trasformata: gli autovettori trasformati devono essere suoi autovettori con gli stessi autovalori,</p>
   $$Q'_\alpha|\mathbf x\rangle'=x_\alpha|\mathbf x\rangle'.$$
   <p>Ma $|\mathbf x\rangle'=|\mathbf x+\mathbf a\rangle$, e di quel ket si sa già che è autovettore di $\mathbf Q$ con autovalore $\mathbf x+\mathbf a$. Confrontando le due informazioni si conclude che</p>
   $$\mathbf Q'=\mathbf Q-\mathbf a\,I.$$
   <p>Ballentine commenta: «<i>one may think of the operator $\mathbf Q'$ as measuring position with respect to a displaced origin</i>». Ed è tutta la fisica che serve. <b>Si hanno ora due espressioni per lo stesso oggetto</b> — una in termini dell&rsquo;esponenziale del generatore, una in termini della geometria — e basta uguagliare i termini del primo ordine in $\mathbf a$. L&rsquo;espansione della prima dà $\mathbf Q-i[\mathbf a\cdot\mathbf P,\mathbf Q]+O(a^2)$; confrontando con la seconda si ottiene $[Q_\alpha,\mathbf a\cdot\mathbf P]=i a_\alpha I$, e poiché la direzione di $\mathbf a$ è arbitraria,</p>
   $$[Q_\alpha,P_\beta]=i\,\delta_{\alpha\beta}\,I,$$
   <p>che con la notazione dimensionale ripristinata nella tappa 06 diventa $[\hat q_\alpha,\hat p_\beta]=i\hbar\,\delta_{\alpha\beta}$. <b>Il commutatore canonico è un teorema</b>, e la sua dimostrazione non usa l&rsquo;onda di de Broglie, non usa la trasformata di Fourier e non usa nessuna forma esplicita dell&rsquo;operatore impulso: usa il fatto che lo spazio è omogeneo.</p>`},
   {label:'Il conto esplicito, in rappresentazione di Schrödinger', body:R`
   <p>Chi arriva da un corso standard ha visto il commutatore canonico verificato per sostituzione, e vale rifare quel conto adesso — ma con l&rsquo;ordine logico rovesciato, cioè come <i>controllo di coerenza</i> della derivazione precedente e non come sua dimostrazione.</p>
   <p>Si applica il commutatore a una funzione d&rsquo;onda arbitraria $\psi$, con $\hat p=-i\hbar\,d/dx$ e $\hat q$ che moltiplica per $x$. Il termine $\hat q\hat p$ dà $-i\hbar\,x\psi'$; il termine $\hat p\hat q$ dà $-i\hbar\,(x\psi)'=-i\hbar(x\psi'+\psi)$. Sottraendo:</p>
   $$-i\hbar\Big(x\frac{d\psi}{dx}-\frac{d}{dx}(x\psi)\Big)=i\hbar\,\psi(x).$$
   <p>Il commutatore applicato a $\psi$ restituisce $i\hbar\psi$ <i>per ogni</i> $\psi$, cioè $[\hat q,\hat p]=i\hbar$ come identità fra operatori. Si osservi da dove viene il risultato: l&rsquo;unico termine che sopravvive è quello in cui la derivata colpisce il fattore $x$ invece della funzione d&rsquo;onda — i due termini con $x\psi'$ si cancellano. <b>Il commutatore canonico è, in questa rappresentazione, la regola di Leibniz e nient&rsquo;altro.</b> Ed è per questo che la derivazione geometrica di Ballentine è preferibile come <i>spiegazione</i>: la regola di Leibniz è vera in qualunque teoria che usi derivate, mentre l&rsquo;omogeneità dello spazio è un fatto fisico, e il contenuto fisico del commutatore canonico va cercato dove il fatto fisico sta.</p>
   <p>Da questo conto, insieme alla tappa 03, segue anche la relazione di indeterminazione nella sua forma standard; e nella tappa 09 lo stesso commutatore farà un lavoro inaspettato — deciderà che l&rsquo;operatore di parità deve essere <i>lineare</i> e non antilineare, cioè escluderà uno dei due rami del teorema di Wigner usando null&rsquo;altro che $[\hat q,\hat p]=i\hbar$.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Nella derivazione di Sakurai il commutatore $[\hat x_i,\hat K_j]=i\delta_{ij}$ esce senza che si sappia chi è $\mathbf K$. In che senso, allora, si è «dimostrato» che l&rsquo;impulso genera le traslazioni?`,
    a:R`In nessun senso, e distinguerlo è importante. La derivazione di Sakurai dimostra che <i>esiste</i> un operatore hermitiano $\mathbf K$ con quella relazione di commutazione con la posizione, e che quell&rsquo;operatore genera le traslazioni. Non dimostra che $\mathbf K$ sia proporzionale all&rsquo;impulso, perché «impulso» a quel punto non è ancora stato definito come operatore — e se lo si definisse come $-i\hbar\,d/dx$ si starebbe assumendo la risposta. Le tre strade di questa tappa chiudono il cerchio in tre modi diversi: Shankar identifica $\hat G$ con l&rsquo;impulso perché la sua forma differenziale coincide con quella già postulata nel suo corso (regola di sostituzione); Dirac lo identifica perché $i\hbar d_x$ soddisfa le stesse condizioni quantiche di $p_x$, che lui ha dedotto dalle parentesi di Poisson; Ballentine — ed è la strada che questo movimento prende — non lo identifica affatto in questa tappa, e rimanda alla 06, dove l&rsquo;identificazione si ottiene senza nessun prestito dal classico, dalla sola algebra del gruppo di Galilei. Le prime due vie sono più brevi perché prendono in prestito qualcosa; la terza non prende in prestito niente e costa un capitolo.`},
   {q:R`Se la traslazione moltiplica un autostato dell&rsquo;impulso solo per una fase, come può l&rsquo;impulso essere «il generatore» della traslazione? Non dovrebbe esserci un effetto visibile?`,
    a:R`La fase <i>è</i> l&rsquo;effetto visibile, a condizione di avere qualcosa con cui confrontarla. Su un singolo autostato dell&rsquo;impulso la fase globale non ha significato fisico e lo stato traslato è indistinguibile da quello di partenza: giusto, ed è il contenuto fisico della delocalizzazione completa. Ma su una <i>sovrapposizione</i> di autostati con impulsi diversi, $\psi=\sum_k c_k e^{ikx}$, la traslazione moltiplica ciascuna componente per una fase <b>diversa</b>, $e^{-ika}$, e le fasi relative sono osservabili: la loro ricombinazione è precisamente ciò che sposta il pacchetto. Questo è anche il modo più compatto di vedere perché la traslazione sia diagonale nella rappresentazione degli impulsi e non in quella delle coordinate, e perché il generatore sia l&rsquo;impulso e non la posizione. Il controesempio simmetrico chiarisce: $e^{-ib\hat Q/\hbar}$ moltiplica un autostato <i>della posizione</i> per una fase, e sposta i pacchetti nello spazio degli impulsi — è un boost, e nella tappa 05 sarà uno dei dieci generatori.`},
   {q:R`La derivazione di Ballentine usa $|\mathbf x\rangle$ e la traslazione degli autovettori di posizione. Ma quegli autovettori non stanno nello spazio di Hilbert. L&rsquo;argomento regge?`,
    a:R`Regge, e il motivo va detto perché è il punto in cui questa tappa si appoggia a quella che la precede. Gli autovettori della posizione non sono elementi di $\mathcal H$ — l&rsquo;operatore posizione non ha autovettori normalizzabili, e il formalismo che li rende legittimi è quello dello spazio equipaggiato, in cui $|\mathbf x\rangle$ vive nel duale di uno spazio di funzioni di prova e <span class="str" data-str="delta-di-dirac">la delta di Dirac</span> è la sua relazione di ortogonalità. In quel formalismo l&rsquo;equazione $e^{-i\mathbf a\cdot\mathbf P}|\mathbf x\rangle=|\mathbf x+\mathbf a\rangle$ è un&rsquo;identità fra funzionali, e l&rsquo;argomento di Ballentine la usa solo per dedurre un&rsquo;identità fra <i>operatori</i>, $\mathbf Q'=\mathbf Q-\mathbf a I$, che è un&rsquo;affermazione su $\mathcal H$ e si estende per densità. Ballentine stesso dichiara le due ipotesi che sta usando: che lo spazio sia un continuo, inevitabile «<i>if we are to use continuous transformations</i>», e che le tre componenti della posizione commutino, cioè che sia possibile preparare uno stato localizzato arbitrariamente vicino a un punto. Aggiunge che la prima «<i>may need revision in a theory that attempts to treat gravitation</i>» e la seconda «<i>may not be acceptable in relativistic quantum theory</i>»: due avvertenze che vale registrare, perché dicono dove questa costruzione finisce.`}
  ]}
]},

/* ---------------- 05 · L'ALGEBRA DEL GRUPPO DI GALILEI ---------------- */
{ num:'05', title:'L’algebra del gruppo di Galilei: dieci generatori, e la massa che non si può togliere', meta:'il prodotto quadruplo misura la non commutatività · l’algebra del momento angolare prima del momento angolare · l’identità di Jacobi come strumento di calcolo · la massa come costante irremovibile',
  blocchi:[
  {t:'prosa', title:'Da un fatto geometrico a una tabella di commutatori', tag:'architettura', html:R`
  <p>La tappa 04 si è chiusa con l&rsquo;osservazione di Dirac che $[\hat p_x,\hat p_y]=0$ è la trascrizione del fatto che le traslazioni in direzioni diverse commutano. Letta al rovescio, quell&rsquo;osservazione è un <b>metodo di calcolo</b>: se il commutatore di due generatori registra la non commutatività delle due trasformazioni, allora si può <i>calcolare</i> ogni commutatore eseguendo le trasformazioni sulle coordinate e guardando di quanto non si chiudono. Questa tappa fa esattamente questo, dieci generatori alla volta, e produce una tabella di nove relazioni che è l&rsquo;intera cinematica della meccanica quantistica non relativistica.</p>
  <p>L&rsquo;insieme delle <span class="str" data-str="simmetrie">simmetrie</span> dello spazio-tempo di Galilei ha <b>dieci parametri</b>: tre angoli di rotazione, tre spostamenti spaziali, tre componenti di velocità, uno spostamento temporale. La trasformazione più generale è una successione di dieci trasformazioni elementari, e l&rsquo;operatore unitario corrispondente è un prodotto di dieci esponenziali:</p>
  $$U(\tau)=\prod_{\mu=1}^{10}e^{is_\mu K_\mu},$$
  <p>dove gli $s_\mu$ sono i dieci parametri e i $K_\mu=K_\mu^\dagger$ i dieci generatori autoaggiunti. Ballentine lo scrive così (pag. stampata 68) e aggiunge la frase che dice dove si sta andando: «<i>Moreover, these generators will turn out to be very closely related to the fundamental dynamical variables, such as momentum and energy</i>». <b>Related</b>, non <i>uguali</i>: l&rsquo;identificazione è il lavoro della tappa 06, e per ora i dieci oggetti sono puramente geometrici.</p>
  <p>Se tutti i parametri diventano infinitesimi si ottiene l&rsquo;unitario infinitesimo generale,</p>
  $$U=I+i\sum_{\mu=1}^{10}s_\mu K_\mu,$$
  <p>e qui sta il punto di tutta la tappa, in una riga di Ballentine: «<i>The multiplication law for the U operators expresses itself as a set of commutation relations for the generators</i>». <b>La legge di composizione del gruppo, letta all&rsquo;ordine infinitesimo, diventa un&rsquo;algebra di <span class="str" data-str="commutatore">commutatori</span>.</b> Non si perde niente in questa traduzione — l&rsquo;esponenziale ricostruisce il finito dall&rsquo;infinitesimo, come la tappa 03 ha stabilito — e si guadagna che un&rsquo;algebra si calcola, mentre un gruppo si deve conoscere.</p>`},
  {t:'reveal', title:'Il prodotto quadruplo, e perché misura la non commutatività', tag:'costruzione', steps:[
   {label:'Il conto, e il caso in cui dà l’identità', body:R`
   <p>Lo strumento è un prodotto di quattro esponenziali: due trasformazioni infinitesime e le loro inverse, nell&rsquo;ordine che <i>non</i> si disfa. Sviluppando in $\varepsilon$ fino al secondo ordine,</p>
   $$e^{i\varepsilon K_\mu}e^{i\varepsilon K_\nu}e^{-i\varepsilon K_\mu}e^{-i\varepsilon K_\nu}=I+\varepsilon^{2}(K_\nu K_\mu-K_\mu K_\nu)+O(\varepsilon^{3}).$$
   <p>Il primo ordine si cancella — i quattro esponenti sommano a zero — e <b>il primo termine che sopravvive è il commutatore, moltiplicato per $\varepsilon^{2}$</b>. Questa è l&rsquo;unica ragione per cui il prodotto quadruplo è lo strumento giusto invece del prodotto doppio: il prodotto doppio al primo ordine non distingue l&rsquo;ordine dei fattori.</p>
   <p>Per convincersi che il conto non è una manipolazione cieca, conviene farlo prima nel caso in cui <i>sa</i> rispondere banalmente. Se i due generatori sono numeri — o, più in generale, due operatori che commutano — gli esponenziali si possono riordinare e il prodotto si chiude esattamente:</p>
   $$e^{i\varepsilon a}e^{i\varepsilon b}e^{-i\varepsilon a}e^{-i\varepsilon b}=1.$$
   <p>Shankar fa questa osservazione in una nota del §12.2 (pag. stampata 310), e la nota spiega il senso dell&rsquo;intero metodo: se rotazioni e traslazioni commutassero, il prodotto quadruplo sarebbe l&rsquo;identità, e <b>lo scarto dall&rsquo;identità È la misura della non commutatività</b>. Ogni commutatore calcolato in questa tappa è, letteralmente, un quadrilatero di trasformazioni che non si chiude, e il commutatore è il lato che manca.</p>`},
   {label:'La chiusura del gruppo, e la forma generale del risultato', body:R`
   <p>Ora l&rsquo;argomento che vincola il risultato, e che non richiede di sapere <i>quali</i> siano i generatori. Una successione di trasformazioni dello spazio-tempo è equivalente a un&rsquo;altra trasformazione <i>dello stesso gruppo</i>: è la chiusura. Quindi il prodotto quadruplo deve coincidere, a meno di un fattore di fase, con un operatore della forma $U(\tau)$ già scritta. Esistono cioè undici parametri $\{\omega,s_\mu\}$ — i dieci del gruppo più la fase — tali che</p>
   $$e^{i\omega}U=I+i\sum_{\mu=1}^{10}s_\mu K_\mu+i\omega I,$$
   <p>e tutti e undici sono di ordine $\varepsilon^{2}$, perché tale è lo scarto dall&rsquo;identità del prodotto quadruplo. Uguagliando le due espressioni si ottiene il risultato strutturale: <b>il commutatore di due generatori è una combinazione lineare di generatori e dell&rsquo;operatore identità</b>,</p>
   $$[K_\mu,K_\nu]=i\sum_\lambda c^{\lambda}_{\mu\nu}K_\lambda+ib_{\mu\nu}I.$$
   <p>Le due parti hanno origini diverse, e tenerle distinte è ciò che rende la tappa non banale. Le costanti $c^{\lambda}_{\mu\nu}$ «<i>are determined from the multiplication rules for the space–time transformations</i>»: sono geometria pura, si leggono sulle coordinate. Il multiplo dell&rsquo;identità $b_{\mu\nu}$, invece, «<i>arises from the phase factor</i>, <i>and would vanish if $\omega$ were equal to zero</i>»: viene dal fatto che una rappresentazione unitaria del gruppo si porta dietro una fase arbitraria, e la fase non è osservabile. <b>Si potrebbe pensare che allora i $b_{\mu\nu}$ siano tutti eliminabili. Non è vero, e il controesempio è la massa.</b></p>
   <p>Il metodo di calcolo, a questo punto, è una ricetta in tre passi: si scelgono due generatori; si eseguono sulle coordinate le quattro trasformazioni corrispondenti nell&rsquo;ordine del prodotto quadruplo; si guarda quale singola trasformazione ne risulta. Il commutatore dei due generatori scelti differisce dal generatore di quella trasformazione risultante <i>al più per un multiplo dell&rsquo;identità</i>.</p>`}
  ]},
  {t:'gram', title:'I dieci generatori, e la trasformazione che ciascuno produce', rows:[
   ['$x\to R_\alpha(\theta_\alpha)x$', 'rotazione di $\theta_\alpha$ attorno all&rsquo;asse $\alpha$ — operatore unitario $e^{-i\theta_\alpha J_\alpha}$, tre parametri. I segni meno nelle definizioni di $J_\alpha$ e $P_\alpha$, avverte Ballentine, «<i>are introduced only to conform to conventional notations</i>»: non hanno contenuto.'],
   ['$x_\alpha\to x_\alpha+a_\alpha$', 'spostamento di $a_\alpha$ lungo l&rsquo;asse $\alpha$ — operatore $e^{-ia_\alpha P_\alpha}$, tre parametri. È la traslazione della tappa 04, qui con $\hbar=1$ come fa Ballentine in tutto il capitolo.'],
   ['$x_\alpha\to x_\alpha+v_\alpha t$', 'trasformazione di velocità (<i>boost</i> galileiano) — operatore $e^{iv_\alpha G_\alpha}$, tre parametri. Non è una traslazione: sposta di una quantità che <b>cresce col tempo</b>, e questa dipendenza da $t$ è la ragione per cui $G$ e $H$ non commutano.'],
   ['$t\to t+s$', 'spostamento temporale — operatore $e^{isH}$, un parametro. Qui $H$ è, per ora, <i>solo</i> il generatore delle traslazioni nel tempo: che sia l&rsquo;energia è un teorema della tappa 06.'],
   ['$\{-J_\alpha,-P_\alpha,G_\alpha,H\}$', 'i dieci generatori concreti, forme specifiche dei generici $K_\mu$ con $\mu=1,\dots,10$. Dieci parametri, dieci generatori autoaggiunti, e nove relazioni di commutazione indipendenti da determinare.']
  ]},
  {t:'reveal', title:'I commutatori facili, e il primo non banale', tag:'costruzione', steps:[
   {label:'Le coppie che commutano per ispezione', body:R`
   <p>Diverse coppie di trasformazioni commutano in modo ovvio, e per quelle il prodotto quadruplo si chiude: il commutatore dei generatori si annulla, <i>a meno del solito multiplo dell&rsquo;identità</i>. Ballentine le elenca una per una con il motivo geometrico (pag. stampata 70):</p>
   <p><b>Spostamenti spaziali e temporali puri.</b> La legge di composizione del gruppo, per questi, si riduce a $a_3=a_2+a_1$ e $s_3=s_2+s_1$, che non dipende dall&rsquo;ordine. Quindi</p>
   $$[P_\alpha,P_\beta]=O+(?)I,\qquad [P_\alpha,H]=O+(?)I.$$
   <p><b>Spostamenti spaziali e boost.</b> Stessa ragione, con $a_3=a_2+a_1$ e $v_3=v_2+v_1$:</p>
   $$[P_\alpha,G_\beta]=O+(?)I,\qquad [G_\alpha,G_\beta]=O+(?)I.$$
   <p><b>Rotazioni e tempo.</b> Ruotare lo spazio e aspettare sono operazioni indipendenti: $[J_\alpha,H]=O+(?)I$. <b>Rotazione e trasformazione lungo il proprio asse.</b> Una rotazione attorno a un asse non muove quell&rsquo;asse, quindi $[J_\alpha,P_\alpha]=O+(?)I$ e $[J_\alpha,G_\alpha]=O+(?)I$ — <i>con lo stesso indice</i>, e la differenza con il caso a indici diversi è l&rsquo;intera algebra del momento angolare.</p>
   <p>I punti di domanda non sono una svista di notazione: sono il debito che il paragrafo sui multipli dell&rsquo;identità pagherà, e alcuni di quei debiti <b>non si pagano con zero</b>.</p>`},
   {label:'Il primo caso non banale: boost e tempo non commutano, e lo scarto è una traslazione', body:R`
   <p>Si prendano $G_1$ e $H$. Il prodotto quadruplo è</p>
   $$e^{i\varepsilon H}e^{i\varepsilon G_1}e^{-i\varepsilon H}e^{-i\varepsilon G_1}=I+\varepsilon^{2}[G_1,H]+\cdots,$$
   <p>e corrisponde, <i>da destra a sinistra</i>, a: una velocità $-\varepsilon$ lungo l&rsquo;asse $x$, uno spostamento temporale di $-\varepsilon$, e le loro inverse. Si eseguano le quattro trasformazioni sulle coordinate, una riga per passo:</p>
   $$(x_1,x_2,x_3,t)\to(x_1-\varepsilon t,x_2,x_3,t)$$
   $$\to(x_1-\varepsilon t,x_2,x_3,t-\varepsilon)$$
   $$\to(x_1-\varepsilon t+\varepsilon(t-\varepsilon),x_2,x_3,t-\varepsilon)$$
   $$\to(x_1-\varepsilon^{2},x_2,x_3,t).$$
   <p>Vale guardare dove nasce il risultato. Il boost inverso, applicato al terzo passo, <b>non restituisce ciò che il primo boost aveva tolto</b>, perché nel frattempo il tempo è cambiato: il primo aveva sottratto $\varepsilon t$, il terzo aggiunge $\varepsilon(t-\varepsilon)$. La somma delle due è</p>
   $$x_1-\varepsilon t+\varepsilon(t-\varepsilon)=x_1-\varepsilon^{2},$$
   <p>e il termine in $\varepsilon t$ si cancella lasciando un residuo <i>indipendente dal tempo</i>. Il risultato netto delle quattro operazioni è dunque uno spostamento spaziale di $-\varepsilon^{2}$ lungo $x$, cioè l&rsquo;unitario $e^{i\varepsilon^{2}P_1}=I+i\varepsilon^{2}P_1+\cdots$ a meno di una fase. Confrontando con lo sviluppo del prodotto quadruplo e ripetendo per i tre assi:</p>
   $$[G_\alpha,H]=iP_\alpha+(?)I.$$
   <p><b>Il contenuto fisico è una frase sola</b>: dare una spinta e poi aspettare non è la stessa cosa che aspettare e poi dare la spinta, e la differenza fra le due è <i>uno spostamento</i>. Chiunque abbia spinto un carrello lo sa; qui è diventata la relazione che, nella tappa 06, costringerà la hamiltoniana ad avere la forma $P^2/2M$ e nient&rsquo;altro.</p>`}
  ]},
  {t:'reveal', title:'Le rotazioni: l’algebra del momento angolare prima del momento angolare', tag:'costruzione', steps:[
   {label:'Le tre matrici, e il loro commutatore', body:R`
   <p>Le rotazioni sono il caso in cui il metodo produce il risultato più noto per la via meno nota, e conviene farlo per intero perché <b>si ottiene l&rsquo;algebra del momento angolare senza mai scrivere un operatore differenziale, un&rsquo;armonica sferica o un operatore di salita</b>. Una rotazione agisce sulle coordinate come $x_j\to\sum_k(R)_{jk}x_k$, con le tre matrici</p>
   $$R_1(\theta)=\begin{pmatrix}1&0&0\\0&\cos\theta&-\sin\theta\\0&\sin\theta&\cos\theta\end{pmatrix},\quad R_2(\theta)=\begin{pmatrix}\cos\theta&0&\sin\theta\\0&1&0\\-\sin\theta&0&\cos\theta\end{pmatrix},\quad R_3(\theta)=\begin{pmatrix}\cos\theta&-\sin\theta&0\\\sin\theta&\cos\theta&0\\0&0&1\end{pmatrix}.$$
   <p>Si sviluppi in serie di potenze dell&rsquo;angolo, $R_\alpha(\theta)=I-i\theta M_\alpha+\cdots$, con $M_\alpha=i\,dR_\alpha/d\theta|_{\theta=0}$. Il fattore $i$ nella definizione serve a rendere le $M_\alpha$ hermitiane, e si ottiene</p>
   $$M_1=\begin{pmatrix}0&0&0\\0&0&-i\\0&i&0\end{pmatrix},\quad M_2=\begin{pmatrix}0&0&i\\0&0&0\\-i&0&0\end{pmatrix},\quad M_3=\begin{pmatrix}0&-i&0\\i&0&0\\0&0&0\end{pmatrix}.$$
   <p>Queste tre matrici $3\times3$ sono i generatori delle rotazioni <i>sulle coordinate</i> — non sugli stati — e il loro commutatore si calcola a mano in due righe di moltiplicazioni:</p>
   $$M_1M_2-M_2M_1=iM_3.$$
   <p>È la stessa struttura che si ritroverà fra gli operatori sugli stati, e non è una coincidenza: <b>l&rsquo;algebra è una proprietà del gruppo, non della rappresentazione</b>. Le $M_\alpha$ sono la rappresentazione di dimensione tre; gli operatori $J_\alpha$ sullo spazio di Hilbert sono un&rsquo;altra rappresentazione, in generale di dimensione infinita; le costanti di struttura sono le stesse.</p>`},
   {label:'Il quadrilatero di rotazioni che non si chiude', body:R`
   <p>Ora il prodotto quadruplo, fatto sulle matrici. Al secondo ordine nell&rsquo;angolo piccolo $\varepsilon$,</p>
   $$R_2(-\varepsilon)R_1(-\varepsilon)R_2(\varepsilon)R_1(\varepsilon)=I+\varepsilon^{2}(M_1M_2-M_2M_1)=I+\varepsilon^{2}iM_3=R_3(-\varepsilon^{2}).$$
   <p>Questo conto si può fare esattamente, e vale farlo perché il risultato esatto dice qualcosa che l&rsquo;espansione nasconde. L&rsquo;elemento di posto $(1,2)$ del prodotto dei quattro è, senza nessuna approssimazione,</p>
   $$\big[R_2(-\varepsilon)R_1(-\varepsilon)R_2(\varepsilon)R_1(\varepsilon)\big]_{12}=(2-\cos\varepsilon)\sin^{2}\varepsilon\cos\varepsilon,$$
   <p>e il suo comportamento per angoli piccoli è</p>
   $$\lim_{\varepsilon\to0}\frac{\big[R_2(-\varepsilon)R_1(-\varepsilon)R_2(\varepsilon)R_1(\varepsilon)\big]_{12}}{\varepsilon^{2}}=1,$$
   <p>mentre l&rsquo;elemento $(1,2)$ di $R_3(-\varepsilon^{2})$ vale $-\sin(-\varepsilon^{2})=\varepsilon^{2}+O(\varepsilon^{6})$. <b>I due coincidono al secondo ordine e divergono al quarto</b>, ed è esattamente ciò che l&rsquo;argomento promette: il prodotto quadruplo di due rotazioni finite non è una rotazione attorno al terzo asse, lo è soltanto all&rsquo;ordine in cui il commutatore vive.</p>
   <p>Gli operatori unitari di rotazione devono soddisfare la relazione corrispondente a meno di una fase, $e^{i\varepsilon J_2}e^{i\varepsilon J_1}e^{-i\varepsilon J_2}e^{-i\varepsilon J_1}=e^{i\omega}e^{i\varepsilon^{2}J_3}$, e i loro generatori dunque</p>
   $$[J_\alpha,J_\beta]=i\varepsilon_{\alpha\beta\gamma}J_\gamma+(?)I,$$
   <p>dove $\varepsilon_{\alpha\beta\gamma}$ è il simbolo completamente antisimmetrico con $\varepsilon_{123}=1$, e le altre componenti si ottengono per permutazione ciclica dei tre assi e per antisimmetria del commutatore. <b>Questa è l&rsquo;algebra del momento angolare</b>, e a questo punto del ragionamento nessuno ha ancora detto che $J$ abbia qualcosa a che fare con il momento angolare: è il generatore delle rotazioni, e basta.</p>`}
  ]},
  {t:'plot', title:'Il quadrilatero che non si chiude: lo scarto dall’identità è quadratico',
   intro:R`<p>La curva blu è l&rsquo;elemento $(1,2)$ esatto del prodotto quadruplo di rotazioni, $(2-\cos\varepsilon)\sin^{2}\varepsilon\cos\varepsilon$; la verde è $\varepsilon^{2}$, cioè l&rsquo;elemento $(1,2)$ di $R_3(-\varepsilon^{2})$ al secondo ordine. L&rsquo;asse orizzontale è l&rsquo;angolo $\varepsilon$ in radianti, da zero a un radiante.</p>`,
   plots:[{kind:'func2d', xr:[0,1.0], yr:[0,1.0], height:260, ticks:true,
     title:'elemento (1,2) esatto, e la sua approssimazione quadratica',
     curves:[{f:'(2-Math.cos(x))*Math.sin(x)*Math.sin(x)*Math.cos(x)', col:'#5aa9ff', width:2.4, label:'esatto'},
             {f:'x*x', col:'#6bdc9b', width:2.0, dash:true, label:'ε²'},
             {f:'(2-Math.cos(x))*Math.sin(x)*Math.sin(x)*Math.cos(x)/(x*x)', col:'#ffc24a', width:1.6, label:'rapporto'}],
     xlabel:'ε (radianti)', ylabel:'elemento (1,2)'}],
   leggi:R`<p><b>Che cosa guardare.</b> Vicino all&rsquo;origine le due curve sono indistinguibili, e la terza — il loro rapporto — parte da uno: è il contenuto del limite calcolato sopra. Allontanandosi, la blu <i>cade sotto</i> la verde e il rapporto scende; a un radiante lo scarto è già del quaranta per cento. Si noti anche che la curva blu, se la si prolungasse, tornerebbe a zero a $\varepsilon=\pi/2$ — dove $\cos\varepsilon=0$ — mentre $\varepsilon^{2}$ cresce indefinitamente: le due funzioni non si somigliano affatto, fuori dall&rsquo;origine.</p>
