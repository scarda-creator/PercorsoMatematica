   <p>Il divieto sul dipolo permanente è il caso particolare di una famiglia di divieti, e Landau li ricava tutti con un argomento che sta in cinque righe. Si tratta di decidere quando un elemento di matrice $f_{ug}=\int\psi_u^{*}f\psi_g\,dq$ è nullo per ragioni di simmetria, dove $g$ e $u$ indicano stati pari e dispari — dal tedesco <i>gerade</i> e <i>ungerade</i>, convenzione che Landau usa e che vale conoscere perché compare in tutta la letteratura spettroscopica.</p>
   <p>Per una grandezza <b>scalare vera</b> — che non cambia sotto inversione — l&rsquo;operatore commuta con $\Pi$, quindi nella base in cui $\Pi$ è diagonale anche $f$ è diagonale rispetto all&rsquo;indice di parità: sono non nulli solo gli elementi $g\to g$ e $u\to u$. Per una grandezza <b>pseudoscalare</b> — che cambia segno, come il prodotto scalare di un vettore assiale per uno polare — si ha $\Pi f=-f\Pi$, cioè i due operatori anticommutano; prendendo l&rsquo;elemento di matrice di questa uguaglianza per la transizione $g\to g$, e ricordando che $\Pi_{gg}=1$, si ottiene $f_{gg}=0$, e analogamente $f_{uu}=0$. Dunque gli elementi non nulli sono solo quelli in cui la parità <i>cambia</i>. Landau riassume:</p>
   <p>— <b>scalari veri</b>: $g\to g$, $u\to u$;<br>
   — <b>pseudoscalari</b>: $g\to u$, $u\to g$;<br>
   — <b>vettori polari</b>: $g\to u$, $u\to g$;<br>
   — <b>vettori assiali</b>: $g\to g$, $u\to u$.</p>
   <p>Landau dà anche la derivazione alternativa, e vale leggerla perché è quella che si usa in pratica: si guarda direttamente l&rsquo;integrale. «<i>Consideriamo, per esempio, l&rsquo;integrale $f_{ug}=\int\psi_u^{*}f\psi_g\,dq$, dove la funzione $\psi_g$ è pari e la funzione $\psi_u$ dispari. Quando il segno di tutte le coordinate cambia l&rsquo;espressione integranda cambia di segno se $f$ è un vero scalare; d&rsquo;altra parte, l&rsquo;integrale esteso a tutto lo spazio non può dipendere dal cambiamento nelle notazioni delle variabili d&rsquo;integrazione. Ne risulta che $f_{ug}=-f_{ug}$, cioè $f_{ug}=0$.</i>» <b>È lo stesso argomento del $\int xe^{-x^{2}}dx=0$ di due passi sopra</b>, in forma generale: un integrale su un dominio simmetrico di una funzione che cambia segno sotto inversione è nullo, e il resto è contabilità di segni.</p>`},
   {label:'Il dipolo elettrico, e quali righe spettrali si vedono', body:R`
   <p>Picasso applica la regola al caso che si misura: le transizioni di dipolo elettrico fra stati stazionari di un atomo isolato. Le componenti dell&rsquo;operatore di dipolo $\mathbf D$ sono operatori dispari sotto inversione, $ID_jI^{-1}=-D_j$, dunque — essendo $\mathbf D$ un vettore polare —</p>
   <p><b>«<i>Regola di Selezione sulla parità: gli elementi di matrice di $D_x$, $D_y$ e $D_z$ fra stati di uguale parità sono nulli.</i>»</b></p>
   <p>Equivalentemente, e nella forma più usata: perché un elemento di matrice del dipolo fra autostati di $I$ possa essere diverso da zero <i>è necessario che gli stati abbiano parità opposte</i>, cioè $w'\times w=-1$ con $w$ l&rsquo;autovalore della parità. <b>Questa è la conseguenza misurabile di tutta la tappa</b>: una riga spettrale si vede se e solo se la simmetria non la proibisce, e guardando quali righe mancano in uno spettro si legge la parità dei livelli.</p>
   <p>Picasso aggiunge il complemento che rende la regola utile invece che solo restrittiva. Le transizioni di <i>dipolo magnetico</i> e di <i>quadrupolo elettrico</i> possono avvenire solo fra stati con la <b>stessa</b> parità: «<i>a causa del fattore $\mathbf k\cdot\mathbf r$ in più rispetto al termine di dipolo elettrico, i termini responsabili di queste transizioni sono pari per inversioni spaziali</i>». Da cui la conseguenza che Picasso dichiara: «<i>non si ha interferenza fra le transizioni di dipolo elettrico e quelle di dipolo magnetico o di quadrupolo elettrico</i>». <b>Le due classi di transizione si escludono a vicenda sugli stessi due livelli</b>: fra una coppia di stati, o è permessa una o è permessa l&rsquo;altra, mai entrambe. È il motivo per cui una transizione proibita per dipolo elettrico non è <i>vietata</i> ma soltanto molto più lenta — avviene per dipolo magnetico o quadrupolo, con probabilità ridotta del fattore $(a_0/\lambda)^{2}$, ed è l&rsquo;origine delle righe spettrali dette «proibite» che si vedono nelle nebulose, dove la bassa densità dà il tempo di aspettare.</p>
   <p>Si noti il contrasto con il teorema sul dipolo permanente. <i>Quello</i> riguardava un elemento di matrice <b>diagonale</b>, $\langle\Psi|\mathbf d|\Psi\rangle$, e lo annullava per stati di parità definita; <i>questo</i> riguarda gli elementi <b>fuori diagonale</b>, e li annulla fra stati di <i>uguale</i> parità. Sono la stessa regola — un operatore dispari connette solo parità opposte — e il caso diagonale è quello in cui le due parità sono necessariamente uguali perché lo stato è lo stesso.</p>`}
  ]},
  {t:'reveal', title:'La violazione: il 1956, e che cosa resta del teorema', tag:'esempio', steps:[
   {label:'Il cobalto 60, e l’immagine allo specchio', body:R`
   <p>Tutto quanto precede è condizionato all&rsquo;ipotesi $\Pi H\Pi^{-1}=H$. Ballentine la enuncia nel modo più generale possibile prima di demolirla: «<i>If the parity operator $\Pi$ commutes with the Hamiltonian $H$, then parity eigenvalue $\pm1$ is a conserved quantity. In that case an even parity state can never acquire an odd parity component, and an odd parity state can never acquire an even parity component. This will be true regardless of the complexity of $H$, provided only that $\Pi H=H\Pi$.</i>»</p>
   <p>Per molto tempo si è creduto che l&rsquo;invarianza per inversione spaziale fosse una legge fondamentale. «<i>This is equivalent to saying that if a process is possible, its mirror image is also possible. In rather loose language, one could say that nature does not distinguish between left-handedness and right-handedness.</i>» Nel 1956 un esperimento ha mostrato che la natura la distingue.</p>
   <p>Il nucleo radioattivo $^{60}$Co decade $\beta$: un neutrone dentro il nucleo si trasforma in un protone più un elettrone più un neutrino, e di questi solo l&rsquo;elettrone è facilmente rivelabile. I nuclei hanno spin e momento magnetico non nulli, quindi a bassa temperatura si possono <b>allineare</b> con un campo magnetico. Si è trovato che gli elettroni vengono emessi preferenzialmente nell&rsquo;emisfero <i>opposto</i> alla direzione dello spin nucleare.</p>
   <p>Ora l&rsquo;argomento, e usa esattamente la distinzione fra vettori polari e assiali stabilita in apertura di tappa. L&rsquo;operazione di inversione spaziale <b>rovescia l&rsquo;impulso dell&rsquo;elettrone</b>, che è un vettore polare, <b>ma non cambia la direzione dello spin nucleare</b>, che è un vettore assiale. Quindi il processo invertito è un processo in cui gli elettroni escono preferenzialmente <i>nello stesso</i> emisfero dello spin — cioè un processo diverso da quello osservato. <b>Se la parità fosse conservata i due processi dovrebbero avere la stessa probabilità, e invece uno avviene e l&rsquo;altro no.</b></p>
   <p>Si osservi che l&rsquo;osservabile che rivela la violazione è precisamente uno <i>pseudoscalare</i>: il prodotto scalare fra lo spin nucleare (assiale) e l&rsquo;impulso dell&rsquo;elettrone (polare). Per le regole di selezione di Landau un pseudoscalare ha elementi di matrice non nulli solo fra stati di parità opposta; il suo valor medio in uno stato di parità definita sarebbe zero. <b>Un valor medio non nullo di uno pseudoscalare è la firma sperimentale della violazione della parità</b>, e questa è la ragione per cui l&rsquo;esperimento è stato progettato così e non altrimenti.</p>
   <p>Landau, scrivendo in un contesto non relativistico, mette la cosa in una nota a piè di pagina e vale riportarla perché delimita il regime di validità di tutto il resto: «<i>A scanso di equivoci ricordiamo che si tratta della teoria non relativistica. In natura esistono interazioni (che riguardano il campo della teoria relativistica) che violano la conservazione della parità.</i>» <b>Il regime è quello</b>: la parità è conservata dalle interazioni elettromagnetiche e forti, violata dall&rsquo;interazione debole, ed è l&rsquo;unica fra le simmetrie trattate in questo movimento di cui si conosca una violazione. Le traslazioni, le rotazioni e i boost — le simmetrie continue che hanno dato impulso, momento angolare ed energia — non sono mai state viste violate.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`La dimostrazione che $\Pi$ è lineare usa il commutatore canonico. Ma il commutatore canonico è stato ricavato, nella tappa 04, dalla simmetria di <i>traslazione</i>. Che cosa c&rsquo;entrano le traslazioni con l&rsquo;inversione degli assi?`,
    a:R`Non c&rsquo;entrano come trasformazioni, e c&rsquo;entrano come <i>vincolo algebrico</i>. L&rsquo;argomento non dice «l&rsquo;inversione è legata alle traslazioni»: dice che gli operatori $\hat q$ e $\hat p$ soddisfano una certa relazione — stabilita per altre ragioni, geometriche, nella tappa 04 — e che <b>una volta fissata quella relazione non si è più liberi di scegliere la natura degli operatori che la rispettano</b>. L&rsquo;inversione agisce su $\hat q$ e $\hat p$ cambiandone il segno a entrambi, e due segni meno in un commutatore si cancellano: dunque il membro di sinistra torna sé stesso, e perché l&rsquo;uguaglianza regga deve tornare sé stesso anche il membro di destra, che è $i\hbar$. Un operatore antilineare lo manderebbe in $-i\hbar$, e la relazione sarebbe violata — cioè la trasformazione non sarebbe una simmetria del formalismo. <i>È lo stesso tipo di argomento con cui, nella tappa 05, il carattere di 3-vettore eliminava un termine da $\mathbf G$</i>: non si calcola niente, si osserva che una struttura già stabilita non lascia spazio ad alcune possibilità. E si noti il controcanto: per l&rsquo;<b>inversione temporale</b> lo stesso conto dà il risultato opposto, perché quella trasformazione cambia il segno di $\hat p$ ma <i>non</i> di $\hat q$ — un solo segno meno, il commutatore cambia segno, e l&rsquo;operatore deve essere antilineare. È la ragione per cui la degenerazione di Kramers della tappa 08 esiste e una «degenerazione di parità» non esiste.`},
   {q:R`Se la parità è violata dall&rsquo;interazione debole, perché continuare a usarla per classificare gli stati atomici e per ricavare le regole di selezione?`,
    a:R`Perché la violazione è <i>piccolissima</i> alle energie atomiche, e la risposta precisa richiede di dire in che senso. L&rsquo;interazione debole fra l&rsquo;elettrone e il nucleo esiste in un atomo, ed è a corto raggio e di intensità molti ordini di grandezza inferiore a quella coulombiana. Il suo effetto non è di rendere la parità un numero quantico approssimato: è di mescolare agli autostati di parità definita <b>contributi minuscoli di parità opposta</b>, con ampiezze dell&rsquo;ordine di $10^{-11}$ per gli atomi leggeri. La conseguenza osservabile è che le transizioni «proibite dalla parità» non hanno probabilità esattamente nulla, ma ridotta di quell&rsquo;ampiezza al quadrato — e misurarle è un intero programma di fisica atomica di precisione, non un&rsquo;osservazione di routine. Quindi: <b>per fare spettroscopia la parità è conservata; per misurare l&rsquo;interazione debole in un atomo, la parità è esattamente lo strumento</b>, perché il fondo che la simmetria azzera rende visibile un effetto altrimenti sommerso. Vale notare la struttura logica, che è generale: <i>una simmetria approssimata è più utile di una simmetria assente</i>, perché separa i processi in «permessi» e «soppressi di un fattore noto», e il fattore noto è una misura di ciò che la rompe.`},
   {q:R`La tappa 07 diceva che la quantità conservata è il <i>generatore</i> della simmetria. La parità non ha generatore. Che cosa si conserva, esattamente, e come si misura?`,
    a:R`Si conserva l&rsquo;autovalore di $\Pi$ stesso, e questo è il punto strutturale annunciato dalla frase di Landau in apertura. Per una simmetria continua l&rsquo;operatore che la realizza è <i>unitario e non autoaggiunto</i> — $e^{-ia\hat p/\hbar}$ non è un&rsquo;osservabile — e l&rsquo;osservabile va estratta prendendo il generatore. Per la parità la situazione è degenere nel modo fortunato: la scelta di fase $\Pi^{2}=1$ rende $\Pi$ <b>contemporaneamente unitario e autoaggiunto</b>, quindi $\Pi$ è <i>già</i> un&rsquo;osservabile, con due soli autovalori $\pm1$. Non serve estrarre niente. Quanto alla misura, non esiste un «paritometro»: si misura indirettamente, e il modo è quello della tappa — si guarda <i>quali transizioni avvengono</i>. Due livelli fra cui c&rsquo;è una riga di dipolo elettrico hanno parità opposte; due livelli fra cui la riga manca e c&rsquo;è invece una transizione di quadrupolo hanno parità uguali. <b>La conservazione si verifica come assenza</b>, e questo è il senso in cui le regole di selezione sono il contenuto empirico di questa tappa e non un corollario tecnico: sono l&rsquo;unico accesso sperimentale al numero quantico di parità.`}
  ]}
]},

/* ---------------- 10 · IL BILANCIO, E I PROBLEMI DEL CAPITOLO ---------------- */
{ num:'10', title:'Il bilancio, e i problemi del capitolo svolti', meta:'che cosa è diventato teorema e a quale prezzo · sette problemi di Ballentine risolti · la dilatazione e l ordinamento simmetrico · dove tutto questo riappare in fisica',
  blocchi:[
  {t:'prosa', title:'Il bilancio: che cosa è diventato teorema, e che cosa si è pagato', tag:'architettura', html:R`
  <p>Un corso costruito sulle simmetrie non è un corso standard con un capitolo in più: è un corso in cui cose diverse sono assiomi. Vale fare l&rsquo;inventario esatto, perché è l&rsquo;unico modo di sapere che cosa si può usare come dato e che cosa va dimostrato in sede d&rsquo;esame.</p>
  <p><b>Ciò che in un corso standard è postulato e qui è dimostrato:</b> il commutatore canonico $[\hat q_\alpha,\hat p_\beta]=i\hbar\delta_{\alpha\beta}$; la commutatività degli impulsi fra loro; la forma differenziale $\hat p=-i\hbar\,d/dx$; la forma $\mathbf J=\mathbf Q\times\mathbf P$ del momento angolare orbitale e l&rsquo;algebra $[J_\alpha,J_\beta]=i\hbar\varepsilon_{\alpha\beta\gamma}J_\gamma$; l&rsquo;algebra dello spin, che non è un&rsquo;ipotesi aggiuntiva ma l&rsquo;unica possibile per un contributo interno al momento angolare; la forma $H=\mathbf P^{2}/2M+E_0$ dell&rsquo;energia libera; l&rsquo;equazione di Schrödinger, che è l&rsquo;affermazione che $H$ genera le traslazioni temporali; e il fatto che le <i>uniche</i> interazioni compatibili con l&rsquo;invarianza di Galilei siano un potenziale scalare e un potenziale vettore.</p>
  <p><b>Ciò che resta assunto:</b> che la posizione sia un&rsquo;osservabile con spettro continuo; che lo spazio sia un continuo; che le tre componenti della posizione commutino, cioè che si possa localizzare una particella arbitrariamente bene; che le trasformazioni di simmetria conservino i moduli dei prodotti scalari — che è il teorema di Wigner, cioè che la probabilità sia l&rsquo;oggetto fisico; e che la rappresentazione del gruppo sia unitaria a meno di una fase. Cinque ipotesi, e la prima è l&rsquo;unica che nomina una grandezza fisica.</p>
  <p><b>Ciò che non si deduce e si misura:</b> il valore di $\hbar$, e nient&rsquo;altro. Il numero $M$ non è determinato dall&rsquo;algebra — è la carica centrale irremovibile della tappa 05 — ma non è un&rsquo;ipotesi: è un&rsquo;etichetta della rappresentazione, e misurare una massa significa stabilire in quale rappresentazione si sta lavorando.</p>
  <p><b>Il prezzo.</b> Questa strada non dà una regola generale per associare un operatore a una funzione classica arbitraria, e il §3.6 ha mostrato che una tale regola non può esistere: i teoremi di impossibilità lo dimostrano. Quindi di fronte a una grandezza classica esotica non c&rsquo;è ricetta, e si deve ragionare caso per caso — come si fa nel primo problema di questa tappa, dove l&rsquo;ordinamento del generatore delle dilatazioni va deciso con un argomento di autoaggiuntezza e non con una sostituzione. <i>È un prezzo onesto</i>: la strada standard offre una ricetta che non funziona, questa offre una forma unica per i casi che si incontrano.</p>
  <p><b>Il limite di validità.</b> Tutto quanto precede vale per il gruppo di <i>Galilei</i>, cioè nel regime non relativistico. Due righe della tabella (3.35) sono false in relatività: $[G_\alpha,G_\beta]=0$ — nel gruppo di Lorentz il commutatore di due boost è una rotazione, ed è l&rsquo;origine della precessione di Thomas — e $[G_\alpha,P_\beta]=i\delta_{\alpha\beta}MI$, perché nel gruppo di Poincaré la massa non è una carica centrale ma un invariante di Casimir, $P^{\mu}P_\mu$. Ed è il motivo per cui in relatività esistono particelle di massa nulla e in meccanica quantistica galileiana no.</p>`},
  {t:'esercizio', title:'Problema 3.1 — il generatore delle dilatazioni', src:'Ballentine, problema 3.1 (pag. stampata 94) · l&rsquo;unico problema del capitolo che richiede di SCEGLIERE un ordinamento',
   testo:R`<p>«<i>Space is invariant under the scale transformation $\mathbf x\to\mathbf x'=e^{c}\mathbf x$, where $c$ is a parameter. The corresponding unitary operator may be written as $e^{-icD}$, where $D$ is the dilation generator. Determine the commutator $[D,P]$ between the generators of dilation and space displacements.</i>» Ballentine aggiunge la nota che spiega perché questa simmetria non compare nella tabella: «<i>Not all of the laws of physics are invariant under dilation, so this symmetry is less common than displacements or rotations.</i>»</p>`,
   steps:[
   {label:'Primo passo: qual è l’operatore D, e perché non è xp', body:R`
   <p>Si lavori in una dimensione, con $\hbar=1$ come in tutto il capitolo 3. La dilatazione agisce sulle coordinate come $x\to e^{c}x$, e al primo ordine in $c$ come $x\to x+cx$: lo spostamento è <i>proporzionale alla posizione</i>, invece di essere costante come nella traslazione. L&rsquo;analogo classico del generatore si ottiene cercando la funzione $g$ il cui flusso dà $\delta x=\varepsilon x$: dalla formula del flusso della tappa 01, $\delta x=\varepsilon\,\partial g/\partial p$, serve $\partial g/\partial p=x$, cioè $g=xp$.</p>
   <p><b>Ma $\hat x\hat p$ non è autoaggiunto</b>, e questo è il punto del problema. Il suo aggiunto è $\hat p^\dagger\hat x^\dagger=\hat p\hat x$, che è un operatore diverso perché i due non commutano. Un generatore di simmetria <i>deve</i> essere autoaggiunto — è il requisito della tappa 03, e viene dall&rsquo;unitarietà — quindi la scelta $D=\hat x\hat p$ è esclusa. La combinazione autoaggiunta è l&rsquo;<b>ordinamento simmetrico</b>:</p>
   $$D=\tfrac12(\hat x\hat p+\hat p\hat x),$$
   <p>la cui aggiunta è sé stessa. Si noti che <i>questo è esattamente il punto di ambiguità</i> che il §3.6 segnalava discutendo i teoremi di impossibilità: la funzione classica $xp$ ammette tre candidati quantistici — $\hat x\hat p$, $\hat p\hat x$, e la loro semisomma — e nessuna regola di sostituzione dice quale prendere. <b>Ciò che lo decide non è una ricetta ma la richiesta fisica</b> che il generatore sia un&rsquo;osservabile.</p>
   <p>In rappresentazione di Schrödinger, con $\hat p=-i\,d/dx$, l&rsquo;operatore agisce come</p>
   $$D\psi=-\frac{i}{2}\Big(x\frac{d\psi}{dx}+\frac{d}{dx}(x\psi)\Big)=-ix\frac{d\psi}{dx}-\frac{i}{2}\psi,$$
   <p>e la seconda forma mostra la struttura: <b>$D=\hat x\hat p-\tfrac{i}{2}$</b>, cioè l&rsquo;ordinamento simmetrico differisce dalla scelta ingenua per una costante immaginaria, che è precisamente ciò che ripara l&rsquo;autoaggiuntezza.</p>`},
   {label:'Secondo passo: il commutatore, calcolato in due modi', body:R`
   <p><b>Via algebrica.</b> Usando $D=\hat x\hat p-\tfrac{i}{2}$ e il fatto che una costante commuta con tutto:</p>
   $$[D,\hat p]=[\hat x\hat p,\hat p]=\hat x[\hat p,\hat p]+[\hat x,\hat p]\hat p=0+i\hat p=i\hat p.$$
   <p>Si è usata l&rsquo;identità $[AB,C]=A[B,C]+[A,C]B$, che è il problema 3.5 di questa stessa lista. Il risultato, nelle convenzioni di Ballentine e con $\hbar$ ripristinato, è</p>
   $$[D,P]=iP.$$
   <p><b>Via differenziale, per controllo.</b> Si applica il commutatore a una funzione d&rsquo;onda arbitraria, con $D$ nella forma simmetrica e $P=-i\,d/dx$:</p>
   $$[D,P]\psi=\frac{d\psi}{dx},$$
   <p>e il membro di destra è $i\hat p\psi$, dato che $i\hat p=i(-i\,d/dx)=d/dx$. Le due vie concordano.</p>
   <p><b>Che cosa dice il risultato.</b> Il commutatore è proporzionale a $P$ stesso, non a un terzo generatore e non all&rsquo;identità: l&rsquo;insieme $\{D,P\}$ chiude un&rsquo;algebra a due elementi. Questo significa che <i>l&rsquo;impulso non è invariante sotto dilatazione</i> — dilatare lo spazio riscala gli impulsi, come deve, perché un impulso ha dimensioni di un inverso di lunghezza — e la relazione $[D,P]=iP$ è la forma infinitesima di quel riscalamento. Si noti la differenza strutturale con tutti i commutatori della tappa 05: lì il risultato era un <i>altro</i> generatore (le rotazioni che si chiudono fra loro) oppure l&rsquo;identità (la massa). Qui il risultato è <i>lo stesso operatore</i> di partenza, ed è la firma algebrica di una trasformazione di <b>scala</b>: $P$ è un autovettore dell&rsquo;azione di $D$.</p>`}
   ],
   nota:R`<p><b>Perché questa simmetria non sta nella tabella dei dieci.</b> Perché quasi nessuna legge fisica è invariante per dilatazione: appena nell&rsquo;hamiltoniana c&rsquo;è una massa o una costante di accoppiamento, c&rsquo;è una scala, e cambiare scala cambia la fisica. L&rsquo;invarianza di scala esiste in casi particolari — il potenziale coulombiano puro ha una proprietà di scala che genera il teorema del viriale, e la riflessione di Bragg sul reticolo ne ha un&rsquo;altra — ed è centrale nei fenomeni critici, dove la lunghezza di correlazione diverge e il sistema smette di avere una scala propria. In quel contesto l&rsquo;operatore $D$ di questo problema è il generatore del gruppo di rinormalizzazione.</p>`},
  {t:'esercizio', title:'Problemi 3.3 e 3.5 — due identità che si usano continuamente', src:'Ballentine, problemi 3.3 e 3.5 (pag. stampate 94) · servono in ogni conto con esponenziali di operatori',
   testo:R`<p><b>3.3.</b> «<i>Prove the following identity, in which $A$ and $B$ are operators, and $x$ is a parameter:</i> $e^{xA}Be^{-xA}=B+[A,B]x+[A,[A,B]]\tfrac{x^{2}}{2}+[A,[A,[A,B]]]\tfrac{x^{3}}{6}+\cdots$»</p>
   <p><b>3.5.</b> «<i>Verify the identity</i> $[AB,C]=A[B,C]+[A,C]B$.»</p>`,
   steps:[
   {label:'3.5, e perché è la regola di Leibniz dei commutatori', body:R`
   <p>Si parte dalla definizione e si inserisce un termine che si cancella — la mossa standard, e vale conoscerla perché serve in ogni manipolazione di commutatori:</p>
   $$[AB,C]=ABC-CAB=ABC-ACB+ACB-CAB=A(BC-CB)+(AC-CA)B,$$
   <p>cioè $A[B,C]+[A,C]B$. <b>È la regola di Leibniz, con l&rsquo;avvertenza che l&rsquo;ordine dei fattori va rispettato</b>: il primo termine ha $A$ a sinistra, il secondo ha $B$ a destra, e scambiarli darebbe un risultato diverso. È l&rsquo;identità che si usa per calcolare il commutatore di un prodotto senza sviluppare tutto, e nella tappa 06 è l&rsquo;argomento con cui si è ottenuto $[\mathbf P^{2},\hat x]$.</p>
   <p>Un controllo su una realizzazione concreta, che serve anche a vedere che l&rsquo;identità non è vacua. Si prendano $A=\hat x$ (moltiplicazione per $x$), $B=d/dx$, $C=\hat x^{2}$. Il membro di sinistra, applicato a una funzione arbitraria, dà</p>
   $$[AB,C]\psi=2x^{2}\psi,$$
   <p>e il membro di destra, calcolato pezzo per pezzo con $[A,C]=0$ perché due moltiplicazioni commutano,</p>
   $$A[B,C]\psi+[A,C]B\psi=2x^{2}\psi.$$
   <p>Coincidono. Si osservi che il secondo addendo è nullo <i>in questo caso</i>: è il motivo per cui il controllo va fatto, perché una verifica in cui tutti i termini sopravvivono è più informativa — ma qui l&rsquo;annullarsi di $[A,C]$ è esso stesso il contenuto, cioè che due operatori di moltiplicazione commutano sempre.</p>`},
   {label:'3.3, e la sua versione calcolabile', body:R`
   <p>La dimostrazione dell&rsquo;identità 3.3 è per derivazioni successive. Si definisca $F(x)=e^{xA}Be^{-xA}$ e si derivi:</p>
   $$\frac{dF}{dx}=e^{xA}AB e^{-xA}-e^{xA}BAe^{-xA}=e^{xA}[A,B]e^{-xA},$$
   <p>cioè la derivata di $F$ ha la stessa forma di $F$ con $B$ sostituito da $[A,B]$. Iterando, la derivata $n$-esima è $e^{xA}[A,[A,\dots[A,B]\dots]]e^{-xA}$ con $n$ commutatori annidati, e valutata in $x=0$ dà il commutatore annidato nudo. La serie di Taylor di $F$ attorno a $x=0$ è dunque esattamente quella dell&rsquo;enunciato. <b>Il meccanismo è che la coniugazione con un esponenziale è un&rsquo;esponenziale di commutatori</b>, e questa è la ragione strutturale per cui tutte le trasformazioni di osservabili di questo movimento — $A\to UAU^{-1}$ della tappa 02, $\mathbf Q'=e^{-i\mathbf a\cdot\mathbf P}\mathbf Qe^{i\mathbf a\cdot\mathbf P}$ della tappa 04, $\Pi\mathbf Q\Pi^{-1}$ della tappa 09 — si sviluppano in commutatori.</p>
   <p>Il caso particolare che si calcola fino in fondo è quello in cui $[A,B]$ è un <i>numero</i>, perché allora la serie si tronca da sé dopo il secondo termine. Si prendano $A=c\hat x$ e $B=d/dx$: il loro commutatore, applicato a una funzione, dà $c\,x\psi'-c(x\psi)'=-c\psi$, dunque $[A,B]=-c$, un numero, e tutti i commutatori annidati successivi sono nulli. L&rsquo;identità prevede allora $e^{cx}\,\tfrac{d}{dx}\,e^{-cx}=d/dx-c$, e applicata a una funzione:</p>
   $$e^{cx}\frac{d}{dx}\big(e^{-cx}\psi\big)=\frac{d\psi}{dx}-c\,\psi.$$
   <p>Che è vero, e si verifica derivando il prodotto. <b>Questa è la forma in cui l&rsquo;identità 3.3 si incontra davvero</b>: ogni volta che si coniuga una derivata con un&rsquo;esponenziale si ottiene la derivata più un termine di spostamento, ed è il meccanismo delle trasformazioni di gauge — $\mathbf P\to\mathbf P-\mathbf A$ è precisamente questo, con una fase al posto dell&rsquo;esponenziale reale.</p>`}
   ]},
  {t:'esercizio', title:'Problema 3.4 — Baker-Campbell-Hausdorff nel caso facile, verificato su matrici', src:'Ballentine, problema 3.4 (pag. stampata 95) · il caso in cui l&rsquo;esponenziale di una somma si fattorizza',
   testo:R`<p>«<i>Prove that $e^{A+B}=e^{A}e^{B}e^{-\frac12[A,B]}$, provided the operators $A$ and $B$ satisfy $[A,[A,B]]=[B,[A,B]]=0$.</i>»</p>
   <p>Le due ipotesi dicono che $[A,B]$ commuta sia con $A$ sia con $B$ — tecnicamente, che è un elemento <i>centrale</i> dell&rsquo;algebra generata dai due. Il caso canonico è $A\propto\hat x$ e $B\propto\hat p$, il cui commutatore è un numero: e infatti il risultato è ciò che serve per manipolare gli stati coerenti e le trasformazioni di Weyl.</p>`,
   steps:[
   {label:'L’idea della dimostrazione, e la verifica su un caso dove il conto si chiude', body:R`
   <p>La dimostrazione segue lo stesso schema del problema 3.3: si definisce $F(t)=e^{tA}e^{tB}$, si deriva, e si usa il problema 3.3 per riordinare i fattori. Si ottiene $dF/dt=(A+B+t[A,B])F$, e siccome $[A,B]$ commuta con tutto l&rsquo;equazione si integra come se fosse scalare, dando $F(t)=e^{t(A+B)+\frac{t^{2}}{2}[A,B]}$. Ponendo $t=1$ e portando il fattore centrale a destra si ha l&rsquo;enunciato. <b>Il punto delicato è l&rsquo;integrazione</b>: è lecita <i>solo</i> perché il coefficiente $A+B+t[A,B]$ commuta con sé stesso a tempi diversi, e le due ipotesi sono esattamente ciò che lo garantisce.</p>
   <p>Un modo di controllare l&rsquo;identità senza fidarsi dell&rsquo;integrazione formale è prendere due operatori <b>nilpotenti</b> che soddisfino le ipotesi, perché allora tutti gli esponenziali sono polinomi e il confronto è finito. Si prendano le matrici $3\times3$</p>
   $$A=\begin{pmatrix}0&1&0\\0&0&0\\0&0&0\end{pmatrix},\qquad B=\begin{pmatrix}0&0&0\\0&0&1\\0&0&0\end{pmatrix},$$
   <p>per cui $A^{2}=B^{2}=0$ e il commutatore è $[A,B]=C$ con $C$ la matrice che ha un solo uno in posizione $(1,3)$. Si verifica direttamente che $AC=CA=BC=CB=0$, dunque entrambe le ipotesi sono soddisfatte. Allora $A+B$ è nilpotente di ordine tre, $e^{A+B}=\mathbb 1+(A+B)+\tfrac12(A+B)^{2}$, e</p>
   $$\mathbb 1+(A+B)+\tfrac12(A+B)^{2}=(\mathbb 1+A)(\mathbb 1+B)\big(\mathbb 1-\tfrac12C\big),$$
   <p>che è l&rsquo;enunciato del problema con gli esponenziali scritti come polinomi finiti. <b>L&rsquo;uguaglianza vale elemento per elemento</b>, e il termine $-\tfrac12C$ è quello che ripara la differenza fra $(\mathbb 1+A)(\mathbb 1+B)$, che contiene $AB=C$ per intero, e $\tfrac12(A+B)^{2}$, che contiene $\tfrac12(AB+BA)=\tfrac12C$: il fattore correttivo vale esattamente metà del commutatore, che è ciò che l&rsquo;enunciato afferma.</p>
   <p><i>Perché questa verifica non è un caso particolare inutile</i>: le tre matrici $A$, $B$, $C$ con $[A,B]=C$ e $C$ centrale generano l&rsquo;<b>algebra di Heisenberg</b>, cioè la stessa struttura di $\hat x$, $\hat p$ e $i\hbar$. Il conto su matrici $3\times3$ è una rappresentazione fedele di quella struttura, e il risultato vale per la stessa ragione.</p>`}
   ]},
  {t:'esercizio', title:'Problemi 3.2, 3.6 e 3.7 — chiudere la tabella e completare il boost', src:'Ballentine, problemi 3.2, 3.6 e 3.7 (pag. stampate 94-95) · tre verifiche che la tappa 05 ha usato senza svolgerle tutte',
   testo:R`<p><b>3.2.</b> «<i>Use the Jacobi identity to show that there are no multiples of the identity to be added to the commutators $[P_\alpha,P_\beta]$, $[G_\alpha,G_\beta]$, and $[J_\alpha,H]$.</i>»</p>
   <p><b>3.6.</b> «<i>Verify that the operator $\mathbf Q\times\mathbf P$ satisfies Eqs. (3.35c,d,e) when it is substituted for $\mathbf J$.</i>»</p>
   <p><b>3.7.</b> «<i>The unitary operator $U(\mathbf v)=\exp(i\mathbf v\cdot\mathbf G)$ describes the instantaneous ($t=0$) effect of a transformation to a frame of reference moving at the velocity $\mathbf v$. Find an operator $\mathbf G_t$ such that $U(\mathbf v,t)=\exp(i\mathbf v\cdot\mathbf G_t)$ will yield the full Galilei transformation</i> $U\mathbf VU^{-1}=\mathbf V-\mathbf vI$, $U\mathbf QU^{-1}=\mathbf Q-\mathbf vtI$. <i>Verify that $\mathbf G_t$ satisfies the same commutation relation with $\mathbf P$, $\mathbf J$, and $H$ as does $\mathbf G$.</i>»</p>`,
   steps:[
   {label:'3.2 e 3.6, in forma breve', body:R`
   <p><b>3.2</b> è il metodo svolto nella tappa 05, applicato tre volte. Per $[J_\alpha,H]$ si usa Jacobi con $J_2$, $P_3$, $H$ e si ottiene $[P_\alpha,H]=0$; con $J_1$, $J_2$, $H$ si ottiene analogamente $[J_\alpha,H]=0$. Per $[P_\alpha,P_\beta]$ e $[G_\alpha,G_\beta]$ con $\alpha=\beta$ l&rsquo;antisimmetria del commutatore basta da sola — un operatore commuta con sé stesso, quindi non c&rsquo;è spazio per un multiplo dell&rsquo;identità; per $\alpha\neq\beta$ si usa Jacobi scegliendo come terzo generatore un $J$, che per le relazioni $(3.35\text{d,e})$ trasforma $P$ e $G$ come vettori e quindi vincola i coefficienti. <b>Il meccanismo è sempre lo stesso</b>, ed è quello che la tappa 05 ha isolato: un multiplo dell&rsquo;identità non ha effetto <i>dentro</i> un commutatore, quindi un&rsquo;identità in cui compare solo in quella posizione vincola i generatori senza richiedere di conoscerlo.</p>
   <p><b>3.6</b> si verifica componente per componente usando il solo commutatore canonico. In rappresentazione di Schrödinger, con $J_3=-i(x\partial_y-y\partial_x)$ e $P_1=-i\partial_x$, applicando il commutatore a una funzione arbitraria si ottiene</p>
   $$[J_3,P_1]\psi=iP_2\psi,$$
   <p>che è la $(3.35\text{d})$ con $\varepsilon_{312}=1$. La $(3.35\text{c})$ è l&rsquo;identità $[J_1,J_2]=iJ_3$ già verificata nella tappa 06, e la $(3.35\text{e})$ si ottiene con lo stesso conto scambiando $P$ con $G=M\mathbf Q$ — cioè, a meno del fattore $M$, calcolando $[J_\alpha,Q_\beta]$, che la tappa 06 ha ricavato geometricamente e che si ricontrolla qui in due righe.</p>`},
   {label:'3.7: il boost a tempo t, e la verifica che non rompe niente', body:R`
   <p>Questo è il problema che completa la tappa 05, dove il boost era stato trattato soltanto nel suo effetto <i>istantaneo</i>. Si cerca l&rsquo;operatore $\mathbf G_t$ tale che l&rsquo;esponenziale produca anche lo spostamento di posizione $-\mathbf vt$ che un cambio di riferimento comporta dopo un tempo $t$.</p>
   <p>La risposta è</p>
   $$\mathbf G_t=\mathbf G-t\mathbf P,$$
   <p>e la si trova per costruzione invece che per tentativi. Si vuole $[G_{t\alpha},Q_\beta]$ diverso da zero — perché è quel commutatore a produrre lo spostamento di $\mathbf Q$ — e si sa che $[G_\alpha,Q_\beta]=0$ dalla tappa 06, mentre $[P_\alpha,Q_\beta]=-i\delta_{\alpha\beta}$. Aggiungere a $\mathbf G$ un multiplo di $\mathbf P$ è dunque l&rsquo;unico modo di ottenere un commutatore non nullo con $\mathbf Q$ senza toccare quello con $\mathbf V$. Con il coefficiente $-t$:</p>
   $$[G_{t\alpha},Q_\beta]=-t[P_\alpha,Q_\beta]=it\delta_{\alpha\beta},$$
   <p>e sviluppando al primo ordine la coniugazione, $UQ_\beta U^{-1}=Q_\beta+iv_\alpha[G_{t\alpha},Q_\beta]=Q_\beta-v_\beta t$, che è la trasformazione richiesta. Per la velocità, siccome $\mathbf V=\mathbf P/M$ e gli impulsi commutano fra loro, il termine aggiunto non contribuisce: $[G_{t\alpha},V_\beta]=[G_\alpha,V_\beta]=i\delta_{\alpha\beta}$, e si riottiene $U\mathbf VU^{-1}=\mathbf V-\mathbf vI$ come nel caso istantaneo.</p>
   <p>Resta la verifica che Ballentine chiede, e <b>è la parte che insegna qualcosa</b>: che $\mathbf G_t$ soddisfi le stesse relazioni di commutazione di $\mathbf G$ con $\mathbf P$, $\mathbf J$ e $H$. Tre righe, una per relazione:</p>
   <p>— con l&rsquo;impulso: $[G_{t\alpha},P_\beta]=[G_\alpha,P_\beta]-t[P_\alpha,P_\beta]=i\delta_{\alpha\beta}MI$, perché gli impulsi commutano fra loro. <i>La massa non cambia</i>, e non potrebbe: è l&rsquo;etichetta della rappresentazione.</p>
   <p>— con le rotazioni: $[J_\alpha,G_{t\beta}]=i\varepsilon_{\alpha\beta\gamma}G_\gamma-t\,i\varepsilon_{\alpha\beta\gamma}P_\gamma=i\varepsilon_{\alpha\beta\gamma}G_{t\gamma}$, perché $\mathbf G$ e $\mathbf P$ sono <i>entrambi</i> 3-vettori e quindi la loro combinazione lineare lo è. È il carattere di 3-vettore della tappa 05 che fa il lavoro.</p>
   <p>— con il tempo: $[G_{t\alpha},H]=[G_\alpha,H]-t[P_\alpha,H]=iP_\alpha$, perché $[P_\alpha,H]=0$.</p>
   <p><b>Tutte e tre reggono</b>, e il motivo profondo è che $\mathbf G_t$ e $\mathbf G$ differiscono per un termine proporzionale a un generatore che commuta con tutto ciò che conta. <i>Si noti però la cosa strana</i>: $\mathbf G_t$ dipende esplicitamente da $t$, cioè non è un operatore fisso ma una famiglia. Questo è il modo algebrico in cui si manifesta il fatto, già incontrato nella tappa 05, che un boost galileiano <b>non è una traslazione</b>: produce uno spostamento che cresce col tempo, e per descriverlo a un tempo assegnato il generatore deve sapere quale tempo è. La relazione $[G_\alpha,H]=iP_\alpha$ e la dipendenza da $t$ di $\mathbf G_t$ sono la stessa informazione, scritta in due modi.</p>`}
   ],
   nota:R`<p><b>I problemi che questo movimento non svolge, e perché.</b> Il 3.8 (operatore posizione nel quadro di Heisenberg per una particella libera), il 3.9 (uno stato puro non può evolvere in uno non puro), il 3.10 (il quadro di interazione) e il 3.12 (fattorizzazione dell&rsquo;operatore di evoluzione per un sistema senza interazione) riguardano la <i>dinamica</i>, non la cinematica delle simmetrie: usano l&rsquo;operatore di evoluzione come oggetto di studio, mentre qui serve soltanto come definizione del generatore temporale. Il 3.11 sulla traccia del prodotto di Kronecker è svolto nella tappa 06, dove serve.</p>`},
  {t:'prosa', title:'Il senso, e le rotte: dove questo riappare in fisica', tag:'architettura', html:R`
  <p>La struttura costruita in questo movimento — una simmetria, un generatore autoaggiunto, una quantità conservata, una degenerazione, una regola di selezione — non è un capitolo di meccanica quantistica fra altri: è il modo in cui la fisica teorica del Novecento è organizzata. Vale indicare dove si ritrova, perché sono rotte e non curiosità.</p>
  <p><b>La classificazione delle particelle.</b> Il passo che qui si è fatto con il gruppo di Galilei — dedurre gli operatori dalle rappresentazioni unitarie del gruppo di simmetria dello spazio-tempo — Wigner lo ha fatto nel 1939 con il gruppo di Poincaré, e il risultato è che <b>una particella elementare È una rappresentazione irriducibile unitaria del gruppo di Poincaré</b>, etichettata da due invarianti: la massa e lo spin. La massa che qui è apparsa come carica centrale irremovibile diventa là un invariante di Casimir, e lo spin — che qui è entrato come «grado di libertà interno» nel caso (ii) — là è l&rsquo;altra etichetta, sullo stesso piano. La domanda «che cos&rsquo;è una particella» ha questa risposta, e la risposta è nella lingua di questo movimento.</p>
  <p><b>Le teorie di gauge.</b> La forma $H=(\mathbf P-\mathbf A)^{2}/2M+W(\mathbf Q)$ ottenuta nella tappa 06 è l&rsquo;unica compatibile con l&rsquo;invarianza di Galilei, e la combinazione $\mathbf P-\mathbf A$ si chiama <i>derivata covariante</i>. Promuovere la fase arbitraria di un vettore di stato — quella che in questo movimento è apparsa tre volte come fastidio e due volte come risorsa — da costante globale a funzione del punto è ciò che genera l&rsquo;elettromagnetismo come teoria di gauge, e il potenziale vettore è ciò che compensa la sua variazione. <i>Il problema della fase non era un dettaglio tecnico</i>: era il seme dell&rsquo;intera struttura delle interazioni fondamentali.</p>
  <p><b>La rottura spontanea di simmetria.</b> Questo movimento ha mostrato che una simmetria dell&rsquo;hamiltoniana forza degenerazioni e vieta certi valori medi — per esempio il dipolo elettrico permanente della tappa 09. Esistono sistemi in cui l&rsquo;hamiltoniana <i>è</i> simmetrica e lo stato fondamentale <i>non lo è</i>: un magnete al di sotto della temperatura di Curie ha una magnetizzazione in una direzione, pur essendo l&rsquo;hamiltoniana isotropa. Il meccanismo che lo permette è quello che la tappa 09 ha isolato come eccezione al teorema sul dipolo: la <b>degenerazione</b> del fondamentale, che consente combinazioni a simmetria mista. È la stessa struttura, usata al rovescio.</p>
  <p><b>La teoria delle bande, e la materia condensata.</b> Il conto della tappa 08 sul reticolo — una degenerazione infinita classificata dall&rsquo;autovalore di una traslazione discreta, che diventa una banda appena l&rsquo;accoppiamento è finito — è il punto di partenza della fisica dei solidi. Che un materiale sia conduttore o isolante dipende da dove si ferma il riempimento delle bande, e le bande esistono perché il cristallo ha un gruppo di simmetria discreto.</p>
  <p><b>La spettroscopia.</b> Le regole di selezione della tappa 09 sono il modo in cui si legge uno spettro: le righe che si vedono misurano i livelli, e le righe che <i>mancano</i> misurano le simmetrie. La classificazione degli stati con gli autovalori delle costanti del moto non è un artificio di notazione — è la base dei dati sperimentali di tutta la fisica atomica e molecolare.</p>
  <p><b>E dove la simmetria si rompe davvero.</b> L&rsquo;esperimento del 1956 sul cobalto ha mostrato che la parità non è una simmetria della natura, e il seguito di quella storia — la scoperta che anche la combinazione di parità e coniugazione di carica è violata, nel 1964 — è ciò che rende possibile una domanda che senza violazione non si porrebbe: perché l&rsquo;universo contiene materia e non quantità uguali di materia e antimateria. <i>Le simmetrie dicono che cosa è possibile; le loro violazioni dicono che cosa è accaduto.</i></p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Il bilancio dice che il commutatore canonico qui è un teorema e non un postulato. Ma la derivazione della tappa 04 usa che $\hat p$ generi le traslazioni, e la tappa 06 usa il commutatore canonico per identificare $\mathbf G=M\mathbf Q$. Non è un cerchio?`,
    a:R`No, ed è utile ricostruire l&rsquo;ordine esatto perché è il punto in cui un corso costruito sulle simmetrie si distingue da uno che le aggiunge dopo. L&rsquo;ordine è: <b>(1)</b> si assume la posizione come osservabile, con $\mathbf Q|\mathbf x\rangle=\mathbf x|\mathbf x\rangle$; <b>(2)</b> si assume che il gruppo di Galilei agisca sugli stati con operatori unitari a meno di una fase — teorema di Wigner più chiusura del gruppo; <b>(3)</b> da (2) si deducono le nove relazioni fra i dieci generatori, senza nessun riferimento a $\mathbf Q$ (tappa 05); <b>(4)</b> si deduce $[Q_\alpha,P_\beta]=i\delta_{\alpha\beta}$ confrontando due espressioni per l&rsquo;osservabile traslata, usando (1) e la definizione di $\mathbf P$ come generatore (tappa 04); <b>(5)</b> si usano (3) e (4) insieme per identificare $\mathbf G$, $\mathbf J$, $H$ (tappa 06). <i>Nessun passo usa un risultato di un passo successivo.</i> Ciò che potrebbe sembrare circolare è che in (4) si chiami «impulso» il generatore delle traslazioni: ma lì non lo si chiama affatto — si chiama $\mathbf P$, e la tappa 04 dichiara esplicitamente che l&rsquo;identificazione con l&rsquo;impulso fisico arriva solo in (5), dalla catena di rapporti che introduce $\hbar$. <b>Il cerchio si eviterebbe anche senza quella cautela</b>, ma solo a patto di sapere che «impulso» è, fino al passo (5), un nome e non un&rsquo;ipotesi.`},
   {q:R`Nel problema 3.1 l&rsquo;ordinamento simmetrico è scelto perché è autoaggiunto. Ma anche $\hat x\hat p+\lambda i$ con $\lambda$ reale qualunque è autoaggiunto. Perché $\lambda=-\tfrac12$ e non un altro valore?`,
    a:R`Perché $\hat x\hat p+\lambda i$ <b>non</b> è autoaggiunto per $\lambda\neq-\tfrac12$, e il conto è di una riga. L&rsquo;aggiunto di $\hat x\hat p$ è $\hat p\hat x=\hat x\hat p-i$ con $\hbar=1$ e $[\hat x,\hat p]=i$. Quindi l&rsquo;aggiunto di $\hat x\hat p+\lambda i$ è $\hat x\hat p-i-\lambda i$, che coincide con l&rsquo;operatore di partenza solo se $\lambda=-i-\lambda i$ diviso... più direttamente: si richiede $\lambda i=-i-\lambda i$, cioè $2\lambda i=-i$, cioè $\lambda=-\tfrac12$. <i>C&rsquo;è una sola costante immaginaria che ripara l&rsquo;autoaggiuntezza</i>, ed è quella dell&rsquo;ordinamento simmetrico. Resta invece libera l&rsquo;aggiunta di una costante <b>reale</b>, $D+aI$ con $a$ reale: quella conserva l&rsquo;autoaggiuntezza, e corrisponde alla stessa libertà di fase che la tappa 05 ha usato per eliminare i multipli dell&rsquo;identità di tipo (b). Qui la si fissa a zero per convenzione, ed è innocuo perché $[D+aI,P]=[D,P]$ — <b>il commutatore, che è la risposta del problema, non dipende da quella scelta</b>. È un caso istruttivo di come distinguere una libertà vera da una apparente: la costante immaginaria è obbligata dalla fisica, quella reale è convenzione.`},
   {q:R`Il bilancio elenca cinque ipotesi residue, e dice che solo la prima nomina una grandezza fisica. Perché questo conta?`,
    a:R`Perché misura quanto il contenuto della teoria sia <i>strutturale</i> invece che empirico, e la distinzione decide che cosa si può sperare di spiegare. Le quattro ipotesi non fisiche — continuità dello spazio, localizzabilità, teorema di Wigner, unitarietà a meno di una fase — sono affermazioni su <b>come si rappresenta uno stato</b> e su <b>che tipo di oggetto è una probabilità</b>: non parlano di particelle, forze o costanti. L&rsquo;unica ipotesi con contenuto fisico è che la posizione sia un&rsquo;osservabile con spettro continuo. Da questo segue che tutto il resto — l&rsquo;impulso, il momento angolare, l&rsquo;energia cinetica, la forma delle interazioni ammesse — <i>non</i> è contenuto empirico aggiuntivo: è la struttura del gruppo di simmetria dello spazio-tempo, tradotta. <b>La conseguenza da portarsi via è che la meccanica quantistica non è una collezione di postulati sulla materia: è una collezione di postulati sulla probabilità, più la geometria.</b> E la ragione per cui questo conta operativamente: se un risultato sperimentale contraddicesse $[\hat q,\hat p]=i\hbar$, non si potrebbe aggiustare il commutatore — bisognerebbe cambiare la geometria dello spazio-tempo o la struttura delle probabilità, e sono due revisioni molto più profonde. È in questo senso preciso che la teoria è rigida.`}
  ]}
]},

var byId = {}; TAPPE.forEach(function(s){ byId[s.num]=s; });

var VKEY='pm-nucleomq-07-visited';
function loadSeen(){ try{ return new Set(JSON.parse(localStorage.getItem(VKEY)||'[]')); }catch(e){ return new Set(); } }
function saveSeen(s){ try{ localStorage.setItem(VKEY, JSON.stringify(Array.from(s))); }catch(e){} }
var SEEN = loadSeen();

function renderNav(active){
  var nav=document.getElementById('sidebar');
  nav.innerHTML='';
  var h=document.createElement('h2'); h.textContent='Nucleo mq-07 · le tappe'; nav.appendChild(h);
  TAPPE.forEach(function(s){
    var b=document.createElement('button');
    b.className='navitem'+(active===s.num?' active':'')+(SEEN.has(s.num)?' seen':'');
    b.innerHTML='<span class="dot"></span><span class="nx">'+s.num+'</span><span>'+s.title+'</span>';
    b.onclick=function(){ showTappa(s.num); };
    nav.appendChild(b);
  });
}

/* ---- renderer dei blocchi ---- */
function sectionProsa(title, tag, html){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var body=elFromHTML('<div class="open-body">'+html+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function sectionGram(title, rows){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag gramtag">grammatica</span></h3>';
  var inner='<table class="gramtab">';
  rows.forEach(function(r){ inner+='<tr><td class="gs">'+r[0]+'</td><td>'+r[1]+'</td></tr>'; });
  inner+='</table>';
  var body=elFromHTML('<div class="gramwrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
/* --- blocco PLOT: la figura non decora, si legge. Ogni plot porta una chiave di lettura. --- */
function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';
  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionSvelabile(title, tag, html, sol){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var c=document.createElement('div'); c.className='collaudo-item';
  var q=document.createElement('div'); q.className='cq'; q.innerHTML=html||'';
  c.appendChild(q); typeset(q);
  if(sol){
    var a=document.createElement('div'); a.className='ca'; a.style.display='none';
    a.innerHTML='<b>Soluzione.</b> '+sol;
    var btn=document.createElement('button'); btn.className='reveal-btn small';
    btn.textContent='Rivela la soluzione';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a);
      btn.disabled=true; btn.classList.add('done'); btn.textContent='Soluzione rivelata'; };
    c.appendChild(btn); c.appendChild(a);
  }
  wrap.appendChild(c); return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    /* DUE SCHEMI, NON UNO — scoperto il 2026-10-06 provando le pagine vive. I movimenti
       scritti per primi (em-01..03, me-10b, i collaudi di gd-01..09 e di quattro em)
       usano una forma piu' semplice: `reveal` e `prolessi` con un solo `html`,
       `esercizio` e `collaudo` con `html` + `sol`. Il renderer ne conosceva una sola e
       chiamava `steps.forEach` su `undefined`: TypeError, e la tappa si fermava li' —
       62 blocchi in 17 movimenti su 74. Non si riscrive il contenuto per far contento
       il renderer: e' il renderer che deve leggere cio' che c'e'.
       E in fondo un ramo che NON muore: uno schema nuovo di domani deve far vedere un
       avviso in quella sezione, non spegnere la pagina sotto di se'. */
    try{
      if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
      else if(b.t==='prolessi') m.appendChild(b.rotte ? sectionProlessi(b)
                                   : sectionProsa(b.title,'prolessi',b.html));
      else if(b.t==='reveal')m.appendChild(b.steps ? sectionReveal(b.title,b.tag,b.steps)
                                   : sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='esercizio') m.appendChild(b.steps ? sectionEsercizio(b)
                                   : sectionSvelabile(b.title,'esercizio',b.html,b.sol));
      else if(b.t==='collaudo')  m.appendChild(b.items ? sectionCollaudo(b.title,b.items)
                                   : sectionSvelabile(b.title,'provi, poi riveli',b.html,b.sol));
      else if(b.t==='plot')      m.appendChild(sectionPlot(b));
      else m.appendChild(sectionProsa(b.title||'(blocco)', 'tipo sconosciuto: '+b.t,
                                      b.html||''));
    }catch(err){
      var avv=document.createElement('section'); avv.className='section';
      avv.innerHTML='<h3>'+(b.title||'(blocco)')+'<span class="tag">non reso</span></h3>'
        +'<p style="color:#ff6b6b">Questo blocco non si &egrave; potuto rendere ('
        +b.t+': '+err.message+'). Il resto della tappa continua sotto.</p>';
      m.appendChild(avv);
    }
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* I POP-UP DEGLI STRUMENTI. `cablaStrumenti` esisteva dal 18-09 e non la chiamava
     nessuno: i 229 rimandi del percorso erano <span> senza handler, e il clic non
     faceva niente. Nessun controllo poteva vederlo — la sintassi era valida, le schede
     c'erano tutte, le formule rendevano: il guasto esisteva solo a pagina viva. Qui, e
     dopo ogni inserimento successivo, perche' la tappa si rimonta da capo a ogni
     cambio e gli handler vanno riattaccati al DOM nuovo. */
  cablaStrumenti(m);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}

});
window.addEventListener('hashchange', function(){
