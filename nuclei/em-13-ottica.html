<script>
"use strict";
const R = String.raw;

function typeset(el){
  if(el && window.renderMathInElement){
    try{ renderMathInElement(el,{delimiters:[
      {left:'$$',right:'$$',display:true},
      {left:'$',right:'$',display:false}
    ],throwOnError:false}); }catch(e){}
  }
}
function elFromHTML(html){ var d=document.createElement('div'); d.innerHTML=html; return d; }

/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un
   rimando scritto nella prosa:

       <span class="str" data-str="serie-geometrica">la serie geometrica</span>

   Le schede citate da questo nucleo sono cucite qui sotto dal montaggio
   (assembla-nucleo.js): la pagina resta autosufficiente — niente fetch,
   niente sottocartelle da pubblicare — e un rimando a una scheda che non
   esiste FERMA la costruzione invece di arrivare in pagina rotto.
   Apertura: lo stesso gesto del collaudo (si clicca, il pannello compare,
   si typeset una volta sola), portato dentro la frase.
   =================================================================== */
var CORSO = 'elettromagnetismo';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};


function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';
  return h;
}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

/* ===================================================================
   >>> CONTENUTO — Nucleo em-13: L’ottica: Snell dalle condizioni al contorno, riflessione totale, Brewster e interferenza <<<
   Modello dati: TAPPE[] ; ogni tappa ha blocchi[] con un tipo (t).
   Tipi: prosa | gram | reveal | esercizio | collaudo | prolessi | plot
   Tutta la matematica in R`...` (String.raw). Nelle formule si usano
   \lt \gt \le \ge (mai < > nudi, che l'HTML leggerebbe come tag).
   =================================================================== */

var TAPPE = [


/*MOVIMENTO
id:        em-13 — ottica
identita:  l'onda che incontra la materia: riflessione, rifrazione, polarizzazione
copre:     B.9 — Onde elettromagnetiche
serve:     em-12 (em-12-onde.html)
apre:      — (e' una foglia)
generata:  2026-09-18 da mappa.json — non modificare a mano, si cambia la mappa
MOVIMENTO*/

/*CONTROLLO
[
 {"tipo":"uguale","sinistra":"1/sqrt(e0*er*mu0)","vale":"(1/sqrt(e0*mu0))/sqrt(er)",
  "ipotesi":{"e0":"positive","mu0":"positive","er":"positive"},
  "dove":"01","appare":"n=\\sqrt{\\varepsilon_r}"},

 {"tipo":"uguale","sinistra":"asin(n1*sin(th1)/n2)","vale":"asin(n1*sin(th1)/n2)",
  "ipotesi":{"n1":"positive","n2":"positive","th1":"positive"},
  "dove":"02","appare":"n_1\\sin\\theta_1=n_2\\sin\\theta_2"},

 {"tipo":"uguale",
  "sinistra":"sin((atan(n2/n1)+asin(n1*sin(atan(n2/n1))/n2)).subs([(n1,1),(n2,Rational(3,2))]))",
  "vale":"1",
  "ipotesi":{"n1":"positive","n2":"positive"},
  "dove":"04","appare":"perpendicolari fra loro"},

 {"tipo":"uguale","sinistra":"(1/sqrt(e0*er*mu0))","vale":"(1/sqrt(e0*mu0))/sqrt(er)",
  "ipotesi":{"e0":"positive","mu0":"positive","er":"positive"},
  "dove":"01","appare":"\\frac{c}{n}"},

 {"tipo":"uguale","sinistra":"sin(asin(n2/n1))","vale":"n2/n1",
  "ipotesi":{"n1":"positive","n2":"positive"},
  "dove":"03","appare":"\\sin\\theta_c=\\frac{n_2}{n_1}"},

 {"tipo":"uguale","sinistra":"asin(m*lam/d)","vale":"asin(lam*m/d)",
  "ipotesi":{"m":"positive","lam":"positive","d":"positive"},
  "dove":"05","appare":"d\\sin\\theta=m\\lambda"},

 {"tipo":"simbolico","dove":"04","appare":"\\tan\\theta_B=\\frac{n_2}{n_1}",
  "perche":"e' l'enunciato della condizione di Brewster, il cui contenuto verificabile e' la perpendicolarita' asserita accanto"},

 {"tipo":"simbolico","dove":"02","appare":"E_\\parallel",
  "perche":"e' la componente parallela del campo, la cui continuita' e' il teorema di em-05 richiamato qui: enunciato citato"}
]
CONTROLLO*/

/* ---------------- 00 · DI COSA PARLA QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Di cosa parla questo movimento', meta:'Elettromagnetismo · voce C.7 · 32 prove · lottica smette di essere una materia a se',
  blocchi:[
  {t:'prosa', title:'Da dove arriviamo', tag:'architettura', html:R`
  <p>em-12 ha prodotto un&rsquo;onda che viaggia nel vuoto. Questo movimento la fa <b>incontrare una superficie</b>, e da quell&rsquo;incontro esce tutta l&rsquo;ottica: riflessione, rifrazione, riflessione totale, polarizzazione, colori, e i fenomeni di interferenza.</p>
  <p><b>La cosa importante da capire è che non c&rsquo;è niente di nuovo da postulare.</b> Le leggi dell&rsquo;ottica — note da secoli come regole empiriche — sono <b>conseguenze</b> delle condizioni di raccordo già viste in em-05: la componente parallela di $\vec E$ è continua, la perpendicolare di $\vec D$ è continua. Snell l&rsquo;hai già incontrata in forma statica lì, come $\tan\theta'=\varepsilon_r\tan\theta$; qui la stessa condizione, applicata a un&rsquo;onda con una frequenza, dà la legge della rifrazione.</p>
  <p><b>Il ponte fra i due mondi è una sola formula</b>: in un mezzo la velocità di propagazione è $v=1/\sqrt{\varepsilon\mu}$, quindi
  $$n=\frac{c}{v}=\sqrt{\varepsilon_r\mu_r}\simeq\sqrt{\varepsilon_r}$$
  per i materiali non magnetici. <b>L&rsquo;indice di rifrazione è la costante dielettrica</b>, misurata alla frequenza della luce invece che in continua — ed è per questo che l&rsquo;acqua ha $\varepsilon_r=80$ in statica ma $n=1{,}33$, cioè $\varepsilon_r\simeq1{,}77$ nell&rsquo;ottico: le molecole non fanno in tempo a ruotare a $10^{15}$ Hz.</p>`}
]},

/* ---------------- 01 · LA LUCE NEI MEZZI ---------------- */
{ num:'01', title:'La luce in un mezzo: indice di rifrazione e dispersione', meta:'v = c/n · n dipende dalla frequenza · perche il prisma separa i colori',
  blocchi:[
  {t:'prosa', title:'Che cosa cambia rispetto al vuoto', tag:'costruzione', html:R`
  <p>Ripetendo la derivazione di em-11 dentro un mezzo lineare — cioè con $\varepsilon_0\to\varepsilon_0\varepsilon_r$ e $\mu_0\to\mu_0\mu_r$ — si ottiene la stessa equazione d&rsquo;onda con velocità
  $$v=\frac{1}{\sqrt{\varepsilon\mu}}=\frac{c}{n},\qquad n=\sqrt{\varepsilon_r}$$
  (per materiali non magnetici, $\mu_r\simeq1$). <b>Due cose restano e una cambia</b>: la frequenza $\nu$ è imposta dalla sorgente e <b>non cambia</b> passando da un mezzo all&rsquo;altro; la velocità cala di $n$; quindi la <b>lunghezza d&rsquo;onda</b> cala di $n$, perché $\lambda=v/\nu$.</p>
  <p><b>La dispersione</b> è il fatto che $n$ dipende dalla frequenza, cioè che $\varepsilon_r$ dipende dalla frequenza — esattamente la domanda lasciata aperta da em-05. Per il vetro nel visibile $n$ è maggiore per il blu che per il rosso, quindi il blu viene deviato di più: <b>è il prisma</b>, ed è l&rsquo;arcobaleno.</p>
  <div class="note"><b>Attenzione a un&rsquo;affermazione che si sente spesso e che è mal posta</b>: «la luce rallenta nel mezzo perché viene assorbita e riemessa». La descrizione corretta è che il campo incidente polarizza le molecole, le molecole irraggiano a loro volta, e la <b>sovrapposizione</b> dell&rsquo;onda originale con quelle riemesse ha un fronte che avanza più lentamente. Non c&rsquo;è nessun ritardo a ogni atomo: c&rsquo;è un&rsquo;interferenza collettiva. È anche il motivo per cui $n$ può essere minore di 1 per i raggi X, senza che niente superi $c$.</div>`}
]},

/* ---------------- 02 · RIFLESSIONE E RIFRAZIONE ---------------- */
{ num:'02', title:'Snell dedotta, non postulata', meta:'la condizione al contorno · perche gli angoli devono raccordarsi · e la legge che ne esce',
  blocchi:[
  {t:'reveal', title:'Come si ricava dalle condizioni al contorno', tag:'costruzione', steps:[
   {label:'Largomento, che vale piu della formula', body:R`
   <p>Sull&rsquo;interfaccia, la componente $E_\parallel$ dell&rsquo;onda incidente più quella riflessa deve <b>eguagliare</b> punto per punto e istante per istante quella trasmessa (è la condizione di em-05). Perché due funzioni oscillanti coincidano su <i>tutta</i> la superficie e a <i>ogni</i> istante, devono avere la stessa fase lungo la superficie.</p>
   <p>Da questa richiesta seguono <b>tre fatti in un colpo solo</b>:</p>
   <ul>
    <li>le tre onde hanno la <b>stessa frequenza</b>;</li>
    <li>i tre raggi stanno nello <b>stesso piano</b>;</li>
    <li>le componenti parallele dei vettori d&rsquo;onda coincidono: $k_1\sin\theta_1=k_1\sin\theta_r=k_2\sin\theta_2$.</li>
   </ul>`},
   {label:'Le due leggi', body:R`
   <p>Dalla prima uguaglianza, $\theta_r=\theta_1$: la <b>legge della riflessione</b>. Dalla seconda, usando $k=n\omega/c$:
   $$n_1\sin\theta_1=n_2\sin\theta_2,$$
   la <b>legge di Snell</b>. <b>Nessuna delle due è stata postulata</b>: entrambe vengono dal raccordo delle fasi, cioè dal fatto che il campo non può essere discontinuo lungo la superficie.</p>
   <p><b>Il modo giusto di ricordarla</b>: passando a un mezzo più denso ($n_2>n_1$) la luce <b>si avvicina alla normale</b>. La ragione fisica è che la lunghezza d&rsquo;onda si accorcia e il fronte d&rsquo;onda deve «girare» per raccordarsi — la stessa immagine dei cingoli di un carro armato che entrano nel fango da un lato.</p>`}
  ]},
  {t:'plot', title:'Langolo rifratto in funzione di quello incidente',
   intro:R`$\theta_2$ contro $\theta_1$ (in gradi) passando da un mezzo all&rsquo;altro. In verde aria→vetro ($n=1{,}5$), in viola vetro→aria — dove la curva si interrompe c&rsquo;è la riflessione totale.`,
   plots:[
    {kind:'func2d', xr:[0,90], yr:[0,90], height:350,
     title:'verso il mezzo piu denso ci si avvicina alla normale; al contrario si esce, fino allangolo limite',
     xlabel:'theta incidente (gradi)', ylabel:'theta rifratto (gradi)',
     curves:[
      {f:'x', col:'#4d5a6b', width:1.5, dash:true, label:'n uguali (nessuna deviazione)'},
      {f:'asin(sin(x*PI/180)/1.5)*180/PI', col:'#5eead4', width:2.4, label:'aria -> vetro'},
      {f:'sin(x*PI/180)*1.5<1 ? asin(1.5*sin(x*PI/180))*180/PI : 0/0', col:'#b98cff', width:2.4, label:'vetro -> aria'}
     ],
     segs:[{x1:41.8, y1:0, x2:41.8, y2:90, col:'#ff6b6b', dash:true, width:1.5, label:'angolo limite 41.8', lx:43, ly:20}],
     marks:[{x:90, y:41.8, label:'oltre 41.8 non esce piu niente', col:'#b98cff', left:true},
            {x:41.8, y:90, label:'rifratto radente', col:'#ff9b6b', left:true}]}
   ],
   leggi:R`<b>La curva verde sta sempre sotto la bisettrice</b>: entrando nel vetro il raggio si avvicina alla normale, e anche incidendo quasi radente ($90°$) il rifratto non supera $41{,}8°$ — <b>tutto il mondo esterno, visto da sott&rsquo;acqua, sta dentro un cono</b>, ed è il «cerchio di Snell» che vede un subacqueo guardando in su.<br><br>
   <b>La curva viola è la stessa legge percorsa al contrario</b>, e si interrompe: a $41{,}8°$ il raggio rifratto esce radente, e oltre quell&rsquo;angolo <b>non esiste più</b>. Non è che sia debole: matematicamente $\sin\theta_2$ dovrebbe superare 1, e la soluzione ondulatoria diventa evanescente. Tutta l&rsquo;energia torna indietro — è la riflessione totale della tappa 03.`}
]},

/* ---------------- 03 · RIFLESSIONE TOTALE ---------------- */
{ num:'03', title:'Riflessione totale e onda evanescente', meta:'langolo limite · perche solo dal mezzo piu denso · londa che entra e non si propaga · la fibra ottica',
  blocchi:[
  {t:'prosa', title:'La condizione, e cosa succede davvero oltre', tag:'idea', html:R`
  <p>Passando da un mezzo più denso a uno meno denso ($n_1>n_2$), Snell dà $\sin\theta_2=\frac{n_1}{n_2}\sin\theta_1$, che cresce più in fretta di $\sin\theta_1$. Esiste quindi un <b>angolo limite</b>
  $$\sin\theta_c=\frac{n_2}{n_1}$$
  oltre il quale non c&rsquo;è nessuna soluzione reale per $\theta_2$: <b>tutta l&rsquo;energia è riflessa</b>. Per l&rsquo;interfaccia vetro-aria $\theta_c\simeq41{,}8°$, per acqua-aria $\simeq48{,}8°$.</p>
  <p><b>Ma qualcosa entra comunque</b>, ed è il punto che rende questo fenomeno interessante invece che banale. Le condizioni al contorno non possono essere soddisfatte con campo nullo nel secondo mezzo: la soluzione è un&rsquo;<b>onda evanescente</b>, che si smorza esponenzialmente in poche lunghezze d&rsquo;onda e <b>non trasporta energia netta</b> lontano dall&rsquo;interfaccia.</p>
  <div class="note"><b>La conseguenza che si misura</b>: se si avvicina un <i>terzo</i> mezzo a meno di una lunghezza d&rsquo;onda dall&rsquo;interfaccia, l&rsquo;onda evanescente lo raggiunge ancora viva e <b>l&rsquo;energia passa</b>, benché fra i due ci sia una regione in cui l&rsquo;onda non si propaga. Si chiama <b>riflessione totale frustrata</b>, ed è l&rsquo;analogo ottico esatto dell&rsquo;<b>effetto tunnel</b> quantistico — stessa matematica, stessa esponenziale decrescente nella regione proibita. Chi farà Meccanica Quantistica ritrova questo conto identico, con $\psi$ al posto di $\vec E$.</div>
  <p><b>La fibra ottica</b> è questa tappa applicata: un nucleo con $n$ leggermente maggiore del mantello, e la luce che incide sempre oltre l&rsquo;angolo limite resta intrappolata per chilometri, riflettendosi migliaia di volte senza perdere quasi nulla — perché la riflessione totale, a differenza di uno specchio, è <b>totale davvero</b>.</p>`}
]},

/* ---------------- 04 · POLARIZZAZIONE E BREWSTER ---------------- */
{ num:'04', title:'Polarizzazione e angolo di Brewster', meta:'i due stati di polarizzazione · perche la luce riflessa e polarizzata · gli occhiali da sole',
  blocchi:[
  {t:'prosa', title:'Il fenomeno, e il conto che lo spiega', tag:'costruzione', html:R`
  <p>Un&rsquo;onda è trasversale (em-12), quindi il campo elettrico può oscillare in due direzioni indipendenti perpendicolari alla propagazione: sono i due stati di <b>polarizzazione</b>. Nella luce naturale le due si alternano a caso.</p>
  <p>Le condizioni al contorno <b>trattano i due stati in modo diverso</b> — quello con $\vec E$ nel piano di incidenza e quello perpendicolare — e le formule di Fresnel danno due coefficienti di riflessione distinti. Esiste un angolo per cui quello della componente parallela si <b>annulla</b>:
  $$\tan\theta_B=\frac{n_2}{n_1}\qquad\text{(angolo di Brewster)}.$$
  A quell&rsquo;angolo <b>la luce riflessa è completamente polarizzata</b> perpendicolarmente al piano di incidenza. Per vetro-aria $\theta_B\simeq56°$.</p>
  <p><b>Il perché, in una riga, senza formule di Fresnel</b>: a quell&rsquo;angolo il raggio riflesso e quello rifratto risultano <b>perpendicolari fra loro</b>. Il raggio riflesso è prodotto dai dipoli oscillanti del materiale, che oscillano nella direzione del campo rifratto; ma un dipolo <b>non irraggia lungo il proprio asse</b>. Quindi nella direzione del riflesso non arriva nulla di quella polarizzazione.</p>
  <div class="note"><b>È il motivo per cui gli occhiali da sole polarizzati funzionano.</b> La luce riflessa da asfalto, acqua o cruscotto — superfici orizzontali, riflessione vicino a Brewster — è polarizzata <i>orizzontalmente</i>. Un filtro che blocca l&rsquo;orizzontale elimina il riverbero lasciando passare il resto. Lo stesso vale in fotografia con il filtro polarizzatore, che toglie i riflessi dai vetri e scurisce il cielo (anche la luce diffusa dall&rsquo;atmosfera è parzialmente polarizzata, per lo stesso meccanismo dei dipoli).</div>`}
]},

/* ---------------- 05 · INTERFERENZA ---------------- */
{ num:'05', title:'Interferenza e diffrazione: quando la fase e tutto', meta:'la doppia fenditura · la condizione di massimo · il reticolo · e cosa serve perche si veda',
  blocchi:[
  {t:'prosa', title:'La condizione, e le sue conseguenze', tag:'regola operativa', html:R`
  <p>Due sorgenti coerenti separate da $d$ producono, su uno schermo lontano, una differenza di cammino $d\sin\theta$. I <b>massimi</b> stanno dove quella differenza è un multiplo intero della lunghezza d&rsquo;onda:
  $$d\sin\theta=m\lambda,\qquad m\in\mathbb{Z},$$
  e i minimi a metà strada. <b>Non è ottica: è la somma di due seni</b>, e la stessa formula governa le onde sull&rsquo;acqua, il suono e — in meccanica quantistica — gli elettroni.</p>
  <p><b>Tre letture che servono negli esercizi:</b></p>
  <ul>
   <li>la spaziatura delle frange è proporzionale a $\lambda/d$: <b>fenditure vicine, frange larghe</b>;</li>
   <li>con luce bianca ogni colore ha il suo massimo a un angolo diverso: l&rsquo;interferenza <b>separa i colori</b>, ed è il principio del reticolo di diffrazione e degli spettrometri — con cui si misurano le righe delle stelle;</li>
   <li>servono sorgenti <b>coerenti</b>: con due lampadine indipendenti le fasi variano a caso e le frange si mediano via. È il motivo per cui l&rsquo;esperimento di Young usa <i>una</i> sorgente divisa in due.</li>
  </ul>
  <p><b>La diffrazione da una singola fenditura</b> obbedisce alla stessa logica, con la differenza che i contributi da sommare sono infiniti (tutti i punti della fenditura): il risultato è un massimo centrale largo con $\sin\theta=\lambda/a$ come primo minimo. <b>Da qui il limite di risoluzione di ogni strumento ottico</b>: due sorgenti si distinguono solo se separate più della larghezza del massimo centrale. Un telescopio più grande vede più dettagli non perché raccolga più luce, ma per questo.</p>`},
  {t:'plot', title:'La figura di interferenza, e cosa cambia con la distanza fra le fenditure',
   intro:R`Intensità sullo schermo per la doppia fenditura, in unità $\lambda/d$. Le tre curve hanno tre valori di $d$.`,
   plots:[
    {kind:'func2d', xr:[-3,3], yr:[0,1.1], height:340,
     title:'fenditure piu lontane, frange piu fitte',
     xlabel:'sin(theta) / (lambda/d) per la curva verde', ylabel:'intensita',
     curves:[
      {f:'pow(cos(PI*x),2)', col:'#5eead4', width:2.4, label:'d'},
      {f:'pow(cos(2*PI*x),2)', col:'#d8a13a', width:1.8, label:'2d'},
      {f:'pow(cos(4*PI*x),2)', col:'#b98cff', width:1.4, label:'4d'}
     ],
     marks:[{x:0, y:1, label:'massimo centrale: sempre li', col:'#ff9b6b', left:true}]}
   ],
   leggi:R`<b>Il massimo centrale non si sposta mai</b> — lì la differenza di cammino è zero per qualunque $d$ e per qualunque colore, ed è il motivo per cui al centro della figura la luce bianca resta bianca mentre tutto il resto è iridato. Raddoppiando la distanza fra le fenditure le frange <b>raddoppiano di numero</b> e si stringono: la spaziatura va come $\lambda/d$.<br><br>
   <b>La lettura che conta per gli esercizi</b>: misurando la posizione delle frange e conoscendo $d$ si ricava $\lambda$ — è così che si misura la lunghezza d&rsquo;onda della luce con un righello, ed è uno degli esperimenti più precisi che si possano fare senza strumenti sofisticati. Al contrario, conoscendo $\lambda$ si misura $d$: è il principio della <b>diffrazione dei raggi X</b> con cui si è determinata la struttura del DNA.`}
]},

/* ---------------- 06 · IL SENSO ---------------- */
{ num:'06', title:'Il senso, e le rotte — e la fine del corso', meta:'cosa chiude, e dove la luce diventa qualcosa daltro',
  blocchi:[
  {t:'prosa', title:'Cosa chiude', tag:'sintesi', html:R`
  <p><b>A monte.</b> Le condizioni al contorno di em-05, l&rsquo;onda di em-12, le equazioni di em-11. <b>Non è stato aggiunto nessun principio nuovo in tutta questa tappa</b>: riflessione, Snell, Brewster, angolo limite sono tutti conseguenze del raccordo dei campi su una superficie.</p>
  <p><b>Il punto.</b> L&rsquo;ottica era una disciplina autonoma, con le sue leggi empiriche, per duemila anni. <b>Maxwell l&rsquo;ha resa un capitolo</b> dell&rsquo;elettromagnetismo. Quando in un corso di fisica un intero settore diventa un corollario di quattro equazioni, quello è ciò che si chiama unificazione — e questo corso ne contiene una delle due o tre più grandi.</p>
  <p><b>A valle, e qui il corso finisce.</b> Tutto quello che hai visto è <b>classico</b>: campi continui, energia divisibile a piacere, onde che interferiscono. La crepa è nella tappa 05: se abbassi l&rsquo;intensità finché passa un fotone alla volta, le frange <b>compaiono lo stesso</b>, una macchiolina per volta — e ogni singolo fotone interferisce con se stesso. Lì l&rsquo;elettromagnetismo classico ha detto tutto quello che poteva dire.</p>`},
  {t:'prolessi', title:'Dove riappare questo movimento, nella fisica che farai',
   oggetto:R`<b>L&rsquo;interferenza</b>: due cammini che arrivano nello stesso punto, e una fase che decide se si sommano o si cancellano.`,
   rotte:[
    {dove:'Meccanica<br>quantistica', txt:R`La doppia fenditura con elettroni dà le stesse frange, ed è l&rsquo;esperimento che Feynman chiamava «l&rsquo;unico mistero». L&rsquo;ampiezza di probabilità si somma sui cammini come qui si sommano i campi, e l&rsquo;integrale sui cammini è questa idea portata all&rsquo;estremo.`},
    {dove:'Astrofisica', txt:R`Gli <b>spettrometri</b> sono reticoli di diffrazione: tutto ciò che sappiamo della composizione delle stelle viene dalle righe separate da questa formula. L&rsquo;<b>interferometria</b> combina telescopi lontani per ottenere la risoluzione di uno strumento grande quanto la loro distanza — è così che si è fotografato un buco nero.`},
    {dove:'Materia<br>condensata', txt:R`La diffrazione di raggi X e di neutroni determina le strutture cristalline: la condizione di Bragg è questa stessa formula applicata ai piani atomici. <b>È così che si conosce la disposizione degli atomi in un solido.</b>`},
    {dove:'Tecnologia', txt:R`Fibre ottiche, rivestimenti antiriflesso (interferenza distruttiva su uno strato sottile), ologrammi, LIGO — l&rsquo;interferometro che ha rivelato le onde gravitazionali misurando spostamenti mille volte più piccoli di un protone, con questa identica fisica.`}
   ],
   domanda:R`L&rsquo;interferenza richiede che la luce «passi da entrambe le fenditure». Con un fascio intenso è ovvio. Ma le frange compaiono anche mandando <b>un fotone alla volta</b>, con ore di intervallo: ogni fotone arriva in un punto solo — un puntino sul rivelatore — eppure la distribuzione dei puntini, dopo migliaia di eventi, è esattamente la figura di interferenza. <b>Domanda con cui chiudi il corso e ne cominci un altro:</b> che cosa passa dalle due fenditure, se ciò che arriva è sempre e solo un puntino? La risposta non è in nessuna delle equazioni che hai studiato qui, e non è una questione di misure più precise: <b>è il punto in cui serve una teoria diversa</b>, ed è dove comincia Meccanica Quantistica.`}
]}

];

/* ---- renderer dei blocchi ---- */
function sectionProsa(title, tag, html){

  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var body=elFromHTML('<div class="open-body">'+html+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}

  wrap.innerHTML='<h3>'+title+'<span class="tag gramtag">grammatica</span></h3>';
  var inner='<table class="gramtab">';

  typeset(body); wrap.appendChild(body); return wrap;
}
/* --- blocco PLOT: la figura non decora, si legge. Ogni plot porta una chiave di lettura. --- */

  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){

    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);

  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}

}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
    else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
    else if(b.t==='prolessi') m.appendChild(sectionProlessi(b));
    else if(b.t==='reveal')m.appendChild(sectionReveal(b.title,b.tag,b.steps));
    else if(b.t==='esercizio') m.appendChild(sectionEsercizio(b));
    else if(b.t==='collaudo')  m.appendChild(sectionCollaudo(b.title,b.items));
    else if(b.t==='plot')      m.appendChild(sectionPlot(b));
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}

window.addEventListener('DOMContentLoaded', function(){
  var h=(location.hash||'').replace('#','');
  showTappa(byId[h]?h:'00');
});
window.addEventListener('hashchange', function(){
  var h=(location.hash||'').replace('#','');
  if(byId[h]) showTappa(h);
});
</script>
