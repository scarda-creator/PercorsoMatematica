<style>
  :root{
    --bg:#0e1117; --panel:#161b22; --panel2:#1c232d; --border:#2b333d;
    --txt:#eef3f8; --muted:#b9c4d1; --accent:#4c8dff; --accent2:#8fb0ff;
    --ok:#2ea043; --okbg:#10331b; --warn:#d8a13a; --warnbg:#332a10;
    --gram:#5eead4; --grambg:#0f2a26;
    --pro:#b98cff; --probg:#1a1430; --proline:#2a2247; --proedge:#3a2d5c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    font-size:17px;line-height:1.55;}
  a{color:var(--accent2);}
  .banner{background:var(--panel2);border-bottom:1px solid var(--border);color:var(--muted);
    font-size:.8rem;font-weight:600;text-align:center;padding:8px 12px;letter-spacing:.3px;}
  .banner b{color:var(--accent2);}
  .shell{display:flex;max-width:1180px;margin:0 auto;align-items:flex-start;}

  /* ---- SIDEBAR ---- */
  .sidebar{width:280px;flex:0 0 280px;padding:20px 12px 60px;position:sticky;top:0;
    max-height:100vh;overflow-y:auto;border-right:1px solid var(--border);}
  .sidebar h2{font-size:.72rem;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);
    margin:18px 8px 8px;}
  .navitem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:none;
    background:transparent;color:var(--txt);padding:9px 10px;border-radius:8px;cursor:pointer;
    font-size:.9rem;transition:.12s;border:1px solid transparent;}
  .navitem:hover{background:var(--panel2);}
  .navitem.active{background:#13233f;border-color:var(--accent);color:#fff;}
  .navitem .dot{width:7px;height:7px;border-radius:50%;background:transparent;flex:0 0 7px;
    border:1px solid var(--border);}
  .navitem.seen .dot{background:var(--ok);border-color:var(--ok);}
  .navitem .nx{color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto;}

  /* ---- MAIN ---- */
  .main{flex:1 1 auto;min-width:0;padding:24px 30px 90px;max-width:860px;}
  h1{font-size:1.5rem;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:.92rem;margin:0 0 18px;}
  .sfhead{border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:8px;}
  .sfhead h1{font-size:1.55rem;}
  .meta{color:var(--muted);font-size:.82rem;margin-top:6px;}

  .section{margin:26px 0;}
  .section > h3{font-size:1.02rem;color:var(--accent2);margin:0 0 10px;
    display:flex;align-items:center;gap:10px;}
  .section > h3 .tag{font-size:.66rem;font-weight:700;letter-spacing:.4px;background:var(--panel2);
    border:1px solid var(--border);color:var(--muted);padding:2px 8px;border-radius:20px;
    text-transform:uppercase;}
  /* --- blocchi figura --- */
  .section > h3 .tag.plottag{background:#101f2e;border-color:#1f3c57;color:#7ab8e0;}
  .plot-intro{color:var(--muted);font-size:.95rem;margin:0 0 12px;}
  .plot-row{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;
    background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;}
  .plot-row.due .plot-box{flex:1 1 300px;min-width:280px;}
  .plot-box{max-width:560px;}
  .plot-leggi{margin-top:10px;background:var(--panel2);border:1px solid var(--border);
    border-left:3px solid #4a8fc7;border-radius:0 10px 10px 0;padding:11px 14px;
    font-size:.93rem;color:var(--muted);}
  .plot-leggi b{color:#7ab8e0;}
  .plot-err{color:#ff6b6b;font-size:.85rem;}
  .open-body{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
  .open-body p:first-child{margin-top:0;} .open-body p:last-child{margin-bottom:0;}
  .open-body ul{margin:.4em 0;padding-left:1.2em;} .open-body li{margin:.35em 0;}

  .note{background:var(--panel2);border-left:3px solid var(--muted);border-radius:6px;
    padding:9px 12px;margin:12px 0;font-size:.9rem;color:var(--muted);}
  .note b{color:#ff9d6b;}
  .note.warn{background:var(--warnbg);border-left-color:var(--warn);color:#e0b85a;}
  .note.warn b{color:#f0c25a;}

  /* ---- GRAMMATICA ---- */
  .gramwrap{background:var(--grambg);border:1px solid #1f4d47;border-radius:12px;padding:6px 6px;}
  table.gramtab{border-collapse:collapse;width:100%;font-size:.92rem;}
  table.gramtab td{padding:9px 12px;vertical-align:top;border-bottom:1px solid #17332e;}
  table.gramtab tr:last-child td{border-bottom:none;}
  table.gramtab td.gs{white-space:nowrap;color:var(--gram);width:1%;
    border-right:1px solid #17332e;font-variant-numeric:tabular-nums;}
  .section > h3 .tag.gramtag{background:var(--grambg);border-color:#1f4d47;color:var(--gram);}

  /* ---- STRUMENTI (repertorio condiviso: la scheda si apre DENTRO la frase) ----
     Nessun accento nuovo: riusa il verde della grammatica, perche' uno strumento
     richiamato e' grammatica gia' spiegata altrove, non una quinta specie di blocco. */
  .str{color:var(--gram);border-bottom:1px dashed var(--gram);cursor:pointer;}
  .str:hover{background:var(--grambg);}
  .str::after{content:"\2666";font-size:.62em;vertical-align:.42em;margin-left:2px;opacity:.8;}
  .str.aperto::after{content:"\2715";}
  .str.rotto{color:#ff6b6b;border-bottom-color:#ff6b6b;cursor:help;}
  /* la scheda e' uno SPAN in display:block, non un div: i rimandi cadono dentro
     <p>, <li> e celle di tabella, dove un div e' HTML illegale. */
  .strcard{display:block;margin:10px 0;background:var(--grambg);border:1px solid #1f4d47;
    border-left:3px solid var(--gram);border-radius:0 10px 10px 0;padding:10px 14px;font-size:.9rem;}
  .strcard .sh{display:block;font-size:.66rem;font-weight:700;letter-spacing:.5px;
    text-transform:uppercase;color:var(--gram);margin-bottom:7px;}
  .strcard .sr{display:block;margin:5px 0;}
  .strcard .sk{color:var(--gram);font-weight:600;}

  .prowrap{background:var(--probg);border:1px solid var(--proedge);border-radius:12px;padding:4px 4px 8px;}
  .prohead{padding:11px 14px 4px;color:var(--pro);font-size:.72rem;font-weight:700;letter-spacing:.7px;

  .pro-oggetto{padding:2px 14px 11px;color:var(--muted);font-size:.92rem;border-bottom:1px solid var(--proline);
    margin-bottom:2px;} .pro-oggetto b{color:var(--txt);}
  table.protab{border-collapse:collapse;width:100%;font-size:.92rem;}
  table.protab td{padding:10px 12px;vertical-align:top;border-bottom:1px solid var(--proline);}
  table.protab tr:last-child td{border-bottom:none;}
  table.protab td.pd{white-space:nowrap;color:var(--pro);width:1%;font-weight:700;font-size:.78rem;
    letter-spacing:.3px;text-transform:uppercase;border-right:1px solid var(--proline);line-height:1.3;}
  .pro-domanda{margin:8px 8px 2px;background:#140d26;border:1px solid var(--proedge);

  .pro-domanda b{color:var(--pro);}
  .section > h3 .tag.protag{background:var(--probg);border-color:var(--proedge);color:var(--pro);}

  /* ---- REVEAL ---- */
  .rsteps{display:flex;flex-direction:column;gap:12px;}
  .rstep{background:var(--panel);border:1px solid var(--border);border-radius:12px;

  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .rlabel{font-size:.7rem;font-weight:700;letter-spacing:.4px;color:var(--accent);
    text-transform:uppercase;margin-bottom:8px;}
  .rstep p:first-of-type{margin-top:0;} .rstep p:last-child{margin-bottom:0;}
  .rstep ul{margin:.4em 0;padding-left:1.2em;}
  .testo{background:#13233f;border:1px solid #2b4877;border-radius:12px;padding:14px 18px;margin-bottom:14px;}
  .testo .src{display:block;font-size:.74rem;font-style:italic;color:var(--accent2);margin-bottom:8px;
    text-transform:uppercase;letter-spacing:.3px;}
  .esame-nota{font-size:.9rem;color:var(--muted);font-style:italic;margin-top:12px;padding-left:12px;

  .reveal-btn{background:var(--accent);color:#fff;border:none;padding:11px 18px;border-radius:10px;

  .reveal-btn:hover:not(:disabled){background:var(--accent2);}
  .reveal-btn.small{padding:7px 14px;font-size:.85rem;margin-top:0;background:var(--panel2);
    color:var(--accent2);border:1px solid var(--border);}
  .reveal-btn.small:hover:not(:disabled){border-color:var(--accent);}
  .reveal-btn:disabled,.reveal-btn.done{background:var(--panel2);color:var(--muted);
    border:1px solid var(--border);cursor:default;}

  /* ---- COLLAUDO ---- */
  .collaudo-item{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 18px;margin-bottom:12px;}
  .cq{margin-bottom:10px;}
  .ca{margin-top:12px;background:var(--okbg);border:1px solid #235c33;border-radius:8px;
    padding:10px 14px;font-size:.94rem;}
  .ca b{color:#5fd980;}

  /* ---- PREV / NEXT ---- */
  .prevnext{display:flex;justify-content:space-between;gap:12px;margin-top:40px;
    border-top:1px solid var(--border);padding-top:20px;}
  .pnbtn{flex:1 1 0;background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:12px 16px;cursor:pointer;color:var(--txt);text-align:left;transition:.14s;font:inherit;}
  .pnbtn:hover{border-color:var(--accent);background:var(--panel2);}
  .pnbtn.next{text-align:right;}
  .pnbtn .k{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .pnbtn .t{font-weight:600;color:var(--accent2);}
  .pnbtn:disabled{opacity:.35;cursor:default;border-color:var(--border);background:var(--panel);}

  code{background:var(--panel2);border:1px solid var(--border);border-radius:5px;
    padding:1px 5px;font-size:.85em;color:var(--accent2);}
  .katex{font-size:1.02em;color:var(--txt);} .katex-display{margin:.5em 0;overflow-x:auto;overflow-y:hidden;}

  @media(max-width:860px){
    .shell{flex-direction:column;}
    .sidebar{width:100%;flex:none;position:static;max-height:none;border-right:none;
      border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:4px;}
    .sidebar h2{width:100%;} .navitem{width:auto;}
    .main{padding:20px 16px 80px;}
  }
</style>

<script>
"use strict";
const R = String.raw;

function typeset(el){
  if(el && window.renderMathInElement){
    try{ renderMathInElement(el,{delimiters:[
      {left:'$$',right:'$$',display:true},
      {left:'$',right:'$',display:false}
    ],throwOnError:false}); }catch(e){}
  }
}
function elFromHTML(html){ var d=document.createElement('div'); d.innerHTML=html; return d; }

/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un
   rimando scritto nella prosa:

       <span class="str" data-str="serie-geometrica">la serie geometrica</span>

   Le schede citate da questo nucleo sono cucite qui sotto dal montaggio
   (assembla-nucleo.js): la pagina resta autosufficiente — niente fetch,
   niente sottocartelle da pubblicare — e un rimando a una scheda che non
   esiste FERMA la costruzione invece di arrivare in pagina rotto.
   Apertura: lo stesso gesto del collaudo (si clicca, il pannello compare,
   si typeset una volta sola), portato dentro la frase.
   =================================================================== */
var CORSO = 'geometria-differenziale';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["omeomorfismo"] = {"nome":"Omeomorfismo","riga":"Una biiezione continua con inversa continua: due spazi omeomorfi sono lo stesso spazio scritto in due modi, per tutto ciò che la topologia sa vedere.","serve":"È la nozione di «uguale» che si usa quando si dice che una varietà è localmente come $\\mathbb{R}^n$. La richiesta che anche l'inversa sia continua non è pignoleria: senza di essa una biiezione continua può incollare cose lontane — l'applicazione $t\\mapsto(\\cos 2\\pi t,\\sin 2\\pi t)$ da $[0,1)$ alla circonferenza è continua e biunivoca, ma la sua inversa spezza la circonferenza in un punto, e infatti $[0,1)$ e $S^1$ non sono lo stesso spazio (uno è compatto, l'altro no). Le proprietà che si conservano per omeomorfismo — compattezza, connessione, dimensione, gruppo fondamentale — sono esattamente quelle di cui si può parlare su una varietà senza aver scelto una carta.","esempio":"L'intervallo aperto $(0,1)$ e la semiretta $(0,+\\infty)$ sono omeomorfi tramite $f(x)=\\dfrac{x}{1-x}$: è continua su $(0,1)$, manda $0^+$ in $0^+$ e $1^-$ in $+\\infty$, e la sua inversa è $g(y)=\\dfrac{y}{1+y}$, anch'essa continua. Che siano davvero una l'inversa dell'altra si verifica componendo: $g(f(x))=\\dfrac{x/(1-x)}{1+x/(1-x)}=x$. Ne segue che $(0,1)$ è omeomorfo anche a tutto $\\mathbb{R}$ (componendo con $y\\mapsto\\ln y$), il che dice una cosa che all'inizio sorprende: **la lunghezza non è una proprietà topologica**. Non lo è nemmeno l'essere limitato; lo è invece la compattezza, ed è per questo che $[0,1]$ non è omeomorfo a nessuno dei due.","debito":"nessun movimento del percorso tratta la topologia generale come argomento a sé: qui c'è ciò che serve per leggere la definizione di varietà. La classificazione di quali spazi sono omeomorfi a quali è il mestiere della topologia algebrica, e nel corso di Diverio entra solo per la numerabilità del gruppo fondamentale.","controllo":[{"tipo":"uguale","sinistra":"(x/(1-x))/(1+x/(1-x))","vale":"x","ipotesi":{"x":"positive"},"dove":"esempio","appare":"=x"}]};
STRUM["quoziente-topologico"] = {"nome":"Topologia quoziente","riga":"Si incollano punti dichiarandoli uguali, e si decide che un insieme è aperto nel quoziente quando la sua controimmagine è aperta sopra: è il modo di costruire spazi nuovi senza metterli dentro nessun ambiente.","serve":"È la seconda fabbrica di varietà, accanto ai grafici e ai prodotti, e produce proprio gli esempi che non si vedono come sottoinsiemi di $\\mathbb{R}^n$: il toro, il nastro di Möbius, lo spazio proiettivo. La regola pratica è sempre la stessa: una funzione definita sul quoziente è continua se e solo se, composta con la proiezione, è continua sopra — quindi si lavora sempre con i rappresentanti, controllando che il risultato non dipenda da quale si è scelto. Attenzione: **un quoziente di una varietà non è automaticamente una varietà**, e la proprietà che salta per prima è Hausdorff — la retta con due origini è proprio un quoziente mal riuscito.","esempio":"La circonferenza è $\\mathbb{R}/\\mathbb{Z}$: si dichiarano uguali due numeri che differiscono per un intero, e si manda la classe di $t$ nel punto $\\left(\\cos 2\\pi t,\\ \\sin 2\\pi t\\right)$. Perché la definizione sia lecita il risultato non deve dipendere dal rappresentante, e infatti $\\cos\\!\\left(2\\pi(t+1)\\right)=\\cos 2\\pi t$ e altrettanto per il seno: la mappa passa al quoziente. Ripetendo su due fattori si ottiene il toro $\\mathbb{T}^2=\\mathbb{R}^2/\\mathbb{Z}^2$, cioè il quadrato $[0,1]^2$ con i lati opposti incollati — lo spazio delle configurazioni del pendolo doppio, dove i due angoli sono definiti a meno di un giro. Le carte si prendono restringendo la proiezione a un quadratino di lato minore di $1$: lì è iniettiva, e la sua inversa dà le coordinate.","debito":"la verifica che il quoziente sia Hausdorff e a base numerabile va fatta caso per caso e qui non c'è: per il toro e per lo spazio proiettivo la si trova in Lee, Examples 1.4 e 1.5. Nel percorso, l'unico movimento che costruisce quozienti in dettaglio è gd-01.","controllo":[{"tipo":"uguale","sinistra":"cos(2*pi*(t+1))","vale":"cos(2*pi*t)","ipotesi":{"t":"real"},"dove":"esempio","appare":"\\cos\\!\\left(2\\pi(t+1)\\right)=\\cos 2\\pi t"},{"tipo":"simbolico","perche":"e' la notazione del quoziente di R^2 per il reticolo degli interi: si sta dando un nome allo spazio costruito, non calcolando un valore","dove":"esempio","appare":"\\mathbb{R}^2/\\mathbb{Z}^2"}]};
STRUM["compattezza"] = {"nome":"Compattezza","riga":"Ogni ricoprimento aperto ammette un sottoricoprimento finito: è la proprietà che permette di passare da «vale vicino a ogni punto» a «vale su tutto», con un numero finito di passi.","serve":"È l'ipotesi che rende globali le conclusioni locali, ed è per questo che ricorre in ogni dimostrazione di geometria differenziale. In $\\mathbb{R}^n$ equivale a chiuso e limitato (Heine-Borel), ma su una varietà quell'equivalenza non si può usare come definizione, perché «limitato» richiede una distanza e una varietà non ne ha una privilegiata. La conseguenza che si usa più spesso è negativa: gli unici sottoinsiemi di $\\mathbb{R}^n$ che sono **insieme** aperti e compatti sono $\\emptyset$ e nient'altro — ed è l'argomento per cui una varietà compatta non può essere coperta da una sola carta.","esempio":"L'intervallo $(0,1)$ non è compatto, e si vede esibendo un ricoprimento senza sottoricoprimento finito: gli aperti $A_n=\\left(\\tfrac1n,1\\right)$ per $n\\ge2$ ricoprono $(0,1)$, perché ogni $x\\gt0$ sta in $A_n$ appena $\\tfrac1n\\lt x$, cioè appena $n\\gt1/x$. Ma una sottofamiglia finita $A_{n_1},\\dots,A_{n_k}$ ha un indice massimo $N$, quindi la sua unione è $\\left(\\tfrac1N,1\\right)$, e il punto $x=\\tfrac1{2N}$ resta fuori: è positivo, dunque sta in $(0,1)$, ed è minore di $\\tfrac1N$. Il conto che regge l'argomento è $\\lim_{n\\to\\infty}\\tfrac1n=0$: gli $A_n$ si avvicinano a coprire tutto, ma nessuno di essi contiene un intorno di $0$, e servirebbero tutti. Chiudendo l'intervallo, $[0,1]$ diventa compatto e quel ricoprimento smette di essere un ricoprimento — $0$ non sta in nessun $A_n$.","debito":"la dimostrazione del teorema di Heine-Borel e la teoria generale degli spazi compatti stanno fuori dal percorso: qui c'è l'uso che se ne fa. Nel corso di Diverio la compattezza entra come ipotesi (sfera, gruppi di Lie compatti) e come conclusione della locale compattezza delle varietà.","controllo":[{"tipo":"limite","espr":"1/n","var":"n","a":"oo","vale":"0","ipotesi":{"n":"positive"},"dove":"esempio","appare":"\\lim_{n\\to\\infty}\\tfrac1n=0"},{"tipo":"disuguaglianza","sinistra":"1/(2*N)","destra":"1/N","relazione":"<","ipotesi":{"N":"positive"},"dove":"esempio","appare":"minore di $\\tfrac1N$"}]};

function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';
  return h;
}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

/* ---------------- 00 · DI COSA PARLA QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Di cosa parla questo movimento', meta:'Geometria Differenziale · voci G.9, G.10 · il movimento piu breve, e il piu usato',
  blocchi:[
  {t:'prosa', title:'Che cosa manca ancora', tag:'architettura', html:R`
  <p>Con gd-02 si sa dire che cosa è una varietà differenziabile. Manca dire che cosa sia una <b>mappa</b> fra due varietà, e senza quello non si può fare niente: non ci sono diffeomorfismi, non c&rsquo;è il differenziale, non ci sono curve.</p>
  <p>C&rsquo;è anche una ragione più profonda per cui questo passo va fatto con attenzione. Fino a qui le varietà sono oggetti isolati: si sa dire che cosa sono, ma non c&rsquo;è modo di <b>confrontarle</b>. Definire le mappe lisce significa dotare la collezione delle varietà di una nozione di morfismo, e quindi poter dire quando due sono «la stessa», quando una sta dentro l&rsquo;altra, quando una è il quoziente di un&rsquo;altra. <b>Una teoria matematica non è fatta di oggetti ma di oggetti e mappe</b>, e questo movimento è dove la seconda metà arriva.</p>
  <p>La definizione è breve e il movimento è il più corto del corso. <b>Ma il suo schema di dimostrazione — definire in carta, verificare che non dipenda dalla carta — è quello che si ripete in ogni movimento successivo</b>, ed è il motivo per cui vale la pena farlo con cura una volta sola.</p>`}

/* ---------------- 01 · LA DEFINIZIONE ---------------- */
{ num:'01', title:'La definizione, e perche e ben posta', meta:'leggere in carte · lindipendenza dalla scelta · continuita automatica · composizione',
  blocchi:[
  {t:'prosa', title:'La definizione', tag:'grammatica', html:R`
  <p>$F:M\to N$ è <b>liscia</b> se per ogni $p\in M$ esistono una carta $(U,\varphi)$ attorno a $p$ e una carta $(V,\psi)$ attorno a $F(p)$, con $F(U)\subseteq V$, tali che
  $$\psi\circ F\circ\varphi^{-1}:\varphi(U)\to\psi(V)$$
  sia liscia <b>come applicazione fra aperti di spazi euclidei</b>. Quest&rsquo;ultima è la nozione dell&rsquo;analisi, già nota: è il punto in cui la teoria si appoggia su ciò che si sa fare.</p>
  <p><b>Perché la definizione non dipende dalle carte scelte.</b> Cambiando carta in partenza si compone con una transizione $\varphi'\circ\varphi^{-1}$, cambiando in arrivo con $\psi'\circ\psi^{-1}$: entrambe <b>lisce</b> per la compatibilità dell&rsquo;atlante (gd-02). La composizione di funzioni lisce fra aperti euclidei è liscia, quindi il verdetto non cambia. <b>Tutta la ragione per cui in gd-02 si è chiesta la compatibilità è questa riga</b>.</p>
  <p>Due conseguenze immediate:</p>
  <ul>
   <li><b>ogni applicazione liscia è continua</b>: in carta è liscia, quindi continua, e le carte con le loro inverse sono <span class="str" data-str="omeomorfismo">omeomorfismi</span>, che la continuità la conservano in entrambi i versi;</li>
   <li><b>la composizione di lisce è liscia</b>, perché in carte è una composizione di lisce euclidee. Quindi le varietà lisce e le mappe lisce formano una categoria — ed è il quadro in cui vive tutto il resto.</li>
  </ul>`}
]},

/* ---------------- 02 · UN ESEMPIO CHE SI CALCOLA ---------------- */
{ num:'02', title:'Un esempio calcolato: la mappa di grado due sulla circonferenza', meta:'z -> z^2 letta nelle carte stereografiche · e cosa dice il conto',
  blocchi:[
  {t:'reveal', title:'Il conto', tag:'costruzione', steps:[
   {label:'La mappa', body:R`
   <p>Si prenda $F:S^1\to S^1$ che «raddoppia l&rsquo;angolo»: identificando $S^1$ con i complessi di modulo 1, è $z\mapsto z^{2}$. È geometricamente chiara; <b>la domanda è se sia liscia secondo la definizione</b>, e la risposta va data leggendola in carta.</p>`},
   {label:'In carta', body:R`
   <p>Nella carta stereografica dal polo nord, il punto di parametro $u$ corrisponde all&rsquo;angolo $\theta=2\arctan u$ (misurato opportunamente). La mappa raddoppia l&rsquo;angolo, e tornando in coordinate si ottiene
   $$u\ \longmapsto\ \frac{2u}{1-u^{2}},$$
   che è $\tan$ dell&rsquo;angolo raddoppiato. <b>È una funzione razionale, liscia dove il denominatore non si annulla</b> — e dove si annulla, cioè in $u=\pm1$, l&rsquo;immagine è il polo nord, che quella carta non copre: lì si usa l&rsquo;altra carta e il conto è analogo.</p>
   <p><b>La morale operativa</b>: la verifica di liscezza si fa <i>a pezzi</i>, cambiando carta dove serve, e i punti in cui una formula esplode sono esattamente quelli in cui la carta non arriva. Se una singolarità restasse <i>dentro</i> il dominio di entrambe le carte, la mappa non sarebbe liscia lì — e quella sarebbe informazione vera, non un problema di conti.</p>`}
  ]},
  {t:'prosa', title:'La transizione, di nuovo', tag:'regola operativa', html:R`
  <p>Il conto usa la transizione $\dfrac1u$ delle carte stereografiche, ed è la terza volta che compare: sarà così per tutto il corso. <b>Le funzioni di transizione non sono un preliminare da sbrigare: sono lo strumento di calcolo</b>. Ogni volta che si verifica qualcosa su una varietà, si finisce per comporre con esse.</p>
  <p><b>E vale la pena osservare che cosa dice il risultato $u\mapsto\dfrac{2u}{1-u^{2}}$ al di là della levigatezza.</b> È la formula di duplicazione della tangente, e il fatto che il denominatore si annulli in $u=\pm1$ non è un difetto: quei due valori corrispondono agli angoli retti, che raddoppiati danno l&rsquo;angolo piatto — cioè il polo escluso da quella carta. <b>La singolarità della formula coincide con il buco della carta, non con un problema della mappa.</b></p>
  <p>Distinguere una singolarità della <i>descrizione</i> da una singolarità dell&rsquo;<i>oggetto</i> è forse l&rsquo;abitudine più utile che questo corso insegna. Ricompare ovunque: le coordinate polari che degenerano nell&rsquo;origine mentre il piano è liscissimo, i meridiani che si affollano ai poli su una carta geografica, e — in relatività generale — la differenza fra l&rsquo;orizzonte di un buco nero, dove esplodono solo le coordinate di Schwarzschild, e la singolarità centrale, dove esplode la geometria. <b>La domanda giusta davanti a un infinito è sempre «di chi è questo infinito»</b>, e la risposta si trova cambiando carta: se l&rsquo;infinito sparisce era della descrizione.</p>`}
]},

/* ---------------- 03 · DIFFEOMORFISMI ---------------- */
{ num:'03', title:'Diffeomorfismi, e le due varieta che sono la stessa', meta:'la definizione · la struttura cubica rivisitata · e quando due varieta sono indistinguibili',
  blocchi:[
  {t:'prosa', title:'La definizione e il criterio', tag:'grammatica', html:R`
  <p>$F:M\to N$ è un <b>diffeomorfismo</b> se è biiettiva, liscia, e con inversa liscia. Due varietà diffeomorfe sono <b>indistinguibili</b> dal punto di vista di questo corso: ogni affermazione differenziale vera per l&rsquo;una lo è per l&rsquo;altra.</p>
  <p><b>Attenzione a non confondere con «biiettiva e liscia»</b>: non basta. L&rsquo;esempio è già noto da gd-02 — la mappa $t\mapsto t^{3}$ da $\mathbb{R}$ in sé è liscia e biiettiva, ma la sua inversa <b>$t\mapsto t^{1/3}$</b> non è liscia in $0$. Non è un diffeomorfismo, pur essendo un omeomorfismo. <b>In analisi lo stesso fenomeno si chiama «derivata nulla»</b>, e il teorema di invertibilità locale (gd-06) dirà esattamente quando l&rsquo;inversa è liscia.</p>
  <p><b>E la ripresa dell&rsquo;esempio di gd-02</b>: $\mathbb{R}$ con la struttura standard e $\mathbb{R}$ con la struttura cubica <i>sono</i> diffeomorfe, ma il diffeomorfismo non è l&rsquo;identità — è proprio $t\mapsto t^{1/3}$, che letto nelle rispettive carte diventa l&rsquo;identità. <b>La domanda giusta non è mai «questa mappa è un diffeomorfismo» ma «ne esiste uno»</b>, e questo movimento è il posto in cui la distinzione diventa operativa.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`$F:\mathbb{R}\to\mathbb{R}$, $F(t)=t^{3}$, è liscia e biiettiva. Perché non è un diffeomorfismo, e che cosa lo impedisce esattamente?`,
    a:R`Perché $F'(0)=0$: il differenziale in $0$ non è invertibile, e per il teorema della funzione inversa nessuna mappa con differenziale singolare in un punto può avere inversa liscia lì. Concretamente, $\frac{d}{dt}t^{1/3}\to\infty$ per $t\to0$. <b>Il criterio pratico è sempre sul differenziale</b>, e sarà il contenuto di gd-06: «biiettiva + differenziale invertibile ovunque» è la condizione giusta.`},
   {q:R`Perché la definizione di mappa liscia richiede $F(U)\subseteq V$?`,
    a:R`Perché altrimenti la composizione $\psi\circ F\circ\varphi^{-1}$ non sarebbe nemmeno <b>definita</b>: $\psi$ è definita solo su $V$. La condizione si può sempre soddisfare restringendo $U$, e per farlo serve la <b>continuità</b> di $F$ — che nella formulazione precisa si richiede a parte, oppure si aggira chiedendo la condizione solo localmente. È un dettaglio, ma è il tipo di dettaglio che all&rsquo;orale distingue chi ha letto la definizione da chi la ricorda.`}
  ]}
]},

/* ---------------- 03a · COSTRUIRE MAPPE LISCE SENZA CONTI ---------------- */
{ num:'03a', title:'Come si dimostra che una mappa e liscia, senza aprire le carte', meta:'la composizione · le mappe su un prodotto · le mappe definite da un quoziente · e le tre scorciatoie che si usano sempre',
  blocchi:[
  {t:'prosa', title:'Verificare in carte e lultima risorsa, non la prima', tag:'metodo', html:R`
  <p>La definizione dice di leggere la mappa in carte e controllare che sia liscia come mappa fra aperti euclidei. È la definizione, e in pratica <b>quasi non si usa mai</b>: le carte sono scomode, e le trasformazioni esplicite lunghe. Ci sono tre scorciatoie che coprono quasi tutti i casi, e conviene averle in mano prima di mettersi a calcolare.</p>
  <p><b>Prima: la composizione.</b> Composizione di mappe lisce è liscia, e la dimostrazione è la regola della catena applicata alle rappresentazioni in coordinate — inserendo una carta intermedia che si semplifica. <b>Da qui quasi tutto</b>: se una mappa si scrive come catena di pezzi noti, è liscia senza altro da dire. La mappa $S^{1}\to S^{1}$ che eleva al quadrato è liscia perché è la composizione dell&rsquo;inclusione in $\mathbb{C}$, del prodotto $z\mapsto z^{2}$ (polinomiale, quindi liscio) e della proiezione sull&rsquo;immagine.</p>
  <p><b>Seconda: le mappe in un prodotto.</b> Una mappa $F:M\to N_1\times N_2$ è liscia <i>se e solo se</i> lo sono le due componenti $F_1$ e $F_2$. È immediato dalla forma delle carte del prodotto, e riduce un problema a due problemi più piccoli. <b>Attenzione al verso</b>: per le mappe <i>uscenti</i> da un prodotto non c&rsquo;è nessun criterio così semplice — la levigatezza separata nelle due variabili non basta, come già in analisi le derivate parziali non bastano per la differenziabilità.</p>
  <p><b>Terza: le mappe definite su un quoziente.</b> Se $M$ è un <span class="str" data-str="quoziente-topologico">quoziente</span> con proiezione $\pi:X\to M$ e si vuole definire $F:M\to N$, si costruisce $\tilde F:X\to N$ che sia costante sulle classi. Allora $F$ esiste, è unica, ed <b>è liscia se e solo se lo è $\tilde F$</b>, a patto che $\pi$ sia una sommersione — cosa che nei quozienti ragionevoli è vera. <b>Si lavora sempre con i rappresentanti</b>, come si faceva per la continuità: l&rsquo;unica cosa da verificare in più è che la definizione non dipenda dal rappresentante.</p>
  <div class="note"><b>La procedura pratica</b>, in ordine di convenienza: (1) la mappa è una restrizione di una mappa liscia dell&rsquo;ambiente? Allora è liscia. (2) È una composizione di mappe già note? Allora è liscia. (3) Arriva in un prodotto? Allora si spezza. (4) Parte da un quoziente? Allora si solleva. <b>Solo se nessuna di queste funziona si aprono le carte</b> — ed è il caso in cui l&rsquo;esercizio sta chiedendo proprio quello.</div>`},
  {t:'prosa', title:'Il fatto che rende tutto piu facile: le sottovarieta ereditano', tag:'regola operativa', html:R`
  <p>C&rsquo;è un risultato che vale la pena isolare perché viene usato continuamente senza essere nominato. Sia $S\subseteq N$ una sottovarietà e $F:M\to N$ una mappa liscia la cui immagine sta dentro $S$. <b>Allora $F$ è liscia anche come mappa $M\to S$.</b></p>
  <p>Sembra ovvio e non lo è: la struttura liscia di $S$ è la sua, non quella di $N$, e a priori una mappa potrebbe essere liscia verso l&rsquo;ambiente e non verso il sottoinsieme. La dimostrazione usa le <b>carte adattate</b>: in una carta di $N$ in cui $S$ è un pezzo di piano coordinato, «dimenticare le ultime coordinate» è una proiezione liscia, e comporre con essa conserva la levigatezza.</p>
  <p><b>La conseguenza pratica è grande</b>: per verificare che una mappa a valori in una sfera, in un gruppo ortogonale, in una grassmanniana sia liscia, <i>basta verificarlo nello spazio ambiente</i>. Una curva $\gamma(t)$ a valori in $S^{2}$ è liscia come curva sulla sfera non appena lo è come curva in $\mathbb{R}^{3}$. <b>È il motivo per cui nessuno, nella pratica, apre mai le carte stereografiche per controllare una mappa</b>.</p>
  <p><b>E l&rsquo;avvertenza speculare</b>, che è il caso in cui il risultato non si applica: se $S$ è soltanto <i>immersa</i> e non incassata — come la retta densa sul toro — l&rsquo;enunciato <b>cade</b>. Lì esistono mappe lisce verso l&rsquo;ambiente, con immagine dentro $S$, che non sono lisce verso $S$ con la sua struttura. È una delle poche patologie del corso, e conoscerla serve soprattutto a sapere dove il ragionamento comodo è lecito.</p>`}
]},

/* ---------------- 03b · IL RANGO DI UNA MAPPA, E IL TEOREMA CHE GOVERNA TUTTO ---------------- */
{ num:'03b', title:'Il rango: lunico numero che decide come si comporta una mappa', meta:'immersioni e sommersioni · il teorema del rango costante · le forme normali · perche tutto il resto del corso ne dipende',
  blocchi:[
  {t:'prosa', title:'Tre parole che classificano le mappe lisce', tag:'grammatica', html:R`
  <p>Una mappa liscia $F:M^{m}\to N^{n}$ ha in ogni punto un <b>rango</b>: quello della matrice jacobiana della sua rappresentazione in coordinate. Il rango non dipende dalle carte — cambiando carta la jacobiana viene moltiplicata a destra e a sinistra per matrici invertibili, che il rango non lo toccano — quindi è una proprietà della mappa e del punto. <b>È il numero che decide tutto il comportamento locale</b>, e le tre situazioni che contano hanno un nome:</p>
  <ul>
   <li><b>immersione</b>: il rango è massimo e vale $m$ (quindi $m\le n$). Il differenziale è <i>iniettivo</i>: la mappa non schiaccia nessuna direzione, e localmente l&rsquo;immagine è una copia di $M$ dentro $N$;</li>
   <li><b>sommersione</b>: il rango è massimo e vale $n$ (quindi $m\ge n$). Il differenziale è <i>suriettivo</i>: la mappa non perde nessuna direzione in arrivo, e le sue fibre sono varietà di dimensione $m-n$;</li>
   <li><b>rango costante $k$</b>, senza che sia massimo: il caso generale, e quello per cui esiste il teorema più forte.</li>
  </ul>
  <p><b>Due esempi minimi, per fissarli.</b> La mappa $t\mapsto(\cos t,\sin t)$ da $\mathbb{R}$ a $\mathbb{R}^{2}$ è un&rsquo;immersione: la derivata $(-\sin t,\cos t)$ non si annulla mai. La proiezione $(x,y)\mapsto x$ da $\mathbb{R}^{2}$ a $\mathbb{R}$ è una sommersione: la jacobiana $(1,0)$ ha rango $1$ ovunque, e le fibre sono le rette verticali. <b>Immersione e sommersione sono la stessa condizione — rango massimo — vista dai due lati</b>, a seconda di quale delle due dimensioni è la più piccola.</p>`},
  {t:'reveal', title:'Il teorema del rango, e perche vale la pena impararne lenunciato esatto', tag:'costruzione', steps:[
   {label:'Lenunciato', body:R`
   <div class="note"><b>Teorema del rango costante.</b> Sia $F:M^{m}\to N^{n}$ liscia con rango <b>costante</b> $k$ in un intorno di $p$. Allora esistono carte $(U,\varphi)$ attorno a $p$ e $(V,\psi)$ attorno a $F(p)$, con $\varphi(p)=0$ e $\psi(F(p))=0$, in cui $F$ si legge</p>
   $$\psi\circ F\circ\varphi^{-1}(x^{1},\dots,x^{m})=(x^{1},\dots,x^{k},0,\dots,0).$$</div>
   <p><b>In parole: a meno di cambiare coordinate in partenza e in arrivo, ogni mappa di rango costante è una proiezione seguita da un&rsquo;inclusione.</b> Non ci sono altri comportamenti possibili. Tutto ciò che di complicato una mappa sembra fare è, localmente, un artefatto della scelta delle coordinate.</p>
   <p><b>L&rsquo;ipotesi di rango costante va letta con attenzione</b>, ed è il punto su cui <b>Lee</b> (capitolo 4) insiste più del docente: non basta che il rango sia $k$ nel punto, deve esserlo in <i>tutto un intorno</i>. Quando il rango è massimo l&rsquo;ipotesi è automatica — il rango non può scendere localmente, perché un minore non nullo resta non nullo per continuità — ma nei casi intermedi va verificata, e se cade il teorema è falso.</p>`},
   {label:'I due casi particolari, che sono quelli che si usano', body:R`
   <p>Quando il rango è massimo l&rsquo;enunciato si specializza, e queste due forme sono ciò che si applica davvero:</p>
   <ul>
    <li><b>immersione</b> ($k=m$): $F$ si legge $(x^{1},\dots,x^{m})\mapsto(x^{1},\dots,x^{m},0,\dots,0)$. Localmente <i>è</i> l&rsquo;inclusione canonica di $\mathbb{R}^{m}$ in $\mathbb{R}^{n}$;</li>
    <li><b>sommersione</b> ($k=n$): $F$ si legge $(x^{1},\dots,x^{m})\mapsto(x^{1},\dots,x^{n})$. Localmente <i>è</i> la proiezione canonica.</li>
   </ul>
   <p>Da qui discende subito il fatto che rende le sommersioni lo strumento più usato del corso: <b>le fibre di una sommersione sono sottovarietà</b> di dimensione $m-n$, perché nella forma normale la fibra è $\{x^{1}=c^{1},\dots,x^{n}=c^{n}\}$, cioè un pezzo di piano coordinato. <b>È il teorema dei valori regolari, e nasce da qui</b>: dire che $c$ è un valore regolare significa esattamente che $F$ è una sommersione in ogni punto della fibra.</p>`},
   {label:'Perche COSTANTE, e non solo in un punto', body:R`
   <p>L&rsquo;ipotesi che il rango sia costante <i>in un intorno</i> non è decorativa. Nel caso di rango massimo è automatica — il rango è semicontinuo inferiormente, cioè non può scendere all&rsquo;improvviso, e se è già al massimo non può nemmeno salire — ma nel caso generale va richiesta.</p>
   <p><b>Il controesempio che lo mostra</b>: $F(x,y)=(x,xy)$ da $\mathbb{R}^{2}$ a $\mathbb{R}^{2}$ ha jacobiana di determinante $x$, quindi rango $2$ per $x\ne0$ e rango $1$ sull&rsquo;asse $y$. Nell&rsquo;origine nessuna forma normale del teorema vale, e infatti l&rsquo;immagine di $F$ — il piano meno l&rsquo;asse $y$, più l&rsquo;origine — non è né un aperto né una sottovarietà. <b>Dove il rango salta, la geometria si rompe</b>, e questo è il motivo per cui in tutto il corso si lavora con ipotesi di rango.</p>`}
  ]},
  {t:'plot', title:'Immersione, sommersione, e una mappa che non e nessuna delle due',
   intro:R`A sinistra l'immagine di $t\mapsto(\cos t,\sin t)$ — un'immersione di $\mathbb{R}$ in $\mathbb{R}^{2}$. A destra $t\mapsto(t^{2}-1,\,t^{3}-t)$, che ha differenziale sempre iniettivo ma non è iniettiva: si autointerseca.`,
   plots:[

   ],
   leggi:R`<p><b>Le due curve sono entrambe immersioni</b> — il vettore tangente non si annulla mai — e questo mostra che «immersione» è una condizione puramente <i>locale</i>: dice come la mappa si comporta vicino a ogni singolo punto del dominio, e non dice niente su cosa succede fra punti lontani.</p>
   <p>Nella figura di destra i valori $t=-1$ e $t=+1$ finiscono nello stesso punto del piano. Vicino a ciascuno dei due, separatamente, la curva è liscia e regolare; ma l'immagine complessiva ha un incrocio, e <b>un incrocio non è una sottovarietà</b> — è lo stesso argomento di connessione locale già usato per la croce e per il cono.</p>
   <p><b>La morale che il corso userà più volte</b>: per ottenere una sottovarietà non basta un'immersione, serve un'<i>immersione iniettiva e propria</i> — dove «propria» chiede in più che le controimmagini dei compatti siano compatte, ed è la condizione che esclude anche la retta densa sul toro. La distinzione fra «immersa» e «incassata» nasce esattamente qui, e vale la pena tenerla ferma da subito: sono due parole diverse perché sono due oggetti diversi.</p>`}
]},

/* ---------------- 03c · ESERCIZI ---------------- */
{ num:'03c', title:'Esercizi — tocca a te', meta:'classificare una mappa con il rango · la proiezione del toro · un diffeomorfismo mancato',
  blocchi:[
  {t:'esercizio', title:'1 · La proiezione del toro sullasse verticale',
   src:'il caso in cui il rango cade, e si vede dove',
   testo:R`Sia $\mathbb{T}^{2}\subset\mathbb{R}^{3}$ il toro di rivoluzione attorno all'asse $z$, e $h:\mathbb{T}^{2}\to\mathbb{R}$ la funzione altezza $h(x,y,z)=z$. Dove $h$ è una sommersione? Che cosa sono le sue fibre, e come cambiano attraversando i punti critici?`,
   steps:[
    {label:'Dove il rango cade', body:R`
    <p>$h$ è la restrizione di una mappa lineare dell'ambiente, quindi è liscia senza conti (scorciatoia numero uno). Il suo differenziale in un punto del toro è la proiezione sulla direzione $z$ <i>ristretta allo spazio tangente</i>: si annulla esattamente dove il piano tangente al toro è <b>orizzontale</b>.</p>
    <p>Sul toro standard questo accade in <b>quattro</b> punti: il massimo assoluto, il minimo assoluto, e due punti di sella — quello più alto del «buco» interno e quello più basso. In tutti gli altri punti $h$ è una sommersione, e le sue fibre sono sottovarietà di dimensione $2-1=1$.</p>`},
    {label:'Come cambiano le fibre', body:R`
    <p>Al variare del livello $c$, la fibra $h^{-1}(c)$ cambia <b>tipo topologico</b> solo attraversando i quattro valori critici:</p>
    <ul>
     <li>sotto il minimo: <b>vuota</b>;</li>
     <li>fra minimo e prima sella: <b>una circonferenza</b>;</li>
     <li>fra le due selle: <b>due circonferenze</b>;</li>
     <li>fra seconda sella e massimo: <b>una circonferenza</b>;</li>
     <li>sopra il massimo: vuota di nuovo.</li>
    </ul>
    <p><b>Questa è la teoria di Morse in miniatura</b>, e il conto dice qualcosa di preciso: i punti critici di una funzione su una varietà compatta «sanno» la sua forma. Per il toro sono quattro e sono di tre tipi (min, due selle, max); per la sfera sarebbero due. L'ipotesi che rende il conto possibile e' la <span class="str" data-str="compattezza">compattezza</span>: su una varieta' non compatta una funzione puo' non avere ne' massimo ne' minimo, e l'argomento cade. <b>La differenza fra due e quattro è la differenza fra sfera e toro</b>, e si legge da una qualunque funzione altezza — il che è sorprendente, perché la funzione dipende da come il toro è messo nello spazio e il risultato no.</p>`}
   ]},
  {t:'plot', title:'La funzione altezza sul toro: dove il rango cade, e come cambiano le fibre',
   intro:R`Sezione del toro nel piano $(\rho,z)$ con $\rho=\sqrt{x^{2}+y^{2}}$, $R=2$, $r=1$. Le rette orizzontali sono i livelli di $h=z$; i quattro valori critici sono quelli in cui la retta è tangente alla sezione.`,
   plots:[
    {kind:'contour', f:'pow(sqrt(x*x+1e-9)-2,2)+y*y', xr:[0.3,3.7], yr:[-1.6,1.6], height:320,
     levels:[1], col:'#5eead4', label:'sezione del toro',
     title:'i quattro livelli critici: min, due selle, max',
     segs:[{x1:0.3, y1:-1, x2:3.7, y2:-1, col:'#ff6b6b', dash:true, width:1.5, label:'z=-r: minimo', lx:2.9, ly:-0.92},
           {x1:0.3, y1:0, x2:3.7, y2:0, col:'#d8a13a', dash:true, width:1.5, label:'z=0: le due selle', lx:2.9, ly:0.08},
           {x1:0.3, y1:1, x2:3.7, y2:1, col:'#b98cff', dash:true, width:1.5, label:'z=+r: massimo', lx:2.9, ly:1.08},
           {x1:0.3, y1:0.6, x2:3.7, y2:0.6, col:'#4d5a6b', width:1.2, label:'un livello regolare', lx:0.5, ly:0.68}]}
   ],
   leggi:R`<p><b>La sezione è una circonferenza, e ogni retta orizzontale la taglia in zero, uno o due punti.</b> Ruotando attorno all'asse, ciascuno di quei punti diventa una circonferenza del toro: ecco perché una fibra regolare è fatta di una o due circonferenze, e perché il numero cambia solo quando la retta è tangente.</p>
   <p>La retta grigia, a $z=0{,}6$, taglia la sezione in due punti — uno a $\rho$ piccolo e uno a $\rho$ grande — e la fibra corrispondente è fatta di <b>due</b> circonferenze, una interna e una esterna al buco. La retta arancione a $z=0$ le taglia entrambe nel punto di tangenza: è il livello in cui le due si fondono, e sono le <b>selle</b>.</p>
   <p><b>Il conto vale per qualunque toro comunque deformato</b>, purché resti un toro: i punti critici possono spostarsi e aumentare, ma la loro combinazione con segno — massimi meno selle più minimi — resta $0$, che è la caratteristica di Eulero del toro. <b>Per la sfera varrebbe $2$.</b> È un invariante topologico ottenuto contando i punti dove una derivata si annulla, ed è il primo assaggio di come l'analisi su una varietà riveli la sua forma.</p>`},
  {t:'esercizio', title:'2 · Una biiezione liscia che non e un diffeomorfismo, in dimensione due',
   src:'per non fidarsi della biiettivita',
   testo:R`Considera $F:\mathbb{R}^{2}\to\mathbb{R}^{2}$ data da $F(x,y)=(x,\,y^{3})$. È liscia? È biunivoca? È un diffeomorfismo? E che cosa dice il rango?`,
   steps:[
    {label:'I tre controlli', body:R`
    <p><b>Liscia</b>: sì, le componenti sono polinomiali. <b>Biunivoca</b>: sì, perché $y\mapsto y^{3}$ lo è sui reali. <b>Diffeomorfismo</b>: no — l'inversa è $(u,v)\mapsto(u,v^{1/3})$, non derivabile dove $v=0$.</p>
    <p>Il rango lo conferma senza guardare l'inversa: la jacobiana è $\begin{pmatrix}1&0\\0&3y^{2}\end{pmatrix}$, di determinante $3y^{2}$, che <b>si annulla su tutta la retta $y=0$</b>. Lì il rango scende a $1$, quindi $F$ non è nemmeno un'immersione in quei punti.</p>`},
    {label:'Cosa si impara', body:R`
    <p><b>Il teorema della funzione inversa dà una condizione sufficiente e locale</b>: se il differenziale è invertibile in $p$, allora $F$ è un diffeomorfismo <i>fra un intorno di $p$ e un intorno di $F(p)$</i>. Qui è invertibile per $y\ne0$, e infatti lì $F$ è un diffeomorfismo locale.</p>
    <p>Ma essere diffeomorfismo locale ovunque e essere biunivoca <b>non implica</b> essere un diffeomorfismo globale, se il differenziale degenera da qualche parte — e qui degenera proprio dove la biiettività non basta a salvare la situazione. <b>La condizione giusta è: biunivoca e differenziale invertibile in ogni punto.</b> Entrambe, e nessuna delle due si deduce dall'altra: la mappa $t\mapsto e^{it}$ da $\mathbb{R}$ a $S^{1}$ ha differenziale sempre invertibile e non è iniettiva; questa è iniettiva e ha differenziale che degenera.</p>`}
   ]},
  {t:'collaudo', title:'Controlla di aver capito', html:R`
  <ol>
  <li>Perché il rango di una mappa non dipende dalle carte scelte?</li>
  <li>Una mappa da una varietà compatta a una connessa, che sia una sommersione, è necessariamente suriettiva. Perché?</li>
  <li>Esiste una sommersione da $S^{2}$ a $\mathbb{R}$?</li>
  </ol>`,
   sol:R`<ol>
   <li>Perché cambiando carta la jacobiana viene sostituita da $B\,J\,A^{-1}$, con $A$ e $B$ jacobiane delle transizioni — che sono <b>invertibili</b>, essendo differenziali di diffeomorfismi. Moltiplicare per matrici invertibili non cambia il rango. <b>È lo stesso argomento con cui in algebra lineare il rango di un'applicazione non dipende dalle basi</b>, ed è il motivo per cui «rango» è una nozione geometrica e non una proprietà della scrittura.</li>
   <li>Perché una sommersione è una <b>mappa aperta</b> — segue dalla forma normale, dove è la proiezione canonica, che è aperta. Quindi l'immagine è un aperto; ma è anche compatta (immagine continua di un compatto) quindi chiusa; e un sottoinsieme non vuoto aperto e chiuso di uno spazio connesso è tutto lo spazio. <b>Aperto e chiuso in un connesso</b> è lo schema che si incontra a ogni capitolo di questo corso.</li>
   <li><b>No</b>, e la risposta segue dal punto precedente. Una sommersione $S^{2}\to\mathbb{R}$ sarebbe suriettiva, ma $\mathbb{R}$ non è compatto mentre l'immagine di $S^{2}$ deve esserlo. <b>Più concretamente</b>: ogni funzione liscia su una varietà compatta ha un massimo, e in quel punto il differenziale si annulla — quindi il rango cade a zero e la sommersione non può essere tale ovunque. <b>La compattezza obbliga a esistere punti critici</b>, ed è l'osservazione da cui parte la teoria di Morse.</li>
   </ol>`}
]},

/* ---------------- 04 · IL SENSO ---------------- */
{ num:'04', title:'Il senso, e le rotte', meta:'cosa apre, e perche questo movimento e cosi corto',
  blocchi:[
  {t:'prosa', title:'Cosa lascia in mano', tag:'sintesi', html:R`
  <p><b>Il punto.</b> Lo schema «definisci in carta, verifica l&rsquo;indipendenza dalla carta» è il motore di tutto il corso, e qui compare nella sua forma più semplice. Da gd-06 in poi lo si userà per il differenziale, per i campi vettoriali, per le parentesi di Lie — <b>e ogni volta la verifica consisterà nel comporre con una transizione e usare la regola della catena</b>.</p>
  <p><b>A valle.</b> gd-05 costruisce le funzioni lisce di cui c&rsquo;è bisogno (bump, partizioni); gd-06 definisce il differenziale di una mappa liscia, cioè la sua approssimazione lineare punto per punto.</p>`},
  {t:'prolessi', title:'Dove riappare questo movimento',
   oggetto:R`<b>La mappa liscia</b>: la nozione di «funzione derivabile» dove non ci sono coordinate privilegiate.`,
   rotte:[
    {dove:'Meccanica<br>analitica', txt:R`I <b>cambi di coordinate lagrangiane</b> sono diffeomorfismi dello spazio delle configurazioni, e l&rsquo;invarianza delle equazioni di Eulero-Lagrange sotto quei cambi è esattamente l&rsquo;indipendenza dalla carta.`},
    {dove:'Relativita<br>generale', txt:R`I <b>diffeomorfismi</b> dello spazio-tempo sono la simmetria di gauge della teoria: due soluzioni legate da un diffeomorfismo descrivono la stessa fisica. È il contenuto dell&rsquo;«argomento del buco» di Einstein.`},
    {dove:'Sistemi<br>dinamici', txt:R`La <b>coniugazione</b> fra due sistemi dinamici è un diffeomorfismo che porta l&rsquo;uno nell&rsquo;altro: classificare i sistemi a meno di coniugazione è il programma di tutta la teoria qualitativa.`},
    {dove:'Topologia<br>differenziale', txt:R`La distinzione fra omeomorfismo e diffeomorfismo e' l'intera questione delle strutture esotiche di gd-02: due varieta' possono essere lo stesso spazio topologico e non la stessa varieta' liscia.`}
   ],
   domanda:R`«Liscia» qui significa $C^\infty$: infinite derivate. Ma in analisi si incontrano spesso funzioni $C^1$ o $C^2$ e basta, e in fisica le soluzioni delle equazioni d&rsquo;onda sono spesso meno che lisce. <b>Domanda che porti avanti:</b> perché la geometria differenziale sceglie $C^\infty$ e non una regolarità finita? La risposta è pragmatica — con $C^\infty$ tutti i teoremi si enunciano senza contare le derivate perse a ogni passaggio, e la classe è chiusa per ogni operazione che serve. <b>Il prezzo è che le varietà «vere» della fisica (soluzioni di equazioni, spazi di configurazione con urti) spesso non lo sono</b>, e trattarle richiede teorie più fini.`}
]}

];

var byId = {}; TAPPE.forEach(function(s){ byId[s.num]=s; });

var VKEY='pm-nucleogd-04-visited';
function loadSeen(){ try{ return new Set(JSON.parse(localStorage.getItem(VKEY)||'[]')); }catch(e){ return new Set(); } }
function saveSeen(s){ try{ localStorage.setItem(VKEY, JSON.stringify(Array.from(s))); }catch(e){} }
var SEEN = loadSeen();

function renderNav(active){
  var nav=document.getElementById('sidebar');
  nav.innerHTML='';
  var h=document.createElement('h2'); h.textContent='Nucleo gd-04 · le tappe'; nav.appendChild(h);
  TAPPE.forEach(function(s){
    var b=document.createElement('button');
    b.className='navitem'+(active===s.num?' active':'')+(SEEN.has(s.num)?' seen':'');
    b.innerHTML='<span class="dot"></span><span class="nx">'+s.num+'</span><span>'+s.title+'</span>';
    b.onclick=function(){ showTappa(s.num); };
    nav.appendChild(b);
  });
}

/* ---- renderer dei blocchi ---- */
function sectionProsa(title, tag, html){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var body=elFromHTML('<div class="open-body">'+html+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function sectionGram(title, rows){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag gramtag">grammatica</span></h3>';
  var inner='<table class="gramtab">';
  rows.forEach(function(r){ inner+='<tr><td class="gs">'+r[0]+'</td><td>'+r[1]+'</td></tr>'; });
  inner+='</table>';
  var body=elFromHTML('<div class="gramwrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
/* --- blocco PLOT: la figura non decora, si legge. Ogni plot porta una chiave di lettura. --- */
function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';
  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
    else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
    else if(b.t==='prolessi') m.appendChild(sectionProlessi(b));
    else if(b.t==='reveal')m.appendChild(sectionReveal(b.title,b.tag,b.steps));
    else if(b.t==='esercizio') m.appendChild(sectionEsercizio(b));
    else if(b.t==='collaudo')  m.appendChild(sectionCollaudo(b.title,b.items));
    else if(b.t==='plot')      m.appendChild(sectionPlot(b));
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}
