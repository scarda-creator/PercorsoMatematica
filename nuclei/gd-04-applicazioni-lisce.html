<style>
  :root{

  *{box-sizing:border-box}

    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;

  .banner{background:var(--panel2);border-bottom:1px solid var(--border);color:var(--muted);

  .navitem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:none;

  .navitem .dot{width:7px;height:7px;border-radius:50%;background:transparent;flex:0 0 7px;
    border:1px solid var(--border);}
  .navitem.seen .dot{background:var(--ok);border-color:var(--ok);}
  .navitem .nx{color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto;}

  /* ---- MAIN ---- */
  .main{flex:1 1 auto;min-width:0;padding:24px 30px 90px;max-width:860px;}

  .sfhead{border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:8px;}

  .meta{color:var(--muted);font-size:.82rem;margin-top:6px;}

  .section{margin:26px 0;}
  .section > h3{font-size:1.02rem;color:var(--accent2);margin:0 0 10px;
    display:flex;align-items:center;gap:10px;}

    border:1px solid var(--border);color:var(--muted);padding:2px 8px;border-radius:20px;
    text-transform:uppercase;}
  /* --- blocchi figura --- */
  .section > h3 .tag.plottag{background:#101f2e;border-color:#1f3c57;color:#7ab8e0;}
  .plot-intro{color:var(--muted);font-size:.95rem;margin:0 0 12px;}
  .plot-row{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;

  .plot-leggi{margin-top:10px;background:var(--panel2);border:1px solid var(--border);

  /* --- figure importate da una dispensa del docente ---
     Stesso vestito dei plot nativi, di proposito: la figura viene dal suo PDF ma e'

  .gramwrap{background:var(--grambg);border:1px solid #1f4d47;border-radius:12px;padding:6px 6px;}

  /* ---- STRUMENTI (repertorio condiviso: la scheda si apre DENTRO la frase) ----

  .str{color:var(--gram);border-bottom:1px dashed var(--gram);cursor:pointer;}
  .str:hover{background:var(--grambg);}
  .str::after{content:"\2666";font-size:.62em;vertical-align:.42em;margin-left:2px;opacity:.8;}

  table.protab{border-collapse:collapse;width:100%;font-size:.92rem;}
  table.protab td{padding:10px 12px;vertical-align:top;border-bottom:1px solid var(--proline);}
  table.protab tr:last-child td{border-bottom:none;}
  table.protab td.pd{white-space:nowrap;color:var(--pro);width:1%;font-weight:700;font-size:.78rem;

  .rstep p:first-of-type{margin-top:0;} .rstep p:last-child{margin-bottom:0;}

  /* ---- COLLAUDO ---- */
  .collaudo-item{background:var(--panel);border:1px solid var(--border);border-radius:12px;

  .cq{margin-bottom:10px;}
  .ca{margin-top:12px;background:var(--okbg);border:1px solid #235c33;border-radius:8px;

  /* ---- PREV / NEXT ---- */
  .prevnext{display:flex;justify-content:space-between;gap:12px;margin-top:40px;

  .pnbtn{flex:1 1 0;background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:12px 16px;cursor:pointer;color:var(--txt);text-align:left;transition:.14s;font:inherit;}
  .pnbtn:hover{border-color:var(--accent);background:var(--panel2);}
  .pnbtn.next{text-align:right;}
  .pnbtn .k{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .pnbtn .t{font-weight:600;color:var(--accent2);}
  .pnbtn:disabled{opacity:.35;cursor:default;border-color:var(--border);background:var(--panel);}

  code{background:var(--panel2);border:1px solid var(--border);border-radius:5px;
    padding:1px 5px;font-size:.85em;color:var(--accent2);}
  .katex{font-size:1.02em;color:var(--txt);} .katex-display{margin:.5em 0;overflow-x:auto;overflow-y:hidden;}

  @media(max-width:860px){
    .shell{flex-direction:column;}
    .sidebar{width:100%;flex:none;position:static;max-height:none;border-right:none;
      border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:4px;}
    .sidebar h2{width:100%;} .navitem{width:auto;}
    .main{padding:20px 16px 80px;}
  }

<script>
"use strict";
const R = String.raw;

function typeset(el){
  if(el && window.renderMathInElement){
    try{ renderMathInElement(el,{delimiters:[
      {left:'$$',right:'$$',display:true},

function elFromHTML(html){ var d=document.createElement('div'); d.innerHTML=html; return d; }

/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un
   rimando scritto nella prosa:

       <span class="str" data-str="serie-geometrica">la serie geometrica</span>

   Le schede citate da questo nucleo sono cucite qui sotto dal montaggio
   (assembla-nucleo.js): la pagina resta autosufficiente — niente fetch,
   niente sottocartelle da pubblicare — e un rimando a una scheda che non
   esiste FERMA la costruzione invece di arrivare in pagina rotto.
   Apertura: lo stesso gesto del collaudo (si clicca, il pannello compare,
   si typeset una volta sola), portato dentro la frase.
   =================================================================== */
var CORSO = 'geometria-differenziale';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["omeomorfismo"] = {"nome":"Omeomorfismo","riga":"Una biiezione continua con inversa continua: due spazi omeomorfi sono lo stesso spazio scritto in due modi, per tutto ciò che la topologia sa vedere.","serve":"È la nozione di «uguale» che si usa quando si dice che una varietà è localmente come $\\mathbb{R}^n$. La richiesta che anche l'inversa sia continua non è pignoleria: senza di essa una biiezione continua può incollare cose lontane — l'applicazione $t\\mapsto(\\cos 2\\pi t,\\sin 2\\pi t)$ da $[0,1)$ alla circonferenza è continua e biunivoca, ma la sua inversa spezza la circonferenza in un punto, e infatti $[0,1)$ e $S^1$ non sono lo stesso spazio (uno è compatto, l'altro no). Le proprietà che si conservano per omeomorfismo — compattezza, connessione, dimensione, gruppo fondamentale — sono esattamente quelle di cui si può parlare su una varietà senza aver scelto una carta.","esempio":"L'intervallo aperto $(0,1)$ e la semiretta $(0,+\\infty)$ sono omeomorfi tramite $f(x)=\\dfrac{x}{1-x}$: è continua su $(0,1)$, manda $0^+$ in $0^+$ e $1^-$ in $+\\infty$, e la sua inversa è $g(y)=\\dfrac{y}{1+y}$, anch'essa continua. Che siano davvero una l'inversa dell'altra si verifica componendo: $g(f(x))=\\dfrac{x/(1-x)}{1+x/(1-x)}=x$. Ne segue che $(0,1)$ è omeomorfo anche a tutto $\\mathbb{R}$ (componendo con $y\\mapsto\\ln y$), il che dice una cosa che all'inizio sorprende: **la lunghezza non è una proprietà topologica**. Non lo è nemmeno l'essere limitato; lo è invece la compattezza, ed è per questo che $[0,1]$ non è omeomorfo a nessuno dei due.","debito":"nessun movimento del percorso tratta la topologia generale come argomento a sé: qui c'è ciò che serve per leggere la definizione di varietà. La classificazione di quali spazi sono omeomorfi a quali è il mestiere della topologia algebrica, e nel corso di Diverio entra solo per la numerabilità del gruppo fondamentale.","controllo":[{"tipo":"uguale","sinistra":"(x/(1-x))/(1+x/(1-x))","vale":"x","ipotesi":{"x":"positive"},"dove":"esempio","appare":"=x"}]};
STRUM["rivestimento"] = {"nome":"Rivestimento","riga":"Una mappa continua suriettiva $\\pi:E\\to B$ è un rivestimento se ogni punto di $B$ ha un intorno $U$ la cui controimmagine è un&rsquo;unione disgiunta di aperti, ciascuno portato da $\\pi$ omeomorficamente su $U$.","serve":"Descrive gli spazi che localmente sono copie di un altro e globalmente si avvolgono attorno ad esso. È il modo in cui il corso incontra la topologia globale senza calcolarla: $S^n$ riveste due volte lo spazio proiettivo, $SU(2)$ riveste due volte $SO(3)$, e in Metodi la funzione logaritmo diventa monodroma sul suo rivestimento. Un laccio della base si solleva in un cammino che può non chiudersi, ed è da lì che vengono gli spin seminteri.","esempio":"La mappa $t\\mapsto e^{2\\pi it}$ dalla retta alla circonferenza: ogni arco piccolo di $S^1$ ha per controimmagine infinite copie disgiunte, una per ogni intero, ciascuna portata sull&rsquo;arco senza strappi: le preimmagini di un punto differiscono per interi, perché $e^{2\\pi i(t+1)}=e^{2\\pi it}$. Il laccio che fa un giro su $S^1$ si solleva al segmento da $0$ a $1$, che non si chiude: è il motivo per cui $S^1$ ha un buco e la retta no.","pieno":{"file":"tp-05-il-quoziente.html","tappa":"07","come":"la proiezione dalla sfera allo spazio proiettivo reale, con la verifica che è un rivestimento doppio e non solo un quoziente"},"controllo":[{"tipo":"uguale","sinistra":"simplify(exp(2*pi*I*(t+1))-exp(2*pi*I*t))","vale":"0","ipotesi":{"t":"real"},"dove":"esempio","appare":"e^{2\\pi i(t+1)}=e^{2\\pi it}","nota":"periodicita': t e t+1 hanno la stessa immagine"}]};
STRUM["compattezza"] = {"nome":"Compattezza","riga":"Ogni ricoprimento aperto ammette un sottoricoprimento finito: è la proprietà che permette di passare da «vale vicino a ogni punto» a «vale su tutto», con un numero finito di passi.","serve":"È l'ipotesi che rende globali le conclusioni locali, ed è per questo che ricorre in ogni dimostrazione di geometria differenziale. In $\\mathbb{R}^n$ equivale a chiuso e limitato (Heine-Borel), ma su una varietà quell'equivalenza non si può usare come definizione, perché «limitato» richiede una distanza e una varietà non ne ha una privilegiata. La conseguenza che si usa più spesso è negativa: gli unici sottoinsiemi di $\\mathbb{R}^n$ che sono **insieme** aperti e compatti sono $\\emptyset$ e nient'altro — ed è l'argomento per cui una varietà compatta non può essere coperta da una sola carta.","esempio":"L'intervallo $(0,1)$ non è compatto, e si vede esibendo un ricoprimento senza sottoricoprimento finito: gli aperti $A_n=\\left(\\tfrac1n,1\\right)$ per $n\\ge2$ ricoprono $(0,1)$, perché ogni $x\\gt0$ sta in $A_n$ appena $\\tfrac1n\\lt x$, cioè appena $n\\gt1/x$. Ma una sottofamiglia finita $A_{n_1},\\dots,A_{n_k}$ ha un indice massimo $N$, quindi la sua unione è $\\left(\\tfrac1N,1\\right)$, e il punto $x=\\tfrac1{2N}$ resta fuori: è positivo, dunque sta in $(0,1)$, ed è minore di $\\tfrac1N$. Il conto che regge l'argomento è $\\lim_{n\\to\\infty}\\tfrac1n=0$: gli $A_n$ si avvicinano a coprire tutto, ma nessuno di essi contiene un intorno di $0$, e servirebbero tutti. Chiudendo l'intervallo, $[0,1]$ diventa compatto e quel ricoprimento smette di essere un ricoprimento — $0$ non sta in nessun $A_n$.","debito":"la dimostrazione del teorema di Heine-Borel e la teoria generale degli spazi compatti stanno fuori dal percorso: qui c'è l'uso che se ne fa. Nel corso di Diverio la compattezza entra come ipotesi (sfera, gruppi di Lie compatti) e come conclusione della locale compattezza delle varietà.","controllo":[{"tipo":"limite","espr":"1/n","var":"n","a":"oo","vale":"0","ipotesi":{"n":"positive"},"dove":"esempio","appare":"\\lim_{n\\to\\infty}\\tfrac1n=0"},{"tipo":"disuguaglianza","sinistra":"1/(2*N)","destra":"1/N","relazione":"<","ipotesi":{"N":"positive"},"dove":"esempio","appare":"minore di $\\tfrac1N$"}]};
STRUM["quoziente-topologico"] = {"nome":"Topologia quoziente","riga":"Si incollano punti dichiarandoli uguali, e si decide che un insieme è aperto nel quoziente quando la sua controimmagine è aperta sopra: è il modo di costruire spazi nuovi senza metterli dentro nessun ambiente.","serve":"È la seconda fabbrica di varietà, accanto ai grafici e ai prodotti, e produce proprio gli esempi che non si vedono come sottoinsiemi di $\\mathbb{R}^n$: il toro, il nastro di Möbius, lo spazio proiettivo. La regola pratica è sempre la stessa: una funzione definita sul quoziente è continua se e solo se, composta con la proiezione, è continua sopra — quindi si lavora sempre con i rappresentanti, controllando che il risultato non dipenda da quale si è scelto. Attenzione: **un quoziente di una varietà non è automaticamente una varietà**, e la proprietà che salta per prima è Hausdorff — la retta con due origini è proprio un quoziente mal riuscito.","esempio":"La circonferenza è $\\mathbb{R}/\\mathbb{Z}$: si dichiarano uguali due numeri che differiscono per un intero, e si manda la classe di $t$ nel punto $\\left(\\cos 2\\pi t,\\ \\sin 2\\pi t\\right)$. Perché la definizione sia lecita il risultato non deve dipendere dal rappresentante, e infatti $\\cos\\!\\left(2\\pi(t+1)\\right)=\\cos 2\\pi t$ e altrettanto per il seno: la mappa passa al quoziente. Ripetendo su due fattori si ottiene il toro $\\mathbb{T}^2=\\mathbb{R}^2/\\mathbb{Z}^2$, cioè il quadrato $[0,1]^2$ con i lati opposti incollati — lo spazio delle configurazioni del pendolo doppio, dove i due angoli sono definiti a meno di un giro. Le carte si prendono restringendo la proiezione a un quadratino di lato minore di $1$: lì è iniettiva, e la sua inversa dà le coordinate.","debito":"la verifica che il quoziente sia Hausdorff e a base numerabile va fatta caso per caso e qui non c'è: per il toro e per lo spazio proiettivo la si trova in Lee, Examples 1.4 e 1.5. Nel percorso, l'unico movimento che costruisce quozienti in dettaglio è function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

{ num:'00', title:'Di cosa parla questo movimento', meta:'Geometria Differenziale · voce G.7 · il movimento che tutti gli altri usano',
  blocchi:[
  {t:'prosa', title:'Che cosa manca ancora', tag:'architettura', html:R`
  <p>Con le strutture lisce si sa dire che cosa è una varietà differenziabile. Manca dire che cosa sia una <b>mappa</b> fra due varietà, e senza quello non si può fare niente: non ci sono diffeomorfismi, non c&rsquo;è il differenziale, non ci sono curve.</p>
  <p>C&rsquo;è anche una ragione più profonda per cui questo passo va fatto con attenzione. Fino a qui le varietà sono oggetti isolati: si sa dire che cosa sono, ma non c&rsquo;è modo di <b>confrontarle</b>. Definire le mappe lisce significa dotare la collezione delle varietà di una nozione di morfismo, e quindi poter dire quando due sono «la stessa», quando una sta dentro l&rsquo;altra, quando una è il quoziente di un&rsquo;altra. <b>Una teoria matematica non è fatta di oggetti ma di oggetti e mappe</b>, e questo movimento è dove la seconda metà arriva.</p>
  <p>La definizione è breve e il movimento è il più corto del corso. <b>Ma il suo schema di dimostrazione — definire in carta, verificare che non dipenda dalla carta — è quello che si ripete in ogni movimento successivo</b>, ed è il motivo per cui vale la pena farlo con cura una volta sola.</p>`}

/* ---------------- 01 · LA DEFINIZIONE ---------------- */
{ num:'01', title:'La definizione, e perche e ben posta', meta:'leggere in carte · l’indipendenza dalla scelta · continuita automatica · composizione',
  blocchi:[
  {t:'prosa', title:'La definizione', tag:'grammatica', html:R`
  <p>$F:M\to N$ è <b>liscia</b> se per ogni $p\in M$ esistono una carta $(U,\varphi)$ attorno a $p$ e una carta $(V,\psi)$ attorno a $F(p)$, con $F(U)\subseteq V$, tali che
  $$\psi\circ F\circ\varphi^{-1}:\varphi(U)\to\psi(V)$$
  sia liscia <b>come applicazione fra aperti di spazi euclidei</b>. In simboli:
  $$F\in C^{\infty}(M,N)\iff\forall p\in M\ \ \exists(U,\varphi)\ni p,\ \exists(V,\psi)\ni F(p)\ \text{con}\ F(U)\subseteq V\ :\ \psi\circ F\circ\varphi^{-1}\in C^{\infty}\big(\varphi(U),\psi(V)\big).$$
  <p>E la cosa che la tappa dimostra, cioè che la definizione non dipende dalle carte, è esattamente uno scambio di quantificatore:</p>
  $$\underbrace{\exists\ \text{una coppia di carte che funziona}}_{\text{quel che basta chiedere}}\quad\iff\quad\underbrace{\forall\ \text{coppia di carte attorno a }p\ \text{e}\ F(p)}_{\text{quel che se ne ottiene}}.$$ Quest&rsquo;ultima è la nozione dell&rsquo;analisi, già nota: è il punto in cui la teoria si appoggia su ciò che si sa fare.</p>
  <p><b>Perché la definizione non dipende dalle carte scelte.</b> Cambiando carta in partenza si compone con una transizione $\varphi'\circ\varphi^{-1}$, cambiando in arrivo con $\psi'\circ\psi^{-1}$: entrambe <b>lisce</b> per la compatibilità dell&rsquo;atlante. La composizione di funzioni lisce fra aperti euclidei è liscia, quindi il verdetto non cambia. <b>Tutta la ragione per cui si è chiesta la compatibilità delle carte è questa riga</b>.</p>
  <p><b>Il caso delle funzioni</b> è quello con $N=\mathbb{R}$, e ha una sola carta in arrivo, l&rsquo;identità: $f:M\to\mathbb{R}$ è liscia se ogni sua lettura $f\circ\varphi^{-1}$ è liscia come funzione su un aperto di $\mathbb{R}^n$.</p>
  <p><b>Questo è lo schema che tornerà per ogni nozione del corso</b>, ed è utile riconoscerlo come schema: si definisce qualcosa in una carta, si verifica che il cambio di carta non alteri la definizione, e da quel momento l&rsquo;oggetto è ben definito sulla varietà. Vale per i vettori tangenti, per i campi, per le forme, per l&rsquo;orientazione. <b>Quando una verifica di questo tipo fallisce, l&rsquo;oggetto non esiste sulla varietà</b> — ed è esattamente quello che succede quando si prova a definire «la derivata seconda» di una funzione senza strutture aggiuntive.</p>
  <p>Due conseguenze immediate:</p>
  <ul>
   <li><b>ogni applicazione liscia è continua</b>: in carta è liscia, quindi continua, e le carte con le loro inverse sono <span class="str" data-str="omeomorfismo">omeomorfismi</span>, che la continuità la conservano in entrambi i versi;</li>
   <li><b>la composizione di lisce è liscia</b>, perché in carte è una composizione di lisce euclidee. Quindi le varietà lisce e le mappe lisce formano una categoria — ed è il quadro in cui vive tutto il resto.</li>
  </ul>`}
]},

  blocchi:[
  {t:'prosa', title:'La dimostrazione, e il passo in cui serve la continuita', tag:'teorema', html:R`
  <p>Lee raccoglie in una proposizione le mappe che sono lisce senza conti (Proposizione 2.10, stampata 36): le costanti, l&rsquo;identità, l&rsquo;inclusione di un aperto, e la <b>composizione</b> di due mappe lisce. Le prime tre si leggono in carta: una costante ha rappresentante costante, l&rsquo;identità e l&rsquo;inclusione hanno per rappresentante una transizione o l&rsquo;identità. La quarta ha una dimostrazione con un passo che vale la pena vedere, ed è quello disegnato nella sua Fig. 2.3.</p>
  <p>Siano $F:M\to N$ e $G:N\to P$ lisce e $p\in M$. Per la liscezza di $G$ ci sono una carta $(V,\theta)$ attorno a $F(p)$ e una $(W,\psi)$ attorno a $G(F(p))$ con $G(V)\subseteq W$ e $\psi\circ G\circ\theta^{-1}$ liscia. Il passo delicato è il successivo: serve una carta $(U,\varphi)$ attorno a $p$ con $F(U)\subseteq V$, altrimenti il rappresentante di $F$ non ha senso dove serve. <b>Qui entra la continuità</b>: siccome $F$ è continua, $F^{-1}(V)$ è un aperto che contiene $p$, e si prende $U$ dentro di esso. Allora
  $$\psi\circ(G\circ F)\circ\varphi^{-1}=\big(\psi\circ G\circ\theta^{-1}\big)\circ\big(\theta\circ F\circ\varphi^{-1}\big)$$
  è una composizione di mappe lisce fra aperti euclidei, e quindi è liscia. Senza continuità $F^{-1}(V)$ potrebbe non contenere nessun intorno di $p$, e non ci sarebbe nessuna carta su cui leggere $F$ dentro $V$: è il motivo per cui la definizione di mappa liscia chiede $F(U)\subseteq V$, e per cui, come Lee dimostra all&rsquo;inizio del capitolo (Proposizione 2.4), una mappa liscia è automaticamente continua.</p>
  <p>Dalla stessa località discendono due fatti che si usano senza nominarli. La liscezza si controlla su un ricoprimento aperto: <b>mappe lisce definite sugli aperti di un ricoprimento, che coincidono sulle intersezioni, si incollano in un&rsquo;unica mappa liscia</b> (Corollario 2.8, il lemma di incollamento). E una mappa a valori in un prodotto è liscia se e solo se lo sono le sue componenti (Proposizione 2.12).</p>`},
  {t:'prosa', title:'L’esempio: il punto del cerchio e la retta che lo contiene', tag:'esempio', html:R`
  <p>Lee costruisce la composizione più istruttiva del capitolo (Esempio 2.13(d)-(f)). L&rsquo;inclusione $\iota:S^{1}\hookrightarrow\mathbb{R}^{2}\setminus\{0\}$ è liscia; la proiezione $\pi:\mathbb{R}^{2}\setminus\{0\}\to\mathbb{RP}^{1}$, che manda un punto nella retta per l&rsquo;origine che lo contiene, è liscia; quindi è liscia la composizione $q=\pi\circ\iota:S^{1}\to\mathbb{RP}^{1}$. Conviene però vedere che cosa fa la dimostrazione su questo esempio.</p>
  <p>Su $S^{1}$ si usa la carta angolo, $t\mapsto(\cos t,\sin t)$. Su $\mathbb{RP}^{1}$ la carta affine $\theta_1$ è definita sulle rette non verticali, $V_1=\{[x:y]:x\neq0\}$, e manda una retta nella sua pendenza, $\theta_1[x:y]=y/x$: è la formula di Lee per $\pi$ in coordinate, nel caso $n=1$. Il rappresentante di $q$ è allora
  $$\theta_1\circ q\,(t)=\frac{\sin t}{\cos t}=\tan t,$$
  ed è definito soltanto dove $\cos t\neq0$. <b>È esattamente l&rsquo;aperto $q^{-1}(V_1)$ della dimostrazione</b>: preso $p$ all&rsquo;angolo $t_0=1{,}2$, la carta di partenza va ristretta a un intervallo attorno a $t_0$ che non arrivi a $\pi/2$, dove il punto del cerchio diventa $(0,1)$ e la sua retta è verticale. Nell&rsquo;altra carta, $\theta_2[x:y]=x/y$ sulle rette non orizzontali, il rappresentante è $\cot t$, e le due letture sono legate dalla transizione $u\mapsto1/u$ di $\mathbb{RP}^{1}$, perché $\tan t\cdot\cot t=1$.</p>
  <p>Il rappresentante è liscio con derivata $1/\cos^{2}t=1+\tan^{2}t$, mai nulla. Ma $q$ non è iniettiva: $\tan(t+\pi)=\tan t$, cioè due punti antipodali del cerchio stanno sulla stessa retta. <b>La composizione di mappe lisce è liscia; la composizione di mappe iniettive sarebbe iniettiva, ma $\pi$ non lo è</b>, ed è lei che identifica gli antipodi.</p>`},
  {t:'plot', title:'Il rappresentante di q nelle due carte del proiettivo',
   intro:R`Il ridisegno della Fig. 2.3 di Lee su $q:S^{1}\to\mathbb{RP}^{1}$. In ascissa l&rsquo;angolo $t$ del punto sul cerchio; in arancione il rappresentante nella carta $\theta_1$, $\tan t$, in viola quello nella carta $\theta_2$, $\cot t$. Il tratto verde sull&rsquo;asse è un intervallo di carta attorno a $t_0=1{,}2$ che sta dentro $q^{-1}(V_1)$.`,
   plots:[
    {kind:'func2d', xr:[-3.1416,3.1416], yr:[-4,4], height:300,
     curves:[{f:'tan(x)', col:'#d8a13a', label:'carta θ₁: tan t'},{f:'1/tan(x)', col:'#b98cff', dash:true, label:'carta θ₂: cot t'}],
     title:'dove una carta del proiettivo perde il punto, l’altra lo prende',
     segs:[{x1:1.5708,y1:-4,x2:1.5708,y2:4,col:'#d8a13a',width:1,dash:true},{x1:-1.5708,y1:-4,x2:-1.5708,y2:4,col:'#d8a13a',width:1,dash:true},
           {x1:0.85,y1:0,x2:1.5,y2:0,col:'#5eead4',width:5}],
     marks:[{x:1.2,y:2.572,col:'#d8a13a',label:'t₀ = 1,2',left:true},{x:-1.9416,y:2.572,col:'#d8a13a',label:'t₀ - π: stessa retta'}]}
   ],
   leggi:R`<p>Le verticali tratteggiate in $t=\pm\pi/2$ sono i due punti del cerchio, $(0,1)$ e $(0,-1)$, che vanno nella retta verticale: lì la carta $\theta_1$ non arriva, e la curva arancione scappa all&rsquo;infinito. La curva viola è definita proprio lì, e ha i suoi poli dove ha zeri l&rsquo;arancione, in $t=0$ e $t=\pm\pi$, cioè sulla retta orizzontale. Ogni retta per l&rsquo;origine è vista da almeno una delle due carte, e la dimostrazione della composizione sceglie per ogni punto quella giusta.</p>
   <p>Il tratto verde è l&rsquo;intervallo di carta $U$ attorno a $t_0=1{,}2$, ristretto in modo che la sua immagine stia in $V_1$: è il passo che richiede la continuità. I due punti segnati, $t_0$ e $t_0-\pi$, hanno lo stesso valore $\tan t_0\approx2{,}57$: sono antipodali, e $q$ li manda nella stessa retta. La curva arancione ha periodo $\pi$, non $2\pi$, ed è il modo in cui il grafico dice che $q$ è due a uno.</p>
   <p>Generale: per comporre due mappe lisce si restringe la carta di partenza alla controimmagine della carta di arrivo, e lì la composizione dei rappresentanti è il rappresentante della composizione. Accidentale: che il rappresentante sia la tangente.</p>`}
]},


/* ---------------- 02 · UN ESEMPIO CHE SI CALCOLA ---------------- */
{ num:'03', title:'Un esempio calcolato: la mappa di grado due sulla circonferenza', meta:'z -> z^2 letta nelle carte stereografiche · e cosa dice il conto',
  blocchi:[
  {t:'reveal', title:'Il conto', tag:'costruzione', steps:[
   {label:'La mappa', body:R`
   <p>Si prenda $F:S^1\to S^1$ che «raddoppia l&rsquo;angolo»: identificando $S^1$ con i complessi di modulo 1, è $z\mapsto z^{2}$. È geometricamente chiara; <b>la domanda è se sia liscia secondo la definizione</b>, e la risposta va data leggendola in carta.</p>`},
   {label:'In carta', body:R`
   <p>Nella carta stereografica dal polo nord, il punto di parametro $u$ corrisponde all&rsquo;angolo $\theta=2\arctan u$ (misurato opportunamente). La mappa raddoppia l&rsquo;angolo, e tornando in coordinate si ottiene
   $$u\ \longmapsto\ \frac{2u}{1-u^{2}},$$
   che è $\tan$ dell&rsquo;angolo raddoppiato. <b>È una funzione razionale, liscia dove il denominatore non si annulla</b> — e dove si annulla, cioè in $u=\pm1$, l&rsquo;immagine è il polo nord, che quella carta non copre: lì si usa l&rsquo;altra carta e il conto è analogo.</p>
   <p><b>La morale operativa</b>: la verifica di liscezza si fa <i>a pezzi</i>, cambiando carta dove serve, e i punti in cui una formula esplode sono esattamente quelli in cui la carta non arriva. Se una singolarità restasse <i>dentro</i> il dominio di entrambe le carte, la mappa non sarebbe liscia lì — e quella sarebbe informazione vera, non un problema di conti.</p>`}
  ]},
  {t:'prosa', title:'La transizione, di nuovo', tag:'regola operativa', html:R`
  <p>Il conto usa la transizione $\dfrac1u$ delle carte stereografiche, ed è la terza volta che compare: sarà così per tutto il corso. <b>Le funzioni di transizione non sono un preliminare da sbrigare: sono lo strumento di calcolo</b>. Ogni volta che si verifica qualcosa su una varietà, si finisce per comporre con esse.</p>
  <p><b>E vale la pena osservare che cosa dice il risultato $u\mapsto\dfrac{2u}{1-u^{2}}$ al di là della levigatezza.</b> È la formula di duplicazione della tangente, e il fatto che il denominatore si annulli in $u=\pm1$ non è un difetto: quei due valori corrispondono agli angoli retti, che raddoppiati danno l&rsquo;angolo piatto — cioè il polo escluso da quella carta. <b>La singolarità della formula coincide con il buco della carta, non con un problema della mappa.</b></p>
  <p>Distinguere una singolarità della <i>descrizione</i> da una singolarità dell&rsquo;<i>oggetto</i> è forse l&rsquo;abitudine più utile che questo corso insegna. Ricompare ovunque: le coordinate polari che degenerano nell&rsquo;origine mentre il piano è liscissimo, i meridiani che si affollano ai poli su una carta geografica, e — in relatività generale — la differenza fra l&rsquo;orizzonte di un buco nero, dove esplodono solo le coordinate di Schwarzschild, e la singolarità centrale, dove esplode la geometria. <b>La domanda giusta davanti a un infinito è sempre «di chi è questo infinito»</b>, e la risposta si trova cambiando carta: se l&rsquo;infinito sparisce era della descrizione.</p>`},
  {t:'plot', title:'La mappa di grado due letta nella carta angolo',
   intro:R`La rappresentazione locale di $z\mapsto z^2$ nella carta angolo: $\theta\mapsto2\theta$ modulo $2\pi$. È lo schema della definizione di Lee (Fig. 2.2): si legge la mappa fra una carta del dominio e una carta dell'arrivo.`,
   plots:[
    {kind:'curve', x:'t', y:'2*t', tr:[0,3.1416], height:290, equal:true,
     xr:[-0.2,6.6], yr:[-0.2,6.6],
     title:'due tratti di pendenza 2: ogni arco del cerchio d’arrivo ha due controimmagini',
     segs:[{x1:3.1416,y1:0,x2:6.2832,y2:6.2832,col:'#d8a13a',width:2.2},
           {x1:0,y1:2.2,x2:6.4,y2:2.2,col:'#8ea0b8',dash:true},{x1:0,y1:3.0,x2:6.4,y2:3.0,col:'#8ea0b8',dash:true},
           {x1:1.1,y1:0,x2:1.5,y2:0,col:'#c084fc',width:3.2},{x1:4.2516,y1:0,x2:4.6516,y2:0,col:'#c084fc',width:3.2}],
     marks:[{x:1.3,y:2.6,col:'#c084fc',label:'un arco d’arrivo'},{x:4.4516,y:2.6,col:'#c084fc'}]}
   ],
   leggi:R`<p>Sull'asse orizzontale l'angolo $\theta$ del punto di partenza, sul verticale l'angolo $2\theta$ del punto d'arrivo, riportato in $[0,2\pi)$. Il grafico è fatto di due segmenti paralleli di pendenza $2$: la rappresentazione locale è lineare, quindi liscia, e il salto fra i due segmenti è solo il taglio della carta d'arrivo, non un difetto della mappa. La fascia fra le due rette tratteggiate è un arco del cerchio d'arrivo; le sue controimmagini, in viola sull'asse, sono due archi disgiunti, ciascuno portato sull'arco d'arrivo da un diffeomorfismo. È la definizione di <span class="str" data-str="rivestimento">rivestimento</span> liscio a due fogli, letta sul grafico. Generale: una mappa è liscia se le sue rappresentazioni locali lo sono. Accidentale: il fattore due.</p>`},
  {t:'prosa', title:'Diffeomorfismo locale, proprio, quindi rivestimento', tag:'teorema', html:R`
  <p>Lee definisce un <b>rivestimento liscio</b> come una mappa liscia e suriettiva in cui ogni punto d'arrivo ha un intorno la cui controimmagine è un'unione disgiunta di aperti, ciascuno portato sull'intorno da un <b>diffeomorfismo</b>, non soltanto da un omeomorfismo (stampata 91; Fig. 4.5). Un rivestimento liscio è in particolare un diffeomorfismo locale. Il viceversa è falso in generale — la restrizione di $z\mapsto z^2$ a un arco aperto è un diffeomorfismo locale suriettivo sull'immagine ma non un rivestimento — e Lee dà un criterio che basta (Proposizione 4.46, stampata 94; Fig. 4.6): <b>un diffeomorfismo locale proprio fra varietà connesse è un rivestimento liscio</b>. L'idea è che, sopra un punto $q$, la controimmagine è compatta per la propriezza e discreta perché $F$ è un diffeomorfismo locale, quindi finita, $\{p_1,\dots,p_k\}$; si prendono intorni disgiunti dei $p_i$ su cui $F$ è un diffeomorfismo, e la propriezza garantisce che, rimpicciolendo l'intorno di $q$, la sua controimmagine stia tutta dentro di essi. La mappa di grado due sul cerchio è il caso più semplice: è un diffeomorfismo locale, perché la derivata nella carta angolo vale $$\frac{d}{d\theta}(2\theta)=2\neq0,$$ ed è propria perché il cerchio è compatto.</p>`}
]},

/* ---------------- 03 · DIFFEOMORFISMI ---------------- */
{ num:'04', title:'Diffeomorfismi, e le due varieta che sono la stessa', meta:'la definizione · la struttura cubica rivisitata · e quando due varieta sono indistinguibili',
  blocchi:[
  {t:'prosa', title:'La definizione e il criterio', tag:'grammatica', html:R`
  <p>$F:M\to N$ è un <b>diffeomorfismo</b> se è biiettiva, liscia, e con inversa liscia.
  $$F\ \text{diffeomorfismo}\iff F\ \text{biiettiva},\ F\in C^{\infty}(M,N),\ F^{-1}\in C^{\infty}(N,M).$$ Due varietà diffeomorfe sono <b>indistinguibili</b> dal punto di vista di questo corso: ogni affermazione differenziale vera per l&rsquo;una lo è per l&rsquo;altra.</p>
  <p><b>Attenzione a non confondere con «biiettiva e liscia»</b>: non basta. L&rsquo;esempio è la mappa $t\mapsto t^{3}$ da $\mathbb{R}$ in sé è liscia e biiettiva, ma la sua inversa <b>$t\mapsto t^{1/3}$</b> non è liscia in $0$. La trappola in una riga:
  $$F\ \text{biiettiva e}\ F\in C^{\infty}\ \not\Longrightarrow\ F^{-1}\in C^{\infty};\qquad F(t)=t^{3}:\ \ F'(0)=0\ \ \text{e}\ \ \big(F^{-1}\big)'(s)=\tfrac{1}{3}s^{-2/3}\xrightarrow[s\to0]{}\infty.$$ Non è un diffeomorfismo, pur essendo un omeomorfismo. <b>In analisi lo stesso fenomeno si chiama «derivata nulla»</b>, e il <b>teorema di invertibilità locale</b> dell&rsquo;Analisi dice esattamente quando l&rsquo;inversa è liscia: se la jacobiana del rappresentante locale di $F$ è invertibile nel punto, allora $F$ è un diffeomorfismo fra un intorno di $p$ e un intorno di $F(p)$ — il teorema si applica in carta, e la conclusione non dipende dalla carta perché i cambi di carta sono diffeomorfismi. È un enunciato <i>locale</i>, e la distinzione conta: $t\mapsto t^3$ ha derivata non nulla in ogni $t\neq0$ e lì è davvero un diffeomorfismo locale; il guasto sta tutto nel solo punto in cui la derivata si annulla.</p>
  <p><b>E la ripresa dell&rsquo;esempio della carta cubica</b>: $\mathbb{R}$ con la struttura standard e $\mathbb{R}$ con la struttura cubica <i>sono</i> diffeomorfe, ma il diffeomorfismo non è l&rsquo;identità — è proprio $t\mapsto t^{1/3}$, che letto nelle rispettive carte diventa l&rsquo;identità. <b>La domanda giusta non è mai «questa mappa è un diffeomorfismo» ma «ne esiste uno»</b>, e questo movimento è il posto in cui la distinzione diventa operativa.</p>
  <p>La relazione fra le due nozioni di «stesso spazio», scritta per intero: diffeomorfe implica omeomorfe, e il viceversa è falso,
  $$M\cong N\ (\text{diffeomorfe})\ \Longrightarrow\ M\approx N\ (\text{omeomorfe}),\qquad M\approx N\ \not\Longrightarrow\ M\cong N .$$
  La relazione di diffeomorfismo sta alle varietà lisce come l&rsquo;omeomorfismo sta agli spazi topologici e l&rsquo;isomorfismo agli spazi vettoriali. <b>E l&rsquo;esistenza di un diffeomorfismo non è la sua ovvietà</b>: il piano $\mathbb{R}^{2}$ e il disco aperto sono diffeomorfi, benché uno sia «infinito» e l&rsquo;altro «limitato», perché la limitatezza non è una nozione differenziale. Serve una metrica per distinguerli, e in questo corso non c&rsquo;è.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`$F:\mathbb{R}\to\mathbb{R}$, $F(t)=t^{3}$, è liscia e biiettiva. Perché non è un diffeomorfismo, e che cosa lo impedisce esattamente?`,
    a:R`Perché $F'(0)=0$, e nessuna mappa con jacobiana singolare in un punto può avere inversa liscia lì: se $F^{-1}$ fosse derivabile in $0$, la regola della catena applicata a $F^{-1}\circ F=\mathrm{id}$ darebbe $(F^{-1})'(0)\cdot F'(0)=1$, e il secondo fattore è zero. Concretamente, $\frac{d}{dt}t^{1/3}\to\infty$ per $t\to0$. <b>Il criterio pratico è sempre sulla jacobiana in carta</b>, e la condizione giusta è «biiettiva + jacobiana invertibile ovunque», non «biiettiva + liscia».`},
   {q:R`Perché la definizione di mappa liscia richiede $F(U)\subseteq V$?`,
    a:R`Perché altrimenti la composizione $\psi\circ F\circ\varphi^{-1}$ non sarebbe nemmeno <b>definita</b>: $\psi$ è definita solo su $V$. La condizione si può sempre soddisfare restringendo $U$, e per farlo serve la <b>continuità</b> di $F$ — che nella formulazione precisa si richiede a parte, oppure si aggira chiedendo la condizione solo localmente. È un dettaglio, ma è il tipo di dettaglio che all&rsquo;orale distingue chi ha letto la definizione da chi la ricorda.`}
  ]},
  {t:'plot', title:'La mappa cubica: biunivoca, liscia, e non un diffeomorfismo',
   intro:R`$y=x^{3}$ e la sua inversa $y=x^{1/3}$. La prima è liscia ovunque; la seconda ha tangente verticale nell'origine, cioè derivata infinita.`,
   plots:[
    {kind:'func2d', xr:[-2,2], yr:[-2,2], height:330, equal:true,
     title:'la cubica e piatta nell’origine, la sua inversa e verticale: li si rompe',
     xlabel:'x', ylabel:'y',
     curves:[
      {f:'x*x*x', col:'#5eead4', width:2.6, label:'y = x^3 (liscia)'},
      {f:'x>=0 ? pow(x,1.0/3.0) : -pow(-x,1.0/3.0)', col:'#d8a13a', width:2.6, label:'y = x^(1/3) (non derivabile in 0)'},
      {f:'x', col:'#4d5a6b', width:1.4, dash:true, label:'bisettrice'}
     ],
     marks:[{x:0, y:0, label:'qui la derivata si annulla e l’inversa esplode', col:'#ff6b6b', up:true}]}
   ],
   leggi:R`<p><b>Le due curve sono l'una il riflesso dell'altra rispetto alla bisettrice</b>, come sempre per una funzione e la sua inversa. Ed è proprio la riflessione a rendere visibile il problema: dove la cubica ha tangente <i>orizzontale</i>, l'inversa ha tangente <i>verticale</i>, cioè derivata infinita.</p>
   <p>La condizione che distingue un diffeomorfismo è quindi locale e si legge sulla derivata: <b>serve che non si annulli mai</b>. È il caso unidimensionale di una condizione che nel caso generale diventa «la jacobiana è invertibile in ogni punto», cioè il determinante jacobiano non nullo — la stessa ipotesi del teorema della funzione inversa.</p>
   <p><b>Perché questo esempio conta più di quanto sembri</b>: mostra che la struttura liscia è più fine di quella topologica. Le due funzioni sono <i>omeomorfismi</i> entrambe, e per la topologia sono equivalenti; per il calcolo differenziale no. <b>Ogni volta che si aggiunge struttura, si distinguono cose che prima erano identiche</b> — ed è per questo che il corso costruisce a strati invece di partire dal caso più ricco.</p>`}
]},

{ num:'05', title:'Il disco e il piano: un diffeomorfismo esplicito', meta:'l’Esempio 2.14 di Lee · la verifica che le due mappe sono inverse · perche la limitatezza non e una nozione differenziale',
  blocchi:[
  {t:'prosa', title:'Le due mappe, e la verifica', tag:'esempio', html:R`
  <p>Si è detto che il piano e il disco aperto sono diffeomorfi benché uno sia limitato e l&rsquo;altro no. Lee lo dimostra con due formule (Esempio 2.14(a), stampata 38): sulla palla aperta $\mathbb{B}^{n}=\{|x|\lt1\}$ e su $\mathbb{R}^{n}$ si pongono
  $$F(x)=\frac{x}{\sqrt{1-|x|^{2}}},\qquad G(y)=\frac{y}{\sqrt{1+|y|^{2}}}.$$
  Entrambe sono lisce, perché sotto la radice c&rsquo;è una quantità strettamente positiva — $1-|x|^{2}\gt0$ sulla palla aperta, $1+|y|^{2}\gt0$ ovunque — e la radice di una funzione positiva liscia è liscia. $G$ ha valori nella palla, perché $|G(y)|^{2}=|y|^{2}/(1+|y|^{2})\lt1$.</p>
  <p>Che siano una l&rsquo;inversa dell&rsquo;altra si vede con due identità. Da una parte
  $$1+|F(x)|^{2}=1+\frac{|x|^{2}}{1-|x|^{2}}=\frac{1}{1-|x|^{2}},$$
  quindi $G(F(x))=F(x)\,\sqrt{1-|x|^{2}}=x$. Dall&rsquo;altra
  $$1-|G(y)|^{2}=1-\frac{|y|^{2}}{1+|y|^{2}}=\frac{1}{1+|y|^{2}},$$
  quindi $F(G(y))=G(y)\,\sqrt{1+|y|^{2}}=y$. Un controllo numerico per $n=1$: $F(\tfrac12)=\tfrac12\big/\sqrt{3/4}=1/\sqrt3$, e $G(1/\sqrt3)=\tfrac{1}{\sqrt3}\big/\sqrt{4/3}=\tfrac12$.</p>
  <p>Nel caso $n=1$ la derivata di $F$ è
  $$F'(x)=\frac{1}{(1-x^{2})^{3/2}},$$
  sempre positiva e infinita agli estremi: la mappa stira l&rsquo;intervallo sempre di più man mano che ci si avvicina al bordo, e lo stiramento senza limite è ciò che porta un intervallo limitato su tutta la retta. <b>Ogni proprietà che un diffeomorfismo conserva è invisibile alla limitatezza</b>: distanza, diametro, volume non sono nozioni di questo corso, perché per definirle serve una metrica.</p>`},
  {t:'plot', title:'Il disco aperto spalmato sul piano',
   intro:R`A sinistra il caso $n=1$: la mappa $F(x)=x/\sqrt{1-x^{2}}$ dall&rsquo;intervallo $(-1,1)$ alla retta, e la sua inversa $G$. A destra il caso $n=2$ visto per cerchi: il cerchio di raggio $r$ nel disco va nel cerchio di raggio $r/\sqrt{1-r^{2}}$ nel piano.`,
   plots:[
    {kind:'func2d', xr:[-3,3], yr:[-3,3], height:270,
     curves:[{f:'abs(x)<1 ? x/sqrt(1-x*x) : NaN', col:'#d8a13a', label:'F: (-1,1) → R'},{f:'x/sqrt(1+x*x)', col:'#b98cff', label:'G: R → (-1,1)'},{f:'x', col:'#8ea0b8', dash:true, label:'bisettrice'}],
     title:'F e G sono simmetriche rispetto alla bisettrice: una è l’inversa dell’altra',
     marks:[{x:0.5,y:0.5774,col:'#d8a13a',label:'F(1/2) = 1/√3',left:true,up:true},{x:0.5774,y:0.5,col:'#b98cff',label:'G(1/√3) = 1/2'}]},
    {kind:'curve', x:'cos(t)', y:'sin(t)', tr:[0,6.2832], height:270, equal:true, xr:[-2.2,2.2], yr:[-2.2,2.2],
     title:'i cerchi di raggio 1/2 e 4/5 nel disco (pieni) e le loro immagini (tratteggiate)',
     rings:[{r:0.5,col:'#5eead4'},{r:0.8,col:'#d8a13a'},{r:0.5774,col:'#5eead4',dash:true},{r:1.3333,col:'#d8a13a',dash:true}],
     marks:[{x:0.8,y:0,col:'#d8a13a',label:'r = 4/5'},{x:1.3333,y:0,col:'#d8a13a',label:'4/3'}]}
   ],
   leggi:R`<p>A sinistra le due curve sono l&rsquo;una la riflessa dell&rsquo;altra rispetto alla bisettrice tratteggiata: è il modo in cui si vede sul grafico che due funzioni reali sono inverse. La curva arancione ha due asintoti verticali in $x=\pm1$ — il bordo del disco, che non appartiene al dominio — e quella viola due asintoti orizzontali in $y=\pm1$, gli stessi punti visti dall&rsquo;altra parte.</p>
   <p>A destra la mappa rispetta i cerchi centrati nell&rsquo;origine e li allarga: il cerchio di raggio $\tfrac12$ va in quello di raggio $1/\sqrt3\approx0{,}58$, appena più grande, ma quello di raggio $\tfrac45$ va in quello di raggio $\tfrac43$, ed è il cerchio unitario, che non fa parte del disco, a finire all&rsquo;infinito. <b>Tutto il piano sta dentro il disco, compresso verso il bordo</b>.</p>
   <p>Generale: la limitatezza dipende da una distanza, e i diffeomorfismi non conservano distanze. Accidentale: la forma particolare $x/\sqrt{1-|x|^{2}}$, che si potrebbe sostituire con molte altre, per esempio con la tangente nel caso $n=1$.</p>`}
]},


{ num:'06', title:'Strutture diverse, varieta uguali: la cubica rivista e le sfere esotiche', meta:'la struttura cubica e diffeomorfa alla standard · Milnor e le sette sfere · che cosa cambia per questo corso',
  blocchi:[
  {t:'prosa', title:'Strutture diverse, varieta uguali: la cubica, rivista', tag:'idea', html:R`
   <p>Eppure le due varietà <b>sono diffeomorfe</b>: basta usare la mappa $t\mapsto t^{1/3}$ invece dell&rsquo;identità, e quella è liscia <i>come mappa fra le due strutture</i> — perché letta nelle rispettive carte diventa l&rsquo;identità. <b>La domanda giusta non è «l&rsquo;identità è liscia?» ma «esiste un diffeomorfismo?»</b>, e qui la risposta è sì.</p>
   <p>La morale vale per tutto il corso: <b>due strutture lisce diverse sullo stesso spazio topologico possono dare varietà indistinguibili</b>. Contare le strutture ha senso solo <i>a meno di diffeomorfismo</i>.</p>`},
  {t:'prosa', title:'Quando la risposta e no: le strutture esotiche, dimensione per dimensione', tag:'sintesi', html:R`
  <p>La domanda «uno stesso spazio topologico può portare strutture lisce non diffeomorfe?» ha una risposta che dipende in modo sorprendente dalla dimensione, e vale la pena conoscerla perché dice <b>dove</b> questo corso lavora al sicuro.</p>
  <ul>
   <li><b>Dimensioni 1, 2, 3</b>: ogni varietà topologica ammette una struttura liscia, ed è <b>unica a meno di diffeomorfismo</b>. Per le curve e le superfici, «continuo» e «liscio» classificano le stesse cose. È il risultato che permette di disegnare senza preoccuparsi;</li>
   <li><b>Dimensione $\ge5$</b>: su una varietà compatta le strutture possibili sono in <b>numero finito</b> e si contano con strumenti di topologia algebrica. La prima scoperta fu di Milnor nel 1956, che costrui' una sfera esotica di dimensione sette; Kervaire e Milnor contarono poi che <b>$S^{7}$ ammette 28 strutture lisce distinte</b> (a meno di diffeomorfismo che preserva l'orientazione), non diffeomorfe fra loro — sfere che topologicamente sono la sfera a sette dimensioni e differenzialmente no. Il risultato fu talmente inatteso che aprì un intero campo;</li>
   <li><b>Dimensione 4</b>: il caso patologico, e l&rsquo;unico. Esistono varietà topologiche a quattro dimensioni che <b>non ammettono nessuna</b> struttura liscia, e su $\mathbb{R}^{4}$ — soltanto lì, non su $\mathbb{R}^{n}$ per $n\ne4$ — esiste una famiglia <b>più che numerabile</b> di strutture lisce a due a due non diffeomorfe.</li>
  </ul>
  <p><b>Il fatto che l&rsquo;anomalia stia proprio in dimensione quattro</b>, quella dello spazio-tempo, è una di quelle coincidenze che i fisici trovano difficili da ignorare e i matematici considerano un accidente della teoria. Le tecniche che dimostrano il risultato — invarianti di Donaldson, poi di Seiberg-Witten — vengono, non per caso, dalla teoria dei campi di gauge.</p>`},
  {t:'prosa', title:'Che cosa cambia per questo corso: niente, e perche saperlo', tag:'regola operativa', html:R`
  <p>La conclusione operativa è rassicurante: <b>nel corso di Diverio tutto questo non serve mai</b>. Le varietà che si incontrano — sfere, tori, spazi proiettivi, grassmanniane, gruppi di Lie — hanno una struttura liscia <i>naturale</i>, costruita esplicitamente, e nessuna ambiguità. Quando si dice «la sfera» si intende quella con l&rsquo;atlante stereografico, e nessuno propone alternative.</p>
  <p><b>Ma saperlo serve a due cose, entrambe pratiche.</b> La prima: capire perché la definizione è stata data <i>così</i>, con la struttura come dato aggiuntivo e non come conseguenza della topologia. Se ogni varietà topologica avesse una e una sola struttura liscia, tutto il movimento sarebbe superfluo e basterebbe <span class="str" data-str="omeomorfismo">l&rsquo;omeomorfismo</span>. La seconda: riconoscere il confine fra ciò che la topologia vede e ciò che vede il calcolo differenziale — un confine che in questo corso si attraversa continuamente.</p>
  <p><b>E c&rsquo;è una domanda da orale che nasce esattamente qui</b>, e che conviene saper affrontare: «una varietà <span class="str" data-str="compattezza">compatta</span> ammette sempre una struttura liscia?». La risposta è no in dimensione quattro, sì in tutte le altre fino a tre, e in dimensione alta è una domanda con una teoria dietro. <b>La risposta giusta a una domanda del genere non è un numero: è saper dire in quale regime si sta</b>, e questa tappa serve a saperlo dire.</p>
  <div class="note"><b>Una nota di metodo sul corso.</b> Diverio costruisce le varietà per <i>esibizione</i>: carte esplicite, transizioni calcolate, verifica. Non usa mai il teorema di esistenza né la classificazione, e questo è coerente con un corso che finisce dentro le equazioni differenziali su varietà invece che dentro la topologia algebrica. <b>Il metodo espositivo è anche il metodo d&rsquo;esame</b>: agli scritti si chiede di esibire e verificare, non di invocare teoremi di struttura.</div>`}
]},


/* ---------------- 03a · COSTRUIRE MAPPE LISCE SENZA CONTI ---------------- */
{ num:'07', title:'Come riconoscere che una mappa e liscia, senza aprire le carte', meta:'la composizione · le mappe su un prodotto · le mappe definite da un quoziente · e le tre scorciatoie che si usano sempre',
  blocchi:[
  {t:'prosa', title:'Verificare in carte e l’ultima risorsa, non la prima', tag:'metodo', html:R`
  <p>La definizione dice di leggere la mappa in carte e controllare che sia liscia come mappa fra aperti euclidei. È la definizione, e in pratica <b>quasi non si usa mai</b>: le carte sono scomode, e le trasformazioni esplicite lunghe. Ci sono tre scorciatoie che coprono quasi tutti i casi, e conviene averle in mano prima di mettersi a calcolare.</p>
  <p><b>Prima: la composizione.</b> Composizione di mappe lisce è liscia, e la dimostrazione è la regola della catena applicata alle rappresentazioni in coordinate — inserendo una carta intermedia che si semplifica. <b>Da qui quasi tutto</b>: se una mappa si scrive come catena di pezzi noti, è liscia senza altro da dire.
  $$F\in C^{\infty}(M,N)\ \ \text{e}\ \ G\in C^{\infty}(N,P)\ \Longrightarrow\ G\circ F\in C^{\infty}(M,P).$$ La mappa $S^{1}\to S^{1}$ che eleva al quadrato è liscia perché è la composizione dell&rsquo;inclusione in $\mathbb{C}$, del prodotto $z\mapsto z^{2}$ (polinomiale, quindi liscio) e della proiezione sull&rsquo;immagine.</p>
  <p><b>Seconda: le mappe in un prodotto.</b> Una mappa $F:M\to N_1\times N_2$ è liscia <i>se e solo se</i> lo sono le due componenti $F_1$ e $F_2$. È immediato dalla forma delle carte del prodotto, e riduce un problema a due problemi più piccoli.
  $$F:M\to N_1\times N_2\ \text{liscia}\iff\forall i\in\{1,2\}\ \ \pi_i\circ F\ \text{liscia}.$$ <b>Attenzione al verso</b>: per le mappe <i>uscenti</i> da un prodotto non c&rsquo;è nessun criterio così semplice — la levigatezza separata nelle due variabili non basta, come già in analisi le derivate parziali non bastano per la differenziabilità.</p>
  <p><b>Terza: le mappe definite su un quoziente.</b> Se $M$ è un <span class="str" data-str="quoziente-topologico">quoziente</span> con proiezione $\pi:X\to M$ e si vuole definire $F:M\to N$, si costruisce $\tilde F:X\to N$ che sia costante sulle classi. Allora $F$ esiste, è unica, ed <b>è liscia se e solo se lo è $\tilde F$</b>, a patto che $\pi$ sia una sommersione — cosa che nei quozienti ragionevoli è vera. <b>Si lavora sempre con i rappresentanti</b>, come si faceva per la continuità: l&rsquo;unica cosa da verificare in più è che la definizione non dipenda dal rappresentante.</p>
  <div class="note"><b>La procedura pratica</b>, in ordine di convenienza: (1) la mappa è una restrizione di una mappa liscia dell&rsquo;ambiente? Allora è liscia. (2) È una composizione di mappe già note? Allora è liscia. (3) Arriva in un prodotto? Allora si spezza. (4) Parte da un quoziente? Allora si solleva. <b>Solo se nessuna di queste funziona si aprono le carte</b> — ed è il caso in cui l&rsquo;esercizio sta chiedendo proprio quello.</div>`},
  {t:'prosa', title:'Il fatto che rende tutto piu facile: le sottovarieta ereditano', tag:'regola operativa', html:R`
  <p>C&rsquo;è un risultato che vale la pena isolare perché viene usato continuamente senza essere nominato. Sia $S\subseteq N$ una sottovarietà e $F:M\to N$ una mappa liscia la cui immagine sta dentro $S$. <b>Allora $F$ è liscia anche come mappa $M\to S$.</b></p>
  <p>Sembra ovvio e non lo è: la struttura liscia di $S$ è la sua, non quella di $N$, e a priori una mappa potrebbe essere liscia verso l&rsquo;ambiente e non verso il sottoinsieme. La dimostrazione usa le <b>carte adattate</b>: in una carta di $N$ in cui $S$ è un pezzo di piano coordinato, «dimenticare le ultime coordinate» è una proiezione liscia, e comporre con essa conserva la levigatezza.</p>
  <p><b>La conseguenza pratica è grande</b>: per verificare che una mappa a valori in una sfera, in un gruppo ortogonale, in una grassmanniana sia liscia, <i>basta verificarlo nello spazio ambiente</i>. Una curva $\gamma(t)$ a valori in $S^{2}$ è liscia come curva sulla sfera non appena lo è come curva in $\mathbb{R}^{3}$. <b>È il motivo per cui nessuno, nella pratica, apre mai le carte stereografiche per controllare una mappa</b>.</p>
  <p><b>E l&rsquo;avvertenza speculare</b>, che è il caso in cui il risultato non si applica: se $S$ è soltanto <i>immersa</i> e non incassata — come la retta densa sul toro — l&rsquo;enunciato <b>cade</b>. Lì esistono mappe lisce verso l&rsquo;ambiente, con immagine dentro $S$, che non sono lisce verso $S$ con la sua struttura. È una delle poche patologie del corso, e conoscerla serve soprattutto a sapere dove il ragionamento comodo è lecito.</p>`}
]},

/* ---------------- 03b · IL RANGO DI UNA MAPPA, E IL TEOREMA CHE GOVERNA TUTTO ---------------- */
/* ---------------- 03c · ESERCIZI ---------------- */
{ num:'08', title:'Esercizi — tocca a te', meta:'una biiezione liscia che non e un diffeomorfismo · e tre domande di controllo',
  blocchi:[
  {t:'esercizio', title:'2 · Una biiezione liscia che non e un diffeomorfismo, in dimensione due',
   src:'per non fidarsi della biiettivita',
   testo:R`Considera $F:\mathbb{R}^{2}\to\mathbb{R}^{2}$ data da $F(x,y)=(x,\,y^{3})$. È liscia? È biunivoca? È un diffeomorfismo? E che cosa dice il rango?`,
   steps:[
    {label:'I tre controlli', body:R`
    <p><b>Liscia</b>: sì, le componenti sono polinomiali. <b>Biunivoca</b>: sì, perché $y\mapsto y^{3}$ lo è sui reali. <b>Diffeomorfismo</b>: no — l'inversa è $(u,v)\mapsto(u,v^{1/3})$, non derivabile dove $v=0$.</p>
    <p>Il rango lo conferma senza guardare l'inversa: la jacobiana è $\begin{pmatrix}1&0\\0&3y^{2}\end{pmatrix}$, di determinante $3y^{2}$, che <b>si annulla su tutta la retta $y=0$</b>. Lì il rango scende a $1$, e la jacobiana non è invertibile.</p>`},
    {label:'Cosa si impara', body:R`
    <p><b>Il teorema della funzione inversa dà una condizione sufficiente e locale</b>: se la jacobiana è invertibile in $p$, allora $F$ è un diffeomorfismo <i>fra un intorno di $p$ e un intorno di $F(p)$</i>. Qui è invertibile per $y\ne0$, e infatti lì $F$ è un diffeomorfismo locale.</p>
    <p>Ma essere diffeomorfismo locale ovunque e essere biunivoca <b>non implica</b> essere un diffeomorfismo globale, se la jacobiana degenera da qualche parte — e qui degenera proprio dove la biiettività non basta a salvare la situazione. <b>La condizione giusta è: biunivoca e jacobiana invertibile in ogni punto.</b> Entrambe, e nessuna delle due si deduce dall'altra: la mappa $t\mapsto e^{it}$ da $\mathbb{R}$ a $S^{1}$ ha derivata in carta mai nulla e non è iniettiva; questa è iniettiva e ha jacobiana che degenera.</p>`}
   ]},
  {t:'collaudo', title:'Controlla di aver capito', html:R`
  <ol>
   <li>Perché la composizione di due diffeomorfismi è un diffeomorfismo?</li>
   <li>La mappa $q:S^{1}\to\mathbb{RP}^{1}$ che manda un punto nella retta che lo contiene è liscia e suriettiva. È un diffeomorfismo? E $S^{1}$ e $\mathbb{RP}^{1}$ sono diffeomorfi?</li>
   <li>Perché $\mathbb{R}$ e l&rsquo;intervallo $(-1,1)$ sono diffeomorfi, mentre $\mathbb{R}$ e $[-1,1]$ non sono nemmeno omeomorfi?</li>
  </ol>`,
  sol:R`<ol>
   <li>Se $F:M\to N$ e $G:N\to P$ sono diffeomorfismi, $G\circ F$ è liscia per la Proposizione 2.10(d) di Lee, è biiettiva, e la sua inversa è $(G\circ F)^{-1}=F^{-1}\circ G^{-1}$, composizione di due mappe lisce, quindi liscia. <b>Le varietà lisce con i diffeomorfismi si comportano come gli spazi vettoriali con gli isomorfismi</b>: «essere diffeomorfe» è una relazione di equivalenza.</li>
   <li>No: $q$ manda due punti antipodali nella stessa retta, quindi non è iniettiva. Ma i due spazi sono diffeomorfi lo stesso, con un&rsquo;altra mappa: la retta che forma l&rsquo;angolo $t$ con l&rsquo;asse orizzontale si manda nel punto $(\cos2t,\ \sin2t)$. L&rsquo;angolo raddoppiato non distingue $t$ da $t+\pi$, quindi la mappa è ben definita sulle rette, e in carta è $t\mapsto2t$, liscia con inversa liscia. <b>Che una mappa data non sia un diffeomorfismo non dice niente sull&rsquo;esistenza di un altro</b>: è la distinzione dell&rsquo;inizio della tappa sui diffeomorfismi.</li>
   <li>Il diffeomorfismo è $x\mapsto x/\sqrt{1-x^{2}}$, il caso $n=1$ dell&rsquo;Esempio 2.14 di Lee. Con $[-1,1]$ invece non c&rsquo;è niente da fare già in topologia: $[-1,1]$ è compatto e $\mathbb{R}$ no, e la compattezza passa alle immagini continue. <b>Gli estremi esclusi sono ciò che il diffeomorfismo spinge all&rsquo;infinito</b>; un estremo incluso non si può spingere da nessuna parte.</li>
  </ol>`}
]},

/* ---------------- 04 · IL SENSO ---------------- */
{ num:'09', title:'Il senso, e le rotte', meta:'cosa apre, e perche questo movimento e cosi corto',
  blocchi:[
  {t:'prosa', title:'Cosa lascia in mano', tag:'sintesi', html:R`
  <p><b>Il punto.</b> Lo schema «definisci in carta, verifica l&rsquo;indipendenza dalla carta» è il motore di tutto il corso, e qui compare nella sua forma più semplice. Da qui in poi lo si userà per il differenziale, per i campi vettoriali, per le parentesi di Lie — <b>e ogni volta la verifica consisterà nel comporre con una transizione e usare la regola della catena</b>.</p>
  <p><b>A valle.</b> Restano da costruire le funzioni lisce di cui c&rsquo;è bisogno (bump, partizioni) e da definire il differenziale di una mappa liscia, cioè la sua approssimazione lineare punto per punto.</p>`},
  {t:'prolessi', title:'Dove riappare questo movimento',
   oggetto:R`<b>La mappa liscia</b>: la nozione di «funzione derivabile» dove non ci sono coordinate privilegiate.`,
   rotte:[
    {dove:'Meccanica<br>analitica', txt:R`I <b>cambi di coordinate lagrangiane</b> sono diffeomorfismi dello spazio delle configurazioni, e l&rsquo;invarianza delle equazioni di Eulero-Lagrange sotto quei cambi è esattamente l&rsquo;indipendenza dalla carta.`},
    {dove:'Relativita<br>generale', txt:R`I <b>diffeomorfismi</b> dello spazio-tempo sono la simmetria di gauge della teoria: due soluzioni legate da un diffeomorfismo descrivono la stessa fisica. È il contenuto dell&rsquo;«argomento del buco» di Einstein.`},
    {dove:'Sistemi<br>dinamici', txt:R`La <b>coniugazione</b> fra due sistemi dinamici è un diffeomorfismo che porta l&rsquo;uno nell&rsquo;altro: classificare i sistemi a meno di coniugazione è il programma di tutta la teoria qualitativa.`},
    {dove:'Topologia<br>differenziale', txt:R`La distinzione fra omeomorfismo e diffeomorfismo e' l'intera questione delle strutture esotiche della tappa 06, un settore intero della matematica, e il caso di $\mathbb{R}^4$ e' stato risolto con strumenti nati in fisica — le equazioni di Yang-Mills e di Seiberg-Witten: due varieta' possono essere lo stesso spazio topologico e non la stessa varieta' liscia.`}
   ],
   domanda:R`«Liscia» qui significa $C^\infty$: infinite derivate. Ma in analisi si incontrano spesso funzioni $C^1$ o $C^2$ e basta, e in fisica le soluzioni delle equazioni d&rsquo;onda sono spesso meno che lisce. <b>Domanda che porti avanti:</b> perché la geometria differenziale sceglie $C^\infty$ e non una regolarità finita? La risposta è pragmatica — con $C^\infty$ tutti i teoremi si enunciano senza contare le derivate perse a ogni passaggio, e la classe è chiusa per ogni operazione che serve. <b>Il prezzo è che le varietà «vere» della fisica (soluzioni di equazioni, spazi di configurazione con urti) spesso non lo sono</b>, e trattarle richiede teorie più fini.`}
]}

];

function sectionProlessi(b){

  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionSvelabile(title, tag, html, sol){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var c=document.createElement('div'); c.className='collaudo-item';
  var q=document.createElement('div'); q.className='cq'; q.innerHTML=html||'';
  c.appendChild(q); typeset(q);
  if(sol){
    var a=document.createElement('div'); a.className='ca'; a.style.display='none';
    a.innerHTML='<b>Soluzione.</b> '+sol;
    var btn=document.createElement('button'); btn.className='reveal-btn small';
    btn.textContent='Rivela la soluzione';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a);
      btn.disabled=true; btn.classList.add('done'); btn.textContent='Soluzione rivelata'; };
    c.appendChild(btn); c.appendChild(a);
  }
  wrap.appendChild(c); return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    /* DUE SCHEMI, NON UNO — scoperto il 2026-10-06 provando le pagine vive. I movimenti
       scritti per primi (em-01..03, me-10b, i collaudi di gd-01..09 e di quattro em)
       usano una forma piu' semplice: `reveal` e `prolessi` con un solo `html`,
       `esercizio` e `collaudo` con `html` + `sol`. Il renderer ne conosceva una sola e
       chiamava `steps.forEach` su `undefined`: TypeError, e la tappa si fermava li' —
       62 blocchi in 17 movimenti su 74. Non si riscrive il contenuto per far contento
       il renderer: e' il renderer che deve leggere cio' che c'e'.
       E in fondo un ramo che NON muore: uno schema nuovo di domani deve far vedere un
       avviso in quella sezione, non spegnere la pagina sotto di se'. */
    try{
      if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
      else if(b.t==='prolessi') m.appendChild(b.rotte ? sectionProlessi(b)
                                   : sectionProsa(b.title,'prolessi',b.html));
      else if(b.t==='reveal')m.appendChild(b.steps ? sectionReveal(b.title,b.tag,b.steps)
                                   : sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='esercizio') m.appendChild(b.steps ? sectionEsercizio(b)
                                   : sectionSvelabile(b.title,'esercizio',b.html,b.sol));
      else if(b.t==='collaudo')  m.appendChild(b.items ? sectionCollaudo(b.title,b.items)
                                   : sectionSvelabile(b.title,'provi, poi riveli',b.html,b.sol));
      else if(b.t==='plot')      m.appendChild(sectionPlot(b));
      else m.appendChild(sectionProsa(b.title||'(blocco)', 'tipo sconosciuto: '+b.t,
                                      b.html||''));
    }catch(err){
      var avv=document.createElement('section'); avv.className='section';
      avv.innerHTML='<h3>'+(b.title||'(blocco)')+'<span class="tag">non reso</span></h3>'
        +'<p style="color:#ff6b6b">Questo blocco non si &egrave; potuto rendere ('
        +b.t+': '+err.message+'). Il resto della tappa continua sotto.</p>';
      m.appendChild(avv);
    }
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* I POP-UP DEGLI STRUMENTI. `cablaStrumenti` esisteva dal 18-09 e non la chiamava
     nessuno: i 229 rimandi del percorso erano <span> senza handler, e il clic non
     faceva niente. Nessun controllo poteva vederlo — la sintassi era valida, le schede
     c'erano tutte, le formule rendevano: il guasto esisteva solo a pagina viva. Qui, e
     dopo ogni inserimento successivo, perche' la tappa si rimonta da capo a ogni
     cambio e gli handler vanno riattaccati al DOM nuovo. */
  cablaStrumenti(m);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}

/* deep-link: gd-04-applicazioni-lisce.html#03 apre direttamente la tappa 03 */
window.addEventListener('DOMContentLoaded', function(){
  var h=(location.hash||'').replace('#','');
  showTappa(byId[h]?h:'00');
});
window.addEventListener('hashchange', function(){
  var h=(location.hash||'').replace('#','');
  if(byId[h]) showTappa(h);
});
</script>
