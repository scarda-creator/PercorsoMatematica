"use strict";
const R = String.raw;

function typeset(el){
  if(el && window.renderMathInElement){

/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un
   rimando scritto nella prosa:

       <span class="str" data-str="serie-geometrica">la serie geometrica</span>

   Le schede citate da questo nucleo sono cucite qui sotto dal montaggio
   (assembla-nucleo.js): la pagina resta autosufficiente — niente fetch,
   niente sottocartelle da pubblicare — e un rimando a una scheda che non
   esiste FERMA la costruzione invece di arrivare in pagina rotto.
   Apertura: lo stesso gesto del collaudo (si clicca, il pannello compare,
   si typeset una volta sola), portato dentro la frase.
   =================================================================== */
var CORSO = 'elettromagnetismo';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};


function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';
  return h;
}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

/* ---------------- 01 · LA MAGNETIZZAZIONE ---------------- */
{ num:'01', title:'La magnetizzazione e le correnti amperiane', meta:'M come densita di momento magnetico · perche compaiono correnti superficiali · il cilindro magnetizzato',
  blocchi:[
  {t:'prosa', title:'M, e cosa produce', tag:'costruzione', html:R`
  <p>Ogni atomo ha un momento magnetico — dovuto al moto orbitale degli elettroni e al loro spin — e in un materiale magnetizzato questi momenti non sono più orientati a caso. Si definisce
  $$\vec M=\frac{d\vec m}{dV},$$
  la densità di momento di dipolo magnetico, che si misura in A/m.</p>
  <p>Ora l&rsquo;argomento «i dipoli vicini si cancellano» va rifatto per le spire. Ogni dipolo è una piccola spira di corrente; <b>due spire adiacenti hanno correnti opposte sul lato in comune e si elidono</b>. Ciò che sopravvive è una corrente <b>lungo la superficie esterna</b> del materiale:
  $$\vec J_m=\nabla\times\vec M\ \text{(nel volume)},\qquad \vec K_m=\vec M\times\hat n\ \text{(sulla superficie)}.$$
  <b>Sono correnti vere</b> — fanno campo magnetico esattamente come quelle di un filo — ma non le controlliamo e non passano da nessun generatore. Esattamente il ruolo che in em-05 avevano le cariche di polarizzazione.</p>
  <div class="note"><b>L&rsquo;immagine da tenere</b>: un cilindro uniformemente magnetizzato lungo il suo asse è indistinguibile, dall&rsquo;esterno, da un <b>solenoide</b> con corrente superficiale $K_m=M$. Questo è letteralmente ciò che è un magnete permanente: un solenoide in cui la corrente non è alimentata da niente, perché sono gli spin degli elettroni ad essere allineati. La formula $B=\mu_0nI$ di em-08 diventa $B=\mu_0M$ dentro il cilindro, e la calamita del frigo è quel conto.</div>`}
]},

/* ---------------- 02 · IL VETTORE H ---------------- */
{ num:'02', title:'Il vettore H: nascondere le correnti che non conosciamo', meta:'la definizione · Ampere per H · mezzi lineari · e il nome sbagliato che confonde tutti',
  blocchi:[
  {t:'prosa', title:'La costruzione, identica a quella di D', tag:'costruzione', html:R`
  <p>La legge di Ampère vale con <b>tutte</b> le correnti: $\nabla\times\vec B=\mu_0(\vec J_{\text{lib}}+\vec J_m)$. Sostituendo $\vec J_m=\nabla\times\vec M$ e portando a sinistra:
  $$\nabla\times\left(\frac{\vec B}{\mu_0}-\vec M\right)=\vec J_{\text{lib}}.$$
  Si battezza la combinazione:
  $$\vec H=\frac{\vec B}{\mu_0}-\vec M\quad\Longrightarrow\quad \oint\vec H\cdot d\vec\ell=I_{\text{lib}},$$
  e <b>la circuitazione di $\vec H$ conta solo le correnti che hai messo tu</b>, quelle nei fili. Per un mezzo lineare $\vec M=\chi_m\vec H$ e
  $$\vec B=\mu_0(1+\chi_m)\vec H=\mu_0\mu_r\vec H,\qquad \mu_r=1+\chi_m.$$</p>
  <div class="note"><b>Il nome è una trappola storica.</b> $\vec H$ viene spesso chiamato «campo magnetico» e $\vec B$ «induzione magnetica», il che è esattamente al contrario di quel che conta: <b>il campo fisico è $\vec B$</b> — è lui che compare nella forza di Lorentz e nel flusso che genera la fem. $\vec H$ è una contabilità, come $\vec D$. La convenzione dei nomi risale a quando si pensava per analogia con le cariche magnetiche, e nessuno l&rsquo;ha più cambiata. <b>Quando un testo dice «campo magnetico» conviene sempre guardare quale simbolo usa.</b></div>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Un solenoide con $n$ spire per metro e corrente $I$, riempito di un materiale con $\mu_r$. Quanto valgono $H$ e $B$ dentro?`,
    a:R`$H=nI$ — <b>e non dipende dal materiale</b>, perché la circuitazione di $\vec H$ vede solo la corrente nei fili. Poi $B=\mu_0\mu_rnI$. <b>È lo stesso schema di em-05</b>: si calcola prima il campo «contabile» con la simmetria, e solo dopo si moltiplica per la costante del materiale. Un nucleo di ferro con $\mu_r\sim5000$ moltiplica per cinquemila il campo a parità di corrente, ed è tutto il motivo per cui esistono i trasformatori e le elettrocalamite.`}
  ]}
]},

/* ---------------- 03 · LE TRE SPECIE ---------------- */
{ num:'03', title:'Diamagnetismo, paramagnetismo, ferromagnetismo', meta:'mu_r<1, poco >1, enorme · lorigine microscopica · listeresi · perche il ferro perde le sue proprieta scaldandolo',
  blocchi:[
  {t:'prosa', title:'Le tre risposte, e da dove vengono', tag:'grammatica', html:R`
  <ul>
   <li><b>Diamagnetismo</b> ($\chi_m<0$, $\mu_r$ appena sotto 1). È <b>universale</b>: presente in ogni materiale. L&rsquo;origine è l&rsquo;induzione a livello atomico — applicando un campo, le orbite elettroniche si modificano in modo da <i>opporsi</i> alla variazione, ed è la legge di Lenz (em-10) scritta sugli atomi. L&rsquo;effetto è debolissimo ($\chi_m\sim-10^{-5}$) e viene mascherato quando ci sono gli altri due, ma <b>è la sola forma di magnetismo che respinge</b>: è per questo che si può far levitare una rana in un campo abbastanza intenso.</li>
   <li><b>Paramagnetismo</b> ($\chi_m>0$ piccolo). Richiede atomi con momento magnetico <b>permanente</b> non compensato. Il campo tende ad allinearli, l&rsquo;agitazione termica li disordina, e il compromesso dà $\chi_m\propto1/T$ — la <b>legge di Curie</b>. È il primo esempio in questo corso di una competizione fra ordine energetico e disordine termico, ed è esattamente il problema che la meccanica statistica risolve con il modello di Langevin.</li>
   <li><b>Ferromagnetismo</b> ($\mu_r$ fino a $10^5$, e non lineare). I momenti si allineano <b>spontaneamente</b>, anche senza campo esterno, per un&rsquo;interazione fra vicini che <b>non è magnetica</b> ma di scambio, cioè quantistica: nasce dal principio di esclusione. Sopra una temperatura critica — il <b>punto di Curie</b>, 770&nbsp;°C per il ferro — l&rsquo;ordine si rompe e il materiale diventa un paramagnete ordinario.</li>
  </ul>`},
  {t:'prosa', title:'Listeresi, e perche il ferro RICORDA', tag:'idea', html:R`
  <p>In un ferromagnete $\vec B$ non è una funzione di $\vec H$: <b>dipende dalla storia</b>. Aumentando $H$ da zero si sale lungo la curva di prima magnetizzazione fino alla <b>saturazione</b>; tornando indietro $B$ non ripercorre la stessa strada e a $H=0$ resta un valore non nullo, la <b>magnetizzazione residua</b> — è il magnete permanente. Per annullarla serve un campo opposto, il <b>campo coercitivo</b>.</p>
  <p><b>Il ciclo di isteresi racchiude un&rsquo;area, e quell&rsquo;area è energia dissipata per ciclo</b>: in un trasformatore, che percorre il ciclo cinquanta volte al secondo, è una perdita da minimizzare, e per questo si usano materiali «dolci» con ciclo stretto. Per un magnete permanente si vuole l&rsquo;opposto: ciclo largo, che resiste alla smagnetizzazione.</p>
  <div class="note"><b>Perché questa tappa riappare in Meccanica Statistica</b>, e vale la pena saperlo ora: il ferromagnetismo è il sistema su cui si studia la <b>transizione di fase</b> per eccellenza (modello di Ising). La magnetizzazione spontanea che compare sotto $T_c$ è il <b>parametro d&rsquo;ordine</b>, e la rottura spontanea di simmetria che qui è un fatto sperimentale è, là, l&rsquo;esempio didattico fondamentale — e da lì arriva fino alla teoria dei campi.</div>`},
  {t:'plot', title:'Le tre risposte e il ciclo di isteresi',
   intro:R`A sinistra $B$ contro $H$ per i tre tipi (pendenze in scala arbitraria, per renderle visibili sullo stesso grafico). A destra il ciclo di isteresi di un ferromagnete.`,
   plots:[
    {kind:'func2d', xr:[0,2], yr:[0,2.6], height:300,
     title:'B contro H: dia sotto la retta del vuoto, para appena sopra, ferro molto sopra e curvo',
     xlabel:'H', ylabel:'B',
     curves:[
      {f:'x', col:'#4d5a6b', width:1.6, dash:true, label:'vuoto (mu_r=1)'},
      {f:'0.8*x', col:'#4c8dff', width:2.0, label:'diamagnete (esagerato)'},
      {f:'1.25*x', col:'#5eead4', width:2.0, label:'paramagnete (esagerato)'},
      {f:'2.4*tanh(1.4*x)', col:'#d8a13a', width:2.4, label:'ferromagnete: satura'}
     ]},
    {kind:'curve', x:'1.2*sin(t)+0.55*sin(t)*cos(t)', y:'2.2*tanh(1.6*(1.2*sin(t)))+0.75*cos(t)',
     tr:[0,6.2832], xr:[-2.1,2.1], yr:[-3.2,3.2], height:300,
     title:'il ciclo di isteresi: larea e lenergia persa a ogni giro',
     xlabel:'H', ylabel:'B',
     segs:[{x1:-2.1, y1:0, x2:2.1, y2:0, col:'#4d5a6b', width:1},
           {x1:0, y1:-3.2, x2:0, y2:3.2, col:'#4d5a6b', width:1}],
     marks:[{x:0, y:0.75, label:'residua: B senza H', col:'#d8a13a', left:true},
            {x:-0.44, y:0, label:'coercitivo', col:'#ff9b6b'}]}
   ],
   leggi:R`<b>A sinistra</b>: diamagnete e paramagnete sono rette (risposta lineare) appena sotto e appena sopra quella del vuoto — nella realtà le tre sarebbero indistinguibili, e qui le pendenze sono esagerate per renderle visibili. Il ferromagnete è un&rsquo;altra cosa: parte molto più ripido e poi <b>satura</b>, perché quando tutti i momenti sono allineati non ce ne sono altri da allineare.<br><br>
   <b>A destra</b> il fatto che rende il ferromagnete diverso in natura e non solo in grado: la curva <b>non è una funzione</b>. A ogni valore di $H$ corrispondono due valori di $B$, a seconda da che parte stai arrivando — il materiale <i>ricorda</i>. I due punti segnati sono quelli che ogni esercizio chiede: la <b>magnetizzazione residua</b> (campo che resta a corrente spenta: è il magnete permanente) e il <b>campo coercitivo</b> (quanto campo opposto serve per azzerarlo). L&rsquo;area racchiusa è l&rsquo;energia persa per ciclo, ed è il motivo per cui un trasformatore scalda anche a vuoto.`}
]},

/* ---------------- 04 · IL SENSO ---------------- */
{ num:'04', title:'Il senso, e le rotte', meta:'cosa chiude, cosa apre, e perche il magnetismo della materia e quantistico',
  blocchi:[
  {t:'prosa', title:'Cosa lascia in mano', tag:'sintesi', html:R`
  <p><b>A monte.</b> em-08 dava il campo delle correnti; qui la materia diventa essa stessa una distribuzione di correnti. La mossa di contabilità è la stessa di em-05, e chi l&rsquo;ha capita là non ha quasi niente di nuovo da imparare qui.</p>
  <p><b>Il punto, ed è onesto dirlo.</b> Il magnetismo della materia <b>non si spiega classicamente</b>. Il teorema di Bohr-van Leeuwen dimostra che in fisica classica, all&rsquo;equilibrio termico, la magnetizzazione è <b>esattamente zero</b> — sempre. Tutto ciò che questa tappa descrive esiste solo perché esistono lo spin e il principio di esclusione. Le formule si usano; la spiegazione arriva in meccanica quantistica.</p>
  <p><b>A valle.</b> em-10 usa $\vec B$ nei materiali per il flusso e l&rsquo;induzione; em-11 completa le quattro equazioni, che nei mezzi si scrivono con $\vec D$ e $\vec H$; e in Meccanica Statistica il ferromagnete diventa il modello di Ising.</p>`},
  {t:'prolessi', title:'Dove riappare questo movimento, nella fisica che farai',
   oggetto:R`<b>La risposta magnetica della materia</b>: momenti microscopici che si allineano, e la competizione fra ordine e temperatura.`,
   rotte:[
    {dove:'Meccanica<br>statistica', txt:R`Il <b>modello di Ising</b> è questa tappa ridotta all&rsquo;osso: spin che interagiscono coi vicini, temperatura che disordina, e una <b>transizione di fase</b> a $T_c$. La magnetizzazione è il parametro d&rsquo;ordine, e gli esponenti critici attorno a $T_c$ sono gli stessi di sistemi completamente diversi (universalità).`},
    {dove:'Meccanica<br>quantistica', txt:R`Il momento magnetico dell&rsquo;elettrone è legato allo <b>spin</b>, che non è una corrente che gira; il paramagnetismo di Pauli, il diamagnetismo di Landau e l&rsquo;interazione di scambio sono tutti effetti quantistici. Il teorema di Bohr-van Leeuwen dice che <b>senza quantistica non ci sarebbe magnetismo</b>.`},
    {dove:'Risonanza<br>magnetica', txt:R`Gli spin nucleari in campo si separano in livelli (effetto Zeeman) e assorbono a una frequenza precisa: è la NMR, ed è la risonanza magnetica degli ospedali. Il campo uniforme che serve si fa con bobine come quelle di em-08.`},
    {dove:'Astrofisica', txt:R`Il campo delle stelle di neutroni arriva a $10^{12}$ T, e la materia in quei campi ha proprietà completamente diverse: gli elettroni sono confinati in livelli di Landau e l&rsquo;equazione di stato cambia. È uno dei punti in cui questo movimento incontra la materia estrema.`}
   ],
   domanda:R`Il ferro magnetizzato «ricorda» la sua storia, e l&rsquo;isteresi è una forma di <b>memoria in un sistema fisico</b> — la stessa che ha reso possibili i dischi rigidi. Ma una memoria implica che il sistema abbia <b>più stati di equilibrio</b> a parità di condizioni esterne, e che passare dall&rsquo;uno all&rsquo;altro costi energia. <b>Domanda che porti avanti:</b> qual è la relazione fra il numero di stati accessibili, l&rsquo;energia dissipata per cambiarli, e l&rsquo;entropia? La risposta — il <b>principio di Landauer</b>, cancellare un bit costa almeno $k_BT\ln2$ — lega la termodinamica all&rsquo;informazione, e passa esattamente da qui.`}
]}

var byId = {}; TAPPE.forEach(function(s){ byId[s.num]=s; });

var VKEY='pm-nucleoem-09-visited';
function loadSeen(){ try{ return new Set(JSON.parse(localStorage.getItem(VKEY)||'[]')); }catch(e){ return new Set(); } }
function saveSeen(s){ try{ localStorage.setItem(VKEY, JSON.stringify(Array.from(s))); }catch(e){} }
var SEEN = loadSeen();

function renderNav(active){
  var nav=document.getElementById('sidebar');
  nav.innerHTML='';
  var h=document.createElement('h2'); h.textContent='Nucleo em-09 · le tappe'; nav.appendChild(h);
  TAPPE.forEach(function(s){
    var b=document.createElement('button');
    b.className='navitem'+(active===s.num?' active':'')+(SEEN.has(s.num)?' seen':'');
    b.innerHTML='<span class="dot"></span><span class="nx">'+s.num+'</span><span>'+s.title+'</span>';
    b.onclick=function(){ showTappa(s.num); };
    nav.appendChild(b);
  });
}

/* ---- renderer dei blocchi ---- */
function sectionProsa(title, tag, html){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var body=elFromHTML('<div class="open-body">'+html+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function sectionGram(title, rows){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag gramtag">grammatica</span></h3>';
  var inner='<table class="gramtab">';
  rows.forEach(function(r){ inner+='<tr><td class="gs">'+r[0]+'</td><td>'+r[1]+'</td></tr>'; });
  inner+='</table>';
  var body=elFromHTML('<div class="gramwrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
/* --- blocco PLOT: la figura non decora, si legge. Ogni plot porta una chiave di lettura. --- */
function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';
  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
    else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
    else if(b.t==='prolessi') m.appendChild(sectionProlessi(b));
    else if(b.t==='reveal')m.appendChild(sectionReveal(b.title,b.tag,b.steps));
    else if(b.t==='esercizio') m.appendChild(sectionEsercizio(b));
    else if(b.t==='collaudo')  m.appendChild(sectionCollaudo(b.title,b.items));
    else if(b.t==='plot')      m.appendChild(sectionPlot(b));
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}
