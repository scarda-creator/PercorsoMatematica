<style>
  :root{
    --bg:#0e1117; --panel:#161b22; --panel2:#1c232d; --border:#2b333d;
    --txt:#eef3f8; --muted:#b9c4d1; --accent:#4c8dff; --accent2:#8fb0ff;
    --ok:#2ea043; --okbg:#10331b; --warn:#d8a13a; --warnbg:#332a10;
    --gram:#5eead4; --grambg:#0f2a26;
    --pro:#b98cff; --probg:#1a1430; --proline:#2a2247; --proedge:#3a2d5c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    font-size:17px;line-height:1.55;}
  a{color:var(--accent2);}
  .banner{background:var(--panel2);border-bottom:1px solid var(--border);color:var(--muted);
    font-size:.8rem;font-weight:600;text-align:center;padding:8px 12px;letter-spacing:.3px;}
  .banner b{color:var(--accent2);}
  .shell{display:flex;max-width:1180px;margin:0 auto;align-items:flex-start;}

  /* ---- SIDEBAR ---- */
  .sidebar{width:280px;flex:0 0 280px;padding:20px 12px 60px;position:sticky;top:0;
    max-height:100vh;overflow-y:auto;border-right:1px solid var(--border);}
  .sidebar h2{font-size:.72rem;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);
    margin:18px 8px 8px;}
  .navitem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:none;
    background:transparent;color:var(--txt);padding:9px 10px;border-radius:8px;cursor:pointer;
    font-size:.9rem;transition:.12s;border:1px solid transparent;}
  .navitem:hover{background:var(--panel2);}
  .navitem.active{background:#13233f;border-color:var(--accent);color:#fff;}
  .navitem .dot{width:7px;height:7px;border-radius:50%;background:transparent;flex:0 0 7px;
    border:1px solid var(--border);}
  .navitem.seen .dot{background:var(--ok);border-color:var(--ok);}
  .navitem .nx{color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto;}

  /* ---- MAIN ---- */
  .main{flex:1 1 auto;min-width:0;padding:24px 30px 90px;max-width:860px;}
  h1{font-size:1.5rem;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:.92rem;margin:0 0 18px;}
  .sfhead{border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:8px;}
  .sfhead h1{font-size:1.55rem;}
  .meta{color:var(--muted);font-size:.82rem;margin-top:6px;}

  .section{margin:26px 0;}
  .section > h3{font-size:1.02rem;color:var(--accent2);margin:0 0 10px;
    display:flex;align-items:center;gap:10px;}
  .section > h3 .tag{font-size:.66rem;font-weight:700;letter-spacing:.4px;background:var(--panel2);
    border:1px solid var(--border);color:var(--muted);padding:2px 8px;border-radius:20px;
    text-transform:uppercase;}
  /* --- blocchi figura --- */
  .section > h3 .tag.plottag{background:#101f2e;border-color:#1f3c57;color:#7ab8e0;}
  .plot-intro{color:var(--muted);font-size:.95rem;margin:0 0 12px;}
  .plot-row{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;
    background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;}
  .plot-row.due .plot-box{flex:1 1 300px;min-width:280px;}
  .plot-box{max-width:560px;}
  .plot-leggi{margin-top:10px;background:var(--panel2);border:1px solid var(--border);
    border-left:3px solid #4a8fc7;border-radius:0 10px 10px 0;padding:11px 14px;
    font-size:.93rem;color:var(--muted);}
  .plot-leggi b{color:#7ab8e0;}
  .plot-err{color:#ff6b6b;font-size:.85rem;}
  .open-body{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
  .open-body p:first-child{margin-top:0;} .open-body p:last-child{margin-bottom:0;}
  .open-body ul{margin:.4em 0;padding-left:1.2em;} .open-body li{margin:.35em 0;}

  .note{background:var(--panel2);border-left:3px solid var(--muted);border-radius:6px;
    padding:9px 12px;margin:12px 0;font-size:.9rem;color:var(--muted);}
  .note b{color:#ff9d6b;}
  .note.warn{background:var(--warnbg);border-left-color:var(--warn);color:#e0b85a;}
  .note.warn b{color:#f0c25a;}

  /* ---- GRAMMATICA ---- */
  .gramwrap{background:var(--grambg);border:1px solid #1f4d47;border-radius:12px;padding:6px 6px;}
  table.gramtab{border-collapse:collapse;width:100%;font-size:.92rem;}
  table.gramtab td{padding:9px 12px;vertical-align:top;border-bottom:1px solid #17332e;}
  table.gramtab tr:last-child td{border-bottom:none;}
  table.gramtab td.gs{white-space:nowrap;color:var(--gram);width:1%;
    border-right:1px solid #17332e;font-variant-numeric:tabular-nums;}
  .section > h3 .tag.gramtag{background:var(--grambg);border-color:#1f4d47;color:var(--gram);}

  /* ---- STRUMENTI (repertorio condiviso: la scheda si apre DENTRO la frase) ----
     Nessun accento nuovo: riusa il verde della grammatica, perche' uno strumento
     richiamato e' grammatica gia' spiegata altrove, non una quinta specie di blocco. */
  .str{color:var(--gram);border-bottom:1px dashed var(--gram);cursor:pointer;}
  .str:hover{background:var(--grambg);}
  .str::after{content:"\2666";font-size:.62em;vertical-align:.42em;margin-left:2px;opacity:.8;}
  .str.aperto::after{content:"\2715";}
  .str.rotto{color:#ff6b6b;border-bottom-color:#ff6b6b;cursor:help;}
  /* la scheda e' uno SPAN in display:block, non un div: i rimandi cadono dentro
     <p>, <li> e celle di tabella, dove un div e' HTML illegale. */
  .strcard{display:block;margin:10px 0;background:var(--grambg);border:1px solid #1f4d47;
    border-left:3px solid var(--gram);border-radius:0 10px 10px 0;padding:10px 14px;font-size:.9rem;}
  .strcard .sh{display:block;font-size:.66rem;font-weight:700;letter-spacing:.5px;
    text-transform:uppercase;color:var(--gram);margin-bottom:7px;}
  .strcard .sr{display:block;margin:5px 0;}
  .strcard .sk{color:var(--gram);font-weight:600;}

  /* ---- PROLESSI (preannuncio fisico) ---- */
  .prowrap{background:var(--probg);border:1px solid var(--proedge);border-radius:12px;padding:4px 4px 8px;}

  .pro-oggetto{padding:2px 14px 11px;color:var(--muted);font-size:.92rem;border-bottom:1px solid var(--proline);
    margin-bottom:2px;} .pro-oggetto b{color:var(--txt);}
  table.protab{border-collapse:collapse;width:100%;font-size:.92rem;}
  table.protab td{padding:10px 12px;vertical-align:top;border-bottom:1px solid var(--proline);}
  table.protab tr:last-child td{border-bottom:none;}
  table.protab td.pd{white-space:nowrap;color:var(--pro);width:1%;font-weight:700;font-size:.78rem;
    letter-spacing:.3px;text-transform:uppercase;border-right:1px solid var(--proline);line-height:1.3;}
  .pro-domanda{margin:8px 8px 2px;background:#140d26;border:1px solid var(--proedge);
    border-left:3px solid var(--pro);border-radius:8px;padding:10px 14px;font-size:.92rem;}
  .pro-domanda b{color:var(--pro);}
  .section > h3 .tag.protag{background:var(--probg);border-color:var(--proedge);color:var(--pro);}

  /* ---- REVEAL ---- */
  .rsteps{display:flex;flex-direction:column;gap:12px;}
  .rstep{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 18px;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .rlabel{font-size:.7rem;font-weight:700;letter-spacing:.4px;color:var(--accent);
    text-transform:uppercase;margin-bottom:8px;}
  .rstep p:first-of-type{margin-top:0;} .rstep p:last-child{margin-bottom:0;}
  .rstep ul{margin:.4em 0;padding-left:1.2em;}
  .testo{background:#13233f;border:1px solid #2b4877;border-radius:12px;padding:14px 18px;margin-bottom:14px;}
  .testo .src{display:block;font-size:.74rem;font-style:italic;color:var(--accent2);margin-bottom:8px;
    text-transform:uppercase;letter-spacing:.3px;}
  .esame-nota{font-size:.9rem;color:var(--muted);font-style:italic;margin-top:12px;padding-left:12px;
    border-left:3px solid var(--border);}

  .reveal-btn{background:var(--accent);color:#fff;border:none;padding:11px 18px;border-radius:10px;
    font-size:.95rem;font-weight:600;cursor:pointer;margin-top:14px;transition:.12s;}
  .reveal-btn:hover:not(:disabled){background:var(--accent2);}
  .reveal-btn.small{padding:7px 14px;font-size:.85rem;margin-top:0;background:var(--panel2);
    color:var(--accent2);border:1px solid var(--border);}
  .reveal-btn.small:hover:not(:disabled){border-color:var(--accent);}
  .reveal-btn:disabled,.reveal-btn.done{background:var(--panel2);color:var(--muted);
    border:1px solid var(--border);cursor:default;}

  /* ---- COLLAUDO ---- */
  .collaudo-item{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 18px;margin-bottom:12px;}
  .cq{margin-bottom:10px;}
  .ca{margin-top:12px;background:var(--okbg);border:1px solid #235c33;border-radius:8px;
    padding:10px 14px;font-size:.94rem;}
  .ca b{color:#5fd980;}

  /* ---- PREV / NEXT ---- */
  .prevnext{display:flex;justify-content:space-between;gap:12px;margin-top:40px;
    border-top:1px solid var(--border);padding-top:20px;}
  .pnbtn{flex:1 1 0;background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:12px 16px;cursor:pointer;color:var(--txt);text-align:left;transition:.14s;font:inherit;}
  .pnbtn:hover{border-color:var(--accent);background:var(--panel2);}
  .pnbtn.next{text-align:right;}
  .pnbtn .k{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .pnbtn .t{font-weight:600;color:var(--accent2);}
  .pnbtn:disabled{opacity:.35;cursor:default;border-color:var(--border);background:var(--panel);}

  code{background:var(--panel2);border:1px solid var(--border);border-radius:5px;
    padding:1px 5px;font-size:.85em;color:var(--accent2);}
  .katex{font-size:1.02em;color:var(--txt);} .katex-display{margin:.5em 0;overflow-x:auto;overflow-y:hidden;}

  @media(max-width:860px){
    .shell{flex-direction:column;}
    .sidebar{width:100%;flex:none;position:static;max-height:none;border-right:none;
      border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:4px;}
    .sidebar h2{width:100%;} .navitem{width:auto;}
    .main{padding:20px 16px 80px;}
  }
</style>

<script>
"use strict";
const R = String.raw;

function typeset(el){
  if(el && window.renderMathInElement){
    try{ renderMathInElement(el,{delimiters:[
      {left:'$$',right:'$$',display:true},
      {left:'$',right:'$',display:false}
    ],throwOnError:false}); }catch(e){}

function elFromHTML(html){ var d=document.createElement('div'); d.innerHTML=html; return d; }

/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un
   rimando scritto nella prosa:

       <span class="str" data-str="serie-geometrica">la serie geometrica</span>

   Le schede citate da questo nucleo sono cucite qui sotto dal montaggio
   (assembla-nucleo.js): la pagina resta autosufficiente — niente fetch,
   niente sottocartelle da pubblicare — e un rimando a una scheda che non
   esiste FERMA la costruzione invece di arrivare in pagina rotto.
   Apertura: lo stesso gesto del collaudo (si clicca, il pannello compare,
   si typeset una volta sola), portato dentro la frase.
   =================================================================== */
var CORSO = 'elettromagnetismo';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["rotore"] = {"nome":"Rotore","riga":"Il campo $\\nabla\\times\\mathbf F$, la cui componente lungo $\\hat n$ misura la circuitazione di $\\mathbf F$ per unità di area attorno a $\\hat n$.","serve":"È la girandola locale: dove il rotore è nullo, una paletta infinitesima immersa nel campo non gira. Da qui il criterio più usato — un campo con rotore nullo su un dominio semplicemente connesso è conservativo — e la doppia ipotesi non è pedanteria: su un dominio bucato il criterio salta, e il controesempio (il vortice attorno a un filo escluso) è proprio il caso che si incontra in fisica.","esempio":"Il vortice $\\mathbf F=(-y,x)$ ha rotore $\\partial_x(x)-\\partial_y(-y)=2$: gira davvero, ed è costante su tutto il piano. Il campo radiale $\\mathbf F=(x,y)$ ha invece rotore $\\partial_x(y)-\\partial_y(x)=0$: si allontana dall'origine senza ruotare, e infatti è il gradiente di $\\tfrac12(x^{2}+y^{2})$.","pieno":{"file":"04-campi-vettoriali.html","tappa":"03","come":"divergenza e rotore insieme, con le loro letture geometriche e il calcolo in componenti, nel nucleo sui campi vettoriali"},"qui":{"elettromagnetismo":{"serve":"Le due equazioni di Maxwell col rotore sono quelle che accoppiano i campi: $\\nabla\\times\\mathbf E=-\\partial_t\\mathbf B$ e $\\nabla\\times\\mathbf B=\\mu_0\\mathbf J+\\mu_0\\varepsilon_0\\partial_t\\mathbf E$. Il rotore nullo di $\\mathbf E$ in statica è ciò che autorizza a scrivere il potenziale; appena $\\mathbf B$ varia nel tempo quel rotore non è più nullo, e il potenziale scalare da solo smette di bastare. Il rotore è quindi il posto esatto in cui l'elettrostatica finisce.","esempio":"Che non possa esistere un potenziale scalare quando $\\mathbf B$ varia si vede dall'identità $\\nabla\\times(\\nabla V)$, che è nulla per ogni $V$: se $\\mathbf E$ fosse $-\\nabla V$ il suo rotore sarebbe zero, mentre Faraday lo vuole uguale a $-\\partial_t\\mathbf B$. Sul campione $V=xy$ il gradiente è $(y,x)$ e il conto è $\\partial_x(x)-\\partial_y(y)=0$, come per qualunque altro $V$."}},"controllo":[{"tipo":"uguale","sinistra":"diff(x,x)-diff(-y,y)","vale":"2","dove":"esempio","appare":"=2"},{"tipo":"uguale","sinistra":"diff(y,x)-diff(x,y)","vale":"0","dove":"esempio","appare":"=0"},{"tipo":"uguale","sinistra":"diff(diff(x*y,y),x)-diff(diff(x*y,x),y)","vale":"0","dove":"qui.elettromagnetismo.esempio","appare":"=0"}]};
STRUM["teorema-di-stokes"] = {"nome":"Teorema di Stokes","riga":"La circuitazione di un campo lungo una curva chiusa è il flusso del suo rotore attraverso una qualunque superficie che quella curva borda: $\\oint_{\\partial S}\\mathbf F\\cdot d\\mathbf r=\\int_S(\\nabla\\times\\mathbf F)\\cdot\\hat n\\,dS$.","serve":"Dice che la circuitazione dipende solo dal bordo e non dalla superficie scelta — ed è la licenza a deformare la superficie a piacere, che in fisica si usa continuamente. Letto nell'altro verso dà il significato del rotore: la circuitazione per unità di area, nel limite di un cappio piccolo. Il verso della normale e quello di percorrenza del bordo vanno legati dalla regola della mano destra, altrimenti il segno è casuale.","esempio":"Per il vortice $\\mathbf F=(-y,x,0)$ il rotore ha solo componente $z$, che vale $\\partial_x(x)-\\partial_y(-y)=2$. Sul disco di raggio $R$ nel piano $xy$ il flusso del rotore è quindi $2$ per l'area, $2\\pi R^{2}$; la circuitazione diretta sul cerchio, dove $\\mathbf F\\cdot d\\mathbf r$ vale $R^{2}\\,dt$, dà $\\int_0^{2\\pi}R^{2}\\,dt=2\\pi R^{2}$.","pieno":{"file":"05-teoremi-integrali.html","tappa":"03","come":"l'enunciato, l'orientazione coerente bordo-normale e l'indipendenza dalla superficie, nel nucleo dei teoremi integrali"},"qui":{"elettromagnetismo":{"serve":"È il ponte fra la forma integrale e la forma locale delle due leggi di circuitazione: Ampère, $\\oint\\mathbf B\\cdot d\\mathbf r=\\mu_0 I$, diventa $\\nabla\\times\\mathbf B=\\mu_0\\mathbf J$; Faraday, $\\oint\\mathbf E\\cdot d\\mathbf r=-\\dfrac{d\\Phi_B}{dt}$, diventa $\\nabla\\times\\mathbf E=-\\partial_t\\mathbf B$. E regge l'affermazione più usata dell'elettrostatica: se il rotore di $\\mathbf E$ è nullo su un dominio senza buchi, ogni circuitazione è nulla e il campo è conservativo.","esempio":"Per il filo rettilineo infinito percorso da una corrente il campo ha modulo $\\dfrac{\\mu_0 I}{2\\pi r}$ ed è tangente ai cerchi concentrici, quindi la circuitazione su un cerchio di raggio $r$ è $\\dfrac{\\mu_0 I}{2\\pi r}\\cdot 2\\pi r=\\mu_0 I$: il raggio scompare. Stokes dice che lo stesso valore si ottiene su qualunque cappio che allacci il filo, anche storto — è il bordo a contare, non la forma."}},"controllo":[{"tipo":"uguale","sinistra":"diff(x,x)-diff(-y,y)","vale":"2","dove":"esempio","appare":"=2"},{"tipo":"integrale","espr":"R**2","var":"t","da":"0","a":"2*pi","vale":"2*pi*R**2","dove":"esempio","appare":"2\\pi R^{2}"},{"tipo":"uguale","sinistra":"mu0*Ic/(2*pi*r)*2*pi*r","vale":"mu0*Ic","dove":"qui.elettromagnetismo.esempio","appare":"\\mu_0 I"}]};
STRUM["flusso-di-un-campo"] = {"nome":"Flusso di un campo","riga":"L'integrale $\\iint_S\\mathbf F\\cdot\\hat n\\,dS$: quanta parte del campo attraversa la superficie, contata col segno che l'orientazione stabilisce.","serve":"Traduce «quanto passa attraverso» in un numero, e il numero dipende da due scelte che vanno dichiarate entrambe: la superficie e il verso della normale. Su una superficie chiusa la convenzione è normale uscente, e allora un flusso positivo significa che dentro c'è una sorgente netta. Dove il campo è parallelo alla superficie il contributo è nullo: conta solo la componente normale, mai il modulo.","esempio":"Per il campo radiale $\\mathbf F=\\mathbf r$ sulla sfera di raggio $R$ la normale uscente è $\\hat r$, e la componente normale vale $R$ in ogni punto, costante: il flusso è quel valore per l'area, $\\Phi=R\\cdot4\\pi R^{2}=4\\pi R^{3}$. Per $R=2$ fa $32\\pi$.","pieno":{"file":"03-curve-superfici.html","tappa":"04","come":"la definizione, il ruolo dell'orientazione e l'indipendenza dalla parametrizzazione, nel nucleo su curve e superfici"},"qui":{"elettromagnetismo":{"serve":"Il flusso di $\\mathbf E$ attraverso una superficie chiusa è l'unica cosa che la legge di Gauss controlla: dice quanto esce in totale, non quanto vale $\\mathbf E$ punto per punto. Da un solo numero si risale al campo soltanto se si sa già in che direzione punta e da cosa dipende — e quello lo decide la simmetria della distribuzione, non il teorema. Per questo la superficie si sceglie: dove $\\mathbf E$ è costante e normale, il flusso diventa modulo per area.","esempio":"Per una carica puntiforme $q$ al centro di una sfera di raggio $R$ il campo ha modulo $\\dfrac{q}{4\\pi\\varepsilon_0R^{2}}$ ed è ovunque normale alla sfera, quindi $\\Phi=\\dfrac{q}{4\\pi\\varepsilon_0R^{2}}\\cdot4\\pi R^{2}=\\dfrac{q}{\\varepsilon_0}$: il raggio è sparito. È il motivo per cui la legge di Gauss è una legge e non un conto — vale per qualunque superficie chiusa che racchiuda la carica."}},"controllo":[{"tipo":"uguale","sinistra":"R*4*pi*R**2","vale":"4*pi*R**3","dove":"esempio","appare":"4\\pi R^{3}"},{"tipo":"uguale","sinistra":"4*pi*2**3","vale":"32*pi","dove":"esempio","appare":"32\\pi"},{"tipo":"uguale","sinistra":"q/(4*pi*e0*R**2)*4*pi*R**2","vale":"q/e0","dove":"qui.elettromagnetismo.esempio","appare":"\\dfrac{q}{\\varepsilon_0}"},{"tipo":"derivata","espr":"q/(4*pi*e0*R**2)*4*pi*R**2","rispetto":["R"],"vale":"0","dove":"qui.elettromagnetismo.esempio","appare":"il raggio è sparito"}]};

function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';
  return h;
}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');

{ num:'00', title:'Di cosa parla questo movimento', meta:'Elettromagnetismo · voce C.2 · 34 prove · la stessa mossa di em-05, e conviene vederla cosi',
  blocchi:[
  {t:'prosa', title:'Il parallelo che risparmia meta dello studio', tag:'architettura', html:R`
  <p>Questo movimento è il <b>gemello di em-05</b>, e il modo più rapido di impararlo è mettere le due colonne una accanto all&rsquo;altra. La struttura logica è identica, cambiano i nomi:</p>

   <tr><td style="padding:4px">compaiono cariche di polarizzazione</td><td style="padding:4px">compaiono <b>correnti amperiane</b></td></tr>
   <tr><td style="padding:4px">$\vec D=\varepsilon_0\vec E+\vec P$ ignora quelle cariche</td><td style="padding:4px">$\vec H=\frac{\vec B}{\mu_0}-\vec M$ ignora quelle correnti</td></tr>

   <tr><td style="padding:4px">$\vec D=\varepsilon_0\varepsilon_r\vec E$</td><td style="padding:4px">$\vec B=\mu_0\mu_r\vec H$</td></tr>
  </table>
  <p><b>Una sola differenza conta davvero</b>, ed è quella che rende il magnetismo più ricco: mentre $\varepsilon_r>1$ sempre (un dielettrico <i>riduce</i> il campo), $\mu_r$ può essere minore di 1, poco maggiore di 1, o <b>enorme</b> — fino a $10^5$. Le tre possibilità sono tre fenomeni fisici diversi, ed è il contenuto della tappa 03.</p>`}

/* ---------------- 01 · LA MAGNETIZZAZIONE ---------------- */
{ num:'01', title:'La magnetizzazione e le correnti amperiane', meta:'M come densita di momento magnetico · perche compaiono correnti superficiali · il cilindro magnetizzato',
  blocchi:[
  {t:'prosa', title:'M, e cosa produce', tag:'costruzione', html:R`
  <p>Ogni atomo ha un momento magnetico — dovuto al moto orbitale degli elettroni e al loro spin — e in un materiale magnetizzato questi momenti non sono più orientati a caso. Si definisce
  $$\vec M=\frac{d\vec m}{dV},$$
  la densità di momento di dipolo magnetico, che si misura in A/m.</p>
  <p>Ora l&rsquo;argomento «i dipoli vicini si cancellano» va rifatto per le spire. Ogni dipolo è una piccola spira di corrente; <b>due spire adiacenti hanno correnti opposte sul lato in comune e si elidono</b>. Ciò che sopravvive è una corrente <b>lungo la superficie esterna</b> del materiale:
  $$\vec J_m=\nabla\times\vec M\ \text{(nel volume)},\qquad \vec K_m=\vec M\times\hat n\ \text{(sulla superficie)}.$$
  <p>Il <span class="str" data-str="rotore">rotore</span> compare qui per la stessa ragione per cui nei dielettrici compariva la divergenza: misura quanto le spirette vicine <i>non</i> si cancellano, e vale zero esattamente quando $\vec M$ è uniforme.</p>
  <b>Sono correnti vere</b> — fanno campo magnetico esattamente come quelle di un filo — ma non le controlliamo e non passano da nessun generatore. Esattamente il ruolo che in em-05 avevano le cariche di polarizzazione.</p>
  <div class="note"><b>L&rsquo;immagine da tenere</b>: un cilindro uniformemente magnetizzato lungo il suo asse è indistinguibile, dall&rsquo;esterno, da un <b>solenoide</b> con corrente superficiale $K_m=M$. Questo è letteralmente ciò che è un magnete permanente: un solenoide in cui la corrente non è alimentata da niente, perché sono gli spin degli elettroni ad essere allineati. La formula $B=\mu_0nI$ di em-08 diventa $B=\mu_0M$ dentro il cilindro, e la calamita del frigo è quel conto.</div>`}
]},

/* ---------------- 02 · IL VETTORE H ---------------- */
{ num:'02', title:'Il vettore H: nascondere le correnti che non conosciamo', meta:'la definizione · Ampere per H · mezzi lineari · e il nome sbagliato che confonde tutti',
  blocchi:[
  {t:'prosa', title:'La costruzione, identica a quella di D', tag:'costruzione', html:R`
  <p>La legge di Ampère vale con <b>tutte</b> le correnti: $\nabla\times\vec B=\mu_0(\vec J_{\text{lib}}+\vec J_m)$. Sostituendo $\vec J_m=\nabla\times\vec M$ e portando a sinistra:
  $$\nabla\times\left(\frac{\vec B}{\mu_0}-\vec M\right)=\vec J_{\text{lib}}.$$
  Si battezza la combinazione:
  $$\vec H=\frac{\vec B}{\mu_0}-\vec M\quad\Longrightarrow\quad \oint\vec H\cdot d\vec\ell=I_{\text{lib}},$$
  e <b>la circuitazione di $\vec H$ conta solo le correnti che hai messo tu</b>, quelle nei fili. Per un mezzo lineare $\vec M=\chi_m\vec H$ e
  $$\vec B=\mu_0(1+\chi_m)\vec H=\mu_0\mu_r\vec H,\qquad \mu_r=1+\chi_m.$$</p>
  <div class="note"><b>Il nome è una trappola storica.</b> $\vec H$ viene spesso chiamato «campo magnetico» e $\vec B$ «induzione magnetica», il che è esattamente al contrario di quel che conta: <b>il campo fisico è $\vec B$</b> — è lui che compare nella forza di Lorentz e nel flusso che genera la fem. $\vec H$ è una contabilità, come $\vec D$. La convenzione dei nomi risale a quando si pensava per analogia con le cariche magnetiche, e nessuno l&rsquo;ha più cambiata. <b>Quando un testo dice «campo magnetico» conviene sempre guardare quale simbolo usa.</b></div>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Un solenoide con $n$ spire per metro e corrente $I$, riempito di un materiale con $\mu_r$. Quanto valgono $H$ e $B$ dentro?`,
    a:R`$H=nI$ — <b>e non dipende dal materiale</b>, perché la circuitazione di $\vec H$ vede solo la corrente nei fili. Poi $B=\mu_0\mu_rnI$. <b>È lo stesso schema di em-05</b>: si calcola prima il campo «contabile» con la simmetria, e solo dopo si moltiplica per la costante del materiale. Un nucleo di ferro con $\mu_r\sim5000$ moltiplica per cinquemila il campo a parità di corrente, ed è tutto il motivo per cui esistono i trasformatori e le elettrocalamite.`}
  ]}
]},

/* ---------------- 03 · LE TRE SPECIE ---------------- */
{ num:'03', title:'Diamagnetismo, paramagnetismo, ferromagnetismo', meta:'mu_r<1, poco >1, enorme · lorigine microscopica · listeresi · perche il ferro perde le sue proprieta scaldandolo',
  blocchi:[
  {t:'prosa', title:'Le tre risposte, e da dove vengono', tag:'grammatica', html:R`
  <ul>
   <li><b>Diamagnetismo</b> ($\chi_m<0$, $\mu_r$ appena sotto 1). È <b>universale</b>: presente in ogni materiale. L&rsquo;origine è l&rsquo;induzione a livello atomico — applicando un campo, le orbite elettroniche si modificano in modo da <i>opporsi</i> alla variazione, ed è la legge di Lenz (em-10) scritta sugli atomi. L&rsquo;effetto è debolissimo ($\chi_m\sim-10^{-5}$) e viene mascherato quando ci sono gli altri due, ma <b>è la sola forma di magnetismo che respinge</b>: è per questo che si può far levitare una rana in un campo abbastanza intenso.</li>
   <li><b>Paramagnetismo</b> ($\chi_m>0$ piccolo). Richiede atomi con momento magnetico <b>permanente</b> non compensato. Il campo tende ad allinearli, l&rsquo;agitazione termica li disordina, e il compromesso dà $\chi_m\propto1/T$ — la <b>legge di Curie</b>. È il primo esempio in questo corso di una competizione fra ordine energetico e disordine termico, ed è esattamente il problema che la meccanica statistica risolve con il modello di Langevin.</li>
   <li><b>Ferromagnetismo</b> ($\mu_r$ fino a $10^5$, e non lineare). I momenti si allineano <b>spontaneamente</b>, anche senza campo esterno, per un&rsquo;interazione fra vicini che <b>non è magnetica</b> ma di scambio, cioè quantistica: nasce dal principio di esclusione. Sopra una temperatura critica — il <b>punto di Curie</b>, 770&nbsp;°C per il ferro — l&rsquo;ordine si rompe e il materiale diventa un paramagnete ordinario.</li>
  </ul>`},
  {t:'prosa', title:'Listeresi, e perche il ferro RICORDA', tag:'idea', html:R`
  <p>In un ferromagnete $\vec B$ non è una funzione di $\vec H$: <b>dipende dalla storia</b>. Aumentando $H$ da zero si sale lungo la curva di prima magnetizzazione fino alla <b>saturazione</b>; tornando indietro $B$ non ripercorre la stessa strada e a $H=0$ resta un valore non nullo, la <b>magnetizzazione residua</b> — è il magnete permanente. Per annullarla serve un campo opposto, il <b>campo coercitivo</b>.</p>
  <p><b>Il ciclo di isteresi racchiude un&rsquo;area, e quell&rsquo;area è energia dissipata per ciclo</b>: in un trasformatore, che percorre il ciclo cinquanta volte al secondo, è una perdita da minimizzare, e per questo si usano materiali «dolci» con ciclo stretto. Per un magnete permanente si vuole l&rsquo;opposto: ciclo largo, che resiste alla smagnetizzazione.</p>
  <div class="note"><b>Perché questa tappa riappare in Meccanica Statistica</b>, e vale la pena saperlo ora: il ferromagnetismo è il sistema su cui si studia la <b>transizione di fase</b> per eccellenza (modello di Ising). La magnetizzazione spontanea che compare sotto $T_c$ è il <b>parametro d&rsquo;ordine</b>, e la rottura spontanea di simmetria che qui è un fatto sperimentale è, là, l&rsquo;esempio didattico fondamentale — e da lì arriva fino alla teoria dei campi.</div>`},
  {t:'plot', title:'Le tre risposte e il ciclo di isteresi',
   intro:R`A sinistra $B$ contro $H$ per i tre tipi (pendenze in scala arbitraria, per renderle visibili sullo stesso grafico). A destra il ciclo di isteresi di un ferromagnete.`,
   plots:[
    {kind:'func2d', xr:[0,2], yr:[0,2.6], height:300,
     title:'B contro H: dia sotto la retta del vuoto, para appena sopra, ferro molto sopra e curvo',
     xlabel:'H', ylabel:'B',
     curves:[
      {f:'x', col:'#4d5a6b', width:1.6, dash:true, label:'vuoto (mu_r=1)'},
      {f:'0.8*x', col:'#4c8dff', width:2.0, label:'diamagnete (esagerato)'},
      {f:'1.25*x', col:'#5eead4', width:2.0, label:'paramagnete (esagerato)'},
      {f:'2.4*tanh(1.4*x)', col:'#d8a13a', width:2.4, label:'ferromagnete: satura'}
     ]},
    {kind:'curve', x:'1.2*sin(t)+0.55*sin(t)*cos(t)', y:'2.2*tanh(1.6*(1.2*sin(t)))+0.75*cos(t)',
     tr:[0,6.2832], xr:[-2.1,2.1], yr:[-3.2,3.2], height:300,
     title:'il ciclo di isteresi: larea e lenergia persa a ogni giro',
     xlabel:'H', ylabel:'B',
     segs:[{x1:-2.1, y1:0, x2:2.1, y2:0, col:'#4d5a6b', width:1},
           {x1:0, y1:-3.2, x2:0, y2:3.2, col:'#4d5a6b', width:1}],

   ],
   leggi:R`<b>A sinistra</b>: diamagnete e paramagnete sono rette (risposta lineare) appena sotto e appena sopra quella del vuoto — nella realtà le tre sarebbero indistinguibili, e qui le pendenze sono esagerate per renderle visibili. Il ferromagnete è un&rsquo;altra cosa: parte molto più ripido e poi <b>satura</b>, perché quando tutti i momenti sono allineati non ce ne sono altri da allineare.<br><br>
   <b>A destra</b> il fatto che rende il ferromagnete diverso in natura e non solo in grado: la curva <b>non è una funzione</b>. A ogni valore di $H$ corrispondono due valori di $B$, a seconda da che parte stai arrivando — il materiale <i>ricorda</i>. I due punti segnati sono quelli che ogni esercizio chiede: la <b>magnetizzazione residua</b> (campo che resta a corrente spenta: è il magnete permanente) e il <b>campo coercitivo</b> (quanto campo opposto serve per azzerarlo). L&rsquo;area racchiusa è l&rsquo;energia persa per ciclo, ed è il motivo per cui un trasformatore scalda anche a vuoto.`}

/* ---------------- 03a · PERCHE IL MAGNETISMO E QUANTISTICO ---------------- */
{ num:'03a', title:'Perche il magnetismo non puo esistere in fisica classica', meta:'il teorema di Bohr-van Leeuwen · il magnetone di Bohr · il diamagnetismo come effetto di Lenz atomico · la saturazione',
  blocchi:[
  {t:'prosa', title:'Un teorema che dice che niente di tutto questo dovrebbe accadere', tag:'first principles', html:R`
  <p>C&rsquo;è un risultato, dimostrato da Niels Bohr nel 1911 e indipendentemente da Hendrika van Leeuwen nel 1919, che vale la pena conoscere perché mette in prospettiva tutto il movimento: <b>in meccanica statistica classica la magnetizzazione di un sistema all&rsquo;equilibrio è esattamente zero</b>, a qualunque temperatura e per qualunque campo applicato.</p>
  <p>La ragione è sorprendentemente semplice. Il campo magnetico entra nell&rsquo;hamiltoniana solo attraverso la sostituzione $\vec p\to\vec p-q\vec A$; nell&rsquo;integrale sullo spazio delle fasi che dà la funzione di partizione, quella sostituzione è un semplice <b>cambio di variabile</b> per traslazione, e non cambia il valore dell&rsquo;integrale. Se la funzione di partizione non dipende da $\vec A$, l&rsquo;energia libera non dipende dal campo, e la magnetizzazione — che è la sua derivata rispetto al campo — <b>è nulla</b>.</p>
  <p><b>Eppure i magneti esistono.</b> Il teorema non è sbagliato: dice che il magnetismo della materia <i>non ha spiegazione classica</i>. Servono due ingredienti che la fisica classica non ha: lo <b>spin</b>, che è un momento magnetico non associato a nessun moto orbitale, e la <b>quantizzazione</b>, che impedisce ai momenti di cancellarsi mediando su un continuo. Ogni volta che in questo movimento si è parlato di «momenti atomici orientati», si è usato senza dirlo un risultato di meccanica quantistica.</p>
  <p><b>L&rsquo;unità naturale</b> di quei momenti è il <b>magnetone di Bohr</b>,
  $$\mu_B=\frac{e\hbar}{2m_e}\simeq9{,}27\cdot10^{-24}\ \mathrm{J/T},$$
  ed è il momento magnetico di un elettrone con una unità di momento angolare. Da qui si stima la magnetizzazione massima possibile di un materiale: un momento per atomo, con $n\simeq8\cdot10^{28}$ atomi al metro cubo, dà $M_{\max}=n\mu_B\simeq7{,}4\cdot10^{5}$ A/m, cioè $\mu_0M\simeq0{,}93$ T. <b>È l&rsquo;ordine di grandezza giusto della saturazione del ferro</b> ($2{,}1$ T, con circa due magnetoni per atomo): una stima di una riga che azzecca il numero misurato, ed è il modo di controllare se un risultato di magnetizzazione è plausibile.</p>`},
  {t:'prosa', title:'Il diamagnetismo, che e universale e quasi sempre invisibile', tag:'struttura', html:R`
  <p>Delle tre risposte, il diamagnetismo è l&rsquo;unica che <b>tutti</b> i materiali hanno — anche quelli che chiamiamo para o ferromagnetici, dove però è coperto da effetti mille volte più grandi.</p>
  <p>L&rsquo;origine è la legge di Lenz applicata all&rsquo;atomo. Accendendo un campo, il flusso concatenato con l&rsquo;orbita elettronica cambia; l&rsquo;elettrone reagisce modificando leggermente la propria velocità orbitale, e lo fa <b>nel verso che si oppone alla variazione</b>. Il momento indotto è quindi antiparallelo al campo, e la suscettività è <b>negativa</b>: $\chi_m<0$, tipicamente fra $-10^{-6}$ e $-10^{-5}$.</p>
  <p><b>Due proprietà che distinguono il diamagnetismo dagli altri due</b>, e che rendono facile riconoscerlo in un esercizio: non dipende dalla temperatura (non c&rsquo;è nessun ordine da distruggere con l&rsquo;agitazione termica, a differenza del paramagnetismo che va come $1/T$), ed è presente anche nei materiali con atomi a momento totale nullo — anzi, è proprio lì che si vede.</p>
  <p>Il caso estremo è il <b>superconduttore</b>, che è un diamagnete perfetto: $\chi_m=-1$, cioè $\vec B=0$ al suo interno. Le correnti superficiali che lo realizzano non sono correnti amperiane atomiche ma correnti vere e macroscopiche, e persistono senza dissipazione. <b>È il solo materiale in cui l&rsquo;espulsione del campo è totale</b>, e la levitazione che ne segue è la dimostrazione più spettacolare che «risposta del materiale» non è un modo di dire.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Se il teorema di Bohr-van Leeuwen dice che classicamente la magnetizzazione è nulla, che cosa c'è di sbagliato nell'immagine dell'elettrone che orbita come una spiretta di corrente?`,
    a:R`Nulla, come <b>immagine</b>: le correnti amperiane sono vere e la <span class="str" data-str="teorema-di-stokes">circuitazione</span> che producono si calcola come per qualunque spira. Quello che è sbagliato è pensare che da quell'immagine segua una magnetizzazione <i>all'equilibrio termico</i>. Classicamente le orbite si dispongono in tutti i modi possibili e i contributi si cancellano esattamente — comprese, e sono queste che spesso si dimenticano, le orbite che rimbalzano sulla superficie del campione. Ciò che impedisce la cancellazione è la quantizzazione: i momenti non possono assumere qualunque valore, e lo spin non ha nessun contributo «opposto» che lo compensi.`},
   {q:R`Perché la suscettività paramagnetica va come $1/T$ e quella diamagnetica no?`,
    a:R`Perché sono due meccanismi di natura diversa. Il paramagnetismo è una <b>competizione</b> fra un campo che allinea momenti già esistenti e l'agitazione termica che li scompiglia: più è caldo, meno l'allineamento riesce, e il bilancio statistico dà la legge di Curie $\chi\propto1/T$. Il diamagnetismo invece non allinea niente: <b>crea</b> un momento che prima non c'era, modificando le orbite, e il risultato non dipende da quanto le orbite siano agitate. <b>Allineare qualcosa che esiste dipende dalla temperatura; deformare qualcosa no</b> — è la stessa distinzione fra i due meccanismi di polarizzazione dei dielettrici, e non è una coincidenza: è la stessa fisica con $\vec m$ al posto di $\vec p$.`},
   {q:R`Un ferromagnete scaldato sopra la temperatura di Curie che cosa diventa?`,
    a:R`Un <b>paramagnete</b>, e la transizione è netta: sopra $T_C$ l'ordine spontaneo dei momenti si distrugge e resta solo l'allineamento indotto dal campo esterno, con $\chi$ che segue la legge di Curie-Weiss $\chi\propto1/(T-T_C)$. Per il ferro $T_C=770\,^\circ$C. <b>È una transizione di fase del secondo ordine</b>, con un parametro d'ordine (la magnetizzazione spontanea) che si annulla con continuità: è l'esempio su cui si costruisce metà della meccanica statistica moderna, e il modello di Ising nasce per descrivere esattamente questo.`}
  ]}
]},

/* ---------------- 03b · IL CIRCUITO MAGNETICO E IL MAGNETE PERMANENTE ---------------- */
{ num:'03b', title:'Il toroide con traferro, e perche dentro un magnete H punta al contrario', meta:'la riluttanza · il traferro che comanda · il campo smagnetizzante · il punto che confonde tutti',
  blocchi:[
  {t:'plot', title:'La curva di magnetizzazione del ferro: perche 6 tesla erano assurdi',
   intro:R`$B$ in funzione di $H$ per un ferro dolce, confrontata con la retta del modello lineare ($\mu_r=2000$, tratteggiata) e con il vuoto. La curva reale satura attorno a $2$ T.`,
   plots:[
    {kind:'func2d', xr:[0,4000], yr:[0,4], height:340,
     title:'il modello lineare vale solo nel primo tratto: oltre, il ferro satura',
     xlabel:'H (A/m)', ylabel:'B (T)',
     curves:[
      {f:'2.1*x/(x+300)', col:'#5eead4', width:2.8, label:'ferro reale (satura a 2.1 T)'},
      {f:'4*PI*1e-7*2000*x', col:'#d8a13a', width:2.2, dash:true, label:'lineare, mu_r=2000'},
      {f:'4*PI*1e-7*x*100', col:'#4d5a6b', width:1.6, dash:true, label:'vuoto (x100 per vederlo)'}
     ],
     segs:[{x1:0, y1:2.1, x2:4000, y2:2.1, col:'#ff6b6b', dash:true, width:1.3, label:'saturazione', lx:2600, ly:2.2}],
     marks:[{x:2500, y:1.875, label:'H=2500: reale 1.9 T, lineare 6.3 T', col:'#5eead4', up:true, left:true}]}
   ],
   leggi:R`<p><b>Le due curve coincidono solo vicino all'origine</b>, e si separano molto prima di quanto si immagini: già a $H=300$ A/m il ferro reale è a metà saturazione mentre la retta continua a salire. A $H=2500$ A/m — il valore dell'esercizio della tappa seguente — la retta dà $6{,}3$ T e la realtà poco meno di $2$ T.</p>
   <p>La lezione è metodologica e vale per tutto il corso: <b>$\mu_r$ non è una costante del materiale, è la pendenza locale di questa curva</b>, e dichiararla «$2000$» ha senso solo nel tratto iniziale. È la stessa cosa che succede con $\varepsilon_r$ nei dielettrici a campi altissimi, e con la legge di Ohm nei componenti non lineari: <b>ogni coefficiente di risposta lineare è il primo termine di uno sviluppo</b>, e il suo dominio di validità va tenuto a mente insieme al suo valore.</p>
   <p>Nota anche la curva del vuoto, che ho dovuto moltiplicare per cento per renderla visibile: a parità di $H$, il ferro produce un campo mille-duemila volte più intenso. <b>È tutto il senso di mettere un nucleo dentro una bobina</b> — e il motivo per cui, quando satura, quel vantaggio sparisce di colpo.</p>`},
  {t:'prosa', title:'Il circuito magnetico: perche si chiama cosi', tag:'costruzione', html:R`
  <p>Un anello di ferro avvolto da $N$ spire percorse da corrente $I$ è il dispositivo più comune di tutta l&rsquo;elettrotecnica — è il nucleo di ogni trasformatore, di ogni elettromagnete, di ogni motore. E si risolve con un&rsquo;analogia che vale la pena vedere, perché trasforma un problema di campi in un problema di circuiti.</p>
  <p>Applicando la legge di Ampère per $\vec H$ lungo la circonferenza media, e ricordando che il flusso di $\vec B$ si conserva lungo il tubo:</p>
  $$H\ell=NI\quad\Longrightarrow\quad B=\mu_0\mu_r\frac{NI}{\ell}\quad\Longrightarrow\quad \Phi=BA=\frac{NI}{\dfrac{\ell}{\mu_0\mu_rA}}.$$
  <p>Il confronto con la legge di Ohm è immediato e non è una metafora: <b>$NI$ fa da forza elettromotrice</b> (si chiama infatti <i>forza magnetomotrice</i>), <b>$\Phi$ fa da corrente</b>, e la quantità $\mathcal{R}=\dfrac{\ell}{\mu_0\mu_rA}$ fa da resistenza e si chiama <b>riluttanza</b>. Riluttanze in serie si sommano, esattamente come le resistenze, e per la stessa ragione: il flusso è lo stesso in tutte le sezioni del tubo.</p>
  <p><b>Il traferro, e perché comanda tutto.</b> Se si taglia l&rsquo;anello lasciando un piccolo spazio d&rsquo;aria di spessore $g\ll\ell$, la riluttanza del traferro è $\mathcal{R}_g=\dfrac{g}{\mu_0A}$ mentre quella del ferro resta $\dfrac{\ell}{\mu_0\mu_rA}$. Il loro rapporto vale</p>
  $$\frac{\mathcal{R}_g}{\mathcal{R}_{\text{ferro}}}=\frac{g\,\mu_r}{\ell}.$$
  <p>Con $\mu_r\simeq5000$ (ferro dolce), $\ell=50$ cm e un traferro di un solo millimetro, il rapporto è $10$: <b>un millimetro d&rsquo;aria oppone dieci volte la resistenza di mezzo metro di ferro</b>. È il motivo per cui nei trasformatori le lamiere si affacciano con cura maniacale, e perché un elettromagnete perde quasi tutta la sua forza se fra le facce resta un velo di ruggine. <b>In un circuito in serie comanda sempre l&rsquo;elemento peggiore</b> — la stessa morale del condensatore con dielettrico parziale, con la stessa struttura matematica.</p>`},
  {t:'prosa', title:'Dentro un magnete permanente H e B vanno in verso opposto', tag:'trappola', html:R`
  <p>È l&rsquo;affermazione che sembra sbagliata e non lo è, ed è anche la migliore prova che $\vec H$ e $\vec B$ non sono «lo stesso campo in unità diverse».</p>
  <p>Prendi un magnete permanente isolato: non ci sono correnti libere, quindi la legge di Ampère per $\vec H$ dà $\oint\vec H\cdot d\vec l=0$ lungo <i>ogni</i> cammino chiuso, compreso quello che entra da un polo, attraversa il magnete ed esce dall&rsquo;altro. Fuori dal magnete $\vec H=\vec B/\mu_0$, quindi i due campi puntano nello stesso verso. Perché la circuitazione complessiva sia nulla, il tratto interno deve dare un contributo <b>di segno opposto</b> a quello esterno: dentro il magnete $\vec H$ punta all&rsquo;indietro rispetto a $\vec B$. Lo stesso risultato si legge direttamente dalla relazione di definizione:</p>
  $$\vec H=\frac{\vec B}{\mu_0}-\vec M.$$
  <p>Dentro il materiale $\vec M$ è grande e allineata con $\vec B$; il termine $-\vec M$ domina, e $\vec H$ risulta <b>antiparallelo</b> a $\vec B$. Per questo si chiama <b>campo smagnetizzante</b>: è il campo che il magnete produce su se stesso e che tende a distruggere la propria magnetizzazione.</p>
  <p><b>Due conseguenze concrete</b>, entrambe da esame e da laboratorio. La prima: un magnete corto e tozzo si smagnetizza più facilmente di uno lungo e sottile, perché il campo smagnetizzante dipende dalla <i>forma</i> — è massimo quando i poli sono vicini. La seconda: il punto di lavoro di un magnete permanente non sta sul ciclo di isteresi dove uno se lo aspetta, ma nel <b>secondo quadrante</b> del piano $(H,B)$, dove $H$ è negativo e $B$ positivo. Quella regione si chiama <i>curva di smagnetizzazione</i>, e il prodotto $|BH|$ massimo su di essa è la cifra di merito con cui si vendono i magneti.</p>
  <div class="note"><b>La regola che toglie ogni ambiguità</b>, e conviene fissarla: $\vec B$ è il campo che <b>agisce</b> (forza di Lorentz, flusso, induzione) ed è sempre continuo nel flusso; $\vec H$ è il campo la cui sorgente sono <b>le sole correnti libere</b>, e serve a calcolare. Nei mezzi lineari sono proporzionali e la distinzione sembra pedanteria; in un magnete permanente — che lineare non è — puntano in versi opposti, e chi li confonde sbaglia il segno di tutto.</div>`}
]},

/* ---------------- 03c · ESERCIZI ---------------- */
{ num:'03c', title:'Esercizi — tocca a te', meta:'il toroide con traferro, e il cilindro magnetizzato',
  blocchi:[
  {t:'esercizio', title:'1 · Elettromagnete con traferro',
   src:'forma ricorrente: circuito magnetico in serie',
   testo:R`Un anello di ferro di permeabilità relativa $\mu_r=2000$, lunghezza media $\ell=40$ cm e sezione $A=4\ \mathrm{cm^2}$, è avvolto da $N=500$ spire con corrente $I=2$ A. Si usino la legge di Ampère per $\vec H$ lungo la circonferenza media e la conservazione del <span class="str" data-str="flusso-di-un-campo">flusso</span> di $\vec B$. Calcola il campo $B$ nell'anello. Poi si pratica un traferro di $g=2$ mm: di quanto cala $B$?`,
   steps:[
    {label:'Senza traferro', body:R`
    <p>Solo ferro: $H=\dfrac{NI}{\ell}=\dfrac{500\cdot2}{0{,}4}=2500$ A/m, e</p>
    $$B=\mu_0\mu_rH=4\pi\cdot10^{-7}\cdot2000\cdot2500\simeq6{,}3\ \mathrm{T}.$$
    <p><b>Il valore è assurdo</b>, e riconoscerlo fa parte dell'esercizio: il ferro <i>satura</i> attorno a $1{,}5$-$2$ T, e sopra quel valore $\mu_r$ crolla. Il conto lineare va bene come primo passo e va sempre confrontato con la saturazione — una risposta di 6 tesla, in un problema con del ferro, è un segnale che il modello lineare è stato spinto fuori dal suo dominio.</p>`},
    {label:'Con il traferro', body:R`
    <p>Le due riluttanze in serie:</p>
    $$\mathcal{R}_{\text{ferro}}=\frac{\ell}{\mu_0\mu_rA},\qquad \mathcal{R}_g=\frac{g}{\mu_0A},\qquad \frac{\mathcal{R}_g}{\mathcal{R}_{\text{ferro}}}=\frac{g\mu_r}{\ell}=\frac{0{,}002\cdot2000}{0{,}4}=10.$$
    <p>Il traferro pesa <b>dieci volte</b> tutto il ferro. Il flusso cala quindi di un fattore $11$: $B$ passa (nel modello lineare) da $6{,}3$ T a circa $0{,}57$ T — e questo secondo valore è sotto la saturazione, quindi <i>è</i> attendibile.</p>
    <p><b>La morale operativa</b>: in un circuito magnetico con traferro, quasi tutta la forza magnetomotrice cade sull'aria. Si può quasi sempre trascurare il ferro e scrivere $NI\simeq H_g\,g$, ottenendo il risultato in una riga — ed è l'approssimazione che gli esercizi si aspettano quando $g\mu_r\gg\ell$.</p>`}
   ]},
  {t:'esercizio', title:'2 · Il cilindro uniformemente magnetizzato',
   src:'il ponte fra magnete permanente e solenoide',
   testo:R`Un cilindro di raggio $R$ e altezza $h\gg R$ è magnetizzato uniformemente lungo il proprio asse con $M$ costante. Trova le correnti amperiane, il campo $\vec B$ all'interno e il valore di $\vec H$ interno.`,
   steps:[
    {label:'Le correnti', body:R`
    <p>Nel volume $\vec J_m=\nabla\times\vec M=0$, perché $\vec M$ è uniforme: <b>non c'è corrente amperiana di volume</b>, esattamente come non c'era carica di polarizzazione di volume in un dielettrico uniformemente polarizzato. Sulla superficie laterale $\vec K_m=\vec M\times\hat n$ ha modulo $M$ e gira attorno all'asse: <b>è un solenoide di corrente superficiale</b> con $nI$ equivalente pari a $M$.</p>`},
    {label:'I due campi, e il loro rapporto', body:R`
    <p>Dalla formula del solenoide lungo, dentro il cilindro</p>
    $$B=\mu_0 M,$$
    <p>e usando $\vec H=\vec B/\mu_0-\vec M$ si ottiene <b>$H=0$</b> all'interno. Il cilindro lungo è il caso in cui il campo smagnetizzante svanisce, ed è per questo che i magneti permanenti si fanno allungati: più sono lunghi rispetto alla sezione, meno lavorano contro se stessi.</p>
    <p><b>Il controllo</b>: fuori dal cilindro $\vec B$ è quello di un dipolo e $\vec H=\vec B/\mu_0$; dentro, $B$ è grande e $H$ è nullo. Il flusso di $\vec B$ si conserva attraversando la base, quello di $\vec H$ no — e non deve, perché $\vec H$ ha come sorgenti i «poli», cioè $-\nabla\cdot\vec M$.</p>`}
   ]}
]},

/* ---------------- 04 · IL SENSO ---------------- */
{ num:'04', title:'Il senso, e le rotte', meta:'cosa chiude, cosa apre, e perche il magnetismo della materia e quantistico',
  blocchi:[
  {t:'prosa', title:'Cosa lascia in mano', tag:'sintesi', html:R`
  <p><b>A monte.</b> em-08 dava il campo delle correnti; qui la materia diventa essa stessa una distribuzione di correnti. La mossa di contabilità è la stessa di em-05, e chi l&rsquo;ha capita là non ha quasi niente di nuovo da imparare qui.</p>
  <p><b>Il punto, ed è onesto dirlo.</b> Il magnetismo della materia <b>non si spiega classicamente</b>. Il teorema di Bohr-van Leeuwen dimostra che in fisica classica, all&rsquo;equilibrio termico, la magnetizzazione è <b>esattamente zero</b> — sempre. Tutto ciò che questa tappa descrive esiste solo perché esistono lo spin e il principio di esclusione. Le formule si usano; la spiegazione arriva in meccanica quantistica.</p>
  <p><b>A valle.</b> em-10 usa $\vec B$ nei materiali per il flusso e l&rsquo;induzione; em-11 completa le quattro equazioni, che nei mezzi si scrivono con $\vec D$ e $\vec H$; e in Meccanica Statistica il ferromagnete diventa il modello di Ising.</p>`},
  {t:'prolessi', title:'Dove riappare questo movimento, nella fisica che farai',
   oggetto:R`<b>La risposta magnetica della materia</b>: momenti microscopici che si allineano, e la competizione fra ordine e temperatura.`,
   rotte:[
    {dove:'Meccanica<br>statistica', txt:R`Il <b>modello di Ising</b> è questa tappa ridotta all&rsquo;osso: spin che interagiscono coi vicini, temperatura che disordina, e una <b>transizione di fase</b> a $T_c$. La magnetizzazione è il parametro d&rsquo;ordine, e gli esponenti critici attorno a $T_c$ sono gli stessi di sistemi completamente diversi (universalità).`},
    {dove:'Meccanica<br>quantistica', txt:R`Il momento magnetico dell&rsquo;elettrone è legato allo <b>spin</b>, che non è una corrente che gira; il paramagnetismo di Pauli, il diamagnetismo di Landau e l&rsquo;interazione di scambio sono tutti effetti quantistici. Il teorema di Bohr-van Leeuwen dice che <b>senza quantistica non ci sarebbe magnetismo</b>.`},
    {dove:'Risonanza<br>magnetica', txt:R`Gli spin nucleari in campo si separano in livelli (effetto Zeeman) e assorbono a una frequenza precisa: è la NMR, ed è la risonanza magnetica degli ospedali. Il campo uniforme che serve si fa con bobine come quelle di em-08.`},
    {dove:'Astrofisica', txt:R`Il campo delle stelle di neutroni arriva a $10^{12}$ T, e la materia in quei campi ha proprietà completamente diverse: gli elettroni sono confinati in livelli di Landau e l&rsquo;equazione di stato cambia. È uno dei punti in cui questo movimento incontra la materia estrema.`}
   ],
   domanda:R`Il ferro magnetizzato «ricorda» la sua storia, e l&rsquo;isteresi è una forma di <b>memoria in un sistema fisico</b> — la stessa che ha reso possibili i dischi rigidi. Ma una memoria implica che il sistema abbia <b>più stati di equilibrio</b> a parità di condizioni esterne, e che passare dall&rsquo;uno all&rsquo;altro costi energia. <b>Domanda che porti avanti:</b> qual è la relazione fra il numero di stati accessibili, l&rsquo;energia dissipata per cambiarli, e l&rsquo;entropia? La risposta — il <b>principio di Landauer</b>, cancellare un bit costa almeno $k_BT\ln2$ — lega la termodinamica all&rsquo;informazione, e passa esattamente da qui.`}
]}

function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}

}

  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
    else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
    else if(b.t==='prolessi') m.appendChild(sectionProlessi(b));
    else if(b.t==='reveal')m.appendChild(sectionReveal(b.title,b.tag,b.steps));
    else if(b.t==='esercizio') m.appendChild(sectionEsercizio(b));
    else if(b.t==='collaudo')  m.appendChild(sectionCollaudo(b.title,b.items));
    else if(b.t==='plot')      m.appendChild(sectionPlot(b));
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}

/* deep-link: em-09-materiali-magnetici.html#03 apre direttamente la tappa 03 */
window.addEventListener('DOMContentLoaded', function(){
  var h=(location.hash||'').replace('#','');
  showTappa(byId[h]?h:'00');
});
window.addEventListener('hashchange', function(){
  var h=(location.hash||'').replace('#','');
  if(byId[h]) showTappa(h);
});
</script>
