/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un
   rimando scritto nella prosa:

       <span class="str" data-str="serie-geometrica">la serie geometrica</span>

   Le schede citate da questo nucleo sono cucite qui sotto dal montaggio

   Apertura: lo stesso gesto del collaudo (si clicca, il pannello compare,

   =================================================================== */
var CORSO = 'meccanica-quantistica';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["spettro"] = {"nome":"Spettro di un operatore","riga":"Lo spettro di un operatore e' l'insieme dei possibili esiti di una misura — i suoi autovalori — e puo' essere discreto (autovalori separati, autovettori in $\\mathcal H$), continuo (autovalori che riempiono un intervallo, autovettori non normalizzabili), o misto.","serve":"E' la quantita' che la fisica chiede davvero: scrivere l'hamiltoniana e trovarne lo spettro E' il problema d'esame. La distinzione discreto/continuo non e' tecnica — decide se un autostato e' uno stato preparabile (discreto) o una distribuzione che vive fuori dallo spazio di Hilbert (continuo), come l'onda piana e la delta.","esempio":"Per $\\sigma_z=\\begin{pmatrix}1&0\\\\0&-1\\end{pmatrix}$ lo spettro e' $\\{+1,-1\\}$, discreto, e i due invarianti della matrice lo riassumono senza risolvere l'equazione secolare: la somma degli autovalori e' la traccia, $\\operatorname{tr}\\sigma_z=0$, il loro prodotto e' il determinante, $\\det\\sigma_z=-1$. Per l'operatore posizione lo spettro e' tutta la retta reale, continuo, e gli autovettori sono delte di Dirac.","debito":"la costruzione rigorosa dello spettro continuo (teorema spettrale generalizzato, misura spettrale $E(\\lambda)$ di von Neumann) sta fuori da questo percorso: qui si dichiara che esiste e si lavora coi casi concreti. La separazione fra spettro continuo e spettro residuo non si tratta.","controllo":[{"tipo":"uguale","sinistra":"Matrix([[1,0],[0,-1]]).trace()","vale":"0","dove":"esempio","appare":"\\operatorname{tr}\\sigma_z=0"},{"tipo":"uguale","sinistra":"Matrix([[1,0],[0,-1]]).det()","vale":"-1","dove":"esempio","appare":"\\det\\sigma_z=-1"}],"qui":{},"pieno":null};
STRUM["proiettore-ortogonale"] = {"nome":"Proiettore ortogonale","riga":"Un proiettore ortogonale e' un operatore $\\hat P$ che soddisfa due condizioni insieme: $\\hat P^2=\\hat P$ (idempotenza — proiettare due volte equivale a proiettare una volta) e $\\hat P^{\\dagger}=\\hat P$ (autoaggiuntezza, che rende la proiezione perpendicolare al sottospazio invece che obliqua).","serve":"E' il mattone di tutta la teoria della misura: $\\hat P=|\\psi\\rangle\\langle\\psi|$ su un ket normalizzato e' l'osservabile «lo stato e' $|\\psi\\rangle$?» con esiti $1$ e $0$, e il suo valor medio e' la probabilita'. L'identita' si scrive come somma di proiettori, $\\mathbb 1=\\sum_i\\hat P_i$, ed e' con questa che si cambia base e si decompone un'osservabile.","esempio":"Da $|\\psi\\rangle=(\\tfrac35,\\tfrac45)$ normalizzato si costruisce $\\hat P=|\\psi\\rangle\\langle\\psi|$ con entrate $\\tfrac{9}{25},\\tfrac{12}{25},\\tfrac{16}{25}$. L'elemento $(1,1)$ di $\\hat P^2$ vale $(\\tfrac{9}{25})^2+(\\tfrac{12}{25})^2=\\tfrac{9}{25}$, cioe' $\\hat P^2=\\hat P$; la traccia e' $\\tfrac{9}{25}+\\tfrac{16}{25}=1$, come per ogni proiettore di rango uno.","debito":"la decomposizione spettrale di un operatore autoaggiunto con spettro continuo in una famiglia di proiettori $E(\\lambda)$ (la misura spettrale) sta fuori da qui: si usa il caso discreto, dove i proiettori sono $|i\\rangle\\langle i|$.","controllo":[{"tipo":"simbolico","dove":"esempio","appare":"\\hat P^2=\\hat P","perche":"e' l'idempotenza, meta' della definizione di proiettore: un'identita' fra operatori, non un conto numerico. Il caso concreto che la sostiene e' l'entrata $(1,1)$ asserita qui sotto, dove i numeri ci sono"},{"tipo":"uguale","sinistra":"(Rational(9,25))**2+(Rational(12,25))**2","vale":"9/25","dove":"esempio","appare":"(\\tfrac{9}{25})^2+(\\tfrac{12}{25})^2=\\tfrac{9}{25}"},{"tipo":"uguale","sinistra":"Rational(9,25)+Rational(16,25)","vale":"1","dove":"esempio","appare":"\\tfrac{9}{25}+\\tfrac{16}{25}=1"}],"qui":{},"pieno":null};
STRUM["traccia"] = {"nome":"Traccia di un operatore","riga":"La traccia e' la somma degli elementi diagonali, $\\operatorname{tr}\\hat A=\\sum_i\\langle i|\\hat A|i\\rangle$, e non dipende dalla base ortonormale scelta perche' e' invariante per permutazione ciclica: $\\operatorname{tr}(\\hat A\\hat B)=\\operatorname{tr}(\\hat B\\hat A)$, da cui $\\operatorname{tr}(\\hat U^{\\dagger}\\hat A\\hat U)=\\operatorname{tr}\\hat A$.","serve":"E' il modo di estrarre un numero da un operatore senza privilegiare una rappresentazione. Il valor medio di un'osservabile su uno stato si scrive $\\langle A\\rangle=\\operatorname{tr}(\\rho\\hat A)$ con $\\rho=|\\psi\\rangle\\langle\\psi|$, e questa forma — a differenza di $\\langle\\psi|\\hat A|\\psi\\rangle$ — vale identica per gli stati misti, dove $\\rho$ non e' piu' un proiettore: e' la porta verso la matrice densita' e la decoerenza.","esempio":"Per $A=\\begin{pmatrix}1&2\\\\3&4\\end{pmatrix}$ e $B=\\begin{pmatrix}0&1\\\\1&0\\end{pmatrix}$, pur essendo $AB\\neq BA$, le due tracce coincidono: $AB=\\begin{pmatrix}2&1\\\\4&3\\end{pmatrix}$ da' $\\operatorname{tr}(AB)=2+3=5$, mentre $BA=\\begin{pmatrix}3&4\\\\1&2\\end{pmatrix}$ da' $\\operatorname{tr}(BA)=3+2=5$. La traccia di un proiettore di rango uno vale $1$, e in generale la traccia di un proiettore e' la dimensione del sottospazio su cui proietta.","debito":"la traccia di un operatore in dimensione infinita esiste solo per la classe degli operatori a traccia (totalmente continui), e la costruzione rigorosa — $\\operatorname{tr}(\\hat A^{\\dagger}\\hat A)=\\sum_\\mu\\|\\hat A\\phi_\\mu\\|^2$ indipendente dalla base, von Neumann cap. II.11 — qui si cita. Si lavora col caso in cui la somma converge.","controllo":[{"tipo":"uguale","sinistra":"(Matrix([[1,2],[3,4]])*Matrix([[0,1],[1,0]])).trace()","vale":"5","dove":"esempio","appare":"\\operatorname{tr}(AB)=2+3=5"},{"tipo":"uguale","sinistra":"(Matrix([[0,1],[1,0]])*Matrix([[1,2],[3,4]])).trace()","vale":"5","dove":"esempio","appare":"\\operatorname{tr}(BA)=3+2=5"},{"tipo":"uguale","sinistra":"Matrix([[1,2],[3,4]])*Matrix([[0,1],[1,0]])","vale":"Matrix([[2,1],[4,3]])","dove":"esempio","appare":"AB=\\begin{pmatrix}2&1\\\\4&3\\end{pmatrix}"},{"tipo":"uguale","sinistra":"Matrix([[0,1],[1,0]])*Matrix([[1,2],[3,4]])","vale":"Matrix([[3,4],[1,2]])","dove":"esempio","appare":"BA=\\begin{pmatrix}3&4\\\\1&2\\end{pmatrix}"}],"qui":{},"pieno":null};
STRUM["delta-di-dirac"] = {"nome":"Delta di Dirac","riga":"Non è una funzione ma un funzionale, definito da $\\int f(x)\\,\\delta(x-a)\\,dx=f(a)$, che composto con una funzione si spezza sui suoi zeri come $\\delta(g(x))=\\sum_i \\delta(x-x_i)/|g'(x_i)|$.","serve":"Serve come macchina per cambiare variabile senza invertire nulla. La densità di $y=f(x)$ si scrive $p_Y(y)=\\int p_X(x)\\,\\delta(y-f(x))\\,dx$, e la delta produce da sola il fattore $1/|f'|$ che altrimenti andrebbe messo a mano: i rami molteplici si contano da soli invece di doverli ricordare. È la ragione pratica per cui il formalismo con la delta compare in ogni soluzione d'esame che tocchi una distribuzione, mentre il cambio di variabile esplicito compare quasi mai.","esempio":"$\\delta(x^2-a^2)$ con $a$ positivo. Gli zeri sono $x=\\pm a$; la derivata dell'argomento è $2x$, che in modulo vale $2a$ su entrambi. Quindi $\\delta(x^2-a^2)=\\dfrac{1}{2a}\\big[\\delta(x-a)+\\delta(x+a)\\big]$. Il caso si ripete identico in fisica statistica con $\\varepsilon=p^2/2m$ in una dimensione, dove i due rami $p=\\pm\\sqrt{2m\\varepsilon}$ contribuiscono entrambi — e dimenticarne uno dimezza la risposta.","pieno":{"file":"15-distribuzioni.html","tappa":"01","come":"le distribuzioni come funzionali, la delta e le sue proprietà, nel nucleo di Metodi"},"qui":{"meccanica-statistica":{"serve":"È lo strumento con cui si calcola la densità degli stati, cioè l'oggetto su cui poggia tutto il secondo tempo del corso: $g(\\varepsilon)=\\int d^dp\\,d^dq\\;\\delta(\\varepsilon-H)/h^d$. L'identità che si usa davvero non è la definizione ma questa: $\\delta(\\varepsilon-H)=\\partial_\\varepsilon\\,\\theta(\\varepsilon-H)$. Si scambia l'integrale con la derivata e ci si ritrova a calcolare il volume della regione dove l'hamiltoniana sta sotto $\\varepsilon$ — un integrale elementare — invece di un integrale con una delta dentro. La $g$ così ottenuta è pura geometria dello spazio delle fasi: non sa nulla della temperatura, e per questo resta identica quando si passa da Boltzmann a Fermi o a Bose.","esempio":"Particella libera in due dimensioni. Il volume della regione $p^2/2m$ sotto $\\varepsilon$ è il disco di area $2\\pi m\\varepsilon$; derivando rispetto a $\\varepsilon$ si ottiene $2\\pi m$, cioè una densità degli stati costante. Non è una curiosità: è la ragione per cui in due dimensioni una particella libera non condensa, e per cui le prove che chiedono la condensazione in $d=2$ mettono sempre un potenziale confinante, che porta la $g$ da costante a crescente."}},"controllo":[{"tipo":"derivata","espr":"x**2-a**2","rispetto":["x"],"vale":"2*x","ipotesi":{"x":"positive","a":"positive"},"dove":"esempio","appare":"2x"},{"tipo":"uguale","sinistra":"1/Abs(2*a)","vale":"1/(2*a)","ipotesi":{"a":"positive"},"dove":"esempio","appare":"\\dfrac{1}{2a}"},{"tipo":"derivata","espr":"2*pi*m*e","rispetto":["e"],"vale":"2*pi*m","ipotesi":{"m":"positive","e":"positive"},"dove":"qui.meccanica-statistica.esempio","appare":"2\\pi m"}]};
STRUM["disuguaglianza-di-schwarz"] = {"nome":"Disuguaglianza di Cauchy-Schwarz","riga":"$|\\langle\\phi|\\psi\\rangle|^{2}\\le\\langle\\phi|\\phi\\rangle\\,\\langle\\psi|\\psi\\rangle$, con l'uguaglianza se e solo se i due vettori sono proporzionali.","serve":"E' la disuguaglianza da cui nasce il principio di indeterminazione. Applicata agli scarti di due osservabili, e tenendo la sola parte immaginaria del prodotto scalare, da' un limite inferiore al prodotto delle due varianze pari al quadrato di $\\tfrac{1}{2i}\\langle[\\hat A,\\hat B]\\rangle$. L'indeterminazione non e' un postulato: e' Cauchy-Schwarz piu' un commutatore.","esempio":"Con posizione e impulso il commutatore vale $i\\hbar$, e la disuguaglianza diventa $\\sigma_x^{2}\\sigma_p^{2}\\ge\\hbar^{2}/4$, cioe' $\\sigma_x\\sigma_p\\ge\\hbar/2$. Il fattore un mezzo viene dal $2i$ al denominatore, non da una convenzione scelta.","debito":"la dimostrazione della disuguaglianza — il discriminante della norma quadra di una combinazione lineare — e' quella standard degli spazi con prodotto interno e non si ripete qui.","controllo":[{"tipo":"uguale","sinistra":"(1/(2*I)*(I*hbar))**2","vale":"hbar**2/4","ipotesi":{"hbar":"positive"},"dove":"esempio","appare":"\\hbar^{2}/4"},{"tipo":"uguale","sinistra":"sqrt(hbar**2/4)","vale":"hbar/2","ipotesi":{"hbar":"positive"},"dove":"esempio","appare":"\\hbar/2"}],"qui":{},"pieno":null};
STRUM["integrale-gaussiano"] = {"nome":"Integrale gaussiano","riga":"$\\displaystyle\\int_{-\\infty}^{+\\infty} e^{-ax^{2}}\\,dx=\\sqrt{\\pi/a}$ per $a\\gt 0$, e $\\displaystyle\\int_{-\\infty}^{+\\infty} x^{2}e^{-ax^{2}}\\,dx=\\tfrac12\\sqrt{\\pi/a^{3}}$.","serve":"E' l'unico integrale che serve davvero sapere a memoria in meccanica statistica, perche' l'energia cinetica e' quadratica nell'impulso e quindi ogni integrazione sugli impulsi e' una gaussiana. Il trucco della dimostrazione — elevare al quadrato e passare in coordinate polari — vale la pena di vederlo una volta: e' il motivo per cui compare un $\\pi$ in una formula che di cerchi non parla.","esempio":"Da $I^{2}=\\iint e^{-a(x^{2}+y^{2})}dx\\,dy=\\int_0^\\infty 2\\pi r\\,e^{-ar^{2}}dr=\\pi/a$ segue $I=\\sqrt{\\pi/a}$. I momenti superiori si ottengono derivando rispetto ad $a$ sotto il segno: $-\\partial_a I=\\int x^{2}e^{-ax^{2}}dx=\\tfrac12\\sqrt{\\pi}\\,a^{-3/2}$. Derivare rispetto a un parametro e' piu' rapido che integrare per parti, e funziona per tutti i momenti pari.","debito":"il caso di esponente immaginario — l'integrale di Fresnel $\\int e^{iax^{2}}dx$, che si ottiene ruotando il cammino nel piano complesso e che in meccanica quantistica e' il propagatore libero — non sta qui: in tutte le gaussiane di questo percorso $a$ e' reale e positivo, e la convergenza non e' in discussione.","controllo":[{"tipo":"integrale","espr":"exp(-a*x**2)","var":"x","da":"-oo","a":"oo","vale":"sqrt(pi/a)","ipotesi":{"a":"positive","x":"real"},"dove":"riga","appare":"\\sqrt{\\pi/a}"},{"tipo":"integrale","espr":"x**2*exp(-a*x**2)","var":"x","da":"-oo","a":"oo","vale":"sqrt(pi/a**3)/2","ipotesi":{"a":"positive","x":"real"},"dove":"riga","appare":"\\tfrac12\\sqrt{\\pi/a^{3}}"},{"tipo":"integrale","espr":"2*pi*r*exp(-a*r**2)","var":"r","da":"0","a":"oo","vale":"pi/a","ipotesi":{"a":"positive","r":"positive"},"dove":"esempio","appare":"2\\pi r\\,e^{-ar^{2}}dr=\\pi/a"},{"tipo":"integrale","espr":"x**2*exp(-a*x**2)","var":"x","da":"-oo","a":"oo","vale":"sqrt(pi)*a**Rational(-3,2)/2","ipotesi":{"a":"positive","x":"real"},"dove":"esempio","appare":"\\tfrac12\\sqrt{\\pi}\\,a^{-3/2}"},{"tipo":"integrale","espr":"exp(-b*p**2/(2*m))","var":"p","da":"-oo","a":"oo","vale":"sqrt(2*pi*m/b)","ipotesi":{"b":"positive","m":"positive","p":"real"},"dove":"qui.meccanica-statistica.esempio","appare":"\\sqrt{2\\pi m/\\beta}"},{"tipo":"uguale","sinistra":"V/(h/sqrt(2*pi*m*k*T))**3","vale":"V*(2*pi*m*k*T)**Rational(3,2)/h**3","ipotesi":{"V":"positive","h":"positive","m":"positive","k":"positive","T":"positive"},"dove":"qui.meccanica-statistica.esempio","appare":"V/\\lambda^{3}"},{"tipo":"uguale","sinistra":"integrate(p**2/(2*m)*exp(-b*p**2/(2*m)),(p,-oo,oo))/integrate(exp(-b*p**2/(2*m)),(p,-oo,oo))","vale":"1/(2*b)","ipotesi":{"b":"positive","m":"positive","p":"real"},"dove":"qui.meccanica-statistica.esempio","appare":"1/2\\beta=\\tfrac12 kT"}],"pieno":null,"qui":{"meccanica-statistica":{"serve":"La funzione di partizione di una particella libera e' un prodotto di tre gaussiane negli impulsi, e da li' esce la lunghezza d'onda termica $\\lambda=h/\\sqrt{2\\pi m k T}$ — che e' la grandezza con cui si misura quando un gas smette di essere classico.","esempio":"$\\int e^{-\\beta p^{2}/2m}dp=\\sqrt{2\\pi m/\\beta}$, quindi $Z_{1}=\\dfrac{V}{h^{3}}(2\\pi mkT)^{3/2}=V/\\lambda^{3}$, che e' la stessa cosa scritta due volte perche' $\\lambda=h/\\sqrt{2\\pi mkT}$. Lo stesso integrale col peso $p^{2}$ da' $\\langle p^{2}/2m\\rangle=1/2\\beta=\\tfrac12 kT$ per grado di liberta': l'equipartizione non e' un principio a parte, e' questo integrale."}}};
STRUM["operatore-unitario"] = {"nome":"Operatore unitario","riga":"Un operatore $\\hat U$ e' unitario quando $\\hat U^{\\dagger}\\hat U=\\hat U\\hat U^{\\dagger}=\\mathbb 1$, cioe' $\\hat U^{\\dagger}=\\hat U^{-1}$, il che equivale a conservare il prodotto interno: $\\langle \\hat U\\phi|\\hat U\\psi\\rangle=\\langle\\phi|\\psi\\rangle$ per ogni coppia di stati.","serve":"Conservare il prodotto interno vuol dire conservare le probabilita': ogni trasformazione fisica che non cambia gli esiti di una misura — un cambio di base, una traslazione, una rotazione, l'evoluzione temporale — e' unitaria. I suoi autovalori hanno modulo uno, e due osservabili legate da un operatore unitario hanno lo stesso spettro.","esempio":"La rotazione del piano $\\hat U=\\begin{pmatrix}\\cos\\theta&-\\sin\\theta\\\\\\sin\\theta&\\cos\\theta\\end{pmatrix}$ e' unitaria — il prodotto $\\hat U^{\\dagger}\\hat U$ ha sulla diagonale $\\cos^2\\theta+\\sin^2\\theta=1$ e zero fuori — e ha autovalori $e^{\\pm i\\theta}$, di modulo $|e^{i\\theta}|=1$. La matrice $S$ del cambio di base ortonormale e' unitaria per lo stesso motivo: manda una base ortonormale in un'altra.","debito":"la trasformata di Cayley $\\hat U=(\\hat A-i)/(\\hat A+i)$, che lega operatori autoaggiunti e unitari e con cui von Neumann risolve il problema agli autovalori in dimensione infinita, si cita e non si costruisce.","controllo":[{"tipo":"uguale","sinistra":"Abs(exp(I*theta))","vale":"1","ipotesi":{"theta":"real"},"dove":"esempio","appare":"|e^{i\\theta}|=1"},{"tipo":"uguale","sinistra":"Matrix([[cos(th),-sin(th)],[sin(th),cos(th)]]).T*Matrix([[cos(th),-sin(th)],[sin(th),cos(th)]])","vale":"Matrix([[1,0],[0,1]])","ipotesi":{"th":"real"},"dove":"esempio","appare":"\\cos^2\\theta+\\sin^2\\theta=1"}],"qui":{},"pieno":null};
STRUM["prodotto-tensoriale"] = {"nome":"Prodotto tensoriale","riga":"Lo spazio di due sistemi e' $\\mathcal H_1\\otimes\\mathcal H_2$, di dimensione pari al PRODOTTO delle due e non alla somma, con base fatta dai prodotti degli elementi delle due basi.","serve":"E' il motivo per cui la meccanica quantistica non e' una teoria di particelle indipendenti messe accanto. La dimensione cresce come il prodotto, quindi la stragrande maggioranza degli stati non si scrive come prodotto di due stati singoli: quelli che non si scrivono cosi' sono gli stati entangled, e sono la regola, non l'eccezione.","esempio":"Due spin un mezzo: ogni fattore ha dimensione due, il prodotto ne ha $2\\cdot2=4$. Gli stati fattorizzati sono parametrizzati da due punti sulla sfera di Bloch, cioe' da quattro parametri reali, mentre lo spazio totale ne ha $2\\cdot4-2=6$: restano due dimensioni di stati che non si fattorizzano, e il singoletto e' uno di quelli.","debito":"la matrice densita' ridotta e la quantificazione dell'entanglement (entropia di von Neumann) non stanno qui: questa scheda da' la struttura, non la misura.","controllo":[{"tipo":"uguale","sinistra":"2*2","vale":"4","dove":"esempio","appare":"2\\cdot2=4"},{"tipo":"uguale","sinistra":"2*4-2","vale":"6","dove":"esempio","appare":"2\\cdot4-2=6"}],"qui":{},"pieno":null};
STRUM["matrici-di-pauli"] = {"nome":"Matrici di Pauli","riga":"Sono le tre matrici $2\\times2$ hermitiane a traccia nulla il cui quadrato e' l'identita' e il cui commutatore riproduce l'algebra del momento angolare, da cui lo spin $\\hat S_i=\\tfrac{\\hbar}{2}\\sigma_i$.","serve":"Sono la rappresentazione piu' piccola non banale del momento angolare, e insieme all'identita' formano una base di tutte le matrici due per due hermitiane: qualunque osservabile di un sistema a due stati e' una combinazione dell'identita' e delle tre. Ogni conto di spin un mezzo — Stern-Gerlach, precessione, risonanza magnetica, qubit — si riduce alla loro algebra.","esempio":"Siccome il quadrato di una combinazione unitaria delle tre e' l'identita', qualunque esponenziale collassa: l'operatore di rotazione dello spinore diventa $\\cos(\\theta/2)$ per l'identita' meno $i\\sin(\\theta/2)$ per la combinazione. Il mezzo nell'angolo e' la ragione per cui una rotazione di un giro intero cambia segno allo stato, perche' $\\cos(\\pi)=-1$.","debito":"la costruzione generale delle rappresentazioni di SU(2) e il suo legame con SO(3) stanno nel movimento sul momento angolare; qui c'e' il caso di spin un mezzo con le sue regole di calcolo.","controllo":[{"tipo":"uguale","sinistra":"cos(2*pi/2)","vale":"-1","dove":"esempio","appare":"\\cos(\\pi)=-1"},{"tipo":"uguale","sinistra":"cos(pi/3)**2+sin(pi/3)**2","vale":"1","dove":"esempio","appare":"\\sin(\\theta/2)"}],"qui":{},"pieno":null};
STRUM["commutatore"] = {"nome":"Commutatore","riga":"$[\\hat A,\\hat B]=\\hat A\\hat B-\\hat B\\hat A$, antisimmetrico, con la regola di Leibniz $[\\hat A,\\hat B\\hat C]=[\\hat A,\\hat B]\\hat C+\\hat B[\\hat A,\\hat C]$ e la relazione canonica $[\\hat x,\\hat p]=i\\hbar$.","serve":"E' la misura di quanto due operazioni dipendano dall'ordine, e qui l'ordine e' fisica: due osservabili che non commutano non hanno una base comune di autostati, quindi non si misurano insieme con precisione arbitraria. Quasi ogni conto che sembra magico — l'algebra del momento angolare, gli operatori di salita e discesa, il teorema di Ehrenfest — e' una manipolazione di commutatori fatta con quelle regole e nient'altro.","esempio":"Dalla regola di Leibniz, $[\\hat x,\\hat p^{2}]=[\\hat x,\\hat p]\\hat p+\\hat p[\\hat x,\\hat p]=2i\\hbar\\hat p$. E' il conto che fa uscire il teorema di Ehrenfest: la meccanica classica ricompare come relazione fra valori medi, e ricompare perche' quel commutatore vale proprio $2i\\hbar\\hat p$.","debito":"l'identita' di Jacobi si enuncia e non si dimostra; la corrispondenza fra commutatore e parentesi di Poisson — che e' l'idea di Dirac e non un'analogia decorativa — sta in mq-07, e li' va letta per intero.","controllo":[{"tipo":"uguale","sinistra":"I*hbar*p + p*I*hbar","vale":"2*I*hbar*p","ipotesi":{"hbar":"positive","p":"real"},"dove":"esempio","appare":"2i\\hbar\\hat p"},{"tipo":"simbolico","dove":"riga","appare":"[\\hat x,\\hat p]=i\\hbar","perche":"e' la relazione di commutazione canonica, il POSTULATO da cui discende il resto della teoria: non si dimostra, si assume, ed e' cio' che separa la meccanica quantistica dalla classica"}],"qui":{},"pieno":null};

function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';

}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

/* ---------------- 00 · DI COSA PARLA QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Di cosa parla questo movimento', meta:'Meccanica Quantistica · voce Q.5 · il postulato che non si deduce, e la domanda piu ripetuta di tutto il corpus d esame',
  blocchi:[
  {t:'prosa', title:'Due cose in un movimento, e non è un caso che stiano insieme', tag:'architettura', html:R`
  <p>Il movimento precedente ha costruito gli abitanti dello spazio di Hilbert: gli operatori autoaggiunti, il loro <span class="str" data-str="spettro">spettro</span>, i loro autovettori, i <span class="str" data-str="proiettore-ortogonale">proiettori</span> che ne scompongono l&rsquo;azione. Erano tutti oggetti <i>matematici</i>: la fisica entrava solo nella richiesta iniziale che gli esiti di una misura siano numeri reali. Questo movimento fa il passo che quello lasciava in sospeso, e lo fa su due versanti opposti che la tradizione tiene separati e che qui stanno insieme per una ragione precisa.</p>
  <p><b>Il primo versante è concettuale.</b> La meccanica quantistica ha un postulato che non si deduce da nessun altro, e che è l&rsquo;unico punto della teoria in cui l&rsquo;evoluzione temporale <i>non</i> è unitaria: quello che dice che cosa diventa lo stato dopo una misura. Tutto il resto — l&rsquo;equazione di Schrödinger, i generatori delle simmetrie, l&rsquo;intera struttura algebrica — descrive un&rsquo;evoluzione reversibile che conserva la norma. Il collasso no: prende un vettore e lo proietta, cioè ne distrugge una parte. Non è una formula che si dimostra, ed è il luogo in cui tre grandi fisici hanno dato tre risposte diverse e una quarta voce, moderna, sostiene che la domanda è mal posta.</p>
  <p><b>Il secondo versante è operativo</b>, e numericamente è il più urgente: la domanda «<i>si determinino i valori misurabili e le corrispondenti probabilità</i>» compare, in forma quasi identica, in <b>33 dei 47 scritti</b> del corpus di questo corso. È la domanda più ripetuta dell&rsquo;intero programma. La procedura che la risolve è corta — sviluppa lo stato nella base degli autovettori, prendi i moduli quadri dei coefficienti, normalizza — e si impara in dieci minuti.</p>
  <p>Stanno insieme perché la ricetta <i>è</i> il postulato, scritto in coordinate. Chi impara la procedura senza sapere da dove viene la sbaglia esattamente nei tre casi in cui gli esami la chiedono: quando l&rsquo;autovalore è degenere (e allora i moduli quadri si <i>sommano</i>, e il sistema non va in un autostato che si possa nominare), quando lo spettro è continuo (e allora non c&rsquo;è una probabilità ma una densità, e un singolo valore ha probabilità zero), e quando le misure sono due di fila (e allora l&rsquo;ordine conta, e per osservabili che non commutano la probabilità congiunta non è nemmeno definita).</p>`},
  {t:'prosa', title:'Quattro voci, e due di loro dicono il contrario', tag:'architettura', html:R`
  <p>Come nei due movimenti precedenti, le fonti fondative non concordano — e qui il disaccordo è più profondo, perché non riguarda la strada ma il <i>risultato</i>.</p>
  <p><b>Heisenberg</b> (1930) arriva al collasso dalla fisica sperimentale, non dai postulati. Nei <i>Principi fisici della teoria dei quanti</i> ragiona su che cosa serva per misurare davvero la posizione di un elettrone legato — luce di lunghezza d&rsquo;onda confrontabile con le dimensioni atomiche — e osserva che un solo quanto di quella luce strappa l&rsquo;elettrone dall&rsquo;atomo per effetto Compton: «<i>della traiettoria è dunque osservabile un solo punto</i>». Il collasso, per lui, non è un postulato aggiuntivo: è la constatazione che la nostra conoscenza del sistema cambia in modo discontinuo quando osserviamo, e che quindi è «<i>del tutto naturale</i>» che cambi in modo discontinuo anche la sua rappresentazione matematica. Lettura <b>epistemica</b>: si aggiorna una descrizione, non si rompe un sistema.</p>
  <p><b>von Neumann</b> (1932) fa l&rsquo;opposto, e con una potenza che vale da sola il prezzo del libro. Invece di postulare le probabilità, postula <i>solo il valor medio</i>, e dimostra che tutto il resto segue. Poi separa esplicitamente due processi — l&rsquo;evoluzione causale e il processo di misura — rendendo il secondo un postulato indipendente. È la fonte della formula di proiezione, ed è anche la fonte del problema: due processi significa due leggi, e nessuna delle due dice quando si applica l&rsquo;altra.</p>
  <p><b>Picasso</b> (2015) è la voce didattica più nitida di tutte, e la sua nitidezza consiste in un&rsquo;ammissione: «<i>è facile rendersi conto che in molti processi di misura questo postulato viene contraddetto</i>». Quindi, dice, il postulato va letto come la <i>definizione</i> di che cosa sia uno strumento ideale, più l&rsquo;assunzione che per ogni osservabile ne esista almeno uno. Non è una ritirata: è spostare l&rsquo;onere dal mondo allo strumento, e rende il postulato onesto.</p>
  <p><b>Ballentine</b> (1998) dissente da tutti e tre, e dedica un capitolo intero a dimostrare che il collasso è un postulato di troppo. Il suo argomento è un teorema: se l&rsquo;interazione fra sistema e apparato è una misura, allora lo stato finale <i>deve</i> essere una sovrapposizione coerente di stati dell&rsquo;indicatore macroscopicamente distinti — e nessun meccanismo (disturbo, osservatore, ambiente, stato misto iniziale) la riduce. La conclusione non è che la formula è sbagliata, ma che è legittima solo per un tipo particolare di misura — la <b>misura di filtraggio</b> — e che è esattamente quel tipo che i problemi d&rsquo;esame descrivono. Il che è la buona notizia: il conto non cambia, cambia che cosa si crede di aver fatto facendolo.</p>`},
  {t:'prosa', title:'Come è fatto il movimento', tag:'architettura', html:R`
  <p><b>La rotta.</b> La tappa 01 segue la costruzione di von Neumann e di Ballentine: dal solo valor medio si ricava tutta la distribuzione di probabilità, e si vede quanto poco si deve postulare. La 02 costruisce la probabilità di transizione $|\langle B|A\rangle|^2$ come Picasso la introduce, dimostra che è una buona definizione e la collauda sulla legge di Malus. La 03 è la tappa del mestiere: la procedura in quattro passi, svolta per intero su un sistema a tre livelli che poi attraversa tutto il movimento. La 04 affronta la degenerazione e arriva al postulato di von Neumann nella sua forma geometrica — la proiezione ortogonale, cioè la minima perturbazione possibile. La 05 passa allo spettro continuo, dove la probabilità diventa densità, con la gaussiana svolta in posizione e in impulso. La 06 tratta valor medio e indeterminazione come le due statistiche che caratterizzano l&rsquo;ensemble, con l&rsquo;esercizio di Ballentine risolto per due strade. La 07 enuncia il collasso e dimostra <i>perché</i> non può essere dedotto. La 08 porta la critica di Ballentine e il disaccordo dichiarato. La 09 chiude con le misure successive, dove l&rsquo;ordine conta, e ricompone il filo.</p>
  <p><b>Che cosa questo movimento non fa.</b> Non tratta le osservabili compatibili e gli insiemi completi — che risolvono la libertà residua lasciata dalla degenerazione — né la relazione di indeterminazione nella sua forma generale con il commutatore: qui l&rsquo;indeterminazione compare come <i>scarto quadratico medio di una singola osservabile</i>, che è la sua definizione, e il legame fra due osservabili che non commutano resta un fatto costatato su un esempio e non dimostrato in generale. Non tratta la teoria della decoerenza in forma quantitativa, ma ne mostra il meccanismo sull&rsquo;esperimento che Ballentine riporta. Non tratta l&rsquo;evoluzione temporale: lo stato qui è dato a un istante, e che cosa gli succede fra due misure è un&rsquo;altra storia.</p>`}
]},

/* ---------------- 01 · DAL SOLO VALOR MEDIO A TUTTA LA STATISTICA ---------------- */
{ num:'01', title:'Dal solo valor medio a tutta la statistica', meta:'che cosa si postula davvero · la catena E2 di von Neumann · il trucco della funzione a gradino · perche la probabilita di un non autovalore e zero',
  blocchi:[
  {t:'prosa', title:'La domanda che si fa prima di postulare', tag:'costruzione', html:R`
  <p>Quasi tutti i corsi introducono la misura così: «la probabilità di ottenere l&rsquo;autovalore $a_n$ è $|\langle a_n|\psi\rangle|^2$». È vero, è utile, e si impara subito. Ma è anche <i>più</i> di quanto serva postulare, e sapere quanto meno basterebbe cambia che tipo di teoria si crede di avere in mano.</p>
  <p>Ballentine costruisce il capitolo 2 del suo libro attorno a questa domanda. Parte da una descrizione dell&rsquo;esperimento che è deliberatamente spoglia: un <b>esperimento statistico</b> è una lunga sequenza di <i>preparazioni identiche</i> seguite ciascuna da una <i>misura</i>. Prende come esempio uno scattering — una particella accelerata e collimata, un bersaglio, una corona di rivelatori — e osserva la caratteristica che definisce il quadro: «<i>nonriproducibilità degli eventi individuali, ma frequenze limite stabili in una lunga sequenza di tali eventi</i>» (pag. stampata 44). Una singola particella finisce in un rivelatore imprevedibile; la <i>distribuzione</i> dei conteggi sui rivelatori, invece, si stabilizza.</p>
  <p>La separazione fra preparazione e misura non è pedanteria: è ciò che costringe a definire bene che cosa sia uno <b>stato</b>. Due oggetti identici preparati identicamente possono dare esiti diversi; due oggetti che danno lo stesso esito possono venire da preparazioni diverse. Quindi lo stato non è una proprietà dell&rsquo;oggetto misurato né una previsione dell&rsquo;esito: «<i>una preparazione specifica determina non l&rsquo;esito della misura successiva, ma le probabilità dei vari esiti possibili</i>» (pag. 45). E poiché la preparazione è indipendente dalla misura che la seguirà, deve determinare le distribuzioni di probabilità <i>per tutte</i> le misure possibili. Da qui la definizione: uno stato è la specificazione di una distribuzione di probabilità per ogni osservabile.</p>`},
  {t:'reveal', title:'Si postula soltanto la media: il Postulato 2 di Ballentine', tag:'costruzione', steps:[
   {label:'L’enunciato, e la frase che lo accompagna', body:R`
   <p>Dopo tutta questa preparazione concettuale, il postulato è sorprendentemente modesto. Parole di Ballentine:</p>
   <p style="padding-left:1.2em;border-left:3px solid rgba(120,160,255,.45)"><i>&laquo;Postulato 2. A ogni stato corrisponde un unico operatore di stato. Il valore medio di una variabile dinamica $R$, rappresentata dall&rsquo;operatore $R$, nell&rsquo;insieme virtuale di eventi che possono risultare da una procedura di preparazione per lo stato, rappresentato dall&rsquo;operatore $\rho$, è</i></p>
   $$\langle R\rangle=\frac{\operatorname{Tr}(\rho R)}{\operatorname{Tr}\rho}.$$
   <p style="padding-left:1.2em;border-left:3px solid rgba(120,160,255,.45)"><i>&raquo;</i> &mdash; Ballentine, par. 2.1, pag. stampata 46</p>
   <p>Si noti che cosa <b>non</b> c&rsquo;è. Non c&rsquo;è una formula per le probabilità. Non si dice che gli esiti sono gli autovalori. Non si dice nulla sullo stato dopo la misura. Si postula un solo numero per ogni osservabile: la sua media. E Ballentine commenta a margine che la rappresentazione matematica di uno stato «deve essere qualcosa che ci permetta di calcolare le distribuzioni di probabilità per tutte le osservabili» — ma «<i>risulta che è sufficiente postulare soltanto una formula per la media</i>».</p>
   <p>Con la normalizzazione convenzionale <span class="str" data-str="traccia">$\operatorname{Tr}\rho=1$</span> il denominatore sparisce e resta $\langle R\rangle=\operatorname{Tr}(\rho R)$. Per uno <b>stato puro</b> $\rho=|\Psi\rangle\langle\Psi|$ con $|\Psi\rangle$ di norma uno, la traccia si collassa sull&rsquo;elemento di matrice: $\langle R\rangle=\operatorname{Tr}(|\Psi\rangle\langle\Psi|R)=\langle\Psi|R|\Psi\rangle$, che è la formula familiare.</p>`},
   {label:'Perché «sufficiente» non è un modo di dire', body:R`
   <p>L&rsquo;affermazione è forte e va presa alla lettera: dalla sola media, per <i>tutte</i> le osservabili, si ricava l&rsquo;intera distribuzione di probabilità di ciascuna. L&rsquo;ingrediente che lo permette è un&rsquo;assunzione così naturale che si rischia di non vederla: se la quantità fisica $R$ ha il valore $r$, allora una funzione $F(R)$ ha il valore $F(r)$ — e quindi all&rsquo;osservabile $F(R)$ corrisponde l&rsquo;operatore $F(R)$ costruito dalla rappresentazione spettrale.</p>
   <p>Con questo in mano, Ballentine scrive la stessa media in due modi. Per definizione di densità di probabilità $g(r)$:</p>
   $$\langle F(R)\rangle=\int_{-\infty}^{+\infty}F(r')\,g(r')\,dr'$$
   <p>e per il Postulato 2 applicato all&rsquo;osservabile $F(R)$:</p>
   $$\langle F(R)\rangle=\operatorname{Tr}\{\rho F(R)\}.$$
   <p>Due espressioni per lo stesso numero, valide <i>per ogni</i> $F$. Scegliendo bene la funzione $F$ si estrae $g$. È lo stesso principio per cui, conoscendo tutti i momenti di una distribuzione, la si conosce: qui è più forte, perché si conoscono le medie di <i>tutte</i> le funzioni, non solo delle potenze.</p>`}
  ]},
  {t:'reveal', title:'Il trucco della funzione a gradino, e il risultato che consola', tag:'costruzione', steps:[
   {label:'Scegliere F(R) = θ(r − R)', body:R`
   <p>La scelta giusta è la funzione a gradino: $F(R)=\theta(r-R)$, che vale $1$ quando $R<r$ e $0$ quando $R>r$. La sua media, letta con la prima formula, è la <b>funzione di ripartizione</b>:</p>
   $$\langle\theta(r-R)\rangle=\int_{-\infty}^{r}g(r')\,dr'=\operatorname{Prob}(R<r\,|\,\rho).$$
   <p>Letta con la seconda, per un operatore a spettro puramente discreto $R=\sum_n r_n|r_n\rangle\langle r_n|$, la funzione dell&rsquo;operatore è $\theta(r-R)=\sum_n\theta(r-r_n)|r_n\rangle\langle r_n|$, e quindi</p>
   $$\langle\theta(r-R)\rangle=\operatorname{Tr}\Big\{\rho\sum_n\theta(r-r_n)|r_n\rangle\langle r_n|\Big\}=\sum_n\langle r_n|\rho|r_n\rangle\,\theta(r-r_n).$$
   <p>Derivando rispetto a $r$ si ottiene la densità:</p>
   $$g(r)=\sum_n\langle r_n|\rho|r_n\rangle\,\delta(r-r_n)$$
   <p>— una somma di <span class="str" data-str="delta-di-dirac">delta di Dirac</span> piazzate sugli autovalori, con pesi $\langle r_n|\rho|r_n\rangle$.</p>`},
   {label:'Che cosa si è guadagnato, e che cosa si è dimostrato', body:R`
   <p>Ballentine è esplicito sul perché valga la pena fare questo conto per una variabile discreta, dove la densità è un oggetto singolare e inutile da maneggiare: «<i>la sola ragione per calcolare la densità di probabilità per un&rsquo;osservabile discreta è mostrare che $g(r)=0$ se $r$ non è un autovalore</i>». Cioè: <b>la probabilità che una variabile dinamica assuma un valore diverso da un autovalore del suo operatore è nulla</b>, e questo non è stato postulato — è stato <i>dedotto</i>. Lui lo chiama «una gradevole dimostrazione della consistenza del Postulato 2 statistico con il Postulato 1 meccanico» (pag. stampata 56).</p>
   <p>Da qui la probabilità di un autovalore esatto si ottiene come differenza di due ripartizioni a cavallo del punto, e il risultato è</p>
   $$\operatorname{Prob}(R=r\,|\,\rho)=\operatorname{Tr}\{\rho P(r)\}$$
   <p>dove $P(r)$ è il <span class="str" data-str="proiettore-ortogonale">proiettore</span> sul sottospazio generato da <i>tutti</i> gli autovettori di autovalore $r$ — degeneri inclusi. Nel caso particolare di stato puro $\rho=|\Psi\rangle\langle\Psi|$ e autovalore non degenere, questa si riduce a $\operatorname{Prob}(R=r_n|\Psi)=|\langle r_n|\Psi\rangle|^2$: la formula da cui quasi tutti i corsi partono, che qui arriva alla fine come caso particolare di un caso particolare.</p>`}
  ]},
  {t:'reveal', title:'Von Neumann: la stessa cosa, trent’anni prima e dall’altro verso', tag:'costruzione', steps:[
   {label:'Gli enunciati P, E1, E2, F', body:R`
   <p>Questa economia di postulati non è un&rsquo;invenzione moderna: è il cuore del terzo capitolo dei <i>Mathematical Foundations</i> di von Neumann, e vale leggerla nella sua forma originale perché lui etichetta gli enunciati e ne traccia le implicazioni, cosa che nessun manuale moderno fa.</p>
   <p>Il suo punto di partenza è l&rsquo;enunciato <b>P</b>: la probabilità che, nello stato $\varphi$, le quantità $R_1,\dots,R_\ell$ prendano valori negli intervalli $I_1,\dots,I_\ell$ vale $\|E_1(I_1)\cdots E_\ell(I_\ell)\varphi\|^2$, dove $E_j(\lambda)$ è la risoluzione dell&rsquo;identità dell&rsquo;operatore $R_j$ e $E(I)=E(\lambda'')-E(\lambda')$. Lui lo ricava in due casi concreti (le coordinate, e l&rsquo;energia) e poi lo <i>assume</i> in generale — con una limitazione che annota subito e che è il seme di mezza meccanica quantistica: «<i>poiché l&rsquo;ordine delle $R_1,\dots,R_\ell$ è del tutto arbitrario nel problema, deve essere arbitrario nel risultato</i>», quindi tutti gli $E_j$ devono commutare, quindi gli $R_j$ devono commutare. <b>P si postula solo per operatori che commutano.</b></p>
   <p>Poi verifica che P si comporta come una probabilità deve: l&rsquo;ordine delle proposizioni è irrilevante, le proposizioni vacue si possono inserire a piacere, il teorema di addizione vale (perché $E(I_j)=E(I_j')+E(I_j'')$ per intervalli adiacenti, e P è lineare negli $E$), le proposizioni assurde hanno $P=0$ e quelle banali $P=1$. Oggi questi controlli si saltano; nel 1932 andavano fatti, perché nessuno sapeva ancora se la formula fosse una probabilità.</p>`},
   {label:'La catena, e perché E2 basta', body:R`
   <p>I due enunciati seguenti sono le medie. <b>E1</b>: per ogni funzione $F$, $\operatorname{Exp}(F(R);\varphi)=(F(R)\varphi,\varphi)$. <b>E2</b>, suo caso particolare con $F(\lambda)=\lambda$:</p>
   $$\operatorname{Exp}(R;\varphi)=(R\varphi,\varphi)$$
   <p>Dove von Neumann si separa da ogni esposizione moderna è nel passo successivo, che è una vera dimostrazione. Confrontando E1 ed E2 ricava l&rsquo;enunciato <b>F</b> — se la quantità $R$ ha operatore $R$, allora la quantità $F(R)$ ha operatore $F(R)$ — e lo fa <i>per via puramente algebrica</i>: da $(S\varphi,\varphi)=(F(R)\varphi,\varphi)$ per ogni $\varphi$ di norma uno segue, per omogeneità, la stessa uguaglianza per ogni $f$; sostituendo $f\pm g$ e sottraendo si ottengono le parti reali, e con $if$ al posto di $f$ le parti immaginarie; quindi $S=F(R)$ come operatori.</p>
   <p>E allora: da E2 e F segue E1, e da E1 segue P. La dimostrazione dell&rsquo;ultimo passo è elegante — costruisce la funzione indicatrice $H(\lambda)=G_1(F_1(\lambda))\cdots G_\ell(F_\ell(\lambda))$, dove ogni $G_j$ vale $1$ sull&rsquo;intervallo $I_j$ e $0$ fuori; l&rsquo;osservabile $S=H(R)$ vale $1$ esattamente quando tutti gli $R_j$ cadono nei rispettivi intervalli, quindi <i>il suo valor medio è la probabilità cercata</i>. È lo stesso trucco della funzione a gradino di Ballentine, in versione a più variabili.</p>
   <p>Conclusione di von Neumann, parole sue: «<i>a causa della semplicità della loro forma, E2 e F sono particolarmente adatte a essere considerate come il fondamento su cui l&rsquo;intera teoria è costruita</i>». La media e la regola di composizione: due enunciati, e tutta la statistica quantistica.</p>`},
   {label:'Le due cose che von Neumann isola, e il peso della seconda', body:R`
   <p>Subito dopo aver costruito P, von Neumann ne nota due caratteristiche e le chiama «striking»:</p>
   <p style="padding-left:1.2em;border-left:3px solid rgba(120,160,255,.45)"><i>&laquo;1. P è statistica, e non causale; cioè, non ci dice quali valori $R_1,\dots,R_\ell$ abbiano negli stati $\varphi$, ma solo con quali probabilità prendano tutti i valori possibili. 2. Il problema di P non può essere risolto per quantità arbitrarie $R_1,\dots,R_\ell$, ma solo per quelle i cui operatori commutano fra loro.&raquo;</i> &mdash; von Neumann, pag. stampata 134</p>
   <p>La prima è ciò che ogni corso ripete. La seconda quasi nessuno la mette qui, dove le appartiene: <b>l&rsquo;incompatibilità fra osservabili non è un teorema che si dimostra dopo, è un limite della domanda stessa</b>. Non è che la probabilità congiunta di posizione e impulso sia difficile da calcolare: non c&rsquo;è una formula che la definisca, perché la formula richiede la commutatività per essere ben posta. Questo ritorna con conseguenze concrete nella tappa 09, quando si misureranno due osservabili in sequenza.</p>
   <p>E merita notare il contrasto che von Neumann traccia subito dopo con la meccanica classica: anche lì c&rsquo;è un metodo statistico, ma — parole sue — «<i>è, per così dire, un lusso o un&rsquo;aggiunta extra</i>», perché nasce dall&rsquo;ignoranza di alcune delle $2k$ variabili. In quantistica «<i>benché crediamo che dopo aver specificato $\varphi$ conosciamo lo stato del sistema completamente, tuttavia si possono fare solo affermazioni statistiche</i>». La differenza è che la statistica classica è rimediabile in principio e quella quantistica no.</p>`}
  ]},
  {t:'plot', title:'La funzione di ripartizione: una scala, e la densità sono i suoi salti',
   intro:R`Il conto della tappa produce una densità fatta di delta: impossibile da disegnare, perché una delta ha altezza infinita. Ma la funzione da cui la densità è la derivata — la ripartizione $\operatorname{Prob}(A<r)$ — si disegna benissimo, ed è una <b>scala</b>. Qui è disegnata per l&rsquo;osservabile che accompagnerà tutto il movimento: autovalori $0$ e $2$ con probabilità $\tfrac34$ e $\tfrac14$ (i numeri si ricavano nella tappa 03, qui si usano per vedere la forma). Il controllo immediato è che l&rsquo;altezza finale sia uno: $\frac34+\frac14=1$.`,
   plots:[
    {kind:'func2d', xr:[-1.5,3.5], yr:[-0.15,1.25], height:330, ticks:6,
     title:'Prob(A < r): costante a tratti, con un salto su ogni autovalore',
     curves:[
      {f:'(x<0?0:(x<2?0.75:1))', col:'#4c8dff', width:2.8, label:'Prob(A<r)'},
      {f:'1', col:'#8a93a6', width:1.1, label:'probabilità totale = 1'},
      {f:'0', col:'#8a93a6', width:1.1, label:'asse r'}
     ],
     xlabel:'r', ylabel:'Prob(A < r)'}
   ],
   leggi:R`<p><b>Che cosa guardare.</b> La curva è piatta <i>dappertutto</i> tranne in due punti, $r=0$ e $r=2$, dove salta: di $\tfrac34$ nel primo e di $\tfrac14$ nel secondo. Fra i salti non cresce di nulla, e questo è il contenuto geometrico del risultato dedotto sopra — $g(r)=0$ se $r$ non è un autovalore. <b>Che cosa impararne.</b> La densità $g(r)$ è la derivata di questa scala: zero sui tratti piatti, e una delta di peso pari all&rsquo;altezza del salto in ciascuno dei due punti. È per questo che la densità di un&rsquo;osservabile discreta è un oggetto singolare e la si calcola solo per il motivo che dichiara Ballentine: dimostrare che fuori dallo spettro non c&rsquo;è probabilità. Si noti infine che l&rsquo;altezza totale è esattamente $1$ — e non è un&rsquo;ipotesi aggiuntiva, viene da $\operatorname{Tr}\rho=1$. Per lo stato di questo esempio, scritto in componenti nella tappa 03, quella traccia è $\frac16+\frac46+\frac16=1$.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Se dalla sola formula della media si ricava tutta la distribuzione, perché i libri postulano direttamente $|\langle a_n|\psi\rangle|^2$?`,
    a:R`Per ragioni didattiche, e il prezzo è nascosto. La deduzione richiede un ingrediente che va dichiarato — l&rsquo;assunzione che a $F(R)$ corrisponda l&rsquo;operatore $F(R)$, cioè l&rsquo;enunciato <b>F</b> di von Neumann — e richiede di avere già in mano la rappresentazione spettrale. Postulare direttamente i moduli quadri salta entrambe le cose e si arriva al conto in mezza pagina. Il prezzo è che si perdono due informazioni: che la probabilità nulla fuori dallo spettro è un <i>teorema</i> e non un postulato, e che la restrizione agli operatori che commutano non è un difetto tecnico ma la condizione di buona posizione della domanda. Chi ha imparato solo la versione breve tende a credere che «la probabilità congiunta di $x$ e $p$» sia una quantità esistente e difficile, invece di una frase mal formata.`},
   {q:R`Ballentine postula la media con $\rho$ invece che con $|\Psi\rangle$. È solo generalità, o cambia qualcosa?`,
    a:R`Cambia, e proprio nel punto dove questo movimento arriverà. L&rsquo;operatore di stato $\rho$ copre anche gli stati <b>non puri</b>, che non si scrivono come $|\Psi\rangle\langle\Psi|$ — e Ballentine dimostra tre caratterizzazioni equivalenti della purezza ($\rho^2=\rho$, oppure $\operatorname{Tr}(\rho^2)=1$, oppure: $\rho$ non è combinazione convessa non banale di altri stati). Il punto che rende la generalità necessaria, e non elegante, è il teorema successivo: <i>la decomposizione di uno stato non puro in stati puri non è mai unica</i> — Ballentine ne dà due decomposizioni diverse dello stesso $\rho$ a due dimensioni e osserva che ce ne sono infinite. Quindi uno stato non puro non è «un miscuglio di stati puri» in nessun senso letterale, ed è per questo che lui evita perfino la parola «stato misto». Serve in tappa 08: se la riduzione del pacchetto producesse uno stato non puro, non sarebbe lecito dire <i>quale</i> miscuglio è.`}
  ]}
]},

/* ---------------- 02 · LA PROBABILITA DI TRANSIZIONE, E LA LEGGE DI MALUS ---------------- */
{ num:'02', title:'La probabilità di transizione, e la legge di Malus', meta:'la via di Picasso ai postulati · perche |<B|A>|^2 e una buona definizione · Schwarz da 0<=P<=1 · il cristallo birifrangente',
  blocchi:[
  {t:'prosa', title:'La stessa formula, raggiunta dalla fisica invece che dall’algebra', tag:'costruzione', html:R`
  <p>La tappa precedente è arrivata a $\operatorname{Tr}\{\rho P(r)\}$ partendo da un postulato sulle medie e usando la rappresentazione spettrale. Picasso, nelle <i>Lezioni</i>, arriva alla stessa formula per una strada completamente diversa: parte dai polaroid e dai cristalli birifrangenti, e la probabilità gliela <i>impone</i> l&rsquo;esperimento. Vale seguirla perché è la strada che il programma di questo corso ricalca, e perché rende visibile il contenuto fisico di un oggetto che per via algebrica sembra una convenzione.</p>
  <p>Il punto di partenza è un&rsquo;osservazione, non una formula: «<i>se si misura l&rsquo;osservabile $\xi$ sul sistema in uno stato $|A\rangle$, il risultato della misura non è determinato a priori</i>, ma si potrà trovare uno qualsiasi dei numeri $\xi_i$ come risultato, con probabilità $p_i$ che dipendono dallo stato $|A\rangle$» (pag. stampata 59). E poi la precisazione operativa che rende la frase misurabile: se si ripete la misura molte volte sul sistema ogni volta nello stato $|A\rangle$ — «<i>e quindi disponiamo di tante copie del sistema preparato sempre con le stesse modalità</i>» — si otterranno i diversi risultati con frequenze proporzionali a $p_i$. È lo stesso insieme virtuale di Ballentine, detto in due righe invece che in due pagine.</p>
  <p>Gli <b>autostati</b> entrano a questo punto, e con una definizione fisica: sono «quei particolari stati sui quali il risultato di misure di $\xi$ è determinato a priori, e quindi è sempre lo stesso». L&rsquo;esempio è concreto e vale la pena tenerlo perché ritorna: gli stati di polarizzazione lineare di un fotone, parallela e ortogonale all&rsquo;asse ottico di un cristallo birifrangente, sono autostati dell&rsquo;osservabile associata al cristallo. Per un autostato di autovalore $\xi_i$ si ha $p_i=1$ e $p_j=0$ per ogni $j\neq i$.</p>`},
  {t:'reveal', title:'Il postulato, e l’onestà di Picasso su che cosa sia', tag:'costruzione', steps:[
   {label:'L’enunciato', body:R`
   <p>Il postulato arriva come una frase sola, in corsivo nel testo:</p>
   <p style="padding-left:1.2em;border-left:3px solid rgba(120,160,255,.45)"><i>&laquo;Se si misura $\xi$ sul sistema e il risultato della misura è $\xi_i$, subito dopo la misura il sistema è in un autostato di $\xi$ corrispondente all&rsquo;autovalore $\xi_i$.&raquo;</i> &mdash; Picasso, par. 4.2, pag. stampata 59</p>
   <p>Da qui Picasso trae subito tre conseguenze, in ordine. Prima: non si può sapere a priori né quale risultato si otterrà né in quale stato finirà il sistema, ma una volta ottenuto $\xi_i$ si sa in che famiglia di stati si è finiti. Seconda: una seconda misura immediatamente successiva <b>riottiene certamente lo stesso risultato</b> — ed è questo che garantisce che ogni autovalore abbia almeno un autostato, chiudendo il cerchio con la definizione. Terza, scritta come una formula: «<i>in generale, quindi, una misura perturba lo stato del sistema</i>: $|A\rangle\to|\xi_i\rangle$», con l&rsquo;eccezione del caso in cui $|A\rangle$ fosse già un autostato.</p>`},
   {label:'E poi la frase che quasi nessun libro scrive', body:R`
   <p>Subito dopo aver enunciato il postulato, Picasso lo mette in discussione lui stesso:</p>
   <p style="padding-left:1.2em;border-left:3px solid rgba(120,160,255,.45)"><i>&laquo;È facile rendersi conto che in molti processi di misura questo postulato viene contraddetto; esso va quindi inteso in questo senso: da un lato definisce quali sono gli strumenti &lsquo;ideali&rsquo; di misura che corrispondono alle grandezze osservabili, fissandone il comportamento (e quindi, in questo senso, più che di un postulato, si tratta di una definizione); inoltre postula che per ogni osservabile esista almeno uno strumento &lsquo;ideale&rsquo; atto a misurarla.&raquo;</i> &mdash; Picasso, pag. stampata 59</p>
   <p>Questa è la mossa più intelligente che un libro di testo possa fare qui, e va capita bene perché è il perno su cui gira tutta la tappa 08. Il postulato non viene presentato come una legge di natura che i processi di misura obbediscono — Picasso dice che <i>molti non la obbediscono</i>. Viene presentato come la <b>definizione di una classe di strumenti</b>, più un&rsquo;assunzione di esistenza: per ogni osservabile ne esiste almeno uno di quella classe. Chi misura con uno strumento reale, non ideale, non ha un controesempio al postulato: ha uno strumento fuori classe.</p>
   <p>Il prezzo di questa mossa è che il postulato diventa più debole di come suona, e il guadagno è che diventa vero. Ballentine, nel capitolo 9, farà esattamente la stessa osservazione partendo dall&rsquo;altra estremità — dimostrando che una misura generica <i>non</i> può produrre un autostato — e la sua classe di misure legittime, quella di «filtraggio», è lo strumento ideale di Picasso con un altro nome.</p>`}
  ]},
  {t:'reveal', title:'La probabilità di transizione, e la verifica che è una buona definizione', tag:'costruzione', steps:[
   {label:'La definizione', body:R`
   <p>Picasso ora dà un nome alla probabilità: poiché per effetto della misura il sistema compie una transizione a un autostato, la probabilità $p_i$ di trovare l&rsquo;autovalore $\xi_i$ si chiama <b>probabilità di transizione</b> da $|A\rangle$ a $|\xi_i\rangle$. E generalizzando a due stati qualsiasi, postula che la probabilità che una misura sul sistema nello stato $|A\rangle$ dia lo stato $|B\rangle$ <i>non dipenda dallo strumento ideale usato</i> e valga</p>
   $$P(|A\rangle\to|B\rangle)=\frac{|\langle B|A\rangle|^{2}}{\langle A|A\rangle\langle B|B\rangle}.$$
   <p>Per vettori normalizzati a uno il denominatore è uno e si legge nella forma familiare $P=|\langle B|A\rangle|^2$ (Picasso, eq. 4.5).</p>`},
   {label:'Primo controllo: non dipende dai vettori, solo dagli stati', body:R`
   <p>Un vettore e il suo multiplo rappresentano lo stesso stato fisico — è il contenuto dello stato-raggio. Quindi una formula per una quantità fisica <i>deve</i> essere insensibile al fattore. Picasso lo verifica: se $\alpha$ e $\beta$ sono numeri complessi non nulli, $\alpha|A\rangle$ e $\beta|B\rangle$ rappresentano gli stessi stati, e</p>
   $$P(\alpha|A\rangle\to\beta|B\rangle)=\frac{|\alpha|^{2}|\beta|^{2}\,|\langle B|A\rangle|^{2}}{|\alpha|^{2}\langle A|A\rangle\,|\beta|^{2}\langle B|B\rangle}=P(|A\rangle\to|B\rangle)$$
   <p>perché i fattori si semplificano: $\frac{|\alpha|^{2}|\beta|^{2}}{|\alpha|^{2}|\beta|^{2}}=1$. Si noti che il numeratore porta $|\alpha|^2|\beta|^2$ e non $\alpha\beta$: è il modulo quadro a cancellare la fase, e la cancellazione funziona <i>solo</i> perché la definizione prende il modulo quadro del prodotto scalare e non il prodotto scalare. Se la probabilità fosse stata $\langle B|A\rangle$ nuda, cambiare la fase di un vettore avrebbe cambiato la previsione fisica — e la teoria sarebbe stata sbagliata al primo esperimento.</p>`},
   {label:'Secondo controllo: la probabilità sta fra zero e uno, e lo decide Schwarz', body:R`
   <p>Una probabilità deve stare in $[0,1]$. Che sia non negativa è ovvio (è un modulo quadro diviso per norme positive). Che non superi uno è la <span class="str" data-str="disuguaglianza-di-schwarz">disuguaglianza di Schwarz</span>:</p>
   $$|\langle B|A\rangle|^{2}\le\langle A|A\rangle\langle B|B\rangle$$
   <p>— e questo è un punto che vale segnalare, perché mostra a che cosa serve davvero Schwarz in meccanica quantistica. Non è un lemma tecnico sugli spazi con prodotto scalare: è l&rsquo;asserzione che la formula di Picasso <i>è</i> una probabilità. Senza Schwarz, la definizione sarebbe mal posta.</p>
   <p>Vale vedere da dove viene il segno, almeno nel caso a due dimensioni reali, perché la dimostrazione generale lo nasconde dietro una minimizzazione. Con $A=(a_1,a_2)$ e $B=(b_1,b_2)$ reali si calcola la differenza fra i due membri e si trova un&rsquo;identità (è l&rsquo;identità di Lagrange):</p>
   $$(a_1^{2}+a_2^{2})(b_1^{2}+b_2^{2})-(a_1b_1+a_2b_2)^{2}=(a_1b_2-a_2b_1)^{2}$$
   <p>Il membro di destra è un quadrato, dunque non negativo: la disuguaglianza è dimostrata, e di più — <i>si vede quando vale l&rsquo;uguaglianza</i>, cioè quando $a_1b_2=a_2b_1$, che è la condizione di proporzionalità dei due vettori. Quindi $P=1$ se e solo se $|A\rangle$ e $|B\rangle$ sono proporzionali, cioè rappresentano lo stesso stato. Lo scarto $(a_1b_2-a_2b_1)^2$ è il quadrato dell&rsquo;area del parallelogramma costruito sui due vettori: la probabilità di transizione è uno meno, in proporzione, l&rsquo;area che i due stati «aprono» fra loro. In dimensione maggiore e con componenti complesse l&rsquo;identità diventa una somma di quadrati di minori, ma la lettura resta questa.</p>
   <p>Picasso legge anche i due casi estremi. Si ha $P=0$ se e solo se $|A\rangle$ e $|B\rangle$ sono ortogonali — «<i>non si hanno transizioni fra stati ortogonali</i>» — e $P=1$ se e solo se i due vettori rappresentano lo stesso stato (che è il caso di uguaglianza in Schwarz, cioè vettori proporzionali). L&rsquo;ortogonalità, che in mq-03 era una proprietà algebrica degli autovettori di autovalori distinti, qui acquista il suo significato fisico: <b>due stati sono ortogonali quando nessuna misura ideale porta dall&rsquo;uno all&rsquo;altro</b>.</p>`}
  ]},
  {t:'plot', title:'La legge di Malus, che qui è un teorema e non un dato sperimentale',
   intro:R`Il collaudo fisico della definizione è il caso in cui l&rsquo;esperimento era noto da due secoli. Un fotone polarizzato linearmente a $\vartheta$ rispetto all&rsquo;asse ottico si scrive $|e_\vartheta\rangle=\cos\vartheta\,|e_1\rangle+\sin\vartheta\,|e_2\rangle$ nella base dei due autostati del cristallo. La probabilità di transizione allo stato $|e_1\rangle$ è allora $P=|\langle e_1|e_\vartheta\rangle|^2=\cos^{2}\vartheta$, e la somma delle due probabilità vale $\cos^{2}\vartheta+\sin^{2}\vartheta=1$ — la particella esce da una delle due uscite, da nessun&rsquo;altra. A $60^\circ$: $\cos^{2}60^{\circ}=\frac14$, un fotone su quattro. Questa è la legge di Malus, che in ottica classica si enuncia sull&rsquo;intensità di un fascio e qui esce come previsione su un singolo fotone.`,
   plots:[
    {kind:'func2d', xr:[0,3.15], yr:[-0.1,1.15], height:330, ticks:6,
     title:'le due probabilità di transizione, e la loro somma',
     curves:[
      {f:'cos(x)*cos(x)', col:'#4c8dff', width:2.6, label:'P→e₁ = cos²θ'},
      {f:'sin(x)*sin(x)', col:'#ff8a5c', width:2.6, label:'P→e₂ = sin²θ'},
      {f:'1', col:'#8a93a6', width:1.3, label:'somma = 1'}
     ],
     xlabel:'θ (radianti)', ylabel:'probabilità'}
   ],
   leggi:R`<p><b>Che cosa guardare.</b> Le due curve si scambiano i ruoli: dove una vale uno l&rsquo;altra vale zero, e si incrociano a $\vartheta=\pi/4$ dove entrambe valgono $\tfrac12$. La retta orizzontale è la loro somma, costante a uno per ogni angolo. Ai bordi, $\vartheta=0$ e $\vartheta=\pi/2$, lo stato di partenza <i>è</i> un autostato: l&rsquo;esito è certo, e una delle due probabilità è esattamente uno. <b>Che cosa impararne.</b> Tre cose, in ordine di importanza crescente. La prima è il controllo di routine: la somma delle probabilità su una base ortonormale completa fa uno sempre, ed è il primo numero da verificare in qualunque esercizio. La seconda è che a $\vartheta=\pi/4$ lo stato è <i>massimamente indeterminato</i> rispetto a questa osservabile — torna in tappa 06 come massimo della varianza. La terza, e la più sottile: la curva $\cos^2\vartheta$ è <b>liscia</b>, mentre ogni singolo fotone dà un esito <i>discreto</i> (destra o sinistra). La legge classica di Malus misura l&rsquo;intensità di un fascio e vede una curva continua; la lettura quantistica dice che quella curva è una probabilità, e i singoli eventi sono tutti o nulla. Lo stesso grafico, letto nei due modi, è la differenza fra le due fisiche.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Picasso dimostra che gli autovettori normalizzati di un&rsquo;osservabile non degenere sono ortonormali <i>usando la probabilità di transizione</i>. Come, esattamente, e perché è notevole?`,
    a:R`La catena è brevissima: $|\langle\xi_i|\xi_j\rangle|^2$ è la probabilità che una misura di $\xi$ porti da $|\xi_j\rangle$ a $|\xi_i\rangle$; ma se $i\neq j$ questa probabilità è <i>zero</i>, perché una misura su un autostato di autovalore $\xi_j$ dà sempre $\xi_j$ e mai $\xi_i$. Quindi $\langle\xi_i|\xi_j\rangle=\delta_{ij}$. È notevole per il verso in cui procede: in mq-03 l&rsquo;ortogonalità era un <i>teorema algebrico</i> dedotto dall&rsquo;autoaggiuntezza dell&rsquo;operatore; qui è una conseguenza <i>fisica</i> del fatto che l&rsquo;esito su un autostato è certo, e l&rsquo;operatore non è ancora stato introdotto. Picasso costruisce l&rsquo;operatore solo <i>dopo</i>, al paragrafo 4.5, definendolo sulla base degli autovettori come $\xi^{op}|\xi_i\rangle=\xi_i|\xi_i\rangle$ — cioè l&rsquo;operatore autoaggiunto è l&rsquo;ultimo oggetto a comparire, non il primo. E la completezza la dimostra per assurdo: se esistesse un $|A\rangle$ ortogonale a tutti gli autovettori, tutte le $p_i$ sarebbero nulle, contro $\sum_i p_i=1$.`},
   {q:R`Due stati che danno le stesse probabilità per <i>tutte</i> le misure di una data osservabile $\xi$ sono lo stesso stato?`,
    a:R`No, e Picasso dà il controesempio esatto. I due vettori $|A\rangle=\sum_j a_j|\xi_j\rangle$ e $|B\rangle=\sum_j a_j e^{i\varphi_j}|\xi_j\rangle$ hanno gli stessi $|a_j|^2$, quindi danno probabilità identiche per ogni esito di $\xi$ — eppure sono stati diversi. Il suo esempio fisico: $|e_\vartheta\rangle=\cos\vartheta|e_1\rangle+\sin\vartheta|e_2\rangle$ e $|e_{\vartheta\varphi}\rangle=\cos\vartheta|e_1\rangle+\sin\vartheta\,e^{i\varphi}|e_2\rangle$ sono polarizzazione <i>rettilinea</i> e <i>ellittica</i>, indistinguibili col cristallo birifrangente ma distinguibili con un polaroid a $45^\circ$ — cioè misurando la probabilità di transizione allo stato $\frac1{\sqrt2}(|e_1\rangle+|e_2\rangle)$, dove le fasi relative interferiscono. La morale operativa: <b>le fasi relative dei coefficienti non sono fisicamente vuote</b>, sono invisibili solo rispetto alla misura di quella particolare osservabile. La fase <i>globale</i>, quella sì, non è mai visibile — e la distinzione fra le due è una delle poche cose su cui non si può essere sciatti senza sbagliare conti.`}
  ]}
]},
/* ---------------- 03 · LA PROCEDURA, FINO A RENDERLA AUTOMATICA ---------------- */
{ num:'03', title:'La procedura, fino a renderla automatica', meta:'i quattro passi di Shankar · un sistema a tre livelli svolto per intero · i controlli che prendono quasi ogni errore',
  blocchi:[
  {t:'prosa', title:'Che cosa chiede davvero l’esame, e in che ordine si risponde', tag:'costruzione', html:R`
  <p>Trentatré scritti su quarantasette di questo corso contengono, in una forma o nell&rsquo;altra, la frase «<i>si determinino i valori misurabili dell&rsquo;osservabile e le corrispondenti probabilità</i>». Non è una domanda di teoria: è un algoritmo, e chi lo esegue meccanicamente guadagna il tempo che serve per il resto del compito. Shankar lo scrive come un programma in quattro passi, e vale enunciarlo prima di usarlo perché l&rsquo;ordine dei passi non è negoziabile.</p>
  <p><b>Primo</b>: si costruisce l&rsquo;operatore $\Omega$ nella base in cui è dato il problema (una matrice, se lo spazio è a dimensione finita). <b>Secondo</b>: si risolvono il problema agli autovalori, cioè si trovano gli autovalori $\omega_i$ e gli autovettori $|\omega_i\rangle$ — e gli autovalori <i>sono</i> i valori misurabili, non ne esistono altri, come la tappa 01 ha dedotto e non postulato. <b>Terzo</b>: si prende il prodotto scalare $\langle\omega_i|\psi\rangle$ con lo stato. <b>Quarto</b>: se lo spettro è discreto, $|\langle\omega_i|\psi\rangle|^2$ è la probabilità; se è continuo, è una densità e va integrata su un intervallo.</p>
  <p>Griffiths lo enuncia come un singolo postulato compatto, che chiama <b>interpretazione statistica generalizzata</b> e che è utile sapere a memoria nella sua formulazione originale, perché copre i due casi in un colpo:</p>
  <p style="padding-left:1.2em;border-left:3px solid rgba(120,160,255,.45)"><i>&laquo;Se misuri un&rsquo;osservabile $Q(x,p)$ su una particella nello stato $\Psi(x,t)$, è certo che otterrai uno degli autovalori dell&rsquo;operatore hermitiano $\hat Q(x,-i\hbar\,\partial/\partial x)$. Se lo spettro di $\hat Q$ è discreto, la probabilità di ottenere il particolare autovalore $q_n$ associato all&rsquo;autofunzione ortonormalizzata $f_n(x)$ è $|c_n|^2$, dove $c_n=\langle f_n|\Psi\rangle$. Se lo spettro è continuo, con autovalori reali $q(z)$ e autofunzioni $f_z(x)$ ortonormalizzate alla Dirac, la probabilità di ottenere un risultato nell&rsquo;intervallo $dz$ è $|c(z)|^2dz$, dove $c(z)=\langle f_z|\Psi\rangle$. Sulla misura, la funzione d&rsquo;onda &lsquo;collassa&rsquo; nella corrispondente autofunzione.&raquo;</i> &mdash; Griffiths, par. 3.4, pag. stampata 108</p>
  <p>Griffiths aggiunge, e ha ragione: «insieme all&rsquo;equazione di Schrödinger, che ti dice come la funzione d&rsquo;onda evolve nel tempo, questo è il fondamento della meccanica quantistica». Due enunciati, e tutta la teoria.</p>`},
  {t:'reveal', title:'Il sistema che attraversa tutto il movimento', tag:'esempio', steps:[
   {label:'L’osservabile, e i suoi autovalori', body:R`
   <p>Si lavora su un sistema a tre livelli — abbastanza grande per avere una degenerazione, abbastanza piccolo per fare i conti a mano. Nella base $\{|1\rangle,|2\rangle,|3\rangle\}$ in cui il problema è dato, l&rsquo;osservabile è</p>
   $$\hat A=\begin{pmatrix}2&0&0\\0&1&1\\0&1&1\end{pmatrix}$$
   <p>ed è hermitiana (reale e simmetrica), quindi è un&rsquo;osservabile legittima. <b>Passo 2.</b> Il polinomio caratteristico si legge a blocchi: il primo indice è disaccoppiato dagli altri due, quindi $\det(\hat A-\lambda\mathbb 1)=(2-\lambda)\big[(1-\lambda)^{2}-1\big]=-\lambda(\lambda-2)^{2}$. Gli autovalori sono dunque $\lambda=0$, semplice, e $\lambda=2$, <b>doppio</b>. Questi, e solo questi, sono i valori che una misura può restituire.</p>
   <p>Gli autovettori. Per $\lambda=2$ il sistema $(\hat A-2)\,v=0$ dà due condizioni indipendenti soltanto: la prima componente è libera, e la seconda e terza devono essere uguali. L&rsquo;autospazio è bidimensionale, e una sua base ortonormale è</p>
   $$|e_1\rangle=\begin{pmatrix}1\\0\\0\end{pmatrix},\qquad |u\rangle=\frac{1}{\sqrt2}\begin{pmatrix}0\\1\\1\end{pmatrix}$$
   <p>Per $\lambda=0$ resta una sola direzione, quella con la seconda e terza componente opposte:</p>
   $$|v\rangle=\frac{1}{\sqrt2}\begin{pmatrix}0\\1\\-1\end{pmatrix}$$
   <p>I tre vettori sono mutuamente ortogonali (si verifica a occhio: ogni coppia ha prodotto scalare nullo) e normalizzati, dunque formano una base ortonormale di autovettori — che è esattamente ciò che l&rsquo;autoaggiuntezza garantisce.</p>`},
   {label:'Lo stato, e il primo controllo da fare sempre', body:R`
   <p>Il sistema è preparato nello stato</p>
   $$|\psi\rangle=\frac{1}{\sqrt6}\begin{pmatrix}1\\2\\-1\end{pmatrix}$$
   <p>e la prima cosa da fare — <i>prima</i> di calcolare qualunque probabilità — è verificare che sia normalizzato: $\frac{1+4+1}{6}=1$. Se un esercizio dà lo stato non normalizzato, come capita spesso, la normalizzazione va fatta qui e non alla fine, perché tutte le probabilità che seguono ne dipendono per lo stesso fattore e sbagliarlo falsa ogni numero.</p>
   <p><b>Passo 3.</b> I tre prodotti scalari con gli autovettori. Il primo è immediato, perché $|e_1\rangle$ seleziona la prima componente: $\langle e_1|\psi\rangle=\frac{1}{\sqrt6}$. Gli altri due si ottengono moltiplicando riga per colonna, con il fattore $\frac1{\sqrt2}$ dell&rsquo;autovettore che si combina col $\frac1{\sqrt6}$ dello stato in un $\frac{1}{\sqrt{12}}$:</p>
   $$\langle u|\psi\rangle=\frac{2+(-1)}{\sqrt{12}}=\frac{1}{\sqrt{12}},\qquad \langle v|\psi\rangle=\frac{2-(-1)}{\sqrt{12}}=\frac{3}{\sqrt{12}}$$
   <p>e si noti che il segno meno della terza componente dello stato cambia ruolo nei due casi: in $\langle u|\psi\rangle$ si sottrae (perché $|u\rangle$ ha le ultime due componenti concordi) e in $\langle v|\psi\rangle$ si somma. È il punto in cui si sbaglia più spesso, e il controllo che lo prende è il prossimo.</p>`},
   {label:'Passo 4: le probabilità, e il controllo che chiude', body:R`
   <p>I moduli quadri dei tre coefficienti:</p>
   $$\Big(\frac{1}{\sqrt6}\Big)^{2}=\frac16,\qquad \Big(\frac{2-1}{\sqrt{12}}\Big)^{2}=\frac1{12},\qquad \Big(\frac{2+1}{\sqrt{12}}\Big)^{2}=\frac34$$
   <p><b>Il controllo che non si salta mai:</b> la loro somma deve fare uno, perché i tre autovettori formano una base completa e il sistema deve finire in qualche autostato. $\frac16+\frac1{12}+\frac34=1$. Se questo numero non viene uno, c&rsquo;è un errore <i>prima</i> — nella normalizzazione dello stato, in un autovettore, o in un segno — e cercarlo adesso costa meno che scoprirlo dopo tre domande.</p>
   <p>Ora il passaggio che distingue questo esercizio da uno a spettro non degenere, e che è la ragione per cui la degenerazione è l&rsquo;errore tipico. Le probabilità richieste sono quelle <b>degli autovalori</b>, non dei tre autovettori. L&rsquo;autovalore $2$ ha due autovettori, e le loro probabilità <i>si sommano</i>:</p>
   $$p(2)=\frac16+\frac1{12}=\frac14,\qquad p(0)=\frac34$$
   <p>Risposta alla domanda d&rsquo;esame: i valori misurabili sono $0$ e $2$; le probabilità sono $\tfrac34$ e $\tfrac14$. Il valor medio segue immediatamente dalla definizione di media pesata:</p>
   $$\langle\hat A\rangle=2\cdot\frac14+0\cdot\frac34=\frac12$$
   <p>e si noti che $\tfrac12$ <b>non è un autovalore</b>: nessuna singola misura darà mai quel numero. È la media su un insieme di misure, e il fatto che non sia un esito possibile non è un&rsquo;anomalia — ci torna la tappa 06.</p>`}
  ]},
  {t:'plot', title:'Lo spettro con i suoi pesi: due righe, non tre',
   intro:R`La distribuzione di probabilità di $\hat A$ nello stato $|\psi\rangle$ vive su due punti soli, $0$ e $2$, con pesi $\tfrac34$ e $\tfrac14$. Non si può disegnare con delle delta, quindi qui ciascuna è resa come una gaussiana strettissima la cui <i>area</i> è la probabilità — una resa grafica, non l&rsquo;oggetto matematico. La linea tratteggiata verticale ideale sta a $\langle\hat A\rangle=\tfrac12$: il valor medio cade in mezzo al nulla, dove non c&rsquo;è alcuna riga.`,
   plots:[
    {kind:'func2d', xr:[-1,3.2], yr:[-0.5,9], height:330, ticks:6,
     title:'le due righe dello spettro, e il valor medio che cade fra le due',
     curves:[
      {f:'0.75*exp(-x*x/0.004)/sqrt(3.1416*0.004)', col:'#4c8dff', width:2.6, label:'riga a λ=0, peso 3/4'},
      {f:'0.25*exp(-(x-2)*(x-2)/0.004)/sqrt(3.1416*0.004)', col:'#ff8a5c', width:2.6, label:'riga a λ=2, peso 1/4'},
      {f:'(abs(x-0.5)<0.01?9:0)', col:'#9ad67a', width:1.6, label:'⟨A⟩ = 1/2'}
     ],
     xlabel:'λ', ylabel:'densità (area = probabilità)'}
   ],
   leggi:R`<p><b>Che cosa guardare.</b> La riga a $\lambda=0$ è tre volte più alta di quella a $\lambda=2$, perché l&rsquo;area sotto ciascuna è la probabilità e le due hanno la stessa larghezza: il rapporto delle altezze <i>è</i> il rapporto $\tfrac34:\tfrac14=3:1$. La linea verde sottile marca $\langle\hat A\rangle=\tfrac12$, e sta in una regione dove la densità è esattamente zero. <b>Che cosa impararne.</b> Due cose. La prima è che il valor medio di un&rsquo;osservabile a spettro discreto generalmente <i>non</i> è un valore ottenibile: è il baricentro delle righe, e un baricentro non deve stare su una massa. Chiedere «che valore ha $\hat A$ nello stato $|\psi\rangle$?» è una domanda senza risposta; chiedere «quali valori può dare e con che probabilità?» ne ha una, ed è questa figura. La seconda è che il valor medio sta più vicino alla riga più pesante, e questo offre un controllo di plausibilità a costo zero su ogni esercizio: se dai pesi $\tfrac34$ su $0$ e $\tfrac14$ su $2$ esce un valor medio di $1{,}5$, il conto è sbagliato — la media deve cadere fra $0$ e $2$ e stare dalla parte del peso maggiore.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Un compito chiede le probabilità di misura e lo stato è dato come $|\psi\rangle=(1,2,-1)^{T}$, senza fattore di normalizzazione. Che differenza fa?`,
    a:R`Fa una differenza di un fattore $6$ su <i>ogni</i> probabilità, cioè rende l&rsquo;intero risultato sbagliato, e la cosa pericolosa è che non si vede dai numeri relativi. Senza normalizzare si otterrebbe $|\langle e_1|\psi\rangle|^2=1$, $|\langle u|\psi\rangle|^2=\tfrac12$, $|\langle v|\psi\rangle|^2=\tfrac92$: i rapporti fra loro sono corretti, ma la somma fa $6$ invece di $1$. Due strade entrambe valide: normalizzare lo stato all&rsquo;inizio (dividendo per $\sqrt6$) oppure usare la formula con denominatore $p_i=|\langle\omega_i|\psi\rangle|^2/\langle\psi|\psi\rangle$, che è la forma di Picasso con i vettori non normalizzati. La seconda è più sicura sotto esame, perché non richiede di ricordare di aver normalizzato. In ogni caso il controllo è lo stesso: <b>la somma deve fare uno</b>, e se fa $6$ si sa subito cosa è successo.`},
   {q:R`Perché gli autovalori, e non altri numeri, sono «i valori misurabili»? È un postulato o un teorema?`,
    a:R`Dipende da come si è impostata la teoria, e il movimento ha visto entrambe le versioni. Nella strada di Ballentine e von Neumann (tappa 01) è un <b>teorema</b>: dal solo postulato sul valor medio si ricava la densità $g(r)=\sum_n\langle r_n|\rho|r_n\rangle\,\delta(r-r_n)$, che è nulla fuori dallo spettro — quindi «la probabilità è zero che una variabile dinamica assuma un valore diverso da un autovalore». von Neumann lo nota nella stessa forma: se l&rsquo;intervallo $I_j$ sta fuori dallo spettro, $E_j(\lambda)$ è costante lì, dunque $E_j(I_j)=0$ e $P=0$. Nella strada di Picasso e Griffiths è invece parte del <b>postulato</b>: gli autovalori sono introdotti <i>come</i> gli esiti possibili, e gli autostati come gli stati a esito certo. Le due versioni non si contraddicono: Picasso assume ciò che Ballentine deduce, e in cambio arriva al conto in due pagine invece che in venti. Operativamente non cambia nulla; concettualmente cambia che cosa si sta assumendo del mondo.`}
  ]}
]},

/* ---------------- 04 · LA DEGENERAZIONE, E IL POSTULATO DI VON NEUMANN COME PROIEZIONE ---------------- */
{ num:'04', title:'La degenerazione, e il postulato di von Neumann come proiezione', meta:'perche le probabilita si sommano · l autospazio come sottospazio chiuso · lo stato dopo la misura e il vettore piu vicino · l indipendenza dalla base',
  blocchi:[
  {t:'prosa', title:'Il buco che la tappa 02 lascia aperto, e che non è un dettaglio', tag:'costruzione', html:R`
  <p>Il postulato enunciato nella tappa 02 dice che dopo una misura con esito $\xi_i$ il sistema è «in un autostato di $\xi$ corrispondente all&rsquo;autovalore $\xi_i$». Se quell&rsquo;autovalore è <b>non degenere</b> l&rsquo;informazione è completa: c&rsquo;è un solo autostato, e si sa esattamente dove si è finiti. Picasso lo dice con precisione: «<i>una misura di un&rsquo;osservabile non degenere determina sempre completamente lo stato del sistema dopo la misura</i>».</p>
  <p>Se l&rsquo;autovalore è <b>degenere</b>, il postulato non basta. Parole sue: «<i>se cioè $\xi_i$ è un autovalore degenere, sappiamo solo che il sistema dopo la misura si trova in un autostato di $\xi$ corrispondente all&rsquo;autovalore trovato, ma non sappiamo in quale</i>» (pag. stampata 59-60). E aggiunge l&rsquo;osservazione che rende la questione urgente invece che accademica: «<i>il più delle volte le osservabili sono degeneri</i>». Il caso comodo è l&rsquo;eccezione.</p>
  <p>L&rsquo;esempio che Picasso usa è bello perché mostra che la degenerazione dipende da che cosa si considera «il sistema». Il cristallo birifrangente è un&rsquo;osservabile <i>non degenere</i> se il sistema è il fotone a prescindere dal suo stato di moto, cioè se lo spazio degli stati è solo quello della polarizzazione; diventa <i>degenere</i> se il sistema è il fotone per intero, perché il cristallo determina la polarizzazione ma non lo stato di moto. Un apparato più ricco — cristallo più prisma — torna non degenere. La degenerazione non è una proprietà dell&rsquo;operatore in astratto: è la misura di quanta informazione quell&rsquo;apparato <i>non</i> raccoglie.</p>`},
  {t:'reveal', title:'Perché l’autospazio è un sottospazio, e la dimostrazione è fisica', tag:'costruzione', steps:[
   {label:'Il teorema, e la dimostrazione per assurdo di Picasso', body:R`
   <p>Prima di poter enunciare il postulato che chiude il buco serve sapere che l&rsquo;insieme degli autovettori di uno stesso autovalore è un <b>sottospazio lineare</b> — altrimenti «proiettare su di esso» non vorrebbe dire nulla. In mq-03 questo era un teorema di algebra lineare in una riga: il nucleo di $\hat A-a$ è un sottospazio perché è il nucleo di un&rsquo;applicazione lineare. Picasso lo dimostra invece <i>fisicamente</i>, e la sua dimostrazione vale leggerla perché usa solo i postulati sulle misure.</p>
   <p>Sia $\xi_1$ un autovalore degenere, con due autostati $|\xi_1'\rangle$ e $|\xi_1''\rangle$. Si pone $|A\rangle=\alpha|\xi_1'\rangle+\beta|\xi_1''\rangle$ e si vuole mostrare che una misura di $\xi$ su $|A\rangle$ dà sempre $\xi_1$. Per assurdo: supponiamo di trovare $\xi_i$ con $i\ge2$. Allora la probabilità di quella transizione è $p_i=|\langle A|\xi_i\rangle|^2$, ma</p>
   $$\langle A|\xi_i\rangle=\alpha^{*}\langle\xi_1'|\xi_i\rangle+\beta^{*}\langle\xi_1''|\xi_i\rangle=0$$
   <p>perché gli autovettori di autovalori <i>diversi</i> sono ortogonali — fatto già dimostrato. Quindi $p_i=0$ per ogni $i\ge2$, contro l&rsquo;ipotesi. La conclusione si estende a combinazioni di un numero qualsiasi di autovettori, finito o infinito, «<i>grazie alla continuità del prodotto scalare</i>» — ed è quel dettaglio che rende il sottospazio <b>chiuso</b>, cioè fa dell&rsquo;autospazio un oggetto su cui proiettare senza uscirne.</p>`},
   {label:'Grado di degenerazione, e la libertà che non si può togliere', body:R`
   <p>La dimensione dell&rsquo;autospazio si chiama <b>grado di degenerazione</b> dell&rsquo;autovalore: vale $1$ per un autovalore non degenere, e nel caso dell&rsquo;energia è il numero di stati indipendenti corrispondenti a quel livello — la molteplicità che si conta nei conti di statistica. Dentro ogni autospazio degenere la scelta di una base ortonormale <b>non è unica</b>, e Picasso lo sottolinea: «<i>chiaramente in ogni autospazio degenere dell&rsquo;osservabile sono possibili infinite scelte di sistemi di vettori fra loro ortonormali</i>».</p>
   <p>Questa libertà è il punto delicato. Se la probabilità dell&rsquo;autovalore dipendesse da quale base si è scelta dentro l&rsquo;autospazio, la teoria sarebbe mal definita: due fisici che fanno lo stesso conto con due basi diverse otterrebbero previsioni diverse per lo stesso esperimento. La tappa mostra, con un conto esplicito, che non succede — ed è una delle verifiche di consistenza che vale fare una volta nella vita invece di accettarla.</p>`}
  ]},
  {t:'reveal', title:'Il postulato di von Neumann, nella forma geometrica', tag:'costruzione', steps:[
   {label:'L’enunciato, che è una frase sulla geometria', body:R`
   <p>Ed ecco la risposta ai due problemi lasciati aperti — quanto vale la probabilità di un autovalore degenere, e in che stato finisce il sistema. Picasso la dà in una frase:</p>
