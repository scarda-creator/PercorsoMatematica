   <p>Che la coerenza sopravviva a una separazione di diversi centimetri non è un caso fortunato: è un risultato di ingegneria. Lo spettrometro è ricavato da un unico grande cristallo di silicio, e le separazioni relative delle sue parti sono stabili entro la distanza interatomica. È il genere di dettaglio che conviene ricordare, perché dice che la coerenza macroscopica non è impossibile — è <i>difficile</i>, e quanto difficile lo misura il conto che segue.</p>`},
   {label:'L&rsquo;ambiente dentro il sistema: il coefficiente che spegne l&rsquo;interferenza', body:R`
   <p>Si supponga, al contrario delle condizioni dell&rsquo;esperimento reale, che lo spettrometro non sia di alta precisione e che le separazioni fra i punti $A,B,C,D$ fluttuino in modo casuale più della lunghezza d&rsquo;onda di de Broglie del neutrone. Allora le fasi $\alpha$ e $\beta$ fluttuano, neutroni diversi attraversano configurazioni diverse, e le distribuzioni osservate sono una media su quelle fluttuazioni. Se la differenza di fase fluttua così ampiamente da distribuire uniformemente il termine fuori diagonale su un cerchio nel piano complesso, la media dello stato è diagonale e si riduce proprio a $\rho_{\text{inc}}$.</p>
   <p>C&rsquo;è una seconda strada, più istruttiva, che consiste nell&rsquo;includere l&rsquo;ambiente <i>dentro</i> il sistema. I neutroni che seguono il cammino $ABD$ interagiscono con l&rsquo;ambiente diversamente da quelli che seguono $ACD$, e lo stato totale diventa</p>
   $$|\Psi\rangle=\psi_+(x)|+\rangle|e_1\rangle+\psi_-(x)|-\rangle|e_2\rangle ,$$
   <p>dove $|e_1\rangle$ e $|e_2\rangle$ sono gli stati dell&rsquo;ambiente risultanti dai due cammini. Prendendo la traccia parziale sui gradi di libertà dell&rsquo;ambiente, lo stato di spin diventa</p>
   $$\rho=\begin{pmatrix}|\psi_+|^2 & \psi_+\psi_-^{*}\langle e_2|e_1\rangle\\ \psi_-\psi_+^{*}\langle e_1|e_2\rangle & |\psi_-|^2\end{pmatrix} ,$$
   <p>e il valor medio misurabile, scrivendo $s=\langle e_2|e_1\rangle$ reale per semplicità, diventa</p>
   $$\langle\sigma_x\rangle=s\cos(\alpha-\beta) .$$
   <p>Ecco il meccanismo della decoerenza in un solo coefficiente. Se $|e_1\rangle=|e_2\rangle$ allora $s=1$ e l&rsquo;inclusione dell&rsquo;ambiente non cambia nulla — «<i>ed è una buona approssimazione delle condizioni dell&rsquo;esperimento reale</i>». Se i due cammini agiscono sull&rsquo;ambiente in modo così diverso che $|e_1\rangle$ e $|e_2\rangle$ diventano ortogonali, allora $s=0$, l&rsquo;interferenza si spegne del tutto e lo stato si riduce alla miscela incoerente. Fra i due estremi c&rsquo;è un continuo, e l&rsquo;ampiezza dell&rsquo;oscillazione osservata <i>misura</i> la sovrapposizione fra due stati dell&rsquo;ambiente che nessuno guarda.</p>
   <p>La lettura che Ballentine ne trae è la sua tesi centrale, e dopo questo conto è difficile dissentirne: «<i>lo stato cosiddetto «ridotto» è fisicamente significativo in certe circostanze. Ma è soltanto una descrizione fenomenologica di un effetto sul sistema dovuto al suo ambiente, [...] e non ha nulla di specificamente a che fare con la misura</i>».</p>`}
  ]},
  {t:'plot', title:'Il coefficiente di coerenza, e come spegne l&rsquo;interferenza',
   intro:R`La formula $\langle\sigma_x\rangle=s\cos(\alpha-\beta)$ si disegna in funzione della differenza di fase, al variare della sovrapposizione $s$ fra i due stati dell&rsquo;ambiente. È il disegno di un esperimento reale: l&rsquo;asse orizzontale è ciò che si controlla girando lo sfasatore, l&rsquo;asse verticale è ciò che si legge. L&rsquo;esperimento di Summhammer e collaboratori ha trovato la curva di ampiezza piena; la previsione della riduzione del pacchetto è la retta a zero.`,
   plots:[
    {kind:'func2d', xr:[0,12.566], yr:[-1.25,1.25], height:330, ticks:7,
     title:'<sigma x> in funzione della differenza di fase, per tre valori della coerenza s',
     curves:[
      {f:'cos(x)', col:'#4c8dff', width:2.8, label:'s = 1 (coerenza piena)'},
      {f:'0.45*cos(x)', col:'#ff9f45', width:2.4, label:'s = 0.45 (ambiente parzialmente correlato)'},
      {f:'0', col:'#e0565b', width:2.2, label:'s = 0 : previsione della miscela incoerente'}
     ],
     xlabel:'alpha - beta (sfasamento imposto)', ylabel:'<sigma x>'}
   ],
   leggi:R`<p><b>Che cosa guardare.</b> Le tre curve hanno la stessa <i>forma</i> e ampiezze diverse: la decoerenza non sposta i massimi e non cambia il periodo, schiaccia il contrasto. È questo che rende l&rsquo;esperimento decisivo invece che suggestivo — non si confronta una previsione con un&rsquo;altra qualitativamente diversa, si misura un&rsquo;<i>ampiezza</i>, e l&rsquo;ipotesi di riduzione predice che quell&rsquo;ampiezza sia esattamente zero. Si osservi anche che tutte e tre le curve danno media nulla su un periodo intero: chi mediasse sullo sfasamento invece di risolverlo non vedrebbe nessuna differenza, ed è il motivo per cui l&rsquo;esperimento richiede uno sfasatore controllabile e non un fascio qualunque. <b>Che cosa impararne.</b> Che la coerenza è una quantità <i>misurabile con continuità</i> e non una proprietà sì-o-no, e che la domanda «lo stato si è ridotto?» ha una risposta sperimentale sotto forma di numero: $s$. Nei sistemi macroscopici $s$ è così piccolo che la curva blu è indistinguibile dalla rossa, e lì — ma solo lì — la riduzione è una buona descrizione fenomenologica.</p>`},
  {t:'prosa', title:'La misura di filtraggio, e il disaccordo dichiarato e non risolto', tag:'architettura', html:R`
  <p>Resta la parte costruttiva, ed è quella che riconcilia tutto con i conti delle tappe precedenti. Se si vuole considerare la preparazione dello stato $\rho$ seguita dalla misura di $R$ come un&rsquo;operazione composita che prepara un nuovo stato $\rho'$, in generale occorre una descrizione dettagliata dell&rsquo;apparato e un&rsquo;analisi dinamica del suo funzionamento: «<i>si può fare per ogni caso particolare, ma non sembra possibile nessun trattamento generale</i>». C&rsquo;è però una specie di misura che si tratta facilmente, ed è quella di <b>filtraggio</b>, in cui l&rsquo;ensemble prodotto dalla preparazione viene separato in sotto-ensemble secondo il valore di $R$ — l&rsquo;apparato di Stern e Gerlach ne è l&rsquo;esempio. Se si considera la misura successiva soltanto sul sotto-ensemble con $R\in\Delta_a$ e si ignora il resto, il filtraggio può essere considerato come la preparazione di un nuovo stato</p>
  $$\rho'=\frac{M_R(\Delta_a)\,\rho\,M_R(\Delta_a)}{\operatorname{Tr}\{M_R(\Delta_a)\,\rho\,M_R(\Delta_a)\}} ,$$
  <p>che è la formula del collasso — ricavata, qui, non da un postulato ma dalla definizione di probabilità condizionata applicata a un&rsquo;operazione di selezione. Il commento che Ballentine mette fra parentesi quadre è il più tagliente del capitolo, e indica il nome di chi ha confuso le due cose: «<i>la somiglianza fra misura e preparazione di stato nel caso del filtraggio è probabilmente la ragione per cui alcuni degli autori più antichi non hanno distinto fra questi due concetti. In effetti l&rsquo;affermazione di Dirac (1958, p. 36) secondo cui lo stato immediatamente dopo una misura di $R$ deve essere un autostato di $R$ sembra perversa a meno che la sua applicazione non sia ristretta alle misure di tipo filtraggio</i>».</p>
  <p>Qui il movimento si fermerebbe se il suo compito fosse scegliere una parte. Non lo è, e il disaccordo va dichiarato per quello che è. <b>Picasso, Shankar e Griffiths</b> enunciano il collasso come postulato, e Picasso aggiunge l&rsquo;onestà di chiarire che va letto come definizione di strumento ideale. <b>Ballentine</b> dimostra che come legge di evoluzione contraddice un teorema, e la recupera come conseguenza per le sole misure di filtraggio. Nessuna delle due posizioni si deduce dall&rsquo;altra, perché differiscono su che cosa si chiede al vettore di stato di descrivere — un sistema individuale o un ensemble — e quella è una scelta interpretativa che nessun esperimento discrimina. Ciò che l&rsquo;esperimento discrimina, e ha discriminato, è un&rsquo;altra cosa: se la coerenza sopravviva alla separazione dei fasci. E su quella la risposta è sì.</p>
  <p>La conseguenza pratica è una e va tenuta: <b>i problemi d&rsquo;esame descrivono misure di filtraggio</b> — si misura un&rsquo;osservabile, si trattiene il sotto-ensemble con un dato esito, si chiede che cosa dia la misura successiva. In quel regime le due letture danno la stessa formula, lo stesso numero e la stessa risposta. Il disaccordo non cambia un conto; cambia che cosa si risponde se all&rsquo;orale lo si chiede.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Se la decoerenza spiega perché non si vedono sovrapposizioni macroscopiche, in che senso il problema della misura resta aperto?`,
    a:R`La decoerenza spiega la <i>soppressione dell&rsquo;interferenza</i>, cioè perché il coefficiente $s$ sia minuscolo per un oggetto macroscopico e la curva di $\langle\sigma_x\rangle$ sia piatta. Non spiega la <b>selezione</b>: dopo la decoerenza lo stato dell&rsquo;insieme sistema più apparato più ambiente è ancora una sovrapposizione coerente, soltanto con i termini fuori diagonale spostati nei gradi di libertà dell&rsquo;ambiente, dove nessuno li guarda. La matrice diagonale che si ottiene prendendo la traccia parziale descrive bene ciò che si osserva, ma è il risultato di una scelta di non guardare, non di un processo fisico che abbia prodotto un esito. Chi legge il vettore di stato come descrizione di un ensemble non ha bisogno di niente di più; chi lo legge come descrizione di un individuo sì, e quel bisogno la decoerenza non lo soddisfa.`},
   {q:R`Il teorema generale della misura usa la linearità di $U$. Non si potrebbe salvare la riduzione con una dinamica non lineare?`,
    a:R`Logicamente sì, e sono state proposte: le teorie di collasso dinamico aggiungono all&rsquo;equazione di Schrödinger un termine stocastico non lineare costruito proprio per produrre la selezione. Hanno un prezzo e un pregio. Il prezzo è che modificano la teoria, dunque vanno misurate contro di essa, e introducono parametri nuovi — una scala a cui il collasso diventa efficace — che vanno fissati sperimentalmente. Il pregio è che quei parametri rendono le teorie <b>falsificabili</b>, e infatti ci sono esperimenti in corso che ne restringono lo spazio. Il che è il modo corretto di collocare l&rsquo;osservazione: il teorema di Ballentine non dice che la riduzione sia impossibile, dice che è impossibile <i>dentro</i> la meccanica quantistica come la si enuncia, e che chi la vuole deve cambiare la teoria, non interpretarla.`},
   {q:R`Nel conto dello stato misto iniziale, il sostenitore del meccanismo (iv) sperava in $\rho_d$ diagonale. Perché quella speranza era ragionevole?`,
    a:R`Perché sarebbe stato il risultato giusto <i>se</i> l&rsquo;interazione di misura avesse mescolato in modo incontrollato le fasi relative dei vari $m$. L&rsquo;intuizione è quella dell&rsquo;irreversibilità statistica: tanti gradi di libertà ignoti, dunque fasi casuali, dunque termini fuori diagonale che si mediano a zero. Il conto mostra dove l&rsquo;intuizione sbaglia, e il punto è delicato: la media sui $m$ nello stato finale $\rho_f=\sum_m w_m|\Psi_{mf}\rangle\langle\Psi_{mf}|$ è una media su stati che sono <i>tutti</i> sovrapposizioni con gli <b>stessi</b> coefficienti $c_{r}$, perché quei coefficienti vengono dallo stato dell&rsquo;oggetto e non dall&rsquo;apparato. L&rsquo;ignoranza è sull&rsquo;indice $m$, e i termini fuori diagonale che si vorrebbero cancellare sono negli indici $r_1,r_2$. Mediare sulla variabile sbagliata non cancella niente — ed è l&rsquo;errore che il conto esplicito rende visibile e che l&rsquo;argomento verbale nasconde.`}
  ]}
]},

/* ---------------- 09 · MISURE SUCCESSIVE: L ORDINE CONTA ---------------- */
{ num:'09', title:'Misure successive: dove l&rsquo;ordine conta, e di quanto', meta:'probabilita congiunta e condizionata · perche la congiunta esiste solo se gli operatori commutano · le due catene A-poi-B e B-poi-A sullo stesso stato · il filtro intermedio che distrugge la certezza',
  blocchi:[
  {t:'prosa', title:'Due misure invece di una, e la regola di composizione', tag:'costruzione', html:R`
  <p>Tutto il movimento, fin qui, ha considerato un esperimento fatto di una preparazione seguita da <i>una</i> misura. Se invece dopo la preparazione si misurano due o più grandezze in successione, oltre alle distribuzioni delle singole grandezze diventano sensate due nuove quantità: la <b>probabilità congiunta</b> dei due esiti, e la <b>probabilità condizionata</b> del secondo esito dato il primo. Questa tappa le costruisce, scopre che la prima delle due non sempre esiste, e misura su un esempio quanto l&rsquo;ordine delle misure conti.</p>
  <p>Il legame fra congiunta e condizionata non è una novità quantistica: è l&rsquo;assioma della teoria della probabilità che Ballentine numera come quarto, e che scrive $\operatorname{Prob}(A\&B|C)=\operatorname{Prob}(A|C)\operatorname{Prob}(B|A\&C)$. Qui l&rsquo;evento condizionante $C$ è la preparazione, cioè lo stato $\rho$, e $A$, $B$ sono gli esiti delle due misure che la seguono. Il primo fattore è noto dalle tappe precedenti: $\operatorname{Prob}(A|\rho)=\operatorname{Tr}\{\rho\,M_R(\Delta_a)\}$, con $M_R(\Delta_a)$ il <span class="str" data-str="proiettore-ortogonale">proiettore</span> sull&rsquo;insieme di autovalori cercato. È il terzo fattore, la condizionata, a essere nuovo: «<i>un tipo di affermazione probabilistica che non abbiamo considerato prima, poiché la formula probabilistica generale della meccanica quantistica coinvolge soltanto il condizionamento sulla preparazione dello stato</i>».</p>
  <p>Ed è qui che il postulato di proiezione — nella forma delimitata della tappa precedente, cioè per le misure di filtraggio — <i>serve a qualcosa</i> invece di essere soltanto discusso. Se la prima misura è di filtraggio e si trattiene il sotto-ensemble con $R\in\Delta_a$, quel filtraggio prepara un nuovo stato $\rho'=M_R(\Delta_a)\rho M_R(\Delta_a)/\operatorname{Tr}\{M_R(\Delta_a)\rho M_R(\Delta_a)\}$, e la condizionata si calcola con la formula ordinaria applicata a $\rho'$: $\operatorname{Prob}(B|A\&\rho)=\operatorname{Tr}\{\rho'M_S(\Delta_b)\}$. Mettendo i due pezzi nell&rsquo;assioma e usando l&rsquo;invarianza della <span class="str" data-str="traccia">traccia</span> per permutazione ciclica si ottiene la formula della congiunta per due filtraggi successivi,</p>
  $$\operatorname{Prob}(A\&B|\rho)=\operatorname{Tr}\{\rho\,M_R(\Delta_a)M_S(\Delta_b)M_R(\Delta_a)\} ,$$
  <p>e si noti bene come è fatta: il proiettore della <i>prima</i> misura compare due volte, a sinistra e a destra di quello della seconda. L&rsquo;espressione non è simmetrica nei due proiettori, e quella asimmetria è l&rsquo;ordine temporale scritto in algebra.</p>`},
  {t:'reveal', title:'Quando la congiunta esiste: il vincolo del commutare, e perché von Neumann lo isola', tag:'costruzione', steps:[
   {label:'Il caso facile, e la condizione che lo rende facile', body:R`
   <p>C&rsquo;è un caso in cui la congiunta si scrive senza passare per il filtraggio, direttamente dalla formula generale delle probabilità. Perché l&rsquo;evento composto $A\&B$ abbia una probabilità nel senso ordinario, occorre un proiettore che gli corrisponda. Ballentine osserva che questo è possibile se e solo se i due proiettori <b>commutano</b>: in quel caso il prodotto $M_R(\Delta_a)M_S(\Delta_b)$ è esso stesso un proiettore, e proietta sul sottospazio generato dagli autovettori <i>comuni</i> a $R$ e $S$ con autovalori nei due intervalli richiesti. Allora</p>
   $$\operatorname{Prob}\{(R\in\Delta_a)\&(S\in\Delta_b)|\rho\}=\operatorname{Tr}\{\rho\,M_R(\Delta_a)M_S(\Delta_b)\} ,$$
   <p>e questa espressione <i>è</i> simmetrica nei due proiettori — dunque «<i>l&rsquo;ordine dei tempi $t_a$ e $t_b$ ai quali le due misure sono eseguite è irrilevante</i>». Perché il conto sia possibile per intervalli $\Delta_a$, $\Delta_b$ arbitrari, aggiunge Ballentine, occorre e basta che $R$ e $S$ commutino, perché solo allora possiedono un insieme completo di autovettori comuni.</p>
   <p>Il senso di questa condizione è più profondo di un requisito tecnico, e Ballentine lo spiega risolvendo un&rsquo;apparente incongruenza: come può essere che il lato sinistro dell&rsquo;assioma richieda il commutare e il lato destro no? «<i>La risposta a questo enigma è che la derivazione si basava implicitamente sull&rsquo;assunzione che le misure di $R$ e $S$ fossero equivalenti a, o almeno compatibili con, un filtraggio congiunto secondo gli autovalori di entrambe</i>». Un filtraggio congiunto, cioè un unico apparato che separa l&rsquo;ensemble secondo le due grandezze insieme, esiste solo se esiste una base comune — e quella esiste solo se le due grandezze commutano.</p>`},
   {label:'von Neumann lo aveva isolato come una delle due caratteristiche della teoria', body:R`
   <p>Questo vincolo non è un dettaglio del formalismo moderno: von Neumann lo mette, nel 1932, alla pari con il carattere statistico della teoria. Avendo ricavato l&rsquo;enunciato più generale possibile sulle probabilità — quello che dà la probabilità che le grandezze $R_1,\dots,R_\ell$ cadano in altrettanti intervalli — ne isola due caratteristiche notevoli. La prima è che l&rsquo;enunciato è statistico e non causale. La seconda è questa: «<i>il problema di $P$ non può essere risolto per quantità $R_1,\dots,R_\ell$ arbitrarie, ma solo per quelle i cui operatori $\mathbf R_1,\dots,\mathbf R_\ell$ commutino l&rsquo;uno con l&rsquo;altro</i>».</p>
   <p>La ragione che ne dà è di una semplicità disarmante, ed è la stessa che Ballentine riscopre per altra via: nel porre la domanda l&rsquo;ordine in cui si elencano le grandezze è arbitrario, dunque deve essere arbitrario anche nella risposta — e il prodotto di proiettori che la risposta contiene è indipendente dall&rsquo;ordine solo se i fattori commutano. Quando non commutano, <b>la domanda stessa è mal posta</b>: non esiste una probabilità congiunta da calcolare, e non perché sia difficile.</p>
   <p>Attenzione a non trarne la conclusione sbagliata, perché è un errore frequente. Non è vero che di due osservabili che non commutano non si possa dire niente in successione: si può, ed è la probabilità <i>condizionata</i>, che non richiede il commutare. Quello che non esiste è la congiunta <i>simmetrica</i>, cioè una distribuzione per i valori simultanei. In formule: $\operatorname{Prob}(B|A\&\rho)$ ha sempre senso se la prima misura è di filtraggio; $\operatorname{Prob}(A\&B|\rho)$ non è un oggetto indipendente dall&rsquo;ordine. E quando $R$ e $S$ non commutano, dice Ballentine, «<i>è ora essenziale che l&rsquo;ordine temporale $t_a<t_b$ sia rispettato, perché è la misura di $R$ che fa da (parte della) preparazione dello stato per la misura di $S$, e non viceversa</i>».</p>`}
  ]},
  {t:'reveal', title:'Lo stesso stato, le stesse due osservabili, i due ordini: due numeri diversi', tag:'conto', steps:[
   {label:'La seconda osservabile, e la sua diagonalizzazione', body:R`
   <p>L&rsquo;esempio del movimento ha finora usato una sola osservabile. Se ne aggiunge una seconda, presa dal problema 2.8 di Ballentine, che la propone come «operatore matriciale che rappresenta una variabile dinamica»:</p>
   $$B=\begin{pmatrix}0&1&0\\1&0&1\\0&1&0\end{pmatrix} .$$
   <p>Il polinomio caratteristico si calcola sviluppando $\det(B-\lambda\mathbb 1)$ sulla prima riga. Il primo minore è $\det\begin{pmatrix}-\lambda&1\\1&-\lambda\end{pmatrix}=\lambda^2-1$ e il secondo è $\det\begin{pmatrix}1&1\\0&-\lambda\end{pmatrix}=-\lambda$, quindi</p>
   $$\det(B-\lambda\mathbb 1)=-\lambda(\lambda^{2}-1)+\lambda=-\lambda^{3}+2\lambda=-\lambda(\lambda^{2}-2) .$$
   <p>Gli autovalori sono dunque $\sqrt2$, $0$ e $-\sqrt2$, tutti semplici: nessuna degenerazione, e tre autospazi di dimensione uno. Gli autovettori normalizzati si trovano riga per riga e sono</p>
   $$|w_+\rangle=\frac12\begin{pmatrix}1\\ \sqrt2\\ 1\end{pmatrix},\qquad |w_0\rangle=\frac1{\sqrt2}\begin{pmatrix}1\\0\\-1\end{pmatrix},\qquad |w_-\rangle=\frac12\begin{pmatrix}1\\ -\sqrt2\\ 1\end{pmatrix} .$$
   <p>Il controllo che conviene fare subito, prima di qualunque probabilità, è che $A$ e $B$ <i>non</i> commutino — altrimenti l&rsquo;esempio non mostrerebbe nulla. Moltiplicando nei due versi si trova $AB=\begin{pmatrix}0&2&0\\1&1&1\\1&1&1\end{pmatrix}$ e $BA=\begin{pmatrix}0&1&1\\2&1&1\\0&1&1\end{pmatrix}$, che sono diverse: il <span class="str" data-str="commutatore">commutatore</span> $[A,B]$ non è nullo. Quindi, per il paragrafo precedente, la probabilità congiunta simmetrica non esiste e l&rsquo;ordine delle due misure deve contare. Resta da vedere <i>di quanto</i>.</p>`},
   {label:'Primo ordine: prima A, poi B', body:R`
   <p>Si parte da $|\psi\rangle=\tfrac1{\sqrt6}\begin{pmatrix}1\\2\\-1\end{pmatrix}$ e si chiede la probabilità congiunta dell&rsquo;esito $A=2$ al primo tempo e $B=\sqrt2$ al secondo.</p>
   <p>Il primo fattore è già noto: $\operatorname{Prob}(A=2)=\tfrac14$, e lo stato filtrato è la proiezione normalizzata sull&rsquo;autospazio di $A$ relativo a $2$, cioè $|\psi'\rangle=\tfrac1{\sqrt6}\begin{pmatrix}2\\1\\1\end{pmatrix}$.</p>
   <p>Su questo stato si misura $B$. L&rsquo;ampiezza dell&rsquo;esito $\sqrt2$ è $\langle w_+|\psi'\rangle=\dfrac{1\cdot2+\sqrt2\cdot1+1\cdot1}{2\sqrt6}=\dfrac{3+\sqrt2}{2\sqrt6}$, e la sua probabilità è il modulo quadro:</p>
   $$\Big(\frac{3+\sqrt2}{2\sqrt6}\Big)^{2}=\frac{11}{24}+\frac{\sqrt2}{4}\simeq0{,}812 .$$
   <p>Per lo stesso conto, l&rsquo;esito $-\sqrt2$ ha probabilità $\Big(\frac{3-\sqrt2}{2\sqrt6}\Big)^{2}=\frac{11}{24}-\frac{\sqrt2}{4}$, e l&rsquo;esito $0$, la cui ampiezza è $\langle w_0|\psi'\rangle=\frac{2-1}{\sqrt{12}}$, ha probabilità $\tfrac1{12}$. Il controllo di normalizzazione è la somma dei tre, e i due termini irrazionali si cancellano:</p>
   $$\Big(\frac{11}{24}+\frac{\sqrt2}{4}\Big)+\Big(\frac{11}{24}-\frac{\sqrt2}{4}\Big)+\frac1{12}=1 .$$
   <p>La congiunta è il prodotto dei due fattori, per l&rsquo;assioma:</p>
   $$\frac14\cdot\Big(\frac{11}{24}+\frac{\sqrt2}{4}\Big)=\frac{11}{96}+\frac{\sqrt2}{16}\simeq0{,}203 .$$`},
   {label:'Secondo ordine: prima B, poi A', body:R`
   <p>Si rifà tutto scambiando i tempi: prima si misura $B$ e si trattiene l&rsquo;esito $\sqrt2$, poi si misura $A$ e si chiede l&rsquo;esito $2$.</p>
   <p>Il primo fattore ora è la probabilità di $B=\sqrt2$ <i>sullo stato iniziale</i>. L&rsquo;ampiezza è $\langle w_+|\psi\rangle=\dfrac{1\cdot1+\sqrt2\cdot2+1\cdot(-1)}{2\sqrt6}$, dove il primo e il terzo termine si cancellano, e dunque</p>
   $$\Big(\frac{1+2\sqrt2-1}{2\sqrt6}\Big)^{2}=\frac13 .$$
   <p>Lo stato filtrato, essendo l&rsquo;autovalore semplice, è l&rsquo;autovettore stesso: $|w_+\rangle=\tfrac12\begin{pmatrix}1\\ \sqrt2\\ 1\end{pmatrix}$. Si noti che qui il filtraggio ha cancellato <i>tutta</i> l&rsquo;informazione sullo stato di partenza tranne l&rsquo;esito — è la non invertibilità della proiezione, vista all&rsquo;opera.</p>
   <p>Su $|w_+\rangle$ si misura $A$, il cui autovalore $2$ è degenere con autospazio generato da $\begin{pmatrix}1\\0\\0\end{pmatrix}$ e da $\tfrac1{\sqrt2}\begin{pmatrix}0\\1\\1\end{pmatrix}$. Le due ampiezze sono $\tfrac12$ e $\dfrac{\sqrt2+1}{2\sqrt2}$, e poiché l&rsquo;autovalore è degenere le probabilità si <b>sommano</b>:</p>
   $$\Big(\frac{\sqrt2+1}{2\sqrt2}\Big)^{2}=\frac38+\frac{\sqrt2}{4},\qquad \frac14+\frac38+\frac{\sqrt2}{4}=\frac58+\frac{\sqrt2}{4}\simeq0{,}979 .$$
   <p>E la congiunta in questo ordine è</p>
   $$\frac13\cdot\Big(\frac58+\frac{\sqrt2}{4}\Big)=\frac{5}{24}+\frac{\sqrt2}{12}\simeq0{,}326 .$$`},
   {label:'Il confronto, e che cosa significa la disuguaglianza', body:R`
   <p>I due numeri sono</p>
   $$\frac{11}{96}+\frac{\sqrt2}{16}<\frac{5}{24}+\frac{\sqrt2}{12}$$
   <p>cioè circa $0{,}203$ contro $0{,}326$: la seconda catena è più probabile della prima di oltre il sessanta per cento in più. <b>Stesso stato iniziale, stesse due osservabili, stessa coppia di esiti richiesti, e due numeri diversi.</b> Non c&rsquo;è nessun paradosso e nessun errore: la quantità che si è calcolata non è «la probabilità che $A$ valga $2$ e $B$ valga $\sqrt2$» — quella non esiste, perché $[A,B]\neq0$ — ma la probabilità di una <i>sequenza di eventi sperimentali in un ordine dato</i>, e due sequenze diverse sono due esperimenti diversi.</p>
   <p>Vale la pena capire da dove viene la differenza, perché il meccanismo è lo stesso in tutti i problemi di questo tipo. Nel primo ordine la misura di $A$ costa caro: l&rsquo;esito $2$ ha probabilità soltanto $\tfrac14$, perché lo stato iniziale è in gran parte nell&rsquo;autospazio dell&rsquo;esito $0$. Ma ciò che resta dopo il filtro è uno stato molto ben allineato con $|w_+\rangle$, e il secondo fattore è grande, $0{,}812$. Nel secondo ordine succede il contrario: la misura di $B$ costa $\tfrac13$, un po&rsquo; più della precedente, ma lo stato che produce è quasi dentro l&rsquo;autospazio di $A=2$, con probabilità $0{,}979$. Il prodotto dei due fattori sbilanciati è minore del prodotto dei due fattori più equilibrati: <b>la prima misura non riduce soltanto la probabilità, riallinea lo stato</b>, e il bilancio dipende da quale riallineamento conviene di più.</p>
   <p>Un&rsquo;ultima osservazione, che è il controllo di sanità da fare sempre su un conto di questo tipo. Se $A$ e $B$ commutassero, i due numeri sarebbero uguali per il teorema citato sopra — e l&rsquo;uguaglianza è dunque un test del commutare, utilizzabile a conto finito. Trovare due numeri diversi non dimostra nulla di nuovo, ma trovarli <i>uguali</i> quando si crede che le osservabili non commutino è il segnale che c&rsquo;è un errore nel conto.</p>`}
  ]},
  {t:'plot', title:'Il filtro intermedio che distrugge la certezza',
   intro:R`L&rsquo;effetto dell&rsquo;ordine si vede nella sua forma più pura in un dispositivo che Ballentine usa per illustrare le probabilità congiunte: tre filtraggi successivi su uno spin $\tfrac12$, con sette apparati di Stern e Gerlach in cascata. Qui si prende la variante più nuda — si misura $\sigma_z$ e si trattiene l&rsquo;esito $+1$; si misura poi $\sigma_u$ lungo una direzione del piano $zx$ a un angolo $\vartheta$ da $z$, trattenendo <i>entrambi</i> gli esiti; si misura infine di nuovo $\sigma_z$. Senza il filtro intermedio, la terza misura darebbe $+1$ con certezza, perché una misura ripetuta riproduce il suo esito. Con il filtro intermedio, la probabilità diventa $\cos^4(\vartheta/2)+\sin^4(\vartheta/2)=1-\tfrac12\sin^{2}\vartheta$, ed è ciò che la curva disegna.`,
   plots:[
    {kind:'func2d', xr:[0,3.1416], yr:[-0.1,1.2], height:330, ticks:7,
     title:'probabilita di ritrovare sigma z = +1 dopo un filtro intermedio a angolo theta',
     curves:[
      {f:'1', col:'#8a93a6', width:1.6, label:'senza filtro intermedio: certezza'},
      {f:'1-0.5*sin(x)^2', col:'#4c8dff', width:2.8, label:'con filtro intermedio'},
      {f:'0.5', col:'#e0565b', width:1.6, label:'caso incoerente: meta e meta'}
     ],
     xlabel:'theta (angolo del filtro intermedio rispetto a z)', ylabel:'probabilita'}
   ],
   leggi:R`<p><b>Che cosa guardare.</b> La curva parte da $1$ e vi ritorna: per $\vartheta=0$ il filtro intermedio misura la stessa osservabile della prima, non disturba niente e la certezza resta; per $\vartheta=\pi$ misura $-\sigma_z$, che ha gli stessi autospazi, e di nuovo non disturba. Il minimo è a $\vartheta=\pi/2$, dove il filtro intermedio misura $\sigma_x$ — l&rsquo;osservabile che con $\sigma_z$ commuta meno di ogni altra — e la probabilità crolla a $\tfrac12$, cioè al puro caso. <b>Che cosa impararne.</b> Che una misura intermedia di cui non si usa il risultato <i>non è un&rsquo;operazione neutra</i>: cancella l&rsquo;informazione della prima nella misura in cui la sua osservabile non commuta con quella. È la stessa cosa che il conto a tre livelli ha mostrato in due numeri, qui resa funzione di un angolo che in laboratorio si gira con una vite. Si noti anche che la curva non scende mai sotto $\tfrac12$: più del caso non si può distruggere, perché il filtro intermedio divide in due rami che restituiscono entrambi qualcosa.</p>`},
  {t:'prosa', title:'Il filo del movimento, ricomposto', tag:'architettura', html:R`
  <p>Il movimento è partito dalla domanda più povera possibile — quanto vale in media — e ha scoperto, con von Neumann, che quella sola domanda porta con sé tutta la statistica: la distribuzione di probabilità, il fatto che fuori dallo spettro non ci sia probabilità, e il vincolo che la domanda sia ben posta soltanto per osservabili che commutano. Da lì ha costruito la probabilità di transizione e l&rsquo;ha collaudata sulla legge di Malus, ha fissato la procedura operativa — sviluppa, proietta, somma i moduli quadri — e l&rsquo;ha portata attraverso i tre casi che gli esami chiedono: il caso non degenere, il caso degenere con il postulato di von Neumann nella sua forma geometrica, e lo spettro continuo dove la probabilità diventa densità. Poi ha estratto dalla distribuzione i due numeri che la riassumono, media e indeterminazione, e ha mostrato che si calcolano senza mai diagonalizzare.</p>
  <p>La seconda metà ha cambiato tipo di domanda. Ha guardato il postulato di proiezione da fuori e ha dimostrato, in tre modi indipendenti, che non è deducibile dall&rsquo;evoluzione unitaria: la norma non si conserva, il determinante di un proiettore è zero mentre quello di un unitario ha modulo uno, e la mappa non è invertibile. Ha riportato la critica di Ballentine, che non nega la formula ma la delimita alle misure di filtraggio, e ha mostrato sull&rsquo;esperimento di ricombinazione di spin dove la questione è stata effettivamente misurata — e che la risposta sperimentale, la coerenza che sopravvive, sta dalla parte di chi dice che non c&rsquo;è nessuna riduzione fisica. Infine ha composto due misure, e ha trovato che la domanda «entrambi gli esiti» non ha risposta indipendente dall&rsquo;ordine quando le osservabili non commutano, con la differenza fra i due ordini misurata in due numeri.</p>
  <p>Ciò che resta in mano, e che è il bagaglio con cui si affrontano i problemi, sono tre cose e nessuna di più. <b>Una procedura</b>: sviluppare lo stato nella base degli autovettori, prendere i moduli quadri, sommarli dentro ciascun autospazio degenere, normalizzare se lo stato non lo era. <b>Due numeri a sconto</b>: $\langle R\rangle=\langle\psi|R|\psi\rangle$ e $(\Delta R)^2=\langle R^2\rangle-\langle R\rangle^2$, che non richiedono lo spettro e servono da controllo indipendente quando lo spettro c&rsquo;è. <b>Una cautela</b>: l&rsquo;ordine delle misure è parte dei dati del problema, e un enunciato che chieda la probabilità di due esiti senza dire in quale ordine sono stati misurati, se le osservabili non commutano, è un enunciato incompleto — e vale la pena dirlo nello svolgimento, perché è il genere di osservazione che distingue chi ha capito la struttura da chi ha imparato la ricetta.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Se la probabilità congiunta non esiste per osservabili che non commutano, che cosa si è calcolato nelle due catene?`,
    a:R`Si è calcolata la probabilità di una <b>sequenza sperimentale</b>, cioè di un esito al tempo $t_a$ seguito da un esito al tempo $t_b$, con la prima misura che fa da preparazione per la seconda. È una quantità perfettamente definita e misurabile: si costruisce l&rsquo;apparato, si contano i neutroni che escono dal secondo filtro, e si divide. Quello che non esiste è l&rsquo;oggetto diverso che si chiama con lo stesso nome nel caso classico — una distribuzione per i <i>valori simultanei</i> delle due grandezze, da cui le due marginali si otterrebbero sommando. Ballentine lo sottolinea esplicitamente parlando dei suoi tre filtraggi in cascata: quella è «la probabilità congiunta per i risultati di tre misure effettive, e non una distribuzione congiunta per ipotetici valori simultanei di tre osservabili che non commutano».`},
   {q:R`Nel secondo ordine, lo stato dopo il filtro su $B=\sqrt2$ è l&rsquo;autovettore $|w_+\rangle$ e non dipende più da $|\psi\rangle$. Non si è perso qualcosa che serviva?`,
    a:R`Sì, e si è perso per sempre: è la non invertibilità della proiezione, che la tappa 07 ha usato come terzo argomento contro la deducibilità del collasso. Qui se ne vede la conseguenza pratica. Quando l&rsquo;autovalore trovato è <b>semplice</b>, lo stato dopo la misura è determinato dall&rsquo;esito e dallo spettro, e lo stato di partenza entra <i>soltanto</i> nel fattore di probabilità. Quando invece l&rsquo;autovalore è degenere — come $A=2$ nel primo ordine — lo stato di partenza sopravvive in parte, perché la proiezione lo trattiene <i>dentro</i> l&rsquo;autospazio e il vettore risultante dipende da quale direzione dell&rsquo;autospazio aveva. È la ragione tecnica per cui nel primo ordine il secondo fattore vale $0{,}812$ e non un numero fissato dallo spettro: quel numero ricorda $|\psi\rangle$.`},
   {q:R`Il filtro intermedio del disegno non viene letto. Come può influire, se nessuno ne usa il risultato?`,
    a:R`Perché influisce l&rsquo;<i>apparato</i>, non la lettura. Nella variante disegnata i due rami del filtro intermedio sono separati e non vengono ricombinati, dunque le loro ampiezze non interferiscono più: il fascio che arriva al terzo apparato è una miscela dei due sotto-fasci, non la loro sovrapposizione, e la probabilità finale è la somma pesata dei due contributi — che è esattamente il conto $\cos^4(\vartheta/2)+\sin^4(\vartheta/2)$. Se invece i due rami venissero <b>ricombinati coerentemente</b>, come nell&rsquo;interferometro a neutroni della tappa 08, le ampiezze si sommerebbero prima del modulo quadro, l&rsquo;interferenza ripristinerebbe lo stato iniziale e la certezza tornerebbe a $1$ per ogni $\vartheta$. La differenza fra i due casi non è chi guarda: è se l&rsquo;informazione su quale ramo è stato percorso resta nell&rsquo;ambiente oppure no — ed è il coefficiente $s$ della tappa precedente a misurarla.`}
  ]}
]}

];

/* --- blocco PLOT: la figura non decora, si legge. Ogni plot porta una chiave di lettura. --- */
function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';
  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionSvelabile(title, tag, html, sol){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var c=document.createElement('div'); c.className='collaudo-item';
  var q=document.createElement('div'); q.className='cq'; q.innerHTML=html||'';
  c.appendChild(q); typeset(q);
  if(sol){
    var a=document.createElement('div'); a.className='ca'; a.style.display='none';
    a.innerHTML='<b>Soluzione.</b> '+sol;
    var btn=document.createElement('button'); btn.className='reveal-btn small';
    btn.textContent='Rivela la soluzione';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a);
      btn.disabled=true; btn.classList.add('done'); btn.textContent='Soluzione rivelata'; };
    c.appendChild(btn); c.appendChild(a);
  }
  wrap.appendChild(c); return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    /* DUE SCHEMI, NON UNO — scoperto il 2026-10-06 provando le pagine vive. I movimenti
       scritti per primi (em-01..03, me-10b, i collaudi di gd-01..09 e di quattro em)
       usano una forma piu' semplice: `reveal` e `prolessi` con un solo `html`,
       `esercizio` e `collaudo` con `html` + `sol`. Il renderer ne conosceva una sola e
       chiamava `steps.forEach` su `undefined`: TypeError, e la tappa si fermava li' —
       62 blocchi in 17 movimenti su 74. Non si riscrive il contenuto per far contento
       il renderer: e' il renderer che deve leggere cio' che c'e'.
       E in fondo un ramo che NON muore: uno schema nuovo di domani deve far vedere un
       avviso in quella sezione, non spegnere la pagina sotto di se'. */
    try{
      if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
      else if(b.t==='prolessi') m.appendChild(b.rotte ? sectionProlessi(b)
                                   : sectionProsa(b.title,'prolessi',b.html));
      else if(b.t==='reveal')m.appendChild(b.steps ? sectionReveal(b.title,b.tag,b.steps)
                                   : sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='esercizio') m.appendChild(b.steps ? sectionEsercizio(b)
                                   : sectionSvelabile(b.title,'esercizio',b.html,b.sol));
      else if(b.t==='collaudo')  m.appendChild(b.items ? sectionCollaudo(b.title,b.items)
                                   : sectionSvelabile(b.title,'provi, poi riveli',b.html,b.sol));
      else if(b.t==='plot')      m.appendChild(sectionPlot(b));
      else m.appendChild(sectionProsa(b.title||'(blocco)', 'tipo sconosciuto: '+b.t,
                                      b.html||''));
    }catch(err){
      var avv=document.createElement('section'); avv.className='section';
      avv.innerHTML='<h3>'+(b.title||'(blocco)')+'<span class="tag">non reso</span></h3>'
        +'<p style="color:#ff6b6b">Questo blocco non si &egrave; potuto rendere ('
        +b.t+': '+err.message+'). Il resto della tappa continua sotto.</p>';
      m.appendChild(avv);
    }
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* I POP-UP DEGLI STRUMENTI. `cablaStrumenti` esisteva dal 18-09 e non la chiamava
     nessuno: i 229 rimandi del percorso erano <span> senza handler, e il clic non
     faceva niente. Nessun controllo poteva vederlo — la sintassi era valida, le schede
     c'erano tutte, le formule rendevano: il guasto esisteva solo a pagina viva. Qui, e
     dopo ogni inserimento successivo, perche' la tappa si rimonta da capo a ogni
     cambio e gli handler vanno riattaccati al DOM nuovo. */
  cablaStrumenti(m);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}

/* deep-link: mq-04-la-misura.html#03 apre direttamente la tappa 03 */
window.addEventListener('DOMContentLoaded', function(){
  var h=(location.hash||'').replace('#','');
  showTappa(byId[h]?h:'00');
});
window.addEventListener('hashchange', function(){
  var h=(location.hash||'').replace('#','');
  if(byId[h]) showTappa(h);
});
</script>
