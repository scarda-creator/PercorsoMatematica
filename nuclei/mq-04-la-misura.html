   <p style="padding-left:1.2em;border-left:3px solid rgba(120,160,255,.45)"><i>&laquo;Postulato di von Neumann: se una misura di $\xi$ su $|A\rangle$ dà come risultato l&rsquo;autovalore (degenere) $\xi_i$, lo stato dopo la misura è rappresentato dal (raggio cui appartiene il) vettore $|\xi_i\rangle$ che si ottiene <b>proiettando ortogonalmente</b> $|A\rangle$ sull&rsquo;autospazio di $\xi$ corrispondente all&rsquo;autovalore $\xi_i$.&raquo;</i> &mdash; Picasso, par. 4.4, pag. stampata 65</p>
   <p>In notazione operatoriale: con <span class="str" data-str="proiettore-ortogonale">$P(a)$</span> il proiettore ortogonale sull&rsquo;autospazio di $a$, lo stato dopo la misura è $P(a)|A\rangle$, da rinormalizzare. E la probabilità segue da sola, perché la probabilità di transizione fra $|A\rangle$ e quel vettore è calcolabile:</p>
   $$p_i=\frac{|\langle A|\xi_i\rangle|^{2}}{\langle\xi_i|\xi_i\rangle}=|a_i^{(1)}|^{2}+|a_i^{(2)}|^{2}+\cdots$$
   <p>— la <b>somma</b> delle probabilità di transizione ai vettori di un qualunque insieme ortonormale completo nell&rsquo;autospazio. Che è esattamente la formula di Ballentine $\operatorname{Prob}(R=r|\rho)=\operatorname{Tr}\{\rho P(r)\}$ della tappa 01, scritta in componenti.</p>`},
   {label:'Le due riletture, e la seconda è quella da ricordare', body:R`
   <p>Picasso dà due riformulazioni equivalenti del postulato, e sono il motivo per cui questa forma del collasso è la più soddisfacente che esista.</p>
   <p><b>Prima</b>: il sistema effettua la transizione a quello, fra gli autostati corrispondenti a $\xi_i$, «<i>per il quale la probabilità di transizione è massima</i>». Cioè: fra tutti i modi in cui il collasso <i>potrebbe</i> avvenire, avviene nel più probabile.</p>
   <p><b>Seconda</b>, ed è la stessa cosa detta meglio: «<i>la misura ha perturbato il sistema il meno possibile</i>». La ragione è puramente geometrica, e Picasso la scrive: «<i>la proiezione ortogonale è, nella varietà degli autovettori corrispondenti all&rsquo;autovalore trovato, il vettore &lsquo;più vicino&rsquo; al vettore $|A\rangle$ di partenza</i>». La proiezione ortogonale è la soluzione di un problema di <i>minimo</i> — minimizzare $\|{\,}|A\rangle-|w\rangle\|$ su tutti i $|w\rangle$ dell&rsquo;autospazio — e il collasso è quindi la minima violenza compatibile con l&rsquo;informazione acquisita.</p>
   <p>Una conseguenza che Picasso chiama «ovvia» e che vale invece sottolineare: se lo stato di partenza $|A\rangle$ è già un autostato di $\xi_i$, la proiezione coincide con $|A\rangle$ e <b>lo stato non viene perturbato dalla misura</b>. In particolare, anche se due autostati $|\xi_i'\rangle$ e $|\xi_i''\rangle$ dello <i>stesso</i> autovalore non sono ortogonali, una misura di $\xi$ non potrà mai indurre la transizione dall&rsquo;uno all&rsquo;altro: per quella serve misurare un&rsquo;<i>altra</i> osservabile, di cui il primo non sia autostato e il secondo sì. La misura di $\xi$ non vede nulla dentro il suo autospazio, e questo è il senso preciso in cui la degenerazione è informazione non raccolta.</p>`}
  ]},
  {t:'reveal', title:'Il conto esplicito sul sistema a tre livelli', tag:'esempio', steps:[
   {label:'I due proiettori, e la risoluzione dell’identità', body:R`
   <p>Si riprende l&rsquo;operatore della tappa 03, con l&rsquo;autovalore $2$ doppio e lo stato $|\psi\rangle=\frac1{\sqrt6}(1,2,-1)^{T}$. I due proiettori spettrali si costruiscono sommando i prodotti esterni degli autovettori di ciascun autospazio. Per $a=2$, da $|e_1\rangle$ e $|u\rangle$:</p>
   $$P(2)=|e_1\rangle\langle e_1|+|u\rangle\langle u|=\begin{pmatrix}1&0&0\\0&\tfrac12&\tfrac12\\0&\tfrac12&\tfrac12\end{pmatrix}$$
   <p>e per $a=0$, dal solo $|v\rangle$:</p>
   $$P(0)=|v\rangle\langle v|=\begin{pmatrix}0&0&0\\0&\tfrac12&-\tfrac12\\0&-\tfrac12&\tfrac12\end{pmatrix}$$
   <p>Due controlli immediati. Il primo: $P(2)+P(0)=\mathbb 1$, cioè i due proiettori esauriscono lo spazio — è la risoluzione dell&rsquo;identità, ed è ciò che garantisce che le due probabilità sommino a uno. Il secondo: l&rsquo;idempotenza, $P(2)^2=P(2)$, che per l&rsquo;elemento di posizione $(2,2)$ si verifica in un rigo: $\tfrac12\cdot\tfrac12+\tfrac12\cdot\tfrac12=\tfrac12$, che è il valore di partenza.</p>`},
   {label:'La probabilità via proiettore, e lo stato dopo la misura', body:R`
   <p>La probabilità di trovare $a=2$ si calcola ora senza passare per i singoli autovettori, applicando il proiettore allo stato. Si ottiene</p>
   $$P(2)|\psi\rangle=\frac{1}{\sqrt6}\begin{pmatrix}1\\ \tfrac12\\ \tfrac12\end{pmatrix}$$
   <p>— la prima componente passa intatta, le altre due vengono rimpiazzate ciascuna dalla loro media $\frac{2+(-1)}{2}=\tfrac12$. La norma quadra di questo vettore è la probabilità:</p>
   $$\big\|P(2)|\psi\rangle\big\|^{2}=\frac16+\frac1{24}+\frac1{24}=\frac14$$
   <p>che coincide con il $\tfrac14$ trovato nella tappa 03 sommando i due contributi. Le due strade danno lo stesso numero, e la seconda è più robusta perché non richiede di scegliere una base dentro l&rsquo;autospazio.</p>
   <p>Lo stato <b>dopo</b> la misura è la proiezione rinormalizzata, cioè divisa per $\sqrt{1/4}=\tfrac12$:</p>
   $$|\psi'\rangle=\frac{P(2)|\psi\rangle}{\big\|P(2)|\psi\rangle\big\|}=\frac{1}{\sqrt6}\begin{pmatrix}2\\1\\1\end{pmatrix}$$
   <p>e si verifica che è normalizzato: $\frac{4+1+1}{6}=1$. Questo è il risultato concreto che il postulato di von Neumann permette e che il postulato di Picasso da solo non permetteva: non «un qualche autostato di autovalore $2$», ma <b>quel</b> vettore, scritto in componenti.</p>`},
   {label:'Shankar: la differenza fra stato iniziale noto e ignoto', body:R`
   <p>Shankar isola un punto che vale evidenziare, perché è il tipo di cosa che un esame chiede sotto forma di domanda insidiosa. «<i>Se lo stato iniziale $|\psi\rangle$ fosse ignoto, e la misura avesse dato un autovalore degenere $\omega$, non potremmo dire quale fosse lo stato dopo la misura, se non che era uno stato nell&rsquo;autospazio con autovalore $\omega$. Se invece lo stato iniziale $|\psi\rangle$ fosse noto, e la misura avesse dato un valore degenere $\omega$, lo stato dopo la misura è noto ed è $P_\omega|\psi\rangle$</i>» (pag. stampata 124).</p>
   <p>E il commento che chiude il punto: «<i>si noti che, anche se non sappiamo quanto valgano $\alpha$ e $\beta$ dalla misura, essi non sono arbitrari. In altre parole, il sistema aveva un vettore di stato ben definito $|\psi\rangle$ prima della misura, anche se non lo conoscevamo, e ha un vettore di stato ben definito $P_\omega|\psi\rangle$ dopo la misura, anche se tutto ciò che sappiamo è che sta in un sottospazio</i>». La degenerazione limita <i>la nostra conoscenza</i> dello stato finale, non la sua determinatezza — e la differenza fra queste due frasi è l&rsquo;intero contenuto della tappa 08.</p>`}
  ]},
  {t:'reveal', title:'L’indipendenza dalla base, verificata e non assunta', tag:'costruzione', steps:[
   {label:'Il conto generale', body:R`
   <p>Resta da chiudere la questione sollevata sopra: la probabilità dell&rsquo;autovalore degenere dipende dalla base scelta nell&rsquo;autospazio? Si prenda una base ortonormale $\{|w_1\rangle,|w_2\rangle\}$ ottenuta ruotando $\{|e_1\rangle,|u\rangle\}$ di un angolo $\alpha$:</p>
   $$|w_1\rangle=\cos\alpha\,|e_1\rangle+\sin\alpha\,|u\rangle,\qquad |w_2\rangle=-\sin\alpha\,|e_1\rangle+\cos\alpha\,|u\rangle$$
   <p>Posto $c_1=\langle e_1|\psi\rangle$ e $c_2=\langle u|\psi\rangle$ (reali in questo esempio), i nuovi coefficienti sono $c_1\cos\alpha+c_2\sin\alpha$ e $-c_1\sin\alpha+c_2\cos\alpha$, e la somma dei loro moduli quadri è</p>
   $$(c_1\cos\alpha+c_2\sin\alpha)^{2}+(-c_1\sin\alpha+c_2\cos\alpha)^{2}=c_1^{2}+c_2^{2}$$
   <p>— un&rsquo;identità, valida per <i>ogni</i> $\alpha$: i termini misti $2c_1c_2\cos\alpha\sin\alpha$ si cancellano fra i due quadrati, e i termini diagonali si ricompongono con $\cos^2\alpha+\sin^2\alpha=1$. La probabilità dell&rsquo;autovalore non dipende dalla base. È lo stesso fatto che in geometria si enuncia dicendo che la norma di una proiezione non dipende dalle coordinate del sottospazio su cui si proietta, ed è la ragione per cui il <i>proiettore</i>, e non la base, è l&rsquo;oggetto fisicamente significativo.</p>`},
   {label:'Il caso numerico, perché un’identità che non si prova sembra ovvia', body:R`
   <p>Un&rsquo;identità simbolica convince la macchina; per convincere il lettore vale provarla su un caso. Si ruoti di $\alpha=45^\circ$, cioè si prenda $|w_1\rangle=\frac{|e_1\rangle+|u\rangle}{\sqrt2}$ e $|w_2\rangle=\frac{-|e_1\rangle+|u\rangle}{\sqrt2}$, con $c_1=\frac1{\sqrt6}$ e $c_2=\frac1{2\sqrt3}$ (cioè $\frac1{\sqrt{12}}$, riscritto). I due nuovi coefficienti sono molto diversi dai vecchi — il secondo è quasi nullo, perché la rotazione ha allineato $|w_1\rangle$ quasi con la proiezione dello stato. Eppure:</p>
   $$\Big(\frac{\frac1{\sqrt6}+\frac1{2\sqrt3}}{\sqrt2}\Big)^{2}+\Big(\frac{-\frac1{\sqrt6}+\frac1{2\sqrt3}}{\sqrt2}\Big)^{2}=\frac14$$
   <p>esattamente il valore trovato con la base originale e col proiettore. Si noti come i <i>singoli</i> termini siano cambiati (uno è salito a circa $0{,}243$, l&rsquo;altro è scceso a circa $0{,}007$) mentre la somma non si è mossa di un&rsquo;unità sulla quarta cifra. È la firma di una quantità invariante: le parti si redistribuiscono, il totale no.</p>`}
  ]},
  {t:'plot', title:'La proiezione è il vettore più vicino: il collasso come problema di minimo',
   intro:R`La formulazione geometrica del postulato di von Neumann — «lo stato dopo la misura è la proiezione ortogonale, cioè il vettore dell&rsquo;autospazio più vicino a quello di partenza» — si vede in due dimensioni e si capisce per sempre. L&rsquo;autospazio è qui la retta orizzontale; lo stato di partenza è il vettore obliquo. La figura disegna, per ogni punto candidato della retta, la <i>distanza</i> da quel vettore: la curva ha un minimo, e il minimo è esattamente dove cade la perpendicolare.`,
   plots:[
    {kind:'func2d', xr:[-1.2,3.2], yr:[-0.3,2.6], height:340, ticks:6,
     title:'distanza dal vettore di stato, al variare del candidato nell’autospazio',
     curves:[
      {f:'sqrt((x-1.4)*(x-1.4)+0.9*0.9)', col:'#4c8dff', width:2.6, label:'‖ψ − w(x)‖, con w(x) nell’autospazio'},
      {f:'0.9', col:'#ff8a5c', width:1.8, label:'distanza minima = componente ortogonale'},
      {f:'(abs(x-1.4)<0.012?2.6:0)', col:'#9ad67a', width:1.6, label:'x = proiezione ortogonale'}
     ],
     xlabel:'posizione del candidato nell’autospazio', ylabel:'distanza da |ψ⟩'}
   ],
   leggi:R`<p><b>Che cosa guardare.</b> La curva blu è una parabola sotto radice — la distanza fra il vettore di stato e un candidato che si muove lungo l&rsquo;autospazio. Non arriva mai a zero, e questo è il primo fatto: <i>nessun</i> vettore dell&rsquo;autospazio coincide con $|\psi\rangle$, perché $|\psi\rangle$ ha una componente fuori. Il minimo c&rsquo;è, vale esattamente la lunghezza della componente ortogonale (la retta arancione), e cade nel punto marcato in verde. <b>Che cosa impararne.</b> Che il postulato di von Neumann non aggiunge una regola arbitraria: fra tutti i modi in cui il sistema potrebbe finire nell&rsquo;autospazio, sceglie quello che minimizza la distanza, e la soluzione di quel problema di minimo è <i>unica</i> ed è la proiezione ortogonale. Da qui anche la lettura in termini di probabilità: la probabilità di transizione $|\langle w|\psi\rangle|^2$ è massima dove la distanza è minima, perché le due quantità sono legate da $\|{|\psi\rangle-|w\rangle}\|^2=2-2\operatorname{Re}\langle w|\psi\rangle$ per vettori normalizzati. Minima perturbazione e massima probabilità di transizione sono <i>la stessa condizione</i>, e la figura mostra perché: la curva ha un solo minimo. Se lo stato di partenza stesse già sulla retta, la curva toccherebbe zero e il minimo sarebbe il punto stesso — il caso in cui la misura non perturba.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Nell&rsquo;esempio, dopo aver misurato $a=2$ lo stato è $\frac1{\sqrt6}(2,1,1)^{T}$. Una seconda misura di $\hat A$, subito dopo, che probabilità ha di dare ancora $2$?`,
    a:R`Uno, certezza. Si verifica applicando di nuovo il proiettore: $P(2)$ lascia la prima componente intatta e sostituisce le altre due con la loro media, che vale $\frac{1+1}{2}=1$ — cioè le lascia come sono. Quindi $P(2)|\psi'\rangle=|\psi'\rangle$ e la probabilità è $\frac{4+1+1}{6}=1$. È il contenuto della <b>ripetibilità</b>, che Picasso usa per garantire che a ogni autovalore corrisponda almeno un autostato: «<i>se quindi subito dopo la prima misura di $\xi$ ne effettuiamo una seconda, si riottiene certamente lo stesso risultato</i>». Notare che la verifica non è un&rsquo;ipotesi aggiuntiva: segue dall&rsquo;idempotenza $P(2)^2=P(2)$. Proiettare due volte sullo stesso sottospazio è proiettare una volta, e questo è <i>esattamente</i> il contenuto algebrico della frase «una misura ripetuta dà lo stesso esito».`},
   {q:R`Se la probabilità di un autovalore degenere è la somma dei moduli quadri su una base dell&rsquo;autospazio, che cosa succede se si usa una base <i>non</i> ortonormale?`,
    a:R`Viene un numero sbagliato, e la ragione è istruttiva. La formula $p=\sum_i|\langle w_i|\psi\rangle|^2$ è la norma quadra della proiezione <i>scritta in coordinate ortonormali</i>: è il teorema di Pitagora generalizzato, e Pitagora richiede assi perpendicolari. Con una base obliqua i contributi si contano in parte due volte, e la somma eccede la norma vera. Il modo per non sbagliare è non usare quella formula ma la forma invariante $p=\langle\psi|P(a)|\psi\rangle$, che non menziona alcuna base: il proiettore si costruisce una volta e il conto non dipende da come lo si è ottenuto. Picasso stesso dice che da un insieme completo di autovettori «<i>è sempre possibile, mediante un procedimento di ortonormalizzazione, estrarre un insieme completo ortonormale</i>» — cioè la base obliqua non è un ostacolo, è un passo di lavoro in più da fare <i>prima</i> di applicare la formula.`}
  ]}
]},

/* ---------------- 05 · LO SPETTRO CONTINUO: DENSITA' INVECE DI PROBABILITA' ---------------- */
{ num:'05', title:'Lo spettro continuo: densità invece di probabilità', meta:'perche un singolo valore ha probabilita zero · la densita come |psi(x)|^2 · la gaussiana svolta in posizione e in impulso · gli stati impropri e il loro statuto',
  blocchi:[
  {t:'prosa', title:'La domanda che non si può più fare', tag:'costruzione', html:R`
  <p>Tutto il movimento, fin qui, ha trattato spettri discreti: una lista di autovalori, una probabilità per ciascuno, una somma che fa uno. Quando lo spettro è <b>continuo</b> — ed è il caso della posizione e dell&rsquo;impulso, cioè del caso più comune che esista — la stessa impostazione crolla per una ragione aritmetica semplice e inaggirabile, che Shankar enuncia senza ammorbidirla.</p>
  <p>Si sviluppi lo stato nella base degli autovettori di un&rsquo;osservabile $\Omega$ a spettro continuo: i coefficienti diventano una funzione $\psi(\omega)=\langle\omega|\psi\rangle$ dell&rsquo;etichetta continua, che Shankar chiama «la funzione d&rsquo;onda nello spazio $\omega$». Si può interpretare $|\langle\omega|\psi\rangle|^2$ come la probabilità di trovare la particella con $\Omega=\omega$? «<b>No.</b> <i>Poiché il numero di valori possibili per $\omega$ è infinito e la probabilità totale è uno, a ciascun singolo valore di $\omega$ può essere assegnata solo una probabilità infinitesima</i>» (pag. stampata 121).</p>
  <p>La correzione è cambiare il tipo di oggetto. $P(\omega)=|\langle\omega|\psi\rangle|^2$ è una <b>densità di probabilità</b>: non un numero fra zero e uno, ma una quantità che va <i>integrata</i> su un intervallo per diventare una probabilità. $P(\omega)\,d\omega$ è la probabilità di ottenere un risultato fra $\omega$ e $\omega+d\omega$, e la normalizzazione diventa $\int P(\omega)\,d\omega=1$ invece di $\sum_i p_i=1$. La differenza non è formale: una densità ha <i>dimensioni</i> — se $\omega$ è una lunghezza, $P$ si misura in inverso di una lunghezza — e un esercizio in cui una probabilità risulta dimensionata è un esercizio in cui si è dimenticato un $dx$.</p>`},
  {t:'reveal', title:'La stessa deduzione della tappa 01, nel caso continuo', tag:'costruzione', steps:[
   {label:'Il conto di Ballentine', body:R`
   <p>Ballentine rifà, per lo spettro continuo, il conto con la funzione a gradino che nella tappa 01 aveva dato la somma di delta. Sia $Q$ autoaggiunto a spettro puramente continuo, $Q=\int q'|q'\rangle\langle q'|\,dq'$, con autovettori di lunghezza infinita normalizzati alla <span class="str" data-str="delta-di-dirac">delta di Dirac</span>, $\langle q'|q''\rangle=\delta(q'-q'')$. Allora, con $F(Q)=\theta(q-Q)$:</p>
   $$\langle\theta(q-Q)\rangle=\operatorname{Tr}\Big\{\rho\int_{-\infty}^{+\infty}\theta(q-q')|q'\rangle\langle q'|\,dq'\Big\}=\int_{-\infty}^{q}\langle q'|\rho|q'\rangle\,dq'$$
   <p>e derivando rispetto a $q$ si ottiene la densità:</p>
   $$g(q)=\langle q|\rho|q\rangle$$
   <p>che per uno stato puro $\rho=|\Psi\rangle\langle\Psi|$ diventa $g(q)=|\langle q|\Psi\rangle|^2$. Per l&rsquo;operatore posizione, $\langle x|\Psi\rangle=\Psi(x)$ è la funzione d&rsquo;onda e la densità è $|\Psi(x)|^2$ — l&rsquo;interpretazione di Born, che qui non è un postulato ma la specializzazione di una formula generale a una particolare osservabile.</p>`},
   {label:'I due fattori, e perché non sono della stessa specie', body:R`
   <p>Ballentine fa, a questo punto, un&rsquo;osservazione che vale l&rsquo;intero paragrafo e che quasi nessun altro libro fa. Tutte le formule di probabilità viste — $\operatorname{Tr}\{\rho P(r)\}$, $|\langle r_n|\Psi\rangle|^2$, $|\langle q|\Psi\rangle|^2$ — hanno la stessa struttura: il prodotto di <i>due</i> fattori, uno che caratterizza lo stato e uno che caratterizza una porzione dello spettro dell&rsquo;osservabile. Lui li chiama <b>funzione di stato</b> e <b>funzione filtro</b>.</p>
   <p>E avverte: «<i>l&rsquo;apparenza simmetrica dei due fattori in queste equazioni non deve far dimenticare le loro nature distinte</i>». La ragione è tecnica e decisiva: il vettore di stato $\Psi$ deve essere <b>normalizzabile</b>, e appartiene allo spazio di Hilbert; la funzione filtro in $|\langle q|\Psi\rangle|^2$ <i>non</i> appartiene allo spazio di Hilbert, ma allo spazio esteso $\Omega^{\times}$ del tripletto di Hilbert esteso. $|q\rangle$ e $|\Psi\rangle$ si scrivono con lo stesso simbolo e vivono in due spazi diversi. È la ragione per cui si può scrivere $\langle x|\Psi\rangle$ senza contraddizione pur avendo $\langle x|x\rangle=\infty$: non è un prodotto scalare fra due vettori dello stesso spazio, è l&rsquo;azione di un funzionale su un vettore.</p>`},
   {label:'Shankar: lo statuto degli stati impropri, detto con franchezza', body:R`
   <p>Shankar affronta la stessa questione dal lato fisico, e la sua pagina su questo è la più utile che esista perché dissolve una confusione che quasi tutti gli studenti attraversano. Le onde piane $e^{ipx/\hbar}$ — e tutti i vettori impropri, cioè quelli normalizzabili solo alla delta — «<i>sono introdotti nel formalismo come entità puramente matematiche</i>». La nostra incapacità di normalizzarli a uno si traduce nell&rsquo;incapacità di associare loro una distribuzione di probabilità <i>assoluta</i>: l&rsquo;onda piana ha densità relativa uniforme in tutto lo spazio, quindi la probabilità assoluta di trovare la particella in un volume finito, «<i>anche grande come il nostro sistema solare, è zero</i>».</p>
   <p>Ma allora gli stati di impulso ben definito non esistono? «<i>Sì, in senso stretto. Tuttavia esistono stati che sono sia normalizzabili a uno sia arbitrariamente vicini ad avere un impulso preciso</i>» — una funzione che si comporta come $e^{ip_0x/\hbar}$ su una regione grande e si smorza fuori è normalizzabile e ha trasformata di Fourier così stretta attorno a $p_0$ che nessuna misura distinguerebbe. E la sua chiusa: «<i>&lsquo;ben definito&rsquo; non significa mai &lsquo;matematicamente esatto&rsquo;, ma solo &lsquo;esatto a ogni accuratezza misurabile&rsquo;</i>». Quindi: una particella che esce da un acceleratore con $500$ GeV/c dichiarati è in uno stato proprio normalizzabile, non in un&rsquo;onda piana — ma si continua a usare $|p\rangle$ come base perché è incomparabilmente più comoda.</p>`}
  ]},
  {t:'reveal', title:'La gaussiana, svolta per intero', tag:'esempio', steps:[
   {label:'Normalizzazione', body:R`
   <p>L&rsquo;esempio canonico, che Shankar svolge al par. 4.2 e che compare in una forma o nell&rsquo;altra in buona parte degli scritti. Una particella in uno stato la cui funzione d&rsquo;onda in rappresentazione di posizione è gaussiana:</p>
   $$\psi(x)=A\,e^{-(x-a)^{2}/2\Delta^{2}}$$
   <p>Primo passo, sempre: normalizzare. La densità è $|\psi|^2=A^2e^{-(x-a)^2/\Delta^2}$, e l&rsquo;<span class="str" data-str="integrale-gaussiano">integrale gaussiano</span> dà</p>
   $$\int_{-\infty}^{+\infty}e^{-(x-a)^{2}/\Delta^{2}}\,dx=\sqrt\pi\,\Delta$$
   <p>— si noti che l&rsquo;esponente ha $\Delta^2$ e non $2\Delta^2$, perché elevando al quadrato la funzione d&rsquo;onda l&rsquo;esponente raddoppia, e dimenticarlo è l&rsquo;errore più comune in questo conto. Imporre $\int|\psi|^2=1$ dà quindi $A^2\sqrt\pi\,\Delta=1$, cioè $A=(\pi\Delta^2)^{-1/4}$.</p>`},
   {label:'Valor medio e larghezza in posizione', body:R`
   <p>Il valor medio della posizione si calcola integrando $x$ contro la densità normalizzata:</p>
   $$\langle x\rangle=a$$
   <p>E questo si poteva anticipare — Shankar lo dice: «<i>avremmo dovuto aspettarci questo risultato, dato che la densità di probabilità è distribuita simmetricamente attorno a $x=a$</i>». Un integrale che si potrebbe non fare, ma vale farlo una volta per sapere perché non serve farlo le altre.</p>
   <p>La larghezza è lo scarto quadratico medio attorno alla media:</p>
   $$\langle(x-a)^{2}\rangle=\frac{\Delta^{2}}{2}$$
   <p>da cui $\Delta x=\Delta/\sqrt2$. Il parametro $\Delta$ che compare nella formula della funzione d&rsquo;onda <b>non è</b> l&rsquo;indeterminazione: c&rsquo;è un fattore $\sqrt2$ in mezzo, e confonderli è un errore che non si vede nel risultato finale di un esercizio sbagliato.</p>`},
   {label:'E in impulso: la trasformata, e il prodotto', body:R`
   <p>Per sapere la distribuzione dell&rsquo;impulso si applicano gli stessi quattro passi della tappa 03, con l&rsquo;osservabile $P$ al posto di $X$. Shankar li elenca esplicitamente: costruire $P$ in questa base (è $-i\hbar\,d/dx$), trovarne autovalori e autovettori (sono $e^{ipx/\hbar}/\sqrt{2\pi\hbar}$, con autovalore $p$), prendere il prodotto scalare $\langle p|\psi\rangle$, e interpretarne il modulo quadro come densità. Il prodotto scalare è la trasformata di Fourier della gaussiana, che è ancora una gaussiana: con $a=0$ per semplicità,</p>
   $$\tilde\psi(p)=\sqrt{\frac{\Delta}{\sqrt\pi\,\hbar}}\;e^{-\Delta^{2}p^{2}/2\hbar^{2}}$$
   <p>e la densità $|\tilde\psi(p)|^2$ è una gaussiana di larghezza $\Delta p=\hbar/(\sqrt2\,\Delta)$. Da cui il prodotto:</p>
   $$\frac{\Delta}{\sqrt2}\cdot\frac{\hbar}{\sqrt2\,\Delta}=\frac{\hbar}{2}$$
   <p>cioè $\Delta x\,\Delta p=\hbar/2$ esattamente. La gaussiana <i>satura</i> il limite inferiore della relazione di indeterminazione, ed è l&rsquo;unica funzione che lo fa. Shankar dà la lettura generale, che vale ricordare perché smette di far sembrare la relazione un mistero: «<i>la relazione di indeterminazione è una conseguenza del fatto generale che qualunque cosa sia stretta in uno spazio è larga nello spazio trasformato, e viceversa</i>». Il $\Delta$ compare al denominatore in impulso perché compare al numeratore in posizione, e il loro prodotto non dipende da $\Delta$ affatto — che è precisamente il contenuto della relazione.</p>`}
  ]},
  {t:'plot', title:'Stretto in x, largo in p: le due gaussiane e lo scambio',
   intro:R`Le due densità dello stesso stato, in posizione e in impulso, disegnate per tre valori del parametro $\Delta$ in unità $\hbar=1$. Le curve a tratto pieno sono $|\psi(x)|^2$ e quelle della seconda figura $|\tilde\psi(p)|^2$. Il punto da vedere non è la forma — sono tutte gaussiane — ma lo scambio: più la prima si restringe, più la seconda si allarga, e il prodotto delle due larghezze resta $\hbar/2$.`,
   plots:[
    {kind:'func2d', xr:[-4,4], yr:[-0.1,1.4], height:300, ticks:6,
     title:'densità in posizione |ψ(x)|², per tre larghezze',
     curves:[
      {f:'exp(-x*x/0.25)/sqrt(3.1416*0.25)', col:'#4c8dff', width:2.4, label:'Δ = 0.5 (stretto)'},
      {f:'exp(-x*x/1)/sqrt(3.1416*1)', col:'#ff8a5c', width:2.4, label:'Δ = 1'},
      {f:'exp(-x*x/4)/sqrt(3.1416*4)', col:'#9ad67a', width:2.4, label:'Δ = 2 (largo)'}
     ],
     xlabel:'x', ylabel:'densità'},
    {kind:'func2d', xr:[-4,4], yr:[-0.1,1.4], height:300, ticks:6,
     title:'densità in impulso |ψ̃(p)|², per le stesse tre larghezze',
     curves:[
      {f:'0.5*exp(-0.25*x*x)/sqrt(3.1416)', col:'#4c8dff', width:2.4, label:'Δ = 0.5 → largo in p'},
      {f:'1*exp(-1*x*x)/sqrt(3.1416)', col:'#ff8a5c', width:2.4, label:'Δ = 1'},
      {f:'2*exp(-4*x*x)/sqrt(3.1416)', col:'#9ad67a', width:2.4, label:'Δ = 2 → stretto in p'}
     ],
     xlabel:'p (unità ℏ = 1)', ylabel:'densità'}
   ],
   leggi:R`<p><b>Che cosa guardare.</b> I colori sono appaiati fra le due figure: la curva blu, la più stretta e alta in posizione, è la più larga e bassa in impulso; la verde fa l&rsquo;opposto. Tutte e sei hanno area uno, perché sono densità normalizzate — quindi chi si restringe deve alzarsi. <b>Che cosa impararne.</b> Che la relazione di indeterminazione, in questa forma, non è un&rsquo;affermazione sul <i>disturbo</i> della misura: è una proprietà geometrica di un singolo stato, che vale <i>prima</i> che qualcuno misuri qualcosa. Lo stato blu <i>ha</i> una distribuzione di impulso larga, e questo è un fatto sulla sua funzione d&rsquo;onda, non sull&rsquo;apparato. La lettura di Heisenberg in termini di disturbo — vedi la tappa 07 — è una storia vera ma diversa, e tenerle separate evita l&rsquo;errore più diffuso su questo argomento. Si noti infine che, moltiplicando la larghezza blu della prima figura per quella blu della seconda, si ottiene lo stesso numero che si ottiene con le verdi: la figura non mostra tre stati con indeterminazioni diverse, mostra tre stati con la <i>stessa</i> indeterminazione distribuita diversamente.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Nella gaussiana il parametro è $\Delta$ e l&rsquo;indeterminazione è $\Delta/\sqrt2$. Se un esercizio chiede «la probabilità che la particella sia nell&rsquo;intervallo $[a-\Delta x,\,a+\Delta x]$», quanto vale, e si può dare in forma chiusa?`,
    a:R`Non in forma elementare: l&rsquo;integrale di una gaussiana su un intervallo finito è la funzione errore, $\operatorname{erf}$, che non è esprimibile con funzioni elementari. Numericamente, integrare la densità normalizzata da $a-\Delta/\sqrt2$ a $a+\Delta/\sqrt2$ dà $\operatorname{erf}(1/\sqrt2)\approx0{,}683$ — il familiare «68% entro una deviazione standard», che vale per ogni gaussiana ed è indipendente da $\Delta$. La lezione operativa: se un esercizio chiede una probabilità su un intervallo finito per uno stato gaussiano e si aspetta una risposta in forma chiusa, probabilmente chiede invece un <i>confronto</i> fra due intervalli, oppure un limite (intervallo piccolo, dove $P\approx|\psi(a)|^2\cdot2\Delta x$) — e riconoscere quale dei due accorcia molto il lavoro.`},
   {q:R`Griffiths scrive che $\langle x\rangle$ «<i>enfaticamente non significa</i> che se misuri la posizione di una particella ripetutamente, $\int x|\Psi|^2dx$ è la media dei risultati». Perché no?`,
    a:R`Perché la prima misura collassa la funzione d&rsquo;onda su un picco attorno al valore ottenuto, e le misure successive — se fatte abbastanza rapidamente — ripetono semplicemente quel risultato. La media di quelle misure sarebbe il primo valore, non $\langle x\rangle$. $\langle x\rangle$ è «<i>la media di misure effettuate su particelle tutte nello stato $\Psi$</i>», cioè richiede un <b>ensemble</b>: o si trova un modo di riportare la particella allo stato iniziale dopo ogni misura, o si preparano molte particelle identicamente. Griffiths dà l&rsquo;immagine giusta e vale ricordarla perché fissa il concetto: una fila di bottiglie su una mensola, ciascuna con una particella nello stato $\Psi$ relativo al centro della bottiglia, un dottorando col righello assegnato a ciascuna, e al segnale tutti misurano. L&rsquo;istogramma dei risultati riproduce $|\Psi|^2$ e la loro media è $\langle x\rangle$. <b>In breve: il valore di aspettazione è la media di misure ripetute su un ensemble preparato identicamente, non la media di misure ripetute sullo stesso sistema.</b>`}
  ]}
]},
/* ---------------- 06 · LE DUE STATISTICHE: VALOR MEDIO E INDETERMINAZIONE ---------------- */
{ num:'06', title:'Le due statistiche che descrivono lo stato: valor medio e indeterminazione', meta:'il valor medio senza diagonalizzare · perche la media e un valore che non si osserva mai · l indeterminazione come scarto quadratico medio · il problema 2.9 di Ballentine per due strade',
  blocchi:[
  {t:'prosa', title:'Due numeri al posto di una distribuzione', tag:'costruzione', html:R`
  <p>Fin qui lo stato ha prodotto, per ogni osservabile, un oggetto grosso: una lista di probabilità se lo spettro è discreto, una densità se è continuo. Nella pratica — e all&rsquo;esame — quasi mai serve tutta la distribuzione: servono i suoi due primi momenti, e Shankar li chiama «<i>una descrizione piuttosto buona dello stato</i>». Il primo è il <b>valore di aspettazione</b>, cioè la media degli esiti pesata con le loro probabilità; il secondo è l&rsquo;<b>indeterminazione</b>, cioè la larghezza tipica dello sparpagliamento attorno a quella media. Questa tappa li costruisce entrambi e mostra che si calcolano <i>senza risolvere il problema agli autovalori</i>, che è la ragione per cui esistono come oggetti separati e non come sottoprodotti della distribuzione.</p>
  <p>La definizione del primo è obbligata appena si accettano le probabilità costruite nelle tappe precedenti. Se l&rsquo;osservabile $R$ ha spettro discreto $\{r_n\}$ e nello stato $|\psi\rangle$ l&rsquo;esito $r_n$ ha probabilità $p_n=|\langle r_n|\psi\rangle|^2$, la media degli esiti su un numero grande di ripetizioni è</p>
  $$\langle R\rangle=\sum_n r_n\,p_n=\sum_n r_n\,|\langle r_n|\psi\rangle|^2 .$$
  <p>Il passaggio che rende questa formula utile è però il suo <i>riassorbimento</i> nell&rsquo;operatore. Si sostituisca $|\langle r_n|\psi\rangle|^2=\langle\psi|r_n\rangle\langle r_n|\psi\rangle$ e si porti l&rsquo;autovalore dentro il bra: $r_n\langle\psi|r_n\rangle=\langle\psi|R|r_n\rangle$, perché $R$ è autoaggiunto e agisce a sinistra come a destra. Allora</p>
  $$\langle R\rangle=\sum_n\langle\psi|R|r_n\rangle\langle r_n|\psi\rangle=\langle\psi|R\Big(\sum_n|r_n\rangle\langle r_n|\Big)|\psi\rangle=\langle\psi|R|\psi\rangle ,$$
  <p>dove nell&rsquo;ultimo passaggio si è usata la risoluzione dell&rsquo;identità. La somma sullo spettro è scomparsa, e con essa la necessità di conoscere lo spettro.</p>`},
  {t:'prosa', title:'Tre osservazioni di Shankar, e la seconda è quella che si dimentica', tag:'costruzione', html:R`
  <p>Shankar, arrivato a questa formula, mette tre note a margine, e vale la pena ricopiarle perché sono esattamente i tre punti su cui uno studente sbaglia la lettura del valor medio.</p>
  <p>La prima è operativa e la ha già anticipata il conto: «<i>per calcolare $\langle\Omega\rangle$ basta che siano dati il vettore di stato e l&rsquo;operatore $\Omega$ (diciamo come un vettore colonna e una matrice, in una qualche base). Non c&rsquo;è bisogno di trovare gli autovettori o gli autovalori di $\Omega$</i>». È il motivo per cui il valor medio è la prima cosa che si calcola in un problema e non l&rsquo;ultima: costa un prodotto matrice-vettore, non una diagonalizzazione.</p>
  <p>La seconda è un controllo di coerenza: se lo stato è un autostato, $R|\psi\rangle=r|\psi\rangle$, allora $\langle R\rangle=r$. La media coincide con l&rsquo;unico esito possibile, e non c&rsquo;è niente da mediare.</p>
  <p>La terza è quella che si dimentica, e Shankar la dice con un esempio domestico che conviene tenere a mente. «<i>Per valore medio di $\Omega$ intendiamo la media sull&rsquo;ensemble. Una data particella darà naturalmente uno solo degli autovalori all&rsquo;atto della misura. Il valore medio sarà in generale un valore inaccessibile a una singola misura, a meno che non coincida per caso con un autovalore. [Un esempio familiare di questo fenomeno è quello del numero medio di figli per coppia, che può essere 2,12 benché il numero in una data famiglia sia costretto a essere un intero.]</i>» Il valor medio non è un esito: è una proprietà della distribuzione, e può cadere dove lo strumento non può mai puntare. Per l&rsquo;osservabile che accompagna questo movimento — autovalori $2$ e $0$ con probabilità $\tfrac14$ e $\tfrac34$ — il valor medio è $\tfrac12$, e $\tfrac12$ non è un autovalore: nessuna singola misura darà mai $0{,}5$.</p>`},
  {t:'prosa', title:'L&rsquo;indeterminazione, e perché si scrive in due modi', tag:'costruzione', html:R`
  <p>Il secondo numero misura quanto gli esiti si discostano dalla media. La definizione è quella statistica standard, e Shankar la chiama «<i>deviazione quadratica media</i>», in meccanica quantistica <b>indeterminazione</b> di $R$:</p>
  $$\Delta R=\sqrt{\langle(R-\langle R\rangle)^2\rangle} .$$
  <p>Nel caso discreto questo è $(\Delta R)^2=\sum_n p_n\,(r_n-\langle R\rangle)^2$, e nel caso continuo l&rsquo;integrale corrispondente della densità contro $(r-\langle R\rangle)^2$. Ma anche qui la forma utile è quella che non vede lo spettro: si sviluppi il quadrato dentro il valor medio, ricordando che $\langle R\rangle$ è un numero e non un operatore,</p>
  $$(\Delta R)^2=\langle R^2\rangle-2\langle R\rangle\langle R\rangle+\langle R\rangle^2=\langle R^2\rangle-\langle R\rangle^2 ,$$
  <p>cioè $(\Delta R)^2=\langle\psi|R^2|\psi\rangle-\langle\psi|R|\psi\rangle^2$. Due prodotti matrice-vettore, nessuna diagonalizzazione — e per questo Shankar osserva che «<i>anche $\Delta R$, proprio come $\langle R\rangle$, è calcolabile dati solo lo stato e l&rsquo;operatore</i>».</p>
  <p>Che cosa descrivono i due numeri insieme, lo dice con una frase che è il modo giusto di leggere qualunque coppia media-indeterminazione: «<i>se ci è dato che una particella ha $\langle X\rangle=a$ e $\Delta X=\Delta$, sappiamo che la particella sarà probabilmente avvistata vicino a $x=a$, con scostamenti dell&rsquo;ordine di $\Delta$</i>». Non una certezza, non un intervallo: un centro e una scala.</p>
  <p>Vale la pena isolare il caso limite, perché è un criterio che si usa in continuazione: $\Delta R=0$ se e solo se lo stato è un autostato di $R$. Infatti $(\Delta R)^2=\sum_n p_n(r_n-\langle R\rangle)^2$ è una somma di termini non negativi, e si annulla solo se ogni termine si annulla, cioè solo se tutti gli $r_n$ con $p_n\neq0$ coincidono con $\langle R\rangle$ — e allora un solo esito ha probabilità non nulla. <b>Indeterminazione nulla e esito certo sono la stessa cosa</b>, ed è la traduzione quantitativa della definizione di autostato come stato a esito determinato a priori.</p>`},
  {t:'reveal', title:'Il problema 2.9 di Ballentine, risolto per entrambe le strade', tag:'conto', steps:[
   {label:'L&rsquo;enunciato, e perché è un esercizio e non un esempio', body:R`
   <p>Ballentine chiude il capitolo sulla formulazione con un problema che è costruito per far toccare con mano l&rsquo;osservazione di Shankar. Testualmente: «sia $R=\begin{pmatrix}6&-2\\-2&9\end{pmatrix}$ a rappresentare una variabile dinamica, e $|\Psi\rangle=\begin{pmatrix}a\\b\end{pmatrix}$ un vettore di stato arbitrario (con $|a|^2+|b|^2=1$). Si calcoli $\langle R^2\rangle$ <i>in due modi</i>: (a) valutando $\langle R^2\rangle=\langle\Psi|R^2|\Psi\rangle$ direttamente; (b) trovando autovalori e autovettori di $R$, sviluppando il vettore di stato come $|\Psi\rangle=c_1|r_1\rangle+c_2|r_2\rangle$, e valutando $\langle R^2\rangle=r_1^2|c_1|^2+r_2^2|c_2|^2$».</p>
   <p>Lo si svolge qui per intero, con $a$ e $b$ reali per non appesantire la notazione, perché il risultato è un&rsquo;identità algebrica fra due espressioni che <i>non si somigliano</i>: è la dimostrazione, su un caso, che le due definizioni del valor medio sono la stessa.</p>`},
   {label:'Strada (a): il conto diretto, senza toccare lo spettro', body:R`
   <p>Serve $R^2$. Moltiplicando la matrice per sé stessa:</p>
   $$R^2=\begin{pmatrix}6&-2\\-2&9\end{pmatrix}\begin{pmatrix}6&-2\\-2&9\end{pmatrix}=\begin{pmatrix}36+4&-12-18\\-12-18&4+81\end{pmatrix}=\begin{pmatrix}40&-30\\-30&85\end{pmatrix}$$
   <p>e poi il sandwich fra il bra e il ket. Con $R^2|\Psi\rangle=\begin{pmatrix}40a-30b\\-30a+85b\end{pmatrix}$ si ottiene</p>
   $$\langle\Psi|R^2|\Psi\rangle=a(40a-30b)+b(-30a+85b)=40a^{2}-60ab+85b^{2} .$$
   <p>Fine della strada (a): tre righe, e in nessun punto si è dovuto sapere quali siano gli autovalori di $R$.</p>`},
   {label:'Strada (b): lo spettro, gli autovettori, i coefficienti', body:R`
   <p>Il polinomio caratteristico di $R$ si scrive subito dai due invarianti: traccia $6+9=15$ e determinante $54-4=50$, quindi $\lambda^2-15\lambda+50=0$. La formula risolutiva dà</p>
   $$\lambda=\frac{15\pm\sqrt{225-200}}{2}=\frac{15\pm5}{2},\qquad \frac{15+5}{2}=10,\qquad \frac{15-5}{2}=5 .$$
   <p>I due autovalori sono dunque $r_1=5$ e $r_2=10$, entrambi positivi e distinti — nessuna degenerazione, quindi gli autospazi sono due rette.</p>
   <p>Per $r_1=5$: la prima riga di $(R-5)|r_1\rangle=0$ è $(6-5)a'-2b'=0$, cioè $a'=2b'$, e l&rsquo;autovettore normalizzato è $|r_1\rangle=\tfrac1{\sqrt5}\begin{pmatrix}2\\1\end{pmatrix}$. Per $r_2=10$: la prima riga è $(6-10)a'-2b'=0$, cioè $b'=-2a'$, e $|r_2\rangle=\tfrac1{\sqrt5}\begin{pmatrix}1\\-2\end{pmatrix}$. I due sono ortogonali, come devono essere, perché $2\cdot1+1\cdot(-2)=0$.</p>
   <p>I coefficienti dello sviluppo sono le proiezioni dello stato sui due autovettori:</p>
   $$c_1=\langle r_1|\Psi\rangle=\frac{2a+b}{\sqrt5},\qquad c_2=\langle r_2|\Psi\rangle=\frac{a-2b}{\sqrt5} .$$`},
   {label:'Le due strade si incontrano: l&rsquo;identità', body:R`
   <p>Ora si mette tutto nella formula spettrale richiesta dal punto (b), con $r_1^2=25$ e $r_2^2=100$:</p>
   $$\langle R^2\rangle=25\cdot\frac{(2a+b)^2}{5}+100\cdot\frac{(a-2b)^2}{5}=5(2a+b)^{2}+20(a-2b)^{2} .$$
   <p>Che questa sia la stessa cosa del risultato della strada (a) non è evidente a vista, e si vede soltanto sviluppando: $5(4a^2+4ab+b^2)=20a^2+20ab+5b^2$ e $20(a^2-4ab+4b^2)=20a^2-80ab+80b^2$, la cui somma è</p>
   $$5(2a+b)^{2}+20(a-2b)^{2}=40a^{2}-60ab+85b^{2}$$
   <p>cioè esattamente $\langle\Psi|R^2|\Psi\rangle$. <b>Le due definizioni coincidono identicamente in $a$ e $b$</b>, non per un particolare stato: è l&rsquo;identità operatoriale $R^2=\sum_n r_n^2|r_n\rangle\langle r_n|$ scritta in componenti.</p>
   <p>Il bilancio di mestiere è quello che Ballentine voleva far vedere. La strada (b) ha richiesto una radice quadrata, due sistemi lineari, due normalizzazioni e uno sviluppo algebrico; la strada (a) un prodotto di matrici. Si usa (b) soltanto quando servono <i>anche</i> le probabilità dei singoli esiti — e cioè quando la domanda non è «quanto vale in media» ma «quali valori, con quali probabilità».</p>`},
   {label:'Il controllo di normalizzazione, che qui non è un dettaglio', body:R`
   <p>Un controllo che conviene fare sempre, e qui si fa in una riga: la somma dei moduli quadri dei coefficienti deve dare uno. Infatti</p>
   $$|c_1|^2+|c_2|^2=\frac{(2a+b)^2+(a-2b)^2}{5}=\frac{4a^2+4ab+b^2+a^2-4ab+4b^2}{5}=\frac{5a^2+5b^2}{5}=a^2+b^2=1 ,$$
   <p>dove i termini misti si cancellano da soli — e questa cancellazione <i>è</i> l&rsquo;ortogonalità dei due autovettori. Se non si cancellano, c&rsquo;è un errore negli autovettori, e il controllo lo trova prima che l&rsquo;errore arrivi nelle probabilità.</p>`}
  ]},
  {t:'reveal', title:'L&rsquo;indeterminazione dell&rsquo;esempio a tre livelli, e il suo massimo', tag:'conto', steps:[
   {label:'I due numeri per l&rsquo;osservabile del movimento', body:R`
   <p>Si torni all&rsquo;osservabile che attraversa tutto il movimento, $A=\begin{pmatrix}2&0&0\\0&1&1\\0&1&1\end{pmatrix}$ nello stato $|\psi\rangle=\tfrac1{\sqrt6}\begin{pmatrix}1\\2\\-1\end{pmatrix}$, per cui gli esiti possibili sono $2$ con probabilità $\tfrac14$ e $0$ con probabilità $\tfrac34$, e il valor medio è $\langle A\rangle=\tfrac12$.</p>
   <p>Per l&rsquo;indeterminazione serve $\langle A^2\rangle$. Qui lo spettro è già noto, quindi la via più corta è quella spettrale: $A^2$ ha gli stessi autovettori di $A$ con autovalori $4$ e $0$, con le stesse probabilità, e dunque</p>
   $$\langle A^2\rangle=4\cdot\frac14+0\cdot\frac34=1 .$$
   <p>Si noti che l&rsquo;autovalore nullo non contribuisce, qualunque sia la sua probabilità: è la ragione per cui un&rsquo;osservabile con uno zero nello spettro ha $\langle A^2\rangle$ molto più piccolo di quanto l&rsquo;intuizione suggerisca.</p>`},
   {label:'Lo scarto, e la sua radice', body:R`
   <p>Dalla formula $(\Delta A)^2=\langle A^2\rangle-\langle A\rangle^2$:</p>
   $$(\Delta A)^2=1-\Big(\frac12\Big)^{2}=\frac34,\qquad \Delta A=\sqrt{\frac34}=\frac{\sqrt3}{2}\simeq0{,}866 .$$
   <p>Il numero vale una lettura. L&rsquo;indeterminazione è $0{,}87$ su un valor medio di $0{,}5$: più grande della media stessa. Non è un&rsquo;anomalia ed è il regime tipico di un&rsquo;osservabile a due soli esiti lontani — la distribuzione non ha nessun addensamento attorno al valor medio, perché il valor medio è in mezzo al vuoto. La coppia $(\langle A\rangle,\Delta A)$ qui descrive lo stato <i>male</i>, ed è utile saperlo: i due momenti sono una buona sintesi quando la distribuzione è unimodale e stretta, non quando è concentrata su due punti distanti.</p>`},
   {label:'Il caso generale a due esiti, e dove l&rsquo;indeterminazione è massima', body:R`
   <p>Vale la pena generalizzare, perché il conto è di tre righe e dà un risultato che si riconosce. Sia $R$ un&rsquo;osservabile con i soli esiti $2$ e $0$, il primo con probabilità $p$ e il secondo con $1-p$. Allora $\langle R\rangle=2p$, $\langle R^2\rangle=4p$, e</p>
   $$(\Delta R)^2=4p-(2p)^{2}=4p(1-p) .$$
   <p>È la varianza di una bernoulliana riscalata, e la sua forma dice tutto: si annulla agli estremi $p=0$ e $p=1$ — dove l&rsquo;esito è certo, coerentemente col criterio $\Delta R=0$ se e solo se autostato — e ha un massimo in $p=\tfrac12$, dove vale $1$, cioè $\Delta R=1$. <b>L&rsquo;indeterminazione è massima quando i due esiti sono equiprobabili</b>, ed è la formulazione quantitativa dell&rsquo;idea che la sovrapposizione «più quantistica» di due autostati è quella a pesi uguali. Per lo stato di questo movimento $p=\tfrac14$, quindi $(\Delta A)^2=4\cdot\tfrac14\cdot\tfrac34=\tfrac34$ — che ritrova il conto precedente per una strada indipendente, e vale come verifica.</p>`}
  ]},
  {t:'plot', title:'La varianza come parabola: dove uno stato è più indeterminato',
   intro:R`Il risultato $4p(1-p)$ si disegna, ed è la parabola che si vede qui sotto insieme al valor medio $2p$. Il disegno serve a fissare due cose che a parole si confondono: il valor medio cresce linearmente con la probabilità dell&rsquo;esito grande, mentre l&rsquo;indeterminazione non cresce — sale e poi scende, con il massimo esattamente a metà. Il punto $p=\tfrac14$ marcato dalla verticale è lo stato dell&rsquo;esempio.`,
   plots:[
    {kind:'func2d', xr:[0,1], yr:[-0.1,2.1], height:330, ticks:6,
     title:'Valor medio 2p e varianza 4p(1-p) per un osservabile a due esiti (2 e 0)',
     curves:[
      {f:'2*x', col:'#4c8dff', width:2.4, label:'<R> = 2p'},
      {f:'4*x*(1-x)', col:'#ff9f45', width:2.8, label:'(DR)^2 = 4p(1-p)'},
      {f:'2*sqrt(x*(1-x))', col:'#5ac8a0', width:2.2, label:'DR = 2 sqrt(p(1-p))'}
     ],
     xlabel:'p = probabilita dell esito 2', ylabel:'valore'}
   ],
   leggi:R`<p><b>Che cosa guardare.</b> Le tre curve si incontrano in due punti e in nessun altro: a $p=0$, dove tutto si annulla, e a $p=1$, dove la media vale $2$ e le due misure di sparpagliamento tornano a zero. La parabola arancione è simmetrica attorno a $p=\tfrac12$: la varianza di uno stato con $p=0{,}1$ è la stessa di uno con $p=0{,}9$, benché i due stati siano fisicamente opposti. <b>Che cosa impararne.</b> Che l&rsquo;indeterminazione non misura «quanto è grande» l&rsquo;osservabile ma quanto lo stato è lontano dall&rsquo;essere un autostato, e che questa distanza è massima a metà strada. Si noti anche che la curva verde — l&rsquo;indeterminazione vera, non il suo quadrato — ha tangente <i>verticale</i> agli estremi: uscendo di poco da un autostato l&rsquo;indeterminazione cresce molto più in fretta che linearmente, e per questo una piccola contaminazione di un autostato puro si vede già nello sparpagliamento prima che nelle medie.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Se il valor medio si calcola con $\langle\psi|R|\psi\rangle$ senza conoscere lo spettro, perché i problemi d&rsquo;esame chiedono quasi sempre di diagonalizzare?`,
    a:R`Perché la domanda che fanno non è quella del valor medio. «Si determinino i valori misurabili e le corrispondenti probabilità» richiede lo spettro per definizione: i valori misurabili <i>sono</i> gli autovalori e le probabilità sono i moduli quadri delle proiezioni, e nessuna formula li aggira. Il valor medio è l&rsquo;unica quantità che si può avere a sconto, e conviene usarlo in due casi: come <b>controllo</b> a conto finito (si calcola $\langle\psi|R|\psi\rangle$ direttamente e si verifica che coincida con $\sum_n r_np_n$, che è un test indipendente su tutta la diagonalizzazione), e quando il testo chiede soltanto una media o un&rsquo;indeterminazione — e allora diagonalizzare è lavoro buttato.`},
   {q:R`$\Delta A=\tfrac{\sqrt3}{2}$ è più grande di $\langle A\rangle=\tfrac12$. Significa che l&rsquo;osservabile può assumere valori negativi?`,
    a:R`No, e l&rsquo;errore è tipico. L&rsquo;indeterminazione non delimita un intervallo di valori possibili: i valori possibili sono gli autovalori, e qui sono soltanto $2$ e $0$, entrambi non negativi. $\langle A\rangle\pm\Delta A$ darebbe $\tfrac12\pm0{,}87$, cioè un intervallo che contiene numeri negativi, e nessuno di quei numeri è un esito possibile. La lettura «centro più o meno scala» che Shankar propone per $\langle X\rangle=a$, $\Delta X=\Delta$ è buona per una distribuzione continua a campana, ed è fuorviante per uno spettro discreto con due soli punti. In quel caso i due momenti vanno letti per quello che sono, i primi due momenti, e non come una banda di confidenza.`},
   {q:R`Il criterio «$\Delta R=0$ se e solo se autostato» si estende allo spettro continuo?`,
    a:R`La direzione facile sì: se lo stato è un autostato proprio, l&rsquo;indeterminazione è nulla. L&rsquo;altra direzione è la parte delicata, e il motivo è che nello spettro continuo <b>gli autostati non appartengono allo spazio di Hilbert</b>: non sono normalizzabili, dunque non rappresentano stati, dunque non c&rsquo;è nessuno stato con $\Delta x$ esattamente nulla. Quello che resta vero è che esistono stati con $\Delta x$ arbitrariamente piccola — e il prezzo lo si paga altrove, nella larghezza coniugata. Per questo nel caso continuo la frase corretta non è «$\Delta R=0$ implica autostato» ma «$\Delta R$ può essere resa piccola a piacere, mai nulla», e la differenza fra «piccola a piacere» e «nulla» è esattamente la differenza fra uno stato e un simbolo utile.`}
  ]}
]},

/* ---------------- 07 · IL POSTULATO DI PROIEZIONE, E PERCHE NON SI PUO DEDURRE ---------------- */
{ num:'07', title:'Il postulato di proiezione, e la dimostrazione che non si può dedurre', meta:'che cosa dice esattamente il postulato · la norma non si conserva · il determinante del proiettore e zero · i due processi di von Neumann',
  blocchi:[
  {t:'prosa', title:'Che cosa afferma il postulato, nella sua forma nuda', tag:'costruzione', html:R`
  <p>Le tappe precedenti hanno usato il collasso come una regola di calcolo: si proietta, si normalizza, si legge. Questa tappa fa una cosa diversa e di altra natura — guarda il postulato <i>da fuori</i> e chiede che statuto logico abbia. La domanda è precisa e ha una risposta dimostrabile: <b>il postulato di proiezione è indipendente dal resto della teoria</b>, nel senso tecnico che non è conseguenza di nessun altro postulato, e in particolare non è un caso particolare dell&rsquo;evoluzione temporale. Non è un&rsquo;opinione filosofica: si dimostra in mezza pagina, e la dimostrazione è l&rsquo;argomento di questa tappa.</p>
  <p>Conviene prima riscrivere il postulato in forma nuda, separandolo da ogni commento. Picasso lo enuncia così, e la forma italiana è la più asciutta che le fonti di questo corso offrano: «<i>se si misura $\xi$ sul sistema e il risultato della misura è $\xi_i$, subito dopo la misura il sistema è in un autostato di $\xi$ corrispondente all&rsquo;autovalore $\xi_i$</i>». Nella versione che risolve anche il caso degenere, lo stato dopo la misura è la proiezione ortogonale normalizzata dello stato di partenza sull&rsquo;autospazio trovato:</p>
  $$|\psi\rangle\ \longmapsto\ \frac{P(\xi_i)\,|\psi\rangle}{\big\|P(\xi_i)\,|\psi\rangle\big\|}\qquad\text{con probabilità}\quad \big\|P(\xi_i)|\psi\rangle\big\|^2 .$$
  <p>Due cose, in questa riga, sono di una specie che nel resto della teoria non compare mai. La prima è che l&rsquo;esito — <i>quale</i> dei possibili $\xi_i$ — non è determinato dai dati: la mappa non è una funzione dello stato iniziale, è una famiglia di mappe fra cui sceglie il caso. La seconda è che ciascuna delle mappe della famiglia non è lineare, perché la norma al denominatore dipende dal vettore a cui si applica. Sono le due firme che permettono di dimostrare l&rsquo;indipendenza, e si vedono una per volta.</p>`},
  {t:'reveal', title:'Tre modi di vedere che nessuna evoluzione unitaria può fare questo', tag:'conto', steps:[
   {label:'Primo: la norma non si conserva', body:R`
   <p>Si prenda l&rsquo;esempio del movimento, $|\psi\rangle=\tfrac1{\sqrt6}\begin{pmatrix}1\\2\\-1\end{pmatrix}$, e si misuri $A$ ottenendo l&rsquo;esito $0$, il cui autospazio è generato da $|v\rangle=\tfrac1{\sqrt2}\begin{pmatrix}0\\1\\-1\end{pmatrix}$. Il <span class="str" data-str="proiettore-ortogonale">proiettore</span> su quell&rsquo;autospazio è $P(0)=|v\rangle\langle v|$, e applicato allo stato dà</p>
   $$P(0)|\psi\rangle=|v\rangle\langle v|\psi\rangle=\frac{3}{\sqrt{12}}\cdot\frac1{\sqrt2}\begin{pmatrix}0\\1\\-1\end{pmatrix}=\frac1{\sqrt6}\begin{pmatrix}0\\ \tfrac32\\ -\tfrac32\end{pmatrix} .$$
   <p>La sua norma quadra è la somma dei moduli quadri delle componenti:</p>
   $$\big\|P(0)|\psi\rangle\big\|^2=\frac{\frac94+\frac94}{6}=\frac34 .$$
   <p>Il numero è giusto — è la probabilità dell&rsquo;esito $0$, calcolata nelle tappe precedenti per altra via — ma qui interessa come <i>numero</i>: la norma è passata da $1$ a $\sqrt{3/4}$, perché $\tfrac34<1$. Un&rsquo;<span class="str" data-str="operatore-unitario">evoluzione unitaria</span> conserva la norma per definizione, $\|U|\psi\rangle\|=\|\psi\rangle\|$ per ogni stato. Quindi la mappa $|\psi\rangle\mapsto P(0)|\psi\rangle$ non è un&rsquo;evoluzione unitaria, e non lo è di poco: accorcia il vettore di un fattore che <i>dipende dallo stato</i>.</p>
   <p>Si può obiettare che il postulato include la rinormalizzazione, e che dopo quella la norma è di nuovo $1$. È vero, e peggiora la situazione invece di migliorarla: la rinormalizzazione è una divisione per una quantità che dipende dal vettore, dunque rende la mappa <b>non lineare</b>, e l&rsquo;equazione di Schrödinger è lineare. Una mappa non lineare non si ottiene da una lineare per nessuna scelta di hamiltoniana e di tempo.</p>`},
   {label:'Secondo: il determinante è zero, e un unitario non può averlo', body:R`
   <p>Il secondo argomento è più netto perché è un invariante e non dipende dallo stato. Si scriva il proiettore sull&rsquo;altro autospazio di $A$, quello dell&rsquo;autovalore $2$, che è bidimensionale ed è generato da $\begin{pmatrix}1\\0\\0\end{pmatrix}$ e da $\tfrac1{\sqrt2}\begin{pmatrix}0\\1\\1\end{pmatrix}$:</p>
   $$P(2)=\begin{pmatrix}1&0&0\\0&\tfrac12&\tfrac12\\0&\tfrac12&\tfrac12\end{pmatrix} .$$
   <p>Il suo determinante, sviluppato sulla prima riga, è il determinante del blocco $2\times2$ in basso a destra:</p>
   $$\det P(2)=1\cdot\Big(\tfrac12\cdot\tfrac12-\tfrac12\cdot\tfrac12\Big)=0 .$$
   <p>Non è un accidente di questo esempio: <i>ogni</i> proiettore ortogonale su un sottospazio proprio ha determinante nullo, perché annulla tutti i vettori del complemento ortogonale e quindi ha almeno un autovalore zero. Per un <span class="str" data-str="operatore-unitario">operatore unitario</span>, invece, da $U^\dagger U=\mathbb 1$ segue $\det(U^\dagger)\det(U)=1$, cioè $|\det U|^2=1$ e dunque</p>
   $$|\det U|=1 .$$
   <p>Zero contro uno in modulo: nessuna scelta di $U$ può coincidere con un proiettore. L&rsquo;argomento è di algebra elementare, e la sua forza sta proprio in questo — non chiede nulla alla fisica, non chiede nulla alla dimensione dello spazio (basta che sia finita per avere il determinante; in dimensione infinita si usa l&rsquo;invertibilità, che è l&rsquo;argomento successivo).</p>`},
   {label:'Terzo: la mappa non è invertibile, e l&rsquo;evoluzione sì', body:R`
   <p>Il terzo argomento è il più profondo dei tre e vale in qualunque dimensione. Un&rsquo;evoluzione unitaria è <b>invertibile</b>: $U^{-1}=U^\dagger$ esiste sempre, e quindi dallo stato finale si ricostruisce lo stato iniziale. In formule, la conoscenza di $|\psi(t)\rangle$ e dell&rsquo;hamiltoniana determina $|\psi(0)\rangle$ senza ambiguità — è il senso preciso in cui si dice che l&rsquo;evoluzione quantistica non distrugge informazione.</p>
   <p>La proiezione la distrugge, e si vede su due stati. Siano $|\psi_1\rangle=|v\rangle$ e $|\psi_2\rangle=\tfrac1{\sqrt2}\big(|v\rangle+|u\rangle\big)$ con $|u\rangle$ nell&rsquo;autospazio dell&rsquo;autovalore $2$. Sono stati diversi e distinguibili: hanno indeterminazioni diverse su $A$, e misure su $A$ danno statistiche diverse. Ma se su entrambi si misura $A$ e si <i>ottiene</i> l&rsquo;esito $0$, lo stato successivo è $|v\rangle$ in entrambi i casi. Due ingressi distinti, un&rsquo;unica uscita: la mappa non è iniettiva, dunque non ammette inversa, dunque non è unitaria.</p>
   <p>Questo argomento dice qualcosa in più dei primi due. Non dice soltanto che la proiezione non è <i>quella</i> evoluzione, dice che non è di <i>quella specie</i>: fra il prima e il dopo è andata perduta informazione che nessun esperimento successivo può recuperare, mentre l&rsquo;intera dinamica di Schrödinger è costruita per non perderne mai.</p>`}
  ]},
  {t:'prosa', title:'von Neumann li separa, e dichiara che la separazione è irriducibile', tag:'architettura', html:R`
  <p>Che i due processi fossero di specie diversa, von Neumann lo vede nel 1932 e lo scrive come una proprietà strutturale del risultato che ha appena dimostrato. Dopo aver ricavato dal solo valor medio l&rsquo;intera statistica, isola due caratteristiche dell&rsquo;enunciato finale, e la prima è questa: «<i>$P$ è statistico, e non causale; cioè non ci dice quali valori $R_1,\dots,R_\ell$ abbiano negli stati $\varphi$, ma solo con quali probabilità assumano tutti i valori possibili</i>».</p>
  <p>Il confronto che fa subito dopo è ciò che rende la frase un argomento e non una constatazione. In meccanica classica, osserva, esiste anche un metodo statistico, «<i>ma questo è, per così dire, un lusso o un&rsquo;aggiunta extra</i>»: lo si usa quando <i>non</i> si conoscono tutte le $2k$ variabili e si media sulle restanti. La statistica classica è dunque ignoranza colmabile in principio. «<i>Le affermazioni statistiche che abbiamo trovato in meccanica quantistica hanno un carattere diverso</i>», continua, e la differenza la enuncia esattamente: «<i>benché crediamo che dopo aver specificato $\varphi$ conosciamo lo stato del sistema completamente, tuttavia si possono fare solo affermazioni statistiche riguardo ai valori delle quantità fisiche coinvolte</i>».</p>
  <p>Qui c&rsquo;è il punto in cui la dimostrazione algebrica delle tre strade sopra incontra il suo significato fisico. L&rsquo;evoluzione di Schrödinger è causale e invertibile, e trasporta $\varphi$ in $\varphi$ senza perdite; la misura è statistica e irreversibile, e seleziona un ramo. Non si possono ridurre l&rsquo;uno all&rsquo;altro perché la prima non produce mai una selezione e la seconda non è mai una trasformazione dello stato <i>dato lo stato</i> — ha bisogno in più del dato dell&rsquo;esito, che la teoria non fornisce. È per questo che la teoria ha, in questo punto e solo in questo, <b>due leggi di evoluzione invece di una</b>, e che il collasso si chiama postulato e non teorema.</p>
  <p>La conseguenza da portarsi via è onesta e scomoda, ed è quella che la tappa successiva metterà sotto accusa: la teoria come la si usa <i>funziona</i> con due leggi, non dice dove si applichi l&rsquo;una e dove l&rsquo;altra, e il confine fra sistema e apparato — che è ciò che decide quale delle due usare — è messo a mano da chi fa il conto.</p>`},
  {t:'plot', title:'Norma sotto evoluzione e norma sotto proiezione: la differenza in un disegno',
   intro:R`Il contenuto geometrico dei tre argomenti sta in una curva sola. Si prenda uno stato in un piano bidimensionale, scritto come $|\psi(\vartheta)\rangle=\cos\vartheta\,|v\rangle+\sin\vartheta\,|u\rangle$ al variare dell&rsquo;angolo $\vartheta$ fra lo stato e l&rsquo;autospazio su cui si proietta. Si confronti la norma quadra dopo un&rsquo;evoluzione unitaria — che è $1$ per ogni $\vartheta$, retta orizzontale — con la norma quadra dopo la proiezione su $|v\rangle$, che è $\cos^2\vartheta$. Il disegno mostra la seconda caratteristica dei proiettori: tocca $1$ in due punti isolati e sta sotto dappertutto altrove.`,
   plots:[
    {kind:'func2d', xr:[0,6.283], yr:[-0.15,1.3], height:330, ticks:7,
     title:'norma quadra dopo evoluzione unitaria (1) e dopo proiezione (cos^2 theta)',
     curves:[
      {f:'1', col:'#4c8dff', width:2.4, label:'|U psi|^2 = 1, sempre'},
      {f:'cos(x)^2', col:'#ff9f45', width:2.8, label:'|P psi|^2 = cos^2 theta'},
      {f:'0', col:'#8a93a6', width:1.1, label:'asse theta'}
     ],
     xlabel:'theta (angolo fra lo stato e l autospazio)', ylabel:'norma quadra'}
   ],
   leggi:R`<p><b>Che cosa guardare.</b> Le due curve si toccano soltanto dove $\cos^2\vartheta=1$, cioè per $\vartheta=0$ e $\vartheta=\pi$: sono i casi in cui lo stato <i>era già</i> nell&rsquo;autospazio, e lì la proiezione non fa nulla — che è l&rsquo;unico caso in cui il postulato di proiezione e l&rsquo;evoluzione unitaria sono compatibili, ed è il caso in cui nessuno dei due fa niente. Dove la curva arancione tocca lo zero, a $\vartheta=\pi/2$ e $3\pi/2$, l&rsquo;esito ha probabilità nulla e la proiezione è il vettore nullo, che non rappresenta nessuno stato: è la ragione tecnica per cui il postulato si enuncia solo per esiti a probabilità non nulla. <b>Che cosa impararne.</b> La distanza verticale fra le due curve è la quantità di norma che il proiettore distrugge, e la rinormalizzazione è l&rsquo;atto di riportarla a uno dividendo per un numero che si legge sulla curva arancione — cioè per una funzione dello stato. Ogni evoluzione lineare starebbe su una retta orizzontale; nessuna retta orizzontale ha la forma di questa parabola rovesciata periodica.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Se il collasso non si deduce, perché non si può semplicemente scegliere un&rsquo;hamiltoniana molto complicata per l&rsquo;insieme sistema più apparato, e lasciare che Schrödinger faccia tutto?`,
    a:R`È esattamente la mossa giusta da provare, ed è quella che la tappa successiva porta fino in fondo con il teorema generale della misura. L&rsquo;esito, anticipato: l&rsquo;evoluzione unitaria dell&rsquo;insieme sistema più apparato produce sempre una sovrapposizione coerente di stati dell&rsquo;indicatore macroscopicamente distinti, mai la selezione di uno di essi. Gli argomenti di questa tappa dicono <i>perché</i> non può andare diversamente: qualunque $U$ si scelga, e per quanto complicata sia l&rsquo;hamiltoniana che la genera, $|\det U|=1$ e la mappa resta invertibile — dunque non può produrre la perdita di informazione che la selezione comporta. Allargare il sistema non cambia la specie dell&rsquo;evoluzione, la rende solo più grande.`},
   {q:R`La non linearità dovuta alla rinormalizzazione è un vero problema, o è un artefatto di come si sceglie di scrivere lo stato?`,
    a:R`È un artefatto <i>della normalizzazione</i>, non dell&rsquo;irreversibilità, e conviene tenere i due difetti separati perché solo uno dei due è essenziale. Se si rinuncia a tenere i vettori normalizzati, la mappa $|\psi\rangle\mapsto P|\psi\rangle$ è perfettamente lineare, e la probabilità si legge nella norma invece di essere imposta: è la forma in cui conviene scriverla nei conti a più misure. Quello che non si aggira in nessuna scrittura è la <b>non invertibilità</b>: $P$ ha un nucleo non banale, e un operatore con nucleo non banale non ha inversa qualunque convenzione si adotti sui fattori di norma. Il difetto essenziale è quello, e il determinante nullo ne è la firma.`},
   {q:R`«Due leggi di evoluzione» suona come un difetto. Lo è?`,
    a:R`Dipende da che cosa si pretende dalla teoria, e questa è la ragione per cui il disaccordo fra le fonti di questo movimento è reale e non terminologico. Se si pretende che il vettore di stato descriva un sistema individuale, allora sì: servono due leggi, e serve un criterio — che la teoria non dà — per sapere quando applicare quale. Se si pretende soltanto che descriva le statistiche di un ensemble di sistemi preparati nello stesso modo, allora la seconda legge non è una legge di evoluzione ma la descrizione di una <i>nuova preparazione</i>, e la teoria resta con una sola dinamica. Non si tratta di una preferenza estetica: le due letture fanno la stessa previsione su ogni esperimento, e la prossima tappa mostra su quale esperimento reale la differenza è stata messa alla prova.`}
  ]}
]},

/* ---------------- 08 · IL POSTULATO DI TROPPO: LA CRITICA DI BALLENTINE ---------------- */
{ num:'08', title:'Il postulato di troppo: il teorema generale della misura e il disaccordo dichiarato', meta:'il teorema che vieta la riduzione · il gatto come prototipo · i quattro meccanismi proposti e perche ciascuno cade · l esperimento di ricombinazione di spin · la misura di filtraggio, che e il caso dell esame',
  blocchi:[
  {t:'prosa', title:'La mossa di Ballentine: non negare la formula, delimitarla', tag:'architettura', html:R`
  <p>La tappa precedente ha dimostrato che il postulato di proiezione è indipendente dal resto. Chi lo enuncia come postulato — Picasso, Shankar, Griffiths, e la quasi totalità dei corsi — considera chiusa la questione: un postulato in più, ed è il prezzo della teoria. Ballentine dedica un capitolo intero a sostenere che il prezzo non va pagato perché il postulato è <b>di troppo</b>: non sbagliato nei conti, ma superfluo come legge e legittimo solo in un caso particolare. Conviene capire la sua mossa prima dei suoi argomenti, perché la mossa è sottile e viene spesso riportata male.</p>
  <p>Ballentine non dice che la formula $\rho'=P\rho P/\operatorname{Tr}(P\rho P)$ dia risultati sbagliati. Dice tre cose distinte. Primo, che se la si legge come <i>legge di evoluzione di un sistema individuale</i> allora contraddice un teorema dimostrabile. Secondo, che tutti i meccanismi proposti per spiegarla come processo fisico cadono, uno per uno, per la stessa ragione. Terzo — ed è la parte costruttiva — che esiste una classe di misure, quelle di <b>filtraggio</b>, per cui la formula è non soltanto corretta ma <i>derivabile</i> dagli assiomi della probabilità senza postulare niente di nuovo. E che i problemi d&rsquo;esame descrivono esattamente quella classe.</p>
  <p>Il che è la buona notizia, e va detta subito perché toglie l&rsquo;ansia dal resto della tappa: <b>il conto che si fa all&rsquo;esame non cambia</b>. Cambia che cosa si crede di aver fatto facendolo, e cambia la risposta a una domanda d&rsquo;orale sul significato della riduzione — dove sapere che esiste un disaccordo, e dove cade, vale più che recitare una delle due parti.</p>`},
  {t:'reveal', title:'Il teorema generale della misura, e il gatto come suo prototipo', tag:'costruzione', steps:[
   {label:'Gli ingredienti minimi di una misura', body:R`
   <p>Ballentine riduce la misura ai suoi ingredienti indispensabili: un oggetto (I), un apparato (II), e un&rsquo;interazione che produce una correlazione fra una variabile dinamica di (I) e un&rsquo;opportuna variabile <i>indicatrice</i> di (II). L&rsquo;osservabile da misurare è $R$, con autovettori $R|r\rangle^{(\mathrm I)}=r|r\rangle^{(\mathrm I)}$; l&rsquo;apparato ha una variabile indicatrice $A$ con autovettori $A|\alpha,m\rangle^{(\mathrm{II})}=\alpha|\alpha,m\rangle^{(\mathrm{II})}$, dove $\alpha$ è il valore dell&rsquo;indicatore e $m$ sta per tutti gli altri numeri quantici necessari a specificare univocamente il vettore — «<i>un&rsquo;enorme quantità di numeri quantici microscopici che non vengono mai determinati in pratica</i>», come dirà più avanti.</p>
   <p>L&rsquo;apparato è preparato in uno stato iniziale $|0,m\rangle^{(\mathrm{II})}$ con $\alpha=0$. L&rsquo;unica condizione imposta all&rsquo;interazione è quella che la rende una misura: che a valori diversi di $r$ corrispondano valori <i>macroscopicamente distinti</i> dell&rsquo;indicatore. In forma generale, con $U$ l&rsquo;operatore di evoluzione temporale che genera l&rsquo;interazione, e con il <span class="str" data-str="prodotto-tensoriale">prodotto tensoriale</span> fra i due spazi:</p>
   $$U\,|r\rangle^{(\mathrm I)}\otimes|0,m\rangle^{(\mathrm{II})}=\sum_{r',m'}u^{r',m'}_{r,m}\,|r'\rangle^{(\mathrm I)}\otimes|\alpha_r,m'\rangle^{(\mathrm{II})}\equiv|\alpha_r;(r,m)\rangle .$$
   <p>Ballentine è esplicito sul fatto di aver rilassato ogni idealizzazione: lo stato dell&rsquo;oggetto <i>può</i> cambiare — «<i>non c&rsquo;è ragione per cui lo stato dell&rsquo;oggetto (I) debba restare inalterato dall&rsquo;interazione, e in effetti questo è raramente vero in pratica</i>» — e nemmeno l&rsquo;apparato deve restare in un autostato di un $m'$ unico. Resta soltanto che l&rsquo;evoluzione è unitaria e che l&rsquo;indicatore è fedele.</p>`},
   {label:'Il teorema, in due righe', body:R`
   <p>Si consideri ora uno stato iniziale dell&rsquo;oggetto che <i>non</i> sia un autostato dell&rsquo;osservabile che si misura, $|\psi\rangle^{(\mathrm I)}=\sum_r c_r|r\rangle^{(\mathrm I)}$. Dalla linearità di $U$ — e non serve altro — segue immediatamente</p>
   $$U\,|\psi\rangle^{(\mathrm I)}\otimes|0,m\rangle^{(\mathrm{II})}=\sum_r c_r\,|\alpha_r;(r,m)\rangle\equiv|\Psi_{mf}\rangle .$$
   <p>Questo stato finale è una <b>sovrapposizione coerente di autovettori dell&rsquo;indicatore macroscopicamente distinti</b>, ed è il teorema. La dimostrazione è una riga perché tutto il lavoro l&rsquo;ha fatto la condizione di fedeltà: l&rsquo;indicatore deve distinguere gli $r$, dunque i termini della somma sono macroscopicamente diversi, dunque la somma è una sovrapposizione fra situazioni macroscopicamente diverse.</p>
   <p>Il teorema non contraddice le probabilità: in $|\Psi_{mf}\rangle$ la probabilità che l&rsquo;indicatore valga $\alpha_r$ è $|c_r|^2$, la stessa che nello stato iniziale l&rsquo;osservabile valesse $r$. Quello che vieta è la <i>selezione</i>: nello stato finale l&rsquo;indicatore non ha un valore, ha una distribuzione — e l&rsquo;evoluzione unitaria, da sola, non produce mai un valore.</p>`},
   {label:'Il gatto: Schrödinger lo aveva scritto nel 1935', body:R`
   <p>Ballentine attribuisce il prototipo di questo teorema a Schrödinger, e riporta il celebre dispositivo nella sua funzione logica, che è esattamente quella del teorema appena dimostrato. Una camera contiene un gatto, una fiala di gas velenoso, un atomo radioattivo e un congegno automatico che rilascia il veleno quando l&rsquo;atomo decade. Se l&rsquo;atomo fosse isolato, dopo un tempo pari a un tempo di dimezzamento il suo vettore di stato sarebbe $(|u\rangle+|d\rangle)/\sqrt2$, con $|u\rangle$ e $|d\rangle$ gli stati non decaduto e decaduto. Ma l&rsquo;atomo è accoppiato al gatto attraverso l&rsquo;apparato, e quindi lo stato del sistema dopo un tempo di dimezzamento è</p>
   $$\frac{1}{\sqrt2}\Big(|u\rangle_{\text{atomo}}|\text{vivo}\rangle_{\text{gatto}}+|d\rangle_{\text{atomo}}|\text{morto}\rangle_{\text{gatto}}\Big) .$$
   <p>Che è, parola per parola, la forma $\sum_r c_r|\alpha_r;(r,m)\rangle$ del teorema, con il gatto nel ruolo dell&rsquo;indicatore. L&rsquo;argomento di Schrödinger, come Ballentine lo riporta, non è che il gatto sia paradossale: è che «<i>un&rsquo;interpretazione apparentemente plausibile — che le proprietà di un sistema quantistico individuale siano sfumate sull&rsquo;intervallo di valori contenuti nel vettore di stato — non può essere accettata, perché implicherebbe necessariamente una sfumatura macroscopica per oggetti classici come lo sfortunato gatto</i>». Il gatto è una <i>reductio</i>, non un rompicapo.</p>`}
  ]},
  {t:'reveal', title:'I quattro meccanismi proposti per la riduzione, e perché cadono tutti per la stessa ragione', tag:'costruzione', steps:[
   {label:'Che cosa si vorrebbe dimostrare, e che forma avrebbe', body:R`
   <p>Chi tiene alla lettura del vettore di stato come descrizione completa di un sistema individuale deve postulare un processo ulteriore che porti dalla sovrapposizione $|\Psi_{mf}\rangle$ a uno stato «ridotto»</p>
   $$|\Psi_{mf}\rangle\ \longrightarrow\ |\alpha_{r_0};(r_0,m)\rangle ,$$
   <p>cioè a un autovettore dell&rsquo;indicatore con l&rsquo;autovalore effettivamente osservato. Il problema che questo postulato crea, osserva Ballentine, è peculiare di quella lettura: bisogna rendere conto del <i>meccanismo</i> della riduzione. Ne sono stati proposti quattro, e vale la pena vederli tutti e quattro, perché sono le quattro risposte che vengono in mente a chiunque, in quest&rsquo;ordine.</p>`},
   {label:'(i) il disturbo, e (ii) l&rsquo;osservatore', body:R`
   <p><b>Primo meccanismo: la riduzione è causata da un disturbo imprevedibile e incontrollabile dell&rsquo;oggetto da parte dell&rsquo;apparato di misura.</b> È l&rsquo;argomento più antico e più naturale — Ballentine lo attribuisce a Messiah — e ha dalla sua l&rsquo;intuizione fisica che misurare significhi interferire. Cade per una ragione che è già tutta nel teorema: qualunque interazione fra oggetto e apparato che possa fare da causa di quel disturbo <i>è già inclusa</i> nell&rsquo;hamiltoniana da cui si costruisce $U$. Se quell&rsquo;interazione soddisfa la condizione minima per essere una misura, allora conduce alla sovrapposizione e non allo stato ridotto. «<i>Dunque la teoria del disturbo è insostenibile</i>.»</p>
   <p><b>Secondo meccanismo: la riduzione è causata dall&rsquo;osservatore</b> quando legge il risultato sull&rsquo;apparato. Ballentine la liquida come una variante del primo, con l&rsquo;osservatore al posto dell&rsquo;apparato nel ruolo di chi disturba, «<i>e si confuta semplicemente ridefinendo (II) in modo che includa sia l&rsquo;apparato sia l&rsquo;osservatore</i>». Il teorema si riapplica identico al sistema allargato. Aggiunge, con una sobrietà che vale una riga di commento: «<i>ma mentre circolava, questa proposta ha portato ad alcune speculazioni infruttuose sulla possibilità di applicare la meccanica quantistica alla coscienza di un osservatore</i>».</p>`},
   {label:'(iii) l&rsquo;ambiente', body:R`
   <p><b>Terzo meccanismo: la riduzione è causata dall&rsquo;ambiente</b>, dove per ambiente si intende il resto dell&rsquo;universo oltre a (I) e (II). Ballentine osserva che la proposta è vaga perché non è chiaro quale parte dell&rsquo;ambiente dovrebbe essere essenziale, ma che il suo destino è segnato dalla stessa mossa: se si includono formalmente in (II) tutte le parti dell&rsquo;ambiente la cui influenza non sia trascurabile, lo stesso argomento che ha abbattuto (i) e (ii) abbatte anche (iii).</p>
   <p>Qui conviene essere precisi, perché è il punto in cui la critica di Ballentine viene più spesso fraintesa. Egli <i>non</i> sta negando che l&rsquo;ambiente abbia un effetto, e la tappa lo mostrerà fra due passaggi su un conto esplicito: l&rsquo;accoppiamento con l&rsquo;ambiente cancella davvero i termini fuori diagonale, ed è il meccanismo che oggi si chiama decoerenza. Quello che nega è che questo <i>risolva</i> il problema della selezione: l&rsquo;insieme composto da sistema, apparato e ambiente resta in una sovrapposizione coerente, e la diagonalizzazione appare solo quando si decide di non guardare l&rsquo;ambiente. La decoerenza spiega perché non si <i>vedono</i> le interferenze macroscopiche; non produce un esito.</p>`},
   {label:'(iv) lo stato iniziale misto, e il conto che lo chiude', body:R`
   <p><b>Quarto meccanismo, il più tecnico e il più serio.</b> Nel dimostrare il teorema si è assunto che lo stato iniziale dell&rsquo;apparato fosse uno stato puro definito, $|0,m\rangle^{(\mathrm{II})}$. Ma $m$ sta per un numero enorme di numeri quantici microscopici che non si determinano mai: è assai improbabile che abbiano gli stessi valori a ogni ripetizione della preparazione. Lo stato iniziale, dunque, non va descritto come puro ma come una miscela sugli $m$. Si spera che questo apra una via d&rsquo;uscita dal teorema.</p>
   <p>Per rispondere occorre rifare la dimostrazione con <span class="str" data-str="traccia">operatori di stato</span> generali. Lo stato iniziale diventa $\rho_i=\sum_m w_m|\Psi_{mi}\rangle\langle\Psi_{mi}|$, con $w_m$ la probabilità del $m$-esimo stato microscopico. La speranza del sostenitore di (iv) è che lo stato finale sia diagonale negli $\alpha_r$, cioè della forma $\rho_d=\sum_r|c_r|^2\sum_m v_m|\alpha_r;(r,m)\rangle\langle\alpha_r;(r,m)|$ — e Ballentine riconosce che questa forma sarebbe «<i>più plausibile</i>» di una riduzione a un esito unico, perché è già probabilistica, come la teoria esige.</p>
   <p>Ma lo stato finale vero si calcola, ed è $\rho_f=U\rho_iU^\dagger=\sum_m w_m|\Psi_{mf}\rangle\langle\Psi_{mf}|$, cioè, sostituendo l&rsquo;espressione di $|\Psi_{mf}\rangle$ data dal teorema,</p>
   $$\rho_f=\sum_{r_1}\sum_{r_2}c_{r_1}^{*}c_{r_2}\sum_m w_m\,|\alpha_{r_1};(r_1,m)\rangle\langle\alpha_{r_2};(r_2,m)| .$$
   <p>I termini con $\alpha_{r_1}\neq\alpha_{r_2}$ ci sono, e indicano una sovrapposizione coerente di autovettori dell&rsquo;indicatore macroscopicamente distinti, esattamente come nel caso puro. «<i>È chiaro che i termini non diagonali non possono svanire così da ridurre lo stato alla forma</i>» sperata. Il teorema vale per gli stati generali come per quelli puri, e con questo cadono tutti e quattro i meccanismi.</p>
   <p>Ballentine chiude il conto citando Einstein, ed è una citazione che vale la pena leggere perché inquadra la conclusione come scelta di interpretazione e non come scoperta sperimentale: «<i>si arriva a concezioni teoriche molto implausibili, se si tenta di mantenere la tesi che la teoria quantistica statistica sia in principio capace di produrre una descrizione completa di un sistema fisico individuale. D&rsquo;altra parte, quelle difficoltà di interpretazione teorica svaniscono, se si guarda alla descrizione quantomeccanica come alla descrizione di ensemble di sistemi</i>».</p>`}
  ]},
  {t:'reveal', title:'L&rsquo;esperimento di ricombinazione di spin: il punto in cui la questione è stata misurata', tag:'conto', steps:[
   {label:'Il dispositivo, e la domanda che pone', body:R`
   <p>Fin qui l&rsquo;argomento è teorico, e un buon studente deve chiedersi se la differenza fra «lo stato si riduce» e «lo stato non si riduce» abbia una conseguenza osservabile. Ha, e Ballentine la porta sull&rsquo;interferometro a neutroni a cristallo singolo, in un esperimento che è il più diretto che questa materia offra.</p>
   <p>Un fascio di neutroni polarizzati nella direzione $+z$ entra da sinistra. Nel punto $A$ si divide in un fascio trasmesso $AC$ e in un fascio riflesso di Bragg $AB$. Nel fascio $CD$ è inserito un <i>rovesciatore di spin</i>, così che nel punto $D$ si ricombinano un fascio con spin su e un fascio con spin giù. Si determina poi lo stato di spin dei fasci che escono a destra.</p>
   <p>La domanda è quella che il dispositivo è costruito per porre. «<i>Sembra ragionevole dire che i neutroni nel punto $B$ hanno lo stato di spin $|+\rangle$ e che i neutroni che emergono dal rovesciatore hanno lo stato di spin $|-\rangle$</i>»: due fasci separati di qualche centimetro, le cui funzioni d&rsquo;onda spaziali non si sovrappongono. Si potrebbe supporre che ogni coerenza sia andata perduta e che nessuna interferenza sia possibile.</p>`},
   {label:'Due previsioni diverse, e la prima è indistinguibile su sigma z', body:R`
   <p>Se la coerenza è perduta, lo stato di spin alla ricombinazione è la miscela incoerente</p>
   $$\rho_{\text{inc}}=\tfrac12\Big(|+\rangle\langle+|+|-\rangle\langle-|\Big) ,$$
   <p>e Ballentine fa notare che questo è precisamente lo stato che l&rsquo;ipotesi di riduzione suggerisce. Se invece la coerenza è mantenuta, lo stato è puro,</p>
   $$\rho_{\text{coh}}=|u\rangle\langle u|,\qquad |u\rangle=\frac{e^{i\alpha}|+\rangle+e^{i\beta}|-\rangle}{\sqrt2} .$$
   <p>Il punto decisivo è che le due previsioni <b>coincidono</b> sulla componente $z$ dello spin. Entrambe danno probabilità $\tfrac12$ a $\sigma_z=+1$ e $\tfrac12$ a $\sigma_z=-1$, e dunque</p>
   $$\langle\sigma_z\rangle=\tfrac12\cdot1+\tfrac12\cdot(-1)=0$$
   <p>in tutti e due i casi. Chi misurasse soltanto $\sigma_z$ non distinguerebbe mai una miscela da una sovrapposizione — ed è l&rsquo;errore che il problema 2.6 dello stesso libro invita a non fare, chiedendo di mostrare che $\langle\sigma\rangle=0$ per l&rsquo;intera famiglia a un parametro $|\vartheta\rangle=\tfrac1{\sqrt2}(|+\rangle+e^{i\vartheta}|-\rangle)$ <i>e</i> per la miscela, e domandando poi: «<i>quali sono, se ce ne sono, le differenze fisiche fra questi vari stati, e come si potrebbero misurare?</i>»</p>`},
   {label:'Dove le due previsioni divergono, e cosa ha trovato l&rsquo;esperimento', body:R`
   <p>Divergono sul piano $xy$. La miscela $\rho_{\text{inc}}$ non prevede polarizzazione in <i>nessuna</i> direzione; la sovrapposizione $\rho_{\text{coh}}$ prevede che lo spin sia polarizzato in una direzione del piano $xy$, e la componente media lungo $x$ vale, per le <span class="str" data-str="matrici-di-pauli">matrici di Pauli</span>,</p>
   $$\langle\sigma_x\rangle=\cos(\alpha-\beta) .$$
   <p>Le fasi $\alpha$ e $\beta$ non sono note a priori, ma la loro <i>differenza</i> si può variare sistematicamente inserendo uno sfasatore in uno dei due fasci. L&rsquo;esperimento — Ballentine cita Summhammer e collaboratori, 1982 — «<i>ha trovato una dipendenza periodica di $\langle\sigma_x\rangle$ dallo sfasamento, e nessuna dipendenza di questo tipo per $\langle\sigma_z\rangle$, confermando che la sovrapposizione coerente è lo stato corretto</i>».</p>
