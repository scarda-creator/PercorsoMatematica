<script>
"use strict";
const R = String.raw;

function typeset(el){
  if(el && window.renderMathInElement){
    try{ renderMathInElement(el,{delimiters:[
      {left:'$$',right:'$$',display:true},
      {left:'$',right:'$',display:false}
    ],throwOnError:false}); }catch(e){}
  }
}
function elFromHTML(html){ var d=document.createElement('div'); d.innerHTML=html; return d; }

/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un
   rimando scritto nella prosa:

       <span class="str" data-str="serie-geometrica">la serie geometrica</span>

   Le schede citate da questo nucleo sono cucite qui sotto dal montaggio
   (assembla-nucleo.js): la pagina resta autosufficiente — niente fetch,
   niente sottocartelle da pubblicare — e un rimando a una scheda che non
   esiste FERMA la costruzione invece di arrivare in pagina rotto.
   Apertura: lo stesso gesto del collaudo (si clicca, il pannello compare,
   si typeset una volta sola), portato dentro la frase.
   =================================================================== */
var CORSO = 'geometria-differenziale';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};


function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';
  return h;
}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

var TAPPE = [


/*MOVIMENTO
id:        gd-16 — equazioni del primo ordine su varietà
identita:  una derivata lungo un campo è un'equazione alle derivate parziali, e si risolve seguendo il campo
copre:     G.30, R.8
serve:     gd-15 (gd-15-flussi.html)
apre:      gd-17 (gd-17-trasversalita.html)
registro:  Lezioni del 10/12 e 17/12/2019 — Cauchy non caratteristico, Teorema sui Flussi Uscenti, trasporto e Burgers
fonti:     Lee «Introduction to Smooth Manifolds» cap. 9 (flussi) per la struttura; Evans «Partial Differential Equations» §3.2 per il metodo delle caratteristiche
generata:  2026-09-19 da mappa.json — non modificare a mano, si cambia la mappa
MOVIMENTO*/

/*CONTROLLO

  "ipotesi":{"t":"real","x":"real","u":"real"},
  "dove":"02","appare":"g(x-ut)"},

 {"tipo":"uguale","sinistra":"diff(-x/(1-t),t)+(-x/(1-t))*diff(-x/(1-t),x)","vale":"0",
  "ipotesi":{"t":"real","x":"real"},
  "dove":"03","appare":"-\\dfrac{x}{1-t}"},

 {"tipo":"uguale","sinistra":"(-x/(1-t)).subs(t,0)","vale":"-x",
  "ipotesi":{"x":"real"},
  "dove":"03","appare":"g(x)=-x"},

 {"tipo":"uguale","sinistra":"diff(x/(1+t),t)+(x/(1+t))*diff(x/(1+t),x)","vale":"0",
  "ipotesi":{"t":"real","x":"real"},
  "dove":"03","appare":"\\dfrac{x}{1+t}"},

  "perche":"e' l'equazione delle caratteristiche, cioe' la famiglia di rette lungo cui la soluzione non cambia: una descrizione geometrica, non un valore"},

 {"tipo":"simbolico","dove":"03","appare":"t^*=+\\infty$ quando $g$ è non decrescente",
  "perche":"e' il caso complementare della formula del tempo di shock, enunciato per g generica: nessun valore da calcolare"},

 {"tipo":"simbolico","dove":"03","appare":"t^*=-\\frac{1}{\\min g'}",

]
CONTROLLO*/

/* ---------------- 00 · DI COSA PARLA QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Di cosa parla questo movimento', meta:'Geometria Differenziale · voci G.30 e R.8 · il punto in cui la geometria risolve unequazione a derivate parziali',
  blocchi:[
  {t:'prosa', title:'Lidea, e perche e sorprendente', tag:'architettura', html:R`
  <p>Un'equazione alle derivate parziali sembra un oggetto più difficile di un'equazione ordinaria: ci sono più variabili indipendenti, e non c'è una «direzione del tempo» privilegiata. <b>Per le equazioni del primo ordine questa impressione è falsa</b>, e questo movimento spiega perché.</p>
  <p>Il motivo sta in una riscrittura. Un'equazione del tipo
  $$a^1(x)\frac{\partial f}{\partial x^1}+\cdots+a^n(x)\frac{\partial f}{\partial x^n}=0$$
  non è altro che la derivata di $f$ lungo il campo vettoriale $X=\sum a^i\partial/\partial x^i$. Cioè si scrive
  $$X(f)=0,$$
  e in questa forma dice una cosa sola e geometrica: <b>$f$ è costante lungo le curve integrali di $X$</b>. Quelle curve si chiamano <b>caratteristiche</b>, e conoscerle riduce la PDE a un problema che è già stato risolto — trovare le curve integrali di un campo.</p>
  <p><b>La conseguenza operativa è forte</b>: risolvere un'equazione alle derivate parziali del primo ordine non richiede nessuna tecnica nuova. Richiede di integrare un campo, cioè un sistema di equazioni ordinarie, e poi di propagare il dato iniziale lungo le soluzioni. Diverio lo tratta il 10 e il 17 dicembre, e chiude il corso con questo; in <b>Lee</b> la struttura sta nel capitolo 9, mentre il metodo per il caso quasi-lineare è svolto in dettaglio in <b>Evans §3.2</b>.</p>`},
  {t:'prosa', title:'Il filo delle quattro tappe', tag:'mappa', html:R`
  <p>La prima tappa riscrive l'equazione in forma geometrica e chiarisce <b>dove si può mettere il dato</b>: non su una superficie qualunque, ma su una che le caratteristiche <i>attraversano</i> — è la condizione di non caratteristicità. La seconda risolve il caso lineare, con l'equazione del trasporto come modello. La terza passa al caso <b>quasi-lineare</b>, in cui il campo dipende dalla soluzione stessa, e lì compare il fenomeno che il caso lineare non ha: la soluzione liscia <b>cessa di esistere</b> in tempo finito. La quarta è il teorema generale che mette tutto insieme.</p>`}
]},

/* ---------------- 01 · LA RISCRITTURA E IL DATO ---------------- */
{ num:'01', title:'La riscrittura geometrica, e dove si puo mettere il dato', meta:'X(f)=0 · le caratteristiche · ipersuperficie non caratteristica · perche la condizione serve',
  blocchi:[
  {t:'prosa', title:'Le due letture della stessa equazione', tag:'costruzione', html:R`
  <p>L'equazione $X(f)=0$ si legge in due modi, ed entrambi servono:</p>
  <ul>
   <li><b>analitico</b>: una relazione lineare fra le derivate parziali di $f$, con coefficienti dati;</li>
   <li><b>geometrico</b>: $f$ ha derivata nulla lungo $X$, quindi <b>è costante su ogni curva integrale</b>. Le superfici di livello di $f$ contengono le caratteristiche, e $f$ è determinata da quale valore assegna a ciascuna.</li>
  </ul>
  <p>La seconda lettura suggerisce immediatamente come costruire le soluzioni: <b>si sceglie un valore per ogni curva integrale</b>. Il modo di farlo è dare $f$ su una ipersuperficie $S$ che ogni curva attraversi una volta sola, e poi <b>propagare</b> quel valore lungo il flusso.</p>
  <p>Il problema di <b>Cauchy</b> è quindi: trovare $f$ con $X(f)=0$ e $f|_{S}=\varphi$, dove $\varphi$ è il dato su $S$.</p>`},
  {t:'prosa', title:'La condizione di non caratteristicita, e cosa succede senza', tag:'first principles', html:R`
  <p><b>La condizione.</b> L'ipersuperficie $S$ si dice <b>non caratteristica</b> in $p\in S$ se
  $$X(p)\notin T_pS,$$
  cioè se il campo <b>attraversa</b> $S$ invece di essere tangente. <b>Teorema:</b> se $S$ è non caratteristica in ogni punto, il problema di Cauchy ha una e una sola soluzione liscia in un intorno di $S$.</p>
  <p><b>Perché la condizione non è tecnica ma necessaria</b>, e si vede con due casi limite:</p>
  <ul>
   <li>se $X$ è <b>tangente</b> a $S$ in un punto, allora lungo $S$ la soluzione dovrebbe essere costante (perché $f$ è costante lungo le caratteristiche, e lì la caratteristica corre <i>dentro</i> $S$). Ma il dato $\varphi$ è arbitrario e in generale non è costante: <b>il problema non ha soluzione</b>;</li>
   <li>se il dato $\varphi$ <i>fosse</i> costante lungo quella direzione, la condizione diventa compatibile — ma allora la soluzione <b>non è unica</b>, perché nulla determina $f$ fuori da $S$ nella direzione mancante.</li>
  </ul>
  <p><b>Esistenza o unicità: senza la condizione si perde l'una o l'altra</b>, mai entrambe conservate. È esattamente la stessa alternativa che in algebra lineare distingue un sistema incompatibile da uno indeterminato, e non è un caso: il problema di Cauchy è lineare.</p>`},
  {t:'plot', title:'Caratteristiche e dato: quando il campo attraversa, e quando no',
   intro:R`Le curve integrali di un campo e due possibili ipersuperfici su cui dare il dato: una attraversata (buona) e una tangente (cattiva).`,
   plots:[
    {kind:'phase', fx:'1', fy:'0.35', xr:[-2,2], yr:[-1.6,1.6], n:12, height:320,
     seeds:[[-1.9,-1.2],[-1.9,-0.6],[-1.9,0],[-1.9,0.6],[-1.9,1.2]],
     title:'le caratteristiche: le curve lungo cui la soluzione e costante',
     segs:[{x1:0, y1:-1.6, x2:0, y2:1.6, col:'#5eead4', width:3, label:'S buona: il campo la attraversa', lx:0.06, ly:1.35},
           {x1:-2, y1:-0.7, x2:2, y2:0.7, col:'#ff6b6b', width:3, label:'S cattiva: il campo le e tangente', lx:-1.9, ly:-1.0}]}
   ],
   leggi:R`<b>Le frecce sono le caratteristiche</b>: lungo ognuna la soluzione non cambia. La retta verticale verde è una buona superficie su cui dare il dato — ogni caratteristica la attraversa una volta sola, quindi assegnare $\varphi$ lì significa assegnare un valore a ciascuna curva, e la soluzione esiste ed è unica.<br><br>
   <b>La retta rossa è tangente al campo</b>: giace <i>lungo</i> una caratteristica. Dare un dato su di essa è chiedere che $f$ assuma valori diversi su punti della stessa curva integrale, dove però $f$ deve essere costante: <b>il problema è sovradeterminato e in generale non ha soluzione</b>. E se per caso il dato fosse costante, resterebbe indeterminato in tutte le direzioni trasverse.<br><br>
   <b>Da portare via</b>: la condizione di non caratteristicità non è una richiesta di regolarità, è la richiesta che il dato sia <i>indipendente</i> — e si verifica a occhio guardando se il campo buca la superficie.`}
]},

/* ---------------- 02 · IL CASO LINEARE ---------------- */
{ num:'02', title:'Il caso lineare: lequazione del trasporto', meta:'la soluzione per propagazione · g(x-ut) · e perche il profilo si sposta senza deformarsi',
  blocchi:[
  {t:'reveal', title:'Lequazione modello, risolta per intero', tag:'esame', steps:[
   {label:'Il problema', body:R`
   <p>$$\frac{\partial f}{\partial t}+u\frac{\partial f}{\partial x}=0,\qquad f(0,x)=g(x),$$
   con $u$ costante. In forma geometrica è $X(f)=0$ con $X=\partial_t+u\,\partial_x$ sul piano $(t,x)$, e il dato è assegnato sulla retta $t=0$ — <b>non caratteristica</b>, perché $X$ ha componente $1$ nella direzione $t$ e quindi la attraversa.</p>`},
   {label:'Le caratteristiche e la soluzione', body:R`
   <p>Le curve integrali di $X$ risolvono $\dot t=1$, $\dot x=u$: sono le rette
   $$x-ut=\text{costante}.$$
   La soluzione è costante su ciascuna, e sulla retta $t=0$ vale $g$; quindi il valore in $(t,x)$ è il valore del dato nel punto da cui quella caratteristica proviene:
   $$f(t,x)=g(x-ut),$$
   e la verifica diretta conferma che <b>$g(x-ut)$</b> annulla l'equazione per qualunque $g$ derivabile.</p>`},
   {label:'Che cosa dice fisicamente', body:R`
   <p><b>Il profilo iniziale trasla rigidamente con velocità $u$, senza cambiare forma.</b> Non si allarga, non si attenua, non si deforma: l'equazione del trasporto descrive il puro trascinamento.</p>
   <p>Conviene confrontarla con ciò che <i>non</i> fa. Un termine di diffusione ($\partial_t f=\kappa\partial_x^2 f$) allargherebbe il profilo smussandolo; un termine del secondo ordine nel tempo darebbe due onde che viaggiano in versi opposti. <b>Qui c'è una sola direzione di propagazione</b>, ed è la firma delle equazioni del primo ordine: <i>l'informazione viaggia lungo le caratteristiche, in un verso solo</i>.</p>`}
  ]},
  {t:'plot', title:'Il profilo che trasla senza deformarsi',
   intro:R`La soluzione $f(t,x)=g(x-ut)$ con $g$ una gaussiana e $u=1$, a quattro istanti successivi.`,
   plots:[
    {kind:'func2d', xr:[-3,7], yr:[-0.1,1.15], height:320,
     title:'quattro istantanee: la forma resta identica, cambia solo la posizione',
     xlabel:'x', ylabel:'f(t,x)',
     curves:[
      {f:'exp(-4*x*x)', col:'#5eead4', width:2.2, label:'t=0'},
      {f:'exp(-4*(x-1.5)*(x-1.5))', col:'#d8a13a', width:2.2, label:'t=1.5'},
      {f:'exp(-4*(x-3)*(x-3))', col:'#b98cff', width:2.2, label:'t=3'},
      {f:'exp(-4*(x-4.5)*(x-4.5))', col:'#4c8dff', width:2.2, label:'t=4.5'}
     ],
     segs:[{x1:-3, y1:0, x2:7, y2:0, col:'#4d5a6b', width:1}]}
   ],
   leggi:R`<b>Le quattro curve sono la stessa curva</b>, spostata: altezza identica, larghezza identica, nessuna coda che si allunga. È il contenuto di $f(t,x)=g(x-ut)$ letto su un grafico — e il contrasto con la diffusione, dove le curve si abbassano e si allargano, è il modo più rapido di ricordare la differenza fra un'equazione del primo ordine e una del secondo.<br><br>
   <b>Il dettaglio che conta all'esame</b>: la velocità di traslazione è $u$, cioè il <i>coefficiente</i> dell'equazione, e non dipende né dal profilo né dal tempo. Nella tappa seguente quel coefficiente diventerà $f$ stessa, e proprio allora la forma comincerà a cambiare.`}
]},

/* ---------------- 03 · IL CASO QUASI-LINEARE ---------------- */
{ num:'03', title:'Il caso quasi-lineare e lequazione di Burgers: quando la soluzione si rompe', meta:'il campo che dipende dalla soluzione · le caratteristiche che si incontrano · il tempo di shock',
  blocchi:[
  {t:'prosa', title:'La differenza, e perche cambia tutto', tag:'costruzione', html:R`
  <p>Nel caso <b>quasi-lineare</b> i coefficienti dipendono anche dal valore incognito:
  $$\frac{\partial f}{\partial t}+f\,\frac{\partial f}{\partial x}=0$$
  è l'<b>equazione di Burgers inviscida</b>, il modello più semplice. La velocità di trasporto non è più una costante $u$: <b>è la soluzione stessa</b>. Dove $f$ è grande il profilo avanza più in fretta, dove è piccola più piano.</p>
  <p>Il metodo geometrico funziona ancora, con un aggiustamento: le caratteristiche vanno cercate nello spazio <b>esteso</b> che comprende anche la variabile dipendente, e il campo diventa $\partial_t+f\partial_x$ con $f$ costante lungo la curva. Il risultato è che le caratteristiche sono ancora <b>rette</b>, ma con pendenze diverse:
  $$x=x_0+g(x_0)\,t,$$
  e la soluzione è data in forma <b>implicita</b> da $f=g(x-ft)$.</p>
  <p><b>Qui nasce il fenomeno nuovo.</b> Se $g$ è decrescente, le caratteristiche che partono da punti diversi <b>convergono</b> e prima o poi si incontrano. Nel punto di incontro la soluzione dovrebbe assumere due valori diversi: <b>la soluzione liscia cessa di esistere</b>, e si forma uno <b>shock</b>.</p>`},
  {t:'reveal', title:'I due conti che mostrano le due sorti', tag:'esame', steps:[
   {label:'Dato crescente: nessun problema', body:R`
   <p>Con $g(x)=x$ la soluzione è
   $$f(t,x)=\frac{x}{1+t},$$
   e la verifica diretta conferma che annulla l'equazione. Le caratteristiche <b>divergono</b> — quelle che partono più a destra vanno più veloci — e il profilo si <b>allarga</b> indefinitamente. La soluzione è liscia per ogni $t>0$: <b>nessuno shock</b>, mai.</p>`},
   {label:'Dato decrescente: shock a tempo finito', body:R`
   <p>Con <b>$g(x)=-x$</b> la soluzione è
   $$f(t,x)=-\frac{x}{1-t},$$
   e anche questa verifica l'equazione. Ma il denominatore si annulla a $t=1$: <b>la soluzione esplode</b>. Le caratteristiche convergono tutte verso l'origine e si incontrano lì, tutte insieme, al tempo $1$.</p>
   <p><b>Il tempo di shock in generale</b> è
   $$t^*=-\frac{1}{\min g'},$$
   quando $g$ ha qualche tratto decrescente, e $t^*=+\infty$ quando $g$ è non decrescente. <b>La derivata del dato iniziale decide il destino della soluzione</b>, e lo decide subito: non serve integrare per saperlo.</p>`},
   {label:'Che cosa succede dopo lo shock', body:R`
   <p>La teoria di questo corso finisce qui — <b>oltre $t^*$ non esiste soluzione liscia</b>, e il problema di Cauchy così posto non ha risposta. La strada che si prende in analisi è ammettere <b>soluzioni deboli</b>, che soddisfano l'equazione in senso integrale e possono avere discontinuità; ma allora l'unicità si perde, e occorre una <i>condizione di entropia</i> per selezionare quella fisica.</p>
   <p><b>Vale la pena sapere che il muro è lì e perché</b>: non è un limite del metodo delle caratteristiche, è un fatto sull'equazione. Le caratteristiche si incontrano davvero, e nessuna tecnica può far assumere due valori a una funzione.</p>`}
  ]},
  {t:'plot', title:'Le caratteristiche che divergono e quelle che si incontrano',
   intro:R`Le rette caratteristiche $x=x_0+g(x_0)t$ nel piano $(t,x)$, per dato crescente e per dato decrescente.`,
   plots:[
    {kind:'func2d', xr:[0,2], yr:[-2.5,2.5], height:310,
     title:'dato crescente g(x)=x: le caratteristiche divergono, nessuno shock',
     xlabel:'t', ylabel:'x',
     curves:[
      {f:'-2-2*x', col:'#5eead4', width:1.8, label:'da x0=-2'},
      {f:'-1-1*x', col:'#5eead4', width:1.8},
      {f:'0', col:'#4d5a6b', width:1.6},
      {f:'1+1*x', col:'#d8a13a', width:1.8},
      {f:'2+2*x', col:'#d8a13a', width:1.8, label:'da x0=2'}
     ]},
    {kind:'func2d', xr:[0,2], yr:[-2.5,2.5], height:310,
     title:'dato decrescente g(x)=-x: si incontrano tutte a t=1',
     xlabel:'t', ylabel:'x',
     curves:[
      {f:'-2+2*x', col:'#b98cff', width:1.8, label:'da x0=-2'},
      {f:'-1+1*x', col:'#b98cff', width:1.8},
      {f:'0', col:'#4d5a6b', width:1.6},
      {f:'1-1*x', col:'#ff6b6b', width:1.8},
      {f:'2-2*x', col:'#ff6b6b', width:1.8, label:'da x0=2'}
     ],
     segs:[{x1:1, y1:-2.5, x2:1, y2:2.5, col:'#ff9b6b', dash:true, width:1.6, label:'t*=1: shock', lx:1.04, ly:2.1}],
     marks:[{x:1, y:0, label:'qui si incontrano tutte', col:'#ff6b6b'}]}
   ],
   leggi:R`<b>A sinistra le rette si allontanano</b>: partendo da punti diversi con velocità crescenti, non si incontrano mai. Ogni punto del piano $(t,x)$ è raggiunto da <i>una sola</i> caratteristica, quindi la soluzione è definita ovunque e resta liscia.<br><br>
   <b>A destra convergono</b>, e a $t=1$ passano tutte per lo stesso punto. Oltre quella linea, un punto del piano è raggiunto da <b>più caratteristiche con valori diversi</b>: la funzione dovrebbe valere due cose insieme, e la soluzione liscia non esiste più.<br><br>
   <b>Il criterio si legge sulla figura prima che nei conti</b>: si guarda se le rette divergono o convergono, e la risposta è nel segno di $g'$. È anche il motivo per cui l'equazione di Burgers è il modello standard della formazione delle onde d'urto: <b>la parte alta di un'onda viaggia più veloce di quella bassa, la raggiunge, e il fronte diventa verticale.</b>`}
]},

/* ---------------- 04 · IL TEOREMA GENERALE ---------------- */
{ num:'04', title:'Il Teorema sui Flussi Uscenti, e cosa garantisce', meta:'lenunciato · la costruzione con il flusso · lintorno in cui vale · e il limite locale',
  blocchi:[
  {t:'prosa', title:'Lenunciato e la costruzione', tag:'sintesi', html:R`
  <p><b>Teorema (flussi uscenti).</b> Sia $S\subseteq M$ un'ipersuperficie e $X$ un campo <b>non tangente</b> a $S$ in nessun punto. Allora la mappa
  $$(t,s)\ \longmapsto\ \Phi_t(s),\qquad s\in S,$$
  è un <b>diffeomorfismo</b> da un intorno di $\{0\}\times S$ su un intorno di $S$ in $M$.</p>
  <p><b>In parole: il flusso fornisce un sistema di coordinate</b> in cui una è il tempo lungo le caratteristiche e le altre parametrizzano $S$. La dimostrazione è il teorema di invertibilità locale: il differenziale della mappa nell'origine manda la direzione $t$ in $X$ e le direzioni di $S$ in se stesse, ed è invertibile <b>esattamente</b> perché $X$ non è tangente — cioè per la condizione di non caratteristicità.</p>
  <p>Con queste coordinate la PDE diventa banale: $X$ è $\partial/\partial t$, l'equazione $X(f)=0$ diventa $\partial f/\partial t=0$, e la soluzione è «$f$ non dipende da $t$», cioè <b>$f$ è il dato propagato</b>. <b>Tutto il contenuto del metodo delle caratteristiche è questo cambio di coordinate.</b></p>
  <div class="note"><b>Il limite, dichiarato:</b> il teorema è <b>locale</b>. Garantisce la soluzione in un intorno di $S$, non ovunque, e il caso di Burgers mostra che non potrebbe essere altrimenti — lì le coordinate costruite dal flusso smettono di essere un diffeomorfismo proprio al tempo di shock, quando due caratteristiche si incontrano e la mappa perde l'iniettività. <b>La geometria non nasconde il problema: lo localizza</b>, e dice esattamente dove e perché il metodo finisce.</div>`}
]},

/* ---------------- 05 · IL SENSO ---------------- */
{ num:'05', title:'Il senso, e le rotte', meta:'cosa lascia in mano, e dove le caratteristiche governano la fisica',
  blocchi:[
  {t:'prosa', title:'Cosa lascia in mano', tag:'sintesi', html:R`
  <p><b>Il punto.</b> Un'equazione alle derivate parziali del primo ordine <b>non è un'equazione alle derivate parziali</b>: è una famiglia di equazioni ordinarie lungo le caratteristiche, e la geometria serve a vederlo. L'unica cosa che si aggiunge rispetto al caso ordinario è la condizione sul dato — che sia assegnato trasversalmente al campo.</p>
  <p><b>E il punto che resta aperto</b>: nel caso quasi-lineare la soluzione può cessare di esistere in tempo finito, e la geometria dice precisamente quando e perché. <b>Non è una patologia matematica</b>: le onde d'urto esistono, e questo è il loro modello più semplice.</p>`},
  {t:'prolessi', title:'Dove riappare questo movimento, nella fisica che farai',
   oggetto:R`<b>Le caratteristiche</b>: le curve lungo cui l'informazione viaggia, e su cui una PDE diventa una ODE.`,
   rotte:[
    {dove:'Fluidodinamica', txt:R`L'equazione di Burgers è il modello delle <b>onde d'urto</b>: in un gas compressibile la velocità del suono dipende dalla densità, le perturbazioni forti raggiungono quelle deboli, e il fronte si irripidisce fino a diventare una discontinuità. <b>Il boom sonico è questo conto.</b>`},
    {dove:'Relativita', txt:R`Le caratteristiche dell'equazione delle onde formano il <b>cono di luce</b>: sono le curve lungo cui l'informazione si propaga, e la loro struttura definisce la causalità. <b>«Non si può superare la velocità della luce» è un'affermazione sulle caratteristiche di una PDE.</b>`},
    {dove:'Meccanica<br>analitica', txt:R`L'equazione di <b>Hamilton-Jacobi</b> è del primo ordine, e le sue caratteristiche sono le traiettorie del sistema nello spazio delle fasi: risolverla equivale a integrare il moto. È il ponte fra l'ottica geometrica e la meccanica, e da lì all'equazione di Schrödinger.`},
    {dove:'Traffico<br>e reti', txt:R`Il modello di Lighthill-Whitham per il traffico e' un'equazione di questo tipo, e lo shock e' letteralmente <b>l'ingorgo</b>: l'onda di frenata che risale la colonna di auto e' una caratteristica che viaggia all'indietro.`}
   ],
   domanda:R`Il metodo delle caratteristiche funziona per il primo ordine e si ferma lì: per il secondo ordine si possono ancora definire le caratteristiche, ma non risolvono l'equazione — la classificano. <b>Domanda che porti avanti:</b> perché la distinzione fra ellittico, parabolico e iperbolico coincide con «quante caratteristiche reali ci sono»? La risposta è che le caratteristiche sono le direzioni lungo cui <i>non</i> si può propagare il dato, e quindi la loro esistenza decide se un problema è ben posto con dati iniziali (iperbolico: onde), con dati al bordo (ellittico: equilibrio), o con una combinazione (parabolico: diffusione). <b>La stessa geometria che qui risolve, là classifica</b> — e dice quale problema ha senso porre.`}
]}

];

function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
    else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
    else if(b.t==='prolessi') m.appendChild(sectionProlessi(b));
    else if(b.t==='reveal')m.appendChild(sectionReveal(b.title,b.tag,b.steps));
    else if(b.t==='esercizio') m.appendChild(sectionEsercizio(b));
    else if(b.t==='collaudo')  m.appendChild(sectionCollaudo(b.title,b.items));
    else if(b.t==='plot')      m.appendChild(sectionPlot(b));
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}

/* deep-link: gd-16-equazioni-primo-ordine.html#03 apre direttamente la tappa 03 */
window.addEventListener('DOMContentLoaded', function(){
  var h=(location.hash||'').replace('#','');
  showTappa(byId[h]?h:'00');
});
window.addEventListener('hashchange', function(){
  var h=(location.hash||'').replace('#','');
  if(byId[h]) showTappa(h);
});
</script>
