<!-- La barra di casa: un nucleo senza di lei e' un vicolo cieco - si arrivava qui
     e l'unica uscita era il tasto indietro del browser, che dall'app installata
     sulla schermata Home non c'e'. Porta anche i due movimenti accanto, letti

<script defer src="../nav-tengri.js"></script>

<style>
  :root{
    --bg:#0e1117; --panel:#161b22; --panel2:#1c232d; --border:#2b333d;
    --txt:#eef3f8; --muted:#b9c4d1; --accent:#4c8dff; --accent2:#8fb0ff;
    --ok:#2ea043; --okbg:#10331b; --warn:#d8a13a; --warnbg:#332a10;
    --gram:#5eead4; --grambg:#0f2a26;
    --pro:#b98cff; --probg:#1a1430; --proline:#2a2247; --proedge:#3a2d5c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    font-size:17px;line-height:1.55;}
  a{color:var(--accent2);}
  .banner{background:var(--panel2);border-bottom:1px solid var(--border);color:var(--muted);
    font-size:.8rem;font-weight:600;text-align:center;padding:8px 12px;letter-spacing:.3px;}
  .banner b{color:var(--accent2);}
  .shell{display:flex;max-width:1180px;margin:0 auto;align-items:flex-start;}

  /* ---- SIDEBAR ---- */
  .sidebar{width:280px;flex:0 0 280px;padding:20px 12px 60px;position:sticky;top:0;
    max-height:100vh;overflow-y:auto;border-right:1px solid var(--border);}
  .sidebar h2{font-size:.72rem;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);
    margin:18px 8px 8px;}
  .navitem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:none;
    background:transparent;color:var(--txt);padding:9px 10px;border-radius:8px;cursor:pointer;
    font-size:.9rem;transition:.12s;border:1px solid transparent;}
  .navitem:hover{background:var(--panel2);}
  .navitem.active{background:#13233f;border-color:var(--accent);color:#fff;}
  .navitem .dot{width:7px;height:7px;border-radius:50%;background:transparent;flex:0 0 7px;
    border:1px solid var(--border);}
  .navitem.seen .dot{background:var(--ok);border-color:var(--ok);}
  .navitem .nx{color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto;}

  /* ---- MAIN ---- */
  .main{flex:1 1 auto;min-width:0;padding:24px 30px 90px;max-width:860px;}
  h1{font-size:1.5rem;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:.92rem;margin:0 0 18px;}
  .sfhead{border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:8px;}
  .sfhead h1{font-size:1.55rem;}
  .meta{color:var(--muted);font-size:.82rem;margin-top:6px;}

  .section{margin:26px 0;}
  .section > h3{font-size:1.02rem;color:var(--accent2);margin:0 0 10px;
    display:flex;align-items:center;gap:10px;}
  .section > h3 .tag{font-size:.66rem;font-weight:700;letter-spacing:.4px;background:var(--panel2);
    border:1px solid var(--border);color:var(--muted);padding:2px 8px;border-radius:20px;
    text-transform:uppercase;}
  /* --- blocchi figura --- */
  .section > h3 .tag.plottag{background:#101f2e;border-color:#1f3c57;color:#7ab8e0;}
  .plot-intro{color:var(--muted);font-size:.95rem;margin:0 0 12px;}
  .plot-row{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;
    background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;}
  .plot-row.due .plot-box{flex:1 1 300px;min-width:280px;}
  .plot-box{max-width:560px;}
  .plot-leggi{margin-top:10px;background:var(--panel2);border:1px solid var(--border);
    border-left:3px solid #4a8fc7;border-radius:0 10px 10px 0;padding:11px 14px;
    font-size:.93rem;color:var(--muted);}
  .plot-leggi b{color:#7ab8e0;}
  .plot-err{color:#ff6b6b;font-size:.85rem;}
  .open-body{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
  .open-body p:first-child{margin-top:0;} .open-body p:last-child{margin-bottom:0;}
  .open-body ul{margin:.4em 0;padding-left:1.2em;} .open-body li{margin:.35em 0;}

  .note{background:var(--panel2);border-left:3px solid var(--muted);border-radius:6px;
    padding:9px 12px;margin:12px 0;font-size:.9rem;color:var(--muted);}
  .note b{color:#ff9d6b;}
  .note.warn{background:var(--warnbg);border-left-color:var(--warn);color:#e0b85a;}
  .note.warn b{color:#f0c25a;}

  /* ---- GRAMMATICA ---- */
  .gramwrap{background:var(--grambg);border:1px solid #1f4d47;border-radius:12px;padding:6px 6px;}
  table.gramtab{border-collapse:collapse;width:100%;font-size:.92rem;}
  table.gramtab td{padding:9px 12px;vertical-align:top;border-bottom:1px solid #17332e;}
  table.gramtab tr:last-child td{border-bottom:none;}
  table.gramtab td.gs{white-space:nowrap;color:var(--gram);width:1%;
    border-right:1px solid #17332e;font-variant-numeric:tabular-nums;}
  .section > h3 .tag.gramtag{background:var(--grambg);border-color:#1f4d47;color:var(--gram);}

  /* ---- STRUMENTI (repertorio condiviso: la scheda si apre DENTRO la frase) ----
     Nessun accento nuovo: riusa il verde della grammatica, perche' uno strumento
     richiamato e' grammatica gia' spiegata altrove, non una quinta specie di blocco. */
  .str{color:var(--gram);border-bottom:1px dashed var(--gram);cursor:pointer;}
  .str:hover{background:var(--grambg);}
  .str::after{content:"\2666";font-size:.62em;vertical-align:.42em;margin-left:2px;opacity:.8;}
  .str.aperto::after{content:"\2715";}
  .str.rotto{color:#ff6b6b;border-bottom-color:#ff6b6b;cursor:help;}
  /* la scheda e' uno SPAN in display:block, non un div: i rimandi cadono dentro
     <p>, <li> e celle di tabella, dove un div e' HTML illegale. */
  .strcard{display:block;margin:10px 0;background:var(--grambg);border:1px solid #1f4d47;
    border-left:3px solid var(--gram);border-radius:0 10px 10px 0;padding:10px 14px;font-size:.9rem;}
  .strcard .sh{display:block;font-size:.66rem;font-weight:700;letter-spacing:.5px;
    text-transform:uppercase;color:var(--gram);margin-bottom:7px;}
  .strcard .sr{display:block;margin:5px 0;}
  .strcard .sk{color:var(--gram);font-weight:600;}

  /* ---- PROLESSI (preannuncio fisico) ---- */
  .prowrap{background:var(--probg);border:1px solid var(--proedge);border-radius:12px;padding:4px 4px 8px;}
  .prohead{padding:11px 14px 4px;color:var(--pro);font-size:.72rem;font-weight:700;letter-spacing:.7px;
    text-transform:uppercase;}
  .pro-oggetto{padding:2px 14px 11px;color:var(--muted);font-size:.92rem;border-bottom:1px solid var(--proline);
    margin-bottom:2px;} .pro-oggetto b{color:var(--txt);}
  table.protab{border-collapse:collapse;width:100%;font-size:.92rem;}
  table.protab td{padding:10px 12px;vertical-align:top;border-bottom:1px solid var(--proline);}
  table.protab tr:last-child td{border-bottom:none;}
  table.protab td.pd{white-space:nowrap;color:var(--pro);width:1%;font-weight:700;font-size:.78rem;
    letter-spacing:.3px;text-transform:uppercase;border-right:1px solid var(--proline);line-height:1.3;}
  .pro-domanda{margin:8px 8px 2px;background:#140d26;border:1px solid var(--proedge);
    border-left:3px solid var(--pro);border-radius:8px;padding:10px 14px;font-size:.92rem;}
  .pro-domanda b{color:var(--pro);}
  .section > h3 .tag.protag{background:var(--probg);border-color:var(--proedge);color:var(--pro);}

  /* ---- REVEAL ---- */
  .rsteps{display:flex;flex-direction:column;gap:12px;}
  .rstep{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 18px;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .rlabel{font-size:.7rem;font-weight:700;letter-spacing:.4px;color:var(--accent);
    text-transform:uppercase;margin-bottom:8px;}
  .rstep p:first-of-type{margin-top:0;} .rstep p:last-child{margin-bottom:0;}
  .rstep ul{margin:.4em 0;padding-left:1.2em;}
  .testo{background:#13233f;border:1px solid #2b4877;border-radius:12px;padding:14px 18px;margin-bottom:14px;}
  .testo .src{display:block;font-size:.74rem;font-style:italic;color:var(--accent2);margin-bottom:8px;
    text-transform:uppercase;letter-spacing:.3px;}
  .esame-nota{font-size:.9rem;color:var(--muted);font-style:italic;margin-top:12px;padding-left:12px;
    border-left:3px solid var(--border);}

  .reveal-btn{background:var(--accent);color:#fff;border:none;padding:11px 18px;border-radius:10px;
    font-size:.95rem;font-weight:600;cursor:pointer;margin-top:14px;transition:.12s;}
  .reveal-btn:hover:not(:disabled){background:var(--accent2);}
  .reveal-btn.small{padding:7px 14px;font-size:.85rem;margin-top:0;background:var(--panel2);
    color:var(--accent2);border:1px solid var(--border);}
  .reveal-btn.small:hover:not(:disabled){border-color:var(--accent);}
  .reveal-btn:disabled,.reveal-btn.done{background:var(--panel2);color:var(--muted);
    border:1px solid var(--border);cursor:default;}

  /* ---- COLLAUDO ---- */
  .collaudo-item{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 18px;margin-bottom:12px;}
  .cq{margin-bottom:10px;}
  .ca{margin-top:12px;background:var(--okbg);border:1px solid #235c33;border-radius:8px;
    padding:10px 14px;font-size:.94rem;}
  .ca b{color:#5fd980;}

  /* ---- PREV / NEXT ---- */
  .prevnext{display:flex;justify-content:space-between;gap:12px;margin-top:40px;
    border-top:1px solid var(--border);padding-top:20px;}
  .pnbtn{flex:1 1 0;background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:12px 16px;cursor:pointer;color:var(--txt);text-align:left;transition:.14s;font:inherit;}
  .pnbtn:hover{border-color:var(--accent);background:var(--panel2);}
  .pnbtn.next{text-align:right;}
  .pnbtn .k{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .pnbtn .t{font-weight:600;color:var(--accent2);}
  .pnbtn:disabled{opacity:.35;cursor:default;border-color:var(--border);background:var(--panel);}

  code{background:var(--panel2);border:1px solid var(--border);border-radius:5px;
    padding:1px 5px;font-size:.85em;color:var(--accent2);}
  .katex{font-size:1.02em;color:var(--txt);} .katex-display{margin:.5em 0;overflow-x:auto;overflow-y:hidden;}

  @media(max-width:860px){
    .shell{flex-direction:column;}
    .sidebar{width:100%;flex:none;position:static;max-height:none;border-right:none;
      border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:4px;}
    .sidebar h2{width:100%;} .navitem{width:auto;}
    .main{padding:20px 16px 80px;}
  }
</style>
</head>

<script>
"use strict";
const R = String.raw;

function typeset(el){
  if(el && window.renderMathInElement){
    try{ renderMathInElement(el,{delimiters:[
      {left:'$$',right:'$$',display:true},

}
function elFromHTML(html){ var d=document.createElement('div'); d.innerHTML=html; return d; }

/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un
   rimando scritto nella prosa:

       <span class="str" data-str="serie-geometrica">la serie geometrica</span>

   Le schede citate da questo nucleo sono cucite qui sotto dal montaggio
   (assembla-nucleo.js): la pagina resta autosufficiente — niente fetch,
   niente sottocartelle da pubblicare — e un rimando a una scheda che non
   esiste FERMA la costruzione invece di arrivare in pagina rotto.
   Apertura: lo stesso gesto del collaudo (si clicca, il pannello compare,
   si typeset una volta sola), portato dentro la frase.
   =================================================================== */
var CORSO = 'meccanica-quantistica';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["prodotto-tensoriale"] = {"nome":"Prodotto tensoriale","riga":"Lo spazio di due sistemi e' $\\mathcal H_1\\otimes\\mathcal H_2$, di dimensione pari al PRODOTTO delle due e non alla somma, con base fatta dai prodotti degli elementi delle due basi.","serve":"E' il motivo per cui la meccanica quantistica non e' una teoria di particelle indipendenti messe accanto. La dimensione cresce come il prodotto, quindi la stragrande maggioranza degli stati non si scrive come prodotto di due stati singoli: quelli che non si scrivono cosi' sono gli stati entangled, e sono la regola, non l'eccezione.","esempio":"Due spin un mezzo: ogni fattore ha dimensione due, il prodotto ne ha $2\\cdot2=4$. Gli stati fattorizzati sono parametrizzati da due punti sulla sfera di Bloch, cioe' da quattro parametri reali, mentre lo spazio totale ne ha $2\\cdot4-2=6$: restano due dimensioni di stati che non si fattorizzano, e il singoletto e' uno di quelli.","debito":"la matrice densita' ridotta e la quantificazione dell'entanglement (entropia di von Neumann) non stanno qui: questa scheda da' la struttura, non la misura.","controllo":[{"tipo":"uguale","sinistra":"2*2","vale":"4","dove":"esempio","appare":"2\\cdot2=4"},{"tipo":"uguale","sinistra":"2*4-2","vale":"6","dove":"esempio","appare":"2\\cdot4-2=6"}],"qui":{},"pieno":null};
STRUM["determinante-di-slater"] = {"nome":"Determinante di Slater","riga":"Per $N$ fermioni in $N$ stati di singola particella lo stato antisimmetrico e' il determinante della matrice $[\\phi_i(x_j)]$ diviso per $\\sqrt{N!}$.","serve":"E' il modo di scrivere uno stato di piu' fermioni che porta dentro di se' il principio di esclusione: un determinante con due righe uguali vale zero, quindi due fermioni nello stesso stato danno automaticamente lo stato nullo. Pauli non va imposto a parte, e' una proprieta' del determinante.","esempio":"Per due fermioni resta la differenza fra i due prodotti incrociati, divisa per $1/\\sqrt2$: ponendo i due stati uguali i termini si cancellano. Il fattore di normalizzazione per tre particelle diventa $1/\\sqrt6$.","debito":"il caso bosonico — il permanente, e la simmetrizzazione con i suoi fattori di molteplicita' — e la seconda quantizzazione non stanno in questa scheda.","controllo":[{"tipo":"uguale","sinistra":"1/sqrt(factorial(2))","vale":"1/sqrt(2)","dove":"esempio","appare":"1/\\sqrt2"},{"tipo":"uguale","sinistra":"1/sqrt(factorial(3))","vale":"1/sqrt(6)","dove":"esempio","appare":"1/\\sqrt6"},{"tipo":"uguale","sinistra":"Matrix([[a,b],[a,b]]).det()","vale":"0","ipotesi":{"a":"real","b":"real"},"dove":"serve","appare":"due righe uguali vale zero"}],"qui":{},"pieno":null};
STRUM["commutatore"] = {"nome":"Commutatore","riga":"$[\\hat A,\\hat B]=\\hat A\\hat B-\\hat B\\hat A$, antisimmetrico, con la regola di Leibniz $[\\hat A,\\hat B\\hat C]=[\\hat A,\\hat B]\\hat C+\\hat B[\\hat A,\\hat C]$ e la relazione canonica $[\\hat x,\\hat p]=i\\hbar$.","serve":"E' la misura di quanto due operazioni dipendano dall'ordine, e qui l'ordine e' fisica: due osservabili che non commutano non hanno una base comune di autostati, quindi non si misurano insieme con precisione arbitraria. Quasi ogni conto che sembra magico — l'algebra del momento angolare, gli operatori di salita e discesa, il teorema di Ehrenfest — e' una manipolazione di commutatori fatta con quelle regole e nient'altro.","esempio":"Dalla regola di Leibniz, $[\\hat x,\\hat p^{2}]=[\\hat x,\\hat p]\\hat p+\\hat p[\\hat x,\\hat p]=2i\\hbar\\hat p$. E' il conto che fa uscire il teorema di Ehrenfest: la meccanica classica ricompare come relazione fra valori medi, e ricompare perche' quel commutatore vale proprio $2i\\hbar\\hat p$.","debito":"l'identita' di Jacobi si enuncia e non si dimostra; la corrispondenza fra commutatore e parentesi di Poisson — che e' l'idea di Dirac e non un'analogia decorativa — sta in mq-07, e li' va letta per intero.","controllo":[{"tipo":"uguale","sinistra":"I*hbar*p + p*I*hbar","vale":"2*I*hbar*p","ipotesi":{"hbar":"positive","p":"real"},"dove":"esempio","appare":"2i\\hbar\\hat p"},{"tipo":"simbolico","dove":"riga","appare":"[\\hat x,\\hat p]=i\\hbar","perche":"e' la relazione di commutazione canonica, il POSTULATO da cui discende il resto della teoria: non si dimostra, si assume, ed e' cio' che separa la meccanica quantistica dalla classica"}],"qui":{},"pieno":null};
STRUM["proiettore-ortogonale"] = {"nome":"Proiettore ortogonale","riga":"Un proiettore ortogonale e' un operatore $\\hat P$ che soddisfa due condizioni insieme: $\\hat P^2=\\hat P$ (idempotenza — proiettare due volte equivale a proiettare una volta) e $\\hat P^{\\dagger}=\\hat P$ (autoaggiuntezza, che rende la proiezione perpendicolare al sottospazio invece che obliqua).","serve":"E' il mattone di tutta la teoria della misura: $\\hat P=|\\psi\\rangle\\langle\\psi|$ su un ket normalizzato e' l'osservabile «lo stato e' $|\\psi\\rangle$?» con esiti $1$ e $0$, e il suo valor medio e' la probabilita'. L'identita' si scrive come somma di proiettori, $\\mathbb 1=\\sum_i\\hat P_i$, ed e' con questa che si cambia base e si decompone un'osservabile.","esempio":"Da $|\\psi\\rangle=(\\tfrac35,\\tfrac45)$ normalizzato si costruisce $\\hat P=|\\psi\\rangle\\langle\\psi|$ con entrate $\\tfrac{9}{25},\\tfrac{12}{25},\\tfrac{16}{25}$. L'elemento $(1,1)$ di $\\hat P^2$ vale $(\\tfrac{9}{25})^2+(\\tfrac{12}{25})^2=\\tfrac{9}{25}$, cioe' $\\hat P^2=\\hat P$; la traccia e' $\\tfrac{9}{25}+\\tfrac{16}{25}=1$, come per ogni proiettore di rango uno.","debito":"la decomposizione spettrale di un operatore autoaggiunto con spettro continuo in una famiglia di proiettori $E(\\lambda)$ (la misura spettrale) sta fuori da qui: si usa il caso discreto, dove i proiettori sono $|i\\rangle\\langle i|$.","controllo":[{"tipo":"simbolico","dove":"esempio","appare":"\\hat P^2=\\hat P","perche":"e' l'idempotenza, meta' della definizione di proiettore: un'identita' fra operatori, non un conto numerico. Il caso concreto che la sostiene e' l'entrata $(1,1)$ asserita qui sotto, dove i numeri ci sono"},{"tipo":"uguale","sinistra":"(Rational(9,25))**2+(Rational(12,25))**2","vale":"9/25","dove":"esempio","appare":"(\\tfrac{9}{25})^2+(\\tfrac{12}{25})^2=\\tfrac{9}{25}"},{"tipo":"uguale","sinistra":"Rational(9,25)+Rational(16,25)","vale":"1","dove":"esempio","appare":"\\tfrac{9}{25}+\\tfrac{16}{25}=1"}],"qui":{},"pieno":null};
STRUM["traccia"] = {"nome":"Traccia di un operatore","riga":"La traccia e' la somma degli elementi diagonali, $\\operatorname{tr}\\hat A=\\sum_i\\langle i|\\hat A|i\\rangle$, e non dipende dalla base ortonormale scelta perche' e' invariante per permutazione ciclica: $\\operatorname{tr}(\\hat A\\hat B)=\\operatorname{tr}(\\hat B\\hat A)$, da cui $\\operatorname{tr}(\\hat U^{\\dagger}\\hat A\\hat U)=\\operatorname{tr}\\hat A$.","serve":"E' il modo di estrarre un numero da un operatore senza privilegiare una rappresentazione. Il valor medio di un'osservabile su uno stato si scrive $\\langle A\\rangle=\\operatorname{tr}(\\rho\\hat A)$ con $\\rho=|\\psi\\rangle\\langle\\psi|$, e questa forma — a differenza di $\\langle\\psi|\\hat A|\\psi\\rangle$ — vale identica per gli stati misti, dove $\\rho$ non e' piu' un proiettore: e' la porta verso la matrice densita' e la decoerenza.","esempio":"Per $A=\\begin{pmatrix}1&2\\\\3&4\\end{pmatrix}$ e $B=\\begin{pmatrix}0&1\\\\1&0\\end{pmatrix}$, pur essendo $AB\\neq BA$, le due tracce coincidono: $AB=\\begin{pmatrix}2&1\\\\4&3\\end{pmatrix}$ da' $\\operatorname{tr}(AB)=2+3=5$, mentre $BA=\\begin{pmatrix}3&4\\\\1&2\\end{pmatrix}$ da' $\\operatorname{tr}(BA)=3+2=5$. La traccia di un proiettore di rango uno vale $1$, e in generale la traccia di un proiettore e' la dimensione del sottospazio su cui proietta.","debito":"la traccia di un operatore in dimensione infinita esiste solo per la classe degli operatori a traccia (totalmente continui), e la costruzione rigorosa — $\\operatorname{tr}(\\hat A^{\\dagger}\\hat A)=\\sum_\\mu\\|\\hat A\\phi_\\mu\\|^2$ indipendente dalla base, von Neumann cap. II.11 — qui si cita. Si lavora col caso in cui la somma converge.","controllo":[{"tipo":"uguale","sinistra":"(Matrix([[1,2],[3,4]])*Matrix([[0,1],[1,0]])).trace()","vale":"5","dove":"esempio","appare":"\\operatorname{tr}(AB)=2+3=5"},{"tipo":"uguale","sinistra":"(Matrix([[0,1],[1,0]])*Matrix([[1,2],[3,4]])).trace()","vale":"5","dove":"esempio","appare":"\\operatorname{tr}(BA)=3+2=5"},{"tipo":"uguale","sinistra":"Matrix([[1,2],[3,4]])*Matrix([[0,1],[1,0]])","vale":"Matrix([[2,1],[4,3]])","dove":"esempio","appare":"AB=\\begin{pmatrix}2&1\\\\4&3\\end{pmatrix}"},{"tipo":"uguale","sinistra":"Matrix([[0,1],[1,0]])*Matrix([[1,2],[3,4]])","vale":"Matrix([[3,4],[1,2]])","dove":"esempio","appare":"BA=\\begin{pmatrix}3&4\\\\1&2\\end{pmatrix}"}],"qui":{},"pieno":null};
STRUM["simmetrie"] = {"nome":"Simmetrie","riga":"L'insieme delle trasformazioni che lasciano identica la sorgente, e che perciò devono lasciare identico anche il campo che ne nasce.","serve":"È il ragionamento che decide la FORMA del campo prima di calcolarlo, e senza il quale la legge di Gauss non serve a niente: Gauss dà un solo numero — il flusso totale — e da un numero si ricava un campo soltanto se si sa già in che direzione punta e da quali variabili dipende. L'argomento ha una forma sola: se una trasformazione lascia identica la distribuzione di carica, lascia identico il campo; quindi ogni componente che quella trasformazione cambierebbe deve essere nulla, e ogni variabile che essa sposta non può comparire.","esempio":"Per un filo infinito uniformemente carico, la traslazione lungo il filo e la rotazione attorno a esso lasciano la carica identica: $\\mathbf E$ non può dipendere né da $z$ né dall'angolo. La riflessione nel piano perpendicolare al filo manderebbe $E_z$ in $-E_z$ lasciando uguale la sorgente, quindi $E_z=0$; resta la sola componente radiale $E_r(r)$. Solo a quel punto il cilindro coassiale è la superficie giusta, e Gauss dà $E_r\\cdot 2\\pi rL=\\dfrac{\\lambda L}{\\varepsilon_0}$, da cui $E_r=\\dfrac{\\lambda}{2\\pi\\varepsilon_0 r}$.","qui":{"meccanica-quantistica":{"serve":"Qui l'argomento di simmetria non decide la forma di un campo: decide la forma degli OPERATORI, ed è il modo in cui questo corso costruisce la teoria. Lo schema è lo stesso — una trasformazione che lascia identica la situazione fisica deve lasciare identica la descrizione — ma la conseguenza è più forte: ogni trasformazione di simmetria continua è realizzata da un operatore unitario, ogni operatore unitario continuo è l'esponenziale di un generatore autoaggiunto, e quel generatore è una quantità conservata. Impulso, momento angolare ed energia non si postulano: sono i generatori delle traslazioni, delle rotazioni e delle traslazioni temporali.","esempio":"Lo spazio è omogeneo, quindi traslare un sistema isolato non ne cambia la fisica: $\\hat U(a)=e^{-ia\\hat P/\\hbar}$ deve commutare con $\\hat H$. Al primo ordine in $a$ questo dà $[\\hat P,\\hat H]=0$, e quindi $\\dfrac{d}{dt}\\langle \\hat P\\rangle=0$: l'omogeneità dello spazio è la conservazione dell'impulso, e il passaggio da una all'altra è di due righe."}},"debito":"nessun nucleo del percorso tratta l'argomento di simmetria come strumento a sé: qui c'è la forma dell'argomento e non la sua giustificazione, che è di teoria dei gruppi e sta fuori dal percorso costruito finora. Quello che il percorso copre è il pezzo di destra — l'integrale di flusso, nel nucleo 03 tappa 04 — non il pezzo di sinistra che decide quale superficie scegliere.","controllo":[{"tipo":"uguale","sinistra":"(lam/(2*pi*e0*r))*2*pi*r*L","vale":"lam*L/e0","dove":"esempio","appare":"\\dfrac{\\lambda L}{\\varepsilon_0}"}]};
STRUM["ordini-di-grandezza"] = {"nome":"Ordini di grandezza","riga":"Stimare una quantità alla potenza di dieci giusta: si tiene una cifra significativa, si sommano e si sottraggono gli esponenti, e si controlla che l'unità del risultato sia quella che si voleva.","serve":"A sapere se un risultato è plausibile prima di averlo calcolato con precisione, e ad accorgersi di un errore di impostazione quando c'è ancora tempo per rimediare. In astrofisica non è una comodità ma il modo normale di ragionare, per due ragioni: le grandezze in gioco vanno da $10^{-36}$ kg a $10^{53}$ kg e nessuna intuizione le copre, e i dati osservativi sono noti al dieci o al venti per cento, quindi una cifra significativa è spesso tutto ciò che il problema contiene davvero. Il controllo che smaschera più errori non è sul numero, è sull'**unità**: un conto che dovrebbe dare una densità e dà dei kg è sbagliato nell'impostazione, e nessun affinamento dell'aritmetica lo salverà. La seconda regola è il confronto con un termine noto — l'acqua per una densità, il Sole per una massa o una luminosità, il parsec per una distanza galattica — perché un numero senza metro non dice niente.","esempio":"Densità media del Sole, dalle due sole quantità stampate in calce al foglio d'esame, $M_\\odot=1{,}989\\cdot10^{30}$ kg e $R_\\odot=6{,}957\\cdot10^{8}$ m: $\\rho=\\dfrac{3M_\\odot}{4\\pi R_\\odot^{3}}=1410\\ \\mathrm{kg/m^3}$. Il confronto è immediato e istruttivo: è quasi una volta e mezza l'acqua, cioè il Sole è in media meno denso della Terra — una stella non è un sasso grande, è un gas tenuto insieme dal proprio peso.","pieno":{"file":"as-01-la-scala-del-cosmo.html","tappa":"01","come":"la gerarchia delle strutture cosmiche letta come scala di ordini di grandezza, e il tempo di luce come secondo asse della stessa tabella"},"controllo":[{"tipo":"numero","espr":"3*1.989e30/(4*pi*(6.957e8)**3)","vale":"1410","dove":"esempio","appare":"1410"}]};

function schedaHTML(s){

  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';

}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

/* ---------------- 00 · DI COSA PARLA QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Di cosa parla questo movimento', meta:'Meccanica Quantistica · voce Q.25 · la chiusura del corso · due particelle identiche non sono due particelle uguali · lo scambio come simmetria · un postulato che le fonti presentano in modi incompatibili · la domanda d esame su spin e spazio intrecciati',
  blocchi:[
  {t:'prosa', title:'Uguali e identiche', tag:'architettura', html:R`
  <p>Due palle da biliardo nuove possono essere uguali in tutto quello che si misura, e restano due palle: si può seguire ciascuna lungo la sua traiettoria e dire quale delle due è finita in buca. Due elettroni sono identici in un senso più forte, e Griffiths lo dice con una frase che non si dimentica: <i>«It&rsquo;s not just that we don&rsquo;t happen to know which electron is which; God doesn&rsquo;t know which is which, because there is no such thing as &ldquo;this&rdquo; electron, or &ldquo;that&rdquo; electron; all we can legitimately speak about is &ldquo;an&rdquo; electron»</i>. La meccanica quantistica traduce questa frase in una richiesta precisa sullo spazio degli stati: il <span class="str" data-str="prodotto-tensoriale">prodotto tensoriale</span> di due copie dello spazio di una particella contiene vettori che non descrivono nessuno stato fisico, e lo spazio giusto è un suo sottospazio, simmetrico o antisimmetrico per scambio.</p>
  <p>La mappa del corso misura l&rsquo;argomento in 26 scritti su 47 e lo chiama la chiusura naturale del corso, perché usa tutto: il prodotto tensoriale, la composizione degli spin, gli spettri dell&rsquo;oscillatore e della buca. La domanda tipica è <i>«si determinino energie e degenerazioni dei primi livelli di due particelle identiche di spin $s$»</i>, e richiede di intrecciare la parte spaziale con quella di spin. È il punto in cui si sbaglia, e il movimento lo svolge con spin diversi.</p>`},
  {t:'prosa', title:'Come è fatto il movimento', tag:'architettura', html:R`
  <p><b>Il primo blocco è il principio.</b> La tappa 01 dice perché la meccanica quantistica non può seguire le particelle e che cosa ne segue per le osservabili. La 02 costruisce l&rsquo;operatore di scambio e distingue, con Ballentine, tre gradi di identità sempre più forti. La 03 è il punto in cui le fonti divergono di più: se la regola che sceglie gli stati simmetrici o antisimmetrici si dimostri o si postuli, e su che cosa si fondi. Picasso la ricava dallo spettro dell&rsquo;elio, Landau e Shankar la deducono, Sakurai e Griffiths la postulano, Ballentine dimostra che le deduzioni correnti non reggono.</p>
  <p><b>Il secondo blocco è la costruzione.</b> La 04 passa a $N$ particelle, al <span class="str" data-str="determinante-di-slater">determinante di Slater</span> e ai conteggi degli stati, con la statistica di Bose come la presenta Dirac. La 05 intreccia spin e spazio: due spin un mezzo, due spin uno, due spin qualsiasi con la regola di Landau, e le conseguenze per l&rsquo;idrogeno molecolare e per le particelle alfa. La 06 calcola la «forza» di scambio e la densità di scambio, e dice quando la simmetrizzazione si può ignorare.</p>
  <p><b>Il terzo blocco sono le applicazioni.</b> La 07 è l&rsquo;atomo di elio: lo stato fondamentale, i livelli eccitati, l&rsquo;integrale di scambio, il paraelio e l&rsquo;ortoelio. La 08 introduce gli operatori di creazione e distruzione e le loro relazioni di anticommutazione, e mostra in quattro dimensioni come il principio di Pauli diventi un&rsquo;identità fra matrici. La 09 è l&rsquo;urto di particelle identiche. Le tappe 10 e 11 risolvono due compiti, con fermioni di spin un mezzo e bosoni di spin uno; la 12 confronta le fonti e chiude con le domande d&rsquo;orale.</p>`}
]},
/* ---------------- 01 · NON SI PUO SEGUIRE UNA PARTICELLA ---------------- */
{ num:'01', title:'Perché non si può seguire una particella, e che cosa ne segue per le osservabili', meta:'il biliardo di Shankar e le storie · le traiettorie di Landau · il rosso e il blu di Sakurai · la degenerazione di scambio · Picasso e le monete nuove di zecca · solo le funzioni simmetriche sono osservabili · lo spin della particella che sta qui',
  blocchi:[
  {t:'prosa', title:'Il caso classico', tag:'indistinguibilità', html:R`
  <p>Shankar parte da un tavolo da biliardo con quattro buche e due palle identiche vicino alle buche 1 e 2. Due fisici fanno previsioni diverse su quale palla finirà nella buca 3; al tempo $T$ si trova la palla 1 nella buca 3, e si dice che il primo ha ragione. Un osservatore che entra solo al tempo $T$ non potrebbe distinguere le due previsioni: le due configurazioni differiscono per lo scambio di due oggetti identici. <i>«What do we know about the balls (that allows us to make a distinction between them and hence the two outcomes), that the newcomer does not? The answer of course is — their histories»</i>. E la storia non richiede nessun osservatore presente: <i>«one imagines in classical physics the fictitious observer who sees everything and disturbs nothing; if he can make the distinction, the distinction exists»</i>.</p>
  <p>Landau dice lo stesso in termini di individualità: in meccanica classica le particelle identiche <i>«non perdono però una loro &laquo;individualità&raquo;: si può immaginare di &laquo;numerare&raquo; in un certo istante le particelle di un sistema fisico dato e seguire poi il moto di ciascuna di esse lungo la sua traiettoria»</i>. Sakurai propone di colorarle: <i>«for bookkeeping purposes, you may color one of them blue and the other red»</i>. Gli appunti di Iannelli lo dicono con un&rsquo;espressione che hanno da un loro riferimento: in meccanica classica, date le condizioni iniziali, <i>«sapremo in ogni momento chi è pippo e chi è pluto»</i>.</p>`},
  {t:'reveal', title:'Il caso quantistico', tag:'indistinguibilità', steps:[
   {label:'Niente traiettorie', body:R`
   <p>In meccanica quantistica le storie non esistono. Landau: <i>«in virtù del principio d&rsquo;indeterminazione, il concetto di traiettoria dell&rsquo;elettrone perde completamente significato [...] Così, nella meccanica quantistica non esiste, in linea di principio, alcuna possibilità di seguire separatamente ciascuna delle particelle identiche e, quindi, di distinguerle»</i>. Sakurai aggiunge due ragioni più precise: non si può etichettare una particella, <i>«because we cannot specify more than a complete set of commuting observables for each of the particles»</i>, e non si può seguirla, perché <i>«that would entail a position measurement at each instant of time, which necessarily disturbs the system»</i>. Griffiths: <i>«You can&rsquo;t paint an electron red, or pin a label on it, and a detective&rsquo;s observations will inevitably and unpredictably alter its state, raising doubts as to whether the two had perhaps switched places»</i>.</p>`},
   {label:'La degenerazione di scambio', body:R`
   <p>Sakurai ne trae la difficoltà formale. Se una particella è nello stato $|k'\rangle$ e l&rsquo;altra in $|k''\rangle$, i vettori $|k'\rangle|k''\rangle$ e $|k''\rangle|k'\rangle$ sono distinti, e per $k'\neq k''$ ortogonali; misurando si trova $k'$ per una particella e $k''$ per l&rsquo;altra, ma ogni combinazione $c_{1}|k'\rangle|k''\rangle+c_{2}|k''\rangle|k'\rangle$ dà gli stessi risultati. <i>«This is known as exchange degeneracy. Exchange degeneracy presents a difficulty because, unlike the single-particle case, a specification of the eigenvalue of a complete set of observables does not completely determine the state ket. The way nature avoids this difficulty is quite ingenious»</i>. Gli appunti di Pompili, dalle lezioni di Martinelli e Testa, riprendono il passo quasi alla lettera, con il nome italiano: <i>«degenerazione di scambio»</i>.</p>`},
   {label:'Dirac e le transizioni che non si vedono', body:R`
   <p>Dirac apre il capitolo sulle particelle identiche con un&rsquo;osservazione dello stesso tipo, vista dalla dinamica: in meccanica quantistica <i>«possono aver luogo transizioni consistenti nel solo scambio di due particelle identiche fra di loro, e che perciò non possono venir rivelate per mezzo di alcuna osservazione. Una teoria soddisfacente dovrebbe naturalmente considerare due stati sperimentalmente indistinguibili come un unico stato, e negare che abbia avuto luogo una transizione quando si siano scambiate di posto due particelle identiche»</i>. E aggiunge: <i>«Troveremo che è possibile riformulare la teoria in modo che ciò accada»</i>. È il programma che la tappa 02 realizza.</p>`}
  ]},
  {t:'prosa', title:'Che cosa resta misurabile', tag:'osservabili', html:R`
  <p>Picasso trae la conseguenza sulle osservabili prima ancora di introdurre lo scambio. Se pretendessimo che la coordinata $q_{1x}$ fosse un&rsquo;osservabile, <i>«dovremmo dare senso all&rsquo;espressione &ldquo;l&rsquo;elettrone 1&rdquo;»</i>: lo strumento dovrebbe rispondere solo quando vede l&rsquo;elettrone 1. <i>«Ciò è assurdo, perché accettare un tale discorso equivarrebbe ad ammettere che i due elettroni hanno proprietà o interazioni diverse e quindi non sarebbero particelle identiche»</i>. Restano osservabili solo le funzioni delle variabili delle due particelle simmetriche per scambio degli indici, come $q_{1x}+q_{2x}$ o $|q_{1x}-q_{2x}|$.</p>
  <p>Questo non vieta di distinguere due elettroni in stati diversi. Hanno senso le frasi <i>«un elettrone si trova nello stato $|A\rangle$ e l&rsquo;altro nello stato $|B\rangle$»</i>; non ha senso dire <i>«l&rsquo;elettrone 1 si trova nello stato $|A\rangle$ e l&rsquo;elettrone 2 nello stato $|B\rangle$»</i>. Chiamare elettrone 1 quello che sta in $|A\rangle$ funziona finché gli stati restano ortogonali, cosa che l&rsquo;evoluzione o una misura possono far cessare. Ballentine dice lo stesso con lo spin: la componente totale $S_{x}=\sum_{j}s_{x}(j)$ è un&rsquo;osservabile, quella di una particella numerata, $s_{x}(1)$, no; ma <i>«if, for example, there were particles localized in the neighborhoods of $x_{1},x_{2},\dots$, then &ldquo;the spin of the particle located at $x_{1}$&rdquo; would be a permutation-invariant observable. It is only the attachment of labels to distinguish the individual particles themselves that is forbidden»</i>.</p>
  <p>E le palle da biliardo? Picasso se lo chiede esplicitamente, con <i>«le palle da biliardo o le monete nuove di zecca»</i>: la loro identità <i>«si riferisce esclusivamente a proprietà macroscopiche (forma, dimensioni, massa, densità, ...) mentre viene certamente meno a livello di proprietà microscopiche (numero di atomi che compongono i due oggetti, stati dei singoli atomi, ...)»</i>. Due oggetti macroscopici «identici» sono distinguibili in linea di principio, e lo restano perché si trovano sempre in stati di posizione diversi.</p>`},
  {t:'reveal', title:'Lo scambio cambia le etichette delle osservabili', tag:'operatori', steps:[
   {label:'La regola di Sakurai', body:R`
   <p>Sakurai mostra che l&rsquo;operatore di scambio $P_{12}$, definito da $P_{12}|k'\rangle|k''\rangle=|k''\rangle|k'\rangle$, agisce sulle osservabili scambiandone le etichette: se $A_{1}$ e $A_{2}$ sono la stessa osservabile per la particella 1 e per la 2, allora $P_{12}A_{1}P_{12}^{-1}$ è uguale ad $A_{2}$, la (7.1.8). Il conto è un controllo diretto: applicando $P_{12}$ ai due membri di $A_{1}|a'\rangle|a''\rangle=a'|a'\rangle|a''\rangle$ si trova che $P_{12}A_{1}P_{12}^{-1}$ ha autovalore $a'$ sullo stato in cui è la seconda particella ad avere $a'$. Per una particella con due stati e $A=\mathrm{diag}(a,b)$ si verifica sulla matrice $4\times4$: $P_{12}(A\otimes1)P_{12}$ coincide con $1\otimes A$.</p>`},
   {label:'Le osservabili simmetriche', body:R`
   <p>Un&rsquo;osservabile simmetrica, come $A_{1}+A_{2}$ o $A_{1}A_{2}$ o il prodotto scalare $\mathbf S_{1}\cdot\mathbf S_{2}$, <span class="str" data-str="commutatore">commuta</span> con $P_{12}$; un&rsquo;osservabile con un&rsquo;etichetta, come $A_{1}$ da solo, no. La hamiltoniana di due particelle identiche è simmetrica, e Sakurai la scrive con l&rsquo;interazione fra le due e il potenziale esterno separati, $H=\tfrac{\mathbf p_{1}^{2}}{2m}+\tfrac{\mathbf p_{2}^{2}}{2m}+V_{\rm pair}(|\mathbf x_{1}-\mathbf x_{2}|)+V_{\rm ext}(\mathbf x_{1})+V_{\rm ext}(\mathbf x_{2})$. Dirac aggiunge che la simmetria <i>«deve valere indipendentemente da ogni perturbazione che venga eventualmente applicata al sistema. Infatti, qualsiasi quantità dotata di un significato fisico deve essere una funzione simmetrica»</i> delle variabili delle particelle.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`In un compito compare il termine $S_{1z}+S_{2z}$ nella hamiltoniana di due particelle identiche. Si può aggiungere $S_{1z}$ da solo?`,
    a:R`No, se le particelle sono identiche. $S_{1z}$ non commuta con lo scambio, perché $P_{12}S_{1z}P_{12}$ è $S_{2z}$, e un&rsquo;interazione che agisse solo sulla particella 1 distinguerebbe le due particelle. Si possono aggiungere solo combinazioni simmetriche: $S_{1z}+S_{2z}$, $S_{1z}S_{2z}$, $\mathbf S_{1}\cdot\mathbf S_{2}$, $(x_{1}-x_{2})^{2}S_{1z}S_{2z}$. Il compito della tappa 11 ne usa due.`},
   {q:R`L&rsquo;argomento delle traiettorie dimostra che la funzione d&rsquo;onda deve essere simmetrica o antisimmetrica?`,
    a:R`Dimostra che le particelle non si possono distinguere seguendole, e quindi che le osservabili devono essere simmetriche. Che anche gli stati debbano essere simmetrici o antisimmetrici è un passo ulteriore, e Ballentine sostiene che dall&rsquo;indeterminazione non segue: la tappa 03 riporta l&rsquo;argomento.`}
  ]}
]},
/* ---------------- 02 · L OPERATORE DI SCAMBIO E TRE GRADI DI IDENTITA ---------------- */
{ num:'02', title:'L operatore di scambio, e tre gradi di identità sempre più forti', meta:'come Picasso costruisce lo scambio con il teorema di von Neumann e fissa la fase · autovalori piu e meno uno · lo spazio prodotto come somma di simmetrico e antisimmetrico · la simmetria della hamiltoniana · la regola di superselezione · tre particelle e i sottospazi parzialmente simmetrici',
  blocchi:[
  {t:'reveal', title:'Lo scambio di Picasso, e una fase da fissare', tag:'operatori', steps:[
   {label:'Che cosa definisce l operatore', body:R`
   <p>Picasso definisce l&rsquo;operatore di scambio $\Pi$ per due elettroni attraverso la sua azione sulle variabili: $\Pi$ trasforma $\mathbf q_{1}$ in $\mathbf q_{2}$, $\mathbf p_{1}$ in $\mathbf p_{2}$, $\mathbf s_{1}$ in $\mathbf s_{2}$ e viceversa, nel senso che $\Pi\,\mathbf q_{1}\Pi^{-1}$ è $\mathbf q_{2}$ e così via, la (15.28). <i>«L&rsquo;indistinguibilità dei due elettroni si traduce quindi nell&rsquo;affermazione che tutte le osservabili del sistema commutano con $\Pi$»</i>, la (15.29). L&rsquo;operatore esiste ed è unitario per il teorema di von Neumann, perché lo scambio delle variabili conserva le regole di commutazione; ma le (15.28) lo definiscono <i>«solo a meno di un fattore di modulo 1»</i>.</p>`},
   {label:'Fissare la fase', body:R`
   <p>Su un vettore fattorizzato $|A\,B\rangle$ le (15.28) danno $\Pi|A\,B\rangle=e^{i\varphi}|B\,A\rangle$, e Picasso mostra che la fase non dipende dal vettore: confrontando i prodotti scalari di due vettori fattorizzati prima e dopo lo scambio, la differenza delle due fasi deve annullarsi. Allora si può ridefinire $\Pi$ moltiplicandolo per $e^{-i\varphi}$, e ottenere $\Pi|A\,B\rangle=|B\,A\rangle$, la (15.30). Con questa scelta $\Pi^{2}$ è l&rsquo;identità e $\Pi$ è insieme unitario e hermitiano, <i>«pertanto $\Pi$, come l&rsquo;operatore $I$ di inversione spaziale, ha soltanto gli autovalori $\pm1$»</i>. Gli altri testi definiscono direttamente $P_{12}|\alpha\rangle|\beta\rangle=|\beta\rangle|\alpha\rangle$, e Ballentine scrive subito che <i>«clearly $P_{12}$ is its own inverse, and $P_{12}$ is a both unitary and Hermitian»</i>. Picasso fa vedere che c&rsquo;era una scelta da fare.</p>`}
  ]},
  {t:'prosa', title:'Lo spazio prodotto si spezza in due', tag:'spazi', html:R`
  <p>Gli autovettori di $\Pi$ con autovalore $+1$ sono i vettori simmetrici, quelli con $-1$ gli antisimmetrici, e ogni vettore è la somma di un vettore simmetrico e di uno antisimmetrico: $\tfrac12(1+\Pi)$ e $\tfrac12(1-\Pi)$ sono i due <span class="str" data-str="proiettore-ortogonale">proiettori</span>, e la loro somma è l&rsquo;identità. Picasso scrive lo spazio come somma diretta, $\mathcal H=\mathcal H_{S}\oplus\mathcal H_{A}$. Se lo spazio di una particella ha dimensione $n$, il prodotto ne ha $n^{2}$; la <span class="str" data-str="traccia">traccia</span> di $P_{12}$ conta gli stati prodotto lasciati fissi dallo scambio, che sono gli $n$ stati $|a\rangle|a\rangle$, e quindi la dimensione di $\mathcal H_{S}$ è $\tfrac12(n^{2}+n)$ e quella di $\mathcal H_{A}$ è $\tfrac12(n^{2}-n)$. Shankar osserva che $V_{S}$ ha <i>«slightly more than half the dimensionality»</i> del prodotto. Per $n=3$ sono $6$ e $3$.</p>
  <p>Ballentine fa notare che fin qui non si è detto niente sugli stati fisici: è matematica dello spazio prodotto. Se la hamiltoniana commuta con $P_{12}$, i due operatori hanno un sistema completo di autovettori comuni, <i>«hence it follows that for a system of two identical particles, the eigenvectors of $H$ can be chosen to have either symmetry or antisymmetry under permutation of the particles»</i>. E la <span class="str" data-str="simmetrie">simmetria</span> si conserva nel tempo, perché $H\Psi$ ha la stessa simmetria di $\Psi$. Dirac: <i>«uno stato che sia inizialmente simmetrico rimane sempre simmetrico mentre uno stato che sia inizialmente antisimmetrico rimane sempre antisimmetrico. Conseguentemente, può accadere che particelle di tipo particolare presentino in natura solo stati simmetrici o solo stati antisimmetrici»</i>. Il verbo è «può accadere».</p>`},
  {t:'reveal', title:'Tre gradi di identità', tag:'Messiah e Greenberg', steps:[
   {label:'L elenco', body:R`
   <p>Ballentine apre il capitolo 17 con una distinzione che prende da Messiah e Greenberg (1964): <i>«Three successively stronger expressions of particle identity can be distinguished: (1) permutation symmetry of the Hamiltonian, which leads to degeneracies and selection rules, as does any symmetry; (2) permutation symmetry of all observables, which leads to a superselection rule; and (3) the symmetrization postulate, which restricts the states for a species of particle to be of a single symmetry type (either symmetric or antisymmetric). The stronger principles in this sequence cannot be deduced from the weaker principles»</i>.</p>`},
   {label:'Il primo grado non basta', body:R`
   <p>Il primo grado non distingue le particelle identiche da quelle che semplicemente si scambiano bene. La hamiltoniana del positronio, un elettrone e un positrone legati, è invariante per scambio, <i>«but of course an electron and a positron are not identical particles, and they can be distinguished by applying an electric or a magnetic field»</i>. Griffiths fa lo stesso esempio contro l&rsquo;idea che la simmetrizzazione sia imposta dal fatto che $P$ e $H$ commutano: <i>«This is false: It is perfectly possible to imagine a system of two distinguishable particles (say, an electron and a positron) for which the Hamiltonian is symmetric, and yet there is no requirement that the wave function be symmetric (or antisymmetric)»</i>.</p>`},
   {label:'Il secondo grado e la superselezione', body:R`
   <p>Il secondo grado è il principio di indistinguibilità di Messiah e Greenberg: <i>«Dynamical states that differ only by a permutation of identical particles cannot be distinguished by any observation whatsoever»</i>. Ne segue che ogni osservabile commuta con ogni $P_{ij}$, la (17.5), e da qui una regola di superselezione. Se $|s\rangle$ è simmetrico, $|a\rangle$ antisimmetrico e $A$ un&rsquo;osservabile, $\langle s|P_{ij}A|a\rangle$ vale da un lato $\langle s|A|a\rangle$ e dall&rsquo;altro $-\langle s|A|a\rangle$, quindi è zero. In una sovrapposizione $|s\rangle+c|a\rangle$ con $|c|=1$ il valor medio di ogni osservabile è $\langle s|A|s\rangle+\langle a|A|a\rangle$, indipendente dalla fase di $c$: <i>«even if the state vector was a superposition of symmetric and antisymmetric components, no interference would be observed»</i>.</p>
   <p>Picasso arriva alla stessa conclusione dalla (15.29): se lo stato è in $\mathcal H_{S}$ resta in $\mathcal H_{S}$ <i>«sia in seguito all&rsquo;evoluzione temporale sia che venga comunque perturbato da misure»</i>, e una sovrapposizione $|S\rangle+|A\rangle$ è fatta collassare in uno dei due spazi dalla misura di una qualunque osservabile non degenere, <i>«dove resterà per sempre»</i>. È la stessa struttura della regola di superselezione per la rotazione di $2\pi$, che Ballentine discute nel capitolo 7 con lo stesso metodo.</p>`}
  ]},
  {t:'reveal', title:'Con tre particelle non bastano simmetrico e antisimmetrico', tag:'gruppo delle permutazioni', steps:[
   {label:'Sei permutazioni che non commutano', body:R`
   <p>Con tre particelle le permutazioni sono sei: l&rsquo;identità, tre scambi $P_{12}$, $P_{23}$, $P_{31}$ e due permutazioni cicliche. Ballentine osserva che <i>«the six permutation operators are not mutually commutative, for example $P_{12}P_{23}\neq P_{23}P_{12}$. Therefore a complete set of common eigenvectors for these operators does not exist, and so it is not possible for every eigenvector of $H$ to be symmetric or antisymmetric under pair interchanges»</i>. Il prodotto $P_{12}P_{23}$ è una permutazione ciclica, e $P_{23}P_{12}$ è l&rsquo;altra.</p>`},
   {label:'Quattro sottospazi invarianti', body:R`
   <p>Il sottospazio di dimensione sei generato da $|\alpha\rangle|\beta\rangle|\gamma\rangle$ e dalle sue permutazioni, con $\alpha,\beta,\gamma$ diversi, si riduce in quattro sottospazi invarianti: uno simmetrico, uno antisimmetrico, e due di dimensione due che Ballentine chiama parzialmente simmetrici. Lo stato completamente antisimmetrico è</p>
   $$\Psi_{\alpha\beta\gamma}=\tfrac{1}{\sqrt6}\big(|\alpha\beta\gamma\rangle-|\beta\alpha\gamma\rangle-|\alpha\gamma\beta\rangle-|\gamma\beta\alpha\rangle+|\gamma\alpha\beta\rangle+|\beta\gamma\alpha\rangle\big),$$
   <p>e cambia segno per ogni scambio. Picasso dà l&rsquo;esempio fisico con gli spin: <i>«gli 8 stati di spin di tre elettroni si suddividono in 4 stati di spin totale $S=3/2$, simmetrici, e due coppie di stati di spin $S=1/2$, che non sono né simmetrici né antisimmetrici»</i>. Non esiste uno stato di spin di tre elettroni completamente antisimmetrico, perché ogni elettrone ha solo due stati di spin: è la ragione per cui un orbitale non contiene tre elettroni.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Perché la traccia di $P_{12}$ è $n$?`,
    a:R`Perché nella base prodotto $P_{12}$ è una matrice di permutazione: manda ogni vettore di base $|a\rangle|b\rangle$ in un altro vettore di base, $|b\rangle|a\rangle$. Gli elementi diagonali sono uno solo per i vettori lasciati fissi, cioè quelli con $a=b$, che sono $n$. D&rsquo;altra parte la traccia è la somma degli autovalori, $\dim\mathcal H_{S}-\dim\mathcal H_{A}$; con $\dim\mathcal H_{S}+\dim\mathcal H_{A}=n^{2}$ si ricavano le due dimensioni.`},
   {q:R`La regola di superselezione vale anche per gli stati parzialmente simmetrici?`,
    a:R`Sì. Ballentine la dimostra per simmetrici e antisimmetrici con lo stesso argomento del segno, e riferisce che Messiah e Greenberg la estendono con la teoria delle rappresentazioni a tutti i tipi di simmetria, inclusi i parzialmente simmetrici. Le osservabili non collegano mai sottospazi di simmetria diversa.`}
  ]}
]},
/* ---------------- 03 · POSTULATO O TEOREMA ---------------- */
{ num:'03', title:'Postulato, teorema o fatto sperimentale: dove le fonti divergono', meta:'la deduzione di Landau con la fase e il suo fattore al quadrato · la misura che non ordina la coppia di Shankar · il postulato empirico di Sakurai e la legge nuova di Griffiths · il principio ricavato dall elio di Picasso · il puo accadere di Dirac · perche Ballentine dice che le deduzioni non reggono · il legame fra spin e statistica',
  blocchi:[
  {t:'prosa', title:'La domanda', tag:'fondamenti', html:R`
  <p>Fin qui si è stabilito che lo scambio commuta con tutte le osservabili e che simmetria e antisimmetria si conservano. Resta la domanda decisiva: gli stati di due particelle identiche devono essere simmetrici o antisimmetrici, e quale delle due cose per quale specie? Le fonti del corso rispondono in sei modi che non si possono sommare, perché ciascuno mette il punto d&rsquo;appoggio altrove. È la riga della sintesi dei postulati preparata dall&rsquo;amico di Giuseppe dove le colonne cambiano di più: un postulato di simmetrizzazione in Ballentine e in Cohen-Tannoudji, un&rsquo;aggiunta nel capitolo 10 di Shankar, un capitolo dedicato in Picasso, e per il professore un punto interrogativo, <i>«quinto previsto?»</i>, nel blocco del programma sulle particelle identiche.</p>`},
  {t:'reveal', title:'La deduzione: Landau, Shankar, Iannelli', tag:'deduzione', steps:[
   {label:'Landau: una fase che al quadrato fa uno', body:R`
   <p>Landau parte dall&rsquo;indistinguibilità: gli stati che si ottengono l&rsquo;uno dall&rsquo;altro scambiando le due particelle <i>«devono essere fisicamente del tutto equivalenti. Questo significa che come risultato dello scambio la funzione d&rsquo;onda del sistema può variare soltanto di un fattore di fase inessenziale»</i>. Se lo scambio moltiplica la funzione per $e^{i\alpha}$, un secondo scambio la moltiplica per $e^{2i\alpha}$ e la riporta a sé stessa; quindi $e^{2i\alpha}=1$ ed $e^{i\alpha}=\pm1$. <i>«Siamo giunti quindi al risultato che esistono in tutto due possibilità: o la funzione d&rsquo;onda è simmetrica [...], o essa è antisimmetrica»</i>. Poi aggiunge che tutti gli stati dello stesso sistema devono avere la stessa simmetria, <i>«se così non fosse, la funzione d&rsquo;onda di uno stato, che rappresenta la sovrapposizione di stati con diverse simmetrie, non sarebbe né simmetrica né antisimmetrica»</i>, e che la scelta dipende dalla natura delle particelle.</p>`},
   {label:'Shankar: una misura che dà una coppia non ordinata', body:R`
   <p>Shankar arriva allo stesso punto da una misura. Si trovano due bosoni identici, uno in $x=a$ e l&rsquo;altro in $x=b$: lo stato dopo la misura è $|ab\rangle$ o $|ba\rangle$? <i>«The answer is, neither»</i>. La misura dà una coppia di numeri non ordinata; quello che si può concludere è che lo stato è autostato di $X_{1}+X_{2}$ con autovalore $a+b$, e sta nel sottospazio generato da $|ab\rangle$ e $|ba\rangle$. Imponendo che lo scambio dia lo stesso stato fisico, $|\psi\rangle=\beta|ab\rangle+\gamma|ba\rangle$ deve essere proporzionale a $\beta|ba\rangle+\gamma|ab\rangle$, quindi $\beta=\alpha\gamma$ e $\gamma=\alpha\beta$, cioè $\alpha^{2}=1$. Poi: <i>«A given species of particles must choose once and for all between S and A states»</i>, perché altrimenti lo spazio conterrebbe combinazioni né simmetriche né antisimmetriche.</p>`},
   {label:'Gli appunti di Iannelli', body:R`
   <p>Gli appunti di Iannelli seguono la stessa strada in una riga: <i>«nel caso in cui le particelle siano identiche, le proprietà discusse poco sopra di indistinguibilità assicurano che qualsiasi stato descrivente due particelle identiche è autostato dell&rsquo;operatore di scambio, proprio perché non le posso distinguere»</i>. Poi chiamano la commutazione di $H$ con lo scambio una condizione <i>«necessaria (ma non sufficiente!)»</i> perché le particelle siano identiche, che è il punto del positronio.</p>`}
  ]},
  {t:'reveal', title:'Il postulato: Sakurai, Griffiths, gli appunti di Pompili', tag:'postulato', steps:[
   {label:'Un fatto empirico', body:R`
   <p>Sakurai non deduce niente. <i>«It turns out that systems containing $N$ identical particles are either totally symmetrical under the interchange of any pair [...] or totally antisymmetrical»</i>, e <i>«it is an empirical fact that a mixed symmetry does not occur»</i>. Sul legame con lo spin: <i>«This spin-statistics connection is, as far as we know, an exact law of nature with no known exceptions. In the framework of nonrelativistic quantum mechanics, this principle must be accepted as an empirical postulate. In the relativistic quantum theory, however, it can be proved that half-integer-spin particles cannot be bosons and integer-spin particles cannot be fermions»</i>. Gli appunti di Pompili dalle lezioni di Martinelli e Testa traducono il passo e lo intitolano <i>«postulato di simmetrizzazione»</i>: <i>«nell&rsquo;ambito della Meccanica Quantistica non relativistica, questo principio deve essere accettato come postulato empirico»</i>.</p>
   <p>Sakurai aggiunge in nota che la regola dipende dalla dimensione dello spazio: <i>«it is possible to have objects, called anyons, that have a continuum of statistical properties spanning the range between fermions and bosons, if they are constrained to two spatial dimensions»</i>. Shankar fa un&rsquo;osservazione parallela per una dimensione: il teorema di spin e statistica, <i>«proven in three dimensions, does not apply to one dimension, where it is not possible to define spin»</i>, e lì la statistica si può solo misurare.</p>`},
   {label:'Una legge nuova', body:R`
   <p>Griffiths chiama la regola <i>«the symmetrization requirement»</i> e nella nota che confuta l&rsquo;argomento della commutazione di $P$ con $H$ la mette al livello dei postulati fondamentali: <i>«identical particles have to occupy symmetric or antisymmetric states, and this is a completely new fundamental law — on a par, logically, with Schrödinger&rsquo;s equation and the statistical interpretation. Of course, there didn&rsquo;t have to be any such things as identical particles; it could have been that every single particle in nature was distinguishable from every other one. Quantum mechanics allows for the possibility of identical particles, and nature (being lazy) seized the opportunity»</i>. Sul legame con lo spin: <i>«can be proved in relativistic quantum mechanics; in the nonrelativistic theory it is taken as an axiom»</i>, e in nota ricorda che <i>«it seems bizarre that relativity should have anything to do with it»</i>.</p>`}
  ]},
  {t:'reveal', title:'Il fatto sperimentale: Picasso e Dirac', tag:'esperienza', steps:[
   {label:'Picasso interroga l elio', body:R`
   <p>Picasso, dopo aver mostrato che uno stato resta per sempre in $\mathcal H_{S}$ o in $\mathcal H_{A}$, scrive: <i>«potrebbe darsi che per ogni sistema di due elettroni gli unici stati possibili siano i soli stati simmetrici oppure i soli stati antisimmetrici: ciò è possibile ma a priori non è detto che sia vero, per cui non ci resta altro da fare che &ldquo;interrogare la natura&rdquo;»</i>. La natura risponde con l&rsquo;elio. La configurazione $(1s)^{2}$ ha i due elettroni nello stesso orbitale, quindi la parte orbitale è simmetrica, e lo spin può essere $0$ o $1$: il primo stato è antisimmetrico rispetto allo scambio completo, il secondo simmetrico. <i>«L&rsquo;analisi spettroscopica dell&rsquo;He dice che in natura esiste soltanto lo stato $(1s)^{2}$ di singoletto ($S=0$), mentre non esiste nessuno stato $(1s)^{2}$ con $S=1$. Ciò non solo conferma che non tutti i vettori di $\mathcal H$ corrispondono a stati fisici, ma stabilisce che gli unici stati possibili sono quelli antisimmetrici»</i>. Il principio di Pauli, in Picasso, è una legge letta in uno spettro.</p>`},
   {label:'Dirac: può accadere', body:R`
   <p>Dirac lascia aperte entrambe le possibilità come proprietà possibili della natura, <i>«può accadere che particelle di tipo particolare presentino in natura solo stati simmetrici o solo stati antisimmetrici»</i>, ne ricava le conseguenze, e poi si rivolge agli esperimenti. <i>«Per ottenere accordo con l&rsquo;esperienza si deve supporre che due elettroni non si trovino mai nello stesso stato. Questa regola è nota sotto il nome di principio di esclusione di Pauli. Essa mostra che gli elettroni sono fermioni. La legge della radiazione di Planck mostra che i fotoni sono bosoni, poiché solo la statistica di Bose applicata ai fotoni può portare alla legge di Planck»</i>. Sulle altre simmetrie: <i>«Dal punto di vista matematico sono possibili altri tipi più complicati di simmetria, ma essi non si applicano ad alcun tipo di particelle conosciuto»</i>. Le dispense in lucidi del corso usano la stessa forma: <i>«si verifica sperimentalmente che per le particelle a spin semintero lo stato complessivo [...] deve essere antisimmetrico»</i>.</p>`}
  ]},
  {t:'prosa', title:'Perché Ballentine dice che le deduzioni non reggono', tag:'critica', html:R`
  <p>Ballentine prende posizione contro le deduzioni: <i>«Many books contain arguments that purport to derive one or more parts of the symmetrization postulate from other principles of quantum mechanics»</i>. Il primo argomento è quello di Landau e di Shankar. Parte dall&rsquo;affermazione che la permutazione di particelle identiche non deve portare a uno stato diverso, che è più forte del principio di indistinguibilità, per il quale la permutazione non deve portare a differenze osservabili. Da lì si scrive $P_{ij}|\Psi\rangle=c|\Psi\rangle$ e si conclude $c=\pm1$. <i>«Implicit in this argument is the assumption that a state must be represented by a one-dimensional vector space, i.e. by a state vector with at most its overall phase being arbitrary. But this is equivalent to excluding by fiat the partially symmetric state vectors, which belong to multidimensional invariant subspaces»</i>.</p>
  <p>Il controesempio usa l&rsquo;operatore di stato. Si prende un sottospazio invariante di dimensione $n$, con base ortonormale $|u_{i}\rangle$, e si forma $\rho=n^{-1}\sum_{i}|u_{i}\rangle\langle u_{i}|$: <i>«Clearly the state described by $\rho$ is not changed by permutation of identical particles, since $P_{ij}\rho P_{ij}=\rho$»</i>. Con i due vettori parzialmente simmetrici di Ballentine per tre particelle si verifica che $P_{12}\rho P_{12}$ e $P_{23}\rho P_{23}$ coincidono con $\rho$, e che $\mathrm{Tr}\,\rho^{2}=\tfrac12$: è uno stato misto che la permutazione lascia invariato e che non è né simmetrico né antisimmetrico. L&rsquo;argomento della fase esclude questi stati per ipotesi.</p>
  <p>Il secondo argomento è quello delle traiettorie, di Landau, Sakurai, Griffiths e Iannelli. Ballentine: <i>«the pragmatic indistinguishability that is deduced from this argument implies nothing about the symmetry of the state vector. The derivation of the indeterminacy relations in Sec. 8.4 uses no property of the state vector or state operator except its existence. Even if we used an absurd state vector, having the wrong symmetry and violating the Schrödinger equation, we would still not violate the indeterminacy relations»</i>. La conclusione: <i>«The three parts of this postulate cannot be deduced from the other principles of quantum mechanics, so we shall examine their consequences and the empirical evidence that supports them»</i>. Le prove sono quelle di Picasso e di Dirac, più l&rsquo;idrogeno molecolare e l&rsquo;urto di particelle identiche, che le tappe 05 e 09 svolgono.</p>
  <p>Sul legame fra spin e statistica le fonti sono invece d&rsquo;accordo nel dire dove si dimostra. Landau: <i>«Usando le leggi della meccanica relativistica quantistica (vedi vol. IV, § 25), è possibile mostrare, che la statistica cui obbediscono le particelle è univocamente legata al loro spin»</i>. Shankar: il teorema è <i>«provable in quantum field theory»</i>. Nessuna fonte del corso lo dimostra, e qui lo si prende come dato.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`All&rsquo;orale si chiede se il principio di Pauli sia un postulato. Che risposta dà ciascuna fonte?`,
    a:R`Per Sakurai, Griffiths e gli appunti di Pompili è un postulato, empirico in meccanica non relativistica, dimostrabile in teoria relativistica come parte del legame fra spin e statistica. Per Picasso è una legge ricavata dallo spettro dell&rsquo;elio, dopo aver mostrato che la teoria permette entrambe le simmetrie. Per Dirac è la regola necessaria per l&rsquo;accordo con l&rsquo;esperienza. Per Landau e Shankar la dicotomia simmetrico o antisimmetrico si deduce dall&rsquo;indistinguibilità, e la scelta per ciascuna specie dipende dalla natura della particella. Per Ballentine nessuna parte del postulato di simmetrizzazione si deduce dagli altri principi, e le deduzioni correnti escludono per ipotesi gli stati parzialmente simmetrici. Il principio di esclusione vero e proprio, due fermioni nello stesso stato danno zero, è invece in tutte le fonti una conseguenza dell&rsquo;antisimmetria.`},
   {q:R`Che cosa sono le paraparticelle, e perché se ne parla se non esistono?`,
    a:R`Sono le particelle ipotetiche con stati parzialmente simmetrici, il terzo punto del postulato di Ballentine: <i>«partially symmetric states do not exist. (Nevertheless they give rise to the name paraparticles.)»</i>. Se ne parla perché il fatto che non esistano non segue dalla meccanica quantistica: è una delle cose che il postulato aggiunge, e la ricerca di reazioni proibite solo dal postulato è il modo di metterlo alla prova. Ballentine avverte di non confonderle con il para-idrogeno, che è un nome della spettroscopia molecolare.`}
  ]}
]},
/* ---------------- 04 · N PARTICELLE ---------------- */
{ num:'04', title:'N particelle: simmetrizzare, antisimmetrizzare, contare', meta:'il simmetrizzatore e l antisimmetrizzatore · il determinante di Dirac Landau e Griffiths · il principio di esclusione come zero di un determinante · la normalizzazione con le occupazioni · quanti stati per bosoni fermioni e particelle distinguibili · la statistica di Bose con due stati in Dirac · le particelle composte',
  blocchi:[
  {t:'prosa', title:'Costruire gli stati permessi', tag:'costruzione', html:R`
  <p>Se le particelle non interagiscono, o si cerca una base dello spazio, si parte dagli stati di singola particella $\varphi_{a},\varphi_{b},\dots$ e si formano i prodotti, che non hanno la simmetria giusta. Dirac descrive il rimedio per i fermioni: <i>«possiamo in generale formare un ket antisimmetrico applicando ad essa tutte le possibili permutazioni e sommando i risultati, col coefficiente $-1$ a moltiplicare quei termini che derivano da una permutazione dispari»</i>, e per i bosoni la stessa somma con tutti i segni positivi. Sakurai chiama gli operatori che lo fanno, per due particelle, simmetrizzatore e antisimmetrizzatore, $S_{12}=\tfrac12(1+P_{12})$ e $A_{12}=\tfrac12(1-P_{12})$: applicati a una combinazione qualsiasi di $|k'\rangle|k''\rangle$ e $|k''\rangle|k'\rangle$, danno un vettore necessariamente simmetrico o antisimmetrico, perché sono i proiettori sui due autospazi di $P_{12}$.</p>
  <p>La somma alternata di Dirac è un <span class="str" data-str="determinante-di-slater">determinante</span>, la [54.5]:</p>
  $$\Psi(\xi_{1},\dots,\xi_{N})=\frac{1}{\sqrt{N!}}\begin{vmatrix}\varphi_{a}(\xi_{1})&\varphi_{a}(\xi_{2})&\cdots&\varphi_{a}(\xi_{N})\\\varphi_{b}(\xi_{1})&\varphi_{b}(\xi_{2})&\cdots&\varphi_{b}(\xi_{N})\\\vdots&&&\vdots\\\varphi_{g}(\xi_{1})&\varphi_{g}(\xi_{2})&\cdots&\varphi_{g}(\xi_{N})\end{vmatrix}$$
  <p>dove $\xi$ comprende coordinate e spin. Landau la scrive nella (61,5) e osserva che <i>«allo scambio di due particelle corrisponde qui lo scambio di due colonne del determinante, ciò che causa il cambiamento di segno di quest&rsquo;ultimo»</i>. Griffiths la presenta come un trucco: <i>«There&rsquo;s a cute trick for constructing completely antisymmetric wave functions: Form the Slater determinant [...] (this device works for any number of particles)»</i>. Dirac precisa che non è lo stato antisimmetrico più generale ma uno particolarmente semplice, quello in cui <i>«certi stati di singola particella, cioè gli stati $a,b,c,\dots,g$, sono occupati, ma non si può dire quale delle particelle si trovi in un particolare stato»</i>.</p>`},
  {t:'reveal', title:'Il principio di esclusione come zero', tag:'Pauli', steps:[
   {label:'Due righe uguali', body:R`
   <p>Se due degli stati occupati coincidono, il determinante ha due righe uguali e si annulla identicamente. Landau: <i>«Di conseguenza, in un sistema di fermioni identici due (o più) particelle non possono trovarsi in uno stesso stato. Questo è il cosiddetto principio di Pauli (1925)»</i>. Dirac dice di più: gli stati occupati devono essere linearmente indipendenti, <i>«altrimenti la [54.4] o la [54.5] si annulla»</i>. Ballentine fa lo stesso conto sullo stato di tre particelle della tappa 02: ponendo $\alpha=\beta$ si ottiene $\Psi_{\beta\beta\gamma}=0$, e <i>«this is the basis of the Pauli exclusion principle»</i>. Griffiths insiste che non è un&rsquo;ipotesi aggiuntiva: <i>«It is not (as you may have been led to believe) a weird ad hoc assumption applying only to electrons, but rather a consequence of the rules for constructing two-particle wave functions, applying to all identical fermions»</i>.</p>`},
   {label:'Uno stato con spin', body:R`
   <p>Con lo spin, «stato» vuol dire orbitale e componente di spin insieme. Shankar: lo stato antisimmetrico si annulla se $\omega_{1}=\omega_{2}$ e $s_{1}=s_{2}$; <i>«thus two electrons can be in the same orbital state if their spin orientations are different»</i>. È la regola dei due elettroni per orbitale dei libri di chimica, e la tappa 02 ha già detto perché non sono tre: con due soli stati di spin non si costruisce uno stato di spin di tre elettroni completamente antisimmetrico.</p>`}
  ]},
  {t:'reveal', title:'La normalizzazione con occupazioni multiple', tag:'bosoni', steps:[
   {label:'Il fattore di Landau', body:R`
   <p>Per i bosoni più particelle possono stare nello stesso stato, e la normalizzazione cambia. Se lo stato $i$ è occupato $N_{i}$ volte, le permutazioni distinte dei prodotti sono $N!/(N_{1}!N_{2}!\cdots)$, e lo stato normalizzato è la loro somma moltiplicata per $\sqrt{N_{1}!N_{2}!\cdots/N!}$, la (61,3). Landau spiega il conto: integrando il quadrato del modulo <i>«si annullano tutti i termini, tranne soltanto i quadrati dei moduli di ciascuno dei termini della somma»</i>.</p>`},
   {label:'Un esempio con tre bosoni', body:R`
   <p>Tre bosoni, due nello stato $a$ e uno nello stato $b$: le permutazioni distinte sono $3!/(2!\,1!)=3$, cioè $|aab\rangle$, $|aba\rangle$, $|baa\rangle$, e lo stato normalizzato è $(|aab\rangle+|aba\rangle+|baa\rangle)/\sqrt3$. È invariante per $P_{12}$ e per $P_{23}$, e quindi per tutte le permutazioni. Se si sommassero tutte e sei le permutazioni, ciascun termine comparirebbe due volte, e il fattore $1/\sqrt{3!}$ darebbe una norma sbagliata: è l&rsquo;errore tipico quando si normalizza a mano.</p>`}
  ]},
  {t:'prosa', title:'Contare gli stati', tag:'conteggi', html:R`
  <p>Con $n$ stati di singola particella e $N$ particelle, gli stati distinguibili sono $n^{N}$; quelli di $N$ fermioni sono tanti quanti i modi di scegliere $N$ stati occupati diversi, $\binom{n}{N}$; quelli di $N$ bosoni tanti quanti i modi di distribuire $N$ particelle in $n$ stati con ripetizioni, $\binom{n+N-1}{N}$. Per $N=2$ si ritrovano le dimensioni della tappa 02, $\tfrac12n(n-1)$ e $\tfrac12n(n+1)$.</p>
  <p>Il caso più piccolo, due particelle e due stati, è quello che Sakurai e Dirac usano per far vedere la differenza. Sakurai: per due fermioni <i>«we have no choice; there is only one possibility»</i>, per due bosoni tre stati, per due particelle classiche quattro. <i>«In this sense fermions are the least sociable; they avoid each other to make sure that they are not in the same state; in contrast, bosons are the most sociable, they really love to be in the same state, even more so than classical particles obeying M-B statistics»</i>. Dirac ne fa una statistica: all&rsquo;equilibrio termico ad alta temperatura gli stati indipendenti sono equiprobabili, quindi per due particelle classiche c&rsquo;è <i>«una probabilità pari a 1/4 che entrambe le particelle si trovino nello stato a, una probabilità pari a 1/4 che entrambe le particelle si trovino nello stato b, e una probabilità pari a 1/2 che le particelle si trovino una in uno stato e una nell&rsquo;altro»</i>, mentre per due bosoni i tre stati simmetrici hanno probabilità $1/3$ ciascuno. <i>«Dunque con la statistica di Bose la probabilità che le due particelle si trovino entrambe nello stesso stato risulta maggiore che con la statistica classica»</i>: $2/3$ contro $1/2$, e zero per i fermioni. Gli appunti di Pompili riportano lo stesso esempio con le parole di Sakurai.</p>`},
  {t:'plot', title:'Quanti stati per due particelle',
   intro:R`<p>Numero di stati di due particelle in funzione del numero $n$ di stati di singola particella: distinguibili ($n^{2}$, grigio), bosoni ($n(n+1)/2$, blu), fermioni ($n(n-1)/2$, arancio). Da leggere agli interi.</p>`,
   plots:[{kind:'func2d', xr:[1,8], yr:[0,64], height:250, ticks:true,
     title:'stati di due particelle',
     curves:[{f:'x*x', col:'#999999', width:1.6, label:'distinguibili'},
             {f:'x*(x+1)/2', col:'#5aa9ff', width:2.4, label:'bosoni'},
             {f:'x*(x-1)/2', col:'#ffb86b', width:2.4, label:'fermioni'}],
     xlabel:'n', ylabel:'numero di stati'}],
   leggi:R`<p><b>Che cosa guardare.</b> Le curve dei bosoni e dei fermioni sommate danno quella delle particelle distinguibili, e differiscono sempre di $n$, il numero di stati con le due particelle nello stesso stato di singola particella. Per $n=1$ c&rsquo;è un solo stato di due bosoni e nessuno di due fermioni.</p>
   <p><b>Che cosa impararne.</b> Al crescere di $n$ le due curve tendono a metà della grigia: quando gli stati disponibili sono molti rispetto alle particelle, le coincidenze sono rare e bosoni e fermioni si comportano come particelle classiche con un fattore $1/2$ di conteggio. È il limite classico delle due statistiche, e anche la ragione per cui a bassa temperatura, quando gli stati accessibili sono pochi, le differenze diventano vistose.</p>`},
  {t:'prosa', title:'Particelle composte', tag:'statistica', html:R`
  <p>La regola vale anche per oggetti composti. Landau: <i>«La statistica delle particelle composte è determinata dalla parità del numero dei fermioni elementari che ne fanno parte. Infatti, lo scambio di due particelle composte identiche equivale allo scambio simultaneo di più coppie di particelle elementari identiche»</i>: ogni coppia di fermioni scambiata dà un segno meno. Per i nuclei conta la parità del numero di massa, per gli atomi quella della somma del numero di massa e del numero atomico. Sakurai dà gli esempi: <i>«a $^{3}$He nucleus is a fermion just as the $e^{-}$ or the proton is; a $^{4}$He nucleus is a boson»</i>. L&rsquo;atomo di $^{4}$He, con due protoni, due neutroni e due elettroni, ha sei fermioni ed è un bosone; per questo, scrive Sakurai, <i>«a system made up of bosons, such as liquid $^{4}$He, exhibits a tendency for all particles to get down to the same ground state at extremely low temperatures»</i>. L&rsquo;atomo di $^{3}$He ha cinque fermioni ed è un fermione. Il legame con lo spin è coerente: un numero dispari di spin seminteri dà uno spin semintero.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Quanti stati ha un sistema di tre elettroni che possono stare in due orbitali, contando lo spin?`,
    a:R`Gli stati di singola particella sono $n=4$, due orbitali per due stati di spin, e gli stati di tre fermioni sono $\binom43=4$: si sceglie quale dei quattro stati resta vuoto. Senza antisimmetrizzare sarebbero $4^{3}=64$.`},
   {q:R`Perché nella statistica di Bose di Dirac i tre stati di due particelle sono equiprobabili, e non i quattro stati classici?`,
    a:R`Perché all&rsquo;equilibrio termico ad alta temperatura sono equiprobabili gli stati indipendenti dello spazio permesso, e per due bosoni lo spazio permesso ha dimensione tre. Lo stato «una particella in $a$ e l&rsquo;altra in $b$» è uno solo, $(|ab\rangle+|ba\rangle)/\sqrt2$, non due come per le particelle classiche: le particelle non hanno etichette, e la configurazione non si conta due volte.`}
  ]}
]},
/* ---------------- 05 · SPIN E SPAZIO INTRECCIATI ---------------- */
{ num:'05', title:'Spin e spazio intrecciati: spin un mezzo, spin uno, spin qualsiasi', meta:'lo scambio come prodotto di uno scambio orbitale e di uno di spin · due elettroni con tripletto e singoletto · l operatore di scambio di spin di Dirac e Sakurai · due particelle di spin s e la regola di Landau · particelle senza spin e momento orbitale pari · l idrogeno molecolare e le particelle alfa',
  blocchi:[
  {t:'prosa', title:'Due scambi in uno', tag:'spin', html:R`
  <p>Quando la hamiltoniana non contiene lo spin, come quella coulombiana di un atomo, Landau osserva che la funzione d&rsquo;onda si può scrivere come prodotto di una funzione delle coordinate e di una funzione di spin, e che l&rsquo;equazione di Schrödinger <i>«determina di fatto soltanto la funzione delle coordinate, lasciando arbitraria la funzione»</i> di spin. Lo scambio completo delle due particelle è allora il prodotto di due scambi che commutano: uno delle sole variabili orbitali e uno delle sole variabili di spin. Picasso li chiama $\Pi_{o}$ e $\Pi_{s}$, e sceglie le fasi in modo che $\Pi_{o}\Pi_{s}=\Pi$; Sakurai scrive $P_{12}=P_{12}^{\rm (space)}P_{12}^{\rm (spin)}$, la (7.3.7). Se lo stato totale deve avere un autovalore di $\Pi$ dato, le due parti devono avere simmetrie che si combinano in quel segno. È tutto il meccanismo della domanda d&rsquo;esame: <b>si sceglie la simmetria della parte orbitale, e la parte di spin è obbligata</b>, o viceversa.</p>`},
  {t:'reveal', title:'Due spin un mezzo', tag:'elettroni', steps:[
   {label:'Tripletto con spazio antisimmetrico, singoletto con spazio simmetrico', body:R`
   <p>Per due spin $\tfrac12$ il tripletto è simmetrico per scambio degli spin e il singoletto antisimmetrico; Sakurai nota che <i>«this is reasonable because the ladder operator $S_{1-}+S_{2-}$ commutes with $P_{12}$, and the $|+\rangle|+\rangle$ state is even under $P_{12}$»</i>. Per due elettroni lo stato totale è antisimmetrico, quindi <i>«the spin triplet state has to be combined with an antisymmetrical space function, and the spin singlet state has to be combined with a symmetrical space function»</i>. Landau lo dice in termini di livelli: i livelli con funzione delle coordinate simmetrica <i>«possono di fatto esistere se spin totale del sistema è uguale a zero, cioè quando gli spin dei due elettroni sono &laquo;antiparalleli&raquo;»</i>, quelli con funzione antisimmetrica richiedono spin uno.</p>`},
   {label:'L operatore di scambio di spin', body:R`
   <p>Sakurai scrive lo scambio di spin con gli spin stessi, la (7.3.8):</p>
   $$P_{12}^{\rm (spin)}=\frac12\Big(1+\frac{4}{\hbar^{2}}\mathbf S_{1}\cdot\mathbf S_{2}\Big),$$
   <p>che vale $+1$ sul tripletto e $-1$ sul singoletto, perché $\mathbf S_{1}\cdot\mathbf S_{2}$ vale $\hbar^{2}/4$ e $-3\hbar^{2}/4$. Lo chiama <i>«amusing»</i>; nella base prodotto è la matrice che scambia $|{+}{-}\rangle$ e $|{-}{+}\rangle$. È lo stesso operatore che Landau attribuisce a Dirac nel problema sull&rsquo;energia di scambio: una dipendenza dell&rsquo;energia dallo spin, scritta come se fosse un&rsquo;interazione $\mathbf s_{1}\cdot\mathbf s_{2}$, che in realtà viene solo dalla simmetria.</p>`},
   {label:'Un controllo nello spazio prodotto', body:R`
   <p>Con due orbitali $a$ e $b$ e i due spin, lo spazio prodotto ha dimensione sedici. Lo stato $\tfrac{1}{\sqrt2}(|ab\rangle+|ba\rangle)\otimes|0,0\rangle$ e lo stato $\tfrac{1}{\sqrt2}(|ab\rangle-|ba\rangle)\otimes|1,M\rangle$ sono antisimmetrici per lo scambio completo, che in questa base è il prodotto tensoriale dello scambio degli orbitali e di quello degli spin; lo stato $\tfrac{1}{\sqrt2}(|ab\rangle+|ba\rangle)\otimes|1,1\rangle$ è simmetrico e non è permesso a due elettroni. Con due orbitali diversi ci sono $1+3=4$ stati di due elettroni, quanti ne dà $\binom42$ contando i quattro stati di singola particella.</p>`}
  ]},
  {t:'prosa', title:'Due particelle di spin s: la regola di Landau', tag:'spin qualsiasi', html:R`
