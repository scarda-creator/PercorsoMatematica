  <p>Per spin più grandi la corrispondenza fra simmetria orbitale e spin totale non è più biunivoca, e Landau dà la regola generale con gli spinori. La funzione di spin di due particelle di spin $s$ è uno spinore di rango $4s$; per ottenere lo spin totale $S$ bisogna contrarre $2s-S$ coppie di indici, uno per particella, e ogni contrazione è una combinazione antisimmetrica. <i>«Perciò nello scambio delle particelle la funzione d&rsquo;onda di spin si moltiplicherà per $(-1)^{2s-S}$»</i>. La funzione totale si moltiplica per $(-1)^{2s}$, che è $+1$ per i bosoni e $-1$ per i fermioni, quindi la parte orbitale si moltiplica per $(-1)^{S}$: <i>«la funzione d&rsquo;onda delle coordinate del sistema di due particelle identiche è simmetrica per spin totale pari e antisimmetrica per spin totale dispari»</i>. La regola vale per bosoni e fermioni insieme.</p>
  <p>Per due spin uno, i multipletti con $S=2$ e $S=0$ sono simmetrici per scambio degli spin e quello con $S=1$ antisimmetrico, come si vede componendo $1\otimes1$: lo stato più alto del multipletto $S=1$ è $(|1,0\rangle-|0,1\rangle)/\sqrt2$, che cambia segno. Due bosoni di spin uno in uno stato orbitale simmetrico hanno quindi $S=2$ o $S=0$, cioè $5+1=6$ stati di spin; in uno stato orbitale antisimmetrico hanno $S=1$, tre stati. È il caso del compito della tappa 11.</p>
  <p>Landau conta anche quanti stati di spin ci sono con $S$ pari e dispari. Per $s$ intero, fra i $2s+1$ valori di $S$ ci sono $s+1$ valori pari, che danno $(s+1)(2s+1)$ stati, e $s$ dispari, che ne danno $s(2s+1)$; per $s$ semintero le parti si invertono, con $s(2s+1)$ stati di $S$ pari e $(s+1)(2s+1)$ di $S$ dispari. Il conto si ritrova con la tappa 02: per $s$ intero gli stati di spin simmetrici sono $\tfrac12 n(n+1)$ con $n=2s+1$, e sono proprio quelli di $S$ pari.</p>`},
  {t:'reveal', title:'Senza spin: momento orbitale pari', tag:'parità', steps:[
   {label:'Lo scambio è un inversione', body:R`
   <p>Per due particelle identiche di spin zero non c&rsquo;è parte di spin, e la funzione delle coordinate deve essere simmetrica. Landau aggiunge un&rsquo;osservazione che la rende una regola di selezione: <i>«Lo scambio di due particelle identiche è equivalente all&rsquo;operazione dell&rsquo;inversione del sistema di coordinate (la cui origine è scelta nel punto di mezzo del segmento che congiunge le due particelle)»</i>. In coordinate relative, scambiare vuol dire $\mathbf r\to-\mathbf r$, e un&rsquo;armonica sferica $Y_{l}^{m}$ si moltiplica per $(-1)^{l}$. Quindi <i>«un sistema di due particelle identiche con spin nullo può avere momento angolare orbitale soltanto pari»</i>, e per spin qualsiasi la parità del momento orbitale è quella di $S$.</p>`},
   {label:'Il berillio otto e le particelle alfa', body:R`
   <p>Landau ne fa un problema: <i>«In quali stati il nucleo Be$^{8}$ può decadere in due particelle $\alpha$?»</i>. La particella alfa ha spin zero, quindi due alfa possono avere solo momento orbitale pari, uguale al momento angolare totale, e stati pari: <i>«Quindi il decadimento in questione è possibile soltanto da stati pari del nucleo Be$^{8}$ con momento angolare totale pari»</i>. È la stessa simmetrizzazione dello stato $\alpha\alpha$ che, dimenticata in un&rsquo;analisi, Sakurai racconta abbia prodotto un errore di un fattore $\sqrt2$ in una verifica dell&rsquo;ipotesi della corrente vettoriale conservata, corretto due anni dopo.</p>`},
   {label:'L idrogeno molecolare', body:R`
   <p>Ballentine usa la stessa regola per i protoni dell&rsquo;idrogeno molecolare, che hanno spin $\tfrac12$: <i>«the protons in the singlet state (called &ldquo;para-H$_{2}$&rdquo;, not to be confused with the hypothetical paraparticles that violate the symmetrization postulate) can have only even values of orbital angular momentum $L$, while the protons in the triplet state (called &ldquo;ortho-H$_{2}$&rdquo;) can have only odd values of $L$»</i>. L&rsquo;energia di rotazione è $\hbar^{2}L(L+1)/2I$, e i livelli dei due tipi sono diversi; le transizioni fra singoletto e tripletto sono così rare che <i>«over a time scale of a day or so it is possible to regard the singlet and triplet states of H$_{2}$ as two different stable molecules»</i>. Gli spettri molecolari e il calore specifico dell&rsquo;idrogeno confermano la previsione: <i>«Thus we have good evidence that protons are fermions»</i>. Il livello più basso dell&rsquo;orto-idrogeno, con $L=1$, sta $\hbar^{2}/I$ sopra quello del para-idrogeno, con $L=0$; e poiché il tripletto ha tre stati di spin e il singoletto uno, ad alta temperatura le molecole orto sono tre volte più numerose di quelle para.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Nello scritto del 9-09-2015 due bosoni di spin uno in un oscillatore, nel sistema del centro di massa, sono nello stato $\delta|n=0,\ell=0\rangle\chi^{0}_{0}+\gamma|n=1,\ell=1\rangle\chi^{0}_{1}$, con $\chi^{S_{z}}_{S}$ gli stati di spin totale. Lo stato rispetta la simmetrizzazione?`,
    a:R`Sì. Per due particelle identiche la parità del momento orbitale relativo deve essere quella dello spin totale. Il primo termine ha $\ell=0$ e $S=0$, entrambi pari; il secondo $\ell=1$ e $S=1$, entrambi dispari. Uno stato con $\ell=1$ e $S=0$, o con $\ell=0$ e $S=1$, non sarebbe permesso.`},
   {q:R`Due elettroni nello stesso orbitale: quali stati di spin sono permessi?`,
    a:R`Solo il singoletto. La parte orbitale $\varphi(\mathbf r_{1})\varphi(\mathbf r_{2})$ è simmetrica, e la funzione totale di due fermioni deve essere antisimmetrica, quindi la parte di spin è antisimmetrica: $S=0$. È lo stato fondamentale dell&rsquo;elio, e la ragione per cui un orbitale contiene due elettroni con spin «opposti»; Griffiths avverte che l&rsquo;espressione è imprecisa, perché anche lo stato del tripletto con $M=0$ ha spin «opposti»: la frase esatta è che sono nel singoletto.`}
  ]}
]},
/* ---------------- 06 · LA FORZA DI SCAMBIO ---------------- */
{ num:'06', title:'La forza di scambio, la densità di scambio, e quando si può dimenticare la simmetrizzazione', meta:'il valor medio del quadrato della distanza di Griffiths · bosoni piu vicini e fermioni piu lontani · la densita di scambio di Sakurai · il fattore due di Shankar sulla diagonale · il termine di interferenza di Picasso · supporti disgiunti e osservabili di una particella · il legame covalente',
  blocchi:[
  {t:'prosa', title:'Una forza che non è una forza', tag:'scambio', html:R`
  <p>Griffiths prende due particelle in due stati ortonormali di una dimensione, $\psi_{a}$ e $\psi_{b}$, e calcola il valor medio del quadrato della loro distanza in tre casi: distinguibili, bosoni identici, fermioni identici, con le funzioni (5.15), (5.16) e (5.17). Per particelle distinguibili, con la prima in $\psi_{a}$ e la seconda in $\psi_{b}$,</p>
  $$\langle(x_{1}-x_{2})^{2}\rangle_{d}=\langle x^{2}\rangle_{a}+\langle x^{2}\rangle_{b}-2\langle x\rangle_{a}\langle x\rangle_{b},$$
  <p>la (5.19). Per particelle identiche, simmetrizzando o antisimmetrizzando, compare un termine in più, la (5.21):</p>
  $$\langle(x_{1}-x_{2})^{2}\rangle_{\pm}=\langle(x_{1}-x_{2})^{2}\rangle_{d}\mp2|\langle x\rangle_{ab}|^{2},\qquad\langle x\rangle_{ab}=\int x\,\psi_{a}^{*}(x)\psi_{b}(x)\,dx .$$
  <p><i>«Identical bosons (the upper signs) tend to be somewhat closer together, and identical fermions (the lower signs) somewhat farther apart, than distinguishable particles in the same two states»</i>. Griffiths la chiama <i>«an exchange force, although it&rsquo;s not really a force at all — no physical agency is pushing on the particles; rather, it is a purely geometrical consequence of the symmetrization requirement»</i>. Landau, per lo stesso effetto con lo spin, usa il nome <i>«interazione di scambio»</i> e dice che <i>«rappresenta un effetto puramente quantistico che nel passaggio limite alla meccanica classica scompare completamente (così come scompare lo spin stesso)»</i>.</p>`},
  {t:'reveal', title:'Il conto nella buca infinita', tag:'esempio', steps:[
   {label:'I due stati più bassi', body:R`
   <p>Nella buca infinita di larghezza $a$, con $\psi_{n}=\sqrt{2/a}\,\sin(n\pi x/a)$, il problema 5.6 di Griffiths chiede proprio questo conto. Per $n=1$ e $n=2$: i valori medi di $x$ sono entrambi $a/2$, quelli di $x^{2}$ sono $a^{2}\big(\tfrac13-\tfrac{1}{2n^{2}\pi^{2}}\big)$, e l&rsquo;elemento di matrice misto vale</p>
   $$\langle x\rangle_{12}=-\frac{16a}{9\pi^{2}} .$$
   <p>Per particelle distinguibili il risultato è $a^{2}\big(\tfrac16-\tfrac{5}{8\pi^{2}}\big)$, circa $0{,}103\,a^{2}$. Il termine di scambio vale $2|\langle x\rangle_{12}|^{2}=\tfrac{512}{81\pi^{4}}a^{2}$, circa $0{,}065\,a^{2}$: per due bosoni il valor medio scende a circa $0{,}038\,a^{2}$, per due fermioni sale a circa $0{,}168\,a^{2}$. L&rsquo;effetto non è una piccola correzione: per i bosoni il valor medio del quadrato della distanza si riduce di più della metà.</p>`},
   {label:'Gli stati con lo stesso orbitale', body:R`
   <p>Se le due particelle sono nello stesso stato $\psi_{1}$, possono essere solo bosoni, e $\langle(x_{1}-x_{2})^{2}\rangle$ vale $2\langle x^{2}\rangle_{1}-2\langle x\rangle_{1}^{2}$, cioè $a^{2}\big(\tfrac16-\tfrac{1}{\pi^{2}}\big)$, circa $0{,}065\,a^{2}$. Nel compito della tappa 11 compare la stessa quantità per una buca centrata nell&rsquo;origine, dove $\langle x\rangle$ è zero.</p>`}
  ]},
  {t:'plot', title:'La probabilità di trovare le due particelle nello stesso punto',
   intro:R`<p>Densità di probabilità di trovare una particella in $x$ e l&rsquo;altra in $x$, senza riguardo alle etichette, per due particelle nella buca infinita negli stati $n=1$ e $n=2$ (unità con $a=1$): particelle con etichetta (grigio), bosoni (blu), fermioni (arancio, identicamente zero).</p>`,
   plots:[{kind:'func2d', xr:[0,1], yr:[0,16.5], height:250, ticks:true,
     title:'P(x, x) per gli stati 1 e 2',
     curves:[{f:'8*Math.pow(Math.sin(Math.PI*x)*Math.sin(2*Math.PI*x),2)', col:'#999999', width:1.6, label:'con etichetta'},
             {f:'16*Math.pow(Math.sin(Math.PI*x)*Math.sin(2*Math.PI*x),2)', col:'#5aa9ff', width:2.4, label:'bosoni'},
             {f:'0', col:'#ffb86b', width:2.4, label:'fermioni'}],
     xlabel:'x / a', ylabel:'P(x, x)'}],
   leggi:R`<p><b>Che cosa guardare.</b> La curva blu è esattamente il doppio della grigia in ogni punto, e la curva arancio è zero ovunque: due fermioni nello stesso stato di spin non si trovano mai nello stesso punto. La curva grigia è quella di due particelle identiche nelle proprietà ma con un&rsquo;etichetta, per esempio di carica diversa, contate senza guardare l&rsquo;etichetta.</p>
   <p><b>Che cosa impararne.</b> È il confronto di Shankar: con due pioni in una buca, nelle stesse condizioni, la densità sulla diagonale per i bosoni è <i>«twice as big as»</i> quella delle particelle con etichetta, e per i fermioni è zero. Shankar lo propone come il modo sperimentale di determinare la statistica senza usare il teorema di spin e statistica, ed è l&rsquo;analogo della doppia fenditura: <i>«when an event can take place in two (or more) indistinguishable ways, we add the corresponding amplitudes and not the corresponding probabilities»</i>.</p>`},
  {t:'prosa', title:'La densità di scambio', tag:'interferenza', html:R`
  <p>Sakurai fa lo stesso discorso per due elettroni in tre dimensioni, con la parte orbitale simmetrica per il singoletto e antisimmetrica per il tripletto. La probabilità di trovare un elettrone in $d^{3}x_{1}$ e l&rsquo;altro in $d^{3}x_{2}$ è, nella (7.3.15),</p>
  $$\tfrac12\Big\{|\omega_{A}(\mathbf x_{1})|^{2}|\omega_{B}(\mathbf x_{2})|^{2}+|\omega_{A}(\mathbf x_{2})|^{2}|\omega_{B}(\mathbf x_{1})|^{2}\pm2\,{\rm Re}\big[\omega_{A}(\mathbf x_{1})\omega_{B}(\mathbf x_{2})\omega_{A}^{*}(\mathbf x_{2})\omega_{B}^{*}(\mathbf x_{1})\big]\Big\}d^{3}x_{1}d^{3}x_{2},$$
  <p>e l&rsquo;ultimo termine <i>«is known as the exchange density»</i>. <i>«We immediately see that when the electrons are in a spin-triplet state, the probability of finding the second electron at the same point in space vanishes. Put another way, the electrons tend to avoid each other when their spins are in a triplet state»</i>. Nel singoletto la probabilità di trovarli vicini aumenta. Lo spin non compare nella hamiltoniana, ma decide quanto i due elettroni stanno vicini.</p>
  <p>Picasso dà la forma generale per un&rsquo;osservabile qualsiasi. Sullo stato di due particelle distinguibili $|A_{1}B_{2}\rangle$ il valor medio di $\xi$ è $\langle B_{2}A_{1}|\xi|A_{1}B_{2}\rangle$; sullo stato simmetrizzato o antisimmetrizzato è la stessa quantità più o meno un termine di interferenza, $\langle B_{2}A_{1}|\xi|B_{1}A_{2}\rangle$, la (15.35). <i>«Quindi, finché non prendiamo in considerazione (nella hamiltoniana o nelle misure che effettuiamo sul sistema) osservabili per le quali il termine di interferenza sia non nullo, un sistema di due elettroni non è diverso da un sistema di due bosoni o da un sistema di due particelle distinguibili»</i>.</p>`},
  {t:'reveal', title:'Quando la simmetrizzazione si può dimenticare', tag:'limite classico', steps:[
   {label:'Supporti disgiunti', body:R`
   <p>Picasso: se le funzioni d&rsquo;onda $\psi_{A}$ e $\psi_{B}$ hanno supporti disgiunti, il termine di interferenza è nullo per ogni osservabile funzione delle sole posizioni, perché il prodotto $\psi_{A}^{*}(\mathbf r)\psi_{B}(\mathbf r)$ è zero dappertutto; lo stesso vale per le derivate. Sakurai: <i>«We never have to worry about the question of antisymmetrization with 10 billion electrons, nor is it necessary to take into account the antisymmetrization requirement between an electron in New York and an electron in Beijing»</i>. Griffiths sceglie altre città: <i>«if $\psi_{a}$ represents an electron in an atom in Chicago, and $\psi_{b}$ represents an electron in an atom in Seattle, it&rsquo;s not going to make any difference whether you antisymmetrize the wave function or not»</i>, e aggiunge che <i>«this is the only thing that allows physicists and chemists to proceed at all»</i>.</p>`},
   {label:'Osservabili di una particella', body:R`
   <p>Picasso aggiunge un secondo caso, che non dipende dai supporti: per le osservabili di singola particella, della forma $f(\mathbf q_{1},\mathbf p_{1},\mathbf s_{1})+f(\mathbf q_{2},\mathbf p_{2},\mathbf s_{2})$, il termine di interferenza è nullo per due stati ortogonali qualsiasi, perché si fattorizza e contiene sempre un prodotto scalare $\langle A|B\rangle$. <i>«In conclusione, in tutti i casi in cui ci si aspetta che due particelle identiche possano essere considerate come particelle distinguibili, anche la teoria ci viene in soccorso e conferma le nostre aspettative»</i>. Nella buca infinita, il valor medio di $x_{1}+x_{2}$ è lo stesso nei tre casi, mentre quello di $(x_{1}-x_{2})^{2}$, che contiene il prodotto $x_{1}x_{2}$, no.</p>`}
  ]},
  {t:'prosa', title:'Il legame chimico', tag:'molecole', html:R`
  <p>Griffiths usa la forza di scambio per il legame covalente. Se gli elettroni fossero bosoni, la simmetrizzazione concentrerebbe la carica negativa fra i due protoni della molecola di idrogeno e li attirerebbe; ma sono fermioni, e per la parte orbitale antisimmetrica la carica andrebbe verso l&rsquo;esterno. <i>«But wait! We have been ignoring spin»</i>: la parte orbitale simmetrica va con il singoletto di spin, <i>«evidently, then, the singlet state should lead to bonding, and the triplet to antibonding. Sure enough, the chemists tell us that covalent bonding requires the two electrons to occupy the singlet state, with total spin zero»</i>. Landau dà lo stesso risultato per la molecola H$_{2}$: la funzione orbitale antisimmetrica <i>«ha comunque dei nodi (essa si annulla per $\mathbf r_{1}=\mathbf r_{2}$) e non può perciò corrispondere al livello più basso del sistema»</i>, e lo stato di tripletto è repulsivo. Ne trae una definizione di valenza: <i>«La capacità degli atomi di combinarsi è legata quindi ai loro spin (W. Heitler, H. London, 1927)»</i>, e come misura conviene usare il doppio dello spin dell&rsquo;atomo.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Due elettroni nel tripletto di spin: la «forza di scambio» li attrae o li respinge?`,
    a:R`Li tiene lontani. Nel tripletto la parte orbitale è antisimmetrica, si annulla per $\mathbf x_{1}=\mathbf x_{2}$, e la densità di scambio entra con il segno meno. È il caso dei fermioni di Griffiths, anche se gli elettroni sono fermioni in entrambi i casi: ciò che conta per la distanza è la simmetria della sola parte orbitale. Nel singoletto la parte orbitale è simmetrica e si comportano come i bosoni di Griffiths.`},
   {q:R`Perché nella buca infinita il valor medio di $x_{1}+x_{2}$ non sente la simmetrizzazione?`,
    a:R`Perché è un&rsquo;osservabile di singola particella, somma di una funzione della particella 1 e della stessa funzione della particella 2. Il termine di interferenza di Picasso contiene il prodotto scalare $\langle\psi_{1}|\psi_{2}\rangle$, che è zero. Vale $a/2+a/2=a$ per particelle distinguibili, bosoni e fermioni.`}
  ]}
]},
/* ---------------- 07 · L ATOMO DI ELIO ---------------- */
{ num:'07', title:'L atomo di elio: lo stato fondamentale, la degenerazione di scambio, paraelio e ortoelio', meta:'gli elettroni indipendenti e il cento otto virgola otto · la repulsione al primo ordine · il variazionale con la carica schermata · la configurazione uno s due s e la matrice due per due di Picasso · l integrale di scambio positivo · la prima regola di Hund · paraelio e ortoelio e la regola di selezione sullo spin',
  blocchi:[
  {t:'prosa', title:'Lo stato fondamentale', tag:'elio', html:R`
  <p>Sakurai dà tre ragioni per studiare l&rsquo;elio: è il problema realistico più semplice in cui l&rsquo;identità conta, l&rsquo;equazione di Schrödinger a due particelle non si risolve analiticamente, e quindi è il posto giusto per la teoria delle perturbazioni e per il metodo variazionale. La hamiltoniana con il nucleo fisso è</p>
  $$H=\frac{\mathbf p_{1}^{2}}{2m}+\frac{\mathbf p_{2}^{2}}{2m}-\frac{2e^{2}}{r_{1}}-\frac{2e^{2}}{r_{2}}+\frac{e^{2}}{r_{12}},$$
  <p>simmetrica nei due elettroni e indipendente dallo spin. Senza l&rsquo;ultimo termine lo stato fondamentale è il prodotto di due stati $1s$ idrogenoidi con $Z=2$, la parte orbitale è simmetrica, e lo spin è obbligatoriamente nel singoletto. L&rsquo;energia è $2\times4\times(-e^{2}/2a_{0})$, cioè $-108{,}8$ eV, <i>«which is about 30% larger than the experimental value»</i>.</p>
  <p>La repulsione al primo ordine si calcola sviluppando $1/r_{12}$ in polinomi di Legendre: Sakurai ottiene $\langle e^{2}/r_{12}\rangle=\tfrac58Z\,e^{2}/a_{0}$, che per $Z=2$ vale $\tfrac52\cdot e^{2}/2a_{0}$, e l&rsquo;energia diventa $(-8+\tfrac52)\,e^{2}/2a_{0}$, circa $-74{,}8$ eV, contro il valore sperimentale di $-78{,}8$ eV. <i>«This is not bad, but we can do better!»</i>: con il metodo variazionale e la carica efficace come parametro, che tiene conto della schermatura del nucleo da parte dell&rsquo;altro elettrone, il minimo cade a $Z_{\rm eff}=2-\tfrac{5}{16}=1{,}6875$ e l&rsquo;energia a $-77{,}5$ eV. <i>«Historically, this achievement was considered to be one of the earliest signs that Schrödinger&rsquo;s wave mechanics was on the right track»</i>; il calcolo è di Unsöld, 1927. Picasso nota che qui l&rsquo;identità ha già fatto il suo lavoro senza che lo si veda: il singoletto è l&rsquo;unico stato possibile per la configurazione $(1s)^{2}$, ed è proprio l&rsquo;assenza del tripletto nello spettro che nella tappa 03 gli è servita per enunciare il principio di Pauli.</p>`},
  {t:'reveal', title:'Il variazionale in tre righe', tag:'conto', steps:[
   {label:'L energia in funzione di Z efficace', body:R`
   <p>Con la funzione di prova $\psi_{100}(\mathbf x_{1})\psi_{100}(\mathbf x_{2})$ con carica $Z_{\rm eff}$, il valor medio della hamiltoniana in unità di $e^{2}/a_{0}$ è la somma di tre pezzi: l&rsquo;energia cinetica $Z_{\rm eff}^{2}$, l&rsquo;attrazione del nucleo vero $-2\cdot2Z_{\rm eff}$, la repulsione $\tfrac58Z_{\rm eff}$. Il polinomio $Z_{\rm eff}^{2}-4Z_{\rm eff}+\tfrac58Z_{\rm eff}$ ha minimo in $Z_{\rm eff}=2-\tfrac{5}{16}$, dove vale $-(27/16)^{2}$ in unità di $e^{2}/a_{0}$, circa $-77{,}5$ eV.</p>`},
   {label:'Perché la carica scende', body:R`
   <p>Il valore $1{,}6875$ è minore di $2$, <i>«as anticipated»</i>: ciascun elettrone vede il nucleo in parte schermato dalla nube dell&rsquo;altro. Il conto mostra anche che il primo ordine delle perturbazioni, $-74{,}8$ eV, sbaglia di $4$ eV, e che il variazionale, che è un limite superiore, si avvicina al valore vero a $1{,}3$ eV.</p>`}
  ]},
  {t:'reveal', title:'I livelli eccitati e la degenerazione di scambio', tag:'Picasso', steps:[
   {label:'La matrice due per due', body:R`
   <p>Picasso considera le configurazioni con un solo elettrone eccitato, $(1s)(nl)$, che sono le sole raggiungibili con buona approssimazione per via radiativa dallo stato fondamentale. Introduce due scambi parziali, $\Pi_{o}$ sulle sole variabili orbitali e $\Pi_{s}$ sulle sole variabili di spin, e per il momento dimentica lo spin. Alla configurazione $1s2s$ corrispondono i due stati $|1s2s\rangle$ e $|2s1s\rangle$, degeneri nell&rsquo;approssimazione a elettroni indipendenti: <i>«questa degenerazione è detta degenerazione di scambio»</i>. La repulsione $e^{2}/r_{12}$ la rimuove. Fra i due stati ha una matrice con elementi diagonali uguali, $a$, ed elementi fuori diagonale uguali, $b$, perché $e^{2}/r_{12}$ commuta con $\Pi_{o}$; gli autovalori sono $a\pm b$, con autovettori $(|1s2s\rangle\pm|2s1s\rangle)/\sqrt2$, cioè gli stati di simmetria orbitale definita.</p>`},
   {label:'Il segno dell integrale di scambio', body:R`
   <p>Quale dei due livelli sta più in alto dipende dal segno di $b$, l&rsquo;integrale di scambio. Picasso osserva che <i>«l&rsquo;integrale di scambio è formalmente identico a due volte l&rsquo;energia elettrostatica della distribuzione (complessa) di carica $\rho(\mathbf r)=e\,\psi_{1s}^{*}(\mathbf r)\psi_{2s}(\mathbf r)$, perciò è (reale e) positivo»</i>. Quindi lo stato orbitale simmetrico ha energia più alta. L&rsquo;interpretazione: nello stato antisimmetrico la funzione d&rsquo;onda si annulla per $\mathbf r_{1}=\mathbf r_{2}$, gli elettroni hanno meno probabilità di stare vicini, e la repulsione pesa di meno. <i>«Questo risultato è noto come 1ª regola di Hund»</i>. Sakurai scrive le stesse cose con l&rsquo;integrale diretto $I$ e l&rsquo;integrale di scambio $J$: il valor medio di $e^{2}/r_{12}$ è $I\pm J$, il segno più per il singoletto, e <i>«for the same configuration, the spin-singlet state lies higher»</i>.</p>`},
   {label:'Lo spin rientra', body:R`
   <p>Ora si rimette lo spin. La parte orbitale simmetrica va con il singoletto, quella antisimmetrica con il tripletto: ogni configurazione $(1s)(nl)$, tranne la fondamentale, dà un livello di singoletto e uno di tripletto, con il singoletto più in alto. Picasso dà i numeri: <i>«La differenza di energia fra gli stati di singoletto e tripletto provenienti dalla configurazione $1s2s$ è di 0.8 eV, mentre fra quelli della configurazione $1s2p$ è di 0.25 eV»</i>. La hamiltoniana non contiene lo spin, eppure il livello dipende dallo spin totale. Sakurai: <i>«There was no $\mathbf S_{1}\cdot\mathbf S_{2}$-term whatsoever. Yet there is a spin-dependent effect — the electrons with parallel spins have a lower energy — that arises from Fermi-Dirac statistics. We owe this explanation of the apparent spin dependence of the helium atom energy levels to Heisenberg»</i>, e la stessa origine è creduta essere quella del ferromagnetismo.</p>`}
  ]},
  {t:'plot', title:'La carica efficace',
   intro:R`<p>Valor medio della hamiltoniana dell&rsquo;elio sulla funzione di prova con carica $Z_{\rm eff}$, in eV: $27{,}2\,(Z^{2}-4Z+\tfrac58Z)$ (blu). In grigio il valore sperimentale, $-78{,}8$ eV; in arancio tratteggiato il primo ordine delle perturbazioni, $-74{,}8$ eV, che è la curva blu a $Z=2$.</p>`,
   plots:[{kind:'func2d', xr:[1,2.4], yr:[-80,-60], height:250, ticks:true,
     title:'energia variazionale dell elio',
     curves:[{f:'27.2*(x*x-4*x+0.625*x)', col:'#5aa9ff', width:2.4, label:'<H>(Z_eff)'},
             {f:'-78.8', col:'#999999', width:1.4, label:'sperimentale'},
             {f:'-74.8', col:'#ffb86b', width:1.4, dash:true, label:'primo ordine (Z = 2)'}],
     xlabel:'Z_eff', ylabel:'E (eV)'}],
   leggi:R`<p><b>Che cosa guardare.</b> La parabola ha il minimo a $Z_{\rm eff}=1{,}6875$, sotto la retta arancio e sopra quella grigia: il metodo variazionale dà sempre un limite superiore, e qui lo dà a poco più di un elettronvolt dal vero. Il punto della parabola a $Z=2$ è il risultato del primo ordine.</p>
   <p><b>Che cosa impararne.</b> La correzione al primo ordine, $+34$ eV, è grande, <span class="str" data-str="ordini-di-grandezza">un terzo dell&rsquo;energia imperturbata</span>: la repulsione fra gli elettroni non è una piccola perturbazione nel senso dei numeri. Funziona lo stesso perché la funzione imperturbata ha già la forma giusta, e basta allargarla un poco, abbassando la carica, per guadagnare altri $3$ eV.</p>`},
  {t:'prosa', title:'Paraelio e ortoelio', tag:'spettro', html:R`
  <p>Lo spettro dell&rsquo;elio si divide in due serie, i livelli di singoletto e quelli di tripletto. Picasso racconta l&rsquo;origine dei nomi: le transizioni fra le due serie <i>«sono estremamente rare (righe molto deboli), per cui per lungo tempo si ritenne che le due serie di livelli appartenessero non ad un&rsquo;unica sostanza, ma che l&rsquo;He fosse in realtà una miscela di due specie chimiche diverse, denominate appunto paraelio e ortoelio. Il dilemma era quello che non si riusciva ad isolare queste due specie chimiche»</i>.</p>
  <p>La ragione è una regola di selezione. La probabilità di transizione elettromagnetica dipende dall&rsquo;elemento di matrice di un operatore che è funzione delle sole variabili orbitali, quindi commuta con le componenti dello spin totale: $\Delta S=0$. Picasso dà anche la forma equivalente: l&rsquo;operatore commuta con $\Pi_{o}$ e non può collegare stati di simmetria orbitale diversa. E aggiunge un&rsquo;avvertenza che i manuali di solito non fanno: <i>«Entrambi gli argomenti che abbiamo presentato zoppicano un po&rsquo;, dato che ora sappiamo che l&rsquo;elettrone possiede anche un momento magnetico intrinseco»</i>, e il termine magnetico può collegare le due serie, a partire dal quadrupolo magnetico. Le deboli <i>«righe di intercombinazione»</i> esistono, ma per ragioni che la regola semplice non vede.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Nell&rsquo;elio il tripletto della configurazione $1s2s$ sta sotto il singoletto. Vuol dire che c&rsquo;è un&rsquo;interazione ferromagnetica fra gli spin?`,
    a:R`No, nel senso che la hamiltoniana non contiene nessun termine di spin. La differenza di energia viene dalla repulsione coulombiana valutata su parti orbitali di simmetria diversa, e lo spin la segue solo perché la simmetria totale è fissata. Si può però riscrivere l&rsquo;effetto come se ci fosse un&rsquo;interazione $-J(\tfrac12+2\mathbf s_{1}\cdot\mathbf s_{2})$ fra gli spin, con gli spin in unità di $\hbar$, che è il modo in cui Dirac e Landau lo esprimono. È la stessa idea che, secondo Sakurai, spiega il ferromagnetismo.`},
   {q:R`Perché la configurazione fondamentale $(1s)^{2}$ dà un solo livello e non un singoletto e un tripletto come le altre?`,
    a:R`Perché i due elettroni sono nello stesso orbitale, e la sola parte orbitale possibile, $\psi_{1s}(\mathbf r_{1})\psi_{1s}(\mathbf r_{2})$, è simmetrica: la combinazione antisimmetrica è identicamente nulla. Con la parte orbitale simmetrica lo spin deve essere nel singoletto. Non c&rsquo;è degenerazione di scambio da rimuovere, e non c&rsquo;è ortoelio con $(1s)^{2}$.`}
  ]}
]},
/* ---------------- 08 · CREARE E DISTRUGGERE ---------------- */
{ num:'08', title:'Creare e distruggere: lo spazio di Fock e le relazioni di anticommutazione', meta:'il vuoto e gli orbitali occupati · il creatore che aggiunge e il distruttore che toglie · il principio di Pauli come identita fra operatori · le anticommutazioni di Ballentine · il numero di particelle come variabile dinamica · una verifica con matrici quattro per quattro',
  blocchi:[
  {t:'prosa', title:'Perché un altro formalismo', tag:'seconda quantizzazione', html:R`
  <p>Il postulato di simmetrizzazione, scrive Ballentine, <i>«greatly simplifies the theory of many-particle states, and allows us to introduce an elegant formalism involving creation and annihilation operators. This formalism is not restricted to systems with a fixed number of particles. Instead, it treats the number of particles as a dynamical variable»</i>. La sintesi dei postulati dell&rsquo;amico di Giuseppe colloca la seconda quantizzazione fra i formalismi alternativi, con operatori di creazione e distruzione sullo spazio di Fock, e annota che <i>«anticipa il blocco [6]»</i> del programma, quello sulle particelle identiche. Nelle fonti del corso il formalismo è svolto per esteso da Ballentine nel §17.4; Sakurai lo usa nel §7.5 come una delle vie verso la teoria dei campi, e Landau lo tratta nel capitolo IX.</p>
  <p>Lo spazio di Fock ha come base il vuoto $|0\rangle$, gli stati di una particella, quelli di due particelle con la simmetria giusta, e così via. <i>«There is no need for them to span the full vector space considered in Sec. 17.1, which is physically irrelevant in light of the symmetrization postulate»</i>: gli stati di simmetria sbagliata non ci sono proprio.</p>`},
  {t:'reveal', title:'Gli operatori per i fermioni', tag:'Ballentine', steps:[
   {label:'La definizione', body:R`
   <p>Il creatore $C_{\alpha}^{\dagger}$ aggiunge una particella nell&rsquo;orbitale $\alpha$: $C_{\alpha}^{\dagger}|0\rangle=|\alpha\rangle$, $C_{\alpha}^{\dagger}|\beta\rangle=|\alpha\beta\rangle=-|\beta\alpha\rangle$, e così via, con i vettori antisimmetrici per scambio di argomenti adiacenti. In rappresentazione delle coordinate $|\alpha\beta\rangle$ è il determinante $[\varphi_{\alpha}(x_{1})\varphi_{\beta}(x_{2})-\varphi_{\beta}(x_{1})\varphi_{\alpha}(x_{2})]/\sqrt2$. Se l&rsquo;orbitale è già occupato, $C_{\alpha}^{\dagger}|\alpha\cdots\rangle$ dovrebbe essere $|\alpha\alpha\cdots\rangle$, che cambia segno scambiando i primi due argomenti ed è quindi zero: <i>«Thus the Pauli exclusion principle is automatically satisfied, it being impossible for an orbital to be more than singly occupied»</i>. Il distruttore $C_{\alpha}$, aggiunto del creatore, <i>«is to empty the $\alpha$ orbital if it is occupied, and to destroy the vector if that orbital is unoccupied»</i>.</p>`},
   {label:'Le relazioni', body:R`
   <p>Da queste definizioni Ballentine ricava le relazioni fra operatori. Creare due volte nello stesso orbitale dà zero per ogni vettore, quindi $C_{\alpha}^{\dagger}C_{\alpha}^{\dagger}=0$: il principio di Pauli è un&rsquo;identità fra operatori. Creare in due orbitali in ordine diverso dà vettori opposti, quindi l&rsquo;anticommutatore $C_{\alpha}^{\dagger}C_{\beta}^{\dagger}+C_{\beta}^{\dagger}C_{\alpha}^{\dagger}$ è nullo, la (17.19). E infine</p>
   $$C_{\alpha}C_{\beta}^{\dagger}+C_{\beta}^{\dagger}C_{\alpha}=\delta_{\alpha\beta}I,$$
   <p>la (17.21). L&rsquo;operatore $C_{\alpha}^{\dagger}C_{\alpha}$ vale $0$ se l&rsquo;orbitale è vuoto e $1$ se è occupato, ed è il numero di occupazione; la loro somma $N=\sum_{\alpha}C_{\alpha}^{\dagger}C_{\alpha}$ è il numero totale di particelle, la (17.22). Uno stato che sia una combinazione di vettori con numeri di particelle diversi non è autostato di $N$, <i>«in which case there will be a probability distribution for $N$, as there is for any dynamical variable»</i>.</p>`},
   {label:'Fermioni diversi', body:R`
   <p>Landau aggiunge una precisazione su operatori di fermioni di specie diverse: nel limite non relativistico si potrebbe ammettere che commutino o anticommutino, con gli stessi risultati, ma <i>«tenendo però presente le successive applicazioni nella teoria relativistica in cui sono possibili le trasformazioni di particelle diverse fra di loro, dobbiamo considerare come anticommutativi gli operatori di creazione e di annichilazione di fermioni diversi»</i>. Gli operatori di bosoni e fermioni commutano fra loro.</p>`}
  ]},
  {t:'prosa', title:'Una verifica con due orbitali', tag:'matrici', html:R`
  <p>Con due orbitali lo spazio di Fock dei fermioni ha dimensione quattro: il vuoto, una particella in $\alpha$, una in $\beta$, due particelle. Le relazioni di Ballentine si possono verificare con matrici esplicite. La costruzione che segue non è nelle fonti del corso, è una rappresentazione che uso come controllo: per un orbitale solo, sulla base vuoto-occupato, il distruttore è la matrice $c=\begin{pmatrix}0&1\\0&0\end{pmatrix}$; per due orbitali si pongono $C_{\alpha}=c\otimes1$ e $C_{\beta}=Z\otimes c$, con $Z={\rm diag}(1,-1)$ che conta un segno quando l&rsquo;orbitale $\alpha$ è occupato. Con queste matrici $C_{\alpha}C_{\alpha}^{\dagger}+C_{\alpha}^{\dagger}C_{\alpha}$ è l&rsquo;identità, gli anticommutatori fra $\alpha$ e $\beta$ sono nulli, $C_{\alpha}^{\dagger}C_{\alpha}^{\dagger}$ è nulla, e il numero totale $N$ è diagonale con autovalori $0,1,1,2$.</p>
  <p>Il fattore $Z$ è quello che fa funzionare tutto: senza, $C_{\alpha}$ e $C_{\beta}$ commuterebbero invece di anticommutare, e lo stato $C_{\alpha}^{\dagger}C_{\beta}^{\dagger}|0\rangle$ non sarebbe l&rsquo;opposto di $C_{\beta}^{\dagger}C_{\alpha}^{\dagger}|0\rangle$. È l&rsquo;antisimmetria del determinante, scritta come ordine degli operatori.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Perché nel formalismo di Fock non serve più antisimmetrizzare a mano?`,
    a:R`Perché gli stati sono costruiti applicando creatori al vuoto, $C_{\alpha}^{\dagger}C_{\beta}^{\dagger}\cdots|0\rangle$, e le relazioni di anticommutazione garantiscono che scambiare due creatori cambi segno al vettore. L&rsquo;antisimmetria è nell&rsquo;algebra degli operatori, non nella costruzione dello stato; e gli stati di simmetria sbagliata non fanno parte dello spazio.`},
   {q:R`Qual è la differenza fra le relazioni dei bosoni e quelle dei fermioni?`,
    a:R`Per i bosoni gli anticommutatori sono sostituiti da commutatori, come per l&rsquo;oscillatore armonico: $[a_{\alpha},a_{\beta}^{\dagger}]=\delta_{\alpha\beta}$, e $(a_{\alpha}^{\dagger})^{2}$ non è nullo, perché più bosoni possono occupare lo stesso orbitale. Ballentine tratta i due casi separatamente e osserva che <i>«a very strong analogy exists between the two formalisms»</i>. Il numero di occupazione bosonico ha tutti gli interi come autovalori, quello fermionico solo zero e uno.`}
  ]}
]},
/* ---------------- 09 · L URTO DI PARTICELLE IDENTICHE ---------------- */
{ num:'09', title:'L urto di particelle identiche', meta:'due eventi che non si distinguono · l ampiezza f di theta piu o meno f di pi meno theta · bosoni fermioni e particelle senza etichetta a novanta gradi · il caso non polarizzato · una prova sperimentale del postulato',
  blocchi:[
  {t:'prosa', title:'Due eventi indistinguibili', tag:'urto', html:R`
  <p>Nel sistema del centro di massa, un urto in cui una particella esce all&rsquo;angolo $\theta$ e l&rsquo;altra a $\pi-\theta$ si può realizzare in due modi: la particella del fascio devia di $\theta$, oppure devia di $\pi-\theta$ e al suo posto, all&rsquo;angolo $\theta$, esce la particella bersaglio. Per particelle con un&rsquo;etichetta i due eventi sono diversi e le probabilità si sommano; per particelle identiche sono lo stesso evento e si sommano le ampiezze. Ballentine: <i>«The two scattering events shown in Fig. 17.1 cannot be distinguished if the particles are identical, and so the differential cross section for this process will include both of them»</i>. La funzione d&rsquo;onda relativa deve essere simmetrica o antisimmetrica per $\mathbf r\to-\mathbf r$, e l&rsquo;ampiezza diventa $f(\theta)\pm f(\pi-\theta)$:</p>
  $$\sigma(\theta)=|f(\theta)\pm f(\pi-\theta)|^{2}=|f(\theta)|^{2}+|f(\pi-\theta)|^{2}\pm2\,{\rm Re}\big[f^{*}(\theta)f(\pi-\theta)\big],$$
  <p>la (17.6). Il segno più vale per bosoni senza spin e per due fermioni di spin $\tfrac12$ nel singoletto, il segno meno per due fermioni nel tripletto. <i>«The first and second terms of (17.6) are just the differential cross sections that would be calculated for the two events in Fig. 17.1 if the particles were distinguishable. The third term, which is a consequence of the symmetrization postulate, manifests itself most clearly as an enhancement (+ sign) or diminution (− sign) of the cross section near $\theta=\pi/2$»</i>.</p>`},
  {t:'reveal', title:'A novanta gradi', tag:'conto', steps:[
   {label:'Il raddoppio e lo zero', body:R`
   <p>A $\theta=\pi/2$ le due ampiezze coincidono, $f(\pi-\theta)$ è $f(\theta)$. Per particelle con etichetta la sezione d&rsquo;urto, contando entrambe le particelle, vale $2|f|^{2}$; per due bosoni $|2f|^{2}=4|f|^{2}$, il doppio; per due fermioni nel tripletto zero. È il fattore $2$ della diagonale della tappa 06, visto in un urto.</p>`},
   {label:'Elettroni non polarizzati', body:R`
   <p>Se il fascio e il bersaglio sono elettroni non polarizzati, i quattro stati di spin sono equiprobabili: il singoletto con peso $\tfrac14$ e il tripletto con peso $\tfrac34$. La sezione d&rsquo;urto è la media, $\tfrac14|f+g|^{2}+\tfrac34|f-g|^{2}$ con $g=f(\pi-\theta)$, cioè $|f|^{2}+|g|^{2}-{\rm Re}(f^{*}g)$. A novanta gradi vale $|f|^{2}$, la metà del valore per particelle con etichetta: l&rsquo;interferenza distruttiva del tripletto pesa tre volte quella costruttiva del singoletto.</p>`}
  ]},
  {t:'plot', title:'Sezione d urto a confronto',
   intro:R`<p>Sezione d&rsquo;urto nel centro di massa per un&rsquo;ampiezza reale di prova $f(\theta)=1/\sin^{2}(\theta/2)$, che ha l&rsquo;andamento angolare dell&rsquo;ampiezza di Rutherford ma ne trascura la fase: particelle con etichetta (grigio, $f^{2}+g^{2}$), bosoni senza spin (blu, $(f+g)^{2}$), elettroni non polarizzati (arancio, $f^{2}+g^{2}-fg$), con $g=f(\pi-\theta)$. Scala verticale tagliata a $40$.</p>`,
   plots:[{kind:'func2d', xr:[0.6,2.54], yr:[0,40], height:250, ticks:true,
     title:'sigma(theta) per un ampiezza di prova',
     curves:[{f:'Math.pow(1/Math.pow(Math.sin(x/2),2),2)+Math.pow(1/Math.pow(Math.cos(x/2),2),2)', col:'#999999', width:1.6, label:'con etichetta'},
             {f:'Math.pow(1/Math.pow(Math.sin(x/2),2)+1/Math.pow(Math.cos(x/2),2),2)', col:'#5aa9ff', width:2.4, label:'bosoni'},
             {f:'Math.pow(1/Math.pow(Math.sin(x/2),2),2)+Math.pow(1/Math.pow(Math.cos(x/2),2),2)-1/Math.pow(Math.sin(x/2)*Math.cos(x/2),2)', col:'#ffb86b', width:2.4, label:'elettroni non polarizzati'}],
     xlabel:'theta (radianti)', ylabel:'sigma (unita arbitrarie)'}],
   leggi:R`<p><b>Che cosa guardare.</b> Le tre curve sono simmetriche rispetto a $\theta=\pi/2$, come deve essere per particelle identiche: non si sa quale delle due si è rivelata. A novanta gradi la curva blu vale $16$, il doppio della grigia, $8$, e l&rsquo;arancio $4$, la metà. Lontano da novanta gradi le tre curve si avvicinano, perché una delle due ampiezze domina e il termine di interferenza conta poco.</p>
   <p><b>Che cosa impararne.</b> La differenza è misurabile senza conoscere i dettagli dell&rsquo;interazione: basta guardare la sezione d&rsquo;urto vicino a novanta gradi. Ballentine elenca l&rsquo;urto fra le prove sperimentali del postulato, accanto all&rsquo;idrogeno molecolare; per l&rsquo;ampiezza di Rutherford vera, con la sua fase logaritmica, il termine di interferenza oscilla con l&rsquo;angolo, e la curva prende il nome di Mott, che le fonti del corso aperte qui non svolgono.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Due particelle alfa si urtano a energia bassa. Quale segno va nella (17.6)?`,
    a:R`Il più: le particelle alfa hanno spin zero e sono bosoni, e la funzione d&rsquo;onda relativa deve essere simmetrica. A novanta gradi la sezione d&rsquo;urto è il doppio di quella di due particelle con etichetta. È la stessa ragione per cui due alfa hanno solo momento orbitale pari, la regola della tappa 05.`},
   {q:R`Perché nella media sugli spin il singoletto pesa un quarto e il tripletto tre quarti?`,
    a:R`Perché gli stati di spin dei due elettroni non polarizzati sono distribuiti uniformemente sui quattro stati dello spazio di spin, e tre di questi stanno nel tripletto. Per ogni stato di spin la parte orbitale ha la simmetria opposta, e l&rsquo;ampiezza ha il segno corrispondente.`}
  ]}
]},
/* ---------------- 10 · IL COMPITO DEL 30-01-2018 ---------------- */
{ num:'10', title:'Il compito del 30 gennaio 2018: due fermioni di spin un mezzo in un oscillatore anisotropo', meta:'la frequenza lungo z · gli stati di una particella con Lz definito · i livelli di due particelle con la simmetria giusta · il termine alfa Lz Sz che separa · gli stati con Lz e Sz assegnati · la condizione sul valor medio di Sx quadro · la misura di Sx',
  blocchi:[
  {t:'prosa', title:'Il testo e il riconoscimento', tag:'compito', html:R`
  <p>L&rsquo;esercizio 1 dello scritto del 30-01-2018: <i>«Si considerino due particelle indistinguibili, A e B, di spin 1/2, soggette alla Hamiltoniana»</i> $H=H_{0}(\mathbf p_{A},\mathbf r_{A})+H_{0}(\mathbf p_{B},\mathbf r_{B})+\tfrac{\alpha}{\hbar}L_{z}S_{z}$, <i>«dove $\mathbf L=\mathbf L_{A}+\mathbf L_{B}$, $\mathbf S=\mathbf S_{A}+\mathbf S_{B}$»</i> e $H_{0}=\tfrac{p^{2}}{2m}+\tfrac{m\omega^{2}}{2}(x^{2}+y^{2})+\tfrac{2m\omega^{2}}{9}z^{2}$, con $\alpha\ll\omega$. Si chiedono: (a) le energie e le degenerazioni dei livelli con $E\lt E_{\max}=\tfrac{11}{3}\hbar\omega+2\hbar\alpha$; (b) tutti gli stati per cui una misura dell&rsquo;energia dà con certezza un valore minore di $E_{\max}$, una misura di $L_{z}$ dà con certezza $\hbar$, una misura di $S_{z}$ dà $\hbar$ e $-\hbar$ con probabilità un mezzo ciascuno; (c) fra questi, lo stato con $\langle S_{x}^{2}\rangle$ nullo; (d) i valori di $S_{x}$ su di esso.</p>
  <p>Il riconoscimento: due fermioni, quindi stato totale antisimmetrico. La hamiltoniana è la somma di due termini di una particella, simmetrica, più un termine che dipende solo da $L_{z}$ e $S_{z}$ totali, anch&rsquo;esso simmetrico. Il termine in $\alpha$ è piccolo e commuta con tutto: separa i livelli di $H_{0}$ senza mescolarli. Si costruiscono i livelli di una particella, si combinano a due a due rispettando l&rsquo;antisimmetria, e solo alla fine si aggiunge $\alpha L_{z}S_{z}$.</p>`},
  {t:'reveal', title:'Una particella', tag:'oscillatore', steps:[
   {label:'La frequenza lungo z', body:R`
   <p>Il coefficiente di $z^{2}$ è $\tfrac{2m\omega^{2}}{9}$, che va confrontato con $\tfrac12m\omega_{z}^{2}$: $\omega_{z}^{2}=\tfrac49\omega^{2}$, cioè $\omega_{z}=\tfrac23\omega$. I livelli di una particella sono quindi $\varepsilon=\hbar\omega(n_{x}+n_{y}+1)+\hbar\tfrac23\omega(n_{z}+\tfrac12)$, ovvero</p>
   $$\varepsilon(n_{\perp},n_{z})=\hbar\omega\Big(n_{\perp}+\frac23n_{z}+\frac43\Big),\qquad n_{\perp}=n_{x}+n_{y}.$$
   <p>Lo stato fondamentale ha $\tfrac43\hbar\omega$; il primo eccitato, con $n_{z}=1$, $2\hbar\omega$; il secondo, con $n_{\perp}=1$, $\tfrac73\hbar\omega$, doppiamente degenere.</p>`},
   {label:'Gli stati con Lz definito', body:R`
   <p>Il livello con $n_{\perp}=1$ è generato da $|n_{x}n_{y}\rangle=|10\rangle$ e $|01\rangle$, che non sono autostati di $L_{z}$. Con gli operatori di distruzione dei due oscillatori, $L_{z}=xp_{y}-yp_{x}$ diventa $i\hbar(a_{x}a_{y}^{\dagger}-a_{x}^{\dagger}a_{y})$, che porta $|10\rangle$ in $i\hbar|01\rangle$ e $|01\rangle$ in $-i\hbar|10\rangle$. Gli autostati sono</p>
   $$|m=\pm1\rangle=\frac{1}{\sqrt2}\big(|10\rangle\pm i|01\rangle\big),$$
   <p>con autovalori $\pm\hbar$. Lo stato fondamentale e quello con $n_{z}=1$ hanno $L_{z}=0$. Chiamo $a$ lo stato fondamentale, $b$ quello con $n_{z}=1$, $c_{\pm}$ i due con $n_{\perp}=1$ e $m=\pm1$.</p>`}
  ]},
  {t:'prosa', title:'Due particelle: i livelli', tag:'livelli', html:R`
  <p>Le energie di due particelle sono somme di due energie di una particella. In unità di $\hbar\omega$: $\tfrac83$ con entrambe in $a$; $\tfrac{10}{3}$ con una in $a$ e una in $b$; $\tfrac{11}{3}$ con una in $a$ e una in $c_{\pm}$; poi $4$, con una in $a$ e l&rsquo;altra con $n_{z}=2$, o entrambe in $b$. Poiché $\alpha\ll\omega$, il livello $4\hbar\omega$ supera $E_{\max}$ comunque si separi, e restano i primi tre.</p>
  <p><b>Il livello $\tfrac83\hbar\omega$.</b> Entrambe le particelle nello stesso orbitale: la parte orbitale $a(\mathbf r_{A})a(\mathbf r_{B})$ è simmetrica, quindi lo spin è nel singoletto. Uno stato solo, con $L_{z}=0$ e $S_{z}=0$, e il termine in $\alpha$ non lo sposta.</p>
  <p><b>Il livello $\tfrac{10}{3}\hbar\omega$.</b> Due orbitali diversi, $a$ e $b$: la combinazione orbitale simmetrica va con il singoletto, l&rsquo;antisimmetrica con i tre stati del tripletto. Quattro stati, tutti con $L_{z}=0$, e il termine in $\alpha$ è nullo su tutti.</p>
  <p><b>Il livello $\tfrac{11}{3}\hbar\omega$.</b> Una particella in $a$, l&rsquo;altra in $c_{+}$ o in $c_{-}$: per ciascuna scelta, singoletto con parte orbitale simmetrica e tripletto con parte orbitale antisimmetrica, otto stati in tutto. Ora $L_{z}=m\hbar$ con $m=\pm1$, e il termine $\tfrac{\alpha}{\hbar}L_{z}S_{z}$ vale $\alpha\hbar\,mM_{S}$. Il singoletto ha $M_{S}=0$; nel tripletto il prodotto $mM_{S}$ vale $+1$ per due stati ($m=1,M_{S}=1$ e $m=-1,M_{S}=-1$), $0$ per due, $-1$ per due. Il livello si apre in tre:</p>
  $$\tfrac{11}{3}\hbar\omega-\hbar\alpha\ \ (2\ \text{stati}),\qquad\tfrac{11}{3}\hbar\omega\ \ (4\ \text{stati}),\qquad\tfrac{11}{3}\hbar\omega+\hbar\alpha\ \ (2\ \text{stati}).$$
  <p>Tutti stanno sotto $E_{\max}=\tfrac{11}{3}\hbar\omega+2\hbar\alpha$. Il conto totale è $1+4+2+4+2=13$ stati. Senza l&rsquo;antisimmetrizzazione, con particelle distinguibili, il livello più basso avrebbe quattro stati, uno per ogni combinazione degli spin: l&rsquo;errore tipico è contarli.</p>`},
  {t:'reveal', title:'Gli stati richiesti', tag:'stati', steps:[
   {label:'Punto b', body:R`
   <p>Una misura di $L_{z}$ che dà con certezza $\hbar$ esclude i livelli $\tfrac83$ e $\tfrac{10}{3}$, dove $L_{z}$ è zero, e nel livello $\tfrac{11}{3}$ seleziona la particella eccitata in $c_{+}$. Una misura di $S_{z}$ che dà $\pm\hbar$ esclude $M_{S}=0$, quindi il singoletto e lo stato del tripletto con $M_{S}=0$: lo spin è nel tripletto, con le sole componenti $M_{S}=\pm1$, e la parte orbitale è antisimmetrica. Gli stati cercati sono</p>
   $$|\psi\rangle=\frac{1}{\sqrt2}\big[a(\mathbf r_{A})c_{+}(\mathbf r_{B})-c_{+}(\mathbf r_{A})a(\mathbf r_{B})\big]\otimes\frac{1}{\sqrt2}\big(|1,1\rangle+e^{i\delta}|1,-1\rangle\big),$$
   <p>con $\delta$ qualsiasi, a meno di una fase globale. Le due componenti hanno energie $\tfrac{11}{3}\hbar\omega\pm\hbar\alpha$, entrambe sotto $E_{\max}$, quindi la misura dell&rsquo;energia dà un valore minore di $E_{\max}$ con certezza, anche se lo stato non ha energia definita.</p>`},
   {label:'Punto c', body:R`
   <p>Poiché $S_{x}$ è hermitiano, $\langle S_{x}^{2}\rangle=\|S_{x}\psi\|^{2}$, che si annulla solo se $S_{x}\psi=0$. Con $S_{x}=\tfrac12(S_{+}+S_{-})$ sul tripletto, $S_{x}|1,1\rangle$ e $S_{x}|1,-1\rangle$ sono entrambi $\tfrac{\hbar}{\sqrt2}|1,0\rangle$, quindi $S_{x}(|1,1\rangle+e^{i\delta}|1,-1\rangle)$ è $\tfrac{\hbar}{\sqrt2}(1+e^{i\delta})|1,0\rangle$, e $\langle S_{x}^{2}\rangle=\tfrac{\hbar^{2}}{2}(1+\cos\delta)$. Si annulla per $e^{i\delta}=-1$:</p>
   $$|\psi_{c}\rangle=\frac{1}{\sqrt2}\big[a\,c_{+}-c_{+}\,a\big]\otimes\frac{1}{\sqrt2}\big(|1,1\rangle-|1,-1\rangle\big),$$
   <p>e nella base degli spin singoli la parte di spin è $(|{\uparrow\uparrow}\rangle-|{\downarrow\downarrow}\rangle)/\sqrt2$. È lo stato del tripletto con $M=0$ lungo l&rsquo;asse $x$.</p>`},
   {label:'Punto d', body:R`
   <p>Lo stato è autostato di $S_{x}$ con autovalore zero, quindi la misura dà $0$ con probabilità uno. Il punto (d) è una verifica del (c): chi ha trovato uno stato con $\langle S_{x}^{2}\rangle=0$ che non sia autostato di $S_{x}$ ha sbagliato un segno.</p>`},
   {label:'Che cosa succede dopo', body:R`
   <p>Il testo non lo chiede, ma lo stato del punto (c) non è stazionario: le due componenti hanno energie diverse di $2\hbar\alpha$, e al tempo $t$ la fase relativa diventa $\delta(t)=\pi+2\alpha t$. Il valor medio $\langle S_{x}^{2}\rangle$ cresce come $\tfrac{\hbar^{2}}{2}(1-\cos2\alpha t)$: lo spin totale precede attorno a $z$, perché il termine $\tfrac{\alpha}{\hbar}L_{z}S_{z}$ con $L_{z}=\hbar$ è un campo efficace lungo $z$ che agisce sullo spin totale.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Se le due particelle fossero distinguibili, quanti stati avrebbe il livello $\tfrac{10}{3}\hbar\omega$?`,
    a:R`Otto: la particella A in $a$ e la B in $b$, o il contrario, per quattro stati di spin ciascuno. L&rsquo;antisimmetrizzazione dimezza il conto, $1+3=4$, perché delle due combinazioni orbitali ciascuna può andare solo con lo spin di simmetria opposta.`},
   {q:R`Perché il termine $\tfrac{\alpha}{\hbar}L_{z}S_{z}$ non mescola gli stati dei livelli diversi di $H_{0}$?`,
    a:R`Perché commuta con $H_{0}$: $L_{z}$ totale commuta con l&rsquo;oscillatore, che è a simmetria cilindrica attorno a $z$, e $S_{z}$ con tutto ciò che non contiene lo spin. Gli autostati di $H_{0}$ si possono scegliere con $L_{z}$ e $S_{z}$ definiti, ed è quello che si è fatto usando gli stati $c_{\pm}$ e i multipletti di spin; su questa base il termine in $\alpha$ è diagonale e sposta i livelli esattamente, non solo al primo ordine.`}
  ]}
]},
/* ---------------- 11 · IL COMPITO DEL 18-09-2017 ---------------- */
{ num:'11', title:'Il compito del 18 settembre 2017: due bosoni di spin uno in una scatola quadrata', meta:'la lettura del testo · la scala dei termini · i multipletti di spin uno e la loro simmetria · lo stato fondamentale doppio · i primi due eccitati · la perturbazione con la distanza al quadrato e il segno di beta · gli integrali dati dal testo',
  blocchi:[
  {t:'prosa', title:'Il testo e una lettura da dichiarare', tag:'compito', html:R`
  <p>L&rsquo;esercizio 2 dello scritto del 18-09-2017: <i>«Si considerino due particelle identiche di massa $m$ e spin 1 vincolate a muoversi in due dimensioni nel dominio $-L/2\leq x\leq L/2$, $-L/2\leq y\leq L/2$»</i>, con una hamiltoniana fatta dell&rsquo;energia cinetica delle due particelle e di un termine di spin, e con $0\lt\omega\ll\hbar/(mL^{2})$. Si chiedono (1) l&rsquo;energia e la degenerazione dello stato fondamentale e dei primi due stati eccitati, e (2) l&rsquo;energia dello stato fondamentale al primo ordine in $\beta$ quando si aggiunge $V=\tfrac{\beta}{L^{2}\hbar^{2}}(x_{1}-x_{2})^{2}S_{1z}S_{2z}$, <i>«dove il parametro $\beta$ può essere sia positivo, sia negativo»</i>. Il testo fornisce gli integrali $I_{n}=\int_{0}^{\pi/2}x^{2}\cos^{n}x\,dx$, fra cui $I_{2}=\tfrac{\pi}{48}(\pi^{2}-6)$.</p>
  <p>La trascrizione del termine di spin è guasta. La leggo come</p>
  $$H_{\rm spin}=\omega\Big(\frac{2}{3\hbar}\,\mathbf S_{1}\cdot\mathbf S_{2}-S_{1z}-S_{2z}\Big),$$
  <p>che ha le dimensioni giuste di un&rsquo;energia ed è simmetrica nelle due particelle, come richiede la tappa 01. Le soluzioni ufficiali nel materiale del corso sono pagine senza testo, e non ho potuto confrontare la lettura.</p>
  <p>Il riconoscimento: due bosoni, quindi stato totale simmetrico; la parte orbitale e quella di spin hanno la stessa simmetria. La hamiltoniana separa orbite e spin; il termine di spin dipende da $S^{2}$ e da $S_{z}$, quindi è diagonale nella base accoppiata. La condizione $\omega\ll\hbar/(mL^{2})$ dice che le energie di spin sono piccole rispetto ai salti fra livelli della scatola: i primi livelli stanno tutti nello stato orbitale più basso.</p>`},
  {t:'reveal', title:'Le due parti dello spettro', tag:'livelli', steps:[
   {label:'La scatola', body:R`
   <p>Per una particella nella scatola $L\times L$ i livelli sono $\varepsilon_{0}(n_{x}^{2}+n_{y}^{2})$ con $\varepsilon_{0}=\pi^{2}\hbar^{2}/2mL^{2}$ e $n_{x},n_{y}\geq1$. Il più basso è $2\varepsilon_{0}$, poi $5\varepsilon_{0}$, doppio. Per due particelle lo stato orbitale più basso ha entrambe nello stato $(1,1)$, energia $4\varepsilon_{0}$, ed è simmetrico; il successivo ha energia $7\varepsilon_{0}$. Il salto $3\varepsilon_{0}=3\pi^{2}\hbar^{2}/2mL^{2}$ è molto maggiore di $\hbar\omega$ per l&rsquo;ipotesi del testo.</p>`},
   {label:'Lo spin', body:R`
   <p>Per due spin uno, $\mathbf S_{1}\cdot\mathbf S_{2}=\tfrac12(S^{2}-S_{1}^{2}-S_{2}^{2})=\tfrac{\hbar^{2}}{2}[S(S+1)-4]$, che vale $\hbar^{2}$ per $S=2$, $-\hbar^{2}$ per $S=1$, $-2\hbar^{2}$ per $S=0$. Il termine di spin, in unità di $\hbar\omega$, vale quindi $\tfrac13[S(S+1)-4]-M$:</p>
   $$S=2:\ \tfrac23-M,\qquad S=1:\ -\tfrac23-M,\qquad S=0:\ -\tfrac43 .$$
   <p>Per la regola di Landau della tappa 05, i multipletti con $S=2$ e $S=0$ sono simmetrici per scambio degli spin, quello con $S=1$ antisimmetrico.</p>`}
  ]},
  {t:'prosa', title:'Punto 1: lo stato fondamentale e i primi due eccitati', tag:'soluzione', html:R`
  <p>Nello stato orbitale più basso, simmetrico, lo spin deve essere simmetrico: $S=2$ o $S=0$. Le energie di spin disponibili sono $\tfrac23-M$ per $M=2,1,0,-1,-2$, cioè $-\tfrac43,-\tfrac13,\tfrac23,\tfrac53,\tfrac83$, e $-\tfrac43$ per $S=0$. Il valore più basso, $-\tfrac43$, è raggiunto da due stati: $|S=2,M=2\rangle$ e $|S=0,M=0\rangle$.</p>
  $$E_{0}=4\varepsilon_{0}-\tfrac43\hbar\omega\ \ (\text{degenere }2),\qquad E_{1}=4\varepsilon_{0}-\tfrac13\hbar\omega\ \ (S=2,M=1),\qquad E_{2}=4\varepsilon_{0}+\tfrac23\hbar\omega\ \ (S=2,M=0).$$
  <p>La trappola è lo stato con $S=1$ e $M=1$, che ha l&rsquo;energia di spin più bassa di tutte, $-\tfrac53\hbar\omega$: è permesso solo con una parte orbitale antisimmetrica, cioè con le due particelle in orbitali diversi, e costa almeno $3\varepsilon_{0}$ in più. Con particelle distinguibili lo stato fondamentale sarebbe quello, e la risposta sarebbe sbagliata. La degenerazione doppia dello stato fondamentale è un&rsquo;uguaglianza esatta fra i due valori, voluta dal coefficiente $\tfrac{2}{3\hbar}$; il punto 2 serve a vedere come la rompe una perturbazione.</p>`},
  {t:'reveal', title:'Punto 2: la perturbazione', tag:'perturbazioni', steps:[
   {label:'La matrice due per due', body:R`
   <p>Lo stato fondamentale è degenere, quindi si diagonalizza $V$ nel sottospazio generato da $|\Phi_{11}\rangle|2,2\rangle$ e $|\Phi_{11}\rangle|0,0\rangle$, con $\Phi_{11}$ lo stato orbitale con entrambe le particelle in $(1,1)$. L&rsquo;operatore $S_{1z}S_{2z}$ conserva $M$, e i due stati hanno $M=2$ e $M=0$: l&rsquo;elemento fuori diagonale è zero, la matrice è già diagonale. Gli elementi diagonali sono prodotti di un fattore orbitale e di uno di spin.</p>`},
   {label:'Il fattore di spin', body:R`
   <p>Su $|2,2\rangle=|1,1\rangle$ il valor medio di $S_{1z}S_{2z}$ è $\hbar^{2}$. Su $|0,0\rangle=(|1,-1\rangle-|0,0\rangle+|-1,1\rangle)/\sqrt3$ è $\tfrac{\hbar^{2}}{3}(-1+0-1)=-\tfrac23\hbar^{2}$. I due stati di spin hanno lo stesso $S_{1}\cdot S_{2}$ efficace nel termine imperturbato e reagiscono in modo opposto a $V$.</p>`},
   {label:'Il fattore orbitale', body:R`
   <p>Con la funzione $\psi_{1}(x)=\sqrt{2/L}\cos(\pi x/L)$ della buca centrata, $\langle x\rangle$ è zero e quindi $\langle(x_{1}-x_{2})^{2}\rangle=2\langle x^{2}\rangle$. Sostituendo $u=\pi x/L$, $\langle x^{2}\rangle=\tfrac{2}{L}\big(\tfrac{L}{\pi}\big)^{3}\cdot2I_{2}$, che con l&rsquo;integrale dato vale $L^{2}\big(\tfrac{1}{12}-\tfrac{1}{2\pi^{2}}\big)$. Quindi $\langle(x_{1}-x_{2})^{2}\rangle=L^{2}\big(\tfrac16-\tfrac{1}{\pi^{2}}\big)$, circa $0{,}0653\,L^{2}$: la stessa quantità della tappa 06 per la buca non centrata, come deve essere, perché la distanza fra le particelle non dipende da dove si mette l&rsquo;origine.</p>`},
   {label:'Il segno di beta', body:R`
   <p>Le correzioni al primo ordine sono</p>
   $$\Delta E_{|2,2\rangle}=\beta\Big(\frac16-\frac{1}{\pi^{2}}\Big),\qquad\Delta E_{|0,0\rangle}=-\frac23\beta\Big(\frac16-\frac{1}{\pi^{2}}\Big).$$
   <p>Se $\beta\gt0$ lo stato fondamentale è quello con $S=0$, con energia $4\varepsilon_{0}-\tfrac43\hbar\omega-\tfrac23\beta\big(\tfrac16-\tfrac{1}{\pi^{2}}\big)$; se $\beta\lt0$ è quello con $S=2$, $M=2$, con energia $4\varepsilon_{0}-\tfrac43\hbar\omega+\beta\big(\tfrac16-\tfrac{1}{\pi^{2}}\big)$, cioè $-|\beta|\big(\tfrac16-\tfrac{1}{\pi^{2}}\big)$ rispetto al livello imperturbato. È il motivo per cui il testo insiste che $\beta$ può avere entrambi i segni: la risposta cambia stato, non solo valore.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Se le due particelle fossero fermioni di spin $\tfrac32$, con un termine di spin analogo, quale simmetria avrebbe la parte orbitale con $S=3$?`,
    a:R`Dispari. Per la regola di Landau la parte orbitale si moltiplica per $(-1)^{S}$, qualunque sia lo spin delle particelle; con $S=3$ deve essere antisimmetrica, quindi le due particelle non potrebbero stare entrambe nello stato $(1,1)$. Per fermioni di spin $\tfrac32$ i multipletti con $S=3$ e $S=1$ sono simmetrici negli spin, e la funzione totale cambia segno come deve.`},
   {q:R`Perché il termine $V$ contiene $(x_{1}-x_{2})^{2}$ e non, per esempio, $x_{1}^{2}$?`,
    a:R`Perché un&rsquo;osservabile per particelle identiche deve essere simmetrica per scambio, e $x_{1}^{2}$ da solo non lo è. Anche il fattore di spin, $S_{1z}S_{2z}$, è simmetrico, e il prodotto pure. Il testo, scrivendo i pedici, sembra distinguere le particelle, ma l&rsquo;operatore che scrive non le distingue.`}
  ]}
]},
/* ---------------- 12 · DOVE LE FONTI DIVERGONO ---------------- */
{ num:'12', title:'Dove le fonti divergono, e le domande d orale', meta:'da dove viene la simmetrizzazione fonte per fonte · che cosa e postulato e che cosa e dedotto · due modi di usare l elio · la critica di Ballentine e chi colpisce · che cosa non si e potuto aprire · domande d orale',
  blocchi:[
  {t:'prosa', title:'Fonte per fonte', tag:'fonti', html:R`
  <p>La tabella mette in fila, per ciascuna fonte, da dove viene la regola che sceglie gli stati simmetrici o antisimmetrici, come è trattato il legame con lo spin, e che cosa la fonte usa come prova.</p>
  <table class="tab">
  <tr><th>fonte</th><th>la dicotomia simmetrico o antisimmetrico</th><th>spin e statistica</th><th>prova citata</th></tr>
  <tr><td>Picasso §15.4</td><td>non imposta: la teoria ammette entrambe le scelte</td><td>enunciato per fermioni e bosoni</td><td>lo spettro dell&rsquo;elio, assenza del tripletto $(1s)^{2}$</td></tr>
  <tr><td>Dirac §54</td><td>«può accadere»; altre simmetrie possibili ma non osservate</td><td>da fatti sperimentali specie per specie</td><td>accordo con l&rsquo;esperienza atomica, legge di Planck</td></tr>
  <tr><td>Landau §61</td><td>dedotta: fase con quadrato uno</td><td>dimostrato in teoria relativistica (vol. IV)</td><td>particelle composte</td></tr>
  <tr><td>Shankar §10.3</td><td>dedotta: misura che non ordina la coppia</td><td>teorema in teoria dei campi, non in una dimensione</td><td>esperimento con due pioni in una buca</td></tr>
  <tr><td>Sakurai cap. 7</td><td>«an empirical fact»</td><td>postulato empirico, teorema in teoria relativistica</td><td>esempio sperimentale su $^{8}$Be, anioni in due dimensioni</td></tr>
  <tr><td>Griffiths §5.1</td><td>«a completely new fundamental law»</td><td>assioma non relativistico</td><td>legame covalente</td></tr>
  <tr><td>Ballentine cap. 17</td><td>non deducibile; le deduzioni correnti sono criticate</td><td>parte del postulato</td><td>H$_{2}$ orto e para, urto, $^{14}$N per i neutroni</td></tr>
  </table>
  <p>Gli appunti degli studenti si dividono come i libri. Quelli di Pompili, dalle lezioni di Martinelli e Testa, traducono Sakurai e parlano di <i>«postulato empirico»</i>; quelli di Iannelli seguono la deduzione, con l&rsquo;argomento della fase. Le dispense in lucidi scrivono <i>«si verifica sperimentalmente»</i>. Nella sintesi dell&rsquo;amico di Giuseppe la riga «particelle identiche» segna un trattino nella colonna di von Neumann e Dirac; per Dirac il trattino va letto come «non è un postulato», perché il capitolo 9 dei Principi tratta l&rsquo;argomento per esteso e lo fonda sui fatti sperimentali. Per la collocazione nel corso del professore la sintesi scrive un punto interrogativo, e non ho altre fonti per scioglierlo.</p>`},
  {t:'reveal', title:'Due modi di usare l elio', tag:'confronto', steps:[
   {label:'Picasso: l elio come prova', body:R`
   <p>In Picasso l&rsquo;elio compare due volte, con due funzioni diverse. Nel §15.4 serve a stabilire il principio di Pauli: lo spettro non contiene il tripletto $(1s)^{2}$, e da questo si legge che gli stati di due elettroni sono antisimmetrici. Nel §16.1 è l&rsquo;applicazione: la degenerazione di scambio, l&rsquo;integrale di scambio, il paraelio e l&rsquo;ortoelio. L&rsquo;ordine dice che per Picasso il principio viene dopo un dato.</p>`},
   {label:'Sakurai e Griffiths: l elio come applicazione', body:R`
   <p>In Sakurai e in Griffiths la regola è posta prima, e l&rsquo;elio è il primo problema realistico in cui la si usa: i numeri del primo ordine e del variazionale, il singoletto più alto del tripletto, la spiegazione di Heisenberg. Lo stesso spettro serve in un libro a fondare la regola, negli altri a verificarne le conseguenze. Non c&rsquo;è contraddizione, ma all&rsquo;orale conviene sapere in quale dei due ordini si sta raccontando.</p>`},
   {label:'Chi colpisce la critica di Ballentine', body:R`
   <p>Il primo argomento che Ballentine critica, quello della fase o della richiesta $P_{ij}|\Psi\rangle=c|\Psi\rangle$, è quello di Landau, di Shankar e degli appunti di Iannelli. Il secondo, quello delle traiettorie e dell&rsquo;indeterminazione, è usato da Landau e da Sakurai come motivazione, e da Griffiths con il detective. Ballentine non nomina nessuno di questi testi: scrive <i>«many books»</i>. La critica non tocca i risultati, che sono gli stessi in tutte le fonti, ma lo statuto logico: se il postulato si deduce, le paraparticelle sono impossibili; se non si deduce, la loro assenza è un fatto da verificare, e Ballentine cita Messiah e Greenberg per le verifiche sulle particelle instabili.</p>`}
  ]},
  {t:'prosa', title:'Che cosa non si è potuto aprire', tag:'fonti', html:R`
  <p>Il Sakurai italiano (Zanichelli 1994), dove le particelle identiche sono il capitolo 6, è una scansione: le citazioni vengono dalla seconda edizione inglese. Il Cohen-Tannoudji, che la mappa indica e che nella sintesi dell&rsquo;amico ha il postulato di simmetrizzazione nel capitolo XIV, è una scansione illeggibile. Picasso rinvia al capitolo 17 per l&rsquo;urto di particelle identiche, che non è fra le pagine ritagliate per questo movimento: la tappa 09 segue Ballentine. Il capitolo 18 di Ballentine, sui sistemi a molti fermioni, è nel materiale ma il movimento non lo svolge. Le soluzioni ufficiali dei due compiti risolti nelle tappe 10 e 11 sono pagine senza testo; nella seconda la trascrizione del termine di spin è guasta, e la lettura adottata è dichiarata nella tappa. La formula dell&rsquo;operatore di scambio di spin nel Landau è illeggibile nell&rsquo;OCR; la tappa 07 ne dà la forma che ha gli autovalori giusti. La rappresentazione con matrici degli operatori di creazione nella tappa 08 non viene dalle fonti, ed è dichiarata come controllo.</p>`},
  {t:'collaudo', title:'Domande d orale', items:[
   {q:R`Perché lo stato fondamentale dell&rsquo;elio è un singoletto, se la hamiltoniana non contiene lo spin?`,
    a:R`Perché i due elettroni stanno nello stesso orbitale $1s$, quindi la parte orbitale è simmetrica, e lo stato totale di due fermioni deve essere antisimmetrico: la parte di spin è il singoletto. La hamiltoniana non sceglie lo spin; lo sceglie la simmetria. Picasso usa proprio l&rsquo;assenza del tripletto $(1s)^{2}$ nello spettro per stabilire il principio di Pauli.`},
   {q:R`Che cos&rsquo;è la degenerazione di scambio, e chi la rimuove?`,
    a:R`Per particelle senza interazione, gli stati $|ab\rangle$ e $|ba\rangle$ hanno la stessa energia, e ogni loro combinazione dà gli stessi risultati di misura per le osservabili di singola particella: Sakurai la presenta come la difficoltà che la natura risolve <i>«quite ingeniously»</i>. La simmetrizzazione la rimuove come fatto di principio, perché per una data specie solo una combinazione è permessa. Come fatto di energia, nell&rsquo;elio la rimuove la repulsione $e^{2}/r_{12}$, che ha valori medi diversi sulle due combinazioni: $a+b$ e $a-b$ nella matrice di Picasso, $I\pm J$ in Sakurai.`},
   {q:R`Due elettroni nel tripletto si respingono di più o di meno che nel singoletto, a parità di orbitali?`,
    a:R`Di meno, nel senso che la repulsione media è minore: nel tripletto la parte orbitale è antisimmetrica e si annulla quando gli elettroni coincidono, quindi stanno in media più lontani, e il valor medio di $e^{2}/r_{12}$ è $I-J$ invece di $I+J$. È per questo che il tripletto ha energia più bassa. La «forza di scambio» di Griffiths è lo stesso effetto visto sul valor medio del quadrato della distanza.`},
   {q:R`Che cosa cambia in una dimensione e in due dimensioni?`,
    a:R`In una dimensione, osserva Shankar, non si può definire lo spin, e il teorema di spin e statistica, dimostrato in tre dimensioni, non si applica: la statistica di una specie si può solo misurare, per esempio dalle correlazioni in una buca. In due dimensioni, ricorda Sakurai in nota, possono esistere gli anioni, con proprietà statistiche intermedie fra bosoni e fermioni. La dicotomia simmetrico o antisimmetrico è quindi legata alle tre dimensioni dello spazio.`},
   {q:R`Come si risponde alla domanda «energie e degenerazioni dei primi livelli di due particelle identiche di spin $s$»?`,
    a:R`In tre passi. Si trovano i livelli di una particella e le loro somme per due particelle, distinguendo le coppie con lo stesso orbitale, che danno solo parte orbitale simmetrica, da quelle con orbitali diversi, che danno una combinazione simmetrica e una antisimmetrica. Per ogni parte orbitale si scelgono gli spin totali $S$ permessi dalla regola di Landau: parte orbitale simmetrica con $S$ pari, antisimmetrica con $S$ dispari, qualunque sia $s$. Infine si aggiungono i termini di spin della hamiltoniana, che sono diagonali nella base accoppiata se dipendono da $\mathbf S_{1}\cdot\mathbf S_{2}$ e da $S_{z}$. I due compiti delle tappe 10 e 11 seguono questo schema con $s=\tfrac12$ e $s=1$, e in entrambi la trappola è lo stato di spin più favorevole che la simmetria vieta nello stato orbitale più basso.`},
   {q:R`Perché la statistica di un atomo di $^{4}$He è quella di Bose, se è fatto di fermioni?`,
    a:R`Perché scambiare due atomi vuol dire scambiare simultaneamente sei coppie di fermioni, due protoni, due neutroni e due elettroni, e ogni scambio di fermioni dà un segno meno: il segno totale è $(-1)^{6}=+1$. Landau lo enuncia per le particelle composte in generale: conta la parità del numero di fermioni elementari. La regola regge finché le particelle composte sono abbastanza lontane perché la loro struttura interna non conti; è la stessa condizione per cui si può dimenticare la simmetrizzazione fra elettroni di atomi lontani.`}
  ]}
]}

/* --- blocco PLOT: la figura non decora, si legge. Ogni plot porta una chiave di lettura. --- */
function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){

  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';

  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');

    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionSvelabile(title, tag, html, sol){
  var wrap=document.createElement('section'); wrap.className='section';

    c.appendChild(btn); c.appendChild(a);
  }
  wrap.appendChild(c); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    /* DUE SCHEMI, NON UNO — scoperto il 2026-10-06 provando le pagine vive. I movimenti
       scritti per primi (em-01..03, me-10b, i collaudi di gd-01..09 e di quattro em)
       usano una forma piu' semplice: `reveal` e `prolessi` con un solo `html`,
       `esercizio` e `collaudo` con `html` + `sol`. Il renderer ne conosceva una sola e
       chiamava `steps.forEach` su `undefined`: TypeError, e la tappa si fermava li' —
       62 blocchi in 17 movimenti su 74. Non si riscrive il contenuto per far contento
       il renderer: e' il renderer che deve leggere cio' che c'e'.
       E in fondo un ramo che NON muore: uno schema nuovo di domani deve far vedere un
       avviso in quella sezione, non spegnere la pagina sotto di se'. */
    try{
      if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
      else if(b.t==='prolessi') m.appendChild(b.rotte ? sectionProlessi(b)
                                   : sectionProsa(b.title,'prolessi',b.html));
      else if(b.t==='reveal')m.appendChild(b.steps ? sectionReveal(b.title,b.tag,b.steps)
                                   : sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='esercizio') m.appendChild(b.steps ? sectionEsercizio(b)
                                   : sectionSvelabile(b.title,'esercizio',b.html,b.sol));
      else if(b.t==='collaudo')  m.appendChild(b.items ? sectionCollaudo(b.title,b.items)
                                   : sectionSvelabile(b.title,'provi, poi riveli',b.html,b.sol));
      else if(b.t==='plot')      m.appendChild(sectionPlot(b));
      else m.appendChild(sectionProsa(b.title||'(blocco)', 'tipo sconosciuto: '+b.t,
                                      b.html||''));
    }catch(err){
      var avv=document.createElement('section'); avv.className='section';
      avv.innerHTML='<h3>'+(b.title||'(blocco)')+'<span class="tag">non reso</span></h3>'
        +'<p style="color:#ff6b6b">Questo blocco non si &egrave; potuto rendere ('
        +b.t+': '+err.message+'). Il resto della tappa continua sotto.</p>';
      m.appendChild(avv);
    }
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* I POP-UP DEGLI STRUMENTI. `cablaStrumenti` esisteva dal 18-09 e non la chiamava
     nessuno: i 229 rimandi del percorso erano <span> senza handler, e il clic non
     faceva niente. Nessun controllo poteva vederlo — la sintassi era valida, le schede
     c'erano tutte, le formule rendevano: il guasto esisteva solo a pagina viva. Qui, e
     dopo ogni inserimento successivo, perche' la tappa si rimonta da capo a ogni
     cambio e gli handler vanno riattaccati al DOM nuovo. */
  cablaStrumenti(m);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}

/* deep-link: mq-22-particelle-identiche.html#03 apre direttamente la tappa 03 */
window.addEventListener('DOMContentLoaded', function(){
  var h=(location.hash||'').replace('#','');
  showTappa(byId[h]?h:'00');
});
window.addEventListener('hashchange', function(){
  var h=(location.hash||'').replace('#','');
  if(byId[h]) showTappa(h);
});
</script>
