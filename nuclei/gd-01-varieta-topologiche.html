<style>
  :root{
    --bg:#0e1117; --panel:#161b22; --panel2:#1c232d; --border:#2b333d;
    --txt:#eef3f8; --muted:#b9c4d1; --accent:#4c8dff; --accent2:#8fb0ff;
    --ok:#2ea043; --okbg:#10331b; --warn:#d8a13a; --warnbg:#332a10;
    --gram:#5eead4; --grambg:#0f2a26;
    --pro:#b98cff; --probg:#1a1430; --proline:#2a2247; --proedge:#3a2d5c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    font-size:17px;line-height:1.55;}
  a{color:var(--accent2);}
  .banner{background:var(--panel2);border-bottom:1px solid var(--border);color:var(--muted);
    font-size:.8rem;font-weight:600;text-align:center;padding:8px 12px;letter-spacing:.3px;}
  .banner b{color:var(--accent2);}
  .shell{display:flex;max-width:1180px;margin:0 auto;align-items:flex-start;}

  /* ---- SIDEBAR ---- */
  .sidebar{width:280px;flex:0 0 280px;padding:20px 12px 60px;position:sticky;top:0;
    max-height:100vh;overflow-y:auto;border-right:1px solid var(--border);}
  .sidebar h2{font-size:.72rem;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);
    margin:18px 8px 8px;}
  .navitem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:none;
    background:transparent;color:var(--txt);padding:9px 10px;border-radius:8px;cursor:pointer;
    font-size:.9rem;transition:.12s;border:1px solid transparent;}
  .navitem:hover{background:var(--panel2);}
  .navitem.active{background:#13233f;border-color:var(--accent);color:#fff;}
  .navitem .dot{width:7px;height:7px;border-radius:50%;background:transparent;flex:0 0 7px;
    border:1px solid var(--border);}
  .navitem.seen .dot{background:var(--ok);border-color:var(--ok);}
  .navitem .nx{color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto;}

  /* ---- MAIN ---- */
  .main{flex:1 1 auto;min-width:0;padding:24px 30px 90px;max-width:860px;}
  h1{font-size:1.5rem;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:.92rem;margin:0 0 18px;}
  .sfhead{border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:8px;}
  .sfhead h1{font-size:1.55rem;}
  .meta{color:var(--muted);font-size:.82rem;margin-top:6px;}

  .section{margin:26px 0;}
  .section > h3{font-size:1.02rem;color:var(--accent2);margin:0 0 10px;
    display:flex;align-items:center;gap:10px;}
  .section > h3 .tag{font-size:.66rem;font-weight:700;letter-spacing:.4px;background:var(--panel2);
    border:1px solid var(--border);color:var(--muted);padding:2px 8px;border-radius:20px;
    text-transform:uppercase;}
  /* --- blocchi figura --- */
  .section > h3 .tag.plottag{background:#101f2e;border-color:#1f3c57;color:#7ab8e0;}
  .plot-intro{color:var(--muted);font-size:.95rem;margin:0 0 12px;}
  .plot-row{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;
    background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;}
  .plot-row.due .plot-box{flex:1 1 300px;min-width:280px;}
  .plot-box{max-width:560px;}
  .plot-leggi{margin-top:10px;background:var(--panel2);border:1px solid var(--border);
    border-left:3px solid #4a8fc7;border-radius:0 10px 10px 0;padding:11px 14px;
    font-size:.93rem;color:var(--muted);}
  .plot-leggi b{color:#7ab8e0;}
  .plot-err{color:#ff6b6b;font-size:.85rem;}
  .open-body{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}

  .open-body ul{margin:.4em 0;padding-left:1.2em;} .open-body li{margin:.35em 0;}

  .note{background:var(--panel2);border-left:3px solid var(--muted);border-radius:6px;

  .note b{color:#ff9d6b;}
  .note.warn{background:var(--warnbg);border-left-color:var(--warn);color:#e0b85a;}
  .note.warn b{color:#f0c25a;}

  /* ---- GRAMMATICA ---- */
  .gramwrap{background:var(--grambg);border:1px solid #1f4d47;border-radius:12px;padding:6px 6px;}
  table.gramtab{border-collapse:collapse;width:100%;font-size:.92rem;}
  table.gramtab td{padding:9px 12px;vertical-align:top;border-bottom:1px solid #17332e;}
  table.gramtab tr:last-child td{border-bottom:none;}
  table.gramtab td.gs{white-space:nowrap;color:var(--gram);width:1%;
    border-right:1px solid #17332e;font-variant-numeric:tabular-nums;}
  .section > h3 .tag.gramtag{background:var(--grambg);border-color:#1f4d47;color:var(--gram);}

  /* ---- STRUMENTI (repertorio condiviso: la scheda si apre DENTRO la frase) ----
     Nessun accento nuovo: riusa il verde della grammatica, perche' uno strumento
     richiamato e' grammatica gia' spiegata altrove, non una quinta specie di blocco. */
  .str{color:var(--gram);border-bottom:1px dashed var(--gram);cursor:pointer;}
  .str:hover{background:var(--grambg);}
  .str::after{content:"\2666";font-size:.62em;vertical-align:.42em;margin-left:2px;opacity:.8;}
  .str.aperto::after{content:"\2715";}
  .str.rotto{color:#ff6b6b;border-bottom-color:#ff6b6b;cursor:help;}
  /* la scheda e' uno SPAN in display:block, non un div: i rimandi cadono dentro

  .strcard{display:block;margin:10px 0;background:var(--grambg);border:1px solid #1f4d47;

  .strcard .sk{color:var(--gram);font-weight:600;}

  .prowrap{background:var(--probg);border:1px solid var(--proedge);border-radius:12px;padding:4px 4px 8px;}

  table.protab{border-collapse:collapse;width:100%;font-size:.92rem;}
  table.protab td{padding:10px 12px;vertical-align:top;border-bottom:1px solid var(--proline);}
  table.protab tr:last-child td{border-bottom:none;}
  table.protab td.pd{white-space:nowrap;color:var(--pro);width:1%;font-weight:700;font-size:.78rem;

  .rsteps{display:flex;flex-direction:column;gap:12px;}

  .rlabel{font-size:.7rem;font-weight:700;letter-spacing:.4px;color:var(--accent);

  .rstep p:first-of-type{margin-top:0;} .rstep p:last-child{margin-bottom:0;}

  .testo{background:#13233f;border:1px solid #2b4877;border-radius:12px;padding:14px 18px;margin-bottom:14px;}
  .testo .src{display:block;font-size:.74rem;font-style:italic;color:var(--accent2);margin-bottom:8px;

  .esame-nota{font-size:.9rem;color:var(--muted);font-style:italic;margin-top:12px;padding-left:12px;

  .reveal-btn{background:var(--accent);color:#fff;border:none;padding:11px 18px;border-radius:10px;

  .reveal-btn.small:hover:not(:disabled){border-color:var(--accent);}
  .reveal-btn:disabled,.reveal-btn.done{background:var(--panel2);color:var(--muted);

  /* ---- COLLAUDO ---- */
  .collaudo-item{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 18px;margin-bottom:12px;}
  .cq{margin-bottom:10px;}
  .ca{margin-top:12px;background:var(--okbg);border:1px solid #235c33;border-radius:8px;
    padding:10px 14px;font-size:.94rem;}
  .ca b{color:#5fd980;}

  /* ---- PREV / NEXT ---- */
  .prevnext{display:flex;justify-content:space-between;gap:12px;margin-top:40px;
    border-top:1px solid var(--border);padding-top:20px;}
  .pnbtn{flex:1 1 0;background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:12px 16px;cursor:pointer;color:var(--txt);text-align:left;transition:.14s;font:inherit;}
  .pnbtn:hover{border-color:var(--accent);background:var(--panel2);}
  .pnbtn.next{text-align:right;}
  .pnbtn .k{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .pnbtn .t{font-weight:600;color:var(--accent2);}
  .pnbtn:disabled{opacity:.35;cursor:default;border-color:var(--border);background:var(--panel);}

  code{background:var(--panel2);border:1px solid var(--border);border-radius:5px;
    padding:1px 5px;font-size:.85em;color:var(--accent2);}
  .katex{font-size:1.02em;color:var(--txt);} .katex-display{margin:.5em 0;overflow-x:auto;overflow-y:hidden;}

  @media(max-width:860px){
    .shell{flex-direction:column;}
    .sidebar{width:100%;flex:none;position:static;max-height:none;border-right:none;
      border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:4px;}
    .sidebar h2{width:100%;} .navitem{width:auto;}
    .main{padding:20px 16px 80px;}
  }
</style>

<script>
"use strict";
const R = String.raw;

function typeset(el){
  if(el && window.renderMathInElement){
    try{ renderMathInElement(el,{delimiters:[
      {left:'$$',right:'$$',display:true},
      {left:'$',right:'$',display:false}
    ],throwOnError:false}); }catch(e){}
  }
}
function elFromHTML(html){ var d=document.createElement('div'); d.innerHTML=html; return d; }

/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un
   rimando scritto nella prosa:

       <span class="str" data-str="serie-geometrica">la serie geometrica</span>

   Le schede citate da questo nucleo sono cucite qui sotto dal montaggio
   (assembla-nucleo.js): la pagina resta autosufficiente — niente fetch,
   niente sottocartelle da pubblicare — e un rimando a una scheda che non
   esiste FERMA la costruzione invece di arrivare in pagina rotto.
   Apertura: lo stesso gesto del collaudo (si clicca, il pannello compare,
   si typeset una volta sola), portato dentro la frase.
   =================================================================== */
var CORSO = 'geometria-differenziale';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["omeomorfismo"] = {"nome":"Omeomorfismo","riga":"Una biiezione continua con inversa continua: due spazi omeomorfi sono lo stesso spazio scritto in due modi, per tutto ciò che la topologia sa vedere.","serve":"È la nozione di «uguale» che si usa quando si dice che una varietà è localmente come $\\mathbb{R}^n$. La richiesta che anche l'inversa sia continua non è pignoleria: senza di essa una biiezione continua può incollare cose lontane — l'applicazione $t\\mapsto(\\cos 2\\pi t,\\sin 2\\pi t)$ da $[0,1)$ alla circonferenza è continua e biunivoca, ma la sua inversa spezza la circonferenza in un punto, e infatti $[0,1)$ e $S^1$ non sono lo stesso spazio (uno è compatto, l'altro no). Le proprietà che si conservano per omeomorfismo — compattezza, connessione, dimensione, gruppo fondamentale — sono esattamente quelle di cui si può parlare su una varietà senza aver scelto una carta.","esempio":"L'intervallo aperto $(0,1)$ e la semiretta $(0,+\\infty)$ sono omeomorfi tramite $f(x)=\\dfrac{x}{1-x}$: è continua su $(0,1)$, manda $0^+$ in $0^+$ e $1^-$ in $+\\infty$, e la sua inversa è $g(y)=\\dfrac{y}{1+y}$, anch'essa continua. Che siano davvero una l'inversa dell'altra si verifica componendo: $g(f(x))=\\dfrac{x/(1-x)}{1+x/(1-x)}=x$. Ne segue che $(0,1)$ è omeomorfo anche a tutto $\\mathbb{R}$ (componendo con $y\\mapsto\\ln y$), il che dice una cosa che all'inizio sorprende: **la lunghezza non è una proprietà topologica**. Non lo è nemmeno l'essere limitato; lo è invece la compattezza, ed è per questo che $[0,1]$ non è omeomorfo a nessuno dei due.","debito":"nessun movimento del percorso tratta la topologia generale come argomento a sé: qui c'è ciò che serve per leggere la definizione di varietà. La classificazione di quali spazi sono omeomorfi a quali è il mestiere della topologia algebrica, e nel corso di Diverio entra solo per la numerabilità del gruppo fondamentale.","controllo":[{"tipo":"uguale","sinistra":"(x/(1-x))/(1+x/(1-x))","vale":"x","ipotesi":{"x":"positive"},"dove":"esempio","appare":"=x"}]};
STRUM["compattezza"] = {"nome":"Compattezza","riga":"Ogni ricoprimento aperto ammette un sottoricoprimento finito: è la proprietà che permette di passare da «vale vicino a ogni punto» a «vale su tutto», con un numero finito di passi.","serve":"È l'ipotesi che rende globali le conclusioni locali, ed è per questo che ricorre in ogni dimostrazione di geometria differenziale. In $\\mathbb{R}^n$ equivale a chiuso e limitato (Heine-Borel), ma su una varietà quell'equivalenza non si può usare come definizione, perché «limitato» richiede una distanza e una varietà non ne ha una privilegiata. La conseguenza che si usa più spesso è negativa: gli unici sottoinsiemi di $\\mathbb{R}^n$ che sono **insieme** aperti e compatti sono $\\emptyset$ e nient'altro — ed è l'argomento per cui una varietà compatta non può essere coperta da una sola carta.","esempio":"L'intervallo $(0,1)$ non è compatto, e si vede esibendo un ricoprimento senza sottoricoprimento finito: gli aperti $A_n=\\left(\\tfrac1n,1\\right)$ per $n\\ge2$ ricoprono $(0,1)$, perché ogni $x\\gt0$ sta in $A_n$ appena $\\tfrac1n\\lt x$, cioè appena $n\\gt1/x$. Ma una sottofamiglia finita $A_{n_1},\\dots,A_{n_k}$ ha un indice massimo $N$, quindi la sua unione è $\\left(\\tfrac1N,1\\right)$, e il punto $x=\\tfrac1{2N}$ resta fuori: è positivo, dunque sta in $(0,1)$, ed è minore di $\\tfrac1N$. Il conto che regge l'argomento è $\\lim_{n\\to\\infty}\\tfrac1n=0$: gli $A_n$ si avvicinano a coprire tutto, ma nessuno di essi contiene un intorno di $0$, e servirebbero tutti. Chiudendo l'intervallo, $[0,1]$ diventa compatto e quel ricoprimento smette di essere un ricoprimento — $0$ non sta in nessun $A_n$.","debito":"la dimostrazione del teorema di Heine-Borel e la teoria generale degli spazi compatti stanno fuori dal percorso: qui c'è l'uso che se ne fa. Nel corso di Diverio la compattezza entra come ipotesi (sfera, gruppi di Lie compatti) e come conclusione della locale compattezza delle varietà.","controllo":[{"tipo":"limite","espr":"1/n","var":"n","a":"oo","vale":"0","ipotesi":{"n":"positive"},"dove":"esempio","appare":"\\lim_{n\\to\\infty}\\tfrac1n=0"},{"tipo":"disuguaglianza","sinistra":"1/(2*N)","destra":"1/N","relazione":"<","ipotesi":{"N":"positive"},"dove":"esempio","appare":"minore di $\\tfrac1N$"}]};
STRUM["quoziente-topologico"] = {"nome":"Topologia quoziente","riga":"Si incollano punti dichiarandoli uguali, e si decide che un insieme è aperto nel quoziente quando la sua controimmagine è aperta sopra: è il modo di costruire spazi nuovi senza metterli dentro nessun ambiente.","serve":"È la seconda fabbrica di varietà, accanto ai grafici e ai prodotti, e produce proprio gli esempi che non si vedono come sottoinsiemi di $\\mathbb{R}^n$: il toro, il nastro di Möbius, lo spazio proiettivo. La regola pratica è sempre la stessa: una funzione definita sul quoziente è continua se e solo se, composta con la proiezione, è continua sopra — quindi si lavora sempre con i rappresentanti, controllando che il risultato non dipenda da quale si è scelto. Attenzione: **un quoziente di una varietà non è automaticamente una varietà**, e la proprietà che salta per prima è Hausdorff — la retta con due origini è proprio un quoziente mal riuscito.","esempio":"La circonferenza è $\\mathbb{R}/\\mathbb{Z}$: si dichiarano uguali due numeri che differiscono per un intero, e si manda la classe di $t$ nel punto $\\left(\\cos 2\\pi t,\\ \\sin 2\\pi t\\right)$. Perché la definizione sia lecita il risultato non deve dipendere dal rappresentante, e infatti $\\cos\\!\\left(2\\pi(t+1)\\right)=\\cos 2\\pi t$ e altrettanto per il seno: la mappa passa al quoziente. Ripetendo su due fattori si ottiene il toro $\\mathbb{T}^2=\\mathbb{R}^2/\\mathbb{Z}^2$, cioè il quadrato $[0,1]^2$ con i lati opposti incollati — lo spazio delle configurazioni del pendolo doppio, dove i due angoli sono definiti a meno di un giro. Le carte si prendono restringendo la proiezione a un quadratino di lato minore di $1$: lì è iniettiva, e la sua inversa dà le coordinate.","debito":"la verifica che il quoziente sia Hausdorff e a base numerabile va fatta caso per caso e qui non c'è: per il toro e per lo spazio proiettivo la si trova in Lee, Examples 1.4 e 1.5. Nel percorso, l'unico movimento che costruisce quozienti in dettaglio è gd-01.","controllo":[{"tipo":"uguale","sinistra":"cos(2*pi*(t+1))","vale":"cos(2*pi*t)","ipotesi":{"t":"real"},"dove":"esempio","appare":"\\cos\\!\\left(2\\pi(t+1)\\right)=\\cos 2\\pi t"},{"tipo":"simbolico","perche":"e' la notazione del quoziente di R^2 per il reticolo degli interi: si sta dando un nome allo spazio costruito, non calcolando un valore","dove":"esempio","appare":"\\mathbb{R}^2/\\mathbb{Z}^2"}]};

function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';
  return h;
}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

/* ---------------- 00 · DI COSA PARLA QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Di cosa parla questo movimento', meta:'Geometria Differenziale · voci G.1, G.2, G.4 · la radice del corso di Diverio',
  blocchi:[
  {t:'prosa', title:'Il problema che una varieta risolve', tag:'architettura', html:R`
  <p>In Analisi Vettoriale le superfici erano <b>dentro</b> $\mathbb{R}^3$: una sfera era l&rsquo;insieme dei punti a distanza fissa dall&rsquo;origine, e tutto ciò che si faceva su di essa passava dalle coordinate dello spazio ambiente. Funziona, ma nasconde una domanda: <b>quelle proprietà sono della superficie o del modo in cui l&rsquo;abbiamo messa nello spazio?</b></p>
  <p>La geometria differenziale rovescia il punto di vista. <b>Una varietà è uno spazio che non sta dentro niente</b>: è definito da come è fatto <i>localmente</i>, e l&rsquo;unica richiesta è che ogni suo punto abbia un intorno indistinguibile da un pezzo di $\mathbb{R}^n$. Non c&rsquo;è ambiente, non ci sono coordinate privilegiate, e ogni affermazione che si fa deve avere senso <b>senza</b> di essi.</p>
  <p>La ragione per cui è la scelta giusta si vede in fisica: lo spazio-tempo della relatività generale <b>non sta dentro</b> nessuno spazio più grande, e lo spazio delle configurazioni di un pendolo doppio è un toro che non è naturale immaginare immerso da nessuna parte. <b>Se la teoria richiedesse un ambiente, non si potrebbe nemmeno formulare.</b></p>
  <div class="note"><b>Come è organizzato questo corso, e conviene saperlo subito.</b> Diverio non segue un libro: le sue lezioni costruiscono in ordine varietà topologiche → strutture lisce → mappe → tangente → campi → flussi. Il testo più vicino è <b>Abate-Tovena, capitoli 1-3</b>; gli appunti di <b>Manetti</b> seguono quasi lo stesso ordine e sono corti. Ciò che nel corso <b>non c&rsquo;è</b>, e sarebbe facile studiare per sbaglio: metriche riemanniane, connessioni, curvatura, geodetiche. Il corso finisce dentro le equazioni differenziali su varietà.</div>`}
]},

/* ---------------- 01 · LA DEFINIZIONE ---------------- */
{ num:'01', title:'La definizione, e le tre richieste', meta:'localmente euclideo · Hausdorff · base numerabile · e perche servono le ultime due',
  blocchi:[
  {t:'prosa', title:'La definizione', tag:'grammatica', html:R`
  <p>Uno spazio topologico $M$ è una <b>varietà topologica</b> di dimensione $n$ se:</p>
  <ol>
   <li>è <b>localmente euclideo</b>: ogni punto ha un intorno aperto $U$ <span class="str" data-str="omeomorfismo">omeomorfo</span> a un aperto di $\mathbb{R}^n$. L&rsquo;omeomorfismo $\varphi:U\to\varphi(U)\subseteq\mathbb{R}^{n}$ si chiama <b>carta coordinata</b>, e la coppia $(U,\varphi)$ dà a ogni punto di $U$ le sue $n$ coordinate;</li>
   <li>è di <b>Hausdorff</b>: due punti distinti hanno intorni disgiunti;</li>
   <li>ha una <b>base numerabile</b> di aperti.</li>
  </ol>
  <p><b>La prima è l&rsquo;idea; le altre due sono ipotesi tecniche che si aggiungono perché senza di esse succedono cose sgradevoli</b>, e conviene sapere quali.</p>
  <p>Una sola precisazione sulla prima, che sembra una sfumatura e invece toglie un dubbio ricorrente: <b>chiedere «omeomorfo a un aperto di $\mathbb{R}^n$», «omeomorfo a una palla aperta» o «omeomorfo a tutto $\mathbb{R}^n$» sono tre richieste equivalenti</b> — è l'esercizio 1.1 di Lee, e si risolve osservando che ogni aperto contiene una palla attorno al punto, e che una palla aperta è omeomorfa a $\mathbb{R}^n$ (per esempio con $x\mapsto x/(1-|x|)$). Quindi non c'è nessuna scelta da fare fra le tre formulazioni, e quando un testo ne usa una diversa dall'altra non sta dicendo una cosa diversa.</p>`},
  {t:'prosa', title:'Perche Hausdorff e base numerabile non sono gratis', tag:'first principles', html:R`
  <p><b>Senza Hausdorff</b> esiste il controesempio classico: la <i>retta con due origini</i>, cioè due copie di $\mathbb{R}$ incollate lungo $\mathbb{R}\setminus\{0\}$. È localmente euclidea — ogni punto ha un intorno che è un intervallo — ma le due origini non si separano, e <b>le successioni possono avere due limiti</b>. Tutto il calcolo differenziale, che vive di limiti, diventa ambiguo.</p>
  <p><b>Senza base numerabile</b> si perdono le <b>partizioni dell&rsquo;unità</b> — le famiglie di funzioni lisce, ciascuna concentrata in una carta, che sommano a $1$ su tutta la varietà, e con esse la possibilità di incollare costruzioni locali in una globale. È la proprietà su cui si regge metà del corso: senza, non si può costruire una metrica, non si può integrare, non si può estendere una funzione da un chiuso. Il controesempio è la <i>retta lunga</i>, localmente euclidea e di Hausdorff, su cui quelle costruzioni falliscono.</p>
  <div class="note"><b>La domanda giusta da farsi davanti a un&rsquo;ipotesi tecnica</b> — e vale per tutto il corso — non è «perché è richiesta» ma <b>«che cosa si rompe senza»</b>. Diverio introduce entrambe queste condizioni nelle prime due lezioni e poi ne deduce una lista di conseguenze: è quella lista, non la definizione, il contenuto del movimento.</div>`}
]},

/* ---------------- 02 · LA DIMENSIONE ---------------- */
{ num:'02', title:'Perche la dimensione e un numero solo', meta:'invarianza del dominio · niente dimensioni miste · e cosa succede a mescolare le carte',
  blocchi:[
  {t:'prosa', title:'Il problema che nessuno pone, e che va posto', tag:'first principles', html:R`
  <p>La definizione dice «ogni punto ha un intorno omeomorfo a un aperto di $\mathbb{R}^n$», e poi si comincia a chiamare $n$ <b>la</b> dimensione di $M$. Ma il numero $n$ non compare nella varietà: compare nella <i>carta</i>, che è una scelta. <b>Chi garantisce che due carte diverse attorno allo stesso punto diano lo stesso $n$?</b></p>
  <p>Detto altrimenti: se un aperto di $\mathbb{R}^2$ fosse omeomorfo a un aperto di $\mathbb{R}^3$, la parola «dimensione» non significherebbe niente, e l'intero corso poggerebbe su una notazione mal definita. La risposta è un teorema, e non è un teorema facile.</p>
  <div class="note"><b>Teorema (invarianza del dominio, Brouwer 1912).</b> Se $U\subseteq\mathbb{R}^n$ è aperto e $f:U\to\mathbb{R}^n$ è continua e iniettiva, allora $f(U)$ è aperto e $f$ è un omeomorfismo sull'immagine. Conseguenza immediata: <b>un aperto non vuoto di $\mathbb{R}^n$ non è mai omeomorfo a un aperto di $\mathbb{R}^m$ per $m\ne n$</b>, e quindi la dimensione di una varietà è ben definita.</div>
  <p><b>Perché non è facile, e perché conviene saperlo.</b> Per $n=1$ si fa a mano: togliendo un punto a un intervallo lo si sconnette, mentre togliendo un punto a un aperto di $\mathbb{R}^2$ esso resta connesso — e la connessione si conserva per omeomorfismo, quindi $\mathbb{R}$ e $\mathbb{R}^2$ non sono omeomorfi. Lo stesso trucco, però, non distingue $\mathbb{R}^2$ da $\mathbb{R}^3$: togliendo un punto restano entrambi connessi. Servono invarianti più fini — l'omologia, o il grado di Brouwer — e questo è il motivo per cui l'invarianza del dominio si <b>enuncia</b> in un corso di geometria differenziale e si <b>dimostra</b> in uno di topologia algebrica. Diverio la usa senza dimostrarla, ed è la scelta giusta: quello che serve qui è sapere esattamente <i>che cosa</i> si sta assumendo.</p>`},
  {t:'prosa', title:'Due conseguenze che cadono spesso come domanda', tag:'regola operativa', html:R`
  <p><b>1. Niente spazi di dimensione mista.</b> L'unione disgiunta di un piano e di una retta <i>non</i> è una varietà topologica, benché ogni suo punto abbia un intorno euclideo: i punti del piano ne hanno uno di dimensione $2$, quelli della retta di dimensione $1$, e la definizione fissa un solo $n$ per tutto lo spazio. Lee lo dice esplicitamente subito dopo la definizione. <b>È un errore d'esame classico</b>, perché la condizione «localmente euclideo» sembra puntuale e invece porta con sé un numero globale.</p>
  <p>Con una sola eccezione da tenere a mente: se $M$ <b>non è connessa</b>, alcuni testi ammettono dimensioni diverse su componenti diverse. Con la definizione di Lee — e con quella di Diverio — questo non è ammesso, e la dimensione è unica per tutta la varietà.</p>
  <p><b>2. Il bordo rompe tutto, ed è per questo che si tratta a parte.</b> Il disco chiuso $\overline{B}^2$ non è una varietà topologica: un punto del bordo non ha nessun intorno omeomorfo a un aperto di $\mathbb{R}^2$ — se ne avesse uno, l'invarianza del dominio direbbe che quell'intorno è aperto in $\mathbb{R}^2$, mentre ogni intorno di un punto di bordo contiene punti esterni al disco. Gli oggetti con bordo esistono e si chiamano <i>varietà con bordo</i>: si definiscono chiedendo che gli intorni siano omeomorfi ad aperti del semispazio $\mathbb{H}^n=\{x\in\mathbb{R}^n: x_n\ge0\}$. <b>Notare che l'argomento che li esclude è esattamente il teorema di questa tappa</b>: senza invarianza del dominio non si potrebbe nemmeno dire che il disco chiuso è diverso dal disco aperto.</p>`}
]},

/* ---------------- 03 · LE CARTE, IN CONCRETO ---------------- */
{ num:'03', title:'Le carte in concreto: la sfera, e perche una sola non basta', meta:'proiezione stereografica · perche servono almeno due carte · il grafico di una funzione',
  blocchi:[
  {t:'reveal', title:'La sfera con due carte', tag:'costruzione', steps:[
   {label:'Perche una non basta', body:R`
   <p>$S^n$ è <span class="str" data-str="compattezza">compatta</span>; un aperto di $\mathbb{R}^n$ omeomorfo a tutta $S^n$ dovrebbe essere compatto, e gli unici sottoinsiemi di $\mathbb{R}^n$ insieme compatti e aperti sono $\emptyset$ e nient'altro (se $A$ fosse entrambi, sarebbe anche chiuso perché compatto in uno spazio di Hausdorff, e $\mathbb{R}^n$ connesso non ha sottoinsiemi aperti e chiusi oltre a $\emptyset$ e sé stesso — ma $\mathbb{R}^n$ non è compatto). <b>Quindi una carta sola non può coprire la sfera</b>: servono almeno due, e questo è il primo esempio di una varietà che <i>non</i> è un aperto di $\mathbb{R}^n$.</p>`},
   {label:'La proiezione stereografica', body:R`
   <p>Si toglie il polo nord $N$ e si proietta ogni punto sulla retta (o sul piano) equatoriale, dalla parte del polo. Per $S^1\subset\mathbb{R}^2$:
   $$\varphi_N(x,y)=\frac{x}{1-y},\qquad \varphi_N^{-1}(u)=\left(\frac{2u}{1+u^{2}},\ \frac{u^{2}-1}{1+u^{2}}\right).$$
   Due controlli che vanno sempre fatti e che qui tornano: l&rsquo;immagine dell&rsquo;inversa <b>sta davvero sulla circonferenza</b> (la somma dei quadrati fa $1$), e componendo carta e inversa si ritrova l&rsquo;identità. La stessa costruzione dal polo sud dà $\varphi_S$, e insieme coprono tutto.</p>`},
   {label:'La transizione, che e il cuore di tutto il seguito', body:R`
   <p>Sulla sovrapposizione delle due carte — la sfera meno i due poli — si può passare dall&rsquo;una all&rsquo;altra, e il conto dà
   $$\varphi_S\circ\varphi_N^{-1}(u)=\frac1u.$$
   <b>Questa funzione è liscia dove è definita</b> ($u\ne0$), e questo fatto — non la definizione di carta — è ciò che rende la sfera una varietà <i>differenziabile</i>. È il contenuto del prossimo movimento: le carte da sole danno solo la topologia, sono le <b>funzioni di transizione</b> a portare la struttura liscia.</p>`}
  ]},
  {t:'plot', title:'La proiezione stereografica, vista dal punto in cui si proietta',
   intro:R`La circonferenza unitaria e la retta $y=0$ su cui si proietta. Ogni punto della circonferenza (diverso dal polo nord $N=(0,1)$) è allineato con $N$ e con un solo punto dell'asse: quel punto è la sua coordinata. I quattro raggi disegnati mostrano dove finiscono quattro punti scelti.`,
   plots:[
    {kind:'curve', x:'cos(t)', y:'sin(t)', tr:[0,6.2832], height:340, equal:true,
     xr:[-3.2,3.2], yr:[-1.4,1.6],
     title:'S^1 e la retta equatoriale: il raggio da N porta il punto sulla sua coordinata u',
     segs:[{x1:-3.2, y1:0, x2:3.2, y2:0, col:'#4d5a6b', width:1.2},
           {x1:0, y1:1, x2:1, y2:0, col:'#5eead4', width:1.6, dash:true},
           {x1:0, y1:1, x2:3, y2:-0.5, col:'#d8a13a', width:1.6, dash:true},
           {x1:0, y1:1, x2:-1, y2:0, col:'#5eead4', width:1.6, dash:true},
           {x1:0, y1:1, x2:0, y2:-1, col:'#b98cff', width:1.6, dash:true}],
     marks:[{x:0, y:1, label:'N (tolto)', col:'#ff6b6b', up:true, hollow:true},
            {x:1, y:0, label:'u=1', col:'#5eead4'},
            {x:-1, y:0, label:'u=-1', col:'#5eead4', left:true},
            {x:0, y:-1, label:'S -> u=0', col:'#b98cff'},
            {x:0.8, y:0.6, label:'vicino a N', col:'#d8a13a', up:true},
            {x:3, y:-0.5, label:'u grande', col:'#d8a13a'}]}
   ],
   leggi:R`<p>La figura rende visibile la cosa che la formula nasconde: <b>più il punto è vicino al polo nord, più la sua coordinata $u$ è grande</b>, e nel limite scappa all'infinito. È per questo che il polo va tolto — non per un capriccio algebrico ($1-y$ si annulla) ma perché non c'è nessun punto della retta a cui mandarlo.</p>
   <p>Guarda il punto $S=(0,-1)$: finisce nell'origine. E guarda i due punti $(\pm1,0)$: finiscono in $u=\pm1$, cioè restano fermi. <b>L'insieme dei punti fissi è l'equatore</b>, ed è la traccia visiva del fatto che la proiezione dal polo <i>sud</i> — l'altra carta — si comporta allo stesso modo con le parti scambiate. Le due carte si sovrappongono su tutto tranne i due poli, e sulla sovrapposizione la transizione è $u\mapsto 1/u$: prende i punti vicini a $N$ (dove $u$ è grande) e li porta vicino a $0$, che è dove la seconda carta è comoda. <b>Una carta è comoda dove l'altra esplode</b>: è tutto qui il senso di avere un atlante.</p>`},
  {t:'prosa', title:'Gli altri esempi che Diverio usa subito', tag:'regola operativa', html:R`
  <ul>
   <li><b>Un aperto di $\mathbb{R}^n$</b>: carta unica, l&rsquo;identità. Il caso banale, ma serve perché dice che tutto ciò che si sa dell&rsquo;analisi resta un caso particolare;</li>
   <li><b>il grafico di una funzione continua</b> $f:\mathbb{R}^n\to\mathbb{R}^m$: la proiezione sulle prime $n$ coordinate è una carta globale. <b>Un grafico è sempre una varietà</b>, ed è il motivo per cui il criterio della funzione implicita — che dice quando un insieme è <i>localmente</i> un grafico — diventerà più avanti lo strumento principale per riconoscere le varietà: verificare un'ipotesi di rango è enormemente più facile che esibire delle carte;</li>
   <li><b>la sfera con le carte a grafico</b>, che è la scelta di Lee (Example 1.4) al posto della stereografica: per ogni $i$ si prendono i due aperti $U_i^{\pm}=\{x\in S^n:\pm x_i\gt0\}$ e si proietta dimenticando la coordinata $i$-esima; l'inversa ricostruisce quella coordinata come $\pm\sqrt{1-|u|^{2}}$. Sono $2n+2$ carte invece di $2$, ma <b>ciascuna è banale</b> e non serve nessuna formula da ricordare. Vale la pena avere in mano entrambe le costruzioni: la stereografica è più elegante e dà una transizione in una riga, quella a grafico è più stupida e si generalizza a qualunque insieme definito da un'equazione;</li>
   <li><b>prodotti</b>: se $M$ e $N$ sono varietà, $M\times N$ lo è, di dimensione la somma. Da qui il <b>toro</b> $S^1\times S^1$, che è lo spazio delle configurazioni del pendolo doppio;</li>
   <li><b>aperti di varietà</b>: un aperto di una varietà è una varietà della stessa dimensione. Sembra ovvio e serve continuamente, perché quasi tutte le costruzioni sono locali.</li>
  </ul>`}
]},

/* ---------------- 04 · I QUOZIENTI ---------------- */
{ num:'04', title:'La seconda fabbrica di varieta: incollare', meta:'toro come quadrato con i lati identificati · spazio proiettivo · dove il quoziente fallisce',
  blocchi:[
  {t:'prosa', title:'Perche serve un altro modo di costruire', tag:'architettura', html:R`
  <p>Fin qui le varietà sono arrivate da tre fabbriche: gli aperti di $\mathbb{R}^n$, i grafici, i prodotti. Tutte e tre producono oggetti che <i>si vedono</i> dentro uno spazio ambiente, e questo è in contraddizione con il programma dichiarato all'inizio — una varietà non sta dentro niente. La quarta fabbrica è il <span class="str" data-str="quoziente-topologico">quoziente</span>, e costruisce spazi <b>dichiarando uguali</b> dei punti, senza bisogno di un ambiente in cui immergerli.</p>
  <p>La regola è una sola e va imparata come si impara una tecnica di calcolo: sul quoziente $X/\!\sim$ un insieme è <b>aperto</b> quando la sua controimmagine tramite la proiezione $\pi$ è aperta in $X$. Ne segue che una funzione $f$ definita sul quoziente è continua se e solo se $f\circ\pi$ è continua — il che significa: si lavora sempre con i rappresentanti, e l'unica cosa da verificare è che il risultato <b>non dipenda</b> da quale rappresentante si è scelto.</p>`},
  {t:'reveal', title:'Il toro, per intero', tag:'costruzione', steps:[
   {label:'La costruzione', body:R`
   <p>Si prende $\mathbb{R}^2$ e si dichiarano uguali due punti che differiscono per un vettore a coordinate intere: $(x,y)\sim(x+m,y+n)$. Il quoziente $\mathbb{T}^2=\mathbb{R}^2/\mathbb{Z}^2$ è il <b>toro</b>. Concretamente è il quadrato $[0,1]^2$ con il lato sinistro incollato al destro e quello inferiore al superiore, entrambi <i>senza</i> rovesciare il verso — rovesciandone uno si ottiene la bottiglia di Klein, che non è la stessa cosa.</p>`},
   {label:'Le carte', body:R`
   <p>Si prende un qualunque quadratino aperto di lato minore di $1$: su di esso la proiezione $\pi$ è <b>iniettiva</b> (due punti a distanza minore di $1$ in entrambe le coordinate non possono differire per un vettore intero non nullo), ed è aperta per costruzione. Quindi $\pi$ ristretta al quadratino è un omeomorfismo sull'immagine, e la sua <b>inversa</b> è una carta. Bastano quattro di questi quadratini per coprire tutto il toro.</p>
   <p>Notare la forma dell'argomento, che è quella di ogni quoziente riuscito: <b>si trova un aperto su cui la relazione non identifica nulla</b>, e lì la proiezione diventa una carta. Se un tale aperto non esiste attorno a un punto, il quoziente non è una varietà.</p>`},
   {label:'Perche e Hausdorff, e perche il pendolo doppio vive qui', body:R`
   <p>Due classi distinte $[p]\ne[q]$ hanno rappresentanti a distanza positiva anche considerando tutte le traslazioni intere (il reticolo $\mathbb{Z}^2$ è <b>discreto</b>: le copie di un punto sono isolate), quindi si separano con due palline. È esattamente qui che passa il confine con i quozienti malriusciti: la retta con due origini nasce da una relazione che <i>non</i> ha questa proprietà.</p>
   <p>E la ragione per cui questo oggetto è ovunque in fisica: lo spazio delle configurazioni di un <b>pendolo doppio</b> è dato da due angoli, ciascuno definito a meno di un giro — cioè da due copie di $S^1$, cioè da un toro. Non è un'analogia: è letteralmente quello spazio, e la sua topologia decide quali moti sono deformabili l'uno nell'altro.</p>`}
  ]},
  {t:'plot', title:'Il toro: il quadrato incollato, e la superficie che ne esce',
   intro:R`La parametrizzazione $\Phi(u,v)=\big((R+r\cos u)\cos v,\ (R+r\cos u)\sin v,\ r\sin u\big)$ con $R=2$, $r=0{,}8$. I due parametri $u$ e $v$ sono proprio i due angoli, ciascuno definito a meno di $2\pi$: il rettangolo $[0,2\pi]^2$ dei parametri è il quadrato di cui si sono incollati i lati.`,
   plots:[
    {kind:'param3d', x:'(2+0.8*cos(u))*cos(v)', y:'(2+0.8*cos(u))*sin(v)', z:'0.8*sin(u)',
     ur:[0,6.2832], vr:[0,6.2832], nu:26, nv:38, yaw:0.7, pitch:0.5, alpha:0.9, height:360,
     title:'T^2 immerso in R^3 (trascina per ruotare): u gira nel tubo, v gira attorno all asse'}
   ],
   leggi:R`<p>Questa immagine è utile e <b>ingannevole insieme</b>, e le due cose vanno tenute insieme. È utile perché mostra i due cicli indipendenti: $u$ gira attorno al tubo, $v$ gira attorno all'asse centrale, e nessuno dei due si può contrarre a un punto restando sulla superficie. È il contenuto topologico vero del toro.</p>
   <p>È ingannevole perché suggerisce che il toro <b>stia</b> in $\mathbb{R}^3$, mentre la costruzione per quoziente non ha usato nessun ambiente. La differenza non è filosofica: il toro immerso così ha punti «esterni» più curvi e punti «interni» più piatti, mentre il toro $\mathbb{R}^2/\mathbb{Z}^2$ è <b>omogeneo</b> — tutti i suoi punti sono indistinguibili, e la sua geometria naturale è piatta. Quella disomogeneità non è una proprietà del toro: è una proprietà di <i>come l'abbiamo messo</i> dentro $\mathbb{R}^3$. È il primo caso concreto della domanda con cui si è aperto il movimento — quali proprietà sono dell'oggetto e quali dell'immersione — e la risposta qui è netta.</p>`},
  {t:'prosa', title:'Lo spazio proiettivo, che e il quoziente da conoscere per l esame', tag:'costruzione', html:R`
  <p>$\mathbb{RP}^n$ è l'insieme delle <b>rette per l'origine</b> di $\mathbb{R}^{n+1}$, con la topologia quoziente indotta da $\pi:\mathbb{R}^{n+1}\setminus\{0\}\to\mathbb{RP}^n$ che manda un punto nella retta che genera (Lee, Example 1.5). Equivalentemente: $x\sim\lambda x$ per ogni $\lambda\ne0$. Si scrive $[x_0:\cdots:x_n]$ per la classe di $(x_0,\dots,x_n)$, e quelle si chiamano <b>coordinate omogenee</b>: sono definite solo a meno di un fattore comune, quindi non sono coordinate nel senso delle carte — e vedere questa differenza è metà del lavoro.</p>
  <p><b>Le carte sono $n+1$</b>, una per ogni coordinata che si può supporre non nulla. Su $U_i=\{[x]:x_i\ne0\}$ si divide tutto per $x_i$ e si dimenticano il posto $i$-esimo:</p>
  $$\varphi_i\big([x_0:\cdots:x_n]\big)=\left(\frac{x_0}{x_i},\dots,\widehat{\frac{x_i}{x_i}},\dots,\frac{x_n}{x_i}\right)\in\mathbb{R}^n.$$
  <p>È ben definita proprio perché il rapporto $x_k/x_i$ <b>non cambia</b> se si moltiplica tutto per $\lambda$: è questa la verifica che ogni esercizio su $\mathbb{RP}^n$ chiede per prima. Gli $U_i$ ricoprono tutto, perché un punto ha almeno una coordinata non nulla.</p>
  <p><b>Il caso $n=1$ va fatto a mano una volta</b>, perché contiene già tutto. $\mathbb{RP}^1$ ha due carte: su $U_0$ la coordinata è $t=x_1/x_0$, su $U_1$ è $s=x_0/x_1$. Sulla sovrapposizione entrambe le coordinate omogenee sono non nulle, e $t\cdot s=\dfrac{x_1}{x_0}\cdot\dfrac{x_0}{x_1}=1$, cioè la transizione è $t\mapsto 1/t$ — <b>la stessa funzione che è uscita dalla stereografica sulla circonferenza</b>. Non è un caso: $\mathbb{RP}^1$ <i>è</i> omeomorfo a $S^1$ (ogni retta per l'origine incontra la circonferenza in due punti antipodali, e identificare gli antipodi di $S^1$ dà di nuovo una circonferenza, percorsa due volte). In dimensione più alta l'analogia si rompe: $\mathbb{RP}^2$ non è omeomorfo a $S^2$, e non è nemmeno immergibile in $\mathbb{R}^3$.</p>`},
  {t:'prosa', title:'Dove il quoziente fallisce, ed e sempre lo stesso punto', tag:'trappola', html:R`
  <p>La retta con due origini si costruisce come quoziente: si prendono due copie disgiunte di $\mathbb{R}$ e si identifica $x$ della prima con $x$ della seconda <b>solo per $x\ne0$</b>. Il risultato è localmente euclideo — ogni punto, comprese le due origini, ha un intorno che è un intervallo — e non è di Hausdorff.</p>
  <p><b>La diagnosi generale</b>: un quoziente perde Hausdorff quando la relazione identifica punti «troppo vicini a» punti che non identifica; tecnicamente, quando l'insieme delle coppie identificate non è chiuso nel prodotto. Nel caso delle due origini, la coppia $(0_1,0_2)$ è limite di coppie identificate $(x,x)$ con $x\to0$, ma non è essa stessa identificata — ed è esattamente il buco da cui passa la successione con due limiti.</p>
  <p>Per questo, quando si costruisce una varietà per quoziente, <b>la verifica di Hausdorff non è una formalità</b> e va fatta ogni volta: è la sola delle tre condizioni che il quoziente può distruggere. La base numerabile, invece, si eredita sempre da uno spazio a base numerabile tramite una proiezione aperta, e il locale euclideo è ciò che si è costruito apposta.</p>`}
]},

/* ---------------- 05 · LE PROPRIETÀ GRATIS ---------------- */
{ num:'05', title:'Quello che si ottiene gratis: le proprieta topologiche', meta:'palle coordinate numerabili · locale compattezza · esaustione in compatti · paracompattezza · e il gruppo fondamentale',
  blocchi:[
  {t:'prosa', title:'La lista, e perche e la parte utile del movimento', tag:'sintesi', html:R`
  <p>Diverio dedica la lezione del 27/09 a dedurre dalle tre richieste una <b>lista di proprietà</b>. Non sono curiosità: sono gli ingredienti tecnici di tutte le dimostrazioni del corso, e conviene sapere a che cosa serve ciascuna.</p>
  <ul>
   <li><b>base numerabile di palle coordinate</b>: si può scegliere la base fatta di aperti che stanno dentro una carta e corrispondono a palle. <b>Serve ovunque</b>: permette di ridurre un problema globale a numerabili problemi locali in $\mathbb{R}^n$;</li>
   <li><b>locale compattezza</b>: ogni punto ha un intorno con chiusura compatta. Viene dal fatto che in $\mathbb{R}^n$ le palle chiuse sono compatte, e passa alla varietà tramite le carte;</li>
   <li><b>esaustione in compatti</b>: esiste una successione di compatti $K_1\subset K_2\subset\cdots$ con $M=\bigcup K_i$ e ciascuno contenuto nell&rsquo;interno del successivo. <b>È il modo di trattare varietà non compatte come limiti di pezzi compatti</b>, e serve ogni volta che una costruzione si fa su un compatto per volta: l'immersione di una varietà in uno spazio euclideo e la completezza dei flussi si dimostrano cosi';</li>
   <li><b>paracompattezza</b>: ogni ricoprimento aperto ammette un raffinamento localmente finito. <b>È la chiave che apre le partizioni dell&rsquo;unità</b>, e quindi metà del corso: senza un raffinamento localmente finito non si possono sommare i contributi locali, perché la somma non sarebbe finita in nessun punto;</li>
   <li><b>le componenti connesse sono aperte, connesse per archi, e in numero numerabile</b>: su una varietà connessione e connessione per archi <b>coincidono</b>, e non è vero in uno spazio topologico qualunque. Il motivo è locale: gli aperti euclidei sono connessi per archi.</li>
  </ul>
  <p><b>E una proprietà meno ovvia, che Diverio dimostra il 01/10</b>: il <b>gruppo fondamentale</b> $\pi_1(M)$ di una varietà topologica è <b>numerabile</b>. Serve la base numerabile: con un ricoprimento numerabile di palle si costruisce un insieme numerabile di generatori. È il primo punto in cui la topologia algebrica entra nel corso. Il senso dell'enunciato: una varietà può essere complicatissima, ma i suoi lacci non possono essere <i>più</i> che numerabili — e questo basta a escludere una classe di patologie senza dover calcolare nulla.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Perché la connessione implica la connessione per archi su una varietà, e non in generale?`,
    a:R`Perché la proprietà è <b>locale</b>: ogni punto ha un intorno omeomorfo a una palla, che è connessa per archi. Fissato un punto, l&rsquo;insieme dei punti raggiungibili con un cammino è quindi <b>aperto</b>, e per lo stesso motivo lo è il suo complementare; se $M$ è connessa, uno dei due è vuoto. <b>L&rsquo;argomento «aperto e chiuso in un connesso»</b> è lo schema che tornerà molte volte nel corso, ed è la prima volta che compare.`},
   {q:R`La retta con due origini è localmente euclidea. Che cosa va storto di preciso?`,
    a:R`La successione $x_k=1/k$ converge <b>a entrambe</b> le origini: il limite non è unico. Quindi non ha senso parlare del limite di una curva, né della velocità in un punto, né dell&rsquo;unicità della soluzione di un&rsquo;equazione differenziale — <b>e il corso arriva proprio lì</b>, alle equazioni differenziali sulle varietà, dove l'unicità della soluzione è il teorema centrale. Hausdorff non è un capriccio: è ciò che rende ben definite tutte le nozioni di convergenza su cui si costruisce il resto.`}
  ]}
]},

/* ---------------- 06 · ESERCIZI ---------------- */
{ num:'06', title:'Esercizi — tocca a te', meta:'riconoscere una varieta e riconoscere cio che non lo e',
  blocchi:[
  {t:'esercizio', title:'1 · Il grafico di |x| e una varieta?', html:R`
  <p>Sia $\Gamma=\{(x,|x|):x\in\mathbb{R}\}\subset\mathbb{R}^2$, con la topologia indotta. È una varietà topologica di dimensione $1$? E se sì, come si concilia con il fatto che «ha un angolo»?</p>`,
   sol:R`<p><b>Sì, lo è.</b> La proiezione $\pi(x,|x|)=x$ è continua (restrizione di una proiezione), biunivoca, e la sua inversa $x\mapsto(x,|x|)$ è continua perché lo sono entrambe le componenti — si usa $\sqrt{x^{2}}=|x|$ per vederlo come composizione di funzioni continue. Quindi $\Gamma$ ha una <b>carta globale</b>, ed è omeomorfo a $\mathbb{R}$.</p>
   <p><b>L'angolo non c'entra</b>, ed è il punto dell'esercizio: una varietà topologica non sa cosa sia un angolo, perché gli omeomorfismi non conservano né derivate né rette tangenti. La differenza fra $\Gamma$ e una retta si vedrà solo quando si chiederà che le transizioni siano <i>lisce</i> — e allora $\Gamma$, con la struttura indotta da $\mathbb{R}^2$, non sarà una sottovarietà liscia. <b>Tenere separati i due livelli è metà del corso</b>: qui si sta costruendo solo il primo.</p>`},
  {t:'esercizio', title:'2 · Il cono, che invece non lo e', html:R`
  <p>Sia $C=\{(x,y,z):z^{2}=x^{2}+y^{2}\}$ il cono doppio. Mostra che <b>non</b> è una varietà topologica di dimensione $2$, e individua esattamente dove fallisce.</p>`,
   sol:R`<p>Fallisce <b>solo</b> nel vertice, e fuori da lì è una varietà (due falde, ciascuna grafico di $z=\pm\sqrt{x^{2}+y^{2}}$ sull'aperto $\mathbb{R}^2\setminus\{0\}$).</p>
   <p>Nel vertice l'argomento è di <b>connessione</b>: se esistesse un intorno $U$ dell'origine in $C$ omeomorfo a un aperto di $\mathbb{R}^2$, potremmo prenderlo omeomorfo a una palla; togliendo il punto centrale, una palla di $\mathbb{R}^2$ <b>resta connessa</b>, mentre $U\setminus\{0\}$ si spezza nelle due falde, che sono aperte, disgiunte e non vuote. L'omeomorfismo conserva la connessione, quindi la contraddizione è immediata.</p>
   <p><b>Lo schema è lo stesso dell'invarianza del dominio in dimensione bassa</b>: si toglie un punto e si guarda cosa resta. È il metodo standard per dimostrare che qualcosa <i>non</i> è una varietà, e conviene averlo pronto: esibire carte richiede lavoro, escluderle richiede un invariante.</p>`},
  {t:'esercizio', title:'3 · La stereografica in dimensione n', html:R`
  <p>Per $S^n\subset\mathbb{R}^{n+1}$, la proiezione dal polo nord è $\varphi_N(x)=\dfrac{(x_1,\dots,x_n)}{1-x_{n+1}}$. Calcola la funzione di transizione $\varphi_S\circ\varphi_N^{-1}$ e verifica che coincide, per $n=1$, con quella trovata nella tappa 03.</p>`,
   sol:R`<p>Viene $\varphi_S\circ\varphi_N^{-1}(u)=\dfrac{u}{|u|^{2}}$, cioè l'<b>inversione</b> rispetto alla sfera unitaria di $\mathbb{R}^n$. Per $n=1$, $|u|^{2}=u^{2}$ e resta $u/u^{2}=1/u$: la mappa della tappa 03.</p>
   <p>Due cose da portare via. La prima: l'inversione è definita e continua su $\mathbb{R}^n\setminus\{0\}$, che è esattamente l'immagine della sovrapposizione delle due carte — <b>il dominio della transizione non è una scelta, è imposto</b>. La seconda: è liscia dove è definita, e questo è ciò che renderà $S^n$ una varietà differenziabile. Con una sola formula, valida in ogni dimensione, si sistema tutta la famiglia delle sfere.</p>`},
  {t:'collaudo', title:'Controlla di aver capito', html:R`
  <ol>
  <li>Perché l'unione disgiunta di una retta e di un piano non è una varietà, benché ogni suo punto abbia un intorno euclideo?</li>
  <li>Il toro costruito come $\mathbb{R}^2/\mathbb{Z}^2$ e quello disegnato in $\mathbb{R}^3$: che cosa hanno in comune e che cosa no?</li>
  <li>Quale delle tre condizioni della definizione può essere distrutta passando a un quoziente, e quale si eredita sempre?</li>
  <li>Se $M$ è compatta, può avere un atlante con una sola carta?</li>
  </ol>`,
   sol:R`<ol>
   <li>Perché la definizione fissa <b>un solo</b> $n$ per tutta la varietà, e l'invarianza del dominio impedisce che $1$ e $2$ siano lo stesso numero. La condizione «localmente euclideo» è puntuale, ma porta con sé una costante globale.</li>
   <li>Hanno in comune tutto ciò che è topologico: sono omeomorfi, hanno gli stessi due cicli indipendenti, lo stesso gruppo fondamentale $\mathbb{Z}\times\mathbb{Z}$. Non hanno in comune la geometria: quello in $\mathbb{R}^3$ ha punti più curvi e punti meno curvi, quello per quoziente è omogeneo e piatto. <b>La curvatura è una proprietà dell'immersione, non del toro</b> — e infatti in questo corso non compare affatto.</li>
   <li>Si distrugge <b>Hausdorff</b> (la retta con due origini). Si eredita sempre la base numerabile, perché la proiezione è aperta e suriettiva. Il locale euclideo è ciò che si costruisce apposta, e va verificato.</li>
   <li>No: un atlante di una carta sola renderebbe $M$ omeomorfa a un aperto di $\mathbb{R}^n$, che se compatto e non vuoto darebbe un sottoinsieme di $\mathbb{R}^n$ aperto e compatto insieme — impossibile. La verifica che $\cos 2\pi(t+1)=\cos 2\pi t$ nella costruzione di $S^1$ come quoziente dice la stessa cosa da un'altra parte: la circonferenza si chiude, e una carta che la coprisse tutta dovrebbe «riaprirla».</li>
   </ol>`}
]},

/* ---------------- 07 · IL SENSO ---------------- */
{ num:'07', title:'Il senso, e le rotte', meta:'cosa apre, e dove la nozione di varieta riappare',
  blocchi:[
  {t:'prosa', title:'Cosa lascia in mano', tag:'sintesi', html:R`
  <p><b>Il punto.</b> Una varietà topologica è <b>solo</b> uno spazio che localmente somiglia a $\mathbb{R}^n$: su di essa si può parlare di continuità, connessione, compattezza — e basta. <b>Non si può ancora derivare</b>, perché non c&rsquo;è nessun modo di dire che una funzione è liscia: dipenderebbe dalla carta.</p>
  <p><b>A valle.</b> Il passo successivo aggiunge l&rsquo;unica cosa che manca, e lo fa chiedendo che le <b>funzioni di transizione</b> siano lisce. Da lì in poi ogni nozione del corso segue lo stesso schema: si definisce in carta, e si verifica che non dipenda dalla carta scelta.</p>`},
  {t:'prolessi', title:'Dove riappare questo movimento, nella fisica che farai',
   oggetto:R`<b>La varietà</b>: uno spazio con coordinate locali e nessun ambiente.`,
   rotte:[
    {dove:'Relativita<br>generale', txt:R`Lo spazio-tempo <b>è</b> una varietà quadridimensionale, e il principio di relatività generale è letteralmente la richiesta che le leggi non dipendano dalla carta scelta. <b>La covarianza delle leggi, che in elettromagnetismo è un teorema da verificare, diventa qui un requisito di struttura.</b>`},
    {dove:'Meccanica<br>analitica', txt:R`Lo spazio delle configurazioni di un sistema vincolato è una varietà: il pendolo doppio vive su un <b>toro</b> $S^1\times S^1$, il corpo rigido su $SO(3)$. Le coordinate lagrangiane <i>sono</i> carte, e il fatto che se ne possano scegliere diverse senza cambiare la fisica e' esattamente questo movimento.`},
    {dove:'Meccanica<br>statistica', txt:R`Lo spazio delle fasi è una varietà (simplettica, gd-oltre il corso), e il teorema di Liouville è un&rsquo;affermazione su una forma di volume definita senza coordinate privilegiate.`},
    {dove:'Teoria<br>dei campi', txt:R`I campi di gauge vivono su <b>fibrati</b> sopra lo spazio-tempo, e le funzioni di transizione fra carte diventano le trasformazioni di gauge. La struttura che qui serve a incollare carte, là <b>è</b> il contenuto fisico.`}
   ],
   domanda:R`Chiedere «localmente come $\mathbb{R}^n$» sembra una richiesta minima, e in effetti lo è: non fissa nessuna distanza, nessun angolo, nessuna curvatura. Eppure basta a dedurre paracompattezza, esaustioni, e la numerabilità del gruppo fondamentale. <b>Domanda da portare avanti per tutto il corso:</b> quanta geometria è già contenuta nella sola topologia, e da che punto in poi servono strutture aggiuntive? La risposta segna la differenza fra i teoremi che valgono su <i>ogni</i> varietà — Sard, Whitney, i flussi — e quelli che richiedono una metrica, che in questo corso non si incontrano affatto.`}
]}

];

function sectionGram(title, rows){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag gramtag">grammatica</span></h3>';
  var inner='<table class="gramtab">';
  rows.forEach(function(r){ inner+='<tr><td class="gs">'+r[0]+'</td><td>'+r[1]+'</td></tr>'; });
  inner+='</table>';
  var body=elFromHTML('<div class="gramwrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
/* --- blocco PLOT: la figura non decora, si legge. Ogni plot porta una chiave di lettura. --- */
function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';
  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
    else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
    else if(b.t==='prolessi') m.appendChild(sectionProlessi(b));
    else if(b.t==='reveal')m.appendChild(sectionReveal(b.title,b.tag,b.steps));
    else if(b.t==='esercizio') m.appendChild(sectionEsercizio(b));
    else if(b.t==='collaudo')  m.appendChild(sectionCollaudo(b.title,b.items));
    else if(b.t==='plot')      m.appendChild(sectionPlot(b));
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}

/* deep-link: gd-01-varieta-topologiche.html#03 apre direttamente la tappa 03 */
window.addEventListener('DOMContentLoaded', function(){
  var h=(location.hash||'').replace('#','');
  showTappa(byId[h]?h:'00');
});
window.addEventListener('hashchange', function(){
  var h=(location.hash||'').replace('#','');
  if(byId[h]) showTappa(h);
});
</script>
