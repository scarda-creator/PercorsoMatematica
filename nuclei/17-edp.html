var CORSO = 'metodi-e-modelli';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["residuo"] = {"nome":"Residuo","riga":"Il coefficiente $a_{-1}$ dello sviluppo di Laurent attorno a una singolarità isolata, cioè l'unico termine che sopravvive all'integrazione su un cerchietto attorno al punto.","serve":"È il numero che trasforma un integrale in una somma: tutto il resto della serie integra a zero su un giro chiuso, e resta $2\\pi i$ per la somma dei residui. Tre formule coprono quasi tutto — polo semplice $\\lim(z-z_0)f$; quoziente con polo semplice $P(z_0)/Q'(z_0)$, la più rapida perché non chiede di fattorizzare; polo di ordine $m$ con la derivata $(m-1)$-esima — e per l'ordine alto o per una singolarità essenziale conviene invece dividere le serie e leggere il coefficiente di $(z-z_0)^{-1}$.","esempio":"Con $f=\\dfrac{z}{z^{2}+1}$ in $z_0=i$ la formula del quoziente dà $\\dfrac{P(i)}{Q'(i)}=\\dfrac{i}{2i}=\\tfrac12$, senza fattorizzare nulla. Per $\\dfrac{e^{z}}{(z-2)^{3}}$ in $2$ il polo è di ordine $3$ e la formula con la derivata seconda dà $\\tfrac{e^{2}}{2}$. Per $\\dfrac{\\cos z-1}{z^{5}}$ in $0$ le formule sono peggio dello sviluppo: da $\\cos z-1=-\\tfrac{z^{2}}{2}+\\tfrac{z^{4}}{24}-\\cdots$ il coefficiente di $z^{-1}$ si legge direttamente, e vale $\\tfrac1{24}$.","pieno":{"file":"13-residui.html","tappa":"01","come":"le tre formule, il criterio di scelta e i casi svolti, nel nucleo sui residui"},"controllo":[{"tipo":"uguale","sinistra":"I/(2*I)","vale":"1/2","dove":"esempio","appare":"\\tfrac12"},{"tipo":"uguale","sinistra":"exp(2)/factorial(2)","vale":"exp(2)/2","dove":"esempio","appare":"\\tfrac{e^{2}}{2}"},{"tipo":"uguale","sinistra":"series(cos(z)-1, z, 0, 5).removeO()","vale":"-z**2/2 + z**4/24","dove":"esempio","appare":"-\\tfrac{z^{2}}{2}+\\tfrac{z^{4}}{24}"},{"tipo":"uguale","sinistra":"1/factorial(4)","vale":"1/24","dove":"esempio","appare":"\\tfrac1{24}"}]};

function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';
  return h;
}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

  blocchi:[
  {t:'prosa', title:'Tre equazioni e nient’altro', tag:'first principles', html:R`
  <p>Quasi tutta la fisica dei mezzi continui — elettromagnetismo, conduzione del calore, diffusione, acustica, corde e membrane, meccanica quantistica non relativistica — si scrive con tre equazioni lineari del secondo ordine:
  $$\underbrace{\Delta u=0}_{\text{Laplace}},\qquad \underbrace{u_t=\alpha\Delta u}_{\text{calore}},\qquad \underbrace{u_{tt}=c^2\Delta u}_{\text{onde}}.$$
  Sono <b>lo stesso operatore</b> $\Delta$ con un diverso trattamento del tempo: nessuna derivata temporale (equilibrio), una (evoluzione irreversibile), due (propagazione reversibile). La classificazione matematica le chiama <b>ellittica</b>, <b>parabolica</b>, <b>iperbolica</b>, e le tre categorie corrispondono a tre comportamenti fisici che non si somigliano affatto.</p>
  <p>Questo nucleo non introduce strumenti nuovi: <b>usa quelli costruiti</b>. Separazione di variabili e Fourier (nuclei 09 e 15), autofunzioni di Sturm&ndash;Liouville (nucleo 16), funzioni di Green (nucleo 15), e per le antitrasformate i residui (nucleo 13). È la verifica che il percorso serviva a qualcosa.</p>`}
]},

/* ---------------- 01 · LE ODE LINEARI DEL SECONDO ORDINE ---------------- */
{ num:'01', title:'Le ODE lineari del secondo ordine: la struttura che regge tutto il resto', meta:'spazio delle soluzioni di dimensione 2 · wronskiano e formula di Abel · coefficienti costanti · equazione di Eulero',
  blocchi:[
  {t:'prosa', title:'Perche si comincia da qui, e non dalle EDP', tag:'architettura', html:R`
  <p>Il movimento si chiama «ODE ed EDP» e l&rsquo;ordine non è casuale. Ogni metodo delle tappe successive — separazione delle variabili, sviluppo in modi, funzioni di Green — <b>riduce un&rsquo;equazione alle derivate parziali a una famiglia di equazioni ordinarie</b>. La separazione di $\Delta u=0$ produce ODE radiali; il calore su un segmento produce $X''=-\lambda X$; e la funzione di Green (me-12) si costruisce <i>interamente</i> con le soluzioni dell&rsquo;omogenea di una ODE. Chi non ha in mano questa tappa non può fare quelle: si trova a cercare «la formula della Green» invece di costruirla.</p>
  <p>Il quadro in una riga: per $\;a_2(x)f''+a_1(x)f'+a_0(x)f=j(x)\;$ con $a_2\ne0$ su un intervallo, <b>le soluzioni dell&rsquo;omogenea formano uno spazio vettoriale di dimensione esattamente 2</b>, e la soluzione generale della completa è <i>una</i> soluzione particolare più quello spazio. Tutto il mestiere consiste in due mosse: trovare due soluzioni indipendenti dell&rsquo;omogenea, e agganciarci la particolare.</p>`},
  {t:'prosa', title:'Il wronskiano: come si riconosce lindipendenza, e perche non si annulla mai a meta', tag:'grammatica', html:R`
  <p>Date due soluzioni $f_1,f_2$ dell&rsquo;omogenea si definisce il <b>wronskiano</b>
  $$W(x)=f_1(x)f_2'(x)-f_1'(x)f_2(x)=\det\begin{pmatrix}f_1&f_2\\ f_1'&f_2'\end{pmatrix}.$$
  Due fatti, ed è tutto quello che serve:</p>
  <ul>
   <li><b>$W\ne0$ in un punto $\iff$ $f_1,f_2$ sono indipendenti</b> (e allora $W\ne0$ ovunque);</li>
   <li><b>formula di Abel</b>: $W'=-\dfrac{a_1}{a_2}W$, quindi
   $$W(x)=W(x_0)\,\exp\!\left(-\int_{x_0}^{x}\frac{a_1(t)}{a_2(t)}dt\right).$$
   Il wronskiano si calcola <b>senza conoscere le soluzioni</b>, e soprattutto: essendo un esponenziale, <b>o è identicamente nullo o non si annulla mai</b>. Non esiste il caso «indipendenti qui, dipendenti là».</li>
  </ul>
  <p>Questa dicotomia è il motivo per cui nella funzione di Green (me-12) il wronskiano sta al <b>denominatore</b> senza che nessuno si preoccupi di dove si annulla: se non è identicamente zero, la formula è valida su tutto l&rsquo;intervallo. E quando invece <i>è</i> zero, non è un incidente di calcolo: vuol dire che le due soluzioni selezionate dai due bordi sono proporzionali, cioè che il problema omogeneo ha una soluzione non banale — e allora la Green non esiste.</p>`},
  {t:'reveal', title:'I due casi che cadono agli scritti', tag:'esame', steps:[
   {label:'Coefficienti costanti: lequazione caratteristica', body:R`
   <p>Per $f''+bf'+cf=0$ si cerca $f=e^{rx}$ e si ottiene $r^2+br+c=0$. Tre casi, e il terzo è quello che si sbaglia:</p>
   <ul>
    <li><b>radici reali distinte</b> $r_1\ne r_2$: $f_1=e^{r_1x}$, $f_2=e^{r_2x}$. Esempio d&rsquo;appello: $f''-3f'+2f$ dà $r=1,2$, e $W=e^{3x}$.</li>
    <li><b>radici complesse coniugate</b> $r=\alpha\pm i\beta$: si prendono le combinazioni reali $e^{\alpha x}\cos\beta x$ ed $e^{\alpha x}\sin\beta x$. Oscillazione smorzata: è l&rsquo;oscillatore.</li>
    <li><b>radice doppia</b> $r_0$: l&rsquo;esponenziale ne dà <b>una sola</b>, e la seconda è $xe^{r_0x}$ — il fattore $x$ non si indovina, esce dalla riduzione d&rsquo;ordine (o dal limite $r_2\to r_1$ di $\frac{e^{r_2x}-e^{r_1x}}{r_2-r_1}$). Esempio d&rsquo;appello: $f''-6f'+9f=e^{2x}$ dà $r_0=3$, base $\{e^{3x},xe^{3x}\}$ e $W=e^{6x}$.</li>
   </ul>`},
   {label:'Lequazione di Eulero, e il trucco che la rende banale', body:R`
   <p>$$a\,x^2f''+b\,xf'+c\,f=0$$
   ha i coefficienti che crescono con la stessa potenza con cui le derivate abbassano: si cerca <b>$f=x^\alpha$</b> e si ottiene un&rsquo;equazione algebrica in $\alpha$. È l&rsquo;equazione più frequente negli scritti di questo corso, perché compare in ogni problema con simmetria radiale.</p>
   <p>Esempio, e si ritrova identico in due appelli: $x^2f''+xf'-f=0$ dà $\alpha(\alpha-1)+\alpha-1=\alpha^2-1=0$, quindi $\alpha=\pm1$, base $\{x,1/x\}$, e
   $$W(x)=x\cdot\Big(-\frac{1}{x^2}\Big)-1\cdot\frac1x=-\frac2x.$$
   <b>Il controllo con Abel:</b> qui $a_1/a_2=1/x$, quindi $W\propto\exp(-\int dx/x)=1/x$. Torna, e ha richiesto zero conoscenza delle soluzioni.</p>
   <div class="note"><b>Perché funziona, e serve saperlo quando l&rsquo;esponente è doppio:</b> la sostituzione $x=e^t$ trasforma l&rsquo;equazione di Eulero in una a <b>coefficienti costanti</b> in $t$. Quindi i tre casi sono gli stessi di prima, tradotti: radici distinte $\to x^{\alpha_1},x^{\alpha_2}$; radice doppia $\to x^{\alpha_0}$ e $x^{\alpha_0}\log x$ (il $\log x$ è il $t$ di prima); radici complesse $\to x^{\alpha}\cos(\beta\log x)$. <b>Non è un secondo metodo da imparare: è il primo, in altre coordinate.</b></div>`}
  ]},
  {t:'plot', title:'I tre regimi delle radici, visti',
   intro:R`Le soluzioni di $f''+bf'+cf=0$ al variare del discriminante: due esponenziali, un esponenziale col fattore $x$, un&rsquo;oscillazione smorzata.`,
   plots:[
    {kind:'func2d', xr:[0,3.2], yr:[-1.2,2.2], height:340,
     title:'radici distinte, radice doppia, radici complesse: tre comportamenti dalla stessa equazione',
     xlabel:'x', ylabel:'f(x)',
     curves:[
      {f:'exp(-x)-exp(-2*x)', col:'#5eead4', width:2.2, label:'distinte: e^-x - e^-2x'},
      {f:'x*exp(-x)', col:'#d8a13a', width:2.2, label:'doppia: x e^-x'},
      {f:'exp(-0.5*x)*sin(3*x)', col:'#b98cff', width:2.2, label:'complesse: e^-x/2 sin 3x'}
     ],
     segs:[{x1:0, y1:0, x2:3.2, y2:0, col:'#4d5a6b', width:1}]}
   ],
   leggi:R`<b>Il caso della radice doppia (oro) è quello che si riconosce a occhio</b>: sale, ha un massimo e poi decade — è il caso <i>critico</i>, quello che in fisica separa il regime sovrasmorzato da quello oscillante, e non a caso è il più rapido a tornare all&rsquo;equilibrio senza oltrepassarlo. Il fattore $x$ non è un artificio matematico: è ciò che rende quella curva diversa da un semplice esponenziale. Il caso complesso (viola) oscilla dentro un inviluppo esponenziale, e il caso a radici distinte (verde) è una differenza di due decadimenti — con la memoria, in un compito, che se le due radici sono vicine la curva somiglia moltissimo a quella oro: è la continuità del limite $r_2\to r_1$ che genera il fattore $x$.`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`In un esercizio di funzione di Green trovi $W=0$. Che cosa scrivi?`,
    a:R`Che le soluzioni selezionate dalle due condizioni al bordo sono <b>proporzionali</b>, quindi il problema omogeneo ha una soluzione non banale, l&rsquo;operatore ristretto a quel dominio <b>non è invertibile</b> e <b>la funzione di Green non esiste</b>. Per la formula di Abel non può esserci una via di mezzo — $W$ è un esponenziale, o è sempre zero o non lo è mai — quindi non ha senso «provare in un altro punto». La risposta richiesta è la diagnosi, non un conto alternativo.`},
   {q:R`$x^2f''+3xf'+f=0$: qual è la base delle soluzioni?`,
    a:R`Eulero con $\alpha(\alpha-1)+3\alpha+1=\alpha^2+2\alpha+1=(\alpha+1)^2$: <b>radice doppia</b> $\alpha=-1$. La base è quindi $\{x^{-1},\,x^{-1}\log x\}$ — il logaritmo è il «fattore $x$» del caso a coefficienti costanti, tradotto dalla sostituzione $x=e^t$. Chi si ferma a $x^{-1}$ consegna uno spazio di dimensione 1 per un&rsquo;equazione del secondo ordine, che è impossibile.`}
  ]}
]},

/* ---------------- 02 · IL PROBLEMA BEN POSTO ---------------- */
{ num:'02', title:'Problema ben posto: quali dati, e quanti', meta:'i tre requisiti di Hadamard · dati iniziali contro dati al bordo · e perche il calore allindietro non e ben posto',
  blocchi:[
  {t:'prosa', title:'I tre requisiti, e il terzo e quello che si dimentica', tag:'first principles', html:R`
  <p>Un&rsquo;equazione differenziale da sola non individua niente: servono i <b>dati</b>. Secondo Hadamard un problema è <b>ben posto</b> se valgono tutte e tre:</p>
  <ol>
   <li><b>esistenza</b> di una soluzione;</li>
   <li><b>unicità</b>;</li>
   <li><b>dipendenza continua dai dati</b>: se i dati cambiano poco, la soluzione cambia poco.</li>
  </ol>
  <p>Il terzo è quello che si tende a saltare, ed è il più fisico dei tre: i dati di un problema reale vengono da misure, quindi sono noti con un errore. Se una perturbazione piccolissima del dato produce una soluzione completamente diversa, <b>la soluzione esiste ma non serve a niente</b> — non è calcolabile, non è misurabile, non è predizione.</p>`},
  {t:'prosa', title:'Quanti dati, e di quale specie', tag:'regola operativa', html:R`
  <p>Per una ODE di ordine $n$ servono <b>$n$ condizioni</b>, ed è la dimensione dello spazio delle soluzioni omogenee a dirlo. Ma <i>quali</i> condizioni cambia tutto:</p>
  <ul>
   <li><b>Problema ai valori iniziali</b> (Cauchy): $f(x_0)$ e $f'(x_0)$ nello <b>stesso punto</b>. Con coefficienti continui esiste ed è unica — teorema di Cauchy-Lipschitz — <b>sempre</b>. È il problema della dinamica: dato lo stato adesso, il futuro è determinato.</li>
   <li><b>Problema ai limiti</b> (Sturm-Liouville): una condizione in $a$ e una in $b$. Qui <b>l&rsquo;esistenza e l&rsquo;unicità non sono garantite</b>: dipendono dall&rsquo;equazione e dai bordi. È il problema della statica e delle configurazioni di equilibrio, ed è quello delle funzioni di Green.</li>
  </ul>
  <p><b>La differenza non è formale, ed è il punto della tappa.</b> $f''+f=0$ con $f(0)=0$, $f'(0)=1$ ha l&rsquo;unica soluzione $\sin x$. La stessa equazione con $f(0)=0$ e $f(\pi)=0$ ha <b>infinite</b> soluzioni, tutte le $c\sin x$; e con $f(0)=0$, $f(\pi)=1$ <b>non ne ha nessuna</b>. Stessa equazione, stesso numero di dati, tre esiti diversi — e questo è esattamente il caso $W=0$ della tappa precedente, visto dall&rsquo;altro lato: $\pi$ è un autovalore del problema al bordo.</p>
  <div class="note"><b>Il legame con l&rsquo;alternativa di Fredholm (me-07):</b> o il problema omogeneo ha solo la soluzione nulla — e allora la completa ha una e una sola soluzione per ogni sorgente — oppure ha soluzioni non banali, e allora la completa ne ha infinite o nessuna, a seconda che la sorgente sia ortogonale al nucleo. Le tre righe qui sopra sono i tre rami di quell&rsquo;alternativa scritti in un esempio.</div>`},
  {t:'prosa', title:'Il calore allindietro: esistenza si, dipendenza continua no', tag:'collegamento', html:R`
  <p>L&rsquo;equazione del calore $\partial_tu=\kappa\partial_x^2u$ con dato iniziale a $t=0$ è ben posta per $t>0$. <b>All&rsquo;indietro no</b>, e vale la pena vedere perché con Fourier: il modo $k$ evolve come $e^{-\kappa k^2t}$, quindi per $t>0$ le alte frequenze sono <b>schiacciate</b> — la soluzione si liscia, e due dati iniziali diversissimi nei dettagli fini danno soluzioni quasi identiche. Andando all&rsquo;indietro, $e^{+\kappa k^2|t|}$: le alte frequenze <b>esplodono</b>, e un errore di misura di $10^{-10}$ su una frequenza alta diventa un errore macroscopico. La soluzione formalmente esiste; la <b>dipendenza continua</b> è persa, e il problema è mal posto.</p>
  <p>È la stessa irreversibilità della tappa 04, detta nel linguaggio dei dati invece che in quello dell&rsquo;entropia: <b>il calore distrugge informazione sulle scale piccole, e nessun problema ben posto può recuperarla</b>. Le onde, che invece conservano l&rsquo;energia in ogni modo, sono ben poste in entrambi i versi del tempo — e infatti si integrano all&rsquo;indietro senza problemi.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Perché un problema ai valori iniziali è sempre risolubile e uno ai limiti no?`,
    a:R`Perché le due condizioni iniziali fissano <b>direttamente</b> le due costanti della combinazione generale, in un sistema lineare il cui determinante è il wronskiano <b>nel punto $x_0$</b> — e quello non è mai zero. Le condizioni al bordo invece producono un sistema il cui determinante coinvolge i valori delle soluzioni in <b>due punti diversi</b>, e quel determinante può annullarsi: succede esattamente quando esiste un modo dell&rsquo;omogenea che rispetta entrambi i bordi, cioè un autovalore.`},
   {q:R`Come si riconosce a colpo d&rsquo;occhio se un problema al bordo sarà singolare?`,
    a:R`Si risolve l&rsquo;omogenea e si guarda se una sua soluzione non banale soddisfa <b>entrambe</b> le condizioni. Se sì, $W$ dei due candidati è nullo, la Green non esiste, e il valore del parametro per cui succede è un autovalore. Negli scritti di questo corso la domanda è quasi sempre mascherata: «si discuta poi il caso in cui le condizioni al bordo sono…» — è lì che chiedono questo.`}
  ]}
]},

/* ---------------- 03 · LAPLACE ---------------- */
{ num:'03', title:'Laplace e Poisson: l’equilibrio', meta:'$\\Delta u=0$ · proprietà della media e principio del massimo · Green del laplaciano = potenziale coulombiano',
  blocchi:[
  {t:'prosa', title:'Cosa dice l’equazione', tag:'costruzione', html:R`
  <p>$\Delta u=0$ descrive uno stato <b>stazionario</b>: potenziale elettrostatico in assenza di cariche, temperatura all&rsquo;equilibrio, flusso incomprimibile irrotazionale. Con sorgente diventa <b>Poisson</b>: $\Delta u=-\rho/\varepsilon_0$.</p>
  <p>Due proprietà, che sono la stessa vista due volte:</p>
  <ul>
  <li><b>Proprietà della media:</b> il valore in un punto è la media dei valori su ogni sfera centrata lì. In $2$D è la formula di Cauchy del nucleo 12, e non è un&rsquo;analogia: le funzioni armoniche piane <b>sono</b> parti reali di funzioni olomorfe (nucleo 11).</li>
  <li><b>Principio del massimo:</b> niente massimi o minimi interni; gli estremi stanno sul <b>bordo</b>. Conseguenza fisica: nessuna trappola elettrostatica statica (Earnshaw), e la temperatura di equilibrio in una regione senza sorgenti non supera mai quella al contorno.</li>
  </ul>
  <p><b>La Green:</b> $-\Delta G=\delta^3$ ha soluzione $G=\dfrac{1}{4\pi r}$ in tre dimensioni ($-\frac{1}{2\pi}\log r$ in due). È il <b>potenziale coulombiano</b>: la soluzione di Poisson per una distribuzione qualunque è la convoluzione
  $$u(\mathbf r)=\frac{1}{4\pi\varepsilon_0}\int\frac{\rho(\mathbf r')}{|\mathbf r-\mathbf r'|}d^3r',$$
  che è la formula del potenziale che usi da sempre — qui derivata invece che postulata (nucleo 15).</p>`},
  {t:'plot', title:'Laplace su una striscia: il bordo detta, l’interno si smorza',
   intro:R`Soluzione di $\Delta u=0$ su $0\le x\le1$, $y\ge0$, con $u(x,0)=\sin(\pi x)$ e $u\to0$ per $y$ grande: per separazione $u=\sin(\pi x)e^{-\pi y}$.`,
   plots:[
    {kind:'contour', f:'sin(PI*x)*exp(-PI*y)', xr:[0,1], yr:[0,1.2], height:360, equal:false,
     levels:[0.03,0.07,0.15,0.3,0.5,0.75,0.95], col:'#4c8dff', label:'u = costante',
     grad:{fx:'PI*cos(PI*x)*exp(-PI*y)', fy:'-PI*sin(PI*x)*exp(-PI*y)', label:'grad u (linee di campo)', n:9}}
   ],
   leggi:R`Il dato al bordo (la sinusoide sul lato $y=0$) si <b>smorza esponenzialmente</b> entrando nel dominio: già a $y=1$ l&rsquo;ampiezza è ridotta di $e^{-\pi}\approx0{,}04$. È il comportamento tipico delle equazioni <b>ellittiche</b>: l&rsquo;interno è determinato dal bordo, ma <b>i dettagli del bordo si dimenticano in fretta</b>. Un dato al bordo più oscillante ($\sin(n\pi x)$) decade come $e^{-n\pi y}$, cioè <b>ancora più in fretta</b> — la stessa gerarchia vista nel calore, ma qui nello spazio invece che nel tempo. Le frecce sono $\nabla u$, ortogonali alle equipotenziali (nucleo 01) — se $u$ è il potenziale elettrostatico, sono le linee di campo. Conseguenza pratica in laboratorio: una schermatura o una rugosità di dimensione $a$ produce effetti che svaniscono su una distanza $\sim a$, ed è il motivo per cui il campo &laquo;lontano&raquo; non ricorda i dettagli della sorgente.`}
]},

/* ---------------- 02 · CALORE ---------------- */
{ num:'04', title:'Il calore: irreversibilità e regolarizzazione', meta:'nucleo gaussiano · smorzamento $e^{-\\alpha k^2t}$ delle alte frequenze · non si integra all’indietro',
  blocchi:[
  {t:'reveal', title:'La soluzione fondamentale, via Fourier', tag:'derivazione', steps:[
   {label:'Trasforma in $x$', body:R`<p>Da $u_t=\alpha u_{xx}$, trasformando secondo Fourier in $x$ (nucleo 15: $\widehat{u_{xx}}=-k^2\hat u$):
   $$\hat u_t=-\alpha k^2\hat u\ \Longrightarrow\ \hat u(k,t)=\hat u_0(k)\,e^{-\alpha k^2t}.$$
   L&rsquo;EDP è diventata una EDO in $t$, una per ogni $k$: <b>Fourier ha diagonalizzato l&rsquo;operatore</b> (nucleo 16).</p>`},
   {label:'Antitrasforma: il nucleo del calore', body:R`<p>L&rsquo;antitrasformata di una gaussiana è una gaussiana (nucleo 15), quindi la soluzione è la <b>convoluzione</b> con
   $$K_t(x)=\frac{1}{\sqrt{4\pi\alpha t}}\,e^{-x^2/4\alpha t},\qquad u(x,t)=(K_t*u_0)(x).$$
   $K_t$ è la soluzione con dato iniziale $\delta$: <b>il calore inizialmente concentrato in un punto</b>. È una gaussiana che si allarga come $\sqrt{t}$ — la legge di scala della diffusione, $\langle x^2\rangle=2\alpha t$, la stessa del moto browniano.</p>`},
   {label:'Le tre conseguenze che contano', body:R`<ul>
   <li><b>Regolarizzazione istantanea:</b> per ogni $t\gt0$ la soluzione è $C^\infty$, anche partendo da un dato discontinuo: il fattore $e^{-\alpha k^2t}$ schiaccia tutte le alte frequenze.</li>
   <li><b>Velocità di propagazione infinita:</b> $K_t(x)\gt0$ per <b>ogni</b> $x$, appena $t\gt0$. Un&rsquo;anomalia fisica (l&rsquo;equazione non è relativistica) e il prezzo del modello diffusivo.</li>
   <li><b>Irreversibilità:</b> tornare indietro significa moltiplicare per $e^{+\alpha k^2t}$, che <b>esplode</b> sulle alte frequenze: il problema all&rsquo;indietro è <b>mal posto</b> (una perturbazione minuscola del dato finale produce variazioni illimitate del dato iniziale). <b>Non è che l&rsquo;informazione non ci sia: è che è mescolata in modi sempre più fini.</b></li>
   </ul>`}
  ]},
  {t:'plot', title:'Il nucleo del calore nello spazio-tempo',
   intro:R`$u(x,t)$ con dato iniziale concentrato: la superficie mostra come una &laquo;punta&raquo; si abbassa e si allarga. Asse orizzontale $x$, asse di profondità $t$. <b>Trascina per ruotare.</b>`,
   plots:[
    {kind:'surface3d', f:'exp(-x*x/(4*0.15*(y+0.07)))/sqrt(4*PI*0.15*(y+0.07))', xr:[-2.2,2.2], yr:[0,1.6], n:44,
     yaw:0.95, pitch:0.62, zscale:1.35, height:400,
     title:'u(x,t): la gaussiana si allarga come radice di t, il picco cala come 1/radice di t'}
   ],
   leggi:R`La cresta alta e stretta a $t$ piccolo è il calore concentrato; scorrendo lungo l&rsquo;asse del tempo si abbassa e si allarga, <b>conservando l&rsquo;area</b> (l&rsquo;energia termica totale si conserva: nessuna dispersione ai bordi in questo dominio infinito). Due letture. <b>(1)</b> La larghezza cresce come $\sqrt{t}$, non come $t$: è la firma della <b>diffusione</b> contro la propagazione balistica — quattro volte il tempo per il doppio della distanza. <b>(2)</b> Guardando la superficie a $t$ fissato si ha una gaussiana; guardandola a $x$ fissato si ha un impulso che sale e poi decade: è la <b>risposta all&rsquo;impulso</b> del mezzo, cioè la funzione di Green del nucleo 15, qui vista come oggetto spazio-temporale. Nota che a $t=0^+$ la superficie è già positiva ovunque: la velocità di propagazione infinita è visibile nel disegno.`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Perché il problema del calore all&rsquo;indietro è mal posto, mentre quello delle onde no?`,
    a:R`Perché il calore moltiplica il modo $k$ per $e^{-\alpha k^2t}$: invertendo si moltiplica per $e^{+\alpha k^2t}$, e un errore di misura di ampiezza $\varepsilon$ sul modo $k$ diventa $\varepsilon e^{\alpha k^2t}$ — illimitato al crescere di $k$. Le onde invece moltiplicano per $e^{\pm ickt}$, di <b>modulo 1</b>: invertire è altrettanto stabile che andare avanti. <b>La differenza fra reversibile e irreversibile, in Fourier, è la differenza fra moltiplicare per una fase e moltiplicare per un fattore che smorza.</b>`}
  ]}
]},

/* ---------------- 03 · ONDE ---------------- */
{ num:'05', title:'Le onde: propagazione, d’Alembert, cono di luce', meta:'$u=F(x-ct)+G(x+ct)$ · dominio di dipendenza · energia conservata, reversibile',
  blocchi:[
  {t:'prosa', title:'La formula di d’Alembert e cosa insegna', tag:'costruzione', html:R`
  <p>In una dimensione $u_{tt}=c^2u_{xx}$ si fattorizza: $\big(\partial_t-c\partial_x\big)\big(\partial_t+c\partial_x\big)u=0$, da cui la soluzione generale
  $$u(x,t)=F(x-ct)+G(x+ct)$$
  — due profili rigidi che viaggiano in verso opposto a velocità $c$, <b>senza deformarsi</b>. Con dati iniziali $u(x,0)=f$, $u_t(x,0)=g$:
  $$u(x,t)=\frac{f(x-ct)+f(x+ct)}{2}+\frac{1}{2c}\int_{x-ct}^{x+ct}g(s)\,ds.$$</p>
  <p>Da leggere con attenzione: il valore in $(x,t)$ dipende <b>solo</b> dai dati nell&rsquo;intervallo $[x-ct,x+ct]$ — il <b>dominio di dipendenza</b>. Fuori da lì, nulla può influenzare quel punto: è la <b>velocità finita di propagazione</b>, e in relatività diventa il <b>cono di luce</b>. Confronta col calore, dove il dominio di dipendenza è <b>tutta</b> la retta.</p>
  <p>L&rsquo;<b>energia</b> $E=\frac12\int\big(u_t^2+c^2u_x^2\big)dx$ si conserva: nessuno smorzamento, nessuna regolarizzazione. Un dato iniziale con uno spigolo mantiene lo spigolo per sempre, trasportandolo — le <b>singolarità viaggiano</b> lungo le caratteristiche $x\pm ct=$ cost. È il motivo per cui si sentono le consonanti e si vedono le ombre nette.</p>`},
  {t:'plot', title:'Un impulso che si sdoppia e viaggia',
   intro:R`Dato iniziale $f(x)=e^{-8x^2}$ con velocità iniziale nulla: si divide in due metà che partono in direzioni opposte. Istantanee a $t=0$, $0{,}6$, $1{,}2$ (con $c=1$).`,
   plots:[
    {kind:'func2d', xr:[-2.6,2.6], yr:[-0.25,1.15], height:330,
     title:'d Alembert: meta ampiezza a sinistra, meta a destra, profilo intatto',
     curves:[
      {f:'exp(-8*x*x)', col:'#8fa0b5', width:1.8, dash:true, label:'t=0'},
      {f:'0.5*exp(-8*(x-0.6)*(x-0.6))+0.5*exp(-8*(x+0.6)*(x+0.6))', col:'#4c8dff', width:2, label:'t=0.6'},
      {f:'0.5*exp(-8*(x-1.2)*(x-1.2))+0.5*exp(-8*(x+1.2)*(x+1.2))', col:'#b98cff', width:2.2, label:'t=1.2'}
     ]}
   ],
   leggi:R`Il profilo iniziale si separa in <b>due copie di ampiezza metà</b> che viaggiano a velocità $\pm c$ mantenendo <b>forma identica</b>: nessun allargamento, nessuna perdita. Confronta con la figura del calore: là un solo bozzo che si abbassa e si allarga, qui due bozzi rigidi che si allontanano. <b>La stessa condizione iniziale, due operatori diversi, due mondi.</b> Il dato è recuperabile in ogni istante — basta far girare l&rsquo;equazione all&rsquo;indietro, perché il tempo compare al quadrato e $t\to-t$ è una simmetria. <b>Attenzione a una sottigliezza del caso 3D:</b> in tre dimensioni spaziali vale il <b>principio di Huygens</b> forte, e il segnale passa lasciando dietro di sé il silenzio esatto — mentre in 2D (onde sull&rsquo;acqua) resta una coda. È il motivo per cui il suono in aria è nitido: viviamo in un numero <b>dispari</b> di dimensioni, e non è un dettaglio matematico.`}
]},

/* ---------------- 04 · IL FILO COMUNE ---------------- */
{ num:'06', title:'Il filo comune: separazione, spettro, classificazione', meta:'un solo metodo per tutte e tre · ellittico/parabolico/iperbolico · dove si è già visto tutto',
  blocchi:[
  {t:'gram', title:'Le tre equazioni a confronto', rows:[
   [R`<b>Laplace</b> $\Delta u=0$`, R`<b>ellittica</b>. Nessun tempo: equilibrio. Dati sul <b>bordo</b> di un dominio. Soluzioni $C^\infty$ (anzi analitiche). Principio del massimo. Il dato al bordo si smorza entrando.`],
   [R`<b>Calore</b> $u_t=\alpha\Delta u$`, R`<b>parabolica</b>. Dato <b>iniziale</b> + bordo. Regolarizza istantaneamente; velocità di propagazione infinita; <b>irreversibile</b>. Modo $k$: $e^{-\alpha k^2t}$.`],
   [R`<b>Onde</b> $u_{tt}=c^2\Delta u$`, R`<b>iperbolica</b>. Dato iniziale su $u$ <b>e</b> $u_t$. Propagazione a velocità <b>finita</b> (cono di luce); energia conservata; <b>reversibile</b>; le singolarità viaggiano. Modo $k$: $e^{\pm ickt}$.`],
   [R`<b>Il metodo unico</b>`, R`separazione $\Rightarrow$ problema agli autovalori in $x$ (Sturm–Liouville, nucleo 16) $\Rightarrow$ EDO in $t$ (nucleo 06) $\Rightarrow$ sovrapposizione coi coefficienti del dato iniziale (Fourier, nucleo 09). <b>Cambia solo l&rsquo;EDO temporale</b>: $T=$ cost, $e^{-\alpha\lambda t}$, oppure $\cos,\sin(\sqrt\lambda\,ct)$.`],
   [R`<b>Con sorgente</b>`, R`funzione di Green (nucleo 15) e sovrapposizione; nella base spettrale $G=\sum\phi_n\phi_n/\lambda_n$ (nucleo 16). Le antitrasformate si calcolano coi <b><span class="str" data-str="residuo">residui</span></b> (nucleo 13), e la scelta del contorno è la scelta della <b>prescrizione causale</b>.`]
  ]},
  {t:'prosa', title:'La riga che riassume il percorso', tag:'sintesi', html:R`
  <p>Le tre EDP hanno lo <b>stesso</b> operatore spaziale, quindi la <b>stessa base</b> di autofunzioni. Ciò che le distingue è come ogni modo evolve nel tempo: <b>fermo</b> (Laplace), <b>smorzato</b> (calore), <b>oscillante</b> (onde). Equilibrio, dissipazione, propagazione sono tre destini dello stesso spettro.</p>
  <p>Ed è, letteralmente, la sintesi del percorso: trovare la base giusta (nuclei 09 e 16), scrivere il dato su quella base (Fourier), lasciar evolvere ogni componente da sola (EDO, nucleo 06), risommare. Tutto il resto — completezza (10), distribuzioni (15), residui (13) — serve a garantire che ciascuno di questi passi sia lecito.</p>`}
]},

/* ---------------- 05 · ESERCIZI ---------------- */
{ num:'07', title:'Esercizi — tocca a te', meta:'calore su un segmento · onde con dato a tratti · Laplace nel disco',
  blocchi:[
  {t:'esercizio', title:'Calore su $[0,\\pi]$ con dato iniziale $\\sin x+\\tfrac12\\sin3x$',
   src:'esercizio-tipo — la separazione applicata',
   testo:R`Risolvere $u_t=u_{xx}$ su $[0,\pi]$ con $u(0,t)=u(\pi,t)=0$ e $u(x,0)=\sin x+\frac12\sin3x$. Dire dopo quanto tempo il secondo modo è trascurabile rispetto al primo.`,
   steps:[
    {label:'Riconosci che il dato è già sviluppato', body:R`<p>Le autofunzioni sono $\sin(nx)$ con $\lambda_n=n^2$ (nucleo 16). Il dato iniziale è <b>già</b> una combinazione di autofunzioni: $c_1=1$, $c_3=\frac12$, tutti gli altri nulli. <b>Nessun integrale da calcolare</b> — è il regalo di questo tipo di esercizio, e va riconosciuto subito.</p>`},
    {label:'Evolvi ogni modo', body:R`<p>Ogni modo si smorza con $e^{-n^2t}$:
    $$u(x,t)=e^{-t}\sin x+\tfrac12e^{-9t}\sin 3x.$$</p>`},
    {label:'Il confronto fra i modi', body:R`<p>Il rapporto fra le ampiezze è $\dfrac{\frac12e^{-9t}}{e^{-t}}=\dfrac12e^{-8t}$. Scende sotto l&rsquo;$1\%$ quando $e^{-8t}\lt0{,}02$, cioè $t\gtrsim\frac{\ln50}{8}\approx0{,}49$. <b>Dopo un tempo dell&rsquo;ordine di $1/(n^2\alpha)$ sopravvive solo il modo fondamentale</b>: qualunque dato iniziale, per tempi lunghi, si appiattisce sulla stessa forma $\sin x$ — ed è l&rsquo;equivalente elementare di ciò che in meccanica statistica si chiama <b>termalizzazione</b>: perdita di memoria del dettaglio iniziale. $\blacksquare$</p>`}
   ],
   nota:R`Variante frequente: dato iniziale <b>non</b> combinazione finita di autofunzioni (per esempio $u_0=x(\pi-x)$). Allora i $c_n$ vanno calcolati con l&rsquo;integrale di Fourier del nucleo 09 — ed è l&rsquo;unico passo in più.`},
  {t:'collaudo', title:'Diagnostica rapida', items:[
   {q:R`Onde su $[0,L]$ con estremi fissi: perché una corda produce armoniche <b>esatte</b> e un tamburo no?`,
    a:R`Perché per la corda gli autovalori sono $\lambda_n=(n\pi/L)^2$, quindi le frequenze $\omega_n=cn\pi/L$ sono <b>multipli interi</b> della fondamentale: il suono è armonico e ha un&rsquo;altezza definita. Per una membrana circolare gli autovalori vengono dagli <b>zeri delle funzioni di Bessel</b> (Sturm–Liouville in coordinate polari, nucleo 16), che <b>non</b> sono in rapporto intero: il suono è inarmonico, percussivo. <b>La geometria del dominio decide lo spettro, e lo spettro decide il timbro</b> — «si può sentire la forma di un tamburo?» è una domanda matematica famosa (la risposta è: non del tutto).`},
   {q:R`In che senso l&rsquo;equazione di Schrödinger $i\hbar\psi_t=-\frac{\hbar^2}{2m}\psi_{xx}$ sta fra il calore e le onde?`,
    a:R`È formalmente l&rsquo;equazione del calore con coefficiente <b>immaginario</b>. Il modo $k$ evolve come $e^{-i\hbar k^2t/2m}$: modulo $1$ come le onde (unitaria, reversibile, nessuna dissipazione), ma con la <b>dipendenza $k^2$</b> del calore invece della $k$ lineare — quindi le componenti viaggiano a velocità diverse e il pacchetto si <b>allarga</b> (dispersione) pur conservando la norma. Il legame è esatto e si chiama <b>rotazione di Wick</b> $t\to-i\tau$ (nucleo 14): trasforma Schrödinger nel calore e il propagatore quantistico nel peso di Boltzmann. È il ponte formale fra meccanica quantistica e meccanica statistica.`}
  ]}
]},

/* ---------------- 06 · SENSO E ROTTE ---------------- */
{ num:'08', title:'Il senso e le rotte fisiche — e la fine del percorso', meta:'dove arriva tutto questo, e la domanda che resta aperta',
  blocchi:[
  {t:'prosa', title:'Cosa chiude il percorso', tag:'sintesi', html:R`
  <p><b>A monte c&rsquo;è tutto.</b> Topologia e differenziale (nuclei 00&ndash;01) per dire cosa significa liscio; Dini e ottimizzazione (02) per i vincoli; curve, superfici e campi (03&ndash;04) per il linguaggio vettoriale; i teoremi integrali (05) che diventano le leggi di conservazione; le EDO (06) che qui sono la parte temporale; serie, spazi, Hilbert (07&ndash;10) per avere una base e potersi fidare dei limiti; la complessa (11&ndash;14) per i residui, le antitrasformate e l&rsquo;analiticità come causalità; distribuzioni e operatori (15&ndash;16) per le sorgenti puntiformi e lo spettro.</p>
  <p><b>Il punto d&rsquo;arrivo.</b> Il metodo è uno solo: <b>trova la base in cui l&rsquo;operatore è diagonale, scrivici il dato, lascia evolvere ogni componente, risomma.</b> Tutto il percorso serve a rendere ciascuno di quei quattro verbi legittimo.</p>`},
  {t:'prolessi', title:'Dove riappare questo nucleo, nella fisica che farai',

    {dove:'Meccanica<br>statistica', txt:R`L&rsquo;equazione di diffusione emerge come limite macroscopico di un cammino aleatorio microscopico: $\langle x^2\rangle=2\alpha t$ è la relazione di Einstein, e $\alpha$ si lega alla temperatura dal <b>teorema di fluttuazione-dissipazione</b>. La freccia del tempo del calore <b>nasce</b> da una dinamica microscopica reversibile.`},
    {dove:'Meccanica<br>quantistica', txt:R`Schrödinger è il calore con coefficiente immaginario: unitaria come le onde, dispersiva come il calore. L&rsquo;equazione stazionaria $H\psi=E\psi$ è il problema agli autovalori del nucleo 16, e la buca di potenziale è il problema al bordo di questo.`},
    {dove:'Relatività', txt:R`Il <b>dominio di dipendenza</b> dell&rsquo;equazione delle onde è il <b>cono di luce</b>: la struttura causale dello spaziotempo è, matematicamente, l&rsquo;iperbolicità dell&rsquo;equazione. Un&rsquo;equazione parabolica come il calore viola la causalità relativistica, ed è per questo che le teorie relativistiche della diffusione sono più delicate.`}

var byId = {}; TAPPE.forEach(function(s){ byId[s.num]=s; });

var VKEY='pm-nucleo17-visited';
function loadSeen(){ try{ return new Set(JSON.parse(localStorage.getItem(VKEY)||'[]')); }catch(e){ return new Set(); } }
function saveSeen(s){ try{ localStorage.setItem(VKEY, JSON.stringify(Array.from(s))); }catch(e){} }
var SEEN = loadSeen();

function renderNav(active){
  var nav=document.getElementById('sidebar');
  nav.innerHTML='';
  var h=document.createElement('h2'); h.textContent='Nucleo 17 · le tappe'; nav.appendChild(h);
  TAPPE.forEach(function(s){
    var b=document.createElement('button');
    b.className='navitem'+(active===s.num?' active':'')+(SEEN.has(s.num)?' seen':'');
    b.innerHTML='<span class="dot"></span><span class="nx">'+s.num+'</span><span>'+s.title+'</span>';
    b.onclick=function(){ showTappa(s.num); };
    nav.appendChild(b);
  });
}

/* ---- renderer dei blocchi ---- */
function sectionProsa(title, tag, html){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var body=elFromHTML('<div class="open-body">'+html+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function sectionGram(title, rows){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag gramtag">grammatica</span></h3>';
  var inner='<table class="gramtab">';
  rows.forEach(function(r){ inner+='<tr><td class="gs">'+r[0]+'</td><td>'+r[1]+'</td></tr>'; });
  inner+='</table>';
  var body=elFromHTML('<div class="gramwrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
/* --- blocco PLOT: la figura non decora, si legge. Ogni plot porta una chiave di lettura. --- */
function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';
  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
    else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
    else if(b.t==='prolessi') m.appendChild(sectionProlessi(b));
    else if(b.t==='reveal')m.appendChild(sectionReveal(b.title,b.tag,b.steps));
    else if(b.t==='esercizio') m.appendChild(sectionEsercizio(b));
    else if(b.t==='collaudo')  m.appendChild(sectionCollaudo(b.title,b.items));
    else if(b.t==='plot')      m.appendChild(sectionPlot(b));
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}
