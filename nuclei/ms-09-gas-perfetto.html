   <p><b>costante</b>: in due dimensioni ci sono tanti stati a bassa energia quanti ad alta energia. In una dimensione la condizione definisce un segmento di lunghezza $2\sqrt{2m\varepsilon}$, e</p>
   $$\Sigma_1(\varepsilon)=\frac{L}{h}\,2\sqrt{2m\varepsilon}$$
   $$G_1(\varepsilon)=\frac{d\Sigma_1}{d\varepsilon}=\frac{L}{h}\sqrt{\frac{2m}{\varepsilon}}$$
   <p>che <b>diverge</b> per $\varepsilon\to0$. Le tre dipendenze — $\varepsilon^{-1/2}$, costante, $\varepsilon^{+1/2}$ — sono la stessa formula $G\propto\varepsilon^{d/2-1}$ letta a $d=1,2,3$, e la loro differenza non è accademica: decide se un gas di bosoni può condensare (serve che $G$ si annulli abbastanza in fretta a bassa energia, e in due dimensioni non lo fa) e come si comporta un gas di elettroni confinato in un film sottile.</p>`},
   {label:'Il picco della distribuzione dell energia', body:R`
   <p>Torniamo a $p(\varepsilon)\propto G(\varepsilon)e^{-\beta\varepsilon}$ e mettiamoci in tre dimensioni, dove $G\propto\sqrt\varepsilon$. La competizione è fra una radice crescente e un&rsquo;esponenziale decrescente, e il massimo si trova derivando:</p>
   $$\frac{d}{d\varepsilon}\Big(\sqrt\varepsilon\,e^{-\beta\varepsilon}\Big)=\Big(\frac{1}{2\sqrt\varepsilon}-\beta\sqrt\varepsilon\Big)e^{-\beta\varepsilon}$$
   <p>La parentesi si annulla dove il termine crescente pareggia quello decrescente, cioè in</p>
   $$\varepsilon^\ast=\frac{1}{2\beta}=\frac T2$$
   <p>L&rsquo;energia <i>più probabile</i> di una particella è $T/2$, mentre l&rsquo;energia <i>media</i> è $\tfrac32T$: un fattore tre fra le due, molto più grande dello scarto fra le tre velocità della tappa precedente. Il motivo è la coda: $p(\varepsilon)$ è fortemente asimmetrica, e la media è tirata a destra dalle poche particelle molto energetiche. <b>È lo stesso fenomeno delle tre velocità, amplificato dal passaggio da $v$ a $v^2$.</b></p>`}
  ]},
  {t:'plot', title:'Gusci di impulso a energia fissata, e la densita degli stati in tre dimensionalita',
   intro:R`A sinistra, il piano degli impulsi $(p_x,p_y)$: le circonferenze sono i luoghi a energia costante, e la densità degli stati misura quanto è spesso il guscio fra due energie vicine. A destra, $G(\varepsilon)$ in una, due e tre dimensioni, in unità arbitrarie.`,
   plots:[
    {kind:'curve', x:'1.2*cos(t)', y:'1.2*sin(t)', tr:[0,6.2832], xr:[-2.1,2.1], yr:[-2.1,2.1], height:300,
     title:'superfici a energia costante nel piano degli impulsi',
     rings:[{r:0.6, col:'#5eead4'},{r:1.8, col:'#ff6b6b'}],
     marks:[{x:0.6,y:0,label:'eps piccola',col:'#5eead4'},{x:1.8,y:0,label:'eps grande',col:'#ff6b6b'}],
     xlabel:'p_x', ylabel:'p_y'},
    {kind:'func2d', xr:[0.05,3], yr:[0,4.6], height:300, ticks:6,
     title:'densita degli stati G(eps) in d = 1, 2, 3',
     curves:[
      {f:'1/sqrt(x)', col:'#5eead4', label:'d = 1: diverge a energia nulla'},
      {f:'1', col:'#d8a13a', label:'d = 2: costante'},
      {f:'sqrt(x)', col:'#ff6b6b', label:'d = 3: si annulla a energia nulla'}
     ],
     xlabel:'eps (unita arbitrarie)', ylabel:'G(eps)'}
   ],
   leggi:R`<p><b>A sinistra: perché il conto è geometrico.</b> Gli stati con energia fra $\varepsilon$ ed $\varepsilon+d\varepsilon$ stanno in un guscio sferico di raggio $p=\sqrt{2m\varepsilon}$. Il loro numero è (superficie del guscio) per (spessore), cioè $4\pi p^2\cdot dp$, e lo spessore si converte in energia con il giacobiano $dp/d\varepsilon$, che vale $m/p$. Il prodotto dà $4\pi pm\,d\varepsilon$: <b>la densità degli stati in tre dimensioni è la circonferenza per il giacobiano</b>, e cresce perché la sfera cresce. In due dimensioni la «superficie» è una circonferenza, $2\pi p$, e il giacobiano $m/p$ la cancella esattamente — ecco perché $G_2$ è costante.</p>
   <p><b>A destra: la stessa formula, tre comportamenti opposti.</b> Le tre curve sono $\varepsilon^{d/2-1}$ per $d=1,2,3$. A energia bassa divergono, restano costanti o si annullano, e il segno di quella pendenza decide questioni molto lontane fra loro: se un gas di bosoni può accumularsi nel fondamentale, se il calore specifico di un solido va come $T^3$ o come $T$, se un elettrone in un filo quantico si comporta come in un cristallo.</p>
   <p><b>Cosa guardare per non confondersi.</b> $G(\varepsilon)$ non è una probabilità e non è normalizzata: è un <i>conteggio</i>, e le sue dimensioni sono inverso di un&rsquo;energia. La probabilità arriva solo moltiplicandola per il peso di Boltzmann e dividendo per $z_1$. Tenere separati i due fattori è ciò che permette, più avanti, di cambiare statistica — Fermi o Bose al posto di Boltzmann — lasciando $G(\varepsilon)$ identica.</p>`},
  {t:'prosa', title:'Quando la traduzione da somma a integrale e lecita, e quando no', tag:'regola operativa', html:R`
  <p>Dietro tutto questo c&rsquo;è un passaggio che si fa in automatico e che merita di essere guardato in faccia, perché è il punto in cui si rompe. In una scatola di lato $L$ gli impulsi sono <b>quantizzati</b>: $\mathbf p=\dfrac{2\pi\hbar}{L}(n_x,n_y,n_z)$ con $n_i$ interi, e una somma su stati è una somma su interi. La si trasforma in integrale moltiplicando e dividendo per la spaziatura</p>
  $$\Delta p_x=\frac{2\pi\hbar}{L}$$
  <p>e riconoscendo una somma di Riemann. Crisanti (pag. 253) la scrive così:</p>
  $$\sum_{p_x}\to\frac{L}{2\pi\hbar}\int dp_x\qquad\sum_{\mathbf p}\to\frac{V}{(2\pi\hbar)^3}\int d^3p$$
  <p>ed è da qui — non da un postulato — che arriva il $1/h^3$ per grado di libertà con cui abbiamo normalizzato ogni integrale di questo movimento.</p>
  <p><b>La condizione di liceità ha due facce, e servono entrambe.</b> La prima è che la spaziatura sia piccola rispetto alla scala su cui varia il sommando, cioè rispetto all&rsquo;impulso termico $\sqrt{2\pi mT}$: questo equivale a $\lambda\ll L$, e per un gas macroscopico è vero con un margine ridicolo — per l&rsquo;elio a temperatura ambiente in una scatola di un centimetro il rapporto $\lambda/L$ vale circa $5{,}04\times10^{-9}$. Su questo fronte non ci sono problemi.</p>
  <p>La seconda faccia è più sottile e non si vede stimando rapporti: <b>nessun singolo termine della somma deve portare una frazione finita del totale</b>. Una somma di Riemann approssima l&rsquo;integrale solo se nessun addendo è patologico, e in tre dimensioni $G(\varepsilon)\propto\sqrt\varepsilon$ <i>si annulla</i> a energia zero — il che significa che l&rsquo;integrale attribuisce peso nullo allo stato fondamentale. Finché lo stato fondamentale ospita una manciata di particelle non importa. Quando ne ospita una frazione macroscopica, l&rsquo;integrale la <b>perde</b>. Crisanti (pag. 254) lo dice senza mezzi termini a proposito del gas di bosoni: la formula ottenuta «non è corretta poiché siamo passati dalla sommatoria all&rsquo;integrale in modo illecito, perdendo un termine singolare, corrispondente al caso in cui $p=0$», e ripara aggiungendo a mano il termine mancante.</p>
  <p>Quel termine aggiunto a mano <b>è</b> la condensazione di Bose-Einstein. Non è un dettaglio tecnico rattoppato: è un intero stato della materia che la traduzione somma-integrale aveva cancellato. E la condizione sotto cui la cancellazione è innocua — che nessuno stato sia macroscopicamente occupato — è ancora una volta la stessa cosa che chiediamo quando chiediamo $n_{\rm MB}\ll1$. Tutti i fili di questo movimento convergono sullo stesso numero, ed è ora di calcolarlo.</p>`}
]},

/* ---------------- 07 · LA LUNGHEZZA TERMICA ---------------- */
{ num:'07', title:'La lunghezza termica di de Broglie: da dove viene, e perche proprio quella', meta:'da de Broglie alla convenzione con due pi greco · il pacchetto termico · il potenziale chimico · il criterio dedotto e non postulato',
  blocchi:[
  {t:'prosa', title:'Un atomo e un pacchetto d onda, e ha una taglia', tag:'costruzione', html:R`
  <p>La lunghezza $\lambda$ è comparsa due volte per pura contabilità dimensionale — nella partizione di singola particella e nell&rsquo;entropia — e finora l&rsquo;abbiamo trattata come un&rsquo;abbreviazione. Ora le diamo il significato che ha, seguendo l&rsquo;argomento che Crisanti riporta da Huang (pag. 229): <i>gli atomi di un gas sono nella realtà dei pacchetti d&rsquo;onde; si possono descrivere come palle da biliardo solo ad alte temperature, perché lì le loro dimensioni sono molto più piccole delle distanze medie fra particelle.</i></p>
  <p>Se un atomo è un pacchetto d&rsquo;onda, ha un&rsquo;estensione spaziale, e quell&rsquo;estensione si stima con de Broglie. L&rsquo;impulso tipico di una particella in un gas a temperatura $T$ si legge dall&rsquo;equipartizione, che fissa l&rsquo;energia cinetica media $p_0^2/2m$ al valore $\tfrac32T$; dunque</p>
  $$p_0=\sqrt{3mT}\qquad\lambda_0=\frac{h}{p_0}$$
  <p>cioè $\lambda_0$ vale $h/\sqrt{3mT}$. Il pacchetto si costruisce sovrapponendo onde piane di lunghezza d&rsquo;onda vicina a $\lambda_0$, e la sua delocalizzazione spaziale è governata dalla relazione di indeterminazione $\Delta x\,\Delta p\simeq\hbar$: c&rsquo;è una certa libertà nella ripartizione fra $\Delta x$ e $\Delta p$, ma l&rsquo;ordine di grandezza della delocalizzazione è proprio $\lambda_0$.</p>
  <p><b>E qui arriva la domanda che nessuno pone e che vale la pena porre</b>: perché allora la letteratura, e tutte e tre le nostre fonti, definiscono la lunghezza termica con un $2\pi$ invece che con un $3$?</p>
  $$\lambda\equiv\frac{h}{\sqrt{2\pi mT}}=\sqrt{\frac{2\pi\hbar^2}{mT}}$$
  <p>La risposta è disarmante, e Crisanti (pag. 255) la scrive senza infiorettature: <i>i fattori numerici sono una scelta conveniente per avere delle relazioni termodinamiche in forma più semplice</i>. Il $2\pi$ non viene dalla fisica del pacchetto: viene dall&rsquo;integrale gaussiano della tappa 01, ed è scelto <b>apposta</b> perché la partizione di singola particella risulti $z_1=V/\lambda^3$ pulita, senza costanti davanti. Le due lunghezze differiscono di un fattore</p>
  $$\frac{\lambda_0}{\lambda}=\sqrt{\frac{2\pi}{3}}\approx1{,}447$$
  <p>cioè meno del cinquanta per cento. <b>Questo va tenuto a mente quando si usa il criterio</b>: $n\lambda^3\ll1$ è una condizione di ordine di grandezza, e non cambia natura se il numero puro davanti cambia del quaranta per cento. Le fonti stesse lo dicono — Crisanti parla di «grossolana separazione» fra la zona classica e quella quantistica. Quando il criterio dà $10^{-6}$ o $10^{3}$ la risposta è netta; quando dà $1{,}5$ bisogna fare il conto vero con la statistica giusta.</p>`},
  {t:'prosa', title:'Il potenziale chimico, e il criterio che ne discende', tag:'costruzione', html:R`
  <p>Adesso ricaviamo il criterio <i>deducendolo</i>, invece di annunciarlo. La strada è quella di Grilli-Giardina (pag. 55-56), e parte dalla quantità introdotta nella tappa 03: il numero medio di occupazione di uno stato di singola particella. Con il potenziale chimico esso si scrive in forma compatta,</p>
  $$n_{\rm MB}(\mathbf x,\mathbf p)=e^{\beta(\mu-H(\mathbf x,\mathbf p))}$$
  <p>e per arrivarci serve $\mu$. Lo si ottiene derivando l&rsquo;energia libera rispetto al numero di particelle. Scrivendo $F=-NT\log z_1+NT\log N-NT$, che è la forma esplicita della $F$ della tappa 01,</p>
  $$\mu=\left(\frac{\partial F}{\partial N}\right)_{T,V}=-T\log z_1+T\log N$$
  <p>— dove i due termini in $NT$ si cancellano derivando, ed è per questo che il risultato è così pulito. Raccogliendo il logaritmo, $\mu$ è meno $T$ per il logaritmo del rapporto $z_1/N$, che è la forma in cui quella fonte lo scrive. Esponenziando, e usando $z_1=V/\lambda^3$:</p>
  $$e^{\beta\mu}=\frac{N}{z_1}=n\lambda^3$$
  <p><b>Ecco il numero, e non l&rsquo;abbiamo postulato: è la fugacità del gas.</b> Adesso il criterio si legge da solo. Perché la prescrizione classica sia corretta — cioè perché sia lecito tenere conto della indistinguibilità dividendo per $N!$ invece che simmetrizzando le funzioni d&rsquo;onda — bisogna che sia <b>raro che due particelle occupino lo stesso stato</b>. In formule, serve $n_{\rm MB}\ll1$ per <i>ogni</i> stato $(\mathbf x,\mathbf p)$, e il caso peggiore è lo stato di energia più bassa, dove $e^{-\beta H}$ è massimo e vale circa uno. Dunque la condizione su tutti gli stati collassa in una condizione sola:</p>
  $$e^{\beta\mu}\ll1\qquad\Longleftrightarrow\qquad n\lambda^3\ll1\qquad\Longleftrightarrow\qquad\lambda\ll n^{-1/3}$$
  <p>Le tre scritture sono la stessa cosa detta in tre lingue. La prima dice che il potenziale chimico è <b>negativo e grande in modulo</b>, $\mu<0$ con $|\mu|\gg T$. La seconda dice che il <b>volume termico</b> $\lambda^3$ è molto minore del volume specifico $v=V/N$ a disposizione di ciascuna particella — è la forma $\lambda^3/v\ll1$ di Grilli-Giardina. La terza, la più visiva, dice che <b>il pacchetto d&rsquo;onda di una particella è molto più piccolo della distanza che la separa dalla vicina</b>: i pacchetti non si sovrappongono, e finché non si sovrappongono non c&rsquo;è modo di accorgersi che le particelle sono identiche.</p>
  <p>C&rsquo;è una quarta lettura, equivalente e utile all&rsquo;orale: $z_1=V/\lambda^3$ è il <b>numero di stati termicamente accessibili</b> a una particella, e $n\lambda^3$ è il rapporto $N/z_1$ fra particelle e stati disponibili. La statistica classica vale quando <b>gli stati sono molti di più delle particelle</b>, perché allora la doppia occupazione è un evento raro e le differenze fra bosoni e fermioni non si manifestano. Detta così, si capisce anche perché il criterio si viola in due modi opposti — raffreddando (gli stati accessibili diminuiscono) o comprimendo (le particelle aumentano) — e perché entrambi portano nello stesso regime.</p>`}
]},

/* ---------------- 08 · IL CRITERIO E I NUMERI ---------------- */
{ num:'08', title:'Il criterio della densita in unita di volume termico, e i numeri che lo decidono', meta:'la disuguaglianza da verificare sui numeri del problema · elio a temperatura ambiente · elettroni in un metallo · un condensato atomico',
  blocchi:[
  {t:'prosa', title:'Come si verifica un criterio, e con quali costanti', tag:'regola operativa', html:R`
  <p>Il criterio della tappa precedente è scritto in unità con $k_B=1$, dove la temperatura è un&rsquo;energia. Per farci i conti bisogna rimetterlo in unità SI, e la lunghezza termica torna nella forma in cui va usata in laboratorio:</p>
  $$\lambda=\frac{h}{\sqrt{2\pi mk_BT}}$$
  <p>con $h=6{,}626\times10^{-34}$ J s, $k_B=1{,}381\times10^{-23}$ J/K, e $m$ la massa della singola particella. È qui che la divergenza di convenzione fra le fonti smette di essere accademica: Crisanti e Grilli-Giardina scrivono $\lambda=\sqrt{2\pi\hbar^2/(mT)}$ perché per loro $T$ è già un&rsquo;energia, Falcioni-Vulpiani tengono $k_B$ esplicito. <b>Le due formule sono la stessa formula</b>, e confonderle — mettere i kelvin dove va un&rsquo;energia — sbaglia il volume termico di decine di ordini di grandezza, cioè produce un verdetto privo di senso invece che impreciso.</p>
  <p>La procedura da seguire, e da ripetere identica in ogni esercizio, è una lista di quattro righe. <b>(1)</b> Si estrae la densità $n$ dai dati: da pressione e temperatura con $n=p/(k_BT)$ per un gas, dalla densità di massa e dal peso atomico per un liquido o un solido, da un conteggio di elettroni per atomo per un metallo. <b>(2)</b> Si calcola $\lambda$ con la massa <i>della particella</i>, non della mole. <b>(3)</b> Si fa il prodotto $n\lambda^3$ e si guarda l&rsquo;esponente, non la mantissa: è un criterio a <span class="str" data-str="ordini-di-grandezza">ordini di grandezza</span>, e la cifra significativa non serve a nulla. <b>(4)</b> Si confronta anche $\lambda$ con la distanza interparticellare $n^{-1/3}$, che è la stessa informazione in forma geometrica ed è quella che si ricorda.</p>
  <p>Facciamola su tre sistemi, scelti perché danno tre risposte diverse.</p>`},
  {t:'reveal', title:'Tre casi, tre risposte', tag:'costruzione', steps:[
   {label:'Elio gassoso a temperatura ambiente: classico con sei ordini di margine', body:R`
   <p>Elio a $T=300$ K e pressione atmosferica, $p=1{,}013\times10^{5}$ Pa, con massa atomica $m\approx6{,}64\times10^{-27}$ kg. La densità si legge dall&rsquo;equazione di stato che abbiamo ricavato nella tappa 01: $n=2{,}45\times10^{25}\ \mathrm{m^{-3}}$. La lunghezza termica vale $\lambda=5{,}04\times10^{-11}\ \mathrm{m}$, cioè mezzo ångström — <b>più piccola dell&rsquo;atomo stesso</b>. La distanza media fra le particelle, $n^{-1/3}$, vale $3{,}45\times10^{-9}\ \mathrm{m}$, settanta volte tanto. Il criterio dà</p>
   $$n\lambda^3=3{,}13\times10^{-6}$$
   <p>e in forma geometrica $\lambda/n^{-1/3}=0{,}0146$. <b>Sei ordini di grandezza di margine</b>: la descrizione classica non è un&rsquo;approssimazione accettabile, è esatta per ogni scopo pratico. Si può chiedere quanto bisognerebbe raffreddare l&rsquo;elio per portarlo al confine. La temperatura di degenerazione si ottiene imponendo che $n\lambda^3$ valga uno, che dà $k_BT_0=\dfrac{2\pi\hbar^2}{m}n^{2/3}$, e per questa densità vale circa $0{,}064$ K. <b>Ma l&rsquo;elio liquefa a $4{,}2$ K</b>, sessanta volte prima: a pressione atmosferica il gas di elio non diventa mai quantistico, perché smette di essere un gas.</p>`},
   {label:'Elettroni di conduzione in un metallo: quantistico di quattro ordini', body:R`
   <p>Stesso conto, stessa temperatura, particella diversa. Nel rame ogni atomo cede circa un elettrone di conduzione, e la densità elettronica è $n=8{,}5\times10^{28}\ \mathrm{m^{-3}}$ — tremila volte quella del gas di elio. Ma il fattore che domina è un altro: la massa dell&rsquo;elettrone è $m=9{,}11\times10^{-31}$ kg, settemila volte più piccola di quella dell&rsquo;atomo di elio, e $\lambda\propto m^{-1/2}$. Il risultato è</p>
   $$\lambda=4{,}30\times10^{-9}\ \mathrm{m}$$
   <p>cioè <b>quarantatré ångström</b>, ottantacinque volte l&rsquo;elio. La distanza media fra elettroni è invece $2{,}27\times10^{-10}\ \mathrm{m}$, e il rapporto si è rovesciato: $\lambda$ è <b>diciannove volte più grande</b> della distanza interparticellare, $\lambda/n^{-1/3}\approx18{,}9$. Il criterio dà</p>
   $$n\lambda^3=6{,}77\times10^{3}$$
   <p>cioè quattro ordini di grandezza <i>dalla parte sbagliata</i>. La temperatura di degenerazione, con la stessa formula di prima, vale $T_0\approx1{,}07\times10^{5}$ K: <b>il rame fonde a $1358$ K</b>, ottanta volte meno, quindi il gas di elettroni di un metallo è degenere a <i>qualunque</i> temperatura a cui il metallo esista. Ecco perché l&rsquo;equipartizione sbaglia il calore specifico elettronico di due ordini di grandezza, ed ecco perché Falcioni-Vulpiani (pag. 73), per ricavare la legge di Richardson, usano Fermi-Dirac e non Maxwell-Boltzmann.</p>
   <div class="note"><b>Un confronto con la tabella della fonte, e una discrepanza dichiarata.</b> Crisanti (pag. 230) riporta una tabella di temperature di degenerazione: idrogeno gassoso a $2\times10^{19}\ \mathrm{cm^{-3}}$ dà $5\times10^{-2}$ K, elio liquido a $2\times10^{22}\ \mathrm{cm^{-3}}$ dà $2$ K, elettroni in un metallo a $1\times10^{22}\ \mathrm{cm^{-3}}$ danno $1\times10^{4}$ K. Rifacendo il conto con la formula che la fonte stessa scrive, alla densità elettronica della tabella si ottiene $2{,}58\times10^{4}$ K, cioè <b>due volte e mezzo il valore tabulato</b>. Non è un errore da correggere: è la conferma che $T_0$ è definita a meno di fattori di ordine uno — dipende da quale convenzione di $\lambda$ si usa e da dove si mette l&rsquo;uguale nel criterio. La fonte stessa la chiama «una grossolana separazione fra zone a regime classico e quantistico». <b>Quando il verdetto sono quattro ordini di grandezza, un fattore due e mezzo non lo cambia</b>; quando il verdetto è al confine, la tabella non serve e serve il conto esatto.</div>`},
   {label:'Un condensato atomico: esattamente al confine', body:R`
   <p>Il terzo caso è quello per cui vale la pena aver fatto tutto il resto, perché è il caso in cui il criterio non dà una risposta ovvia ma <i>una soglia</i>. Un gas di atomi di rubidio-87 in una trappola ottica, $m=1{,}44\times10^{-25}$ kg, densità $n=10^{20}\ \mathrm{m^{-3}}$ — centomila volte più <b>rarefatto</b> dell&rsquo;aria — e temperatura $T=5\times10^{-7}$ K, cioè mezzo microkelvin. La rarefazione spinge verso il classico, il freddo verso il quantistico, e vince il freddo:</p>
   $$\lambda=2{,}65\times10^{-7}\ \mathrm{m}$$
   <p>un quarto di micron, cioè <b>una lunghezza d&rsquo;onda ottica</b>: il pacchetto d&rsquo;onda di un singolo atomo è grande come la luce che lo illumina. La distanza media fra gli atomi è $2{,}15\times10^{-7}\ \mathrm{m}$, praticamente la stessa cosa, e</p>
   $$n\lambda^3=1{,}85$$
   <p>Né molto minore né molto maggiore di uno: <b>siamo esattamente sul confine</b>, ed è lì che il criterio smette di essere un&rsquo;approssimazione comoda e diventa una previsione fisica. La teoria del gas di Bose ideale dice che la condensazione comincia quando la densità in unità di volume termico raggiunge il valore</p>
   $$\zeta(3/2)=2{,}612$$
   <p>— la funzione zeta di Riemann calcolata in tre mezzi, che compare perché somma i contributi di tutti gli stati eccitati. Il nostro gas sta appena sotto quella soglia. Raffreddandolo di un altro fattore $1{,}3$ in temperatura, $\lambda$ cresce di $1{,}14$, $n\lambda^3$ supera $2{,}6$, e una frazione macroscopica degli atomi cade nello stato fondamentale: <b>è il termine singolare $p=0$ che la tappa 06 aveva visto sparire nel passaggio dalla somma all&rsquo;integrale</b>. Il criterio di validità della statistica classica, letto al contrario, è la condizione di esistenza di uno stato della materia.</p>`}
  ]},
  {t:'plot', title:'Il piano densita-temperatura, e i tre confini',
   intro:R`In ascissa il logaritmo decimale della densità in particelle per metro cubo; in ordinata il logaritmo decimale della temperatura in kelvin. Le curve continue sono i livelli di $n\lambda^3$ per l'elio; le tratteggiate sono il confine a $n\lambda^3$ unitario per gli elettroni e per il rubidio-87, che hanno massa diversa e quindi confine diverso. I tre punti sono i casi svolti.`,
   plots:[
    {kind:'contour', f:'x - 27.177 - 1.5*y', xr:[18,31], yr:[-7,4], equal:false, height:380, ticks:6,
     levels:[-6,-3,0,3], col:'#5eead4', width:2,
     label:'elio: livelli 10^-6, 10^-3, 1, 10^3 (il terzo e il confine)',
     overlays:[
      {f:'x - 21.383 - 1.5*y', levels:[0], col:'#ff6b6b', dash:true, width:2.4, label:'elettroni: confine n lambda^3 = 1'},
      {f:'x - 29.183 - 1.5*y', levels:[0], col:'#b98cff', dash:true, width:2.4, label:'rubidio-87: confine n lambda^3 = 1'}
     ],
     marks:[
      {x:25.39, y:2.48, label:'elio a 300 K', col:'#5eead4', up:true},
      {x:28.93, y:2.48, label:'elettroni del rame', col:'#ff6b6b', left:true, up:true},
      {x:20.0, y:-6.3, label:'rubidio ultrafreddo', col:'#b98cff'}
     ],
     title:'regime classico e regime quantistico nel piano densita-temperatura',
     xlabel:'log10 della densita (particelle per metro cubo)', ylabel:'log10 della temperatura (K)'}
   ],
   leggi:R`<p><b>Le rette hanno tutte la stessa pendenza, e la pendenza è il contenuto.</b> Il luogo a $n\lambda^3$ costante è una retta di pendenza $3/2$ in questo piano, perché $\lambda^3\propto T^{-3/2}$: per restare sullo stesso valore del criterio, moltiplicare la densità per mille richiede di moltiplicare la temperatura per cento. <b>La temperatura è un&rsquo;arma più potente della densità</b>, ed è il motivo per cui la fisica degli atomi freddi lavora su gas centomila volte più rarefatti dell&rsquo;aria invece di comprimerli.</p>
   <p><b>Le tre rette sono parallele ma traslate, e la traslazione è la massa.</b> Il confine si sposta di $\tfrac32\log_{10}(m/m')$ cambiando particella: gli elettroni, quasi ottomila volte più leggeri dell&rsquo;elio, hanno il confine spostato di quasi sei decadi verso sinistra — cioè diventano quantistici a densità molto più basse o temperature molto più alte. Il rubidio, ventidue volte più pesante dell&rsquo;elio, ha il confine spostato dalla parte opposta. <b>A parità di condizioni, più una particella è leggera più è quantistica.</b></p>
   <p><b>Dove stanno i tre punti rispetto ai loro confini.</b> L&rsquo;elio a $300$ K sta sei decadi a sinistra del suo confine, in pieno regime classico. Gli elettroni del rame stanno quasi quattro decadi a destra del loro, in pieno regime degenere. Il rubidio ultrafreddo sta <i>sopra</i> la sua retta di un soffio, ed è la ragione per cui quel punto del piano ha richiesto un premio Nobel per essere raggiunto: non basta raffreddare, bisogna raffreddare senza che il gas diventi liquido, cioè restando rarefatti — che è l&rsquo;unico modo di attraversare il confine restando un gas.</p>`}
]},

/* ---------------- 09 · LE TRE STATISTICHE ---------------- */
{ num:'09', title:'Le tre statistiche, e come collassano sulla stessa curva ad alta temperatura', meta:'numeri di occupazione · la fugacita come parametro piccolo · la prima correzione quantistica · la domanda finale di ogni esercizio',
  blocchi:[
  {t:'prosa', title:'Un unica formula con due segni, e il limite comune', tag:'architettura', html:R`
  <p>Questa tappa risponde alla domanda che, misurata sulle prove d&rsquo;esame, è la più frequente di tutto il corso, e che non compare quasi mai da sola: arriva in fondo a un esercizio sul gas di Fermi o su quello di Bose, nella forma «si verifichi che nel limite di alta temperatura si ritrova il risultato classico». Saperla svolgere vale spesso più punti del corpo dell&rsquo;esercizio, e si svolge sempre allo stesso modo.</p>
  <p>Il punto di partenza è che le tre statistiche <b>non sono tre teorie</b>: sono una formula con due segni più il suo limite. Il numero medio di occupazione di uno stato di energia $\varepsilon$ è</p>
  $$\langle n_\varepsilon\rangle=\frac{1}{e^{\beta(\varepsilon-\mu)}\mp1}$$
  <p>con il segno superiore per i bosoni (Bose-Einstein) e quello inferiore per i fermioni (Fermi-Dirac). Falcioni-Vulpiani (pag. 42) le ricavano entrambe da un problema di massimizzazione della molteplicità con i vincoli quantistici sull&rsquo;occupazione, e Crisanti (pag. 252) dalla partizione gran canonica. L&rsquo;unica differenza fra le due è quell&rsquo;$1$ al denominatore, con il suo segno, e <b>l&rsquo;unica cosa che conta è se quell&rsquo;uno è trascurabile</b> rispetto all&rsquo;esponenziale.</p>
  <p>Quando $e^{\beta(\varepsilon-\mu)}\gg1$ per ogni stato, l&rsquo;$1$ si può buttare, e restano tutte e tre la stessa cosa. Usando la <span class="str" data-str="serie-geometrica">serie geometrica</span> per espandere il denominatore, e introducendo la <b>fugacità</b> $z=e^{\beta\mu}$,</p>
  $$\frac{1}{e^{\beta(\varepsilon-\mu)}\mp1}\simeq e^{-\beta(\varepsilon-\mu)}=z\,e^{-\beta\varepsilon}$$
  <p>che è la statistica di Maxwell-Boltzmann della tappa 03. <b>La condizione è $z\ll1$</b>, ed è la stessa cosa del criterio della tappa 08, perché — come abbiamo ricavato lì — la fugacità vale esattamente $n\lambda^3$, a meno della degenerazione di spin. In simboli, con $g_s=2S+1$ stati di spin,</p>
  $$n=\frac{g_s}{\lambda^3}\,z\qquad\Longrightarrow\qquad z=\frac{n\lambda^3}{g_s}$$
  <p>Tutto il movimento si chiude qui: il criterio classico, il parametro di sviluppo delle correzioni quantistiche e la fugacità sono <b>lo stesso numero</b>, e chi lo riconosce non deve ricordare tre cose.</p>`},
  {t:'prosa', title:'La prima correzione quantistica, e il suo segno', tag:'costruzione', html:R`
  <p>Se $z$ è il parametro piccolo, allora il limite classico non è un muro ma il primo termine di una serie, e vale la pena calcolarne il secondo — perché è lì che si vede la differenza fra bosoni e fermioni. Seguiamo Grilli-Giardina (pag. 93-95), che Crisanti (pag. 267) rifà con gli stessi passaggi.</p>
  <p>Il gran potenziale del gas quantistico contiene l&rsquo;integrale $\displaystyle\int_0^\infty dy\,\frac{y^{3/2}}{z^{-1}e^{y}\mp1}$. Si riscrive l&rsquo;integrando come $ze^{-y}/(1\mp ze^{-y})$ e si espande il denominatore con la serie geometrica al primo ordine in $z$,</p>
  $$\frac{1}{1\mp ze^{-y}}\simeq1\pm ze^{-y}$$
  <p>così che l&rsquo;integrale si spezza in due integrali elementari, entrambi casi della <span class="str" data-str="funzione-gamma">funzione Gamma di Eulero</span>:</p>
  $$\int_0^\infty dy\,y^{3/2}e^{-y}=\Gamma\!\left(\frac52\right)=\frac{3\sqrt\pi}{4}$$
  $$\int_0^\infty dy\,y^{3/2}e^{-2y}=\frac{1}{2^{5/2}}\cdot\frac{3\sqrt\pi}{4}$$
  <p>Il secondo differisce dal primo solo per il fattore $2^{-5/2}$, che arriva dal riscalamento della variabile nell&rsquo;esponenziale. Rimettendo tutto insieme, derivando il gran potenziale rispetto al volume e usando $z\simeq n\lambda^3/g_s$, si ottiene l&rsquo;equazione di stato corretta al primo ordine:</p>
  $$PV=NT\left(1\mp\frac{n\lambda^3}{2^{5/2}g_s}\right)$$
  <p>con il segno superiore per i bosoni e quello inferiore per i fermioni. Il coefficiente numerico è</p>
  $$\frac{1}{2^{5/2}}=0{,}177$$
  <p><b>Il segno è tutta la fisica, e va saputo leggere.</b> Per i fermioni la pressione è <i>più alta</i> di quella classica: il principio di esclusione impedisce a due particelle di stare nello stesso stato, e questa impossibilità si traduce in una resistenza extra al confinamento — una pressione che esiste anche a temperatura zero, e che è ciò che tiene in piedi le nane bianche. Per i bosoni la pressione è <i>più bassa</i>: i bosoni preferiscono stare nello stesso stato, e questa attrazione statistica scarica il gas. Grilli-Giardina (pag. 95) lo annota proprio così: i fermioni hanno difficoltà a stare vicini, e quindi oppongono maggiore resistenza al contenimento.</p>
  <p>Vale la pena notare <i>quanto</i> vale la correzione nei tre casi della tappa precedente. Per l&rsquo;elio a temperatura ambiente, $0{,}177\times3{,}13\times10^{-6}$, cioè cinque parti su dieci milioni: invisibile. Per gli elettroni del rame la «correzione» varrebbe $1{,}2\times10^{3}$, cioè mille volte il termine che dovrebbe correggere — <b>e questo è il modo in cui uno sviluppo perturbativo dichiara di non valere</b>. Non c&rsquo;è correzione quantistica al gas classico di elettroni: c&rsquo;è un gas quantistico, e va risolto dall&rsquo;altro capo, quello degenere.</p>`},
  {t:'prosa', title:'Due verifiche che non passano dal limite', tag:'regola operativa', html:R`
  <p>Ci sono due relazioni che vale la pena tenere separate dal resto, perché sono <b>esatte</b> e quindi servono come controllo indipendente su qualunque conto, classico o quantistico. La prima è il legame fra pressione ed energia per un gas non relativistico in tre dimensioni: Grilli-Giardina la dimostrano confrontando le espressioni di $PV$ ed $E$ nel gran canonico e la enunciano come teorema, valida per fermioni e bosoni indifferentemente; Crisanti (pag. 262) la ottiene da $\Omega=-PV$ e la marca come risultato <b>esatto</b>, valido anche per il gas di Boltzmann. Verifichiamola nel caso classico, dove conosciamo tutto:</p>
  $$PV=\frac23E=\frac23\cdot\frac32NT=NT$$
  <p>torna. Il valore di questa relazione, in sede d&rsquo;esame, è che permette di ricavare la pressione senza derivare l&rsquo;energia libera: basta l&rsquo;energia.</p>
  <p>La seconda verifica riguarda le adiabatiche. Crisanti (pag. 262-264) mostra che per un gas ideale <i>quantistico</i>, per pura omogeneità del gran potenziale, restano costanti lungo un&rsquo;adiabatica sia $VT^{3/2}$ sia $PV^{5/3}$ — cioè <b>valgono le stesse leggi del gas monoatomico classico</b>. Ma con un avvertimento che è una domanda d&rsquo;orale già pronta: nel caso quantistico quelle leggi <i>non</i> discendono dal rapporto $C_P/C_V$ pari a $5/3$ né dalla differenza $C_P-C_V$ pari a $1$, che nel caso quantistico sono entrambe false. Stessa equazione, ragione diversa. È il tipo di coincidenza che fa sbagliare chi ricorda le formule invece delle derivazioni.</p>
  <p>Infine, un esempio in cui la scelta della statistica cambia la <i>forma funzionale</i> del risultato e non solo un coefficiente, perché è il caso in cui si vede che il criterio ha conseguenze misurabili. Falcioni-Vulpiani (pag. 72-73) calcolano la corrente termoionica emessa da un metallo caldo. Con Fermi-Dirac ottengono la <b>legge di Richardson</b></p>
  $$j_x=\frac{4\pi emk_B^2}{h^3}\,T^2e^{-W/k_BT}$$
  <p>con $W=e\varphi-\mu$ il lavoro di estrazione; con Maxwell-Boltzmann ottengono invece una dipendenza $T^{1/2}$ davanti all&rsquo;esponenziale e un esponente $e\varphi/k_BT$ al posto di $W/k_BT$. Le due si raccordano se si usa la fugacità classica</p>
  $$e^{\beta\mu}=\frac{\rho h^3}{2(2\pi mk_BT)^{3/2}}$$
  <p>— che è il nostro $n\lambda^3/g_s$ scritto nella convenzione con $k_B$ esplicito e con $g_s=2$ per lo spin dell&rsquo;elettrone. Ma quella fugacità è valida solo per $k_BT\gg\varepsilon_F$, e negli esperimenti reali vale l&rsquo;opposto: <b>la versione classica non è adatta a descrivere l&rsquo;effetto termoionico</b>, e quella fonte lo scrive esplicitamente. È il criterio della tappa 08 che decide quale delle due formule si confronta con i dati.</p>`},
  {t:'plot', title:'Le tre statistiche: dove si separano e dove collassano',
   intro:R`In ascissa la variabile $x=\beta(\varepsilon-\mu)$, cioè la distanza dell'energia dello stato dal potenziale chimico, in unità di $T$. In ordinata il numero medio di occupazione $\langle n\rangle$. Le tre curve sono Bose-Einstein, Maxwell-Boltzmann e Fermi-Dirac.`,
   plots:[
    {kind:'func2d', xr:[0.3,4], yr:[0,3], height:340, ticks:6,
     title:'numero medio di occupazione nelle tre statistiche',
     curves:[
      {f:'1/(exp(x)-1)', col:'#5eead4', label:'Bose-Einstein: occupazione piu alta, diverge a x = 0'},
      {f:'exp(-x)', col:'#d8a13a', label:'Maxwell-Boltzmann: esponenziale pura'},
      {f:'1/(exp(x)+1)', col:'#ff6b6b', label:'Fermi-Dirac: occupazione piu bassa, satura a 1'}
     ],
     xlabel:'x = (eps - mu) / T', ylabel:'occupazione media'}
   ],
   leggi:R`<p><b>A destra le tre curve sono indistinguibili, ed è il limite classico.</b> Già a $x=2$ i tre valori stanno entro il venti per cento, a $x=3$ entro il cinque. Il motivo si legge nella formula: l&rsquo;$1$ al denominatore conta solo quando $e^{x}$ è dell&rsquo;ordine di uno, cioè per $x$ piccolo. <b>Il limite classico non è un limite di alta energia: è un limite di alta $x$</b>, e siccome $x=\beta(\varepsilon-\mu)$ lo si raggiunge rendendo $\mu$ molto negativo — che è esattamente $z\ll1$, cioè $n\lambda^3\ll1$.</p>
   <p><b>A sinistra si separano, e il modo in cui si separano è il principio di Pauli.</b> La curva di Fermi (rossa) sta sempre <i>sotto</i> la maxwelliana: è più difficile mettere fermioni in uno stato. La curva di Bose (verde) sta sempre <i>sopra</i> e diverge quando l&rsquo;energia si avvicina al potenziale chimico: è più facile mettere bosoni dove ce ne sono già. La maxwelliana non sa distinguerli e passa in mezzo, il che è il senso preciso della frase «nel limite classico si perde la distinzione fra bosoni e fermioni».</p>
   <p><b>Come si usa questa figura in sede d&rsquo;esame.</b> Quando l&rsquo;ultima domanda chiede di verificare il limite classico, quel che va mostrato è che il problema si colloca a $x$ grande, cioè che $z\ll1$, cioè che $n\lambda^3\ll1$; poi si sostituisce $\langle n\rangle\to ze^{-\beta\varepsilon}$ e si rifanno gli integrali, che diventano Gamma di Eulero. <b>Non si prende il limite $T\to\infty$ a cuor leggero</b>: quel che si sta facendo è uno sviluppo in $z$, e va detto qual è il parametro piccolo.</p>`}
]},

/* ---------------- 10 · ESERCIZI ---------------- */
{ num:'10', title:'Esercizi — tocca a te', meta:'il gas con spettro a potenza qualsiasi · il gas in campo gravitazionale · il limite classico di un gas di fermioni',
  blocchi:[
  {t:'esercizio', title:'1 · Il gas perfetto con spettro a potenza qualsiasi',
   src:'Crisanti, esercizio assegnato a pag. 210 e svolto a pag. 211: il caso che separa cio che dipende dallo spettro da cio che non ne dipende',
   testo:R`Un gas perfetto di $N$ particelle ha hamiltoniana di singola particella $H_i=a|\mathbf p_i|^b$, con $a,b>0$. Calcola la funzione di partizione di singola particella, l'energia libera, l'energia media e la pressione. Discuti quali risultati dipendono da $b$ e quali no, e verifica i due casi noti $b=2$ (gas non relativistico) e $b=1$ (gas ultrarelativistico).`,
   steps:[
    {label:'La partizione: un cambio di variabile e una Gamma', body:R`
    <p>Non essendoci interazione vale $Z_N=z_1^N/N!$, e l&rsquo;integrale sulle posizioni dà $V$. Restano gli impulsi, in coordinate sferiche:</p>
    $$z_1=\frac{4\pi V}{h^3}\int_0^\infty dp\,p^2e^{-\beta ap^b}$$
    <p>Il <span class="str" data-str="cambio-di-variabile">cambio di variabile</span> giusto è quello che rende l&rsquo;esponente lineare: $y=\beta ap^b$. Allora $p=(y/\beta a)^{1/b}$, e il differenziale porta un fattore $y^{1/b-1}$; insieme al $p^2$ l&rsquo;integrale diventa</p>
    $$\int_0^\infty dy\,y^{3/b-1}e^{-y}=\Gamma\!\left(\frac3b\right)$$
    <p>che è la definizione stessa della funzione Gamma di Eulero. Raccogliendo le costanti,</p>
    $$z_1=\frac{4\pi V}{bh^3}\left(\frac Ta\right)^{3/b}\Gamma\!\left(\frac3b\right)$$
    <p>Per $b=1$ l&rsquo;integrale si riduce al caso intero, $\Gamma(3)=2$, ed è il conto che Crisanti fa a pag. 202 per il gas relativistico. <b>Il criterio invocato</b> è che ogni integrale della forma $\int_0^\infty p^{n}e^{-\alpha p^b}dp$ si riduce a una Gamma con il cambio di variabile che linearizza l&rsquo;esponente: è la mossa standard, e conviene riconoscerla invece di reinventarla ogni volta.</p>`},
    {label:'Energia e pressione: una dipende da b, l altra no', body:R`
    <p>Tutta la dipendenza da $\beta$ sta nel fattore $(T/a)^{3/b}$, quindi $\log z_1=\text{cost}-\frac3b\log\beta$ e</p>
    $$\frac{\partial\log z_1}{\partial\beta}=-\frac{3}{b\beta}$$
    <p>da cui l&rsquo;energia media</p>
    $$E=-N\frac{\partial\log z_1}{\partial\beta}=\frac{3N}{b\beta}=\frac{3NT}{b}$$
    <p>Per la pressione si passa da $F=-T\log Z_N$: l&rsquo;unica dipendenza da $V$ resta il $\log V$ dentro $z_1$, con coefficiente $-NT$, esattamente come nella tappa 01. Dunque</p>
    $$P=-\left(\frac{\partial F}{\partial V}\right)_{T,N}=\frac{NT}{V}$$
    <p><b>Il risultato da portare via</b>: l&rsquo;equazione di stato $PV=NT$ non dipende da $b$, cioè <i>non dipende dallo spettro</i>; la relazione energia-temperatura sì. Verifica sui due casi noti: $b=2$ dà $E=\tfrac32NT$, il gas monoatomico; $b=1$ dà $E=3NT$, il gas ultrarelativistico — il doppio dell&rsquo;energia a parità di temperatura e di pressione. <b>Il criterio</b> è quello della tappa 05: l&rsquo;equipartizione generalizzata assegna $T/s$ per ogni termine di potenza $s$, e qui $s=b$ su tre gradi di libertà.</p>`}
   ]},
  {t:'esercizio', title:'2 · Il gas perfetto in campo gravitazionale',
   src:'Crisanti pag. 205-207: il caso in cui il calore specifico non e quello che ci si aspetta, e il motivo sta in un esponente',
   testo:R`$N$ particelle di massa $m$ sono in un cilindro di sezione $A$ e altezza infinita, in campo gravitazionale uniforme $g$, a temperatura $T$. Calcola la funzione di partizione di singola particella, l'energia media e il calore specifico a volume costante. Spiega perché il risultato è diverso da $\tfrac32NT$ senza rifare il conto, usando il teorema di equipartizione.`,
   steps:[
    {label:'La partizione si spezza in impulsi e quota', body:R`
    <p>L&rsquo;hamiltoniana di singola particella è $H_i=\frac{p^2}{2m}+mgz$, somma di un pezzo che dipende solo dagli impulsi e di uno che dipende solo dalla quota. L&rsquo;esponenziale si fattorizza, e con essa l&rsquo;integrale:</p>
    $$z_1=\frac{A}{h^3}\left(\frac{2\pi m}{\beta}\right)^{3/2}\int_0^\infty dz\,e^{-\beta mgz}$$
    <p>dove il fattore con l&rsquo;esponente $3/2$ è il solito prodotto di tre gaussiane e $A$ viene dall&rsquo;integrazione sulle due coordinate orizzontali. L&rsquo;integrale in quota è elementare:</p>
    $$\int_0^\infty dz\,e^{-\beta mgz}=\frac{1}{\beta mg}$$
    <p>Notare che <b>converge solo perché il cilindro è infinito verso l&rsquo;alto e chiuso in basso</b>: se fosse infinito in entrambi i versi il gas non avrebbe stato di equilibrio, e la partizione divergerebbe. Il risultato complessivo è $z_1\propto\beta^{-5/2}$: tre mezzi dalle gaussiane degli impulsi, e <b>uno intero</b> dall&rsquo;esponenziale della quota.</p>`},
    {label:'Energia, calore specifico, e la lettura con l equipartizione', body:R`
    <p>Da $z_1\propto\beta^{-5/2}$,</p>
    $$\frac{\partial\log z_1}{\partial\beta}=-\frac{5}{2\beta}$$
    <p>e quindi</p>
    $$E=\frac{5N}{2\beta}=\tfrac52NT$$
    $$C_V=\frac{\partial E}{\partial T}=\tfrac52N$$
    <p><b>La lettura senza conti</b>, che è ciò che l&rsquo;esercizio chiede davvero. L&rsquo;equipartizione generalizzata della tappa 05 dice che un termine di potenza $s$ porta $T/s$. Qui ci sono tre termini quadratici negli impulsi ($s=2$, dunque $T/2$ ciascuno) e <b>un termine lineare nella quota</b> ($s=1$, dunque $T$ intero). Il totale è</p>
    $$3\times\tfrac T2+T=\tfrac52T$$
    <p>per particella, cioè esattamente il conto appena fatto. <b>Il criterio da riconoscere</b>: non contare «gradi di libertà» ma <i>termini dell&rsquo;hamiltoniana con la loro potenza</i>. Un potenziale lineare vale il doppio di uno quadratico, e questo spiega anche l&rsquo;osservazione di Crisanti (pag. 205) che il calore specifico in campo gravitazionale è più grande di quello del gas libero: le particelle immagazzinano energia anche salendo, non solo correndo.</p>`}
   ]},
  {t:'esercizio', title:'3 · Il limite classico di un gas di fermioni',
   src:'la domanda finale che 16 prove su 47 pongono: si verifichi che ad alta temperatura si ritrova il risultato classico',
   testo:R`Per un gas ideale di fermioni di spin $1/2$ in tre dimensioni, mostra che nel limite di alta temperatura e bassa densità si ritrovano l'equazione di stato e l'energia del gas classico, e ricava la prima correzione quantistica. Dichiara esplicitamente qual è il parametro piccolo dello sviluppo, e verifica se l'espansione è utilizzabile per gli elettroni di conduzione di un metallo a temperatura ambiente.`,
   steps:[
    {label:'Il parametro piccolo, e lo sviluppo', body:R`
    <p>Il primo passo è <b>nominare il parametro</b>, ed è l&rsquo;unico passo in cui si può sbagliare in modo irrimediabile: non si sta prendendo un limite $T\to\infty$, si sta espandendo in <b>fugacità</b> $z=e^{\beta\mu}$. La relazione fra fugacità e dati del problema è quella della tappa 09: il numero di particelle si scrive con la funzione di Fermi, il cui sviluppo per $z$ piccolo è $z-\dfrac{z^2}{2^{3/2}}+\cdots$, e all&rsquo;ordine dominante</p>
    $$z\simeq\frac{n\lambda^3}{g_s}$$
    <p>con $g_s=2$ per lo spin un mezzo. <b>Quindi il parametro piccolo è $n\lambda^3$</b>: lo stesso numero del criterio di validità, e questo non è un caso — il limite classico è, letteralmente, il primo ordine dello sviluppo in quel parametro.</p>`},
    {label:'Ordine zero e primo ordine', body:R`
    <p>All&rsquo;ordine zero in $z$ si ritrovano tutte le formule classiche: dall&rsquo;espressione del gran potenziale con la sola $\Gamma(5/2)$ si ottiene $PV=NT$, e dall&rsquo;energia con $\Gamma(5/2)$ al numeratore si ottiene $E=\tfrac32NT$. Il controllo incrociato lo dà la relazione esatta fra pressione ed energia, valida per tutte e tre le statistiche:</p>
    $$\frac23E=\frac23\cdot\frac32NT=NT$$
    <p>Al primo ordine, con il conto della tappa 09, resta un termine con il segno dei fermioni:</p>
    $$PV=NT\left(1+\frac{n\lambda^3}{2^{5/2}g_s}\right)$$
    <p>La pressione è <b>più alta</b> di quella classica. <b>Il criterio invocato</b> è il principio di esclusione di Pauli: due fermioni non possono occupare lo stesso stato, e l&rsquo;indisponibilità degli stati già occupati si manifesta come una repulsione effettiva — che non è una forza, è statistica.</p>`},
    {label:'E per gli elettroni di un metallo?', body:R`
    <p>Qui l&rsquo;esercizio chiede di fare la cosa che distingue chi ha capito: <b>verificare il criterio invece di assumerlo</b>. Con i numeri della tappa 08, per gli elettroni di conduzione del rame a temperatura ambiente $n\lambda^3$ vale $6{,}77\times10^{3}$. Il «piccolo» parametro dello sviluppo vale quasi settemila, e la «correzione» al primo ordine sarebbe $0{,}177\times6{,}77\times10^{3}$, cioè mille volte più grande del termine che dovrebbe correggere.</p>
    <p><b>Conclusione da scrivere per esteso</b>: lo sviluppo non è utilizzabile, e il gas di elettroni di un metallo non è un gas classico con una piccola correzione quantistica — è un gas degenere, e va affrontato dal limite opposto, quello di temperatura nulla, dove gli stati si riempiono fino all&rsquo;energia di Fermi. È esattamente il motivo per cui Falcioni-Vulpiani (pag. 72-73), calcolando la corrente termoionica, scartano la versione classica: la condizione che la renderebbe valida, $k_BT\gg\varepsilon_F$, negli esperimenti reali è violata di due ordini di grandezza. <b>Una risposta che si limita a scrivere «per alte temperature si ritrova il classico» senza verificare il numero non risponde alla domanda</b>: la domanda è proprio se quel limite si applichi.</p>`}
   ]}
]},

/* ---------------- 11 · IL SENSO E LE ROTTE ---------------- */
{ num:'11', title:'Il senso, e le rotte', meta:'cosa lascia in mano · dove il criterio riappare in fisica · la domanda che porta avanti',
  blocchi:[
  {t:'prosa', title:'Cosa portarsi via', tag:'sintesi', html:R`
  <p><b>Il punto.</b> Il gas perfetto classico si risolve per intero con tre mosse — fattorizzare la partizione, fare tre integrali gaussiani, derivare l&rsquo;energia libera — e restituisce $PV=NT$, $E=\tfrac32NT$ e l&rsquo;entropia di Sackur-Tetrode. Ma la costruzione porta dentro di sé due oggetti che la meccanica classica non contiene: la cella di volume $h$ per grado di libertà, senza la quale l&rsquo;entropia non è adimensionale, e la divisione per $N!$, senza la quale non è estensiva. Sono i due segnali che <b>la teoria classica è un limite di qualcos&rsquo;altro</b>, e il resto del movimento serve a dire di cosa e fin dove.</p>
  <p><b>Che cosa ricordare, in ordine di durata.</b> Che la lunghezza termica $\lambda=h/\sqrt{2\pi mT}$ è la taglia del pacchetto d&rsquo;onda di una particella, e che $z_1=V/\lambda^3$ è il numero di stati che le sono accessibili. Che il criterio di validità $n\lambda^3\ll1$ ha quattro letture equivalenti — fugacità piccola, volume termico minore del volume specifico, pacchetti che non si sovrappongono, stati molti più delle particelle — e che <b>si verifica con i numeri del problema</b>, non si recita. Che la maxwelliana si ottiene marginalizzando, e che è un limite $N\to\infty$ di una distribuzione a supporto compatto. Che le tre velocità stanno nell&rsquo;ordine moda, media, quadratica media, e che si sceglie quella giusta chiedendosi cosa si sta mediando. Che l&rsquo;equipartizione generalizzata dà $T/s$ per un termine di potenza $s$, e che fallisce in tre modi: spettro non quadratico, spettro discreto con quanto grande, spettro limitato superiormente.</p>
  <p><b>E i tre numeri</b>, che sono la cosa più utile di tutto il movimento: elio a temperatura ambiente $3\times10^{-6}$, elettroni di un metallo $7\times10^{3}$, gas atomico ultrafreddo circa uno. Il primo dice «usa Boltzmann senza pensarci», il secondo dice «Boltzmann è inutilizzabile, vai al limite degenere», il terzo dice «sei sulla soglia di un nuovo stato della materia». <b>Di un movimento fatto di formule facili, ciò che resta è un criterio: prima di risolvere, misura quanto è grande il pacchetto d&rsquo;onda rispetto alla distanza fra i vicini.</b></p>`},
  {t:'prolessi', title:'Dove riappare questo movimento',
   oggetto:R`<b>Il confronto fra lunghezza termica e distanza interparticellare</b>: il numero puro $n\lambda^3$ che decide se un sistema di particelle identiche si può trattare come se fossero distinguibili.`,
   rotte:[
    {dove:'Gas degeneri<br>e materia compatta', txt:R`Quando $n\lambda^3\gg1$ e le particelle sono fermioni, gli stati si riempiono dal basso fino all&rsquo;<b>energia di Fermi</b> e il gas esercita una pressione anche a temperatura nulla. È la pressione che regge le <b>nane bianche</b> contro la gravità, e il suo cedimento al limite di Chandrasekhar è ciò che trasforma una stella in una supernova. Lo stesso conto, con i neutroni al posto degli elettroni, descrive le stelle di neutroni — e la scala di densità a cui il criterio si ribalta è quella che separa una stella da un residuo.`},
    {dove:'Condensazione<br>e atomi ultrafreddi', txt:R`Per i bosoni lo stesso confine ha un esito opposto: superata la soglia $\zeta(3/2)$, una frazione macroscopica degli atomi collassa nello stato fondamentale — quel termine $p=0$ che la sostituzione somma-integrale aveva cancellato. È il <b>condensato di Bose-Einstein</b>, realizzato nel 1995 raffreddando vapori atomici fino al punto del piano densità-temperatura che abbiamo calcolato nella tappa 08, e oggi il banco su cui si studiano superfluidità, vortici quantizzati e simulazione quantistica di reticoli.`},
    {dove:'Teoria cinetica<br>e trasporto', txt:R`La maxwelliana non descrive solo l&rsquo;equilibrio: è il punto fisso dell&rsquo;<b>equazione di Boltzmann</b>, e la distribuzione delle velocità è ciò da cui si calcolano cammino libero medio, viscosità, conducibilità termica e coefficienti di diffusione. Falcioni-Vulpiani mostrano che da questi, insieme ai dati termodinamici, si ricavano le <b>dimensioni delle molecole</b> e il numero di Avogadro — cioè che la meccanica statistica permette di contare gli atomi senza vederli.`},
    {dove:'Astrofisica<br>e diagnostica spettrale', txt:R`La larghezza Doppler di una riga spettrale è la maxwelliana letta dallo spettrografo: misurando un profilo si misura la temperatura di un gas a distanza arbitraria. Sulla stessa scala, il criterio $n\lambda^3$ decide quale regione di una stella è un plasma classico e quale è degenere — il nucleo di una gigante rossa è degenere mentre il suo inviluppo è classico, e la differenza fra i due regimi è ciò che innesca il <b>flash dell&rsquo;elio</b>.`}
   ],
   domanda:R`Abbiamo trattato il criterio $n\lambda^3\ll1$ come una soglia: sopra si usa una teoria, sotto un&rsquo;altra. <b>Domanda che porti avanti:</b> ma una soglia fra due descrizioni è quasi sempre il segno di una <i>transizione</i>, e qui la transizione è di un tipo particolare — non c&rsquo;è nessuna interazione fra le particelle, eppure il sistema cambia stato. La condensazione di Bose è l&rsquo;unico esempio di transizione di fase di un gas <b>ideale</b>, prodotta da sola dalla statistica di occupazione degli stati. La domanda è quindi: che cosa gioca, qui, il ruolo che nelle transizioni ordinarie gioca l&rsquo;energia di interazione? La risposta è che lo gioca il vincolo di simmetria della funzione d&rsquo;onda, cioè un&rsquo;<b>interazione effettiva di origine puramente combinatoria</b> — la stessa che in questo movimento abbiamo incontrato in forma innocua come divisione per $N!$. Capire fin dove quella combinatoria può imitare una forza è una delle domande da cui parte la fisica dei sistemi fortemente correlati.`}
]}

];


/* =================================================================== */
var byId = {}; TAPPE.forEach(function(s){ byId[s.num]=s; });

var VKEY='pm-nucleoms-09-visited';
function loadSeen(){ try{ return new Set(JSON.parse(localStorage.getItem(VKEY)||'[]')); }catch(e){ return new Set(); } }
function saveSeen(s){ try{ localStorage.setItem(VKEY, JSON.stringify(Array.from(s))); }catch(e){} }
var SEEN = loadSeen();

function renderNav(active){
  var nav=document.getElementById('sidebar');
  nav.innerHTML='';
  var h=document.createElement('h2'); h.textContent='Nucleo ms-09 · le tappe'; nav.appendChild(h);
  TAPPE.forEach(function(s){
    var b=document.createElement('button');
    b.className='navitem'+(active===s.num?' active':'')+(SEEN.has(s.num)?' seen':'');
    b.innerHTML='<span class="dot"></span><span class="nx">'+s.num+'</span><span>'+s.title+'</span>';
    b.onclick=function(){ showTappa(s.num); };
    nav.appendChild(b);
  });
}

/* ---- renderer dei blocchi ---- */
function sectionProsa(title, tag, html){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var body=elFromHTML('<div class="open-body">'+html+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function sectionGram(title, rows){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag gramtag">grammatica</span></h3>';
  var inner='<table class="gramtab">';
  rows.forEach(function(r){ inner+='<tr><td class="gs">'+r[0]+'</td><td>'+r[1]+'</td></tr>'; });
  inner+='</table>';
  var body=elFromHTML('<div class="gramwrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
/* --- blocco PLOT: la figura non decora, si legge. Ogni plot porta una chiave di lettura. --- */
function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';
  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionSvelabile(title, tag, html, sol){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var c=document.createElement('div'); c.className='collaudo-item';
  var q=document.createElement('div'); q.className='cq'; q.innerHTML=html||'';
  c.appendChild(q); typeset(q);
  if(sol){
    var a=document.createElement('div'); a.className='ca'; a.style.display='none';
    a.innerHTML='<b>Soluzione.</b> '+sol;
    var btn=document.createElement('button'); btn.className='reveal-btn small';
    btn.textContent='Rivela la soluzione';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a);
      btn.disabled=true; btn.classList.add('done'); btn.textContent='Soluzione rivelata'; };
    c.appendChild(btn); c.appendChild(a);
  }
  wrap.appendChild(c); return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    /* DUE SCHEMI, NON UNO — scoperto il 2026-10-06 provando le pagine vive. I movimenti
       scritti per primi (em-01..03, me-10b, i collaudi di gd-01..09 e di quattro em)
       usano una forma piu' semplice: `reveal` e `prolessi` con un solo `html`,
       `esercizio` e `collaudo` con `html` + `sol`. Il renderer ne conosceva una sola e
       chiamava `steps.forEach` su `undefined`: TypeError, e la tappa si fermava li' —
       62 blocchi in 17 movimenti su 74. Non si riscrive il contenuto per far contento
       il renderer: e' il renderer che deve leggere cio' che c'e'.
       E in fondo un ramo che NON muore: uno schema nuovo di domani deve far vedere un
       avviso in quella sezione, non spegnere la pagina sotto di se'. */
    try{
      if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
      else if(b.t==='prolessi') m.appendChild(b.rotte ? sectionProlessi(b)
                                   : sectionProsa(b.title,'prolessi',b.html));
      else if(b.t==='reveal')m.appendChild(b.steps ? sectionReveal(b.title,b.tag,b.steps)
                                   : sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='esercizio') m.appendChild(b.steps ? sectionEsercizio(b)
                                   : sectionSvelabile(b.title,'esercizio',b.html,b.sol));
      else if(b.t==='collaudo')  m.appendChild(b.items ? sectionCollaudo(b.title,b.items)
                                   : sectionSvelabile(b.title,'provi, poi riveli',b.html,b.sol));
      else if(b.t==='plot')      m.appendChild(sectionPlot(b));
      else m.appendChild(sectionProsa(b.title||'(blocco)', 'tipo sconosciuto: '+b.t,
                                      b.html||''));
    }catch(err){
      var avv=document.createElement('section'); avv.className='section';
      avv.innerHTML='<h3>'+(b.title||'(blocco)')+'<span class="tag">non reso</span></h3>'
        +'<p style="color:#ff6b6b">Questo blocco non si &egrave; potuto rendere ('
        +b.t+': '+err.message+'). Il resto della tappa continua sotto.</p>';
      m.appendChild(avv);
    }
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* I POP-UP DEGLI STRUMENTI. `cablaStrumenti` esisteva dal 18-09 e non la chiamava
     nessuno: i 229 rimandi del percorso erano <span> senza handler, e il clic non
     faceva niente. Nessun controllo poteva vederlo — la sintassi era valida, le schede
     c'erano tutte, le formule rendevano: il guasto esisteva solo a pagina viva. Qui, e
     dopo ogni inserimento successivo, perche' la tappa si rimonta da capo a ogni
     cambio e gli handler vanno riattaccati al DOM nuovo. */
  cablaStrumenti(m);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}
