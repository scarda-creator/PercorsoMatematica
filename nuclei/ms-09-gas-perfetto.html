var CORSO = 'meccanica-statistica';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["integrale-gaussiano"] = {"nome":"Integrale gaussiano","riga":"$\\displaystyle\\int_{-\\infty}^{+\\infty} e^{-ax^{2}}\\,dx=\\sqrt{\\pi/a}$ per $a>0$, e $\\displaystyle\\int_{-\\infty}^{+\\infty} x^{2}e^{-ax^{2}}\\,dx=\\tfrac12\\sqrt{\\pi/a^{3}}$.","serve":"E' l'unico integrale che serve davvero sapere a memoria in meccanica statistica, perche' l'energia cinetica e' quadratica nell'impulso e quindi ogni integrazione sugli impulsi e' una gaussiana. Il trucco della dimostrazione — elevare al quadrato e passare in coordinate polari — vale la pena di vederlo una volta: e' il motivo per cui compare un $\\pi$ in una formula che di cerchi non parla.","esempio":"Da $I^{2}=\\iint e^{-a(x^{2}+y^{2})}dx\\,dy=2\\pi\\int_{0}^{\\infty}re^{-ar^{2}}dr=\\pi/a$ segue $I=\\sqrt{\\pi/a}$. I momenti superiori si ottengono derivando rispetto ad $a$ sotto il segno: $-\\partial_a I=\\int x^{2}e^{-ax^{2}}dx=\\tfrac12\\sqrt{\\pi}\\,a^{-3/2}$. Derivare rispetto a un parametro e' piu' rapido che integrare per parti, e funziona per tutti i momenti pari.","pieno":null,"qui":{"meccanica-statistica":{"serve":"La funzione di partizione di una particella libera e' un prodotto di tre gaussiane negli impulsi, e da li' esce la lunghezza d'onda termica $\\lambda=h/\\sqrt{2\\pi m k T}$ — che e' la grandezza con cui si misura quando un gas smette di essere classico.","esempio":"$\\int e^{-\\beta p^{2}/2m}dp=\\sqrt{2\\pi m/\\beta}$, quindi $Z_{1}=\\dfrac{V}{h^{3}}(2\\pi mkT)^{3/2}=V/\\lambda^{3}$. Lo stesso integrale col peso $p^{2}$ da' $\\langle p^{2}/2m\\rangle=\\tfrac12 kT$ per grado di liberta': l'equipartizione non e' un principio a parte, e' questo integrale."}}};
STRUM["stirling"] = {"nome":"Approssimazione di Stirling","riga":"Per $N$ grande, $\\ln N! = N\\ln N - N + \\tfrac12\\ln(2\\pi N) + O(1/N)$; quasi sempre bastano i primi due termini.","serve":"Il fattoriale nasce ogni volta che si contano configurazioni, e $N!$ con $N\\sim 10^{23}$ non e' un numero che si maneggia. Stirling lo trasforma in una funzione liscia e derivabile di $N$ — ed e' proprio la derivabilita', non la comodita', il punto: senza di essa non si potrebbe massimizzare un'entropia rispetto a un numero di occupazione.","esempio":"Con $N=10$: $\\ln 10! = 15{,}104$, mentre $N\\ln N - N = 13{,}026$ e il termine $\\tfrac12\\ln(2\\pi N)=2{,}070$ porta a $15{,}096$ — tre cifre esatte gia' a dieci. Il terzo termine e' trascurabile in termodinamica perche' cresce come $\\ln N$ contro $N$: su $N=10^{23}$ pesa $10^{-22}$ in relativo. Per questo in meccanica statistica si scrive $\\ln N!\\simeq N\\ln N-N$ e non si guarda indietro.","pieno":null,"qui":{"meccanica-statistica":{"serve":"E' lo strumento senza il quale il conteggio microcanonico non diventa termodinamica. $S=k\\ln\\Omega$ con $\\Omega$ pieno di fattoriali resta un'espressione; applicato Stirling, $S$ diventa una funzione estensiva di $N$, $V$, $E$ che si puo' derivare per ottenere temperatura e pressione.","esempio":"Nel gas ideale il conteggio corretto di Boltzmann divide per $N!$, e il suo logaritmo $-\\ln N!\\simeq -N\\ln N+N$ e' esattamente il termine che rende l'entropia estensiva e scioglie il paradosso di Gibbs. Togliere Stirling di li' significa non vedere piu' da dove viene il $-N\\ln N$ della Sackur-Tetrode."}}};
STRUM["trasformata-di-legendre"] = {"nome":"Trasformata di Legendre","riga":"Scambia una variabile con la sua derivata coniugata: da $f(x)$ si passa a $g(p)=f(x)-px$ con $p=df/dx$, e $dg=-x\\,dp$.","serve":"Serve quando la variabile naturale di una funzione non e' quella che si controlla in laboratorio. La trasformata non perde informazione — da $g$ si torna a $f$ — e cambia solo quale variabile e' indipendente. E' l'operazione che genera tutti i potenziali termodinamici l'uno dall'altro, e la stessa che porta dalla lagrangiana all'hamiltoniana.","esempio":"Con $f(x)=x^{2}$: $p=2x$, $x=p/2$, $g=x^{2}-px=p^{2}/4-p^{2}/2=-p^{2}/4$. Il segno negativo non e' un errore: per $f$ convessa la trasformata e' concava, e applicandola due volte si torna a $f$.","pieno":null,"qui":{"meccanica-statistica":{"serve":"E' il ponte fra gli ensemble. Il passaggio da microcanonico a canonico non e' solo un cambio di racconto — energia fissata contro temperatura fissata — e' una trasformata di Legendre dell'entropia, e questo spiega perche' i due ensemble danno gli stessi risultati all'equilibrio: la trasformata e' invertibile.","esempio":"Da $S(E)$ con $1/T=\\partial S/\\partial E$ si passa all'energia libera $F=E-TS$, funzione di $T$ invece che di $E$, con $dF=-S\\,dT-p\\,dV$. Lo stesso schema porta da $F$ al gran potenziale $\\Omega=F-\\mu N$ scambiando $N$ con $\\mu$: e' sempre la stessa operazione, applicata a una coppia coniugata diversa."}}};
STRUM["delta-di-dirac"] = {"nome":"Delta di Dirac","riga":"Non è una funzione ma un funzionale, definito da $\\int f(x)\\,\\delta(x-a)\\,dx=f(a)$, che composto con una funzione si spezza sui suoi zeri come $\\delta(g(x))=\\sum_i \\delta(x-x_i)/|g'(x_i)|$.","serve":"Serve come macchina per cambiare variabile senza invertire nulla. La densità di $y=f(x)$ si scrive $p_Y(y)=\\int p_X(x)\\,\\delta(y-f(x))\\,dx$, e la delta produce da sola il fattore $1/|f'|$ che altrimenti andrebbe messo a mano: i rami molteplici si contano da soli invece di doverli ricordare. È la ragione pratica per cui il formalismo con la delta compare in ogni soluzione d'esame che tocchi una distribuzione, mentre il cambio di variabile esplicito compare quasi mai.","esempio":"$\\delta(x^2-a^2)$ con $a$ positivo. Gli zeri sono $x=\\pm a$; la derivata dell'argomento è $2x$, che in modulo vale $2a$ su entrambi. Quindi $\\delta(x^2-a^2)=\\dfrac{1}{2a}\\big[\\delta(x-a)+\\delta(x+a)\\big]$. Il caso si ripete identico in fisica statistica con $\\varepsilon=p^2/2m$ in una dimensione, dove i due rami $p=\\pm\\sqrt{2m\\varepsilon}$ contribuiscono entrambi — e dimenticarne uno dimezza la risposta.","pieno":{"file":"15-distribuzioni.html","tappa":"01","come":"le distribuzioni come funzionali, la delta e le sue proprietà, nel nucleo di Metodi"},"qui":{"meccanica-statistica":{"serve":"È lo strumento con cui si calcola la densità degli stati, cioè l'oggetto su cui poggia tutto il secondo tempo del corso: $g(\\varepsilon)=\\int d^dp\\,d^dq\\;\\delta(\\varepsilon-H)/h^d$. L'identità che si usa davvero non è la definizione ma questa: $\\delta(\\varepsilon-H)=\\partial_\\varepsilon\\,\\theta(\\varepsilon-H)$. Si scambia l'integrale con la derivata e ci si ritrova a calcolare il volume della regione dove l'hamiltoniana sta sotto $\\varepsilon$ — un integrale elementare — invece di un integrale con una delta dentro. La $g$ così ottenuta è pura geometria dello spazio delle fasi: non sa nulla della temperatura, e per questo resta identica quando si passa da Boltzmann a Fermi o a Bose.","esempio":"Particella libera in due dimensioni. Il volume della regione $p^2/2m$ sotto $\\varepsilon$ è il disco di area $2\\pi m\\varepsilon$; derivando rispetto a $\\varepsilon$ si ottiene $2\\pi m$, cioè una densità degli stati costante. Non è una curiosità: è la ragione per cui in due dimensioni una particella libera non condensa, e per cui le prove che chiedono la condensazione in $d=2$ mettono sempre un potenziale confinante, che porta la $g$ da costante a crescente."}},"controllo":[{"tipo":"derivata","espr":"x**2-a**2","rispetto":["x"],"vale":"2*x","ipotesi":{"x":"positive","a":"positive"},"dove":"esempio","appare":"2x"},{"tipo":"uguale","sinistra":"1/Abs(2*a)","vale":"1/(2*a)","ipotesi":{"a":"positive"},"dove":"esempio","appare":"\\dfrac{1}{2a}"},{"tipo":"derivata","espr":"2*pi*m*e","rispetto":["e"],"vale":"2*pi*m","ipotesi":{"m":"positive","e":"positive"},"dove":"qui.meccanica-statistica.esempio","appare":"2\\pi m"}]};
STRUM["ordini-di-grandezza"] = {"nome":"Ordini di grandezza","riga":"Stimare una quantità alla potenza di dieci giusta: si tiene una cifra significativa, si sommano e si sottraggono gli esponenti, e si controlla che l'unità del risultato sia quella che si voleva.","serve":"A sapere se un risultato è plausibile prima di averlo calcolato con precisione, e ad accorgersi di un errore di impostazione quando c'è ancora tempo per rimediare. In astrofisica non è una comodità ma il modo normale di ragionare, per due ragioni: le grandezze in gioco vanno da $10^{-36}$ kg a $10^{53}$ kg e nessuna intuizione le copre, e i dati osservativi sono noti al dieci o al venti per cento, quindi una cifra significativa è spesso tutto ciò che il problema contiene davvero. Il controllo che smaschera più errori non è sul numero, è sull'**unità**: un conto che dovrebbe dare una densità e dà dei kg è sbagliato nell'impostazione, e nessun affinamento dell'aritmetica lo salverà. La seconda regola è il confronto con un termine noto — l'acqua per una densità, il Sole per una massa o una luminosità, il parsec per una distanza galattica — perché un numero senza metro non dice niente.","esempio":"Densità media del Sole, dalle due sole quantità stampate in calce al foglio d'esame, $M_\\odot=1{,}989\\cdot10^{30}$ kg e $R_\\odot=6{,}957\\cdot10^{8}$ m: $\\rho=\\dfrac{3M_\\odot}{4\\pi R_\\odot^{3}}=1410\\ \\mathrm{kg/m^3}$. Il confronto è immediato e istruttivo: è quasi una volta e mezza l'acqua, cioè il Sole è in media meno denso della Terra — una stella non è un sasso grande, è un gas tenuto insieme dal proprio peso.","pieno":{"file":"as-01-la-scala-del-cosmo.html","tappa":"01","come":"la gerarchia delle strutture cosmiche letta come scala di ordini di grandezza, e il tempo di luce come secondo asse della stessa tabella"},"controllo":[{"tipo":"numero","espr":"3*1.989e30/(4*pi*(6.957e8)**3)","vale":"1410","dove":"esempio","appare":"1410"}]};
STRUM["serie-geometrica"] = {"nome":"Serie geometrica","riga":"La somma $\\sum_{n\\ge 0} q^{n}$ vale $\\dfrac{1}{1-q}$ se $|q|\\lt 1$, e non esiste se $|q|\\ge 1$.","serve":"È l'unica serie di cui si conosce la somma in forma chiusa senza fatica, e per questo diventa il metro di tutte le altre: una serie si studia maggiorandola con una geometrica (criterio del rapporto, criterio della radice) o riconoscendola come geometrica travestita.","esempio":"Con $q=\\tfrac12$: $1+\\tfrac12+\\tfrac14+\\cdots=\\dfrac{1}{1-\\tfrac12}=2$. Con $q=-\\tfrac13$: $\\dfrac{1}{1+\\tfrac13}=\\tfrac34$. Con $q=1$ le somme parziali sono $N+1$ e se ne vanno: la formula $1/(1-q)$ non è una scorciatoia da usare fuori dal suo raggio.","pieno":{"file":"07-serie-funzioni.html","tappa":"04","come":"il raggio $R=1$, il grafico delle somme parziali e la cassetta dei trucchi che parte da qui, nella tappa sulle serie di potenze"},"qui":{"metodi-e-modelli":{"serve":"È il motore della serie di Laurent: lo sviluppo di $\\dfrac{1}{z-a}$ in potenze di $z$ o di $1/z$ è una geometrica, e quale delle due si sceglie decide in quale corona si sta sviluppando. Tutta la parte principale di Laurent nasce da qui.","esempio":"Per $\\dfrac{1}{z-2}$ con $|z|\\lt 2$ si scrive $-\\tfrac12\\cdot\\dfrac{1}{1-z/2}=-\\sum_{n\\ge0}\\dfrac{z^{n}}{2^{n+1}}$; in $z=1$ entrambi i membri valgono $-1$. Per $|z|\\gt 2$ si raccoglie invece $z$ e viene $\\sum_{n\\ge0}\\dfrac{2^{n}}{z^{n+1}}$, cioè solo potenze negative; in $z=4$ entrambi i membri valgono $\\tfrac12$."},"elettromagnetismo":{"serve":"Compare ogni volta che una configurazione si ripete con un fattore costante — catene di cariche immagine fra due piani conduttori, riflessioni multiple in una cavità — e la somma chiusa è ciò che rende il conto finito invece che infinito.","esempio":"Una carica fra due piani paralleli genera immagini a distanze crescenti, e il contributo al potenziale è una somma del tipo $\\sum_{n\\ge0} r^{n}$ con $r\\lt 1$ fissato dalla geometria. Con una riflettività $r=\\tfrac14$ la serie vale $\\tfrac43$: la catena è infinita, il potenziale no."}},"controllo":[{"tipo":"somma","espr":"(1/2)**n","var":"n","da":"0","a":"oo","vale":"2","dove":"esempio","appare":"=2"},{"tipo":"somma","espr":"(-1/3)**n","var":"n","da":"0","a":"oo","vale":"3/4","dove":"esempio","appare":"\\tfrac34"},{"tipo":"somma","espr":"-1**n/2**(n+1)","var":"n","da":"0","a":"oo","vale":"-1","dove":"qui.metodi-e-modelli.esempio","appare":"-1"},{"tipo":"somma","espr":"2**n/4**(n+1)","var":"n","da":"0","a":"oo","vale":"1/2","dove":"qui.metodi-e-modelli.esempio","appare":"\\tfrac12"},{"tipo":"somma","espr":"(1/4)**n","var":"n","da":"0","a":"oo","vale":"4/3","dove":"qui.elettromagnetismo.esempio","appare":"\\tfrac43"},{"tipo":"uguale","sinistra":"1/(1-2)","vale":"-1","dove":"qui.metodi-e-modelli.esempio","appare":"-1"},{"tipo":"uguale","sinistra":"1/(4-2)","vale":"1/2","dove":"qui.metodi-e-modelli.esempio","appare":"\\tfrac12"}]};
STRUM["funzione-gamma"] = {"nome":"Funzione Gamma","riga":"$\\Gamma(z)=\\displaystyle\\int_0^{\\infty}t^{z-1}e^{-t}\\,dt$, e da questa $\\displaystyle\\int_0^{\\infty}t^{k}e^{-at}\\,dt=\\dfrac{\\Gamma(k+1)}{a^{k+1}}$ per $a>0$.","serve":"E' il fattoriale esteso ai numeri non interi — $\\Gamma(n+1)=n!$ — e soprattutto e' la forma chiusa di TUTTI gli integrali del tipo «potenza per esponenziale». Sapere questa sola formula sostituisce una decina di integrazioni per parti, e permette di leggere a vista il risultato di un integrale appena si riconosce l'esponente della potenza.","esempio":"Da $\\Gamma(z+1)=z\\,\\Gamma(z)$, che si ottiene integrando per parti una volta, discende $\\Gamma(n+1)=n!$ per $n$ intero: $\\Gamma(1)=1$, $\\Gamma(2)=1$, $\\Gamma(3)=2$, $\\Gamma(4)=6$. Sui semi-interi il capostipite e' $\\Gamma(\\tfrac12)=\\sqrt\\pi$ — che e' l'integrale gaussiano travestito — e da li' $\\Gamma(\\tfrac32)=\\tfrac12\\sqrt\\pi$, $\\Gamma(\\tfrac52)=\\tfrac34\\sqrt\\pi$. Un integrale come $\\int_0^\\infty t^{2}e^{-at}dt$ vale dunque $\\Gamma(3)/a^{3}=2/a^{3}$, senza fare nessun conto.","pieno":null,"qui":{"meccanica-statistica":{"serve":"E' l'inventario degli integrali del canonico ridotto a una riga. Ogni funzione di partizione di singola particella e' un integrale di potenza per esponenziale — cambia solo l'esponente, e con esso la fisica: $t^{1/2}$ per il gas classico, $t^{2}$ per l'ultrarelativistico, $t^{3/n}$ per un potenziale $\\alpha r^{n}$. Riconoscere quale $\\Gamma$ si sta calcolando e' cio' che distingue chi risolve lo scritto in dieci minuti da chi lo risolve in un'ora.","esempio":"Per una particella relativistica con $\\varepsilon=cp$ la partizione porta $\\int_0^\\infty p^{2}e^{-\\beta cp}dp=\\Gamma(3)/(\\beta c)^{3}=2/(\\beta c)^{3}$, da cui $\\langle\\varepsilon\\rangle=3T$ invece dei $\\tfrac32T$ del caso non relativistico. Il fattore 3 contro $3/2$ viene per intero dall'esponente della potenza, cioe' dall'argomento della Gamma: la dipendenza dell'energia dalla quantita' di moto decide da sola quanto calore serve a scaldare il gas."}}};
STRUM["cambio-di-variabile"] = {"nome":"Cambio di variabile in una densità","riga":"Una densità non si trasforma sostituendo ma porta il jacobiano: se $y=f(x)$ allora $p_Y(y)=\\sum_i p_X(x_i)\\,/\\,|f'(x_i)|$, sommato su tutti i rami $x_i$ con $f(x_i)=y$.","serve":"È l'unico punto in cui una densità si comporta diversamente da una funzione, ed è l'errore che si ripete. Ciò che è invariante è la probabilità dell'evento, $p_Y(y)|dy|=p_X(x)|dx|$: la densità no, perché è una probabilità per unità di qualcosa, e passando da $x$ a $y$ quell'unità si dilata o si comprime. Scrivere $p_Y(y)=p_X(x(y))$ e basta è attraente e sbagliato. Si scova senza rifare il conto con due prove da cinque secondi: la normalizzazione non torna, e le dimensioni restano quelle della variabile di partenza.","esempio":"Una particella uniforme su un disco di raggio $R$: $p(x,y)=1/(\\pi R^2)$. Passando alla sola distanza dal centro, il jacobiano è l'elemento d'area radiale $2\\pi r$, e resta $p(r)=2r/R^2$ su $[0,R]$, che infatti si normalizza a $1$. Il valor medio è $\\langle r\\rangle=2R/3$ — non $R/2$, che è la risposta di chi tratta $r$ come uniforme. La differenza fra i due numeri è esattamente il fattore $r$, cioè il fatto che lontano dal centro c'è più area.","pieno":{"file":"ms-03-probabilita.html","tappa":"01","come":"la regola dedotta dall'invarianza della probabilità, i rami molteplici e il caso radiale, nel movimento ms-03 di Meccanica Statistica"},"qui":{"meccanica-statistica":{"serve":"È metà della domanda più frequente dello scritto: «calcolare la densità di probabilità dell'energia di singola particella», «la densità di particelle $\\rho(r)$». L'altra metà è la marginalizzazione. Le scritture $d^2r=2\\pi r\\,dr$ e $d^3r=4\\pi r^2dr$ non sono formule da ricordare: sono questo cambio di variabile con gli angoli già integrati, e saperlo deducere è ciò che salva quando la simmetria è cilindrica invece che sferica. Attenzione al doppio jacobiano: $p(r)$ è una densità rispetto a $r$, $\\rho(r)$ è una densità per unità di volume, e fra le due ce n'è un altro.","esempio":"L'energia cinetica in due dimensioni. La misura radiale nel piano degli impulsi è la derivata dell'area del disco, $2\\pi p$; la sostituzione $\\varepsilon=p^2/2m$ ha $d\\varepsilon/dp=p/m$, e il jacobiano cancella esattamente il fattore $p$. Per questo in $d=2$ la densità dell'energia è l'esponenziale pura $\\beta e^{-\\beta\\varepsilon}$, senza prefattore, mentre in $d=3$ resta un $\\sqrt{\\varepsilon}$. Da quel solo fattore dipendono tutte le differenze qualitative fra i gas quantistici in dimensioni diverse."}},"controllo":[{"tipo":"integrale","espr":"2*r/R**2","var":"r","da":"0","a":"R","vale":"1","ipotesi":{"r":"positive","R":"positive"},"dove":"esempio","appare":"p(r)=2r/R^2"},{"tipo":"integrale","espr":"r*2*r/R**2","var":"r","da":"0","a":"R","vale":"2*R/3","ipotesi":{"r":"positive","R":"positive"},"dove":"esempio","appare":"2R/3"},{"tipo":"derivata","espr":"pi*p**2","rispetto":["p"],"vale":"2*pi*p","ipotesi":{"p":"positive"},"dove":"qui.meccanica-statistica.esempio","appare":"2\\pi p"},{"tipo":"derivata","espr":"p**2/(2*m)","rispetto":["p"],"vale":"p/m","ipotesi":{"p":"positive","m":"positive"},"dove":"qui.meccanica-statistica.esempio","appare":"p/m"},{"tipo":"integrale","espr":"b*exp(-b*e)","var":"e","da":"0","a":"oo","vale":"1","ipotesi":{"b":"positive","e":"positive"},"dove":"qui.meccanica-statistica.esempio","appare":"\\beta e^{-\\beta\\varepsilon}"}]};

function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';
  return h;
}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

  {t:'prosa', title:'Tre formule che valgono quasi sempre, e il quasi e il contenuto', tag:'architettura', html:R`
  <p>Il gas perfetto classico è il primo sistema che la meccanica statistica risolve <i>per intero</i>, ed è anche l&rsquo;ultimo di cui si possa dire che vale sempre. Ogni esercizio che cominci con «$N$ particelle non interagenti in un volume $V$ a temperatura $T$» finisce, per una strada o per l&rsquo;altra, su tre formule: l&rsquo;equazione di stato $pV=NT$, l&rsquo;energia $E=\tfrac32NT$, l&rsquo;entropia di Sackur-Tetrode. Sono formule che si imparano in mezz&rsquo;ora e si usano per tre anni.</p>
  <p>Il punto di questo movimento è che <b>non valgono sempre</b>, e che il corso chiede di saperlo dire con un numero. Gli elettroni di conduzione di un rame a temperatura ambiente sono un gas di particelle quasi libere, con la stessa hamiltoniana $H=\sum_i p_i^2/2m$ del gas perfetto: eppure il loro calore specifico non è $\tfrac32Nk_B$, non lo è nemmeno per ordine di grandezza, e nessuna correzione di interazione può salvare il conto. Il motivo non è l&rsquo;interazione: è che quel gas <b>non è classico</b>. La quantità che lo decide è una sola, e si scrive</p>
  <p style="text-align:center"><b>$n\lambda^3\ll1$, dove $\lambda=\dfrac{h}{\sqrt{2\pi mT}}$ è la lunghezza termica di de Broglie e $n=N/V$ la densità.</b></p>
  <p>Non è uno slogan: è una <b>disuguaglianza da verificare sui numeri del problema</b>. Per l&rsquo;elio a temperatura ambiente vale circa $3\times10^{-6}$, e il gas è classico con sei ordini di margine; per gli elettroni del rame vale circa $7\times10^{3}$, e la statistica classica è sbagliata di quattro ordini; per un gas di rubidio nelle trappole ottiche vale circa uno, ed è esattamente lì che si accende il condensato di Bose-Einstein. I tre casi li facciamo per esteso, con le costanti dentro.</p>
  <div class="note"><b>Due convenzioni, dichiarate subito, perché le tre fonti non concordano.</b> Seguendo le note di Crisanti (docente del terzo canale) e quelle di Grilli-Giardina poniamo $k_B=1$: allora $\beta=1/T$, la temperatura è un&rsquo;energia, l&rsquo;entropia è un numero puro e la relazione ponte con la termodinamica è $F=-T\log Z$. Falcioni-Vulpiani tengono invece $k_B$ esplicito ($\beta=1/k_BT$) e scrivono, per esempio, $S=Nk_B[\cdots]$: dove riporto una loro formula lo dichiaro. Nelle due tappe in cui si fanno i <b>numeri</b> — il criterio di validità e gli esercizi — $k_B$ torna esplicito per forza, perché un criterio si verifica in unità SI e non in unità naturali.</div>`},
  {t:'prosa', title:'Come e fatto il movimento', tag:'architettura', html:R`
  <p><b>La rotta, e perché è questa.</b> Si comincia costruendo il gas perfetto nel canonico fino in fondo: la partizione di <i>una</i> particella, quella di $N$, l&rsquo;energia libera, e da lì $pV=NT$ <i>ricavata</i> e non citata. Subito dopo arriva la prima anomalia: nel conteggio degli stati compaiono due oggetti che nessuno ha chiesto — un fattore $1/N!$ e un fattore $1/h^{3N}$ — e senza di loro l&rsquo;entropia non è estensiva (paradosso di Gibbs) e non è nemmeno adimensionale. È il primo segnale che <b>la meccanica classica non si chiude da sola</b>.</p>
  <p>Poi la distribuzione di Maxwell-Boltzmann, ricavata due volte: per marginalizzazione dalla densità canonica, che è la strada corta, e per marginalizzazione <i>esatta</i> dal microcanonico, che è la strada di Falcioni-Vulpiani e mostra la gaussiana come un <b>limite</b> $N\to\infty$ e non come un postulato. Da lì le tre velocità e il conto che le distingue, l&rsquo;equipartizione con la sua dimostrazione e i tre modi in cui fallisce, la densità degli stati come macchina che traduce somme in integrali — con la condizione sotto cui la traduzione è lecita, che è il punto in cui nasce la condensazione di Bose.</p>
  <p>Le ultime tre tappe sono il cuore d&rsquo;esame: da dove viene $\lambda$ e perché proprio quella combinazione di $h$, $m$ e $T$; il criterio $n\lambda^3\ll1$ con i tre casi numerici; e infine le tre statistiche — Maxwell-Boltzmann, Fermi-Dirac, Bose-Einstein — viste collassare sulla stessa curva quando la temperatura sale, che è la figura che l&rsquo;ultima domanda di ogni esercizio quantistico chiede di saper disegnare a parole.</p>`}
]},

/* ---------------- 01 · IL GAS PERFETTO NEL CANONICO ---------------- */
{ num:'01', title:'Il gas perfetto nel canonico: da una particella a N, e da N alla equazione di stato', meta:'partizione di singola particella · integrale gaussiano · energia libera · pressione ed energia ricavate',
  blocchi:[
  {t:'reveal', title:'Dalla partizione di una particella a quella di N', tag:'costruzione', steps:[
   {label:'La fattorizzazione, e cosa la rende possibile', body:R`
   <p>Un gas perfetto è definito da un&rsquo;unica proprietà: le particelle <b>non interagiscono</b>, cioè l&rsquo;hamiltoniana è una somma di termini di singola particella, $H=\sum_{i=1}^N H_i$ con $H_i=p_i^2/2m$. Non serve altro — né che le particelle siano puntiformi, né che il gas sia rarefatto in senso geometrico: serve che nell&rsquo;esponenziale di Boltzmann non compaiano termini incrociati. Quando questo è vero, $e^{-\beta H}=\prod_i e^{-\beta H_i}$ e l&rsquo;integrale su $6N$ variabili si spezza nel prodotto di $N$ integrali identici su $6$:</p>
   $$Z_N=\int\frac{d^{3N}q\,d^{3N}p}{h^{3N}N!}\,e^{-\beta H}=\frac{z_1^N}{N!}$$
   <p>dove $z_1$ è la <b>funzione di partizione di singola particella</b>. I due fattori al denominatore — l&rsquo;$h^{3N}$ e l&rsquo;$N!$ — li abbiamo scritti senza giustificarli, ed è di proposito: sono gli ospiti non invitati della tappa seguente. Per ora basta osservare che nessuno dei due dipende da $T$ o da $V$, quindi nessuno dei due può cambiare l&rsquo;equazione di stato. Grilli-Giardina (pag. 56) arriva a questa stessa $Z=z_1^N/N!$ discutendo esplicitamente che la divisione per $N!$ è il modo classico, e approssimato, di tenere conto della indistinguibilità.</p>`},
   {label:'Tre integrali gaussiani, e una lunghezza che compare da sola', body:R`
   <p>Calcoliamo $z_1$. L&rsquo;integrale sulle posizioni dà semplicemente il volume, perché l&rsquo;hamiltoniana non dipende da $\mathbf q$; quello sugli impulsi si spezza in tre copie dello stesso integrale unidimensionale:</p>
   $$z_1=\int\frac{d^3q\,d^3p}{h^3}\,e^{-\beta p^2/2m}$$
   <p>e ciascuna delle tre copie è un <span class="str" data-str="integrale-gaussiano">integrale gaussiano</span> di varianza pari a $m/\beta$, cioè $mT$:</p>
   $$\int_{-\infty}^{+\infty}dp_x\,e^{-\beta p_x^2/2m}=\sqrt{\frac{2\pi m}{\beta}}$$
   <p>Mettendo insieme volume e impulsi,</p>
   $$z_1=\frac{V}{h^3}\left(\frac{2\pi m}{\beta}\right)^{3/2}$$
   <p>Ora si guardi la struttura di questo risultato, perché è il seme di tutto il movimento. La quantità $h/\sqrt{2\pi mT}$ ha le dimensioni di una <b>lunghezza</b>: $h$ è un&rsquo;azione, $\sqrt{mT}$ è un impulso, e azione diviso impulso è una lunghezza. Chiamiamola $\lambda$, come fanno tutte e tre le fonti, e vediamo cosa diventa $z_1$:</p>
   $$\lambda\equiv\frac{h}{\sqrt{2\pi mT}}$$
   $$\lambda^3=\frac{h^3}{(2\pi mT)^{3/2}}\qquad z_1=\frac{V}{\lambda^3}$$
   <p>La partizione di una particella <b>è il numero di celle di volume $\lambda^3$ che stanno dentro $V$</b>. È una lettura che fra poche tappe diventerà il criterio di validità di tutta la teoria; per ora è solo un&rsquo;osservazione dimensionale, ed è già abbastanza notevole che una teoria classica produca una lunghezza in cui compare la costante di Planck.</p>`},
   {label:'Stirling, e la forma definitiva della energia libera', body:R`
   <p>Da $Z_N=z_1^N/N!$ segue $\log Z_N=N\log z_1-\log N!$, e il fattoriale si tratta con l&rsquo;<span class="str" data-str="stirling">approssimazione di Stirling</span> nella forma che serve qui, $\log N!\simeq N\log N-N=N\log(N/e)$:</p>
   $$\log Z_N=N\log z_1-\log N!\simeq N\log\frac{z_1e}{N}$$
   <p>Vale la pena vedere <i>quanto</i> sia buona questa approssimazione, perché è la stessa che regge tutte le formule seguenti. Già per $N=100$ il logaritmo esatto del fattoriale vale circa $363{,}7$, e lo scarto dalla forma di Stirling è $\log(100!)-(100\log100-100)=3{,}222$ — meno dell&rsquo;uno per cento. E il margine migliora senza limite, perché <b>lo scarto cresce come $\log N$ mentre il termine principale cresce come $N$</b>: per $N$ dell&rsquo;ordine del numero di Avogadro l&rsquo;errore relativo è dell&rsquo;ordine di $10^{-22}$.</p>
   <p>Il passaggio da $Z$ a $F$ è la definizione stessa dell&rsquo;energia libera di Helmholtz nel canonico, $F=-T\log Z$, e dà</p>
   $$F=-T\log Z_N=-NT\log\left(\frac{V}{N\lambda^3}\,e\right)$$
   <p>Questa è la forma da memorizzare, e vale la pena notare <b>cosa ci sta dentro e cosa no</b>: dentro c&rsquo;è il volume <i>per particella</i> $V/N$, non $V$ — ed è proprio l&rsquo;$N!$ ad averlo messo lì. Senza quel fattore avremmo $F=-NT\log(V/\lambda^3)$, e l&rsquo;energia libera non sarebbe estensiva. Da $F$ si legge tutta la termodinamica derivando.</p>`}
  ]},
  {t:'prosa', title:'Pressione, energia, calore specifico: tre derivate', tag:'costruzione', html:R`
  <p><b>La pressione.</b> È la derivata di $F$ rispetto al volume, cambiata di segno. Nella $F$ appena scritta l&rsquo;unica dipendenza da $V$ è il termine $-NT\log V$, quindi</p>
  $$P=-\left(\frac{\partial F}{\partial V}\right)_{T,N}=-\frac{\partial}{\partial V}\big(-NT\log V\big)=\frac{NT}{V}$$
  <p>cioè $PV=NT$. <b>Questa è l&rsquo;equazione di stato dei gas perfetti, ricavata e non citata</b>, e conviene fermarsi un attimo su quanto poco sia servito: è bastato che $F$ contenesse $V$ dentro un logaritmo, con coefficiente $-NT$. Crisanti (pag. 211) fa notare che questo accade per <i>ogni</i> hamiltoniana di singola particella della forma $H_i=a|\mathbf p_i|^b$, perché il volume esce sempre dall&rsquo;integrale sulle posizioni allo stesso modo: la relazione $PV=NT$ non dipende dallo spettro, dipende solo dal fatto che le particelle non interagiscono.</p>
  <p><b>L&rsquo;energia.</b> Si legge derivando $\log Z_N$ rispetto a $\beta$. La sola parte che dipende da $\beta$ è $-\tfrac{3N}{2}\log\beta$, dunque</p>
  $$\frac{\partial\log Z_N}{\partial\beta}=-\frac{3N}{2\beta}$$
  <p>e quindi</p>
  $$E=-\frac{\partial\log Z_N}{\partial\beta}=\frac{3N}{2\beta}=\frac32NT$$
  <p>Tre mezzi di $T$ per particella: tre gradi di libertà quadratici, mezzo $T$ ciascuno. È il primo incontro con l&rsquo;equipartizione, che dimostreremo nella tappa 05 invece di invocarla. <b>Il calore specifico</b> segue subito:</p>
  $$C_V=\left(\frac{\partial E}{\partial T}\right)_{V}=\frac32N$$
  <p>costante, indipendente da $T$ e dalla massa. È una previsione forte e verificabile, ed è anche il punto in cui la teoria classica si fa prendere in castagna: il calore specifico dei gas reali <i>non</i> è costante, quello dell&rsquo;idrogeno molecolare passa da $\tfrac32N$ a $\tfrac52N$ a $\tfrac72N$ salendo in temperatura, e il gas di elettroni di un metallo ha un contributo elettronico cento volte più piccolo di $\tfrac32N$. Di queste smentite la prima la spiega la tappa 05, la seconda la tappa 08.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`In $Z_N=z_1^N/N!$ il fattore $1/N!$ non dipende né da $T$ né da $V$. Perché allora non è irrilevante?`,
    a:R`Perché <b>dipende da $N$</b>, e le grandezze che si ottengono derivando rispetto a $N$ — il potenziale chimico $\mu=(\partial F/\partial N)_{T,V}$ — cambiano. E cambia soprattutto la <b>struttura</b> di $F$: senza $N!$ l&rsquo;energia libera contiene $\log V$ invece di $\log(V/N)$, e non è più estensiva. Il criterio invocato è che $P$ ed $E$ si ottengono derivando a $N$ fissato, e lì un termine indipendente da $T$ e $V$ muore; ma l&rsquo;estensività è una proprietà di come $F$ scala con $N$ e $V$ <i>insieme</i>, e lì il termine non muore affatto. È esattamente il contenuto del paradosso di Gibbs, nella prossima tappa.`}
  ]}
]},

/* ---------------- 02 · IL CONTEGGIO DI BOLTZMANN ---------------- */
{ num:'02', title:'Il conteggio di Boltzmann: il fattore N fattoriale, Gibbs, Sackur-Tetrode e la costante di Planck', meta:'entropia non estensiva · il paradosso del mescolamento · la cella semiclassica di volume h · il terzo principio violato',
  blocchi:[
  {t:'prosa', title:'Il conto fatto senza N fattoriale, e cosa va storto', tag:'costruzione', html:R`
  <p>Riprendiamo il gas perfetto dal lato microcanonico, dove il difetto si vede meglio. Contando il volume di spazio delle fasi accessibile a energia $E$ <b>senza</b> dividere per $N!$, e con $u\equiv E/N$ l&rsquo;energia per particella, Crisanti (pag. 174) e Grilli-Giardina (pag. 42) arrivano allo stesso risultato:</p>
  $$S=\log\Gamma=N\log\!\big(Vu^{3/2}\big)+NS_0,\qquad S_0=\frac32\left[1+\log\frac{4\pi m}{3h^2}\right]$$
  <p>Sembra tutto a posto: derivando rispetto a $E$ si ritrova $E=\tfrac32NT$, derivando rispetto a $V$ si ritrova $PV=NT$. Ma l&rsquo;entropia deve essere <b>estensiva</b>: raddoppiando insieme energia, volume e numero di particelle deve raddoppiare. Verifichiamolo. Raddoppiando tutto, $u$ non cambia (è un rapporto fra due quantità raddoppiate), e</p>
  $$S(2E,2V,2N)-2S(E,V,N)=2N\log 2$$
  <p>L&rsquo;entropia calcolata così <b>non è estensiva</b>: sbaglia di un termine proporzionale a $N$, cioè dello stesso ordine dell&rsquo;entropia stessa. Non è un errore piccolo che si corregge con un&rsquo;approssimazione migliore: è un errore strutturale, e il modo in cui si manifesta ha un nome.</p>`},
  {t:'reveal', title:'Il paradosso di Gibbs, e la sua riparazione', tag:'costruzione', steps:[
   {label:'Due gas che si mescolano', body:R`
   <p>Si prendano due gas identici, $N_1$ particelle in $V_1$ e $N_2$ in $V_2$, alla stessa temperatura e alla stessa densità, separati da un setto. L&rsquo;entropia totale iniziale è la somma delle due. Si tolga il setto: ora ci sono $N=N_1+N_2$ particelle in $V=V_1+V_2$. La variazione di entropia, usando la formula senza $N!$, è</p>
   $$\Delta S=N_1\log\frac{V}{V_1}+N_2\log\frac{V}{V_2}$$
   <p>che è <b>positiva</b>. Nel caso di due gas <i>diversi</i> — argon e neon — questo è giusto e si misura: è l&rsquo;entropia di mescolamento. Ma il conto non sa nulla dell&rsquo;identità dei gas, e dà lo stesso risultato anche se i due gas sono <b>lo stesso gas</b>. Prendiamo il caso simmetrico, $V_1=V_2=V/2$ e $N_1=N_2=N/2$:</p>
   $$\Delta S=\frac N2\log 2+\frac N2\log 2=N\log 2$$
   <p>Cioè: infilando e sfilando un setto in un gas omogeneo l&rsquo;entropia crescerebbe di $N\log2$ ogni volta, e ripetendo l&rsquo;operazione la si farebbe crescere quanto si vuole senza cambiare nulla del sistema. Grilli-Giardina (pag. 42) lo dice nel modo più duro possibile: <i>l&rsquo;entropia non esiste</i>, perché si può sempre immaginare che lo stato presente del gas sia stato raggiunto togliendo un numero arbitrario di setti, e allora $S$ è più grande di qualunque numero.</p>`},
   {label:'La correzione di Gibbs e il suo prezzo', body:R`
   <p>Gibbs propose la riparazione minima: il conteggio degli stati è sbagliato di un fattore $N!$, e va diviso. Due stati che differiscono solo per lo scambio di due particelle dello stesso gas <b>non sono due stati</b>, perché le particelle sono indistinguibili, e contarli due volte è ciò che gonfia $\Gamma$.</p>
   <p>Fatta la divisione, con Stirling nella forma $N!\simeq(N/e)^N$, l&rsquo;entropia acquista un $-N\log(N/e)$ e diventa</p>
   $$S=N\log\!\left[\frac VN\left(\frac EN\right)^{3/2}e^{5/2}\left(\frac{4\pi m}{3h^2}\right)^{3/2}\right]$$
   <p>che è l&rsquo;<b>equazione di Sackur-Tetrode</b> nella forma di Crisanti (pag. 175). Ora $V$ compare solo attraverso $V/N$, cioè il volume specifico, che è una quantità <i>intensiva</i>: raddoppiando tutto, l&rsquo;argomento del logaritmo non cambia e $S$ raddoppia. L&rsquo;estensività è ripristinata, e con essa sparisce il paradosso: mescolando gas identici alla stessa densità si ha $N_1/V_1=N_2/V_2=N/V$ e dunque $\Delta S=0$, mentre per gas diversi $\Delta S>0$ resta, perché lì $N_1$ e $N_2$ contano separatamente prima e dopo.</p>
   <p><b>Il prezzo è che la riparazione non ha una giustificazione classica.</b> Grilli-Giardina (pag. 43) e Falcioni-Vulpiani (pag. 30) lo scrivono entrambi, con parole quasi uguali: non è possibile capire classicamente perché si debba dividere per $N!$; la ragione è intrinsecamente quantistica. Lo stato di $N$ particelle identiche è descritto da una funzione d&rsquo;onda simmetrica o antisimmetrica sotto scambio, e una permutazione al massimo ne cambia il segno — cioè non produce uno stato nuovo. È un debito che la meccanica classica contrae e non può pagare.</p>`},
   {label:'La stessa entropia, dal canonico', body:R`
   <p>Vale la pena ritrovare Sackur-Tetrode per l&rsquo;altra strada, perché è la strada degli esercizi. Nel canonico $S$ si ottiene dalla <span class="str" data-str="trasformata-di-legendre">trasformata di Legendre</span> che lega $F(T,V,N)$ a $S(E,V,N)$, cioè $S=-(\partial F/\partial T)_{V,N}$. Scrivendo l&rsquo;energia libera della tappa precedente come $F=-NT\left[\log A+\tfrac32\log T+1\right]$, dove $A\equiv\dfrac VN\left(\dfrac{2\pi m}{h^2}\right)^{3/2}$ raccoglie tutto ciò che non dipende da $T$,</p>
   $$S=-\left(\frac{\partial F}{\partial T}\right)_{V,N}=\frac{\partial}{\partial T}\Big[NT\big(\log A+\tfrac32\log T+1\big)\Big]=N\log A+\tfrac32N\log T+\tfrac52N$$
   <p>e siccome $AT^{3/2}=\dfrac{V}{N\lambda^3}$, questo è</p>
   $$S=N\left[\log\frac{V}{N\lambda^3}+\frac52\right]$$
   <p>che è Sackur-Tetrode nella forma più leggibile di tutte: <b>l&rsquo;entropia per particella è il logaritmo del numero di celle termiche disponibili per particella, più cinque mezzi</b>. Falcioni-Vulpiani (pag. 29, eq. 2.26) scrivono la stessa formula con $k_B$ esplicito davanti, $S=Nk_B\left[\ln\frac VN\left(\frac EN\right)^{3/2}+\frac52+\frac32\ln\frac{4\pi m}{3h^2}\right]$, e aggiungono il dato storico che qui conta più della formula: nel 1912 Sackur e Tetrode ricavarono quella costante <b>dai dati sperimentali sul mercurio</b> nelle fasi solida, liquida e gassosa, e trovarono che tornava se e solo se la costante che vi compare era la costante di Planck.</p>`}
  ]},
  {t:'prosa', title:'Perche proprio h al cubo: il conto che misura la cella', tag:'costruzione', html:R`
  <p>Il secondo intruso è il fattore $1/h^{3N}$. Formalmente serve a rendere $\Gamma$ adimensionale — un volume di spazio delle fasi ha dimensioni di (azione)$^{3N}$, e dentro un logaritmo non ci può andare una quantità dimensionale. Ma questa è una giustificazione debole: andrebbe bene qualunque costante $c/h^{3N}$. Crisanti (pag. 227) pone la domanda giusta: <b>quanto vale $c$?</b> E la risponde con un conto, non con una convenzione.</p>
  <p>Si prenda una particella in una buca unidimensionale di lato $L$. Quantisticamente i livelli sono $E_n=\dfrac{\hbar^2\pi^2}{2mL^2}n^2$, spaziati e numerabili: fra $E_n$ ed $E_{n+1}$ c&rsquo;è <i>esattamente uno</i> stato. Classicamente, il volume di spazio delle fasi compreso fra quelle due energie è</p>
  $$\Delta\Gamma=\int_{E_n}^{E_{n+1}}\!dE\int dq\,dp\;\delta\!\left(E-\frac{p^2}{2m}\right)$$
  <p>Si risolve la <span class="str" data-str="delta-di-dirac">delta di Dirac</span> sugli zeri del suo argomento: $p=\pm\sqrt{2mE}$, con $|f'(p)|=|p|/m=\sqrt{2mE}/m$, e i due zeri contribuiscono entrambi, dunque</p>
  $$\frac{2m}{\sqrt{2mE}}=\sqrt{\frac{2m}{E}}$$
  <p>L&rsquo;integrale sulle posizioni dà $L$, e resta un integrale elementare in $E$:</p>
  $$\Delta\Gamma=L\int_{E_n}^{E_{n+1}}\!dE\,\sqrt{\frac{2m}{E}}=2L\sqrt{2m}\left(\sqrt{E_{n+1}}-\sqrt{E_n}\right)$$
  <p>Resta da valutare la differenza delle radici, e qui lo spettro fa il regalo: $\sqrt{E_n}=\dfrac{\pi\hbar\,n}{L\sqrt{2m}}$ è <b>lineare in $n$</b>, quindi la differenza è indipendente da $n$:</p>
  $$\sqrt{E_{n+1}}-\sqrt{E_n}=\frac{\pi\hbar}{L\sqrt{2m}}\qquad\Longrightarrow\qquad\Delta\Gamma=2\pi\hbar=h$$
  <p>Il volume di spazio delle fasi che corrisponde a <b>uno</b> stato quantistico è esattamente $h$, per ogni grado di libertà. Dunque $c=1$: il fattore $h^{3N}$ non è una convenzione, è una misura. Crisanti rifà lo stesso conto per l&rsquo;oscillatore armonico, dove i livelli sono $E_n=(n+\tfrac12)\hbar\omega$ e l&rsquo;area dell&rsquo;ellisse fra due livelli consecutivi vale di nuovo $h$, e conclude che la corrispondenza è generale e non un accidente della buca.</p>
  <p><b>Il punto da portare via</b> è la stranezza della situazione, non il risultato. Stiamo facendo meccanica statistica <i>classica</i>, e per far tornare l&rsquo;entropia abbiamo dovuto infilare due oggetti che la meccanica classica non contiene: una cella di volume $h$ per grado di libertà, che viene dal principio di indeterminazione, e una divisione per $N!$, che viene dalla simmetria della funzione d&rsquo;onda. La teoria classica <b>non si chiude da sola</b>. La domanda naturale — <i>e allora fino a quando posso fidarmi?</i> — è la domanda a cui rispondono le tappe 07 e 08.</p>`},
  {t:'prosa', title:'Il secondo segnale: il terzo principio', tag:'grammatica', html:R`
  <p>C&rsquo;è un secondo modo, più netto del primo, in cui Sackur-Tetrode denuncia il proprio limite di validità. Si guardi $S=N\left[\log\frac{V}{N\lambda^3}+\frac52\right]$ e si abbassi la temperatura. La lunghezza termica $\lambda\propto T^{-1/2}$ <b>cresce</b>, quindi $V/(N\lambda^3)$ decresce come $T^{3/2}$, e il logaritmo diverge:</p>
  $$\lim_{T\to0^+}\log T^{3/2}=-\infty$$
  <p>L&rsquo;entropia del gas perfetto classico tende a $-\infty$ per $T\to0$. Ma il <b>terzo principio</b> (teorema di Nernst) pretende che l&rsquo;entropia tenda a una costante finita, convenzionalmente zero: un sistema a temperatura nulla sta nel suo stato fondamentale, e se quello è non degenere $\Omega=1$ e $S=0$. La formula classica viola il terzo principio in modo plateale, e non per poco.</p>
  <p>Vale la pena capire <b>dove</b> comincia il guaio, perché il punto in cui la formula sbaglia è esattamente il punto in cui il criterio di validità scatta. L&rsquo;entropia per particella $S/N=\log\frac{V}{N\lambda^3}+\frac52$ diventa negativa quando $\frac{V}{N\lambda^3}<e^{-5/2}\approx0{,}082$, cioè quando la densità in unità di volume termico $n\lambda^3$ diventa dell&rsquo;ordine di dieci. Non è una coincidenza: è lo stesso numero, $n\lambda^3$, che la tappa 08 troverà partendo da tutt&rsquo;altro — dalla richiesta che i numeri di occupazione degli stati siano molto minori di uno. <b>Due sintomi diversi, una sola malattia.</b></p>
  <p>Per fare i conti seguenti ci serve però la distribuzione microscopica, non solo i potenziali termodinamici: bisogna sapere come si distribuiscono <i>le velocità</i> delle particelle. È la prossima tappa, e la faremo due volte.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Se il fattore $1/N!$ non cambia né $P$ né $E$, in che senso è «il conteggio corretto» e non un aggiustamento cosmetico?`,
    a:R`Perché ciò che deve essere corretto non è il valore di una derivata, ma la <b>classe di funzione</b> a cui $S$ appartiene: l&rsquo;entropia deve essere una funzione di stato omogenea di grado uno in $(E,V,N)$. Senza $N!$ non lo è, e la conseguenza osservabile è il paradosso di Gibbs — un&rsquo;operazione reversibile che produce entropia. Il criterio invocato è l&rsquo;<b>estensività</b>, che è un vincolo sulla forma funzionale e non sul valore in un punto; e infatti la correzione si vede nelle grandezze che derivano rispetto a $N$ (il potenziale chimico) e nelle differenze di entropia fra configurazioni con $N$ ripartito diversamente, non in $P$ ed $E$ a $N$ fissato.`},
   {q:R`Il conto della cella semiclassica usa lo spettro quantistico della buca. Non è circolare, usare la quantistica per giustificare una costante della statistica classica?`,
    a:R`È circolare solo se si pretende che la meccanica statistica classica sia autosufficiente — ed è esattamente quello che il conto dimostra <b>falso</b>. La struttura logica corretta è: la meccanica statistica classica è un <i>limite</i> di quella quantistica, e in quel limite sopravvive una traccia della teoria di partenza, cioè la dimensione della cella elementare. Il criterio da riconoscere è che $h$ entra in $S$ come <b>costante di normalizzazione del conteggio</b>, non come parametro dinamico: non compare in $P$, non compare in $E$, non compare in $C_V$ — compare solo dove si contano stati. Il che è anche il motivo per cui Sackur e Tetrode poterono misurarla da dati di entropia nel 1912, dodici anni dopo Planck e tredici prima di Heisenberg.`}
  ]}
]},

/* ---------------- 03 · LA DISTRIBUZIONE DI MAXWELL-BOLTZMANN ---------------- */
{ num:'03', title:'La distribuzione di Maxwell-Boltzmann, ricavata per marginalizzazione', meta:'la media canonica di una somma di delta · la marginalizzazione sugli impulsi · la via microcanonica esatta · la gaussiana come limite',
  blocchi:[
  {t:'prosa', title:'Che cosa si vuole calcolare, esattamente', tag:'grammatica', html:R`
  <p>Fin qui abbiamo maneggiato potenziali termodinamici — $F$, $E$, $S$, $P$ — che sono numeri, uno per stato macroscopico. Ma la domanda che un esperimento pone al gas è più fine: <i>quante particelle</i>, in media, hanno impulso vicino a $\mathbf p$ e posizione vicina a $\mathbf x$? È la domanda a cui risponde la <b>distribuzione di Maxwell-Boltzmann</b>, ed è anche la prima quantità di questo corso che si possa misurare <i>direttamente</i>, particella per particella, invece che dedurre da un calorimetro.</p>
  <p>Grilli-Giardina (pag. 53) la imposta nel modo più pulito che conosca, e vale la pena copiarne la mossa. Si definisce, sullo spazio delle fasi del sistema intero, una funzione che <i>conta</i>:</p>
  $$n(\{\mathbf x_j,\mathbf p_j\}\,|\,\mathbf x,\mathbf p)=\sum_{i=1}^N\delta(\mathbf x_i-\mathbf x)\,\delta(\mathbf p_i-\mathbf p)$$
  <p>Attenzione ai due tipi di variabile, perché è il punto in cui ci si confonde: $\mathbf x$ e $\mathbf p$ sono <b>parametri</b> in $\mathbb R^3$, il punto dello spazio di singola particella in cui stiamo guardando; $\{\mathbf x_j,\mathbf p_j\}$ è invece un punto dello spazio delle fasi completo, in $\mathbb R^{6N}$. La funzione $n$ vale, per ogni configurazione del gas, il numero di particelle che si trovano esattamente lì. La distribuzione di Maxwell-Boltzmann è la sua <b>media d&rsquo;insieme</b>.</p>`},
  {t:'reveal', title:'La strada corta: marginalizzare la densita canonica', tag:'costruzione', steps:[
   {label:'Le N particelle sono equivalenti, e questo riduce il conto a uno', body:R`
   <p>Mediamo $n$ con la densità canonica. Siccome l&rsquo;hamiltoniana totale è simmetrica sotto scambio di particelle, gli $N$ addendi della somma danno tutti lo stesso integrale, e ne basta calcolare uno moltiplicato per $N$:</p>
   $$\bar n(\mathbf x,\mathbf p)=\Big\langle\sum_{i=1}^N\delta(\mathbf x_i-\mathbf x)\delta(\mathbf p_i-\mathbf p)\Big\rangle=N\,\frac{\int d\Gamma\;\delta(\mathbf x_1-\mathbf x)\,\delta(\mathbf p_1-\mathbf p)\,e^{-\beta H_T}}{\int d\Gamma\;e^{-\beta H_T}}$$
   <p>Ora, in un gas perfetto $H_T=\sum_iH_i$ e la misura $d\Gamma$ si fattorizza: tutti gli integrali sulle particelle $2,\dots,N$ compaiono identici sopra e sotto e si semplificano. Le due delta eliminano l&rsquo;integrazione sulla particella $1$, e resta soltanto il peso di Boltzmann di <i>una</i> particella, normalizzato dalla sua partizione. Contando in celle di volume $h^3$ — che è, per il conto della tappa precedente, il volume di spazio delle fasi di uno stato — si ottiene il <b>numero medio di occupazione di uno stato di singola particella</b>:</p>
   $$n_{\rm MB}(\mathbf x,\mathbf p)\equiv\bar n(\mathbf x,\mathbf p)\,h^3=N\,\frac{e^{-\beta H(\mathbf x,\mathbf p)}}{z_1}$$
   <p>Questa quantità è il protagonista silenzioso di tutto il movimento. Tenetela d&rsquo;occhio: <b>la statistica classica varrà esattamente finché $n_{\rm MB}\ll1$</b>, cioè finché è raro che due particelle si contendano lo stesso stato. Per ora prendiamone la versione normalizzata a uno, che è la densità di probabilità di singola particella $\rho_1=e^{-\beta H}/z_1$.</p>`},
   {label:'Gli impulsi: la gaussiana', body:R`
   <p>Per avere la distribuzione dei soli impulsi si <b>marginalizza</b>, cioè si integra via ciò che non interessa — qui le posizioni. Con $H=|\mathbf p|^2/2m+V(\mathbf x)$, l&rsquo;integrale sulle coordinate compare identico al numeratore e al denominatore e si cancella, e resta</p>
   $$\rho_p(\mathbf p)=\int d^3x\,\rho_1(\mathbf x,\mathbf p)=\frac{e^{-\beta p^2/2m}}{\left(\int dp_x\,e^{-\beta p_x^2/2m}\right)^3}=(2\pi mT)^{-3/2}\,e^{-\beta p^2/2m}$$
   <p>dove il denominatore è di nuovo il cubo dell&rsquo;<span class="str" data-str="integrale-gaussiano">integrale gaussiano</span> della tappa 01. Due letture, entrambe da tenere: (i) <b>la distribuzione degli impulsi non dipende dal potenziale</b> — è la stessa in un gas libero, in un gas in campo gravitazionale, in un gas dentro una buca: il potenziale sposta le particelle nello spazio, non nelle velocità; (ii) le tre componenti sono <b>indipendenti</b> e ciascuna è gaussiana con varianza $mT$, perché l&rsquo;esponenziale di una somma di quadrati è un prodotto di gaussiane.</p>`},
   {label:'Le coordinate: il fattore di Boltzmann nello spazio', body:R`
   <p>Marginalizzando invece sugli impulsi si ottiene la distribuzione spaziale, dove il potenziale c&rsquo;è tutto:</p>
   $$\rho_x(\mathbf x)=\int d^3p\,\rho_1(\mathbf x,\mathbf p)=\frac{e^{-\beta V(\mathbf x)}}{\int d^3x'\,e^{-\beta V(\mathbf x')}}$$
   <p>Per un gas libero $V=0$ e la densità è uniforme; per un gas in campo gravitazionale $V=mgz$ e si ottiene subito $\rho_x\propto e^{-\beta mgz}$, da cui, moltiplicando per $NT$, la <b>formula barometrica</b></p>
   $$P(z)=P(0)\,e^{-\beta mgz}$$
   <p>Crisanti la ricava due volte — una nel microcanonico imponendo la costanza del potenziale chimico lungo la colonna (pag. 176-178), e una nel canonico partendo proprio da questa marginalizzazione (pag. 206-207) — e la seconda strada è quattro volte più corta. Falcioni-Vulpiani (pag. 81) ricordano che è la formula che <b>Perrin misurò al microscopio</b> su granelli di gommagutta di massa nota sospesi in acqua, ricavandone il numero di Avogadro: la stessa legge statistica, verificata su oggetti visibili invece che su molecole.</p>`}
  ]},
  {t:'prosa', title:'La strada lunga: la gaussiana e un limite, non un postulato', tag:'costruzione', html:R`
  <p>La derivazione appena fatta ha un difetto pedagogico: usa il canonico, cioè assume già che il gas sia a temperatura fissata da un bagno. Falcioni-Vulpiani (pag. 40-41) la rifanno <b>restando nel microcanonico</b>, e il risultato vale la fatica perché mostra che la maxwelliana non è la definizione di nulla: è un <i>limite</i>.</p>
  <p>Si consideri un gas isolato di $N$ particelle libere con energia esattamente $E$, e si chieda la densità di probabilità di una singola particella. È di nuovo una marginalizzazione: si integra sullo stato delle altre $N-1$. Il risultato è il rapporto fra la densità degli stati delle $N-1$ particelle residue, che hanno a disposizione l&rsquo;energia $E-p^2/2m$, e quella dell&rsquo;intero sistema:</p>
  $$\rho(\mathbf x,\mathbf p)=\frac{\omega\big(E-\tfrac{p^2}{2m},V,N-1\big)}{\omega(E,V,N)}$$
  <p>Per il gas ideale $\omega$ si conosce in forma chiusa — è la superficie di una ipersfera di raggio $\sqrt{2mE}$ in $3N$ dimensioni — e il rapporto si scrive <b>esattamente</b>, per ogni $N$ finito:</p>
  $$\rho(\mathbf x,\mathbf p)=\frac1V\,\frac{\Gamma\big(\tfrac32N\big)}{\Gamma\big(\tfrac32(N-1)\big)}\,\frac{1}{(2\pi mE)^{3/2}}\left(1-\frac{p^2}{2mE}\right)^{3N/2-5/2}$$
  <p>valida per $|\mathbf p|\le\sqrt{2mE}$ e <b>zero oltre</b>. Ecco la prima cosa che la formula canonica nasconde: in un sistema isolato nessuna particella può avere più energia di tutto il gas, quindi la distribuzione esatta ha un <b>taglio netto</b>, mentre la gaussiana ha code infinite. Le due coincidono solo nel limite in cui le code contano zero.</p>
  <p>Facciamo il limite. Per $N\gg1$ il $5/2$ nell&rsquo;esponente è trascurabile davanti a $3N/2$, il rapporto dei due gamma vale</p>
  $$\frac{\Gamma\big(\tfrac32N\big)}{\Gamma\big(\tfrac32(N-1)\big)}\simeq\left(\frac{3N}{2}\right)^{3/2}$$
  <p>e il fattore che porta tutta la fisica è la parentesi elevata a $3N/2$. Si tiene fissa l&rsquo;energia per particella $u=E/N$ mentre $N\to\infty$ — è il limite termodinamico, non un limite qualsiasi — e si riscrive $\dfrac{p^2}{2mE}$ nella forma $\dfrac aN$, con $a=\dfrac{p^2}{2mu}$. Allora entra in gioco il limite notevole che definisce l&rsquo;esponenziale:</p>
  $$\lim_{N\to\infty}\left(1-\frac{a}{N}\right)^{3N/2}=e^{-3a/2}$$
  <p>Resta da riconoscere l&rsquo;esponente. Nel microcanonico la temperatura si legge dall&rsquo;entropia, $S=\tfrac32N\log E+\text{cost}$, e</p>
  $$\frac{\partial S}{\partial E}=\frac{3N}{2E}\qquad\Longrightarrow\qquad u\equiv\frac EN=\frac32T$$
  <p>cioè la solita equipartizione. Sostituendo,</p>
  $$\frac{3a}{2}=\frac32\cdot\frac{p^2}{2m\,(3T/2)}=\frac{p^2}{2mT}$$
  <p>e la distribuzione esatta diventa $\rho\propto e^{-p^2/2mT}$: <b>la maxwelliana</b>, identica a quella ottenuta nel canonico. Il conto ha però detto tre cose in più. Primo: la gaussiana è il limite $N\to\infty$ di una distribuzione a supporto compatto. Secondo: il parametro che compare nella gaussiana non è una temperatura imposta dall&rsquo;esterno ma l&rsquo;energia per particella del sistema isolato, e «temperatura» è il nome che le diamo. Terzo, ed è l&rsquo;osservazione che Falcioni-Vulpiani sottolineano a pag. 42: la maxwelliana ha un <b>doppio significato</b> — è la densità di probabilità di una singola particella <i>e</i> la distribuzione empirica delle velocità realizzata dalla quasi totalità degli stati del gas. I due significati coincidono per la legge dei grandi numeri, ed è questo che rende misurabile su <i>un solo</i> gas una quantità definita come media d&rsquo;insieme.</p>`},
  {t:'plot', title:'La maxwelliana nel piano delle velocita: una campana isotropa',
   intro:R`Superficie della densità di probabilità congiunta delle due componenti $(v_x,v_y)$ della velocità, in unità di $\sqrt{T/m}$. È il prodotto di due gaussiane indipendenti, $\rho\propto e^{-v_x^2/2}e^{-v_y^2/2}$. Trascina per ruotare.`,
   plots:[
    {kind:'surface3d', f:'exp(-(x*x+y*y)/2)', xr:[-3,3], yr:[-3,3], n:36, height:400,
     title:'densita congiunta delle due componenti della velocita',
     xlabel:'v_x', ylabel:'v_y'}
   ],
   leggi:R`<p><b>Una campana, e la sua simmetria è il contenuto.</b> La superficie dipende da $v_x$ e $v_y$ soltanto attraverso la combinazione $v_x^2+v_y^2$: le curve di livello sono cerchi. Questa <b>isotropia</b> non è stata imposta — è uscita dal fatto che l&rsquo;hamiltoniana dipende solo da $|\mathbf p|$ — e ha una conseguenza operativa che serve in ogni esercizio: la direzione della velocità è distribuita uniformemente sulla sfera, quindi ogni media angolare si fa a parte e i conti si riducono a integrali sul modulo.</p>
   <p><b>La fattorizzazione si vede tagliando.</b> Un taglio a $v_y$ fissato dà una gaussiana in $v_x$ di larghezza sempre uguale: le due componenti sono <b>indipendenti</b>, non solo scorrelate. È la ragione per cui il conto di $\langle v_x^2\rangle$ non richiede di sapere nulla di $v_y$, e per cui scaldare un gas allarga tutte e tre le direzioni insieme e nella stessa misura.</p>
   <p><b>Dove questa figura mente.</b> Disegna una campana che si estende all&rsquo;infinito, mentre la distribuzione esatta di un sistema isolato si annulla oltre $|\mathbf p|=\sqrt{2mE}$. La differenza è invisibile a $N$ grande — le code oltre il taglio pesano come $e^{-3N/2}$ — ma è la ragione per cui le domande d&rsquo;esame del tipo «quante particelle hanno energia maggiore di $10\,T$?» vanno prese sul serio solo finché la risposta è un numero molto minore di $N$.</p>`}
]},

/* ---------------- 04 · LE TRE VELOCITA ---------------- */
{ num:'04', title:'Le tre velocita: la piu probabile, la media, la quadratica media', meta:'dalla distribuzione degli impulsi a quella del modulo · tre integrali · perche i tre numeri sono diversi e in quale ordine',
  blocchi:[
  {t:'prosa', title:'Dalla distribuzione vettoriale a quella del modulo', tag:'costruzione', html:R`
  <p>La $\rho_p(\mathbf p)$ della tappa precedente è una densità nello spazio <i>vettoriale</i> degli impulsi. Quasi tutte le domande d&rsquo;esame riguardano invece il <b>modulo</b> della velocità: quante particelle vanno più veloci di tanto, qual è la velocità tipica, quale energia cinetica media. Il passaggio dall&rsquo;una all&rsquo;altra è puramente geometrico, e sbagliarlo è l&rsquo;errore più comune del capitolo.</p>
  <p>Passando da $\mathbf p$ a $\mathbf v=\mathbf p/m$ e poi a coordinate sferiche, l&rsquo;elemento di volume $d^3v$ diventa $4\pi v^2dv$ dopo aver integrato sugli angoli — legittimo perché, come mostra la figura della tappa 03, la distribuzione è isotropa. Il fattore $4\pi v^2$ è la <b>superficie della sfera di raggio $v$</b>, cioè il numero di direzioni disponibili a quel modulo, e il suo effetto è decisivo: moltiplica una gaussiana decrescente per un fattore crescente, e produce una distribuzione con un <b>massimo a velocità non nulla</b>.</p>
  $$F(v)\,dv=4\pi v^2\left(\frac{m}{2\pi T}\right)^{3/2}e^{-mv^2/2T}\,dv$$
  <p>È la distribuzione di Maxwell delle velocità. Le sue tre velocità caratteristiche — la più probabile, la media, la quadratica media — sono <i>diverse fra loro</i>, e la domanda «quale delle tre?» compare in ogni scritto. Si ottengono con tre conti distinti, nessuno dei quali è la media aritmetica degli altri.</p>`},
  {t:'reveal', title:'I tre conti, fino al numero', tag:'costruzione', steps:[
   {label:'La velocita piu probabile: si deriva', body:R`
   <p>Il massimo di $F(v)$ è il massimo di $v^2e^{-mv^2/2T}$, perché le costanti non spostano il picco. Deriviamo:</p>
   $$\frac{d}{dv}\Big(v^2e^{-mv^2/2T}\Big)=\Big(2v-\frac{mv^3}{T}\Big)e^{-mv^2/2T}$$
   <p>L&rsquo;esponenziale non si annulla mai, quindi il massimo è dove si annulla la parentesi: $2v=mv^3/T$, cioè $v^2$ vale $2T/m$, scartando la soluzione banale $v=0$ (che è un minimo, non un massimo). Dunque</p>
   $$v_{\rm p}=\sqrt{\frac{2T}{m}}$$
   <p>C&rsquo;è una lettura fisica immediata: l&rsquo;energia cinetica associata a $v_{\rm p}$ è esattamente $T$, non $\tfrac32T$. La velocità più probabile <b>non</b> è quella che porta l&rsquo;energia media, e confonderle è il modo più rapido di sbagliare un esercizio.</p>`},
   {label:'La velocita media: si integra v per la distribuzione', body:R`
   <p>La media del modulo richiede $\int_0^\infty v\,F(v)dv$, cioè un integrale in $v^3$:</p>
   $$\int_0^{\infty}dv\,v^3e^{-mv^2/2T}=\frac{2T^2}{m^2}$$
   <p>(si fa con la sostituzione $y=mv^2/2T$, che lo riduce, a meno di costanti, all&rsquo;integrale elementare $\int_0^\infty y\,e^{-y}dy$). Moltiplicando per la normalizzazione,</p>
   $$\overline v=4\pi\left(\frac{m}{2\pi T}\right)^{3/2}\frac{2T^2}{m^2}=\sqrt{\frac{8T}{\pi m}}$$
   <p>Compare un $\pi$ sotto radice, che è la firma inconfondibile della velocità <i>media</i>: se in un risultato d&rsquo;esame vedete $\sqrt{8T/\pi m}$ state guardando $\overline v$, e se vedete un risultato senza $\pi$ state guardando una delle altre due.</p>`},
   {label:'La quadratica media: si integra v al quadrato', body:R`
   <p>Per $\langle v^2\rangle$ serve l&rsquo;integrale in $v^4$:</p>
   $$\int_0^{\infty}dv\,v^4e^{-mv^2/2T}=3\sqrt{\frac{\pi}{2}}\left(\frac Tm\right)^{5/2}$$
   <p>e moltiplicando per la stessa normalizzazione</p>
   $$\langle v^2\rangle=4\pi\left(\frac{m}{2\pi T}\right)^{3/2}\cdot3\sqrt{\frac{\pi}{2}}\left(\frac Tm\right)^{5/2}=\frac{3T}{m}$$
   <p>cioè $v_{\rm rms}=\sqrt{3T/m}$, ed è l&rsquo;unica delle tre che si potesse prevedere senza integrare: $\langle\tfrac12mv^2\rangle=\tfrac32T$ è l&rsquo;equipartizione, e $\langle v^2\rangle=3T/m$ ne è la riscrittura. <b>È questa la velocità che compare nell&rsquo;energia</b>, e quindi nella pressione cinetica e in tutti i bilanci energetici.</p>`}
  ]},
  {t:'prosa', title:'I tre numeri, e perche sono in quest ordine', tag:'regola operativa', html:R`
  <p>Tutte e tre le velocità sono della forma $\sqrt{T/m}$ moltiplicata per un numero puro, e i tre numeri sono $\sqrt2$, $\sqrt{8/\pi}$ e $\sqrt3$:</p>
  $$v_{\rm p}:\overline v:v_{\rm rms}=1{,}414:1{,}596:1{,}732$$
  <p>L&rsquo;ordine non è un accidente, ed è utile saperlo argomentare senza rifare i conti. La disuguaglianza $\overline v\le v_{\rm rms}$ è <b>Cauchy-Schwarz</b> applicata a $\langle v\cdot1\rangle^2\le\langle v^2\rangle\langle1\rangle$: la media di una quantità è sempre minore o uguale alla sua radice quadratica media, con uguaglianza solo se la distribuzione è concentrata in un punto. La disuguaglianza $v_{\rm p}\le\overline v$ viene invece dall&rsquo;<b>asimmetria</b> di $F(v)$: la coda di destra è lunga e quella di sinistra è tagliata a zero, quindi la media è tirata verso destra rispetto alla moda. <b>Il criterio da ricordare</b>: per ogni distribuzione positiva e asimmetrica a destra vale moda $\le$ media $\le$ radice quadratica media, e la maxwelliana ne è il caso di scuola.</p>
  <p>Vale la pena sapere anche che questi numeri <b>si misurano</b>, e non da poco. Falcioni-Vulpiani (pag. 70-71) descrivono l&rsquo;esperimento diretto: si scalda del potassio in un forno con una fenditura, e si selezionano le particelle con due dischi rotanti a distanza $\ell$, sfasati di un angolo $\theta$ e in rotazione a velocità angolare $\omega$. Passa solo chi ha $v=\ell\omega/\theta$. Ma attenzione a cosa arriva al rivelatore: non $F(v)$, bensì $\text{cost}\times v^3e^{-mv^2/2k_BT}$, perché la frazione di particelle che riesce a infilarsi nelle fenditure è a sua volta proporzionale a $v$. È il genere di fattore che, dimenticato, fa sembrare sbagliata una teoria giusta.</p>
  <p>Una seconda verifica è indiretta ma più facile e riguarda l&rsquo;astrofisica: l&rsquo;<b>allargamento Doppler</b> delle righe spettrali. Se un atomo in moto con velocità $v$ lungo la linea di vista emette a $\lambda_0$, si osserva $\lambda=\lambda_0(1+v/c)$; siccome $v$ è distribuita gaussianamente, il profilo della riga è gaussiano con semilarghezza $\delta=\sqrt{2k_BT\lambda_0^2/(mc^2)}$. Misurare la larghezza di una riga è misurare la temperatura di un gas che sta a mille anni luce — ed è la stessa maxwelliana, con $k_B$ scritto esplicito come fa quella fonte.</p>`},
  {t:'plot', title:'La maxwelliana a tre temperature, con le tre velocita marcate',
   intro:R`In ascissa il modulo della velocità in unità di $\sqrt{T_0/m}$; in ordinata la densità $F(v)$, normalizzata a uno. Le tre curve sono la stessa distribuzione a temperature $T/T_0$ pari a $0{,}5$, $1$ e $2$. Sulla curva intermedia sono marcate le tre velocità caratteristiche.`,
   plots:[
    {kind:'func2d', xr:[0,6], yr:[0,0.95], height:340, ticks:6,
     title:'distribuzione di Maxwell del modulo della velocita',
     curves:[
      {f:'2.257*pow(x,2)*exp(-x*x)', col:'#5eead4', label:'T bassa: campana stretta e alta'},
      {f:'0.798*pow(x,2)*exp(-x*x/2)', col:'#d8a13a', label:'T intermedia: le tre velocita marcate'},
      {f:'0.2821*pow(x,2)*exp(-x*x/4)', col:'#ff6b6b', label:'T alta: campana larga e bassa, coda lunga'}
     ],
     marks:[
      {x:1.414, y:0.587, label:'v piu probabile', col:'#ffffff', up:true},
      {x:1.596, y:0.569, label:'v media', col:'#ffffff'},
      {x:1.732, y:0.534, label:'v quadratica media', col:'#ffffff'}
     ],
     xlabel:'v (in unita di radice di T0 su m)', ylabel:'F(v)'}
   ],
   leggi:R`<p><b>Il picco non è a zero, e il motivo è geometrico.</b> Ogni singola componente della velocità è una gaussiana centrata in zero — la velocità più probabile lungo $x$ è nulla. Ma il <i>modulo</i> ha il fattore $4\pi v^2$ davanti, cioè il numero di direzioni disponibili, che a $v=0$ è nullo. Il massimo nasce dalla gara fra questo fattore crescente e l&rsquo;esponenziale decrescente, e cade dove le due pendenze si pareggiano.</p>
   <p><b>Le tre velocità marcate sono vicine, e questo è il tranello.</b> Stanno entro il $23\%$ l&rsquo;una dall&rsquo;altra, quindi un errore di scelta non produce un risultato assurdo: produce un risultato plausibile e sbagliato, che è peggio. Il criterio per non sbagliare è chiedersi <i>cosa si sta mediando</i>: se la domanda contiene un&rsquo;energia serve $v_{\rm rms}$, se contiene un flusso o un cammino libero medio serve $\overline v$, se contiene «il valore tipico» serve $v_{\rm p}$.</p>
   <p><b>Come si muove la campana con la temperatura.</b> Salendo in $T$ il picco si sposta a destra come $\sqrt T$ e si abbassa come $T^{-1}$, perché l&rsquo;area resta uno: la distribuzione non si scala, si <i>allarga</i>. La conseguenza che conta davvero è nella coda: la frazione di particelle con energia superiore a una soglia fissata cresce come $e^{-\varepsilon_0/T}$, ed è questo — non lo spostamento del picco — che accende le reazioni chimiche e le fusioni nucleari.</p>`}
]},

/* ---------------- 05 · EQUIPARTIZIONE ---------------- */
{ num:'05', title:'Il teorema di equipartizione, e i tre modi in cui fallisce', meta:'enunciato e dimostrazione per parti nel canonico · la generalizzazione agli esponenti · spettri non quadratici, quanti, spettri limitati',
  blocchi:[
  {t:'reveal', title:'Enunciato e dimostrazione', tag:'costruzione', steps:[
   {label:'Che cosa dice davvero il teorema', body:R`
   <p>L&rsquo;equipartizione viene di solito enunciata così: «ogni grado di libertà quadratico porta $T/2$». È vero, ma è un corollario. L&rsquo;enunciato generale, quello che Crisanti (pag. 204) dimostra nel canonico, è una relazione fra coordinate e derivate dell&rsquo;hamiltoniana:</p>
   $$\Big\langle p_i\frac{\partial H}{\partial p_j}\Big\rangle=\delta_{ij}T$$
   <p>con la relazione gemella $\langle q_i\,\partial H/\partial q_j\rangle=\delta_{ij}T$ per le coordinate, e con le due medie miste $\langle q_i\,\partial H/\partial p_j\rangle$ e $\langle p_i\,\partial H/\partial q_j\rangle$ entrambe nulle. Formulato così, il teorema <b>non nomina la forma dell&rsquo;hamiltoniana</b>: vale per qualunque $H$, quadratica o no. È il passaggio successivo — dalla derivata all&rsquo;energia — che richiede un&rsquo;ipotesi sulla forma, ed è lì che nascono i fallimenti.</p>`},
   {label:'La dimostrazione: una integrazione per parti', body:R`
   <p>Si parte dalla media canonica e si usa un&rsquo;unica identità: il peso di Boltzmann <i>è</i> l&rsquo;esponenziale dell&rsquo;hamiltoniana, quindi derivarlo rispetto a un impulso fa scendere la derivata dell&rsquo;hamiltoniana,</p>
   $$\frac{\partial}{\partial p_j}e^{-\beta H}=-\beta\frac{\partial H}{\partial p_j}e^{-\beta H}$$
   <p>Invertendola si legge $p_i\,\partial_{p_j}H\,e^{-\beta H}$ come $-T\,p_i\,\partial_{p_j}e^{-\beta H}$, e si integra per parti in $p_j$: il termine di bordo contiene $p_i\,e^{-\beta H}$ valutato a impulso infinito, e <b>si annulla perché l&rsquo;esponenziale batte il polinomio</b> — questa è l&rsquo;unica ipotesi nascosta della dimostrazione, e ci torneremo. Resta</p>
   $$\Big\langle p_i\frac{\partial H}{\partial p_j}\Big\rangle=T\Big\langle\frac{\partial p_i}{\partial p_j}\Big\rangle=\delta_{ij}T$$
   <p>perché $\partial p_i/\partial p_j=\delta_{ij}$ è una costante e la sua media è sé stessa. Notare che $Z$ si è semplificato: il risultato non dipende dalla normalizzazione, e per questo non dipende dal sistema.</p>`},
   {label:'Dal teorema al mezzo T, e alla sua generalizzazione', body:R`
   <p>Applichiamolo a $H=p_x^2/2m$. La derivata $\partial H/\partial p_x$ vale $p_x/m$, dunque il teorema dice che la media di $p_x^2/m$ è $T$, cioè che il termine $p_x^2/2m$ porta in media $T/2$. Con tre componenti e $N$ particelle si ritrova $E=\tfrac32NT$, questa volta <i>dimostrata</i> e non dedotta dal conto della tappa 01.</p>
   <p>La generalizzazione è immediata e serve più spesso di quanto si creda. Se un termine dell&rsquo;hamiltoniana è una potenza, $H_s=a|q|^s$, allora $q\,\partial H_s/\partial q$ vale $s\,H_s$, e il teorema dà</p>
   $$s\langle H_s\rangle=T\qquad\Longrightarrow\qquad\langle H_s\rangle=\frac Ts$$
   <p><b>Ogni termine di potenza $s$ porta $T/s$</b>: quadratico ($s=2$) porta $T/2$, lineare ($s=1$) porta $T$ intero, quartico ($s=4$) porta $T/4$. È la forma da usare negli esercizi con potenziali strani, e spiega in una riga un risultato che altrimenti sembra magico — il gas in campo gravitazionale, con il suo $mgz$ lineare, ha $E=\tfrac52NT$ e non $\tfrac32NT$.</p>`}
  ]},
  {t:'prosa', title:'Il gas di oscillatori: il caso in cui vale, e si vede', tag:'costruzione', html:R`
  <p>Il collaudo canonico dell&rsquo;equipartizione è il gas di oscillatori armonici indipendenti, che Crisanti risolve nel microcanonico a pag. 179-180 e che nel canonico costa tre righe. In una dimensione $H_i=\dfrac{p^2}{2m}+\dfrac12m\omega^2q^2$: due termini quadratici, quindi l&rsquo;equipartizione predice $T/2$ per ciascuno, cioè un $T$ intero per oscillatore. Verifichiamo con la partizione, che è il prodotto di due gaussiane:</p>
  $$z_1=\frac1h\sqrt{\frac{2\pi m}{\beta}}\sqrt{\frac{2\pi}{\beta m\omega^2}}=\frac{1}{\beta\hbar\omega}$$
  <p>La massa se n&rsquo;è andata, e resta solo il rapporto fra l&rsquo;energia termica e il quanto $\hbar\omega$ — un&rsquo;altra comparsa non richiesta della costante di Planck dentro un conto classico. Da qui, siccome $\log z_1=-\log\beta+\text{cost}$,</p>
  $$\frac{\partial\log z_1}{\partial\beta}=-\frac1\beta$$
  $$E=-N\frac{\partial}{\partial\beta}\big(-\log\beta\big)=\frac N\beta=NT$$
  <p>e il calore specifico è</p>
  $$C_V=\frac{\partial E}{\partial T}=N$$
  <p>esattamente il doppio di quello del gas libero, come l&rsquo;equipartizione aveva predetto contando i termini quadratici. È il genere di verifica che conviene fare sempre: <b>contare i termini quadratici prima di calcolare</b>, e usare il conto per controllare il conteggio.</p>`},
  {t:'prosa', title:'I tre modi in cui il teorema fallisce', tag:'regola operativa', html:R`
  <p><b>Primo fallimento: lo spettro non è quadratico.</b> Qui il teorema non è falso, è la sua <i>forma corollario</i> a non applicarsi. Per un gas ultrarelativistico $H_i=c|\mathbf p_i|$ la potenza è $s=1$, quindi ogni particella porta $3T$ e non $\tfrac32T$: Crisanti (pag. 183) trova infatti $E=3NT$, pur lasciando intatta $PV=NT$. In generale, per $H_i=a|\mathbf p_i|^b$ l&rsquo;energia è $E=3NT/b$ — per $b=1$ dà $E=3NT$, per $b=2$ dà $E=\tfrac32NT$. La lezione operativa: <b>l&rsquo;equazione di stato dipende solo dall&rsquo;assenza di interazione, la relazione energia-temperatura dipende dallo spettro.</b></p>
  <p><b>Secondo fallimento: i quanti.</b> È il fallimento serio, quello che ha fatto nascere la meccanica quantistica. La dimostrazione per parti assume che $p$ e $q$ siano variabili <i>continue</i> su cui si può integrare; se lo spettro è discreto con spaziatura $\hbar\omega$, e se $\hbar\omega\gg T$, il grado di libertà non si eccita mai — <b>si congela</b> — e non porta nulla. Per un oscillatore quantistico il calore specifico per modo vale</p>
  $$c_V(x)=\frac{x^2e^x}{(e^x-1)^2},\qquad x=\frac{\hbar\omega}{T}$$
  <p>una funzione che ad alta temperatura tende al valore classico, $\dfrac{x^2e^x}{(e^x-1)^2}\to 1$ per $x\to0$, e a bassa temperatura tende a $\to 0$ esponenzialmente. È il motivo per cui il calore specifico dell&rsquo;idrogeno molecolare sale a gradini invece che restare costante: a temperatura ambiente le rotazioni sono attive e le vibrazioni congelate, e la salita da $\tfrac52N$ a $\tfrac72N$ avviene solo sopra i duemila gradi.</p>
  <p><b>Terzo fallimento: lo spettro è limitato superiormente.</b> Qui cade l&rsquo;ipotesi nascosta della dimostrazione, quella del termine di bordo. Un sistema a due livelli $\pm\varepsilon$ non ha una coda esponenziale da sopprimere: l&rsquo;energia ha un tetto, e un sistema che non può assorbire energia oltre un massimo <b>smette di scaldarsi</b>. Il suo calore specifico non tende a una costante ma ha un massimo a temperatura intermedia e crolla da entrambi i lati — è l&rsquo;<b>anomalia di Schottky</b>, e il suo profilo è tanto diverso dall&rsquo;equipartizione da essere usato come firma sperimentale della presenza di livelli discreti isolati.</p>
  <p>C&rsquo;è poi un caso che vale la pena isolare perché è quello che questo movimento sta inseguendo. Gli elettroni di conduzione di un metallo hanno un&rsquo;hamiltoniana <i>quadratica</i>, uno spettro <i>continuo</i> e <i>illimitato</i>: tutte le ipotesi del teorema sono soddisfatte, e l&rsquo;equipartizione predice un contributo elettronico $\tfrac32Nk_B$ al calore specifico. La misura dà circa un centesimo di quel valore. Nessuno dei tre fallimenti elencati spiega questo: l&rsquo;errore sta un passo più indietro, nell&rsquo;aver usato la <b>statistica</b> classica — cioè nell&rsquo;aver diviso per $N!$ invece di contare gli stati con Pauli. Falcioni-Vulpiani (pag. 73) lo dicono esplicitamente discutendo l&rsquo;effetto termoionico: il gas di elettroni di conduzione è degenere, e va trattato quantisticamente. Quanto degenere, lo dice il numero della tappa 08.</p>`},
  {t:'plot', title:'Equipartizione, congelamento quantistico e anomalia di Schottky',
   intro:R`In ascissa la temperatura in unità della scala caratteristica del sistema ($T/\theta$ con $\theta=\hbar\omega$ per l'oscillatore, $\theta=\varepsilon$ per il sistema a due livelli); in ordinata il calore specifico per grado di libertà, in unità del valore classico.`,
   plots:[
    {kind:'func2d', xr:[0.05,3], yr:[0,1.2], height:340, ticks:6,
     title:'calore specifico per grado di liberta, tre spettri a confronto',
     curves:[
      {f:'1', col:'#5eead4', label:'equipartizione classica: costante, sempre'},
      {f:'pow(1/x,2)*exp(1/x)/pow(exp(1/x)-1,2)', col:'#d8a13a', label:'oscillatore quantistico: congela a bassa T'},
      {f:'pow(1/x,2)/pow(cosh(1/x),2)', col:'#ff6b6b', label:'due livelli: picco di Schottky, poi crolla'}
     ],
     xlabel:'T in unita della scala caratteristica', ylabel:'c_V in unita del valore classico'}
   ],
   leggi:R`<p><b>A destra tutte e tre coincidono, ed è il limite classico in una figura.</b> Quando $T$ supera la scala caratteristica, l&rsquo;oscillatore quantistico raggiunge il valore di equipartizione e ci resta: la discretizzazione dello spettro diventa invisibile perché i livelli sono molto più fitti dell&rsquo;energia termica. È lo stesso meccanismo del criterio $n\lambda^3\ll1$, visto su un grado di libertà invece che su un gas.</p>
   <p><b>A sinistra le due curve quantistiche divergono fra loro, e la differenza è lo spettro.</b> L&rsquo;oscillatore (ocra) ha infiniti livelli equispaziati e il suo calore specifico crolla monotonamente: congela e basta. Il sistema a due livelli (rosso) crolla <i>dopo essere salito</i>, e il picco sta dove l&rsquo;energia termica pareggia la separazione dei livelli. <b>Il criterio da portare all&rsquo;orale</b>: uno spettro illimitato dà un $c_V$ monotono, uno spettro limitato superiormente dà sempre un massimo, perché oltre il tetto non c&rsquo;è più energia da assorbire.</p>
   <p><b>Quello che la figura non mostra, e va detto.</b> Nessuna di queste curve descrive il gas di elettroni di un metallo, che pure ha spettro continuo e illimitato e dovrebbe stare sulla retta verde. Il suo calore specifico elettronico è lineare in $T$ e circa cento volte più piccolo, e la ragione non è nello spettro: è nella <i>statistica</i> con cui si occupano i livelli. È il buco che questo movimento sta scavando fin dalla prima tappa.</p>`}
]},

/* ---------------- 06 · LA DENSITA DEGLI STATI ---------------- */
{ num:'06', title:'La densita degli stati: come una somma diventa un integrale', meta:'definizione con la delta · il conto in tre, due e una dimensione · il picco della distribuzione dell energia · quando la traduzione e lecita',
  blocchi:[
  {t:'prosa', title:'Il problema: si sommano stati, ma si integrano energie', tag:'grammatica', html:R`
  <p>Tutte le medie fatte finora hanno la stessa forma: un integrale sullo spazio delle fasi di una funzione dell&rsquo;energia, pesata con $e^{-\beta H}$. Quando la funzione dipende <i>solo</i> dall&rsquo;energia — ed è quasi sempre così — quell&rsquo;integrale in sei variabili è uno spreco: basterebbe un integrale in una variabile sola, l&rsquo;energia, a patto di sapere <b>quanti stati ci sono a ciascuna energia</b>. Quella quantità è la <b>densità degli stati</b>, e imparare a calcolarla trasforma esercizi di sei integrali in esercizi di uno.</p>
  <p>Grilli-Giardina (pag. 62) la definisce nel modo diretto, contando con una <span class="str" data-str="delta-di-dirac">delta di Dirac</span> gli stati che hanno energia esattamente $\varepsilon$:</p>
  $$G(\varepsilon)=\int\frac{dq\,dp}{h^3}\,\delta\big(\varepsilon-H(q,p)\big)$$
  <p>e con essa la densità di probabilità dell&rsquo;energia di una particella nel canonico, che si ottiene marginalizzando $\rho_1$ con la stessa delta. Il conto è di una riga, e la riga è istruttiva: la delta impone $H=\varepsilon$, quindi $e^{-\beta H}$ diventa $e^{-\beta\varepsilon}$, che è una costante rispetto all&rsquo;integrazione e <b>esce</b>:</p>
  $$p(\varepsilon)=\int\frac{dq\,dp}{h^3}\,\rho_1(q,p)\,\delta\big(\varepsilon-H(q,p)\big)=\frac{e^{-\beta\varepsilon}}{z_1}\,G(\varepsilon)$$
  <p>Questa è la formula che governa metà degli esercizi del corso: <b>la probabilità di un&rsquo;energia è il peso di Boltzmann moltiplicato per il numero di modi di realizzarla</b>. Il peso decresce, il numero di modi di solito cresce, e il risultato è un picco. Prima però bisogna saper calcolare $G$.</p>`},
  {t:'reveal', title:'Il conto, in tre dimensioni e nelle altre due', tag:'costruzione', steps:[
   {label:'La scorciatoia: contare prima, derivare poi', body:R`
   <p>Si può attaccare la delta di petto, risolvendola sugli zeri del suo argomento come abbiamo fatto nella tappa 02 — è la strada che Grilli-Giardina percorre per esteso a pag. 63-64 — ma c&rsquo;è una scorciatoia che non sbaglia mai. Si calcola prima la funzione <b>cumulativa</b> $\Sigma(\varepsilon)$, cioè il volume di spazio delle fasi con energia <i>minore</i> di $\varepsilon$, che è un volume geometrico elementare; poi si deriva, perché la delta è la derivata della funzione gradino:</p>
   $$\Sigma(\varepsilon)=\int\frac{dq\,dp}{h^3}\,\theta\big(\varepsilon-H(q,p)\big)$$
   <p>In tre dimensioni la condizione $p^2/2m<\varepsilon$ definisce una palla di raggio $\sqrt{2m\varepsilon}$ nello spazio degli impulsi, e le posizioni danno $V$:</p>
   $$\Sigma_3(\varepsilon)=\frac{V}{h^3}\cdot\frac{4\pi}{3}(2m\varepsilon)^{3/2}$$
   $$G_3(\varepsilon)=\frac{d\Sigma_3}{d\varepsilon}=\frac{4\pi Vm}{h^3}\sqrt{2m\varepsilon}$$
   <p>cioè $G_3\propto\sqrt\varepsilon$. <b>È il risultato più usato dell&rsquo;intera meccanica statistica</b>: ricompare identico nel gas di Fermi, nel gas di Bose, nel corpo nero (con la relazione di dispersione dei fotoni al posto di quella non relativistica), e conviene ricordarlo per la sua struttura — superficie della sfera in $p$, per il giacobiano $dp/d\varepsilon$.</p>`},
   {label:'Due dimensioni, e una: la dipendenza cambia forma', body:R`
   <p>Lo stesso conto in due dimensioni: la condizione definisce un <i>disco</i> di raggio $\sqrt{2m\varepsilon}$, di area $\pi\cdot2m\varepsilon$, lineare in $\varepsilon$. Derivando,</p>
   $$\Sigma_2(\varepsilon)=\frac{A}{h^2}\,\pi\,(2m\varepsilon)$$
   $$G_2(\varepsilon)=\frac{d\Sigma_2}{d\varepsilon}=\frac{2\pi Am}{h^2}$$
