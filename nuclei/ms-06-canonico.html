/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un
   rimando scritto nella prosa:

       <span class="str" data-str="serie-geometrica">la serie geometrica</span>

   Le schede citate da questo nucleo sono cucite qui sotto dal montaggio
   (assembla-nucleo.js): la pagina resta autosufficiente — niente fetch,

   Apertura: lo stesso gesto del collaudo (si clicca, il pannello compare,

   =================================================================== */
var CORSO = 'meccanica-statistica';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["trasformata-di-legendre"] = {"nome":"Trasformata di Legendre","riga":"Scambia una variabile con la sua derivata coniugata: da $f(x)$ si passa a $g(p)=f(x)-px$ con $p=df/dx$, e $dg=-x\\,dp$.","serve":"Serve quando la variabile naturale di una funzione non e' quella che si controlla in laboratorio. La trasformata non perde informazione — da $g$ si torna a $f$ — e cambia solo quale variabile e' indipendente. E' l'operazione che genera tutti i potenziali termodinamici l'uno dall'altro, e la stessa che porta dalla lagrangiana all'hamiltoniana.","esempio":"Con $f(x)=x^{2}$: $p=2x$, $x=p/2$, $g=x^{2}-px=p^{2}/4-p^{2}/2=-p^{2}/4$. Il segno negativo non e' un errore: per $f$ convessa la trasformata e' concava, e applicandola due volte si torna a $f$.","pieno":null,"qui":{"meccanica-statistica":{"serve":"E' il ponte fra gli ensemble. Il passaggio da microcanonico a canonico non e' solo un cambio di racconto — energia fissata contro temperatura fissata — e' una trasformata di Legendre dell'entropia, e questo spiega perche' i due ensemble danno gli stessi risultati all'equilibrio: la trasformata e' invertibile.","esempio":"Da $S(E)$ con $1/T=\\partial S/\\partial E$ si passa all'energia libera $F=E-TS$, funzione di $T$ invece che di $E$, con $dF=-S\\,dT-p\\,dV$. Lo stesso schema porta da $F$ al gran potenziale $\\Omega=F-\\mu N$ scambiando $N$ con $\\mu$: e' sempre la stessa operazione, applicata a una coppia coniugata diversa."}}};
STRUM["stirling"] = {"nome":"Approssimazione di Stirling","riga":"Per $N$ grande, $\\ln N! = N\\ln N - N + \\tfrac12\\ln(2\\pi N) + O(1/N)$; quasi sempre bastano i primi due termini.","serve":"Il fattoriale nasce ogni volta che si contano configurazioni, e $N!$ con $N\\sim 10^{23}$ non e' un numero che si maneggia. Stirling lo trasforma in una funzione liscia e derivabile di $N$ — ed e' proprio la derivabilita', non la comodita', il punto: senza di essa non si potrebbe massimizzare un'entropia rispetto a un numero di occupazione.","esempio":"Con $N=10$: $\\ln 10! = 15{,}104$, mentre $N\\ln N - N = 13{,}026$ e il termine $\\tfrac12\\ln(2\\pi N)=2{,}070$ porta a $15{,}096$ — tre cifre esatte gia' a dieci. Il terzo termine e' trascurabile in termodinamica perche' cresce come $\\ln N$ contro $N$: su $N=10^{23}$ pesa $10^{-22}$ in relativo. Per questo in meccanica statistica si scrive $\\ln N!\\simeq N\\ln N-N$ e non si guarda indietro.","pieno":null,"qui":{"meccanica-statistica":{"serve":"E' lo strumento senza il quale il conteggio microcanonico non diventa termodinamica. $S=k\\ln\\Omega$ con $\\Omega$ pieno di fattoriali resta un'espressione; applicato Stirling, $S$ diventa una funzione estensiva di $N$, $V$, $E$ che si puo' derivare per ottenere temperatura e pressione.","esempio":"Nel gas ideale il conteggio corretto di Boltzmann divide per $N!$, e il suo logaritmo $-\\ln N!\\simeq -N\\ln N+N$ e' esattamente il termine che rende l'entropia estensiva e scioglie il paradosso di Gibbs. Togliere Stirling di li' significa non vedere piu' da dove viene il $-N\\ln N$ della Sackur-Tetrode."}}};
STRUM["integrale-gaussiano"] = {"nome":"Integrale gaussiano","riga":"$\\displaystyle\\int_{-\\infty}^{+\\infty} e^{-ax^{2}}\\,dx=\\sqrt{\\pi/a}$ per $a>0$, e $\\displaystyle\\int_{-\\infty}^{+\\infty} x^{2}e^{-ax^{2}}\\,dx=\\tfrac12\\sqrt{\\pi/a^{3}}$.","serve":"E' l'unico integrale che serve davvero sapere a memoria in meccanica statistica, perche' l'energia cinetica e' quadratica nell'impulso e quindi ogni integrazione sugli impulsi e' una gaussiana. Il trucco della dimostrazione — elevare al quadrato e passare in coordinate polari — vale la pena di vederlo una volta: e' il motivo per cui compare un $\\pi$ in una formula che di cerchi non parla.","esempio":"Da $I^{2}=\\iint e^{-a(x^{2}+y^{2})}dx\\,dy=2\\pi\\int_{0}^{\\infty}re^{-ar^{2}}dr=\\pi/a$ segue $I=\\sqrt{\\pi/a}$. I momenti superiori si ottengono derivando rispetto ad $a$ sotto il segno: $-\\partial_a I=\\int x^{2}e^{-ax^{2}}dx=\\tfrac12\\sqrt{\\pi}\\,a^{-3/2}$. Derivare rispetto a un parametro e' piu' rapido che integrare per parti, e funziona per tutti i momenti pari.","pieno":null,"qui":{"meccanica-statistica":{"serve":"La funzione di partizione di una particella libera e' un prodotto di tre gaussiane negli impulsi, e da li' esce la lunghezza d'onda termica $\\lambda=h/\\sqrt{2\\pi m k T}$ — che e' la grandezza con cui si misura quando un gas smette di essere classico.","esempio":"$\\int e^{-\\beta p^{2}/2m}dp=\\sqrt{2\\pi m/\\beta}$, quindi $Z_{1}=\\dfrac{V}{h^{3}}(2\\pi mkT)^{3/2}=V/\\lambda^{3}$. Lo stesso integrale col peso $p^{2}$ da' $\\langle p^{2}/2m\\rangle=\\tfrac12 kT$ per grado di liberta': l'equipartizione non e' un principio a parte, e' questo integrale."}}};
STRUM["serie-geometrica"] = {"nome":"Serie geometrica","riga":"La somma $\\sum_{n\\ge 0} q^{n}$ vale $\\dfrac{1}{1-q}$ se $|q|\\lt 1$, e non esiste se $|q|\\ge 1$.","serve":"È l'unica serie di cui si conosce la somma in forma chiusa senza fatica, e per questo diventa il metro di tutte le altre: una serie si studia maggiorandola con una geometrica (criterio del rapporto, criterio della radice) o riconoscendola come geometrica travestita.","esempio":"Con $q=\\tfrac12$: $1+\\tfrac12+\\tfrac14+\\cdots=\\dfrac{1}{1-\\tfrac12}=2$. Con $q=-\\tfrac13$: $\\dfrac{1}{1+\\tfrac13}=\\tfrac34$. Con $q=1$ le somme parziali sono $N+1$ e se ne vanno: la formula $1/(1-q)$ non è una scorciatoia da usare fuori dal suo raggio.","pieno":{"file":"07-serie-funzioni.html","tappa":"04","come":"il raggio $R=1$, il grafico delle somme parziali e la cassetta dei trucchi che parte da qui, nella tappa sulle serie di potenze"},"qui":{"metodi-e-modelli":{"serve":"È il motore della serie di Laurent: lo sviluppo di $\\dfrac{1}{z-a}$ in potenze di $z$ o di $1/z$ è una geometrica, e quale delle due si sceglie decide in quale corona si sta sviluppando. Tutta la parte principale di Laurent nasce da qui.","esempio":"Per $\\dfrac{1}{z-2}$ con $|z|\\lt 2$ si scrive $-\\tfrac12\\cdot\\dfrac{1}{1-z/2}=-\\sum_{n\\ge0}\\dfrac{z^{n}}{2^{n+1}}$; in $z=1$ entrambi i membri valgono $-1$. Per $|z|\\gt 2$ si raccoglie invece $z$ e viene $\\sum_{n\\ge0}\\dfrac{2^{n}}{z^{n+1}}$, cioè solo potenze negative; in $z=4$ entrambi i membri valgono $\\tfrac12$."},"elettromagnetismo":{"serve":"Compare ogni volta che una configurazione si ripete con un fattore costante — catene di cariche immagine fra due piani conduttori, riflessioni multiple in una cavità — e la somma chiusa è ciò che rende il conto finito invece che infinito.","esempio":"Una carica fra due piani paralleli genera immagini a distanze crescenti, e il contributo al potenziale è una somma del tipo $\\sum_{n\\ge0} r^{n}$ con $r\\lt 1$ fissato dalla geometria. Con una riflettività $r=\\tfrac14$ la serie vale $\\tfrac43$: la catena è infinita, il potenziale no."}},"controllo":[{"tipo":"somma","espr":"(1/2)**n","var":"n","da":"0","a":"oo","vale":"2","dove":"esempio","appare":"=2"},{"tipo":"somma","espr":"(-1/3)**n","var":"n","da":"0","a":"oo","vale":"3/4","dove":"esempio","appare":"\\tfrac34"},{"tipo":"somma","espr":"-1**n/2**(n+1)","var":"n","da":"0","a":"oo","vale":"-1","dove":"qui.metodi-e-modelli.esempio","appare":"-1"},{"tipo":"somma","espr":"2**n/4**(n+1)","var":"n","da":"0","a":"oo","vale":"1/2","dove":"qui.metodi-e-modelli.esempio","appare":"\\tfrac12"},{"tipo":"somma","espr":"(1/4)**n","var":"n","da":"0","a":"oo","vale":"4/3","dove":"qui.elettromagnetismo.esempio","appare":"\\tfrac43"},{"tipo":"uguale","sinistra":"1/(1-2)","vale":"-1","dove":"qui.metodi-e-modelli.esempio","appare":"-1"},{"tipo":"uguale","sinistra":"1/(4-2)","vale":"1/2","dove":"qui.metodi-e-modelli.esempio","appare":"\\tfrac12"}]};

function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';

}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

/* ---------------- 00 · DI COSA PARLA QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Di cosa parla questo movimento', meta:'Meccanica Statistica · voce A.6 · il baratto fra energia fissata e temperatura fissata',
  blocchi:[
  {t:'prosa', title:'Il movimento con cui si risolve ogni scritto', tag:'architettura', html:R`
  <p>C&rsquo;è un ensemble in cui l&rsquo;energia di un sistema isolato è fissata a $E$, e per contarne i microstati bisogna integrare una $\delta(H-E)$ su una ipersuperficie complicata — un vincolo scomodo che, ogni volta, costringe a una rappresentazione integrale e a un punto di sella. Questo movimento fa un <b>baratto</b>: rinuncia a fissare l&rsquo;energia e la lascia fluttuare, in cambio di fissare la <b>temperatura</b>. Il prezzo è concettuale — non si descrive più un sistema isolato ma uno a contatto con un serbatoio — e il guadagno è tecnico e enorme: il vincolo sparisce, e al posto della $\delta$ compare un peso liscio, il <b>fattore di Boltzmann</b> $e^{-\beta H}$, che si integra senza sella. L&rsquo;oggetto che raccoglie quel peso su tutti gli stati è la <b>funzione di partizione</b> $Z$, e da $Z$ discende, con sole derivate, tutta la termodinamica.</p>
  <p style="text-align:center"><b>si perde il controllo dell&rsquo;energia e si guadagna una macchina che trasforma un integrale in derivate del logaritmo di $Z$.</b></p>
  <p>Conviene dire subito perché questo è il movimento operativamente più importante del corso. Nelle prove d&rsquo;esame il canonico è ovunque: in <b>quarantasei scritti su quarantasette</b> il primo gesto della soluzione è lo stesso — scrivere la funzione di partizione di <b>una sola particella</b>, $Z_1$, ed elevarla alla $N$ dividendo per $N!$. Chi ha in mano quel gesto e la catena $Z\to F\to$ tutto il resto risolve; chi non ce l&rsquo;ha resta fermo davanti alla $\delta$. Per questo qui la costruzione non è un cenno: si deriva il peso di Boltzmann dal microcanonico del sistema più bagno, si mostra <i>perché</i> $Z_N=Z_1^{\,N}/N!$ vale solo per particelle non interagenti, si stabilisce $F=-T\log Z$, e si svolge il gas ideale per intero — partizione, energia libera, energia media, entropia, densità di probabilità, pressione — nella forma esatta in cui lo scritto lo chiede.</p>
  <div class="note"><b>Una convenzione, fissata all&rsquo;inizio.</b> Seguendo le note di Crisanti, il docente del terzo canale, e quelle di Gravina, poniamo la costante di Boltzmann $k=1$, così che $\beta=1/T$ e l&rsquo;entropia è un numero puro. Falcioni-Vulpiani tengono invece $k_B$ esplicito e scrivono $\beta=1/k_BT$: dove riporto una loro formula lo dichiaro, perché la differenza è solo di unità ma confonde chi la incontra senza avviso. La stessa cautela vale per il fattore $1/(h^{3N}N!)$ nella misura dello spazio delle fasi: Crisanti e Gravina lo scrivono dentro l&rsquo;integrale, Falcioni-Vulpiani pongono $h=1$ e recuperano l&rsquo;$N!$ discutendo a parte il paradosso di Gibbs. Sono lo stesso conto scritto in due grammatiche.</p></div>`},
  {t:'prosa', title:'Come e fatto il movimento', tag:'architettura', html:R`
  <p><b>La rotta</b>, perché la strada è lunga. Prima il <b>baratto</b>: da dove viene il fattore $e^{-\beta H}$, ricavato affacciando un piccolo sistema a un grande bagno termico e marginalizzando il microcanonico del composto. Poi l&rsquo;oggetto centrale, la <b>funzione di partizione</b> $Z$, e la relazione $F=-T\log Z$ letta come una <span class="str" data-str="trasformata-di-legendre">trasformata di Legendre</span> che scambia l&rsquo;energia con la temperatura. Poi la <b>catena</b> $Z\to F\to$ energia, entropia, pressione, calore specifico, fluttuazioni: la macchina che rende il canonico così comodo. Poi il passo che decide gli scritti — la <b>fattorizzazione</b> $Z_N=Z_1^{\,N}/N!$ e la ragione per cui vale solo senza interazioni. Poi il <b>gas ideale</b> svolto interamente, la <b>densità di probabilità di Maxwell-Boltzmann</b> come sua conseguenza immediata, e le <b>fluttuazioni di energia</b> che chiudono il cerchio provando che canonico e microcanonico danno la stessa termodinamica. Infine l&rsquo;<b>oscillatore</b>, classico e quantistico, dove la funzione di partizione di un singolo modo è una serie geometrica, e una batteria di esercizi nella forma d&rsquo;esame.</p>`}
]},

/* ---------------- 01 · IL BARATTO E IL PESO DI BOLTZMANN ---------------- */
{ num:'01', title:'Il baratto: da dove viene il peso di Boltzmann', meta:'sistema piu bagno termico · marginalizzazione del microcanonico · lo sviluppo dellentropia del bagno · il fattore e alla meno beta H',
  blocchi:[
  {t:'prosa', title:'Perche non basta postulare e alla meno beta H', tag:'grammatica', html:R`
  <p>Si potrebbe introdurre il canonico per decreto: «assegniamo a ogni microstato di energia $H$ il peso $e^{-\beta H}$». Funziona, ma non spiega da dove viene $\beta$ né perché proprio quel peso, e all&rsquo;orale la domanda è esattamente questa. La derivazione onesta parte dal microcanonico — l&rsquo;unico ensemble davvero primario, quello di un sistema isolato — e ne <b>marginalizza</b> una parte piccola. È la strada che Gravina chiama <i>physical considerations</i> (cap. 7) e che Crisanti (pag. 194-196) e Falcioni-Vulpiani (par. 3.2) percorrono con parole quasi identiche.</p>
  <p>Il punto di partenza è un solo fatto, che enuncio in due righe con la sua ipotesi perché serve subito: per un sistema <b>isolato</b> in equilibrio la densità nello spazio delle fasi è uniforme sulla superficie di energia, $\rho=\delta(H-E)/\Gamma(E)$, dove $\Gamma(E)$ conta i microstati accessibili e $S=\log\Gamma$ è l&rsquo;entropia (postulato di Boltzmann, $k=1$). Tutto il resto di questo movimento è una conseguenza di questo fatto applicato a un sistema che <i>non</i> è isolato.</p>`},
  {t:'reveal', title:'La marginalizzazione, passo per passo', tag:'costruzione', steps:[
   {label:'Il composto isolato, e la parte che ci interessa', body:R`
   <p>Dividiamo un sistema isolato in due: un sottosistema piccolo $A_1$ (hamiltoniana $H_1$, $N_1$ particelle) e un bagno grande $A_2$ ($H_2$, $N_2\gg N_1$). Trascurando l&rsquo;interazione di superficie fra loro, $H=H_1+H_2$, e l&rsquo;energia totale $E$ è fissata perché il composto è isolato. Il composto è descritto dal microcanonico, $\rho(s_1,s_2)=\delta(E-H_1-H_2)/\Gamma(E)$. Di $A_2$ non ci interessa nulla se non che regge la temperatura: lo integriamo via, cioè <b>marginalizziamo</b>. La densità del solo $A_1$, nello stato $s_1$, si ottiene sommando su tutti gli stati del bagno compatibili:</p>
   $$\rho(s_1)=\sum_{s_2}\frac{\delta(E-H_1-H_2)}{\Gamma(E)}=\frac{\Gamma_2(E-H_1)}{\Gamma(E)}.$$
   <p>La somma su $s_2$ della $\delta$ conta proprio i microstati del bagno con energia $E-H_1$: è, per definizione, $\Gamma_2(E-H_1)$. Il denominatore $\Gamma(E)$ non dipende da $s_1$: è una costante di normalizzazione.</p>`},
   {label:'Lo sviluppo dellentropia del bagno', body:R`
   <p>Scriviamo il numeratore come esponenziale dell&rsquo;entropia del bagno, $\Gamma_2(E-H_1)=e^{S_2(E-H_1)}$. Qui entra l&rsquo;unica approssimazione, ed è controllata: poiché $A_1$ è piccolo, l&rsquo;energia che gli compete è minuscola rispetto a $E$, cioè $H_1\ll E$, e possiamo sviluppare $S_2$ in serie di Taylor al primo ordine attorno a $E$:</p>
   $$S_2(E-H_1)\simeq S_2(E)-H_1\left.\frac{\partial S_2}{\partial E_2}\right|_{E_2=E}=S_2(E)-\beta H_1,$$
   <p>avendo riconosciuto la <b>definizione termodinamica di temperatura</b> del bagno, $\partial S_2/\partial E_2=1/T\equiv\beta$. È qui che $\beta$ nasce: <b>non è un parametro del sistema piccolo, è la temperatura del bagno</b> — la sola cosa che di $A_2$ sopravvive alla marginalizzazione. Esponenziando, $\Gamma_2(E-H_1)\simeq e^{S_2(E)}e^{-\beta H_1}$, e siccome $e^{S_2(E)}/\Gamma(E)$ è una costante rispetto a $s_1$,</p>
   $$\boxed{\;\rho_C(s_1)\propto e^{-\beta H_1}\;}$$
   <p>Questa è la <b>distribuzione canonica</b>, e $e^{-\beta H}$ è il <b>fattore di Boltzmann</b>. Il fatto che il peso dipenda solo dall&rsquo;energia dello stato, e non da altro, è l&rsquo;eredità dell&rsquo;equiprobabilità microcanonica: il bagno non ha preferenze, e la sua unica impronta sul sistema piccolo è la temperatura con cui pesa le energie.</p>`},
   {label:'La normalizzazione e il primo affacciarsi di Z', body:R`
   <p>Per farne una densità di probabilità si normalizza. Chiamiamo $Z$ la costante che rende $\sum_{s_1}\rho_C(s_1)=1$:</p>
   $$\rho_C(s_1)=\frac{e^{-\beta H_1}}{Z},\qquad Z=\sum_{s_1}e^{-\beta H_1}.$$
   <p>Falcioni-Vulpiani (eq. 3.23-3.25) svolgono la stessa costruzione tenendo $k_B$ esplicito e arrivano a una forma che merita di essere letta, perché contiene già la termodinamica: riscrivono $e^{S_2(E)}/\Gamma(E)=e^{\,\beta(F_1-H_1)}$ con $F_1=U_1-TS_1$, cioè $\rho_C\propto e^{\beta(F-H)}$. Confrontando con $\rho_C=e^{-\beta H}/Z$ si legge subito $Z=e^{-\beta F}$, ovvero $F=-T\log Z$ — il ponte fra $Z$ (meccanica statistica) ed $F$ (termodinamica) esce già qui, e lo isoliamo nella prossima tappa. La stessa distribuzione, avverte Landau e ripete Crisanti (pag. 198), si applica anche a un sistema isolato: la differenza rispetto al microcanonico è solo nelle fluttuazioni di energia, fittizie per un corpo isolato e trascurabili per uno macroscopico.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Da dove viene $\beta$ nella distribuzione canonica, e perché non dipende dal sistema piccolo?`,
    a:R`$\beta$ è l&rsquo;inverso della temperatura del <b>bagno</b>: compare come coefficiente dello sviluppo di Taylor $S_2(E-H_1)\simeq S_2(E)-H_1\,\partial S_2/\partial E_2$, e $\partial S_2/\partial E_2=1/T$ è la definizione termodinamica di temperatura applicata al serbatoio. Il sistema piccolo non ha una sua temperatura indipendente: raggiunge quella del bagno, e la sola informazione che di $A_2$ sopravvive alla marginalizzazione è quel numero. <b>Il criterio che regge il passaggio è che l&rsquo;energia del sottosistema sia trascurabile rispetto a quella del bagno</b>, $H_1\ll E$, senza cui lo sviluppo al primo ordine non è lecito.`},
   {q:R`Perché il peso è $e^{-\beta H}$ e non, per esempio, $e^{-\beta H^2}$?`,
    a:R`Perché è l&rsquo;<b>additività dell&rsquo;energia</b> del composto, $H=H_1+H_2$, combinata con lo sviluppo lineare di $S_2$, a produrre un termine <i>lineare</i> in $H_1$ all&rsquo;esponente. Un peso $e^{-\beta H^2}$ richiederebbe un termine quadratico, che comparirebbe solo al secondo ordine dello sviluppo — ma quel termine è soppresso da $1/\sqrt N$ (è legato alla curvatura $\partial^2 S_2/\partial E^2$, di ordine $1/N_2$) e svanisce nel limite di bagno infinito. <b>La linearità del peso è la firma di un serbatoio molto più grande del sistema.</b>`}
  ]}
]},

/* ---------------- 02 · LA FUNZIONE DI PARTIZIONE E F = -T LOG Z ---------------- */
{ num:'02', title:'La funzione di partizione, e F come trasformata di Legendre', meta:'Z raccoglie il peso su tutti gli stati · F=-T log Z · lo scambio energia-temperatura senza perdita di informazione',
  blocchi:[
  {t:'prosa', title:'Che cosa e Z, e perche e piu di una normalizzazione', tag:'definizione', html:R`
  <p>La funzione di partizione è la somma del peso di Boltzmann su tutti i microstati, che nel continuo e con il conteggio corretto di Boltzmann si scrive</p>
  $$Z(T,V,N)=\sum_s e^{-\beta H(s)}\;\longrightarrow\;Z(T,V,N)=\int\frac{d^{3N}q\,d^{3N}p}{h^{3N}N!}\,e^{-\beta H(q,p)}.$$
  <p>Il fattore $h^{3N}$ rende $Z$ adimensionale (Gravina, def. 7.1.1) e l&rsquo;$1/N!$ è l&rsquo;indistinguibilità delle particelle identiche — ci torniamo nella tappa 04. Crisanti (pag. 191) insiste su un punto che vale ripetere: $Z$ nasce come costante di normalizzazione, ma <b>il suo ruolo è molto più importante</b>, perché tutte le grandezze termodinamiche si ottengono da $Z$ e dalle sue derivate. La ragione è che $Z$ è l&rsquo;unico ensemble in cui l&rsquo;informazione termodinamica non sta in un vincolo geometrico ma in una funzione liscia di $\beta$: derivare è facile, integrare una $\delta$ no.</p>`},
  {t:'prosa', title:'F = -T log Z, letta come trasformata di Legendre', tag:'costruzione', html:R`
  <p>Il ponte con la termodinamica è la relazione, già affacciata nella tappa precedente,</p>
  $$Z=e^{-\beta F}\quad\Longleftrightarrow\quad F=-T\log Z,$$
  <p>dove $F=E-TS$ è l&rsquo;<b>energia libera di Helmholtz</b>. Non è una coincidenza di simboli: è una <span class="str" data-str="trasformata-di-legendre">trasformata di Legendre</span>. Nel microcanonico la funzione naturale è $S(E)$, con la temperatura definita da $1/T=\partial S/\partial E$; passare al canonico significa scambiare la variabile $E$ con la sua coniugata $T$, e la trasformata che lo fa senza perdere informazione è proprio $F(T)=E-TS$, con il differenziale $dF=-S\,dT-P\,dV$. Wei-Cai e Crisanti (pag. 199) lo dicono senza giri: l&rsquo;entropia $S(N,V,E)$ si trasforma nella forma più conveniente $F(N,V,T)$ tramite una trasformata di Legendre, e questa è la stessa operazione che genera tutti i potenziali termodinamici l&rsquo;uno dall&rsquo;altro.</p>
  <p>Che sia una trasformata di Legendre spiega, gratis, <b>perché microcanonico e canonico devono dare la stessa termodinamica</b>: la trasformata è invertibile, da $F(T)$ si torna a $S(E)$ senza perdere nulla, quindi i due ensemble contengono la stessa informazione, scritta in variabili diverse. Un esempio numerico per fissare il meccanismo, con $f(x)=x^2$: la variabile coniugata è $p=f'(x)=2x$, dunque $x=p/2$, e la trasformata vale $g(p)=f(x)-px=(p/2)^2-p(p/2)=-\tfrac{p^2}{4}$. Il segno che si ribalta — da $f$ convessa a $g$ concava — è lo stesso segno per cui $F$ ha un <i>minimo</i> all&rsquo;equilibrio dove $S$ ha un massimo.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`In che senso $F=-T\log Z$ e una trasformata di Legendre, e perché la cosa è utile?`,
    a:R`È la trasformata che scambia l&rsquo;energia $E$ (variabile naturale di $S$) con la temperatura $T$ (variabile naturale di $F$): da $S(E)$ con $1/T=\partial S/\partial E$ si passa a $F=E-TS$ con $S=-\partial F/\partial T$. <b>È utile perché $T$ si controlla in laboratorio e $E$ no</b>: fissare la temperatura è la situazione sperimentale ordinaria. Ed è invertibile, il che garantisce che $S(E)$ e $F(T)$ portino la stessa informazione — da cui <b>l&rsquo;equivalenza degli ensemble</b>. Il criterio invocato è la struttura della trasformata di Legendre fra potenziali coniugati.`}
  ]}
]},

/* ---------------- 03 · LA CATENA Z -> F -> TUTTO IL RESTO ---------------- */
{ num:'03', title:'La catena: da Z a tutta la termodinamica', meta:'energia media come derivata di log Z · entropia e pressione da F · calore specifico · le fluttuazioni come derivata seconda',
  blocchi:[
  {t:'prosa', title:'La macchina, in una figura sola', tag:'regola operativa', html:R`
  <p>Il canonico è amato perché una volta calcolato $Z$ tutto il resto sono derivate. Ecco la catena, con le derivazioni. L&rsquo;<b>energia media</b> è la media del peso di Boltzmann, e si ottiene derivando $\log Z$ rispetto a $\beta$:</p>
  $$\langle H\rangle=\frac{\sum_s H\,e^{-\beta H}}{\sum_s e^{-\beta H}}=-\frac{1}{Z}\frac{\partial Z}{\partial\beta}=-\frac{\partial\log Z}{\partial\beta},\qquad E=-\frac{\partial\log Z}{\partial\beta}.$$
  <p>La riscrittura è esatta: $\partial_\beta e^{-\beta H}=-H\,e^{-\beta H}$, quindi $\partial_\beta Z=-\sum_s H e^{-\beta H}=-Z\langle H\rangle$. Da $F=-T\log Z$ discendono <b>entropia</b> e <b>pressione</b> come derivate di $F$, leggendo il differenziale $dF=-S\,dT-P\,dV$:</p>
  $$S=-\left(\frac{\partial F}{\partial T}\right)_{V,N},\qquad P=-\left(\frac{\partial F}{\partial V}\right)_{T,N}.$$
  <p>Per un sistema il cui $\log Z$ dipende da $\beta$ come quello del gas ideale, $\log Z=\text{cost}-\tfrac{3N}{2}\log\beta+N\log V$, la derivata dà subito il risultato canonico: $\partial_\beta\log Z=-\dfrac{3N}{2\beta}$, dunque $E=-\partial_\beta\log Z=\dfrac{3N}{2\beta}=\tfrac32 NT$. È l&rsquo;energia di equipartizione, ottenuta senza alcun punto di sella.</p>`},
  {t:'prosa', title:'Il calore specifico, e le fluttuazioni come sua derivata', tag:'costruzione', html:R`
  <p>Il <b>calore specifico a volume costante</b> è la risposta dell&rsquo;energia alla temperatura, $C_V=\partial E/\partial T$; per il gas ideale, da $E=\tfrac32 NT$, si trova $C_V=\dfrac{\partial E}{\partial T}=\tfrac32 N$. Ma il canonico dà di più: lega $C_V$, una <i>risposta</i>, alle <b>fluttuazioni</b> di energia, una <i>varianza</i>. Derivando ancora $\langle H\rangle$ rispetto a $\beta$,</p>
  $$-\frac{\partial\langle H\rangle}{\partial\beta}=\frac{\partial}{\partial\beta}\!\left(\frac{1}{Z}\frac{\partial Z}{\partial\beta}\right)=\frac{\sum_s H^2 e^{-\beta H}}{Z}-\left(\frac{\sum_s H e^{-\beta H}}{Z}\right)^2=\langle H^2\rangle-\langle H\rangle^2.$$
  <p>D&rsquo;altra parte $-\partial_\beta\langle H\rangle=-\dfrac{\partial T}{\partial\beta}\dfrac{\partial E}{\partial T}=T^2C_V$, avendo usato $\partial_\beta=-T^2\partial_T$. Dunque, come deriva Crisanti (pag. 197),</p>
  $$\langle H^2\rangle-\langle H\rangle^2=T^2C_V.$$
  <p>È una delle relazioni più profonde della meccanica statistica — un <b>teorema di fluttuazione-dissipazione</b> in forma elementare — e si legge sui numeri: per il gas ideale $\langle H\rangle=\tfrac32 NT$ dà $\partial_\beta\langle H\rangle=-\dfrac{3N}{2\beta^2}$, quindi $\langle H^2\rangle-\langle H\rangle^2=\dfrac{3N}{2\beta^2}=\tfrac32 NT^2$, coerente con $T^2C_V=T^2\cdot\tfrac32 N$. Che $C_V\propto N$ implica che la fluttuazione relativa dell&rsquo;energia va come $1/\sqrt N$: lo sfruttiamo nella tappa 07 per provare l&rsquo;equivalenza degli ensemble.</p>`},
  {t:'plot', title:'Le due pesature della stessa curva',
   intro:R`In ascissa l'energia $E$ in unità arbitrarie. Il peso di Boltzmann $e^{-\beta E}$ (decrescente) e la densità degli stati $\Omega(E)\propto E^{3}$ (crescente) si moltiplicano nel canonico: il loro prodotto $P(E)\propto\Omega(E)e^{-\beta E}$ è la distribuzione dell'energia, piccata al valor medio.`,
   plots:[
    {kind:'func2d', xr:[0,2.5], yr:[0,1.6], height:320, ticks:6,
     title:'peso di Boltzmann, densita degli stati, e il loro prodotto',
     curves:[
      {f:'exp(-3*x)', col:'#5eead4', label:'peso di Boltzmann e^(-beta E): decresce'},
      {f:'pow(x,4)/6', col:'#d8a13a', label:'densita degli stati Omega(E): cresce'},
      {f:'pow(x,4)*exp(-3*x)*3', col:'#ff6b6b', label:'prodotto P(E): piccato'}
     ],
     xlabel:'E (energia)', ylabel:'peso (unita arbitrarie)'}
   ],
   leggi:R`<p><b>Il canonico non fissa l&rsquo;energia: la pesa.</b> La curva verde è il fattore di Boltzmann, che da solo direbbe «tutti gli stati a energia più bassa possibile»; la curva ocra è la densità degli stati, che da sola direbbe «tutti gli stati a energia più alta», perché in alta dimensione i microstati si accumulano dove c&rsquo;è più spazio delle fasi. La verità è il loro <b>prodotto</b>, la curva rossa, che ha un massimo dove i due andamenti si bilanciano.</p>
   <p><b>Quel massimo è l&rsquo;energia media $E=\langle H\rangle$</b>, e coincide — questo è il contenuto profondo — con l&rsquo;energia che nel microcanonico si sarebbe fissata a mano. Il canonico lascia fluttuare $E$ attorno a quel valore, ma la fluttuazione è così stretta (tappa 07) che il valor medio è di fatto certo. È la stessa curva del microcanonico, vista come prodotto di due fattori invece che come vincolo: <b>due modi di pesare la stessa distribuzione di energia</b>.</p>
   <p><b>La morale operativa.</b> Quando in un conto compare $\int dE\,\Omega(E)e^{-\beta E}$, non serve trovarne il massimo con un punto di sella come nel microcanonico: nel canonico si integra direttamente sul peso di Boltzmann, che è liscio, e il picco si occupa da sé di selezionare l&rsquo;energia giusta. È esattamente il lavoro che il baratto ci ha risparmiato.</p>`}
]},

/* ---------------- 04 · LA FATTORIZZAZIONE Z_1^N / N! ---------------- */
{ num:'04', title:'La fattorizzazione Z_1 elevata a N, e perche solo senza interazioni', meta:'hamiltoniana separabile · il prodotto che diventa potenza · il fattore 1 su N fattoriale · il paradosso di Gibbs',
  blocchi:[
  {t:'prosa', title:'Il primo gesto di ogni scritto', tag:'regola operativa', html:R`
  <p>Ecco il passo che l&rsquo;esame chiede in quarantasei prove su quarantasette. Supponiamo che le $N$ particelle siano <b>identiche</b> e <b>non interagenti</b>, cioè che l&rsquo;hamiltoniana sia una somma di termini di singola particella:</p>
  $$H=\sum_{i=1}^{N}H_1(q_i,p_i),\qquad H_1=\frac{p^2}{2m}+V(q).$$
  <p>Allora il peso di Boltzmann <b>fattorizza</b>, perché l&rsquo;esponenziale di una somma è un prodotto di esponenziali: $e^{-\beta\sum_i H_1(i)}=\prod_{i=1}^{N}e^{-\beta H_1(i)}$. L&rsquo;integrale su tutte le coordinate si spezza allora nel prodotto di $N$ integrali identici, uno per particella:</p>
  $$Z_N=\frac{1}{h^{3N}N!}\int\prod_i d^3q_i\,d^3p_i\;\prod_i e^{-\beta H_1(i)}=\frac{1}{N!}\left[\frac{1}{h^3}\int d^3q\,d^3p\;e^{-\beta H_1}\right]^{N}=\frac{Z_1^{\,N}}{N!},$$
  <p>dove $Z_1=\dfrac{1}{h^3}\displaystyle\int d^3q\,d^3p\,e^{-\beta H_1}$ è la <b>funzione di partizione di una sola particella</b>. Questa è la ragione per cui il canonico domina gli scritti: il problema a $N$ corpi si riduce al calcolo di un integrale a sei dimensioni, $Z_1$, e poi a un&rsquo;elevazione a potenza.</p>`},
  {t:'prosa', title:'Perche solo senza interazioni, e cosa fa lN fattoriale', tag:'costruzione', html:R`
  <p><b>La fattorizzazione vale solo perché $H$ è separabile.</b> Se ci fosse un termine di interazione $\sum_{i\lt j}U(|q_i-q_j|)$, il peso non si spezzerebbe in un prodotto — l&rsquo;esponenziale di $-\beta\sum_{i<j}U_{ij}$ mescola le coordinate di coppie diverse — e $Z_N$ non sarebbe $Z_1^N/N!$. È il confine esatto fra i problemi che l&rsquo;esame chiede (gas ideali, oscillatori indipendenti, spin non accoppiati) e quelli che non chiede (gas reali, transizioni di fase): la potenza $Z_1^N$ è la firma dell&rsquo;<b>indipendenza statistica</b>.</p>
  <p>Resta l&rsquo;$1/N!$. Non è un dettaglio di normalizzazione: è ciò che rende l&rsquo;entropia <b>estensiva</b> e scioglie il <b>paradosso di Gibbs</b>. Senza di esso, l&rsquo;entropia del gas ideale conterrebbe un termine $N\log V$ invece di $N\log(V/N)$, e mescolando due volumi uguali dello stesso gas si troverebbe un aumento spurio di entropia. Con il conteggio corretto, il logaritmo di $Z_1^N/N!$ contiene, via <span class="str" data-str="stirling">approssimazione di Stirling</span> $\log N!\simeq N\log N-N$, il termine $-N\log N$ che combina $N\log V$ in</p>
  $$N\log V-N\log N=N\log\frac{V}{N},$$
  <p>cioè il volume <b>per particella</b>, che è intensivo. Gravina (pag. 42-43) lo dice con Gibbs: le particelle di uno stesso gas sono indistinguibili, e contare come diversi gli stati che differiscono per una permutazione è l&rsquo;errore che $1/N!$ corregge. La giustificazione ultima — perché <i>esattamente</i> $N!$, e non un altro fattore — appartiene alla meccanica quantistica (simmetria della funzione d&rsquo;onda per bosoni e fermioni); qui la si enuncia e la si usa, come fa il corso.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Perché $Z_N=Z_1^N/N!$ non vale per un gas con interazioni fra le particelle?`,
    a:R`Perché la fattorizzazione $e^{-\beta H}=\prod_i e^{-\beta H_1(i)}$ richiede che $H$ sia una <b>somma di termini di singola particella</b>, $H=\sum_i H_1(i)$. Un termine di interazione $\sum_{i\lt j}U(|q_i-q_j|)$ accoppia coordinate di particelle diverse: l&rsquo;esponenziale della somma resta un prodotto, ma i fattori non sono più identici né indipendenti — ciascuno dipende dalle posizioni di più particelle — e l&rsquo;integrale non si spezza in $N$ copie di $Z_1$. <b>La potenza $Z_1^N$ è precisamente l&rsquo;enunciato dell&rsquo;indipendenza statistica</b>, e cade con essa.`},
   {q:R`A che cosa serve l&rsquo;$1/N!$, e perché non è solo estetica?`,
    a:R`Rende l&rsquo;entropia estensiva. Il suo logaritmo, via Stirling, porta un $-N\log N$ che trasforma il $N\log V$ non estensivo nel $N\log(V/N)$ intensivo: senza, mescolando due metà uguali dello stesso gas si otterrebbe $\Delta S=2N\log 2\gt 0$, un aumento di entropia dove non succede nulla — il <b>paradosso di Gibbs</b>. <b>Il criterio invocato è l&rsquo;estensività dell&rsquo;entropia</b>, e l&rsquo;$1/N!$ è la traccia classica dell&rsquo;indistinguibilità quantistica dentro un conto classico.`}
  ]}
]},

/* ---------------- 05 · IL GAS IDEALE SVOLTO PER INTERO ---------------- */
{ num:'05', title:'Il gas ideale monoatomico, svolto per intero', meta:'Z di singola particella con lintegrale gaussiano · la lunghezza donda termica · F, E, S di Sackur-Tetrode, pressione',
  blocchi:[
  {t:'reveal', title:'Dalla singola particella allequazione di stato', tag:'costruzione', steps:[
   {label:'La funzione di partizione di singola particella', body:R`
   <p>Prendiamo il caso archetipico: $N$ particelle identiche non interagenti in un volume $V$, con $H_1=p^2/2m$ (niente potenziale esterno). La funzione di partizione di una particella è</p>
   $$Z_1=\frac{1}{h^3}\int_V d^3q\int d^3p\;e^{-\beta p^2/2m}=\frac{V}{h^3}\left(\int_{-\infty}^{+\infty}e^{-\beta p^2/2m}\,dp\right)^{\!3}.$$
   <p>L&rsquo;integrale spaziale dà semplicemente $V$ (l&rsquo;integrando non dipende da $q$). Quello sugli impulsi è l&rsquo;unico integrale che serve sapere a memoria in meccanica statistica, l&rsquo;<span class="str" data-str="integrale-gaussiano">integrale gaussiano</span>: $\displaystyle\int e^{-\beta p^2/2m}\,dp=\sqrt{2\pi m/\beta}$. Le tre componenti danno la sua terza potenza, $(\sqrt{2\pi m/\beta})^3=(2\pi m/\beta)^{3/2}$, quindi</p>
   $$Z_1=\frac{V}{h^3}\left(\frac{2\pi m}{\beta}\right)^{3/2}=\frac{V}{h^3}(2\pi m k_BT)^{3/2}\equiv\frac{V}{\lambda^3},\qquad \lambda=\frac{h}{\sqrt{2\pi m k_BT}}.$$
   <p>La grandezza $\lambda$ è la <b>lunghezza d&rsquo;onda termica di de Broglie</b> (Falcioni-Vulpiani, e la scheda dell&rsquo;integrale gaussiano): è la scala con cui si misura quando un gas smette di essere classico — finché $\lambda\ll(V/N)^{1/3}$, cioè finché la lunghezza d&rsquo;onda termica è minore della distanza media fra particelle, la descrizione classica regge.</p>`},
   {label:'Energia libera, energia media, pressione', body:R`
   <p>La partizione totale è $Z_N=Z_1^N/N!=\dfrac{1}{N!}\Big(\dfrac{V}{\lambda^3}\Big)^{N}$, e l&rsquo;energia libera segue da $F=-T\log Z_N$. Usando Stirling per $\log N!\simeq N\log N-N$ si ottiene la forma estensiva</p>
   $$F=-NT\left[\log\!\left(\frac{V}{N}\left(\frac{2\pi m}{h^2\beta}\right)^{3/2}\right)+1\right].$$
   <p>L&rsquo;<b>energia media</b> è la derivata del logaritmo: $\log Z_N=N\log V-\tfrac{3N}{2}\log\beta+\text{cost}-\log N!$, e derivando in $\beta$ la sola parte che dipende da $\beta$, $\partial_\beta\log Z=-\dfrac{3N}{2\beta}$, quindi</p>
   $$E=-\frac{\partial\log Z}{\partial\beta}=\frac{3N}{2\beta}=\frac32 NT.$$
   <p>La <b>pressione</b> viene da $P=-\partial F/\partial V$: la sola parte di $F$ che dipende da $V$ è $-NT\log V$, dunque $\dfrac{\partial F}{\partial V}=-\dfrac{NT}{V}$ e $P=-\partial F/\partial V=\dfrac{NT}{V}$, cioè la legge dei gas perfetti</p>
   $$PV=NT\quad(=Nk_BT).$$
   <p>Crisanti (pag. 188-190) svolge esattamente questo conto, e ci arriva prima ancora di introdurre $Z$, direttamente dalla $\Gamma_\beta(E)$ — segno che il risultato non dipende dalla grammatica scelta.</p>`},
   {label:'Lentropia di Sackur-Tetrode', body:R`
   <p>L&rsquo;entropia si legge da $S=-\partial F/\partial T$. Concentriamoci sulla dipendenza da $T$: $F$ contiene $-NT\big[\tfrac32\log T+\text{cost}+1\big]$, e derivando la combinazione $-NT(\tfrac32\log T+1)$ compare il termine chiave, $\dfrac{d}{dT}\big[-NT(\tfrac32\log T+1)\big]=-N\big(\tfrac32\log T+\tfrac52\big)$: il $\tfrac32$ della derivata del logaritmo si somma all&rsquo;$1$ e produce l&rsquo;emblematico $\tfrac52$. Rimettendo le costanti si ottiene l&rsquo;<b>equazione di Sackur-Tetrode</b></p>
   $$S=N\left[\log\!\left(\frac{V}{N}\left(\frac{2\pi m T}{h^2}\right)^{3/2}\right)+\frac52\right].$$
   <p>Il $V/N$ intensivo è l&rsquo;eredità dell&rsquo;$1/N!$ (tappa 04); il $\tfrac52$ è la firma dei tre gradi di libertà quadratici più il termine di normalizzazione. È la stessa entropia che il microcanonico ottiene contando la ipersfera in $3N$ dimensioni: <b>i due ensemble concordano fino all&rsquo;ultima costante</b>, come devono, essendo legati da una trasformata di Legendre.</p>`}
  ]},
  {t:'plot', title:'Z ed F del gas ideale al variare della temperatura',
   intro:R`In ascissa la temperatura $T$ (unità arbitrarie). La funzione di partizione $Z\propto T^{3N/2}$ cresce con $T$ (qui con esponente ridotto per la leggibilità); l'energia libera $F=-T\log Z$ scende, e sempre più ripida, perché a temperatura alta il sistema esplora più stati.`,
   plots:[
    {kind:'func2d', xr:[0.15,2.5], yr:[-3,4], height:320, ticks:6,
     title:'Z(T) crescente e F(T)=-T log Z decrescente',
     curves:[
      {f:'pow(x,3)', col:'#5eead4', label:'Z(T) ~ T^(3N/2): cresce con T'},
      {f:'2-1.6*x', col:'#ff6b6b', label:'F(T)=-T log Z: scende con T (schema)'}
     ],
     xlabel:'T (temperatura)', ylabel:'Z, e andamento di F'}
   ],
   leggi:R`<p><b>La curva verde è $Z(T)$</b>: a temperatura bassa il peso di Boltzmann $e^{-\beta H}$ è concentrato sui pochi stati di energia minima, e $Z$ è piccola; alzando $T$ il peso si allarga su sempre più stati e $Z$ cresce come una potenza di $T$. Il numero di stati «termicamente accessibili» è, in ordine di grandezza, proprio $Z$.</p>
   <p><b>La curva rossa mostra l&rsquo;andamento di $F=-T\log Z$</b> (a meno di scala): scende al crescere di $T$, e con pendenza crescente in modulo, perché $\partial F/\partial T=-S<0$ e l&rsquo;entropia cresce con la temperatura. Il minimo di $F$ è ciò che l&rsquo;equilibrio a $T$ fissata seleziona, esattamente come il massimo di $S$ lo era a $E$ fissata — il segno ribaltato è quello della trasformata di Legendre della tappa 02.</p>
   <p><b>La lettura da portare all&rsquo;orale.</b> Tutta la termodinamica del gas ideale è nascosta in $Z\propto T^{3N/2}V^N$: l&rsquo;esponente $3N/2$ di $T$ dà $E=\tfrac32 NT$ e $C_V=\tfrac32 N$; l&rsquo;esponente $N$ di $V$ dà $PV=NT$. Cambiare la dispersione — un gas relativistico, un oscillatore — cambia solo quegli esponenti, e con essi tutta la termodinamica.</p>`}
]},

/* ---------------- 06 · LA DENSITA DI PROBABILITA: MAXWELL-BOLTZMANN ---------------- */
{ num:'06', title:'La densita di probabilita di singola particella: Maxwell-Boltzmann', meta:'dal canonico alla gaussiana negli impulsi · la normalizzazione · lequipartizione come integrale gaussiano',
  blocchi:[
  {t:'prosa', title:'La distribuzione degli impulsi', tag:'costruzione', html:R`
  <p>La distribuzione canonica non serve solo a calcolare medie globali: dà anche la <b>densità di probabilità</b> di trovare una singola particella in un dato stato. Per un gas ideale, poiché $Z$ fattorizza, la densità di probabilità marginale di una particella con posizione $\mathbf q$ e impulso $\mathbf p$ è il peso di Boltzmann di singola particella, normalizzato:</p>
  $$\rho(\mathbf q,\mathbf p)=\frac{e^{-\beta p^2/2m}}{\displaystyle\int_V d^3q\int d^3p\,e^{-\beta p^2/2m}}=\frac{1}{V}\left(\frac{\beta}{2\pi m}\right)^{3/2}e^{-\beta p^2/2m}.$$
  <p>Falcioni-Vulpiani (par. 3.3) la ricavano in modo istruttivo <i>restando nel microcanonico</i>: la densità esatta di singola particella è $\rho(\mathbf p)\propto(1-p^2/2mE)^{3N/2-5/2}$, valida per $|p|\le\sqrt{2mE}$, e nel limite $N\gg1$ con $E/N$ fissato la potenza altissima diventa un esponenziale, $(1-x/D)^D\to e^{-x}$, riproducendo esattamente la gaussiana canonica. <b>È la stessa concentrazione dei volumi in alta dimensione che, letta sulla singola particella, produce la maxwelliana</b>: il canonico la ottiene in due righe, il microcanonico in venti, ma il risultato è identico. Usando $\beta=1/k_BT$ si riconosce la forma da manuale $\rho(\mathbf p)=(2\pi m k_BT)^{-3/2}e^{-p^2/2mk_BT}$.</p>`},
  {t:'prosa', title:'Normalizzazione ed equipartizione, sui numeri', tag:'costruzione', html:R`
  <p>Che $\rho$ sia normalizzata si controlla componente per componente con l&rsquo;integrale gaussiano: $\displaystyle\int_{\mathbb R^3}\rho(\mathbf p)\,d^3p=1$, poiché ogni fattore $\sqrt{\beta/2\pi m}\,e^{-\beta p^2/2m}$ integra a $1$ (l&rsquo;area sotto una gaussiana normalizzata). E l&rsquo;<b>equipartizione</b> esce dallo stesso integrale, con il peso $p^2$: l&rsquo;energia cinetica media per componente è</p>
  $$\left\langle\frac{p_x^2}{2m}\right\rangle=\int_{-\infty}^{+\infty}\frac{p^2}{2m}\sqrt{\frac{\beta}{2\pi m}}\,e^{-\beta p^2/2m}\,dp=\frac{1}{2\beta}=\frac12 T.$$
  <p>Le tre componenti danno $\langle p^2/2m\rangle=\tfrac32 T$, e le $N$ particelle $E=\tfrac32 NT$: ritroviamo l&rsquo;energia della tappa 05, stavolta come <b>media diretta sulla distribuzione</b> invece che come derivata di $\log Z$. Questa è la lezione da tenere: <b>l&rsquo;equipartizione non è un principio a parte, è questo integrale gaussiano</b> — ogni grado di libertà quadratico nell&rsquo;hamiltoniana contribuisce $\tfrac12 T$ all&rsquo;energia, perché $\int x^2 e^{-a x^2}/\int e^{-ax^2}=1/2a$ e $a=\beta/2m\cdot(\text{coeff})$.</p>`},
  {t:'plot', title:'La maxwelliana degli impulsi a tre temperature',
   intro:R`In ascissa il modulo dell'impulso $p$ (unità arbitrarie). In ordinata la densità di probabilità radiale $\propto p^2 e^{-\beta p^2/2m}$ per tre temperature crescenti. Si osservi come il picco si sposti a destra e la distribuzione si allarghi al crescere di $T$.`,
   plots:[
    {kind:'func2d', xr:[0,4], yr:[0,1.05], height:320, ticks:6,
     title:'distribuzione radiale degli impulsi p^2 e^(-beta p^2/2m)',
     curves:[
      {f:'pow(x,2)*exp(-x*x/0.3)*1.5', col:'#5eead4', label:'T bassa: picco stretto e vicino a zero'},
      {f:'pow(x,2)*exp(-x*x/0.9)*0.55', col:'#d8a13a', label:'T media'},
      {f:'pow(x,2)*exp(-x*x/1.8)*0.28', col:'#ff6b6b', label:'T alta: picco largo e spostato'}
     ],
     xlabel:'p (impulso)', ylabel:'densita radiale (normalizzata)'}
   ],
   leggi:R`<p><b>La forma è il prodotto di due effetti opposti.</b> Il fattore $p^2$ (lo spazio degli impulsi cresce come la superficie di una sfera di raggio $p$) spinge il picco lontano dall&rsquo;origine; il fattore gaussiano $e^{-\beta p^2/2m}$ lo taglia alle energie alte. Il compromesso è il picco della maxwelliana, alla velocità più probabile.</p>
   <p><b>La temperatura è la larghezza.</b> Alzando $T$ (cioè abbassando $\beta$) la gaussiana si allarga: il picco si sposta a destra e la coda si allunga. La varianza della distribuzione degli impulsi è proprio $m k_BT$ per componente, ed è la lettura microscopica di $\langle p_x^2/2m\rangle=\tfrac12 k_BT$ — <b>la temperatura è la dispersione delle velocità</b>, non il loro valor medio (che è nullo, il gas non deriva in alcuna direzione).</p>
   <p><b>Perché conta all&rsquo;orale.</b> Da questa distribuzione si calcolano, con integrali gaussiani, tutte le grandezze cinetiche: velocità media, velocità quadratica media, flusso di particelle su una parete (da cui la pressione cinetica). Averla capita come densità di probabilità canonica, e non come formula da ricordare, è ciò che permette di riderivarla per una dispersione qualsiasi.</p>`}
]},

/* ---------------- 07 · FLUTTUAZIONI E EQUIVALENZA DEGLI ENSEMBLES ---------------- */
{ num:'07', title:'Le fluttuazioni di energia, e perche canonico e microcanonico coincidono', meta:'la varianza T^2 C_V · la fluttuazione relativa che va come uno su radice di N · quando lequivalenza fallisce',
  blocchi:[
  {t:'prosa', title:'Lenergia fluttua, ma quasi niente', tag:'costruzione', html:R`
  <p>Nel canonico l&rsquo;energia non è fissata: fluttua attorno al valor medio $\langle H\rangle$. Quanto? La risposta è nella relazione della tappa 03, $\langle H^2\rangle-\langle H\rangle^2=T^2C_V$. Ciò che conta non è la fluttuazione assoluta ma quella <b>relativa</b>, e per un sistema estensivo, dove $E\propto N$ e $C_V\propto N$, si ha $\sigma_E=\sqrt{T^2C_V}\propto\sqrt N$ mentre $E\propto N$, quindi</p>
  $$\frac{\sigma_E}{E}=\frac{\sqrt{T^2C_V}}{E}\propto\frac{\sqrt N}{N}=\frac{1}{\sqrt N}.$$
  <p>Sui numeri del gas ideale: $C_V=\tfrac32 N$, $E=\tfrac32 NT$, dunque $\sigma_E=T\sqrt{3N/2}$ e</p>
  $$\frac{\sigma_E}{E}=\frac{\sqrt{3N/2}}{3N/2}=\sqrt{\frac{2}{3N}}\sim\frac{1}{\sqrt N}.$$
  <p>Con $N\sim10^{23}$ la fluttuazione relativa dell&rsquo;energia è dell&rsquo;ordine di $10^{-12}$: <b>l&rsquo;energia, benché in linea di principio libera di fluttuare, è di fatto determinata</b>. Il sistema canonico «sceglie» con certezza pratica l&rsquo;energia $\langle H\rangle$, che è la stessa che il microcanonico avrebbe fissato a mano.</p>`},
  {t:'prosa', title:'Perche i due ensemble danno la stessa termodinamica', tag:'regola operativa', html:R`
  <p>Questo chiude il cerchio aperto nella tappa 02. La distribuzione dell&rsquo;energia nel canonico, $P(E)\propto\Omega(E)e^{-\beta E}$, è una gaussiana strettissima centrata su $\langle H\rangle$ con larghezza relativa $1/\sqrt N$: nel limite termodinamico è indistinguibile dalla $\delta(E-\langle H\rangle)$ del microcanonico. Per questo <b>tutte le grandezze termodinamiche calcolate nei due ensemble coincidono</b> — $E$, $S$, $P$, $C_V$ — e si sceglie il canonico non per un motivo fisico ma solo perché è più comodo: niente $\delta$, niente punto di sella, solo derivate di $\log Z$. Crisanti (pag. 197-198) lo verifica esplicitamente calcolando le fluttuazioni <i>dentro</i> il canonico e ritrovando $T^2C_V$, cioè la consistenza dell&rsquo;ensemble con sé stesso.</p>
  <p><b>Dove l&rsquo;equivalenza fallisce</b>, e vale saperlo perché è la frontiera. La gaussiana stretta richiede $C_V\gt 0$ (stabilità) e interazioni a corto raggio, così che l&rsquo;energia sia additiva e $C_V\propto N$. Per sistemi con interazioni a lungo raggio — un plasma gravitazionale, una galassia — l&rsquo;energia non è estensiva, la distribuzione di $E$ può non essere piccata, e possono comparire <b>calori specifici negativi</b> e <b>inequivalenza fra microcanonico e canonico</b>: i due ensemble, che qui danno la stessa risposta, lì rispondono diverso. È la meccanica statistica dei sistemi non additivi, e tocca l&rsquo;astrofisica da vicino.</p>`},
  {t:'plot', title:'La distribuzione dellenergia si stringe come uno su radice di N',
   intro:R`In ascissa l'energia per particella $E/N$ (unità arbitrarie), centrata sul valor medio. In ordinata la densità di probabilità $P(E)$ dell'energia nel canonico, per tre valori di $N$. La larghezza relativa va come $1/\sqrt N$.`,
   plots:[
    {kind:'func2d', xr:[0,2], yr:[0,1.08], height:320, ticks:6,
     title:'distribuzione dellenergia P(E) al crescere di N',
     curves:[
      {f:'exp(-6*pow(x-1,2))', col:'#5eead4', label:'N piccolo: energia larga, fluttua'},
      {f:'exp(-60*pow(x-1,2))', col:'#d8a13a', label:'N medio: si stringe'},
      {f:'exp(-600*pow(x-1,2))', col:'#ff6b6b', label:'N grande: energia quasi certa'}
     ],
     xlabel:'E/N (energia per particella)', ylabel:'P(E) normalizzata'}
   ],
   leggi:R`<p><b>Il centro non si muove, la larghezza sì.</b> Tutte e tre le curve sono centrate sulla stessa energia media per particella: quella è l&rsquo;energia che anche il microcanonico avrebbe fissato. Ciò che cambia con $N$ è quanto stretta è la campana attorno a quel centro.</p>
   <p><b>La curva rossa ($N$ grande) è già quasi una delta.</b> Con $N$ di Avogadro la larghezza relativa $1/\sqrt N\sim10^{-12}$ rende la distribuzione dell&rsquo;energia indistinguibile da un valore secco. È questo il motivo per cui l&rsquo;energia, nel canonico, «non fluttua» in pratica pur essendo libera di farlo — e per cui il canonico, che descrive un sistema a temperatura fissata, dà gli stessi numeri del microcanonico, che descrive un sistema a energia fissata.</p>
   <p><b>La morale, e il suo limite.</b> L&rsquo;equivalenza degli ensemble è la concentrazione delle misure di sempre: un&rsquo;osservabile additiva su $N$ costituenti ha fluttuazioni relative $1/\sqrt N$. Regge finché l&rsquo;energia è additiva e $C_V>0$. Quando cade — interazioni a lungo raggio, transizioni di fase, calori specifici negativi — la campana smette di stringersi, e la scelta dell&rsquo;ensemble torna a essere una scelta fisica, non di comodità.</p>`}
]},

/* ---------------- 08 · LOSCILLATORE: CLASSICO E QUANTISTICO ---------------- */
{ num:'08', title:'Loscillatore armonico: dove Z di un modo e una serie geometrica', meta:'loscillatore classico con due gaussiane · il caso quantistico come somma geometrica · il congelamento dei gradi di liberta',
  blocchi:[
  {t:'prosa', title:'Loscillatore classico', tag:'costruzione', html:R`
  <p>Dopo il gas libero, l&rsquo;altro sistema che l&rsquo;esame chiede è l&rsquo;oscillatore armonico — perché ha un termine potenziale, e mostra come entra nella partizione. Per un oscillatore unidimensionale classico, $H_1=\dfrac{p^2}{2m}+\dfrac12 m\omega^2 q^2$, la funzione di partizione di singolo modo è il prodotto di <b>due</b> integrali gaussiani, uno negli impulsi e uno nelle posizioni:</p>
  $$Z_1=\frac{1}{h}\int dp\,e^{-\beta p^2/2m}\int dq\,e^{-\beta m\omega^2 q^2/2}=\frac{1}{h}\sqrt{\frac{2\pi m}{\beta}}\,\sqrt{\frac{2\pi}{m\omega^2\beta}}=\frac{1}{h}\cdot\frac{2\pi}{\beta\omega}=\frac{1}{\beta\hbar\omega},$$
  <p>avendo usato $\sqrt{2\pi m/\beta}\,\sqrt{2\pi/(m\omega^2\beta)}=\dfrac{2\pi}{\beta\omega}$ e $h=2\pi\hbar$. L&rsquo;energia media di un modo è allora $E_1=-\partial_\beta\log Z_1$; poiché $\log Z_1=-\log(\beta\hbar\omega)$, si ha $\partial_\beta\log Z_1=-\dfrac1\beta$, dunque $E_1=\dfrac1\beta=T$. Ogni oscillatore porta $T$ (due gradi quadratici, $\tfrac12 T$ ciascuno): per $N$ oscillatori $E=NT$ e $C_V=N$, il calore specifico costante del <b>solido classico</b> (legge di Dulong-Petit, $3N$ per un solido tridimensionale). È giusto a temperatura alta e sbagliato a temperatura bassa — e capire perché richiede il caso quantistico.</p>`},
  {t:'reveal', title:'Loscillatore quantistico, e la serie geometrica', tag:'costruzione', steps:[
   {label:'La somma sui livelli discreti', body:R`
   <p>Quantisticamente i livelli dell&rsquo;oscillatore sono discreti, $E_n=\hbar\omega(n+\tfrac12)$ con $n=0,1,2,\dots$, e la funzione di partizione di un modo è una <b>somma</b>, non un integrale:</p>
   $$Z_1=\sum_{n=0}^{\infty}e^{-\beta\hbar\omega(n+1/2)}=e^{-\beta\hbar\omega/2}\sum_{n=0}^{\infty}\left(e^{-\beta\hbar\omega}\right)^{n}.$$
   <p>La somma è una <span class="str" data-str="serie-geometrica">serie geometrica</span> di ragione $q=e^{-\beta\hbar\omega}$, con $|q|\lt 1$ perché $\beta\hbar\omega\gt 0$: vale $\displaystyle\sum_{n\ge0}q^n=\dfrac{1}{1-q}=\dfrac{1}{1-e^{-\beta\hbar\omega}}$. Raccogliendo il fattore di punto zero,</p>
   $$Z_1=\frac{e^{-\beta\hbar\omega/2}}{1-e^{-\beta\hbar\omega}}=\frac{1}{2\sinh(\beta\hbar\omega/2)},$$
   <p>dove l&rsquo;ultima uguaglianza usa $1-e^{-x}=e^{-x/2}(e^{x/2}-e^{-x/2})=2e^{-x/2}\sinh(x/2)$. La partizione di un intero modo, che classicamente era $1/\beta\hbar\omega$, è ora $1/[2\sinh(\beta\hbar\omega/2)]$: le due coincidono ad alta temperatura ($\beta\hbar\omega\ll1$, dove $\sinh x\simeq x$), divergono a bassa.</p>`},
   {label:'Lenergia e il congelamento', body:R`
   <p>L&rsquo;energia di un modo è $E_1=-\partial_\beta\log Z_1$. Con $\log Z_1=-\log[2\sinh(\beta\hbar\omega/2)]$, la derivata dà $\partial_\beta\log Z_1=-\dfrac{\hbar\omega}{2}\dfrac{\cosh(\beta\hbar\omega/2)}{\sinh(\beta\hbar\omega/2)}$, cioè</p>
   $$E_1=\frac{\hbar\omega}{2}\coth\!\frac{\beta\hbar\omega}{2}=\frac{\hbar\omega}{2}+\frac{\hbar\omega}{e^{\beta\hbar\omega}-1},$$
   <p>la formula di Planck: energia di punto zero $\hbar\omega/2$ più il termine di Bose-Einstein. <b>Ad alta temperatura</b> ($T\gg\hbar\omega$) si espande $\coth x\simeq 1/x$ e si ritrova $E_1\simeq T$, il risultato classico. <b>A bassa temperatura</b> ($T\ll\hbar\omega$) il termine di eccitazione è soppresso esponenzialmente, $E_1\to\hbar\omega/2$: il modo è «congelato» nello stato fondamentale, non assorbe energia, e il suo contributo al calore specifico svanisce. È il <b>congelamento dei gradi di libertà</b> — la ragione per cui il calore specifico dei solidi crolla a bassa temperatura contro la costante di Dulong-Petit, e la prima crepa storica nella meccanica statistica classica.</p>`}
  ]},
  {t:'plot', title:'Il calore specifico di un oscillatore: classico contro quantistico',
   intro:R`In ascissa la temperatura $T$ in unità di $\hbar\omega$. In ordinata il calore specifico di un modo. La retta classica vale $1$ a ogni temperatura (Dulong-Petit); la curva quantistica vi tende ad alta $T$ ma crolla a zero a bassa $T$.`,
   plots:[
    {kind:'func2d', xr:[0.2,3], yr:[0,1.15], height:320, ticks:6,
     title:'calore specifico di un modo, classico vs quantistico',
     curves:[
      {f:'0*x+1', col:'#d8a13a', label:'classico: C=1 costante (Dulong-Petit)'},
      {f:'pow(1/x,2)*exp(1/x)/pow(exp(1/x)-1,2)', col:'#ff6b6b', label:'quantistico: crolla a bassa T'}
     ],
     xlabel:'T / (hbar omega)', ylabel:'calore specifico di un modo'}
   ],
   leggi:R`<p><b>La retta ocra è la predizione classica</b>: ogni oscillatore assorbe $T$ di energia e ha calore specifico costante $1$ (in unità di $k_B$), a qualunque temperatura. È il teorema di equipartizione portato alle sue conseguenze — e sperimentalmente falso a bassa temperatura.</p>
   <p><b>La curva rossa è la verità quantistica</b>, la funzione di Einstein $\dfrac{x^2 e^{x}}{(e^{x}-1)^2}$ con $x=\hbar\omega/T$. Ad alta temperatura ($T\gg\hbar\omega$, destra del grafico) $\to 1$ e recupera il classico; a bassa temperatura crolla esponenzialmente a zero, perché i quanti $\hbar\omega$ diventano troppo grandi per essere eccitati termicamente. <b>Il modo si congela</b>.</p>
   <p><b>Il senso profondo.</b> La discretizzazione dei livelli, entrata nel conto solo attraverso una somma al posto di un integrale — una serie geometrica invece di due gaussiane — cambia qualitativamente la termodinamica a bassa temperatura. È lo stesso meccanismo che spegne i gradi di libertà vibrazionali e rotazionali delle molecole, e che salva il terzo principio: $C_V\to0$ per $T\to0$, impossibile nel mondo classico.</p>`}
]},

/* ---------------- 09 · ESERCIZI ---------------- */
{ num:'09', title:'Esercizi — tocca a te', meta:'il gas ultrarelativistico nel canonico · il sistema a due livelli e lanomalia di Schottky · il solido di Einstein',
  blocchi:[
  {t:'esercizio', title:'1 · Il gas ultrarelativistico nel canonico',
   src:'la forma tipica della domanda dorale: cambiare la dispersione e rifare Z, F, E, P',
   testo:R`Considera $N$ particelle identiche non interagenti con dispersione ultrarelativistica $H=\sum_i c|\vec p_i|$ in un volume $V$. Calcola la funzione di partizione $Z(\beta,V,N)$ con il conteggio corretto, l'energia media $E$, il calore specifico $C_V$ e la pressione. Confronta con il gas monoatomico.`,
   steps:[
    {label:'La partizione di singola particella', body:R`
    <p>Nel canonico non c&rsquo;è vincolo di energia: la partizione di singola particella è un integrale libero. In coordinate sferiche negli impulsi,</p>
    $$Z_1=\frac{V}{h^3}\int d^3p\,e^{-\beta c|\vec p|}=\frac{V}{h^3}\,4\pi\int_0^\infty p^2 e^{-\beta c p}\,dp=\frac{V}{h^3}\,4\pi\cdot\frac{2}{(\beta c)^3}=\frac{8\pi V}{h^3(\beta c)^3},$$
    <p>dove l&rsquo;integrale radiale $\displaystyle\int_0^\infty p^2 e^{-\beta c p}\,dp=\dfrac{2}{(\beta c)^3}$ si ottiene derivando due volte $\int_0^\infty e^{-\beta c p}dp=1/(\beta c)$ rispetto al parametro, oppure riconoscendo $\Gamma(3)/(\beta c)^3=2/(\beta c)^3$. La partizione totale è $Z_N=\dfrac{1}{N!}\Big(\dfrac{8\pi V}{h^3 c^3}\Big)^{N}\beta^{-3N}$.</p>`},
    {label:'Energia, calore specifico, pressione', body:R`
    <p>Il logaritmo è $\log Z_N=N\log\big(8\pi V/h^3c^3\big)-3N\log\beta-\log N!$, e l&rsquo;energia media è la derivata: $\partial_\beta\log Z=-\dfrac{3N}{\beta}$, quindi</p>
    $$E=-\frac{\partial\log Z}{\partial\beta}=\frac{3N}{\beta}=3NT.$$
    <p>Il calore specifico è $C_V=\dfrac{\partial E}{\partial T}=3N$, <b>il doppio</b> del gas monoatomico ($\tfrac32 N$): la dispersione lineare $H=c|p|$ paga tre gradi «pieni» invece di tre «mezzi», perché con $\varepsilon\propto p^\alpha$ in $d$ dimensioni l&rsquo;energia per particella è $(d/\alpha)T$, e $\alpha=1$, $d=3$ dà $3T$. La pressione viene, come sempre, dalla parte di $F=-T\log Z$ che dipende dal volume, $-NT\log V$: $\dfrac{\partial F}{\partial V}=-\dfrac{NT}{V}$ dà $P=NT/V$, cioè <b>$PV=NT$ identica</b> al monoatomico. L&rsquo;equazione di stato è geometrica (dipende solo dal fatto che il gas riempie $V$ senza interagire); l&rsquo;energia interna è dinamica (dipende dalla dispersione). Crisanti tratta questo esercizio esattamente così (pag. 204), ed è la seconda metà della domanda d&rsquo;orale sul gas relativistico: prima nel microcanonico con la sella, poi nel canonico con una derivata di $\log\beta$.</p>`}
   ]},
  {t:'esercizio', title:'2 · Il sistema a due livelli e lanomalia di Schottky',
   src:'lesercizio discreto: Z e una somma finita, e il calore specifico ha un picco',
   testo:R`$N$ particelle indipendenti e distinguibili (per esempio spin fissi su un reticolo) hanno ciascuna due livelli di energia $-\varepsilon$ e $+\varepsilon$ in un campo. Calcola la funzione di partizione, l'energia media, e discuti l'andamento del calore specifico a bassa e alta temperatura.`,
   steps:[
    {label:'La partizione e lenergia', body:R`
    <p>Per particelle distinguibili su siti fissi <b>non</b> c&rsquo;è l&rsquo;$1/N!$ (non sono scambiabili: ogni sito è etichettato), quindi $Z_N=Z_1^N$ con la partizione di singolo spin una somma di due termini:</p>
    $$Z_1=e^{\beta\varepsilon}+e^{-\beta\varepsilon}=2\cosh(\beta\varepsilon).$$
    <p>L&rsquo;energia media di uno spin è $\langle E\rangle_1=-\partial_\beta\log Z_1=-\varepsilon\dfrac{\sinh(\beta\varepsilon)}{\cosh(\beta\varepsilon)}=-\varepsilon\tanh(\beta\varepsilon)$, e per $N$ spin $E=-N\varepsilon\tanh(\beta\varepsilon)$. A temperatura alta ($\beta\varepsilon\ll1$) $\tanh\to0$ ed $E\to0$: i due livelli sono equipopolati. A temperatura bassa ($\beta\varepsilon\gg1$) $\tanh\to1$ ed $E\to-N\varepsilon$: tutti nello stato fondamentale.</p>`},
    {label:'Il calore specifico e il picco di Schottky', body:R`
    <p>Il calore specifico $C_V=\partial E/\partial T$ ha un comportamento che distingue i sistemi a spettro <b>limitato</b> da quelli a spettro illimitato: $C_V=N\dfrac{(\beta\varepsilon)^2}{\cosh^2(\beta\varepsilon)}$, che <b>va a zero in entrambi i limiti</b> — ad alta $T$ perché i livelli sono saturi, a bassa $T$ perché il gap $2\varepsilon$ congela le eccitazioni — e ha un massimo a temperatura intermedia, $T\sim\varepsilon$. Questo picco è l&rsquo;<b>anomalia di Schottky</b>, ed è la firma termodinamica di un sistema a pochi livelli: nessun grado di libertà continuo darebbe un $C_V$ che prima cresce e poi cala. Il criterio da riconoscere all&rsquo;orale è che uno spettro <b>limitato superiormente</b> produce sempre un $C_V$ con un massimo, mai la costante di equipartizione.</p>`}
   ]},
  {t:'esercizio', title:'3 · Il solido di Einstein',
   src:'mettere insieme oscillatore quantistico e limite classico su un sistema a 3N modi',
   testo:R`Un solido di $N$ atomi è modellato da $3N$ oscillatori armonici quantistici indipendenti di frequenza $\omega$ (modello di Einstein). Scrivi $Z$, l'energia media e il calore specifico. Verifica che ad alta temperatura si recupera Dulong-Petit $C_V=3N$, e discuti il limite di bassa temperatura.`,
   steps:[
    {label:'Partizione ed energia', body:R`
    <p>I $3N$ modi sono indipendenti, quindi $Z=Z_1^{3N}$ con $Z_1=1/[2\sinh(\beta\hbar\omega/2)]$ la partizione di singolo oscillatore quantistico. L&rsquo;energia media è $3N$ volte quella di un modo:</p>
    $$E=3N\left[\frac{\hbar\omega}{2}+\frac{\hbar\omega}{e^{\beta\hbar\omega}-1}\right].$$
    <p>Il calore specifico è $C_V=\partial E/\partial T=3N\,\dfrac{x^2 e^{x}}{(e^{x}-1)^2}$ con $x=\beta\hbar\omega=\hbar\omega/T$: la funzione di Einstein moltiplicata per $3N$.</p>`},
    {label:'I due limiti', body:R`
    <p><b>Alta temperatura</b> ($x\to0$): la funzione di Einstein $\dfrac{x^2 e^{x}}{(e^{x}-1)^2}\to 1$ (si sviluppa $e^x-1\simeq x+x^2/2$ e si verifica il limite), quindi $C_V\to 3N$: si recupera la <b>legge di Dulong-Petit</b>, il valore classico di equipartizione per $3N$ oscillatori. <b>Bassa temperatura</b> ($x\to\infty$): la funzione va come $x^2 e^{-x}\to0$ esponenzialmente, quindi $C_V\to0$ — i modi si congelano, in accordo con il terzo principio. Il modello di Einstein coglie il crollo ma sbaglia la sua <i>forma</i> (l&rsquo;esperimento dà $C_V\propto T^3$, non esponenziale): la correzione è il modello di Debye, che sostituisce l&rsquo;unica frequenza $\omega$ con uno spettro di modi acustici. <b>Il criterio invocato è il limite classico della statistica quantistica</b>: quando $k_BT\gg\hbar\omega$ la spaziatura dei livelli è irrilevante e la somma torna un integrale, restituendo l&rsquo;equipartizione.</p>`}
   ]}
]},

/* ---------------- 10 · IL SENSO E LE ROTTE ---------------- */
{ num:'10', title:'Il senso, e le rotte', meta:'cosa lascia in mano, e dove il fattore di Boltzmann diventa fisica',
  blocchi:[
  {t:'prosa', title:'Cosa portarsi via', tag:'sintesi', html:R`
  <p><b>Il punto.</b> Il canonico è il baratto che rende calcolabile la meccanica statistica: si rinuncia a fissare l&rsquo;energia, la si lascia fluttuare attorno al valor medio, e in cambio il vincolo $\delta(H-E)$ del microcanonico diventa il peso liscio $e^{-\beta H}$. Il fattore di Boltzmann non è un postulato: si <b>deriva</b> marginalizzando il microcanonico di un sistema affacciato a un bagno termico, e $\beta=1/T$ è la temperatura del bagno. Da lì tutto discende da un solo oggetto, la funzione di partizione $Z=\sum_s e^{-\beta H}$, e dalla relazione $F=-T\log Z$, che è la trasformata di Legendre che scambia energia e temperatura.</p>
  <p><b>Che cosa ricordare, in ordine di durata.</b> Il gesto operativo che risolve gli scritti — $Z_N=Z_1^{\,N}/N!$, «scrivi la partizione di una particella ed elevala alla $N$» — e la ragione per cui vale solo senza interazioni. La catena $Z\to F\to$ tutto: $E=-\partial_\beta\log Z$, $S=-\partial_T F$, $P=-\partial_V F$, e la relazione fluttuazione-risposta $\langle H^2\rangle-\langle H\rangle^2=T^2C_V$. Il gas ideale svolto fino a Sackur-Tetrode e $PV=NT$, che si rifà in cinque minuti ricordando l&rsquo;integrale gaussiano e la lunghezza d&rsquo;onda termica $\lambda=h/\sqrt{2\pi mk_BT}$. Che l&rsquo;equipartizione è solo un integrale gaussiano col peso $p^2$. E che canonico e microcanonico danno la stessa termodinamica perché la distribuzione dell&rsquo;energia ha larghezza relativa $1/\sqrt N$ — un&rsquo;equivalenza che si rompe solo per interazioni a lungo raggio. <b>Di un movimento lungo, ciò che resta è: fissa la temperatura, scrivi $Z$, e deriva.</b></p>`},
  {t:'prolessi', title:'Dove riappare questo movimento',
   oggetto:R`<b>Il fattore di Boltzmann e la funzione di partizione</b>: pesare gli stati con $e^{-\beta H}$ e leggere la termodinamica dalle derivate di $\log Z$.`,
   rotte:[
    {dove:'Ensemble<br>gran canonico', txt:R`Aprendo anche lo scambio di <b>particelle</b> con il bagno, oltre a quello di energia, si marginalizza una volta di più e compare un secondo peso $e^{\beta\mu N}$: la <b>gran funzione di partizione</b> $\mathcal Z=\sum_N e^{\beta\mu N}Z_N$, con il potenziale chimico $\mu$ come terzo moltiplicatore accanto a $\beta$. È il passo che serve quando il numero di particelle non è fissato — l&rsquo;adsorbimento, le reazioni, i gas quantistici.`},
    {dove:'Statistiche<br>quantistiche', txt:R`Per particelle identiche indistinguibili la fattorizzazione $Z_1^N/N!$ è solo il limite classico. Sommando correttamente sugli stati simmetrici (bosoni) o antisimmetrici (fermioni) la partizione diventa quella di <b>Bose-Einstein</b> e <b>Fermi-Dirac</b>, e la serie geometrica dell&rsquo;oscillatore diventa la statistica dei modi di un campo: fotoni, fononi, il corpo nero di Planck.`},
    {dove:'Meccanica statistica<br>dei sistemi disordinati', txt:R`Quando $H$ contiene accoppiamenti casuali — un vetro di spin — la funzione di partizione $Z$ diventa essa stessa una variabile aleatoria, e ciò che conta è $\overline{\log Z}$, la media dell&rsquo;energia libera sul disordine. Calcolarla è il <b>metodo delle repliche</b>, e apre la fisica dei sistemi complessi: ottimizzazione, reti neurali, la rottura di ergodicità.`},
    {dove:'Teoria dei<br>campi e path integral', txt:R`La partizione canonica $Z=\int\mathcal D[\phi]\,e^{-\beta H[\phi]}$ per un campo è formalmente identica all&rsquo;integrale sui cammini di Feynman in tempo immaginario $\tau=\beta$: la temperatura inversa <i>è</i> un tempo euclideo. È il ponte che unifica meccanica statistica e teoria quantistica dei campi, e su cui poggiano il gruppo di rinormalizzazione e la teoria dei fenomeni critici.`}
   ],
   domanda:R`La funzione di partizione canonica $Z=\sum_s e^{-\beta H}$ è definita per un sistema a <b>temperatura</b> fissata, e la sua equivalenza col microcanonico poggia sul fatto che la distribuzione dell&rsquo;energia si stringe come $1/\sqrt N$. <b>Domanda che porti avanti:</b> vicino a una <b>transizione di fase</b> le fluttuazioni non si stringono più — la lunghezza di correlazione diverge, il calore specifico $C_V$ può divergere, e con esso la varianza dell&rsquo;energia $T^2C_V$. Lì la campana di P(E) non è più una gaussiana stretta, e i cumulanti di $\log Z$ sviluppano singolarità: sono le <b>singolarità dell&rsquo;energia libera</b> che classificano le transizioni. Il canonico, così comodo lontano dalle transizioni, è proprio lo strumento con cui si studiano — e la domanda «di che ordine è la singolarità di $F(T)$?» è l&rsquo;inizio della teoria dei fenomeni critici.`}
]}

];

function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}

  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';

}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
    else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
    else if(b.t==='prolessi') m.appendChild(sectionProlessi(b));
    else if(b.t==='reveal')m.appendChild(sectionReveal(b.title,b.tag,b.steps));
    else if(b.t==='esercizio') m.appendChild(sectionEsercizio(b));
    else if(b.t==='collaudo')  m.appendChild(sectionCollaudo(b.title,b.items));
    else if(b.t==='plot')      m.appendChild(sectionPlot(b));
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}

/* deep-link: ms-06-canonico.html#03 apre direttamente la tappa 03 */
window.addEventListener('DOMContentLoaded', function(){
  var h=(location.hash||'').replace('#','');
  showTappa(byId[h]?h:'00');
});
window.addEventListener('hashchange', function(){
  var h=(location.hash||'').replace('#','');
  if(byId[h]) showTappa(h);
});
</script>
