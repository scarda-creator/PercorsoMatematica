/* ===================================================================

var CORSO = 'geometria-differenziale';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["esaustione-per-compatti"] = {"nome":"Esaustione per compatti","riga":"Un'esaustione per compatti di uno spazio $M$ è una successione di compatti $K_1\\subset K_2\\subset\\cdots$ con $K_i\\subset\\mathrm{Int}\\,K_{i+1}$ e $\\bigcup_i K_i=M$, che ogni spazio localmente compatto di Hausdorff a base numerabile — ogni varietà — possiede.","serve":"a promuovere una costruzione «un compatto alla volta» a una costruzione su tutta una varietà non compatta. La Proposizione 2.7.2 dà una funzione liscia che vale $1$ su un compatto e $0$ fuori da un suo intorno, ma un singolo compatto non copre $M$ se $M$ non è compatta; l'esaustione fornisce i gusci $K_{i+1}\\setminus\\mathrm{Int}\\,K_i$, ciascuno compatto, su cui si costruisce un bernoccolo alla volta. La conseguenza operativa è che la somma di questi bernoccoli è localmente finita — ogni punto sta in un numero finito di gusci vicini, non perché lo spazio sia compatto ma perché la condizione $K_i\\subset\\mathrm{Int}\\,K_{i+1}$ confina ogni punto fra due indici — e dunque liscia: normalizzandola si ottiene una partizione dell'unità numerabile su tutta $M$. È anche il modo rigoroso di definire un integrale su uno spazio non compatto, come limite di integrali sui $K_i$.","esempio":"Su $\\mathbb{R}$ l'esaustione più semplice è $K_i=[-i,i]$. È davvero un'esaustione: $K_i\\subset\\mathrm{Int}\\,K_{i+1}=(-(i+1),i+1)$ perché $i\\lt i+1$ (per $i=3$, $3\\lt4$), e $\\bigcup_i K_i=\\mathbb{R}$ perché ogni $x$ finisce dentro $K_i$ appena $i\\ge|x|$. Un punto concreto: $x=3{,}4$ non sta in $K_3=[-3,3]$, dato che $3{,}4\\gt3$, ma sta in $K_4=[-4,4]$, dato che $3{,}4\\le4$; il più piccolo indice che lo contiene è $4=\\lceil3{,}4\\rceil$. Il guscio $K_4\\setminus\\mathrm{Int}\\,K_3=\\{3\\le|x|\\le4\\}$ che lo contiene è compatto per Heine-Borel, e $3\\le3{,}4\\le4$ lo conferma: è su un guscio come questo, uno per indice, che si costruisce un bernoccolo alla volta prima di sommarli.","pieno":{"file":"tp-07-compattezza.html","tappa":"06","come":"la Proposizione A.60 di Lee dimostrata per induzione, i gusci compatti e gli aperti che li contengono, e perche' due gusci lontani non si toccano"},"controllo":[{"tipo":"disuguaglianza","sinistra":"3","relazione":"<","destra":"4","dove":"esempio","appare":"3\\lt4"},{"tipo":"disuguaglianza","sinistra":"3","relazione":"<","destra":"17/5","dove":"esempio","appare":"3{,}4\\gt3"},{"tipo":"disuguaglianza","sinistra":"17/5","relazione":"<","destra":"4","dove":"esempio","appare":"3{,}4\\le4"},{"tipo":"uguale","sinistra":"ceiling(17/5)","vale":"4","dove":"esempio","appare":"4=\\lceil3{,}4\\rceil"}]};
STRUM["funzione-bump"] = {"nome":"Funzione a bernoccolo","riga":"La funzione a bernoccolo $\\lambda(t)$, nulla per $t\\le0$ ed uguale a $e^{-1/t^2}$ per $t\\gt0$, è liscia su tutto $\\mathbb{R}$ con tutte le derivate nulle in $0$ ma non identicamente nulla a destra, dunque $C^\\infty$ e non analitica.","serve":"a fabbricare funzioni lisce a supporto compatto, cioè identicamente nulle fuori da una regione limitata e non nulle dentro — un oggetto che nessuna funzione analitica non banale può essere, per il principio di identità (una serie di potenze nulla su un aperto è nulla ovunque). È questa la ragione tecnica per cui $C^\\infty$ è una categoria strettamente più grande dell'analitico, e la conseguenza operativa è tutto ciò che ne segue: incollando due bernoccoli si ottiene un gradino liscio che passa da $0$ a $1$ in un intervallo prescritto, da cui si costruisce una funzione che vale $1$ su un compatto e $0$ fuori da un suo intorno, da cui le partizioni dell'unità. Senza una funzione liscia che si annulla su un aperto senza annullarsi ovunque, nessuno di questi incollamenti preserverebbe la regolarità.","esempio":"Si valuti $\\lambda$ in due punti. Per $t=-1\\le0$ si ha $\\lambda(-1)=0$ per definizione; per $t=1\\gt0$ si ha $\\lambda(1)=e^{-1/1^2}=e^{-1}=1/e\\approx0{,}3679$, dunque la funzione è genuinamente non nulla a destra. Eppure in $0$ è liscia con tutte le derivate nulle: per $t\\gt0$ la derivata è $\\lambda'(t)=\\tfrac{2}{t^3}e^{-1/t^2}$, e il limite $\\lim_{t\\to0^+}e^{-1/t^2}=0$ perché l'esponenziale batte ogni potenza di $1/t$. Se $\\lambda$ fosse analitica in $0$, avendo serie di Taylor identicamente nulla sarebbe nulla in tutto un intorno — ma $\\lambda(1)=1/e\\neq0$: è $C^\\infty$ e non analitica, ed è esattamente questo scarto a renderla utile.","pieno":{"file":"gd-05-partizioni-unita.html","tappa":"01","come":"la costruzione di e^{-1/t}, perche' tutte le sue derivate si annullano in 0, il gradino e il bump su R^n"},"controllo":[{"tipo":"uguale","sinistra":"exp(-1/1**2)","vale":"exp(-1)","dove":"esempio","appare":"\\lambda(1)=e^{-1/1^2}=e^{-1}=1/e"},{"tipo":"numero","espr":"exp(-1)","vale":"0.3679","dove":"esempio","appare":"1/e\\approx0{,}3679"},{"tipo":"derivata","espr":"exp(-1/t**2)","rispetto":["t"],"vale":"2/t**3*exp(-1/t**2)","dove":"esempio","appare":"\\lambda'(t)=\\tfrac{2}{t^3}e^{-1/t^2}"},{"tipo":"limite","espr":"exp(-1/t**2)","var":"t","a":"0","verso":"+","vale":"0","dove":"esempio","appare":"\\lim_{t\\to0^+}e^{-1/t^2}=0"}]};
STRUM["orientabilita"] = {"nome":"Orientabilità","riga":"Una varietà è orientabile se ammette un atlante in cui tutte le funzioni di transizione hanno jacobiano a determinante positivo; scegliere un tale atlante è orientarla.","serve":"Dice se ha senso, su tutta la varietà, distinguere un verso di rotazione o un lato. Per una superficie in $\\mathbb{R}^3$ equivale a scegliere con continuità un versore normale, che è la nozione di Analisi Vettoriale dietro i flussi e il teorema di Stokes. Le superfici compatte senza bordo dentro $\\mathbb{R}^3$ sono sempre orientabili, ed è per questo che il piano proiettivo, che non lo è, in $\\mathbb{R}^3$ non entra senza intersecarsi.","esempio":"Il nastro di Möbius non è orientabile: percorrendo l&rsquo;anima centrale il versore normale torna al punto di partenza rovesciato, e nessuna scelta continua lo evita. In termini di carte, ogni atlante ha almeno una transizione con jacobiano negativo, come la riflessione $(x,y)\\mapsto(x,-y)$, il cui jacobiano ha determinante $-1$: è il «rovesciamento» del normale scritto in coordinate. La sfera e il toro sono orientabili; il piano proiettivo $\\mathbb{RP}^2$ no, perché contiene un nastro di Möbius.","debito":"nel corso di Geometria Differenziale l&rsquo;orientazione è citata e usata, non costruita: le forme di volume e il teorema di Stokes su varietà, dove servirebbe davvero, stanno oltre il programma. Il caso concreto delle superfici in $\\mathbb{R}^3$ è in Analisi Vettoriale, al flusso.","controllo":[{"tipo":"uguale","sinistra":"Matrix([[1,0],[0,-1]]).det()","vale":"-1","dove":"esempio","appare":"determinante $-1$","nota":"jacobiano della riflessione (x,y) -> (x,-y)"}]};
STRUM["compattezza"] = {"nome":"Compattezza","riga":"Ogni ricoprimento aperto ammette un sottoricoprimento finito: è la proprietà che permette di passare da «vale vicino a ogni punto» a «vale su tutto», con un numero finito di passi.","serve":"È l'ipotesi che rende globali le conclusioni locali, ed è per questo che ricorre in ogni dimostrazione di geometria differenziale. In $\\mathbb{R}^n$ equivale a chiuso e limitato (Heine-Borel), ma su una varietà quell'equivalenza non si può usare come definizione, perché «limitato» richiede una distanza e una varietà non ne ha una privilegiata. La conseguenza che si usa più spesso è negativa: gli unici sottoinsiemi di $\\mathbb{R}^n$ che sono **insieme** aperti e compatti sono $\\emptyset$ e nient'altro — ed è l'argomento per cui una varietà compatta non può essere coperta da una sola carta.","esempio":"L'intervallo $(0,1)$ non è compatto, e si vede esibendo un ricoprimento senza sottoricoprimento finito: gli aperti $A_n=\\left(\\tfrac1n,1\\right)$ per $n\\ge2$ ricoprono $(0,1)$, perché ogni $x\\gt0$ sta in $A_n$ appena $\\tfrac1n\\lt x$, cioè appena $n\\gt1/x$. Ma una sottofamiglia finita $A_{n_1},\\dots,A_{n_k}$ ha un indice massimo $N$, quindi la sua unione è $\\left(\\tfrac1N,1\\right)$, e il punto $x=\\tfrac1{2N}$ resta fuori: è positivo, dunque sta in $(0,1)$, ed è minore di $\\tfrac1N$. Il conto che regge l'argomento è $\\lim_{n\\to\\infty}\\tfrac1n=0$: gli $A_n$ si avvicinano a coprire tutto, ma nessuno di essi contiene un intorno di $0$, e servirebbero tutti. Chiudendo l'intervallo, $[0,1]$ diventa compatto e quel ricoprimento smette di essere un ricoprimento — $0$ non sta in nessun $A_n$.","debito":"la dimostrazione del teorema di Heine-Borel e la teoria generale degli spazi compatti stanno fuori dal percorso: qui c'è l'uso che se ne fa. Nel corso di Diverio la compattezza entra come ipotesi (sfera, gruppi di Lie compatti) e come conclusione della locale compattezza delle varietà.","controllo":[{"tipo":"limite","espr STRUM["omeomorfismo"] = {"nome":"Omeomorfismo","riga":"Una biiezione continua con inversa continua: due spazi omeomorfi sono lo stesso spazio scritto in due modi, per tutto ciò che la topologia sa vedere.","serve":"È la nozione di «uguale» che si usa quando si dice che una varietà è localmente come $\\mathbb{R}^n$. La richiesta che anche l'inversa sia continua non è pignoleria: senza di essa una biiezione continua può incollare cose lontane — l'applicazione $t\\mapsto(\\cos 2\\pi t,\\sin 2\\pi t)$ da $[0,1)$ alla circonferenza è continua e biunivoca, ma la sua inversa spezza la circonferenza in un punto, e infatti $[0,1)$ e $S^1$ non sono lo stesso spazio (uno è compatto, l'altro no). Le proprietà che si conservano per omeomorfismo — compattezza, connessione, dimensione, gruppo fondamentale — sono esattamente quelle di cui si può parlare su una varietà senza aver scelto una carta.","esempio":"L'intervallo aperto $(0,1)$ e la semiretta $(0,+\\infty)$ sono omeomorfi tramite $f(x)=\\dfrac{x}{1-x}$: è continua su $(0,1)$, manda $0^+$ in $0^+$ e $1^-$ in $+\\infty$, e la sua inversa è $g(y)=\\dfrac{y}{1+y}$, anch'essa continua. Che siano davvero una l'inversa dell'altra si verifica componendo: $g(f(x))=\\dfrac{x/(1-x)}{1+x/(1-x)}=x$. Ne segue che $(0,1)$ è omeomorfo anche a tutto $\\mathbb{R}$ (componendo con $y\\mapsto\\ln y$), il che dice una cosa che all'inizio sorprende: **la lunghezza non è una proprietà topologica**. Non lo è nemmeno l'essere limitato; lo è invece la compattezza, ed è per questo che $[0,1]$ non è omeomorfo a nessuno dei due.","debito":"nessun movimento del percorso tratta la topologia generale come argomento a sé: qui c'è ciò che serve per leggere la definizione di varietà. La classificazione di quali spazi sono omeomorfi a quali è il mestiere della topologia algebrica, e nel corso di Diverio entra solo per la numerabilità del gruppo fondamentale.","controllo":[{"tipo":"uguale","sinistra":"(x/(1-x))/(1+x/(1-x))","vale":"x","ipotesi":{"x":"positive"},"dove":"esempio","appare":"=x"}]};
STRUM["omotopia"] = {"nome":"Omotopia","riga":"Due applicazioni continue $F,G:X\\to Y$ sono omotope se esiste $H:X\\times[0,1]\\to Y$ continua con $H(\\cdot,0)=F$ e $H(\\cdot,1)=G$: una deformazione continua dell'una nell'altra.","serve":"E' la nozione che rende precisa l'idea di deformare con continuita' senza strappare, ed e' la relazione di equivalenza su cui si costruisce la topologia algebrica: il gruppo fondamentale e' fatto di cammini chiusi presi a meno di omotopia, e senza quel quoziente non ci sarebbe nessun gruppo ma solo un insieme enorme di cammini. Nel percorso serve per leggere due cose: gli enunciati che citano $\\pi_1$, e la nozione di spazio semplicemente connesso, che e' connesso per archi e con ogni cammino chiuso omotopo a una costante.","esempio":"Nel piano bucato $\\mathbb{R}^2\\setminus\\{0\\}$ si considerino il cammino che gira una volta attorno all'origine, $\\gamma(t)=(\\cos 2\\pi t,\\ \\sin 2\\pi t)$, e il cammino costante nel punto $(1,0)$. Non sono omotopi, e la ragione e' che la deformazione dovrebbe far passare la curva per l'origine, che e' stata tolta. Nel piano intero invece lo sono, con $H(t,s)=\\big((1-s)\\cos 2\\pi t+s,\\ (1-s)\\sin 2\\pi t\\big)$: per $s=0$ si ottiene $(\\cos 2\\pi t,\\ \\sin 2\\pi t)$, cioe' il cerchio, e per $s=1$ si ottiene $(1,\\ 0)$, cioe' il punto. Il buco e' tutta la differenza, ed e' per questo che l'omotopia vede i buchi mentre la continuita' da sola no.","controllo":[{"tipo":"uguale","sinistra":"Matrix([[(1-0)*cos(2*pi*t)+0], [(1-0)*sin(2*pi*t)]])","vale":"Matrix([[cos(2*pi*t)], [sin(2*pi*t)]])","ipotesi":{"t":"real"},"dove":"esempio","appare":"per $s=0$ si ottiene $(\\cos 2\\pi t,\\ \\sin 2\\pi t)$"},{"tipo":"uguale","sinistra":"Matrix([[(1-1)*cos(2*pi*t)+1], [(1-1)*sin(2*pi*t)]])","vale":"Matrix([[1], [0]])","ipotesi":{"t":"real"},"dove":"esempio","appare":"per $s=1$ si ottiene $(1,\\ 0)$"},{"tipo":"simbolico","dove":"riga","appare":"H(\\cdot,0)=F","perche":"definizione o notazione introdotta, non un conto"},{"tipo":"simbolico","dove":"riga","appare":"H(\\cdot,1)=G","perche":"definizione o notazione introdotta, non un conto"}],"pieno":{"file":"tp-14-gruppo-fondamentale.html","tappa":"01","come":"le definizioni di Lee per mappe e per cammini a estremi fissi, la relazione di equivalenza dimostrata, l'omotopia lineare nei convessi e negli stellati"}};

function schedaHTML(s){

  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';

}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

  {t:'prosa', title:'La domanda lasciata aperta', tag:'architettura', html:R`
  <p>La <b>figura a otto</b> è un&rsquo;immersione iniettiva la cui immagine <i>non</i> è una sottovarietà. Il differenziale era perfetto — iniettivo ovunque — e il problema era topologico: la curva si richiudeva su se stessa, e l&rsquo;immagine finiva per ereditare una topologia più fine di quella giusta. <b>Non basta che la mappa sia localmente un diffeomorfismo</b>: serve anche che non ci siano quasi-autointersezioni nel limite, punti dell&rsquo;immagine che si avvicinano fra loro restando lontani nel dominio — esattamente ciò che succede ai due capi della figura a otto che si richiudono sull&rsquo;origine.</p>
  <p>Questo movimento risolve quel problema identificando <b>la condizione che mancava</b> — la <b>proprietà di essere propria</b>, cioè che le preimmagini di compatti siano compatte — e poi usa la stessa nozione per il teorema che chiude il primo blocco del corso: <b>Whitney</b>, ogni varietà astratta si può immergere (anzi incassare) in uno spazio euclideo di dimensione finita, e il numero di dimensioni necessarie si stima esplicitamente a partire dalla dimensione della varietà, senza bisogno di conoscerla in anticipo. Cioè: l&rsquo;approccio senza ambiente, che definiva una varietà senza supporla dentro nessuno spazio, non era più generale — era solo <b>più onesto</b>. Un ambiente esiste sempre, per ogni varietà che si incontri nella pratica; sceglierlo in anticipo è solo un&rsquo;arbitrarietà che la definizione intrinseca evita, non un guadagno di generalità.</p>`}

  {t:'prosa', title:'La definizione, e il teorema', tag:'grammatica', html:R`
  <p>$F:M\to N$ è <b>propria</b> se la controimmagine $F^{-1}(K)$ di ogni compatto è compatta. In parole: <b>non si può «scappare all&rsquo;infinito» restando in una regione limitata dell&rsquo;arrivo</b>.</p>
  <p>«Scappare all&rsquo;infinito» ha un significato preciso, ed è un ordine di quantificatori. Una successione $(p_k)$ in $M$ <b>esce dai compatti</b> se
  $$\forall K\subseteq M\ \text{compatto}\ \ \exists k_0\ \ \forall k\ge k_0\ \ \ p_k\notin K ,$$
  e per mappe continue fra varietà la proprietà si legge sulle successioni:
  $$F\ \text{propria}\iff\forall(p_k)\subseteq M\ :\ \big((p_k)\ \text{esce dai compatti di }M\ \Rightarrow\ (F(p_k))\ \text{esce dai compatti di }N\big).$$
  <b>Il $k_0$ viene dopo $K$, e non può venire prima</b>: «$\exists k_0\ \forall K$» chiederebbe un indice oltre il quale la successione sta fuori da <i>ogni</i> compatto, compreso quello che contiene il punto $p_{k_0}$ stesso, e nessuna successione lo fa. La figura a otto qui sotto viola esattamente la seconda riga: $t_k\to\pi$ esce da ogni compatto di $(-\pi,\pi)$, ma le immagini tendono all&rsquo;origine e restano in un disco compatto.</p>
  <p><b>Teorema.</b> Se $F$ è un&rsquo;immersione <b>iniettiva e propria</b>, allora $F(M)$ è una sottovarietà <b>chiusa</b> di $N$ e $F$ è un diffeomorfismo sull&rsquo;immagine. E vale anche il viceversa: le sottovarietà chiuse sono esattamente le immagini di immersioni proprie.</p>
  <p><b>Perché la figura a otto fallisce</b>: la curva è definita su $(-\pi,\pi)$, aperto, e prendendo un piccolo disco compatto attorno all&rsquo;origine la sua controimmagine contiene sia $t$ vicino a $0$ sia $t$ vicino a $\pm\pi$ — <b>non è compatta</b>, perché gli estremi non ci sono. La velocità della curva è $(2\cos 2t,\ \cos t)$, <b>mai nulla</b>: il difetto non è mai stato nel differenziale.</p>
  <p><b>Il criterio pratico</b>, ed è quello che si usa: se $M$ è <b>compatta</b>, ogni mappa continua è propria (la controimmagine è chiusa in un compatto). Quindi <b>ogni immersione iniettiva di una varietà compatta ha per immagine una sottovarietà</b>. Tutti i controesempi vivono nel non compatto.</p>
  <p><b>Il vocabolario, fissato una volta</b>, perché i tre termini si confondono e negli enunciati contano:</p>
  <ul>
   <li>un'<b>applicazione propria</b> è una mappa continua in cui la controimmagine di ogni compatto è compatta. Non richiede né iniettività né condizioni sul differenziale: è una condizione puramente topologica;</li>
   <li>un'<b>immersione regolare</b> è un'immersione che sia anche un omeomorfismo sull'immagine (con la topologia indotta). È ciò che serve perché l'immagine erediti la struttura;</li>
   <li>un'<b>immersione propria</b> è un'immersione che è anche un'applicazione propria — e il teorema dice che, se iniettiva, è automaticamente regolare. <b>La propriezza è quindi l'ipotesi comoda da verificare</b>, perché è una condizione sulle controimmagini e non sulla topologia dell'immagine, che è proprio ciò che non si conosce ancora.</li>
  </ul>
  <p>Due nozioni collegate che servono negli enunciati di Whitney. Una <b>varietà con bordo</b> è definita come una varietà, ma ammettendo carte a valori nel semispazio $\{x^n\ge0\}$: i punti che finiscono su $x^n=0$ formano il <b>bordo</b>, che è a sua volta una varietà di dimensione $n-1$. Un <b>dominio regolare</b> è un sottoinsieme chiuso di una varietà che sia una varietà con bordo della stessa dimensione — tipicamente $\{f\le c\}$ con $c$ valore regolare. <b>Sono gli oggetti su cui si formula il teorema di Stokes</b>, e la ragione per cui Diverio li introduce qui è che la dimostrazione di Whitney nel caso non compatto esaurisce la varietà con domini regolari.</p>
  <div class="note"><b>Le funzioni <span class="str" data-str="esaustione-per-compatti">esaustive</span> sono proprie</b>, per costruzione: $h^{-1}([0,c])$ è compatto. È il ponte fra le due tappe, e il motivo per cui l&rsquo;esaustione serviva: permette di trattare una varietà non compatta come unione crescente di compatti, e di trasferirle i teoremi che valgono nel compatto.</div>`}
]},

/* ---------------- 01b · IMMERSIONI CHE NON SONO INCASSAMENTI ---------------- */
{ num:'02', title:'Due immersioni iniettive che non sono incassamenti', meta:'la figura a otto di Lee · la retta densa nel toro',
  blocchi:[
  {t:'prosa', title:'La figura a otto, con i conti', tag:'esempi', html:R`
  <p>Lee costruisce il controesempio in una riga (Esempio 4.19, stampata 86). La curva $$\beta:(-\pi,\pi)\to\mathbb{R}^2,\qquad \beta(t)=(\sin2t,\ \sin t)$$ è un'immersione, perché la velocità $\beta'(t)=(2\cos2t,\ \cos t)$ non si annulla mai: la seconda componente è nulla solo in $t=\pm\pi/2$, e lì la prima vale $$\beta'(\pm\tfrac\pi2)=(-2,\ 0).$$ È iniettiva, perché $\sin t$ determina $t$ a meno di $t\mapsto\pi-t$, e il segno di $\sin2t$ distingue i due casi tranne che nell'origine, raggiunta solo per $t=0$. La sua immagine è il luogo $$x^2=4y^2(1-y^2),$$ una curva chiusa e limitata del piano, cioè <b>compatta</b>; il dominio $(-\pi,\pi)$ non lo è. Un omeomorfismo conserverebbe la compattezza, quindi $\beta$ non è un omeomorfismo sull'immagine: è un'immersione iniettiva, non un incassamento.</p>
  <p>Il difetto si localizza in un punto solo, l'origine. Per $t\to\pm\pi$ i due capi della curva rientrano nell'origine da dove la curva era passata in $t=0$: nella topologia dell'immagine come sottoinsieme del piano, $\beta(t)$ converge a $\beta(0)$; nella topologia trasportata dal dominio, $t\to\pm\pi$ non converge a $0$. Le due topologie sull'immagine sono diverse, ed è tutta lì la differenza fra immersione e incassamento. La condizione di <b>propriezza</b> della tappa precedente lo vieta esattamente: la successione $t_k\to\pi$ esce dai compatti del dominio, e le immagini restano nel compatto attorno all'origine.</p>`},
  {t:'plot', title:'La figura a otto: un’immersione iniettiva con immagine compatta',
   intro:R`Il ridisegno della Fig. 4.3 di Lee: la curva $\beta(t)=(\sin2t,\sin t)$ per $t\in(-\pi,\pi)$, con il punto $t=0$ e i due capi $t\to\pm\pi$ che rientrano nell'origine.`,

   leggi:R`<p>La curva parte dall'origine vicino a $t=-\pi$, percorre il lobo inferiore, passa per l'origine in $t=0$, percorre il lobo superiore e torna verso l'origine per $t\to\pi$, senza raggiungerla. In $t=\pm\pi/2$ è nei punti più alti e più bassi, con velocità orizzontale. Il punto segnato $t=2{,}98$ è già vicinissimo all'origine nel piano, e lontanissimo da $t=0$ nel dominio: è quella distanza che l'immersione non vede e l'incassamento sì. Generale: un'immersione iniettiva non è un incassamento quando l'immagine «si riavvicina a sé stessa». Accidentale: che il punto di riavvicinamento sia un punto doppio dell'immagine chiusa.</p>`},
  {t:'prosa', title:'La retta di pendenza irrazionale nel toro', tag:'esempi', html:R`
  <p>Il secondo esempio di Lee è più sottile, perché l'immagine non ha nemmeno un punto doppio da indicare (Esempio 4.20, stampata 86). Sul toro $T^2=S^1\times S^1$ si consideri $$\gamma(t)=\big(e^{2\pi it},\ e^{2\pi i\alpha t}\big),\qquad t\in\mathbb{R},$$ con $\alpha$ irrazionale. È un'immersione, e iniettiva: $\gamma(t_1)=\gamma(t_2)$ chiede che $t_1-t_2$ e $\alpha(t_1-t_2)$ siano entrambi interi, impossibile con $\alpha$ irrazionale se $t_1\ne t_2$. Ma non è un omeomorfismo sull'immagine. Per il teorema di approssimazione di Dirichlet, per ogni $\varepsilon\gt0$ ci sono interi $n,m$ con $|\alpha n-m|\lt\varepsilon$; allora $\gamma(n)$ dista da $\gamma(0)$ meno di $2\pi\varepsilon$, perché $|e^{i\theta_1}-e^{i\theta_2}|\le|\theta_1-\theta_2|$ (la corda è più corta dell'arco). Quindi $\gamma(0)$ è punto di accumulazione di $\gamma(\mathbb{Z})$, mentre $\mathbb{Z}$ non ha punti di accumulazione in $\mathbb{R}$. Con $\alpha=\sqrt2$, per esempio, $n=12$ e $m=17$ danno $$|12\sqrt2-17|\approx0{,}029.$$ Lee aggiunge che l'immagine è densa nel toro (Problema 4-4): la curva passa vicino a ogni punto.</p>`},

{ num:'03', title:'Che cosa si salva: localmente un’immersione e sempre un incassamento', meta:'la Proposizione 5.22 di Lee · un intorno nella sottovarieta e uno nel piano · la Fig. 5.8',

  <p>Lee chiama <b>sottovarietà immersa</b> l'immagine di un'immersione iniettiva, con la topologia e la struttura liscia trasportate dal dominio, e dimostra che il difetto è soltanto globale (Proposizione 5.22, stampata 110): <b>ogni punto di una sottovarietà immersa ha un intorno, nella sottovarietà, che è incassato</b>. Il motivo è il teorema del rango: un'immersione è localmente, in carte opportune, l'inclusione $x\mapsto(x,0)$, che è un incassamento. Lee avverte però su ciò che la proposizione <b>non</b> dice (stampata 111): l'intorno è un intorno nella sottovarietà, non un intorno nell'ambiente. Nella figura a otto, un arco corto attorno a $t=0$ è un pezzo di curva liscia e incassata; ma ogni disco del piano centrato nell'origine contiene anche i due capi della curva vicini a $t=\pm\pi$, e l'intersezione del disco con l'immagine non è un incassamento.</p>`},

/* ---------------- 01c · RESTRINGERE DOMINIO E CODOMINIO ---------------- */
{ num:'04', title:'Restringere dominio e codominio a una sottovarieta', meta:'il dominio non dà problemi · il codominio sì, e il controesempio di Lee · basta la continuità · e per le incassate è gratis',
  blocchi:[
  {t:'prosa', title:'Il dominio: sempre liscio', tag:'teorema', html:R`
  <p>Data una mappa liscia $F:M\to N$ e una sottovarietà $S\subseteq M$, immersa o incassata, la restrizione $F|_S$ è liscia (Lee, Teorema 5.27, stampata 112). La dimostrazione è una riga: l'inclusione $\iota:S\hookrightarrow M$ è liscia per definizione di sottovarietà, e $F|_S=F\circ\iota$. È il caso che si usa senza pensarci ogni volta che si restringe una funzione a una curva o a una superficie.</p>`},
  {t:'prosa', title:'Il codominio: può non essere nemmeno continua', tag:'esempi', html:R`
  <p>Il verso opposto è delicato, e Lee lo mostra con la stessa figura a otto (Esempio 5.28, stampata 112). Sia $S$ la figura a otto con la struttura trasportata da $\beta$, e sia $G:\mathbb{R}\to\mathbb{R}^2$ data dalla <b>stessa formula</b>, $G(t)=(\sin2t,\sin t)$, ma su tutta la retta. L'immagine di $G$ sta in $S$, perché $G$ è periodica di periodo $2\pi$: per $t\in(\pi,3\pi)$ vale $$G(t)=\beta(t-2\pi),\qquad \sin2(t-2\pi)=\sin2t.$$ Però $G$, vista come mappa a valori in $S$, non è continua in $t=\pi$. Letta nella carta globale $\beta^{-1}$ di $S$, la funzione $\beta^{-1}\circ G$ vale $t$ appena prima di $\pi$ e $t-2\pi$ appena dopo: salta da $\pi$ a $-\pi$. Nel piano non succede niente — la curva passa con continuità per l'origine — ma nella topologia di $S$ i due valori sono agli estremi opposti del dominio.</p>
  <p>Lee dimostra che la continuità è l'unica cosa che può mancare (Teorema 5.29, stampata 112): se $S\subseteq M$ è immersa e $F:N\to M$ è liscia con immagine in $S$ e <b>continua come mappa a valori in $S$</b>, allora $F:N\to S$ è liscia. E per le sottovarietà incassate la continuità è gratis (Corollario 5.30, stampata 113), perché la topologia di $S$ è quella indotta dall'ambiente e una mappa continua nell'ambiente con immagine in $S$ è continua in $S$. È una seconda ragione per preferire le sottovarietà incassate: con esse, restringere il codominio non costa niente.</p>`},
  {t:'plot', title:'La carta della figura a otto letta lungo G: un salto in t = pi',
   intro:R`Il grafico di $\beta^{-1}\circ G$ per $t$ vicino a $\pi$: il parametro di $S$ corrispondente al punto $G(t)$. È il conto dietro le Fig. 5.9 e 5.10 di Lee, che restringono dominio e codominio.`,
   plots:[
    {kind:'curve', x:'t', y:'t', tr:[2.3,3.12], height:280, equal:true,
     xr:[2.2,4.0], yr:[-3.4,3.4],
     title:'prima di pi la carta vale t, dopo vale t meno 2 pi',
     segs:[{x1:3.16,y1:-3.12,x2:3.95,y2:-2.33,col:'#d8a13a',width:2.2},
           {x1:3.1416,y1:-3.4,x2:3.1416,y2:3.4,col:'#8ea0b8',dash:true,label:'t = pi',lx:3.3,ly:3.1}],
     marks:[{x:3.1416,y:3.1416,col:'#5eead4',hollow:true,label:'verso pi da sinistra',left:true},{x:3.1416,y:-3.1416,col:'#d8a13a',hollow:true,label:'verso meno pi da destra'}]}
   ],
   leggi:R`<p>A sinistra della retta tratteggiata la curva è la diagonale: $G(t)=\beta(t)$ e la coordinata in $S$ è $t$ stesso, che si avvicina a $\pi$. A destra la coordinata è $t-2\pi$, che parte da $-\pi$. Il salto di $2\pi$ è il salto da un capo all'altro del dominio di $\beta$, ed è la discontinuità di $G$ come mappa in $S$: nel piano i due punti $G(\pi^-)$ e $G(\pi^+)$ sono vicinissimi, nella sottovarietà sono agli antipodi. Generale: per le sottovarietà immerse la continuità a valori in $S$ va verificata. Accidentale: il periodo $2\pi$.</p>`}
]},

/* ---------------- 02 · INTORNI TUBOLARI ---------------- */
{ num:'05', title:'Intorni tubolari: una sottovarieta ha un intorno che le somiglia', meta:'il fibrato normale · l’enunciato · a cosa serve davvero',
  blocchi:[
  {t:'prosa', title:'L’enunciato, e la costruzione', tag:'costruzione', html:R`
  <p>Data una sottovarietà chiusa $M\subseteq\mathbb{R}^N$, si considera il <b>fibrato normale</b> $NM$: in ogni punto, i vettori ortogonali a $T_{M,p}$. È un fibrato di rango $N-\dim M$.</p>
  <p><b>Teorema dell&rsquo;intorno tubolare.</b> Esiste un intorno aperto $U$ di $M$ in $\mathbb{R}^N$ diffeomorfo a un intorno della sezione nulla in $NM$, in modo che il diffeomorfismo sia l&rsquo;identità su $M$. <b>In parole: un intorno di $M$ è fatto come una famiglia di dischetti ortogonali a $M$</b>, e c&rsquo;è una <b>retrazione</b> liscia $r:U\to M$ che a ogni punto vicino associa il punto più vicino di $M$.</p>
  <p><b>A che cosa serve, ed è il motivo per cui il teorema esiste:</b></p>
  <ul>
   <li>a <b>estendere</b> oggetti definiti su $M$ a un intorno (si estende in modo costante lungo i dischetti), e viceversa a <b>restringere</b> con la retrazione;</li>
   <li>a <b>deformare</b>: due mappe vicine in $U$ si possono spingere su $M$, ed è la tecnica base per dimostrare che certe costruzioni non dipendono da scelte;</li>
   <li>a <b>trasversalizzare</b>: due sottovarieta si dicono trasverse quando nei punti di incontro i loro spazi tangenti generano insieme tutto il tangente dell&rsquo;ambiente, e perturbare una mappa per renderla trasversa si fa muovendola dentro l&rsquo;intorno tubolare, dove c&rsquo;e&rsquo; spazio per spostarla senza uscire dalla zona controllata.</li>
  </ul>
  <p><b>La costruzione usa le partizioni dell&rsquo;unità</b> per incollare i dischetti locali e per rendere il raggio una funzione liscia che si assottiglia dove serve — perché su una varietà non compatta il raggio uniforme non esiste.</p>`},
  {t:'reveal', title:'La dimostrazione di Lee, nel caso di una sottovarieta di R^n', tag:'teorema', steps:[
   {label:'Il fibrato normale e la mappa E', body:R`
   <p>Per una sottovarietà incassata $M\subseteq\mathbb{R}^n$ di dimensione $m$, lo spazio normale $N_xM$ è il complemento ortogonale di $T_xM$, di dimensione $n-m$, e il <b>fibrato normale</b> è $$NM=\{(x,v)\in\mathbb{R}^n\times\mathbb{R}^n:\ x\in M,\ v\in N_xM\},$$ che Lee dimostra essere una sottovarietà incassata di dimensione $n$ (Teorema 6.23, stampata 138). La mappa che costruisce l'intorno è la più semplice possibile: $$E:NM\to\mathbb{R}^n,\qquad E(x,v)=x+v,$$ che porta ogni spazio normale sulla retta, o il piano, ortogonale a $M$ in $x$. Un <b>intorno tubolare</b> è l'immagine diffeomorfa, tramite $E$, di un insieme $\{(x,v):|v|\lt\delta(x)\}$ con $\delta$ continua e positiva (stampata 139).</p>`},
   {label:'Localmente: il teorema della funzione inversa', body:R`
   <p>Sulla sezione nulla $E$ è un diffeomorfismo locale. Il differenziale $dE_{(x,0)}$ manda il tangente alla sezione nulla su $T_xM$ (perché $E(x,0)=x$) e il tangente alla fibra su $N_xM$ (perché sulla fibra $E$ è la traslazione $v\mapsto x+v$); poiché $\mathbb{R}^n=T_xM\oplus N_xM$, è suriettivo, e quindi biiettivo per ragioni di dimensione. Per il teorema della funzione inversa $E$ è un diffeomorfismo su un intorno di ogni $(x,0)$.</p>`},
   {label:'Globalmente: un raggio continuo, e metà di esso', body:R`
   <p>Il passo difficile è l'iniettività globale. Lee definisce $\rho(x)$ come l'estremo superiore dei $\delta\le1$ per cui $E$ è un diffeomorfismo dall'insieme $V_\delta(x)=\{(x',v'):|x-x'|\lt\delta,\ |v'|\lt\delta\}$ sulla sua immagine. Con la disuguaglianza triangolare $\rho$ risulta continua: $|\rho(x)-\rho(x')|\le|x-x'|$ (Fig. 6.7, stampata 140). Poi si restringe a <b>metà</b> del raggio, $V=\{(x,v):|v|\lt\tfrac12\rho(x)\}$, e lì $E$ è iniettiva. Se $x+v=x'+v'$ con $\rho(x')\le\rho(x)$, allora $$|x-x'|=|v-v'|\le|v|+|v'|\lt\tfrac12\rho(x)+\tfrac12\rho(x')\le\rho(x),$$ quindi entrambi i punti stanno in $V_{\rho(x)}(x)$, dove $E$ è iniettiva, e coincidono (Fig. 6.8). È il motivo del fattore un mezzo: due normali che si incontrano costringono i loro piedi a stare vicini.</p>`},
   {label:'La retrazione', body:R`
   <p>Su un intorno tubolare $U$ c'è una retrazione liscia $r:U\to M$, che è anche una sommersione (Proposizione 6.25, stampata 140): $r=\pi\circ E^{-1}$, dove $\pi(x,v)=x$ è la proiezione del fibrato normale. In parole, $r$ manda ogni punto vicino a $M$ nel piede della normale che lo raggiunge, che è il punto di $M$ più vicino. È lo strumento con cui Lee dimostra subito dopo che ogni mappa continua in una varietà è omotopa a una liscia: si approssima la mappa in $\mathbb{R}^n$, la si tiene dentro il tubo, e la si riporta su $M$ con $r$ (Teorema 6.26, stampata 141).</p>`}
  ]},
  {t:'plot', title:'Un intorno tubolare della parabola',
   intro:R`Il ridisegno della Fig. 6.6 di Lee per la curva $y=x^2$: in ogni punto un segmento normale di semilunghezza $\delta(x)$, più corto vicino al vertice, dove la curva piega di più.`,
   plots:[
    {kind:'curve', x:'t', y:'t*t', tr:[-1.45,1.45], height:300, equal:true,
     xr:[-1.7,1.7], yr:[-0.5,2.3],
     title:'le normali a raggio variabile non si incontrano: il tubo e un diffeomorfismo',
     segs:[{x1:-1.767,y1:1.573,x2:-0.873,y2:1.912,col:'#5eead4',width:1.3},{x1:-1.511,y1:1.023,x2:-0.689,y2:1.397,col:'#5eead4',width:1.3},{x1:-1.25,y1:0.564,x2:-0.51,y2:0.985,col:'#5eead4',width:1.3},{x1:-0.978,y1:0.195,x2:-0.342,y2:0.677,col:'#5eead4',width:1.3},{x1:-0.686,y1:-0.086,x2:-0.194,y2:0.473,col:'#5eead4',width:1.3},{x1:-0.36,y1:-0.269,x2:-0.08,y2:0.365,col:'#5eead4',width:1.3},{x1:0.0,y1:-0.32,x2:0.0,y2:0.32,col:'#5eead4',width:1.3},{x1:0.36,y1:-0.269,x2:0.08,y2:0.365,col:'#5eead4',width:1.3},{x1:0.686,y1:-0.086,x2:0.194,y2:0.473,col:'#5eead4',width:1.3},{x1:0.978,y1:0.195,x2:0.342,y2:0.677,col:'#5eead4',width:1.3},{x1:1.25,y1:0.564,x2:0.51,y2:0.985,col:'#5eead4',width:1.3},{x1:1.511,y1:1.023,x2:0.689,y2:1.397,col:'#5eead4',width:1.3},{x1:1.767,y1:1.573,x2:0.873,y2:1.912,col:'#5eead4',width:1.3}],
     marks:[{x:0,y:0,col:'#d8a13a',label:'vertice: curvatura massima, raggio piu piccolo'}]}
   ],
   leggi:R`<p>Ogni segmento verde è il pezzo di spazio normale $\{x+v:|v|\lt\delta(x)\}$ sopra un punto della curva, e l'unione dei segmenti, presi in ogni punto, è l'intorno tubolare. Il raggio cresce allontanandosi dal vertice: vicino al vertice la curva piega di più, e normali lunghe dalla parte concava si incrocerebbero. È per questo che Lee prende $\delta$ come una funzione e non come una costante: su una varietà non compatta un raggio uniforme può non esistere, perché la curvatura può crescere senza limite. Generale: il raggio ammissibile è una funzione continua del punto. Accidentale: la parabola.</p>`},
  {t:'prosa', title:'Quanto può essere lungo il raggio: il conto sulla parabola', tag:'costruzione', html:R`
  <p>Sulla parabola il limite al raggio si calcola, ed è la prova concreta che il fattore di Lee non è un artificio. La normale nel punto $(a,a^2)$ ha direzione $(-2a,1)$; i punti $(a-2as,\ a^2+s)$ della normale da $a$ e quelli della normale da $-a$ si incontrano sull'asse, dove la prima coordinata si annulla: $s=\tfrac12$, nel punto $$\big(0,\ a^2+\tfrac12\big).$$ La distanza di quel punto dal piede della normale è $$\tfrac12\sqrt{1+4a^2},$$ che per $a\to0$ tende a $\tfrac12$: è il <b>raggio di curvatura</b> della parabola nel vertice. Un tubo di raggio $\tfrac12$ o più attorno al vertice ha normali che si incrociano dalla parte concava, e $E$ non è iniettiva; con un raggio minore no. È la versione calcolata della Fig. 6.8: due normali che si incontrano a distanza $d$ dai loro piedi obbligano i piedi a distare meno di $2d$.</p>`},
  {t:'plot', title:'Due normali che si incontrano',
   intro:R`Le normali alla parabola $y=x^2$ dai punti $(\pm a,a^2)$ con $a=0{,}4$, dalla parte concava: si incontrano sull'asse a distanza $\tfrac12\sqrt{1+4a^2}$ dai piedi.`,
   plots:[
    {kind:'curve', x:'t', y:'t*t', tr:[-1.1,1.1], height:280, equal:true,
     xr:[-1.2,1.2], yr:[-0.2,1.3],
     title:'il punto d’incontro sta a distanza 0.64 dai due piedi: il raggio del tubo deve essere minore',
     segs:[{x1:0.4,y1:0.16,x2:0,y2:0.66,col:'#d8a13a',arrow:true},{x1:-0.4,y1:0.16,x2:0,y2:0.66,col:'#d8a13a',arrow:true}],
     marks:[{x:0,y:0.66,col:'#c084fc',label:'(0, a^2 + 1/2)'},{x:0.4,y:0.16,col:'#5eead4',label:'(a, a^2)'},{x:-0.4,y:0.16,col:'#5eead4',label:'(-a, a^2)',left:true}]}
   ],
   leggi:R`<p>Le due frecce sono i tratti delle normali dai punti $(\pm0{,}4,\ 0{,}16)$ fino al loro incontro in $(0,\ 0{,}66)$, a distanza $\tfrac12\sqrt{1{,}64}\approx0{,}64$ da ciascun piede. Se il tubo avesse raggio maggiore di $0{,}64$ in quei punti, il punto viola sarebbe raggiunto da due normali diverse e $E$ non sarebbe iniettiva; con un raggio minore il punto non è nel tubo. Avvicinando i due piedi al vertice, il punto d'incontro scende fino al centro di curvatura $(0,\tfrac12)$. Generale: l'iniettività di $E$ si perde dove le normali si incrociano, cioè al raggio di curvatura. Accidentale: la simmetria dei due piedi.</p>`}
]},

/* ---------------- 03 · WHITNEY ---------------- */
{ num:'06', title:'Il teorema di Whitney, e la discussione sullottimalita', meta:'la versione debole 2n+1 · la forte 2n · perche non si puo fare meglio · e il caso compatto',
  blocchi:[
  {t:'reveal', title:'I due enunciati e l’idea', tag:'idea', steps:[
   {label:'Gli enunciati', body:R`
   <p><b>Whitney debole</b>: ogni varietà liscia di dimensione $n$ ammette un&rsquo;immersione regolare propria in $\mathbb{R}^{2n+1}$. Per $n=1$ dà <b>$2n+1=3$</b>: ogni curva astratta sta in $\mathbb{R}^3$.</p>
   <p><b>Whitney forte</b>: basta $\mathbb{R}^{2n}$. Per $n=2$ dà <b>$2n=4$</b>: ogni superficie astratta sta in $\mathbb{R}^4$ — e infatti $\mathbb{RP}^2$, che in $\mathbb{R}^3$ non entra, in $\mathbb{R}^4$ sì.</p>
   <p>Con i quantificatori, la versione debole è
   $$\forall M\ \text{varietà liscia di dimensione }n\ \ \ \exists F:M\to\mathbb{R}^{2n+1}\ :\ \ F\ \text{immersione iniettiva e propria},$$
   dove «immersione» è a sua volta $\forall p\in M\ \ \forall v\in T_{M,p}\ \ (d_pF(v)=0\Rightarrow v=0)$. <b>La forza dell&rsquo;enunciato sta in ciò che non dipende da $M$</b>: la dimensione d&rsquo;arrivo $2n+1$ è scritta prima del $\exists F$ e contiene solo $n$. Che ogni varietà compatta entri in <i>qualche</i> $\mathbb{R}^N$, con $N$ che dipende dalla varietà, è il primo passo della dimostrazione; Whitney dice che basta un $N$ uguale per tutte le varietà della stessa dimensione.</p>`},
   {label:'L’idea della dimostrazione, nel caso compatto', body:R`
   <p>Si copre $M$ con un numero <b>finito</b> di carte e si prendono le <span class="str" data-str="funzione-bump">funzioni bump</span>. La mappa che manda $p$ nella lista delle coordinate pesate più i pesi stessi è un&rsquo;immersione iniettiva in uno spazio euclideo di dimensione grande. <b>Poi si abbassa la dimensione proiettando</b>: si mostra che «quasi tutte» le direzioni di proiezione mantengono l&rsquo;immersione e l&rsquo;iniettività, finché non si scende a $2n+1$.</p>
   <p><b>Il passo si chiama proiezione generica</b>, e conviene vederlo con il conto delle dimensioni, perché è lì che si capisce da dove esce il $2n+1$. Proiettare $\mathbb{R}^{N}$ lungo una direzione $v$ rovina l'iniettività se esistono due punti dell'immagine la cui congiungente è parallela a $v$; le direzioni cattive sono quindi l'immagine della mappa
   $$(p,q,t)\ \longmapsto\ \frac{F(p)-F(q)}{|F(p)-F(q)|},$$
   definita su uno spazio di dimensione <b>$2n+1$</b>. Analogamente, le direzioni che rovinano l'immersione sono l'immagine di una mappa definita sul fibrato dei vettori tangenti unitari, di dimensione $2n-1$. <b>Se lo spazio delle direzioni — la sfera $S^{N-1}$, di dimensione $N-1$ — è più grande di entrambe, le immagini non possono coprirlo</b>: hanno misura nulla. La condizione $N-1>2n$ dà esattamente $N\ge2n+2$, e si scende finché non si arriva a $2n+1$.</p>
   <p><b>Il fatto che un'immagine di dimensione minore abbia misura nulla</b> è la proprietà dimostrata insieme agli insiemi trascurabili, e nella sua forma generale — per le mappe fra varietà qualunque — è il teorema di Sard. <b>La struttura dell'argomento è sempre la stessa</b>: si mostra che le scelte cattive formano l'immagine di uno spazio troppo piccolo, e si conclude che quelle buone sono quasi tutte.</p>`},
   {label:'Perche 2n e ottimale, e cosa significa', body:R`
   <p>La dimensione non si può abbassare in generale: <b>$\mathbb{RP}^2$ non si immerge in $\mathbb{R}^3$</b> (è <span class="str" data-str="orientabilita">non orientabile</span> e compatta, e una superficie chiusa in $\mathbb{R}^3$ deve essere orientabile), e ci sono esempi in ogni dimensione che saturano il $2n$.</p>
   <p><b>Ma per varietà particolari si può fare molto meglio</b>: $S^n$ sta in $\mathbb{R}^{n+1}$, il toro in $\mathbb{R}^3$. Whitney dà una garanzia <i>universale</i>, non la dimensione ottimale caso per caso — e trovare quella per una data varietà è un problema aperto in molti casi.</p>
   <div class="note"><b>La conseguenza concettuale, che è il vero motivo per cui il teorema si studia.</b> Whitney dice che l&rsquo;approccio astratto non ha creato oggetti nuovi: ogni varietà astratta <i>è</i> una sottovarietà di qualche $\mathbb{R}^N$. Allora perché non partire da lì? <b>Perché l&rsquo;immersione non è canonica</b>: ce ne sono infinite, nessuna privilegiata, e usarne una significa portarsi dietro una struttura che non appartiene alla varietà. <b>La stessa ragione per cui in fisica si preferiscono formulazioni senza coordinate</b> pur sapendo che le coordinate esistono sempre.</div>`}
  ]}
]},

/* ---------------- 03b · LA DIMOSTRAZIONE DI WHITNEY, NELLA VERSIONE CHE SI PUO SEGUIRE ---------------- */
{ num:'07', title:'Come si dimostra Whitney: il caso compatto', meta:'il ricoprimento finito · l’immersione in dimensione grande · la proiezione generica · e dove entra Sard',
  blocchi:[
  {t:'prosa', title:'Perche il caso compatto e quello da vedere', tag:'metodo', html:R`
  <p>Il teorema di Whitney nella sua forma forte — ogni varietà $n$-dimensionale si immerge in $\mathbb{R}^{2n}$ — ha una dimostrazione difficile, che il corso non fa. <b>Ma la versione debole per varietà compatte si dimostra per intero in quattro mosse</b>, e vale la pena seguirla perché usa tutti gli strumenti costruiti finora: le partizioni dell&rsquo;unità, il teorema di Sard, la compattezza.</p>
  <p><b>Mossa 1: immergere in dimensione grande.</b> Per ogni punto $p$ si prende una carta $(U_p,\varphi_p)$ e una funzione bump $\beta_p$ che vale $1$ su un intorno $V_p$ di $p$ e ha supporto in $U_p$. Si costruisce la mappa</p>
  $$F_p=\left(\beta_p\,\varphi_p,\ \beta_p\right):M\to\mathbb{R}^{n}\times\mathbb{R},$$
  <p>estesa con zero fuori da $U_p$. Per <span class="str" data-str="compattezza">compattezza</span> bastano finitamente molti $V_{p_1},\dots,V_{p_k}$ a coprire $M$, e mettendo insieme tutte le componenti si ottiene</p>
  $$F=\left(F_{p_1},\dots,F_{p_k}\right):M\to\mathbb{R}^{k(n+1)}.$$
  <p>Il ruolo dell&rsquo;ultima componente $\beta_p$ merita una riga, perché a prima vista sembra ridondante: senza di essa due punti che stanno in carte diverse potrebbero avere le stesse coordinate e non essere separati. Registrando anche il <i>valore del bump</i> si aggiunge l&rsquo;informazione «quanto sei dentro questa carta», e quella basta a distinguerli.</p>
  <p><b>Questa mappa è un&rsquo;immersione iniettiva</b>: è un&rsquo;immersione perché su ogni $V_{p_i}$ coincide con la carta (che ha differenziale iniettivo), ed è iniettiva perché due punti distinti sono separati o dalla carta o dai valori dei bump. Essendo $M$ compatta, è automaticamente propria, quindi è un <b>incassamento</b>. <b>Il prezzo è che $k(n+1)$ è enorme</b>, e tutto il resto della dimostrazione serve a ridurlo.</p>`},
  {t:'reveal', title:'Le tre mosse che abbassano la dimensione', tag:'derivazione', steps:[
   {label:'Mossa 2: proiettare lungo una direzione', body:R`
   <p>Supponiamo di avere un incassamento $F:M\to\mathbb{R}^{N}$ con $N>2n+1$. Si sceglie un versore $v\in S^{N-1}$ e si proietta $\mathbb{R}^{N}$ sull&rsquo;iperpiano ortogonale a $v$, ottenendo $\pi_v\circ F:M\to\mathbb{R}^{N-1}$.</p>
   <p><b>La domanda è per quali $v$ la proiezione resta un incassamento</b>, e ci sono due cose che possono rompersi: l&rsquo;iniettività, se due punti distinti stanno su una retta parallela a $v$; e l&rsquo;immersività, se un vettore tangente è parallelo a $v$.</p>`},
   {label:'Mossa 3: contare le direzioni cattive', body:R`
   <p>Le direzioni che rovinano l&rsquo;<b>iniettività</b> sono le immagini della mappa</p>
   $$\sigma:\left(M\times M\setminus\Delta\right)\to S^{N-1},\qquad \sigma(p,q)=\frac{F(p)-F(q)}{|F(p)-F(q)|},$$
   <p>definita fuori dalla diagonale. Il suo dominio ha dimensione $2n$; se $2n<N-1$, cioè $N>2n+1$, l&rsquo;immagine ha <b>misura nulla</b> in $S^{N-1}$ per il teorema di Sard — più precisamente per il suo corollario che una mappa liscia da una varietà di dimensione minore ha immagine di misura nulla.</p>
   <p>Le direzioni che rovinano l&rsquo;<b>immersività</b> sono le immagini di una mappa analoga definita sul fibrato dei vettori tangenti unitari, di dimensione $2n-1$: anche quelle hanno misura nulla se $2n-1<N-1$, cioè $N>2n$.</p>`},
   {label:'Mossa 4: concludere', body:R`
   <p>L&rsquo;unione di due insiemi di misura nulla ha misura nulla, quindi <b>esiste</b> — anzi, quasi ogni — direzione $v$ che evita entrambi i guai. Proiettando lungo quella, si ottiene un incassamento in $\mathbb{R}^{N-1}$.</p>
   <p><b>Un punto tecnico che vale la pena notare</b>: a ogni passo la nuova mappa è ancora un incassamento, quindi l&rsquo;argomento si può applicare di nuovo senza rifare la costruzione iniziale. La proiezione conserva la compattezza del dominio, quindi la properness resta automatica, e l&rsquo;unica cosa da riverificare a ogni giro sono iniettività e immersività — che è esattamente ciò che la scelta di $v$ garantisce.</p>
   <p>Si ripete finché $N$ scende a $2n+1$, dove le disuguaglianze $N>2n+1$ e $N>2n$ smettono di valere e il procedimento si ferma. <b>Risultato: ogni varietà compatta $n$-dimensionale si incassa in $\mathbb{R}^{2n+1}$</b>, che è la versione debole del teorema.</p>
   <div class="note"><b>Che cosa manca per arrivare a $2n$</b>, e perché il corso si ferma qui. A $N=2n+1$ l&rsquo;argomento fallisce di misura: l&rsquo;insieme delle direzioni cattive per l&rsquo;iniettività ha esattamente dimensione $2n=N-1$, cioè la stessa della sfera, e può avere misura positiva. Whitney riuscì comunque a scendere a $2n$ con un argomento completamente diverso — eliminando le autointersezioni a coppie con il cosiddetto «trucco di Whitney» — che è una delle costruzioni più famose della topologia differenziale e richiede un corso a sé.</div>`}
  ]},
  {t:'plot', title:'Perche una dimensione in piu districa: il nodo e la sua ombra',
   intro:R`Una curva chiusa in $\mathbb{R}^{3}$ — il nodo trifoglio — disegnata come curva tridimensionale ruotabile. Trascina: in tre dimensioni la curva non si autointerseca mai, ma ogni sua proiezione piana ha incroci.`,
   plots:[
    {kind:'curve3d', x:'sin(t)+2*sin(2*t)', y:'cos(t)-2*cos(2*t)', z:'-sin(3*t)',
     tr:[0,6.2832], yaw:0.6, pitch:0.45, height:340,
     title:'trifoglio in R^3: nessun punto doppio, ma la sua ombra ne ha tre'}
   ],
   leggi:R`<p><b>Ruotando la figura si vede il punto</b>: da certe direzioni la curva sembra incrociarsi, da altre gli incroci si spostano, ma non c'è nessuna direzione da cui spariscano tutti. Eppure la curva nello spazio è un incassamento perfetto di $S^{1}$ — iniettiva, immersione, propria per compattezza.</p>
   <p><b>Gli incroci sono un artefatto della proiezione</b>, cioè del passaggio da tre dimensioni a due, ed è esattamente la situazione della bottiglia di Klein una dimensione più su: $K$ vive senza autointersezioni in $\mathbb{R}^{4}$, e ogni suo disegno in $\mathbb{R}^{3}$ ne ha una.</p>
   <p><b>Il conto di Whitney spiega perché due dimensioni di scarto bastano sempre.</b> Proiettando da $\mathbb{R}^{N}$ a $\mathbb{R}^{N-1}$ le direzioni «cattive» formano un insieme di dimensione $2n$: finché $2n$ è minore della dimensione della sfera delle direzioni, quelle cattive sono un insieme di misura nulla e ne resta sempre una buona. <b>La soglia $N=2n+1$ è il punto in cui si esauriscono le direzioni da cui guardare</b> — e per un nodo, con $n=1$ e $N=3$, si è già al limite: nessuna proiezione nel piano è innocua.</p>`},
  {t:'prosa', title:'Perche 2n e ottimale, e il senso del conto', tag:'struttura', html:R`
  <p>Vale la pena osservare che per le varietà più familiari la dimensione necessaria è molto minore del limite: la sfera $S^{n}$ si incassa in $\mathbb{R}^{n+1}$, il toro in $\mathbb{R}^{3}$, un gruppo di matrici nello spazio delle matrici che lo contiene. <b>Whitney dà una garanzia valida per tutte le varietà, non il valore ottimo per ciascuna</b> — ed è la differenza fra un teorema di esistenza universale e un conto caso per caso.</p>
  <p>La domanda naturale è se si possa fare meglio di $2n$, e la risposta è no in generale: <b>esistono varietà $n$-dimensionali che non si immergono in $\mathbb{R}^{2n-1}$</b>. L&rsquo;esempio minimo è $\mathbb{RP}^{2}$, che ha dimensione $2$ e non si immerge in $\mathbb{R}^{3}$ — ed è il motivo per cui nel movimento sulle strutture lisce si è detto che non si può disegnare.</p>
  <p>Il conto delle dimensioni dà l&rsquo;intuizione giusta, e vale la pena farlo. <b>Due sottovarietà di dimensione $n$ dentro $\mathbb{R}^{N}$ si intersecano «genericamente» in dimensione $2n-N$</b>: se questo numero è negativo, l&rsquo;intersezione generica è vuota. Con $N=2n$ si ottiene dimensione zero, cioè <b>punti isolati</b>: due superfici in $\mathbb{R}^{4}$ si incontrano genericamente in punti, e quei punti si possono talvolta eliminare a coppie. Con $N=2n-1$ la dimensione dell&rsquo;intersezione sale a $2n-(2n-1)=1$, cioè <b>curve</b>: e una curva di autointersezioni non si elimina con una piccola deformazione, perché deformando si sposta ma non sparisce. <b>È questa la ragione geometrica per cui $2n$ è la soglia</b>, e perché la dimostrazione si fa difficile esattamente lì.</p>
  <p><b>Va distinta l&rsquo;immersione dall&rsquo;incassamento anche nell&rsquo;enunciato del teorema</b>, perché i due numeri sono diversi: ogni varietà $n$-dimensionale si <i>immerge</i> in $\mathbb{R}^{2n-1}$ e si <i>incassa</i> in $\mathbb{R}^{2n}$, per $n>1$. La bottiglia di Klein illustra entrambi i lati: si immerge in $\mathbb{R}^{3}=2\cdot2-1$, ed è il disegno con l&rsquo;autointersezione; si incassa in $\mathbb{R}^{4}=2\cdot2$, ed è l&rsquo;oggetto vero. <b>Un solo esempio verifica due enunciati diversi</b>, e conviene tenerlo come caso di riferimento per non confondere i due numeri.</p>
  <p><b>Il significato complessivo del teorema</b>, che è la ragione per cui chiude il primo blocco del corso: l&rsquo;approccio astratto — varietà definite per carte, senza ambiente — non produce oggetti più generali di quelli concreti. <b>Ogni varietà astratta è, a meno di diffeomorfismo, una sottovarietà di uno spazio euclideo.</b> L&rsquo;astrazione non serve quindi ad avere più oggetti: serve a non dover scegliere un ambiente, e a poter parlare di proprietà che dall&rsquo;ambiente non dipendono. <b>È una rinuncia volontaria a informazione che non serve</b>, ed è la stessa mossa che in fisica porta a formulare le leggi in modo indipendente dal sistema di riferimento.</p>`}
]},

{ num:'08', title:'Il caso non compatto: tenere la varieta dentro un tubo', meta:'il Lemma 6.14 di Lee · due tubi con assi non paralleli · la Fig. 6.5',
  blocchi:[
  {t:'prosa', title:'Il caso non compatto: tenere la varieta dentro un tubo', tag:'costruzione', html:R`
  <p>Quando $M$ non è compatta, l'iniettività e l'immersività sopravvivono alla proiezione con lo stesso conto, ma la <b>propriezza</b> no: una proiezione può schiacciare all'infinito pezzi di $M$ che si allontanavano. Lee aggira il problema tenendo $M$ dentro un <b>tubo</b> attorno a una retta (Lemma 6.14, stampate 132-133). Si parte da un incassamento qualunque in $\mathbb{R}^N$, lo si comprime nella palla unitaria con un diffeomorfismo $G:\mathbb{R}^N\to B^N$, e si aggiunge come ultima coordinata una funzione esaustiva $f$: la mappa $p\mapsto(G(F(p)),f(p))$ è un incassamento proprio con immagine nel tubo $B^N\times\mathbb{R}$, di raggio uno attorno all'asse verticale. Poi si proietta lungo una direzione $v$ buona e <b>non parallela all'asse</b>. La controimmagine di un compatto è allora contenuta in due tubi, uno attorno all'asse e uno attorno alla retta di $v$, e <b>due tubi con assi non paralleli si intersecano in un insieme limitato</b>: la proiezione resta propria, e l'argomento si ripete fino a $2n+1$.</p>
  <p>Il fatto geometrico si vede già nel piano, con due strisce: la striscia $|y|\lt1$ attorno all'asse orizzontale e quella di larghezza due attorno alla retta inclinata di $60^\circ$, cioè $|x\sin60^\circ-y\cos60^\circ|\lt1$. La loro intersezione è un parallelogramma, e la sua estensione orizzontale è $$|x|\le\frac{1+\cos60^\circ}{\sin60^\circ}=\sqrt3.$$ Se l'angolo fra gli assi tende a zero, il parallelogramma si allunga senza limite: le strisce parallele non si intersecano in un limitato, ed è per questo che Lee chiede $v$ fuori dall'asse.</p>`},
  {t:'plot', title:'Due tubi con assi non paralleli: l’intersezione e limitata',
   intro:R`Il ridisegno della Fig. 6.5 di Lee, nel piano: la striscia di raggio uno attorno all'asse orizzontale e quella attorno alla retta inclinata di sessanta gradi.`,
   plots:[
    {kind:'curve', x:'t', y:'0', tr:[-3,3], height:300, equal:true,
     xr:[-3.2,3.2], yr:[-2.4,2.4],
     title:'il parallelogramma comune ha larghezza 2 radice di 3',
     segs:[{x1:-3.2,y1:1,x2:3.2,y2:1,col:'#5eead4'},{x1:-3.2,y1:-1,x2:3.2,y2:-1,col:'#5eead4'},
           {x1:-0.231,y1:-2.4,x2:2.540,y2:2.4,col:'#d8a13a'},{x1:-2.540,y1:-2.4,x2:0.231,y2:2.4,col:'#d8a13a'},
           {x1:-1.386,y1:-2.4,x2:1.386,y2:2.4,col:'#d8a13a',dash:true,label:'asse di v',lx:1.55,ly:2.2},
           {x1:0.577,y1:-1,x2:1.732,y2:1,col:'#c084fc',width:1},{x1:-1.732,y1:-1,x2:-0.577,y2:1,col:'#c084fc',width:1}],
     marks:[{x:1.732,y:1,col:'#c084fc',label:'x = radice di 3'},{x:-1.732,y:-1,col:'#c084fc',left:true}]}
   ],
   leggi:R`<p>Le due rette verdi delimitano il tubo attorno all'asse in cui Lee tiene la varietà; le due arancioni il tubo attorno alla direzione di proiezione $v$, che contiene la controimmagine di un compatto. La regione comune è il parallelogramma con i vertici viola, largo $2\sqrt3$: limitato, quindi la parte di varietà che vi cade è chiusa e limitata, cioè compatta. Ruotando la retta arancione verso l'orizzontale il parallelogramma si allunga come $1/\sin\theta$, e diventa una striscia infinita quando gli assi coincidono. Generale: due tubi con assi non paralleli si intersecano in un limitato, in ogni dimensione. Accidentale: l'angolo di sessanta gradi.</p>`}
]},


/* ---------------- 03c · ESERCIZI ---------------- */
{ num:'09', title:'Esercizi — tocca a te', meta:'proprio o no · la bottiglia di Klein e le autointersezioni · e l’intorno tubolare del nastro',
  blocchi:[
  {t:'esercizio', title:'1 · Tre mappe, e solo una e un incassamento',
   src:'il modo piu rapido per fissare la differenza fra le tre nozioni',
   testo:R`Per ciascuna di queste mappe da $\mathbb{R}$ (o da un intervallo) a $\mathbb{R}^{2}$, stabilisci se è un'immersione, se è iniettiva, se è propria, e se l'immagine è una sottovarietà: (a) $t\mapsto(t,t^{2})$; (b) $t\mapsto(t^{2}-1,t^{3}-t)$; (c) $t\mapsto\left(\frac{t}{1+t^{2}},\frac{t^{2}}{1+t^{2}}\right)$ su tutto $\mathbb{R}$.`,
   steps:[
    {label:'Le prime due', body:R`
    <p>Conviene procedere sempre nello stesso ordine — immersione, iniettività, properness — perché le tre condizioni si controllano con tecniche diverse: la prima derivando, la seconda risolvendo un'equazione, la terza guardando cosa succede all'infinito.</p>
    <p><b>(a) La parabola.</b> Derivata $(1,2t)$, mai nulla: immersione. Iniettiva perché lo è già la prima componente. Propria perché la controimmagine di un compatto è chiusa e limitata (la prima componente esplode all'infinito). <b>Quindi è un incassamento</b>, e l'immagine è una sottovarietà — come dev'essere, essendo un grafico.</p>
    <p><b>(b) Il nodo.</b> Derivata $(2t,3t^{2}-1)$: le due componenti non si annullano insieme, perché $t=0$ annulla la prima e non la seconda. Quindi è un'immersione. <b>Non iniettiva</b>: $t=\pm1$ danno entrambi l'origine. L'immagine ha un punto doppio e <b>non è una sottovarietà</b> — nell'origine un intorno tolto il punto ha quattro componenti connesse invece di due.</p>`},
    {label:'La terza, che e il caso interessante', body:R`
    <p><b>(c)</b> Si verifica che l'immagine sta sulla circonferenza di centro $(0,\tfrac12)$ e raggio $\tfrac12$, meno il punto $(0,1)$. La mappa è iniettiva ed è un'immersione; ma <b>non è propria</b>: per $t\to+\infty$ e per $t\to-\infty$ l'immagine tende allo stesso punto $(0,1)$, quindi la controimmagine di un compatto che contiene quel punto è tutta una coda illimitata di $\mathbb{R}$.</p>
    <p><b>L'immagine non è una sottovarietà</b>: è una circonferenza bucata, che come insieme è una varietà, ma la struttura indotta dalla mappa non coincide con quella indotta dall'ambiente vicino al punto mancante — e infatti la mappa non è un omeomorfismo sull'immagine con la topologia indotta. <b>È il controesempio che mostra perché la properness serve</b>: le altre due condizioni erano entrambe soddisfatte.</p>`}
   ]},
  {t:'plot', title:'Le tre mappe dell’esercizio, disegnate',
   intro:R`A sinistra la parabola (incassamento) e il nodo (immersione non iniettiva); a destra la curva (c), che è iniettiva ma non propria — i due rami si avvicinano indefinitamente al punto in alto senza raggiungerlo.`,
   plots:[
    {kind:'curve', x:'t', y:'t*t', tr:[-1.6,1.6], height:310,
     xr:[-2.2,2.2], yr:[-0.6,2.8],
     title:'(a) parabola e (b) nodo: la prima e un incassamento, il secondo no',
     segs:[{x1:-2.2, y1:0, x2:2.2, y2:0, col:'#4d5a6b', width:1}],
     marks:[{x:0, y:0, label:'nessun problema', col:'#5eead4', up:true}]},
    {kind:'curve', x:'t/(1+t*t)', y:'t*t/(1+t*t)', tr:[-30,30], height:310, equal:true,
     xr:[-0.75,0.75], yr:[-0.15,1.25],
     title:'(c) iniettiva, immersione, NON propria: il punto in alto manca',
     marks:[{x:0, y:1, label:'punto mai raggiunto', col:'#ff6b6b', up:true, hollow:true},
            {x:0, y:0, label:'t=0', col:'#5eead4', up:true}]}
   ],
   leggi:R`<p><b>Nel pannello di destra la curva sembra chiusa e non lo è.</b> Percorrendola da $t=-\infty$ a $t=+\infty$ si parte arbitrariamente vicino al punto in alto, si scende, si fa il giro e si risale verso lo stesso punto senza mai toccarlo. L'immagine è una circonferenza privata di un punto, e come <i>insieme</i> è una varietà perfettamente liscia.</p>
   <p><b>Il guasto non è nell'immagine ma nella mappa</b>: la topologia che $\mathbb{R}$ induce sull'immagine attraverso la mappa non coincide con quella indotta dall'ambiente. Due punti vicinissimi sulla circonferenza — uno con $t$ molto grande, l'altro con $t$ molto negativo — corrispondono a parametri lontanissimi. <b>La mappa è una biiezione continua ma non un <span class="str" data-str="omeomorfismo">omeomorfismo</span> sull'immagine</b>, ed è precisamente ciò che la properness serve a escludere.</p>
   <p>Nel pannello di sinistra la parabola non ha nessuno di questi problemi, e il nodo — che qui non è disegnato ma si è calcolato nell'esercizio — fallisce per una ragione completamente diversa, l'iniettività. <b>Tre condizioni indipendenti, e ne basta una che manchi</b>: è il motivo per cui la definizione di sottovarietà le richiede tutte e tre invece di accontentarsi della più intuitiva.</p>`},
  {t:'esercizio', title:'2 · La bottiglia di Klein, e perche si disegna sempre sbagliata',
   src:'lesempio che rende concreto il teorema di Whitney',
   testo:R`La bottiglia di Klein $K$ è una superficie compatta ($n=2$). In quale $\mathbb{R}^{N}$ garantisce Whitney che si immerga? E perché tutti i disegni che se ne vedono hanno un'autointersezione?`,
   steps:[
    {label:'Il conto', body:R`
    <p>La versione debole dimostrata sopra dà $N=2n+1=5$; quella forte migliora a $N=2n=4$: <b>la bottiglia di Klein si incassa in $\mathbb{R}^{4}$</b>, senza autointersezioni. In $\mathbb{R}^{3}$ invece non si incassa — lo dimostriamo nel passo seguente, con un argomento di orientabilità.</p>`},
    {label:'Perche i disegni si autointersecano', body:R`
    <p>Perché in $\mathbb{R}^{3}$ non c'è modo di farne a meno. Quello che si disegna è un'<b>immersione</b> di $K$ in $\mathbb{R}^{3}$ — differenziale iniettivo ovunque — che però non è iniettiva: il collo attraversa la parete. <b>L'autointersezione è un difetto della rappresentazione, non dell'oggetto</b>, ed è esattamente il contenuto della distinzione immersione/incassamento.</p>
    <p>La verifica che $K$ non si incassa in $\mathbb{R}^{3}$ è un argomento di orientabilità, e vale la pena tenerlo: una superficie chiusa incassata in $\mathbb{R}^{3}$ separa lo spazio in un dentro e un fuori, e scegliendo in ogni punto la normale che punta verso l'esterno si ottiene un campo normale continuo — cioè un'orientazione. <b>Una superficie non orientabile non può quindi stare in $\mathbb{R}^{3}$ senza intersecarsi</b>, e la bottiglia di Klein non è orientabile.</p>
    <p><b>L'analogia che aiuta</b>: un nodo in $\mathbb{R}^{3}$ disegnato su un foglio ha incroci, ma il nodo vero non si autointerseca — gli incroci sono un artefatto della proiezione da tre a due dimensioni. La bottiglia disegnata in $\mathbb{R}^{3}$ è la proiezione di un oggetto che vive in $\mathbb{R}^{4}$, e l'autointersezione è l'ombra di quella proiezione. <b>Una dimensione in più è esattamente ciò che serve per districare</b>, ed è lo stesso motivo per cui in $\mathbb{R}^{4}$ non esistono nodi annodati di curve.</p>`}
   ]},
  {t:'collaudo', title:'Controlla di aver capito', html:R`
  <ol>
  <li>Perché su una varietà compatta ogni mappa continua è propria?</li>
  <li>Che cosa afferma esattamente l'esistenza di un intorno tubolare, e a che cosa serve?</li>
  <li>Se $M$ si immerge in $\mathbb{R}^{N}$, si immerge anche in $\mathbb{R}^{N+1}$. E il viceversa?</li>
  </ol>`,
   sol:R`<ol>
   <li>Perché la controimmagine di un <span class="str" data-str="compattezza">compatto</span> è un <b>chiuso dentro un compatto</b>, quindi compatta. <b>La compattezza del dominio rende automatica la condizione</b>, ed è il motivo per cui tutti gli enunciati si semplificano nel caso compatto: immersione più iniettività bastano. Le patologie — la retta densa sul toro, la circonferenza bucata dell'esercizio — richiedono tutte un dominio non compatto.</li>
   <li>Che ogni sottovarietà $S\subseteq M$ ha un intorno aperto diffeomorfo al <b>fibrato normale</b> di $S$, con $S$ che corrisponde alla sezione nulla. In parole: un intorno di $S$ somiglia a $S$ «ingrassata» in modo uniforme, e ogni punto vicino ha una proiezione ben definita su $S$. <b>Serve per trasportare problemi da $M$ a $S$</b> e viceversa: estendere campi, costruire <span class="str" data-str="omotopia">omotopie</span>, definire il grado. È lo strumento tecnico che rende utilizzabili le sottovarietà.</li>
   <li>Il primo verso è ovvio: si compone con l'inclusione $\mathbb{R}^{N}\subset\mathbb{R}^{N+1}$. <b>Il viceversa è falso</b>, e $\mathbb{RP}^{2}$ lo dimostra: si immerge in $\mathbb{R}^{4}$ e non in $\mathbb{R}^{3}$. <b>Esiste quindi una dimensione minima di immersione per ogni varietà</b>, che è un invariante non banale e che Whitney limita superiormente con $2n$ — senza dire quale sia nei casi concreti. Per le sfere è $n+1$, per gli spazi proiettivi dipende da $n$ in modo aritmeticamente complicato.</li>
   </ol>`}
]},

/* ---------------- 04 · IL SENSO ---------------- */
{ num:'10', title:'Il senso, e le rotte', meta:'cosa chiude il primo blocco del corso, e cosa apre',
  blocchi:[
  {t:'prosa', title:'Cosa lascia in mano', tag:'sintesi', html:R`
  <p><b>Il punto.</b> La <b>propriezza</b> è la condizione che manca ogni volta che si vuole dedurre qualcosa sull&rsquo;<i>immagine</i> di una mappa da ipotesi sul <i>differenziale</i>. Le condizioni sul differenziale sono locali nel dominio; l&rsquo;immagine è un fatto globale, e serve un&rsquo;ipotesi globale.</p>
  <p><b>Che cosa resta da fare.</b> Il teorema di genericità usato qui in modo informale — un'immagine di dimensione minore ha misura nulla — è il teorema di Sard, e va dimostrato. Dopo di lui il corso cambia direzione: dai sottoinsiemi di una varietà ai campi vettoriali che vivono sopra, ai loro flussi e alle equazioni differenziali.</p>`},
  {t:'prolessi', title:'Dove riappare questo movimento',
   oggetto:R`<b>La propriezza</b> e l&rsquo;<b>intorno tubolare</b>: quando il locale determina il globale, e quando serve altro.`,
   rotte:[
    {dove:'Topologia<br>differenziale', txt:R`L'intorno tubolare e' lo strumento con cui si definiscono il <b>grado</b> di una mappa, l'indice di intersezione e la teoria del cobordismo: tutta la macchina che estrae numeri interi dalla geometria.`},
    {dove:'Teoria<br>dei campi', txt:R`I <b>difetti topologici</b> (vortici, stringhe, monopoli) sono sottovarieta' dove il parametro d'ordine degenera, e il loro intorno tubolare e' cio' che permette di classificarli guardando il comportamento su una piccola sfera attorno.`},
    {dove:'Analisi<br>globale', txt:R`La propriezza e' la condizione che rende compatti gli spazi di soluzioni di equazioni differenziali (compattezza di Gromov, moduli di curve): senza, le successioni di soluzioni «scappano» e la teoria non chiude.`},
    {dove:'Robotica<br>e controllo', txt:R`Lo spazio delle configurazioni di un meccanismo e' una varieta' astratta; <b>Whitney garantisce che si possa parametrizzare con un numero finito di coordinate globali</b>, ed e' cio' che rende possibile calcolarci sopra.`}
   ],
   domanda:R`Whitney dice che ogni varietà entra in $\mathbb{R}^{2n}$, ma l&rsquo;immersione è arbitraria. <b>Domanda che porti avanti:</b> quante immersioni essenzialmente diverse esistono, e quando due si possono deformare l&rsquo;una nell&rsquo;altra? Per le curve chiuse in $\mathbb{R}^3$ la risposta è la <b>teoria dei nodi</b> — un cerchio immerso può essere annodato in infiniti modi non equivalenti, benché la varietà astratta sia sempre $S^1$. <b>Tutta l&rsquo;informazione sta nell&rsquo;immersione, non nella varietà</b>, ed è il punto in cui la geometria intrinseca e quella estrinseca si separano davvero.`}
]}

];

  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';
  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionSvelabile(title, tag, html, sol){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var c=document.createElement('div'); c.className='collaudo-item';
  var q=document.createElement('div'); q.className='cq'; q.innerHTML=html||'';
  c.appendChild(q); typeset(q);
  if(sol){
    var a=document.createElement('div'); a.className='ca'; a.style.display='none';
    a.innerHTML='<b>Soluzione.</b> '+sol;
    var btn=document.createElement('button'); btn.className='reveal-btn small';
    btn.textContent='Rivela la soluzione';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a);
      btn.disabled=true; btn.classList.add('done'); btn.textContent='Soluzione rivelata'; };
    c.appendChild(btn); c.appendChild(a);
  }
  wrap.appendChild(c); return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    /* DUE SCHEMI, NON UNO — scoperto il 2026-10-06 provando le pagine vive. I movimenti
       scritti per primi (em-01..03, me-10b, i collaudi di gd-01..09 e di quattro em)
       usano una forma piu' semplice: `reveal` e `prolessi` con un solo `html`,
       `esercizio` e `collaudo` con `html` + `sol`. Il renderer ne conosceva una sola e
       chiamava `steps.forEach` su `undefined`: TypeError, e la tappa si fermava li' —
       62 blocchi in 17 movimenti su 74. Non si riscrive il contenuto per far contento
       il renderer: e' il renderer che deve leggere cio' che c'e'.
       E in fondo un ramo che NON muore: uno schema nuovo di domani deve far vedere un
       avviso in quella sezione, non spegnere la pagina sotto di se'. */
    try{
      if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
      else if(b.t==='prolessi') m.appendChild(b.rotte ? sectionProlessi(b)
                                   : sectionProsa(b.title,'prolessi',b.html));
      else if(b.t==='reveal')m.appendChild(b.steps ? sectionReveal(b.title,b.tag,b.steps)
                                   : sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='esercizio') m.appendChild(b.steps ? sectionEsercizio(b)
                                   : sectionSvelabile(b.title,'esercizio',b.html,b.sol));
      else if(b.t==='collaudo')  m.appendChild(b.items ? sectionCollaudo(b.title,b.items)
                                   : sectionSvelabile(b.title,'provi, poi riveli',b.html,b.sol));
      else if(b.t==='plot')      m.appendChild(sectionPlot(b));
      else m.appendChild(sectionProsa(b.title||'(blocco)', 'tipo sconosciuto: '+b.t,
                                      b.html||''));
    }catch(err){
      var avv=document.createElement('section'); avv.className='section';
      avv.innerHTML='<h3>'+(b.title||'(blocco)')+'<span class="tag">non reso</span></h3>'
        +'<p style="color:#ff6b6b">Questo blocco non si &egrave; potuto rendere ('
        +b.t+': '+err.message+'). Il resto della tappa continua sotto.</p>';
      m.appendChild(avv);
    }
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* I POP-UP DEGLI STRUMENTI. `cablaStrumenti` esisteva dal 18-09 e non la chiamava
     nessuno: i 229 rimandi del percorso erano <span> senza handler, e il clic non
     faceva niente. Nessun controllo poteva vederlo — la sintassi era valida, le schede
     c'erano tutte, le formule rendevano: il guasto esisteva solo a pagina viva. Qui, e
     dopo ogni inserimento successivo, perche' la tappa si rimonta da capo a ogni
     cambio e gli handler vanno riattaccati al DOM nuovo. */
  cablaStrumenti(m);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}

/* deep-link: gd-09-immersioni-whitney.html#03 apre direttamente la tappa 03 */
window.addEventListener('DOMContentLoaded', function(){
  var h=(location.hash||'').replace('#','');
  showTappa(byId[h]?h:'00');
});
window.addEventListener('hashchange', function(){
  var h=(location.hash||'').replace('#','');
  if(byId[h]) showTappa(h);
});
</script>
