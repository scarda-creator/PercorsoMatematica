function elFromHTML(html){ var d=document.createElement('div'); d.innerHTML=html; return d; }

/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un
   rimando scritto nella prosa:

       <span class="str" data-str="serie-geometrica">la serie geometrica</span>

   Apertura: lo stesso gesto del collaudo (si clicca, il pannello compare,
   si typeset una volta sola), portato dentro la frase.

var CORSO = 'meccanica-quantistica';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["spazio-di-hilbert"] = {"nome":"Spazio di Hilbert","riga":"E' uno spazio vettoriale complesso con prodotto interno, completo nella norma che ne deriva e separabile, cosicche' ogni stato si scrive come somma numerabile $|\\psi\\rangle=\\sum_n c_n|n\\rangle$ con $c_n=\\langle n|\\psi\\rangle$.","serve":"E' la casa degli stati, e le tre parole della definizione fanno tre lavori diversi. Il prodotto interno da' le ampiezze, e quindi le probabilita'. La completezza garantisce che il limite di una successione di stati sia ancora uno stato: senza, uno sviluppo in serie potrebbe convergere fuori dallo spazio. La separabilita' permette di scrivere un vettore con una lista numerabile di coefficienti, cioe' di fare i conti.","esempio":"La relazione di completezza $\\sum_n|n\\rangle\\langle n|=\\hat 1$ e' lo strumento operativo piu' usato della teoria: infilata dentro un prodotto scalare lo spezza in una somma. La norma diventa $\\langle\\psi|\\psi\\rangle=\\sum_n|c_n|^{2}$, e se lo stato e' normalizzato quella somma vale uno: i moduli quadri dei coefficienti sono probabilita', e sommano a uno per costruzione.","debito":"la costruzione di $L^{2}$ come completamento, la misura di Lebesgue che serve a definirlo e il teorema di Riesz-Fischer stanno nei movimenti di Metodi; qui si usa il risultato.","controllo":[{"tipo":"somma","espr":"(1/2)**n","var":"n","da":"1","a":"oo","vale":"1","ipotesi":{"n":"positive-integer"},"dove":"esempio","appare":"sommano a uno"},{"tipo":"simbolico","dove":"esempio","appare":"\\sum_n|n\\rangle\\langle n|=\\hat 1","perche":"e' la relazione di completezza: i proiettori sugli elementi di una base ortonormale sommano all'identita'. E' la proprieta' che definisce una base completa, non un conto"}],"qui":{},"pieno":null};
STRUM["simmetrie"] = {"nome":"Simmetrie","riga":"L'insieme delle trasformazioni che lasciano identica la sorgente, e che perciò devono lasciare identico anche il campo che ne nasce.","serve":"È il ragionamento che decide la FORMA del campo prima di calcolarlo, e senza il quale la legge di Gauss non serve a niente: Gauss dà un solo numero — il flusso totale — e da un numero si ricava un campo soltanto se si sa già in che direzione punta e da quali variabili dipende. L'argomento ha una forma sola: se una trasformazione lascia identica la distribuzione di carica, lascia identico il campo; quindi ogni componente che quella trasformazione cambierebbe deve essere nulla, e ogni variabile che essa sposta non può comparire.","esempio":"Per un filo infinito uniformemente carico, la traslazione lungo il filo e la rotazione attorno a esso lasciano la carica identica: $\\mathbf E$ non può dipendere né da $z$ né dall'angolo. La riflessione nel piano perpendicolare al filo manderebbe $E_z$ in $-E_z$ lasciando uguale la sorgente, quindi $E_z=0$; resta la sola componente radiale $E_r(r)$. Solo a quel punto il cilindro coassiale è la superficie giusta, e Gauss dà $E_r\\cdot 2\\pi rL=\\dfrac{\\lambda L}{\\varepsilon_0}$, da cui $E_r=\\dfrac{\\lambda}{2\\pi\\varepsilon_0 r}$.","qui":{"meccanica-quantistica":{"serve":"Qui l'argomento di simmetria non decide la forma di un campo: decide la forma degli OPERATORI, ed è il modo in cui questo corso costruisce la teoria. Lo schema è lo stesso — una trasformazione che lascia identica la situazione fisica deve lasciare identica la descrizione — ma la conseguenza è più forte: ogni trasformazione di simmetria continua è realizzata da un operatore unitario, ogni operatore unitario continuo è l'esponenziale di un generatore autoaggiunto, e quel generatore è una quantità conservata. Impulso, momento angolare ed energia non si postulano: sono i generatori delle traslazioni, delle rotazioni e delle traslazioni temporali.","esempio":"Lo spazio è omogeneo, quindi traslare un sistema isolato non ne cambia la fisica: $\\hat U(a)=e^{-ia\\hat P/\\hbar}$ deve commutare con $\\hat H$. Al primo ordine in $a$ questo dà $[\\hat P,\\hat H]=0$, e quindi $\\dfrac{d}{dt}\\langle \\hat P\\rangle=0$: l'omogeneità dello spazio è la conservazione dell'impulso, e il passaggio da una all'altra è di due righe."}},"debito":"nessun nucleo del percorso tratta l'argomento di simmetria come strumento a sé: qui c'è la forma dell'argomento e non la sua giustificazione, che è di teoria dei gruppi e sta fuori dal percorso costruito finora. Quello che il percorso copre è il pezzo di destra — l'integrale di flusso, nel nucleo 03 tappa 04 — non il pezzo di sinistra che decide quale superficie scegliere.","controllo":[{"tipo":"uguale","sinistra":"(lam/(2*pi*e0*r))*2*pi*r*L","vale":"lam*L/e0","dove":"esempio","appare":"\\dfrac{\\lambda L}{\\varepsilon_0}"}]};
STRUM["operatore-unitario"] = {"nome":"Operatore unitario","riga":"Un operatore $\\hat U$ e' unitario quando $\\hat U^{\\dagger}\\hat U=\\hat U\\hat U^{\\dagger}=\\mathbb 1$, cioe' $\\hat U^{\\dagger}=\\hat U^{-1}$, il che equivale a conservare il prodotto interno: $\\langle \\hat U\\phi|\\hat U\\psi\\rangle=\\langle\\phi|\\psi\\rangle$ per ogni coppia di stati.","serve":"Conservare il prodotto interno vuol dire conservare le probabilita': ogni trasformazione fisica che non cambia gli esiti di una misura — un cambio di base, una traslazione, una rotazione, l'evoluzione temporale — e' unitaria. I suoi autovalori hanno modulo uno, e due osservabili legate da un operatore unitario hanno lo stesso spettro.","esempio":"La rotazione del piano $\\hat U=\\begin{pmatrix}\\cos\\theta&-\\sin\\theta\\\\\\sin\\theta&\\cos\\theta\\end{pmatrix}$ e' unitaria — il prodotto $\\hat U^{\\dagger}\\hat U$ ha sulla diagonale $\\cos^2\\theta+\\sin^2\\theta=1$ e zero fuori — e ha autovalori $e^{\\pm i\\theta}$, di modulo $|e^{i\\theta}|=1$. La matrice $S$ del cambio di base ortonormale e' unitaria per lo stesso motivo: manda una base ortonormale in un'altra.","debito":"la trasformata di Cayley $\\hat U=(\\hat A-i)/(\\hat A+i)$, che lega operatori autoaggiunti e unitari e con cui von Neumann risolve il problema agli autovalori in dimensione infinita, si cita e non si costruisce.","controllo":[{"tipo":"uguale","sinistra":"Abs(exp(I*theta))","vale":"1","ipotesi":{"theta":"real"},"dove":"esempio","appare":"|e^{i\\theta}|=1"},{"tipo":"uguale","sinistra":"Matrix([[cos(th),-sin(th)],[sin(th),cos(th)]]).T*Matrix([[cos(th),-sin(th)],[sin(th),cos(th)]])","vale":"Matrix([[1,0],[0,1]])","ipotesi":{"th":"real"},"dove":"esempio","appare":"\\cos^2\\theta+\\sin^2\\theta=1"}],"qui":{},"pieno":null};
STRUM["operatore-aggiunto"] = {"nome":"Operatore aggiunto e autoaggiunto","riga":"L'aggiunto e' definito da $\\langle\\phi|\\hat A\\psi\\rangle=\\langle\\hat A^{\\dagger}\\phi|\\psi\\rangle$ per ogni coppia di stati, e l'operatore e' autoaggiunto quando coincidono sia $\\hat A^{\\dagger}$ con $\\hat A$ sia i loro domini.","serve":"E' la condizione che rende un operatore un'osservabile: autovalori reali, e autovettori di autovalori distinti ortogonali. In dimensione finita «autoaggiunto» e «hermitiano» coincidono; in dimensione infinita no, e la differenza non e' pedanteria — l'operatore impulso su una semiretta e' hermitiano e non autoaggiunto, e infatti non e' un'osservabile.","esempio":"Se $\\hat A\\psi=a\\psi$ con $\\hat A$ autoaggiunto, allora $a\\langle\\psi|\\psi\\rangle=\\langle\\psi|\\hat A\\psi\\rangle=\\langle\\hat A\\psi|\\psi\\rangle=a^{*}\\langle\\psi|\\psi\\rangle$; siccome la norma non e' nulla segue $a=a^{*}$, cioe' l'autovalore e' reale. Tre righe, e sono la ragione per cui le osservabili si rappresentano cosi'.","debito":"la distinzione fra hermitiano e autoaggiunto in dimensione infinita — domini, estensioni, indici di difetto — e' il programma di von Neumann e sta fuori da questo percorso: qui si dichiara che esiste e si lavora nel caso buono. La regola di inversione dell'ordine nell'aggiunto di un prodotto si usa e non si dimostra.","controllo":[{"tipo":"uguale","sinistra":"conjugate(a)","vale":"a","ipotesi":{"a":"real"},"dove":"esempio","appare":"a=a^{*}"}],"qui":{},"pieno":null};
STRUM["parentesi-di-poisson"] = {"nome":"Parentesi di Poisson","riga":"$\\{f,g\\}=\\sum_k\\Big(\\dfrac{\\partial f}{\\partial q_k}\\dfrac{\\partial g}{\\partial p_k}-\\dfrac{\\partial f}{\\partial p_k}\\dfrac{\\partial g}{\\partial q_k}\\Big)$: l'operazione antisimmetrica che, date due funzioni sullo spazio delle fasi, dice di quanto la prima cambia lungo il flusso generato dalla seconda.","serve":"A leggere la meccanica hamiltoniana come una teoria di trasformazioni invece che di traiettorie. Ogni funzione $g(q,p)$ genera una trasformazione canonica infinitesima, $\\delta f=\\varepsilon\\{f,g\\}$, e l'evoluzione temporale e' il caso particolare $g=H$: $\\dot f=\\{f,H\\}$. Da qui escono due cose che non si vedono nelle equazioni di Newton: una quantita' si conserva esattamente quando la trasformazione che genera lascia invariata $H$, e le parentesi fra le coordinate — $\\{q_j,p_k\\}=\\delta_{jk}$ — sono l'unica struttura che una trasformazione canonica deve preservare.","esempio":"Per $H=\\dfrac{p^2}{2m}+V(q)$ con un grado di liberta' le due parentesi fondamentali sono le equazioni di Hamilton riscritte. La coordinata: $\\{q,H\\}=\\dfrac{\\partial q}{\\partial q}\\dfrac{\\partial H}{\\partial p}-\\dfrac{\\partial q}{\\partial p}\\dfrac{\\partial H}{\\partial q}=\\dfrac{p}{m}$, cioe' $\\dot q=p/m$. L'impulso: $\\{p,H\\}=-\\dfrac{\\partial V}{\\partial q}$, cioe' $\\dot p=-V'(q)$, la seconda legge di Newton. E la parentesi fondamentale, calcolata dalla definizione, vale $\\{q,p\\}=1$.","debito":"la dimostrazione che le parentesi di Poisson sono invarianti per trasformazioni canoniche non c'e' qui: e' il contenuto di un corso di meccanica analitica. Qui si usa il fatto, e si usa nella forma che serve — una trasformazione e' canonica quando preserva $\\{q_j,p_k\\}=\\delta_{jk}$.","qui":{"meccanica-quantistica":{"serve":"A capire da dove viene il commutatore, invece di impararlo. L'idea di Dirac e' che la corrispondenza $\\{f,g\\}\\to\\dfrac{1}{i\\hbar}[\\hat f,\\hat g]$ non sia un'analogia decorativa ma la struttura che sopravvive: la trasformazione canonica infinitesima generata da $g$ diventa la trasformazione unitaria infinitesima generata dall'operatore autoaggiunto corrispondente, e il teorema di Noether classico — $\\{g,H\\}=0$ implica $g$ conservata — diventa $[\\hat K,\\hat H]=0$ implica $\\langle \\hat K\\rangle$ costante.","esempio":"Per $H=\\dfrac{p^2}{2m}+V(q)$ si ha $\\{p,H\\}=-\\dfrac{\\partial V}{\\partial q}$: l'impulso si conserva esattamente quando il potenziale non dipende da $q$, cioe' quando il sistema e' invariante per traslazioni. Il conto quantistico corrispondente da' $[\\hat p,\\hat H]=-i\\hbar\\,V'(\\hat q)$, con la stessa conclusione e lo stesso meccanismo."}},"controllo":[{"tipo":"uguale","sinistra":"diff(q,q)*diff(p,p)-diff(q,p)*diff(p,q)","vale":"1","dove":"esempio","appare":"\\{q,p\\}=1"},{"tipo":"uguale","sinistra":"diff(q,q)*diff(p**2/(2*m)+V(q),p)-diff(q,p)*diff(p**2/(2*m)+V(q),q)","vale":"p/m","ipotesi":{"V":"funzione","m":"positive","p":"real","q":"real"},"dove":"esempio","appare":"=\\dfrac{p}{m}"},{"tipo":"uguale","sinistra":"-diff(p**2/(2*m)+V(q),q)","vale":"-diff(V(q),q)","ipotesi":{"V":"funzione","m":"positive","p":"real","q":"real"},"dove":"esempio","appare":"\\{p,H\\}=-\\dfrac{\\partial V}{\\partial q}"}],"pieno":null};
STRUM["commutatore"] = {"nome":"Commutatore","riga":"$[\\hat A,\\hat B]=\\hat A\\hat B-\\hat B\\hat A$, antisimmetrico, con la regola di Leibniz $[\\hat A,\\hat B\\hat C]=[\\hat A,\\hat B]\\hat C+\\hat B[\\hat A,\\hat C]$ e la relazione canonica $[\\hat x,\\hat p]=i\\hbar$.","serve":"E' la misura di quanto due operazioni dipendano dall'ordine, e qui l'ordine e' fisica: due osservabili che non commutano non hanno una base comune di autostati, quindi non si misurano insieme con precisione arbitraria. Quasi ogni conto che sembra magico — l'algebra del momento angolare, gli operatori di salita e discesa, il teorema di Ehrenfest — e' una manipolazione di commutatori fatta con quelle regole e nient'altro.","esempio":"Dalla regola di Leibniz, $[\\hat x,\\hat p^{2}]=[\\hat x,\\hat p]\\hat p+\\hat p[\\hat x,\\hat p]=2i\\hbar\\hat p$. E' il conto che fa uscire il teorema di Ehrenfest: la meccanica classica ricompare come relazione fra valori medi, e ricompare perche' quel commutatore vale proprio $2i\\hbar\\hat p$.","debito":"l'identita' di Jacobi si enuncia e non si dimostra; la corrispondenza fra commutatore e parentesi di Poisson — che e' l'idea di Dirac e non un'analogia decorativa — sta in mq-07, e li' va letta per intero.","controllo":[{"tipo":"uguale","sinistra":"I*hbar*p + p*I*hbar","vale":"2*I*hbar*p","ipotesi":{"hbar":"positive","p":"real"},"dove":"esempio","appare":"2i\\hbar\\hat p"},{"tipo":"simbolico","dove":"riga","appare":"[\\hat x,\\hat p]=i\\hbar","perche":"e' la relazione di commutazione canonica, il POSTULATO da cui discende il resto della teoria: non si dimostra, si assume, ed e' cio' che separa la meccanica quantistica dalla classica"}],"qui":{},"pieno":null};
STRUM["derivazione"] = {"nome":"Derivazione (regola di Leibniz)","riga":"Un operatore lineare $D$ su un'algebra che rispetta la regola del prodotto: $D(fg)=f\\,D(g)+g\\,D(f)$. È la proprietà che isola «derivare» fra tutti gli operatori lineari possibili.","serve":"È il modo algebrico di definire la derivata senza limiti, e serve ogni volta che si vuole derivare su un oggetto dove non c'è un rapporto incrementale da fare — su una varietà astratta, su un'algebra di matrici, su un anello di polinomi. La conseguenza operativa più usata è che **una derivazione è determinata dai suoi valori sui generatori**: su $\\mathbb{R}^{n}$ basta sapere quanto vale sulle coordinate $x^{1},\\dots,x^{n}$, e da lì Leibniz e la linearità danno tutto il resto. È il motivo per cui un vettore tangente, definito come derivazione, si scrive sempre come combinazione delle $\\partial/\\partial x^{i}$: non perché lo si sia scelto, ma perché non c'è altro. Un secondo fatto, che si dimostra in due righe e si usa continuamente: la **composizione** di due derivazioni non è una derivazione (compaiono derivate seconde), ma la loro **differenza incrociata** $DE-ED$ lo è, perché i termini secondi si cancellano a coppie.","esempio":"Su $\\mathbb{R}$, l'operatore $d/dx$ verificato sul prodotto $f=x^{2}$ e $g=x^{3}$: la regola dice $x^{2}\\cdot3x^{2}+x^{3}\\cdot2x$, cioè $5x^{4}$, e la derivata diretta di $x^{5}$ dà lo stesso $5x^{4}$. Il conto è banale ed è il punto: Leibniz non aggiunge informazione su $\\mathbb{R}$, dove la derivata si sa già fare. Aggiunge informazione quando è l'unica cosa che si ha — per esempio sull'algebra delle matrici, dove $D(A)=MA-AM$ per una matrice fissata $M$ è una derivazione, e la verifica di Leibniz consiste nello sviluppare $M(AB)-(AB)M$ e riconoscerlo come somma di $A\\,D(B)$ e $D(A)\\,B$, cosa che riesce perché i due termini $AMB$ introdotti dallo sviluppo compaiono con segni opposti e si cancellano.","debito":"che le derivazioni in un punto di una varietà siano esattamente i vettori tangenti è il teorema di gd-06 e non si ripete qui; il caso delle algebre non commutative è citato come esempio e non sviluppato.","controllo":[{"tipo":"uguale","sinistra":"x**2*3*x**2+x**3*2*x","vale":"5*x**4","ipotesi":{"x":"real"},"dove":"esempio","appare":"5x^{4}"},{"tipo":"derivata","espr":"x**5","rispetto":["x"],"vale":"5*x**4","ipotesi":{"x":"real"},"dove":"esempio","appare":"derivata diretta di $x^{5}$"}]};
STRUM["spettro"] = {"nome":"Spettro di un operatore","riga":"Lo spettro di un operatore e' l'insieme dei possibili esiti di una misura — i suoi autovalori — e puo' essere discreto (autovalori separati, autovettori in $\\mathcal H$), continuo (autovalori che riempiono un intervallo, autovettori non normalizzabili), o misto.","serve":"E' la quantita' che la fisica chiede davvero: scrivere l'hamiltoniana e trovarne lo spettro E' il problema d'esame. La distinzione discreto/continuo non e' tecnica — decide se un autostato e' uno stato preparabile (discreto) o una distribuzione che vive fuori dallo spazio di Hilbert (continuo), come l'onda piana e la delta.","esempio":"Per $\\sigma_z=\\begin{pmatrix}1&0\\\\0&-1\\end{pmatrix}$ lo spettro e' $\\{+1,-1\\}$, discreto, e i due invarianti della matrice lo riassumono senza risolvere l'equazione secolare: la somma degli autovalori e' la traccia, $\\operatorname{tr}\\sigma_z=0$, il loro prodotto e' il determinante, $\\det\\sigma_z=-1$. Per l'operatore posizione lo spettro e' tutta la retta reale, continuo, e gli autovettori sono delte di Dirac.","debito":"la costruzione rigorosa dello spettro continuo (teorema spettrale generalizzato, misura spettrale $E(\\lambda)$ di von Neumann) sta fuori da questo percorso: qui si dichiara che esiste e si lavora coi casi concreti. La separazione fra spettro continuo e spettro residuo non si tratta.","controllo":[{"tipo":"uguale","sinistra":"Matrix([[1,0],[0,-1]]).trace()","vale":"0","dove":"esempio","appare":"\\operatorname{tr}\\sigma_z=0"},{"tipo":"uguale","sinistra":"Matrix([[1,0],[0,-1]]).det()","vale":"-1","dove":"esempio","appare":"\\det\\sigma_z=-1"}],"qui":{},"pieno":null};
STRUM["disuguaglianza-di-schwarz"] = {"nome":"Disuguaglianza di Cauchy-Schwarz","riga":"$|\\langle\\phi|\\psi\\rangle|^{2}\\le\\langle\\phi|\\phi\\rangle\\,\\langle\\psi|\\psi\\rangle$, con l'uguaglianza se e solo se i due vettori sono proporzionali.","serve":"E' la disuguaglianza da cui nasce il principio di indeterminazione. Applicata agli scarti di due osservabili, e tenendo la sola parte immaginaria del prodotto scalare, da' un limite inferiore al prodotto delle due varianze pari al quadrato di $\\tfrac{1}{2i}\\langle[\\hat A,\\hat B]\\rangle$. L'indeterminazione non e' un postulato: e' Cauchy-Schwarz piu' un commutatore.","esempio":"Con posizione e impulso il commutatore vale $i\\hbar$, e la disuguaglianza diventa $\\sigma_x^{2}\\sigma_p^{2}\\ge\\hbar^{2}/4$, cioe' $\\sigma_x\\sigma_p\\ge\\hbar/2$. Il fattore un mezzo viene dal $2i$ al denominatore, non da una convenzione scelta.","debito":"la dimostrazione della disuguaglianza — il discriminante della norma quadra di una combinazione lineare — e' quella standard degli spazi con prodotto interno e non si ripete qui.","controllo":[{"tipo":"uguale","sinistra":"(1/(2*I)*(I*hbar))**2","vale":"hbar**2/4","ipotesi":{"hbar":"positive"},"dove":"esempio","appare":"\\hbar^{2}/4"},{"tipo":"uguale","sinistra":"sqrt(hbar**2/4)","vale":"hbar/2","ipotesi":{"hbar":"positive"},"dove":"esempio","appare":"\\hbar/2"}],"qui":{},"pieno":null};
STRUM["matrici-di-pauli"] = {"nome":"Matrici di Pauli","riga":"Sono le tre matrici $2\\times2$ hermitiane a traccia nulla il cui quadrato e' l'identita' e il cui commutatore riproduce l'algebra del momento angolare, da cui lo spin $\\hat S_i=\\tfrac{\\hbar}{2}\\sigma_i$.","serve":"Sono la rappresentazione piu' piccola non banale del momento angolare, e insieme all'identita' formano una base di tutte le matrici due per due hermitiane: qualunque osservabile di un sistema a due stati e' una combinazione dell'identita' e delle tre. Ogni conto di spin un mezzo — Stern-Gerlach, precessione, risonanza magnetica, qubit — si riduce alla loro algebra.","esempio":"Siccome il quadrato di una combinazione unitaria delle tre e' l'identita', qualunque esponenziale collassa: l'operatore di rotazione dello spinore diventa $\\cos(\\theta/2)$ per l'identita' meno $i\\sin(\\theta/2)$ per la combinazione. Il mezzo nell'angolo e' la ragione per cui una rotazione di un giro intero cambia segno allo stato, perche' $\\cos(\\pi)=-1$.","debito":"la costruzione generale delle rappresentazioni di SU(2) e il suo legame con SO(3) stanno nel movimento sul momento angolare; qui c'e' il caso di spin un mezzo con le sue regole di calcolo.","controllo":[{"tipo":"uguale","sinistra":"cos(2*pi/2)","vale":"-1","dove":"esempio","appare":"\\cos(\\pi)=-1"},{"tipo":"uguale","sinistra":"cos(pi/3)**2+sin(pi/3)**2","vale":"1","dove":"esempio","appare":"\\sin(\\theta/2)"}],"qui":{},"pieno":null};
STRUM["armoniche-sferiche"] = {"nome":"Armoniche sferiche","riga":"$Y_\\ell^{m}(\\theta,\\varphi)$ sono le autofunzioni simultanee di $\\hat L^{2}$, con autovalore $\\hbar^{2}\\ell(\\ell+1)$, e di $\\hat L_z$, con autovalore $\\hbar m$, ortonormali e complete sulla sfera.","serve":"Sono la parte angolare di ogni problema a simmetria sferica: appena il potenziale dipende solo dalla distanza, l'equazione si separa e la dipendenza angolare e' sempre una di queste, qualunque sia il potenziale. Cio' che cambia da problema a problema e' solo la parte radiale — per questo si imparano una volta e si riusano sempre.","esempio":"Per ogni $\\ell$ ci sono $2\\ell+1$ valori di $m$: e' la degenerazione essenziale di ogni livello a simmetria sferica, e non dipende dal potenziale. Per $\\ell=2$ vengono $2\\cdot2+1=5$ stati. La prima armonica e' costante, ed e' il motivo per cui lo stato fondamentale di un potenziale centrale e' sempre sfericamente simmetrico.","debito":"la costruzione esplicita dai polinomi di Legendre associati, e le formule di ricorrenza, non stanno qui: si usano gli enunciati e l'ortonormalita'.","controllo":[{"tipo":"uguale","sinistra":"2*2+1","vale":"5","dove":"esempio","appare":"2\\cdot2+1=5"},{"tipo":"simbolico","dove":"riga","appare":"\\hbar^{2}\\ell(\\ell+1)","perche":"e' l'autovalore del quadrato del momento angolare, che discende dall'algebra dei commutatori e non dalla forma esplicita delle armoniche. Si enuncia qui perche' e' cio' che le definisce"}],"qui":{},"pieno":null};
STRUM["polinomi-di-legendre"] = {"nome":"Polinomi di Legendre e funzioni associate","riga":"$P_\\ell(u)=(2^{\\ell}\\ell!)^{-1}\\big(\\tfrac{d}{du}\\big)^{\\ell}(u^{2}-1)^{\\ell}$ sono le soluzioni polinomiali dell'equazione di Legendre, ortogonali su $[-1,1]$, e le funzioni associate si ottengono da esse con $P_\\ell^{m}(u)=(1-u^{2})^{m/2}\\big(\\tfrac{d}{du}\\big)^{m}P_\\ell(u)$.","serve":"Sono la dipendenza da $\\theta$ di ogni problema a simmetria sferica, in qualunque campo della fisica: il momento angolare in quantistica, i multipoli in elettrostatica, le vibrazioni di una superficie sferica. La cosa da ricordare non e' la formula ma il motivo per cui quantizzano: l'equazione ha soluzioni per OGNI valore dei parametri, e la restrizione a $\\ell$ intero non negativo con $\\ell\\ge|m|$ viene solo dalla richiesta che la soluzione resti finita ai due poli $\\theta=0$ e $\\theta=\\pi$, che sono punti singolari dell'equazione.","esempio":"Dalla formula di Rodrigues con $\\ell=2$: si deriva due volte $(u^{2}-1)^{2}=u^{4}-2u^{2}+1$ ottenendo $12u^{2}-4$, e dividendo per $2^{2}\\cdot2!=8$ viene $P_2(u)=\\frac{3u^{2}-1}{2}$. La sua norma al quadrato vale $\\int_{-1}^{1}P_2(u)^{2}du=\\frac{2}{5}$, cioe' il caso $\\ell=2$ della formula generale $2/(2\\ell+1)$ — ed e' quel $2\\ell+1$ che compare nella normalizzazione delle armoniche sferiche. La funzione associata con $\\ell=m=1$ e' $P_1^{1}(u)=(1-u^{2})^{1/2}$, che in termini dell'angolo e' $\\sin\\theta$: per esempio a $\\theta=\\pi/3$ vale $\\frac{\\sqrt3}{2}$.","debito":"l'ortogonalita' con peso, le relazioni di ricorrenza, la funzione generatrice e il legame con lo sviluppo in multipoli stanno nei movimenti di Metodi sulle funzioni speciali; qui c'e' cio' che serve per riconoscere la parte angolare di un problema sferico e per sapere da dove viene la quantizzazione.","controllo":[{"tipo":"uguale","sinistra":"diff((u**2-1)**2, u, 2)","vale":"12*u**2 - 4","ipotesi":{"u":"real"},"dove":"esempio","appare":"12u^{2}-4"},{"tipo":"uguale","sinistra":"diff((u**2-1)**2, u, 2)/8","vale":"(3*u**2-1)/2","ipotesi":{"u":"real"},"dove":"esempio","appare":"P_2(u)=\\frac{3u^{2}-1}{2}"},{"tipo":"integrale","espr":"((3*u**2-1)/2)**2","var":"u","da":"-1","a":"1","vale":"2/5","ipotesi":{"u":"real"},"dove":"esempio","appare":"\\frac{2}{5}"},{"tipo":"uguale","sinistra":"2**2*factorial(2)","vale":"8","dove":"esempio","appare":"2^{2}\\cdot2!=8"},{"tipo":"uguale","sinistra":"2/(2*2+1)","vale":"2/5","dove":"esempio","appare":"2/(2\\ell+1)"},{"tipo":"uguale","sinistra":"expand((u**2-1)**2)","vale":"u**4-2*u**2+1","ipotesi":{"u":"real"},"dove":"esempio","appare":"u^{4}-2u^{2}+1"},{"tipo":"uguale","sinistra":"sqrt(1-cos(pi/3)**2)","vale":"sqrt(3)/2","dove":"esempio","appare":"(1-u^{2})^{1/2}"},{"tipo":"simbolico","dove":"riga","appare":"P_\\ell^{m}(u)=(1-u^{2})^{m/2}\\big(\\tfrac{d}{du}\\big)^{m}P_\\ell(u)","perche":"e' la definizione delle funzioni associate a partire dai polinomi, non un conto: contiene una derivata di ordine simbolico $m$ applicata a un polinomio di grado simbolico $\\ell$, e sympy non valuta derivate di ordine non numerico. Il caso concreto $\\ell=m=1$, che da' $\\sin\\theta$, e' immediato dalla definizione perche' $P_1(u)=u$ ha derivata uno"},{"tipo":"simbolico","dove":"riga","appare":"P_\\ell(u)=(2^{\\ell}\\ell!)^{-1}\\big(\\tfrac{d}{du}\\big)^{\\ell}(u^{2}-1)^{\\ell}","perche":"stessa ragione: la formula di Rodrigues ha l'ordine di derivazione simbolico. Il caso $\\ell=2$ e' verificato per intero dalle due asserzioni sull'esempio, che ricalcolano la derivata seconda e il fattore $8$"}],"qui":{"meccanica-quantistica":{"serve":"Appena si fissa che il numero quantico azimutale $m$ e' intero, l'equazione per la dipendenza da $\\theta$ delle autofunzioni di $L^{2}$ E' l'equazione di Legendre associata nella variabile $u=\\cos\\theta$. Da qui viene la seconda quantizzazione, quella di $\\ell$: le soluzioni esistono per ogni $\\ell$, ma restano finite ai poli solo se $\\ell$ e' intero non negativo con $\\ell\\ge|m|$. Il prodotto $e^{im\\varphi}P_\\ell^{|m|}(\\cos\\theta)$, normalizzato, e' l'armonica sferica.","esempio":"Con $\\ell=m=1$ si ha $P_1^{1}(\\cos\\theta)=\\sin\\theta$, quindi $Y_1^{1}\\propto\\sin\\theta\\,e^{i\\varphi}$: e' la forma che si riconosce a vista dentro gli stati degli scritti. E il fattore $2\\ell+1$ della normalizzazione viene dalla norma $2/(2\\ell+1)$ dei polinomi, non da altrove — per questo la degenerazione $2\\ell+1$ e il coefficiente delle armoniche portano lo stesso numero."}},"pieno":null};

function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';
  return h;
}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare

/* ---------------- 00 · DI COSA PARLA QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Di cosa parla questo movimento', meta:'Meccanica Quantistica · voci Q.10 e Q.18 · le rotazioni non commutano · lo spettro dalla sola algebra · i mezzi-interi gratis · le rotazioni finite',
  blocchi:[
  {t:'prosa', title:'La domanda, e perché la risposta non è un conto di meccanica quantistica', tag:'architettura', html:R`
  <p>Il momento angolare in meccanica quantistica si può presentare in due modi, e la differenza non è di stile. Il primo: si scrive $\mathbf M=\mathbf q\wedge\mathbf p$, si traducono le componenti in operatori differenziali, si passa in coordinate sferiche, si risolve l&rsquo;equazione agli autovalori e si trovano le armoniche sferiche. Il secondo: si osserva che <b>due rotazioni attorno ad assi diversi non commutano</b>, si traduce questo unico fatto geometrico in tre relazioni fra operatori, e da quelle tre relazioni si ricava <i>tutto</i> lo spettro senza aprire un&rsquo;equazione differenziale.</p>
  <p>Questo movimento percorre il secondo, e Picasso dichiara esattamente perché. Delle tre strade possibili per ottenere le regole di commutazione — il calcolo diretto, le parentesi di Poisson, la connessione con le rotazioni — scrive: &laquo;<i>seguiremo il terzo metodo (ma anche le (4.53)), che è senza dubbio il più significativo</i>&raquo; (pag. stampata 163). Il guadagno lo spiega venti righe dopo, quando il conto è finito: &laquo;<i>adesso però sappiamo che le (10.8) sono esclusivamente conseguenza del fatto che le $q_i$ sono le componenti di un vettore</i>&raquo;. Cioè: la strada lunga dice <i>da che cosa dipende</i> il risultato, e quindi <i>fin dove si estende</i>.</p>
  <p>Fin dove si estende è il punto. Il metodo algebrico non usa mai che $\mathbf M$ sia $\mathbf q\wedge\mathbf p$: usa soltanto che le sue tre componenti si commutino fra loro come fanno i generatori delle rotazioni. Quindi <b>vale per ogni oggetto che si trasformi come un momento angolare</b>, anche per uno che non ha nessun corrispettivo classico e nessuna funzione d&rsquo;onda nello spazio delle configurazioni. Picasso lo dice senza giri: &laquo;<i>i risultati che abbiamo trovato in questo paragrafo sono generali in quanto dipendono solo dalle regole di commutazione... ma non dal fatto che $\mathbf M$ sia definito come nelle (10.1)</i>&raquo;. E Dirac costruisce la teoria dello spin su questa frase sola.</p>`},
  {t:'prosa', title:'Il teorema, in quattro righe, e la sorpresa che contiene', tag:'architettura', html:R`
  <p><b>Prima riga.</b> Il gruppo delle rotazioni dello spazio non è commutativo, e il suo difetto di commutazione non è un disordine: è <i>misurabile</i>. Due rotazioni infinitesime di angolo $\varepsilon$ attorno a $x$ e $y$, fatte nei due ordini, differiscono per una rotazione di angolo $\varepsilon^{2}$ attorno a $z$. Questo è un fatto di geometria euclidea che si verifica con quattro matrici $3\times3$, e non contiene un grammo di fisica quantistica.</p>
  <p><b>Seconda riga.</b> Se a ogni rotazione corrisponde un operatore unitario sullo spazio degli stati, e se la corrispondenza rispetta la composizione, allora i generatori di quegli operatori unitari <i>devono</i> riprodurre quel difetto di commutazione. Scritto in operatori: $[M_i,M_j]=i\hbar\,\varepsilon_{ijk}M_k$. Le tre relazioni non sono un postulato: sono la geometria del gruppo, trasportata nello spazio di Hilbert.</p>
  <p><b>Terza riga.</b> Da quelle tre relazioni, e da nient&rsquo;altro, si costruiscono due operatori $M_\pm=M_1\pm iM_2$ che spostano l&rsquo;autovalore di $M_3$ di una unità, due catene di stati che devono interrompersi perché il modulo quadrato limita la proiezione, e un conto di due righe che lega il valore massimo della proiezione al modulo. Risultato: gli autovalori di $M^{2}$ sono $j(j+1)\hbar^{2}$ e quelli di $M_3$ sono $m\hbar$ con $m$ che va da $-j$ a $j$ a salti di uno. Quindi $2j$ è un intero.</p>
  <p><b>Quarta riga, ed è la sorpresa.</b> $2j$ intero significa che $j$ può essere <i>mezzo</i> intero. L&rsquo;algebra non lo vieta, e non ha nessun motivo per vietarlo: non sa che cosa sia una funzione d&rsquo;onda, non sa che l&rsquo;angolo azimutale è definito modulo $2\pi$, non sa niente di armoniche sferiche. <b>I mezzi-interi escono gratis, e sono la metà del contenuto di questo movimento</b> — perché sono esattamente ciò che la strada analitica non avrebbe mai prodotto, e perché descrivono l&rsquo;elettrone.</p>`},
  {t:'prosa', title:'Come è fatto il movimento', tag:'architettura', html:R`
  <p><b>La rotta.</b> La tappa 01 è geometria pura: il gruppo delle rotazioni, il quadratino che non si chiude, e il calcolo esatto del commutatore di due rotazioni finite. La 02 costruisce il ponte fra rotazioni e momento angolare per tre strade diverse — quella di Picasso (la funzione generatrice di una trasformazione canonica), quella di Dirac (l&rsquo;operatore $\hat r_z$ costruito come limite), quella di Landau (l&rsquo;operatore di rotazione infinitesima che <i>è</i> il momento angolare) — e dichiara dove divergono. La 03 ricava le regole di commutazione con tutte le loro conseguenze: con un vettore qualunque, con uno scalare qualunque, con $M^{2}$, e con l&rsquo;esempio del campo esterno che non è un vettore. La 04 introduce $M_\pm$ e le due catene. La 05 dimostra che le catene si interrompono e ricava lo spettro, con i mezzi-interi. La 06 calcola le costanti di normalizzazione e scrive le matrici per $j=\tfrac12,1,\tfrac32$, e si chiude con un argomento aritmetico di Ballentine che vale un capitolo di interpretazione. La 07 discute il modello vettoriale: che cosa la figura del cono dice di vero e in quale punto preciso mente. La 08 passa alle rotazioni finite — angoli di Euler, matrici $D^{(j)}$ e $d^{(j)}$, calcolate a mano nei due casi in cui la serie si chiude. La 09 è la rotazione di $2\pi$, con la regola di superselezione. La 10 è il punto in cui l&rsquo;algebra incontra $\mathbf q\wedge\mathbf p$ e i mezzi-interi muoiono per il momento angolare orbitale, con l&rsquo;argomento dei due oscillatori che non usa condizioni al contorno. La 11 è il mestiere: quattro pezzi di scritti reali del canale, svolti. La 12 tira il bilancio.</p>
  <p><b>Che cosa questo movimento non fa.</b> Non risolve l&rsquo;equazione agli autovalori di $L^{2}$ in coordinate sferiche e non costruisce le armoniche sferiche: le nomina, le usa come base angolare dove servono, e aggancia la scheda-strumento dove compaiono — la loro costruzione è il problema del campo centrale, che è un altro oggetto. Non tratta la composizione di due momenti angolari né i coefficienti di Clebsch-Gordan: qui c&rsquo;è <i>un</i> momento angolare, e la macchina che lo descrive. Non costruisce la teoria dello spin — si limita a mostrare che il caso $j=\tfrac12$ è ammesso dall&rsquo;algebra e a scriverne le matrici, perché servono a calcolare le rotazioni finite. E non tratta l&rsquo;accoppiamento spin-orbita, se non in un punto della tappa 11 dove serve solo il teorema degli scalari.</p>
  <p><b>Perché vale la pena di farlo con questa fatica.</b> Il momento angolare è l&rsquo;argomento con la densità d&rsquo;esame più alta di tutto il corso: compare in <b>36 scritti su 47</b>, con 133 menzioni, dal 2014 al 2024 — tre virgola sette menzioni per prova. Ma la ragione vera non è quella: è che il metodo algebrico di questa tappa 04 è <i>la stessa macchina</i> che risolve l&rsquo;oscillatore armonico, che produce lo spin, che produce i coefficienti di composizione e che in teoria dei campi produce lo spazio di Fock. Si impara una volta e si riusa quattro volte, e chi la impara sulla strada analitica deve ricominciare ogni volta.</p>`}
]},

{ num:'01', title:'Le rotazioni non commutano, e il difetto di commutazione è una rotazione', meta:'il gruppo SO(3) · il quadratino che non si chiude · il commutatore esatto di due rotazioni finite · perché basta questo',
  blocchi:[
  {t:'prosa', title:'Il gruppo, e la sola cosa che conta di lui', tag:'costruzione', html:R`
  <p>Una rotazione dello spazio tridimensionale è un&rsquo;applicazione lineare che conserva le distanze e l&rsquo;orientazione: in componenti, una matrice $R$ reale $3\times3$ con $R^{\mathsf T}R=\mathbb 1$ e $\det R=+1$. L&rsquo;insieme di queste matrici, col prodotto righe per colonne, è un gruppo — si chiama $SO(3)$ — e le sue proprietà elementari si leggono dalla definizione: il prodotto di due rotazioni è una rotazione, l&rsquo;identità c&rsquo;è, l&rsquo;inversa di una rotazione è la rotazione dell&rsquo;angolo opposto attorno allo stesso asse.</p>
  <p>Servono tre parametri per darne una. Il modo più immediato è dire l&rsquo;asse (due parametri: la direzione di un versore $\hat n$) e l&rsquo;angolo (uno). Le tre rotazioni attorno agli assi cartesiani sono</p>
  $$R_z(\alpha)=\begin{pmatrix}\cos\alpha&-\sin\alpha&0\\ \sin\alpha&\cos\alpha&0\\ 0&0&1\end{pmatrix},\qquad R_y(\beta)=\begin{pmatrix}\cos\beta&0&\sin\beta\\ 0&1&0\\ -\sin\beta&0&\cos\beta\end{pmatrix},\qquad R_x(\gamma)=\begin{pmatrix}1&0&0\\ 0&\cos\gamma&-\sin\gamma\\ 0&\sin\gamma&\cos\gamma\end{pmatrix}$$
  <p>e queste tre matrici sono tutto ciò che serve per questa tappa. <b>La sola proprietà del gruppo che produrrà l&rsquo;intera meccanica quantistica del momento angolare è che il prodotto non è commutativo.</b> Vale la pena guardarla da vicino, perché è facile crederla un&rsquo;ovvietà algebrica e non è: le traslazioni dello spazio formano un gruppo commutativo, e il fatto che le rotazioni no è la ragione per cui si può conoscere con precisione tutte e tre le componenti dell&rsquo;impulso di una particella e non si può conoscerne tutte e tre le componenti del momento angolare.</p>`},
  {t:'reveal', title:'Il controesempio più corto, con i numeri', tag:'costruzione', steps:[
   {label:'Due rotazioni di un quarto di giro, nei due ordini', body:R`
   <p>Si prenda il versore $\hat e_x$ e si ruoti di un quarto di giro prima attorno a $z$ e poi attorno a $x$. La prima rotazione lo porta su $\hat e_y$; la seconda, attorno a $x$, porta $\hat e_y$ su $\hat e_z$. Dunque</p>
   $$R_x(\pi/2)R_z(\pi/2)\,\hat e_x=\hat e_z.$$
   <p>Ora si scambi l&rsquo;ordine. La rotazione attorno a $x$ lascia $\hat e_x$ dov&rsquo;è — è sull&rsquo;asse — e la rotazione attorno a $z$ lo porta su $\hat e_y$. Dunque</p>
   $$R_z(\pi/2)R_x(\pi/2)\,\hat e_x=\hat e_y.$$
   <p>Due risultati <i>ortogonali</i>, dallo stesso vettore e dalle stesse due rotazioni, cambiando solo l&rsquo;ordine. Chi vuole vederlo con le mani prenda un libro, lo ruoti di un quarto di giro attorno all&rsquo;asse verticale e poi di un quarto attorno all&rsquo;asse che punta verso di lui, e ripeta scambiando: il libro finisce in due posizioni diverse, e la differenza è un quarto di giro.</p>`},
   {label:'Perché questo non basta, e che cosa serve invece', body:R`
   <p>Il controesempio dice <i>che</i> le rotazioni non commutano, ma non dice <i>quanto</i>, e il quanto è ciò che serve: la meccanica quantistica non costruisce un operatore per ogni rotazione finita e poi li confronta, costruisce il <i>generatore</i> delle rotazioni infinitesime. Quindi la domanda giusta è:</p>
   <p style="margin-left:1.2em"><i>a che cosa è uguale la rotazione che si ottiene facendo $R_x(\varepsilon)$, poi $R_y(\varepsilon)$, poi le due inverse nello stesso ordine?</i></p>
   <p>Se le due rotazioni commutassero, la risposta sarebbe l&rsquo;identità. Non commutano, quindi resta qualcosa. Il punto non ovvio — e il contenuto di tutta la tappa — è che <b>quel qualcosa è ancora una rotazione, attorno al terzo asse, e il suo angolo è del secondo ordine in $\varepsilon$</b>. Questo è il motivo per cui il commutatore di due componenti del momento angolare è proporzionale alla terza, con un coefficiente che contiene $\hbar$ una volta sola.</p>`}
  ]},
  {t:'reveal', title:'Il conto esatto: il commutatore di quattro rotazioni finite', tag:'costruzione', steps:[
   {label:'Il prodotto, senza approssimazioni', body:R`
   <p>Si definisca la matrice</p>
   $$\mathcal C(\varepsilon)=R_x(\varepsilon)\,R_y(\varepsilon)\,R_x(-\varepsilon)\,R_y(-\varepsilon).$$
   <p>È un prodotto di quattro matrici $3\times3$ esplicite, quindi $\mathcal C$ si calcola per intero senza nessuno sviluppo. Il risultato completo è ingombrante, ma i due elementi che interessano sono notevolmente puliti. L&rsquo;elemento di posto $(1,2)$ vale</p>
   $$[\mathcal C]_{12}=-\sin^{2}\varepsilon$$
   <p>esattamente, senza termini di ordine superiore trascurati, e l&rsquo;elemento di posto $(2,1)$ vale $[\mathcal C]_{21}=(2-\cos\varepsilon)\sin^{2}\varepsilon\cos\varepsilon$. I due <i>non</i> sono opposti — $\mathcal C$ non è antisimmetrica, ed è giusto che non lo sia: è una rotazione, non un generatore — ma diventano opposti al secondo ordine, ed è quello che conta.</p>`},
   {label:'Il secondo ordine, e che cosa è', body:R`
   <p>Si divida ciascuno dei due elementi per $\varepsilon^{2}$ e si mandi $\varepsilon$ a zero. Dal primo:</p>
   $$\lim_{\varepsilon\to0}\frac{[\mathcal C]_{12}}{\varepsilon^{2}}=-1,$$
   <p>e dal secondo, con lo stesso passaggio, $\lim_{\varepsilon\to0}[\mathcal C]_{21}/\varepsilon^{2}=+1$ (il fattore $(2-\cos\varepsilon)\cos\varepsilon$ tende a $1$ e $\sin^{2}\varepsilon/\varepsilon^{2}$ pure). Gli elementi della terza riga e della terza colonna fuori diagonale sono di ordine $\varepsilon^{3}$. Mettendo insieme:</p>
   $$\mathcal C(\varepsilon)=\begin{pmatrix}1&-\varepsilon^{2}&0\\ \varepsilon^{2}&1&0\\ 0&0&1\end{pmatrix}+O(\varepsilon^{3})=R_z(\varepsilon^{2})+O(\varepsilon^{3}).$$
   <p><b>Il difetto di commutazione di due rotazioni attorno a $x$ e $y$ è una rotazione attorno a $z$</b>, di angolo pari al prodotto dei due angoli. Non &laquo;assomiglia a&raquo;, non &laquo;si comporta come&raquo;: è, al secondo ordine, quella matrice.</p>
   <p>Due osservazioni che si pagano poi. La prima: l&rsquo;angolo è <i>quadratico</i>, quindi il difetto è invisibile al primo ordine — ed è per questo che l&rsquo;algebra dei generatori, che è un&rsquo;informazione di primo ordine su ciascuna rotazione, cattura esattamente il secondo ordine del prodotto. La seconda: il segno. Scambiando $x$ con $y$ nella definizione di $\mathcal C$ il segno si rovescia, e l&rsquo;ordine ciclico $x\to y\to z$ che compare qui è lo stesso che comparirà nel simbolo di Ricci $\varepsilon_{ijk}$ delle regole di commutazione. Quel simbolo non è una convenzione di scrittura: è l&rsquo;orientazione dello spazio.</p>`}
  ]},
  {t:'plot', title:'Il quadratino che non si chiude: lo stesso punto portato in giro nei due ordini',
   intro:R`<p>Due cammini sulla sfera unitaria, con $\varepsilon=0{,}9$ rad (grande, per rendere visibile un effetto che è del secondo ordine). Entrambi partono dal punto $P_0=(\sin 0{,}6,\;0,\;\cos 0{,}6)$. Il cammino blu applica $R_x(\varepsilon)$ e poi $R_y(\varepsilon)$; il rosa applica le stesse due nell&rsquo;ordine opposto. Il tratteggio verde è il parallelo su cui giace il punto di partenza.</p>`,
   plots:[{kind:'curve3d', height:360, yaw:0.9, pitch:0.4,
     curves:[
      {x:'Math.sin(0.6)', y:'-Math.cos(0.6)*Math.sin(0.9*t)', z:'Math.cos(0.6)*Math.cos(0.9*t)', tr:[0,1], col:'#5aa9ff', label:'blu: prima Rx'},
      {x:'Math.cos(0.9*t)*Math.sin(0.6)+Math.sin(0.9*t)*Math.cos(0.6)*Math.cos(0.9)', y:'-Math.cos(0.6)*Math.sin(0.9)', z:'-Math.sin(0.9*t)*Math.sin(0.6)+Math.cos(0.9*t)*Math.cos(0.6)*Math.cos(0.9)', tr:[0,1], col:'#5aa9ff', label:'blu: poi Ry'},
      {x:'Math.cos(0.9*t)*Math.sin(0.6)+Math.sin(0.9*t)*Math.cos(0.6)', y:'0', z:'-Math.sin(0.9*t)*Math.sin(0.6)+Math.cos(0.9*t)*Math.cos(0.6)', tr:[0,1], col:'#ff6b8a', label:'rosa: prima Ry'},
      {x:'Math.cos(0.9)*Math.sin(0.6)+Math.sin(0.9)*Math.cos(0.6)', y:'-(-Math.sin(0.9)*Math.sin(0.6)+Math.cos(0.9)*Math.cos(0.6))*Math.sin(0.9*t)', z:'(-Math.sin(0.9)*Math.sin(0.6)+Math.cos(0.9)*Math.cos(0.6))*Math.cos(0.9*t)', tr:[0,1], col:'#ff6b8a', label:'rosa: poi Rx'},
      {x:'Math.sin(0.6)*Math.cos(t)', y:'Math.sin(0.6)*Math.sin(t)', z:'Math.cos(0.6)', tr:[0,6.2832], col:'#6bdc9b', label:'parallelo di partenza'}]},
    {kind:'func2d', xr:[0,1.5], yr:[-1.1,1.1], height:250, ticks:true,
     title:'i due elementi esatti, contro la retta di pendenza uno in eps al quadrato',
     curves:[{f:'-Math.sin(x)*Math.sin(x)', col:'#5aa9ff', width:2.4, label:'elemento (1,2) esatto'},
             {f:'(2-Math.cos(x))*Math.sin(x)*Math.sin(x)*Math.cos(x)', col:'#ff6b8a', width:2.4, label:'elemento (2,1) esatto'},
             {f:'-x*x', col:'#8aa0b8', width:1.4, dash:true, label:'meno eps al quadrato'},
             {f:'x*x', col:'#6bdc9b', width:1.4, dash:true, label:'piu eps al quadrato'}],
     xlabel:'eps', ylabel:'elementi di C'}],
   leggi:R`<p><b>Che cosa guardare, nel riquadro di sinistra.</b> I due cammini partono dallo stesso punto e si inseguono per il primo tratto, poi divergono: gli estremi non coincidono, e la separazione fra i due estremi <i>è</i> l&rsquo;azione di $\mathcal C(\varepsilon)$ sul punto di partenza. Si trascini il riquadro: la separazione è prevalentemente azimutale, cioè prevalentemente una rotazione attorno a $z$ — prevalentemente e non esattamente, perché a $\varepsilon=0{,}9$ i termini di terzo ordine sono tutt&rsquo;altro che trascurabili.</p>
   <p><b>Che cosa guardare, nel riquadro di destra.</b> Le due curve continue sono i due elementi esatti di $\mathcal C$; le due tratteggiate sono $\pm\varepsilon^{2}$. Per $\varepsilon$ sotto $0{,}3$ le curve e le rette sono indistinguibili, e per $\varepsilon$ grande si staccano in modo asimmetrico — l&rsquo;elemento $(2,1)$ addirittura torna indietro e si annulla a $\varepsilon=\pi/2$, dove $\cos\varepsilon=0$. <i>Il secondo ordine è una proprietà locale e si vede che lo è.</i></p>
   <p><b>Che cosa impararne.</b> Che il difetto di commutazione non è una sbavatura: ha una direzione (attorno a $z$) e una taglia ($\varepsilon^{2}$). Con $\varepsilon$ dieci volte più piccolo i due cammini di sinistra diventerebbero indistinguibili a occhio, perché la separazione cala cento volte. <b>È questa la ragione per cui la non commutatività delle rotazioni si vede solo al secondo ordine, e perché il commutatore quantistico porta una sola potenza di $\hbar$</b>: $\hbar$ entra una volta per ciascun generatore, e il difetto è bilineare nei due.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Le traslazioni dello spazio commutano, le rotazioni no. Dove sta la differenza, se entrambe sono trasformazioni dello stesso spazio?`,
    a:R`Nel fatto che una traslazione è specificata da un vettore, e la somma di vettori è commutativa, mentre una rotazione è specificata da un asse <i>e</i> un angolo, e ruotare l&rsquo;oggetto <b>ruota anche gli assi che non sono quello della rotazione</b>. Dopo $R_x$, l&rsquo;asse $y$ non è più dov&rsquo;era: quindi &laquo;ruotare attorno a $y$&raquo; significa due cose diverse prima e dopo. Una traslazione non sposta le direzioni. <i>La conseguenza quantistica è immediata</i>: i tre generatori delle traslazioni, cioè le tre componenti dell&rsquo;impulso, commutano e sono osservabili compatibili; i tre generatori delle rotazioni no, e non lo sono.`},
   {q:R`Il difetto di commutazione è di ordine $\varepsilon^{2}$. Perché allora l&rsquo;informazione di <i>primo</i> ordine su ciascuna rotazione — il generatore — basta a determinarlo?`,
    a:R`Perché il difetto è <b>bilineare</b>: contiene una volta la prima rotazione e una volta la seconda. Scrivendo $R_x(\varepsilon)=\mathbb 1+\varepsilon A_x+O(\varepsilon^{2})$ e analogamente per $y$, nel prodotto $R_xR_yR_x^{-1}R_y^{-1}$ tutti i termini di ordine $\varepsilon$ si cancellano a coppie e i termini $\varepsilon^{2}$ che contengono due volte lo stesso generatore si cancellano anch&rsquo;essi; resta $\varepsilon^{2}(A_xA_y-A_yA_x)$, che dipende dai due generatori al primo ordine ciascuno. <i>Questo è il motivo strutturale per cui l&rsquo;intero gruppo di Lie è determinato dalla sua algebra</i>, e non un fatto particolare delle rotazioni.`},
   {q:R`L&rsquo;elemento $(1,2)$ di $\mathcal C$ vale esattamente $-\sin^{2}\varepsilon$, mentre il $(2,1)$ vale $(2-\cos\varepsilon)\sin^{2}\varepsilon\cos\varepsilon$. Una rotazione attorno a $z$ ha i due elementi opposti. Il conto è sbagliato?`,
    a:R`No: $\mathcal C$ <b>non</b> è una rotazione attorno a $z$ — è una rotazione attorno a un asse che differisce da $z$ per termini di ordine $\varepsilon$, e di angolo $\varepsilon^{2}+O(\varepsilon^{3})$. Solo troncando al secondo ordine le due cose coincidono. Si vede dai numeri: $-\sin^{2}\varepsilon=-\varepsilon^{2}+O(\varepsilon^{4})$ e $(2-\cos\varepsilon)\sin^{2}\varepsilon\cos\varepsilon=\varepsilon^{2}+O(\varepsilon^{4})$, quindi i due elementi sono opposti <i>a meno del quarto ordine</i>. <i>La morale è che l&rsquo;algebra di Lie è un&rsquo;informazione locale</i>: cattura il gruppo vicino all&rsquo;identità, e non pretende di descrivere un elemento finito.`}
  ]}
]},

/* ---------------- 02 · IL MOMENTO ANGOLARE COME GENERATORE ---------------- */
{ num:'02', title:'Il momento angolare come generatore delle rotazioni: tre strade, e dove divergono', meta:'Picasso e la funzione generatrice · Dirac che costruisce l’operatore · Landau che lo trova · Stone, von Neumann, Bargmann · il segno, che è una convenzione e va dichiarata',
  blocchi:[
  {t:'prosa', title:'Che cosa bisogna costruire, e perché non è ovvio che si possa', tag:'costruzione', html:R`
  <p>Nella tappa precedente le rotazioni erano matrici $3\times3$ che agiscono su punti dello spazio. Qui bisogna farle agire sugli <span class="str" data-str="spazio-di-hilbert">stati</span> di un sistema quantistico, e non c&rsquo;è niente di automatico nel passaggio: lo spazio degli stati non è lo spazio fisico, e un vettore di stato non ha tre componenti da rimescolare.</p>
  <p>La macchina che fa il passaggio è il teorema di Wigner, già montato: a ogni <span class="str" data-str="simmetrie">simmetria</span> del sistema corrisponde un <span class="str" data-str="operatore-unitario">operatore unitario</span> sullo spazio degli stati, determinato a meno di una fase. Applicata alle rotazioni dà una famiglia $U(\hat n,\varphi)$ e, per ogni asse fissato, una famiglia a un parametro — quindi un <span class="str" data-str="operatore-aggiunto">generatore autoaggiunto</span>. <b>La domanda di questa tappa è: che operatore è quel generatore?</b> E la risposta — è il momento angolare, diviso $\hbar$ — si può raggiungere per tre strade che partono da tre punti diversi e sono logicamente distinte. Vale percorrerle tutte e tre, perché nessuna delle tre è la più chiara in tutti i punti.</p>
  <p>Due avvertenze tecniche di Picasso, che vengono prima e non dopo. La prima: l&rsquo;esistenza di $U$ non è gratis, perché la trasformazione indotta sulle $q$ e sulle $p$ è una trasformazione canonica, e che a una trasformazione canonica corrisponda un operatore unitario è un teorema — Picasso lo chiama <i>teorema di von Neumann</i> e lo invoca per nome (pag. stampata 168). La seconda, più sottile: siccome ogni $U$ è definito a meno di una fase, non è affatto ovvio che si possano scegliere le fasi in modo che valga $U(\varphi_1)U(\varphi_2)=U(\varphi_1+\varphi_2)$ per ogni coppia di angoli. Picasso scrive che &laquo;<i>non è ovvio a priori</i>&raquo; e che per il gruppo delle rotazioni &laquo;<i>è possibile, grazie ad un teorema di V. Bargmann</i>&raquo;. Senza quel teorema, non si potrebbe applicare Stone.</p>`},
  {t:'reveal', title:'Strada uno — Picasso: il generatore della trasformazione canonica', tag:'costruzione', steps:[
   {label:'Il fatto classico, e perché è già mezzo del lavoro', body:R`
   <p>In meccanica analitica, a ogni trasformazione canonica infinitesima $(q,p)\to(q',p')$ è associata una funzione $G(q,p)$, detta <i>funzione generatrice</i>, tale che la variazione di ogni coordinata e di ogni impulso sia data da una <span class="str" data-str="parentesi-di-poisson">parentesi di Poisson</span> con $G$:</p>
   $$q'_j=q_j+\epsilon\,\{G,q_j\},\qquad p'_j=p_j+\epsilon\,\{G,p_j\}$$
   <p>dove $\epsilon$ è il parametro infinitesimo. Il fatto notevole — e questo è il contenuto classico su cui si appoggia tutto — è che <b>se la trasformazione è una rotazione attorno a un asse, $G$ è la componente del momento angolare lungo quell&rsquo;asse</b>. Non per analogia: è un teorema di meccanica hamiltoniana, e si verifica in due righe.</p>
   <p>Per una rotazione di angolo $\phi$ attorno all&rsquo;asse $3$, le coordinate si trasformano come $q'_1=q_1\cos\phi+q_2\sin\phi$, $q'_2=-q_1\sin\phi+q_2\cos\phi$, $q'_3=q_3$, cioè, per $\phi=\epsilon$ infinitesimo, $q'_1=q_1+\epsilon q_2$, $q'_2=q_2-\epsilon q_1$, $q'_3=q_3$. Confrontando con le formule sopra bisogna dunque che la parentesi di Poisson di $G$ con $q_1$ dia $q_2$. E infatti, con $M_3=q_1p_2-q_2p_1$, il conto diretto dà</p>
   $$\{M_3,q_1\}=q_2,\qquad \{M_3,q_2\}=-q_1,\qquad \{M_3,q_3\}=0$$
   <p>che è esattamente quanto serve. Dunque $G=M_3$, e Picasso lo scrive così: &laquo;<i>se la trasformazione di coordinate è una rotazione attorno ad un certo asse, $G$ coincide con la componente di $M$ secondo l&rsquo;asse di rotazione</i>&raquo;.</p>`},
   {label:'Il trasporto in meccanica quantistica, e il suo prezzo', body:R`
   <p>Il passaggio al quantistico usa la corrispondenza $[\,\hat A,\hat B\,]=i\hbar\,\widehat{\{A,B\}}$ fra <span class="str" data-str="commutatore">commutatori</span> e parentesi di Poisson — che in Picasso è la (4.53). Applicata ai tre conti classici qui sopra dà</p>
   $$[M_3,q_1]=i\hbar\,q_2,\qquad [M_3,q_2]=-i\hbar\,q_1,\qquad [M_3,q_3]=0.$$
   <p>Il prezzo di questa strada è dichiarato, e Picasso lo dichiara: la corrispondenza fra parentesi di Poisson e commutatori non è un teorema ma un <i>postulato di quantizzazione</i>, e per prodotti di operatori non commutanti è ambigua. Qui l&rsquo;ambiguità non morde — i tre conti coinvolgono $q$ e $p$ di indici diversi, che commutano — ma la strada resta &laquo;appoggiata&raquo; alla meccanica classica, e questo è un difetto reale per un oggetto, lo spin, che non ha analogo classico.</p>
   <p>Il guadagno, invece, è grosso e si incassa nella tappa successiva: siccome l&rsquo;unica cosa usata è <i>come si trasformano le $q$ sotto rotazione</i>, e non che siano coordinate, lo stesso conto vale per le componenti di qualunque vettore.</p>`}
  ]},
  {t:'reveal', title:'Strada due — Dirac: l’operatore di rotazione si costruisce, e il momento angolare si trova', tag:'costruzione', steps:[
   {label:'La costruzione, parallela a quella della traslazione', body:R`
   <p>Dirac non parte dal momento angolare: parte dalle rotazioni, e ne costruisce l&rsquo;operatore come limite. Nel §35 dei <i>Principi</i> introduce gli operatori lineari $R$ che si riferiscono alle rotazioni attorno all&rsquo;origine &laquo;<i>nello stesso modo in cui abbiamo introdotto nel §25 gli operatori lineari $D$ che si riferiscono a traslazioni</i>&raquo;, e poi definisce</p>
   $$\hat r_z=\lim_{\delta\varphi\to0}\frac{R-1}{\delta\varphi}$$
   <p>che chiama &laquo;<i>l&rsquo;operatore di rotazione intorno all&rsquo;asse $z$</i>&raquo;. Osserva che, come l&rsquo;operatore di traslazione, $\hat r_z$ &laquo;<i>è un operatore lineare immaginario puro, e risulta determinato a meno di un arbitrario addendo immaginario puro</i>&raquo;: l&rsquo;arbitrarietà è la stessa fase di cui parlava Wigner, vista dal lato del generatore.</p>
   <p>La variazione di una variabile dinamica $v$ prodotta da una rotazione infinitesima di angolo $\delta\varphi$ è allora, al primo ordine, $\delta\varphi\,(\hat r_zv-v\hat r_z)$. Questo è l&rsquo;unico ingrediente formale; il resto è fisica.</p>`},
   {label:'Il passaggio chiave: la differenza è un numero, e si azzera', body:R`
   <p>Dirac ora usa quello che <i>sa</i> delle rotazioni: ruotando di $\delta\varphi$ attorno a $z$ l&rsquo;intero apparato di misura, le tre componenti di un vettore $\mathbf A$ variano rispettivamente di $\delta\varphi A_y$, $-\delta\varphi A_x$ e $0$, &laquo;<i>mentre qualunque grandezza scalare resta inalterata nella rotazione</i>&raquo;. Uguagliando queste variazioni note a quelle prodotte dal commutatore con $\hat r_z$, trova che <b>$i\hbar\hat r_z$ soddisfa le stesse relazioni di commutazione di $M_z$</b>, e che $\hat r_z$ commuta con qualunque scalare.</p>
   <p>Segue il passaggio che vale la lettura, perché è il tipo di argomento che non si impara dai manuali moderni. La loro differenza, $M_z-i\hbar\hat r_z$, &laquo;<i>commuta con tutte le variabili dinamiche, e deve perciò essere un numero</i>&raquo;. Quel numero è reale, perché i due operatori lo sono, e &laquo;<i>può essere reso nullo mediante un&rsquo;opportuna scelta dell&rsquo;arbitrario numero immaginario puro che può essere aggiunto a $\hat r_z$</i>&raquo;. Dunque</p>
   $$M_z=i\hbar\,\hat r_z,$$
   <p>e Dirac tira la conclusione che dà il senso a tutto il movimento: &laquo;<i>il momento angolare totale è connesso con gli operatori di rotazione, allo stesso modo in cui l&rsquo;impulso totale è connesso con gli operatori di traslazione. Questa conclusione è valida qualunque sia il punto scelto come origine</i>&raquo;.</p>
   <p>Si noti la struttura dell&rsquo;argomento: &laquo;commuta con tutto, quindi è un numero&raquo; usa che l&rsquo;insieme delle variabili dinamiche sia <i>irriducibile</i>, cioè che non esistano operatori non banali che commutano con tutti. È il lemma di Schur travestito, nel 1930 e senza nominarlo.</p>`},
   {label:'Perché questa strada è quella che produce lo spin', body:R`
   <p>Il guadagno di Dirac su Picasso si vede appena si prova a trattare lo spin. Il momento angolare di spin, scrive, &laquo;<i>non corrisponde strettamente a nessun concetto della meccanica classica, cosicché il metodo dell&rsquo;analogia classica non è adatto per studiarlo</i>&raquo;: non c&rsquo;è nessuna funzione generatrice classica da cui partire, e la strada uno si interrompe.</p>
   <p>Dirac la aggira invertendo la logica. &laquo;<i>Possiamo costruire una teoria dello spin partendo semplicemente dall&rsquo;ipotesi che le componenti del momento angolare di spin siano connesse con gli operatori di rotazione allo stesso modo in cui lo sono le componenti del momento angolare orbitale</i>&raquo;. Cioè: <b>la connessione con le rotazioni non è una proprietà del momento angolare, è la sua definizione</b>, e lo spin è ciò che si ottiene applicandola a gradi di libertà che non sono coordinate. Con quell&rsquo;unica ipotesi, tutte le relazioni di commutazione valgono, e quindi vale tutto ciò che da esse si deduce.</p>
   <p>È il motivo per cui questo movimento mette la geometria prima dell&rsquo;algebra e l&rsquo;algebra prima dei conti: nell&rsquo;ordine di Dirac, la macchina che produce lo spettro è già completa <i>prima</i> di sapere di che sistema si parli.</p>`}
  ]},
  {t:'prosa', title:'Strada tre — Landau: l’operatore di rotazione infinitesima è il momento angolare', tag:'costruzione', html:R`
  <p>Landau segue l&rsquo;ordine opposto a Dirac: parte dalla definizione $\hat{\mathbf L}=\mathbf r\wedge\hat{\mathbf p}$ e <i>trova</i> che genera le rotazioni. La formulazione che usa è la più compatta delle tre e compare, non nel paragrafo sul momento angolare, ma in quello sugli elementi di matrice dei vettori, dove gli serve come strumento: ogni scalare è invariante per rotazioni, quindi il suo operatore commuta con l&rsquo;operatore di rotazione, &laquo;<i>sappiamo però che l&rsquo;operatore di rotazione infinitesima coincide, a meno di un fattore costante, con l&rsquo;operatore del momento angolare</i>&raquo; (§29).</p>
  <p>Lo usa subito per un risultato che la strada algebrica non vede: se $\hat f$ è uno scalare, la sua matrice fra stati di $L$ e $M$ definiti è diagonale in quegli indici, <i>e i suoi elementi non dipendono da $M$</i>. La ragione fisica è di una pulizia esemplare: &laquo;<i>dato che l&rsquo;assegnazione del valore $M$ determina solamente l&rsquo;orientazione del sistema rispetto agli assi coordinati, dal momento che il valore di una grandezza scalare non dipende affatto da questa orientazione</i>&raquo;. Applicato all&rsquo;hamiltoniana, che è uno scalare per un sistema isolato, questo <b>è</b> la degenerazione: tutti i $2L+1$ stati con lo stesso $L$ e $M$ diverso hanno la stessa energia.</p>
  <p>Landau usa la stessa leva anche al contrario, per caratterizzare lo stato a momento nullo. Uno stato con $L=0$, scrive, ha funzione d&rsquo;onda a simmetria sferica, e &laquo;<i>ciò si vede già dal fatto che la sua variazione in ogni rotazione infinitesima, data dall&rsquo;espressione $\hat L\psi$, nel caso considerato si annulla</i>&raquo;. È l&rsquo;argomento di Dirac — che lo chiama &laquo;una seconda conseguenza immediata&raquo; della connessione e aggiunge che il teorema inverso vale ma la dimostrazione &laquo;<i>non è così semplice</i>&raquo; — scritto in una riga invece che in dieci.</p>
  <p><b>Dove le tre strade divergono</b>, perché è la cosa da portarsi via. Per Dirac il momento angolare <i>è definito</i> come il generatore delle rotazioni, e la forma $\mathbf q\wedge\mathbf p$ è un caso particolare — quello orbitale. Per Landau il momento angolare <i>è</i> $\mathbf r\wedge\hat{\mathbf p}$, e il fatto che generi le rotazioni è un teorema. Per Picasso la connessione è un ponte fra meccanica analitica classica e quantistica, e serve a scegliere la via più significativa fra tre vie che portano allo stesso posto. Chi ha studiato su un libro solo non sa che gli altri due ordini logici esistono — e sono tre risposte diverse alla domanda d&rsquo;esame &laquo;perché le componenti del momento angolare non commutano?&raquo;.</p>`},
  {t:'reveal', title:'La forma finita, e il segno — che è una convenzione, e va dichiarata', tag:'costruzione', steps:[
   {label:'Da Stone alla forma esponenziale', body:R`
   <p>Messi insieme von Neumann (esiste $U$), Bargmann (le fasi si possono scegliere perché $U$ componga come un gruppo) e Stone (una famiglia unitaria a un parametro è l&rsquo;esponenziale di un generatore autoaggiunto), per una rotazione di angolo $\varphi$ attorno all&rsquo;asse $\hat n$ si ha</p>
   $$U(\hat n,\varphi)=e^{-i\varphi\,\hat n\cdot\mathbf M/\hbar}$$
   <p>e questa è la formula che si usa per tutto il resto del movimento. Il generatore è $\hat n\cdot\mathbf M/\hbar$: ha le dimensioni dell&rsquo;inverso di un angolo, cioè è adimensionale, come deve essere l&rsquo;argomento di un&rsquo;esponenziale diviso un angolo. <b>Ecco perché il momento angolare, in unità di $\hbar$, è un numero puro</b>: non è una scelta di comodo, è la dimensione del generatore di un gruppo i cui parametri sono angoli.</p>`},
   {label:'Il segno: tre libri, due convenzioni, e un disaccordo da dichiarare', body:R`
   <p>Qui le fonti non concordano, e tacerlo costerebbe un esame.</p>
   <p>Ballentine scrive la formula al §7.2 con il segno <i>più</i> — &laquo;<i>the unitary operator corresponding to a rotation through angle $\theta$ about an axis parallel to the unit vector $\hat n$ is $R_n(\theta)=e^{i\theta\hat n\cdot\mathbf J/\hbar}$</i>&raquo; (7.17) — e poi, due pagine dopo, nel confrontare lo sviluppo al primo ordine, usa $R_z(\varepsilon)=1-i\varepsilon J_z/\hbar$, che è il segno <i>meno</i>; e tutto il §7.5 sulle rotazioni finite è scritto con il meno, $R(\alpha,\beta,\gamma)=e^{-i\alpha J_z}e^{-i\beta J_y}e^{-i\gamma J_z}$. Dirac scrive $M_z=i\hbar\hat r_z$ con $\hat r_z$ immaginario puro, che corrisponde a $e^{-i\varphi M_z/\hbar}$. Di Picasso, nel dossier, le due formule (10.28) e (10.29) hanno il segno illeggibile per l&rsquo;OCR e non gliene attribuisco nessuno; il suo conto intermedio usa $U(\epsilon)=1-i\epsilon G$ con $G=M_3/\hbar$, che è il meno.</p>
   <p><b>Che cosa fa la differenza, concretamente.</b> Il segno distingue la rotazione <i>attiva</i> (si ruota l&rsquo;oggetto, il riferimento sta fermo) da quella <i>passiva</i> (si ruota il riferimento). Ballentine dedica al punto una digressione intera nel §7.5, con la relazione fra le due matrici di rotazione, $R^{(p)}(\alpha,\beta,\gamma)=[R^{(a)}(\alpha,\beta,\gamma)]^{-1}$, e la nota che perfino i testi di riferimento sbagliano: &laquo;<i>this discussion of active and passive rotations is based on an article by M. Bouten (1969), in which it is pointed out that the standard reference books by Edmonds (1957) and Rose (1960) contain errors in treating these rotations</i>&raquo;.</p>
   <p><b>La convenzione di questo movimento</b>, dichiarata una volta e mai cambiata: segno meno, punto di vista attivo, cioè $U$ ruota lo stato e lascia fermi gli assi. Si può controllare che è quella coerente con la regola $R\Psi(\mathbf x)=\Psi(R^{-1}\mathbf x)$ di Ballentine: una funzione che dipende dall&rsquo;azimut come $e^{im\phi}$, ruotata di $\varphi$ attorno a $z$, diventa $e^{im(\phi-\varphi)}$, cioè prende il fattore $e^{-im\varphi}$ — che è quello che $e^{-i\varphi M_z/\hbar}$ produce su un autostato di $M_z$. Con la convenzione opposta tutti i segni degli angoli si rovesciano e nessun risultato fisico cambia; ma mescolarle in mezzo a un conto produce stati ruotati nel verso sbagliato, e in un problema con un campo magnetico questo è il segno della precessione.</p>`}
  ]},
  {t:'plot', title:'Il generatore, visto come campo di velocità: la rotazione è il flusso di un campo',
   intro:R`<p>A sinistra il campo $\mathbf v=\hat e_z\wedge\mathbf r=(-y,\,x)$ nel piano $xy$: è il campo di velocità dei punti di un corpo rigido che ruota attorno a $z$ con velocità angolare unitaria. A destra, per confronto, il campo costante $\mathbf v=(1,0)$ di una traslazione lungo $x$. Le rotazioni sono il flusso del primo, le traslazioni del secondo.</p>`,
   plots:[{kind:'field2d', xr:[-2,2], yr:[-2,2], n:15, height:280,
     fx:'-y', fy:'x', title:'il campo di una rotazione attorno a z'},
    {kind:'field2d', xr:[-2,2], yr:[-2,2], n:15, height:280,
     fx:'1', fy:'0', title:'il campo di una traslazione lungo x'}],
   leggi:R`<p><b>Che cosa guardare.</b> Nel campo di rotazione la lunghezza della freccia cresce con la distanza dall&rsquo;origine e la direzione cambia da punto a punto; nel campo di traslazione tutte le frecce sono identiche. È questa differenza — un campo che <i>varia nello spazio</i> contro uno che non varia — l&rsquo;immagine geometrica della differenza fra un gruppo non commutativo e uno commutativo.</p>
   <p><b>Che cosa impararne.</b> Il generatore di una trasformazione continua è un campo vettoriale, e la trasformazione finita è il flusso di quel campo per un tempo pari al parametro. Due flussi commutano se e solo se il loro commutatore di campi si annulla: per i tre campi di rotazione $\hat e_i\wedge\mathbf r$ non si annulla, e il campo che ne risulta è il terzo — che è, in linguaggio di campi, lo stesso enunciato della tappa 01. <i>In meccanica quantistica l&rsquo;operatore $-i\hbar(x\partial_y-y\partial_x)$ è letteralmente la derivata lungo questo campo, moltiplicata per $-i\hbar$</i>: la <span class="str" data-str="derivazione">derivazione</span> lungo le linee di flusso disegnate qui a sinistra.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Ballentine identifica $J_z$ con $-i\hbar(x\partial_y-y\partial_x)$ confrontando due sviluppi al primo ordine. Si rifaccia il confronto, e si dica dove entra il segno.`,
    a:R`Si ruota attivamente la funzione d&rsquo;onda: $R_z(\varepsilon)\Psi(\mathbf x)=\Psi(R_z^{-1}\mathbf x)=\Psi(x\cos\varepsilon+y\sin\varepsilon,\,-x\sin\varepsilon+y\cos\varepsilon,\,z)$. Derivando rispetto a $\varepsilon$ in zero, il primo argomento contribuisce $y\,\partial\Psi/\partial x$ e il secondo $-x\,\partial\Psi/\partial y$, quindi $R_z(\varepsilon)\Psi=\Psi+\varepsilon(y\partial_x-x\partial_y)\Psi$. Dall&rsquo;altro lato $R_z(\varepsilon)=1-i\varepsilon J_z/\hbar$. Uguagliando: $-iJ_z/\hbar=y\partial_x-x\partial_y$, cioè $J_z=i\hbar(y\partial_x-x\partial_y)=-i\hbar(x\partial_y-y\partial_x)$. <b>Il segno entra due volte e si compensa</b>: una nell&rsquo;$R^{-1}$ (rotazione attiva della funzione = rotazione inversa dell&rsquo;argomento) e una nel $-i$ dell&rsquo;esponenziale. <i>Chi dimentica l&rsquo;inversa ottiene $J_z$ con il segno sbagliato e non se ne accorge, perché lo spettro è simmetrico.</i>`},
   {q:R`Dirac conclude che $M_z-i\hbar\hat r_z$ «commuta con tutte le variabili dinamiche, e deve perciò essere un numero». Perché «deve»? Quale ipotesi sta usando?`,
    a:R`Che l&rsquo;insieme delle variabili dinamiche del sistema sia <b>irriducibile</b>: che non esista nessun operatore, oltre ai multipli dell&rsquo;identità, che commuti con tutte. Per una particella senza spin questo è il contenuto del teorema di von Neumann sull&rsquo;unicità della rappresentazione delle relazioni canoniche; in generale è un&rsquo;ipotesi sul sistema, non un teorema, e <i>cade esattamente nei casi interessanti</i>: se il sistema ha un grado di libertà interno di cui le $q$ e le $p$ non sanno niente, un operatore che agisce solo su quello commuta con tutte le variabili orbitali e non è un numero. <b>Quel residuo è lo spin</b>, e la decomposizione $\mathbf J=\mathbf L+\mathbf S$ di Ballentine (7.22) è precisamente la misura di quanto l&rsquo;ipotesi di Dirac fallisce.`},
   {q:R`Se $U(\hat n,\varphi)$ esiste per il teorema di Wigner a meno di una fase, perché serve ancora Bargmann? Una fase non è innocua?`,
    a:R`Non quando bisogna <i>comporre</i>. Per ogni rotazione singola la fase è irrilevante — lo stato è un raggio, non un vettore. Ma la composizione dà $U(\varphi_1)U(\varphi_2)=e^{i\omega(\varphi_1,\varphi_2)}U(\varphi_1+\varphi_2)$ con una fase che <i>dipende dai due angoli</i>, e perché la famiglia sia un gruppo a un parametro — condizione del teorema di Stone — quella funzione deve potersi azzerare con una ridefinizione delle fasi dei singoli $U$. Non sempre si può: per il gruppo di Galilei <b>non</b> si può, e la fase residua è la massa. Per le rotazioni si può, e lo garantisce Bargmann — ma al prezzo di lavorare non con $SO(3)$ bensì con il suo ricoprimento, $SU(2)$, come Picasso annota in nota. <i>Quel ricoprimento è il motivo per cui i mezzi-interi sopravvivono</i>, e la tappa 09 lo incassa.`}
  ]}
]},

/* ---------------- 03 · LE REGOLE DI COMMUTAZIONE, RICAVATE ---------------- */
{ num:'03', title:'Le regole di commutazione, e tutto quello che si ottiene gratis da come sono state ricavate', meta:'con un vettore qualunque · con uno scalare qualunque · il caso V uguale a M · il campo esterno che non è un vettore · che cosa si può sapere insieme',
  blocchi:[
  {t:'prosa', title:'Il passaggio che paga la strada lunga', tag:'costruzione', html:R`
  <p>Nella tappa precedente si è arrivati a $[M_3,q_1]=i\hbar q_2$ passando per la funzione generatrice. Lo stesso risultato si ottiene in quattro righe di conto diretto, partendo da $M_3=q_1p_2-q_2p_1$ e da $[q_i,p_j]=i\hbar\delta_{ij}$. Perché prendere la strada lunga?</p>
  <p>Picasso risponde subito dopo averla percorsa, e la risposta è l&rsquo;intera tappa: &laquo;<i>siamo arrivati alla (10.8) per una via certamente più lunga che mediante il calcolo diretto: adesso però sappiamo che le (10.8) sono esclusivamente conseguenza del fatto che le $q_i$ sono le componenti di un vettore, cioè si trasformano per rotazioni secondo le formule (10.4)</i>&raquo;. Il conto diretto usa la forma di $M_3$ e le relazioni canoniche; la strada lunga usa <i>solo</i> che le $q$ ruotino come ruota un vettore. Quindi il risultato non riguarda le coordinate: riguarda i vettori.</p>
  <p>Questa è la differenza fra sapere un risultato e sapere da che cosa dipende, e in questo caso vale tre teoremi.</p>`},
  {t:'reveal', title:'Le tre conseguenze, in ordine di generalità crescente', tag:'costruzione', steps:[
   {label:'Uno — con le componenti di qualunque vettore', body:R`
   <p>Le nove relazioni fra le tre componenti di $\mathbf M$ e le tre di $\mathbf q$ si riassumono in una, con la convenzione di somma sull&rsquo;indice ripetuto:</p>
   $$[M_i,q_j]=i\hbar\,\varepsilon_{ijk}\,q_k$$
   <p>dove $\varepsilon_{ijk}$ è il simbolo di Ricci, nullo se due indici coincidono, $+1$ sulle permutazioni cicliche di $1,2,3$ e $-1$ sulle altre. Siccome l&rsquo;unico ingrediente è la legge di trasformazione, <b>la stessa relazione vale per le componenti di qualunque vettore $\mathbf V$ costruito con le variabili dinamiche del sistema</b>:</p>
   $$[M_i,V_j]=i\hbar\,\varepsilon_{ijk}\,V_k.$$
   <p>Due casi particolari si incassano immediatamente. Con $\mathbf V=\mathbf p$: $[M_i,p_j]=i\hbar\varepsilon_{ijk}p_k$, che il conto diretto avrebbe richiesto di rifare da capo. E con $\mathbf V=\mathbf M$ — perché il momento angolare <i>è</i> un vettore —</p>
   $$[M_i,M_j]=i\hbar\,\varepsilon_{ijk}\,M_k,$$
   <p>che sono le relazioni fondamentali di tutto il movimento, ottenute come corollario invece che come postulato. Vale la pena fermarsi un istante su questo: il fatto che le tre componenti del momento angolare si commutino fra loro <i>esattamente come si commutano con le componenti di un qualunque vettore</i> è la traduzione algebrica dell&rsquo;enunciato geometrico della tappa 01 — il difetto di commutazione di due rotazioni è una rotazione.</p>`},
   {label:'Due — con qualunque scalare', body:R`
   <p>Il metodo della funzione generatrice dà anche l&rsquo;altra metà. Per una trasformazione generata da $G$, la variazione di una qualunque funzione $f(q,p)$ è $\epsilon\{G,f\}$: quindi se $f$ <i>non cambia</i> sotto rotazione, la sua parentesi di Poisson con le componenti di $\mathbf M$ è nulla, e con essa il commutatore. Le grandezze invarianti per rotazione si chiamano <i>scalari</i> — per una particella, $q^{2}$, $p^{2}$, $\mathbf q\cdot\mathbf p$ e le loro funzioni — e il risultato è</p>
   $$[M_i,S]=0\quad\text{per ogni scalare }S.$$
   <p>Il caso particolare che conta più di tutti si ottiene prendendo $S=M^{2}=M_1^{2}+M_2^{2}+M_3^{2}$, che è lo scalare costruito con $\mathbf M$ stesso:</p>
   $$[M_i,M^{2}]=0.$$
   <p>Questo si può anche verificare direttamente dall&rsquo;algebra, e Landau lo fa in tre righe: $[M^{2},M_z]$ si spezza in $[M_x^{2},M_z]+[M_y^{2},M_z]+[M_z^{2},M_z]$, i primi due valgono $-i\hbar(M_xM_y+M_yM_x)$ e $+i\hbar(M_xM_y+M_yM_x)$, il terzo è nullo, e la somma si annulla. <b>Il conto algebrico dimostra; l&rsquo;argomento della simmetria spiega</b> — $M^{2}$ è il modulo quadrato di un vettore, e il modulo di un vettore non cambia se lo si ruota.</p>`},
   {label:'Tre — la costante del moto, e dove la simmetria si vede meglio del conto', body:R`
   <p>Da $[M_i,S]=0$ segue in una riga un fatto che ha richiesto tutta la meccanica analitica per essere capito in classico. Per una particella in un campo di forze centrali, il potenziale dipende solo da $r=(q_1^{2}+q_2^{2}+q_3^{2})^{1/2}$, quindi l&rsquo;hamiltoniana $H=p^{2}/2m+V(r)$ è uno scalare, quindi commuta con ogni $M_i$, quindi <b>tutte e tre le componenti del momento angolare sono costanti del moto</b>. Nessun conto: solo l&rsquo;osservazione che $H$ non sa distinguere una direzione da un&rsquo;altra.</p>
   <p>Landau fa lo stesso ragionamento nella direzione opposta, e ne cava la degenerazione. Siccome l&rsquo;hamiltoniana di un sistema isolato è uno scalare, i suoi elementi di matrice fra stati di $L$ e $M$ definiti sono diagonali e <i>indipendenti da $M$</i>: &laquo;<i>applicando questo risultato all&rsquo;hamiltoniano stesso, otteniamo l&rsquo;indipendenza già nota dall&rsquo;energia degli stati stazionari da $M$, cioè i livelli energetici sono $(2L+1)$ volte degeneri</i>&raquo;. La degenerazione di un livello non è un accidente del potenziale: è il numero di orientazioni che il sistema può avere, ed è lo stesso per ogni potenziale centrale.</p>`}
  ]},
  {t:'prosa', title:'La trappola di Picasso: il campo esterno che, nonostante le apparenze, non è un vettore', tag:'errore', html:R`
  <p>Il teorema dice: le componenti di $\mathbf M$ commutano con ogni scalare e si commutano con le componenti di ogni vettore secondo la regola di Ricci. Ma dentro quel «vettore» e quel «scalare» c&rsquo;è una condizione che si legge e si dimentica, e Picasso la mette in evidenza con un esempio che è esattamente il tipo di errore che un esame punisce.</p>
  <p>L&rsquo;energia potenziale di un elettrone di carica $-e$ in un campo elettrico esterno uniforme $\mathbf E$ si scrive $e\,\mathbf E\cdot\mathbf q$. Ha tutta l&rsquo;aria di essere un prodotto scalare di due vettori, quindi uno scalare, quindi dovrebbe commutare con il momento angolare. <b>Non commuta</b>, e Picasso spiega perché con una frase che vale memorizzare: &laquo;<i>questa, nonostante le apparenze, non è uno scalare perché $\mathbf E$, nonostante le apparenze, non è un vettore: difatti $\mathbf E$ è un campo esterno, cioè non dipende dalle variabili dinamiche del sistema, e quindi commuta con le $M_i$</i>&raquo;. Nel linguaggio di Dirac che Picasso richiama, $\mathbf E$ è un <i>c-numero</i> e non un <i>q-numero</i>.</p>
  <p>Il secondo modo di vedere la stessa cosa è più fisico e vale da solo il paragrafo. La quantità $e\,\mathbf E\cdot\mathbf q$ è invariante se si ruota <i>tutto</i>: l&rsquo;elettrone e il condensatore che genera il campo. Dunque commuta con il momento angolare dell&rsquo;intero sistema elettrone-più-condensatore. Ma se il sistema di cui si parla è il solo elettrone, allora ruotandolo le $\mathbf q$ cambiano e $\mathbf E$ no, e il prodotto non resta invariato. <b>La domanda «è uno scalare?» non ha senso in assoluto: ha senso solo una volta dichiarato qual è il sistema.</b></p>
  <p>Conseguenza pratica, e si vede negli scritti: un termine $-\mathbf B\cdot\boldsymbol\mu$ in un&rsquo;hamiltoniana con $\mathbf B$ esterno e uniforme lungo $z$ <i>non</i> commuta con $M_x$ e $M_y$, ma commuta con $M_z$ — perché la simmetria residua non è l&rsquo;intero gruppo delle rotazioni, è il sottogruppo delle rotazioni attorno a $\mathbf B$. Chi applica il teorema degli scalari senza chiedersi quale simmetria il campo esterno lascia in piedi conclude che $\mathbf M$ è conservato, e sbaglia tre punti su quattro di un esercizio.</p>`},
  {t:'prosa', title:'Che cosa si può sapere insieme: la lettura fisica delle due relazioni', tag:'architettura', html:R`
  <p>Le due relazioni ottenute dicono cose opposte e vanno lette in coppia.</p>
  <p>$[M_i,M_j]=i\hbar\varepsilon_{ijk}M_k$ dice che <b>le tre componenti del momento angolare non sono osservabili compatibili</b>: non esiste una base di autostati simultanei di $M_1$, $M_2$ e $M_3$, e quindi non esiste nessuno stato in cui il vettore momento angolare abbia una direzione definita. Picasso lo registra così: le componenti &laquo;<i>non sono osservabili compatibili</i>&raquo;, e quindi &laquo;<i>eccetto un caso particolare che discuteremo, non esistono autostati simultanei di $M_1$, $M_2$ ed $M_3$</i>&raquo;. L&rsquo;eccezione è lo stato a momento angolare nullo, dove tutte e tre valgono zero: non è una contraddizione, perché — come Picasso chiarisce — &laquo;<i>gli stati di momento angolare $0$ non formano un insieme completo di stati</i>&raquo;.</p>
  <p>$[M_i,M^{2}]=0$ dice il contrario sul modulo: <b>il modulo quadrato del momento angolare è compatibile con ciascuna delle componenti, separatamente</b>. Quindi esiste un insieme completo di stati in cui $M^{2}$ e <i>una</i> componente scelta hanno entrambe valore definito. Si sceglie $M_3$ per tradizione, e Picasso avverte che la scelta è senza contenuto: &laquo;<i>è chiaro innanzitutto che tutte le $M_i$ avranno gli stessi autovalori (ma non gli stessi autovettori!)</i>&raquo;.</p>
