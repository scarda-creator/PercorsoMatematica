   <p><b>Che cosa impararne.</b> Che la probabilità dipende solo dall&rsquo;angolo fra i due assi di misura, e che il caso $\beta=\pi/2$ — le due misure su assi ortogonali — dà sempre una distribuzione non banale: <i>misurare $J_z$ e poi $J_x$ non restituisce informazione sul primo risultato</i>. E che il valore medio della proiezione dopo la rotazione vale $1\cdot P_1+0\cdot P_0-1\cdot P_{-1}=\cos\beta$, esattamente come per un vettore classico di lunghezza $1$ inclinato di $\beta$: <b>i valori medi del momento angolare ruotano come vettori classici</b>, ed è l&rsquo;unica cosa che lo fa.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Si misura $J_z$ su uno spin un mezzo e si trova $+\tfrac12$. Si misura poi la componente lungo un asse che fa un angolo $\beta$ con $z$. Con quali probabilità si trovano i due risultati?`,
    a:R`Lo stato è $|\tfrac12,\tfrac12\rangle$ nella base di $z$; per la seconda misura serve svilupparlo nella base dell&rsquo;altro asse, che si ottiene ruotando di $\beta$ — quindi i coefficienti sono gli elementi di $d^{(1/2)}(\beta)$, cioè $\cos(\beta/2)$ e $\sin(\beta/2)$. Le probabilità sono $\cos^{2}(\beta/2)$ e $\sin^{2}(\beta/2)$. <b>Controlli:</b> a $\beta=0$ danno $1$ e $0$; a $\beta=\pi$ danno $0$ e $1$; a $\beta=\pi/2$ danno $\tfrac12$ e $\tfrac12$. E il valore medio della nuova componente vale $\tfrac12\cos^{2}(\beta/2)-\tfrac12\sin^{2}(\beta/2)=\tfrac12\cos\beta$, <i>cioè la proiezione classica</i>. Si noti che la probabilità dipende da $\beta/2$ e il valore medio da $\beta$: la prima «vede» il doppio ricoprimento, il secondo no.`},
   {q:R`Perché nella matrice $D^{(j)}$ i due angoli $\alpha$ e $\gamma$ entrano solo come fasi, mentre $\beta$ richiede un conto?`,
    a:R`Perché nella forma collassata $R=e^{-i\alpha J_z}e^{-i\beta J_y}e^{-i\gamma J_z}$ il primo e il terzo fattore contengono $J_z$, e la base scelta è fatta di <b>autostati di $J_z$</b>: un operatore agisce su un suo autostato moltiplicandolo per un numero. Il fattore centrale contiene $J_y$, che <i>non</i> è diagonale in quella base, e quindi mescola i $2j+1$ stati fra loro. <i>Non è una proprietà geometrica di $\beta$</i>: se si fosse scelta la base degli autostati di $J_y$, sarebbe $\beta$ a dare solo fasi e $\alpha,\gamma$ a richiedere il conto. <b>La separazione è un artefatto della base, e la si sfrutta perché la base degli autostati di $J_z$ è quella in cui si misura.</b>`},
   {q:R`Si verifichi che la relazione $Y_\ell^{m}(\theta,\varphi)=c_\ell\{D^{(\ell)}_{m,0}(\varphi,\theta,0)\}^{*}$ riproduce la dipendenza da $\varphi$ corretta.`,
    a:R`Dalla struttura generale, $D^{(\ell)}_{m,0}(\varphi,\theta,0)=e^{-i(\varphi m+0)}d^{(\ell)}_{m,0}(\theta)$, e il coniugato di questo è $e^{+i\varphi m}\{d^{(\ell)}_{m,0}(\theta)\}^{*}$ — con la convenzione di fase scelta la $d$ è reale, quindi il coniugato non la cambia. Resta $Y_\ell^{m}\propto e^{im\varphi}$, <b>che è la dipendenza azimutale giusta</b>: è la stessa che si ottiene risolvendo $L_z Y=\hbar m Y$ con $L_z=-i\hbar\partial_\varphi$. <i>Il terzo angolo di Euler è messo a zero perché $D^{(\ell)}_{m,0}$ non dipende da $\gamma$</i>, e non ne dipende perché il secondo indice è $0$: la fase è $e^{-i\gamma\cdot0}=1$. È il motivo per cui soltanto la colonna $m=0$ dà le armoniche sferiche.`}
  ]}
]},

/* ---------------- 09 · LA ROTAZIONE DI DUE PI GRECO ---------------- */
{ num:'09', title:'La rotazione di due pi greco: perché non è l’identità, e perché nessuno se ne accorge', meta:'il segno meno uno alla due j · l’argomento di Picasso sulla coesistenza · la regola di superselezione · perché la fase relativa non è osservabile · superselezione contro simmetria ordinaria',
  blocchi:[
  {t:'prosa', title:'Il fatto, e perché è strano', tag:'architettura', html:R`
  <p>Girare un oggetto di un giro completo lo lascia dov&rsquo;era. È l&rsquo;esperienza di tutti, ed è anche un teorema su $SO(3)$: $R_{\hat n}(2\pi)=\mathbb 1$ per ogni asse. In meccanica quantistica l&rsquo;operatore corrispondente <b>non</b> è l&rsquo;identità. Ballentine lo scrive nella forma più compatta:</p>
  $$R_{\hat n}(2\pi)\,|j,m\rangle=(-1)^{2j}\,|j,m\rangle$$
  <p>cioè: &laquo;<i>it has no effect if $j$ is an integer, and multiplies by $-1$ if $j$ is half an odd integer</i>&raquo;. Per $j$ intero tutto è come ci si aspetta; per $j$ semidispari un giro completo cambia il segno del vettore di stato.</p>
  <p>Il fatto è facile da verificare quando l&rsquo;asse è $z$, perché lì i vettori sono autostati: $e^{-2\pi iJ_z/\hbar}|j,m\rangle=e^{-2\pi im}|j,m\rangle$, e $e^{-2\pi im}$ vale $1$ per $m$ intero e $-1$ per $m$ semidispari. Per un asse arbitrario Ballentine dà l&rsquo;argomento: si sviluppa $|j,m\rangle$ nella base degli autovettori di $\hat n\cdot\mathbf J$, che si ottengono dai $|j,m\rangle$ con una rotazione, e siccome &laquo;<i>different values of $j$ are never mixed by that rotation</i>&raquo; il fattore è lo stesso. Dunque l&rsquo;asse non conta e si può scrivere semplicemente $R(2\pi)$.</p>
  <p>Per $j=\tfrac12$ si vede anche direttamente, e il conto è di una riga: $R_{\hat n}(2\pi)=e^{-i\pi\,\hat n\cdot\boldsymbol\sigma}$, e siccome $(\hat n\cdot\boldsymbol\sigma)^{2}=\mathbb 1$ la serie si chiude come nella tappa precedente, dando $\mathbb 1\cos\pi-i(\hat n\cdot\boldsymbol\sigma)\sin\pi=-\mathbb 1$.</p>`},
  {t:'reveal', title:'Perché la natura non si contraddice: lo stato non è il ket', tag:'costruzione', steps:[
   {label:'La risposta breve, in Dirac', body:R`
   <p>La contraddizione apparente è questa: una rotazione di $2\pi$ è <i>fisicamente</i> l&rsquo;identità — nessun esperimento può distinguere un apparato dall&rsquo;apparato ruotato di un giro — e invece l&rsquo;operatore non lo è. La risposta è che <b>lo stato non è il vettore</b>: due vettori che differiscono per una fase descrivono lo stesso stato, e $-1$ è una fase.</p>
   <p>Dirac la formula in modo che chiude il discorso nel caso semplice: &laquo;<i>l&rsquo;applicazione di una rivoluzione completa attorno a un qualunque asse lascia immutato un ket oppure lo cambia di segno, a seconda che esso appartenga ad autovalori del modulo del momento angolare totale che siano rispettivamente multipli interi o semidispari di $\hbar$. Naturalmente, uno stato resta sempre inalterato, nonostante la rivoluzione completa, poiché uno stato non viene affatto alterato dal cambiamento di segno del ket ad esso corrispondente</i>&raquo;.</p>
   <p>Fine del problema — <i>se</i> il ket è tutto in un solo settore. La parte interessante comincia quando non lo è.</p>`},
   {label:'L’argomento di Picasso: un sistema non può avere entrambi i tipi di j', body:R`
   <p>Picasso prende il caso misto e ne cava un teorema di esclusione, e il ragionamento è di tre righe. Si supponga che per un dato sistema siano possibili sia valori interi $j'$ sia valori semidispari $j''$ di $j$, e si scriva lo stato generico come somma delle due parti,</p>
   $$|A\rangle=|A'\rangle+|A''\rangle$$
   <p>dove $|A'\rangle$ raccoglie i termini a $j$ intero e $|A''\rangle$ quelli a $j$ semidispari. Una rotazione di $2\pi$ attorno a $z$ lascia $|A'\rangle$ invariato e cambia segno a $|A''\rangle$. Dunque</p>
   $$U(2\pi)\,|A\rangle=|A'\rangle-|A''\rangle\ \neq\ |A\rangle$$
   <p>e il vettore ottenuto <b>non differisce dal primo per una fase globale</b>: differisce per un segno su una parte sola, cioè è un vettore fisicamente diverso. Picasso conclude: &laquo;<i>perciò per un sistema non sono simultaneamente possibili momenti angolari interi e semidispari: le rotazioni di $2\pi$ non sarebbero equivalenti alla trasformazione identica</i>&raquo;.</p>
   <p>Si noti con precisione che cosa l&rsquo;argomento usa: usa che una rotazione di $2\pi$ debba agire sulle <i>osservabili</i> come l&rsquo;identità, perché &laquo;<i>una rotazione di $2\pi$ è la trasformazione identica sulle $q_i$ e sulle $p_i$ e più in generale su tutte le osservabili</i>&raquo;. È questa richiesta — che è un postulato fisico, non un teorema — a escludere la coesistenza.</p>`},
   {label:'Dove l’argomento è troppo forte, e come Ballentine lo raffina', body:R`
   <p>L&rsquo;argomento di Picasso, preso alla lettera, prova qualcosa di più di quanto occorra, e Ballentine mostra che la conclusione giusta è più debole e più interessante. Il punto: $|A'\rangle-|A''\rangle$ è un vettore diverso da $|A'\rangle+|A''\rangle$, ma <b>i due descrivono gli stessi risultati per ogni misura</b> — e allora non sono fisicamente distinguibili, anche se non sono proporzionali.</p>
   <p>Il passaggio che lo dimostra è di quattro righe e si fa una volta per tutte. Si postula, come fa Picasso, che ogni osservabile $A$ sia invariante sotto rotazione di $2\pi$, cioè $[R(2\pi),A]=0$. Si chiamino $|+\rangle$ un vettore del settore a $j$ intero e $|-\rangle$ uno del settore semidispari, cosicché $R(2\pi)|+\rangle=|+\rangle$ e $R(2\pi)|-\rangle=-|-\rangle$. Allora</p>
   <p style="margin-left:1.2em">$\langle+|R(2\pi)A|-\rangle=\langle+|A\,R(2\pi)|-\rangle$, &nbsp; cioè &nbsp; $\langle+|A|-\rangle=-\langle+|A|-\rangle$,</p>
   <p>dove il primo membro si è valutato facendo agire $R(2\pi)$ a sinistra su $|+\rangle$ e il secondo a destra su $|-\rangle$. Un numero uguale al proprio opposto è zero. Dunque</p>
   $$\langle+|A|-\rangle=0$$
   <p>per <i>ogni</i> osservabile $A$. Ballentine: &laquo;<i>thus no physical observable can have nonvanishing matrix elements between states with integer angular momentum and states with half odd-integer angular momentum. This fact forms the basis of a superselection rule</i>&raquo;.</p>`}
  ]},
  {t:'prosa', title:'La regola di superselezione, enunciata nel modo corretto', tag:'costruzione', html:R`
  <p>Dal risultato $\langle+|A|-\rangle=0$ segue che la famiglia di vettori</p>
  $$|\Psi_\omega\rangle=|+\rangle+e^{i\omega}|-\rangle$$
  <p>descrive, al variare della fase $\omega$, un solo stato fisico: per ogni osservabile si ha $\langle\Psi_\omega|A|\Psi_\omega\rangle=\langle+|A|+\rangle+\langle-|A|-\rangle$, perché i termini incrociati sono nulli, e il risultato non dipende da $\omega$. Non c&rsquo;è interferenza fra i due settori, e non c&rsquo;è modo di osservarne la fase relativa.</p>
  <p>Ballentine insiste su come l&rsquo;enunciato va formulato, e la precisazione è quella che distingue una regola di superselezione da un divieto: &laquo;<i>it is sometimes asserted that states that would be described by vectors of the form (7.80) do not exist... The correct statement of the superselection rule is that such matrix elements of $\varrho$, and the phase $\omega$ in (7.80), have no observable consequences</i>&raquo;. <b>Non è vietato scrivere una sovrapposizione di interi e semidispari: è inutile.</b> E siccome è inutile, si può assumere che i blocchi incrociati dell&rsquo;operatore di stato siano nulli — scelta comoda e priva di conseguenze.</p>
  <p>C&rsquo;è un ultimo pezzo, e serve a rendere l&rsquo;assunzione coerente nel tempo. Se si pone $\varrho_{+-}=\varrho_{-+}=0$ all&rsquo;istante iniziale, quella condizione <i>si mantiene</i>, perché l&rsquo;hamiltoniana è un&rsquo;osservabile e quindi commuta con $R(2\pi)$: l&rsquo;equazione del moto si spezza in due equazioni indipendenti, una per settore, e nessun elemento incrociato nasce mai. Ballentine lo dice così: &laquo;<i>if this assumption is made as an initial condition at $t=0$, it will remain true for all time</i>&raquo;. <i>In pratica l&rsquo;universo si divide in due scatole che non comunicano</i>, e il fatto che un elettrone non si sovrapponga coerentemente a un fotone non richiede nessun meccanismo: richiede soltanto che il generatore della dinamica sia osservabile.</p>`},
  {t:'prosa', title:'Superselezione e simmetria ordinaria: dove sta la differenza', tag:'architettura', html:R`
  <p>A prima vista $R(2\pi)$ somiglia a qualunque altra simmetria con una quantità conservata. L&rsquo;operatore di traslazione $e^{-i\mathbf a\cdot\mathbf P/\hbar}$ commuta con l&rsquo;hamiltoniana di un sistema chiuso, e così $R(2\pi)$; entrambi danno un numero quantico conservato — l&rsquo;impulso totale nel primo caso, l&rsquo;autovalore $\pm1$ nel secondo. Ballentine spiega perché l&rsquo;analogia è superficiale, e la spiegazione è l&rsquo;unica cosa che bisogna ricordare di questa sezione.</p>
  <p>&laquo;<i>The difference is that there exist observables that do not commute with $\mathbf P$, such as the position $\mathbf Q$, but there are no observables that fail to commute with $R(2\pi)$.</i>&raquo; Cioè: <b>misurando la posizione si distingue uno stato dal suo traslato; non esiste nessuna misura che distingua uno stato dal suo ruotato di $2\pi$</b>. La traslazione è una simmetria che si può «vedere» con un apparato opportuno; la rotazione di $2\pi$ no, per nessun apparato.</p>
  <p>Ed è questa, e non la conservazione, la proprietà che genera una superselezione. Il settore a $j$ intero e quello a $j$ semidispari non sono due autospazi fra cui si possa interferire: sono due <i>mondi separati</i>, perché nessuno strumento ha elementi di matrice fra loro. Ballentine aggiunge, fra doppie parentesi quadre, che questa è l&rsquo;unica superselezione della meccanica quantistica delle particelle stabili, e che in teoria dei campi l&rsquo;altra è la carica elettrica — con la nota che in una teoria di particelle stabili la carica totale è un multiplo dell&rsquo;identità, quindi la regola diventa banale.</p>
  <p><b>Il bilancio geometrico di questa tappa</b>, e vale dirlo in una frase perché lega le due estremità del movimento. Il gruppo delle rotazioni dello spazio è $SO(3)$, dove una rotazione di $2\pi$ è l&rsquo;identità; il gruppo che agisce sugli stati è il suo <i>ricoprimento doppio</i> $SU(2)$, dove non lo è. Picasso lo annota già nella tappa in cui invoca Bargmann — il teorema vale «per il gruppo delle rotazioni, più precisamente per il suo ricoprimento $SU(2)$» — e questa tappa è il conto delle conseguenze. <i>I mezzi-interi che l&rsquo;algebra ammetteva gratis sono le rappresentazioni di $SU(2)$ che non sono rappresentazioni di $SO(3)$</i>, e la superselezione è il prezzo che la natura paga per averli.</p>`},
  {t:'gram', title:'Interi e semidispari: che cosa cambia, voce per voce', rows:[
   ['','$j$ intero','$j$ semidispari'],
   ['$R(2\\pi)$','$+1$','$-1$'],
   ['periodo di $d^{(j)}(\\beta)$','$2\\pi$','$4\\pi$'],
   ['rappresentazione di $SO(3)$?','sì','no, solo di $SU(2)$'],
   ['momento angolare orbitale','ammesso','escluso'],
   ['spin','ammesso (bosoni)','ammesso (fermioni)'],
   ['dimensione del blocco','dispari','pari'],
   ['esiste lo stato con $m=0$?','sì','no'],
   ['interferenza con l’altro settore','non osservabile','non osservabile']
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Se la fase relativa fra i due settori non è osservabile, in che senso il segno meno della rotazione di $2\pi$ è un fatto fisico e non una convenzione?`,
    a:R`Nel senso che <b>vincola quali sovrapposizioni possono interferire</b>, e questo è osservabile. Un&rsquo;interferenza fra due cammini che differiscono per una rotazione di $2\pi$ <i>è</i> stata misurata, su neutroni: due fasci di neutroni polarizzati, uno dei quali attraversa una regione con campo magnetico che gli fa compiere una precessione di $2\pi$, interferiscono con un segno rovesciato rispetto a chi non lo attraversa. Lì i due rami sono entrambi nel settore semidispari, quindi la fase relativa <b>è</b> osservabile, e il $-1$ si vede nelle frange. <i>Ciò che non è osservabile è la fase fra un vettore a $j$ intero e uno a $j$ semidispari</i>, che è un&rsquo;altra cosa: il primo è un confronto interno a un settore, il secondo fra settori diversi.`},
   {q:R`L&rsquo;argomento di Picasso conclude che un sistema non può avere sia $j$ interi sia semidispari. Ma un atomo di idrogeno ha momento angolare orbitale intero e spin un mezzo: non è un controesempio?`,
    a:R`No, perché ciò che conta è il momento angolare <b>totale</b>. Per l&rsquo;elettrone nell&rsquo;atomo di idrogeno $\mathbf J=\mathbf L+\mathbf S$ con $\ell$ intero e $s=\tfrac12$, quindi $j$ è sempre semidispari: tutti gli stati stanno nello stesso settore, e la regola non è violata. <i>Il teorema vieta la coesistenza nel momento angolare totale, non nei suoi addendi.</i> <b>La verifica è il conto di $(-1)^{2j}$</b>: con $j=\ell\pm\tfrac12$ si ha $2j=2\ell\pm1$, sempre dispari, quindi $R(2\pi)=-1$ su tutti gli stati dell&rsquo;elettrone, qualunque sia $\ell$. E coerentemente: un sistema con un numero <i>pari</i> di fermioni ha $j$ intero, uno con un numero dispari ha $j$ semidispari, ed è il criterio che decide se un atomo composto si comporta da bosone o da fermione.`},
   {q:R`Si verifichi che per $j=1$ e per $j=\tfrac32$ l&rsquo;operatore $e^{-2\pi iJ_z}$ vale rispettivamente $+\mathbb 1$ e $-\mathbb 1$, e si dica perché il conto è così breve.`,
    a:R`Perché $J_z$ è diagonale, quindi l&rsquo;esponenziale è diagonale con elementi $e^{-2\pi im}$. Per $j=1$ gli $m$ sono $1,0,-1$ e tutti e tre danno $e^{\mp2\pi i}=1$: si ottiene $\mathbb 1$. Per $j=\tfrac32$ gli $m$ sono $\pm\tfrac32,\pm\tfrac12$ e tutti e quattro danno $e^{-2\pi im}=-1$, perché $2\pi m$ è un multiplo <i>dispari</i> di $\pi$: si ottiene $-\mathbb 1$. <b>La brevità è la ragione per cui si sceglie $z$ come asse</b>: su un asse generico servirebbe il cambio di base della tappa 08. <i>E il fatto che il risultato sia un multiplo dell&rsquo;identità, cioè uguale per tutti gli $m$ del blocco, è ciò che rende la cosa una proprietà del settore e non dello stato</i> — se dipendesse da $m$ non ci sarebbe nessuna superselezione.`}
  ]}
]},

/* ---------------- 10 · DOVE L ALGEBRA INCONTRA Q VETTOR P ---------------- */
{ num:'10', title:'Dove l’algebra incontra il prodotto vettoriale: perché il momento angolare orbitale è intero', meta:'la domanda posta bene da Ballentine · la strada analitica e la sua crepa · il controesempio di l uguale un mezzo · i due oscillatori, e gli interi senza condizioni al contorno',
  blocchi:[
  {t:'prosa', title:'La domanda, formulata come va formulata', tag:'architettura', html:R`
  <p>Fin qui il momento angolare è stato un oggetto definito dalle sue regole di commutazione, e l&rsquo;algebra ha ammesso $j$ intero e $j$ semidispari senza preferenze. Ora si consideri l&rsquo;oggetto concreto</p>
  <p style="margin-left:1.2em">$\mathbf L=\mathbf Q\times\mathbf P$, &nbsp; cioè il momento angolare costruito con posizione e impulso,</p>
  <p>che soddisfa le stesse regole di commutazione — Ballentine rimanda al suo Problema 3.6 per il conto diretto — e dunque eredita tutto ciò che si è dedotto. La domanda è: <b>quali dei valori ammessi dall&rsquo;algebra questo particolare momento angolare realizza?</b></p>
  <p>Ballentine la pone con una precisione che vale ricopiare, perché indica anche dove la risposta deve stare: &laquo;<i>any further restriction of the orbital angular momentum eigenvalues to only the integer values must come from a special property of the orbital operators that is not possessed by the general angular momentum operators. This special property can only be the relation $\mathbf L=\mathbf Q\times\mathbf P$ ... and the commutation relation satisfied by position and momentum</i>&raquo;.</p>
  <p>Cioè: la restrizione non può venire dall&rsquo;algebra del momento angolare, perché quella è la stessa; <b>deve venire dall&rsquo;algebra canonica di $\mathbf Q$ e $\mathbf P$</b>. Questa è la bussola della tappa, e dice in anticipo che la risposta migliore sarà algebrica e non analitica.</p>`},
  {t:'reveal', title:'La strada analitica, e la crepa che ha dentro', tag:'costruzione', steps:[
   {label:'Il conto classico, in due righe', body:R`
   <p>Si passa in coordinate polari con l&rsquo;asse polare lungo $z$. La rappresentazione di $L_z$ si semplifica radicalmente: dei tre termini che il cambio di variabili produce, il coefficiente di $\partial/\partial r$ è nullo perché $\partial r/\partial y=y/r$ e $\partial r/\partial x=x/r$, e lo stesso succede al coefficiente di $\partial/\partial\theta$. Resta un solo termine, e Picasso fa il conto fino in fondo:</p>
   $$L_z=-i\hbar\frac{\partial}{\partial\varphi}$$
   <p>e commenta che la forma &laquo;<i>è analoga alla $p\to-i\hbar\partial/\partial x$ ed è comprensibile che sia così, perché classicamente $\varphi$ e $L_z$ sono variabili canonicamente coniugate, così come lo sono $x$ e $p$</i>&raquo;. L&rsquo;equazione agli autovalori diventa allora un&rsquo;equazione differenziale ordinaria nella sola $\varphi$, con soluzione generale $\psi_m(r,\theta,\varphi)=f(r,\theta)\,e^{im\varphi}$ con $f$ arbitraria.</p>
   <p>Ora il passaggio decisivo. L&rsquo;angolo azimutale è definito modulo $2\pi$: i punti $(r,\theta,\varphi)$ e $(r,\theta,\varphi+2\pi)$ sono lo stesso punto. Se si <i>richiede</i> che la funzione d&rsquo;onda sia univoca, cioè $\psi_m(r,\theta,\varphi)=\psi_m(r,\theta,\varphi+2\pi)$, allora</p>
   $$e^{im\varphi}=e^{im(\varphi+2\pi)}$$
   <p>che vale soltanto per $m$ intero. Picasso: &laquo;<i>abbiamo così dimostrato che il momento angolare orbitale di una particella ha solo autovalori interi</i>&raquo;; Landau, allo stesso punto: &laquo;<i>perché la funzione sia univoca, è necessario che essa sia periodica in $\varphi$ con periodo $2\pi$</i>&raquo;.</p>`},
   {label:'Le due avvertenze che Picasso e Landau mettono in nota', body:R`
   <p>Picasso segnala subito un problema tecnico, fra parentesi, che vale più di una parentesi: &laquo;<i>la regola di commutazione $[L_z,\varphi]=-i\hbar$ presenta qualche delicato problema di dominio perché, siccome $\varphi$ varia fra $0$ e $2\pi$, la moltiplicazione per $\varphi$ introduce una discontinuità</i>&raquo;. L&rsquo;analogia con $x$ e $p$, che sembrava così pulita, si rompe esattamente dove servirebbe: $\varphi$ non è un operatore autoaggiunto ben definito su funzioni periodiche, perché moltiplicare per $\varphi$ una funzione periodica non dà una funzione periodica. È il motivo per cui non esiste una relazione di indeterminazione angolo-momento angolare nella forma ingenua.</p>
   <p>Landau aggiunge la seconda, e riguarda un paradosso apparente. Siccome l&rsquo;asse $z$ non è privilegiato, lo stesso argomento dà autovalori interi per <i>ogni</i> componente, lungo qualunque direzione: &laquo;<i>questo risultato può sembrare a prima vista paradossale, in particolare se lo si vuole applicare a due direzioni infinitamente vicine</i>&raquo;. Se $L_z$ e $L_{z'}$ con $z'$ vicinissimo a $z$ hanno entrambi autovalori interi, come possono le loro proiezioni differire di un intero? La risposta di Landau è che <b>non esistono stati in cui due componenti lungo direzioni diverse abbiano simultaneamente valori definiti</b>, tranne quando sono tutte nulle: &laquo;<i>l&rsquo;unica autofunzione comune degli operatori $L_x,L_y,L_z$ corrisponde ai valori simultanei</i>&raquo; zero. Dunque «intero» si può dire di una componente per volta, e il paradosso si dissolve nell&rsquo;incompatibilità.</p>`},
   {label:'La crepa: perché la condizione di univocità non è giustificata', body:R`
   <p>Resta la domanda che quasi nessun manuale pone: <b>perché la funzione d&rsquo;onda dovrebbe essere univoca?</b> Ballentine la pone, e la pone due volte.</p>
   <p>Prima osserva che la condizione sarebbe giustificata in una teoria di campo classica, dove il campo è una grandezza osservabile e quindi non può avere due valori nello stesso punto, &laquo;<i>but in quantum theory the state function $\Psi$ does not have such direct physical significance, and the classical boundary conditions cannot be so readily justified. Why should $\Psi$ be single-valued under rotation? Physical significance is attached, not to $\Psi$ itself, but to quantities such as $\langle\Psi|A|\Psi\rangle$, and these will be unchanged by a $2\pi$ rotation even if $m$ is a half-integer and $\Psi$ changes sign</i>&raquo;. È la stessa osservazione della tappa 09 — lo stato non è il vettore — applicata al posto dove fa danno.</p>
   <p>Poi esibisce il controesempio, e questo è il punto in cui la strada analitica va in crisi. La funzione</p>
   $$Y=(\sin\theta)^{1/2}e^{i\varphi/2}$$
   <p>è finita in ogni punto, è normalizzabile, e <b>soddisfa l&rsquo;equazione angolare con $\ell=m=\tfrac12$</b> — cosa che si verifica sostituendola nell&rsquo;equazione di Legendre associata, dove il contributo del seno e quello del termine in $m^{2}$ si cancellano esattamente. Ballentine chiede: &laquo;<i>is it therefore to be admitted as an eigenfunction of orbital angular momentum?</i>&raquo; e risponde, senza aggiustare le carte: &laquo;<i>it is difficult to give an adequate justification for the conventional boundary conditions in this quantum-mechanical setting</i>&raquo;.</p>
   <p>Si noti la forma dell&rsquo;ammissione. Non è che le condizioni al contorno siano sbagliate — il risultato che producono è giusto. È che <i>non si sa giustificarle</i>, e quindi la dimostrazione analitica non dimostra: assume. <b>Serve un argomento che non usi condizioni al contorno di nessun tipo</b>, e la sezione successiva lo dà.</p>`}
  ]},
  {t:'reveal', title:'I due oscillatori: gli interi dalla sola algebra canonica', tag:'costruzione', steps:[
   {label:'I quattro operatori, e perché sono quelli giusti', body:R`
   <p>Si lavora, come Ballentine in questa sezione, in unità in cui $\hbar=1$ e in cui $\mathbf Q$ e $\mathbf P$ sono adimensionali. Gli ingredienti sono soltanto</p>
   <p style="margin-left:1.2em">$L_z=Q_xP_y-Q_yP_x$, &nbsp; $[Q_x,Q_y]=[P_x,P_y]=0$, &nbsp; $[Q_\alpha,P_\beta]=i\delta_{\alpha\beta}$,</p>
   <p>e l&rsquo;autoaggiuntezza degli operatori. Nient&rsquo;altro: nessuna rappresentazione, nessuna funzione d&rsquo;onda, nessun dominio. Si definiscono quattro nuovi operatori mescolando posizione di un asse con impulso dell&rsquo;altro:</p>
   $$q_1=\frac{Q_x+P_y}{\sqrt2},\quad q_2=\frac{Q_x-P_y}{\sqrt2},\quad p_1=\frac{P_x-Q_y}{\sqrt2},\quad p_2=\frac{P_x+Q_y}{\sqrt2}$$
   <p>e si verifica che obbediscono anch&rsquo;essi a relazioni canoniche: $[q_1,q_2]=[p_1,p_2]=0$ e $[q_\alpha,p_\beta]=i\delta_{\alpha\beta}$. Il conto è di una riga per ciascuna: per esempio $[q_1,p_1]=\tfrac12\big([Q_x,P_x]-[P_y,Q_y]\big)=\tfrac12(i+i)=i$, dove il secondo commutatore contribuisce con lo stesso segno perché compare con il meno; e $[q_1,p_2]=\tfrac12\big([Q_x,P_x]+[P_y,Q_y]\big)=\tfrac12(i-i)=0$, che è la cancellazione che rende i due «oscillatori» indipendenti.</p>
   <p><b>Il mescolamento non è arbitrario</b>: sommare una coordinata di un asse all&rsquo;impulso dell&rsquo;altro è l&rsquo;unico modo di ottenere coppie canoniche indipendenti a partire da due gradi di libertà, e la scelta dei segni è dettata dalla richiesta $[q_1,p_2]=0$.</p>`},
   {label:'L’identità, e la conclusione', body:R`
   <p>Si calcola ora $L_z$ in termini dei nuovi operatori. I quadrati si espandono senza precauzioni, perché $Q_x$ commuta con $P_y$ e $P_x$ con $Q_y$:</p>
   $$\tfrac12(p_1^{2}+q_1^{2})-\tfrac12(p_2^{2}+q_2^{2})=Q_xP_y-Q_yP_x=L_z$$
   <p>e l&rsquo;identità è esatta. Ma il primo membro è la <b>differenza di due hamiltoniane di oscillatore armonico</b>, ciascuna con massa $1$ e pulsazione $1$, costruite su coppie canoniche indipendenti — quindi commutanti fra loro. Ballentine: &laquo;<i>comparing this expression with (6.1), we see that it is the difference of two independent harmonic oscillator Hamiltonians, each having mass $M=1$ and angular frequency $\omega=1$. Since the two terms commute, the eigenvalues of $L_z$ are just the differences between the eigenvalues of these two terms</i>&raquo;.</p>
   <p>Lo spettro di $\tfrac12(p^{2}+q^{2})$ è $n+\tfrac12$ con $n$ intero non negativo, e <i>quello</i> risultato è stato ottenuto, nel capitolo sull&rsquo;oscillatore, usando soltanto le relazioni canoniche — cioè esattamente l&rsquo;equivalente di $[q_\alpha,p_\beta]=i\delta_{\alpha\beta}$, e nessuna condizione al contorno. Dunque</p>
   $$\Big(n_1+\tfrac12\Big)-\Big(n_2+\tfrac12\Big)=n_1-n_2$$
   <p>e i mezzi si cancellano. <b>Gli autovalori di $L_z$ sono differenze di interi non negativi, cioè interi — tutti gli interi, positivi e negativi, e nessun semidispari.</b></p>
   <p>Ballentine chiude: &laquo;<i>thus we have shown, directly from the properties of the position and momentum operators, that the orbital angular momentum eigenvalues must be integer multiples of $\hbar$, and that half-integer multiples cannot occur. This approach avoids any problematic discussion of boundary conditions on the state function $\Psi$</i>&raquo;, e aggiunge l&rsquo;osservazione giusta sul rapporto fra le due strade: l&rsquo;argomento algebrico &laquo;<i>could, however, be regarded as an indirect justification for the conventional boundary conditions that lead to the same result</i>&raquo;. <i>Non è che la condizione di univocità sia ingiustificata: è che la sua giustificazione sta qui, e non dove la si mette di solito.</i></p>`},
   {label:'Che cosa resta, e che cosa questo non tocca', body:R`
   <p>Due bilanci, perché sono il punto in cui questo movimento si ferma.</p>
   <p><b>Primo: i mezzi-interi non sono spariti, sono stati esclusi da un oggetto.</b> L&rsquo;algebra della tappa 05 li ammetteva, e continua ad ammetterli: ciò che è stato dimostrato è che <i>quel</i> particolare momento angolare, quello costruito come $\mathbf Q\times\mathbf P$, non li realizza. Un momento angolare che non sia costruito con posizione e impulso — perché agisce su gradi di libertà interni, su cui $\mathbf Q$ e $\mathbf P$ non dicono niente — sfugge all&rsquo;argomento per costruzione. Dirac lo aveva già annotato: &laquo;<i>per un momento angolare di spin non esiste una rappresentazione di Schrödinger, e sono possibili ambedue i tipi di autovalori</i>&raquo;. Il $j=\tfrac12$ dell&rsquo;elettrone sta esattamente nello spazio che questa dimostrazione lascia libero.</p>
   <p><b>Secondo: che cosa succede alle autofunzioni.</b> Fissato che $m$ è intero, l&rsquo;equazione per la dipendenza da $\theta$ diventa l&rsquo;equazione di <span class="str" data-str="polinomi-di-legendre">Legendre associata</span>, le cui soluzioni regolari ai poli esistono soltanto per $\ell$ intero non negativo con $\ell\ge|m|$, e le autofunzioni simultanee di $L^{2}$ e $L_z$ sono le <span class="str" data-str="armoniche-sferiche">armoniche sferiche</span>. Quel conto — la separazione, l&rsquo;equazione radiale, la costruzione esplicita delle $Y_\ell^{m}$ e la loro ortonormalità — è il problema del campo centrale, ed è un altro oggetto: lo si usa qui dove serve, enunciato, e non lo si rifà. L&rsquo;unica cosa che serve sapere, e che segue da questa tappa senza ulteriori conti, è che <b>per il momento angolare orbitale $\ell$ e $m$ sono interi, e per ogni $\ell$ ci sono $2\ell+1$ valori di $m$</b>.</p>
   <p>Vale ancora una riga su $L^{2}$ in coordinate polari, perché serve a riconoscere un operatore che si incontra ovunque. Landau lo annota in due parole: l&rsquo;espressione</p>
   $$L^{2}=-\hbar^{2}\Big[\frac{1}{\sin\theta}\frac{\partial}{\partial\theta}\Big(\sin\theta\frac{\partial}{\partial\theta}\Big)+\frac{1}{\sin^{2}\theta}\frac{\partial^{2}}{\partial\varphi^{2}}\Big]$$
   <p>è, &laquo;<i>a meno di un fattore, la parte angolare dell&rsquo;operatore di Laplace</i>&raquo;. Non è una curiosità: è la ragione per cui ogni problema a simmetria sferica, in qualunque campo della fisica, contiene lo stesso operatore angolare — e perché le armoniche sferiche compaiono identiche nell&rsquo;elettrostatica dei multipoli, nelle vibrazioni di una membrana sferica e nella gravitazione. <i>Ballentine avverte di non scordare, nel calcolare $\mathbf L\cdot\mathbf L$, che i versori $\hat e_\theta$ e $\hat e_\varphi$ non sono costanti</i>: è l&rsquo;errore che fa sbagliare il conto a chi lo prova.</p>`}
  ]},
  {t:'plot', title:'La crepa, in una figura: la fase a metà giro non si richiude',
   intro:R`<p>A sinistra, la parte reale di $e^{im\varphi}$ su due giri interi, per $m=1$ (intero) e per $m=\tfrac12$ (semidispari): la linea verticale ideale a $\varphi=2\pi$ è dove la funzione dovrebbe ritrovarsi. A destra il controesempio di Ballentine, $|Y|^{2}=\sin\theta$ con $\ell=m=\tfrac12$, confrontato con $|Y_1^{0}|^{2}\propto\cos^{2}\theta$ e $|Y_1^{1}|^{2}\propto\sin^{2}\theta$: tutte e tre sono finite e integrabili su $[0,\pi]$.</p>`,
   plots:[{kind:'func2d', xr:[0,12.57], yr:[-1.2,1.2], height:260, ticks:true,
     title:'parte reale di e alla i m phi, per m intero e m semidispari',
     curves:[{f:'Math.cos(x)', col:'#5aa9ff', width:2.4, label:'m uguale 1: si richiude a due pi'},
             {f:'Math.cos(x/2)', col:'#ff6b8a', width:2.4, label:'m uguale un mezzo: cambia segno'},
             {f:'0', col:'#8aa0b8', width:1.2, dash:true, label:'zero'}],
     xlabel:'phi', ylabel:'parte reale'},
    {kind:'func2d', xr:[0,3.1416], yr:[0,1.15], height:260, ticks:true,
     title:'tre densita angolari, tutte finite e integrabili',
     curves:[{f:'Math.sin(x)', col:'#ff6b8a', width:2.4, label:'il controesempio: seno di theta'},
             {f:'Math.cos(x)*Math.cos(x)', col:'#5aa9ff', width:2.4, label:'proporzionale a Y 1 0 al quadrato'},
             {f:'Math.sin(x)*Math.sin(x)', col:'#6bdc9b', width:2.4, label:'proporzionale a Y 1 1 al quadrato'}],
     xlabel:'theta', ylabel:'densita angolare'}],
   leggi:R`<p><b>Che cosa guardare, a sinistra.</b> La curva blu torna a $+1$ dopo un giro; la rosa, a $\varphi=2\pi$, vale $-1$. <i>È lo stesso fenomeno della tappa 09</i>, visto sulla funzione d&rsquo;onda invece che sul vettore di stato: un oggetto con $m$ semidispari non si richiude dopo un giro. La domanda che la figura rende concreta è se questo sia un difetto oppure no, e la risposta della sezione è che non si può decidere guardando $\Psi$ — perché $\Psi$ non è osservabile.</p>
   <p><b>Che cosa guardare, a destra.</b> La curva rosa è il controesempio: $|Y|^{2}=\sin\theta$ è finita ai poli, si annulla lì come le altre, e il suo integrale su $[0,\pi]$ con la misura $\sin\theta\,d\theta$ vale $\pi/2$, finito. <b>Non c&rsquo;è niente, nella figura, che la distingua dalle due funzioni legittime.</b> La condizione che la esclude non è la finitezza e non è l&rsquo;integrabilità: è l&rsquo;univocità, che riguarda l&rsquo;altra variabile.</p>
   <p><b>Che cosa impararne.</b> Che un argomento di regolarità non è un argomento di principio. Il risultato giusto — $\ell$ e $m$ interi per il momento angolare orbitale — è lo stesso, ma la ragione che lo sostiene non sta in queste due figure: sta nell&rsquo;identità fra $L_z$ e la differenza di due oscillatori. <i>Le figure mostrano esattamente che cosa serviva dimostrare altrove.</i></p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Si verifichi che $Y=(\sin\theta)^{1/2}$ soddisfa l&rsquo;equazione angolare con $\ell=m=\tfrac12$, e si dica quale termine fa la cancellazione.`,
    a:R`L&rsquo;equazione è $\sin\theta\,\partial_\theta(\sin\theta\,\partial_\theta Y)+\{\sin^{2}\theta\,\ell(\ell+1)-m^{2}\}Y=0$. Con $Y=(\sin\theta)^{1/2}$ si ha $\partial_\theta Y=\tfrac12(\sin\theta)^{-1/2}\cos\theta$, quindi $\sin\theta\,\partial_\theta Y=\tfrac12(\sin\theta)^{1/2}\cos\theta$, e derivando di nuovo e moltiplicando per $\sin\theta$ si ottiene $\tfrac14\sin\theta\,(\sin\theta)^{-1/2}\cos^{2}\theta-\tfrac12\sin\theta(\sin\theta)^{1/2}$. Con $\ell=m=\tfrac12$ il termine algebrico vale $\{\tfrac34\sin^{2}\theta-\tfrac14\}(\sin\theta)^{1/2}$, e la somma di tutto si annulla identicamente. <b>La cancellazione è fra il $-\tfrac14$ del termine in $m^{2}$ e il $\tfrac14\cos^{2}\theta$ che viene dalla derivata seconda</b>: usando $\cos^{2}=1-\sin^{2}$ i due pezzi costanti si elidono e restano due termini in $\sin^{2}\theta$ che si elidono fra loro. <i>Non è una coincidenza numerica: $\ell=m$ è sempre il caso in cui la soluzione è una potenza di $\sin\theta$</i>, e per $\ell$ intero dà le $Y_\ell^{\ell}\propto\sin^{\ell}\theta\,e^{i\ell\varphi}$.`},
   {q:R`L&rsquo;argomento dei due oscillatori usa che lo spettro di $\tfrac12(p^{2}+q^{2})$ sia $n+\tfrac12$. Non è un cerchio, se quello spettro si ottiene a sua volta con il metodo algebrico?`,
    a:R`No, e la ragione è che i due argomenti algebrici usano <b>algebre diverse</b>. Lo spettro dell&rsquo;oscillatore si ottiene dall&rsquo;algebra canonica $[q,p]=i\hbar$, che fissa $n$ <i>intero</i> perché l&rsquo;operatore numero è semidefinito positivo e la catena si interrompe in basso — e non in alto. Lo spettro del momento angolare si ottiene dall&rsquo;algebra $[J_i,J_j]=i\hbar\varepsilon_{ijk}J_k$, dove la catena si interrompe <i>da entrambi i lati</i>, e la doppia interruzione lascia libero il passo iniziale. <b>È l&rsquo;asimmetria fra una catena con un solo fondo e una con fondo e cima a decidere interi contro semi-interi</b>, e l&rsquo;argomento di Ballentine funziona proprio perché trasporta un problema del secondo tipo in uno del primo. <i>Nessun cerchio: un cambio di algebra.</i>`},
   {q:R`Perché il problema di dominio di $\varphi$ segnalato da Picasso è un problema vero, e non una pedanteria?`,
    a:R`Perché da $[L_z,\varphi]=-i\hbar$ si dedurrebbe, con la relazione di indeterminazione generale, $\Delta L_z\,\Delta\varphi\ge\hbar/2$ — e questo è <b>falso</b> come enunciato: in un autostato di $L_z$ si ha $\Delta L_z=0$, mentre $\Delta\varphi$ è limitato superiormente, perché $\varphi$ sta in un intervallo di lunghezza $2\pi$ e la sua dispersione non può superare $\pi$. Un prodotto nullo non può essere maggiore di $\hbar/2$: la disuguaglianza è violata. <i>La causa è che $\varphi$ non è un operatore autoaggiunto sullo spazio delle funzioni periodiche</i> — moltiplicare per $\varphi$ porta fuori dallo spazio — e quindi il teorema che produce la disuguaglianza non si applica. <b>È lo stesso tipo di guasto che rende non autoaggiunto $-i\partial_r$ sulla semiretta</b>, e si cura sostituendo $\varphi$ con $e^{i\varphi}$, che è limitato e ben definito.`}
  ]}
]},

/* ---------------- 11 · IL MESTIERE ---------------- */
{ num:'11', title:'Il mestiere: quattro pezzi di scritti del canale, svolti', meta:'riconoscere un’armonica sferica dentro uno spinore · i tre commutatori con L scalar S · ruotare uno stato e misurare · il vettore che precede',
  blocchi:[
  {t:'prosa', title:'Che cosa chiedono gli scritti, e in quale forma', tag:'architettura', html:R`
  <p>Il momento angolare è l&rsquo;argomento con la densità d&rsquo;esame più alta del corso — compare in trentasei scritti su quarantasette, con centotrentatré menzioni fra il 2014 e il 2024 — ma non compare mai da solo. Negli scritti di questo canale sta sempre dentro un problema più grande: una particella con spin vincolata su una sfera, due particelle identiche con interazione di spin, un&rsquo;hamiltoniana con accoppiamento spin-orbita perturbata da un oscillatore. <b>Un esercizio costruito su questo movimento in isolamento non somiglia a niente che si trovi sul foglio.</b></p>
  <p>Quindi i quattro esercizi che seguono sono <i>pezzi</i> di scritti reali, con il resto del problema dichiarato e messo da parte. Per ciascuno si fa vedere qual è la domanda che questo movimento risolve e quanto breve sia la risposta quando si vede che è una domanda di simmetria.</p>`},
  {t:'reveal', title:'Esercizio A — riconoscere un’armonica sferica dentro uno spinore (scritto del 02/02/2021)', tag:'esame', steps:[
   {label:'Il testo, e che cosa serve', body:R`
   <p>Il testo chiede: una particella di massa $m$ e spin $\tfrac12$ è vincolata a muoversi su una sfera di raggio unitario, e si trova nello stato specificato dallo spinore normalizzato</p>
   $$|\Psi\rangle=A\begin{pmatrix}3\sin\theta\,e^{-i\varphi}\\ 2e^{i\alpha}\end{pmatrix}$$
   <p>con $\alpha$ un parametro dato. Si calcoli $|A|$; e se si misura $L^{2}$ su $|\Psi\rangle$, quali valori si ottengono e con quale probabilità?</p>
   <p>La chiave è una sola, e sta tutta in questo movimento: <b>riconoscere che le due componenti dello spinore sono proporzionali ad armoniche sferiche</b>. La parte angolare della prima componente è $\sin\theta\,e^{-i\varphi}$, che è proporzionale a $Y_1^{-1}$; la seconda è costante, cioè proporzionale a $Y_0^{0}$. Siccome $L^{2}$ agisce solo sulla parte angolare e non tocca lo spin, i valori possibili sono quelli di $\ell=1$ e $\ell=0$, e le probabilità sono i pesi delle due componenti.</p>`},
   {label:'Il conto: normalizzazione', body:R`
   <p>La norma quadrata dello spinore si ottiene integrando sulla sfera la somma dei moduli quadrati delle due componenti. Con l&rsquo;elemento d&rsquo;angolo solido $d\Omega=\sin\theta\,d\theta\,d\varphi$:</p>
   $$\int9\sin^{2}\theta\,d\Omega=9\cdot2\pi\int_0^{\pi}\sin^{3}\theta\,d\theta=9\cdot2\pi\cdot\frac43=24\pi$$
   <p>dove l&rsquo;integrale $\int_0^{\pi}\sin^{3}\theta\,d\theta=\tfrac43$ è quello che conviene ricordare a memoria, perché torna in ogni esercizio con $\ell=1$. La seconda componente dà</p>
   $$\int4\,d\Omega=4\cdot4\pi=16\pi$$
   <p>e la fase $e^{i\alpha}$ non contribuisce al modulo — <i>il parametro $\alpha$ è lì per vedere se si capisce questo</i>. La somma è $40\pi$, quindi $|A|^{2}\cdot40\pi=1$ e</p>
   $$|A|=\frac{1}{\sqrt{40\pi}}=\frac{\sqrt{10}}{20\sqrt{\pi}}.$$`},
   {label:'Il conto: le probabilità, e il controllo', body:R`
   <p>La probabilità di ciascun valore di $L^{2}$ è il peso relativo della componente corrispondente, cioè il suo contributo alla norma diviso la norma totale:</p>
   $$P\big(L^{2}=2\hbar^{2}\big)=\frac{24\pi}{40\pi}=\frac35,\qquad P\big(L^{2}=0\big)=\frac{16\pi}{40\pi}=\frac25$$
   <p>dove $2\hbar^{2}=\ell(\ell+1)\hbar^{2}$ con $\ell=1$. La somma fa $1$, che è il controllo.</p>
   <p><b>Tre errori che questo esercizio è costruito per catturare.</b> Il primo: credere che la fase $e^{i\alpha}$ entri nelle probabilità — non entra, perché le due componenti dello spinore corrispondono a <i>stati di spin ortogonali</i> e non interferiscono in nessuna misura di quantità orbitali. Il secondo: dimenticare il fattore $\sin\theta$ dell&rsquo;elemento d&rsquo;angolo solido, che cambia $\int\sin^{2}$ in $\int\sin^{3}$ e dà $\pi/2$ invece di $4/3$. Il terzo: cercare le costanti di normalizzazione delle armoniche sferiche sulle tavole — <i>non servono</i>, perché il rapporto fra i pesi si calcola direttamente dagli integrali, e inserire le costanti è un modo di introdurre errori senza guadagnare nulla.</p>`}
  ]},
  {t:'reveal', title:'Esercizio B — i tre commutatori, in una riga di simmetria (scritto del 09/05/2024)', tag:'esame', steps:[
   {label:'Il testo', body:R`
   <p>Il testo propone una particella con la massa e la carica dell&rsquo;elettrone ma spin $\tfrac32$, con hamiltoniana</p>
   $$H_0=\frac{p^{2}}{2m}-\frac{e^{2}}{r}+A\,\mathbf L\cdot\mathbf S$$
   <p>e chiede, al punto (a): si determinino i commutatori $[H_0,\mathbf J]$, $[H_0,\mathbf L]$ e $[H_0,\mathbf S]$, dove $\mathbf J=\mathbf L+\mathbf S$.</p>
   <p>Si potrebbe fare a mano, con le componenti, e sono nove commutatori per ciascuna delle tre domande. <b>Oppure si legge come una domanda di simmetria, e sono tre righe.</b></p>`},
   {label:'La risposta, dal teorema degli scalari', body:R`
   <p>I primi due termini di $H_0$ sono scalari rispetto alle rotazioni e non contengono lo spin: commutano con tutte le componenti di $\mathbf L$, e banalmente con quelle di $\mathbf S$. Tutto il contenuto sta nel terzo termine.</p>
   <p>Ora, $\mathbf L\cdot\mathbf S$ è il prodotto scalare di due vettori <b>entrambi costruiti con le variabili dinamiche del sistema</b> — è la condizione che la tappa 03 ha isolato, e qui è soddisfatta. Dunque è uno scalare rispetto alle rotazioni dell&rsquo;intero sistema, che sono generate da $\mathbf J$. Per il teorema degli scalari:</p>
   $$[H_0,\mathbf J]=0,\qquad [H_0,\mathbf L]\neq0,\qquad [H_0,\mathbf S]\neq0.$$
   <p>E si può dire di più senza fatica: i due commutatori non nulli sono <i>opposti</i>, perché la loro somma è $[H_0,\mathbf J]=0$. Cioè $[\mathbf L\cdot\mathbf S,\mathbf L]=-[\mathbf L\cdot\mathbf S,\mathbf S]$ — l&rsquo;accoppiamento spin-orbita scambia momento angolare fra orbita e spin conservandone il totale, e questo è l&rsquo;intero contenuto fisico del punto (a).</p>
   <p>Il modo più rapido di vedere la stessa cosa è l&rsquo;identità</p>
   $$\mathbf L\cdot\mathbf S=\tfrac12\big(J^{2}-L^{2}-S^{2}\big)$$
   <p>che si ottiene quadrando $\mathbf J=\mathbf L+\mathbf S$ e che esibisce l&rsquo;operatore come funzione di tre scalari. Da lì si legge anche la risposta al punto successivo dello scritto, che chiede lo spettro: <b>$H_0$ commuta con $L^{2}$, con $S^{2}$, con $J^{2}$ e con $J_z$</b>, e quei quattro operatori sono l&rsquo;insieme su cui diagonalizzare. <i>Che $[L^{2},\mathbf L\cdot\mathbf S]=0$ merita un istante</i>: è vero perché $L^{2}$ è uno scalare e $\mathbf L\cdot\mathbf S$ pure, e due scalari commutano sempre fra loro quando uno dei due è una funzione del momento angolare di cui l&rsquo;altro è invariante — qui lo si verifica anche a mano, perché $\mathbf L\cdot\mathbf S$ è lineare in $\mathbf L$ e $[L^{2},L_i]=0$.</p>`},
   {label:'Perché la strada lunga perde punti e non solo tempo', body:R`
   <p>Chi affronta il punto (a) con il calcolo esplicito delle componenti ottiene, se non sbaglia, nove espressioni corrette e <i>non ottiene la struttura</i>. Il punto (b) dello stesso scritto chiede lo spettro e una base di autoket per ogni livello: se non si è capito che $\mathbf J$ è l&rsquo;unico momento angolare conservato, si cerca una base di autostati di $L_z$ e $S_z$, nella quale $H_0$ non è diagonale, e il problema diventa una diagonalizzazione a mano.</p>
   <p><b>La lezione è generale e vale per tutti gli scritti di questo canale</b>: un commutatore fra un&rsquo;hamiltoniana e un momento angolare è una domanda sulla simmetria dell&rsquo;hamiltoniana, e la si risponde guardando <i>che cosa resta invariato</i>. Se nell&rsquo;hamiltoniana compare un campo esterno — un $\mathbf B$ lungo $z$, un termine $\tfrac12m\omega^{2}z^{2}$ come nel punto (c) di quello stesso scritto — allora la simmetria sferica è rotta e resta soltanto il sottogruppo delle rotazioni attorno a quell&rsquo;asse: si conserva $J_z$ e non $J^{2}$. <i>È la trappola del campo esterno della tappa 03, nel posto dove costa punti.</i></p>`}
  ]},
  {t:'reveal', title:'Esercizio C — ruotare uno stato e poi misurare', tag:'esame', steps:[
   {label:'Il problema, nella forma in cui ricorre', body:R`
   <p>Un sistema con $j=1$ si trova nello stato $|1,1\rangle$, autostato di $J_z$ con il valore massimo. Si ruota l&rsquo;apparato di misura di un angolo $\beta$ attorno all&rsquo;asse $y$ — equivalentemente, si misura la componente del momento angolare lungo un asse che forma un angolo $\beta$ con $z$. Con quali probabilità si ottengono i tre valori possibili, e quanto vale il valore medio?</p>
   <p>La risposta sono gli elementi della colonna $m=1$ della matrice $d^{(1)}(\beta)$ della tappa 08, elevati al quadrato:</p>
   $$P_{+1}=\Big(\frac{1+\cos\beta}{2}\Big)^{2},\qquad P_{0}=\frac{\sin^{2}\beta}{2},\qquad P_{-1}=\Big(\frac{1-\cos\beta}{2}\Big)^{2}$$
   <p>e il primo si riscrive, con la formula di bisezione, come $\cos^{4}(\beta/2)$; l&rsquo;ultimo come $\sin^{4}(\beta/2)$.</p>`},
   {label:'I due controlli, e il valore medio', body:R`
   <p>Il primo controllo è la somma, e va fatto sempre:</p>
   $$\Big(\frac{1+\cos\beta}{2}\Big)^{2}+\frac{\sin^{2}\beta}{2}+\Big(\frac{1-\cos\beta}{2}\Big)^{2}=1$$
   <p>identicamente in $\beta$ — i due quadrati danno $\tfrac12+\tfrac12\cos^{2}\beta$ e il termine centrale $\tfrac12-\tfrac12\cos^{2}\beta$.</p>
   <p>Il secondo è il valore medio, e il risultato è quello che fa il ponte con la fisica classica:</p>
   $$\langle J_z\rangle=\hbar\big(P_{+1}-P_{-1}\big)=\hbar\cos\beta$$
   <p>dove la cancellazione è immediata: $\tfrac14[(1+\cos\beta)^{2}-(1-\cos\beta)^{2}]=\cos\beta$. <b>Il valore medio della proiezione è esattamente quello di un vettore classico di lunghezza $\hbar$ inclinato di $\beta$</b>, mentre le singole probabilità sono irriducibilmente quantistiche. È il contenuto del teorema di Ehrenfest per il momento angolare, ottenuto qui senza derivate: <i>i valori medi ruotano come vettori</i>.</p>
   <p>Lo stesso conto per $j=\tfrac12$ dà $P_\pm=\cos^{2}(\beta/2),\sin^{2}(\beta/2)$ e $\langle S_z\rangle=\tfrac{\hbar}{2}\cos\beta$, e vale notare la differenza di struttura: per $j=\tfrac12$ le probabilità dipendono da $\beta/2$, per $j=1$ da $\beta$, e in generale da $\beta/2$ per $j$ semidispari. <i>Il doppio ricoprimento si vede nelle probabilità, non nei valori medi.</i></p>`}
  ]},
  {t:'reveal', title:'Esercizio D — il vettore che precede: evoluzione sotto un’hamiltoniana proporzionale a una componente', tag:'esame', steps:[
   {label:'Il problema, e il fatto che lo risolve senza conti', body:R`
   <p>Si consideri un&rsquo;hamiltoniana $H=\omega L_z$ — è la forma che compare in ogni esercizio con un campo magnetico lungo $z$, e nello scritto del 02/02/2021 compare come $H=\omega(L_z+2S_z)+\tfrac{\omega}{2\hbar}L^{2}$, dove il primo addendo è esattamente questo. L&rsquo;operatore di evoluzione è</p>
   $$U(t)=e^{-i\omega tL_z/\hbar}$$
   <p>che è, <i>letteralmente</i>, l&rsquo;operatore di rotazione di un angolo $\omega t$ attorno a $z$. Dunque: <b>l&rsquo;evoluzione temporale sotto $H=\omega L_z$ è una rotazione rigida della funzione d&rsquo;onda, con l&rsquo;angolo che cresce linearmente nel tempo</b>, e $\psi(\theta,\varphi,t)=\psi(\theta,\varphi-\omega t,0)$.</p>
   <p>Nessun conto: è la coincidenza fra il generatore dell&rsquo;evoluzione e il generatore delle rotazioni. E ne segue subito che $\langle L_z\rangle$ e $\langle L^{2}\rangle$ sono costanti (sono scalari rispetto a questa rotazione, o più semplicemente commutano con $H$), mentre le componenti trasverse girano.</p>`},
   {label:'Il conto, su uno stato concreto', body:R`
   <p>Si prenda come stato iniziale la sovrapposizione normalizzata</p>
   $$|\psi(0)\rangle=\frac{1}{\sqrt2}\big(Y_0^{0}+Y_1^{1}\big)$$
   <p>con la convenzione di fase di Ballentine (7.34), per cui $Y_1^{1}=-\sqrt{3/8\pi}\,\sin\theta\,e^{i\varphi}$. Le energie sono $0$ e $\hbar\omega$, quindi</p>
   <p style="margin-left:1.2em">$|\psi(t)\rangle=\tfrac{1}{\sqrt2}\big(Y_0^{0}+e^{-i\omega t}Y_1^{1}\big)$.</p>
   <p>Si calcolino i valori medi delle due componenti trasverse del <i>versore</i> radiale, $n_x=\sin\theta\cos\varphi=x/r$ e $n_y=\sin\theta\sin\varphi=y/r$ — sono le quantità che un esercizio chiede quando scrive $\langle z/r\rangle$ o $\langle x/r\rangle$. I termini diagonali sono nulli per parità; restano i termini incrociati, e l&rsquo;unico integrale da fare è</p>
   $$\langle Y_0^{0}|\,n_x\,|Y_1^{1}\rangle=-\frac{1}{\sqrt6}$$
   <p>(mentre $\langle Y_0^{0}|n_y|Y_1^{1}\rangle=-i/\sqrt6$: la stessa radice, con una fase $-i$ che viene da $\int\sin\varphi\,e^{i\varphi}d\varphi=i\pi$ contro $\int\cos\varphi\,e^{i\varphi}d\varphi=\pi$). Mettendo insieme:</p>
   $$\langle n_x\rangle_t=-\frac{\cos\omega t}{\sqrt6},\qquad \langle n_y\rangle_t=-\frac{\sin\omega t}{\sqrt6}$$
   <p>e il modulo del vettore $(\langle n_x\rangle,\langle n_y\rangle)$ vale $1/\sqrt6$ a ogni istante. <b>È una precessione: un vettore di lunghezza costante che gira con velocità angolare $\omega$</b>, cioè esattamente ciò che un momento di dipolo classico fa in un campo magnetico.</p>`},
   {label:'Il caso longitudinale, e che cosa distingue i due', body:R`
   <p>Si rifaccia lo stesso esercizio con $Y_1^{0}$ al posto di $Y_1^{1}$, cioè con lo stato $\tfrac{1}{\sqrt2}(Y_0^{0}+Y_1^{0})$. L&rsquo;unico integrale non nullo è ora quello longitudinale,</p>
   $$\langle Y_0^{0}|\,n_z\,|Y_1^{0}\rangle=\frac{1}{\sqrt3}$$
   <p>e siccome $Y_1^{0}$ ha $m=0$ la sua energia sotto $H=\omega L_z$ è <i>zero</i>: i due termini della sovrapposizione sono degeneri, non c&rsquo;è nessuna fase relativa che evolva, e $\langle n_z\rangle=1/\sqrt3$ resta costante. Per far oscillare quel valor medio serve un&rsquo;hamiltoniana che distingua $\ell=0$ da $\ell=1$ — per esempio il termine $\tfrac{\omega}{2\hbar}L^{2}$ dello scritto, che dà energie $0$ e $\hbar\omega$ e produce $\langle n_z\rangle_t=\cos(\omega t)/\sqrt3$.</p>
   <p><b>La morale operativa, e si applica a ogni esercizio di questo tipo.</b> Prima di calcolare un valore medio dipendente dal tempo si guardano le energie dei termini della sovrapposizione: <i>si muove solo ciò che ha una differenza di energia non nulla</i>. Con $H$ proporzionale a $L_z$ oscillano le componenti trasverse e non la longitudinale; con $H$ proporzionale a $L^{2}$ è l&rsquo;opposto. E i due integrali che servono sono sempre gli stessi due, $1/\sqrt6$ e $1/\sqrt3$, perché la regola di selezione di Landau per un vettore polare — $\ell\to\ell\pm1$ — ammette soltanto un elemento di matrice per volta.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Nell&rsquo;esercizio A, perché il risultato non dipende dal parametro $\alpha$? E ci sarebbe una grandezza che ne dipende?`,
    a:R`Non dipende da $\alpha$ perché $\alpha$ è la fase <i>relativa</i> fra le due componenti dello spinore, e le due componenti appartengono a stati di spin ortogonali: in qualunque valore di aspettazione di un operatore che agisce solo sulla parte orbitale (come $L^{2}$, $L_z$, $n_z$) i termini incrociati portano un fattore $\langle\uparrow|\downarrow\rangle=0$ e scompaiono. <b>Una grandezza che dipende da $\alpha$ deve agire sullo spin</b>, e deve essere fuori diagonale: per esempio $\langle S_x\rangle$ o $\langle L_z S_x\rangle$ contengono il prodotto delle due componenti e quindi $\cos$ o $\sin$ di $\alpha$ più la fase $-\varphi$. <i>Il parametro è messo nel testo per vedere se si capisce quale struttura di prodotto tensoriale lo spinore porta</i>, e mettere $\alpha$ fra le incognite è un errore che costa il punto.`},
   {q:R`Nell&rsquo;esercizio B si conclude $[H_0,\mathbf J]=0$ dal fatto che $\mathbf L\cdot\mathbf S$ è uno scalare. Si verifichi il contrario, cioè che $[\mathbf L\cdot\mathbf S,L_z]$ <i>non</i> è nullo, con il conto minimo.`,
    a:R`$[\mathbf L\cdot\mathbf S,L_z]=\sum_i[L_iS_i,L_z]=\sum_i[L_i,L_z]S_i$, perché $\mathbf S$ commuta con $\mathbf L$. Ora $[L_x,L_z]=-i\hbar L_y$ e $[L_y,L_z]=i\hbar L_x$, e il termine con $i=z$ è nullo. Resta $-i\hbar L_yS_x+i\hbar L_xS_y=i\hbar(L_xS_y-L_yS_x)=i\hbar\,(\mathbf L\times\mathbf S)_z$, che non è l&rsquo;operatore nullo. <b>Lo stesso conto con $S_z$ dà $i\hbar(\mathbf S\times\mathbf L)_z$, che è l&rsquo;opposto</b>: la somma si annulla, come il teorema degli scalari prevede. <i>Il conto minimo è quindi due righe e dà anche la forma esplicita dello scambio</i>: il momento angolare trasferito fra orbita e spin è $\mathbf L\times\mathbf S$.`},
   {q:R`Nell&rsquo;esercizio D si dice che l&rsquo;evoluzione sotto $H=\omega L_z$ è una rotazione rigida. Perché allora $\langle n_x\rangle$ cambia nel tempo, se una rotazione non cambia la fisica?`,
    a:R`Perché una rotazione non cambia la fisica <b>se si ruota tutto</b>, e qui si ruota lo stato e non l&rsquo;operatore con cui si misura. L&rsquo;operatore $n_x=x/r$ individua un asse <i>fissato nel laboratorio</i>: ruotare lo stato rispetto a quell&rsquo;asse cambia il valore medio, esattamente come ruotare un dipolo rispetto a un rivelatore fisso cambia il segnale. <i>Ciò che non cambia è qualunque quantità scalare</i> — $\langle L^{2}\rangle$, $\langle L_z\rangle$, la norma — e qualunque quantità riferita ad assi che ruotano con lo stato. <b>Il controllo quantitativo è che il modulo del vettore trasverso resta $1/\sqrt6$</b>: la rotazione sposta il vettore, non lo accorcia.`}
  ]}
]},

/* ---------------- 12 · BILANCIO ---------------- */
{ num:'12', title:'Bilancio: che cosa resta in mano, gli esercizi dei testi, e dove tutto questo riappare', meta:'la macchina riusabile · il problema di Landau svolto · gli esercizi lasciati al lettore · dove il momento angolare torna in fisica',
  blocchi:[
  {t:'prosa', title:'Che cosa resta in mano, in ordine di riusabilità', tag:'architettura', html:R`
  <p><b>Un fatto geometrico.</b> Il gruppo delle rotazioni non è commutativo, e il difetto di commutazione di due rotazioni di angolo $\varepsilon$ attorno ad assi ortogonali è, al secondo ordine, una rotazione di angolo $\varepsilon^{2}$ attorno al terzo asse. Questo si verifica con matrici $3\times3$ e non contiene fisica quantistica.</p>
  <p><b>Una traduzione.</b> Quel fatto, trasportato nello spazio di Hilbert dal teorema di Wigner, diventa $[M_i,M_j]=i\hbar\varepsilon_{ijk}M_k$. Il momento angolare è, per definizione, il generatore delle rotazioni — ed è la definizione di Dirac, non una proprietà del prodotto $\mathbf q\wedge\mathbf p$.</p>
  <p><b>Una macchina.</b> Due operatori non autoaggiunti $M_\pm$, un lemma di tre righe, due catene che devono interrompersi, due conti al bordo. Produce: $\mu^{2}=j(j+1)$, $m$ da $-j$ a $j$, $2j$ intero, $2j+1$ stati per livello, e la costante di normalizzazione $\hbar\sqrt{(j-m)(j+m+1)}$. <i>La stessa macchina gira per l&rsquo;oscillatore armonico, per lo spin, per la composizione di due momenti angolari e per i campi liberi</i>, e si impara una volta.</p>
  <p><b>Un teorema di simmetria.</b> Le componenti di $\mathbf M$ commutano con ogni scalare e si commutano con le componenti di ogni vettore secondo il simbolo di Ricci — con la condizione, che costa punti d&rsquo;esame, che «vettore» e «scalare» si riferiscano a oggetti costruiti con le variabili dinamiche <i>del sistema di cui si parla</i>.</p>
  <p><b>Due matrici calcolate a mano.</b> $d^{(1/2)}(\beta)$, che ha periodo $4\pi$, e $d^{(1)}(\beta)$, che ha periodo $2\pi$. Con esse si risponde a ogni domanda della forma «si misura lungo un asse, poi lungo un altro».</p>
  <p><b>Un prezzo, e un guadagno.</b> Il prezzo: i mezzi-interi obbligano a lavorare con $SU(2)$ e non con $SO(3)$, e producono una regola di superselezione — nessuna osservabile ha elementi di matrice fra il settore intero e quello semidispari. Il guadagno: i mezzi-interi esistono, e descrivono l&rsquo;elettrone.</p>`},
  {t:'reveal', title:'Il problema di Landau, svolto — e il controllo che lo conferma', tag:'esame', steps:[
   {label:'Il testo, dal §29', body:R`
   <p>Landau chiude il paragrafo sugli elementi di matrice dei vettori con un problema, e vale farlo perché è il tipo di conto che usa <i>solo</i> le regole di commutazione: calcolare il valore medio del tensore</p>
   $$T_{ik}=n_in_k-\tfrac13\delta_{ik}$$
   <p>— dove $\mathbf n$ è il versore nella direzione del raggio vettore della particella — «<i>nello stato in cui il vettore ha un modulo assegnato uguale a $\ell$, ma la sua direzione non è assegnata</i>», cioè con $\ell$ fissato e $m$ indeterminato.</p>
   <p>L&rsquo;impostazione di Landau è un argomento di forma, e sta in due frasi: il valore medio cercato «<i>è un operatore che può essere espresso solamente in funzione dell&rsquo;operatore</i> $\hat{\boldsymbol\ell}$», e dunque va cercato nella forma più generale di un tensore simmetrico di rango due a traccia nulla costruito con le componenti di $\hat{\boldsymbol\ell}$:</p>
   $$\overline{T_{ik}}=a\Big(\hat\ell_i\hat\ell_k+\hat\ell_k\hat\ell_i-\tfrac23\delta_{ik}\,\hat\ell^{2}\Big)$$
   <p>Il simmetrizzato è obbligato perché le componenti non commutano e $T_{ik}$ è simmetrico; la sottrazione della traccia è obbligata perché $T_{ik}$ ha traccia nulla per costruzione.</p>`},
   {label:'Come si trova la costante, e quanto vale', body:R`
   <p>Landau determina $a$ contraendo i due membri con $\hat\ell_i\hat\ell_k$ e usando due fatti. Il primo è geometrico e vale la pena isolarlo: <b>$\mathbf n\cdot\hat{\boldsymbol\ell}=0$</b>, perché $\hat{\boldsymbol\ell}=\mathbf r\times\hat{\mathbf p}$ è ortogonale a $\mathbf r$ e quindi a $\mathbf n$ — e questo annulla il primo membro della contrazione. Il secondo è algebrico: il prodotto $\hat\ell_i\hat\ell_k\hat\ell_i\hat\ell_k$ si riduce con le regole di commutazione, usando $\varepsilon_{ikl}\varepsilon_{imh}=2\delta_{lm}\cdots$, a un polinomio in $\ell$. Il risultato è</p>
   $$a=-\frac{1}{(2\ell-1)(2\ell+3)}.$$
   <p><b>Avvertenza sulla fonte, e va detta.</b> Le formule intermedie di questo problema, nel dossier, sono mutilate dall&rsquo;OCR: la costante finale è leggibile senza ambiguità e viene riportata come Landau la scrive, ma i passaggi non sono stati ricostruiti dalla scansione. Il che rende il controllo della sezione seguente non un esercizio di stile ma l&rsquo;unica ragione per cui questa formula può stare qui.</p>`},
   {label:'Il controllo indipendente, per l uguale 1', body:R`
   <p>Si verifica la formula senza usarla, calcolando direttamente la componente $zz$ su stati noti. Per $\ell=1$ la formula dà $a=-1/((2-1)(2+3))=-\tfrac15$, e dunque</p>
   $$\overline{T_{zz}}=a\Big(2\hat\ell_z^{2}-\tfrac23\hat\ell^{2}\Big)=-\tfrac15\Big(2m^{2}-\tfrac43\Big).$$
   <p>Per $m=1$ questo vale $-\tfrac15(2-\tfrac43)=-\tfrac{2}{15}$; per $m=0$ vale $-\tfrac15(-\tfrac43)=\tfrac{4}{15}$.</p>
   <p>Il calcolo diretto: $T_{zz}=\cos^{2}\theta-\tfrac13$, e il suo valore medio si ottiene integrando con $|Y_1^{m}|^{2}$. Con $|Y_1^{1}|^{2}=\tfrac{3}{8\pi}\sin^{2}\theta$ si ha $\langle\cos^{2}\theta\rangle=\tfrac{3}{8\pi}\cdot2\pi\int_0^{\pi}\sin^{3}\theta\cos^{2}\theta\,d\theta=\tfrac34\cdot\tfrac{4}{15}=\tfrac15$, quindi</p>
   $$\langle\cos^{2}\theta-\tfrac13\rangle_{m=1}=\tfrac15-\tfrac13=-\tfrac{2}{15}$$
   <p>e con $|Y_1^{0}|^{2}=\tfrac{3}{4\pi}\cos^{2}\theta$ si ha $\langle\cos^{2}\theta\rangle=\tfrac32\int_0^{\pi}\cos^{4}\theta\sin\theta\,d\theta=\tfrac32\cdot\tfrac25=\tfrac35$, quindi</p>
   $$\langle\cos^{2}\theta-\tfrac13\rangle_{m=0}=\tfrac35-\tfrac13=\tfrac{4}{15}.$$
   <p><b>I due numeri coincidono con quelli della formula di Landau, per entrambi i valori di $m$.</b> Due coincidenze indipendenti su una costante che dipende da $\ell$ sono un controllo serio: la formula è confermata, e lo è per una via che non passa dall&rsquo;OCR.</p>
   <p>Si noti il significato fisico dei due segni. Per $m=\pm1$ la distribuzione angolare è schiacciata sul piano equatoriale ($|Y_1^{\pm1}|^{2}\propto\sin^{2}\theta$) e $\overline{T_{zz}}$ è negativo; per $m=0$ è allungata lungo l&rsquo;asse ($\propto\cos^{2}\theta$) e il segno si rovescia. <i>Il tensore $T_{ik}$ misura la deformazione quadrupolare della nuvola di probabilità</i>, ed è la quantità che in fisica atomica e nucleare si chiama momento di quadrupolo.</p>`}
  ]},
  {t:'prosa', title:'Gli esercizi che i testi lasciano al lettore, e quali vale fare', tag:'esame', html:R`
  <p>I tre libri lasciano aperti dei conti, e l&rsquo;elenco è utile perché è la loro idea di che cosa vada capito.</p>
  <p><b>Picasso</b> lascia al lettore due cose nel capitolo 10 e una all&rsquo;inizio dell&rsquo;11. La prima: verificare che $Y_{1,1}$, $Y_{1,0}$, $Y_{1,-1}$ soddisfino il sistema di equazioni per $L^{2}$ e $L_z$ con $\ell=1$ — conto di dieci righe, e vale farlo perché è il modo più rapido di convincersi che la forma esplicita di $L^{2}$ in coordinate polari è quella giusta. La seconda, nel paragrafo sul campo centrale: ricavare $L^{2}=r^{2}p^{2}-rp_r^{2}r$, con una raccomandazione che è essa stessa il contenuto dell&rsquo;esercizio — «<i>raccomandandogli di non invertire l&rsquo;ordine di operatori che non commutano fra di loro</i>». <i>È l&rsquo;unico esercizio dei tre in cui sbagliare l&rsquo;ordine dei fattori produce un risultato classicamente corretto e quantisticamente falso</i>, e per questo è il più istruttivo.</p>
  <p><b>Ballentine</b> rimanda al suo Problema 3.6 la verifica diretta che le componenti di $\mathbf L=\mathbf Q\times\mathbf P$ soddisfano le stesse regole di commutazione di $\mathbf J$ — cioè il conto che questo movimento ha ottenuto per via di simmetria. E lascia al lettore due cose nel §7.5: la dimostrazione che il sottospazio generato dai $|j,m\rangle$ a $j$ fissato è irriducibile, e la verifica che gli autovettori della componente lungo una direzione generica, quelli scritti esplicitamente per $s=\tfrac12$ e $s=1$, si ottengano applicando le matrici di rotazione agli autovettori di $J_z$. <b>Il secondo è un esercizio d&rsquo;esame travestito</b>: è esattamente il conto dell&rsquo;esercizio C della tappa 11, fatto al contrario.</p>
  <p><b>Landau</b> lascia il problema del tensore quadrupolare, svolto qui sopra, e segnala — senza dimostrarle — le regole di selezione per gli elementi di matrice di un vettore, rimandando al suo §107: &laquo;<i>non riportiamo qui i rispettivi calcoli assai complessi, perché come si vedrà in seguito, queste regole risultano in realtà direttamente dalle proprietà generali di trasformazione delle grandezze vettoriali e possono essere di fatto trovate senza bisogno di calcoli</i>&raquo;. La regola che serve ricordare è una: <b>gli elementi di matrice di un vettore sono non nulli solo per $\ell\to\ell\pm1$ e, separatamente, per $m\to m$ (componente $z$) oppure $m\to m\pm1$ (combinazioni $A_x\pm iA_y$)</b> — ed è la regola che nell&rsquo;esercizio D della tappa 11 riduce quattro integrali a uno.</p>`},
  {t:'prosa', title:'Dove tutto questo riappare, in fisica', tag:'architettura', html:R`
  <p><b>Negli spettri atomici.</b> La degenerazione $2j+1$ di ogni livello è il numero di righe in cui quel livello si separa quando si accende un campo magnetico, perché il campo rompe la simmetria sferica e lascia solo le rotazioni attorno a sé. Contare le righe è misurare $j$, e il legame è esattamente il punto tre di Picasso.</p>
  <p><b>Nella struttura fine.</b> Il termine $A\,\mathbf L\cdot\mathbf S$ dell&rsquo;esercizio B non è un artificio d&rsquo;esame: è l&rsquo;accoppiamento spin-orbita, che viene dal moto dell&rsquo;elettrone nel campo elettrico del nucleo visto dal suo riferimento, e il suo essere uno scalare rispetto a $\mathbf J$ è la ragione per cui gli stati atomici si etichettano con $j$ e non con $\ell$ e $s$ separatamente.</p>
  <p><b>Nella risonanza magnetica.</b> La precessione dell&rsquo;esercizio D è il moto di un momento magnetico in un campo statico, e la frequenza $\omega$ è la frequenza di Larmor. L&rsquo;intera tecnica diagnostica si basa sul fatto che quella precessione è esattamente una rotazione generata dal momento angolare.</p>
  <p><b>Nella fisica delle particelle.</b> Lo spin di una particella <i>è</i> l&rsquo;etichetta $j$ della rappresentazione del gruppo delle rotazioni secondo cui si trasforma il suo stato — questa è la definizione, non una proprietà da misurare a parte. E la distinzione fra interi e semidispari, che qui è apparsa come una regola di superselezione, là diventa la distinzione fra bosoni e fermioni, con il teorema spin-statistica che la collega alla simmetria della funzione d&rsquo;onda per scambio.</p>
  <p><b>In un posto inaspettato: la degenerazione in più dell&rsquo;atomo di idrogeno.</b> Landau osserva che il campo coulombiano ha una legge di conservazione in più, il vettore $\mathbf A=\mathbf r/r-[\mathbf p\times\hat{\boldsymbol\ell}]$ della meccanica classica, e che in meccanica quantistica le sue componenti si commutano, insieme a quelle del momento angolare, secondo regole che «<i>coincidono formalmente con le regole di commutazione degli operatori corrispondenti a rotazioni infinitesime nello spazio euclideo a quattro dimensioni</i>» — risultato che attribuisce a V. A. Fock, 1935. Dalla combinazione $\hat{\mathbf j}_{1,2}=\tfrac12(\hat{\boldsymbol\ell}\pm\hat{\mathbf u})$ si ottengono <i>due</i> algebre di momento angolare indipendenti, e con la macchina di questo movimento — solo con quella — si ricavano i livelli energetici coulombiani e la loro degenerazione $n^{2}$. <b>La stessa algebra, applicata a un gruppo più grande, dà lo spettro dell&rsquo;idrogeno senza risolvere nessuna equazione radiale.</b> È la dimostrazione più forte che il metodo di questo movimento non è un trucco per il momento angolare: è il modo in cui si usano le simmetrie.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Un livello atomico si separa in cinque righe in un campo magnetico debole. Che cosa si deduce, e che cosa resta indeterminato?`,
    a:R`Che la degenerazione è $5=2j+1$, quindi $j=2$ — intero, dunque un sistema con un numero pari di fermioni o un momento angolare puramente orbitale. <b>Resta indeterminato come quel $j=2$ sia composto</b>: può essere $\ell=2$ con $s=0$, oppure $\ell=1$ e $s=1$ accoppiati a $j=2$, oppure altre combinazioni. <i>Il conteggio delle righe misura il momento angolare totale e nient&rsquo;altro</i>, perché è il totale a generare le rotazioni ed è l&rsquo;unico a cui il campo si accoppia nel modo che produce la separazione. Per decomporre servono i rapporti di intensità e il fattore di Landé, cioè informazione in più. <i>È esattamente la situazione che Picasso descrive dicendo che «si risale a $\mu^{2}$ dalla misura in laboratorio della degenerazione del livello».</i>`},
   {q:R`Perché il metodo algebrico di questo movimento dà lo spettro dell&rsquo;idrogeno quando lo si applica all&rsquo;algebra a quattro dimensioni di Fock, mentre non lo dà partendo dal solo momento angolare?`,
    a:R`Perché il momento angolare da solo non commuta con abbastanza cose: $\mathbf L$ commuta con $H$, quindi dà i numeri quantici $\ell$ e $m$ e la degenerazione $2\ell+1$, ma <b>non dà i livelli</b> — per quelli serve un&rsquo;osservabile conservata la cui algebra <i>contenga</i> $H$. Il vettore di Fock fornisce esattamente questo: le sue regole di commutazione contengono $H$ al secondo membro, e normalizzandolo con $\sqrt{-2E}$ si ottengono due algebre di momento angolare le cui etichette $j_1=j_2=j$ sono legate a $E$. <i>Lo spettro esce allora dalla condizione che $j$ sia intero o semidispari</i>, cioè da questa tappa 05, e si trova $E=-1/2n^{2}$ con $n=2j+1$. <b>La degenerazione $n^{2}=(2j+1)^{2}$ è il prodotto delle due degenerazioni</b>, e la ragione per cui livelli con $\ell$ diverso hanno la stessa energia è che il gruppo di simmetria vero è più grande di quello delle rotazioni.`},
   {q:R`Si indichi, per ciascuno dei tre libri, quale affermazione di questo movimento <i>non</i> si troverebbe leggendo solo quel libro.`,
    a:R`Da <b>Picasso</b> non si avrebbe l&rsquo;argomento algebrico per gli interi orbitali: lui dimostra la quantizzazione con la condizione di univocità e non ne discute la giustificazione. Da <b>Ballentine</b> non si avrebbe la distinzione c-numero/q-numero con l&rsquo;esempio del campo esterno — la trappola che costa punti d&rsquo;esame — né la definizione di momento angolare come generatore messa <i>prima</i> di $\mathbf q\wedge\mathbf p$, che è di Dirac. Da <b>Landau</b> non si avrebbero le matrici di rotazione finite né la regola di superselezione; in compenso solo da lui si ha l&rsquo;attribuzione a Born-Heisenberg-Jordan 1926 e il collegamento con la simmetria a quattro dimensioni del campo coulombiano. <i>E solo da Dirac si ha che la connessione con le rotazioni è la definizione del momento angolare, non un suo teorema</i> — che è l&rsquo;affermazione da cui questo movimento è costruito.`}
  ]}
]}
