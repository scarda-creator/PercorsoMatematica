  <p>Resta un terzo fatto, e serve a impostare bene la tappa successiva. $M^{2}$ e $M_3$ <i>non</i> formano, in generale, un insieme completo di osservabili compatibili: un sistema ha altri gradi di libertà, e lo stato non è determinato da due numeri. Si aggiunge allora un insieme di osservabili $\Omega=(\mathcal O_1,\mathcal O_2,\dots)$ fino a completare, con l&rsquo;unica richiesta che commutino con tutte le $M_i$ — cioè, per il teorema di prima, <b>che siano scalari</b>. La base è allora fatta dai vettori $|\Omega',\mu^{2},m\rangle$, e tutta la tappa 04 lavora su quella base senza mai dire che cosa siano gli $\Omega$. <i>Normalmente uno di essi è l&rsquo;hamiltoniana</i>, e per questo il conto algebrico produrrà, come sottoprodotto gratuito, la degenerazione dei livelli energetici.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Si verifichi $[L_x,L_y]=i\hbar L_z$ con il conto diretto, usando $\mathbf L=\mathbf q\wedge\mathbf p$ e $[q_i,p_j]=i\hbar\delta_{ij}$, e si dica quale passaggio contiene tutto il contenuto.`,
    a:R`Con $L_x=q_2p_3-q_3p_2$ e $L_y=q_3p_1-q_1p_3$, nel prodotto $L_xL_y$ solo i termini che contengono <i>sia</i> $q_3$ <i>sia</i> $p_3$ sopravvivono alla sottrazione, perché tutti gli altri commutano. Resta soltanto lo scambio fra $q_3$ e $p_3$: $[L_x,L_y]=q_2p_1[p_3,q_3]+q_1p_2[q_3,p_3]=i\hbar(q_1p_2-q_2p_1)=i\hbar L_z$. <b>Il passaggio che contiene tutto è l&rsquo;unico scambio di $q_3$ con $p_3$</b>: è lì che entra $\hbar$, una volta sola, e il risultato è la terza componente perché l&rsquo;indice $3$ è quello che $L_x$ e $L_y$ hanno in comune. <i>Il conto si fa in una riga, ma non dice che la stessa relazione valga per lo spin</i>: quello lo dice solo la strada per le rotazioni.`},
   {q:R`Il teorema dice che le componenti di $\mathbf M$ commutano con ogni scalare. L&rsquo;operatore di inversione spaziale non è uno scalare nel senso di «funzione di $q$ e $p$ invariante per rotazione» — eppure commuta con $\mathbf M$. Perché?`,
    a:R`Perché la nozione giusta non è «funzione invariante» ma «operatore invariante per rotazione», e l&rsquo;inversione lo è. Landau lo mostra nel modo più breve: l&rsquo;inversione &laquo;<i>cambia il segno sia delle coordinate che degli operatori di derivazione rispetto a queste coordinate e, di conseguenza, l&rsquo;operatore (26,2) resta invariato</i>&raquo; — il momento angolare contiene un prodotto $q\times\partial$, e due segni meno si cancellano. <b>Quindi $\hat I$, $M^{2}$ e $M_3$ hanno un insieme completo di autovettori simultanei</b>, e questo è il motivo per cui la parità è un buon numero quantico accanto al momento angolare. <i>Tecnicamente, il momento angolare è uno pseudovettore</i>: cambia segno sotto inversione tanto quanto il prodotto di due vettori che cambiano segno, cioè per niente.`},
   {q:R`Un&rsquo;hamiltoniana contiene il termine $A\,\mathbf L\cdot\mathbf S$, con $\mathbf L$ orbitale e $\mathbf S$ di spin. Commuta con $\mathbf L$? Con $\mathbf S$? Con $\mathbf J=\mathbf L+\mathbf S$?`,
    a:R`$\mathbf L\cdot\mathbf S$ è un prodotto scalare di due vettori <b>entrambi costruiti con le variabili dinamiche del sistema</b>, quindi è uno scalare rispetto alle rotazioni dell&rsquo;intero sistema — le quali sono generate da $\mathbf J$, non da $\mathbf L$ né da $\mathbf S$ separatamente. Per il teorema degli scalari, dunque, commuta con tutte e tre le componenti di $\mathbf J$ e <i>non</i> con quelle di $\mathbf L$ e di $\mathbf S$ prese a parte. Si vede anche dall&rsquo;identità $\mathbf L\cdot\mathbf S=\tfrac12(J^{2}-L^{2}-S^{2})$, che esibisce l&rsquo;operatore come funzione di tre scalari. <i>È la risposta completa al primo punto di uno degli scritti del canale</i>, e si ottiene senza nessuna tavola di composizione: la ragione è di simmetria, e ruotare l&rsquo;orbita tenendo fermo lo spin non è una simmetria del sistema.`}
  ]}
]},

/* ---------------- 04 · IL METODO ALGEBRICO: M PIU E M MENO ---------------- */
{ num:'04', title:'Il metodo algebrico: due operatori che salgono e scendono, e due catene', meta:'il lemma in due righe · le commutazioni con M piu e M meno · le due catene · la notazione di Dirac, che è un’altra · l’analogia con l’oscillatore, dichiarata',
  blocchi:[
  {t:'prosa', title:'La base su cui si lavora, e i nomi dei numeri', tag:'costruzione', html:R`
  <p>Si parte da dove la tappa precedente ha lasciato. Esiste un insieme completo di osservabili compatibili formato da $M^{2}$, da una componente — si sceglie $M_3$ — e da un insieme $\Omega$ di scalari, che commutano con tutte le componenti di $\mathbf M$ e di cui non serve sapere nulla. La base è fatta dai vettori $|\Omega',\mu^{2},m\rangle$, dove</p>
  <p style="margin-left:1.2em">$\mu^{2}\hbar^{2}$ è l&rsquo;autovalore di $M^{2}$, e $m\hbar$ è l&rsquo;autovalore di $M_3$,</p>
  <p>cosicché $\mu^{2}$ e $m$ sono numeri puri. Picasso avverte che chiamerà spesso $\mu^{2}$ e $m$ «gli autovalori», e dichiara l&rsquo;abuso: &laquo;<i>si consideri questa una terminologia di comodo, oppure si pensi di misurare i momenti angolari in unità $\hbar$</i>&raquo;. Si farà lo stesso qui.</p>
  <p><b>Attenzione a una notazione che cambia da libro a libro</b>, e cambiarla in mezzo a un conto è un modo classico di sbagliare un esame. Picasso chiama $\mu^{2}$ l&rsquo;autovalore di $M^{2}$ in unità $\hbar^{2}$; Ballentine lo chiama $\beta$ e scrive le due equazioni agli autovalori come $J^{2}|\beta,m\rangle=\hbar^{2}\beta|\beta,m\rangle$ e $J_z|\beta,m\rangle=\hbar m|\beta,m\rangle$; Dirac chiama $\beta$ l&rsquo;<i>operatore</i> $m_x^{2}+m_y^{2}+m_z^{2}$, non il suo autovalore, e usa $k$ per il «modulo» del momento angolare. Qui si usa $\mu^{2}$ per l&rsquo;autovalore finché non si dimostra che vale $j(j+1)$, e $j$ da lì in poi.</p>
  <p>Il programma della tappa è quello che Picasso annuncia in una riga, e vale annotare che <i>lo annuncia come un riuso e non come un&rsquo;invenzione</i>: &laquo;<i>il procedimento per determinare gli autovalori di $M_3$ e di $M^{2}$ è molto simile a quello seguito nel Cap. 5 per determinare gli autovalori della hamiltoniana dell&rsquo;oscillatore armonico</i>&raquo;. Dirac dice la stessa cosa del suo §36: &laquo;<i>possiamo studiare un tale sistema dinamico sulle stesse linee seguite nel §34 per l&rsquo;oscillatore armonico</i>&raquo;. La macchina è una, e questa è la seconda volta che gira.</p>`},
  {t:'reveal', title:'Il lemma, che è tutta la macchina', tag:'costruzione', steps:[
   {label:'Due righe, e nessuna ipotesi su che cosa siano A e B', body:R`
   <p>Siano $A$ e $B$ due operatori con</p>
   $$[A,B]=c\,B$$
   <p>dove $c$ è un <i>numero</i> (non un operatore). Sia $|a\rangle$ un autovettore di $A$ con autovalore $a$. Allora</p>
   $$A\,B|a\rangle=(BA+cB)|a\rangle=(a+c)\,B|a\rangle.$$
   <p>Dunque <b>$B|a\rangle$ è nullo, oppure è un autovettore di $A$ con autovalore $a+c$</b>. Questo è tutto. Non si è usato che $A$ sia autoaggiunto, né che lo <span class="str" data-str="spettro">spettro</span> sia discreto, né niente di quantistico: è un&rsquo;identità di algebra lineare, ed è la ragione per cui lo stesso argomento risolve l&rsquo;oscillatore armonico, il momento angolare, lo spin, e produce i campi liberi in teoria quantistica dei campi.</p>
   <p>L&rsquo;alternativa «nullo oppure autovettore» non è una cautela retorica: <b>è il perno della dimostrazione</b>. La catena di stati si interrompe solo se a un certo punto $B$ dà zero, e la tappa successiva consiste interamente nel dimostrare che <i>deve</i> interrompersi e nel leggere che cosa significa.</p>`},
   {label:'Gli operatori, e le loro commutazioni', body:R`
   <p>Si definiscono</p>
   $$M_+=M_1+iM_2,\qquad M_-=M_1-iM_2=(M_+)^{\dagger}$$
   <p>— non sono <span class="str" data-str="operatore-aggiunto">autoaggiunti</span> e quindi non sono osservabili: sono strumenti di calcolo, e il loro essere l&rsquo;uno l&rsquo;aggiunto dell&rsquo;altro è ciò che li rende utili, perché permette di calcolare una norma come un valore di aspettazione. Dalle $[M_i,M_j]=i\hbar\varepsilon_{ijk}M_k$ si ottiene con un conto di una riga</p>
   $$[M_3,M_+]=\hbar\,M_+,\qquad [M_3,M_-]=-\hbar\,M_-,\qquad [M_+,M_-]=2\hbar\,M_3$$
   <p>e, siccome $M_\pm$ sono combinazioni lineari di componenti di $\mathbf M$,</p>
   $$[M_\pm,M^{2}]=0,\qquad [M_\pm,\Omega]=0.$$
   <p>Le prime due sono il lemma con $A=M_3$, $B=M_\pm$ e $c=\pm\hbar$: <b>$M_+$ alza di una unità l&rsquo;autovalore di $M_3$, $M_-$ lo abbassa</b>. Le ultime due dicono che nel farlo non toccano né $\mu^{2}$ né gli altri numeri quantici. Picasso lo registra così: $M_+$ e $M_-$, se non danno risultato nullo, &laquo;<i>fanno cambiare $m$ di una unità, ma non fanno cambiare né $\Omega'$ né $\mu^{2}$</i>&raquo;, con l&rsquo;avvertenza fra parentesi che va letta: &laquo;<i>anche se $|\Omega',\mu^{2},m\rangle$ è normalizzato, i vettori $|\Omega',\mu^{2},m\pm1\rangle$ non lo sono</i>&raquo;.</p>`},
   {label:'Il conto, in notazione di Ballentine', body:R`
   <p>Vale rifare il passaggio come lo scrive Ballentine, perché è una riga e si ricorda. Usando $[J_z,J_+]=\hbar J_+$:</p>
   $$J_zJ_+|\beta,m\rangle=(J_+J_z+\hbar J_+)|\beta,m\rangle=\hbar(m+1)\,J_+|\beta,m\rangle$$
   <p>e la conclusione è quella di Ballentine, parola per parola: &laquo;<i>therefore, either $J_+|\beta,m\rangle$ is an eigenvector of $J_z$ with the raised eigenvalue $\hbar(m+1)$, or $J_+|\beta,m\rangle=0$</i>&raquo;. Lo stesso con $J_-$ e $[J_z,J_-]=-\hbar J_-$ dà l&rsquo;autovalore abbassato $\hbar(m-1)$.</p>
   <p>Si noti che il conto è <i>identico</i> al lemma: non c&rsquo;è nessun passaggio in più. La differenza fra l&rsquo;enunciarlo come lemma e il rifarlo ogni volta è che nel primo caso si vede che è lo stesso argomento dell&rsquo;oscillatore armonico, e nel secondo no.</p>`}
  ]},
  {t:'prosa', title:'La notazione di Dirac, che non è questa — e il conto che lui fa per primo', tag:'fonte', html:R`
  <p>Dirac costruisce la stessa macchina nel §36 dei <i>Principi</i>, e vale guardarne la notazione perché è <i>sua</i> e perché il conto che gli serve lo fa in un ordine diverso. Non scrive $M_\pm$. Pone, con le tre componenti del momento angolare chiamate $m_x,m_y,m_z$,</p>
  <p style="margin-left:1.2em">$\beta=m_x^{2}+m_y^{2}+m_z^{2}$, &nbsp; e poi &nbsp; $\xi=m_x+im_y$, &nbsp; $\eta=m_x-im_y$,</p>
  <p>e osserva prima di tutto che $\beta$, essendo uno scalare, commuta con le tre componenti; se poi le tre componenti sono <i>le sole</i> variabili dinamiche del sistema, allora $\beta$ &laquo;<i>commuta con ogni operatore e deve essere un numero</i>&raquo;. È lo stesso argomento di irriducibilità del §35, riusato: in un sistema di puro momento angolare — cioè in uno spazio a $2j+1$ dimensioni, e l&rsquo;espressione «sistema dinamico per cui $m_x,m_y,m_z$ siano le sole variabili dinamiche» è la definizione di spin — il modulo quadrato non è un operatore ma una costante.</p>
  <p>Il conto che fa subito dopo è quello che nella notazione moderna si scrive $M_+M_-$. Nella sua:</p>
  <p style="margin-left:1.2em">$\xi\eta=\beta-m_z^{2}+\hbar m_z$, &nbsp; e analogamente &nbsp; $\eta\xi=\beta-m_z^{2}-\hbar m_z$,</p>
  <p>da cui ottiene per differenza $\xi\eta-\eta\xi=2\hbar m_z$ — cioè $[M_+,M_-]=2\hbar M_3$ — e per commutazione $m_z\eta-\eta m_z=-\hbar\eta$, cioè $[M_3,M_-]=-\hbar M_-$. <b>Le stesse tre relazioni, ottenute nell&rsquo;ordine opposto</b>: Dirac calcola prima i due prodotti e ne deduce i commutatori, i manuali moderni calcolano prima i commutatori e poi i prodotti.</p>
  <p>Il dossier delle voci non contiene le pagine 200-202, cioè il seguito del §36 dove Dirac porta a termine la ricerca degli autovalori: quel passaggio non gli viene attribuito qui, e la dimostrazione della tappa 05 è quella di Picasso e di Ballentine. Di Dirac resta la notazione, il contesto e la frase che inquadra il metodo: &laquo;<i>vi sono alcune proprietà generali del momento angolare, deducibili in modo semplice dalle relazioni di commutazione fra le sue tre componenti. Queste proprietà devono valere sia per il momento angolare orbitale che per quello di spin</i>&raquo;.</p>`},
  {t:'gram', title:'Le due catene, e che cosa resta fisso lungo ciascuna', rows:[
   ['','$M_+$ applicato','$M_-$ applicato'],
   ['effetto su $m$','$m\\to m+1$','$m\\to m-1$'],
   ['effetto su $\\mu^{2}$','nessuno','nessuno'],
   ['effetto su $\\Omega$','nessuno','nessuno'],
   ['normalizzazione','persa, va rifatta','persa, va rifatta'],
   ['quando dà zero','al massimo della catena','al minimo della catena'],
   ['conto che serve','$M_-M_+=M^{2}-M_3^{2}-\\hbar M_3$','$M_+M_-=M^{2}-M_3^{2}+\\hbar M_3$'],
   ['nome in Dirac','$\\xi$','$\\eta$'],
   ['è un’osservabile?','no, non è autoaggiunto','no, non è autoaggiunto']
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Il lemma richiede che nel commutatore $[A,B]=cB$ la costante $c$ sia un numero. Che cosa va storto se $c$ è un operatore?`,
    a:R`Va storto il passaggio $ABa=(BA+cB)a$, perché $cB|a\rangle$ non è più un multiplo numerico di $B|a\rangle$: non si può concludere che $B|a\rangle$ sia autovettore. <b>È esattamente ciò che succede con $[M_+,M_-]=2\hbar M_3$</b>: quel commutatore <i>non</i> è della forma del lemma, e infatti $M_-$ applicato a un autovettore di $M_+$ non dà nulla di utile — $M_+$ non è autoaggiunto e non ha una base di autovettori. <i>Le due relazioni che si usano sono soltanto quelle con $M_3$</i>, ed è per questo che tutta la costruzione è asimmetrica: una componente privilegiata e due combinazioni che la scalano.`},
   {q:R`Perché si definiscono $M_\pm$ con $M_1$ e $M_2$ e non, per esempio, $M_1\pm iM_3$?`,
    a:R`Perché la combinazione deve essere un operatore di salita <i>per la componente scelta come diagonale</i>, e il lemma funziona solo se il commutatore con quella componente riproduce la combinazione stessa. Con $A=M_3$ e $B=M_1+iM_2$ si ha $[M_3,B]=i\hbar M_2+i(-i\hbar M_1)=\hbar(M_1+iM_2)=\hbar B$: la combinazione si riproduce. Con $B'=M_1+iM_3$ si otterrebbe $[M_3,B']=i\hbar M_2$, che <b>non</b> è un multiplo di $B'$. <i>La scelta non è estetica: è l&rsquo;unica che chiude.</i> Se si sceglie $M_1$ come componente diagonale, le combinazioni giuste diventano $M_2\pm iM_3$, con la stessa permutazione ciclica del simbolo di Ricci.`},
   {q:R`Dirac dice che se $m_x,m_y,m_z$ sono le sole variabili dinamiche allora $\beta$ è un numero. Che sistema fisico è questo, e perché il fatto è utile?`,
    a:R`È uno <b>spin puro</b>: un grado di libertà che ha momento angolare e nient&rsquo;altro — nessuna posizione, nessun impulso. Lo spazio degli stati è allora quello generato dai $2j+1$ vettori con $\mu^{2}$ fissato, e in quello spazio $M^{2}$ è letteralmente il numero $j(j+1)\hbar^{2}$ volte l&rsquo;identità. <i>Il fatto è utile perché rende il sistema finito-dimensionale</i>: tutte le osservabili sono matrici $(2j+1)\times(2j+1)$, i conti si fanno per esteso, e un esercizio su un sistema a due stati diventa algebra lineare elementare. <b>È anche il motivo per cui lo spin si può trattare prima di sapere qualunque cosa sulla dinamica</b>: non c&rsquo;è dinamica dentro, solo l&rsquo;algebra.`}
  ]}
]},

/* ---------------- 05 · PERCHE LE CATENE SI INTERROMPONO ---------------- */
{ num:'05', title:'Perché le catene si interrompono, e lo spettro che ne esce — compresi i mezzi-interi', meta:'il limite grezzo dalla positività · i due conti al bordo · l’equazione per il minimo e la radice da scartare · due j intero · il conteggio',
  blocchi:[
  {t:'prosa', title:'La domanda, posta nei termini esatti in cui va posta', tag:'costruzione', html:R`
  <p>Dal vettore $|\Omega',\mu^{2},m\rangle$ si può salire applicando $M_+$ e scendere applicando $M_-$, ottenendo due catene di stati con lo stesso $\mu^{2}$ e $m$ che cresce o decresce di uno. La domanda di Picasso è: &laquo;<i>queste due catene possono interrompersi?</i>&raquo;. Può cioè esistere un $m$ massimo, che si chiamerà $j$, e un $m$ minimo, che si chiamerà $\bar\jmath$, tali che</p>
  $$M_+|\Omega',\mu^{2},j\rangle=0,\qquad M_-|\Omega',\mu^{2},\bar\jmath\rangle=0\,?$$
  <p>La risposta è che <b>entrambe devono interrompersi</b>, e la dimostrazione è di due righe. Ma conviene vedere prima la forma debole dell&rsquo;argomento, perché mostra che cosa serve e che cosa non basta.</p>`},
  {t:'reveal', title:'Primo passo: il limite grezzo dalla positività', tag:'costruzione', steps:[
   {label:'Il conto, e perché non è ancora la risposta', body:R`
   <p>Si scriva $M_3^{2}=M^{2}-M_1^{2}-M_2^{2}$ e si prenda il valore di aspettazione di ambo i membri sullo stato $|\Omega',\mu^{2},m\rangle$, che è autostato di $M_3$ e quindi di $M_3^{2}$, e anche di $M^{2}$. I valori di aspettazione di $M_1^{2}$ e di $M_2^{2}$ sono non negativi, perché $M_1$ e $M_2$ sono autoaggiunti e dunque $\langle M_1^{2}\rangle=\|M_1|\psi\rangle\|^{2}\ge0$. Quindi</p>
   $$m^{2}\le\mu^{2}$$
   <p>e questa è la disuguaglianza che Picasso numera (10.20) e Ballentine (7.4). La conseguenza è immediata: <b>le catene devono interrompersi entrambe</b>, perché salendo o scendendo indefinitamente $m^{2}$ supererebbe $\mu^{2}$, che è fisso lungo la catena.</p>
   <p>Si osservi però che cosa la disuguaglianza <i>non</i> dà. Dice che $|m|\le\sqrt{\mu^{2}}$, cioè confina $m$ in un intervallo, ma non dice dove esattamente la catena si fermi: il valore massimo potrebbe in principio essere qualunque numero sotto $\sqrt{\mu^{2}}$. Il legame esatto fra $j$ e $\mu^{2}$ viene dal passo successivo, e sarà <i>più stretto</i> di questo.</p>`},
   {label:'L’argomento di Ballentine, nello stesso ordine ma senza valori medi', body:R`
   <p>Ballentine ottiene la stessa disuguaglianza in notazione di elementi di matrice, e il passaggio merita di essere visto perché evita la parola «valore medio». Dalla definizione di $J^{2}$,</p>
   <p style="margin-left:1.2em">$\langle\beta,m|J^{2}|\beta,m\rangle=\langle\beta,m|J_x^{2}|\beta,m\rangle+\langle\beta,m|J_y^{2}|\beta,m\rangle+\langle\beta,m|J_z^{2}|\beta,m\rangle$,</p>
   <p>e poi: &laquo;<i>now $\langle\beta,m|J_x^{2}|\beta,m\rangle=(\langle\beta,m|J_x^{\dagger})(J_x|\beta,m\rangle)\ge0$, since the inner product of a vector with itself cannot be negative</i>&raquo;. Da lì $\beta\ge m^{2}$ e &laquo;<i>thus for a fixed value of $\beta$ there must be maximum and minimum values for $m$</i>&raquo;.</p>
   <p>È la <span class="str" data-str="disuguaglianza-di-schwarz">positività del prodotto scalare</span> usata nella sua forma più elementare — il quadrato di una norma non è negativo — e <b>non serve niente di più in tutta la dimostrazione</b>.</p>`}
  ]},
  {t:'reveal', title:'Secondo passo: i due conti al bordo, e il legame esatto', tag:'costruzione', steps:[
   {label:'Il bordo superiore: da dove viene j(j+1)', body:R`
   <p>Sia $j$ il massimo valore di $m$, cosicché $M_+|\Omega',\mu^{2},j\rangle=0$. Applicando $M_-$ a questa uguaglianza, o equivalentemente prendendo la norma quadrata del vettore nullo, si ha</p>
   $$\langle\Omega',\mu^{2},j|\,M_-M_+\,|\Omega',\mu^{2},j\rangle=0.$$
   <p>Ora si calcola il prodotto $M_-M_+$ in funzione degli operatori diagonali. Con $M_\pm=M_1\pm iM_2$:</p>
   $$M_-M_+=(M_1-iM_2)(M_1+iM_2)=M_1^{2}+M_2^{2}+i[M_1,M_2]=M^{2}-M_3^{2}-\hbar M_3$$
   <p>dove nell&rsquo;ultimo passaggio si è usato $[M_1,M_2]=i\hbar M_3$ e $M_1^{2}+M_2^{2}=M^{2}-M_3^{2}$. Sostituendo e valutando sull&rsquo;autostato, dove $M^{2}$ dà $\mu^{2}\hbar^{2}$ e $M_3$ dà $j\hbar$:</p>
   $$\mu^{2}-j^{2}-j=0\quad\Longrightarrow\quad \mu^{2}=j(j+1).$$
   <p>È il risultato centrale del movimento. Si noti che <b>è più stretto della disuguaglianza grezza</b>: quella permetteva $|m|\le\sqrt{\mu^{2}}=\sqrt{j(j+1)}$, questa dice che il massimo è $j$, e $j<\sqrt{j(j+1)}$ per ogni $j>0$. La differenza fra i due numeri è il contenuto geometrico della tappa 07.</p>`},
   {label:'Il bordo inferiore, l’equazione, e la radice da scartare', body:R`
   <p>Lo stesso conto al bordo inferiore. Sia $\bar\jmath$ il minimo valore di $m$, cosicché $M_-|\Omega',\mu^{2},\bar\jmath\rangle=0$, e si usi il prodotto nell&rsquo;altro ordine:</p>
   $$M_+M_-=(M_1+iM_2)(M_1-iM_2)=M^{2}-M_3^{2}+\hbar M_3$$
   <p>che valutato sullo stato di bordo inferiore dà $\mu^{2}-\bar\jmath^{\,2}+\bar\jmath=0$, cioè $\mu^{2}=\bar\jmath(\bar\jmath-1)$. Uguagliando le due espressioni di $\mu^{2}$ si ottiene un&rsquo;equazione per $\bar\jmath$ dato $j$:</p>
   $$j(j+1)=\bar\jmath(\bar\jmath-1).$$
   <p>È un&rsquo;equazione di secondo grado, e la si risolve senza formula risolutiva osservando che il secondo membro meno il primo si fattorizza:</p>
   $$\bar\jmath(\bar\jmath-1)-j(j+1)=(\bar\jmath-j-1)(\bar\jmath+j)$$
   <p>quindi le due radici sono $\bar\jmath=-j$ e $\bar\jmath=j+1$. <b>La seconda si scarta, e il motivo è una disuguaglianza e non un&rsquo;estetica</b>: $\bar\jmath$ è il minimo e $j$ il massimo, quindi $\bar\jmath\le j$, mentre $j+1>j$. Resta</p>
   $$\bar\jmath=-j.$$
   <p>La catena va dunque da $-j$ a $+j$ a salti di uno. Picasso lo scrive così: &laquo;<i>questa equazione ha due soluzioni... delle quali solo la prima è accettabile</i>&raquo;.</p>`},
   {label:'Il passaggio che produce i mezzi-interi', body:R`
   <p>Ed ecco la conclusione che vale metà del movimento. Si sale da $\bar\jmath=-j$ fino a $j$ a salti <i>di uno</i>, quindi la distanza fra i due estremi deve essere un numero intero non negativo:</p>
   $$j-(-j)=2j\in\{0,1,2,3,\dots\}.$$
   <p>Dunque <b>$2j$ è intero</b>, e $j$ può valere $0,\tfrac12,1,\tfrac32,2,\dots$. Non c&rsquo;è nessun modo, all&rsquo;interno di questa derivazione, di escludere i valori semidispari: <i>l&rsquo;algebra non sa che cosa sia una funzione d&rsquo;onda</i>, non sa che l&rsquo;angolo azimutale sia definito modulo $2\pi$, non ha nessuna condizione di univocità da imporre. Gli unici ingredienti sono stati le tre regole di commutazione e la positività di una norma.</p>
   <p>Ballentine lo nota nello stesso punto e con la stessa economia: &laquo;<i>since the difference between the maximum value $j$ and the minimum value $-j$ must be an integer, it follows that $j=$ integer$/2$</i>&raquo;. E Picasso avverte subito che la generalità ha un prezzo: i risultati &laquo;<i>dipendono solo dalle regole di commutazione</i>&raquo;, quindi &laquo;<i>non è detto che per un particolare sistema... $j$ possa effettivamente assumere tutti i valori che abbiamo trovato come possibili</i>&raquo;. <b>L&rsquo;algebra dà il menù, non l&rsquo;ordinazione</b>: quali $j$ un sistema concreto realizzi è un&rsquo;altra domanda, e per il momento angolare orbitale la risposta è nella tappa 10.</p>`}
  ]},
  {t:'prosa', title:'Il risultato, nei tre punti di Picasso', tag:'architettura', html:R`
  <p>Picasso chiude il paragrafo con tre affermazioni numerate, e vale riportarle nella stessa forma perché sono la risposta completa alla domanda del movimento.</p>
  <p><b>Uno.</b> I possibili autovalori di $M^{2}$ sono $j(j+1)\hbar^{2}$ con $j=0,\tfrac12,1,\tfrac32,2,\dots$</p>
  <p><b>Due.</b> I possibili autovalori di ogni componente $M_i$ sono $m\hbar$ con $m$ intero o semidispari a seconda che $j$ sia intero o semidispari.</p>
  <p><b>Tre.</b> Dato $\mu^{2}$, cioè dato $j$, il numero $m$ può assumere solo i $2j+1$ valori $-j,-j+1,\dots,j-1,j$: esistono quindi $2j+1$ stati indipendenti in corrispondenza a ogni coppia di autovalori di $\Omega$ e di $M^{2}$.</p>
  <p>Il terzo punto è quello che paga di più, e paga in un posto inatteso. <b>Significa che $M^{2}$ e ogni operatore scalare — quindi, normalmente, l&rsquo;hamiltoniana — sono osservabili degeneri</b>, con degenerazione almeno $2j+1$. Picasso ne dichiara l&rsquo;origine: &laquo;<i>questa degenerazione è proprio una conseguenza del teorema di degenerazione del paragrafo 7.2: ha la sua origine nel fatto che $M_+$, $M_-$ e $M_3$, cioè tutte le $M_i$, commutano con $\Omega$ (come pure con $M^{2}$), ma non commutano fra di loro</i>&raquo;.</p>
  <p>La ricaduta sperimentale è dichiarata nello stesso punto e va letta al rovescio di come si è arrivati qui: &laquo;<i>il più delle volte... si risale a $\mu^{2}$ dalla misura in laboratorio... della degenerazione del livello</i>&raquo;. Cioè: in laboratorio si conta <i>quanti</i> stati hanno la stessa energia — per esempio contando le righe in cui un livello si separa accendendo un campo magnetico — e da quel numero si ricava il momento angolare. L&rsquo;algebra di questa tappa è l&rsquo;anello che collega un conteggio di righe spettrali a un numero quantico.</p>`},
  {t:'plot', title:'Il bordo grezzo e il bordo esatto: la differenza fra j e la radice di j(j+1)',
   intro:R`<p>A sinistra, in funzione di $j$: il modulo quadrato $\mu^{2}=j(j+1)$ (blu) e il quadrato del massimo valore della proiezione, $j^{2}$ (rosa). La disuguaglianza grezza $m^{2}\le\mu^{2}$ permetterebbe tutto ciò che sta sotto la curva blu; il conto al bordo dice che il massimo è sulla rosa. A destra, la catena per $j=2$: i cinque valori ammessi di $m$ come segmenti orizzontali, con le due rette $\pm\sqrt{6}$ che il bordo grezzo avrebbe consentito.</p>`,
   plots:[{kind:'func2d', xr:[0,4], yr:[0,20], height:260, ticks:true,
     title:'j(j+1) contro j al quadrato',
     curves:[{f:'x*(x+1)', col:'#5aa9ff', width:2.4, label:'mu quadrato uguale j(j+1)'},
             {f:'x*x', col:'#ff6b8a', width:2.4, label:'j al quadrato, il massimo vero'},
             {f:'x', col:'#8aa0b8', width:1.4, dash:true, label:'la differenza, che vale j'}],
     xlabel:'j', ylabel:'in unita di h tagliato al quadrato'},
    {kind:'func2d', xr:[-0.6,0.6], yr:[-2.9,2.9], height:260, ticks:true,
     title:'la catena per j uguale 2, e il bordo grezzo',
     curves:[{f:'Math.abs(x)<0.42?2:NaN', col:'#5aa9ff', width:3, label:'i cinque valori di m'},
             {f:'Math.abs(x)<0.42?1:NaN', col:'#5aa9ff', width:3},
             {f:'Math.abs(x)<0.42?0:NaN', col:'#5aa9ff', width:3},
             {f:'Math.abs(x)<0.42?-1:NaN', col:'#5aa9ff', width:3},
             {f:'Math.abs(x)<0.42?-2:NaN', col:'#5aa9ff', width:3},
             {f:'Math.sqrt(6)', col:'#ffc24a', width:1.6, dash:true, label:'piu radice di 6'},
             {f:'-Math.sqrt(6)', col:'#ffc24a', width:1.6, dash:true, label:'meno radice di 6'}],
     xlabel:'', ylabel:'m'}],
   leggi:R`<p><b>Che cosa guardare, a sinistra.</b> Le due curve si staccano e non si riavvicinano: la loro differenza è esattamente $j$, la retta tratteggiata, quindi cresce senza limite. In <i>termini relativi</i>, invece, il rapporto $j^{2}/j(j+1)=j/(j+1)$ tende a uno: per $j$ grande il massimo della proiezione è quasi tutto il modulo, e il momento angolare si comporta quasi classicamente. Per $j$ piccolo no: a $j=1$ il modulo è $\sqrt2\simeq1{,}414$ in unità di $\hbar$ e la proiezione massima è $1$, cioè il $71\%$.</p>
   <p><b>Che cosa guardare, a destra.</b> I cinque segmenti blu sono gli unici valori possibili di $m$ per $j=2$; le due rette gialle a $\pm\sqrt6\simeq\pm2{,}449$ sono il limite che la sola disuguaglianza $m^{2}\le\mu^{2}$ avrebbe consentito. <b>Fra il segmento più alto e la retta gialla c&rsquo;è uno spazio vuoto, e quello spazio è tutto il contenuto del conto al bordo</b>: nessuno stato ci vive, e la ragione non è una disuguaglianza ma un&rsquo;uguaglianza, $\mu^{2}=j(j+1)$.</p>
   <p><b>Che cosa impararne.</b> Che gli argomenti di positività danno limiti, e i limiti raramente sono saturati; il valore esatto arriva sempre da una condizione di bordo. <i>È la stessa struttura della dimostrazione del principio di indeterminazione</i> — una disuguaglianza da Schwarz, e la saturazione soltanto per stati speciali — e nella tappa 11 si vedrà che gli stati che saturano, qui, sono proprio quelli con $m=\pm j$.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`La disuguaglianza $m^{2}\le\mu^{2}$ si ottiene dicendo che i valori medi di $M_1^{2}$ e $M_2^{2}$ sono non negativi. Si potrebbe irrobustirla dicendo che sono <i>positivi</i>, escludendo l&rsquo;uguaglianza?`,
    a:R`No, e il controesempio è lo stato a momento angolare nullo: per $j=0$ si ha $\mu^{2}=0$ e $m=0$, quindi $\langle M_1^{2}\rangle=\langle M_2^{2}\rangle=0$ e l&rsquo;uguaglianza è raggiunta. <b>È l&rsquo;unico caso</b>, ed è esattamente «il caso particolare» a cui Picasso allude quando dice che non esistono autostati simultanei delle tre componenti «eccetto un caso particolare». <i>Un passaggio che avesse assunto la positività stretta avrebbe dimostrato che $j=0$ non esiste</i>, che è falso, e sarebbe un errore invisibile: la catena per $j=0$ ha un solo elemento e tutte le formule continuano a dare numeri sensati.`},
   {q:R`Si riottenga $\mu^{2}=j(j+1)$ senza usare il valore medio, ma solo calcolando la norma di $M_+|\mu^{2},j\rangle$.`,
    a:R`La norma quadrata di $M_+|\mu^{2},j\rangle$ è $\langle\mu^{2},j|M_+^{\dagger}M_+|\mu^{2},j\rangle=\langle\mu^{2},j|M_-M_+|\mu^{2},j\rangle$, perché $M_-=(M_+)^{\dagger}$. Siccome il vettore è nullo, la sua norma è zero, e sostituendo $M_-M_+=M^{2}-M_3^{2}-\hbar M_3$ si ottiene $(\mu^{2}-j^{2}-j)\hbar^{2}=0$. <b>È lo stesso conto, ma dice una cosa in più</b>: $\mu^{2}-m^{2}-m$ è, per ogni $m$, la norma quadrata di $M_+|\mu^{2},m\rangle$ divisa $\hbar^{2}$, dunque è <i>non negativa per ogni $m$ della catena</i> e si annulla solo in cima. Scritta come $(j-m)(j+m+1)$ la cosa si vede: entrambi i fattori sono non negativi nell&rsquo;intervallo, e il primo si annulla in cima.`},
   {q:R`Tutto il risultato dipende dal fatto che $M_\pm$ cambiano $m$ di <i>esattamente</i> uno. Da dove viene quell&rsquo;uno, dimensionalmente?`,
    a:R`Dal coefficiente delle relazioni $[M_3,M_\pm]=\pm\hbar M_\pm$, dove $\hbar$ compare una volta: il lemma dà allora un salto $c=\pm\hbar$ sull&rsquo;autovalore di $M_3$, che in unità $\hbar$ è $\pm1$. <b>E quel singolo $\hbar$ viene dal commutatore canonico</b>, cioè in ultima analisi dalla taglia del quanto d&rsquo;azione. <i>È il motivo per cui il momento angolare è quantizzato in unità di $\hbar$ e non in unità arbitrarie</i>: la spaziatura della scala non è una scelta di normalizzazione, è il valore di una costante di natura. Si noti il contrasto con $\mu^{2}=j(j+1)$, che <i>non</i> è lineare in $j$: la scala dei moduli non è equispaziata, quella delle proiezioni sì.`}
  ]}
]},

/* ---------------- 06 · LE COSTANTI E LE MATRICI ---------------- */
{ num:'06', title:'Le costanti di normalizzazione, le matrici esplicite, e un argomento aritmetico che vale un capitolo', meta:'il modulo di C e la fase convenzionale · perché le matrici sono diagonali in j · j uguale un mezzo, uno, tre mezzi · l’identità sulle somme dei quadrati · perché il momento angolare non è una variabile stocastica',
  blocchi:[
  {t:'prosa', title:'Che cosa manca, dopo lo spettro', tag:'architettura', html:R`
  <p>La tappa 05 ha dato i numeri: $j$ e $m$, con le loro condizioni. Non ha dato le <i>ampiezze</i>: sapere che $M_+|j,m\rangle$ è proporzionale a $|j,m+1\rangle$ non basta a calcolare niente, perché ogni valore di aspettazione e ogni probabilità contiene il coefficiente di proporzionalità. Picasso lo aveva segnalato fra parentesi — i vettori ottenuti applicando $M_\pm$ a un vettore normalizzato non sono normalizzati — e qui si paga quel debito.</p>
  <p>Fatto questo si ottiene, come sottoprodotto, tutta l&rsquo;algebra lineare esplicita: le matrici di $M_1$, $M_2$, $M_3$ in uno spazio a $2j+1$ dimensioni, per ogni $j$. E con le matrici in mano la tappa si chiude su un argomento di Ballentine che è <i>aritmetica delle medie</i> e ha una conclusione di filosofia della fisica: il momento angolare non può essere pensato come una variabile casuale classica che a ogni istante assume uno dei suoi autovalori.</p>`},
  {t:'reveal', title:'Il modulo della costante, e la fase che si sceglie', tag:'costruzione', steps:[
   {label:'Il conto del modulo', body:R`
   <p>Si scriva $M_+|j,m\rangle=C\,|j,m+1\rangle$ con $|j,m\rangle$ e $|j,m+1\rangle$ normalizzati, e $C$ un numero che può dipendere da $j$ e da $m$. Prendendo la norma quadrata di ambo i membri, e usando $M_+^{\dagger}=M_-$,</p>
   $$|C|^{2}=\langle j,m|M_-M_+|j,m\rangle=\hbar^{2}\big\{j(j+1)-m(m+1)\big\}$$
   <p>dove si è usato il prodotto $M_-M_+=M^{2}-M_3^{2}-\hbar M_3$ della tappa precedente. Ballentine commenta: &laquo;<i>notice that this expression vanishes for $m=j$, as it must according to a previous result</i>&raquo; — e in effetti la fattorizzazione</p>
   $$j(j+1)-m(m+1)=(j-m)(j+m+1)$$
   <p>rende visibile tutto: il primo fattore si annulla in cima alla catena, il secondo in fondo meno uno (cioè per $m=-j-1$, che non appartiene alla catena), ed entrambi sono non negativi su tutta la catena. <b>La formula contiene, da sola, la condizione di terminazione.</b></p>`},
   {label:'La fase, e perché la si sceglie reale positiva', body:R`
   <p>Il modulo è determinato, la fase di $C$ no. Ballentine spiega esattamente perché: &laquo;<i>the phase of $C$ is arbitrary because Eqs. (7.3), which define the eigenvectors, do not determine their phases</i>&raquo;. Le due equazioni agli autovalori fissano i vettori a meno di una fase ciascuno, e la fase di $C$ dipende da come le si fissa.</p>
   <p>Si sceglie allora $C$ reale positivo, che è una <i>convenzione</i> e non un risultato: fissa le fasi relative di $|j,m\rangle$ e $|j,m+1\rangle$ una volta per tutte lungo la catena. Con questa scelta — che è quella universale, e tutte le tavole pubblicate la assumono —</p>
   $$M_+|j,m\rangle=\hbar\sqrt{(j+m+1)(j-m)}\;|j,m+1\rangle$$
   $$M_-|j,m\rangle=\hbar\sqrt{(j-m+1)(j+m)}\;|j,m-1\rangle$$
   <p>e la seconda si ottiene dalla prima applicando $M_-$ e rinominando l&rsquo;indice muto $m\to m-1$, non con un conto nuovo. <b>Il fatto che la convenzione sia una convenzione va ricordato in un punto preciso</b>: Landau avverte, in nota, che la scelta del segno nelle sue formule per gli elementi di matrice «è conforme alla scelta dei fattori di fase nelle autofunzioni del momento angolare», e dichiara altrove che la sua convenzione per le armoniche sferiche differisce da quella usuale per un fattore $i^{\,\ell}$. Due libri con convenzioni diverse danno segni diversi per gli stessi elementi di matrice, e i moduli quadrati — cioè le probabilità — sono gli stessi.</p>`},
   {label:'Perché le matrici sono diagonali in j, e non solo per J al quadrato', body:R`
   <p>Prima di scrivere le matrici serve sapere quali blocchi sono nulli. Che $J_z$ sia diagonale è per costruzione: $\langle j',m'|J_z|j,m\rangle=\hbar m\,\delta_{j'j}\delta_{m'm}$. Che anche $J_x$ e $J_y$ siano diagonali <i>nell&rsquo;indice $j$</i> — cioè non connettano stati con moduli diversi — richiede un passaggio, e Ballentine lo fa con un trucco che vale memorizzare perché si riusa per qualunque operatore che commuti con $J^{2}$. Si scrive la stessa quantità in due modi:</p>
   $$\langle j',m'|J^{2}\mathbf J|j,m\rangle=\langle j',m'|\mathbf J\,J^{2}|j,m\rangle$$
   <p>che è lecito perché $[J^{2},\mathbf J]=0$. Facendo agire $J^{2}$ a sinistra nel primo membro e a destra nel secondo si ottiene $\hbar^{2}j'(j'+1)\langle j',m'|\mathbf J|j,m\rangle=\hbar^{2}j(j+1)\langle j',m'|\mathbf J|j,m\rangle$: se $j'\neq j$ i due coefficienti differiscono, quindi l&rsquo;elemento di matrice è nullo. Ballentine annota che &laquo;<i>a similar argument clearly holds for any other operator that commutes with $J^{2}$</i>&raquo;.</p>
   <p>Lo spazio si spezza dunque in blocchi di dimensione $2j+1$, uno per ciascun valore di $j$ presente, e <b>ogni blocco è invariante sotto l&rsquo;azione di tutte e tre le componenti</b>. Questo è il senso tecnico dell&rsquo;espressione «rappresentazione di dimensione $2j+1$», e Ballentine lo dirà a parole nel §7.5: il sottospazio generato dai $|j,m\rangle$ a $j$ fissato è «invariante e irriducibile» sotto rotazioni — invariante perché un vettore che ci sta dentro ci resta, irriducibile perché non contiene sottospazi invarianti più piccoli.</p>`}
  ]},
  {t:'reveal', title:'Le matrici, per i tre casi che un esame chiede', tag:'strumento', steps:[
   {label:'j uguale un mezzo: le matrici di Pauli', body:R`
   <p>Lo spazio ha due dimensioni, la base è $|\tfrac12,\tfrac12\rangle$, $|\tfrac12,-\tfrac12\rangle$. La formula del modulo con $j=\tfrac12$ e $m=-\tfrac12$ dà $(j+m+1)(j-m)=1\cdot1=1$, quindi $M_+|\tfrac12,-\tfrac12\rangle=\hbar|\tfrac12,\tfrac12\rangle$ e il solo elemento non nullo di $M_+$ vale $\hbar$. Da $J_x=(J_++J_-)/2$ e $J_y=(J_+-J_-)/2i$ si ottiene $\mathbf S=\tfrac{\hbar}{2}\boldsymbol\sigma$ con</p>
   $$\sigma_x=\begin{pmatrix}0&1\\1&0\end{pmatrix},\qquad \sigma_y=\begin{pmatrix}0&-i\\i&0\end{pmatrix},\qquad \sigma_z=\begin{pmatrix}1&0\\0&-1\end{pmatrix}$$
   <p>che sono le <span class="str" data-str="matrici-di-pauli">matrici di Pauli</span>. Le tre relazioni che servono per calcolare qualunque cosa su un sistema a due stati sono $\sigma_x^{2}=\sigma_y^{2}=\sigma_z^{2}=\mathbb 1$ e</p>
   $$\sigma_x\sigma_y=-\sigma_y\sigma_x=i\sigma_z$$
   <p>più le due cicliche. Ballentine sottolinea che &laquo;<i>these relations are operator equalities, which do not depend upon the use of the particular matrix representation</i>&raquo;: valgono per gli operatori, non per quelle tre matrici. La seconda parte dell&rsquo;uguaglianza, $\sigma_x\sigma_y=-\sigma_y\sigma_x$, dice che le matrici di Pauli <i>anticommutano</i>, e non è un fatto generale del momento angolare — è un fatto speciale di $j=\tfrac12$ che discende da $\sigma_i^{2}=\mathbb 1$, e nella tappa 08 è ciò che permette di esponenziare a mano.</p>
   <p>Verifica di consistenza: $S_x^{2}+S_y^{2}+S_z^{2}=\tfrac{\hbar^{2}}{4}\cdot3\,\mathbb 1=\tfrac34\hbar^{2}\mathbb 1$, e $j(j+1)\hbar^{2}=\tfrac12\cdot\tfrac32\hbar^{2}=\tfrac34\hbar^{2}$. Torna.</p>`},
   {label:'j uguale uno: la matrice con la radice di due', body:R`
   <p>Tre dimensioni, base $|1,1\rangle$, $|1,0\rangle$, $|1,-1\rangle$. Gli elementi di $J_+$ si leggono dalla formula: da $m=0$ a $m=1$ il fattore è $(1+0+1)(1-0)=2$, quindi $\hbar\sqrt2$; da $m=-1$ a $m=0$ è $(1-1+1)(1+1)=2$, quindi ancora $\hbar\sqrt2$. In matrice, con le righe e le colonne ordinate per $m=1,0,-1$,</p>
   $$\frac{J_+}{\hbar}=\begin{pmatrix}0&\sqrt2&0\\0&0&\sqrt2\\0&0&0\end{pmatrix}$$
   <p>e da lì, con $J_x=(J_++J_-)/2$ e $J_-=J_+^{\dagger}$,</p>
   $$J_x=\frac{\hbar}{\sqrt2}\begin{pmatrix}0&1&0\\1&0&1\\0&1&0\end{pmatrix},\qquad J_y=\frac{\hbar}{\sqrt2}\begin{pmatrix}0&-i&0\\i&0&-i\\0&i&0\end{pmatrix},\qquad J_z=\hbar\begin{pmatrix}1&0&0\\0&0&0\\0&0&-1\end{pmatrix}$$
   <p>e si verifica che $[J_x,J_y]=i\hbar J_z$ con un prodotto di matrici $3\times3$, e che $J_x^{2}+J_y^{2}+J_z^{2}=2\hbar^{2}\mathbb 1$ come vuole $j(j+1)=2$. <b>Il fattore $1/\sqrt2$ davanti a $J_x$ e $J_y$ per $j=1$ è una delle cose che si sbagliano più spesso</b>: viene dal $\sqrt2$ della formula di salita diviso il $2$ della definizione di $J_x$, e chi scrive le matrici «per analogia con Pauli», senza il fattore, ottiene un&rsquo;algebra che non chiude.</p>
   <p>Un fatto speciale di $j=1$, che servirà nella tappa 08: la matrice di $J_y$ soddisfa $J_y^{3}=\hbar^{2}J_y$, cioè in unità $\hbar=1$ vale $J_y^{3}=J_y$. Si verifica direttamente, e come $\sigma_y^{2}=\mathbb 1$ per $j=\tfrac12$ è ciò che permette di sommare la serie dell&rsquo;esponenziale a mano.</p>`},
   {label:'j uguale tre mezzi, e la tavola di Ballentine', body:R`
   <p>Quattro dimensioni, base $m=\tfrac32,\tfrac12,-\tfrac12,-\tfrac32$. I tre elementi non nulli di $J_+/\hbar$ si calcolano dalla formula $\sqrt{(j+m+1)(j-m)}$ partendo da $m=-\tfrac32,-\tfrac12,\tfrac12$: i tre prodotti valgono $3$, $4$ e $3$, cioè</p>
   $$\frac{J_+}{\hbar}=\begin{pmatrix}0&\sqrt3&0&0\\0&0&2&0\\0&0&0&\sqrt3\\0&0&0&0\end{pmatrix}$$
   <p>che è la riga $j=\tfrac32$ della tavola (7.16) di Ballentine — lui scrive $\sqrt3$, $\sqrt4$, $\sqrt3$, e la simmetria dei tre numeri rispetto al centro non è un caso: viene dall&rsquo;invarianza di $(j+m+1)(j-m)$ per $m\to-m-1$. Ballentine annota due cose sulla tavola: che &laquo;<i>all nonvanishing matrix elements are one position removed from the diagonal</i>&raquo; e che &laquo;<i>since $J_-=(J_+)^{\dagger}$, the matrix for $J_-$ is the transpose of (7.16)</i>&raquo; — la trasposta e non la trasposta coniugata, perché con la convenzione di fase scelta gli elementi sono reali.</p>
   <p>Da qui $J_x=(J_++J_-)/2$ ha superdiagonale e sottodiagonale $(\sqrt3/2,\,1,\,\sqrt3/2)$ in unità $\hbar$, e la somma dei quadrati vale $\tfrac{15}{4}\hbar^{2}\mathbb 1$, come vuole $j(j+1)=\tfrac32\cdot\tfrac52$. <i>Questo numero, $15/4$, è quello su cui si gioca l&rsquo;argomento della prossima sezione.</i></p>`}
  ]},
  {t:'prosa', title:'L’osservazione di Landau: le diagonali mancanti, e che cosa dicono', tag:'fonte', html:R`
  <p>Guardando le matrici di $J_x$ e $J_y$ per qualunque $j$ si nota una cosa: <b>sono nulle sulla diagonale</b>. Gli elementi non nulli stanno tutti a una posizione dalla diagonale, perché $J_\pm$ connettono soltanto $m$ con $m\pm1$ e $J_x$, $J_y$ sono loro combinazioni.</p>
  <p>Landau legge questo fatto, e vale citarlo per intero perché è il ponte verso la tappa successiva: &laquo;<i>richiamiamo l&rsquo;attenzione sul fatto che mancano nelle matrici delle grandezze $L_x$, $L_y$ elementi diagonali. Poiché l&rsquo;elemento di matrice diagonale dà il valore medio delle grandezze nello stato corrispondente, ciò significa che negli stati con valori determinati di $L_z$, i valori medi di $L_x$ e $L_y$ sono nulli</i>&raquo;. E tira la conseguenza: &laquo;<i>così, se la proiezione del momento angolare in una qualche direzione dello spazio ha una determinata importanza, la stessa direzione è assunta da tutto il vettore</i>&raquo; — dove «importanza» è un calco del russo per «valore», e la frase dice che il vettore momento angolare medio punta lungo l&rsquo;asse scelto.</p>
  <p>Landau attribuisce il calcolo di questi elementi di matrice, e per esteso: è di <b>M. Born, W. Heisenberg e P. Jordan, 1926</b>, e lo scrive due volte — una per le componenti del momento angolare, una per le componenti di un vettore generico. Vale ricordare che cosa era quel lavoro: il <i>Dreimännerarbeit</i>, l&rsquo;articolo in cui la meccanica delle matrici viene costruita, un anno prima dell&rsquo;equazione di Schrödinger. <b>Gli elementi di matrice del momento angolare sono fra i primi risultati quantitativi della meccanica quantistica, e sono stati ottenuti esattamente per questa via</b> — l&rsquo;algebra dei commutatori — perché nel 1926 l&rsquo;altra via non esisteva ancora. Il metodo di questa tappa non è un&rsquo;alternativa elegante alla strada analitica: è la strada originale.</p>`},
  {t:'reveal', title:'L’argomento aritmetico di Ballentine, e perché conclude qualcosa di grosso', tag:'errore', steps:[
   {label:'L’identità, e i due casi in cui si legge diversamente', body:R`
   <p>Per qualunque $j$, la somma dei quadrati delle tre componenti è un multiplo dell&rsquo;identità:</p>
   $$S_x^{2}+S_y^{2}+S_z^{2}=\hbar^{2}s(s+1)\,\mathbb 1.$$
   <p>È la definizione di $J^{2}$ e il fatto che valga $j(j+1)\hbar^{2}$ su tutto il blocco. Ballentine osserva che il significato di questa identità cambia radicalmente con $s$.</p>
   <p>Per $s=\tfrac12$ è banale: ciascuna delle tre matrici $S_i^{2}$ è già un multiplo dell&rsquo;identità, $\tfrac14\hbar^{2}\mathbb 1$, e la somma lo è per forza.</p>
   <p>Per $s=1$ i tre quadrati non sono multipli dell&rsquo;identità, <i>ma commutano fra loro</i>: hanno quindi una base comune di autovettori, e l&rsquo;identità diventa una relazione fra autovalori. Gli autovalori di $S_x^{2}$ per $s=1$ sono $\hbar^{2}$ (due volte) e $0$; lo stesso per gli altri due; e siccome la somma deve fare $2\hbar^{2}$, Ballentine conclude: &laquo;<i>for any such eigenvector, two of the matrices must have the eigenvalue $\hbar^{2}$ and one must have the eigenvalue zero</i>&raquo;. C&rsquo;è dunque una <b>correlazione</b> fra i tre valori, ma niente di paradossale: in ciascuno di quei tre stati, due componenti hanno quadrato $\hbar^{2}$ e una ha quadrato nullo.</p>`},
   {label:'Per j uguale tre mezzi: i tre quadrati non commutano, e l’aritmetica non torna', body:R`
   <p>Per $s=\tfrac32$ la situazione cambia, e cambia due volte. Primo: i tre quadrati <b>non commutano</b> fra loro — si verifica con un prodotto di matrici $4\times4$ — quindi non esiste nessuna base comune di autovettori e l&rsquo;identità non si può leggere come una relazione fra autovalori simultanei.</p>
   <p>Secondo, e qui l&rsquo;argomento diventa stringente. Gli autovalori di $S_x^{2}$ per $s=\tfrac32$ sono soltanto due, $\tfrac94\hbar^{2}$ e $\tfrac14\hbar^{2}$, ciascuno doppio, e lo stesso vale per $S_y^{2}$ e $S_z^{2}$ (basta guardare $S_z$, che è diagonale con $\pm\tfrac32,\pm\tfrac12$). Il secondo membro dell&rsquo;identità vale $\tfrac{15}{4}\hbar^{2}$. Ma le somme di tre numeri scelti fra $\tfrac94$ e $\tfrac14$ sono soltanto quattro:</p>
   $$\tfrac34,\quad \tfrac{11}{4},\quad \tfrac{19}{4},\quad \tfrac{27}{4}$$
   <p>e <b>$\tfrac{15}{4}$ non è fra queste</b>: cade fra $\tfrac{11}{4}$ e $\tfrac{19}{4}$. Ballentine lo registra così: &laquo;<i>an eigenvalue of each term on the left hand side must be either $9\hbar^{2}/4$ or $\hbar^{2}/4$, and no sum of three such numbers can add up to the eigenvalue $15\hbar^{2}/4$ on the right</i>&raquo;.</p>`},
   {label:'La conclusione, che è di interpretazione e non di calcolo', body:R`
   <p>Si immagini di voler pensare il momento angolare come una <i>variabile stocastica classica</i>: un vettore che a ogni istante ha tre componenti ben definite, ciascuna uguale a uno dei suoi autovalori, con le componenti che fluttuano nel tempo secondo le probabilità che la teoria prescrive. È l&rsquo;immagine ingenua, ed è anche l&rsquo;immagine che sta sotto a quasi tutte le intuizioni sbagliate sul momento angolare. Ballentine la formula con cura: &laquo;<i>one might have been inclined to regard quantum-mechanical variables as classical stochastic variables, each of which takes on one of its allowed eigenvalues at any instant of time</i>&raquo;.</p>
   <p>Se quell&rsquo;immagine fosse corretta, in ogni istante $S_x^{2}+S_y^{2}+S_z^{2}$ sarebbe la somma di tre autovalori — cioè uno dei quattro numeri elencati sopra — mentre l&rsquo;operatore vale <i>esattamente</i> $\tfrac{15}{4}\hbar^{2}$ in ogni stato, senza fluttuazione alcuna, perché è un multiplo dell&rsquo;identità. <b>L&rsquo;immagine è dunque falsa, e il motivo è l&rsquo;aritmetica.</b> Ballentine: &laquo;<i>but the above example shows that this interpretation cannot be correct, at least not for angular momentum</i>&raquo;.</p>
   <p>Vale notare la forma dell&rsquo;argomento, perché è dello stesso tipo delle disuguaglianze di Bell e precede di un capitolo la loro discussione: <i>non</i> si mostra che una previsione quantistica contraddice l&rsquo;esperienza, si mostra che una <b>assegnazione simultanea di valori a osservabili incompatibili</b> è aritmeticamente impossibile. Non serve nessun esperimento: serve che $15/4$ non sia somma di tre numeri presi da $\{9/4,1/4\}$. È per questo che l&rsquo;argomento sta in una tappa sulle matrici e non in una sull&rsquo;interpretazione: il contenuto è tutto nei coefficienti.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Si scrivano le matrici di $J_x$, $J_y$, $J_z$ per $j=1$ e si verifichi $[J_x,J_y]=i\hbar J_z$ a mano, dicendo dove il fattore $1/\sqrt2$ è indispensabile.`,
    a:R`Con $J_x=\tfrac{\hbar}{\sqrt2}A$ e $J_y=\tfrac{\hbar}{\sqrt2}B$ dove $A$ e $B$ sono le matrici di elementi $1$ e $\pm i$, il commutatore vale $\tfrac{\hbar^{2}}{2}[A,B]$. Il conto dà $[A,B]=2i\,\mathrm{diag}(1,0,-1)$, quindi $[J_x,J_y]=i\hbar^{2}\,\mathrm{diag}(1,0,-1)=i\hbar J_z$. <b>Senza il fattore $1/\sqrt2$</b> si otterrebbe $[J_x,J_y]=2i\hbar J_z$, cioè un&rsquo;algebra con il commutatore raddoppiato — che <i>non</i> è l&rsquo;algebra del momento angolare, ed è la stessa algebra riscalata, con un «$\hbar$ efficace» doppio. Le conseguenze si vedrebbero subito: la spaziatura degli autovalori di $J_z$ sarebbe $2$ invece di $1$. <i>Il fattore non è una normalizzazione: è ciò che fissa l&rsquo;unità della scala.</i>`},
   {q:R`La formula $|C|^{2}=\hbar^{2}(j-m)(j+m+1)$ dà zero per $m=j$ e, formalmente, anche per $m=-j-1$. Il secondo zero significa qualcosa?`,
    a:R`Significa che la formula «sa» dov&rsquo;è l&rsquo;altro bordo della catena, spostato di uno. Il modulo quadrato $|C|^{2}$ è la norma di $M_+|j,m\rangle$: si annulla in cima ($m=j$), e il valore $m=-j-1$ sta <i>fuori</i> dalla catena, un passo sotto il fondo. <b>La lettura corretta è che fra $m=-j-1$ e $m=j$ il prodotto dei due fattori è positivo e fuori è negativo</b>: siccome una norma quadrata non può essere negativa, l&rsquo;espressione stessa certifica che nessuno stato della catena può avere $m$ fuori dall&rsquo;intervallo. <i>La condizione di terminazione e la costante di normalizzazione sono lo stesso conto letto due volte.</i>`},
   {q:R`Per $s=1$ i tre quadrati $S_x^{2},S_y^{2},S_z^{2}$ commutano; per $s=\tfrac32$ no. Da dove viene la differenza, se l&rsquo;algebra di $\mathbf S$ è la stessa?`,
    a:R`Dalla dimensione dello spazio, e quindi da quali identità polinomiali le matrici soddisfano. Per $s=\tfrac12$ si ha $\sigma_i^{2}=\mathbb 1$ e tutto commuta banalmente; per $s=1$ vale $S_y^{3}=\hbar^{2}S_y$, e quell&rsquo;identità cubica è abbastanza stretta da far commutare i quadrati; per $s=\tfrac32$ il polinomio minimo è di grado quattro e non impone nulla di simile. <b>L&rsquo;algebra di Lie è la stessa, le rappresentazioni no</b>: una rappresentazione di dimensione $2j+1$ porta identità polinomiali di grado $2j+1$, e sono quelle a decidere che cosa commuta con che cosa fra i polinomi nei generatori. <i>È lo stesso fenomeno per cui l&rsquo;esponenziale si somma a mano per $j=\tfrac12$ e $j=1$ e non per $j=\tfrac32$.</i>`}
  ]}
]},

/* ---------------- 07 · IL MODELLO VETTORIALE ---------------- */
{ num:'07', title:'Il modello vettoriale: che cosa la figura del cono dice di vero, e in quale punto mente', meta:'il modulo che eccede la proiezione massima · il cono di precessione · le medie nulle delle componenti trasverse · la saturazione dell’indeterminazione · il limite classico',
  blocchi:[
  {t:'prosa', title:'La figura che tutti hanno in testa, e la domanda che la mette alla prova', tag:'architettura', html:R`
  <p>L&rsquo;immagine tradizionale del momento angolare quantistico è un vettore di lunghezza fissa $\sqrt{j(j+1)}\,\hbar$ che precede attorno all&rsquo;asse $z$, con la proiezione $m\hbar$ fissa e la punta che descrive un cerchio: un cono. Landau la chiama «modello vettoriale» e la usa; è utilissima e va costruita con cura, perché contiene un pezzo di verità esatta, un pezzo di verità statistica, e un pezzo falso.</p>
  <p>La domanda che separa i tre pezzi è semplice e vale porsela esplicitamente: <b>in uno stato $|j,m\rangle$, che cosa si può dire delle componenti $M_1$ e $M_2$?</b> La risposta, calcolata nella tappa precedente e letta da Landau, è che i loro <i>valori medi</i> sono nulli. La loro <i>dispersione</i> non lo è, e la si calcola in due righe.</p>`},
  {t:'reveal', title:'I tre pezzi della figura, separati', tag:'costruzione', steps:[
   {label:'Primo pezzo, esatto: la lunghezza eccede la proiezione massima', body:R`
   <p>In $|j,m\rangle$ il modulo quadrato del momento angolare vale esattamente $j(j+1)\hbar^{2}$, e la proiezione lungo $z$ vale esattamente $m\hbar$. Entrambi sono autovalori, senza dispersione. Dunque per $m=j$, il valore massimo,</p>
   <p style="margin-left:1.2em">modulo $=\sqrt{j(j+1)}\,\hbar$, &nbsp; proiezione $=j\hbar$, &nbsp; e il primo è <i>sempre più grande</i> del secondo per $j>0$.</p>
   <p>Un vettore classico può essere allineato con l&rsquo;asse: il suo modulo coincide allora con la proiezione. <b>Un momento angolare quantistico non può mai essere allineato con nessun asse</b>, e lo scarto si vede nei numeri: per $j=1$ il modulo è $\sqrt2\simeq1{,}414$ in unità $\hbar$ contro una proiezione massima di $1$; per $j=\tfrac12$ è $\sqrt{3}/2\simeq0{,}866$ contro $0{,}5$ — cioè la proiezione massima è solo il $58\%$ del modulo, il caso più lontano dal classico di tutti.</p>
   <p>Il motivo profondo è lo stesso delle tre componenti incompatibili: se il vettore fosse allineato con $z$, le componenti $x$ e $y$ avrebbero entrambe valore definito zero, e si avrebbe uno stato autostato simultaneo di tutte e tre — possibile solo per $j=0$. <i>La disuguaglianza $j<\sqrt{j(j+1)}$ è il principio di indeterminazione per il momento angolare, scritto come un confronto fra due numeri.</i></p>`},
   {label:'Secondo pezzo, statistico: le componenti trasverse hanno media nulla e dispersione no', body:R`
   <p>Le medie sono nulle, come si è visto: $\langle M_1\rangle=\langle M_2\rangle=0$ in $|j,m\rangle$, perché le matrici non hanno elementi diagonali. I quadrati non lo sono. Si calcola con un passaggio di simmetria, non con le matrici: siccome $M_1^{2}+M_2^{2}=M^{2}-M_3^{2}$, prendendone il valore di aspettazione si ottiene $\langle M_1^{2}\rangle+\langle M_2^{2}\rangle=\big(j(j+1)-m^{2}\big)\hbar^{2}$; e siccome una rotazione di $\pi/2$ attorno a $z$ scambia $M_1$ con $M_2$ lasciando invariato lo stato a meno di una fase, i due addendi sono uguali. Dunque</p>
   $$\langle M_1^{2}\rangle=\langle M_2^{2}\rangle=\frac{\hbar^{2}}{2}\big(j(j+1)-m^{2}\big)$$
   <p>e le dispersioni, essendo le medie nulle, sono $\Delta M_1=\Delta M_2=\hbar\sqrt{(j(j+1)-m^{2})/2}$.</p>
   <p><b>Questa è la parte della figura che è giusta in senso statistico</b>: la punta del vettore non sta in un punto del cerchio, ma la distribuzione delle sue componenti trasverse è centrata in zero e larga quanto il raggio del cerchio — in media quadratica. Il «cerchio» del cono non è una traiettoria: è la deviazione standard di due variabili a media nulla.</p>`},
   {label:'Terzo pezzo, falso: la precessione', body:R`
   <p>La figura suggerisce un <i>movimento</i>: il vettore che gira attorno all&rsquo;asse con una qualche frequenza. In uno stato $|j,m\rangle$ di un sistema isolato questo è falso, e per il motivo più semplice possibile: $|j,m\rangle$ è autostato di $M^{2}$ e di $M_3$, e se è anche autostato dell&rsquo;hamiltoniana — cosa che accade quando $\Omega$ contiene $H$, cioè nel caso tipico — è uno <i>stato stazionario</i>. In uno stato stazionario nessun valore medio dipende dal tempo. <b>Non c&rsquo;è precessione: c&rsquo;è indeterminazione.</b></p>
   <p>La precessione esiste, ma in un&rsquo;altra situazione: quando lo stato <i>non</i> è autostato di $M_3$. Se si prepara uno stato con $\langle\mathbf M\rangle$ non parallelo a $z$ e si accende un campo che rende $H$ proporzionale a $M_3$, allora $\langle M_1\rangle$ e $\langle M_2\rangle$ oscillano e il valor medio del vettore gira davvero. Nella tappa 08 si vedrà che quel giro <i>è</i> l&rsquo;applicazione di un operatore di rotazione, con l&rsquo;angolo che cresce linearmente nel tempo. <i>La differenza fra i due casi è la differenza fra «lo stato è un autostato» e «lo stato è una sovrapposizione», e confonderli è il più comune degli errori su questo argomento.</i></p>`}
  ]},
  {t:'plot', title:'Il cono, per j uguale 2: cinque cerchi su una sfera di raggio radice di sei',
   intro:R`<p>La sfera ha raggio $\sqrt{j(j+1)}=\sqrt6\simeq2{,}449$, che è il modulo del momento angolare in unità $\hbar$. I cinque cerchi stanno alle quote $m=2,1,0,-1,-2$ e hanno raggio $\sqrt{6-m^{2}}$, cioè $\sqrt2$, $\sqrt5$, $\sqrt6$, $\sqrt5$, $\sqrt2$. La retta verticale è l&rsquo;asse $z$; il segmento più alto segna la quota $\sqrt6$, dove un vettore classico allineato arriverebbe e nessuno stato quantistico arriva.</p>`,
   plots:[{kind:'curve3d', height:400, yaw:0.75, pitch:0.35,
     curves:[
      {x:'Math.sqrt(2)*Math.cos(t)', y:'Math.sqrt(2)*Math.sin(t)', z:'2', tr:[0,6.2832], col:'#ff6b8a', label:'m uguale 2'},
      {x:'Math.sqrt(5)*Math.cos(t)', y:'Math.sqrt(5)*Math.sin(t)', z:'1', tr:[0,6.2832], col:'#ffc24a', label:'m uguale 1'},
      {x:'Math.sqrt(6)*Math.cos(t)', y:'Math.sqrt(6)*Math.sin(t)', z:'0', tr:[0,6.2832], col:'#6bdc9b', label:'m uguale 0'},
      {x:'Math.sqrt(5)*Math.cos(t)', y:'Math.sqrt(5)*Math.sin(t)', z:'-1', tr:[0,6.2832], col:'#ffc24a', label:'m uguale meno 1'},
      {x:'Math.sqrt(2)*Math.cos(t)', y:'Math.sqrt(2)*Math.sin(t)', z:'-2', tr:[0,6.2832], col:'#ff6b8a', label:'m uguale meno 2'},
      {x:'0', y:'0', z:'3*t', tr:[-1,1], col:'#8aa0b8', label:'asse z'},
      {x:'0.25*Math.cos(t)', y:'0.25*Math.sin(t)', z:'2.449', tr:[0,6.2832], col:'#ffffff', label:'quota radice di sei'},
      {x:'Math.sqrt(2)*t', y:'0', z:'2*t', tr:[0,1], col:'#ff6b8a', label:'un vettore con m uguale 2'}]}],
   leggi:R`<p><b>Che cosa guardare.</b> Il cerchio rosa più alto sta a quota $2$, non a quota $\sqrt6\simeq2{,}449$: fra lui e il cerchietto bianco c&rsquo;è un vuoto di $0{,}449$ in unità $\hbar$, e quel vuoto è incolmabile — nessuno stato lo raggiunge. Il segmento rosa obliquo è un vettore di lunghezza $\sqrt6$ con proiezione $2$: è inclinato di $\arccos(2/\sqrt6)\simeq35{,}3$ gradi rispetto all&rsquo;asse, e <b>quell&rsquo;angolo è il minimo possibile per $j=2$</b>.</p>
   <p><b>Che cosa impararne, e che cosa non credere.</b> I cerchi non sono traiettorie: la punta del vettore non li percorre. Sono il luogo dei punti compatibili con i due valori esatti — modulo e proiezione — e la distribuzione delle componenti trasverse è centrata nell&rsquo;asse con dispersione pari a $\sqrt{(6-m^{2})/2}$, cioè <i>la metà in media quadratica</i> del raggio del cerchio corrispondente. Si noti che il cerchio con $m=0$ è il più grande: lo stato con proiezione nulla è quello in cui le componenti trasverse sono <i>meno</i> determinate, non più.</p>
   <p><b>E il limite classico.</b> Si immagini la stessa figura per $j=100$: il cerchio più alto starebbe a quota $100$ su una sfera di raggio $\sqrt{10100}\simeq100{,}5$, e l&rsquo;angolo minimo sarebbe $\arccos(100/100{,}5)\simeq5{,}7$ gradi. <i>Il vettore si avvicina all&rsquo;asse quanto si vuole, ma non lo raggiunge mai</i>, e il rapporto fra i cerchi consecutivi diventa trascurabile: è così che un momento angolare macroscopico sembra puntare dove vuole.</p>`},
  {t:'prosa', title:'La saturazione: dove l’indeterminazione diventa un’uguaglianza', tag:'costruzione', html:R`
  <p>Vale chiudere la tappa con un conto che lega i numeri appena ottenuti alla relazione di indeterminazione, perché è un caso in cui la disuguaglianza si satura e si vede esattamente dove.</p>
  <p>La relazione per due osservabili non commutanti, applicata a $M_1$ e $M_2$ con $[M_1,M_2]=i\hbar M_3$, dà $\Delta M_1\,\Delta M_2\ge\tfrac{\hbar}{2}|\langle M_3\rangle|$, cioè nello stato $|j,m\rangle$</p>
  $$\Delta M_1\,\Delta M_2\ \ge\ \frac{\hbar^{2}|m|}{2}.$$
  <p>Dalle dispersioni calcolate sopra il membro di sinistra vale $\tfrac{\hbar^{2}}{2}\big(j(j+1)-m^{2}\big)$, quindi la disuguaglianza equivale a $j(j+1)-m^{2}\ge m$, che si riscrive</p>
  $$j(j+1)-m^{2}-m=(j-m)(j+m+1)\ \ge\ 0$$
  <p>— ed è la <i>stessa</i> espressione che dava il modulo quadrato della costante di normalizzazione nella tappa 06. <b>Entrambi i fattori sono non negativi sulla catena, e il primo si annulla per $m=j$.</b> Quindi la relazione di indeterminazione fra le due componenti trasverse è saturata esattamente negli stati con proiezione massima, $m=j$, e lì vale $\Delta M_1\Delta M_2=\hbar^{2}j/2$.</p>
  <p>È un risultato che ripaga tre volte. Primo: dice che gli stati $|j,j\rangle$ sono gli stati «più classici» della famiglia, nel senso preciso di stati di minima indeterminazione per le componenti trasverse — e giustifica l&rsquo;intuizione che siano quelli più vicini a un vettore allineato. Secondo: spiega perché $m=j$ sia il caso in cui la figura del cono inganna meno. Terzo, e più importante per il mestiere: <i>la stessa fattorizzazione $(j-m)(j+m+1)$ compare in tre posti diversi di questo movimento</i> — nella condizione di terminazione della catena, nella normalizzazione di $M_+$ e nella saturazione dell&rsquo;indeterminazione — e non per coincidenza, perché tutte e tre sono la norma quadrata di $M_+|j,m\rangle$ letta a tre fini diversi.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Qual è, per $j$ dato, l&rsquo;angolo minimo fra il vettore momento angolare e l&rsquo;asse $z$? E che cosa succede per $j\to\infty$ e per $j=\tfrac12$?`,
    a:R`Il coseno dell&rsquo;angolo è proiezione diviso modulo, massimo per $m=j$: $\cos\theta_{\min}=j/\sqrt{j(j+1)}=\sqrt{j/(j+1)}$. Per $j\to\infty$ tende a $1$, quindi $\theta_{\min}\to0$: nel limite classico l&rsquo;allineamento diventa possibile. Per $j=\tfrac12$ si ha $\cos\theta_{\min}=\sqrt{1/3}\simeq0{,}577$, cioè $\theta_{\min}\simeq54{,}7$ gradi — <b>uno spin un mezzo «su» punta a più di cinquantaquattro gradi dall&rsquo;asse rispetto al quale è «su»</b>, che è il modo più rapido di convincersi che la freccia disegnata sulla lavagna è una menzogna utile. <i>Quell&rsquo;angolo, $\arccos(1/\sqrt3)$, è lo stesso dell&rsquo;angolo fra la diagonale di un cubo e uno dei suoi lati</i>, e non è un caso: viene dallo stesso rapporto fra una componente e la radice della somma di tre quadrati uguali.`},
   {q:R`Nello stato $|j,0\rangle$ si ha $\langle M_3\rangle=0$ e $\langle M_1\rangle=\langle M_2\rangle=0$: tutte e tre le medie sono nulle. Allora il momento angolare è zero?`,
    a:R`No, e la distinzione è esattamente quella fra media e dispersione. $\langle\mathbf M\rangle=0$ non significa $\mathbf M=0$: il modulo quadrato <i>medio</i> vale $j(j+1)\hbar^{2}$, che è lo stesso valore esatto che ha in ogni altro stato della famiglia. Le tre dispersioni valgono $\Delta M_3=0$ e $\Delta M_1=\Delta M_2=\hbar\sqrt{j(j+1)/2}$, quindi la somma dei quadrati delle dispersioni torna. <b>Lo stato $|j,0\rangle$ è quello in cui il momento angolare è «massimamente trasverso»</b>, non quello in cui è piccolo. <i>Il solo stato con momento angolare nullo è $j=0$</i>, e là anche il modulo quadrato esatto è zero — ed è, come Landau annota, l&rsquo;unico stato a simmetria sferica.`},
   {q:R`Si è usata una rotazione di $\pi/2$ attorno a $z$ per concludere che $\langle M_1^{2}\rangle=\langle M_2^{2}\rangle$. Si giustifichi il passaggio senza invocare la figura.`,
    a:R`L&rsquo;operatore $U=e^{-i(\pi/2)M_3/\hbar}$ manda $M_1$ in $M_2$ e $M_2$ in $-M_1$, per coniugazione: è la stessa trasformazione che una rotazione di un quarto di giro opera su un vettore. Ma $|j,m\rangle$ è autostato di $M_3$, quindi $U|j,m\rangle=e^{-i\pi m/2}|j,m\rangle$ — <b>cambia solo per una fase</b>, e una fase non altera nessun valore di aspettazione. Allora $\langle M_1^{2}\rangle=\langle U^{\dagger}M_1^{2}U\rangle=\langle M_2^{2}\rangle$. <i>Il contenuto del passaggio è che lo stato è invariante sotto il sottogruppo che scambia le due componenti trasverse</i>, e questo è un argomento di simmetria rigoroso — lo stesso che Landau usa per dire che gli elementi di matrice di uno scalare non dipendono da $m$. Alternativa senza simmetria: calcolare le due medie con le matrici della tappa 06 e constatare che coincidono.`}
  ]}
]},

/* ---------------- 08 · LE ROTAZIONI FINITE ---------------- */
{ num:'08', title:'Le rotazioni finite: angoli di Euler, matrici D, e i due casi in cui la serie si somma a mano', meta:'tre parametri · il collasso al riferimento fisso · attive e passive, con gli errori dei libri di riferimento · d per j un mezzo e per j uno · il periodo quattro pi greco',
  blocchi:[
  {t:'prosa', title:'Perché servono le rotazioni finite, se il generatore basta', tag:'architettura', html:R`
  <p>Tutto quello che si è fatto finora usa le rotazioni infinitesime. Per lo spettro basta: lo spettro è una proprietà dell&rsquo;algebra. Ma per <i>calcolare</i> servono gli elementi finiti, e servono in tre situazioni concrete che un esame mette una accanto all&rsquo;altra: quando si misura il momento angolare lungo un asse e poi lungo un altro (e bisogna sapere con quale probabilità si ottiene ciascun valore nella seconda misura); quando un&rsquo;hamiltoniana è proporzionale a una componente del momento angolare, e l&rsquo;evoluzione temporale <i>è</i> una rotazione che cresce linearmente nel tempo; e quando si cambia base da autostati di $J_z$ a autostati di $\hat n\cdot\mathbf J$.</p>
  <p>Tutte e tre si risolvono con un solo oggetto: la matrice dell&rsquo;operatore di rotazione nella base degli autostati del momento angolare. Si chiama matrice di Wigner, e questa tappa la costruisce — per intero nei due casi in cui si può fare a mano, e con la struttura generale negli altri.</p>
  <p>In questa tappa, come in Ballentine, si pone $\hbar=1$: tutti i momenti angolari sono numeri puri.</p>`},
  {t:'reveal', title:'Gli angoli di Euler, e il passaggio che collassa tre riferimenti in uno', tag:'costruzione', steps:[
   {label:'La parametrizzazione, nei tre passi di Ballentine', body:R`
   <p>Un asse e un angolo sono tre parametri, ma per il calcolo conviene una parametrizzazione diversa. Partendo dagli assi fissi $Oxyz$ si produce un nuovo sistema $Ox'y'z'$ in tre passi, che Ballentine elenca così:</p>
   <p style="margin-left:1.2em">(i) si ruota di $\alpha$ attorno a $Oz$, portando $Oy$ in $Ou$;<br>
   (ii) si ruota di $\beta$ attorno a $Ou$, portando $Oz$ in $Oz'$;<br>
   (iii) si ruota di $\gamma$ attorno a $Oz'$, portando $Ou$ in $Oy'$.</p>
   <p>Gli operatori unitari corrispondenti sono $R_z(\alpha)$, $R_u(\beta)$, $R_{z'}(\gamma)$, e la rotazione netta è il loro prodotto nell&rsquo;ordine in cui si applicano:</p>
   $$R(\alpha,\beta,\gamma)=R_{z'}(\gamma)\,R_u(\beta)\,R_z(\alpha)=e^{-i\gamma J_{z'}}e^{-i\beta J_u}e^{-i\alpha J_z}.$$
   <p>Ballentine dichiara subito il difetto di questa scrittura, e il difetto è il punto della sezione: &laquo;<i>this expression for the rotation operator is inconvenient because each of the three rotations is performed about an axis belonging to a different coordinate system</i>&raquo;. $J_u$ e $J_{z'}$ non sono operatori noti: sono le componenti del momento angolare lungo assi che dipendono dai primi due angoli.</p>`},
   {label:'Il collasso, e la cancellazione che lo rende possibile', body:R`
   <p>Il rimedio è riportare tutto al riferimento fisso con la formula di coniugazione: siccome $Ou$ si ottiene da $Oy$ con la rotazione (i), la componente lungo $Ou$ si ottiene da quella lungo $Oy$ con la stessa coniugazione,</p>
   $$J_u=R_z(\alpha)\,J_y\,R_z(-\alpha)\quad\Longrightarrow\quad R_u(\beta)=R_z(\alpha)\,R_y(\beta)\,R_z(-\alpha)$$
   <p>— la seconda segue dalla prima perché l&rsquo;esponenziale di un operatore coniugato è il coniugato dell&rsquo;esponenziale. Analogamente, $Oz'$ si ottiene da $Oz$ con le rotazioni (i) e (ii), quindi $R_{z'}(\gamma)=R_u(\beta)R_z(\alpha)\,R_z(\gamma)\,R_z(-\alpha)R_u(-\beta)$.</p>
   <p>Sostituendo nelle tre e usando che le rotazioni attorno allo stesso asse commutano, &laquo;<i>considerable cancellation becomes possible</i>&raquo; — Ballentine non la mostra, e vale farla: nel prodotto $R_{z'}(\gamma)R_u(\beta)R_z(\alpha)$ il fattore $R_u(-\beta)$ alla fine di $R_{z'}$ annulla il $R_u(\beta)$ che segue, e il $R_z(-\alpha)$ annulla il $R_z(\alpha)$ dentro; di $R_z(\alpha)$ e $R_z(\gamma)$ resta il prodotto, che commuta. Il risultato è pulito:</p>
   $$R(\alpha,\beta,\gamma)=R_z(\alpha)\,R_y(\beta)\,R_z(\gamma)=e^{-i\alpha J_z}\,e^{-i\beta J_y}\,e^{-i\gamma J_z}.$$
   <p><b>Tutti gli operatori sono ora espressi nel riferimento fisso originario</b>, e con soli $J_y$ e $J_z$, di cui si conoscono le matrici. Si noti il prezzo: l&rsquo;ordine dei tre angoli nel prodotto si è <i>rovesciato</i> rispetto all&rsquo;ordine in cui si eseguono le rotazioni. È la sorgente di metà degli errori di segno su questo argomento.</p>`},
   {label:'Un controllo che conviene fare: la coniugazione è giusta?', body:R`
   <p>La formula $R_u(\beta)=R_z(\alpha)R_y(\beta)R_z(-\alpha)$ si verifica senza operatori, sulle matrici $3\times3$ di $SO(3)$ della tappa 01, ed è un controllo di due righe che evita di portare avanti un segno sbagliato. Il modo più rapido: l&rsquo;asse di una rotazione è il suo autovettore con autovalore $1$, e l&rsquo;asse di $R_u$ deve essere $\hat u=R_z(\alpha)\hat e_y$. Dunque si deve avere</p>
   $$R_z(\alpha)R_y(\beta)R_z(-\alpha)\,\big(R_z(\alpha)\hat e_y\big)=R_z(\alpha)\hat e_y$$
   <p>e il conto è immediato: il $R_z(-\alpha)$ e il $R_z(\alpha)$ si cancellano, resta $R_z(\alpha)R_y(\beta)\hat e_y=R_z(\alpha)\hat e_y$ perché $\hat e_y$ è l&rsquo;asse di $R_y$. <b>Il controllo passa, e se si fosse scritto $R_z(-\alpha)R_y(\beta)R_z(\alpha)$ non passerebbe</b>: l&rsquo;asse risulterebbe $R_z(-\alpha)\hat e_y$, cioè ruotato nel verso sbagliato.</p>`}
  ]},
  {t:'prosa', title:'Attive e passive, e la nota di Ballentine che vale una pagina', tag:'errore', html:R`
  <p>C&rsquo;è un&rsquo;ambiguità che si annida sotto ogni rotazione e che Ballentine affronta di petto, dedicandole una sezione: una trasformazione si può pensare in due modi, &laquo;<i>the active point of view, in which the object is rotated with respect to a fixed coordinate system, or the passive point of view, in which the object is kept fixed and the coordinate system is rotated</i>&raquo;. Dichiara di attenersi al primo, ma aggiunge che entrambi sono validi e che conviene conoscerne la relazione.</p>
  <p>In due dimensioni le due matrici sono trasposte l&rsquo;una dell&rsquo;altra: la rotazione attiva di $\alpha$ manda $(x,y)$ in $(x\cos\alpha-y\sin\alpha,\,x\sin\alpha+y\cos\alpha)$, quella passiva assegna allo stesso punto le nuove coordinate $(x\cos\alpha+y\sin\alpha,\,-x\sin\alpha+y\cos\alpha)$. In generale</p>
  $$R^{(p)}(\alpha,\beta,\gamma)=\big[R^{(a)}(\alpha,\beta,\gamma)\big]^{-1}=R^{(a)}(-\gamma,-\beta,-\alpha)$$
  <p>e Ballentine commenta che la relazione &laquo;<i>expresses the intuitive geometrical fact that one may achieve equivalent results by rotating the coordinate system in a positive sense with respect to the object, or by rotating the object in a negative sense with respect to the coordinate system</i>&raquo;.</p>
  <p>Due cose vanno portate via da questa sezione. La prima è la regola operativa: <b>in entrambi i punti di vista la funzione ruotata si ottiene con la matrice <i>inversa</i> nell&rsquo;argomento</b> — $\Psi'(\mathbf x)=\Psi([R^{(a)}]^{-1}\mathbf x)$ nel caso attivo, $\Psi''(\mathbf x)=\Psi([R^{(p)}]^{-1}\mathbf x)$ nel passivo — e la differenza fra i due casi sta tutta in quale delle due matrici si usa. La seconda è l&rsquo;avvertenza che Ballentine mette fra doppie parentesi quadre, e che è una delle poche volte in cui un manuale dichiara che altri manuali sbagliano: &laquo;<i>this discussion of active and passive rotations is based on an article by M. Bouten (1969), in which it is pointed out that the standard reference books by Edmonds (1957) and Rose (1960) contain errors in treating these rotations</i>&raquo;. Edmonds e Rose sono <i>le</i> monografie classiche sul momento angolare: se il punto può essere sbagliato lì, conviene non darlo per ovvio.</p>`},
  {t:'reveal', title:'Le matrici di Wigner, e i due casi che si sommano a mano', tag:'strumento', steps:[
   {label:'La struttura generale, e perché due dei tre angoli sono gratis', body:R`
   <p>Si prende la matrice dell&rsquo;operatore di rotazione nella base $|j,m\rangle$. Siccome $R$ commuta con $J^{2}$, è diagonale in $j$ — per lo stesso argomento della tappa 06 — e si definisce</p>
   $$\langle j',m'|R(\alpha,\beta,\gamma)|j,m\rangle=\delta_{j'j}\,D^{(j)}_{m'm}(\alpha,\beta,\gamma).$$
   <p>Ora il guadagno della forma collassata: nei tre fattori $e^{-i\alpha J_z}e^{-i\beta J_y}e^{-i\gamma J_z}$ il primo e il terzo agiscono su autostati di $J_z$, quindi danno solo fasi. Il risultato è</p>
   $$D^{(j)}_{m'm}(\alpha,\beta,\gamma)=e^{-i(\alpha m'+\gamma m)}\,d^{(j)}_{m'm}(\beta),\qquad d^{(j)}_{m'm}(\beta)=\langle j,m'|e^{-i\beta J_y}|j,m\rangle.$$
   <p><b>Due dei tre angoli non richiedono nessun conto</b>: entrano come fasi, e le fasi non contano nei moduli quadrati. Tutto il contenuto sta nella matrice $d^{(j)}(\beta)$, cioè nell&rsquo;esponenziale di $J_y$ — ed è per questo che la tappa 06 si è preoccupata di dare le matrici di $J_y$ e le loro identità polinomiali.</p>
   <p>Conseguenza pratica, e si usa in ogni esercizio: <b>la probabilità di trovare $m'$ misurando $J_z$ su uno stato $|j,m\rangle$ ruotato di $(\alpha,\beta,\gamma)$ dipende solo da $\beta$</b>, perché vale $|d^{(j)}_{m'm}(\beta)|^{2}$.</p>`},
   {label:'j uguale un mezzo: il quadrato di sigma y vale uno, e la serie si chiude', body:R`
   <p>Per $j=\tfrac12$ si sostituisce $J_y$ con $\tfrac12\sigma_y$. Siccome $(\sigma_y)^{2}=\mathbb 1$, nella serie esponenziale tutti i termini pari sono multipli dell&rsquo;identità e tutti i dispari multipli di $\sigma_y$: le due sottoserie sono il coseno e il seno. Dunque</p>
   $$e^{-i\beta J_y}=\exp\!\Big(\frac{-i\beta\sigma_y}{2}\Big)=\mathbb 1\cos\frac{\beta}{2}-i\sigma_y\sin\frac{\beta}{2}$$
   <p>e sostituendo la matrice di Pauli si ottiene</p>
   $$d^{(1/2)}(\beta)=\begin{pmatrix}\cos(\beta/2)&-\sin(\beta/2)\\ \sin(\beta/2)&\cos(\beta/2)\end{pmatrix}$$
   <p>con le righe e le colonne ordinate per $m=+\tfrac12,-\tfrac12$. È la matrice di una rotazione piana di <i>mezzo</i> angolo, e la cosa va guardata bene: Ballentine la annota subito, &laquo;<i>notice that this matrix is periodic in $\beta$ with period $4\pi$, but it changes sign when $2\pi$ is added to $\beta$</i>&raquo;, e aggiunge che il doppio valore &laquo;<i>is a characteristic of the full rotation matrix (7.65) whenever $j$ is a half odd-integer</i>&raquo;, mentre per $j$ intero la matrice è a un solo valore.</p>
   <p>Il controllo è immediato: $\cos\big((\beta+2\pi)/2\big)=\cos(\beta/2+\pi)=-\cos(\beta/2)$, e lo stesso per il seno; aggiungendo invece $4\pi$ si torna identici. <b>Una rotazione di $2\pi$ su uno spin un mezzo non è l&rsquo;identità: è meno l&rsquo;identità</b>, e la tappa 09 è interamente dedicata a che cosa questo significhi.</p>`},
   {label:'j uguale uno: il cubo di J y vale J y, e la serie si chiude di nuovo', body:R`
   <p>Per $j=1$ la matrice di $J_y$ soddisfa $(J_y)^{3}=J_y$ (in unità $\hbar=1$). Nella serie esponenziale, allora, le potenze si riducono a tre soli oggetti — $\mathbb 1$, $J_y$ e $J_y^{2}$ — e raccogliendo si ottiene</p>
   $$e^{-i\beta J_y}=\mathbb 1-J_y^{2}\,(1-\cos\beta)-i\,J_y\sin\beta$$
   <p>che è il risultato che Ballentine riporta, ottenuto &laquo;<i>by a calculation similar to that leading to (7.67)</i>&raquo;. Sostituendo le matrici:</p>
   $$d^{(1)}(\beta)=\begin{pmatrix}\tfrac12(1+\cos\beta)&-\tfrac{1}{\sqrt2}\sin\beta&\tfrac12(1-\cos\beta)\\[2pt] \tfrac{1}{\sqrt2}\sin\beta&\cos\beta&-\tfrac{1}{\sqrt2}\sin\beta\\[2pt] \tfrac12(1-\cos\beta)&\tfrac{1}{\sqrt2}\sin\beta&\tfrac12(1+\cos\beta)\end{pmatrix}$$
   <p>con righe e colonne ordinate per $m=1,0,-1$. Tre controlli che vale fare, e sono tutti e tre dei controlli d&rsquo;esame. Primo: a $\beta=0$ la matrice è l&rsquo;identità. Secondo: a $\beta=2\pi$ torna l&rsquo;identità, come deve essere per $j$ intero. Terzo: <b>l&rsquo;elemento centrale è $\cos\beta$</b>, cioè $d^{(1)}_{00}(\beta)=\cos\beta$ — e questo collega la matrice $d$ alle armoniche sferiche, come la prossima sezione mostra.</p>
   <p>Per $j=\tfrac32$ e oltre la serie <i>non</i> si chiude a mano: il polinomio minimo ha grado quattro e raccogliere non basta. Ballentine rimanda al caso generale, risolto da Wigner, con una nota su dove trovare la derivazione: &laquo;<i>the matrix element (7.66) was evaluated in the general case by E. P. Wigner. A concise derivation is given in the book by Sakurai (1985)</i>&raquo;.</p>`},
   {label:'La chiusura: le armoniche sferiche sono una colonna delle matrici D', body:R`
   <p>Vale chiudere con un risultato che collega questa tappa a tutto il resto della fisica a simmetria sferica. Le <span class="str" data-str="armoniche-sferiche">armoniche sferiche</span> sono, per definizione, la rappresentazione in coordinate degli autostati $|\ell,m\rangle$ con $\ell$ intero; quindi si trasformano sotto rotazione come quei vettori, cioè con le matrici $D$. Ballentine ne ricava, in mezza pagina di manipolazioni, che</p>
   $$Y_\ell^{m}(\theta,\varphi)=c_\ell\,\big\{D^{(\ell)}_{m,0}(\varphi,\theta,0)\big\}^{*},\qquad c_\ell=\Big(\frac{2\ell+1}{4\pi}\Big)^{1/2}$$
   <p>cioè <b>un&rsquo;armonica sferica è, a meno della normalizzazione, un elemento della colonna $m=0$ della matrice di rotazione</b>. Due controlli immediati. Per $\ell=0$: $D^{(0)}=1$ e $c_0=1/\sqrt{4\pi}$, quindi $Y_0^{0}=1/\sqrt{4\pi}$, costante, come deve essere. Per $\ell=1$ e $m=0$: $d^{(1)}_{00}(\theta)=\cos\theta$ e $c_1=\sqrt{3/4\pi}$, quindi $Y_1^{0}=\sqrt{3/4\pi}\,\cos\theta$, che è la formula nota.</p>
   <p>La strada con cui Ballentine arriva lì merita una riga, perché è il rovescio del modo usuale. Non risolve l&rsquo;equazione differenziale: parte da come le $Y$ <i>devono</i> trasformarsi, nota che per $\theta=0$ la continuità impone $Y_\ell^{m}(0,0)=c_\ell\delta_{m,0}$ — perché sull&rsquo;asse polare l&rsquo;azimut non è definito, e una funzione continua non può dipendere da un angolo che non esiste — e da quelle due condizioni le $Y$ escono univocamente a meno della normalizzazione. <b>Le armoniche sferiche sono determinate dalla simmetria, non dall&rsquo;equazione</b>; l&rsquo;equazione serve a trovarle, non a definirle.</p>`}
  ]},
  {t:'plot', title:'Il periodo quattro pi greco, e le probabilità di una misura dopo una rotazione',
   intro:R`<p>A sinistra i due elementi di $d^{(1/2)}(\beta)$, cioè $\cos(\beta/2)$ e $\sin(\beta/2)$, su un intervallo di $4\pi$: la linea verticale ideale a $\beta=2\pi$ è dove entrambi cambiano segno. A destra le tre probabilità $|d^{(1)}_{m',1}(\beta)|^{2}$ di misurare $m'=1,0,-1$ su uno stato $|1,1\rangle$ ruotato di $\beta$ attorno a $y$, e la loro somma.</p>`,
   plots:[{kind:'func2d', xr:[0,12.57], yr:[-1.2,1.2], height:260, ticks:true,
     title:'gli elementi di d per j un mezzo, su quattro pi greco',
     curves:[{f:'Math.cos(x/2)', col:'#5aa9ff', width:2.4, label:'coseno di beta mezzi'},
             {f:'Math.sin(x/2)', col:'#ff6b8a', width:2.4, label:'seno di beta mezzi'},
             {f:'Math.cos(x)', col:'#6bdc9b', width:1.4, dash:true, label:'coseno di beta, per confronto'}],
     xlabel:'beta', ylabel:'elementi di d'},
    {kind:'func2d', xr:[0,6.2832], yr:[-0.1,1.15], height:260, ticks:true,
     title:'probabilita di m primo dopo una rotazione di beta, partendo da m uguale 1',
     curves:[{f:'Math.pow((1+Math.cos(x))/2,2)', col:'#5aa9ff', width:2.4, label:'m primo uguale 1'},
             {f:'Math.sin(x)*Math.sin(x)/2', col:'#ffc24a', width:2.4, label:'m primo uguale 0'},
             {f:'Math.pow((1-Math.cos(x))/2,2)', col:'#ff6b8a', width:2.4, label:'m primo uguale meno 1'},
             {f:'1', col:'#8aa0b8', width:1.4, dash:true, label:'somma delle tre'}],
     xlabel:'beta', ylabel:'probabilita'}],
   leggi:R`<p><b>Che cosa guardare, a sinistra.</b> Le due curve blu e rosa hanno periodo $4\pi$, non $2\pi$: a $\beta=2\pi$ valgono $-1$ e $0$, cioè la matrice è diventata $-\mathbb 1$, e solo a $\beta=4\pi$ tornano al punto di partenza. La curva verde tratteggiata, $\cos\beta$, è l&rsquo;elemento centrale di $d^{(1)}$ e ha periodo $2\pi$: <b>nella stessa figura si vedono i due comportamenti, e la differenza è se $j$ è intero o semidispari</b>.</p>
   <p><b>Che cosa guardare, a destra.</b> A $\beta=0$ la probabilità è tutta su $m'=1$; a $\beta=\pi$ è tutta su $m'=-1$ — ruotare di mezzo giro attorno a $y$ ribalta lo spin, come la geometria vuole; a $\beta=\pi/2$ le tre probabilità sono $\tfrac14,\tfrac12,\tfrac14$, cioè la distribuzione binomiale di due monete. La somma è costantemente $1$, che è il controllo di consistenza da fare sempre: $\tfrac14(1+\cos\beta)^{2}+\tfrac12\sin^{2}\beta+\tfrac14(1-\cos\beta)^{2}=1$ identicamente.</p>
