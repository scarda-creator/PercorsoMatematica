<script>
"use strict";
const R = String.raw;

function typeset(el){
  if(el && window.renderMathInElement){
    try{ renderMathInElement(el,{delimiters:[
      {left:'$$',right:'$$',display:true},
      {left:'$',right:'$',display:false}
    ],throwOnError:false}); }catch(e){}
  }
}
function elFromHTML(html){ var d=document.createElement('div'); d.innerHTML=html; return d; }

/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un
   rimando scritto nella prosa:

       <span class="str" data-str="serie-geometrica">la serie geometrica</span>

   Le schede citate da questo nucleo sono cucite qui sotto dal montaggio
   (assembla-nucleo.js): la pagina resta autosufficiente — niente fetch,
   niente sottocartelle da pubblicare — e un rimando a una scheda che non
   esiste FERMA la costruzione invece di arrivare in pagina rotto.
   Apertura: lo stesso gesto del collaudo (si clicca, il pannello compare,
   si typeset una volta sola), portato dentro la frase.
   =================================================================== */
var CORSO = 'metodi-e-modelli';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["residuo"] = {"nome":"Residuo","riga":"Il coefficiente $a_{-1}$ dello sviluppo di Laurent attorno a una singolarità isolata, cioè l'unico termine che sopravvive all'integrazione su un cerchietto attorno al punto.","serve":"È il numero che trasforma un integrale in una somma: tutto il resto della serie integra a zero su un giro chiuso, e resta $2\\pi i$ per la somma dei residui. Tre formule coprono quasi tutto — polo semplice $\\lim(z-z_0)f$; quoziente con polo semplice $P(z_0)/Q'(z_0)$, la più rapida perché non chiede di fattorizzare; polo di ordine $m$ con la derivata $(m-1)$-esima — e per l'ordine alto o per una singolarità essenziale conviene invece dividere le serie e leggere il coefficiente di $(z-z_0)^{-1}$.","esempio":"Con $f=\\dfrac{z}{z^{2}+1}$ in $z_0=i$ la formula del quoziente dà $\\dfrac{P(i)}{Q'(i)}=\\dfrac{i}{2i}=\\tfrac12$, senza fattorizzare nulla. Per $\\dfrac{e^{z}}{(z-2)^{3}}$ in $2$ il polo è di ordine $3$ e la formula con la derivata seconda dà $\\tfrac{e^{2}}{2}$. Per $\\dfrac{\\cos z-1}{z^{5}}$ in $0$ le formule sono peggio dello sviluppo: da $\\cos z-1=-\\tfrac{z^{2}}{2}+\\tfrac{z^{4}}{24}-\\cdots$ il coefficiente di $z^{-1}$ si legge direttamente, e vale $\\tfrac1{24}$.","pieno":{"file":"13-residui.html","tappa":"01","come":"le tre formule, il criterio di scelta e i casi svolti, nel nucleo sui residui"},"controllo":[{"tipo":"uguale","sinistra":"I/(2*I)","vale":"1/2","dove":"esempio","appare":"\\tfrac12"},{"tipo":"uguale","sinistra":"exp(2)/factorial(2)","vale":"exp(2)/2","dove":"esempio","appare":"\\tfrac{e^{2}}{2}"},{"tipo":"uguale","sinistra":"series(cos(z)-1, z, 0, 5).removeO()","vale":"-z**2/2 + z**4/24","dove":"esempio","appare":"-\\tfrac{z^{2}}{2}+\\tfrac{z^{4}}{24}"},{"tipo":"uguale","sinistra":"1/factorial(4)","vale":"1/24","dove":"esempio","appare":"\\tfrac1{24}"}]};

function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';
  return h;
}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

id:        me-07 — operatori lineari e teoria spettrale

MOVIMENTO*/

/* ---------------- 00 · PERCHÉ QUESTO NUCLEO ---------------- */
{ num:'00', title:'Perché questo nucleo', meta:'Metodi · voce F.1 del programma · 11 prove su 24 lo toccano · e in quattro scritti la funzione di matrice è un esercizio intero',
  blocchi:[
  {t:'prosa', title:'Dove converge tutto il percorso', tag:'first principles', html:R`
  <p>Nel nucleo 09 la base ortonormale era data (le armoniche di Fourier). Qui si capisce <b>da dove viene una base</b>: non si sceglie, si <b>trova</b> — è la base degli autovettori dell&rsquo;operatore che governa il problema. Fourier funziona sulle EDP a coefficienti costanti perché $e^{ikx}$ sono le autofunzioni di $d^2/dx^2$; cambia l&rsquo;operatore e cambia la base giusta (Legendre, Laguerre, Hermite: tutte autofunzioni di qualche operatore).</p>
  <p>Il teorema che rende questo possibile è il <b>teorema spettrale</b>: un operatore <b>autoaggiunto</b> ha autovalori <b>reali</b> e una base <b>ortonormale</b> di autovettori, e si scrive come somma pesata di <b>proiettori</b>. In meccanica quantistica non è un teorema di servizio: è la struttura stessa della teoria — osservabili = operatori autoaggiunti, valori misurabili = spettro, probabilità = proiezioni.</p>
  <div class="note"><b>Il filo, in una riga.</b> Un operatore diventa una matrice solo dopo che hai scelto una base (tappa 01); cambiando base la matrice cambia e lo <b>spettro no</b> (tappa 04); fra tutte le basi ce n&rsquo;è una in cui l&rsquo;operatore è <b>diagonale</b>, e trovarla è risolvere il problema (tappa 05); una volta lì, <b>qualsiasi funzione</b> dell&rsquo;operatore si calcola numero per numero (tappa 06). Le tappe 08-09 rifanno la stessa storia in dimensione infinita, dove le matrici diventano equazioni differenziali.</div>
  <div class="note warn"><b>Calibrazione d&rsquo;esame, misurata.</b> Delle <b>24 prove</b> leggibili in banca dati, <b>11 toccano questo movimento</b>: gli autovalori compaiono in 16 testi, gli autovettori in 13, i proiettori in 11. (Conto rifatto il 18-09: prima le note del docente e il programma erano contati come prove, e il totale diceva 13 su 26.) In <b>quattro scritti</b> (15/01/2024, 18/06/2024, 23/06/2025, 09/09/2025) un esercizio intero da 6-8 punti è esattamente questo: diagonalizza e calcola $f(A)$. Sono i quattro della palestra, tappa 10, svolti per intero. Il trabocchetto ricorrente è uno solo: <b>proiettori costruiti su autovettori non ortonormali</b> (tappa 05).</div>`}
]},

/* ---------------- 01 · OPERATORI LINEARI E RAPPRESENTAZIONE ---------------- */
{ num:'01', title:'Un operatore non è una matrice: lo diventa', meta:'kernel e immagine · $A|v_i\\rangle=\\sum_j A_{ji}|v_j\\rangle$ · cambio di base $A^\\prime=S^{-1}AS$',
  blocchi:[
  {t:'prosa', title:'La definizione, e le due cose che si guardano subito', tag:'grammatica', html:R`
  <p>Sia $H$ uno spazio di Hilbert finito-dimensionale (nucleo 08: vettori, prodotto scalare, base ortonormale). Un&rsquo;applicazione $A:H\to H'$ è un <b>operatore lineare</b> se
  $$A\bigl(\lambda|v\rangle+\mu|u\rangle\bigr)=\lambda A|v\rangle+\mu A|u\rangle\qquad\forall\,|v\rangle,|u\rangle\in H,\ \lambda,\mu\in\mathbb{C}.$$
  Non è una richiesta tecnica: è la ragione per cui in fisica gli operatori lineari sono ovunque. <b>Rotazioni</b> (nello spazio fisico e non), <b>misure</b> in meccanica quantistica, <b>simmetrie</b> e leggi di conservazione nei sistemi lagrangiani: tutte trasformazioni che rispettano le combinazioni, cioè che commutano con il principio di sovrapposizione.</p>
  <p>Due esempi già incontrati senza chiamarli per nome: il <b>prodotto scalare rispetto al secondo argomento</b>, $\langle w|(\lambda|v\rangle+\mu|u\rangle)=\lambda\langle w|v\rangle+\mu\langle w|u\rangle$ — la linearità è una delle proprietà che lo definiscono; e il <b>prodotto matrice-vettore</b>, $(A\cdot(\lambda v+\mu u))_i=\lambda(A\cdot v)_i+\mu(A\cdot u)_i$. Un controesempio che vale la pena tenere: la <b>norma</b> $|v\rangle\mapsto\sqrt{\langle v|v\rangle}$ <b>non</b> è lineare — $\lVert\lambda v+\mu u\rVert\ne\lambda\lVert v\rVert+\mu\lVert u\rVert$, e basta la disuguaglianza triangolare del nucleo 08 per vederlo. La norma misura, non trasforma.</p>
  <p>Dato un operatore, due sottospazi lo descrivono prima ancora di scriverne la matrice:</p>
  <ul>
  <li>il <b>kernel</b>, $\ker A=\{|v\rangle: A|v\rangle=0\}$ — ciò che l&rsquo;operatore <b>annulla</b>;</li>
  <li>l&rsquo;<b>immagine</b>, $\operatorname{Im}A=\{|u\rangle:\exists|v\rangle,\ |u\rangle=A|v\rangle\}$ — dove i vettori <b>vanno a finire</b>.</li>
  </ul>
  <div class="note">Il kernel è il primo posto dove guardare, e torna due volte in questo nucleo: $\ker(A-\lambda\mathbb{1})\ne\{0\}$ <b>è</b> la definizione di autovalore (tappa 04), e $\ker\mathcal{L}\ne\{0\}$ è la condizione che fa esplodere la funzione di Green (tappa 09, alternativa di Fredholm). Un operatore con kernel non banale non è invertibile: la stessa frase, in dimensione infinita, diventa &laquo;esiste una soluzione dell&rsquo;omogenea&raquo;.</div>`},
  {t:'reveal', title:'Perché in dimensione finita un operatore È una matrice', tag:'costruzione', steps:[
   {label:'Basta sapere cosa fa alla base', body:R`<p>Un operatore lineare è <b>completamente determinato</b> dalla sua azione sugli $n$ vettori di una base $\{|v_1\rangle,\dots,|v_n\rangle\}$: per linearità, se $|u\rangle=\sum_iu_i|v_i\rangle$ allora $A|u\rangle=\sum_iu_i\,A|v_i\rangle$, e non serve altro. Scrivendo ciascun $A|v_i\rangle$ nella base stessa nascono gli $n^2$ numeri che chiamiamo matrice:
   $$A|v_i\rangle=\sum_{j=1}^{n}A_{ji}\,|v_j\rangle.$$</p>
   <div class="note warn"><b>Trabocchetto degli indici, ed è vero.</b> La somma è sull&rsquo;indice di <b>riga</b> $j$ di $A_{ji}$ — il <b>contrario</b> del prodotto riga-per-colonna a cui si è abituati. Il motivo è che qui si sviluppa il vettore trasformato nella base, non si contrae una riga con un vettore colonna. Se si scambia l&rsquo;ordine per abitudine si ottiene la matrice <b>trasposta</b>, e ogni conto successivo (autovettori compresi) esce sbagliato in modo plausibile.</div>`},
   {label:'Le componenti seguono', body:R`<p>Mettendo insieme, $|w\rangle=A|u\rangle=\sum_{i,j}u_iA_{ji}|v_j\rangle=\sum_jw_j|v_j\rangle$, e leggendo i coefficienti di ciascun vettore di base (che sono indipendenti, quindi si eguagliano uno per uno):
   $$w_i=\sum_{j=1}^{n}A_{ij}u_j\quad\Longleftrightarrow\quad w=A\cdot u.$$
   Se la base è <b>ortonormale</b> $\{|e_i\rangle\}$ la matrice si legge con un prodotto scalare, ed è la forma che si usa sempre:
   $$A_{ij}=\langle e_i|A|e_j\rangle.$$
   È la stessa formula con cui il nucleo 08 estraeva le componenti di un vettore, $u_i=\langle e_i|u\rangle$, applicata una volta a sinistra e una a destra.</p>`},
   {label:'Il passaggio che si ripete per tutto il nucleo', body:R`<p>Il ragionamento appena fatto — <b>uguaglio due sviluppi nella stessa base, quindi posso eguagliare coefficiente per coefficiente</b> — ritorna identico nel cambio di base, nella rappresentazione spettrale e nella derivazione di Green. Conviene riconoscerlo una volta: se $\sum_i a_i|v_i\rangle=\sum_i b_i|v_i\rangle$ con $\{|v_i\rangle\}$ indipendenti, allora $a_i=b_i$ per ogni $i$. E se l&rsquo;uguaglianza vale per <b>ogni</b> vettore $|u\rangle$ di partenza, allora vale anche fra le matrici, non solo fra i numeri.</p>`}
  ]},
  {t:'reveal', title:'Cambio di base: cosa cambia e cosa no', tag:'derivazione', steps:[
   {label:'La matrice di cambio di base', body:R`<p>Sia $\{|v'_i\rangle\}$ una seconda base dello stesso spazio, scritta nella prima:
   $$|v'_i\rangle=\sum_{j=1}^{n}S_{ji}\,|v_j\rangle.$$
   Di nuovo la somma è sull&rsquo;indice di riga: <b>le componenti del nuovo $i$-esimo vettore di base stanno nella colonna $i$ di $S$</b>, non nella riga. È la regola pratica che fa scrivere $S$ senza pensarci: si incolonnano i vettori nuovi.</p>`},
   {label:'Le coordinate vanno al contrario dei vettori', body:R`<p>Un vettore è lo stesso oggetto in entrambe le basi. Imponendolo, $|u\rangle=\sum_iu'_i|v'_i\rangle=\sum_{i,j}u'_iS_{ji}|v_j\rangle=\sum_ju_j|v_j\rangle$, da cui
   $$u=S\cdot u'\qquad\Longrightarrow\qquad u'=S^{-1}\cdot u.$$
   <b>I vettori di base si trasformano con $S$, le coordinate con $S^{-1}$</b>: è la controvarianza, e la ragione è banale una volta vista — se allunghi i righelli, i numeri letti sul righello si accorciano.</p>`},
   {label:'E la matrice dell’operatore', body:R`<p>Stesso passaggio sull&rsquo;azione di $A$ su un $|u\rangle$ generico, scritta nelle due basi:
   $$\sum_{i,j}A_{ij}u_j|v_i\rangle=\sum_{k,n}\Bigl(S\cdot A'\cdot S^{-1}\Bigr)_{nk}u_k|v_n\rangle\ \Longrightarrow\ A=S\cdot A'\cdot S^{-1},$$
   cioè
   $$\boxed{\,A'=S^{-1}\cdot A\cdot S\,}$$
   Questa è la <b>trasformazione di similitudine</b>. Ciò che è invariante sotto di essa è ciò che appartiene all&rsquo;operatore e non alla base: <b>traccia</b>, <b>determinante</b>, <b>polinomio caratteristico</b> — e quindi lo <b>spettro</b>. È il senso dell&rsquo;identità di questo movimento: la matrice è un&rsquo;ombra della scelta di base, lo spettro no.</p>`},
   {label:'Due esempi: uno ortonormale e uno no', body:R`<p><b>Rotazione in $\mathbb{R}^2$.</b> $e'_1=\cos\theta\,e_1+\sin\theta\,e_2$, $e'_2=-\sin\theta\,e_1+\cos\theta\,e_2$, cioè
   $$S=\begin{pmatrix}\cos\theta&-\sin\theta\\ \sin\theta&\cos\theta\end{pmatrix},\qquad S^{-1}=S^{T}=\begin{pmatrix}\cos\theta&\sin\theta\\ -\sin\theta&\cos\theta\end{pmatrix}.$$
   Qui $S^{-1}=S^{T}$ perché la nuova base è <b>ortonormale</b>: è il caso in cui il cambio di base è <b>unitario</b> (tappa 02), e vale sempre quando si passa fra due basi ortonormali.</p>
   <p><b>Schiacciamento.</b> $v'_1=e_1$, $v'_2=\tfrac{1}{\sqrt2}e_1+\tfrac{1}{\sqrt2}e_2$: la nuova base <b>non</b> è ortonormale, e infatti
   $$S=\begin{pmatrix}1&1/\sqrt2\\ 0&1/\sqrt2\end{pmatrix},\qquad S^{-1}=\begin{pmatrix}1&-1\\ 0&\sqrt2\end{pmatrix}\ne S^{T}.$$
   Le nuove coordinate di $u$ sono $u'=S^{-1}u=(u_1-u_2,\ \sqrt2\,u_2)$. <b>Tenere a mente questo caso è ciò che salva dal trabocchetto della tappa 05</b>: quando $S$ non è unitaria, i proiettori spettrali non sono $|v\rangle\langle v|$.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Due matrici rappresentano lo stesso operatore in basi diverse. Quali quantità devono coincidere?`,
    a:R`Tutte quelle invarianti per similitudine: <b>traccia</b>, <b>determinante</b>, <b>polinomio caratteristico</b> e quindi l&rsquo;intero <b>spettro</b> con le molteplicità. Non coincidono invece gli elementi di matrice, né l&rsquo;eventuale simmetria: una matrice simmetrica può diventare non simmetrica in una base non ortonormale. È il motivo per cui &laquo;hermitiano&raquo; è una proprietà dell&rsquo;operatore <b>più</b> del prodotto scalare, non della tabella di numeri.`},
   {q:R`Perché nel prodotto $A_{ij}=\langle e_i|A|e_j\rangle$ serve che la base sia ortonormale?`,
    a:R`Perché quella formula è lo sviluppo $A|e_j\rangle=\sum_iA_{ij}|e_i\rangle$ seguito dalla proiezione su $|e_i\rangle$, e la proiezione restituisce il coefficiente <b>solo</b> se $\langle e_i|e_k\rangle=\delta_{ik}$. In una base non ortonormale il prodotto scalare con $|e_i\rangle$ mescola i coefficienti degli altri vettori, e per estrarre la componente serve la <b>base duale</b> — la stessa che in tappa 05 dà i proiettori obliqui.`}
  ]}
]},

/* ---------------- 02 · AGGIUNTO, HERMITIANI, UNITARI ---------------- */
{ num:'02', title:'Aggiunto, hermitiano, unitario', meta:'$A^\\dagger_{ij}=A^*_{ji}$ · autovalori reali · $|\\det U|=1$ · autovettori ortogonali',
  blocchi:[
  {t:'prosa', title:'L’aggiunto in astratto e in componenti', tag:'grammatica', html:R`
  <p>Sia $H$ uno spazio di Hilbert (nucleo 08) e $A:H\to H$ lineare. L&rsquo;<b>aggiunto</b> $A^\dagger$ è definito da
  $$\langle Af,g\rangle=\langle f,A^\dagger g\rangle\qquad\forall f,g.$$
  $A$ è <b>autoaggiunto</b> (hermitiano) se $A=A^\dagger$. In dimensione infinita c&rsquo;è una sottigliezza che conta — <b>autoaggiunto</b> richiede anche che i domini coincidano; un operatore solo &laquo;simmetrico&raquo; può non esserlo, e le <b>condizioni al bordo</b> fanno parte della definizione dell&rsquo;operatore, non sono un accessorio (è il movimento me-09b, che comincia proprio da qui).</p>
  <p><b>In componenti l&rsquo;aggiunto è la trasposta coniugata</b>, e la dimostrazione è una riga di indici in base ortonormale: da $\sum_{i,j}u_i^*A_{ij}v_j=\sum_{i,j}(A^\dagger_{ji})^*u_i^*v_j$ per ogni $u,v$ segue
  $$A^\dagger_{ij}=A^*_{ji}.$$
  L&rsquo;aggiunto è, in sostanza, <b>la versione operatoriale del complesso coniugato</b> — e l&rsquo;analogia regge fino in fondo: gli <b>hermitiani</b> stanno agli operatori come i <b>reali</b> stanno ai numeri, gli <b>unitari</b> come i numeri di <b>modulo uno</b>. Tre proprietà da avere in mano, tutte immediate dalla definizione:
  $$(A^\dagger)^\dagger=A,\qquad (AB)^\dagger=B^\dagger A^\dagger,\qquad (A^\dagger)^{-1}=(A^{-1})^\dagger.$$
  La seconda è quella che si sbaglia: <b>l&rsquo;ordine si inverte</b>, come per la trasposta e per l&rsquo;inversa di un prodotto. In notazione di Dirac tutto questo si riassume in $|Av\rangle=A|v\rangle$ e $\langle Av|=\langle v|A^\dagger$: il dagger è ciò che si paga per far uscire un operatore dal ket ed entrare nel bra.</p>
  <p>Una matrice hermitiana ha quindi <b>diagonale reale</b> ed elementi fuori diagonale coniugati a coppie; un operatore è <b>unitario</b> se $U^\dagger=U^{-1}$, e allora due fatti seguono subito. Il primo: $|\det U|=1$, perché $\det U^\dagger=(\det U)^*$ e $\det(UU^\dagger)=|\det U|^2=1$. Il secondo, che è il vero motivo per cui la fisica li usa:
  $$\langle Uu|Uv\rangle=\langle u|U^\dagger U|v\rangle=\langle u|v\rangle,$$
  cioè <b>gli unitari conservano il prodotto scalare</b> — e con esso lunghezze, angoli e, in meccanica quantistica, le probabilità. Le rotazioni della tappa 01 e la moltiplicazione per una fase globale $v\mapsto e^{i\varphi}v$ sono i due esempi minimi.</p>
  <p>Due conseguenze immediate dell&rsquo;autoaggiuntezza, ed è per queste che la fisica usa proprio questi operatori:</p>
  <ul>
  <li><b>Autovalori reali:</b> da $A\phi=\lambda\phi$ segue $\lambda\lVert\phi\rVert^2=\langle A\phi,\phi\rangle=\langle\phi,A\phi\rangle=\bar\lambda\lVert\phi\rVert^2$, quindi $\lambda=\bar\lambda$. <b>I risultati di una misura sono numeri reali</b> perché le osservabili sono autoaggiunte.</li>
  <li><b>Autovettori di autovalori distinti sono ortogonali:</b> $\lambda\langle\phi,\psi\rangle=\langle A\phi,\psi\rangle=\langle\phi,A\psi\rangle=\mu\langle\phi,\psi\rangle$, e se $\lambda\ne\mu$ resta $\langle\phi,\psi\rangle=0$. <b>Stati con esiti di misura diversi sono perfettamente distinguibili.</b></li>
  </ul>
  <div class="note">Nota sull&rsquo;<b>unitario</b>: $U^\dagger U=\mathbb{1}$, cioè $U$ conserva il prodotto scalare. L&rsquo;evoluzione temporale $e^{-iHt/\hbar}$ è unitaria <b>perché</b> $H$ è autoaggiunto — la conservazione della probabilità (Parseval, nucleo 09) è l&rsquo;unitarietà. Autoaggiunto e unitario stanno fra loro come reale e di modulo uno.</div>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`$-i\frac{d}{dx}$ su $[0,L]$: è autoaggiunto?`,
    a:R`<b>Dipende dalle condizioni al bordo</b>, ed è tutto il punto. Integrando per parti, $\langle -i f',g\rangle-\langle f,-ig'\rangle=-i\big[f\bar g\big]_0^L$: l&rsquo;operatore è autoaggiunto solo se quel termine di bordo si annulla, per esempio con condizioni <b>periodiche</b> $f(0)=f(L)$. Con Dirichlet $f(0)=f(L)=0$ l&rsquo;operatore è simmetrico ma <b>non</b> autoaggiunto (i domini di $A$ e $A^\dagger$ differiscono) e non ha autovettori. È la ragione per cui &laquo;l&rsquo;impulso in una scatola&raquo; è un oggetto delicato, mentre l&rsquo;energia no.`},
   {q:R`Un operatore con autovalori reali è necessariamente autoaggiunto?`,
    a:R`No. $\begin{pmatrix}1&1\\0&2\end{pmatrix}$ ha autovalori $1,2$ reali ma non è simmetrica, e i suoi autovettori <b>non</b> sono ortogonali. È esattamente la situazione del trabocchetto della tappa 05: si può diagonalizzare, ma non con una base ortonormale — e i proiettori spettrali <b>non</b> sono $|v\rangle\langle v|$.`}
  ]}
]},

/* ---------------- 03 · PAULI E LEVI-CIVITA ---------------- */
{ num:'03', title:'Le matrici di Pauli e il simbolo di Levi–Civita', meta:'$\\sigma_i\\sigma_j=\\delta_{ij}\\mathbb{1}+i\\varepsilon_{ijk}\\sigma_k$ · la base delle hermitiane $2\\times2$ · $\\varepsilon_{ijk}\\varepsilon_{imn}=\\delta_{jm}\\delta_{kn}-\\delta_{jn}\\delta_{km}$',
  blocchi:[
  {t:'prosa', title:'Perché queste tre matrici e non altre', tag:'strumento', html:R`
  <p>Lo spazio delle matrici $2\times2$ <b>hermitiane</b> è uno spazio vettoriale <b>reale</b> di dimensione quattro: la matrice generica
  $$A=\begin{pmatrix}a&b-ic\\ b+ic&d\end{pmatrix},\qquad a,b,c,d\in\mathbb{R},$$
  ha quattro parametri reali. Serve quindi una base di quattro elementi, e la scelta standard è l&rsquo;identità più le tre <b>matrici di Pauli</b>:
  $$\sigma_1=\begin{pmatrix}0&1\\1&0\end{pmatrix},\qquad \sigma_2=\begin{pmatrix}0&-i\\ i&0\end{pmatrix},\qquad \sigma_3=\begin{pmatrix}1&0\\ 0&-1\end{pmatrix},$$
  con la decomposizione esplicita
  $$A=\frac{a+d}{2}\,\mathbb{1}+b\,\sigma_1+c\,\sigma_2+\frac{a-d}{2}\,\sigma_3.$$
  Non sono una curiosità algebrica: sono <b>lo spin $1/2$</b>, e ogni osservabile di un sistema a due stati (spin, polarizzazione, qubit, oscillazione di neutrini) è una combinazione reale di queste quattro.</p>
  <p>Le proprietà da sapere a memoria, tutte verificabili in due righe di prodotto matriciale:</p>
  <ul>
  <li>$\sigma_i^\dagger=\sigma_i$ (hermitiane) e $\sigma_i^{-1}=\sigma_i$, quindi anche <b>unitarie</b>; $\det\sigma_i=-1$;</li>
  <li>$\sigma_i^2=\mathbb{1}$, e di conseguenza gli autovalori di ogni $\sigma_i$ sono $\pm1$;</li>
  <li>$\operatorname{Tr}\sigma_i=0$ e $\operatorname{Tr}(\sigma_i\sigma_j)=2\delta_{ij}$ — quest&rsquo;ultima dice che la base è <b>ortogonale</b> rispetto al prodotto scalare $\langle A,B\rangle=\operatorname{Tr}(A^\dagger B)$, ed è la formula con cui si estraggono i coefficienti di una decomposizione;</li>
  <li>$[\sigma_i,\sigma_j]=2i\sum_k\varepsilon_{ijk}\sigma_k$ (commutatore) e $\{\sigma_i,\sigma_j\}=2\delta_{ij}\mathbb{1}$ (anticommutatore).</li>
  </ul>
  <p>Sommando le ultime due si ottiene la relazione che in pratica si usa sempre, perché riduce <b>qualsiasi</b> prodotto di matrici di Pauli a una combinazione di identità e una sola $\sigma$:
  $$\boxed{\ \sigma_i\,\sigma_j=\delta_{ij}\,\mathbb{1}+i\sum_k\varepsilon_{ijk}\,\sigma_k\ }$$
  Per esempio $\sigma_1\sigma_2=i\sigma_3$, $\sigma_2\sigma_3=i\sigma_1$, $\sigma_3\sigma_1=i\sigma_2$: la stessa struttura ciclica del prodotto vettoriale, e non è una coincidenza — è la stessa algebra di Lie, quella del momento angolare.</p>
  <div class="note"><b>Cucitura fra le fonti.</b> Le note di Caprini ed Esposito (§2.5) introducono le $\sigma_i$ come base delle hermitiane $2\times2$ e ne elencano le sette proprietà; Calogero (cap. 3, es. 15) chiede di <b>dimostrare</b> anticommutatore e prodotti ciclici, e aggiunge un fatto che le note non dicono: se $\vec e_1,\vec e_2,\vec e_3$ sono tre versori reali ortogonali e si pone $\sigma'_j=\vec e_j\cdot\vec\sigma$, le nuove $\sigma'_j$ <b>godono esattamente delle stesse proprietà</b>. Detto altrimenti: le matrici di Pauli non individuano tre direzioni privilegiate, ma una <b>terna qualsiasi</b> — la fisica dello spin non ha un asse preferito finché non lo sceglie un campo magnetico. Il conto che lo verifica usa $\sigma_i\sigma_j=\delta_{ij}+i\varepsilon_{ijk}\sigma_k$ e nient&rsquo;altro.</div>`},
  {t:'reveal', title:'Levi–Civita: tre contrazioni, e si smette di soffrire con i prodotti vettoriali', tag:'strumento', steps:[
   {label:'La definizione, e cosa la rende utile', body:R`<p>$\varepsilon_{ijk}$ è completamente <b>antisimmetrico</b> nello scambio di qualunque coppia di indici, con $\varepsilon_{123}=+1$. L&rsquo;antisimmetria implica subito che ogni componente con due indici uguali è <b>nulla</b>: $\varepsilon_{iij}=\varepsilon_{jii}=\varepsilon_{iji}=0$. Restano sei componenti non nulle, pari a $\pm1$.</p>
   <p>Serve perché rende <b>algebrici</b> oggetti che altrimenti si scrivono a componenti: $(\vec u\times\vec v)_i=\sum_{j,k}\varepsilon_{ijk}u_jv_k$, e $\det M=\frac{1}{3!}\sum\varepsilon_{ijk}\varepsilon_{\ell mn}M_{i\ell}M_{jm}M_{kn}$ per una $3\times3$.</p>`},
   {label:'Le tre contrazioni', body:R`<p>Si ricavano una dall&rsquo;altra, e il trucco è sempre lo stesso: <b>il risultato deve avere la struttura tensoriale giusta</b>, e l&rsquo;unico oggetto costante a disposizione è $\delta$; il coefficiente si fissa contraendo ancora.</p>
   <p><b>Totale:</b> gli unici termini non nulli sono i sei con tutti gli indici diversi, ciascuno di quadrato $1$:
   $$\sum_{i,j,k}\varepsilon_{ijk}\varepsilon_{ijk}=6.$$
   <b>Su due indici:</b> il risultato porta due indici liberi ed è simmetrico nel loro scambio, quindi $\sum_{i,j}\varepsilon_{ijk}\varepsilon_{ijm}=\alpha\,\delta_{km}$; contraendo $k=m$ si ha $6=3\alpha$, cioè
   $$\sum_{i,j}\varepsilon_{ijk}\varepsilon_{ijm}=2\,\delta_{km}.$$
   <b>Su un indice:</b> quattro indici liberi, simmetrico sotto $(jk)\leftrightarrow(mn)$ e antisimmetrico sotto $j\leftrightarrow k$ e $m\leftrightarrow n$; l&rsquo;unica combinazione è $\beta(\delta_{jm}\delta_{kn}-\delta_{jn}\delta_{km})$, e contraendo si trova $\beta=1$:
   $$\boxed{\ \sum_i\varepsilon_{ijk}\,\varepsilon_{imn}=\delta_{jm}\delta_{kn}-\delta_{jn}\delta_{km}\ }$$
   È <b>la</b> formula da ricordare: le altre due si riottengono da questa contraendo.</p>`},
   {label:'A cosa serve davvero: il doppio prodotto vettoriale', body:R`<p>Dimostrare $(\vec v\times\vec u)\times\vec w=(\vec v\cdot\vec w)\,\vec u-(\vec u\cdot\vec w)\,\vec v$ a componenti è penoso; con Levi–Civita è meccanico:
   $$[(\vec v\times\vec u)\times\vec w]_i=\sum_{j,k}\varepsilon_{ijk}(\vec v\times\vec u)_jw_k=\sum_{j,k,m,n}\varepsilon_{ijk}\varepsilon_{jmn}v_mu_nw_k=-\sum\varepsilon_{jik}\varepsilon_{jmn}v_mu_nw_k,$$
   e applicando la contrazione su un indice, $-\sum_{k,m,n}(\delta_{im}\delta_{kn}-\delta_{in}\delta_{km})v_mu_nw_k=-v_i(\vec u\cdot\vec w)+u_i(\vec v\cdot\vec w)$. $\blacksquare$</p>
   <div class="note">Lo stesso identico conto, con $\vec L=\vec r\times\vec p$ al posto dei tre vettori, dà l&rsquo;algebra del momento angolare $[\hat L_i,\hat L_j]=i\hbar\sum_k\varepsilon_{ijk}\hat L_k$ — il movimento me-09b la ricava così, ed è il motivo per cui questa digressione sta qui e non in un&rsquo;appendice. Il simbolo di Levi–Civita è lo stesso oggetto che in tappa 03 fa commutare le matrici di Pauli e in me-09b fa commutare le componenti del momento angolare: <b>spin e momento angolare orbitale hanno la stessa algebra perché hanno lo stesso $\varepsilon$</b>.</div>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Quanto vale $(\vec n\cdot\vec\sigma)^2$ se $\vec n$ è un versore reale?`,
    a:R`Vale $\mathbb{1}$. Infatti $(\vec n\cdot\vec\sigma)^2=\sum_{i,j}n_in_j\sigma_i\sigma_j=\sum_{i,j}n_in_j\bigl(\delta_{ij}\mathbb{1}+i\varepsilon_{ijk}\sigma_k\bigr)=|\vec n|^2\mathbb{1}=\mathbb{1}$: il secondo termine muore perché $n_in_j$ è <b>simmetrico</b> e $\varepsilon_{ijk}$ <b>antisimmetrico</b>, e la contrazione di un simmetrico con un antisimmetrico è sempre zero. <b>Questo singolo fatto</b> è ciò che rende calcolabile $e^{i\theta\,\vec n\cdot\vec\sigma}$ in tappa 06: una matrice il cui quadrato è l&rsquo;identità ha solo due potenze indipendenti.`},
   {q:R`Una matrice $2\times2$ hermitiana a traccia nulla: quanti parametri reali ha, e come si scrive?`,
    a:R`Tre: è $\vec a\cdot\vec\sigma$ con $\vec a\in\mathbb{R}^3$. La traccia nulla elimina il coefficiente dell&rsquo;identità (le $\sigma_i$ hanno traccia zero), e restano le tre componenti. In meccanica quantistica è l&rsquo;hamiltoniana generica di un sistema a due livelli a meno di uno spostamento dell&rsquo;origine delle energie — e i suoi autovalori sono $\pm|\vec a|$, perché $(\vec a\cdot\vec\sigma)^2=|\vec a|^2\mathbb{1}$.`}
  ]}
]},

/* ---------------- 04 · AUTOVALORI E DIAGONALIZZABILITÀ ---------------- */
{ num:'04', title:'Autovalori, autovettori, diagonalizzabilità', meta:'$\\det(A-\\lambda\\mathbb{1})=0$ · autospazi · quando una matrice NON si diagonalizza',
  blocchi:[
  {t:'prosa', title:'Il problema agli autovalori, e da dove viene la domanda', tag:'first principles', html:R`
  <p>La domanda che apre la teoria spettrale non è algebrica ma dinamica. In una dimensione si sa risolvere $\ddot x=-\omega^2x$. In $n$ dimensioni, un sistema lagrangiano attorno a un equilibrio $q^*$ dà
  $$m\,\delta\ddot q+H\cdot\delta q=0,\qquad H_{ij}=\partial_i\partial_jV(q^*)$$
  con $H$ la matrice <b>hessiana</b> del potenziale. Verrebbe da scrivere $\delta q(t)=e^{i\sqrt{H/m}\,t}a_1+e^{-i\sqrt{H/m}\,t}a_2$, e la domanda &laquo;che senso ha l&rsquo;esponenziale di una matrice, e quella soluzione cresce o no?&raquo; è esattamente ciò che questo movimento risponde. <b>Risposta corta:</b> diagonalizzando $H$ il sistema si spezza in $n$ oscillatori indipendenti — i <b>modi normali</b> — e il segno di ciascun autovalore decide stabile o instabile.</p>
  <p><b>Definizione.</b> $\lambda$ è <b>autovalore</b> di $A$ se esiste $|v_\lambda\rangle\ne0$ con $A|v_\lambda\rangle=\lambda|v_\lambda\rangle$; l&rsquo;insieme degli autovalori è lo <b>spettro</b>. In matrice, $(A-\lambda\mathbb{1})v=0$ ha soluzioni non banali se e solo se il sistema è singolare:
  $$p(\lambda)\equiv\det(A-\lambda\mathbb{1})=0\qquad\text{(equazione caratteristica)}.$$
  Poiché $p$ è un polinomio di grado $n$, per il teorema fondamentale dell&rsquo;algebra (nucleo me-00) <b>ogni matrice $n\times n$ ha esattamente $n$ autovalori complessi contati con molteplicità</b>. Che siano complessi non è un difetto: è il motivo per cui l&rsquo;analisi complessa del Movimento III serve anche qui.</p>
  <p>Due fatti strutturali si aggiungono subito. Il primo: <b>autovettori di autovalori distinti sono linearmente indipendenti</b> — se $\alpha|v_1\rangle+\beta|v_2\rangle=0$, applicando $A$ e sottraendo $\lambda_2$ volte la relazione si ottiene $(\lambda_1-\lambda_2)\alpha|v_1\rangle=0$, quindi $\alpha=0$ e poi $\beta=0$. Il secondo: l&rsquo;insieme degli autovettori di uno stesso $\lambda$ più il vettore nullo forma un sottospazio, l&rsquo;<b>autospazio</b> $L_\lambda=\ker(A-\lambda\mathbb{1})$.</p>
  <div class="note"><b>Due invarianti che regalano gli autovalori delle $2\times2$</b> (è in Calogero, §3.3, e non nelle note). Traccia e determinante sono invarianti per similitudine, e su una matrice diagonale valgono somma e prodotto degli elementi: quindi <b>la traccia è la somma degli autovalori e il determinante il loro prodotto</b>. Per una $2\times2$ questo <b>basta</b> a trovarli senza scrivere il polinomio: $\lambda_{1,2}$ sono le radici di $\lambda^2-(\operatorname{Tr}A)\lambda+\det A=0$. Corollario utile all&rsquo;esame: una matrice diagonalizzabile ha $0$ fra gli autovalori <b>se e solo se</b> $\det A=0$, cioè se e solo se non è invertibile.</div>`},
  {t:'reveal', title:'Quando si diagonalizza, e la costruzione esplicita di $S$', tag:'costruzione', steps:[
   {label:'La condizione', body:R`<p>$A$ è <b>diagonalizzabile</b> se esiste $S$ invertibile con $S^{-1}AS=D$ diagonale. La condizione è: <b>se $A$ ha $n$ autovettori linearmente indipendenti, allora è diagonalizzabile</b>, e la dimostrazione è costruttiva — è l&rsquo;algoritmo stesso.</p>`},
   {label:'La costruzione', body:R`<p>Si mettono gli autovettori <b>nelle colonne</b>: $S=\bigl(v^{(1)}\ v^{(2)}\ \cdots\ v^{(n)}\bigr)$, cioè $S_{ij}=v^{(j)}_i$. La matrice è invertibile perché le colonne sono indipendenti, e
   $$(A\cdot S)_{ij}=\sum_kA_{ik}v^{(j)}_k=\lambda_jv^{(j)}_i=\sum_kv^{(k)}_i\delta_{kj}\lambda_k=(S\cdot D)_{ij},$$
   cioè $AS=SD$, cioè $S^{-1}AS=D$. $\blacksquare$ <b>È la stessa regola di incolonnamento della tappa 01</b>: $S$ porta la vecchia base nella nuova, e la nuova base è quella degli autovettori.</p>`},
   {label:'I due casi', body:R`<p><b>(1) Autovalori tutti distinti</b> $\Rightarrow$ $n$ autovettori indipendenti $\Rightarrow$ <b>sempre</b> diagonalizzabile. <b>(2) Autovalori coincidenti</b> $\Rightarrow$ diagonalizzabilità <b>non garantita</b>: va controllata la dimensione dell&rsquo;autospazio.</p>
   <p>Il controesempio minimo da tenere in tasca è
   $$A=\begin{pmatrix}1&1\\0&1\end{pmatrix},\qquad p(\lambda)=(1-\lambda)^2,\qquad \lambda_1=\lambda_2=1.$$
   Il sistema $(A-\mathbb{1})v=0$ dà $v_2=0$: un <b>solo</b> autovettore indipendente, $v=\binom{1}{0}$. Gli autovettori non formano una base e la matrice <b>non</b> è diagonalizzabile. Molteplicità algebrica $2$, molteplicità geometrica $1$: il difetto sta nella differenza fra le due.</p>
   <div class="note">Per queste matrici esiste la forma di <b>Jordan</b>, che <b>non è nel programma di questo corso</b> (Caprini ed Esposito trattano invece Cayley–Hamilton e la diagonalizzazione simultanea, tappe 06 e 07). Va comunque saputo <b>riconoscere</b> il caso, perché è la situazione in cui tutte le formule di questo nucleo smettono di valere — e perché non può mai capitare a un operatore hermitiano, che è il caso della fisica.</div>`}
  ]},
  {t:'reveal', title:'Hermitiani e unitari: perché la fisica vive nel caso buono', tag:'il teorema', steps:[
   {label:'Autovalori reali', body:R`<p>Da $A|v\rangle=\lambda|v\rangle$ e $A=A^\dagger$: $\lambda\langle v|v\rangle=\langle v|Av\rangle=\langle Av|v\rangle^*=\langle v|A^\dagger v\rangle^*=\lambda^*\langle v|v\rangle$, quindi $\lambda=\lambda^*$. <b>Le osservabili hanno esiti reali per un fatto di due righe.</b></p>`},
   {label:'Autovettori ortogonali, e perché sono SEMPRE $n$', body:R`<p>Se $\lambda_1\ne\lambda_2$, da $\lambda_2\langle v^{(1)}|v^{(2)}\rangle=\langle v^{(1)}|Av^{(2)}\rangle=\langle Av^{(1)}|v^{(2)}\rangle=\lambda_1\langle v^{(1)}|v^{(2)}\rangle$ segue $(\lambda_2-\lambda_1)\langle v^{(1)}|v^{(2)}\rangle=0$, cioè <b>ortogonalità</b>.</p>
   <p>Resta da escludere il caso (2) della finestra precedente, e la dimostrazione è per <b>induzione sulla dimensione</b>. Un hermitiano ha almeno un autovettore $|v^{(1)}\rangle$ (il polinomio caratteristico ha almeno una radice). Il suo <b>ortogonale</b> $H^\perp$ è <b>invariante</b>: se $\langle u|v^{(1)}\rangle=0$ allora $\langle Au|v^{(1)}\rangle=\langle u|Av^{(1)}\rangle=\lambda\langle u|v^{(1)}\rangle=0$, quindi $A|u\rangle\in H^\perp$. Su $H^\perp$, che ha dimensione $n-1$, $A$ è di nuovo hermitiano: ha un autovettore, si ripete. Dopo $n$ passi si hanno $n$ autovettori mutuamente ortogonali. $\blacksquare$</p>
   <p>Se un autovalore è <b>degenere</b> gli autovettori dentro il suo autospazio non sono automaticamente ortogonali fra loro, ma si ortonormalizzano con <b>Gram–Schmidt</b> (nucleo 08) restando autovettori — la combinazione lineare di autovettori dello stesso $\lambda$ è ancora un autovettore di $\lambda$.</p>`},
   {label:'La conseguenza che si usa ogni volta', body:R`<p>La base di autovettori si può scegliere <b>ortonormale</b>, e allora la matrice di cambio di base è <b>unitaria</b>: $(S^\dagger S)_{ij}=\sum_n(e^{(i)}_n)^*e^{(j)}_n=\langle e^{(i)}|e^{(j)}\rangle=\delta_{ij}$, cioè $S^\dagger=S^{-1}$. <b>Diagonalizzare un hermitiano è ruotare</b>, non deformare — ed è precisamente la condizione sotto cui i proiettori della tappa 05 sono $|v\rangle\langle v|$.</p>
   <p>Per gli operatori <b>unitari</b> vale l&rsquo;analogo, con la stessa dimostrazione: autovalori di <b>modulo uno</b> ($\lambda=e^{i\varphi}$) e autovettori che formano una base ortonormale. Torna l&rsquo;analogia della tappa 02: hermitiano $\leftrightarrow$ reale, unitario $\leftrightarrow$ modulo uno, e lo spettro è esattamente dove la si legge.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`$\operatorname{Tr}A=5$ e $\det A=6$ per una $2\times2$ diagonalizzabile: quanto vale $\operatorname{Tr}(A^{3})$?`,
    a:R`Gli autovalori risolvono $\lambda^2-5\lambda+6=0$, cioè $\lambda=2,3$. La traccia di $A^3$ è la somma dei cubi degli autovalori — perché $A^3$ è diagonale nella stessa base, con elementi $\lambda_i^3$ — quindi $8+27=35$. <b>Nessun conto matriciale</b>: è il primo assaggio della tappa 06, dove ogni funzione di matrice si calcola sullo spettro.`},
   {q:R`Una matrice reale può avere autovalori complessi? E una reale simmetrica?`,
    a:R`Sì alla prima: la rotazione di $90^\circ$, $\begin{pmatrix}0&-1\\1&0\end{pmatrix}$, ha $\lambda=\pm i$ — è unitaria, e infatti $|\lambda|=1$. No alla seconda: una reale simmetrica è hermitiana, quindi ha spettro <b>reale</b> e autovettori ortogonali, e si diagonalizza con una matrice <b>ortogonale</b>. È il caso della matrice hessiana della finestra di apertura, ed è il motivo per cui le frequenze dei modi normali sono numeri veri e i modi non si mescolano.`}
  ]}
]},

/* ---------------- 05 · TEOREMA SPETTRALE ---------------- */
{ num:'05', title:'Il teorema spettrale e i proiettori', meta:'$A=\\sum\\lambda_nP_n$ · $P_iP_j=\\delta_{ij}P_i$ · TRABOCCHETTO: autovettori non ortonormali',
  blocchi:[
  {t:'reveal', title:'Da dove vengono i proiettori, e le tre relazioni che li governano', tag:'costruzione', steps:[
   {label:'Nella base in cui A è diagonale è tutto ovvio', body:R`<p>Se $A$ è diagonale, i suoi autovettori sono la base canonica e i proiettori sono le matrici con un solo $1$ sulla diagonale:
   $$P^{(D)}_i=|e^{(i)}\rangle\langle e^{(i)}|,\qquad\text{per esempio}\quad P^{(D)}_2=\begin{pmatrix}0&&\\&1&\\&&0\end{pmatrix}.$$
   Da $\langle e^{(i)}|e^{(j)}\rangle=\delta_{ij}$ seguono immediatamente <b>ortogonalità</b> $P^{(D)}_iP^{(D)}_j=\delta_{ij}P^{(D)}_i$ e <b>completezza</b> $\sum_iP^{(D)}_i=\mathbb{1}$.</p>`},
   {label:'E in una base qualunque restano vere', body:R`<p>Torniamo indietro con la similitudine della tappa 01: $A=S\,D\,S^{-1}$ e $P_i=S\,P^{(D)}_i\,S^{-1}$. Allora
   $$P_iP_j=S P^{(D)}_iS^{-1}S P^{(D)}_jS^{-1}=S P^{(D)}_iP^{(D)}_jS^{-1}=\delta_{ij}P_i,\qquad \sum_iP_i=S\,\mathbb{1}\,S^{-1}=\mathbb{1}.$$
   <b>Le due relazioni non dipendono dalla base</b>: sono proprietà dell&rsquo;operatore. In componenti, $(P_i)_{jk}=S_{ji}(S^{-1})_{ik}$ — prodotto della colonna $i$ di $S$ per la riga $i$ di $S^{-1}$.</p>`},
   {label:'La rappresentazione spettrale', body:R`<p>Poiché ogni $|u\rangle=\sum_i\alpha_i|v^{(i)}\rangle$ e $P_i|u\rangle=\alpha_i|v^{(i)}\rangle$,
   $$A|u\rangle=\sum_i\alpha_i\lambda_i|v^{(i)}\rangle=\Bigl(\sum_i\lambda_iP_i\Bigr)|u\rangle\qquad\Longrightarrow\qquad \boxed{\ A=\sum_i\lambda_i\,P_i\ }$$
   Vale per <b>ogni</b> matrice diagonalizzabile, hermitiana o no. Ciò che l&rsquo;hermiticità aggiunge è che i $P_i$ siano <b>proiettori ortogonali</b>, cioè $P_i^\dagger=P_i$ — ed è tutta la differenza fra il caso buono e il trabocchetto qui sotto.</p>`},
   {label:'Esempio completo: il caso ortonormale', body:R`<p>$A=\begin{pmatrix}1&1+i\\ 1-i&2\end{pmatrix}$ (hermitiana). Polinomio caratteristico $p(\lambda)=(1-\lambda)(2-\lambda)-2=\lambda^2-3\lambda$, quindi $\lambda_1=0$, $\lambda_2=3$. Autovettori normalizzati:
   $$e^{(1)}=\frac{1}{\sqrt6}\begin{pmatrix}2\\ i-1\end{pmatrix},\qquad e^{(2)}=\frac{1}{\sqrt3}\begin{pmatrix}1\\ 1-i\end{pmatrix},$$
   ortonormali, quindi $S=\bigl(e^{(1)}\ e^{(2)}\bigr)$ è <b>unitaria</b> e i proiettori sono $P_i=e^{(i)}e^{(i)\dagger}$:
   $$P_1=\frac16\begin{pmatrix}4&-2(1+i)\\ 2(i-1)&2\end{pmatrix},\qquad P_2=\frac13\begin{pmatrix}1&1+i\\ 1-i&2\end{pmatrix}.$$
   Le tre verifiche che vanno fatte sempre: $P_iP_j=\delta_{ij}P_i$, $P_1+P_2=\mathbb{1}$, e $0\cdot P_1+3\cdot P_2=A$. <b>Nota che $P_2=A/3$</b>: quando un autovalore è nullo la matrice coincide con il proiettore sull&rsquo;altro autospazio, moltiplicato per il suo autovalore.</p>`},
   {label:'Esempio completo: il caso NON ortonormale', body:R`<p>$A=\begin{pmatrix}3&1\\ 2&2\end{pmatrix}$, non simmetrica. Autovalori $\lambda_1=1$, $\lambda_2=4$; autovettori $v^{(1)}=\binom{1}{-2}$ e $v^{(2)}=\binom{1}{1}$, con $v^{(1)}\cdot v^{(2)}=-1\ne0$: <b>non ortogonali</b>, quindi $P_i\ne|v^{(i)}\rangle\langle v^{(i)}|$. Si procede per similitudine:
   $$S=\begin{pmatrix}1&1\\ -2&1\end{pmatrix},\qquad S^{-1}=\frac13\begin{pmatrix}1&-1\\ 2&1\end{pmatrix},\qquad S^{-1}AS=\begin{pmatrix}1&0\\ 0&4\end{pmatrix},$$
   $$P_1=S\begin{pmatrix}1&0\\0&0\end{pmatrix}S^{-1}=\frac13\begin{pmatrix}1&-1\\ -2&2\end{pmatrix},\qquad P_2=\frac13\begin{pmatrix}2&1\\ 2&1\end{pmatrix}.$$
   Verifiche: $P_1+P_2=\mathbb{1}$, $P_i^2=P_i$, $P_1P_2=0$, e $1\cdot P_1+4\cdot P_2=A$. <b>I proiettori non sono simmetrici</b> — sono <b>obliqui</b>, e va bene così.</p>`}
  ]},
  {t:'prosa', title:'Enunciato e uso', tag:'il teorema', html:R`
  <p><b>Teorema spettrale (caso con spettro discreto).</b> Se $A$ è autoaggiunto (e compatto, o con risolvente compatto — è il caso dei problemi ai limiti su domini limitati), esiste una <b>base ortonormale</b> $\{\phi_n\}$ di $H$ fatta di autovettori, $A\phi_n=\lambda_n\phi_n$ con $\lambda_n\in\mathbb{R}$, e
  $$A=\sum_n\lambda_n P_n,\qquad P_n=|\phi_n\rangle\langle\phi_n|,\qquad P_nP_m=\delta_{nm}P_n,\qquad \sum_nP_n=\mathbb{1}.$$
  In pratica: nella base giusta $A$ è <b>diagonale</b>, e agisce su ogni componente moltiplicandola per $\lambda_n$.</p>
  <p><b>Perché è potente:</b> permette di definire <b>funzioni di operatori</b>. Se $f$ è una funzione ordinaria,
  $$f(A):=\sum_n f(\lambda_n)\,P_n.$$
  Da qui $e^{-iHt/\hbar}=\sum_ne^{-iE_nt/\hbar}P_n$ (l&rsquo;evoluzione quantistica), $e^{-\beta H}$ (il peso di Boltzmann), $A^{-1}=\sum\lambda_n^{-1}P_n$ (la funzione di Green, tappa 09). <b>Nella base spettrale ogni funzione dell&rsquo;operatore è banale</b>: agisce numero per numero.</p>
  <p>Quando lo spettro non è discreto (l&rsquo;operatore posizione, l&rsquo;hamiltoniana libera) la somma diventa un integrale su una <b>misura spettrale</b>: gli &laquo;autovettori&raquo; non stanno nello spazio (le onde piane non sono normalizzabili) e vivono nelle distribuzioni del nucleo 15. La struttura resta la stessa.</p>`},
  {t:'reveal', title:'Il trabocchetto: proiettori con autovettori NON ortonormali', tag:'errore d’esame n.2', steps:[
   {label:'Il caso buono', body:R`<p>Se gli autovettori sono ortonormali ($\langle v_i,v_j\rangle=\delta_{ij}$), allora $P_n=|v_n\rangle\langle v_n|$ e tutto funziona: $P_n^2=P_n$, $P_nP_m=0$, $\sum P_n=\mathbb{1}$.</p>`},
   {label:'Il caso in cui la formula è FALSA', body:R`<div class="note warn">Se l&rsquo;operatore <b>non</b> è autoaggiunto, gli autovettori in generale <b>non sono ortogonali</b>, e $|v_n\rangle\langle v_n|$ <b>non è il proiettore spettrale</b>: non è nemmeno idempotente nella direzione giusta, e la somma non fa l&rsquo;identità. Applicare la formula per abitudine è l&rsquo;errore n.2 segnalato negli scritti.</div>
   <p>La via corretta è il <b>cambio di base esplicito</b>. Se $S$ è la matrice che ha per colonne gli autovettori $v_n$, allora $A=S\Lambda S^{-1}$ e
   $$P_n=S\,E_{nn}\,S^{-1},$$
   con $E_{nn}$ la matrice che ha $1$ nel posto $(n,n)$ e $0$ altrove. Equivalentemente si introduce la <b>base duale</b> (biortogonale) $\{w_n\}$, le righe di $S^{-1}$, con $\langle w_i,v_j\rangle=\delta_{ij}$, e allora
   $$P_n=|v_n\rangle\langle w_n|\qquad\text{— autovettore a destra, DUALE a sinistra.}$$</p>`},
   {label:'Esempio minimo da tenere a mente', body:R`<p>$A=\begin{pmatrix}1&1\\0&2\end{pmatrix}$: autovalori $1,2$; autovettori $v_1=\binom{1}{0}$, $v_2=\binom{1}{1}$ — <b>non ortogonali</b>. La formula sbagliata darebbe $|v_2\rangle\langle v_2|=\begin{pmatrix}1&1\\1&1\end{pmatrix}$, che non è nemmeno idempotente ($P^2=2P$). Con $S=\begin{pmatrix}1&1\\0&1\end{pmatrix}$, $S^{-1}=\begin{pmatrix}1&-1\\0&1\end{pmatrix}$, i proiettori corretti sono
   $$P_1=\begin{pmatrix}1&-1\\0&0\end{pmatrix},\qquad P_2=\begin{pmatrix}0&1\\0&1\end{pmatrix},$$
   che verificano $P_1+P_2=\mathbb{1}$, $P_i^2=P_i$, $P_1P_2=0$ e $A=1\cdot P_1+2\cdot P_2$. $\blacksquare$ <b>Nota che non sono simmetrici</b>: sono proiettori <b>obliqui</b>, e va bene così — la proiezione ortogonale del nucleo 09 esiste solo quando la base lo è.</p>`}
  ]},
  {t:'plot', title:'Lo spettro come insieme di punti — e la firma del caos',
   intro:R`Lo spettro di un operatore è un insieme di numeri reali su una retta. <b>Come sono spaziati</b> è un&rsquo;informazione fisica: due sistemi con la stessa densità di livelli possono avere statistiche di spaziatura opposte.`,
   plots:[
    {kind:'func2d', xr:[0,10], yr:[-1.5,1.5], height:280, ticks:false,
     title:'sopra: livelli di un sistema integrabile - sotto: caotico (repulsione)',
     curves:[{f:'0*x-9', col:'#0e1117', width:0.1}],
