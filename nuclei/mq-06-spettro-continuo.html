   <p>e immediatamente aggiunge l&rsquo;avvertenza, che va riportata perché è il punto: «<i>La (6.34) ha solo un significato formale perché sappiamo che in $\mathcal H$ non esiste nessun autovettore delle $q_i$: la (6.34) ha significato solo se viene moltiplicata a sinistra per un vettore $|A\rangle$ di $\mathcal H$</i> (più precisamente per qualunque vettore nel dominio di $q$)<i>: essa è cioè un modo abbreviato per scrivere la (6.33)</i>.»</p>
   <p>E dà il nome: «<i>Questi oggetti $|x\rangle$, che non sono vettori di $\mathcal H$, vengono chiamati vettori impropri</i>» — con una parentesi che è un consiglio di igiene notazionale che nessuno ha seguito: «<i>e sarebbe forse meglio usare per essi una notazione diversa da quella per gli ordinari vettori</i>». Si tenga a mente: l&rsquo;unico motivo per cui la scrittura $|x\rangle$ confonde è che <i>assomiglia</i> a $|\psi\rangle$ e non lo è.</p>`},
   {label:'La completezza impropria, e dove si può usare', body:R`
   <p>Lo stesso passaggio dal vero al formale si fa sul prodotto scalare. Partendo da $\langle B|A\rangle=\int\langle B|x\rangle\langle x|A\rangle\,dx$ — che è un&rsquo;identità fra numeri, perfettamente lecita — si pone</p>
   $$\int|x\rangle\langle x|\,dx=\mathbb 1$$
   <p>«<i>che, al solito, ha un significato solo se ambo i membri vengono moltiplicati per due vettori arbitrari $\langle B|$ da sinistra e $|A\rangle$ da destra</i>». È l&rsquo;analogo della relazione di completezza $\sum_n|n\rangle\langle n|=\mathbb 1$ per una base propria, con l&rsquo;integrale al posto della somma e con una condizione d&rsquo;uso in più.</p>
   <p><b>Qui va fatta una distinzione che risparmia errori all&rsquo;esame.</b> La relazione di completezza impropria è <i>un&rsquo;identità vera</i>, non un&rsquo;approssimazione: l&rsquo;unica cosa che non ha senso è leggere i suoi due membri come operatori su $\mathcal H$ definiti punto per punto. Inserirla in mezzo a un prodotto scalare fra due stati fisici è sempre lecito, ed è il 90% di ciò che se ne fa. Il restante 10% — scrivere $\langle x'|x'\rangle$, o moltiplicare due $\delta$ — è fuori dal recinto di Dirac.</p>`},
   {label:'L’equazione con l’incognita', body:R`
   <p>Ora la domanda. Per una base propria $|n\rangle$ vale l&rsquo;ortonormalità $\langle n|m\rangle=\delta_{nm}$; <b>qual è l&rsquo;analogo per la base impropria?</b> Picasso pone la domanda con uno scrupolo che merita di essere citato: «<i>In effetti non sarebbe lecito porsi questo problema perché $|x\rangle$ e $|x'\rangle$ non sono vettori di $\mathcal H$ e quindi fra essi non è definito il prodotto scalare. Allora il problema ce lo poniamo in questi termini: se vogliamo dare un senso all&rsquo;espressione $\langle x|x'\rangle$, cosa dev&rsquo;essere quest&rsquo;espressione?</i>»</p>
   <p>Si noti la forma della domanda: non «quanto vale», ma «che cosa deve essere perché il resto funzioni». Si procede allora in avanti. Partendo da $\psi_A(x)=\langle x|A\rangle$ e usando la completezza impropria si ottiene $\langle x|A\rangle=\int\langle x|x'\rangle\langle x'|A\rangle\,dx'$, e posto $\langle x|x'\rangle=g(x,x')$ con $g$ <b>incognita</b>:</p>
   $$\psi_A(x)=\int g(x,x')\,\psi_A(x')\,dx'.$$
   <p>«<i>Il problema è quindi quello di determinare la $g(x,x')$ che soddisfa la (6.37) per ogni</i> $\psi_A$.» Questa è un&rsquo;equazione funzionale, e si legge così: cercare il <i>nucleo integrale dell&rsquo;operatore identità</i>. Che è, detto in modo meno tecnico: cercare l&rsquo;oggetto che, integrato contro qualunque funzione, restituisce quella funzione.</p>`},
   {label:'La soluzione, e perché è forzata', body:R`
   <p>Il primo passo è notare che $g$ non può dipendere dalle due variabili separatamente. Il secondo membro deve valere $\psi_A(x)$ per <i>ogni</i> $\psi_A$, e in particolare per ogni sua traslata: se si sostituisce $\psi_A(x)\to\psi_A(x+c)$ il risultato deve traslare dello stesso $c$, e questo obbliga $g$ a dipendere solo dalla differenza. Picasso lo dichiara con una riga: «<i>Quindi $g$ dipende solo dalla differenza $x-x'$</i>», e scrive $g(x,x')=\delta(x-x')$, dove per il momento $\delta$ è solo un nome per l&rsquo;incognita.</p>
   <p>Il terzo passo è la parità, già vista nella tappa 02: la relazione «<i>è ancora soddisfatta se a $\delta(x-x')$ si sostituisce $\delta(-x+x')$</i>», quindi $\delta$ è pari. Il quarto passo è porre $x=0$, che riduce l&rsquo;equazione funzionale a $\psi_A(0)=\int\delta(x')\psi_A(x')\,dx'$. <b>E a questo punto non c&rsquo;è più niente da determinare</b>: la condizione che $\delta$ deve soddisfare è esattamente la proprietà fondamentale della tappa 02, e le due proprietà che Picasso ne deduce — nulla fuori dall&rsquo;origine, integrale uno — sono incompatibili con l&rsquo;essere una funzione.</p>
   <p>Il risultato si scrive allora</p>
   $$\langle x|x'\rangle=\delta(x-x'),$$
   <p>e Picasso chiude con l&rsquo;osservazione che rovescia il senso di tutta la faccenda: «<i>Non è strano che $\langle x|x'\rangle$ sia una cosa così inconsueta come $\delta(x-x')$, cioè una distribuzione: questo risultato esprime il fatto che $\langle x|x'\rangle$ non è un prodotto scalare fra vettori di $\mathcal H$, e quindi per $x=x'$ non è un numero.</i>»</p>
   <p><b>È il punto più importante della tappa.</b> La stranezza della $\delta$ non è un difetto del formalismo da tollerare: è <i>l&rsquo;informazione</i> che i vettori impropri non stanno in $\mathcal H$, codificata nella forma dell&rsquo;oggetto che li lega. Se $\langle x|x'\rangle$ fosse venuto un numero per ogni coppia, i $|x\rangle$ sarebbero stati vettori ordinari — e la tappa 01 ha dimostrato che non possono esserlo. La $\delta$ è la cicatrice del teorema di impossibilità.</p>`}
  ]},
  {t:'reveal', title:'Più gradi di libertà, e il prodotto che non è un prodotto', tag:'esempio', steps:[
   {label:'La forma a n dimensioni', body:R`
   <p>Per $n$ gradi di libertà l&rsquo;ortogonalità impropria diventa</p>
   $$\langle x_1x_2\cdots x_n|x_1'x_2'\cdots x_n'\rangle=\delta(x_1-x_1')\,\delta(x_2-x_2')\cdots\delta(x_n-x_n')$$
   <p>e Picasso avverte che il prodotto a secondo membro «<i>è definito dall&rsquo;equazione</i>»</p>
   $$\int\cdots\int\psi(x_1,\dots,x_n)\,\delta(x_1)\cdots\delta(x_n)\,dx_1\cdots dx_n=\psi(0,\dots,0),$$
   <p>cioè dalla sua azione, in analogia al caso unidimensionale.</p>
   <p><b>Perché l&rsquo;avvertenza non è pedanteria.</b> Nella tappa 02 si è visto che il prodotto di due $\delta$ nello stesso punto non esiste. Qui compare un prodotto di $n$ $\delta$ e sembra una contraddizione — ma non lo è, perché le $\delta$ hanno <i>argomenti diversi</i>: ciascuna agisce su una variabile sua, e l&rsquo;integrazione è su $n$ variabili indipendenti. Quello che non esiste è $\delta(x)^2$, cioè due distribuzioni che litigano sulla stessa variabile. La regola pratica: tante $\delta$ quante variabili di integrazione, e tutto funziona.</p>`},
   {label:'L’operatore posizione, scritto nelle due notazioni', body:R`
   <p>Vale la pena mettere accanto le due facce dello stesso oggetto, perché nei conti si passa dall&rsquo;una all&rsquo;altra senza accorgersene. Da un lato il vettore improprio, dall&rsquo;altro l&rsquo;azione sulle funzioni, che è la (4.2) di Ballentine:</p>
   $$Q_\alpha\psi(x)=x_\alpha\psi(x).$$
   <p>La seconda è una definizione innocua: un operatore su uno spazio di funzioni, che a una funzione associa un&rsquo;altra funzione. La prima è l&rsquo;oggetto problematico. <b>E la seconda è tutto ciò che serve per calcolare.</b> Il valor medio della posizione, la sua varianza, la probabilità di trovare la particella in un intervallo — tutto si scrive con $Q\psi(x)=x\psi(x)$ e integrali ordinari, senza mai nominare $|x'\rangle$.</p>
   <p>Questo spiega perché un corso possa arrivare in fondo senza affrontare la questione: <i>la rappresentazione delle coordinate si usa senza gli autovettori della posizione</i>. Gli autovettori impropri servono quando si vuole la <b>struttura</b> — la completezza, il cambio di base, la funzione di trasformazione della tappa 04 — e non quando si vuole un numero.</p>
   <p>Ed è anche il motivo per cui la domanda d&rsquo;esame su questo argomento è una domanda di teoria e non un esercizio: non c&rsquo;è niente da calcolare, c&rsquo;è da sapere perché il formalismo che si usa ogni giorno è lecito.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Se $\langle x|x'\rangle=\delta(x-x')$, quanto vale la «norma» di $|x'\rangle$? E che cosa dice la risposta?`,
    a:R`Formalmente $\langle x'|x'\rangle=\delta(0)$, che non è un numero: è l&rsquo;espressione fuori dal recinto di cui parlava il collaudo della tappa 02. La risposta giusta non è «infinito» — è che <b>la domanda non è ben posta</b>, perché la norma è definita su $\mathcal H$ e $|x'\rangle$ non vi appartiene. Dirac dice la stessa cosa in positivo a pag. stampata 79, parlando dei vettori fondamentali con parametri continui: «<i>essi sono quindi di lunghezza infinita</i>», e proprio per questo «<i>è allora necessario qualche altro procedimento per stabilire i fattori numerici per cui i vettori fondamentali possono essere moltiplicati</i>». Quel procedimento è la normalizzazione <i>alla delta</i>: non si fissa la lunghezza — che non esiste — si fissa il coefficiente imponendo $\langle x|x'\rangle=\delta(x-x')$. È una condizione di normalizzazione legittima che non usa mai la norma, ed è la cosa che si fa nella tappa 04.`},
   {q:R`La deduzione di Picasso usa l&rsquo;invarianza per traslazione per concludere che $g$ dipende solo da $x-x'$. È un&rsquo;ipotesi fisica nascosta?`,
    a:R`No, ed è una distinzione utile. L&rsquo;argomento non usa l&rsquo;omogeneità dello <i>spazio</i> — non c&rsquo;è fisica — ma il fatto che l&rsquo;equazione debba valere per <b>ogni</b> $\psi_A$, e l&rsquo;insieme delle $\psi_A$ ammissibili è chiuso per traslazione: se $\psi_A(x)$ è una funzione d&rsquo;onda lecita, $\psi_A(x+c)$ lo è. È una proprietà dello spazio delle funzioni, non dello spazio fisico. Detto in altro modo: $g$ è il nucleo integrale dell&rsquo;operatore <i>identità</i>, e l&rsquo;identità commuta con tutto, in particolare con le traslazioni — quindi il suo nucleo deve essere invariante. L&rsquo;omogeneità dello spazio entra altrove e in modo essenziale, nella tappa 06, dove serve per fissare la forma dell&rsquo;operatore impulso: e <i>là</i> è un&rsquo;ipotesi fisica, dichiarata come tale.`},
   {q:R`Qual è la differenza fra il verso di Dirac e quello di Picasso, se arrivano allo stesso oggetto?`,
    a:R`Arrivano allo stesso oggetto ma rispondono a due domande diverse, e vale la pena tenerle separate. Dirac risponde a <i>come si tratta un&rsquo;infinità</i>: introduce uno strumento, ne dichiara le regole d&rsquo;uso, e ne risponde. Picasso risponde a <i>che cosa è costretto a essere</i> l&rsquo;oggetto che fa funzionare la completezza: lo determina, e scopre che non è una funzione. La differenza pratica si vede nel modo in cui le due impostazioni reagiscono a un dubbio. Se qualcuno chiede a Dirac «e se la $\delta$ fosse incoerente?», la risposta è il patto: la si usa solo dove non possono nascere contraddizioni. Se lo chiede a Picasso, la risposta è più forte: <i>qualunque</i> oggetto faccia quel lavoro ha quelle due proprietà, e un oggetto con quelle due proprietà non è una funzione — quindi il problema non è la $\delta$, è che la domanda non ha risposta fra le funzioni. La seconda non elimina la necessità di un formalismo rigoroso (sono le tappe 07 e 08), ma sposta il peso della prova.`}
  ]}
]},

/* ---------------- 04 · LA FUNZIONE DI TRASFORMAZIONE ---------------- */
{ num:'04', title:'La funzione di trasformazione, calcolata per due strade', meta:'l\'equazione differenziale di Dirac · la normalizzazione alla delta di Picasso · tre notazioni per la stessa costante · de Broglie finalmente capito',
  blocchi:[
  {t:'prosa', title:'Che cosa manca per avere due rappresentazioni', tag:'costruzione', html:R`
  <p>La tappa 03 ha costruito la base impropria delle coordinate. Lo stesso lavoro, parola per parola, si fa per l&rsquo;impulso: i $|p\rangle$ sono vettori impropri, vale $\int|p\rangle\langle p|\,dp=\mathbb 1$, e vale $\langle p|p'\rangle=\delta(p-p')$. Si hanno quindi <i>due</i> basi improprie, e ciascuna permette di rappresentare uno stato con una funzione: $\psi_A(x)=\langle x|A\rangle$ e $\varphi_A(p)=\langle p|A\rangle$.</p>
  <p>Il passaggio dall&rsquo;una all&rsquo;altra, come per ogni cambio di base, richiede un solo ingrediente. Inserendo la completezza:</p>
  $$\varphi_A(p)=\int\langle p|x\rangle\,\psi_A(x)\,dx,\qquad \psi_A(x)=\int\langle x|p\rangle\,\varphi_A(p)\,dp,$$
  <p>e Picasso lo dice esplicitamente: «<i>il passaggio da $\psi_A(x)$ a $\varphi_A(k)$, come pure quello inverso, è possibile non appena si conosca $\langle x|k\rangle$, in quanto $\langle k|x\rangle=\langle x|k\rangle^{*}$</i>». <b>Tutto il contenuto del cambio di rappresentazione sta in un unico oggetto</b>, che Dirac chiama <i>funzione di trasformazione</i>. Questa tappa lo calcola, e lo calcola due volte perché le due strade illuminano cose diverse.</p>
  <p>E Picasso aggiunge una motivazione che è più di un&rsquo;osservazione di comodo: $\langle x|p\rangle$ «<i>è anche la funzione d&rsquo;onda in rappresentazione di Schrödinger del vettore improprio $|k\rangle$</i>». Cioè: l&rsquo;oggetto che fa il cambio di base <i>è</i> l&rsquo;autofunzione impropria dell&rsquo;impulso. Due problemi diversi hanno la stessa risposta, «<i>abbiamo quindi due buoni motivi per calcolare</i>» quell&rsquo;espressione.</p>`},
  {t:'reveal', title:'Prima strada: l’equazione differenziale', tag:'costruzione', steps:[
   {label:'Da dove viene l’equazione', body:R`
   <p>La strada è quella di Dirac nel §23 e di Picasso nel §6.8, ed è la stessa. Si parte dall&rsquo;equazione agli autovalori dell&rsquo;impulso, $p_i|k_1\cdots k_n\rangle=\hbar k_i|k_1\cdots k_n\rangle$, e si proietta su $\langle x_1\cdots x_n|$. A sinistra l&rsquo;operatore impulso agisce come derivazione — e questo è il fatto che la tappa 06 giustificherà, qui lo si usa — quindi</p>
   $$-i\hbar\frac{\partial}{\partial x_1}\langle x_1\cdots x_n|k_1\cdots k_n\rangle=\hbar k_1\,\langle x_1\cdots x_n|k_1\cdots k_n\rangle,$$
   <p>e altrettante equazioni per le altre coordinate. «<i>La funzione di trasformazione è quindi determinata dalle equazioni differenziali (6.43)</i>»: il problema del cambio di base è diventato un sistema di equazioni differenziali del primo ordine, una per grado di libertà.</p>`},
   {label:'La soluzione, variabile per variabile', body:R`
   <p>La prima equazione si integra in $x_1$ e dà $f(x_2,\dots,x_n)\,e^{ik_1x_1}$, dove la «costante» di integrazione rispetto a $x_1$ è una funzione arbitraria delle altre coordinate — Picasso lo sottolinea: è «<i>la costante (rispetto a $x_1$) arbitraria di integrazione, e quindi è un&rsquo;arbitraria funzione di $x_2,\dots,x_n$</i>». La seconda equazione determina la dipendenza da $x_2$, e così via. Procedendo,</p>
   $$\langle x_1\cdots x_n|k_1\cdots k_n\rangle=c\;e^{i(k_1x_1+k_2x_2+\cdots+k_nx_n)}$$
   <p>«<i>dove $c$ è una costante arbitraria, cioè non dipende da nessuna delle $x$</i>». In una dimensione, e verificando direttamente che la soluzione risolve:</p>
   $$-i\hbar\frac{d}{dx}e^{ipx/\hbar}=p\,e^{ipx/\hbar}.$$
   <p><b>La struttura dell&rsquo;esponenziale è tutta qui, e non c&rsquo;è niente di misterioso:</b> l&rsquo;operatore impulso è una derivazione, le autofunzioni di una derivazione sono esponenziali, e l&rsquo;autovalore finisce nell&rsquo;esponente. Il contenuto fisico — l&rsquo;onda piana, la lunghezza d&rsquo;onda di de Broglie — è una <i>conseguenza</i> di un&rsquo;equazione differenziale elementare.</p>
   <p>Resta da determinare $c$, e qui le due strade divergono.</p>`},
   {label:'Come Dirac fissa la costante: la simmetria fra q e p', body:R`
   <p>Dirac, a pag. stampata 133, non usa la normalizzazione: usa una <b>simmetria</b>, e il modo in cui lo fa è istruttivo. Osserva che le relazioni di commutazione «<i>restano immutate scambiando ciascuna $q$ con la corrispondente $p$ e scrivendo $-i$ al posto di $i$</i>», e ne deduce che la funzione di trasformazione «<i>deve trasformarsi in $\langle p'|q'\rangle$ scambiando $q'$ con $p'$ e scrivendo $-i$ al posto di $i$</i>».</p>
   <p>Da qui il ragionamento è secco: $\langle q'|p'\rangle$ è dato dall&rsquo;esponenziale con il coefficiente $c$, e $\langle p'|q'\rangle$ dev&rsquo;essere il suo complesso coniugato; «<i>perciò $c$ deve essere indipendente da $p'$. Dunque $c$ non è altro che un numero</i>». Il modulo poi si fissa dal confronto con la relazione di ortogonalità, e dà $|c|=h^{-1/2}$. Scegliendo reale positivo l&rsquo;arbitrario fattore di fase,</p>
   $$\langle x|p\rangle=\frac{1}{\sqrt{2\pi\hbar}}\,e^{ipx/\hbar}.$$
   <p>Che è il risultato, scritto nella notazione di Picasso. <b>Dirac lo scrive diversamente</b>, e la differenza confonde chiunque legga le due fonti di seguito: la sua [23.6] porta il fattore $h^{-1/2}$. Ma</p>
   $$h^{-1/2}=(2\pi\hbar)^{-1/2}=\frac{1}{\sqrt{2\pi\hbar}}$$
   <p>perché $h=2\pi\hbar$: <b>è lo stesso numero</b>, scritto in potenze della costante di Planck invece che della sua versione ridotta. Non c&rsquo;è nessuna convenzione diversa da riconciliare, e vale la pena verificarlo una volta per non ricontrollarlo ogni volta che si confrontano due libri.</p>`}
  ]},
  {t:'reveal', title:'Seconda strada: la normalizzazione alla delta', tag:'costruzione', steps:[
   {label:'La condizione, e il conto', body:R`
   <p>Picasso fissa $c$ in modo diverso, e la sua strada è quella che si rifà a mano all&rsquo;esame. La condizione è l&rsquo;ortogonalità impropria sull&rsquo;impulso, $\langle k_1\cdots k_n|k_1'\cdots k_n'\rangle=\delta(k_1-k_1')\cdots\delta(k_n-k_n')$, che inserendo la completezza sulle coordinate diventa, in una dimensione,</p>
   $$|c|^{2}\int_{-\infty}^{+\infty}e^{i(k'-k)x}\,dx=\delta(k-k').$$
   <p>L&rsquo;integrale è esattamente la rappresentazione integrale della tappa 02:</p>
   $$\int_{-\infty}^{+\infty}e^{i(k-k')x}\,dx=2\pi\,\delta(k-k')$$
   <p>— e si noti che <i>qui</i> è dove il nucleo di Dirichlet e la convergenza alla Cesàro pagano il loro debito: senza di quelli, questo integrale non esiste. Picasso lo richiama come fatto noto, «<i>dalla teoria della trasformata di Fourier si sa che vale $2\pi\hbar\,\delta(k-k')$</i>» nella sua normalizzazione in $\hbar$. Confrontando i due membri resta $|c|^{2}(2\pi\hbar)^{n}=1$, e in una dimensione</p>
   $$|c|^{2}\,(2\pi\hbar)=1\ \Longrightarrow\ c=\frac{1}{\sqrt{2\pi\hbar}}.$$
   <p>Picasso aggiunge la precisazione che evita un&rsquo;ansia inutile: «<i>come ci si doveva aspettare $c$ è determinato a meno di un fattore di fase (perché i vettori $|k\rangle$ sono determinati a meno di un fattore di fase comune, e idem per i vettori $|x\rangle$); se scegliamo arbitrariamente $c$ reale positivo</i>» si ottiene il risultato. <b>La fase non è determinabile e non deve esserlo</b>: è la stessa libertà che ogni base ha.</p>`},
   {label:'Il fattore ħ, e dove si nasconde', body:R`
   <p>C&rsquo;è un passaggio in cui tutti sbagliano una volta, e val la pena farlo esplicitamente. Le due normalizzazioni possibili — alla $\delta$ in $k$ o alla $\delta$ in $p$ — <i>non</i> danno la stessa costante, e la ragione è la regola di riscalamento della tappa 02. Poiché $p=\hbar k$,</p>
   $$\delta(\hbar k-\hbar k')=\frac{1}{\hbar}\,\delta(k-k'),$$
   <p>cioè una $\delta$ in $p$ vale $1/\hbar$ volte la corrispondente $\delta$ in $k$. Picasso lo registra a pag. stampata 118 scrivendo le due forme accanto: $\langle p|p'\rangle=\delta(p-p')$ da un lato e $\hbar^{-1}\delta(k-k')$ dall&rsquo;altro, «<i>si è fatto uso della relazione $\delta(ax)=|a|^{-1}\delta(x)$</i>». Chi lo dimentica si ritrova con un $\hbar$ di troppo o di meno nella funzione di trasformazione, e non riesce a capire perché il suo conto non torni con il libro.</p>
   <p>Nella stessa pagina Picasso dichiara anche il cambio di notazione che adotta d&rsquo;ora in avanti, e che è quello di tutti i libri: «<i>per adeguarci alle notazioni di uso corrente, anche se queste potrebbero talvolta generare qualche confusione, indicheremo con $\varphi(p)$ le funzioni d&rsquo;onda in rappresentazione degli impulsi: useremo quindi lo stesso simbolo $p$ sia per l&rsquo;operatore impulso che per l&rsquo;argomento di $\varphi$</i>». <b>È una confusione dichiarata, non un&rsquo;ambiguità da scoprire</b>, e sapere che il libro la dichiara aiuta a leggere: nello stesso rigo $p$ può essere un operatore e un numero, e il contesto decide.</p>`},
   {label:'Tre dimensioni, e il conto di Ballentine', body:R`
   <p>In tre dimensioni il conto è identico ma la costante cambia esponente, e Ballentine lo fa per esteso nel §5.1. Risolvendo $-i\hbar\nabla\langle x|\hbar k\rangle=\hbar k\langle x|\hbar k\rangle$ si ottiene $\langle x|\hbar k\rangle=c(k)e^{ik\cdot x}$, e imponendo $\langle p|p'\rangle=\delta(p-p')$ si trova $c^{*}(k)c(k')(2\pi)^{3}\delta(k-k')=\delta(\hbar k-\hbar k')$, da cui $c=(2\pi\hbar)^{-3/2}$:</p>
   $$\langle x|\hbar k\rangle=(2\pi\hbar)^{-3/2}e^{ik\cdot x}.$$
   <p>L&rsquo;esponente $-3/2$ invece di $-1/2$ non è una convenzione diversa: <b>è un $(2\pi\hbar)^{-1/2}$ per ogni grado di libertà</b>, perché la funzione di trasformazione a più gradi di libertà è il prodotto di quelle a un grado — che è esattamente ciò che Dirac scrive nella [23.8] e Picasso nella (6.45). Chi ha in mente questo non ha più tre formule da ricordare: ne ha una, con un esponente che conta le dimensioni.</p>`}
  ]},
  {t:'reveal', title:'Il significato fisico, e una frase che vale il capitolo', tag:'esempio', steps:[
   {label:'de Broglie, finalmente capito', body:R`
   <p>Picasso trae dal risultato due conclusioni, e la prima vale per il tono con cui è scritta. In rappresentazione di Schrödinger le autofunzioni dell&rsquo;impulso sono $e^{ik\cdot x}$, «<i>cioè sono onde piane con lunghezza d&rsquo;onda (periodicità spaziale) $\lambda=2\pi\hbar/|p|=h/|p|$, che è proprio la lunghezza d&rsquo;onda di de Broglie per una particella di impulso $p$</i>». E poi:</p>
   <p style="padding-left:1.2em;border-left:3px solid rgba(120,160,255,.45)"><i>&laquo;Finalmente ora si capisce che le onde di de Broglie associate ad una particella sono le funzioni d&rsquo;onda della particella stessa. Esse sono di natura ben diversa dalle onde note in fisica classica, come quelle elettromagnetiche o le onde elastiche. Queste ultime hanno un significato fisico diretto e possono essere misurate punto per punto, mentre le funzioni d&rsquo;onda sono un modo di rappresentare gli stati del sistema.&raquo;</i> &mdash; Picasso, §6.8, pag. stampata 117</p>
   <p>Quel «finalmente» segna un debito pagato: l&rsquo;ipotesi di de Broglie, che nei corsi introduttivi arriva come un postulato con un&rsquo;aria di magia, esce qui come <b>conseguenza</b> di due cose già in piedi — l&rsquo;impulso è il generatore delle traslazioni, dunque una derivazione; le autofunzioni di una derivazione sono esponenziali. La relazione $\lambda=h/p$ non è un&rsquo;intuizione fortunata: è la lettura della periodicità di $e^{ipx/\hbar}$.</p>
   <p>E l&rsquo;avvertenza che segue è la ragione per cui la tappa 10 contiene un esperimento di coincidenza: queste onde <i>non sono misurabili punto per punto</i>, e punto per punto solo $|\psi|^{2}$ ha un significato fisico diretto — «<i>anche se, come sappiamo, $|\psi|^{2}$ non esaurisce tutte le informazioni contenute nella $\psi$</i>».</p>`},
   {label:'L’indeterminazione come teorema su Fourier', body:R`
   <p>La seconda conclusione di Picasso è un cambio di prospettiva che val la pena registrare. Le due rappresentazioni di uno stesso stato sono, a parte il fattore $\hbar$, l&rsquo;una la trasformata di Fourier dell&rsquo;altra; e questo «<i>ci permette di vedere da un nuovo punto di vista la relazione di indeterminazione</i>»: essa diventa «<i>una conseguenza di un teorema sulle trasformate di Fourier</i>», cioè $\Delta x\,\Delta k\ge1/2$.</p>
   <p>Il punto, e Picasso lo mette in chiaro, è che <b>quel teorema non ha niente di quantistico</b>: «<i>è un teorema generale, che trova quindi applicazione non solo in meccanica quantistica, ma in tutti i casi in cui si ha a che fare con fenomeni ondulatori: ottica, acustica ecc.</i>» In ottica $k=2\pi\nu/c$ e lo stesso teorema dà $\Delta x\,\Delta\nu\ge c/(4\pi)$, cioè la relazione fra estensione spaziale di un treno d&rsquo;onde e la sua larghezza di banda: «<i>tanto più il treno d&rsquo;onde è limitato spazialmente, tanto meno esso è monocromatico</i>».</p>
   <p><b>Dove sta allora il contenuto quantistico?</b> In una sola identificazione: $k=p/\hbar$. È quella — e non il teorema di Fourier — a trasformare un fatto sulle onde in un limite su ciò che si può sapere di una particella. Dirac fa esattamente lo stesso cammino nel §24, e lo fa in mezza pagina: analizza un pacchetto d&rsquo;onde di larghezza $\Delta q'$, osserva che le sue componenti di Fourier occupano una banda di larghezza $1/\Delta q'$, e conclude $\Delta q'\Delta p'=h$ — con l&rsquo;avvertenza che «<i>vale solo nel caso più favorevole, che si presenta quando l&rsquo;insieme rappresentativo dello stato considerato sia della forma di un pacchetto d&rsquo;onde. Altre forme degli insiemi rappresentativi porterebbero a un $\Delta q'$ e ad un $\Delta p'$ il cui prodotto risulterebbe maggiore di $h$.</i>»</p>`},
   {label:'Perché un autostato dell’impulso non si può preparare', body:R`
   <p>Dirac chiude il §24 con un argomento che è fisico e non matematico, e che completa la tappa 01 da un&rsquo;altra direzione. Dalla funzione di trasformazione segue che $|\langle q'|p'\rangle|^{2}dq'$ — la probabilità che $q$ cada fra $q'$ e $q'+dq'$ nello stato in cui $p$ vale esattamente $p'$ — «<i>è indipendente da $q'$ per un dato $dq'$</i>», perché il modulo quadro dell&rsquo;esponenziale è costante. Quindi: «<i>se $p$ ha con certezza un valore ben definito $p'$, tutti i valori di $q$ sono equiprobabili</i>», e simmetricamente.</p>
   <p>E allora: «<i>Dal punto di vista fisico è evidente che uno stato per cui tutti i valori di $q$ siano equiprobabili, oppure uno per cui tali risultino tutti quelli di $p$, non può essere ottenuto in pratica: nel primo caso per limitazioni di spazio, e nel secondo per limitazioni di energia.</i>»</p>
   <p>Si guardi la struttura dell&rsquo;argomento, perché è elegante e si usa raramente così. <b>Il fatto che l&rsquo;autostato non sia normalizzabile e il fatto che non sia preparabile sono la stessa cosa vista due volte.</b> Non normalizzabile significa: $|\psi|^{2}$ ha integrale infinito, cioè la distribuzione è uniforme su tutto l&rsquo;asse. Non preparabile significa: per avere una particella equidistribuita su tutto l&rsquo;asse servirebbe uno spazio infinito. La matematica e il laboratorio dicono la stessa frase in due lingue — ed è questo che rende gli autovettori impropri un&rsquo;idealizzazione <i>legittima</i> e non un errore: sono il limite di qualcosa che si può fare meglio e meglio, come la tappa 07 rende preciso.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`La funzione di trasformazione è stata ricavata usando il fatto che l&rsquo;impulso agisce come $-i\hbar\,\partial/\partial x$. Non è circolare, dato che quella forma si deduce di solito dalla trasformata di Fourier?`,
    a:R`Non è circolare, ma la domanda individua un punto reale e la risposta dipende da come il corso è costruito. In questa impostazione — che è quella del programma di questo corso e del capitolo 3 di Ballentine — la forma $-i\hbar\nabla$ <b>non</b> viene da Fourier: viene dal ruolo di $P$ come generatore delle traslazioni, cioè dalle simmetrie dello spazio, e la tappa 06 lo deriva. Quindi l&rsquo;ordine logico è: simmetrie $\to$ forma dell&rsquo;operatore impulso $\to$ equazione differenziale $\to$ funzione di trasformazione $\to$ Fourier come <i>conseguenza</i>. L&rsquo;impostazione circolare esiste, ed è quella dei corsi che postulano $p\to-i\hbar\partial_x$ per analogia con l&rsquo;onda di de Broglie: lì la relazione di de Broglie è un&rsquo;ipotesi, non un risultato, e Picasso non potrebbe scrivere «finalmente ora si capisce». Ballentine dichiara di volere esattamente questo nella sua prefazione, sostituendo «the heuristic but inconclusive arguments based upon analogy and wave-particle duality».`},
   {q:R`Dirac fissa la costante con un argomento di simmetria fra $q$ e $p$, Picasso con la normalizzazione alla $\delta$. Danno lo stesso risultato per caso?`,
    a:R`No, e capire perché chiarisce entrambe le strade. Le due condizioni non sono indipendenti: la simmetria $q\leftrightarrow p$, $i\to-i$ che Dirac usa è una proprietà delle relazioni di commutazione, e le relazioni di commutazione sono ciò che determina lo spettro e la normalizzazione di entrambe le basi. In altri termini, Dirac sfrutta il fatto che il problema <i>è</i> simmetrico nelle due variabili e deduce che la costante non può distinguerle; Picasso impone la normalizzazione su una base e trova una costante che, a conti fatti, risulta simmetrica. La prima strada spiega <b>perché</b> la costante debba essere quella, la seconda <b>la calcola</b>. La prima è più profonda, la seconda si rifà sotto esame in tre righe — e questo è il motivo per cui questo movimento le riporta entrambe invece di scegliere.`},
   {q:R`Se $\langle x|p\rangle$ è contemporaneamente la funzione di trasformazione e l&rsquo;autofunzione impropria dell&rsquo;impulso, c&rsquo;è un&rsquo;asimmetria: anche $\langle p|x\rangle$ dovrebbe essere l&rsquo;autofunzione impropria della posizione in rappresentazione degli impulsi. Lo è?`,
    a:R`Sì, ed è una simmetria perfetta che vale esplicitare perché nessun libro la scrive. $\langle p|x'\rangle=\langle x'|p\rangle^{*}=(2\pi\hbar)^{-1/2}e^{-ipx'/\hbar}$ è, letta come funzione di $p$, l&rsquo;autofunzione dell&rsquo;operatore posizione nella rappresentazione degli impulsi — con autovalore $x'$. E si verifica direttamente con la forma $Q=i\hbar\,\partial/\partial p$ della tappa 05: $i\hbar\,\partial_p\,e^{-ipx'/\hbar}=x'\,e^{-ipx'/\hbar}$. Quindi <b>l&rsquo;autofunzione impropria della posizione non è una $\delta$: è un&rsquo;onda piana</b> — purché si guardi nella rappresentazione giusta. La $\delta$ compare quando si guarda l&rsquo;autofunzione della posizione nella rappresentazione delle coordinate, cioè nella base dell&rsquo;operatore stesso, dove qualunque autofunzione è concentrata. La morale, che serve ogni volta che un conto sembra asimmetrico: $q$ e $p$ sono perfettamente simmetrici, e tutta l&rsquo;asimmetria apparente sta nel fatto che si sceglie quasi sempre la rappresentazione delle coordinate.`}
  ]}
]},

/* ---------------- 05 · LE DUE RAPPRESENTAZIONI AL LAVORO ---------------- */
{ num:'05', title:'Le due rappresentazioni al lavoro, e la gaussiana che le attraversa', meta:'x e p scambiati di ruolo · il commutatore canonico verificato in entrambe · la gaussiana e la sua trasformata · lo scambio di larghezza',
  blocchi:[
  {t:'prosa', title:'Due descrizioni dello stesso stato, e nessuna delle due è privilegiata', tag:'costruzione', html:R`
  <p>Con la funzione di trasformazione in mano, le due rappresentazioni sono montate e si può lavorare in entrambe. La simmetria è completa, e vale metterla in tabella mentale: nella rappresentazione delle coordinate $Q$ moltiplica e $P$ deriva; nella rappresentazione degli impulsi $P$ moltiplica e $Q$ deriva. Ballentine scrive la seconda metà nella (5.6):</p>
  $$Q_\alpha=i\frac{\partial}{\partial k_\alpha}=i\hbar\frac{\partial}{\partial p_\alpha},$$
  <p>e la deriva in due righe: $\langle\hbar k|Q_\alpha|\Psi\rangle=(2\pi\hbar)^{-3/2}\int e^{-ik\cdot x}x_\alpha\Psi(x)\,d^3x$, e il fattore $x_\alpha$ dentro l&rsquo;integrale di Fourier si ottiene derivando l&rsquo;esponenziale rispetto a $k_\alpha$ e moltiplicando per $i$.</p>
  <p><b>Il segno, che è l&rsquo;unica cosa da ricordare.</b> $P=-i\hbar\,\partial/\partial x$ ha il meno, $Q=+i\hbar\,\partial/\partial p$ non ce l&rsquo;ha. Non è una convenzione arbitraria: è obbligata dal commutatore, e il modo di verificarlo è farlo in entrambe le rappresentazioni, che è il passo successivo. Chi ricorda il segno sbagliato trova $[q,p]=-i\hbar$ e resta con un&rsquo;incoerenza che non riesce a localizzare.</p>
  <p>Picasso dice la stessa cosa con un&rsquo;osservazione che è un invito a cambiare abitudine: «<i>la rappresentazione degli impulsi è un modo altrettanto valido di rappresentare gli stati del sistema</i>». Il privilegio della rappresentazione delle coordinate è storico e pratico, non teorico — e la tappa 10 porta un caso in cui la rappresentazione degli impulsi è quella che si <i>misura</i>.</p>`},
  {t:'reveal', title:'Il commutatore canonico, verificato nelle due rappresentazioni', tag:'costruzione', steps:[
   {label:'In rappresentazione delle coordinate', body:R`
   <p>Si applica il commutatore a una funzione d&rsquo;onda generica $\psi$, usando la regola di Leibniz sul secondo termine:</p>
   $$[x,p]\,\psi=x\Big(-i\hbar\frac{d\psi}{dx}\Big)+i\hbar\frac{d(x\psi)}{dx}=i\hbar\,\psi.$$
   <p>Il meccanismo è trasparente: $d(x\psi)/dx=\psi+x\,d\psi/dx$, e il secondo addendo cancella esattamente il primo termine. <b>Ciò che resta è il pezzo prodotto dalla <span class="str" data-str="derivazione">derivazione</span> della variabile stessa</b>, e questo spiega perché $[x,p]$ sia un numero e non un operatore: deriva $x$ rispetto a $x$, che fa $1$.</p>
   <p>Si noti che la verifica è su $\psi$ <i>arbitraria</i> — dichiarata come funzione generica e non come espressione particolare — ed è quello che rende l&rsquo;identità un&rsquo;identità fra operatori.</p>`},
   {label:'In rappresentazione degli impulsi, dove i ruoli sono scambiati', body:R`
   <p>Ora lo stesso conto nell&rsquo;altra rappresentazione, dove $p$ moltiplica e $q=i\hbar\,\partial/\partial p$ deriva:</p>
   $$[q,p]\,\varphi=i\hbar\frac{\partial(p\varphi)}{\partial p}-p\,i\hbar\frac{\partial\varphi}{\partial p}=i\hbar\,\varphi.$$
   <p>Stesso risultato, e si vede da dove viene il segno. Qui l&rsquo;operatore che deriva è il <i>primo</i> del commutatore, non il secondo: nella rappresentazione delle coordinate il termine superstite viene dal secondo addendo con il suo $+i\hbar$; qui viene dal primo addendo con il suo $+i\hbar$. Se $Q$ avesse il meno, come $P$, il risultato sarebbe $-i\hbar$ e le due rappresentazioni descriverebbero teorie diverse.</p>
   <p><b>Questa è la verifica che chiude il cerchio della tappa 04.</b> La funzione di trasformazione è stata ricavata imponendo che $P$ derivi e la normalizzazione alla $\delta$; se i segni fossero incoerenti, il commutatore canonico non sopravvivrebbe al cambio di base. Il fatto che sopravviva non è automatico — è la <i>conferma</i> che la trasformazione è unitaria, cioè che le due descrizioni sono la stessa fisica in due linguaggi.</p>`}
  ]},
  {t:'reveal', title:'La gaussiana, calcolata in entrambe le rappresentazioni', tag:'esempio', steps:[
   {label:'In x: normalizzazione e larghezza', body:R`
   <p>Serve un esempio concreto su cui vedere la trasformazione al lavoro, e la scelta obbligata è la gaussiana — perché è l&rsquo;unica funzione che si trasforma in sé stessa, e perché è lo stato che satura la relazione di indeterminazione. Si prenda</p>
   $$\psi(x)=\frac{1}{(2\pi\sigma^{2})^{1/4}}\,e^{-x^{2}/4\sigma^{2}},$$
   <p>normalizzata in modo che $|\psi|^{2}$ sia la gaussiana di densità di varianza $\sigma^{2}$. Le due verifiche sono <span class="str" data-str="integrale-gaussiano">integrali gaussiani</span> elementari:</p>
   $$\int_{-\infty}^{+\infty}\frac{1}{\sqrt{2\pi\sigma^{2}}}\,e^{-x^{2}/2\sigma^{2}}\,dx=1,$$
   $$\langle x^{2}\rangle=\int_{-\infty}^{+\infty}x^{2}\,\frac{1}{\sqrt{2\pi\sigma^{2}}}\,e^{-x^{2}/2\sigma^{2}}\,dx=\sigma^{2}.$$
   <p>Quindi $\Delta x=\sigma$, dato che il valor medio di $x$ è nullo per parità. Fin qui non c&rsquo;è niente di quantistico: è una distribuzione di probabilità gaussiana con la sua deviazione standard.</p>`},
   {label:'In p: il conto, e il risultato notevole', body:R`
   <p>Si applica la funzione di trasformazione. L&rsquo;integrale è quello di una gaussiana contro un esponenziale immaginario, e si fa completando il quadrato:</p>
   $$\varphi(p)=\frac{1}{\sqrt{2\pi\hbar}}\int_{-\infty}^{+\infty}e^{-ipx/\hbar}\,\psi(x)\,dx=\frac{2^{1/4}\sqrt{\sigma}}{\pi^{1/4}\sqrt{\hbar}}\,e^{-p^{2}\sigma^{2}/\hbar^{2}}.$$
   <p>Il risultato è <b>un&rsquo;altra gaussiana</b>, e questa è la proprietà che rende la gaussiana speciale. Per leggerla, conviene riscriverla nella stessa forma di $\psi$ con una larghezza $\sigma_p$ da identificare: confrontando gli esponenti, $p^{2}\sigma^{2}/\hbar^{2}=p^{2}/4\sigma_p^{2}$ dà $\sigma_p=\hbar/(2\sigma)$. E la verifica della normalizzazione, calcolata per intero:</p>
   $$\int_{-\infty}^{+\infty}|\varphi(p)|^{2}\,dp=\frac{\sqrt2\,\sigma^{1/2}}{\sqrt\pi\,\hbar^{1/2}}\cdot\frac{2\sqrt\pi\,\hbar^{1/2}}{2\sqrt2\,\sigma^{1/2}}=1,$$
   <p>dove il primo fattore è il modulo quadro del coefficiente e il secondo è l&rsquo;integrale della gaussiana di esponente $2p^{2}\sigma^{2}/\hbar^{2}$. <b>La normalizzazione si conserva</b> — ed era dovuto, perché la trasformazione è unitaria, ma vederlo tornare su un caso concreto è il modo di accorgersi se una costante è sbagliata.</p>`},
   {label:'Il prodotto, e che cosa dice la relazione fra le due larghezze', body:R`
   <p>Da $\sigma_p=\hbar/(2\sigma)$ segue $\Delta p^{2}=\hbar^{2}/(4\sigma^{2})$, e quindi</p>
   $$\Delta x\,\Delta p=\sqrt{\sigma^{2}}\cdot\sqrt{\frac{\hbar^{2}}{4\sigma^{2}}}=\frac{\hbar}{2}.$$
   <p>Il prodotto <b>non dipende da $\sigma$</b>: la gaussiana satura la relazione di indeterminazione per <i>ogni</i> larghezza. Ma il punto di questa tappa non è la saturazione — è la <b>struttura della dipendenza</b>: $\sigma_p=\hbar/(2\sigma)$ è una relazione di proporzionalità inversa, e dice che le due descrizioni dello stesso stato sono rigidamente accoppiate. Stringere $\psi$ allarga $\varphi$ esattamente nella stessa proporzione.</p>
   <p>E qui si vede perché il teorema di Fourier citato nella tappa 04 non sia una curiosità: la relazione $\sigma\sigma_p=\hbar/2$ <b>non viene dalla meccanica quantistica</b>, viene dal fatto che le due funzioni sono trasformate di Fourier l&rsquo;una dell&rsquo;altra. L&rsquo;unico ingrediente quantistico è il $\hbar$, che entra attraverso l&rsquo;identificazione $k=p/\hbar$: senza di lui l&rsquo;identità sarebbe $\sigma\sigma_k=1/2$, una proprietà della trasformata di Fourier che un ingegnere delle telecomunicazioni usa per calcolare una larghezza di banda.</p>`}
  ]},
  {t:'plot', title:'Lo scambio di larghezza, visto nelle due rappresentazioni',
   intro:R`<p>Le densità $|\psi(x)|^{2}$ e $|\varphi(p)|^{2}$ per tre valori di $\sigma$, in unità $\hbar=1$. Lo stato è lo stesso, descritto nei due linguaggi.</p>`,
   plots:[{kind:'func2d', xr:[-4,4], yr:[0,1.7], height:230, ticks:true,
     title:'in rappresentazione delle coordinate: |ψ(x)|²',
     curves:[{f:'Math.exp(-x*x/2)/Math.sqrt(2*Math.PI)', col:'#5aa9ff', width:2, label:'σ = 1'},
             {f:'2*Math.exp(-2*x*x)/Math.sqrt(2*Math.PI)', col:'#ffc24a', width:2, label:'σ = 1/2'},
             {f:'4*Math.exp(-8*x*x)/Math.sqrt(2*Math.PI)', col:'#ff6b8a', width:2, label:'σ = 1/4'}],
     xlabel:'x', ylabel:'|ψ|²'},
    {kind:'func2d', xr:[-4,4], yr:[0,1.7], height:230, ticks:true,
     title:'in rappresentazione degli impulsi: |φ(p)|², con σₚ = 1/(2σ)',
     curves:[{f:'2*Math.exp(-2*x*x)/Math.sqrt(2*Math.PI)', col:'#5aa9ff', width:2, label:'σ = 1 → σₚ = 1/2'},
             {f:'Math.exp(-x*x/2)/Math.sqrt(2*Math.PI)', col:'#ffc24a', width:2, label:'σ = 1/2 → σₚ = 1'},
             {f:'0.5*Math.exp(-x*x/8)/Math.sqrt(2*Math.PI)', col:'#ff6b8a', width:2, label:'σ = 1/4 → σₚ = 2'}],
     xlabel:'p', ylabel:'|φ|²'}],
   leggi:R`<p><b>Che cosa guardare.</b> I colori si scambiano di posto. La curva blu è la più larga in $x$ e la più stretta in $p$; la rossa il contrario. E non è una somiglianza qualitativa: la curva gialla in alto e la blu in basso sono <i>la stessa curva</i>, perché $\sigma=1/2$ in posizione dà $\sigma_p=1$ in impulso, e $\sigma=1$ dà $\sigma_p=1/2$.</p>
   <p><b>Che cosa impararne.</b> Lo stato è uno; le due curve sono due letture. Il prodotto delle larghezze di una colonna con l&rsquo;altra è sempre $1/2$ in queste unità — cioè $\hbar/2$ — e il disegno lo rende visibile come un bilancio: tutta l&rsquo;area che si guadagna in concentrazione a sinistra si perde a destra. La cosa importante da non confondere: <b>non è che misurare la posizione disturbi l&rsquo;impulso.</b> Qui non c&rsquo;è nessuna misura e nessun disturbo — c&rsquo;è un solo stato, preparato una volta, descritto da due funzioni che sono legate da una trasformata di Fourier. Lo scambio di larghezza è una proprietà della coppia di funzioni, non il resoconto di un esperimento.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`La gaussiana si trasforma in sé stessa. Esiste uno stato la cui descrizione in $x$ e in $p$ sia <i>identica</i>, non solo della stessa forma?`,
    a:R`Sì, e si trova imponendo $\sigma=\sigma_p$, cioè $\sigma=\hbar/(2\sigma)$, da cui $\sigma=\sqrt{\hbar/2}$. Con quella larghezza le due densità sono numericamente la stessa funzione del rispettivo argomento. Non è una curiosità: è lo stato fondamentale di un oscillatore armonico con $m\omega=1$ in unità opportune, ed è il motivo per cui nell&rsquo;oscillatore armonico le variabili adimensionali $\xi=x\sqrt{m\omega/\hbar}$ e $\pi=p/\sqrt{m\omega\hbar}$ compaiono in forma simmetrica. La lezione generale è che la «simmetria fra $q$ e $p$» di cui parlava Dirac nella tappa 04 non è solo formale: ci sono stati che la realizzano, e sono quelli che l&rsquo;oscillatore armonico produce naturalmente.`},
   {q:R`Nel calcolo di $\varphi(p)$ si è usata la funzione di trasformazione con il fattore $(2\pi\hbar)^{-1/2}$. Se si usasse la convenzione della trasformata di Fourier «pura», con $(2\pi)^{-1/2}$ e variabile $k$, che cosa cambierebbe?`,
    a:R`Cambierebbe il significato della funzione, non il risultato fisico, e la differenza è esattamente il fattore $\hbar$ della tappa 04. Picasso lo registra nella (6.47): se $\hat\psi$ è la trasformata di Fourier ordinaria di $\psi$, allora $\varphi(p)=\hbar^{-1/2}\hat\psi(p/\hbar)$. Il punto è <i>che cosa</i> si vuole che sia normalizzato: $|\varphi(p)|^{2}dp$ deve essere una probabilità in $dp$, quindi $\varphi$ ha dimensioni di $(\text{impulso})^{-1/2}$, mentre $\hat\psi$ ha dimensioni di $(\text{lunghezza})^{1/2}$. Il fattore $\hbar^{-1/2}$ è il cambio di unità. In pratica: se un conto produce una probabilità maggiore di uno o un&rsquo;espressione dimensionalmente sbagliata, il sospetto numero uno è un $\hbar$ mancante in questo passaggio.`},
   {q:R`Si è verificato il commutatore canonico in due rappresentazioni e si è trovato lo stesso risultato. Era scontato?`,
    a:R`Non era scontato, ed è il punto della verifica. Un cambio di base <i>unitario</i> conserva i commutatori — se $U$ è unitario, $[UAU^{-1},UBU^{-1}]=U[A,B]U^{-1}$ — e quindi il risultato era obbligato <b>a condizione che la trasformazione fosse unitaria</b>. Ed è proprio quella condizione che il conto controlla: la funzione di trasformazione è stata costruita imponendo la normalizzazione alla $\delta$, cioè imponendo che i prodotti scalari si conservino, cioè l&rsquo;unitarietà. Se ci fosse un errore nel coefficiente o nel segno dell&rsquo;esponente, la trasformazione non sarebbe unitaria e il commutatore non sopravviverebbe. Quindi la verifica non è ridondante: è un <span class="str" data-str="operatore-unitario">test di unitarietà</span> fatto su un caso in cui il risultato è noto, che è il modo standard di collaudare un cambio di base.`}
  ]}
]},

/* ---------------- 06 · PERCHE L'IMPULSO E UNA DERIVAZIONE, E DOVE SMETTE DI ESSERLO ---------------- */
{ num:'06', title:'Perché l’impulso è una derivazione, e dove quella forma smette di valere', meta:'il generatore delle traslazioni · il confronto con Taylor · la famiglia di operatori che soddisfa il commutatore · il momento radiale',
  blocchi:[
  {t:'prosa', title:'Una formula che si impara come se fosse un postulato, e non lo è', tag:'costruzione', html:R`
  <p>Tutto quello che è stato fatto dalla tappa 04 in poi poggia su un fatto usato e non dimostrato: che l&rsquo;operatore impulso, in rappresentazione delle coordinate, sia $-i\hbar\,\partial/\partial x$. Nella maggior parte dei corsi quella formula arriva come un postulato, giustificata per analogia con l&rsquo;onda di de Broglie — e la tappa 04 ha mostrato che l&rsquo;analogia, in quest&rsquo;ordine, è circolare. Questo corso è costruito diversamente, e Ballentine dichiara il programma nella prefazione: le <span class="str" data-str="simmetrie">simmetrie</span> dello spazio-tempo si sfruttano «<i>in order to derive the fundamental operators for momentum, angular momentum, and the Hamiltonian</i>», sostituendo «<i>the heuristic but inconclusive arguments based upon analogy and wave-particle duality</i>».</p>
  <p>Questa tappa fa due cose, e la seconda è più rara della prima. La prima: deriva la forma dell&rsquo;operatore impulso dal suo ruolo di generatore delle traslazioni, in quattro righe. La seconda: mostra <b>dove quella forma smette di valere</b>, e perché — ed è l&rsquo;avvertenza che Ballentine dà a pag. stampata 98 e che quasi nessun altro libro mette, nonostante sia la causa di una classe intera di errori nei conti in coordinate sferiche.</p>
  <p>Un prestito dichiarato: il fatto che $P$ sia il generatore delle traslazioni <i>si assume qui</i>. La sua derivazione dalle simmetrie dello spazio-tempo è il capitolo 3 di Ballentine, cioè un altro lavoro intero, e fingere di ricavarla in una tappa sarebbe barare. Quello che si ricava qui è la <i>conseguenza</i>: dato quel ruolo, la forma dell&rsquo;operatore è forzata.</p>`},
  {t:'reveal', title:'La derivazione, in quattro righe', tag:'costruzione', steps:[
   {label:'L’ipotesi: che cosa significa «generatore»', body:R`
   <p>L&rsquo;ipotesi è la (3.40) di Ballentine: l&rsquo;operatore unitario che trasla di $a$ è l&rsquo;esponenziale dell&rsquo;impulso,</p>
   $$e^{-ia\cdot P/\hbar}|x\rangle=|x+a\rangle.$$
   <p>Si legga che cosa dice: applicare quell&rsquo;operatore a un autostato della posizione centrato in $x$ dà quello centrato in $x+a$. L&rsquo;impulso <i>è</i> l&rsquo;oggetto che genera gli spostamenti, e la costante $\hbar$ compare per ragioni dimensionali — l&rsquo;esponente di un esponenziale deve essere un numero, e $a\cdot P$ ha le dimensioni di un&rsquo;azione.</p>
   <p>Che l&rsquo;operatore sia <span class="str" data-str="operatore-unitario">unitario</span> è essenziale e non casuale: una traslazione non cambia la norma di uno stato, quindi l&rsquo;operatore che la realizza conserva i prodotti scalari. E un operatore unitario della forma $e^{iA}$ ha $A$ autoaggiunto: è per questo che l&rsquo;impulso, generatore di una simmetria, è automaticamente un&rsquo;osservabile.</p>`},
   {label:'Il confronto con Taylor', body:R`
   <p>Si proietta la relazione su un generico stato e si sviluppa l&rsquo;esponenziale al primo ordine in $a$. A sinistra:</p>
   $$\langle x+a|\psi\rangle=\Big\langle x\Big|\Big(1+\frac{i}{\hbar}a\cdot P\Big)\Big|\psi\Big\rangle+O(a^{2}),$$
   <p>dove il segno dell&rsquo;esponente cambia passando dal ket al bra. Usando la regola $A\psi(x)=\langle x|A|\psi\rangle$ questo diventa $\psi(x)+(i/\hbar)(a\cdot P)\psi(x)+O(a^{2})$. A destra, il primo membro è semplicemente la funzione valutata nel punto traslato, che si sviluppa in serie di Taylor:</p>
   $$\psi(x+a)=\psi(x)+a\,\frac{d\psi}{dx}+O(a^{2}).$$
   <p>I due sviluppi devono coincidere termine a termine per $a$ arbitrario. Confrontando i coefficienti di $a$: $(i/\hbar)P\psi=d\psi/dx$, cioè</p>
   $$P=-i\hbar\nabla,\qquad P_\alpha=-i\hbar\frac{\partial}{\partial x_\alpha}.$$
   <p><b>Dove sta il contenuto.</b> Non nel calcolo — sono due sviluppi al primo ordine — ma nel fatto che <i>la derivata compare da sé</i>. La traslazione infinitesima di una funzione è, per definizione di derivata, la funzione più la sua derivata per lo spostamento; e se l&rsquo;impulso genera le traslazioni, l&rsquo;impulso deve <i>essere</i> quella derivata, a meno della costante che aggiusta le dimensioni e dell&rsquo;$i$ che lo rende autoaggiunto. Il $-i\hbar$ non è una scelta: è ciò che resta quando si impone che un generatore di simmetria sia un&rsquo;osservabile.</p>`}
  ]},
  {t:'reveal', title:'La famiglia di operatori che il commutatore non distingue', tag:'costruzione', steps:[
   {label:'Il commutatore non basta a fissare la forma', body:R`
   <p>Qui arriva l&rsquo;osservazione di Ballentine che vale l&rsquo;intera tappa, e che è il motivo per cui la derivazione dalle simmetrie <i>serve</i> invece di essere un lusso di rigore. Si consideri la famiglia di operatori</p>
   $$P_x=-i\hbar\,[g(x)]^{-1}\frac{\partial}{\partial x}\,g(x)$$
   <p>con $g$ funzione arbitraria non nulla. Ciascuno di questi soddisfa la relazione di commutazione canonica — e il conto lo verifica per <i>ogni</i> $g$, dichiarata come funzione generica:</p>
   $$\Big[x,\,-i\hbar\,g(x)^{-1}\frac{\partial}{\partial x}g(x)\Big]\psi=i\hbar\,\psi\qquad\text{per ogni }g.$$
   <p>Il meccanismo: la coniugazione con $g$ non tocca la moltiplicazione per $x$ — perché $g$ e $x$ commutano, essendo entrambi moltiplicazioni — e il termine superstite della regola di Leibniz è sempre lo stesso.</p>
   <p><b>Conseguenza, e va detta chiaramente: la relazione $[x,P_x]=i\hbar$ NON determina l&rsquo;operatore impulso.</b> Lo determina a meno di un&rsquo;intera famiglia di coniugazioni. Chi crede che $-i\hbar\partial_x$ sia «la» soluzione del commutatore canonico sta usando un&rsquo;informazione in più senza accorgersene — e quando il problema cambia coordinate, quell&rsquo;informazione in più non c&rsquo;è.</p>`},
   {label:'Che cosa seleziona g = 1', body:R`
   <p>La selezione viene dalla simmetria, e l&rsquo;argomento di Ballentine è di una riga: «<i>the space is invariant under the displacement $x\to x+a$, and so the generator $P_x$ of that transformation should also be form-invariant under $x\to x+a$. Hence we must take $g(x)=1$.</i>»</p>
   <p>Si sviluppi il ragionamento, perché è compresso. Se $P_x$ genera le traslazioni e lo spazio è omogeneo, allora l&rsquo;espressione di $P_x$ non può dipendere dall&rsquo;origine scelta: traslando il sistema di riferimento, la formula dev&rsquo;essere la stessa. Ma $g(x)$ è una funzione del punto, e traslando diventa $g(x+a)$: l&rsquo;unica $g$ che resta sé stessa sotto ogni traslazione è una costante, e una costante nella coniugazione si cancella.</p>
   <p><b>Quindi $g=1$ viene dall&rsquo;omogeneità dello spazio.</b> È il punto in cui una proprietà fisica — lo spazio è uguale in ogni punto — entra nella forma di un operatore. Si confronti con il collaudo della tappa 03: là l&rsquo;invarianza per traslazione era una proprietà dello <i>spazio delle funzioni</i> e non portava fisica; qui è una proprietà dello <i>spazio</i>, ed è un&rsquo;ipotesi fisica che si potrebbe violare — in un cristallo, per esempio, lo spazio non è omogeneo e la fisica cambia.</p>`},
   {label:'Dove la forma semplice smette di valere: il momento radiale', body:R`
   <p>E ora la conseguenza pratica, che è il motivo per cui questa tappa esiste. Ballentine la dichiara in una frase: «<i>The momentum conjugate to an arbitrary generalized coordinate $q$ is, in general, not represented by $-i\hbar\,\partial/\partial q$.</i>»</p>
   <p>L&rsquo;esempio è il momento radiale. Esprimendo $P\cdot P=-\hbar^{2}\nabla^{2}$ in coordinate sferiche si ottiene la decomposizione</p>
   $$P\cdot P=(P_r)^{2}+\frac{L^{2}}{r^{2}},$$
   <p>e l&rsquo;operatore $P_r$ che compare <b>non</b> è $-i\hbar\,\partial/\partial r$: è</p>
   $$P_r\psi=-i\hbar\,\frac{1}{r}\frac{\partial}{\partial r}\big(r\psi\big)=-i\hbar\Big(\frac{\partial\psi}{\partial r}+\frac{\psi}{r}\Big),$$
   <p>cioè esattamente un membro della famiglia con $g(r)=r$. Il termine $\psi/r$ in più non è un dettaglio: elevando al quadrato,</p>
   $$(P_r)^{2}\psi=-\hbar^{2}\Big(\frac{\partial^{2}\psi}{\partial r^{2}}+\frac{2}{r}\frac{\partial\psi}{\partial r}\Big)$$
   <p>e questo è il laplaciano radiale corretto. Con la forma ingenua $-i\hbar\partial_r$ si otterrebbe solo la derivata seconda, e mancherebbe il termine $2\psi'/r$ — cioè si sbaglierebbe l&rsquo;energia cinetica radiale, e con essa ogni problema a simmetria sferica, atomo di idrogeno compreso.</p>
   <p><b>E la ragione per cui qui $g=1$ non si può imporre</b> è la frase di Ballentine che chiude il paragrafo, e che è il tipo di osservazione per cui si apre un libro: «<i>for the radial coordinate $r$ the transformation $r\to r+a$ is not a symmetry of space, since it would tear a hole at the origin.</i>» La traslazione radiale non è una simmetria perché <i>strapperebbe un buco nell&rsquo;origine</i>. Niente simmetria, niente argomento di invarianza di forma, niente $g=1$ — e la forma dell&rsquo;operatore va determinata altrimenti, cioè dalla decomposizione del laplaciano.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Se $-i\hbar\,\partial/\partial q$ non vale per una coordinata generalizzata, come si trova l&rsquo;operatore giusto in un sistema di coordinate curvilinee?`,
    a:R`Non c&rsquo;è una ricetta universale, e questo è il motivo per cui la questione è delicata. Due strade pratiche. La prima è quella che Ballentine usa: scrivere l&rsquo;operatore <i>scalare</i> $P\cdot P=-\hbar^{2}\nabla^{2}$ nelle coordinate volute — e il laplaciano in coordinate curvilinee è un oggetto geometrico ben definito, che si calcola dalla metrica — e poi <i>leggere</i> quali operatori compaiono. La seconda è imporre che l&rsquo;operatore sia autoaggiunto rispetto alla misura giusta: in coordinate sferiche l&rsquo;elemento di volume è $r^{2}dr\,d\Omega$, e $-i\hbar\partial_r$ <b>non</b> è autoaggiunto rispetto a $r^{2}dr$, mentre $-i\hbar\,r^{-1}\partial_r\,r$ lo è. La seconda strada spiega anche <i>perché</i> la coniugazione con $g$ sia esattamente la libertà residua: cambiare $g$ equivale a cambiare la misura rispetto a cui si chiede l&rsquo;autoaggiunzione, e la misura la fissa la geometria. Morale operativa: in coordinate non cartesiane non si traduce mai $p\to-i\hbar\partial$ a mano — si parte dal laplaciano.`},
   {q:R`La derivazione usa il generatore delle traslazioni, che è un postulato preso da un altro capitolo. In che senso questa è meglio dell&rsquo;analogia con de Broglie, che è anch&rsquo;essa un postulato?`,
    a:R`La differenza sta in <i>che cosa</i> si postula e quanto rende. Postulare $p\to-i\hbar\partial_x$ per analogia con de Broglie significa assumere direttamente la cosa che serve, e non dà niente di più: non dice perché quella forma e non un&rsquo;altra della famiglia con $g$ arbitraria, non dice che cosa succede in coordinate sferiche, e non si estende al momento angolare o all&rsquo;hamiltoniana se non con nuove analogie. Postulare che le simmetrie dello spazio-tempo abbiano generatori autoaggiunti è un&rsquo;assunzione <b>sola</b>, che è il teorema di Noether in veste quantistica, e da lei si ricavano l&rsquo;impulso (traslazioni), il momento angolare (rotazioni) e l&rsquo;hamiltoniana (traslazioni temporali) — più la selezione di $g=1$, più l&rsquo;avvertenza sul caso radiale. Un postulato che produce tre operatori e due avvertenze è migliore di tre postulati per analogia: non perché sia più sicuro, ma perché è più <i>vincolante</i>, e un&rsquo;ipotesi che vincola si può smentire.`},
   {q:R`L&rsquo;operatore $P_r$ ha uno spettro? Se sì, è un&rsquo;osservabile come $P_x$?`,
    a:R`È una domanda su cui vale la pena essere espliciti, perché la risposta è no e la ragione è un bel esempio del materiale di questo movimento. L&rsquo;operatore $P_r$ agisce sul semiasse $r>0$, e il fatto che il dominio sia un semiasse e non una retta cambia tutto: non esiste alcuna estensione autoaggiunta di $-i\hbar\,r^{-1}\partial_r r$ su $[0,\infty)$ con condizioni al contorno ragionevoli, perché l&rsquo;operatore genererebbe traslazioni che portano fuori dal semiasse — che è precisamente il «buco nell&rsquo;origine» di Ballentine letto dal lato degli operatori. Quindi $P_r$ è un oggetto utile nei conti e <b>non</b> un&rsquo;osservabile: non esiste un apparato che misuri «l&rsquo;impulso radiale», e non esiste una sua base di autovettori impropri. È lo stesso tipo di guasto che von Neumann descrive a pag. stampata 108 parlando degli operatori per cui il problema agli autovalori è insolubile anche dopo ogni estensione — e che dichiara doversi «<i>eliminare per il momento dalle considerazioni quantomeccaniche</i>». Qui si vede un caso concreto in cui quell&rsquo;avvertenza morde.`}
  ]}
]},

/* ---------------- 07 · IL TEOREMA SPETTRALE COMPLETATO ---------------- */
{ num:'07', title:'Il teorema spettrale completato, e gli autostati approssimati resi precisi', meta:'i tre assiomi della famiglia di proiettori · l’integrale che von Neumann dichiara privo di senso · il caso finito, dove si vede il meccanismo · la convergenza che rende legittimi gli autostati approssimati',
  blocchi:[
  {t:'prosa', title:'La parte che resta vera, promessa dalla tappa 01', tag:'costruzione', html:R`
  <p>La tappa 01 aveva lasciato in sospeso una frase: «la parte che resta vera è la decomposizione in <span class="str" data-str="proiettore-ortogonale">proiettori</span>, e si vedrà nella tappa 07». È il momento di consegnarla. von Neumann ha dimostrato che l’equazione</p>
  $$H\varphi=\lambda\varphi$$
  <p>non ha, in generale, abbastanza soluzioni in $\mathcal H$ da formare una base. La mossa che segue, a pag. stampata 68, non è un tentativo di salvare l’equazione: è sostituirla. «<i>Il nostro prossimo problema, visto che $E$ ha fallito, è trovare una formulazione migliorata del problema agli autovalori per operatori hermitiani</i>», seguendo «<i>un modello fissato da Hilbert</i>». La formulazione migliorata non parla più di vettori: parla di una famiglia di <span class="str" data-str="operatore-aggiunto">proiettori</span> ortogonali, uno per ogni numero reale.</p>`},
  {t:'reveal', title:'La famiglia E(λ): tre assiomi, e le due conseguenze immediate', tag:'costruzione', steps:[
   {label:'S1 e S2, e la prima conseguenza', body:R`
   <p>Per ogni $\lambda$ reale, von Neumann definisce un proiettore $E(\lambda)$ sul sottospazio «generato dalle soluzioni con autovalore $\le\lambda$» — un oggetto che esiste sempre, anche quando l’equazione $H\varphi=\lambda\varphi$ non ha soluzione per quel $\lambda$. Due proprietà lo caratterizzano. S1: $E(\lambda)$ cresce con $\lambda$ (più alto il tetto, più grande il sottospazio). S2, la proprietà di composizione:</p>
   $$E(\lambda')E(\lambda'')=E(\min(\lambda',\lambda'')).$$
   <p>Si legga che cosa dice: applicare due proiettori di soglia diversa equivale ad applicare quello con la soglia più bassa — il sottospazio più piccolo vince, esattamente come intersecare due insiemi annidati. Posto $\lambda'=\lambda''=\lambda$, S2 dà immediatamente</p>
   $$E(\lambda)^{2}=E(\lambda),$$
   <p>cioè ogni $E(\lambda)$ è davvero un proiettore (idempotente), non un operatore qualsiasi: la proprietà che di solito si <i>postula</i> separatamente qui è una <i>conseguenza</i> di S2.</p>`},
   {label:'S3: la rappresentazione integrale, e perché va letta due volte', body:R`
   <p>La terza proprietà è quella che fa il lavoro pesante: $H$ si ricostruisce dalla famiglia come</p>
   $$H=\int_{-\infty}^{+\infty}\lambda\,dE(\lambda).$$
   <p>E qui von Neumann fa un gesto raro per un matematico: dichiara la propria formula senza senso. «<i>Questa espressione è priva di senso, poiché l’integrale di Stieltjes è definito per numeri e non per operatori.</i>» Non è un abuso di notazione da perdonare: è un’abbreviazione <b>formale</b> di un fatto che si può scrivere rigorosamente solo contro due vettori $f,g$, dove l’integrale è un ordinario integrale di Stieltjes fra numeri:</p>
   $$(Hf,g)=\int_{-\infty}^{+\infty}\lambda\,(dE(\lambda)f,g).$$
   <p>La lezione, che vale ben oltre questo movimento: una scrittura compatta e un’affermazione rigorosa sono due cose diverse, e sapere <i>quale</i> delle due si sta usando evita l’illusione di avere in mano un oggetto che non si ha.</p>`},
   {label:'Il caso finito, dove il meccanismo si vede senza l’integrale', body:R`
   <p>Per capire che cosa rappresenti davvero quell’integrale, vale la pena farlo nel caso in cui $H$ ha solo un numero finito di «gradini» $\ell_1<\ell_2<\dots<\ell_n$. Si definiscono i proiettori di salto</p>
   $$F_\tau=E(\ell_\tau)-E(\ell_{\tau-1}),\qquad F_\tau F_\sigma=\begin{cases}F_\tau&\tau=\sigma\\ 0&\tau\neq\sigma\end{cases},$$
   <p>e l’ortogonalità per $\tau\neq\sigma$ segue da S2 in due righe: se $\tau<\sigma$, $E(\ell_\tau)E(\ell_\sigma)=E(\ell_\tau)$ perché $\ell_\tau$ è il minimo, e i quattro prodotti che compongono $F_\tau F_\sigma$ si cancellano a due a due. Allora $H=\sum_\tau\ell_\tau F_\tau$, e il suo quadrato si calcola come si calcolerebbe il quadrato di una somma qualsiasi, con un vantaggio: l’ortogonalità uccide ogni termine incrociato.</p>
   $$H^{2}=\Big(\sum_{\tau}\ell_\tau F_\tau\Big)^{2}=\sum_{\tau,\sigma}\ell_\tau\ell_\sigma F_\tau F_\sigma=\sum_{\tau}\ell_\tau^{2}F_\tau.$$
   <p>La doppia somma collassa sulla diagonale per la stessa ragione per cui $i\neq j\Rightarrow F_iF_j=0$: è <i>esattamente</i> il meccanismo con cui, in dimensione finita, il quadrato di una matrice diagonale ha gli autovalori al quadrato. Il risultato con cui von Neumann chiude il paragrafo, pag. 75, generalizza questo calcolo all’integrale continuo:</p>
   $$\|Hf\|^{2}=\int_{-\infty}^{+\infty}\lambda^{2}\,d\big(\|E(\lambda)f\|^{2}\big).$$
   <p>È questa l’espressione che rende il <span class="str" data-str="spettro">teorema spettrale</span> utilizzabile: non c’è più bisogno di una base di autovettori per calcolare la norma di $Hf$, basta sapere come $\|E(\lambda)f\|^2$ cresce con $\lambda$ — e quella quantità, a differenza degli autovettori, esiste sempre.</p>`}
  ]},
  {t:'reveal', title:'Gli autostati approssimati di Picasso, resi precisi dalla convergenza in norma', tag:'esempio', steps:[
   {label:'L’osservabile a scala', body:R`
   <p>La tappa 01 aveva anticipato che gli autovettori impropri sono «il limite di qualcosa che si può fare meglio e meglio», e che quel «meglio e meglio» si rende preciso qui. Picasso, pag. stampata 119, costruisce un’osservabile a scala: si divide l’asse reale in intervalli di larghezza $\Delta$ centrati sui punti $x_n=n\Delta$, si chiama $E_{\Delta,x_n}(q)$ il proiettore di von Neumann sul sottospazio «$q$ è nell’intervallo attorno a $x_n$», e si definisce</p>
   $$q_\Delta=\sum_n x_n\,E_{\Delta,x_n}(q).$$
   <p>È un’osservabile <i>legittima</i>, nel senso più rigoroso: ha spettro discreto ($x_1,x_2,\dots$), i suoi proiettori $E_{\Delta,x_n}(q)$ sono esattamente le differenze $F_\tau$ della tappa precedente, e il problema agli autovalori di $q_\Delta$ si risolve davvero in $\mathcal H$ — nessuna estensione fuori dallo spazio, nessuna delta. Fisicamente è il regolo graduato con tacche di spaziatura $\Delta$: una misura di posizione reale ha sempre una risoluzione finita.</p>`},
   {label:'La convergenza che chiude il cerchio', body:R`
   <p>Picasso dimostra — e qui il conto richiede la norma operatoriale, non una derivata, quindi si cita il risultato — che la distanza fra $q_\Delta$ e l’operatore posizione vero $q$ va a zero al restringersi delle tacche:</p>
   $$\|q_\Delta-q\|=\Delta\ \Longrightarrow\ \lim_{\Delta\to0}(q_\Delta-q)=0.$$
   <p><b>Questo è ciò che rende $|x'\rangle$ un’idealizzazione legittima e non un errore.</b> Non è il limite di una successione arbitraria scelta per convenienza: è il limite di una famiglia di osservabili <i>vere</i>, ciascuna risolubile in $\mathcal H$ senza eccezioni, che si avvicina a $q$ tanto quanto si vuole. La tappa 01 aveva mostrato che le funzioni d’onda <i>approssimanti</i> la $\delta$ hanno norma $L^2$ divergente mentre le funzioni d’onda degli <i>autostati approssimati</i> di $q_\Delta$ restano finite — ed è esattamente la differenza fra «una successione che tende a un oggetto fuori da $\mathcal H$» (la $\delta$ di Dirac) e «una successione di oggetti dentro $\mathcal H$ che tende, in norma operatoriale, all’operatore limite» (gli $q_\Delta$ di von Neumann-Picasso). Sono due nozioni di limite diverse applicate a due oggetti diversi, e tenerle separate è il contenuto preciso di questa tappa.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`L’ortogonalità $F_\tau F_\sigma=0$ per $\tau\neq\sigma$ è stata dedotta solo da S2, senza usare S3. C’è un motivo per cui basta S2?`,
    a:R`Sì, ed è un fatto generale sui proiettori che vale la pena isolare: S2 dice che la famiglia $E(\lambda)$ è <i>totalmente ordinata</i> rispetto all’inclusione dei sottospazi (uno è sempre contenuto nell’altro, perché il prodotto di due proiettori qualsiasi della famiglia è il più piccolo dei due). Questa è una proprietà puramente algebrica — non richiede sapere che cosa $\lambda$ rappresenti fisicamente, né come $H$ sia definito. S3 entra solo quando si vuole <i>ricostruire $H$</i> dalla famiglia, cioè assegnare un peso $\lambda$ a ciascun salto. L’ortogonalità dei $F_\tau$, invece, è una proprietà della struttura a gradini della famiglia, non del valore di $H$ su quei gradini — per questo basta S2.`},
   {q:R`von Neumann dichiara che $H=\int\lambda\,dE(\lambda)$ è priva di senso, eppure quasi tutti i libri di meccanica quantistica la scrivono così, senza avvertenze. È un errore diffuso?`,
    a:R`Non è un errore: è un’ellissi che funziona perché il lettore esperto sa come scioglierla, ma vale la pena sapere che la si sta sciogliendo. L’espressione rigorosa è $(Hf,g)=\int\lambda\,(dE(\lambda)f,g)$, un integrale di Stieltjes fra <i>numeri</i> per ogni coppia di vettori $f,g$ — e questo definisce $H$ in modo univoco, perché una forma bilineare che si conosce su tutte le coppie di vettori determina l’operatore. Scrivere $H=\int\lambda\,dE(\lambda)$ è comodo perché assomiglia alla somma pesata $\sum\lambda_n P_n$ della diagonalizzazione finita, e il contenuto fisico (l’osservabile è una somma di autovalori pesati dai rispettivi proiettori) è lo stesso. Il prezzo della comodità è che l’oggetto scritto non esiste come integrale ordinario — e quando qualcosa va storto in un conto con operatori integrati così, il primo sospetto è proprio lì.`},
   {q:R`Gli autostati approssimati $q_\Delta$ hanno spettro discreto e convergono a $q$ in norma. Perché allora non si usa sempre $q_\Delta$ invece di $q$, evitando tutto il problema dello spettro continuo?`,
    a:R`Perché la convergenza è in norma <i>operatoriale</i>, e questo non equivale a «sono la stessa cosa a tutti gli effetti». Due conseguenze lo mostrano. Primo: $q_\Delta$ e $p$ non soddisfano mai esattamente $[q_\Delta,p]=i\hbar$ per $\Delta$ finito — l’operatore a scala è costante a tratti, e la sua «derivata» nel senso dell’azione di $p$ non riproduce il commutatore canonico, che vale solo nel limite. Secondo: il numero di tacche in un intervallo finito di $q_\Delta$ è finito, mentre il numero di valori possibili di $q$ vero è un continuo — sostituire $q$ con $q_\Delta$ in un calcolo esatto significherebbe discretizzare la fisica, non approssimarla. $q_\Delta$ serve a <i>dimostrare che il limite è legittimo</i>, non a evitare di farlo: è l’impalcatura, non l’edificio finito.`}
  ]}
]},

/* ---------------- 08 · LO SPAZIO DI HILBERT EQUIPAGGIATO ---------------- */
{ num:'08', title:'Lo spazio di Hilbert equipaggiato: la terza risposta, e perché serve', meta:'la catena di inclusioni di Gel’fand · lo spazio nucleare, con tre funzioni che separano chi ci sta e chi non ci sta · la realizzazione in funzioni di una variabile · dove l’equipaggiamento paga',
  blocchi:[
  {t:'prosa', title:'Che cosa manca alle prime due risposte', tag:'architettura', html:R`
  <p>Dirac allarga la nozione di funzione e paga il prezzo di restringere da solo l’uso della $\delta$ «ai casi in cui sia ovvio che non possa sorgere contraddizione» — un’onestà dichiarata ma informale. von Neumann resta rigorosamente dentro $\mathcal H$ e paga il prezzo opposto: perde gli autovettori, e con loro tutto il formalismo di bra e ket che Dirac aveva costruito. Nessuna delle due è sbagliata — sono entrambe <i>complete</i> nel loro proprio terreno — ma nessuna delle due dà torto all’altra e ragione contemporaneamente.</p>
  <p>Gel’fand (con Vilenkin, 1964) trova la terza strada, e Ballentine la scieglie esplicitamente per il motivo più pragmatico possibile: è «<i>likely to grow in popularity because it permits full use of Dirac's bra and ket formalism</i>» — rende rigoroso esattamente ciò che Dirac usava informalmente, senza che von Neumann debba ritirare nulla. L’idea, in una frase: non si allarga la nozione di funzione come fa Dirac, e non si resta dentro $\mathcal H$ come fa von Neumann — si <b>restringe</b> prima lo spazio di partenza, e poi si guarda a che cosa diventa grande il suo spazio duale.</p>`},
  {t:'reveal', title:'La catena di inclusioni, e le due regole da ricordare', tag:'costruzione', steps:[
   {label:'La catena', body:R`
   <p>Ballentine costruisce, pag. stampata 24-29, una catena di cinque spazi:</p>
   $$V\subset\Omega\subset\mathcal H=\mathcal H^{\times}\subset\Omega^{\times}\subset V^{\times}=\Xi.$$
   <p>Si legga da sinistra: $V$ è un piccolo spazio di «buone» funzioni (per esempio, polinomi per esponenziali); $\Omega$, lo <b>spazio nucleare</b>, è più grande di $V$ ma ancora fatto di funzioni molto regolari; $\mathcal H$ è lo <span class="str" data-str="spazio-di-hilbert">spazio di Hilbert</span> ordinario, quello della tappa 01, che ha la proprietà speciale di essere isomorfo al proprio spazio duale $\mathcal H^{\times}$ (questo è il teorema di Riesz, ed è <b>l’unico</b> dei cinque spazi con questa proprietà); $\Omega^{\times}$ è il duale di $\Omega$, e contiene oggetti che $\mathcal H$ non contiene; $\Xi=V^{\times}$ è il più grande di tutti.</p>`},
   {label:'La regola di scala, e lo spazio nucleare', body:R`
   <p>La prima regola da ricordare: <b>più piccolo è lo spazio, più grande è il suo duale.</b> Restringere le funzioni ammesse a qualcosa di molto regolare (decadimento rapido, derivabilità infinita) rende <i>più facile</i> che un funzionale lineare su di esse sia continuo — e quindi più oggetti si qualificano come elementi del duale. È il meccanismo inverso di quello intuitivo: non si guadagna rigore allargando, si guadagna <i>spazio per il duale</i> restringendo.</p>
   <p>La condizione precisa che definisce uno spazio nucleare, in termini delle componenti $u_n$ di un vettore rispetto a una base numerabile (per esempio quella dell’oscillatore armonico), è che i coefficienti decrescano più in fretta di <i>ogni</i> potenza inversa:</p>
   $$\sum_n|u_n|^{2}n^{m}<\infty\qquad m=0,1,2,\dots$$
   <p>cioè la condizione deve valere per $m=0$ (che è semplicemente l’appartenenza a $\mathcal H$), per $m=1$, per $m=2$, e così via senza fine. Non un decadimento rapido: un decadimento rapido <i>a ogni ordine</i>.</p>`}
  ]},
  {t:'reveal', title:'Tre funzioni, tre destini: chi sta in Ω, chi sta solo in H', tag:'esempio', steps:[
   {label:'Una funzione che sta in Ω', body:R`
   <p>Si prenda una gaussiana moltiplicata per un polinomio, $\varphi(x)=e^{-x^{2}}(1+|x|)$: decade più rapidamente di ogni potenza, quindi dovrebbe superare il test nucleare per ogni $m$. Il primo controllo, con $m=2$:</p>
   $$\int_{-\infty}^{+\infty}e^{-x^{2}}(1+|x|)^{2}\,dx=2+\frac{3\sqrt{\pi}}{2}.$$
   <p>Finito, come previsto — e lo resterebbe per qualunque $m$, perché l’esponenziale $e^{-x^2}$ domina ogni polinomio all’infinito. Questa è una funzione di <b>$\Omega$</b>: una «buona» funzione di test nel senso di Gel’fand.</p>`},
   {label:'Una funzione che sta in H ma non in Ω', body:R`
   <p>Si confronti con $\varphi(x)=1/(1+x^{2})$, che è in $L^2$ — cioè in $\mathcal H$ — perché</p>
   $$\int_{-\infty}^{+\infty}\Big|\frac{1}{1+x^{2}}\Big|^{2}dx=\frac{\pi}{2}.$$
   <p>Ma basta alzare il peso polinomiale a $m=4$ perché il test nucleare fallisca:</p>
   $$\int_{0}^{+\infty}\frac{(1+|x|)^{4}}{(1+x^{2})^{2}}\,dx=+\infty.$$
   <p>Questa funzione <b>sta in $\mathcal H$ ma non in $\Omega$</b>: è un vettore di Hilbert perfettamente legittimo, ma non è «buona» abbastanza da fare da funzione di test. La differenza fra le due funzioni non è se decadono o no — entrambe decadono — è <i>quanto in fretta</i>, e il test nucleare è un modo di dire «più in fretta di qualunque potenza», che un decadimento puramente algebrico come $1/(1+x^2)$ non raggiunge.</p>`},
   {label:'La realizzazione generale, in una variabile', body:R`
   <p>I due esempi non sono casi isolati: Ballentine, pag. stampata 29, dimostra che $\Omega$, realizzato in funzioni di una variabile, è esattamente l’insieme delle $\varphi$ per cui</p>
   $$\int_{-\infty}^{+\infty}|\varphi(x)|^{2}(1+|x|)^{m}dx<\infty\qquad(m=0,1,2,\dots),$$
   <p>cioè tutte e sole le funzioni che restano a quadrato integrabile anche moltiplicate per un peso polinomiale di grado arbitrario. Le due asserzioni numeriche precedenti sono le istanze $m=2$ e $m=4$ di questa condizione generale, usate per separare chi ci sta ($e^{-x^2}(1+|x|)$) da chi non ci sta ($1/(1+x^2)$).</p>`}
  ]},
  {t:'prosa', title:'Dove l’equipaggiamento paga: la selezione dello spettro', tag:'esempio', html:R`
  <p>Il §4.6 di Ballentine, pag. stampata 109-110, è il punto che l’<i>identità</i> di questo movimento promette dall’inizio. L’equazione di Schrödinger della particella libera ha per soluzione $e^{ikx}$ per <b>ogni</b> $k$, anche complesso — è un’equazione differenziale lineare del secondo ordine a coefficienti costanti, e la tappa 09 verifica il conto. La normalizzazione nel senso di $\mathcal H$ non può scartare nessuna di queste soluzioni, perché $\int|e^{ikx}|^2dx$ diverge per ogni $k$, reale o complesso: non c’è nessun criterio dentro $\mathcal H$ per distinguerle.</p>
  <p>L’appartenenza a $\Omega^{\times}$ invece seleziona. Un elemento di $\Omega^{\times}$ è un funzionale lineare <i>continuo</i> su $\Omega$: deve dare un numero finito quando applicato a <b>ogni</b> funzione di test, cioè a ogni funzione che decade più in fretta di qualunque potenza. Si scriva $k=k_r+ik_i$ con $k_i\neq0$: allora $e^{ikx}=e^{ik_rx}e^{-k_ix}$ cresce <i>esponenzialmente</i> per $x\to-\infty$ (se $k_i>0$) o per $x\to+\infty$ (se $k_i<0$). Una funzione di test di $\Omega$ decade più rapidamente di ogni potenza, ma <b>non</b> necessariamente più rapidamente di un esponenziale: l’accoppiamento $\int e^{ikx}\varphi(x)\,dx$ con $\varphi\in\Omega$ diverge non appena la crescita esponenziale di $e^{ikx}$ supera il decadimento di $\varphi$, cosa che accade sempre per $k_i\neq0$. Solo per $k$ <b>reale</b> l’esponenziale resta limitato e l’accoppiamento è finito per ogni $\varphi\in\Omega$: solo allora $e^{ikx}$ definisce un elemento di $\Omega^{\times}$.</p>
  <p>Questo è ciò che Ballentine intende dicendo che $\Omega^{\times}$ contiene <span class="str" data-str="delta-di-dirac">la delta di Dirac</span> ed $e^{ikx}$, ed esclude il resto: lo spazio duale non è «tutto ciò che si può scrivere», è precisamente l’insieme dei funzionali continui su $\Omega$, e quella continuità è un criterio verificabile che fa il lavoro che in $\mathcal H$ nessun criterio faceva. La conseguenza fisica, che la tappa 09 rende esplicita: l’energia $E=\hbar^2k^2/2m$ di una particella libera è automaticamente reale e non negativa, non perché si sia imposto che $H$ sia autoaggiunto su un certo dominio, ma perché solo i $k$ reali superano il test di appartenenza a $\Omega^{\times}$. Un fatto fisico esce da un criterio di appartenenza a uno spazio funzionale: è l’esatto punto in cui questo movimento guadagna il diritto di esistere invece di essere un riassunto di formalismo.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Perché serve TUTTA la famiglia di condizioni (per ogni $m=0,1,2,\dots$) e non basta un singolo peso polinomiale, per esempio $m=10$?`,
    a:R`Perché qualunque $m$ fissato lascerebbe fuori oggetti che servono. Se si richiedesse solo $\int|\varphi|^2(1+|x|)^{10}dx<\infty$, una funzione che decade come $1/(1+x^2)^{3}$ (che cresce come $x^{-6}$ al quadrato, quindi il peso $(1+|x|)^{10}$ al numeratore la farebbe divergere) sarebbe esclusa anche se è una funzione di test perfettamente ragionevole per molti scopi. Serve invece che il test <i>regga per ogni $m$</i>, perché il duale $\Omega^{\times}$ deve contenere funzionali che, applicati a una funzione di test, possono crescere come una potenza arbitraria — e la $\delta^{(n)}(x)$, la derivata $n$-esima della delta, è un funzionale che richiede proprio questo: applicata a $\varphi$ dà $(-1)^n\varphi^{(n)}(0)$, finito solo se $\varphi$ ha abbastanza regolarità e decadimento per ogni ordine. Restringere a un $m$ fissato è come costruire una porta che fa passare solo oggetti di una taglia: funziona per la $\delta$ ma non per le sue derivate.`},
   {q:R`La condizione di Ω chiede un decadimento più rapido di ogni potenza (polinomiale), non un decadimento esponenziale. $e^{ikx}$ con $k$ complesso cresce esponenzialmente: perché il confronto con Ω — che chiede \"solo\" un decadimento polinomiale veloce — basta a escluderlo?`,
    a:R`Perché la domanda da porsi non è quanto velocemente decade $\Omega$, ma se l’<i>integrale del prodotto</i> converge, e un decadimento polinomiale arbitrariamente rapido comunque <b>perde sempre</b> contro una crescita esponenziale all’infinito — è una gara che il polinomio (o l’inverso di un polinomio) non può vincere, qualunque sia il suo grado. Concretamente: se $\varphi(x)\sim(1+|x|)^{-N}$ per $|x|$ grande (il caso limite più lento ammesso da $\Omega$ per $N$ fissato, anche se $\Omega$ in realtà richiede che valga per OGNI $N$), il prodotto $e^{-k_ix}\varphi(x)$ cresce come $e^{-k_ix}(1+|x|)^{-N}$, e per $x\to\mp\infty$ l’esponenziale domina qualunque $N$. Quindi sì: basta il confronto, perché l’esponenziale e il polinomio non sono nella stessa classe di crescita a nessun ordine.`}
  ]}
]},

/* ---------------- 09 · LA PARTICELLA LIBERA E LA PARITA ---------------- */
{ num:'09', title:'La particella libera: lo spettro selezionato, e la parità che raddoppia gli autostati', meta:'l’equazione risolta per ogni k, anche complesso · l’energia non negativa come conseguenza · l’operatore di inversione · la doppia degenerazione',
  blocchi:[
  {t:'prosa', title:'Il caso in cui l’equipaggiamento si vede lavorare', tag:'esempio', html:R`
  <p>L’hamiltoniana della particella libera è $H=p^2/2m$, e l’equazione agli autovalori in rappresentazione delle coordinate è l’equazione di Schrödinger stazionaria senza potenziale. Si verifica direttamente che $e^{ikx}$ la risolve, per <b>qualunque</b> $k$:</p>
  $$-\frac{\hbar^{2}}{2M}\frac{d^{2}}{dx^{2}}e^{ikx}=\frac{\hbar^{2}k^{2}}{2M}\,e^{ikx}.$$
  <p>È un’equazione differenziale lineare del secondo ordine a coefficienti costanti: le sue soluzioni sono esponenziali per costruzione, e l’esponente $k$ non è vincolato da nessuna condizione al contorno, perché non c’è contorno. La tappa 08 ha già fatto il lavoro che qui si raccoglie: fra tutti i $k$ possibili (reali e complessi), solo quelli <b>reali</b> definiscono un funzionale continuo su $\Omega$, cioè un elemento legittimo di $\Omega^\times$. Il risultato, raccolto senza bisogno di postulare nulla sull’autoaggiunzione di $H$:</p>
