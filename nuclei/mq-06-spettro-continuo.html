  <p>l’energia $E=\hbar^2k^2/2M$ è automaticamente reale e non negativa, perché i $k$ sopravvissuti alla selezione sono reali. Parametrizzando con l’impulso $p'=\hbar k$,</p>
  $$p'=\sqrt{2mE},$$
  <p>cioè il valore assoluto dell’impulso è la radice dell’energia — ben definita perché $E\ge0$, e non lo sarebbe se $E$ potesse essere negativa o complessa.</p>`},
  {t:'reveal', title:'L’operatore di inversione, e la doppia degenerazione', tag:'costruzione', steps:[
   {label:'La definizione, e l’anticommutazione con q e p', body:R`
   <p>Ogni valore di $E>0$ corrisponde a <b>due</b> valori di $k$, $\pm\sqrt{2mE}/\hbar$: lo spettro della particella libera è doppiamente degenere, e per organizzare questa degenerazione serve un secondo operatore che commuti con $H$ ma non con $p$ (altrimenti $\pm p'$ sarebbero semplicemente due autostati distinti senza ulteriore struttura). Picasso introduce l’operatore di inversione spaziale $I$, definito dalla sua azione su $q$ e $p$, (7.6) pag. stampata 126:</p>
   $$IqI^{-1}=-q,\qquad IpI^{-1}=-p.$$
   <p>$I$ anticommuta con entrambi gli operatori fondamentali — rovescia lo spazio, quindi rovescia sia la posizione sia l’impulso — ma commuta con $H=p^2/2m$, perché $H$ dipende solo da $p^2$, e $(-p)^2=p^2$. Questa è esattamente la condizione che serve: $[I,H]=0$ garantisce che $I$ manda autostati di $H$ in autostati di $H$ con lo <i>stesso</i> autovalore, cioè agisce <i>dentro</i> il sottospazio degenere.</p>`},
   {label:'L’azione sugli autostati dell’impulso', body:R`
   <p>Applicando $I$ a un’autofunzione dell’impulso in rappresentazione di Schrödinger, e usando $IpI^{-1}=-p$:</p>
   $$I\,e^{ip'x/\hbar}=e^{-ip'x/\hbar}\ \Longrightarrow\ I|p'\rangle=|-p'\rangle.$$
   <p>«<i>Facilmente</i>», come dice Picasso (7.10): l’inversione spaziale scambia i due autostati di impulso opposto che condividono la stessa energia. Non è un fatto isolato — è la realizzazione concreta, su questo esempio, di ciò che l’anticommutazione $IpI^{-1}=-p$ dice in generale.</p>`},
   {label:'Le due combinazioni reali', body:R`
   <p>Poiché $I$ commuta con $H$ ma scambia $|p'\rangle$ con $|-p'\rangle$, le combinazioni simmetrica e antisimmetrica sono autostati sia di $H$ sia di $I$ — e sono reali, a differenza delle onde piane. La combinazione simmetrica è un coseno:</p>
   $$\frac{e^{ip'x/\hbar}+e^{-ip'x/\hbar}}{2}=\cos\!\big(p'x/\hbar\big),$$
   <p>ed essendo pari è automaticamente invariante per $x\to-x$, cioè per l’azione di $I$ in rappresentazione delle coordinate:</p>
   $$\cos\!\big({-}p'x/\hbar\big)-\cos\!\big(p'x/\hbar\big)=0.$$
   <p>La combinazione antisimmetrica è un seno, ed essendo dispari cambia segno sotto $I$ invece di restare fissa — il contenuto preciso della verifica è che l’<i>antisimmetria</i> si manifesti come somma nulla, non come differenza nulla:</p>
   $$\sin\!\big({-}p'x/\hbar\big)+\sin\!\big(p'x/\hbar\big)=0.$$
   <p>Coseno e seno sono dunque gli autostati di $I$ dentro il doppietto degenere — rispettivamente con autovalore $+1$ e $-1$ dell’inversione — mentre $|p'\rangle$ e $|-p'\rangle$ non lo sono (vengono scambiati, non riprodotti a meno di segno).</p>`},
   {label:'Tutti gli autostati possibili', body:R`
   <p>Poiché $H$ dipende solo da $p^2$, <b>ogni</b> combinazione lineare di $|p'\rangle$ e $|-p'\rangle$ è un autostato di $H$ con lo stesso autovalore $E=p'^2/2m$: non solo le due combinazioni reali appena viste, ma l’intera famiglia a due parametri complessi,</p>
   $$\alpha|{+}p'\rangle+\beta|{-}p'\rangle,\qquad \alpha,\beta\in\mathbb C.$$
   <p>Questo è il contenuto esatto di «doppiamente degenere»: il sottospazio con energia $E$ fissata non è una retta (un solo stato a meno di fase) ma un piano complesso, e l’operatore di inversione fornisce un modo canonico di scegliere una base dentro quel piano — coseno e seno, oppure $|{+}p'\rangle$ e $|{-}p'\rangle$, sono due basi diverse dello stesso sottospazio a due dimensioni, utili per scopi diversi: la seconda diagonalizza $p$, la prima diagonalizza $I$.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`L’operatore di inversione commuta con $H$ ma non con $p$. Com’è possibile, se $H$ è costruito a partire da $p$?`,
    a:R`Perché $H$ non dipende da $p$: dipende da $p^2$, e il quadrato dimentica il segno. $IpI^{-1}=-p$ dice che $I$ e $p$ non commutano in senso proprio ($Ip=-pI\neq pI$, a meno che $p=0$); ma $IHI^{-1}=I\,p^2/2m\,I^{-1}=(IpI^{-1})^2/2m=(-p)^2/2m=p^2/2m=H$. Il quadrato è la ragione precisa per cui un’operazione che l’Hamiltoniana «non vede» (il segno di $p$) genera comunque una simmetria di $H$: è lo stesso motivo per cui l’energia cinetica classica $p^2/2m$ non distingue un moto verso destra da uno verso sinistra della stessa velocità.`},
   {q:R`La selezione dei $k$ reali è stata giustificata con l’appartenenza a $\Omega^\times$. Che cosa succederebbe fisicamente se si accettasse anche un $k$ con parte immaginaria piccola?`,
    a:R`Si otterrebbe uno stato con energia complessa $E=\hbar^2k^2/2m$, e un’energia complessa in un’equazione di Schrödinger dipendente dal tempo produce un fattore $e^{-iEt/\hbar}$ con modulo che cresce o decresce esponenzialmente nel tempo — una probabilità totale che non si conserva. Fisicamente sarebbe uno stato che si "crea" o "distrugge" dal nulla, incompatibile con l’unitarietà dell’evoluzione temporale. Il criterio di $\Omega^\times$ non è quindi un tecnicismo che capita di escludere i $k$ complessi: è la versione, in questo linguaggio, della stessa richiesta fisica — conservazione della probabilità — che altrove si impone chiedendo che $H$ sia autoaggiunto.`},
   {q:R`Coseno e seno sono stati scelti come base del doppietto perché diagonalizzano $I$. $|p'\rangle$ e $|{-}p'\rangle$ non sono "altrettanto buoni" come base?`,
    a:R`Sono altrettanto legittimi come base del sottospazio, ma diagonalizzano un operatore diverso ($p$, non $I$), e quale base sia "la migliore" dipende da che cosa si vuole calcolare dopo. Se l’esperimento misura l’impulso, $|p'\rangle,|{-}p'\rangle$ sono la base naturale: ogni stato fisico di quella energia è una sovrapposizione con coefficienti $\alpha,\beta$ che danno direttamente le probabilità di trovare $+p'$ o $-p'$. Se invece interessa la parità dello stato — per esempio per selezionare le soluzioni ammissibili in presenza di un potenziale simmetrico, come capiterà in materiale successivo sulla buca di potenziale — coseno e seno sono la base che rende il calcolo immediato, perché l’hamiltoniana con potenziale pari commuta con $I$ ma il potenziale rompe la degenerazione fra $+p'$ e $-p'$ individualmente. La morale: la degenerazione dice che la scelta di base è libera, non che sia indifferente.`}
  ]}
]},

/* ---------------- 10 · IL FLUSSO, LA SCATOLA, LA MISURA ---------------- */
{ num:'10', title:'Il flusso di probabilità, la normalizzazione in scatola, e la misura che la confronta', meta:'l’equazione di continuità, dal teorema della divergenza · il flusso dell’onda piana · dalla somma all’integrale · l’esperimento che pesa la distribuzione d’impulso',
  blocchi:[
  {t:'prosa', title:'Tre problemi pratici che lo spettro continuo pone', tag:'architettura', html:R`
  <p>Le nove tappe precedenti hanno costruito il formalismo. Restano tre questioni pratiche che chiunque lavori con stati a spettro continuo incontra, e Ballentine le tratta nello stesso capitolo in cui equipaggia lo spazio: come si conserva — localmente, non solo globalmente — la probabilità quando gli stati non sono normalizzabili; come si fa, nei conti, a trattare uno spettro continuo come se fosse discreto quando serve contare gli stati; e se tutto questo formalismo descriva davvero qualcosa che si misura, o resti un’elaborazione puramente matematica.</p>`},
  {t:'reveal', title:'L’equazione di continuità, e il flusso di probabilità', tag:'costruzione', steps:[
   {label:'Dalla conservazione globale a quella locale', body:R`
   <p>Che $\int|\Psi|^2dx$ sia costante nel tempo (la norma si conserva sotto evoluzione unitaria) è un fatto globale. Ballentine, (4.21) pag. stampata 104, ne ricava la versione <i>locale</i> usando l’equazione di Schrödinger dipendente dal tempo e il <span class="str" data-str="teorema-della-divergenza">teorema della divergenza</span>: derivando $|\Psi|^2=\Psi^*\Psi$ rispetto al tempo, sostituendo $i\hbar\,\partial_t\Psi=-\,(\hbar^2/2M)\nabla^2\Psi+V\Psi$ e la sua coniugata, i termini di potenziale si cancellano (perché $V$ è reale) e resta una divergenza pura:</p>
   $$\frac{\partial}{\partial t}|\Psi(x,t)|^{2}+\operatorname{div}J(x,t)=0.$$
   <p>È la stessa forma dell’equazione di continuità dell’elettromagnetismo e della fluidodinamica: la densità cambia in un punto solo per effetto di qualcosa che fluisce dentro o fuori da lì, non per creazione o distruzione locale.</p>`},
   {label:'Il vettore flusso, e il suo valore sull’onda piana', body:R`
   <p>Il vettore che compare, definito da Ballentine (4.22a) pag. stampata 105 in due forme equivalenti:</p>
   $$J(x,t)=\frac{-i\hbar}{2M}\big(\Psi^{*}\nabla\Psi-\Psi\nabla\Psi^{*}\big)=\frac{\hbar}{M}\,\mathrm{Im}\big(\Psi^{*}\nabla\Psi\big).$$
   <p>La seconda forma è la prima riscritta notando che $z-z^*=2i\,\mathrm{Im}(z)$. Applicata all’onda piana $\Psi=Ce^{ikx}$ di questo movimento, con $\nabla\Psi=ikCe^{ikx}$:</p>
   $$J=\frac{\hbar}{M}\,\mathrm{Im}\big(\Psi^{*}\nabla\Psi\big)=|C|^{2}\frac{\hbar k}{M}.$$
   <p>Il risultato ha una lettura immediata: $\hbar k/M$ è la velocità classica associata all’impulso $p'=\hbar k$, e $|C|^2$ è la densità. Il flusso di probabilità di un’onda piana è <b>densità per velocità</b>, esattamente come un flusso di materia classico — ma attenzione, perché Ballentine (§4.4) nota che per una <i>sovrapposizione</i> di onde piane il flusso totale non è la somma dei flussi dei singoli termini: compaiono termini di interferenza, perché $J$ è bilineare in $\Psi$ e non lineare.</p>`}
  ]},
  {t:'reveal', title:'La cuspide della buca a gradino finito, e il filo con la tappa 01', tag:'esempio', steps:[
   {label:'La condizione di raccordo al bordo', body:R`
   <p>Un’altra questione pratica che lo spettro continuo pone: la buca di potenziale finita, dove lo spettro è <i>misto</i> — discreto per gli stati legati, continuo sopra la soglia — e il confine fra i due regimi va capito bene. Per la soluzione pari dentro una buca simmetrica di semilarghezza unitaria, $\psi(x)=A\cos(kx)$ per $|x|<1$, mentre fuori la soluzione decade come $e^{-\alpha|x|}$ con $\alpha$ fissato dall’energia e dalla profondità della buca. La continuità della derivata logaritmica al bordo — che è la condizione fisica corretta, più forte della sola continuità di $\psi$ — uguaglia le due derivate logaritmiche calcolate da dentro e da fuori:</p>
   $$\frac{Ak\sin k}{A\cos k}=k\tan k=\alpha.$$
   <p>Il fattore $A$ si cancella perché compare in entrambe le derivate logaritmiche: la condizione di raccordo non dipende dall’ampiezza assoluta della funzione d’onda, solo dalla sua forma. Questa è Ballentine §4.5, pag. stampata 106-108, il conto che spiega da dove viene la cuspide nel limite $V\to\infty$.</p>`},
   {label:'Il limite V → ∞, e dove nasce la cuspide', body:R`
   <p>Quando la buca si fa sempre più profonda, $\alpha\to\infty$ insieme a $V$ — una buca più profonda confina più strettamente, e la funzione esterna decade più in fretta. L’equazione $k\tan k=\alpha$ ha allora soluzione solo quando anche $\tan k\to\infty$, cioè $k\to\pi/2,3\pi/2,5\pi/2,\dots$: sono esattamente gli autovalori della buca <i>infinita</i>, dove la condizione al contorno diventa semplicemente $\psi(\pm1)=0$.</p>
   <p><b>Ecco da dove viene la cuspide.</b> Per $V$ finito, $\psi$ e $\psi'$ sono entrambe continue al bordo — è proprio la condizione che si è appena imposto. Ma nel limite $V\to\infty$ la funzione esterna collassa a zero ovunque, e la continuità della derivata smette di essere un vincolo: $\psi'$ può saltare, perché non c’è più niente dall’altra parte con cui raccordarsi. La cuspide nella soluzione della buca infinita non è un artefatto di un calcolo sbagliato: è il residuo visibile di un vincolo (la continuità di $\psi'$) che il limite ha rimosso in modo discontinuo.</p>`},
   {label:'Lo stesso meccanismo, nel linguaggio della tappa 01', body:R`
   <p>Picasso, costruendo nella tappa 01 l’autofunzione approssimata dell’impulso troncata a $|x|<L$, trova per quella finestra una larghezza</p>
   $$\Delta p=\frac{\hbar}{2L}.$$
   <p>È lo stesso meccanismo della buca, visto da un altro lato: <b>confinare</b> una funzione in una regione finita — che sia un pozzo di potenziale o un semplice troncamento a mano — produce sempre un’incertezza in impulso dell’ordine di $\hbar/L$. Il prefattore numerico (qui $1/2$, altrove diverso) dipende dai dettagli del raccordo ai bordi; il fatto che ci <i>sia</i> un prodotto $L\cdot\Delta p\sim\hbar$ non dipende da nessun dettaglio — è la relazione di indeterminazione della tappa 05, vista nascere da un confinamento geometrico invece che da una gaussiana.</p>`}
  ]},
  {t:'reveal', title:'Dalla somma sul reticolo all’integrale, e il confronto delle normalizzazioni', tag:'costruzione', steps:[
   {label:'La regola di passaggio', body:R`
   <p>Per contare stati a spettro continuo con tecniche discrete, si racchiude il sistema in una scatola cubica di lato $L$ con condizioni periodiche: solo i $k$ che fanno «stare un numero intero di lunghezze d’onda nella scatola» sono ammessi, e sono densamente distribuiti con passo $2\pi/L$ per componente. Ballentine, (5.9) pag. stampata 128, dà la regola di passaggio dalla somma discreta all’integrale continuo nel limite di scatola grande:</p>
   $$\sum_k\ \longrightarrow\ \Big(\frac{L}{2\pi}\Big)^{3}\int d^{3}k=\Big(\frac{L}{2\pi\hbar}\Big)^{3}\int d^{3}p,$$
   <p>dove il fattore $(L/2\pi)^3$ è la densità di punti del reticolo nello spazio dei $k$ — tanti punti quanto è grande la scatola, perché una scatola più grande ammette più lunghezze d’onda diverse. Un controllo aritmetico elementare sul passo del reticolo:</p>
   $$\Big(\frac{2\pi}{L}\Big)^{3}=\frac{8\pi^{3}}{L^{3}}.$$`},
   {label:'Le due normalizzazioni non coincidono', body:R`
   <p>Normalizzare in scatola (stato discreto, norma 1 sulla scatola finita) e normalizzare alla $\delta$ (stato improprio, come in questo intero movimento) sono due convenzioni diverse, e confrontarle richiede un fattore di conversione. Ballentine lo calcola confrontando la (5.8) con la (5.4), pag. stampata 128:</p>
   $$|{}_L\langle\hbar k|\Psi\rangle|^{2}=\Big(\frac{2\pi\hbar}{L}\Big)^{3}|\langle\hbar k|\Psi\rangle|^{2}.$$
   <p>Il senso: lo stato normalizzato in scatola ha una probabilità <i>per stato discreto</i>, quella normalizzata alla $\delta$ ha una <i>densità di probabilità per $d^3p$</i> — due quantità dimensionalmente diverse, legate dal volume $(2\pi\hbar/L)^3$ che ciascun punto del reticolo «occupa» nello spazio degli impulsi. Chi confronta un calcolo fatto con una convenzione e un risultato scritto con l’altra, senza questo fattore, trova un disaccordo che non è un errore di fisica.</p>`}
  ]},
  {t:'reveal', title:'La misura che chiude il movimento: la distribuzione d’impulso è stata pesata', tag:'esempio', steps:[
   {label:'L’esperimento di Lohmann e Weigold', body:R`
   <p>Tutto questo movimento rischia di apparire un esercizio di formalismo se non si dice che $|\langle p|\Psi\rangle|^2$ — la distribuzione di probabilità in rappresentazione degli impulsi che la tappa 04 ha introdotto come oggetto puramente matematico — è stata <b>misurata</b>, e non indirettamente. Ballentine, §5.2 pag. stampata 129, descrive l’esperimento di Lohmann e Weigold (1981): un fascio di elettroni di impulso noto $p_a$ colpisce un atomo di idrogeno inizialmente nello stato fondamentale (impulso $p_0\approx0$), e si rilevano in coincidenza i due elettroni uscenti — quello diffuso con impulso $p_b$ e quello espulso dall’atomo con impulso $p_e$ — in una geometria che fissa energia e impulso trasferiti.</p>
   <p>Il bilancio dell’impulso, assumendo che il nucleo (molto più pesante) non venga toccato nella collisione:</p>
   $$p_e=p_a+p_b-p_0.$$
   <p>Misurando $p_a$ e $p_b$ per ogni evento e contando quanti eventi corrispondono a ciascun valore di $p_e$ ricostruito, si ottiene sperimentalmente l’istogramma della distribuzione d’impulso dell’elettrone legato — e l’accordo con $|\langle p|\psi_{1s}\rangle|^2$ calcolato dalla funzione d’onda dell’idrogeno è la verifica diretta che la rappresentazione degli impulsi non sia un linguaggio equivalente ma inutile: è una quantità con cui si predicono numeri che un rivelatore conta.</p>`},
   {label:'Che cosa chiude, e che cosa resta aperto', body:R`
   <p>Il cerchio che si chiude qui è quello apertosi nella tappa 04, dove Picasso scriveva che finalmente si capisce che le onde di de Broglie sono funzioni d’onda e non onde fisiche misurabili punto per punto. L’esperimento di Lohmann-Weigold mostra l’altra faccia della stessa medaglia: anche se $\Psi(x)$ e $\varphi(p)$ non sono misurabili punto per punto, i loro <i>moduli quadri</i> lo sono — e misurarli in rappresentazione degli impulsi richiede esattamente l’apparato che questo movimento ha costruito: autostati impropri, funzione di trasformazione, normalizzazione alla $\delta$ o in scatola secondo convenienza. Lo spettro continuo non è un’eccezione da maneggiare con cautela ai margini della teoria: è la rappresentazione in cui si leggono direttamente i dati di un esperimento di collisione.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`L’equazione di continuità richiede che $V$ sia reale per far cancellare i termini di potenziale. Che cosa succederebbe con un potenziale complesso?`,
    a:R`La probabilità totale non si conserverebbe più, e questo è esattamente il trucco (deliberato) con cui si modellano l’assorbimento e la perdita di particelle in alcuni problemi effettivi — per esempio un "potenziale ottico" complesso usato per descrivere una reazione nucleare in cui il proiettile può essere assorbito. Con $V=V_r-iV_i$ ($V_i>0$), ripetendo il calcolo della tappa si trova $\partial_t|\Psi|^2+\operatorname{div}J=-\,(2V_i/\hbar)|\Psi|^2$: un termine di pozzo che toglie probabilità in proporzione alla densità locale. È un modello <i>effettivo</i>, non la teoria fondamentale — la teoria fondamentale conserva sempre la probabilità totale del sistema completo, compreso ciò che assorbe — ma è un esempio di quanto sia rigido il vincolo "V reale": rimuoverlo cambia la fisica, non solo la matematica.`},
   {q:R`La normalizzazione in scatola sembra un trucco di calcolo. Il risultato finale (per esempio la distribuzione d’impulso misurata) dipende dalla scelta di $L$?`,
    a:R`No, e verificarlo è il senso di tutta la tappa sul confronto delle normalizzazioni. $L$ è un artificio introdotto per poter contare — trasformare una somma su un continuo in una somma su un reticolo discreto, più facile da maneggiare in certi calcoli intermedi (densità degli stati, regole di somma) — e ogni quantità fisica finale si ottiene prendendo il limite $L\to\infty$, dove il fattore di conversione $(2\pi\hbar/L)^3$ e la somma sul reticolo si combinano esattamente nel modo giusto per restituire l’integrale e la normalizzazione alla $\delta$ di partenza. Se un risultato finale dipendesse da $L$, sarebbe il segnale di un errore nel conto, non una proprietà fisica della scatola — la scatola non esiste, è un dispositivo di calcolo.`},
   {q:R`L’esperimento di Lohmann-Weigold misura $p_e$ ricostruendolo dal bilancio $p_e=p_a+p_b-p_0$. Questo richiede di assumere che il nucleo non venga toccato: se quell’assunzione fosse sbagliata, che cosa si misurerebbe davvero?`,
    a:R`Si misurerebbe comunque un bilancio d’impulso corretto — la conservazione dell’impulso totale vale sempre — ma l’interpretazione di $p_e$ come «l’impulso che l’elettrone aveva nello stato legato, prima della collisione» dipenderebbe dall’approssimazione. Se il nucleo assorbisse un impulso di rinculo non trascurabile, il bilancio vero sarebbe $p_e=p_a+p_b-p_0-p_{\text{nucleo}}$, e ignorare $p_{\text{nucleo}}$ introdurrebbe un errore sistematico nella distribuzione ricostruita. Questo è precisamente il motivo per cui l’esperimento è progettato con un nucleo di idrogeno (il più leggero possibile, quindi il rinculo più trascurabile a parità di energia trasferita) e perché l’accordo con la predizione teorica $|\langle p|\psi_{1s}\rangle|^2$ è anche una verifica indiretta che l’approssimazione del nucleo immobile sia giustificata in quel regime.`}
  ]}
]},

];


/* =================================================================== */
var byId = {}; TAPPE.forEach(function(s){ byId[s.num]=s; });

var VKEY='pm-nucleomq-06-visited';
function loadSeen(){ try{ return new Set(JSON.parse(localStorage.getItem(VKEY)||'[]')); }catch(e){ return new Set(); } }
function saveSeen(s){ try{ localStorage.setItem(VKEY, JSON.stringify(Array.from(s))); }catch(e){} }
var SEEN = loadSeen();

function renderNav(active){
  var nav=document.getElementById('sidebar');
  nav.innerHTML='';
  var h=document.createElement('h2'); h.textContent='Nucleo mq-06 · le tappe'; nav.appendChild(h);
  TAPPE.forEach(function(s){
    var b=document.createElement('button');
    b.className='navitem'+(active===s.num?' active':'')+(SEEN.has(s.num)?' seen':'');
    b.innerHTML='<span class="dot"></span><span class="nx">'+s.num+'</span><span>'+s.title+'</span>';
    b.onclick=function(){ showTappa(s.num); };
    nav.appendChild(b);
  });
}

/* ---- renderer dei blocchi ---- */
function sectionProsa(title, tag, html){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var body=elFromHTML('<div class="open-body">'+html+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function sectionGram(title, rows){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag gramtag">grammatica</span></h3>';
  var inner='<table class="gramtab">';
  rows.forEach(function(r){ inner+='<tr><td class="gs">'+r[0]+'</td><td>'+r[1]+'</td></tr>'; });
  inner+='</table>';
  var body=elFromHTML('<div class="gramwrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
/* --- blocco PLOT: la figura non decora, si legge. Ogni plot porta una chiave di lettura. --- */
function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';
  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionSvelabile(title, tag, html, sol){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var c=document.createElement('div'); c.className='collaudo-item';
  var q=document.createElement('div'); q.className='cq'; q.innerHTML=html||'';
  c.appendChild(q); typeset(q);
  if(sol){
    var a=document.createElement('div'); a.className='ca'; a.style.display='none';
    a.innerHTML='<b>Soluzione.</b> '+sol;
    var btn=document.createElement('button'); btn.className='reveal-btn small';
    btn.textContent='Rivela la soluzione';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a);
      btn.disabled=true; btn.classList.add('done'); btn.textContent='Soluzione rivelata'; };
    c.appendChild(btn); c.appendChild(a);
  }
  wrap.appendChild(c); return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    /* DUE SCHEMI, NON UNO — scoperto il 2026-10-06 provando le pagine vive. I movimenti
       scritti per primi (em-01..03, me-10b, i collaudi di gd-01..09 e di quattro em)
       usano una forma piu' semplice: `reveal` e `prolessi` con un solo `html`,
       `esercizio` e `collaudo` con `html` + `sol`. Il renderer ne conosceva una sola e
       chiamava `steps.forEach` su `undefined`: TypeError, e la tappa si fermava li' —
       62 blocchi in 17 movimenti su 74. Non si riscrive il contenuto per far contento
       il renderer: e' il renderer che deve leggere cio' che c'e'.
       E in fondo un ramo che NON muore: uno schema nuovo di domani deve far vedere un
       avviso in quella sezione, non spegnere la pagina sotto di se'. */
    try{
      if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
      else if(b.t==='prolessi') m.appendChild(b.rotte ? sectionProlessi(b)
                                   : sectionProsa(b.title,'prolessi',b.html));
      else if(b.t==='reveal')m.appendChild(b.steps ? sectionReveal(b.title,b.tag,b.steps)
                                   : sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='esercizio') m.appendChild(b.steps ? sectionEsercizio(b)
                                   : sectionSvelabile(b.title,'esercizio',b.html,b.sol));
      else if(b.t==='collaudo')  m.appendChild(b.items ? sectionCollaudo(b.title,b.items)
                                   : sectionSvelabile(b.title,'provi, poi riveli',b.html,b.sol));
      else if(b.t==='plot')      m.appendChild(sectionPlot(b));
      else m.appendChild(sectionProsa(b.title||'(blocco)', 'tipo sconosciuto: '+b.t,
                                      b.html||''));
    }catch(err){
      var avv=document.createElement('section'); avv.className='section';
      avv.innerHTML='<h3>'+(b.title||'(blocco)')+'<span class="tag">non reso</span></h3>'
        +'<p style="color:#ff6b6b">Questo blocco non si &egrave; potuto rendere ('
        +b.t+': '+err.message+'). Il resto della tappa continua sotto.</p>';
      m.appendChild(avv);
    }
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* I POP-UP DEGLI STRUMENTI. `cablaStrumenti` esisteva dal 18-09 e non la chiamava
     nessuno: i 229 rimandi del percorso erano <span> senza handler, e il clic non
     faceva niente. Nessun controllo poteva vederlo — la sintassi era valida, le schede
     c'erano tutte, le formule rendevano: il guasto esisteva solo a pagina viva. Qui, e
     dopo ogni inserimento successivo, perche' la tappa si rimonta da capo a ogni
     cambio e gli handler vanno riattaccati al DOM nuovo. */
  cablaStrumenti(m);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}

/* deep-link: mq-06-spettro-continuo.html#03 apre direttamente la tappa 03 */
window.addEventListener('DOMContentLoaded', function(){
  var h=(location.hash||'').replace('#','');
  showTappa(byId[h]?h:'00');
});
window.addEventListener('hashchange', function(){
  var h=(location.hash||'').replace('#','');
  if(byId[h]) showTappa(h);
});
</script>
