  .pnbtn:hover{border-color:var(--accent);background:var(--panel2);}

  code{background:var(--panel2);border:1px solid var(--border);border-radius:5px;

  .katex{font-size:1.02em;color:var(--txt);} .katex-display{margin:.5em 0;overflow-x:auto;overflow-y:hidden;}

  @media(max-width:860px){

    .sidebar h2{width:100%;} .navitem{width:auto;}

<script>
"use strict";
const R = String.raw;

function typeset(el){
  if(el && window.renderMathInElement){

function elFromHTML(html){ var d=document.createElement('div'); d.innerHTML=html; return d; }

/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un
   rimando scritto nella prosa:

       <span class="str" data-str="serie-geometrica">la serie geometrica</span>

   Le schede citate da questo nucleo sono cucite qui sotto dal montaggio
   (assembla-nucleo.js): la pagina resta autosufficiente — niente fetch,
   niente sottocartelle da pubblicare — e un rimando a una scheda che non
   esiste FERMA la costruzione invece di arrivare in pagina rotto.
   Apertura: lo stesso gesto del collaudo (si clicca, il pannello compare,
   si typeset una volta sola), portato dentro la frase.
   =================================================================== */
var CORSO = 'meccanica-quantistica';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["commutatore"] = {"nome":"Commutatore","riga":"$[\\hat A,\\hat B]=\\hat A\\hat B-\\hat B\\hat A$, antisimmetrico, con la regola di Leibniz $[\\hat A,\\hat B\\hat C]=[\\hat A,\\hat B]\\hat C+\\hat B[\\hat A,\\hat C]$ e la relazione canonica $[\\hat x,\\hat p]=i\\hbar$.","serve":"E' la misura di quanto due operazioni dipendano dall'ordine, e qui l'ordine e' fisica: due osservabili che non commutano non hanno una base comune di autostati, quindi non si misurano insieme con precisione arbitraria. Quasi ogni conto che sembra magico — l'algebra del momento angolare, gli operatori di salita e discesa, il teorema di Ehrenfest — e' una manipolazione di commutatori fatta con quelle regole e nient'altro.","esempio":"Dalla regola di Leibniz, $[\\hat x,\\hat p^{2}]=[\\hat x,\\hat p]\\hat p+\\hat p[\\hat x,\\hat p]=2i\\hbar\\hat p$. E' il conto che fa uscire il teorema di Ehrenfest: la meccanica classica ricompare come relazione fra valori medi, e ricompare perche' quel commutatore vale proprio $2i\\hbar\\hat p$.","debito":"l'identita' di Jacobi si enuncia e non si dimostra; la corrispondenza fra commutatore e parentesi di Poisson — che e' l'idea di Dirac e non un'analogia decorativa — sta in mq-07, e li' va letta per intero.","controllo":[{"tipo":"uguale","sinistra":"I*hbar*p + p*I*hbar","vale":"2*I*hbar*p","ipotesi":{"hbar":"positive","p":"real"},"dove":"esempio","appare":"2i\\hbar\\hat p"},{"tipo":"simbolico","dove":"riga","appare":"[\\hat x,\\hat p]=i\\hbar","perche":"e' la relazione di commutazione canonica, il POSTULATO da cui discende il resto della teoria: non si dimostra, si assume, ed e' cio' che separa la meccanica quantistica dalla classica"}],"qui":{},"pieno":null};
STRUM["spettro"] = {"nome":"Spettro di un operatore","riga":"Lo spettro di un operatore e' l'insieme dei possibili esiti di una misura — i suoi autovalori — e puo' essere discreto (autovalori separati, autovettori in $\\mathcal H$), continuo (autovalori che riempiono un intervallo, autovettori non normalizzabili), o misto.","serve":"E' la quantita' che la fisica chiede davvero: scrivere l'hamiltoniana e trovarne lo spettro E' il problema d'esame. La distinzione discreto/continuo non e' tecnica — decide se un autostato e' uno stato preparabile (discreto) o una distribuzione che vive fuori dallo spazio di Hilbert (continuo), come l'onda piana e la delta.","esempio":"Per $\\sigma_z=\\begin{pmatrix}1&0\\\\0&-1\\end{pmatrix}$ lo spettro e' $\\{+1,-1\\}$, discreto, e i due invarianti della matrice lo riassumono senza risolvere l'equazione secolare: la somma degli autovalori e' la traccia, $\\operatorname{tr}\\sigma_z=0$, il loro prodotto e' il determinante, $\\det\\sigma_z=-1$. Per l'operatore posizione lo spettro e' tutta la retta reale, continuo, e gli autovettori sono delte di Dirac.","debito":"la costruzione rigorosa dello spettro continuo (teorema spettrale generalizzato, misura spettrale $E(\\lambda)$ di von Neumann) sta fuori da questo percorso: qui si dichiara che esiste e si lavora coi casi concreti. La separazione fra spettro continuo e spettro residuo non si tratta.","controllo":[{"tipo":"uguale","sinistra":"Matrix([[1,0],[0,-1]]).trace()","vale":"0","dove":"esempio","appare":"\\operatorname{tr}\\sigma_z=0"},{"tipo":"uguale","sinistra":"Matrix([[1,0],[0,-1]]).det()","vale":"-1","dove":"esempio","appare":"\\det\\sigma_z=-1"}],"qui":{},"pieno":null};
STRUM["misura-nulla"] = {"nome":"Insieme di misura nulla","riga":"$A$ ha misura nulla se per ogni $\\varepsilon\\gt0$ esiste una famiglia numerabile di cubi che lo ricopre e la cui somma dei volumi è minore di $\\varepsilon$: «trascurabile» non vuol dire piccolo, vuol dire coperto a costo arbitrariamente basso.","serve":"È la nozione che permette di dire «quasi ogni» senza teoria della misura completa: non serve costruire Lebesgue, basta la definizione col ricoprimento, ed è per questo che entra in geometria differenziale senza dipendenze. Tre proprietà fanno tutto il lavoro, e sono le sole che si usano: (a) un'unione **numerabile** di insiemi di misura nulla ha misura nulla — è ciò che consente di ragionare carta per carta su una varietà, che di carte ne ha una base numerabile; (b) avere misura nulla è **invariante per diffeomorfismi**, anzi per mappe lisce fra aperti della stessa dimensione, quindi è una proprietà che la varietà possiede indipendentemente dalle carte scelte; (c) un insieme di misura nulla ha **parte interna vuota**, quindi il suo complementare è denso: da «i valori cattivi hanno misura nulla» segue sempre «ce n'è uno buono comunque vicino». La numerabilità in (a) non è un dettaglio tecnico: l'unione **non** numerabile dei punti di $[0,1]$, ciascuno di misura nulla, è $[0,1]$.","esempio":"I razionali di $[0,1]$ hanno misura nulla, pur essendo densi. Si enumerano, $q_1,q_2,\\dots$ — si può, sono numerabili — e attorno a $q_n$ si mette un intervallo di lunghezza $\\varepsilon/2^{n}$. Il ricoprimento c'è per costruzione, e la somma delle lunghezze è $\\sum_{n\\ge1}\\varepsilon/2^{n}=\\varepsilon$, arbitrariamente piccola. Il conto che regge tutto è la serie geometrica: si spende un budget finito distribuendolo su infiniti punti, perché i pezzi decrescono in modo sommabile. Lo stesso conto, rovesciato, dà l'insieme di Cantor: al passo $k$ restano $2^{k}$ intervalli di lunghezza $3^{-k}$, per una misura totale $(2/3)^{k}$, e $\\lim_{k\\to\\infty}(2/3)^{k}=0$ — misura nulla pur essendo più che numerabile, il che mostra che «numerabile» e «di misura nulla» sono condizioni diverse e la prima è solo sufficiente.","debito":"la misura di Lebesgue vera — $\\sigma$-additività, misurabilità, insiemi non misurabili — sta fuori dal percorso, e qui non serve: in geometria differenziale di «misura» si usa soltanto l'ideale degli insiemi trascurabili. Il teorema di Fubini per la misura nulla («se quasi ogni fetta è trascurabile nella fetta, l'insieme è trascurabile») si usa nella dimostrazione di Sard ed è ammesso senza prova.","controllo":[{"tipo":"somma","espr":"eps/2**n","var":"n","da":"1","a":"oo","vale":"eps","ipotesi":{"eps":"positive","n":"positive"},"dove":"esempio","appare":"\\sum_{n\\ge1}\\varepsilon/2^{n}=\\varepsilon"},{"tipo":"uguale","sinistra":"2**k*3**(-k)","vale":"(2/3)**k","ipotesi":{"k":"positive"},"dove":"esempio","appare":"(2/3)^{k}"},{"tipo":"limite","espr":"(2/3)**k","var":"k","a":"oo","vale":"0","ipotesi":{"k":"positive"},"dove":"esempio","appare":"\\lim_{k\\to\\infty}(2/3)^{k}=0"}]};
STRUM["proiettore-ortogonale"] = {"nome":"Proiettore ortogonale","riga":"Un proiettore ortogonale e' un operatore $\\hat P$ che soddisfa due condizioni insieme: $\\hat P^2=\\hat P$ (idempotenza — proiettare due volte equivale a proiettare una volta) e $\\hat P^{\\dagger}=\\hat P$ (autoaggiuntezza, che rende la proiezione perpendicolare al sottospazio invece che obliqua).","serve":"E' il mattone di tutta la teoria della misura: $\\hat P=|\\psi\\rangle\\langle\\psi|$ su un ket normalizzato e' l'osservabile «lo stato e' $|\\psi\\rangle$?» con esiti $1$ e $0$, e il suo valor medio e' la probabilita'. L'identita' si scrive come somma di proiettori, $\\mathbb 1=\\sum_i\\hat P_i$, ed e' con questa che si cambia base e si decompone un'osservabile.","esempio":"Da $|\\psi\\rangle=(\\tfrac35,\\tfrac45)$ normalizzato si costruisce $\\hat P=|\\psi\\rangle\\langle\\psi|$ con entrate $\\tfrac{9}{25},\\tfrac{12}{25},\\tfrac{16}{25}$. L'elemento $(1,1)$ di $\\hat P^2$ vale $(\\tfrac{9}{25})^2+(\\tfrac{12}{25})^2=\\tfrac{9}{25}$, cioe' $\\hat P^2=\\hat P$; la traccia e' $\\tfrac{9}{25}+\\tfrac{16}{25}=1$, come per ogni proiettore di rango uno.","debito":"la decomposizione spettrale di un operatore autoaggiunto con spettro continuo in una famiglia di proiettori $E(\\lambda)$ (la misura spettrale) sta fuori da qui: si usa il caso discreto, dove i proiettori sono $|i\\rangle\\langle i|$.","controllo":[{"tipo":"simbolico","dove":"esempio","appare":"\\hat P^2=\\hat P","perche":"e' l'idempotenza, meta' della definizione di proiettore: un'identita' fra operatori, non un conto numerico. Il caso concreto che la sostiene e' l'entrata $(1,1)$ asserita qui sotto, dove i numeri ci sono"},{"tipo":"uguale","sinistra":"(Rational(9,25))**2+(Rational(12,25))**2","vale":"9/25","dove":"esempio","appare":"(\\tfrac{9}{25})^2+(\\tfrac{12}{25})^2=\\tfrac{9}{25}"},{"tipo":"uguale","sinistra":"Rational(9,25)+Rational(16,25)","vale":"1","dove":"esempio","appare":"\\tfrac{9}{25}+\\tfrac{16}{25}=1"}],"qui":{},"pieno":null};
STRUM["operatore-aggiunto"] = {"nome":"Operatore aggiunto e autoaggiunto","riga":"L'aggiunto e' definito da $\\langle\\phi|\\hat A\\psi\\rangle=\\langle\\hat A^{\\dagger}\\phi|\\psi\\rangle$ per ogni coppia di stati, e l'operatore e' autoaggiunto quando coincidono sia $\\hat A^{\\dagger}$ con $\\hat A$ sia i loro domini.","serve":"E' la condizione che rende un operatore un'osservabile: autovalori reali, e autovettori di autovalori distinti ortogonali. In dimensione finita «autoaggiunto» e «hermitiano» coincidono; in dimensione infinita no, e la differenza non e' pedanteria — l'operatore impulso su una semiretta e' hermitiano e non autoaggiunto, e infatti non e' un'osservabile.","esempio":"Se $\\hat A\\psi=a\\psi$ con $\\hat A$ autoaggiunto, allora $a\\langle\\psi|\\psi\\rangle=\\langle\\psi|\\hat A\\psi\\rangle=\\langle\\hat A\\psi|\\psi\\rangle=a^{*}\\langle\\psi|\\psi\\rangle$; siccome la norma non e' nulla segue $a=a^{*}$, cioe' l'autovalore e' reale. Tre righe, e sono la ragione per cui le osservabili si rappresentano cosi'.","debito":"la distinzione fra hermitiano e autoaggiunto in dimensione infinita — domini, estensioni, indici di difetto — e' il programma di von Neumann e sta fuori da questo percorso: qui si dichiara che esiste e si lavora nel caso buono. La regola di inversione dell'ordine nell'aggiunto di un prodotto si usa e non si dimostra.","controllo":[{"tipo":"uguale","sinistra":"conjugate(a)","vale":"a","ipotesi":{"a":"real"},"dove":"esempio","appare":"a=a^{*}"}],"qui":{},"pieno":null};
STRUM["integrale-gaussiano"] = {"nome":"Integrale gaussiano","riga":"$\\displaystyle\\int_{-\\infty}^{+\\infty} e^{-ax^{2}}\\,dx=\\sqrt{\\pi/a}$ per $a\\gt 0$, e $\\displaystyle\\int_{-\\infty}^{+\\infty} x^{2}e^{-ax^{2}}\\,dx=\\tfrac12\\sqrt{\\pi/a^{3}}$.","serve":"E' l'unico integrale che serve davvero sapere a memoria in meccanica statistica, perche' l'energia cinetica e' quadratica nell'impulso e quindi ogni integrazione sugli impulsi e' una gaussiana. Il trucco della dimostrazione — elevare al quadrato e passare in coordinate polari — vale la pena di vederlo una volta: e' il motivo per cui compare un $\\pi$ in una formula che di cerchi non parla.","esempio":"Da $I^{2}=\\iint e^{-a(x^{2}+y^{2})}dx\\,dy=\\int_0^\\infty 2\\pi r\\,e^{-ar^{2}}dr=\\pi/a$ segue $I=\\sqrt{\\pi/a}$. I momenti superiori si ottengono derivando rispetto ad $a$ sotto il segno: $-\\partial_a I=\\int x^{2}e^{-ax^{2}}dx=\\tfrac12\\sqrt{\\pi}\\,a^{-3/2}$. Derivare rispetto a un parametro e' piu' rapido che integrare per parti, e funziona per tutti i momenti pari.","debito":"il caso di esponente immaginario — l'integrale di Fresnel $\\int e^{iax^{2}}dx$, che si ottiene ruotando il cammino nel piano complesso e che in meccanica quantistica e' il propagatore libero — non sta qui: in tutte le gaussiane di questo percorso $a$ e' reale e positivo, e la convergenza non e' in discussione.","controllo":[{"tipo":"integrale","espr":"exp(-a*x**2)","var":"x","da":"-oo","a":"oo","vale":"sqrt(pi/a)","ipotesi":{"a":"positive","x":"real"},"dove":"riga","appare":"\\sqrt{\\pi/a}"},{"tipo":"integrale","espr":"x**2*exp(-a*x**2)","var":"x","da":"-oo","a":"oo","vale":"sqrt(pi/a**3)/2","ipotesi":{"a":"positive","x":"real"},"dove":"riga","appare":"\\tfrac12\\sqrt{\\pi/a^{3}}"},{"tipo":"integrale","espr":"2*pi*r*exp(-a*r**2)","var":"r","da":"0","a":"oo","vale":"pi/a","ipotesi":{"a":"positive","r":"positive"},"dove":"esempio","appare":"2\\pi r\\,e^{-ar^{2}}dr=\\pi/a"},{"tipo":"integrale","espr":"x**2*exp(-a*x**2)","var":"x","da":"-oo","a":"oo","vale":"sqrt(pi)*a**Rational(-3,2)/2","ipotesi":{"a":"positive","x":"real"},"dove":"esempio","appare":"\\tfrac12\\sqrt{\\pi}\\,a^{-3/2}"},{"tipo":"integrale","espr":"exp(-b*p**2/(2*m))","var":"p","da":"-oo","a":"oo","vale":"sqrt(2*pi*m/b)","ipotesi":{"b":"positive","m":"positive","p":"real"},"dove":"qui.meccanica-statistica.esempio","appare":"\\sqrt{2\\pi m/\\beta}"},{"tipo":"uguale","sinistra":"V/(h/sqrt(2*pi*m*k*T))**3","vale":"V*(2*pi*m*k*T)**Rational(3,2)/h**3","ipotesi":{"V":"positive","h":"positive","m":"positive","k":"positive","T":"positive"},"dove":"qui.meccanica-statistica.esempio","appare":"V/\\lambda^{3}"},{"tipo":"uguale","sinistra":"integrate(p**2/(2*m)*exp(-b*p**2/(2*m)),(p,-oo,oo))/integrate(exp(-b*p**2/(2*m)),(p,-oo,oo))","vale":"1/(2*b)","ipotesi":{"b":"positive","m":"positive","p":"real"},"dove":"qui.meccanica-statistica.esempio","appare":"1/2\\beta=\\tfrac12 kT"}],"pieno":null,"qui":{"meccanica-statistica":{"serve":"La funzione di partizione di una particella libera e' un prodotto di tre gaussiane negli impulsi, e da li' esce la lunghezza d'onda termica $\\lambda=h/\\sqrt{2\\pi m k T}$ — che e' la grandezza con cui si misura quando un gas smette di essere classico.","esempio":"$\\int e^{-\\beta p^{2}/2m}dp=\\sqrt{2\\pi m/\\beta}$, quindi $Z_{1}=\\dfrac{V}{h^{3}}(2\\pi mkT)^{3/2}=V/\\lambda^{3}$, che e' la stessa cosa scritta due volte perche' $\\lambda=h/\\sqrt{2\\pi mkT}$. Lo stesso integrale col peso $p^{2}$ da' $\\langle p^{2}/2m\\rangle=1/2\\beta=\\tfrac12 kT$ per grado di liberta': l'equipartizione non e' un principio a parte, e' questo integrale."}}};
STRUM["trasformata-di-fourier"] = {"nome":"Trasformata di Fourier","riga":"L'operazione $\\hat f(k)=\\int f(x)\\,e^{-ikx}\\,dx$, che riscrive una funzione come sovrapposizione di onde piane e manda la derivata in una moltiplicazione per $ik$.","serve":"È lo strumento che rende ALGEBRICA un'equazione differenziale lineare a coefficienti costanti: con $\\partial_x$ che diventa $ik$, un'equazione differenziale in $x$ diventa un'equazione algebrica in $k$, si risolve, e si antitrasforma. Le due cose da non perdere sono la convenzione dei $2\\pi$, che cambia da testo a testo e va dichiarata una volta, e Plancherel, che dice che la trasformata conserva la norma $L^{2}$ — in fisica, l'energia.","esempio":"La gaussiana $f(x)=e^{-x^{2}/2}$ ha trasformata $\\int_{-\\infty}^{+\\infty}e^{-x^{2}/2}e^{-ikx}\\,dx=\\sqrt{2\\pi}\\,e^{-k^{2}/2}$: ancora una gaussiana, tanto più larga quanto l'originale è stretta. È il caso in cui si vede meglio il principio di indeterminazione come fatto puramente matematico.","pieno":{"file":"15-distribuzioni.html","tappa":"02","come":"le proprietà, la derivata che diventa un prodotto e Plancherel, nel nucleo delle distribuzioni"},"qui":{"elettromagnetismo":{"serve":"Serve appena si scrive un'onda generica invece di una monocromatica: ogni soluzione delle equazioni di Maxwell nel vuoto è una sovrapposizione di onde piane $e^{i(\\mathbf k\\cdot\\mathbf x-\\omega t)}$, e la trasformata è il modo di scomporla. Su ciascuna componente l'equazione delle onde si riduce alla relazione di dispersione, e la propagazione diventa un far girare fasi: ogni modo viaggia da solo, e nel vuoto tutti alla stessa velocità — per questo un impulso non si deforma.","esempio":"La sostituzione $\\partial_x\\to ik$ e $\\partial_t\\to-i\\omega$ manda le derivate seconde in $(ik)^{2}=-k^{2}$ e $(-i\\omega)^{2}=-\\omega^{2}$: l'equazione delle onde diventa $\\omega^{2}=c^{2}k^{2}$, cioè un'equazione di secondo grado al posto di una differenziale, e la sua radice positiva $\\omega=ck$ è la relazione di dispersione del vuoto."}},"controllo":[{"tipo":"integrale","espr":"exp(-x**2/2)*exp(-I*k*x)","var":"x","da":"-oo","a":"oo","vale":"sqrt(2*pi)*exp(-k**2/2)","ipotesi":{"k":"real"},"dove":"esempio","appare":"\\sqrt{2\\pi}\\,e^{-k^{2}/2}"},{"tipo":"uguale","sinistra":"(I*k)**2","vale":"-k**2","ipotesi":{"k":"real"},"dove":"qui.elettromagnetismo.esempio","appare":"-k^{2}"},{"tipo":"uguale","sinistra":"(-I*w)**2","vale":"-w**2","ipotesi":{"w":"real"},"dove":"qui.elettromagnetismo.esempio","appare":"-\\omega^{2}"},{"tipo":"uguale","sinistra":"(c*k)**2","vale":"c**2*k**2","dove":"qui.elettromagnetismo.esempio","appare":"c^{2}k^{2}"}]};
STRUM["cambio-di-variabile"] = {"nome":"Cambio di variabile in una densità","riga":"Una densità non si trasforma sostituendo ma porta il jacobiano: se $y=f(x)$ allora $p_Y(y)=\\sum_i p_X(x_i)\\,/\\,|f'(x_i)|$, sommato su tutti i rami $x_i$ con $f(x_i)=y$.","serve":"È l'unico punto in cui una densità si comporta diversamente da una funzione, ed è l'errore che si ripete. Ciò che è invariante è la probabilità dell'evento, $p_Y(y)|dy|=p_X(x)|dx|$: la densità no, perché è una probabilità per unità di qualcosa, e passando da $x$ a $y$ quell'unità si dilata o si comprime. Scrivere $p_Y(y)=p_X(x(y))$ e basta è attraente e sbagliato. Si scova senza rifare il conto con due prove da cinque secondi: la normalizzazione non torna, e le dimensioni restano quelle della variabile di partenza.","esempio":"Una particella uniforme su un disco di raggio $R$: $p(x,y)=1/(\\pi R^2)$. Passando alla sola distanza dal centro, il jacobiano è l'elemento d'area radiale $2\\pi r$, e resta $p(r)=2r/R^2$ su $[0,R]$, che infatti si normalizza a $1$. Il valor medio è $\\langle r\\rangle=2R/3$ — non $R/2$, che è la risposta di chi tratta $r$ come uniforme. La differenza fra i due numeri è esattamente il fattore $r$, cioè il fatto che lontano dal centro c'è più area.","pieno":{"file":"ms-03-probabilita.html","tappa":"01","come":"la regola dedotta dall'invarianza della probabilità, i rami molteplici e il caso radiale, nel movimento ms-03 di Meccanica Statistica"},"qui":{"meccanica-statistica":{"serve":"È metà della domanda più frequente dello scritto: «calcolare la densità di probabilità dell'energia di singola particella», «la densità di particelle $\\rho(r)$». L'altra metà è la marginalizzazione. Le scritture $d^2r=2\\pi r\\,dr$ e $d^3r=4\\pi r^2dr$ non sono formule da ricordare: sono questo cambio di variabile con gli angoli già integrati, e saperlo deducere è ciò che salva quando la simmetria è cilindrica invece che sferica. Attenzione al doppio jacobiano: $p(r)$ è una densità rispetto a $r$, $\\rho(r)$ è una densità per unità di volume, e fra le due ce n'è un altro.","esempio":"L'energia cinetica in due dimensioni. La misura radiale nel piano degli impulsi è la derivata dell'area del disco, $2\\pi p$; la sostituzione $\\varepsilon=p^2/2m$ ha $d\\varepsilon/dp=p/m$, e il jacobiano cancella esattamente il fattore $p$. Per questo in $d=2$ la densità dell'energia è l'esponenziale pura $\\beta e^{-\\beta\\varepsilon}$, senza prefattore, mentre in $d=3$ resta un $\\sqrt{\\varepsilon}$. Da quel solo fattore dipendono tutte le differenze qualitative fra i gas quantistici in dimensioni diverse."}},"controllo":[{"tipo":"integrale","espr":"2*r/R**2","var":"r","da":"0","a":"R","vale":"1","ipotesi":{"r":"positive","R":"positive"},"dove":"esempio","appare":"p(r)=2r/R^2"},{"tipo":"integrale","espr":"r*2*r/R**2","var":"r","da":"0","a":"R","vale":"2*R/3","ipotesi":{"r":"positive","R":"positive"},"dove":"esempio","appare":"2R/3"},{"tipo":"derivata","espr":"pi*p**2","rispetto":["p"],"vale":"2*pi*p","ipotesi":{"p":"positive"},"dove":"qui.meccanica-statistica.esempio","appare":"2\\pi p"},{"tipo":"derivata","espr":"p**2/(2*m)","rispetto":["p"],"vale":"p/m","ipotesi":{"p":"positive","m":"positive"},"dove":"qui.meccanica-statistica.esempio","appare":"p/m"},{"tipo":"integrale","espr":"b*exp(-b*e)","var":"e","da":"0","a":"oo","vale":"1","ipotesi":{"b":"positive","e":"positive"},"dove":"qui.meccanica-statistica.esempio","appare":"\\beta e^{-\\beta\\varepsilon}"}]};
STRUM["derivazione"] = {"nome":"Derivazione (regola di Leibniz)","riga":"Un operatore lineare $D$ su un'algebra che rispetta la regola del prodotto: $D(fg)=f\\,D(g)+g\\,D(f)$. È la proprietà che isola «derivare» fra tutti gli operatori lineari possibili.","serve":"È il modo algebrico di definire la derivata senza limiti, e serve ogni volta che si vuole derivare su un oggetto dove non c'è un rapporto incrementale da fare — su una varietà astratta, su un'algebra di matrici, su un anello di polinomi. La conseguenza operativa più usata è che **una derivazione è determinata dai suoi valori sui generatori**: su $\\mathbb{R}^{n}$ basta sapere quanto vale sulle coordinate $x^{1},\\dots,x^{n}$, e da lì Leibniz e la linearità danno tutto il resto. È il motivo per cui un vettore tangente, definito come derivazione, si scrive sempre come combinazione delle $\\partial/\\partial x^{i}$: non perché lo si sia scelto, ma perché non c'è altro. Un secondo fatto, che si dimostra in due righe e si usa continuamente: la **composizione** di due derivazioni non è una derivazione (compaiono derivate seconde), ma la loro **differenza incrociata** $DE-ED$ lo è, perché i termini secondi si cancellano a coppie.","esempio":"Su $\\mathbb{R}$, l'operatore $d/dx$ verificato sul prodotto $f=x^{2}$ e $g=x^{3}$: la regola dice $x^{2}\\cdot3x^{2}+x^{3}\\cdot2x$, cioè $5x^{4}$, e la derivata diretta di $x^{5}$ dà lo stesso $5x^{4}$. Il conto è banale ed è il punto: Leibniz non aggiunge informazione su $\\mathbb{R}$, dove la derivata si sa già fare. Aggiunge informazione quando è l'unica cosa che si ha — per esempio sull'algebra delle matrici, dove $D(A)=MA-AM$ per una matrice fissata $M$ è una derivazione, e la verifica di Leibniz consiste nello sviluppare $M(AB)-(AB)M$ e riconoscerlo come somma di $A\\,D(B)$ e $D(A)\\,B$, cosa che riesce perché i due termini $AMB$ introdotti dallo sviluppo compaiono con segni opposti e si cancellano.","debito":"che le derivazioni in un punto di una varietà siano esattamente i vettori tangenti è il teorema di gd-06 e non si ripete qui; il caso delle algebre non commutative è citato come esempio e non sviluppato.","controllo":[{"tipo":"uguale","sinistra":"x**2*3*x**2+x**3*2*x","vale":"5*x**4","ipotesi":{"x":"real"},"dove":"esempio","appare":"5x^{4}"},{"tipo":"derivata","espr":"x**5","rispetto":["x"],"vale":"5*x**4","ipotesi":{"x":"real"},"dove":"esempio","appare":"derivata diretta di $x^{5}$"}]};
STRUM["operatore-unitario"] = {"nome":"Operatore unitario","riga":"Un operatore $\\hat U$ e' unitario quando $\\hat U^{\\dagger}\\hat U=\\hat U\\hat U^{\\dagger}=\\mathbb 1$, cioe' $\\hat U^{\\dagger}=\\hat U^{-1}$, il che equivale a conservare il prodotto interno: $\\langle \\hat U\\phi|\\hat U\\psi\\rangle=\\langle\\phi|\\psi\\rangle$ per ogni coppia di stati.","serve":"Conservare il prodotto interno vuol dire conservare le probabilita': ogni trasformazione fisica che non cambia gli esiti di una misura — un cambio di base, una traslazione, una rotazione, l'evoluzione temporale — e' unitaria. I suoi autovalori hanno modulo uno, e due osservabili legate da un operatore unitario hanno lo stesso spettro.","esempio":"La rotazione del piano $\\hat U=\\begin{pmatrix}\\cos\\theta&-\\sin\\theta\\\\\\sin\\theta&\\cos\\theta\\end{pmatrix}$ e' unitaria — il prodotto $\\hat U^{\\dagger}\\hat U$ ha sulla diagonale $\\cos^2\\theta+\\sin^2\\theta=1$ e zero fuori — e ha autovalori $e^{\\pm i\\theta}$, di modulo $|e^{i\\theta}|=1$. La matrice $S$ del cambio di base ortonormale e' unitaria per lo stesso motivo: manda una base ortonormale in un'altra.","debito":"la trasformata di Cayley $\\hat U=(\\hat A-i)/(\\hat A+i)$, che lega operatori autoaggiunti e unitari e con cui von Neumann risolve il problema agli autovalori in dimensione infinita, si cita e non si costruisce.","controllo":[{"tipo":"uguale","sinistra":"Abs(exp(I*theta))","vale":"1","ipotesi":{"theta":"real"},"dove":"esempio","appare":"|e^{i\\theta}|=1"},{"tipo":"uguale","sinistra":"Matrix([[cos(th),-sin(th)],[sin(th),cos(th)]]).T*Matrix([[cos(th),-sin(th)],[sin(th),cos(th)]])","vale":"Matrix([[1,0],[0,1]])","ipotesi":{"th":"real"},"dove":"esempio","appare":"\\cos^2\\theta+\\sin^2\\theta=1"}],"qui":{},"pieno":null};
STRUM["simmetrie"] = {"nome":"Simmetrie","riga":"L'insieme delle trasformazioni che lasciano identica la sorgente, e che perciò devono lasciare identico anche il campo che ne nasce.","serve":"È il ragionamento che decide la FORMA del campo prima di calcolarlo, e senza il quale la legge di Gauss non serve a niente: Gauss dà un solo numero — il flusso totale — e da un numero si ricava un campo soltanto se si sa già in che direzione punta e da quali variabili dipende. L'argomento ha una forma sola: se una trasformazione lascia identica la distribuzione di carica, lascia identico il campo; quindi ogni componente che quella trasformazione cambierebbe deve essere nulla, e ogni variabile che essa sposta non può comparire.","esempio":"Per un filo infinito uniformemente carico, la traslazione lungo il filo e la rotazione attorno a esso lasciano la carica identica: $\\mathbf E$ non può dipendere né da $z$ né dall'angolo. La riflessione nel piano perpendicolare al filo manderebbe $E_z$ in $-E_z$ lasciando uguale la sorgente, quindi $E_z=0$; resta la sola componente radiale $E_r(r)$. Solo a quel punto il cilindro coassiale è la superficie giusta, e Gauss dà $E_r\\cdot 2\\pi rL=\\dfrac{\\lambda L}{\\varepsilon_0}$, da cui $E_r=\\dfrac{\\lambda}{2\\pi\\varepsilon_0 r}$.","qui":{"meccanica-quantistica":{"serve":"Qui l'argomento di simmetria non decide la forma di un campo: decide la forma degli OPERATORI, ed è il modo in cui questo corso costruisce la teoria. Lo schema è lo stesso — una trasformazione che lascia identica la situazione fisica deve lasciare identica la descrizione — ma la conseguenza è più forte: ogni trasformazione di simmetria continua è realizzata da un operatore unitario, ogni operatore unitario continuo è l'esponenziale di un generatore autoaggiunto, e quel generatore è una quantità conservata. Impulso, momento angolare ed energia non si postulano: sono i generatori delle traslazioni, delle rotazioni e delle traslazioni temporali.","esempio":"Lo spazio è omogeneo, quindi traslare un sistema isolato non ne cambia la fisica: $\\hat U(a)=e^{-ia\\hat P/\\hbar}$ deve commutare con $\\hat H$. Al primo ordine in $a$ questo dà $[\\hat P,\\hat H]=0$, e quindi $\\dfrac{d}{dt}\\langle \\hat P\\rangle=0$: l'omogeneità dello spazio è la conservazione dell'impulso, e il passaggio da una all'altra è di due righe."}},"debito":"nessun nucleo del percorso tratta l'argomento di simmetria come strumento a sé: qui c'è la forma dell'argomento e non la sua giustificazione, che è di teoria dei gruppi e sta fuori dal percorso costruito finora. Quello che il percorso copre è il pezzo di destra — l'integrale di flusso, nel nucleo 03 tappa 04 — non il pezzo di sinistra che decide quale superficie scegliere.","controllo":[{"tipo":"uguale","sinistra":"(lam/(2*pi*e0*r))*2*pi*r*L","vale":"lam*L/e0","dove":"esempio","appare":"\\dfrac{\\lambda L}{\\varepsilon_0}"}]};
STRUM["spazio-di-hilbert"] = {"nome":"Spazio di Hilbert","riga":"E' uno spazio vettoriale complesso con prodotto interno, completo nella norma che ne deriva e separabile, cosicche' ogni stato si scrive come somma numerabile $|\\psi\\rangle=\\sum_n c_n|n\\rangle$ con $c_n=\\langle n|\\psi\\rangle$.","serve":"E' la casa degli stati, e le tre parole della definizione fanno tre lavori diversi. Il prodotto interno da' le ampiezze, e quindi le probabilita'. La completezza garantisce che il limite di una successione di stati sia ancora uno stato: senza, uno sviluppo in serie potrebbe convergere fuori dallo spazio. La separabilita' permette di scrivere un vettore con una lista numerabile di coefficienti, cioe' di fare i conti.","esempio":"La relazione di completezza $\\sum_n|n\\rangle\\langle n|=\\hat 1$ e' lo strumento operativo piu' usato della teoria: infilata dentro un prodotto scalare lo spezza in una somma. La norma diventa $\\langle\\psi|\\psi\\rangle=\\sum_n|c_n|^{2}$, e se lo stato e' normalizzato quella somma vale uno: i moduli quadri dei coefficienti sono probabilita', e sommano a uno per costruzione.","debito":"la costruzione di $L^{2}$ come completamento, la misura di Lebesgue che serve a definirlo e il teorema di Riesz-Fischer stanno nei movimenti di Metodi; qui si usa il risultato.","controllo":[{"tipo":"somma","espr":"(1/2)**n","var":"n","da":"1","a":"oo","vale":"1","ipotesi":{"n":"positive-integer"},"dove":"esempio","appare":"sommano a uno"},{"tipo":"simbolico","dove":"esempio","appare":"\\sum_n|n\\rangle\\langle n|=\\hat 1","perche":"e' la relazione di completezza: i proiettori sugli elementi di una base ortonormale sommano all'identita'. E' la proprieta' che definisce una base completa, non un conto"}],"qui":{},"pieno":null};
STRUM["delta-di-dirac"] = {"nome":"Delta di Dirac","riga":"Non è una funzione ma un funzionale, definito da $\\int f(x)\\,\\delta(x-a)\\,dx=f(a)$, che composto con una funzione si spezza sui suoi zeri come $\\delta(g(x))=\\sum_i \\delta(x-x_i)/|g'(x_i)|$.","serve":"Serve come macchina per cambiare variabile senza invertire nulla. La densità di $y=f(x)$ si scrive $p_Y(y)=\\int p_X(x)\\,\\delta(y-f(x))\\,dx$, e la delta produce da sola il fattore $1/|f'|$ che altrimenti andrebbe messo a mano: i rami molteplici si contano da soli invece di doverli ricordare. È la ragione pratica per cui il formalismo con la delta compare in ogni soluzione d'esame che tocchi una distribuzione, mentre il cambio di variabile esplicito compare quasi mai.","esempio":"$\\delta(x^2-a^2)$ con $a$ positivo. Gli zeri sono $x=\\pm a$; la derivata dell'argomento è $2x$, che in modulo vale $2a$ su entrambi. Quindi $\\delta(x^2-a^2)=\\dfrac{1}{2a}\\big[\\delta(x-a)+\\delta(x+a)\\big]$. Il caso si ripete identico in fisica statistica con $\\varepsilon=p^2/2m$ in una dimensione, dove i due rami $p=\\pm\\sqrt{2m\\varepsilon}$ contribuiscono entrambi — e dimenticarne uno dimezza la risposta.","pieno":{"file":"15-distribuzioni.html","tappa":"01","come":"le distribuzioni come funzionali, la delta e le sue proprietà, nel nucleo di Metodi"},"qui":{"meccanica-statistica":{"serve":"È lo strumento con cui si calcola la densità degli stati, cioè l'oggetto su cui poggia tutto il secondo tempo del corso: $g(\\varepsilon)=\\int d^dp\\,d^dq\\;\\delta(\\varepsilon-H)/h^d$. L'identità che si usa davvero non è la definizione ma questa: $\\delta(\\varepsilon-H)=\\partial_\\varepsilon\\,\\theta(\\varepsilon-H)$. Si scambia l'integrale con la derivata e ci si ritrova a calcolare il volume della regione dove l'hamiltoniana sta sotto $\\varepsilon$ — un integrale elementare — invece di un integrale con una delta dentro. La $g$ così ottenuta è pura geometria dello spazio delle fasi: non sa nulla della temperatura, e per que STRUM["teorema-della-divergenza"] = {"nome":"Teorema della divergenza","riga":"Il flusso uscente da una superficie chiusa è l'integrale della divergenza sul volume che racchiude: $\\oint_{\\partial V}\\mathbf F\\cdot\\hat n\\,dS=\\int_V\\nabla\\cdot\\mathbf F\\,dV$.","serve":"Scambia una domanda sul bordo con una sul volume. A destra c'è la divergenza, che è la densità di sorgente punto per punto; a sinistra il totale che esce. Si usa nei due versi: per calcolare un flusso scomodo con un integrale di volume comodo, e — in fisica soprattutto — per passare da una legge integrale a una legge locale, perché se due integrali di volume coincidono per OGNI volume allora coincidono gli integrandi.","esempio":"Per $\\mathbf F=\\mathbf r=(x,y,z)$ la divergenza vale $3$, quindi sulla palla di raggio $R$ il membro destro è $3\\cdot\\tfrac43\\pi R^{3}=4\\pi R^{3}$; il membro sinistro, calcolato come flusso, è il modulo $R$ per l'area $4\\pi R^{2}$, e dà lo stesso numero.","pieno":{"file":"05-teoremi-integrali.html","tappa":"02","come":"l'enunciato, la dimostrazione a fette e le ipotesi vere sul dominio, nel nucleo dei teoremi integrali"},"qui":{"elettromagnetismo":{"serve":"È il passaggio che trasforma la legge di Gauss integrale nella prima equazione di Maxwell, $\\nabla\\cdot\\mathbf E=\\rho/\\varepsilon_0$, e la conservazione della carica nell'equazione di continuità $\\nabla\\cdot\\mathbf J+\\partial_t\\rho=0$. La mossa è sempre la stessa: si scrive la legge su un volume arbitrario, si porta il flusso dentro come integrale di divergenza, e si osserva che un integrale nullo su OGNI volume obbliga l'integrando a essere nullo. L'arbitrarietà del volume non è un dettaglio: è tutta la dimostrazione.","esempio":"Per il campo di una carica puntiforme, di modulo $\\dfrac{q}{4\\pi\\varepsilon_0r^{2}}$ e diretto radialmente, la divergenza è nulla ovunque tranne nell'origine: in coordinate sferiche la divergenza di un campo radiale si scrive con $\\partial_r\\!\\left(r^{2}E_r\\right)$, function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';
  return h;
}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

/* ---------------- 00 · DI COSA PARLA QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Di cosa parla questo movimento', meta:'Meccanica Quantistica · voce Q.6 · tre risposte a uno scandalo · la delta dedotta, non postulata · lo spettro che si seleziona da se',
  blocchi:[
  {t:'prosa', title:'Uno scandalo in tre righe, e perché non si può aggirare', tag:'architettura', html:R`
  <p>Il movimento precedente ha chiuso l&rsquo;algebra: date due osservabili, il <span class="str" data-str="commutatore">commutatore</span> decide se esiste una base in cui entrambe hanno valore certo, e quando non esiste compare un pavimento sotto il prodotto delle indeterminazioni. Tutto quel lavoro poggiava su un fatto che il <span class="str" data-str="spettro">teorema spettrale</span> garantiva: un&rsquo;osservabile ha una base di autovettori, e lo stato si sviluppa su quella base. Questo movimento comincia togliendo quel fatto.</p>
  <p>Si consideri l&rsquo;operatore posizione $q$, e si cerchi un suo autovettore. In rappresentazione di Schrödinger l&rsquo;equazione $q|\psi\rangle=x'|\psi\rangle$ diventa $x\,\psi(x)=x'\psi(x)$, cioè</p>
  $$(x-x')\,\psi(x)=0\quad\text{per ogni }x.$$
  <p>Per $x\neq x'$ il primo fattore non è nullo, quindi $\psi(x)=0$. Resta il solo punto $x=x'$, che è un insieme di <span class="str" data-str="misura-nulla">misura nulla</span>: in $L^2$ una funzione nulla fuori da un punto è <i>la</i> funzione nulla, e il vettore nullo non è un autovettore. <b>L&rsquo;operatore posizione non ha nessun autovettore nello spazio di Hilbert.</b> Non «pochi», non «difficili da trovare»: nessuno. Lo stesso vale per l&rsquo;impulso, e Picasso le chiama per questo «osservabili <i>patologiche</i> nel senso che non hanno autovalori e autovettori» (pag. stampata 118).</p>
  <p>E però $|x'\rangle$ si scrive ogni giorno, $\langle x|\psi\rangle=\psi(x)$ è la funzione d&rsquo;onda, $\langle x|p\rangle$ è l&rsquo;onda piana, e nessuno di questi conti sbaglia. <b>Questo movimento è il luogo in cui si capisce perché.</b> Non è una nota tecnica da leggere una volta e dimenticare: la risposta, nella sua forma matura, decide quali soluzioni dell&rsquo;equazione di Schrödinger per una particella libera siano accettabili — e quindi <i>che l&rsquo;energia sia reale e non negativa</i>, che è un fatto fisico e non una convenzione.</p>`},
  {t:'prosa', title:'Tre risposte, tutte vive, e nessuna è l’approssimazione delle altre', tag:'architettura', html:R`
  <p>Lo scandalo ha tre soluzioni storiche, e la cosa notevole è che nessuna ha vinto cancellando le altre. Un manuale moderno le comprime in un paragrafo di avvertenze; qui si tengono tutte e tre perché <b>ciascuna fa un lavoro che le altre non fanno</b>.</p>
  <p><b>Dirac (1930) allarga la nozione di funzione.</b> Nei <i>Principi</i> il problema viene dichiarato con precisione a pag. stampata 79: in una rappresentazione ortogonale è naturale normalizzare i vettori fondamentali, «<i>tuttavia, è possibile normalizzarli solo se i parametri che li indicano assumono tutti dei valori discreti</i>»; se i parametri sono continui i vettori «<i>sono quindi di lunghezza infinita</i>», e serve «<i>qualche altro procedimento</i>» — che Dirac annuncia come «<i>un nuovo formalismo matematico</i>», e che è la funzione $\delta$ del paragrafo successivo. Dirac non tira a indovinare: sa esattamente che cosa sta rompendo, e si impone da solo il limite di sicurezza.</p>
  <p><b>von Neumann (1932) rifiuta la $\delta$ e riscrive l&rsquo;equazione.</b> Nei <i>Mathematical Foundations</i> il fallimento è enunciato senza attenuanti: risolvere il problema agli autovalori nel senso della meccanica quantistica richiederebbe di trovare abbastanza soluzioni da formarne un sistema ortonormale completo, «<i>but this is not possible in general</i>», perché per una parte delle soluzioni l&rsquo;integrale del modulo quadro non è finito — «<i>therefore it does not belong to Hilbert space</i>» (pag. stampata 68). La sua risposta non è estendere il concetto di funzione: è <i>cambiare l&rsquo;equazione</i>, sostituendo gli autovettori con una famiglia di <span class="str" data-str="proiettore-ortogonale">proiettori</span> $E(\lambda)$. E nella stessa pagina in cui dichiara il fallimento, <b>definisce lo spettro continuo</b> — per negazione, ed è la definizione che si usa ancora.</p>
  <p><b>Gel&rsquo;fand (1964) equipaggia lo spazio.</b> Trent&rsquo;anni dopo, la terza via dà ragione a Dirac senza dare torto a von Neumann: si costruisce una terna $\Omega\subset\mathcal H\subset\Omega^{\times}$ in cui il teorema spettrale <i>generalizzato</i> garantisce l&rsquo;esistenza di un insieme completo di autovettori — fuori da $\mathcal H$, dentro $\Omega^{\times}$. Ballentine la presenta nel §1.4 e dichiara la propria preferenza con un argomento pratico: la seconda via «<i>is likely to grow in popularity because it permits full use of Dirac&rsquo;s bra and ket formalism</i>» (pag. stampata 28).</p>
  <p>E c&rsquo;è una quarta voce, che non è storica ma fisica, ed è Picasso nel §6.9: <b>la patologia si guarisce anche senza matematica nuova</b>, costruendo l&rsquo;osservabile $q_\Delta$ che misura la posizione a scatti di ampiezza $\Delta$ — cioè quello che fa un regolo graduato — e dimostrando che $q_\Delta$ converge a $q$ <i>in norma</i>. Gli autovettori impropri si guadagnano «<i>il diritto di cittadinanza nella teoria</i>» perché sono limiti di oggetti fisicamente realizzabili.</p>`},
  {t:'prosa', title:'Come è fatto il movimento', tag:'architettura', html:R`
  <p><b>La rotta.</b> La tappa 01 dimostra la rottura e la definisce: la dimostrazione in tre righe, la successione di gaussiane che tenta di essere un autovettore e la cui norma diverge, e la definizione di spettro continuo di von Neumann. La 02 costruisce la $\delta$ come la costruisce Dirac, con le sue proprietà dimostrate e non elencate, e con la rappresentazione integrale che tornerà due tappe dopo. La 03 segue Picasso nel punto in cui la $\delta$ non viene <i>postulata</i> ma <b>dedotta</b>: posta l&rsquo;incognita $\langle x|x'\rangle=g(x,x')$, si cerca quale $g$ faccia funzionare la completezza, e la risposta è un oggetto che non è una funzione. La 04 calcola la funzione di trasformazione $\langle x|p\rangle$ per due strade — l&rsquo;equazione differenziale di Dirac e la normalizzazione alla delta di Picasso — e riconcilia le tre notazioni che le fonti usano per la stessa costante. La 05 monta le due rappresentazioni, verifica il commutatore canonico in entrambe, e calcola la gaussiana e la sua trasformata. La 06 risponde alla domanda che quasi nessun corso pone: <i>perché</i> l&rsquo;impulso è $-i\hbar\,\partial/\partial x$, e dove quella forma <b>smette di valere</b>. La 07 costruisce la risposta di von Neumann e, accanto, l&rsquo;osservabile a scala di Picasso. La 08 costruisce lo spazio equipaggiato con tre esempi espliciti di funzioni che stanno in uno dei tre spazi e non nell&rsquo;altro. La 09 è il punto in cui tutto questo paga: la particella libera, lo spettro selezionato dall&rsquo;appartenenza a $\Omega^{\times}$, e la degenerazione spiegata dalla parità. La 10 torna alla fisica — flusso di probabilità, condizioni di raccordo, la funzione d&rsquo;onda che non è un campo, e la distribuzione d&rsquo;impulso <i>misurata</i> in laboratorio.</p>
  <p><b>Che cosa questo movimento non fa.</b> Non deriva gli operatori $q$ e $p$ dalle simmetrie dello spazio-tempo: la tappa 06 usa il fatto che $P$ è il generatore delle traslazioni come <i>ipotesi</i>, perché la derivazione di quel fatto è il cuore di un altro lavoro, ed è dichiarata come prestito. Non risolve problemi con potenziale: la buca a gradino della tappa 10 compare solo per mostrare da dove viene la cuspide nel limite di barriera infinita, e il tunnel non si calcola. Non tratta lo spettro discreto di una hamiltoniana legata, se non per contrasto nella tappa 07. E non tratta il momento angolare: il termine $L^2/r^2$ della tappa 06 compare perché serve a esibire la forma di $P_r$, non per il suo spettro.</p>`}
]},

/* ---------------- 01 · DOVE IL FORMALISMO SI ROMPE ---------------- */
{ num:'01', title:'Dove il formalismo si rompe, e come si chiama la rottura', meta:'la dimostrazione in tre righe · la successione che non converge in norma · lo spettro continuo definito per negazione',
  blocchi:[
  {t:'prosa', title:'Che cosa garantiva il teorema spettrale, e che cosa non garantisce', tag:'costruzione', html:R`
  <p>In dimensione finita un <span class="str" data-str="operatore-aggiunto">operatore autoaggiunto</span> si diagonalizza: esiste una base ortonormale di autovettori, gli autovalori sono reali, e ogni vettore si scrive come combinazione. In dimensione infinita la stessa frase è <i>parzialmente</i> vera, e tutto questo movimento sta nel «parzialmente».</p>
  <p>La parte che resta vera è la decomposizione in proiettori, e si vedrà nella tappa 07. La parte che cade è l&rsquo;esistenza degli autovettori. von Neumann lo dimostra come un fatto di teoria degli operatori a pag. stampata 67-68, e vale la pena seguire il suo ordine perché è il più pulito: data l&rsquo;equazione</p>
  $$H\varphi=\lambda\varphi$$
  <p>si osserva prima che gli autovalori sono automaticamente reali — $(H\varphi,\varphi)=\lambda(\varphi,\varphi)=\lambda$ con $\|\varphi\|=1$, e il primo membro è reale perché $H$ è hermitiano — e poi che autovettori con autovalori distinti sono ortogonali. Se si scegliesse un $\varphi_\lambda$ di norma unitaria per ogni $\lambda$ risolubile, questi formerebbero un insieme ortonormale, dunque una successione finita o infinita numerabile. <b>La domanda è se quella successione sia completa</b>, e la risposta è no: «<i>but this is not possible in general</i>».</p>
  <p>Il motivo, nelle parole di von Neumann, è esattamente quello che si vede nel caso della posizione: per una parte delle soluzioni — e sono quelle che servirebbero per sviluppare ogni funzione d&rsquo;onda — «<i>there exists no finite value for the integral of the square of the absolute value. Therefore it does not belong to Hilbert space. Hence there is no complete orthonormal set of solutions in Hilbert space (and we consider Hilbert spaces only in E!)</i>». La parentesi finale, con il punto esclamativo, è il tono di chi sta chiudendo una porta: l&rsquo;equazione agli autovalori è <i>posta</i> in $\mathcal H$, e in $\mathcal H$ non si risolve.</p>`},
  {t:'reveal', title:'La dimostrazione per l’operatore posizione, e perché non ha scappatoie', tag:'costruzione', steps:[
   {label:'Le tre righe', body:R`
   <p>L&rsquo;argomento generale di von Neumann diventa concretissimo sulla posizione. L&rsquo;azione dell&rsquo;operatore $Q$ sullo spazio delle funzioni è data dalla (4.2) di Ballentine (pag. stampata 97): moltiplicare per la coordinata,</p>
   $$Q_\alpha\psi(x)=x_\alpha\psi(x),$$
   <p>e la ragione è immediata: $\langle x|Q_\alpha|\psi\rangle=x_\alpha\langle x|\psi\rangle$, cioè l&rsquo;operatore agisce sul suo autovalore. Cercare un autovettore significa allora risolvere $x\psi(x)=x'\psi(x)$ con $x'$ fissato, cioè</p>
   $$(x-x')\,\psi(x)=0\quad\text{per ogni }x.$$
   <p>Il fattore $(x-x')$ si annulla <i>solo</i> in $x=x'$. Quindi $\psi(x)=0$ per ogni $x\neq x'$. Ma un elemento di $L^2$ è una classe di funzioni uguali quasi ovunque, e un punto solo è un insieme di <span class="str" data-str="misura-nulla">misura nulla</span>: la funzione descritta <i>è</i> l&rsquo;elemento nullo di $L^2$, indipendentemente dal valore che le si assegna in $x'$. E il vettore nullo soddisfa qualunque equazione agli autovalori, quindi non ne risolve nessuna.</p>`},
   {label:'Le due scappatoie, e perché sono chiuse', body:R`
   <p><b>Prima scappatoia: assegnare a $\psi(x')$ un valore infinito.</b> È la tentazione naturale, ed è esattamente la mossa che Dirac farà — ma non dentro $L^2$. In $L^2$ un valore puntuale non esiste come dato: due funzioni che differiscono in un punto sono lo stesso vettore. Perché il valore in $x'$ conti bisogna <i>uscire</i> dallo spazio, e uscire è una decisione che va dichiarata, non una svista da sanare.</p>
   <p><b>Seconda scappatoia: il limite di una successione.</b> Si può costruire una successione di funzioni sempre più concentrate attorno a $x'$ e sperare che il limite sia l&rsquo;autovettore. La successione esiste e si scrive subito; il limite non sta in $\mathcal H$, e il conto che lo mostra è nel passo seguente. Vale la pena farlo perché è <i>la stessa</i> successione con cui Dirac costruirà la $\delta$: il limite che qui è il problema, lì diventa la definizione.</p>`},
   {label:'Il conto che chiude la seconda scappatoia', body:R`
   <p>Si prenda la gaussiana centrata nell&rsquo;origine di larghezza $\sigma$, normalizzata come <i>densità</i> — cioè con integrale uno, non con norma uno. L'<span class="str" data-str="integrale-gaussiano">integrale gaussiano</span> dà</p>
   $$\int_{-\infty}^{+\infty}\frac{1}{\sigma\sqrt{2\pi}}\,e^{-x^{2}/2\sigma^{2}}\,dx=1,$$
   <p>e questa successione, al tendere di $\sigma$ a zero, si concentra attorno all&rsquo;origine mantenendo area unitaria: è il candidato autovettore. Ma la domanda giusta non è quanto valga l&rsquo;area: è quanto valga la <b>norma in $L^2$</b>, perché è quella che decide l&rsquo;appartenenza allo spazio. Il quadrato della funzione è una gaussiana di larghezza $\sigma/\sqrt2$ moltiplicata per $1/(2\pi\sigma^2)$, e il suo integrale è</p>
   $$\int_{-\infty}^{+\infty}\Big(\frac{1}{\sigma\sqrt{2\pi}}\Big)^{2}e^{-x^{2}/\sigma^{2}}\,dx=\frac{1}{2\sqrt{\pi}\,\sigma}.$$
   <p>Il risultato dipende da $\sigma$ come $1/\sigma$, e</p>
   $$\lim_{\sigma\to0}\frac{1}{2\sqrt{\pi}\,\sigma}=+\infty.$$
   <p><b>Ecco la differenza cruciale, e va letta due volte:</b> la successione converge benissimo come <i>densità</i> — l&rsquo;area resta uno — e diverge come <i>vettore</i>. Le due nozioni di convergenza non coincidono, e $\mathcal H$ è definito dalla seconda. Picasso fa la stessa osservazione da un altro lato a pag. stampata 120, e la fa con una precisione che vale registrare: «<i>mentre le funzioni che approssimano la $\delta$ di Dirac hanno una norma $L_2$ che diverge (come $\Delta$) al tendere a zero di $\Delta$, le norme $L_2$ delle funzioni d&rsquo;onda corrispondenti ai vettori $|x'_\Delta\rangle$ restano finite</i>». Sono due successioni diverse che convergono allo stesso oggetto formale, e una delle due è fisicamente realizzabile.</p>`}
  ]},
  {t:'plot', title:'La successione che converge in area e diverge in norma',
   intro:R`<p>Tre gaussiane normalizzate ad area uno, con $\sigma=1$, $\sigma=1/3$, $\sigma=1/9$. Tutte e tre hanno lo stesso integrale; i loro <i>quadrati</i> no.</p>`,
   plots:[{kind:'func2d', xr:[-2.5,2.5], yr:[0,4.2], height:250, ticks:true,
     title:'le densità: area 1 per tutte e tre',
     curves:[{f:'Math.exp(-x*x/2)/Math.sqrt(2*Math.PI)', col:'#5aa9ff', width:2, label:'σ = 1'},
             {f:'3*Math.exp(-9*x*x/2)/Math.sqrt(2*Math.PI)', col:'#ffc24a', width:2, label:'σ = 1/3'},
             {f:'9*Math.exp(-81*x*x/2)/Math.sqrt(2*Math.PI)', col:'#ff6b8a', width:2, label:'σ = 1/9'}],
     xlabel:'x', ylabel:'ψ(x)'}],
   leggi:R`<p><b>Che cosa guardare.</b> Le tre curve hanno aree uguali: il picco cresce esattamente quanto la larghezza si restringe, perché l&rsquo;altezza va come $1/\sigma$ e la base come $\sigma$. È questa compensazione a far convergere la successione come densità.</p>
   <p><b>Che cosa impararne.</b> Il quadrato <i>non</i> compensa. L&rsquo;altezza al quadrato va come $1/\sigma^{2}$ e la base resta $\sigma$, quindi l&rsquo;integrale del quadrato cresce come $1/\sigma$ — ed è il conto $1/(2\sqrt\pi\,\sigma)$ appena fatto. Guardando il disegno si vede la causa: l&rsquo;area sotto la curva rossa è uguale a quella sotto la blu, ma la rossa è <i>nove volte più alta</i>, e un quadrato punisce l&rsquo;altezza due volte e premia la larghezza una volta sola. Questo è l&rsquo;intero contenuto della frase «la posizione non ha autovettori in $L^2$»: non è una sottigliezza di teoria della misura, è uno squilibrio di potenze.</p>`},
  {t:'reveal', title:'Lo spettro continuo, definito per negazione', tag:'costruzione', steps:[
   {label:'La definizione di von Neumann', body:R`
   <p>A questo punto von Neumann fa una cosa che vale più di un teorema: <b>battezza il fallimento</b>. Alla pagina 68, subito dopo aver constatato che non esiste un insieme ortonormale completo di soluzioni in $\mathcal H$, scrive: «<i>If it occurs; i.e., if the orthonormal set selected from the solutions of E is not complete, then we may say that a &ldquo;continuous spectrum of H&rdquo; exists.</i>» E aggiunge fra parentesi che i $\lambda_1,\lambda_2,\dots$ risolubili «<i>form the &ldquo;point&rdquo; or &ldquo;discrete&rdquo; spectrum of H</i>».</p>
   <p>Si noti la struttura logica, perché è diversa da come lo spettro continuo viene presentato nella maggior parte dei corsi. Non si dice: «alcuni operatori hanno autovalori che formano un intervallo invece di un insieme discreto». Si dice: <b>lo spettro continuo è ciò che manca</b> — la parte dello spettro che le soluzioni dell&rsquo;equazione agli autovalori non riescono a coprire. È una definizione per difetto, e questo spiega perché per descriverla serva un apparato nuovo: non si tratta di contare autovalori in più, si tratta di <i>dire qualcosa di un oggetto che non ha autovettori</i>.</p>
   <p>Nella stessa pagina von Neumann annuncia la mossa: «<i>Our next problem, since E has failed, is then to find an improved formulation of the eigenvalue problem for Hermitian operators</i>», seguendo «<i>a pattern set by Hilbert</i>». Quella formulazione migliorata è la famiglia di proiettori della tappa 07.</p>`},
   {label:'Il criterio operativo di Picasso: che cosa si accetta e che cosa no', body:R`
   <p>von Neumann dà la definizione astratta; per riconoscere uno spettro continuo in un problema concreto serve un criterio sulle funzioni, e Picasso lo dà a pag. stampata 128 trattando l&rsquo;equazione di Schrödinger unidimensionale. L&rsquo;equazione</p>
   $$-\frac{\hbar^{2}}{2m}\psi''(x)+V(x)\psi(x)=E\,\psi(x)$$
   <p>è lineare omogenea del secondo ordine, e come tale «<i>ammette soluzioni (anzi: due soluzioni indipendenti) qualunque sia il valore di $E$, reale o complesso</i>». Questo è il punto da non perdere: <b>le soluzioni ci sono sempre</b>, per ogni $E$. Quello che manca non sono le soluzioni, è un criterio per scartarne la maggior parte. Picasso ne elenca due, e corrispondono alle due parti dello spettro:</p>
   <p>(i) le soluzioni che <b>appartengono a $L_2$</b> e in particolare tendono a zero all&rsquo;infinito sono le autofunzioni <i>proprie</i>, corrispondono agli stati legati, e i loro $E$ sono i livelli energetici discreti;</p>
   <p>(ii) le soluzioni che, non essendo $L_2$, <b>si mantengono limitate</b> per $x\to\pm\infty$ sono le autofunzioni <i>improprie</i>, e i loro $E$ formano lo spettro continuo.</p>
   <p>Il criterio (ii) è ciò che risponde alla domanda d&rsquo;esame che la mappa di questo corso registra — <i>esistono autofunzioni limitate non normalizzabili di $H$?</i> — e la risposta è sì, sono precisamente queste. Ma <b>da dove viene il criterio «limitate»?</b> Picasso, un paragrafo prima, è onesto fino in fondo: stabilire fra quali funzioni cercare le autofunzioni improprie «<i>non è un problema di facile soluzione ed è anche un problema molto tecnico, per cui non lo discuteremo in generale</i>» (pag. stampata 121). Lo risolve in un caso particolare e ne trae indicazioni. La risposta generale è lo spazio equipaggiato della tappa 08, e lì «limitate» non sarà più un criterio imposto ma una <i>conseguenza</i> dell&rsquo;appartenenza a $\Omega^{\times}$.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`La dimostrazione che $q$ non ha autovettori usa il fatto che un punto ha misura nulla. In uno spazio di dimensione finita l&rsquo;argomento analogo funzionerebbe?`,
    a:R`No, e il confronto chiarisce dov&rsquo;è la rottura. In $\mathbb C^{n}$ l&rsquo;operatore «moltiplica per la coordinata» è la matrice diagonale $\mathrm{diag}(x_1,\dots,x_n)$, e i suoi autovettori sono i versori della base: il vettore con un uno nella posizione $k$ e zeri altrove è un autovettore legittimo con autovalore $x_k$. Quello che manca in dimensione infinita non è l&rsquo;idea — è che in $L^2$ «un uno in una posizione e zeri altrove» <i>non è un vettore</i>, perché le posizioni sono un continuo e una di esse ha misura nulla. La rottura non viene dall&rsquo;infinità delle dimensioni in sé: viene dal fatto che l&rsquo;indice è continuo. Un operatore autoaggiunto in dimensione infinita <i>numerabile</i> con spettro discreto, come l&rsquo;hamiltoniana dell&rsquo;oscillatore armonico, ha tutti i suoi autovettori in $\mathcal H$ e nessun problema.`},
   {q:R`Si dice spesso che la relazione di indeterminazione «spiega» perché non esistono autostati della posizione. È corretto?`,
    a:R`È un&rsquo;osservazione vera che però non è una dimostrazione, e confonderle costa. Un autostato della posizione avrebbe $\Delta x=0$, quindi $\Delta p=\infty$, quindi energia cinetica media infinita: è un argomento fisico eccellente, e Dirac lo usa — a pag. stampata 136 dice che un autostato di $p$ o di $q$ non si può ottenere in pratica «<i>nel primo caso per limitazioni di spazio, e nel secondo per limitazioni di energia</i>». Ma un&rsquo;energia infinita è un&rsquo;impossibilità <i>fisica</i>, e la dimostrazione di questa tappa è <i>matematica</i>: in $L^2$ quel vettore non esiste, punto. La differenza conta perché le due affermazioni hanno conseguenze diverse. L&rsquo;argomento energetico suggerisce che $|x'\rangle$ sia un&rsquo;idealizzazione irraggiungibile ma concettualmente sensata — ed è esattamente la lettura che Picasso rende precisa nella tappa 07 con gli autostati approssimati. L&rsquo;argomento matematico dice che la scrittura $q|x'\rangle=x'|x'\rangle$ è, preso alla lettera dentro $\mathcal H$, mal formato — ed è ciò che obbliga a un formalismo nuovo.`},
   {q:R`Se le soluzioni dell&rsquo;equazione di Schrödinger esistono per ogni $E$ anche complesso, perché nessuno si preoccupa che l&rsquo;energia possa essere complessa?`,
    a:R`Perché quasi tutti i corsi risolvono il problema senza accorgersene, imponendo che $H$ sia autoaggiunto e deducendo che il suo spettro è reale — il che è corretto, ma sposta la domanda: autoaggiunto <i>su quale dominio</i>? E soprattutto non basta a selezionare le soluzioni una per una, perché il criterio «è autoaggiunto» è una proprietà dell&rsquo;operatore, non un filtro sulle funzioni. La tappa 09 mostra il caso in cui il problema si manifesta in pieno: per la particella libera, $e^{ikx}$ risolve l&rsquo;equazione per ogni $k$ complesso, e <b>la normalizzazione non può scartarne nessuna, perché l&rsquo;integrale del modulo quadro diverge in tutti i casi</b>. Serve un criterio che distingua fra funzioni non normalizzabili, e quel criterio è l&rsquo;appartenenza a $\Omega^{\times}$. Il fatto che l&rsquo;energia di una particella libera sia reale e non negativa è, in quella costruzione, un <i>risultato</i>.`}
  ]}
]},

/* ---------------- 02 · LA PRIMA RISPOSTA: DIRAC ALLARGA LA NOZIONE DI FUNZIONE ---------------- */
{ num:'02', title:'La prima risposta: Dirac allarga la nozione di funzione', meta:'il §15 dei Principi · la funzione impropria e il limite che Dirac si impone · le proprietà dimostrate · la rappresentazione integrale',
  blocchi:[
  {t:'prosa', title:'Un formalismo costruito per uno scopo, e dichiarato come tale', tag:'costruzione', html:R`
  <p>Dirac arriva alla $\delta$ con un problema preciso in mano, e lo dice: le considerazioni del §10 «<i>ci hanno portato a prendere in esame quantità che implicano un certo tipo di infinità</i>», e «<i>allo scopo di avere un formalismo preciso per trattare queste infinità</i>» introduce una quantità $\delta(x)$ che soddisfa due condizioni:</p>
  $$\delta(x)=0\ \ \text{per }x\neq0,\qquad\int_{-\infty}^{+\infty}\delta(x)\,dx=1.$$
  <p>Si legga la motivazione, perché è l&rsquo;opposto di come la $\delta$ viene di solito presentata. Non è un trucco di calcolo trovato per caso: è uno <b>strumento costruito su commessa</b>, per un problema identificato quattro paragrafi prima — la normalizzazione dei vettori fondamentali quando i parametri che li indicano sono continui. Il formalismo arriva dopo il problema, e il problema è quello della tappa 01.</p>`},
  {t:'reveal', title:'La costruzione come limite, e la frase che fissa il limite d’uso', tag:'costruzione', steps:[
   {label:'Che cosa significa quella definizione', body:R`
   <p>Dirac dà subito l&rsquo;idea concreta: si consideri una funzione della variabile reale $x$ che si annulli dovunque tranne in un piccolo dominio di lunghezza $\varepsilon$ attorno all&rsquo;origine, e che dentro quel dominio sia tanto grande che il suo integrale valga $1$. L&rsquo;esempio minimo è la funzione a scalino di altezza $1/\varepsilon$, e il conto che ne verifica l&rsquo;area è immediato:</p>
   $$\int_{-\varepsilon/2}^{+\varepsilon/2}\frac{1}{\varepsilon}\,dx=1.$$
   <p>Poi aggiunge l&rsquo;osservazione che rende la definizione robusta, e che è la vera ragione per cui la $\delta$ funziona: «<i>L&rsquo;esatta forma della funzione entro il dominio non ha importanza, purché non vi siano variazioni troppo brusche (per esempio purché la funzione sia sempre dell&rsquo;ordine di $\varepsilon^{-1}$). Allora il limite di questa funzione per $\varepsilon\to0$ sarà $\delta(x)$.</i>»</p>
   <p>Questo spiega perché la gaussiana della tappa 01, lo scalino di questa, e il nucleo di Dirichlet che si vedrà sotto siano <i>la stessa cosa</i> nel limite: tutte e tre hanno area uno, tutte e tre si concentrano, e nessuna delle tre forme particolari sopravvive al limite. Ciò che sopravvive è l&rsquo;<b>azione</b> sulle funzioni continue, che è il passo successivo.</p>`},
   {label:'La proprietà che vale per tutte, e la sua dimostrazione', body:R`
   <p>«<i>La più importante proprietà di $\delta(x)$</i>» — sono le parole di Dirac — è</p>
   $$\int_{-\infty}^{+\infty}f(x)\,\delta(x)\,dx=f(0)$$
   <p>per $f$ generica funzione continua. E la dimostrazione, che Dirac fa in due righe, è la ragione per cui la forma del picco non conta: il primo membro «<i>può dipendere solo dai valori di $f(x)$ molto vicini all&rsquo;origine, cosicché possiamo sostituire $f(x)$ con il suo valore nell&rsquo;origine, $f(0)$, senza apprezzabile errore</i>». Fatta la sostituzione, $f(0)$ esce dall&rsquo;integrale e resta $\int\delta(x)\,dx$, che vale $1$ per la seconda delle due condizioni di definizione.</p>
   <p><b>Dove sta il contenuto di questa dimostrazione.</b> Non nel calcolo — non c&rsquo;è calcolo — ma in <i>che cosa si assume</i>: che l&rsquo;integrale dipenda solo dai valori di $f$ vicino all&rsquo;origine. Quell&rsquo;assunzione è vera per ciascuna delle approssimanti e diventa esatta nel limite, ed è l&rsquo;unica cosa che serve. Da qui in avanti la $\delta$ <b>non è più definita dai suoi valori ma dalla sua azione</b>: è un oggetto che prende una funzione e restituisce un numero. Nel linguaggio moderno è un funzionale lineare continuo, e questa è la definizione corretta; Dirac arriva alla sostanza nel 1930 e la chiama con il nome che la tradisce il meno possibile.</p>
   <p>Effettuando un cambio di origine si deduce subito la forma traslata, $\int f(x)\delta(x-a)dx=f(a)$, che è quella che si usa dalla tappa 03 in avanti.</p>`},
   {label:'Il battesimo, e il limite che Dirac si impone da solo', body:R`
   <p>Subito dopo aver dimostrato la proprietà, Dirac mette in chiaro lo status dell&rsquo;oggetto, e lo fa in un passaggio che vale leggere nella sua forma originale perché contiene <i>sia</i> l&rsquo;ammissione <i>sia</i> la regola di sicurezza:</p>
   <p style="padding-left:1.2em;border-left:3px solid rgba(120,160,255,.45)"><i>&laquo;La $\delta(x)$ non è una funzione di $x$ secondo la definizione matematica usuale di funzione, che richiede che una funzione abbia un valore definito in ciascun punto del suo dominio, ma è qualcosa di più generale, che noi possiamo chiamare &ldquo;funzione impropria&rdquo; per indicare la sua differenza da una funzione definita nella maniera usuale. Così $\delta(x)$ non è una quantità che possa essere usata in generale nell&rsquo;analisi matematica come una funzione ordinaria, ma il suo uso deve essere ristretto ad alcuni semplici tipi di espressione per cui sia ovvio che non possa sorgere alcuna contraddizione.&raquo;</i> &mdash; Dirac, §15, pag. stampata 80</p>
   <p>Questa è la riga che va tenuta, perché smonta il luogo comune secondo cui Dirac avrebbe usato la $\delta$ con leggerezza e von Neumann sarebbe arrivato a mettere ordine. Dirac <b>sa</b> che non è una funzione, lo scrive, e invece di fingere rigore propone un patto: si usa solo dove è ovvio che non nascono contraddizioni. È una regola d&rsquo;uso, non una dimostrazione — e il motivo per cui von Neumann non la accetta è precisamente che «è ovvio» non è un criterio. Ma il nome «funzione impropria» è, a suo modo, più onesto del nome moderno: dichiara nel titolo che l&rsquo;oggetto non è ciò che sembra.</p>`}
  ]},
  {t:'reveal', title:'Le due proprietà che dimostrano che non è una funzione, e la carica puntiforme', tag:'esempio', steps:[
   {label:'La dimostrazione di Picasso, che è un’implicazione e non un’osservazione', body:R`
   <p>Picasso, a pag. stampata 114, ricava le proprietà della $\delta$ nel verso opposto a Dirac: non la definisce, la <i>trova</i> (è la tappa 03), e poi ne deduce il carattere. Il ragionamento è un&rsquo;implicazione in due passi, e vale riportarlo perché è una dimostrazione vera.</p>
   <p><b>Primo passo: $\delta(x)=0$ per $x\neq0$</b>, a meno di un insieme di misura nulla. Si prende come funzione di prova una $\psi$ che valga $1$ in un intervallo $A$ <i>che non contiene l&rsquo;origine</i> e zero fuori. Dalla relazione che definisce la $\delta$ segue $\int_A\delta(x)\,dx=0$, e questo vale «<i>qualunque sia $A$</i>» purché non contenga l&rsquo;origine: una funzione il cui integrale è nullo su ogni intervallo che eviti un punto è nulla fuori da quel punto.</p>
   <p><b>Secondo passo: l&rsquo;integrale vale uno.</b> Si prende ora l&rsquo;intervallo $A$ a cavallo dell&rsquo;origine, con $\psi=1$ dentro: si ottiene $\int_A\delta(x)\,dx=\psi(0)=1$, «<i>qualunque sia l&rsquo;ampiezza dell&rsquo;intervallo $A$</i>» — e quindi anche per $A$ esteso a tutto l&rsquo;asse.</p>
   <p>Messe insieme, le due conclusioni sono incompatibili con l&rsquo;essere una funzione, e Picasso lo scrive con un punto esclamativo che è l&rsquo;unico di quella pagina: «<i>Queste due proprietà mostrano chiaramente che $\delta(x)$ non è una funzione: nessuna funzione è diversa da zero solo in un punto ($x=0$) ed ha integrale uguale ad 1!</i>» Si noti la struttura: è una <b>dimostrazione per assurdo del fatto che l&rsquo;oggetto cercato non esiste fra le funzioni</b>. Non si scopre che la $\delta$ è strana; si dimostra che il posto dove la si cercava è vuoto.</p>`},
   {label:'Perché non è strano: la carica puntiforme', body:R`
   <p>E qui Picasso aggiunge il paragone che toglie alla faccenda ogni aria di paradosso, e che è il motivo per cui un fisico non si spaventa: «<i>Si pensi ad una carica elettrica unitaria puntiforme posta nell&rsquo;origine; ovviamente in questo caso la distribuzione (o densità) di carica $\rho(r)$ non è definita (come funzione), ma se proprio insistiamo per definirla allora chiaramente $\rho(x)=0$ per $x\neq0$ ed inoltre $\int\rho(x)\,dx=1$, cioè $\rho(x)$ ha le stesse proprietà della $\delta(x)$.</i>»</p>
   <p>Questo è il punto da portare all&rsquo;esame se la domanda arriva. <b>La $\delta$ non è un&rsquo;anomalia della meccanica quantistica: è l&rsquo;oggetto che la fisica usa da sempre ogni volta che tratta una quantità finita concentrata in un punto.</b> La carica di un elettrone, la massa di un punto materiale, l&rsquo;impulso trasferito in un urto istantaneo: in ognuno di questi casi la «densità» non è una funzione, e nessuno ha mai considerato la cosa scandalosa. Per questo si dice che $\delta$ è una <b>distribuzione</b>, e «funzione impropria» è il nome che le dà Dirac.</p>
   <p>Il paragone dice anche <i>perché</i> il formalismo funziona: la densità di carica puntiforme non si usa mai da sola, si usa sempre integrata — contro un potenziale, contro un volume. È esattamente la restrizione d&rsquo;uso che Dirac si impone.</p>`},
   {label:'Le due proprietà di calcolo che serviranno', body:R`
   <p>Due regole, e si usano entrambe nelle tappe 04 e 05.</p>
   <p><b>La parità.</b> Picasso osserva che l&rsquo;equazione che definisce la $\delta$ «<i>è ancora soddisfatta se a $\delta(x-x')$ si sostituisce $\delta(-x+x')$</i>», da cui</p>
   $$\delta(x)=\delta(-x).$$
   <p>Non è un&rsquo;identità fra valori — non ci sono valori — ma fra azioni: le due distribuzioni fanno la stessa cosa su ogni funzione di prova.</p>
   <p><b>Il riscalamento.</b> La regola è</p>
   $$\delta(ax)=\frac{1}{|a|}\,\delta(x),$$
   <p>e si verifica su una qualunque successione approssimante, perché la forma non conta. Prendendo la gaussiana di larghezza $\varepsilon$ e sostituendo $x\to ax$:</p>
   $$\int_{-\infty}^{+\infty}\frac{1}{\varepsilon\sqrt{\pi}}\,e^{-(ax)^{2}/\varepsilon^{2}}\,dx=\frac{1}{a}$$
   <p>per $a>0$, dove la funzione integranda è quella che per $a=1$ ha area uno. Comprimere l&rsquo;argomento di un fattore $a$ divide l&rsquo;area per $a$, e per ripristinarla serve il fattore $1/|a|$ davanti. Questa regola sembra una minuzia e non lo è: è quella che nella tappa 04 traduce $\delta(p-p')$ in $\delta(k-k')$ e produce il fattore $\hbar$ che distingue le normalizzazioni di Picasso e Ballentine.</p>`}
  ]},
  {t:'reveal', title:'La rappresentazione integrale, e il nucleo che la realizza', tag:'costruzione', steps:[
   {label:'Perché serve, e che cos’è', body:R`
   <p>C&rsquo;è una terza approssimante della $\delta$, diversa dalle due viste, e serve perché è <i>quella che compare da sola</i> nei conti delle tappe successive. Si tronchi l&rsquo;integrale di Fourier a $|k|\le L$ e si calcoli:</p>
   $$\frac{1}{2\pi}\int_{-L}^{+L}e^{ikx}\,dk=\frac{\sin(Lx)}{\pi x}.$$
   <p>Il conto è elementare: la primitiva di $e^{ikx}$ in $k$ è $e^{ikx}/(ix)$, e la differenza fra i due estremi dà $2\sin(Lx)/x$, che diviso $2\pi$ è il risultato. La funzione che ne esce si chiama <b>nucleo di Dirichlet</b>, e ha le due proprietà di un&rsquo;approssimante: area uno,</p>
   $$\int_{-\infty}^{+\infty}\frac{\sin(Lx)}{\pi x}\,dx=1,$$
   <p>e concentrazione crescente, perché il suo valore al centro è</p>
   $$\lim_{x\to0}\frac{\sin(Lx)}{\pi x}=\frac{L}{\pi}$$
   <p>e cresce senza limite con $L$. Nel limite $L\to\infty$ si ottiene quindi la relazione che si userà costantemente,</p>
   $$\int_{-\infty}^{+\infty}e^{ikx}\,dk=2\pi\,\delta(x),$$
   <p>cioè la <span class="str" data-str="trasformata-di-fourier">trasformata di Fourier</span> della funzione costante.</p>`},
   {label:'La differenza che conta: questa approssimante oscilla', body:R`
   <p>Il nucleo di Dirichlet si distingue dalle altre due approssimanti per un tratto che non è estetico: <b>non è positivo</b>. Oscilla, cambia segno infinite volte, e la sua convergenza alla $\delta$ è più delicata — l&rsquo;integrale del <i>modulo</i> non è uno, e diverge logaritmicamente con $L$.</p>
   <p>Questo è il luogo in cui si capisce perché Dirac, nel §23, debba fare una cosa apparentemente arbitraria. Calcolando il prodotto scalare di due autoket dell&rsquo;impulso si imbatte in un integrale di cui dice, senza giri di parole, che «<i>non converge secondo la definizione usuale di convergenza</i>» (pag. stampata 130). La sua soluzione:</p>
   <p style="padding-left:1.2em;border-left:3px solid rgba(120,160,255,.45)"><i>&laquo;Per rimettere in ordine la nostra teoria, adottiamo una nuova definizione di convergenza per un integrale il cui dominio si estende fino all&rsquo;infinito, definizione analoga a quella adottata dal Cesàro per la somma di una serie infinita.&raquo;</i> &mdash; Dirac, §23, pag. stampata 130</p>
   <p>Concretamente: un integrale il cui integrando all&rsquo;estremo superiore oscilli come $\cos(aq')$ o $\sin(aq')$ con $a$ reale non nullo si considera nullo, «<i>cioè si prende il valor medio delle oscillazioni</i>». Ed è un <b>atto di decisione, non una deduzione</b>: per salvare il teorema di ortogonalità si cambia il significato di un integrale. Dirac lo dichiara, dice quale proprietà vuole preservare e quale prezzo paga — l&rsquo;estensione delle condizioni al contorno ammesse per i rappresentativi, che ora possono oscillare all&rsquo;infinito invece di annullarsi.</p>
   <p>Si tenga a mente questo passaggio quando nella tappa 07 arriverà von Neumann: il suo rifiuto non riguarda la $\delta$ come oggetto, riguarda <i>questo</i> — l&rsquo;idea che si possa ridefinire la convergenza quando serve.</p>`}
  ]},
  {t:'plot', title:'Tre approssimanti della stessa delta, e una che oscilla',
   intro:R`<p>Il nucleo di Dirichlet $\sin(Lx)/(\pi x)$ per $L=5,15,40$. Confrontare con il disegno della tappa 01: là le curve erano tutte positive, qui no.</p>`,
   plots:[{kind:'func2d', xr:[-2,2], yr:[-4,14], height:260, ticks:true,
     title:'il nucleo di Dirichlet: area 1, ma non positivo',
     curves:[{f:'Math.abs(x)<1e-6?5/Math.PI:Math.sin(5*x)/(Math.PI*x)', col:'#5aa9ff', width:2, label:'L = 5'},
             {f:'Math.abs(x)<1e-6?15/Math.PI:Math.sin(15*x)/(Math.PI*x)', col:'#ffc24a', width:1.6, label:'L = 15'},
             {f:'Math.abs(x)<1e-6?40/Math.PI:Math.sin(40*x)/(Math.PI*x)', col:'#ff6b8a', width:1.2, label:'L = 40'}],
     xlabel:'x', ylabel:'sin(Lx)/(πx)'}],
   leggi:R`<p><b>Che cosa guardare.</b> Il picco centrale sale come $L/\pi$ — a $L=40$ vale circa $12{,}7$, ed è il valore che l&rsquo;asserzione sul limite in zero dà esattamente. Ma intorno al picco ci sono lobi negativi, e non si attenuano al crescere di $L$: si stringono e restano alti. L&rsquo;area totale è uno perché i lobi si cancellano a coppie, non perché siano piccoli.</p>
   <p><b>Che cosa impararne.</b> Questa curva è la ragione per cui la $\delta$ va trattata come un&rsquo;azione e non come un limite puntuale. Nel punto $x=0{,}1$ la curva rossa vale circa $-0{,}9$ e la gialla circa $+2$: <i>nel singolo punto il limite non esiste</i>, continua a oscillare. Quello che converge è l&rsquo;integrale contro una funzione continua, perché le oscillazioni vicine si mediano fra loro. Ed è esattamente il meccanismo che Dirac eleva a definizione di convergenza con il riferimento a Cesàro: prendere il valor medio delle oscillazioni invece di pretendere un limite punto per punto.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Se la forma dell&rsquo;approssimante «non ha importanza», perché la gaussiana, lo scalino e il nucleo di Dirichlet non sono interscambiabili in ogni conto?`,
    a:R`Perché «non ha importanza» vale per il <i>limite</i>, non per ogni $\varepsilon$ finito, e in un conto reale l&rsquo;approssimante compare quasi sempre con un parametro finito. La differenza pratica è il segno: gaussiana e scalino sono positivi, quindi l&rsquo;integrale del modulo coincide con l&rsquo;integrale e vale uno; il nucleo di Dirichlet oscilla, e l&rsquo;integrale del suo modulo diverge con $L$. Questo significa che la convergenza del nucleo di Dirichlet richiede che la funzione di prova sia un po&rsquo; più regolare — basta che sia continua e integrabile, ma non basta che sia limitata. In pratica si usa quella che il problema fornisce: Fourier produce il nucleo di Dirichlet, e la restrizione del dominio di prova è esattamente il prezzo che Dirac paga con la convergenza alla Cesàro.`},
   {q:R`La regola $\delta(ax)=|a|^{-1}\delta(x)$ sembra dire che la $\delta$ non è invariante per cambio di scala. Che cosa è invariante, allora?`,
    a:R`Il prodotto $\delta(x)\,dx$. È il modo giusto di leggere la regola, e spiega perché la $\delta$ sia una <i>densità</i> e non una funzione: sotto un <span class="str" data-str="cambio-di-variabile">cambio di variabile</span> $x\to y=ax$ si ha $dy=a\,dx$, e il fattore $1/|a|$ davanti alla $\delta$ è precisamente quello che compensa lo jacobiano. Un&rsquo;espressione come $\int\delta(ax)f(x)\,dx$ dà $f(0)/|a|$, e il $1/|a|$ non è un&rsquo;anomalia della $\delta$: è lo stesso fattore che compare in qualunque integrale di densità dopo un riscalamento. Praticamente: le identità con la $\delta$ si controllano sempre verificando le <i>dimensioni</i>, perché $\delta$ ha le dimensioni dell&rsquo;inverso del suo argomento. Questo è anche l&rsquo;errore più frequente nei conti di normalizzazione, e la tappa 04 lo incontra nella forma $\delta(\hbar k-\hbar k')=\hbar^{-1}\delta(k-k')$.`},
   {q:R`Dirac dice che l&rsquo;uso della $\delta$ «deve essere ristretto ad alcuni semplici tipi di espressione per cui sia ovvio che non possa sorgere alcuna contraddizione». Quale espressione <i>non</i> è lecita?`,
    a:R`L&rsquo;esempio canonico è $\delta(x)^2$, o più in generale il prodotto di due distribuzioni nello stesso punto. La ragione si vede subito con le approssimanti: il quadrato della gaussiana di larghezza $\varepsilon$ ha integrale che va come $1/\varepsilon$ e diverge — è il conto della tappa 01 con un altro nome — quindi non esiste alcuna distribuzione a cui $\delta^2$ converga. E non è una curiosità accademica: $\langle x'|x'\rangle=\delta(0)$ è già fuori dal recinto, e quando nella tappa 03 si scriverà $\langle x|x'\rangle=\delta(x-x')$ sarà importante ricordare che quell&rsquo;espressione si usa solo <i>integrata</i>. Lecito è invece tutto ciò che è lineare nella $\delta$ e integrato contro una funzione regolare: $\int f\delta$, $\int f(x)\delta(x-a)dx$, e la convoluzione. La teoria delle distribuzioni di Schwartz, vent&rsquo;anni dopo Dirac, dimostra esattamente questo: lo spazio delle distribuzioni è uno spazio vettoriale su cui il prodotto <i>non</i> si estende.`}
  ]}
]},

/* ---------------- 03 · LA DELTA NON SI POSTULA: SI DEDUCE ---------------- */
{ num:'03', title:'La delta non si postula: si deduce dalla completezza', meta:'il §6.7 di Picasso · gli autovettori impropri · la completezza come equazione con incognita · piu gradi di liberta',
  blocchi:[
  {t:'prosa', title:'Il verso giusto del ragionamento', tag:'costruzione', html:R`
  <p>La tappa precedente ha seguito Dirac: si <i>introduce</i> la $\delta$ perché serve, si verifica che funziona, si dichiara il limite d&rsquo;uso. È il verso storico, ed è onesto. Ma c&rsquo;è un secondo verso, ed è quello che Picasso segue nel §6.7, che è molto più soddisfacente: <b>non si postula niente, e la $\delta$ esce da sola come l&rsquo;unica risposta possibile a una domanda ben posta</b>.</p>
  <p>La differenza non è di stile. Nel verso di Dirac, chi legge deve accettare un oggetto nuovo e fidarsi che sia coerente. Nel verso di Picasso, l&rsquo;oggetto nuovo è <i>costretto</i>: si scrive un&rsquo;equazione con un&rsquo;incognita, si risolve, e la soluzione non è una funzione. A quel punto non c&rsquo;è niente da accettare — c&rsquo;è solo da prendere atto che la domanda fatta ha una risposta che vive fuori dalle funzioni.</p>`},
  {t:'reveal', title:'I vettori impropri, e la scrittura che ha «solo un significato formale»', tag:'costruzione', steps:[
   {label:'Come Picasso li introduce, e con quale avvertenza', body:R`
   <p>Picasso arriva ai vettori impropri da una relazione che vale per <i>veri</i> vettori di $\mathcal H$: la (6.33), che esprime un generico $|A\rangle$ in termini di un&rsquo;integrazione sulle coordinate. Poiché quella relazione è vera per ogni $|A\rangle$, si <i>pone</i>, come abbreviazione,</p>
   $$q_i|x\rangle=x_i|x\rangle,$$
