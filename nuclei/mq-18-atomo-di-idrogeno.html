/* ---------------- 00 · DI COSA PARLA QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Di cosa parla questo movimento', meta:'Meccanica Quantistica · voce Q.19 · il solo atomo risolto per intero · uno spettro che Bohr aveva già scritto · una degenerazione che le rotazioni non spiegano · le cose che servono all esame',
  blocchi:[
  {t:'prosa', title:'Il problema più importante, risolto una volta', tag:'architettura', html:R`
  <p>Griffiths introduce la formula dei livelli dell&rsquo;idrogeno come <i>«by any measure the most important result in all of quantum mechanics»</i>, e Shankar chiude il suo capitolo dicendo che tutte le correzioni successive sono <i>«icing on the cake»</i>: <i>«the simple nonrelativistic Schrödinger equation by itself provides an excellent description of the hydrogen spectrum»</i>. È anche uno dei pochissimi sistemi realistici che si risolvono esattamente; Griffiths, davanti alle autofunzioni normalizzate, scrive: <i>«They are not pretty, but don&rsquo;t complain, this is one of the very few realistic systems that can be solved at all, in exact closed form»</i>.</p>
  <p>Negli scritti del corso l&rsquo;idrogeno compare soprattutto come sfondo: la hamiltoniana è $p^{2}/2\mu-e^{2}/r$ più qualcosa, e le prime funzioni radiali sono stampate fra le formule utili. Per questo il movimento dà la soluzione per intero una volta, e poi consegna le cose che servono davvero: lo spettro, la degenerazione $n^{2}$, le $R_{nl}$ più basse, i valori medi delle potenze di $r$. Il resto è la ragione per cui l&rsquo;idrogeno è speciale.</p>
  <p>La ragione è una degenerazione in più. In ogni potenziale centrale i livelli sono degeneri $2l+1$ volte, per le rotazioni. Nell&rsquo;idrogeno l&rsquo;energia dipende solo da $n$, e livelli con $l$ diversi coincidono. Landau la chiama <i>«accidentale»</i>, Shankar dice che il nome è <i>«a misnomer»</i>, Sakurai che <i>«it is in fact not accidental but, rather, reflects a subtle symmetry of the Coulomb potential»</i>. Le fonti danno tre letture della stessa cosa: le orbite classiche chiuse, una costante del moto in più (il vettore di Lenz), una simmetria più grande delle rotazioni, quella delle rotazioni in quattro dimensioni. Il movimento le mette a confronto.</p>`},
  {t:'prosa', title:'Come è fatto il movimento', tag:'architettura', html:R`
  <p><b>Il primo blocco è la soluzione.</b> La tappa 01 fissa le scale: raggio di Bohr, costante di struttura fine, rydberg, e il calcolo dimensionale che dà l&rsquo;energia giusta per caso. La 02 risolve l&rsquo;equazione radiale con la serie, nelle quattro varianti delle fonti, e mostra perché la serie deve fermarsi. La 03 è lo spettro: la formula di Rydberg, le serie spettrali, il confronto con le misure.</p>
  <p><b>Il secondo blocco è la degenerazione.</b> La 04 la conta e ne dà la lettura classica di Picasso. La 05 costruisce il vettore di Lenz e la simmetria di Pauli e Fock, e ricava i livelli senza risolvere l&rsquo;equazione di Schrödinger. La 06 mostra che il problema si separa anche in coordinate paraboliche, un altro segno della simmetria in più.</p>
  <p><b>Il terzo blocco è quello che serve all&rsquo;esame.</b> La 07 dà le funzioni radiali, con le convenzioni dei polinomi di Laguerre che cambiano da libro a libro. La 08 le dimensioni dell&rsquo;atomo, i valori medi, il teorema del viriale e le stime dall&rsquo;indeterminazione. La 09 risolve per intero un compito vero. La 10 dice che cosa il modello lascia fuori. La 11 confronta le fonti e chiude con le domande d&rsquo;orale.</p>
  <p><b>Che cosa il movimento non fa.</b> Non calcola la struttura fine né l&rsquo;effetto Stark, che sono perturbazioni su questi livelli; non tratta lo spettro continuo oltre a dire che esiste. Usa lo spin solo nel compito della tappa 09.</p>`}
]},
/* ---------------- 01 · LE SCALE ---------------- */
{ num:'01', title:'La hamiltoniana e le scale dell atomo', meta:'dal problema a due corpi alla particella di massa ridotta · raggio di Bohr e rydberg · la costante di struttura fine · le unità atomiche di Landau · un argomento dimensionale che indovina troppo',
  blocchi:[
  {t:'prosa', title:'La hamiltoniana', tag:'impostazione', html:R`
  <p>L&rsquo;atomo di idrogeno è un elettrone e un protone. Ballentine parte dalla hamiltoniana dei due corpi e passa alle coordinate del centro di massa e relative, con l&rsquo;osservazione che il cambio di variabili <i>«is an example of a canonical transformation»</i>; il centro di massa <i>«behaves as a free particle, and its motion is not coupled to the relative coordinate»</i>, e resta il problema di una particella di massa ridotta $\mu$ nel potenziale coulombiano:</p>
  $$H=\frac{\mathbf p^{2}}{2\mu}-\frac{Ze^{2}}{r},\qquad\frac1\mu=\frac{1}{m_{e}}+\frac{1}{m_{p}} .$$
  <p>Le unità sono gaussiane, come in Landau, Sakurai, Shankar e Ballentine; Griffiths scrive $e^{2}/4\pi\epsilon_{0}$ al posto di $e^{2}$. Shankar fa notare che $m_{e}/m_{p}\approx1/1836$, e risolve prima con il protone fermo, $\mu=m_{e}$, rimandando la correzione al confronto con le misure. Per uno ione con un solo elettrone e carica nucleare $Ze$ basta sostituire $e^{2}\to Ze^{2}$: Ballentine nota che <i>«the energies scale as $Z^{2}$, and the lengths (including the Bohr radius $a_{0}$) scale as $Z^{-1}$»</i>.</p>`},
  {t:'prosa', title:'Le scale, e i numeri da ricordare', tag:'numeri', html:R`
  <p>Con $\hbar$, $\mu$ ed $e^{2}$ si costruisce una sola lunghezza e una sola energia. La lunghezza è il <span class="str" data-str="raggio-di-bohr">raggio di Bohr</span> e l&rsquo;energia l&rsquo;unità atomica:</p>
  $$a_{0}=\frac{\hbar^{2}}{\mu e^{2}}\approx0{,}529\ \text{Å},\qquad\frac{e^{2}}{a_{0}}=\frac{\mu e^{4}}{\hbar^{2}}\approx27{,}2\ \mathrm{eV}.$$
  <p>Landau chiama unità coulombiane quelle in cui massa, lunghezza ed energia sono $\mu$, $a_{0}$ ed $e^{2}/a_{0}$, e osserva che per l&rsquo;elettrone coincidono con le unità atomiche: si passa alle formule in unità atomiche <i>«ponendo $e=1$, $m=1$, $\hbar=1$»</i>; metà dell&rsquo;unità di energia, $13{,}6$ eV, <i>«si dice rydberg»</i>.</p>
  <p>Shankar insegna a ricordare tutto con un numero puro, la costante di struttura fine $\alpha=e^{2}/\hbar c\approx1/137$, <i>«since it is dimensionless, its numerical value has an absolute significance»</i>. Con $mc^{2}\approx511$ keV si ottengono l&rsquo;energia del fondamentale e il raggio di Bohr:</p>
  $$E_{1}=-\frac12\alpha^{2}mc^{2}\approx-13{,}6\ \mathrm{eV},\qquad a_{0}=\frac{\hbar}{mc\,\alpha}.$$
  <p>La prima formula dice anche perché la meccanica quantistica non relativistica funziona così bene: l&rsquo;energia di legame è una parte su $2\cdot137^{2}\approx37\,500$ dell&rsquo;energia a riposo, e la velocità tipica dell&rsquo;elettrone è $v/c\approx\alpha$. Le correzioni relativistiche sono dell&rsquo;ordine di $\alpha^{2}$ rispetto ai livelli.</p>`},
  {t:'reveal', title:'Un argomento dimensionale che indovina troppo', tag:'Ballentine', steps:[
   {label:'Il conto', body:R`
   <p>L&rsquo;argomento che si trova in molti libri: se l&rsquo;elettrone è confinato in una regione di raggio $r$, il suo impulso è dell&rsquo;ordine di $\hbar/r$, e l&rsquo;energia vale circa</p>
   $$E(r)\sim\frac{\hbar^{2}}{2\mu r^{2}}-\frac{e^{2}}{r}.$$
   <p>Il minimo è in $r=\hbar^{2}/\mu e^{2}=a_{0}$, e il valore minimo è $-\mu e^{4}/2\hbar^{2}$: esattamente l&rsquo;energia del fondamentale.</p>`},
   {label:'Perché non bisogna farsi impressionare', body:R`
   <p>Ballentine lo riporta e lo smonta: <i>«You should not be impressed by the fact that this crude argument led to the exact ground state energy. All that should be expected is an order-of-magnitude estimate that is neither an upper nor a lower bound»</i>. E distingue con cura: <i>«many arguments that purport to be based on the uncertainty principle are really order-of-magnitude dimensional arguments»</i>. Le relazioni di indeterminazione vere danno disuguaglianze strette, e nella tappa 08 si vede quale, e di quanto è soddisfatta dall&rsquo;idrogeno. La coincidenza esatta dipende dalla scelta $p=\hbar/r$ invece di $p=2\hbar/r$ o di qualunque altro fattore: con $p=\hbar/2r$ il minimo sarebbe quattro volte più profondo.</p>`}
  ]}
]},
/* ---------------- 02 · LA SOLUZIONE ---------------- */
{ num:'02', title:'La soluzione: una serie che deve fermarsi', meta:'togliere i due comportamenti estremi · la ricorrenza a due termini · perché la serie non può continuare · il numero quantico principale · quattro versioni della stessa strada',
  blocchi:[
  {t:'reveal', title:'La strada di Griffiths, passo per passo', tag:'derivazione', steps:[
   {label:'Variabili adimensionali', body:R`
   <p>L&rsquo;equazione radiale per $u=rR$ è</p>
   $$-\frac{\hbar^{2}}{2\mu}\frac{d^{2}u}{dr^{2}}+\Big[-\frac{e^{2}}{r}+\frac{\hbar^{2}}{2\mu}\frac{l(l+1)}{r^{2}}\Big]u=Eu .$$
   <p>Per gli stati legati $E\lt0$, e Griffiths pone $\kappa=\sqrt{-2\mu E}/\hbar$, $\rho=\kappa r$ e $\rho_{0}=2\mu e^{2}/\hbar^{2}\kappa$. L&rsquo;equazione diventa</p>
   $$\frac{d^{2}u}{d\rho^{2}}=\Big[1-\frac{\rho_{0}}{\rho}+\frac{l(l+1)}{\rho^{2}}\Big]u .$$
   <p>Tutta la fisica sta nel parametro $\rho_{0}$, che contiene l&rsquo;energia.</p>`},
   {label:'Il comportamento ai due estremi', body:R`
   <p>Per $\rho\to\infty$ domina la costante, e $u\sim Ae^{-\rho}+Be^{\rho}$, con $B=0$ perché $e^{\rho}$ non si normalizza. Per $\rho\to0$ domina il termine centrifugo, e $u\sim C\rho^{l+1}+D\rho^{-l}$, con $D=0$. Griffiths stacca entrambi i comportamenti:</p>
   $$u(\rho)=\rho^{l+1}e^{-\rho}\,v(\rho),$$
   <p>e la funzione $v$ soddisfa</p>
   $$\rho\frac{d^{2}v}{d\rho^{2}}+2(l+1-\rho)\frac{dv}{d\rho}+\big[\rho_{0}-2(l+1)\big]v=0 .$$
   <p>In nota spiega perché valga la pena: senza il fattore $e^{-\rho}$ <i>«you get a three-term recursion formula, involving $c_{j+2}$, $c_{j+1}$, and $c_{j}$ (try it!) and that is enormously more difficult to work with»</i>.</p>`},
   {label:'La ricorrenza', body:R`
   <p>Con la <span class="str" data-str="serie-di-potenze">serie di potenze</span> $v=\sum_{j}c_{j}\rho^{j}$, uguagliando i coefficienti delle stesse potenze si ottiene una ricorrenza a due termini:</p>
   $$c_{j+1}=\frac{2(j+l+1)-\rho_{0}}{(j+1)(j+2l+2)}\,c_{j}.$$
   <p>Per $j$ grande il rapporto tende a $2/j$, e se fosse esatto darebbe $c_{j}=2^{j}c_{0}/j!$, cioè $v=c_{0}e^{2\rho}$ e $u\sim\rho^{l+1}e^{\rho}$. Griffiths commenta: <i>«The positive exponential is precisely the asymptotic behavior we didn&rsquo;t want [...] There is only one way out of this dilemma: The series must terminate»</i>.</p>`},
   {label:'La terminazione, e il numero quantico principale', body:R`
   <p>La serie si ferma a $j_{\max}$ se $2(j_{\max}+l+1)=\rho_{0}$. Il numero intero $n=j_{\max}+l+1$ è il <i>«principal quantum number»</i>, con $\rho_{0}=2n$, e dalla definizione di $\rho_{0}$</p>
   $$E_{n}=-\frac{\mu e^{4}}{2\hbar^{2}}\frac{1}{n^{2}},\qquad n=1,2,3,\dots,\qquad\kappa=\frac{1}{na_{0}} .$$
   <p>Fissato $n$, $l$ va da $0$ a $n-1$, e il polinomio $v$ ha grado $n-l-1$. Per $n=2$, $l=0$ la ricorrenza dà $c_{1}=-c_{0}$ e $c_{2}=0$: $v=c_{0}(1-\rho)$ con $\rho=r/2a_{0}$, cioè $R_{20}\propto(1-r/2a_{0})e^{-r/2a_{0}}$.</p>`}
  ]},
  {t:'prosa', title:'Le stesse mosse in Picasso, Ballentine, Sakurai e Landau', tag:'fonti', html:R`
  <p>Le quattro fonti fanno la stessa cosa con variabili e notazioni diverse, e conviene saper riconoscere che è la stessa cosa. <b>Picasso</b> lavora con $r$ e non con $\rho$: pone $u=f(r)e^{-\kappa r}$, $f=r^{s}\sum a_{i}r^{i}$, trova $s(s-1)=l(l+1)$ e quindi $s=l+1$, poi la ricorrenza (11.35) e la terminazione (11.36); osserva che <i>«l&rsquo;andamento di $f(r)$ nell&rsquo;origine è determinato dal potenziale centrifugo, e non da quello coulombiano, e quindi è lo stesso per tutti i potenziali, purché divergano nell&rsquo;origine meno rapidamente del potenziale centrifugo»</i>. <b>Ballentine</b> non toglie il fattore $1/r$, usa $\rho=\alpha r$ con $\alpha^{2}=8\mu|E|/\hbar^{2}$, quindi $\rho=2r/na_{0}$, e scrive la ricorrenza</p>
  $$a_{\nu+1}=\frac{\nu+l+1-\lambda}{(\nu+1)(\nu+2l+2)}\,a_{\nu},$$
  <p>che termina per $\lambda=n$: con la sua variabile, doppia di quella di Griffiths, il rapporto asintotico è $1/\nu$ invece di $2/j$, e la crescita è $e^{\rho/2}$ invece di $e^{\rho}$, lo stesso fatto in un&rsquo;altra scala. <b>Sakurai</b> riconosce nell&rsquo;equazione per la parte regolare l&rsquo;equazione di Kummer, la cui soluzione è la funzione ipergeometrica confluente, che <i>«would grow without bound unless the series terminated»</i>. <b>Landau</b> scrive direttamente $F(-n+l+1,2l+2,\rho)$ e conclude che <i>«il numero $n$ deve essere intero positivo»</i> con $n\ge l+1$.</p>
  <p>Landau aggiunge la storia in una nota: la formula dei livelli <i>«è stata stabilita per la prima volta da N. Bohr nel 1913, prima della formulazione della meccanica quantistica. Essa è stata introdotta nella meccanica quantistica da W. Pauli nel 1926, mediante il metodo matriciale e, qualche mese dopo, da E. Schrödinger mediante l&rsquo;equazione d&rsquo;onda»</i>. Il metodo di Pauli è quello della tappa 05. Griffiths è più severo con Bohr: la formula fu ottenuta <i>«by a serendipitous mixture of inapplicable classical physics and premature quantum theory»</i>.</p>`},
  {t:'plot', title:'Perché la serie deve fermarsi',
   intro:R`<p>Per $l=0$ e $\rho_{0}=2{,}2$, appena sopra il valore permesso $\rho_{0}=2$: la soluzione regolare nell&rsquo;origine, calcolata sommando la serie, $\rho e^{-\rho}v(\rho)$ (blu), e la soluzione permessa $\rho e^{-\rho}$ per $\rho_{0}=2$ (arancio).</p>`,
   plots:[{kind:'func2d', xr:[0,12], yr:[-0.6,0.6], height:260, ticks:true,
     title:'idrogeno, l = 0: energia sbagliata contro energia giusta',
     curves:[{f:'(function(r){var c=1,s=0,t=1;for(var j=0;j<80;j++){s+=c*t;c=c*(2*(j+1)-2.2)/((j+1)*(j+2));t*=r;}return r*Math.exp(-r)*s;})(x)', col:'#5aa9ff', width:2.4, label:'rho0 = 2.2'},
             {f:'x*Math.exp(-x)', col:'#ffb86b', width:2.4, label:'rho0 = 2 (n = 1)'}],
     xlabel:'rho', ylabel:'u(rho)'}],
   leggi:R`<p><b>Che cosa guardare.</b> Vicino all&rsquo;origine le due curve partono insieme, come $\rho$. Già a $\rho=1$ la blu sta sotto, $0{,}315$ contro $0{,}368$; fra $\rho=2$ e $\rho=3$ attraversa l&rsquo;asse, e invece di andare a zero diverge verso il basso, a $\rho=10$ vale già circa $-44$: la serie che non si ferma ricostruisce un pezzo di $e^{\rho}$, che vince il fattore $e^{-\rho}$.</p>
   <p><b>Che cosa impararne.</b> La quantizzazione dell&rsquo;energia non è imposta dall&rsquo;esterno: per un&rsquo;energia qualunque la soluzione regolare nell&rsquo;origine esiste sempre, ma all&rsquo;infinito esplode. Solo per i valori discreti $\rho_{0}=2n$ le due condizioni, all&rsquo;origine e all&rsquo;infinito, si possono soddisfare insieme. È la stessa cosa che Shankar dice in generale per i potenziali centrali.</p>`}
]},
/* ---------------- 03 · LO SPETTRO ---------------- */
{ num:'03', title:'Lo spettro: Rydberg, le serie, e il confronto con le misure', meta:'livelli che si addensano verso zero · la formula di Rydberg · Lyman Balmer Paschen · la costante di Rydberg con e senza massa ridotta · lo spettro continuo',
  blocchi:[
  {t:'prosa', title:'Infiniti livelli sotto lo zero', tag:'spettro', html:R`
  <p>Le energie $E_{n}=-13{,}6\ \mathrm{eV}/n^{2}$ sono infinite e si accumulano verso zero. Landau: <i>«si ha un&rsquo;infinità di livelli compresi tra il livello fondamentale [...] e zero. Gli intervalli tra due livelli consecutivi diminuiscono al crescere di $n$; i livelli si infittiscono man mano che ci si avvicina al valore $E=0$ dove lo spettro discreto si connette con quello continuo»</i>. Ballentine spiega da dove viene: <i>«This limit point in the spectrum exists because of the very long range of the Coulomb potential. No such behavior occurs for short range potentials»</i>. Una buca sferica ha un numero finito di stati legati; il potenziale coulombiano, che va a zero lentamente, ne ha infiniti. La distanza fra due livelli consecutivi, $E_{n+1}-E_{n}=13{,}6\ \mathrm{eV}\cdot\frac{2n+1}{n^{2}(n+1)^{2}}$, va a zero come $1/n^{3}$.</p>
  <p>Sopra lo zero lo <span class="str" data-str="spettro">spettro</span> è continuo, e descrive lo scattering di un elettrone su un protone. Ballentine avverte che gli stati legati da soli <i>«is not a complete set. To obtain a complete basis set we must include the continuum of unbound state functions for $E\ge0$»</i>: una funzione d&rsquo;onda qualunque, per esempio un elettrone localizzato vicino al protone, si sviluppa sugli stati legati più quelli del continuo.</p>`},
  {t:'prosa', title:'La formula di Rydberg', tag:'misure', html:R`
  <p>Un atomo che passa dal livello $n_{i}$ al livello $n_{f}$ emette un fotone di energia $E_{n_{i}}-E_{n_{f}}$. Con $E=h\nu=hc/\lambda$, Griffiths arriva alla formula che gli spettroscopisti avevano trovato empiricamente nell&rsquo;Ottocento:</p>
  $$\frac1\lambda=R\Big(\frac{1}{n_{f}^{2}}-\frac{1}{n_{i}^{2}}\Big),\qquad R=\frac{\mu e^{4}}{4\pi c\hbar^{3}}.$$
  <p>Le transizioni verso $n_{f}=1$ sono la serie di Lyman, nell&rsquo;ultravioletto; verso $n_{f}=2$ la serie di Balmer, nel visibile; verso $n_{f}=3$ la serie di Paschen, nell&rsquo;infrarosso. La prima riga di Lyman sta a $121{,}6$ nm, e Shankar commenta che <i>«a more refined estimate gives a value of 1216 Å, in very good agreement with experiment»</i>. La prima riga di Balmer, la rossa, sta a $656{,}5$ nm; il limite della serie di Lyman, $n_{i}\to\infty$, a $91{,}2$ nm.</p>
  <p>Picasso dà i numeri della costante. Gli spettroscopisti avevano misurato $R_{H}=109677{,}6\ \mathrm{cm}^{-1}$, e la costante con nucleo infinitamente pesante è $R_{\infty}=109737{,}31568539(55)\ \mathrm{cm}^{-1}$; la differenza è la massa ridotta. Picasso lascia al lettore la verifica, che si fa in una riga: $R_{H}=R_{\infty}/(1+m_{e}/m_{p})\approx109677{,}6\ \mathrm{cm}^{-1}$, in accordo con il valore misurato a tutte le cifre date.</p>`},
  {t:'plot', title:'I livelli e le serie',
   intro:R`<p>Energie $E_{n}=-13{,}6/n^{2}$ eV in funzione di $n$, lette sugli interi (blu), e i limiti delle serie di Lyman ($-13{,}6$ eV), Balmer ($-3{,}4$ eV) e Paschen ($-1{,}51$ eV), da cui partono le transizioni (righe sottili).</p>`,
   plots:[{kind:'func2d', xr:[1,12], yr:[-14.5,0.5], height:280, ticks:true,
     title:'idrogeno: livelli di energia',
     curves:[{f:'-13.6/(x*x)', col:'#5aa9ff', width:2.6, label:'E_n'},
             {f:'-13.6', col:'#ffb86b', width:1.0, label:'n = 1 (Lyman)'},
             {f:'-3.4', col:'#6bdc9b', width:1.0, label:'n = 2 (Balmer)'},
             {f:'-13.6/9', col:'#c49bff', width:1.0, label:'n = 3 (Paschen)'},
             {f:'0', col:'#999999', width:1.0, label:'soglia del continuo'}],
     xlabel:'n', ylabel:'E (eV)'}],
   leggi:R`<p><b>Che cosa guardare.</b> Fra $n=1$ e $n=2$ ci sono $10{,}2$ eV, fra $n=2$ e $n=3$ meno di $1{,}9$ eV, fra $n=10$ e $n=11$ meno di $0{,}03$ eV. La curva si schiaccia sullo zero senza toccarlo.</p>
   <p><b>Che cosa impararne.</b> Le serie stanno in regioni dello spettro elettromagnetico separate perché le distanze dal livello più basso della serie sono di ordini di grandezza diversi: ultravioletto per Lyman, visibile per Balmer, infrarosso per Paschen. Ogni serie si accumula verso il suo limite, l&rsquo;energia di ionizzazione dal livello di arrivo.</p>`}
]},
/* ---------------- 04 · LA DEGENERAZIONE ---------------- */
{ num:'04', title:'La degenerazione n quadro: contarla, e leggerla classicamente', meta:'per ogni n gli l da 0 a n meno 1 · la somma 2l+1 · accidentale, nome sbagliato, non accidentale · l energia dipende dal semiasse maggiore · il fattore quattro degli spin',
  blocchi:[
  {t:'prosa', title:'Il conteggio', tag:'conto', html:R`
  <p>L&rsquo;energia dipende solo da $n=n_{r}+l+1$, con $n_{r}$ il numero quantico radiale. Per $n$ fissato $l$ può valere $0,1,\dots,n-1$, e Picasso fa la tabella: $l=0$ con $n_{r}=n-1$, $l=1$ con $n_{r}=n-2$, fino a $l=n-1$ con $n_{r}=0$. Ogni $l$ porta $2l+1$ valori di $m$, e la degenerazione è</p>
  $$g_{n}=\sum_{l=0}^{n-1}(2l+1)=n^{2} .$$
  <p>Il livello $n=2$ ha quattro stati, $2s$ e i tre $2p$; il livello $n=3$ ne ha nove, $3s$, tre $3p$ e cinque $3d$.</p>
  <p>Ballentine aggiunge che per l&rsquo;atomo vero il conto va moltiplicato per quattro, per le due orientazioni dello spin dell&rsquo;elettrone e le due del protone, <i>«This four-fold degeneracy is modified by the hyperfine interaction between the magnetic moments of the electron and the proton»</i>. Negli esercizi senza spin del protone il fattore è due.</p>`},
  {t:'prosa', title:'Accidentale, o no', tag:'fonti', html:R`
  <p>La parte $2l+1$ della degenerazione viene dalle rotazioni, come in ogni potenziale centrale. La somma su $l$ no. Le fonti la nominano in tre modi. Landau: <i>«ogni autovalore è quindi degenere non solamente rispetto al numero quantico magnetico $m$ [...] ma anche rispetto al numero $l$. Quest&rsquo;ultima degenerazione (detta accidentale) è specifica del campo coulombiano»</i>. Shankar mette le virgolette: la degenerazione in $l$ <i>«appears mysterious. For this reason it is occasionally termed accidental degeneracy. This is, however, a misnomer, for the degeneracy in $l$ can be attributed to additional invariance properties of $H$»</i>. Sakurai: <i>«this degeneracy is in fact not accidental but, rather, reflects a subtle symmetry of the Coulomb potential»</i>. I tre dicono la stessa cosa; Landau usa il nome tradizionale e poi, nello stesso paragrafo, spiega la simmetria.</p>
  <p>La stessa struttura si ritrova in un caso solo: l&rsquo;oscillatore isotropo, dove pure livelli con $l$ diverso coincidono. Griffiths lo nota in negativo: nella buca sferica <i>«the energies depend also on $l$»</i>, mentre nell&rsquo;idrogeno <i>«the energies are determined by $n$ alone. This is a peculiarity of the Coulomb potential»</i>.</p>`},
  {t:'prosa', title:'La lettura classica di Picasso', tag:'fisica', html:R`
  <p>Picasso dà la ragione in termini di orbite. La degenerazione in $l$ <i>«corrisponde al fatto che, secondo la meccanica classica, l&rsquo;energia dipende dal semiasse maggiore dell&rsquo;orbita (ellittica) della particella, e non dal semiasse minore, il quale, a sua volta, è proporzionale al modulo del momento angolare»</i>. In un&rsquo;orbita kepleriana di semiasse maggiore $A$ l&rsquo;energia è $-e^{2}/2A$, qualunque sia l&rsquo;eccentricità: un&rsquo;orbita circolare e un&rsquo;ellisse molto schiacciata con lo stesso $A$ hanno la stessa energia e momenti angolari diversi. La degenerazione in $m$ invece <i>«corrisponde classicamente al fatto che orbite che differiscono solo per l&rsquo;orientazione nello spazio hanno la stessa energia e lo stesso momento angolare»</i>.</p>
  <p>Il confronto con Bohr completa il quadro: con orbite circolari, $E_{n}=-e^{2}/2r_{n}$ e $r_{n}=n^{2}a_{0}$, cioè lo stesso spettro, ma con un solo momento angolare per livello, $n\hbar$. La meccanica quantistica dà per lo stesso $n$ tutti gli $l$ da $0$ a $n-1$, e nessuno uguale a $n$: il fondamentale ha $l=0$, non $l=1$. Sakurai sottolinea il disaccordo: <i>«there is a stark disagreement between the energy-level properties predicted by modern quantum mechanics, and those of the old Bohr model of the atom»</i>.</p>`}
]},
/* ---------------- 05 · IL VETTORE DI LENZ ---------------- */
{ num:'05', title:'Il vettore di Lenz e la simmetria in quattro dimensioni', meta:'una costante del moto in più · orbite chiuse · la versione hermitiana · l algebra di SO(4) · i livelli di Pauli senza equazione di Schroedinger · Fock e le traiettorie chiuse di Landau',
  blocchi:[
  {t:'prosa', title:'Classicamente: l ellisse che non ruota', tag:'meccanica classica', html:R`
  <p>Sakurai parte dalle orbite. Nel problema di Keplero le orbite sono ellissi chiuse, e <i>«the fact that the solution leads to elliptical orbits that are closed means that there should be some (vector) constant of the motion that maintains the orientation of the major axis of the ellipse. We know that even a small deviation from a $1/r$ potential leads to precession of this axis»</i>. La costante è il vettore di Lenz, o di Runge-Lenz,</p>
  $$\mathbf M=\frac{\mathbf p\times\mathbf L}{m}-\frac{Ze^{2}}{r}\,\mathbf r .$$
  <p>Che si conservi si verifica con le <span class="str" data-str="parentesi-di-poisson">parentesi di Poisson</span>: $\{M_{z},H\}=0$ per $H=p^{2}/2m-Ze^{2}/r$, e lo stesso per le altre componenti. $\mathbf M$ è perpendicolare a $\mathbf L$, perché $\mathbf L\cdot(\mathbf p\times\mathbf L)=0$ e $\mathbf L\cdot\mathbf r=0$, quindi sta nel piano dell&rsquo;orbita; il suo modulo è fissato dall&rsquo;energia e dal momento angolare, $M^{2}=\frac{2H}{m}L^{2}+Z^{2}e^{4}$. Per un&rsquo;orbita circolare è nullo. Shankar fa vedere nell&rsquo;esercizio 13.2.1 che $\mathbf M$ punta lungo l&rsquo;asse maggiore: <i>«the conservation of $\mathbf n$ implies that not only is the orbit confined to a plane perpendicular to $\mathbf l$ (as in any rotationally invariant problem) it is also closed»</i>.</p>
  <p>Landau collega le due cose che sembrano diverse, la degenerazione e le orbite: <i>«alla peculiarità del campo coulombiano e del campo dell&rsquo;oscillatore armonico nella meccanica quantistica (la presenza della degenerazione accidentale) corrisponde nella meccanica classica la peculiarità che consiste nell&rsquo;esistenza per questi campi (e solamente per questi) di traiettorie chiuse delle particelle»</i>.</p>`},
  {t:'plot', title:'Orbite con la stessa energia',
   intro:R`<p>Ellissi kepleriane con lo stesso semiasse maggiore $A=1$ e quindi la stessa energia $-Ze^{2}/2A$, con il fuoco nell&rsquo;origine: eccentricità $0$ (blu), $0{,}6$ (arancio), $0{,}9$ (verde). Il momento angolare è proporzionale al semiasse minore $A\sqrt{1-\epsilon^{2}}$.</p>`,
   plots:[{kind:'func2d', xr:[-2,1], yr:[-1.1,1.1], height:280, ticks:true,
     title:'Keplero: stessa energia, momenti angolari diversi',
     curves:[{f:'Math.sqrt(Math.max(0,1-x*x))', col:'#5aa9ff', width:2.2, label:'e = 0'},
             {f:'-Math.sqrt(Math.max(0,1-x*x))', col:'#5aa9ff', width:2.2, label:''},
             {f:'0.8*Math.sqrt(1-(x+0.6)*(x+0.6))', col:'#ffb86b', width:2.2, label:'e = 0.6'},
             {f:'-0.8*Math.sqrt(1-(x+0.6)*(x+0.6))', col:'#ffb86b', width:2.2, label:''},
             {f:'0.4359*Math.sqrt(1-(x+0.9)*(x+0.9))', col:'#6bdc9b', width:2.2, label:'e = 0.9'},
             {f:'-0.4359*Math.sqrt(1-(x+0.9)*(x+0.9))', col:'#6bdc9b', width:2.2, label:''}],
     xlabel:'x / A', ylabel:'y / A'}],
   leggi:R`<p><b>Che cosa guardare.</b> Le tre orbite hanno lo stesso asse maggiore, di lunghezza $2A$, e il fuoco nell&rsquo;origine. Il perielio, il punto più vicino al fuoco, sta a distanza $A(1-\epsilon)$: $1$ per il cerchio, $0{,}4$ e $0{,}1$ per le due ellissi. Il vettore di Lenz punta dal fuoco verso il perielio, con modulo $Ze^{2}\epsilon$: zero per il cerchio.</p>
   <p><b>Che cosa impararne.</b> È la lettura classica di Picasso della degenerazione in $l$: l&rsquo;energia fissa $A$, e il momento angolare, cioè la forma dell&rsquo;ellisse, resta libero. Nella meccanica quantistica le orbite diventano gli stati con $l$ diversi e lo stesso $n$.</p>`},
  {t:'reveal', title:'Quantisticamente: la simmetria di Pauli e Fock', tag:'simmetria', steps:[
   {label:'L’operatore', body:R`
   <p>$\mathbf p\times\mathbf L$ non è hermitiano, perché $\mathbf p$ ed $\mathbf L$ non commutano, e Sakurai lo simmetrizza:</p>
   $$\mathbf M=\frac{1}{2m}\big(\mathbf p\times\mathbf L-\mathbf L\times\mathbf p\big)-\frac{Ze^{2}}{r}\mathbf r .$$
   <p>Questo operatore <span class="str" data-str="commutatore">commuta</span> con la hamiltoniana, è perpendicolare a $\mathbf L$, $\mathbf L\cdot\mathbf M=\mathbf M\cdot\mathbf L=0$, e il suo quadrato vale $M^{2}=\frac{2H}{m}(L^{2}+\hbar^{2})+Z^{2}e^{4}$. Rispetto all&rsquo;espressione classica è cambiato solo $L^{2}\to L^{2}+\hbar^{2}$, ed è proprio questo $\hbar^{2}$ che sposterà il risultato dal momento angolare di Bohr al numero quantico principale.</p>
   <p>Landau scrive la stessa cosa e trae la conseguenza: le componenti di $\mathbf M$ non commutano con $L^{2}$, e <i>«la presenza di una nuova grandezza conservativa non misurabile simultaneamente con le altre grandezze conservative comporta una degenerazione supplementare dei livelli che è precisamente la degenerazione accidentale»</i>. È lo stesso meccanismo per cui le rotazioni, che non commutano fra loro, danno la degenerazione in $m$.</p>`},
   {label:'Un’algebra chiusa, sugli stati legati', body:R`
   <p>Le regole di commutazione di $\mathbf M$ con se stesso contengono $H$, e l&rsquo;algebra non si chiude. Ma sugli stati legati di energia $E\lt0$ si può sostituire $H$ con $E$, e con $\mathbf N=\sqrt{-m/2E}\,\mathbf M$ si ottiene</p>
   $$[L_{i},L_{j}]=i\hbar\epsilon_{ijk}L_{k},\qquad[N_{i},L_{j}]=i\hbar\epsilon_{ijk}N_{k},\qquad[N_{i},N_{j}]=i\hbar\epsilon_{ijk}L_{k}.$$
   <p>Sakurai mostra che è l&rsquo;algebra delle rotazioni in quattro dimensioni. Con una quarta coordinata $x_{4}$ e il suo impulso, i generatori $L_{ij}=x_{i}p_{j}-x_{j}p_{i}$ sono sei, tre con indici in $\{1,2,3\}$, che sono le $L_{k}$, e tre con un indice $4$, che sono le $N_{i}$; e per esempio $[N_{1},L_{2}]=i\hbar N_{3}$. Landau attribuisce la scoperta a Fock, 1935: <i>«queste relazioni coincidono formalmente con le regole di commutazione degli operatori corrispondenti a rotazioni infinitesime nello spazio euclideo a quattro dimensioni. Questa è la simmetria del moto in un campo coulombiano nella meccanica quantistica»</i>.</p>`},
   {label:'I livelli senza equazione di Schrödinger', body:R`
   <p>Le combinazioni $\mathbf I=\tfrac12(\mathbf L+\mathbf N)$ e $\mathbf K=\tfrac12(\mathbf L-\mathbf N)$ soddisfano due algebre del momento angolare indipendenti, e commutano con $H$. Siccome $\mathbf L\cdot\mathbf N=0$, i loro quadrati sono uguali, $I^{2}=K^{2}$, e quindi i due numeri quantici coincidono, $i=k$. La somma dà</p>
   $$I^{2}+K^{2}=\tfrac12\big(L^{2}+N^{2}\big)=\tfrac12\Big(L^{2}-\frac{m}{2E}M^{2}\Big)=\tfrac12\Big(-\hbar^{2}-\frac{mZ^{2}e^{4}}{2E}\Big),$$
   <p>dove $L^{2}$ si è cancellato grazie alla relazione per $M^{2}$. Con $I^{2}+K^{2}=2k(k+1)\hbar^{2}$ si ricava</p>
   $$E=-\frac{mZ^{2}e^{4}}{2\hbar^{2}(2k+1)^{2}},$$
   <p>cioè la formula di Bohr con $n=2k+1$, e $k$ che va da $0$ a semiinteri: $n=1,2,3,\dots$ La degenerazione è $(2i+1)(2k+1)=(2k+1)^{2}=n^{2}$. Sakurai conclude: <i>«it is now clear that the degeneracy is no accident. It is worth noting that we have just solved for the eigenvalues of the hydrogen atom without ever resorting to solving the Schrödinger equation [...] This solution was apparently first carried out by Pauli»</i>.</p>`}
  ]}
]},
/* ---------------- 06 · COORDINATE PARABOLICHE ---------------- */
{ num:'06', title:'Un altro modo di separare: le coordinate paraboliche', meta:'Ballentine e Landau · la separazione con due costanti · n = n1 + n2 + |m| + 1 · lo stesso spettro, un altro conteggio · gli stati con un dipolo',
  blocchi:[
  {t:'prosa', title:'La separazione', tag:'fonti', html:R`
  <p>L&rsquo;equazione di Schrödinger con potenziale coulombiano si separa anche in coordinate paraboliche, $\xi=r-z$, $\eta=r+z$ e l&rsquo;angolo $\phi$. Ballentine: le superfici a $\xi$ costante sono paraboloidi di rotazione con il fuoco nell&rsquo;origine, e le coordinate <i>«obscure the spherical symmetry of the problem, and so they are less commonly used than are spherical coordinates. But they have the advantage that the equation remains separable in the presence of a uniform electric field along the $z$ axis»</i>. Landau dedica loro il paragrafo successivo a quello sulle coordinate sferiche.</p>
  <p>Con $\Psi=f(\xi)g(\eta)e^{im\phi}$, l&rsquo;equazione si spezza in due equazioni identiche nella forma, con due costanti di separazione la cui somma è fissata. Ciascuna dà polinomi di Laguerre e un numero intero non negativo, $n_{1}$ e $n_{2}$, e l&rsquo;energia è</p>
  $$E=-\frac{\mu e^{4}}{2\hbar^{2}(n_{1}+n_{2}+|m|+1)^{2}},\qquad n=n_{1}+n_{2}+|m|+1 .$$
  <p>Lo stesso spettro, ottenuto con altri numeri quantici. Il conteggio torna: per $n$ fissato, $m=0$ dà $n$ coppie $(n_{1},n_{2})$, e ciascuno dei $2(n-1)$ valori $m\ne0$ ne dà $n-|m|$; la somma è $n+2\sum_{k=1}^{n-1}(n-k)=n^{2}$. Per $n=3$: $3+2\cdot2+2\cdot1=9$.</p>`},
  {t:'prosa', title:'Che cosa vuol dire separare in due modi', tag:'simmetria', html:R`
  <p>Ballentine spiega il rapporto fra le due basi: <i>«an eigenfunction from one system of coordinates will be a linear combination of degenerate eigenfunctions from the other system»</i>. Uno stato parabolico con $(n_{1},n_{2},m)$ è una combinazione di stati sferici con lo stesso $m$ e lo stesso $n$, ma $l$ diversi; e viceversa. Il fatto che si possano fare combinazioni di $l$ diversi senza cambiare l&rsquo;energia è la degenerazione in $l$; il fatto che ci sia un secondo sistema di coordinate in cui il problema si separa è il segno della simmetria in più, come per l&rsquo;oscillatore isotropo, che si separa in coordinate cartesiane e sferiche.</p>
  <p>Gli stati parabolici hanno una proprietà che quelli sferici non hanno: non sono di parità definita, e possono avere un dipolo elettrico. Ballentine osserva che $\langle z\rangle$ è approssimativamente proporzionale a $n(n_{2}-n_{1})$, e che <i>«among all states with fixed values of $n$ and $m$, the state with the largest value of $n_{2}-n_{1}$ will exhibit the greatest polarization. These state functions are useful in describing a hydrogen atom in an external electric field»</i>. È per questo che nell&rsquo;idrogeno un campo elettrico produce uno spostamento lineare dei livelli: la base parabolica è già quella che diagonalizza la perturbazione.</p>`}
]},
/* ---------------- 07 · LE FUNZIONI D ONDA ---------------- */
{ num:'07', title:'Le funzioni d onda: le R_nl che servono, e le convenzioni che cambiano', meta:'la tavola delle prime funzioni radiali · lo stato fondamentale · i nodi dal teorema di oscillazione · densità radiali · i polinomi di Laguerre in tre convenzioni',
  blocchi:[
  {t:'prosa', title:'Le prime funzioni radiali', tag:'tavola', html:R`
  <p>Le autofunzioni sono $\psi_{nlm}=R_{nl}(r)Y_{l}^{m}(\theta,\phi)$, con la parte radiale fatta di un polinomio di grado $n-l-1$, del fattore $r^{l}$ e dell&rsquo;esponenziale $e^{-r/na_{0}}$. Le prime, normalizzate con $\int_{0}^{\infty}R_{nl}^{2}r^{2}dr=1$, sono quelle della tavola 4.7 di Griffiths e della (11.41) di Picasso:</p>
  $$R_{10}=\frac{2}{a_{0}^{3/2}}e^{-r/a_{0}},\qquad R_{20}=\frac{1}{\sqrt2\,a_{0}^{3/2}}\Big(1-\frac{r}{2a_{0}}\Big)e^{-r/2a_{0}},\qquad R_{21}=\frac{1}{\sqrt{24}\,a_{0}^{3/2}}\frac{r}{a_{0}}e^{-r/2a_{0}},$$
  $$R_{30}=\frac{2}{\sqrt{27}\,a_{0}^{3/2}}\Big(1-\frac{2r}{3a_{0}}+\frac{2r^{2}}{27a_{0}^{2}}\Big)e^{-r/3a_{0}},\qquad R_{31}=\frac{8}{27\sqrt6\,a_{0}^{3/2}}\Big(1-\frac{r}{6a_{0}}\Big)\frac{r}{a_{0}}e^{-r/3a_{0}},\qquad R_{32}=\frac{4}{81\sqrt{30}\,a_{0}^{3/2}}\frac{r^{2}}{a_{0}^{2}}e^{-r/3a_{0}}.$$
  <p>Il fondamentale, con $Y_{0}^{0}=1/\sqrt{4\pi}$, è $\psi_{100}=(\pi a_{0}^{3})^{-1/2}e^{-r/a_{0}}$, e Ballentine nota che <i>«can more easily be obtained directly from the eigenvalue equation than by specializing the general formula»</i>. I compiti del corso stampano $R_{10}$, $R_{20}$, $R_{21}$ fra le formule utili, con $r_{0}=\hbar^{2}/\mu e^{2}$ al posto di $a_{0}$, nella forma $R_{20}=2(2r_{0})^{-3/2}(1-r/2r_{0})e^{-r/2r_{0}}$ e $R_{21}=\tfrac{1}{\sqrt3}(2r_{0})^{-3/2}(r/r_{0})e^{-r/2r_{0}}$, che sono le stesse funzioni scritte con un altro raggruppamento dei fattori.</p>`},
  {t:'prosa', title:'Che cosa si legge nelle funzioni', tag:'proprietà', html:R`
  <p>Picasso ne ricava tre proprietà. La prima: $\psi_{nlm}$ <i>«si annulla tanto più rapidamente per $r\to0$ quanto più grande è il valore di $l$; quindi, maggiore è il momento angolare, minore è la probabilità di trovare l&rsquo;elettrone vicino al nucleo»</i>. La seconda: l&rsquo;andamento all&rsquo;infinito è determinato da $e^{-r/na_{0}}$, che <i>«all&rsquo;aumentare di $n$ decresce sempre meno rapidamente»</i>. La terza: $R_{nl}$ ha $n-l-1$ nodi fra $0$ e $\infty$, e Picasso lo ricava dal teorema di oscillazione: fissato $l$, le $u_{nl}$ sono le soluzioni di un problema unidimensionale, ordinate per energia, e quella con $n$ è la $(n-l)$-esima, quindi ha $n-l-1$ nodi. I nodi di $R_{20}$ e di $R_{30}$ si vedono nelle formule: $r=2a_{0}$ per la prima, $r=(9\pm3\sqrt3)a_{0}/2$ per la seconda.</p>
  <p>Shankar dà l&rsquo;andamento per $r$ grande, indipendente da $l$: $R_{nl}\sim r^{n-1}e^{-r/na_{0}}$, perché il polinomio è dominato dalla potenza più alta. Per $l=n-1$ questo vale a ogni $r$, e la densità radiale $r^{2n}e^{-2r/na_{0}}$ ha il massimo in $r=n^{2}a_{0}$, il raggio dell&rsquo;orbita di Bohr.</p>`},
  {t:'plot', title:'Le densità radiali per n = 1, 2, 3',
   intro:R`<p>Densità di probabilità radiale $P_{nl}(r)=r^{2}R_{nl}^{2}$, con $r$ in unità di $a_{0}$: in alto $1s$ (blu), $2s$ (arancio), $2p$ (verde); in basso $3s$ (blu), $3p$ (arancio), $3d$ (verde).</p>`,
   plots:[{kind:'func2d', xr:[0,14], yr:[0,0.56], height:240, ticks:true,
     title:'n = 1 e n = 2',
     curves:[{f:'4*x*x*Math.exp(-2*x)', col:'#5aa9ff', width:2.4, label:'1s'},
             {f:'0.5*x*x*Math.pow(1-x/2,2)*Math.exp(-x)', col:'#ffb86b', width:2.4, label:'2s'},
             {f:'x*x*x*x*Math.exp(-x)/24', col:'#6bdc9b', width:2.4, label:'2p'}],
     xlabel:'r / a0', ylabel:'P(r) a0'},
     {kind:'func2d', xr:[0,25], yr:[0,0.12], height:240, ticks:true,
     title:'n = 3',
     curves:[{f:'4/27*x*x*Math.pow(1-2*x/3+2*x*x/27,2)*Math.exp(-2*x/3)', col:'#5aa9ff', width:2.4, label:'3s'},
             {f:'64/(729*6)*x*x*x*x*Math.pow(1-x/6,2)*Math.exp(-2*x/3)', col:'#ffb86b', width:2.4, label:'3p'},
             {f:'16/(6561*30)*Math.pow(x,6)*Math.exp(-2*x/3)', col:'#6bdc9b', width:2.4, label:'3d'}],
     xlabel:'r / a0', ylabel:'P(r) a0'}],
   leggi:R`<p><b>Che cosa guardare.</b> $1s$ ha il massimo in $r=a_{0}$. $2p$ e $3d$, che hanno $l=n-1$, hanno una sola gobba con il massimo in $4a_{0}$ e $9a_{0}$. Gli stati con $l$ più piccolo hanno più gobbe, con una gobba interna piccola vicino al nucleo: è la penetrazione, e Picasso nota che <i>«anche se sembra il contrario»</i> le funzioni sono tutte normalizzate, perché il fattore $r^{2}$ pesa la regione esterna.</p>
   <p><b>Che cosa impararne.</b> Nell&rsquo;idrogeno la penetrazione non cambia l&rsquo;energia, perché $2s$ e $2p$ sono degeneri. Negli atomi con più elettroni gli elettroni interni schermano il nucleo, e gli stati che penetrano di più, quelli con $l$ piccolo, sentono più carica e scendono: è il motivo per cui la degenerazione in $l$ c&rsquo;è solo nell&rsquo;idrogeno.</p>`},
  {t:'prosa', title:'I polinomi di Laguerre: tre convenzioni', tag:'convenzioni', html:R`
  <p>Il polinomio nella funzione radiale è un <span class="str" data-str="polinomi-di-laguerre">polinomio associato di Laguerre</span>, e qui le fonti non sono d&rsquo;accordo sulla notazione. Griffiths scrive $L^{2l+1}_{n-l-1}(2r/na_{0})$, con $L_{q}(x)=e^{x}\frac{d^{q}}{dx^{q}}(e^{-x}x^{q})$ e $L^{p}_{q}(x)=(-1)^{p}\frac{d^{p}}{dx^{p}}L_{p+q}(x)$, e avverte che <i>«there are rival normalization conventions in the literature; I have adopted the most nearly standard one»</i>; i suoi polinomi sono $(p+q)!$ volte i polinomi di Laguerre generalizzati con coefficiente costante normalizzato, per esempio $L^{1}_{1}=4-2x$. Ballentine scrive $L^{2l+1}_{n+l}(\rho)$, con l&rsquo;indice in basso uguale al grado del polinomio di partenza e non del risultato, e annota che <i>«this is the notation used by Pauling and Wilson (1935) and by Schiff (1968). Messiah (1966) and Merzbacher (1970) used the notation $(-1)^{s}L^{s}_{r-s}(\rho)$»</i>. Landau scrive la funzione ipergeometrica confluente $F(-n+l+1,2l+2,\rho)$. Le note del corso sull&rsquo;oscillatore usano $L^{(a)}_{m}$ con l&rsquo;indice in alto spostato di uno.</p>
  <p>Le funzioni radiali normalizzate sono le stesse in tutte le convenzioni; cambiano i nomi dei polinomi e il segno complessivo. In un esercizio conviene non partire dalla formula generale ma dalla ricorrenza, o dalla tavola, che non dipendono dalla convenzione.</p>`}
]},
/* ---------------- 08 · QUANTO E GRANDE L ATOMO ---------------- */
{ num:'08', title:'Quanto è grande l atomo: valori medi, viriale, indeterminazione', meta:'tre definizioni di raggio di Picasso · r medio, r quadro medio, uno su r medio · il teorema del viriale · i problemi di Griffiths · la disuguaglianza di Ballentine e il deutone',
  blocchi:[
  {t:'prosa', title:'Tre definizioni di dimensione', tag:'Picasso', html:R`
  <p>Nella teoria di Bohr l&rsquo;atomo aveva un raggio, quello dell&rsquo;orbita. Picasso osserva che <i>«nello schema attuale non ha più senso dire che l&rsquo;elettrone ruota su determinate orbite»</i>, ma che si può ancora parlare di dimensioni medie, e ne propone tre: il raggio della sfera entro cui la probabilità è, per esempio, il $90\%$; il valor medio di $r$; il reciproco del valor medio di $1/r$. Per il fondamentale danno $2{,}66\,a_{0}$, $\tfrac32a_{0}$ e $a_{0}$. In generale</p>
  $$\langle r\rangle=\frac{a_{0}}{2}\big[3n^{2}-l(l+1)\big],\qquad\frac{1}{\langle r^{-1}\rangle}=n^{2}a_{0}.$$
  <p>Picasso commenta che l&rsquo;ultima definizione <i>«può sembrare un po&rsquo; bizzarra: essa è però l&rsquo;unica che riproduce esattamente il risultato della teoria di Bohr, mentre le prime due danno un risultato che dipende da $l$ oltre che da $n$»</i>. Ballentine scrive la prima formula in un&rsquo;altra forma, $\langle r\rangle=n^{2}a_{0}\big[1+\tfrac12\big(1-\tfrac{l(l+1)}{n^{2}}\big)\big]$, e aggiunge</p>
  $$\langle r^{2}\rangle=n^{4}a_{0}^{2}\Big[1+\frac32\Big(1-\frac{l(l+1)-\frac13}{n^{2}}\Big)\Big],$$
  <p>con il commento che la dimensione tipica va come $n^{2}a_{0}$ per due ragioni insieme: la scala $\kappa^{-1}=na_{0}$ cresce con $n$, e il polinomio si estende su una regione che cresce anch&rsquo;essa con $n$.</p>`},
  {t:'reveal', title:'I problemi di Griffiths sul fondamentale', tag:'conti', steps:[
   {label:'r medio e r quadro medio', body:R`
   <p>Il problema 4.13 chiede $\langle r\rangle$ e $\langle r^{2}\rangle$ nel fondamentale: con $|\psi_{100}|^{2}=e^{-2r/a_{0}}/\pi a_{0}^{3}$ si ottiene $\langle r\rangle=\tfrac32a_{0}$ e $\langle r^{2}\rangle=3a_{0}^{2}$. Poi $\langle x\rangle$ e $\langle x^{2}\rangle$ senza nuovi integrali: $\langle x\rangle=0$ per simmetria, e $\langle x^{2}\rangle=\tfrac13\langle r^{2}\rangle=a_{0}^{2}$, perché lo stato è a simmetria sferica e $r^{2}$ è la somma $x^{2}+y^{2}+z^{2}$.</p>`},
   {label:'Il valore più probabile', body:R`
   <p>Il problema 4.14 chiede il valore più probabile di $r$, con l&rsquo;avvertenza <i>«the answer is not zero!»</i>. La densità $|\psi|^{2}$ è massima nell&rsquo;origine, ma la probabilità di stare fra $r$ e $r+dr$ è $4\pi r^{2}|\psi|^{2}dr\propto r^{2}e^{-2r/a_{0}}$, massima in $r=a_{0}$. È la distinzione fra densità per unità di volume e densità per unità di raggio, che negli esercizi va fatta ogni volta.</p>`}
  ]},
  {t:'prosa', title:'Il teorema del viriale', tag:'Shankar', html:R`
  <p>Shankar mostra come ottenere $\langle1/r\rangle$ senza integrali. In uno stato stazionario la derivata temporale del valor medio di $\mathbf R\cdot\mathbf P$ è nulla, e il teorema di Ehrenfest dà $2\langle T\rangle=\langle\mathbf r\cdot\nabla V\rangle$. Per $V=-e^{2}/r$ il secondo membro è $-\langle V\rangle$, quindi $\langle T\rangle=-\tfrac12\langle V\rangle$, <i>«which is just the quantum version of the classical virial theorem»</i>, ed</p>
  $$E_{n}=\tfrac12\langle V\rangle=-\frac{e^{2}}{2}\Big\langle\frac1r\Big\rangle\quad\Longrightarrow\quad\Big\langle\frac1r\Big\rangle=\frac{1}{n^{2}a_{0}} .$$
  <p>Shankar aggiunge una cautela sul passaggio da $\langle1/r\rangle$ a $1/\langle r\rangle$: sono dello stesso ordine di grandezza in questo caso, ma <i>«it is not true in an $s$ state that $\langle1/r^{4}\rangle\sim1/\langle r^{4}\rangle$, since $\langle1/r^{4}\rangle$ is divergent while $1/\langle r^{4}\rangle$ is not»</i>.</p>`},
  {t:'plot', title:'Come cresce l atomo con n',
   intro:R`<p>In unità di $a_{0}$: $\langle r\rangle$ per $l=0$, $\tfrac32n^{2}$ (blu), e per $l=n-1$, $n^{2}+\tfrac n2$ (arancio), confrontati con il raggio di Bohr $n^{2}$ (verde), che coincide con $1/\langle r^{-1}\rangle$.</p>`,
   plots:[{kind:'func2d', xr:[1,8], yr:[0,100], height:250, ticks:true,
     title:'raggio medio contro n',
     curves:[{f:'1.5*x*x', col:'#5aa9ff', width:2.4, label:'l = 0'},
             {f:'x*x+x/2', col:'#ffb86b', width:2.4, label:'l = n-1'},
             {f:'x*x', col:'#6bdc9b', width:2.0, label:'Bohr: n^2'}],
     xlabel:'n', ylabel:'<r> / a0'}],
   leggi:R`<p><b>Che cosa guardare.</b> Gli stati con $l=n-1$, le «orbite circolari», stanno appena sopra il raggio di Bohr; gli stati $s$, le orbite più schiacciate, hanno un raggio medio del $50\%$ più grande, perché passano molto tempo lontano dal nucleo.</p>
   <p><b>Che cosa impararne.</b> La crescita come $n^{2}$ è la stessa per tutti gli $l$: un atomo con $n=100$, uno stato di Rydberg, ha dimensioni dell&rsquo;ordine del micron. La dipendenza da $l$ è una correzione relativa dell&rsquo;ordine di $1/n$ nel rapporto fra le due curve.</p>`},
  {t:'reveal', title:'Ballentine: una disuguaglianza vera al posto della stima', tag:'indeterminazione', steps:[
   {label:'La disuguaglianza', body:R`
   <p>Dalle regole di commutazione delle coordinate relative segue la disuguaglianza di indeterminazione per ciascuna componente. Per uno stato legato $\langle\mathbf P\rangle=0$, e scegliendo l&rsquo;origine in modo che $\langle\mathbf r\rangle=0$ si ottiene $\langle r^{2}\rangle\langle P^{2}\rangle\ge\tfrac34\hbar^{2}\cdot3$, cioè $\langle r^{2}\rangle\langle T\rangle\ge3\hbar^{2}/8\mu$. Per uno stato con $l=0$, che è a simmetria sferica, ogni componente porta un terzo, e la disuguaglianza si rafforza:</p>
   $$\langle r^{2}\rangle\langle T\rangle\ge\frac{9\hbar^{2}}{8\mu},$$
   <p>che Ballentine attribuisce a Wolsky (1974). Nel fondamentale dell&rsquo;idrogeno $\langle r^{2}\rangle=3a_{0}^{2}$ e $\langle T\rangle=\hbar^{2}/2\mu a_{0}^{2}$, e il prodotto vale $3\hbar^{2}/2\mu$: <i>«this exceeds the lower bound (10.49) by a factor of 1.333»</i>, cioè $\tfrac43$.</p>`},
   {label:'Il deutone, e un numero che non torna', body:R`
   <p>Ballentine applica la stessa disuguaglianza al deutone, con il raggio quadratico medio $2{,}11\times10^{-13}$ cm dedotto dallo scattering, e scrive che ne segue $\langle T\rangle\ge28{,}4$ MeV, e quindi, con l&rsquo;energia di legame di $2{,}2$ MeV, un&rsquo;energia potenziale media $\le-30{,}6$ MeV. Rifacendo il conto con $\mu c^{2}=m_{p}c^{2}/2\approx469$ MeV e $\hbar c\approx197{,}3$ MeV fm, la (10.49) dà $\langle T\rangle\ge9(\hbar c)^{2}/8\mu c^{2}\langle r^{2}\rangle\approx21{,}0$ MeV; se il raggio dato è la distanza dal centro di massa e non quella relativa, il limite scende ancora. Non sono riuscito a ricostruire il valore $28{,}4$ con i dati del testo, e lo dichiaro. La conclusione qualitativa resta: il potenziale nucleare medio è di alcune decine di MeV, molto più dell&rsquo;energia di legame, e con il valore ricalcolato è $\le-23$ MeV. Ballentine: <i>«when nuclear forces were not yet understood this was a very valuable piece of information»</i>.</p>`}
  ]}
]},
/* ---------------- 09 · COMPITO DEL 14-02-2020 ---------------- */
{ num:'09', title:'Un compito intero: due fermioni legati da Coulomb, con spin e campo (14-02-2020)', meta:'esame del 14 febbraio 2020 esercizio 2 · livelli idrogenoidi con la massa ridotta · la statistica lega l a S · il campo che abbassa il tripletto · il campo critico e la degenerazione quadrupla · la correzione relativistica del fondamentale',
  blocchi:[
  {t:'prosa', title:'Il testo', tag:'esame', html:R`
  <p><i>«Nel sistema di riferimento del centro di massa»</i>, due particelle identiche di spin $\tfrac12$ e massa $m$ con</p>
  $$H_{0}=\frac{p_{1}^{2}}{2m}+\frac{p_{2}^{2}}{2m}-\frac{e^{2}}{r}+\frac{2\omega}{\hbar}\mathbf S_{1}\cdot\mathbf S_{2}+g_{0}\,\mathbf B\cdot(\mathbf S_{1}+\mathbf S_{2}),\qquad\mathbf r=\mathbf r_{2}-\mathbf r_{1},\quad\mathbf B=(0,0,B).$$
  <p>Le domande: (a) energie, degenerazioni e autostati dei primi due livelli in funzione del campo; (b) per quale campo il livello più basso è degenere, e quanto; (c) senza campo, la correzione al primo ordine del fondamentale dovuta a $V=-\tfrac{1}{16m^{3}c^{2}}[(\mathbf p_{1}-\mathbf p_{2})^{2}]^{2}$. Fra le formule utili il testo stampa $R_{10}$, $R_{20}$, $R_{21}$ con $r_{0}=\hbar^{2}/\mu e^{2}$ e $\mu=m/2$. Il testo prende due particelle identiche che si attraggono con un potenziale coulombiano, cosa che due cariche uguali non fanno: è un modello, e si risolve come tale.</p>`},
  {t:'reveal', title:'(a) e (b) I livelli in funzione del campo', tag:'soluzione', steps:[
   {label:'Tre pezzi che commutano', body:R`
   <p>Nel centro di massa $p_{1}^{2}/2m+p_{2}^{2}/2m=p^{2}/2\mu$, e il moto relativo è un atomo idrogenoide con massa ridotta $\mu=m/2$: livelli $E_{n}=-e^{2}/2r_{0}n^{2}$. Il termine $\tfrac{2\omega}{\hbar}\mathbf S_{1}\cdot\mathbf S_{2}$ vale $+\tfrac12\hbar\omega$ sul tripletto e $-\tfrac32\hbar\omega$ sul singoletto; il campo dà $g_{0}B\hbar M$, con $M$ il numero quantico di $S_{z}$, che è zero sul singoletto. I tre pezzi commutano, e le energie sono somme.</p>`},
   {label:'La statistica', body:R`
   <p>Le particelle sono fermioni identici, e lo scambio è $\mathbf r\to-\mathbf r$ per lo scambio degli spin: $l$ pari va con il singoletto, $l$ dispari con il tripletto. Nel livello $n=1$ c&rsquo;è solo $l=0$, quindi solo il singoletto: $E_{1}-\tfrac32\hbar\omega$, non degenere, con autostato $\psi_{100}\chi_{0,0}$. Nel livello $n=2$ ci sono $l=0$, singoletto, a $E_{2}-\tfrac32\hbar\omega$, e $l=1$, tripletto, a $E_{2}+\tfrac12\hbar\omega+g_{0}B\hbar M$ per $M=1,0,-1$, ciascuno tre volte degenere per i tre valori di $m_{l}$.</p>`},
   {label:'I primi due livelli', body:R`
   <p>Il più basso, per campi non troppo grandi, è $E_{1}-\tfrac32\hbar\omega$. Il secondo dipende dal campo: per $g_{0}B\lt2\omega$ è il singoletto $2s$, $\psi_{200}\chi_{0,0}$, a $E_{2}-\tfrac32\hbar\omega$, non degenere; per $g_{0}B\gt2\omega$ è il tripletto $2p$ con $M=-1$, $\psi_{21m}\chi_{1,-1}$, a $E_{2}+\tfrac12\hbar\omega-g_{0}\hbar B$, tre volte degenere. A $g_{0}B=2\omega$ i due coincidono, e il secondo livello è quattro volte degenere.</p>`},
   {label:'(b) Il campo critico', body:R`
   <p>Il livello più basso diventa degenere quando il tripletto $2p$ con $M=-1$ scende fino al singoletto $1s$, cioè quando l&rsquo;energia $E_{2}+\tfrac12\hbar\omega-g_{0}\hbar B$ raggiunge $E_{1}-\tfrac32\hbar\omega$. Questo accade per</p>
   $$g_{0}\hbar B=E_{2}-E_{1}+2\hbar\omega=\frac{3e^{2}}{8r_{0}}+2\hbar\omega .$$
   <p>A quel campo il livello più basso contiene $1+3=4$ stati: $\psi_{100}\chi_{0,0}$ e i tre $\psi_{21m}\chi_{1,-1}$. Per campi più grandi il fondamentale è il tripletto, tre volte degenere: il campo ha fatto scendere uno stato con il moto relativo eccitato sotto quello con il moto relativo nel suo stato più basso, perché la statistica impedisce al tripletto di stare in $1s$.</p>`}
  ]},
  {t:'plot', title:'I livelli in funzione del campo',
   intro:R`<p>Con $e^{2}/2r_{0}=4$ e $\hbar\omega=1$ come unità di esempio, in funzione di $b=g_{0}\hbar B$: il singoletto $1s$ (blu), il singoletto $2s$ (arancio), il tripletto $2p$ con $M=-1$ (verde), $M=0$ (viola), $M=+1$ (grigio).</p>`,
   plots:[{kind:'func2d', xr:[0,6], yr:[-6,1], height:280, ticks:true,
     title:'compito 14-02-2020: livelli contro il campo',
     curves:[{f:'-4-1.5', col:'#5aa9ff', width:2.4, label:'1s, singoletto'},
             {f:'-1-1.5', col:'#ffb86b', width:2.4, label:'2s, singoletto'},
             {f:'-1+0.5-x', col:'#6bdc9b', width:2.4, label:'2p, M = -1'},
             {f:'-1+0.5', col:'#c49bff', width:1.6, label:'2p, M = 0'},
             {f:'-1+0.5+x', col:'#999999', width:1.6, label:'2p, M = +1'}],
     xlabel:'g0 hbar B', ylabel:'E'}],
   leggi:R`<p><b>Che cosa guardare.</b> Con questi numeri $E_{1}=-4$ ed $E_{2}=-1$. La retta verde incrocia l&rsquo;arancione a $b=2$, il campo in cui il secondo livello è quadruplo, e la blu a $b=5$, cioè la somma di $E_{2}-E_{1}=3$ e di $2\hbar\omega=2$: il campo critico della domanda (b).</p>
   <p><b>Che cosa impararne.</b> Le rette non interagiscono, perché tutti i termini commutano: si incrociano e basta. Senza la statistica il tripletto avrebbe anche un livello $1s$, a $E_{1}+\tfrac12\hbar\omega-b$, e sarebbe stato il fondamentale per un campo molto più piccolo.</p>`},
  {t:'reveal', title:'(c) La correzione relativistica', tag:'soluzione', steps:[
   {label:'L’operatore nel centro di massa', body:R`
   <p>Nel centro di massa $\mathbf p_{1}=-\mathbf p_{2}=\mathbf p$, quindi $(\mathbf p_{1}-\mathbf p_{2})^{2}=4p^{2}$ e</p>
   $$V=-\frac{16\,p^{4}}{16m^{3}c^{2}}=-\frac{p^{4}}{m^{3}c^{2}}=-\frac{p^{4}}{8\mu^{3}c^{2}},$$
   <p>la correzione relativistica all&rsquo;energia cinetica per una particella di massa $\mu$. Senza campo il fondamentale è non degenere, e la correzione al primo ordine è il valor medio.</p>`},
   {label:'Il valor medio senza integrali difficili', body:R`
   <p>Il trucco è usare l&rsquo;equazione agli autovalori: $p^{2}/2\mu=E_{1}+e^{2}/r$ sul fondamentale, quindi $\langle p^{4}\rangle=4\mu^{2}\langle(E_{1}+e^{2}/r)^{2}\rangle=4\mu^{2}\big[E_{1}^{2}+2E_{1}e^{2}\langle1/r\rangle+e^{4}\langle1/r^{2}\rangle\big]$. Con $\langle1/r\rangle=1/r_{0}$ e $\langle1/r^{2}\rangle=2/r_{0}^{2}$, calcolati con la $R_{10}$ del testo, si ottiene $\langle p^{4}\rangle=5\mu^{2}e^{4}/r_{0}^{2}$, e</p>
   $$\Delta E=-\frac{\langle p^{4}\rangle}{8\mu^{3}c^{2}}=-\frac{5e^{4}}{8\mu c^{2}r_{0}^{2}}=-\frac58\,\mu c^{2}\alpha^{4}=-\frac54\,\alpha^{2}|E_{1}| .$$
   <p>È una frazione dell&rsquo;ordine di $\alpha^{2}$ dell&rsquo;energia di legame, come previsto dalla tappa 01: la correzione relativistica ai livelli dell&rsquo;idrogeno è piccola perché $v/c\approx\alpha$.</p>`}
  ]}
]},
/* ---------------- 10 · OLTRE IL MODELLO ---------------- */
{ num:'10', title:'Fin dove arriva il modello: il nucleo che si muove, la gerarchia delle correzioni, e un atomo grande come il sistema solare', meta:'la massa ridotta e gli isotopi · positronio e idrogeno muonico · struttura fine, Lamb e iperfine in potenze di alfa · lunghezza Compton e raggio classico · la Terra come atomo di Bohr gravitazionale',
  blocchi:[
  {t:'prosa', title:'Il nucleo non sta fermo', tag:'massa ridotta', html:R`
  <p>Il conto delle tappe precedenti è fatto per una particella in un potenziale fisso; l&rsquo;atomo vero sono due corpi. Griffiths lo dice nel modo più breve: <i>«we can correct for the motion of the nucleus in hydrogen by simply replacing the electron mass with the reduced mass»</i>, e Shankar dà l&rsquo;<span class="str" data-str="ordini-di-grandezza">ordine di grandezza</span> della correzione con un rapporto $m/M\sim1/2000$, per cui <i>«the reduced mass $\mu$ and electron mass $m$ are almost equal: as are the relative coordinate and the electron coordinate»</i>. Il problema 5.2 di Griffiths chiede di misurare quanto: l&rsquo;errore relativo sull&rsquo;energia di legame è $(m/M)/(1+m/M)$, cioè circa lo $0{,}054\%$.</p>
  <p>Piccolo, ma visibile. La riga rossa di Balmer, da $n=3$ a $n=2$, cade a $656{,}47$ nm nell&rsquo;idrogeno e a $656{,}29$ nm nel deuterio, con lo stesso nucleo carico ma una massa doppia: le due righe sono separate da circa $0{,}18$ nm, una distanza che uno spettrometro risolve senza fatica. La costante di Rydberg dell&rsquo;idrogeno che Picasso riporta, più piccola di quella a massa nucleare infinita proprio del fattore $1+m_{e}/m_{p}$, è la stessa correzione vista dall&rsquo;altro lato.</p>
  <p>Quando le due masse sono uguali la correzione non è più piccola. Nel positronio, un elettrone legato a un positrone, la massa ridotta è $\mu=m/2$ e tutte le energie si dimezzano: l&rsquo;energia di legame è circa $6{,}8$ eV, i raggi raddoppiano. Nell&rsquo;idrogeno muonico, all&rsquo;opposto, il muone è $206{,}77$ volte più pesante dell&rsquo;elettrone, la massa ridotta è circa $185{,}8$ masse elettroniche, e la riga Lyman-$\alpha$ scende da $121{,}5$ nm a circa $0{,}654$ nm: non più ultravioletto, ma raggi X. Lo stesso conto, con un solo parametro cambiato, copre dall&rsquo;atomo d&rsquo;idrogeno ordinario a sistemi esotici con spettri in zone diverse dello spettro elettromagnetico.</p>`},
  {t:'prosa', title:'La gerarchia delle correzioni', tag:'potenze di alfa', html:R`
  <p>Griffiths, aprendo la struttura fine, mette in fila quello che il modello coulombiano trascura: <i>«fine structure is a tiny perturbation — smaller by a factor of $\alpha^{2}$»</i> rispetto ai livelli di Bohr, <i>«smaller still (by another factor of $\alpha$) is the Lamb shift, associated with the quantization of the electric field, and smaller by yet another order of magnitude is the hyperfine structure, which is due to the magnetic interaction between the dipole moments of the electron and the proton»</i>. La sua tabella 6.1 lo scrive in potenze: livelli di Bohr dell&rsquo;ordine di $\alpha^{2}mc^{2}$, struttura fine di $\alpha^{4}mc^{2}$, spostamento di Lamb di $\alpha^{5}mc^{2}$, iperfine di $(m/m_{p})\alpha^{4}mc^{2}$.</p>
  <p>Il rapporto fra struttura fine e livelli è $\alpha^{4}mc^{2}/\alpha^{2}mc^{2}$, cioè $\alpha^{2}\approx5{,}3\cdot10^{-5}$. È esattamente l&rsquo;ordine della correzione relativistica calcolata nel compito della tappa 09, $-\tfrac58\mu c^{2}\alpha^{4}$ sul fondamentale: in un atomo leggero la velocità tipica è $v/c\approx\alpha$, e le correzioni relativistiche vanno come $(v/c)^{2}$. Per un atomo idrogenoide con carica nucleare $Ze$ la velocità diventa $Z\alpha c$ e il rapporto diventa $(Z\alpha)^{2}$: per $Z=80$, il mercurio, vale circa $0{,}34$, e il modello non relativistico non è più una buona prima approssimazione per gli elettroni interni.</p>`},
  {t:'plot', title:'Quanto pesa la relatività al crescere di Z',
   intro:R`<p>Il rapporto $(Z\alpha)^{2}$ fra la struttura fine e i livelli di un atomo idrogenoide, in funzione della carica nucleare $Z$.</p>`,
   plots:[{kind:'func2d', xr:[1,100], yr:[0,0.6], height:250, ticks:true,
     title:'(Z alpha)^2 contro Z',
     curves:[{f:'Math.pow(x/137.036,2)', col:'#5aa9ff', width:2.4, label:'(Z alpha)^2'}],
     xlabel:'Z', ylabel:'correzione relativa'}],
   leggi:R`<p><b>Che cosa guardare.</b> A $Z=1$ la curva è praticamente a zero, $5{,}3\cdot10^{-5}$; cresce come una parabola e a $Z=80$ arriva a un terzo. Nessun punto della curva supera $1$ per gli atomi reali, ma per $Z$ intorno a $100$ la correzione è metà del termine principale.</p>
   <p><b>Che cosa impararne.</b> L&rsquo;idrogeno è un ottimo banco di prova della meccanica quantistica non relativistica perché $\alpha$ è piccolo. Il successo del modello nella tappa 03 dice quanto è piccolo $\alpha$, non che la relatività sia irrilevante.</p>`},
  {t:'prosa', title:'Due lunghezze più piccole del raggio di Bohr', tag:'Shankar', html:R`
  <p>Shankar, dopo aver stimato il raggio di Bohr, si sofferma su due lunghezze che si ottengono moltiplicandolo per $\alpha$. La prima è la lunghezza d&rsquo;onda Compton dell&rsquo;elettrone, $\lambda_{C}=\hbar/mc$, che <i>«is 137 times smaller than the Bohr radius»</i>: con $a_{0}=\hbar^{2}/me^{2}$ e la definizione $\alpha=e^{2}/\hbar c$ si ha proprio $\alpha a_{0}=\hbar/mc$, circa $3{,}86\cdot10^{-13}$ m. Che cosa rappresenta? Shankar la definisce come <i>«the lower limit on how well a particle can be localized»</i>: per localizzare una particella entro $\Delta x$ serve un fotone di impulso $\hbar/\Delta x$ ed energia $\hbar c/\Delta x$, e se questa supera $2mc^{2}$ la misura può creare una coppia particella-antiparticella, cioè $\Delta x$ non può scendere sotto $\hbar/2mc$. La conclusione per l&rsquo;atomo: trattare l&rsquo;elettrone come puntiforme <i>«is not strictly correct, but it also shows that it is a fair approximation»</i>, perché la sua indeterminazione intrinseca è $\alpha$ volte la dimensione dell&rsquo;atomo. E aggiunge un controfattuale: <i>«had the electric charge been 10 times as big, $\alpha$ would have been of order unity»</i>; infatti $\alpha$ va come $e^{2}$, e cento volte $1/137$ dà circa $0{,}73$.</p>
  <p>La seconda lunghezza è il raggio classico dell&rsquo;elettrone, $r_{e}=\alpha\lambda_{C}=e^{2}/mc^{2}$, circa $2{,}82\cdot10^{-15}$ m: è il raggio che si ottiene uguagliando l&rsquo;energia coulombiana $e^{2}/r_{e}$ di una carica distribuita su una sfera alla sua energia a riposo. Raggio classico, lunghezza Compton e raggio di Bohr stanno quindi in progressione geometrica di ragione $1/\alpha$. Shankar avverte che le immagini del modello di Bohr <i>«must be used with caution, for they are phrased in terms not allowed in quantum theory»</i>: servono a ricordare i numeri, non a spiegarli.</p>`},
  {t:'reveal', title:'La Terra come atomo di Bohr (Griffiths, problema 4.17)', tag:'stima', steps:[
   {label:'Il raggio di Bohr gravitazionale', body:R`
   <p>Griffiths propone di trattare il sistema Terra-Sole come un <i>«gravitational analog to the hydrogen atom»</i>. Il potenziale è $-GMm/r$: basta sostituire $e^{2}$ con $GMm$ in tutte le formule. Il raggio di Bohr diventa $a_{g}=\hbar^{2}/GMm^{2}$, e con le masse di Terra e Sole vale circa $2{,}35\cdot10^{-138}$ m, un numero senza alcun significato fisico diretto: è ben al di sotto di qualunque lunghezza misurabile.</p>`},
   {label:'Il numero quantico della Terra', body:R`
   <p>I livelli sono $E_{n}=-m(GMm)^{2}/2\hbar^{2}n^{2}$. Uguagliandoli all&rsquo;energia classica di un&rsquo;orbita circolare di raggio $r_{0}$, che è $-GMm/2r_{0}$, si trova $n=\sqrt{r_{0}/a_{g}}$, e con $r_{0}$ pari a un&rsquo;unità astronomica $n\approx2{,}52\cdot10^{74}$. Un numero quantico di questa taglia è la ragione per cui l&rsquo;orbita terrestre non mostra nessun effetto di quantizzazione: i livelli adiacenti sono così vicini da formare un continuo.</p>`},
   {label:'Il fotone, o gravitone, della transizione', body:R`
   <p>Una transizione al livello $n-1$ libera circa $2|E_{n}|/n$, cioè circa $2{,}1\cdot10^{-41}$ J, e la lunghezza d&rsquo;onda del quanto emesso è circa un anno luce. Griffiths chiede se sia una coincidenza, e non lo è: la frequenza della transizione, $2|E_{n}|/n\hbar$, con $n=m\sqrt{GMr_{0}}/\hbar$ diventa $\sqrt{GM/r_{0}^{3}}$, la frequenza angolare dell&rsquo;orbita. A $n$ grande la frequenza emessa coincide con quella del moto classico, e un&rsquo;onda che oscilla una volta all&rsquo;anno ha lunghezza d&rsquo;onda pari alla distanza percorsa dalla luce in un anno. È il principio di corrispondenza, letto su un esempio in cui il limite classico è raggiunto con un margine di settantaquattro ordini di grandezza.</p>`}
  ]}
]},
/* ---------------- 11 · LE FONTI A CONFRONTO, E L ORALE ---------------- */
{ num:'11', title:'Dove le fonti divergono, e le domande d orale', meta:'onde contro matrici sull atomo di idrogeno · tre nomi per la stessa degenerazione · tre convenzioni per gli stessi polinomi · un numero di Ballentine che non torna · che cosa ciascuna fonte mette al centro · domande d orale',
  blocchi:[
  {t:'prosa', title:'Onde o matrici: chi risolve l atomo', tag:'formalismi', html:R`
  <p>Il documento di sintesi sui postulati che Giuseppe ha caricato, scritto da un compagno di corso sullo schema di Styer e collaboratori, <i>«Nine formulations of quantum mechanics»</i>, mette l&rsquo;atomo di idrogeno nella colonna della formulazione ondulatoria, <i>«intuitiva per potenziali, tunnel, scattering»</i>, e scrive della formulazione matriciale che <i>«brilla»</i> negli <i>«spettri algebrici (oscillatore, momento angolare)»</i> e <i>«soffre sui problemi di posizione»</i>. Per il programma del corso la collocazione è giusta: le tappe 02, 03 e 07 risolvono un&rsquo;equazione differenziale. Ma la storia raccontata da Landau, e il conto della tappa 05, dicono che l&rsquo;atomo di idrogeno è anche uno spettro algebrico: Pauli lo ottenne nel 1926 con le sole relazioni di commutazione, prima della soluzione di Schrödinger, perché il potenziale coulombiano ha una costante del moto in più, il vettore di Lenz, e con essa un&rsquo;algebra che chiude. L&rsquo;atomo d&rsquo;idrogeno è il caso in cui le due formulazioni lavorano entrambe, e il confronto fra i due conti mostra che cosa ciascuna vede: l&rsquo;equazione differenziale vede la serie che deve fermarsi, l&rsquo;algebra vede la <span class="str" data-str="simmetrie">simmetria</span> che rende la degenerazione $n^{2}$.</p>
  <p>Le fonti si distribuiscono sulle due vie. Picasso e Griffiths fanno solo la serie, con la stessa logica e notazioni diverse; Sakurai e Landau riconoscono nell&rsquo;equazione la funzione ipergeometrica confluente e ne leggono la terminazione; Ballentine fa la serie e poi, in un paragrafo a parte, separa in coordinate paraboliche, che è la manifestazione analitica della simmetria nascosta; Shankar e Landau danno il vettore di Lenz e l&rsquo;algebra delle rotazioni in quattro dimensioni. Nessuna fonte, da sola, fa entrambe le cose fino in fondo: è il motivo per cui questo movimento le ha cucite.</p>`},
  {t:'prosa', title:'Tre nomi per la stessa degenerazione, tre convenzioni per gli stessi polinomi', tag:'fonti', html:R`
  <p>La degenerazione in $l$ si chiama accidentale in Landau, che però nello stesso paragrafo ne dà la ragione nella simmetria; Shankar scrive che il nome <i>«is, however, a misnomer»</i>; Sakurai che <i>«this degeneracy is in fact not accidental»</i>. Picasso non le dà un nome e la legge classicamente: l&rsquo;energia di un&rsquo;orbita kepleriana dipende solo dal semiasse maggiore. All&rsquo;orale conviene usare la parola di Landau e subito dopo la ragione di Sakurai, che è il modo in cui le quattro fonti stanno insieme.</p>
  <p>I polinomi di Laguerre associati compaiono in almeno tre convenzioni. Griffiths scrive $L^{p}_{q}$ con un coefficiente costante che, per esempio, dà $L^{1}_{1}=4-2x$; Ballentine $L^{2l+1}_{n+l}(\rho)$, con l&rsquo;indice in basso legato al polinomio di partenza, come Pauling-Wilson e Schiff, mentre Messiah e Merzbacher usano la normalizzazione moderna; Landau evita i polinomi e scrive la funzione ipergeometrica confluente $F(-n+l+1,2l+2,\rho)$. Le funzioni radiali normalizzate, da moltiplicare per le <span class="str" data-str="armoniche-sferiche">armoniche sferiche</span>, sono le stesse in tutte le fonti, a meno di un segno globale; cambiano le costanti davanti ai polinomi. È la ragione per cui conviene controllare una $R_{nl}$ verificando che risolve l&rsquo;equazione radiale ed è normalizzata, come fa la tabella della tappa 07, invece di confrontare le formule fra libri diversi.</p>`},
  {t:'prosa', title:'Un numero che non torna, e una fonte non aperta', tag:'errata', html:R`
  <p><b>Ballentine, il deutone.</b> Applicando la sua disuguaglianza $\langle r^{2}\rangle\langle T\rangle\ge9\hbar^{2}/8\mu$ al deutone, Ballentine scrive $\langle T\rangle\ge28{,}4$ MeV; il conto con i dati che lui stesso riporta dà circa $21{,}0$ MeV. La tappa 08 mostra il conto e dichiara che la discrepanza non si spiega con le interpretazioni del raggio che il testo lascia aperte. La conclusione qualitativa, che l&rsquo;energia potenziale media è molto più grande in modulo dell&rsquo;energia di legame, resta vera con entrambi i numeri.</p>
  <p><b>Bransden e Joachain.</b> Il testo, presente fra le fonti del corso, è una scansione il cui testo estratto non si è potuto usare; non è stato citato in questo movimento.</p>`},
  {t:'prosa', title:'Che cosa mette al centro ciascuna fonte', tag:'fonti', html:R`
  <p>Picasso è la fonte del corso e la più vicina all&rsquo;esame: la soluzione con la serie, la degenerazione letta classicamente, le tre definizioni di dimensione dell&rsquo;atomo, le costanti di Rydberg con la massa ridotta. Griffiths è la più esplicita sui passaggi della serie e sui problemi numerici, dallo spettro alla Terra come atomo gravitazionale, e la sua tabella 6.1 è la mappa delle correzioni che il modello trascura. Ballentine porta i conti che gli altri non fanno: la stima dimensionale dei livelli, le coordinate paraboliche, la disuguaglianza che lega dimensione ed energia cinetica. Shankar insiste sugli ordini di grandezza e sulle due lunghezze più piccole del raggio di Bohr, e sul vettore di Lenz come simmetria. Sakurai e Landau danno la struttura: la funzione ipergeometrica confluente, la simmetria $SO(4)$, la storia di Pauli. Le note del corso e i compiti fissano che cosa serve saper fare in due ore: lo spettro, la degenerazione, le funzioni d&rsquo;onda più basse, i valori medi di $r$, e la combinazione con lo spin e la statistica del compito della tappa 09.</p>`},
  {t:'collaudo', title:'Domande d’orale', items:[
   {q:'Perché la serie deve fermarsi, e che cosa dà la condizione di terminazione?', a:R`Perché, se non si ferma, i coefficienti per indice grande crescono come quelli di $e^{2\rho}$ e la funzione radiale, moltiplicata per $e^{-\rho}$, esplode come $e^{\rho}$. La serie si ferma solo se $\rho_{0}=2n$ con $n$ intero positivo, e questa condizione, scritta per l&rsquo;energia, è la formula di Bohr; l&rsquo;intero $n$ è la somma del grado del polinomio, più $l$, più uno.`},
   {q:'Quanto vale la degenerazione del livello n, e da dove viene?', a:R`$n^{2}$ senza spin: per ogni $l$ da $0$ a $n-1$ ci sono $2l+1$ valori di $m$. La parte $2l+1$ viene dalle rotazioni, come per ogni potenziale centrale; la somma su $l$ viene da una costante del moto in più, il vettore di Lenz, che allarga la simmetria a quella delle rotazioni in quattro dimensioni. Con lo spin dell&rsquo;elettrone diventa $2n^{2}$, e con quello del protone $4n^{2}$.`},
   {q:'Che cosa rappresenta classicamente il vettore di Lenz?', a:R`È un vettore diretto verso il perielio, con modulo proporzionale all&rsquo;eccentricità dell&rsquo;orbita. Che si conservi vuol dire che l&rsquo;ellisse non ruota: le orbite chiuse del problema di Keplero sono la manifestazione classica della stessa simmetria che quantisticamente rende degeneri gli stati con lo stesso $n$ e $l$ diversi.`},
   {q:'Quanto è grande l atomo di idrogeno?', a:R`Dipende da che cosa si misura, e Picasso ne dà tre definizioni: il raggio entro cui si trova la particella con il novanta per cento di probabilità, circa $2{,}66\,a_{0}$ nel fondamentale; il valor medio di $r$, $\tfrac32a_{0}$; l&rsquo;inverso del valor medio di $1/r$, $a_{0}$, che è quello legato all&rsquo;energia dal teorema del viriale. Per i livelli eccitati il valor medio di $r$ cresce come $n^{2}$.`},
   {q:'Dove sono i nodi delle funzioni radiali?', a:R`La funzione $R_{nl}$ ha $n-l-1$ nodi a $r$ finito, esclusa l&rsquo;origine: è il grado del polinomio, e il teorema di oscillazione applicato all&rsquo;equazione radiale. Le funzioni con $l=n-1$ non hanno nodi, e la loro densità radiale ha il massimo a $n^{2}a_{0}$, il raggio dell&rsquo;orbita di Bohr.`},
   {q:'Perché un atomo con due fermioni identici nel livello più basso è per forza in singoletto di spin?', a:R`Perché nel livello $n=1$ c&rsquo;è solo $l=0$, una funzione pari sotto lo scambio, e la funzione totale deve essere antisimmetrica, quindi lo spin deve essere nello stato antisimmetrico, il singoletto. È il punto che, nel compito del 14-02-2020, fa sì che il tripletto possa diventare il fondamentale solo scendendo da $n=2$.`},
   {q:'Quanto pesano le correzioni relativistiche, e perché?', a:R`Sono dell&rsquo;ordine di $\alpha^{2}$ rispetto ai livelli, perché la velocità tipica dell&rsquo;elettrone è $\alpha c$ e le correzioni vanno come $(v/c)^{2}$. Lo spostamento di Lamb è un altro fattore $\alpha$ più piccolo, la struttura iperfine è ridotta in più dal rapporto fra la massa dell&rsquo;elettrone e quella del protone. Per un idrogenoide di carica $Z$ il rapporto diventa $(Z\alpha)^{2}$.`},
   {q:'Che cosa cambia passando dall idrogeno al deuterio, al positronio, all idrogeno muonico?', a:R`Solo la massa ridotta, che riscala tutte le energie e, inversamente, tutte le lunghezze. Nel deuterio le righe si spostano di una frazione dell&rsquo;ordine di $m_{e}/2m_{p}$; nel positronio le energie si dimezzano; nell&rsquo;idrogeno muonico crescono di circa $186$ volte e la riga Lyman-$\alpha$ finisce nei raggi X.`}
  ]}
]}
