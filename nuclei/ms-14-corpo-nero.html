    a:R`No, e il criterio per prevederlo è esattamente quello sviluppato nel movimento sulla condensazione: l'esponente della densità di modi vicino a zero determina l'esponente della legge di potenza. Con dispersione lineare, $\omega\propto k$, la densità di modi in tre dimensioni va come $\omega^2$ (esponente $\alpha-1=2$, cioè $\alpha=3$), e l'energia a bassa $T$ va come $T^{\alpha+1}=T^4$, il calore specifico come $T^3$. Con una dispersione quadratica, $\omega\propto k^2$, il conteggio dei modi cambierebbe esponente — lo stesso tipo di riscalamento geometrico visto altrove per hamiltoniane a potenze — e la legge di potenza risultante sarebbe diversa. La legge $T^3$ di Debye non è un fatto universale dei solidi: è una conseguenza specifica della dispersione lineare delle onde acustiche, ed è per questo che alcuni sistemi esotici (dispersione fononica anomala, effetti di superficie in nanostrutture) mostrano leggi di potenza diverse a bassa temperatura.`}
  ]}
]},

/* ---------------- 09 · IL SENSO, E LE ROTTE ---------------- */
{ num:'09', title:'Il senso, e le rotte', meta:'cosa lascia in mano · dove il corpo nero riappare in fisica · la domanda che porta avanti',
  blocchi:[
  {t:'prosa', title:'Cosa portarsi via', tag:'sintesi', html:R`
  <p><b>Il punto.</b> Quando il numero di quanti non è vincolato dall'esterno, il potenziale chimico è nullo per un principio di minimo, non per un vincolo di conservazione — ed è questo singolo fatto, non una proprietà speciale della luce o del suono, a rendere risolubili fino in fondo sia la radiazione di corpo nero sia le vibrazioni di un solido. Tutto il resto è il conteggio dei modi di un sistema di oscillatori armonici, con o senza un taglio geometrico, integrato contro l'occupazione di Bose.</p>
  <p><b>Che cosa ricordare, in ordine di durata.</b> Che la formula di Planck si ottiene in un solo passo moltiplicando densità di modi, energia del quanto e occupazione di Bose — e che i suoi due limiti, Rayleigh-Jeans e Wien, sono la stessa formula vista da distanza diversa dall'origine. Che il massimo dello spettro dipende da <i>in che cosa</i> lo si misura — frequenza o lunghezza d'onda non danno lo stesso punto, per colpa dello jacobiano. Che la pressione di radiazione, $PV=E/3$, e quella di un gas materiale, $PV=2E/3$, differiscono per l'esponente della dispersione, non per la statistica. Che il modello di Einstein spiega Dulong-Petit ma non il crollo a bassa T, perché non ha modi a bassa frequenza; che Debye lo corregge dando alle vibrazioni la stessa densità $\omega^2$ dei fotoni, con un taglio che a bassa temperatura diventa invisibile — ed è per questo che, sotto il cofano, il calore specifico dei solidi e la radiazione di corpo nero calcolano lo stesso integrale.</p>
  <p><b>La strategia d'attacco, che vale per entrambi i problemi.</b> Si stabilisce che $\mu=0$ verificando che il numero di quanti non è vincolato. Si conta la densità di modi $G(\omega)$ con il metodo geometrico della tappa 01 — polarizzazioni, dimensionalità, dispersione — includendo un eventuale taglio se il numero totale di modi è finito. Si integra $\hbar\omega\,G(\omega)\,n(\omega)$ per l'energia, o si deriva rispetto a $T$ per il calore specifico. Si isolano i due regimi, $\hbar\omega_{\rm car}\ll T$ e $\hbar\omega_{\rm car}\gg T$, che sono quasi sempre ciò che una domanda d'esame o d'orale chiede per davvero.</p>
  <p><b>Un errore di fonte, dichiarato.</b> Il modello di Einstein per i fononi <b>non è nel dossier</b> di Crisanti usato per questo movimento: le sue note lo rimandano esplicitamente alle lezioni orali del corso, con la sola frase «approfondito nelle lezioni ordinarie». È stato ricostruito qui come derivazione standard — non attribuita a una pagina che non lo contiene — proprio perché senza di esso il contrasto con Debye, che è il cuore della tappa 08, non si potrebbe scrivere.</p>`},
  {t:'prolessi', title:'Dove riappare questo movimento',
   oggetto:R`<b>Il gas di quanti a numero non conservato</b> — l'idea che il potenziale chimico si annulli per un principio di minimo invece che per un vincolo — e la <b>densità di modi vicino all'origine come arbitro di una legge di potenza</b>, l'osservazione che decide se un calore specifico cade a zero come $T^3$ o come un esponenziale.`,
   rotte:[
    {dove:'La crisi che apre<br>la Meccanica Quantistica', txt:R`Planck introdusse il quanto $\hbar\omega$ nel 1900 non per una convinzione fisica profonda ma per interpolare fra due formule empiriche, e definì il suo stesso passo «un atto di disperazione». Einstein, nel 1905, fece il salto concettuale che a Planck mancava: propose che la luce stessa fosse composta di quanti — i fotoni — spiegando l'effetto fotoelettrico con un argomento che non richiede affatto la statistica di Bose (quella arriverà solo nel 1924). La derivazione di questo movimento, che parte dalla quantizzazione del <i>campo</i> come infiniti oscillatori armonici, è la sintesi novecentesca — dovuta a Dirac negli anni '20 — che Planck ed Einstein non avevano ancora a disposizione: è il punto di partenza esatto della <b>seconda quantizzazione</b>, l'idea che ogni campo classico diventi, quantizzato, un sistema di particelle il cui numero non è fissato. Chi segue Meccanica Quantistica nello stesso semestre incontrerà questa stessa costruzione — oscillatori armonici, operatori di creazione e distruzione, stati di Fock — applicata a ogni altro campo della fisica, dalle vibrazioni reticolari (i fononi di questo movimento) alle particelle elementari.`},
    {dove:'Il corpo nero<br>in astrofisica', txt:R`Una stella non è un corpo nero perfetto, ma la sua fotosfera si comporta abbastanza vicino a uno spettro di Planck da permettere di stimarne la temperatura superficiale dal colore — è l'applicazione diretta della legge di Wien della tappa 04, ed è così che si classificano le stelle nella sequenza spettrale O-B-A-F-G-K-M, dalle più calde e blu alle più fredde e rosse. La legge di Stefan-Boltzmann della tappa 03, $L=4\pi R^2\sigma T^4$, lega la luminosità di una stella al quadrato del suo raggio e alla quarta potenza della sua temperatura, ed è alla base di ogni stima di raggio stellare che non richieda un'osservazione diretta del disco. E la <b>radiazione cosmica di fondo</b> — l'eco del Big Bang, scoperta nel 1965 — è lo spettro di corpo nero più perfetto mai misurato in natura, a $2{,}725$ K: la sua forma esatta, prevista da questo stesso movimento, è una delle conferme sperimentali più precise di tutta la fisica.`},
    {dove:'I fononi come mediatori<br>della superconduttività', txt:R`I fononi di questo movimento non restano confinati al calore specifico: nella teoria BCS della superconduttività sono loro — non un'interazione elettrone-elettrone diretta — a mediare l'attrazione debolissima che lega due elettroni in una coppia di Cooper. Un elettrone che si muove nel reticolo lo deforma leggermente, lasciando una scia di carica positiva che un secondo elettrone, passando poco dopo, sente come un'attrazione netta: è un'interazione mediata da uno scambio di fononi virtuali, nello stesso linguaggio con cui la elettrodinamica quantistica descrive la forza fra due elettroni come scambio di fotoni virtuali. La temperatura critica di un superconduttore convenzionale dipende esplicitamente dalla temperatura di Debye del materiale — lo stesso $T_D$ definito nella tappa 07 — attraverso la formula di BCS, ed è il motivo per cui isotopi diversi dello stesso elemento (che hanno la stessa struttura elettronica ma una diversa massa reticolare, quindi un diverso $T_D$) hanno temperature critiche misurabilmente diverse: l'effetto isotopico, una delle prove sperimentali decisive a favore del meccanismo fononico.`}
   ],
   domanda:R`Il modello di Debye tratta il reticolo come un mezzo elastico continuo, un'approssimazione che funziona perché a bassa temperatura contano solo le lunghezze d'onda lunghe rispetto alla spaziatura reticolare. Ma a temperature intermedie — né il regime $T\ll T_D$ né quello $T\gg T_D$ — l'approssimazione lineare comincia a fallire, e la vera relazione di dispersione di un cristallo (che dipende dalla sua struttura microscopica, curva e con più rami — acustici e ottici) diventa necessaria per una previsione accurata. <b>Domanda che porti avanti:</b> quali oggetti servono per descrivere le vibrazioni di un reticolo periodico reale, con la sua cella elementare e la sua simmetria discreta, invece del continuo elastico di Debye? La risposta comincia dallo stesso conteggio dei modi in una scatola già usato in questo movimento — condizioni periodiche, $k=2\pi n/L$ — ma applicato non allo spazio continuo bensì al <b>reticolo reciproco</b> di un cristallo, dentro la sua prima zona di Brillouin: è il punto in cui la fisica dello stato solido comincia a divergere da questo movimento, e dove la geometria discreta del reticolo — non più un dettaglio trascurabile come nel taglio di Debye, ma l'ingrediente centrale — decide la forma esatta dello spettro vibrazionale.`}
]}


];

/* --- blocco PLOT: la figura non decora, si legge. Ogni plot porta una chiave di lettura. --- */
function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';
  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionSvelabile(title, tag, html, sol){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var c=document.createElement('div'); c.className='collaudo-item';
  var q=document.createElement('div'); q.className='cq'; q.innerHTML=html||'';
  c.appendChild(q); typeset(q);
  if(sol){
    var a=document.createElement('div'); a.className='ca'; a.style.display='none';
    a.innerHTML='<b>Soluzione.</b> '+sol;
    var btn=document.createElement('button'); btn.className='reveal-btn small';
    btn.textContent='Rivela la soluzione';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a);
      btn.disabled=true; btn.classList.add('done'); btn.textContent='Soluzione rivelata'; };
    c.appendChild(btn); c.appendChild(a);
  }
  wrap.appendChild(c); return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    /* DUE SCHEMI, NON UNO — scoperto il 2026-10-06 provando le pagine vive. I movimenti
       scritti per primi (em-01..03, me-10b, i collaudi di gd-01..09 e di quattro em)
       usano una forma piu' semplice: `reveal` e `prolessi` con un solo `html`,
       `esercizio` e `collaudo` con `html` + `sol`. Il renderer ne conosceva una sola e
       chiamava `steps.forEach` su `undefined`: TypeError, e la tappa si fermava li' —
       62 blocchi in 17 movimenti su 74. Non si riscrive il contenuto per far contento
       il renderer: e' il renderer che deve leggere cio' che c'e'.
       E in fondo un ramo che NON muore: uno schema nuovo di domani deve far vedere un
       avviso in quella sezione, non spegnere la pagina sotto di se'. */
    try{
      if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
      else if(b.t==='prolessi') m.appendChild(b.rotte ? sectionProlessi(b)
                                   : sectionProsa(b.title,'prolessi',b.html));
      else if(b.t==='reveal')m.appendChild(b.steps ? sectionReveal(b.title,b.tag,b.steps)
                                   : sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='esercizio') m.appendChild(b.steps ? sectionEsercizio(b)
                                   : sectionSvelabile(b.title,'esercizio',b.html,b.sol));
      else if(b.t==='collaudo')  m.appendChild(b.items ? sectionCollaudo(b.title,b.items)
                                   : sectionSvelabile(b.title,'provi, poi riveli',b.html,b.sol));
      else if(b.t==='plot')      m.appendChild(sectionPlot(b));
      else m.appendChild(sectionProsa(b.title||'(blocco)', 'tipo sconosciuto: '+b.t,
                                      b.html||''));
    }catch(err){
      var avv=document.createElement('section'); avv.className='section';
      avv.innerHTML='<h3>'+(b.title||'(blocco)')+'<span class="tag">non reso</span></h3>'
        +'<p style="color:#ff6b6b">Questo blocco non si &egrave; potuto rendere ('
        +b.t+': '+err.message+'). Il resto della tappa continua sotto.</p>';
      m.appendChild(avv);
    }
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* I POP-UP DEGLI STRUMENTI. `cablaStrumenti` esisteva dal 18-09 e non la chiamava
     nessuno: i 229 rimandi del percorso erano <span> senza handler, e il clic non
     faceva niente. Nessun controllo poteva vederlo — la sintassi era valida, le schede
     c'erano tutte, le formule rendevano: il guasto esisteva solo a pagina viva. Qui, e
     dopo ogni inserimento successivo, perche' la tappa si rimonta da capo a ogni
     cambio e gli handler vanno riattaccati al DOM nuovo. */
  cablaStrumenti(m);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}

/* deep-link: ms-14-corpo-nero.html#03 apre direttamente la tappa 03 */
window.addEventListener('DOMContentLoaded', function(){
  var h=(location.hash||'').replace('#','');
  showTappa(byId[h]?h:'00');
});
window.addEventListener('hashchange', function(){
  var h=(location.hash||'').replace('#','');
  if(byId[h]) showTappa(h);
});
</script>
