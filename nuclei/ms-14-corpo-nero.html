/* ===================================================================

   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che

var CORSO = 'meccanica-statistica';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["serie-geometrica"] = {"nome":"Serie geometrica","riga":"La somma $\\sum_{n\\ge 0} q^{n}$ vale $\\dfrac{1}{1-q}$ se $|q|\\lt 1$, e non esiste se $|q|\\ge 1$.","serve":"È l'unica serie di cui si conosce la somma in forma chiusa senza fatica, e per questo diventa il metro di tutte le altre: una serie si studia maggiorandola con una geometrica (criterio del rapporto, criterio della radice) o riconoscendola come geometrica travestita.","esempio":"Con $q=\\tfrac12$: $1+\\tfrac12+\\tfrac14+\\cdots=\\dfrac{1}{1-\\tfrac12}=2$. Con $q=-\\tfrac13$: $\\dfrac{1}{1+\\tfrac13}=\\tfrac34$. Con $q=1$ le somme parziali sono $N+1$ e se ne vanno: la formula $1/(1-q)$ non è una scorciatoia da usare fuori dal suo raggio.","pieno":{"file":"07-serie-funzioni.html","tappa":"04","come":"il raggio $R=1$, il grafico delle somme parziali e la cassetta dei trucchi che parte da qui, nella tappa sulle serie di potenze"},"qui":{"metodi-e-modelli":{"serve":"È il motore della serie di Laurent: lo sviluppo di $\\dfrac{1}{z-a}$ in potenze di $z$ o di $1/z$ è una geometrica, e quale delle due si sceglie decide in quale corona si sta sviluppando. Tutta la parte principale di Laurent nasce da qui.","esempio":"Per $\\dfrac{1}{z-2}$ con $|z|\\lt 2$ si scrive $-\\tfrac12\\cdot\\dfrac{1}{1-z/2}=-\\sum_{n\\ge0}\\dfrac{z^{n}}{2^{n+1}}$; in $z=1$ entrambi i membri valgono $-1$. Per $|z|\\gt 2$ si raccoglie invece $z$ e viene $\\sum_{n\\ge0}\\dfrac{2^{n}}{z^{n+1}}$, cioè solo potenze negative; in $z=4$ entrambi i membri valgono $\\tfrac12$."},"elettromagnetismo":{"serve":"Compare ogni volta che una configurazione si ripete con un fattore costante — catene di cariche immagine fra due piani conduttori, riflessioni multiple in una cavità — e la somma chiusa è ciò che rende il conto finito invece che infinito.","esempio":"Una carica fra due piani paralleli genera immagini a distanze crescenti, e il contributo al potenziale è una somma del tipo $\\sum_{n\\ge0} r^{n}$ con $r\\lt 1$ fissato dalla geometria. Con una riflettività $r=\\tfrac14$ la serie vale $\\tfrac43$: la catena è infinita, il potenziale no."}},"controllo":[{"tipo":"somma","espr":"(1/2)**n","var":"n","da":"0","a":"oo","vale":"2","dove":"esempio","appare":"=2"},{"tipo":"somma","espr":"(-1/3)**n","var":"n","da":"0","a":"oo","vale":"3/4","dove":"esempio","appare":"\\tfrac34"},{"tipo":"somma","espr":"-1**n/2**(n+1)","var":"n","da":"0","a":"oo","vale":"-1","dove":"qui.metodi-e-modelli.esempio","appare":"-1"},{"tipo":"somma","espr":"2**n/4**(n+1)","var":"n","da":"0","a":"oo","vale":"1/2","dove":"qui.metodi-e-modelli.esempio","appare":"\\tfrac12"},{"tipo":"somma","espr":"(1/4)**n","var":"n","da":"0","a":"oo","vale":"4/3","dove":"qui.elettromagnetismo.esempio","appare":"\\tfrac43"},{"tipo":"uguale","sinistra":"1/(1-2)","vale":"-1","dove":"qui.metodi-e-modelli.esempio","appare":"-1"},{"tipo":"uguale","sinistra":"1/(4-2)","vale":"1/2","dove":"qui.metodi-e-modelli.esempio","appare":"\\tfrac12"}]};
STRUM["funzione-gamma"] = {"nome":"Funzione Gamma","riga":"$\\Gamma(z)=\\displaystyle\\int_0^{\\infty}t^{z-1}e^{-t}\\,dt$, e da questa $\\displaystyle\\int_0^{\\infty}t^{k}e^{-at}\\,dt=\\dfrac{\\Gamma(k+1)}{a^{k+1}}$ per $a>0$.","serve":"E' il fattoriale esteso ai numeri non interi — $\\Gamma(n+1)=n!$ — e soprattutto e' la forma chiusa di TUTTI gli integrali del tipo «potenza per esponenziale». Sapere questa sola formula sostituisce una decina di integrazioni per parti, e permette di leggere a vista il risultato di un integrale appena si riconosce l'esponente della potenza.","esempio":"Da $\\Gamma(z+1)=z\\,\\Gamma(z)$, che si ottiene integrando per parti una volta, discende $\\Gamma(n+1)=n!$ per $n$ intero: $\\Gamma(1)=1$, $\\Gamma(2)=1$, $\\Gamma(3)=2$, $\\Gamma(4)=6$. Sui semi-interi il capostipite e' $\\Gamma(\\tfrac12)=\\sqrt\\pi$ — che e' l'integrale gaussiano travestito — e da li' $\\Gamma(\\tfrac32)=\\tfrac12\\sqrt\\pi$, $\\Gamma(\\tfrac52)=\\tfrac34\\sqrt\\pi$. Un integrale come $\\int_0^\\infty t^{2}e^{-at}dt$ vale dunque $\\Gamma(3)/a^{3}=2/a^{3}$, senza fare nessun conto.","pieno":null,"qui":{"meccanica-statistica":{"serve":"E' l'inventario degli integrali del canonico ridotto a una riga. Ogni funzione di partizione di singola particella e' un integrale di potenza per esponenziale — cambia solo l'esponente, e con esso la fisica: $t^{1/2}$ per il gas classico, $t^{2}$ per l'ultrarelativistico, $t^{3/n}$ per un potenziale $\\alpha r^{n}$. Riconoscere quale $\\Gamma$ si sta calcolando e' cio' che distingue chi risolve lo scritto in dieci minuti da chi lo risolve in un'ora.","esempio":"Per una particella relativistica con $\\varepsilon=cp$ la partizione porta $\\int_0^\\infty p^{2}e^{-\\beta cp}dp=\\Gamma(3)/(\\beta c)^{3}=2/(\\beta c)^{3}$, da cui $\\langle\\varepsilon\\rangle=3T$ invece dei $\\tfrac32T$ del caso non relativistico. Il fattore 3 contro $3/2$ viene per intero dall'esponente della potenza, cioe' dall'argomento della Gamma: la dipendenza dell'energia dalla quantita' di moto decide da sola quanto calore serve a scaldare il gas."}}};
STRUM["funzione-zeta-di-riemann"] = {"nome":"Funzione zeta di Riemann","riga":"$\\zeta(s)=\\sum_{n\\ge1} n^{-s}$, convergente per $s>1$; i valori che servono sono $\\zeta(3/2)\\simeq 2{,}612$, $\\zeta(2)=\\pi^{2}/6\\simeq1{,}645$, $\\zeta(3)\\simeq1{,}202$, $\\zeta(4)=\\pi^{4}/90$.","serve":"Compare tutte le volte che una somma su stati discreti viene approssimata con un integrale e si sviluppa l'integrando in serie geometrica: si scambiano somma e integrale e resta una zeta moltiplicata per una gamma. Non e' un abbellimento — il valore NUMERICO di $\\zeta(3/2)$ decide se una transizione di fase esiste.","esempio":"$\\displaystyle\\int_{0}^{\\infty}\\frac{x^{s-1}}{e^{x}-1}dx=\\Gamma(s)\\zeta(s)$, che si ottiene scrivendo $\\frac{1}{e^{x}-1}=\\sum_{n\\ge1}e^{-nx}$ e integrando termine a termine. Per $s=4$ da' $\\pi^{4}/15$, che e' la costante che compare nella legge di Stefan-Boltzmann.","pieno":null,"qui":{"meccanica-statistica":{"serve":"E' cio' che rende la condensazione di Bose-Einstein un fatto e non una possibilita'. Il numero di particelle negli stati eccitati e' limitato superiormente da un integrale che vale $\\zeta(3/2)$: siccome quel numero e' FINITO, oltre una certa densita' le particelle in eccesso non hanno dove stare se non nello stato fondamentale.","esempio":"La condizione critica e' $n\\lambda^{3}=\\zeta(3/2)\\simeq2{,}612$, che definisce $T_{c}$. In due dimensioni lo stesso conto porta a $\\zeta(1)$, che DIVERGE: gli stati eccitati accolgono qualunque numero di particelle e la condensazione non avviene. La dimensionalita' entra nel risultato attraverso l'argomento della zeta, e il confine e' esattamente $s=1$."}}};

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

/* ---------------- 00 · DUE GAS SENZA NUMERO FISSATO ---------------- */
{ num:'00', title:'Due gas di bosoni che non conservano il proprio numero', meta:'perché il potenziale chimico è nullo · fotoni e fononi come stesso problema · la condizione di minimo',
  blocchi:[
  {t:'prosa', title:'Perché fotoni e fononi sono lo stesso problema', tag:'apertura', html:R`
  <p>Un gas ordinario di bosoni ha un numero di particelle fissato: si mette un certo N di atomi in una scatola, si chiude il coperchio, e quel numero resta quello per tutta l'evoluzione. Il potenziale chimico, in quel problema, è lo strumento con cui si impone il vincolo — si sceglie μ in modo che la somma sugli stati dia esattamente N.</p>
  <p>La radiazione dentro una cavità e le vibrazioni di un reticolo cristallino sono un problema diverso, e la differenza non è di dettaglio: <b>non esiste nessun N da fissare</b>. Le pareti della cavità assorbono ed emettono fotoni in continuazione, e a temperatura fissata il numero di fotoni che ci sono in equilibrio non lo sceglie nessuno — lo decide la temperatura stessa. Lo stesso per i fononi: un cristallo scambia quanti di vibrazione con l'ambiente senza che nulla ne conservi il numero totale. In entrambi i casi il quanto — il fotone, il fonone — non è una particella nel senso ordinario: è un'eccitazione di un campo di oscillatori armonici, e un oscillatore armonico può essere eccitato a qualunque livello senza che questo richieda di <i>creare</i> o <i>distruggere</i> niente di conservato.</p>
  <p>Questa singola differenza — nessun vincolo su N — è tutto ciò che separa questo movimento dal gas di Bose ordinario, ed è sufficiente a produrre due dei risultati più importanti della fisica del Novecento: la formula di Planck, che ha aperto la meccanica quantistica, e la legge T³ del calore specifico dei solidi a bassa temperatura.</p>`},
  {t:'reveal', title:'La condizione che decide tutto: perché μ è nullo', tag:'costruzione', steps:[
   {label:'Il numero di quanti non è un dato, è una conseguenza', body:R`
   <p>Si parta dal caso generale. Un gas di bosoni non interagenti a temperatura T e volume V ha energia libera di Helmholtz F(T,V,N), funzione anche del numero di particelle. Se N è vincolato dall'esterno — è il caso del gas di Bose ordinario — l'equilibrio si trova a N fissato, e μ è quel che serve a tenerlo fisso: è un moltiplicatore di Lagrange, non un minimo libero.</p>
   <p>Qui la situazione è diversa. Il numero di fotoni <b>non è vincolato da nulla</b>: le pareti della cavità possono assorbirne ed emetterne quanti ne vogliono, l'unico vincolo è che il sistema stia in equilibrio a T e V fissati. In questa situazione N stesso diventa una variabile libera che il sistema aggiusta per minimizzare l'energia libera, esattamente come farebbe con qualunque altro grado di libertà interno non vincolato. La condizione di equilibrio è dunque</p>
   $$\mu\equiv\left(\frac{\partial F}{\partial N}\right)_{T,V}=0$$
   <p>e questa non è un'identità algebrica da dimostrare: è un <b>principio di minimo</b>, la stessa logica con cui si trova l'equilibrio chimico di una reazione che può procedere liberamente in un verso o nell'altro. Crisanti lo scrive in una riga (pag. 303-304): «$\mu=\partial F/\partial N|_{T,V}=0$ è la condizione di minimo. Quindi per un gas di fotoni: $\mu=0\to z=1$», dove $z=e^{\mu/T}$ è la fugacità.</p>
   <p>Vale la pena notare perché questo argomento <b>non si applica</b> a un gas di Bose ordinario, per esempio un gas di atomi di elio-4 in una trappola. Lì il numero di atomi è dato dalle condizioni sperimentali — quanti atomi si sono caricati nella trappola — e minimizzare F rispetto a N darebbe una risposta priva di senso fisico: il numero di atomi non è una variabile che il sistema è libero di scegliere. La differenza fra i due casi non è nella statistica, che è la stessa identica statistica di Bose-Einstein: è in <b>che cosa è dato dall'esterno e che cosa no</b>.</p>`},
   {label:'La distribuzione con il chimico spento, dedotta e non citata', body:R`
   <p>Il numero medio di occupazione non è un dato da ricordare: esce da un unico conto, ed è lo stesso conto — con lo stesso strumento — che produrrà fra due tappe la formula di Planck. Un singolo livello di energia $\varepsilon$, occupabile da $n=0,1,2,\dots$ quanti senza nessun limite, ha funzione di partizione a fugacità $z$ generica</p>
   $$Z_1=\sum_{n=0}^\infty\left(ze^{-\varepsilon/T}\right)^n$$
   <p>che è una <span class="str" data-str="serie-geometrica">serie geometrica</span> di ragione $ze^{-\varepsilon/T}$, e converge esattamente quando quella ragione è minore di uno — la condizione $\mu\le0$ che regge da sempre la statistica di Bose. Sommandola,</p>
   $$Z_1=\frac{1}{1-ze^{-\varepsilon/T}}$$
   <p>Il numero medio di occupazione si ottiene dalla derivata logaritmica rispetto alla fugacità, $\bar n=z\,\partial_z\log Z_1$ — il modo standard di estrarre un valore medio da una funzione generatrice —, che dà</p>
   $$\bar n(z)=\frac{1}{e^{\varepsilon/T}/z-1}$$
   <p>Ponendo ora $z=1$, cioè $\mu=0$ — e solo in virtù del principio di minimo appena stabilito — si ottiene la distribuzione che serve per l'intero movimento:</p>
   $$n(\varepsilon)=\frac{1}{e^{\varepsilon/T}-1}$$
   <p><b>Non c'è mai bisogno di risolvere un'equazione per la fugacità</b>, come invece serviva nel gas di Bose con N fissato: z vale sempre uno, μ vale sempre zero, e l'unica variabile libera è la temperatura. È la semplificazione che rende questi due sistemi — luce in una scatola, vibrazioni in un cristallo — fra i pochi problemi di meccanica statistica quantistica risolubili fino in fondo con l'algebra elementare, a partire da una singola somma geometrica.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Un gas di atomi bosonici e un gas di fotoni sono entrambi descritti dalla stessa distribuzione di Bose-Einstein. Perché allora nell'uno il potenziale chimico è in generale negativo e diverso da zero, e nell'altro è sempre nullo?`,
    a:R`Perché la distribuzione di Bose-Einstein descrive la statistica di occupazione dei livelli, ma non dice da sola quanto valga μ: quel valore lo fissa un <b>vincolo esterno separato</b>. Per un gas di atomi il vincolo è "il numero totale di particelle è N", e μ si trova risolvendo quell'equazione — è in generale negativo perché il livello fondamentale non può contenere più di un numero finito di atomi senza condensare. Per fotoni e fononi non c'è nessun vincolo di questo tipo: il numero di quanti non è un dato del problema ma una conseguenza della temperatura, e la condizione che sostituisce il vincolo sul numero è il <b>principio di minimo dell'energia libera</b>, che dà direttamente μ=0. La distribuzione è la stessa formula; cambia soltanto quale equazione decide il valore di μ dentro di essa.`},
   {q:R`Se μ=0 sempre, che senso ha ancora parlare di "temperatura critica" o di condensazione per un gas di fotoni?`,
    a:R`Nessuno, ed è la differenza più importante da tenere a mente. La condensazione di Bose-Einstein nasce dal fatto che μ deve restare sotto il fondo dello spettro e, a un vincolo di N fissato, esiste una temperatura sotto la quale μ non riesce più a salire abbastanza per accogliere tutte le particelle negli stati eccitati — da qui l'accumulo nel fondamentale. Con μ bloccato a zero per costruzione, quel meccanismo semplicemente non esiste: non c'è nessuna soglia da attraversare, perché non c'è nessun numero di particelle da far stare da qualche parte. È per questo che un gas di fotoni a bassa temperatura non "condensa": diminuisce semplicemente il numero di fotoni, che possono sempre sparire dentro le pareti della cavità.`}
  ]}
]},

/* ---------------- 01 · IL CONTEGGIO DEI MODI ---------------- */
{ num:'01', title:'Il conteggio dei modi in una cavità', meta:'la quantizzazione del campo come somma di oscillatori · lo spazio dei modi discreto che diventa continuo · le due polarizzazioni',
  blocchi:[
  {t:'reveal', title:'Il campo elettromagnetico come infiniti oscillatori armonici', tag:'costruzione', steps:[
   {label:'La cavità, la gauge, e i modi normali', body:R`
   <p>Si consideri una cavità cubica di lato L e volume $V=L^3$, priva di sorgenti, all'equilibrio termico. Nella gauge di Coulomb ($\nabla\cdot\vec A=0$, potenziale scalare nullo nel vuoto) il potenziale vettore soddisfa l'equazione delle onde $\nabla^2\vec A-c^{-2}\partial_t^2\vec A=0$, e con condizioni al contorno periodiche si sviluppa in onde piane</p>
   $$\vec A(\vec x,t)=\frac{1}{\sqrt V}\sum_{\vec k}\vec A_{\vec k}(t)\,e^{i\vec k\cdot\vec x},\qquad \vec k=\frac{2\pi}{L}\vec n,\quad \vec n\in\mathbb Z^3$$
   <p>Ogni componente $\vec A_{\vec k}(t)$ oscilla come $e^{-i\omega_k t}$ con $\omega_k=c|\vec k|$, cioè con la relazione di dispersione <b>lineare</b> tipica di un'onda che si propaga senza massa. La condizione di gauge $\vec k\cdot\vec A_{\vec k}=0$ dice che $\vec A_{\vec k}$ è ortogonale a $\vec k$: ha cioè solo due componenti indipendenti, le due <b>polarizzazioni trasverse</b> dell'onda elettromagnetica. Non ce n'è una terza, perché la direzione longitudinale è esclusa dalla gauge stessa — è il fatto fisico dietro il fattore due che comparirà fra un momento.</p>
   <p>Riscrivendo $\vec E$ e $\vec B$ in termini di variabili canoniche $q_{\vec k,\alpha}$ e $p_{\vec k,\alpha}$ (una coppia per ciascuno dei due stati di polarizzazione $\alpha=1,2$), l'hamiltoniana del campo, $H=\tfrac1{8\pi}\int_V d^3x\,(E^2+B^2)$, si riduce dopo un cambio di variabili a</p>
   $$H=\frac12\sum_{\vec k,\alpha}\left[p_{\vec k,\alpha}^2+\omega_k^2q_{\vec k,\alpha}^2\right]$$
   <p>cioè esattamente la somma di infiniti oscillatori armonici indipendenti, uno per ciascun modo $(\vec k,\alpha)$. Non c'è nessuna interazione fra i modi: il campo elettromagnetico libero <i>è</i>, dal punto di vista dinamico, un insieme di oscillatori disaccoppiati. Quantizzando ciascun oscillatore nel modo consueto,</p>
   $$H=\sum_{\vec k,\alpha}\left(n_{\vec k,\alpha}+\frac12\right)\hbar\omega_k$$
   <p>e il quanto $\hbar\omega_k$ di eccitazione di un singolo modo è, per definizione, <b>un fotone</b> di impulso $\vec p=\hbar\vec k$ ed energia $\varepsilon_k=\hbar\omega_k$. L'energia di punto zero $\tfrac12\hbar\omega_k$ non contribuisce a nessuna quantità termodinamica che dipenda da differenze di energia, e si può ignorare da qui in avanti.</p>`},
   {label:'Dal reticolo discreto di k alla densità continua dei modi', body:R`
   <p>Per una cavità macroscopica lo spaziamento fra $\vec k$ consecutivi, $2\pi/L$, è minuscolo rispetto a qualunque scala fisica rilevante, e la somma sui modi si sostituisce con un integrale: il numero di terne $\vec n$ in un volumetto $d^3k$ dello spazio dei $k$ è $\left(\tfrac{L}{2\pi}\right)^3d^3k=\tfrac{V}{(2\pi)^3}d^3k$. In coordinate sferiche, con $d^3k=4\pi k^2\,dk$, e moltiplicando per <b>due</b> per le polarizzazioni:</p>
   $$G(\omega)\,d\omega=\frac{V}{(2\pi)^3}\cdot4\pi k^2\,dk\cdot2$$
   <p>Con la dispersione lineare $\omega=ck$, cioè $k=\omega/c$ e $dk=d\omega/c$, si ottiene la <b>densità di modi</b> del campo elettromagnetico in funzione della frequenza:</p>
   $$G(\omega)=\frac{V}{\pi^2c^3}\,\omega^2$$
   <p>Questo oggetto ha un'interpretazione diretta e va tenuta a mente per tutto il seguito: $G(\omega)\,d\omega$ è il numero di modi normali della cavità con frequenza fra $\omega$ e $\omega+d\omega$, e cresce come $\omega^2$ perché il volume di una corona sferica nello spazio dei $k$ cresce come $k^2$. Non c'è nessun limite superiore alla frequenza — a differenza di quanto succederà per i fononi, dove il reticolo cristallino impone un taglio naturale.</p>`}
  ]},
  {t:'plot', title:'La densità di modi del campo elettromagnetico',
   intro:R`La densità di modi $G(\omega)=V\omega^2/(\pi^2c^3)$ per una cavità di volume unitario, in unità in cui $c=1$. Cresce senza limite: ogni frequenza, per quanto alta, ha i suoi modi.`,
   plots:[
    {kind:'func2d', xr:[0,4], yr:[0,17], height:320, ticks:6,
     title:'G(ω) ∝ ω², nessun taglio',
     curves:[{f:'x*x/(PI*PI)', col:'#4c8dff', width:2.6, label:'G(ω), fotoni'}],
     xlabel:'frequenza ω (unità c=V=1)', ylabel:'densità di modi G(ω)'}
   ],
   leggi:R`<p><b>Che cosa guardare: non c'è un tetto.</b> La curva cresce come $\omega^2$ per sempre. Questo è ciò che, integrato con l'occupazione di Bose che decresce esponenzialmente alle alte frequenze, produrrà uno spettro con un massimo finito: il prodotto di una funzione che cresce e una che precipita.</p>
   <p><b>Che cosa impararne per i conti.</b> L'esponente due viene da due fattori indipendenti: uno spazio tridimensionale (da cui il $k^2$ della corona sferica) e una dispersione lineare $\omega\propto k$ (che non altera l'esponente, a differenza di una dispersione quadratica come quella non relativistica). Cambiare la dimensionalità o la dispersione cambia questo esponente, ed è esattamente il meccanismo — nella tappa 07 — con cui i fononi in tre dimensioni ereditano la stessa forma $\omega^2$.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Perché il campo elettromagnetico ha due polarizzazioni e non tre, se lo spazio è tridimensionale?`,
    a:R`Perché il criterio invocato non è la dimensione dello spazio ma il <b>vincolo di trasversalità</b> imposto dalla gauge di Coulomb, $\vec k\cdot\vec A_{\vec k}=0$: fra le tre direzioni possibili per $\vec A_{\vec k}$, quella parallela a $\vec k$ è esclusa dalla condizione stessa. Fisicamente, un'onda elettromagnetica libera non ha mai una componente del campo lungo la direzione di propagazione — è la stessa affermazione, scritta nel linguaggio dei potenziali invece che dei campi. Il modo longitudinale esiste formalmente nell'elettrodinamica con sorgenti (è legato al campo coulombiano statico) ma non è un grado di libertà radiativo indipendente, e nella cavità priva di cariche libere non compare.`},
   {q:R`Se al posto della radiazione elettromagnetica si trattasse un campo scalare privo di polarizzazione, che cosa cambierebbe nella densità di modi?`,
    a:R`Sparirebbe il fattore due. Il conteggio dei modi nello spazio dei $\vec k$ — $\tfrac{V}{(2\pi)^3}4\pi k^2dk$ — non dipende dalla natura del campo: è puramente geometrico, il volume di una corona sferica nello spazio dei numeri d'onda permessi dalle condizioni al contorno. Il fattore che moltiplica quel conteggio dipende invece dal numero di stati di polarizzazione (o, più in generale, dal numero di componenti indipendenti del campo per ciascun $\vec k$): due per un campo vettoriale trasverso come quello elettromagnetico, uno per un campo scalare, tre — come si vedrà nella tappa 07 — per le vibrazioni di un reticolo, dove il vincolo di trasversalità non c'è e sopravvive anche il modo longitudinale.`}
  ]}
]},

/* ---------------- 02 · LA FORMULA DI PLANCK ---------------- */
{ num:'02', title:'La formula di Planck e la fine della catastrofe ultravioletta', meta:'energia per modo con occupazione di Bose · il limite classico che diverge · il quanto che salva la fisica',
  blocchi:[
  {t:'reveal', title:'Dalla densità di modi allo spettro di energia', tag:'costruzione', steps:[
   {label:'Un modo, un oscillatore, un’occupazione', body:R`
   <p>Ogni modo di frequenza $\omega$ è, come si è visto, un oscillatore armonico quantizzato, e il suo livello di eccitazione $n_{\vec k,\alpha}$ è occupato secondo la statistica di Bose-Einstein con $\mu=0$ stabilita nella tappa 00: $n(\omega)=1/(e^{\hbar\omega/T}-1)$. L'energia media contenuta nei modi con frequenza fra $\omega$ e $\omega+d\omega$ si ottiene moltiplicando tre fattori — il numero di modi $G(\omega)\,d\omega$, l'energia di un quanto $\hbar\omega$, e il numero medio di quanti per modo $n(\omega)$:</p>
   $$dE(\omega)=\hbar\omega\,G(\omega)\,n(\omega)\,d\omega$$
   <p>Il primo pezzo, il prodotto $\hbar\omega\,G(\omega)$, è pura algebra a partire da quanto già stabilito:</p>
   $$\hbar\omega\,G(\omega)=\frac{V\hbar}{\pi^2c^3}\,\omega^3$$
   <p>e mettendo dentro l'occupazione di Bose si ottiene la <b>formula di Planck</b>, dedotta qui per integrazione diretta e non per la via storica — Planck la trovò per interpolazione fra due limiti noti, come si vedrà fra poco, prima ancora di avere il conteggio dei modi che oggi la produce in un solo passo:</p>
   $$\frac{dE}{d\omega}=\frac{V\hbar}{\pi^2c^3}\,\frac{\omega^3}{e^{\hbar\omega/T}-1}$$
   <p>Questa è la funzione che descrive per intero lo spettro della radiazione di corpo nero: dice quanta energia, per unità di frequenza, è contenuta nella cavità a ogni temperatura. Tutto il resto del movimento — Stefan-Boltzmann, Wien, la pressione di radiazione — è integrale o proprietà di questa singola espressione.</p>`},
   {label:'Il limite classico, e perché esplode', body:R`
   <p>Si consideri il comportamento alle basse frequenze, $\hbar\omega\ll T$. Linearizzando l'esponenziale, il limite che regge il passaggio è</p>
   $$\lim_{\hbar\omega\to0^+}\frac{\hbar\omega}{e^{\hbar\omega/T}-1}=T$$
   <p>cioè ogni modo, indipendentemente dalla sua frequenza, riceve in media l'energia $T$ — <b>esattamente il risultato dell'equipartizione classica</b>, un grado di libertà quadratico da $T/2$ per l'energia elettrica e uno da $T/2$ per quella magnetica. Sostituendo, lo spettro alle basse frequenze diventa</p>
   $$\frac{dE}{d\omega}\bigg|_{\rm RJ}=\frac{VT}{\pi^2c^3}\,\omega^2$$
   <p>la <b>formula di Rayleigh-Jeans</b>, che non contiene $\hbar$ e infatti si ottiene per via puramente classica assegnando l'energia $T$ a ciascuno degli infiniti modi della cavità. Ed è qui che la fisica classica del 1900 si rompe: integrando $\omega^2$ su tutte le frequenze fino a infinito, l'energia totale contenuta nella cavità <b>diverge</b>. Una cavità a temperatura ambiente, secondo la fisica classica, dovrebbe contenere energia infinita concentrata alle alte frequenze — la <b>catastrofe ultravioletta</b>, il nome con cui la crisi divenne nota, e il problema che la teoria dei quanti fu introdotta per risolvere.</p>`},
   {label:'Il limite dei quanti, e perché salva tutto', body:R`
   <p>Alle alte frequenze, $\hbar\omega\gg T$, il termine $-1$ al denominatore diventa trascurabile rispetto all'esponenziale — il criterio invocato è che</p>
   $$\lim_{x\to\infty}\frac{e^{x}}{e^{x}-1}=1,\qquad x=\frac{\hbar\omega}{T}$$
   <p>cioè $1/(e^x-1)\simeq e^{-x}$ per $x$ grande, e lo spettro si riduce alla <b>legge di Wien</b>,</p>
   $$\frac{dE}{d\omega}\bigg|_{\rm W}\simeq\frac{V\hbar}{\pi^2c^3}\,\omega^3\,e^{-\hbar\omega/T}$$
   <p>Il fattore esponenziale <b>uccide</b> le alte frequenze molto più in fretta di quanto $\omega^3$ le faccia crescere, e l'integrale su tutte le frequenze converge. Il quanto $\hbar$ non compare come una correzione piccola: è precisamente il parametro che, comparendo nell'esponente, spegne la catastrofe. Planck non derivò questa formula dal conteggio dei modi — che è la via seguita qui — ma trovò per interpolazione un'unica espressione che si riducesse a Rayleigh-Jeans per $\hbar\omega\ll T$ e a Wien per $\hbar\omega\gg T$, e quell'interpolazione è esattamente la formula scritta sopra. È il 1900, ed è la prima comparsa di $\hbar$ nella fisica: non come artificio di calcolo ma come la sola costante capace di rendere finita una quantità che la fisica classica prevedeva infinita.</p>`}
  ]},
  {t:'plot', title:'Lo spettro di Planck a tre temperature, con i due limiti asintotici',
   intro:R`La densità spettrale $dE/d\omega$ a tre temperature (in unità con $\hbar=c=V=1$), con le asintotiche di Rayleigh-Jeans (retta tangente all'origine, proporzionale a $\omega^2$) e di Wien (decadimento esponenziale) tratteggiate per la temperatura intermedia.`,
   plots:[
    {kind:'func2d', xr:[0,12], yr:[0,2.4], height:340, ticks:6,
     title:'tre temperature, un solo massimo che si sposta',
     curves:[
      {f:'0.6*pow(x,3)/(exp(0.6*x)-1)', col:'#ff6b6b', label:'T = 0,6'},
      {f:'pow(x,3)/(exp(x)-1)', col:'#4c8dff', width:2.6, label:'T = 1'},
      {f:'1.6*pow(x,3)/(exp(1.6*x)-1)', col:'#5eead4', label:'T = 1,6'},
      {f:'x*x', col:'#d8a13a', dash:true, label:'Rayleigh-Jeans (T=1)'},
      {f:'pow(x,3)*exp(-x)', col:'#b98cff', dash:true, label:'Wien (T=1)'}
     ],
     xlabel:'frequenza ω', ylabel:'dE/dω'}
   ],
   leggi:R`<p><b>Che cosa guardare: dove le tratteggiate abbracciano la curva piena.</b> La parabola dorata di Rayleigh-Jeans coincide con la curva blu solo vicino all'origine, e se ne allontana subito: è l'approssimazione che, estesa a tutte le frequenze, produce la divergenza. La curva viola di Wien fa l'opposto — coincide bene per $\omega$ grande e sbaglia vicino a zero, dove sovrastima meno di quanto in realtà l'energia cresca linearmente con $T$.</p>
   <p><b>Che cosa guardare: il massimo che si sposta a destra scaldando.</b> Alle tre temperature il picco dello spettro si sposta a frequenze più alte — è la legge di Wien, oggetto della tappa 04, e la ragione per cui un corpo caldo cambia colore prima di cambiare di molto la sua luminosità totale.</p>
   <p><b>Che cosa impararne per i conti.</b> Nessuna delle due tratteggiate, da sola, è la risposta corretta ovunque: la formula di Planck è precisamente l'unica funzione che si riduce a entrambe nei rispettivi limiti. Un errore da matricola è usare Rayleigh-Jeans per stimare l'energia totale — l'integrale di quella parabola su tutte le frequenze non esiste.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`La catastrofe ultravioletta dice che l'energia totale di un campo classico in una cavità è infinita. Ma l'energia di un singolo modo, $T$, è perfettamente finita. Dov'è allora l'infinito?`,
    a:R`Nel <b>numero</b> di modi, non nell'energia di ciascuno. Il criterio è che l'energia totale è l'integrale $\int_0^\infty G(\omega)\,T\,d\omega=\tfrac{VT}{\pi^2c^3}\int_0^\infty\omega^2\,d\omega$, e sebbene ogni singolo addendo sia finito, la <b>somma su infiniti modi, ciascuno con la stessa energia $T$, diverge</b> perché la densità di modi $G(\omega)\propto\omega^2$ non decresce mai. È un meccanismo diverso da quello dell'ultravioletto in altri contesti (dove diverge un singolo termine): qui ogni termine è innocuo, ed è la coda infinita di termini via via meno rari — anzi ugualmente probabili nell'immagine classica — a rompere l'integrale.`},
   {q:R`Perché il quanto $\hbar$ risolve il problema riducendo l'occupazione alle alte frequenze, invece di semplicemente tagliare la densità di modi $G(\omega)$ a una frequenza massima?`,
    a:R`Perché sono due strategie fisicamente diverse, e solo una è quella osservata in natura. Tagliare $G(\omega)$ significherebbe dire che sopra una certa frequenza <b>non esistono modi</b> — è esattamente ciò che succede ai fononi in un reticolo, dove il taglio è geometrico (tappa 07) e non ha nulla a che vedere con la statistica. Per la radiazione elettromagnetica nel vuoto, invece, i modi ad alta frequenza <b>esistono</b> tutti — non c'è nessuna struttura discreta dello spazio che li tagli — mentre è la loro <b>occupazione media</b> a crollare esponenzialmente. Il criterio che li distingue è dove si mette lo zero: un taglio agisce su $G(\omega)$, la quantizzazione dell'energia agisce su $n(\omega)$. Il corpo nero usa il secondo meccanismo, Debye userà entrambi insieme.`}
  ]}
]},

/* ---------------- 03 · LA LEGGE DI STEFAN-BOLTZMANN ---------------- */
{ num:'03', title:'La legge di Stefan-Boltzmann, dedotta e non citata', meta:'l’integrale di Planck su tutte le frequenze · il fattore geometrico dell’effusione · due fonti, la stessa costante',
  blocchi:[
  {t:'reveal', title:'L’energia totale, integrando lo spettro intero', tag:'costruzione', steps:[
   {label:'Un solo integrale, e la zeta di Riemann che lo chiude', body:R`
   <p>L'energia totale della radiazione in cavità si ottiene integrando la formula di Planck su tutte le frequenze:</p>
   $$E=\int_0^\infty\frac{V\hbar}{\pi^2c^3}\,\frac{\omega^3}{e^{\hbar\omega/T}-1}\,d\omega$$
   <p>Con la sostituzione $y=\hbar\omega/T$ (la stessa mossa usata ovunque in questo movimento per adimensionalizzare) l'integrale diventa $\left(T/\hbar\right)^4\int_0^\infty y^3/(e^y-1)\,dy$, e quest'ultimo è un integrale standard che vale $\Gamma(4)\zeta(4)$ — <span class="str" data-str="funzione-gamma">la funzione Gamma</span> e <span class="str" data-str="funzione-zeta-di-riemann">la zeta di Riemann</span> comparendo insieme, come già nel gas di Bose. Numericamente,</p>
   $$\Gamma(4)\zeta(4)\simeq6{,}4939$$
   <p>ma vale la pena la forma chiusa, perché è quella che produce risultati puliti: $\Gamma(4)=3!=6$ e $\zeta(4)=\pi^4/90$, dunque</p>
   $$\Gamma(4)\zeta(4)=\frac{\pi^4}{15}$$
   <p>Rimettendo insieme i pezzi si ottiene la densità di energia della radiazione di corpo nero:</p>
   $$E=\frac{V\pi^2T^4}{15(c\hbar)^3}$$
   <p>la celebre dipendenza dalla <b>quarta potenza della temperatura</b>. Non è un risultato che si può indovinare dalla sola analisi dimensionale — quella dà solo che $E/V$ ha le dimensioni di $T^4/(c\hbar)^3$ — ma il coefficiente numerico, $\pi^2/15$, è la parte che l'integrale di Planck fissa e che nessun argomento di scala potrebbe fornire da solo.</p>`},
   {label:'Dall’energia dentro la scatola all’intensità che ne esce', body:R`
   <p>Ciò che si misura in laboratorio non è l'energia dentro una cavità chiusa, ma l'intensità che esce da un piccolo foro praticato nella parete — è così che si realizza sperimentalmente un corpo nero. Il legame fra le due quantità è puramente geometrico: l'energia che attraversa un'apertura di area unitaria nell'unità di tempo, in una direzione che forma un angolo $\theta$ con la normale, è proporzionale a $\cos\theta$ (la proiezione del fascio), e va integrata su tutto l'angolo solido della semisfera uscente. Il criterio invocato è l'integrale</p>
   $$\int_0^{\pi/2}\sin\theta\cos\theta\,d\theta=\frac12$$
   <p>che, moltiplicato per l'angolo azimutale $2\pi$ e diviso per il fattore $4\pi$ dell'angolo solido totale, dà il celebre <b>fattore un quarto</b>: l'intensità emessa da un foro è $I=\tfrac{c}{4}\tfrac{E}{V}$. Sostituendo la densità di energia appena trovata,</p>
   $$\sigma=\frac{c}{4}\cdot\frac{\pi^2}{15(c\hbar)^3}=\frac{\pi^2}{60\hbar^3c^2}$$
   <p>e $I=\sigma T^4$ è la <b>legge di Stefan-Boltzmann</b> nella sua forma sperimentale: l'intensità totale irraggiata da un corpo nero cresce come la quarta potenza della sua temperatura assoluta. Questo stesso fattore geometrico $c/4$ — nient'altro che la media di $\cos\theta$ pesata sull'emisfero — è quello con cui, in astrofisica, si converte la densità di energia interna di una stella nella luminosità che se ne osserva.</p>`},
   {label:'Un secondo cammino verso la stessa costante', body:R`
   <p>Falcioni-Vulpiani (Appendice I, pag. 123-124) percorrono una strada del tutto indipendente, che vale la pena mettere accanto a quella appena fatta perché non usa la statistica quantistica se non nel punto finale. Partendo dai soli due principi della termodinamica e dalla pressione di radiazione $P=e/3$ — nota dall'elettromagnetismo classico, e che sarà dedotta per via statistica nella tappa 05 — impongono che l'entropia $dS=dQ/T$ sia un differenziale esatto, e ne segue un'equazione differenziale per la densità di energia $e(T)$ che si risolve immediatamente in $e=CT^4$: la dipendenza dalla quarta potenza è quindi un fatto <b>puramente termodinamico</b>, che non richiede sapere nulla dei fotoni. Ciò che la termodinamica non può fare è fissare il valore della costante $C$, e Falcioni-Vulpiani lo dichiarano esplicitamente: la costante «può essere calcolata solo usando la statistica di Bose-Einstein»,</p>
   $$C=\frac{8\pi^5k_B^4}{15h^3c^3}$$
   <p>scritta con $k_B$ esplicito e con $h=2\pi\hbar$, in contrasto con la convenzione $k_B=1$ usata fin qui. Vale la pena il confronto diretto, perché le due fonti non useranno mai la stessa notazione ma devono dare lo stesso numero: sostituendo $h=2\pi\hbar$,</p>
   $$\frac{8\pi^5k_B^4}{15h^3c^3}=\frac{\pi^2k_B^4}{15\hbar^3c^3}$$
   <p>che è esattamente il coefficiente di $T^4$ nella densità di energia dedotta due passi sopra, una volta restituito il $k_B$ che la convenzione di Crisanti aveva posto uguale a uno. <b>Le due fonti, per due strade completamente diverse — l'una un conto di teoria dei campi, l'altra due principi della termodinamica più un'equazione di stato presa in prestito dall'elettromagnetismo — arrivano allo stesso numero</b>, ed è il tipo di coincidenza che in fisica non è mai un caso.</p>`}
  ]},
  {t:'plot', title:'La superficie dello spettro: intensità in funzione di frequenza e temperatura',
   intro:R`La densità spettrale di Planck $dE/d\omega$ come superficie nel piano (frequenza, temperatura), in unità con $\hbar=c=V=1$. Ogni sezione a $T$ fissato è una delle curve già viste nella tappa 02; ogni sezione a $\omega$ fissato mostra come cresce, a frequenza data, l'occupazione con la temperatura.`,
   plots:[
    {kind:'surface3d', f:'pow(x,3)/(exp(x/y)-1)', xr:[0.15,10], yr:[0.3,3], n:38, height:420,
     title:'lo spettro di Planck come superficie',
     xlabel:'frequenza ω', ylabel:'temperatura T'}
   ],
   leggi:R`<p><b>Che cosa guardare: la cresta che si allontana dall’origine.</b> Seguendo la superficie a temperatura crescente, il massimo dello spettro (la cresta della collina) si sposta verso frequenze più alte e cresce in altezza: è insieme la legge di Wien (tappa 04, lo spostamento) e la legge di Stefan (tappa 03, l'area sotto ciascuna sezione che cresce come $T^4$).</p>
   <p><b>Che cosa guardare: il fianco ripido verso le basse frequenze a bassa temperatura.</b> A $T$ piccolo la superficie si alza molto lentamente per $\omega$ piccolo — è la finestra in cui vale ancora Rayleigh-Jeans — per poi crollare bruscamente: è la sezione che, nella tappa 02, mostrava il taglio esponenziale di Wien.</p>
   <p><b>Che cosa impararne per i conti.</b> L'intera fisica del corpo nero è contenuta in questa unica superficie a due variabili: non ci sono altri parametri liberi oltre a $\omega$ e $T$ una volta fissate le costanti universali. Ogni formula del movimento — Wien, Stefan, la pressione — è un'operazione geometrica su questa superficie: un massimo lungo $\omega$, un integrale lungo $\omega$, oppure una derivata rispetto a $V$ del suo integrale.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`La densità di energia $E/V$ e l'intensità emessa $I$ sono entrambe proporzionali a $T^4$, ma con costanti diverse, $\pi^2/(15(c\hbar)^3)$ contro $\pi^2/(60\hbar^3c^2)$. Da dove viene esattamente il fattore $1/4$ che le separa, e perché non è $1/(4\pi)$?`,
    a:R`Viene da due integrazioni concatenate, ed è un errore comune fermarsi alla prima. Il criterio è che l'irradianza è mediata sull'angolo solido con il peso $\cos\theta$ — non uniformemente — perché solo la componente del fascio perpendicolare al foro contribuisce al flusso uscente: $\int_0^{2\pi}d\varphi\int_0^{\pi/2}\sin\theta\cos\theta\,d\theta=2\pi\cdot\tfrac12=\pi$. Dividendo per l'angolo solido totale $4\pi$ del fattore di normalizzazione $c/(4\pi)$ con cui si scrive la formula di partenza, resta $c\pi/(4\pi)=c/4$: il $\pi$ dell'integrazione angolare cancella esattamente il $\pi$ della normalizzazione, lasciando il quarto pulito. Se l'emissione fosse isotropa in tutte le direzioni (senza il peso $\cos\theta$) il fattore sarebbe $c/(4\pi)\cdot4\pi/2$... cioè cambierebbe, ed è per questo che il peso angolare non è un dettaglio: è la fisica dell'effusione attraverso un'apertura piana.`},
   {q:R`Le due derivazioni della legge di Stefan-Boltzmann — quella coi fotoni e quella termodinamica di Falcioni-Vulpiani — usano ipotesi completamente diverse. Che cosa NON dimostra, allora, il fatto che diano lo stesso numero?`,
    a:R`Non dimostra che la quantizzazione del campo elettromagnetico sia superflua. Il criterio da tenere a mente è che le due derivazioni provano cose <b>diverse</b>: quella termodinamica mostra che $E/V\propto T^4$ è <b>l'unica forma compatibile</b> coi due principi più l'equazione di stato $P=e/3$ — fissa la potenza della temperatura, non il coefficiente. Quella statistica è l'<b>unica via</b> che fissa il valore numerico di $C$, ed è per questo che Falcioni-Vulpiani scrivono che quella costante «può essere calcolata solo usando la statistica di Bose-Einstein»: la termodinamica classica, da sola, lascerebbe $C$ come un parametro libero da misurare, non da derivare. L'accordo fra le due strade è quindi una conferma della <b>consistenza interna</b> della teoria — il conto quantistico rispetta il vincolo che la termodinamica impone — non una prova che la parte quantistica sia ridondante.`}
  ]}
]},

/* ---------------- 04 · LO SPOSTAMENTO DI WIEN ---------------- */
{ num:'04', title:'Lo spostamento di Wien: due massimi che non coincidono', meta:'il massimo in frequenza · il massimo in lunghezza d’onda · lo jacobiano che li separa',
  blocchi:[
  {t:'reveal', title:'Dove si trova il picco dello spettro', tag:'costruzione', steps:[
   {label:'Il massimo in frequenza, e l’equazione che non si risolve con l’algebra', body:R`
   <p>La forma spettrale di Planck, a parte i prefattori costanti, è la funzione $f(x)=x^3/(e^x-1)$ con $x=\hbar\omega/T$. Il suo massimo si trova annullando la derivata:</p>
   $$\frac{d}{dx}\frac{x^3}{e^x-1}=\frac{x^2\left[3(e^x-1)-xe^x\right]}{(e^x-1)^2}$$
   <p>Poiché $x\ne0$ nel punto di massimo, la condizione è che si annulli la parentesi quadra, e dividendo per $e^x$ si ottiene la forma più leggibile</p>
   $$3(1-e^{-x})-x=0$$
   <p>Questa è un'equazione <b>trascendente</b>: $x$ compare sia dentro l'esponenziale sia fuori, e non esiste nessuna combinazione finita di funzioni elementari che la risolva. Ammette però una soluzione chiusa in termini della funzione W di Lambert — la funzione inversa di $w\mapsto we^w$ — perché ponendo $u=x-3$ l'equazione diventa $ue^u=-3e^{-3}$, la forma canonica che la definisce:</p>
   $$x^\star=3+W(-3e^{-3})\simeq2{,}821439$$
   <p>e si verifica per sostituzione diretta che $3(1-e^{-x^\star})-x^\star=0$. Numericamente $x^\star\simeq2{,}821439$ è la costante universale che governa <b>dove</b>, in unità di $T/\hbar$, si trova il massimo dello spettro in frequenza: $\omega_{\max}=x^\star T/\hbar$, proporzionale alla temperatura. È la legge di Wien nella sua forma più nota — il colore di un corpo caldo si sposta verso il blu scaldandolo — e il motivo per cui una brace diventa bianca prima di diventare azzurra: il massimo continua a salire in frequenza oltre lo spettro visibile.</p>`},
   {label:'Il massimo in lunghezza d’onda, e perché non è lo stesso punto', body:R`
   <p>Qui si annida la trappola concettuale più insidiosa del capitolo. Molti strumenti — un prisma, un reticolo di diffrazione, l'occhio umano — non misurano l'energia per intervallo di frequenza ma per intervallo di <b>lunghezza d'onda</b>, e la tentazione naturale è convertire il massimo appena trovato con la relazione $\lambda=2\pi c/\omega$, aspettandosi lo stesso punto fisico visto con un'altra unità di misura. <b>Non è così</b>, e la ragione è che cambiare variabile in una densità richiede lo jacobiano della trasformazione, non solo la sostituzione dell'argomento.</p>
   <p>Da $dE(\omega)\,d\omega=dE(\lambda)\,d\lambda$ (l'energia contenuta in un intervallo fisico non dipende da come lo si etichetta) e $|d\omega/d\lambda|=2\pi c/\lambda^2$, la densità spettrale in lunghezza d'onda acquisisce un fattore <i>aggiuntivo</i> $1/\lambda^2$ oltre alla sostituzione $\omega\to2\pi c/\lambda$: il risultato è che $u_\lambda(\lambda)$ è proporzionale a $\lambda^{-5}/(e^{a/\lambda}-1)$ con $a=2\pi c\hbar/T$, e non $\lambda^{-3}$ come una sostituzione ingenua suggerirebbe. Massimizzando rispetto a $\lambda$:</p>
   $$\frac{d}{d\lambda}\frac{\lambda^{-5}}{e^{a/\lambda}-1}=\frac{ae^{a/\lambda}+5\lambda(1-e^{a/\lambda})}{\lambda^7(1-e^{a/\lambda})^2}$$
   <p>Annullando il numeratore e dividendo per $\lambda e^{a/\lambda}$ si ottiene una condizione della stessa famiglia di prima ma con l'esponente <b>cinque</b> al posto di tre:</p>
   $$\frac{a}{\lambda}-5\left(1-e^{-a/\lambda}\right)=0$$
   <p>e con $y=a/\lambda$ la soluzione, ancora una volta in termini della W di Lambert, è</p>
   $$y^\star=5+W(-5e^{-5})\simeq4{,}965114$$
   <p>che soddisfa per sostituzione diretta $5(1-e^{-y^\star})-y^\star=0$. Il punto cruciale: <b>$x^\star$ e $y^\star$ sono numeri diversi</b> — $2{,}821439$ contro $4{,}965114$, quasi il doppio — e non c'è ragione per cui debbano coincidere, perché $x^\star$ risolve un'equazione con l'esponente tre e $y^\star$ la stessa equazione con l'esponente cinque: sono due problemi di massimo distinti, non due modi di scrivere lo stesso.</p>`},
   {label:'La conseguenza fisica: due costanti di Wien, non una', body:R`
   <p>Restituendo le costanti dimensionali, la lunghezza d'onda a cui lo spettro <i>in lunghezza d'onda</i> è massimo obbedisce a $\lambda_{\max}T=hc/(k_By^\star)$, e sostituendo i valori numerici delle costanti fisiche si ottiene</p>
   $$b=2{,}8978\times10^{-3}\ \text{m K}$$
   <p>che è la costante di Wien tabulata in ogni prontuario, quella usata per stimare la temperatura superficiale di una stella dal colore della luce che emette. Ma la lunghezza d'onda che <b>corrisponde</b> al massimo dello spettro <i>in frequenza</i> — cioè $\lambda^\prime=2\pi c/\omega_{\max}$, lo stesso punto fisico guardato nell'altra rappresentazione — vale</p>
   $$\lambda^\prime T\simeq5{,}0994\times10^{-3}\ \text{m K}$$
   <p>quasi <b>il 76% in più</b>. Le due costanti differiscono perché descrivono due domande diverse: «a quale lunghezza d'onda lo spettro-in-λ ha il suo picco» e «quale lunghezza d'onda corrisponde al picco dello spettro-in-ω», e la risposta non può essere la stessa perché lo jacobiano $1/\lambda^2$ deforma la forma della curva, spostandone il massimo. <b>Il colore che "sembra" dominante dipende da quale strumento lo misura</b> — un rivelatore a banda di frequenza costante e uno a banda di lunghezza d'onda costante riporterebbero massimi a colori leggermente diversi per la stessa identica sorgente — ed è un fatto che sorprende chi si aspetta un unico "colore del massimo" indipendente dalla rappresentazione.</p>`}
  ]},
  {t:'plot', title:'Due massimi sullo stesso asse: perché non sono lo stesso punto',
   intro:R`Le due forme spettrali adimensionali $x^3/(e^x-1)$ (proporzionale allo spettro in frequenza) e $y^5/(e^y-1)$ (proporzionale allo spettro in lunghezza d'onda, riscritto nella stessa variabile $x=\hbar\omega/T=hc/(\lambda T)$), normalizzate alla stessa altezza di picco per il confronto.`,
   plots:[
    {kind:'func2d', xr:[0,12], yr:[0,1.15], height:340, ticks:6,
     title:'stessa variabile, due massimi diversi',
     curves:[
      {f:'pow(x,3)/(exp(x)-1)/1.4218', col:'#4c8dff', width:2.6, label:'forma in frequenza, x³/(eˣ-1)'},
      {f:'pow(x,5)/(exp(x)-1)/50.286', col:'#ff6b6b', width:2.6, label:'forma in lunghezza d’onda, x⁵/(eˣ-1)'}
     ],
     segs:[
      {x1:2.821439,y1:0,x2:2.821439,y2:1.05,col:'#4c8dff',dash:true,width:1.4,label:'x*=2,8214',lx:2.0,ly:1.1},
      {x1:4.965114,y1:0,x2:4.965114,y2:1.05,col:'#ff6b6b',dash:true,width:1.4,label:'y*=4,9651',lx:5.3,ly:1.1}
     ],
     xlabel:'variabile adimensionale ħω/T = hc/(λT)', ylabel:'forma spettrale (normalizzata)'}
   ],
   leggi:R`<p><b>Che cosa guardare: le due tratteggiate non cadono una sull’altra.</b> Sono la stessa fisica — lo stesso spettro di Planck — guardata con due jacobiani diversi. La curva rossa, che ha un esponente più alto, ha una coda a bassa $x$ soppressa più fortemente e una coda ad alta $x$ più pesante, e il suo massimo è spinto più a destra.</p>
   <p><b>Che cosa guardare: quale delle due userebbe un astronomo.</b> Se uno spettrometro misura energia per intervallo di lunghezza d'onda (è il caso più comune in ottica), la curva da usare è la rossa, e la costante di Wien $b=2{,}8978\ \text{mm K}\cdot10^{-3}$ si legge da quella. Confondere le due — usare la costante di Wien in λ per convertire il massimo di uno spettro dato in frequenza — è l'errore più frequente in questo argomento.</p>
   <p><b>Che cosa impararne per i conti.</b> Ogni volta che si cambia variabile in una densità di probabilità o in una densità spettrale, il jacobiano <b>non è un dettaglio tecnico</b>: può spostare il massimo, cambiare la forma della coda, persino cambiare quale delle due codeè più pesante. La regola generale, di cui questo è solo il caso più famoso: il massimo di $f(\omega)$ e il massimo di $f(\omega(\lambda))\,|d\omega/d\lambda|$ coincidono <i>soltanto</i> se lo jacobiano è costante, il che non è mai il caso in una trasformazione non lineare come $\omega=2\pi c/\lambda$.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Se qualcuno chiede "qual è la lunghezza d'onda della luce più intensa emessa da una stella a temperatura T", qual è il primo passo per rispondere correttamente, prima di scrivere qualunque formula?`,
    a:R`Chiedersi <b>in che cosa</b> è misurata l'intensità — per intervallo di frequenza o per intervallo di lunghezza d'onda — perché la risposta numerica cambia a seconda della domanda, come mostrato in questa tappa. Il modus operandi corretto è: identificare quale grandezza va massimizzata (raramente lo si dice esplicitamente, ma "il colore della luce" nella pratica sperimentale è quasi sempre riferito a uno spettrometro che lavora a intervalli di lunghezza d'onda), scrivere lo spettro in quella variabile <i>includendo lo jacobiano</i>, e solo allora massimizzare. Rispondere con la costante di Wien "generica" senza aver fatto questa distinzione è il modo più comune di sbagliare un esercizio che sembra immediato.`},
   {q:R`L'equazione $3(1-e^{-x})=x$ ha $x=0$ come soluzione ovvia. Perché non è quella la risposta al problema del massimo?`,
    a:R`Perché $x=0$ è un punto in cui si annulla il <b>fattore $x^2$</b> che moltiplica la parentesi quadra nella derivata, non un punto in cui si annulla la parentesi stessa — ed è un minimo (lo spettro vale zero a frequenza nulla), non un massimo. Il criterio corretto è cercare, fra tutti gli zeri della derivata, quello che corrisponde a un vero massimo della funzione: $x=0$ è uno zero spurio introdotto dal fattore comune $x^2$, mentre $x^\star=3+W(-3e^{-3})$ è l'unico zero della parentesi quadra per $x>0$, ed è lì — non altrove — che la funzione $x^3/(e^x-1)$ passa da crescente a decrescente.`}
  ]}
]},

/* ---------------- 05 · LA PRESSIONE DI RADIAZIONE ---------------- */
{ num:'05', title:'La pressione di radiazione: un terzo, non due terzi', meta:'la pressione come derivata dell’energia libera · il confronto con un gas materiale · l’adiabatica del fotone',
  blocchi:[
  {t:'reveal', title:'Quanto spinge la luce contro le pareti', tag:'costruzione', steps:[
   {label:'L’energia libera del gas di fotoni', body:R`
   <p>Con $\mu=0$ l'energia libera di Helmholtz coincide con il grancanonico, $F=\Omega=-T\log Z$, e la funzione di partizione è il prodotto sui modi delle partizioni di ciascun oscillatore, $Z=\prod_{\vec k,\alpha}\left(1-e^{-\hbar\omega_k/T}\right)^{-1}$. Passando al continuo con la densità di modi già trovata,</p>
   $$F=T\int_0^\infty G(\omega)\log\left(1-e^{-\hbar\omega/T}\right)d\omega=\frac{VT^4}{\pi^2(c\hbar)^3}\int_0^\infty y^2\log\left(1-e^{-y}\right)dy$$
   <p>Integrando per parti (i termini di bordo si annullano) l'integrale si riconduce a $-\tfrac13\int_0^\infty y^3/(e^y-1)\,dy=-\tfrac13\Gamma(4)\zeta(4)=-\pi^4/45$, e il risultato — che vale la pena avere pronto perché da qui seguono tutte le grandezze termodinamiche — è</p>
   $$F=-\frac{V\pi^2T^4}{45(c\hbar)^3}$$
   <p>Il segno negativo è quello atteso per l'energia libera di un sistema che guadagna entropia scaldandosi: e infatti derivando rispetto a $T$ si ritrova $S=-\partial F/\partial T=4V\pi^2T^3/\left[45(c\hbar)^3\right]$, e da $E=F+TS$ si ricostruisce esattamente la densità di energia $V\pi^2T^4/[15(c\hbar)^3]$ già trovata nella tappa 03 per la via diretta — un controllo indipendente gratuito, perché le due strade (integrare Planck, oppure derivare $F$) non condividono nessun passaggio intermedio.</p>`},
   {label:'La pressione, e il fattore un terzo', body:R`
   <p>La pressione è per definizione $P=-\left(\partial F/\partial V\right)_T$, e poiché $F$ è <b>lineare</b> in $V$ — tutto il contenuto fisico sta nel coefficiente, non nella dipendenza dal volume — la derivata è immediata:</p>
   $$P=\frac{\pi^2T^4}{45(c\hbar)^3}$$
   <p>Confrontando con la densità di energia $E/V=\pi^2T^4/[15(c\hbar)^3]$ trovata nella tappa 03,</p>
   $$\frac{E}{3V}=\frac{\pi^2T^4}{45(c\hbar)^3}$$
   <p>cioè esattamente lo stesso numero: <b>$PV=E/3$</b>. È il risultato che Falcioni-Vulpiani avevano usato come dato di ingresso dall'elettromagnetismo classico per dedurre Stefan-Boltzmann (tappa 03); qui esce come conseguenza della statistica quantistica, ed è la stessa consistenza incrociata già notata.</p>`},
   {label:'Il confronto con un gas materiale, e da dove viene il terzo invece del due terzi', body:R`
   <p>Un gas ideale monoatomico non relativistico ha $E=\tfrac32NT$ e $PV=NT$, dunque</p>
   $$\frac23\cdot\frac32NT=NT$$
   <p>cioè $PV=\tfrac23E$ — <b>il doppio</b> del fattore trovato per la radiazione. La differenza non è un dettaglio di normalizzazione: viene dalla <b>relazione di dispersione</b>. Un gas materiale non relativistico ha $\varepsilon\propto p^2$ (dispersione quadratica); un gas di fotoni ha $\varepsilon=\hbar\omega=cp$ (dispersione <b>lineare</b>). Per una dispersione a potenza $\varepsilon\propto p^s$ in $d$ dimensioni si può mostrare, con lo stesso tipo di integrazione per parti appena usata, che $PV=\tfrac{s}{d}E$: per $s=2,d=3$ (gas materiale) si ritrova $PV=\tfrac23E$; per $s=1,d=3$ (fotoni, e fononi con lo stesso argomento) si ottiene $PV=\tfrac13E$. <b>Meno la dispersione cresce ripidamente con l'impulso, meno la pressione "pesa" rispetto all'energia</b> — un modo compatto di ricordare il risultato senza rifare il conto per ogni caso.</p>
   <p>Una conseguenza immediata: poiché $S\propto VT^3$ (dalla tappa precedente) è la sola entropia del sistema, in una trasformazione <b>adiabatica reversibile</b> ($S$ costante) si ha $VT^3=\text{cost.}$ — l'analogo, per il gas di fotoni, dell'adiabatica $PV^\gamma=\text{cost.}$ di un gas materiale. È la legge con cui, in cosmologia, si segue il raffreddamento della radiazione di fondo mentre l'universo si espande: il volume cresce, e la temperatura della radiazione scende di conseguenza, senza bisogno di nessun altro ingrediente fisico oltre a questa singola relazione.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Se un gas di fotoni e un gas ultrarelativistico di particelle materiali hanno entrambi $\varepsilon=cp$, ci si aspetta che abbiano la stessa relazione fra pressione ed energia?`,
    a:R`Sì, ed è esattamente la previsione della formula generale $PV=(s/d)E$: il fattore dipende solo dall'esponente della dispersione e dalla dimensionalità, non dal fatto che le particelle siano fotoni, fononi, o un gas ultrarelativistico di elettroni. Un gas ultrarelativistico materiale in tre dimensioni ha $s=1$, $d=3$ esattamente come i fotoni, e infatti soddisfa la stessa $PV=E/3$ — è il motivo per cui questa relazione compare anche in astrofisica per il gas di elettroni degenere e ultrarelativistico nel nucleo di una nana bianca massiccia. La statistica (Bose o Fermi) non entra nel fattore $s/d$: entra invece nel valore numerico di $E$ a parità di $N$ e $T$.`},
   {q:R`Perché la pressione di radiazione non dipende dal volume a temperatura fissata, mentre quella di un gas materiale a $N$ fissato sì?`,
    a:R`Perché il numero di fotoni <b>non è fissato</b>: a $T$ fissata, se si raddoppia $V$ il sistema non "diluisce" un numero dato di quanti, ne genera semplicemente il doppio, mantenendo costante sia $E/V$ sia $P$. Per un gas materiale a $N$ fissato, raddoppiare $V$ a $T$ costante dimezza la pressione ($PV=NT$ con $N$, $T$ costanti implica $P\propto1/V$) perché lo stesso numero di particelle ha più spazio in cui muoversi. Il criterio che separa i due casi è sempre lo stesso di questo intero movimento: cosa è tenuto fisso dall'esterno e cosa no.`}
  ]}
]},

/* ---------------- 06 · I FONONI E IL MODELLO DI EINSTEIN ---------------- */
{ num:'06', title:'I fononi e il modello di Einstein', meta:'vibrazioni reticolari come oscillatori quantizzati · tutti alla stessa frequenza · dove il modello cede',
  blocchi:[
  {t:'prosa', title:'Il secondo gas di quanti: le vibrazioni di un reticolo', tag:'apertura', html:R`
  <p>In un solido cristallino gli atomi non sono fermi: oscillano attorno alle loro posizioni di equilibrio, e per piccole oscillazioni l'energia potenziale è, in prima approssimazione, quadratica negli spostamenti — esattamente come per un oscillatore armonico. Diagonalizzando le equazioni del moto accoppiate di $N$ atomi in tre dimensioni si ottengono $3N$ <b>modi normali</b>, ciascuno un oscillatore armonico indipendente con la propria frequenza $\omega_i$: sono le stesse identiche considerazioni della tappa 01, applicate non al campo elettromagnetico ma agli spostamenti reticolari. Il quanto di eccitazione di un modo normale si chiama <b>fonone</b>, e come i fotoni non è soggetto a nessuna legge di conservazione del numero: a temperatura più alta il cristallo semplicemente ospita più fononi, senza che nulla ne fissi il totale. Vale dunque, con la stessa dimostrazione della tappa 00, $\mu=0$ e $n(\varepsilon)=1/(e^{\varepsilon/T}-1)$.</p>
  <p>La domanda fisica è: come si distribuiscono le $3N$ frequenze $\omega_1,\dots,\omega_{3N}$? La risposta più semplice possibile — e storicamente la prima, dovuta a Einstein nel 1907 — è che siano tutte <b>uguali</b>. Non è nel dossier di questo corso, che rimanda il modello di Einstein alle lezioni orali; è costruito qui come derivazione standard, perché è il termine di paragone necessario per capire perché il modello di Debye, oggetto della prossima tappa, funziona meglio.</p>`},
  {t:'reveal', title:'Un solo oscillatore, ripetuto 3N volte', tag:'costruzione', steps:[
   {label:'L’energia media e il calore specifico', body:R`
   <p>Nell'approssimazione di Einstein tutti i $3N$ modi hanno la stessa frequenza $\omega_E$, e l'energia totale (a parte l'energia di punto zero, che non contribuisce al calore specifico) è semplicemente $3N$ volte l'energia media di un singolo oscillatore:</p>
   $$E(T)=3N\hbar\omega_E\,\bar n(T),\qquad \bar n(T)=\frac{1}{e^{\hbar\omega_E/T}-1}$$
   <p>Il calore specifico si ottiene derivando rispetto a $T$. Il passaggio chiave è la derivata dell'occupazione media:</p>
   $$\frac{d\bar n}{dT}=\frac{\hbar\omega_E\,e^{\hbar\omega_E/T}}{T^2\left(e^{\hbar\omega_E/T}-1\right)^2}$$
   <p>da cui, ponendo $x=\hbar\omega_E/T$,</p>
   $$\frac{C_V}{3N}=\frac{x^2e^x}{(e^x-1)^2}$$
   <p>una funzione universale di un solo parametro adimensionale — la temperatura di Einstein $T_E=\hbar\omega_E$ misurata in unità di $T$ — che vale la pena studiare nei suoi due limiti.</p>`},
   {label:'I due limiti, e dove il modello incontra il suo limite', body:R`
   <p>Ad alta temperatura, $x\to0$:</p>
   $$\lim_{x\to0^+}\frac{3x^2e^x}{(e^x-1)^2}=3$$
   <p>cioè $C_V\to3N$ (in unità con $k_B=1$): è la <b>legge di Dulong-Petit</b>, il risultato classico — ogni atomo contribuisce con $3$ gradi di libertà quadratici, ciascuno da $\tfrac12$ nell'energia cinetica e $\tfrac12$ in quella potenziale, per un totale di $1$ per grado di libertà nel calore specifico secondo l'equipartizione. Il modello di Einstein la riproduce correttamente, ed è la prima conferma che il modello ha senso.</p>
   <p>A bassa temperatura, $x\to\infty$:</p>
   $$\lim_{x\to\infty}\frac{3x^2e^x}{(e^x-1)^2}=0$$
   <p>e la velocità con cui questo limite viene raggiunto è <b>esponenziale</b>: $C_V\sim3Ne^{-\hbar\omega_E/T}$. È qui che il modello di Einstein <b>fallisce quantitativamente</b>: gli esperimenti mostrano che il calore specifico dei solidi a bassa temperatura si annulla come $T^3$, una legge di potenza, non un'esponenziale. La differenza è enorme in pratica — una potenza va a zero molto più lentamente di un esponenziale — e fu il primo indizio che l'ipotesi "tutti i modi alla stessa frequenza" fosse troppo drastica.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Il modello di Einstein prevede correttamente il valore classico alto-T ma sbaglia l'andamento a bassa T. Da dove viene esattamente l'errore: dalla statistica di Bose usata, o da qualcos'altro?`,
    a:R`Non dalla statistica, che è corretta e identica a quella usata per i fotoni: viene dall'<b>ipotesi sullo spettro delle frequenze</b>, cioè da aver messo tutti i $3N$ oscillatori alla stessa $\omega_E$. A bassa temperatura solo i modi con $\hbar\omega\lesssim T$ contribuiscono in modo apprezzabile al calore specifico, perché gli altri sono "congelati" (la loro occupazione è esponenzialmente piccola). Se <b>tutti</b> i modi stanno a $\omega_E$, non appena $T\ll\hbar\omega_E$ non ce n'è più nessuno accessibile, e il calore specifico crolla esponenzialmente. Un reticolo reale ha invece modi a <b>tutte</b> le frequenze fino a un massimo, inclusi modi a frequenza arbitrariamente bassa (le onde acustiche a grande lunghezza d'onda) — ed è esattamente ciò che il modello di Debye, nella prossima tappa, introduce.`},
   {q:R`Perché è ragionevole aspettarsi che un solido abbia dei modi a frequenza molto bassa, se gli atomi sono legati elasticamente alle loro posizioni di equilibrio?`,
    a:R`Perché i modi a bassa frequenza non sono oscillazioni di un singolo atomo nella propria buca di potenziale, ma <b>onde collettive a grande lunghezza d'onda</b> — la stessa fisica di un'onda sonora. Il criterio è che la frequenza di un'onda elastica va a zero quando la sua lunghezza d'onda tende all'infinito ($\omega=ck$ con $k\to0$), esattamente come per un'onda su una corda tesa: la corda intera che oscilla lentissimamente ha una frequenza bassissima anche se ogni singolo tratto di corda è "legato" ai tratti vicini. È questa fisica — dispersione lineare, non un singolo oscillatore isolato — che il modello di Einstein, mettendo tutti gli oscillatori indipendenti alla stessa frequenza, non può catturare.`}
  ]}
]},

/* ---------------- 07 · IL MODELLO DI DEBYE ---------------- */
{ num:'07', title:'Il modello di Debye', meta:'la dispersione lineare al posto dell’unica frequenza · il taglio fissato dal numero di modi · il ritorno alla legge in T al cubo',
  blocchi:[
  {t:'reveal', title:'Lo stesso conteggio dei fotoni, con una polarizzazione in più e un taglio in meno', tag:'costruzione', steps:[
   {label:'La densità di modi elastici', body:R`
   <p>Il modello di Debye (1912) sostituisce l'ipotesi di Einstein con quella opposta: le vibrazioni reticolari si trattano come onde elastiche in un mezzo continuo, con relazione di dispersione lineare $\omega=ck$ — $c$ è qui la velocità del suono nel solido, non quella della luce — esattamente come per i fotoni nella tappa 01. La differenza fisica è che un'onda elastica ammette <b>tre</b> polarizzazioni indipendenti invece di due: due trasversali (come la luce) più <b>una longitudinale</b>, permessa perché il vincolo di trasversalità della gauge elettromagnetica non ha qui nessun analogo — un'onda di compressione lungo la direzione di propagazione è un modo elastico perfettamente legittimo. Ripetendo il conteggio della tappa 01 con tre polarizzazioni al posto di due:</p>
   $$G(\omega)=\frac{3V}{2\pi^2c^3}\,\omega^2$$
   <p>cioè la stessa forma $\omega^2$ dei fotoni, con il coefficiente moltiplicato per $3/2$.</p>`},
   {label:'La frequenza di Debye: un taglio che viene dal numero di atomi', body:R`
   <p>A differenza del campo elettromagnetico, il numero di modi elastici <b>non è infinito</b>: un reticolo di $N$ atomi ha esattamente $3N$ gradi di libertà vibrazionali, non uno di più. Questo impone un taglio naturale alla densità di modi: esiste una frequenza massima $\omega_D$, la <b>frequenza di Debye</b>, definita da</p>
   $$\int_0^{\omega_D}G(\omega)\,d\omega=\frac{V\omega_D^3}{2\pi^2c^3}$$
   <p>uguagliata al numero totale di modi, $3N$. Risolvendo,</p>
   $$\omega_D^3=6\pi^2\frac{N}{V}c^3$$
   <p>La grandezza $\lambda_D=2\pi/k_D=2\pi c/\omega_D$ associata è dell'ordine della distanza media fra due atomi del reticolo, e questo ha un senso fisico preciso: <b>non ha significato un'onda elastica con lunghezza d'onda più corta della spaziatura reticolare stessa</b>, perché sotto quella scala il mezzo non è più continuo. Il taglio di Debye non è un artificio matematico per far tornare il conto — è la stessa fisica, tradotta in una formula, che dice che un reticolo discreto non può sostenere vibrazioni arbitrariamente corte.</p>`},
   {label:'Il calore specifico, e la funzione di Debye', body:R`
   <p>L'energia vibrazionale totale si ottiene integrando fino al taglio invece che all'infinito:</p>
   $$E(T)=\int_0^{\omega_D}\hbar\omega\,G(\omega)\,n(\omega)\,d\omega=\frac{3V\hbar}{2\pi^2c^3}\int_0^{\omega_D}\frac{\omega^3}{e^{\hbar\omega/T}-1}\,d\omega$$
   <p>Con la stessa sostituzione $y=\hbar\omega/T$ già usata per Stefan-Boltzmann, e dividendo per $N=V\omega_D^3/(6\pi^2c^3)$ (dalla relazione appena trovata), l'intero conto si riduce, dopo la sostituzione algebrica, a</p>
   $$\frac{E}{N}=3T\,D\!\left(\frac{T_D}{T}\right),\qquad D(x)=\frac{3}{x^3}\int_0^x\frac{y^3}{e^y-1}\,dy$$
   <p>dove $T_D=\hbar\omega_D$ è la <b>temperatura di Debye</b> — per molti solidi comuni <span class="str" data-str="ordini-di-grandezza">dell'ordine di</span> $200$ K, cioè ben sopra la temperatura ambiente — e $D(x)$ è la <b>funzione di Debye</b>, che contiene tutta la fisica del modello in una sola espressione universale. Il fatto che $T_D$ superi la temperatura ambiente per la maggior parte dei solidi comuni è anche la ragione per cui la legge $T^3$ non è solo una curiosità a bassissima temperatura: molti materiali a temperatura ambiente sono già, in buona approssimazione, nel loro regime $T\ll T_D$.</p>
   <p>Ai due estremi, $D(x)$ si sviluppa (per divisione della serie di $1/(e^y-1)$ e per il fatto che, per $x$ grande, l'integrale si avvicina al suo valore su tutta la semiretta) come</p>
   $$D(0{,}1)\simeq1-\tfrac38(0{,}1)+\tfrac1{20}(0{,}1)^2$$
   <p>per $x$ piccolo, verificabile numericamente sull'integrale diretto, e</p>
   $$D(20)\simeq\frac{\pi^4}{5\cdot20^3}$$
   <p>per $x$ grande — quest'ultimo è esattamente $\Gamma(4)\zeta(4)/x^3$ moltiplicato per $3$, lo stesso integrale $\pi^4/15$ della tappa 03: alla base della legge $T^3$ dei solidi c'è, nascosto, <b>lo stesso integrale della radiazione di corpo nero</b>.</p>
   <p>Da questi due sviluppi, differenziando $E/N$ rispetto a $T$, si ottengono le due leggi limite del calore specifico:</p>
   $$\frac{C_V}{N}=\frac{12\pi^4}{5}\frac{T^3}{T_D^3}\qquad(T\ll T_D)$$
   <p>la <b>legge $T^3$ di Debye</b>, in ottimo accordo con l'esperimento a bassa temperatura, e</p>
   $$\frac{C_V}{N}=3-\frac{3}{20}\left(\frac{T_D}{T}\right)^2\qquad(T\gg T_D)$$
   <p>che ritorna a Dulong-Petit ad alta temperatura, <b>avvicinandosi da sotto</b> con una correzione quadratica in $T_D/T$ — un dettaglio che si perde se si ricorda solo il valore limite $3$.</p>
   <p>Le due leggi asintotiche sono i due estremi di un'unica formula esatta, che vale la pena scrivere perché mostra come si raccordano: derivando rispetto a $T$ l'espressione di $E/N$ trovata sopra, con la regola della catena (il termine di bordo dell'integrale contribuisce insieme al termine che deriva il prefattore $T^4$),</p>
   $$\frac{C_V}{N}=12\,D\!\left(\frac{T_D}{T}\right)-\frac{9(T_D/T)}{e^{T_D/T}-1}$$
   <p>Si verifica che questa formula riproduce entrambi i limiti già trovati: per $T\gg T_D$, $D\to1$ e il secondo termine $\to1$ ($x/(e^x-1)\to1$ per $x\to0$), dando $12-9=3$; per $T\ll T_D$ il secondo termine è esponenzialmente piccolo e resta $12\,D(T_D/T)\simeq12\pi^4/(5x^3)$, esattamente la legge $T^3$ di sopra.</p>`}
  ]},
  {t:'plot', title:'La densità di modi elastici, con il taglio alla frequenza di Debye',
   intro:R`La densità di modi $G(\omega)\propto\omega^2$ dei fononi, identica nella forma a quella dei fotoni ma bruscamente troncata a $\omega_D$: sopra quella frequenza non esiste alcun modo elastico.`,
   plots:[
    {kind:'func2d', xr:[0,1.4], yr:[0,1.55], height:320, ticks:6,
     title:'stessa forma ω² dei fotoni, ma con un tetto',
     curves:[{f:'x<1?1.5*x*x:0', col:'#4c8dff', width:2.6, label:'G(ω), fononi (taglio a ω_D=1)'}],
     segs:[{x1:1,y1:0,x2:1,y2:1.5,col:'#b98cff',dash:true,width:1.4,label:'ω_D',lx:1.05,ly:1.4}],
     xlabel:'frequenza ω / ω_D', ylabel:'densità di modi G(ω)'}
   ],
   leggi:R`<p><b>Che cosa guardare: il muro verticale a $\omega_D$.</b> A differenza della densità di modi dei fotoni (tappa 01), che cresce indefinitamente, qui la curva si interrompe di netto: sopra $\omega_D$ il conteggio dei modi è già esaurito da $3N$, e non ne restano altri da eccitare.</p>
   <p><b>Che cosa impararne per i conti.</b> A bassa temperatura ($T\ll T_D$) l'occupazione di Bose rende comunque trascurabili i modi vicino al taglio — l'esponenziale li sopprime ben prima che si arrivi a $\omega_D$ — ed è per questo che, come mostrato in tappa 08, il calore specifico a bassa $T$ non "sente" il taglio ed è identico a quello di un gas di fotoni.</p>`},
  {t:'plot', title:'Il calore specifico: Debye contro Einstein',
   intro:R`La curva universale $C_V/(3N)$ del modello di Einstein in funzione di $T/T_E$, con l'asintoto di Dulong-Petit tratteggiato e, vicino all'origine, la legge $T^3$ di Debye — l'andamento asintotico a bassa temperatura dedotto nel testo, valido finché resta sotto il plateau.`,
   plots:[
    {kind:'func2d', xr:[0,1.6], yr:[0,1.15], height:340, ticks:6,
     title:'stesso limite alto-T, andamento opposto a basso-T',
     curves:[
      {f:'1', col:'#d8a13a', dash:true, label:'Dulong-Petit'},
      {f:'pow(1/x,2)*exp(1/x)/pow(exp(1/x)-1,2)', col:'#ff6b6b', width:2.6, label:'Einstein, exp(-T_E/T)'},
      {f:'x<0.5?12*PI*PI*PI*PI/5*pow(x,3):NaN', col:'#4c8dff', width:2.6, label:'Debye, legge T³ (asintoto a basso T)'}
     ],
     xlabel:'T / T_E (Einstein) oppure T / T_D (Debye)', ylabel:'C_V / (3N)'}
   ],
   leggi:R`<p><b>Che cosa guardare: l'origine.</b> La curva di Einstein (rossa) si avvicina a zero <b>appiattendosi bruscamente</b> — la firma dell'esponenziale, $e^{-T_E/T}$ — mentre la legge $T^3$ di Debye (blu) sale come una potenza, molto più "morbida": alla stessa temperatura ridotta, il solido di Debye ha sempre più calore specifico di quello di Einstein, perché possiede modi a bassa frequenza che Einstein vieta per costruzione.</p>
   <p><b>Che cosa guardare: dove la curva blu si ferma.</b> È disegnata solo nel suo dominio di validità, $T\ll T_D$: oltre quel punto la legge $T^3$ supererebbe il plateau di Dulong-Petit, il che è fisicamente impossibile — il calore specifico vero, dato dalla funzione di Debye completa $12D(x)-9x/(e^x-1)$ dedotta nel testo, si raccorda con continuità al valore $3$ passando da questa asintotica al plateau.</p>
   <p><b>Che cosa impararne per i conti.</b> Le due curve condividono esattamente lo stesso valore limite $1$ per $T$ grande — è Dulong-Petit, e non dipende da nessun dettaglio dello spettro, solo dal numero di gradi di libertà — ma il modo in cui ci si arriva a bassa temperatura è opposto: potenza per Debye, esponenziale per Einstein. È la prova visiva che il comportamento a bassa T di un solido è governato interamente dai modi a bassa frequenza, che i due modelli trattano in modo opposto: Einstein li vieta, Debye li popola abbondantemente perché $G(\omega)\propto\omega^2$ non ha nessun buco vicino a zero.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Se un esercizio chiede di stimare la temperatura di Debye di un materiale sapendo la sua velocità del suono e la densità atomica, qual è la prima cosa da scrivere, prima di qualunque conto?`,
    a:R`La definizione di $\omega_D$ tramite il conteggio dei modi, $3N=\int_0^{\omega_D}G(\omega)\,d\omega$, con $G(\omega)$ scritta esplicitamente per la dimensionalità e il numero di polarizzazioni del problema — che potrebbero non essere i tre standard se l'esercizio descrive, per dire, un cristallo bidimensionale. Il modus operandi è: identificare $d$ e il numero di polarizzazioni, scrivere $G(\omega)$ dal conteggio geometrico dei modi (la stessa procedura della tappa 01), imporre che l'integrale fino a $\omega_D$ dia il numero totale di gradi di libertà vibrazionali, e solo allora risolvere per $\omega_D$. Saltare la definizione e cercare di ricordare a memoria la formula $\omega_D\propto(N/V)^{1/3}$ espone a errori di fattori numerici che il conto esplicito evita.`},
   {q:R`Il modello di Debye usa la relazione di dispersione lineare $\omega=ck$ fino a $\omega_D$, ma in un cristallo reale la dispersione delle onde elastiche si incurva vicino al bordo della zona di Brillouin. Perché il modello funziona comunque bene a bassa temperatura nonostante questa approssimazione grossolana?`,
    a:R`Perché a bassa temperatura l'occupazione di Bose sopprime esponenzialmente proprio i modi ad alta frequenza — quelli vicino a $\omega_D$, dove la dispersione reale si discosta di più da quella lineare — e lascia contribuire quasi soltanto i modi a bassa frequenza, dove la dispersione lineare è un'ottima approssimazione per costruzione (è il limite delle onde acustiche a grande lunghezza d'onda). Il criterio è lo stesso usato nella prossima tappa per mostrare che, a bassa $T$, il taglio $\omega_D$ non conta: l'errore del modello si concentra esattamente nella regione che pesa meno nell'integrale. È anche il motivo per cui Debye funziona peggio a temperature intermedie, dove i modi vicino al taglio — quelli descritti peggio — cominciano a contare.`}
  ]}
]},

/* ---------------- 08 · PERCHÉ DEBYE FUNZIONA E EINSTEIN NO ---------------- */
{ num:'08', title:'Perché Debye funziona e Einstein no', meta:'la densità di modi vicino a zero decide tutto · lo stesso integrale del corpo nero · il taglio che a bassa T non conta',
  blocchi:[
  {t:'prosa', title:'Un solo numero decide il destino di un modello', tag:'sintesi', html:R`
  <p>I due modelli condividono tutto tranne una cosa, ed è quella cosa a decidere chi vince a bassa temperatura. Entrambi trattano i fononi come bosoni con $\mu=0$; entrambi usano la stessa statistica di occupazione $n(\varepsilon)=1/(e^{\varepsilon/T}-1)$; entrambi riproducono correttamente Dulong-Petit ad alta temperatura, perché quel limite non dipende da nessun dettaglio dello spettro — dipende solo dal numero totale di gradi di libertà, che è $3N$ in entrambi i casi. <b>L'unica differenza è la densità di modi $G(\omega)$ vicino a $\omega=0$</b>: per Einstein è identicamente nulla (tutti i modi stanno a $\omega_E$, nessuno vicino a zero); per Debye va come $\omega^2$, cioè cresce da zero con continuità.</p>
  <p>A bassa temperatura, solo i modi con $\hbar\omega\lesssim T$ hanno un'occupazione apprezzabile — è la stessa lezione della catastrofe ultravioletta rovesciata: là il problema erano le alte frequenze che si accumulavano, qui il calore specifico lo fanno le <b>basse</b> frequenze che restano accessibili quando $T$ scende. Se non ce ne sono — il caso di Einstein — non resta nulla da eccitare, e il calore specifico crolla con la stessa urgenza dell'occupazione di un singolo livello isolato: esponenzialmente. Se invece $G(\omega)\propto\omega^2$ non ha nessun buco vicino a zero — il caso di Debye — a ogni temperatura, per quanto bassa, esiste sempre un intervallo di modi con $\hbar\omega\sim T$ pronti a contribuire, e il calore specifico segue una legge di potenza.</p>`},
  {t:'prosa', title:'Il taglio che, a bassa T, semplicemente non si accorge di esistere', tag:'connessione', html:R`
  <p>C'è un secondo fatto, più sottile, che vale la pena isolare perché è il punto in cui il modello di Debye <b>incontra</b> il corpo nero invece di limitarsi ad assomigliargli. Il calore specifico a bassa temperatura di Debye si è ottenuto nella tappa precedente studiando $D(x)$ per $x=T_D/T\to\infty$, cioè quando l'estremo di integrazione $\omega_D$ — riscalato in unità di $T/\hbar$ — diventa enorme. Ma un integrale con estremo superiore enorme, quando l'integrando decresce esponenzialmente ben prima di raggiungerlo, <b>non si accorge di avere un tetto</b>: il suo valore coincide, a tutti gli effetti pratici, con quello dell'integrale esteso all'infinito.</p>
  <p>Ed è esattamente questo che succede: il valore a cui tende $D(x)$ per $x$ grande, $\pi^4/(5x^3)$, contiene lo stesso identico integrale $\Gamma(4)\zeta(4)=\pi^4/15$ — a meno di un fattore $3$ — che compare nella legge di Stefan-Boltzmann della tappa 03. <b>A bassa temperatura, un solido con un taglio finito a $\omega_D$ e una cavità di radiazione senza nessun taglio calcolano, in pratica, lo stesso integrale</b>, perché in nessuno dei due casi la coda oltre $T/\hbar$ conta qualcosa. È per questo — non per una semplice somiglianza di forma tra le due densità $\omega^2$ — che entrambi i sistemi obbediscono a una legge $T^3$ (per il calore specifico dei fononi) o $T^4$ (per l'energia dei fotoni, un integrale di grado superiore per la presenza del fattore aggiuntivo $\hbar\omega$): <b>la stessa matematica del corpo nero, con la sola differenza che qui la somma ha un taglio e là no</b>, e a bassa temperatura quella differenza è invisibile.</p>
  <p>Il quadro completo, allora, è questo: il modello di Einstein sbaglia perché mette un buco dove la fisica ne mette un continuo di modi accessibili; il modello di Debye funziona a bassa temperatura perché, in quel regime, il taglio che introduce diventa irrilevante e il problema torna a essere — di fatto — lo stesso identico problema del corpo nero, solo con tre polarizzazioni al posto di due.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Se il taglio $\omega_D$ "non conta" a bassa temperatura, perché il modello di Debye non prevede semplicemente la stessa identica legge $T^4$ dei fotoni, invece di una legge $T^3$?`,
    a:R`Perché la potenza della temperatura non viene dal taglio (che infatti è irrilevante in entrambi i casi a bassa $T$): viene dal <b>numero di fattori di $\omega$ nell'integrando</b>. L'energia dei fotoni è $\int\hbar\omega\,G(\omega)\,n(\omega)\,d\omega\propto\int\omega^3n(\omega)\,d\omega$ — tre potenze di $\omega$ dalla densità di modi più una dal quanto di energia — e con la sostituzione $y=\hbar\omega/T$ questo dà un fattore $T^4$. Il <b>calore specifico</b> dei fononi (non l'energia) è invece la grandezza confrontabile: l'energia dei fononi va anch'essa come $T^4$ a bassa temperatura, esattamente come quella dei fotoni, per lo stesso conto con lo stesso integrale $\Gamma(4)\zeta(4)$. È derivando $E\propto T^4$ rispetto a $T$ che si ottiene $C_V\propto T^3$: la legge $T^3$ del calore specifico e la legge $T^4$ dell'energia sono la stessa fisica, guardata prima e dopo una derivata.`},
   {q:R`Un ipotetico solido con dispersione fononica quadratica invece che lineare (come un gas non relativistico) a bassa temperatura seguirebbe ancora una legge $T^3$?`,
