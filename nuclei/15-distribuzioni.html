  :root{

  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);

  .banner{background:var(--panel2);border-bottom:1px solid var(--border);color:var(--muted);

  .banner b{color:var(--accent2);}
  .shell{display:flex;max-width:1180px;margin:0 auto;align-items:flex-start;}

  /* ---- SIDEBAR ---- */
  .sidebar{width:280px;flex:0 0 280px;padding:20px 12px 60px;position:sticky;top:0;

  .navitem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:none;

  .navitem.active{background:#13233f;border-color:var(--accent);color:#fff;}

    border:1px solid var(--border);}
  .navitem.seen .dot{background:var(--ok);border-color:var(--ok);}
  .navitem .nx{color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto;}

  /* ---- MAIN ---- */
  .main{flex:1 1 auto;min-width:0;padding:24px 30px 90px;max-width:860px;}

  .sfhead{border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:8px;}
  .sfhead h1{font-size:1.55rem;}

  .section{margin:26px 0;}

    border:1px solid var(--border);color:var(--muted);padding:2px 8px;border-radius:20px;
    text-transform:uppercase;}
  /* --- blocchi figura --- */
  .section > h3 .tag.plottag{background:#101f2e;border-color:#1f3c57;color:#7ab8e0;}
  .plot-intro{color:var(--muted);font-size:.95rem;margin:0 0 12px;}
  .plot-row{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;
    background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;}
  .plot-row.due .plot-box{flex:1 1 300px;min-width:280px;}

  .plot-leggi{margin-top:10px;background:var(--panel2);border:1px solid var(--border);

  /* --- figure importate da una dispensa del docente ---

  .fig-nota{background:var(--panel);border:1px solid var(--border);border-radius:12px;

    font-size:.93rem;color:var(--muted);text-align:left;}

  .note.warn{background:var(--warnbg);border-left-color:var(--warn);color:#e0b85a;}
  .note.warn b{color:#f0c25a;}

  .gramwrap{background:var(--grambg);border:1px solid #1f4d47;border-radius:12px;padding:6px 6px;}
  table.gramtab{border-collapse:collapse;width:100%;font-size:.92rem;}

    border-right:1px solid #17332e;font-variant-numeric:tabular-nums;}
  .section > h3 .tag.gramtag{background:var(--grambg);border-color:#1f4d47;color:var(--gram);}

  /* ---- STRUMENTI (repertorio condiviso: la scheda si apre DENTRO la frase) ----
     Nessun accento nuovo: riusa il verde della grammatica, perche' uno strumento
     richiamato e' grammatica gia' spiegata altrove, non una quinta specie di blocco. */
  .str{color:var(--gram);border-bottom:1px dashed var(--gram);cursor:pointer;}
  .str:hover{background:var(--grambg);}
  .str::after{content:"\2666";font-size:.62em;vertical-align:.42em;margin-left:2px;opacity:.8;}
  .str.aperto::after{content:"\2715";}
  .str.rotto{color:#ff6b6b;border-bottom-color:#ff6b6b;cursor:help;}
  /* la scheda e' uno SPAN in display:block, non un div: i rimandi cadono dentro

  .strcard{display:block;margin:10px 0;background:var(--grambg);border:1px solid #1f4d47;
    border-left:3px solid var(--gram);border-radius:0 10px 10px 0;padding:10px 14px;font-size:.9rem;}
  .strcard .sh{display:block;font-size:.66rem;font-weight:700;letter-spacing:.5px;
    text-transform:uppercase;color:var(--gram);margin-bottom:7px;}
  .strcard .sr{display:block;margin:5px 0;}
  .strcard .sk{color:var(--gram);font-weight:600;}

  .prowrap{background:var(--probg);border:1px solid var(--proedge);border-radius:12px;padding:4px 4px 8px;}
  .prohead{padding:11px 14px 4px;color:var(--pro);font-size:.72rem;font-weight:700;letter-spacing:.7px;

  .pro-oggetto{padding:2px 14px 11px;color:var(--muted);font-size:.92rem;border-bottom:1px solid var(--proline);
    margin-bottom:2px;} .pro-oggetto b{color:var(--txt);}
  table.protab{border-collapse:collapse;width:100%;font-size:.92rem;}
  table.protab td{padding:10px 12px;vertical-align:top;border-bottom:1px solid var(--proline);}
  table.protab tr:last-child td{border-bottom:none;}
  table.protab td.pd{white-space:nowrap;color:var(--pro);width:1%;font-weight:700;font-size:.78rem;
    letter-spacing:.3px;text-transform:uppercase;border-right:1px solid var(--proline);line-height:1.3;}
  .pro-domanda{margin:8px 8px 2px;background:#140d26;border:1px solid var(--proedge);
    border-left:3px solid var(--pro);border-radius:8px;padding:10px 14px;font-size:.92rem;}
  .pro-domanda b{color:var(--pro);}
  .section > h3 .tag.protag{background:var(--probg);border-color:var(--proedge);color:var(--pro);}

  /* ---- REVEAL ---- */
  .rsteps{display:flex;flex-direction:column;gap:12px;}

  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .rlabel{font-size:.7rem;font-weight:700;letter-spacing:.4px;color:var(--accent);
    text-transform:uppercase;margin-bottom:8px;}
  .rstep p:first-of-type{margin-top:0;} .rstep p:last-child{margin-bottom:0;}
  .rstep ul{margin:.4em 0;padding-left:1.2em;}
  .testo{background:#13233f;border:1px solid #2b4877;border-radius:12px;padding:14px 18px;margin-bottom:14px;}
  .testo .src{display:block;font-size:.74rem;font-style:italic;color:var(--accent2);margin-bottom:8px;
    text-transform:uppercase;letter-spacing:.3px;}
  .esame-nota{font-size:.9rem;color:var(--muted);font-style:italic;margin-top:12px;padding-left:12px;

  .reveal-btn{background:var(--accent);color:#fff;border:none;padding:11px 18px;border-radius:10px;

  .reveal-btn:hover:not(:disabled){background:var(--accent2);}
  .reveal-btn.small{padding:7px 14px;font-size:.85rem;margin-top:0;background:var(--panel2);

  .reveal-btn.small:hover:not(:disabled){border-color:var(--accent);}
  .reveal-btn:disabled,.reveal-btn.done{background:var(--panel2);color:var(--muted);
    border:1px solid var(--border);cursor:default;}

  /* ---- COLLAUDO ---- */
  .collaudo-item{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 18px;margin-bottom:12px;}
  .cq{margin-bottom:10px;}
  .ca{margin-top:12px;background:var(--okbg);border:1px solid #235c33;border-radius:8px;
    padding:10px 14px;font-size:.94rem;}
  .ca b{color:#5fd980;}

  /* ---- PREV / NEXT ---- */
  .prevnext{display:flex;justify-content:space-between;gap:12px;margin-top:40px;
    border-top:1px solid var(--border);padding-top:20px;}
  .pnbtn{flex:1 1 0;background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:12px 16px;cursor:pointer;color:var(--txt);text-align:left;transition:.14s;font:inherit;}
  .pnbtn:hover{border-color:var(--accent);background:var(--panel2);}
  .pnbtn.next{text-align:right;}
  .pnbtn .k{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .pnbtn .t{font-weight:600;color:var(--accent2);}
  .pnbtn:disabled{opacity:.35;cursor:default;border-color:var(--border);background:var(--panel);}

  code{background:var(--panel2);border:1px solid var(--border);border-radius:5px;
    padding:1px 5px;font-size:.85em;color:var(--accent2);}
  .katex{font-size:1.02em;color:var(--txt);} .katex-display{margin:.5em 0;overflow-x:auto;overflow-y:hidden;}

  @media(max-width:860px){
    .shell{flex-direction:column;}
    .sidebar{width:100%;flex:none;position:static;max-height:none;border-right:none;
      border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:4px;}
    .sidebar h2{width:100%;} .navitem{width:auto;}
    .main{padding:20px 16px 80px;}
  }
</style>

/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un

var CORSO = 'metodi-e-modelli';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["delta-di-dirac"] = {"nome":"Delta di Dirac","riga":"Non è una funzione ma un funzionale, definito da $\\int f(x)\\,\\delta(x-a)\\,dx=f(a)$, che composto con una funzione si spezza sui suoi zeri come $\\delta(g(x))=\\sum_i \\delta(x-x_i)/|g'(x_i)|$.","serve":"Serve come macchina per cambiare variabile senza invertire nulla. La densità di $y=f(x)$ si scrive $p_Y(y)=\\int p_X(x)\\,\\delta(y-f(x))\\,dx$, e la delta produce da sola il fattore $1/|f'|$ che altrimenti andrebbe messo a mano: i rami molteplici si contano da soli invece di doverli ricordare. È la ragione pratica per cui il formalismo con la delta compare in ogni soluzione d'esame che tocchi una distribuzione, mentre il cambio di variabile esplicito compare quasi mai.","esempio":"$\\delta(x^2-a^2)$ con $a$ positivo. Gli zeri sono $x=\\pm a$; la derivata dell'argomento è $2x$, che in modulo vale $2a$ su entrambi. Quindi $\\delta(x^2-a^2)=\\dfrac{1}{2a}\\big[\\delta(x-a)+\\delta(x+a)\\big]$. Il caso si ripete identico in fisica statistica con $\\varepsilon=p^2/2m$ in una dimensione, dove i due rami $p=\\pm\\sqrt{2m\\varepsilon}$ contribuiscono entrambi — e dimenticarne uno dimezza la risposta.","pieno":{"file":"15-distribuzioni.html","tappa":"01","come":"le distribuzioni come funzionali, la delta e le sue proprietà, nel nucleo di Metodi"},"qui":{"meccanica-statistica":{"serve":"È lo strumento con cui si calcola la densità degli stati, cioè l'oggetto su cui poggia tutto il secondo tempo del corso: $g(\\varepsilon)=\\int d^dp\\,d^dq\\;\\delta(\\varepsilon-H)/h^d$. L'identità che si usa davvero non è la definizione ma questa: $\\delta(\\varepsilon-H)=\\partial_\\varepsilon\\,\\theta(\\varepsilon-H)$. Si scambia l'integrale con la derivata e ci si ritrova a calcolare il volume della regione dove l'hamiltoniana sta sotto $\\varepsilon$ — un integrale elementare — invece di un integrale con una delta dentro. La $g$ così ottenuta è pura geometria dello spazio delle fasi: non sa nulla della temperatura, e per questo resta identica quando si passa da Boltzmann a Fermi o a Bose.","esempio":"Particella libera in due dimensioni. Il volume della regione $p^2/2m$ sotto $\\varepsilon$ è il disco di area $2\\pi m\\varepsilon$; derivando rispetto a $\\varepsilon$ si ottiene $2\\pi m$, cioè una densità degli stati costante. Non è una curiosità: è la ragione per cui in due dimensioni una particella libera non condensa, e per cui le prove che chiedono la condensazione in $d=2$ mettono sempre un potenziale confinante, che porta la $g$ da costante a crescente."}},"controllo":[{"tipo":"derivata","espr":"x**2-a**2","rispetto":["x"],"vale":"2*x","ipotesi":{"x":"positive","a":"positive"},"dove":"esempio","appare":"2x"},{"tipo":"uguale","sinistra":"1/Abs(2*a)","vale":"1/(2*a)","ipotesi":{"a":"positive"},"dove":"esempio","appare":"\\dfrac{1}{2a}"},{"tipo":"derivata","espr":"2*pi*m*e","rispetto":["e"],"vale":"2*pi*m","ipotesi":{"m":"positive","e":"positive"},"dove":"qui.meccanica-statistica.esempio","appare":"2\\pi m"}]};
STRUM["trasformata-di-fourier"] = {"nome":"Trasformata di Fourier","riga":"L'operazione $\\hat f(k)=\\int f(x)\\,e^{-ikx}\\,dx$, che riscrive una funzione come sovrapposizione di onde piane e manda la derivata in una moltiplicazione per $ik$.","serve":"È lo strumento che rende ALGEBRICA un'equazione differenziale lineare a coefficienti costanti: con $\\partial_x$ che diventa $ik$, un'equazione differenziale in $x$ diventa un'equazione algebrica in $k$, si risolve, e si antitrasforma. Le due cose da non perdere sono la convenzione dei $2\\pi$, che cambia da testo a testo e va dichiarata una volta, e Plancherel, che dice che la trasformata conserva la norma $L^{2}$ — in fisica, l'energia.","esempio":"La gaussiana $f(x)=e^{-x^{2}/2}$ ha trasformata $\\int_{-\\infty}^{+\\infty}e^{-x^{2}/2}e^{-ikx}\\,dx=\\sqrt{2\\pi}\\,e^{-k^{2}/2}$: ancora una gaussiana, tanto più larga quanto l'originale è stretta. È il caso in cui si vede meglio il principio di indeterminazione come fatto puramente matematico.","pieno":{"file":"15-distribuzioni.html","tappa":"02","come":"le proprietà, la derivata che diventa un prodotto e Plancherel, nel nucleo delle distribuzioni"},"qui":{"elettromagnetismo":{"serve":"Serve appena si scrive un'onda generica invece di una monocromatica: ogni soluzione delle equazioni di Maxwell nel vuoto è una sovrapposizione di onde piane $e^{i(\\mathbf k\\cdot\\mathbf x-\\omega t)}$, e la trasformata è il modo di scomporla. Su ciascuna componente l'equazione delle onde si riduce alla relazione di dispersione, e la propagazione diventa un far girare fasi: ogni modo viaggia da solo, e nel vuoto tutti alla stessa velocità — per questo un impulso non si deforma.","esempio":"La sostituzione $\\partial_x\\to ik$ e $\\partial_t\\to-i\\omega$ manda le derivate seconde in $(ik)^{2}=-k^{2}$ e $(-i\\omega)^{2}=-\\omega^{2}$: l'equazione delle onde diventa $\\omega^{2}=c^{2}k^{2}$, cioè un'equazione di secondo grado al posto di una differenziale, e la sua radice positiva $\\omega=ck$ è la relazione di dispersione del vuoto."}},"controllo":[{"tipo":"integrale","espr":"exp(-x**2/2)*exp(-I*k*x)","var":"x","da":"-oo","a":"oo","vale":"sqrt(2*pi)*exp(-k**2/2)","ipotesi":{"k":"real"},"dove":"esempio","appare":"\\sqrt{2\\pi}\\,e^{-k^{2}/2}"},{"tipo":"uguale","sinistra":"(I*k)**2","vale":"-k**2","ipotesi":{"k":"real"},"dove":"qui.elettromagnetismo.esempio","appare":"-k^{2}"},{"tipo":"uguale","sinistra":"(-I*w)**2","vale":"-w**2","ipotesi":{"w":"real"},"dove":"qui.elettromagnetismo.esempio","appare":"-\\omega^{2}"},{"tipo":"uguale","sinistra":"(c*k)**2","vale":"c**2*k**2","dove":"qui.elettromagnetismo.esempio","appare":"c^{2}k^{2}"}]};
STRUM["funzione-bump"] = {"nome":"Funzione a bernoccolo","riga":"La funzione a bernoccolo $\\lambda(t)$, nulla per $t\\le0$ ed uguale a $e^{-1/t^2}$ per $t\\gt0$, è liscia su tutto $\\mathbb{R}$ con tutte le derivate nulle in $0$ ma non identicamente nulla a destra, dunque $C^\\infty$ e non analitica.","serve":"a fabbricare funzioni lisce a supporto compatto, cioè identicamente nulle fuori da una regione limitata e non nulle dentro — un oggetto che nessuna funzione analitica non banale può essere, per il principio di identità (una serie di potenze nulla su un aperto è nulla ovunque). È questa la ragione tecnica per cui $C^\\infty$ è una categoria strettamente più grande dell'analitico, e la conseguenza operativa è tutto ciò che ne segue: incollando due bernoccoli si ottiene un gradino liscio che passa da $0$ a $1$ in un intervallo prescritto, da cui si costruisce una funzione che vale $1$ su un compatto e $0$ fuori da un suo intorno, da cui le partizioni dell'unità. Senza una funzione liscia che si annulla su un aperto senza annullarsi ovunque, nessuno di questi incollamenti preserverebbe la regolarità.","esempio":"Si valuti $\\lambda$ in due punti. Per $t=-1\\le0$ si ha $\\lambda(-1)=0$ per definizione; per $t=1\\gt0$ si ha $\\lambda(1)=e^{-1/1^2}=e^{-1}=1/e\\approx0{,}3679$, dunque la funzione è genuinamente non nulla a destra. Eppure in $0$ è liscia con tutte le derivate nulle: per $t\\gt0$ la derivata è $\\lambda'(t)=\\tfrac{2}{t^3}e^{-1/t^2}$, e il limite $\\lim_{t\\to0^+}e^{-1/t^2}=0$ perché l'esponenziale batte ogni potenza di $1/t$. Se $\\lambda$ fosse analitica in $0$, avendo serie di Taylor identicamente nulla sarebbe nulla in tutto un intorno — ma $\\lambda(1)=1/e\\neq0$: è $C^\\infty$ e non analitica, ed è esattamente questo scarto a renderla utile.","pieno":{"file":"gd-05-partizioni-unita.html","tappa":"01","come":"la costruzione di e^{-1/t}, perche' tutte le sue derivate si annullano in 0, il gradino e il bump su R^n"},"controllo":[{"tipo":"uguale","sinistra":"exp(-1/1**2)","vale":"exp(-1)","dove":"esempio","appare":"\\lambda(1)=e^{-1/1^2}=e^{-1}=1/e"},{"tipo":"numero","espr":"exp(-1)","vale":"0.3679","dove":"esempio","appare":"1/e\\approx0{,}3679"},{"tipo":"derivata","espr":"exp(-1/t**2)","rispetto":["t"],"vale":"2/t**3*exp(-1/t**2)","dove":"esempio","appare":"\\lambda'(t)=\\tfrac{2}{t^3}e^{-1/t^2}"},{"tipo":"limite","espr":"exp(-1/t**2)","var":"t","a":"0","verso":"+","vale":"0","dove":"esempio","appare":"\\lim_{t\\to0^+}e^{-1/t^2}=0"}]};
STRUM["residuo"] = {"nome":"Residuo","riga":"Il coefficiente $a_{-1}$ dello sviluppo di Laurent attorno a una singolarità isolata, cioè l'unico termine che sopravvive all'integrazione su un cerchietto attorno al punto.","serve":"È il numero che trasforma un integrale in una somma: tutto il resto della serie integra a zero su un giro chiuso, e resta $2\\pi i$ per la somma dei residui. Tre formule coprono quasi tutto — polo semplice $\\lim(z-z_0)f$; quoziente con polo semplice $P(z_0)/Q'(z_0)$, la più rapida perché non chiede di fattorizzare; polo di ordine $m$ con la derivata $(m-1)$-esima — e per l'ordine alto o per una singolarità essenziale conviene invece dividere le serie e leggere il coefficiente di $(z-z_0)^{-1}$.","esempio":"Con $f=\\dfrac{z}{z^{2}+1}$ in $z_0=i$ la formula del quoziente dà $\\dfrac{P(i)}{Q'(i)}=\\dfrac{i}{2i}=\\tfrac12$, senza fattorizzare nulla. Per $\\dfrac{e^{z}}{(z-2)^{3}}$ in $2$ il polo è di ordine $3$ e la formula con la derivata seconda dà $\\tfrac{e^{2}}{2}$. Per $\\dfrac{\\cos z-1}{z^{5}}$ in $0$ le formule sono peggio dello sviluppo: da $\\cos z-1=-\\tfrac{z^{2}}{2}+\\tfrac{z^{4}}{24}-\\cdots$ il coefficiente di $z^{-1}$ si legge direttamente, e vale $\\tfrac1{24}$.","pieno":{"file":"13-residui.html","tappa":"01","come":"le tre formule, il criterio di scelta e i casi svolti, nel nucleo sui residui"},"controllo":[{"tipo":"uguale","sinistra":"I/(2*I)","vale":"1/2","dove":"esempio","appare":"\\tfrac12"},{"tipo":"uguale","sinistra":"exp(2)/factorial(2)","vale":"exp(2)/2","dove":"esempio","appare":"\\tfrac{e^{2}}{2}"},{"tipo":"uguale","sinistra":"series(cos(z)-1, z, 0, 5).removeO()","vale":"-z**2/2 + z**4/24","dove":"esempio","appare":"-\\tfrac{z^{2}}{2}+\\tfrac{z^{4}}{24}"},{"tipo":"uguale","sinistra":"1/factorial(4)","vale":"1/24","dove":"esempio","appare":"\\tfrac1{24}"}]};

function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';

}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

{ num:'00', title:'Perché questo nucleo', meta:'Metodi · voce F.2 del programma · l’oggetto giusto non è la funzione, è il funzionale',
  blocchi:[
  {t:'prosa', title:'Il cambio di prospettiva', tag:'first principles', html:R`
  <p>Il nucleo 10 ha lasciato una crepa: in $L^2$ il <b>valore in un punto</b> non ha senso. Eppure la fisica parla continuamente di sorgenti puntiformi — una carica in un punto, un urto istantaneo, una densità concentrata. La conciliazione è cambiare l&rsquo;oggetto: non funzioni che hanno valori, ma <b>funzionali</b> che hanno <i>effetti</i> su funzioni di prova.</p>
  <p>La <span class="str" data-str="delta-di-dirac">$\delta$ di Dirac</span> non è una funzione &laquo;infinita in $0$ e nulla altrove&raquo; — nessuna funzione così ha integrale $1$ (per Lebesgue, un valore su un insieme di misura nulla non contribuisce). È la <b>regola</b>
  $$\langle\delta,\varphi\rangle=\varphi(0):$$
  &laquo;dammi una funzione di prova, ti restituisco il suo valore nell&rsquo;origine&raquo;. Definita così è un oggetto perfettamente rigoroso, e si può <b>derivare infinite volte</b> — cosa che sblocca l&rsquo;intero apparato: si deriva ciò che non è derivabile, si trasforma secondo Fourier ciò che non è integrabile, e si risolvono equazioni differenziali con sorgenti singolari.</p>`},
  {t:'prosa', title:'Cosa saprai fare, uscendo di qui', tag:'performance attesa', html:R`
  <ul>
  <li>Maneggiare $\delta$, $\delta^{\prime}$, $H$ (Heaviside) come <b>distribuzioni</b>: derivate, cambi di scala, composizione con funzioni.</li>
  <li>Calcolare <span class="str" data-str="trasformata-di-fourier"><b>trasformate di Fourier</b></span> con le proprietà (derivata $\leftrightarrow$ moltiplicazione, convoluzione $\leftrightarrow$ prodotto, traslazione $\leftrightarrow$ fase) e conoscere Plancherel.</li>
  <li>Costruire la <b>funzione di Green</b> di un problema ai limiti per EDO, imponendo le <b>condizioni di giunzione</b> corrette — <b>compreso il caso con $\delta^{\prime}$, dove a saltare è la funzione e non la derivata</b>. È il trabocchetto numero uno dell&rsquo;esame.</li>
  <li>Risolvere calore/onde/Laplace su domini semplici per <b>separazione di variabili</b> e Fourier.</li>
  </ul>`}
]},

/* ---------------- 01 · DISTRIBUZIONI ---------------- */
{ num:'01', title:'Distribuzioni: funzionali, non funzioni', meta:'funzioni di prova · $\\delta$ e $H$ · la derivata distribuzionale scarica sulla test',
  blocchi:[
  {t:'prosa', title:'Definizione e i due esempi che bastano', tag:'grammatica', html:R`
  <p>Si fissa uno spazio di <b>funzioni di prova</b>: $\mathcal{D}$ = funzioni $C^\infty$ a supporto compatto, oppure $\mathcal{S}$ = funzioni $C^\infty$ a decrescita rapida (Schwartz). Una <b>distribuzione</b> è un funzionale lineare e continuo $T:\varphi\mapsto\langle T,\varphi\rangle$.</p>
  <ul>
  <li>Ogni funzione localmente integrabile $f$ <b>è</b> una distribuzione: $\langle T_f,\varphi\rangle=\int f\varphi$. Le distribuzioni <b>estendono</b> le funzioni, non le sostituiscono.</li>
  <li>La <b>delta di Dirac</b>: $\langle\delta_a,\varphi\rangle=\varphi(a)$. Non proviene da nessuna funzione: è genuinamente nuova (si dice <b>singolare</b>).</li>
  </ul>
  <p><b>La derivata, e il trucco che la rende possibile.</b> Per $f$ liscia, integrando per parti con $\varphi$ a supporto compatto (i termini di bordo muoiono): $\int f'\varphi=-\int f\varphi'$. Si <b>promuove questa identità a definizione</b>:
  $$\langle T',\varphi\rangle:=-\langle T,\varphi'\rangle.$$
  La derivata viene <b>scaricata sulla funzione di prova</b>, che è $C^\infty$ e la sopporta sempre. Conseguenza: <b>ogni distribuzione è derivabile infinite volte</b>, e con essa ogni funzione localmente integrabile — anche quelle con salti e angoli.</p>`},
  {t:'reveal', title:'Le identità da avere in mano', tag:'derivazione', steps:[
   {label:'$H^{\\prime}=\\delta$', body:R`<p>Con $H$ la Heaviside ($0$ per $x\lt0$, $1$ per $x\gt0$):
   $$\langle H',\varphi\rangle=-\langle H,\varphi'\rangle=-\int_0^{\infty}\varphi'(x)dx=-\big[\varphi\big]_0^{\infty}=\varphi(0)=\langle\delta,\varphi\rangle.$$
   Il salto di ampiezza $1$ ha prodotto una $\delta$ di peso $1$. <b>Regola generale:</b> derivando una funzione regolare a tratti si ottiene la derivata ordinaria <b>più</b> una $\delta$ in ogni salto, di peso pari all&rsquo;ampiezza del salto.</p>`},
   {label:'$\\delta^{\\prime}$ e le sue proprietà', body:R`<p>$\langle\delta',\varphi\rangle=-\langle\delta,\varphi'\rangle=-\varphi'(0)$. Da tenere:</p>
   <ul>
   <li>$x\,\delta(x)=0$ e $x\,\delta'(x)=-\delta(x)$ (si verificano su una $\varphi$ generica).</li>
   <li><b>Riscalamento:</b> $\delta(ax)=\dfrac{1}{|a|}\delta(x)$.</li>
   <li><b>Composizione:</b> $\delta\big(g(x)\big)=\displaystyle\sum_{k}\frac{\delta(x-x_k)}{|g'(x_k)|}$, somma sugli <b>zeri semplici</b> $x_k$ di $g$. Esempio d&rsquo;uso continuo: $\delta(x^2-a^2)=\frac{1}{2|a|}\big[\delta(x-a)+\delta(x+a)\big]$.</li>
   </ul>`},
   {label:'La $\\delta$ come limite (e perché non è un limite di funzioni)', body:R`<p>Le gaussiane $g_\varepsilon(x)=\frac{1}{\varepsilon\sqrt\pi}e^{-x^2/\varepsilon^2}$ hanno integrale $1$ per ogni $\varepsilon$ e si stringono. Non convergono a nessuna <b>funzione</b> (puntualmente vanno a $0$ fuori dall&rsquo;origine e a $+\infty$ in $0$), ma convergono <b>come distribuzioni</b>: $\int g_\varepsilon\varphi\to\varphi(0)$. È la successione del nucleo 10 che &laquo;sfuggiva alla dominata&raquo;: vista come funzionale, il suo limite esiste ed è la $\delta$. <b>La convergenza debole è la nozione giusta</b>, e l&rsquo;oggetto limite vive in uno spazio più grande di quello di partenza.</p>`}
  ]},
  {t:'plot', title:'La $\\delta$ come limite di gaussiane che si stringono',
   intro:R`$g_\varepsilon(x)=\frac{1}{\varepsilon\sqrt\pi}e^{-x^2/\varepsilon^2}$ per $\varepsilon=1;\ 0{,}5;\ 0{,}25$: l&rsquo;area resta $1$, l&rsquo;altezza cresce come $1/\varepsilon$.`,
   plots:[
    {kind:'func2d', xr:[-2.2,2.2], yr:[-0.3,2.6], height:340,
     title:'approssimanti della delta: area 1, larghezza -> 0',
     curves:[
      {f:'exp(-x*x)/sqrt(PI)', col:'#5eead4', width:2, label:'eps=1'},
      {f:'exp(-x*x/0.25)/(0.5*sqrt(PI))', col:'#4c8dff', width:2, label:'eps=0.5'},
      {f:'exp(-x*x/0.0625)/(0.25*sqrt(PI))', col:'#b98cff', width:2.2, label:'eps=0.25'}
     ]}
   ],
   leggi:R`Nessuna di queste curve <i>è</i> la $\delta$, e la successione non converge a una funzione: fuori dall&rsquo;origine tende a $0$, nell&rsquo;origine diverge. Ciò che converge è l&rsquo;<b>effetto</b>: $\int g_\varepsilon\varphi\to\varphi(0)$ per ogni funzione di prova $\varphi$, perché la massa si concentra dove $\varphi$ vale $\varphi(0)$. <b>La $\delta$ è quel limite, e vive nello spazio dei funzionali.</b> Nota che la famiglia scelta è irrilevante: lorentziane, rettangoli, $\frac{\sin(x/\varepsilon)}{\pi x}$ danno tutte la stessa $\delta$ — e in fisica questo si traduce nel fatto che la forma dettagliata di una sorgente &laquo;puntiforme&raquo; o di un impulso &laquo;istantaneo&raquo; non conta, purché sia piccola rispetto alle scale del problema. <b>La $\delta$ è l&rsquo;idealizzazione resa esatta.</b>`},
  {t:'prosa', title:'Due vie allo stesso oggetto, nelle due fonti del corso', tag:'cucitura', html:R`
  <p>Esposito costruisce la $\delta$ esattamente così — una gaussiana $\rho_\sigma(x)=e^{-x^2/2\sigma^2}/(\sqrt{2\pi}\,\sigma)$ che si restringe mantenendo area $1$ — e premette un&rsquo;osservazione che vale la pena portare all&rsquo;esame: la teoria delle distribuzioni è <i>uno dei rari casi in cui la fisica è arrivata prima della matematica</i>. La $\delta$ era già in uso quotidiano in fisica prima che <b>Laurent Schwartz</b> le desse un fondamento rigoroso, negli anni &rsquo;40-&rsquo;50 del Novecento — e il nome stesso, &laquo;distribuzione&raquo;, nasce lì per sostituire &laquo;funzione generalizzata&raquo;, termine più onesto ma meno maneggevole.</p>
  <p>Calogero arriva allo stesso oggetto da una porta diversa: non da una gaussiana scelta apposta, ma dal <b>nucleo di Dirichlet</b> $\frac{1}{\pi}\frac{\sin ny}{y}$, lo stesso che compare nella dimostrazione di convergenza delle serie di Fourier — la somma parziale di una serie di Fourier è la convoluzione del dato con quel nucleo — la formula che garantisce che una serie di Fourier riproduca $f(x)$ nei punti dove $f$ è continua, letta al limite $n\to\infty$. Le due costruzioni non competono: confermano che l&rsquo;oggetto non dipende dalla famiglia scelta per approssimarlo, esattamente il punto appena fatto con le gaussiane qui sopra — e il nucleo di Dirichlet è un ponte diretto fra &laquo;perché Fourier converge&raquo; e &laquo;cos&rsquo;è la $\delta$&raquo;, due domande che altrimenti sembrerebbero slegate.</p>`}
]},

/* ---------------- 02 · LE DUE FAMIGLIE DI FUNZIONI DI PROVA ---------------- */
{ num:'02', title:'Le due famiglie di funzioni di prova, e perche servono entrambe', meta:'$\\mathcal{D}$ e $\\mathcal{S}$ · la continuita che si chiede · $\\mathcal{D}^{\\prime}$ e le temperate · chi sta dentro e chi no',
  blocchi:[
  {t:'prosa', title:'Due spazi, e la ragione della differenza', tag:'grammatica', html:R`
  <p>Una distribuzione è un funzionale <i>sulle funzioni di prova</i>, quindi prima di dire che cos&rsquo;è una distribuzione bisogna dire su chi agisce. Le famiglie in uso sono due, e non è una ridondanza.</p>
  <ul>
   <li>$\mathcal{D}(\mathbb{R})$ — le funzioni $C^{\infty}$ a <b>supporto compatto</b>. Che non sia vuoto non è ovvio, perché una funzione analitica non nulla non può annullarsi su un intervallo: servono le <span class="str" data-str="funzione-bump">bump</span>, ed è lì che il lavoro fatto prima viene consumato.</li>
   <li>$\mathcal{S}(\mathbb{R})$ — le funzioni $C^{\infty}$ a <b>decrescita rapida</b>: per ogni coppia di interi $m,k\ge0$
   $$\sup_{x\in\mathbb{R}}\big|x^{m}\varphi^{(k)}(x)\big|<\infty,$$
   cioè $\varphi$ e tutte le sue derivate vanno a zero più in fretta di ogni potenza. La gaussiana $e^{-x^{2}}$ ci sta e non ha supporto compatto.</li>
  </ul>
  <p>Ovviamente $\mathcal{D}\subset\mathcal{S}$: chi si annulla identicamente fuori da un compatto decresce più in fretta di qualunque cosa. <b>L&rsquo;inclusione è stretta</b>, e la gaussiana lo dimostra.</p>`},
  {t:'prosa', title:'La continuita, e perche si enuncia sulle successioni', tag:'first principles', html:R`
  <p>«Funzionale lineare e <b>continuo</b>» richiede una nozione di convergenza, e su $\mathcal{D}$ quella giusta è severa: $\varphi_n\to\varphi$ se <b>(a)</b> esiste un unico compatto $K$ che contiene i supporti di tutte le $\varphi_n$, e <b>(b)</b> per ogni $k$ la derivata $k$-esima converge <i>uniformemente</i>. In simboli:</p>
  $$\varphi_n\to\varphi\ \text{in}\ \mathcal{D}\iff\exists K\ \text{compatto}:\ \forall n\ \ \operatorname{supp}\varphi_n\subseteq K,\ \ \text{e}\ \ \forall k\ \ \sup_{x}\big|\varphi_n^{(k)}(x)-\varphi^{(k)}(x)\big|\to0.$$
  <p><b>Perché così severa, ed è il punto da capire.</b> Più è difficile convergere nello spazio di prova, più è <i>facile</i> essere continui come funzionali — e quindi più distribuzioni esistono. La severità della convergenza in $\mathcal{D}$ è esattamente ciò che rende $\mathcal{D}'$ grande abbastanza da contenere la $\delta$ e tutte le sue derivate. <b>È un baratto deliberato</b>: si stringe da una parte per allargare dall&rsquo;altra.</p>
  <p>Si scrive allora $\mathcal{D}'$ per i funzionali lineari continui su $\mathcal{D}$ — le <b>distribuzioni</b> — e $\mathcal{S}'$ per quelli su $\mathcal{S}$, dette <b>temperate</b>. Poiché $\mathcal{D}\subset\mathcal{S}$, ogni funzionale su $\mathcal{S}$ si restringe a uno su $\mathcal{D}$, e l&rsquo;inclusione si <b>rovescia</b>:
  $$\mathcal{D}\subset\mathcal{S}\qquad\Longrightarrow\qquad \mathcal{S}'\subset\mathcal{D}'.$$
  <b>Meno funzioni di prova, più funzionali</b>, ed è la regola generale di ogni dualità.</p>`},
  {t:'prosa', title:'Chi sta dentro e chi no', tag:'esempio', html:R`
  <p>Gli esempi che conviene avere in mano, perché distinguono le due classi:</p>
  <ul>
   <li>$\delta$, $\delta^{(k)}$, ogni funzione localmente integrabile a crescita polinomiale: <b>temperate</b>;</li>
   <li>$e^{x}$: è localmente integrabile, quindi è in $\mathcal{D}'$ — contro una $\varphi$ a supporto compatto l&rsquo;integrale $\int e^{x}\varphi(x)\,dx$ converge sempre. Ma <b>non è temperata</b>: contro $\varphi(x)=e^{-x^{2}}$, che sta in $\mathcal{S}$, l&rsquo;integrale $\int e^{x}e^{-x^{2}}dx$ converge, mentre contro una $\varphi$ che decresce solo polinomialmente no. Il controesempio netto è $e^{x^{2}}$, che non è temperata perché batte ogni decrescita rapida;</li>
   <li>$\operatorname{p.v.}\frac1x$, il valore principale: è temperata, ed è l&rsquo;esempio che mostra che una distribuzione può nascere da una funzione <i>non</i> localmente integrabile, purché la si regolarizzi.</li>
  </ul>
  <div class="note"><b>Perché due spazi e non uno solo.</b> La risposta sta in ciò che si vuole fare dopo: $\mathcal{S}$ è costruito su misura perché la trasformata di Fourier mandi lo spazio in sé — derivare diventa moltiplicare per la variabile, e la decrescita rapida è proprio la condizione che sopravvive a quello scambio. Su $\mathcal{D}$ la trasformata non funzionerebbe, perché <b>la trasformata di una funzione a supporto compatto non ha supporto compatto</b>. Per questo le distribuzioni temperate sono la classe su cui Fourier si estende, e per questo esistono separatamente.</div>`}
]},

/* ---------------- 03 · LA DERIVATA DISTRIBUZIONALE ---------------- */
{ num:'03', title:'La derivata distribuzionale, e cosa si guadagna davvero', meta:'ogni distribuzione e $C^{\\infty}$ · Leibniz con una funzione liscia · la regola del salto · il valore principale',
  blocchi:[
  {t:'prosa', title:'La definizione, e perche e lunica possibile', tag:'costruzione', html:R`
  <p>Si è già visto il meccanismo: per $f$ liscia e $\varphi$ a supporto compatto, l&rsquo;integrazione per parti non lascia termini di bordo e dà $\int f'\varphi=-\int f\varphi'$. Promuovendo l&rsquo;identità a definizione,
  $$\langle T',\varphi\rangle:=-\langle T,\varphi'\rangle,$$
  <b>e questa è l&rsquo;unica scelta possibile</b>, non una fra tante: se si vuole che la derivata distribuzionale estenda quella ordinaria — cioè che $(T_f)'=T_{f'}$ quando $f$ è liscia — allora la formula è forzata dall&rsquo;integrazione per parti. <b>Non c&rsquo;è libertà, c&rsquo;è una sola estensione coerente.</b></p>
  <p>Che $T'$ sia davvero una distribuzione va controllato, ed è immediato: è lineare perché lo è $\varphi\mapsto\varphi'$, ed è continua perché se $\varphi_n\to\varphi$ in $\mathcal{D}$ allora anche $\varphi_n'\to\varphi'$ in $\mathcal{D}$ — la convergenza in $\mathcal{D}$ chiede <i>tutte</i> le derivate, e qui si vede perché era stata chiesta così.</p>
  <p><b>Conseguenza, e non è una curiosità:</b> $T'$ è di nuovo una distribuzione, quindi si può derivare ancora, e così all&rsquo;infinito.
  $$\forall T\in\mathcal{D}'\ \ \forall k\in\mathbb{N}\ \ \exists\,T^{(k)}\in\mathcal{D}',\qquad \langle T^{(k)},\varphi\rangle=(-1)^{k}\langle T,\varphi^{(k)}\rangle.$$
  <b>Ogni distribuzione è derivabile infinite volte, e con essa ogni funzione localmente integrabile</b> — compresa una funzione con salti, con angoli, o continua e in nessun punto derivabile. Il prezzo è che la derivata non è più una funzione.</p>`},
  {t:'reveal', title:'Le tre regole che si usano, dimostrate', tag:'derivazione', steps:[
   {label:'Leibniz con una funzione liscia', body:R`
   <p>Una distribuzione non si moltiplica per un&rsquo;altra distribuzione, ma <b>si moltiplica per una funzione $\alpha\in C^{\infty}$</b>, ponendo $\langle\alpha T,\varphi\rangle=\langle T,\alpha\varphi\rangle$ — e ha senso perché $\alpha\varphi$ è ancora una funzione di prova. Per il prodotto vale Leibniz:
   $$(\alpha T)'=\alpha'T+\alpha T'.$$
   <b>Dimostrazione.</b> $\langle(\alpha T)',\varphi\rangle=-\langle\alpha T,\varphi'\rangle=-\langle T,\alpha\varphi'\rangle$. Ora $\alpha\varphi'=(\alpha\varphi)'-\alpha'\varphi$, quindi il tutto vale $-\langle T,(\alpha\varphi)'\rangle+\langle T,\alpha'\varphi\rangle=\langle T',\alpha\varphi\rangle+\langle\alpha'T,\varphi\rangle$. $\blacksquare$</p>`},
   {label:'La regola del salto, in generale', body:R`
   <p>Sia $f$ liscia a tratti, con un salto di ampiezza $s=f(a^{+})-f(a^{-})$ in $a$ e derivata ordinaria $\{f'\}$ altrove. Allora
   $$f'=\{f'\}+s\,\delta_a.$$
   <b>Dimostrazione.</b> $\langle f',\varphi\rangle=-\int f\varphi'=-\int_{-\infty}^{a}f\varphi'-\int_{a}^{\infty}f\varphi'$, e integrando per parti ciascun pezzo i termini di bordo in $a$ danno $f(a^{-})\varphi(a)$ e $-f(a^{+})\varphi(a)$... con i segni che si combinano in $s\,\varphi(a)$, mentre gli integrali rimasti danno $\int\{f'\}\varphi$. $\blacksquare$</p>
   <p><b>È la regola operativa più usata del movimento</b>: derivando una funzione regolare a tratti si ottiene la derivata ordinaria <i>più</i> una $\delta$ in ogni salto, di peso pari all&rsquo;ampiezza del salto. E applicata due volte spiega perché un <b>angolo</b> produce una $\delta$ nella derivata <i>seconda</i>: l&rsquo;angolo è un salto della pendenza.</p>`},
   {label:'Il valore principale, e la derivata di $\\log|x|$', body:R`
   <p>La funzione $1/x$ non è localmente integrabile in $0$, quindi $\int\frac{\varphi(x)}{x}dx$ non ha senso. Si definisce allora il <b>valore principale</b>
   $$\Big\langle\operatorname{p.v.}\tfrac1x,\varphi\Big\rangle=\lim_{\varepsilon\to0^{+}}\int_{|x|>\varepsilon}\frac{\varphi(x)}{x}\,dx,$$
   e il limite esiste perché i due lati si cancellano: su $|x|<1$ si scrive $\varphi(x)=\varphi(0)+x\psi(x)$ con $\psi$ liscia, e il termine con $\varphi(0)$ dà un integrale <b>dispari</b> che si annulla per simmetria, mentre $\int\psi$ converge.</p>
   <p>E allora, <b>in senso distribuzionale</b>,
   $$\big(\log|x|\big)'=\operatorname{p.v.}\tfrac1x.$$
   La derivata ordinaria di $\log|x|$ è $1/x$ dovunque tranne l&rsquo;origine, e il contenuto dell&rsquo;enunciato è che la regolarizzazione giusta — quella che rende il tutto una distribuzione — è proprio il valore principale, e non un&rsquo;altra. <b>Si noti anche che $x\cdot\operatorname{p.v.}\tfrac1x=1$</b>: moltiplicando per $x$ la singolarità sparisce, perché $x\cdot\frac{\varphi(x)}{x}=\varphi(x)$ e il limite diventa $\int\varphi$.</p>`}
  ]}
]},

/* ---------------- 04 · CONVERGENZA ---------------- */
{ num:'04', title:'Convergenza debole, e perche la delta non dipende dalla famiglia', meta:'la convergenza nei funzionali · i nuclei approssimanti · la derivata e continua, e per le funzioni no',
  blocchi:[
  {t:'prosa', title:'La nozione di limite giusta', tag:'grammatica', html:R`
  <p>Una successione di distribuzioni converge quando convergono i suoi <b>effetti</b>:
  $$T_n\to T\ \text{in}\ \mathcal{D}'\iff\forall\varphi\in\mathcal{D}\ \ \langle T_n,\varphi\rangle\to\langle T,\varphi\rangle.$$
  È la convergenza puntuale <i>dei funzionali</i>, e in analisi funzionale si chiama <b>debole-$*$</b>. Non chiede niente alle funzioni che eventualmente rappresentano le $T_n$: possono oscillare, divergere puntualmente, non avere limite in nessun senso ordinario.</p>
  <p><b>Un nucleo approssimante</b> è una famiglia $k_\varepsilon\ge0$ con $\int k_\varepsilon=1$ per ogni $\varepsilon$, e che concentra la massa: per ogni $\eta>0$, $\int_{|x|>\eta}k_\varepsilon\to0$. Allora $k_\varepsilon\to\delta$ in $\mathcal{D}'$, e la dimostrazione è tre righe:
  $$\int k_\varepsilon\varphi-\varphi(0)=\int k_\varepsilon\big(\varphi(x)-\varphi(0)\big)dx,$$
  si spezza in $|x|\le\eta$, dove $|\varphi(x)-\varphi(0)|$ è piccolo per continuità e $\int k_\varepsilon\le1$, e in $|x|>\eta$, dove $\varphi$ è limitata e $\int k_\varepsilon\to0$. $\blacksquare$</p>`},
  {t:'prosa', title:'Quattro famiglie, una sola delta', tag:'esempio', html:R`
  <p>Le quattro che compaiono in tutto il corso, tutte di integrale $1$ e tutte convergenti alla stessa $\delta$:</p>
  $$\frac{e^{-x^{2}/\varepsilon^{2}}}{\varepsilon\sqrt\pi},\qquad \frac{\varepsilon}{\pi(x^{2}+\varepsilon^{2})},\qquad \frac{1}{2\varepsilon}\mathbb{1}_{[-\varepsilon,\varepsilon]},\qquad \frac{\sin(nx)}{\pi x}.$$
  <p>La prima è la <b>gaussiana</b>, la seconda la <b>lorentziana</b> — che in fisica è il profilo di una riga spettrale naturale —, la terza il <b>rettangolo</b>, la quarta il <b>nucleo di Dirichlet</b>, che compare da sé nelle somme parziali di una serie di Fourier. <b>Che diano tutte lo stesso limite non è una coincidenza</b>: è il teorema qui sopra, e le tre ipotesi sono tutto ciò che serve.</p>
  <p><b>La lettura fisica, ed è il motivo per cui la $\delta$ si usa senza timore</b>: la forma dettagliata di una sorgente «puntiforme» o di un impulso «istantaneo» non conta, purché la sua larghezza sia piccola rispetto alle scale del problema. Due impulsi diversi ma entrambi stretti producono la stessa risposta. <b>La $\delta$ è l&rsquo;idealizzazione resa esatta</b>, e il teorema dice in che senso.</p>
  <div class="note"><b>La terza famiglia non è positiva, e vale la pena notarlo.</b> Il nucleo di Dirichlet $\frac{\sin(nx)}{\pi x}$ cambia segno infinite volte e il suo integrale <i>assoluto</i> diverge come $\log n$: non soddisfa l&rsquo;ipotesi $k_\varepsilon\ge0$. Converge lo stesso alla $\delta$, ma per un motivo più delicato — le oscillazioni si cancellano — ed è esattamente da lì che nasce il fenomeno di Gibbs. <b>Le ipotesi del teorema sono sufficienti, non necessarie</b>, e la differenza si paga quando si guarda la convergenza di una serie di Fourier vicino a un salto.</div>`},
  {t:'prosa', title:'Il guadagno vero: la derivata passa al limite', tag:'first principles', html:R`
  <p>Ecco la proprietà per cui tutta la costruzione vale la pena, e che in analisi ordinaria è <b>falsa</b>:
  $$T_n\to T\ \text{in}\ \mathcal{D}'\qquad\Longrightarrow\qquad T_n'\to T'\ \text{in}\ \mathcal{D}'.$$
  <b>Dimostrazione.</b> $\langle T_n',\varphi\rangle=-\langle T_n,\varphi'\rangle\to-\langle T,\varphi'\rangle=\langle T',\varphi\rangle$, e $\varphi'$ è una funzione di prova lecita. $\blacksquare$ <b>Una riga</b>, e la riga funziona perché la derivata è stata <i>scaricata</i> sulla funzione di prova, dove non fa danni.</p>
  <p><b>Per le funzioni questo è clamorosamente falso.</b> Le $f_n(x)=\frac{\sin(nx)}{n}$ convergono a zero uniformemente — l&rsquo;ampiezza va a zero — ma le derivate $f_n'(x)=\cos(nx)$ non convergono a niente, in nessun punto diverso dai multipli di $\pi$. Nel senso delle distribuzioni invece $\cos(nx)\to0$, perché $\int\cos(nx)\varphi(x)dx\to0$ per Riemann-Lebesgue: le oscillazioni si mediano via contro qualunque funzione di prova.</p>
  <p><b>Questo è il motivo tecnico per cui le distribuzioni hanno vinto</b>, e vale la pena dirlo in una frase: derivare e passare al limite <i>commutano</i>, e tutta l&rsquo;analisi delle equazioni differenziali è fatta di costruzioni in cui si vuole scambiare i due. Chi lavora con le funzioni deve dimostrare ogni volta che si può; chi lavora con le distribuzioni lo ha gratis.</p>`},
  {t:'plot', title:'Quattro famiglie diverse, lo stesso limite',
   intro:R`Gaussiana, lorentziana e rettangolo con la stessa larghezza $\varepsilon=0{,}35$: forme diverse, area $1$ per tutte, e lo stesso limite.`,
   plots:[
    {kind:'func2d', xr:[-1.6,1.6], yr:[-0.2,1.7], height:330,
     title:'tre nuclei approssimanti con eps = 0.35: aree uguali, forme diverse',
     curves:[
      {f:'exp(-x*x/0.1225)/(0.35*sqrt(PI))', col:'#5eead4', width:2, label:'gaussiana'},
      {f:'0.35/(PI*(x*x+0.1225))', col:'#4c8dff', width:2, label:'lorentziana'},
      {f:'(abs(x)<0.35)?1/0.7:0', col:'#b98cff', width:2, label:'rettangolo'}
     ]}
   ],
   leggi:R`<b>Che cosa guardare</b>: le tre curve hanno altezze e code molto diverse — la lorentziana ha code grasse che decadono come $1/x^{2}$, la gaussiana code sottilissime, il rettangolo nessuna coda e un salto. <b>Eppure contro qualunque funzione di prova danno lo stesso numero nel limite</b>, e il motivo è che la differenza fra loro vive dove $\varphi$ è ormai indistinguibile da $\varphi(0)$.<br><br>
   <b>E la coda conta, quando non si fa il limite</b>: a $\varepsilon$ finito la lorentziana pesa molto più lontano della gaussiana, ed è il motivo per cui in spettroscopia una riga lorentziana e una gaussiana della stessa larghezza a mezza altezza si distinguono benissimo nelle ali. <b>Il limite cancella la differenza; l&rsquo;approssimazione no.</b>`}
]},

/* ---------------- 05 · CIO CHE NON SI PUO FARE ---------------- */
{ num:'05', title:'Cio che non si puo fare: il prodotto, e perche delta al quadrato non esiste', meta:'il prodotto di due distribuzioni · la dimostrazione con il riscalamento · la convoluzione e quando ha senso',
  blocchi:[
  {t:'prosa', title:'Il prodotto non esiste, e non e una lacuna tecnica', tag:'trappola', html:R`
  <p>Si è visto che una distribuzione si moltiplica per una funzione $C^{\infty}$. <b>Due distribuzioni, in generale, non si moltiplicano</b>, e non perché nessuno ci abbia provato: perché un prodotto con le proprietà che ci si aspetta <i>non può esistere</i>.</p>
  <p><b>L&rsquo;argomento, per $\delta^{2}$.</b> Si supponga che $\delta\cdot\delta$ abbia senso come distribuzione e che il prodotto sia associativo e compatibile col riscalamento. Dal riscalamento $\delta(ax)=\frac{1}{|a|}\delta(x)$ segue
  $$\delta^{2}(ax)=\frac{1}{a^{2}}\delta^{2}(x),$$
  mentre per una distribuzione in una variabile il riscalamento può produrre al più un fattore $\frac{1}{|a|}$ moltiplicato per le derivate — e un oggetto che si riscala con $1/a^{2}$ dovrebbe essere $\frac{1}{|a|}\delta'$, che però è dispari mentre $\delta^{2}$ dovrebbe essere pari. <b>Nessun oggetto soddisfa entrambe</b>. Un secondo argomento, più breve: $x\,\delta(x)=0$, quindi moltiplicando per $\delta$ e usando l&rsquo;associatività si avrebbe $0=\big(x\delta\big)\delta=x\big(\delta\cdot\delta\big)$, e un prodotto non nullo con questa proprietà non si costruisce.</p>
  <p><b>Perché questo conta, e molto, in fisica.</b> In teoria quantistica dei campi i campi sono distribuzioni, e le lagrangiane di interazione contengono <i>prodotti di campi nello stesso punto</i>. Quei prodotti non sono definiti, ed è l&rsquo;origine strutturale delle <b>divergenze ultraviolette</b>: la rinormalizzazione è, in buona parte, il mestiere di dare senso a un prodotto di distribuzioni. <b>Non è un problema di conti troppo grandi: è che l&rsquo;oggetto scritto non esiste.</b></p>`},
  {t:'prosa', title:'La convoluzione, che invece si puo fare quasi sempre', tag:'grammatica', html:R`
  <p>La <span class="str" data-str="delta-di-dirac">$\delta$</span> non si moltiplica per se stessa, ma si <b>convolve</b> con quasi tutto, e la convoluzione è l&rsquo;operazione che regge le applicazioni. Per funzioni, $(f*g)(x)=\int f(y)g(x-y)\,dy$; per distribuzioni si definisce per dualità, e <b>ha senso quando almeno una delle due ha supporto compatto</b> — la condizione serve a far sì che l&rsquo;integrale non raccolga contributi da infinito.</p>
  <p>Le due identità da tenere:</p>
  $$\delta*T=T,\qquad \delta_a*T=T(\cdot-a),$$
  <b>cioè la $\delta$ è l&rsquo;elemento neutro della convoluzione</b>, e la $\delta$ spostata trasla. E la derivata attraversa:
  $$(T*S)'=T'*S=T*S'.$$
  <p><b>Qui si vede a che cosa serviva tutto questo</b>: un sistema lineare e invariante per traslazioni è completamente descritto dalla sua risposta a una $\delta$, perché ogni ingresso si scrive come $f=\delta*f$ e la risposta è la convoluzione con la risposta impulsiva. <b>«Risolvere per una sorgente puntiforme e poi sovrapporre» è esattamente questa frase</b>, e la nozione di funzione di Green ne è la realizzazione per gli operatori differenziali.</p>
  <div class="note"><b>Il supporto, e perché è la condizione giusta.</b> Il supporto di una distribuzione è il complementare del più grande aperto su cui si annulla; quello di $\delta$ è $\{0\}$, un solo punto. La convoluzione di due distribuzioni a supporto illimitato può non avere senso per la stessa ragione per cui $\int_{\mathbb{R}}1\cdot1$ non ce l&rsquo;ha: non c&rsquo;è niente che spenga l&rsquo;integrale all&rsquo;infinito. Con un supporto compatto da una parte, l&rsquo;integrale è su un insieme limitato e il problema sparisce.</div>`}
]},
/* ---------------- 06 · ESERCIZI ---------------- */
{ num:'06', title:'Esercizi — tocca a te', meta:'Green con $\\delta^{\\prime}$ · trasformata con chiusura di contorno · derivata distribuzionale',
  blocchi:[
  {t:'esercizio', title:'Derivata distribuzionale di una funzione a tratti',
   src:'esercizio guidato',
   testo:R`Calcolare, in senso distribuzionale, la derivata prima e seconda di $f(x)=|x|$ e di $g(x)=e^{-|x|}$.`,
   steps:[
    {label:'$|x|$', body:R`<p>$f'=\mathrm{sgn}(x)$ (derivata ordinaria, nessun salto in $f$: è continua). Poi $\mathrm{sgn}=2H-1$, quindi $f''=2\delta$. <b>L&rsquo;angolo produce una $\delta$ nella derivata seconda</b>, con peso pari al salto della pendenza ($+1-(-1)=2$).</p>`},
    {label:'$e^{-|x|}$', body:R`<p>$g'=-\mathrm{sgn}(x)e^{-|x|}$ (continua a tratti, con salto $-1-(+1)=-2$ in $0$). Quindi
    $$g''=e^{-|x|}-2\delta(x),$$
    dove il primo pezzo è la derivata ordinaria e il secondo viene dal salto. Riscritto: $\ -g''+g=2\delta$. $\blacksquare$</p>
    <div class="note">Quindi $\frac12e^{-|x|}$ è la <b>funzione di Green</b> dell&rsquo;operatore $-\frac{d^2}{dx^2}+1$ su tutta la retta. In fisica è il <b>potenziale di Yukawa</b> in una dimensione: il termine di massa nell&rsquo;operatore diventa il decadimento esponenziale della risposta. È lo stesso conto che, in tre dimensioni, dà $\frac{e^{-mr}}{4\pi r}$.</div>`}
   ]},
  {t:'collaudo', title:'Diagnostica rapida', items:[
   {q:R`$\int_{-\infty}^{+\infty}\delta(x^2-4)\,x^2\,dx$?`,
    a:R`$\delta(x^2-4)=\frac{1}{|2x|}\big[\delta(x-2)+\delta(x+2)\big]=\frac14\big[\delta(x-2)+\delta(x+2)\big]$. Quindi l&rsquo;integrale vale $\frac14(4+4)=2$. <b>Errore tipico:</b> dimenticare il fattore $1/|g'(x_k)|$ e rispondere $8$.`},
   {q:R`Perché la soluzione dell&rsquo;equazione del calore è liscia anche partendo da un dato iniziale discontinuo, mentre quella delle onde no?`,
    a:R`Perché il calore smorza il modo $n$ come $e^{-\alpha n^2t}$: per $t\gt0$ le alte frequenze — quelle che costruiscono le discontinuità — sono <b>schiacciate</b>, e la somma diventa $C^\infty$ (regolarizzazione istantanea). Le onde invece moltiplicano i modi per $\cos,\sin$: <b>i moduli restano invariati</b>, quindi le irregolarità non si perdono, viaggiano. È lo stesso fatto visto nel nucleo me-10 (decadimento dei coefficienti = regolarità), qui in evoluzione temporale — e la ragione per cui il calore non si può integrare all&rsquo;indietro nel tempo.`}
  ]}
]},

/* ---------------- 07 · SENSO E ROTTE ---------------- */
{ num:'07', title:'Il senso e le rotte fisiche', meta:'l’oggetto giusto non è la funzione, è il funzionale',
  blocchi:[
  {t:'prosa', title:'Cosa hai davvero imparato', tag:'sintesi', html:R`
  <p><b>A monte.</b> Il nucleo 10 aveva tolto il valore puntuale; qui quel prezzo si rivela un guadagno: rinunciando alle funzioni si ottengono oggetti derivabili infinite volte e trasformabili sempre. Fourier del nucleo me-10 (serie, dominio limitato) diventa trasformata (retta intera, spettro continuo); le EDO del nucleo 06 riappaiono come i pezzi separati di una EDP; i <span class="str" data-str="residuo">residui</span> del nucleo me-04 sono lo strumento con cui si antitrasforma.</p>
  <p><b>Il punto.</b> Tre idee che d&rsquo;ora in poi useranno tutti i corsi di fisica teorica: <b>(1)</b> la sorgente puntiforme come oggetto legittimo, <b>(2)</b> Fourier che trasforma la derivazione in moltiplicazione, <b>(3)</b> la risposta di un sistema lineare come <b>convoluzione con la sua Green</b>.</p>
  <p><b>A valle.</b> Il nucleo me-07 riformula tutto in linguaggio di operatori (la Green diventa $\mathcal{L}^{-1}$, e si scrive nella base spettrale); il nucleo me-11 applica il metodo alle tre EDP archetipe.</p>`},
  {t:'prolessi', title:'Dove riappare questo nucleo, nella fisica che farai',
   oggetto:R`<b>La distribuzione</b> ($\delta$, $\delta^{\prime}$), la <b>trasformata di Fourier</b> e la <b>funzione di Green</b> come risposta all&rsquo;impulso.`,
   rotte:[
    {dove:'Elettromagnetismo', txt:R`Una carica puntiforme è $\rho=q\delta^3(\mathbf r)$, e il potenziale coulombiano $\frac{1}{4\pi\varepsilon_0 r}$ è la <b>Green del laplaciano</b>: $-\Delta\frac{1}{4\pi r}=\delta^3$. Ogni distribuzione di carica si risolve per sovrapposizione — cioè per convoluzione con quella Green. Il dipolo, non a caso, è una $\delta^{\prime}$.`},
    {dove:'Meccanica<br>quantistica', txt:R`Gli stati del continuo si normalizzano con $\langle x|x'\rangle=\delta(x-x')$, le onde piane vivono nelle temperate, e $\hat x,\hat p$ sono coniugati <b>di Fourier</b>: l&rsquo;indeterminazione è la proprietà della trasformata vista nella tappa 02. Il <b>propagatore</b> è la Green dell&rsquo;equazione di Schrödinger.`},
    {dove:'Risposta lineare', txt:R`Un sistema lineare invariante nel tempo è completamente descritto dalla sua <b>risposta all&rsquo;impulso</b> $G(t)$: $u=G*f$. In frequenza diventa un prodotto, $\hat u=\hat G\hat f$, e $\hat G$ è la <b>suscettività</b> — la stessa funzione analitica del nucleo me-02 (Kramers–Kronig). Tre nuclei, un solo oggetto.`},
    {dove:'Teoria<br>dei campi', txt:R`I <b>propagatori</b> sono le funzioni di Green dell&rsquo;operatore cinetico, le linee interne dei diagrammi di Feynman <b>sono</b> Green, e i vertici sono $\delta$ che impongono la conservazione dell&rsquo;impulso. Il formalismo perturbativo è, tecnicamente, un&rsquo;algebra di convoluzioni.`}
   ],
   domanda:R`L&rsquo;equazione del calore <b>liscia</b> e non si può invertire nel tempo; quella delle onde no. Eppure entrambe descrivono sistemi fatti di particelle la cui dinamica microscopica è <b>reversibile</b>. La freccia del tempo, in questo linguaggio, entra quando si passa dai gradi di libertà microscopici a una descrizione ridotta — e si manifesta come uno <b>smorzamento delle alte frequenze</b>. <b>Domanda che porti avanti:</b> l&rsquo;irreversibilità è una proprietà dell&rsquo;equazione effettiva o della <i>scelta</i> di quali modi osservare? La decoerenza dice: le informazioni non si distruggono, migrano in modi che non guardiamo — cioè nelle alte frequenze dell&rsquo;ambiente. Se è così, l&rsquo;equazione del calore non è un&rsquo;approssimazione sbagliata della meccanica: è la meccanica <b>proiettata</b> sui modi che un osservatore può risolvere. Il nucleo me-07 ti darà il linguaggio dei proiettori per formularlo con precisione.`}
]}

];


/* =================================================================== */
var byId = {}; TAPPE.forEach(function(s){ byId[s.num]=s; });

var VKEY='pm-nucleome-09-visited';
function loadSeen(){ try{ return new Set(JSON.parse(localStorage.getItem(VKEY)||'[]')); }catch(e){ return new Set(); } }
function saveSeen(s){ try{ localStorage.setItem(VKEY, JSON.stringify(Array.from(s))); }catch(e){} }
var SEEN = loadSeen();

function renderNav(active){
  var nav=document.getElementById('sidebar');
  nav.innerHTML='';
  var h=document.createElement('h2'); h.textContent='Nucleo me-09 · le tappe'; nav.appendChild(h);
  TAPPE.forEach(function(s){
    var b=document.createElement('button');
    b.className='navitem'+(active===s.num?' active':'')+(SEEN.has(s.num)?' seen':'');
    b.innerHTML='<span class="dot"></span><span class="nx">'+s.num+'</span><span>'+s.title+'</span>';
    b.onclick=function(){ showTappa(s.num); };
    nav.appendChild(b);
  });
}

/* ---- renderer dei blocchi ---- */
function sectionProsa(title, tag, html){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var body=elFromHTML('<div class="open-body">'+html+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function sectionGram(title, rows){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag gramtag">grammatica</span></h3>';
  var inner='<table class="gramtab">';
  rows.forEach(function(r){ inner+='<tr><td class="gs">'+r[0]+'</td><td>'+r[1]+'</td></tr>'; });
  inner+='</table>';
  var body=elFromHTML('<div class="gramwrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
/* --- blocco PLOT: la figura non decora, si legge. Ogni plot porta una chiave di lettura. --- */
function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';
  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionSvelabile(title, tag, html, sol){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var c=document.createElement('div'); c.className='collaudo-item';
  var q=document.createElement('div'); q.className='cq'; q.innerHTML=html||'';
  c.appendChild(q); typeset(q);
  if(sol){
    var a=document.createElement('div'); a.className='ca'; a.style.display='none';
    a.innerHTML='<b>Soluzione.</b> '+sol;
    var btn=document.createElement('button'); btn.className='reveal-btn small';
    btn.textContent='Rivela la soluzione';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a);
      btn.disabled=true; btn.classList.add('done'); btn.textContent='Soluzione rivelata'; };
    c.appendChild(btn); c.appendChild(a);
  }
  wrap.appendChild(c); return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    /* DUE SCHEMI, NON UNO — scoperto il 2026-10-06 provando le pagine vive. I movimenti
       scritti per primi (em-01..03, me-10b, i collaudi di gd-01..09 e di quattro em)
       usano una forma piu' semplice: `reveal` e `prolessi` con un solo `html`,
       `esercizio` e `collaudo` con `html` + `sol`. Il renderer ne conosceva una sola e
       chiamava `steps.forEach` su `undefined`: TypeError, e la tappa si fermava li' —
       62 blocchi in 17 movimenti su 74. Non si riscrive il contenuto per far contento
       il renderer: e' il renderer che deve leggere cio' che c'e'.
       E in fondo un ramo che NON muore: uno schema nuovo di domani deve far vedere un
       avviso in quella sezione, non spegnere la pagina sotto di se'. */
    try{
      if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
      else if(b.t==='prolessi') m.appendChild(b.rotte ? sectionProlessi(b)
                                   : sectionProsa(b.title,'prolessi',b.html));
      else if(b.t==='reveal')m.appendChild(b.steps ? sectionReveal(b.title,b.tag,b.steps)
                                   : sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='esercizio') m.appendChild(b.steps ? sectionEsercizio(b)
                                   : sectionSvelabile(b.title,'esercizio',b.html,b.sol));
      else if(b.t==='collaudo')  m.appendChild(b.items ? sectionCollaudo(b.title,b.items)
                                   : sectionSvelabile(b.title,'provi, poi riveli',b.html,b.sol));
      else if(b.t==='plot')      m.appendChild(sectionPlot(b));
      else m.appendChild(sectionProsa(b.title||'(blocco)', 'tipo sconosciuto: '+b.t,
                                      b.html||''));
    }catch(err){
      var avv=document.createElement('section'); avv.className='section';
      avv.innerHTML='<h3>'+(b.title||'(blocco)')+'<span class="tag">non reso</span></h3>'
        +'<p style="color:#ff6b6b">Questo blocco non si &egrave; potuto rendere ('
        +b.t+': '+err.message+'). Il resto della tappa continua sotto.</p>';
      m.appendChild(avv);
    }
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* I POP-UP DEGLI STRUMENTI. `cablaStrumenti` esisteva dal 18-09 e non la chiamava
     nessuno: i 229 rimandi del percorso erano <span> senza handler, e il clic non
     faceva niente. Nessun controllo poteva vederlo — la sintassi era valida, le schede
     c'erano tutte, le formule rendevano: il guasto esisteva solo a pagina viva. Qui, e
     dopo ogni inserimento successivo, perche' la tappa si rimonta da capo a ogni
     cambio e gli handler vanno riattaccati al DOM nuovo. */
  cablaStrumenti(m);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}

/* deep-link: 15-distribuzioni.html#03 apre direttamente la tappa 03 */
window.addEventListener('DOMContentLoaded', function(){
  var h=(location.hash||'').replace('#','');
  showTappa(byId[h]?h:'00');
});
window.addEventListener('hashchange', function(){
  var h=(location.hash||'').replace('#','');
  if(byId[h]) showTappa(h);
});
</script>
