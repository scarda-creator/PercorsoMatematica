<style>
  :root{
    --bg:#0e1117; --panel:#161b22; --panel2:#1c232d; --border:#2b333d;

  .str{color:var(--gram);border-bottom:1px dashed var(--gram);cursor:pointer;}

<script>
"use strict";
const R = String.raw;

function typeset(el){
  if(el && window.renderMathInElement){
    try{ renderMathInElement(el,{delimiters:[
      {left:'$$',right:'$$',display:true},
      {left:'$',right:'$',display:false}
    ],throwOnError:false}); }catch(e){}
  }
}
function elFromHTML(html){ var d=document.createElement('div'); d.innerHTML=html; return d; }

/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un
   rimando scritto nella prosa:

       <span class="str" data-str="serie-geometrica">la serie geometrica</span>

   Le schede citate da questo nucleo sono cucite qui sotto dal montaggio
   (assembla-nucleo.js): la pagina resta autosufficiente — niente fetch,
   niente sottocartelle da pubblicare — e un rimando a una scheda che non
   esiste FERMA la costruzione invece di arrivare in pagina rotto.
   Apertura: lo stesso gesto del collaudo (si clicca, il pannello compare,
   si typeset una volta sola), portato dentro la frase.
   =================================================================== */
var CORSO = 'astrofisica';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["ordini-di-grandezza"] = {"nome":"Ordini di grandezza","riga":"Stimare una quantità alla potenza di dieci giusta: si tiene una cifra significativa, si sommano e si sottraggono gli esponenti, e si controlla che l'unità del risultato sia quella che si voleva.","serve":"A sapere se un risultato è plausibile prima di averlo calcolato con precisione, e ad accorgersi di un errore di impostazione quando c'è ancora tempo per rimediare. In astrofisica non è una comodità ma il modo normale di ragionare, per due ragioni: le grandezze in gioco vanno da $10^{-36}$ kg a $10^{53}$ kg e nessuna intuizione le copre, e i dati osservativi sono noti al dieci o al venti per cento, quindi una cifra significativa è spesso tutto ciò che il problema contiene davvero. Il controllo che smaschera più errori non è sul numero, è sull'**unità**: un conto che dovrebbe dare una densità e dà dei kg è sbagliato nell'impostazione, e nessun affinamento dell'aritmetica lo salverà. La seconda regola è il confronto con un termine noto — l'acqua per una densità, il Sole per una massa o una luminosità, il parsec per una distanza galattica — perché un numero senza metro non dice niente.","esempio":"Densità media del Sole, dalle due sole quantità stampate in calce al foglio d'esame, $M_\\odot=1{,}989\\cdot10^{30}$ kg e $R_\\odot=6{,}957\\cdot10^{8}$ m: $\\rho=\\dfrac{3M_\\odot}{4\\pi R_\\odot^{3}}=1410\\ \\mathrm{kg/m^3}$. Il confronto è immediato e istruttivo: è quasi una volta e mezza l'acqua, cioè il Sole è in media meno denso della Terra — una stella non è un sasso grande, è un gas tenuto insieme dal proprio peso.","pieno":{"file":"as-01-la-scala-del-cosmo.html","tappa":"01","come":"la gerarchia delle strutture cosmiche letta come scala di ordini di grandezza, e il tempo di luce come secondo asse della stessa tabella"},"controllo":[{"tipo":"numero","espr":"3*1.989e30/(4*pi*(6.957e8)**3)","vale":"1410","dove":"esempio","appare":"1410"}]};
STRUM["elettronvolt"] = {"nome":"Elettronvolt","riga":"L'energia che un elettrone acquista attraversando una differenza di potenziale di un volt: $1\\ \\mathrm{eV}=1{,}602\\cdot10^{-19}$ J; divisa per $c^{2}$ è una massa, $1\\ \\mathrm{eV}/c^{2}=1{,}783\\cdot10^{-36}$ kg.","serve":"A leggere senza conversioni le tabelle in cui la fisica delle particelle e l'astrofisica scrivono le masse a riposo come energie — l'elettrone 0,511 MeV, il protone 938 MeV, il bosone di Higgs 125 GeV. La scelta non è una bizzarria di notazione: in un processo la quantità che si conserva è l'energia, e scrivere la massa già in energia dice a colpo d'occhio quali reazioni sono possibili e quante ne resta per l'energia cinetica o per i fotoni. L'elettronvolt ha anche un secondo mestiere, e in astrofisica è il più usato dei due: convertito in temperatura tramite $k_BT$ dà la scala termica a cui un processo di quella energia diventa frequente, e questo è ciò che permette di dire a che punto della storia dell'universo o a che profondità di una stella un certo processo si accende.","esempio":"Dalla massa del protone espressa come energia, $938{,}3$ MeV, si ricavano i chilogrammi in un passaggio: $m_p=938{,}3\\cdot10^{6}\\cdot1{,}783\\cdot10^{-36}=1{,}673\\cdot10^{-27}$ kg, che è il valore stampato in calce al foglio d'esame. Sul versante termico, $T=\\dfrac{1{,}602\\cdot10^{-19}}{1{,}381\\cdot10^{-23}}=11600$ K: un'energia di un elettronvolt corrisponde a poco più di undicimila kelvin, e siccome ionizzare l'idrogeno costa 13,6 eV si capisce subito perché serva una fotosfera da qualche decina di migliaia di kelvin per trovarlo ionizzato.","pieno":{"file":"as-01-la-scala-del-cosmo.html","tappa":"05","come":"le masse delle particelle elementari scritte come energie, con la conversione in chilogrammi e la gerarchia delle masse, nel movimento sulla scala del cosmo"},"controllo":[{"tipo":"numero","espr":"1.602177e-19/(2.99792458e8)**2*1e36","vale":"1.783","dove":"riga","appare":"1,783\\cdot10^{-36}"},{"tipo":"numero","espr":"938.3e6*1.783e-36*1e27","vale":"1.673","dove":"esempio","appare":"1,673\\cdot10^{-27}"},{"tipo":"numero","espr":"1.602e-19/1.381e-23","vale":"11600","dove":"esempio","appare":"11600"}]};
STRUM["parsec-e-parallasse"] = {"nome":"Parsec e parallasse","riga":"Il parsec è la distanza da cui il raggio dell'orbita terrestre è visto sotto un secondo d'arco: $1\\ \\mathrm{pc}=1\\,\\mathrm{UA}/1''=3{,}086\\cdot10^{16}$ m, e la distanza di una stella in parsec è l'inverso della sua parallasse in secondi d'arco.","serve":"A non portare mai un fattore di conversione a memoria. La definizione è geometrica e si ricostruisce in due righe: se $p$ è l'angolo sotto cui dalla stella si vede il semiasse maggiore dell'orbita terrestre, per angoli piccoli $p=R_{\\text{UA}}/d$, e scegliendo l'unità di distanza in modo che $p=1''$ corrisponda a $d=1$ si ottiene $d[\\mathrm{pc}]=1/p['']$. Il parsec non è un'unità più «astronomica» dell'anno luce: è l'unità in cui la misura che si fa davvero — un angolo — diventa direttamente una distanza, senza nessun conto intermedio. Nelle prove scritte di Astrofisica il valore $1\\ \\mathrm{pc}=3{,}086\\cdot10^{16}$ m è stampato in calce al foglio fra i dati: ciò che va saputo è l'inversione, non il numero.","esempio":"La stella più vicina, Proxima Centauri, ha parallasse $p=0{,}7687''$. Quindi $d=1/0{,}7687=1{,}301$ pc, e in anni luce $d=3{,}26/0{,}7687=4{,}24$ anni luce. Il controllo di coerenza è immediato: una parallasse inferiore al secondo d'arco vuol dire per forza una distanza superiore al parsec, e se il conto dà il contrario è stata invertita la frazione.","pieno":{"file":"as-01-la-scala-del-cosmo.html","tappa":"02","come":"la derivazione del parsec dalla parallasse annua e le conversioni fra unità astronomica, anno luce e parsec, nel movimento sulla scala del cosmo"},"controllo":[{"tipo":"numero","espr":"1.496e11/(pi/648000)/1e16","vale":"3.086","dove":"riga","appare":"3,086\\cdot10^{16}"},{"tipo":"numero","espr":"1/0.7687","vale":"1.301","dove":"esempio","appare":"1,301"},{"tipo":"numero","espr":"3.26/0.7687","vale":"4.24","dove":"esempio","appare":"4,24"},{"tipo":"numero","espr":"1.496e11/(pi/648000)/1e16","vale":"3.086","dove":"serve","appare":"3,086\\cdot10^{16}"}]};

function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';
  return h;
}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

/* ===================================================================
   >>> CONTENUTO — Nucleo as-16: FRW, Friedmann e i parametri cosmologici: una funzione, un’equazione, tre densità <<<

/* ---------------- 00 · PERCHÉ QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Perché questo movimento: il conto più chiesto della cosmologia', meta:'una funzione incognita · tre densità, tre leggi · l’età e l’orizzonte come integrali',
  blocchi:[
  {t:'prosa', title:'Che cosa resta da determinare', tag:'architettura', html:R`
  <p>Il principio cosmologico riduce la geometria dell&rsquo;universo a una metrica con una sola funzione incognita, il fattore di scala $a(t)$, e una costante, il segno della curvatura $k$. Questo movimento scrive l&rsquo;equazione che determina $a(t)$, l&rsquo;equazione di Friedmann,</p>
  <p>$$\left(\frac{\dot a}{a}\right)^2=\frac{8\pi G}{3}\rho-\frac{kc^2}{a^2},$$</p>
  <p>e la usa per rispondere alle domande che le prove pongono più spesso di tutte le altre del corso: quanti anni ha l&rsquo;universo, com&rsquo;era il fattore di scala a una data epoca, quanto era grande la regione causalmente connessa. La mappa del corso conta 35 prove su 60 che toccano questa materia, ed è esplicita sul conto tipico: <i>integrare Friedmann in un regime dominante, materia, radiazione o costante cosmologica, e trovare età o fattore di scala</i>.</p>
  <p>L&rsquo;architettura è semplice. Le componenti dell&rsquo;universo, radiazione, materia e costante cosmologica, si diluiscono con l&rsquo;espansione con leggi diverse, $a^{-4}$, $a^{-3}$ e $a^0$; a ogni epoca ne domina una, e nell&rsquo;equazione di Friedmann ne sopravvive un solo termine, che si integra a mano. Così la storia dell&rsquo;universo si divide in fasi, con $a\propto t^{1/2}$, poi $t^{2/3}$, poi una crescita esponenziale, e i passaggi tra una fase e l&rsquo;altra sono le epoche caratteristiche. L&rsquo;età e l&rsquo;orizzonte sono integrali di $1/\dot a$ su queste fasi.</p>
  <p>L&rsquo;ordine è quello delle lezioni 17-21 di de Bernardis. Prima la derivazione newtoniana, che dà l&rsquo;equazione giusta per la ragione sbagliata, e poi la sua lettura relativistica, con la seconda equazione e la continuità. Seguono il censimento delle densità, le fasi, l&rsquo;età, gli orizzonti e i due paradossi che l&rsquo;inflazione è chiamata a risolvere. Chiude un copione dell&rsquo;orale. Gli strumenti di calcolo sono gli <span class="str" data-str="ordini-di-grandezza">ordini di grandezza</span> cosmologici, l&rsquo;<span class="str" data-str="elettronvolt">elettronvolt</span> come unità di energia, e il <span class="str" data-str="parsec-e-parallasse">parsec</span>.</p>`}
]},

/* ---------------- 01 · LA DERIVAZIONE NEWTONIANA ---------------- */
{ num:'01', title:'L’equazione giusta per la ragione sbagliata: Friedmann alla Newton', meta:'un guscio di massa m · ρr³ costante · l’energia diventa curvatura · densità critica e Ω',
  blocchi:[
  {t:'prosa', title:'Un guscio in un universo omogeneo', tag:'la derivazione di lezione', html:R`
  <p>De Bernardis, nella lezione 17 del 2020 (e nella 18 del 2017), vuole <i>«studiare la dinamica di un universo omogeneo e isotropo, e legarla alle osservazioni, prima fra tutte quella dell&rsquo;espansione cosmica»</i>, e comincia da un universo riempito di materia con densità uniforme $\rho$. Si scelga un punto O qualunque, che per l&rsquo;omogeneità è buono come ogni altro, e si consideri un guscio sferico sottile di massa $m$ a distanza $r$. Per il teorema di Gauss, applicato a una distribuzione a simmetria sferica, sul guscio agisce solo la massa interna $M=\frac43\pi r^3\rho$: <i>«la massa esterna a r, infinitamente estesa, non dà nessun effetto»</i>. L&rsquo;energia del guscio si conserva:</p>
  <p>$$E=\frac12m\dot r^2-\frac{GMm}{r} .$$</p>
  <p>Il guscio e la massa interna <i>«partecipano alla stessa espansione, quindi M non cambia, cioè $\rho r^3$ = costante»</i>. Dividendo per $\frac12mr^2$ e sostituendo $M$:</p>
  <p>$$\left(\frac{\dot r}{r}\right)^2=\frac{8\pi G}{3}\rho+\frac{2E}{mr^2} .$$</p>
  <p>De Bernardis chiama $2E/m=-kc^2$, e la dinamica dipende dal segno di $k$, cioè dell&rsquo;energia: per $k\gt 0$ l&rsquo;energia è negativa e il guscio a un certo punto si ferma e ricade, come un proiettile lanciato sotto la velocità di fuga; per $k\lt 0$ si espande per sempre; per $k=0$ si espande con velocità che tende a zero, esattamente alla velocità di fuga.</p>`},
  {t:'prosa', title:'Il fattore di scala e la densità critica', tag:'la riscrittura', html:R`
  <p>Siccome l&rsquo;espansione è globale, si fattorizzano le distanze fisiche in una parte costante, la distanza comovente $\chi$, e una parte che dipende dal tempo ed è la stessa per tutti, il fattore di scala, normalizzato a 1 oggi: $r(t)=a(t)\chi$. Allora $\dot r/r=\dot a/a=H$, e la legge di Hubble è $\dot r=Hr$. Sostituendo, con $k$ ridefinito in modo che assorba $\chi$, si ottiene l&rsquo;equazione di Friedmann,</p>
  <p>$$H^2=\left(\frac{\dot a}{a}\right)^2=\frac{8\pi G}{3}\rho-\frac{kc^2}{a^2} .$$</p>
  <p>Valutata oggi, $H_0^2=\frac{8\pi G}{3}\rho_0-kc^2$. Se $k=0$ la densità di oggi ha un valore preciso, la <b>densità critica</b>:</p>
  <p>$$\rho_{c,0}=\frac{3H_0^2}{8\pi G} .$$</p>
  <p>Con $H_0=70$ km/s/Mpc $=2{,}27\cdot10^{-18}$ s$^{-1}$, $\rho_{c,0}=9{,}2\cdot10^{-27}$ kg/m$^3$: <span class="str" data-str="ordini-di-grandezza">cinque protoni e mezzo per metro cubo</span>, o, in unità astronomiche, $1{,}36\cdot10^{11}\,M_\odot$ per Mpc$^3$. Il rapporto $\Omega_0=\rho_0/\rho_{c,0}$ è il <b>parametro di densità</b>, e l&rsquo;equazione di oggi si riscrive</p>
  <p>$$k=\frac{H_0^2}{c^2}(\Omega_0-1),$$</p>
  <p>con $k\gt 0$, $=0$, $\lt 0$ secondo che $\Omega_0$ sia maggiore, uguale o minore di 1: universo chiuso, piatto, aperto.</p>`},
  {t:'prosa', title:'Che cosa c’è di sbagliato, e perché il risultato è giusto', tag:'avvertenza', html:R`
  <p>La derivazione ha due punti deboli. Il primo è che in un universo infinito e omogeneo la scelta di O come centro è arbitraria e la gravità newtoniana di una distribuzione infinita non è ben definita: il teorema di Gauss si applica solo se si assume che le shell esterne, per simmetria, non contribuiscano. Il secondo è che $k$ qui è un&rsquo;energia, non una curvatura, e non si capisce perché la stessa costante dovrebbe descrivere la geometria. De Bernardis lo dice: <i>«il vantaggio, rispetto alla nostra derivazione newtoniana, è che in questo contesto è chiaro il significato di k»</i>. Quando Friedmann inserì la metrica di Robertson-Walker nelle equazioni di Einstein, che collegano la curvatura dello spazio-tempo alla massa-energia presente, ottenne esattamente la stessa equazione, con $k$ la costante di curvatura spaziale della metrica. Il risultato newtoniano è giusto perché su scale piccole rispetto all&rsquo;orizzonte la relatività generale si riduce alla gravità di Newton, e la sfera di raggio $r$ si può prendere piccola quanto si vuole.</p>
  <p>Ma la relatività aggiunge una cosa che Newton non può dare: <i>«secondo la relatività generale, tutte le forme di massa-energia contribuiscono a gravitare, cioè a determinare la metrica»</i>, e anche la pressione gravita. È ciò che serve per la radiazione e per la costante cosmologica.</p>`},
  {t:'prosa', title:'Che cosa giustifica il conto newtoniano, secondo Marconi', tag:'Marconi, cap. 1 e 6.2, pp. 3-4 e 77-79', html:R`
  <p>Marconi apre la cosmologia con due avvertenze che spiegano perché un modello così semplice regge. La prima: <i>«l&rsquo;Universo è unico»</i>, le misure non si ripetono su altri sistemi, e si osserva solo lungo il proprio cono di luce passato, $|\vec x|=c(t_0-t)$; a 10 miliardi di anni luce le galassie si vedono quando l&rsquo;universo aveva meno di un terzo dell&rsquo;età attuale, nel modello di oggi $(13{,}8-10)/13{,}8=0{,}28$. Con così poche informazioni l&rsquo;universo si capisce solo se è molto semplice, <i>«e fortunatamente sembra proprio che sia così»</i>. La seconda riguarda l&rsquo;errore del conto newtoniano: il teorema di Gauss è applicato a una massa infinita, ignorando le condizioni all&rsquo;infinito. Funziona perché, per omogeneità e isotropia, <i>«la fisica locale (della galassia G) è uguale alla fisica globale»</i>: la curvatura $k$ è la stessa su scale di un metro come su tutto l&rsquo;universo, e l&rsquo;osservatore al centro della sfera non è privilegiato, perché ogni altro osservatore farebbe lo stesso conto.</p>
  <p>Marconi dà poi la densità critica in unità pratiche, $\rho_c=3H_0^2/(8\pi G)=1{,}88\cdot10^{-29}h^2$ g/cm$^3$, cioè $1{,}88\cdot10^{-29}\cdot0{,}7^2=9{,}21\cdot10^{-30}$ g/cm$^3$ per $h=0{,}7$, circa cinque atomi di idrogeno per metro cubo. Le soluzioni furono trovate da Friedmann nel 1922-24; la forma che la relatività generale aggiunge al conto newtoniano è il valore della costante di integrazione, $-c^2/R^2$, e il termine della costante cosmologica.</p>`}
]},

/* ---------------- 02 · LE TRE EQUAZIONI ---------------- */
{ num:'02', title:'Due equazioni e una continuità: come si diluiscono le densità', meta:'ρ̇ + 3H(ρ + p/c²) = 0 · l’accelerazione · una delle tre segue dalle altre due · w e le tre leggi',
  blocchi:[
  {t:'prosa', title:'La continuità dalla termodinamica', tag:'la terza equazione', html:R`
  <p>Per chiudere il sistema serve sapere come cambia $\rho$ con $a$. Un volume comovente $V\propto a^3$ contiene l&rsquo;energia $E=\rho c^2V$; l&rsquo;espansione è adiabatica, perché per omogeneità non c&rsquo;è flusso di calore da una regione all&rsquo;altra, e il primo principio dà $dE=-p\,dV$:</p>
  <p>$$\frac{d}{dt}\left(\rho c^2a^3\right)=-p\frac{d}{dt}a^3\quad\Longrightarrow\quad\dot\rho+3\frac{\dot a}{a}\left(\rho+\frac{p}{c^2}\right)=0 .$$</p>
  <p>È l&rsquo;equazione di continuità, che il Marconi scrive accanto alle due di Friedmann. Con un&rsquo;equazione di stato $p=w\rho c^2$, $w$ costante, si integra subito: $d\ln\rho/d\ln a=-3(1+w)$, cioè</p>
  <p>$$\rho\propto a^{-3(1+w)} .$$</p>
  <p>Le tre componenti delle lezioni di de Bernardis sono tre valori di $w$. La materia non relativistica ha pressione trascurabile, $w=0$: <i>«il numero di particelle si conserva, quindi $\rho(t)$ va come $1/a(t)^3$»</i>. La radiazione ha $p=\rho c^2/3$, $w=1/3$, e va come $a^{-4}$: tre potenze dalla diluizione dei fotoni nel volume, una dal redshift dell&rsquo;energia di ciascuno. La costante cosmologica è <i>«una forma di densità di energia indipendente dal tempo, che quindi non si diluisce con l&rsquo;espansione»</i>: $\rho$ costante richiede $w=-1$, cioè una pressione negativa $p=-\rho c^2$. Un volume che si espande in presenza di pressione negativa guadagna energia, e la densità resta costante.</p>`},
  {t:'prosa', title:'L’equazione dell’accelerazione, e quale delle tre è ridondante', tag:'la seconda equazione', html:R`
  <p>Si moltiplichi Friedmann per $a^2$: $\dot a^2=\frac{8\pi G}{3}\rho a^2-kc^2$, e si derivi rispetto al tempo, come fa de Bernardis nella lezione 19:</p>
  <p>$$2\dot a\ddot a=\frac{8\pi G}{3}\left(\dot\rho a^2+2\rho a\dot a\right).$$</p>
  <p>Sostituendo $\dot\rho$ dalla continuità, $\dot\rho a^2=-3a\dot a(\rho+p/c^2)$, il fattore $\dot a$ si semplifica e resta</p>
  <p>$$\frac{\ddot a}{a}=-\frac{4\pi G}{3}\left(\rho+\frac{3p}{c^2}\right).$$</p>
  <p>È la seconda equazione di Friedmann, o equazione dell&rsquo;accelerazione. La curvatura è sparita, e la pressione compare con peso tre: la radiazione frena il doppio della materia a parità di densità, e una componente con $p\lt -\rho c^2/3$ accelera. La costante cosmologica, con $\rho+3p/c^2=-2\rho$, dà $\ddot a/a=+\frac{8\pi G}{3}\rho_\Lambda$.</p>
  <p>Il conto mostra la cosa che l&rsquo;orale chiede di dire: <b>delle tre equazioni, Friedmann, accelerazione e continuità, una segue dalle altre due</b>. Si è appena ricavata la seconda dalla prima più la continuità; allo stesso modo la continuità segue dalle due equazioni di Friedmann, e la prima, a meno di una costante di integrazione che è proprio $k$, dalla seconda più la continuità. In relatività generale la continuità è la conservazione del tensore energia-impulso, che le equazioni di Einstein contengono già.</p>`},
  {t:'prosa', title:'Friedmann in unità critiche', tag:'la forma che si usa', html:R`
  <p>Sommando le componenti, ciascuna con la sua legge, e dividendo per la densità critica di oggi, l&rsquo;equazione prende la forma che de Bernardis le dà nella lezione 19:</p>
  <p>$$\left(\frac{\dot a}{a}\right)^2=H_0^2\left[\frac{\Omega_{R0}}{a^4}+\frac{\Omega_{M0}}{a^3}+\frac{\Omega_{K0}}{a^2}+\Omega_\Lambda\right],\qquad\Omega_{K0}=1-\Omega_0 .$$</p>
  <p>Il termine di curvatura si comporta come una componente con $w=-1/3$, che si diluisce come $a^{-2}$. A $a=1$ la parentesi vale $\Omega_{R0}+\Omega_{M0}+1-\Omega_0+\Omega_\Lambda=1$, come deve. Le quattro densità, in funzione di $a$, sono quattro rette in un grafico logaritmico con pendenze $-4$, $-3$, $-2$, $0$, ed è da quel grafico che si leggono le fasi.</p>`},
  {t:'plot', title:'Le densità contro il fattore di scala',
   intro:R`log₁₀(ρ/ρ_c,0) contro log₁₀ a per un universo piatto con Ω_R0 = 8,5·10⁻⁵, Ω_M0 = 0,3, Ω_Λ = 0,7. Le rette hanno pendenza −4 (radiazione, viola), −3 (materia, oro), 0 (costante cosmologica, ciano). I punti marcano le due equivalenze.`,
   plots:[
    {kind:'func2d', xr:[-6,0.5], yr:[-2,20], height:300, equal:false,
     title:'log₁₀ a      log₁₀ ρ/ρc₀',
     curves:[{f:'log(8.5e-5)/log(10)-4*x', col:'#b98cff', label:'radiazione ∝ a⁻⁴'},
             {f:'log(0.3)/log(10)-3*x', col:'#d8a13a', label:'materia ∝ a⁻³'},
             {f:'log(0.7)/log(10)', col:'#5eead4', label:'Λ costante'}],
     marks:[{x:-3.547, y:10.12, label:'radiazione = materia, z ≈ 3500', col:'#f87171', up:true},
            {x:-0.123, y:-0.155, label:'materia = Λ, z ≈ 0,33', col:'#f87171', up:true}]}
   ],
   leggi:R`<p><b>Che cosa guardare:</b> a sinistra della prima intersezione la radiazione domina tutto, tra le due intersezioni domina la materia, a destra della seconda la costante cosmologica. La curvatura, se ci fosse, sarebbe una retta di pendenza −2 che non domina mai finché Ω₀ è vicino a 1.</p>
   <p><b>Che cosa impararne:</b> qualunque sia la composizione di oggi, andando abbastanza indietro vince sempre la radiazione, perché la sua pendenza è la più ripida; andando abbastanza avanti vince sempre Λ. Ogni fase si integra con un solo termine, ed è per questo che i regimi dominanti sono il conto tipico.</p>`},
  {t:'prosa', title:'La continuità è il primo principio, e raffredda anche i moti', tag:'Marconi, cap. 6.1, pp. 73-77', html:R`
  <p>Marconi mostra che l&rsquo;equazione di continuità è il primo principio della termodinamica per una trasformazione adiabatica, $dU=-p\,dV$, con $U$ energia relativistica totale e $V\propto a^3$. Che l&rsquo;espansione sia adiabatica non è un&rsquo;ipotesi in più: se un volumetto avesse un flusso netto di calore, entrante o uscente, si creerebbero zone più dense e meno dense, <i>«violando l&rsquo;omogeneità e isotropia»</i> scritte nella metrica. Due conseguenze che il libro ricava e che servono all&rsquo;orale. Per un gas monoatomico non relativistico, l&rsquo;energia termica $\frac32NkT$ con $N\propto a^{-3}$ soddisfa la stessa equazione con $\gamma=5/3$, e dà</p>
  <p>$$T\propto a^{-3(\gamma-1)}=a^{-2},$$</p>
  <p>quindi la velocità termica va come $v\propto T^{1/2}\propto a^{-1}$: e lo stesso vale per le velocità peculiari delle galassie rispetto al flusso di Hubble, che l&rsquo;espansione smorza. Per i fotoni il numero va come $a^{-3}$ e l&rsquo;energia come $a^{-4}$, quindi l&rsquo;energia di ciascun fotone va come $a^{-1}$, $\nu\propto a^{-1}$: la relazione fra redshift e fattore di scala riappare come conseguenza della conservazione dell&rsquo;energia. Marconi nota infine che nell&rsquo;equazione dell&rsquo;accelerazione $\rho+3p/c^2$ si comporta come una densità di massa gravitazionale efficace.</p>`}
]},

/* ---------------- 03 · IL CENSIMENTO ---------------- */
{ num:'03', title:'Il censimento: quanto vale ciascun Ω', meta:'fotoni del fondo · neutrini · barioni visibili e no · materia oscura · Ω₀ ≈ 1 e la componente che manca',
  blocchi:[
  {t:'prosa', title:'Radiazione', tag:'Ω_R', html:R`
  <p>De Bernardis apre nella lezione 19 del 2017 l&rsquo;inventario con la componente relativistica. I fotoni più abbondanti sono quelli del fondo cosmico a microonde, con uno spettro di corpo nero molto preciso a $T_0=2{,}725$ K, cioè 411 fotoni per cm$^3$. La loro densità di energia è $u=aT_0^4$, con la costante di radiazione $a=7{,}566\cdot10^{-16}$ J m$^{-3}$ K$^{-4}$: $u=4{,}17\cdot10^{-14}$ J/m$^3$. Divisa per l&rsquo;energia critica $\rho_{c,0}c^2=8{,}27\cdot10^{-10}$ J/m$^3$ dà</p>
  <p>$$\Omega_{\gamma0}=\frac{aT_0^4}{\rho_{c,0}c^2}=5{,}04\cdot10^{-5},$$</p>
  <p>il $5{,}06\cdot10^{-5}$ della slide di de Bernardis (che usa costanti leggermente diverse). Il fondo a microonde domina di gran lunga gli altri fondi di fotoni: la sua energia è molto maggiore di quella emessa da tutte le stelle. Ai fotoni si sommano i neutrini, che de Bernardis descrive nella lezione 20: tre sapori più gli antineutrini, che a $T\gt 1$ MeV erano in equilibrio con il plasma e oggi formano un fondo freddo come quello dei fotoni. Con i neutrini $\Omega_{R0}=8{,}5\cdot10^{-5}$ per $h=0{,}7$. Le oscillazioni dicono che almeno due neutrini hanno massa, con $\Delta m^2\sim10^{-3}$ e $10^{-5}$ eV$^2$: oggi sono non relativistici e contano come materia, ma per masse sotto l&rsquo;<span class="str" data-str="elettronvolt">elettronvolt</span> il loro contributo resta piccolo.</p>`},
  {t:'prosa', title:'Materia barionica e materia oscura', tag:'Ω_M', html:R`
  <p>Per materia barionica si intende la materia ordinaria, protoni, neutroni ed elettroni. De Bernardis, nella lezione 20, ne fa una stima diretta. La densità di galassie brillanti è $n_{\rm gal}\approx0{,}005$ Mpc$^{-3}$, che vuol dire una distanza tipica tra galassie $n^{-1/3}=5{,}8$ Mpc, i 6 Mpc della slide; la densità di luminosità corrispondente è $j\approx10^8\,L_\odot$ Mpc$^{-3}$, e con $\langle M/L\rangle=3\,M_\odot/L_\odot$ per la parte visibile di una galassia la densità di massa visibile è $3\cdot10^8\,M_\odot$ Mpc$^{-3}$. Divisa per $\rho_{c,0}=1{,}36\cdot10^{11}\,M_\odot$ Mpc$^{-3}$:</p>
  <p>$$\Omega_{\rm vis}=\frac{3\cdot10^8}{1{,}36\cdot10^{11}}=0{,}0022,$$</p>
  <p>lo $0{,}002$ della slide. Ma i barioni non luminosi, polveri, gas interstellare e intergalattico, sono di più. La stima più robusta viene dalla nucleosintesi primordiale: confrontando le abbondanze di deuterio, elio e litio misurate dove le stelle non le hanno ancora alterate con quelle calcolate, si ottiene $\Omega_{B0}=0{,}04\pm0{,}01$, venti volte la parte visibile.</p>
  <p>La materia oscura si misura con la gravità. Nelle galassie, dalle curve di rotazione, è circa 10 volte la massa luminosa; negli ammassi, dal viriale e dalle lenti, circa 20 volte. <i>«A livello di universo ci aspettiamo $\Omega_{DM}=10$-$20\,\Omega_b=0{,}2$-$0{,}4$»</i>. De Bernardis aggiunge la ragione per cui deve essere non barionica: prima della ricombinazione i barioni erano accoppiati ai fotoni, e l&rsquo;isotropia del fondo a una parte su centomila dice che erano omogenei a quel livello; con perturbazioni così piccole e una crescita che nella fase di materia va al più come $a$, non si arriva alle galassie di oggi. Serve una componente che non senta la pressione dei fotoni e abbia cominciato a raggrumarsi prima. Il totale è $\Omega_{M0}=\Omega_{B0}+\Omega_{NB0}\approx0{,}3$.</p>`},
  {t:'prosa', title:'La somma, e la componente che manca', tag:'Ω_Λ', html:R`
  <p>La somma di quello che si è contato è $\Omega_{B0}+\Omega_{NB0}+\Omega_{R0}\approx0{,}04+0{,}3+0{,}0001$, cioè</p>
  <p>$$\Omega_{M0}+\Omega_{R0}=0{,}3+0{,}0001=0{,}30,$$</p>
  <p>dell&rsquo;ordine di $0{,}34$ nella contabilità della slide (che somma $0{,}04$ due volte, una dentro $\Omega_{M0}$ e una fuori). Se fosse tutto, l&rsquo;universo sarebbe aperto. Ma $\Omega_0$ si misura anche dalla geometria: la curvatura determina la dimensione angolare apparente delle strutture del fondo cosmico, e <i>«le misure di CMB hanno dimostrato che $\Omega_0$ è molto vicino a 1»</i>, $\Omega_0=1{,}02\pm0{,}02$. <i>«Deve davvero esistere una ulteriore componente»</i>, e la costante cosmologica vista nel diagramma di Hubble delle supernovae la fornisce: con $\Omega_0=1$, $\Omega_\Lambda=\Omega_0-\Omega_{M0}-\Omega_{R0}=0{,}66$ nei numeri della slide 37. La torta di de Bernardis nella lezione 20 dà materia ordinaria $4\%$, materia oscura $22\%$, energia oscura $74\%$, radiazione sotto lo $0{,}3\%$ (il valore vero è lo $0{,}01\%$; lo $0{,}3\%$ è il bordo del grafico). Due misure indipendenti, il diagramma di Hubble che vincola $\Omega_{M0}/2-\Omega_\Lambda$ e il fondo cosmico che vincola $\Omega_{M0}+\Omega_\Lambda$, si incrociano in un punto solo: $\Omega_{M0}\approx0{,}3$, $\Omega_\Lambda\approx0{,}7$.</p>
  <p>Resta $H_0$. De Bernardis, nella lezione 20, elenca le misure del primo decennio del secolo: Cefeidi con HST (key project) $72\pm8$, Sandage $57\pm4$, ritardi delle lenti gravitazionali $65\pm8$, effetto Sunyaev-Zeldovich $61\pm8\pm18$, fondo cosmico più supernovae $71{,}0\pm3{,}5$ km/s/Mpc, e poi Planck 2015 con $67{,}8\pm0{,}9$. <i>«Evidentemente ci sono ancora parecchi effetti sistematici, perché metodi indipendenti producono valori statisticamente non compatibili tra loro»</i>. Qui si usa 70.</p>`},
  {t:'prosa', title:'Il vuoto che pesa 10¹²⁰ volte troppo poco, e i vincoli osservativi', tag:'Marconi, cap. 6.3 e 8, pp. 83-86 e 117', html:R`
  <p>La costante cosmologica fu introdotta da Einstein nel 1917 per avere un universo statico, prima della scoperta di Hubble (Marconi scrive 1917 a pagina 77 e 1919 a pagina 83: è il 1917), e Lemaître nel 1933 suggerì di leggerla come energia del vuoto. Marconi riporta la stima di Carroll, Press e Turner: integrando le fluttuazioni dei campi quantistici fino all&rsquo;energia di Planck si ottiene un&rsquo;energia del vuoto <i>«circa $10^{120}$ volte»</i> più grande di quella osservata. Con i numeri di questo movimento la densità di Planck è $c^5/(\hbar G^2)=5{,}2\cdot10^{93}$ g/cm$^3$, quella della costante cosmologica $\Omega_\Lambda\rho_c=0{,}7\cdot9{,}21\cdot10^{-30}=6{,}4\cdot10^{-30}$ g/cm$^3$, e il rapporto è $8\cdot10^{122}$: l&rsquo;esponente dipende da dove si taglia l&rsquo;integrale, il fatto no. Marconi aggiunge che l&rsquo;inflazione richiederebbe proprio un vuoto di circa $10^{95}$ kg/m$^3$ nei primi istanti, e che resta da capire perché da allora sia sceso così tanto.</p>
  <p>Il censimento di Marconi è un elenco di vincoli indipendenti: $\Omega_0+\Omega_\Lambda\simeq1$ dalle fluttuazioni del fondo cosmico; $\Omega_0\simeq0{,}25$-$0{,}3$ dai moti delle galassie e dal lensing; $\Omega_b\simeq0{,}04$ dalla nucleosintesi, più precisamente $\Omega_bh^2=0{,}0223$, cioè $\Omega_b=0{,}0223/0{,}49=0{,}0455$ per $h=0{,}7$, troppo poco per spiegare $\Omega_0$; $\Omega_\Lambda\simeq0{,}7$ dalle supernovae se l&rsquo;universo è piatto; $t_0\gtrsim12$ miliardi di anni dagli ammassi globulari; $H_0\simeq74$ km/s/Mpc da Cefeidi e supernovae.</p>`}
]},

/* ---------------- 04 · LE FASI ---------------- */
{ num:'04', title:'Le fasi: radiazione, materia, vuoto, e il caso misto', meta:'a ∝ t^{1/2} e T(t) · l’equivalenza · a ∝ t^{2/3} · chiuso, aperto, vuoto · sinh^{2/3} e il raddoppio di Coma',
  blocchi:[
  {t:'prosa', title:'La fase di radiazione', tag:'t^{1/2}', html:R`
  <p><i>«Siccome $[da/dt]_0\gt 0$, l&rsquo;universo era più piccolo (meglio dire più denso) in passato. Per fattori di scala abbastanza piccoli, indipendentemente dalla sua entità attuale, domina la radiazione»</i>. Tenendo solo quel termine,</p>
  <p>$$\frac{\dot a}{a}=\frac{H_0\sqrt{\Omega_{R0}}}{a^2}\quad\Longrightarrow\quad a\,da=H_0\sqrt{\Omega_{R0}}\,dt\quad\Longrightarrow\quad a(t)=\left(2H_0\sqrt{\Omega_{R0}}\,t\right)^{1/2},$$</p>
  <p>con $a=0$ a $t=0$: il Big Bang. Il tasso di espansione è $H=\dot a/a=1/(2t)$, che diverge a $t\to0$: <i>«velocità di espansione tendente all&rsquo;infinito vicino al big-bang»</i>, e il primo dei paradossi della tappa 07.</p>
  <p>La prova del 27/02/2008 (es. 3) chiede la stessa cosa in termini di temperatura: un universo dominato da radiazione di corpo nero a temperatura $T$; come varia $T$ col tempo, e quanto tempo serve per arrivare a 50000 K? La densità è $\rho=aT^4/c^2$ (con $a$ costante di radiazione), e senza curvatura $H^2=\frac{8\pi G}{3}\rho$. Con $H=1/(2t)$:</p>
  <p>$$\frac{1}{4t^2}=\frac{8\pi G\,a_{\rm rad}T^4}{3c^2}\quad\Longrightarrow\quad t=\left(\frac{3c^2}{32\pi G\,a_{\rm rad}}\right)^{1/2}\frac{1}{T^2}=\frac{2{,}30\cdot10^{20}\ \mathrm{s\,K^2}}{T^2},$$</p>
  <p>la formula $t=2{,}3\cdot10^{20}\,\mathrm{s}\,(\mathrm{K}/T)^2$ della lezione 23. La temperatura cala come $t^{-1/2}$, cioè come $1/a$. A $T=50000$ K: $t=2{,}30\cdot10^{20}/(5\cdot10^4)^2=9{,}2\cdot10^{10}$ s, circa $2920$ anni. (Con i neutrini la densità di radiazione è maggiore del $68\%$ e il tempo più breve di un fattore $1{,}3$; la prova chiede solo il corpo nero.)</p>`},
  {t:'prosa', title:'L’equivalenza, e una slide che si contraddice', tag:'il passaggio', html:R`
  <p>La radiazione cede il passo alla materia quando le due densità sono uguali: $\Omega_{M0}a_{\rm eq}^{-3}=\Omega_{R0}a_{\rm eq}^{-4}$, cioè</p>
  <p>$$a_{\rm eq}=\frac{\Omega_{R0}}{\Omega_{M0}} .$$</p>
  <p>De Bernardis, nella lezione 21, scrive $\Omega_R=8{,}51\cdot10^{-5}$ e $a_{\rm eq}=0{,}85\cdot10^{-4}/\Omega_{M0}$. Con $\Omega_{M0}=0{,}33$ viene $a_{\rm eq}=2{,}58\cdot10^{-4}$, cioè $1+z_{\rm eq}=3878$ e $T_{\rm eq}=2{,}725\cdot3878=10\,567$ K. La slide di de Bernardis invece scrive $1+z_{\rm eq}\sim11000$ e $T_{\rm eq}\sim32000$ K: non sono compatibili con la sua stessa formula. Il tempo dell&rsquo;equivalenza della slide, $t_{\rm eq}=a_{\rm eq}^2/(2H_0\sqrt{\Omega_{R0}})\sim5\cdot10^4$ anni, torna invece con $a_{\rm eq}=2{,}58\cdot10^{-4}$:</p>
  <p>$$t_{\rm eq}=\frac{(2{,}58\cdot10^{-4})^2}{2\cdot2{,}27\cdot10^{-18}\ \mathrm{s^{-1}}\cdot\sqrt{8{,}51\cdot10^{-5}}}=1{,}59\cdot10^{12}\ \mathrm{s}=5{,}0\cdot10^4\ \text{anni}.$$</p>
  <p>Lo dichiaro: i numeri giusti sono $1+z_{\rm eq}\approx3900$ e $T_{\rm eq}\approx10^4$ K (con $\Omega_{M0}=0{,}3$, $1+z_{\rm eq}=3525$). L&rsquo;11000 e il 32000 sono i valori che si ottengono con $\Omega_{M0}=1$: $1/(8{,}5\cdot10^{-5})=11\,765$ e $2{,}725\cdot11\,765=32\,060$ K, un residuo dei modelli di sola materia.</p>`},
  {t:'prosa', title:'La fase di materia, e i suoi tre destini', tag:'t^{2/3}', html:R`
  <p>Dopo l&rsquo;equivalenza, se $\Omega_{M0}$ domina sulla curvatura e su $\Lambda$, $(\dot a/a)^2=H_0^2\Omega_{M0}a^{-3}$, cioè $a^{1/2}da=H_0\sqrt{\Omega_{M0}}\,dt$, e</p>
  <p>$$a(t)=\left(\frac32H_0\sqrt{\Omega_{M0}}\,t\right)^{2/3}.$$</p>
  <p>Per l&rsquo;universo critico di sola materia, $\Omega_{M0}=1$, l&rsquo;età di oggi ($a=1$) è $t_0=2/(3H_0)$. In questa fase $\ddot a\lt 0$ sempre: <i>«l&rsquo;espansione dell&rsquo;universo è comunque decelerata»</i>. Come finisce dipende dal segno della curvatura. De Bernardis, nella lezione 17 del 2020, distingue i casi per un universo di sola materia: con $\Omega_{M0}=0$ (universo vuoto) $a=H_0t$, espansione a velocità costante, età $1/H_0$; con $\Omega_{M0}=1$, la $t^{2/3}$ per sempre; con $\Omega_{M0}\gt 1$, l&rsquo;espansione si ferma quando $\dot a=0$, cioè $\Omega_{M0}/a_{\max}+(1-\Omega_{M0})=0$:</p>
  <p>$$a_{\max}=\frac{\Omega_{M0}}{\Omega_{M0}-1},$$</p>
  <p>e poi ricollassa, <i>«il big bang seguito dal big crunch»</i>. Con $\Omega_{M0}=2$, $a_{\max}=2$: l&rsquo;universo arriverebbe al doppio della dimensione di oggi. Con $\Omega_0\lt 1$ e $\Lambda=0$ la materia cede alla curvatura, $(\dot a/a)^2\approx H_0^2(1-\Omega_0)a^{-2}$, e l&rsquo;espansione diventa libera, $a\propto t$.</p>`},
  {t:'prosa', title:'La fase di vuoto, e la soluzione mista', tag:'esponenziale e sinh', html:R`
  <p>Se $\Omega_0=1$ e $\Omega_\Lambda\gt 0$, dopo la materia viene la costante cosmologica: per $a\gt a_\Lambda=(\Omega_{M0}/\Omega_\Lambda)^{1/3}$ domina il termine costante, $(\dot a/a)^2=H_0^2\Omega_\Lambda$, e</p>
  <p>$$a(t)\propto\exp\left(H_0\sqrt{\Omega_\Lambda}\,t\right),$$</p>
  <p><i>«l&rsquo;espansione è eterna ed esponenzialmente accelerata»</i>. Con $\Omega_{M0}=0{,}3$ e $\Omega_\Lambda=0{,}7$, $a_\Lambda=(0{,}3/0{,}7)^{1/3}=0{,}754$, $z_\Lambda=0{,}33$: <i>«le misure di supernovae e di anisotropie del fondo cosmico sembrano indicare che oggi ci si trovi già in una fase di vuoto»</i>. De Bernardis riassume la storia con tre tratti: $t^{1/2}$, $t^{2/3}$, $\exp(t)$.</p>
  <p>Il caso misto materia più costante cosmologica, piatto, ha una soluzione esatta che la prova del 27/02/2008 chiede di verificare:</p>
  <p>$$a(t)=\left(\frac{\Omega_{M0}}{\Omega_\Lambda}\right)^{1/3}\sinh^{2/3}\left(\frac32\sqrt{\Omega_\Lambda}\,H_0t\right).$$</p>
  <p>La verifica è diretta. Con $x=\frac32\sqrt{\Omega_\Lambda}H_0t$, $\dot a/a=\frac23\cdot\frac32\sqrt{\Omega_\Lambda}H_0\coth x=\sqrt{\Omega_\Lambda}H_0\coth x$, e $(\dot a/a)^2=\Omega_\Lambda H_0^2(1+1/\sinh^2x)$; ma $1/\sinh^2x=(\Omega_{M0}/\Omega_\Lambda)a^{-3}$, quindi $(\dot a/a)^2=H_0^2(\Omega_\Lambda+\Omega_{M0}a^{-3})$. Per $x$ piccolo $\sinh x\approx x$ e si ritrova $t^{2/3}$; per $x$ grande $\sinh x\approx e^x/2$ e si ritrova l&rsquo;esponenziale con esponente $\frac23x=H_0\sqrt{\Omega_\Lambda}t$.</p>`},
  {t:'reveal', title:'Prova del 27/02/2008, esercizio 2: quando raddoppia la distanza di Coma?', tag:'svolto', steps:[
   {label:'Il testo', body:R`<p>La distanza tra la nostra Galassia e l&rsquo;ammasso di Coma è oggi 113 Mpc. 2.1) Si calcoli approssimativamente il tempo necessario perché raddoppi. 2.2) Lo stesso con $\Omega_{M0}=0{,}3$, $\Omega_\Lambda=0{,}7$, usando la soluzione in sinh. $H_0=70$ km/s/Mpc.</p>`},
   {label:'2.1 La stima', body:R`<p>Se $H$ restasse quello di oggi, la distanza crescerebbe come $e^{H_0t}$ e raddoppierebbe in $\ln2/H_0=0{,}693\cdot13{,}97=9{,}68$ miliardi di anni. Il valore 113 Mpc non serve: in un&rsquo;espansione uniforme tutte le distanze raddoppiano nello stesso tempo.</p>`},
   {label:'2.2 Con la soluzione esatta', body:R`<p>Invertendo, $\sinh x=\sqrt{\Omega_\Lambda/\Omega_{M0}}\,a^{3/2}$. Oggi ($a=1$): $\sinh x_0=1{,}528$, $x_0=1{,}210$. Al raddoppio ($a=2$): $\sinh x_2=1{,}528\cdot2^{3/2}=4{,}32$, $x_2=2{,}170$. Il tempo è $\Delta t=(x_2-x_0)/(\frac32\sqrt{0{,}7}H_0)=0{,}960/1{,}255\cdot13{,}97=10{,}7$ miliardi di anni.</p>`},
   {label:'Perché di più', body:R`<p>Il tasso di Hubble cala ancora, da $H_0$ verso $\sqrt{\Omega_\Lambda}H_0=0{,}84H_0$, perché la materia si sta ancora diluendo: l&rsquo;espansione accelera, ma $H=\dot a/a$ diminuisce. Il raddoppio richiede un miliardo di anni in più della stima a $H$ costante.</p>`}
  ]},
  {t:'plot', title:'Il fattore di scala in tre universi con lo stesso H₀',
   intro:R`a(t) contro t in miliardi di anni dal Big Bang, H₀ = 70 km/s/Mpc. In ciano Lambda-CDM piatto (soluzione in sinh^{2/3}), in oro Einstein-de Sitter (t/9,31)^{2/3}, in viola l'universo vuoto t/13,97. Le curve arrivano ad a = 1 con la stessa pendenza H₀, a età diverse.`,
   plots:[
    {kind:'func2d', xr:[0,30], yr:[0,3], height:290, equal:false,
     title:'t (Gyr)      a(t)',
     curves:[{f:'pow(0.3/0.7,1/3)*pow((exp(1.5*sqrt(0.7)*x/13.97)-exp(-1.5*sqrt(0.7)*x/13.97))/2,2/3)', col:'#5eead4', label:'Lambda-CDM'},
             {f:'pow(x/9.31,2/3)', col:'#d8a13a', label:'Einstein-de Sitter'},
             {f:'x/13.97', col:'#b98cff', label:'vuoto'},
             {f:'1', col:'#94a3b8', label:'oggi, a = 1', dash:true}],
     marks:[{x:13.47, y:1, label:'ΛCDM: 13,47 Gyr', col:'#5eead4', up:true},
            {x:9.31, y:1, label:'EdS: 9,31', col:'#d8a13a', up:false}]}
   ],
   leggi:R`<p><b>Che cosa guardare:</b> la curva di Lambda-CDM parte come quella di Einstein-de Sitter (t^{2/3}, concava) e cambia concavità poco prima di oggi, quando comincia l'accelerazione. L'universo vuoto, una retta, sta in mezzo.</p>
   <p><b>Che cosa impararne:</b> a parità di H₀, un universo che ha accelerato è più vecchio, perché in passato si espandeva più lentamente; uno che ha solo decelerato è più giovane. È il legame tra età e composizione della tappa che segue.</p>`},
  {t:'prosa', title:'Quando l&rsquo;universo ha cominciato ad accelerare, e perché non può stare fermo', tag:'Marconi, cap. 6.3, pp. 88-93', html:R`
  <p>Marconi segue i modelli con $\Lambda\gt0$ attraverso il loro flesso. Per polvere più costante cosmologica l&rsquo;equazione dell&rsquo;accelerazione è $\ddot a/a=H_0^2\left(\Omega_\Lambda-\Omega_0/(2a^3)\right)$, e il segno cambia quando</p>
  <p>$$a_{\rm fl}=\left(\frac{\Omega_0}{2\Omega_\Lambda}\right)^{1/3}=0{,}60,\qquad z_{\rm fl}=0{,}67$$</p>
  <p>con $\Omega_0=0{,}3$ e $\Omega_\Lambda=0{,}7$: la gravità frenava fino a sei miliardi di anni fa circa, poi la costante cosmologica ha preso il sopravvento. Al flesso l&rsquo;espansione ha la velocità minima $\dot a_{\min}$. Se $\dot a_{\min}^2=0$ l&rsquo;universo può restare fermo per sempre in $a_{\min}=1/(1+z_c)$: sono i modelli statici di Eddington-Lemaître, e Marconi mostra che sono esclusi. Le due condizioni $\ddot a=0$ e $\dot a=0$ in $a_{\min}$ danno $\Omega_\Lambda=\Omega_0(1+z_c)^3/2$ e, sostituendo,</p>
  <p>$$\Omega_0=\frac{2}{(1+z_c)^3-3(1+z_c)+2}=\frac{2}{z_c^2(z_c+3)} ;$$</p>
  <p>siccome vediamo oggetti a $z\gt6$, deve essere $z_c\gt6$, e quindi $\Omega_0\lt2/(36\cdot9)=0{,}0062$, almeno un fattore dieci sotto la sola materia oscura. In più quegli stati sono instabili: una piccola perturbazione li manda nel ramo che ricollassa o in quello che si espande. Il caso limite opposto è il modello vuoto di Milne, $\Omega_0=\Omega_\Lambda=0$, in cui le galassie non accelerano né decelerano e la geometria è iperbolica; e Marconi nota che vicino a $t=0$ tutti i modelli tendono a Einstein-de Sitter, cambiando solo la costante moltiplicativa.</p>`}
]},

/* ---------------- 05 · L'ETÀ ---------------- */
{ num:'05', title:'L’età dell’universo: un integrale, tre casi, due vincoli', meta:'t₀ = ∫da/(aH) · 2/(3H₀) · Ω_Λ ≪ Ω_M al primo ordine · stelle vecchie · torio ed europio',
  blocchi:[
  {t:'prosa', title:'L’integrale', tag:'la formula', html:R`
  <p>Da $dt=da/\dot a$ e Friedmann in unità critiche, l&rsquo;età è</p>
  <p>$$t_0=\int_0^1\frac{da}{\dot a}=\frac{1}{H_0}\int_0^1\frac{da}{a\sqrt{\Omega_{R0}a^{-4}+\Omega_{M0}a^{-3}+(1-\Omega_0)a^{-2}+\Omega_\Lambda}} .$$</p>
  <p><i>«Il risultato dell&rsquo;integrale dipende molto poco dalla radiazione, perché la sua densità attuale è molto piccola rispetto a quella della materia, e quindi bisogna andare molto vicini a $t=0$ perché diventi il termine dominante»</i>: la fase di radiazione dura cinquantamila anni su quattordici miliardi, e la si trascura. L&rsquo;età è allora $t_0=f(\Omega_{M0},\Omega_\Lambda)/H_0$, con la funzione $f$ data da un integrale in $a$ che in tre casi si fa a mano.</p>
  <p>Per l&rsquo;universo critico di sola materia, $f=\int_0^1a^{1/2}da=2/3$, cioè $t_0=2/(3H_0)=9{,}31$ miliardi di anni con $H_0=70$. Per un universo aperto di sola materia, $\Omega_{M0}=0{,}3$ e $\Lambda=0$, la funzione è $f=\frac{1}{1-\Omega}-\frac{\Omega}{2(1-\Omega)^{3/2}}\,\mathrm{arccosh}\left(\frac2\Omega-1\right)$, che dà</p>
  <p>$$t_0=0{,}809\cdot13{,}97=11{,}30\ \text{miliardi di anni}.$$</p>
  <p>Per l&rsquo;universo piatto con $\Omega_{M0}=0{,}3$, $\Omega_\Lambda=0{,}7$, dalla soluzione in sinh: $t_0=\frac{2}{3H_0\sqrt{\Omega_\Lambda}}\,\mathrm{arcsinh}\sqrt{\Omega_\Lambda/\Omega_{M0}}=0{,}964\cdot13{,}97=13{,}47$ miliardi di anni. La slide 36 della lezione 20 lo arrotonda a 14.</p>`},
  {t:'reveal', title:'Prova del 20/12/2007, esercizio 1: l’età con poca costante cosmologica', tag:'svolto', steps:[
   {label:'Il testo', body:R`<p>1.1) Calcolare analiticamente l&rsquo;età di un universo critico ($\Omega_M+\Omega_\Lambda=1$) con $\Omega_\Lambda\ll\Omega_M$. 1.2) Verificare che per $\Omega_\Lambda\gt 0$ l&rsquo;età è maggiore di quella per $\Omega_\Lambda=0$.</p>`},
   {label:'L’integrale', body:R`<p>$$t_0=\frac{1}{H_0}\int_0^1\frac{da}{a\sqrt{\Omega_Ma^{-3}+\Omega_\Lambda}}=\frac{1}{H_0\sqrt{\Omega_M}}\int_0^1\frac{a^{1/2}\,da}{\sqrt{1+(\Omega_\Lambda/\Omega_M)a^3}} .$$</p>`},
   {label:'Il primo ordine', body:R`<p>Sviluppando la radice, $(1+\epsilon a^3)^{-1/2}\approx1-\frac12\epsilon a^3$ con $\epsilon=\Omega_\Lambda/\Omega_M$:</p><p>$$\int_0^1a^{1/2}\left(1-\frac{\epsilon}{2}a^3\right)da=\frac23-\frac{\epsilon}{9}=\frac23\left(1-\frac{\epsilon}{6}\right).$$</p>`},
   {label:'Il risultato', body:R`<p>Con $\Omega_M=1-\Omega_\Lambda$, $1/\sqrt{\Omega_M}\approx1+\Omega_\Lambda/2$ e $\epsilon\approx\Omega_\Lambda$:</p><p>$$t_0\approx\frac{2}{3H_0}\left(1+\frac{\Omega_\Lambda}{2}\right)\left(1-\frac{\Omega_\Lambda}{6}\right)\approx\frac{2}{3H_0}\left(1+\frac{\Omega_\Lambda}{3}\right),$$</p><p>come nella soluzione della raccolta. Il termine $+\Omega_\Lambda/3$ è positivo: l&rsquo;età cresce, punto 1.2.</p>`},
   {label:'Quanto è buona', body:R`<p>Per $\Omega_\Lambda=0{,}1$ la formula dà $H_0t_0=0{,}6889$; il conto esatto con l&rsquo;arcsinh dà $0{,}6903$. Lo $0{,}2\%$ di errore, già al primo ordine. Il perché fisico è nella slide 32 della lezione 20: <i>«una accelerazione positiva implica una velocità di espansione inferiore nel passato (a parità di velocità odierna) e quindi più tempo per arrivare da a = 0 ad a = 1»</i>.</p>`}
  ]},
  {t:'plot', title:'L’età contro Ω_M: universi piatti con Λ e universi aperti senza',
   intro:R`t₀ in miliardi di anni contro Ω_M0, H₀ = 70 km/s/Mpc. In ciano universi piatti con Ω_Λ = 1 − Ω_M0; in oro universi di sola materia (aperti, Λ = 0). La retta tratteggiata è l'età delle stelle più antiche, circa 11 miliardi di anni.`,
   plots:[
    {kind:'func2d', xr:[0.05,0.98], yr:[8,22], height:290, equal:false,
     title:'Ω_M0      t₀ (Gyr)',
     curves:[{f:'(function(m){var y=sqrt((1-m)/m);return 2/(3*sqrt(1-m))*log(y+sqrt(y*y+1))*13.97;})(x)', col:'#5eead4', label:'piatto, Ω_Λ = 1 − Ω_M'},
             {f:'(function(m){var u=2/m-1;return (1/(1-m)-m/(2*pow(1-m,1.5))*log(u+sqrt(u*u-1)))*13.97;})(x)', col:'#d8a13a', label:'aperto, Λ = 0'},
             {f:'11', col:'#f87171', label:'stelle più antiche', dash:true}],
     marks:[{x:0.3, y:13.47, label:'0,3 / 0,7: 13,47', col:'#5eead4', up:true},
            {x:0.3, y:11.30, label:'0,3 aperto: 11,30', col:'#d8a13a', up:false}]}
   ],
   leggi:R`<p><b>Che cosa guardare:</b> per Ω_M0 → 1 le due curve convergono su 9,31 miliardi di anni, l'età di Einstein-de Sitter, più giovane delle stelle; a Ω_M0 = 0,3 l'universo aperto supera di poco le stelle, quello piatto con Λ le supera con margine.</p>
   <p><b>Che cosa impararne:</b> è il ragionamento della lezione 20: le età escludono gli universi critici di sola materia con H₀ ≈ 70. Il problema dell'età, che negli anni Novanta sembrava un conflitto tra cosmologia ed evoluzione stellare, è stato una delle prime indicazioni di Λ.</p>`},
  {t:'prosa', title:'Due vincoli dal basso: gli ammassi globulari e il torio', tag:'età minime', html:R`
  <p><i>«L&rsquo;età dell&rsquo;universo non può essere inferiore all&rsquo;età delle stelle più antiche»</i>. Alcune si trovano negli ammassi globulari dell&rsquo;alone. Nel diagramma HR di M68 mancano le stelle blu, luminose e massive dell&rsquo;alta sequenza principale ($B-V\lt 0{,}4$), che vivono meno, perché $L\sim M^3$ e il tempo di vita $\sim M/L\sim M^{-2}$: l&rsquo;ammasso è vecchio, e la posizione del punto di uscita dalla sequenza principale ne dà l&rsquo;età. <i>«Deve essere quindi $t_0\gt 11$ Gyr»</i>; anche con $H_0=50$, il valore più basso compatibile con le misure, serve $H_0t_0\gt 0{,}5$.</p>
  <p>La prova del 20/12/2007 (es. 3) dà un secondo orologio, nucleare. Lo spettro di una stella della Galassia dà $n({\rm Th})/n({\rm Eu})=0{,}27$; il torio decade (la prova dice in europio, è una semplificazione) con tempo di dimezzamento 14,5 miliardi di anni, e la nucleosintesi stellare li produce con rapporto $0{,}5$. Con $\tau=t_{1/2}/\ln2=20{,}9$ miliardi di anni, il torio va come $n_{\rm Th}(t_0)e^{-\Delta t/\tau}$ e l&rsquo;europio guadagna quello che il torio perde. Chiamando $A=0{,}27$ il rapporto di oggi e $B=0{,}5$ quello iniziale, e $x=e^{-\Delta t/\tau}$:</p>
  <p>$$A=\frac{Bx}{1+B(1-x)}\quad\Longrightarrow\quad x=\frac{A(1+B)}{B(1+A)}=0{,}638,\qquad\Delta t=\tau\ln\frac1x=9{,}4\ \text{miliardi di anni}.$$</p>
  <p>È un limite inferiore: la stella si è formata dopo il Big Bang. Il valore coincide con quello della soluzione.</p>`}
]},

/* ---------------- 06 · GLI ORIZZONTI ---------------- */
{ num:'06', title:'Gli orizzonti: quanto lontano si vede, quanto lontano si potrà raggiungere', meta:'d_h = 2ct, 3ct · 2c/H₀ · un fotone che prima si allontana · l’orizzonte degli eventi · tre prove',
  blocchi:[
  {t:'prosa', title:'L’orizzonte delle particelle', tag:'definizione', html:R`
  <p><i>«A qualunque epoca t, sarà possibile osservare solo oggetti distanti meno della distanza percorsa dalla luce nel tempo passato dal Big Bang. Questa distanza è detta orizzonte delle particelle»</i>. Una sorgente sull&rsquo;orizzonte, a coordinata comovente $\chi_1$, emette a $t=0$ e noi riceviamo a $t$; per fotoni radiali $\chi_1=\int_0^tc\,dt'/a(t')$, e la distanza propria dell&rsquo;orizzonte è</p>
  <p>$$d_h(t)=a(t)\int_0^t\frac{c\,dt'}{a(t')} .$$</p>
  <p>Durante la fase di radiazione, $a\propto t^{1/2}$: $d_h=t^{1/2}\int_0^tc\,t'^{-1/2}dt'=2ct$. Durante la fase di materia, che dura molto più a lungo e per la quale si può estendere l&rsquo;integrale fino a zero, $a\propto t^{2/3}$: $d_h=t^{2/3}\int_0^tc\,t'^{-2/3}dt'=3ct$. L&rsquo;orizzonte è più grande di $ct$ perché la regione da cui la luce è partita si è espansa nel frattempo. Con $t=2/(3H(z))$ e $H(z)=H_0(1+z)^{3/2}$,</p>
  <p>$$d_h(z)=\frac{2c}{H_0}(1+z)^{-3/2},\qquad d_h(0)=\frac{2c}{H_0}=8300\ \mathrm{Mpc}$$</p>
  <p>(la slide usa $H_0\approx72$; con 70 viene $8565$ Mpc). <i>«Quindi l&rsquo;universo potrebbe essere infinitamente esteso, ma noi oggi possiamo osservarne solo una parte»</i>. In Lambda-CDM, con la radiazione, l&rsquo;integrale fatto numericamente dà un orizzonte comovente di $13{,}9$ Gpc oggi: è la distanza da cui viene il fondo cosmico, i <i>«27 miliardi di anni luce»</i> della lezione 21 ($8{,}3$ Gpc in Einstein-de Sitter con $H_0=72$).</p>
  <p>L&rsquo;orizzonte cresce più in fretta delle distanze comoventi, così che <i>«nuove sorgenti entrano nell&rsquo;orizzonte e diventano osservabili»</i>, prima o dopo a seconda della loro distanza comovente. È il fatto che regola la crescita delle strutture: una perturbazione di una data scala comincia a evolvere quando entra nell&rsquo;orizzonte.</p>`},
  {t:'prosa', title:'Il fotone che prima si allontana', tag:'un paradosso apparente', html:R`
  <p>De Bernardis, nella lezione 21, segue un fotone che parte dall&rsquo;orizzonte a $t=0$ e ci arriva oggi. Al momento dell&rsquo;emissione la sua distanza da noi era zero, perché $a(0)=0$; al momento della ricezione è di nuovo zero. In mezzo? In Einstein-de Sitter, con $x=t/t_0$, la sorgente è a $\chi_1=3ct_0=2c/H_0$, il fotone ha percorso la coordinata comovente $3ct_0x^{1/3}$, e la sua distanza propria da noi è</p>
  <p>$$d(t)=a(t)\left[\chi_1-3ct_0\left(\frac{t}{t_0}\right)^{1/3}\right]=\frac{2c}{H_0}\left[\left(\frac{t}{t_0}\right)^{2/3}-\frac{t}{t_0}\right].$$</p>
  <p><i>«Quindi, a causa dell&rsquo;espansione, che è estremamente veloce all&rsquo;inizio, il fotone prima si allontana, e poi si riavvicina!»</i>. Il massimo è dove la derivata si annulla: $\frac23x^{-1/3}=1$, $x=8/27$, e</p>
  <p>$$d_{\max}=\frac{2c}{H_0}\left(\frac49-\frac{8}{27}\right)=\frac{8}{27}\frac{c}{H_0},$$</p>
  <p>lo stesso numero del massimo della distanza di diametro angolare in Einstein-de Sitter. Non è una coincidenza: la distanza di diametro angolare è la distanza propria all&rsquo;emissione, e il fotone che ci arriva oggi da una sorgente a redshift $z$ si trovava, al momento in cui passava per quella sorgente, esattamente a $D_A(z)$. Il massimo nel tempo del fotone e il massimo in $z$ di $D_A$ sono lo stesso punto, a $t/t_0=8/27$, cioè $1+z=(27/8)^{2/3}=9/4$.</p>`},
  {t:'plot', title:'La distanza propria di un fotone dall’orizzonte, in Einstein-de Sitter',
   intro:R`Distanze proprie in unità di c/H₀ contro t/t₀. In oro il fotone partito dall'orizzonte a t = 0 e ricevuto oggi, 2[(t/t₀)^{2/3} − t/t₀]; in ciano la sorgente da cui è partito, 2(t/t₀)^{2/3}; in viola l'orizzonte delle particelle 3ct = 2(t/t₀) c/H₀.`,
   plots:[
    {kind:'func2d', xr:[0,1], yr:[0,2.1], height:270, equal:false,
     title:'t/t₀      d / (c/H₀)',
     curves:[{f:'2*(pow(x,2/3)-x)', col:'#d8a13a', label:'fotone'},
             {f:'2*pow(x,2/3)', col:'#5eead4', label:'sorgente (comovente)'},
             {f:'2*x', col:'#b98cff', label:'orizzonte 3ct', dash:true}],
     marks:[{x:0.2963, y:0.2963, label:'massimo: 8/27 a t/t₀ = 8/27', col:'#d8a13a', up:true}]}
   ],
   leggi:R`<p><b>Che cosa guardare:</b> la sorgente si allontana più in fretta del fotone fino a quando il fotone raggiunge il massimo; poi il fotone guadagna terreno e arriva a zero oggi, mentre la sorgente è arrivata all'orizzonte, 2c/H₀.</p>
   <p><b>Che cosa impararne:</b> «la luce viaggia verso di noi» non vuol dire che la sua distanza da noi diminuisce: all'inizio lo spazio tra noi e il fotone cresceva più in fretta di quanto il fotone ne percorresse.</p>`},
  {t:'prosa', title:'L’orizzonte degli eventi', tag:'il futuro', html:R`
  <p>L&rsquo;orizzonte delle particelle guarda al passato. Quello degli eventi guarda al futuro: è la massima distanza comovente che un segnale partito oggi potrà mai percorrere, $\chi_e=\int_{t_0}^\infty c\,dt/a$. Esiste solo se l&rsquo;integrale converge. In un universo di materia, $a\propto t^{2/3}$, diverge, e ogni galassia prima o poi è raggiungibile. Con la costante cosmologica $a$ cresce esponenzialmente e l&rsquo;integrale converge: in un universo di sola $\Lambda$, $\chi_e=c/(H_0\sqrt{\Omega_\Lambda})$; in Lambda-CDM il conto numerico dà $\chi_e=4{,}9$ Gpc. Le galassie oggi più lontane di così le vediamo, perché la loro luce partita tanto tempo fa ci arriva, ma niente di ciò che partisse da noi oggi le raggiungerà, né un loro segnale di oggi raggiungerà noi.</p>`},
  {t:'reveal', title:'Prova del 13/02/2009 (A), es. 3.4-3.5: l’orizzonte alla ricombinazione', tag:'svolto', steps:[
   {label:'Il testo', body:R`<p>In un universo sempre dominato dalla materia con $\Omega_{M0}=1$: 3.4) il raggio dell&rsquo;orizzonte causale alla ricombinazione ($z=1100$) per $H_0=50$, 72, 100 km/s/Mpc; 3.5) l&rsquo;angolo che quell&rsquo;orizzonte sottende oggi.</p>`},
   {label:'3.4 Il raggio', body:R`<p>$R=3ct$ e $t=2/[3H_0(1+z)^{3/2}]$, quindi $R=2c/[H_0(1+z)^{3/2}]$. Con $(1101)^{3/2}=36\,533$: per $H_0=50$, $R=2\cdot5996/36\,533=0{,}33$ Mpc; per 72, $0{,}23$ Mpc; per 100, $0{,}16$ Mpc, come nella soluzione.</p>`},
   {label:'3.5 L’angolo', body:R`<p>$D_A=\frac{2c}{H_0}[(1+z)^{-1}-(1+z)^{-3/2}]$, e il rapporto non dipende da $H_0$:</p><p>$$\theta=\frac{R}{D_A}=\frac{1}{\sqrt{1+z}-1}=\frac{1}{33{,}18-1}=0{,}0311\ \mathrm{rad}=1{,}78^\circ .$$</p><p>La soluzione scrive $0{,}030$ rad e $1{,}8^\circ$: la stessa cosa, arrotondata.</p>`},
   {label:'Il significato', body:R`<p>Regioni del fondo cosmico separate da più di due gradi non erano mai state in contatto causale quando il fondo è stato emesso. Eppure hanno la stessa temperatura a una parte su centomila. È il paradosso degli orizzonti della tappa che segue.</p>`}
  ]},
  {t:'reveal', title:'Esonero del 21/01/2015, es. 1: la regione causale della nucleosintesi, oggi', tag:'svolto', steps:[
   {label:'Il testo', body:R`<p>Raggio dell&rsquo;orizzonte causale alla fine della nucleosintesi (5 minuti dopo il Big Bang) in un universo piatto con $\Omega_{R0}=2{,}5\cdot10^{-5}$, $\Omega_{M0}=0{,}3$, $H_0=70$. Che raggio avrà quella regione all&rsquo;equivalenza, alla ricombinazione ($z=1100$), oggi?</p>`},
   {label:'L’orizzonte a 5 minuti', body:R`<p>In fase di radiazione $R_H=2ct=2\cdot3\cdot10^8\cdot300=1{,}8\cdot10^{11}$ m, poco più di un&rsquo;unità astronomica.</p>`},
   {label:'Il fattore di scala', body:R`<p>$a=(2H_0\sqrt{\Omega_{R0}}\,t)^{1/2}=(2\cdot2{,}27\cdot10^{-18}\cdot5\cdot10^{-3}\cdot300)^{1/2}=2{,}6\cdot10^{-9}$.</p>`},
   {label:'Dopo', body:R`<p>La regione, una volta fissata, si espande con l&rsquo;universo: $R=R_H\,a/a_5$. All&rsquo;equivalenza, $a_{\rm eq}=\Omega_{R0}/\Omega_{M0}=8{,}3\cdot10^{-5}$: $R=1{,}8\cdot10^{11}\cdot8{,}3\cdot10^{-5}/2{,}6\cdot10^{-9}=5{,}8\cdot10^{15}$ m $=0{,}19$ pc. Alla ricombinazione, $a=9{,}1\cdot10^{-4}$: $R=2{,}0$ pc. Oggi: $R=1{,}8\cdot10^{11}/2{,}6\cdot10^{-9}=6{,}9\cdot10^{19}$ m $=2{,}2$ kpc.</p>`},
   {label:'Le approssimazioni', body:R`<p>Si è usata la fase di radiazione pura fino a 5 minuti, che è ottima, e si è trascurato che la regione causale continua a crescere dopo: qui si segue la regione fissata a 5 minuti, non l&rsquo;orizzonte. La regione che era causalmente connessa quando si formava l&rsquo;elio è oggi grande quanto un decimo della Galassia: la nucleosintesi è avvenuta in miliardi di regioni indipendenti, e il fatto che dia ovunque lo stesso $25\%$ di elio è un&rsquo;altra faccia dell&rsquo;omogeneità iniziale.</p>`}
  ]},
  {t:'prosa', title:'Al tempo di Planck: quante regioni', tag:'prova del 14/09/2007', html:R`
  <p>La prova del 14/09/2007 (es. 1) porta il conto al limite. Oggi la regione causalmente connessa ha raggio $R_c\approx ct_0$ (stima d&rsquo;ordine, con $t_0=14$ miliardi di anni); al tempo di Planck, $t_{\rm pk}=5{,}4\cdot10^{-44}$ s, con $T_{\rm pk}=1{,}4\cdot10^{32}$ K e la temperatura che scala come $1/a$, la stessa regione aveva raggio</p>
  <p>$$R_{\rm pk}=ct_0\frac{a(t_{\rm pk})}{a(t_0)}=ct_0\frac{T_0}{T_{\rm pk}}=1{,}32\cdot10^{26}\ \mathrm{m}\cdot\frac{2{,}735}{1{,}4\cdot10^{32}}=2{,}6\cdot10^{-6}\ \mathrm{m},$$</p>
  <p>pochi micron. Ma allora la regione causale aveva raggio $ct_{\rm pk}=1{,}6\cdot10^{-35}$ m, e il volume di oggi conteneva</p>
  <p>$$N\approx\left(\frac{t_0T_0}{t_{\rm pk}T_{\rm pk}}\right)^3=\left(1{,}60\cdot10^{29}\right)^3=4\cdot10^{87}$$</p>
  <p>regioni causalmente disconnesse. La soluzione della raccolta riporta $10^{84}$; con i dati del testo il conto dà $4\cdot10^{87}$, e lo dichiaro. L&rsquo;ordine di grandezza del paradosso non cambia: $10^{84}$ o $10^{87}$ regioni che non si erano mai parlate.</p>`},
  {t:'prosa', title:'Il diagramma spazio-tempo di Einstein-de Sitter, e una cifra di Marconi', tag:'Marconi, cap. 12.4, pp. 186-190', html:R`
  <p>Marconi riassume il modello critico in poche formule in unità di $c/H_0$ e $1/H_0$: l&rsquo;età è $t_0=\frac23H_0^{-1}$, la sfera di Hubble è $R_{HS}=(c/H_0)(t/t_0)$, l&rsquo;orizzonte delle particelle $3ct$, e il cono di luce passato, la distanza propria a cui si trovava al tempo $t$ un fotone che ci arriva oggi, è</p>
  <p>$$R_{PLC}(t)=\frac{2c}{H_0}\left[\left(\frac{t}{t_0}\right)^{2/3}-\frac{t}{t_0}\right].$$</p>
  <p>La curva ha una forma a goccia: il fotone prima si allontana da noi, trascinato dall&rsquo;espansione, poi si avvicina. Il massimo è dove la derivata si annulla, $\frac23(t/t_0)^{-1/3}=1$, cioè $t/t_0=(2/3)^3=8/27$, con $a=(8/27)^{2/3}=4/9$ e quindi $z=1{,}25$; lì $R_{PLC}=\frac{2c}{H_0}\left(\frac49-\frac{8}{27}\right)=\frac{8}{27}\frac{c}{H_0}$, che è esattamente il raggio della sfera di Hubble a quel tempo, $(c/H_0)\cdot8/27$. Il fotone smette di allontanarsi quando entra nella sfera di Hubble, come deve. Una galassia a $z=1{,}25$ è la più lontana, in distanza propria al momento dell&rsquo;emissione, che si possa vedere in questo modello.</p>
  <p>Per il modello di riferimento Marconi scrive che la sfera di Hubble tende a una distanza propria di $1{,}12\,c/H_0$, perché <i>«la costante di Hubble tende al valore costante $\Omega_\Lambda^{1/2}H_0$»</i>. Le due affermazioni non stanno insieme: con $H\to\Omega_\Lambda^{1/2}H_0$ il raggio tende a $c/(H_0\sqrt{0{,}7})=1{,}195\,c/H_0$; il valore 1,12 è $\Omega_\Lambda^{-1/3}=1{,}126$, che è un&rsquo;altra cosa. Lo dichiaro: il numero giusto è 1,2.</p>`}
]},

/* ---------------- 07 · I DUE PARADOSSI ---------------- */
{ num:'07', title:'I due paradossi: orizzonte e piattezza', meta:'regioni mai in contatto con la stessa temperatura · Ω che si allontana da 1 · una precisione di 10⁻¹⁷ al tempo zero',
  blocchi:[
  {t:'prosa', title:'Il paradosso degli orizzonti', tag:'il primo', html:R`
  <p><i>«Andando a ritroso nel tempo, le distanze tra le sorgenti si riducono, ma l&rsquo;orizzonte si stringe più velocemente di quanto non facciano le distanze. Avvicinandoci al Big Bang troviamo un universo diviso in un numero sempre maggiore di regioni causalmente disconnesse. Come è possibile che abbiamo formato un universo omogeneo e isotropo, non avendo mai interagito prima?»</i>. Il ragionamento quantitativo è quello delle prove: l&rsquo;orizzonte va come $t$, le distanze comoventi come $a$, cioè come $t^{1/2}$ o $t^{2/3}$, e per $t\to0$ il rapporto orizzonte/distanza va a zero.</p>
  <p>De Bernardis, nella lezione 21, lo traduce in un angolo sul cielo. Il fondo cosmico si è separato dalla materia alla ricombinazione, circa 380000 anni dopo il Big Bang; l&rsquo;orizzonte allora, in fase di radiazione, era $2ct\approx760\,000$ anni luce (la slide scrive 740000). Visto oggi da una distanza di 27 miliardi di anni luce, con il fattore 1100 dell&rsquo;espansione, sottende</p>
  <p>$$\theta\approx\frac{7{,}4\cdot10^5\cdot1100}{2{,}7\cdot10^{10}}=0{,}030\ \mathrm{rad}\approx1{,}7^\circ .$$</p>
  <p>Nel fondo cosmico <i>«in media le macchie hanno davvero un diametro dell&rsquo;ordine del grado. È proprio quanto ci aspettavamo in un universo euclideo: zone che all&rsquo;epoca erano causalmente sconnesse le dobbiamo vedere separate di circa un grado. Però la differenza di temperatura è solo di poche parti su 100000»</i>. La risposta di de Bernardis è l&rsquo;ipotesi inflazionaria: una fase di espansione accelerata, verso $10^{-36}$ s, in cui una regione piccola e causalmente connessa si è dilatata fino a contenere tutto l&rsquo;universo osservabile di oggi.</p>`},
  {t:'prosa', title:'Il paradosso della piattezza', tag:'il secondo', html:R`
  <p>Oggi $\Omega_0=1{,}02\pm0{,}02$. Dalla relazione $k=(H_0^2/c^2)(\Omega_0-1)$ il raggio di curvatura è</p>
  <p>$$R_c=\frac{1}{\sqrt{|k|}}=\frac{c/H_0}{\sqrt{|\Omega_0-1|}},$$</p>
  <p>e per $\Omega_0=1{,}02$ con la $c/H_0=4150$ Mpc della slide, $R_c=4150/\sqrt{0{,}02}=29\,345$ Mpc, i 29000 Mpc della lezione: sette volte il raggio di Hubble. La curvatura sarebbe minima. Ma $\Omega$ non è costante: Friedmann a un tempo qualunque dà $\Omega(t)-1=kc^2/(a^2H^2)$, e siccome $\dot a=aH$ diverge per $t\to0$, nel passato $\Omega$ era molto più vicino a 1 che adesso.</p>
  <p>La prova del 27/02/2008 (es. 1) chiede di renderlo quantitativo. Dividendo $\Omega(z)-1=kc^2(1+z)^2/H(z)^2$ per $\Omega_0-1=kc^2/H_0^2$, e usando $H(z)^2=H_0^2[\Omega_{R0}(1+z)^4+\Omega_{M0}(1+z)^3+(1-\Omega_0)(1+z)^2+\Omega_\Lambda]$:</p>
  <p>$$\Omega(z)-1=\frac{\Omega_0-1}{1-\Omega_0+\Omega_{R0}(1+z)^2+\Omega_{M0}(1+z)+\Omega_\Lambda(1+z)^{-2}} .$$</p>
  <p>A $z=10^{10}$ domina il termine di radiazione: con $\Omega_{R0}\approx10^{-5}$, $\Omega_{R0}(1+z)^2=10^{15}$. Per avere oggi $|\Omega_0-1|\lt 0{,}01$ serviva allora</p>
  <p>$$|\Omega-1|\lt \frac{0{,}01}{10^{15}}=10^{-17} .$$</p>
  <p><i>«Per ottenere un valore circa 1 oggi, si deve partire con $\Omega=1$ entro una precisione spaventosa all&rsquo;inizio. Chi ha regolato le condizioni iniziali così bene?»</i>. Anche questo l&rsquo;inflazione lo risolve: un&rsquo;espansione esponenziale con $H$ costante fa crescere $a^2H^2$ come $e^{2Ht}$ e spinge $\Omega-1$ verso zero, come gonfiare un pallone rende piatta la sua superficie.</p>`}
]},

/* ---------------- 08 · L'ORALE IN DIECI MINUTI ---------------- */
{ num:'08', title:'L’orale in dieci minuti: la derivazione intera', meta:'il copione · cinque mosse · da Friedmann all’età',
  blocchi:[
  {t:'reveal', title:'Il copione', tag:'cinque mosse', steps:[
   {label:'1. Le due equazioni più la continuità', body:R`<p>$H^2=\frac{8\pi G}{3}\rho-\frac{kc^2}{a^2}$; $\frac{\ddot a}{a}=-\frac{4\pi G}{3}(\rho+3p/c^2)$; $\dot\rho+3H(\rho+p/c^2)=0$. Una delle tre segue dalle altre due: derivare la prima e usare la terza dà la seconda. La prima si può motivare con il guscio newtoniano; $k$ è la curvatura della metrica RW.</p>`},
   {label:'2. Densità critica e Ω', body:R`<p>$\rho_c=3H^2/(8\pi G)$, oggi $9{,}2\cdot10^{-27}$ kg/m$^3$; $\Omega=\rho/\rho_c$; $k=(H_0/c)^2(\Omega_0-1)$, il segno di $\Omega_0-1$ è il segno della curvatura.</p>`},
   {label:'3. Le leggi di diluizione', body:R`<p>Dalla continuità con $p=w\rho c^2$: $\rho\propto a^{-3(1+w)}$. Materia $a^{-3}$, radiazione $a^{-4}$, $\Lambda$ costante. Quindi $H^2=H_0^2[\Omega_Ra^{-4}+\Omega_Ma^{-3}+\Omega_Ka^{-2}+\Omega_\Lambda]$.</p>`},
   {label:'4. I regimi', body:R`<p>Un termine alla volta: radiazione $a=(2H_0\sqrt{\Omega_R}t)^{1/2}$; materia $a=(\frac32H_0\sqrt{\Omega_M}t)^{2/3}$; $\Lambda$: $a\propto e^{H_0\sqrt{\Omega_\Lambda}t}$. Il misto materia più $\Lambda$: $a\propto\sinh^{2/3}(\frac32\sqrt{\Omega_\Lambda}H_0t)$, che interpola tra i due.</p>`},
   {label:'5. L’età', body:R`<p>$t_0=\int_0^1da/(aH)$: Einstein-de Sitter $2/(3H_0)=9{,}3$ Gyr, troppo giovane per le stelle; Lambda-CDM $13{,}5$ Gyr. L&rsquo;accelerazione allunga l&rsquo;età perché in passato l&rsquo;espansione era più lenta. E se resta un minuto: l&rsquo;orizzonte $d_h=3ct$ in fase di materia e il paradosso degli orizzonti.</p>`}
  ]},
  {t:'prosa', title:'Che cosa l’esame mescola', tag:'le trappole', html:R`
  <p>Tre confusioni ricorrono nelle prove. La prima è tra le leggi di potenza: $a\propto t^{1/2}$ in radiazione, $t^{2/3}$ in materia, e chi le scambia sbaglia l&rsquo;età di un fattore $4/3$, perché $H=1/(2t)$ nel primo caso e $2/(3t)$ nel secondo. La seconda è tra $H_0$ e $\sqrt{\Omega}H_0$: in un regime dominante il coefficiente è $H_0\sqrt{\Omega_i}$, non $H_0$, e nell&rsquo;esonero 2015 dimenticare la radice di $\Omega_R$ sbaglia il fattore di scala a 5 minuti di un fattore 14. La terza è tra orizzonte e regione fissata: l&rsquo;orizzonte cresce come $t$, una regione fissata cresce come $a$, e la domanda «quanto è grande oggi la regione che era causalmente connessa allora» chiede la seconda.</p>`}
]},

/* ---------------- 09 · COLLAUDO ---------------- */
{ num:'09', title:'Collaudo', meta:'domande brevi con risposta',
  blocchi:[
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Perché la derivazione newtoniana di Friedmann dà il risultato giusto?`,
    a:R`Perché su scale piccole rispetto all&rsquo;orizzonte la relatività generale si riduce a Newton e il guscio può essere preso piccolo a piacere; l&rsquo;omogeneità garantisce che il risultato non dipenda dal centro scelto. Ciò che Newton non dà è il significato geometrico di $k$ e il fatto che la pressione gravita.`},
   {q:R`Come si diluisce un gas di neutrini con massa 0,1 eV oggi?`,
    a:R`Oggi la temperatura del fondo di neutrini è circa $1{,}9$ K, $kT\approx1{,}7\cdot10^{-4}$ eV, molto meno della massa: sono non relativistici e si diluiscono come materia, $a^{-3}$. In passato, per $kT\gtrsim0{,}1$ eV, si diluivano come radiazione, $a^{-4}$.`},
   {q:R`In un universo di sola radiazione, quanto vale H in funzione di t? E l’orizzonte?`,
    a:R`$a\propto t^{1/2}$, $H=1/(2t)$; $d_h=2ct=c/H$.`},
   {q:R`Con Ω_M0 = 2 e Λ = 0, quale sarà la dimensione massima dell’universo rispetto a oggi?`,
    a:R`$a_{\max}=\Omega_{M0}/(\Omega_{M0}-1)=2$: il doppio, poi il ricollasso.`},
   {q:R`Perché l’età di un universo con Λ > 0 è maggiore, a parità di H₀?`,
    a:R`Perché $\Lambda$ accelera: a parità di velocità di espansione oggi, in passato l&rsquo;universo si espandeva più lentamente, e ci ha messo più tempo ad arrivare da $a=0$ ad $a=1$. Al primo ordine, $t_0\approx\frac{2}{3H_0}(1+\Omega_\Lambda/3)$.`},
   {q:R`Che cosa vuol dire che in Lambda-CDM esiste un orizzonte degli eventi di 4,9 Gpc comoventi?`,
    a:R`Che un segnale partito oggi non raggiungerà mai galassie a distanza comovente maggiore di 4,9 Gpc, anche se le vediamo: la crescita esponenziale di $a$ fa convergere $\int_{t_0}^\infty c\,dt/a$.`},
   {q:R`Se Ω₀ − 1 = 0,01 oggi, quanto valeva Ω − 1 all’equivalenza?`,
    a:R`Lì radiazione e materia si equivalgono, e il denominatore della formula della prova 2008 vale circa $\Omega_{R0}(1+z)^2+\Omega_{M0}(1+z)=2\Omega_{M0}(1+z_{\rm eq})\approx2\cdot0{,}3\cdot3500\approx2100$: $\Omega-1\approx5\cdot10^{-6}$.`}
  ]}
]}

function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionSvelabile(title, tag, html, sol){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var c=document.createElement('div'); c.className='collaudo-item';
  var q=document.createElement('div'); q.className='cq'; q.innerHTML=html||'';
  c.appendChild(q); typeset(q);
  if(sol){
    var a=document.createElement('div'); a.className='ca'; a.style.display='none';
    a.innerHTML='<b>Soluzione.</b> '+sol;
    var btn=document.createElement('button'); btn.className='reveal-btn small';
    btn.textContent='Rivela la soluzione';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a);
      btn.disabled=true; btn.classList.add('done'); btn.textContent='Soluzione rivelata'; };
    c.appendChild(btn); c.appendChild(a);
  }
  wrap.appendChild(c); return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    /* DUE SCHEMI, NON UNO — scoperto il 2026-10-06 provando le pagine vive. I movimenti
       scritti per primi (em-01..03, me-10b, i collaudi di gd-01..09 e di quattro em)
       usano una forma piu' semplice: `reveal` e `prolessi` con un solo `html`,
       `esercizio` e `collaudo` con `html` + `sol`. Il renderer ne conosceva una sola e
       chiamava `steps.forEach` su `undefined`: TypeError, e la tappa si fermava li' —
       62 blocchi in 17 movimenti su 74. Non si riscrive il contenuto per far contento
       il renderer: e' il renderer che deve leggere cio' che c'e'.
       E in fondo un ramo che NON muore: uno schema nuovo di domani deve far vedere un
       avviso in quella sezione, non spegnere la pagina sotto di se'. */
    try{
      if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
      else if(b.t==='prolessi') m.appendChild(b.rotte ? sectionProlessi(b)
                                   : sectionProsa(b.title,'prolessi',b.html));
      else if(b.t==='reveal')m.appendChild(b.steps ? sectionReveal(b.title,b.tag,b.steps)
                                   : sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='esercizio') m.appendChild(b.steps ? sectionEsercizio(b)
                                   : sectionSvelabile(b.title,'esercizio',b.html,b.sol));
      else if(b.t==='collaudo')  m.appendChild(b.items ? sectionCollaudo(b.title,b.items)
                                   : sectionSvelabile(b.title,'provi, poi riveli',b.html,b.sol));
      else if(b.t==='plot')      m.appendChild(sectionPlot(b));
      else m.appendChild(sectionProsa(b.title||'(blocco)', 'tipo sconosciuto: '+b.t,
                                      b.html||''));
    }catch(err){
      var avv=document.createElement('section'); avv.className='section';
      avv.innerHTML='<h3>'+(b.title||'(blocco)')+'<span class="tag">non reso</span></h3>'
        +'<p style="color:#ff6b6b">Questo blocco non si &egrave; potuto rendere ('
        +b.t+': '+err.message+'). Il resto della tappa continua sotto.</p>';
      m.appendChild(avv);
    }
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* I POP-UP DEGLI STRUMENTI. `cablaStrumenti` esisteva dal 18-09 e non la chiamava
     nessuno: i 229 rimandi del percorso erano <span> senza handler, e il clic non
     faceva niente. Nessun controllo poteva vederlo — la sintassi era valida, le schede
     c'erano tutte, le formule rendevano: il guasto esisteva solo a pagina viva. Qui, e
     dopo ogni inserimento successivo, perche' la tappa si rimonta da capo a ogni
     cambio e gli handler vanno riattaccati al DOM nuovo. */
  cablaStrumenti(m);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}

/* deep-link: as-16-frw-friedmann-e-i-parametri-cosmologici.html#03 apre direttamente la tappa 03 */
window.addEventListener('DOMContentLoaded', function(){
  var h=(location.hash||'').replace('#','');
  showTappa(byId[h]?h:'00');
});
window.addEventListener('hashchange', function(){
  var h=(location.hash||'').replace('#','');
  if(byId[h]) showTappa(h);
});
