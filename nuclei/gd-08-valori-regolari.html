<script>
"use strict";
const R = String.raw;

function typeset(el){
  if(el && window.renderMathInElement){
    try{ renderMathInElement(el,{delimiters:[
      {left:'$$',right:'$$',display:true},
      {left:'$',right:'$',display:false}
    ],throwOnError:false}); }catch(e){}

}
function elFromHTML(html){ var d=document.createElement('div'); d.innerHTML=html; return d; }

/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un
   rimando scritto nella prosa:

       <span class="str" data-str="serie-geometrica">la serie geometrica</span>

   Le schede citate da questo nucleo sono cucite qui sotto dal montaggio
   (assembla-nucleo.js): la pagina resta autosufficiente — niente fetch,
   niente sottocartelle da pubblicare — e un rimando a una scheda che non
   esiste FERMA la costruzione invece di arrivare in pagina rotto.
   Apertura: lo stesso gesto del collaudo (si clicca, il pannello compare,
   si typeset una volta sola), portato dentro la frase.
   =================================================================== */
var CORSO = 'geometria-differenziale';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["omeomorfismo"] = {"nome":"Omeomorfismo","riga":"Una biiezione continua con inversa continua: due spazi omeomorfi sono lo stesso spazio scritto in due modi, per tutto ciò che la topologia sa vedere.","serve":"È la nozione di «uguale» che si usa quando si dice che una varietà è localmente come $\\mathbb{R}^n$. La richiesta che anche l'inversa sia continua non è pignoleria: senza di essa una biiezione continua può incollare cose lontane — l'applicazione $t\\mapsto(\\cos 2\\pi t,\\sin 2\\pi t)$ da $[0,1)$ alla circonferenza è continua e biunivoca, ma la sua inversa spezza la circonferenza in un punto, e infatti $[0,1)$ e $S^1$ non sono lo stesso spazio (uno è compatto, l'altro no). Le proprietà che si conservano per omeomorfismo — compattezza, connessione, dimensione, gruppo fondamentale — sono esattamente quelle di cui si può parlare su una varietà senza aver scelto una carta.","esempio":"L'intervallo aperto $(0,1)$ e la semiretta $(0,+\\infty)$ sono omeomorfi tramite $f(x)=\\dfrac{x}{1-x}$: è continua su $(0,1)$, manda $0^+$ in $0^+$ e $1^-$ in $+\\infty$, e la sua inversa è $g(y)=\\dfrac{y}{1+y}$, anch'essa continua. Che siano davvero una l'inversa dell'altra si verifica componendo: $g(f(x))=\\dfrac{x/(1-x)}{1+x/(1-x)}=x$. Ne segue che $(0,1)$ è omeomorfo anche a tutto $\\mathbb{R}$ (componendo con $y\\mapsto\\ln y$), il che dice una cosa che all'inizio sorprende: **la lunghezza non è una proprietà topologica**. Non lo è nemmeno l'essere limitato; lo è invece la compattezza, ed è per questo che $[0,1]$ non è omeomorfo a nessuno dei due.","debito":"nessun movimento del percorso tratta la topologia generale come argomento a sé: qui c'è ciò che serve per leggere la definizione di varietà. La classificazione di quali spazi sono omeomorfi a quali è il mestiere della topologia algebrica, e nel corso di Diverio entra solo per la numerabilità del gruppo fondamentale.","controllo":[{"tipo":"uguale","sinistra":"(x/(1-x))/(1+x/(1-x))","vale":"x","ipotesi":{"x":"positive"},"dove":"esempio","appare":"=x"}]};
STRUM["compattezza"] = {"nome":"Compattezza","riga":"Ogni ricoprimento aperto ammette un sottoricoprimento finito: è la proprietà che permette di passare da «vale vicino a ogni punto» a «vale su tutto», con un numero finito di passi.","serve":"È l'ipotesi che rende globali le conclusioni locali, ed è per questo che ricorre in ogni dimostrazione di geometria differenziale. In $\\mathbb{R}^n$ equivale a chiuso e limitato (Heine-Borel), ma su una varietà quell'equivalenza non si può usare come definizione, perché «limitato» richiede una distanza e una varietà non ne ha una privilegiata. La conseguenza che si usa più spesso è negativa: gli unici sottoinsiemi di $\\mathbb{R}^n$ che sono **insieme** aperti e compatti sono $\\emptyset$ e nient'altro — ed è l'argomento per cui una varietà compatta non può essere coperta da una sola carta.","esempio":"L'intervallo $(0,1)$ non è compatto, e si vede esibendo un ricoprimento senza sottoricoprimento finito: gli aperti $A_n=\\left(\\tfrac1n,1\\right)$ per $n\\ge2$ ricoprono $(0,1)$, perché ogni $x\\gt0$ sta in $A_n$ appena $\\tfrac1n\\lt x$, cioè appena $n\\gt1/x$. Ma una sottofamiglia finita $A_{n_1},\\dots,A_{n_k}$ ha un indice massimo $N$, quindi la sua unione è $\\left(\\tfrac1N,1\\right)$, e il punto $x=\\tfrac1{2N}$ resta fuori: è positivo, dunque sta in $(0,1)$, ed è minore di $\\tfrac1N$. Il conto che regge l'argomento è $\\lim_{n\\to\\infty}\\tfrac1n=0$: gli $A_n$ si avvicinano a coprire tutto, ma nessuno di essi contiene un intorno di $0$, e servirebbero tutti. Chiudendo l'intervallo, $[0,1]$ diventa compatto e quel ricoprimento smette di essere un ricoprimento — $0$ non sta in nessun $A_n$.","debito":"la dimostrazione del teorema di Heine-Borel e la teoria generale degli spazi compatti stanno fuori dal percorso: qui c'è l'uso che se ne fa. Nel corso di Diverio la compattezza entra come ipotesi (sfera, gruppi di Lie compatti) e come conclusione della locale compattezza delle varietà.","controllo":[{"tipo":"limite","espr":"1/n","var":"n","a":"oo","vale":"0","ipotesi":{"n":"positive"},"dove":"esempio","appare":"\\lim_{n\\to\\infty}\\tfrac1n=0"},{"tipo":"disuguaglianza","sinistra":"1/(2*N)","destra":"1/N","relazione":"<","ipotesi":{"N":"positive"},"dove":"esempio","appare":"minore di $\\tfrac1N$"}]};

function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';
  return h;
}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

/* ---------------- 00 · DI COSA PARLA QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Di cosa parla questo movimento', meta:'Geometria Differenziale · voci G.15-G.17 · il criterio piu usato di tutto il corso',
  blocchi:[
  {t:'prosa', title:'Due cose in un movimento, e sono legate', tag:'architettura', html:R`
  <p>La prima è <b>pratica</b>: dato un insieme definito da equazioni — $\{F=c\}$ — quando è una sottovarietà? La risposta è il <b>teorema del valore regolare</b>, ed è il criterio con cui si riconosce il 90% degli esempi che si incontrano: sfere, gruppi di matrici, superfici di livello.</p>
  <p>La seconda è <b>concettuale</b>: che cosa vuol dire che una proprietà vale «per quasi tutti» i valori? Serve la nozione di <b>insieme di misura nulla</b>, e serve saperla trasportare su una varietà dove non c&rsquo;è una misura privilegiata.</p>
  <p><b>Il legame fra le due è il teorema di Sard</b> (gd-10): i valori <i>non</i> regolari sono di misura nulla, quindi il criterio pratico funziona quasi sempre. Questo movimento prepara entrambi i pezzi.</p>`}
]},

/* ---------------- 01 · PUNTI E VALORI CRITICI ---------------- */
{ num:'01', title:'Punti critici, valori critici, e la distinzione che conta', meta:'punto critico nel dominio · valore critico nel codominio · e perche non e la stessa cosa',
  blocchi:[
  {t:'prosa', title:'Le definizioni', tag:'grammatica', html:R`
  <p>Sia $F:M\to N$ liscia.</p>
  <ul>
   <li>$p\in M$ è <b>punto critico</b> se $\operatorname{rk}dF_p<\dim N$, cioè se il differenziale <b>non è suriettivo</b>. Altrimenti è <b>punto regolare</b>;</li>
   <li>$c\in N$ è <b>valore critico</b> se <i>almeno un</i> punto della fibra $F^{-1}(c)$ è critico. Altrimenti è <b>valore regolare</b>.</li>
  </ul>
  <p><b>La distinzione dominio/codominio è quella che si sbaglia</b>, e vale la pena fissarla con il caso limite: <b>se $c$ non è nell&rsquo;immagine di $F$, allora $c$ è un valore regolare</b> — la condizione è vuota, perché non ci sono punti da controllare. Sembra una stranezza, ed è invece ciò che rende gli enunciati puliti: «per quasi ogni $c$ la fibra è una sottovarietà» include il caso in cui la fibra è vuota, che è una sottovarietà a tutti gli effetti.</p>
  <p>Per $N=\mathbb{R}$ la condizione si semplifica: $p$ è critico se $dF_p=0$, cioè se tutte le derivate parziali si annullano. <b>È la nozione di punto stazionario dell&rsquo;analisi</b>, e questo movimento la generalizza a mappe fra varietà qualsiasi.</p>`}
]},

/* ---------------- 02 · IL TEOREMA DEL VALORE REGOLARE ---------------- */
{ num:'02', title:'Il teorema del valore regolare, e come si usa in tre righe', meta:'lenunciato · la dimensione della fibra · la sfera · e lo spazio tangente alla fibra',
  blocchi:[
  {t:'prosa', title:'Lenunciato, e da dove viene', tag:'costruzione', html:R`
  <p><b>Teorema.</b> Se $c$ è un valore regolare di $F:M\to N$, allora $F^{-1}(c)$ è una <b>sottovarietà</b> di $M$ di dimensione
  $$\dim F^{-1}(c)=\dim M-\dim N,$$
  e il suo spazio tangente in $p$ è $\ker dF_p$.</p>
  <p><b>La dimostrazione è il teorema del rango di gd-06</b>: dove $dF_p$ è suriettivo, esistono carte in cui $F$ diventa la proiezione sulle prime coordinate, e la fibra diventa un sottospazio coordinato. <b>Non c&rsquo;è nessun contenuto nuovo</b>: è la forma normale, letta al contrario.</p>
  <p><b>La ricetta operativa, in tre righe</b>, ed è quella che si applica sempre: (1) si scrive l&rsquo;insieme come $F^{-1}(c)$; (2) si calcola $dF$ e si verifica che sia suriettivo <i>sui punti della fibra</i> — non ovunque; (3) si conclude, e la dimensione è la differenza.</p>`},
  {t:'reveal', title:'La sfera, e i gruppi di matrici', tag:'esame', steps:[
   {label:'La sfera', body:R`
   <p>$S^{2}=F^{-1}(1)$ con $F(x,y,z)=x^{2}+y^{2}+z^{2}$. Il gradiente è $(2x,2y,2z)$, di norma <b>$2\sqrt{x^{2}+y^{2}+z^{2}}$</b>, che sulla fibra $F=1$ vale $2\ne0$: <b>$1$ è un valore regolare</b>, e $S^2$ è una sottovarietà di dimensione $3-1=2$.</p>
   <p><b>Il gradiente si annulla solo nell&rsquo;origine</b>, che sta nella fibra $F^{-1}(0)$: quindi $0$ è l&rsquo;unico valore critico, e infatti $F^{-1}(0)=\{0\}$ è un punto, non una superficie. <b>Il teorema dice esattamente dove si rompe.</b></p>`},
   {label:'SL(n) e O(n)', body:R`
   <p><b>$SL(n)=\det^{-1}(1)$.</b> Il differenziale del determinante nell&rsquo;identità, nella direzione $H$, è la <b>traccia</b> di $H$: per $2\times2$ il conto dà <b>$h_{11}+h_{22}$</b>. La traccia è suriettiva su $\mathbb{R}$, quindi $1$ è valore regolare e $SL(n)$ è una sottovarietà di dimensione $n^{2}-1$.</p>
   <p><b>$O(n)=F^{-1}(I)$ con $F(A)=A^{T}A$</b>, vista come mappa nelle matrici <i>simmetriche</i>. Il differenziale in $A$ manda $H$ in $A^{T}H+H^{T}A$, suriettivo sulle simmetriche. Quindi $O(n)$ è una sottovarietà di dimensione
   $$n^{2}-\frac{n(n+1)}{2}=\frac{n(n-1)}{2},$$
   che per $n=3$ dà <b>dimensione 3</b>: le tre rotazioni indipendenti dello spazio. <b>È il conto che dice perché un corpo rigido ha tre gradi di libertà rotazionali</b>, e lo dice senza scegliere angoli di Eulero — che sono solo una carta, con le sue singolarità.</p>`}
  ]},
  {t:'prosa', title:'Il tangente alla fibra, e perche e utile', tag:'idea', html:R`
  <p>$T_p F^{-1}(c)=\ker dF_p$: <b>il tangente alla superficie di livello è il nucleo del differenziale</b>. Per $F:\mathbb{R}^3\to\mathbb{R}$ significa che il piano tangente è ortogonale al gradiente — il fatto noto da Analisi Vettoriale, qui come caso particolare.</p>
  <p><b>La conseguenza che si usa in meccanica</b>: se un sistema è vincolato da $k$ equazioni indipendenti, lo spazio delle configurazioni è una sottovarietà di dimensione $n-k$, e le <b>velocità ammissibili</b> sono esattamente il nucleo del differenziale dei vincoli. I moltiplicatori di Lagrange sono la lettura duale di questa frase: la reazione vincolare vive nell&rsquo;ortogonale, cioè nell&rsquo;immagine della trasposta.</p>`}
]},

/* ---------------- 03 · MISURA NULLA ---------------- */
{ num:'03', title:'Insiemi di misura nulla, e come si trasportano su una varieta', meta:'la definizione con i cubi · Fubini per la misura nulla · il grafico · e la curva di Peano',
  blocchi:[
  {t:'prosa', title:'La definizione, e le tre proprieta che servono', tag:'grammatica', html:R`
  <p>$A\subseteq\mathbb{R}^n$ ha <b>misura nulla</b> se per ogni $\epsilon>0$ si può coprire con una famiglia numerabile di cubi di volume totale $<\epsilon$. <b>Non serve la teoria della misura di Lebesgue</b>: questa definizione elementare basta per tutto il corso, ed è quella che Diverio usa.</p>
  <p>Tre fatti, ed è tutto ciò che serve:</p>
  <ul>
   <li><b>unione numerabile</b> di insiemi di misura nulla ha misura nulla;</li>
   <li><b>versione elementare di Fubini</b>: se ogni sezione di $A$ con un iperpiano coordinato ha misura nulla in $\mathbb{R}^{n-1}$, allora $A$ ha misura nulla in $\mathbb{R}^n$. È lo strumento tecnico della dimostrazione di Sard;</li>
   <li><b>il grafico di una funzione continua</b> $g:\mathbb{R}^{n-1}\to\mathbb{R}$ ha <b>misura nulla</b> in $\mathbb{R}^n$, e un sottospazio affine proprio pure.</li>
  </ul>
  <p><b>Il fatto che rende la nozione trasportabile</b>: una mappa <b>liscia</b> (anzi, $C^1$, o anche solo localmente lipschitziana) manda insiemi di misura nulla in insiemi di misura nulla. Quindi «misura nulla su una varietà» si può definire come «di misura nulla in ogni carta», e la definizione <b>non dipende dall&rsquo;atlante</b>. Senza questo, l&rsquo;enunciato di Sard non avrebbe nemmeno senso su una varietà.</p>
  <div class="note"><b>E il controesempio che spiega perché serve la liscezza</b>, che Diverio cita l&rsquo;08/11: la <b>curva di Peano</b> è continua e manda un segmento — di misura nulla in $\mathbb{R}^2$ — su tutto un quadrato, che di misura nulla non è. <b>La continuità non basta</b>: serve un controllo sulla dilatazione locale, e la lipschitzianità lo dà. È il tipo di controesempio che va ricordato non per sé, ma perché dice esattamente quale ipotesi sta lavorando.</div>`}
]},

/* ---------------- 04 · IL TEOREMA FONDAMENTALE DELL'ALGEBRA ---------------- */
{ num:'04', title:'Il Teorema Fondamentale dellAlgebra, dimostrato con la geometria', meta:'il numero di preimmagini e localmente costante · compattezza · e la dimostrazione in cinque righe',
  blocchi:[
  {t:'reveal', title:'La dimostrazione', tag:'idea', steps:[
   {label:'Il lemma', body:R`
   <p>Se $F:M\to N$ è liscia con $M$ <b>compatta</b>, $N$ connessa, e $\dim M=\dim N$, allora sul luogo dei valori regolari il <b>numero di preimmagini è finito e localmente costante</b>.</p>
   <p><b>Perché</b>: sopra un valore regolare $c$ il differenziale è invertibile, quindi $F$ è un diffeomorfismo locale attorno a ciascun punto della fibra; la fibra è discreta e chiusa in un compatto, dunque <b>finita</b>; e i diffeomorfismi locali permettono di seguire ciascuna preimmagine muovendo $c$ di poco. <b>Compattezza + rango massimo = un numero intero che non cambia.</b></p>`},
   {label:'Lapplicazione', body:R`
   <p>Sia $p$ un polinomio complesso non costante. Lo si estende a una mappa $\hat p:S^{2}\to S^{2}$ della <b>sfera di Riemann</b> (che è $\mathbb{C}\cup\{\infty\}$, e l&rsquo;hai già incontrata in Metodi, me-01b), ponendo $\hat p(\infty)=\infty$. È liscia, e $S^2$ è compatta e connessa.</p>
   <p>I punti critici sono gli zeri di $p'$: <b>finiti</b>. Quindi i valori critici sono finiti, e il complementare — i valori regolari — è connesso. Su di esso il numero di preimmagini è localmente costante, dunque <b>costante</b>: chiamiamolo $k$.</p>
   <p>Se $p$ non avesse radici, la fibra sopra $0$ sarebbe vuota e $k=0$; ma allora la fibra sarebbe vuota sopra <i>ogni</i> valore regolare, cioè $\hat p$ avrebbe immagine finita — impossibile per una mappa non costante e continua su un connesso. <b>Quindi $k\ge1$: il polinomio ha una radice.</b></p>`}
  ]},
  {t:'prosa', title:'Perche questa dimostrazione vale la pena', tag:'sintesi', html:R`
  <p>Non è la più corta — quella con il teorema di Liouville (Metodi) sta in tre righe. <b>Ma è la più istruttiva</b>, perché mostra il meccanismo che regge tutta la topologia differenziale: <i>un numero intero definito contando preimmagini, che non cambia sotto deformazione continua</i>. Quel numero è il <b>grado</b> di una mappa, e da lì arrivano il teorema di Poincaré-Hopf (gd-07), l&rsquo;indice dei campi vettoriali, e i numeri quantici topologici della fisica.</p>
  <p><b>La condizione che fa tutto è la compattezza</b>: senza, le preimmagini possono «scappare all&rsquo;infinito» e il conteggio non è stabile. È la stessa ragione per cui in gd-09 servirà la <i>propriezza</i> — che è la compattezza richiesta solo dove serve.</p>`}
]},

/* ---------------- 04b · LA DIMOSTRAZIONE, E I GRUPPI DI MATRICI ---------------- */
{ num:'04b', title:'Da dove viene il teorema, e il suo uso sistematico sui gruppi', meta:'la dimostrazione dalla funzione implicita · O(n), SL(n), il gruppo simplettico · e perche il contro-spazio giusto e meta del lavoro',
  blocchi:[
  {t:'prosa', title:'La dimostrazione, che e il teorema della funzione implicita travestito', tag:'derivazione', html:R`
  <p>L&rsquo;enunciato dice che se $c$ è un valore regolare di $F:M^{m}\to N^{n}$, allora $F^{-1}(c)$ è una sottovarietà di dimensione $m-n$. <b>La dimostrazione è breve</b> e vale la pena averla vista, perché mostra che non c&rsquo;è niente di nuovo rispetto all&rsquo;analisi.</p>
  <p>Sia $p\in F^{-1}(c)$. Per il teorema del rango — o direttamente per la funzione implicita — esistono carte attorno a $p$ e a $c$ in cui $F$ si legge come la <b>proiezione canonica</b></p>
  $$(x^{1},\dots,x^{m})\longmapsto(x^{1},\dots,x^{n}).$$
  <p>In quelle coordinate $F^{-1}(c)$ diventa $\{x^{1}=0,\dots,x^{n}=0\}$, cioè un pezzo del piano coordinato generato dalle ultime $m-n$ variabili. <b>Ma una carta in cui l&rsquo;insieme è un pezzo di piano coordinato è esattamente una carta adattata</b>, e la definizione di sottovarietà chiede proprio questo. La dimensione si legge dal conto delle variabili libere.</p>
  <p><b>E lo spazio tangente esce dallo stesso conto</b>: nella forma normale il tangente alla fibra è generato dagli ultimi $m-n$ vettori coordinati, che sono il nucleo del differenziale della proiezione. Tornando indietro,</p>
  $$T_p\left(F^{-1}(c)\right)=\ker dF_p.$$
  <p>Il conto delle dimensioni torna: $\dim\ker dF_p=m-\mathrm{rk}\,dF_p=m-n$, che è la dimensione della fibra. <b>Il teorema del rango-nullità dell&rsquo;algebra lineare, applicato punto per punto, è tutto ciò che c&rsquo;è dietro.</b></p>
  <p>È la formula che si usa continuamente, e che collega il movimento sul tangente a questo: <b>il tangente a un insieme di livello è il nucleo del differenziale del vincolo</b>. Per la sfera, dove $F=|x|^{2}$ e $dF_p(v)=2\langle p,v\rangle$, il nucleo è $p^{\perp}$ — e si ritrova il piano ortogonale al raggio senza esibire curve.</p>`},
  {t:'reveal', title:'I gruppi classici, tutti con lo stesso metodo', tag:'esame', steps:[
   {label:'La ricetta, e il passo dove si sbaglia', body:R`
   <p>Ogni gruppo di matrici definito da un vincolo si tratta così: (1) si scrive il vincolo come $F(A)=c$; (2) <b>si sceglie con cura lo spazio d&rsquo;arrivo</b>; (3) si calcola $dF$ lungo curve $\gamma(t)$ con $\gamma(0)=A$; (4) si verifica la suriettività; (5) la dimensione è $\dim(\text{ambiente})-\dim(\text{arrivo})$.</p>
   <p><b>Il passo 2 è quello che decide l&rsquo;esito</b>, ed è dove si perde il conto. Il vincolo $A^{T}A=I$ sembra imporre $n^{2}$ condizioni, ma $A^{T}A$ è <i>automaticamente</i> simmetrica: lo spazio d&rsquo;arrivo naturale è quello delle matrici simmetriche, di dimensione $\frac{n(n+1)}{2}$. Contare male qui dà una dimensione sbagliata e una suriettività che non si riesce a dimostrare — e il secondo sintomo è il segnale che il primo errore c&rsquo;è stato.</p>`},
   {label:'Ortogonale e speciale lineare', body:R`
   <p><b>$O(n)$</b>: con $F(A)=A^{T}A$ a valori nelle simmetriche, $dF_A(H)=A^{T}H+H^{T}A$. Dato $S$ simmetrica, la scelta $H=\tfrac12AS$ dà $dF_A(H)=\tfrac12(S+S)=S$: suriettivo. Quindi $\dim O(n)=n^{2}-\frac{n(n+1)}{2}=\frac{n(n-1)}{2}$, e</p>
   $$T_I\,O(n)=\{H:H^{T}+H=0\},$$
   <p>le antisimmetriche. <b>$SL(n)$</b>: con $F=\det$ a valori in $\mathbb{R}$, $dF_A(H)=\det(A)\mathrm{tr}(A^{-1}H)$, non nullo per $A$ invertibile. Quindi $\dim SL(n)=n^{2}-1$ e $T_I\,SL(n)$ sono le matrici a traccia nulla.</p>`},
   {label:'Il gruppo simplettico, e il controllo che smaschera lerrore', body:R`
   <p><b>$Sp(2n)=\{A:A^{T}JA=J\}$</b> con $J$ la matrice simplettica standard. Qui $A^{T}JA$ è <b>antisimmetrica</b> per ogni $A$ — si verifica trasponendo — quindi lo spazio d&rsquo;arrivo sono le antisimmetriche, di dimensione $\frac{2n(2n-1)}{2}=n(2n-1)$. Ne segue</p>
   $$\dim Sp(2n)=4n^{2}-n(2n-1)=n(2n+1).$$
   <p>Per $n=1$ fa $3$, e infatti $Sp(2)=SL(2,\mathbb{R})$, che ha dimensione $4-1=3$. <b>Questo è il controllo che conviene sempre fare</b>: verificare la formula nel caso più piccolo, dove il gruppo è noto per altra via. Se i due numeri non coincidono, l&rsquo;errore è quasi certamente nello spazio d&rsquo;arrivo.</p>
   <p>Lo stesso metodo dà i gruppi unitari: per $U(n)=\{A:A^{*}A=I\}$ lo spazio d&rsquo;arrivo sono le matrici <b>hermitiane</b>, di dimensione reale $n^{2}$, e siccome $M_n(\mathbb{C})$ ha dimensione reale $2n^{2}$ si ottiene $\dim U(n)=n^{2}$. Per $n=1$ fa $1$: $U(1)$ è la circonferenza, il gruppo delle fasi — e la sua comparsa in elettrodinamica quantistica come gruppo di gauge è la ragione per cui quel conto banale vale la pena di essere fatto.</p>
  <p><b>La regola che emerge dai casi visti</b>: quando il vincolo è «preservare una forma bilineare», lo spazio d&rsquo;arrivo ha la <i>stessa simmetria della forma</i> — simmetrica per il prodotto scalare, antisimmetrica per quella simplettica — e il tangente nell&rsquo;identità ha la simmetria <i>opposta</i>. È una regola mnemonica, ma nasce dal conto e si può ricostruire in trenta secondi derivando il vincolo.</p>`}
  ]},
  {t:'prosa', title:'Che cosa garantisce che i valori regolari esistano', tag:'struttura', html:R`
  <p>Tutto il metodo poggia su un presupposto che finora non è stato discusso: <b>che un valore regolare ci sia</b>. Un teorema che dice «se $c$ è regolare allora la fibra è liscia» sarebbe inutile se i valori regolari fossero rari o difficili da trovare.</p>
  <p>Negli esempi concreti la questione non si pone, perché si verifica direttamente che il gradiente non si annulla dove serve. Ma in generale la risposta è molto più forte di quanto serva, ed è il <b>teorema di Sard</b>: l&rsquo;insieme dei valori critici di una mappa liscia ha <b>misura nulla</b>. Quindi non solo i valori regolari esistono: sono <i>quasi tutti</i>, e un valore preso a caso è regolare con probabilità uno.</p>
  <p><b>Il ponte fra i due enunciati è il modo in cui si usano insieme</b>, e vale la pena vederlo come tecnica: quando si vuole dimostrare che «esiste un oggetto con una certa proprietà», spesso si costruisce una mappa i cui valori regolari danno oggetti buoni, si invoca Sard per dire che ne esiste almeno uno, e si conclude senza esibirlo. <b>È una dimostrazione di esistenza non costruttiva</b>, e il teorema di immersione di Whitney — che ogni varietà si immerge in uno spazio euclideo di dimensione abbastanza alta — si ottiene esattamente così: si parte da un&rsquo;immersione in dimensione grande e si proietta lungo una direzione scelta fra quelle non critiche, che Sard garantisce essere quasi tutte.</p>
  <p><b>La nozione di misura nulla che serve è quella elementare</b>, e non richiede la teoria della misura: un insieme $A\subseteq\mathbb{R}^{n}$ ha misura nulla se per ogni $\varepsilon>0$ si copre con una famiglia numerabile di cubi di volume totale minore di $\varepsilon$. Da qui due proprietà che si usano di continuo: l&rsquo;unione numerabile di insiemi di misura nulla ha misura nulla, e un insieme di misura nulla ha <b>parte interna vuota</b> — quindi il suo complementare è denso, ed è questo che dà l&rsquo;esistenza.</p>
  <p><b>E la nozione si trasporta su una varietà</b> senza bisogno di una misura canonica: si dice che $A\subseteq M$ ha misura nulla se $\varphi(A\cap U)$ ha misura nulla in $\mathbb{R}^{n}$ per ogni carta. La definizione è ben posta perché i diffeomorfismi mandano insiemi di misura nulla in insiemi di misura nulla — conseguenza del fatto che sono localmente lipschitziani — ed è uno dei pochi punti del corso in cui una proprietà metrica sopravvive pur non essendoci nessuna metrica.</p>`},
  {t:'plot', title:'Livelli regolari e livelli critici della stessa funzione',
   intro:R`Curve di livello di $F(x,y)=x^{2}-y^{2}$ (una sella). Il livello $0$ contiene l'origine, che è l'unico punto critico; tutti gli altri livelli sono regolari e sono curve lisce.`,
   plots:[
    {kind:'contour', f:'x*x-y*y', xr:[-2.2,2.2], yr:[-2.2,2.2], height:340,
     levels:[-2,-1,-0.3,0.3,1,2], col:'#5eead4', label:'livelli regolari',
     overlays:[{f:'x*x-y*y', levels:[0], col:'#ff6b6b', label:'livello critico (c=0)', width:2.6}],
     grad:{fx:'2*x', fy:'-2*y', label:'grad F', n:9},
     marks:[{x:0, y:0, label:'punto critico: grad F = 0', col:'#ffffff', up:true}]}
   ],
   leggi:R`<p><b>Tutte le curve verdi sono iperboli lisce</b> — sottovarietà di dimensione $2-1=1$, come il teorema prescrive — mentre la rossa è una <i>croce</i>, e nell'origine non è una varietà. La differenza fra le due situazioni è tutta nel gradiente, che si annulla soltanto lì.</p>
   <p>Guarda le frecce del gradiente: sono perpendicolari ai livelli e si accorciano avvicinandosi all'origine, fino a sparire. <b>Dove il gradiente è non nullo, la curva di livello ha una tangente ben definita e vale $T_p=\ker dF_p$</b>; nell'origine il nucleo è tutto il piano, e infatti l'insieme ha due direzioni tangenti anziché una.</p>
   <p><b>Il punto che questa figura rende visibile</b>: «valore critico» è una proprietà del <i>codominio</i>, non del dominio. Il valore $c=0$ è critico perché la sua fibra contiene un punto critico; tutti gli altri valori reali sono regolari, benché la funzione abbia un punto critico. <b>I valori critici di questa funzione sono un solo numero su tutta la retta reale</b>, ed è l'osservazione che il teorema di Sard generalizza: i valori critici sono sempre pochissimi.</p>`}
]},

/* ---------------- 04c · ESERCIZI ---------------- */
{ num:'04c', title:'Esercizi — tocca a te', meta:'lo spazio tangente a un gruppo · una fibra che cambia topologia · e un vincolo mal posto',
  blocchi:[
  {t:'esercizio', title:'1 · SU(2), e perche e una sfera',
   src:'il gruppo che compare in meccanica quantistica, trattato con questo metodo',
   testo:R`Sia $SU(2)=\{A\in M_2(\mathbb{C}):A^{*}A=I,\ \det A=1\}$. Trova la sua dimensione reale e mostra che è diffeomorfo a $S^{3}$.`,
   steps:[
    {label:'La forma esplicita', body:R`
    <p>Imponendo le due condizioni su una matrice complessa $2\times2$ si trova che ogni elemento di $SU(2)$ si scrive</p>
    $$A=\begin{pmatrix}\alpha&-\bar\beta\\\beta&\bar\alpha\end{pmatrix},\qquad |\alpha|^{2}+|\beta|^{2}=1,$$
    <p>con $\alpha,\beta$ complessi. <b>La coppia $(\alpha,\beta)$ è un punto di $\mathbb{C}^{2}\cong\mathbb{R}^{4}$ di norma uno</b>, cioè un punto di $S^{3}$, e la corrispondenza è biunivoca e liscia in entrambi i versi — un <span class="str" data-str="omeomorfismo">omeomorfismo</span>, e anzi un diffeomorfismo, perché entrambe le mappe sono restrizioni di applicazioni lineari fra gli spazi ambiente. <b>Quindi $SU(2)\cong S^{3}$</b>, dimensione reale $3$.</p>
    <p><b>È un fatto con conseguenze fisiche</b>, e vale la pena nominarle: $SU(2)$ è il gruppo che descrive lo spin $1/2$, e il suo essere una sfera tridimensionale — semplicemente connessa — è la ragione per cui esso è il rivestimento universale di $SO(3)$, il gruppo delle rotazioni. Il rivestimento è a due fogli, e quel «due» è esattamente il motivo per cui una rotazione di $2\pi$ cambia segno alla funzione d'onda di un elettrone mentre lascia invariato ogni oggetto classico.</p>`},
    {label:'Lo stesso risultato con il criterio', body:R`
    <p>Senza esibire la forma: si prende $F(A)=A^{*}A$ a valori nelle matrici <b>hermitiane</b> $2\times2$, che come spazio reale ha dimensione $4$. Lo spazio di partenza $M_2(\mathbb{C})$ ha dimensione reale $8$, quindi $U(2)$ ha dimensione $8-4=4$; aggiungendo il vincolo $\det A=1$, che toglie una dimensione reale (il determinante di una matrice unitaria ha modulo uno, quindi il vincolo è sulla sola fase), si ottiene $\dim SU(2)=3$. <b>I due conti concordano</b>, ed è il controllo che si fa sempre.</p>
    <p>Il tangente nell'identità si ottiene derivando: da $A^{*}A=I$ segue $H^{*}+H=0$, matrici <b>antihermitiane</b>; aggiungendo $\mathrm{tr}(H)=0$ dal determinante si ottiene $\mathfrak{su}(2)$, generato dalle tre matrici di Pauli moltiplicate per $i$. <b>Sono i generatori dello spin in meccanica quantistica</b>, ed emergono qui da un conto puramente geometrico.</p>`}
   ]},
  {t:'plot', title:'Le tre fibre dellesercizio, e il cono che sta in mezzo',
   intro:R`Sezioni nel piano $(\rho,z)$, con $\rho=\sqrt{x^{2}+y^{2}}$, dei livelli di $F=\rho^{2}-z^{2}$. Ogni curva, ruotata attorno all'asse $z$, dà la superficie corrispondente.`,
   plots:[
    {kind:'contour', f:'x*x-y*y', xr:[-3,3], yr:[-3,3], height:340,
     levels:[1,2], col:'#5eead4', label:'c > 0: una falda',
     overlays:[{f:'x*x-y*y', levels:[0], col:'#ff6b6b', label:'c = 0: il cono', width:2.6},
               {f:'x*x-y*y', levels:[-1,-2], col:'#b98cff', label:'c < 0: due falde'}],
     title:'una famiglia continua di superfici, e una sola non liscia'}
   ],
   leggi:R`<p><b>Le curve verdi e quelle viola non si toccano mai</b>, e fra le due famiglie c'è solo la croce rossa. Ruotando: per $c>0$ si ottiene un iperboloide a una falda — una superficie connessa con un «collo» che si stringe al calare di $c$; per $c<0$ due falde separate; per $c=0$ il collo si è chiuso in un punto.</p>
   <p><b>La famiglia è continua, la topologia no.</b> Si può passare con continuità da $c=1$ a $c=-1$ facendo variare il parametro, ma la superficie non può deformarsi con continuità da «connessa» a «due pezzi» restando liscia: deve rompersi, e si rompe esattamente nel valore critico. <b>È il motivo per cui i valori critici sono interessanti</b> — sono i soli punti in cui può succedere qualcosa.</p>
   <p><b>E si vede anche perché il cono non è una varietà</b>: è l'unica delle curve disegnate che si autointerseca. Tutte le altre, in ogni loro punto, hanno un intorno che è un arco; la croce nell'origine ha un intorno fatto di quattro bracci. <b>La stessa figura contiene dunque sia la famiglia di esempi positivi sia il controesempio</b>, ed è il modo più economico di tenere insieme le due cose.</p>`},
  {t:'esercizio', title:'2 · Quando il valore e critico: la fibra che cambia forma',
   src:'il caso in cui il teorema tace, e si guarda cosa succede davvero',
   testo:R`Sia $F:\mathbb{R}^{3}\to\mathbb{R}$, $F(x,y,z)=x^{2}+y^{2}-z^{2}$. Trova i valori critici e descrivi $F^{-1}(c)$ per $c>0$, $c=0$, $c<0$.`,
   steps:[
    {label:'I valori critici', body:R`
    <p>$\nabla F=(2x,2y,-2z)$ si annulla solo nell'origine, dove $F=0$. <b>Quindi l'unico valore critico è $c=0$</b>, e tutti gli altri sono regolari — perciò le loro fibre sono superfici lisce di dimensione $3-1=2$.</p>`},
    {label:'Le tre fibre, e la transizione', body:R`
    <p>Conviene ragionare per sezioni: intersecando con un piano $z=k$ si ottiene la circonferenza $x^{2}+y^{2}=c+k^{2}$, che è non vuota quando $c+k^{2}\ge0$. Per $c>0$ questo accade per ogni $k$; per $c<0$ solo per $|k|\ge\sqrt{-c}$, e da lì la separazione in due pezzi.</p>
   <p><b>$c>0$</b>: iperboloide a <i>una falda</i>, connesso, che si avvicina al cono all'infinito. <b>$c<0$</b>: iperboloide a <i>due falde</i>, con due componenti connesse. <b>$c=0$</b>: il cono, che non è una varietà nel vertice.</p>
    <p><b>Il cono è il momento della transizione</b>: attraversando $c=0$ la superficie passa da una a due componenti, e non può farlo restando liscia — deve pizzicarsi. <b>Il valore critico è esattamente dove la topologia della fibra cambia</b>, e questa è l'osservazione centrale della teoria di Morse. Il teorema dei valori regolari, letto al contrario, dice che finché non si incontra un valore critico la fibra non cambia forma: è un <i>fibrato</i> sopra ogni intervallo di valori regolari.</p>
    <p><b>La conseguenza pratica per gli esercizi</b>: quando si chiede «per quali $c$ l'insieme è una varietà, e di che tipo», la risposta si ottiene sempre in due mosse — trovare i valori critici, e poi studiare separatamente ciascuno degli intervalli in cui essi dividono il codominio.</p>`}
   ]},
  {t:'collaudo', title:'Controlla di aver capito', html:R`
  <ol>
  <li>Un valore $c$ non assunto da $F$ è regolare o critico?</li>
  <li>Perché il teorema dà una condizione sufficiente e non necessaria?</li>
  <li>Che cosa garantisce che $F^{-1}(c)$ sia di Hausdorff e a base numerabile?</li>
  </ol>`,
   sol:R`<ol>
   <li><b>Regolare</b>, per vacuità: la condizione «per ogni $p\in F^{-1}(c)$ il differenziale è suriettivo» è soddisfatta quando la fibra è vuota. E il teorema resta vero, perché l'insieme vuoto è una sottovarietà di qualunque dimensione. <b>Sembra un cavillo e serve</b>: nel teorema di Sard si afferma che quasi ogni valore è regolare, e senza questa convenzione bisognerebbe escludere a mano i valori non assunti.</li>
   <li>Perché la conclusione può valere anche dove l'ipotesi cade: l'insieme $\{y^{3}=x^{3}\}$ ha gradiente nullo nell'origine ed è una retta, quindi una varietà. <b>Il teorema fornisce un certificato, non una caratterizzazione</b>: quando il certificato manca bisogna guardare l'insieme con altri strumenti, tipicamente un argomento di connessione locale.</li>
   <li>Le eredita da $M$, essendo un <span class="str" data-str="omeomorfismo">sottospazio topologico</span> con la topologia indotta: entrambe le proprietà passano ai sottospazi. <b>È il vantaggio delle sottovarietà rispetto alle varietà astratte</b>, dove invece vanno verificate; e se $M$ è <span class="str" data-str="compattezza">compatta</span> anche la fibra lo è, perché è chiusa in un compatto — fatto che si usa continuamente per i gruppi come $O(n)$ e $SU(2)$.</li>
   </ol>`}
]},

/* ---------------- 05 · IL SENSO ---------------- */
{ num:'05', title:'Il senso, e le rotte', meta:'cosa apre, e dove i valori regolari sono lo strumento',
  blocchi:[
  {t:'prosa', title:'Cosa lascia in mano', tag:'sintesi', html:R`
  <p><b>Il punto.</b> Due strumenti: un <b>criterio</b> per riconoscere sottovarietà (e produce quasi tutti gli esempi che servono), e una <b>nozione di «quasi ovunque»</b> che ha senso su una varietà. Il secondo serve perché il criterio funziona solo sui valori regolari — e senza sapere che sono quasi tutti, non si saprebbe quanto vale.</p>
  <p><b>A valle.</b> gd-09 studia quando l&rsquo;<i>immagine</i> di una mappa è una sottovarietà, che è il problema opposto; gd-10 dimostra Sard, cioè che i valori critici sono di misura nulla.</p>`},
  {t:'prolessi', title:'Dove riappare questo movimento',
   oggetto:R`<b>Il teorema del valore regolare</b>: un&rsquo;equazione che definisce una varietà, purché il differenziale non degeneri.`,
   rotte:[
    {dove:'Meccanica<br>analitica', txt:R`I <b>vincoli olonomi</b> definiscono lo spazio delle configurazioni come fibra di un valore regolare; la dimensione è $n$ meno il numero di vincoli indipendenti, e «indipendenti» significa esattamente «differenziale suriettivo». <b>I gradi di libertà si contano con questo teorema.</b>`},
    {dove:'Meccanica<br>statistica', txt:R`La <b>superficie di energia costante</b> $H^{-1}(E)$ è la fibra di un valore regolare, ed è la varietà su cui vive l&rsquo;ensemble microcanonico. Che sia una sottovarietà liscia — e quindi che ci si possa integrare sopra — è questo teorema.`},
    {dove:'Teoria<br>dei campi', txt:R`Lo <b>spazio dei vuoti</b> di una teoria è la fibra del minimo del potenziale; la sua topologia decide quali difetti topologici esistono (vortici, monopoli, stringhe cosmiche). <b>Contare i gradi di libertà dei bosoni di Goldstone è un conto di dimensioni come quelli qui.</b>`},
    {dove:'Ottimizzazione<br>vincolata', txt:R`I <b>moltiplicatori di Lagrange</b> sono la lettura duale del teorema: il gradiente dell'obiettivo sta nell'ortogonale al tangente del vincolo, cioe' nell'immagine della trasposta del differenziale.`}
   ],
   domanda:R`Il criterio funziona solo se $c$ è un valore regolare, e finora nulla garantisce che ce ne siano. Potrebbe darsi che una mappa abbia <b>tutti</b> i valori critici? <b>Domanda che porti avanti, ed è quella che gd-10 risolve:</b> quanto sono «pochi» i valori critici? La risposta di Sard è netta — <b>hanno misura nulla, sempre</b>, per ogni mappa liscia fra varietà qualsiasi. È un teorema sorprendentemente forte: dice che una mappa liscia non può schiacciare troppo, e la sua dimostrazione è tutta un controllo di quanto una funzione può dilatare gli insiemi piccoli.`}
]}

var byId = {}; TAPPE.forEach(function(s){ byId[s.num]=s; });

var VKEY='pm-nucleogd-08-visited';
function loadSeen(){ try{ return new Set(JSON.parse(localStorage.getItem(VKEY)||'[]')); }catch(e){ return new Set(); } }
function saveSeen(s){ try{ localStorage.setItem(VKEY, JSON.stringify(Array.from(s))); }catch(e){} }
var SEEN = loadSeen();

function renderNav(active){
  var nav=document.getElementById('sidebar');
  nav.innerHTML='';
  var h=document.createElement('h2'); h.textContent='Nucleo gd-08 · le tappe'; nav.appendChild(h);
  TAPPE.forEach(function(s){
    var b=document.createElement('button');
    b.className='navitem'+(active===s.num?' active':'')+(SEEN.has(s.num)?' seen':'');
    b.innerHTML='<span class="dot"></span><span class="nx">'+s.num+'</span><span>'+s.title+'</span>';
    b.onclick=function(){ showTappa(s.num); };
    nav.appendChild(b);
  });
}

/* ---- renderer dei blocchi ---- */
function sectionProsa(title, tag, html){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var body=elFromHTML('<div class="open-body">'+html+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function sectionGram(title, rows){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag gramtag">grammatica</span></h3>';
  var inner='<table class="gramtab">';
  rows.forEach(function(r){ inner+='<tr><td class="gs">'+r[0]+'</td><td>'+r[1]+'</td></tr>'; });
  inner+='</table>';
  var body=elFromHTML('<div class="gramwrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
/* --- blocco PLOT: la figura non decora, si legge. Ogni plot porta una chiave di lettura. --- */
function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';
  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
    else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
    else if(b.t==='prolessi') m.appendChild(sectionProlessi(b));
    else if(b.t==='reveal')m.appendChild(sectionReveal(b.title,b.tag,b.steps));
    else if(b.t==='esercizio') m.appendChild(sectionEsercizio(b));
    else if(b.t==='collaudo')  m.appendChild(sectionCollaudo(b.title,b.items));
    else if(b.t==='plot')      m.appendChild(sectionPlot(b));
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}
