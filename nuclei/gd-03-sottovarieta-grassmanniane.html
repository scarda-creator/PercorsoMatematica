<title>Movimento gd-03 — Costruire varietà: sottovarietà localmente chiuse e la Grassmanniana</title>

<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

<!-- La barra di casa: un nucleo senza di lei e' un vicolo cieco - si arrivava qui
     e l'unica uscita era il tasto indietro del browser, che dall'app installata
     sulla schermata Home non c'e'. Porta anche i due movimenti accanto, letti
     dall'indice: l'ordine non e' scritto nel nucleo e non puo' sfasarsi. -->
<script defer src="../nav-tengri.js"></script>

<style>
  :root{
    --bg:#0e1117; --panel:#161b22; --panel2:#1c232d; --border:#2b333d;
    --txt:#eef3f8; --muted:#b9c4d1; --accent:#4c8dff; --accent2:#8fb0ff;
    --ok:#2ea043; --okbg:#10331b; --warn:#d8a13a; --warnbg:#332a10;
    --gram:#5eead4; --grambg:#0f2a26;
    --pro:#b98cff; --probg:#1a1430; --proline:#2a2247; --proedge:#3a2d5c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    font-size:17px;line-height:1.55;}
  a{color:var(--accent2);}
  .banner{background:var(--panel2);border-bottom:1px solid var(--border);color:var(--muted);
    font-size:.8rem;font-weight:600;text-align:center;padding:8px 12px;letter-spacing:.3px;}
  .banner b{color:var(--accent2);}
  .shell{display:flex;max-width:1180px;margin:0 auto;align-items:flex-start;}

  /* ---- SIDEBAR ---- */
  .sidebar{width:280px;flex:0 0 280px;padding:20px 12px 60px;position:sticky;top:0;
    max-height:100vh;overflow-y:auto;border-right:1px solid var(--border);}
  .sidebar h2{font-size:.72rem;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);
    margin:18px 8px 8px;}
  .navitem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:none;
    background:transparent;color:var(--txt);padding:9px 10px;border-radius:8px;cursor:pointer;
    font-size:.9rem;transition:.12s;border:1px solid transparent;}
  .navitem:hover{background:var(--panel2);}
  .navitem.active{background:#13233f;border-color:var(--accent);color:#fff;}
  .navitem .dot{width:7px;height:7px;border-radius:50%;background:transparent;flex:0 0 7px;
    border:1px solid var(--border);}
  .navitem.seen .dot{background:var(--ok);border-color:var(--ok);}
  .navitem .nx{color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto;}

  /* ---- MAIN ---- */
  .main{flex:1 1 auto;min-width:0;padding:24px 30px 90px;max-width:860px;}
  h1{font-size:1.5rem;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:.92rem;margin:0 0 18px;}
  .sfhead{border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:8px;}
  .sfhead h1{font-size:1.55rem;}
  .meta{color:var(--muted);font-size:.82rem;margin-top:6px;}

  .section{margin:26px 0;}
  .section > h3{font-size:1.02rem;color:var(--accent2);margin:0 0 10px;
    display:flex;align-items:center;gap:10px;}
  .section > h3 .tag{font-size:.66rem;font-weight:700;letter-spacing:.4px;background:var(--panel2);
    border:1px solid var(--border);color:var(--muted);padding:2px 8px;border-radius:20px;
    text-transform:uppercase;}
  /* --- blocchi figura --- */
  .section > h3 .tag.plottag{background:#101f2e;border-color:#1f3c57;color:#7ab8e0;}
  .plot-intro{color:var(--muted);font-size:.95rem;margin:0 0 12px;}
  .plot-row{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;
    background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;}
  .plot-row.due .plot-box{flex:1 1 300px;min-width:280px;}
  .plot-box{max-width:560px;}
  .plot-leggi{margin-top:10px;background:var(--panel2);border:1px solid var(--border);
    border-left:3px solid #4a8fc7;border-radius:0 10px 10px 0;padding:11px 14px;
    font-size:.93rem;color:var(--muted);}
  .plot-leggi b{color:#7ab8e0;}
  .plot-err{color:#ff6b6b;font-size:.85rem;}
  .open-body{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
  .open-body p:first-child{margin-top:0;} .open-body p:last-child{margin-bottom:0;}
  .open-body ul{margin:.4em 0;padding-left:1.2em;} .open-body li{margin:.35em 0;}

  .note{background:var(--panel2);border-left:3px solid var(--muted);border-radius:6px;
    padding:9px 12px;margin:12px 0;font-size:.9rem;color:var(--muted);}
  .note b{color:#ff9d6b;}
  .note.warn{background:var(--warnbg);border-left-color:var(--warn);color:#e0b85a;}
  .note.warn b{color:#f0c25a;}

  /* ---- GRAMMATICA ---- */
  .gramwrap{background:var(--grambg);border:1px solid #1f4d47;border-radius:12px;padding:6px 6px;}
  table.gramtab{border-collapse:collapse;width:100%;font-size:.92rem;}
  table.gramtab td{padding:9px 12px;vertical-align:top;border-bottom:1px solid #17332e;}
  table.gramtab tr:last-child td{border-bottom:none;}
  table.gramtab td.gs{white-space:nowrap;color:var(--gram);width:1%;
    border-right:1px solid #17332e;font-variant-numeric:tabular-nums;}
  .section > h3 .tag.gramtag{background:var(--grambg);border-color:#1f4d47;color:var(--gram);}

  /* ---- STRUMENTI (repertorio condiviso: la scheda si apre DENTRO la frase) ----
     Nessun accento nuovo: riusa il verde della grammatica, perche' uno strumento
     richiamato e' grammatica gia' spiegata altrove, non una quinta specie di blocco. */
  .str{color:var(--gram);border-bottom:1px dashed var(--gram);cursor:pointer;}
  .str:hover{background:var(--grambg);}
  .str::after{content:"\2666";font-size:.62em;vertical-align:.42em;margin-left:2px;opacity:.8;}
  .str.aperto::after{content:"\2715";}
  .str.rotto{color:#ff6b6b;border-bottom-color:#ff6b6b;cursor:help;}
  /* la scheda e' uno SPAN in display:block, non un div: i rimandi cadono dentro
     <p>, <li> e celle di tabella, dove un div e' HTML illegale. */
  .strcard{display:block;margin:10px 0;background:var(--grambg);border:1px solid #1f4d47;
    border-left:3px solid var(--gram);border-radius:0 10px 10px 0;padding:10px 14px;font-size:.9rem;}
  .strcard .sh{display:block;font-size:.66rem;font-weight:700;letter-spacing:.5px;
    text-transform:uppercase;color:var(--gram);margin-bottom:7px;}
  .strcard .sr{display:block;margin:5px 0;}
  .strcard .sk{color:var(--gram);font-weight:600;}

  /* ---- PROLESSI (preannuncio fisico) ---- */
  .prowrap{background:var(--probg);border:1px solid var(--proedge);border-radius:12px;padding:4px 4px 8px;}
  .prohead{padding:11px 14px 4px;color:var(--pro);font-size:.72rem;font-weight:700;letter-spacing:.7px;
    text-transform:uppercase;}
  .pro-oggetto{padding:2px 14px 11px;color:var(--muted);font-size:.92rem;border-bottom:1px solid var(--proline);
    margin-bottom:2px;} .pro-oggetto b{color:var(--txt);}
  table.protab{border-collapse:collapse;width:100%;font-size:.92rem;}
  table.protab td{padding:10px 12px;vertical-align:top;border-bottom:1px solid var(--proline);}
  table.protab tr:last-child td{border-bottom:none;}
  table.protab td.pd{white-space:nowrap;color:var(--pro);width:1%;font-weight:700;font-size:.78rem;
    letter-spacing:.3px;text-transform:uppercase;border-right:1px solid var(--proline);line-height:1.3;}
  .pro-domanda{margin:8px 8px 2px;background:#140d26;border:1px solid var(--proedge);
    border-left:3px solid var(--pro);border-radius:8px;padding:10px 14px;font-size:.92rem;}
  .pro-domanda b{color:var(--pro);}
  .section > h3 .tag.protag{background:var(--probg);border-color:var(--proedge);color:var(--pro);}

  /* ---- REVEAL ---- */
  .rsteps{display:flex;flex-direction:column;gap:12px;}
  .rstep{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 18px;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .rlabel{font-size:.7rem;font-weight:700;letter-spacing:.4px;color:var(--accent);
    text-transform:uppercase;margin-bottom:8px;}
  .rstep p:first-of-type{margin-top:0;} .rstep p:last-child{margin-bottom:0;}
  .rstep ul{margin:.4em 0;padding-left:1.2em;}
  .testo{background:#13233f;border:1px solid #2b4877;border-radius:12px;padding:14px 18px;margin-bottom:14px;}
  .testo .src{display:block;font-size:.74rem;font-style:italic;color:var(--accent2);margin-bottom:8px;
    text-transform:uppercase;letter-spacing:.3px;}
  .esame-nota{font-size:.9rem;color:var(--muted);font-style:italic;margin-top:12px;padding-left:12px;
    border-left:3px solid var(--border);}

  .reveal-btn{background:var(--accent);color:#fff;border:none;padding:11px 18px;border-radius:10px;
    font-size:.95rem;font-weight:600;cursor:pointer;margin-top:14px;transition:.12s;}
  .reveal-btn:hover:not(:disabled){background:var(--accent2);}
  .reveal-btn.small{padding:7px 14px;font-size:.85rem;margin-top:0;background:var(--panel2);
    color:var(--accent2);border:1px solid var(--border);}
  .reveal-btn.small:hover:not(:disabled){border-color:var(--accent);}
  .reveal-btn:disabled,.reveal-btn.done{background:var(--panel2);color:var(--muted);
    border:1px solid var(--border);cursor:default;}

  /* ---- COLLAUDO ---- */
  .collaudo-item{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 18px;margin-bottom:12px;}
  .cq{margin-bottom:10px;}
  .ca{margin-top:12px;background:var(--okbg);border:1px solid #235c33;border-radius:8px;
    padding:10px 14px;font-size:.94rem;}
  .ca b{color:#5fd980;}

  /* ---- PREV / NEXT ---- */
  .prevnext{display:flex;justify-content:space-between;gap:12px;margin-top:40px;
    border-top:1px solid var(--border);padding-top:20px;}
  .pnbtn{flex:1 1 0;background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:12px 16px;cursor:pointer;color:var(--txt);text-align:left;transition:.14s;font:inherit;}
  .pnbtn:hover{border-color:var(--accent);background:var(--panel2);}
  .pnbtn.next{text-align:right;}
  .pnbtn .k{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .pnbtn .t{font-weight:600;color:var(--accent2);}
  .pnbtn:disabled{opacity:.35;cursor:default;border-color:var(--border);background:var(--panel);}

  code{background:var(--panel2);border:1px solid var(--border);border-radius:5px;
    padding:1px 5px;font-size:.85em;color:var(--accent2);}
  .katex{font-size:1.02em;color:var(--txt);} .katex-display{margin:.5em 0;overflow-x:auto;overflow-y:hidden;}

  @media(max-width:860px){
    .shell{flex-direction:column;}
    .sidebar{width:100%;flex:none;position:static;max-height:none;border-right:none;
      border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:4px;}
    .sidebar h2{width:100%;} .navitem{width:auto;}
    .main{padding:20px 16px 80px;}
  }
</style>

<script>
"use strict";
const R = String.raw;

function typeset(el){
  if(el && window.renderMathInElement){
    try{ renderMathInElement(el,{delimiters:[
      {left:'$$',right:'$$',display:true},
      {left:'$',right:'$',display:false}
    ],throwOnError:false}); }catch(e){}
  }
}
function elFromHTML(html){ var d=document.createElement('div'); d.innerHTML=html; return d; }

/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un
   rimando scritto nella prosa:

       <span class="str" data-str="serie-geometrica">la serie geometrica</span>

   Le schede citate da questo nucleo sono cucite qui sotto dal montaggio
   (assembla-nucleo.js): la pagina resta autosufficiente — niente fetch,
   niente sottocartelle da pubblicare — e un rimando a una scheda che non
   esiste FERMA la costruzione invece di arrivare in pagina rotto.
   Apertura: lo stesso gesto del collaudo (si clicca, il pannello compare,
   si typeset una volta sola), portato dentro la frase.
   =================================================================== */
var CORSO = 'geometria-differenziale';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["quoziente-topologico"] = {"nome":"Topologia quoziente","riga":"Si incollano punti dichiarandoli uguali, e si decide che un insieme è aperto nel quoziente quando la sua controimmagine è aperta sopra: è il modo di costruire spazi nuovi senza metterli dentro nessun ambiente.","serve":"È la seconda fabbrica di varietà, accanto ai grafici e ai prodotti, e produce proprio gli esempi che non si vedono come sottoinsiemi di $\\mathbb{R}^n$: il toro, il nastro di Möbius, lo spazio proiettivo. La regola pratica è sempre la stessa: una funzione definita sul quoziente è continua se e solo se, composta con la proiezione, è continua sopra — quindi si lavora sempre con i rappresentanti, controllando che il risultato non dipenda da quale si è scelto. Attenzione: **un quoziente di una varietà non è automaticamente una varietà**, e la proprietà che salta per prima è Hausdorff — la retta con due origini è proprio un quoziente mal riuscito.","esempio":"La circonferenza è $\\mathbb{R}/\\mathbb{Z}$: si dichiarano uguali due numeri che differiscono per un intero, e si manda la classe di $t$ nel punto $\\left(\\cos 2\\pi t,\\ \\sin 2\\pi t\\right)$. Perché la definizione sia lecita il risultato non deve dipendere dal rappresentante, e infatti $\\cos\\!\\left(2\\pi(t+1)\\right)=\\cos 2\\pi t$ e altrettanto per il seno: la mappa passa al quoziente. Ripetendo su due fattori si ottiene il toro $\\mathbb{T}^2=\\mathbb{R}^2/\\mathbb{Z}^2$, cioè il quadrato $[0,1]^2$ con i lati opposti incollati — lo spazio delle configurazioni del pendolo doppio, dove i due angoli sono definiti a meno di un giro. Le carte si prendono restringendo la proiezione a un quadratino di lato minore di $1$: lì è iniettiva, e la sua inversa dà le coordinate.","debito":"la verifica che il quoziente sia Hausdorff e a base numerabile va fatta caso per caso e qui non c'è: per il toro e per lo spazio proiettivo la si trova in Lee, Examples 1.4 e 1.5. Nel percorso, l'unico movimento che costruisce quozienti in dettaglio è gd-01.","controllo":[{"tipo":"uguale","sinistra":"cos(2*pi*(t+1))","vale":"cos(2*pi*t)","ipotesi":{"t":"real"},"dove":"esempio","appare":"\\cos\\!\\left(2\\pi(t+1)\\right)=\\cos 2\\pi t"},{"tipo":"simbolico","perche":"e' la notazione del quoziente di R^2 per il reticolo degli interi: si sta dando un nome allo spazio costruito, non calcolando un valore","dove":"esempio","appare":"\\mathbb{R}^2/\\mathbb{Z}^2"}]};
STRUM["compattezza"] = {"nome":"Compattezza","riga":"Ogni ricoprimento aperto ammette un sottoricoprimento finito: è la proprietà che permette di passare da «vale vicino a ogni punto» a «vale su tutto», con un numero finito di passi.","serve":"È l'ipotesi che rende globali le conclusioni locali, ed è per questo che ricorre in ogni dimostrazione di geometria differenziale. In $\\mathbb{R}^n$ equivale a chiuso e limitato (Heine-Borel), ma su una varietà quell'equivalenza non si può usare come definizione, perché «limitato» richiede una distanza e una varietà non ne ha una privilegiata. La conseguenza che si usa più spesso è negativa: gli unici sottoinsiemi di $\\mathbb{R}^n$ che sono **insieme** aperti e compatti sono $\\emptyset$ e nient'altro — ed è l'argomento per cui una varietà compatta non può essere coperta da una sola carta.","esempio":"L'intervallo $(0,1)$ non è compatto, e si vede esibendo un ricoprimento senza sottoricoprimento finito: gli aperti $A_n=\\left(\\tfrac1n,1\\right)$ per $n\\ge2$ ricoprono $(0,1)$, perché ogni $x\\gt0$ sta in $A_n$ appena $\\tfrac1n\\lt x$, cioè appena $n\\gt1/x$. Ma una sottofamiglia finita $A_{n_1},\\dots,A_{n_k}$ ha un indice massimo $N$, quindi la sua unione è $\\left(\\tfrac1N,1\\right)$, e il punto $x=\\tfrac1{2N}$ resta fuori: è positivo, dunque sta in $(0,1)$, ed è minore di $\\tfrac1N$. Il conto che regge l'argomento è $\\lim_{n\\to\\infty}\\tfrac1n=0$: gli $A_n$ si avvicinano a coprire tutto, ma nessuno di essi contiene un intorno di $0$, e servirebbero tutti. Chiudendo l'intervallo, $[0,1]$ diventa compatto e quel ricoprimento smette di essere un ricoprimento — $0$ non sta in nessun $A_n$.","debito":"la dimostrazione del teorema di Heine-Borel e la teoria generale degli spazi compatti stanno fuori dal percorso: qui c'è l'uso che se ne fa. Nel corso di Diverio la compattezza entra come ipotesi (sfera, gruppi di Lie compatti) e come conclusione della locale compattezza delle varietà.","controllo":[{"tipo":"limite","espr":"1/n","var":"n","a":"oo","vale":"0","ipotesi":{"n":"positive"},"dove":"esempio","appare":"\\lim_{n\\to\\infty}\\tfrac1n=0"},{"tipo":"disuguaglianza","sinistra":"1/(2*N)","destra":"1/N","relazione":"<","ipotesi":{"N":"positive"},"dove":"esempio","appare":"minore di $\\tfrac1N$"}]};
STRUM["omeomorfismo"] = {"nome":"Omeomorfismo","riga":"Una biiezione continua con inversa continua: due spazi omeomorfi sono lo stesso spazio scritto in due modi, per tutto ciò che la topologia sa vedere.","serve":"È la nozione di «uguale» che si usa quando si dice che una varietà è localmente come $\\mathbb{R}^n$. La richiesta che anche l'inversa sia continua non è pignoleria: senza di essa una biiezione continua può incollare cose lontane — l'applicazione $t\\mapsto(\\cos 2\\pi t,\\sin 2\\pi t)$ da $[0,1)$ alla circonferenza è continua e biunivoca, ma la sua inversa spezza la circonferenza in un punto, e infatti $[0,1)$ e $S^1$ non sono lo stesso spazio (uno è compatto, l'altro no). Le proprietà che si conservano per omeomorfismo — compattezza, connessione, dimensione, gruppo fondamentale — sono esattamente quelle di cui si può parlare su una varietà senza aver scelto una carta.","esempio":"L'intervallo aperto $(0,1)$ e la semiretta $(0,+\\infty)$ sono omeomorfi tramite $f(x)=\\dfrac{x}{1-x}$: è continua su $(0,1)$, manda $0^+$ in $0^+$ e $1^-$ in $+\\infty$, e la sua inversa è $g(y)=\\dfrac{y}{1+y}$, anch'essa continua. Che siano davvero una l'inversa dell'altra si verifica componendo: $g(f(x))=\\dfrac{x/(1-x)}{1+x/(1-x)}=x$. Ne segue che $(0,1)$ è omeomorfo anche a tutto $\\mathbb{R}$ (componendo con $y\\mapsto\\ln y$), il che dice una cosa che all'inizio sorprende: **la lunghezza non è una proprietà topologica**. Non lo è nemmeno l'essere limitato; lo è invece la compattezza, ed è per questo che $[0,1]$ non è omeomorfo a nessuno dei due.","debito":"nessun movimento del percorso tratta la topologia generale come argomento a sé: qui c'è ciò che serve per leggere la definizione di varietà. La classificazione di quali spazi sono omeomorfi a quali è il mestiere della topologia algebrica, e nel corso di Diverio entra solo per la numerabilità del gruppo fondamentale.","controllo":[{"tipo":"uguale","sinistra":"(x/(1-x))/(1+x/(1-x))","vale":"x","ipotesi":{"x":"positive"},"dove":"esempio","appare":"=x"}]};

function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';
  return h;
}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;

{ num:'00', title:'Di cosa parla questo movimento', meta:'Geometria Differenziale · voci G.7, G.8 · due modi di fabbricare varieta, e sono diversi',

  {t:'prosa', title:'Le due strade', tag:'architettura', html:R`
  <p>Finora le varietà erano date. Qui si impara a <b>costruirle</b>, e le strade sono due, concettualmente opposte:</p>
  <ul>

  <p>La seconda è quella che permette di costruire oggetti che non stanno naturalmente dentro nessuno spazio, e l&rsquo;esempio su cui Diverio la mostra «in dettaglio» è la <b>Grassmanniana</b>: lo spazio di tutti i sottospazi $k$-dimensionali di $\mathbb{R}^n$. <b>Un punto di quello spazio è un piano intero</b>, e non c&rsquo;è nessun modo ovvio di dire quando due piani sono «vicini» finché non lo si costruisce.</p>`}

/* ---------------- 01 · SOTTOVARIETÀ ---------------- */
{ num:'01', title:'Sottovarieta localmente chiuse di uno spazio euclideo', meta:'la definizione con le carte adattate · localmente un grafico · e gli esempi',
  blocchi:[
  {t:'prosa', title:'La definizione, e le tre facce equivalenti', tag:'grammatica', html:R`
  <p>$S\subseteq\mathbb{R}^N$ è una <b>sottovarietà</b> di dimensione $n$ se ogni suo punto ha un intorno $V$ in $\mathbb{R}^N$ e un diffeomorfismo $\psi:V\to\psi(V)\subseteq\mathbb{R}^N$ tale che
  $$\psi(S\cap V)=\psi(V)\cap(\mathbb{R}^{n}\times\{0\}).$$
  In parole: <b>c&rsquo;è un cambio di coordinate dell&rsquo;ambiente che raddrizza $S$</b> facendola diventare un pezzo di sottospazio coordinato.</p>
  <p>Tre condizioni equivalenti, ed è utile sapere quale usare quando:</p>
  <ul>
   <li><b>carta adattata</b> (quella sopra): la più comoda per dimostrare teoremi;</li>
   <li><b>localmente un grafico</b>: attorno a ogni punto, dopo aver eventualmente riordinato le coordinate, $S$ è il grafico di una funzione liscia delle prime $n$. <b>La più comoda per capire</b>;</li>
   <li><b>localmente $F^{-1}(0)$ con $F$ sommersione</b>: è il criterio operativo, e diventa il teorema del valore regolare in gd-08. <b>La più comoda per verificare</b>, perché di solito l&rsquo;insieme è dato proprio da equazioni.</li>
  </ul>
  <p><b>«Localmente chiusa» significa</b> che $S$ è chiusa in un aperto di $\mathbb{R}^N$ — è la condizione che esclude patologie come una curva che si avvolge su se stessa accumulandosi. Se ne riparla in gd-09, dove la distinzione fra immersione e immersione <i>propria</i> diventa il cuore del problema.</p>`},
  {t:'prosa', title:'Il vantaggio, e il limite', tag:'idea', html:R`
  <p><b>Il vantaggio</b>: una sottovarietà eredita tutto dall&rsquo;ambiente — topologia, carte, struttura liscia — senza che si debba verificare niente. Sfera, toro, $SL(n,\mathbb{R})$, l&rsquo;insieme delle matrici ortogonali: tutte sottovarietà, e il criterio di gd-08 le riconosce in tre righe.</p>
  <p><b>Il limite</b>, ed è la ragione per cui il corso non si ferma qui: non tutte le varietà arrivano con un ambiente. Lo spazio proiettivo, la grassmanniana, lo spazio delle configurazioni di un sistema meccanico, lo spazio-tempo. <b>Il teorema di Whitney (gd-09) dirà che un ambiente esiste sempre</b> — ogni varietà si immerge in $\mathbb{R}^{2n+1}$ — ma sceglierne uno è arbitrario e nasconde la struttura invece di mostrarla.</p>`}
]},

/* ---------------- 02 · LA GRASSMANNIANA ---------------- */
{ num:'02', title:'La Grassmanniana, costruita dal niente', meta:'linsieme · le carte · il cambio di coordinate su G(2,4) · e la dimensione',
  blocchi:[
  {t:'reveal', title:'La costruzione, passo per passo', tag:'costruzione', steps:[
   {label:'Linsieme, e il problema', body:R`
   <p>$G(k,n)$ è l&rsquo;insieme dei sottospazi vettoriali di dimensione $k$ di $\mathbb{R}^n$. Per $k=1$ è lo spazio proiettivo $\mathbb{RP}^{n-1}$ (le rette per l&rsquo;origine). <b>Un punto di $G(k,n)$ è un piano</b>, e non c&rsquo;è nessuna topologia naturale data: bisogna costruirla.</p>
   <p>Un piano $k$-dimensionale si può descrivere con una matrice $k\times n$ di rango $k$, le cui righe sono una base. <b>Ma la base non è unica</b>: due matrici descrivono lo stesso piano se differiscono per una moltiplicazione a sinistra per una matrice invertibile $k\times k$. <b>È questo quoziente il problema</b>, ed è anche la soluzione.</p>`},
   {label:'Le carte, e come si tolgono le coordinate di troppo', body:R`
   <p>Si sceglie un insieme $I$ di $k$ colonne e si considera l&rsquo;insieme $U_I$ dei piani per cui il <b>minore</b> corrispondente è invertibile. Su $U_I$ si può <b>normalizzare</b>: moltiplicando a sinistra per l&rsquo;inversa di quel minore, la matrice diventa l&rsquo;identità su quelle colonne, e le restanti $k(n-k)$ entrate sono <b>libere e determinate univocamente</b>.</p>
   <p>Questa è la carta: $U_I\to\mathbb{R}^{k(n-k)}$, e gli $\binom{n}{k}$ aperti così ottenuti coprono tutto — perché una matrice di rango $k$ ha <i>almeno</i> un minore invertibile. Dunque $G(k,n)$ ha <b>dimensione $k(n-k)$</b>; per $G(2,4)$ è <b>dimensione 4</b>.</p>`},
   {label:'Il cambio di coordinate, fatto per intero su G(2,4)', body:R`
   <p>Nella carta delle colonne $\{1,2\}$ un piano è
   $$\begin{pmatrix}1&0&a&b\\ 0&1&c&d\end{pmatrix},$$
   con $(a,b,c,d)\in\mathbb{R}^4$ le coordinate. Per passare alla carta delle colonne $\{1,3\}$ serve che il minore su quelle colonne sia invertibile: quel minore è $\begin{pmatrix}1&a\\ 0&c\end{pmatrix}$, e <b>il minore vale $c$</b> — la sovrapposizione delle due carte è quindi $\{c\ne0\}$.</p>
   <p>Moltiplicando a sinistra per la sua inversa e leggendo le quattro entrate libere si ottiene la transizione
   $$(a,b,c,d)\ \longmapsto\ \left(-\frac{a}{c},\ b-\frac{ad}{c},\ \frac1c,\ \frac{d}{c}\right).$$
   <b>Sono funzioni razionali con denominatore $c$, e $c\ne0$ è esattamente dove sono definite: quindi sono lisce.</b> La Grassmanniana è una varietà differenziabile, e il conto che lo dimostra è questo.</p>
   <div class="note"><b>Perché Diverio lo fa «in dettaglio», e vale la pena non saltarlo</b>: è il primo caso in cui le carte non si vedono e la verifica è tutta algebrica. Il meccanismo — <i>normalizzo su un minore invertibile, le restanti entrate sono le coordinate, la transizione è razionale nel minore</i> — è lo <b>stesso</b> che regge lo spazio proiettivo e, con un&rsquo;altra algebra, i fibrati di gd-07. Chi ha fatto questo conto riconosce lo schema ovunque.</div>`}
  ]},
  {t:'prosa', title:'Il criterio generale che ne esce', tag:'regola operativa', html:R`
  <p>Diverio enuncia il caso generale: dato un <b>insieme</b> $X$ (senza topologia) e una famiglia di biiezioni $\varphi_\alpha:U_\alpha\to\varphi_\alpha(U_\alpha)\subseteq\mathbb{R}^n$ con immagini aperte, se</p>
  <ol>
   <li>gli $U_\alpha$ coprono $X$;</li>
   <li>$\varphi_\alpha(U_\alpha\cap U_\beta)$ è <b>aperto</b> per ogni coppia;</li>
   <li>le transizioni $\varphi_\beta\circ\varphi_\alpha^{-1}$ sono <b>lisce</b>;</li>
   <li>(più le condizioni numerabili/Hausdorff, che nei casi concreti si verificano a parte),</li>
  </ol>
  <p>allora esiste <b>un&rsquo;unica</b> topologia su $X$ che rende gli $U_\alpha$ aperti e i $\varphi_\alpha$ omeomorfismi, e con essa $X$ è una varietà differenziabile. <b>È il teorema che trasforma «ho delle carte» in «ho una varietà»</b>, e serve ogni volta che l&rsquo;oggetto non ha un ambiente: grassmanniane, spazi proiettivi, il fibrato tangente di gd-07.</p>`}
]},

/* ---------------- 02a · DISEGNARE LA GRASSMANNIANA ---------------- */
{ num:'02a', title:'Vedere la Grassmanniana: due esempi che si disegnano', meta:'G(1,2) e la circonferenza · G(1,3) e lo spazio proiettivo · perche G(2,4) non si disegna e si calcola lo stesso',
  blocchi:[
  {t:'prosa', title:'I casi piccoli, dove loggetto astratto diventa familiare', tag:'costruzione', html:R`
  <p>La grassmanniana $G(k,n)$ — l&rsquo;insieme dei sottospazi di dimensione $k$ in $\mathbb{R}^{n}$ — è l&rsquo;esempio che Diverio svolge in dettaglio, ed è anche il primo oggetto del corso che non si può immaginare. <b>Conviene però passare dai casi piccoli</b>, dove coincide con qualcosa di noto: vederli rende il conto generale molto meno astratto.</p>
  <p><b>$G(1,2)$: le rette per l&rsquo;origine del piano.</b> Ogni retta è individuata dalla sua inclinazione, cioè da un angolo — ma due angoli che differiscono di $\pi$ danno la <i>stessa</i> retta. Quindi $G(1,2)$ è il cerchio degli angoli con gli antipodi identificati, cioè ancora una circonferenza: <b>$G(1,2)\cong\mathbb{RP}^{1}\cong S^{1}$</b>. Dimensione $1$, che è il valore dato dalla formula $k(n-k)=1\cdot1$.</p>
  <p><b>$G(1,3)$: le rette per l&rsquo;origine dello spazio.</b> Ogni retta incontra la sfera unitaria in due punti antipodali — è di nuovo un <span class="str" data-str="quoziente-topologico">quoziente</span>, quello di $S^{2}$ per l&rsquo;identificazione antipodale — quindi $G(1,3)\cong\mathbb{RP}^{2}$, dimensione $2=1\cdot2$. <b>Questo è già un oggetto che non si può immergere in $\mathbb{R}^{3}$</b> — e la si costruisce lo stesso, per carte, senza mai disegnarla.</p>
  <p><b>$G(2,4)$: i piani per l&rsquo;origine di $\mathbb{R}^{4}$.</b> Dimensione $2\cdot2=4$, nessuna rappresentazione visiva possibile. Eppure le carte si scrivono ed è quello che il movimento fa: <b>il metodo è identico ai casi piccoli</b>, solo che qui non c&rsquo;è l&rsquo;immagine a suggerire il risultato, e bisogna fidarsi del conto. È esattamente la situazione per cui l&rsquo;impianto astratto è stato costruito.</p>`},
  {t:'plot', title:'G(1,2): le rette per lorigine, e perche sono una circonferenza',
   intro:R`Quattro rette per l'origine del piano, con i loro due punti d'intersezione con la circonferenza unitaria. Ogni retta corrisponde a una <i>coppia</i> di punti antipodali: identificandoli si ottiene $\mathbb{RP}^{1}$, che è ancora una circonferenza.`,

           {x1:0.7, y1:-1.21, x2:-0.7, y2:1.21, col:'#ff9b6b', width:1.8, dash:true}],
     marks:[{x:1, y:0, label:'stessa retta', col:'#5eead4'},
            {x:-1, y:0, label:'stessa retta', col:'#5eead4', left:true},
            {x:0, y:1, label:'e questa', col:'#b98cff', up:true}]}
   ],
   leggi:R`<p><b>Il punto è che una retta non è un punto della circonferenza, è una coppia di punti opposti.</b> Percorrendo la circonferenza da $\theta=0$ a $\theta=\pi$ si incontrano tutte le rette una volta sola; arrivati a $\pi$ si ricomincia da capo. Lo spazio delle rette è quindi un segmento con gli estremi incollati — di nuovo una circonferenza, ma <b>percorsa a velocità doppia</b> rispetto a quella di partenza.</p>
   <p>Questo «doppio giro» non è un dettaglio: è ciò che distingue $\mathbb{RP}^{1}$ da $S^{1}$ come <i>rivestimento</i>, ed è la stessa struttura che compare nella fibrazione di Hopf più avanti nel corso. <b>Due spazi diffeomorfi possono essere legati da mappe non banali</b>, e qui la mappa $\theta\mapsto2\theta$ è l'esempio minimo.</p>
   <p><b>Perché vale la pena fare questo esempio prima di $G(2,4)$</b>: perché mostra che la grassmanniana non è un oggetto nuovo inventato per complicare, ma il nome generale di una costruzione che in casi piccoli dà spazi familiari. Quando nel conto generale compariranno le carte $U_{i}$ e i cambi di coordinate, si starà facendo la stessa cosa fatta qui con gli angoli — solo con più indici.</p>`}

/* ---------------- 02b · IL TEOREMA CHE TRASFORMA LE EQUAZIONI IN VARIETA ---------------- */
{ num:'02b', title:'Il criterio pratico: quando un insieme di equazioni definisce una varieta', meta:'il rango dello jacobiano · le tre facce dello stesso teorema · i gruppi di matrici · e i casi in cui fallisce',
  blocchi:[
  {t:'prosa', title:'Il problema di tutti gli esercizi, e la sua soluzione', tag:'metodo', html:R`
  <p>Quasi ogni oggetto concreto arriva come <b>insieme di soluzioni di equazioni</b>: la sfera è $x^{2}+y^{2}+z^{2}=1$, il gruppo ortogonale è $A^{T}A=I$, l&rsquo;iperboloide è $x^{2}+y^{2}-z^{2}=1$. Esibire carte per ciascuno sarebbe faticoso e inutile: c&rsquo;è un criterio che decide la questione guardando solo le derivate.</p>
  <div class="note"><b>Criterio del rango.</b> Sia $F:\mathbb{R}^{n}\to\mathbb{R}^{k}$ liscia e sia $S=F^{-1}(c)$. Se in <b>ogni</b> punto di $S$ lo jacobiano $DF$ ha rango massimo $k$, allora $S$ è una sottovarietà liscia di dimensione $n-k$.</div>
  <p><b>Perché funziona</b>, e vale la pena vederlo perché è sempre lo stesso argomento: se il rango è massimo, il teorema della funzione implicita dice che localmente si possono <i>risolvere</i> le $k$ equazioni rispetto a $k$ delle variabili, esprimendole come funzioni lisce delle altre $n-k$. Ma un insieme che è localmente il <b>grafico</b> di una funzione liscia è una sottovarietà, con la proiezione sulle variabili libere come carta. <b>Il criterio non è un teorema nuovo: è il teorema della funzione implicita letto geometricamente.</b></p>
  <p><b>La cosa importante è che il rango va verificato solo sui punti di $S$</b>, non ovunque. Il cono $x^{2}+y^{2}-z^{2}=0$ ha jacobiano $(2x,2y,-2z)$, che si annulla <i>solo</i> nell&rsquo;origine — e l&rsquo;origine appartiene all&rsquo;insieme. Per questo il cono non è una varietà, mentre l&rsquo;iperboloide $x^{2}+y^{2}-z^{2}=1$ lo è: il punto critico esiste in entrambi i casi, ma nel secondo <b>non sta sull&rsquo;insieme</b>. <b>La differenza fra i due esempi è di una sola costante</b>, ed è la prima cosa da controllare in un esercizio.</p>`},
  {t:'reveal', title:'I gruppi di matrici, che sono il banco di prova', tag:'esame', steps:[
   {label:'La sfera, per scaldare', body:R`
   <p>$S^{n}=F^{-1}(1)$ con $F(x)=|x|^{2}$. Lo jacobiano è $2x^{T}$, di rango $1$ ovunque tranne che nell&rsquo;origine — che non sta sulla sfera. <b>Quindi $S^{n}$ è una sottovarietà di dimensione $n$</b>: una riga di conto contro le due carte stereografiche con le loro transizioni.</p>`},
   {label:'Il gruppo ortogonale', body:R`
   <p>$O(n)=\{A:A^{T}A=I\}$. Qui la mappa naturale $F(A)=A^{T}A$ non arriva in $\mathbb{R}^{n^{2}}$ ma nello spazio delle matrici <b>simmetriche</b>, che ha dimensione $\frac{n(n+1)}{2}$ — ed è il punto in cui si sbaglia: contare male lo spazio d&rsquo;arrivo dà una dimensione sbagliata.</p>
   <p>Il differenziale in $A$ è $DF_A(H)=A^{T}H+H^{T}A$, ed è suriettivo sulle simmetriche: data $S$ simmetrica, basta $H=\tfrac12AS$ per ottenere $DF_A(H)=S$. Quindi il rango è massimo e</p>
   $$\dim O(n)=n^{2}-\frac{n(n+1)}{2}=\frac{n(n-1)}{2}.$$
   <p>Per $n=3$ fa <b>3</b>: le tre rotazioni indipendenti dello spazio, ritrovate senza contarle a mano. Per $n=2$ fa $1$, e infatti $O(2)$ è fatto di due circonferenze — le rotazioni e le riflessioni — ciascuna di dimensione uno. <b>Il conto dà la dimensione, non il numero di componenti connesse</b>: quello si vede dal determinante, che vale $\pm1$ e separa il gruppo in due pezzi che nessun cammino continuo collega.</p>
   <p>Il sottogruppo con $\det=+1$ si chiama $SO(n)$, è <b>connesso</b>, e ha la stessa dimensione — è un aperto (e chiuso) di $O(n)$. <b>È il conto che l&rsquo;esame chiede più spesso su questo argomento</b>, e il modo per non sbagliarlo è ricordare che il vincolo $A^{T}A=I$ impone $\frac{n(n+1)}{2}$ condizioni, non $n^{2}$, perché $A^{T}A$ è simmetrica per costruzione.</p>`},
   {label:'Il gruppo speciale lineare', body:R`
   <p>$SL(n)=\{\det A=1\}$, con $F=\det:\mathbb{R}^{n^{2}}\to\mathbb{R}$. Il differenziale del determinante è $D\det_A(H)=\det(A)\,\mathrm{tr}(A^{-1}H)$, che per $\det A=1$ è la traccia di $A^{-1}H$: non nullo, quindi di rango $1$. Allora</p>
   $$\dim SL(n)=n^{2}-1.$$
   <p><b>La lezione generale</b>: ogni volta che un gruppo di matrici è definito da un vincolo liscio, il criterio dà insieme l&rsquo;esistenza della struttura e la dimensione. <b>E la dimensione è sempre «quella dell&rsquo;ambiente meno il numero di vincoli indipendenti»</b> — dove «indipendenti» significa esattamente «rango massimo».</p>`}
  ]},
  {t:'prosa', title:'Dove il criterio non risponde, e cosa NON dice', tag:'trappola', html:R`
  <p>Tre avvertenze, tutte e tre sono errori che si fanno:</p>
  <ul>
   <li><b>la condizione è sufficiente, non necessaria.</b> Se il rango cade in qualche punto, l&rsquo;insieme <i>può</i> essere lo stesso una varietà: $x^{3}=y^{3}$ in $\mathbb{R}^{2}$ ha jacobiano nullo nell&rsquo;origine ma descrive la retta $x=y$, che è una varietà perfettamente liscia. <b>Il criterio, quando fallisce, non dimostra niente</b>: bisogna guardare l&rsquo;insieme;</li>
   <li><b>l&rsquo;insieme può essere vuoto</b>, e allora la domanda non si pone. $x^{2}+y^{2}+z^{2}=-1$ ha jacobiano di rango massimo dove vorremmo, ma non ci sono punti;</li>
   <li><b>la dimensione è quella locale.</b> Se $S$ ha componenti connesse su cui il rango si comporta diversamente, ciascuna ha la propria dimensione — e in quel caso, con la definizione stretta, $S$ non è una varietà.</li>
  </ul>
  <p><b>E c&rsquo;è un quarto caso, più insidioso dei tre</b>, che conviene nominare perché l&rsquo;enunciato del criterio lo nasconde: il rango può essere massimo in ogni punto e l&rsquo;insieme essere comunque <i>strano</i> come sottoinsieme dell&rsquo;ambiente. L&rsquo;esempio classico è la retta a pendenza irrazionale sul toro: è l&rsquo;immagine di una mappa con differenziale sempre iniettivo, quindi localmente è una curva liscia perfetta, ma è <b>densa</b> nel toro — ogni suo punto ha intorni che contengono infiniti altri rami della stessa curva. <b>Non è una sottovarietà nel senso della definizione con le carte adattate</b>, perché quella richiede che localmente l&rsquo;insieme sia <i>tutto</i> quello che si vede, non solo un pezzo. È la differenza fra «immersione» e «immersione iniettiva propria», che il corso riprenderà, e la ragione per cui la definizione di sottovarietà è formulata con le carte e non con le parametrizzazioni.</p>
  <p><b>La strategia d&rsquo;esame che ne segue</b> è netta e vale la pena scriverla come procedura: (1) scrivere l&rsquo;insieme come $F^{-1}(c)$, scegliendo bene lo spazio d&rsquo;arrivo; (2) calcolare $DF$ e trovare i punti dove il rango cade; (3) controllare se quei punti <i>stanno</i> nell&rsquo;insieme. Se non ci stanno, è una varietà di dimensione $n-k$ e si è finito. Se ci stanno, il criterio tace e si passa all&rsquo;argomento di connessione locale — quello del cono. <b>Tre passi, e coprono ogni esercizio di questo tipo.</b></p>`}
]},

/* ---------------- 02c · ESERCIZI ---------------- */
{ num:'02c', title:'Esercizi — tocca a te', meta:'riconoscere una sottovarieta con il rango · il toro come luogo di zeri · un caso che fallisce',
  blocchi:[
  {t:'esercizio', title:'1 · Il toro come insieme di livello',
   src:'il caso in cui la funzione giusta non e ovvia',
   testo:R`Mostra che il toro di rivoluzione in $\mathbb{R}^{3}$, ottenuto ruotando attorno all'asse $z$ una circonferenza di raggio $r$ centrata a distanza $R>r$ dall'asse, è una sottovarietà liscia di dimensione $2$. Trova la funzione $F$ di cui è insieme di livello e verifica il rango.`,
   steps:[
    {label:'La funzione', body:R`
    <p>Un punto sta sul toro quando la sua distanza dalla circonferenza centrale vale $r$. La distanza dall'asse $z$ è $\sqrt{x^{2}+y^{2}}$, quindi la condizione è</p>
    $$F(x,y,z)=\left(\sqrt{x^{2}+y^{2}}-R\right)^{2}+z^{2}=r^{2}.$$
    <p><b>La radice quadrata è il punto delicato</b>: $F$ non è liscia dove $x=y=0$, cioè sull'asse. Ma quei punti <i>non stanno sul toro</i> (perché $R>r$), quindi si può restringere $F$ all'aperto $\mathbb{R}^{3}$ meno l'asse, dove è perfettamente liscia. <b>Restringere il dominio a un aperto che contiene l'insieme è una mossa lecita e spesso necessaria</b>: la varietà non cambia, e la funzione diventa trattabile.</p>`},
    {label:'Il rango', body:R`
    <p>Posto $\rho=\sqrt{x^{2}+y^{2}}$, si calcola</p>
    $$\nabla F=\left(\frac{2(\rho-R)x}{\rho},\ \frac{2(\rho-R)y}{\rho},\ 2z\right).$$
    <p>Si annulla solo se $z=0$ e $\rho=R$, cioè sulla circonferenza centrale — che <b>non appartiene al toro</b>, perché lì $F=0\ne r^{2}$. Quindi il rango è $1$ ovunque sul toro, e</p>
    $$\dim=3-1=2.$$
    <p><b>Lo schema si ripete identico a quello del cono e dell'iperboloide</b>: il gradiente si annulla in qualche punto, e tutto dipende da <i>dove</i>. Qui la condizione $R>r$ — un'ipotesi geometrica innocua — è esattamente ciò che tiene i punti critici fuori dall'insieme. <b>Con $R=r$ il toro si autointerseca sull'asse e smette di essere una varietà</b>, ed è il caso che conviene provare a disegnare per capire perché l'ipotesi serve.</p>`}
   ]},
  {t:'plot', title:'Toro, cono e iperboloide: la stessa domanda, tre risposte',
   intro:R`I tre luoghi di zeri discussi nel movimento, con la sezione nel piano $(\rho,z)$ dove $\rho=\sqrt{x^{2}+y^{2}}$. Il toro è una circonferenza che non tocca l'asse, il cono passa per l'origine, l'iperboloide la evita.`,
   plots:[
    {kind:'contour', f:'pow(sqrt(x*x+1e-9)-2,2)+y*y', xr:[0,4], yr:[-2,2], height:300,
     levels:[0.25], col:'#5eead4', label:'toro: (rho-R)^2+z^2 = r^2',
     title:'sezione del toro: una circonferenza lontana dallasse'},
    {kind:'contour', f:'x*x-y*y', xr:[-3,3], yr:[-3,3], height:300,
     levels:[0], col:'#ff6b6b', label:'cono: rho^2 - z^2 = 0',
     overlays:[{f:'x*x-y*y', levels:[1], col:'#d8a13a', label:'iperboloide: = 1'}],
     title:'cono (rosso) e iperboloide (oro): differiscono per una costante'}
   ],
   leggi:R`<p><b>Nel pannello di destra sta tutto l'argomento del movimento.</b> Le due curve vengono dalla stessa funzione $F=\rho^{2}-z^{2}$: cambia solo il livello. Il gradiente di $F$ si annulla nell'origine in entrambi i casi — ma l'origine appartiene al livello zero (il cono) e non al livello uno (l'iperboloide). <b>Una costante decide se l'insieme è liscio.</b></p>
   <p>E si vede anche la forma del guasto: il livello zero è una <i>croce</i>, due rette che si incrociano, e nel punto d'incrocio nessun intorno somiglia a un intervallo. Il livello uno è una coppia di rami disgiunti e lisci — due componenti connesse, ciascuna una varietà, e nel caso tridimensionale le due falde dell'iperboloide a due falde.</p>
   <p>Il pannello di sinistra mostra perché il toro funziona: la sezione è una circonferenza che <b>non tocca l'asse</b> $\rho=0$, ed è esattamente l'ipotesi $R>r$. Avvicinando i due raggi la circonferenza si avvicina all'asse, e per $R=r$ lo tocca: a quel punto il toro si strozza e il punto di contatto diventa singolare, come il vertice del cono. <b>Tre figure, un solo criterio</b>, e la differenza sta sempre in dove cadono i punti critici.</p>`},
  {t:'esercizio', title:'2 · Un caso in cui il criterio fallisce, e la risposta e comunque si',
   src:'per non credere che il criterio sia una condizione necessaria',
   testo:R`Considera $S=\{(x,y)\in\mathbb{R}^{2}:y^{2}=x^{2}\}$ e $T=\{(x,y):y^{3}=x^{3}\}$. Applica il criterio del rango a entrambi e poi guarda gli insiemi. Che cosa si conclude?`,
   steps:[
    {label:'I due conti', body:R`
    <p>Per $S$: $F=y^{2}-x^{2}$, $\nabla F=(-2x,2y)$, che si annulla nell'origine — e l'origine sta in $S$. Il criterio tace.</p>
    <p>Per $T$: $F=y^{3}-x^{3}$, $\nabla F=(-3x^{2},3y^{2})$, che si annulla anch'esso nell'origine, e anche qui l'origine sta nell'insieme. Il criterio tace di nuovo.</p>`},
    {label:'Ma gli insiemi sono diversissimi', body:R`
    <p>$S$ è l'unione delle due rette $y=x$ e $y=-x$: <b>non è una varietà</b>, perché l'origine ha un intorno che tolto il punto si spezza in <i>quattro</i> componenti, mentre un intervallo bucato ne ha due.</p>
    <p>$T$ invece è semplicemente la retta $y=x$ — perché $y^{3}=x^{3}$ implica $y=x$ nei reali — e <b>una retta è una varietà liscia</b> quanto si vuole.</p>
    <p><b>La morale, e va imparata una volta per tutte</b>: quando il criterio del rango fallisce non si è dimostrato niente. Si è solo scoperto che <i>quella</i> descrizione dell'insieme non è abbastanza buona. Bisogna guardare l'insieme — cercando un'altra funzione, o un argomento topologico diretto. <b>Un criterio sufficiente usato come necessario è la fonte più comune di errori in questo capitolo.</b></p>`}
   ]},
  {t:'collaudo', title:'Controlla di aver capito', html:R`
  <ol>
  <li>Qual è la dimensione di $G(k,n)$, e perché la formula è simmetrica scambiando $k$ con $n-k$?</li>
  <li>$O(n)$ è <span class="str" data-str="compattezza">compatto</span>, $GL(n)$ no: come si vede, e che cosa c'entra con il criterio del rango?</li>
  <li>Perché una sottovarietà di $\mathbb{R}^{n}$ è automaticamente di Hausdorff e a base numerabile?</li>
  <li>Le carte della grassmanniana sono <span class="str" data-str="omeomorfismo">omeomorfismi</span> su aperti euclidei: che cosa rappresentano concretamente quelle coordinate?</li>
  </ol>`,
   sol:R`<ol>
   <li>$\dim G(k,n)=k(n-k)$. La simmetria non è casuale: a ogni sottospazio di dimensione $k$ corrisponde il suo <b>ortogonale</b>, di dimensione $n-k$, e la corrispondenza è biunivoca e liscia. <b>$G(k,n)$ e $G(n-k,n)$ sono diffeomorfe</b>, e la formula lo registra. Per $G(1,n)\cong\mathbb{RP}^{n-1}$ si ritrova $\dim=n-1$, come dev'essere.</li>
   <li>$O(n)$ è <b>chiuso</b> (è controimmagine di un punto, e $F$ è continua) e <b>limitato</b> (le colonne sono versori, quindi ogni entrata è al più $1$ in modulo): per Heine-Borel è compatto. $GL(n)$ è aperto e non limitato, quindi non lo è. <b>Il criterio del rango non dice niente sulla compattezza</b> — dà la struttura liscia e la dimensione, e le proprietà topologiche globali vanno guardate a parte. È una divisione del lavoro che conviene tenere chiara.</li>
   <li>Perché entrambe le proprietà si <b>ereditano ai sottospazi</b>: un sottoinsieme di uno spazio di Hausdorff è di Hausdorff con la topologia indotta, e un sottospazio di uno spazio a base numerabile ha base numerabile. <b>È il vantaggio pratico delle sottovarietà</b>: due terzi della definizione di varietà topologica sono gratis, e resta da verificare solo il locale euclideo. Per le varietà astratte come la grassmanniana, invece, vanno dimostrate tutte e tre.</li>
   <li>Rappresentano il sottospazio come <b>grafico di un'applicazione lineare</b>. Fissata una decomposizione $\mathbb{R}^{n}=V_0\oplus W_0$ con $\dim V_0=k$, i sottospazi «vicini» a $V_0$ — quelli che intersecano $W_0$ solo nell'origine — sono tutti e soli i grafici di applicazioni lineari $L:V_0\to W_0$. Le coordinate della carta sono <b>le entrate della matrice di $L$</b>, che sono $k(n-k)$: da lì viene la dimensione. <b>È la stessa idea del criterio del rango</b> — localmente, tutto è un grafico — applicata a uno spazio i cui punti sono sottospazi invece che punti.</li>
   </ol>`}
]},

/* ---------------- 03 · IL SENSO ---------------- */
{ num:'03', title:'Il senso, e le rotte', meta:'cosa apre, e dove le grassmanniane servono davvero',
  blocchi:[
  {t:'prosa', title:'Cosa lascia in mano', tag:'sintesi', html:R`
  <p><b>Il punto.</b> Una varietà non ha bisogno di stare dentro qualcosa: basta un insieme, delle carte, e transizioni lisce. <b>La topologia è un risultato della costruzione, non un ingrediente.</b></p>
  <p><b>A valle.</b> gd-04 definisce le mappe fra varietà così costruite; gd-07 applica il criterio di questa tappa al fibrato tangente, e la transizione sarà il <b>cociclo jacobiano</b>; gd-08 dà il criterio pratico ($F^{-1}$ di un valore regolare) che copre quasi tutti gli esempi di sottovarietà.</p>`},
  {t:'prolessi', title:'Dove riappare questo movimento',
   oggetto:R`<b>Lo spazio dei sottospazi</b>: un insieme di oggetti geometrici reso esso stesso una varietà.`,
   rotte:[
    {dove:'Meccanica<br>quantistica', txt:R`Lo spazio degli stati di un sistema a due livelli è $\mathbb{CP}^{1}$, la <b>sfera di Bloch</b>: un punto è un raggio, cioè uno stato a meno di fase. Lo spazio proiettivo complesso <b>è</b> lo spazio degli stati puri, e la fase geometrica di Berry vive lì.`},
    {dove:'Fisica dei<br>solidi', txt:R`Le bande di un cristallo definiscono, per ogni quasi-impulso, un sottospazio degli stati occupati: una mappa dal toro di Brillouin a una grassmanniana. <b>Gli invarianti topologici degli isolanti topologici sono invarianti di quella mappa.</b>`},
    {dove:'Ottimizzazione<br>e dati', txt:R`Molti problemi (PCA, riduzione di dimensionalita', separazione di sorgenti) sono ottimizzazioni <b>sulla grassmanniana</b>: si cerca il miglior sottospazio $k$-dimensionale, e farlo con la geometria giusta costa molto meno che parametrizzare a mano.`},
    {dove:'Geometria<br>algebrica', txt:R`Le grassmanniane sono l'esempio base di <b>varieta' proiettiva</b>, e l'immersione di Plucker le realizza dentro uno spazio proiettivo: e' il ponte fra il punto di vista astratto di questa tappa e quello con ambiente.`}
   ],
   domanda:R`Un punto della grassmanniana è un piano, e due piani sono «vicini» se le loro carte lo dicono. Ma esiste un modo <b>intrinseco</b> di misurare quanto due sottospazi siano vicini, senza passare da una carta? Sì: gli <b>angoli principali</b> fra i due sottospazi, che danno una distanza. <b>Domanda che porti avanti:</b> quando uno spazio di oggetti geometrici ha una struttura metrica naturale, e quando invece la metrica è una scelta arbitraria come le coordinate? È la differenza fra questo corso — che non introduce mai una metrica — e la geometria riemanniana, e sapere da che parte si sta è metà del mestiere.`}
]}

var byId = {}; TAPPE.forEach(function(s){ byId[s.num]=s; });

var VKEY='pm-nucleogd-03-visited';

var SEEN = loadSeen();

function renderNav(active){
  var nav=document.getElementById('sidebar');
  nav.innerHTML='';
  var h=document.createElement('h2'); h.textContent='Nucleo gd-03 · le tappe'; nav.appendChild(h);

/* ---- renderer dei blocchi ---- */
function sectionProsa(title, tag, html){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var body=elFromHTML('<div class="open-body">'+html+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function sectionGram(title, rows){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag gramtag">grammatica</span></h3>';
  var inner='<table class="gramtab">';
  rows.forEach(function(r){ inner+='<tr><td class="gs">'+r[0]+'</td><td>'+r[1]+'</td></tr>'; });
  inner+='</table>';
  var body=elFromHTML('<div class="gramwrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
/* --- blocco PLOT: la figura non decora, si legge. Ogni plot porta una chiave di lettura. --- */
function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';
  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
    else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
    else if(b.t==='prolessi') m.appendChild(sectionProlessi(b));
    else if(b.t==='reveal')m.appendChild(sectionReveal(b.title,b.tag,b.steps));
    else if(b.t==='esercizio') m.appendChild(sectionEsercizio(b));
    else if(b.t==='collaudo')  m.appendChild(sectionCollaudo(b.title,b.items));
    else if(b.t==='plot')      m.appendChild(sectionPlot(b));
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}
