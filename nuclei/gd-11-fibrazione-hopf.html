"use strict";
const R = String.raw;

function typeset(el){
  if(el && window.renderMathInElement){
    try{ renderMathInElement(el,{delimiters:[
      {left:'$$',right:'$$',display:true},
      {left:'$',right:'$',display:false}
    ],throwOnError:false}); }catch(e){}
  }
}
function elFromHTML(html){ var d=document.createElement('div'); d.innerHTML=html; return d; }

/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un
   rimando scritto nella prosa:

       <span class="str" data-str="serie-geometrica">la serie geometrica</span>

   Le schede citate da questo nucleo sono cucite qui sotto dal montaggio
   (assembla-nucleo.js): la pagina resta autosufficiente — niente fetch,
   niente sottocartelle da pubblicare — e un rimando a una scheda che non
   esiste FERMA la costruzione invece di arrivare in pagina rotto.
   Apertura: lo stesso gesto del collaudo (si clicca, il pannello compare,
   si typeset una volta sola), portato dentro la frase.
   =================================================================== */
var CORSO = 'geometria-differenziale';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};


function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';
  return h;
}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

/*MOVIMENTO
id:        gd-11 — la fibrazione di Hopf
identita:  l'esempio di fibrato non banale che si può calcolare fino in fondo
copre:     G.22

generata:  2026-09-18 da mappa.json — non modificare a mano, si cambia la mappa
MOVIMENTO*/

 {"tipo":"uguale","sinistra":"(2*r*s)**2+(r**2-s**2)**2","vale":"(r**2+s**2)**2",

 {"tipo":"simbolico","dove":"01","appare":"\\mathbb{CP}^{1}$ — che è diffeomorfo a $S^{2}",
  "perche":"e' l'identificazione fra lo spazio proiettivo complesso di dimensione uno e la sfera, gia' nota da Metodi come sfera di Riemann: un enunciato citato"},

CONTROLLO*/

/* ---------------- 00 · DI COSA PARLA QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Di cosa parla questo movimento', meta:'Geometria Differenziale · voce G.22 · lesempio che Diverio studia in dettaglio',
  blocchi:[
  {t:'prosa', title:'Perche esiste questo movimento', tag:'architettura', html:R`
  <p>gd-07 ha detto che un fibrato è <b>localmente un prodotto e globalmente può non esserlo</b>, e ha dato un&rsquo;ostruzione (la palla pelosa). Ma non ha mostrato un esempio in cui si vede <i>come</i> è attorcigliato.</p>
  <p>La <b>fibrazione di Hopf</b> è quell&rsquo;esempio, ed è il più bello della matematica del Novecento: una mappa $h:S^{3}\to S^{2}$ le cui fibre sono <b>cerchi</b>, e in cui due cerchi qualunque sono <b>allacciati</b> come due anelli di una catena. <b>La sfera tridimensionale è fatta di cerchi, e non c&rsquo;è modo di scioglierli.</b></p>
  <p>Diverio la segnala come «studio in dettaglio», ed è comprensibile: è l&rsquo;unico oggetto del corso in cui un fenomeno globale si può calcolare esplicitamente fino in fondo, con formule elementari.</p>`}
]},

/* ---------------- 01 · L'IDEA ---------------- */
{ num:'01', title:'Lidea: S3 dentro i complessi, e il quoziente per la fase', meta:'S3 in C^2 · moltiplicare per una fase · lo spazio dei raggi e CP^1',
  blocchi:[
  {t:'prosa', title:'La costruzione concettuale', tag:'costruzione', html:R`
  <p>Si identifica $\mathbb{R}^{4}$ con $\mathbb{C}^{2}$, e quindi
  $$S^{3}\subset\mathbb{C}^{2}=\{(z_1,z_2):|z_1|^{2}+|z_2|^{2}=1\}.$$
  Su questo insieme agisce il cerchio: moltiplicare <b>entrambe</b> le coordinate per una fase $e^{i\theta}$ manda $S^3$ in sé, e le orbite di questa azione sono <b>cerchi</b>.</p>
  <p><b>Il quoziente è lo spazio dei «raggi complessi»</b>, cioè lo spazio proiettivo complesso $\mathbb{CP}^{1}$ — che è diffeomorfo a $S^{2}$, la sfera di Riemann già incontrata in Metodi. Quindi
  $$S^{1}\ \hookrightarrow\ S^{3}\ \longrightarrow\ S^{2},$$
  con base di <b>dimensione 2</b> ($3-1$) e fibra di dimensione 1. <b>Questa è la fibrazione di Hopf</b>, e la tappa seguente la scrive con una formula.</p>
  <div class="note"><b>Il legame con la meccanica quantistica è immediato e non è un&rsquo;analogia.</b> Uno stato di un sistema a due livelli è un vettore unitario di $\mathbb{C}^{2}$ — cioè un punto di $S^3$ — e due stati che differiscono per una fase globale sono <b>fisicamente indistinguibili</b>. Lo spazio degli stati fisici è quindi il quoziente, $\mathbb{CP}^1=S^2$: <b>la sfera di Bloch</b>. La fibrazione di Hopf è letteralmente la mappa «dallo stato con fase allo stato fisico», e la fibra è l&rsquo;ambiguità di fase.</div>`}

   Le prime due componenti reali vengono dal numero complesso $2z_1\bar z_2$, la terza è reale.</p>`},

   ed è un&rsquo;identità algebrica esatta — la stessa che dà le <b>terne pitagoriche</b>. Su $S^3$ il membro destro vale $1$, quindi <b>$h$ manda $S^3$ dentro $S^2$</b>. Ed è suriettiva.</p>`},
   {label:'Seconda verifica: le fibre sono i cerchi', body:R`
   <p>Sostituendo $(z_1,z_2)\to(e^{i\theta}z_1,\ e^{i\theta}z_2)$: nella prima componente compare $e^{i\theta}\overline{e^{i\theta}}=1$, quindi <b>la fase comune si cancella</b>; la terza componente non contiene fasi. <b>Quindi $h$ è costante lungo i cerchi</b>, e la fibra non è più grande di così. <b>La verifica, in due righe</b>: se $h(z_1,z_2)=h(w_1,w_2)$, la terza componente dà $|z_1|=|w_1|$ e $|z_2|=|w_2|$; scrivendo allora $w_1=e^{i\alpha}z_1$ e $w_2=e^{i\beta}z_2$ e imponendo l'uguaglianza della prima componente, $2z_1\bar z_2=2e^{i(\alpha-\beta)}z_1\bar z_2$, si ottiene $\alpha=\beta$ — cioè le due coppie differiscono <i>solo</i> per una fase comune. <b>La fibra è esattamente un'orbita del cerchio</b>, né più né meno.</p>
   <p>Un conto diretto sul polo: $h^{-1}(0,0,1)$ richiede $z_2=0$ e $|z_1|=1$, cioè <b>un cerchio</b>. Lo stesso per ogni altro punto, cambiando coordinate con una rotazione.</p>`}
  ]},
  {t:'prosa', title:'Perche non e banale, e come si vede lallacciamento', tag:'idea', html:R`
  <p>Se il fibrato fosse banale sarebbe $S^{3}\cong S^{2}\times S^{1}$. <b>È falso</b>, e l&rsquo;argomento topologico è netto: $S^3$ è <b>semplicemente connessa</b> (ogni laccio si contrae), mentre $S^{2}\times S^{1}$ non lo è — il fattore $S^1$ dà un laccio che non si contrae. <b>Quindi la fibrazione di Hopf è un fibrato non banale</b>, ed è il primo esempio storico.</p>
  <p><b>La visualizzazione</b>: togliendo un punto a $S^3$ si ottiene $\mathbb{R}^3$, e le fibre diventano cerchi (più una retta, quella che passa per il punto tolto). <b>Due cerchi qualsiasi sono allacciati con numero di allacciamento 1</b>: formano una catena, e nessuna deformazione continua li separa. Le fibre riempiono $\mathbb{R}^3$ organizzandosi in tori annidati.</p>`},
  {t:'plot', title:'Le fibre proiettate: tori annidati, e cerchi che si allacciano',
   intro:R`Proiezione stereografica di alcune fibre di Hopf: ogni fibra è un cerchio, e le fibre sopra uno stesso parallelo di $S^2$ giacciono su un toro.`,
   plots:[
    {kind:'curve', x:'(2.2+cos(t))*cos(2*t)', y:'(2.2+cos(t))*sin(2*t)', tr:[0,6.2832],
     xr:[-3.6,3.6], yr:[-3.6,3.6], height:340,
     title:'una fibra proiettata: un cerchio che avvolge il toro una volta in ciascun verso',
     segs:[{x1:-3.6, y1:0, x2:3.6, y2:0, col:'#4d5a6b', width:1},
           {x1:0, y1:-3.6, x2:0, y2:3.6, col:'#4d5a6b', width:1}]},
    {kind:'func2d', xr:[0,3.1416], yr:[0,3.4], height:340,
     title:'il raggio del toro su cui sta la fibra, al variare della latitudine sulla base',
     xlabel:'latitudine sulla base S^2', ylabel:'raggio del toro',
     curves:[{f:'tan(x/2)', col:'#5eead4', width:2.6, label:'raggio'}],
     marks:[{x:1.5708, y:1, label:'equatore: il toro di raggio 1', col:'#d8a13a', left:true},
            {x:0.1, y:0.05, label:'un polo: la fibra e un cerchio piccolo', col:'#b98cff'}]}
   ],
   leggi:R`<b>A sinistra una singola fibra</b>, proiettata in $\mathbb{R}^3$ e vista dall&rsquo;alto: non è un cerchio piatto ma una curva chiusa che gira una volta attorno all&rsquo;asse del toro e una volta attorno al suo tubo. <b>Due fibre di questo tipo non si possono separare</b> senza tagliarne una — è l&rsquo;allacciamento.<br><br>
   <b>A destra la struttura globale</b>: a ogni latitudine della base corrisponde un toro, e il suo raggio va da zero (un polo, dove la fibra degenera in un cerchio piccolo) all&rsquo;infinito (l&rsquo;altro polo, la fibra che diventa una retta perché ci passa il punto tolto). <b>$S^3$ è una famiglia di tori annidati che si schiacciano in due cerchi agli estremi</b> — e questa è l&rsquo;immagine che vale la pena portare via, perché è anche il modo in cui si visualizza $S^3$ in ogni altro contesto.`}
]},

/* ---------------- 03 · IL SENSO ---------------- */
{ num:'03', title:'Il senso, e le rotte', meta:'perche questa mappa compare ovunque in fisica',
  blocchi:[
  {t:'prosa', title:'Cosa lascia in mano', tag:'sintesi', html:R`
  <p><b>Il punto.</b> Un fibrato non banale non è una curiosità patologica: è l&rsquo;oggetto che descrive <b>le fasi</b> in meccanica quantistica e <b>i campi di gauge</b> in teoria dei campi. E la sua non banalità è misurata da un <b>numero intero</b> (l&rsquo;invariante di Hopf, qui uguale a 1), che non cambia per deformazioni continue.</p>
  <p><b>Il legame con gd-07</b>: $S^3$ è parallelizzabile perché è il gruppo dei quaternioni unitari, e infatti il suo fibrato <i>tangente</i> è banale. <b>Ma la fibrazione di Hopf non è il fibrato tangente</b>: è un altro fibrato sopra $S^2$, e quello non è banale. Due fibrati sullo stesso spazio possono comportarsi in modo opposto.</p>`},
  {t:'prolessi', title:'Dove riappare questo movimento',

   rotte:[

    {dove:'Teoria<br>dei campi', txt:R`Il <b>monopolo magnetico di Dirac</b> è descritto da un fibrato su $S^2$: esattamente questo, e il fatto che sia non banale con invariante intero <b>è</b> la quantizzazione della carica magnetica. Gli <b>istantoni</b> di Yang-Mills sono mappe $S^3\to SU(2)$ classificate dallo stesso tipo di invariante.`},
    {dove:'Materia<br>condensata', txt:R`Le tessiture di spin negli <b>skyrmioni</b> magnetici sono mappe verso $S^2$ con numero topologico intero; la loro stabilità — non si possono «srotolare» — è la stessa non banalità, ed è ciò che li rende candidati per la memoria magnetica.`},
    {dove:'Meccanica<br>celeste', txt:R`La regolarizzazione di Kustaanheimo-Stiefel del problema di Keplero usa la fibrazione di Hopf per trasformare le collisioni in oscillatori armonici: <b>un problema di singolarità risolto con la topologia</b>.`}
   ],
   domanda:R`Le fibre di Hopf sono cerchi a due a due allacciati, e l&rsquo;allacciamento è un <b>intero</b> che non cambia deformando con continuità. <b>Domanda che porti avanti:</b> quali altri numeri interi si nascondono in situazioni continue, e perché la natura sembra sceglierli? La carica elettrica è quantizzata, il flusso magnetico nei superconduttori è quantizzato, la conduttanza di Hall è un intero con nove cifre di precisione. <b>In ognuno di questi casi l&rsquo;intero è un invariante topologico di un fibrato</b>, e la precisione della misura non viene dalla purezza del campione ma dal fatto che un numero intero non può cambiare di poco.`}

/* =================================================================== */
var byId = {}; TAPPE.forEach(function(s){ byId[s.num]=s; });

var VKEY='pm-nucleogd-11-visited';
function loadSeen(){ try{ return new Set(JSON.parse(localStorage.getItem(VKEY)||'[]')); }catch(e){ return new Set(); } }
function saveSeen(s){ try{ localStorage.setItem(VKEY, JSON.stringify(Array.from(s))); }catch(e){} }
var SEEN = loadSeen();

function renderNav(active){
  var nav=document.getElementById('sidebar');
  nav.innerHTML='';
  var h=document.createElement('h2'); h.textContent='Nucleo gd-11 · le tappe'; nav.appendChild(h);
  TAPPE.forEach(function(s){
    var b=document.createElement('button');
    b.className='navitem'+(active===s.num?' active':'')+(SEEN.has(s.num)?' seen':'');
    b.innerHTML='<span class="dot"></span><span class="nx">'+s.num+'</span><span>'+s.title+'</span>';
    b.onclick=function(){ showTappa(s.num); };
    nav.appendChild(b);
  });
}

/* ---- renderer dei blocchi ---- */
function sectionProsa(title, tag, html){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var body=elFromHTML('<div class="open-body">'+html+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function sectionGram(title, rows){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag gramtag">grammatica</span></h3>';
  var inner='<table class="gramtab">';
  rows.forEach(function(r){ inner+='<tr><td class="gs">'+r[0]+'</td><td>'+r[1]+'</td></tr>'; });
  inner+='</table>';
  var body=elFromHTML('<div class="gramwrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
/* --- blocco PLOT: la figura non decora, si legge. Ogni plot porta una chiave di lettura. --- */
function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';
  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
    else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
    else if(b.t==='prolessi') m.appendChild(sectionProlessi(b));
    else if(b.t==='reveal')m.appendChild(sectionReveal(b.title,b.tag,b.steps));
    else if(b.t==='esercizio') m.appendChild(sectionEsercizio(b));
    else if(b.t==='collaudo')  m.appendChild(sectionCollaudo(b.title,b.items));
    else if(b.t==='plot')      m.appendChild(sectionPlot(b));
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}

window.addEventListener('DOMContentLoaded', function(){
  var h=(location.hash||'').replace('#','');
  showTappa(byId[h]?h:'00');
});
window.addEventListener('hashchange', function(){
  var h=(location.hash||'').replace('#','');
  if(byId[h]) showTappa(h);
});
