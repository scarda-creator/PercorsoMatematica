   {q:R`La luce di una lampadina ha molti più fotoni di un laser da laboratorio. Perché allora non è «classica» nello stesso senso?`,
    a:R`Perché il numero di fotoni non è il criterio: lo è lo <b>stato</b>. La luce termica di una lampadina non è uno stato coerente ma una <i>miscela statistica</i> — una matrice densità, non un vettore — in cui la fase è completamente casuale e la distribuzione del numero di fotoni non è di Poisson ma geometrica, con $\Delta n\simeq\langle n\rangle$ invece di $\sqrt{\langle n\rangle}$. <i>Le fluttuazioni relative del numero, in luce termica, non si riducono aumentando l&rsquo;intensità</i>, e questa è la differenza misurabile: il raggruppamento dei fotoni, che si osserva in un esperimento di correlazione a due rivelatori (l&rsquo;esperimento di Hanbury Brown e Twiss) ed è assente nella luce coerente. <b>«Classico» ha quindi due significati che non vanno confusi</b>: una lampadina è classica nel senso che si descrive con l&rsquo;ottica statistica ondulatoria, un laser è classico nel senso più forte che ha un&rsquo;ampiezza <i>e una fase</i> ben definite. <i>Il secondo è il senso in cui lo stato coerente è il limite classico</i>, e la Poisson è la sua firma: è quella che distingue una sorgente coerente da una termica, e la misura è una misura di varianza, non di intensità.`}
  ]}
]},

/* ---------------- 15 · BILANCIO ---------------- */
{ num:'15', title:'Che cosa resta in mano', meta:'un metodo trasportabile · quattro vie allo stesso spettro, con le ipotesi di ciascuna · due limiti classici che si escludono · dove riappare in fisica',
  blocchi:[
  {t:'prosa', title:'Il metodo, prima dei risultati', tag:'architettura', html:R`
  <p><b>Una procedura di fattorizzazione.</b> Una hamiltoniana quadratica nelle variabili canoniche si scrive come prodotto di due operatori coniugati più una costante, e la costante è il commutatore. Due operatori il cui commutatore con $H$ è proporzionale a sé stessi spostano gli autovalori di un passo fisso; una condizione di positività taglia la torre da un lato; lo spettro è il reticolo che ne risulta. <i>Non serve nessuna equazione differenziale, e il procedimento si trasporta identico a ogni problema con un&rsquo;algebra della stessa forma</i> — il momento angolare, l&rsquo;elettrone in campo magnetico, ogni modo di un campo quantizzato.</p>
  <p><b>Una condizione di esistenza.</b> $[q,p]=i\hbar$ è impossibile in dimensione finita, e le matrici dell&rsquo;oscillatore sono la dimostrazione costruttiva che è possibile in dimensione infinita. Troncandole si vede dove si rompe: in un punto solo, l&rsquo;ultimo, e di quanto serve a far tornare la traccia a zero.</p>
  <p><b>Un&rsquo;ipotesi analitica che si traveste da algebra.</b> La condizione al contorno che quantizza nella via per serie non è assente nella via algebrica: è nascosta nella richiesta che $p$ sia autoaggiunto, cioè che il termine di bordo dell&rsquo;integrazione per parti svanisca. <i>È la cosa più utile da ricordare di questo movimento, perché vale per tutte le dimostrazioni «puramente algebriche» del corso.</i></p>
  <p><b>Un modo di leggere una convenzione.</b> Due famiglie di testi definiscono gli operatori di salita e discesa con una differenza di fase $i$: lo spettro e tutte le osservabili sono identici, gli elementi di matrice di $q$ e $p$ no. Si dichiara quale si usa e non si mescolano le formule, e il controllo di sanità è che i valori medi delle osservabili vengano reali.</p>`},
  {t:'prosa', title:'Quattro vie, e che cosa assume ciascuna', tag:'architettura', html:R`
  <p>Lo spettro $E_{n}=(n+\tfrac12)\hbar\omega$ è stato ottenuto quattro volte, e l&rsquo;interesse del confronto sta nelle ipotesi, non nel risultato.</p>
  <p><b>Via algebrica</b> (tappa 04, Dirac-Picasso-Ballentine). Assume: la regola di commutazione, l&rsquo;autoaggiuntezza di $q$ e $p$, l&rsquo;esistenza di almeno un autovettore di $H$. Dà in più: il metodo, e gli operatori che servono a tutto il resto. L&rsquo;ipotesi di esistenza viene saldata dalle matrici della tappa 06.</p>
  <p><b>Via matriciale</b> (tappa 07, Heisenberg-Landau). Assume: l&rsquo;esistenza di stati stazionari numerabili, l&rsquo;hermiticità di $x$, e una condizione quantica — che nel 1925 era la regola di somma di Thomas-Kuhn, cioè <i>soltanto la diagonale</i> della relazione canonica. Dà in più: la regola di selezione $\Delta n=\pm1$ <i>prima</i> di aver risolto il problema, dalla sola equazione del moto.</p>
  <p><b>Via analitica</b> (tappa 09, Ballentine-Griffiths-Landau). Assume: la rappresentazione di Schrödinger, e la condizione al contorno $\psi\to0$. Dà in più: le autofunzioni in forma chiusa con i polinomi di Hermite, e il meccanismo per cui la quantizzazione è una condizione sulla coda e non sull&rsquo;energia.</p>
  <p><b>Via della posizione diagonalizzata</b> (tappa 09, Ballentine 6.3). Assume: lo spettro di $H$ già noto. Dà in più: lo spettro <i>continuo</i> della posizione, ottenuto da una ricorrenza su matrici intere, e la lezione che «funzione d&rsquo;onda» e «matrice» sono un solo oggetto letto lungo due indici.</p>`},
  {t:'prosa', title:'Due limiti classici, e perché si escludono', tag:'architettura', html:R`
  <p>La parte del movimento che vale più di tutte, se si deve scegliere, è il confronto fra la figura della tappa 10 e quella della tappa 13 — perché mostra che «limite classico» non è una cosa sola.</p>
  <p><b>Il primo limite</b> si ottiene prendendo un autostato dell&rsquo;energia con $n$ grande. Si recupera la <i>distribuzione</i> di posizione classica, mediata nel tempo, a meno di oscillazioni rapide; si recupera che la probabilità di stare fuori dall&rsquo;ampiezza tende a zero. <b>Non si recupera il moto</b>: la distribuzione è stazionaria, $\langle x(t)\rangle=0$ per ogni $n$, e non c&rsquo;è nessuna fase.</p>
  <p><b>Il secondo limite</b> si ottiene prendendo uno stato coerente con $|z|$ grande. Si recupera la <i>traiettoria</i>: un pacchetto stretto che percorre l&rsquo;orbita classica senza allargarsi, con $\langle x(t)\rangle$ che soddisfa esattamente l&rsquo;equazione del moto. <b>Non si recupera l&rsquo;energia definita</b>: il numero di quanti è distribuito secondo Poisson con larghezza $\sqrt{\langle n\rangle}$.</p>
  <p><i>Il primo ha l&rsquo;energia e non la fase; il secondo ha la fase e non l&rsquo;energia.</i> La meccanica classica ha entrambe, e il fatto che nessuno stato quantistico le abbia insieme è la relazione di indeterminazione, letta nelle variabili numero e fase invece che posizione e impulso. <b>Il limite classico non è un limite: è una scelta di cosa sacrificare</b>, e quale scelta sia quella giusta dipende dall&rsquo;esperimento — il conteggio di fotoni vuole la prima, l&rsquo;interferometria la seconda.</p>`},
  {t:'prosa', title:'Dove tutto questo riappare, in fisica', tag:'architettura', html:R`
  <p><b>Nella teoria dei campi.</b> Ogni modo di un campo libero è un oscillatore, e le sue eccitazioni sono le particelle. L&rsquo;operatore numero diventa il numero di particelle, l&rsquo;energia di punto zero diventa l&rsquo;energia del vuoto — e il suo primo infinito. Dirac lo dichiara come il risultato per cui l&rsquo;oscillatore vale la pena: un insieme di bosoni identici <i>è</i> un insieme di oscillatori.</p>
  <p><b>Nella fisica della materia condensata.</b> Le vibrazioni di un reticolo si diagonalizzano in modi normali, e i loro quanti sono i fononi; il calore specifico dei solidi è il calore specifico di $3N$ oscillatori quantistici, ed è il problema con cui Einstein e Debye hanno aperto il campo. Lo stesso schema, applicato alle eccitazioni collettive di un magnete, dà i magnoni.</p>
  <p><b>Nell&rsquo;elettrone in campo magnetico.</b> La hamiltoniana è quadratica negli impulsi canonici, dunque si fattorizza con lo stesso trucco, e lo spettro è una torre equispaziata: i livelli di Landau. L&rsquo;effetto Hall quantistico sta su quello spettro.</p>
  <p><b>Nelle molecole.</b> I livelli vibrazionali di un legame sono quelli di questo movimento, e le loro deviazioni dall&rsquo;equidistanza misurano l&rsquo;anarmonicità, cioè la profondità reale della buca — e dunque l&rsquo;energia di dissociazione. La figura della tappa 01 mostra esattamente dove l&rsquo;approssimazione si rompe e perché quel che resta è informazione chimica.</p>
  <p><b>Nell&rsquo;ottica quantistica e nella metrologia.</b> Lo stato coerente descrive un laser; la sua fluttuazione irriducibile è il <i>rumore quantistico standard</i>, e il limite di sensibilità di un interferometro. Deformare la macchia dello spazio delle fasi — stringerla nella direzione che si misura e allargarla nell&rsquo;altra, a area costante — è ciò che permette di andare sotto quel limite, ed è la tecnica con cui gli interferometri per onde gravitazionali hanno aumentato la loro portata. <i>L&rsquo;area che non si può ridurre è quella calcolata nella tappa 02.</i></p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Si indichi, per ciascuna fonte di questo movimento, un&rsquo;affermazione che non si troverebbe leggendo solo quella.`,
    a:R`Da <b>Picasso</b> non si avrebbero gli stati coerenti — non li tratta affatto — né la dimostrazione dei due risultati che dichiara di rimandare; ma solo da lui si hanno i quattro fatti stabiliti prima di risolvere (paragrafo 5.1), la discussione sulla probabilità in regione proibita e la dichiarazione esplicita delle due convenzioni di fase con l&rsquo;avvertenza di non mescolarle. Da <b>Dirac</b> non si avrebbe nessun conto moderno, ma solo da lui si ha la notazione $\eta$ e il perché, l&rsquo;argomento di completezza e non degenerazione in tre righe, la rappresentazione di Fock, e la dichiarazione che l&rsquo;oscillatore è un fondamento della teoria della radiazione. Da <b>Landau</b> non si avrebbe la via algebrica, ma solo da lui si ha il metodo matriciale del 1925 e, nel problema 3 del suo paragrafo 23, <i>l&rsquo;origine storica degli stati coerenti attribuita a Schrödinger nel 1926</i>, con il conto che li ricava dalla minima indeterminazione invece che da un autovalore. Da <b>Weinberg</b> non si avrebbe nient&rsquo;altro del movimento, ma solo da lui si sa quale fosse la condizione quantica che Heisenberg usò davvero. Da <b>Ballentine</b> si ha quasi tutto il resto: le tre vie del capitolo 6, l&rsquo;osservazione che la condizione al contorno è nascosta in $P=P^{\dagger}$, e l&rsquo;intera teoria degli stati coerenti del paragrafo 19.4, sovracompletezza compresa. Da <b>Sakurai</b> il fatto che decide la seconda metà del movimento, $\langle n|x(t)|n\rangle=0$ per ogni $n$. Da <b>Shankar</b> la ragione strutturale — la diagonalizzazione dell&rsquo;Hessiano — e la proprietà che spiega il nome. Da <b>Griffiths</b> il confronto grafico col limite classico e il problema sulla regione proibita. <i>Il punto in cui tre fonti dicono la stessa cosa nello stesso posto è la distribuzione di Poisson</i>: Landau la ricava dal pacchetto gaussiano, Ballentine dall&rsquo;operatore di spostamento, Sakurai la enuncia come proprietà — e quando tre strade diverse portano alla stessa distribuzione, quella distribuzione non è un accidente del metodo.`},
   {q:R`Un orale chiede: «mi ricavi lo spettro dell&rsquo;oscillatore armonico». Qual è il minimo che va scritto, e qual è l&rsquo;errore più probabile?`,
    a:R`<b>Il minimo:</b> definire $\eta$ (o $a$) dichiarando la convenzione; calcolare $\eta^{\dagger}\eta$ per esteso e mostrare che il commutatore lascia il termine $-\tfrac12$, da cui $H=\hbar\omega(\eta^{\dagger}\eta+\tfrac12)$; ricavare $[\eta,\eta^{\dagger}]=1$ e i due commutatori con $H$; mostrare che $\eta|E\rangle$ è autovettore con autovalore $E-\hbar\omega$ <i>purché non sia nullo</i>; invocare la positività di $\langle H\rangle$ per concludere che la catena discendente deve terminare; calcolare $E_{0}$ da $\langle E_{0}|\eta^{\dagger}\eta|E_{0}\rangle=0$; mostrare che la catena ascendente non termina; e <b>argomentare che non ci sono altri autovalori</b>, perché una catena che scavalchi $\hbar\omega/2$ non si interromperebbe. <b>Gli errori più probabili sono tre, in ordine di gravità.</b> Il primo è omettere l&rsquo;ultimo passaggio: senza di esso si è dimostrato che i $(n+\tfrac12)\hbar\omega$ <i>sono</i> autovalori, non che siano gli <i>unici</i> — e la differenza è l&rsquo;intero contenuto della quantizzazione. Il secondo è dimenticare la clausola «purché non sia nullo», che non è una cautela ma il meccanismo stesso. Il terzo è asserire la non degenerazione come se fosse stata dimostrata: <i>non lo è, dall&rsquo;argomento delle catene</i>, e il modo corretto è citare l&rsquo;argomento di Dirac — tutte le variabili dinamiche sono funzioni di $\eta$ e $\eta^{\dagger}$, dunque $H$ da sola è un insieme completo di osservabili che commutano — oppure dichiarare che si rimanda, come fa Picasso.`}
  ]}
]}

var byId = {}; TAPPE.forEach(function(s){ byId[s.num]=s; });

var VKEY='pm-nucleomq-12-visited';
function loadSeen(){ try{ return new Set(JSON.parse(localStorage.getItem(VKEY)||'[]')); }catch(e){ return new Set(); } }
function saveSeen(s){ try{ localStorage.setItem(VKEY, JSON.stringify(Array.from(s))); }catch(e){} }
var SEEN = loadSeen();

function renderNav(active){
  var nav=document.getElementById('sidebar');
  nav.innerHTML='';
  var h=document.createElement('h2'); h.textContent='Nucleo mq-12 · le tappe'; nav.appendChild(h);
  TAPPE.forEach(function(s){
    var b=document.createElement('button');
    b.className='navitem'+(active===s.num?' active':'')+(SEEN.has(s.num)?' seen':'');
    b.innerHTML='<span class="dot"></span><span class="nx">'+s.num+'</span><span>'+s.title+'</span>';
    b.onclick=function(){ showTappa(s.num); };
    nav.appendChild(b);
  });
}

/* ---- renderer dei blocchi ---- */
function sectionProsa(title, tag, html){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var body=elFromHTML('<div class="open-body">'+html+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function sectionGram(title, rows){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag gramtag">grammatica</span></h3>';
  var inner='<table class="gramtab">';
  rows.forEach(function(r){ inner+='<tr><td class="gs">'+r[0]+'</td><td>'+r[1]+'</td></tr>'; });
  inner+='</table>';
  var body=elFromHTML('<div class="gramwrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
/* --- blocco PLOT: la figura non decora, si legge. Ogni plot porta una chiave di lettura. --- */
function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';
  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionSvelabile(title, tag, html, sol){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var c=document.createElement('div'); c.className='collaudo-item';
  var q=document.createElement('div'); q.className='cq'; q.innerHTML=html||'';
  c.appendChild(q); typeset(q);
  if(sol){
    var a=document.createElement('div'); a.className='ca'; a.style.display='none';
    a.innerHTML='<b>Soluzione.</b> '+sol;
    var btn=document.createElement('button'); btn.className='reveal-btn small';
    btn.textContent='Rivela la soluzione';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a);
      btn.disabled=true; btn.classList.add('done'); btn.textContent='Soluzione rivelata'; };
    c.appendChild(btn); c.appendChild(a);
  }
  wrap.appendChild(c); return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    /* DUE SCHEMI, NON UNO — scoperto il 2026-10-06 provando le pagine vive. I movimenti
       scritti per primi (em-01..03, me-10b, i collaudi di gd-01..09 e di quattro em)
       usano una forma piu' semplice: `reveal` e `prolessi` con un solo `html`,
       `esercizio` e `collaudo` con `html` + `sol`. Il renderer ne conosceva una sola e
       chiamava `steps.forEach` su `undefined`: TypeError, e la tappa si fermava li' —
       62 blocchi in 17 movimenti su 74. Non si riscrive il contenuto per far contento
       il renderer: e' il renderer che deve leggere cio' che c'e'.
       E in fondo un ramo che NON muore: uno schema nuovo di domani deve far vedere un
       avviso in quella sezione, non spegnere la pagina sotto di se'. */
    try{
      if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
      else if(b.t==='prolessi') m.appendChild(b.rotte ? sectionProlessi(b)
                                   : sectionProsa(b.title,'prolessi',b.html));
      else if(b.t==='reveal')m.appendChild(b.steps ? sectionReveal(b.title,b.tag,b.steps)
                                   : sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='esercizio') m.appendChild(b.steps ? sectionEsercizio(b)
                                   : sectionSvelabile(b.title,'esercizio',b.html,b.sol));
      else if(b.t==='collaudo')  m.appendChild(b.items ? sectionCollaudo(b.title,b.items)
                                   : sectionSvelabile(b.title,'provi, poi riveli',b.html,b.sol));
      else if(b.t==='plot')      m.appendChild(sectionPlot(b));
      else m.appendChild(sectionProsa(b.title||'(blocco)', 'tipo sconosciuto: '+b.t,
                                      b.html||''));
    }catch(err){
      var avv=document.createElement('section'); avv.className='section';
      avv.innerHTML='<h3>'+(b.title||'(blocco)')+'<span class="tag">non reso</span></h3>'
        +'<p style="color:#ff6b6b">Questo blocco non si &egrave; potuto rendere ('
        +b.t+': '+err.message+'). Il resto della tappa continua sotto.</p>';
      m.appendChild(avv);
    }
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* I POP-UP DEGLI STRUMENTI. `cablaStrumenti` esisteva dal 18-09 e non la chiamava
     nessuno: i 229 rimandi del percorso erano <span> senza handler, e il clic non
     faceva niente. Nessun controllo poteva vederlo — la sintassi era valida, le schede
     c'erano tutte, le formule rendevano: il guasto esisteva solo a pagina viva. Qui, e
     dopo ogni inserimento successivo, perche' la tappa si rimonta da capo a ogni
     cambio e gli handler vanno riattaccati al DOM nuovo. */
  cablaStrumenti(m);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}
