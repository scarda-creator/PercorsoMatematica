<style>
  :root{
    --bg:#0e1117; --panel:#161b22; --panel2:#1c232d; --border:#2b333d;
    --txt:#eef3f8; --muted:#b9c4d1; --accent:#4c8dff; --accent2:#8fb0ff;
    --ok:#2ea043; --okbg:#10331b; --warn:#d8a13a; --warnbg:#332a10;
    --gram:#5eead4; --grambg:#0f2a26;
    --pro:#b98cff; --probg:#1a1430; --proline:#2a2247; --proedge:#3a2d5c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    font-size:17px;line-height:1.55;}
  a{color:var(--accent2);}
  .banner{background:var(--panel2);border-bottom:1px solid var(--border);color:var(--muted);
    font-size:.8rem;font-weight:600;text-align:center;padding:8px 12px;letter-spacing:.3px;}
  .banner b{color:var(--accent2);}
  .shell{display:flex;max-width:1180px;margin:0 auto;align-items:flex-start;}

  /* ---- SIDEBAR ---- */
  .sidebar{width:280px;flex:0 0 280px;padding:20px 12px 60px;position:sticky;top:0;
    max-height:100vh;overflow-y:auto;border-right:1px solid var(--border);}
  .sidebar h2{font-size:.72rem;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);
    margin:18px 8px 8px;}
  .navitem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:none;
    background:transparent;color:var(--txt);padding:9px 10px;border-radius:8px;cursor:pointer;
    font-size:.9rem;transition:.12s;border:1px solid transparent;}
  .navitem:hover{background:var(--panel2);}
  .navitem.active{background:#13233f;border-color:var(--accent);color:#fff;}
  .navitem .dot{width:7px;height:7px;border-radius:50%;background:transparent;flex:0 0 7px;
    border:1px solid var(--border);}
  .navitem.seen .dot{background:var(--ok);border-color:var(--ok);}
  .navitem .nx{color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto;}

  /* ---- MAIN ---- */
  .main{flex:1 1 auto;min-width:0;padding:24px 30px 90px;max-width:860px;}
  h1{font-size:1.5rem;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:.92rem;margin:0 0 18px;}
  .sfhead{border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:8px;}
  .sfhead h1{font-size:1.55rem;}
  .meta{color:var(--muted);font-size:.82rem;margin-top:6px;}

  .section{margin:26px 0;}
  .section > h3{font-size:1.02rem;color:var(--accent2);margin:0 0 10px;
    display:flex;align-items:center;gap:10px;}
  .section > h3 .tag{font-size:.66rem;font-weight:700;letter-spacing:.4px;background:var(--panel2);
    border:1px solid var(--border);color:var(--muted);padding:2px 8px;border-radius:20px;
    text-transform:uppercase;}
  /* --- blocchi figura --- */
  .section > h3 .tag.plottag{background:#101f2e;border-color:#1f3c57;color:#7ab8e0;}
  .plot-intro{color:var(--muted);font-size:.95rem;margin:0 0 12px;}
  .plot-row{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;
    background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;}
  .plot-row.due .plot-box{flex:1 1 300px;min-width:280px;}
  .plot-box{max-width:560px;}
  .plot-leggi{margin-top:10px;background:var(--panel2);border:1px solid var(--border);
    border-left:3px solid #4a8fc7;border-radius:0 10px 10px 0;padding:11px 14px;
    font-size:.93rem;color:var(--muted);}
  .plot-leggi b{color:#7ab8e0;}
  .plot-err{color:#ff6b6b;font-size:.85rem;}
  .open-body{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
  .open-body p:first-child{margin-top:0;} .open-body p:last-child{margin-bottom:0;}
  .open-body ul{margin:.4em 0;padding-left:1.2em;} .open-body li{margin:.35em 0;}

  .note{background:var(--panel2);border-left:3px solid var(--muted);border-radius:6px;
    padding:9px 12px;margin:12px 0;font-size:.9rem;color:var(--muted);}
  .note b{color:#ff9d6b;}
  .note.warn{background:var(--warnbg);border-left-color:var(--warn);color:#e0b85a;}
  .note.warn b{color:#f0c25a;}

  /* ---- GRAMMATICA ---- */
  .gramwrap{background:var(--grambg);border:1px solid #1f4d47;border-radius:12px;padding:6px 6px;}
  table.gramtab{border-collapse:collapse;width:100%;font-size:.92rem;}
  table.gramtab td{padding:9px 12px;vertical-align:top;border-bottom:1px solid #17332e;}
  table.gramtab tr:last-child td{border-bottom:none;}
  table.gramtab td.gs{white-space:nowrap;color:var(--gram);width:1%;
    border-right:1px solid #17332e;font-variant-numeric:tabular-nums;}
  .section > h3 .tag.gramtag{background:var(--grambg);border-color:#1f4d47;color:var(--gram);}

  /* ---- STRUMENTI (repertorio condiviso: la scheda si apre DENTRO la frase) ----
     Nessun accento nuovo: riusa il verde della grammatica, perche' uno strumento
     richiamato e' grammatica gia' spiegata altrove, non una quinta specie di blocco. */
  .str{color:var(--gram);border-bottom:1px dashed var(--gram);cursor:pointer;}
  .str:hover{background:var(--grambg);}
  .str::after{content:"\2666";font-size:.62em;vertical-align:.42em;margin-left:2px;opacity:.8;}
  .str.aperto::after{content:"\2715";}
  .str.rotto{color:#ff6b6b;border-bottom-color:#ff6b6b;cursor:help;}
  /* la scheda e' uno SPAN in display:block, non un div: i rimandi cadono dentro
     <p>, <li> e celle di tabella, dove un div e' HTML illegale. */
  .strcard{display:block;margin:10px 0;background:var(--grambg);border:1px solid #1f4d47;
    border-left:3px solid var(--gram);border-radius:0 10px 10px 0;padding:10px 14px;font-size:.9rem;}
  .strcard .sh{display:block;font-size:.66rem;font-weight:700;letter-spacing:.5px;
    text-transform:uppercase;color:var(--gram);margin-bottom:7px;}
  .strcard .sr{display:block;margin:5px 0;}
  .strcard .sk{color:var(--gram);font-weight:600;}

  /* ---- PROLESSI (preannuncio fisico) ---- */
  .prowrap{background:var(--probg);border:1px solid var(--proedge);border-radius:12px;padding:4px 4px 8px;}
  .prohead{padding:11px 14px 4px;color:var(--pro);font-size:.72rem;font-weight:700;letter-spacing:.7px;
    text-transform:uppercase;}
  .pro-oggetto{padding:2px 14px 11px;color:var(--muted);font-size:.92rem;border-bottom:1px solid var(--proline);
    margin-bottom:2px;} .pro-oggetto b{color:var(--txt);}
  table.protab{border-collapse:collapse;width:100%;font-size:.92rem;}
  table.protab td{padding:10px 12px;vertical-align:top;border-bottom:1px solid var(--proline);}
  table.protab tr:last-child td{border-bottom:none;}
  table.protab td.pd{white-space:nowrap;color:var(--pro);width:1%;font-weight:700;font-size:.78rem;
    letter-spacing:.3px;text-transform:uppercase;border-right:1px solid var(--proline);line-height:1.3;}
  .pro-domanda{margin:8px 8px 2px;background:#140d26;border:1px solid var(--proedge);
    border-left:3px solid var(--pro);border-radius:8px;padding:10px 14px;font-size:.92rem;}
  .pro-domanda b{color:var(--pro);}
  .section > h3 .tag.protag{background:var(--probg);border-color:var(--proedge);color:var(--pro);}

  /* ---- REVEAL ---- */
  .rsteps{display:flex;flex-direction:column;gap:12px;}
  .rstep{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 18px;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .rlabel{font-size:.7rem;font-weight:700;letter-spacing:.4px;color:var(--accent);
    text-transform:uppercase;margin-bottom:8px;}
  .rstep p:first-of-type{margin-top:0;} .rstep p:last-child{margin-bottom:0;}
  .rstep ul{margin:.4em 0;padding-left:1.2em;}
  .testo{background:#13233f;border:1px solid #2b4877;border-radius:12px;padding:14px 18px;margin-bottom:14px;}
  .testo .src{display:block;font-size:.74rem;font-style:italic;color:var(--accent2);margin-bottom:8px;
    text-transform:uppercase;letter-spacing:.3px;}
  .esame-nota{font-size:.9rem;color:var(--muted);font-style:italic;margin-top:12px;padding-left:12px;
    border-left:3px solid var(--border);}

  .reveal-btn{background:var(--accent);color:#fff;border:none;padding:11px 18px;border-radius:10px;
    font-size:.95rem;font-weight:600;cursor:pointer;margin-top:14px;transition:.12s;}
  .reveal-btn:hover:not(:disabled){background:var(--accent2);}
  .reveal-btn.small{padding:7px 14px;font-size:.85rem;margin-top:0;background:var(--panel2);
    color:var(--accent2);border:1px solid var(--border);}
  .reveal-btn.small:hover:not(:disabled){border-color:var(--accent);}
  .reveal-btn:disabled,.reveal-btn.done{background:var(--panel2);color:var(--muted);
    border:1px solid var(--border);cursor:default;}

  /* ---- COLLAUDO ---- */
  .collaudo-item{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 18px;margin-bottom:12px;}
  .cq{margin-bottom:10px;}
  .ca{margin-top:12px;background:var(--okbg);border:1px solid #235c33;border-radius:8px;
    padding:10px 14px;font-size:.94rem;}
  .ca b{color:#5fd980;}

  /* ---- PREV / NEXT ---- */
  .prevnext{display:flex;justify-content:space-between;gap:12px;margin-top:40px;
    border-top:1px solid var(--border);padding-top:20px;}
  .pnbtn{flex:1 1 0;background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:12px 16px;cursor:pointer;color:var(--txt);text-align:left;transition:.14s;font:inherit;}
  .pnbtn:hover{border-color:var(--accent);background:var(--panel2);}
  .pnbtn.next{text-align:right;}
  .pnbtn .k{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .pnbtn .t{font-weight:600;color:var(--accent2);}
  .pnbtn:disabled{opacity:.35;cursor:default;border-color:var(--border);background:var(--panel);}

  code{background:var(--panel2);border:1px solid var(--border);border-radius:5px;
    padding:1px 5px;font-size:.85em;color:var(--accent2);}
  .katex{font-size:1.02em;color:var(--txt);} .katex-display{margin:.5em 0;overflow-x:auto;overflow-y:hidden;}

  @media(max-width:860px){
    .shell{flex-direction:column;}
    .sidebar{width:100%;flex:none;position:static;max-height:none;border-right:none;
      border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:4px;}
    .sidebar h2{width:100%;} .navitem{width:auto;}
    .main{padding:20px 16px 80px;}
  }
</style>

<script>
"use strict";
const R = String.raw;

function typeset(el){
  if(el && window.renderMathInElement){
    try{ renderMathInElement(el,{delimiters:[
      {left:'$$',right:'$$',display:true},

function elFromHTML(html){ var d=document.createElement('div'); d.innerHTML=html; return d; }

/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un
   rimando scritto nella prosa:

       <span class="str" data-str="serie-geometrica">la serie geometrica</span>

   Le schede citate da questo nucleo sono cucite qui sotto dal montaggio
   (assembla-nucleo.js): la pagina resta autosufficiente — niente fetch,
   niente sottocartelle da pubblicare — e un rimando a una scheda che non
   esiste FERMA la costruzione invece di arrivare in pagina rotto.
   Apertura: lo stesso gesto del collaudo (si clicca, il pannello compare,
   si typeset una volta sola), portato dentro la frase.
   =================================================================== */
var CORSO = 'meccanica-quantistica';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["operatore-aggiunto"] = {"nome":"Operatore aggiunto e autoaggiunto","riga":"L'aggiunto e' definito da $\\langle\\phi|\\hat A\\psi\\rangle=\\langle\\hat A^{\\dagger}\\phi|\\psi\\rangle$ per ogni coppia di stati, e l'operatore e' autoaggiunto quando coincidono sia $\\hat A^{\\dagger}$ con $\\hat A$ sia i loro domini.","serve":"E' la condizione che rende un operatore un'osservabile: autovalori reali, e autovettori di autovalori distinti ortogonali. In dimensione finita «autoaggiunto» e «hermitiano» coincidono; in dimensione infinita no, e la differenza non e' pedanteria — l'operatore impulso su una semiretta e' hermitiano e non autoaggiunto, e infatti non e' un'osservabile.","esempio":"Se $\\hat A\\psi=a\\psi$ con $\\hat A$ autoaggiunto, allora $a\\langle\\psi|\\psi\\rangle=\\langle\\psi|\\hat A\\psi\\rangle=\\langle\\hat A\\psi|\\psi\\rangle=a^{*}\\langle\\psi|\\psi\\rangle$; siccome la norma non e' nulla segue $a=a^{*}$, cioe' l'autovalore e' reale. Tre righe, e sono la ragione per cui le osservabili si rappresentano cosi'.","debito":"la distinzione fra hermitiano e autoaggiunto in dimensione infinita — domini, estensioni, indici di difetto — e' il programma di von Neumann e sta fuori da questo percorso: qui si dichiara che esiste e si lavora nel caso buono. La regola di inversione dell'ordine nell'aggiunto di un prodotto si usa e non si dimostra.","controllo":[{"tipo":"uguale","sinistra":"conjugate(a)","vale":"a","ipotesi":{"a":"real"},"dove":"esempio","appare":"a=a^{*}"}],"qui":{},"pieno":null};
STRUM["commutatore"] = {"nome":"Commutatore","riga":"$[\\hat A,\\hat B]=\\hat A\\hat B-\\hat B\\hat A$, antisimmetrico, con la regola di Leibniz $[\\hat A,\\hat B\\hat C]=[\\hat A,\\hat B]\\hat C+\\hat B[\\hat A,\\hat C]$ e la relazione canonica $[\\hat x,\\hat p]=i\\hbar$.","serve":"E' la misura di quanto due operazioni dipendano dall'ordine, e qui l'ordine e' fisica: due osservabili che non commutano non hanno una base comune di autostati, quindi non si misurano insieme con precisione arbitraria. Quasi ogni conto che sembra magico — l'algebra del momento angolare, gli operatori di salita e discesa, il teorema di Ehrenfest — e' una manipolazione di commutatori fatta con quelle regole e nient'altro.","esempio":"Dalla regola di Leibniz, $[\\hat x,\\hat p^{2}]=[\\hat x,\\hat p]\\hat p+\\hat p[\\hat x,\\hat p]=2i\\hbar\\hat p$. E' il conto che fa uscire il teorema di Ehrenfest: la meccanica classica ricompare come relazione fra valori medi, e ricompare perche' quel commutatore vale proprio $2i\\hbar\\hat p$.","debito":"l'identita' di Jacobi si enuncia e non si dimostra; la corrispondenza fra commutatore e parentesi di Poisson — che e' l'idea di Dirac e non un'analogia decorativa — sta in mq-07, e li' va letta per intero.","controllo":[{"tipo":"uguale","sinistra":"I*hbar*p + p*I*hbar","vale":"2*I*hbar*p","ipotesi":{"hbar":"positive","p":"real"},"dove":"esempio","appare":"2i\\hbar\\hat p"},{"tipo":"simbolico","dove":"riga","appare":"[\\hat x,\\hat p]=i\\hbar","perche":"e' la relazione di commutazione canonica, il POSTULATO da cui discende il resto della teoria: non si dimostra, si assume, ed e' cio' che separa la meccanica quantistica dalla classica"}],"qui":{},"pieno":null};
STRUM["parentesi-di-poisson"] = {"nome":"Parentesi di Poisson","riga":"$\\{f,g\\}=\\sum_k\\Big(\\dfrac{\\partial f}{\\partial q_k}\\dfrac{\\partial g}{\\partial p_k}-\\dfrac{\\partial f}{\\partial p_k}\\dfrac{\\partial g}{\\partial q_k}\\Big)$: l'operazione antisimmetrica che, date due funzioni sullo spazio delle fasi, dice di quanto la prima cambia lungo il flusso generato dalla seconda.","serve":"A leggere la meccanica hamiltoniana come una teoria di trasformazioni invece che di traiettorie. Ogni funzione $g(q,p)$ genera una trasformazione canonica infinitesima, $\\delta f=\\varepsilon\\{f,g\\}$, e l'evoluzione temporale e' il caso particolare $g=H$: $\\dot f=\\{f,H\\}$. Da qui escono due cose che non si vedono nelle equazioni di Newton: una quantita' si conserva esattamente quando la trasformazione che genera lascia invariata $H$, e le parentesi fra le coordinate — $\\{q_j,p_k\\}=\\delta_{jk}$ — sono l'unica struttura che una trasformazione canonica deve preservare.","esempio":"Per $H=\\dfrac{p^2}{2m}+V(q)$ con un grado di liberta' le due parentesi fondamentali sono le equazioni di Hamilton riscritte. La coordinata: $\\{q,H\\}=\\dfrac{\\partial q}{\\partial q}\\dfrac{\\partial H}{\\partial p}-\\dfrac{\\partial q}{\\partial p}\\dfrac{\\partial H}{\\partial q}=\\dfrac{p}{m}$, cioe' $\\dot q=p/m$. L'impulso: $\\{p,H\\}=-\\dfrac{\\partial V}{\\partial q}$, cioe' $\\dot p=-V'(q)$, la seconda legge di Newton. E la parentesi fondamentale, calcolata dalla definizione, vale $\\{q,p\\}=1$.","debito":"la dimostrazione che le parentesi di Poisson sono invarianti per trasformazioni canoniche non c'e' qui: e' il contenuto di un corso di meccanica analitica. Qui si usa il fatto, e si usa nella forma che serve — una trasformazione e' canonica quando preserva $\\{q_j,p_k\\}=\\delta_{jk}$.","qui":{"meccanica-quantistica":{"serve":"A capire da dove viene il commutatore, invece di impararlo. L'idea di Dirac e' che la corrispondenza $\\{f,g\\}\\to\\dfrac{1}{i\\hbar}[\\hat f,\\hat g]$ non sia un'analogia decorativa ma la struttura che sopravvive: la trasformazione canonica infinitesima generata da $g$ diventa la trasformazione unitaria infinitesima generata dall'operatore autoaggiunto corrispondente, e il teorema di Noether classico — $\\{g,H\\}=0$ implica $g$ conservata — diventa $[\\hat K,\\hat H]=0$ implica $\\langle \\hat K\\rangle$ costante.","esempio":"Per $H=\\dfrac{p^2}{2m}+V(q)$ si ha $\\{p,H\\}=-\\dfrac{\\partial V}{\\partial q}$: l'impulso si conserva esattamente quando il potenziale non dipende da $q$, cioe' quando il sistema e' invariante per traslazioni. Il conto quantistico corrispondente da' $[\\hat p,\\hat H]=-i\\hbar\\,V'(\\hat q)$, con la stessa conclusione e lo stesso meccanismo."}},"controllo":[{"tipo":"uguale","sinistra":"diff(q,q)*diff(p,p)-diff(q,p)*diff(p,q)","vale":"1","dove":"esempio","appare":"\\{q,p\\}=1"},{"tipo":"uguale","sinistra":"diff(q,q)*diff(p**2/(2*m)+V(q),p)-diff(q,p)*diff(p**2/(2*m)+V(q),q)","vale":"p/m","ipotesi":{"V":"funzione","m":"positive","p":"real","q":"real"},"dove":"esempio","appare":"=\\dfrac{p}{m}"},{"tipo":"uguale","sinistra":"-diff(p**2/(2*m)+V(q),q)","vale":"-diff(V(q),q)","ipotesi":{"V":"funzione","m":"positive","p":"real","q":"real"},"dove":"esempio","appare":"\\{p,H\\}=-\\dfrac{\\partial V}{\\partial q}"}],"pieno":null};
STRUM["spettro"] = {"nome":"Spettro di un operatore","riga":"Lo spettro di un operatore e' l'insieme dei possibili esiti di una misura: i suoi autovalori. Puo' essere discreto (autovalori separati, autovettori in $\\mathcal H$), continuo (autovalori che riempiono un intervallo, autovettori non normalizzabili), o misto.","serve":"E' la quantita' che la fisica chiede davvero: scrivere l'hamiltoniana e trovarne lo spettro E' il problema d'esame. La distinzione discreto/continuo non e' tecnica — decide se un autostato e' uno stato preparabile (discreto) o una distribuzione che vive fuori dallo spazio di Hilbert (continuo), come l'onda piana e la delta.","esempio":"Per $\\sigma_z$ di Pauli lo spettro e' $\\{+1,-1\\}$, discreto; la somma dei due autovalori, cioe' la traccia, e' $1+(-1)=0$. Per l'operatore posizione lo spettro e' tutta la retta reale, continuo.","debito":"la costruzione rigorosa dello spettro continuo (teorema spettrale generalizzato, misura spettrale $E(\\lambda)$ di von Neumann) sta fuori da questo percorso: qui si dichiara che esiste e si lavora coi casi concreti. La separazione fra spettro continuo e spettro residuo non si tratta.","controllo":[{"tipo":"uguale","sinistra":"1+(-1)","vale":"0","dove":"esempio","appare":"1+(-1)=0"}],"qui":{},"pieno":null};
STRUM["traccia"] = {"nome":"Traccia di un operatore","riga":"La traccia e' la somma degli elementi diagonali, $\\operatorname{tr}\\hat A=\\sum_i\\langle i|\\hat A|i\\rangle$. Non dipende dalla base ortonormale scelta, perche' e' invariante per permutazione ciclica: $\\operatorname{tr}(\\hat A\\hat B)=\\operatorname{tr}(\\hat B\\hat A)$, da cui $\\operatorname{tr}(\\hat U^{\\dagger}\\hat A\\hat U)=\\operatorname{tr}\\hat A$.","serve":"E' il modo di estrarre un numero da un operatore senza privilegiare una rappresentazione. Il valor medio di un'osservabile su uno stato si scrive $\\langle A\\rangle=\\operatorname{tr}(\\rho\\hat A)$ con $\\rho=|\\psi\\rangle\\langle\\psi|$, e questa forma — a differenza di $\\langle\\psi|\\hat A|\\psi\\rangle$ — vale identica per gli stati misti, dove $\\rho$ non e' piu' un proiettore: e' la porta verso la matrice densita' e la decoerenza.","esempio":"Per $A=\\begin{pmatrix}1&2\\\\3&4\\end{pmatrix}$ e $B=\\begin{pmatrix}0&1\\\\1&0\\end{pmatrix}$, pur essendo $AB\\neq BA$, le due tracce coincidono: $\\operatorname{tr}(AB)=2+3=5=\\operatorname{tr}(BA)$. La traccia di un proiettore di rango uno vale $1$, e in generale la traccia di un proiettore e' la dimensione del sottospazio su cui proietta.","debito":"la traccia di un operatore in dimensione infinita esiste solo per la classe degli operatori a traccia (totalmente continui), e la costruzione rigorosa — $\\operatorname{tr}(\\hat A^{\\dagger}\\hat A)=\\sum_\\mu\\|\\hat A\\phi_\\mu\\|^2$ indipendente dalla base, von Neumann cap. II.11 — qui si cita. Si lavora col caso in cui la somma converge.","controllo":[{"tipo":"uguale","sinistra":"2+3","vale":"5","dove":"esempio","appare":"\\operatorname{tr}(AB)=2+3=5"}],"qui":{},"pieno":null};
STRUM["spazio-di-hilbert"] = {"nome":"Spazio di Hilbert","riga":"E' uno spazio vettoriale complesso con prodotto interno, completo nella norma che ne deriva e separabile, cosicche' ogni stato si scrive come somma numerabile $|\\psi\\rangle=\\sum_n c_n|n\\rangle$ con $c_n=\\langle n|\\psi\\rangle$.","serve":"E' la casa degli stati, e le tre parole della definizione fanno tre lavori diversi. Il prodotto interno da' le ampiezze, e quindi le probabilita'. La completezza garantisce che il limite di una successione di stati sia ancora uno stato: senza, uno sviluppo in serie potrebbe convergere fuori dallo spazio. La separabilita' permette di scrivere un vettore con una lista numerabile di coefficienti, cioe' di fare i conti.","esempio":"La relazione di completezza $\\sum_n|n\\rangle\\langle n|=\\hat 1$ e' lo strumento operativo piu' usato della teoria: infilata dentro un prodotto scalare lo spezza in una somma. La norma diventa $\\langle\\psi|\\psi\\rangle=\\sum_n|c_n|^{2}$, e se lo stato e' normalizzato quella somma vale uno: i moduli quadri dei coefficienti sono probabilita', e sommano a uno per costruzione.","debito":"la costruzione di $L^{2}$ come completamento, la misura di Lebesgue che serve a definirlo e il teorema di Riesz-Fischer stanno nei movimenti di Metodi; qui si usa il risultato.","controllo":[{"tipo":"somma","espr":"(1/2)**n","var":"n","da":"1","a":"oo","vale":"1","ipotesi":{"n":"positive-integer"},"dove":"esempio","appare":"sommano a uno"},{"tipo":"simbolico","dove":"esempio","appare":"\\sum_n|n\\rangle\\langle n|=\\hat 1","perche":"e' la relazione di completezza: i proiettori sugli elementi di una base ortonormale sommano all'identita'. E' la proprieta' che definisce una base completa, non un conto"}],"qui":{},"pieno":null};
STRUM["derivazione"] = {"nome":"Derivazione (regola di Leibniz)","riga":"Un operatore lineare $D$ su un'algebra che rispetta la regola del prodotto: $D(fg)=f\\,D(g)+g\\,D(f)$. È la proprietà che isola «derivare» fra tutti gli operatori lineari possibili.","serve":"È il modo algebrico di definire la derivata senza limiti, e serve ogni volta che si vuole derivare su un oggetto dove non c'è un rapporto incrementale da fare — su una varietà astratta, su un'algebra di matrici, su un anello di polinomi. La conseguenza operativa più usata è che **una derivazione è determinata dai suoi valori sui generatori**: su $\\mathbb{R}^{n}$ basta sapere quanto vale sulle coordinate $x^{1},\\dots,x^{n}$, e da lì Leibniz e la linearità danno tutto il resto. È il motivo per cui un vettore tangente, definito come derivazione, si scrive sempre come combinazione delle $\\partial/\\partial x^{i}$: non perché lo si sia scelto, ma perché non c'è altro. Un secondo fatto, che si dimostra in due righe e si usa continuamente: la **composizione** di due derivazioni non è una derivazione (compaiono derivate seconde), ma la loro **differenza incrociata** $DE-ED$ lo è, perché i termini secondi si cancellano a coppie.","esempio":"Su $\\mathbb{R}$, l'operatore $d/dx$ verificato sul prodotto $f=x^{2}$ e $g=x^{3}$: la regola dice $x^{2}\\cdot3x^{2}+x^{3}\\cdot2x$, cioè $5x^{4}$, e la derivata diretta di $x^{5}$ dà lo stesso $5x^{4}$. Il conto è banale ed è il punto: Leibniz non aggiunge informazione su $\\mathbb{R}$, dove la derivata si sa già fare. Aggiunge informazione quando è l'unica cosa che si ha — per esempio sull'algebra delle matrici, dove $D(A)=MA-AM$ per una matrice fissata $M$ è una derivazione, e la verifica di Leibniz consiste nello sviluppare $M(AB)-(AB)M$ e riconoscerlo come somma di $A\\,D(B)$ e $D(A)\\,B$, cosa che riesce perché i due termini $AMB$ introdotti dallo sviluppo compaiono con segni opposti e si cancellano.","debito":"che le derivazioni in un punto di una varietà siano esattamente i vettori tangenti è il teorema di gd-06 e non si ripete qui; il caso delle algebre non commutative è citato come esempio e non sviluppato.","controllo":[{"tipo":"uguale","sinistra":"x**2*3*x**2+x**3*2*x","vale":"5*x**4","ipotesi":{"x":"real"},"dove":"esempio","appare":"5x^{4}"},{"tipo":"derivata","espr":"x**5","rispetto":["x"],"vale":"5*x**4","ipotesi":{"x":"real"},"dove":"esempio","appare":"derivata diretta di $x^{5}$"}]};
STRUM["integrale-gaussiano"] = {"nome":"Integrale gaussiano","riga":"$\\displaystyle\\int_{-\\infty}^{+\\infty} e^{-ax^{2}}\\,dx=\\sqrt{\\pi/a}$ per $a>0$, e $\\displaystyle\\int_{-\\infty}^{+\\infty} x^{2}e^{-ax^{2}}\\,dx=\\tfrac12\\sqrt{\\pi/a^{3}}$.","serve":"E' l'unico integrale che serve davvero sapere a memoria in meccanica statistica, perche' l'energia cinetica e' quadratica nell'impulso e quindi ogni integrazione sugli impulsi e' una gaussiana. Il trucco della dimostrazione — elevare al quadrato e passare in coordinate polari — vale la pena di vederlo una volta: e' il motivo per cui compare un $\\pi$ in una formula che di cerchi non parla.","esempio":"Da $I^{2}=\\iint e^{-a(x^{2}+y^{2})}dx\\,dy=2\\pi\\int_{0}^{\\infty}re^{-ar^{2}}dr=\\pi/a$ segue $I=\\sqrt{\\pi/a}$. I momenti superiori si ottengono derivando rispetto ad $a$ sotto il segno: $-\\partial_a I=\\int x^{2}e^{-ax^{2}}dx=\\tfrac12\\sqrt{\\pi}\\,a^{-3/2}$. Derivare rispetto a un parametro e' piu' rapido che integrare per parti, e funziona per tutti i momenti pari.","pieno":null,"qui":{"meccanica-statistica":{"serve":"La funzione di partizione di una particella libera e' un prodotto di tre gaussiane negli impulsi, e da li' esce la lunghezza d'onda termica $\\lambda=h/\\sqrt{2\\pi m k T}$ — che e' la grandezza con cui si misura quando un gas smette di essere classico.","esempio":"$\\int e^{-\\beta p^{2}/2m}dp=\\sqrt{2\\pi m/\\beta}$, quindi $Z_{1}=\\dfrac{V}{h^{3}}(2\\pi mkT)^{3/2}=V/\\lambda^{3}$. Lo stesso integrale col peso $p^{2}$ da' $\\langle p^{2}/2m\\rangle=\\tfrac12 kT$ per grado di liberta': l'equipartizione non e' un principio a parte, e' questo integrale."}}};
STRUM["polinomi-di-hermite"] = {"nome":"Polinomi di Hermite","riga":"$H_n$ sono le soluzioni polinomiali dell'equazione di Hermite, con $H_0=1$, $H_1=2\\xi$, $H_2=4\\xi^{2}-2$ e $H_3=8\\xi^{3}-12\\xi$, ortogonali con peso $e^{-\\xi^{2}}$.","serve":"Sono la parte polinomiale delle autofunzioni dell'oscillatore armonico. Il grado del polinomio da' il numero di nodi, e quindi l'ordine dei livelli: l'ennesimo stato eccitato ha esattamente ennesimi zeri. La parita' si alterna con il grado, ed e' il motivo per cui meta' degli elementi di matrice si annulla senza fare il conto.","esempio":"Il polinomio di grado due si annulla dove $4\\xi^{2}=2$, cioe' in due punti: due nodi, come vuole il grado. E la sua parita' pari fa si' che l'elemento di matrice della posizione fra lo stato fondamentale e il secondo eccitato sia nullo, perche' l'integrando e' dispari — una regola di selezione ottenuta guardando la simmetria invece di integrare.","debito":"la formula di Rodrigues, la funzione generatrice e le relazioni di ricorrenza stanno nei movimenti di Metodi sulle funzioni speciali; qui c'e' cio' che serve per leggere le autofunzioni.","controllo":[{"tipo":"uguale","sinistra":"4*(1/sqrt(2))**2","vale":"2","dove":"esempio","appare":"4\\xi^{2}=2"},{"tipo":"derivata","espr":"4*x**2-2","rispetto":["x"],"vale":"8*x","ipotesi":{"x":"real"},"dove":"riga","appare":"4\\xi^{2}-2"},{"tipo":"integrale","espr":"x*exp(-x**2)","var":"x","da":"-oo","a":"oo","vale":"0","dove":"esempio","appare":"l'integrando e' dispari"}],"qui":{},"pieno":null};
STRUM["trasformata-di-fourier"] = {"nome":"Trasformata di Fourier","riga":"L'operazione $\\hat f(k)=\\int f(x)\\,e^{-ikx}\\,dx$, che riscrive una funzione come sovrapposizione di onde piane e manda la derivata in una moltiplicazione per $ik$.","serve":"È lo strumento che rende ALGEBRICA un'equazione differenziale lineare a coefficienti costanti: con $\\partial_x$ che diventa $ik$, un'equazione differenziale in $x$ diventa un'equazione algebrica in $k$, si risolve, e si antitrasforma. Le due cose da non perdere sono la convenzione dei $2\\pi$, che cambia da testo a testo e va dichiarata una volta, e Plancherel, che dice che la trasformata conserva la norma $L^{2}$ — in fisica, l'energia.","esempio":"La gaussiana $f(x)=e^{-x^{2}/2}$ ha trasformata $\\int_{-\\infty}^{+\\infty}e^{-x^{2}/2}e^{-ikx}\\,dx=\\sqrt{2\\pi}\\,e^{-k^{2}/2}$: ancora una gaussiana, tanto più larga quanto l'originale è stretta. È il caso in cui si vede meglio il principio di indeterminazione come fatto puramente matematico.","pieno":{"file":"15-distribuzioni.html","tappa":"02","come":"le proprietà, la derivata che diventa un prodotto e Plancherel, nel nucleo delle distribuzioni"},"qui":{"elettromagnetismo":{"serve":"Serve appena si scrive un'onda generica invece di una monocromatica: ogni soluzione delle equazioni di Maxwell nel vuoto è una sovrapposizione di onde piane $e^{i(\\mathbf k\\cdot\\mathbf x-\\omega t)}$, e la trasformata è il modo di scomporla. Su ciascuna componente l'equazione delle onde si riduce alla relazione di dispersione, e la propagazione diventa un far girare fasi: ogni modo viaggia da solo, e nel vuoto tutti alla stessa velocità — per questo un impulso non si deforma.","esempio":"La sostituzione $\\partial_x\\to ik$ e $\\partial_t\\to-i\\omega$ manda le derivate seconde in $(ik)^{2}=-k^{2}$ e $(-i\\omega)^{2}=-\\omega^{2}$: l'equazione delle onde diventa $\\omega^{2}=c^{2}k^{2}$, cioè un'equazione di secondo grado al posto di una differenziale, e la sua radice positiva $\\omega=ck$ è la relazione di dispersione del vuoto."}},"controllo":[{"tipo":"integrale","espr":"exp(-x**2/2)*exp(-I*k*x)","var":"x","da":"-oo","a":"oo","vale":"sqrt(2*pi)*exp(-k**2/2)","ipotesi":{"k":"real"},"dove":"esempio","appare":"\\sqrt{2\\pi}\\,e^{-k^{2}/2}"},{"tipo":"uguale","sinistra":"(I*k)**2","vale":"-k**2","ipotesi":{"k":"real"},"dove":"qui.elettromagnetismo.esempio","appare":"-k^{2}"},{"tipo":"uguale","sinistra":"(-I*w)**2","vale":"-w**2","ipotesi":{"w":"real"},"dove":"qui.elettromagnetismo.esempio","appare":"-\\omega^{2}"},{"tipo":"uguale","sinistra":"(c*k)**2","vale":"c**2*k**2","dove":"qui.elettromagnetismo.esempio","appare":"c^{2}k^{2}"}]};
STRUM["delta-di-dirac"] = {"nome":"Delta di Dirac","riga":"Non è una funzione ma un funzionale, definito da $\\int f(x)\\,\\delta(x-a)\\,dx=f(a)$, che composto con una funzione si spezza sui suoi zeri come $\\delta(g(x))=\\sum_i \\delta(x-x_i)/|g'(x_i)|$.","serve":"Serve come macchina per cambiare variabile senza invertire nulla. La densità di $y=f(x)$ si scrive $p_Y(y)=\\int p_X(x)\\,\\delta(y-f(x))\\,dx$, e la delta produce da sola il fattore $1/|f'|$ che altrimenti andrebbe messo a mano: i rami molteplici si contano da soli invece di doverli ricordare. È la ragione pratica per cui il formalismo con la delta compare in ogni soluzione d'esame che tocchi una distribuzione, mentre il cambio di variabile esplicito compare quasi mai.","esempio":"$\\delta(x^2-a^2)$ con $a$ positivo. Gli zeri sono $x=\\pm a$; la derivata dell'argomento è $2x$, che in modulo vale $2a$ su entrambi. Quindi $\\delta(x^2-a^2)=\\dfrac{1}{2a}\\big[\\delta(x-a)+\\delta(x+a)\\big]$. Il caso si ripete identico in fisica statistica con $\\varepsilon=p^2/2m$ in una dimensione, dove i due rami $p=\\pm\\sqrt{2m\\varepsilon}$ contribuiscono entrambi — e dimenticarne uno dimezza la risposta.","pieno":{"file":"15-distribuzioni.html","tappa":"01","come":"le distribuzioni come funzionali, la delta e le sue proprietà, nel nucleo di Metodi"},"qui":{"meccanica-statistica":{"serve":"È lo strumento con cui si calcola la densità degli stati, cioè l'oggetto su cui poggia tutto il secondo tempo del corso: $g(\\varepsilon)=\\int d^dp\\,d^dq\\;\\delta(\\varepsilon-H)/h^d$. L'identità che si usa davvero non è la definizione ma questa: $\\delta(\\varepsilon-H)=\\partial_\\varepsilon\\,\\theta(\\varepsilon-H)$. Si scambia l'integrale con la derivata e ci si ritrova a calcolare il volume della regione dove l'hamiltoniana sta sotto $\\varepsilon$ — un integrale elementare — invece di un integrale con una delta dentro. La $g$ così ottenuta è pura geometria dello spazio delle fasi: non sa nulla della temperatura, e per questo resta identica quando si passa da Boltzmann a Fermi o a Bose.","esempio":"Particella libera in due dimensioni. Il volume della regione $p^2/2m$ sotto $\\varepsilon$ è il disco di area $2\\pi m\\varepsilon$; derivando rispetto a $\\varepsilon$ si ottiene $2\\pi m$, cioè una densità degli stati costante. Non è una curiosità: è la ragione per cui in due dimensioni una particella libera non condensa, e per cui le prove che chiedono la condensazione in $d=2$ mettono sempre un potenziale confinante, che porta la $g$ da costante a crescente."}},"controllo":[{"tipo":"derivata","espr":"x**2-a**2","rispetto":["x"],"vale":"2*x","ipotesi":{"x":"positive","a":"positive"},"dove":"esempio","appare":"2x"},{"tipo":"uguale","sinistra":"1/Abs(2*a)","vale":"1/(2*a)","ipotesi":{"a":"positive"},"dove":"esempio","appare":"\\dfrac{1}{2a}"},{"tipo":"derivata","espr":"2*pi*m*e","rispetto":["e"],"vale":"2*pi*m","ipotesi":{"m":"positive","e":"positive"},"dove":"qui.meccanica-statistica.esempio","appare":"2\\pi m"}]};
STRUM["operatore-unitario"] = {"nome":"Operatore unitario","riga":"Un operatore $\\hat U$ e' unitario quando $\\hat U^{\\dagger}\\hat U=\\hat U\\hat U^{\\dagger}=\\mathbb 1$, cioe' $\\hat U^{\\dagger}=\\hat U^{-1}$. Equivale a dire che conserva il prodotto interno: $\\langle \\hat U\\phi|\\hat U\\psi\\rangle=\\langle\\phi|\\psi\\rangle$ per ogni coppia di stati.","serve":"Conservare il prodotto interno vuol dire conservare le probabilita': ogni trasformazione fisica che non cambia gli esiti di una misura — un cambio di base, una traslazione, una rotazione, l'evoluzione temporale — e' unitaria. I suoi autovalori hanno modulo uno, e due osservabili legate da un operatore unitario hanno lo stesso spettro.","esempio":"La rotazione del piano $\\hat U=\\begin{pmatrix}\\cos\\theta&-\\sin\\theta\\\\\\sin\\theta&\\cos\\theta\\end{pmatrix}$ e' unitaria e ha autovalori $e^{\\pm i\\theta}$, di modulo $|e^{i\\theta}|=1$. La matrice $S$ del cambio di base ortonormale e' unitaria per lo stesso motivo: manda una base ortonormale in un'altra.","debito":"la trasformata di Cayley $\\hat U=(\\hat A-i)/(\\hat A+i)$, che lega operatori autoaggiunti e unitari e con cui von Neumann risolve il problema agli autovalori in dimensione infinita, si cita e non si costruisce.","controllo":[{"tipo":"uguale","sinistra":"Abs(exp(I*theta))","vale":"1","ipotesi":{"theta":"real"},"dove":"esempio","appare":"|e^{i\\theta}|=1"}],"qui":{},"pieno":null};

function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';
  return h;
}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

fonti:     Picasso, Lezioni di Meccanica Quantistica (ETS 2015) — E' LA FONTE PORTANTE
           ITALIANA, e il capitolo 5 per intero e' la prima meta' di questo movimento.
           Il par. 5.1 «Positivita' degli Autovalori dell'Energia» (pag. stampate 87-89)
           e' cio' che nessun manuale inglese fa: stabilisce quattro fatti sullo spettro
           PRIMA di averlo calcolato — gli autovalori sono positivi, i valori medi di p e
           q su ogni autostato sono nulli (e questo vale per OGNI potenziale, non solo
           per l'oscillatore), il fondamentale soddisfa E_0 >= hbar omega / 2 per la sola
           relazione di indeterminazione, e il teorema del viriale. Il par. 5.2 «I
           Livelli Energetici dell'Oscillatore Armonico» (pag. 89-92) introduce gli
           operatori eta ed eta-dagger — NON a e a-dagger — con la definizione eta =
           (p - i m omega q)/sqrt(2 m hbar omega), dimostra che la catena discendente
           deve interrompersi e che quella ascendente non puo', ricava la normalizzazione
           per induzione dal commutatore [eta, (eta-dagger)^n] = n (eta-dagger)^(n-1), e
           DICHIARA due debiti: la non degenerazione e la completezza, che rimanda.
           Il par. 6.1 (pag. 96) contiene l'argomento della traccia: se lo spazio
           avesse dimensione finita, [q,p] = i hbar sarebbe impossibile. Il par. 6.2
           «La Rappresentazione di Heisenberg per l'Oscillatore Armonico» (pag. 96-97)
           scrive le matrici di q e p e dichiara la scelta di fase che le rende una
           immaginaria pura e l'altra reale, con l'avvertenza esplicita di non mescolare
           formule prese nelle due convenzioni. Il par. 8.1 (pag. 137-139) passa alla
           rappresentazione di Schrodinger per la via breve (applicare n volte
           l'operatore di salita alla gaussiana) e osserva che psi_0 ha i flessi nei
           punti di inversione classici.
           Dirac, I Principi di Meccanica Quantistica — VOCE FONDATIVA, e la notazione
           eta e' SUA: il par. 34 «L'oscillatore armonico» (pag. stampate 187-192)
           definisce eta come «variabile dinamica adimensionale complessa» e scrive la
           fattorizzazione [34.5] hbar omega eta-barra eta = H - hbar omega / 2. Da lui,
           e non da Picasso, vengono i due argomenti che Picasso dichiara di rimandare:
           i ket eta-barra^n |0> formano un insieme completo perche' ogni variabile
           dinamica del problema e' funzione di eta ed eta-barra, e H da sola e' un
           insieme completo di osservabili che commutano, cioe' lo spettro e' non
           degenere. Dirac introduce anche la rappresentazione di Fock — la funzione
           d'onda come serie di potenze nella variabile complessa eta-barra — e nel par.
           40 ricava la regola di selezione Delta n = +-1 dalla sola [34.8]. Il par. 60
           «La connessione fra oscillatori e bosoni» (pag. 316-317) e' dove dichiara
           perche' gli importava.
           Landau-Lifsits, Fisica Teorica vol. III (MIR 1976, italiano) — SECONDA VOCE
           FONDATIVA, e porta due cose che nessun'altra fonte ha. Il par. 23
           «Oscillatore lineare» (pag. stampate 90-96) risolve il problema col METODO
           MATRICIALE, con la nota in calce «cio' e' stato fatto da Heisenberg nel 1925
           prima che Schrodinger scoprisse l'equazione d'onda»: dalle equazioni del moto
           ricava che solo gli elementi x_{n,n+-1} sono non nulli, dalla regola di
           commutazione che i quadrati (x_{n+1,n})^2 formano una progressione aritmetica,
           e da lei lo spettro. E il PROBLEMA 3 dello stesso paragrafo (pag. 95-98)
           costruisce gli stati di minima indeterminazione con la nota «E. Schrodinger,
           1926» e la postilla «tali stati sono detti stati coerenti»: e' l'origine
           storica dell'oggetto, ed e' una domanda diversa da quella dei manuali moderni.
           Ballentine, Quantum Mechanics: A Modern Development — il capitolo 6 (pag.
           stampate 151-159) da' la soluzione per TRE vie e dichiara perche' coincidono:
           il par. 6.1 e' algebrico, il 6.2 e' la serie di potenze con la formula di
           ricorrenza e il troncamento, e il 6.3 e' la via che nessun altro prende —
           diagonalizzare la POSIZIONE nella base dell'energia, ottenendo per ricorrenza
           lo spettro continuo di Q. La sua osservazione decisiva sta a pag. 157: la
           condizione al contorno psi -> 0 che quantizza nella via analitica NON e'
           assente nella via algebrica, e' nascosta nella richiesta P = P-dagger. Il par.
           19.4 «States of the EM Field» (pag. 539-547) e' la fonte portante degli stati
           coerenti: l'operatore di spostamento D(z) = exp(z a-dagger - z* a), le tre
           definizioni equivalenti, la non-ortogonalita', la relazione di completezza
           con la misura d^2 z sul piano complesso, la SOVRACOMPLETEZZA e la conseguenza
           che la traccia non si calcola in quella base, la distribuzione di Poisson del
           numero di fotoni e il limite classico del campo.
           Sakurai-Napolitano, Modern Quantum Mechanics (2a ed.) — e' il testo che
           fissa l'ORDINE del corso. Il par. 2.3 (pag. stampate 89-97) attribuisce il
           metodo a Dirac «based on the earlier work of M. Born and N. Wiener», da' gli
           elementi di matrice di x e p nella base del numero, l'evoluzione nello schema
           di Heisenberg con il lemma di Baker-Hausdorff, e il fatto che decide le
           ultime cinque tappe: <n|x(t)|n> = 0 per OGNI n, per quanto grande. Il
           Problema 2.19 e' lo studio degli stati coerenti in quattro punti.
           Shankar, Principles of Quantum Mechanics — testo consigliato dal docente. Il
           par. 7.1 «Why Study the Harmonic Oscillator?» (pag. 185-188) da' la ragione
           STRUTTURALE e non esemplificativa: diagonalizzare la matrice delle derivate
           seconde del potenziale riduce QUALUNQUE sistema vicino a un equilibrio stabile
           a N oscillatori disaccoppiati. Il par. 21.1 (pag. 607-610) da' la proprieta'
           che spiega il nome: sotto l'evoluzione uno stato coerente resta coerente, con
           etichetta z e^(-i omega t).
           Griffiths, Introduction to Quantum Mechanics (2a ed.) — il par. 2.3 (pag.
           stampate 40-59) per la via analitica svolta passo per passo e per il confronto
           grafico col limite classico a n = 100, e il Problema 2.17 (la probabilita' di
           trovare la particella fuori dalla regione classicamente permessa nello stato
           fondamentale, che qui si calcola).
           Weinberg, Lectures on Quantum Mechanics — VOCE FONDATIVA in inglese. Il par.
           1.4 «Matrix Mechanics» (pag. stampate 18-21) e' l'unico posto in cui si legge
           la condizione quantica che Heisenberg USO' DAVVERO nel 1925: non [x,p] = i
           hbar, che non esisteva ancora, ma la regola di somma di Thomas-Kuhn. Il par.
           2.5 (pag. 49-51) definisce gli operatori nella forma di Dirac e chiude la
           catena ascendente con un argomento diverso da quello di Picasso: la soluzione
           di a-dagger psi = 0 non e' normalizzabile.
           NOTA DICHIARATA: Picasso NON tratta gli stati coerenti — zero occorrenze in
           tutto il libro nel senso tecnico. Per quelle cinque tappe la fonte portante
           cambia, e sono Ballentine 19.4, Landau 23 Problema 3 e Shankar 21.1.

/* ---------------- 00 · DI COSA PARLA QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Di cosa parla questo movimento', meta:'Meccanica Quantistica · voce Q.14 · lo spettro senza equazioni differenziali · tre vie che coincidono e il motivo · Heisenberg 1925 come lo fece lui · gli stati coerenti dal 1926',
  blocchi:[
  {t:'prosa', title:'La domanda, e perché ce ne sono due', tag:'architettura', html:R`
  <p>L&rsquo;oscillatore armonico è l&rsquo;unico potenziale confinante che si risolve <i>senza risolvere un&rsquo;equazione differenziale</i>. Si fattorizza la hamiltoniana come un prodotto di due operatori coniugati, si osserva che uno dei due abbassa l&rsquo;energia di una quantità fissa e l&rsquo;altro la alza, e lo spettro cade fuori dall&rsquo;algebra. È il prototipo di tutto ciò che in meccanica quantistica si risolve così — e la stessa macchina, con tre lettere cambiate, dà lo spettro del momento angolare, i livelli di Landau di un elettrone in campo magnetico e i fotoni del campo elettromagnetico.</p>
  <p>Il programma di questo corso chiede due cose in una riga sola: <i>«Oscillatore armonico: operatori di innalzamento e abbassamento, autovalori e autofunzioni dell&rsquo;energia. Stati coerenti»</i>. Le due metà non sono dello stesso tipo. La prima è l&rsquo;argomento che ogni manuale tratta e che quindici scritti su quarantasette chiedono: è il pezzo in cui il rischio non è non sapere, è <b>sapere la procedura e non il perché</b>. La seconda compare zero volte negli scritti, e il programma la elenca fra le <i>tre cose che i corsi standard non mettono e questo sì</i>: va trattata come teoria, e non come l&rsquo;esercizio in fondo al capitolo dove i manuali la parcheggiano.</p>
  <p>E c&rsquo;è una terza domanda, che tiene insieme le due e che nessuna delle due pone da sola. Dopo aver costruito lo spettro si scopre un fatto sorprendente: <b>in nessun autostato dell&rsquo;energia la posizione media oscilla</b>. Vale $\langle n|x(t)|n\rangle=0$ per ogni $n$, per quanto grande — quindi nessuno stato stazionario, nemmeno quello con un milione di quanti, assomiglia a una massa attaccata a una molla. Sakurai lo dice così: <i>«We have seen that an energy eigenstate does not behave like the classical oscillator — in the sense of oscillating expectation values for $x$ and $p$ — no matter how large $n$ may be»</i>. Allora che cosa, nella teoria, oscilla? <b>Gli stati coerenti sono la risposta a questa domanda</b>, e per questo stanno qui e non in appendice.</p>`},
  {t:'prosa', title:'Come è fatto il movimento', tag:'architettura', html:R`
  <p>Tre blocchi. <b>Il primo si chiude prima di avere lo spettro.</b> La tappa 01 mostra che l&rsquo;oscillatore non è un esempio ma il caso generale: diagonalizzare la matrice delle derivate seconde del potenziale riduce <i>qualunque</i> sistema vicino a un equilibrio stabile a un insieme di oscillatori disaccoppiati, e il conto si fa su due masse accoppiate fino agli autovalori. La tappa 02 stabilisce quattro fatti sullo spettro <i>senza calcolarlo</i>: gli autovalori sono positivi, i valori medi di posizione e impulso su ogni autostato sono nulli — e questo vale per ogni potenziale, non solo per questo — il fondamentale non può stare sotto $\hbar\omega/2$ per la sola relazione di indeterminazione, e vale il teorema del viriale.</p>
  <p><b>Il secondo blocco è lo spettro e le autofunzioni, per tre vie diverse.</b> La tappa 03 costruisce gli operatori di salita e discesa e dichiara le due notazioni che i libri usano, perché non sono equivalenti nelle formule che se ne ricavano. La 04 dimostra lo spettro con le due catene, e chiude i due debiti che la fonte portante italiana dichiara di rimandare — la non degenerazione e la completezza — con l&rsquo;argomento di Dirac. La 05 normalizza i vettori per induzione e scrive gli elementi di matrice. La 06 scrive le matrici per esteso e, troncandole, fa vedere perché lo spazio di Hilbert <i>deve</i> essere infinito-dimensionale. La 07 rifà il problema come lo fece Heisenberg nel 1925, con la condizione quantica che usò davvero e che non era $[q,p]=i\hbar$. La 08 passa alle autofunzioni e ai polinomi di Hermite. La 09 fa la via analitica — serie di potenze, ricorrenza, troncamento — e spiega perché dà lo stesso risultato, cosa che non è ovvia; e aggiunge la terza via, in cui si diagonalizza la <i>posizione</i> nella base dell&rsquo;energia. La 10 misura quanto il risultato quantistico sia lontano da quello classico, e trova che non ci si avvicina mai nel modo che si crede.</p>
  <p><b>Il terzo blocco sono gli stati coerenti.</b> La 11 ne dà tre definizioni e dimostra che coincidono. La 12 ne ricava le proprietà, compresa quella scomoda: non sono ortogonali, sono troppi, e la traccia di un operatore non si calcola in quella base. La 13 li fa evolvere, ed è lì che si vede da dove viene il nome. La 14 li porta dove sono nati per restare, cioè nel campo elettromagnetico quantizzato, e mostra che il valor medio del campo in uno stato coerente <i>è</i> una soluzione classica delle equazioni di Maxwell. La 15 tira il bilancio.</p>
  <p><b>Che cosa questo movimento non fa.</b> Non tratta l&rsquo;oscillatore tridimensionale isotropo né la sua degenerazione accidentale: quello è un problema di separazione delle variabili e di momento angolare. Non usa la teoria delle perturbazioni, quindi l&rsquo;oscillatore anarmonico — che è il problema su cui Heisenberg lavorava davvero nel 1925 — resta fuori. E non costruisce la quantizzazione del campo elettromagnetico: nella tappa 14 se ne prende il risultato già fatto, perché lì serve solo come banco dove gli stati coerenti hanno un significato fisico invece che un&rsquo;eleganza formale.</p>`}
]},

/* ---------------- 01 · PERCHE' L'OSCILLATORE E' IL CASO GENERALE ---------------- */
{ num:'01', title:'Perché l oscillatore non è un esempio ma il caso generale', meta:'lo sviluppo di Taylor attorno a un minimo · la matrice delle derivate seconde e i modi normali · due masse accoppiate risolte fino agli autovalori · il cristallo e il campo',
  blocchi:[
  {t:'prosa', title:'La ragione che Shankar mette in cima, e perché non è retorica', tag:'architettura', html:R`
  <p>Shankar apre il suo capitolo sull&rsquo;oscillatore con una frase che vale leggere: <i>«In this section I will put the harmonic oscillator in its place — on a pedestal»</i>. Non è entusiasmo: è un&rsquo;affermazione strutturale, e si dimostra. La tesi è che <b>qualunque sistema che fluttui di poco attorno a una configurazione di equilibrio stabile si descrive con un oscillatore, o con una collezione di oscillatori disaccoppiati</b>. Se è vero, studiare l&rsquo;oscillatore non è studiare un caso risolubile per fortuna: è studiare il comportamento di <i>tutto</i> vicino all&rsquo;equilibrio.</p>
  <p>Il primo passo è di una riga. Una particella in un potenziale $V(x)$ con un minimo in $x_{0}$: si sviluppa in serie di Taylor attorno a quel punto,</p>
  $$V(x)=V(x_{0})+V'(x_{0})\,(x-x_{0})+\tfrac12 V''(x_{0})\,(x-x_{0})^{2}+\dots$$
  <p>Il termine costante si butta, perché il riferimento del potenziale è arbitrario. Il termine lineare <b>è nullo per definizione di minimo</b>: la forza $-dV/dx$ si annulla in un punto di equilibrio statico. Spostando l&rsquo;origine in $x_{0}$ e trascurando tutto ciò che viene dopo resta</p>
  $$V(x)\simeq V_{0}+\tfrac12 k x^{2},\qquad k=V''(x_{0})=m\omega^{2},$$
  <p>e la verifica che il coefficiente sopravvissuto sia esattamente la derivata seconda è immediata:</p>
  $$\frac{d^{2}}{dx^{2}}\Big(V_{0}+\tfrac12 k x^{2}\Big)=k$$
  <p>Griffiths lo dice nel modo più asciutto: <i>«there&rsquo;s no such thing as a perfect harmonic oscillator… But practically any potential is approximately parabolic, in the neighborhood of a local minimum»</i>. <b>Il regime di validità va dichiarato, perché è l&rsquo;unica cosa che questa approssimazione rischia</b>: &ldquo;piccolo&rdquo; significa che i termini trascurati della serie sono piccoli rispetto a quello quadratico, e per la molla reale significa che si sta dentro la legge di Hooke. Fuori da lì il termine cubico conta, il sistema diventa anarmonico, e lo spettro smette di essere equispaziato — che è precisamente il problema su cui Heisenberg stava lavorando quando trovò il metodo di cui questo movimento parla.</p>`},
  {t:'reveal', title:'Da un sistema con N gradi di libertà a N oscillatori: il conto, non l’analogia', tag:'costruzione', steps:[
   {label:'Il caso generale, in forma matriciale', body:R`
   <p>Si prenda un sistema con $N$ coordinate cartesiane $x_{1},\dots,x_{N}$ e un&rsquo;energia potenziale $V(x_{1},\dots,x_{N})$, con un punto di equilibrio scelto come origine. Lo sviluppo di Taylor, con lo stesso ragionamento di prima — il termine costante via, i termini lineari nulli perché siamo in un equilibrio — dà</p>
   $$V\simeq\frac12\sum_{i,j}V_{ij}\,x_{i}x_{j},\qquad V_{ij}=\frac{\partial^{2}V}{\partial x_{i}\partial x_{j}}\bigg|_{0},$$
   <p>e per piccole oscillazioni la hamiltoniana diventa (prendendo per semplicità masse uguali, come fa Shankar)</p>
   $$H=\sum_{i}\frac{p_{i}^{2}}{2m}+\frac12\sum_{i,j}V_{ij}\,x_{i}x_{j}.$$
   <p>La matrice $\mathsf V$ delle derivate seconde è <b>reale e simmetrica</b>, dunque hermitiana, dunque diagonalizzabile con una base ortonormale di autovettori. <i>Questo è tutto l&rsquo;argomento.</i> Nella base che diagonalizza $\mathsf V$ — le <b>coordinate normali</b> — l&rsquo;energia potenziale diventa una somma di quadrati senza termini misti, e l&rsquo;energia cinetica resta già diagonale perché non è stata toccata. Quindi</p>
   $$H=\sum_{\alpha}\Big(\frac{P_{\alpha}^{2}}{2m}+\frac12 m\omega_{\alpha}^{2}X_{\alpha}^{2}\Big),$$
   <p>cioè <b>$N$ oscillatori indipendenti</b>, uno per modo normale, con $m\omega_{\alpha}^{2}$ uguale all&rsquo;$\alpha$-esimo autovalore di $\mathsf V$. E $N$ oscillatori indipendenti non sono più difficili di uno solo: la hamiltoniana è una somma, lo spazio degli stati è un prodotto, le energie si sommano. <i>Il problema generale delle piccole oscillazioni attorno all&rsquo;equilibrio di un sistema arbitrario si riduce allo studio di un singolo oscillatore armonico.</i></p>`},
   {label:'Due masse accoppiate, fino agli autovalori', body:R`
   <p>Vale farlo su un caso in cui si vedono i numeri. Shankar prende due masse uguali collegate fra loro e alle pareti da tre molle di costante $k$. La hamiltoniana non è della forma promessa, perché un termine $(x_{1}-x_{2})^{2}$ accoppia i due gradi di libertà. La matrice delle derivate seconde è</p>
   $$\mathsf V=k\begin{pmatrix}2&-1\\-1&2\end{pmatrix},$$
   <p>e i suoi autovalori si trovano annullando il determinante di $\mathsf V-\lambda\,\mathbb 1$. I due candidati sono $\lambda=k$ e $\lambda=3k$, e si verificano direttamente:</p>
   $$\det\big(\mathsf V-k\,\mathbb 1\big)=0$$
   $$\det\big(\mathsf V-3k\,\mathbb 1\big)=0$$
   <p>Il controllo globale è la traccia, che non dipende dalla base e dunque deve essere la somma degli autovalori:</p>
   $$\mathrm{Tr}\,\mathsf V=4k=k+3k$$
   <p>Gli autovettori sono le due combinazioni $x_{\rm I}=(x_{1}+x_{2})/\sqrt2$ e $x_{\rm II}=(x_{1}-x_{2})/\sqrt2$: nel primo modo le due masse si muovono insieme e la molla centrale non si deforma, quindi la frequenza è quella di una molla sola, $\omega_{\rm I}=\sqrt{k/m}$; nel secondo si muovono in opposizione e la molla centrale lavora doppio, quindi $\omega_{\rm II}=\sqrt{3k/m}=\sqrt3\,\omega_{\rm I}$. <b>Il rapporto $\sqrt3$ non è stato messo a mano: è la radice del rapporto fra due autovalori di una matrice $2\times2$.</b></p>`},
   {label:'Dove questo porta: il cristallo e il campo', body:R`
   <p>Due sistemi di importanza sproporzionata rispetto alla semplicità dell&rsquo;argomento sono esattamente di questa forma.</p>
   <p><b>Un cristallo.</b> $N_{0}$ atomi che oscillano attorno alle loro posizioni reticolari hanno $3N_{0}$ gradi di libertà, e per piccoli spostamenti la hamiltoniana è quadratica. Esistono dunque $3N_{0}$ coordinate normali, e i quanti di quei modi sono i <b>fononi</b>. Il calore specifico di un solido — il problema con cui Einstein e Debye aprono la meccanica quantistica dei solidi — è il calore specifico di $3N_{0}$ oscillatori quantistici.</p>
   <p><b>Il campo elettromagnetico nel vuoto.</b> Sviluppato in modi normali, ciascun modo è dinamicamente equivalente a un oscillatore armonico, e i suoi quanti sono i <b>fotoni</b>. Dirac lo dichiara nella prima riga del suo paragrafo sull&rsquo;oscillatore, dicendo perché gli importava: <i>«Questo esempio è importante per la teoria generale, in quanto costituisce uno dei fondamenti della teoria della radiazione»</i>. Non è un commento aggiunto in fondo: è la motivazione, scritta prima del conto. E più avanti nello stesso libro, al paragrafo 60, la porta alla sua conclusione: <i>«il sistema dinamico costituito da un insieme di bosoni identici è equivalente al sistema dinamico costituito da un insieme di oscillatori: i due sistemi non sono altro che lo stesso sistema considerato da due diversi punti di vista… Abbiamo qui uno dei risultati veramente fondamentali della meccanica quantistica»</i>.</p>
   <p><i>È per questo che vale la pena fare l&rsquo;oscillatore fino in fondo invece di trattarlo come il secondo esercizio dopo la buca.</i> La tappa 14 torna su questo punto quando ci sarà qualcosa da dirne di più preciso.</p>`}
  ]},
  {t:'plot', title:'L’approssimazione parabolica, e dove smette di valere',
   intro:R`<p>A sinistra: un potenziale realistico con un minimo — il potenziale di Morse $V(x)=(1-e^{-x})^{2}$, che descrive una molecola diatomica — e la sua parabola osculatrice nel minimo. A destra: i due modi normali delle due masse accoppiate, disegnati come traiettorie nel piano $(x_{1},x_{2})$.</p>`,
   plots:[{kind:'func2d', xr:[-1.2,3], yr:[-0.2,2.2], height:270, ticks:true,
     title:'Morse (blu) contro la sua parabola (arancio)',
     curves:[{f:'Math.pow(1-Math.exp(-x),2)', col:'#5aa9ff', width:2.4, label:'V(x) = (1-exp(-x))^2'},
             {f:'x*x', col:'#ffb86b', width:2.0, label:'parabola: V = x^2'},
             {f:'1', col:'#6f7a90', width:1.2, label:'energia di dissociazione'}],
     xlabel:'x', ylabel:'V'},
    {kind:'curve', xr:[-1.4,1.4], yr:[-1.4,1.4], height:270, ticks:true,
     title:'modo I (lungo la diagonale) e modo II (antidiagonale)',
     fx:'Math.cos(t)', fy:'Math.cos(t)', tr:[0,6.2832],
     xlabel:'x1', ylabel:'x2'}],
   leggi:R`<p><b>Che cosa guardare.</b> Nel riquadro di sinistra le due curve sono indistinguibili vicino a zero e divergono presto: a $x=1$ il Morse vale $0{,}40$ e la parabola $1{,}00$, cioè l&rsquo;errore è già del 150%. La parabola continua a salire senza limite, il Morse si appiattisce sull&rsquo;energia di dissociazione (la riga grigia): <i>l&rsquo;approssimazione armonica non sa che una molecola si può rompere</i>, e tutta la fisica della dissociazione sta nei termini che si sono buttati. Nel riquadro di destra la retta $x_{2}=x_{1}$ è il modo in cui le due masse vanno avanti e indietro insieme; il modo II sarebbe la retta ortogonale $x_{2}=-x_{1}$.</p>
   <p><b>Che cosa impararne.</b> L&rsquo;oscillatore è esatto nel limite delle piccole oscillazioni e <i>sempre</i> approssimato fuori: è questo che lo rende universale e al tempo stesso insufficiente. Ed è la ragione per cui i livelli dell&rsquo;oscillatore sono equispaziati mentre quelli vibrazionali di una molecola reale si infittiscono verso l&rsquo;alto — l&rsquo;anarmonicità è la correzione, e si tratta con la teoria delle perturbazioni. Nel riquadro di destra si vede anche perché i modi normali sono <b>ortogonali</b>: sono autovettori di una matrice simmetrica, e l&rsquo;ortogonalità non è un&rsquo;osservazione geometrica sul disegno ma un teorema di algebra lineare.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Perché l&rsquo;argomento della diagonalizzazione richiede che il punto sia un <i>minimo</i> e non un generico punto stazionario?`,
    a:R`Perché in un punto stazionario i termini lineari si annullano comunque — serve solo $\nabla V=0$ — ma per avere oscillazioni servono <b>autovalori positivi</b> di $\mathsf V$, e cioè che il punto sia un minimo. Se un autovalore è negativo, il modo corrispondente ha $\omega_{\alpha}^{2}<0$: la soluzione non è $\cos\omega t$ ma $e^{|\omega| t}$, e il sistema scappa lungo quella direzione invece di oscillare. Shankar esclude il massimo esplicitamente, <i>«a maximum, which is a point of unstable static equilibrium, will not interest us here»</i>. <b>La morale è che la matrice $\mathsf V$ porta due informazioni distinte</b>: i suoi autovettori dicono <i>quali</i> sono i moti indipendenti, i segni dei suoi autovalori dicono <i>se</i> sono oscillazioni, e il numero di autovalori negativi è l&rsquo;indice di instabilità dell&rsquo;equilibrio.`},
   {q:R`Il conto delle due masse accoppiate è classico. Che cosa cambia nel passaggio alla meccanica quantistica — si rifà la diagonalizzazione?`,
    a:R`No, e questo è il punto che fa risparmiare lavoro. Il cambio di coordinate $x_{\rm I},x_{\rm II}$ è <b>lineare e ortogonale</b>, e una trasformazione lineare ortogonale delle coordinate induce la stessa trasformazione sugli impulsi coniugati, dunque <i>conserva le regole di commutazione canoniche</i>: se $[x_{i},p_{j}]=i\hbar\delta_{ij}$ allora $[X_{\alpha},P_{\beta}]=i\hbar\delta_{\alpha\beta}$. Quindi si diagonalizza <b>una volta sola, classicamente</b>, e la hamiltoniana quantistica che ne risulta è già una somma di oscillatori indipendenti, ciascuno con le sue variabili canoniche. Lo spazio degli stati è il prodotto tensoriale, gli autovalori sono somme $\sum_{\alpha}(n_{\alpha}+\tfrac12)\hbar\omega_{\alpha}$, e la degenerazione dei livelli viene dai modi diversi di distribuire i quanti fra i modi. <i>Tutta la meccanica quantistica dei fononi e dei fotoni sta in questa osservazione</i>, e il resto del movimento tratta un modo solo perché tanto basta.`}
  ]}
]},

/* ---------------- 02 · COSA SI SA PRIMA DI RISOLVERE ---------------- */
{ num:'02', title:'Quattro cose che si sanno dello spettro prima di averlo calcolato', meta:'gli autovalori sono positivi · i valori medi di p e q sono nulli su ogni autostato, per ogni potenziale · E0 non può stare sotto hbar omega su 2 · il teorema del viriale',
  blocchi:[
  {t:'prosa', title:'Perché vale spendere una tappa su questo', tag:'architettura', html:R`
  <p>Questa tappa è il paragrafo 5.1 di Picasso, e non ha equivalente nei manuali inglesi, che vanno direttamente agli operatori di salita e discesa. Picasso dichiara perché la mette: <i>«In questo paragrafo ci limiteremo solo ad ottenere delle condizioni qualitative sui livelli energetici dell&rsquo;oscillatore, principalmente con l&rsquo;intento di familiarizzare il lettore con alcune tecniche e concetti della meccanica quantistica»</i>. La ragione vera è più forte di come la dichiara: <b>quattro conclusioni non banali seguono dai soli postulati, senza risolvere niente</b>, e averle in mano prima del conto trasforma il conto in una verifica. Quando nella tappa 04 uscirà $E_{0}=\hbar\omega/2$, non sarà una sorpresa: sarà il caso di uguaglianza di una disuguaglianza già dimostrata qui.</p>
  <p>Il punto di partenza è la hamiltoniana e la regola di commutazione, nient&rsquo;altro:</p>
  $$H=\frac{1}{2m}\big(p^{2}+m^{2}\omega^{2}q^{2}\big),\qquad [q,p]=i\hbar,$$
  <p>con $q$ e $p$ autoaggiunti. Non si assume che $H$ abbia un&rsquo;autofunzione di una forma particolare, non si sceglie una rappresentazione, non si scrive nessuna equazione differenziale.</p>`},
  {t:'reveal', title:'I quattro fatti, dimostrati uno per uno', tag:'costruzione', steps:[
   {label:'1. Gli autovalori sono tutti positivi', body:R`
   <p>Si mostra la cosa più forte, che $\langle A|H|A\rangle>0$ per ogni stato normalizzato $|A\rangle$: gli autovalori sono essi stessi valori medi di $H$ su stati particolari, cioè sui suoi autovettori, dunque la conclusione li include. Ora</p>
   $$\langle A|p^{2}|A\rangle=\big\|\,p|A\rangle\,\big\|^{2}\geq0,$$
   <p>perché $p$ è autoaggiunto e quindi $\langle A|p^{2}|A\rangle=\langle A|p^{\dagger}p|A\rangle$ è il quadrato della norma del vettore $p|A\rangle$ — è il mestiere dell&rsquo;<span class="str" data-str="operatore-aggiunto">operatore aggiunto</span>, e si usa in questa forma in tutto il movimento. Lo stesso per $\langle A|q^{2}|A\rangle\geq0$. Dunque $\langle H\rangle\geq0$ e gli autovalori sono non negativi.</p>
   <p><b>Ma il segno di uguaglianza non si può realizzare</b>, e qui l&rsquo;argomento diventa interessante: perché $\langle H\rangle$ sia zero servirebbero <i>entrambi</i> $p|A\rangle=0$ e $q|A\rangle=0$, cioè un autostato simultaneo di $p$ e $q$. Un tale stato contraddirebbe la relazione di indeterminazione, e quindi la regola di commutazione da cui quella discende. Dunque $H>0$ strettamente, e <b>tutti gli $E_{n}$ sono positivi</b>. Si noti che cosa ha fatto il lavoro: non una proprietà dell&rsquo;oscillatore, ma l&rsquo;<span class="str" data-str="commutatore">incompatibilità</span> fra posizione e impulso. Classicamente l&rsquo;energia minima di un oscillatore è zero e corrisponde alla massa ferma nell&rsquo;origine, $q=0$ e $p=0$ insieme: <i>è esattamente lo stato che la meccanica quantistica vieta.</i></p>`},
   {label:'2. I valori medi di p e q sono nulli, e vale per ogni potenziale', body:R`
   <p>Questa è la conclusione che Picasso segnala essere più generale di quanto serva: <i>«La (5.4) è più generale in quanto vale per ogni sistema la cui hamiltoniana sia della forma $H=p^{2}/2m+V(q)$ con potenziale $V(q)$ arbitrario. Non è neppure necessario che il sistema sia unidimensionale»</i>. Vale la pena vedere la dimostrazione perché è un <b>metodo</b>, e si riusa ogni volta che si deve mostrare che un valor medio su uno stato stazionario si annulla.</p>
   <p>Si parte dal commutatore di $H$ con la coordinata. Il potenziale commuta con $q$, quindi resta solo il termine cinetico, e si usa $[AB,C]=A[B,C]+[A,C]B$:</p>
   $$[H,q]=\frac{1}{2m}\big[p^{2},q\big]=\frac{1}{2m}\big(p[p,q]+[p,q]p\big)=-\frac{i\hbar}{m}\,p.$$
   <p>Ora si prende il valor medio di questo commutatore su un autostato $|E_{n}\rangle$. Poiché $H$ è autoaggiunto, $H|E_{n}\rangle=E_{n}|E_{n}\rangle$ implica anche $\langle E_{n}|H=E_{n}\langle E_{n}|$, dunque</p>
   $$\langle E_{n}|(Hq-qH)|E_{n}\rangle=E_{n}\langle E_{n}|q|E_{n}\rangle-\langle E_{n}|q|E_{n}\rangle E_{n}=0.$$
   <p>I due termini si elidono <i>identicamente</i>, qualunque sia $E_{n}$. Ma il membro di sinistra vale $-\frac{i\hbar}{m}\langle p\rangle$, dunque $\langle E_{n}|p|E_{n}\rangle=0$. Lo stesso argomento con $[H,p]=i\hbar m\omega^{2}q$ dà $\langle E_{n}|q|E_{n}\rangle=0$ — e qui, a differenza del precedente, si usa la forma quadratica del potenziale.</p>
   <p><b>Il meccanismo, isolato:</b> il valor medio del commutatore di $H$ con qualunque operatore, preso su un autostato di $H$, è nullo. Dunque <i>ogni operatore che si scriva come commutatore con $H$ ha valor medio nullo sugli stati stazionari</i>. È lo stesso fatto per cui, nella descrizione temporale, le medie sugli stati stazionari non evolvono — e sarà la radice del risultato sconcertante della tappa 10.</p>`},
   {label:'3. Il fondamentale non può stare sotto hbar omega mezzi', body:R`
   <p>Si valuti $E_{0}=\langle E_{0}|H|E_{0}\rangle$. Grazie al punto 2, $\langle p\rangle=\langle q\rangle=0$ su questo stato, quindi i valori medi dei quadrati <i>sono</i> le varianze: $\langle p^{2}\rangle=(\Delta p)^{2}$ e $\langle q^{2}\rangle=(\Delta q)^{2}$. Dunque</p>
   $$E_{0}=\frac{1}{2m}\Big((\Delta p)^{2}+m^{2}\omega^{2}(\Delta q)^{2}\Big).$$
   <p>Ora serve una disuguaglianza elementare, $a^{2}+b^{2}\geq2ab$, e vale scriverla nella forma che la rende evidente, con $a=\Delta p$ e $b=m\omega\Delta q$:</p>
   $$\big(\Delta p-m\omega\Delta q\big)^{2}=(\Delta p)^{2}+m^{2}\omega^{2}(\Delta q)^{2}-2m\omega\,\Delta p\,\Delta q$$
   <p>e il membro di sinistra è un quadrato, dunque</p>
   $$\big(\Delta p-m\omega\Delta q\big)^{2}\geq0$$
   <p>cioè $(\Delta p)^{2}+m^{2}\omega^{2}(\Delta q)^{2}\geq2m\omega\,\Delta p\,\Delta q$. Inserendo, e usando poi $\Delta p\,\Delta q\geq\hbar/2$:</p>
   $$E_{0}\geq\frac{1}{2m}\,2m\omega\,\Delta q\,\Delta p\geq\frac{1}{2m}\,2m\omega\cdot\frac{\hbar}{2}=\frac{\hbar\omega}{2}$$
   <p><b>Questo è il risultato che la tappa 04 ritroverà come uguaglianza esatta</b>, e la differenza fra i due modi di ottenerlo è contenuto, non ripetizione: qui si è provato che $E_{0}$ non può stare <i>sotto</i> $\hbar\omega/2$ usando due disuguaglianze; là si proverà che <i>è</i> $\hbar\omega/2$. Messi insieme, i due risultati dicono una cosa in più di ciascuno dei due: <i>in entrambe le disuguaglianze usate qui vale il segno di uguaglianza</i>. Dunque sullo stato fondamentale</p>
   $$\Delta p\,\Delta q=\frac{\hbar}{2},\qquad \Delta p=m\omega\,\Delta q.$$
   <p>Lo stato fondamentale dell&rsquo;oscillatore è uno <b>stato di minima indeterminazione</b>, e il secondo vincolo dice come l&rsquo;indeterminazione si ripartisce fra le due variabili. <i>Questo fatto è il seme degli stati coerenti, ed è il motivo per cui le tappe 11-14 esistono</i>: quando Schrödinger, nel 1926, cercò i pacchetti d&rsquo;onda che si comportano classicamente, cercò esattamente gli stati che saturano questa disuguaglianza.</p>`},
   {label:'4. Il teorema del viriale, e in che senso è lo stesso di quello classico', body:R`
   <p>Dall&rsquo;uguaglianza $\Delta p=m\omega\Delta q$ appena stabilita, e ricordando che le varianze coincidono con i valori medi dei quadrati, segue $\langle p^{2}\rangle=m^{2}\omega^{2}\langle q^{2}\rangle$, cioè</p>
   $$\frac{\langle p^{2}\rangle}{2m}=\frac{m\omega^{2}}{2}\langle q^{2}\rangle$$
   <p><b>il valor medio dell&rsquo;energia cinetica è uguale a quello dell&rsquo;energia potenziale</b>, e ciascuno vale metà dell&rsquo;energia totale. Coi numeri che la tappa 08 calcolerà, $\langle q^{2}\rangle_{0}=\hbar/2m\omega$ e $\langle p^{2}\rangle_{0}=m\hbar\omega/2$:</p>
   $$\frac{\langle p^{2}\rangle}{2m}=\frac{\hbar\omega}{4}=\frac{E_{0}}{2}$$
   <p>È lo stesso enunciato del teorema del viriale classico per un potenziale quadratico, e Picasso insiste su ciò che è cambiato: <i>«lo stesso risultato che si ha per l&rsquo;oscillatore classico (teorema del viriale), con un diverso significato del termine &lsquo;valor medio&rsquo;»</i>. Per l&rsquo;oscillatore classico la media è <b>temporale</b>, su un periodo: la particella passa il tempo scambiando cinetica e potenziale, e in media le due si pareggiano. Per l&rsquo;oscillatore quantistico in un autostato <b>non c&rsquo;è nessuna media temporale da fare</b>, perché nulla evolve: la media è su un insieme di misure ripetute su stati preparati identici. <i>La formula è identica e la cosa misurata è diversa</i>, ed è una delle corrispondenze in cui conviene non lasciarsi confondere dalla somiglianza.</p>`}
  ]},
  {t:'plot', title:'Lo spazio delle fasi: l’orbita classica e la cella quantistica',
   intro:R`<p>Un oscillatore classico di energia $E$ percorre nel piano $(q,p)$ l&rsquo;ellisse $p^{2}/2m+m\omega^{2}q^{2}/2=E$, e la percorre tutta: in un periodo passa per ogni suo punto. Lo stato fondamentale quantistico non è un&rsquo;orbita ma una <b>macchia</b>, e il conto di questa tappa dice esattamente quanto è grande e di che forma. In unità in cui $m=\omega=\hbar=1$, l&rsquo;ellisse di energia $E_{0}=1/2$ è la circonferenza di raggio uno, e la macchia è il disco di raggio $1/\sqrt2$ attorno all&rsquo;origine.</p>`,
   plots:[{kind:'curve', xr:[-1.8,1.8], yr:[-1.8,1.8], height:300, ticks:true,
     title:'orbita classica a E = 1/2 (m = omega = hbar = 1)',
     fx:'Math.cos(t)', fy:'-Math.sin(t)', tr:[0,6.2832],
     xlabel:'q', ylabel:'p'},
    {kind:'contour', f:'Math.exp(-(x*x+y*y))', xr:[-1.8,1.8], yr:[-1.8,1.8], height:300,
     levels:[0.05,0.15,0.3,0.5,0.7,0.9], title:'la densita dello stato fondamentale nello spazio delle fasi',
     xlabel:'q', ylabel:'p'}],
   leggi:R`<p><b>Che cosa guardare.</b> A sinistra l&rsquo;orbita classica: una curva, cioè un insieme di misura nulla nel piano, su cui il punto rappresentativo <i>sta</i>. A destra le curve di livello della distribuzione quantistica: non una curva ma una regione, centrata nell&rsquo;origine — che è il punto proibito classicamente — e di raggio quadratico medio $\Delta q=\Delta p=1/\sqrt2$ in queste unità, cioè area $\pi\Delta q\,\Delta p\simeq1{,}57$, confrontabile con l&rsquo;area $\pi$ racchiusa dall&rsquo;orbita classica.</p>
   <p><b>Che cosa impararne.</b> Le due figure dicono che <i>la differenza fra classico e quantistico qui non è un&rsquo;incertezza su una traiettoria: è l&rsquo;assenza della traiettoria</i>. Il vincolo $\Delta p=m\omega\Delta q$ dimostrato in questa tappa è ciò che rende la macchia <b>rotonda</b> nelle unità naturali del problema: in un oscillatore l&rsquo;indeterminazione minima si ripartisce in parti uguali fra posizione e impulso, misurate ciascuna con la propria scala. Questo disegno tornerà due volte: nella tappa 11, dove lo stato coerente sarà questa stessa macchia <b>spostata</b> dall&rsquo;origine, e nella 13, dove si vedrà che spostata si mette a girare sull&rsquo;orbita classica <i>senza deformarsi</i>.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Il punto 2 dimostra $\langle p\rangle=0$ su ogni autostato con un argomento che vale per <i>qualunque</i> potenziale. Non è un risultato troppo forte — significa che nessuna particella in nessuno stato stazionario ha impulso medio diverso da zero?`,
    a:R`Significa esattamente quello, ed è giusto. Un autostato dell&rsquo;energia è uno stato <b>stazionario</b>: la distribuzione di probabilità in posizione non cambia nel tempo, dunque non c&rsquo;è trasporto netto, dunque l&rsquo;impulso medio è nullo. Un&rsquo;onda piana $e^{ikx}$ sembra un controesempio, e non lo è: per una particella <i>libera</i> è un autostato, e $\langle p\rangle=\hbar k\neq0$ — ma lì lo stato non è normalizzabile e il passaggio $\langle E|(Hq-qH)|E\rangle=0$ non è legittimo, perché richiede $\langle E|E\rangle$ finito. <b>L&rsquo;ipotesi nascosta nel punto 2 è la normalizzabilità</b>, cioè che lo spettro sia discreto in quel punto, e per l&rsquo;oscillatore lo è perché il potenziale cresce indefinitamente da entrambi i lati. <i>È la stessa ipotesi che fa funzionare tutti i teoremi sugli stati legati</i>, e trovarla qui dentro un argomento che sembrava puramente algebrico è il tipo di controllo che conviene fare sempre.`},
   {q:R`Si è usato $\Delta p\,\Delta q\geq\hbar/2$ per dimostrare $E_{0}\geq\hbar\omega/2$. Si potrebbe fare il contrario: dedurre la relazione di indeterminazione dal valore dell&rsquo;energia di punto zero?`,
    a:R`Logicamente no, e la direzione delle frecce conta. La relazione di indeterminazione è una conseguenza di $[q,p]=i\hbar$ e vale per <i>qualunque</i> stato di <i>qualunque</i> sistema; $E_{0}=\hbar\omega/2$ è un fatto su un sistema specifico. Da un caso particolare non si deduce un teorema generale. <b>Ma c&rsquo;è una cosa vera nelle vicinanze, e vale dirla:</b> poiché lo stato fondamentale dell&rsquo;oscillatore <i>satura</i> la disuguaglianza, l&rsquo;esistenza di quello stato dimostra che la costante $\hbar/2$ nella relazione di indeterminazione è <b>ottimale</b> — non si può migliorare a $\hbar$, perché ci sarebbe un controesempio. Landau usa questa stessa catena nel verso opposto, come problema 2 del suo paragrafo 23: <i>«trovare il limite inferiore dei valori possibili dell&rsquo;energia di un oscillatore mediante la relazione di indeterminazione»</i>, e minimizza $\langle E\rangle$ come funzione di $\Delta x$ ottenendo $E\geq\hbar\omega/2$. <i>È lo stesso conto di Picasso scritto come problema invece che come teorema.</i>`}
  ]}
]},

/* ---------------- 03 · GLI OPERATORI, E DUE NOTAZIONI CHE NON SI MESCOLANO ---------------- */
{ num:'03', title:'Fattorizzare la hamiltoniana: gli operatori di salita e discesa', meta:'la variabile complessa di Dirac · la fattorizzazione e il termine che resta · il commutatore fondamentale · due convenzioni e il dizionario fra loro · l operatore numero',
  blocchi:[
  {t:'prosa', title:'L’idea, e di chi è', tag:'costruzione', html:R`
  <p>La hamiltoniana è una somma di due quadrati. Se $p$ e $q$ fossero numeri si potrebbe scrivere $p^{2}+m^{2}\omega^{2}q^{2}=(p+im\omega q)(p-im\omega q)$ e il problema sarebbe fattorizzato. Sono operatori che non commutano, quindi quella identità è falsa — ma è falsa <b>per un termine noto</b>, e tutto il metodo sta nel calcolare quel termine invece di rinunciare.</p>
  <p>L&rsquo;idea è di Dirac, e la notazione originale conviene conoscerla perché la fonte italiana di questo corso la usa. Dirac introduce, nel paragrafo 34 dei <i>Principi</i>, una «variabile dinamica adimensionale complessa» che chiama $\eta$:</p>
  $$\eta=\frac{p-im\omega q}{\sqrt{2m\hbar\omega}},\qquad \eta^{\dagger}=\frac{p+im\omega q}{\sqrt{2m\hbar\omega}}.$$
  <p>Picasso la riprende identica — sono le sue equazioni (5.8) — e così fa Weinberg nelle <i>Lectures</i>, al paragrafo 2.5. <b>Due cose vanno notate subito</b>, perché sono quelle che distinguono questa scrittura da quella dei manuali inglesi. La prima: c&rsquo;è <i>l&rsquo;impulso davanti</i> e la coordinata moltiplicata per $i$, non il contrario. La seconda: $\eta$ non è autoaggiunto, e dunque <b>non è un&rsquo;osservabile</b>; è una variabile dinamica complessa esattamente come $z=x+ip$ lo è in meccanica classica, dove la trasformazione a variabili complesse è un cambio di coordinate canoniche e le <span class="str" data-str="parentesi-di-poisson">parentesi di Poisson</span> di $z$ e $\bar z$ danno una costante. <i>Dirac stava quantizzando una trasformazione canonica classica</i>, e la sua scelta di notazione lo dice.</p>`},
  {t:'reveal', title:'La fattorizzazione, fatta per esteso', tag:'costruzione', steps:[
   {label:'Il prodotto, con il termine che il commutatore lascia', body:R`
   <p>Si calcoli $\eta^{\dagger}\eta$ moltiplicando per esteso e tenendo conto dell&rsquo;ordine:</p>
   $$(p+im\omega q)(p-im\omega q)=p^{2}-im\omega\,pq+im\omega\,qp+m^{2}\omega^{2}q^{2}=p^{2}+m^{2}\omega^{2}q^{2}-im\omega\,[p,q].$$
   <p>Il <span class="str" data-str="commutatore">commutatore</span> vale $[p,q]=-i\hbar$, dunque il termine extra è $-im\omega(-i\hbar)=-m\omega\hbar$:</p>
   $$(p+im\omega q)(p-im\omega q)=p^{2}+m^{2}\omega^{2}q^{2}-m\omega\hbar=2mH-m\omega\hbar.$$
   <p>Dividendo per la normalizzazione $2m\hbar\omega$:</p>
   $$\frac{2mH-m\omega\hbar}{2m\hbar\omega}=\frac{H}{\hbar\omega}-\frac12$$
   <p>cioè la relazione che Dirac numera [34.5] e Picasso (5.10):</p>
   $$\eta^{\dagger}\eta=\frac{H}{\hbar\omega}-\frac12,\qquad\text{ovvero}\qquad H=\hbar\omega\Big(\eta^{\dagger}\eta+\frac12\Big).$$
