   <p>Ballentine aggiunge un paragrafo che nessun altro testo del corso ha, e vale per quello che insegna sul significato di «rappresentazione». L&rsquo;osservazione di partenza è una simmetria: nella via analitica si conoscono le proprietà di $Q$ — i suoi autovettori sono le delta — e si calcolano gli autovalori di $H$ nella base in cui $Q$ è diagonale. Ma lo spettro di $H$ è già noto dalla via algebrica. <i>«So instead of calculating the eigenvalues of $H$ in the representation that diagonalizes $Q$… we could just as well calculate the eigenvalues of $Q$ in the representation that diagonalizes $H$. This unusual route will be followed here.»</i></p>
   <p>Si parte dalla matrice di $Q$ nella base dell&rsquo;energia — quella della tappa 06 — e si scrive l&rsquo;equazione agli autovalori $Q|x\rangle=x|x\rangle$ per componenti. Ne risulta la (6.36), una <b>ricorrenza a tre termini</b> negli indici $n$:</p>
   $$\sqrt{\frac{\hbar}{2M\omega}}\Big(\sqrt{n'}\,\langle n'-1|x\rangle+\sqrt{n'+1}\,\langle n'+1|x\rangle\Big)=x\,\langle n'|x\rangle.$$
   <p>Si assegna arbitrariamente $\langle0|x\rangle$, e la ricorrenza produce $\langle1|x\rangle$, poi $\langle2|x\rangle$, e così via. <b>Il risultato è il punto:</b> la ricorrenza si risolve <i>per ogni valore reale di $x$</i>, senza che nessuna condizione selezioni valori particolari. <i>«This recursive solution of (6.36) works for all $x$, so the eigenvalue spectrum of the operator $Q$ is continuous from $-\infty$ to $+\infty$.»</i> Lo spettro continuo della posizione, dedotto dalla matrice dell&rsquo;oscillatore.</p>
   <p>Che le due vie diano la stessa cosa non è ovvio e Ballentine lo verifica: sostituendo nella ricorrenza $\langle n|x\rangle=c(x)(2^{n}n!)^{-1/2}H_{n}(\alpha x)$, cioè la (6.32), si ottiene</p>
   $$n\,H_{n-1}(\alpha x)+\tfrac12H_{n+1}(\alpha x)=\alpha x\,H_{n}(\alpha x),$$
   <p>che è una delle identità standard dei polinomi di Hermite — e si verifica su due casi:</p>
   $$2H_{1}(\xi)+\tfrac12 H_{3}(\xi)=\xi H_{2}(\xi)$$
   $$3H_{2}(\xi)+\tfrac12 H_{4}(\xi)=\xi H_{3}(\xi)$$
   <p><b>Il guadagno concettuale, non il conto:</b> la stessa funzione $\langle n|x\rangle$ si può leggere in due modi — come funzione di $x$ a $n$ fisso, ed è l&rsquo;autofunzione dell&rsquo;energia; come funzione di $n$ a $x$ fisso, ed è l&rsquo;autovettore della posizione nella base del numero. <i>Non ci sono «la funzione d&rsquo;onda» e «la matrice»: c&rsquo;è un solo oggetto, letto lungo due indici diversi.</i></p>`}
  ]},
  {t:'plot', title:'Che cosa accade se la serie non si tronca',
   intro:R`<p>In unità adimensionali, $u(q)=H(q)e^{-q^{2}/2}$ per tre valori di $\lambda$: due che troncano la serie e uno intermedio che non la tronca. Per $\lambda$ non quantizzato la serie non è un polinomio e la soluzione cresce come $e^{+q^{2}/2}$; qui la si approssima troncando la serie di proposito a un ordine alto, che è il modo in cui il fenomeno si vede numericamente.</p>`,
   plots:[{kind:'func2d', xr:[-5,5], yr:[-1.5,3.5], height:320, ticks:true,
     title:'u(q) per lambda = 1 e 5 (quantizzati) e per lambda = 3,4 (non quantizzato)',
     curves:[{f:'Math.exp(-x*x/2)', col:'#5aa9ff', width:2.4, label:'lambda = 1 (n = 0): polinomio di grado 0'},
             {f:'(4*x*x-2)/2*Math.exp(-x*x/2)', col:'#9b8cff', width:2.2, label:'lambda = 5 (n = 2): polinomio di grado 2'},
             {f:'(1 + (1-3.4)/2*x*x + (5-3.4)*(1-3.4)/24*Math.pow(x,4) + (9-3.4)*(5-3.4)*(1-3.4)/720*Math.pow(x,6) + (13-3.4)*(9-3.4)*(5-3.4)*(1-3.4)/40320*Math.pow(x,8) + (17-3.4)*(13-3.4)*(9-3.4)*(5-3.4)*(1-3.4)/3628800*Math.pow(x,10))*Math.exp(-x*x/2)', col:'#ff6b8a', width:2.4, label:'lambda = 3,4: la serie non si chiude e la coda esplode'}],
     xlabel:'q', ylabel:'u'}],
   leggi:R`<p><b>Che cosa guardare.</b> Le due curve quantizzate ($\lambda=1$ e $\lambda=5$) decadono a zero da entrambe le parti: sono stati. La curva rossa, con $\lambda=3{,}4$ — un valore intermedio fra $\lambda=3$ e $\lambda=5$ — è costruita con la stessa ricorrenza, e per $|q|$ piccolo si comporta ragionevolmente; poi la coda <i>si rovescia e sale</i>. Non è un artefatto del troncamento numerico: è l&rsquo;inizio della crescita come $e^{+q^{2}/2}$, e aggiungendo termini il punto in cui si rovescia si sposta più in là senza mai scomparire.</p>
   <p><b>Che cosa impararne.</b> La quantizzazione dell&rsquo;energia, nella via analitica, <i>non è una condizione imposta sull&rsquo;energia</i>: è una condizione imposta sul comportamento all&rsquo;infinito, e l&rsquo;energia è ciò che si deve aggiustare per soddisfarla. Questa è la stessa struttura del problema di tiro che governa qualunque stato legato in una dimensione, e qui si vede nel caso in cui si può scrivere esattamente: <i>i valori permessi sono quelli per cui la coda non esplode</i>, e sono isolati perché la condizione è di codimensione uno. E si noti il contrasto con la terza via di Ballentine, dove la stessa ricorrenza — guardata lungo l&rsquo;altro indice — non impone nulla, e lo spettro risulta continuo: <b>è la condizione al contorno, non la ricorrenza, a decidere se uno spettro è discreto.</b></p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Nella via analitica la condizione di troncamento è $\lambda=2n+1$ con $n$ intero <i>non negativo</i>. Dove entra «non negativo», e che accadrebbe senza?`,
    a:R`Entra nel fatto che la serie $\sum a_{n}q^{n}$ parte da $n=0$: il troncamento significa che esiste un primo coefficiente nullo, e il grado del polinomio che resta è il numero intero non negativo $n$. Un $\lambda=2n+1$ con $n$ negativo — per esempio $\lambda=-1$, cioè $E=-\hbar\omega/2$ — non tronca nessuna serie che parta da zero: il numeratore $2k+1-\lambda$ con $k\geq0$ e $\lambda<1$ è sempre positivo, dunque <b>nessun coefficiente si annulla mai</b> e la soluzione esplode. <i>Il limite inferiore dello spettro, nella via analitica, viene dalla stessa cosa che lo dà nella via algebrica</i> — là la positività di una norma, qui la positività dell&rsquo;indice da cui parte una serie di potenze. E l&rsquo;accordo non è fortuito: una serie di potenze parte da $q^{0}$ perché la soluzione deve essere regolare nell&rsquo;origine, e la regolarità è di nuovo una condizione sul dominio dell&rsquo;operatore.`},
   {q:R`La terza via di Ballentine ottiene lo spettro della posizione dalla matrice dell&rsquo;oscillatore. Non è circolare — la matrice non era stata costruita <i>assumendo</i> qualcosa sulla posizione?`,
    a:R`No, e verificarlo è istruttivo. La matrice di $Q$ nella base dell&rsquo;energia, cioè la (6.34)-(6.35), si ricava da $Q=\sqrt{\hbar/2M\omega}\,(a+a^{\dagger})$ e dai coefficienti $\sqrt n$ della tappa 05 — e quei coefficienti vengono <b>soltanto</b> dall&rsquo;algebra: $[a,a^{\dagger}]=1$, la positività della norma, e la convenzione di fase. <i>In nessun punto si è usato che $Q$ abbia spettro continuo, né che i suoi autovettori siano delta, né che si rappresenti come moltiplicazione per $x$.</i> Quindi la deduzione non è circolare: parte dall&rsquo;algebra e arriva allo spettro di $Q$. <b>Ed è un risultato che sorprende se si pensa alle dimensioni</b>: una matrice infinita con elementi su due diagonali, costruita da numeri interi, ha spettro tutto l&rsquo;asse reale. Si confronti con il troncamento della tappa 06: la matrice $5\times5$ ha solo cinque autovalori, cioè uno spettro discreto e limitato. <i>Il passaggio da finito a infinito non cambia solo il numero di autovalori: cambia la natura dello spettro</i>, ed è lo stesso fenomeno per cui la relazione canonica richiede dimensione infinita.`}
  ]}
]},

/* ---------------- 10 · IL LIMITE CLASSICO CHE NON ARRIVA ---------------- */
{ num:'10', title:'Il limite classico non arriva aumentando n: la misura del disaccordo', meta:'probabilità in regione proibita nello stato fondamentale, con il numero · la densità classica e la sua divergenza integrabile · il confronto a n grande · e il fatto che decide tutto: nessun autostato oscilla',
  blocchi:[
  {t:'prosa', title:'Tre modi di misurare quanto il quantistico sia lontano dal classico', tag:'architettura', html:R`
  <p>A questo punto il problema è risolto in tre modi e le autofunzioni sono scritte. Resta la domanda che la tappa 00 ha posto e che il resto del movimento deve chiudere: <b>in che senso, e in che limite, un oscillatore quantistico assomiglia a una massa su una molla?</b> La risposta è meno scontata del previsto, e conviene misurarla con tre numeri invece di discuterla.</p>
  <p>Il primo numero riguarda la regione classicamente proibita. Il secondo riguarda la forma della distribuzione di posizione a $n$ grande. Il terzo riguarda il moto — e <i>fallisce</i>, nel senso che il disaccordo non si riduce mai, per nessun $n$. È quest&rsquo;ultimo che rende necessarie le tappe seguenti.</p>`},
  {t:'reveal', title:'I tre numeri', tag:'costruzione', steps:[
   {label:'Primo: quanta probabilità sta dove classicamente non si può stare', body:R`
   <p>Griffiths lo chiede come Problema 2.17, con l&rsquo;indicazione di arrivare a tre cifre significative: <i>«In the ground state of the harmonic oscillator, what is the probability (correct to three significant digits) of finding the particle outside the classically allowed region?»</i> La regione permessa si trova uguagliando energia totale e potenziale, come nella tappa 08: per $E_{0}=\hbar\omega/2$ l&rsquo;ampiezza classica è $x_{0}=\sqrt{\hbar/m\omega}$. La probabilità cercata è l&rsquo;integrale delle due code:</p>
   $$2\int_{x_{0}}^{\infty}|\psi_{0}|^{2}dx=1-\mathrm{erf}(1)$$
   <p>e in cifre vale</p>
   $$0{,}157$$
   <p><b>Quasi un sesto.</b> Non è una coda trascurabile da relegare in una nota: una particella nello stato fondamentale di un oscillatore sta, una volta su sei, dove un oscillatore classico della stessa energia non potrebbe stare. Picasso dedica a questo fatto una pagina del paragrafo 8.1, e la usa per sciogliere un paradosso apparente — <i>«Sembra quindi che ci si trovi di fronte ad una non conservazione dell&rsquo;energia»</i>, perché in quella regione l&rsquo;energia potenziale è già maggiore di $E$ e l&rsquo;energia cinetica non è mai negativa. La sua risposta non è che il paradosso sia mal posto: è che <b>la misura che trova la particella là le ha ceduto energia</b>. <i>«La misura di posizione… perturba lo stato del sistema: ci fa passare da un autostato dell&rsquo;energia ad un autostato di $q_{\Delta}$. Questa perturbazione è dovuta all&rsquo;interazione fra il sistema e lo strumento… Non si ha quindi nessuna violazione del principio di conservazione dell&rsquo;energia: la particella non è un sistema isolato.»</i> E chiude con un&rsquo;osservazione che è una posizione filosofica dichiarata: alla domanda se la particella «ci fosse già» prima della misura, <i>«assumere l&rsquo;uno o l&rsquo;altro di questi due punti di vista è una questione di gusti: dal punto di vista del fisico si tratta di domande irrilevanti»</i>.</p>`},
   {label:'Secondo: la densità classica, e in che senso quella quantistica le somiglia', body:R`
   <p>La distribuzione classica di posizione di un oscillatore di ampiezza $A$ è la frazione di tempo che la particella passa in ciascun intervallo, dunque è inversamente proporzionale alla velocità: $P_{\rm cl}(x)\propto1/|v(x)|$ con $v=\omega\sqrt{A^{2}-x^{2}}$. Normalizzata,</p>
   $$P_{\rm cl}(x)=\frac{1}{\pi\sqrt{A^{2}-x^{2}}},\qquad \int_{-A}^{A}\frac{dx}{\pi\sqrt{A^{2}-x^{2}}}=1$$
   <p>e si noti che la divergenza ai punti d&rsquo;inversione è <b>integrabile</b>: la particella rallenta fino a fermarsi, la densità diverge, e tuttavia la probabilità resta finita. Un numero che dà l&rsquo;idea della forma: il tempo passato oltre metà ampiezza è</p>
   $$2\int_{A/2}^{A}\frac{dx}{\pi\sqrt{A^{2}-x^{2}}}=\frac23$$
   <p>cioè <i>due terzi del periodo la particella sta nel quarto esterno della sua corsa</i>, ed è il contrario della distribuzione quantistica dello stato fondamentale, che è massima al centro.</p>
   <p>Griffiths confronta le due a $n=100$, e la sua descrizione è esatta nei limiti che pone: <i>«Only at large $n$ do we begin to see some resemblance to the classical case. In Figure 2.7(b) I have superimposed the classical position distribution on the quantum one (for $n=100$); if you smoothed out the bumps, the two would fit pretty well»</i>. <b>Ma aggiunge subito la cautela che conta</b>, e vale ripeterla perché è il tipo di distinzione che si perde: <i>«however, in the classical case we are talking about the distribution of positions over time for one oscillator, whereas in the quantum case we are talking about the distribution over an ensemble of identically prepared systems»</i>. In nota rende il confronto legittimo: <i>«the parallel is perhaps more direct if you interpret the classical distribution as an ensemble of oscillators all with the same energy, but with random starting times»</i>.</p>
   <p><i>Quindi il primo accordo che si trova non è fra una particella quantistica e una classica: è fra due insiemi statistici</i>, e serve rinunciare all&rsquo;informazione sulla fase iniziale per ottenerlo.</p>`},
   {label:'Terzo: nessuno stato stazionario oscilla, per nessun n', body:R`
   <p>Il terzo confronto è quello che non si aggiusta, e per vederlo serve il moto. Nello schema di Heisenberg le equazioni per $a$ e $a^{\dagger}$ sono disaccoppiate e si integrano immediatamente — Sakurai le scrive come (2.3.42) e (2.3.43):</p>
   $$\frac{da}{dt}=-i\omega a\quad\Longrightarrow\quad a(t)=a(0)\,e^{-i\omega t},\qquad a^{\dagger}(t)=a^{\dagger}(0)\,e^{+i\omega t},$$
   <p>e separando le parti hermitiana e antihermitiana si ottengono le (2.3.45):</p>
   $$x(t)=x(0)\cos\omega t+\frac{p(0)}{m\omega}\sin\omega t,\qquad p(t)=-m\omega\,x(0)\sin\omega t+p(0)\cos\omega t.$$
   <p>Sakurai commenta: <i>«These look the same as the classical equations of motion. We see that the $x$ and $p$ operators &lsquo;oscillate&rsquo; just like their classical analogues»</i> — e poi smonta la conclusione affrettata. <b>Gli operatori oscillano; i valori medi su un autostato no.</b> <i>«Take any energy eigenstate characterized by a definite value of $n$; the expectation value $\langle n|x(t)|n\rangle$ vanishes because the operators $x(0)$ and $p(0)$ change $n$ by $\pm1$, and $|n\rangle$ and $|n\pm1\rangle$ are orthogonal.»</i></p>
   <p>Il meccanismo è quello della tappa 05: $x$ ha elementi di matrice solo fra livelli adiacenti, dunque $\langle n|x|n\rangle=0$ identicamente, dunque anche $\langle n|x(t)|n\rangle=0$ per ogni $t$. <i>È lo stesso fatto che la tappa 02 aveva dimostrato in generale per ogni potenziale</i>, qui letto come enunciato dinamico. E la conclusione, nelle parole di Sakurai, è quella che apre il resto del movimento: <i>«an energy eigenstate does not behave like the classical oscillator… no matter how large $n$ may be»</i>.</p>
   <p><b>Dunque la domanda si riformula così:</b> se gli stati stazionari non oscillano, che stato oscilla? Sakurai indica la direzione minima — <i>«to observe oscillations reminiscent of the classical oscillator, we must look at a superposition of energy eigenstates»</i> — e dà l&rsquo;esempio più povero possibile, $|\alpha\rangle=c_{0}|0\rangle+c_{1}|1\rangle$, in cui $\langle x(t)\rangle$ effettivamente oscilla. Ma quella sovrapposizione <i>cambia forma</i> mentre si muove. La domanda vera, che è quella di Schrödinger nel 1926, è se esista una sovrapposizione che oscilli <b>senza deformarsi</b>, e la tappa 11 la costruisce.</p>`}
  ]},
  {t:'plot', title:'Quantistico contro classico: n = 0, n = 10, n = 30',
   intro:R`<p>In unità $m=\omega=\hbar=1$: la densità $|\psi_{n}|^{2}$ confrontata con la densità classica $1/(\pi\sqrt{A_{n}^{2}-x^{2}})$ di un oscillatore della stessa energia, cioè con ampiezza $A_{n}=\sqrt{2n+1}$. A sinistra lo stato fondamentale, dove il disaccordo è totale e di segno opposto; a destra $n=10$, dove le due cominciano a corrispondere in media.</p>`,
   plots:[{kind:'func2d', xr:[-2.2,2.2], yr:[-0.05,0.85], height:300, ticks:true,
     title:'n = 0: quantistico (blu) contro classico ad ampiezza 1 (arancio)',
     curves:[{f:'Math.pow(Math.PI,-0.5)*Math.exp(-x*x)', col:'#5aa9ff', width:2.6, label:'|psi_0|^2: massimo al centro'},
             {f:'(Math.abs(x)<0.995)?1/(Math.PI*Math.sqrt(1-x*x)):0/0', col:'#ffb86b', width:2.2, label:'classico: minimo al centro, divergente ai bordi'}],
     xlabel:'x', ylabel:'densita'},
    {kind:'func2d', xr:[-5.5,5.5], yr:[-0.02,0.35], height:300, ticks:true,
     title:'n = 10: le oscillazioni rapide seguono in media la curva classica',
     curves:[{f:'(function(){var H=[1,2*x];for(var k=2;k<=10;k++){H.push(2*x*H[k-1]-2*(k-1)*H[k-2]);}var f=1;for(var j=1;j<=10;j++){f*=j;}return Math.pow(H[10],2)*Math.exp(-x*x)/(Math.pow(2,10)*f*Math.sqrt(Math.PI));})()', col:'#5aa9ff', width:1.8, label:'|psi_10|^2'},
             {f:'(Math.abs(x)<4.57)?1/(Math.PI*Math.sqrt(21-x*x)):0/0', col:'#ffb86b', width:2.4, label:'classico ad ampiezza sqrt(21)'}],
     xlabel:'x', ylabel:'densita'}],
   leggi:R`<p><b>Che cosa guardare.</b> A sinistra le due curve sono <i>anticorrelate</i>: dove il classico ha il minimo il quantistico ha il massimo, e viceversa. Non è un accordo approssimativo: è il disaccordo massimo possibile. A destra, a $n=10$, la densità quantistica ha undici picchi e dieci zeri, e la curva classica passa <i>a metà</i> fra i massimi e gli zeri: mediando su un intervallo che contenga qualche oscillazione, le due coincidono — e la corrispondenza migliora verso i bordi, dove entrambe crescono.</p>
   <p><b>Che cosa impararne.</b> Il limite classico dell&rsquo;oscillatore è un limite <i>in media locale</i>, e non puntuale: la densità quantistica non converge alla classica in nessun punto, ma i suoi integrali su intervalli piccoli sì. In più restano due disaccordi che non svaniscono: i nodi, dove la probabilità è esattamente zero mentre il classico dà un valore finito, e le code fuori dall&rsquo;ampiezza, che si riducono ma non si annullano. <b>E resta il terzo disaccordo, quello che non si vede in questa figura perché è dinamico</b>: nessuna di queste distribuzioni si muove. Sono stazionarie per definizione, e nemmeno quella a $n=10$ — che <i>sembra</i> un oscillatore classico mediato nel tempo — descrive qualcosa che oscilli. <i>È questa la lacuna che gli stati coerenti riempiono</i>, e la differenza con la figura a destra è che uno stato coerente ha una densità stretta che <b>si sposta</b>, invece di una densità larga e ferma.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`La probabilità di stare in regione proibita vale $0{,}157$ per $n=0$. Come si comporta al crescere di $n$, e perché?`,
    a:R`<b>Decresce, lentamente, come $n^{-1/2}$ a meno di costanti.</b> La ragione è geometrica e si legge nella figura: la regione permessa si allarga come $A_{n}=\sqrt{2n+1}$ in unità naturali, mentre la coda esponenziale oltre il punto d&rsquo;inversione ha una larghezza che cresce molto più piano — il comportamento asintotico locale attorno a un punto d&rsquo;inversione è governato da una funzione di Airy, e la sua scala va come $A_{n}^{-1/3}$ rispetto all&rsquo;ampiezza. Quindi il <i>rapporto</i> fra la larghezza della coda e l&rsquo;ampiezza tende a zero, e la probabilità di sbordare tende a zero con lui. <i>Questo è l&rsquo;unico dei tre disaccordi che si riduce in modo semplice al crescere di $n$</i>, e vale notare che non si annulla mai: l&rsquo;effetto tunnel non scompare nel limite classico, diventa solo irrilevante. È lo stesso motivo per cui una palla da biliardo non attraversa il tavolo — non perché la meccanica quantistica lo vieti, ma perché la probabilità è un numero con molte decine di zeri dopo la virgola.`},
   {q:R`Si prenda la sovrapposizione minima di Sakurai, $(|0\rangle+|1\rangle)/\sqrt2$. $\langle x(t)\rangle$ oscilla; perché non basta?`,
    a:R`Perché oscilla la <b>media</b>, non il pacchetto. Il calcolo di $\langle x(t)\rangle$ su quello stato dà $\sqrt{\hbar/2m\omega}\cos\omega t$ — un&rsquo;oscillazione armonica alla frequenza giusta — ma la <i>larghezza</i> della distribuzione in posizione non è costante: $\langle x^{2}\rangle$ contiene i termini diagonali $(1/2)(\hbar/2m\omega)(1+3)$ più un termine di interferenza che <b>dipende dal tempo</b>, e dunque $\Delta x(t)$ pulsa al doppio della frequenza. Sakurai lo chiede nell&rsquo;esercizio 2.17(c), <i>«evaluate $\langle(\Delta x)^{2}\rangle$ as a function of time»</i>, proprio per far vedere questo. <i>Il pacchetto va avanti e indietro respirando</i>, e non è quello che fa una massa su una molla. <b>La domanda giusta, allora, è se la respirazione si possa eliminare</b>, e la risposta è sì — con una sovrapposizione di <i>tutti</i> i livelli e con coefficienti precisi, non con due. La tappa 13 mostra che i coefficienti sono quelli di una distribuzione di Poisson, e che la larghezza resta $\sqrt{\hbar/2m\omega}$ per sempre.`}
  ]}
]},

/* ---------------- 11 · GLI STATI COERENTI: TRE DEFINIZIONI ---------------- */
{ num:'11', title:'Gli stati coerenti: tre definizioni che sembrano diverse e sono la stessa', meta:'la domanda di Schrodinger del 1926 · lo stato fondamentale spostato nello spazio delle fasi · autovettore destro dell operatore di discesa · lo sviluppo nei livelli, con i coefficienti di Poisson',
  blocchi:[
  {t:'prosa', title:'La domanda, e chi se l’è posta per primo', tag:'architettura', html:R`
  <p>La tappa 10 ha lasciato una lacuna precisa: esiste uno stato che si muova come un oscillatore classico <i>senza deformarsi</i>? Sakurai la pone nella forma più diretta — <i>«How can we construct a superposition of energy eigenstates that most closely imitates the classical oscillator? In wave-function language, we want a wave packet that bounces back and forth without spreading in shape»</i> — e dà la risposta per annuncio: <i>«It turns out that a coherent state defined by the eigenvalue equation for the non-Hermitian annihilation operator $a$, $a|\lambda\rangle=\lambda|\lambda\rangle$… does the desired job»</i>.</p>
  <p><b>Quella definizione, però, non spiega niente.</b> Nessuno cercherebbe gli autovettori di un operatore non hermitiano se non sapesse già che la risposta è lì. La domanda storica era un&rsquo;altra, e Landau la registra come problema 3 del suo paragrafo 23: <i>«Determinare le funzioni d&rsquo;onda degli stati di un oscillatore lineare, che minimizzano la relazione di indeterminazione, cioè degli stati in cui le fluttuazioni medie quadratiche della coordinata e della quantità di moto nel pacchetto d&rsquo;onda sono legate dall&rsquo;uguaglianza $\delta p\,\delta x=\hbar/2$»</i>, con la nota <b>«E. Schrödinger, 1926»</b> e la postilla, in calce, <i>«tali stati sono detti stati coerenti»</i>.</p>
  <p><i>Questa è la domanda che vale porre, e non è un dettaglio di storia:</i> la tappa 02 ha dimostrato che lo stato fondamentale <b>satura</b> la relazione di indeterminazione, e la tappa 08 che è l&rsquo;unico stato stazionario a farlo. Chiedere quali <i>altri</i> stati la saturino è la continuazione naturale di quel conto — e la risposta sarà: tutti i traslati del fondamentale nello spazio delle fasi, cioè la macchia della figura della tappa 02 spostata dall&rsquo;origine. Da lì, e non dal postulato, viene la definizione.</p>`},
  {t:'reveal', title:'Prima definizione: spostare il fondamentale nello spazio delle fasi', tag:'costruzione', steps:[
   {label:'L’operatore di spostamento, e le sue due forme', body:R`
   <p>Ballentine costruisce gli stati coerenti così, e la scelta è quella che rende tutto il resto conseguenza. Si definisce, per ogni numero complesso $z$, l&rsquo;<b>operatore di spostamento</b> — la sua (19.52):</p>
   $$D(z)=\exp\big(z\,a^{\dagger}-z^{*}a\big).$$
   <p>È un <span class="str" data-str="operatore-unitario">operatore unitario</span>, perché l&rsquo;esponente è antihermitiano: $(za^{\dagger}-z^{*}a)^{\dagger}=z^{*}a-za^{\dagger}$, cioè l&rsquo;opposto. Dunque $D^{\dagger}(z)=D(-z)=D^{-1}(z)$, e in particolare $D(z)$ conserva le norme — fatto che renderà automatica la normalizzazione.</p>
   <p>Scritto in termini di posizione e impulso, prende una forma riconoscibile. Con massa unitaria, sostituendo $a=\sqrt{\omega/2\hbar}(Q+iP/\omega)$ e $a^{\dagger}=\sqrt{\omega/2\hbar}(Q-iP/\omega)$ nell&rsquo;esponente e separando parte reale e immaginaria di $z$:</p>
   $$z\,a^{\dagger}-z^{*}a=i\sqrt{\frac{\omega}{2\hbar}}\Big(2\,\mathrm{Im}\,z\cdot Q-\frac{2\,\mathrm{Re}\,z}{\omega}\cdot P\Big),$$
   <p>e questa coincide con $\frac{i}{\hbar}(p_{0}Q-q_{0}P)$ a patto di porre, come fa Ballentine nelle (19.54)-(19.55),</p>
   $$q_{0}=\sqrt{\frac{2\hbar}{\omega}}\,\mathrm{Re}\,z,\qquad p_{0}=\sqrt{2\hbar\omega}\,\mathrm{Im}\,z.$$
   <p>Che l&rsquo;identificazione sia esatta si verifica coefficiente per coefficiente. Per $Q$:</p>
   $$i\sqrt{\frac{\omega}{2\hbar}}\,2\,\mathrm{Im}\,z=\frac{i}{\hbar}\sqrt{2\hbar\omega}\,\mathrm{Im}\,z$$
   <p>e per $P$:</p>
   $$-i\sqrt{\frac{\omega}{2\hbar}}\,\frac{2\,\mathrm{Re}\,z}{\omega}=-\frac{i}{\hbar}\sqrt{\frac{2\hbar}{\omega}}\,\mathrm{Re}\,z$$
   <p>Dunque $D(z)=D(q_{0},p_{0})=\exp\big[\tfrac{i}{\hbar}(p_{0}Q-q_{0}P)\big]$: <b>è il prodotto di una traslazione in posizione — generata da $P$ — e di una traslazione in impulso, generata da $Q$</b>. Il numero complesso $z$ non è un parametro astratto: le sue parti reale e immaginaria sono un punto dello spazio delle fasi.</p>`},
   {label:'Che sposti davvero, con un commutatore che tronca la serie', body:R`
   <p>Le proprietà che giustificano il nome sono le (19.56)-(19.57) di Ballentine:</p>
   $$D(q_{0},p_{0})\,Q\,D^{-1}(q_{0},p_{0})=Q-q_{0}\,\mathbb 1,\qquad D\,P\,D^{-1}=P-p_{0}\,\mathbb 1,$$
   <p>e si ottengono dall&rsquo;identità $e^{Y}Xe^{-Y}=X+[Y,X]+\tfrac12[Y,[Y,X]]+\dots$ — il lemma di Baker-Hausdorff, che Sakurai scrive come (2.3.47). <b>Qui la serie si tronca dopo un termine</b>, e questo è ciò che rende la relazione esatta invece che approssimata. Ponendo $Y=\tfrac{i}{\hbar}(p_{0}Q-q_{0}P)$ e $X=Q$, il solo commutatore che sopravvive è quello di $Q$ con $P$:</p>
   $$[Y,Q]=\frac{i}{\hbar}(-q_{0})[P,Q]=\frac{i}{\hbar}(-q_{0})(-i\hbar)=-q_{0}$$
   <p>Il risultato è un <b>numero</b>, non un operatore, dunque il commutatore successivo $[Y,[Y,Q]]$ è nullo e la serie finisce. <i>Questa è la ragione strutturale per cui lo spazio delle fasi dell&rsquo;oscillatore ammette traslazioni esatte</i>: l&rsquo;algebra generata da $Q$, $P$ e $\mathbb 1$ si chiude, e un&rsquo;algebra che si chiude dopo un passo dà esponenziali calcolabili.</p>
   <p>Si definisce allora lo <b>stato coerente</b> come il fondamentale spostato — la (19.59):</p>
   $$|z\rangle=D(z)\,|0\rangle.$$
   <p>La normalizzazione è gratis per unitarietà, $\langle z|z\rangle=\langle0|0\rangle=1$. E i valori medi si calcolano in tre righe, con un passaggio che vale guardare: $\langle z|Q|z\rangle=\langle0|D^{-1}QD|0\rangle=\langle0|D(-z)QD^{-1}(-z)|0\rangle=\langle0|(Q+q_{0})|0\rangle=q_{0}$, perché $\langle0|Q|0\rangle=0$. Analogamente $\langle z|P|z\rangle=p_{0}$. Ballentine conclude: <i>«In fact, the entire position and momentum probability distributions are those of the ground state, displaced from the origin of phase space to the point $(q_{0},p_{0})$»</i>.</p>
   <p><b>E questo chiude il cerchio con la domanda di Schrödinger.</b> Lo stato fondamentale satura la relazione di indeterminazione; una traslazione nello spazio delle fasi non cambia né $\Delta Q$ né $\Delta P$, perché sposta le distribuzioni senza deformarle; dunque <i>ogni</i> $|z\rangle$ satura la relazione di indeterminazione. <b>Gli stati coerenti sono esattamente la famiglia di stati di minima indeterminazione che Landau cercava</b>, parametrizzata dal punto dello spazio delle fasi su cui sono centrati.</p>`}
  ]},
  {t:'reveal', title:'Seconda e terza definizione, e le dimostrazioni di equivalenza', tag:'costruzione', steps:[
   {label:'Autovettore destro dell’operatore di discesa', body:R`
   <p>Si parta da $a|0\rangle=0$ e si applichi $D(z)$ a sinistra, inserendo $D^{-1}D$ fra $a$ e il ket:</p>
   $$0=D(z)\,a\,|0\rangle=\big(D(z)\,a\,D^{-1}(z)\big)\,D(z)|0\rangle=(a-z\,\mathbb 1)\,|z\rangle,$$
   <p>dove si è usato di nuovo il lemma di Baker-Hausdorff, questa volta con $X=a$ e $Y=za^{\dagger}-z^{*}a$: il commutatore $[Y,a]=-z[a^{\dagger},a]\cdot(-1)=-z$ è un numero, dunque la serie tronca come prima. Si ottiene la (19.62):</p>
   $$a\,|z\rangle=z\,|z\rangle,$$
   <p>cioè <b>la definizione di Sakurai, dimostrata invece che postulata</b>. L&rsquo;equazione duale è $\langle z|a^{\dagger}=z^{*}\langle z|$, e Ballentine sottolinea l&rsquo;asimmetria: <i>«Since the operator $a$ is not Hermitian, the eigenvalue $z$ need not be real, and the eigenvector is right-handed only»</i>.</p>
   <p>Da qui segue una regola di calcolo che rende banali conti altrimenti lunghi, la sua (19.64): se un&rsquo;espressione è in <b>ordine normale</b> — tutti gli operatori di distruzione a destra, tutti quelli di creazione a sinistra — il suo valor medio su uno stato coerente si ottiene sostituendo $a\to z$ e $a^{\dagger}\to z^{*}$:</p>
   $$\langle z|f(a^{\dagger})\,g(a)|z\rangle=f(z^{*})\,g(z).$$
   <p><i>Gli stati coerenti sono, in questo senso, il posto in cui l&rsquo;algebra degli operatori diventa algebra di numeri complessi</i> — ed è per questo che in ottica quantistica si lavora quasi sempre in quella base.</p>`},
   {label:'Lo sviluppo nei livelli, e i coefficienti', body:R`
   <p>Per ottenere $|z\rangle$ come sovrapposizione di autostati dell&rsquo;energia serve fattorizzare l&rsquo;esponenziale, e qui l&rsquo;identità di Baker-Hausdorff si usa nella forma $e^{A+B}=e^{A}e^{B}e^{-[A,B]/2}$, valida quando $[A,B]$ commuta con entrambi — che è il caso, perché $[za^{\dagger},-z^{*}a]=|z|^{2}$ è un numero. Ballentine la scrive come (19.65):</p>
   $$D(z)=e^{za^{\dagger}-z^{*}a}=e^{-|z|^{2}/2}\,e^{za^{\dagger}}\,e^{-z^{*}a}.$$
   <p>Applicando a $|0\rangle$, il secondo esponenziale è l&rsquo;identità perché $a|0\rangle=0$, e del primo sopravvive l&rsquo;intera serie:</p>
   $$|z\rangle=e^{-|z|^{2}/2}\sum_{n=0}^{\infty}\frac{z^{n}}{n!}(a^{\dagger})^{n}|0\rangle=e^{-|z|^{2}/2}\sum_{n=0}^{\infty}\frac{z^{n}}{\sqrt{n!}}\,|n\rangle,$$
   <p>dove nell&rsquo;ultimo passaggio si è usato $|n\rangle=(n!)^{-1/2}(a^{\dagger})^{n}|0\rangle$, cioè la normalizzazione della tappa 05. È la (19.66) di Ballentine, e la stessa espressione che Ballentine propone come Problema 6.8(a) e Shankar come (21.1.118). La normalizzazione si verifica sommando la serie esponenziale:</p>
   $$\sum_{n=0}^{\infty}e^{-|z|^{2}}\frac{|z|^{2n}}{n!}=1$$
   <p>e l&rsquo;equivalenza con la definizione per autovalore si verifica direttamente sui coefficienti $c_{n}=e^{-|z|^{2}/2}z^{n}/\sqrt{n!}$: poiché $a|n+1\rangle=\sqrt{n+1}\,|n\rangle$, la condizione $a|z\rangle=z|z\rangle$ equivale a $\sqrt{n+1}\,c_{n+1}=z\,c_{n}$ per ogni $n$, e il rapporto torna</p>
   $$\sqrt{n+1}\,\frac{c_{n+1}}{c_{n}}=z$$
   <p><b>Le tre definizioni sono dunque la stessa.</b> E la terza — lo sviluppo esplicito — è quella che si usa per calcolare, perché mette in evidenza la quantità che la tappa 12 esamina: il modulo quadro dei coefficienti, $|c_{n}|^{2}=e^{-|z|^{2}}|z|^{2n}/n!$, che è una distribuzione di Poisson.</p>`},
   {label:'La quarta forma, che Sakurai chiede come esercizio', body:R`
   <p>Sakurai elenca le proprietà degli stati coerenti e, oltre alla distribuzione di Poisson, ne nomina due: <i>«2. It can be obtained by translating the oscillator ground state by some finite distance. 3. It satisfies the minimum uncertainty product relation at all times.»</i> Poi rimanda al Problema 2.19, che chiede di dimostrare quattro cose: che $e^{-|\lambda|^{2}/2}e^{\lambda a^{\dagger}}|0\rangle$ è uno stato coerente normalizzato, che soddisfa la minima indeterminazione, che la distribuzione è di Poisson, e <i>«show that a coherent state can also be obtained by applying the translation (finite-displacement) operator $e^{-ipl/\hbar}$ (where $p$ is the momentum operator and $l$ is the displacement distance) to the ground state»</i>.</p>
   <p><b>L&rsquo;ultimo punto è il caso particolare puramente reale del $D(z)$ di Ballentine</b>: prendendo $z$ reale si ha $p_{0}=0$ e lo spostamento è solo in posizione, $D=e^{-iq_{0}P/\hbar}$, cioè la traslazione nuda. Lo stato risultante è la gaussiana del fondamentale <i>spostata</i> ma <i>ferma</i>: posizione media $q_{0}$, impulso medio nullo. <i>È la condizione iniziale «lascia andare la molla da fermo a distanza $q_{0}$ dall&rsquo;equilibrio»</i>, e la tappa 13 la farà oscillare. Un $z$ con parte immaginaria corrisponde a lasciarla andare con una spinta.</p>
   <p>Esiste anche la forma esplicita della funzione d&rsquo;onda, che Shankar chiede nell&rsquo;Esercizio 21.1.18 — <i>«Start by using $a|z\rangle=z|z\rangle$ in the coordinate representation»</i> — e che è, come si deve aspettare, una gaussiana della stessa larghezza di $\psi_{0}$ centrata in $q_{0}$ e moltiplicata per un fattore di fase $e^{ip_{0}x/\hbar}$. <b>La larghezza è la stessa; il centro e la fase sono liberi.</b> Quel fattore di fase è ciò che porta l&rsquo;impulso medio, ed è la ragione per cui un pacchetto deve essere complesso per muoversi.</p>`}
  ]},
  {t:'plot', title:'Lo stato coerente nello spazio delle fasi: la stessa macchia, spostata',
   intro:R`<p>Le curve di livello della distribuzione nello spazio delle fasi, in unità $m=\omega=\hbar=1$, per lo stato fondamentale ($z=0$) e per uno stato coerente con $z=1{,}5+0{,}8i$, cioè centrato in $q_{0}=2{,}12$ e $p_{0}=1{,}13$. A destra, la stessa cosa in posizione: $|\psi_{0}|^{2}$ e $|\psi_{z}|^{2}$, che hanno la stessa larghezza.</p>`,
   plots:[{kind:'contour', f:'Math.exp(-((x-2.12)*(x-2.12)+(y-1.13)*(y-1.13))) + Math.exp(-(x*x+y*y))', xr:[-2.2,4.2], yr:[-2.2,3.2], height:320,
     levels:[0.05,0.15,0.3,0.5,0.7,0.9], title:'z = 0 (origine) e z = 1,5 + 0,8i',
     xlabel:'q', ylabel:'p'},
    {kind:'func2d', xr:[-3,5.5], yr:[-0.05,0.65], height:320, ticks:true,
     title:'la stessa gaussiana, traslata di q0 = 2,12',
     curves:[{f:'Math.pow(Math.PI,-0.5)*Math.exp(-x*x)', col:'#5aa9ff', width:2.4, label:'|psi_0|^2'},
             {f:'Math.pow(Math.PI,-0.5)*Math.exp(-(x-2.12)*(x-2.12))', col:'#ffb86b', width:2.4, label:'|psi_z|^2, stessa larghezza'}],
     xlabel:'x', ylabel:'densita'}],
   leggi:R`<p><b>Che cosa guardare.</b> Le due macchie di sinistra hanno <i>esattamente</i> la stessa forma e la stessa dimensione: l&rsquo;unica differenza è dove stanno. Non è un&rsquo;approssimazione del disegno — è il contenuto della relazione $D\,Q\,D^{-1}=Q-q_{0}$, che sposta le distribuzioni senza deformarle, e per questo $\Delta q$ e $\Delta p$ sono gli stessi dello stato fondamentale. A destra la stessa cosa in una dimensione: la curva arancione è la blu traslata, con la stessa altezza e la stessa larghezza a mezza altezza.</p>
   <p><b>Che cosa impararne.</b> Il numero complesso $z$ ha un significato geometrico esatto: è il punto dello spazio delle fasi su cui lo stato è centrato, in unità in cui $q$ e $p$ sono riscalati con le scale naturali del problema. Il modulo $|z|$ è la distanza dall&rsquo;origine, e la tappa 12 mostrerà che $|z|^{2}$ è il numero medio di quanti: <i>uno stato coerente lontano dall&rsquo;origine è uno stato con molta energia</i>, e l&rsquo;energia non sta in un livello definito ma distribuita attorno a $|z|^{2}$. La fase di $z$ è l&rsquo;angolo nello spazio delle fasi — cioè, come la tappa 13 farà vedere, la <b>fase dell&rsquo;oscillazione</b>: è questo che gli autostati dell&rsquo;energia non hanno, ed è la ragione per cui non oscillano.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Esistono stati coerenti per l&rsquo;operatore di <i>salita</i>, cioè vettori con $a^{\dagger}|\psi\rangle=\beta|\psi\rangle$?`,
    a:R`<b>No, nessuno.</b> È il Problema 6.8(b) di Ballentine, enunciato proprio come richiesta di dimostrazione: <i>«Show that the raising operator $a^{\dagger}$ has no right eigenvectors»</i>. La dimostrazione è di tre righe sui coefficienti. Si scriva $|\psi\rangle=\sum_{n}c_{n}|n\rangle$; allora $a^{\dagger}|\psi\rangle=\sum_{n}c_{n}\sqrt{n+1}\,|n+1\rangle$, e questa somma <i>non contiene $|0\rangle$</i>. Uguagliandola a $\beta\sum_{n}c_{n}|n\rangle$, la componente su $|0\rangle$ dà $0=\beta c_{0}$, e le componenti su $|m\rangle$ con $m\geq1$ danno $c_{m-1}\sqrt m=\beta c_{m}$. Se $\beta\neq0$: dalla prima $c_{0}=0$, e la ricorrenza — risolta in avanti, $c_{m}=c_{m-1}\sqrt m/\beta$ — propaga lo zero a tutti i coefficienti. Se $\beta=0$: la ricorrenza dà $c_{m-1}=0$ per ogni $m\geq1$, cioè tutti nulli. <i>In entrambi i casi resta il vettore nullo, che non è un autovettore.</i> <b>La ragione strutturale è quella della tappa 04</b>: la torre è limitata in basso e non in alto, dunque l&rsquo;operatore che scende «ha un muro dove fermarsi» e quello che sale no. L&rsquo;asimmetria dello spettro si riflette nell&rsquo;asimmetria degli autovettori.`},
   {q:R`Si è detto che gli stati coerenti saturano la minima indeterminazione. Esistono stati di minima indeterminazione che <i>non</i> siano coerenti?`,
    a:R`Sì, e la distinzione è importante perché il programma nomina gli stati coerenti e non quelli. La condizione $\Delta q\,\Delta p=\hbar/2$ è soddisfatta da <b>ogni</b> gaussiana, con qualunque larghezza: una gaussiana stretta in posizione e larga in impulso satura la disuguaglianza esattamente come una rotonda. Ciò che gli stati coerenti hanno in più è che la larghezza è quella <i>specifica</i> fissata dal vincolo $\Delta p=m\omega\Delta q$ della tappa 02 — cioè quella dello stato fondamentale di <i>quell&rsquo;</i>oscillatore. <b>E questo vincolo in più è esattamente ciò che fa sì che il pacchetto non si allarghi.</b> Una gaussiana di minima indeterminazione ma di larghezza sbagliata è uno <i>stato compresso</i>, e sotto evoluzione nell&rsquo;oscillatore respira: la sua $\Delta q$ pulsa al doppio della frequenza, come già accadeva alla sovrapposizione povera della tappa 10. <i>Minima indeterminazione garantisce che il pacchetto sia il più piccolo possibile ora; essere coerente garantisce che lo resti.</i> Gli stati compressi hanno un&rsquo;importanza pratica grossa — sono la base dell&rsquo;interferometria che ha misurato le onde gravitazionali — e si ottengono da $|z\rangle$ con un operatore quadratico in $a$ invece che lineare.`}
  ]}
]},

/* ---------------- 12 · LE PROPRIETA' ---------------- */
{ num:'12', title:'Le proprietà degli stati coerenti, compresa quella scomoda', meta:'la distribuzione di Poisson e il numero medio di quanti · le fluttuazioni relative · non sono ortogonali · sono troppi: la sovracompletezza, e la traccia che non si calcola',
  blocchi:[
  {t:'prosa', title:'Che tipo di base sia, e perché non è quella che si aspetta', tag:'architettura', html:R`
  <p>Gli stati $|z\rangle$ sono etichettati da un numero <b>complesso</b>, dunque da due parametri reali, mentre lo spazio ha una base numerabile $\{|n\rangle\}$. Shankar fa notare subito che qualcosa deve cedere: <i>«States labeled by different values of $z$ are not orthonormal. We should have expected nonorthogonality since the basis $|n\rangle$ labeled by the positive integers $n$ forms a complete basis and here we have one state for every complex number $z$! So they couldn&rsquo;t all be orthogonal.»</i></p>
  <p>Ballentine lo dice nei termini della conseguenza: <i>«The set of coherent state vectors $\{|z\rangle\}$ can be used as basis vectors, but its properties are very different from those of the familiar orthonormal sets.»</i> Questa tappa misura <i>quanto</i> diverse, e ne trae la regola di prudenza che va ricordata insieme alle proprietà belle.</p>`},
  {t:'reveal', title:'Le proprietà statistiche', tag:'costruzione', steps:[
   {label:'Poisson, e il numero medio di quanti', body:R`
   <p>Dallo sviluppo $|z\rangle=e^{-|z|^{2}/2}\sum_{n}z^{n}|n\rangle/\sqrt{n!}$ si legge la probabilità di trovare $n$ quanti — la (19.75) di Ballentine, la (2.3.54) di Sakurai:</p>
   $$\mathrm{Prob}(n|z)=\big|\langle n|z\rangle\big|^{2}=e^{-|z|^{2}}\frac{|z|^{2n}}{n!},$$
   <p>che è la distribuzione di Poisson di parametro $|z|^{2}$. Il numero medio si ottiene sommando, e il risultato giustifica l&rsquo;interpretazione geometrica della tappa 11:</p>
   $$\langle n\rangle=\sum_{n}n\,e^{-|z|^{2}}\frac{|z|^{2n}}{n!}=|z|^{2}$$
   <p>— lo stesso numero che Ballentine ricava senza la distribuzione, direttamente dagli operatori: $\langle z|a^{\dagger}a|z\rangle=z^{*}z=|z|^{2}$, usando la regola dell&rsquo;ordine normale. Il momento secondo:</p>
   $$\langle n^{2}\rangle=|z|^{4}+|z|^{2}$$
   <p>e qui il conto operatoriale è istruttivo, perché mostra da dove viene il termine in più: $\langle z|a^{\dagger}aa^{\dagger}a|z\rangle=|z|^{2}\langle z|aa^{\dagger}|z\rangle=|z|^{2}\langle z|(a^{\dagger}a+1)|z\rangle$, e <i>il più uno è il commutatore</i>. Dunque la varianza è $\langle n^{2}\rangle-\langle n\rangle^{2}=|z|^{2}$, cioè $\Delta n=|z|$ — la firma della Poisson, varianza uguale alla media.</p>`},
   {label:'Il limite classico, in forma di rapporto', body:R`
   <p>Il numero che conta non è $\Delta n$ ma la fluttuazione <i>relativa</i>, ed è la (19.79) di Ballentine:</p>
   $$\frac{\Delta n}{\langle n\rangle}=\frac{1}{|z|}=\frac{1}{\sqrt{\langle n\rangle}}$$
   <p><b>Questo è il limite classico, scritto come stima.</b> Per un campo laser con $\langle n\rangle=10^{16}$ fotoni in un modo, la fluttuazione relativa del numero è $10^{-8}$: il campo è, per ogni scopo pratico, di ampiezza definita. Ma $\Delta n=10^{8}$ in assoluto, cioè l&rsquo;incertezza sul numero di fotoni è enorme — <i>e deve esserlo</i>. Ballentine traccia il baratto: <i>«The fluctuations in the fields in a coherent state are as small as possible. We see that this entails a fluctuation in the number of photons, and that the magnitude of the photon number fluctuation increases as the field amplitude $z$ increases.»</i></p>
   <p><i>È la stessa cosa che l&rsquo;indeterminazione fra posizione e impulso, letta in altre variabili:</i> si può avere un campo di ampiezza e fase ben definite, e allora il numero di quanti fluttua; oppure un numero di quanti definito — un autostato di $N$ — e allora la fase non esiste e il campo medio è nullo. <b>Non c&rsquo;è uno stato che abbia entrambi</b>, e gli stati coerenti sono il compromesso che minimizza il prodotto.</p>
   <p>Si noti anche l&rsquo;energia media, che conferma l&rsquo;interpretazione e che si ottiene sommando sulla Poisson:</p>
   $$\langle H\rangle_{z}=\hbar\omega\Big(|z|^{2}+\frac12\Big)$$
   <p>Landau ottiene esattamente questo nel suo problema 3, e lo commenta così: <i>«la grandezza $\bar\nu$ introdotta qui è il numero medio di quanti $\hbar\omega$ nello stato considerato»</i>, e per la probabilità trova <i>«la nota distribuzione di Poisson»</i>. <b>Due autori, due strade completamente diverse — Landau parte dal pacchetto gaussiano e sviluppa, Ballentine parte dall&rsquo;operatore di spostamento — e lo stesso risultato.</b></p>`}
  ]},
  {t:'reveal', title:'La proprietà scomoda: sono troppi', tag:'avvertenza', steps:[
   {label:'Non sono ortogonali, e di quanto', body:R`
   <p>Il prodotto scalare fra due stati coerenti si calcola dallo sviluppo, usando l&rsquo;ortonormalità degli $|n\rangle$ e riconoscendo la serie esponenziale:</p>
   $$\sum_{n}\frac{(z^{*})^{n}(z')^{n}}{n!}=e^{z^{*}z'}$$
   <p>da cui la (19.67a) di Ballentine, $\langle z|z'\rangle=\exp\big[-\tfrac12(|z|^{2}+|z'|^{2})+z^{*}z'\big]$. Per $z$ e $z'$ reali l&rsquo;esponente si riconosce come un quadrato perfetto:</p>
   $$e^{-\frac12|z|^{2}-\frac12|z'|^{2}+z^{*}z'}=e^{-\frac12(z-z')^{2}}$$
   <p>e in generale il modulo è la (19.67b), $|\langle z|z'\rangle|=\exp\big[-\tfrac12|z-z'|^{2}\big]$. Ballentine ne trae la lettura operativa: <i>«although no two coherent states are orthogonal, the overlap between them is very small if they are reasonably far apart in the complex $z$ plane»</i>.</p>
   <p><b>La scala del «lontano» è uno.</b> Due stati coerenti a distanza $|z-z'|=3$ nel piano complesso hanno sovrapposizione $e^{-4{,}5}\simeq0{,}011$: praticamente distinguibili. A distanza $0{,}3$ hanno sovrapposizione $0{,}96$: praticamente lo stesso stato. <i>Il piano complesso $z$ si comporta come uno spazio delle fasi in cui la risoluzione è una cella di lato unitario</i>, che è la stessa cella che la figura della tappa 02 ha mostrato.</p>`},
   {label:'La completezza, e il «sovra»', body:R`
   <p>Nonostante la non ortogonalità, l&rsquo;insieme è completo, e la relazione è la (19.68) di Ballentine, la (21.1.127) di Shankar:</p>
   $$\pi^{-1}\int|z\rangle\langle z|\;d^{2}z=\mathbb 1,$$
   <p>dove $d^{2}z=dx\,dy$ è l&rsquo;elemento d&rsquo;area del piano complesso. La dimostrazione si fa in coordinate polari, $z=re^{i\theta}$: l&rsquo;integrale angolare uccide tutti i termini con $n\neq m$ — perché $\int_{0}^{2\pi}e^{i(n-m)\theta}d\theta=2\pi\delta_{nm}$ — e resta un integrale radiale per ciascun $n$, che è un&rsquo;integrale gamma:</p>
   $$2\int_{0}^{\infty}r^{2n+1}e^{-r^{2}}dr=n!$$
   <p>e per esempio, con $n=3$,</p>
   $$2\int_{0}^{\infty}r^{7}e^{-r^{2}}dr=3!=6$$
   <p>Il fattoriale cancella esattamente l&rsquo;$1/n!$ dei coefficienti, e resta $\pi\sum_{n}|n\rangle\langle n|=\pi\,\mathbb 1$. <b>Il fattore $\pi$ non è una convenzione: è l&rsquo;area della cella di risoluzione, e dice che c&rsquo;è «uno stato ogni $\pi$ unità di area» nel piano complesso.</b></p>
   <p>Ma la completezza, qui, viene con un difetto. Ballentine: <i>«this representation is not unique, because the set $\{|z\rangle\}$ is overcomplete; that is to say, it is not linearly independent»</i>, e lo mostra nel modo più diretto — ogni stato coerente si scrive come combinazione lineare degli altri, $|z\rangle=\pi^{-1}\int|z'\rangle\langle z'|z\rangle\,d^{2}z'$. Shankar la chiama <i>«an overcomplete basis, i.e., a basis with enough vectors to expand any vector but with more than the smallest number one could have gotten away with»</i>.</p>`},
   {label:'La conseguenza che va ricordata: la traccia', body:R`
   <p>Ballentine isola una conseguenza concreta, e vale metterla in evidenza perché è il tipo di errore che si fa per analogia con le basi ortonormali — la sua (19.69):</p>
   $$\mathrm{Tr}(A)\neq\int\langle z|A|z\rangle\,d^{2}z.$$
   <p><i>«One important consequence of this overcompleteness is that the usual formula for the trace of an operator does not apply in the coherent state basis.»</i> In una base ortonormale la traccia è la somma degli elementi diagonali, $\sum_{n}\langle n|A|n\rangle$, e la formula funziona proprio perché la base è ortonormale. Nella base coerente la stessa espressione, con l&rsquo;integrale al posto della somma, <b>conta più volte la stessa informazione</b>, perché i vettori non sono indipendenti. Il modo corretto è reinserire il fattore e l&rsquo;espansione, $\mathrm{Tr}(A)=\pi^{-1}\int\langle z|A|z\rangle\,d^{2}z$ — che differisce dalla formula sbagliata esattamente per il $\pi^{-1}$ della relazione di completezza.</p>
   <p><b>La regola generale da portarsi via è questa:</b> <i>in una base sovracompleta la relazione di completezza si può usare — è vera — ma le identità che derivano dall&rsquo;indipendenza lineare no.</i> Si può espandere ogni vettore, ma non in modo unico; si può inserire $\mathbb 1$ dove serve, ma non si può concludere da $\langle z|\psi\rangle=\langle z|\phi\rangle$ per un sottoinsieme di $z$ che $|\psi\rangle=|\phi\rangle$ — anzi, per gli stati coerenti vale il contrario di quanto si aspetterebbe: $\langle z|\psi\rangle$ è una funzione <b>analitica</b> di $z^{*}$, dunque determinata da un insieme numerabile di valori, e questo è il senso preciso in cui ci sono «troppi» stati.</p>`}
  ]},
  {t:'plot', title:'La Poisson che si stringe, e la sovrapposizione che decade',
   intro:R`<p>A sinistra la distribuzione del numero di quanti per tre stati coerenti con $\langle n\rangle=|z|^{2}$ pari a 2, 9 e 25: si noti che la larghezza assoluta cresce come $\sqrt{\langle n\rangle}$ mentre quella relativa si stringe. A destra il modulo della sovrapposizione $|\langle z|z'\rangle|$ fra due stati coerenti reali in funzione della loro distanza.</p>`,
   plots:[{kind:'func2d', xr:[-0.5,45], yr:[-0.02,0.3], height:300, ticks:true,
     title:'Poisson: la busta continua e^{-mu} mu^n / n! per mu = 2, 9, 25',
     curves:[{f:'Math.exp(-2 + x*Math.log(2) - (x*Math.log(x)-x+0.5*Math.log(2*Math.PI*x)))', col:'#5aa9ff', width:2.2, label:'<n> = 2: Delta n / n = 0,71'},
             {f:'Math.exp(-9 + x*Math.log(9) - (x*Math.log(x)-x+0.5*Math.log(2*Math.PI*x)))', col:'#9b8cff', width:2.2, label:'<n> = 9: Delta n / n = 0,33'},
             {f:'Math.exp(-25 + x*Math.log(25) - (x*Math.log(x)-x+0.5*Math.log(2*Math.PI*x)))', col:'#ffb86b', width:2.2, label:'<n> = 25: Delta n / n = 0,20'}],
     xlabel:'n', ylabel:'probabilita'},
    {kind:'func2d', xr:[0,4.5], yr:[-0.05,1.1], height:300, ticks:true,
     title:'|<z|z prime>| = exp(-|z - z prime|^2 / 2)',
     curves:[{f:'Math.exp(-x*x/2)', col:'#5aa9ff', width:2.6, label:'sovrapposizione'},
             {f:'0.01', col:'#6f7a90', width:1.2, label:'soglia 1 per cento'}],
     xlabel:'|z - z prime|', ylabel:'sovrapposizione'}],
   leggi:R`<p><b>Che cosa guardare.</b> A sinistra, le tre curve sono la busta continua della Poisson (ottenuta con l&rsquo;approssimazione di Stirling per il fattoriale, che a questi valori è buona a meno dell&rsquo;un per cento): il massimo si sposta a destra come $\langle n\rangle$ e la larghezza come $\sqrt{\langle n\rangle}$, dunque il picco diventa <i>relativamente</i> più stretto e <i>assolutamente</i> più largo. A destra, la sovrapposizione scende sotto l&rsquo;un per cento già a distanza $3$, e vale ancora $0{,}6$ a distanza $1$.</p>
   <p><b>Che cosa impararne.</b> La figura di sinistra è il limite classico in forma grafica: aumentando l&rsquo;ampiezza, lo stato coerente diventa un campo di ampiezza definita <i>senza mai</i> diventare un autostato del numero — la distribuzione si sposta, non si restringe. La figura di destra dice qual è l&rsquo;unità di misura naturale nel piano complesso: <b>uno</b>, e questo è il motivo per cui la relazione di completezza porta un $\pi$ e non un altro numero. <i>Non si può impacchettare informazione nello spazio delle fasi con risoluzione migliore di una cella di area $\pi$ in queste unità</i>, cioè di area $h$ nelle unità dimensionali — che è lo stesso conto per cui, in meccanica statistica, si divide il volume dello spazio delle fasi per $h$ per contare gli stati.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Qual è il valore <i>più probabile</i> di $n$ in uno stato coerente, e coincide con il valor medio?`,
    a:R`Quasi, e la differenza è istruttiva. La Poisson di parametro $\mu=|z|^{2}$ ha il massimo in $n=\lfloor\mu\rfloor$, e quando $\mu$ è un intero i due valori $n=\mu-1$ e $n=\mu$ hanno <b>la stessa probabilità</b>: per $\mu=4$ si ha $P(3)=P(4)=0{,}195$, ed entrambi superano $P(5)=0{,}156$. Il valor medio è esattamente $\mu$, la moda è $\lfloor\mu\rfloor$, e per $\mu$ grande la differenza fra i due è trascurabile rispetto alla larghezza $\sqrt\mu$. <i>Sakurai chiede proprio questo nel Problema 2.19(c)</i> — <i>«Find the most probable value of $n$, and hence of $E$»</i> — e la ragione per cui lo chiede è che media e moda non sono la stessa cosa per una distribuzione asimmetrica, e la Poisson lo è: ha una coda destra più lunga della sinistra, perché $n$ è limitato inferiormente da zero e non superiormente. <b>È la stessa asimmetria dello spettro che la tappa 04 ha trovato</b>, riaffacciata in veste statistica.`},
   {q:R`In uno stato coerente con $\langle n\rangle=|z|^{2}$, che probabilità c&rsquo;è di trovare <i>zero</i> quanti?`,
    a:R`Esattamente $e^{-|z|^{2}}$, cioè il quadrato del modulo della sovrapposizione $\langle0|z\rangle$ — e si ritrova la formula della non ortogonalità con $z'=0$. <b>È un numero piccolissimo ma non nullo per ogni $z$ finito</b>, e questo ha una conseguenza sperimentale: in un fascio laser attenuato fino a $\langle n\rangle=0{,}1$ fotoni per impulso, la probabilità di non avere nessun fotone è $e^{-0{,}1}=0{,}90$, quella di averne uno è $0{,}090$ e quella di averne <i>due o più</i> è $0{,}0047$ — cioè circa il 5 per cento degli impulsi non vuoti contiene più di un fotone. <i>Un laser attenuato non è una sorgente di fotoni singoli</i>, ed è precisamente per questo che la crittografia quantistica ha dovuto sviluppare sorgenti non coerenti: la statistica di Poisson, che è il marchio della coerenza, è anche il limite che impedisce di garantire «un fotone e non due». <b>La proprietà elegante e il difetto pratico sono lo stesso fatto.</b>`}
  ]}
]},

/* ---------------- 13 · L'EVOLUZIONE ---------------- */
{ num:'13', title:'L evoluzione: il pacchetto che oscilla e non si allarga', meta:'uno stato coerente resta coerente, con etichetta ruotata · il valor medio segue la traiettoria classica · la larghezza non cambia, mai · il conto di Schrodinger come lo fa Landau',
  blocchi:[
  {t:'prosa', title:'Il risultato, e perché giustifica il nome', tag:'costruzione', html:R`
  <p>Nello schema di Heisenberg l&rsquo;operatore di discesa evolve per sola moltiplicazione per una fase, $a(t)=a(0)e^{-i\omega t}$, come la tappa 10 ha stabilito. Nello schema di Schrödinger la conseguenza è notevole, e Shankar la enuncia dopo averla dimostrata: <i>«It is remarkable that under time evolution the coherent state remains a coherent state, but with a new label. This was one of the reasons one got interested in them in the first place.»</i></p>
  <p>La dimostrazione è immediata nello sviluppo in autostati: ogni termine acquista la fase $e^{-i(n+1/2)\omega t}$, dunque</p>
  $$|z,t\rangle=e^{-i\omega t/2}\,e^{-|z|^{2}/2}\sum_{n}\frac{\big(z\,e^{-i\omega t}\big)^{n}}{\sqrt{n!}}\,|n\rangle=e^{-i\omega t/2}\,\big|\,z\,e^{-i\omega t}\,\big\rangle.$$
  <p><b>Tutto l&rsquo;effetto dell&rsquo;evoluzione è la rotazione di $z$ nel piano complesso</b>, a velocità angolare $\omega$, più una fase globale irrilevante. Il modulo $|z|$ non cambia — dunque il numero medio di quanti e l&rsquo;energia media sono costanti, come devono — e cambia solo l&rsquo;argomento. <i>Nel linguaggio della figura della tappa 11: la macchia gira attorno all&rsquo;origine sull&rsquo;orbita classica, tenendo forma e dimensione.</i></p>
  <p>Ed ecco perché il nome ha senso. «Coerente» non significa «quantistico in un modo particolare»: significa che <b>le fasi relative delle componenti nei vari livelli restano accordate</b> mentre il tempo passa, perché i livelli sono equispaziati e dunque le fasi $e^{-in\omega t}$ si incrementano tutte dello stesso passo. In un potenziale non armonico — con livelli non equispaziati — la stessa sovrapposizione si sfaserebbe e il pacchetto si spanderebbe. <i>La coerenza non è una proprietà dello stato ma del matrimonio fra lo stato e l&rsquo;equispaziatura dello spettro</i>, e questo è l&rsquo;ultimo dei pagamenti che l&rsquo;equispaziatura rende.</p>`},
  {t:'reveal', title:'Il valor medio e la larghezza, calcolati', tag:'costruzione', steps:[
   {label:'La posizione media segue la traiettoria classica', body:R`
   <p>Si calcoli $\langle z|Q(t)|z\rangle$ nello schema di Heisenberg, con $Q(t)=\sqrt{\hbar/2m\omega}\,\big(a\,e^{-i\omega t}+a^{\dagger}e^{+i\omega t}\big)$ e usando $a|z\rangle=z|z\rangle$, $\langle z|a^{\dagger}=z^{*}\langle z|$. Posto, come nella tappa 11, $z=\sqrt{m\omega/2\hbar}\,\big(q_{0}+ip_{0}/m\omega\big)$, si ottiene</p>
   $$\langle z|Q(t)|z\rangle=q_{0}\cos\omega t+\frac{p_{0}}{m\omega}\sin\omega t$$
   <p>cioè <b>esattamente la soluzione classica</b> con posizione iniziale $q_{0}$ e impulso iniziale $p_{0}$ — e che sia la soluzione classica si verifica mettendola nell&rsquo;equazione del moto:</p>
   $$\ddot{\langle Q\rangle}+\omega^{2}\langle Q\rangle=0$$
   <p>Per lo stato coerente, dunque, il teorema di Ehrenfest non è un&rsquo;approssimazione valida nel limite di pacchetti stretti: è <i>esatto</i>. La ragione è che il potenziale è quadratico, dunque la forza è lineare, dunque $\langle F(Q)\rangle=F(\langle Q\rangle)$ identicamente. <b>Questo vale per qualunque stato dell&rsquo;oscillatore</b>, non solo per quelli coerenti — anche per un autostato dell&rsquo;energia, dove dice $0=0$. Ciò che è specifico degli stati coerenti è la seconda metà.</p>`},
   {label:'La larghezza non cambia, e questo è il punto', body:R`
   <p>Si calcoli $\langle Q^{2}\rangle$. Con $Q=\sqrt{\hbar/2m\omega}\,(a+a^{\dagger})$ si ha $Q^{2}=\frac{\hbar}{2m\omega}\big(a^{2}+(a^{\dagger})^{2}+2a^{\dagger}a+1\big)$, dove si è usato $aa^{\dagger}=a^{\dagger}a+1$ per portare in ordine normale. Il valor medio su $|z\rangle$, con la regola dell&rsquo;ordine normale, è $\frac{\hbar}{2m\omega}\big((z+z^{*})^{2}+1\big)$, e sottraendo il quadrato della media:</p>
   $$\langle Q^{2}\rangle-\langle Q\rangle^{2}=\frac{\hbar}{2m\omega}$$
   <p><b>Il risultato non dipende da $z$</b>, dunque nemmeno dal tempo, dato che l&rsquo;evoluzione cambia solo $z$. È lo <i>stesso</i> $\langle x^{2}\rangle_{0}$ dello stato fondamentale calcolato nella tappa 08. Ballentine lo commenta per il campo elettromagnetico nella stessa forma: <i>«This is independent of $z_{m}$, and is equal to the mean square fluctuation in the ground state. This result was to be expected, since the coherent state was obtained by displacing the ground state in phase space.»</i></p>
   <p><i>Messi insieme, i due conti dicono la cosa che si cercava dalla tappa 10:</i> una gaussiana larga $\sqrt{\hbar/2m\omega}$, il cui centro percorre l&rsquo;orbita classica e la cui larghezza resta la stessa per sempre. <b>È il pacchetto d&rsquo;onda che Sakurai descriveva come desiderato — «a wave packet that bounces back and forth without spreading in shape» — e questo conto è la dimostrazione che esiste.</b></p>
   <p>Un&rsquo;osservazione sul perché l&rsquo;oscillatore è speciale anche qui. Per una particella <b>libera</b> un pacchetto gaussiano si allarga, e la larghezza cresce con il tempo; il motivo è che le componenti a impulso diverso viaggiano a velocità diverse. Nell&rsquo;oscillatore tutte le componenti <i>tornano indietro</i> con lo stesso periodo $2\pi/\omega$, qualunque sia la loro energia — che è il fatto classico per cui il periodo dell&rsquo;oscillatore armonico non dipende dall&rsquo;ampiezza — dunque non c&rsquo;è dispersione. <i>L&rsquo;isocronismo classico e la non-dispersione quantistica sono lo stesso fatto</i>, letto nei due linguaggi.</p>`},
   {label:'Lo stesso conto come lo fa Landau, partendo dall’altra estremità', body:R`
   <p>Vale vedere la strada di Landau, perché non usa né operatori di spostamento né autovettori di $a$: usa l&rsquo;equazione d&rsquo;onda. Lui parte da un&rsquo;<b>ipotesi di forma</b> — la (1) del suo problema 3 — cercando una soluzione gaussiana con centro e impulso medio dipendenti dal tempo,</p>
   $$\Psi(x,t)=\frac{1}{(2\pi)^{1/4}(\delta x)^{1/2}}\exp\bigg\{\frac{i\bar p\,x}{\hbar}-\frac{(x-\bar x)^{2}}{4(\delta x)^{2}}\bigg\},$$
   <p>e impone che soddisfi l&rsquo;equazione di Schrödinger dipendente dal tempo. Due cose vengono fuori dalla sostituzione. La prima è che la coppia $(\bar x(t),\bar p(t))$ deve soddisfare le equazioni classiche: <i>«cioè la funzione $\bar x(t)$ soddisfa l&rsquo;equazione del moto classica»</i>. La seconda è il valore della larghezza, che la sostituzione <b>determina</b> invece di lasciare libero: Landau trova $(\delta x)^{2}=\hbar/2m\omega$.</p>
   <p><b>È lo stesso numero del conto operatoriale appena fatto, ottenuto da un&rsquo;equazione differenziale invece che da un commutatore</b>, e vale notare dove sta la differenza di informazione. Nella via di Ballentine la larghezza è quella dello stato fondamentale per costruzione — lo stato coerente <i>è</i> il fondamentale spostato. Nella via di Landau non si assume niente sul fondamentale: si impone che una gaussiana di larghezza <i>costante</i> risolva l&rsquo;equazione, e la larghezza esce come la sola per cui questo è possibile. <i>La seconda via dimostra qualcosa in più</i>: che fra tutte le gaussiane di larghezza costante ce n&rsquo;è una sola famiglia, cioè che la non-dispersione <b>seleziona</b> gli stati coerenti e non li contiene fra tanti altri.</p>
   <p>Landau chiude il problema con le due proprietà che la tappa 12 ha ritrovato per via algebrica: l&rsquo;energia media è $\hbar\omega(\bar\nu+\tfrac12)$, dove <i>«la grandezza $\bar\nu$ introdotta qui è il numero medio di quanti $\hbar\omega$ nello stato considerato»</i>, e la probabilità del livello $n$ <i>«è data dalla nota distribuzione di Poisson»</i>. E aggiunge la frase che riassume l&rsquo;oggetto: <i>«Si vede che lo stato coerente è completamente definito da una funzione $\bar x(t)$ che soddisfi l&rsquo;equazione classica»</i>. <b>Uno stato quantistico interamente etichettato da una traiettoria classica:</b> è il massimo di classicità che la teoria concede, e per $\bar x=\bar p=0$ si riduce allo stato fondamentale, come Landau verifica.</p>`}
  ]},
  {t:'plot', title:'Il pacchetto coerente in quattro istanti, e il confronto con un autostato',
   intro:R`<p>In unità $m=\omega=\hbar=1$: la densità $|\Psi(x,t)|^{2}$ di uno stato coerente con $q_{0}=3$ e $p_{0}=0$, cioè una gaussiana di larghezza $1/\sqrt2$ in $\langle x^{2}\rangle$ centrata in $3\cos t$, disegnata a $t=0$, $t=\pi/3$, $t=2\pi/3$ e $t=\pi$. A destra: la densità di un autostato dell&rsquo;energia con la stessa energia media, che <i>non si muove</i> a nessun istante.</p>`,
   plots:[{kind:'func2d', xr:[-4.5,4.5], yr:[-0.05,0.65], height:320, ticks:true,
     title:'stato coerente q0 = 3: il centro oscilla, la larghezza no',
     curves:[{f:'Math.pow(Math.PI,-0.5)*Math.exp(-Math.pow(x-3,2))', col:'#5aa9ff', width:2.4, label:'t = 0: centro in 3'},
             {f:'Math.pow(Math.PI,-0.5)*Math.exp(-Math.pow(x-1.5,2))', col:'#9b8cff', width:2.2, label:'t = pi/3: centro in 1,5'},
             {f:'Math.pow(Math.PI,-0.5)*Math.exp(-Math.pow(x+1.5,2))', col:'#ffb86b', width:2.2, label:'t = 2pi/3: centro in -1,5'},
             {f:'Math.pow(Math.PI,-0.5)*Math.exp(-Math.pow(x+3,2))', col:'#ff6b8a', width:2.4, label:'t = pi: centro in -3'}],
     xlabel:'x', ylabel:'densita'},
    {kind:'curve', xr:[-4.5,4.5], yr:[-4.5,4.5], height:320, ticks:true,
     title:'il centro del pacchetto nello spazio delle fasi: l orbita classica',
     fx:'3*Math.cos(t)', fy:'-3*Math.sin(t)', tr:[0,6.2832],
     xlabel:'<q>', ylabel:'<p>'}],
   leggi:R`<p><b>Che cosa guardare.</b> Le quattro curve di sinistra sono <i>la stessa curva traslata</i>: altezza identica, larghezza identica, solo il centro cambia, e si muove come $3\cos t$ — cioè con l&rsquo;ampiezza e il periodo di un oscillatore classico lasciato andare da fermo a distanza 3. A destra, il centro del pacchetto percorre la circonferenza di raggio 3 nello spazio delle fasi, che è esattamente l&rsquo;orbita classica di energia $9/2$ in queste unità.</p>
   <p><b>Che cosa impararne.</b> Il confronto con la figura della tappa 10 è il punto di tutto il movimento. Là, a $n=10$, la densità quantistica somigliava alla distribuzione classica <i>mediata nel tempo</i>, ed era ferma. Qui la densità non somiglia a niente di mediato: <b>è una particella localizzata che si muove sulla traiettoria classica</b>, e il prezzo pagato è che l&rsquo;energia non ha un valore definito — è distribuita secondo Poisson attorno a $\langle n\rangle=|z|^{2}=4{,}5$. <i>Sono due limiti classici diversi, e nessuno dei due è «il» limite classico:</i> uno rinuncia alla fase per avere l&rsquo;energia, l&rsquo;altro rinuncia all&rsquo;energia per avere la fase. La meccanica classica ha entrambe, e questo è precisamente ciò che la meccanica quantistica non concede.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Che cosa accade a uno stato coerente in un potenziale <i>anarmonico</i>, cioè con un termine $x^{4}$ piccolo?`,
    a:R`Si <b>sparpaglia</b>, e il meccanismo si legge direttamente dallo sviluppo. L&rsquo;evoluzione moltiplica l&rsquo;$n$-esima componente per $e^{-iE_{n}t/\hbar}$; se $E_{n}=(n+\tfrac12)\hbar\omega$ le fasi avanzano in progressione aritmetica e lo stato resta coerente, ma se i livelli acquistano una correzione non lineare in $n$ — per un termine quartico, tipicamente proporzionale a $n^{2}$ — le fasi relative si <i>sfasano</i>. Lo stato cessa di essere coerente in un tempo $t_{\rm sfas}$ dell&rsquo;ordine di $\hbar/(\Delta n\cdot\delta E)$, dove $\delta E$ è la spaziatura differenziale. <i>È il «collasso» del pacchetto che si osserva nelle vibrazioni molecolari eccitate</i>, e ha un seguito spettacolare: poiché i livelli restano <b>discreti</b>, le fasi dopo un tempo molto più lungo si riallineano e il pacchetto si <b>ricompone</b> — la rinascita, o <i>revival</i>. <b>Il punto generale:</b> la non-dispersione dello stato coerente non è una sua proprietà intrinseca, è un prestito dell&rsquo;equispaziatura dello spettro, e appena quella si rompe il prestito viene richiamato.`},
   {q:R`Nello sviluppo, l&rsquo;evoluzione produce una fase globale $e^{-i\omega t/2}$ che si è detta irrilevante. Lo è sempre?`,
    a:R`Per un sistema isolato sì — una fase globale non entra in nessun valor medio, perché compare moltiplicata per il suo coniugato. <b>Ma diventa osservabile appena il sistema è una parte di un sistema più grande</b>, cioè appena la si confronta con la fase di qualcos&rsquo;altro. Per due modi di frequenza diversa, $\omega_{1}$ e $\omega_{2}$, le due fasi di punto zero danno una <i>differenza</i> $e^{-i(\omega_{1}-\omega_{2})t/2}$ che è una fase relativa, e quella si misura in interferometria. <i>È lo stesso motivo per cui l&rsquo;energia di punto zero, che sembra una costante additiva ineliminabile e quindi convenzionale, non è affatto convenzionale:</i> sommata su tutti i modi del campo elettromagnetico e fatta dipendere dalla geometria — due piastre metalliche vicine ammettono modi diversi dal vuoto libero — produce una forza misurabile, l&rsquo;effetto Casimir, e la tappa 14 cita Ballentine su come stiano le cose. <b>Una fase globale è irrilevante; un&rsquo;energia di punto zero no.</b>`}
  ]}
]},

/* ---------------- 14 · DOVE VIVONO DAVVERO: IL CAMPO ---------------- */
{ num:'14', title:'Dove gli stati coerenti vivono davvero: il campo elettromagnetico', meta:'ogni modo del campo è un oscillatore · un autostato del numero ha campo medio nullo · in uno stato coerente il campo medio è una soluzione di Maxwell · la fluttuazione resta quella del vuoto · il laser e il baratto numero-fase',
  blocchi:[
  {t:'prosa', title:'Perché questa tappa non è un’applicazione ma la ragione', tag:'architettura', html:R`
  <p>La tappa 01 ha anticipato, senza svolgerlo, che il campo elettromagnetico nel vuoto si decompone in modi normali ciascuno equivalente a un oscillatore. Dirac lo dichiara come il motivo per cui l&rsquo;oscillatore gli interessava, e al paragrafo 60 lo porta alla sua forma generale: <i>«il sistema dinamico costituito da un insieme di bosoni identici è equivalente al sistema dinamico costituito da un insieme di oscillatori: i due sistemi non sono altro che lo stesso sistema considerato da due diversi punti di vista. Vi è un solo oscillatore associato a ciascuno stato bosonico indipendente. Abbiamo qui uno dei risultati veramente fondamentali della meccanica quantistica»</i>. Nel suo linguaggio gli operatori sono gli stessi: $\eta_{\alpha}$ e $\bar\eta_{\alpha}$ per ogni modo, con le stesse regole di commutazione, e <i>«quanto abbiamo detto nel paragrafo 34 mostra che ciascuna di esse ha come autovalori tutti i numeri interi non negativi»</i>.</p>
  <p>Qui non si costruisce quella quantizzazione — è lavoro di un&rsquo;altra teoria — ma si prende il risultato e si guarda che cosa gli stati coerenti vi significano. <b>La ragione per cui vale farlo è che è l&rsquo;unico posto in cui gli stati coerenti smettono di essere una curiosità matematica</b>: lì descrivono un oggetto reale, cioè la luce di un laser, e lì si vede perché «coerente» è la parola che l&rsquo;ottica usa.</p>
  <p>Il punto di partenza è la hamiltoniana di un modo, $H_{m}=\hbar\omega_{m}(a_{m}^{\dagger}a_{m}+\tfrac12)$, e l&rsquo;operatore di campo elettrico, che è lineare negli operatori di creazione e distruzione — la (19.71) di Ballentine:</p>
  $$\mathbf E(\mathbf x,t)=\sum_{m}(2\pi\hbar\omega_{m})^{1/2}\big\{a_{m}^{\dagger}e^{i\omega_{m}t}+a_{m}e^{-i\omega_{m}t}\big\}\,\mathbf u_{m}(\mathbf x),$$
  <p>dove $\mathbf u_{m}$ è la funzione spaziale del modo. <i>Il campo elettrico sta agli operatori del modo come la posizione sta agli operatori dell&rsquo;oscillatore</i>, e tutto ciò che segue è la traduzione dei risultati delle tappe precedenti in questo dizionario.</p>`},
  {t:'reveal', title:'Due stati, due fisiche', tag:'costruzione', steps:[
   {label:'Un autostato del numero: fotoni definiti, campo nullo', body:R`
   <p>In uno stato con numeri di fotoni definiti, $|n_{1},n_{2},\dots\rangle$, il campo medio è <b>zero</b> — la (19.47) di Ballentine:</p>
   $$\langle\mathbf E(\mathbf x,t)\rangle=0.$$
   <p>Il motivo è esattamente quello della tappa 10: $\mathbf E$ è lineare in $a$ e $a^{\dagger}$, che cambiano $n$ di uno, e $|n\rangle$ è ortogonale a $|n\pm1\rangle$. <i>È lo stesso fatto per cui $\langle n|x(t)|n\rangle=0$</i>, tradotto. Ballentine lo dice: <i>«In a state with definite photon numbers, the electric and magnetic fields are indefinite and fluctuating. The probability distributions for the electric and magnetic fields in such a state are analogous to the distributions for the position and momentum of an oscillator in an energy eigenstate.»</i></p>
   <p>Il valor medio del quadrato invece non è nullo, e porta il termine di punto zero — la (19.48):</p>
   $$\big\langle|\mathbf E|^{2}\big\rangle=\sum_{m}2\pi\hbar\omega_{m}\big|\mathbf u_{m}(\mathbf x)\big|^{2}\,(2n_{m}+1).$$
   <p><b>Il $+1$ accanto a $2n_{m}$ è l&rsquo;energia di punto zero del modo</b>, la stessa $\hbar\omega/2$ della tappa 03, e sommata su infiniti modi dà infinito. Ballentine non lo copre: <i>«The sum over all modes is infinite»</i>, e poco prima, discutendo l&rsquo;effetto Casimir, scrive il conto in cui questa quantità infinita produce una previsione verificata: <i>«These results indicate that the notion of a zero-point or vacuum energy is not spurious, and cannot be discarded. We are left with a conundrum that has never been adequately resolved: an infinite zero-point energy density is nonsensical, but finite parts of it yield experimentally confirmed consequences.»</i> Riporta anche il giudizio di Dirac sulla rinormalizzazione, dall&rsquo;ultima pagina dei <i>Principi</i>: <i>«the rules… do not fit in with the logical foundations of quantum mechanics. They should therefore not be considered as a satisfactory solution of the difficulties.»</i> <i>Si cita perché è un limite dichiarato della teoria, non perché sia un aneddoto:</i> il mezzo che la tappa 03 ha ricavato in due righe è, sommato su infiniti modi, il primo infinito della teoria quantistica dei campi.</p>`},
   {label:'Uno stato coerente: il campo medio è una soluzione di Maxwell', body:R`
   <p>Si prenda invece uno stato coerente per ciascun modo, $|\{z\}\rangle=|z_{1}\rangle\otimes|z_{2}\rangle\otimes\cdots$. Con la regola dell&rsquo;ordine normale — $a\to z$, $a^{\dagger}\to z^{*}$ — il campo medio si legge immediatamente dalla (19.72):</p>
   $$\langle\mathbf E(\mathbf x,t)\rangle=\sum_{m}(2\pi\hbar\omega_{m})^{1/2}\big\{z_{m}^{*}e^{i\omega_{m}t}+z_{m}e^{-i\omega_{m}t}\big\}\,\mathbf u_{m}(\mathbf x).$$
   <p><b>Questa è, letteralmente, l&rsquo;espansione in modi normali di una soluzione classica delle equazioni di Maxwell</b>, con $z_{m}$ nel ruolo dell&rsquo;ampiezza complessa del modo $m$. Ballentine lo dice e subito avverte: <i>«This is exactly the same form as a normal mode expansion of a classical solution of Maxwell&rsquo;s equations, with the parameter $z_{m}$ representing the amplitude of a classical field mode. However, it must be emphasized that, in spite of this similarity, a coherent state of the quantized EM field is not equivalent to a classical field.»</i></p>
   <p>Il perché dell&rsquo;avvertenza è il conto delle fluttuazioni. Nel quadrato del campo, l&rsquo;ultimo termine va riordinato normalmente usando</p>
   $$a_{m}a_{m}^{\dagger}=a_{m}^{\dagger}a_{m}+1$$
   <p>e il $+1$ che ne risulta è <i>precisamente</i> ciò che sopravvive quando si sottrae il quadrato del valor medio — tutti gli altri termini si cancellano:</p>
   $$\langle|\mathbf E_{m}|^{2}\rangle-\langle\mathbf E_{m}\rangle^{2}=2\pi\hbar\omega_{m}|\mathbf u_{m}(\mathbf x)|^{2}$$
   <p>cioè la (19.74). <b>La fluttuazione del campo in uno stato coerente è indipendente da $z$, e uguale a quella del vuoto.</b> È il risultato della tappa 13 — la larghezza non cambia mai — scritto in variabili di campo, ed è atteso per la stessa ragione: lo stato coerente è il fondamentale spostato.</p>
   <p>Da qui il limite classico, come rapporto: la fluttuazione quadratica media relativa al campo medio è dell&rsquo;ordine di $|z_{m}|^{-1}$, dunque <i>«the fractional fluctuation of the field becomes negligible in the large amplitude limit, $|z_{m}|\to\infty$. In this way the classical limit of the EM field is reached.»</i> E Ballentine aggiunge l&rsquo;unica frase che serve per collegare tutto questo a un oggetto: <i>«A coherent state provides a good description of the EM field produced by a laser.»</i></p>`},
   {label:'Il baratto, e perché un fotone non ha una posizione', body:R`
   <p>Le due colonne, messe una accanto all&rsquo;altra, sono il contenuto fisico di questa tappa.</p>
   <p><b>Autostato del numero.</b> Energia definita, numero di fotoni definito. Campo medio nullo, fase indefinita. È lo stato che descrive un singolo fotone, ed è ciò che si usa in ottica quantistica quando conta il conteggio.</p>
   <p><b>Stato coerente.</b> Campo medio uguale a un&rsquo;onda classica, ampiezza e fase definite entro le fluttuazioni del vuoto. Numero di fotoni indefinito, con distribuzione di Poisson e $\Delta n=\sqrt{\langle n\rangle}$. È ciò che esce da un laser.</p>
   <p><i>Non esiste uno stato che abbia entrambe le colonne</i>, e questa è la ragione per cui i due linguaggi dell&rsquo;ottica — «onda» e «fotone» — non sono due descrizioni dello stesso stato ma descrizioni accurate di <b>stati diversi</b>. Ballentine inserisce qui una citazione che vale leggere perché raffredda l&rsquo;entusiasmo sulle particelle: quando J. Frenkel, nel 1932, introdusse il termine «fonone» per i quanti delle vibrazioni di un cristallo, annotò che <i>«it is not in the least intended to convey the impression that such photons have a real existence. On the contrary, the possibility of their introduction rather serves to discredit the belief in the real existence of photons»</i>. E Ballentine nello stesso paragrafo mette il limite in modo diretto: <i>«These elementary excitations of the EM field behave in many respects like particles, carrying energy and momentum. However, the analogy is incomplete, and it is not possible to replace the EM field by a gas of photons.»</i></p>
   <p><b>Che cosa c&rsquo;entra l&rsquo;oscillatore armonico con tutto questo:</b> tutto. Il «fotone» è un quanto di un modo, e un modo è un oscillatore; il «numero di fotoni» è l&rsquo;autovalore dell&rsquo;operatore numero della tappa 03; l&rsquo;impossibilità di avere insieme numero e fase è l&rsquo;impossibilità di avere insieme $n$ e la fase di $z$, cioè una forma dell&rsquo;indeterminazione della tappa 02. <i>Chi ha capito l&rsquo;oscillatore fino in fondo non deve imparare l&rsquo;ottica quantistica da zero: deve imparare il dizionario.</i></p>`}
  ]},
  {t:'plot', title:'Il campo medio e la sua banda di fluttuazione, in due stati',
   intro:R`<p>In unità in cui $2\pi\hbar\omega|\mathbf u|^{2}=1$: il campo medio in funzione del tempo per uno stato coerente con $z$ reale di modulo 4 (cioè $\langle n\rangle=16$), con la banda di larghezza $\pm1$ che è la fluttuazione del vuoto; e lo stesso per uno stato coerente debole con $|z|=1$, dove la banda è della stessa dimensione del segnale.</p>`,
   plots:[{kind:'func2d', xr:[0,12.6], yr:[-10,10], height:300, ticks:true,
     title:'|z| = 4: il campo medio e la banda di fluttuazione del vuoto',
     curves:[{f:'8*Math.cos(x)', col:'#5aa9ff', width:2.6, label:'campo medio'},
             {f:'8*Math.cos(x)+1', col:'#6f7a90', width:1.2, label:'+ una deviazione standard'},
             {f:'8*Math.cos(x)-1', col:'#6f7a90', width:1.2, label:'- una deviazione standard'}],
     xlabel:'omega t', ylabel:'campo'},
    {kind:'func2d', xr:[0,12.6], yr:[-3.5,3.5], height:300, ticks:true,
     title:'|z| = 1: la banda e larga come il segnale',
     curves:[{f:'2*Math.cos(x)', col:'#ff6b8a', width:2.6, label:'campo medio'},
             {f:'2*Math.cos(x)+1', col:'#6f7a90', width:1.2, label:'+ una deviazione standard'},
             {f:'2*Math.cos(x)-1', col:'#6f7a90', width:1.2, label:'- una deviazione standard'}],
     xlabel:'omega t', ylabel:'campo'}],
   leggi:R`<p><b>Che cosa guardare.</b> Le bande grigie hanno <i>la stessa larghezza</i> nei due riquadri — è il contenuto del conto appena fatto, la fluttuazione non dipende da $z$ — mentre l&rsquo;ampiezza del campo medio è quattro volte più grande a sinistra. A sinistra la banda è un velo sottile attorno a una sinusoide ben definita; a destra è dello stesso ordine del segnale, e parlare di «un&rsquo;onda con quella fase» diventa discutibile.</p>
   <p><b>Che cosa impararne.</b> Il limite classico del campo elettromagnetico non è una proprietà della teoria, è una proprietà dell&rsquo;<i>intensità</i>: lo stesso formalismo descrive un fascio laser visibile — dove $\langle n\rangle$ è dell&rsquo;ordine di $10^{15}$ e la banda è invisibile — e un campo con pochi fotoni, dove le fluttuazioni del vuoto dominano. <i>E la banda non si può stringere restando coerenti</i>: è esattamente l&rsquo;indeterminazione minima, cioè la larghezza della macchia della tappa 11. Si può deformarla — schiacciarla in una direzione allargandola nell&rsquo;altra, che è ciò che fanno gli stati compressi — ma non ridurne l&rsquo;area. <b>È lo stesso vincolo con cui questo movimento ha cominciato, nella tappa 02</b>, letto per l&rsquo;ultima volta.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Perché un modo del campo elettromagnetico ha $\langle\mathbf E\rangle=0$ nel vuoto ma $\langle|\mathbf E|^{2}\rangle\neq0$, e come si può credere a una quantità che non si può misurare?`,
    a:R`Il campo medio nullo e il quadrato medio non nullo convivono per la stessa ragione per cui una variabile aleatoria a media zero ha varianza positiva: il vuoto non è «campo assente», è <b>campo che fluttua attorno a zero</b>. E si misura, in tre modi indipendenti che non si lasciano spiegare altrimenti: l&rsquo;<i>emissione spontanea</i> (un atomo eccitato in un vuoto davvero vuoto non avrebbe nessun motivo di decadere: è il campo di punto zero che lo stimola), lo <i>spostamento di Lamb</i> nei livelli dell&rsquo;idrogeno, e l&rsquo;<i>effetto Casimir</i> — l&rsquo;attrazione fra due piastre metalliche scariche e vicine, perché la geometria esclude certi modi e dunque cambia l&rsquo;energia di punto zero fra le piastre rispetto a fuori. <b>Ballentine riporta che la misura di Sparnaay del 1958 confermò la previsione di Casimir</b>, e trae la conclusione che va tenuta: <i>«an infinite zero-point energy density is nonsensical, but finite parts of it yield experimentally confirmed consequences»</i>. <i>La somma su tutti i modi è priva di senso; le sue differenze no</i>, ed è lo stesso tipo di situazione per cui il potenziale elettrico è definito a meno di una costante ma la differenza di potenziale si misura.`},
