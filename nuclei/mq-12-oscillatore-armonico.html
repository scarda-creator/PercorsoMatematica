   <p><b>Il mezzo non è un errore di conto: è il commutatore.</b> Se $p$ e $q$ commutassero il termine extra non ci sarebbe e si avrebbe $H=\hbar\omega\,\eta^{\dagger}\eta$, con minimo zero. <i>L&rsquo;energia di punto zero dell&rsquo;oscillatore è letteralmente il resto della fattorizzazione di una somma di quadrati non commutanti</i>, ed è lo stesso fatto che la tappa 02 ha dedotto dalla relazione di indeterminazione: qui si vede da dove viene il numero.</p>`},
   {label:'Il commutatore fondamentale', body:R`
   <p>Facendo il prodotto nell&rsquo;ordine opposto, $\eta\eta^{\dagger}$, l&rsquo;unico cambiamento è il segno del commutatore, dunque $\eta\eta^{\dagger}=H/\hbar\omega+1/2$. Sottraendo le due relazioni:</p>
   $$[\eta,\eta^{\dagger}]=1$$
   <p>e l&rsquo;aritmetica che la regge è che i due contributi del commutatore <i>si sommano</i> invece di elidersi, perché compaiono con segni opposti in una differenza:</p>
   $$\frac{m\omega\hbar+m\omega\hbar}{2m\hbar\omega}=1$$
   <p>Questa riga è la ragione del fattore $\sqrt{2m\hbar\omega}$ nella definizione: è scelto precisamente perché il commutatore venga <b>uno</b> e non una costante dimensionale. Da qui in poi tutta la dimensionalità del problema è stata spinta nei prefattori, e l&rsquo;algebra è pura.</p>`},
   {label:'I due commutatori con H, che sono il motore', body:R`
   <p>Da $H=\hbar\omega(\eta^{\dagger}\eta+\tfrac12)$ e da $[\eta,\eta^{\dagger}]=1$, usando $[AB,C]=A[B,C]+[A,C]B$:</p>
   $$[H,\eta]=\hbar\omega\,[\eta^{\dagger}\eta,\eta]=\hbar\omega\big(\eta^{\dagger}[\eta,\eta]+[\eta^{\dagger},\eta]\eta\big)=-\hbar\omega\,\eta,$$
   <p>e prendendo l&rsquo;aggiunta si ha l&rsquo;altra. Insieme:</p>
   $$[H,\eta]=-\hbar\omega\,\eta,\qquad[H,\eta^{\dagger}]=+\hbar\omega\,\eta^{\dagger}$$
   <p><b>Queste due righe contengono tutto lo spettro</b>, e la tappa 04 non fa che leggerle. Vale fissare la struttura che hanno, perché è la struttura che ricompare ogni volta che un problema di meccanica quantistica si risolve algebricamente: <i>un operatore il cui commutatore con la hamiltoniana è proporzionale a sé stesso sposta gli autovalori di una quantità fissa.</i> La costante di proporzionalità <b>è</b> il passo. E Dirac lo dice esplicitamente, al paragrafo 36, quando affronta il momento angolare: <i>«possiamo studiare un tale sistema dinamico sulle stesse linee seguite nel paragrafo 34 per l&rsquo;oscillatore armonico»</i>, e pone $\eta=m_{x}-im_{y}$. <i>Non è il momento angolare che fa da modello all&rsquo;oscillatore: è l&rsquo;oscillatore che fa da modello al momento angolare</i>, e in Dirac l&rsquo;ordine è quello.</p>`}
  ]},
  {t:'prosa', title:'Due convenzioni, e il dizionario — questo è il punto in cui si sbaglia un segno', tag:'avvertenza', html:R`
  <p>Sakurai, Ballentine e Griffiths non scrivono $\eta$. Scrivono</p>
  $$a=\sqrt{\frac{m\omega}{2\hbar}}\Big(q+\frac{ip}{m\omega}\Big)=\frac{m\omega q+ip}{\sqrt{2m\hbar\omega}},\qquad a^{\dagger}=\frac{m\omega q-ip}{\sqrt{2m\hbar\omega}},$$
  <p>con la <i>coordinata</i> davanti. Le due scritture non sono la stessa, e non differiscono per una convenzione di gusto: differiscono per una <b>fase</b>, come si vede in una riga —</p>
  $$\frac{m\omega q+ip}{\sqrt{2m\hbar\omega}}=i\,\frac{p-im\omega q}{\sqrt{2m\hbar\omega}}$$
  <p>cioè $a=i\,\eta$. Tutte le relazioni quadratiche sono insensibili a questa fase: $a^{\dagger}a=\eta^{\dagger}\eta$, dunque $H$, $N$ e lo spettro sono gli stessi, e i commutatori con $H$ pure. <b>Ciò che non è insensibile è la fase dei vettori di base e tutto ciò che la contiene.</b> Poiché $|n\rangle\propto(\eta^{\dagger})^{n}|0\rangle$ e $(a^{\dagger})^{n}=(-i)^{n}(\eta^{\dagger})^{n}$, i due libri etichettano lo <i>stesso</i> stato con ket che differiscono per $(-i)^{n}$, e di conseguenza gli <b>elementi di matrice di $q$ e di $p$ cambiano</b>: nella convenzione di Dirac-Picasso la matrice di $q$ risulta immaginaria pura e quella di $p$ reale, in quella di Sakurai è il contrario.</p>
  <p>Picasso dichiara la cosa nel punto esatto in cui morde, al paragrafo 6.2, dopo aver scritto le matrici: <i>«Notare che $q$ è rappresentato da una matrice i cui elementi sono tutti immaginari puri, mentre $p$ è rappresentato da una matrice reale: in diversi testi la situazione è rovesciata… Ciò dipende da una diversa scelta delle fasi dei vettori di base»</i>, e dà la trasformazione che passa da una all&rsquo;altra, $|n\rangle'=(-i)^{n}|n\rangle$. Poi aggiunge l&rsquo;avvertenza operativa, che è il motivo per cui questa sezione sta qui: <i>«Occorre solo fare attenzione a non utilizzare risultati e formule ottenuti in una delle due rappresentazioni in un problema nel quale invece si fa uso dell&rsquo;altra rappresentazione»</i>.</p>
  <p><b>Regola pratica per un esame:</b> si sceglie una convenzione, la si dichiara in una riga, e non si prendono in prestito elementi di matrice da un libro scritto nell&rsquo;altra. Da qui in avanti questo movimento usa $\eta$ nei passaggi che seguono Dirac e Picasso, e $a$ quando cita Ballentine, Sakurai o Shankar — segnalando ogni volta quale sta usando. Lo spettro, le autofunzioni reali e tutte le quantità osservabili sono identici nelle due.</p>`},
  {t:'prosa', title:'L’operatore numero', tag:'costruzione', html:R`
  <p>Conviene dare un nome alla combinazione che compare nella hamiltoniana:</p>
  $$N=\eta^{\dagger}\eta=a^{\dagger}a,\qquad H=\hbar\omega\Big(N+\frac12\Big).$$
  <p>$N$ è <b>autoaggiunto</b>, perché $(\eta^{\dagger}\eta)^{\dagger}=\eta^{\dagger}\eta$, dunque è un&rsquo;osservabile; ed è una funzione lineare di $H$, dunque si diagonalizza simultaneamente a $H$ e non porta informazione nuova. La sua utilità è di <b>levare le dimensioni dal problema</b>: lo <span class="str" data-str="spettro">spettro</span> di $H$ si ottiene da quello di $N$ con una moltiplicazione e una traslazione, e lo spettro di $N$ è una questione di algebra pura.</p>
  <p>I commutatori di $N$ con gli operatori di salita e discesa sono i precedenti divisi per $\hbar\omega$, cioè $[N,\eta]=-\eta$ e $[N,\eta^{\dagger}]=+\eta^{\dagger}$: in questa forma Ballentine li scrive come (6.13) e (6.14) e Sakurai come (2.3.10) e (2.3.11). <b>Il nome «operatore numero» anticipa un risultato che non è ancora stato dimostrato</b> — che i suoi autovalori siano gli interi non negativi — ed è giusto notarlo: il nome è buono proprio perché la tappa seguente lo giustifica. Dirac, che non lo chiama così, lo chiamerà $n$ solo al paragrafo 60, quando quel numero sarà diventato il <i>numero di bosoni</i>.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Perché la fattorizzazione $H=\hbar\omega(\eta^{\dagger}\eta+\tfrac12)$ è «la soluzione» e non solo una riscrittura?`,
    a:R`Perché trasforma un problema di <b>analisi</b> in un problema di <b>algebra</b>. Trovare lo spettro di $p^{2}/2m+m\omega^{2}q^{2}/2$ nella rappresentazione delle coordinate significa risolvere un&rsquo;equazione differenziale del secondo ordine e cercare per quali $E$ la soluzione è normalizzabile; dopo la fattorizzazione significa trovare gli autovalori di un operatore che è un prodotto $\eta^{\dagger}\eta$, cioè — per l&rsquo;argomento della tappa 02 — un operatore <b>non negativo</b>, e di cui si conoscono i commutatori con i due operatori che spostano l&rsquo;autovalore. <i>Le due informazioni insieme — positività e passo fisso — bastano, e la tappa 04 lo mostra in dieci righe senza mai scrivere una derivata.</i> La ragione profonda per cui l&rsquo;oscillatore si fattorizza è che la sua hamiltoniana è quadratica nelle variabili canoniche: è questo, e non la forma del potenziale, che rende il metodo possibile — motivo per cui lo stesso metodo funziona per l&rsquo;elettrone in campo magnetico, dove la hamiltoniana è quadratica negli impulsi canonici, e non funziona per il potenziale coulombiano.`},
   {q:R`Si legge in un libro $a^{\dagger}|n\rangle=\sqrt{n+1}\,|n+1\rangle$ e in un altro, nella notazione di Dirac, la matrice di $q$ con elementi immaginari. Mescolandoli si ottiene un risultato sbagliato: dove, esattamente?`,
    a:R`Nelle fasi relative dei coefficienti. Supponiamo di voler calcolare $\langle x\rangle$ nello stato $|\psi\rangle=(|0\rangle+|1\rangle)/\sqrt2$. Con la convenzione di Sakurai, $q=\sqrt{\hbar/2m\omega}\,(a+a^{\dagger})$ ha elementi di matrice <b>reali</b> e si ottiene $\langle x\rangle=\sqrt{\hbar/2m\omega}$, reale e positivo. Con la convenzione di Dirac-Picasso, $q=-i\sqrt{\hbar/2m\omega}\,(\eta-\eta^{\dagger})$ ha elementi immaginari puri, e lo <i>stesso stato fisico</i> si scrive $(|0\rangle'+i|1\rangle')/\sqrt2$ nella nuova base — perché $|1\rangle'=-i|1\rangle$. Se si prende il vettore da un libro e la matrice dall&rsquo;altro si calcola $\langle\psi|q|\psi\rangle$ con un vettore reale e una matrice immaginaria, <b>e si ottiene un valor medio immaginario per un&rsquo;osservabile autoaggiunta</b> — che è il sintomo inequivocabile dell&rsquo;errore. <i>Il controllo di sanità, in questi conti, è che ogni valor medio di un&rsquo;osservabile venga reale:</i> se non viene, non è il conto che è sbagliato, è la base.`}
  ]}
]},

/* ---------------- 04 · LO SPETTRO ---------------- */
{ num:'04', title:'Lo spettro: una catena che deve finire e una che non può', meta:'la discesa termina perché l energia è positiva · la salita non termina mai · E_n = (n + 1/2) hbar omega e nessun altro · la non degenerazione e la completezza, con l argomento di Dirac',
  blocchi:[
  {t:'prosa', title:'Il meccanismo, in forma nuda', tag:'costruzione', html:R`
  <p>Sia $|E\rangle$ un autovettore di $H$ con autovalore $E$. Dal commutatore $[H,\eta]=-\hbar\omega\,\eta$ segue, in una riga,</p>
  $$H\,\eta|E\rangle=\eta H|E\rangle-\hbar\omega\,\eta|E\rangle=(E-\hbar\omega)\,\eta|E\rangle,$$
  <p>cioè: <b>se $\eta|E\rangle$ non è il vettore nullo, è un autovettore di $H$ con autovalore $E-\hbar\omega$</b>. Per questa proprietà $\eta$ si chiama operatore di discesa. L&rsquo;aggiunta dà l&rsquo;altra metà: $\eta^{\dagger}|E\rangle$, se non è nullo, è autovettore con autovalore $E+\hbar\omega$.</p>
  <p>Si applichi $\eta$ ripetutamente. Si ottiene una catena di autovalori $E$, $E-\hbar\omega$, $E-2\hbar\omega$, … che scende senza limite — <b>e questo è impossibile</b>, perché la tappa 02 ha dimostrato che gli autovalori sono positivi. Picasso lo dice in una frase: <i>«Ma questa catena deve per forza interrompersi ad un certo punto, perché altrimenti finiremmo per trovare autovalori minori di zero, mentre sappiamo che devono essere tutti $\geq\tfrac12\hbar\omega$»</i>. L&rsquo;unico modo in cui una catena di questo tipo si interrompe è che a un certo punto il vettore prodotto sia <i>esattamente nullo</i>. Dunque esiste un autovalore minimo $E_{0}$ con</p>
  $$\eta\,|E_{0}\rangle=0.$$`},
  {t:'reveal', title:'Il valore del fondamentale, e perché la catena verso l’alto non si chiude', tag:'costruzione', steps:[
   {label:'Il fondamentale, in tre righe', body:R`
   <p>Si prenda il valor medio di $\eta^{\dagger}\eta$ sullo stato di energia minima. Da un lato vale zero, perché $\eta|E_{0}\rangle=0$. Dall&rsquo;altro, per la fattorizzazione,</p>
   $$0=\langle E_{0}|\eta^{\dagger}\eta|E_{0}\rangle=\Big(\frac{E_{0}}{\hbar\omega}-\frac12\Big)\langle E_{0}|E_{0}\rangle,$$
   <p>e poiché $\langle E_{0}|E_{0}\rangle\neq0$ si risolve per $E_{0}$:</p>
   $$E_{0}=\frac{\hbar\omega}{2}$$
   <p>Questo <b>chiude la disuguaglianza della tappa 02</b>, che diceva $E_{0}\geq\hbar\omega/2$: il minimo è raggiunto, e dunque tutte le disuguaglianze usate là sono uguaglianze — lo stato fondamentale è di minima indeterminazione, con $\Delta p=m\omega\Delta q$. <i>Nessun conto nuovo è stato fatto per dimostrarlo: il fatto esce dal confronto fra due risultati ottenuti in modi indipendenti</i>, ed è uno dei modi migliori di controllare un conto.</p>`},
   {label:'La salita non si interrompe: l’argomento algebrico', body:R`
   <p>Resta da escludere che la catena ascendente finisca, cioè che esista uno stato $|E\rangle$ con $\eta^{\dagger}|E\rangle=0$. Se ci fosse, calcolandone il valor medio di $\eta\eta^{\dagger}=H/\hbar\omega+1/2$ si avrebbe</p>
   $$0=\langle E|\eta\eta^{\dagger}|E\rangle=\Big(\frac{E}{\hbar\omega}+\frac12\Big)\langle E|E\rangle,$$
   <p>e la parentesi non può annullarsi, perché $E$ è positivo:</p>
   $$\frac{E}{\hbar\omega}+\frac12>0$$
   <p>Assurdo, dunque $\eta^{\dagger}|E\rangle\neq0$ sempre: <b>la catena ascendente non si interrompe mai</b>, e partendo da $|E_{0}\rangle$ si generano tutti gli</p>
   $$E_{n}=\Big(n+\frac12\Big)\hbar\omega,\qquad n=0,1,2,\dots$$
   <p>Manca un pezzo, e Picasso lo chiude con cura: <b>non ci sono altri autovalori</b>. Se esistesse un autovalore $E'$ non della forma sopra, la catena discendente che parte da $E'$ non passerebbe per $\hbar\omega/2$ — lo scavalcherebbe — e non potendo quindi interrompersi arriverebbe a valori negativi. <i>La condizione di terminazione non è «la catena si ferma da qualche parte», è «la catena si ferma esattamente a $\hbar\omega/2$»</i>, e questo è ciò che seleziona i mezzi interi invece di una famiglia continua di spettri traslati.</p>`},
   {label:'Lo stesso fatto, con un argomento diverso: Weinberg', body:R`
   <p>Weinberg chiude la catena ascendente in un altro modo, e vale confrontare le due vie perché le ipotesi sono diverse. Lui lavora nella rappresentazione delle coordinate e osserva che l&rsquo;equazione $a^{\dagger}\psi=0$ si risolve esplicitamente: $(-\hbar\,d/dx+m\omega x)\psi=0$ dà $\psi\propto e^{+m\omega x^{2}/2\hbar}$, e questa funzione <i>esiste</i> ma non è normalizzabile. Nelle sue parole: <i>«there is no wave function $\psi(x_{i})$ for which $a^{\dagger}_{i}\psi$ vanishes, because the solution of the differential equation $a^{\dagger}_{i}\psi=0$ is $\psi\propto\exp(M\omega x_{i}^{2}/2\hbar)$, and this is not normalizable»</i>. La verifica è un integrale divergente:</p>
   $$\int_{-\infty}^{+\infty}e^{+m\omega x^{2}/\hbar}\,dx=\infty$$
   <p><b>La divergenza è il contenuto, non un incidente.</b> Le due vie usano ipotesi diverse: quella di Picasso è puramente algebrica e usa solo la positività dello spettro; quella di Weinberg usa la rappresentazione di Schrödinger e il requisito di normalizzabilità. <i>Dicono la stessa cosa perché sono la stessa cosa</i>, e lo si vede guardando dove la normalizzabilità entra nell&rsquo;argomento algebrico: entra nel passaggio $\langle E|\eta\eta^{\dagger}|E\rangle=\|\eta^{\dagger}|E\rangle\|^{2}$, che è la definizione di norma, e nel fatto che $\langle E|E\rangle$ sia finito e non nullo. La tappa 09 tornerà su questo punto con un&rsquo;osservazione di Ballentine che lo rende esatto.</p>`}
  ]},
  {t:'reveal', title:'I due debiti che Picasso dichiara, e l’argomento di Dirac che li paga', tag:'avvertenza', steps:[
   {label:'Che cosa manca, detto dall’autore stesso', body:R`
   <p>A questo punto Picasso fa una cosa insolita per un manuale: enumera ciò che <i>non</i> ha dimostrato. Primo, la non degenerazione: <i>«Resterebbe da vedere se questi autovalori sono o no degeneri: essi non sono degeneri, ma questo lo dimostreremo più avanti, in un contesto più generale»</i>. Secondo, la completezza, e qui il tono è quasi di confessione: <i>«Sarebbe anche essenziale a questo punto dimostrare che gli $|E_{n}\rangle$ costituiscono un insieme completo: ciò costituirebbe una verifica della coerenza interna della teoria… Ma, anche se non lo dimostriamo e nemmeno ci soffermiamo a dire di preciso cosa si dovrebbe dimostrare, gli $|E_{n}\rangle$ costituiscono un insieme completo e quindi, almeno per ora, tutto va liscio»</i>.</p>
   <p>Vale capire perché i due buchi importano. Se ci fosse un&rsquo;altra copia dello stato fondamentale — un secondo vettore annullato da $\eta$ e indipendente dal primo — l&rsquo;intera torre si duplicherebbe e ogni livello sarebbe doppio. E se i vettori costruiti non fossero completi, ci sarebbero stati del sistema che non si possono scrivere come sovrapposizioni di autostati dell&rsquo;energia, cioè <b>$H$ non sarebbe un&rsquo;osservabile</b> nel senso dei postulati, e a cadere non sarebbe un dettaglio tecnico ma il postulato di quantizzazione.</p>`},
   {label:'L’argomento di Dirac, che è di tre righe', body:R`
   <p>Dirac, nello stesso paragrafo 34, dà entrambi gli argomenti. Costruisce i ket $\bar\eta^{\,n}|0\rangle$ e poi osserva: <i>«Dunque l&rsquo;insieme dei ket [34.14] è tale che $\eta$ o $\bar\eta$ applicato a uno qualunque di tali ket dà un ket dipendente dall&rsquo;insieme. Ora tutte le variabili dinamiche che compaiono nel nostro problema sono esprimibili in funzione di $\bar\eta$ e di $\eta$, cosicché i ket [34.14] devono formare un insieme completo (altrimenti esisterebbe qualche altra variabile dinamica)»</i>.</p>
   <p><b>La struttura logica è questa</b>, e conviene isolarla perché è un tipo di argomento che si riusa. Il sottospazio generato dai ket $(\eta^{\dagger})^{n}|0\rangle$ è <i>invariante</i> sotto l&rsquo;azione di $\eta$ e di $\eta^{\dagger}$, dunque sotto l&rsquo;azione di qualunque funzione di $\eta$ e $\eta^{\dagger}$ — e poiché $q$ e $p$ sono funzioni lineari di $\eta$ e $\eta^{\dagger}$, sotto l&rsquo;azione di ogni variabile dinamica del problema. Se quel sottospazio non fosse tutto lo spazio, il complemento sarebbe anch&rsquo;esso invariante, e nessuna osservabile del sistema potrebbe trasportare uno stato da una parte all&rsquo;altra: <i>i due settori sarebbero fisicamente scollegati</i>, e descrivere il sistema richiederebbe un&rsquo;osservabile in più — un&rsquo;etichetta che distingue i settori — che per ipotesi non c&rsquo;è, perché le variabili dinamiche sono $q$ e $p$ e basta.</p>
   <p>Da qui la non degenerazione segue immediatamente: <i>«per ciascun autovalore [34.12] di $H$ esiste uno solo di tali ket, cosicché $H$ da sola forma un insieme completo di osservabili che commutano»</i>. Un insieme completo di osservabili che commutano ha, per definizione, autovettori simultanei individuati univocamente dai loro autovalori. <b>Se $H$ da sola basta, non c&rsquo;è spazio per una degenerazione.</b></p>
   <p><i>Cucire qui i due testi non è un&rsquo;aggiunta erudita:</i> la fonte portante dichiara un debito e la voce fondativa lo paga, e chi legge solo Picasso esce dal capitolo con due risultati usati e non dimostrati, che un orale può chiedere.</p>`}
  ]},
  {t:'plot', title:'La scala dei livelli, e la pendenza che non c’è',
   intro:R`<p>La parabola del potenziale con i primi sette livelli, equispaziati di $\hbar\omega$, nelle unità $m=\omega=\hbar=1$ — dove $V(x)=x^{2}/2$ e $E_{n}=n+1/2$. Si noti dove i livelli incontrano la parabola: quelli sono i punti di inversione classici, e la larghezza della regione classicamente permessa cresce come $\sqrt{E_{n}}$.</p>`,
   plots:[{kind:'func2d', xr:[-4.5,4.5], yr:[-0.3,7.5], height:380, ticks:true,
     title:'V(x) = x^2 / 2 e i livelli E_n = n + 1/2',
     curves:[{f:'x*x/2', col:'#6f7a90', width:2.6, label:'V(x)'},
             {f:'(Math.abs(x)<1.0)?0.5:0/0', col:'#5aa9ff', width:2.2, label:'n = 0'},
             {f:'(Math.abs(x)<1.732)?1.5:0/0', col:'#5aa9ff', width:2.2, label:'n = 1'},
             {f:'(Math.abs(x)<2.236)?2.5:0/0', col:'#9b8cff', width:2.2, label:'n = 2'},
             {f:'(Math.abs(x)<2.646)?3.5:0/0', col:'#9b8cff', width:2.2, label:'n = 3'},
             {f:'(Math.abs(x)<3.0)?4.5:0/0', col:'#ffb86b', width:2.2, label:'n = 4'},
             {f:'(Math.abs(x)<3.317)?5.5:0/0', col:'#ffb86b', width:2.2, label:'n = 5'},
             {f:'(Math.abs(x)<3.606)?6.5:0/0', col:'#ff6b8a', width:2.2, label:'n = 6'}],
     xlabel:'x', ylabel:'E'}],
   leggi:R`<p><b>Che cosa guardare.</b> I livelli sono <i>esattamente</i> equidistanti, e la loro distanza non dipende da $n$: è $\hbar\omega$ sempre, dal fondamentale all&rsquo;infinito. Il più basso non poggia sul fondo della buca ma sta a $\hbar\omega/2$ sopra, e questa è la quantità che il commutatore ha lasciato nella fattorizzazione. L&rsquo;ampiezza classica cresce come $\sqrt{2E_{n}}$, cioè come $\sqrt{2n+1}$ — lentamente.</p>
   <p><b>Che cosa impararne.</b> L&rsquo;equidistanza è <i>il</i> fatto distintivo dell&rsquo;oscillatore, e distingue questo spettro da tutti gli altri del corso: nel segmento i livelli vanno come $n^{2}$ e si diradano, nell&rsquo;atomo di idrogeno come $-1/n^{2}$ e si infittiscono verso la soglia. L&rsquo;equidistanza ha una conseguenza che la tappa 14 userà per intero: <i>un sistema di livelli equidistanti si può leggere come un numero variabile di oggetti identici di energia $\hbar\omega$ ciascuno</i>, invece che come un singolo oggetto in stati diversi. È l&rsquo;unico spettro per cui la lettura «$n$ quanti» ha senso, e per questo è l&rsquo;unico che si presti a descrivere un campo. <b>E spiega anche la regola di selezione</b>: se tutte le transizioni cambiano $n$ di uno — come la tappa 07 dimostrerà — allora un oscillatore carico emette e assorbe a <i>una sola</i> frequenza, $\omega$, qualunque sia il livello di partenza. Il suo spettro di emissione è una riga, non una serie.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`L&rsquo;argomento usa due volte la frase «se il vettore non è nullo». Che cosa andrebbe storto se non la si dicesse?`,
    a:R`Si proverebbe troppo, e il risultato sarebbe falso. Il commutatore $[H,\eta]=-\hbar\omega\eta$ implica $H\eta|E\rangle=(E-\hbar\omega)\eta|E\rangle$ <i>come identità vettoriale</i>, e quell&rsquo;identità è soddisfatta banalmente dal vettore nullo — che non è un autovettore, perché per definizione un autovettore è non nullo. Senza la clausola si concluderebbe che <b>ogni</b> $E-k\hbar\omega$ è autovalore per ogni $k$ intero, compresi i negativi, in contraddizione con la tappa 02. <i>La clausola non è una cautela formale: è esattamente il punto in cui la catena si interrompe</i>, ed è il meccanismo che produce il valore del fondamentale. La stessa struttura logica regge il calcolo dello spettro del momento angolare, dove i due vettori nulli — in cima e in fondo — danno le due estremità della torre: lì la catena si chiude da entrambi i lati, qui da uno solo, e la differenza è che $N$ è limitato inferiormente ma non superiormente.`},
   {q:R`Si supponga di <i>non</i> sapere che gli autovalori di $H$ sono positivi. Che spettri sarebbero compatibili con i soli commutatori?`,
    a:R`Una famiglia continua di torri bi-infinite. I commutatori $[H,\eta]=-\hbar\omega\eta$ dicono soltanto che gli autovalori stanno su un reticolo di passo $\hbar\omega$; senza un limite inferiore, ogni valore $E_{0}'$ reale genererebbe uno spettro $\{E_{0}'+k\hbar\omega,\ k\in\mathbb Z\}$, illimitato nei due versi, e ci sarebbe uno spettro ammissibile per ogni $E_{0}'$ nell&rsquo;intervallo $[0,\hbar\omega)$. <b>È la positività — cioè la struttura $\eta^{\dagger}\eta$, cioè in ultima analisi l&rsquo;autoaggiuntezza di $p$ e $q$ — che seleziona una torre sola e la fissa dove sta.</b> Non è un caso di scuola: esistono sistemi fisici in cui un&rsquo;algebra dello stesso tipo ha rappresentazioni con spettro bi-infinito, e ciò che le esclude per l&rsquo;oscillatore è il segno dell&rsquo;energia, non l&rsquo;algebra. <i>Conviene ricordarlo come regola: in un conto algebrico, lo spettro lo decidono i commutatori più una condizione di positività o di limitatezza, e omettere la seconda è il modo standard di sbagliare questo tipo di problema.</i>`}
  ]}
]},

/* ---------------- 05 · NORMALIZZAZIONE ED ELEMENTI DI MATRICE ---------------- */
{ num:'05', title:'Normalizzare la torre: un commutatore per induzione e i fattoriali', meta:'il commutatore di eta con la potenza n-esima · i fattoriali che compaiono · i coefficienti radice di n · gli elementi di matrice di q e p',
  blocchi:[
  {t:'prosa', title:'Il problema: i vettori costruiti non sono normalizzati', tag:'costruzione', html:R`
  <p>La tappa 04 ha costruito la torre applicando ripetutamente $\eta^{\dagger}$ al fondamentale: scritto alla grezza, $|n\rangle=(\eta^{\dagger})^{n}|0\rangle$. Picasso lo segnala subito: <i>«Ma i vettori così ottenuti non sono normalizzati»</i>. Non è una pedanteria, perché le probabilità si leggono dai moduli quadri dei coefficienti e un fattore sbagliato le falsa; e perché i coefficienti che compaiono normalizzando sono <b>esattamente</b> i $\sqrt n$ che rendono utilizzabili gli operatori di salita e discesa nei conti.</p>
  <p>Per normalizzare serve $\langle0|\eta^{n}(\eta^{\dagger})^{n}|0\rangle$. Il modo di calcolarlo è portare tutti gli $\eta$ a destra, dove incontrano $|0\rangle$ e lo annullano. Serve dunque sapere che cosa accade quando $\eta$ attraversa una potenza di $\eta^{\dagger}$, ed è un commutatore che si dimostra per induzione.</p>`},
  {t:'reveal', title:'Il commutatore, i fattoriali, i coefficienti', tag:'costruzione', steps:[
   {label:'L’induzione', body:R`
   <p>L&rsquo;asserto è l&rsquo;equazione (5.17) di Picasso:</p>
   $$[\eta,(\eta^{\dagger})^{n}]=n\,(\eta^{\dagger})^{n-1}$$
   <p>Per $n=1$ è la relazione fondamentale $[\eta,\eta^{\dagger}]=1$. Supponendola vera per $n-1$, si spezza la potenza e si usa $[A,BC]=B[A,C]+[A,B]C$:</p>
   $$[\eta,(\eta^{\dagger})^{n}]=\big[\eta,\eta^{\dagger}(\eta^{\dagger})^{n-1}\big]=\eta^{\dagger}\big[\eta,(\eta^{\dagger})^{n-1}\big]+[\eta,\eta^{\dagger}](\eta^{\dagger})^{n-1}=(n-1)(\eta^{\dagger})^{n-1}+(\eta^{\dagger})^{n-1},$$
   <p>che è $n(\eta^{\dagger})^{n-1}$. <b>Vale la pena notare la forma del risultato</b>: è la regola di derivazione della potenza, $d(x^{n})/dx=nx^{n-1}$, con $\eta$ nel ruolo di $d/d\eta^{\dagger}$. Non è una coincidenza — da $[\eta,\eta^{\dagger}]=1$ segue che $\eta$ agisce sui polinomi in $\eta^{\dagger}$ esattamente come una derivata, ed è questa osservazione che Dirac trasforma nella rappresentazione di Fock di cui la tappa 09 parlerà.</p>`},
   {label:'Il fattoriale', body:R`
   <p>Si calcoli allora $\langle0|\eta^{n}(\eta^{\dagger})^{n}|0\rangle$. Il primo $\eta$ da sinistra si fa attraversare la potenza: poiché $\eta|0\rangle=0$, il termine in cui $\eta$ arriva fino al ket svanisce e resta solo il commutatore,</p>
   $$\langle0|\eta^{n-1}\,\eta(\eta^{\dagger})^{n}|0\rangle=\langle0|\eta^{n-1}\big[\eta,(\eta^{\dagger})^{n}\big]|0\rangle=n\,\langle0|\eta^{n-1}(\eta^{\dagger})^{n-1}|0\rangle.$$
   <p>Ripetendo $n$ volte si cala l&rsquo;esponente fino a zero e si raccoglie un fattore per volta:</p>
   $$\langle0|\eta^{n}(\eta^{\dagger})^{n}|0\rangle=n!\,\langle0|0\rangle=n!.$$
   <p>I casi $n=3$ e $n=4$ si possono verificare per via indipendente, usando le matrici troncate di $\eta$ e $\eta^{\dagger}$ che la tappa 06 scrive — e tornano:</p>
   $$\langle0|\eta^{3}(\eta^{\dagger})^{3}|0\rangle=3!=6$$
   $$\langle0|\eta^{4}(\eta^{\dagger})^{4}|0\rangle=4!=24$$
   <p>Dunque i vettori normalizzati sono, nella (5.18) di Picasso e nella (6.17) di Ballentine,</p>
   $$|n\rangle=\frac{1}{\sqrt{n!}}\,(\eta^{\dagger})^{n}|0\rangle.$$`},
   {label:'I coefficienti, e perché sono quelli', body:R`
   <p>Da qui si leggono le due relazioni che si usano in ogni conto. Da $|n\rangle=(\eta^{\dagger})^{n}|0\rangle/\sqrt{n!}$ segue $\eta^{\dagger}|n\rangle=\sqrt{(n+1)!}\,|n+1\rangle/\sqrt{n!}$, cioè</p>
   $$\eta^{\dagger}|n\rangle=\sqrt{n+1}\,|n+1\rangle,\qquad \eta|n\rangle=\sqrt{n}\,|n-1\rangle,\qquad \eta|0\rangle=0,$$
   <p>e la seconda si ottiene dalla prima prendendo l&rsquo;aggiunta, oppure direttamente: $\eta|n\rangle$ è proporzionale a $|n-1\rangle$ e la costante si fissa con la norma, $\|\eta|n\rangle\|^{2}=\langle n|\eta^{\dagger}\eta|n\rangle=\langle n|N|n\rangle=n$.</p>
   <p><b>C&rsquo;è una scelta nascosta qui, e i libri la dichiarano.</b> La norma fissa il <i>modulo</i> del coefficiente, non la sua fase: Ballentine lo scrive esplicitamente — <i>«the phase of the vector $|n+1\rangle$ is arbitrary because the vector is only defined by (6.15). Thus we are free to choose its phase so that $C_{n}$ is real and positive»</i>. È la stessa libertà che la tappa 03 ha incontrato come differenza fra le due convenzioni: <i>la convenzione $C_{n}>0$ fissa le fasi relative dei vettori di base, e con ciò decide se la matrice di $q$ risulta reale o immaginaria.</i></p>
   <p>In particolare, l&rsquo;operatore numero è diagonale e porta sulla diagonale proprio gli indici:</p>
   $$N=\eta^{\dagger}\eta=\mathrm{diag}(0,1,2,3,4,\dots)$$
   <p>che è il motivo del nome, e la giustificazione retrospettiva di averlo chiamato così nella tappa 03.</p>`},
   {label:'Gli elementi di matrice di q e p', body:R`
   <p>Invertendo le definizioni della tappa 03 si esprimono le osservabili in termini degli operatori di salita e discesa. Nella convenzione di Dirac-Picasso,</p>
   $$q=-i\sqrt{\frac{\hbar}{2m\omega}}\,\big(\eta-\eta^{\dagger}\big),\qquad p=\sqrt{\frac{m\hbar\omega}{2}}\,\big(\eta+\eta^{\dagger}\big),$$
   <p>mentre nella convenzione di Sakurai-Ballentine le stesse osservabili si scrivono $q=\sqrt{\hbar/2m\omega}\,(a+a^{\dagger})$ e $p=i\sqrt{m\hbar\omega/2}\,(a^{\dagger}-a)$ — le due differiscono esattamente per il fattore $i$ della tappa 03. Con i coefficienti appena trovati si leggono tutti gli elementi di matrice. Sakurai li scrive come (2.3.25a-b):</p>
   $$\langle n'|q|n\rangle\propto\sqrt{n}\,\delta_{n',n-1}+\sqrt{n+1}\,\delta_{n',n+1},$$
   <p>e per esempio, nella convenzione di Dirac-Picasso e con l&rsquo;indice che parte da zero,</p>
   $$q_{23}=i\sqrt{\frac{3\hbar}{2m\omega}}$$
   <p><b>La struttura è la cosa da ricordare, non i prefattori:</b> $q$ e $p$ hanno elementi di matrice <i>solo</i> fra livelli adiacenti. Sakurai lo commenta — <i>«neither $x$ nor $p$ is diagonal in the $N$-representation we are using. This is not surprising because $x$ and $p$, like $a$ and $a^{\dagger}$, do not commute with $N$»</i> — ma la conseguenza fisica è più grossa dell&rsquo;osservazione: poiché l&rsquo;intensità delle transizioni radiative di un dipolo è governata dagli elementi di matrice della coordinata, <i>un oscillatore carico può cambiare il suo stato solo di un livello per volta</i>. È la regola di selezione $\Delta n=\pm1$, e la tappa 07 la ritrova per un&rsquo;altra strada, che è quella da cui storicamente è venuta.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Si calcoli $\langle n|q^{2}|n\rangle$ usando solo gli operatori di salita e discesa, senza integrali.`,
    a:R`Si scrive $q^{2}=-\dfrac{\hbar}{2m\omega}(\eta-\eta^{\dagger})^{2}=-\dfrac{\hbar}{2m\omega}\big(\eta^{2}+(\eta^{\dagger})^{2}-\eta\eta^{\dagger}-\eta^{\dagger}\eta\big)$. Nel valor medio su $|n\rangle$ i due primi termini <b>non contribuiscono</b>, perché $\eta^{2}|n\rangle\propto|n-2\rangle$ è ortogonale a $|n\rangle$ — ed è questo il meccanismo che rende il conto algebrico più rapido dell&rsquo;integrale. Restano $\langle\eta\eta^{\dagger}\rangle=n+1$ e $\langle\eta^{\dagger}\eta\rangle=n$, con il segno meno davanti che li rende positivi: $\langle n|q^{2}|n\rangle=\dfrac{\hbar}{2m\omega}(2n+1)$. <i>Lo stesso valore che la tappa 07 ricava sommando i quadrati di due elementi di matrice e la tappa 08 ottiene con un integrale gaussiano</i> — tre vie, un numero. E la dipendenza $2n+1$ è ciò che rende $\Delta x\,\Delta p=(n+\tfrac12)\hbar$, cioè la minima indeterminazione solo per $n=0$: <b>Sakurai lo registra come (2.3.40) e lascia la verifica al lettore</b>, ed è il conto appena fatto.`},
   {q:R`La relazione $[\eta,(\eta^{\dagger})^{n}]=n(\eta^{\dagger})^{n-1}$ somiglia a una derivata. Quanto è letterale questa somiglianza?`,
    a:R`È letterale, ed è una rappresentazione concreta dell&rsquo;algebra. Si identifichi lo stato $|\psi\rangle=\sum_{n}c_{n}|n\rangle$ con la funzione $f(\zeta)=\sum_{n}c_{n}\zeta^{n}/\sqrt{n!}$ di una variabile complessa $\zeta$: allora $\eta^{\dagger}$ agisce come la <b>moltiplicazione</b> per $\zeta$ e $\eta$ come la <b>derivata</b> $d/d\zeta$, e il commutatore $[d/d\zeta,\zeta]=1$ riproduce $[\eta,\eta^{\dagger}]=1$ esattamente. <i>Questa è la rappresentazione di Fock</i>, e Dirac la introduce in queste parole: <i>«Possiamo considerare il ket $|0\rangle$ come un ket standard, e la serie di potenze in $\eta$ come una funzione d&rsquo;onda… Tale tipo di funzione d&rsquo;onda differisce da quello solito in quanto è una funzione della variabile dinamica complessa $\bar\eta$ invece che di osservabili. Tale tipo di funzione d&rsquo;onda fu introdotto per la prima volta da V. Fock»</i>. <b>È una rappresentazione in cui la funzione d&rsquo;onda non vive sulla retta reale ma sul piano complesso</b>, e in cui l&rsquo;oscillatore diventa il problema più semplice che ci sia: la hamiltoniana è $\hbar\omega(\zeta\,d/d\zeta+\tfrac12)$ e i suoi autovettori sono i monomi. La tappa 12 incontrerà il piano complesso $\zeta$ di nuovo, ed etichetterà i suoi punti con gli stati coerenti.`}
  ]}
]},

/* ---------------- 06 · LE MATRICI, E PERCHE' LO SPAZIO DEVE ESSERE INFINITO ---------------- */
{ num:'06', title:'Le matrici di Heisenberg, e la traccia che dimostra l infinito', meta:'la rappresentazione in cui H è diagonale · le matrici di q e p scritte per esteso · il paradosso della traccia · cosa succede troncando, e dove esattamente si rompe',
  blocchi:[
  {t:'prosa', title:'Che cos’è «la rappresentazione di Heisenberg»', tag:'costruzione', html:R`
  <p>Picasso dà la definizione: <i>«Si dà il nome di rappresentazione di Heisenberg ad ogni rappresentazione in cui la hamiltoniana è diagonale»</i>. Per l&rsquo;oscillatore la hamiltoniana è non degenere — cosa che la tappa 04 ha stabilito con l&rsquo;argomento di Dirac — dunque la base è individuata a meno delle fasi, e le fasi le fissa la scelta $C_{n}>0$ della tappa 05.</p>
  <p>In questa base $H$ e $N$ sono diagonali e non c&rsquo;è niente da dire. Interessanti sono $q$ e $p$, che non commutano con $N$ e quindi non sono diagonali, e che si scrivono per esteso dai coefficienti della tappa 05. Nella convenzione di Dirac-Picasso, troncando alle prime cinque righe e colonne:</p>
  $$q=i\sqrt{\frac{\hbar}{2m\omega}}\begin{pmatrix}0&1&0&0&0\\-1&0&\sqrt2&0&0\\0&-\sqrt2&0&\sqrt3&0\\0&0&-\sqrt3&0&2\\0&0&0&-2&0\end{pmatrix},\qquad p=\sqrt{\frac{m\hbar\omega}{2}}\begin{pmatrix}0&1&0&0&0\\1&0&\sqrt2&0&0\\0&\sqrt2&0&\sqrt3&0\\0&0&\sqrt3&0&2\\0&0&0&2&0\end{pmatrix}.$$
  <p>Sono le (6.6) e (6.7) di Picasso e la (6.35) di Ballentine — con la differenza di fase già dichiarata nella tappa 03: <b>$q$ ha elementi immaginari puri e $p$ reali</b>, e in Sakurai e Ballentine la situazione è rovesciata. Ciascuna delle due matrici ha i soli elementi adiacenti alla diagonale diversi da zero; quella di $q$ è antisimmetrica e immaginaria (dunque hermitiana), quella di $p$ è simmetrica e reale (dunque hermitiana). Entrambe sono osservabili, come devono.</p>`},
  {t:'reveal', title:'Le verifiche, e il paradosso che salta fuori facendole', tag:'costruzione', steps:[
   {label:'Che le matrici siano giuste si controlla, non si crede', body:R`
   <p>Picasso dichiara due verifiche e le lascia al lettore: <i>«È immediato verificare che le (6.6) e (6.7) soddisfano la regola di commutazione (5.2)… Sostituendo poi nella (5.1) le matrici (6.6) e (6.7) si ritrova $H$ in forma diagonale, con gli autovalori $E_{n}=(n+1/2)\hbar\omega$ sulla diagonale»</i>. Facendole sulle matrici troncate $5\times5$ si ottiene qualcosa di più interessante di una conferma.</p>
   <p><b>La hamiltoniana.</b> Sostituendo le matrici troncate in $H=p^{2}/2m+m\omega^{2}q^{2}/2$:</p>
   $$H_{5\times5}=\hbar\omega\,\mathrm{diag}\Big(\tfrac12,\tfrac32,\tfrac52,\tfrac72,2\Big)$$
   <p>Le prime <b>quattro</b> entrate sono esattamente $E_{0},E_{1},E_{2},E_{3}$; la quinta dovrebbe essere $\tfrac92\hbar\omega$ e vale $2\hbar\omega$. <i>Il troncamento sbaglia soltanto l&rsquo;ultimo livello</i>, e sbaglia perché l&rsquo;operatore di salita applicato all&rsquo;ultimo stato della base troncata dovrebbe portare fuori dalla base, e invece viene posto a zero. Fuori dalla diagonale la matrice è nulla: <b>la diagonalità di $H$ è esatta anche nel troncato</b>, e questo è un controllo non banale sulle due matrici.</p>`},
   {label:'Il commutatore troncato, e dove si rompe', body:R`
   <p>La seconda verifica è quella che apre il problema. Calcolando $qp-pq$ sulle matrici troncate:</p>
   $$[q,p]_{5\times5}=i\hbar\,\mathrm{diag}(1,1,1,1,-4)$$
   <p>cioè: la regola di commutazione canonica <b>vale esattamente nelle prime quattro entrate e si rompe nell&rsquo;ultima</b>, dove invece di $+1$ compare $-4$. E il motivo per cui compare proprio $-4$ è che la somma debba fare zero:</p>
   $$\mathrm{Tr}\,[q,p]_{5\times5}=0$$
   <p>Questo non è un accidente del troncamento a cinque: è un teorema. Per matrici di dimensione finita la <span class="str" data-str="traccia">traccia</span> di un prodotto è simmetrica, $\mathrm{Tr}(AB)=\mathrm{Tr}(BA)$, dunque la traccia di <i>ogni</i> commutatore è nulla. È il Problema 6.3(a) di Ballentine, enunciato proprio così: <i>«For finite-dimensional matrices $A$ and $B$, show that $\mathrm{Tr}[A,B]=0$»</i>.</p>`},
   {label:'Il paradosso, e la conclusione che se ne trae', body:R`
   <p>Ballentine chiama il passo successivo <i>Paradox</i>, ed è una buona scelta di parola: <i>«From this result it would seem to follow, by taking the trace of the commutator $[Q,P]=i\hbar$, that one must have $\hbar=0$»</i>. L&rsquo;argomento è di due righe. Se lo <span class="str" data-str="spazio-di-hilbert">spazio di Hilbert</span> avesse dimensione finita $N$, prendendo la traccia dei due membri di $i\hbar\,\mathbb 1=[q,p]$ si avrebbe</p>
   $$iN\hbar=\mathrm{Tr}(qp)-\mathrm{Tr}(pq)=0,$$
   <p>e poiché $N\neq0$ seguirebbe $\hbar=0$. Picasso dà esattamente lo stesso conto al paragrafo 6.1, con la conclusione:</p>
   <p><b>Non c&rsquo;è paradosso: c&rsquo;è un teorema di non esistenza.</b> <i>Non esistono matrici di dimensione finita che soddisfino $[q,p]=i\hbar$.</i> Dunque, per operatori che obbediscono alle regole di commutazione canoniche, <i>«necessariamente la dimensione di $\mathcal H$ deve essere infinita»</i>. Picasso annota fra parentesi come la contraddizione si dissolve nel caso infinito: la traccia del commutatore diventa $\infty-\infty$, cioè una forma indeterminata, e un&rsquo;identità fra operatori non si può più testare prendendone la traccia.</p>
   <p>Il troncamento appena fatto <b>fa vedere il meccanismo invece di enunciarlo</b>, e questa è la ragione per cui vale la pena scriverlo. La relazione canonica non si rompe «un po' da tutte le parti»: si rompe <i>in un punto solo</i>, l&rsquo;ultimo stato della base, e si rompe esattamente di quanto serve a far tornare la traccia. Aumentando la dimensione il guasto si sposta sempre più in alto senza mai sparire, e il $-N+1$ dell&rsquo;ultimo elemento diventa sempre più grande: <i>il limite di dimensione infinita non è un&rsquo;approssimazione sempre migliore, è un salto</i>. Ballentine chiede proprio questo nel Problema 6.3(b) — <i>«use the infinite-dimensional matrices for $Q$ and $P$… to calculate the matrices $QP$ and $PQ$, and hence explain in detail why the paradoxical conclusion $\hbar=0$ is not valid»</i>.</p>`}
  ]},
  {t:'prosa', title:'Che cosa questo dimostra, al di là del caso', tag:'architettura', html:R`
  <p>Picasso trae dalle matrici due conclusioni che vanno oltre l&rsquo;oscillatore, e vale enumerarle perché sono di quelle che un orale chiede sotto forma di «perché serve una rappresentazione esplicita».</p>
  <p><b>Primo: l&rsquo;insieme degli operatori che soddisfano $[q,p]=i\hbar$ non è vuoto.</b> È una questione di coerenza, non di gusto: il postulato di quantizzazione <i>pretende</i> l&rsquo;esistenza di operatori con quelle proprietà, e un postulato che chiedesse qualcosa di impossibile non sarebbe un postulato. Le matrici dell&rsquo;oscillatore sono un esempio esplicito, e dunque una dimostrazione di non vacuità.</p>
  <p><b>Secondo, e più forte: la discussione della tappa 04 era condizionata.</b> Tutto l&rsquo;argomento delle catene partiva da «sia $|E\rangle$ un autovettore di $H$» — cioè <i>assumeva che $H$ ne avesse almeno uno</i>. Un&rsquo;ipotesi innocua in apparenza, ma non dimostrata. Picasso lo dice: <i>«la discussione del capitolo 5 sull&rsquo;oscillatore armonico era basata sull&rsquo;ipotesi che $H$ avesse almeno un autovettore: quindi l&rsquo;esistenza di una rappresentazione concreta che riproduce i risultati trovati sotto questa ipotesi per via astratta nel capitolo 5 è qualcosa di più di una verifica, costituisce piuttosto una dimostrazione di esistenza»</i>.</p>
  <p><i>È la distinzione fra «se esiste, è così» e «esiste, ed è così»</i>, e il secondo enunciato richiede di esibire qualcosa. Le matrici lo esibiscono.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Si considerino le matrici troncate come un sistema fisico vero — un oscillatore con $N$ livelli e non più. Che cosa va storto, fisicamente?`,
    a:R`Va storto il livello più alto, e con lui una cosa concettuale. Nel modello troncato l&rsquo;operatore di salita annichila lo stato più alto, cioè <b>esiste un&rsquo;energia massima</b>: il sistema non può assorbire più di $(N-1)\hbar\omega$. Non è una patologia matematica, è un sistema fisico diverso — ed esiste: un sistema a due livelli è il troncamento a $N=2$, e la sua algebra è quella delle matrici di Pauli, non quella dell&rsquo;oscillatore. <i>Il punto è che le due algebre non sono approssimazioni l&rsquo;una dell&rsquo;altra:</i> $[q,p]=i\hbar$ richiede uno spazio infinito e $[\sigma_{x},\sigma_{y}]=2i\sigma_{z}$ vive in due dimensioni, e nessun limite porta dalla seconda alla prima. <b>Nei conti pratici, però, il troncamento è lo strumento standard</b>: un calcolo numerico sull&rsquo;oscillatore si fa su matrici finite, e le prime quattro energie della matrice $5\times5$ scritta qui sopra sono <i>esatte</i>. La regola operativa è quella che il conto suggerisce: con una base troncata a $N$ livelli, si fidano i risultati sui livelli ben più bassi di $N$, e si scartano quelli vicini al taglio.`},
   {q:R`Il paradosso della traccia prova che lo spazio è infinito-dimensionale. Perché allora nello spazio dei fotoni — dove la tappa 14 userà la stessa algebra — nessuno si preoccupa?`,
    a:R`Perché non c&rsquo;è niente da preoccuparsi: lo spazio di un singolo modo del campo elettromagnetico <b>è</b> infinito-dimensionale, e per la ragione fisica più semplice possibile — <i>in un modo si possono mettere quanti fotoni si vuole</i>. Lo spazio ha una base $\{|0\rangle,|1\rangle,|2\rangle,\dots\}$ con un vettore per ogni intero non negativo, e la torre non si chiude in cima esattamente come nella tappa 04. <b>Il teorema di non esistenza, letto in questa direzione, diventa un&rsquo;informazione fisica:</b> l&rsquo;esistenza di operatori canonicamente coniugati obbliga il sistema ad avere infiniti stati, e nel linguaggio del campo significa che non c&rsquo;è un numero massimo di fotoni per modo. <i>Confrontato con i fermioni il contrasto è istruttivo</i>: lì il numero di occupazione per stato è zero o uno, lo spazio di un modo è bidimensionale, e infatti l&rsquo;algebra non è quella dei commutatori ma quella degli anticommutatori — che su uno spazio finito è perfettamente consistente.`}
  ]}
]},

/* ---------------- 07 · COME LO FECE HEISENBERG NEL 1925 ---------------- */
{ num:'07', title:'Heisenberg 1925: lo stesso spettro, con una condizione quantica diversa', meta:'le equazioni del moto in forma matriciale danno la regola di selezione · la progressione aritmetica dei quadrati · la regola di somma di Thomas-Kuhn, che non è [q,p] = i hbar · lo spettro dai soli elementi di matrice',
  blocchi:[
  {t:'prosa', title:'Perché rifare un conto già fatto', tag:'architettura', html:R`
  <p>Landau risolve l&rsquo;oscillatore col metodo matriciale e mette in nota la ragione: <i>«Determiniamo i livelli energetici dell&rsquo;oscillatore mediante il metodo matriciale. Ciò è stato fatto da Heisenberg nel 1925 prima che Schrödinger scoprisse l&rsquo;equazione d&rsquo;onda»</i>. Non è un omaggio storico messo in nota per decoro: <b>è il conto che ha fondato la meccanica quantistica</b>, ed è l&rsquo;unico problema non banale che la meccanica delle matrici sapesse risolvere esattamente il giorno in cui è nata.</p>
  <p>E rifarlo serve a due cose precise. La prima è che il metodo è diverso: non si postula un operatore astratto e non si cerca un autovettore, si <b>cercano direttamente gli elementi di matrice della coordinata</b>, trattandoli come le incognite del problema. La seconda è che la condizione quantica che Heisenberg usò <i>non era</i> $[q,p]=i\hbar$ — quella relazione non esisteva ancora — e vedere quale fosse mostra quanto fosse stretto il sentiero.</p>`},
  {t:'reveal', title:'Il conto di Landau, passo per passo', tag:'costruzione', steps:[
   {label:'Le equazioni del moto in forma matriciale, e la regola di selezione', body:R`
   <p>Si parte dall&rsquo;equazione classica del moto, $\ddot x=-\omega^{2}x$, letta come relazione fra matrici. Nello schema di Heisenberg ogni elemento di matrice di un&rsquo;osservabile oscilla alla frequenza della transizione corrispondente, $x_{mn}\propto e^{i\omega_{mn}t}$ con $\omega_{mn}=(E_{m}-E_{n})/\hbar$, e quindi derivando due volte</p>
   $$(\ddot x)_{mn}=-\omega_{mn}^{2}\,x_{mn}=-\omega^{2}x_{mn}.$$
   <p><b>Questa è un&rsquo;equazione per ciascun elemento separatamente</b>, e dice: <i>o l&rsquo;elemento è nullo, o la sua frequenza vale $\pm\omega$</i>. Landau la legge così: <i>«Da qui risulta che tutti gli elementi di matrice $x_{mn}$ sono nulli, tranne quelli per cui $\omega_{mn}=\pm\omega$»</i>. Si numerano allora gli stati stazionari in modo che le frequenze $\pm\omega$ corrispondano alle transizioni $n\to n\pm1$, e si conclude che <b>i soli elementi non nulli sono $x_{n,n\pm1}$</b>.</p>
   <p><i>Si noti dove siamo arrivati e con quanto poco:</i> la regola di selezione $\Delta n=\pm1$ e l&rsquo;equispaziatura dei livelli sono già qui, prima di aver introdotto qualunque condizione quantica. Vengono dalla sola equazione del moto classica, riletta come relazione fra matrici. La tappa 05 le aveva ottenute dalla struttura di $q$ in termini di $\eta$ e $\eta^{\dagger}$, cioè <i>dopo</i> aver risolto il problema: qui arrivano prima.</p>`},
   {label:'La progressione aritmetica', body:R`
   <p>Ora serve fissare le scale, e qui entra la regola di commutazione — nella versione di Landau, che usa $xp-px=i\hbar$ scritta per elementi di matrice. Prendendo l&rsquo;elemento diagonale $(m=n)$ e usando $p_{nl}=-im\omega_{nl}x_{nl}$, nella somma su $l$ sopravvivono solo i termini con $l=n\pm1$, e si ottiene una relazione fra due soli numeri. Landau la enuncia senza mezzi termini: <i>«Da questa uguaglianza si deduce che le grandezze $(x_{n+1,n})^{2}$ costituiscono una progressione aritmetica illimitata superiormente, ma necessariamente limitata inferiormente, perché essa può contenere soltanto termini positivi»</i>. In formule, il passo della progressione è</p>
   $$(x_{n+1,n})^{2}-(x_{n,n-1})^{2}=\frac{\hbar}{2m\omega}$$
   <p><b>La struttura dell&rsquo;argomento è identica a quella della tappa 04</b>, e il parallelo vale notarlo: una successione con passo costante, illimitata da sopra, limitata da sotto perché i suoi termini sono quadrati — dunque esiste un primo termine, e si può scegliere di numerarlo zero. Landau: <i>«possiamo scegliere arbitrariamente il valore di $n$ corrispondente al primo stato dell&rsquo;oscillatore, ossia allo stato normale. Sia zero questo valore»</i>. Da cui, risolvendo la ricorrenza,</p>
   $$x_{n,n-1}=x_{n-1,n}=\sqrt{\frac{n\hbar}{2m\omega}},$$
   <p>che è la sua (23,4) — e sono gli stessi $\sqrt n$ della tappa 05, ottenuti senza aver mai scritto $\eta$.</p>`},
   {label:'Lo spettro, dai soli elementi di matrice', body:R`
   <p>La hamiltoniana è diagonale per costruzione, e i suoi elementi diagonali <i>sono</i> le energie. Si calcolano come somme su $l$ in cui sopravvivono solo i vicini:</p>
   $$(x^{2})_{nn}=(x_{n,n+1})^{2}+(x_{n,n-1})^{2}=\frac{(2n+1)\hbar}{2m\omega}$$
   <p>e analogamente, poiché $|\omega_{n,n\pm1}|=\omega$, si ha $(p^{2})_{nn}=m^{2}\omega^{2}(x^{2})_{nn}$. Sommando i due contributi:</p>
   $$E_{n}=\frac{(p^{2})_{nn}}{2m}+\frac{m\omega^{2}}{2}(x^{2})_{nn}=\Big(n+\frac12\Big)\hbar\omega$$
   <p>Landau chiude con la frase che ogni libro ripete e che qui ha un peso diverso, perché arriva da un conto in cui non si è mai parlato di funzioni d&rsquo;onda: <i>«I livelli energetici dell&rsquo;oscillatore sono quindi separati da intervalli uguali a $\hbar\omega$. L&rsquo;energia dello stato fondamentale ($n=0$) è uguale a $\hbar\omega/2$; sottolineiamo che essa non è nulla»</i>.</p>
   <p><b>Una cosa va dichiarata, perché è la differenza fra questo metodo e quello della tappa 04:</b> qui non si è dimostrato che $x$ sia hermitiana, si è <i>imposto</i>; non si è dimostrato che gli stati siano numerabili, si è assunto che esistano stati stazionari numerabili su cui costruire le matrici; e la scelta di fase che rende tutti gli $x_{n,n\pm1}$ reali e positivi è dichiarata in nota da Landau stesso come scelta. <i>È lo stesso risultato con una diversa distribuzione di ciò che si assume e di ciò che si deduce</i>, e il confronto fra le due distribuzioni è la cosa che un orale può chiedere.</p>`},
   {label:'La condizione quantica vera di Heisenberg, che non era quella', body:R`
   <p>Landau usa $[x,p]=i\hbar$, ma Heisenberg nel luglio 1925 non l&rsquo;aveva. Weinberg ricostruisce che cosa usò davvero, e vale sapere la risposta perché nessun altro testo del corso la dice. La condizione era una <b>regola di somma</b>, pubblicata poche settimane prima da W. Kuhn e W. Thomas e derivata da un argomento del tutto diverso: che a frequenza molto alta la diffusione della luce da un elettrone legato debba coincidere con quella da un elettrone libero. Nella forma che Heisenberg impiegò, in una dimensione,</p>
   $$\hbar=2m_{e}\sum_{m'}\big|x_{nm'}\big|^{2}\,\omega_{m'n}.$$
   <p>Weinberg la commenta: <i>«This is the quantum condition used by Heisenberg»</i>, e aggiunge che la relazione canonica $xp-px=i\hbar\times\mathbb 1$ arrivò <b>dopo</b>, in due articoli successivi — Born e Jordan con una derivazione «mathematically fallacious», e Dirac assumendola, <i>«from an analogy with the Poisson brackets of classical mechanics»</i>.</p>
   <p>Con gli elementi di matrice trovati sopra, la regola di somma si verifica: nella somma sopravvivono i due termini $m'=n\pm1$, con frequenze di segno opposto, e</p>
   $$2m\sum_{m'}|x_{nm'}|^{2}\omega_{m'n}=\hbar$$
   <p>indipendentemente da $n$ — che è ciò che la condizione pretende. <b>Il punto storico, e non è decorativo:</b> la regola di Thomas-Kuhn è <i>esattamente</i> l&rsquo;elemento diagonale della relazione canonica, come Weinberg mostra riscrivendola, <i>«$i\hbar=[xp-px]_{nn}$»</i>. Heisenberg aveva la diagonale e non gli elementi fuori diagonale; Born e Jordan hanno aggiunto che anche quelli, fuori diagonale, sono nulli. <i>Il salto dall&rsquo;una all&rsquo;altra è il passaggio da una regola sui dati spettroscopici a un&rsquo;identità fra operatori</i>, e in quel passaggio nasce il formalismo.</p>
   <p>Weinberg annota anche quanto fossero pochi i problemi che il metodo sapeva fare: <i>«Unfortunately, there are very few physical systems for which this sort of calculation is practicable. One is the harmonic oscillator, already solved by Heisenberg»</i>. L&rsquo;altro era l&rsquo;atomo di idrogeno, risolto da Pauli. <b>Due problemi in tutto</b>, ed è la ragione per cui la meccanica ondulatoria, arrivata l&rsquo;anno dopo, prese il sopravvento.</p>`}
  ]},
  {t:'plot', title:'La progressione aritmetica, che è tutto il conto di Heisenberg',
   intro:R`<p>I quadrati degli elementi di matrice $(x_{n+1,n})^{2}$ in funzione di $n$, in unità $\hbar/2m\omega$: devono stare su una retta di pendenza uno, e il primo termine deve essere non negativo. A destra, le energie che ne risultano, confrontate con la progressione geometrica che si avrebbe se i livelli si infittissero come nell&rsquo;idrogeno.</p>`,
   plots:[{kind:'func2d', xr:[-1.5,6.5], yr:[-1.5,7.5], height:270, ticks:true,
     title:'(x_{n+1,n})^2 in unita hbar/2 m omega: la retta e il taglio a zero',
     curves:[{f:'x+1', col:'#5aa9ff', width:2.4, label:'n + 1 (la progressione)'},
             {f:'0', col:'#6f7a90', width:1.4, label:'zero: sotto non si puo andare'},
             {f:'x+0.4', col:'#ff6b8a', width:1.6, label:'una progressione vietata (primo termine 0,4 ma passa per valori negativi a n = -1)'}],
     xlabel:'n', ylabel:'(x_{n+1,n})^2'},
    {kind:'func2d', xr:[-0.3,8], yr:[-0.3,9], height:270, ticks:true,
     title:'E_n: equispaziati (oscillatore) contro infittiti (idrogeno, riscalato)',
     curves:[{f:'x+0.5', col:'#5aa9ff', width:2.4, label:'oscillatore: n + 1/2'},
             {f:'8*(1-1/Math.pow(x+1,2))', col:'#ffb86b', width:2.2, label:'idrogeno riscalato: 8(1 - 1/(n+1)^2)'}],
     xlabel:'n', ylabel:'E / hbar omega'}],
   leggi:R`<p><b>Che cosa guardare.</b> A sinistra: la retta blu è la progressione vera, e il suo primo termine a $n=0$ vale uno. La retta rossa ha lo stesso passo ma parte da $0{,}4$, e il punto chiave è che <i>continuata verso sinistra attraversa lo zero</i> — cioè la catena discendente, applicata abbastanza volte, produrrebbe quadrati negativi. Questo è il contenuto dell&rsquo;osservazione di Landau, ed è il motivo per cui il primo termine non può essere scelto a piacere: l&rsquo;unica progressione di passo uno e termini non negativi che si interrompa <i>esattamente</i> a zero è quella blu. A destra: le due curve mostrano perché l&rsquo;oscillatore è il caso in cui il metodo matriciale funziona.</p>
   <p><b>Che cosa impararne.</b> La ragione per cui l&rsquo;oscillatore si lascia risolvere da entrambi i metodi è l&rsquo;<i>equispaziatura</i>, e l&rsquo;equispaziatura è ciò che rende la condizione $\omega_{mn}=\pm\omega$ risolubile con un indice intero. Nell&rsquo;idrogeno le differenze $E_{m}-E_{n}$ sono tutte diverse, la condizione analoga non seleziona i soli vicini, e la matrice di $x$ ha elementi non nulli fra livelli arbitrari: il conto diventa impraticabile — e per questo ci volle Pauli e una simmetria nascosta. <b>Il metodo algebrico non è una tecnica generale: è una tecnica per hamiltoniane quadratiche</b>, e la figura di sinistra fa vedere dove sta la sua forza, cioè in una progressione aritmetica tagliata da una condizione di positività.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Nel conto di Landau la quantizzazione esce da «i quadrati sono positivi». Nella tappa 04 esce da «gli autovalori di $H$ sono positivi». È la stessa cosa?`,
    a:R`Sì, ed è utile vedere perché. In Landau la quantità positiva è $(x_{n+1,n})^{2}=|\langle n+1|x|n\rangle|^{2}$, cioè il modulo quadro di un elemento di matrice; nella tappa 04 è $\langle n|\eta^{\dagger}\eta|n\rangle=\|\eta|n\rangle\|^{2}$, cioè il quadrato di una norma. <b>Sono la stessa quantità a meno di costanti</b>, perché $\eta$ è una combinazione lineare di $x$ e $p$ con elementi non nulli solo fra vicini, e $\|\eta|n\rangle\|^{2}=n$ è proporzionale a $|x_{n-1,n}|^{2}$. <i>In entrambi i casi l&rsquo;ingrediente che quantizza è la positività del prodotto scalare in uno spazio di Hilbert</i> — cioè l&rsquo;unico assioma che distingue uno spazio di Hilbert da uno spazio vettoriale qualunque. Detta così, la quantizzazione dell&rsquo;oscillatore è una conseguenza della definita positività della metrica, e il resto è contabilità.`},
   {q:R`La regola di somma di Thomas-Kuhn è l&rsquo;elemento diagonale di $[x,p]=i\hbar$. Che informazione <i>in più</i> contiene la relazione canonica completa?`,
    a:R`Contiene l&rsquo;annullarsi degli elementi <b>fuori diagonale</b> del commutatore, cioè $[xp-px]_{nm}=0$ per $n\neq m$. Per l&rsquo;oscillatore quell&rsquo;informazione in più non serve — il conto di Landau si chiude con la sola diagonale — e questo è precisamente il motivo per cui Heisenberg riuscì a risolvere l&rsquo;oscillatore con una condizione più debole di quella giusta. <b>Serve invece per tutto il resto.</b> La relazione canonica completa è un&rsquo;identità <i>fra operatori</i>, dunque indipendente dalla base, dunque trasportabile: è quella che permette di scrivere $[H,q]$ per un potenziale arbitrario (come fa la tappa 02), di definire il momento come generatore delle traslazioni, di costruire le rappresentazioni di Schrödinger e degli impulsi. <i>Una regola di somma sui dati spettroscopici di un sistema non fa nessuna di queste cose.</i> E Weinberg segnala che Dirac ci arrivò per la via più corta — assumendola, per analogia con le parentesi di Poisson classiche — cioè non dimostrandola affatto: <b>la relazione canonica non è un teorema, è il postulato di quantizzazione</b>, e il conto di Heisenberg è la prova sperimentale indiretta che il postulato è quello giusto.`}
  ]}
]},

/* ---------------- 08 · LE AUTOFUNZIONI ---------------- */
{ num:'08', title:'Le autofunzioni, ricavate dalla gaussiana per sola applicazione dell operatore di salita', meta:'una equazione del primo ordine invece di una del secondo · la normalizzazione con l integrale gaussiano · i polinomi di Hermite e la parità · i flessi nei punti di inversione · le medie e le indeterminazioni',
  blocchi:[
  {t:'prosa', title:'La via breve, e perché esiste', tag:'costruzione', html:R`
  <p>Fin qui non si è mai scritta una funzione d&rsquo;onda. Per ottenerle, Picasso dichiara la scelta di metodo: <i>«Un sistema per trovare queste autofunzioni è quello di risolvere l&rsquo;equazione di Schrödinger… problema non difficile che si trova affrontato su tutti i libri di meccanica quantistica. Noi seguiremo invece una via più breve che trae vantaggio dal fatto che abbiamo già risolto il problema per via astratta»</i>.</p>
  <p>Il vantaggio è enorme e vale isolarlo. Risolvere l&rsquo;equazione di Schrödinger per l&rsquo;oscillatore significa trattare un&rsquo;<b>equazione differenziale del secondo ordine</b> con un coefficiente non costante. La via algebrica richiede invece una sola equazione del <b>primo ordine</b>: quella che traduce $\eta|0\rangle=0$. Tutto il resto è derivare e moltiplicare.</p>
  <p>Nella rappresentazione di Schrödinger, con $p\to-i\hbar\,d/dx$, la condizione $\eta|0\rangle=0$ diventa $(-i\hbar\,d/dx-im\omega x)\psi_{0}=0$, cioè, moltiplicando per $i$,</p>
  $$\Big(\hbar\frac{d}{dx}+m\omega x\Big)\psi_{0}(x)=0$$
  <p>Dirac scrive la stessa equazione come [34.19] e Sakurai come (2.3.28); è a variabili separabili, e la sua soluzione — il risultato di una <span class="str" data-str="derivazione">derivazione</span> elementare, $\psi_{0}'/\psi_{0}=-m\omega x/\hbar$ integrato — è la gaussiana</p>
  $$\psi_{0}(x)=C\,e^{-m\omega x^{2}/2\hbar}.$$`},
  {t:'reveal', title:'Dalla gaussiana a tutta la torre', tag:'costruzione', steps:[
   {label:'La normalizzazione', body:R`
   <p>La costante si fissa imponendo $\int|\psi_{0}|^{2}dx=1$, e serve l&rsquo;<span class="str" data-str="integrale-gaussiano">integrale gaussiano</span>:</p>
   $$\int_{-\infty}^{+\infty}e^{-m\omega x^{2}/\hbar}\,dx=\sqrt{\frac{\pi\hbar}{m\omega}}$$
   <p>da cui $C=(m\omega/\pi\hbar)^{1/4}$ se la si prende reale positiva, e dunque la (8.2) di Picasso, la [34.20] di Dirac, la (2.3.30) di Sakurai:</p>
   $$\psi_{0}(x)=\Big(\frac{m\omega}{\pi\hbar}\Big)^{1/4}e^{-m\omega x^{2}/2\hbar},\qquad \int_{-\infty}^{+\infty}|\psi_{0}|^{2}dx=1$$
   <p>e si verifica, come controllo indipendente, che risolve l&rsquo;equazione di Schrödinger con il valore dell&rsquo;energia che l&rsquo;algebra aveva previsto:</p>
   $$-\frac{\hbar^{2}}{2m}\psi_{0}''+\frac{m\omega^{2}x^{2}}{2}\psi_{0}=\frac{\hbar\omega}{2}\psi_{0}$$`},
   {label:'Gli stati eccitati, applicando l’operatore di salita', body:R`
   <p>La (8.1) di Picasso dice che basta applicare $n$ volte l&rsquo;operatore di salita. In rappresentazione di Schrödinger, nella fase che rende reali le autofunzioni,</p>
   $$\psi_{n}(x)=\frac{1}{\sqrt{n!}}\bigg(\frac{-\hbar\,d/dx+m\omega x}{\sqrt{2m\hbar\omega}}\bigg)^{\!n}\psi_{0}(x).$$
   <p>Applicandolo una volta si ottiene, e il conto è di due righe perché la derivata della gaussiana è la gaussiana per $-m\omega x/\hbar$:</p>
   $$\psi_{1}(x)=\Big(\frac{m\omega}{\pi\hbar}\Big)^{1/4}\sqrt{2}\,\sqrt{\frac{m\omega}{\hbar}}\,x\,e^{-m\omega x^{2}/2\hbar}$$
   <p>Applicandolo ancora si ottiene $\psi_{2}$, e la verifica indipendente — che risolva l&rsquo;equazione con l&rsquo;autovalore giusto — è</p>
   $$-\frac{\hbar^{2}}{2m}\psi_{2}''+\frac{m\omega^{2}x^{2}}{2}\psi_{2}=\frac{5\hbar\omega}{2}\psi_{2}$$
   <p>mentre l&rsquo;ortogonalità, che l&rsquo;algebra garantiva in astratto, si tocca con un integrale:</p>
   $$\int_{-\infty}^{+\infty}\psi_{0}\psi_{2}\,dx=0$$
   <p><b>Si noti la struttura che il procedimento produce</b>, e Picasso la descrive: <i>«Data la forma (gaussiana) di $\psi_{0}(x)$, il risultato di questa operazione è, a parte un fattore $(m\omega)^{n/2}$, un polinomio $H_{n}(\xi)$ di grado $n$ nella variabile adimensionale $\xi=\sqrt{m\omega/\hbar}\,x$, moltiplicato per $\psi_{0}(x)$»</i>. Il perché è immediato: l&rsquo;operatore di salita è «derivata più moltiplicazione per $x$», e applicato a (polinomio)$\times$(gaussiana) restituisce (polinomio di grado uno in più)$\times$(gaussiana). <i>La gaussiana non si tocca più</i>, ed è questo che rende il procedimento chiuso.</p>`},
   {label:'I polinomi di Hermite, e la parità gratis', body:R`
   <p>I polinomi che compaiono sono i <span class="str" data-str="polinomi-di-hermite">polinomi di Hermite</span>, e si possono ottenere in tre modi equivalenti: applicando l&rsquo;operatore di salita come appena fatto, dalla formula di Rodrigues che Landau scrive come (23,11), oppure dalla funzione generatrice che Ballentine dà come (6.33). Dalla formula di Rodrigues $H_{n}(\xi)=(-1)^{n}e^{\xi^{2}}\,d^{n}e^{-\xi^{2}}/d\xi^{n}$:</p>
   $$H_{2}(\xi)=4\xi^{2}-2$$
   $$H_{3}(\xi)=8\xi^{3}-12\xi$$
   $$H_{4}(\xi)=16\xi^{4}-48\xi^{2}+12$$
   <p>e le autofunzioni normalizzate, nella forma che Ballentine numera (6.32) e Landau (23,12), sono</p>
   $$\psi_{n}(x)=\Big(\frac{\alpha}{\pi^{1/2}2^{n}n!}\Big)^{1/2}H_{n}(\alpha x)\,e^{-\alpha^{2}x^{2}/2},\qquad \alpha=\sqrt{\frac{m\omega}{\hbar}}.$$
   <p><b>La parità viene gratis, e Picasso la deduce dal procedimento invece di verificarla</b>: poiché ogni applicazione dell&rsquo;operatore di salita aggiunge una potenza di $\xi$, il polinomio $H_{n}$ contiene solo potenze pari se $n$ è pari e solo dispari se $n$ è dispari, dunque ha parità $(-1)^{n}$; e poiché la gaussiana è pari, le $\psi_{n}$ hanno parità $(-1)^{n}$. Un controllo incrociato lo dà il teorema di oscillazione: $\psi_{2}$ deve avere due nodi, dunque $H_{2}=4\xi^{2}-2$ deve avere due radici reali, e infatti</p>
   $$\xi=\pm\frac{1}{\sqrt2}$$
   <p>Picasso usa proprio questo come argomento per fissare un segno: <i>«$H_{2}(\xi)$ è del tipo $\xi^{2}+a$ e inoltre, siccome per il teorema di oscillazione $\psi_{2}(x)$ deve avere due nodi, $a$ è negativo»</i>. <i>È un teorema generale sugli stati legati in una dimensione usato per determinare il segno di un coefficiente in un caso particolare</i>, e vale notare la direzione: non si verifica il teorema sull&rsquo;esempio, si usa il teorema per risparmiare un conto.</p>`},
   {label:'I flessi, e dove cadono', body:R`
   <p>Picasso fa un&rsquo;osservazione sulla forma della gaussiana che collega il conto alla meccanica classica: <i>«Si può verificare direttamente che ha i flessi nei punti $\pm x_{0}$, con $x_{0}=\sqrt{\hbar/(m\omega)}$, che sono i punti che soddisfano l&rsquo;equazione $V(x)=E_{0}$, cioè i punti di inversione per un oscillatore di energia $E_{0}$»</i>. Le due verifiche sono indipendenti. Il flesso:</p>
   $$\psi_{0}''\Big(\sqrt{\tfrac{\hbar}{m\omega}}\Big)=0$$
   <p>Il punto d&rsquo;inversione classico, dove l&rsquo;energia è tutta potenziale:</p>
   $$\frac{m\omega^{2}x^{2}}{2}=\frac{\hbar\omega}{2}\ \Longrightarrow\ x=\sqrt{\frac{\hbar}{m\omega}}$$
   <p><b>Che coincidano non è una curiosità, è l&rsquo;equazione di Schrödinger letta come enunciato sulla curvatura.</b> Da $\psi''=\frac{2m}{\hbar^{2}}(V-E)\psi$ segue che $\psi''$ si annulla esattamente dove $V=E$ (se $\psi\neq0$ là), e che il segno di $\psi''/\psi$ cambia attraversando quel punto. Dentro la regione classicamente permessa la concavità è rivolta verso l&rsquo;asse e la funzione oscilla; fuori è rivolta via dall&rsquo;asse e la funzione decade. Picasso lo verifica esplicitamente su questo caso — <i>«per $-x_{0}<x<+x_{0}$ la concavità di $\psi_{0}(x)$ è rivolta verso il basso… mentre per $|x|>x_{0}$ la concavità è rivolta verso l&rsquo;alto»</i> — e aggiunge le due proprietà che il teorema di oscillazione pretende per lo stato fondamentale: <i>«$\psi_{0}(x)$ non ha nodi ed è una funzione pari di $x$»</i>.</p>`},
   {label:'Le medie, e le indeterminazioni livello per livello', body:R`
   <p>Con le autofunzioni esplicite i valori medi si calcolano per integrazione, e tornano quelli che la tappa 02 aveva previsto per via algebrica. Nello stato fondamentale:</p>
   $$\langle x^{2}\rangle_{0}=\frac{\hbar}{2m\omega}$$
   $$\langle p^{2}\rangle_{0}=\frac{m\hbar\omega}{2}$$
   <p>e poiché $\langle x\rangle=\langle p\rangle=0$ su ogni autostato — tappa 02, punto 2 — queste <i>sono</i> le varianze, dunque</p>
   $$\Delta x\,\Delta p=\frac{\hbar}{2}$$
   <p>cioè la (2.3.39) di Sakurai, che la commenta: <i>«we see that the uncertainty relation is satisfied in the minimum uncertainty product form… This is not surprising because the ground-state wave function has a Gaussian shape»</i>. Per gli stati eccitati, usando $\langle x^{2}\rangle_{n}=(2n+1)\hbar/2m\omega$ e $\langle p^{2}\rangle_{n}=(2n+1)m\hbar\omega/2$:</p>
   $$\Delta x\,\Delta p=\Big(n+\frac12\Big)\hbar$$
   <p>che è la (2.3.40) di Sakurai, lasciata al lettore. <b>Il fondamentale è l&rsquo;unico stato stazionario di minima indeterminazione</b>, e tutti gli altri ne stanno sopra di un fattore $2n+1$. <i>Questo fatto, messo accanto a quello della tappa 10, è ciò che rende necessari gli stati coerenti:</i> se si cerca uno stato che si comporti classicamente — localizzato, in moto, e che resti localizzato — fra gli autostati dell&rsquo;energia non c&rsquo;è, perché quelli larghi sono quelli con molta energia e nessuno di essi si muove.</p>`}
  ]},
  {t:'plot', title:'Le prime autofunzioni e le loro densità',
   intro:R`<p>In unità $m=\omega=\hbar=1$, dove $\alpha=1$ e $\psi_{n}(x)=(2^{n}n!\sqrt\pi)^{-1/2}H_{n}(x)e^{-x^{2}/2}$. A sinistra le funzioni $\psi_{0},\psi_{1},\psi_{2},\psi_{3}$; a destra le densità $|\psi_{n}|^{2}$ con la parabola del potenziale sovrapposta in scala, per vedere dove cadono i punti di inversione.</p>`,
   plots:[{kind:'func2d', xr:[-4.5,4.5], yr:[-0.8,0.85], height:300, ticks:true,
     title:'psi_n(x) per n = 0, 1, 2, 3',
     curves:[{f:'Math.pow(Math.PI,-0.25)*Math.exp(-x*x/2)', col:'#5aa9ff', width:2.4, label:'n = 0: nessun nodo, pari'},
             {f:'Math.pow(Math.PI,-0.25)/Math.sqrt(2)*2*x*Math.exp(-x*x/2)', col:'#9b8cff', width:2.2, label:'n = 1: un nodo, dispari'},
             {f:'Math.pow(Math.PI,-0.25)/Math.sqrt(8)*(4*x*x-2)*Math.exp(-x*x/2)', col:'#ffb86b', width:2.2, label:'n = 2: due nodi, pari'},
             {f:'Math.pow(Math.PI,-0.25)/Math.sqrt(48)*(8*x*x*x-12*x)*Math.exp(-x*x/2)', col:'#ff6b8a', width:2.2, label:'n = 3: tre nodi, dispari'}],
     xlabel:'x', ylabel:'psi_n'},
    {kind:'func2d', xr:[-4.5,4.5], yr:[-0.05,0.65], height:300, ticks:true,
     title:'|psi_n|^2 e la parabola V = x^2/2 ridotta di dieci volte',
     curves:[{f:'Math.pow(Math.PI,-0.5)*Math.exp(-x*x)', col:'#5aa9ff', width:2.4, label:'n = 0'},
             {f:'Math.pow(Math.PI,-0.5)/2*4*x*x*Math.exp(-x*x)', col:'#9b8cff', width:2.2, label:'n = 1'},
             {f:'Math.pow(Math.PI,-0.5)/8*Math.pow(4*x*x-2,2)*Math.exp(-x*x)', col:'#ffb86b', width:2.2, label:'n = 2'},
             {f:'x*x/20', col:'#6f7a90', width:1.4, label:'V/10'}],
     xlabel:'x', ylabel:'|psi_n|^2'}],
   leggi:R`<p><b>Che cosa guardare.</b> A sinistra: il numero di nodi è esattamente $n$, come il teorema di oscillazione pretende, e la parità si alterna. Nel riquadro di sinistra si vede anche il flesso di $\psi_{0}$: la curva blu cambia concavità in $x=\pm1$, cioè esattamente nei punti d&rsquo;inversione classici dello stato fondamentale calcolati in questa tappa. A destra: la densità del fondamentale è massima nell&rsquo;origine — dove la particella classica va <i>più veloce</i> e quindi passa meno tempo — e quella di $n=1$ è nulla nell&rsquo;origine, che è il massimo del disaccordo possibile con l&rsquo;intuizione classica.</p>
   <p><b>Che cosa impararne.</b> Le code che sbordano oltre i punti d&rsquo;inversione non sono un difetto di rappresentazione: sono probabilità vera, in regione classicamente proibita, e la tappa 10 la calcola — vale $0{,}157$ nello stato fondamentale, cioè un sesto. E l&rsquo;alternanza delle parità non è un&rsquo;osservazione estetica: implica che $\langle n|x|n\rangle=0$ per ogni $n$ (l&rsquo;integrando è dispari) e che $\langle n'|x|n\rangle$ possa essere non nullo solo fra parità opposte, cioè fra $n$ e $n'$ di parità diversa. <i>Metà della regola di selezione viene dalla sola parità;</i> l&rsquo;altra metà — che si cambi di <b>un</b> livello e non di tre — viene dalla struttura in $\eta$ e $\eta^{\dagger}$ della tappa 05.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Si trovi l&rsquo;autofunzione dell&rsquo;oscillatore nella rappresentazione degli impulsi, senza rifare nessun conto.`,
    a:R`Si osserva che la hamiltoniana è <b>simmetrica</b> nello scambio fra posizione e impulso, a meno di riscalamenti. In rappresentazione degli impulsi $x\to i\hbar\,d/dp$, dunque $H=p^{2}/2m+(m\omega^{2}/2)(i\hbar\,d/dp)^{2}$: è la stessa equazione di prima con $x\leftrightarrow p$ e $m\omega\leftrightarrow1/m\omega$. Quindi le autofunzioni in $p$ sono le stesse funzioni di prima con la scala cambiata, $\tilde\psi_{n}(p)\propto H_{n}(p/\sqrt{m\hbar\omega})\,e^{-p^{2}/2m\hbar\omega}$, e in particolare <i>la gaussiana è autofunzione in entrambe le rappresentazioni</i>. Landau lo mette come problema 1 del paragrafo 23 e dichiara il metodo: <i>«Invece di sviluppare la funzione d&rsquo;onda dello stato stazionario secondo le autofunzioni della quantità di moto, è più semplice nel caso dell&rsquo;oscillatore partire direttamente dall&rsquo;equazione di Schrödinger nella rappresentazione $p$… Questa equazione è esattamente identica alla (23,6)»</i>. <b>È una proprietà vera e notevole della gaussiana</b>: è autofunzione della <span class="str" data-str="trasformata-di-fourier">trasformata di Fourier</span>, e l&rsquo;autovalore è uno. <i>Questa è la ragione strutturale per cui lo stato fondamentale dell&rsquo;oscillatore satura la relazione di indeterminazione</i> — saturarla significa essere identicamente localizzati nelle due rappresentazioni coniugate, e la gaussiana è l&rsquo;unica funzione che lo faccia.`},
   {q:R`La via algebrica alle autofunzioni ha risolto una sola equazione differenziale, del primo ordine. Dov&rsquo;è finita la seconda soluzione dell&rsquo;equazione del secondo ordine?`,
    a:R`È stata scartata, e lo si vede bene. L&rsquo;equazione del secondo ordine ha, per ogni $E$, due soluzioni indipendenti; l&rsquo;equazione del primo ordine $\eta\psi_{0}=0$ ne ha una sola, a meno di una costante. <b>La condizione $\eta|0\rangle=0$ è più forte dell&rsquo;equazione di Schrödinger</b>: implica $H\psi_{0}=\hbar\omega\psi_{0}/2$, ma non viceversa. L&rsquo;altra soluzione dell&rsquo;equazione di Schrödinger a $E=\hbar\omega/2$ esiste, e si comporta come $e^{+m\omega x^{2}/2\hbar}$ all&rsquo;infinito: non è normalizzabile, e la tappa 04 l&rsquo;ha già incontrata come soluzione di $\eta^{\dagger}\psi=0$. <i>Il metodo algebrico, imponendo l&rsquo;annullamento dell&rsquo;operatore di discesa, seleziona automaticamente la soluzione buona</i> — e questo è il senso preciso dell&rsquo;osservazione di Ballentine che la tappa 09 svolge: la condizione al contorno non è scomparsa, è nascosta nella richiesta che $p$ sia autoaggiunto.`}
  ]}
]},

/* ---------------- 09 · LA VIA ANALITICA, E PERCHE' DA' LO STESSO ---------------- */
{ num:'09', title:'La via analitica, la terza via, e il motivo non ovvio per cui coincidono', meta:'il comportamento asintotico e la soluzione che si butta · la formula di ricorrenza e il troncamento · dove si nasconde la condizione al contorno nel metodo algebrico · diagonalizzare la posizione nella base dell energia',
  blocchi:[
  {t:'prosa', title:'Il problema di questa tappa non è il conto', tag:'architettura', html:R`
  <p>La via analitica è quella che ogni manuale fa e che il metodo algebrico ha permesso di evitare. Vale farla comunque, per due ragioni che non sono «completezza». La prima è che <b>un esame può chiederla</b>, ed è una delle due o tre volte nel corso in cui si risolve un&rsquo;equazione differenziale per serie e si usa la convergenza come condizione fisica. La seconda è più interessante, e Ballentine la formula come una domanda: <i>«The methods of this section and of the previous section are very different, and yet they lead to precisely the same energy eigenvalue spectrum. It is interesting to inquire why this is so»</i>.</p>
  <p>La domanda non è retorica. Nella via analitica la quantizzazione viene dall&rsquo;imporre che $\psi\to0$ all&rsquo;infinito: una <b>condizione al contorno</b>. Nella via algebrica non c&rsquo;è nessuna condizione al contorno, non c&rsquo;è nessun infinito, non ci sono funzioni — ci sono soltanto commutatori. <i>Da dove viene la quantizzazione, nel secondo caso?</i> La risposta sta nell&rsquo;ultimo passo di questa tappa, e cambia il modo di guardare tutte le dimostrazioni algebriche del corso.</p>`},
  {t:'reveal', title:'La serie di potenze, e il troncamento', tag:'costruzione', steps:[
   {label:'Adimensionalizzare, e staccare l’asintotico', body:R`
   <p>Si scrive l&rsquo;equazione in variabili adimensionali: $q=\sqrt{M\omega/\hbar}\,x$ e $\lambda=2E/\hbar\omega$ trasformano l&rsquo;equazione di Schrödinger nella (6.24) di Ballentine,</p>
   $$\frac{d^{2}u}{dq^{2}}+(\lambda-q^{2})u=0.$$
   <p>Per $q$ grande si trascura $\lambda$ rispetto a $q^{2}$, e l&rsquo;equazione residua $u''=q^{2}u$ ha i due comportamenti $e^{\pm q^{2}/2}$. <b>Uno dei due si scarta</b>, e Ballentine dichiara perché in termini più precisi del solito: <i>«The first of these is unacceptable, because it diverges so severely as to be outside of both Hilbert space and the extended, or &lsquo;rigged&rsquo;, Hilbert space»</i>. Non è solo «non normalizzabile»: non appartiene nemmeno allo spazio allargato in cui vivono le <span class="str" data-str="delta-di-dirac">delta di Dirac</span> e le onde piane, che pure non sono normalizzabili. La verifica è immediata:</p>
   $$\lim_{\xi\to+\infty}e^{+\xi^{2}/2}=\infty$$
   <p>Si cerca dunque la soluzione nella forma $u(q)=H(q)\,e^{-q^{2}/2}$, e sostituendo si ottiene l&rsquo;equazione per $H$, che è la (6.26) di Ballentine:</p>
   $$H''-2qH'+(\lambda-1)H=0.$$
   <p>Con $\lambda-1=2n$ questa è l&rsquo;equazione di Hermite, e i polinomi della tappa 08 la soddisfano — due verifiche:</p>
   $$H_{2}''-2\xi H_{2}'+4H_{2}=0$$
   $$H_{3}''-2\xi H_{3}'+6H_{3}=0$$`},
   {label:'La ricorrenza, e perché la serie deve chiudersi', body:R`
   <p>Prima di sviluppare in serie, Ballentine giustifica di poterlo fare, e questo è il passaggio che i manuali saltano: <i>«It is shown in the theory of differential equations that if the equation is written so that the coefficient of the highest order derivative is unity… then the solution may be singular only at the singular points of the coefficients of the lower order derivatives. Since there are no such singularities in the coefficients of (6.26), it follows that $H(q)$ can have no singularities for finite $q$, and a power series solution will have infinite radius of convergence»</i>. <i>Il raggio di convergenza infinito non è una speranza: è un teorema sull&rsquo;equazione.</i></p>
   <p>Si sostituisce allora $H(q)=\sum_{n}a_{n}q^{n}$ e si annulla il coefficiente di ogni potenza, ottenendo la (6.28):</p>
   $$a_{n+2}=\frac{2n+1-\lambda}{(n+2)(n+1)}\,a_{n}.$$
   <p>Se la serie <b>non</b> si interrompe, il rapporto fra coefficienti consecutivi ha un comportamento asintotico preciso:</p>
   $$n\,\frac{a_{n+2}}{a_{n}}\longrightarrow 2$$
   <p>cioè $a_{n+2}/a_{n}\simeq2/n$. Ballentine: <i>«This is the same as the asymptotic ratio in the series for $q^{k}e^{q^{2}}$ with any positive value of $k$»</i> — dunque $H(q)$ crescerebbe come $e^{+q^{2}}$, e moltiplicata per $e^{-q^{2}/2}$ darebbe $u\sim e^{+q^{2}/2}$: esattamente la soluzione appena scartata, rientrata dalla finestra. <b>L&rsquo;unico modo di evitarla è che la serie si interrompa</b>, cioè che il numeratore della ricorrenza si annulli per qualche $n$ non negativo:</p>
   $$\lambda=2n+1\qquad\Longrightarrow\qquad E_{n}=\hbar\omega\Big(n+\frac12\Big),$$
   <p>che è la (6.31). Un esempio esplicito: con $n=2$ si ha $\lambda=5$, e il coefficiente successivo si annulla,</p>
   $$a_{4}=\frac{2\cdot2+1-5}{4\cdot3}\,a_{2}=0$$
   <p><b>La ricorrenza lega i coefficienti a due a due</b>, pari con pari e dispari con dispari, e questa è l&rsquo;origine analitica della parità che la tappa 08 aveva ottenuto per via algebrica: una delle due famiglie si tronca e l&rsquo;altra va posta a zero da principio, dunque ogni autofunzione è pari <i>o</i> dispari e non mista.</p>`},
   {label:'Dove si nasconde la condizione al contorno, nell’altra via', body:R`
   <p>Ecco la risposta alla domanda di apertura, e Ballentine la dà per esteso. <i>«The eigenvalue restriction came about only by imposing the boundary condition that $\psi(x)$ should tend to zero as $|x|\to\infty$. But there is no direct reference to a boundary condition in Sec. 6.1. However equivalent information is contained in the requirement $P=P^{\dagger}$.»</i></p>
   <p>Il punto è questo. Perché l&rsquo;operatore $-i\hbar\,d/dx$ sia uguale al suo <span class="str" data-str="operatore-aggiunto">aggiunto</span> bisogna che, nell&rsquo;integrazione per parti che definisce l&rsquo;aggiunto, il <b>termine di bordo si annulli</b>:</p>
   $$\int\phi^{*}\Big(-i\hbar\frac{d\psi}{dx}\Big)dx=\int\Big(-i\hbar\frac{d\phi}{dx}\Big)^{*}\!\psi\,dx-i\hbar\big[\phi^{*}\psi\big]_{-\infty}^{+\infty},$$
   <p>e su spazio illimitato l&rsquo;annullarsi di quel termine <i>è</i> la condizione $\psi\to0$ all&rsquo;infinito. Ballentine conclude: <i>«Thus, in spite of appearances to the contrary, the two methods are closely related»</i>.</p>
   <p><b>Vale fissare questa lezione perché va oltre l&rsquo;oscillatore.</b> Nel metodo algebrico si è usato $P=P^{\dagger}$ e $Q=Q^{\dagger}$ in due punti: per dire che $\langle p^{2}\rangle\geq0$, nella tappa 02, e per dire che $\eta^{\dagger}$ è l&rsquo;aggiunto di $\eta$, dovunque. <i>In entrambi i casi si stava usando, senza nominarla, la condizione al contorno.</i> Le dimostrazioni «puramente algebriche» non sono senza ipotesi analitiche: le hanno impacchettate nella parola «autoaggiunto», che è esattamente l&rsquo;affermazione che un operatore differenziale è hermitiano <i>su un dominio con quelle condizioni al bordo</i>. È la stessa osservazione che rende delicato lo spettro continuo, ed è il motivo per cui la non banalità di «$p$ è autoaggiunto» non è una pedanteria matematica.</p>`},
   {label:'La terza via: diagonalizzare la posizione invece dell’energia', body:R`
