  .str{color:var(--gram);border-bottom:1px dashed var(--gram);cursor:pointer;}

<script>
"use strict";
const R = String.raw;

function typeset(el){
  if(el && window.renderMathInElement){
    try{ renderMathInElement(el,{delimiters:[
      {left:'$$',right:'$$',display:true},
      {left:'$',right:'$',display:false}
    ],throwOnError:false}); }catch(e){}
  }
}
function elFromHTML(html){ var d=document.createElement('div'); d.innerHTML=html; return d; }

/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un
   rimando scritto nella prosa:

       <span class="str" data-str="serie-geometrica">la serie geometrica</span>

   Le schede citate da questo nucleo sono cucite qui sotto dal montaggio
   (assembla-nucleo.js): la pagina resta autosufficiente — niente fetch,
   niente sottocartelle da pubblicare — e un rimando a una scheda che non
   esiste FERMA la costruzione invece di arrivare in pagina rotto.
   Apertura: lo stesso gesto del collaudo (si clicca, il pannello compare,
   si typeset una volta sola), portato dentro la frase.
   =================================================================== */
var CORSO = 'elettromagnetismo';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["teorema-della-divergenza"] = {"nome":"Teorema della divergenza","riga":"Il flusso uscente da una superficie chiusa è l'integrale della divergenza sul volume che racchiude: $\\oint_{\\partial V}\\mathbf F\\cdot\\hat n\\,dS=\\int_V\\nabla\\cdot\\mathbf F\\,dV$.","serve":"Scambia una domanda sul bordo con una sul volume. A destra c'è la divergenza, che è la densità di sorgente punto per punto; a sinistra il totale che esce. Si usa nei due versi: per calcolare un flusso scomodo con un integrale di volume comodo, e — in fisica soprattutto — per passare da una legge integrale a una legge locale, perché se due integrali di volume coincidono per OGNI volume allora coincidono gli integrandi.","esempio":"Per $\\mathbf F=\\mathbf r=(x,y,z)$ la divergenza vale $3$, quindi sulla palla di raggio $R$ il membro destro è $3\\cdot\\tfrac43\\pi R^{3}=4\\pi R^{3}$; il membro sinistro, calcolato come flusso, è il modulo $R$ per l'area $4\\pi R^{2}$, e dà lo stesso numero.","pieno":{"file":"05-teoremi-integrali.html","tappa":"02","come":"l'enunciato, la dimostrazione a fette e le ipotesi vere sul dominio, nel nucleo dei teoremi integrali"},"qui":{"elettromagnetismo":{"serve":"È il passaggio che trasforma la legge di Gauss integrale nella prima equazione di Maxwell, $\\nabla\\cdot\\mathbf E=\\rho/\\varepsilon_0$, e la conservazione della carica nell'equazione di continuità $\\nabla\\cdot\\mathbf J+\\partial_t\\rho=0$. La mossa è sempre la stessa: si scrive la legge su un volume arbitrario, si porta il flusso dentro come integrale di divergenza, e si osserva che un integrale nullo su OGNI volume obbliga l'integrando a essere nullo. L'arbitrarietà del volume non è un dettaglio: è tutta la dimostrazione.","esempio":"Per il campo di una carica puntiforme, di modulo $\\dfrac{q}{4\\pi\\varepsilon_0r^{2}}$ e diretto radialmente, la divergenza è nulla ovunque tranne nell'origine: in coordinate sferiche la divergenza di un campo radiale si scrive con $\\partial_r\\!\\left(r^{2}E_r\\right)$, e qui $r^{2}E_r$ non dipende da $r$, quindi la derivata fa $0$. Tutta la carica è finita nel punto escluso, ed è esattamente il buco che la $\\delta$ di Dirac serve a riempire."}},"controllo":[{"tipo":"uguale","sinistra":"diff(x,x)+diff(y,y)+diff(z,z)","vale":"3","dove":"esempio","appare":"vale $3$"},{"tipo":"uguale","sinistra":"3*(4/3)*pi*R**3","vale":"4*pi*R**3","dove":"esempio","appare":"4\\pi R^{3}"},{"tipo":"derivata","espr":"r**2*(q/(4*pi*e0*r**2))","rispetto":["r"],"vale":"0","dove":"qui.elettromagnetismo.esempio","appare":"la derivata fa $0$"}]};

function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';
  return h;
}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

MOVIMENTO*/

 {"tipo":"limite","espr":"rho*(R2-R1)/(4*pi*R1*R2)","var":"R2","a":"oo",
  "vale":"rho/(4*pi*R1)",

  "dove":"03","appare":"\\frac{\\rho}{4\\pi R_1}"},

 {"tipo":"integrale","espr":"(V0/R*exp(-t/(R*C)))**2*R","var":"t","da":"0","a":"oo",
  "vale":"C*V0**2/2",

 {"tipo":"uguale","sinistra":"J**2/sigma","vale":"J*(J/sigma)",
  "ipotesi":{"J":"positive","sigma":"positive"},

 {"tipo":"uguale","sinistra":"((I/A)*(I*rho/A))*(A*L)","vale":"rho*L/A*I**2",

 {"tipo":"uguale","sinistra":"(sigma*E)**2/sigma","vale":"sigma*E**2",

 {"tipo":"simbolico","dove":"04","appare":"\\frac{V^{2}}{R}=VI",

 {"tipo":"simbolico","dove":"02","appare":"-\\frac{d}{dt}\\int_V\\rho\\,dV",
  "perche":"e' il bilancio di partenza scritto per un volume generico: l'impostazione del ragionamento, non un valore"},

 {"tipo":"simbolico","dove":"02","appare":"\\nabla\\cdot\\vec J=0",

/* ---------------- 00 · DI COSA PARLA QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Di cosa parla questo movimento', meta:'Elettromagnetismo · voce B.4 · 87 prove su 100, densita 10.0: e il movimento PIU pesante del corso',
  blocchi:[
  {t:'prosa', title:'Che cosa cambia rispetto a tutto quello che precede', tag:'architettura', html:R`
  <p>Fino a qui le cariche erano <b>ferme</b>: in equilibrio nei conduttori, legate nei dielettrici. Adesso si muovono, e in modo <b>stazionario</b> — cioè con un regime che non cambia nel tempo, ma in cui qualcosa scorre. È una situazione nuova e va detto subito che cosa sopravvive e cosa no:</p>
  <ul>
   <li><b>sopravvive</b> la conservatività del campo elettrostatico, quindi il potenziale e le differenze di potenziale hanno ancora senso: è il motivo per cui i circuiti si analizzano con le tensioni;</li>
   <li><b>non sopravvive</b> «$\vec E=0$ dentro il conduttore». Se il campo fosse nullo nessuno spingerebbe le cariche. In un conduttore percorso da corrente il campo interno <b>c&rsquo;è</b>, ed è quello che mantiene il moto contro gli urti.</li>
  </ul>
  <p>La misura dice perché questo è il movimento su cui conviene spendere più tempo di tutti: <b>87 prove su 100 lo toccano, con densità 10.0 — la più alta del corso</b>. «Condensatore» compare 357 volte negli scritti, «resistenza» 139, «forza elettromotrice» 67. Un compito senza un circuito dentro, in tredici anni di appelli, praticamente non esiste.</p>`},
  {t:'prosa', title:'Il filo del movimento', tag:'mappa', html:R`
  <p>Una sola idea, declinata: <b>la carica non si crea e non si distrugge</b>, e scritta localmente questa frase diventa l&rsquo;equazione di continuità. Da lì: cosa vuol dire «stazionario», perché la corrente è la stessa in tutta una serie, perché ai nodi le correnti si sommano (Kirchhoff), e perché un condensatore in regime stazionario non lascia passare corrente. <b>Tutte le regole dei circuiti sono conseguenze di quell&rsquo;equazione</b>, non regole a sé.</p>`}
]},

/* ---------------- 01 · LA DENSITÀ DI CORRENTE ---------------- */
{ num:'01', title:'La densita di corrente: la grandezza locale, e perche I non basta', meta:'J come campo vettoriale · I e il FLUSSO di J · velocita di deriva · lordine di grandezza che sorprende',
  blocchi:[
  {t:'prosa', title:'Da un numero a un campo', tag:'grammatica', html:R`
  <p>La corrente $I$ è la carica che attraversa una sezione nell&rsquo;unità di tempo: un <b>numero</b> associato a una superficie. Ma per descrivere cosa succede <i>dentro</i> il materiale serve una grandezza punto per punto, la <b>densità di corrente</b> $\vec J$, e la relazione fra le due è un <b>flusso</b>:
  $$I=\int_S\vec J\cdot d\vec S.$$
  Stessa struttura del flusso del campo elettrico in em-02 — e non è un caso, perché il teorema della divergenza servirà qui esattamente come lì.</p>
  <p>Microscopicamente, se ci sono $n$ portatori per unità di volume, ciascuno di carica $q$, che derivano con velocità media $\vec v_d$:
  $$\vec J=nq\vec v_d.$$</p>
  <div class="note"><b>L&rsquo;ordine di grandezza che vale la pena avere in testa.</b> In un filo di rame da 1 mm² percorso da 1 A, la velocità di deriva è di circa <b>0,1 mm/s</b>: un elettrone impiega ore per attraversare una stanza. Eppure la luce si accende subito. Non c&rsquo;è contraddizione: ciò che viaggia quasi alla velocità della luce non sono gli elettroni ma il <b>campo</b>, che si stabilisce lungo il filo e mette in moto <i>ovunque insieme</i> gli elettroni già presenti. È la stessa differenza fra l&rsquo;acqua che scorre in un tubo pieno e l&rsquo;onda di pressione che lo percorre quando apri il rubinetto.</div>`}
]},

/* ---------------- 02 · L'EQUAZIONE DI CONTINUITÀ ---------------- */
{ num:'02', title:'Lequazione di continuita: la conservazione della carica, scritta nel punto', meta:'dal bilancio integrale alla forma locale · cosa vuol dire stazionario · Kirchhoff come corollario',
  blocchi:[
  {t:'reveal', title:'La derivazione, in tre righe', tag:'first principles', steps:[
   {label:'Il bilancio su un volume', body:R`
   <p>Prendi un volume $V$ fisso con bordo $S$. La carica che esce per unità di tempo è il flusso di $\vec J$; se la carica non si crea né si distrugge, quel flusso deve pareggiare la diminuzione della carica contenuta:
   $$\oint_S\vec J\cdot d\vec S=-\frac{d}{dt}\int_V\rho\,dV.$$
   <b>È solo contabilità</b>: quello che esce è quello che non c&rsquo;è più dentro.</p>`},
   {label:'La forma locale', body:R`
   <p>Si applica il <span class="str" data-str="teorema-della-divergenza">teorema della divergenza</span> al membro sinistro e si porta tutto sotto un solo integrale su $V$. Poiché $V$ è <b>arbitrario</b>, l&rsquo;integrando deve annullarsi punto per punto:
   $$\nabla\cdot\vec J=-\frac{\partial\rho}{\partial t}.$$
   <b>L&rsquo;argomento «l&rsquo;integrale è nullo per ogni volume quindi l&rsquo;integrando è nullo» è lo stesso usato in em-02 per passare da Gauss integrale a Gauss locale.</b> Imparato una volta, vale per tutte le leggi di conservazione della fisica — e la ritroverai identica per l&rsquo;energia, la massa, la probabilità in meccanica quantistica.</p>`},
   {label:'Stazionario, e cosa ne segue', body:R`
   <p><b>Regime stazionario</b> significa $\partial\rho/\partial t=0$: la carica in ogni punto non cambia, benché ci sia moto. Allora
   $$\nabla\cdot\vec J=0,$$
   cioè <b>$\vec J$ è solenoidale</b>: le linee di corrente non nascono e non muoiono, si chiudono su se stesse. Da qui, immediatamente:</p>
   <ul>
    <li><b>la corrente è la stessa in ogni sezione</b> di un conduttore isolato (tubo di flusso): se entra $I$ da una parte, esce $I$ dall&rsquo;altra. Per questo in una <b>serie</b> la corrente è la stessa ovunque;</li>
    <li><b>legge dei nodi di Kirchhoff</b>: circondando un nodo con una superficie chiusa, $\sum I_{\text{entranti}}=\sum I_{\text{uscenti}}$. Non è una regola dei circuiti: è $\nabla\cdot\vec J=0$ applicata a una scatola;</li>
    <li><b>in regime stazionario un condensatore non passa corrente</b>: le linee di $\vec J$ dovrebbero morire sull&rsquo;armatura, e non possono. Il ramo con il condensatore è un ramo aperto — è la prima cosa da fare in ogni esercizio di circuito «a regime».</li>
   </ul>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Durante la <b>carica</b> di un condensatore la corrente scorre nel filo ma non fra le armature. L'equazione di continuità è violata?`,
    a:R`No: semplicemente non siamo in regime stazionario. Lì $\partial\rho/\partial t\ne0$ sulle armature — la carica si <b>accumula</b> — e l&rsquo;equazione con il termine completo è perfettamente soddisfatta. <b>Questa osservazione è il seme della corrente di spostamento di Maxwell</b> (em-11): per far tornare anche la legge di Ampère in questa situazione bisognerà aggiungere un termine, e quel termine nasce esattamente da qui.`},
   {q:R`Perché la corrente è la stessa in tutta una serie ma non in un parallelo?`,
    a:R`Perché in serie i conduttori formano un <b>unico tubo di flusso</b> senza diramazioni, e $\nabla\cdot\vec J=0$ impone che il flusso attraverso ogni sezione sia lo stesso. In un parallelo c&rsquo;è un nodo, cioè un punto dove il tubo si divide: la somma si conserva, i singoli rami no. <b>Serie e parallelo non sono due regole: sono la stessa equazione applicata a due topologie.</b>`}
  ]}
]},

/* ---------------- 03 · LA LEGGE DI OHM E LA RESISTENZA ---------------- */
{ num:'03', title:'La legge di Ohm locale, e la resistenza calcolata per geometria', meta:'J = sigma E · da locale a globale · cilindro, guscio cilindrico, guscio sferico · la messa a terra',
  blocchi:[
  {t:'prosa', title:'Le due facce della stessa legge', tag:'costruzione', html:R`
  <p>La <b>forma locale</b> è una legge costitutiva del materiale — si misura, non si dimostra:
  $$\vec J=\sigma\vec E,$$
  con $\sigma$ la conducibilità e $\rho=1/\sigma$ la resistività. Dice che nel conduttore il campo non accelera indefinitamente i portatori: gli urti col reticolo producono un regime di deriva a velocità costante, proporzionale al campo.</p>
  <p>La <b>forma globale</b> si ottiene integrando. Per un cilindro di lunghezza $L$ e sezione $A$ con campo uniforme: $V=EL$ e $I=JA=\sigma EA$, quindi $V=\frac{L}{\sigma A}I=RI$ con
  $$R=\frac{\rho L}{A}.$$
  <b>$R$ contiene il materiale ($\rho$) e la geometria ($L/A$), separati</b>: è il motivo per cui la stessa formula si riusa cambiando solo il secondo fattore.</p>`},
  {t:'reveal', title:'Le geometrie radiali: quando la sezione cambia lungo il percorso', tag:'esame', steps:[
   {label:'La ricetta', body:R`
   <p>Se la corrente fluisce <b>radialmente</b>, la sezione attraversata cambia man mano. Allora non si può usare $\rho L/A$ con dei valori medi: si somma la resistenza di gusci infinitesimi <b>in serie</b>,
   $$R=\int\frac{\rho\,dr}{A(r)}.$$
   <b>È una serie infinita di resistenze, e per questo si integra</b> — la stessa logica per cui in serie le resistenze si sommano.</p>`},
   {label:'Cilindrico e sferico', body:R`
   <p><b>Guscio cilindrico</b> di altezza $h$, da $R_1$ a $R_2$: $A(r)=2\pi rh$, e
   $$R=\frac{\rho}{2\pi h}\ln\frac{R_2}{R_1}.$$
   <b>Guscio sferico</b>: $A(r)=4\pi r^2$, e
   $$R=\frac{\rho}{4\pi}\left(\frac{1}{R_1}-\frac{1}{R_2}\right).$$
   <b>Il controllo che vale sempre</b>: nel caso sferico, mandando $R_2\to\infty$ la resistenza <i>converge</i> a $\frac{\rho}{4\pi R_1}$ — la resistenza verso l&rsquo;infinito è <b>finita</b>, ed è il motivo per cui la «resistenza di terra» di un dispersore esiste ed è un numero. Nel caso cilindrico invece il logaritmo diverge: un filo indefinito non ha resistenza di dispersione finita. <b>Il logaritmo contro la potenza è la stessa firma delle simmetrie vista in em-02</b>, e qui decide una cosa pratica.</p>`}
  ]},
  {t:'plot', title:'Resistenza radiale accumulata: dove sta davvero la resistenza',
   intro:R`Resistenza fra $R_1=1$ e $r$, per la geometria cilindrica (logaritmica) e sferica (che satura). In unità $\rho=1$, $h=1$.`,
   plots:[
    {kind:'func2d', xr:[1,12], yr:[0,0.45], height:340,
     title:'la sferica satura, la cilindrica cresce senza limite',
     xlabel:'r (raggio esterno)', ylabel:'R(r)',
     curves:[
      {f:'log(x)/(2*PI)', col:'#5eead4', width:2.4, label:'cilindrica: ln(r)/2pi'},
      {f:'(1-1/x)/(4*PI)', col:'#b98cff', width:2.4, label:'sferica: (1-1/r)/4pi'}
     ],
     segs:[{x1:1, y1:0.0796, x2:12, y2:0.0796, col:'#ff6b6b', dash:true, width:1.4, label:'limite sferico: 1/4pi', lx:7, ly:0.088}],
     marks:[{x:2, y:0.0398, label:'meta del totale gia entro r=2', col:'#b98cff'}]}
   ],
   leggi:R`<b>Nel caso sferico quasi tutta la resistenza sta vicino al centro</b>: entro $r=2R_1$ si è già accumulata metà della resistenza totale, e da $r=10$ in poi non succede più niente. La ragione è geometrica e vale la pena averla in testa: la sezione cresce come $r^2$, quindi i gusci lontani sono «larghissimi» e contribuiscono pochissimo. <b>È il motivo per cui la resistenza di terra di un dispersore dipende dalle sue dimensioni e non da quanto è grande il terreno</b>, e perché conta molto il contatto immediato attorno all&rsquo;elettrodo.<br><br>
   Nel caso cilindrico la sezione cresce solo come $r$, e il logaritmo non si ferma mai: si accumula sempre nuova resistenza, sempre più lentamente ma senza tetto. <b>Stessa integranda, due geometrie, due comportamenti qualitativi diversi</b> — ed è la firma che distingue $1/r$ da $1/r^2$, la stessa già incontrata con Gauss.`}
]},

/* ---------------- 04 · EFFETTO JOULE ---------------- */
{ num:'04', title:'Leffetto Joule: dove finisce il lavoro del campo', meta:'densita di potenza J·E · P = RI^2 = V^2/R · potenza per unita di volume · il bilancio energetico',
  blocchi:[
  {t:'prosa', title:'La forma locale, e quella che si usa nei circuiti', tag:'costruzione', html:R`
  <p>Il campo fa lavoro sui portatori; gli urti col reticolo trasformano quel lavoro in agitazione termica. La <b>densità di potenza dissipata</b> è
  $$p=\vec J\cdot\vec E\qquad\left[\text{W/m}^3\right],$$
  e con la legge di Ohm locale diventa $p=\dfrac{J^{2}}{\sigma}=\sigma E^{2}$.</p>
  <p>Integrando su un conduttore cilindrico si ottiene la forma nota:
  $$P=RI^{2}=\frac{V^{2}}{R}=VI.$$
  <b>Le tre scritture non sono intercambiabili a cuor leggero</b>: se è la corrente a essere fissata (serie) conviene $RI^2$ e la resistenza <i>maggiore</i> dissipa di più; se è la tensione (parallelo) conviene $V^2/R$ e dissipa di più la <i>minore</i>. Chi sbaglia questa scelta risponde esattamente al contrario, ed è la domanda trabocchetto più frequente su questo argomento.</p>
  <div class="note"><b>Perché la forma locale conta negli scritti:</b> più di un compito chiede «la potenza dissipata <i>per unità di volume</i>» in un pezzo di materiale in cui $\vec J$ non è uniforme — tipicamente un disco o un guscio percorso radialmente, o un disco in cui le correnti sono indotte. Lì $RI^2$ non si può usare, perché non c&rsquo;è una sola $I$ né una sola $R$: si usa $p=J^2/\sigma$ punto per punto e si integra sul volume.</div>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Due resistenze $R_1<R_2$ in <b>serie</b>: quale scalda di più? E in <b>parallelo</b>?`,
    a:R`In serie la corrente è comune, quindi $P=RI^2$: scalda di più $R_2$, la <b>maggiore</b>. In parallelo la tensione è comune, quindi $P=V^2/R$: scalda di più $R_1$, la <b>minore</b>. <b>Il criterio è sempre lo stesso di em-04</b>: prima si stabilisce quale grandezza è in comune, poi si sceglie la formula che la contiene.`},
   {q:R`Un conduttore percorso da corrente ha campo interno non nullo. Contraddice em-04?`,
    a:R`No, perché em-04 parla di <b>equilibrio elettrostatico</b>, cioè di cariche ferme. Qui le cariche si muovono, e il campo è proprio ciò che mantiene il moto: senza campo interno gli urti fermerebbero tutto. Il legame è quantitativo: $E=\rho J$, quindi in un buon conduttore il campo interno è piccolissimo — <b>e nel limite $\rho\to0$ si ritrova $E=0$</b>, cioè il conduttore ideale dell&rsquo;elettrostatica. I due capitoli sono i due estremi della stessa formula.`}
  ]}
]},

/* ---------------- 05 · I TRANSITORI RC ---------------- */
{ num:'05', title:'Il circuito RC: il transitorio, la costante di tempo, e la meta di energia che si perde sempre', meta:'carica e scarica · tau = RC · il bilancio energetico che non dipende da R',
  blocchi:[
  {t:'prosa', title:'Lequazione, e la sua soluzione', tag:'costruzione', html:R`
  <p>Un generatore $V_0$, una resistenza $R$, un condensatore $C$ inizialmente scarico. La legge delle maglie dà $V_0=RI+\frac{q}{C}$ con $I=\dot q$, cioè
  $$R\dot q+\frac{q}{C}=V_0,$$
  una ODE lineare del primo ordine. La soluzione con $q(0)=0$:
  $$q(t)=CV_0\left(1-e^{-t/\tau}\right),\qquad I(t)=\frac{V_0}{R}e^{-t/\tau},\qquad \boxed{\tau=RC}.$$
  Nella <b>scarica</b> (generatore rimosso, condensatore carico) valgono $q=CV_0e^{-t/\tau}$ e la stessa $\tau$.</p>
  <p><b>La costante di tempo è l&rsquo;unica cosa da ricordare</b>, e ha un significato leggibile: dopo $\tau$ manca ancora il 37%, dopo $3\tau$ il 5%, dopo $5\tau$ meno dell&rsquo;1%. Un&rsquo;$R$ grande rallenta (fatica a spostare carica), una $C$ grande rallenta (ce n&rsquo;è di più da spostare).</p>`},
  {t:'reveal', title:'Il bilancio energetico, e il fatto che sorprende sempre', tag:'idea', steps:[
   {label:'I tre conti', body:R`
   <p>Durante la <b>carica</b>, fino a $t\to\infty$:</p>
   <ul>
    <li>il generatore fornisce $\displaystyle\int_0^\infty V_0I\,dt=CV_0^{2}$;</li>
    <li>il condensatore immagazzina $\frac12CV_0^{2}$;</li>
    <li>la resistenza dissipa $\displaystyle\int_0^\infty RI^{2}dt=\frac12CV_0^{2}$.</li>
   </ul>
   <p><b>Esattamente metà dell&rsquo;energia fornita viene dissipata</b>, sempre.</p>`},
   {label:'Perche non dipende da R, ed e il punto', body:R`
   <p>La cosa notevole è che quel $\frac12CV_0^2$ <b>non contiene $R$</b>. Con una resistenza piccolissima il transitorio è velocissimo e la corrente enorme, con una grande è lento e la corrente piccola — e l&rsquo;energia bruciata è <b>la stessa</b>. Non si può caricare un condensatore «con attenzione» per sprecare meno: nel circuito RC il 50% è una tassa fissa.</p>
   <p><b>Come si aggira, e perché la domanda non è oziosa:</b> caricando <i>a gradini</i>, con tensioni via via crescenti, la perdita si riduce a piacere — ed è esattamente il principio dei convertitori a commutazione. Il 50% non è una legge di natura: è la conseguenza di aver imposto <b>tutta insieme</b> la differenza di potenziale finale, cioè di aver fatto una trasformazione irreversibile. <b>È lo stesso conto dell&rsquo;espansione libera di un gas</b>, e chi farà meccanica statistica lo riconoscerà.</p>`}
  ]},
  {t:'plot', title:'Carica di un condensatore: le due energie, e la meta che se ne va',
   intro:R`In unità $CV_0^2=1$ e $\tau=1$: energia fornita dal generatore, energia immagazzinata nel condensatore, energia dissipata nella resistenza.`,
   plots:[
    {kind:'func2d', xr:[0,5], yr:[0,1.05], height:340,
     title:'le tre energie durante la carica: il generatore da 1, il condensatore ne tiene 1/2',
     xlabel:'t / tau', ylabel:'energia (unita di C V0^2)',
     curves:[
      {f:'1-exp(-x)', col:'#d8a13a', width:2.4, label:'fornita dal generatore'},
      {f:'0.5*pow(1-exp(-x),2)', col:'#5eead4', width:2.4, label:'immagazzinata in C'},
      {f:'0.5*(1-exp(-2*x))', col:'#ff9b6b', width:2.4, label:'dissipata in R'}
     ],
     segs:[{x1:0, y1:0.5, x2:5, y2:0.5, col:'#ff6b6b', dash:true, width:1.3, label:'1/2', lx:4.4, ly:0.53},
           {x1:0, y1:1, x2:5, y2:1, col:'#4d5a6b', dash:true, width:1.2}],
     marks:[{x:1, y:0.4323, label:'a t=tau', col:'#ff9b6b'},
            {x:5, y:0.5, label:'le due meta', col:'#5eead4', up:true}]}
   ],
   leggi:R`Le due curve basse <b>convergono allo stesso valore</b>, $\frac12$: metà dell&rsquo;energia finisce nel condensatore e metà nella resistenza, e la somma è la curva oro. <b>Cambiare $R$ cambia solo l&rsquo;asse dei tempi</b> — le tre curve si comprimono o si allargano orizzontalmente — ma i valori finali restano quelli. È il senso grafico di «la perdita non dipende da $R$».<br><br>
   Da guardare anche la <b>forma</b>: la dissipazione (arancione) è veloce all&rsquo;inizio, quando la corrente è massima, ed è già quasi tutta avvenuta a $t=\tau$; l&rsquo;accumulo nel condensatore (verde) parte lento, perché all&rsquo;inizio la carica è poca e $U\propto q^2$. <b>Nel primissimo istante il circuito è pura dissipazione</b>: il condensatore scarico si comporta come un cortocircuito, e infatti la corrente iniziale è $V_0/R$, la massima di tutto il transitorio.`}
]},

/* ---------------- 06 · IL SENSO ---------------- */
{ num:'06', title:'Il senso, e le rotte', meta:'cosa chiude, cosa apre, e dove la continuita riappare',
  blocchi:[
  {t:'prosa', title:'Cosa lascia in mano', tag:'sintesi', html:R`
  <p><b>A monte.</b> Il teorema della divergenza di Analisi Vettoriale trova qui il suo impiego più limpido: non serve a calcolare un flusso, serve a <b>trasformare una legge di conservazione globale in un&rsquo;equazione locale</b>. È il passaggio concettuale più importante di tutto il corso.</p>
  <p><b>Il punto.</b> Le leggi dei circuiti — nodi, maglie, serie, parallelo — <b>non sono un capitolo a parte</b>: sono $\nabla\cdot\vec J=0$ e la conservatività del campo, applicate a una topologia di fili. Saperlo significa non doverle ricordare.</p>
  <p><b>A valle.</b> em-08 scopre che le correnti generano campo magnetico; em-10 che un campo variabile genera correnti; em-10b rifà questa tappa con generatori sinusoidali e trova che $R$, $C$ ed $L$ diventano un solo numero complesso; em-11 aggiunge alla legge di Ampère il termine che manca proprio nel caso «condensatore in carica» segnalato nella tappa 02.</p>`},
  {t:'prolessi', title:'Dove riappare questo movimento, nella fisica che farai',
   oggetto:R`<b>L&rsquo;equazione di continuità</b>: la forma locale di «questa quantità non si crea né si distrugge».`,
   rotte:[
    {dove:'Meccanica<br>quantistica', txt:R`Dall&rsquo;equazione di Schrödinger si ricava $\partial_t|\psi|^2+\nabla\cdot\vec J=0$ con $\vec J=\frac{\hbar}{m}\mathrm{Im}(\psi^*\nabla\psi)$: la <b>probabilità si conserva</b> con la stessa identica struttura. Il calcolo è una riga, e la struttura è questa.`},
    {dove:'Fluidodinamica<br>e statistica', txt:R`$\partial_t\rho+\nabla\cdot(\rho\vec v)=0$ è la conservazione della massa; l&rsquo;equazione di Liouville è la conservazione della probabilità nello spazio delle fasi. <b>Ogni legge di conservazione della fisica ha questa forma</b>, e riconoscerla fa risparmiare una derivazione ogni volta.`},
    {dove:'Relativita', txt:R`Carica e densità di corrente si uniscono nel quadrivettore $J^\mu=(c\rho,\vec J)$, e l&rsquo;equazione di continuità diventa $\partial_\mu J^\mu=0$ — <b>una sola equazione covariante</b>. In em-14 vedrai che è la forma in cui la conservazione della carica è manifestamente la stessa in ogni riferimento.`},
    {dove:'Teoria<br>dei campi', txt:R`Il teorema di Noether associa a ogni simmetria continua una <b>corrente conservata</b> $\partial_\mu J^\mu=0$. La conservazione della carica elettrica corrisponde all&rsquo;invarianza di gauge $U(1)$: quella che qui è contabilità diventa la conseguenza di una simmetria.`}
   ],
   domanda:R`In questa tappa il regime è stazionario e la corrente «c&rsquo;è già». Ma da dove viene l&rsquo;energia che mantiene il moto contro gli urti, e <b>per che strada arriva</b> al resistore? La risposta ingenua — «lungo il filo, coi portatori» — è sbagliata: il calcolo del vettore di Poynting (em-12) mostra che l&rsquo;energia entra nel resistore <b>dai lati, attraverso il campo che lo circonda</b>, e il filo serve solo a guidarla. <b>Domanda che porti avanti:</b> se l&rsquo;energia viaggia nello spazio attorno ai conduttori e non dentro, che cosa sono davvero un cavo e un circuito? È il punto in cui il modello a circuiti mostra di essere un&rsquo;approssimazione, e in cui l&rsquo;elettromagnetismo diventa una teoria di campo anche per gli ingegneri.`}
]}

];


/* =================================================================== */
var byId = {}; TAPPE.forEach(function(s){ byId[s.num]=s; });

var VKEY='pm-nucleoem-07-visited';
function loadSeen(){ try{ return new Set(JSON.parse(localStorage.getItem(VKEY)||'[]')); }catch(e){ return new Set(); } }
function saveSeen(s){ try{ localStorage.setItem(VKEY, JSON.stringify(Array.from(s))); }catch(e){} }
var SEEN = loadSeen();

function renderNav(active){
  var nav=document.getElementById('sidebar');
  nav.innerHTML='';
  var h=document.createElement('h2'); h.textContent='Nucleo em-07 · le tappe'; nav.appendChild(h);
  TAPPE.forEach(function(s){
    var b=document.createElement('button');
    b.className='navitem'+(active===s.num?' active':'')+(SEEN.has(s.num)?' seen':'');
    b.innerHTML='<span class="dot"></span><span class="nx">'+s.num+'</span><span>'+s.title+'</span>';
    b.onclick=function(){ showTappa(s.num); };
    nav.appendChild(b);
  });
}

/* ---- renderer dei blocchi ---- */
function sectionProsa(title, tag, html){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var body=elFromHTML('<div class="open-body">'+html+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function sectionGram(title, rows){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag gramtag">grammatica</span></h3>';
  var inner='<table class="gramtab">';
  rows.forEach(function(r){ inner+='<tr><td class="gs">'+r[0]+'</td><td>'+r[1]+'</td></tr>'; });
  inner+='</table>';
  var body=elFromHTML('<div class="gramwrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
/* --- blocco PLOT: la figura non decora, si legge. Ogni plot porta una chiave di lettura. --- */
function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';
  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
    else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
    else if(b.t==='prolessi') m.appendChild(sectionProlessi(b));
    else if(b.t==='reveal')m.appendChild(sectionReveal(b.title,b.tag,b.steps));
    else if(b.t==='esercizio') m.appendChild(sectionEsercizio(b));
    else if(b.t==='collaudo')  m.appendChild(sectionCollaudo(b.title,b.items));
    else if(b.t==='plot')      m.appendChild(sectionPlot(b));
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}

/* deep-link: em-07-la-corrente.html#03 apre direttamente la tappa 03 */
window.addEventListener('DOMContentLoaded', function(){
  var h=(location.hash||'').replace('#','');
  showTappa(byId[h]?h:'00');
});
window.addEventListener('hashchange', function(){
  var h=(location.hash||'').replace('#','');
  if(byId[h]) showTappa(h);
});
</script>
