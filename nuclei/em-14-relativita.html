/* ===================================================================

   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un

   =================================================================== */
var CORSO = 'elettromagnetismo';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["flusso-di-un-campo"] = {"nome":"Flusso di un campo","riga":"L'integrale $\\iint_S\\mathbf F\\cdot\\hat n\\,dS$: quanta parte del campo attraversa la superficie, contata col segno che l'orientazione stabilisce.","serve":"Traduce «quanto passa attraverso» in un numero, e il numero dipende da due scelte che vanno dichiarate entrambe: la superficie e il verso della normale. Su una superficie chiusa la convenzione è normale uscente, e allora un flusso positivo significa che dentro c'è una sorgente netta. Dove il campo è parallelo alla superficie il contributo è nullo: conta solo la componente normale, mai il modulo.","esempio":"Per il campo radiale $\\mathbf F=\\mathbf r$ sulla sfera di raggio $R$ la normale uscente è $\\hat r$, e la componente normale vale $R$ in ogni punto, costante: il flusso è quel valore per l'area, $\\Phi=R\\cdot4\\pi R^{2}=4\\pi R^{3}$. Per $R=2$ fa $32\\pi$.","pieno":{"file":"03-curve-superfici.html","tappa":"04","come":"la definizione, il ruolo dell'orientazione e l'indipendenza dalla parametrizzazione, nel nucleo su curve e superfici"},"qui":{"elettromagnetismo":{"serve":"Il flusso di $\\mathbf E$ attraverso una superficie chiusa è l'unica cosa che la legge di Gauss controlla: dice quanto esce in totale, non quanto vale $\\mathbf E$ punto per punto. Da un solo numero si risale al campo soltanto se si sa già in che direzione punta e da cosa dipende — e quello lo decide la simmetria della distribuzione, non il teorema. Per questo la superficie si sceglie: dove $\\mathbf E$ è costante e normale, il flusso diventa modulo per area.","esempio":"Per una carica puntiforme $q$ al centro di una sfera di raggio $R$ il campo ha modulo $\\dfrac{q}{4\\pi\\varepsilon_0R^{2}}$ ed è ovunque normale alla sfera, quindi $\\Phi=\\dfrac{q}{4\\pi\\varepsilon_0R^{2}}\\cdot4\\pi R^{2}=\\dfrac{q}{\\varepsilon_0}$: il raggio è sparito. È il motivo per cui la legge di Gauss è una legge e non un conto — vale per qualunque superficie chiusa che racchiuda la carica."}},"controllo":[{"tipo":"uguale","sinistra":"R*4*pi*R**2","vale":"4*pi*R**3","dove":"esempio","appare":"4\\pi R^{3}"},{"tipo":"uguale","sinistra":"4*pi*2**3","vale":"32*pi","dove":"esempio","appare":"32\\pi"},{"tipo":"uguale","sinistra":"q/(4*pi*e0*R**2)*4*pi*R**2","vale":"q/e0","dove":"qui.elettromagnetismo.esempio","appare":"\\dfrac{q}{\\varepsilon_0}"},{"tipo":"derivata","espr":"q/(4*pi*e0*R**2)*4*pi*R**2","rispetto":["R"],"vale":"0","dove":"qui.elettromagnetismo.esempio","appare":"il raggio è sparito"}]};
STRUM["simmetrie"] = {"nome":"Simmetrie","riga":"L'insieme delle trasformazioni che lasciano identica la sorgente, e che perciò devono lasciare identico anche il campo che ne nasce.","serve":"È il ragionamento che decide la FORMA del campo prima di calcolarlo, e senza il quale la legge di Gauss non serve a niente: Gauss dà un solo numero — il flusso totale — e da un numero si ricava un campo soltanto se si sa già in che direzione punta e da quali variabili dipende. L'argomento ha una forma sola: se una trasformazione lascia identica la distribuzione di carica, lascia identico il campo; quindi ogni componente che quella trasformazione cambierebbe deve essere nulla, e ogni variabile che essa sposta non può comparire.","esempio":"Per un filo infinito uniformemente carico, la traslazione lungo il filo e la rotazione attorno a esso lasciano la carica identica: $\\mathbf E$ non può dipendere né da $z$ né dall'angolo. La riflessione nel piano perpendicolare al filo manderebbe $E_z$ in $-E_z$ lasciando uguale la sorgente, quindi $E_z=0$; resta la sola componente radiale $E_r(r)$. Solo a quel punto il cilindro coassiale è la superficie giusta, e Gauss dà $E_r\\cdot 2\\pi rL=\\dfrac{\\lambda L}{\\varepsilon_0}$, da cui $E_r=\\dfrac{\\lambda}{2\\pi\\varepsilon_0 r}$.","debito":"nessun nucleo del percorso tratta l'argomento di simmetria come strumento a sé: qui c'è la forma dell'argomento e non la sua giustificazione, che è di teoria dei gruppi e sta fuori dal percorso costruito finora. Quello che il percorso copre è il pezzo di destra — l'integrale di flusso, nel nucleo 03 tappa 04 — non il pezzo di sinistra che decide quale superficie scegliere.","controllo":[{"tipo":"uguale","sinistra":"(lam/(2*pi*e0*r))*2*pi*r*L","vale":"lam*L/e0","dove":"esempio","appare":"\\dfrac{\\lambda L}{\\varepsilon_0}"}]};
STRUM["campo-vettoriale"] = {"nome":"Campo vettoriale","riga":"Una funzione che a ogni punto dello spazio associa un vettore, scritta $\\mathbf{F}(x,y,z)=F_x\\,\\hat{\\imath}+F_y\\,\\hat{\\jmath}+F_z\\,\\hat{k}$ con le tre componenti funzioni del punto.","serve":"È il modo di dire «c'è qualcosa in ogni punto dello spazio, e ha una direzione». Serve perché permette di smettere di ragionare su coppie di oggetti che si attraggono a distanza e di ragionare su una proprietà dello spazio: la sorgente prepara il campo, e chi arriva dopo sente solo ciò che trova dove si trova.","esempio":"Il campo di una carica puntiforme $q$ nell'origine è $\\mathbf{E}=\\dfrac{q}{4\\pi\\varepsilon_0 r^{2}}\\hat{r}$: la direzione è radiale, il modulo dipende solo dalla distanza. Con $q=1$ e $4\\pi\\varepsilon_0=1$, nel punto $(3,4,0)$ si ha $r=5$, quindi il modulo vale $\\tfrac{1}{25}$ e il versore è $\\left(\\tfrac35,\\tfrac45,0\\right)$: la componente lungo $x$ è $\\tfrac{3}{125}$.","pieno":{"file":"04-campi-vettoriali.html","tappa":"00","come":"la trattazione completa, nel nucleo sui campi vettoriali di Analisi Vettoriale"},"qui":{"elettromagnetismo":{"serve":"È l'oggetto che l'intero corso studia: $\\mathbf{E}$ e $\\mathbf{B}$ sono campi vettoriali, e le quattro equazioni di Maxwell sono affermazioni su come le loro derivate spaziali si legano alle sorgenti. Tutto ciò che si impara dopo — flusso, circuitazione, divergenza, rotore — è un modo di interrogare un campo vettoriale.","esempio":"Per la carica puntiforme in $(3,4,0)$ con $q=1$ e $4\\pi\\varepsilon_0=1$: $r=5$, modulo $\\tfrac{1}{25}$, e la componente lungo $x$ vale $\\tfrac{3}{125}$. Le tre componenti non sono tre campi separati: ruotando gli assi si mescolano fra loro, ed è quello che rende $\\mathbf{E}$ un vettore e non una terna di numeri."}},"controllo":[{"tipo":"uguale","sinistra":"sqrt(3**2+4**2)","vale":"5","dove":"esempio","appare":"r=5"},{"tipo":"uguale","sinistra":"1/sqrt(3**2+4**2)**2","vale":"1/25","dove":"esempio","appare":"\\tfrac{1}{25}"},{"tipo":"uguale","sinistra":"(1/5**2)*(3/5)","vale":"3/125","dove":"esempio","appare":"\\tfrac{3}{125}"},{"tipo":"uguale","sinistra":"sqrt(3**2+4**2)","vale":"5","dove":"qui.elettromagnetismo.esempio","appare":"r=5"},{"tipo":"uguale","sinistra":"(1/5**2)*(3/5)","vale":"3/125","dove":"qui.elettromagnetismo.esempio","appare":"\\tfrac{3}{125}"}]};

}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }

      card.innerHTML=schedaHTML(s);

/* ---------------- 00 · DI COSA PARLA QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Di cosa parla questo movimento', meta:'Elettromagnetismo · voce C.6 · nessuna prova lo chiede, e vale la pena lo stesso',
  blocchi:[
  {t:'prosa', title:'Il problema lasciato aperto da em-11', tag:'architettura', html:R`
  <p>Le equazioni di Maxwell contengono una velocità, $c=1/\sqrt{\varepsilon_0\mu_0}$, costruita con due costanti del vuoto. <b>Ma una velocità rispetto a cosa?</b> In meccanica newtoniana le velocità si compongono: se la luce va a $c$ per me, per chi corre a $v$ nella stessa direzione dovrebbe andare a $c-v$.</p>
  <p>Provando a cambiare riferimento con le trasformazioni di Galileo, <b>le equazioni di Maxwell cambiano forma</b>: in un riferimento in moto non sarebbero più le stesse, e si potrebbe stabilire chi è «davvero fermo» facendo esperimenti di elettromagnetismo in cantina. Per cinquant&rsquo;anni si è cercato quel riferimento privilegiato — l&rsquo;etere — senza trovarlo.</p>
  <p><b>La soluzione di Einstein è stata rovesciare il problema</b>: non sono le equazioni di Maxwell a essere sbagliate, sono le trasformazioni di Galileo. Questo movimento mostra che cosa ne segue per i campi.</p>
  <div class="note"><b>Una nota onesta sulla misura</b>, perché questo corso si costruisce su ciò che gli esami chiedono: la copertura dice <b>zero prove su cento</b> per questo movimento fra il 2008 e il 2021. È nel programma di Bini (voce C.6) ma agli scritti non cade. <b>Sta qui perché chiude il corso</b>, perché risponde alla domanda lasciata aperta da tre movimenti, e perché è il ponte verso Meccanica Quantistica e la teoria dei campi. Se stai preparando lo scritto la settimana prima, questo è il movimento da leggere per ultimo.</div>`}
]},

/* ---------------- 01 · IL FILO ---------------- */
{ num:'01', title:'Lesperimento che decide: un filo visto da fermo e visto di corsa', meta:'nel laboratorio: forza magnetica · nel riferimento della carica: forza elettrica · e la contrazione che spiega tutto',
  blocchi:[
  {t:'reveal', title:'La stessa forza, due spiegazioni incompatibili', tag:'idea', steps:[
   {label:'Nel laboratorio', body:R`
   <p>Un filo percorso da corrente $I$ è <b>elettricamente neutro</b>: le cariche positive del reticolo e quelle negative degli elettroni si compensano. Una carica $q$ esterna si muove parallela al filo con velocità $v$.</p>
   <p>Poiché il filo è neutro, non c&rsquo;è campo elettrico. C&rsquo;è però un campo magnetico, e la carica in moto sente $\vec F=q\vec v\times\vec B$: <b>una forza puramente magnetica</b>, attrattiva o repulsiva a seconda dei versi.</p>`},
   {label:'Nel riferimento della carica', body:R`
   <p>Ora si guarda lo stesso fenomeno dal riferimento in cui <b>la carica è ferma</b>. Una carica ferma non può sentire forze magnetiche — $\vec v=0$ annulla la forza di Lorentz. <b>Eppure la forza c&rsquo;è</b>: che la carica si avvicini al filo è un fatto osservabile, non una questione di punto di vista.</p>
   <p>L&rsquo;unica possibilità è che in quel riferimento ci sia un <b>campo elettrico</b>. Ma il filo era neutro… nel <i>laboratorio</i>.</p>`},
   {label:'La contrazione delle lunghezze, e il conto torna', body:R`
   <p>Nel riferimento della carica le due specie di portatori hanno velocità <b>diverse</b> rispetto a prima: gli elettroni rallentano (o accelerano) e il reticolo si muove. Le due densità lineari di carica subiscono quindi <b>contrazioni di Lorentz diverse</b>, e non si compensano più: <b>il filo appare carico</b>.</p>
   <p>Quella carica netta produce un campo elettrico radiale, e la forza risultante è <b>esattamente la stessa</b> calcolata prima come magnetica. <b>Il campo magnetico è il campo elettrico visto da un altro riferimento</b>, e la costante che governa il cambio è $c$.</p>
   <div class="note"><b>Il dettaglio che rende il conto spettacolare.</b> La velocità di deriva degli elettroni in un filo è di frazioni di millimetro al secondo: il fattore di contrazione differisce da 1 per una parte su $10^{24}$. Eppure la forza magnetica fra due fili si misura senza difficoltà e <b>definiva l&rsquo;ampere</b>. Il motivo è che la carica di un metro di filo è enorme: un effetto relativistico infinitesimo su un numero gigantesco dà un risultato di laboratorio. <b>Il magnetismo è un effetto relativistico che si vede a velocità da lumaca</b>, e questo è il fatto più sorprendente del corso.</div>`}
  ]},
  {t:'prosa', title:'Il conto, fatto per intero', tag:'derivazione', html:R`
  <p>L&rsquo;argomento qualitativo convince, ma il numero deve tornare <i>esattamente</i>, e conviene vederlo: è il conto che rende questo movimento una dimostrazione invece di un racconto.</p>
  <p><b>Nel laboratorio.</b> Filo lungo l&rsquo;asse $x$, densità lineare positiva $+\lambda_0$ (il reticolo, fermo) e negativa $-\lambda_0$ (gli elettroni, in deriva con velocità $u$). Il filo è neutro: $\lambda=0$. La corrente è $I=\lambda_0 u$. Il campo magnetico a distanza $d$ vale $B=\dfrac{\mu_0I}{2\pi d}$, e su una carica $q$ che viaggia parallela al filo con velocità $v$ agisce</p>
  $$F=qvB=\frac{q\,v\,\mu_0 I}{2\pi d}.$$
  <p><b>Nel riferimento della carica.</b> Qui conviene non inseguire le due contrazioni separatamente — si può fare, ed è il conto di Purcell, ma è lungo e pieno di occasioni per sbagliare un segno. Si usa invece il fatto che densità di carica e corrente sono le componenti di un unico quadrivettore, $(c\lambda,\,I)$ per un filo: si trasformano come $(ct,x)$. Un boost di velocità $v$ lungo il filo dà quindi</p>
  $$\lambda'=\gamma\left(\lambda-\frac{vI}{c^{2}}\right)=-\frac{\gamma\,v\,I}{c^{2}},$$
  <p>perché $\lambda=0$. <b>Il filo, neutro nel laboratorio, è carico nel riferimento della carica</b> — e il segno dice che la carica netta è opposta al verso della corrente. Da qui il campo elettrico radiale a distanza $d$:</p>
  $$E'=\frac{\lambda'}{2\pi\varepsilon_0 d}=-\frac{\gamma\,v\,I}{2\pi\varepsilon_0c^{2}d},\qquad F'=qE'=-\frac{q\,\gamma\,v\,I}{2\pi\varepsilon_0c^{2}d}.$$
  <p><b>Il confronto.</b> Usando $\dfrac{1}{c^{2}}=\varepsilon_0\mu_0$, il rapporto fra le due forze è</p>
  $$\frac{|F'|}{F}=\gamma,$$
  <p>e questo <b>non è un errore, è il controllo che il conto è giusto</b>: una forza perpendicolare al moto non è invariante, si trasforma proprio con un fattore $\gamma$ quando si passa al riferimento in cui la particella è istantaneamente ferma. I due osservatori misurano forze diverse e <i>concordano su tutto ciò che è osservabile</i> — l&rsquo;accelerazione propria, il tempo che la carica impiega a raggiungere il filo, la traiettoria.</p>
  <div class="note"><b>Dove sta la sorpresa, detta precisamente.</b> Non è che «il magnetismo non esiste»: è che <b>una sola delle due descrizioni è necessaria</b>. Scelto un riferimento, o si parla di un filo neutro con campo magnetico, o di un filo carico con campo elettrico — mai di entrambi come cause indipendenti. E poiché il termine $vI/c^{2}$ che genera la carica netta è di ordine $v u/c^{2}$ rispetto alle densità in gioco, il magnetismo <b>è</b> la correzione di ordine $1/c^{2}$ all&rsquo;elettrostatica: piccola in ogni singolo atomo, gigantesca sommata su $10^{23}$ portatori.</div>`}
]},

/* ---------------- 02 · LE TRASFORMAZIONI DEI CAMPI ---------------- */
{ num:'02', title:'Come si trasformano E e B', meta:'le componenti lungo il moto restano · le trasverse si mescolano · il limite non relativistico',
  blocchi:[
  {t:'prosa', title:'Le formule, e come si leggono', tag:'regola operativa', html:R`
  <p>La <b>trasformazione di Lorentz</b> fra due riferimenti che si muovono di moto relativo uniforme non riguarda solo spazio e tempo: trascina con sé anche i campi. La <b>trasformazione dei campi</b> per un boost di velocità $v$ lungo l&rsquo;asse $x$, con $\gamma=1/\sqrt{1-v^{2}/c^{2}}$, è:</p>
  $$E'_x=E_x,\qquad E'_y=\gamma(E_y-vB_z),\qquad E'_z=\gamma(E_z+vB_y)$$
  $$B'_x=B_x,\qquad B'_y=\gamma\left(B_y+\frac{v}{c^{2}}E_z\right),\qquad B'_z=\gamma\left(B_z-\frac{v}{c^{2}}E_y\right)$$
  <p>Tre letture, e sono tutto quello che serve:</p>
  <ul>
   <li><b>le componenti lungo il moto non cambiano</b>; solo le trasverse si mescolano;</li>
   <li><b>$\vec E$ e $\vec B$ si trasformano l&rsquo;uno nell&rsquo;altro</b>: non sono due campi, sono le componenti di un solo oggetto. Un campo puramente magnetico in un riferimento ha una parte elettrica in un altro — è esattamente il caso del filo;</li>
   <li><b>nel limite $v\ll c$</b>, $\gamma\to1$ e resta $\vec E'\simeq\vec E+\vec v\times\vec B$: è la forza di Lorentz per unità di carica, cioè <b>il campo che «sente» una carica in moto</b>. La formula della forza magnetica di em-08 era già una trasformazione relativistica scritta al primo ordine, e nessuno lo sapeva.</li>
  </ul>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Esiste un riferimento in cui il campo di un'onda elettromagnetica è puramente elettrico?`,
    a:R`<b>No</b>, e la tappa 03 dice perché: in un&rsquo;onda piana $E=cB$, quindi $E^{2}-c^{2}B^{2}=0$, e quell&rsquo;espressione è <b>invariante</b>. Se in un riferimento fosse $B'=0$, l&rsquo;invariante varrebbe $E'^2>0$: impossibile. <b>Un&rsquo;onda è un&rsquo;onda per tutti</b>, per quanto veloce si corra — e questo è già metà della relatività.`}
  ]}
]},

/* ---------------- 02a · DA DOVE VENGONO QUELLE FORMULE ---------------- */
{ num:'02a', title:'Da dove vengono quelle formule: due condensatori visti di corsa', meta:'campo trasverso: le piastre si contraggono, sigma cresce · campo longitudinale: larea non cambia · e la carica e invariante',
  blocchi:[
  {t:'prosa', title:'Le sei formule non vanno imparate: si ricostruiscono', tag:'derivazione', html:R`
  <p>Le trasformazioni della tappa precedente sembrano sei formule da mandare a memoria, e non lo sono: i due casi che contano si ricavano in dieci righe da un condensatore piano e da un solo fatto sperimentale, che <b>la carica elettrica è un invariante relativistico</b> — un elettrone ha la stessa carica per chiunque, comunque si muova. (Non è ovvio e non è una convenzione: se non fosse vero, un atomo scaldato — in cui gli elettroni si muovono più in fretta dei nuclei — risulterebbe carico, e si misura che non lo è entro una parte su $10^{21}$.)</p>
  <p><b>Caso uno: campo perpendicolare al moto.</b> Un condensatore piano con le armature nel piano $xz$, campo $\vec E$ lungo $y$. Nel riferimento in cui è fermo, $E_y=\sigma/\varepsilon_0$ con $\sigma=Q/A$. Ora lo si guarda da un riferimento che si muove lungo $x$, cioè <i>parallelamente</i> alle armature: la loro dimensione lungo $x$ si <b>contrae</b> di $\gamma$, quella lungo $z$ no, quindi</p>
  $$A'=\frac{A}{\gamma},\qquad \sigma'=\frac{Q}{A'}=\gamma\sigma,\qquad E'_y=\frac{\sigma'}{\varepsilon_0}=\gamma E_y.$$
  <p>La carica $Q$ non cambia perché è invariante; l&rsquo;area sì. <b>È tutto qui il $\gamma$ delle componenti trasverse.</b></p>
  <p><b>Caso due: campo lungo il moto.</b> Stesso condensatore ruotato, armature nel piano $yz$ e campo lungo $x$. Adesso il boost è <i>perpendicolare</i> alle armature: a contrarsi è la distanza fra loro, non la loro area. Quindi $\sigma$ non cambia, e</p>
  $$E'_x=E_x.$$
  <p>Il campo resta lo stesso mentre la distanza si accorcia — e infatti la differenza di potenziale fra le armature <i>cambia</i>. <b>Le due componenti si comportano in modo opposto per una ragione puramente geometrica</b>: la contrazione agisce su una sola direzione, e conta se quella direzione sta dentro la superficie che porta la carica o la attraversa.</p>
  <p>Il ragionamento si regge sul <span class="str" data-str="flusso-di-un-campo">flusso</span> e su un argomento di <span class="str" data-str="simmetrie">simmetria</span>: fra due armature indefinite il campo è uniforme e perpendicolare in ogni riferimento, perché nessuna direzione trasversa è privilegiata. I termini misti con $\vec B$ — i pezzi $-vB_z$ e $+vB_y$ — si ottengono ripetendo l&rsquo;esercizio con un solenoide al posto del condensatore. <b>Nessuna delle sei formule richiede di ricordare un segno: richiede di sapere che cosa si contrae.</b></p>
  <div class="note"><b>Il controllo che conviene sempre fare</b>, e che qui è immediato: per $v\to0$ si ha $\gamma\to1$ e tutte e sei le formule si riducono a $\vec E'=\vec E$, $\vec B'=\vec B$. Se una trasformazione relativistica non restituisce l&rsquo;identità a velocità nulla, è sbagliata — e questo è il primo di tre controlli che valgono per ogni formula di questo movimento: il limite $\beta\to0$, l&rsquo;invarianza della carica, e la conservazione dei due invarianti della tappa 03.</div>`}
]},

/* ---------------- 02b · IL CAMPO DI UNA CARICA IN MOTO ---------------- */
{ num:'02b', title:'Il campo di una carica in moto uniforme: schiacciato, e ancora radiale', meta:'il fattore angolare · gamma sul piano trasverso, 1/gamma^2 in avanti · perche le linee restano radiali',
  blocchi:[
  {t:'prosa', title:'Che cosa vede chi sta fermo mentre la carica passa', tag:'derivazione', html:R`
  <p>Una carica $q$ viaggia a velocità costante $v$. Nel <i>suo</i> riferimento il campo è quello di Coulomb: radiale, isotropo, $\dfrac{q}{4\pi\varepsilon_0r'^{2}}$. Applicando le trasformazioni della tappa precedente al contrario — e tenendo conto che anche le coordinate si contraggono — si ottiene il campo misurato nel laboratorio:</p>
  $$\vec E(\vec r)=\frac{q}{4\pi\varepsilon_0 r^{2}}\cdot\frac{1-\beta^{2}}{\left(1-\beta^{2}\sin^{2}\theta\right)^{3/2}}\,\hat r,\qquad \beta=\frac{v}{c},$$
  <p>dove $\theta$ è l&rsquo;angolo fra la direzione del moto e il punto in cui si misura, e $\vec r$ è la distanza dalla posizione <b>attuale</b> della carica.</p>
  <p><b>Tre cose da leggere in questa formula, e sono tutte inattese:</b></p>
  <ul>
   <li><b>il <span class="str" data-str="campo-vettoriale">campo</span> è ancora radiale</b>, e punta esattamente dove la carica si trova <i>adesso</i> — non dove era quando il segnale è partito. Non viola la causalità: la carica si muove di moto uniforme da sempre, quindi «dove si trova adesso» è prevedibile. Per una carica <i>accelerata</i> questo smette di valere, e la differenza è la radiazione;</li>
   <li><b>sul piano trasverso</b> ($\theta=90°$) il fattore vale $\dfrac{1-\beta^{2}}{(1-\beta^{2})^{3/2}}=\gamma$: il campo è <b>rafforzato</b>;</li>
   <li><b>in avanti e indietro</b> ($\theta=0$ o $180°$) il fattore vale $1-\beta^{2}=1/\gamma^{2}$: il campo è <b>indebolito</b>. Il rapporto fra trasverso e longitudinale è $\gamma^{3}$.</li>
  </ul>
  <p>Il campo di una carica veloce, quindi, <b>si schiaccia in un disco perpendicolare al moto</b>. A $\beta=0{,}99$ il fattore trasverso vale circa $7$ e quello longitudinale circa $0{,}02$: quasi tutto il campo sta in una falda sottile attorno al piano trasverso, che passa come una lama.</p>
  <p><b>È l&rsquo;immagine che rende il magnetismo inevitabile.</b> Se il campo elettrico di una carica in moto non è isotropo, la forza fra due cariche in moto non può essere quella di Coulomb — e la parte che manca, riscritta in funzione delle velocità, <i>è</i> la forza magnetica. Il magnetismo non è stato aggiunto: era la parte anisotropa dell&rsquo;elettricità, che a velocità basse nessuno vedeva.</p>`},
  {t:'plot', title:'Lo schiacciamento del campo: il fattore angolare a tre velocita',
   intro:R`Il fattore $\dfrac{1-\beta^{2}}{\left(1-\beta^{2}\sin^{2}\theta\right)^{3/2}}$ in funzione dell'angolo $\theta$ (in gradi) dalla direzione del moto. A $\theta=90°$ vale $\gamma$, a $\theta=0$ vale $1/\gamma^{2}$.`,
   plots:[
    {kind:'func2d', xr:[0,180], yr:[0,7.5], height:340,
     title:'a beta=0.99 il campo trasverso e 7 volte Coulomb, quello in avanti un cinquantesimo',
     xlabel:'theta (gradi dalla direzione del moto)', ylabel:'fattore rispetto a Coulomb',
     curves:[
      {f:'1', col:'#4d5a6b', width:1.6, dash:true, label:'beta=0 (Coulomb isotropo)'},
      {f:'(1-0.25)/pow(1-0.25*pow(sin(x*PI/180),2),1.5)', col:'#5eead4', width:2.2, label:'beta=0.5'},
      {f:'(1-0.81)/pow(1-0.81*pow(sin(x*PI/180),2),1.5)', col:'#d8a13a', width:2.2, label:'beta=0.9'},
      {f:'(1-0.9801)/pow(1-0.9801*pow(sin(x*PI/180),2),1.5)', col:'#b98cff', width:2.4, label:'beta=0.99'}
     ],
     marks:[{x:90, y:7.089, label:'gamma = 7.09', col:'#b98cff', left:true},
            {x:5, y:0.0199, label:'in avanti: 1/gamma^2', col:'#ff6b6b', up:true}]}
   ],
   leggi:R`<p><b>Tutte le curve partono e finiscono sotto la linea di Coulomb e stanno sopra solo vicino a $90°$</b>: il campo non aumenta ovunque, si <i>ridistribuisce</i>. Ed è obbligatorio che sia così — il flusso attraverso una superficie chiusa attorno alla carica vale $q/\varepsilon_0$ per chiunque, perché la carica è un invariante relativistico. Quello che il moto cambia non è quanto campo c'è, ma <b>dove</b>.</p>
   <p>La curva a $\beta=0{,}99$ è quasi zero per tutta la regione frontale e si impenna solo negli ultimi gradi: è il <b>disco</b>. Una carica ultrarelativistica che passa accanto a un atomo lo investe con un impulso di campo brevissimo e intenso, invece che con una spinta lunga e debole — e questo, non un dettaglio, è il meccanismo con cui le particelle veloci ionizzano la materia che attraversano, e la ragione per cui la perdita di energia per unità di percorso ha la forma che ha.</p>
   <p><b>Il controllo che conviene fare su questa figura</b>: a $\beta=0$ la curva è piatta a $1$, cioè Coulomb. Ogni formula relativistica deve ridurre alla sua versione classica quando $\beta\to0$, e qui si vede a occhio invece che per algebra.</p>`}
]},

/* ---------------- 03 · GLI INVARIANTI ---------------- */
{ num:'03', title:'Le due quantita su cui tutti sono daccordo', meta:'invariante relativistico: E^2 - c^2 B^2 e E·B · e cosa se ne ricava in pratica',
  blocchi:[
  {t:'prosa', title:'I due invarianti, e a cosa servono', tag:'idea', html:R`
  <p><b>Bettini</b> (cap. 10) introduce questi due oggetti subito dopo le trasformazioni, e per una ragione pratica prima ancora che concettuale: sono ciò che permette di rispondere senza trasformare niente. Benché $\vec E$ e $\vec B$ cambino da un riferimento all&rsquo;altro, <b>due combinazioni restano le stesse per tutti</b> — sono i due <b>invarianti relativistici</b> del campo elettromagnetico:
  $$E^{2}-c^{2}B^{2}\qquad\text{e}\qquad \vec E\cdot\vec B.$$
  Verificarlo è un esercizio di algebra sulle trasformazioni della tappa 02 — lungo, ma completamente meccanico — e le asserzioni di questo movimento lo controllano per intero.</p>
  <p><b>Servono a rispondere a domande che altrimenti richiederebbero conti lunghi:</b></p>
  <ul>
   <li>se $\vec E\cdot\vec B\ne0$, <b>nessun riferimento</b> vede un campo puramente elettrico o puramente magnetico: i due campi non sono mai perpendicolari per nessuno;</li>
   <li>se $\vec E\cdot\vec B=0$ e $E^{2}-c^{2}B^{2}>0$, esiste un riferimento in cui il campo è <b>puramente elettrico</b> (e viceversa se l&rsquo;invariante è negativo);</li>
   <li>per un&rsquo;onda piana <b>entrambi gli invarianti sono nulli</b>, ed è la firma invariante della radiazione: nessun riferimento può «fermare» la luce o renderla statica.</li>
  </ul>`},
  {t:'plot', title:'Quanto bisogna correre perche si veda: gamma e i due fattori del campo',
   intro:R`$\gamma$, il fattore trasverso ($=\gamma$) e quello longitudinale ($=1/\gamma^{2}$) in funzione di $\beta=v/c$. La scala verticale è tagliata a 8 per non schiacciare tutto il resto.`,
   plots:[
    {kind:'func2d', xr:[0,0.995], yr:[0,8], height:330,
     title:'fino a beta=0.5 non succede quasi niente: gamma vale 1.15',
     xlabel:'beta = v/c', ylabel:'fattore',
     curves:[
      {f:'1/sqrt(1-x*x)', col:'#5eead4', width:2.6, label:'gamma (campo trasverso)'},
      {f:'1-x*x', col:'#d8a13a', width:2.4, label:'1/gamma^2 (campo in avanti)'},
      {f:'1', col:'#4d5a6b', width:1.4, dash:true, label:'Coulomb'}
     ],
     marks:[{x:0.5, y:1.1547, label:'beta=0.5: gamma=1.15', col:'#5eead4', up:true},
            {x:0.9, y:2.294, label:'beta=0.9: gamma=2.29', col:'#5eead4', up:true, left:true},
            {x:0.99, y:7.089, label:'beta=0.99: 7.09', col:'#b98cff', left:true}]}
   ],
   leggi:R`<p><b>La curva di $\gamma$ è quasi piatta per metà del grafico</b>, e questa è la ragione storica per cui la relatività è stata scoperta tardi: a un decimo della velocità della luce — $30\,000$ km/s — $\gamma$ vale $1{,}005$, cioè mezzo percento. Tutti gli effetti di questo movimento restano invisibili finché non si arriva a frazioni sostanziali di $c$, con <b>una sola eccezione</b>, ed è quella della tappa 01: il magnetismo, dove il fattore minuscolo moltiplica un numero di portatori gigantesco.</p>
   <p>Guarda anche l'asimmetria fra le due curve: il campo in avanti si <b>dimezza</b> già a $\beta=0{,}7$, mentre quello trasverso a quel punto è cresciuto solo del $40\%$. La soppressione in avanti arriva prima dell'esaltazione trasversa, perché una va come $1-\beta^{2}$ e l'altra come $(1-\beta^{2})^{-1/2}$: la stessa quantità, con esponenti $1$ e $-1/2$. <b>Quando due effetti dipendono dalla stessa variabile con esponenti diversi, il più ripido si manifesta per primo</b> — ed è lo stesso ragionamento che decide la stabilità della bolla carica in un altro movimento di questo corso.</p>`},
  {t:'prosa', title:'Il ruolo degli invarianti', tag:'sintesi', html:R`
  <div class="note"><b>Il ruolo degli invarianti è metodologico e vale ben oltre questo corso</b>: in una teoria dove le grandezze dipendono dall&rsquo;osservatore, la prima cosa da cercare sono le combinazioni che non dipendono da nessuno — sono quelle che descrivono la <i>situazione fisica</i> e non il punto di vista. In relatività lo stesso ruolo lo hanno l&rsquo;intervallo spazio-temporale e la massa a riposo.</div>`}
]},

/* ---------------- 04 · LA FORMA COVARIANTE ---------------- */
{ num:'04', title:'Quattro equazioni che diventano due', meta:'il quadrivettore corrente · il tensore F · la forma manifestamente covariante',
  blocchi:[
  {t:'prosa', title:'La notazione che rende ovvio quello che era nascosto', tag:'sintesi', html:R`
  <p>Si raccolgono densità di carica e di corrente nella <b>quadricorrente</b> $J^{\mu}=(c\rho,\vec J)$ — un quadrivettore, che si trasforma come le coordinate — e i sei campi nel <b>tensore elettromagnetico</b> $F^{\mu\nu}$, antisimmetrico, che ha $\vec E$ nella prima riga e $\vec B$ nel blocco spaziale. Allora le quattro equazioni di Maxwell diventano <b>due</b>:
  $$\partial_\mu F^{\mu\nu}=\mu_0J^{\nu}\qquad\text{(Gauss e Ampère-Maxwell)}$$
  $$\partial_\mu F_{\nu\lambda}+\partial_\nu F_{\lambda\mu}+\partial_\lambda F_{\mu\nu}=0\qquad\text{(monopoli e Faraday)}$$
  <p><b>Scritte così, l&rsquo;invarianza è manifesta</b>: sono relazioni fra tensori, e un&rsquo;uguaglianza fra tensori che vale in un riferimento vale in tutti. Le trasformazioni della tappa 02, che sembravano sei formule da ricordare, sono semplicemente <b>come si trasforma un tensore di rango due</b>.</p>
  <p>E l&rsquo;equazione di continuità — quella che dice che la carica non si crea né si distrugge, ma al più scorre via — diventa $\partial_\mu J^{\mu}=0$: <b>una riga</b>. È la stessa forma che <b>Focardi</b> usa quando scrive la conservazione della carica come proprietà locale invece che come bilancio su un volume. Il fatto che l&rsquo;elettromagnetismo si scriva in modo così compatto solo in linguaggio relativistico è la prova più forte che quello sia il suo linguaggio naturale — e che lo fosse già nel 1865, vent&rsquo;anni prima che qualcuno se ne accorgesse.</p>`}
]},

/* ---------------- 04b · ESERCIZI ---------------- */
{ num:'04b', title:'Esercizi — tocca a te', meta:'non cadono allo scritto: servono allorale e a controllare di aver capito',
  blocchi:[
  {t:'esercizio', title:'1 · Esiste un riferimento in cui il campo e solo elettrico?',
   src:'domanda tipica da orale, risolubile in tre righe con gli invarianti',
   testo:R`In un certo riferimento si misura $\vec E=(0,\,E_0,\,0)$ e $\vec B=(0,\,0,\,B_0)$ con $E_0=2cB_0$. Esiste un riferimento inerziale in cui il campo è puramente elettrico? E uno in cui è puramente magnetico? Con quale velocità ci si arriva?`,
   steps:[
    {label:'La strada, che non richiede di trasformare niente', body:R`
    <p>Si calcolano i due invarianti: $\vec E\cdot\vec B=0$ (sono perpendicolari) e $E^{2}-c^{2}B^{2}=4c^{2}B_0^{2}-c^{2}B_0^{2}=3c^{2}B_0^{2}>0$.</p>
    <p>Il primo invariante nullo dice che <b>una delle due possibilità esiste</b>; il segno del secondo dice quale: positivo significa che il campo è «di tipo elettrico», quindi <b>esiste un riferimento puramente elettrico e nessuno puramente magnetico</b>. Nessun conto di trasformazione è stato necessario: è esattamente il servizio che gli invarianti rendono.</p>`},
    {label:'La velocita, e il valore residuo', body:R`
    <p>Il boost giusto è nella direzione $\vec E\times\vec B$ con $\dfrac{v}{c}=\dfrac{cB_0}{E_0}=\dfrac12$. In quel riferimento $B'=0$, e il valore di $E'$ si legge <b>dall&rsquo;invariante senza rifare la trasformazione</b>: $E'^{2}=E^{2}-c^{2}B^{2}=3c^{2}B_0^{2}$, quindi $E'=\sqrt3\,cB_0$, cioè $E'=\dfrac{\sqrt3}{2}E_0$ — <b>minore</b> del campo di partenza.</p>
    <p><b>Il controllo di coerenza</b>: $v/c=1/2$ è minore di uno, come dev'essere. Se avessimo avuto $E_0<cB_0$ la stessa formula darebbe $v>c$, cioè «quel riferimento non esiste» — ed è proprio il caso in cui l'invariante è negativo e il campo è di tipo magnetico. <b>La condizione $v<c$ e il segno dell'invariante sono la stessa affermazione</b>, scritta in due modi.</p>`}
   ]},
  {t:'esercizio', title:'2 · Due fili paralleli, e la domanda scomoda',
   src:'il caso che mostra i limiti del ragionamento della tappa 01',
   testo:R`Due fili paralleli percorsi da correnti concordi si attraggono. Prova a spiegare l'attrazione nel riferimento in cui gli elettroni di conduzione di uno dei due fili sono fermi. Il ragionamento della tappa 01 si applica ancora?`,
   steps:[
    {label:'Perche il caso e diverso', body:R`
    <p>Nella tappa 01 c'era <b>una sola carica di prova</b>, con una sola velocità, e passare al suo riferimento era lecito. In un filo ci sono <b>due specie</b> di portatori con velocità diverse: non esiste un riferimento in cui «il filo» è fermo, perché il reticolo e gli elettroni non possono esserlo insieme. Si può scegliere il riferimento degli elettroni di uno dei due fili, e allora il <i>suo</i> reticolo si muove.</p>`},
    {label:'Cosa succede, e la lezione', body:R`
    <p>In quel riferimento le densità dei due fili si ricombinano: entrambi risultano carichi, e la forza si riscrive come una somma di un contributo elettrico e di uno magnetico — nessuno dei due nullo. <b>La forza totale resta la stessa</b> (a meno del fattore $\gamma$ della trasformazione delle forze trasverse), ma la ripartizione fra «elettrico» e «magnetico» è diversa.</p>
    <p><b>La lezione è più importante del conto</b>: il caso del filo singolo con una carica di prova è <i>didattico</i>, non generale. In generale non si può eliminare il magnetismo scegliendo bene il riferimento — si può solo spostare il confine fra le due descrizioni. Ciò che non cambia mai sono i due invarianti e la forza totale su ciascun portatore. <b>Chi conclude dalla tappa 01 che «il magnetismo non esiste davvero» ha generalizzato un caso particolare</b>, ed è l'errore più comune su questo argomento.</p>`}
   ]},
  {t:'collaudo', title:'Controlla di aver capito', html:R`
  <ol>
  <li>Perché la carica elettrica dev'essere invariante perché tutto questo funzioni?</li>
  <li>Un'onda elettromagnetica può essere «fermata» correndole dietro abbastanza veloce?</li>
  <li>Se il campo di una carica in moto è più intenso sul piano trasverso, il flusso totale non dovrebbe aumentare?</li>
  <li>Perché la forza fra la carica e il filo risulta diversa nei due riferimenti, e questo non è una contraddizione?</li>
  </ol>`,
   sol:R`<ol>
   <li>Perché tutta la costruzione delle trasformazioni poggia sul fatto che il numeratore ($Q$) resti fisso mentre il denominatore (l'area, il volume) si contrae. Se anche $Q$ cambiasse, $\sigma'$ non sarebbe $\gamma\sigma$ e le formule dei campi sarebbero altre. La conferma sperimentale è la neutralità degli atomi, verificata a una parte su $10^{21}$.</li>
   <li>No. Per un'onda piana <b>entrambi</b> gli invarianti sono nulli, e restano nulli in ogni riferimento: non esiste un boost che porti a $B'=0$ (darebbe $E'^2>0$) né a $E'=0$. Al massimo si cambia la frequenza — è l'effetto Doppler relativistico — ma un'onda resta un'onda.</li>
   <li>No, ed è il controllo di coerenza della tappa 02b: il flusso attraverso una superficie chiusa vale $q/\varepsilon_0$ per chiunque, perché la carica è invariante. Il campo si <b>ridistribuisce</b> — cresce vicino al piano trasverso e cala in avanti — senza che il totale cambi.</li>
   <li>Perché una forza perpendicolare al moto non è invariante: si trasforma con un fattore $\gamma$. Ciò che i due osservatori devono condividere non è il valore della forza, ma <b>gli eventi</b>: che la carica colpisca il filo, e dopo quanto tempo proprio. E su quelli concordano.</li>
   </ol>`}
]},

/* ---------------- 05 · IL SENSO ---------------- */
{ num:'05', title:'Il senso, e le rotte', meta:'cosa chiude il corso, e cosa apre nel resto della fisica',
  blocchi:[
  {t:'prosa', title:'Cosa chiude', tag:'sintesi', html:R`
  <p><b>A monte, e chiude davvero.</b> em-08 diceva che le correnti generano campo magnetico, senza dire perché esista una seconda specie di campo. em-10 mostrava che «magnete fermo e spira in moto» e «spira ferma e magnete in moto» danno lo stesso effetto con due spiegazioni diverse. em-11 trovava una velocità senza riferimento. <b>Tutte e tre le domande hanno qui la stessa risposta</b>: c&rsquo;è un solo campo, e la divisione in elettrico e magnetico dipende da chi guarda.</p>
  <p><b>Il punto.</b> L&rsquo;elettromagnetismo non è stato «reso compatibile» con la relatività: <b>era già relativistico</b>. È la meccanica newtoniana ad aver dovuto cambiare. Quando due teorie confliggono, non è sempre la più recente a cedere — ed è una lezione che vale ogni volta che si incontra un&rsquo;incoerenza fra due pezzi di fisica.</p>`},
  {t:'prolessi', title:'Dove riappare questo movimento, nella fisica che farai',
   oggetto:R`<b>La covarianza</b>: le leggi hanno la stessa forma in ogni riferimento inerziale, e i campi si trasformano insieme.`,
   rotte:[
    {dove:'Relativita<br>generale', txt:R`Estendendo la richiesta a riferimenti <b>qualsiasi</b>, non solo inerziali, si arriva alla gravitazione: la metrica diventa un campo dinamico e il tensore energia-impulso — di cui $u$ e $\vec S$ di em-12 sono componenti — ne è la sorgente.`},
    {dove:'Teoria<br>dei campi', txt:R`$F^{\mu\nu}=\partial^\mu A^\nu-\partial^\nu A^\mu$ deriva dal potenziale, e l&rsquo;invarianza di gauge $A^\mu\to A^\mu+\partial^\mu\chi$ è il prototipo di tutte le teorie di gauge. <b>Generalizzando il gruppo si ottengono le interazioni deboli e forti.</b>`},
    {dove:'Meccanica<br>quantistica', txt:R`L&rsquo;equazione di Dirac nasce cercando un&rsquo;equazione quantistica covariante: da lì spin e antimateria. L&rsquo;<b>accoppiamento minimale</b> $\vec p\to\vec p-q\vec A$ è il modo in cui il campo di questo corso entra nell&rsquo;hamiltoniana.`},
    {dove:'Astrofisica', txt:R`I getti relativistici, la radiazione di sincrotrone e l&rsquo;effetto Doppler relativistico richiedono di trasformare i campi fra il riferimento del plasma e quello dell&rsquo;osservatore: <b>le formule della tappa 02 si usano come strumento quotidiano.</b>`}
   ],
   domanda:R`Il magnetismo è un effetto relativistico visibile a velocità di frazioni di millimetro al secondo, perché la carica in gioco è enorme. <b>Domanda che porti avanti:</b> quali altri effetti «relativistici» sono in realtà sotto i nostri occhi, mascherati da fenomeni ordinari? Due risposte che forse non ti aspetti: <b>il colore dell&rsquo;oro</b> — gli elettroni interni degli atomi pesanti viaggiano a una frazione apprezzabile di $c$, e la correzione relativistica sposta le righe di assorbimento nel visibile; e il fatto che <b>il mercurio sia liquido</b> a temperatura ambiente. La relatività non è solo una teoria delle alte velocità: è una correzione alla struttura di tutto ciò che è fatto di cariche.`}
]}

];

/* ---- renderer dei blocchi ---- */
function sectionProsa(title, tag, html){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var body=elFromHTML('<div class="open-body">'+html+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function sectionGram(title, rows){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag gramtag">grammatica</span></h3>';
  var inner='<table class="gramtab">';
  rows.forEach(function(r){ inner+='<tr><td class="gs">'+r[0]+'</td><td>'+r[1]+'</td></tr>'; });
  inner+='</table>';
  var body=elFromHTML('<div class="gramwrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
/* --- blocco PLOT: la figura non decora, si legge. Ogni plot porta una chiave di lettura. --- */
function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';
  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
    else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
    else if(b.t==='prolessi') m.appendChild(sectionProlessi(b));
    else if(b.t==='reveal')m.appendChild(sectionReveal(b.title,b.tag,b.steps));
    else if(b.t==='esercizio') m.appendChild(sectionEsercizio(b));
    else if(b.t==='collaudo')  m.appendChild(sectionCollaudo(b.title,b.items));
    else if(b.t==='plot')      m.appendChild(sectionPlot(b));
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}

/* deep-link: em-14-relativita.html#03 apre direttamente la tappa 03 */
window.addEventListener('DOMContentLoaded', function(){
  var h=(location.hash||'').replace('#','');
  showTappa(byId[h]?h:'00');
});
window.addEventListener('hashchange', function(){
  var h=(location.hash||'').replace('#','');
  if(byId[h]) showTappa(h);
});
</script>
