{ num:'00', title:'Di cosa parla questo movimento', meta:'Meccanica Statistica · voci A.2 e A.4 · il ponte fra meccanica e termodinamica',
  blocchi:[
  {t:'prosa', title:'Il movimento in cui nasce l entropia', tag:'architettura', html:R`
  <p>Fino a qui c&rsquo;era un problema aperto e nessuno strumento per risolverlo. Un sistema isolato di $N\sim10^{23}$ particelle si muove su una superficie di energia costante nello spazio delle fasi, e la termodinamica lo descrive con <b>tre soli numeri</b> — $E$, $V$, $N$ — mentre la meccanica ne pretenderebbe $6N$. <b>Come si passa da $6N$ coordinate a tre?</b> Questo movimento dà la risposta della meccanica statistica: si smette di seguire la traiettoria e si conta quanti microstati sono compatibili con lo stato macroscopico. Il conteggio si chiama <b>ensemble microcanonico</b>, e il suo logaritmo <b>è</b> l&rsquo;entropia.</p>
  <p style="text-align:center"><b>tutto ciò che è dinamico diventa, qui, un volume nello spazio delle fasi che si conta.</b></p>
  <p>È il movimento più importante del corso dal punto di vista concettuale, e conviene dirlo subito perché lo scritto direbbe il contrario. Nelle prove d&rsquo;esame il microcanonico compare in una minoranza di casi — quasi sempre il conto si fa più comodamente nel canonico — ma <b>l&rsquo;entropia si definisce qui</b>, e l&rsquo;entropia è ovunque. Questo è materiale d&rsquo;orale: la domanda non è «calcola», è «<i>da dove viene</i> il postulato, <i>perché</i> l&rsquo;entropia è un logaritmo, <i>perché</i> bisogna dividere per $N!$». Il conto del gas ideale lo faremo per intero — fino alla Sackur-Tetrode e al paradosso di Gibbs — perché è il conto che mostra il metodo funzionare, ed è quello che l&rsquo;orale chiede di saper svolgere.</p>
  <p><b>Come è fatto il movimento</b>, perché la strada è lunga e conviene sapere dove si sta andando. Prima il <b>postulato</b>: l&rsquo;equiprobabilità a priori dei microstati, da dove viene e cosa la sostiene (Liouville). Poi l&rsquo;oggetto geometrico: il <b>guscio di energia</b>, il volume $\Omega(E)$, la densità degli stati. Poi una parentesi indispensabile sulla <b>geometria in alta dimensione</b>, senza la quale niente di quello che segue ha senso — perché in $10^{23}$ dimensioni le cose non funzionano come nel piano. Poi il cuore: l&rsquo;<b>entropia di Boltzmann</b> $S=k\log\Omega$, e la dimostrazione che la sua forma logaritmica è <i>costretta</i> dall&rsquo;additività. Poi l&rsquo;<b>equipartizione</b> come primo frutto generale del formalismo. Poi il <b>gas ideale</b> svolto interamente, il <b>conteggio corretto di Boltzmann</b> e il <b>paradosso di Gibbs</b>. Infine, come si porta lo stesso problema all&rsquo;orale: lo si conta in due ensemble diversi e si controlla che diano la stessa termodinamica.</p>
  <div class="note"><b>Una cosa da tenere a mente dall&rsquo;inizio.</b> Il microcanonico è la meccanica statistica di un sistema <b>isolato</b>: energia fissata, nessuno scambio con l&rsquo;esterno. È l&rsquo;ensemble concettualmente primario — quello da cui si derivano tutti gli altri — ma anche il più scomodo per fare i conti, perché il vincolo $H=E$ è una $\delta$ che complica ogni integrale. Il canonico, che si costruisce da qui affacciando il sistema a un termostato, sarà più comodo; ma non si capisce il canonico senza aver capito che <b>nasce come una marginalizzazione del microcanonico</b>. Per questo si comincia da qui.</p></div>`}
]},

/* ---------------- 01 · IL POSTULATO FONDAMENTALE ---------------- */
{ num:'01', title:'Il postulato fondamentale: lequiprobabilita a priori', meta:'da dove viene il postulato · la giustificazione di Liouville · perche e un assioma e non un teorema',
  blocchi:[
  {t:'prosa', title:'Lenunciato, e perche serve', tag:'grammatica', html:R`
  <p>Il punto di partenza di tutta la meccanica statistica dell&rsquo;equilibrio è un&rsquo;unica affermazione, che le note di Crisanti chiamano <b>postulato della equiprobabilità a priori</b> e che si enuncia così:</p>
  <p style="text-align:center"><b>dato un sistema isolato in equilibrio, ogni microstato compatibile con l&rsquo;energia $E$ ha la stessa probabilità di manifestarsi.</b></p>
  <p>Se i microstati accessibili sono $\Omega$, la probabilità di ciascuno è $P=1/\Omega$. È un&rsquo;affermazione che sembra innocua e non lo è: dice che il sistema <b>non ha nessuna preferenza</b> per alcuno dei suoi stati accessibili, e questa è precisamente l&rsquo;ipotesi che permette di sostituire la dinamica — che non sappiamo risolvere — con un conteggio, che sappiamo fare. Il postulato è ciò che trasforma la meccanica statistica da programma in strumento.</p>
  <p><b>Perché lo si chiama <i>a priori</i>.</b> Non si sta dicendo che il sistema, osservato, passa lo stesso tempo in ogni stato — quella è l&rsquo;ipotesi ergodica, un&rsquo;affermazione sulla dinamica reale, che vale in casi particolari e non in generale. Si sta dicendo qualcosa di più modesto e di più forte insieme: <b>in assenza di ogni altra informazione oltre l&rsquo;energia</b>, la sola assegnazione di probabilità che non introduce un pregiudizio arbitrario è quella uniforme. Qualsiasi altra scelta privilegerebbe certi stati, e non c&rsquo;è niente nel problema — nessuna quantità conservata oltre $E$, $V$, $N$ — che giustifichi il privilegio.</p>`},
  {t:'prosa', title:'La giustificazione di Liouville, e i suoi limiti', tag:'costruzione', html:R`
  <p>Il postulato è un assioma, ma non è campato in aria: la meccanica classica ne offre un sostegno parziale, ed è importante sapere quanto arriva e dove si ferma. L&rsquo;argomento è il <b>teorema di Liouville</b>. Enunciato qui in due righe con la sua ipotesi — la dimostrazione appartiene alla dinamica hamiltoniana e non a questo movimento — il teorema dice: <i>lungo il flusso hamiltoniano la densità nello spazio delle fasi è conservata</i>, $d\rho/dt=0$, ovvero lo sciame dei punti rappresentativi si muove come un fluido incomprimibile. Da questo segue, come mostra Crisanti (pag. 31-33), che la condizione di equilibrio $\partial\rho/\partial t=0$ è soddisfatta se e solo se $\{\rho,H\}=0$, cioè se $\rho$ dipende dalle coordinate <b>solo attraverso le costanti del moto</b>.</p>
  <p>Ecco il sostegno: una densità <b>uniforme</b> sulla superficie di energia costante è funzione della sola $H$, quindi ha parentesi di Poisson nulla con $H$, quindi è stazionaria. Se il sistema parte con distribuzione uniforme sugli stati accessibili, <b>vi resta per sempre</b>. La distribuzione microcanonica non è una scelta qualunque fra le tante stazionarie: è quella che il teorema di Liouville rende auto-consistente con l&rsquo;equilibrio. Le note di Crisanti (pag. 48) lo dicono in modo netto: «il postulato è giustificato in parte, per i sistemi classici, dal teorema di Liouville, il quale mostra che, se la distribuzione è uniforme in un certo tempo, allora rimarrà tale».</p>
  <div class="note"><b>Dove l&rsquo;argomento si ferma, e perché è onesto dirlo.</b> Liouville mostra che l&rsquo;uniforme è <i>stazionaria</i>; non mostra che il sistema, partito da uno stato qualsiasi, <i>tenda</i> all&rsquo;uniforme. Ci sono infinite altre distribuzioni stazionarie — qualunque funzione di $H$ lo è. Il salto dall&rsquo;«è stazionaria» all&rsquo;«è quella giusta» richiede qualcosa in più: o l&rsquo;ergodicità (che la traiettoria copra densamente la superficie, così che le medie temporali coincidano con quelle uniformi), o l&rsquo;osservazione, dovuta a Boltzmann e resa rigorosa da Khinchin, che <b>per le poche osservabili termodinamicamente rilevanti</b> — quelle additive, somma di contributi di singola particella — l&rsquo;equivalenza vale comunque, quasi ovunque, per il solo fatto che $N\gg1$. Il postulato, in ultima analisi, si giustifica <i>a posteriori</i>: dà una termodinamica che è quella misurata. È un&rsquo;ipotesi «che sembra funzionare, e che al momento non si è stati in grado di eliminare» (Crisanti, pag. 28).</p></div>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Qual è la differenza fra il postulato di equiprobabilità e l&rsquo;ipotesi ergodica?`,
    a:R`Il <b>postulato</b> è un&rsquo;affermazione sulle probabilità: in assenza di altra informazione oltre $E$, tutti i microstati accessibili sono equiprobabili. L&rsquo;<b>ipotesi ergodica</b> è un&rsquo;affermazione sulla dinamica: la traiettoria reale visita la superficie di energia in modo tale che la media nel tempo di un&rsquo;osservabile coincida con la media sull&rsquo;ensemble uniforme. Il postulato si <i>giustifica</i> con l&rsquo;ergodicità dove questa vale, ma è più generale — regge anche quando l&rsquo;ergodicità in senso stretto fallisce, purché ci si limiti alle osservabili additive (teoremi di Khinchin). <b>Confonderli è l&rsquo;errore d&rsquo;orale più comune su questo punto.</b>`},
   {q:R`Il teorema di Liouville dimostra il postulato?`,
    a:R`No, e dirlo è un errore. Liouville dimostra che la distribuzione uniforme sugli stati accessibili è <b>stazionaria</b> (se parti uniforme, resti uniforme), perché essa dipende dalle coordinate solo tramite $H$ e quindi $\{\rho,H\}=0$. Non dimostra che il sistema <b>converga</b> all&rsquo;uniforme partendo da una distribuzione diversa — ci sono infinite altre distribuzioni stazionarie, tutte le funzioni di $H$. La convergenza richiede ergodicità o mixing, che sono ipotesi dinamiche in più. <b>Liouville rende il postulato consistente, non lo prova.</b>`}
  ]}
]},

/* ---------------- 02 · IL GUSCIO DI ENERGIA E LA DENSITA DEGLI STATI ---------------- */
{ num:'02', title:'Il guscio di energia, e il volume che si conta', meta:'lo spazio delle fasi · la delta di Dirac come vincolo · Omega(E) densita degli stati · le tre forme equivalenti',
  blocchi:[
  {t:'prosa', title:'Dalla probabilita al volume', tag:'costruzione', html:R`
  <p>Rendiamo operativo il postulato. In meccanica classica gli stati formano un continuo, quindi «contare i microstati» significa <b>misurare un volume nello spazio delle fasi</b>. Il vincolo è che l&rsquo;energia valga $E$, cioè che il punto rappresentativo stia sulla ipersuperficie $H(q,p)=E$. La densità di probabilità microcanonica si scrive allora, seguendo Crisanti (pag. 35-36) e Falcioni-Vulpiani (par. 3.1),</p>
  $$\rho(q,p)=\frac{1}{\Omega(E)}\,\delta\bigl(H(q,p)-E\bigr),\qquad \Omega(E)=\int d^{3N}q\,d^{3N}p\;\delta\bigl(H(q,p)-E\bigr).$$
  <p>La <span class="str" data-str="delta-di-dirac">delta di Dirac</span> qui non è un ornamento: è la macchina con cui si impone il vincolo di energia senza dover parametrizzare la superficie. E il modo in cui si <i>usa</i> davvero non è la definizione ma l&rsquo;identità $\delta(E-H)=\partial_E\,\theta(E-H)$, con $\theta$ la funzione a gradino. Sostituendola si scambia l&rsquo;integrale con la derivata e si ottiene</p>
  $$\Omega(E)=\frac{\partial}{\partial E}\underbrace{\int_{H\lt E} d^{3N}q\,d^{3N}p}_{\displaystyle \Sigma(E)},$$
  <p>dove $\Sigma(E)$ è il volume di <b>tutti</b> gli stati con energia fino a $E$ — un integrale elementare, un volume pieno — e la densità degli stati $\Omega(E)=\partial\Sigma/\partial E$ è la sua derivata. <b>Questa è la mossa che rende calcolabile il microcanonico</b>: non si integra mai una delta, si calcola un volume e lo si deriva.</p>`},
  {t:'prosa', title:'Guscio, corona, ipersfera: tre forme, un solo oggetto', tag:'definizione', html:R`
  <p>Fisicamente conta un guscio, non una superficie: nessuno strumento misura l&rsquo;energia con precisione infinita, e in meccanica quantistica i livelli sono discreti, quindi si prende un guscio di spessore $\delta E$ fra $E$ ed $E+\delta E$. Il numero di stati nel guscio è $\Omega(E)\,\delta E$, e Crisanti (pag. 45) lo scrive con due funzioni a gradino:</p>
  $$\Omega(E)\,\delta E=\int d^{3N}q\,d^{3N}p\;\bigl[\theta(E+\delta E-H)-\theta(E-H)\bigr].$$
  <p>C&rsquo;è qui un fatto che sarà il cardine della prossima tappa e che conviene anticipare: <b>le tre definizioni possibili del microcanonico sono equivalenti</b>. Si può prendere il volume della <i>corona</i> $E-\Delta\lt H\lt E$, o la <i>superficie</i> $H=E$, o addirittura l&rsquo;intera <i>ipersfera</i> $H\lt E$:</p>
  $$\int_{H\le E}\;\Longleftrightarrow\;\int_{H=E}\;\Longleftrightarrow\;\int_{E-\Delta\le H\le E}.$$
  <p>Sembra assurdo — un volume pieno e la sua sola buccia dovrebbero differire enormemente — e nel piano lo sarebbe. In $6N$ dimensioni no: il volume di un solido convesso è tutto concentrato in uno strato infinitamente sottile sotto la superficie. La ragione è puramente geometrica, dipende solo da $N\gg1$, e la vediamo nella tappa 03. Per ora basti registrare la conseguenza: <b>l&rsquo;entropia non dipende da quale delle tre definizioni si sceglie, né dallo spessore $\delta E$ del guscio</b>, perché tutte differiscono per termini di ordine $\log N$ contro il termine dominante di ordine $N$.</p>`},
  {t:'plot', title:'Perche Omega(E) e una funzione mostruosamente crescente',
   intro:R`In ascissa l'energia $E$ in unità arbitrarie. In ordinata la densità degli stati $\Omega(E)\propto E^{\frac{3N}{2}-1}$ del gas ideale, normalizzata a $1$ in $E=1$, per tre valori crescenti dell'esponente (cioè di $N$). Si guardi non la forma ma la ripidità.`,
   plots:[
    {kind:'func2d', xr:[0,1.25], yr:[0,3.2], height:320, ticks:6,
     title:'densita degli stati Omega(E) al crescere di N',
     curves:[
      {f:'pow(x,2)', col:'#5eead4', label:'N piccolo: Omega ~ E^2'},
      {f:'pow(x,5)', col:'#d8a13a', label:'N medio: Omega ~ E^5'},
      {f:'pow(x,14)', col:'#ff6b6b', label:'N grande: Omega ~ E^14'}
     ],
     xlabel:'E (energia)', ylabel:'Omega(E) normalizzata'}
   ],
   leggi:R`<p><b>La densità degli stati cresce come una potenza altissima dell&rsquo;energia</b>: per il gas ideale $\Omega(E)\propto E^{3N/2-1}$, cioè con esponente dell&rsquo;ordine di $10^{23}$. La figura mostra solo esponenti da $2$ a $14$ e già si vede il fenomeno: la curva è quasi piatta sotto $E=1$ e schizza verso l&rsquo;alto appena lo supera. Con l&rsquo;esponente vero, $\Omega(E)$ è di fatto <b>nulla ovunque tranne che in un intorno infinitamente stretto del valore massimo</b> di energia accessibile.</p>
   <p><b>Questa è la ragione fisica dell&rsquo;equivalenza fra guscio, corona e ipersfera.</b> Aggiungere all&rsquo;ipersfera $H\lt E$ gli stati di energia più bassa non cambia niente, perché quelli sono pochissimi: quasi tutto il volume sta all&rsquo;energia massima, cioè sulla buccia. È lo stesso motivo per cui l&rsquo;entropia non dipende dallo spessore $\delta E$: moltiplicare $\Omega$ per $\delta E$ aggiunge $\log\delta E$ a $S=\log(\Omega\,\delta E)$, un termine di ordine $\log N$ trascurabile rispetto a $\log\Omega\sim N$.</p>
   <p><b>Perché la ripidità conta oltre questo conto.</b> Il fatto che $\Omega(E)$ cresca in modo così violento con $E$ è ciò che, affacciando due sistemi, fa sì che l&rsquo;energia si distribuisca in un modo <i>quasi certo</i> — il massimo del prodotto $\Omega_1(E_1)\Omega_2(E-E_1)$ è così pronunciato da rendere le fluttuazioni invisibili. Tenere davanti agli occhi questa curva rende leggibile tutta la tappa 04.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Perché nel definire $\Omega(E)$ si preferisce derivare il volume $\Sigma(E)=\int_{H\lt E}$ invece di integrare la $\delta$ direttamente?`,
    a:R`Perché $\int_{H\lt E}d\Gamma$ è il volume di una regione piena, dove l&rsquo;hamiltoniana sta sotto una soglia, ed è un <b>integrale elementare</b> — per il gas ideale è il volume di una palla in $3N$ dimensioni. Integrare la $\delta(E-H)$ direttamente costringerebbe a parametrizzare la ipersuperficie $H=E$, che è complicata. L&rsquo;identità $\delta(E-H)=\partial_E\theta(E-H)$ (cioè la $\delta$ è la derivata del gradino) permette di calcolare il volume pieno e derivarlo alla fine: $\Omega=\partial\Sigma/\partial E$. <b>È il trucco operativo che regge ogni conto microcanonico.</b>`}
  ]}
]},

/* ---------------- 03 · LA GEOMETRIA IN ALTA DIMENSIONE ---------------- */
{ num:'03', title:'La geometria in alta dimensione, senza cui niente funziona', meta:'il volume dellipersfera · la concentrazione sulla superficie · perche meta esatta delle particelle sta a destra',
  blocchi:[
  {t:'reveal', title:'Il volume dellipersfera, e dove si nasconde', tag:'costruzione', steps:[
   {label:'Il volume di una palla in N dimensioni', body:R`
   <p>Serve un solo oggetto geometrico, e conviene ricavarlo perché ricompare in ogni conto. Il volume di una ipersfera di raggio $R$ in $N$ dimensioni ha la forma $Q(R)=C_N R^N$: il fattore $R^N$ è dimensionale, tutto il contenuto sta in $C_N$. Lo si trova con un trucco che Crisanti (pag. 41) svolge per esteso: si calcola l&rsquo;integrale gaussiano in due modi. In cartesiane,</p>
   $$\int_{\mathbb{R}^N} e^{-\sum_i x_i^{2}}\,d^{N}x=\left(\int_{-\infty}^{+\infty}e^{-x^2}dx\right)^{N}=\pi^{N/2}.$$
   <p>In coordinate polari lo stesso integrale è $\Omega_N\int_0^\infty e^{-r^2}r^{N-1}dr$, con $\Omega_N$ l&rsquo;angolo solido totale; la sostituzione $s=r^2$ lo riduce alla funzione Gamma di Eulero e dà $\Omega_N=2\pi^{N/2}/\Gamma(N/2)$. Integrando $\Omega_N r^{N-1}$ da $0$ a $R$ si ottiene la formula fondamentale</p>
   $$Q(R)=\frac{\pi^{N/2}}{\Gamma\!\left(\frac{N}{2}+1\right)}\,R^{N}.$$
   <p><b>Verifica su un caso noto.</b> In $N=3$ deve tornare il volume della palla ordinaria. $\Gamma(5/2)=\tfrac34\sqrt\pi$, quindi $Q(R)=\pi^{3/2}R^3/\Gamma(5/2)=\frac{4}{3}\pi R^{3}$: giusto. E la superficie, $S_N=\Omega_N R^{N-1}$, in $N=3$ vale $3\pi^{3/2}R^2/\Gamma(5/2)=4\pi R^{2}$, la sfera di sempre. La formula generale contiene la geometria elementare come caso $N=3$.</p>`},
   {label:'La concentrazione sulla superficie', body:R`
   <p>Ora il fatto che rende possibile la meccanica statistica. Prendiamo la ipersfera di raggio $R$ e togliamole un guscio esterno di spessore $\epsilon R$: quanto volume resta? Il rapporto fra il volume interno e quello totale è, poiché $Q\propto R^N$,</p>
   $$\frac{Q(R-\epsilon R)}{Q(R)}=(1-\epsilon)^{N}=\exp[N\log(1-\epsilon)].$$
   <p>Nel piano ($N=2$) togliere una buccia sottile lascia quasi tutto il disco. In alta dimensione no: $(1-\epsilon)^N\to0$ non appena $N\epsilon\gtrsim1$, cioè appena lo spessore relativo supera $1/N$. Con $N\sim10^{23}$, <b>un guscio spesso una parte su $10^{23}$ del raggio contiene già praticamente tutto il volume della palla</b>. Il volume di un solido convesso ad alta dimensione vive interamente sulla sua buccia.</p>
   <p>La stessa cosa si legge nel limite pulito $(1-x/N)^N\to e^{-x}$: se lo spessore relativo si tiene fisso a $x/N$, la frazione di volume residuo tende a $e^{-x}$, un numero di ordine uno solo finché $x=O(1)$, cioè finché lo spessore è dell&rsquo;ordine di $1/N$. È il conto con cui Crisanti (pag. 50) rende quantitativa la frase «volume e superficie coincidono per $N$ grande». <b>Ecco perché guscio, corona e ipersfera davano lo stesso $\Omega$</b>: differiscono per la parte interna, che in alta dimensione non pesa nulla.</p>`}
  ]},
  {t:'plot', title:'Il volume che fugge sulla buccia al crescere della dimensione',
   intro:R`In ascissa lo spessore relativo $\epsilon$ del guscio esterno rimosso. In ordinata la frazione di volume che resta nella palla interna, $(1-\epsilon)^{N}$, per tre dimensioni. Si osservi come il ginocchio si sposti verso l'origine al crescere di $N$.`,
   plots:[
    {kind:'func2d', xr:[0,0.15], yr:[0,1.05], height:320, ticks:6,
     title:'frazione di volume residuo (1-eps)^N',
     curves:[
      {f:'pow(1-x,3)', col:'#5eead4', label:'N=3: quasi tutto il volume resta'},
      {f:'pow(1-x,30)', col:'#d8a13a', label:'N=30: il volume comincia a fuggire'},
      {f:'pow(1-x,300)', col:'#ff6b6b', label:'N=300: tutto il volume e sulla buccia'}
     ],
     xlabel:'eps (spessore relativo del guscio)', ylabel:'frazione residua'}
   ],
   leggi:R`<p><b>La curva verde ($N=3$) è la nostra intuizione</b>: per togliere metà del volume di una palla ordinaria bisogna sbucciarla di un buon $20\%$ del raggio. È il mondo in cui la superficie e il volume sono cose diverse.</p>
   <p><b>La curva rossa ($N=300$) è il mondo della meccanica statistica</b>, e già a $300$ dimensioni — infinitamente meno delle $10^{23}$ vere — un guscio spesso l&rsquo;$1\%$ del raggio si porta via il $95\%$ del volume. Con $N$ di Avogadro il ginocchio è così vicino a zero da essere invisibile: <b>il volume è sulla buccia, punto</b>. Questa è la giustificazione geometrica di tutto ciò che segue: che si definisca $\Omega$ come volume dell&rsquo;ipersfera, come volume della corona o come misura della superficie, si ottiene lo stesso numero a meno di correzioni $\log N$.</p>
   <p><b>La morale operativa che porti all&rsquo;orale.</b> Ogni volta che in un conto compare la scelta fra «superficie di energia» e «volume sotto l&rsquo;energia», la risposta è che <i>non importa</i>, e il motivo è questa figura. Non è una comodità: è un fatto sulla geometria degli spazi ad alta dimensione, ed è specifico della meccanica statistica — è il primo posto in cui $N\gg1$ non è un dettaglio ma il contenuto.</p>`},
  {t:'prosa', title:'Un corollario che sorprende: meta esatta a destra', tag:'regola operativa', html:R`
  <p>La stessa geometria produce un fatto che a prima vista pare magico, e che Crisanti (pag. 45) svolge come esempio. Un gas perfetto in una scatola: qual è la probabilità che <b>esattamente</b> metà delle molecole stia nella metà destra? Se $2N$ molecole si dispongono a caso, la probabilità che $N+m$ stiano a destra è binomiale, e con Stirling diventa una gaussiana strettissima,</p>
  $$P_m=\frac{1}{2^{2N}}\binom{2N}{N+m}\simeq\frac{1}{\sqrt{\pi N}}\,e^{-m^{2}/N}.$$
  <p>La larghezza relativa di questa gaussiana è $\sigma/N\sim1/\sqrt{2N}$: con $N\sim10^{24}$ vale circa $10^{-12}$. <b>Le fluttuazioni del numero di particelle a destra sono una parte su mille miliardi.</b> Non è che «in media» ci sia metà gas a destra: è che <i>ogni singola osservazione</i> trova, con certezza pratica, metà gas a destra. Gli stati con uno sbilanciamento apprezzabile esistono — non sono vietati da niente — ma occupano una frazione talmente ridicola dello spazio delle configurazioni da non manifestarsi mai. <b>È la stessa concentrazione dei volumi, letta stavolta come una legge dei grandi numeri</b>, ed è il motore fisico dietro l&rsquo;irreversibilità: il sistema «va verso l&rsquo;equilibrio» perché l&rsquo;equilibrio è dove sta quasi tutto il volume disponibile.</p>`}
]},

/* ---------------- 04 · LENTROPIA DI BOLTZMANN ---------------- */
{ num:'04', title:'Lentropia di Boltzmann, e perche deve essere un logaritmo', meta:'il postulato S=k log Omega · laddivita costringe la forma · lequilibrio come massimo · i moltiplicatori di Lagrange',
  blocchi:[
  {t:'prosa', title:'Il postulato di Boltzmann', tag:'grammatica', html:R`
  <p>Abbiamo un conteggio, $\Omega(E,V,N)$, e vogliamo una termodinamica. Il ponte è il secondo postulato del corso, quello che Falcioni-Vulpiani (par. 2.3) chiamano <i>relazione di Boltzmann</i> e Crisanti (pag. 28) scrive nella forma spoglia</p>
  $$S=k\log\Omega,$$
  <p>l&rsquo;entropia è $k$ volte il logaritmo del numero di microstati accessibili (d&rsquo;ora in poi, con Crisanti, $k=1$). Come per l&rsquo;equiprobabilità, è un&rsquo;ipotesi e non un teorema: la si postula perché funziona. Ma a differenza dell&rsquo;equiprobabilità, la <b>forma</b> di questa ipotesi — il logaritmo — non è arbitraria: è costretta, e la costrizione vale la pena di vederla, perché è ciò che si chiede all&rsquo;orale sotto la domanda «perché proprio il logaritmo?».</p>`},
  {t:'reveal', title:'Perche il logaritmo, e non altro', tag:'costruzione', steps:[
   {label:'Laddivita e il vincolo che impone', body:R`
   <p>L&rsquo;entropia termodinamica è <b>estensiva</b>: due sistemi identici accostati hanno entropia doppia. E il conteggio degli stati è <b>moltiplicativo</b>: se il sistema $1$ ha $\Omega_1$ stati accessibili e il sistema $2$ ne ha $\Omega_2$, e sono indipendenti, il sistema composto ne ha $\Omega_1\cdot\Omega_2$ — ogni stato di uno si combina con ogni stato dell&rsquo;altro. Cerchiamo dunque una funzione $S=f(\Omega)$ che trasformi un prodotto in una somma:</p>
   $$f(\Omega_1\,\Omega_2)=f(\Omega_1)+f(\Omega_2).$$
   <p>Questa è l&rsquo;<b>equazione funzionale di Cauchy</b> per il logaritmo: sotto ipotesi minime di regolarità (monotonia, o continuità), l&rsquo;unica soluzione è $f(\Omega)=k\log\Omega$, con $k$ una costante che fissa solo le unità. <b>Non c&rsquo;è scelta</b>: se si vuole che l&rsquo;entropia sia additiva e il conteggio è moltiplicativo, l&rsquo;entropia <i>deve</i> essere il logaritmo del conteggio. Crisanti lo sottolinea con una frase da tenere (pag. 28): «il log introdotto da Boltzmann è essenziale per rendere estensiva l&rsquo;entropia».</p>`},
   {label:'Perche non basta dire moltiplicativo', body:R`
   <p>C&rsquo;è una sottigliezza che separa chi ha capito da chi ripete. Il prodotto $\Omega_1\Omega_2$ è il conteggio del composto <b>solo se i due sistemi non interagiscono e le loro energie sono fissate separatamente</b>. Ma affacciando due sistemi che si scambiano energia, l&rsquo;energia totale $E=E_1+E_2$ è fissata mentre $E_1$ e $E_2$ fluttuano: il conteggio del composto non è $\Omega_1(E_1)\Omega_2(E_2)$ per una coppia data, ma la <i>somma</i> su tutte le ripartizioni compatibili,</p>
   $$\Omega(E)=\int dE_1\;\Omega_1(E_1)\,\Omega_2(E-E_1).$$
   <p>Perché allora l&rsquo;entropia risulti ancora additiva, $S(E)=S_1(\tilde E_1)+S_2(\tilde E_2)$, bisogna che questa somma sia <b>dominata da un solo termine</b> — la ripartizione più probabile. Che lo sia è, di nuovo, l&rsquo;alta dimensione: il prossimo passo lo mostra, ed è lì che entra l&rsquo;equilibrio.</p>`},
   {label:'Lequilibrio come massimo di entropia', body:R`
   <p>Nell&rsquo;integrale $\Omega(E)=\int dE_1\,\Omega_1(E_1)\Omega_2(E-E_1)$ scriviamo ciascun fattore come esponenziale dell&rsquo;entropia, $\Omega_i=e^{S_i}$, così l&rsquo;integrando è $e^{S_1(E_1)+S_2(E-E_1)}$. Con $S_i\sim N_i\gg1$ l&rsquo;esponente è enorme, e l&rsquo;integrale è dominato dal suo <b>massimo</b> — è un integrale di picco. Il massimo di $S_1(E_1)+S_2(E_2)$ sotto il vincolo $E_1+E_2=E$ si trova con i <span class="str" data-str="moltiplicatori-di-lagrange">moltiplicatori di Lagrange</span>. Posto $f=S_1(E_1)+S_2(E_2)+\beta(E-E_1-E_2)$, l&rsquo;annullamento delle derivate dà, come in Gravina (par. 5.2),</p>
   $$\frac{\partial S_1}{\partial E_1}=\beta,\qquad \frac{\partial S_2}{\partial E_2}=\beta\;\;\Longrightarrow\;\; \frac{\partial S_1}{\partial E_1}=\frac{\partial S_2}{\partial E_2}.$$
   <p>Ma $\partial S/\partial E=1/T$ è la definizione termodinamica di temperatura; la condizione di massimo è dunque $T_1=T_2$. <b>L&rsquo;equilibrio termico — l&rsquo;uguaglianza delle temperature — è esattamente la ripartizione dell&rsquo;energia che massimizza l&rsquo;entropia totale.</b> Il moltiplicatore di Lagrange $\beta$, introdotto come un artificio matematico, <i>è</i> l&rsquo;inverso della temperatura comune. Se si aprono anche gli scambi di volume e di particelle (setto mobile e poroso), gli altri due moltiplicatori risultano $P/T$ e $-\mu/T$: uguaglianza di pressione e di potenziale chimico, la trilogia dell&rsquo;equilibrio.</p>`},
   {label:'Che le fluttuazioni siano trascurabili', body:R`
   <p>Resta da chiudere il punto lasciato aperto: che l&rsquo;integrale sia davvero dominato dal picco. Espandendo $S_1(E_1)+S_2(E_2)$ al secondo ordine intorno al massimo $\tilde E_1$, il termine lineare si annulla (è un massimo) e resta una gaussiana in $E_1-\tilde E_1$ con varianza $\sigma^2$. Il conto degli ordini di grandezza (Gravina, par. 5.2) dà $1/\sigma^2=|\partial^2 S/\partial E^2|\sim N$, quindi $\sigma\sim\sqrt N$: la larghezza della distribuzione dell&rsquo;energia di un sottosistema cresce come $\sqrt N$, mentre l&rsquo;energia stessa cresce come $N$. La <b>fluttuazione relativa</b> $\sigma/E\sim1/\sqrt N$ va a zero. Integrando la gaussiana si ottiene</p>
   $$S(E)=\log\Omega(E)=S_1(\tilde E_1)+S_2(\tilde E_2)+\underbrace{O(\log\sqrt N)}_{\text{trascurabile}},$$
   <p>cioè l&rsquo;additività cercata, a meno di un termine di ordine $\log N$. <b>L&rsquo;entropia del composto è la somma delle entropie massime dei sottosistemi</b>: la ripartizione d&rsquo;equilibrio non è solo la più probabile, è così schiacciante da essere l&rsquo;unica che conti. È il senso ultimo del logaritmo: trasforma un integrale gigantesco in una semplice somma dei suoi massimi.</p>`}
  ]},
  {t:'plot', title:'Il picco dellentropia si stringe con N',
   intro:R`In ascissa la frazione di energia $E_1/E$ nel primo sottosistema. In ordinata il peso statistico $\Omega_1(E_1)\Omega_2(E-E_1)$, normalizzato al massimo, per tre valori di $N$. Il massimo è la ripartizione d'equilibrio.`,
   plots:[
    {kind:'func2d', xr:[0,1], yr:[0,1.08], height:320, ticks:6,
     title:'peso della ripartizione Omega_1(E_1) Omega_2(E-E_1)',
     curves:[
      {f:'exp(-8*pow(x-0.5,2))', col:'#5eead4', label:'N piccolo: il picco e largo, le ripartizioni fluttuano'},
      {f:'exp(-80*pow(x-0.5,2))', col:'#d8a13a', label:'N medio: il picco si stringe'},
      {f:'exp(-800*pow(x-0.5,2))', col:'#ff6b6b', label:'N grande: una sola ripartizione conta'}
     ],
     xlabel:'E_1/E (frazione di energia nel sottosistema 1)', ylabel:'peso normalizzato'}
   ],
   leggi:R`<p><b>Il massimo di ciascuna curva è l&rsquo;equilibrio termico</b>: la ripartizione dell&rsquo;energia per cui $T_1=T_2$. Per due sottosistemi uguali sta a metà, $E_1/E=1/2$, come mostra la simmetria delle curve.</p>
   <p><b>Il contenuto della figura è la larghezza, non la posizione.</b> Al crescere di $N$ il picco si stringe come $1/\sqrt N$ in termini relativi: la curva rossa è già quasi una delta. Questo è il motivo per cui l&rsquo;integrale $\int dE_1\,e^{S_1+S_2}$ vale il suo solo massimo — tutte le altre ripartizioni hanno peso esponenzialmente soppresso — e quindi perché $S=S_1+S_2$. <b>L&rsquo;equilibrio non è un valore medio attorno a cui si oscilla: è un valore <i>quasi certo</i></b>, e lo diventa proprio grazie al gran numero di particelle.</p>
   <p><b>Il legame con la geometria di prima.</b> Questo è lo stesso fenomeno della concentrazione dei volumi (tappa 03) e della «metà esatta a destra»: un&rsquo;osservabile additiva su $N$ costituenti ha fluttuazioni relative $1/\sqrt N$. La meccanica statistica è, in fondo, una sola idea vista da tre angoli — e questa figura è l&rsquo;angolo termodinamico.</p>`}
]},

/* ---------------- 05 · LEQUIPARTIZIONE ---------------- */
{ num:'05', title:'Lequipartizione, primo frutto generale del formalismo', meta:'il teorema generalizzato via divergenza · il teorema del viriale · un mezzo kT per grado quadratico',
  blocchi:[
  {t:'prosa', title:'Un teorema che vale prima di ogni modello', tag:'costruzione', html:R`
  <p>Prima di calcolare un sistema specifico conviene raccogliere un frutto che il microcanonico dà <b>senza scegliere alcuna hamiltoniana particolare</b>: il teorema di equipartizione generalizzato. Sia $x_i$ una qualunque delle $6N$ coordinate canoniche (una $q$ o una $p$). Gravina (par. 6.1) calcola la media microcanonica di $x_i\,\partial H/\partial x_j$ e trova un risultato pulito:</p>
  $$\left\langle x_i\,\frac{\partial H}{\partial x_j}\right\rangle=\delta_{ij}\,\frac{1}{\partial S/\partial E}=\delta_{ij}\,T.$$
  <p>La dimostrazione è tutta nel <b>teorema della divergenza</b>, ed è breve. Si scrive $\partial H/\partial x_j=\partial(H-E)/\partial x_j$ (perché $E$ è costante) e si integra sul volume $H\le E$; il termine $\partial_{x_j}[x_i(H-E)]$ è una divergenza, quindi il suo integrale di volume diventa un integrale di superficie su $H=E$, dove però $H-E=0$ identicamente: <b>svanisce</b>. Resta solo il termine $\delta_{ij}\int_{H\le E}(E-H)$, e derivando rispetto a $E$ e usando $\Sigma/(\partial\Sigma/\partial E)=(\partial\log\Sigma/\partial E)^{-1}\simeq(\partial S/\partial E)^{-1}=T$ si chiude. <b>L&rsquo;unico ingrediente non banale è che la superficie di integrazione è proprio $H=E$</b>, ed è ciò che manda a zero il termine di bordo.</p>`},
  {t:'prosa', title:'Dal teorema generale ai due corollari che si usano', tag:'regola operativa', html:R`
  <p>Il teorema generale contiene, come casi particolari, i due enunciati che si citano all&rsquo;esame.</p>
  <ul>
   <li><b>Il teorema del viriale.</b> Ponendo $x_i=q_i$, $x_j=q_i$ e usando $\partial H/\partial q_i=-\dot p_i$ (equazioni di Hamilton), la somma su tutti i gradi dà $\left\langle\sum_i q_i\dot p_i\right\rangle=-3NT$. La quantità $\sum q_i\dot p_i$ — coordinata per componente della forza generalizzata — è il <i>viriale</i> di Clausius, e questa è la sua forma statistica.</li>
   <li><b>L&rsquo;equipartizione dell&rsquo;energia.</b> Se l&rsquo;hamiltoniana è <b>quadratica</b> nelle sue variabili, $H=\sum_i A_i P_i^2+\sum_i B_i Q_i^2$, allora ogni termine contribuisce $\tfrac12 T$ all&rsquo;energia media. Il conto è l&rsquo;identità elementare $x_i\,\partial_{x_i}(A x_i^{2})=2A x_i^{2}$ — la variabile per la derivata del proprio quadrato restituisce due volte il quadrato — che con il teorema generale dà $\langle x_i\partial_{x_i}H\rangle=T$ per ogni grado, quindi $\langle A x_i^2\rangle=\tfrac12 T$. Sommando: $\langle H\rangle=\tfrac12 f\,T$, con $f$ il numero di gradi quadratici.</li>
  </ul>
  <div class="note"><b>Attenzione all&rsquo;ipotesi, ed è la trappola d&rsquo;orale.</b> Il «$\tfrac12 T$ per grado di libertà» vale <b>solo se il grado entra nell&rsquo;hamiltoniana in modo quadratico</b>. Il teorema <i>generalizzato</i> $\langle x_i\partial_{x_i}H\rangle=T$ vale sempre; è il passaggio a «$\tfrac12 T$ di energia» che richiede la quadraticità. Se la dispersione è lineare — per esempio un gas ultrarelativistico con $H=c|p|$ — l&rsquo;equipartizione nella forma familiare <b>non vale</b>, e lo vedremo esplicitamente nella tappa 08: lì l&rsquo;energia per particella risulta $3T$ e non $\tfrac32 T$. Ricordare la formula senza l&rsquo;ipotesi è il modo sicuro di sbagliare un esercizio non standard.</p></div>`}
]},

/* ---------------- 06 · IL GAS IDEALE, SVOLTO PER INTERO ---------------- */
{ num:'06', title:'Il gas ideale nel microcanonico, dallinizio al numero', meta:'Gamma(E) come volume dellipersfera · il punto di sella · lentropia · temperatura e pressione',
  blocchi:[
  {t:'reveal', title:'Il conto completo', tag:'costruzione', steps:[
   {label:'Impostazione: la delta e la sua rappresentazione', body:R`
   <p>È l&rsquo;esercizio-modello, quello su cui lo scritto insiste $46$ volte su $47$: $N$ particelle identiche non interagenti in un volume $V$, con hamiltoniana di sola energia cinetica $H=\frac{1}{2m}\sum_{i=1}^{3N}p_i^2$. Vogliamo la termodinamica dal microcanonico. La densità degli stati, con il fattore $h^{3N}$ che rende $\Gamma$ adimensionale (lo giustifichiamo nella tappa 07), è</p>
   $$\Gamma(E)=\int\frac{d^{3N}q\,d^{3N}p}{h^{3N}}\;\delta(E-H)=\frac{V^{N}}{h^{3N}}\int d^{3N}p\;\delta\!\Bigl(E-\tfrac{1}{2m}\textstyle\sum_i p_i^2\Bigr),$$
   <p>dove l&rsquo;integrale in $d^{3N}q$ è stato fatto subito — l&rsquo;hamiltoniana non dipende dalle posizioni, quindi ciascuna particella contribuisce un fattore $V$, in tutto $V^{N}$. Resta l&rsquo;integrale sugli impulsi con il vincolo di energia. Lo si attacca con la rappresentazione integrale della delta, $\delta(x)=\frac{1}{2\pi}\int ds\,e^{isx}$ (Gravina, par. 6.2):</p>
   $$\int d^{3N}p\;\delta\!\Bigl(E-\tfrac{1}{2m}\textstyle\sum_i p_i^2\Bigr)=\frac{1}{2\pi}\int_{-\infty}^{+\infty}ds\;e^{isE}\left(\int dp\;e^{-is\,p^2/2m}\right)^{3N},$$
   <p>perché la somma nell&rsquo;esponente si fattorizza in un prodotto di $3N$ integrali gaussiani identici — <b>è il punto in cui il vincolo globale $H=E$ si spezza in fattori di singola coordinata</b>.</p>`},
   {label:'Lintegrale gaussiano e il punto di sella', body:R`
   <p>Ogni fattore è un <span class="str" data-str="integrale-gaussiano">integrale gaussiano</span>, che dopo la regolarizzazione $s\to s+i\varepsilon$ (necessaria perché l&rsquo;integrando oscilla e va reso convergente, come spiega anche il docente nella lezione) vale $\int dp\,e^{-(is+\varepsilon)p^2/2m}=\sqrt{2\pi m/(\varepsilon+is)}$. Sostituendo e definendo l&rsquo;energia per particella $u=E/N$, l&rsquo;integrale prende la forma esponenziale in $N$</p>
   $$\int d^{3N}p\;\delta(E-H)=(2\pi m)^{3N/2}\int\frac{ds}{2\pi}\;e^{N f(s)},\qquad f(s)=(is+\varepsilon)u-\tfrac32\log(\varepsilon+is).$$
   <p>Con $N\gg1$ l&rsquo;integrale è dominato dal punto di sella, dove $f'(s)=0$. Scrivendo $x=is$ (la variabile che conta dopo la rotazione del contorno), $f=xu-\tfrac32\log x$ e la condizione di sella è</p>
   $$\frac{df}{dx}=u-\frac{3}{2x}=0\;\;\Longrightarrow\;\; x^\star=\frac{3}{2u}.$$
   <p>La derivata seconda $f''=+3/(2x^2)\gt0$ conferma che è un minimo di $f$ lungo il contorno ruotato, cioè un massimo del modulo dell&rsquo;integrando: è il punto di sella giusto. Valutando $f$ nel punto di sella si ottiene $f(x^\star)=\tfrac32\bigl(1+\log\tfrac{2u}{3}\bigr)$.</p>`},
   {label:'Lentropia', body:R`
   <p>Rimettendo insieme tutti i pezzi — il $V^N$, l&rsquo;$h^{3N}$, il $(2\pi m)^{3N/2}$, l&rsquo;esponenziale del punto di sella, e il prefattore $\sqrt{3/(4N\pi u^2)}$ che è di ordine $\sqrt N$ e quindi contribuisce solo $O(\log N)$ — si arriva a</p>
   $$\Gamma(E,V,N)=V^{N}\sqrt{\tfrac{3}{4N\pi u^2}}\left(\frac{4\pi m}{3h^2}\,\frac{E}{N}\right)^{\!3N/2}e^{3N/2},$$
   <p>e prendendo il logaritmo, buttando il prefattore $\log N$,</p>
   $$S(E,V,N)=N\log\!\left[V\left(\frac{4\pi m}{3h^{2}}\,\frac{E}{N}\right)^{\!3/2}\right]+\frac{3}{2}N.$$
   <p>In forma spoglia, ponendo $k=1$ e nascondendo le costanti (Crisanti, pag. 28), è la stessa cosa: $S=N\bigl(\log V+\tfrac32\log E\bigr)+\text{cost}$. La struttura essenziale è <b>$S\propto N\log V+\tfrac32 N\log E$</b>, e da qui si estrae tutta la termodinamica.</p>`},
   {label:'Temperatura, pressione, equazione di stato', body:R`
   <p>Le variabili naturali dell&rsquo;entropia sono $E,V,N$, e le derivate danno direttamente le grandezze termodinamiche via $dS=\tfrac1T dE+\tfrac PT dV-\tfrac\mu T dN$. La derivata rispetto all&rsquo;energia, tenendo solo il termine che contiene $E$:</p>
   $$\frac{1}{T}=\frac{\partial S}{\partial E}=\frac{\partial}{\partial E}\Bigl[N\log V+\tfrac32 N\log E\Bigr]=\frac{3N}{2E}\;\;\Longrightarrow\;\; E=\frac{3}{2}NT.$$
   <p>Ecco l&rsquo;energia interna del gas monoatomico, e ritrova l&rsquo;equipartizione: $\tfrac32 T$ per particella, cioè $\tfrac12 T$ per ciascuno dei tre gradi quadratici dell&rsquo;impulso — coerente con la tappa 05, perché qui $H$ è quadratica. La derivata rispetto al volume:</p>
   $$\frac{P}{T}=\frac{\partial S}{\partial V}=\frac{\partial}{\partial V}\bigl[N\log V\bigr]=\frac{N}{V}\;\;\Longrightarrow\;\; PV=NT.$$
   <p><b>L&rsquo;equazione di stato dei gas perfetti esce da un conteggio di stati.</b> Nessuna cinetica degli urti, nessuna pressione calcolata come impulso trasferito alle pareti: solo il volume dello spazio delle fasi e la sua derivata. È il primo, e più convincente, controllo che il metodo funzioni — il numero che esce è quello del laboratorio.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Perché si introduce la costante $h$ nel denominatore, se poi il gas è trattato classicamente?`,
    a:R`Per due ragioni, una immediata e una profonda. Immediata: $\Gamma$ è un volume nello spazio delle fasi, ha le dimensioni di (azione)$^{3N}$, e per prenderne il logaritmo <b>deve</b> essere reso adimensionale; $h^{3N}$, con $h$ un&rsquo;azione, fa il lavoro. Classicamente il valore di $h$ è irrilevante perché aggiunge a $S$ una costante $-3N\log h$ che non tocca né l&rsquo;energia né la pressione (sono derivate). Profonda: il valore <i>giusto</i> di $h$, che serve per l&rsquo;entropia assoluta e per il teorema di Nernst, è la costante di Planck — perché $h^{3N}$ è il volume della cella elementare imposta dal principio di indeterminazione. <b>La meccanica quantistica lascia la sua impronta anche in un conto classico.</b>`}
  ]}
]},

/* ---------------- 07 · IL CONTEGGIO CORRETTO E IL PARADOSSO DI GIBBS ---------------- */
{ num:'07', title:'Il conteggio corretto di Boltzmann, e il paradosso di Gibbs', meta:'lentropia non estensiva · lentropia di mescolamento · il fattore 1/N! · Sackur-Tetrode',
  blocchi:[
  {t:'reveal', title:'Un disastro, e la sua cura', tag:'costruzione', steps:[
   {label:'Lentropia calcolata sopra non e estensiva', body:R`
   <p>C&rsquo;è un difetto nascosto nel risultato della tappa precedente, e finché non lo si vede la teoria non è finita. L&rsquo;entropia $S=N\log\bigl[V(\dots E/N)^{3/2}\bigr]+\tfrac32 N$ <b>non è estensiva</b>. L&rsquo;estensività chiede che raddoppiando $E,V,N$ insieme (cioè $\lambda\to\lambda E,\lambda V,\lambda N$) l&rsquo;entropia raddoppi. Il termine $N\log V$ è la spia del guasto: sotto lo scaling diventa $\lambda N\log(\lambda V)=\lambda N\log V+\lambda N\log\lambda$, e</p>
   $$\lambda N\log(\lambda V)-\lambda\,\bigl(N\log V\bigr)=\lambda N\log\lambda\neq0.$$
   <p>Il termine spurio $\lambda N\log\lambda$ non si annulla: l&rsquo;entropia cresce <b>più che linearmente</b> con la dimensione del sistema. Per una funzione di stato è inaccettabile, e le conseguenze sono peggiori di una semplice incoerenza formale, come mostra il paradosso di Gibbs.</p>`},
   {label:'Il paradosso di Gibbs', body:R`
   <p>Due gas ideali, $N_1$ e $N_2$ particelle in volumi $V_1$ e $V_2$, stessa temperatura e stessa densità, separati da un setto. Si toglie il setto e si lasciano mescolare in $V=V_1+V_2$. Poiché $T$ non cambia, $u$ resta fissa; usando l&rsquo;additività (tappa 04) e la forma non corretta dell&rsquo;entropia, la variazione è</p>
   $$\Delta S=N_1\log\frac{V}{V_1}+N_2\log\frac{V}{V_2}\gt0.$$
   <p>Se i due gas sono <b>diversi</b> (argon e neon) questo è giusto, ed è misurabile: è l&rsquo;entropia di mescolamento. Per due metà uguali, $N_1=N_2=N/2$ e $V_1=V_2=V/2$, dà $\Delta S=\tfrac N2\log2+\tfrac N2\log2=N\log 2$. Il <b>paradosso</b> scatta se i due gas sono <b>identici</b>. Il conto non sa distinguere i casi — non dipende dall&rsquo;identità dei gas — e predice lo stesso $\Delta S\gt0$. Ma togliere un setto fra due metà dello <i>stesso</i> gas all&rsquo;equilibrio <b>non cambia nulla</b>: rimettendolo si ritorna esattamente allo stato di prima, l&rsquo;entropia non può essere aumentata. Come dice Gravina (par. 6.3), è un disastro: implicherebbe che $S$ dipenda dalla storia del gas e non dal suo stato — e siccome si può immaginare qualsiasi stato come ottenuto togliendo infiniti setti, $S$ diventerebbe più grande di qualunque numero.</p>`},
   {label:'La cura: dividere per N!', body:R`
   <p>Gibbs risolse il paradosso postulando che avevamo <b>contato troppi stati</b>. Le particelle di uno stesso gas sono indistinguibili: due configurazioni che differiscono per una <i>permutazione</i> delle particelle — la particella $1$ dove c&rsquo;era la $2$ e viceversa — non sono stati fisici diversi, sono lo stesso stato. Averli contati come diversi ha gonfiato $\Gamma$ di un fattore pari al numero di permutazioni, $N!$. Il <b>conteggio corretto di Boltzmann</b> è dunque</p>
   $$\Gamma(E)=\frac{\Gamma_{\text{sbagliata}}(E)}{N!},\qquad \int\frac{d^{3N}q\,d^{3N}p}{h^{3N}}\;\longrightarrow\;\int\frac{d^{3N}q\,d^{3N}p}{h^{3N}\,N!}.$$
   <p>Il termine che ne risulta nell&rsquo;entropia è $-\log N!$, e qui entra la <span class="str" data-str="stirling">approssimazione di Stirling</span>: per $N\gg1$, $\log N!\simeq N\log N-N=N(\log N-1)$. La sua derivata rispetto a $N$ — che serve per il potenziale chimico — è pulita, $\partial_N(N\log N-N)=\log N$, e questo mostra che $N!$ agisce come una funzione liscia di $N$ e non come un intoppo combinatorio. Sottraendo $\log N!$ all&rsquo;entropia sbagliata si sostituisce ovunque $V$ con $V/N$: <b>il volume smette di essere quello totale e diventa quello per particella</b>.</p>`},
   {label:'Perche la cura funziona, e la Sackur-Tetrode', body:R`
   <p>Con $V\to V/N$ l&rsquo;entropia diventa estensiva. Il termine problematico $N\log V$ si trasforma in $N\log(V/N)$, e sotto lo scaling</p>
   $$\lambda N\log\frac{\lambda V}{\lambda N}=\lambda N\log\frac{V}{N}=\lambda\cdot\Bigl[N\log\frac{V}{N}\Bigr],$$
   <p>cioè scala esattamente come $\lambda$: <b>estensiva</b>. Il paradosso sparisce: mescolando gas identici $V/N$ è la stessa quantità intensiva prima e dopo, quindi $\Delta S=0$; mescolando gas diversi, $N_1$ e $N_2$ restano le stesse costanti e $\Delta S\gt0$ sopravvive. La forma finale, nota come <b>equazione di Sackur-Tetrode</b>, è</p>
   $$S(E,V,N)=N\log\!\left[\frac{V}{N}\left(\frac{E}{N}\right)^{3/2}\right]+\frac{3}{2}N\left[\frac{5}{3}+\log\frac{4\pi m}{3h^{2}}\right],$$
   <p>dove la costante $\tfrac32\cdot\tfrac53=\tfrac52$ è il celebre addendo $\tfrac52$ per particella. Falcioni-Vulpiani (par. 2.3) ricordano che nel $1912$ Sackur e Tetrode arrivarono a questa forma dai dati sperimentali sul mercurio, e che essa <b>fissa il valore di $h$ alla costante di Planck</b>: un&rsquo;equazione dedotta contando stati classici predice una costante quantistica. La dipendenza da $V/N$ ed $E/N$ — quantità intensive — è la firma dell&rsquo;estensività ritrovata.</p>`}
  ]},
  {t:'prosa', title:'Perche il fattore N! e davvero quantistico', tag:'sintesi', html:R`
  <p>Vale la pena essere precisi su cosa qui è dimostrato e cosa è preso a prestito, perché è una domanda d&rsquo;orale frequente. Il fatto che <i>bisogni</i> dividere per $N!$ lo abbiamo dimostrato: senza, l&rsquo;entropia non è estensiva e il paradosso di Gibbs è insanabile. <b>Perché</b> le particelle siano indistinguibili, invece, la meccanica classica non lo sa dire — è il debito dichiarato del movimento. La ragione è quantistica: uno stato di $N$ particelle è descritto da una funzione d&rsquo;onda simmetrica o antisimmetrica per scambio, e una permutazione al più cambia la funzione d&rsquo;onda per un segno, cioè per una fase, che non produce uno stato nuovo. L&rsquo;elemento di volume $d^{3N}q\,d^{3N}p$ corrisponde quindi non a uno stato ma a $1/N!$ di stato. Gravina (par. 6.3) lo dice senza giri: «It is not possible to understand classically why we must divide by $N!$… the reason is inherently quantum mechanical». <b>Il conteggio corretto di Boltzmann è una toppa classica su una verità quantistica</b>, e funziona perché la verità quantistica, per un gas rarefatto e caldo, si riduce esattamente a quel fattore.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Dividere per $N!$ cambia la pressione o l&rsquo;energia del gas?`,
    a:R`No, e questo è il punto delicato. Il termine $-\log N!$ dipende <b>solo</b> da $N$, non da $E$ né da $V$: sparisce sotto le derivate $\partial S/\partial E$ e $\partial S/\partial V$ che danno temperatura e pressione. Quindi $E=\tfrac32 NT$ e $PV=NT$ restano identiche. Ciò che cambia è l&rsquo;<b>entropia assoluta</b> (e con essa il potenziale chimico $\mu=-T\,\partial S/\partial N$, che invece contiene $N$): solo lì l&rsquo;indistinguibilità si fa sentire. <b>Il paradosso di Gibbs riguarda l&rsquo;entropia, non l&rsquo;equazione di stato</b>, ed è per questo che era rimasto nascosto finché non si è mescolato.`},
   {q:R`Perché l&rsquo;entropia di mescolamento di due gas <b>diversi</b> è fisica, mentre quella di due gas identici no?`,
    a:R`Perché con gas diversi il mescolamento è un processo <b>irreversibile reale</b>: per risepararli serve un lavoro (una membrana selettiva, un demone), e l&rsquo;aumento $\Delta S=N_1\log(V/V_1)+N_2\log(V/V_2)$ è quel lavoro reso in entropia. Con gas identici togliere il setto non produce alcun processo — lo stato macroscopico è invariato — quindi $\Delta S$ deve essere zero. La Sackur-Tetrode, con il suo $V/N$ intensivo, distingue automaticamente i due casi: nei gas identici $V/N$ non cambia, nei diversi i $V_i/N_i$ dei componenti restano invariati e la differenza sopravvive. <b>È il test che una buona espressione dell&rsquo;entropia deve passare.</b>`}
  ]}
]},

/* ---------------- 08 · LORALE: LO STESSO PROBLEMA IN DUE ENSEMBLES ---------------- */
{ num:'08', title:'Lo stesso gas contato in due ensembles: la forma della domanda dorale', meta:'il gas ultrarelativistico H=c|p| · il microcanonico col punto di sella · perche E=3NT e non 3/2 NT',
  blocchi:[
  {t:'prosa', title:'Perche questa tappa esiste', tag:'architettura', html:R`
  <p>Nella lezione registrata del $4/10$ il docente fa una cosa precisa e la annuncia: «vi faccio lo stesso esercizio prima nel microcanonico e poi nel canonico, così vedete come lo stesso problema lo si può contare con due tecniche diverse, e quali sono i vantaggi dei vari ensembles». <b>Questa è la forma della domanda d&rsquo;orale</b>, ed è il motivo per cui la tappa esiste: non basta saper fare il gas ideale standard, bisogna saperlo contare in un ensemble a scelta e riconoscere che la termodinamica che ne esce è la stessa. Il sistema scelto non è il gas monoatomico — sarebbe troppo comodo — ma un <b>gas ultrarelativistico</b>, dove l&rsquo;energia di una particella è $\varepsilon=c\,|p|$, lineare nell&rsquo;impulso invece che quadratica. Il cambio di dispersione è ciò che rende l&rsquo;esercizio non standard e diagnostico.</p>`},
  {t:'reveal', title:'Il gas relativistico nel microcanonico', tag:'costruzione', steps:[
   {label:'Impostazione, identica nella struttura', body:R`
   <p>L&rsquo;hamiltoniana è $H=\sum_{i=1}^{N}c\,|\vec p_i|$. Il volume nello spazio delle fasi, col conteggio corretto già inserito, è</p>
   $$\Gamma(E,V,N)=\frac{V^{N}}{h^{3N}N!}\int d^{3N}p\;\delta\!\Bigl(E-c\textstyle\sum_i|\vec p_i|\Bigr)=\frac{V^N}{h^{3N}N!}\int\frac{ds}{2\pi}\,e^{isE}\left(\int d^3p\;e^{-isc|\vec p|}\right)^{N}.$$
   <p>La struttura è identica al caso monoatomico: integrale in $d^{3N}q\to V^N$, rappresentazione della delta, fattorizzazione in $N$ integrali di singola particella. Cambia solo l&rsquo;integrale elementare, perché la dispersione è lineare. Passando in coordinate sferiche nello spazio degli impulsi, $\int d^3p\,e^{-isc|\vec p|}=4\pi\int_0^\infty p^2\,e^{-iscp}\,dp$, e questo — con la solita regolarizzazione $s\to s-i0^+$ e derivando due volte $\int_0^\infty e^{-iscp}dp=1/(isc)$ rispetto a $isc$ — vale $8\pi/(isc)^3$.</p>`},
   {label:'Il punto di sella, con esponente diverso', body:R`
   <p>Raccogliendo, e ponendo $u=E/N$, il volume prende la forma esponenziale in $N$</p>
   $$\Gamma=\frac{1}{N!}\left(\frac{8\pi}{h^3c^3}\right)^{\!N}V^N\int\frac{ds}{2\pi}\,e^{N\varphi(s)},\qquad \varphi(s)=(is)\,u-3\log(is).$$
   <p>Ecco la differenza cruciale: l&rsquo;esponente del logaritmo è <b>$3$</b>, non $\tfrac32$ — perché ogni particella ha tre componenti di impulso e la dispersione lineare pesa ciascuna con potenza $3$ invece che $3/2$. Il punto di sella, con $x=is$, si trova da</p>
   $$\frac{d\varphi}{dx}=u-\frac{3}{x}=0\;\;\Longrightarrow\;\; x^\star=\frac{3}{u},$$
   <p>(da confrontare con $x^\star=3/(2u)$ del caso quadratico) e il valore nel punto di sella è $\varphi(x^\star)=3-3\log\tfrac{3}{u}=3\bigl(1+\log\tfrac{u}{3}\bigr)$. La derivata seconda $\varphi''=3/x^2\gt0$ conferma la sella.</p>`},
   {label:'Lentropia e la termodinamica', body:R`
   <p>Sostituendo il punto di sella, usando Stirling per l&rsquo;$1/N!$ (che porta il $V^N\to(V/N)^N$ e un fattore $e^N$) e buttando i prefattori $\log N$, il docente arriva a</p>
   $$S(E,V,N)=N\log\!\left[\frac{8\pi e^{4}}{27\,h^{3}c^{3}}\,\frac{V}{N}\left(\frac{E}{N}\right)^{3}\right].$$
   <p>La firma dell&rsquo;estensività c&rsquo;è di nuovo — $V/N$ ed $E/N$ intensive — e il docente insiste su un dettaglio da orale: «se dimenticate un $e$ qua dentro, poco male; ma se non mettete l&rsquo;$N$ davanti al logaritmo, toppate di brutto», perché è l&rsquo;$N$ a fare l&rsquo;entropia estensiva. La termodinamica esce dalle derivate. Rispetto all&rsquo;energia, tenendo il solo termine $3N\log E$:</p>
   $$\frac1T=\frac{\partial S}{\partial E}=\frac{3N}{E}\;\;\Longrightarrow\;\; E=3NT.$$
   <p><b>Ecco il risultato diagnostico</b>: l&rsquo;energia per particella è $3T$, non $\tfrac32 T$. Non è l&rsquo;equipartizione familiare, e <i>deve</i> essere così — l&rsquo;hamiltoniana è lineare, non quadratica, quindi il teorema del $\tfrac12 T$ per grado non si applica (tappa 05). La pressione invece torna identica: $P/T=\partial S/\partial V=N/V$, cioè $PV=NT$. Anche questo il docente lo commenta: «l&rsquo;equazione di stato $PV=NT$ vale a prescindere dalla dispersione, perché è gas perfetto — non interagisce, punto — mentre l&rsquo;energia interna sente la forma dell&rsquo;hamiltoniana».</p>`}
  ]},
  {t:'plot', title:'La stessa temperatura, due energie: lineare contro quadratico',
   intro:R`In ascissa la temperatura $T$ in unità arbitrarie. In ordinata l'energia interna per particella $E/N$. Le due rette sono i due gas ideali: dispersione quadratica $\varepsilon\propto p^{2}$ (monoatomico) e lineare $\varepsilon\propto|p|$ (ultrarelativistico).`,
   plots:[
    {kind:'func2d', xr:[0,2], yr:[0,6.5], height:300, ticks:6,
     title:'energia per particella E/N in funzione di T',
     curves:[
      {f:'1.5*x', col:'#5eead4', label:'quadratico: E/N = (3/2) T'},
      {f:'3*x', col:'#ff6b6b', label:'lineare (relativistico): E/N = 3 T'}
     ],
     xlabel:'T (temperatura)', ylabel:'E/N (energia per particella)'}
   ],
   leggi:R`<p><b>Due rette per l&rsquo;origine, pendenze diverse.</b> Stesso numero di gradi di libertà — tre componenti d&rsquo;impulso per particella — stessa equazione di stato $PV=NT$, eppure a parità di temperatura il gas relativistico immagazzina <b>il doppio</b> dell&rsquo;energia del monoatomico. La differenza non è nei gradi di libertà ma in <i>come</i> ciascun grado entra nell&rsquo;hamiltoniana: la pendenza è $d/\alpha$, con $d=3$ dimensioni e $\alpha$ l&rsquo;esponente della dispersione — $\alpha=2$ dà $3/2$, $\alpha=1$ dà $3$.</p>
   <p><b>La pendenza è il calore specifico</b>, $C_V=\partial E/\partial T$: vale $\tfrac32 N$ nel primo caso e $3N$ nel secondo. È una quantità <i>misurabile</i>, e quindi la distinzione fra le due rette non è un tecnicismo: un calorimetro le separa. Ecco perché la domanda d&rsquo;orale sceglie una dispersione non standard — per vedere se lo studente riconosce che l&rsquo;equipartizione familiare $\tfrac12 T$ per grado vale solo nel ramo quadratico, e sa produrre l&rsquo;altro ramo dal conteggio.</p>
   <p><b>La lettura da portare via.</b> L&rsquo;equazione di stato è geometrica (dipende solo dal fatto che il gas non interagisce e riempie il volume $V$); l&rsquo;energia interna è dinamica (dipende dalla forma dell&rsquo;hamiltoniana). Due gas possono condividere la prima e differire nella seconda — ed è il microcanonico, contando gli stati, a dire di quanto.</p>`},
  {t:'prosa', title:'Cosa insegna il confronto', tag:'regola operativa', html:R`
  <p>Il senso dell&rsquo;esercizio, e la ragione per cui il docente lo propone nei due ensembles, è che <b>la termodinamica è un invariante</b>: $E$ e $PV$ non dipendono da <i>come</i> li si è calcolati, solo dal sistema. Nel microcanonico si fissa $E$ e si conta il guscio con un punto di sella; nel canonico si fissa $T$ e si calcola la funzione di partizione $Z=\int e^{-\beta H}$, un integrale gaussiano senza vincoli e senza sella — più comodo. I due danno la stessa $E(T)$, la stessa equazione di stato. Il microcanonico è concettualmente primario ma tecnicamente scomodo (il vincolo $\delta(E-H)$ costringe alla sella); il canonico sposta la scomodità nel togliere il vincolo, e per questo lo scritto lo preferisce. <b>Saper passare dall&rsquo;uno all&rsquo;altro, e sapere perché danno lo stesso risultato, è esattamente ciò che la domanda d&rsquo;orale verifica.</b> Il gas relativistico è la variante scelta apposta per vedere se lo studente applica il metodo o ripete a memoria l&rsquo;$\tfrac32 T$.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Perché per il gas relativistico $E=3NT$ mentre per il monoatomico $E=\tfrac32 NT$, se in entrambi i casi ci sono tre gradi di libertà per particella?`,
    a:R`Perché l&rsquo;energia per grado di libertà dipende da <b>come</b> il grado entra nell&rsquo;hamiltoniana, non solo dal numero dei gradi. Il teorema di equipartizione dà $\tfrac12 T$ per grado <b>quadratico</b>; con dispersione lineare $\varepsilon=c|p|$ il grado non è quadratico. Il modo pulito di vederlo: nell&rsquo;integrale della densità degli stati l&rsquo;esponente del logaritmo è $3$ (lineare in tre dimensioni) invece di $\tfrac32$ (quadratico in tre dimensioni), e quell&rsquo;esponente diventa il coefficiente di $\log E$ nell&rsquo;entropia, quindi il fattore in $E=(\text{esponente})\,NT/(\dots)$. In generale, per $\varepsilon\propto p^{\,\alpha}$ in $d$ dimensioni, l&rsquo;energia per particella è $(d/\alpha)\,T$: quadratico $\alpha=2$, $d=3$ dà $\tfrac32 T$; lineare $\alpha=1$, $d=3$ dà $3T$. <b>Ripetere $\tfrac32 T$ senza guardare la dispersione è la trappola.</b>`},
   {q:R`Se il canonico è più comodo, perché studiare il microcanonico?`,
    a:R`Perché il canonico <b>si deriva</b> dal microcanonico, e senza il secondo il primo è una ricetta senza fondamento. Il canonico nasce (tappa 04) marginalizzando la distribuzione microcanonica di un sistema grande su un suo sottosistema piccolo: $\rho_C\propto e^{-\beta H_1}$ esce dallo sviluppo di Taylor dell&rsquo;entropia del bagno. Il microcanonico è anche l&rsquo;unico ensemble adatto a un sistema <b>isolato</b> (energia esattamente fissata), che è la situazione fondamentale; il canonico descrive un sistema a contatto con un termostato. <b>Il microcanonico è dove si definisce l&rsquo;entropia e dove il postulato ha la sua forma più pura</b>; la comodità di calcolo del canonico è un guadagno tecnico che si paga con una perdita di primarietà concettuale.`}
  ]}
]},

/* ---------------- 09 · ESERCIZI ---------------- */
{ num:'09', title:'Esercizi — tocca a te', meta:'la densita degli stati di un oscillatore · lentropia di mescolamento sui numeri · il gas relativistico nel canonico',
  blocchi:[
  {t:'esercizio', title:'1 · Densita degli stati di N oscillatori armonici',
   src:'il conto che mostra come la forma dellhamiltoniana entra nel volume dello spazio delle fasi',
   testo:R`Considera $N$ oscillatori armonici classici unidimensionali indipendenti, $H=\sum_{i=1}^{N}\bigl(\frac{p_i^{2}}{2m}+\frac{1}{2}m\omega^{2}q_i^{2}\bigr)$. Calcola il volume $\Sigma(E)=\int_{H\lt E}$, la densità degli stati $\Omega(E)=\partial\Sigma/\partial E$, l'entropia e l'energia media $E(T)$. Confronta con l'equipartizione.`,
   steps:[
    {label:'Il volume come ipersfera in 2N dimensioni', body:R`
    <p>Con le variabili riscalate $\tilde q_i=\sqrt{m\omega^2/2}\,q_i$ e $\tilde p_i=p_i/\sqrt{2m}$, l&rsquo;hamiltoniana diventa $H=\sum_{i=1}^{N}(\tilde p_i^{2}+\tilde q_i^{2})$, cioè il quadrato del raggio in uno spazio a $2N$ dimensioni. La condizione $H\lt E$ è una <b>ipersfera di raggio $\sqrt E$ in $2N$ dimensioni</b>. Lo jacobiano del riscalamento è costante (un fattore $(\sqrt{2m}\cdot\sqrt{2/m\omega^2})^{N}=(2/\omega)^{N}$ per le $2N$ variabili), quindi</p>
    $$\Sigma(E)=\left(\frac{2}{\omega}\right)^{\!N}\!\cdot\frac{\pi^{N}}{\Gamma(N+1)}\,E^{N}=\frac{1}{N!}\left(\frac{2\pi}{\omega}\right)^{\!N}E^{N},$$
    <p>usando il volume dell&rsquo;ipersfera $Q(R)=\pi^{N}R^{2N}/\Gamma(N+1)$ in dimensione $2N$ con $R=\sqrt E$. <b>Nota la struttura</b>: il volume va come $E^{N}$, esponente $N$ e non $3N/2$ — perché ogni oscillatore ha <i>due</i> gradi quadratici (uno cinetico, uno potenziale) contro l&rsquo;uno cinetico per grado del gas libero.</p>`},
    {label:'Densita, entropia, energia', body:R`
    <p>La densità degli stati è $\Omega=\partial\Sigma/\partial E=\frac{1}{(N-1)!}\left(\frac{2\pi}{\omega}\right)^{N}E^{N-1}\propto E^{N-1}$. L&rsquo;entropia, con Stirling per l&rsquo;$1/N!$ (o equivalentemente dal $\log\Omega$, che differisce per $O(\log N)$):</p>
    $$S(E,N)=\log\Sigma\simeq N\log\!\left(\frac{2\pi E}{\omega N}\right)+N=N\log\frac{E}{N}+N\log\frac{2\pi}{\omega}+N.$$
    <p>Derivando: $\dfrac1T=\dfrac{\partial S}{\partial E}=\dfrac{N}{E}\;\Rightarrow\;E=NT$. <b>Confronto con l&rsquo;equipartizione</b>: ogni oscillatore ha due gradi quadratici, quindi $\langle H\rangle=2\cdot\tfrac12 T=T$ per oscillatore (tappa 05), cioè $E=NT$ — coerente. È il celebre calore specifico $C_V=\partial E/\partial T=N$ del solido classico (legge di Dulong-Petit, $3N$ oscillatori in tre dimensioni danno $C_V=3N$). <b>La forma dell&rsquo;hamiltoniana — quanti gradi quadratici — determina l&rsquo;esponente del volume e quindi il calore specifico.</b></p>`}
   ]},
  {t:'esercizio', title:'2 · Lentropia di mescolamento, sui numeri',
   src:'lesercizio che rende concreto il paradosso di Gibbs, distinguendo gas uguali e diversi',
   testo:R`Una scatola di volume $2V$ è divisa a metà da un setto; in ogni metà c'è un gas ideale con $N$ particelle alla stessa temperatura. Calcola $\Delta S$ togliendo il setto, prima con l'entropia non corretta, poi con la Sackur-Tetrode, nei due casi: (a) i due gas sono diversi; (b) sono identici. Spiega quale delle due formule dà la risposta fisica.`,
   steps:[
    {label:'Con lentropia non corretta', body:R`
    <p>Con $S=N(\log V+\tfrac32\log E)+\text{cost}$ (non estensiva), lo stato iniziale ha $S_i=2\bigl[N\log V+\dots\bigr]$ e quello finale, con ciascun gas ora in $2V$, $S_f=2\bigl[N\log(2V)+\dots\bigr]$ nel caso di gas diversi. La variazione è</p>
    $$\Delta S=2N\log(2V)-2N\log V=2N\log 2.$$
    <p>Per due metà uguali dello stesso gas la formula <b>dà lo stesso</b> $\Delta S=2N\log 2\gt0$, perché non distingue i casi. Questo è il paradosso: togliere il setto fra due metà dello stesso gas all&rsquo;equilibrio non è un processo, eppure la formula pretende un aumento di entropia. La spia è che questa $S$ non è estensiva.</p>`},
    {label:'Con la Sackur-Tetrode', body:R`
    <p>Con la forma corretta $S=N\log\bigl(\tfrac{V}{N}\dots\bigr)+\dots$, ciò che conta è il volume <b>per particella</b>. Stato iniziale: ogni metà ha densità $N/V$. Stato finale:</p>
    <p><b>(a) gas diversi.</b> Ciascun gas si espande da $V$ a $2V$ mantenendo le sue $N$ particelle, quindi il suo volume per particella raddoppia. $\Delta S_a=N\log\tfrac{2V}{N}-N\log\tfrac{V}{N}$ per ciascun gas, in tutto $\Delta S_a=2N\log 2\gt0$: <b>entropia di mescolamento reale</b>, misurabile.</p>
    <p><b>(b) gas identici.</b> Alla fine c&rsquo;è un solo gas di $2N$ particelle in $2V$: il volume per particella è $2V/2N=V/N$, <b>identico</b> a quello iniziale. $\Delta S_b=2N\log\tfrac{V}{N}-2N\log\tfrac{V}{N}=0$. Nessun aumento, come deve essere.</p>
    <p><b>La Sackur-Tetrode dà la risposta fisica</b> in entrambi i casi, perché il suo $V/N$ intensivo «sa» che mescolare gas identici non cambia lo stato. La formula non corretta sbaglia il caso (b) proprio perché usa $V$ estensivo invece di $V/N$. <b>Il criterio invocato è l&rsquo;estensività dell&rsquo;entropia</b>, e il conteggio corretto di Boltzmann ($1/N!$) è ciò che la garantisce.</p>`}
   ]},
  {t:'esercizio', title:'3 · Il gas relativistico nel canonico',
   src:'la seconda meta della domanda dorale: rifare il gas relativistico con Z e ritrovare E=3NT',
   testo:R`Rifai il gas ultrarelativistico ($H=\sum_i c|\vec p_i|$) nell'ensemble canonico: calcola la funzione di partizione $Z(\beta,V,N)$ con il conteggio corretto, l'energia libera $F=-T\log Z$, l'energia media $E=-\partial_\beta\log Z$ e verifica che ritrovi $E=3NT$ e $PV=NT$.`,
   steps:[
    {label:'La funzione di partizione', body:R`
    <p>Nel canonico non c&rsquo;è vincolo di energia e niente punto di sella — è il vantaggio dell&rsquo;ensemble. La funzione di partizione fattorizza sulle particelle indipendenti:</p>
    $$Z=\frac{1}{h^{3N}N!}\int d^{3N}q\,d^{3N}p\;e^{-\beta\sum_i c|\vec p_i|}=\frac{1}{N!}\left[\frac{V}{h^3}\int d^3p\;e^{-\beta c|\vec p|}\right]^{N}.$$
    <p>L&rsquo;integrale di singola particella in coordinate sferiche è $\int d^3p\,e^{-\beta c p}=4\pi\int_0^\infty p^2 e^{-\beta c p}dp=4\pi\cdot\frac{2}{(\beta c)^3}=\frac{8\pi}{(\beta c)^3}$ (due derivate di $1/(\beta c)$, come nel microcanonico ma qui senza regolarizzazione, perché l&rsquo;esponenziale è già reale e convergente). Quindi</p>
    $$Z=\frac{1}{N!}\left[\frac{8\pi V}{h^3(\beta c)^3}\right]^{N}=\frac{1}{N!}\left(\frac{8\pi V}{h^3 c^3}\right)^{N}\frac{1}{\beta^{3N}}.$$`},
    {label:'Energia libera ed energia media', body:R`
    <p>Il logaritmo, con Stirling $\log N!\simeq N\log N-N$:</p>
    $$\log Z=N\log\!\left(\frac{8\pi V}{h^3c^3}\right)-3N\log\beta-N\log N+N=N\log\!\left(\frac{8\pi e\,V}{h^3c^3 N}\right)-3N\log\beta.$$
    <p>L&rsquo;energia media si legge direttamente, ed è il conto più corto di tutto il movimento:</p>
    $$E=-\frac{\partial\log Z}{\partial\beta}=-\left(-\frac{3N}{\beta}\right)=\frac{3N}{\beta}=3NT.$$
    <p><b>Ritrovato $E=3NT$</b>, identico al microcanonico ma con una frazione dello sforzo: nessuna delta, nessuna sella, solo una derivata di $\log\beta$. La pressione: $P=-\partial F/\partial V=T\,\partial_V\log Z=T\cdot N/V$, cioè $PV=NT$. E il calore specifico $C_V=\partial E/\partial T=3N$, il doppio del monoatomico — la firma della dispersione lineare, che paga tre gradi «pieni» invece di tre «mezzi».</p>
    <p><b>La morale operativa dell&rsquo;intero movimento.</b> Microcanonico e canonico danno la stessa termodinamica; il canonico costa meno perché toglie il vincolo di energia e con esso il punto di sella. Ma il canonico esiste solo perché il microcanonico l&rsquo;ha generato, e l&rsquo;entropia — la grandezza da cui tutto discende — si definisce nel microcanonico. <b>Il criterio che regge il confronto è l&rsquo;equivalenza degli ensembles nel limite termodinamico</b>: valida quando le fluttuazioni relative di energia vanno a zero come $1/\sqrt N$, cioè sempre, tranne che sulle transizioni di fase.</p>`}
   ]}
]},

/* ---------------- 10 · IL SENSO E LE ROTTE ---------------- */
{ num:'10', title:'Il senso, e le rotte', meta:'cosa lascia in mano, e dove il conteggio di stati diventa fisica',
  blocchi:[
  {t:'prosa', title:'Cosa portarsi via', tag:'sintesi', html:R`
  <p><b>Il punto.</b> La meccanica statistica dell&rsquo;equilibrio poggia su due postulati e una definizione. Il postulato dell&rsquo;<b>equiprobabilità a priori</b> (tutti i microstati accessibili sono equiprobabili, giustificato in parte da Liouville); il postulato di <b>Boltzmann</b> $S=\log\Omega$ (l&rsquo;entropia è il logaritmo del conteggio, e il logaritmo è costretto dall&rsquo;additività); e la <b>definizione</b> del microcanonico come $\rho=\delta(H-E)/\Omega(E)$. Tutto il resto — equilibrio come massimo di entropia, temperatura come moltiplicatore di Lagrange, equazione di stato, Sackur-Tetrode — sono conseguenze.</p>
  <p><b>Che cosa conviene ricordare, in ordine di durata.</b> Che l&rsquo;entropia è un <i>conteggio di stati</i> — l&rsquo;immagine che regge tutto e non si dimentica mai. Che il logaritmo viene dall&rsquo;additività contro la moltiplicatività del conteggio — la risposta al «perché». Che in alta dimensione volume e superficie coincidono e le fluttuazioni relative vanno come $1/\sqrt N$ — il fatto geometrico da cui discende l&rsquo;intera macchina. Il conto del gas ideale col punto di sella, che si rifà in dieci minuti se si ricorda la sequenza «delta $\to$ rappresentazione integrale $\to$ gaussiane fattorizzate $\to$ sella $\to$ Stirling». E il paradosso di Gibbs con la sua cura $1/N!$, che è il test dell&rsquo;estensività e la traccia quantistica dentro un conto classico. <b>Di un movimento lungo, ciò che resta a lungo è: l&rsquo;entropia conta stati, e il gran numero fa il resto.</b></p>`},
  {t:'prolessi', title:'Dove riappare questo movimento',
   oggetto:R`<b>Il conteggio di stati</b>: l&rsquo;entropia come logaritmo di un volume nello spazio delle fasi, e l&rsquo;equilibrio come suo massimo.`,
   rotte:[
    {dove:'Ensemble<br>canonico', txt:R`Affacciando il sistema a un termostato e marginalizzando la distribuzione microcanonica del composto, esce $\rho_C\propto e^{-\beta H}$: il canonico <b>nasce</b> da qui, e $\beta$ è il moltiplicatore di Lagrange di questa tappa promosso a inverso della temperatura del bagno. Il microcanonico è la radice, il canonico e il gran canonico sono i rami.`},
    {dove:'Statistiche<br>quantistiche', txt:R`Il conteggio corretto $1/N!$ è la spia classica dell&rsquo;indistinguibilità: portata alle conseguenze diventa la statistica di <b>Fermi-Dirac</b> e di <b>Bose-Einstein</b>. La densità degli stati $g(\varepsilon)=\int\delta(\varepsilon-H)$ costruita qui è lo stesso oggetto su cui poggiano il gas di fermioni e la condensazione di Bose — non sa nulla della temperatura, e per questo resta identica cambiando statistica.`},
    {dove:'Termodinamica<br>dei buchi neri', txt:R`L&rsquo;entropia come logaritmo di un conteggio di microstati è il paradigma che Bekenstein e Hawking estendono ai buchi neri: $S=\tfrac{k A}{4\ell_P^2}$, con $A$ l&rsquo;area dell&rsquo;orizzonte. La domanda «quali microstati conta quel logaritmo?» è ancora aperta, ed è una delle rotte verso la gravità quantistica.`},
    {dove:'Teoria<br>dellinformazione', txt:R`La stessa forma $S=-\sum p\log p$, che nel microcanonico con $p=1/\Omega$ dà $\log\Omega$, è l&rsquo;<b>entropia di Shannon</b>: la quantità di informazione mancante per specificare il microstato dato il macrostato. Il postulato di equiprobabilità diventa il principio di <b>massima entropia</b> di Jaynes — l&rsquo;assegnazione di probabilità meno impegnativa compatibile con ciò che si sa.`}
   ],
   domanda:R`L&rsquo;entropia microcanonica $S=\log\Omega(E)$ è definita per un sistema <b>isolato</b>, e la sua estensività ha richiesto il fattore $1/N!$. <b>Domanda che porti avanti:</b> per i sistemi con interazioni a lungo raggio — un plasma gravitazionale, una galassia — l&rsquo;energia <i>non</i> è estensiva (l&rsquo;energia di due sottosistemi accostati non è la somma, per via dell&rsquo;interazione fra loro), l&rsquo;integrale di picco della tappa 04 può fallire, e nascono fenomeni impossibili nel caso a corto raggio: calori specifici negativi, inequivalenza degli ensembles. <b>Il microcanonico e il canonico, che qui davano la stessa termodinamica, lì rispondono in modo diverso — e allora quale dei due è quello giusto?</b> È la frontiera della meccanica statistica dei sistemi non additivi, e tocca da vicino l&rsquo;astrofisica e i sistemi complessi.`}
]}

];
