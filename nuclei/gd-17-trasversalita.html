/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<

var CORSO = 'geometria-differenziale';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["misura-nulla"] = {"nome":"Insieme di misura nulla","riga":"$A$ ha misura nulla se per ogni $\\varepsilon\\gt0$ esiste una famiglia numerabile di cubi che lo ricopre e la cui somma dei volumi è minore di $\\varepsilon$: «trascurabile» non vuol dire piccolo, vuol dire coperto a costo arbitrariamente basso.","serve":"È la nozione che permette di dire «quasi ogni» senza teoria della misura completa: non serve costruire Lebesgue, basta la definizione col ricoprimento, ed è per questo che entra in geometria differenziale senza dipendenze. Tre proprietà fanno tutto il lavoro, e sono le sole che si usano: (a) un'unione **numerabile** di insiemi di misura nulla ha misura nulla — è ciò che consente di ragionare carta per carta su una varietà, che di carte ne ha una base numerabile; (b) avere misura nulla è **invariante per diffeomorfismi**, anzi per mappe lisce fra aperti della stessa dimensione, quindi è una proprietà che la varietà possiede indipendentemente dalle carte scelte; (c) un insieme di misura nulla ha **parte interna vuota**, quindi il suo complementare è denso: da «i valori cattivi hanno misura nulla» segue sempre «ce n'è uno buono comunque vicino». La numerabilità in (a) non è un dettaglio tecnico: l'unione **non** numerabile dei punti di $[0,1]$, ciascuno di misura nulla, è $[0,1]$.","esempio":"I razionali di $[0,1]$ hanno misura nulla, pur essendo densi. Si enumerano, $q_1,q_2,\\dots$ — si può, sono numerabili — e attorno a $q_n$ si mette un intervallo di lunghezza $\\varepsilon/2^{n}$. Il ricoprimento c'è per costruzione, e la somma delle lunghezze è $\\sum_{n\\ge1}\\varepsilon/2^{n}=\\varepsilon$, arbitrariamente piccola. Il conto che regge tutto è la serie geometrica: si spende un budget finito distribuendolo su infiniti punti, perché i pezzi decrescono in modo sommabile. Lo stesso conto, rovesciato, dà l'insieme di Cantor: al passo $k$ restano $2^{k}$ intervalli di lunghezza $3^{-k}$, per una misura totale $(2/3)^{k}$, e $\\lim_{k\\to\\infty}(2/3)^{k}=0$ — misura nulla pur essendo più che numerabile, il che mostra che «numerabile» e «di misura nulla» sono condizioni diverse e la prima è solo sufficiente.","debito":"la misura di Lebesgue vera — $\\sigma$-additività, misurabilità, insiemi non misurabili — sta fuori dal percorso, e qui non serve: in geometria differenziale di «misura» si usa soltanto l'ideale degli insiemi trascurabili. Il teorema di Fubini per la misura nulla («se quasi ogni fetta è trascurabile nella fetta, l'insieme è trascurabile») si usa nella dimostrazione di Sard ed è ammesso senza prova.","controllo":[{"tipo":"somma","espr":"eps/2**n","var":"n","da":"1","a":"oo","vale":"eps","ipotesi":{"eps":"positive","n":"positive"},"dove":"esempio","appare":"\\sum_{n\\ge1}\\varepsilon/2^{n}=\\varepsilon"},{"tipo":"uguale","sinistra":"2**k*3**(-k)","vale":"(2/3)**k","ipotesi":{"k":"positive"},"dove":"esempio","appare":"(2/3)^{k}"},{"tipo":"limite","espr":"(2/3)**k","var":"k","a":"oo","vale":"0","ipotesi":{"k":"positive"},"dove":"esempio","appare":"\\lim_{k\\to\\infty}(2/3)^{k}=0"}]};
STRUM["compattezza"] = {"nome":"Compattezza","riga":"Ogni ricoprimento aperto ammette un sottoricoprimento finito: è la proprietà che permette di passare da «vale vicino a ogni punto» a «vale su tutto», con un numero finito di passi.","serve":"È l'ipotesi che rende globali le conclusioni locali, ed è per questo che ricorre in ogni dimostrazione di geometria differenziale. In $\\mathbb{R}^n$ equivale a chiuso e limitato (Heine-Borel), ma su una varietà quell'equivalenza non si può usare come definizione, perché «limitato» richiede una distanza e una varietà non ne ha una privilegiata. La conseguenza che si usa più spesso è negativa: gli unici sottoinsiemi di $\\mathbb{R}^n$ che sono **insieme** aperti e compatti sono $\\emptyset$ e nient'altro — ed è l'argomento per cui una varietà compatta non può essere coperta da una sola carta.","esempio":"L'intervallo $(0,1)$ non è compatto, e si vede esibendo un ricoprimento senza sottoricoprimento finito: gli aperti $A_n=\\left(\\tfrac1n,1\\right)$ per $n\\ge2$ ricoprono $(0,1)$, perché ogni $x\\gt0$ sta in $A_n$ appena $\\tfrac1n\\lt x$, cioè appena $n\\gt1/x$. Ma una sottofamiglia finita $A_{n_1},\\dots,A_{n_k}$ ha un indice massimo $N$, quindi la sua unione è $\\left(\\tfrac1N,1\\right)$, e il punto $x=\\tfrac1{2N}$ resta fuori: è positivo, dunque sta in $(0,1)$, ed è minore di $\\tfrac1N$. Il conto che regge l'argomento è $\\lim_{n\\to\\infty}\\tfrac1n=0$: gli $A_n$ si avvicinano a coprire tutto, ma nessuno di essi contiene un intorno di $0$, e servirebbero tutti. Chiudendo l'intervallo, $[0,1]$ diventa compatto e quel ricoprimento smette di essere un ricoprimento — $0$ non sta in nessun $A_n$.","debito":"la dimostrazione del teorema di Heine-Borel e la teoria generale degli spazi compatti stanno fuori dal percorso: qui c'è l'uso che se ne fa. Nel corso di Diverio la compattezza entra come ipotesi (sfera, gruppi di Lie compatti) e come conclusione della locale compattezza delle varietà.","controllo":[{"tipo":"limite","espr":"1/n","var":"n","a":"oo","vale":"0","ipotesi":{"n":"positive"},"dove":"esempio","appare":"\\lim_{n\\to\\infty}\\tfrac1n=0"},{"tipo":"disuguaglianza","sinistra":"1/(2*N)","destra":"1/N","relazione":"<","ipotesi":{"N":"positive"},"dove":"esempio","appare":"minore di $\\tfrac1N$"}]};
STRUM["campo-vettoriale"] = {"nome":"Campo vettoriale","riga":"Una funzione che a ogni punto dello spazio associa un vettore, scritta $\\mathbf{F}(x,y,z)=F_x\\,\\hat{\\imath}+F_y\\,\\hat{\\jmath}+F_z\\,\\hat{k}$ con le tre componenti funzioni del punto.","serve":"È il modo di dire «c'è qualcosa in ogni punto dello spazio, e ha una direzione». Serve perché permette di smettere di ragionare su coppie di oggetti che si attraggono a distanza e di ragionare su una proprietà dello spazio: la sorgente prepara il campo, e chi arriva dopo sente solo ciò che trova dove si trova.","esempio":"Il campo di una carica puntiforme $q$ nell'origine è $\\mathbf{E}=\\dfrac{q}{4\\pi\\varepsilon_0 r^{2}}\\hat{r}$: la direzione è radiale, il modulo dipende solo dalla distanza. Con $q=1$ e $4\\pi\\varepsilon_0=1$, nel punto $(3,4,0)$ si ha $r=5$, quindi il modulo vale $\\tfrac{1}{25}$ e il versore è $\\left(\\tfrac35,\\tfrac45,0\\right)$: la componente lungo $x$ è $\\tfrac{3}{125}$.","pieno":{"file":"04-campi-vettoriali.html","tappa":"00","come":"la trattazione completa, nel nucleo sui campi vettoriali di Analisi Vettoriale"},"qui":{"elettromagnetismo":{"serve":"È l'oggetto che l'intero corso studia: $\\mathbf{E}$ e $\\mathbf{B}$ sono campi vettoriali, e le quattro equazioni di Maxwell sono affermazioni su come le loro derivate spaziali si legano alle sorgenti. Tutto ciò che si impara dopo — flusso, circuitazione, divergenza, rotore — è un modo di interrogare un campo vettoriale.","esempio":"Per la carica puntiforme in $(3,4,0)$ con $q=1$ e $4\\pi\\varepsilon_0=1$: $r=5$, modulo $\\tfrac{1}{25}$, e la componente lungo $x$ vale $\\tfrac{3}{125}$. Le tre componenti non sono tre campi separati: ruotando gli assi si mescolano fra loro, ed è quello che rende $\\mathbf{E}$ un vettore e non una terna di numeri."}},"controllo":[{"tipo":"uguale","sinistra":"sqrt(3**2+4**2)","vale":"5","dove":"esempio","appare":"r=5"},{"tipo":"uguale","sinistra":"1/sqrt(3**2+4**2)**2","vale":"1/25","dove":"esempio","appare":"\\tfrac{1}{25}"},{"tipo":"uguale","sinistra":"(1/5**2)*(3/5)","vale":"3/125","dove":"esempio","appare":"\\tfrac{3}{125}"},{"tipo":"uguale","sinistra":"sqrt(3**2+4**2)","vale":"5","dove":"qui.elettromagnetismo.esempio","appare":"r=5"},{"tipo":"uguale","sinistra":"(1/5**2)*(3/5)","vale":"3/125","dove":"qui.elettromagnetismo.esempio","appare":"\\tfrac{3}{125}"}]};

{ num:'00', title:'Di cosa parla questo movimento', meta:'Geometria Differenziale · voci G.31 e R.9 · lultima lezione, e lidea che tiene insieme il corso',
  blocchi:[
  {t:'prosa', title:'La domanda, con lesempio piu semplice', tag:'architettura', html:R`
  <p>Due curve nel piano si incontrano in un punto. Se le si sposta appena, continuano a incontrarsi in un punto — magari spostato, ma c'è. <b>Due curve tangenti</b>, invece, sono un caso fragile: basta muoverne una di pochissimo e o si separano, o si intersecano in due punti. <b>Il primo incontro è stabile, il secondo no</b>, e questo movimento dà il nome e la teoria a quella differenza.</p>
  <p>Il nome è <b>trasversalità</b>. L'idea è che due oggetti si incontrino «in posizione generale», cioè senza allineamenti accidentali, e il teorema è che <b>questa è la situazione normale</b>: le configurazioni non trasverse sono eccezionali, di misura nulla, e si eliminano con una perturbazione arbitrariamente piccola.</p>
  <p><b>È l'ultima lezione del corso di Diverio</b> (7 gennaio), ed è il posto giusto per finire: la trasversalità usa tutto quello che il corso ha costruito — il differenziale, i valori regolari, Sard, i flussi — e lo mette al servizio di un'idea che si esporta ovunque. Il testo che la copre a fondo è <b>Lee, capitolo 6</b>, che tratta Sard e trasversalità insieme; <b>Guillemin-Pollack</b> ne dà la versione più geometrica e con più figure.</p>`},
  {t:'prosa', title:'Il filo delle quattro tappe', tag:'mappa', html:R`
  <p>Si comincia dalla <b>definizione</b>, che è una condizione sugli spazi tangenti e va capita prima nei casi in cui si vede. Poi il <b>conto delle dimensioni</b>, che è ciò che rende la nozione utile: dice quanto è grande l'intersezione, e quando è vuota. La terza tappa è il <b>teorema di genericità</b> — la trasversalità si ottiene sempre perturbando, ed è Sard che lo garantisce. L'ultima riprende il metodo delle caratteristiche del movimento precedente e mostra che la condizione di non caratteristicità <b>era</b> trasversalità, chiudendo il cerchio.</p>`}

/* ---------------- 01 · LA DEFINIZIONE ---------------- */
{ num:'01', title:'La definizione: sommare i tangenti, non intersecarli', meta:'la condizione sui tangenti · i casi che si vedono · la versione per le mappe',
  blocchi:[
  {t:'prosa', title:'La condizione, e il modo giusto di leggerla', tag:'grammatica', html:R`
  <p>Due sottovarietà $A,B\subseteq M$ si dicono <b>trasverse</b> se in ogni punto $p$ della loro intersezione
  $$T_pA+T_pB=T_pM.$$
  <b>La somma, non l'intersezione</b>: si chiede che i due tangenti, messi insieme, <b>generino</b> tutto lo spazio tangente ambiente. Non si chiede che si incontrino poco — si chiede che insieme bastino.</p>
  <p><b>Perché è la formulazione giusta</b>, e conviene vederlo su due esempi:</p>
  <ul>
   <li>due piani distinti in $\mathbb{R}^3$: i tangenti sono due piani diversi, la loro somma è tutto $\mathbb{R}^3$. <b>Trasversi</b>, e infatti si incontrano lungo una retta che non sparisce se li si inclina appena;</li>
   <li>una sfera e un piano <b>tangente</b>: nel punto di contatto i due tangenti <b>coincidono</b>, la loro somma è un piano e non tutto lo spazio. <b>Non trasversi</b> — e infatti alzando il piano di un capello l'intersezione diventa un cerchio, abbassandolo sparisce.</li>
  </ul>
  <p><b>La condizione è vuota dove le due non si incontrano</b>: se $A\cap B=\emptyset$, sono trasverse per definizione. Sembra una convenzione e invece è essenziale: rende la trasversalità una proprietà <i>stabile</i>, perché anche il non incontrarsi è un modo di stare in posizione generale.</p>`},
  {t:'prosa', title:'La versione per le mappe, che e quella che si usa nei teoremi', tag:'grammatica', html:R`
  <p>Più utile è la versione con una mappa. Data $F:M\to N$ liscia e $S\subseteq N$ sottovarietà, si dice che <b>$F$ è trasversa a $S$</b> se in ogni $p$ con $F(p)\in S$
  $$dF_p(T_pM)+T_{F(p)}S=T_{F(p)}N.$$
  <p><b>Teorema.</b> Se $F$ è trasversa a $S$, allora $F^{-1}(S)$ è una sottovarietà di $M$, con
  $$\operatorname{codim}F^{-1}(S)=\operatorname{codim}S.$$
  <p><b>Questo è il teorema del valore regolare, generalizzato.</b> Se $S$ è un punto, «trasversa a $S$» significa $dF_p$ suriettivo, cioè valore regolare, e la codimensione è $\dim N$: si ritrova esattamente l'enunciato noto. <b>La trasversalità sostituisce «un punto» con «una sottovarietà qualunque»</b>, e il prezzo da pagare nella dimostrazione è nullo — si scrive $S$ localmente come zero di una sommersione e si applica il caso già noto.</p>`}
]},

  <p>Per due sottovarietà trasverse l'intersezione è una sottovarietà, e la sua dimensione è

/* ---------------- 03 · LA GENERICITÀ ---------------- */
{ num:'03', title:'Il teorema di genericita: la trasversalita si ottiene sempre', meta:'lenunciato · dove entra Sard · e la stabilita nel caso compatto',
  blocchi:[
  {t:'prosa', title:'Lenunciato, e da dove viene', tag:'idea', html:R`
  <p><b>Teorema di trasversalità (Thom).</b> Data $F:M\to N$ liscia e $S\subseteq N$ sottovarietà, esiste una mappa $\tilde F$ arbitrariamente vicina a $F$ (e omotopa a essa) che è <b>trasversa</b> a $S$. Anzi: in una famiglia di perturbazioni, <b>quasi tutte</b> — nel senso della misura — sono trasverse.</p>
  <p><b>La dimostrazione è Sard</b>, applicato con un'idea semplice e brillante. Si immerge $F$ in una famiglia $F_s$ parametrizzata da $s$ che percorre una palla, scelta in modo che la mappa complessiva $(p,s)\mapsto F_s(p)$ sia <b>già</b> trasversa a $S$ — cosa facile, perché si può traslare liberamente. Poi si guarda la proiezione sull'insieme dei parametri, e si applica il teorema di Sard: <b>i valori critici di quella proiezione hanno <span class="str" data-str="misura-nulla">misura nulla</span></b>, e proprio per i parametri regolari la mappa $F_s$ risulta trasversa.</p>
  <p><b>Vale la pena isolare il meccanismo, perché è una mossa che si ripete.</b> Il problema di partenza — trovare <i>una</i> perturbazione buona — è difficile da attaccare direttamente, perché non si sa dove cercarla. Lo si sostituisce allora con un problema più grande e più facile: si costruisce una famiglia <i>intera</i> di perturbazioni, scelta in modo che l&rsquo;oggetto complessivo sia automaticamente in posizione generale. <b>A quel punto non si cerca più niente: si conta</b>, e Sard dice che i parametri cattivi sono trascurabili.</p>
  <p><b>È lo stesso schema del metodo probabilistico</b>, quello con cui in combinatoria si dimostra che esiste un oggetto con una certa proprietà mostrando che un oggetto casuale ce l&rsquo;ha con probabilità positiva. Qui «probabilità positiva» è sostituito da «fuori da un insieme di misura nulla», e il ruolo della misura di probabilità è preso dalla misura di Lebesgue sullo spazio dei parametri. <b>Non si esibisce mai la perturbazione buona</b> — come già in gd-10 — e questo è il prezzo di un argomento che in cambio non richiede di conoscere niente del problema specifico.</p>
  <p><b>Questo è il motivo per cui Sard sta nel corso.</b> Non è un teorema di curiosità sulla misura: è l'ingrediente che trasforma «si può sempre perturbare per mettersi in posizione generale» da speranza a teorema — e quella frase, negli argomenti di topologia differenziale, si usa a ogni pagina.</p>`},
  {t:'prosa', title:'La stabilita, e il numero che non cambia', tag:'sintesi', html:R`
  <p>Il secondo pilastro: <b>se $M$ è <span class="str" data-str="compattezza">compatta</span> e $F$ è trasversa a $S$ chiusa, allora ogni mappa abbastanza vicina a $F$ è ancora trasversa</b>, e le controimmagini $F^{-1}(S)$ sono diffeomorfe fra loro. <b>La trasversalità è una proprietà aperta</b>, oltre che densa.</p>
  <p><b>La compattezza qui non è ornamentale e conviene vedere che cosa fa.</b> La trasversalità è una condizione puntuale, e in ogni punto è stabile per piccole perturbazioni — ma «piccola» dipende dal punto, e senza compattezza quel margine può assottigliarsi indefinitamente, fino a non esistere nessuna perturbazione uniformemente piccola che vada bene ovunque. <b>Su un compatto il margine ha un minimo positivo</b>, ed è lo stesso meccanismo del Lemma del Tempo Uniforme di gd-15: da «vale in ogni punto» a «vale uniformemente» si passa solo con la compattezza.</p>
  <p>Insieme, densità e stabilità danno il metodo che regge tutta la topologia differenziale: se una quantità si può calcolare per mappe trasverse, e non cambia per perturbazioni, allora <b>è un invariante</b>. Il caso più semplice è il <b>numero di intersezione</b>: quando il conto delle dimensioni dà zero, $F^{-1}(S)$ è un insieme finito di punti, e il loro numero (con segno) <b>non cambia</b> deformando.</p>
  <div class="note"><b>La catena di teoremi del corso arriva qui.</b> Il valore regolare dà le sottovarietà; Sard dice che i valori regolari sono quasi tutti; la trasversalità generalizza il valore regolare a bersagli qualunque; la genericità garantisce che si possa sempre ottenere; la stabilità trasforma i conteggi in invarianti. <b>Nessuno dei cinque passi è difficile da solo, e insieme producono numeri interi che non dipendono da nessuna scelta.</b> È una delle costruzioni più economiche della matematica del Novecento.</div>`}
]},

/* ---------------- 04 · IL RITORNO DELLE CARATTERISTICHE ---------------- */
{ num:'04', title:'Il cerchio che si chiude: la non caratteristicita era trasversalita', meta:'la rilettura · il grafico dentro un prodotto · il caso quasi-lineare · e la fine del corso',
  blocchi:[
  {t:'prosa', title:'La rilettura, e cosa aggiunge', tag:'costruzione', html:R`
  <p>Nel movimento precedente il problema di Cauchy chiedeva che il <span class="str" data-str="campo-vettoriale">campo</span> $X$ <b>non fosse tangente</b> all'ipersuperficie $S$ su cui si assegna il dato. Riletta ora, quella condizione è
  $$T_pS+\mathbb{R}\,X(p)=T_pM,$$
  cioè <b>esattamente la trasversalità</b> fra $S$ e le curve integrali di $X$. <b>La condizione di non caratteristicità non era una richiesta tecnica delle PDE: era una richiesta geometrica di posizione generale.</b></p>
  <p><b>E il teorema di genericità dà l'informazione in più</b>: una superficie presa a caso è trasversa al campo, quindi <b>quasi ogni</b> superficie va bene come supporto del dato. Le superfici caratteristiche — quelle cattive — sono l'eccezione, non la regola, e se il proprio problema ne ha una si può perturbarla.</p>`},
  {t:'prosa', title:'Il grafico dentro un prodotto, e il caso quasi-lineare', tag:'idea', html:R`
  <p>Diverio chiude il corso con l'osservazione che lega i due argomenti: <b>quando una sottovarietà di un prodotto è il grafico di una funzione?</b> Se $\Gamma\subseteq M\times N$ ha la dimensione di $M$ ed è <b>trasversa</b> alle fibre $\{p\}\times N$, allora localmente è un grafico — perché la proiezione su $M$ ha differenziale invertibile, e si applica il teorema della funzione inversa.</p>
  <p><b>È esattamente ciò che serve al caso quasi-lineare.</b> Lì la soluzione si costruisce come sottovarietà dello spazio esteso $(x,f)$, integrando un campo; e la domanda «quella sottovarietà è il grafico di una funzione $f(x)$?» è la domanda se la soluzione esiste come funzione. <b>La risposta è: finché la trasversalità con le fibre regge.</b></p>
  <p><b>E lo shock di Burgers, visto da qui, non è una catastrofe ma una perdita di trasversalità</b>: al tempo critico la sottovarietà soluzione «si ripiega» e la sua tangente diventa verticale rispetto alla proiezione. Sopra un punto ci sono più valori, il grafico non esiste più. <b>La geometria non impedisce lo shock — lo spiega</b>, e dice che è il momento in cui una condizione di posizione generale cade.</p>
  <p><b>Il conto, su un dato concreto, perché la frase diventi un numero.</b> Si prenda come dato iniziale una gaussiana. La sua derivata è la gaussiana moltiplicata per il doppio opposto della variabile, e per trovare dove quella derivata è minima la si deriva ancora: viene <b>$(4x^{2}-2)e^{-x^{2}}$</b>, che si annulla nei due punti di ascissa un mezzo di radice di due in valore assoluto. Nel punto positivo la derivata del dato raggiunge il suo minimo, e il tempo di shock — l&rsquo;opposto del reciproco di quel minimo — vale <b>$\sqrt{e/2}$</b>, cioè poco meno di $1{,}17$.</p>
  <p><b>Prima di quell&rsquo;istante la superficie soluzione è un grafico e la funzione esiste</b>; dopo, la superficie continua a esistere come sottovarietà liscia dello spazio esteso — <b>non le succede nulla</b> — ma smette di essere trasversa alle fibre della proiezione, e quindi smette di essere il grafico di una funzione. <b>Questa è la differenza fra il punto di vista analitico e quello geometrico, ed è il guadagno dell&rsquo;ultima lezione</b>: per l&rsquo;analisi la soluzione «si rompe», per la geometria una proiezione smette di essere iniettiva, e l&rsquo;oggetto che si stava studiando è intatto.</p>
  <div class="note"><b>Perché è il modo giusto di chiudere il corso.</b> L'ultima lezione non introduce uno strumento nuovo: prende la condizione più tecnica incontrata — «il campo non sia tangente» — e mostra che era un caso particolare della nozione più generale di tutte. <b>Il corso finisce facendo vedere che i suoi pezzi erano lo stesso pezzo</b>, ed è il tipo di chiusura che rende un corso una teoria invece che un elenco.</div>`},
  {t:'plot', title:'Il profilo che si ripiega: lo shock come perdita di trasversalita',
   intro:R`La soluzione di Burgers con dato gaussiano, a tre istanti. Ogni punto del profilo viaggia con velocità pari alla propria quota, quindi la cresta avanza più in fretta della base: prima il fronte si irripidisce, poi si rovescia.`,
   plots:[
    {kind:'curve', x:'t', y:'exp(-t*t)', tr:[-3,3], equal:false,
     xr:[-3,4], yr:[-0.1,1.15], height:300,
     title:'t = 0: il dato iniziale, un grafico onesto',
     segs:[{x1:-3, y1:0, x2:4, y2:0, col:'#4d5a6b', width:1}]},
    {kind:'curve', x:'t+1.166*exp(-t*t)', y:'exp(-t*t)', tr:[-3,3], equal:false,
     xr:[-3,4], yr:[-0.1,1.15], height:300,
     title:'t = 1,17: il tempo di shock, tangente verticale',
     segs:[{x1:-3, y1:0, x2:4, y2:0, col:'#4d5a6b', width:1}],
     marks:[{x:1.166*0.6065+0.7071, y:0.6065, label:'qui la tangente diventa verticale', col:'#ff6b6b', up:true}]},
    {kind:'curve', x:'t+2.5*exp(-t*t)', y:'exp(-t*t)', tr:[-3,3], equal:false,
     xr:[-3,4], yr:[-0.1,1.15], height:300,
     title:'t = 2,5: tre valori sopra lo stesso punto: non e piu un grafico',
     segs:[{x1:-3, y1:0, x2:4, y2:0, col:'#4d5a6b', width:1}]}
   ],
   leggi:R`<p><b>Nel primo pannello la curva è il grafico di una funzione</b>: ogni verticale la incontra una volta sola. Nel terzo no — c&rsquo;è una regione in cui la verticale la incontra tre volte — e in mezzo c&rsquo;è l&rsquo;istante in cui la transizione avviene, con la curva che ha una tangente verticale in un punto solo.</p>
   <p><b>La curva è disegnata in forma parametrica, e non per caso.</b> Il parametro è il punto di partenza della caratteristica, e la formula è «l&rsquo;ascissa è il punto di partenza più il tempo per la velocità, l&rsquo;ordinata è la velocità stessa». <b>In forma parametrica la curva è liscia e innocua a ogni tempo</b>: è solo guardandola come grafico, cioè proiettandola sull&rsquo;asse orizzontale, che nasce il problema. La patologia sta nella proiezione, non nell&rsquo;oggetto.</p>
   <p><b>E la trasversalità dice esattamente questo.</b> Le fibre della proiezione sono le rette verticali; la curva è trasversa a una fibra quando la interseca con tangenti che insieme generano il piano, cioè quando la tangente non è verticale. <b>Al tempo di shock la tangente diventa verticale in un punto</b>, la trasversalità cade lì per prima, e da quell&rsquo;istante in poi cade in un intero intervallo. <b>Il tempo di shock è il primo istante in cui una condizione di posizione generale smette di valere</b>, e questo è il contenuto geometrico di ciò che l&rsquo;analisi chiama rottura della soluzione.</p>`}
]},

/* ---------------- 05 · IL SENSO ---------------- */
{ num:'05', title:'Esercizi — tocca a te', meta:'il conto delle codimensioni in tre casi nuovi · due circonferenze tangenti · e il grafico che si perde',
  blocchi:[
  {t:'esercizio', title:'1 · Il conto delle codimensioni, in tre casi nuovi',
   src:'il conto che si fa a mente, e che decide se ha senso cercare unintersezione',
   testo:R`Usando la formula delle codimensioni, prevedi la dimensione dell'intersezione generica: (a) una curva e una superficie in $\mathbb{R}^{3}$; (b) due curve in $\mathbb{R}^{4}$; (c) due piani in $\mathbb{R}^{4}$. In ciascun caso di' che cosa significa il risultato.`,
   steps:[
    {label:'I tre conti', body:R`
    <p><b>(a)</b> Le dimensioni sono $1$ e $2$ dentro $3$, quindi <b>$1+2-3$</b> dà zero: l&rsquo;intersezione generica è fatta di <b>punti isolati</b>. È la situazione della retta che buca un piano, ed è il caso che rende ben posto il problema «dove la traiettoria attraversa la superficie di rivelazione».</p>
    <p><b>(b)</b> Due curve in quattro dimensioni: <b>$1+1-4$</b> dà meno due, un numero negativo. <b>L&rsquo;intersezione generica è vuota</b>: due curve nello spazio quadridimensionale, prese a caso, non si incontrano mai — e non solo, si possono sempre separare con una piccola perturbazione, perché la trasversalità è stabile. È lo stesso conto che in gd-09 diceva perché due superfici in $\mathbb{R}^{4}$ si incontrano in punti e in $\mathbb{R}^{3}$ lungo curve.</p>
    <p><b>(c)</b> Due piani in quattro dimensioni: <b>$2+2-4$</b> dà zero, quindi <b>punti isolati</b>. È un caso istruttivo perché contraddice l&rsquo;intuizione tridimensionale, dove due piani o si incontrano lungo una retta o sono paralleli: in quattro dimensioni il caso generico è che si incontrino in un punto solo, e l&rsquo;incontro lungo una retta è la configurazione eccezionale.</p>`},
    {label:'Come si usa il conto, in pratica', body:R`
    <p><b>La regola operativa è che il conto va fatto prima, non dopo.</b> Se il risultato è negativo, cercare l&rsquo;intersezione è inutile: o non c&rsquo;è, o c&rsquo;è per una ragione speciale che va nominata. Se è zero, ci si aspetta un numero finito di punti e ha senso contarli. Se è positivo, l&rsquo;intersezione è essa stessa una sottovarietà e si può studiarne la geometria.</p>
    <p><b>E quando il conto non torna, l&rsquo;informazione è preziosa.</b> Se due oggetti si incontrano in dimensione <i>maggiore</i> di quella prevista, non sono in posizione generale — e c&rsquo;è una ragione strutturale, tipicamente una simmetria o un vincolo. <b>La non genericità è un sintomo</b>, e in fisica è quasi sempre il sintomo di una legge di conservazione o di una degenerazione che merita un nome.</p>`}
   ]},
  {t:'esercizio', title:'2 · Due circonferenze tangenti, e la perturbazione',
   src:'il caso al confine, che mostra sia la densita sia la stabilita in azione',
   testo:R`Nel piano, due circonferenze tangenti in un punto sono trasverse? Perturbandone una di poco, che cosa può succedere, e che cosa si conserva?`,
   steps:[
    {label:'La risposta, e perche', body:R`
    <p><b>Non sono trasverse.</b> Nel punto di tangenza i due spazi tangenti coincidono — sono la stessa retta — e la loro somma è una retta, non il piano. La condizione di trasversalità richiede che la somma sia tutto lo spazio tangente all&rsquo;ambiente, e qui manca una dimensione.</p>
    <p>Il conto delle codimensioni lo conferma dall&rsquo;altro lato: due curve nel piano dovrebbero incontrarsi in dimensione zero, cioè in punti isolati, <b>e in effetti il punto di tangenza è isolato</b> — quindi la dimensione torna. <b>Ma la dimensione giusta non basta</b>: la trasversalità è una condizione sui tangenti, non sul conto, e questo esempio è esattamente quello che mostra che le due cose sono diverse. <b>È il caso da ricordare per non confondere «dimensione prevista» con «posizione generale».</b></p>`},
    {label:'Le due perturbazioni, e il numero che sopravvive', body:R`
    <p>Spostando una circonferenza verso l&rsquo;altra, i due punti di tangenza si separano e diventano <b>due</b> intersezioni trasverse. Spostandola in senso opposto, l&rsquo;intersezione <b>sparisce</b>. Entrambe le configurazioni perturbate sono trasverse — coerentemente con la densità — e sono diverse fra loro, il che a prima vista sembra contraddire la stabilità.</p>
    <p><b>Non c&rsquo;è contraddizione: la stabilità si applica alle configurazioni trasverse, e quella di partenza non lo era.</b> Partendo da due circonferenze già secanti, ogni piccola perturbazione ne lascia due, e partendo da due disgiunte ne lascia zero. La tangenza è la configurazione instabile che separa i due regimi, ed è proprio ciò che il teorema di genericità dichiara raro.</p>
    <p><b>Ciò che sopravvive è il numero di intersezioni modulo due</b>: zero e due sono entrambi pari, e il conteggio con segno di una configurazione trasversa non cambia per deformazione. <b>Due punti che compaiono lo fanno sempre a coppie di segno opposto</b>, e questa è la forma più semplice dell&rsquo;invariante di intersezione: il numero di punti può cambiare, la sua classe di parità no. È lo stesso meccanismo con cui in teoria dei campi le coppie particella-antiparticella si creano e si annichilano senza cambiare la carica.</p>`}
   ]},
  {t:'esercizio', title:'3 · Quando una sottovarieta smette di essere un grafico',
   src:'lesercizio che chiude il corso collegando lultima lezione alla penultima',
   testo:R`Nel piano $(x,y)$ si consideri la curva parametrizzata $\gamma(s)=(s^{3}-s,\ s)$. È una sottovarietà? È il grafico di una funzione $y(x)$? E il grafico di una funzione $x(y)$?`,
   steps:[
    {label:'Le tre domande, che hanno tre risposte diverse', body:R`
    <p><b>È una sottovarietà immersa</b>, e la verifica è quella di gd-09: la derivata della parametrizzazione non si annulla mai, perché la seconda componente ha derivata costante uguale a uno. La curva è anche iniettiva, perché la seconda coordinata determina il parametro.</p>
    <p><b>Non è il grafico di una funzione di $x$</b>: la proiezione sull&rsquo;asse delle ascisse non è iniettiva, e infatti la prima componente assume lo stesso valore per parametri diversi — il polinomio cubico ha tre radici distinte nel valore zero. <b>Sopra l&rsquo;origine ci sono tre punti della curva</b>, esattamente come nel terzo pannello della figura precedente.</p>
    <p><b>È invece il grafico di una funzione di $y$</b>: la seconda coordinata è il parametro stesso, quindi la proiezione verticale è una biiezione e la curva si scrive come «$x$ è una funzione di $y$». <b>La stessa sottovarietà è un grafico rispetto a una proiezione e non rispetto all&rsquo;altra</b>, ed è tutto il contenuto dell&rsquo;osservazione con cui Diverio chiude il corso.</p>`},
    {label:'La lettura in termini di trasversalita, e la fine del corso', body:R`
    <p>Le fibre della prima proiezione sono le rette verticali. La curva è trasversa a una retta verticale quando la sua tangente non è verticale, e la tangente è verticale dove si annulla la derivata della prima componente — cioè dove il polinomio derivato si annulla. <b>In quei due punti la trasversalità cade, e sono esattamente i punti in cui la curva «torna indietro»</b>.</p>
    <p>Le fibre della seconda proiezione sono le rette orizzontali, e la curva non è mai tangente a esse perché la sua seconda componente cresce sempre. <b>Trasversalità ovunque, quindi grafico ovunque</b>: il teorema del grafico dentro un prodotto è verificato nel caso più concreto possibile.</p>
    <p><b>E questo è il modo in cui il corso finisce.</b> La domanda «questa soluzione esiste come funzione?» non riguarda la soluzione — che esiste, ed è una sottovarietà liscia — ma il rapporto fra quella sottovarietà e una proiezione che si è scelta. <b>Cambiare proiezione cambia la risposta</b>, e quando nessuna proiezione funziona si è imparato qualcosa sull&rsquo;oggetto invece che sul metodo. <b>Tutta la geometria differenziale è questo spostamento</b>: dalle coordinate all&rsquo;oggetto, e poi indietro alle coordinate solo quando conviene.</p>`}
   ]}
]},

/* ---------------- 06 · IL SENSO ---------------- */
{ num:'06', title:'Il senso, e le rotte — e la fine del corso', meta:'cosa lascia in mano, e dove la trasversalita e lo strumento',
  blocchi:[
  {t:'prosa', title:'Cosa lascia in mano', tag:'sintesi', html:R`
  <p><b>Il punto.</b> «Posizione generale» diventa una nozione precisa, verificabile con una condizione sui tangenti, e <b>quasi sempre soddisfatta</b>. Da questo discendono i numeri interi della topologia differenziale — numeri di intersezione, gradi, indici — che sono invarianti perché contano configurazioni trasverse, e le configurazioni trasverse non cambiano sotto deformazione.</p>
  <p><b>E il corso finisce qui.</b> Tutto quello che è stato costruito — varietà, mappe, tangenti, campi, flussi, valori regolari, Sard — converge su questa idea. Ciò che non c'è, e che il corso non tocca: metriche, connessioni, curvatura, geodetiche. <b>Non è una mancanza: è una scelta</b>, e la direzione presa è quella della topologia differenziale invece che della geometria riemanniana.</p>`},
  {t:'prolessi', title:'Dove riappare questo movimento, nella fisica che farai',
   oggetto:R`<b>La trasversalità</b>: incontrarsi in posizione generale, e i numeri interi che ne derivano.`,
   rotte:[
    {dove:'Sistemi<br>dinamici', txt:R`Le <b>sezioni di Poincaré</b> sono superfici trasverse al flusso: la trasversalità è ciò che garantisce che la mappa di ritorno sia ben definita e liscia. E la <b>stabilità strutturale</b> di un sistema è la trasversalità delle intersezioni fra varietà stabili e instabili — quando falliscono, nascono le biforcazioni.`},
    {dove:'Teoria<br>dei campi', txt:R`Gli <b>istantoni</b> e i difetti topologici si contano come intersezioni trasverse, e i numeri che ne escono sono invarianti. La <b>teoria delle catastrofi</b> di Thom classifica proprio i modi in cui la trasversalità può fallire in una famiglia di funzioni.`},
    {dove:'Materia<br>condensata', txt:R`I <b>punti di Dirac</b> e i coni di Weyl sono intersezioni trasverse di bande nello spazio dei momenti: la loro esistenza è stabile — non si aprono per piccole perturbazioni — proprio perché l'intersezione è trasversa. <b>È la ragione per cui il grafene ha un gap nullo robusto.</b>`},
    {dove:'Meccanica<br>quantistica', txt:R`Il <b>teorema di non incrocio</b> di von Neumann e Wigner e' un conto di codimensioni: due livelli energetici che dipendono da un parametro non si incrociano, perche' l'incrocio richiederebbe tre condizioni e ne e' disponibile una sola. <b>I livelli si respingono per un motivo dimensionale.</b>`}
   ],
   domanda:R`La trasversalità dice che ciò che accade «di solito» è anche ciò che è stabile — e quindi che le configurazioni eccezionali non si osservano. <b>Domanda che porti avanti, e che chiude il corso:</b> perché allora la fisica è piena di situazioni non generiche? Le simmetrie <i>impongono</i> degenerazioni che la posizione generale escluderebbe: i livelli si incrociano quando una simmetria lo consente, le orbite si chiudono quando c'è una quantità conservata in più, il potenziale ha un punto critico degenere proprio dove avviene una transizione di fase. <b>La risposta è che la simmetria è precisamente il modo in cui la natura vive fuori dal caso generico</b>, e riconoscere una configurazione non trasversa è spesso il primo indizio che c'è una simmetria nascosta da trovare.`}
]}

function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');

  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';

  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
    else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
    else if(b.t==='prolessi') m.appendChild(sectionProlessi(b));
    else if(b.t==='reveal')m.appendChild(sectionReveal(b.title,b.tag,b.steps));
    else if(b.t==='esercizio') m.appendChild(sectionEsercizio(b));
    else if(b.t==='collaudo')  m.appendChild(sectionCollaudo(b.title,b.items));
    else if(b.t==='plot')      m.appendChild(sectionPlot(b));
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}

/* deep-link: gd-17-trasversalita.html#03 apre direttamente la tappa 03 */
window.addEventListener('DOMContentLoaded', function(){
  var h=(location.hash||'').replace('#','');
  showTappa(byId[h]?h:'00');
});
window.addEventListener('hashchange', function(){
  var h=(location.hash||'').replace('#','');
  if(byId[h]) showTappa(h);
});
</script>
