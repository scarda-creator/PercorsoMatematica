"use strict";
const R = String.raw;

function typeset(el){
  if(el && window.renderMathInElement){
    try{ renderMathInElement(el,{delimiters:[
      {left:'$$',right:'$$',display:true},
      {left:'$',right:'$',display:false}
    ],throwOnError:false}); }catch(e){}
  }
}
function elFromHTML(html){ var d=document.createElement('div'); d.innerHTML=html; return d; }

/* ===================================================================
   >>> IL REPERTORIO DEGLI STRUMENTI <<<
   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un
   rimando scritto nella prosa:

       <span class="str" data-str="serie-geometrica">la serie geometrica</span>

   Le schede citate da questo nucleo sono cucite qui sotto dal montaggio
   (assembla-nucleo.js): la pagina resta autosufficiente — niente fetch,
   niente sottocartelle da pubblicare — e un rimando a una scheda che non
   esiste FERMA la costruzione invece di arrivare in pagina rotto.
   Apertura: lo stesso gesto del collaudo (si clicca, il pannello compare,
   si typeset una volta sola), portato dentro la frase.
   =================================================================== */
var CORSO = 'geometria-differenziale';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};


function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';
  return h;
}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

/*MOVIMENTO
id:        gd-17 — trasversalità e metodo delle caratteristiche

/*CONTROLLO

/* ---------------- 00 · DI COSA PARLA QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Di cosa parla questo movimento', meta:'Geometria Differenziale · voci G.31 e R.9 · lultima lezione, e lidea che tiene insieme il corso',
  blocchi:[
  {t:'prosa', title:'La domanda, con lesempio piu semplice', tag:'architettura', html:R`
  <p>Due curve nel piano si incontrano in un punto. Se le si sposta appena, continuano a incontrarsi in un punto — magari spostato, ma c'è. <b>Due curve tangenti</b>, invece, sono un caso fragile: basta muoverne una di pochissimo e o si separano, o si intersecano in due punti. <b>Il primo incontro è stabile, il secondo no</b>, e questo movimento dà il nome e la teoria a quella differenza.</p>
  <p>Il nome è <b>trasversalità</b>. L'idea è che due oggetti si incontrino «in posizione generale», cioè senza allineamenti accidentali, e il teorema è che <b>questa è la situazione normale</b>: le configurazioni non trasverse sono eccezionali, di misura nulla, e si eliminano con una perturbazione arbitrariamente piccola.</p>
  <p><b>È l'ultima lezione del corso di Diverio</b> (7 gennaio), ed è il posto giusto per finire: la trasversalità usa tutto quello che il corso ha costruito — il differenziale, i valori regolari, Sard, i flussi — e lo mette al servizio di un'idea che si esporta ovunque. Il testo che la copre a fondo è <b>Lee, capitolo 6</b>, che tratta Sard e trasversalità insieme; <b>Guillemin-Pollack</b> ne dà la versione più geometrica e con più figure.</p>`},
  {t:'prosa', title:'Il filo delle quattro tappe', tag:'mappa', html:R`
  <p>Si comincia dalla <b>definizione</b>, che è una condizione sugli spazi tangenti e va capita prima nei casi in cui si vede. Poi il <b>conto delle dimensioni</b>, che è ciò che rende la nozione utile: dice quanto è grande l'intersezione, e quando è vuota. La terza tappa è il <b>teorema di genericità</b> — la trasversalità si ottiene sempre perturbando, ed è Sard che lo garantisce. L'ultima riprende il metodo delle caratteristiche del movimento precedente e mostra che la condizione di non caratteristicità <b>era</b> trasversalità, chiudendo il cerchio.</p>`}
]},

/* ---------------- 01 · LA DEFINIZIONE ---------------- */
{ num:'01', title:'La definizione: sommare i tangenti, non intersecarli', meta:'la condizione sui tangenti · i casi che si vedono · la versione per le mappe',
  blocchi:[
  {t:'prosa', title:'La condizione, e il modo giusto di leggerla', tag:'grammatica', html:R`
  <p>Due sottovarietà $A,B\subseteq M$ si dicono <b>trasverse</b> se in ogni punto $p$ della loro intersezione
  $$T_pA+T_pB=T_pM.$$
  <b>La somma, non l'intersezione</b>: si chiede che i due tangenti, messi insieme, <b>generino</b> tutto lo spazio tangente ambiente. Non si chiede che si incontrino poco — si chiede che insieme bastino.</p>
  <p><b>Perché è la formulazione giusta</b>, e conviene vederlo su due esempi:</p>
  <ul>
   <li>due piani distinti in $\mathbb{R}^3$: i tangenti sono due piani diversi, la loro somma è tutto $\mathbb{R}^3$. <b>Trasversi</b>, e infatti si incontrano lungo una retta che non sparisce se li si inclina appena;</li>
   <li>una sfera e un piano <b>tangente</b>: nel punto di contatto i due tangenti <b>coincidono</b>, la loro somma è un piano e non tutto lo spazio. <b>Non trasversi</b> — e infatti alzando il piano di un capello l'intersezione diventa un cerchio, abbassandolo sparisce.</li>
  </ul>
  <p><b>La condizione è vuota dove le due non si incontrano</b>: se $A\cap B=\emptyset$, sono trasverse per definizione. Sembra una convenzione e invece è essenziale: rende la trasversalità una proprietà <i>stabile</i>, perché anche il non incontrarsi è un modo di stare in posizione generale.</p>`},
  {t:'prosa', title:'La versione per le mappe, che e quella che si usa nei teoremi', tag:'grammatica', html:R`
  <p>Più utile è la versione con una mappa. Data $F:M\to N$ liscia e $S\subseteq N$ sottovarietà, si dice che <b>$F$ è trasversa a $S$</b> se in ogni $p$ con $F(p)\in S$
  $$dF_p(T_pM)+T_{F(p)}S=T_{F(p)}N.$$
  <p><b>Teorema.</b> Se $F$ è trasversa a $S$, allora $F^{-1}(S)$ è una sottovarietà di $M$, con
  $$\operatorname{codim}F^{-1}(S)=\operatorname{codim}S.$$
  <p><b>Questo è il teorema del valore regolare, generalizzato.</b> Se $S$ è un punto, «trasversa a $S$» significa $dF_p$ suriettivo, cioè valore regolare, e la codimensione è $\dim N$: si ritrova esattamente l'enunciato noto. <b>La trasversalità sostituisce «un punto» con «una sottovarietà qualunque»</b>, e il prezzo da pagare nella dimostrazione è nullo — si scrive $S$ localmente come zero di una sommersione e si applica il caso già noto.</p>`}
]},

/* ---------------- 02 · IL CONTO DELLE DIMENSIONI ---------------- */
{ num:'02', title:'Il conto delle dimensioni: le codimensioni si sommano', meta:'la formula · i quattro casi da avere in mano · e quando lintersezione e vuota',
  blocchi:[
  {t:'prosa', title:'La formula, e perche va ricordata in codimensione', tag:'regola operativa', html:R`
  <p>Per due sottovarietà trasverse l'intersezione è una sottovarietà, e la sua dimensione è
  $$\dim(A\cap B)=\dim A+\dim B-\dim M,$$
  cioè <b>$a+b-n$</b>. <b>La forma da ricordare è però l'altra</b>: le <i>codimensioni</i> si sommano,
  $$\operatorname{codim}(A\cap B)=\operatorname{codim}A+\operatorname{codim}B.$$
  Ed è più memorabile perché dice la cosa giusta: <b>ogni sottovarietà impone un certo numero di condizioni, e trasversalità significa che le condizioni sono indipendenti.</b> Due vincoli indipendenti tolgono due dimensioni; se fossero dipendenti ne toglierebbero una sola.</p>
  <p><b>I quattro casi da avere in mano</b>, e si verificano a mente:</p>
  <ul>
   <li><b>due curve nel piano si incontrano in punti isolati</b>: $1+1-2=0$, dimensione zero;</li>
   <li><b>due superfici nello spazio si incontrano lungo una curva</b>: $2+2-3=1$;</li>
   <li>una curva e una superficie in $\mathbb{R}^3$: $1+2-3=0$, punti isolati;</li>
   <li><b>due rette nello spazio generiche non si incontrano</b>: $1+1-3=-1$, dimensione negativa — che significa <b>intersezione vuota</b>. Ed è vero: due rette prese a caso in $\mathbb{R}^3$ sono sghembe, e quelle che si incontrano sono il caso eccezionale.</li>
  </ul>
  <p><b>La dimensione negativa non è un errore</b>: è l'informazione che l'intersezione generica è vuota, e che quindi <i>ogni</i> incontro fra due rette nello spazio è non trasverso, cioè instabile. Muovendo una delle due di pochissimo, il punto comune sparisce.</p>`},
  {t:'plot', title:'Stabile e instabile: due intersezioni nel piano',
   intro:R`A sinistra due curve che si incontrano trasversalmente; a destra due curve tangenti. Sotto ciascuna, le stesse curve dopo una perturbazione minima di una di esse.`,
   plots:[
    {kind:'func2d', xr:[-2,2], yr:[-1.5,2.5], height:310,
     title:'trasverso: lintersezione resiste alla perturbazione',
     xlabel:'x', ylabel:'y',
     curves:[
      {f:'x*x', col:'#5eead4', width:2.4, label:'parabola'},
      {f:'x+0.5', col:'#d8a13a', width:2.2, label:'retta'},
      {f:'x+0.65', col:'#d8a13a', width:1.4, dash:true, label:'retta spostata: ancora due punti'}
     ],
     marks:[{x:1.366, y:1.866, label:'due punti, e restano due', col:'#b98cff', left:true}]},
    {kind:'func2d', xr:[-2,2], yr:[-1.5,2.5], height:310,
     title:'tangente: basta un capello e i punti diventano due o zero',
     xlabel:'x', ylabel:'y',
     curves:[
      {f:'x*x', col:'#5eead4', width:2.4, label:'parabola'},
      {f:'0', col:'#ff6b6b', width:2.2, label:'retta tangente: un punto solo'},
      {f:'0.25', col:'#ff9b6b', width:1.4, dash:true, label:'alzata: due punti'},
      {f:'-0.25', col:'#4c8dff', width:1.4, dash:true, label:'abbassata: nessun punto'}
     ],
     marks:[{x:0, y:0, label:'contatto fragile', col:'#ff6b6b'}]}
   ],
   leggi:R`<b>A sinistra</b> la retta taglia la parabola in due punti, e spostandola resta a tagliarla in due punti: cambia dove, non quanti. I tangenti alla parabola e alla retta nei punti di incontro sono diversi, e la loro somma è tutto il piano — <b>è la definizione, vista</b>.<br><br>
   <b>A destra</b> la retta tangente tocca in un punto solo, e lì i due tangenti <b>coincidono</b>: la somma è una retta, non il piano. Alzandola di un quarto si ottengono due punti, abbassandola nessuno. <b>Il numero di intersezioni non è stabile</b>, e questo è il senso preciso di «caso eccezionale».<br><br>
   <b>Da portare via</b>: la trasversalità si riconosce guardando se i tangenti sono indipendenti, e la sua conseguenza osservabile è che <i>piccole perturbazioni non cambiano la struttura dell'intersezione</i>. È il motivo per cui in fisica ciò che si osserva è quasi sempre trasverso: le configurazioni fragili non sopravvivono al rumore.`}
]},

/* ---------------- 03 · LA GENERICITÀ ---------------- */
{ num:'03', title:'Il teorema di genericita: la trasversalita si ottiene sempre', meta:'lenunciato · dove entra Sard · e la stabilita nel caso compatto',
  blocchi:[
  {t:'prosa', title:'Lenunciato, e da dove viene', tag:'idea', html:R`
  <p><b>Teorema di trasversalità (Thom).</b> Data $F:M\to N$ liscia e $S\subseteq N$ sottovarietà, esiste una mappa $\tilde F$ arbitrariamente vicina a $F$ (e omotopa a essa) che è <b>trasversa</b> a $S$. Anzi: in una famiglia di perturbazioni, <b>quasi tutte</b> — nel senso della misura — sono trasverse.</p>
  <p><b>La dimostrazione è Sard</b>, applicato con un'idea semplice e brillante. Si immerge $F$ in una famiglia $F_s$ parametrizzata da $s$ che percorre una palla, scelta in modo che la mappa complessiva $(p,s)\mapsto F_s(p)$ sia <b>già</b> trasversa a $S$ — cosa facile, perché si può traslare liberamente. Poi si guarda la proiezione sull'insieme dei parametri, e si applica il teorema di Sard: <b>i valori critici di quella proiezione hanno misura nulla</b>, e proprio per i parametri regolari la mappa $F_s$ risulta trasversa.</p>
  <p><b>Questo è il motivo per cui Sard sta nel corso.</b> Non è un teorema di curiosità sulla misura: è l'ingrediente che trasforma «si può sempre perturbare per mettersi in posizione generale» da speranza a teorema — e quella frase, negli argomenti di topologia differenziale, si usa a ogni pagina.</p>`},
  {t:'prosa', title:'La stabilita, e il numero che non cambia', tag:'sintesi', html:R`
  <p>Il secondo pilastro: <b>se $M$ è compatta e $F$ è trasversa a $S$ chiusa, allora ogni mappa abbastanza vicina a $F$ è ancora trasversa</b>, e le controimmagini $F^{-1}(S)$ sono diffeomorfe fra loro. <b>La trasversalità è una proprietà aperta</b>, oltre che densa.</p>
  <p>Insieme, densità e stabilità danno il metodo che regge tutta la topologia differenziale: se una quantità si può calcolare per mappe trasverse, e non cambia per perturbazioni, allora <b>è un invariante</b>. Il caso più semplice è il <b>numero di intersezione</b>: quando il conto delle dimensioni dà zero, $F^{-1}(S)$ è un insieme finito di punti, e il loro numero (con segno) <b>non cambia</b> deformando.</p>
  <div class="note"><b>La catena di teoremi del corso arriva qui.</b> Il valore regolare dà le sottovarietà; Sard dice che i valori regolari sono quasi tutti; la trasversalità generalizza il valore regolare a bersagli qualunque; la genericità garantisce che si possa sempre ottenere; la stabilità trasforma i conteggi in invarianti. <b>Nessuno dei cinque passi è difficile da solo, e insieme producono numeri interi che non dipendono da nessuna scelta.</b> È una delle costruzioni più economiche della matematica del Novecento.</div>`}
]},

/* ---------------- 04 · IL RITORNO DELLE CARATTERISTICHE ---------------- */
{ num:'04', title:'Il cerchio che si chiude: la non caratteristicita era trasversalita', meta:'la rilettura · il grafico dentro un prodotto · il caso quasi-lineare · e la fine del corso',
  blocchi:[
  {t:'prosa', title:'La rilettura, e cosa aggiunge', tag:'costruzione', html:R`
  <p>Nel movimento precedente il problema di Cauchy chiedeva che il campo $X$ <b>non fosse tangente</b> all'ipersuperficie $S$ su cui si assegna il dato. Riletta ora, quella condizione è
  $$T_pS+\mathbb{R}\,X(p)=T_pM,$$
  cioè <b>esattamente la trasversalità</b> fra $S$ e le curve integrali di $X$. <b>La condizione di non caratteristicità non era una richiesta tecnica delle PDE: era una richiesta geometrica di posizione generale.</b></p>
  <p><b>E il teorema di genericità dà l'informazione in più</b>: una superficie presa a caso è trasversa al campo, quindi <b>quasi ogni</b> superficie va bene come supporto del dato. Le superfici caratteristiche — quelle cattive — sono l'eccezione, non la regola, e se il proprio problema ne ha una si può perturbarla.</p>`},
  {t:'prosa', title:'Il grafico dentro un prodotto, e il caso quasi-lineare', tag:'idea', html:R`
  <p>Diverio chiude il corso con l'osservazione che lega i due argomenti: <b>quando una sottovarietà di un prodotto è il grafico di una funzione?</b> Se $\Gamma\subseteq M\times N$ ha la dimensione di $M$ ed è <b>trasversa</b> alle fibre $\{p\}\times N$, allora localmente è un grafico — perché la proiezione su $M$ ha differenziale invertibile, e si applica il teorema della funzione inversa.</p>
  <p><b>È esattamente ciò che serve al caso quasi-lineare.</b> Lì la soluzione si costruisce come sottovarietà dello spazio esteso $(x,f)$, integrando un campo; e la domanda «quella sottovarietà è il grafico di una funzione $f(x)$?» è la domanda se la soluzione esiste come funzione. <b>La risposta è: finché la trasversalità con le fibre regge.</b></p>
  <p><b>E lo shock di Burgers, visto da qui, non è una catastrofe ma una perdita di trasversalità</b>: al tempo critico la sottovarietà soluzione «si ripiega» e la sua tangente diventa verticale rispetto alla proiezione. Sopra un punto ci sono più valori, il grafico non esiste più. <b>La geometria non impedisce lo shock — lo spiega</b>, e dice che è il momento in cui una condizione di posizione generale cade.</p>
  <div class="note"><b>Perché è il modo giusto di chiudere il corso.</b> L'ultima lezione non introduce uno strumento nuovo: prende la condizione più tecnica incontrata — «il campo non sia tangente» — e mostra che era un caso particolare della nozione più generale di tutte. <b>Il corso finisce facendo vedere che i suoi pezzi erano lo stesso pezzo</b>, ed è il tipo di chiusura che rende un corso una teoria invece che un elenco.</div>`}
]},

/* ---------------- 05 · IL SENSO ---------------- */
{ num:'05', title:'Il senso, e le rotte — e la fine del corso', meta:'cosa lascia in mano, e dove la trasversalita e lo strumento',
  blocchi:[
  {t:'prosa', title:'Cosa lascia in mano', tag:'sintesi', html:R`
  <p><b>Il punto.</b> «Posizione generale» diventa una nozione precisa, verificabile con una condizione sui tangenti, e <b>quasi sempre soddisfatta</b>. Da questo discendono i numeri interi della topologia differenziale — numeri di intersezione, gradi, indici — che sono invarianti perché contano configurazioni trasverse, e le configurazioni trasverse non cambiano sotto deformazione.</p>
  <p><b>E il corso finisce qui.</b> Tutto quello che è stato costruito — varietà, mappe, tangenti, campi, flussi, valori regolari, Sard — converge su questa idea. Ciò che non c'è, e che il corso non tocca: metriche, connessioni, curvatura, geodetiche. <b>Non è una mancanza: è una scelta</b>, e la direzione presa è quella della topologia differenziale invece che della geometria riemanniana.</p>`},
  {t:'prolessi', title:'Dove riappare questo movimento, nella fisica che farai',
   oggetto:R`<b>La trasversalità</b>: incontrarsi in posizione generale, e i numeri interi che ne derivano.`,
   rotte:[
    {dove:'Sistemi<br>dinamici', txt:R`Le <b>sezioni di Poincaré</b> sono superfici trasverse al flusso: la trasversalità è ciò che garantisce che la mappa di ritorno sia ben definita e liscia. E la <b>stabilità strutturale</b> di un sistema è la trasversalità delle intersezioni fra varietà stabili e instabili — quando falliscono, nascono le biforcazioni.`},
    {dove:'Teoria<br>dei campi', txt:R`Gli <b>istantoni</b> e i difetti topologici si contano come intersezioni trasverse, e i numeri che ne escono sono invarianti. La <b>teoria delle catastrofi</b> di Thom classifica proprio i modi in cui la trasversalità può fallire in una famiglia di funzioni.`},
    {dove:'Materia<br>condensata', txt:R`I <b>punti di Dirac</b> e i coni di Weyl sono intersezioni trasverse di bande nello spazio dei momenti: la loro esistenza è stabile — non si aprono per piccole perturbazioni — proprio perché l'intersezione è trasversa. <b>È la ragione per cui il grafene ha un gap nullo robusto.</b>`},
    {dove:'Meccanica<br>quantistica', txt:R`Il <b>teorema di non incrocio</b> di von Neumann e Wigner e' un conto di codimensioni: due livelli energetici che dipendono da un parametro non si incrociano, perche' l'incrocio richiederebbe tre condizioni e ne e' disponibile una sola. <b>I livelli si respingono per un motivo dimensionale.</b>`}
   ],
   domanda:R`La trasversalità dice che ciò che accade «di solito» è anche ciò che è stabile — e quindi che le configurazioni eccezionali non si osservano. <b>Domanda che porti avanti, e che chiude il corso:</b> perché allora la fisica è piena di situazioni non generiche? Le simmetrie <i>impongono</i> degenerazioni che la posizione generale escluderebbe: i livelli si incrociano quando una simmetria lo consente, le orbite si chiudono quando c'è una quantità conservata in più, il potenziale ha un punto critico degenere proprio dove avviene una transizione di fase. <b>La risposta è che la simmetria è precisamente il modo in cui la natura vive fuori dal caso generico</b>, e riconoscere una configurazione non trasversa è spesso il primo indizio che c'è una simmetria nascosta da trovare.`}
]}

];

var byId = {}; TAPPE.forEach(function(s){ byId[s.num]=s; });

var VKEY='pm-nucleogd-17-visited';
function loadSeen(){ try{ return new Set(JSON.parse(localStorage.getItem(VKEY)||'[]')); }catch(e){ return new Set(); } }
function saveSeen(s){ try{ localStorage.setItem(VKEY, JSON.stringify(Array.from(s))); }catch(e){} }
var SEEN = loadSeen();

function renderNav(active){
  var nav=document.getElementById('sidebar');
  nav.innerHTML='';
  var h=document.createElement('h2'); h.textContent='Nucleo gd-17 · le tappe'; nav.appendChild(h);
  TAPPE.forEach(function(s){
    var b=document.createElement('button');
    b.className='navitem'+(active===s.num?' active':'')+(SEEN.has(s.num)?' seen':'');
    b.innerHTML='<span class="dot"></span><span class="nx">'+s.num+'</span><span>'+s.title+'</span>';
    b.onclick=function(){ showTappa(s.num); };
    nav.appendChild(b);
  });
}

/* ---- renderer dei blocchi ---- */
function sectionProsa(title, tag, html){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var body=elFromHTML('<div class="open-body">'+html+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function sectionGram(title, rows){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag gramtag">grammatica</span></h3>';
  var inner='<table class="gramtab">';
  rows.forEach(function(r){ inner+='<tr><td class="gs">'+r[0]+'</td><td>'+r[1]+'</td></tr>'; });
  inner+='</table>';
  var body=elFromHTML('<div class="gramwrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
/* --- blocco PLOT: la figura non decora, si legge. Ogni plot porta una chiave di lettura. --- */
function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';
  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
    else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
    else if(b.t==='prolessi') m.appendChild(sectionProlessi(b));
    else if(b.t==='reveal')m.appendChild(sectionReveal(b.title,b.tag,b.steps));
    else if(b.t==='esercizio') m.appendChild(sectionEsercizio(b));
    else if(b.t==='collaudo')  m.appendChild(sectionCollaudo(b.title,b.items));
    else if(b.t==='plot')      m.appendChild(sectionPlot(b));
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}

  var h=(location.hash||'').replace('#','');
  showTappa(byId[h]?h:'00');
});
window.addEventListener('hashchange', function(){
  var h=(location.hash||'').replace('#','');
  if(byId[h]) showTappa(h);
});
</script>
