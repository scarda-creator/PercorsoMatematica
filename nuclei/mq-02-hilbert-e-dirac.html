   leggi:R`<p><b>Che cosa guardare.</b> Nel mezzo dell&rsquo;intervallo le curve si schiacciano rapidamente sul bersaglio: con $N=25$ la differenza è invisibile. <b>Agli estremi no</b>: ogni somma parziale vale esattamente zero in $x=0$ e in $x=\pi$, perché ogni seno vi si annulla, mentre $f$ vale $1$. Aumentando $N$ la zona di discrepanza si restringe ma non scompare, e appena prima di scomparire la curva <i>sovraelonga</i> — il sorpasso visibile sopra la linea verde, che non si attenua con $N$. <b>Che cosa impararne.</b> Che «base completa» significa convergenza <b>nella norma</b>, $\|f-S_N\|\to0$, e non convergenza punto per punto: l&rsquo;area della discrepanza tende a zero mentre il suo valore in un punto fisso può restare grande. Il sorpasso ha un nome, fenomeno di Gibbs, e vale circa il nove per cento del salto per ogni $N$. La conseguenza da portarsi via è che in questo corso due stati che differiscono su un insieme di misura nulla sono <b>lo stesso stato</b>, perché la loro distanza è zero: l&rsquo;uguaglianza fra stati non è l&rsquo;uguaglianza fra funzioni, è l&rsquo;uguaglianza nella norma. Parseval, verificata sopra, non dice che le curve coincidono: dice che la loro distanza quadratica tende a zero, ed è tutto ciò che la fisica richiede.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`La figura mostra che $S_N(0)=0$ per ogni $N$, mentre $f(0)=1$. Come può una base «completa» non riprodurre il valore della funzione in un punto?`,
    a:R`Perché la completezza è un&rsquo;asserzione sulla <b>norma</b>, non sui valori. La quantità $\|f-S_N\|^2=\int_0^\pi|f-S_N|^2dx$ tende a zero perché la zona in cui le due curve differiscono ha ampiezza che si restringe come $1/N$, e l&rsquo;integrale di una discrepanza limitata su un intervallo che si contrae va a zero — anche se l&rsquo;altezza della discrepanza in $x=0$ resta $1$. Il criterio di von Neumann non è violato: non esiste nessuna $g$ con $\|g\|=1$ ortogonale a tutti i seni, e in particolare non esiste «la funzione che vale $1$ nel solo punto $x=0$», perché quella ha norma zero e quindi, per l&rsquo;assioma che annulla i vettori di norma nulla, <b>è</b> il vettore nullo. In questo spazio un punto non esiste come oggetto: ciò che esiste è una classe di funzioni uguali quasi ovunque, e in quella classe il valore in $x=0$ non è definito. L&rsquo;errore da evitare all&rsquo;esame è chiedere «quanto vale $\psi$ in questo punto» quando ciò che si può chiedere è «qual è la probabilità in questo intervallo».`},
   {q:R`Perché la condizione $\sum_i|a_i|^2<\infty$ è una restrizione vera e non una formalità? Si costruisca una lista di coefficienti che <i>non</i> definisce uno stato.`,
    a:R`Basta prendere $a_i=1$ per ogni $i$: la serie $\sum_i 1$ diverge, dunque $\sum_i|\xi_i\rangle$ non è un vettore di $\mathcal H$ e non rappresenta nessuno stato. Più finemente, $a_i=1/\sqrt i$ dà $\sum 1/i$, la serie armonica, che diverge: i coefficienti tendono a zero e ciò non basta. Con $a_i=1/i$, invece, $\sum 1/i^2$ converge e lo stato esiste. La restrizione è vera e separa casi vicinissimi, perché la soglia cade fra l&rsquo;esponente $1/2$ e l&rsquo;esponente $1$ nel decadimento dei coefficienti. In fisica questa condizione è <b>la normalizzabilità</b>: una «sovrapposizione uniforme di tutti gli stati» non esiste come stato, perché non si può normalizzare, e per questo l&rsquo;onda piana $e^{ikx}$ — che è la sovrapposizione uniforme in un&rsquo;altra base — non è uno stato di una particella libera ma un oggetto limite, su cui si costruiscono stati veri per sovrapposizione. È il filo che la tappa 08 raccoglie.`}
  ]}
]},

/* ---------------- 05 · UN SOLO SPAZIO PER LE MATRICI E PER LE ONDE ---------------- */
{ num:'05', title:'Un solo spazio per le matrici e per le onde', meta:'il programma dichiarato di von Neumann · successioni e funzioni come lo stesso oggetto · perché due teorie diverse davano gli stessi numeri',
  blocchi:[
  {t:'prosa', title:'La domanda storica, e perché non è un aneddoto', tag:'costruzione', html:R`
  <p>Nel 1925-26 esistevano <b>due</b> meccaniche quantistiche, e sembravano non avere niente in comune. La <i>meccanica delle matrici</i> di Heisenberg, Born e Jordan lavorava con tabelle infinite di numeri indicizzate da coppie di interi, non aveva funzioni d&rsquo;onda, e trattava le osservabili come oggetti non commutativi. La <i>meccanica ondulatoria</i> di Schrödinger lavorava con funzioni continue dello spazio, risolveva un&rsquo;equazione differenziale, e sembrava la cosa più vicina a un&rsquo;onda classica che si potesse scrivere. Davano gli stessi numeri — gli stessi livelli dell&rsquo;idrogeno, le stesse righe spettrali — e nessuno sapeva dire perché.</p>
  <p>Questa domanda è la ragione d&rsquo;essere del libro di von Neumann, e lui la mette nella prima pagina del capitolo II come un <b>programma dichiarato</b>. Vale citarlo con precisione, perché è uno dei pochi punti in cui un libro di matematica spiega la propria motivazione fisica:</p>
  <p style="padding-left:1.2em;border-left:3px solid rgba(120,160,255,.45)"><i>«Dobbiamo ora portare a termine il programma delineato alla fine di I.4: definire lo spazio di Hilbert, che fornisce la base matematica per il trattamento della meccanica quantistica in termini di quei concetti che sono poi necessari in meccanica quantistica, e che hanno di conseguenza <b>lo stesso significato</b> nello spazio di funzioni “discreto” $F_Z$ delle successioni $x_\nu$ ($\nu=1,2,\dots$) e in quello “continuo” $F_\Omega$ delle funzioni d&rsquo;onda $\phi(q_1,\dots,q_k)$.»</i> — von Neumann, pag. stampata 25</p>
  <p>Due nomi, e sono i due mondi: $F_Z$ è il mondo di Heisenberg — successioni di numeri, cioè vettori con infinite componenti discrete — e $F_\Omega$ è il mondo di Schrödinger — funzioni su uno spazio continuo. L&rsquo;asserzione di von Neumann è che i concetti che servono alla fisica <i>hanno lo stesso significato nei due</i>, e dunque che si può definire <b>un solo</b> spazio astratto di cui entrambi sono realizzazioni. Lo <span class="str" data-str="spazio-di-hilbert">spazio di Hilbert</span> è quel solo spazio.</p>`},
  {t:'reveal', title:'I tre concetti, nei due mondi', tag:'costruzione', steps:[
   {label:'La tavola di traduzione', body:R`
   <p>von Neumann elenca i tre concetti necessari e, per ciascuno, dà la sua forma nei due mondi. La tavola è letteralmente la sua, con i nomi $\alpha$, $\beta$, $\gamma$ che usa lui, e vale la pena rifarla perché è la cosa più vicina a un dizionario fra le due meccaniche:</p>
   <p><b>$\alpha$) Moltiplicazione per un numero complesso, $af$.</b> In $F_Z$: da $x_\nu$ si ottiene $ax_\nu$, si moltiplica ogni componente. In $F_\Omega$: da $\phi(q)$ si ottiene $a\phi(q)$, si moltiplica la funzione.</p>
   <p><b>$\beta$) Somma e differenza, $f\pm g$.</b> In $F_Z$: $x_\nu\pm y_\nu$, componente per componente. In $F_\Omega$: $\phi(q)\pm\psi(q)$, punto per punto.</p>
   <p><b>$\gamma$) Prodotto interno $(f,g)$</b> — e von Neumann sottolinea che «a differenza di $\alpha$ e $\beta$, questa operazione produce un numero complesso, e non un elemento dello spazio di Hilbert». In $F_Z$:</p>
   $$(f,g)=\sum_\nu \bar x_\nu\, y_\nu$$
   <p>In $F_\Omega$:</p>
   $$(f,g)=\int_\Omega \overline{\phi(q_1,\dots,q_k)}\;\psi(q_1,\dots,q_k)\,dq_1\cdots dq_k$$
   <p>Guardate le due righe del prodotto interno una sopra l&rsquo;altra: <b>sono la stessa formula</b>. Una somma su un indice discreto e un integrale su una variabile continua sono due modi di scrivere «accumula il prodotto del coniugato del primo per il secondo su tutti i gradi di libertà». Ballentine dà le stesse due righe come i suoi «esempi corrispondenti» di prodotto interno, con la generalizzazione di una funzione peso $w(x)$ non negativa nel caso continuo. L&rsquo;identificazione fra la somma e l&rsquo;integrale è ciò che la notazione di Dirac rende invisibile scrivendo $\langle\phi|\psi\rangle$ in entrambi i casi, e che è il contenuto matematico di questo movimento.</p>`},
   {label:'Che l’isomorfismo sia esatto, e chi lo garantisce', body:R`
   <p>Che due spazi abbiano operazioni «con lo stesso significato» non basta a renderli lo stesso spazio. Serve una corrispondenza biunivoca che conservi il prodotto interno, e la macchina che la fornisce è <b>esattamente la base ortonormale completa</b> della tappa 04. Il ragionamento, in tre passi:</p>
   <p>Primo: in uno spazio di Hilbert separabile esiste una base ortonormale numerabile completa $\{\phi_n\}$ — è il teorema 3($\infty$) di von Neumann più il postulato di separabilità. Secondo: ogni vettore si scrive $|\psi\rangle=\sum_n c_n|\phi_n\rangle$ con $c_n=\langle\phi_n|\psi\rangle$, dunque è <i>determinato</i> dalla successione dei suoi coefficienti. Terzo: Parseval dice $\langle\psi|\psi\rangle=\sum_n|c_n|^2$, dunque la corrispondenza fra lo stato e la lista dei suoi coefficienti <b>conserva la norma</b>, e per polarizzazione conserva il prodotto interno intero.</p>
   <p>Risultato: lo spazio delle funzioni d&rsquo;onda a quadrato sommabile e lo spazio delle successioni a quadrato sommabile sono <b>lo stesso spazio</b>, in due vestiti. Nei nomi moderni, $L^2$ e $\ell^2$ sono isomorfi. Nei nomi di von Neumann, $F_\Omega$ e $F_Z$. Nei nomi della fisica del 1926: <b>la meccanica delle matrici e la meccanica ondulatoria sono la stessa teoria</b>, e l&rsquo;isomorfismo è lo sviluppo in una base. Le «tabelle infinite di numeri» di Heisenberg sono i coefficienti di Fourier astratti delle funzioni d&rsquo;onda di Schrödinger rispetto a una base di autostati, e la matrice di un&rsquo;osservabile è $M_{ij}=\langle\phi_i|\hat M|\phi_j\rangle$ — la formula della tappa 07.</p>
   <p>Un&rsquo;osservazione sul perché la separabilità sia il perno. Senza di essa la base non sarebbe numerabile, e non si potrebbe scrivere lo stato come una <i>lista</i> di coefficienti: questi sarebbero indicizzati da un insieme più grande, e la «matrice» di un operatore non avrebbe righe e colonne. Picasso la postula in una riga e aggiunge che per un sistema di particelle «verrà dedotta dal postulato di quantizzazione»: non è un&rsquo;ipotesi gratuita, è una conseguenza della struttura del sistema fisico. Ed è il motivo per cui le matrici di Heisenberg sono matrici e non qualcosa di peggio.</p>`},
   {label:'Un esempio numerico dell’isomorfismo, e dove la traduzione non è innocua', body:R`
   <p>Il caso di tappa 04 è già un esempio completo. La funzione $f(x)=1$ su $[0,\pi]$ vive in $F_\Omega$ e ha norma quadra $\pi$, calcolata con un integrale elementare. La sua immagine in $F_Z$ è la successione $c_n$, nulla sui pari e $2\sqrt{2/\pi}/n$ sui dispari, che ha norma quadra $\pi$, calcolata sommando una serie di Eulero. Lo stesso numero, ottenuto in due modi che non si somigliano. Quella coincidenza <i>è</i> l&rsquo;isomorfismo.</p>
   <p>Conviene però tenere a mente dove la traduzione <b>non</b> è innocua, perché è la fonte di un equivoco frequente. Il vestito delle successioni nasconde la variabile $x$: nella lista dei coefficienti non c&rsquo;è nessun «dove». Il vestito delle funzioni nasconde la struttura di base: nella funzione $\psi(x)$ non c&rsquo;è nessun «rispetto a quale osservabile». Sono due rappresentazioni, e <b>la fisica non sta in nessuna delle due</b>: sta nelle quantità invarianti — norme, prodotti interni, autovalori, tracce — che le tappe 06 e 07 impareranno a calcolare senza sceglierne una. Scrivere $\psi(x)$ è già una scelta di base, quella degli autostati della posizione, e il fatto che quella base sia <i>fuori</i> dallo spazio di Hilbert è precisamente il problema della tappa 08.</p>
   <p>Un controllo sui numeri, per fissare la soglia di esistenza in questo vestito: la successione $c_n=1/n$ definisce un elemento dello spazio delle successioni a quadrato sommabile perché</p>
   $$\sum_{n=1}^{\infty}\frac{1}{n^{2}}=\frac{\pi^{2}}{6}$$
   <p>è finita. La successione $c_n=1/\sqrt n$ no, perché darebbe la serie armonica. Nel vestito delle funzioni la stessa soglia si legge come «$\psi$ deve decadere abbastanza in fretta all&rsquo;infinito», e il fatto che si tratti della <i>stessa</i> soglia, scritta due volte, è l&rsquo;isomorfismo al lavoro.</p>`}
  ]},
  {t:'plot', title:'La soglia della sommabilità: due successioni che tendono entrambe a zero',
   intro:R`I moduli quadri di due successioni di coefficienti, disegnati come inviluppi continui: $|c_n|^2=1/n^2$ (sommabile, con somma $\pi^2/6$) e $|c_n|^2=1/n$ (non sommabile, serie armonica). Entrambe le curve scendono a zero; solo una delimita un&rsquo;area finita.`,
   plots:[
    {kind:'func2d', xr:[1,12], yr:[0,1.05], height:320, ticks:6,
     title:'peso del termine n-esimo: 1/n² contro 1/n',
     curves:[
      {f:'1/(x*x)', col:'#4c8dff', width:2.6, label:'1/n² : sommabile, è uno stato'},
      {f:'1/x', col:'#ff8a5c', width:2.6, label:'1/n : non sommabile, non è uno stato'}
     ],
     xlabel:'indice n', ylabel:'peso del termine'}
   ],
   leggi:R`<p><b>Che cosa guardare.</b> Non il fatto che entrambe tendano a zero — lo fanno tutte e due, e questa è la trappola — ma <i>quanto in fretta</i>. Sotto la curva arancione l&rsquo;area è infinita benché la curva vada a zero, perché la serie armonica diverge; sotto la blu è finita e vale circa $1{,}645$. <b>Che cosa impararne.</b> Che la condizione di normalizzabilità non è «i coefficienti diventano piccoli» ma «diventano piccoli abbastanza in fretta», e che la soglia sta fra i due decadimenti $c_n\sim n^{-1/2}$ e $c_n\sim n^{-1}$. In fisica: una sovrapposizione con infiniti termini è uno stato legittimo soltanto se il peso dei termini alti decade come una potenza maggiore di uno. Questo criterio tornerà in forma più stringente nella tappa 08, quando si chiederà non solo che la somma dei pesi converga, ma che converga anche dopo averla moltiplicata per $n^m$ per <i>ogni</i> $m$ — ed è lì che si separano gli stati buoni da quelli appena buoni.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Se lo spazio delle funzioni e quello delle successioni sono lo stesso spazio, perché i libri non scelgono uno dei due e basta?`,
    a:R`Perché l&rsquo;isomorfismo conserva la struttura di spazio di Hilbert e <b>non</b> conserva la comodità: alcune domande sono facili in un vestito e proibitive nell&rsquo;altro, e il vestito giusto è quello in cui l&rsquo;operatore che interessa è <i>diagonale</i>. L&rsquo;energia di un oscillatore armonico, nella base dei suoi autostati, è una matrice diagonale: in quel vestito il problema è risolto scrivendolo. La probabilità di trovare la particella fra $x$ e $x+dx$, invece, nel vestito delle successioni richiede di risommare l&rsquo;intera serie, mentre in quello delle funzioni è $|\psi(x)|^2dx$. Non c&rsquo;è un vestito migliore, c&rsquo;è un vestito adatto alla domanda — e passare dall&rsquo;uno all&rsquo;altro è un <b>cambiamento di base</b>, cioè l&rsquo;operazione della tappa 06. Questo è anche il motivo per cui la notazione di Dirac è utile: $\langle\phi|\psi\rangle$ non impegna a nessun vestito, e si decide quale indossare solo quando serve fare il conto.`},
   {q:R`L&rsquo;isomorfismo è costruito scegliendo una base. Il risultato dipende dalla base scelta?`,
    a:R`L&rsquo;<i>isomorfismo specifico</i> sì, la <b>conclusione</b> no. Scegliendo una base diversa si ottiene una diversa corrispondenza, con coefficienti diversi — ed è proprio il cambiamento di base della tappa 06, dove la relazione fra le due liste è una matrice unitaria. Ma Parseval vale in <i>ogni</i> base ortonormale, quindi ogni scelta dà un isomorfismo che conserva la norma, e l&rsquo;asserzione «tutti gli spazi di Hilbert separabili di dimensione infinita sono isomorfi fra loro» non dipende da nessuna scelta. È la versione infinito-dimensionale del fatto che tutti gli spazi vettoriali complessi di dimensione $n$ sono isomorfi fra loro: la dimensione è l&rsquo;unico invariante, e qui vale infinito numerabile per tutti. La conseguenza, fisicamente notevole, è che <b>lo spazio degli stati di un atomo di idrogeno e quello di un oscillatore armonico sono lo stesso spazio</b>: ciò che distingue i due sistemi non è la casa degli stati, è l&rsquo;operatore hamiltoniano che vi agisce.`}
  ]}
]},

/* ---------------- 06 · LA RELAZIONE DI COMPLETEZZA E IL CAMBIO DI BASE ---------------- */
{ num:'06', title:'La relazione di completezza, e il cambio di base in due righe', meta:'l’identità come somma di proiettori · inserire l’uno · un esempio svolto · due invarianti controllati',
  blocchi:[
  {t:'prosa', title:'La formula che rende meccanico tutto il resto', tag:'costruzione', html:R`
  <p>Questa è la tappa operativa del movimento, e il suo contenuto è una formula sola. In tappa 04 avevamo ottenuto, per ogni stato $|A\rangle$,</p>
  $$|A\rangle=\sum_i |\xi_i\rangle\langle\xi_i|A\rangle$$
  <p>Si legga ora questa identità in un modo diverso da come l&rsquo;abbiamo scritta: vale per <i>ogni</i> $|A\rangle$, dunque l&rsquo;oggetto che sta fra $|A\rangle$ di sinistra e $|A\rangle$ di destra deve essere l&rsquo;operatore che non fa niente. Picasso lo registra esattamente così, e in una riga: «se $|\xi_i\rangle$ è una base ortonormale in $\mathcal H$, l&rsquo;operatore identità $\mathbb 1$ — cioè il proiettore su tutto $\mathcal H$, $\mathbb 1|u\rangle=|u\rangle$ — può essere scritto come</p>
  $$\mathbb 1=\sum_i |\xi_i\rangle\langle\xi_i|$$
  <p>Questa è la <b>relazione di completezza</b>, ed è il singolo strumento più usato nell&rsquo;intero corso. Il motivo per cui è così potente è che l&rsquo;identità si può inserire <i>in qualunque punto di qualunque espressione</i>, senza cambiarne il valore — ed è l&rsquo;unico operatore di cui questo sia vero. Inserirla significa far comparire una base, cioè passare da un&rsquo;espressione astratta a un conto con numeri; e inserirla <i>due volte con basi diverse</i> significa cambiare base.</p>
  <p>Nota la lettura del singolo addendo: $\hat P_i=|\xi_i\rangle\langle\xi_i|$ è il <b>proiettore</b> sulla direzione $|\xi_i\rangle$, perché applicato a un ket restituisce quel ket proiettato — $\hat P_i|A\rangle=|\xi_i\rangle\langle\xi_i|A\rangle=a_i|\xi_i\rangle$. La relazione di completezza dice dunque che la somma dei proiettori su tutte le direzioni di una base è l&rsquo;identità: ogni vettore si ricompone esattamente dalle sue proiezioni, senza residuo. Ed è, di nuovo, la stessa affermazione del criterio di von Neumann: se ci fosse una direzione non coperta, il residuo non sarebbe zero.</p>`},
  {t:'reveal', title:'Il cambio di base: le due righe, e perché sono due', tag:'costruzione', steps:[
   {label:'Le componenti di un vettore', body:R`
   <p>Siano $\{|u_i\rangle\}$ e $\{|v_\alpha\rangle\}$ due basi ortonormali dello stesso spazio. Un ket $|\psi\rangle$ ha componenti $a_i=\langle u_i|\psi\rangle$ nella prima e $b_\alpha=\langle v_\alpha|\psi\rangle$ nella seconda, e il problema è: date le $a_i$, trovare le $b_\alpha$. Ecco le due righe. <b>Prima riga:</b> si parte dalla definizione di ciò che si vuole, e si inserisce l&rsquo;identità scritta nella base che si ha:</p>
   $$b_\alpha=\langle v_\alpha|\psi\rangle=\langle v_\alpha|\,\mathbb 1\,|\psi\rangle=\langle v_\alpha|\Big(\sum_i|u_i\rangle\langle u_i|\Big)|\psi\rangle$$
   <p><b>Seconda riga:</b> si porta la somma fuori e si riconoscono i pezzi:</p>
   $$b_\alpha=\sum_i \langle v_\alpha|u_i\rangle\,\langle u_i|\psi\rangle=\sum_i S_{\alpha i}\,a_i,\qquad S_{\alpha i}\equiv\langle v_\alpha|u_i\rangle$$
   <p>È tutto. La matrice del cambio di base, $S_{\alpha i}=\langle v_\alpha|u_i\rangle$, non si costruisce né si inverte: <b>è il prodotto scalare fra i vettori delle due basi</b>, e si legge dalla definizione delle basi stesse. Il punto da fissare, perché è dove si sbaglia all&rsquo;esame, è che non c&rsquo;è nulla da ricordare oltre «inserisci l&rsquo;identità nella base che hai, e raccogli». Chi invece ricorda a memoria «le componenti si trasformano con $S$ e i vettori di base con $S^{-1}$» confonde i due casi la metà delle volte.</p>`},
   {label:'Che la matrice sia unitaria, dedotto e non ricordato', body:R`
   <p>La matrice $S$ non è qualunque: è <b>unitaria</b>, e il fatto si dimostra con la stessa mossa, inserendo l&rsquo;identità dall&rsquo;altro lato. Partiamo dall&rsquo;ortonormalità della seconda base e inseriamo l&rsquo;identità della prima:</p>
   $$\delta_{\alpha\beta}=\langle v_\alpha|v_\beta\rangle=\sum_i\langle v_\alpha|u_i\rangle\langle u_i|v_\beta\rangle=\sum_i S_{\alpha i}\,\overline{S_{\beta i}}$$
   <p>dove si è usato $\langle u_i|v_\beta\rangle=\overline{\langle v_\beta|u_i\rangle}=\overline{S_{\beta i}}$, cioè la proprietà di Dirac $\langle B|A\rangle=\overline{\langle A|B\rangle}$. In notazione matriciale $S\,S^{\dagger}=\mathbb 1$, che è la definizione di unitario. E l&rsquo;unitarietà ha una conseguenza immediata e fisica: conserva la norma, dunque <b>conserva le probabilità totali</b>. Un cambio di base non può cambiare la somma delle probabilità, e l&rsquo;unitarietà è questo fatto scritto in forma di matrice.</p>
   <p>Le due regole di trasformazione, raccolte, sono dunque queste — e si noti che quella dei vettori di base va <i>nell&rsquo;altro verso</i> rispetto a quella delle componenti, che è l&rsquo;asimmetria da cui nasce ogni confusione:</p>
   $$b_\alpha=\sum_i S_{\alpha i}a_i\qquad\text{(le componenti)},\qquad |v_\alpha\rangle=\sum_i \overline{S_{\alpha i}}\,|u_i\rangle\qquad\text{(i vettori di base)}$$
   <p>La seconda si ottiene inserendo l&rsquo;identità in $|v_\alpha\rangle=\mathbb 1|v_\alpha\rangle=\sum_i|u_i\rangle\langle u_i|v_\alpha\rangle$. Il modo di non sbagliarsi non è memorizzare quale porta la coniugazione: è rifare la mossa, che costa dieci secondi.</p>`},
   {label:'Un esempio svolto, con i numeri', body:R`
   <p>Mettiamo i numeri su un caso a due stati, che è il caso dello spin e della polarizzazione. Base di partenza $|u_1\rangle,|u_2\rangle$; base d&rsquo;arrivo</p>
   $$|v_{\pm}\rangle=\frac{1}{\sqrt2}\big(|u_1\rangle\pm|u_2\rangle\big)$$
   <p>La matrice del cambio si legge subito: $S_{+1}=\langle v_+|u_1\rangle=1/\sqrt2$, e analogamente $S_{+2}=1/\sqrt2$, $S_{-1}=1/\sqrt2$, $S_{-2}=-1/\sqrt2$. Prendiamo lo stato</p>
   $$|\psi\rangle=\tfrac{3}{5}|u_1\rangle+\tfrac{4i}{5}|u_2\rangle$$
   <p>che è normalizzato, perché $|3/5|^2+|4i/5|^2=9/25+16/25=1$: nella base $u$ la misura dà il primo esito con probabilità $9/25$ e il secondo con $16/25$. Le componenti nella base $v$ si ottengono con la formula:</p>
   $$b_{+}=\frac{1}{\sqrt2}\left(\frac35+\frac{4i}{5}\right),\qquad b_{-}=\frac{1}{\sqrt2}\left(\frac35-\frac{4i}{5}\right)$$
   <p>e il controllo che la norma sia conservata è un conto di moduli di numeri complessi:</p>
   $$|b_{+}|^{2}+|b_{-}|^{2}=1$$
   <p>perché $|3/5\pm 4i/5|^2=9/25+16/25=1$ per entrambi i segni, e il fattore $1/2$ di ciascuno li fa sommare a uno. Le probabilità nella base $v$ sono dunque $1/2$ e $1/2$: lo stesso stato che nella base $u$ dava esiti <b>molto</b> diversi fra loro ($36\%$ contro $64\%$) nella base $v$ dà esiti equiprobabili. Non è un paradosso: sono <i>misure di osservabili diverse</i>, e questa è la cosa che la notazione rende immediata e che in notazione di funzioni d&rsquo;onda richiede due pagine.</p>`}
  ]},
  {t:'reveal', title:'Come si trasforma un operatore, e i due invarianti', tag:'costruzione', steps:[
   {label:'Inserire l’identità due volte', body:R`
   <p>Lo stesso meccanismo, applicato agli elementi di matrice di un operatore, dà la legge di trasformazione di un operatore. L&rsquo;unica differenza è che ora l&rsquo;identità si inserisce <b>due volte</b>, una per lato:</p>
   $$M'_{\alpha\beta}=\langle v_\alpha|\hat M|v_\beta\rangle=\sum_{i,j}\langle v_\alpha|u_i\rangle\langle u_i|\hat M|u_j\rangle\langle u_j|v_\beta\rangle=\sum_{i,j}S_{\alpha i}\,M_{ij}\,\overline{S_{\beta j}}$$
   <p>cioè, in notazione matriciale, $M'=S\,M\,S^{\dagger}$. È una <b>trasformazione di similitudine unitaria</b>, e il fatto che sia unitaria e non una similitudine qualunque è ciò che garantisce che le quantità fisiche non cambino. Il lavoro è finito: non ci sono altre regole di trasformazione in questo corso, perché ogni oggetto è o un vettore, o un funzionale, o un operatore.</p>`},
   {label:'Un esempio svolto, e i due controlli che si fanno sempre', body:R`
   <p>Prendiamo nella base $u$ l&rsquo;operatore con elementi di matrice $M_{11}=1$, $M_{12}=M_{21}=2$, $M_{22}=4$, e portiamolo nella base $v$ di prima. Ogni elemento è una somma di quattro termini, tutti con fattore $1/2$:</p>
   $$M'_{++}=\tfrac12(M_{11}+M_{12}+M_{21}+M_{22})=\tfrac12(1+2+2+4)=\tfrac92$$
   $$M'_{--}=\tfrac12(M_{11}-M_{12}-M_{21}+M_{22})=\tfrac12(1-2-2+4)=\tfrac12$$
   $$M'_{+-}=\tfrac12(M_{11}-M_{12}+M_{21}-M_{22})=-\tfrac32,\qquad M'_{-+}=\tfrac12(M_{11}+M_{12}-M_{21}-M_{22})=-\tfrac32$$
   <p>La matrice è cambiata completamente: da $\begin{pmatrix}1&2\\2&4\end{pmatrix}$ a $\begin{pmatrix}9/2&-3/2\\-3/2&1/2\end{pmatrix}$. Ma <b>due numeri non sono cambiati</b>, e sono i due che si controllano sempre perché sono invarianti per similitudine. La traccia:</p>
   $$\tfrac{9}{2}+\tfrac{1}{2}=5=M_{11}+M_{22}=1+4$$
   <p>e il determinante:</p>
   $$\tfrac{9}{2}\cdot\tfrac{1}{2}-\left(-\tfrac{3}{2}\right)^{2}=0=M_{11}M_{22}-M_{12}M_{21}=4-4$$
   <p>Che il determinante sia zero in entrambe le basi dice che l&rsquo;operatore ha un autovalore nullo, e lo dice <i>senza calcolare gli autovettori</i>: l&rsquo;informazione fisica sta negli invarianti, non nelle entrate. <b>Questo è il controllo che va fatto a ogni cambio di base negli scritti d&rsquo;esame</b>: ricalcolare traccia e determinante e verificare che coincidano. Costa dieci secondi e intercetta quasi tutti gli errori di segno nella matrice $S$, che sono il tipo d&rsquo;errore più comune e il più difficile da vedere rileggendo.</p>`}
  ]},
  {t:'plot', title:'La norma non sa in che base la stai guardando',
   intro:R`Lo stato $|\psi\rangle=\tfrac35|u_1\rangle+\tfrac45|u_2\rangle$ visto in una famiglia di basi ruotate di un angolo $\theta$. <b>In blu</b> la probabilità del primo esito, $|b_1(\theta)|^2=(\tfrac35\cos\theta+\tfrac45\sin\theta)^2$; <b>in arancio</b> quella del secondo, $|b_2(\theta)|^2=(-\tfrac35\sin\theta+\tfrac45\cos\theta)^2$; <b>in verde</b> la loro somma.`,
   plots:[
    {kind:'func2d', xr:[0,6.2832], yr:[-0.08,1.18], height:330, ticks:6,
     title:'le due probabilità, e la loro somma, al girare della base',
     curves:[
      {f:'pow(0.6*cos(x)+0.8*sin(x),2)', col:'#4c8dff', width:2.5, label:'|b₁|² : primo esito'},
      {f:'pow(-0.6*sin(x)+0.8*cos(x),2)', col:'#ff8a5c', width:2.5, label:'|b₂|² : secondo esito'},
      {f:'pow(0.6*cos(x)+0.8*sin(x),2)+pow(-0.6*sin(x)+0.8*cos(x),2)', col:'#6bdc9b', width:2.0, label:'somma: sempre 1'}
     ],
     xlabel:'angolo θ fra le due basi', ylabel:'probabilità'}
   ],
   leggi:R`<p><b>Che cosa guardare.</b> Le due curve oscillanti si scambiano i ruoli con continuità: per $\theta=0$ valgono $0{,}36$ e $0{,}64$ (le probabilità nella base di partenza), per $\theta\approx0{,}927$ radianti la blu arriva a $1$ e l&rsquo;arancio a $0$ — quella è la base in cui $|\psi\rangle$ <i>è</i> un autovettore, e la misura dà un esito certo. La curva verde è <b>piatta a uno</b> per ogni $\theta$. <b>Che cosa impararne.</b> Che cambiare base ridistribuisce le probabilità fra gli esiti senza crearne né distruggerne, e che questa è esattamente l&rsquo;unitarietà della matrice $S$ vista come grafico: $\sum_\alpha|b_\alpha|^2=\sum_i|a_i|^2$. Le singole probabilità non hanno senso assoluto — dipendono da <i>quale</i> osservabile si misura — mentre la loro somma ce l&rsquo;ha, e vale uno. Per ogni stato esiste una base in cui l&rsquo;esito è certo: l&rsquo;indeterminazione non è una proprietà dello stato, è una proprietà della coppia stato-osservabile.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Nello stesso stato, nella base $u$ le probabilità erano $9/25$ e $16/25$; nella base $v$ sono $1/2$ e $1/2$. Quale delle due è «la vera» distribuzione di probabilità dello stato?`,
    a:R`Nessuna, e la domanda contiene l&rsquo;errore concettuale che questa tappa serve a estirpare. Una distribuzione di probabilità in meccanica quantistica non è una proprietà dello <i>stato</i> ma della coppia <b>stato più osservabile misurata</b>. Le due basi sono gli autostati di due osservabili diverse — nel caso dello spin, per esempio, la componente lungo $z$ e quella lungo $x$ — e le due distribuzioni sono le predizioni per due esperimenti diversi, entrambe corrette. Ciò che lo stato possiede in modo assoluto, indipendentemente dalla base, è l&rsquo;insieme dei suoi prodotti scalari con gli altri stati, cioè le ampiezze: da quelle si ricava la distribuzione per <i>qualunque</i> osservabile, e il fatto che la somma faccia uno in ogni base è l&rsquo;unitarietà di $S$. La morale operativa: prima di scrivere una probabilità, dire rispetto a quale misura — altrimenti il numero non significa niente.`},
   {q:R`Si voglia dimostrare che la traccia di un operatore non dipende dalla base. Si faccia con la relazione di completezza, senza usare proprietà delle matrici.`,
    a:R`Si parte dalla definizione nella seconda base e si inserisce l&rsquo;identità della prima <i>due volte</i>, una per ciascun lato dell&rsquo;operatore. Scrivendo $\operatorname{Tr}\hat M=\sum_\alpha\langle v_\alpha|\hat M|v_\alpha\rangle$ e inserendo, si ottiene $\sum_\alpha\sum_{i,j}\langle v_\alpha|u_i\rangle\langle u_i|\hat M|u_j\rangle\langle u_j|v_\alpha\rangle$. Ora si sposta la somma su $\alpha$ accanto ai due fattori che la contengono e la si esegue <b>per prima</b>: $\sum_\alpha\langle u_j|v_\alpha\rangle\langle v_\alpha|u_i\rangle=\langle u_j|\mathbb 1|u_i\rangle=\delta_{ji}$ — è la relazione di completezza nella base $v$, usata al rovescio. Resta $\sum_{i,j}\delta_{ji}\langle u_i|\hat M|u_j\rangle=\sum_i\langle u_i|\hat M|u_i\rangle$, che è la traccia nella prima base. <b>Il trucco riusabile</b>, e vale per metà delle dimostrazioni di questo corso, è che la relazione di completezza serve nei due versi: si inserisce per far comparire una base, e si <i>riconosce</i> per farla scomparire. Qui si è fatta comparire la base $u$ e si è fatta scomparire la base $v$ nella stessa riga.`}
  ]}
]},

/* ---------------- 07 · MATRICI, AGGIUNTO, PRODOTTO ESTERNO ---------------- */
{ num:'07', title:'La rappresentazione matriciale, l’aggiunto, il prodotto esterno', meta:'ogni equazione diventa una matrice · l’aggiunto da Riesz · hermitiano non è autoaggiunto · il proiettore come operatore',
  blocchi:[
  {t:'prosa', title:'Da un’equazione fra vettori a un’equazione fra numeri', tag:'costruzione', html:R`
  <p>Un operatore, dice Ballentine, «mappa vettori su vettori», ed «è completamente definito specificando la sua azione su ogni vettore dello spazio (o sul suo dominio, che è il nome dato al sottospazio su cui l&rsquo;operatore può agire sensatamente, quando questo sia più piccolo dell&rsquo;intero spazio)». La parentesi non è un dettaglio: è il <i>domain problem</i> che Picasso discute e che riprendiamo fra poco.</p>
  <p>Il passaggio dall&rsquo;astratto al calcolabile è di nuovo la relazione di completezza, e Ballentine lo svolge come suo primo esempio. Si parte da un&rsquo;equazione fra ket, $\hat M|\psi\rangle=|\phi\rangle$, si sviluppa in una base ortonormale $\{|u_i\rangle\}$ scrivendo $|\psi\rangle=\sum_j a_j|u_j\rangle$ e $|\phi\rangle=\sum_k b_k|u_k\rangle$, e si applica a sinistra il bra $\langle u_i|$:</p>
  $$\sum_j \langle u_i|\hat M|u_j\rangle\,a_j=\sum_k\langle u_i|u_k\rangle\,b_k=b_i$$
  <p>che è, nelle sue parole, «nella forma di un&rsquo;equazione matriciale» $\sum_j M_{ij}a_j=b_i$, con «$M_{ij}=\langle u_i|\hat M|u_j\rangle$ noto come <b>elemento di matrice</b> dell&rsquo;operatore $\hat M$». La conclusione che Ballentine trae è la frase da ricordare: «in questo modo qualunque problema in uno spazio vettoriale lineare di dimensione $N$, non importa come sorga, può essere trasformato in un problema di matrici».</p>
  <p>E il prodotto di operatori? Shankar lo risolve con il minimo di parole, applicando due volte la stessa formula: «la matrice che rappresenta il prodotto di operatori è il prodotto delle matrici che rappresentano i fattori». La verifica è un inserimento di identità fra i due operatori — $\langle u_i|\hat A\hat B|u_j\rangle=\sum_k\langle u_i|\hat A|u_k\rangle\langle u_k|\hat B|u_j\rangle$ — cioè, letteralmente, la regola di moltiplicazione righe per colonne, <b>dedotta</b> invece che postulata. La non commutatività degli operatori diventa la non commutatività del prodotto di matrici, e Ballentine la nomina subito: la moltiplicazione di operatori «non ha bisogno di essere commutativa, essendo $AB$ in generale diverso da $BA$».</p>
  <p>Per la dimensione infinita, aggiunge, «la stessa cosa si può fare formalmente se lo spazio ha una base ortonormale numerabile, ma si deve allora trattare il problema della convergenza delle somme infinite» — e ancora una volta è la separabilità della tappa 05 a rendere possibile l&rsquo;operazione, e la convergenza a renderla delicata.</p>`},
  {t:'reveal', title:'L’aggiunto: da Riesz, e perché la notazione lo rende banale', tag:'costruzione', steps:[
   {label:'L’azione a sinistra, e il conto che nasconde', body:R`
   <p>Finora gli operatori agiscono a destra, sui ket. Si può definirne l&rsquo;azione a sinistra sui bra, e la definizione naturale è quella che rende l&rsquo;associatività automatica:</p>
   $$\big(\langle\phi|\hat A\big)|\psi\rangle=\langle\phi|\big(\hat A|\psi\rangle\big)\qquad\text{per ogni }\phi,\psi$$
   <p>Questa equazione, osserva Ballentine, «appare banale nella notazione di Dirac, e in effetti questa banalità contribuisce all&rsquo;utilità pratica della sua notazione». Ma poi fa una cosa che vale seguire: <i>mostra che cosa la banalità nasconde</i>. Un bra è un funzionale, $F_\phi(\cdot)=(\phi,\cdot)$; definire l&rsquo;azione di $\hat A$ sui funzionali significa porre $(\hat AF_\phi)(\psi)=F_\phi(\hat A\psi)$, e verificare che il membro di destra è davvero un funzionale lineare <i>di $\psi$</i> — non soltanto di $\hat A\psi$. Lo è; dunque definisce un nuovo funzionale. A questo punto il <b>teorema di Riesz</b> garantisce che esista un ket $\chi$ con $(\hat AF_\phi)(\psi)=(\chi,\psi)$, e poiché $\chi$ è determinato da $\phi$ una volta dato $\hat A$, deve esistere un operatore — lo chiamiamo $\hat A^{\dagger}$ — tale che $\chi=\hat A^{\dagger}\phi$. Da qui</p>
   $$(\hat A^{\dagger}\phi,\psi)=(\phi,\hat A\psi)\qquad\text{per ogni }\phi,\psi$$
   <p>che è «la definizione usuale dell&rsquo;<span class="str" data-str="operatore-aggiunto">aggiunto</span>». E il commento di Ballentine, con il punto esclamativo che è suo: «<b>tutta questa matematica non banale è implicita nella semplice equazione di Dirac!</b>» Questo è, in una riga, che cosa significa che una notazione è buona: non abbrevia, <i>incorpora un teorema</i> e lo rende invisibile a chi la usa.</p>
   <p>Ballentine aggiunge il modo formale di definire l&rsquo;aggiunto dentro la notazione — chiedendo che se $\langle\phi|$ e $|\phi\rangle$ si corrispondono, allora anche $\langle\phi|\hat A^{\dagger}$ e $\hat A|\phi\rangle$ si corrispondano — da cui, usando $\overline{\langle\omega|\psi\rangle}=\langle\psi|\omega\rangle$, segue la forma che si usa nei conti:</p>
   $$\overline{\langle\phi|\hat A^{\dagger}|\psi\rangle}=\langle\psi|\hat A|\phi\rangle$$
   <p>«Sebbene più semplice della precedente introduzione di $\hat A^{\dagger}$ via il teorema di Riesz, questo metodo formale <b>non riesce a dimostrare l&rsquo;esistenza</b> dell&rsquo;operatore $\hat A^{\dagger}$». La distinzione fra una formula che si usa e una dimostrazione che quella formula definisca qualcosa è esattamente la differenza fra Dirac e Ballentine su questo punto.</p>
   <p>Picasso arriva alla stessa definizione dal lato fisico, e la sua strada va vista perché spiega <i>perché basta</i> conoscere i prodotti scalari: un operatore limitato $\eta$ «per definizione è noto quando per ogni $|A\rangle$ sia noto il vettore $|C\rangle=\eta|A\rangle$, ma qualsiasi vettore $|C\rangle$ è completamente determinato quando per ogni $|B\rangle$ siano noti i prodotti scalari $\langle B|C\rangle$». Dunque conoscere i numeri $\langle B|\eta|A\rangle$ equivale a conoscere l&rsquo;operatore — ed è il criterio della tappa 03 applicato agli operatori. La sua definizione dell&rsquo;aggiunto è allora $\langle B|\eta^{\dagger}|A\rangle=\overline{\langle A|\eta|B\rangle}$, la stessa di Ballentine.</p>`},
   {label:'Hermitiano, simmetrico, autoaggiunto: perché sono tre parole', body:R`
   <p>Un operatore si dice <b>autoaggiunto</b> quando $\hat A^{\dagger}=\hat A$, e questa è la condizione che fa di un operatore un&rsquo;osservabile. Qui però c&rsquo;è una finezza che in dimensione finita non esiste e che Picasso dichiara invece di nasconderla, perché il programma di questo corso la tocca.</p>
   <p>Picasso dimostra che l&rsquo;operatore associato a un&rsquo;osservabile verifica, per ogni coppia di stati nel suo dominio,</p>
   $$\langle B|\hat\xi|A\rangle=\overline{\langle A|\hat\xi|B\rangle}$$
   <p>e poi avverte: «se $\hat\xi$ non è limitato, questa relazione, valida per tutti i vettori $|A\rangle,|B\rangle$ appartenenti al dominio di $\hat\xi$, esprime <i>solo</i> il fatto che $\hat\xi$ è <b>hermitiano</b> (poiché il dominio è denso il termine corretto sarebbe <i>simmetrico</i>, tuttavia useremo sempre il termine hermitiano, che è quello normalmente usato dai fisici); perché sia <b>autoaggiunto</b> occorre qualcosa di più: <i>i domini su cui $\hat\xi$ e $\hat\xi^{\dagger}$ sono definiti devono coincidere</i>».</p>
   <p>La differenza non è pedanteria e conviene vedere perché. Un operatore non limitato non è definito su tutto lo spazio: Picasso mostra che l&rsquo;operatore associato all&rsquo;osservabile $\xi$ agisce bene solo sui vettori per cui $\sum_i\xi_i^2|a_i|^2<\infty$, e che questi «costituiscono un insieme <b>denso</b>» — chiama $D_\xi$ quel dominio. Ora, l&rsquo;aggiunto di un operatore definito su un dominio piccolo è definito su un dominio <i>grande</i>, e perché i due coincidano il dominio di partenza deve essere scelto con cura. Il caso di scuola: l&rsquo;operatore impulso su una semiretta è hermitiano e <b>non</b> autoaggiunto, e infatti non è un&rsquo;osservabile — non ha un insieme completo di autovettori. Quando all&rsquo;esame si chiede se un operatore sia un&rsquo;osservabile, la domanda vera è sul dominio, non sulla formula.</p>
   <p>Picasso prende poi posizione sul peso da dare a tutto questo, e la posizione va riportata perché è anche la nostra: «non ci preoccuperemo più che tanto di questi problemi tecnici (<i>domain problems</i>), importanti sì da un punto di vista matematico, ma assolutamente marginali dal punto di vista fisico. Anzi, in linea di principio, si dovrebbe affermare che dal punto di vista fisico <b>tutte le osservabili sono rappresentate da operatori limitati</b>, in quanto nessuno strumento fornisce risultati “grandi quanto ci pare”: la scala di ogni strumento è sempre limitata superiormente (e inferiormente)». E la conclusione che chiude la questione: «la radice dei <i>domain problems</i> risiede nella schematizzazione matematica, non nella fisica». Cioè: l&rsquo;operatore posizione con spettro tutto $\mathbb R$ è un&rsquo;idealizzazione di un regolo di lunghezza finita, e i problemi che crea sono il prezzo dell&rsquo;idealizzazione.</p>`},
   {label:'Un esempio numerico: autovalori reali e autovettori ortogonali', body:R`
   <p>Le due conseguenze dell&rsquo;autoaggiuntezza che si usano in ogni esercizio sono: <b>autovalori reali</b>, e <b>autovettori di autovalori distinti ortogonali</b>. Verifichiamole su una matrice hermitiana con entrate complesse, perché è il caso in cui l&rsquo;hermitianità non si confonde con la simmetria reale. Sia</p>
   $$M=\begin{pmatrix}2 & 1-i\\ 1+i & 3\end{pmatrix}$$
   <p>che è hermitiana perché $M_{21}=\overline{M_{12}}$ e la diagonale è reale. Traccia $5$, e determinante</p>
   $$\det M=2\cdot 3-(1-i)(1+i)=6-|1-i|^{2}=4$$
   <p>Gli autovalori risolvono $\lambda^2-5\lambda+4=0$, cioè $\lambda=\tfrac12(5\pm\sqrt{25-16})$:</p>
   $$\lambda_{+}=4,\qquad \lambda_{-}=1$$
   <p>Entrambi <b>reali</b>, benché la matrice abbia entrate complesse: è la prima conseguenza. Gli autovettori: per $\lambda_+=4$ la prima equazione è $(2-4)x+(1-i)y=0$, soddisfatta da $|v_+\rangle=(1-i,\,2)$; per $\lambda_-=1$ si ha $(2-1)x+(1-i)y=0$, soddisfatta da $|v_-\rangle=(-(1-i),\,1)$. Il loro prodotto scalare, con la coniugazione sulle componenti del primo:</p>
   $$\langle v_{+}|v_{-}\rangle=\overline{(1-i)}\cdot\big({-}(1-i)\big)+\bar 2\cdot 1=-(1+i)(1-i)+2=-2+2=0$$
   <p>cioè $\langle v_+|v_-\rangle=0$: sono <b>ortogonali</b>, seconda conseguenza. Normalizzandoli si ottiene una base ortonormale in cui $M$ è diagonale, e il cambio di base che la realizza è quello della tappa 06. Nota dove la coniugazione è stata decisiva: senza di essa il prodotto darebbe $-(1-i)^2+2=2i+2\ne0$, e si concluderebbe erroneamente che gli autovettori non sono ortogonali. È l&rsquo;errore di segno più costoso di questa materia, perché non si vede: il numero che esce è plausibile.</p>`}
  ]},
  {t:'reveal', title:'Il prodotto esterno, e un avvertimento di notazione', tag:'costruzione', steps:[
   {label:'Perché |ψ⟩⟨φ| è un operatore, e la notazione lo dice', body:R`
   <p>Oltre al prodotto interno di un bra e un ket, che è uno scalare, Ballentine definisce il <b>prodotto esterno</b> $|\psi\rangle\langle\phi|$, e nota che «questo oggetto è un operatore perché, assumendo la moltiplicazione associativa, si ha</p>
   $$\big(|\psi\rangle\langle\phi|\big)|\lambda\rangle=|\psi\rangle\big(\langle\phi|\lambda\rangle\big)$$
   <p>Poiché un operatore è definito specificando la sua azione su un vettore arbitrario per produrre un altro vettore, questa equazione definisce completamente $|\psi\rangle\langle\phi|$ come operatore». Si osservi che è <i>la regola delle parentesi di Dirac</i> a dirlo: due parentesi incomplete, una aperta a destra e una chiusa a sinistra, non sono né un numero né un vettore. Il caso $|\xi_i\rangle\langle\xi_i|$ è il proiettore della tappa 06, e la relazione di completezza è dunque un&rsquo;identità fra operatori scritta come somma di prodotti esterni.</p>
   <p>La regola di coniugazione segue dalla definizione dell&rsquo;aggiunto, e Ballentine la dà come sua equazione (1.20):</p>
   $$(|\psi\rangle\langle\phi|)^{\dagger}=|\phi\rangle\langle\psi|$$
   <p>cioè l&rsquo;aggiunto di un prodotto esterno si ottiene scambiando i due fattori — che è il caso di rango uno della regola generale $(\hat A\hat B)^{\dagger}=\hat B^{\dagger}\hat A^{\dagger}$. Le altre proprietà dell&rsquo;aggiunto, che Ballentine elenca come conseguenze dirette della definizione, sono $(c\hat A)^{\dagger}=\bar c\,\hat A^{\dagger}$ con $c$ numero complesso, e $(\hat A+\hat B)^{\dagger}=\hat A^{\dagger}+\hat B^{\dagger}$. La regola pratica che le riassume tutte: <i>si coniugano i numeri, si mettono le croci sugli operatori, e si inverte l&rsquo;ordine</i>.</p>`},
   {label:'L’avvertimento, e la traccia', body:R`
   <p>Qui Ballentine inserisce una messa in guardia che vale riportare perché è un errore di scrittura frequentissimo e che nessun verificatore intercetta: «in vista di questa relazione, si è tentati di scrivere $(|\psi\rangle)^{\dagger}=\langle\psi|$. Sebbene da una tale notazione non venga alcun danno reale, <b>non va incoraggiata</b>, perché usa il simbolo di “aggiunto”, $\dagger$, per qualcosa che non è un operatore, e che quindi non può soddisfare la definizione fondamentale» dell&rsquo;aggiunto.</p>
   <p>È la stessa igiene per cui Dirac distingue «complesso coniugato» da «immaginario coniugato» e per cui Picasso riserva l&rsquo;asterisco ai numeri e la croce agli operatori: <b>tre convenzioni indipendenti, tutte e tre nate dallo stesso bisogno</b> di non applicare a un oggetto un&rsquo;operazione definita per un altro. La corrispondenza fra $|\psi\rangle$ e $\langle\psi|$ è antilineare e non è un&rsquo;operazione di aggiunzione; scriverla con la croce funziona nei conti e confonde nei concetti — e poi, nella tappa 08, smette di funzionare anche nei conti, perché lì la corrispondenza non è più biunivoca.</p>
   <p>Un&rsquo;ultima quantità, che chiude il ponte con gli invarianti della tappa 06: la <b>traccia</b>, che Ballentine definisce come $\operatorname{Tr}\hat A=\sum_j\langle u_j|\hat A|u_j\rangle$ «dove $\{|u_j\rangle\}$ può essere una qualunque base ortonormale» — e il «qualunque» è il teorema dimostrato nel controllo lampo della tappa 06. Con il prodotto esterno la traccia acquista la sua lettura più utile: $\operatorname{Tr}\big(|\psi\rangle\langle\phi|\big)=\langle\phi|\psi\rangle$, cioè la traccia di un prodotto esterno è il prodotto interno scambiato. È da qui che nascerà la formula del valore di aspettazione come traccia di un prodotto, lo strumento con cui si trattano le miscele statistiche.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Si dimostri, con la sola definizione dell&rsquo;aggiunto, che gli autovalori di un operatore autoaggiunto sono reali.`,
    a:R`Sia $\hat A|\psi\rangle=\lambda|\psi\rangle$ con $|\psi\rangle\ne0$. Si valuti $\langle\psi|\hat A|\psi\rangle$ in due modi. <b>Primo</b>, facendo agire $\hat A$ a destra: $\langle\psi|\hat A|\psi\rangle=\lambda\langle\psi|\psi\rangle$. <b>Secondo</b>, usando l&rsquo;autoaggiuntezza e poi la proprietà $\langle B|A\rangle=\overline{\langle A|B\rangle}$: $\langle\psi|\hat A|\psi\rangle=\langle\psi|\hat A^{\dagger}|\psi\rangle=\overline{\langle\psi|\hat A|\psi\rangle}=\bar\lambda\,\overline{\langle\psi|\psi\rangle}=\bar\lambda\langle\psi|\psi\rangle$, dove si è usato che $\langle\psi|\psi\rangle$ è reale. Eguagliando: $(\lambda-\bar\lambda)\langle\psi|\psi\rangle=0$, e poiché $\langle\psi|\psi\rangle>0$ per l&rsquo;assioma di non degenerazione, segue $\lambda=\bar\lambda$. <b>Dove sta la fisica</b>: l&rsquo;autovalore è il risultato di una misura, e il risultato di una misura è un numero reale segnato su una scala; l&rsquo;autoaggiuntezza è la traduzione algebrica di questo fatto, non una proprietà tecnica. E notare che la dimostrazione <i>usa</i> $\langle\psi|\psi\rangle>0$: è il punto in cui l&rsquo;assioma della tappa 02 paga.`},
   {q:R`Perché $|\psi\rangle\langle\psi|$ con $|\psi\rangle$ normalizzato è un proiettore, e che proprietà algebrica lo caratterizza?`,
    a:R`Lo caratterizzano due proprietà, e vanno viste entrambe. <b>Idempotenza</b>: applicandolo due volte si ottiene $\big(|\psi\rangle\langle\psi|\big)\big(|\psi\rangle\langle\psi|\big)=|\psi\rangle\langle\psi|\psi\rangle\langle\psi|=|\psi\rangle\langle\psi|$, dove si è usata la normalizzazione $\langle\psi|\psi\rangle=1$. Proiettare due volte sullo stesso sottospazio equivale a proiettare una volta, che è il contenuto geometrico. <b>Autoaggiuntezza</b>: dalla regola $(|\psi\rangle\langle\phi|)^{\dagger}=|\phi\rangle\langle\psi|$ con $\phi=\psi$ segue $\hat P^{\dagger}=\hat P$, e questo è ciò che rende la proiezione <i>ortogonale</i> invece che obliqua. Un operatore idempotente non autoaggiunto proietta lungo una direzione che non è perpendicolare al sottospazio, e lì la lunghezza non si accorcia come dovrebbe. Le due insieme, $\hat P^2=\hat P$ e $\hat P^{\dagger}=\hat P$, sono la definizione di proiettore ortogonale, e i suoi autovalori sono necessariamente $0$ e $1$ — perché $\lambda^2=\lambda$. In fisica questo è il legame con la misura: il proiettore è l&rsquo;osservabile «lo stato è $|\psi\rangle$?», con risposta sì o no, e il suo valore di aspettazione è la probabilità.`}
  ]}
]},

/* ---------------- 08 · QUANDO HILBERT NON BASTA: LO SPAZIO EQUIPAGGIATO ---------------- */
{ num:'08', title:'Quando Hilbert non basta: lo spazio equipaggiato', meta:'la frase di Dirac a pag. 54 · la catena dei cinque spazi · «equipaggiato e pronto all’azione» · dove vivono l’onda piana e la delta',
  blocchi:[
  {t:'prosa', title:'Il problema, e chi lo ha visto per primo', tag:'costruzione', html:R`
  <p>Tutto il movimento ha costruito un edificio coerente, e l&rsquo;edificio ha una crepa che il programma di questo corso nomina per esteso — «spettro continuo, stati non normalizzabili, autofunzioni dell&rsquo;operatore posizione». La crepa è questa: <b>un operatore autoaggiunto su uno spazio di dimensione infinita può non avere autovettori</b>. Non «può averne pochi»: può non averne nessuno dentro lo spazio di Hilbert. L&rsquo;operatore posizione è il caso principale, e l&rsquo;operatore impulso il secondo.</p>
  <p>Il fatto notevole è che a vederlo per primo è stato Dirac, e con una lucidità che vale registrare perché contraddice la narrazione per cui lui «calcolava senza rigore». Nel paragrafo 10, discutendo gli autovettori di un&rsquo;osservabile i cui autovalori formano un intervallo continuo, scrive:</p>
  <p style="padding-left:1.2em;border-left:3px solid rgba(255,150,100,.5)"><i>«Nel nostro studio è stato fino a ora implicitamente ammesso che i nostri vettori bra e ket fossero di lunghezza finita, e così pure fossero finiti i loro prodotti scalari. Vediamo adesso la necessità di abbandonare tale ipotesi quando abbiamo a che fare con autovettori di un&rsquo;osservabile i cui autovalori costituiscano un intervallo. <b>Se non l&rsquo;abbandonassimo, non si potrebbe verificare il fenomeno di autovalori formanti un intervallo, e la nostra teoria risulterebbe inadeguata per la maggior parte dei problemi pratici.</b>»</i> — Dirac, pag. stampata 53</p>
  <p>E alla pagina successiva tira la conclusione, che è la frase intorno a cui gira questa tappa: «Lo spazio dei vettori bra o ket, nel caso in cui essi abbiano lunghezze finite e prodotti scalari pure finiti, è chiamato dai matematici uno <b>spazio di Hilbert</b>. I vettori bra e ket da noi ora adoperati formano <i>uno spazio più generale di quello di Hilbert</i>».</p>
  <p>Dirac sapeva dunque tre cose: che il suo spazio non era quello di Hilbert, che doveva essere più grande, e <i>perché</i> — senza il più grande, lo spettro continuo è impossibile e la teoria non serve ai problemi veri. Ciò che non aveva era il nome e la costruzione, che arrivano con Gel&rsquo;fand e Vilenkin nel 1964 e che Ballentine riporta nel suo paragrafo 1.4.</p>`},
  {t:'reveal', title:'La catena dei cinque spazi, costruita', tag:'costruzione', steps:[
   {label:'Prima di tutto: che cosa è lo spazio di Hilbert, esattamente', body:R`
   <p>Ballentine rifà la definizione con la precisione che serve a vedere dove si può allargare. Si prenda un insieme ortonormale infinito di vettori di base $\{\phi_n\}$ e si formi lo spazio $V$ di <i>tutte le combinazioni lineari finite</i>: «$V$ consiste di tutti i vettori della forma $\psi=\sum_n c_n\phi_n$, dove la somma può contenere qualunque numero <b>finito</b> di termini». Questo spazio è troppo piccolo: non contiene i limiti delle sue successioni convergenti, cioè le somme delle serie infinite.</p>
   <p>Si allarga dunque aggiungendo i limiti, e la definizione di limite è nella norma: «diciamo che la successione $\{\psi_i\}$ tende al vettore limite $\chi$ per $i\to\infty$ se e solo se $\lim_i\|\psi_i-\chi\|=0$». Aggiungendo tutti i vettori limite si ottiene uno spazio più grande, $H$: «lo spazio $H$ si dice <b>spazio di Hilbert</b> se contiene i vettori limite di tutte le successioni convergenti nella norma. (Nel gergo tecnico, $H$ è il <i>completamento</i> di $V$ rispetto alla topologia della norma)». E la condizione concreta è quella già incontrata in tappa 04: il limite di $\sum_{n\le i}c_n\phi_n$ «è membro di $H$ purché $\sum_n|c_n|^2$ sia finita».</p>
   <p>Infine la proprietà che qui conta: «uno spazio di Hilbert ha la proprietà di preservare la corrispondenza biunivoca fra vettori in $H$ e membri del suo spazio duale» — cioè <b>è lì che vale il teorema di Riesz</b>, e dunque l&rsquo;ipotesi di Dirac della tappa 03.</p>`},
   {label:'L’universo più grande, e i coniugati', body:R`
   <p>Ora la costruzione. Ballentine prende come universo lo spazio $\Xi$ «che consiste di tutte le combinazioni lineari <i>formali</i> dei vettori di base», cioè $\xi=\sum_n c_n\phi_n$ «senza alcun vincolo imposto sui coefficienti $c_n$»: un vettore colonna infinito con elementi «non ristretti né in grandezza né in numero». Lì «la norma e il prodotto interno saranno indefiniti per molti vettori», e il gioco consiste nel ritagliare dentro $\Xi$ i sottospazi che si comportano bene.</p>
   <p><b>Lo spazio di Hilbert</b> è il sottospazio definito dal vincolo che $\sum_n|c_n|^2$ sia finita. Il suo <b>spazio coniugato</b> $H^{\times}$ è per definizione l&rsquo;insieme dei vettori $f=\sum_n b_n\phi_n$ per cui il prodotto $(f,h)=\sum_n\bar b_n c_n$ converge per ogni $h$ in $H$ ed è un funzionale lineare continuo. Ballentine mostra che $H^{\times}=H$ con un argomento di convergenza: scegliendo le fasi di $c_n$ uguali a quelle di $b_n$ si rende $\bar b_nc_n$ reale positivo, e la convergenza di $(f,h)$ richiede che $|b_n|$ vada a zero almeno tanto rapidamente quanto $|c_n|$, da cui $\sum|b_n|^2$ converge. Conclusione: «<b>uno spazio di Hilbert è identico al suo spazio coniugato</b>». È l&rsquo;unico spazio della catena per cui questo valga, e questa unicità è il punto.</p>
   <p>Poi il passo nuovo. Si definisce uno spazio $\Omega$ <i>più piccolo</i> di $H$, con i coefficienti soggetti a una famiglia infinita di condizioni:</p>
   $$\sum_n |u_n|^2\,n^{m}<\infty\qquad\text{per ogni }m=0,1,2,\dots$$
   <p>«Lo spazio $\Omega$, che è chiaramente un sottospazio di $H$, è un esempio di <b>spazio nucleare</b>». Richiedere la convergenza per $m=0$ è esattamente stare in $H$; richiederla per ogni $m$ è chiedere che i coefficienti decadano più rapidamente di ogni potenza. Il suo coniugato $\Omega^{\times}$ è «uno spazio molto più grande di $\Omega$, poiché un vettore sarà ammissibile se i suoi coefficienti non divergono più rapidamente di una potenza di $n$».</p>
   <p>La regola generale che Ballentine estrae è semplice e va ricordata perché orienta: «<b>più piccolo o più ristretto è uno spazio, più grande sarà il suo coniugato</b>». Un vettore ammissibile come funzionale su uno spazio di funzioni molto regolari può essere molto brutto, perché le funzioni su cui deve agire sono molto buone. Messa in catena, con $V^{\times}=\Xi$ perché un vettore di $V$ ha solo un numero finito di componenti:</p>
   $$V\subset\Omega\subset H=H^{\times}\subset\Omega^{\times}\subset V^{\times}=\Xi$$
   <p>E i due punti che Ballentine chiede di ricordare: che il coniugato cresce al restringersi dello spazio, e che «<b>lo spazio di Hilbert è unico nell&rsquo;essere isomorfo al suo coniugato</b>». Lo spazio di Hilbert sta esattamente in mezzo alla catena, ed è per questo che è privilegiato.</p>`},
   {label:'Il nome, e perché è un nome marinaresco', body:R`
   <p>La tripletta che interessa alla fisica è quella centrale, e Ballentine le dà il nome: «di massimo interesse per le applicazioni è la tripletta $\Omega\subset H\subset\Omega^{\times}$, che si chiama <b>spazio di Hilbert equipaggiato</b>». E poi, in una parentesi che vale citare perché spiega il termine inglese <i>rigged</i>, che altrimenti suona come «truccato»:</p>
   <p style="padding-left:1.2em;border-left:3px solid rgba(120,160,255,.45)"><i>«Il termine “rigged” va interpretato come “equipaggiato e pronto all&rsquo;azione”, in analogia con l&rsquo;attrezzatura di una nave a vela.»</i> — Ballentine, pag. stampata 28</p>
   <p>Il motivo per cui la nave serve è il teorema che segue, e che risolve il problema da cui questa tappa è partita: «come è stato mostrato nel par. 1.3, possono esistere o non esistere soluzioni dell&rsquo;equazione agli autovalori $\hat A|a_n\rangle=a_n|a_n\rangle$ per un operatore autoaggiunto $\hat A$ su uno spazio di dimensione infinita. Tuttavia, il <b>teorema spettrale generalizzato</b> asserisce che se $\hat A$ è autoaggiunto in $H$, allora <i>un insieme completo di autovettori esiste nello spazio esteso</i> $\Omega^{\times}$». Dirac aveva ragione: serviva uno spazio più grande, e in quello spazio gli autovettori ci sono.</p>
   <p>Ballentine riassume la situazione dichiarando che ci sono <b>due</b> soluzioni matematicamente solide, e dicendo quale preferisce e perché: «la prima, basata sul teorema spettrale, è di riformulare le nostre equazioni in termini di operatori di proiezione, che sono ben definiti nello spazio di Hilbert anche quando non possono essere espressi come somme di prodotti esterni di autovettori. La seconda, basata sul teorema spettrale generalizzato, è di allargare il nostro quadro matematico dallo spazio di Hilbert allo spazio di Hilbert equipaggiato, in cui un insieme completo di autovettori (di norma possibilmente infinita) è garantito esistere. Il primo approccio è stato il più popolare fra i fisici matematici nel passato, ma il secondo probabilmente crescerà in popolarità perché <b>permette il pieno uso del formalismo di bra e ket di Dirac</b>».</p>
   <p>Questa è anche la giustificazione retrospettiva del movimento che avete appena letto: la notazione di Dirac, con la sua ipotesi sbagliata e il suo spazio «più generale», è esattamente ciò che lo spazio equipaggiato legittima. In $\Omega^{\times}$ la corrispondenza biunivoca fra bra e ket <b>non vale</b> — i bra stanno in $\Omega^{\times}$ e i ket in $\Omega$, oppure viceversa, e sono spazi diversi — ed è per questo che l&rsquo;avvertimento di Ballentine in tappa 03 («ci sono situazioni in cui è importante ricordare che la definizione primaria del bra è come funzionale») non era pedanteria.</p>`}
  ]},
  {t:'reveal', title:'La versione per funzioni, e i due abitanti famosi', tag:'costruzione', steps:[
   {label:'La stessa tripletta, fatta di funzioni', body:R`
   <p>L&rsquo;esempio con i coefficienti discreti «è il più semplice da analizzare, ma non è l&rsquo;unico utile», e Ballentine dà subito quello che serve alla meccanica quantistica. Si prenda come $\Xi$ lo spazio delle funzioni di una variabile. Allora:</p>
   <p><b>$H$</b> è formato dalle funzioni a quadrato integrabile, quelle per cui $(\psi,\psi)=\int_{-\infty}^{+\infty}|\psi(x)|^2dx$ è finito.</p>
   <p><b>$\Omega$</b> è lo spazio nucleare, fatto delle funzioni che soddisfano la famiglia infinita di condizioni</p>
   $$\int_{-\infty}^{+\infty}|\phi(x)|^{2}(1+|x|)^{m}\,dx<\infty\qquad (m=0,1,2,\dots)$$
   <p>e Ballentine traduce la condizione: «le funzioni $\phi(x)$ che costituiscono $\Omega$ devono annullarsi più rapidamente di qualunque potenza inversa di $x$ nel limite $|x|\to\infty$». Sono le <i>funzioni di prova</i>: molto regolari, molto decrescenti.</p>
   <p><b>$\Omega^{\times}$</b> è fatto delle funzioni $\chi(x)$ per cui $(\chi,\phi)=\int\bar\chi\phi\,dx$ è finito per ogni $\phi$ in $\Omega$, e qui sta il guadagno: «oltre alle funzioni di norma finita, che stanno anche in $H$, $\Omega^{\times}$ <b>conterrà funzioni che sono illimitate all&rsquo;infinito</b>, purché la divergenza non sia peggiore di una potenza di $x$».</p>
   <p>Un controllo concreto che una gaussiana stia in $\Omega$: per $m=2$ il peso $(1+|x|)^2$ produce, fra gli altri, il termine $\int e^{-x^2}x^2dx$, che vale</p>
   $$\int_{-\infty}^{+\infty}e^{-x^{2}}x^{2}\,dx=\frac{\sqrt{\pi}}{2}$$
   <p>cioè è finito — e lo stesso succede per ogni $m$, perché l&rsquo;esponenziale batte ogni potenza. La gaussiana è il prototipo della funzione di prova, e il motivo per cui in tutta la fisica i pacchetti si fanno gaussiani.</p>`},
   {label:'L’onda piana e la delta: dove vivono, e la prova', body:R`
   <p>Ballentine nomina i due abitanti di $\Omega^{\times}$ che sono il contenuto fisico di tutta la costruzione: «$\Omega^{\times}$ contiene $e^{ikx}$, che è un&rsquo;autofunzione dell&rsquo;operatore $D=i\,d/dx$. Contiene anche la <b>delta di Dirac</b> $\delta(x-\lambda)$, che è un&rsquo;autofunzione dell&rsquo;operatore $Q$ definito da $Q\psi(x)=x\,\psi(x)$». Cioè: l&rsquo;autofunzione dell&rsquo;impulso e l&rsquo;autofunzione della posizione, i due oggetti che il programma nomina come «stati non normalizzabili» e «autofunzioni dell&rsquo;operatore posizione», e che nello spazio di Hilbert <i>non esistono</i>.</p>
   <p>Verifichiamo entrambe le affermazioni, perché il punto di questa tappa è che non si tratta di un cambio di definizione per comodità ma di un fatto calcolabile.</p>
   <p><b>L&rsquo;onda piana non sta in $H$.</b> La sua norma quadra è l&rsquo;integrale del suo modulo quadro, che vale uno in ogni punto:</p>
   $$\int_{-\infty}^{+\infty}1\,dx=\infty$$
   <p><b>Ma il suo accoppiamento con una funzione di prova converge.</b> Con la gaussiana come funzione di prova,</p>
   $$\int_{-\infty}^{+\infty}e^{-ikx}\,e^{-x^{2}}\,dx=\sqrt{\pi}\,e^{-k^{2}/4}$$
   <p>finito per ogni $k$ reale. Dunque $e^{ikx}$, che non è un vettore di $H$, <b>è un funzionale lineare continuo su $\Omega$</b>: non è uno stato, è una macchina che misura le funzioni di prova. Ed è esattamente il senso in cui si usa l&rsquo;onda piana in tutta la meccanica quantistica — non come stato di una particella, ma come integrando con cui si costruiscono stati veri per sovrapposizione, cioè come nucleo di una trasformata.</p>
   <p><b>La delta, allo stesso modo.</b> Non è una funzione e la sua «norma» non esiste, ma il suo accoppiamento con una funzione di prova è $\int\delta(x-\lambda)\phi(x)dx=\phi(\lambda)$, perfettamente finito. E l&rsquo;equazione agli autovalori si legge nel senso delle distribuzioni:</p>
   $$Q\,\delta(x-\lambda)=\lambda\,\delta(x-\lambda)$$
   <p>cioè $x\,\delta(x-\lambda)=\lambda\,\delta(x-\lambda)$, che integrata contro qualunque $\phi$ dà $\lambda\phi(\lambda)$ in entrambi i membri. L&rsquo;operatore posizione <i>ha</i> autovettori, e sono le delta; ciò che non hanno è una norma. Ballentine chiude il paragrafo osservando che «questi due esempi bastano a mostrare» l&rsquo;utilità della costruzione, e si può aggiungere: bastano a mostrare che l&rsquo;intera pratica di calcolo della meccanica quantistica — scrivere $|x\rangle$, scrivere $|p\rangle$, inserire $\int dx\,|x\rangle\langle x|$ come se fosse una relazione di completezza — è legittima, a condizione di sapere in quale spazio si sta scrivendo.</p>`},
   {label:'Un criterio operativo: la soglia fra H e Ω, con i numeri', body:R`
   <p>Vale mettere i numeri sulla differenza fra $H$ e $\Omega$, perché è la differenza che si usa nel decidere se un conto è lecito. Si prenda la successione di coefficienti $c_n=n^{-3/2}$. Sta in $H$, perché la somma dei quadrati converge:</p>
   $$\sum_{n=1}^{\infty}|c_n|^{2}=\sum_{n=1}^{\infty}\frac{1}{n^{3}}=\zeta(3)$$
   <p>— finita, circa $1{,}202$. Ma <b>non</b> sta in $\Omega$, perché già la condizione con $m=2$ cade:</p>
   $$\sum_{n}n^{2}|c_{n}|^{2}=\sum_{n}\frac{1}{n}=\infty$$
   <p>È la serie armonica, che diverge. Dunque $c_n=n^{-3/2}$ è un vettore legittimo dello spazio di Hilbert — uno stato normalizzabile a tutti gli effetti — che <b>non è una funzione di prova</b>. Il che significa: ci sono stati fisici perfettamente buoni su cui gli oggetti di $\Omega^{\times}$ non si possono far agire, e l&rsquo;errore da evitare è trattare come universali le manipolazioni con delta e onde piane.</p>
   <p>Il modo di ricordarlo che costa meno: $H$ chiede che i coefficienti decadano <i>abbastanza</i>, $\Omega$ chiede che decadano <i>più di qualunque potenza</i>. Nel vestito delle funzioni, $H$ chiede che $\psi$ sia a quadrato integrabile, $\Omega$ che decada più rapidamente di ogni potenza inversa. La gaussiana sta in $\Omega$; una funzione che decade come $1/x^2$ sta in $H$ e non in $\Omega$; l&rsquo;onda piana e la delta stanno in $\Omega^{\times}$ e non in $H$. Tre caselle, e la fisica abita in tutte e tre.</p>`}
  ]},
  {t:'plot', title:'I tre regimi di decadimento, e le tre caselle della catena',
   intro:R`Tre funzioni che illustrano la tripletta $\Omega\subset H\subset\Omega^{\times}$ sul lato delle funzioni. <b>In blu</b> una gaussiana $e^{-x^2}$: decade più rapidamente di ogni potenza, sta in $\Omega$. <b>In arancio</b> $(1+|x|)^{-0{,}6}$: a quadrato integrabile — il suo quadrato decade come $|x|^{-1{,}2}$ — ma non abbastanza per $\Omega$, sta in $H$ e fuori da $\Omega$. <b>In verde</b> $\cos 2x$: non decade affatto, non è in $H$, ma si accoppia bene con le funzioni di prova e sta in $\Omega^{\times}$.`,
   plots:[
    {kind:'func2d', xr:[-6,6], yr:[-1.25,1.35], height:350, ticks:6,
     title:'decade più di ogni potenza · decade appena · non decade',
     curves:[
      {f:'exp(-x*x)', col:'#4c8dff', width:2.7, label:'e^(−x²) : in Ω, funzione di prova'},
      {f:'pow(1+abs(x),-0.6)', col:'#ff8a5c', width:2.5, label:'(1+|x|)^(−0,6) : in H, non in Ω'},
      {f:'cos(2*x)', col:'#6bdc9b', width:1.9, label:'cos 2x : in Ω×, non in H'}
     ],
     xlabel:'x', ylabel:'valore della funzione'}
   ],
   leggi:R`<p><b>Che cosa guardare.</b> Le tre curve si distinguono solo per <i>come si comportano lontano dall&rsquo;origine</i>, e non per nulla di ciò che fanno al centro. La blu è praticamente zero già a $|x|=3$. L&rsquo;arancio scende, ma lentamente: a $|x|=6$ vale ancora circa $0{,}36$, e moltiplicata per una potenza di $x$ cresce invece di decrescere — per questo esce da $\Omega$. La verde non scende per niente: continua a oscillare fino all&rsquo;infinito con ampiezza uno, quindi il suo quadrato ha integrale infinito e non è uno stato. <b>Che cosa impararne.</b> Che l&rsquo;appartenenza ai tre spazi è una proprietà di <i>coda</i>, e che la gerarchia è una gerarchia di buona educazione all&rsquo;infinito: più una funzione è educata, più maleducati sono gli oggetti con cui si può accoppiare. La verde, integrata contro la blu, dà un numero finito — ed è il senso in cui un&rsquo;onda non normalizzabile «esiste» in meccanica quantistica: non come stato, ma come funzionale sulle funzioni di prova. Si noti il doppio verso: la curva verde non è uno stato ma <i>misura</i> gli stati, e l&rsquo;arancio è uno stato ma non misura nulla di maleducato.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Se $|x\rangle$ e $|p\rangle$ non sono vettori dello spazio di Hilbert, perché è lecito scrivere la relazione di completezza nel continuo, $\int dx\,|x\rangle\langle x|=\mathbb 1$, e usarla come si usa quella discreta?`,
    a:R`È lecito perché l&rsquo;identità non va letta come un&rsquo;uguaglianza fra operatori su tutto lo spazio di Hilbert, ma come un&rsquo;uguaglianza <b>fra funzionali, verificata contro funzioni di prova</b>. Il significato esatto è: per ogni $\phi,\psi$ in $\Omega$ si ha $\int dx\,\langle\phi|x\rangle\langle x|\psi\rangle=\langle\phi|\psi\rangle$, cioè $\int \overline{\phi(x)}\psi(x)dx=\langle\phi|\psi\rangle$ — un&rsquo;identità vera e ovvia. Il teorema spettrale generalizzato è ciò che garantisce che l&rsquo;insieme $\{|x\rangle\}$ sia «completo» in questo senso, nello spazio esteso. <b>Dove invece non è lecito</b>, e qui sta la risposta operativa: non si può trattare $|x\rangle$ come uno stato preparabile, non si può normalizzarlo (vale $\langle x|x'\rangle=\delta(x-x')$, che in $x=x'$ diverge), e non si possono far agire gli oggetti di $\Omega^{\times}$ su vettori di $H$ che non stiano in $\Omega$ — come la successione $n^{-3/2}$ dell&rsquo;esempio. La regola pratica: le manipolazioni con delta e onde piane sono sicure finché gli stati fisici in gioco sono pacchetti ben educati, che è il caso di ogni problema d&rsquo;esame; smettono di esserlo quando si pretende che l&rsquo;autostato stesso sia uno stato.`},
   {q:R`Dirac dice che il suo spazio è «più generale di quello di Hilbert», e Ballentine dice che in quello spazio la corrispondenza biunivoca bra-ket <i>non vale</i>. Le due affermazioni sono compatibili, e che cosa significa concretamente la seconda?`,
    a:R`Sono compatibili, e la seconda è la precisazione della prima. Concretamente: nella tripletta $\Omega\subset H\subset\Omega^{\times}$, lo spazio dei ket e lo spazio dei bra <b>non sono lo stesso spazio</b>. Se si prendono i ket in $\Omega$ (le funzioni di prova), i funzionali su di esse — i bra — vivono in $\Omega^{\times}$, che è strettamente più grande: esistono bra, come $\langle x|$, a cui non corrisponde alcun ket di $\Omega$. Il teorema di Riesz non è violato, perché le sue ipotesi non valgono: Riesz richiede uno spazio completo nella norma, e $\Omega$ non lo è con la topologia che gli serve. Lo spazio di Hilbert è, come Ballentine sottolinea, <b>l&rsquo;unico</b> della catena isomorfo al proprio coniugato, e dunque l&rsquo;unico in cui l&rsquo;ipotesi di Dirac sia vera. La morale è che Dirac ha sbagliato <i>una</i> cosa e indovinato <i>due</i>: ha sbagliato a supporre la simmetria bra-ket, ha indovinato che serviva uno spazio più grande, e ha indovinato perché — senza quello, lo spettro continuo non esiste e «la nostra teoria risulterebbe inadeguata per la maggior parte dei problemi pratici».`}
  ]}
]},

/* ---------------- 09 · IL SENSO E LE ROTTE ---------------- */
{ num:'09', title:'Il senso, e le rotte', meta:'cosa lascia in mano · la lista delle mosse · dove il formalismo riappare in fisica · la domanda che porta avanti',
  blocchi:[
  {t:'prosa', title:'Cosa portarsi via', tag:'sintesi', html:R`
  <p><b>Il punto.</b> L&rsquo;ampiezza complessa del movimento precedente si somma, quindi è un vettore; ha un modulo quadro che significa qualcosa, quindi il suo spazio ha un prodotto interno; gli stati fisici sono i <i>raggi</i> di quello spazio e non i suoi vettori, perché sovrapporre uno stato con sé stesso non produce nulla di nuovo — e questo, come dice Dirac con la membrana vibrante, è la differenza fondamentale fra la sovrapposizione quantistica e ogni sovrapposizione classica. La notazione di bra e ket non è un&rsquo;abbreviazione: è una sintassi in cui le parentesi complete sono numeri e quelle incomplete vettori, e in cui un teorema non banale — Riesz — sta nascosto dentro un&rsquo;equazione che pare ovvia.</p>
  <p><b>La lista delle mosse, in ordine di frequenza d&rsquo;uso.</b> Primo: <i>inserire l&rsquo;identità</i>, $\mathbb 1=\sum_i|\xi_i\rangle\langle\xi_i|$, che è il cambio di base, la rappresentazione matriciale e metà delle dimostrazioni, e che va inserita <b>e riconosciuta</b>, nei due versi. Secondo: <i>sviluppare in base</i>, con $a_i=\langle\xi_i|A\rangle$ e $|a_i|^2$ la probabilità dell&rsquo;esito $\xi_i$, ricordando che le probabilità si leggono solo su stati normalizzati e che $\sum_i|a_i|^2=\langle A|A\rangle$ è Parseval. Terzo: <i>trasformare un operatore</i> con $M'=SMS^{\dagger}$, controllando sempre traccia e determinante, che non cambiano. Quarto: <i>prendere l&rsquo;aggiunto</i> coniugando i numeri, mettendo le croci sugli operatori e invertendo l&rsquo;ordine — e non scrivendo mai la croce su un ket.</p>
  <p><b>Le tre cose che costano un esame se non si sanno.</b> Che la completezza di una base ortonormale in dimensione infinita <i>va dimostrata</i> e non si deduce contando, perché togliendo un vettore da una base infinita resta un insieme infinito e non più completo. Che «hermitiano» e «autoaggiunto» non sono sinonimi quando l&rsquo;operatore non è limitato, e che la differenza sta nei domini — ed è il motivo per cui l&rsquo;impulso su una semiretta non è un&rsquo;osservabile. E che gli autostati della posizione e dell&rsquo;impulso <b>non stanno nello spazio di Hilbert</b>: vivono in $\Omega^{\times}$, la metà larga dello spazio equipaggiato, e si manipolano come funzionali su funzioni di prova, non come stati.</p>
  <p>Di un movimento fatto di grammatica, ciò che resta è <b>una casa e quattro mosse</b>. La casa sta in mezzo a una catena di cinque spazi ed è l&rsquo;unica isomorfa al proprio duale; le quattro mosse si fanno senza pensarci, e quando si fanno senza pensarci il resto del corso diventa fisica invece che algebra.</p>`},
  {t:'prolessi', title:'Dove riappare questo movimento',
   oggetto:R`<b>Lo spazio di Hilbert come casa degli stati, e l&rsquo;algebra di bra e ket come grammatica</b>: la relazione di completezza $\mathbb 1=\sum_i|\xi_i\rangle\langle\xi_i|$ come strumento universale, il prodotto interno come sorgente di ogni probabilità, e la tripletta equipaggiata $\Omega\subset H\subset\Omega^{\times}$ come il posto dove vive ciò che non si normalizza.`,
   rotte:[
    {dove:'Le simmetrie<br>e i generatori', txt:R`È la direzione in cui questo corso è costruito. Una simmetria è una trasformazione che conserva le probabilità, cioè <b>un operatore unitario</b> sullo spazio di Hilbert — la stessa unitarietà della matrice $S$ del cambio di base, qui applicata a traslazioni e rotazioni invece che a un cambio di descrizione. Da un gruppo continuo di operatori unitari si estraggono i <i>generatori</i>, che sono autoaggiunti, e quelli sono impulso, momento angolare e hamiltoniana. Tutto l&rsquo;apparato di questa tappa — unitario conserva la norma, autoaggiunto ha autovalori reali — è il vocabolario in cui quella derivazione si scrive.`},
    {dove:'L’indeterminazione,<br>da Schwarz', txt:R`La disuguaglianza di Cauchy-Schwarz della tappa 02 non è un lemma tecnico: applicata ai vettori $(\hat A-\langle\hat A\rangle)|\psi\rangle$ e $(\hat B-\langle\hat B\rangle)|\psi\rangle$, e tenendo la <b>parte immaginaria</b> del prodotto interno invece della reale, dà un limite inferiore al prodotto delle due varianze pari al quadrato di $\tfrac{1}{2i}\langle[\hat A,\hat B]\rangle$. L&rsquo;indeterminazione non è un postulato: è Schwarz più un commutatore, e il fatto che serva la parte immaginaria è il motivo per cui la dimostrazione con $t$ reale non bastava.`},
    {dove:'Le rappresentazioni<br>di posizione e impulso', txt:R`Scrivere $\psi(x)=\langle x|\psi\rangle$ è leggere le componenti dello stato nella base impropria degli autostati della posizione, e la funzione d&rsquo;onda nello spazio degli impulsi $\tilde\psi(p)=\langle p|\psi\rangle$ è lo <i>stesso stato</i> in un&rsquo;altra base. Il cambio fra le due è il cambio di base della tappa 06 con la somma sostituita da un integrale, e la matrice $\langle p|x\rangle\propto e^{-ipx/\hbar}$: cioè la <b>trasformata di Fourier è una matrice unitaria di cambio di base</b>, e non uno strumento analitico estraneo. Che entrambe le basi vivano in $\Omega^{\times}$ è la ragione per cui la cosa funziona.`},
    {dove:'Sistemi composti,<br>e la decoerenza', txt:R`Lo spazio di due sistemi non è la somma ma il <b>prodotto tensoriale</b> dei loro spazi di Hilbert, e lì nascono gli stati che non si fattorizzano — l&rsquo;entanglement. Il prodotto esterno $|\psi\rangle\langle\psi|$ di questa tappa diventa l&rsquo;<i>operatore densità</i>, che per un sottosistema non è più un proiettore e descrive una miscela invece di uno stato puro; la traccia parziale è l&rsquo;operazione che lo produce, e la perdita del termine d&rsquo;interferenza è la decoerenza. È il punto in cui questo formalismo incontra la meccanica statistica, e la direzione in cui guarda la tesi.`}
   ],
   domanda:R`Abbiamo visto che lo stesso stato dà distribuzioni di probabilità diverse in basi diverse, e che per <i>ogni</i> stato esiste una base in cui l&rsquo;esito di una misura è certo. <b>Domanda che porti avanti:</b> si possono allora trovare basi in cui <i>due</i> osservabili diverse danno entrambe esito certo? Se sì, le due si potrebbero misurare insieme con precisione arbitraria, e l&rsquo;indeterminazione non sarebbe un fatto generale. La risposta è che si può esattamente quando le due osservabili <b>commutano</b> — perché solo allora esiste una base ortonormale fatta di autovettori comuni — e la risposta porta con sé l&rsquo;intera struttura del corso: gli insiemi completi di osservabili compatibili, i numeri quantici che etichettano uno stato, e il fatto che la lista di numeri quantici di un sistema <i>è</i> la scelta di un massimo insieme di operatori che commutano fra loro. Il commutatore, che qui è comparso solo come l&rsquo;osservazione che $\hat A\hat B\ne\hat B\hat A$, diventa da quel punto l&rsquo;oggetto che decide che cosa si può sapere insieme.`}
]}

];
