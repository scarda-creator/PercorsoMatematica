/* ===================================================================

   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un
   rimando scritto nella prosa:

var CORSO = 'meccanica-quantistica';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["disuguaglianza-di-schwarz"] = {"nome":"Disuguaglianza di Cauchy-Schwarz","riga":"$|\\langle\\phi|\\psi\\rangle|^{2}\\le\\langle\\phi|\\phi\\rangle\\,\\langle\\psi|\\psi\\rangle$, con l'uguaglianza se e solo se i due vettori sono proporzionali.","serve":"E' la disuguaglianza da cui nasce il principio di indeterminazione. Applicata agli scarti di due osservabili, e tenendo la sola parte immaginaria del prodotto scalare, da' un limite inferiore al prodotto delle due varianze pari al quadrato di $\\tfrac{1}{2i}\\langle[\\hat A,\\hat B]\\rangle$. L'indeterminazione non e' un postulato: e' Cauchy-Schwarz piu' un commutatore.","esempio":"Con posizione e impulso il commutatore vale $i\\hbar$, e la disuguaglianza diventa $\\sigma_x^{2}\\sigma_p^{2}\\ge\\hbar^{2}/4$, cioe' $\\sigma_x\\sigma_p\\ge\\hbar/2$. Il fattore un mezzo viene dal $2i$ al denominatore, non da una convenzione scelta.","debito":"la dimostrazione della disuguaglianza — il discriminante della norma quadra di una combinazione lineare — e' quella standard degli spazi con prodotto interno e non si ripete qui.","controllo":[{"tipo":"uguale","sinistra":"(1/(2*I)*(I*hbar))**2","vale":"hbar**2/4","ipotesi":{"hbar":"positive"},"dove":"esempio","appare":"\\hbar^{2}/4"},{"tipo":"uguale","sinistra":"sqrt(hbar**2/4)","vale":"hbar/2","ipotesi":{"hbar":"positive"},"dove":"esempio","appare":"\\hbar/2"}],"qui":{},"pieno":null};
STRUM["delta-di-dirac"] = {"nome":"Delta di Dirac","riga":"Non è una funzione ma un funzionale, definito da $\\int f(x)\\,\\delta(x-a)\\,dx=f(a)$, che composto con una funzione si spezza sui suoi zeri come $\\delta(g(x))=\\sum_i \\delta(x-x_i)/|g'(x_i)|$.","serve":"Serve come macchina per cambiare variabile senza invertire nulla. La densità di $y=f(x)$ si scrive $p_Y(y)=\\int p_X(x)\\,\\delta(y-f(x))\\,dx$, e la delta produce da sola il fattore $1/|f'|$ che altrimenti andrebbe messo a mano: i rami molteplici si contano da soli invece di doverli ricordare. È la ragione pratica per cui il formalismo con la delta compare in ogni soluzione d'esame che tocchi una distribuzione, mentre il cambio di variabile esplicito compare quasi mai.","esempio":"$\\delta(x^2-a^2)$ con $a$ positivo. Gli zeri sono $x=\\pm a$; la derivata dell'argomento è $2x$, che in modulo vale $2a$ su entrambi. Quindi $\\delta(x^2-a^2)=\\dfrac{1}{2a}\\big[\\delta(x-a)+\\delta(x+a)\\big]$. Il caso si ripete identico in fisica statistica con $\\varepsilon=p^2/2m$ in una dimensione, dove i due rami $p=\\pm\\sqrt{2m\\varepsilon}$ contribuiscono entrambi — e dimenticarne uno dimezza la risposta.","pieno":{"file":"15-distribuzioni.html","tappa":"01","come":"le distribuzioni come funzionali, la delta e le sue proprietà, nel nucleo di Metodi"},"qui":{"meccanica-statistica":{"serve":"È lo strumento con cui si calcola la densità degli stati, cioè l'oggetto su cui poggia tutto il secondo tempo del corso: $g(\\varepsilon)=\\int d^dp\\,d^dq\\;\\delta(\\varepsilon-H)/h^d$. L'identità che si usa davvero non è la definizione ma questa: $\\delta(\\varepsilon-H)=\\partial_\\varepsilon\\,\\theta(\\varepsilon-H)$. Si scambia l'integrale con la derivata e ci si ritrova a calcolare il volume della regione dove l'hamiltoniana sta sotto $\\varepsilon$ — un integrale elementare — invece di un integrale con una delta dentro. La $g$ così ottenuta è pura geometria dello spazio delle fasi: non sa nulla della temperatura, e per questo resta identica quando si passa da Boltzmann a Fermi o a Bose.","esempio":"Particella libera in due dimensioni. Il volume della regione $p^2/2m$ sotto $\\varepsilon$ è il disco di area $2\\pi m\\varepsilon$; derivando rispetto a $\\varepsilon$ si ottiene $2\\pi m$, cioè una densità degli stati costante. Non è una curiosità: è la ragione per cui in due dimensioni una particella libera non condensa, e per cui le prove che chiedono la condensazione in $d=2$ mettono sempre un potenziale confinante, che porta la $g$ da costante a crescente."}},"controllo":[{"tipo":"derivata","espr":"x**2-a**2","rispetto":["x"],"vale":"2*x","ipotesi":{"x":"positive","a":"positive"},"dove":"esempio","appare":"2x"},{"tipo":"uguale","sinistra":"1/Abs(2*a)","vale":"1/(2*a)","ipotesi":{"a":"positive"},"dove":"esempio","appare":"\\dfrac{1}{2a}"},{"tipo":"derivata","espr":"2*pi*m*e","rispetto":["e"],"vale":"2*pi*m","ipotesi":{"m":"positive","e":"positive"},"dove":"qui.meccanica-statistica.esempio","appare":"2\\pi m"}]};
STRUM["spazio-di-hilbert"] = {"nome":"Spazio di Hilbert","riga":"E' uno spazio vettoriale complesso con prodotto interno, completo nella norma che ne deriva e separabile, cosicche' ogni stato si scrive come somma numerabile $|\\psi\\rangle=\\sum_n c_n|n\\rangle$ con $c_n=\\langle n|\\psi\\rangle$.","serve":"E' la casa degli stati, e le tre parole della definizione fanno tre lavori diversi. Il prodotto interno da' le ampiezze, e quindi le probabilita'. La completezza garantisce che il limite di una successione di stati sia ancora uno stato: senza, uno sviluppo in serie potrebbe convergere fuori dallo spazio. La separabilita' permette di scrivere un vettore con una lista numerabile di coefficienti, cioe' di fare i conti.","esempio":"La relazione di completezza $\\sum_n|n\\rangle\\langle n|=\\hat 1$ e' lo strumento operativo piu' usato della teoria: infilata dentro un prodotto scalare lo spezza in una somma. La norma diventa $\\langle\\psi|\\psi\\rangle=\\sum_n|c_n|^{2}$, e se lo stato e' normalizzato quella somma vale uno: i moduli quadri dei coefficienti sono probabilita', e sommano a uno per costruzione.","debito":"la costruzione di $L^{2}$ come completamento, la misura di Lebesgue che serve a definirlo e il teorema di Riesz-Fischer stanno nei movimenti di Metodi; qui si usa il risultato.","controllo":[{"tipo":"somma","espr":"(1/2)**n","var":"n","da":"1","a":"oo","vale":"1","ipotesi":{"n":"positive-integer"},"dove":"esempio","appare":"sommano a uno"},{"tipo":"simbolico","dove":"esempio","appare":"\\sum_n|n\\rangle\\langle n|=\\hat 1","perche":"e' la relazione di completezza: i proiettori sugli elementi di una base ortonormale sommano all'identita'. E' la proprieta' che definisce una base completa, non un conto"}],"qui":{},"pieno":null};
STRUM["operatore-aggiunto"] = {"nome":"Operatore aggiunto e autoaggiunto","riga":"L'aggiunto e' definito da $\\langle\\phi|\\hat A\\psi\\rangle=\\langle\\hat A^{\\dagger}\\phi|\\psi\\rangle$ per ogni coppia di stati, e l'operatore e' autoaggiunto quando coincidono sia $\\hat A^{\\dagger}$ con $\\hat A$ sia i loro domini.","serve":"E' la condizione che rende un operatore un'osservabile: autovalori reali, e autovettori di autovalori distinti ortogonali. In dimensione finita «autoaggiunto» e «hermitiano» coincidono; in dimensione infinita no, e la differenza non e' pedanteria — l'operatore impulso su una semiretta e' hermitiano e non autoaggiunto, e infatti non e' un'osservabile.","esempio":"Se $\\hat A\\psi=a\\psi$ con $\\hat A$ autoaggiunto, allora $a\\langle\\psi|\\psi\\rangle=\\langle\\psi|\\hat A\\psi\\rangle=\\langle\\hat A\\psi|\\psi\\rangle=a^{*}\\langle\\psi|\\psi\\rangle$; siccome la norma non e' nulla segue $a=a^{*}$, cioe' l'autovalore e' reale. Tre righe, e sono la ragione per cui le osservabili si rappresentano cosi'.","debito":"la distinzione fra hermitiano e autoaggiunto in dimensione infinita — domini, estensioni, indici di difetto — e' il programma di von Neumann e sta fuori da questo percorso: qui si dichiara che esiste e si lavora nel caso buono. La regola di inversione dell'ordine nell'aggiunto di un prodotto si usa e non si dimostra.","controllo":[{"tipo":"uguale","sinistra":"conjugate(a)","vale":"a","ipotesi":{"a":"real"},"dove":"esempio","appare":"a=a^{*}"}],"qui":{},"pieno":null};

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

/* ---------------- 00 · DI COSA PARLA QUESTO MOVIMENTO ---------------- */
{ num:'00', title:'Di cosa parla questo movimento', meta:'Meccanica Quantistica · voce Q.2 · il posto dove vivono gli stati, e la grammatica che vi si parla',
  blocchi:[
  {t:'prosa', title:'Due cose in un movimento, e perché sono una sola', tag:'architettura', html:R`
  <p>Il movimento precedente ha consegnato <b>un oggetto</b>: l&rsquo;ampiezza di probabilità, un numero complesso che si somma <i>prima</i> di diventare probabilità. Un oggetto che si somma e si moltiplica per numeri complessi è, per definizione, un vettore; e un oggetto il cui modulo quadro ha un significato è un vettore in uno spazio dotato di prodotto interno. Questo movimento fa due cose che sembrano distinte e non lo sono: <b>costruisce lo spazio</b> in cui quei vettori vivono — lo spazio di Hilbert — e <b>costruisce la scrittura</b> con cui si lavora dentro, la notazione di bra e ket di Dirac.</p>
  <p>Non sono due argomenti. Sono la stessa cosa guardata da due lati, e il modo di vederlo è questo: lo spazio di Hilbert risponde alla domanda <i>quali oggetti</i> esistono, la notazione di Dirac risponde alla domanda <i>quali operazioni</i> sono lecite e come si scrivono. Separarle produce il difetto tipico di chi ha studiato il formalismo senza capirlo: sa manipolare i simboli ma non sa dire quando un passaggio è illecito, e quindi non sa <i>quando</i> un conto gli sta mentendo.</p>
  <p>La tesi operativa di questo movimento, quella da cui si misura se è servito, è una sola: <b>il cambiamento di base deve diventare un&rsquo;operazione di due righe.</b> Non una metafora — due righe letterali, perché si inserisce un&rsquo;identità scritta come somma di proiettori e si raccoglie. Metà degli errori negli scritti di questo esame nasce da un cambio di base fatto male, e un cambio di base fatto male è sempre, senza eccezioni, un cambio di base fatto <i>a mano</i> invece che con la relazione di completezza.</p>`},
  {t:'prosa', title:'Un disaccordo fra le fonti che è il contenuto, e non un dettaglio', tag:'architettura', html:R`
  <p>Qui le fonti del corso <b>non concordano</b>, e stavolta il disaccordo non è di ordine didattico come in mq-01: è matematico, ha un vincitore parziale su ciascun fronte, e la sua risoluzione è l&rsquo;ultima tappa di questo movimento. Dichiararlo subito serve a non far sembrare incoerente ciò che è semplicemente una storia.</p>
  <p><b>Dirac</b> (1930) costruisce i ket come vettori di uno spazio lineare e i bra come il suo duale, e poi <i>suppone</i> che fra i due ci sia corrispondenza biunivoca. Lo dice con quel verbo: «supporremo ora che esista una corrispondenza biunivoca fra i bra e i ket». Non lo dimostra. E a pagina 54, parlando di autovettori con autovalori che formano un intervallo continuo, aggiunge una frase che è il seme di tutto il resto: «Lo spazio dei vettori bra o ket, nel caso in cui essi abbiano lunghezze finite e prodotti scalari pure finiti, è chiamato dai matematici uno spazio di Hilbert. I vettori bra e ket da noi ora adoperati formano <i>uno spazio più generale di quello di Hilbert</i>».</p>
  <p><b>von Neumann</b> (1932) fa l&rsquo;operazione opposta: parte dagli assiomi, definisce lo spazio di Hilbert come l&rsquo;unico oggetto che abbia lo stesso significato per le successioni di Heisenberg e per le funzioni d&rsquo;onda di Schrödinger, e dentro quello spazio tutto è dimostrato e niente è supposto. Il prezzo è che <b>gli autovettori dell&rsquo;operatore posizione non esistono</b>: la delta di Dirac non è un elemento dello spazio di Hilbert, perché non ha norma finita.</p>
  <p><b>Ballentine</b> (il libro che il docente consiglia) dichiara di scrivere «una versione modernizzata del formalismo di Dirac», e nel capitolo 1 fa una cosa precisa: dimostra con il <i>teorema di Riesz</i> la corrispondenza che Dirac supponeva, e poi — in una nota in corpo minore che vale mezzo capitolo — scrive che «il teorema di Riesz mostra che non c&rsquo;è bisogno, e in effetti non c&rsquo;è spazio, per una tale ipotesi. Inoltre, dovremo prima o poi considerare spazi più generali (triplette di spazio di Hilbert equipaggiato) per i quali la corrispondenza biunivoca fra bra e ket <i>non vale</i>». Cioè: Dirac aveva fatto un&rsquo;ipotesi inutile dove serviva un teorema, e sbagliata dove serviva uno spazio più grande.</p>
  <p>Chi ha ragione? Dirac ha ragione sul fatto, von Neumann sul rigore, Ballentine sulla sintesi — e la sintesi ha un nome, <b>spazio di Hilbert equipaggiato</b>, che è l&rsquo;argomento della tappa 08. Il programma di questo corso nomina per esteso «spettro continuo, stati non normalizzabili, autofunzioni dell&rsquo;operatore posizione»: quelle tre voci <i>sono</i> questo disaccordo, e non si capiscono se non si sa che c&rsquo;è.</p>`},
  {t:'prosa', title:'Come è fatto il movimento', tag:'architettura', html:R`
  <p><b>La rotta.</b> La tappa 01 ricava la struttura di spazio vettoriale dal principio di sovrapposizione, seguendo Dirac riga per riga, e arriva al fatto che uno stato è un <i>raggio</i> e non un vettore. La 02 aggiunge il prodotto interno, ne elenca gli assiomi nella forma di von Neumann, e dimostra la disuguaglianza di Schwarz con la sua dimostrazione — che è anche il modo di vederla come una parabola. La 03 costruisce il bra: prima come lo costruisce Dirac (il duale, la regola delle parentesi), poi come lo fonda Ballentine (il teorema di Riesz, dimostrato). La 04 costruisce le basi ortonormali e la completezza, con la dimostrazione fisica di Picasso e il criterio di von Neumann, e arriva alla serie di Fourier astratta e all&rsquo;identità di Parseval, verificata su un caso concreto. La 05 risponde alla domanda storica — perché un <i>solo</i> spazio per le matrici di Heisenberg e per le onde di Schrödinger — che è il programma dichiarato di von Neumann. La 06 è la tappa operativa: la relazione di completezza, e il cambiamento di base in due righe, con un esempio numerico svolto e due invarianti controllati. La 07 porta la rappresentazione matriciale, l&rsquo;aggiunto, il prodotto esterno, e la distinzione fra hermitiano e autoaggiunto che non è pedanteria. La 08 è lo spazio equipaggiato: dove Hilbert non basta, e perché. L&rsquo;ultima raccoglie il senso.</p>
  <p><b>Che cosa questo movimento non fa.</b> Non introduce i postulati della misura, né l&rsquo;equazione di Schrödinger, né le simmetrie — che sono il cuore del corso. Costruisce il linguaggio in cui quelle cose si diranno. È un movimento di grammatica, e l&rsquo;unico in cui la grammatica <i>è</i> il contenuto.</p>`}
]},

/* ---------------- 01 · DAL PRINCIPIO DI SOVRAPPOSIZIONE AL VETTORE ---------------- */
{ num:'01', title:'Dal principio di sovrapposizione al vettore', meta:'la somma come dato sperimentale · la membrana vibrante di Dirac · perché uno stato è un raggio · il ket nullo che non è uno stato',
  blocchi:[
  {t:'prosa', title:'Perché proprio un vettore, e non qualcos’altro', tag:'costruzione', html:R`
  <p>Il punto di partenza non è matematico. È il fatto sperimentale del movimento precedente: aperte due fenditure, esiste uno stato che non è «né la prima né la seconda» né una loro miscela statistica, e la sua ampiezza è la <i>somma</i> delle due ampiezze. Dirac parte esattamente da qui, e il passaggio che fa è così corto che vale citarlo per intero perché mostra come si deduce una struttura matematica da un fatto fisico:</p>
  <p style="padding-left:1.2em;border-left:3px solid rgba(120,160,255,.45)"><i>«Il processo di sovrapposizione risulta come una specie di processo additivo e implica che gli stati possano venire in qualche modo sommati per darne di nuovi. Gli stati devono quindi essere connessi a grandezze matematiche tali da poter essere sommate per darne altre della stessa specie. Le grandezze più ovvie di questo tipo sono i vettori.»</i> — Dirac, pag. stampata 20</p>
  <p>Il ragionamento ha tre anelli e nessuno è decorativo. Primo: la sovrapposizione <i>è</i> un&rsquo;addizione, perché è così che si comporta negli esperimenti. Secondo: se la si vuole rappresentare, serve un insieme di oggetti matematici <b>chiuso rispetto alla somma</b>, cioè tale che sommandone due si ottenga ancora un oggetto dello stesso insieme. Terzo: la struttura minima con questa proprietà si chiama spazio vettoriale. Non c&rsquo;è nessuna analogia in questo passaggio — niente «lo stato è come un&rsquo;onda» — e questo è il motivo per cui regge mentre il dualismo onda-particella non reggeva.</p>
  <p>Dirac aggiunge subito il vincolo di dimensione, e anche questo è un&rsquo;osservazione fisica travestita da matematica: «I vettori ordinari, usati in uno spazio con un numero finito di dimensioni, non hanno sufficiente generalità per descrivere la maggior parte dei sistemi dinamici che s&rsquo;incontrano in meccanica quantistica. Dovremo perciò generalizzare ulteriormente il concetto di vettore riferendolo a uno spazio con un numero infinito di dimensioni, e di conseguenza la trattazione matematica risulterà complicata da questioni di convergenza». Quelle «questioni di convergenza» sono l&rsquo;intero contenuto delle tappe 04 e 08 di questo movimento: Dirac le vede nel 1930 e le mette da parte, e noi dobbiamo riprenderle perché il programma le chiede per nome.</p>`},
  {t:'prosa', title:'Il nome, e la nota del traduttore', tag:'costruzione', html:R`
  <p>A questo punto Dirac battezza l&rsquo;oggetto, e il battesimo è parte della fisica. «In meccanica quantistica è opportuno designare con un nome speciale i vettori connessi con gli stati di un sistema, siano essi riferiti a uno spazio con un numero finito o infinito di dimensioni. Li chiameremo <b>vettori ket</b>, o semplicemente ket, e denoteremo uno di essi in generale con lo speciale simbolo $|\,\rangle$: se vogliamo specificarne uno con una lettera $A$, per esempio, inseriremo tale lettera in mezzo e scriveremo $|A\rangle$». E poi la frase che è tutta la sua giustificazione, data in anticipo e a credito: «La convenienza di questa notazione diverrà chiara via via che lo schema sarà sviluppato».</p>
  <p>Da dove viene la parola. L&rsquo;edizione italiana porta una nota del traduttore che vale riportare, perché è ciò che rende la notazione memorizzabile invece che arbitraria: <i>«bra e ket sono la prima e la seconda metà della parola inglese bracket (parentesi)»</i>. Il simbolo $\langle\,|$ è la metà sinistra di una parentesi angolare e il simbolo $|\,\rangle$ la metà destra; messi insieme, $\langle B|A\rangle$, formano una parentesi completa. La tappa 03 mostrerà che <b>questo scherzo tipografico è una regola di sintassi esatta</b>: le parentesi complete sono numeri, quelle incomplete sono vettori, e non c&rsquo;è terza possibilità.</p>
  <p>Le operazioni lecite sui ket sono quelle di uno spazio vettoriale sul campo complesso, e Dirac le elenca nella forma in cui serviranno: si moltiplicano per numeri complessi, si sommano fra loro, e — se dipendono da un parametro continuo $\xi$ che percorre un intervallo — si <i>integrano</i> rispetto a quel parametro per darne un altro ket. Quest&rsquo;ultima operazione è quella che farà uscire dallo spazio di Hilbert in tappa 08, ed è istruttivo che Dirac la metta in lista accanto alle altre, come se fosse innocua. Nel 1930 lo sembrava.</p>`},
  {t:'reveal', title:'Perché uno stato è un raggio: la membrana che non vibra', tag:'costruzione', steps:[
   {label:'L’ipotesi: sovrapporre uno stato con sé stesso non dà niente di nuovo', body:R`
   <p>Resta un&rsquo;ipotesi da fare, e Dirac la isola perché è quella che separa la sovrapposizione quantistica da tutte le altre: «supporremo cioè che, sovrapponendo uno stato con se stesso, non si possa formare alcun altro stato che non sia quello originario». Scritta nei suoi simboli: se lo stato corrisponde al ket $|A\rangle$, sovrapporlo con sé stesso dà</p>
   $$c_1|A\rangle+c_2|A\rangle=(c_1+c_2)|A\rangle$$
   <p>e l&rsquo;ipotesi è che questo rappresenti <b>lo stesso stato</b> di $|A\rangle$. Poiché $c_1+c_2$ è un numero complesso arbitrario, la conclusione è immediata e Dirac la enuncia subito: «se il vettore ket corrispondente a uno stato viene moltiplicato per un numero complesso qualunque, non nullo, il ket risultante corrisponde allo stesso stato. Uno stato è dunque caratterizzato <i>dalla direzione</i> di un vettore ket, mentre non ha alcuna importanza la lunghezza assegnata a quest&rsquo;ultimo».</p>
   <p>Un&rsquo;eccezione la nomina lui stesso, e non è un dettaglio: «può accadere che $c_1+c_2=0$, nel qual caso il risultato della sovrapposizione è nullo, poiché le due componenti si sono eliminate a vicenda per un effetto di interferenza». Il caso in cui la somma dei coefficienti si annulla non produce uno stato nuovo, non produce lo stato di partenza: <b>non produce alcuno stato</b>. Il ket nullo non corrisponde a nessuna situazione fisica, e in questo c&rsquo;è già tutto il contenuto di quella che oggi chiamiamo normalizzazione.</p>`},
   {label:'Il fuoco: la membrana vibrante, e cosa manca a uno stato quantistico', body:R`
   <p>Perché questa ipotesi è una <i>scelta</i> e non un&rsquo;ovvietà? Perché un sistema classico con un principio di sovrapposizione si comporta all&rsquo;opposto, e Dirac lo mostra con un esempio che è il punto in cui si vede la differenza fra le due fisiche. Vale per esteso:</p>
   <p style="padding-left:1.2em;border-left:3px solid rgba(255,150,100,.5)"><i>«L&rsquo;ipotesi ora fatta mostra molto chiaramente la fondamentale differenza fra la sovrapposizione della teoria quantistica e ogni tipo di sovrapposizione classica. Infatti, nel caso di un sistema classico per cui valga un principio di sovrapposizione, ad esempio per una membrana vibrante, quando si sovrappone uno stato con se stesso, il risultato è che si ottiene uno stato diverso, con una diversa ampiezza delle oscillazioni. Per uno stato quantistico, invece, non c&rsquo;è nessuna caratteristica fisica corrispondente all&rsquo;ampiezza delle oscillazioni classiche come caratteristica distinta dalla loro qualità, la quale è descritta dai rapporti tra le ampiezze in punti diversi della membrana.»</i> — Dirac, pag. stampata 23</p>
   <p>Letta lentamente, questa è la frase più utile del capitolo. Una membrana che vibra con il doppio dell&rsquo;ampiezza è in uno stato <b>fisicamente diverso</b>: suona più forte, ha più energia. La funzione d&rsquo;onda raddoppiata non descrive niente di più intenso: descrive la stessa cosa. Il motivo è che l&rsquo;informazione fisica non sta nei valori dell&rsquo;ampiezza, sta nei loro <i>rapporti</i> — e i rapporti non cambiano se si moltiplica tutto per una costante. Dirac chiude col caso limite: «mentre classicamente esiste uno stato con ampiezza di oscillazione dappertutto nulla, cioè lo stato di quiete, quantisticamente non esiste uno stato corrispondente per un sistema, poiché il vettore ket nullo non corrisponde a nessuno stato». Classicamente, la quiete è uno stato. Quantisticamente, il vettore nullo non è <i>niente</i>: una particella che non c&rsquo;è non è una particella ferma.</p>`},
   {label:'Che cosa resta di arbitrario: la fase globale', body:R`
   <p>Mettiamo in forma esatta quanta libertà resta. Se uno stato è una direzione, si può scegliere il rappresentante più comodo: quello di lunghezza $1$. Dirac: «è spesso conveniente scegliere tale fattore in modo che il vettore abbia lunghezza unitaria. Tale procedimento è detto <b>normalizzazione</b>». Ma la normalizzazione non fissa il rappresentante del tutto, e lui lo dice nella stessa riga: «il vettore non risulta completamente determinato nemmeno allora, poiché è sempre possibile moltiplicarlo per un numero complesso arbitrario di modulo unitario, cioè per qualunque numero della forma $e^{i\gamma}$ con $\gamma$ reale, senza alterarne la lunghezza. Chiameremo tale numero <b>fattore di fase</b>».</p>
   <p>La verifica è un conto di una riga, e conviene farla perché è il conto che spiega in che senso la fase è «libera»: per $\gamma$ reale,</p>
   $$|e^{i\gamma}|=1\qquad\Longrightarrow\qquad \big\|e^{i\gamma}|A\rangle\big\|=\big\||A\rangle\big\|$$
   <p>cioè moltiplicare per una fase non cambia la norma, dunque non esce dalla sfera dei vettori normalizzati, dunque non c&rsquo;è modo di scegliere «la» fase giusta. Questo è il punto in cui un conto che sembra banale ha una conseguenza enorme: <b>la fase globale di uno stato non è misurabile</b>, perché ogni previsione della teoria dipende da moduli quadri di prodotti scalari, e lì la fase globale si cancella. Le fasi <i>relative</i>, invece, sono tutto — sono il termine d&rsquo;interferenza del movimento precedente. Picasso lo dice nella forma più tagliente, discutendo i coefficienti $a_i$ di uno sviluppo: cambiare gli $a_i$ per un fattore di fase «equivale a cambiare lo stato, <i>a meno che</i> le fasi non siano tutte uguali, nel qual caso lo stato non cambia».</p>
   <p>Picasso cementa tutto questo in un assioma, ed è la forma in cui conviene ricordarlo per l&rsquo;esame — <b>Principio di sovrapposizione</b>: «gli stati di un sistema sono rappresentati dagli elementi (vettori) di uno spazio vettoriale $\mathcal H$ sul corpo complesso. Vettori proporzionali (con un fattore complesso) rappresentano lo stesso stato. Gli stati sono quindi in corrispondenza con i <b>raggi</b> di $\mathcal H$».</p>`}
  ]},
  {t:'plot', title:'Uno stato è una direzione, non un punto',
   intro:R`Una fetta reale e bidimensionale dello spazio degli stati. Ogni retta per l&rsquo;origine è <i>un solo</i> stato: tutti i suoi punti — vicini, lontani, dalla parte opposta — rappresentano la stessa situazione fisica, perché differiscono per un fattore moltiplicativo. Le due rette disegnate hanno coefficienti angolari $\tfrac34$ e $-\tfrac43$, il cui prodotto è $-1$: sono due stati <b>ortogonali</b>.`,
   plots:[
    {kind:'func2d', xr:[-3,3], yr:[-3,3], height:340, ticks:6,
     title:'due raggi, cioè due stati',
     curves:[
      {f:'0.75*x', col:'#4c8dff', width:2.6, label:'stato |A⟩  (tutta la retta)'},
      {f:'-1.3333*x', col:'#ff8a5c', width:2.6, label:'stato |B⟩ ⊥ |A⟩'}
     ],
     xlabel:'componente lungo il primo vettore di base', ylabel:'componente lungo il secondo'}
   ],
   leggi:R`<p><b>Che cosa guardare.</b> Non i punti, le <i>rette</i>. Il punto $(4,3)$ e il punto $(-0{,}8,-0{,}6)$ stanno sulla stessa retta blu, quindi sono <b>lo stesso stato</b> — e il secondo è il rappresentante normalizzato, l&rsquo;unico di lunghezza $1$ in quella direzione a meno di segno. L&rsquo;unico punto che non appartiene a nessuno stato è l&rsquo;origine: il ket nullo, che è dove le due rette si incontrano e dove nessuno stato vive. <b>Che cosa impararne.</b> Che la domanda «quanto vale la funzione d&rsquo;onda» è mal posta finché non si è fissata una normalizzazione, e che la domanda «qual è la sua fase» resta mal posta anche dopo. In questa figura reale la libertà residua è solo il segno; nello spazio complesso vero è un intero cerchio di fasi $e^{i\gamma}$, ed è esattamente altrettanto invisibile.</p>`},
  {t:'reveal', title:'Raggio, vettore, operatore: che cosa i testi chiamano stato', tag:'formalismi', steps:[
   {label:'Tre oggetti per la stessa cosa', body:R`
   <p>Il primo postulato non è scritto allo stesso modo nei testi del corso. Shankar: <i>«The state of the particle is represented by a vector $|\psi(t)\rangle$ in a Hilbert space»</i>, e il raggio viene dopo, quando osserva che i multipli di un vettore danno le stesse previsioni. Le note manoscritte del professore, secondo la sintesi dei postulati preparata dall&rsquo;amico di Giuseppe, partono direttamente dai raggi: gli stati fisici <i>«sono in corrispondenza biunivoca con i raggi di uno spazio di Hilbert complesso separabile (vettori che differiscono per un fattore $\alpha\neq0$ descrivono lo stesso stato)»</i>. Ballentine sceglie un terzo oggetto, l&rsquo;operatore di stato: <i>«To each state there corresponds a unique state operator»</i>, e il valor medio di $R$ è $\mathrm{Tr}(\rho R)/{\mathrm{Tr}}\,\rho$. Von Neumann, nel 1932, lo chiamava operatore statistico; Picasso e Dirac partono dal principio di sovrapposizione.</p>`},
   {label:'Perché l operatore contiene il raggio', body:R`
   <p>L&rsquo;operatore di stato di uno stato puro è il proiettore $\rho=|\psi\rangle\langle\psi|$, e non cambia se si moltiplica $|\psi\rangle$ per una fase: $e^{i\theta}|\psi\rangle\langle\psi|e^{-i\theta}$ è lo stesso operatore. La scelta di Ballentine incorpora quindi l&rsquo;osservazione del raggio senza bisogno di enunciarla, e in più descrive le miscele, che un vettore non descrive. Per $|\psi\rangle=(1,i)/\sqrt2$ si verifica che $\rho^{2}=\rho$ e che la traccia è uno, le due condizioni che distinguono uno stato puro.</p>`},
   {label:'Che cosa descrive lo stato', body:R`
   <p>Lo stesso oggetto matematico riceve letture diverse, e la sintesi le mette in colonna. Per la lettura di Copenhagen dei manuali lo stato descrive il singolo sistema, ed è completo. Per Ballentine descrive un insieme, la procedura di preparazione, e il valor medio è letteralmente una media su molte ripetizioni. Per i molti mondi lo stato universale <i>«è tutto ciò che esiste»</i>; per l&rsquo;onda pilota è incompleto e va accompagnato dalle posizioni; per il QBism è un insieme di credenze di un agente. Nessuna di queste letture cambia un conto di questo movimento: cambiano la risposta alla domanda «che cosa sta succedendo», non le previsioni.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Se uno stato è un raggio e non un vettore, perché tutti i libri scrivono $|\psi\rangle$ e non la classe di equivalenza dei suoi multipli?`,
    a:R`Perché lavorare con il rappresentante è <b>incomparabilmente più comodo</b>, e la convenzione di normalizzare a $1$ elimina la parte scomoda dell&rsquo;ambiguità lasciandone in piedi una sola — la fase globale — che non entra mai nelle previsioni. La struttura corretta è lo <i>spazio proiettivo</i> associato a $\mathcal H$, e nessuno ci calcola dentro perché le operazioni lineari (somma, azione di un operatore) non sono definite sui raggi: $|A\rangle+|B\rangle$ dipende dai rappresentanti scelti, e questo non è un difetto della notazione ma il contenuto fisico della <b>fase relativa</b>. Si usano i vettori proprio perché la somma esista, e si ricorda che la lunghezza non significa niente. La trappola d&rsquo;esame sta nell&rsquo;altra metà: <i>sommare</i> due stati normalizzati non dà un vettore normalizzato — $\tfrac{1}{\sqrt2}(|A\rangle+|B\rangle)$ ha norma $1$ solo se i due sono ortogonali — e chi normalizza per riflesso invece che per conto sbaglia la probabilità.`},
   {q:R`Dirac dice che il ket nullo non corrisponde a nessuno stato. Ma nel caso $c_1+c_2=0$ la sovrapposizione <i>produce</i> il ket nullo. Qual è, allora, lo stato del sistema?`,
    a:R`La domanda è mal posta, e il motivo è fisico. Il caso $c_1+c_2=0$ non descrive un sistema preparato in un certo modo: descrive una <b>combinazione di preparazioni che non si realizza</b>. Nell&rsquo;esperimento è il punto di frangia scura — dove la probabilità di arrivo è zero, cioè dove il quanto non arriva mai. Non c&rsquo;è «uno stato con probabilità nulla di esistere»: c&rsquo;è un&rsquo;ampiezza che si annulla per interferenza, e un&rsquo;ampiezza nulla non è un evento improbabile ma un evento <i>assente</i>. La differenza si vede nei conti: se il ket nullo fosse uno stato, si potrebbe normalizzarlo dividendo per la sua norma, che è zero. La teoria vieta quella divisione, ed è lo stesso divieto in forma algebrica.`}
  ]}
]},

/* ---------------- 02 · IL PRODOTTO INTERNO, E COSA COSTRINGE ---------------- */
{ num:'02', title:'Il prodotto interno, e che cosa costringe', meta:'gli assiomi di von Neumann · hermitianità e linearità su lati opposti · Schwarz come parabola · norma, ortogonalità, normalizzazione',
  blocchi:[
  {t:'prosa', title:'Perché lo spazio vettoriale non basta', tag:'costruzione', html:R`
  <p>Uno spazio vettoriale sa sommare e scalare, e non sa altro. In particolare non sa dire <i>quanto</i> è lungo un vettore né <i>quanto</i> due vettori sono allineati — e noi quelle due cose ci servono entrambe, per un motivo che non è matematico: la previsione fisica del movimento precedente è il modulo quadro di un&rsquo;ampiezza, e l&rsquo;ampiezza di passare dallo stato $|A\rangle$ allo stato $|B\rangle$ è un numero che dipende da entrambi. Picasso lo registra in una riga, come secondo requisito dopo la sovrapposizione: «al fine di dare un carattere predittivo alla teoria è necessario che lo spazio $\mathcal H$ sia dotato di un <b>prodotto scalare hermitiano</b>».</p>
  <p>Vale la pena notare l&rsquo;ordine logico, perché è quello del programma di questo corso e non quello dell&rsquo;intuizione geometrica. Non si parte dalla geometria («nello spazio ordinario c&rsquo;è un prodotto scalare, generalizziamolo») ma dal requisito predittivo: serve un numero da cui estrarre probabilità, e quel numero deve dipendere da due stati. La geometria arriva <i>dopo</i>, come regalo — e Griffiths lo dice al rovescio nella sua presentazione, chiamando il prodotto interno «generalizzazione del prodotto scalare in tre dimensioni». Entrambe le strade portano allo stesso oggetto, ma solo la prima spiega perché il prodotto deve essere <i>hermitiano</i> e non simmetrico.</p>`},
  {t:'reveal', title:'Gli assiomi, nella forma in cui li scrive von Neumann', tag:'costruzione', steps:[
   {label:'Assioma A e assioma B', body:R`
   <p>von Neumann apre il capitolo II dichiarando il programma — «definire lo spazio di Hilbert, che fornisce la base matematica per il trattamento della meccanica quantistica» — e poi procede per assiomi numerati. I primi due sono quelli che ci servono subito.</p>
   <p><b>A. $R$ è uno spazio lineare.</b> Cioè: sono definite una somma $f+g$ e una moltiplicazione per scalari complessi $af$, i risultati stanno ancora in $R$, e $R$ ha un elemento nullo. Da qui seguono le regole consuete (commutativa, associativa, distributiva), e von Neumann le deriva una per una con una pedanteria che vale notare: dedica mezza pagina a dimostrare che $f+0=f$, scrivendo $f+0=1\cdot f+0\cdot f=(1+0)\cdot f=f$. Poi si interrompe da sé: «non vale la pena di proseguire ulteriormente in queste questioni». Il senso di quella mezza pagina è che <i>tutto</i> va dimostrato dagli assiomi, anche l&rsquo;ovvio, e che la fisica non ha voce in capitolo su quali regole algebriche valgano.</p>
   <p><b>B. In $R$ è definito un prodotto interno hermitiano.</b> È il nostro oggetto, e von Neumann ne elenca le proprietà in questa forma esatta (con il prodotto scritto $(f,g)$, lineare nel <i>primo</i> argomento):</p>
   $$(f'+f'',g)=(f',g)+(f'',g),\qquad (a\cdot f,g)=a\,(f,g)$$
   $$(f,g)=\overline{(g,f)}\quad\text{(simmetria hermitiana)},\qquad (f,f)\ge 0,\ =0\text{ solo se } f=0$$
   <p>Dalle due proprietà del primo fattore e dalla simmetria hermitiana seguono quelle del secondo, scambiando $f$ e $g$ e coniugando: $(f,g'+g'')=(f,g')+(f,g'')$ e $(f,a\cdot g)=\bar a\,(f,g)$.</p>`},
   {label:'La convenzione opposta, e perché va dichiarata', body:R`
   <p><b>Qui le fonti si dividono, ed è una trappola d&rsquo;esame vera.</b> von Neumann mette la linearità nel <i>primo</i> argomento e l&rsquo;antilinearità nel secondo. Ballentine fa l&rsquo;opposto, e lo dice: «diciamo che il prodotto interno è lineare nel suo secondo argomento, e antilineare nel suo primo argomento». La convenzione moderna, quella dei fisici e quella che useremo, è la seconda — e la ragione è che vuole combaciare con la scrittura di Dirac, dove il bra sta a sinistra e il ket a destra:</p>
   $$\langle B|\{c|A\rangle\}=c\,\langle B|A\rangle,\qquad \{c\langle B|\}|A\rangle=c\,\langle B|A\rangle\ \text{ ma }\ \langle cB|A\rangle=\bar c\,\langle B|A\rangle$$
   <p>Cioè: il prodotto $\langle B|A\rangle$ è lineare in $|A\rangle$ e antilineare in $|B\rangle$. Il modo di non sbagliarsi mai non è ricordare la convenzione, è ricordare <b>da dove viene l&rsquo;antilinearità</b>: la coniugazione entra perché il bra corrispondente a $c|A\rangle$ è $\bar c\langle A|$, e questo lo si vedrà costruire in tappa 03. Chi ricorda la costruzione ricava la convenzione; chi ricorda solo la convenzione, davanti a un libro che usa l&rsquo;altra, si perde.</p>
   <p>Una differenza di notazione, non di sostanza, va segnalata nello stesso respiro perché compare in Picasso e in nessun testo inglese: Picasso scrive l&rsquo;aggiunto con la croce, $\eta^{\dagger}$, e lo motiva — «normalmente i matematici scrivono $\eta^{*}$ anziché $\eta^{\dagger}$, mentre noi riserviamo l&rsquo;asterisco per la coniugazione complessa dei numeri». È una scelta buona e la adottiamo: l&rsquo;asterisco è per i numeri, la croce per gli operatori. Confonderle produce esattamente l&rsquo;errore di scrivere $(|\psi\rangle)^{\dagger}$, su cui Ballentine mette in guardia e che discutiamo in tappa 07.</p>`}
  ]},
  {t:'reveal', title:'Dalla norma alla disuguaglianza di Schwarz, con la dimostrazione di von Neumann', tag:'costruzione', steps:[
   {label:'La norma, e la distanza', body:R`
   <p>Il prodotto interno serve, dice von Neumann, «perché rende possibile la definizione di lunghezza». La definizione è la sua <b>definizione 3</b>: la grandezza di un elemento $f$ è $\|f\|=\sqrt{(f,f)}$, e la distanza fra $f$ e $g$ è $\|f-g\|$. Che questa sia una distanza vera — cioè che soddisfi la disuguaglianza triangolare — non è ovvio, e per dimostrarlo serve prima un altro risultato, che von Neumann enuncia come <b>teorema 1</b>:</p>
   $$|(f,g)|\le \|f\|\cdot\|g\|$$
   <p>È la <span class="str" data-str="disuguaglianza-di-schwarz">disuguaglianza di Cauchy-Schwarz</span>, e in questo corso non è un lemma tecnico: è la disuguaglianza da cui nasce il principio di indeterminazione, perché applicata agli scarti di due osservabili dà un limite inferiore al prodotto delle loro varianze. Vale la pena vedere come la dimostra lui, perché la sua strada è la più corta e la più visualizzabile.</p>`},
   {label:'La dimostrazione: un quadrato che non può essere negativo', body:R`
   <p>Il primo passo è un&rsquo;identità algebrica, che von Neumann scrive così:</p>
   $$\|f-g\|^2=\|f\|^2+\|g\|^2-2\operatorname{Re}(f,g)\ \ge 0$$
   <p>e la giustificazione del $\ge 0$ è l&rsquo;ultimo assioma di $B$: $(f-g,f-g)\ge 0$ per ogni vettore, e in particolare per $f-g$. Che l&rsquo;identità sia vera lo si verifica in componenti: con $f=a_1+ia_2$ e $g=b_1+ib_2$ in una dimensione complessa si ha $\|f\|^2=a_1^2+a_2^2$, $\|g\|^2=b_1^2+b_2^2$, $\operatorname{Re}(f,g)=a_1b_1+a_2b_2$, e il membro di sinistra è $(a_1-b_1)^2+(a_2-b_2)^2$. I due membri coincidono per ogni scelta reale delle quattro componenti.</p>
   <p>Da qui segue $\operatorname{Re}(f,g)\le\tfrac12(\|f\|^2+\|g\|^2)$, che è già una disuguaglianza utile ma non è ancora Schwarz. Il passaggio che la rende Schwarz è <b>sfruttare la libertà di riscalare</b>: la stessa disuguaglianza vale sostituendo $f\to tf$ con $t$ reale, e si può scegliere il $t$ che la rende più stretta. Mettiamo dei nomi: $a=\|f\|^2$, $b=\operatorname{Re}(f,g)$, $c=\|g\|^2$, e consideriamo</p>
   $$q(t)=\|f-tg\|^2=a-2bt+ct^{2}\ \ge 0\qquad\text{per ogni } t \text{ reale}$$
   <p>Questa è una <b>parabola in $t$</b>, con la concavità verso l&rsquo;alto perché $c=\|g\|^2>0$, e l&rsquo;ipotesi è che non scenda mai sotto l&rsquo;asse. Il suo minimo sta in $t=b/c$, e il valore nel minimo è</p>
   $$q\!\left(\frac bc\right)=a-\frac{b^{2}}{c}$$
   <p>Imporre che questo sia $\ge 0$ dà $b^{2}\le ac$, cioè $\big(\operatorname{Re}(f,g)\big)^2\le\|f\|^2\|g\|^2$. Per ottenere il modulo intero e non solo la parte reale basta rifare il conto con $t$ complesso, o equivalentemente assorbire la fase di $(f,g)$ in $g$ — che si può fare perché, come abbiamo visto in tappa 01, una fase non cambia la norma. Risultato: $|(f,g)|^2\le\|f\|^2\|g\|^2$.</p>`},
   {label:'Quando vale l’uguaglianza, e perché è la parte che serve', body:R`
   <p>La parabola dice anche <i>quando</i> la disuguaglianza è stretta e quando è un&rsquo;uguaglianza, e questa è la metà del risultato che si dimentica e che poi serve. L&rsquo;uguaglianza $b^2=ac$ significa che il minimo della parabola <b>tocca lo zero</b>, cioè che esiste un $t$ per cui $\|f-tg\|=0$, cioè — per l&rsquo;ultimo assioma di $B$, «$=0$ solo se $f=0$» — che $f=tg$. Ballentine lo enuncia esattamente così per entrambe le disuguaglianze: «in entrambi i casi l&rsquo;uguaglianza vale solo se un vettore è un multiplo scalare dell&rsquo;altro, cioè $\psi=c\phi$», e aggiunge la finezza che per la triangolare lo scalare «deve essere reale e positivo».</p>
   <p>Tradotto in fisica, e questo è il motivo per cui la condizione di uguaglianza conta: $|\langle\phi|\psi\rangle|^2=\langle\phi|\phi\rangle\langle\psi|\psi\rangle$ vuol dire che i due stati sono <b>lo stesso stato</b> (sono proporzionali, dunque lo stesso raggio), e quindi che la probabilità di transizione è $1$. All&rsquo;estremo opposto, $\langle\phi|\psi\rangle=0$ definisce l&rsquo;ortogonalità e dà probabilità $0$. La disuguaglianza di Schwarz è dunque, in questo corso, l&rsquo;asserzione che <b>una probabilità non può superare uno</b>: non un teorema di geometria, un vincolo di consistenza.</p>
   <p>Un controllo numerico, perché la disuguaglianza non resti una formula. In $\mathbb C^2$ prendiamo $|\psi\rangle=(1,i)$ e $|\phi\rangle=(1,1)$. Allora $\langle\psi|\phi\rangle=\bar 1\cdot 1+\bar i\cdot 1=1-i$, e</p>
   $$|\langle\psi|\phi\rangle|^2=|1-i|^{2}=2,\qquad \langle\psi|\psi\rangle\langle\phi|\phi\rangle=2\cdot 2=4$$
   <p>dunque $2\le 4$: la disuguaglianza è stretta, e deve esserlo, perché $(1,i)$ e $(1,1)$ non sono proporzionali. La probabilità di transizione fra i due stati normalizzati è $2/4=\tfrac12$.</p>`}
  ]},
  {t:'plot', title:'Schwarz è una parabola che non scende sotto zero',
   intro:R`Le due curve sono $q(t)=\|f-tg\|^2=a-2bt+ct^2$ per due coppie di vettori diverse. <b>In blu</b> una coppia non proporzionale: $a=2$, $b=\tfrac32$, $c=2$, cioè $q(t)=2-3t+2t^2$, il cui minimo vale $2-\tfrac94\cdot\tfrac12=0{,}875$ e sta sopra l&rsquo;asse. <b>In arancio</b> una coppia proporzionale: $a=2$, $b=2$, $c=2$, cioè $q(t)=2(t-1)^2$, che <i>tocca</i> lo zero in $t=1$ — lì $f=g$.`,
   plots:[
    {kind:'func2d', xr:[-0.4,2.4], yr:[-0.3,3.2], height:330, ticks:6,
     title:'q(t) = ‖f − t g‖²',
     curves:[
      {f:'2-3*x+2*x*x', col:'#4c8dff', width:2.6, label:'non proporzionali: min > 0'},
      {f:'2-4*x+2*x*x', col:'#ff8a5c', width:2.6, label:'proporzionali: min = 0'},
      {f:'0', col:'#6bdc9b', width:1.6, label:'la soglia: q ≥ 0'}
     ],
     xlabel:'t  (quanto di g si sottrae a f)', ylabel:'norma quadra del resto'}
   ],
   leggi:R`<p><b>Che cosa guardare.</b> Che nessuna delle due parabole scende sotto la retta verde, e che una delle due la <i>tocca</i>. Il fatto che il minimo sia $\ge 0$ è l&rsquo;assioma $(f,f)\ge0$; il valore del minimo è $a-b^2/c$; imporre che sia non negativo <b>è</b> la disuguaglianza di Schwarz, $b^2\le ac$. Il discriminante delle due parabole è rispettivamente $9-16=-7$ (nessuna radice reale: disuguaglianza stretta) e $16-16=0$ (radice doppia: uguaglianza). <b>Che cosa impararne.</b> Che Schwarz non è una disuguaglianza da memorizzare ma la condizione di segno di un discriminante, e che il caso di uguaglianza non è un caso patologico da escludere: è il caso in cui i due stati <i>coincidono</i>, cioè la probabilità di transizione vale uno. Il punto $t$ del minimo, $t=b/c$, è la componente di $f$ lungo $g$: la parabola misura quanto resta di $f$ dopo averne tolta la proiezione, ed è il conto che in tappa 04 diventerà il coefficiente di Fourier.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`La dimostrazione usa $q(t)=\|f-tg\|^2\ge0$ per ogni $t$ <b>reale</b>, ma il prodotto interno è complesso. Dove è finito il fatto che $t$ potrebbe essere complesso, e che cosa si perde a non usarlo?`,
    a:R`Con $t$ reale si dimostra solo $\big(\operatorname{Re}(f,g)\big)^2\le\|f\|^2\|g\|^2$, cioè Schwarz per la <b>parte reale</b>. Con $t$ complesso la parabola diventa $q(t)=a-2\operatorname{Re}\!\big(\bar t\,(g,f)\big)+|t|^2c$, e scegliendo $t=(g,f)/c$ — cioè allineando la fase di $t$ a quella del prodotto interno — si ottiene il minimo $a-|(f,g)|^2/c$, da cui la forma piena. Equivalentemente, e più in fretta: si sostituisce $g\to e^{i\theta}g$ con $\theta$ scelto in modo che $(f,e^{i\theta}g)$ sia reale positivo, operazione lecita perché <i>una fase non cambia la norma</i> — la libertà di tappa 01 usata come strumento di calcolo. Non si perde niente di essenziale, ma si perde il risultato che serve per l&rsquo;indeterminazione: lì il contributo decisivo è la parte <b>immaginaria</b> del prodotto interno, perché è quella che contiene il commutatore. Una Schwarz dimostrata solo sulla parte reale non produce il principio di indeterminazione.`},
   {q:R`Gli assiomi chiedono $(f,f)\ge0$ con uguaglianza <i>solo</i> se $f=0$. Che cosa si romperebbe in fisica se esistesse un vettore non nullo con $(f,f)=0$?`,
    a:R`Si romperebbe la possibilità di normalizzare, e quindi di estrarre probabilità. Un vettore con norma nulla e non nullo non si può dividere per la sua norma, dunque non ha un rappresentante normalizzato, dunque i $|a_i|^2$ dello sviluppo in tappa 04 non si possono interpretare come probabilità perché non si possono far sommare a uno. Peggio: Schwarz degenererebbe — con $\|g\|=0$ si avrebbe $|(f,g)|\le0$ per ogni $f$, cioè $g$ ortogonale a tutto, il che per il criterio di completezza di von Neumann significa $g=0$. L&rsquo;assioma non è un&rsquo;ipotesi tecnica ma la richiesta che <b>la lunghezza sia non degenere</b>, e la fisica che ci poggia è l&rsquo;esistenza della regola di Born. Nota che spazi con una «metrica» degenere o indefinita esistono e si usano — la segnatura di Minkowski in relatività è indefinita — ma lì non si costruiscono probabilità, e si vede dall&rsquo;assioma che cade.`}
  ]}
]},

/* ---------------- 03 · IL BRA: FUNZIONALE LINEARE, RIESZ, E L'IPOTESI DI DIRAC ---------------- */
{ num:'03', title:'Il bra: funzionale lineare, Riesz, e l’ipotesi di Dirac', meta:'il duale costruito da Dirac · la regola delle parentesi · il teorema di Riesz dimostrato · l’ipotesi che non serviva',
  blocchi:[
  {t:'prosa', title:'La mossa di Dirac: una funzione lineare a valori numerici', tag:'costruzione', html:R`
  <p>Abbiamo i ket e abbiamo il prodotto interno. Si potrebbe fermarsi qui: tutto il formalismo si scrive con $(f,g)$ alla von Neumann, e molti libri di matematica fanno così. Dirac fa invece un&rsquo;operazione in più, e il motivo per cui vale la pena capirla è che è quella che produce la notazione — cioè l&rsquo;unica parte di questo movimento che si userà letteralmente ogni giorno per i prossimi quattro mesi.</p>
  <p>La sua apertura del paragrafo 6 è questa: «Quando in una teoria matematica abbiamo un insieme arbitrario di vettori, possiamo sempre costruirne un secondo, chiamato dai matematici insieme <b>duale</b>. Descriveremo tale procedimento nel caso che l&rsquo;insieme iniziale sia quello dei nostri ket». E la costruzione è: si consideri una <i>variabile numerica</i> $\varphi$ che sia funzione di un ket — cioè una regola che a ogni $|A\rangle$ associa un numero — e si supponga che tale funzione sia <b>lineare</b>, nel senso che il valore su $|A\rangle+|A'\rangle$ è la somma dei valori e il valore su $c|A\rangle$ è $c$ volte il valore.</p>
  <p>«Allora — continua Dirac — il valore di $\varphi$ corrispondente a un certo $|A\rangle$ può essere riguardato come il <i>prodotto scalare</i> di $|A\rangle$ per un nuovo vettore: di tali nuovi vettori ne esiste uno per ogni funzione lineare dei vettori ket». E li battezza: «Noi chiameremo i nuovi vettori <b>vettori bra</b>, o semplicemente bra, e denoteremo il generico di essi con il simbolo $\langle\ |$, <i>immagine speculare</i> di quello usato per i ket».</p>
  <p>Fermiamoci sul <b>contenuto</b> di questa definizione, perché è il punto che la notazione poi nasconde. Un bra non è «un ket girato» e non è «un ket coniugato»: è una <b>macchina che mangia un ket e restituisce un numero</b>. Che poi questa macchina si possa rappresentare con un vettore è un fatto non ovvio — è il teorema di Riesz, e Dirac in questa pagina non lo dimostra, lo dichiara plausibile («la giustificazione di questo modo di considerare $\varphi$ sta nel fatto che i nuovi vettori possono venir sommati tra loro e moltiplicati per dei numeri per darne altri dello stesso tipo»). Ballentine, cinquant&rsquo;anni dopo, lo dimostra. Le due pagine, messe una accanto all&rsquo;altra, sono una lezione su che cosa significhi rendere rigorosa una teoria fisica.</p>`},
  {t:'reveal', title:'La regola delle parentesi: una sintassi, non un gioco di parole', tag:'costruzione', steps:[
   {label:'Il simbolo, e la contrazione delle due barre', body:R`
   <p>Dirac prosegue: «se ne specifichiamo uno con una lettera $B$, inseriremo tale lettera in mezzo al simbolo e scriveremo $\langle B|$. Il prodotto scalare di un vettore bra $\langle B|$ e di un vettore ket $|A\rangle$ verrà scritto $\langle B|A\rangle$, cioè ponendo contigui i simboli di vettore bra e vettore ket — con quello di bra a sinistra — e <b>contraendo per brevità in una sola le due linee verticali</b>».</p>
   <p>È una banalità tipografica con una conseguenza enorme, perché rende la scrittura <i>autocontrollante</i>. Dirac la enuncia come regola, e vale ricordarla alla lettera perché è l&rsquo;unico controllo sintattico che il formalismo offre:</p>
   <p style="padding-left:1.2em;border-left:3px solid rgba(120,160,255,.45)"><i>«Si possono riguardare i due simboli $\langle$ e $\rangle$ come un particolare tipo di parentesi. Un prodotto scalare $\langle B|A\rangle$ appare ora come un&rsquo;espressione completa in parentesi, mentre i vettori bra $\langle B|$ e ket $|A\rangle$ risultano espressioni incomplete. Possiamo quindi enunciare la seguente regola: <b>qualunque espressione costituita da parentesi complete rappresenta un numero</b>, mentre qualunque espressione contenente parentesi incomplete rappresenta un vettore bra o ket secondo che contenga la prima o la seconda parte della parentesi.»</i> — Dirac, pag. stampata 26</p>
   <p>Questa regola è la ragione pratica per cui la notazione di Dirac ha vinto su ogni alternativa. Guardando un&rsquo;espressione si sa <i>di che tipo</i> è l&rsquo;oggetto che rappresenta, senza pensarci: $\langle B|\hat A|C\rangle$ ha parentesi complete, è un numero. $\hat A|C\rangle$ è un ket. $|\psi\rangle\langle\phi|$ ha due parentesi incomplete e non è né l&rsquo;uno né l&rsquo;altro: è un <b>operatore</b>, e vedremo in tappa 07 che la notazione lo dice da sé. Un errore di tipo — un numero scritto dove serviva un vettore — in notazione di Dirac si vede a occhio; in notazione $(f,g)$ no.</p>`},
   {label:'Le definizioni formali, e quando un bra è nullo', body:R`
   <p>Dirac completa la costruzione dichiarando quando due bra sono uguali e come si combinano, e lo fa sempre nello stesso modo: <b>un bra è definito da ciò che fa ai ket</b>. Le sue equazioni, con i numeri che lui dà loro:</p>
   $$\langle B|\{|A\rangle+|A'\rangle\}=\langle B|A\rangle+\langle B|A'\rangle\qquad [6.1]$$
   $$\langle B|\{c|A\rangle\}=c\langle B|A\rangle\qquad [6.2]$$
   <p>e poi la condizione di esistenza: «Un vettore bra si considera completamente definito quando venga assegnato il suo prodotto scalare con ogni vettore ket in modo che, se per un dato bra risulta nullo il suo prodotto scalare con ogni ket, esso stesso deve considerarsi nullo». In simboli: se $\langle P|A\rangle=0$ per ogni $|A\rangle$, allora $\langle P|=0$. Questo criterio si usa continuamente senza accorgersene — ogni volta che si dimostra un&rsquo;identità operatoriale mostrando che vale su un ket arbitrario, si sta usando questo.</p>
   <p>Somma e moltiplicazione per numeri si definiscono allo stesso modo, <i>per via del loro effetto</i>: $\{\langle B|+\langle B'|\}|A\rangle=\langle B|A\rangle+\langle B'|A\rangle$ (equazione [6.4] di Dirac) e $\{c\langle B|\}|A\rangle=c\langle B|A\rangle$ ([6.5]). Dirac commenta che le [6.1] e [6.4] «mostrano che i prodotti di vettori bra e ket soddisfano la proprietà distributiva della moltiplicazione»: cioè la notazione, scelta in modo che il prodotto scalare <i>somigli</i> a una moltiplicazione, si comporta davvero come una moltiplicazione. Non era garantito, ed è ciò che la rende utile.</p>`},
   {label:'L’ipotesi, e il suo nome esatto', body:R`
   <p>E ora il punto delicato. Dirac osserva, con onestà che conviene registrare: «I vettori bra, così come sono stati introdotti, risultano di tipo alquanto diverso dai ket e <b>non hanno con questi, almeno per ora, alcuna connessione</b> eccetto che per l&rsquo;esistenza di un prodotto scalare tra bra e ket». Fin qui sono due insiemi distinti, legati da un accoppiamento. E poi fa il passo:</p>
   <p style="padding-left:1.2em;border-left:3px solid rgba(255,150,100,.5)"><i>«Supponiamo ora che esista una corrispondenza biunivoca fra i bra e i ket, tale che il bra corrispondente ad $|A\rangle+|A'\rangle$ sia la somma dei bra corrispondenti rispettivamente ad $|A\rangle$ e ad $|A'\rangle$, mentre quello corrispondente a $c|A\rangle$ sia $\bar c$ volte quello corrispondente ad $|A\rangle$. Useremo poi la stessa lettera per indicare un ket e il corrispondente bra: così il bra corrispondente ad $|A\rangle$ verrà scritto $\langle A|$.»</i> — Dirac, pag. stampata 27</p>
   <p>Il verbo è «supponiamo». Non «dimostriamo»: e non è pigrizia, perché Dirac non ha, nel 1930, lo strumento per dimostrarlo. Notare la <b>coniugazione</b> nel coefficiente — il bra di $c|A\rangle$ è $\bar c\langle A|$ — che è l&rsquo;origine esatta dell&rsquo;antilinearità discussa in tappa 02: non una convenzione, la struttura della corrispondenza.</p>
   <p>Da questa ipotesi Dirac ricava le due proprietà che si usano ogni giorno. La prima: dati due ket si può formare il numero $\langle B|A\rangle$ «prendendo il prodotto scalare del primo per l&rsquo;immaginario coniugato del secondo», e supponendo che i due modi di formarlo coincidano si ottiene $\langle B|A\rangle=\overline{\langle A|B\rangle}$ (la sua [6.6]). La seconda, ponendo $|B\rangle=|A\rangle$: «si trova che il numero $\langle A|A\rangle$ deve essere reale», e si assume inoltre $\langle A|A\rangle>0$ tranne se $|A\rangle=0$ (la [6.7]). Sono gli assiomi $B$ di von Neumann, ricavati per questa strada invece che postulati.</p>
   <p>Una nota terminologica di Dirac che quasi nessuno riporta e che spiega un&rsquo;oscurità: lui <b>non</b> chiama «complesso coniugato» il bra corrispondente a un ket, lo chiama «<i>immaginario coniugato</i>». La ragione è precisa: «vettori bra e ket sono di natura diversa e non possono essere sommati insieme», quindi il metodo usuale per estrarre la parte reale — mezza somma di una quantità e della sua coniugata — qui non si applica. Riserva «complesso coniugato» per i numeri. È la stessa igiene notazionale per cui Picasso riserva l&rsquo;asterisco ai numeri e la croce agli operatori.</p>`}
  ]},
  {t:'reveal', title:'Il teorema di Riesz: ciò che Dirac supponeva, dimostrato', tag:'costruzione', steps:[
   {label:'L’enunciato, e cosa promette', body:R`
   <p>Ballentine riprende la cosa dall&rsquo;altro capo. Definisce prima il <b>funzionale lineare</b> — «un funzionale lineare $F$ assegna uno scalare $F(\phi)$ a ogni vettore $\phi$» con $F(a\phi+b\psi)=aF(\phi)+bF(\psi)$ — osserva che l&rsquo;insieme dei funzionali è esso stesso uno spazio lineare $V'$, che si chiama <b>duale</b>, e poi enuncia:</p>
   <p style="padding-left:1.2em;border-left:3px solid rgba(120,160,255,.45)"><b>Teorema di Riesz.</b> <i>C&rsquo;è una corrispondenza biunivoca fra i funzionali lineari $F$ in $V'$ e i vettori $f$ in $V$, tale che tutti i funzionali lineari hanno la forma $F(\phi)=(f,\phi)$, con $f$ vettore fissato e $\phi$ vettore arbitrario. Dunque gli spazi $V$ e $V'$ sono essenzialmente isomorfi.</i></p>
   <p>Questo è il contenuto esatto dell&rsquo;ipotesi di Dirac, in forma di teorema. E la differenza fra un&rsquo;ipotesi e un teorema è che il teorema porta con sé le <b>condizioni</b> in cui vale — e quindi anche quelle in cui non vale, che sono l&rsquo;argomento della tappa 08.</p>`},
   {label:'La dimostrazione, in dimensione finita, per costruzione', body:R`
   <p>Ballentine dimostra il teorema «in un modo che ignora le questioni di convergenza che nascono trattando spazi di dimensione infinita», e lo dice — le rimanda al suo paragrafo 1.4. La dimostrazione è per <b>costruzione esplicita</b>, e vale seguirla perché si vede da dove viene la coniugazione.</p>
   <p>Un verso è banale: dato $f$, la formula $F(\phi)=(f,\phi)$ <i>definisce</i> un funzionale lineare. Resta da costruire, per un funzionale arbitrario $F$, un unico $f$ che lo rappresenti. Sia $\{\phi_n\}$ una base ortonormale, $(\phi_n,\phi_m)=\delta_{nm}$, e sia $\psi=\sum_n x_n\phi_n$ un vettore arbitrario. Dalla linearità,</p>
   $$F(\psi)=\sum_n x_n\,F(\phi_n)$$
   <p>Ora si costruisce il vettore candidato prendendo i <b>coniugati</b> dei valori che $F$ assume sulla base:</p>
   $$f=\sum_n \big[F(\phi_n)\big]^{*}\phi_n$$
   <p>e si calcola il suo prodotto interno con $\psi$. Nella convenzione di Ballentine il prodotto è antilineare nel primo argomento, quindi i coniugati si coniugano di nuovo e tornano i valori originali:</p>
   $$(f,\psi)=\sum_n F(\phi_n)\,x_n=F(\psi)$$
   <p>«e dunque il teorema è dimostrato». Il doppio coniugio è tutta la dimostrazione: la coniugazione va messa nella costruzione di $f$ <i>esattamente</i> perché il prodotto interno la rimetterà, e questo è il senso meccanico dell&rsquo;antilinearità.</p>
   <p>Un caso concreto, per vedere che il conto chiude. In $\mathbb C^2$ con base $\phi_1,\phi_2$, sia $F$ il funzionale con $F(\phi_1)=2$ e $F(\phi_2)=3i$. La costruzione dà $f=\bar 2\,\phi_1+\overline{3i}\,\phi_2=2\phi_1-3i\,\phi_2$. Prendendone il prodotto interno con $\psi=x_1\phi_1+x_2\phi_2$, i coefficienti di $f$ si coniugano una seconda volta:</p>
   $$(f,\psi)=\overline{2}\,x_1+\overline{(-3i)}\,x_2=2x_1+3ix_2$$
   <p>che è esattamente $x_1F(\phi_1)+x_2F(\phi_2)$. Il funzionale e il vettore sono due facce della stessa cosa, e la faccia che si vede dipende solo da quale metà della parentesi si scrive.</p>`},
   {label:'Il battesimo moderno, e la critica a Dirac', body:R`
   <p>Solo a questo punto Ballentine introduce la notazione, e la introduce come <i>nome</i> di oggetti già costruiti: «Nella notazione di Dirac i vettori in $V$ sono chiamati vettori <b>ket</b> e denotati $|\phi\rangle$. I funzionali lineari nello spazio duale $V'$ sono chiamati vettori <b>bra</b> e denotati $\langle F|$. Il valore numerico del funzionale è denotato $F(\phi)=\langle F|\phi\rangle$». E poi, con il teorema in mano, giustifica l&rsquo;abuso di linguaggio che Dirac si era concesso: «Secondo il teorema di Riesz c&rsquo;è una corrispondenza biunivoca fra bra e ket. Perciò <b>possiamo</b> usare lo stesso carattere alfabetico per il funzionale e per il vettore a cui corrisponde, affidandoci alla notazione bra o ket per determinare a quale spazio ci si riferisce».</p>
   <p>Nota però l&rsquo;avvertimento che Ballentine mette subito dopo, e che è il motivo per cui questa tappa esiste invece di essere una riga: «a causa della relazione $\langle F|\phi\rangle=(F,\phi)$ è possibile riguardare il “braket” $\langle F|\phi\rangle$ come <i>semplicemente un&rsquo;altra notazione per il prodotto interno</i>. Ma il lettore è avvisato che <b>ci sono situazioni in cui è importante ricordare che la definizione primaria del vettore bra è come funzionale lineare sullo spazio dei ket</b>». Quelle situazioni sono precisamente quelle che il programma di questo corso nomina: spettro continuo, stati non normalizzabili, autofunzioni della posizione.</p>
   <p>E infine la critica, che Ballentine mette in corpo minore e che è il ponte verso la tappa 08:</p>
   <p style="padding-left:1.2em;border-left:3px solid rgba(255,150,100,.5)"><i>«Nella sua presentazione originale, Dirac assumeva una corrispondenza biunivoca fra bra e ket, e non era del tutto chiaro se questa fosse un&rsquo;ipotesi matematica o fisica. Il teorema di Riesz mostra che non c&rsquo;è bisogno, e in effetti non c&rsquo;è spazio, per una tale ipotesi. Inoltre, dovremo prima o poi considerare spazi più generali (triplette di spazio di Hilbert equipaggiato) per i quali la corrispondenza biunivoca fra bra e ket non vale.»</i> — Ballentine, pag. stampata 11</p>
   <p>Due accuse distinte, e vanno tenute distinte. La prima: dove Dirac ipotizzava, c&rsquo;era un teorema — l&rsquo;ipotesi era <i>superflua</i>. La seconda: dove il teorema vale, vale <i>condizionatamente</i>, e fuori da quelle condizioni l&rsquo;ipotesi di Dirac è <i>falsa</i>. Ma — ed è il rovescio che rende la storia interessante — Dirac lo sapeva: a pagina 54 scrive che il suo spazio è «più generale di quello di Hilbert», cioè annuncia da sé il luogo in cui la sua ipotesi cade. Aveva ragione sul fatto che serviva uno spazio più grande, e torto sul fatto che in quello spazio la corrispondenza restasse biunivoca.</p>`}
  ]},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Che cosa si guadagna, operativamente, a pensare il bra come funzionale invece che come «ket coniugato trasposto»?`,
    a:R`Si guadagna la capacità di riconoscere quando un bra <b>esiste senza un ket corrispondente</b>, che è l&rsquo;unico caso in cui la distinzione conta e che è esattamente il caso del programma. Esempio concreto: l&rsquo;oggetto $\langle x|$ che «estrae il valore della funzione d&rsquo;onda nel punto $x$», cioè $\langle x|\psi\rangle=\psi(x)$, è un funzionale lineare perfettamente definito su ogni funzione d&rsquo;onda abbastanza regolare — ma il «ket $|x\rangle$» che gli corrisponderebbe avrebbe norma infinita, perché è la <span class="str" data-str="delta-di-dirac">delta di Dirac</span>. Pensandolo come coniugato trasposto di un vettore, si è obbligati a credere che $|x\rangle$ sia uno stato, e a non capire perché $\langle x|x\rangle$ diverga. Pensandolo come funzionale, la divergenza non è una patologia: è il fatto che il funzionale è definito su uno spazio di funzioni di prova più piccolo dello spazio di Hilbert, e che il suo rappresentante vive in uno spazio più grande. Il secondo modo di pensare costa dieci minuti in più ora e risparmia ogni confusione successiva sugli stati del continuo.`},
   {q:R`Dirac scrive che se $\langle P|A\rangle=0$ per ogni $|A\rangle$, allora $\langle P|=0$. In che senso questo è una <i>definizione</i> e non un teorema, e dove lo si usa senza accorgersene?`,
    a:R`È una definizione perché un bra, nella costruzione di Dirac, <b>non è altro che</b> la sua azione sui ket: due bra che agiscono allo stesso modo su ogni ket sono lo stesso oggetto, per lo stesso motivo per cui due funzioni che assumono gli stessi valori sono la stessa funzione. Dirac lo scrive proprio così: «un vettore bra si considera completamente definito quando venga assegnato il suo prodotto scalare con ogni vettore ket». Dove lo si usa: <b>in ogni dimostrazione di un&rsquo;identità fra operatori</b>. Quando si prova che $\hat A=\hat B$ mostrando che $\hat A|\psi\rangle=\hat B|\psi\rangle$ per ogni $|\psi\rangle$, si sta usando l&rsquo;analogo criterio per i ket; quando si prova un&rsquo;identità mostrando che $\langle\phi|\hat A|\psi\rangle=\langle\phi|\hat B|\psi\rangle$ per ogni coppia, si usano entrambi. È la ragione per cui in questo formalismo si dimostra «sandwicciando» fra un bra e un ket arbitrari: non è un trucco, è l&rsquo;unica definizione di uguaglianza disponibile.`}
  ]}
]},

/* ---------------- 04 · BASI ORTONORMALI E COMPLETEZZA ---------------- */
{ num:'04', title:'Basi ortonormali e completezza: la serie di Fourier astratta', meta:'ortogonalità dedotta dalla fisica · la dimostrazione di Picasso per assurdo · il criterio di von Neumann · Parseval, verificata',
  blocchi:[
  {t:'prosa', title:'Da dove vengono le basi: non dalla matematica, dalla misura', tag:'costruzione', html:R`
  <p>In uno spazio vettoriale astratto una base è un oggetto che si <i>sceglie</i>: qualunque insieme massimale di vettori indipendenti va bene, e nessuno è privilegiato. In meccanica quantistica le basi non si scelgono a piacere, <b>le fornisce la fisica</b> — ed è una delle cose che rende questa teoria diversa dall&rsquo;algebra lineare che le somiglia. La costruzione di Picasso è la più pulita perché è interamente fisica, e la seguiamo per intero.</p>
  <p>Sia $\xi$ un&rsquo;osservabile <b>non degenere</b>, $\xi_i$ i suoi autovalori, $|\xi_i\rangle$ i suoi autostati normalizzati — dove «autostato di $\xi$ con autovalore $\xi_i$» significa, a questo stadio e senza alcun operatore in vista, soltanto: lo stato in cui una misura di $\xi$ dà con certezza il risultato $\xi_i$. Picasso ragiona così: «la quantità $|\langle\xi_i|\xi_j\rangle|^2$ è la probabilità che per effetto di una misura si effettui una transizione da $|\xi_j\rangle$ a $|\xi_i\rangle$ o viceversa. Ma se $i\ne j$ questa probabilità è zero, in quanto una misura di $\xi$ sullo stato $|\xi_j\rangle$ darà sempre come risultato $\xi_j$, mai $\xi_i$». Dunque</p>
  $$\langle\xi_i|\xi_j\rangle=\delta_{ij}$$
  <p>cioè «gli autovettori normalizzati di un&rsquo;osservabile $\xi$ non degenere costituiscono un sistema <b>ortonormale</b> di vettori». Notare che cosa è stato usato: nessuna matematica, solo il fatto sperimentale che misurare due volte la stessa grandezza dà due volte lo stesso valore. L&rsquo;ortogonalità in meccanica quantistica <i>è</i> la mutua esclusività di due esiti di misura.</p>`},
  {t:'reveal', title:'La completezza, e le due dimostrazioni', tag:'costruzione', steps:[
   {label:'Picasso: per assurdo, dalla somma delle probabilità', body:R`
   <p>L&rsquo;ortonormalità non basta: un insieme ortonormale può essere ortonormale e <i>incompleto</i>, e allora non è una base. La dimostrazione di Picasso che il sistema è anche completo è tre righe e usa un solo ingrediente fisico, il fatto che le probabilità sommino a uno:</p>
   <p style="padding-left:1.2em;border-left:3px solid rgba(120,160,255,.45)"><i>«Ragioniamo per assurdo: se esistesse un vettore $|A\rangle$ ortogonale a tutti gli $|\xi_i\rangle$ si avrebbe $p_i=P(|A\rangle\to|\xi_i\rangle)=|\langle\xi_i|A\rangle|^2=0$ per ogni $i$, il che è assurdo perché per definizione di probabilità $\sum_i p_i=1$. Quindi: gli autovettori di $\xi$ (non degenere) costituiscono una base ortonormale.»</i> — Picasso, pag. stampata 62</p>
   <p>Si guardi la struttura dell&rsquo;argomento, perché è il modello di come questo corso deduce matematica da fisica. Un vettore ortogonale a tutti gli autostati sarebbe uno stato in cui <b>nessun esito della misura di $\xi$ ha probabilità diversa da zero</b>: misurando $\xi$ non si otterrebbe niente. Non è una contraddizione matematica, è l&rsquo;impossibilità fisica che uno strumento non dia alcuna risposta. La completezza della base non è un&rsquo;ipotesi tecnica sullo spazio: è l&rsquo;asserzione che <i>ogni misura ha un esito</i>.</p>`},
   {label:'von Neumann: lo stesso criterio, e la trappola della dimensione infinita', body:R`
   <p>von Neumann arriva allo stesso criterio dal lato matematico, e la sua formulazione vale ricordarla perché è quella che si usa per <i>verificare</i> la completezza di un sistema concreto: «che l&rsquo;insieme ortonormale sia completo significa ovviamente che non esiste alcun $f$, con $\|f\|=1$, ortogonale a tutto $O$». E osserva che la condizione di norma unitaria è inessenziale, perché un $f$ non nullo ortogonale a tutto si può sempre normalizzare: «perciò la completezza di $O$ significa che <b>ogni $f$ ortogonale all&rsquo;intero insieme deve annullarsi</b>». È letteralmente la condizione di Picasso, con «deve annullarsi» al posto di «è assurdo».</p>
   <p>Qui però von Neumann aggiunge la cosa che in dimensione finita non esiste e che è la trappola di questo corso. In dimensione $n$ il suo <b>teorema 3(n)</b> dice che ogni insieme ortonormale ha al più $n$ elementi, ed è completo <i>se e solo se</i> ne ha esattamente $n$: contare basta. In dimensione infinita il <b>teorema 3($\infty$)</b> dice molto meno — «ogni insieme ortonormale è finito o numerabile; se è completo è certamente infinito» — e von Neumann avverte: «va osservato che il numero infinito di elementi dell&rsquo;insieme è <i>necessario</i> per la sua completezza, ma, a differenza del caso $C(n)$, <b>non è sufficiente</b>». La dimostrazione del perché sta in una sua nota a piè di pagina, ed è l&rsquo;esempio più breve e più efficace che si possa dare:</p>
   <p style="padding-left:1.2em;border-left:3px solid rgba(255,150,100,.5)"><i>«Sia $\phi_1,\phi_2,\phi_3,\dots$ completo. Allora $\phi_2,\phi_3,\dots$ non è completo, ma è ancora infinito!»</i> — von Neumann, nota 49</p>
   <p>Togliere un vettore da una base infinita lascia un insieme infinito, ortonormale, e <b>non più una base</b>: manca una direzione, e quella direzione non si recupera contando. È la differenza che rende l&rsquo;algebra lineare in dimensione infinita una materia diversa, e la ragione per cui in questo corso la completezza di un sistema va sempre <i>dimostrata</i> — con il criterio di von Neumann o con l&rsquo;argomento fisico di Picasso — e mai dedotta dal fatto che i vettori «sono abbastanza».</p>
   <p>Nella stessa dimostrazione von Neumann usa un fatto che vale notare perché è una misura concreta: due elementi distinti di un insieme ortonormale hanno distanza $\|f-g\|=\sqrt2$, qualunque siano. Un insieme ortonormale è dunque un insieme di punti tutti equidistanti, e la sua numerabilità segue dal postulato di <b>separabilità</b> (lo spazio contiene una successione densa): in uno spazio separabile non ci può stare una famiglia più che numerabile di punti a distanza fissa l&rsquo;uno dall&rsquo;altro. La separabilità, che Picasso postula in una riga («assumiamo che $\mathcal H$ sia separabile, cioè ammetta una base numerabile»), è esattamente ciò che permette di scrivere uno stato come una <i>lista</i> di coefficienti.</p>`},
   {label:'Il caso degenere: dagli autovettori agli autospazi', body:R`
   <p>Se $\xi$ è degenere l&rsquo;argomento va corretto, e la correzione è istruttiva. Restano veri i due fatti che «gli autovettori di un&rsquo;osservabile corrispondenti ad autovalori diversi sono ortogonali» e che «l&rsquo;insieme di tutti gli autovettori di un&rsquo;osservabile è completo». Cade invece la conclusione che gli autovettori formino una base ortonormale, e Picasso dice perché: «nulla ci garantisce (e non è vero) che autovettori distinti corrispondenti a uno stesso autovalore siano fra loro ortogonali».</p>
   <p>La ragione è un teorema che vale la pena enunciare perché è fra i più usati del corso: <b>ogni combinazione lineare di autovettori corrispondenti allo stesso autovalore è ancora autovettore con quello stesso autovalore</b>. La dimostrazione di Picasso è di nuovo per assurdo e di nuovo interamente fisica: posto $|A\rangle=\alpha|\xi_1\rangle+\beta|\xi_1'\rangle$ con entrambi gli addendi autostati di autovalore $\xi_1$, se una misura potesse dare $\xi_i$ con $i\ge2$ allora si avrebbe $p_i=|\langle A|\xi_i\rangle|^2$, ma</p>
   $$\langle A|\xi_i\rangle=\bar\alpha\langle\xi_1|\xi_i\rangle+\bar\beta\langle\xi_1'|\xi_i\rangle=0$$
   <p>perché autovettori di autovalori diversi sono ortogonali; dunque $p_i=0$ contro l&rsquo;ipotesi. Conclusione: «l&rsquo;insieme degli autovettori di una osservabile corrispondenti allo stesso autovalore costituisce un <b>sottospazio lineare (chiuso)</b> dello spazio $\mathcal H$» — l&rsquo;autospazio. Dentro ciascun autospazio una base ortonormale si può sempre scegliere, e la scelta è arbitraria; l&rsquo;unione delle scelte è una base di $\mathcal H$. La probabilità di ottenere $\xi_i$ diventa allora la <i>somma</i> dei moduli quadri sulle direzioni dell&rsquo;autospazio, e Picasso verifica che il risultato non dipende dalla base scelta dentro di esso — che è ciò che rende la degenerazione una proprietà fisica e non un artefatto della scelta.</p>`}
  ]},
  {t:'reveal', title:'La serie di Fourier astratta, e Parseval verificata su un caso', tag:'costruzione', steps:[
   {label:'Lo sviluppo, e i coefficienti', body:R`
   <p>Con una base ortonormale completa $\{|\xi_i\rangle\}$ in mano, ogni stato si scrive come una somma — Picasso la chiama esplicitamente «serie di Fourier», e il nome non è un&rsquo;analogia ma una constatazione, come la tappa 05 renderà esatto:</p>
   $$|A\rangle=\sum_i a_i|\xi_i\rangle$$
   <p>e i coefficienti si calcolano «prendendo il prodotto scalare di ambo i membri con il generico vettore (normalizzato) della base». Il conto è di una riga e usa solo $\langle\xi_i|\xi_j\rangle=\delta_{ij}$:</p>
   $$\langle\xi_i|A\rangle=\sum_j a_j\langle\xi_i|\xi_j\rangle=\sum_j a_j\delta_{ij}=a_i$$
   <p>Sostituendo i coefficienti nello sviluppo si ottiene la forma che in tappa 06 diventerà lo strumento di lavoro:</p>
   $$|A\rangle=\sum_i |\xi_i\rangle\langle\xi_i|A\rangle$$
   <p>e la lettura fisica dei coefficienti è il ponte col movimento precedente: $a_i=\langle\xi_i|A\rangle$ è l&rsquo;<b>ampiezza</b> di transizione da $|A\rangle$ a $|\xi_i\rangle$, e $|a_i|^2$ è la probabilità. La regola di Born, nello spazio di Hilbert, diventa: <i>la probabilità di un esito è il modulo quadro della componente dello stato lungo l&rsquo;autovettore di quell&rsquo;esito</i>. Lo sviluppo in base non è un artificio di calcolo, è la decomposizione dello stato nelle alternative di una misura.</p>`},
   {label:'La norma, e la condizione per esistere', body:R`
   <p>Il modulo quadro dello stato si calcola allo stesso modo, e dà un risultato con due letture. Picasso:</p>
   $$\langle A|A\rangle=\sum_{i,j}\bar a_i a_j\langle\xi_i|\xi_j\rangle=\sum_i|a_i|^2<\infty$$
   <p>È l&rsquo;<b>identità di Parseval</b>: la norma quadra di un vettore è la somma dei moduli quadri delle sue componenti, in <i>qualunque</i> base ortonormale. La prima lettura è fisica — se lo stato è normalizzato, $\sum_i|a_i|^2=1$ e le probabilità sommano a uno, come devono. La seconda è matematica e Picasso la mette per iscritto perché è una condizione di esistenza: «<i>solo</i> se $\sum_i|a_i|^2<\infty$ la serie definisce un vettore di $\mathcal H$». Non ogni lista di coefficienti è uno stato: lo sono le liste a quadrato sommabile, e questo è il primo punto in cui la dimensione infinita impone un vincolo che in dimensione finita non esiste.</p>
   <p>Se $|A\rangle$ non è normalizzato ma gli $|\xi_i\rangle$ sì, la probabilità si normalizza a mano: $p_i=|a_i|^2/\langle A|A\rangle$. È fra gli errori più frequenti negli scritti — leggere $|a_i|^2$ come probabilità senza aver controllato la norma.</p>`},
   {label:'Un controllo numerico: Parseval su una funzione concreta', body:R`
   <p>Parseval si verifica, e verificarla una volta su un caso concreto vale più di averla letta tre volte. Prendiamo lo spazio delle funzioni a quadrato sommabile su $[0,\pi]$, con base ortonormale $\phi_n(x)=\sqrt{2/\pi}\,\sin(nx)$, e sviluppiamo la funzione costante $f(x)=1$.</p>
   <p>Il coefficiente $n$-esimo è $c_n=\int_0^{\pi}\sqrt{2/\pi}\,\sin(nx)\,dx=\sqrt{2/\pi}\,\dfrac{1-\cos(n\pi)}{n}$, che vale zero per $n$ pari e $2\sqrt{2/\pi}/n$ per $n$ dispari. Per $n=1$ in particolare,</p>
   $$c_1=\int_0^{\pi}\sqrt{2/\pi}\,\sin x\,dx=2\sqrt{2/\pi}$$
   <p>La somma dei moduli quadri, sui soli $n$ dispari scritti come $n=2k+1$, si chiude usando $\sum_{k\ge0}(2k+1)^{-2}=\pi^2/8$:</p>
   $$\sum_n|c_n|^2=\sum_{k=0}^{\infty}\frac{2}{\pi}\left(\frac{2}{2k+1}\right)^{2}=\frac{8}{\pi}\sum_{k=0}^{\infty}\frac{1}{(2k+1)^2}=\frac{8}{\pi}\cdot\frac{\pi^{2}}{8}=\pi$$
   <p>e dall&rsquo;altro lato la norma quadra di $f$ si calcola direttamente:</p>
   $$\|f\|^2=\int_{0}^{\pi}1\,dx=\pi$$
   <p>I due numeri coincidono, e il fatto che coincidano è <b>la completezza della base in azione</b>. Se la base fosse incompleta — se mancasse uno dei seni — la somma dei quadrati verrebbe <i>minore</i> della norma, e la differenza sarebbe la parte di $f$ che la base non vede. Parseval è dunque il test operativo di completezza: si sviluppa una funzione nota e si controlla se i conti tornano. È lo stesso criterio di von Neumann, in forma di uguaglianza numerica.</p>`}
  ]},
  {t:'plot', title:'Che cosa significa «completa»: la convergenza che non è puntuale',
   intro:R`Le somme parziali $S_N(x)=\frac{4}{\pi}\sum_{k\ \text{dispari}\le N}\frac{\sin kx}{k}$ dello sviluppo della funzione costante $f(x)=1$ su $[0,\pi]$, per $N=1,3,9,25$, insieme al bersaglio. Ogni curva è il miglior approssimante di $f$ nel sottospazio generato dai primi seni — «migliore» nel senso della norma, non punto per punto.`,
   plots:[
    {kind:'func2d', xr:[0,3.1416], yr:[-0.15,1.45], height:350, ticks:6,
     title:'le somme parziali, e il bersaglio',
     curves:[
      {f:'1', col:'#6bdc9b', width:2.0, label:'f(x) = 1'},
      {f:'4/PI*sin(x)', col:'#9aa6bf', width:1.8, label:'N = 1'},
      {f:'4/PI*(sin(x)+sin(3*x)/3)', col:'#ffd166', width:1.8, label:'N = 3'},
      {f:'4/PI*(sin(x)+sin(3*x)/3+sin(5*x)/5+sin(7*x)/7+sin(9*x)/9)', col:'#ff8a5c', width:1.9, label:'N = 9'},
      {f:'4/PI*(sin(x)+sin(3*x)/3+sin(5*x)/5+sin(7*x)/7+sin(9*x)/9+sin(11*x)/11+sin(13*x)/13+sin(15*x)/15+sin(17*x)/17+sin(19*x)/19+sin(21*x)/21+sin(23*x)/23+sin(25*x)/25)', col:'#4c8dff', width:2.1, label:'N = 25'}
     ],
     xlabel:'x', ylabel:'somma parziale'}
   ],
