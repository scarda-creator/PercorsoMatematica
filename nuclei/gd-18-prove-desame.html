/* ---------------- 00 · DI COSA PARLA ---------------- */
{ num:'00', title:'Di cosa parla questo movimento', meta:'cinque prove, un esercizio solo · perche questo non e un pool di esercizi · come si usa',
  blocchi:[
  {t:'prosa', title:'Il fatto che decide la forma di questo movimento', tag:'quadro', html:R`
  <p>Le cinque prove scritte di Diverio dell&rsquo;anno 2025/26 sono <b>cinque istanze dello stesso esercizio</b>. Non si somigliano: hanno lo stesso scheletro, punto per punto, nello stesso ordine. Aprendole una accanto all&rsquo;altra si legge sempre la stessa riga d&rsquo;apertura — un insieme di matrici definito come luogo di zeri di un&rsquo;applicazione quadratica — e poi dieci o quattordici punti numerati che lo scavano dalla stessa parte.</p>
  <table>
  <tr><th>appello</th><th>l&rsquo;oggetto</th><th>definito da</th><th>punti</th></tr>
  <tr><td>26 gennaio</td><td>il luogo di rango $\Sigma_k=\{A: \operatorname{rk}A=k\}$</td><td>$\varphi\begin{pmatrix}B&C\\D&E\end{pmatrix}=E-DB^{-1}C$</td><td>10</td></tr>
  <tr><td>18 febbraio</td><td>Stiefel $V_k(\mathbb{R}^n)=\{X: X^{T}X=\mathrm{Id}_k\}$</td><td>$F(X)=X^{T}X-\mathrm{Id}_k$</td><td>14</td></tr>
  <tr><td>24 giugno</td><td>il gruppo simplettico, via $\Omega_{2n}$</td><td>$F(X)=X^{T}\Omega X-\Omega$</td><td>11</td></tr>
  <tr><td>15 luglio</td><td>$O(p,q)=\{X: X^{T}I_{p,q}X=I_{p,q}\}$</td><td>$F(X)=X^{T}I_{p,q}X-I_{p,q}$</td><td>10+10</td></tr>
  <tr><td>14 settembre</td><td>$CO(n)$, il gruppo ortogonale conforme</td><td>$F(X)=X^{T}X-\frac{\operatorname{tr}(X^{T}X)}{n}\mathrm{Id}_n$</td><td>10</td></tr>
  </table>
  <p><b>Sessantacinque punti numerati, una macchina sola.</b> Ed è questo che decide la forma di ciò che segue: non un elenco di esercizi scelti, ma <b>lo scheletro insegnato e poi fatto girare</b>. Da cinque prove non si cavano cinquanta esercizi indipendenti senza inventarli, e inventare un esercizio con addosso la data di un appello è il modo più rapido per allenarsi su un esame che non esiste. Quello che invece si può fare — e che vale incomparabilmente di più — è imparare la macchina, perché la macchina si ripresenterà.</p>`},
  {t:'prosa', title:'Come si usa questo movimento', tag:'metodo', html:R`
  <p>Le prime due tappe sono <b>lo scheletro</b>: i dieci passi in astratto, con il perché ciascuno funziona, e la tabella da avere in testa prima di entrare. Leggerle una volta sola non basta e non serve: serve riconoscerle mentre si lavora.</p>
  <p>La terza isola <b>l&rsquo;unico passo che non è meccanico</b> — la surgettività del differenziale — e mostra il trucco che la risolve in tutte e cinque le prove. Diverio dà sempre un suggerimento su quel punto e mai sugli altri: è lui a dirci dove sta la difficoltà.</p>
  <p>Le quattro tappe seguenti sono il <b>primo giro completo</b>: la prova del 14 settembre, $CO(n)$, tutti e dieci i punti. Ogni punto è un esercizio con l&rsquo;enunciato e la soluzione nascosta sotto. <b>Si prova prima.</b> La soluzione di quella prova è pubblicata dal docente, quindi quello che si legge qui non è una ricostruzione: è il suo svolgimento, controllato riga per riga e rifatto con i conti espliciti dove lui li comprime.</p>
  <p>L&rsquo;ultima tappa di lavoro mette le altre quattro prove a confronto, e dice <b>dove lo scheletro si piega</b>.</p>`}
]},

/* ---------------- 01 · LO SCHELETRO ---------------- */
{ num:'01', title:'Lo scheletro: i dieci passi che tornano in tutte e cinque', meta:'dall’oggetto al gruppo di Lie · i passi gratis e i passi che costano · dove si perde tempo',
  blocchi:[
  {t:'prosa', title:'I dieci passi, e quanto costa ciascuno', tag:'metodo', html:R`
  <p>Lo scheletro si enuncia in dieci passi. Accanto a ciascuno c&rsquo;è <b>quanto costa</b>, perché la gestione del tempo su una prova di tre ore e mezza dipende da quello: cinque passi sono una riga ciascuno, due sono conti meccanici lunghi, e <b>uno solo richiede un&rsquo;idea</b>.</p>
  <ol>
   <li><b>L&rsquo;oggetto arriva come luogo di zeri.</b> Si dà un&rsquo;applicazione $F$ fra due spazi di matrici e si pone $G=F^{-1}(0)$. Lo spazio di partenza è sempre $M_n(\mathbb{R})$ o un suo aperto come $GL(n,\mathbb{R})$; quello d&rsquo;arrivo è sempre un sottospazio di matrici con una simmetria — simmetriche, antisimmetriche, simmetriche a traccia nulla. <i>Costo: leggere.</i></li>
   <li><b>Verificare che $F$ ha valori dove si dice.</b> Se l&rsquo;arrivo è $\mathrm{Sym}_n$ bisogna mostrare che $F(X)^{T}=F(X)$; se è $\mathrm{Sym}^0_n$, anche che la traccia si annulla. <i>Costo: due righe. È il passo che si salta, e saltarlo fa sbagliare la dimensione al passo 6.</i></li>
   <li><b>$F$ è liscia.</b> Le entrate di $F(X)$ sono polinomi — quasi sempre quadratici — nelle entrate di $X$. Una riga, e si dice così.</li>
   <li><b>Calcolare $d_XF(H)$.</b> C&rsquo;è una sola tecnica e funziona sempre: $d_XF(H)=\frac{d}{dt}\big|_{t=0}F(X+tH)$. Funziona perché lo spazio di partenza è <b>uno spazio vettoriale</b>, quindi $X+tH$ ha senso e $T_{M_n,X}\cong M_n$ canonicamente. <i>Costo: un conto meccanico. Su $F$ quadratica, due termini bilineari.</i></li>
   <li><b>Mostrare che $d_XF$ è surgettivo nei punti di $G$.</b> <b>Questo è l&rsquo;unico passo con un&rsquo;idea dentro</b>, ed è l&rsquo;unico su cui Diverio dà il suggerimento. Si tratta sempre di <i>esibire</i> una preimmagine, non di dimostrarne l&rsquo;esistenza. La tappa 03 lo tratta a parte.</li>
   <li><b>Concludere: $G$ è una sottovarietà liscia localmente chiusa, e contarne la dimensione.</b> È il <span class="str" data-str="valore-regolare">teorema del valore regolare</span>: una <span class="str" data-str="sommersione">sommersione</span> sul luogo di zeri rende quel luogo una sottovarietà di dimensione $\dim(\text{partenza})-\dim(\text{arrivo})$. Le due dimensioni si contano a mano, e lì serve il passo 2. <i>Costo: due righe, se il passo 2 è stato fatto.</i></li>
   <li><b>Lo spazio tangente.</b> $T_{G,X}=\ker d_XF$, sempre, e per la stessa ragione letta al rovescio: le direzioni tangenti sono quelle lungo cui $F$ resta ferma. Nell&rsquo;identità la condizione diventa algebrica e riconoscibile — antisimmetriche per $O(n)$, antisimmetriche più multipli dell&rsquo;identità per $CO(n)$. <i>Costo: imporre $d_{X}F(H)=0$ e leggere.</i></li>
   <li><b>Il caso di dimensione bassa.</b> Diverio scende sempre a $n=2$ (o $m=n=2$, $k=1$) e chiede di parametrizzare a mano, trovare le componenti connesse e isolare quella dell&rsquo;identità. <i>Costo: un sistema di due o tre equazioni quadratiche, risolto per casi.</i></li>
   <li><b>I campi invarianti a sinistra, e la loro parentesi.</b> Si prende una base $B_1,\dots,B_r$ di $T_{G,e}$ e si pone $X_i(A)=A\cdot B_i$. Lisci perché lineari nelle entrate di $A$. Poi si scrivono in coordinate e si calcola la <span class="str" data-str="parentesi-di-lie">parentesi</span>. <i>Costo: meccanico, ma è dove si sbaglia un segno.</i></li>
   <li><b>Le due domande globali.</b> <span class="str" data-str="compattezza">Compattezza</span>: si uccide esibendo una successione illimitata dentro $G$, e le matrici scalari servono sempre. Trasversalità con un&rsquo;altra varietà di matrici — tipicamente $SL(n,\mathbb{R})$: si esibisce un vettore che sta in un tangente e non nell&rsquo;altro. <i>Costo: una riga ciascuna, se si sa cosa esibire.</i></li>
  </ol>
  <p><b>La lettura che conviene portarsi dietro</b>: dei dieci passi, sette sono conti che si fanno senza pensare e tre chiedono di <i>scegliere</i> qualcosa — la preimmagine al passo 5, la parametrizzazione al passo 8, il controesempio al passo 10. Su una prova di tre ore e mezza, il tempo si perde quasi sempre nei sette meccanici, fatti con esitazione. <b>Quindi la cosa da automatizzare è la parte noiosa</b>, non quella brillante.</p>`}
]},

{ num:'02', title:'Perche lo scheletro e questo, e la tabella da avere in testa', meta:'da dove vengono i dieci passi · quanto pesa ciascuno · la tabella prima di entrare',
  blocchi:[
  {t:'prosa', title:'Perche lo scheletro e questo, e non un altro', tag:'first principles', html:R`
  <p>Non è un&rsquo;abitudine del docente: è l&rsquo;unica strada che il corso rende disponibile. Un gruppo di matrici non arriva con un atlante, e costruirgliene uno a mano — carte, transizioni, compatibilità — è lungo e inutile. L&rsquo;unico modo economico di dire «questo insieme è una varietà liscia» è il criterio del valore regolare, che chiede soltanto di saper derivare.</p>
  <p>E il criterio ha una forma sola:</p>
  $$\forall p\in F^{-1}(0)\ \ \ d_pF\ \text{surgettivo}\quad\Longrightarrow\quad F^{-1}(0)\ \text{sottovarietà},\ \ \dim F^{-1}(0)=\dim(\text{partenza})-\dim(\text{arrivo}).$$
  <p><b>Il quantificatore è su tutto il luogo di zeri, non su un punto</b>, e qui è una buona notizia: in un gruppo basta verificarlo <i>nell&rsquo;identità</i> e poi traslare, perché le traslazioni sono diffeomorfismi. Nelle prove di Diverio, però, la verifica si fa direttamente in $X$ generico, e il motivo è che la preimmagine indovinata del passo 5 contiene $X$ e quindi funziona senza traslare.</p>
  <p>Da qui segue tutto il resto in cascata, e ciascuna freccia è una riga del corso:</p>
  $$\underbrace{G=F^{-1}(0)\ \text{sottovarietà}}_{\text{passo 6}}\ \ \text{e}\ \ \underbrace{G\ \text{sottogruppo}}_{\text{passo 1}}\ \Longrightarrow\ \underbrace{G\ \text{è un}\ \text{gruppo di Lie}}_{\text{le operazioni sono restrizioni di mappe polinomiali}}\ \Longrightarrow\ \underbrace{\exists\ \text{base di campi invarianti}}_{\text{passo 9, e}\ G\ \text{parallelizzabile}}.$$
  <p>Una volta visto questo, i punti di una prova smettono di essere dieci domande e diventano <b>una sola domanda letta a dieci risoluzioni diverse</b>. E la differenza pratica è grande: su dieci domande si gestisce il tempo male, perché ognuna sembra nuova.</p>`},
  {t:'quadro', title:'La tabella da avere in testa prima di entrare', html:R`
  <table>
  <tr><th>se l&rsquo;arrivo è</th><th>la sua dimensione</th><th>la condizione tangente in $\mathrm{Id}$</th></tr>
  <tr><td>$\mathrm{Sym}_n(\mathbb{R})$</td><td>$\frac{n(n+1)}{2}$</td><td>$H^{T}+H=0$: antisimmetriche</td></tr>
  <tr><td>$\mathrm{Sym}^0_n(\mathbb{R})$ (traccia nulla)</td><td>$\frac{n(n+1)}{2}-1$</td><td>$H^{T}+H=\frac{2\operatorname{tr}H}{n}\mathrm{Id}$: antisimmetriche $+\ \mathbb{R}\,\mathrm{Id}$</td></tr>
  <tr><td>$\mathrm{Alt}_n(\mathbb{R})$ (antisimmetriche)</td><td>$\frac{n(n-1)}{2}$</td><td>$H^{T}-H=0$: simmetriche</td></tr>
  <tr><td>$\mathbb{R}$ (una sola equazione)</td><td>$1$</td><td>$\operatorname{tr}(X^{-1}H)=0$ per $\det$</td></tr>
  </table>
  <b>Le prime due righe sono la differenza fra $O(n)$ e $CO(n)$</b>, e tutta la prova del 14 settembre vive in quel $-1$: togliere una dimensione all&rsquo;arrivo la aggiunge al gruppo. La quarta riga serve ogni volta che compare $SL(n,\mathbb{R})$, cioè nei punti finali di tre prove su cinque.`}
]},


/* ---------------- 02 · IL PASSO CHE NON E MECCANICO ---------------- */
{ num:'03', title:'Il passo cinque: l’unico che chiede un’idea, e il trucco che lo risolve sempre', meta:'surgettivita per esibizione · la forma della preimmagine · perche il suggerimento di Diverio e sempre su questo punto',
  blocchi:[
  {t:'prosa', title:'Che cosa si sta davvero chiedendo', tag:'first principles', html:R`
  <p>Il differenziale $d_XF$ va da uno spazio grande a uno piccolo — da $M_n(\mathbb{R})$, dimensione $n^2$, a uno spazio di matrici simmetriche, dimensione circa $n^2/2$. Chiedere che sia surgettivo è chiedere che <i>non</i> degeneri, e a prima vista sembra una verifica di rango su una matrice enorme.</p>
  <p><b>Non lo è, e la ragione è che qui la surgettività si dimostra per esibizione.</b> Dato $Y$ nell&rsquo;arrivo, si deve trovare <i>un</i> $H$ nella partenza con $d_XF(H)=Y$: non serve descrivere l&rsquo;immagine, basta un elemento per ogni bersaglio. In simboli è la differenza fra</p>
  $$\forall Y\ \ \exists H\ :\ d_XF(H)=Y\qquad\text{(quello che si deve mostrare)}$$
  $$\operatorname{rk}d_XF=\dim(\text{arrivo})\qquad\text{(quello che non conviene calcolare)}.$$
  <p>I due enunciati sono equivalenti, e il primo si chiude in tre righe mentre il secondo richiederebbe una matrice $\frac{n(n+1)}{2}\times n^{2}$.</p>`},
  {t:'prosa', title:'Il trucco, e perche funziona in tutte e cinque', tag:'metodo', html:R`
  <p>La preimmagine da provare ha sempre la stessa forma. Si guarda $d_XF(H)$, si vede che è una <b>somma di due termini coniugati</b> — tipicamente $H^{T}SX+X^{T}SH$ per una matrice fissa $S$ — e si cerca $H$ che renda i due termini uguali a $\frac{1}{2}Y$ ciascuno. Questo porta a tentare</p>
  $$H=\tfrac{1}{2}\,(X^{T}S)^{-1}Y\qquad\text{oppure}\qquad H=\tfrac{1}{2}\,X\,S\,M,$$
  <p>e quale delle due dipende da cosa si sa invertire. <b>Il motivo per cui funziona è che su $G$ vale la relazione definente</b>, e la relazione definente è esattamente ciò che rende invertibile il pezzo che serve: su $O(p,q)$ si ha $X^{T}I_{p,q}X=I_{p,q}$ e quindi $X^{T}I_{p,q}=I_{p,q}X^{-1}$; su $CO(n)$ si ha $X^{T}X=\lambda(X)\mathrm{Id}$ con $\lambda>0$ e quindi $X^{T}$ è invertibile. <b>La surgettività non vale su tutto lo spazio di partenza, e non deve</b>: vale sui punti di $G$, che è tutto quello che il criterio del valore regolare chiede.</p>
  <p><b>Perché il suggerimento di Diverio è sempre e solo qui.</b> Lui dà il suggerimento dove la strada non è deducibile dalla definizione, e la scelta della preimmagine non lo è: va indovinata. Negli altri nove punti il suggerimento manca perché non serve, e questa è un&rsquo;informazione sul tempo da allocare. Quando sul punto del differenziale surgettivo si perdono venti minuti, il problema non è che si sa poco: è che si sta cercando di dimostrare invece di esibire.</p>
  <p>Un&rsquo;ultima verifica da fare sempre, e che costa una riga: <b>la traccia</b>. Quando l&rsquo;arrivo è lo spazio delle simmetriche a <span class="str" data-str="traccia">traccia</span> nulla, la preimmagine indovinata va controllata anche su quella condizione — e si chiude usando che $Y$ ha traccia nulla <i>per ipotesi</i>, non per conto.</p>`}
]},

/* ---------------- 03 · GIRO PRIMO: CO(n), I QUATTRO PUNTI GENERALI ---------------- */
{ num:'04', title:'Giro primo — CO(n), 14 settembre 2026: il sottogruppo e la liscezza', meta:'il sottogruppo · il differenziale · la surgettivita e la dimensione · il tangente all’identita',
  blocchi:[
  {t:'prosa', title:'L’oggetto della prova', tag:'grammatica', html:R`
  <p>Sia $\mathrm{Sym}^0_n(\mathbb{R})=\{S\in\mathrm{Sym}_n(\mathbb{R}):\operatorname{tr}S=0\}$, identificato con $\mathbb{R}^{n(n+1)/2-1}$, e sia</p>
  $$F:GL(n,\mathbb{R})\to\mathrm{Sym}^0_n(\mathbb{R}),\qquad F(X)=X^{T}X-\frac{\operatorname{tr}(X^{T}X)}{n}\,\mathrm{Id}_n.$$
  <p>Il <b>gruppo ortogonale conforme</b> è $CO(n)=F^{-1}(0)$. Il nome dice cosa fa: una matrice conforme conserva gli angoli e cambia le lunghezze tutte dello stesso fattore — è un&rsquo;isometria composta con una dilatazione. La riga che lo rende maneggevole, e che è il punto (i), è che $F(X)=0$ equivale a $X^{T}X=\lambda(X)\mathrm{Id}_n$ con $\lambda(X)=\frac{\operatorname{tr}(X^{T}X)}{n}$.</p>
  <p><b>Perché $GL$ e non $M_n$ come partenza.</b> Perché serve $\lambda(X)>0$, e su una matrice singolare $\lambda$ può annullarsi. È il dettaglio che fa funzionare tutto il resto, e Diverio lo mette come prima cosa da osservare.</p>`},
  {t:'esercizio', title:'1 · (i) Il sottogruppo, e perche lambda e positivo',
   src:'14 settembre 2026, punto (i)',
   testo:R`Osservare che per ogni $X\in GL(n,\mathbb{R})$ la quantità $\lambda(X):=\frac{\operatorname{tr}(X^{T}X)}{n}$ è strettamente positiva. Dedurre che $X\in CO(n)$ se e solo se $X^{T}X=\lambda(X)\mathrm{Id}_n$, e verificare che $CO(n)$ è un sottogruppo di $GL(n,\mathbb{R})$.`,
   steps:[
    {label:'La positivita, e dove serve linvertibilita', body:R`
    <p>Se $X$ è invertibile le sue colonne sono linearmente indipendenti, quindi la matrice simmetrica $X^{T}X$ è <b>definita positiva</b>: per ogni $v\neq0$ si ha $v^{T}X^{T}Xv=\|Xv\|^{2}>0$. I suoi autovalori sono allora reali e strettamente positivi, e la traccia è la loro somma. Quindi $\operatorname{tr}(X^{T}X)>0$ e $\lambda(X)>0$.</p>
    <p><b>Senza l&rsquo;invertibilità il conto cade</b>, e non in modo innocuo: per $X=0$ si ha $F(0)=0$, cioè l&rsquo;origine starebbe in $F^{-1}(0)$ senza essere un elemento di un gruppo. È per questo che la partenza è $GL(n,\mathbb{R})$, che è un <i>aperto</i> di $M_n(\mathbb{R})$ e quindi una varietà della stessa dimensione $n^{2}$.</p>`},
    {label:'L’equivalenza, che e solo riscrivere', body:R`
    <p>$F(X)=0$ significa $X^{T}X=\frac{\operatorname{tr}(X^{T}X)}{n}\mathrm{Id}_n$, cioè $X^{T}X=\lambda(X)\mathrm{Id}_n$. Non c&rsquo;è niente da dimostrare: è la definizione di $\lambda$ sostituita. <b>Vale la pena notare però il verso utile</b>: se si sa a priori che $X^{T}X=\mu\,\mathrm{Id}_n$ per un qualche $\mu$, prendendo la traccia si ottiene $n\mu=\operatorname{tr}(X^{T}X)$, quindi $\mu=\lambda(X)$ necessariamente. Lo scalare non è un parametro libero: è determinato da $X$.</p>`},
    {label:'Sottogruppo: le tre verifiche', body:R`
    <p><b>L&rsquo;identità.</b> $\mathrm{Id}^{T}\mathrm{Id}=\mathrm{Id}$ e $\lambda(\mathrm{Id})=\frac{\operatorname{tr}\mathrm{Id}}{n}=1$, quindi $\mathrm{Id}\in CO(n)$.</p>
    <p><b>Il prodotto.</b> Dati $X,Y\in CO(n)$,
    $$(XY)^{T}(XY)=Y^{T}(X^{T}X)Y=Y^{T}\big(\lambda(X)\mathrm{Id}\big)Y=\lambda(X)\,Y^{T}Y=\lambda(X)\lambda(Y)\,\mathrm{Id}_n,$$
    e lo scalare $\lambda(X)\lambda(Y)$ è positivo. Quindi $XY\in CO(n)$, e di passaggio si è scoperto che <b>$\lambda$ è un omomorfismo moltiplicativo</b> $CO(n)\to\mathbb{R}_{>0}$ — fatto che non serve in questo punto e serve al punto (viii).</p>
    <p><b>L&rsquo;inversa.</b> Da $X^{T}X=\lambda\mathrm{Id}$ si ricava $X^{-1}=\lambda^{-1}X^{T}$, e allora
    $$(X^{-1})^{T}X^{-1}=\lambda^{-2}\,X\,X^{T}.$$
    Resta da sapere che $XX^{T}=\lambda\,\mathrm{Id}$ quando $X^{T}X=\lambda\,\mathrm{Id}$: segue da $X^{-1}=\lambda^{-1}X^{T}$ moltiplicando a sinistra per $X$, cioè $\mathrm{Id}=\lambda^{-1}XX^{T}$. Quindi $(X^{-1})^{T}X^{-1}=\lambda^{-1}\mathrm{Id}$ e $X^{-1}\in CO(n)$ con $\lambda(X^{-1})=\lambda(X)^{-1}$.</p>
    <p><b>Il passaggio da non dare per scontato</b> è l&rsquo;ultimo: $X^{T}X=XX^{T}$ non è vero per matrici qualunque, e qui è vero solo perché la relazione definente lo forza. È lo stesso meccanismo che al passo 5 dello scheletro rende invertibile ciò che serve.</p>`}
   ]},
  {t:'esercizio', title:'2 · (ii) I valori, la liscezza, e il differenziale',
   src:'14 settembre 2026, punto (ii)',
   testo:R`Verificare che $F$ assume effettivamente valori in $\mathrm{Sym}^0_n(\mathbb{R})$, osservare che è liscia, e calcolare il differenziale $d_XF(H)$ per $X\in GL(n,\mathbb{R})$ e $H\in T_{GL(n,\mathbb{R}),X}\cong M_n(\mathbb{R})$.`,
   steps:[
    {label:'I valori: simmetria e traccia nulla', body:R`
    <p><b>Simmetria.</b> $(X^{T}X)^{T}=X^{T}X$, e l&rsquo;identità è simmetrica, quindi $F(X)^{T}=F(X)$ per ogni $X$.</p>
    <p><b>Traccia nulla</b>, ed è il pezzo che dà il nome allo spazio d&rsquo;arrivo:
    $$\operatorname{tr}F(X)=\operatorname{tr}(X^{T}X)-\frac{\operatorname{tr}(X^{T}X)}{n}\operatorname{tr}(\mathrm{Id}_n)=\operatorname{tr}(X^{T}X)-\frac{\operatorname{tr}(X^{T}X)}{n}\cdot n=0.$$
    <p><b>Questo è il passo 2 dello scheletro</b>, e salta all&rsquo;occhio quanto costa poco e quanto conta: è ciò che permette di dire $\dim(\text{arrivo})=\frac{n(n+1)}{2}-1$ al punto (iii). Chi lo salta usa $\frac{n(n+1)}{2}$ e sbaglia la dimensione di $CO(n)$ di uno.</p>`},
    {label:'La liscezza, in una riga', body:R`
    <p>Le entrate di $X^{T}X$ sono polinomi quadratici nelle entrate di $X$, e $\operatorname{tr}(X^{T}X)=\sum_{i,j}x_{ij}^{2}$ è un polinomio. Quindi ogni componente di $F$ è polinomiale, e $F$ è liscia su tutto $M_n(\mathbb{R})$, in particolare sull&rsquo;aperto $GL(n,\mathbb{R})$. <b>Non serve nient&rsquo;altro</b>, e dilungarsi qui è tempo perso.</p>`},
    {label:'Il differenziale, con la sola tecnica che serve', body:R`
    <p>Si deriva lungo la retta $t\mapsto X+tH$, che ha senso perché la partenza è un aperto di uno spazio vettoriale:
    $$F(X+tH)=(X+tH)^{T}(X+tH)-\frac{\operatorname{tr}\big((X+tH)^{T}(X+tH)\big)}{n}\mathrm{Id}_n.$$
    Il primo termine si espande in $X^{T}X+t(H^{T}X+X^{T}H)+t^{2}H^{T}H$, e derivando in $t=0$ resta $H^{T}X+X^{T}H$. Per il secondo, $\operatorname{tr}\big((X+tH)^{T}(X+tH)\big)=\operatorname{tr}(X^{T}X)+2t\operatorname{tr}(X^{T}H)+t^{2}\operatorname{tr}(H^{T}H)$ — dove si è usato $\operatorname{tr}(H^{T}X)=\operatorname{tr}(X^{T}H)$, perché una matrice e la sua trasposta hanno la stessa traccia. Quindi</p>
    $$d_XF(H)=H^{T}X+X^{T}H-\frac{2\operatorname{tr}(X^{T}H)}{n}\,\mathrm{Id}_n.$$
    <p><b>Due controlli che conviene fare sempre</b>, e che costano nulla: il risultato è lineare in $H$ (deve esserlo, è un differenziale) e cade in $\mathrm{Sym}^0_n$ — simmetrico per costruzione, e a traccia nulla perché $\operatorname{tr}(H^{T}X+X^{T}H)=2\operatorname{tr}(X^{T}H)$ cancella esattamente il secondo termine. Se uno dei due controlli fallisce, l&rsquo;errore è nel conto e non nella teoria.</p>`}
   ]}
]},

{ num:'05', title:'Giro primo — CO(n): la surgettivita, la dimensione, il tangente all’identita', meta:'il punto (iii) e il punto (iv) della prova del 14 settembre',
  blocchi:[
  {t:'esercizio', title:'3 · (iii) La surgettivita, e la dimensione',
   src:'14 settembre 2026, punto (iii) — con il suggerimento del docente',
   testo:R`Dimostrare che $d_XF$ è surgettivo per ogni $X\in CO(n)$. Dedurre che $CO(n)$ è un gruppo di Lie realizzato come sottovarietà liscia localmente chiusa di $M_n(\mathbb{R})$, e calcolarne la dimensione.<br><br><i>Suggerimento del docente: dato $Y\in\mathrm{Sym}^0_n(\mathbb{R})$, cercare una preimmagine $H$ della forma $\tfrac12(X^{T})^{-1}M$ per un&rsquo;opportuna $M$.</i>`,
   steps:[
    {label:'La preimmagine, e perche proprio questa', body:R`
    <p>Si prova con $H=\tfrac12\,(X^{T})^{-1}Y$, cioè si prende $M=Y$. <b>L&rsquo;invertibilità di $X^{T}$ è garantita</b> perché $X\in CO(n)\subseteq GL(n,\mathbb{R})$. Allora</p>
    $$X^{T}H=\tfrac12\,X^{T}(X^{T})^{-1}Y=\tfrac12\,Y,$$
    <p>e il termine coniugato si ottiene trasponendo: $H^{T}X=(X^{T}H)^{T}=\tfrac12Y^{T}=\tfrac12Y$, dove l&rsquo;ultima uguaglianza usa che <b>$Y$ è simmetrica per ipotesi</b>.</p>
    <p>Resta il terzo termine. $\operatorname{tr}(X^{T}H)=\tfrac12\operatorname{tr}(Y)=0$, perché <b>$Y$ ha traccia nulla per ipotesi</b> — sta in $\mathrm{Sym}^0_n$. Mettendo insieme:
    $$d_XF(H)=\tfrac12Y+\tfrac12Y-0=Y.$$
    <p><b>Il motivo per cui la scelta è quella e non un&rsquo;altra</b>: il differenziale è la somma di due termini che sono trasposti l&rsquo;uno dell&rsquo;altro, quindi se si riesce a mandare uno dei due in $\tfrac12Y$ con $Y$ simmetrica, l&rsquo;altro ci va gratis. Tutta l&rsquo;idea del passo 5 è questa, e si ripresenta identica sulle altre quattro prove cambiando solo quale matrice va invertita.</p>`},
    {label:'La conclusione, e il conto della dimensione', body:R`
    <p>$0$ è dunque un <span class="str" data-str="valore-regolare">valore regolare</span> di $F$, e $CO(n)=F^{-1}(0)$ è una sottovarietà liscia localmente chiusa di $GL(n,\mathbb{R})$, quindi di $M_n(\mathbb{R})$. La dimensione:</p>
    $$\dim CO(n)=\dim GL(n,\mathbb{R})-\dim\mathrm{Sym}^0_n(\mathbb{R})=n^{2}-\Big(\frac{n(n+1)}{2}-1\Big)=\dfrac{n(n-1)}{2}+1.$$
    <p><b>Il numero si legge</b>: $\frac{n(n-1)}{2}$ è la dimensione di $O(n)$, e il $+1$ è il fattore di dilatazione. Coerente con la struttura: $CO(n)$ è, a meno di componenti, il prodotto $\mathbb{R}_{>0}\times O(n)$, e per $n=2$ dà $1+1=2$ — che è esattamente il piano forato del punto (v).</p>
    <p><b>Perché è un <span class="str" data-str="gruppo-di-lie">gruppo di Lie</span> e non solo una varietà</b>: è un sottogruppo per il punto (i), e le operazioni di gruppo sono restrizioni di mappe polinomiali di $M_n(\mathbb{R})$ — il prodotto è bilineare, e l&rsquo;inversa su $CO(n)$ si scrive $X^{-1}=\lambda(X)^{-1}X^{T}$, che è liscia perché $\lambda$ non si annulla. Quindi prodotto e inversa sono lisce come mappe fra varietà, che è la definizione.</p>`}
   ]},
  {t:'esercizio', title:'4 · (iv) Il tangente all’identita: antisimmetriche piu uno',
   src:'14 settembre 2026, punto (iv)',
   testo:R`Dimostrare che lo spazio tangente all&rsquo;identità è $T_{CO(n),\mathrm{Id}_n}=\{A+c\,\mathrm{Id}_n\ :\ A\in\mathrm{Alt}(n,\mathbb{R}),\ c\in\mathbb{R}\}$, dove $\mathrm{Alt}(n,\mathbb{R})$ sono le matrici antisimmetriche.`,
   steps:[
    {label:'Imporre il nucleo', body:R`
    <p>Il tangente è il nucleo del differenziale, valutato nel punto. In $X=\mathrm{Id}_n$:
    $$d_{\mathrm{Id}}F(H)=H^{T}+H-\frac{2\operatorname{tr}(H)}{n}\,\mathrm{Id}_n,$$
    quindi $H\in T_{CO(n),\mathrm{Id}}$ se e solo se
    $$H^{T}+H=\frac{2\operatorname{tr}(H)}{n}\,\mathrm{Id}_n.$$
    <p>È una condizione sulla <b>parte simmetrica</b> di $H$: la dice uguale a un multiplo dell&rsquo;identità, e fissa anche quale multiplo.</p>`},
    {label:'La decomposizione che chiude il punto', body:R`
    <p>Si pone $c=\frac{\operatorname{tr}H}{n}$ e $A=H-c\,\mathrm{Id}_n$. Allora
    $$A^{T}+A=H^{T}+H-2c\,\mathrm{Id}_n=\frac{2\operatorname{tr}H}{n}\mathrm{Id}_n-\frac{2\operatorname{tr}H}{n}\mathrm{Id}_n=0,$$
    cioè $A$ è antisimmetrica, e $H=A+c\,\mathrm{Id}_n$. Viceversa, se $H=A+c\,\mathrm{Id}$ con $A$ antisimmetrica, allora $H^{T}+H=2c\,\mathrm{Id}$ e $\operatorname{tr}H=cn$ (perché $\operatorname{tr}A=0$ per antisimmetria), quindi la condizione è soddisfatta. <b>Le due inclusioni sono entrambe necessarie</b>, e la seconda è quella che si dimentica.</p>
    <p><b>Il controllo della dimensione, che è anche un controllo sul punto (iii)</b>: lo spazio $\mathrm{Alt}(n,\mathbb{R})\oplus\mathbb{R}\,\mathrm{Id}_n$ ha dimensione $\frac{n(n-1)}{2}+1$, e la somma è diretta perché una matrice antisimmetrica non nulla non è un multiplo dell&rsquo;identità. Coincide con la dimensione calcolata al punto (iii), come deve.</p>
    <p><b>E si legge la struttura del gruppo</b>: l&rsquo;algebra di Lie è $\mathfrak{so}(n)\oplus\mathbb{R}$, con il secondo addendo centrale — i multipli dell&rsquo;identità commutano con tutto. È la versione infinitesima di «rotazione per dilatazione», e il punto (vii) la vedrà in azione su $n=2$, dove $\mathfrak{so}(2)$ ha dimensione uno e il commutatore si annulla.</p>`}
   ]}
]},


/* ---------------- 03b · GIRO PRIMO, IL CASO n=2 ---------------- */
{ num:'06', title:'Giro primo — il caso n=2: la parametrizzazione, i campi, il commutatore', meta:'risolvere il sistema per casi · le due componenti · i campi invarianti a sinistra · la parentesi',
  blocchi:[
  {t:'esercizio', title:'5 · (v) CO(2) a mano, e il piano forato',
   src:'14 settembre 2026, punto (v)',
   testo:R`Mostrare che $A=\begin{pmatrix}a&b\\c&d\end{pmatrix}$ appartiene a $CO(2)$ se e solo se $A=\begin{pmatrix}a&-b\\b&a\end{pmatrix}$ oppure $A=\begin{pmatrix}a&b\\b&-a\end{pmatrix}$, con $a^{2}+b^{2}>0$. Dedurne che la componente connessa dell&rsquo;identità $CO^{+}(2)$ ammette una parametrizzazione globale diffeomorfa a $\mathbb{R}^{2}\setminus\{(0,0)\}$.`,
   steps:[
    {label:'Il sistema, e i due casi', body:R`
    <p>La condizione è $A^{T}A=\lambda\,\mathrm{Id}_2$. Scrivendo le entrate:
    $$A^{T}A=\begin{pmatrix}a^{2}+c^{2}&ab+cd\\ab+cd&b^{2}+d^{2}\end{pmatrix}$$
    <p>cioè il sistema</p>
    $$a^{2}+c^{2}=\lambda,\qquad b^{2}+d^{2}=\lambda,\qquad ab+cd=0.$$
    <p>L&rsquo;invertibilità forza $\lambda>0$, quindi $(a,c)\neq(0,0)$. La terza equazione dice che il vettore $(b,d)$ è ortogonale a $(a,c)$; in $\mathbb{R}^{2}$ l&rsquo;ortogonale di una retta è una retta, quindi $(b,d)=s\,(-c,a)$ per un qualche $s\in\mathbb{R}$. Sostituendo nella seconda, $(sa)^{2}+(-sc)^{2}=s^{2}(a^{2}+c^{2})$, e questo deve valere $\lambda=a^{2}+c^{2}$: poiché $a^{2}+c^{2}>0$ si può cancellare, e resta $s^{2}=1$, cioè <b>$s=\pm1$</b>.</p>
    <p>I due casi:</p>
    <ul>
     <li>$s=1$: $(b,d)=(-c,a)$, cioè $A=\begin{pmatrix}a&-c\\c&a\end{pmatrix}$. Rinominando $c$ in $b$ si ottiene la prima forma dell&rsquo;enunciato;</li>
     <li>$s=-1$: $(b,d)=(c,-a)$, cioè $A=\begin{pmatrix}a&c\\c&-a\end{pmatrix}$, che è la seconda.</li>
    </ul>
    <p><b>La condizione $a^{2}+b^{2}>0$ è $\lambda>0$ riscritta</b>: in entrambi i casi $\lambda=a^{2}+b^{2}$, e chiedere che sia positivo è escludere la matrice nulla.</p>`},
    {label:'Le due componenti, separate dal determinante', body:R`
    <p>Il determinante distingue i due casi, e lo fa in modo che non si può aggirare:
    $$\det\begin{pmatrix}a&-b\\b&a\end{pmatrix}=a^{2}+b^{2}>0,\qquad\det\begin{pmatrix}a&b\\b&-a\end{pmatrix}=-a^{2}-b^{2}=-(a^{2}+b^{2})<0.$$
    <p>Il determinante è una funzione continua e non si annulla su $CO(2)$, quindi i due insiemi sono <b>aperti, chiusi e disgiunti</b> in $CO(2)$: sono le sue due componenti connesse. Quella dell&rsquo;identità è la prima, perché $\det\mathrm{Id}=1>0$, e si chiama $CO^{+}(2)$.</p>
    <p><b>Il conto del primo caso vale la pena vederlo per intero</b>, perché è il controllo che la parametrizzazione è giusta:
    $$\begin{pmatrix}a&-b\\b&a\end{pmatrix}^{T}\begin{pmatrix}a&-b\\b&a\end{pmatrix}=\begin{pmatrix}a^{2}+b^{2}&0\\0&a^{2}+b^{2}\end{pmatrix}=(a^{2}+b^{2})\,\mathrm{Id}_2,$$
    cioè $\lambda=a^{2}+b^{2}$, come anticipato.</p>`},
    {label:'La parametrizzazione globale', body:R`
    <p>La mappa
    $$\Psi:\mathbb{R}^{2}\setminus\{(0,0)\}\to CO^{+}(2),\qquad\Psi(x,y)=\begin{pmatrix}x&-y\\y&x\end{pmatrix}$$
    è biiettiva per il punto precedente, è liscia perché lineare nelle entrate, e la sua inversa è la restrizione delle funzioni coordinate $A\mapsto(a_{11},a_{21})$, anch&rsquo;esse lisce. Quindi <b>$\Psi$ è un diffeomorfismo</b> e $CO^{+}(2)$ ha una carta globale.</p>
    <p><b>Vale la pena riconoscere che cosa è questo oggetto</b>: identificando $\begin{pmatrix}x&-y\\y&x\end{pmatrix}$ con il numero complesso $x+iy$, la moltiplicazione di matrici diventa la moltiplicazione di complessi. Quindi $CO^{+}(2)\cong(\mathbb{C}^{*},\cdot)$, e il piano forato non è un caso: è $\mathbb{C}$ meno lo zero. Da qui anche la struttura $\mathbb{R}_{>0}\times SO(2)$, che è la forma polare.</p>
    <p><b>Una carta globale significa che $CO^{+}(2)$ è parallelizzabile</b> — come ogni gruppo di Lie, del resto — e il punto (vi) ne esibisce il riferimento globale.</p>`}
   ]},
  {t:'esercizio', title:'6 · (vi) I due campi invarianti a sinistra',
   src:'14 settembre 2026, punto (vi)',
   testo:R`Per $A=\begin{pmatrix}x&-y\\y&x\end{pmatrix}\in CO^{+}(2)$ si definiscono $X_A=\begin{pmatrix}x&-y\\y&x\end{pmatrix}$ e $Y_A=\begin{pmatrix}-y&-x\\x&-y\end{pmatrix}$. Verificare che $X_A,Y_A\in T_{CO(2),A}$ per ogni $A\in CO^{+}(2)$, e che le assegnazioni $A\mapsto X_A$ e $A\mapsto Y_A$ definiscono due <span class="str" data-str="campo-vettoriale">campi vettoriali</span> lisci.`,
   steps:[
    {label:'Da dove vengono quelle due matrici', body:R`
    <p>Non sono indovinate: sono la <b>traslazione a sinistra</b> di una base del tangente all&rsquo;identità. Per $n=2$ il punto (iv) dà $T_{CO(2),\mathrm{Id}}=\mathrm{Alt}(2,\mathbb{R})\oplus\mathbb{R}\,\mathrm{Id}_2$, che ha dimensione $1+1=2$ con base
    $$I=\mathrm{Id}_2=\begin{pmatrix}1&0\\0&1\end{pmatrix},\qquad J=\begin{pmatrix}0&-1\\1&0\end{pmatrix}.$$
    Allora $X_A=A\cdot I=A$ e $Y_A=A\cdot J$. Il secondo prodotto, svolto:
    $$\begin{pmatrix}x&-y\\y&x\end{pmatrix}\begin{pmatrix}0&-1\\1&0\end{pmatrix}=\begin{pmatrix}-y&-x\\x&-y\end{pmatrix},$$
    che è esattamente $Y_A$ dell&rsquo;enunciato. <b>È il passo 9 dello scheletro</b>, e la ragione per cui si fa così è che la traslazione a sinistra $L_A(Z)=AZ$ è un diffeomorfismo di $CO^{+}(2)$ il cui differenziale manda $T_{\mathrm{Id}}$ in $T_{A}$ — quindi trasportare una base dà una base, in ogni punto.</p>`},
    {label:'La tangenza, verificata direttamente', body:R`
    <p>Si può anche non invocare la traslazione e controllare a mano. Il tangente in $A$ è il nucleo di $d_AF$, e per $A\in CO^{+}(2)$, usando il differenziale del punto (ii):</p>
    $$d_AF(H)=0\iff H^{T}A+A^{T}H=\frac{2\operatorname{tr}(A^{T}H)}{2}\,\mathrm{Id}_2=\operatorname{tr}(A^{T}H)\,\mathrm{Id}_2.$$
    <p>Per $H=X_A=A$: $A^{T}A+A^{T}A=2\lambda\,\mathrm{Id}_2$ e $\operatorname{tr}(A^{T}A)=2\lambda$, quindi i due membri sono entrambi $2\lambda\,\mathrm{Id}_2$ e la condizione vale. Per $H=Y_A=AJ$: si ha $A^{T}(AJ)=\lambda J$, e $(AJ)^{T}A=J^{T}A^{T}A=\lambda J^{T}=-\lambda J$. La somma è nulla, e $\operatorname{tr}(A^{T}AJ)=\lambda\operatorname{tr}J=0$: la condizione vale di nuovo, con entrambi i membri nulli.</p>
    <p><b>Il meccanismo</b>: $X_A$ corrisponde alla direzione centrale (la dilatazione, parte simmetrica) e $Y_A$ a quella antisimmetrica (la rotazione). I due membri della condizione tangente si bilanciano in modi diversi nei due casi, e questo anticipa perché il commutatore si annullerà.</p>`},
    {label:'La liscezza, e il riferimento globale', body:R`
    <p>Nelle coordinate globali $(x,y)$ del punto (v), le entrate di $X_A$ e $Y_A$ sono <b>funzioni lineari</b> di $x$ e $y$. Un campo è liscio quando le sue componenti nella carta sono lisce, e qui sono polinomi di grado uno: quindi entrambi i campi sono lisci su tutto $CO^{+}(2)$.</p>
    <p>Letti come derivazioni nelle coordinate $(x,y)$ — un vettore tangente $\begin{pmatrix}u&-v\\v&u\end{pmatrix}$ corrisponde a $u\,\partial_x+v\,\partial_y$ per la parametrizzazione $\Psi$ — si ottiene
    $$X=x\,\frac{\partial}{\partial x}+y\,\frac{\partial}{\partial y},\qquad Y=-y\,\frac{\partial}{\partial x}+x\,\frac{\partial}{\partial y}.$$
    <p><b>Sono il campo radiale e il campo rotazionale</b>, e in ogni punto del piano forato sono indipendenti: la matrice delle componenti ha determinante $x\cdot x-y\cdot(-y)=x^{2}+y^{2}$, che sul piano forato è strettamente positivo. Quindi $(X,Y)$ è un <b>riferimento globale</b> e $T\,CO^{+}(2)\cong CO^{+}(2)\times\mathbb{R}^{2}$.</p>`}
   ]},
  {t:'plot', title:'I due campi invarianti di CO+(2), e perche commutano',
   intro:R`A sinistra il campo radiale $X$, a destra il rotazionale $Y$, sul piano forato che è $CO^{+}(2)$. L'origine è tolta: è l'unico punto dove entrambi si annullano, e non appartiene al gruppo.`,
   plots:[
    {kind:'phase', fx:'x', fy:'y', xr:[-2,2], yr:[-2,2], n:13, height:320,
     seeds:[[0.35,0.35],[-0.35,0.35],[0.35,-0.35],[-0.35,-0.35],[0.7,0.08],[-0.7,-0.08],[0.08,0.7]],
     title:'X: la dilatazione, cioe la direzione centrale dell’algebra'},
    {kind:'phase', fx:'-y', fy:'x', xr:[-2,2], yr:[-2,2], n:13, height:320,
     seeds:[[0.5,0],[1,0],[1.5,0],[0,0.8],[-1.2,0]],
     title:'Y: la rotazione, cioe la direzione antisimmetrica'}
   ],
   leggi:R`<b>Il flusso di $X$</b> è la moltiplicazione per il numero reale positivo $e^{t}$: porta ogni punto lungo il suo raggio. <b>Il flusso di $Y$</b> è la moltiplicazione per $e^{it}$: porta ogni punto lungo la sua circonferenza.<br><br>
   <b>Che cosa guardare, ed è la risposta al punto (vii) prima di fare il conto</b>: dilatare e poi ruotare, o ruotare e poi dilatare, porta allo stesso punto. Le due famiglie di curve sono <i>trasversali e indipendenti</i> — raggi contro cerchi — e questo rende le due operazioni intercambiabili. Il commutatore di due campi misura esattamente il difetto di questa intercambiabilità, quindi si annulla.<br><br>
   <b>E si legge perché l'origine va tolta</b>: è l'unico punto in cui i due campi non sono indipendenti, perché sono entrambi nulli. Un riferimento globale non sopravvive a un punto così, e infatti $\lambda(X)>0$ lo esclude dal gruppo.`},
  {t:'esercizio', title:'7 · (vii) Il commutatore, e perche viene zero',
   src:'14 settembre 2026, punto (vii)',
   testo:R`Calcolare il campo vettoriale $[X_A,Y_A]$.`,
   steps:[
    {label:'Il conto in coordinate', body:R`
    <p>Con $X=x\,\partial_x+y\,\partial_y$ e $Y=-y\,\partial_x+x\,\partial_y$, la <span class="str" data-str="parentesi-di-lie">parentesi</span> si calcola componente per componente con la formula $[X,Y]^{i}=X(Y^{i})-Y(X^{i})$:</p>
    <p><b>Prima componente</b>, $Y^{1}=-y$ e $X^{1}=x$:
    $$X(-y)-Y(x)=\big(x\partial_x+y\partial_y\big)(-y)-\big(-y\partial_x+x\partial_y\big)(x)=-y-(-y)=0.$$
    <p><b>Seconda componente</b>, $Y^{2}=x$ e $X^{2}=y$:
    $$X(x)-Y(y)=\big(x\partial_x+y\partial_y\big)(x)-\big(-y\partial_x+x\partial_y\big)(y)=x-x=0,$$
    quindi anche la seconda componente si annulla. In conclusione $[X,Y]=0$: <b>i due campi commutano</b>.</p>
    <p><b>L&rsquo;errore da evitare</b> è scambiare l&rsquo;ordine dentro un solo addendo: $[X,Y]^{1}$ è $X$ applicato alla <i>prima componente di $Y$</i> meno $Y$ applicato alla <i>prima componente di $X$</i>. Scritto male, questo conto dà $-2y$ e sembra plausibile.</p>`},
    {label:'Perche doveva venire zero, e cosa dice del gruppo', body:R`
    <p>Il motivo strutturale è che l&rsquo;algebra di Lie di $CO^{+}(2)$ è <b>abeliana</b>. Dal punto (iv) essa è $\mathrm{Alt}(2,\mathbb{R})\oplus\mathbb{R}\,\mathrm{Id}_2$; i multipli dell&rsquo;identità sono centrali — commutano con tutto — e $\mathrm{Alt}(2,\mathbb{R})$ ha dimensione uno, quindi commuta con se stesso. Un&rsquo;algebra generata da un elemento centrale e da un elemento solo non ha altro da commutare.</p>
    <p>Per campi <i>invarianti a sinistra</i> la parentesi si legge anche come commutatore di matrici nel tangente all&rsquo;identità: $[X,Y]$ corrisponde a $[I,J]=IJ-JI=J-J=0$, e si ottiene la stessa risposta senza passare per le coordinate. <b>Due conti indipendenti che danno zero</b>: è il controllo che il risultato non è un errore di segno.</p>
    <p><b>Il senso, ed è la ragione per cui Diverio chiede questo punto</b>: l&rsquo;abelianità dell&rsquo;algebra riflette che il gruppo è $\mathbb{C}^{*}$, commutativo. Su $CO(3)$ la stessa domanda darebbe una risposta diversa, perché $\mathfrak{so}(3)$ non è abeliana — e in quel caso il commutatore dei campi trasportati riproduce le relazioni del prodotto vettoriale. <b>Il commutatore dei campi invarianti è la commutatività del gruppo, letta all&rsquo;ordine infinitesimo.</b></p>`}
   ]}
]},

/* ---------------- 03c · GIRO PRIMO, LE DOMANDE GLOBALI ---------------- */
{ num:'07', title:'Giro primo — le tre domande globali: compattezza, SL(n), trasversalita', meta:'uccidere la compattezza con una successione · il tangente di SL(n) · la trasversalita per esibizione',
  blocchi:[
  {t:'esercizio', title:'8 · (viii) CO(n) non e compatto, per nessun n',
   src:'14 settembre 2026, punto (viii) — con il suggerimento del docente',
   testo:R`Dimostrare che $CO(n)$ non è <span class="str" data-str="compattezza">compatto</span> per alcun $n\ge1$.<br><br><i>Suggerimento del docente: cercare una successione illimitata — nella norma euclidea delle matrici — di matrici scalari appartenenti a $CO(n)$.</i>`,
   steps:[
    {label:'La successione, e il conto che la mette dentro', body:R`
    <p>Si prende $D_k=k\,\mathrm{Id}_n$ per $k\in\mathbb{N}_{>0}$. Appartiene al gruppo:
    $$(k\,\mathrm{Id}_n)^{T}(k\,\mathrm{Id}_n)=k^{2}\,\mathrm{Id}_n,$$
    cioè $D_k^{T}D_k=\lambda\,\mathrm{Id}_n$ con $\lambda=k^{2}>0$. Quindi $D_k\in CO(n)$ per ogni $k$ — ed è il motivo per cui <b>le matrici scalari sono sempre il controesempio giusto</b>: $CO(n)$ contiene l&rsquo;intero sottogruppo delle omotetie, che è illimitato per costruzione.</p>
    <p>La norma di Frobenius vale $\|D_k\|=k\sqrt{n}\to+\infty$. Quindi $CO(n)$ è un sottoinsieme <b>illimitato</b> di $M_n(\mathbb{R})\cong\mathbb{R}^{n^{2}}$, e un sottoinsieme illimitato di uno spazio euclideo non è compatto: se lo fosse, sarebbe chiuso e limitato per Heine-Borel.</p>`},
    {label:'Il confronto che rende il punto istruttivo', body:R`
    <p><b>$O(n)$ è compatto e $CO(n)$ no</b>, e la differenza è precisamente il $+1$ nella dimensione. Su $O(n)$ vale $X^{T}X=\mathrm{Id}$, quindi ogni colonna ha norma uno e $\|X\|=\sqrt n$ è <i>fissata</i>: il gruppo sta in una sfera. Su $CO(n)$ la relazione è $X^{T}X=\lambda\,\mathrm{Id}$ con $\lambda$ libero in $\mathbb{R}_{>0}$, e il fattore di scala scappa all&rsquo;infinito.</p>
    <p>In altre parole, $CO(n)\cong\mathbb{R}_{>0}\times O(n)$ e la non-compattezza viene tutta dal primo fattore: $\mathbb{R}_{>0}$ è diffeomorfo a $\mathbb{R}$ tramite il logaritmo, e <b>$\lambda:CO(n)\to\mathbb{R}_{>0}$ è l&rsquo;omomorfismo moltiplicativo trovato al punto (i)</b> — che qui torna utile, come annunciato. La sua immagine è illimitata, e una mappa continua su un compatto ha immagine compatta.</p>
    <p><b>Il metodo generale</b>: per uccidere la compattezza di un gruppo di matrici si cerca un parametro libero di scala. Se la relazione definente fissa le norme — come su $O(n)$, $SO(n)$, $V_k(\mathbb{R}^n)$ — il gruppo è compatto; se lascia uno scalare libero — $CO(n)$, $GL(n)$, $SL(n)$ per $n\ge2$ — non lo è.</p>`}
   ]},
  {t:'plot', title:'Perche O(2) e compatto e CO+(2) no: il fattore di scala',
   intro:R`$CO^{+}(2)$ e' il piano forato, e la funzione $\lambda(x,y)=x^{2}+y^{2}$ lo stratifica in circonferenze. A sinistra i suoi livelli; a destra il solo livello $\lambda=1$, che e' $SO(2)$.`,
   plots:[
    {kind:'contour', f:'x*x+y*y', levels:[0.25,1,2.25,4], xr:[-2.3,2.3], yr:[-2.3,2.3],
     height:300, col:'#5eead4',
     title:'i livelli di lambda su CO+(2): lambda = 0.25, 1, 2.25, 4'},
    {kind:'contour', f:'x*x+y*y', levels:[1], col:'#ff6b6b', label:'lambda = 1, cioe SO(2)',
     xr:[-2.3,2.3], yr:[-2.3,2.3], height:300,
     title:'il livello uno: compatto, e l’intersezione con SL(2,R)'}
   ],
   leggi:R`<b>A sinistra</b>: la mappa $\lambda:CO^{+}(2)\to\mathbb{R}_{>0}$ e' surgettiva, e le sue fibre sono circonferenze. Il livello cresce senza limite — <b>e' la successione $D_k=k\,\mathrm{Id}$ del punto (viii)</b>, che sta sulla fibra $\lambda=k^{2}$ e scappa all'infinito. Il gruppo e' diffeomorfo a $\mathbb{R}_{>0}\times SO(2)$, cioe' a una semiretta per una circonferenza, e la semiretta e' il motivo della non-compattezza.<br><br>
   <b>A destra</b> la sola fibra $\lambda=1$: e' $SO(2)$, una circonferenza, chiusa e limitata, quindi compatta. <b>Imporre $\det=1$ seleziona esattamente questa fibra</b> — e' il conto del punto (x), dove $\lambda^{n}=1$ con $\lambda>0$ forza $\lambda=1$.<br><br>
   <b>Che cosa portare via, ed e' il metodo e non l'esempio</b>: per decidere se un gruppo di matrici e' compatto si guarda se la relazione definente <i>fissa le norme</i>. Su $O(n)$ e su Stiefel le colonne sono ortonormali e la norma vale $\sqrt n$: il gruppo sta in una sfera. Su $CO(n)$ resta uno scalare libero, e quello scalare e' una direzione illimitata. La figura e' la stessa cosa disegnata: togliere i livelli diversi da uno trasforma un piano forato in una circonferenza.`},
  {t:'esercizio', title:'9 · (ix) Lo spazio tangente a SL(n,R)',
   src:'14 settembre 2026, punto (ix)',
   testo:R`Sapendo che $SL(n,\mathbb{R})=\{X\in M_n(\mathbb{R}):\det X=1\}$ è un&rsquo;ipersuperficie liscia, determinarne lo spazio tangente $T_{SL(n,\mathbb{R}),X}$ in un punto generico $X$.`,
   steps:[
    {label:'Il differenziale del determinante', body:R`
    <p>Si pone $G(X)=\det X-1$, così che $SL(n,\mathbb{R})=G^{-1}(0)$, e si deriva lungo $t\mapsto X+tH$. La formula da conoscere è
    $$d_XG(H)=\det(X)\,\operatorname{tr}(X^{-1}H),$$
    valida per $X$ invertibile. <b>Il modo rapido di ricordarla</b>: $\det(X+tH)=\det X\cdot\det(\mathrm{Id}+tX^{-1}H)$, e il determinante di $\mathrm{Id}+tM$ vale $1+t\operatorname{tr}M+O(t^{2})$, perché nello sviluppo di Laplace il termine lineare in $t$ raccoglie esattamente gli elementi diagonali di $M$.</p>
    <p>Verificato a mano per $n=2$ con $X=\begin{pmatrix}a&b\\c&d\end{pmatrix}$ e $H=\begin{pmatrix}h_{11}&h_{12}\\h_{21}&h_{22}\end{pmatrix}$: la derivata in $t=0$ di $\det(X+tH)$ è $a\,h_{22}-b\,h_{21}-c\,h_{12}+d\,h_{11}$, e lo stesso vale $\det(X)\,\operatorname{tr}(X^{-1}H)$.</p>`},
    {label:'Il tangente, e perche la condizione e quella', body:R`
    <p>Su $SL(n,\mathbb{R})$ si ha $\det X=1$, quindi $d_XG(H)=\operatorname{tr}(X^{-1}H)$ e
    $$T_{SL(n,\mathbb{R}),X}=\ker d_XG=\{H\in M_n(\mathbb{R})\ :\ \operatorname{tr}(X^{-1}H)=0\}.$$
    <p>È un <b>iperpiano</b> di $M_n(\mathbb{R})$: una sola equazione lineare, dimensione $n^{2}-1$. Coerente con «ipersuperficie».</p>
    <p><b>Nell&rsquo;identità</b> la condizione diventa $\operatorname{tr}H=0$, cioè $\mathfrak{sl}(n,\mathbb{R})$ è lo spazio delle matrici a traccia nulla — il fatto che si usa più spesso di tutti. E la forma in $X$ generico è quella traslata: $T_X=X\cdot\mathfrak{sl}(n,\mathbb{R})$, perché $\operatorname{tr}(X^{-1}H)=0$ equivale a $X^{-1}H\in\mathfrak{sl}$.</p>
    <p><b>Perché l&rsquo;esercizio dice «sapendo che è un&rsquo;ipersuperficie liscia»</b>: perché $1$ è valore regolare di $\det$ solo dove il differenziale non si annulla, e $d_XG=0$ richiederebbe $\det X\cdot\operatorname{tr}(X^{-1}H)=0$ per ogni $H$, impossibile se $X$ è invertibile — basta $H=X$, che dà $\operatorname{tr}\mathrm{Id}=n\neq0$. Su $SL(n)$ l&rsquo;invertibilità è garantita, quindi il criterio si applica in ogni punto.</p>`}
   ]},
  {t:'esercizio', title:'10 · (x) La trasversalita, e che l’intersezione e SO(n)',
   src:'14 settembre 2026, punto (x)',
   testo:R`Dimostrare che $CO(n)$ è trasversa a $SL(n,\mathbb{R})$ in ogni punto della loro intersezione, e dedurre che $CO(n)\cap SL(n,\mathbb{R})=SO(n)$ ne costituisce una sottovarietà liscia.`,
   steps:[
    {label:'Prima l’intersezione: il determinante fissa lambda', body:R`
    <p>Sia $X\in CO(n)\cap SL(n,\mathbb{R})$. Da $X^{T}X=\lambda\,\mathrm{Id}_n$, passando ai determinanti:
    $$\det(X^{T}X)=(\det X)^{2}=1,\qquad\det(\lambda\,\mathrm{Id}_n)=\lambda^{n},$$
    quindi $\lambda^{n}=1$. Poiché $\lambda>0$ è reale, l&rsquo;unica soluzione è <b>$\lambda=1$</b> — l&rsquo;equazione $\lambda^{n}=1$ ha altre radici, ma complesse o negative.</p>
    <p>Allora $X^{T}X=\mathrm{Id}_n$, cioè $X\in O(n)$, e insieme a $\det X=1$ si ottiene $X\in SO(n)$. Viceversa $SO(n)\subseteq CO(n)$ (con $\lambda=1$) e $SO(n)\subseteq SL(n,\mathbb{R})$, quindi
    $$CO(n)\cap SL(n,\mathbb{R})=SO(n).$$
    <p><b>Il conto delle dimensioni, come controllo</b>: $\dim CO(n)=\frac{n(n-1)}{2}+1$, $\dim SL(n)=n^{2}-1$, e in uno spazio di dimensione $n^{2}$ l&rsquo;intersezione trasversa ha dimensione $\big(\frac{n(n-1)}{2}+1\big)+(n^{2}-1)-n^{2}=\frac{n(n-1)}{2}$, che è esattamente $\dim SO(n)$. Il conto torna, e sarebbe stato il primo segnale di un errore.</p>`},
    {label:'La trasversalita, esibendo un vettore', body:R`
    <p>Trasversalità in $X$ significa $T_{CO(n),X}+T_{SL(n,\mathbb{R}),X}=M_n(\mathbb{R})$. Poiché $T_{SL(n,\mathbb{R}),X}$ è un <b>iperpiano</b>, la somma riempie tutto se e solo se $T_{CO(n),X}$ <i>non è contenuto</i> in quell&rsquo;iperpiano — e per mostrarlo basta esibire un vettore che sta nel primo e non nel secondo.</p>
    <p>I due spazi tangenti in $X\in SO(n)$, posto $A=X^{-1}H$:
    $$T_{SL(n,\mathbb{R}),X}=\{H:\operatorname{tr}A=0\},\qquad T_{CO(n),X}=\Big\{H:\ A+A^{T}=\frac{2\operatorname{tr}A}{n}\,\mathrm{Id}_n\Big\}.$$
    <p>La seconda forma si ottiene dal punto (iv) traslando, e su $SO(n)$ si semplifica perché $X^{T}=X^{-1}$.</p>
    <p><b>Si sceglie $A=\mathrm{Id}_n$, cioè $H=X$.</b> Sta in $T_{CO(n),X}$: $\mathrm{Id}+\mathrm{Id}=2\,\mathrm{Id}$ e $\frac{2\operatorname{tr}\mathrm{Id}}{n}\mathrm{Id}=\frac{2n}{n}\mathrm{Id}=2\,\mathrm{Id}$, i due membri coincidono. Non sta in $T_{SL(n,\mathbb{R}),X}$: $\operatorname{tr}\mathrm{Id}_n=n\neq0$.</p>
    <p>Quindi $T_{CO(n),X}\not\subseteq T_{SL(n,\mathbb{R}),X}$, la somma è tutto $M_n(\mathbb{R})$, e le due varietà si intersecano trasversalmente in ogni punto di $SO(n)$. Per il teorema sulle intersezioni trasverse, $SO(n)$ è una sottovarietà liscia di dimensione $\frac{n(n-1)}{2}$.</p>`},
    {label:'Che cosa sta dicendo questo punto, al di la del conto', body:R`
    <p>Il vettore scelto non è un trucco: $H=X$ è la direzione della <b>dilatazione</b>, cioè l&rsquo;unica direzione che $CO(n)$ ha in più di $O(n)$. E il determinante è precisamente la funzione che quella direzione fa variare — dilatare cambia il volume. <b>Quindi la trasversalità dice che il fattore di scala di $CO(n)$ è «visibile» al determinante</b>, e dovevamo aspettarcelo: se non lo fosse, l&rsquo;intersezione con $SL(n)$ sarebbe degenere.</p>
    <p><b>È così che si guarda un punto di trasversalità in queste prove</b>: non si prova a decidere se due spazi grandi si sommano a tutto, si cerca <i>la direzione che una delle due varietà ha e l&rsquo;altra no</i>. Nelle altre quattro prove la domanda finale è la stessa, con $SL(n,\mathbb{R})$ al posto del secondo fattore quasi sempre, e la direzione da esibire è sempre quella che l&rsquo;equazione dell&rsquo;iperpiano non annulla.</p>`}
   ]}
]},

/* ---------------- 04 · DOVE LO SCHELETRO SI PIEGA ---------------- */
{ num:'08', title:'Dove lo scheletro si piega: le altre quattro prove a confronto', meta:'cosa cambia da una prova all’altra · le tre varianti vere · cosa aspettarsi al prossimo appello',
  blocchi:[
  {t:'prosa', title:'Le quattro varianti, e quanto costano', tag:'sintesi', html:R`
  <p>Lo scheletro regge su tutte e cinque, ma in tre punti si piega, e sapere dove conviene.</p>
  <p><b>Prima variante — l&rsquo;oggetto non è un gruppo (26 gennaio).</b> Il luogo di rango $\Sigma_k=\{A:\operatorname{rk}A=k\}$ non è chiuso rispetto al prodotto, quindi i passi 1 e 9 cadono: niente sottogruppo, niente campi invarianti a sinistra. Al loro posto Diverio mette un&rsquo;<b>azione di gruppo</b>: $T(X)=P^{-1}XQ$ con $P,Q$ invertibili è un diffeomorfismo lineare che preserva $\Sigma_k$, e serve a trasportare il conto da un punto base a ogni altro punto. E al posto della definizione per $F^{-1}(0)$ c&rsquo;è una <b>carta a blocchi</b>: $\varphi\begin{pmatrix}B&C\\D&E\end{pmatrix}=E-DB^{-1}C$ sull&rsquo;aperto dove $B$ è invertibile. I campi vettoriali, al punto (ix), si danno a mano invece di trasportarli.</p>
  <p><b>Seconda variante — la prova ha due parti indipendenti (15 luglio).</b> Venti punti invece di dieci, su $O(p,q)$ e poi su un secondo oggetto. Non è una variante di metodo: è una variante di <i>tempo</i>, e cambia solo come si distribuiscono le tre ore e mezza.</p>
  <p><b>Terza variante — l&rsquo;arrivo è lo spazio delle antisimmetriche (24 giugno).</b> Per il gruppo simplettico, $F(X)=X^{T}\Omega X-\Omega$ con $\Omega$ antisimmetrica, quindi $F(X)^{T}=-F(X)$ e l&rsquo;arrivo è $\mathrm{Alt}(2n,\mathbb{R})$, di dimensione $\frac{2n(2n-1)}{2}$. Il passo 2 va rifatto con il segno giusto, e al passo 7 la condizione tangente in $\mathrm{Id}$ diventa <i>simmetrica</i> invece di antisimmetrica. <b>È l&rsquo;unico posto dove un segno sbagliato propaga fino alla dimensione</b>, e vale la pena rifare il punto (ii) due volte.</p>
  <p><b>Quarta — Stiefel, dove il tangente non è un&rsquo;algebra (18 febbraio).</b> $V_k(\mathbb{R}^n)$ con $k<n$ non è un gruppo (le matrici non sono quadrate), e i quattordici punti sono i più numerosi perché includono l&rsquo;identificazione $V_{n-1}(\mathbb{R}^n)\cong SO(n)$ e lo studio della compattezza con l&rsquo;argomento opposto a quello di $CO(n)$: lì le colonne sono ortonormali, la norma è fissata, e il gruppo è compatto.</p>`},
  {t:'prosa', title:'Che cosa aspettarsi, e che cosa non si puo prevedere', tag:'metodo', html:R`
  <p><b>Quello che si può dire.</b> Cinque appelli su cinque hanno la stessa struttura; i punti (i)-(iv) sono sempre i quattro passi generali in dimensione $n$; c&rsquo;è sempre una discesa a dimensione bassa nel mezzo; le ultime due o tre domande sono sempre compattezza e trasversalità, e l&rsquo;altra varietà è $SL(n,\mathbb{R})$ in tre casi su cinque. Il suggerimento del docente arriva sempre sul passo 5 e mai altrove.</p>
  <p><b>Quello che non si può dire</b>, e va detto invece di lasciarlo credere: cinque prove sono cinque, non cinquanta. Che lo scheletro sia una regola del docente e non una coincidenza di un anno è un&rsquo;inferenza su un campione di cinque, e l&rsquo;unico modo di rafforzarla è guardare gli appelli che verranno. Le prove 2017-18 e 2012-13 in banca dati sono di <i>altri docenti</i> dello stesso corso: possono servire come trapani sui singoli passi, ma non dicono niente sulla forma dello scritto di Diverio, e trattarle come se lo dicessero sarebbe prepararsi su un esame diverso.</p>
  <p><b>Il modo in cui questo movimento va usato per l&rsquo;esame</b> non è rileggerlo: è prendere la prova del 24 giugno, che qui non è svolta, e farla dall&rsquo;inizio alla fine con lo scheletro in mano. Se i sette passi meccanici vengono senza esitare, resta tempo per il passo 5, che è l&rsquo;unico dove serve.</p>`}
]},

/* ---------------- 05 · IL SENSO ---------------- */
{ num:'09', title:'Il senso, e le rotte', meta:'cosa lascia in mano, e cosa manca ancora',
  blocchi:[
  {t:'prosa', title:'Cosa lascia in mano', tag:'sintesi', html:R`
  <p><b>Il punto.</b> La prova scritta di questo corso non è un campionario di argomenti: è una macchina sola, applicata a un oggetto nuovo ogni volta. Chi la riconosce legge dieci domande come dieci risoluzioni della stessa, e il tempo smette di essere il problema.</p>
  <p><b>La gerarchia dei dieci passi</b>, che è la cosa più utile: sette sono meccanici e vanno automatizzati, tre chiedono di scegliere — la preimmagine, la parametrizzazione in dimensione bassa, il vettore da esibire per la trasversalità. Allenare i sette a costo zero è ciò che libera il tempo per i tre.</p>
  <p><b>Il primo giro è completo</b>: $CO(n)$, dieci punti su dieci, con i conti espliciti dove il docente li comprime e con i controlli di coerenza (la dimensione contata due volte, il commutatore calcolato in due modi) che dicono se un segno è andato perso.</p>`},
  {t:'prosa', title:'Cosa manca, e dove va', tag:'quadro', html:R`
  <p><b>Quattro giri su cinque non sono svolti</b>, e il motivo non è il tempo: tre delle cinque prove hanno le soluzioni del docente come <b>scansioni manoscritte</b> dentro il PDF, e dal testo non si estrae nulla. Si leggono come immagini, e sono una passata a sé — fatta male produrrebbe uno svolgimento inventato con addosso la data di un appello vero, che è esattamente la cosa da non fare.</p>
  <p><b>Le due prove con le soluzioni in chiaro sono $CO(n)$ (qui) e $O(p,q)$ (15 luglio).</b> Quest&rsquo;ultima è il secondo giro naturale, ed è anche la più ricca: venti punti in due parti, e la relazione definente $X^{T}I_{p,q}X=I_{p,q}$ fa funzionare il passo 5 in un modo leggermente diverso — $X^{T}I_{p,q}=I_{p,q}X^{-1}$ invece dell&rsquo;inversione diretta.</p>
  <p><b>I sei fogli di esercizi del 2025/26</b> non sono entrati qui, e sono il complemento giusto: contengono i trapani corti sui singoli passi — un differenziale da calcolare, una dimensione da contare, un campo da verificare liscio — cioè precisamente l&rsquo;allenamento dei sette passi meccanici che questo movimento dice di automatizzare.</p>`}
]}

];

var byId = {}; TAPPE.forEach(function(s){ byId[s.num]=s; });

var VKEY='pm-nucleogd-18-visited';
function loadSeen(){ try{ return new Set(JSON.parse(localStorage.getItem(VKEY)||'[]')); }catch(e){ return new Set(); } }
function saveSeen(s){ try{ localStorage.setItem(VKEY, JSON.stringify(Array.from(s))); }catch(e){} }
var SEEN = loadSeen();

function renderNav(active){
  var nav=document.getElementById('sidebar');
  nav.innerHTML='';
  var h=document.createElement('h2'); h.textContent='Nucleo gd-18 · le tappe'; nav.appendChild(h);
  TAPPE.forEach(function(s){
    var b=document.createElement('button');
    b.className='navitem'+(active===s.num?' active':'')+(SEEN.has(s.num)?' seen':'');
    b.innerHTML='<span class="dot"></span><span class="nx">'+s.num+'</span><span>'+s.title+'</span>';
    b.onclick=function(){ showTappa(s.num); };
    nav.appendChild(b);
  });
}

/* ---- renderer dei blocchi ---- */
function sectionProsa(title, tag, html){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var body=elFromHTML('<div class="open-body">'+html+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function sectionGram(title, rows){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag gramtag">grammatica</span></h3>';
  var inner='<table class="gramtab">';
  rows.forEach(function(r){ inner+='<tr><td class="gs">'+r[0]+'</td><td>'+r[1]+'</td></tr>'; });
  inner+='</table>';
  var body=elFromHTML('<div class="gramwrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
/* --- blocco PLOT: la figura non decora, si legge. Ogni plot porta una chiave di lettura. --- */
function sectionPlot(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
    var box=document.createElement('div'); box.className='plot-box';
    row.appendChild(box);
    if(window.PM_Plot) PM_Plot.render(box, s);
    else box.innerHTML='<div class="plot-err">motore-plot.js non caricato</div>';
  });
  wrap.appendChild(row);
  if(b.leggi){ var l=elFromHTML('<div class="plot-leggi"><b>Come si legge.</b> '+b.leggi+'</div>'); typeset(l); wrap.appendChild(l); }
  return wrap;
}
function sectionProlessi(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag protag">prolessi</span></h3>';
  var inner='<div class="prohead">&#9671; dove riappare, e con che nome</div>';
  inner+='<div class="pro-oggetto"><b>L&rsquo;oggetto:</b> '+b.oggetto+'</div>';
  inner+='<table class="protab">';
  b.rotte.forEach(function(r){ inner+='<tr><td class="pd">'+r.dove+'</td><td>'+r.txt+'</td></tr>'; });
  inner+='</table>';
  inner+='<div class="pro-domanda"><b>Domanda che non sai ancora rispondere.</b> '+b.domanda+'</div>';
  var body=elFromHTML('<div class="prowrap">'+inner+'</div>');
  typeset(body); wrap.appendChild(body); return wrap;
}
function revealBlock(steps){
  var wrap=document.createElement('div');
  var box=document.createElement('div'); box.className='rsteps'; wrap.appendChild(box);
  var idx=0;
  var btn=document.createElement('button'); btn.className='reveal-btn';
  function next(){
    if(idx>=steps.length) return;
    var s=steps[idx];
    var d=document.createElement('div'); d.className='rstep';
    d.innerHTML='<div class="rlabel">Passo '+(idx+1)+' · '+s.label+'</div>'+s.body;
    box.appendChild(d); typeset(d); idx++;
    if(idx>=steps.length){ btn.textContent='Tutti i passi rivelati'; btn.disabled=true; btn.classList.add('done'); }
    else { btn.textContent='Rivela il prossimo passo  ('+idx+'/'+steps.length+')'; }
  }
  btn.onclick=next; next(); wrap.appendChild(btn);
  return wrap;
}
function sectionReveal(title, tag, steps){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  wrap.appendChild(revealBlock(steps)); return wrap;
}
function sectionEsercizio(b){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+b.title+'<span class="tag">reveal progressivo</span></h3>';
  var testo=elFromHTML('<div class="testo"><span class="src">'+b.src+'</span>'+b.testo+'</div>');
  typeset(testo); wrap.appendChild(testo);
  wrap.appendChild(revealBlock(b.steps));
  if(b.nota){ var en=elFromHTML('<div class="esame-nota">'+b.nota+'</div>'); typeset(en); wrap.appendChild(en); }
  return wrap;
}
function collaudoBlock(items){
  var wrap=document.createElement('div');
  items.forEach(function(it,i){
    var c=document.createElement('div'); c.className='collaudo-item';
    var q=document.createElement('div'); q.className='cq'; q.innerHTML='<b>'+(i+1)+'.</b> '+it.q;
    var a=document.createElement('div'); a.className='ca'; a.style.display='none'; a.innerHTML='<b>Risposta.</b> '+it.a;
    var btn=document.createElement('button'); btn.className='reveal-btn small'; btn.textContent='Rivela risposta';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a); btn.disabled=true; btn.classList.add('done'); btn.textContent='Risposta rivelata'; };
    c.appendChild(q); typeset(q); c.appendChild(btn); c.appendChild(a); wrap.appendChild(c);
  });
  return wrap;
}
function sectionSvelabile(title, tag, html, sol){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+(tag?'<span class="tag">'+tag+'</span>':'')+'</h3>';
  var c=document.createElement('div'); c.className='collaudo-item';
  var q=document.createElement('div'); q.className='cq'; q.innerHTML=html||'';
  c.appendChild(q); typeset(q);
  if(sol){
    var a=document.createElement('div'); a.className='ca'; a.style.display='none';
    a.innerHTML='<b>Soluzione.</b> '+sol;
    var btn=document.createElement('button'); btn.className='reveal-btn small';
    btn.textContent='Rivela la soluzione';
    btn.onclick=function(){ a.style.display='block'; typeset(a); cablaStrumenti(a);
      btn.disabled=true; btn.classList.add('done'); btn.textContent='Soluzione rivelata'; };
    c.appendChild(btn); c.appendChild(a);
  }
  wrap.appendChild(c); return wrap;
}
function sectionCollaudo(title, items){
  var wrap=document.createElement('section'); wrap.className='section';
  wrap.innerHTML='<h3>'+title+'<span class="tag">provi, poi riveli</span></h3>';
  wrap.appendChild(collaudoBlock(items)); return wrap;
}

function prevNext(num){
  var idx=TAPPE.findIndex(function(s){ return s.num===num; });
  var wrap=document.createElement('div'); wrap.className='prevnext';
  var prev=document.createElement('button'); prev.className='pnbtn';
  if(idx>0){ var p=TAPPE[idx-1];
    prev.innerHTML='<span class="k">← Tappa '+p.num+'</span><span class="t">'+p.title+'</span>';
    prev.onclick=function(){ showTappa(p.num); };
  } else { prev.disabled=true; prev.innerHTML='<span class="k">inizio</span><span class="t">&nbsp;</span>'; }
  var next=document.createElement('button'); next.className='pnbtn next';
  if(idx<TAPPE.length-1){ var n=TAPPE[idx+1];
    next.innerHTML='<span class="k">Tappa '+n.num+' →</span><span class="t">'+n.title+'</span>';
    next.onclick=function(){ showTappa(n.num); };
  } else { next.disabled=true; next.innerHTML='<span class="k">fine del nucleo</span><span class="t">&nbsp;</span>'; }
  wrap.appendChild(prev); wrap.appendChild(next); return wrap;
}

function showTappa(num){
  var s=byId[num];
  SEEN.add(num); saveSeen(SEEN);
  renderNav(num);
  var m=document.getElementById('main'); m.innerHTML='';

  var head=elFromHTML('<div class="sfhead"><h1>'+s.num+' · '+s.title+'</h1><div class="meta">'+s.meta+'</div></div>');
  typeset(head); m.appendChild(head);

  s.blocchi.forEach(function(b){
    /* DUE SCHEMI, NON UNO — scoperto il 2026-10-06 provando le pagine vive. I movimenti
       scritti per primi (em-01..03, me-10b, i collaudi di gd-01..09 e di quattro em)
       usano una forma piu' semplice: `reveal` e `prolessi` con un solo `html`,
       `esercizio` e `collaudo` con `html` + `sol`. Il renderer ne conosceva una sola e
       chiamava `steps.forEach` su `undefined`: TypeError, e la tappa si fermava li' —
       62 blocchi in 17 movimenti su 74. Non si riscrive il contenuto per far contento
       il renderer: e' il renderer che deve leggere cio' che c'e'.
       E in fondo un ramo che NON muore: uno schema nuovo di domani deve far vedere un
       avviso in quella sezione, non spegnere la pagina sotto di se'. */
    try{
      if(b.t==='prosa')      m.appendChild(sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='gram')  m.appendChild(sectionGram(b.title,b.rows));
      else if(b.t==='prolessi') m.appendChild(b.rotte ? sectionProlessi(b)
                                   : sectionProsa(b.title,'prolessi',b.html));
      else if(b.t==='reveal')m.appendChild(b.steps ? sectionReveal(b.title,b.tag,b.steps)
                                   : sectionProsa(b.title,b.tag,b.html));
      else if(b.t==='esercizio') m.appendChild(b.steps ? sectionEsercizio(b)
                                   : sectionSvelabile(b.title,'esercizio',b.html,b.sol));
      else if(b.t==='collaudo')  m.appendChild(b.items ? sectionCollaudo(b.title,b.items)
                                   : sectionSvelabile(b.title,'provi, poi riveli',b.html,b.sol));
      else if(b.t==='plot')      m.appendChild(sectionPlot(b));
      else m.appendChild(sectionProsa(b.title||'(blocco)', 'tipo sconosciuto: '+b.t,
                                      b.html||''));
    }catch(err){
      var avv=document.createElement('section'); avv.className='section';
      avv.innerHTML='<h3>'+(b.title||'(blocco)')+'<span class="tag">non reso</span></h3>'
        +'<p style="color:#ff6b6b">Questo blocco non si &egrave; potuto rendere ('
        +b.t+': '+err.message+'). Il resto della tappa continua sotto.</p>';
      m.appendChild(avv);
    }
  });
  /* i titoli di sezione contengono formule: senza questo si leggono i dollari nudi */
  Array.prototype.forEach.call(m.querySelectorAll('section.section > h3'), typeset);

  /* I POP-UP DEGLI STRUMENTI. `cablaStrumenti` esisteva dal 18-09 e non la chiamava
     nessuno: i 229 rimandi del percorso erano <span> senza handler, e il clic non
     faceva niente. Nessun controllo poteva vederlo — la sintassi era valida, le schede
     c'erano tutte, le formule rendevano: il guasto esisteva solo a pagina viva. Qui, e
     dopo ogni inserimento successivo, perche' la tappa si rimonta da capo a ogni
     cambio e gli handler vanno riattaccati al DOM nuovo. */
  cablaStrumenti(m);

  /* anche i titoli delle tappe contengono formule: senza typeset i pulsanti
     avanti/indietro mostrano i dollari nudi */
  var pn=prevNext(num); m.appendChild(pn); typeset(pn);
  try{ history.replaceState(null,"","#"+num); }catch(e){}
  window.scrollTo(0,0);
}

/* deep-link: gd-18-prove-desame.html#03 apre direttamente la tappa 03 */
window.addEventListener('DOMContentLoaded', function(){
  var h=(location.hash||'').replace('#','');
  showTappa(byId[h]?h:'00');
});
window.addEventListener('hashchange', function(){
  var h=(location.hash||'').replace('#','');
  if(byId[h]) showTappa(h);
});
</script>
