<style>
  :root{
    --bg:#0e1117; --panel:#161b22; --panel2:#1c232d; --border:#2b333d;
    --txt:#eef3f8; --muted:#b9c4d1; --accent:#4c8dff; --accent2:#8fb0ff;
    --ok:#2ea043; --okbg:#10331b; --warn:#d8a13a; --warnbg:#332a10;

    --pro:#b98cff; --probg:#1a1430; --proline:#2a2247; --proedge:#3a2d5c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    font-size:17px;line-height:1.55;}
  a{color:var(--accent2);}
  .banner{background:var(--panel2);border-bottom:1px solid var(--border);color:var(--muted);
    font-size:.8rem;font-weight:600;text-align:center;padding:8px 12px;letter-spacing:.3px;}
  .banner b{color:var(--accent2);}
  .shell{display:flex;max-width:1180px;margin:0 auto;align-items:flex-start;}

  /* ---- SIDEBAR ---- */
  .sidebar{width:280px;flex:0 0 280px;padding:20px 12px 60px;position:sticky;top:0;
    max-height:100vh;overflow-y:auto;border-right:1px solid var(--border);}

  .navitem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:none;
    background:transparent;color:var(--txt);padding:9px 10px;border-radius:8px;cursor:pointer;
    font-size:.9rem;transition:.12s;border:1px solid transparent;}
  .navitem:hover{background:var(--panel2);}
  .navitem.active{background:#13233f;border-color:var(--accent);color:#fff;}
  .navitem .dot{width:7px;height:7px;border-radius:50%;background:transparent;flex:0 0 7px;
    border:1px solid var(--border);}
  .navitem.seen .dot{background:var(--ok);border-color:var(--ok);}
  .navitem .nx{color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto;}

  /* ---- MAIN ---- */
  .main{flex:1 1 auto;min-width:0;padding:24px 30px 90px;max-width:860px;}
  h1{font-size:1.5rem;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:.92rem;margin:0 0 18px;}
  .sfhead{border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:8px;}
  .sfhead h1{font-size:1.55rem;}
  .meta{color:var(--muted);font-size:.82rem;margin-top:6px;}

  .section{margin:26px 0;}
  .section > h3{font-size:1.02rem;color:var(--accent2);margin:0 0 10px;
    display:flex;align-items:center;gap:10px;}
  .section > h3 .tag{font-size:.66rem;font-weight:700;letter-spacing:.4px;background:var(--panel2);
    border:1px solid var(--border);color:var(--muted);padding:2px 8px;border-radius:20px;
    text-transform:uppercase;}
  /* --- blocchi figura --- */
  .section > h3 .tag.plottag{background:#101f2e;border-color:#1f3c57;color:#7ab8e0;}
  .plot-intro{color:var(--muted);font-size:.95rem;margin:0 0 12px;}
  .plot-row{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;
    background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;}
  .plot-row.due .plot-box{flex:1 1 300px;min-width:280px;}
  .plot-box{max-width:560px;}
  .plot-leggi{margin-top:10px;background:var(--panel2);border:1px solid var(--border);
    border-left:3px solid #4a8fc7;border-radius:0 10px 10px 0;padding:11px 14px;
    font-size:.93rem;color:var(--muted);}
  .plot-leggi b{color:#7ab8e0;}
  .plot-err{color:#ff6b6b;font-size:.85rem;}
  /* --- figure importate da una dispensa del docente ---
     Stesso vestito dei plot nativi, di proposito: la figura viene dal suo PDF ma e'
     stata ri-colorata sulla nostra tavolozza da `figure-da-pdf.py`, e deve sembrare di
     casa invece che incollata. La riga `fonte` dice sempre da dove viene. */
  .fig-nota{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px;margin:14px 0;text-align:center;}
  .fig-nota img{max-width:100%;height:auto;}
  .fig-nota figcaption{margin-top:10px;background:var(--panel2);border:1px solid var(--border);
    border-left:3px solid #4a8fc7;border-radius:0 10px 10px 0;padding:11px 14px;
    font-size:.93rem;color:var(--muted);text-align:left;}
  .fig-nota figcaption b{color:#7ab8e0;}
  .fig-nota .fonte{display:block;margin-top:8px;font-size:.78rem;color:var(--muted);

  .open-body{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}

  .open-body ul{margin:.4em 0;padding-left:1.2em;} .open-body li{margin:.35em 0;}

  .note{background:var(--panel2);border-left:3px solid var(--muted);border-radius:6px;
    padding:9px 12px;margin:12px 0;font-size:.9rem;color:var(--muted);}
  .note b{color:#ff9d6b;}
  .note.warn{background:var(--warnbg);border-left-color:var(--warn);color:#e0b85a;}
  .note.warn b{color:#f0c25a;}

  /* ---- GRAMMATICA ---- */
  .gramwrap{background:var(--grambg);border:1px solid #1f4d47;border-radius:12px;padding:6px 6px;}
  table.gramtab{border-collapse:collapse;width:100%;font-size:.92rem;}
  table.gramtab td{padding:9px 12px;vertical-align:top;border-bottom:1px solid #17332e;}
  table.gramtab tr:last-child td{border-bottom:none;}
  table.gramtab td.gs{white-space:nowrap;color:var(--gram);width:1%;
    border-right:1px solid #17332e;font-variant-numeric:tabular-nums;}
  .section > h3 .tag.gramtag{background:var(--grambg);border-color:#1f4d47;color:var(--gram);}

  /* ---- STRUMENTI (repertorio condiviso: la scheda si apre DENTRO la frase) ----
     Nessun accento nuovo: riusa il verde della grammatica, perche' uno strumento
     richiamato e' grammatica gia' spiegata altrove, non una quinta specie di blocco. */
  .str{color:var(--gram);border-bottom:1px dashed var(--gram);cursor:pointer;}
  .str:hover{background:var(--grambg);}
  .str::after{content:"\2666";font-size:.62em;vertical-align:.42em;margin-left:2px;opacity:.8;}
  .str.aperto::after{content:"\2715";}
  .str.rotto{color:#ff6b6b;border-bottom-color:#ff6b6b;cursor:help;}
  /* la scheda e' uno SPAN in display:block, non un div: i rimandi cadono dentro
     <p>, <li> e celle di tabella, dove un div e' HTML illegale. */
  .strcard{display:block;margin:10px 0;background:var(--grambg);border:1px solid #1f4d47;
    border-left:3px solid var(--gram);border-radius:0 10px 10px 0;padding:10px 14px;font-size:.9rem;}
  .strcard .sh{display:block;font-size:.66rem;font-weight:700;letter-spacing:.5px;
    text-transform:uppercase;color:var(--gram);margin-bottom:7px;}
  .strcard .sr{display:block;margin:5px 0;}
  .strcard .sk{color:var(--gram);font-weight:600;}

  /* ---- PROLESSI (preannuncio fisico) ---- */
  .prowrap{background:var(--probg);border:1px solid var(--proedge);border-radius:12px;padding:4px 4px 8px;}
  .prohead{padding:11px 14px 4px;color:var(--pro);font-size:.72rem;font-weight:700;letter-spacing:.7px;
    text-transform:uppercase;}
  .pro-oggetto{padding:2px 14px 11px;color:var(--muted);font-size:.92rem;border-bottom:1px solid var(--proline);
    margin-bottom:2px;} .pro-oggetto b{color:var(--txt);}
  table.protab{border-collapse:collapse;width:100%;font-size:.92rem;}
  table.protab td{padding:10px 12px;vertical-align:top;border-bottom:1px solid var(--proline);}
  table.protab tr:last-child td{border-bottom:none;}
  table.protab td.pd{white-space:nowrap;color:var(--pro);width:1%;font-weight:700;font-size:.78rem;
    letter-spacing:.3px;text-transform:uppercase;border-right:1px solid var(--proline);line-height:1.3;}
  .pro-domanda{margin:8px 8px 2px;background:#140d26;border:1px solid var(--proedge);
    border-left:3px solid var(--pro);border-radius:8px;padding:10px 14px;font-size:.92rem;}
  .pro-domanda b{color:var(--pro);}
  .section > h3 .tag.protag{background:var(--probg);border-color:var(--proedge);color:var(--pro);}

  /* ---- REVEAL ---- */
  .rsteps{display:flex;flex-direction:column;gap:12px;}
  .rstep{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 18px;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .rlabel{font-size:.7rem;font-weight:700;letter-spacing:.4px;color:var(--accent);
    text-transform:uppercase;margin-bottom:8px;}
  .rstep p:first-of-type{margin-top:0;} .rstep p:last-child{margin-bottom:0;}
  .rstep ul{margin:.4em 0;padding-left:1.2em;}
  .testo{background:#13233f;border:1px solid #2b4877;border-radius:12px;padding:14px 18px;margin-bottom:14px;}
  .testo .src{display:block;font-size:.74rem;font-style:italic;color:var(--accent2);margin-bottom:8px;
    text-transform:uppercase;letter-spacing:.3px;}
  .esame-nota{font-size:.9rem;color:var(--muted);font-style:italic;margin-top:12px;padding-left:12px;
    border-left:3px solid var(--border);}

  .reveal-btn{background:var(--accent);color:#fff;border:none;padding:11px 18px;border-radius:10px;
    font-size:.95rem;font-weight:600;cursor:pointer;margin-top:14px;transition:.12s;}
  .reveal-btn:hover:not(:disabled){background:var(--accent2);}
  .reveal-btn.small{padding:7px 14px;font-size:.85rem;margin-top:0;background:var(--panel2);
    color:var(--accent2);border:1px solid var(--border);}
  .reveal-btn.small:hover:not(:disabled){border-color:var(--accent);}
  .reveal-btn:disabled,.reveal-btn.done{background:var(--panel2);color:var(--muted);
    border:1px solid var(--border);cursor:default;}

  /* ---- COLLAUDO ---- */
  .collaudo-item{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 18px;margin-bottom:12px;}
  .cq{margin-bottom:10px;}
  .ca{margin-top:12px;background:var(--okbg);border:1px solid #235c33;border-radius:8px;
    padding:10px 14px;font-size:.94rem;}
  .ca b{color:#5fd980;}

  /* ---- PREV / NEXT ---- */
  .prevnext{display:flex;justify-content:space-between;gap:12px;margin-top:40px;
    border-top:1px solid var(--border);padding-top:20px;}
  .pnbtn{flex:1 1 0;background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:12px 16px;cursor:pointer;color:var(--txt);text-align:left;transition:.14s;font:inherit;}
  .pnbtn:hover{border-color:var(--accent);background:var(--panel2);}
  .pnbtn.next{text-align:right;}
  .pnbtn .k{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .pnbtn .t{font-weight:600;color:var(--accent2);}
  .pnbtn:disabled{opacity:.35;cursor:default;border-color:var(--border);background:var(--panel);}

  code{background:var(--panel2);border:1px solid var(--border);border-radius:5px;
    padding:1px 5px;font-size:.85em;color:var(--accent2);}
  .katex{font-size:1.02em;color:var(--txt);} .katex-display{margin:.5em 0;overflow-x:auto;overflow-y:hidden;}

  @media(max-width:860px){
    .shell{flex-direction:column;}
    .sidebar{width:100%;flex:none;position:static;max-height:none;border-right:none;
      border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:4px;}
    .sidebar h2{width:100%;} .navitem{width:auto;}
    .main{padding:20px 16px 80px;}
  }
</style>

/* ===================================================================

   Uno strumento matematico si spiega UNA VOLTA SOLA, in una scheda che
   vive in strumenti/<id>.json, e ogni movimento ci si aggancia con un
   rimando scritto nella prosa:

       <span class="str" data-str="serie-geometrica">la serie geometrica</span>

   Apertura: lo stesso gesto del collaudo (si clicca, il pannello compare,

var CORSO = 'geometria-differenziale';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["valore-regolare"] = {"nome":"Valore regolare","riga":"$c$ e un valore regolare di $F:M\\to N$ quando il differenziale $dF_p$ e surgettivo in ogni punto di $F^{-1}(c)$, e in quel caso $F^{-1}(c)$ e una sottovarieta di dimensione $\\dim M-\\dim N$.","serve":"a riconoscere una sottovarieta senza esibire carte: si scrive l'insieme come luogo di zeri, si deriva, e si controlla che il differenziale non degeneri. E il criterio operativo per eccellenza, perche gli insiemi interessanti arrivano quasi sempre dati da equazioni. Attenzione al quantificatore: la richiesta e su tutti i punti della fibra, non su un punto scelto bene, e un valore non e regolare quando anche un solo punto della sua controimmagine e critico. Un valore fuori dall'immagine e regolare per vacuita, e la fibra vuota conta come sottovarieta.","esempio":"La sfera $S^2$ come fibra di $F(x,y,z)=x^2+y^2+z^2$. Le derivate parziali sono $\\partial_xF=2x$, $\\partial_yF=2y$, $\\partial_zF=2z$, dunque $dF_p=(2x,2y,2z)$ si annulla solo nell'origine, che sta in $F^{-1}(0)$ e non in $F^{-1}(1)$. Quindi $1$ e un valore regolare e la fibra $F^{-1}(1)$, che e la sfera, e una sottovarieta di dimensione $3-1=2$; mentre $0$ non lo e, e infatti $F^{-1}(0)$ e un punto solo. Lo stesso conto su $SL(2,\\mathbb{R})=\\det^{-1}(1)$: con $\\det=ad-bc$ si ha $\\partial_a\\det=d$, e nell'identita il differenziale vale $(1,0,0,1)\\neq0$, dunque $SL(2,\\mathbb{R})$ e una sottovarieta di $\\mathbb{R}^4$ di dimensione $4-1=3$.","pieno":{"file":"gd-08-valori-regolari.html","tappa":"02","come":"il teorema del valore regolare, l'uso in tre righe, e i gruppi di matrici"},"controllo":[{"tipo":"derivata","espr":"x**2+y**2+z**2","rispetto":["x"],"vale":"2*x","dove":"esempio","appare":"\\partial_xF=2x"},{"tipo":"derivata","espr":"x**2+y**2+z**2","rispetto":["y"],"vale":"2*y","dove":"esempio","appare":"\\partial_yF=2y"},{"tipo":"derivata","espr":"x**2+y**2+z**2","rispetto":["z"],"vale":"2*z","dove":"esempio","appare":"\\partial_zF=2z"},{"tipo":"uguale","sinistra":"3-1","vale":"2","dove":"esempio","appare":"3-1=2"},{"tipo":"derivata","espr":"a*d-b*c","rispetto":["a"],"vale":"d","dove":"esempio","appare":"\\partial_a\\det=d"},{"tipo":"uguale","sinistra":"4-1","vale":"3","dove":"esempio","appare":"4-1=3"}]};
STRUM["sommersione"] = {"nome":"Sommersione","riga":"Un'applicazione liscia $F:M\\to N$ il cui differenziale e surgettivo in ogni punto, cosa che richiede $\\dim M\\ge\\dim N$ e rende ogni fibra una sottovarieta.","serve":"a schiacciare una varieta su una di dimensione minore senza perdere struttura: in coordinate adatte una sommersione e sempre la proiezione $(x_1,\\dots,x_m)\\mapsto(x_1,\\dots,x_n)$, e questo rende locale ogni domanda su di essa. E la meta in uscita della coppia immersione/sommersione: l'immersione inietta il tangente, la sommersione lo proietta. Insieme danno il teorema del rango costante, che riduce lo studio locale di qualunque mappa di rango fisso a un'unica forma normale.","esempio":"$F:\\mathbb{R}^3\\to\\mathbb{R}^2$, $F(x,y,z)=(x^2+y^2+z^2-1,\\ z)$. Le due righe della jacobiana sono $(2x,2y,2z)$ e $(0,0,1)$, perche $\\partial_x(x^2+y^2+z^2-1)=2x$ e la seconda componente dipende da $z$ sola. Il minore sulle colonne $x$ e $z$ ha determinante $2x$: dove $x\\neq0$ il rango e $2$ e $F$ e una sommersione. Nel punto $(1,0,0)$ quel determinante vale $2$, quindi li $F$ e sommersione e la fibra $F^{-1}(0,0)$, la circonferenza equatoriale nel piano $z=0$, e una sottovarieta di dimensione $3-2=1$.","pieno":{"file":"gd-06-spazio-tangente.html","tappa":"08","come":"immersioni, sommersioni e il teorema del rango costante, con la forma normale"},"controllo":[{"tipo":"derivata","espr":"x**2+y**2+z**2-1","rispetto":["x"],"vale":"2*x","dove":"esempio","appare":"\\partial_x(x^2+y^2+z^2-1)=2x"},{"tipo":"uguale","sinistra":"Matrix([[2*x,2*z],[0,1]]).det()","vale":"2*x","dove":"esempio","appare":"ha determinante $2x$"},{"tipo":"uguale","sinistra":"Matrix([[2*1,2*0],[0,1]]).det()","vale":"2","dove":"esempio","appare":"quel determinante vale $2$"},{"tipo":"uguale","sinistra":"3-2","vale":"1","dove":"esempio","appare":"3-2=1"}]};
STRUM["parentesi-di-lie"] = {"nome":"Parentesi di Lie","riga":"$[X,Y]f=X(Yf)-Y(Xf)$: il commutatore di due campi vettoriali, che resta un campo vettoriale perche i termini del secondo ordine si cancellano.","serve":"a misurare se due flussi commutano. Trascinare un punto lungo $X$ e poi lungo $Y$ non da in generale lo stesso risultato dell'ordine inverso, e $[X,Y]$ e il difetto di chiusura di quel quadratino al primo ordine non banale. Da qui due usi: $[X,Y]=0$ se e solo se i flussi commutano, e quindi se e solo se i due campi si possono usare come coordinate; e la parentesi fa dei campi vettoriali un'algebra di Lie, la struttura che ricompare dentro ogni gruppo di simmetria.","esempio":"Siano $X=y\\dfrac{\\partial}{\\partial x}$ e $Y=x\\dfrac{\\partial}{\\partial y}$, i due tagli elementari del piano, e si calcoli su $f=x^2y$. Da una parte $Yf=x\\cdot x^2=x^3$ e dunque $X(Yf)=y\\cdot3x^2=3x^2y$; dall'altra $Xf=y\\cdot2xy=2xy^2$ e dunque $Y(Xf)=x\\cdot4xy=4x^2y$. La differenza e $3x^2y-4x^2y=-x^2y$. Lo stesso valore si ottiene applicando a $f$ il campo $[X,Y]=y\\dfrac{\\partial}{\\partial y}-x\\dfrac{\\partial}{\\partial x}$, cioe $y\\cdot x^2-x\\cdot 2xy=-x^2y$: le due strade coincidono, e il risultato e del primo ordine, perche i termini in $\\partial^2$ si sono cancellati.","pieno":{"file":"gd-12-parentesi-lie.html","tappa":"01","come":"la parentesi come commutatore, e perche resta del primo ordine"},"controllo":[{"tipo":"uguale","sinistra":"x*diff(x**2*y,y)","vale":"x**3","dove":"esempio","appare":"Yf=x\\cdot x^2=x^3"},{"tipo":"uguale","sinistra":"y*diff(x**2*y,x)","vale":"2*x*y**2","dove":"esempio","appare":"Xf=y\\cdot2xy=2xy^2"},{"tipo":"uguale","sinistra":"y*diff(x*diff(x**2*y,y),x)","vale":"3*x**2*y","dove":"esempio","appare":"X(Yf)=y\\cdot3x^2=3x^2y"},{"tipo":"uguale","sinistra":"x*diff(y*diff(x**2*y,x),y)","vale":"4*x**2*y","dove":"esempio","appare":"Y(Xf)=x\\cdot4xy=4x^2y"},{"tipo":"uguale","sinistra":"3*x**2*y-4*x**2*y","vale":"-x**2*y","dove":"esempio","appare":"3x^2y-4x^2y=-x^2y"},{"tipo":"uguale","sinistra":"y*diff(x**2*y,y)-x*diff(x**2*y,x)","vale":"-x**2*y","dove":"esempio","appare":"y\\cdot x^2-x\\cdot 2xy=-x^2y"}]};
STRUM["compattezza"] = {"nome":"Compattezza","riga":"Ogni ricoprimento aperto ammette un sottoricoprimento finito: è la proprietà che permette di passare da «vale vicino a ogni punto» a «vale su tutto», con un numero finito di passi.","serve":"È l'ipotesi che rende globali le conclusioni locali, ed è per questo che ricorre in ogni dimostrazione di geometria differenziale. In $\\mathbb{R}^n$ equivale a chiuso e limitato (Heine-Borel), ma su una varietà quell'equivalenza non si può usare come definizione, perché «limitato» richiede una distanza e una varietà non ne ha una privilegiata. La conseguenza che si usa più spesso è negativa: gli unici sottoinsiemi di $\\mathbb{R}^n$ che sono **insieme** aperti e compatti sono $\\emptyset$ e nient'altro — ed è l'argomento per cui una varietà compatta non può essere coperta da una sola carta.","esempio":"L'intervallo $(0,1)$ non è compatto, e si vede esibendo un ricoprimento senza sottoricoprimento finito: gli aperti $A_n=\\left(\\tfrac1n,1\\right)$ per $n\\ge2$ ricoprono $(0,1)$, perché ogni $x\\gt0$ sta in $A_n$ appena $\\tfrac1n\\lt x$, cioè appena $n\\gt1/x$. Ma una sottofamiglia finita $A_{n_1},\\dots,A_{n_k}$ ha un indice massimo $N$, quindi la sua unione è $\\left(\\tfrac1N,1\\right)$, e il punto $x=\\tfrac1{2N}$ resta fuori: è positivo, dunque sta in $(0,1)$, ed è minore di $\\tfrac1N$. Il conto che regge l'argomento è $\\lim_{n\\to\\infty}\\tfrac1n=0$: gli $A_n$ si avvicinano a coprire tutto, ma nessuno di essi contiene un intorno di $0$, e servirebbero tutti. Chiudendo l'intervallo, $[0,1]$ diventa compatto e quel ricoprimento smette di essere un ricoprimento — $0$ non sta in nessun $A_n$.","debito":"la dimostrazione del teorema di Heine-Borel e la teoria generale degli spazi compatti stanno fuori dal percorso: qui c'è l'uso che se ne fa. Nel corso di Diverio la compattezza entra come ipotesi (sfera, gruppi di Lie compatti) e come conclusione della locale compattezza delle varietà.","controllo":[{"tipo":"limite","espr STRUM["traccia"] = {"nome":"Traccia di un operatore","riga":"La traccia e' la somma degli elementi diagonali, $\\operatorname{tr}\\hat A=\\sum_i\\langle i|\\hat A|i\\rangle$, e non dipende dalla base ortonormale scelta perche' e' invariante per permutazione ciclica: $\\operatorname{tr}(\\hat A\\hat B)=\\operatorname{tr}(\\hat B\\hat A)$, da cui $\\operatorname{tr}(\\hat U^{\\dagger}\\hat A\\hat U)=\\operatorname{tr}\\hat A$.","serve":"E' il modo di estrarre un numero da un operatore senza privilegiare una rappresentazione. Il valor medio di un'osservabile su uno stato si scrive $\\langle A\\rangle=\\operatorname{tr}(\\rho\\hat A)$ con $\\rho=|\\psi\\rangle\\langle\\psi|$, e questa forma — a differenza di $\\langle\\psi|\\hat A|\\psi\\rangle$ — vale identica per gli stati misti, dove $\\rho$ non e' piu' un proiettore: e' la porta verso la matrice densita' e la decoerenza.","esempio":"Per $A=\\begin{pmatrix}1&2\\\\3&4\\end{pmatrix}$ e $B=\\begin{pmatrix}0&1\\\\1&0\\end{pmatrix}$, pur essendo $AB\\neq BA$, le due tracce coincidono: $AB=\\begin{pmatrix}2&1\\\\4&3\\end{pmatrix}$ da' $\\operatorname{tr}(AB)=2+3=5$, mentre $BA=\\begin{pmatrix}3&4\\\\1&2\\end{pmatrix}$ da' $\\operatorname{tr}(BA)=3+2=5$. La traccia di un proiettore di rango uno vale $1$, e in generale la traccia di un proiettore e' la dimensione del sottospazio su cui proietta.","debito":"la traccia di un operatore in dimensione infinita esiste solo per la classe degli operatori a traccia (totalmente continui), e la costruzione rigorosa — $\\operatorname{tr}(\\hat A^{\\dagger}\\hat A)=\\sum_\\mu\\|\\hat A\\phi_\\mu\\|^2$ indipendente dalla base, von Neumann cap. II.11 — qui si cita. Si lavora col caso in cui la somma converge.","controllo":[{"tipo":"uguale","sinistra":"(Matrix([[1,2],[3,4]])*Matrix([[0,1],[1,0]])).trace()","vale":"5","dove":"esempio","appare":"\\operatorname{tr}(AB)=2+3=5"},{"tipo":"uguale","sinistra":"(Matrix([[0,1],[1,0]])*Matrix([[1,2],[3,4]])).trace()","vale":"5","dove":"esempio","appare":"\\operatorname{tr}(BA)=3+2=5"},{"tipo":"uguale","sinistra":"Matrix([[1,2],[3,4]])*Matrix([[0,1],[1,0]])","vale":"Matrix([[2,1],[4,3]])","dove":"esempio","appare":"AB=\\begin{pmatrix}2&1\\\\4&3\\end{pmatrix}"},{"tipo":"uguale","sinistra":"Matrix([[0,1],[1,0]])*Matrix([[1,2],[3,4]])","vale":"Matrix([[3,4],[1,2]])","dove":"esempio","appare":"BA=\\begin{pmatrix}3&4\\\\1&2\\end{pmatrix}"}],"qui":{},"pieno":null};
STRUM["gruppo-di-lie"] = {"nome":"Gruppo di Lie","riga":"Una varieta differenziabile che e anche un gruppo, e in cui il prodotto $(g,h)\\mapsto gh$ e l'inverso $g\\mapsto g^{-1}$ sono applicazioni lisce.","serve":"a trattare insieme due strutture che di solito si studiano separate: la simmetria (il gruppo) e il calcolo differenziale (la varieta). La conseguenza che si usa di piu e l'omogeneita: le traslazioni $L_g(x)=gx$ sono diffeomorfismi, quindi ogni punto ha un intorno diffeomorfo a quello dell'identita, e tutto cio che si dimostra nell'identita si trasporta ovunque gratis. Da qui seguono due fatti usati continuamente: ogni gruppo di Lie e parallelizzabile, e per conoscerne la geometria infinitesima basta lo spazio tangente in un punto solo, che si chiama la sua algebra di Lie.","esempio":"Il gruppo delle rotazioni del piano $SO(2)$ e la circonferenza. Una sua matrice e $R(\\theta)=\\begin{pmatrix}\\cos\\theta & -\\sin\\theta\\\\ \\sin\\theta & \\cos\\theta\\end{pmatrix}$, e che il determinante valga $1$ si verifica subito: $\\cos^2\\theta+\\sin^2\\theta=1$. Il prodotto e liscio perche in coordinate e l'addizione degli angoli — svolgendo la riga in alto del prodotto $R(\\alpha)R(\\varphi)$ si trova $\\cos\\alpha\\cos\\varphi-\\sin\\alpha\\sin\\varphi=\\cos(\\alpha+\\varphi)$ e $\\sin\\alpha\\cos\\varphi+\\cos\\alpha\\sin\\varphi=\\sin(\\alpha+\\varphi)$, cioe $R(\\alpha)R(\\varphi)=R(\\alpha+\\varphi)$ — e l'inverso e $R(-\\theta)$, liscio in $\\theta$. La varieta sottostante e $S^1$, di dimensione $1$.","pieno":{"file":"gd-14-gruppi-di-lie.html","tappa":"01","come":"i gruppi di matrici, la traslazione che rende tutto omogeneo, e l'algebra di Lie come tangente all'identita"},"controllo":[{"tipo":"uguale","sinistra":"cos(theta)**2+sin(theta)**2","vale":"1","dove":"esempio","appare":"\\cos^2\\theta+\\sin^2\\theta=1"},{"tipo":"uguale","sinistra":"cos(alpha)*cos(varphi)-sin(alpha)*sin(varphi)","vale":"cos(alpha+varphi)","dove":"esempio","appare":"\\cos\\alpha\\cos\\varphi-\\sin\\alpha\\sin\\varphi=\\cos(\\alpha+\\varphi)"},{"tipo":"uguale","sinistra":"sin(alpha)*cos(varphi)+cos(alpha)*sin(varphi)","vale":"sin(alpha+varphi)","dove":"esempio","appare":"\\sin\\alpha\\cos\\varphi+\\cos\\alpha\\sin\\varphi=\\sin(\\alpha+\\varphi)"}]};
STRUM["campo-vettoriale"] = {"nome":"Campo vettoriale","riga":"Una funzione che a ogni punto dello spazio associa un vettore, scritta $\\mathbf{F}(x,y,z)=F_x\\,\\hat{\\imath}+F_y\\,\\hat{\\jmath}+F_z\\,\\hat{k}$ con le tre componenti funzioni del punto.","serve":"È il modo di dire «c'è qualcosa in ogni punto dello spazio, e ha una direzione». Serve perché permette di smettere di ragionare su coppie di oggetti che si attraggono a distanza e di ragionare su una proprietà dello spazio: la sorgente prepara il campo, e chi arriva dopo sente solo ciò che trova dove si trova.","esempio":"Il campo di una carica puntiforme $q$ nell'origine è $\\mathbf{E}=\\dfrac{q}{4\\pi\\varepsilon_0 r^{2}}\\hat{r}$: la direzione è radiale, il modulo dipende solo dalla distanza. Con $q=1$ e $4\\pi\\varepsilon_0=1$, nel punto $(3,4,0)$ si ha $r=5$, quindi il modulo vale $\\tfrac{1}{25}$ e il versore è $\\left(\\tfrac35,\\tfrac45,0\\right)$: la componente lungo $x$ è $\\tfrac{3}{125}$.","pieno":{"file":"04-campi-vettoriali.html","tappa":"00","come":"la trattazione completa, nel nucleo sui campi vettoriali di Analisi Vettoriale"},"qui":{"elettromagnetismo":{"serve":"È l'oggetto che l'intero corso studia: $\\mathbf{E}$ e $\\mathbf{B}$ sono campi vettoriali, e le quattro equazioni di Maxwell sono affermazioni su come le loro derivate spaziali si legano alle sorgenti. Tutto ciò che si impara dopo — flusso, circuitazione, divergenza, rotore — è un modo di interrogare un campo vettoriale.","esempio":"Per la carica puntiforme in $(3,4,0)$ con $q=1$ e $4\\pi\\varepsilon_0=1$: $r=5$, modulo $\\tfrac{1}{25}$, e la componente lungo $x$ vale $\\tfrac{3}{125}$. Le tre componenti non sono tre campi separati: ruotando gli assi si mescolano fra loro, ed è quello che rende $\\mathbf{E}$ un vettore e non una terna di numeri."}},"controllo":[{"tipo":"uguale","sinistra":"sqrt(3**2+4**2)","vale":"5","dove":"esempio","appare":"r=5"},{"tipo":"uguale","sinistra":"1/sqrt(3**2+4**2)**2","vale":"1/25","dove":"esempio", function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';
  else h += '<span class="sr"><span class="sk">Debito dichiarato.</span> '+s.debito+'</span>';
  return h;
}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}
