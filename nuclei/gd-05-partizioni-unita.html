var CORSO = 'geometria-differenziale';   /* per il taglio «a cosa serve QUI»; vuoto = taglio di default della scheda */
var STRUM = {};
STRUM["funzione-bump"] = {"nome":"Funzione a bernoccolo","riga":"La funzione a bernoccolo $\\lambda(t)$, nulla per $t\\le0$ ed uguale a $e^{-1/t^2}$ per $t\\gt0$, è liscia su tutto $\\mathbb{R}$ con tutte le derivate nulle in $0$ ma non identicamente nulla a destra, dunque $C^\\infty$ e non analitica.","serve":"a fabbricare funzioni lisce a supporto compatto, cioè identicamente nulle fuori da una regione limitata e non nulle dentro — un oggetto che nessuna funzione analitica non banale può essere, per il principio di identità (una serie di potenze nulla su un aperto è nulla ovunque). È questa la ragione tecnica per cui $C^\\infty$ è una categoria strettamente più grande dell'analitico, e la conseguenza operativa è tutto ciò che ne segue: incollando due bernoccoli si ottiene un gradino liscio che passa da $0$ a $1$ in un intervallo prescritto, da cui si costruisce una funzione che vale $1$ su un compatto e $0$ fuori da un suo intorno, da cui le partizioni dell'unità. Senza una funzione liscia che si annulla su un aperto senza annullarsi ovunque, nessuno di questi incollamenti preserverebbe la regolarità.","esempio":"Si valuti $\\lambda$ in due punti. Per $t=-1\\le0$ si ha $\\lambda(-1)=0$ per definizione; per $t=1\\gt0$ si ha $\\lambda(1)=e^{-1/1^2}=e^{-1}=1/e\\approx0{,}3679$, dunque la funzione è genuinamente non nulla a destra. Eppure in $0$ è liscia con tutte le derivate nulle: per $t\\gt0$ la derivata è $\\lambda'(t)=\\tfrac{2}{t^3}e^{-1/t^2}$, e il limite $\\lim_{t\\to0^+}e^{-1/t^2}=0$ perché l'esponenziale batte ogni potenza di $1/t$. Se $\\lambda$ fosse analitica in $0$, avendo serie di Taylor identicamente nulla sarebbe nulla in tutto un intorno — ma $\\lambda(1)=1/e\\neq0$: è $C^\\infty$ e non analitica, ed è esattamente questo scarto a renderla utile.","pieno":{"file":"tp-09-paracompattezza-partizioni.html","tappa":"02","come":"la costruzione di $\\lambda(t)=e^{-1/t^2}$, la dimostrazione che è liscia in $0$ con tutte le derivate nulle, e perché è liscia ma non analitica"},"controllo":[{"tipo":"uguale","sinistra":"exp(-1/1**2)","vale":"exp(-1)","dove":"esempio","appare":"\\lambda(1)=e^{-1/1^2}=e^{-1}=1/e"},{"tipo":"numero","espr":"exp(-1)","vale":"0.3679","dove":"esempio","appare":"1/e\\approx0{,}3679"},{"tipo":"derivata","espr":"exp(-1/t**2)","rispetto":["t"],"vale":"2/t**3*exp(-1/t**2)","dove":"esempio","appare":"\\lambda'(t)=\\tfrac{2}{t^3}e^{-1/t^2}"},{"tipo":"limite","espr":"exp(-1/t**2)","var":"t","a":"0","verso":"+","vale":"0","dove":"esempio","appare":"\\lim_{t\\to0^+}e^{-1/t^2}=0"}]};
STRUM["paracompattezza"] = {"nome":"Paracompattezza","riga":"Uno spazio è paracompatto quando ogni suo ricoprimento aperto ammette un raffinamento aperto localmente finito, cioè un secondo ricoprimento più fine in cui ogni punto ha un intorno che tocca solo un numero finito degli aperti.","serve":"a trasportare il meccanismo «finito da infinito» della compattezza su spazi che compatti non sono, come $\\mathbb{R}^n$ e quasi tutte le varietà della fisica. La conseguenza operativa è duplice e la si usa senza dimostrarla ogni volta: la paracompattezza è la condizione che garantisce l'esistenza delle partizioni dell'unità, lo strumento con cui si incollano in un oggetto globale (una metrica, una forma, un campo) i pezzi costruiti carta per carta; e paracompatto più Hausdorff implica normale, cioè la separazione di chiusi disgiunti con aperti disgiunti. Ogni varietà è automaticamente paracompatta, perché è localmente compatta, di Hausdorff e a base numerabile e dunque ammette un'esaustione per compatti: non va verificata caso per caso, discende dalle tre clausole della definizione.","esempio":"Il ricoprimento di $\\mathbb{R}$ fatto dagli intervalli $U_n=(n-1,n+1)$ al variare di $n\\in\\mathbb{Z}$ è localmente finito, e lo si vede con un punto. Il punto $x=3{,}4$ sta in $U_n=(n-1,n+1)$ esattamente quando $n-1\\lt 3{,}4\\lt n+1$, cioè $2{,}4\\lt n\\lt 4{,}4$: solo $n=3$ e $n=4$. Infatti $U_3=(2,4)$ lo contiene perché $2\\lt 3{,}4\\lt 4$, e $U_4=(3,5)$ perché $3\\lt 3{,}4\\lt 5$; invece $U_2=(1,3)$ no, dato che $3{,}4\\gt 3$, e $U_5=(4,6)$ no, dato che $3{,}4\\lt 4$. Un intorno abbastanza piccolo di $3{,}4$ incontra dunque soltanto due aperti della famiglia, e lo stesso vale per ogni altro punto: la famiglia è localmente finita pur avendo infiniti pezzi, ed è il prototipo del raffinamento che la paracompattezza richiede di saper costruire per ogni ricoprimento.","pieno":{"file":"tp-09-paracompattezza-partizioni.html","tappa":"01","come":"la motivazione (le varietà non sono compatte), la definizione di famiglia localmente finita e di raffinamento, e perché ogni varietà è paracompatta"},"controllo":[{"tipo":"disuguaglianza","sinistra":"2","relazione":"<","destra":"17/5","dove":"esempio","appare":"2\\lt 3{,}4\\lt 4"},{"tipo":"disuguaglianza","sinistra":"17/5","relazione":"<","destra":"4","dove":"esempio","appare":"2\\lt 3{,}4\\lt 4"},{"tipo":"disuguaglianza","sinistra":"3","relazione":"<","destra":"17/5","dove":"esempio","appare":"3\\lt 3{,}4\\lt 5"},{"tipo":"disuguaglianza","sinistra":"17/5","relazione":"<","destra":"5","dove":"esempio","appare":"3\\lt 3{,}4\\lt 5"}]};
STRUM["esaustione-per-compatti"] = {"nome":"Esaustione per compatti","riga":"Un'esaustione per compatti di uno spazio $M$ è una successione di compatti $K_1\\subset K_2\\subset\\cdots$ con $K_i\\subset\\mathrm{Int}\\,K_{i+1}$ e $\\bigcup_i K_i=M$, che ogni spazio localmente compatto di Hausdorff a base numerabile — ogni varietà — possiede.","serve":"a promuovere una costruzione «un compatto alla volta» a una costruzione su tutta una varietà non compatta. La Proposizione 2.7.2 dà una funzione liscia che vale $1$ su un compatto e $0$ fuori da un suo intorno, ma un singolo compatto non copre $M$ se $M$ non è compatta; l'esaustione fornisce i gusci $K_{i+1}\\setminus\\mathrm{Int}\\,K_i$, ciascuno compatto, su cui si costruisce un bernoccolo alla volta. La conseguenza operativa è che la somma di questi bernoccoli è localmente finita — ogni punto sta in un numero finito di gusci vicini, non perché lo spazio sia compatto ma perché la condizione $K_i\\subset\\mathrm{Int}\\,K_{i+1}$ confina ogni punto fra due indici — e dunque liscia: normalizzandola si ottiene una partizione dell'unità numerabile su tutta $M$. È anche il modo rigoroso di definire un integrale su uno spazio non compatto, come limite di integrali sui $K_i$.","esempio":"Su $\\mathbb{R}$ l'esaustione più semplice è $K_i=[-i,i]$. È davvero un'esaustione: $K_i\\subset\\mathrm{Int}\\,K_{i+1}=(-(i+1),i+1)$ perché $i\\lt i+1$ (per $i=3$, $3\\lt4$), e $\\bigcup_i K_i=\\mathbb{R}$ perché ogni $x$ finisce dentro $K_i$ appena $i\\ge|x|$. Un punto concreto: $x=3{,}4$ non sta in $K_3=[-3,3]$, dato che $3{,}4\\gt3$, ma sta in $K_4=[-4,4]$, dato che $3{,}4\\le4$; il più piccolo indice che lo contiene è $4=\\lceil3{,}4\\rceil$. Il guscio $K_4\\setminus\\mathrm{Int}\\,K_3=\\{3\\le|x|\\le4\\}$ che lo contiene è compatto per Heine-Borel, e $3\\le3{,}4\\le4$ lo conferma: è su un guscio come questo, uno per indice, che si costruisce un bernoccolo alla volta prima di sommarli.","pieno":{"file":"tp-09-paracompattezza-partizioni.html","tappa":"04","come":"l'esaustione per compatti richiamata da tp-07 e messa al lavoro per estendere la costruzione di una partizione dell'unità da un compatto a tutta la varietà"},"controllo":[{"tipo":"disuguaglianza","sinistra":"3","relazione":"<","destra":"4","dove":"esempio","appare":"3\\lt4"},{"tipo":"disuguaglianza","sinistra":"3","relazione":"<","destra":"17/5","dove":"esempio","appare":"3{,}4\\gt3"},{"tipo":"disuguaglianza","sinistra":"17/5","relazione":"<","destra":"4","dove":"esempio","appare":"3{,}4\\le4"},{"tipo":"uguale","sinistra":"ceiling(17/5)","vale":"4","dove":"esempio","appare":"4=\\lceil3{,}4\\rceil"}]};
STRUM["omeomorfismo"] = {"nome":"Omeomorfismo","riga":"Una biiezione continua con inversa continua: due spazi omeomorfi sono lo stesso spazio scritto in due modi, per tutto ciò che la topologia sa vedere.","serve":"È la nozione di «uguale» che si usa quando si dice che una varietà è localmente come $\\mathbb{R}^n$. La richiesta che anche l'inversa sia continua non è pignoleria: senza di essa una biiezione continua può incollare cose lontane — l'applicazione $t\\mapsto(\\cos 2\\pi t,\\sin 2\\pi t)$ da $[0,1)$ alla circonferenza è continua e biunivoca, ma la sua inversa spezza la circonferenza in un punto, e infatti $[0,1)$ e $S^1$ non sono lo stesso spazio (uno è compatto, l'altro no). Le proprietà che si conservano per omeomorfismo — compattezza, connessione, dimensione, gruppo fondamentale — sono esattamente quelle di cui si può parlare su una varietà senza aver scelto una carta.","esempio":"L'intervallo aperto $(0,1)$ e la semiretta $(0,+\\infty)$ sono omeomorfi tramite $f(x)=\\dfrac{x}{1-x}$: è continua su $(0,1)$, manda $0^+$ in $0^+$ e $1^-$ in $+\\infty$, e la sua inversa è $g(y)=\\dfrac{y}{1+y}$, anch'essa continua. Che siano davvero una l'inversa dell'altra si verifica componendo: $g(f(x))=\\dfrac{x/(1-x)}{1+x/(1-x)}=x$. Ne segue che $(0,1)$ è omeomorfo anche a tutto $\\mathbb{R}$ (componendo con $y\\mapsto\\ln y$), il che dice una cosa che all'inizio sorprende: **la lunghezza non è una proprietà topologica**. Non lo è nemmeno l'essere limitato; lo è invece la compattezza, ed è per questo che $[0,1]$ non è omeomorfo a nessuno dei due.","debito":"nessun movimento del percorso tratta la topologia generale come argomento a sé: qui c'è ciò che serve per leggere la definizione di varietà. La classificazione di quali spazi sono omeomorfi a quali è il mestiere della topologia algebrica, e nel corso di Diverio entra solo per la numerabilità del gruppo fondamentale.","controllo":[{"tipo":"uguale","sinistra":"(x/(1-x))/(1+x/(1-x))","vale":"x","ipotesi":{"x":"positive"},"dove":"esempio","appare":"=x"}]};
STRUM["caratteristica-di-eulero"] = {"nome":"Caratteristica di Eulero","riga":"È il numero intero $\\chi(M)$ che, per una superficie triangolata, vale vertici meno spigoli più facce, non dipende dalla triangolazione scelta, e su una varietà compatta conta con segno gli zeri di qualunque campo vettoriale.","serve":"a decidere se su una varietà compatta esistano oggetti globali che una partizione dell'unità non sa costruire, perché l'insieme in cui vivono non è convesso. Il fatto che si usa è il teorema di Poincaré-Hopf: se un campo vettoriale su una varietà compatta ha zeri isolati, la somma dei loro indici (il numero di giri che il campo compie su un cerchietto attorno allo zero, con segno) vale $\\chi(M)$, qualunque sia il campo. Ne seguono due conseguenze operative. Se $\\chi(M)\\neq0$, ogni campo ha almeno uno zero: è il teorema della palla pelosa per $S^2$, che ha $\\chi=2$. Se $\\chi(M)=0$, esiste un campo mai nullo, e su una varietà compatta questo equivale ad avere una metrica lorentziana, cioè a poter essere uno spazio-tempo. Le superfici compatte orientabili hanno $\\chi=2-2g$, con $g$ il numero di buchi: solo il toro ha caratteristica nulla, perché con $g=1$ viene $\\chi=2-2\\cdot1=0$.","esempio":"Si calcola sulla sfera con la triangolazione più piccola, il bordo di un tetraedro: $4$ vertici, $6$ spigoli, $4$ facce, quindi $\\chi(S^2)=4-6+4=2$. Con il bordo di un cubo, che è un'altra decomposizione della stessa sfera, si contano $8$ vertici, $12$ spigoli e $6$ facce quadrate, e torna lo stesso numero: $8-12+6=2$. Il toro si ottiene da un quadrato identificando i lati opposti, e la decomposizione minima ha un solo vertice (i quattro angoli diventano un punto), due spigoli e una faccia: $\\chi(T^2)=1-2+1=0$. Il confronto con i campi è immediato. Sul toro il campo $\\partial/\\partial\\vartheta_1$ della coordinata angolare non si annulla mai, coerentemente con $\\chi=0$. Sulla sfera il campo di rotazione attorno all'asse verticale si annulla nei due poli, e ciascuno ha indice $+1$: la somma $1+1=2$ è esattamente $\\chi(S^2)$, e nessun campo può fare meglio.","debito":"che $\\chi$ non dipenda dalla decomposizione scelta, e il teorema di Poincaré-Hopf che lega $\\chi$ agli zeri dei campi, si dimostrano con l'omologia (o con la teoria del grado) in un corso di topologia algebrica, che non è fra i prerequisiti; in Lee la palla pelosa è il Problem 16-6, risolto con la coomologia di de Rham. Qui si enuncia il teorema, si calcola $\\chi$ sui casi che servono, e si dichiara il confine: il corso usa $\\chi$ per sapere quando un'ostruzione esiste, non per dimostrarla.","controllo":[{"tipo":"uguale","sinistra":"4-6+4","vale":"2","dove":"esempio","appare":"\\chi(S^2)=4-6+4=2"},{"tipo":"uguale","sinistra":"8-12+6","vale":"2","dove":"esempio","appare":"8-12+6=2"},{"tipo":"uguale","sinistra":"1-2+1","vale":"0","dove":"esempio","appare":"\\chi(T^2)=1-2+1=0"},{"tipo":"uguale","sinistra":"1+1","vale":"2","dove":"esempio","appare":"1+1=2"},{"tipo":"uguale","sinistra":"2-2*1","vale":"0","dove":"serve","appare":"2-2\\cdot1=0"}]};
STRUM["compattezza"] = {"nome":"Compattezza","riga":"Ogni ricoprimento aperto ammette un sottoricoprimento finito: è la proprietà che permette di passare da «vale vicino a ogni punto» a «vale su tutto», con un numero finito di passi.","serve":"È l'ipotesi che rende globali le conclusioni locali, ed è per questo che ricorre in ogni dimostrazione di geometria differenziale. In $\\mathbb{R}^n$ equivale a chiuso e limitato (Heine-Borel), ma su una varietà quell'equivalenza non si può usare come definizione, perché «limitato» richiede una distanza e una varietà non ne ha una privilegiata. La conseguenza che si usa più spesso è negativa: gli unici sottoinsiemi di $\\mathbb{R}^n$ che sono **insieme** aperti e compatti sono $\\emptyset$ e nient'altro — ed è l'argomento per cui una varietà compatta non può essere coperta da una sola carta.","esempio":"L'intervallo $(0,1)$ non è compatto, e si vede esibendo un ricoprimento senza sottoricoprimento finito: gli aperti $A_n=\\left(\\tfrac1n,1\\right)$ per $n\\ge2$ ricoprono $(0,1)$, perché ogni $x\\gt0$ sta in $A_n$ appena $\\tfrac1n\\lt x$, cioè appena $n\\gt1/x$. Ma una sottofamiglia finita $A_{n_1},\\dots,A_{n_k}$ ha un indice massimo $N$, quindi la sua unione è $\\left(\\tfrac1N,1\\right)$, e il punto $x=\\tfrac1{2N}$ resta fuori: è positivo, dunque sta in $(0,1)$, ed è minore di $\\tfrac1N$. Il conto che regge l'argomento è $\\lim_{n\\to\\infty}\\tfrac1n=0$: gli $A_n$ si avvicinano a coprire tutto, ma nessuno di essi contiene un intorno di $0$, e servirebbero tutti. Chiudendo l'intervallo, $[0,1]$ diventa compatto e quel ricoprimento smette di essere un ricoprimento — $0$ non sta in nessun $A_n$.","debito":"la dimostrazione del teorema di Heine-Borel e la teoria generale degli spazi compatti stanno fuori dal percorso: qui c'è l'uso che se ne fa. Nel corso di Diverio la compattezza entra come ipotesi (sfera, gruppi di Lie compatti) e come conclusione della locale compattezza delle varietà.","controllo":[{"tipo":"limite","espr":"1/n","var":"n","a":"oo","vale":"0","ipotesi":{"n":"positive"},"dove":"esempio","appare":"\\lim_{n\\to\\infty}\\tfrac1n=0"},{"tipo":"disuguaglianza","sinistra":"1/(2*N)","destra":"1/N","relazione":"<","ipotesi":{"N":"positive"},"dove":"esempio","appare":"minore di $\\tfrac1N$"}]};

function schedaHTML(s){
  var q = (s.qui && s.qui[CORSO]) || s;
  var h = '<span class="sh">&#9670; strumento &middot; '+s.nome+'</span>';
  h += '<span class="sr"><span class="sk">Cos&rsquo;&egrave;.</span> '+s.riga+'</span>';
  h += '<span class="sr"><span class="sk">A cosa serve qui.</span> '+q.serve+'</span>';
  h += '<span class="sr"><span class="sk">Esempio.</span> '+q.esempio+'</span>';
  if(s.pieno) h += '<span class="sr"><span class="sk">Tutto il resto.</span> <a href="'+
                   s.pieno.file+'#'+s.pieno.tappa+'">'+s.pieno.come+'</a></span>';

}

function cablaStrumenti(root){
  Array.prototype.forEach.call(root.querySelectorAll('span.str[data-str]'), function(el){
    if(el.getAttribute('data-cablato')) return;
    el.setAttribute('data-cablato','1');
    var id = el.getAttribute('data-str'), s = STRUM[id];
    /* La scheda mancante si VEDE: il montaggio non dovrebbe mai lasciarne passare
       una, ma se un nucleo viene aperto senza essere ristato montato, meglio un
       rimando rosso che un clic che non fa niente. */
    if(!s){ el.className='str rotto'; el.title='scheda-strumento mancante: '+id; return; }
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.title='strumento: '+s.nome;
    var card=null;
    function apri(){
      if(card){ card.parentNode.removeChild(card); card=null; el.classList.remove('aperto'); return; }
      card=document.createElement('span'); card.className='strcard';
      card.innerHTML=schedaHTML(s);
      el.parentNode.insertBefore(card, el.nextSibling);
      typeset(card); el.classList.add('aperto');
    }
    el.onclick=apri;
    el.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); apri(); } };
  });
}

{ num:'00', title:'Di cosa parla questo movimento', meta:'Geometria Differenziale · voci G.11, G.12 · lo strumento su cui poggia meta del corso',
  blocchi:[
  {t:'prosa', title:'Il problema che risolve', tag:'architettura', html:R`
  <p>Su una varietà quasi tutto si sa fare <b>in carta</b>, cioè localmente. Ma quasi tutto ciò che interessa è <b>globale</b>: una metrica su tutta la varietà, un campo vettoriale definito ovunque, l&rsquo;integrale su tutta $M$, l&rsquo;estensione di una funzione definita su un chiuso.</p>
  <p>Il problema di incollare i pezzi locali non è banale, perché due carte si sovrappongono e le costruzioni non coincidono sulla sovrapposizione. <b>La partizione dell&rsquo;unità è il modo di fare una media pesata</b>: si assegna a ogni carta un peso liscio, i pesi sommano a $1$ ovunque, e la somma pesata delle costruzioni locali è una costruzione globale.</p>
  <p><b>Il prezzo è che funziona solo in categoria liscia.</b> Serve una funzione $C^\infty$ che sia identicamente $1$ in una regione e identicamente $0$ fuori da un&rsquo;altra, e questo <b>nessuna funzione analitica può farlo</b>: una funzione analitica nulla su un aperto di un connesso è nulla ovunque, per il principio di identità. Il movimento comincia costruendo quella funzione.</p>
  <p><b>Il filo.</b> La prima tappa costruisce il mattone $e^{-1/t}$ e da esso il gradino e la bump, nelle tre varianti di Lee, Abate e Manetti. La seconda spiega perché non basta incollare funzioni che coincidono e definisce la partizione dell&rsquo;unità; la terza la dimostra esistente, mettendo a confronto la dimostrazione in $\mathbb{R}^n$ di Manetti con quella su una varietà di Abate e Lee. La quarta ne ricava le applicazioni classiche — bump per chiusi, estensione, esaustione — con i controesempi che ne segnano i confini; la quinta dimostra il teorema meno noto e più usato dai fogli di Diverio, che <b>ogni chiuso è l&rsquo;insieme degli zeri di una funzione liscia</b>, e risolve i quattro esercizi dei fogli che lo usano. La sesta approssima funzioni continue con funzioni lisce, nella versione per terzi di Manetti e in quella di Whitney; la settima isola lo schema di incollamento e la condizione di convessità che lo rende lecito.</p>`}
]},

/* ---------------- 01 · LA FUNZIONE CHE ROMPE L'ANALITICITÀ ---------------- */
{ num:'01', title:'La funzione che rompe lanaliticita: cutoff e bump', meta:'e^{-1/t} · perche tutte le derivate si annullano · il gradino · la bump nelle tre versioni',
  blocchi:[
  {t:'reveal', title:'La costruzione, in tre passi', tag:'costruzione', steps:[
   {label:'Il mattone, e la dimostrazione che e liscio', body:R`
   <p>$$f(t)=\begin{cases}e^{-1/t}&t>0\\ 0&t\le0\end{cases}$$
   è <b>$C^\infty$ su tutto $\mathbb{R}$</b> (Lemma 2.20 di Lee). Fuori dall'origine è una composizione di funzioni lisce, e il solo punto da verificare è $t=0$. Il conto che decide è una formula per tutte le derivate insieme: per $t>0$ si dimostra per induzione che
   $$f^{(k)}(t)=\frac{p_k(t)\,e^{-1/t}}{t^{2k}}$$
   con $p_k$ polinomio di grado al più $k$. Per $k=0$ vale con $p_0=1$; derivando la forma del passo $k$ con la regola del prodotto si trova la ricorrenza $p_{k+1}=t^2p_k'+p_k-2ktp_k$, e da $p_1=1$ viene $p_2(t)=1-2t$, cioè la derivata seconda
   $$f''(t)=\frac{(1-2t)\,e^{-1/t}}{t^{4}}.$$
   Poi si mostra, ancora per induzione, che $f^{(k)}(0)=0$: la derivata sinistra è zero, e quella destra è il limite di $f^{(k)}(t)/t$, che è un polinomio per $e^{-1/t}/t^{2k+1}$ e tende a zero, perché <b>l&rsquo;esponenziale schiaccia qualunque potenza</b> (de l&rsquo;Hôpital ripetuto). Quindi <b>tutte le derivate tendono a zero</b> per $t\to0^+$ — la prima, <b>anche la seconda</b>, <b>e la terza</b>, e così via.</p>
   <p><b>Ma la serie di Taylor in $0$ è identicamente nulla</b>, mentre la funzione non lo è per $t>0$: $f$ è liscia e <b>non analitica</b>. È il controesempio classico, ed è esattamente ciò che serve. Manetti (Esempio 1.2) usa la variante $\lambda(t)=e^{-1/t^2}$, con derivata $\frac{2}{t^{3}}\,e^{-1/t^{2}}$ per $t>0$, e il ragionamento è identico: cambia la potenza dentro l&rsquo;esponenziale, non il fatto che l&rsquo;esponenziale vinca.</p>`},
   {label:'La funzione di transizione fra 0 e 1', body:R`
   <p>Con due copie di $f$ si costruisce
   $$g(t)=\frac{f(t)}{f(t)+f(1-t)},$$
   che è liscia, vale <b>$0$ per $t\le0$</b>, <b>$1$ per $t\ge1$</b>, e sale monotona in mezzo — <b>vale $\tfrac12$ a metà strada</b>. Il denominatore non si annulla mai, perché per ogni $t$ almeno uno dei due addendi è positivo. Lee (Lemma 2.21) la scrive con due soglie qualunque $r_1<r_2$, come $h(t)=f(r_2-t)/\big(f(r_2-t)+f(t-r_1)\big)$, che vale $1$ prima di $r_1$ e $0$ dopo $r_2$, e la chiama <b>funzione cutoff</b>; Manetti la chiama $\phi_\varepsilon$, con la rampa lunga $\varepsilon$.</p>`},
   {label:'Il bump, e perche le fonti lo scrivono in modi diversi', body:R`
   <p>Componendo il gradino con una funzione della distanza si ottiene una <b>bump function</b>: liscia, identicamente $1$ su una palla $B_r$, identicamente $0$ fuori da $B_R$ con $R>r$, compresa fra $0$ e $1$ in mezzo. Il suo <b>supporto</b> — la chiusura dell&rsquo;insieme dove non si annulla, $\operatorname{supp}f$ — è compatto e contenuto nella palla chiusa di raggio $R$.</p>
   <p>Il dettaglio da guardare è <b>con quale funzione della distanza si compone</b>, perché $|x|$ non è liscia nell&rsquo;origine. Lee (Lemma 2.22) pone $H(x)=h(|x|)$ e osserva che vicino all&rsquo;origine $H$ vale costantemente $1$, quindi lo spigolo di $|x|$ cade dove la composizione è costante e non fa danni; Manetti fa lo stesso con $1-\phi_\varepsilon(|t|-r)$. Abate (formula 2.14) evita il problema alla radice componendo con $|x|^2$, che è un polinomio:
   $$\eta(x)=\frac{h(1-\|x\|^2)}{h(1-\|x\|^2)+h(\|x\|^2-1/4)}.$$
   Sulla sfera di raggio $\tfrac12$ si ha $\|x\|^2=\tfrac14$, il secondo addendo è $h(0)=0$, e $\eta(x)=\frac{h(3/4)}{h(3/4)+h(0)}=1$; sulla sfera di raggio $1$ i ruoli si scambiano e il valore è $\frac{h(0)}{h(0)+h(3/4)}=0$. <b>Così $\eta$ vale $1$ sulla palla di raggio $\tfrac12$, è positiva sulla palla aperta di raggio $1$, e nulla fuori</b>: è la <span class="str" data-str="funzione-bump">funzione a bernoccolo</span> che tutte le dimostrazioni successive trasportano in carta.</p>
   <p><b>Questa è la funzione che fa tutto</b>: su una varietà si porta dentro un aperto coordinato componendola con la carta, la si estende con zero fuori, e dà una funzione liscia globale che vive dentro una sola carta. Da qui in poi si può lavorare in una carta e poi «spegnere» la costruzione prima del bordo.</p>`}
  ]},
  {t:'plot', title:'Il mattone e il bump',
   intro:R`A sinistra $f(t)=e^{-1/t}$ per $t>0$ (zero altrove): piattissima in $0$, eppure positiva subito dopo. A destra la bump costruita con due copie di $f$.`,
   plots:[
    {kind:'func2d', xr:[-1,2], yr:[-0.05,1.05], height:300,
     title:'e^{-1/t}: tutte le derivate nulle in 0, e la serie di Taylor non la vede',
     xlabel:'t', ylabel:'f(t)',
     curves:[{f:'x>0 ? exp(-1/x) : 0', col:'#5eead4', width:2.6, label:'f(t)'},
             {f:'0', col:'#4d5a6b', width:1.4, dash:true, label:'la sua serie di Taylor in 0'}],
     segs:[{x1:0, y1:-0.05, x2:0, y2:1.05, col:'#ff6b6b', dash:true, width:1.3}]},
    {kind:'func2d', xr:[-2.5,2.5], yr:[-0.05,1.15], height:300,
     title:'la bump: identicamente 1 al centro, identicamente 0 fuori, liscia ovunque',
     xlabel:'x', ylabel:'bump(x)',
     curves:[{f:'(function(u){ if(u<=0) return 1; if(u>=1) return 0; var a=exp(-1/u), b=exp(-1/(1-u)); return b/(a+b); })((abs(x)-0.8)/0.9)', col:'#d8a13a', width:2.6, label:'bump'}],
     segs:[{x1:-0.8, y1:0, x2:0.8, y2:0, col:'#5eead4', width:3, label:'qui vale 1', lx:-0.45, ly:0.08},
           {x1:1.7, y1:0, x2:2.5, y2:0, col:'#b98cff', width:3, label:'qui vale 0', lx:1.75, ly:0.08},
           {x1:-2.5, y1:0, x2:-1.7, y2:0, col:'#b98cff', width:3}]}
   ],
   leggi:R`<b>A sinistra sta tutto il punto del movimento.</b> La curva verde e quella grigia — la sua serie di Taylor in $0$, che è identicamente nulla — coincidono per $t\le0$ e si separano subito dopo. Una funzione analitica non può comportarsi così: se coincide con zero su un intervallo, è zero ovunque. <b>La classe $C^\infty$ è strettamente più grande di quella analitica, e tutta la geometria differenziale vive in quello scarto.</b><br><br>
   <b>A destra</b> il risultato: una funzione perfettamente liscia che vale <i>esattamente</i> 1 in una regione e <i>esattamente</i> 0 in un&rsquo;altra, con un raccordo morbido. Non è un&rsquo;approssimazione — il tratto piatto è piatto davvero. In geometria analitica e olomorfa questa costruzione <b>non è disponibile</b>, ed è la ragione tecnica per cui quelle teorie sono molto più rigide.`}
]},

/* ---------------- 02 · LA PARTIZIONE ---------------- */
{ num:'02', title:'La partizione dellunita: perche serve, e la definizione', meta:'incollare non basta · le quattro condizioni · localmente finito e numerabile · dove entra la paracompattezza',
  blocchi:[
  {t:'prosa', title:'Perche incollare funzioni che coincidono non basta', tag:'first principles', html:R`
  <p>Il primo modo di costruire un oggetto globale è <b>incollare</b>: se si sanno definire funzioni lisce su aperti che ricoprono $M$, e queste coincidono sulle sovrapposizioni, si incollano in una funzione liscia globale (il Gluing Lemma, Corollary 2.8 di Lee). È uno strumento utile ma rigido, perché pretende che i pezzi locali <b>coincidano esattamente</b> su regioni grandi, e in pratica le costruzioni fatte in due carte diverse non coincidono quasi mai.</p>
  <p>E sui chiusi l&rsquo;incollamento si rompe proprio. Lee lo mostra con l&rsquo;esempio più semplice possibile: le funzioni $x$ su $[0,+\infty)$ e $-x$ su $(-\infty,0]$ sono lisce e coincidono nel solo punto di sovrapposizione, ma la funzione continua che definiscono è $|x|$, che <b>non è derivabile in $0$</b>: le derivate dai due lati sono $1$ e $-1$, e il salto è $1-(-1)=2$. <b>Incollare su chiusi produce spigoli.</b></p>
  <p>Serve allora un modo di <i>mescolare</i> oggetti locali che non coincidono, ed è questo che fanno le partizioni dell&rsquo;unità. Lee lo dice come una regola di mestiere: se si sanno definire gli oggetti locali in modo che coincidano, li si incolla; se no, si ricorre a una partizione dell&rsquo;unità, e il lavoro diventa mostrare che l&rsquo;oggetto mescolato ha ancora le proprietà richieste.</p>`},
  {t:'prosa', title:'Definizione e teorema', tag:'grammatica', html:R`
  <p>Dato un ricoprimento aperto $\{U_\alpha\}$ di $M$, una <b>partizione dell&rsquo;unità subordinata</b> è una famiglia di funzioni lisce $\rho_\alpha:M\to[0,1]$ tali che:</p>
  <ul>
   <li>$\operatorname{supp}\rho_\alpha\subseteq U_\alpha$ — ciascuna vive dentro un solo aperto del ricoprimento;</li>
   <li>la famiglia dei supporti è <b>localmente finita</b>: ogni punto ha un intorno che incontra solo un numero finito di supporti (così la somma è ben definita);</li>
   <li>$\sum_\alpha\rho_\alpha\equiv1$ su tutta $M$.</li>
  </ul>
  <p>È la definizione di Lee, con l&rsquo;indicizzazione dello stesso insieme del ricoprimento, ed è quella di Abate (Definizione 2.7.8) a meno dell&rsquo;ordine delle clausole; Manetti (Definizione 1.3) la dà prima su $\mathbb{R}^n$, ed è la stessa. Abate aggiunge un&rsquo;osservazione (2.7.9) che vale la pena avere: siccome $M$ è a base numerabile, <b>i supporti non vuoti sono al più un&rsquo;infinità numerabile</b>, anche se il ricoprimento ha più che numerabili aperti — una famiglia localmente finita in uno spazio a base numerabile non può avere più che numerabili membri non vuoti, perché ogni aperto di una base numerabile ne incontra un numero finito. È la stessa ragione per cui da ogni ricoprimento aperto si estrae un sottoricoprimento numerabile (proprietà di Lindelöf).</p>
  <p><b>Teorema (e vale per ogni varietà liscia):</b> per ogni ricoprimento aperto esiste una partizione dell&rsquo;unità subordinata. Il cuore della dimostrazione è la <span class="str" data-str="paracompattezza">paracompattezza</span> — ogni ricoprimento aperto ammette un raffinamento localmente finito — e il resto è fabbricare le funzioni con le bump e normalizzarle. La dimostrazione è nella tappa che segue, in due versioni.</p>
  <p>Il legame fra le due nozioni è più stretto di quanto sembri, e Abate lo fissa in due esercizi. Il primo (2.142): <b>uno spazio è paracompatto se e solo se a ogni ricoprimento aperto si può subordinare una partizione dell&rsquo;unità</b> fatta di funzioni continue — cioè la partizione dell&rsquo;unità <i>è</i> la paracompattezza, vista dalle funzioni. Il secondo (2.141): <b>una varietà topologica di Hausdorff è a base numerabile se e solo se è paracompatta e ha al più un&rsquo;infinità numerabile di componenti connesse</b>. La base numerabile della definizione di varietà è quindi, a meno delle componenti, la richiesta che le partizioni dell&rsquo;unità esistano.</p>
  <div class="note"><b>Quando in un corso una definizione chiede più di quanto sembri necessario, di solito c&rsquo;è un teorema di esistenza a valle che la consuma tutta.</b> Base numerabile e Hausdorff sembrano condizioni di servizio nella definizione di varietà; questo teorema le usa entrambe, e la retta lunga — localmente euclidea e di Hausdorff ma non paracompatta — è una «varietà» su cui le partizioni dell&rsquo;unità non esistono.</div>`}
]},

/* ---------------- 02b · LA DIMOSTRAZIONE DI ESISTENZA ---------------- */
{ num:'02b', title:'Il teorema di esistenza, dimostrato in due versioni', meta:'Manetti su R^n con le corone · Abate e Lee su una varieta con lesaustione per compatti · dove entrano le tre ipotesi',
  blocchi:[
  {t:'prosa', title:'La versione di Manetti, su R^n: le corone sferiche', tag:'teorema', html:R`
  <p>Manetti dimostra il teorema prima su $\mathbb{R}^n$ (Teorema 1.1), ed è la versione in cui l&rsquo;idea si vede nuda. Dato il ricoprimento $\{U_i\}$, ogni punto $x$ sta in una palla $B(x,r_x)$ con chiusura dentro qualche $U_i$, e si può prendere $r_x\le\tfrac12$. Sono troppe palle: il Lemma 1.1 ne estrae una famiglia localmente finita usando le <b>corone</b>
  $$K_m=\{x\in\mathbb{R}^n:\ m\le\|x\|\le m+1\},$$
  che sono compatte. Ciascuna è coperta da un numero finito di palle centrate in suoi punti; e una palla di raggio al più $\tfrac12$ centrata in $K_m$ contiene solo punti di norma compresa fra $m-\tfrac12$ e $m+\tfrac32$, quindi tocca al più le tre corone $K_{m-1}$, $K_m$, $K_{m+1}$: si ha $m+\tfrac32<m+2$ e $m-1<m-\tfrac12$. Un punto qualunque ha un intorno che incontra un numero finito di corone, e ciascuna porta un numero finito di palle: <b>la famiglia è localmente finita</b>.</p>
  <p>Poi le funzioni: per ogni palla $B(x_h,r_h)$ si prende una bump $\lambda_h$ positiva esattamente sulla palla, si raggruppano le palle secondo l&rsquo;aperto $U_i$ che le contiene, $g_i=\sum_{h\to i}\lambda_h$, e si normalizza dividendo per la somma totale, che è positiva ovunque perché le palle ricoprono. Manetti verifica con cura che il supporto di $g_i$ sta in $U_i$: è l&rsquo;unione dei supporti delle palle raggruppate, e un&rsquo;unione <i>localmente finita</i> di chiusi è chiusa — il punto in cui la locale finitezza serve una seconda volta.</p>`},
  {t:'prosa', title:'La versione su una varieta: lesaustione per compatti, e latlante di Abate', tag:'teorema', html:R`
  <p>Su una varietà non ci sono corone, e il loro posto lo prende una <span class="str" data-str="esaustione-per-compatti">esaustione per compatti</span>: una successione $K_1\subseteq K_2\subseteq\cdots$ di compatti con $K_j$ contenuto nella parte interna di $K_{j+1}$ e unione $M$. Abate la costruisce nel Lemma 2.7.10 a partire da una base numerabile $\{P_j\}$ fatta di aperti a chiusura compatta, che esiste perché la varietà è localmente compatta e a base numerabile: si pone $K_1=\overline P_1$ e, se $K_j$ è costruito, lo si copre con i primi $r$ elementi della base e si pone $K_{j+1}$ uguale all&rsquo;unione delle loro chiusure.</p>
  <p>Il resto ricalca Manetti con le «corone» $K_{j+1}\setminus\operatorname{int}K_j$ al posto delle $K_m$. Per ogni punto di $\big(\operatorname{int}K_{j+2}\setminus K_{j-1}\big)\cap U_\alpha$ si sceglie una carta centrata con immagine la palla di raggio $2$, tutta contenuta in quell&rsquo;aperto; le controimmagini delle palle di raggio $\tfrac12$ coprono il compatto $K_{j+1}\setminus\operatorname{int}K_j$, e se ne estraggono finite. Unendo su $j$ si ottiene un <b>atlante numerabile e localmente finito</b>, che raffina il ricoprimento e in cui anche le palle di raggio $\tfrac12$ ricoprono: la locale finitezza viene dal fatto che ogni carta scelta al passo $j$ sta lontana da $K_{j-1}$. Il Teorema 2.7.12 trasporta in ogni carta la bump $\eta$ della prima tappa, normalizza, e infine <b>reindicizza</b>: ogni carta $\beta$ sta in qualche $U_{\alpha(\beta)}$, e si pone $\rho_\alpha=\sum_{\alpha(\beta)=\alpha}\tilde\rho_\beta$. Lee (Theorem 2.23) fa lo stesso con le palle coordinate regolari e il suo Theorem 1.15 sulla paracompattezza.</p>
  <p><b>Le tre ipotesi della definizione di varietà entrano tutte</b>, e conviene saper dire dove: la <b>locale compattezza</b> (gratis, dalle carte) dà i $P_j$ a chiusura compatta; la <b>base numerabile</b> rende la successione $K_j$ numerabile e quindi l&rsquo;esaustione possibile; <b>Hausdorff</b> garantisce che la chiusura in $M$ di una palla coordinata sia la palla chiusa della carta, che è compatta, e quindi che la bump trasportata ed estesa con zero fuori dalla carta sia liscia. Senza Hausdorff questo passo si rompe davvero: nella retta con due origini la chiusura di una palla attorno a un&rsquo;origine contiene anche l&rsquo;altra, e la bump estesa con zero vale $0$ nella seconda origine e quasi $1$ in tutti i punti vicini — non è nemmeno continua.</p>`},
  {t:'prosa', title:'Un trucco di Abate che non usa la partizione: il prodotto', tag:'esempio', html:R`
  <p>Per il caso particolare di una bump che valga $1$ su un <b>compatto</b> $K$ e si annulli fuori da un aperto $V\supseteq K$ (Proposizione 2.7.2), Abate non passa dalla partizione dell&rsquo;unità. Copre $K$ con finite carte, $K\subseteq\bigcup_{j\le k}\phi_j^{-1}(B_{1/2})$, prende in ciascuna la bump trasportata $g_j$, e pone
  $$g=1-\prod_{j=1}^{k}(1-g_j).$$
  Il prodotto si annulla appena un fattore si annulla, cioè appena una $g_j$ vale $1$: in ogni punto di $K$ una delle $g_j$ vale $1$, per esempio la prima, e allora $1-(1-1)(1-g_2)=1$. Fuori dall&rsquo;unione delle carte tutte le $g_j$ sono nulle e $g$ vale $0$. Per due carte lo sviluppo è $g_1+g_2-g_1g_2$: <b>è la formula di inclusione-esclusione</b>, e il motivo per cui funziona è che $1-g$ si comporta come la probabilità di non cadere in nessuna carta. Il trucco funziona solo con un numero <i>finito</i> di fattori, ed è per questo che vale su un compatto e non oltre.</p>`}
]},

/* ---------------- 03 · LE APPLICAZIONI ---------------- */
{ num:'03', title:'Le applicazioni classiche, e i loro confini', meta:'bump per un chiuso · estendere da un chiuso e due controesempi · lesaustione liscia, dimostrata',
  blocchi:[
  {t:'prosa', title:'A che cosa servono, in concreto', tag:'regola operativa', html:R`
  <ol>
   <li><b>Bump per un chiuso.</b> Dati un chiuso $A$ e un aperto $U\supseteq A$, esiste $\psi$ liscia con $0\le\psi\le1$, che vale <b>$1$ su $A$</b> e ha supporto dentro $U$ (Lee, Proposition 2.25). La dimostrazione è di due righe e mostra il metodo: si ricopre $M$ con i due aperti $U_0=U$ e $U_1=M\setminus A$, si prende una partizione subordinata $\{\psi_0,\psi_1\}$, e siccome $\psi_1$ si annulla su $A$ si ha $\psi_0=1$ lì. Il Corollario 2.7.3 di Abate è il caso $A=\{p\}$ girato al contrario: una $h$ liscia con $h(p)=0$ e $h=1$ fuori da un intorno di $p$, ed è lo strumento con cui si dimostra che le derivazioni sono operatori locali.</li>
   <li><b>Estensione da un chiuso.</b> Una funzione su un sottoinsieme $A$ si dice liscia se vicino a ogni punto di $A$ è la restrizione di una funzione liscia su un aperto (Abate, Definizione 2.7.4; Manetti, Definizione 1.1). Se $A$ è <b>chiuso</b>, una tale funzione si estende a una funzione liscia su tutta $M$ con supporto in un aperto prefissato (Lee, Lemma 2.26; Manetti, Corollario 1.1 su $\mathbb{R}^n$; Abate, Corollario 2.7.5 per i compatti). Si ricopre $M$ con gli aperti delle estensioni locali più il complementare di $A$, al quale si dà la funzione nulla, si prende una partizione subordinata, e si somma: in un punto di $A$ tutti gli addendi con peso non nullo valgono $f(p)$, tranne quello del complementare, che ha peso nullo su $A$, e la media pesata di numeri tutti uguali a $f(p)$ è $f(p)$.</li>
   <li><b>Funzione di esaustione liscia e positiva.</b> Esiste $h:M\to\mathbb{R}$ liscia, positiva, con i sottolivelli $h^{-1}\big((-\infty,c]\big)$ compatti per ogni $c$ (Lee, Proposition 2.28; Abate, Proposizione 2.7.14). Su $\mathbb{R}^n$ basta $\|x\|^2$; sulla palla aperta unitaria Lee propone $\frac{1}{1-\|x\|^2}$, il cui sottolivello di quota $c\ge1$ è la palla chiusa $|x|^2\le1-\tfrac1c$, compatta, mentre la funzione esplode avvicinandosi al bordo. Su una varietà qualunque si prende un ricoprimento numerabile $\{V_j\}$ fatto di aperti a chiusura compatta, una partizione subordinata $\{\psi_j\}$, e si pone $h=\sum_j j\,\psi_j$. È positiva perché $h\ge\sum_j\psi_j=1$; e se $p$ sta fuori dalle chiusure di $V_1,\dots,V_N$ allora i primi $N$ pesi in $p$ sono nulli e $h(p)$ supera $N$, perché è una media dei soli indici maggiori di $N$. Quindi il sottolivello di quota $c<N$ è un chiuso contenuto nell&rsquo;unione delle prime $N$ chiusure, che è compatta.</li>
  </ol>
  <p><b>A che cosa serve l&rsquo;esaustione</b>: a trattare una varietà non compatta un pezzo alla volta, con pezzi compatti che crescono e la cui frontiera si controlla con un numero. È l&rsquo;ingrediente della dimostrazione di Whitney per le varietà non compatte: Abate (Teorema 2.8.13) parte dall&rsquo;applicazione $F_0=(f,0,\dots,0)$ con $f$ un&rsquo;esaustione, che è <b>propria</b> perché la controimmagine di un compatto sta in un sottolivello di $f$, e la approssima entro distanza $1$ con un&rsquo;immersione iniettiva; un&rsquo;applicazione che resta a distanza limitata da una propria è ancora propria, e l&rsquo;embedding che ne esce ha immagine chiusa. <b>Non serve</b>, invece, a dimostrare che i campi vettoriali a supporto compatto sono completi: lì basta la compattezza del supporto, che dà da sola un tempo minimo di esistenza uguale per tutti i punti.</p>`},
  {t:'prosa', title:'I due controesempi che segnano i confini dellestensione', tag:'controesempio', html:R`
  <p><b>Se $A$ non è chiuso, l&rsquo;estensione può non esistere</b> (Lee, Exercise 2.27; Abate, Esercizio 2.144). Basta $A=(0,1]$ dentro $M=\mathbb{R}$ e $f(x)=1/x$: è liscia su $A$ nel senso delle estensioni locali, perché vicino a ogni punto di $A$ è la restrizione della stessa formula, ma per $x\to0^+$ tende a $+\infty$, quindi non si estende nemmeno con continuità a un intorno di $0$, che è un punto di accumulazione di $A$ non contenuto in $A$. <b>La chiusura di $A$ serve a impedire che il bordo di $A$ porti informazioni che $f$ non controlla.</b></p>
  <p><b>Se il codominio non è $\mathbb{R}^k$, l&rsquo;estensione può non esistere</b>, e qui il motivo è più profondo. L&rsquo;identità della circonferenza $S^1\to S^1$ è liscia sul chiuso $S^1\subseteq\mathbb{R}^2$, ma non ha nessuna estensione continua a $\mathbb{R}^2$ con valori in $S^1$ (Lee, dopo il Lemma 2.26): una tale estensione, ristretta al disco, sarebbe una retrazione del disco sul suo bordo, e il disco non si retrae sul suo bordo. La dimostrazione di quest&rsquo;ultimo fatto richiede strumenti che il corso non usa; ciò che conta qui è dove si rompe la costruzione con le partizioni: <b>la media pesata di punti della circonferenza non sta sulla circonferenza</b>, quindi la somma $\sum\psi_\alpha f_\alpha$ esce dal codominio. Lee dimostra più avanti (Corollary 6.27) che per mappe fra varietà il problema è soltanto topologico: un&rsquo;estensione liscia esiste se e solo se ne esiste una continua.</p>
  <p>E il contrasto con il mondo analitico, che Lee e Abate (Osservazione 2.7.6) sottolineano entrambi: <b>l&rsquo;analogo del lemma di estensione per funzioni analitiche reali è falso</b>, perché un&rsquo;analitica definita su un connesso che si annulla su un aperto è nulla ovunque, e quindi non si può prescrivere su un pezzo e lasciare libera altrove.</p>`},
  {t:'collaudo', title:'Controllo lampo', items:[
   {q:R`Perché non si può costruire una partizione dell'unità con funzioni analitiche?`,
    a:R`Perché una funzione analitica nulla su un aperto è nulla su tutta la componente connessa (principio di identità). Le $\rho_\alpha$ devono annullarsi fuori dal loro aperto e non essere identicamente nulle: <b>impossibile in categoria analitica</b>. È lo stesso principio che in analisi complessa rende unica la continuazione analitica: <b>la stessa rigidità che là è una risorsa, qui è un ostacolo</b>, ed è il motivo per cui la geometria analitica complessa usa tecniche completamente diverse, a partire dalla teoria dei fasci.`},
   {q:R`Dove si usa esattamente la base numerabile nella dimostrazione del teorema?`,
    a:R`Per costruire l'esaustione per compatti $K_1\subseteq K_2\subseteq\cdots$: la successione si fabbrica a partire da una base <b>numerabile</b> di aperti a chiusura compatta. Senza numerabilità la successione non esiste e la locale finitezza del raffinamento non si ottiene. <b>È il punto in cui un&rsquo;ipotesi apparentemente astratta diventa un passaggio concreto di una dimostrazione</b> — e all&rsquo;orale è una domanda tipica.`}
  ]}
]},

/* ---------------- 03a · OGNI CHIUSO E UNO ZERO-SET ---------------- */
{ num:'03a', title:'Ogni chiuso e linsieme degli zeri di una funzione liscia, e i quattro conti dei fogli', meta:'il teorema di Lee 2.29 dimostrato · Urysohn liscio · la funzione sotto una continua positiva · lipersuperficie che taglia un chiuso · C infinito ha dimensione infinita',
  blocchi:[
  {t:'prosa', title:'Il teorema, e la sua dimostrazione', tag:'teorema', html:R`
  <p>Lee lo presenta come «l&rsquo;ultima applicazione» del capitolo e dichiara che il libro quasi non lo usa; Diverio, invece, lo dà per buono in due fogli su sei. <b>Teorema</b> (Lee 2.29): <b>se $K$ è un chiuso di una varietà liscia $M$, esiste una funzione liscia $f\ge0$ il cui insieme degli zeri è esattamente $K$.</b> È sorprendente per contrasto: gli insiemi di livello di una funzione liscia, presa a caso, possono essere arbitrariamente brutti — un insieme di Cantor, una curva frattale — e il teorema dice che <i>ogni</i> chiuso, per quanto brutto, è uno di essi. La condizione di regolarità degli insiemi di livello sta tutta nel valore regolare, non nella liscezza della funzione.</p>
  <p><b>Dimostrazione in $\mathbb{R}^n$.</b> Il complementare di $K$ è aperto, quindi è unione numerabile di palle $B_{r_i}(x_i)$ con $r_i\le1$ contenute in esso. Si prende una bump $h$ uguale a $1$ sulla palla di raggio $\tfrac12$ e nulla fuori dalla palla unitaria, e per ogni $i$ una costante $C_i\ge1$ che maggiora $|h|$ e tutte le sue derivate parziali fino all&rsquo;ordine $i$. Si pone
  $$f(x)=\sum_{i\ge1}\frac{(r_i)^i}{2^iC_i}\,h\!\left(\frac{x-x_i}{r_i}\right).$$
  Ogni termine è positivo esattamente sulla sua palla, quindi $f$ si annulla su $K$ ed è positiva fuori. La serie converge uniformemente perché il termine $i$-esimo è maggiorato da $2^{-i}$, e $\sum_{i\ge1}2^{-i}=1$. Per la liscezza si derivano i termini: una derivata di ordine $k$ del termine $i$-esimo porta un fattore $r_i^{-k}$ dalla regola della catena, e quindi è maggiorata da $(r_i)^{i-k}/2^i$, che per $i\ge k$ non supera $2^{-i}$ perché $r_i\le1$. Ogni serie delle derivate converge uniformemente, e il teorema di derivazione delle serie dà $f$ di classe $C^\infty$. <b>Il trucco è scegliere i coefficienti in modo che ogni derivata, prima o poi, sia dominata</b>: le costanti $C_i$ e le potenze $(r_i)^i$ servono esattamente a questo.</p>
  <p><b>Su una varietà</b> si ricopre $M$ con palle coordinate, si applica il caso euclideo in ciascuna — ottenendo $f_\alpha\ge0$ con zeri esattamente $K\cap B_\alpha$ — e si incolla con una partizione subordinata, $f=\sum\psi_\alpha f_\alpha$. Gli zeri sono giusti perché una somma di termini non negativi si annulla solo se ogni termine si annulla.</p>`},
  {t:'reveal', title:'I quattro esercizi dei fogli di Diverio che lo usano', tag:'esame', steps:[
   {label:'Foglio 2, Es. 10: Urysohn liscio', body:R`
   <p>Si chiede: dati due chiusi disgiunti $A$ e $B$, una $f$ liscia con $0\le f\le1$, $A=f^{-1}(0)$ e $B=f^{-1}(1)$, usando senza dimostrarlo che ogni chiuso è lo zero-set di una funzione liscia non negativa. È l&rsquo;Esercizio 2.138 di Abate e il Lemma 1.2 di Manetti, ma con una richiesta in più: <b>gli insiemi dove $f$ vale $0$ e $1$ devono essere esattamente $A$ e $B$</b>, non solo contenerli. La partizione dell&rsquo;unità di $\{M\setminus A, M\setminus B\}$, che è la prova di Manetti, dà solo il contenimento.</p>
   <p>Con il teorema si fa in una riga. Si prendono $g_A,g_B\ge0$ lisce con zeri esattamente $A$ e $B$, e si pone
   $$f=\frac{g_A}{g_A+g_B}.$$
   Il denominatore non si annulla mai, perché i due zero-set sono disgiunti. Su $A$ si ha $g_A=0$ e $g_B>0$, quindi $f|_A=0$; su $B$ il denominatore si riduce a $g_A$ e $f|_B=1$. Fuori da $A\cup B$ entrambe sono positive e $f$ sta strettamente fra $0$ e $1$: gli insiemi di livello $0$ e $1$ sono esattamente $A$ e $B$. <b>È la stessa forma del gradino della prima tappa</b>, con le due funzioni zero-set al posto delle due copie di $e^{-1/t}$.</p>`},
   {label:'Foglio 6, Es. 8: una liscia sotto una continua, nulla su un chiuso', body:R`
   <p>Si chiede: dato un chiuso $C$ e una funzione continua $\delta>0$, una $\tilde\delta$ liscia con $\tilde\delta=0$ su $C$, $\tilde\delta>0$ fuori, e $\tilde\delta<\delta$. È l&rsquo;Esercizio 2.145 di Abate, e il suggerimento di Diverio è la funzione $f/(f+1)$, con $f\ge0$ liscia e zero-set $C$.</p>
   <p>Prima si trova una liscia $\psi$ con $0<\psi<\delta$ (Abate 2.145(i)): si ricopre $M$ con aperti $V_j$ a chiusura compatta, su ciascuna chiusura $\delta$ ha un minimo positivo $m_j$, e con una partizione subordinata $\{\rho_j\}$ si pone $\psi=\sum_j\tfrac{m_j}{2}\rho_j$. In un punto $p$ contano solo i $j$ con $p$ nella chiusura di $V_j$, per i quali $\tfrac{m_j}{2}<\delta(p)$, quindi $\psi(p)$ è una media di numeri minori di $\delta(p)$. Poi si pone $\tilde\delta=\psi\cdot\frac{f}{f+1}$. Il secondo fattore è nullo esattamente su $C$, positivo fuori, e minore di $1$ perché la differenza da $1$ vale $\frac{1}{f+1}$, che è positiva: quindi $\tilde\delta<\psi<\delta$. <b>Il fattore $\frac{f}{f+1}$ è il modo canonico di trasformare una funzione non negativa in una limitata da $1$ senza cambiarne gli zeri.</b> Diverio usa poi la $\tilde\delta$ per approssimare una funzione continua con una liscia $\delta$-vicina, che è il primo passo dei teoremi di approssimazione di Whitney.</p>`},
   {label:'Foglio 6, Es. 6: unipersuperficie che taglia un chiuso qualunque', body:R`
   <p>Si chiede: dato un chiuso $A$ dell&rsquo;iperpiano $S=\mathbb{R}^n\times\{0\}$, un&rsquo;ipersuperficie chiusa $S'$ con $S\cap S'=A$. Il suggerimento è di nuovo il teorema. Si prende $f\ge0$ liscia su $\mathbb{R}^n$ con zero-set $A$, e si pone $S'=\{(x,f(x))\}$, il grafico di $f$: è una sottovarietà chiusa di dimensione $n$, perché grafico di una funzione liscia, e incontra l&rsquo;iperpiano esattamente dove $f$ si annulla, cioè in $A$.</p>
   <p><b>Il senso dell&rsquo;esercizio è un avvertimento</b>: due sottovarietà lisce, entrambe chiuse e della stessa dimensione, possono intersecarsi in un chiuso <i>qualunque</i> — un insieme di Cantor, una successione con il suo limite — se non sono trasverse. È la ragione per cui i teoremi sulle intersezioni richiedono sempre l&rsquo;ipotesi di trasversalità, e il foglio lo mette subito prima degli esercizi che la usano.</p>`},
   {label:'Foglio 2, Es. 3: lo spazio delle funzioni lisce ha dimensione infinita', body:R`
   <p>Si chiede: se $M$ non è vuota, $C^\infty(M)$ ha dimensione infinita, con il suggerimento di mostrare che funzioni lisce a supporti non vuoti e disgiunti sono linearmente indipendenti. È il Problem 2-7 di Lee, alla lettera. Se $\sum_jc_jf_j=0$ e $p_j$ è un punto dove $f_j$ non si annulla, gli altri $f_i$ sono nulli in $p_j$ (supporti disgiunti), quindi valutando in $p_j$ resta $c_jf_j(p_j)=0$ e $c_j=0$.</p>
   <p>Le funzioni si costruiscono con le bump: in una carta si prendono $k$ palle disgiunte e una bump in ciascuna, estesa con zero fuori dalla carta. Siccome $k$ è arbitrario, <b>non c&rsquo;è un numero finito di funzioni che generi tutte le altre</b>. La dimensione positiva della varietà serve a trovare infinite palle disgiunte in una carta; per una varietà di dimensione zero con infiniti punti il risultato vale ugualmente, ma con funzioni caratteristiche dei punti al posto delle bump.</p>`}
  ]},
  {t:'plot', title:'Urysohn liscio: il gradino fra due chiusi disgiunti',
   intro:R`Sulla retta, con $A=(-\infty,-1]$ e $B=[1,+\infty)$: due funzioni lisce non negative con zero-set esattamente $A$ e $B$, e il loro rapporto $f=g_A/(g_A+g_B)$.`,
   plots:[
    {kind:'func2d', xr:[-2.5,2.5], yr:[-0.1,1.2], height:320,
     title:'f vale 0 esattamente su A e 1 esattamente su B, e nessun altro punto raggiunge quei valori',
     xlabel:'x', ylabel:'valori',
     curves:[
      {f:'(x>-1)?exp(-1/(x+1)):0', col:'#5eead4', width:2.0, dash:true, label:'g_A, zeri su A'},
      {f:'(x<1)?exp(-1/(1-x)):0', col:'#b98cff', width:2.0, dash:true, label:'g_B, zeri su B'},
      {f:'(x<=-1)?0:((x>=1)?1:exp(-1/(x+1))/(exp(-1/(x+1))+exp(-1/(1-x))))', col:'#d8a13a', width:2.8, label:'f = g_A/(g_A+g_B)'}
     ],
     segs:[{x1:-2.5, y1:0, x2:-1, y2:0, col:'#ff6b6b', width:3, label:'A', lx:-2, ly:0.07},
           {x1:1, y1:0, x2:2.5, y2:0, col:'#ff6b6b', width:3, label:'B', lx:1.9, ly:0.07}]}
   ],
   leggi:R`<b>Le due curve tratteggiate</b> sono le funzioni zero-set: quella verde è nulla esattamente su $A$ e cresce dopo, quella viola è nulla esattamente su $B$. Nessuna delle due è una bump — non valgono $1$ da nessuna parte — e non serve: il teorema le fornisce non negative con gli zeri giusti, e tanto basta.<br><br>
   <b>La curva oro</b> è il loro rapporto normalizzato. Vale $0$ su tutto $A$, $1$ su tutto $B$, e sta strettamente in mezzo nell&rsquo;intervallo aperto $(-1,1)$, dove entrambe le funzioni sono positive. È questa la differenza con la partizione dell&rsquo;unità a due elementi: lì si ottiene una funzione che vale $0$ <i>almeno</i> su $A$; qui l&rsquo;insieme dove vale $0$ è <i>esattamente</i> $A$, ed è ciò che il foglio chiede.`}
]},

/* ---------------- 03b · APPROSSIMARE ---------------- */
{ num:'03b', title:'Approssimare una funzione continua con una liscia', meta:'Manetti per terzi su un compatto · Whitney con una media in una palla · perche la tolleranza e una funzione e non un numero',
  blocchi:[
  {t:'prosa', title:'La versione di Manetti: togliere un terzo alla volta', tag:'teorema', html:R`
  <p>Il Teorema 1.2 di Manetti, che lui chiama «Stone-Weierstrass, caso particolare», dice che <b>una funzione continua su un compatto $K\subseteq\mathbb{R}^n$ si approssima uniformemente quanto si vuole con funzioni lisce</b>, e la dimostrazione usa soltanto l&rsquo;Urysohn liscio. Sia $|f|\le M$ su $K$. Gli insiemi $A=\{f\ge M/3\}$ e $B=\{f\le-M/3\}$ sono chiusi disgiunti, e una funzione di Urysohn opportunamente riscalata dà una $g_1$ liscia con valori fra $-M/3$ e $M/3$, uguale a $M/3$ su $A$ e a $-M/3$ su $B$.</p>
  <p>Si guarda l&rsquo;errore $f-g_1$ in tre zone. Su $A$ la funzione sta fra $M/3$ e $M$, le si toglie $M/3$, e il resto sta fra $0$ e $M-\tfrac{M}{3}=\tfrac{2}{3}M$. Su $B$ è lo stesso con i segni cambiati. Fuori da $A\cup B$ si ha $|f|<M/3$ e $|g_1|\le M/3$, quindi l&rsquo;errore è ancora sotto $\tfrac23M$. <b>Un passo riduce il massimo dell&rsquo;errore di un terzo</b>; applicato all&rsquo;errore stesso, il passo successivo lo riduce ancora, e dopo $n$ passi la funzione liscia $g_1+\dots+g_n$ dista da $f$ al più $(2/3)^nM$, che tende a zero. È lo stesso argomento con cui si dimostra il teorema di estensione di Tietze, e qui lavora con funzioni lisce perché l&rsquo;unico mattone che usa — l&rsquo;Urysohn — è liscio.</p>`},
  {t:'prosa', title:'La versione di Whitney: una media dentro una palla', tag:'teorema', html:R`
  <p>Lee (Theorem 6.21) dimostra un enunciato molto più forte, e la dimostrazione è più corta. Due funzioni $F,\tilde F:M\to\mathbb{R}^k$ si dicono <b>$\delta$-vicine</b>, con $\delta$ una funzione continua positiva, se $|F(y)-\tilde F(y)|<\delta(y)$ in ogni punto. <b>Teorema</b>: per ogni $F$ continua e ogni $\delta$ continua positiva esiste $\tilde F$ liscia $\delta$-vicina a $F$; e se $F$ è già liscia su un chiuso $A$, si può prendere $\tilde F=F$ su $A$.</p>
  <p><b>Dimostrazione</b>, nel caso senza $A$. Per ogni punto $x$ si sceglie un intorno $U_x$ così piccolo che vi valgano insieme $\delta(y)>\tfrac12\delta(x)$ e $|F(y)-F(x)|<\tfrac12\delta(x)$, il che si può fare per continuità; allora per $y\in U_x$ si ha $|F(y)-F(x)|<\delta(y)$. Si estrae un sottoricoprimento numerabile $\{U_{x_i}\}$ — la base numerabile, ancora — e si prende una partizione subordinata $\{\varphi_i\}$. Si pone
  $$\tilde F(y)=\sum_i\varphi_i(y)\,F(x_i).$$
  È liscia perché somma localmente finita di funzioni lisce moltiplicate per costanti. E in un punto $y$ contano solo gli indici con $y\in U_{x_i}$, per i quali il valore costante $F(x_i)$ sta nella palla di centro $F(y)$ e raggio $\delta(y)$. <b>$\tilde F(y)$ è una media pesata di punti di quella palla, e la palla è convessa</b>: quindi $\tilde F(y)$ sta nella palla, cioè $|\tilde F(y)-F(y)|<\delta(y)$. Il caso con $A$ aggiunge al ricoprimento l&rsquo;aperto dove un&rsquo;estensione liscia di $F|_A$ è già $\delta$-vicina, con la sua funzione al posto della costante.</p>
  <p><b>È lo schema di incollamento nella sua forma più nuda</b>: oggetti locali costanti, una partizione, e la convessità del bersaglio che fa tornare i conti. Ed è la ragione per cui la stessa dimostrazione non funziona per mappe a valori in una varietà: Lee passa per un intorno tubolare del bersaglio (Theorem 6.26), che dà ai punti vicini una media ragionevole proiettando sul punto più vicino.</p>`},
  {t:'prosa', title:'Perche la tolleranza e una funzione, e un esempio calcolato', tag:'esempio', html:R`
  <p>Su un compatto una tolleranza costante basta; su una varietà non compatta no. Con $\delta$ costante un&rsquo;approssimazione può allontanarsi dalla funzione di una quantità fissa anche «all&rsquo;infinito», e cambiare comportamenti che dipendono da ciò che succede lontano — per esempio la proprietà di essere propria. Con $\delta(y)\to0$ verso l&rsquo;infinito si impone che l&rsquo;approssimazione diventi sempre più fedele dove la varietà esce dai compatti, ed è esattamente ciò che serve nei teoremi di Whitney. Il foglio 6 di Diverio, Esercizio 8, costruisce prima la $\tilde\delta$ liscia sotto la $\delta$ continua e poi chiede proprio l&rsquo;approssimazione $\delta$-vicina di una continua: è questo teorema, con il dato di una funzione liscia su un chiuso.</p>
  <p>L&rsquo;esempio più semplice è $F(x)=|x|$ su $\mathbb{R}$, continua e non liscia, con tolleranza costante $\varepsilon$. La funzione $\sqrt{x^2+\varepsilon^2}$ è liscia, e la sua distanza da $|x|$ si calcola razionalizzando:
  $$\sqrt{x^2+\varepsilon^2}-|x|=\frac{\varepsilon^2}{\sqrt{x^2+\varepsilon^2}+|x|}.$$
  Il denominatore vale almeno $\varepsilon$, quindi la differenza è al più $\varepsilon$, con il massimo nell&rsquo;origine, dove lo spigolo viene arrotondato; lontano dall&rsquo;origine la differenza tende a zero da sola. <b>L&rsquo;approssimazione è peggiore esattamente dove la funzione non è liscia</b>, ed è un fatto generale: lo sforzo di un&rsquo;approssimazione liscia si concentra sugli spigoli.</p>`},
  {t:'plot', title:'Lo spigolo di |x| arrotondato: una liscia a distanza al piu epsilon',
   intro:R`La funzione $|x|$ e le sue approssimazioni lisce $\sqrt{x^2+\varepsilon^2}$ per $\varepsilon=0{,}5$ e $\varepsilon=0{,}2$.`,
   plots:[
    {kind:'func2d', xr:[-2,2], yr:[-0.1,2.1], height:310,
     title:'la distanza massima e nellorigine e vale epsilon; lontano le curve si confondono',
     xlabel:'x', ylabel:'valori',
     curves:[
      {f:'abs(x)', col:'#ff6b6b', width:2.4, label:'|x|, continua e non liscia'},
      {f:'sqrt(x*x+0.25)', col:'#5eead4', width:2.4, label:'epsilon = 0,5'},
      {f:'sqrt(x*x+0.04)', col:'#d8a13a', width:2.4, label:'epsilon = 0,2'}
     ],
     marks:[{x:0, y:0.5, label:'scarto 0,5', col:'#5eead4'},{x:0, y:0.2, label:'scarto 0,2', col:'#d8a13a', left:true}]}
   ],
   leggi:R`<b>Lo scarto fra ciascuna curva liscia e la $|x|$ rossa</b> è massimo sull&rsquo;asse verticale, dove vale esattamente $\varepsilon$, e decresce allontanandosi: per $|x|=2$ è già sotto un decimo nel caso $\varepsilon=0{,}5$. Dimezzare la tolleranza stringe la curva sullo spigolo senza toccare quasi niente altrove.<br><br>
   <b>Che cosa portare via</b>: un&rsquo;approssimazione liscia non è un&rsquo;operazione globale e uniforme, ma un lavoro locale concentrato dove la funzione è cattiva. È esattamente ciò che la dimostrazione di Whitney rende sistematico: in ogni intorno $U_{x_i}$ si mette una costante, e la partizione dell&rsquo;unità raccorda le costanti; dove la funzione varia poco bastano pochi intorni grandi, dove varia molto ne servono tanti e piccoli.`}
]},

/* ---------------- 03c · LA COSTRUZIONE COMPLETA, E LA METRICA RIEMANNIANA ---------------- */
{ num:'03c', title:'Lo schema di incollamento, e il primo risultato che se ne ricava', meta:'dal locale al globale in tre passi · ogni varieta ammette una metrica · e perche la convessita e lingrediente nascosto',
  blocchi:[
  {t:'prosa', title:'Lo schema di incollamento, una volta per tutte', tag:'metodo', html:R`
  <p>Ogni applicazione delle partizioni dell&rsquo;unità segue lo stesso schema, e impararlo come schema fa risparmiare il lavoro di rifarlo ogni volta. Si vuole costruire un oggetto globale $\Theta$ su $M$ e si sa costruirlo <i>in carta</i>. Allora:</p>
  <ol>
   <li>si prende un ricoprimento $\{U_\alpha\}$ fatto di domini di carta — dove ciascuna carta è un <span class="str" data-str="omeomorfismo">omeomorfismo</span> su un aperto euclideo — e in ciascuno si costruisce l&rsquo;oggetto locale $\Theta_\alpha$, usando che in carta si lavora in $\mathbb{R}^{n}$, dove tutto è noto;</li>
   <li>si prende una partizione dell&rsquo;unità $\{\rho_\alpha\}$ subordinata al ricoprimento, cioè con supporti dentro gli $U_\alpha$ e somma uguale a uno;</li>
   <li>si definisce $\Theta=\sum_\alpha\rho_\alpha\,\Theta_\alpha$.</li>
  </ol>
  <p><b>La somma ha senso</b> perché la famiglia dei supporti è localmente finita: vicino a ogni punto solo un numero finito di addendi è non nullo, e la somma è in realtà finita. <b>Il risultato è liscio</b> perché somma finita di lisce. <b>Ed è globale</b> perché è definito ovunque, pur essendo stato costruito a pezzi. Tutte le applicazioni della tappa precedente sono questo schema con $\Theta$ a valori reali.</p>
  <div class="note"><b>La condizione che rende lecito il passo 3, e che si dimentica sempre.</b> La combinazione $\sum\rho_\alpha\Theta_\alpha$ è una <i>media pesata</i> degli oggetti locali, con pesi non negativi che sommano a uno. Perché il risultato sia ancora un oggetto del tipo giusto, <b>l&rsquo;insieme degli oggetti ammissibili deve essere convesso</b>. Vale per le funzioni reali, per le metriche (una media di prodotti scalari definiti positivi è definita positiva), per le connessioni; <b>non</b> vale per le mappe a valori in una sfera, come si è visto con l&rsquo;identità di $S^1$, né per i campi di vettori mai nulli — che è il motivo per cui non si dimostra con le partizioni dell&rsquo;unità che ogni varietà ammetta un campo di vettori mai nullo, e infatti è falso.</div>`},
  {t:'reveal', title:'Il teorema che ne esce subito: ogni varieta ha una metrica riemanniana', tag:'costruzione', steps:[
   {label:'Che cosa serve dimostrare', body:R`
   <p>Una <b>metrica riemanniana</b> è la scelta, in ogni punto, di un prodotto scalare definito positivo sullo spazio tangente, che vari in modo liscio. Serve a misurare lunghezze di curve, angoli, aree — tutto ciò che il corso di Diverio non fa, e che è il capitolo successivo di ogni percorso di geometria; in <b>Lee</b> è il capitolo 13, in Abate il capitolo 6.</p>
   <p><b>La domanda è se esista sempre</b>, e la risposta è sì per ogni varietà (di Hausdorff e a base numerabile). La dimostrazione è tre righe con lo schema appena visto, ed è l&rsquo;esempio canonico del suo uso.</p>`},
   {label:'La dimostrazione', body:R`
   <p>In una carta $(U_\alpha,\varphi_\alpha)$ si trasporta indietro il prodotto scalare standard di $\mathbb{R}^{n}$: si pone $g_\alpha(v,w)=\langle d\varphi_\alpha(v),\,d\varphi_\alpha(w)\rangle$. È un prodotto scalare definito positivo su ogni spazio tangente dei punti di $U_\alpha$, e dipende in modo liscio dal punto.</p>
   <p>Vale la pena notare che ogni $g_\alpha$ è definita <i>solo</i> su $U_\alpha$ e fuori non ha senso: è il caso tipico in cui un oggetto locale non si estende da sé, e senza funzioni di taglio non ci sarebbe modo di sommarle.</p>
   <p>Poi si incolla: $g=\sum_\alpha\rho_\alpha\,g_\alpha$, dove ogni prodotto $\rho_\alpha g_\alpha$ si intende esteso con lo zero fuori dal supporto — operazione lecita e liscia proprio perché $\rho_\alpha$ si annulla con tutte le sue derivate sul bordo del supporto. Il risultato resta <b>bilineare e simmetrico</b> perché la combinazione lineare di forme bilineari simmetriche lo è; e resta <b>definita positiva</b> perché per $v\ne0$</p>
   $$g(v,v)=\sum_\alpha\rho_\alpha\,g_\alpha(v,v)>0,$$
   <p>essendo ogni addendo non negativo e almeno uno strettamente positivo (i $\rho_\alpha$ sommano a uno, quindi non sono tutti nulli nel punto). <b>È qui che entra la convessità</b>, e si vede perché senza di essa lo schema fallirebbe.</p>`},
   {label:'E il contrasto che rende il risultato interessante', body:R`
   <p>Confronta con le <b>metriche lorentziane</b>, quelle della relatività, dove la forma bilineare ha segnatura $(-,+,+,+)$ invece che definita positiva. <b>Non ogni varietà ne ammette una</b>: l&rsquo;insieme delle forme di segnatura mista <i>non è convesso</i>, e la media di due forme lorentziane può essere degenere. Già nel piano: le forme $\eta_1=\mathrm{diag}(-1,1)$ ed $\eta_2=\mathrm{diag}(1,-1)$ hanno entrambe segnatura mista, ma la loro media è $\tfrac12(\eta_1+\eta_2)=0$, la forma nulla. Lo schema salta. Per una varietà compatta l&rsquo;esistenza di una metrica lorentziana equivale ad avere <span class="str" data-str="caratteristica-di-eulero">caratteristica di Eulero</span> nulla, ed è per questo che la sfera $S^{4}$ non può essere uno spazio-tempo mentre il toro sì.</p>
   <p><b>Questo confronto è il modo migliore per capire quanto è forte lo strumento e quanto è stretta la sua ipotesi.</b> Le partizioni dell&rsquo;unità danno gratis tutto ciò che è convesso, e nulla di ciò che non lo è. Ogni volta che in un corso più avanzato si incontrerà un teorema di esistenza «per ogni varietà», si potrà scommettere che dietro c&rsquo;è questo schema — e ogni volta che un&rsquo;esistenza è ostruita da un invariante topologico, si potrà scommettere che la convessità mancava.</p>`}
  ]},
  {t:'prosa', title:'Perche nel mondo analitico niente di tutto questo funziona', tag:'first principles', html:R`
  <p>Tutto il movimento poggia su un fatto dell&rsquo;analisi che vale la pena isolare: <b>esistono funzioni lisce non nulle a supporto compatto</b>. È ciò che permette di «spegnere» un oggetto locale fuori da una carta senza rompere la levigatezza.</p>
  <p>Per le funzioni <b>analitiche</b> — quelle che coincidono localmente con la propria serie di Taylor — questo è impossibile. Se una funzione analitica su un aperto connesso si annulla su un insieme con un punto di accumulazione, si annulla ovunque: è il principio di identità, e in analisi complessa è il teorema degli zeri isolati. <b>Una funzione analitica non nulla non può essere identicamente zero su un aperto</b>, quindi non può avere supporto compatto in una varietà connessa — è l&rsquo;Osservazione 2.7.6 di Abate.</p>
  <p><b>La conseguenza è drastica</b>: in geometria analitica reale e in geometria complessa <i>non esistono partizioni dell&rsquo;unità</i>, e tutti i teoremi di esistenza dimostrati con esse cadono. Al loro posto si usano tecniche completamente diverse — la teoria dei fasci, le stime $L^{2}$ per l&rsquo;operatore $\bar\partial$ — e la differenza di difficoltà è enorme. <b>Che la geometria differenziale liscia sia «facile» rispetto a quella complessa dipende in buona parte da questa singola funzione</b>, $e^{-1/t}$, e dal fatto che il liscio sia molto più flessibile dell&rsquo;analitico.</p>
  <p>Vale anche l&rsquo;osservazione opposta, ed è quella che dà il senso del corso: <b>la flessibilità ha un prezzo</b>. Nel mondo liscio ci sono così tanti oggetti che spesso non c&rsquo;è niente di canonico — una varietà ammette infinite metriche, infinite connessioni, infinite funzioni. Nel mondo analitico ce ne sono pochissimi, e quei pochi sono rigidi e carichi di informazione. <b>Si sceglie il mondo in base a che cosa si vuole: costruire, oppure classificare.</b></p>`}
]},

/* ---------------- 03d · ESERCIZI ---------------- */
{ num:'03d', title:'Esercizi — tocca a te', meta:'costruire un bump esplicito · estendere una funzione da un chiuso · e un caso in cui lo schema fallisce',
  blocchi:[
  {t:'esercizio', title:'1 · Il bump, costruito davvero',
   src:'il conto che tutti citano e pochi svolgono',
   testo:R`Partendo da $f(t)=e^{-1/t}$ per $t>0$ e $f(t)=0$ per $t\le0$, costruisci una funzione liscia $\beta:\mathbb{R}\to[0,1]$ che valga $1$ per $|x|\le1$ e $0$ per $|x|\ge2$. Verifica ogni passaggio.`,
   steps:[
    {label:'Il mattone, e perche e liscio', body:R`
    <p>La funzione $f$ è ovviamente liscia per $t\ne0$. In $t=0$ tutte le derivate destre sono della forma $P(1/t)\,e^{-1/t}$ con $P$ polinomio, e</p>
    $$\lim_{t\to0^{+}}P(1/t)\,e^{-1/t}=0,$$
    <p>perché l'esponenziale batte ogni potenza. Le derivate sinistre sono tutte nulle. <b>Quindi $f$ è $C^{\infty}$ e tutte le sue derivate si annullano nell'origine</b>: la sua serie di Taylor in $0$ è identicamente nulla, e non rappresenta la funzione da nessuna parte a destra. <b>È il controesempio classico a «liscio implica analitico».</b></p>`},
    {label:'Dal mattone al gradino, e dal gradino al bump', body:R`
    <p>Si costruisce prima un <b>gradino liscio</b> che sale da $0$ a $1$:</p>
    $$g(t)=\frac{f(t)}{f(t)+f(1-t)}.$$
    <p>Il denominatore non si annulla mai: per $t\le0$ vale $f(1-t)>0$, per $t\ge1$ vale $f(t)>0$, e per $t$ nell'intervallo aperto sono positivi entrambi. Quindi $g$ è liscia come quoziente di lisce con denominatore non nullo; vale $0$ per $t\le0$, vale $1$ per $t\ge1$, e cresce in mezzo. Poi si compone per ottenere il bump:</p>
    $$\beta(x)=g\!\left(2-|x|\right).$$
    <p>Per $|x|\ge2$ l'argomento è $\le0$ e $\beta=0$; per $|x|\le1$ l'argomento è $\ge1$ e $\beta=1$. <b>Il valore assoluto sembra un problema</b> — non è liscio nell'origine — ma lì $\beta$ vale costantemente $1$ in tutto un intorno, quindi la non levigatezza di $|x|$ cade dove non ha effetto. <b>È un trucco che vale la pena conservare: comporre con una funzione non liscia è lecito se la composizione è costante dove quella si rompe.</b></p>`}
   ]},
  {t:'plot', title:'Il gradino liscio e il bump costruiti nellesercizio',
   intro:R`A sinistra il gradino $g(t)=\dfrac{f(t)}{f(t)+f(1-t)}$ con $f(t)=e^{-1/t}$; a destra il bump $\beta(x)=g(2-|x|)$, che vale $1$ su $[-1,1]$ e $0$ fuori da $[-2,2]$.`,
   plots:[
    {kind:'func2d', xr:[-0.5,1.5], yr:[-0.1,1.15], height:310,
     title:'il gradino: da 0 a 1 senza spigoli, e costante fuori da [0,1]',
     xlabel:'t', ylabel:'g(t)',
     curves:[{f:'t=x; t<=0 ? 0 : (t>=1 ? 1 : exp(-1/t)/(exp(-1/t)+exp(-1/(1-t))))', col:'#5eead4', width:2.8, label:'g(t)'}],
     segs:[{x1:-0.5, y1:0, x2:1.5, y2:0, col:'#4d5a6b', width:1},
           {x1:-0.5, y1:1, x2:1.5, y2:1, col:'#4d5a6b', dash:true, width:1}],
     marks:[{x:0, y:0, label:'tutte le derivate nulle', col:'#ff6b6b', up:true},
            {x:1, y:1, label:'idem qui', col:'#ff6b6b', left:true}]},
    {kind:'func2d', xr:[-3,3], yr:[-0.1,1.15], height:310,
     title:'il bump: identicamente 1 al centro, identicamente 0 fuori',
     xlabel:'x', ylabel:'beta(x)',
     curves:[{f:'t=2-abs(x); t<=0 ? 0 : (t>=1 ? 1 : exp(-1/t)/(exp(-1/t)+exp(-1/(1-t))))', col:'#d8a13a', width:2.8, label:'beta(x)'}],
     segs:[{x1:-3, y1:0, x2:3, y2:0, col:'#4d5a6b', width:1},
           {x1:-1, y1:0, x2:-1, y2:1.1, col:'#b98cff', dash:true, width:1.2},
           {x1:1, y1:0, x2:1, y2:1.1, col:'#b98cff', dash:true, width:1.2},
           {x1:-2, y1:0, x2:-2, y2:1.1, col:'#ff6b6b', dash:true, width:1.2},
           {x1:2, y1:0, x2:2, y2:1.1, col:'#ff6b6b', dash:true, width:1.2}],
     marks:[{x:0, y:1, label:'vale esattamente 1', col:'#d8a13a', up:true},
            {x:2.5, y:0, label:'esattamente 0', col:'#ff6b6b', up:true}]}
   ],
   leggi:R`<p><b>La cosa da guardare è che le curve sono <i>esattamente</i> piatte agli estremi</b>, non solo quasi. In $t=0$ e $t=1$ il gradino ha tutte le derivate nulle, e si raccorda con le costanti $0$ e $1$ senza lasciare traccia: nessuna misura, per quanto precisa, potrebbe individuare il punto di attacco guardando la funzione e le sue derivate lì.</p>
   <p>È questa piattezza infinita che rende possibile l'incollamento. Una funzione che raccordasse con derivata prima nulla ma seconda diversa da zero darebbe un oggetto $C^{1}$ e non $C^{\infty}$, e <b>tutte le costruzioni del corso perderebbero un grado di regolarità a ogni passo</b> — cosa che le renderebbe inutilizzabili nelle dimostrazioni, dove si deriva un numero imprecisato di volte.</p>
   <p><b>E qui si vede anche perché nessuna funzione analitica può fare questo lavoro.</b> Il bump è identicamente nullo su un intervallo e non identicamente nullo: per il principio di identità, un'analitica con quella proprietà non esiste. <b>La curva disegnata è liscia e non è la somma della propria serie di Taylor</b> in nessun punto del bordo — ed è il motivo per cui in geometria complessa questo movimento non esiste.</p>`},
  {t:'esercizio', title:'2 · Estendere una funzione da un chiuso, e perche serve',
   src:'la seconda applicazione classica, con il controesempio che la rende non banale',
   testo:R`Sia $A\subseteq M$ chiuso e $f:A\to\mathbb{R}$ liscia, nel senso che si estende localmente a funzioni lisce su aperti. Mostra che esiste $\tilde f$ liscia su tutta $M$ che coincide con $f$ su $A$. Perché il risultato sarebbe falso per funzioni solo continue su un chiuso qualunque di uno spazio qualunque?`,
   steps:[
    {label:'La costruzione', body:R`
    <p>Per ipotesi ogni punto di $A$ ha un intorno $U_\alpha$ su cui esiste $f_\alpha$ liscia che coincide con $f$ su $A\cap U_\alpha$. Si aggiunge all'elenco l'aperto $U_0=M\setminus A$ con la funzione $f_0=0$: insieme, questi aperti ricoprono $M$.</p>
    <p>Si prende una partizione dell'unità $\{\rho_\alpha\}$ subordinata e si pone $\tilde f=\sum_\alpha\rho_\alpha f_\alpha$. Su un punto $p\in A$ tutti gli addendi con $\rho_\alpha(p)\ne0$ hanno $f_\alpha(p)=f(p)$ — tranne $f_0$, il cui supporto non tocca $A$ — quindi</p>
    $$\tilde f(p)=\sum_\alpha\rho_\alpha(p)\,f(p)=f(p).$$
    <b>Funziona perché i valori sono numeri reali</b>, e l'insieme dei numeri reali è convesso: la media pesata di tanti valori uguali a $f(p)$ è $f(p)$.</p>`},
    {label:'Dove si romperebbe', body:R`
    <p>Se la funzione avesse valori in un insieme <b>non convesso</b> — per esempio in $S^{1}$ — la media pesata di più valori uguali resterebbe corretta sui punti di $A$, ma fuori potrebbe uscire dal bersaglio: la media di due punti della circonferenza non sta sulla circonferenza. <b>L'estensione di mappe a valori in una varietà è un problema molto più difficile</b>, con ostruzioni topologiche vere: l'identità di $S^1$ non si estende con continuità al disco.</p>
    <p>E in uno spazio topologico qualunque l'enunciato continuo analogo — il teorema di Tietze — richiede ipotesi (normalità) che qui sono gratis perché le varietà sono metrizzabili. <b>Il punto dell'esercizio è che «estendere» è facile solo quando si può fare una media</b>, e che le partizioni dell'unità sono esattamente la macchina per fare medie su una varietà.</p>`}
   ]},
  {t:'collaudo', title:'Controlla di aver capito', html:R`
  <ol>
  <li>Perché la somma $\sum_\alpha\rho_\alpha$ è una somma finita in ogni punto, benché gli indici possano essere infiniti?</li>
  <li>Dove esattamente entra l'ipotesi di base numerabile nella dimostrazione di esistenza?</li>
  <li>Si può usare lo schema per dimostrare che ogni varietà ammette un campo di vettori mai nullo?</li>
  </ol>`,
   sol:R`<ol>
   <li>Perché si richiede che la famiglia dei supporti sia <b>localmente finita</b>: ogni punto ha un intorno che incontra solo un numero finito di supporti. Non è la stessa cosa di «solo un numero finito di $\rho_\alpha$ è non nullo nel punto» — è più forte, e serve perché anche le <i>derivate</i> della somma siano calcolabili termine a termine in un intorno. <b>Senza locale finitezza la somma potrebbe essere definita e non liscia.</b></li>
   <li>Entra nel garantire la <b>paracompattezza</b>: da ogni ricoprimento aperto si può estrarre un raffinamento localmente finito. La dimostrazione passa per l'esaustione in <span class="str" data-str="compattezza">compatti</span> $K_1\subset K_2\subset\cdots$, che richiede base numerabile e locale compattezza — entrambe conseguenze della definizione di varietà. <b>È il punto in cui le due ipotesi «tecniche» della definizione pagano il loro debito</b>, e la ragione per cui la retta lunga, che le viola, non ammette partizioni dell'unità.</li>
   <li><b>No</b>, e il motivo è la convessità. La media pesata di vettori non nulli può essere nulla — due vettori opposti con pesi uguali danno zero — quindi l'insieme dei «vettori non nulli» non è convesso e lo schema non conclude. <b>E il risultato è genuinamente falso</b>: sulla sfera $S^{2}$ non esiste nessun campo di vettori tangenti mai nullo, che è il teorema della palla pelosa. <b>Quando lo schema fallisce non è per debolezza della dimostrazione</b>: è perché c'è un'ostruzione vera, e riconoscere la differenza è metà del mestiere.</li>
   </ol>`}
]},

/* ---------------- 04 · IL SENSO ---------------- */
{ num:'04', title:'Il senso, e le rotte', meta:'cosa apre, e perche la liscezza e diversa dallanaliticita',
  blocchi:[
  {t:'prosa', title:'Cosa lascia in mano', tag:'sintesi', html:R`
  <p><b>Il punto.</b> La geometria differenziale è <b>flessibile</b>: si possono modificare oggetti su una regione senza toccarli altrove. Questa libertà non è gratuita — viene dall&rsquo;esistenza di funzioni lisce non analitiche — ed è ciò che distingue questo corso dalla geometria complessa e da quella algebrica, dove le funzioni sono rigide e i teoremi hanno un sapore opposto.</p>
  <p><b>A valle.</b> Le bump servono a manipolare i germi di funzioni con cui si definiscono i vettori tangenti come derivazioni; lo schema di incollamento serve a costruire campi vettoriali globali e metriche; l&rsquo;esaustione e la funzione sotto una continua positiva sono gli ingredienti dei teoremi di Whitney e degli intorni tubolari.</p>`},
  {t:'prolessi', title:'Dove riappare questo movimento',
   oggetto:R`<b>La partizione dell&rsquo;unità</b>: pesi lisci che sommano a uno, e trasformano il locale in globale.`,
   rotte:[
    {dove:'Fisica<br>matematica', txt:R`Le <b>funzioni test</b> a supporto compatto sono lo spazio su cui si definiscono le distribuzioni (Metodi, me-09): la delta di Dirac è un funzionale su funzioni costruite esattamente come quelle di questa tappa. <b>Senza $e^{-1/t}$ non ci sarebbe la teoria delle distribuzioni.</b>`},
    {dove:'Relativita<br>generale', txt:R`Ogni varietà ammette una metrica riemanniana grazie a questa costruzione, ma <b>non ogni varietà ammette una metrica lorentziana</b>: serve un campo vettoriale mai nullo, e la palla pelosa (gd-07) dice che su $S^2$ non ne esistono. <b>La topologia vincola quali spazi-tempo sono possibili.</b>`},
    {dove:'Analisi<br>numerica', txt:R`I metodi a <b>elementi finiti</b> e le <b>partizioni dell&rsquo;unità</b> numeriche usano letteralmente questa idea: funzioni di forma locali, pesate, che sommano a uno. La geometria astratta e il calcolo pratico condividono la stessa struttura.`},
    {dove:'Teoria<br>dei fasci', txt:R`L'esistenza delle partizioni dell'unita' equivale al fatto che i fasci di funzioni lisce siano <b>aciclici</b>: e' la ragione per cui in geometria differenziale la coomologia si calcola con de Rham e non serve tutto l'apparato che occorre nel caso olomorfo.`}
   ],
   domanda:R`La funzione $e^{-1/t}$ è liscia ma la sua serie di Taylor non la rappresenta: fra la funzione e tutte le sue derivate in un punto c&rsquo;è uno scarto invisibile al calcolo differenziale. <b>Domanda che porti avanti:</b> quanto è grande quello scarto? La risposta è sorprendente — per il teorema di Borel, <b>ogni</b> successione di numeri può essere la successione dei coefficienti di Taylor di una funzione liscia. Cioè: conoscere <i>tutte</i> le derivate in un punto non dice <b>niente</b> sulla funzione altrove. In fisica questo è il motivo per cui le serie perturbative possono divergere pur descrivendo bene una teoria, e perché esistono effetti «non perturbativi» — come il tunneling — <b>invisibili a ogni ordine dello sviluppo</b>.`}
]}

function sectionPlot(b){

  wrap.innerHTML='<h3>'+b.title+'<span class="tag plottag">figura</span></h3>';
  if(b.intro){ var i=elFromHTML('<div class="plot-intro">'+b.intro+'</div>'); typeset(i); wrap.appendChild(i); }
  var specs = b.plots || [b];
  var row=document.createElement('div'); row.className='plot-row'+(specs.length>1?' due':'');
  specs.forEach(function(s){
    if(s.w===undefined) s.w = specs.length>1 ? 430 : 560;   // mai dedurre la larghezza dal DOM: il box non e ancora in pagina
