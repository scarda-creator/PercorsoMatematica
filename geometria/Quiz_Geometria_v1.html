<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Geometria — Algebra Lineare (Diverio)</title>
<style>
  :root{
    --bg:#0e1117; --panel:#161b22; --panel2:#1c232d; --border:#2b333d;
    --txt:#e6edf3; --muted:#9aa7b4; --accent:#4c8dff; --accent2:#7aa2ff;
    --ok:#2ea043; --okbg:#10331b; --bad:#d83a3a; --badbg:#3a1414;
    --warn:#d8a13a; --warnbg:#332a10;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    font-size:17px;line-height:1.5;}
  .wrap{max-width:820px;margin:0 auto;padding:24px 18px 80px;}
  h1{font-size:1.5rem;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:.92rem;margin:0 0 22px;}
  .hidden{display:none!important;}

  /* ---- MENU ---- */
  .mode-row{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
  .mode-btn{flex:1;min-width:220px;border:1px solid var(--border);background:var(--panel);
    color:var(--txt);padding:16px;border-radius:12px;cursor:pointer;text-align:left;
    transition:.15s;}
  .mode-btn:hover{border-color:var(--accent);background:var(--panel2);}
  .mode-btn b{font-size:1.05rem;}
  .mode-btn span{display:block;color:var(--muted);font-size:.85rem;margin-top:4px;}
  .mode-btn.primary{border-color:var(--accent);background:#13233f;}

  .pool-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:640px){.pool-grid{grid-template-columns:1fr;}}
  .pool-card{border:1px solid var(--border);background:var(--panel);border-radius:12px;
    padding:14px;cursor:pointer;transition:.15s;position:relative;}
  .pool-card:hover{border-color:var(--accent);background:var(--panel2);}
  .pool-card.empty{opacity:.55;cursor:not-allowed;}
  .pool-card.empty:hover{border-color:var(--border);background:var(--panel);}
  .pool-card .n{font-weight:600;font-size:.98rem;}
  .pool-card .meta{color:var(--muted);font-size:.8rem;margin-top:6px;}
  .badge{display:inline-block;font-size:.7rem;font-weight:700;padding:2px 8px;
    border-radius:20px;margin-top:8px;letter-spacing:.3px;}
  .badge.full{background:var(--okbg);color:#5fd980;border:1px solid #235c33;}
  .badge.todo{background:var(--warnbg);color:#e0b85a;border:1px solid #5c4a23;}

  /* ---- QUIZ ---- */
  .qhead{display:flex;justify-content:space-between;align-items:center;
    color:var(--muted);font-size:.82rem;margin-bottom:14px;}
  .qhead .src{font-style:italic;}
  .progress{height:5px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-bottom:18px;}
  .progress > i{display:block;height:100%;background:var(--accent);width:0;transition:.3s;}

  .fig{background:var(--panel);border:1px solid var(--border);border-radius:10px;
    padding:12px;margin:0 0 16px;text-align:center;overflow-x:auto;}
  .qtext{font-size:1.08rem;margin:0 0 18px;}
  .qtext .lbl{display:inline-block;background:var(--panel2);border:1px solid var(--border);
    color:var(--accent2);font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:6px;
    margin-right:8px;vertical-align:middle;}

  .opts{display:flex;flex-direction:column;gap:10px;}
  .opt{border:1px solid var(--border);background:var(--panel);color:var(--txt);
    padding:13px 15px;border-radius:10px;cursor:pointer;text-align:left;
    font-size:1rem;transition:.12s;}
  .opt:hover:not(:disabled){border-color:var(--accent);background:var(--panel2);}
  .opt:disabled{cursor:default;}
  .opt.correct{border-color:var(--ok);background:var(--okbg);}
  .opt.wrong{border-color:var(--bad);background:var(--badbg);}

  .fb{margin-top:16px;border-radius:10px;padding:14px;font-size:.95rem;display:none;}
  .fb.show{display:block;}
  .fb.hint{background:var(--badbg);border:1px solid #6b2222;}
  .fb.hint b{color:#ff8585;}
  .fb.sol{background:var(--okbg);border:1px solid #235c33;}
  .fb.sol b{color:#5fd980;}

  .navrow{margin-top:20px;display:flex;justify-content:space-between;align-items:center;gap:12px;}
  .cont{background:var(--accent);color:#fff;border:none;padding:12px 20px;border-radius:10px;
    font-size:1rem;font-weight:600;cursor:pointer;transition:.12s;}
  .cont:hover{background:var(--accent2);}
  .menu-btn{background:transparent;color:var(--muted);border:1px solid var(--border);
    padding:10px 16px;border-radius:10px;cursor:pointer;font-size:.9rem;}
  .menu-btn:hover{color:var(--txt);border-color:var(--accent);}

  .end{text-align:center;padding:40px 10px;}
  .end h2{font-size:1.4rem;}
  .end .score{font-size:2.2rem;font-weight:700;color:var(--accent2);margin:10px 0;}

  /* ---- math helpers ---- */
  .matrix{display:inline-flex;flex-direction:column;vertical-align:middle;
    border-left:2px solid var(--txt);border-right:2px solid var(--txt);
    padding:2px 8px;margin:0 3px;border-radius:3px;}
  .mrow{display:flex;justify-content:center;}
  .mcell{min-width:26px;text-align:center;padding:1px 5px;font-variant-numeric:tabular-nums;}
  .vec{display:inline-flex;flex-direction:column;vertical-align:middle;
    border-left:2px solid var(--txt);border-right:2px solid var(--txt);
    padding:2px 6px;margin:0 2px;border-radius:3px;}
  code,.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.95em;}
  svg{max-width:100%;height:auto;}
  .axislbl{font-size:11px;fill:var(--muted);}
</style>
</head>
<body>
<div class="wrap">

  <!-- ===================== MENU ===================== -->
  <section id="menu">
    <h1>Quiz Geometria — Algebra Lineare</h1>
    <p class="sub">Geometria per Fisici · Sapienza · docente Diverio. Difficolt&agrave; calibrata sugli esami in banca-dati. Risposta sbagliata &rarr; suggerimento mirato sul trabocchetto.</p>

    <div class="mode-row">
      <button class="mode-btn primary" onclick="start('ALL')">
        <b>&#127922; Mischia tutto</b>
        <span>Tutte le domande dei pool disponibili, in ordine casuale.</span>
      </button>
    </div>

    <div class="pool-grid" id="poolGrid"></div>
  </section>

  <!-- ===================== QUIZ ===================== -->
  <section id="quiz" class="hidden">
    <div class="qhead">
      <span id="qpool"></span>
      <span id="qpos"></span>
    </div>
    <div class="progress"><i id="qbar"></i></div>

    <div class="fig hidden" id="qfig"></div>
    <p class="qtext" id="qtext"></p>
    <div class="opts" id="qopts"></div>

    <div class="fb hint" id="qhint"></div>
    <div class="fb sol" id="qsol"></div>

    <div class="navrow">
      <button class="menu-btn" onclick="toMenu()">&#8592; Menu</button>
      <button class="cont hidden" id="qcont"></button>
    </div>
  </section>

  <!-- ===================== END ===================== -->
  <section id="end" class="hidden">
    <div class="end">
      <h2>Pool completato</h2>
      <div class="score" id="endScore"></div>
      <p class="sub" id="endMsg"></p>
      <button class="cont" onclick="toMenu()">Torna al menu</button>
    </div>
  </section>

</div>

<script>
"use strict";

/* =====================================================================
   HELPERS DI RENDERING MATEMATICO
   ===================================================================== */
function M(rows){
  return '<span class="matrix">'+rows.map(function(r){
    return '<div class="mrow">'+r.map(function(c){return '<span class="mcell">'+c+'</span>';}).join('')+'</div>';
  }).join('')+'</span>';
}
function V(col){ // vettore colonna
  return '<span class="vec">'+col.map(function(c){return '<div class="mrow">'+c+'</div>';}).join('')+'</span>';
}
function shuffle(a){
  for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}
  return a;
}

/* =====================================================================
   FIGURE SVG INLINE (riutilizzabili)
   ===================================================================== */
var SVG = {
  // due piani per l'origine in R^3 che si intersecano in una retta
  duePiani:
    '<svg viewBox="0 0 320 180" width="320" height="180">'+
    '<polygon points="40,40 200,20 280,80 120,100" fill="#4c8dff" opacity="0.20" stroke="#4c8dff"/>'+
    '<polygon points="60,140 230,150 250,70 80,60" fill="#7aa2ff" opacity="0.20" stroke="#7aa2ff"/>'+
    '<line x1="70" y1="90" x2="255" y2="78" stroke="#e6edf3" stroke-width="2.5"/>'+
    '<text x="205" y="15" class="axislbl">U</text>'+
    '<text x="255" y="62" class="axislbl">W</text>'+
    '<text x="258" y="92" class="axislbl">U&#8745;W</text>'+
    '</svg>'
};

/* =====================================================================
   DEFINIZIONE POOL (ordine = mappa esercizi, freq. decrescente)
   status: 'full' = popolato a fondo | 'todo' = da estendere
   ===================================================================== */
var POOLS = [
 {

  "name": "1 · Sottospazi & Grassmann",
  "diff": "2&ndash;3",
  "status": "full"
 },
 {

  "name": "2 · Diagonalizzabilit&agrave; (m.a. vs m.g.)",

 },
 {

  "name": "3 · Prod. scalare / Gram&ndash;Schmidt / Spettrale",

 },
 {

  "name": "4 · Sistemi parametrici (Rouch&eacute;&ndash;Capelli)",

 {

  "name": "6 · Numeri complessi e strutture su &#8450;",

var Q = {"sottospazi":[{"pool":"sottospazi","src":"tipo 1 · Span e dipendenza","steps":[{"t":"In &#8477;&#8308; siano v&#8321;=(1,0,1,0), v&#8322;=(0,1,0,1), v&#8323;=(1,1,1,1). Quanto vale dim&#8202;Span(v&#8321;,v&#8322;,v&#8323;)?","opts":[{"x":"2","c":true},{"x":"3"},{"x":"1"},{"x":"4"}],"hint":"<b>Conta i generatori INDIPENDENTI, non i generatori.</b> Verifica se v&#8323; &egrave; combinazione di v&#8321; e v&#8322;.","sol":"<b>dim = 2.</b> v&#8323; = v&#8321;+v&#8322;, quindi v&#8323; &egrave; ridondante: lo Span coincide con Span(v&#8321;,v&#8322;), che sono indipendenti. Per definizione, dim&#8202;Span = numero massimo di vettori linearmente indipendenti (rango del sistema di generatori)."}]},{"pool":"sottospazi","src":"tipo 1 · Grassmann (stima minima)","steps":[{"t":"Siano U,&#8202;W sottospazi di &#8477;&#8309; con dim&#8202;U=3 e dim&#8202;W=4. Qual &egrave; il MINIMO valore possibile di dim(U&#8745;W)?","opts":[{"x":"2","c":true},{"x":"0"},{"x":"1"},{"x":"3"}],"hint":"<b>U+W vive dentro &#8477;&#8309;</b>, quindi dim(U+W) &le; 5. Isola dim(U&#8745;W) dalla formula di Grassmann.","sol":"<b>2.</b> Grassmann: dim(U&#8745;W)=dim&#8202;U+dim&#8202;W&minus;dim(U+W)=3+4&minus;dim(U+W) &ge; 7&minus;5 = 2."}]},{"pool":"sottospazi","src":"tipo 1 · Grassmann (stima massima)","steps":[{"t":"Stessi dati: U,&#8202;W &sub; &#8477;&#8309;, dim&#8202;U=3, dim&#8202;W=4. Qual &egrave; il MASSIMO possibile di dim(U&#8745;W)?","opts":[{"x":"3","c":true},{"x":"4"},{"x":"2"},{"x":"7"}],"hint":"L&rsquo;intersezione &egrave; contenuta sia in U sia in W: non pu&ograve; superare la dimensione del pi&ugrave; piccolo.","sol":"<b>3.</b> Per la monotonia della dimensione rispetto all&rsquo;inclusione (U&#8745;W &sube; U e U&#8745;W &sube; W), dim(U&#8745;W) &le; min(dim&#8202;U,dim&#8202;W)=3, raggiunto quando U &sub; W."}]},{"pool":"sottospazi","src":"prova20190121 Es. 3 (trabocchetto esplicito)","steps":[{"t":"L&rsquo;insieme S = { A &isin; M&#8322;(&#8477;) : det&#8202;A = 0 } &egrave; un sottospazio vettoriale di M&#8322;(&#8477;)?","opts":[{"x":"No: non &egrave; chiuso per somma","c":true},{"x":"S&igrave;, ha dimensione 3"},{"x":"S&igrave;, &egrave; il nucleo del det"},{"x":"S&igrave;, contiene 0 quindi basta"}],"hint":"<b>Il determinante non &egrave; lineare.</b> Cerca due matrici singolari la cui somma sia invertibile.","sol":"<b>No.</b> Per il criterio di sottospazio serve la chiusura per somma: prendi A=<span class=\"matrix\"><div class=\"mrow\"><span class=\"mcell\">1</span><span class=\"mcell\">0</span></div><div class=\"mrow\"><span class=\"mcell\">0</span><span class=\"mcell\">0</span></div></span> e B=<span class=\"matrix\"><div class=\"mrow\"><span class=\"mcell\">0</span><span class=\"mcell\">0</span></div><div class=\"mrow\"><span class=\"mcell\">0</span><span class=\"mcell\">1</span></div></span>: det&#8202;A=det&#8202;B=0, ma A+B=I con det=1&ne;0. S non &egrave; chiuso per somma. (Contenere 0 &egrave; necessario, non sufficiente.)"}]},{"pool":"sottospazi","src":"prova20190121 (analogia traccia)","steps":[{"t":"L&rsquo;insieme T = { A &isin; M&#8322;(&#8477;) : tr&#8202;A = 0 } &egrave; un sottospazio? Se s&igrave;, di che dimensione?","opts":[{"x":"S&igrave;, dimensione 3","c":true},{"x":"No, non contiene 0"},{"x":"S&igrave;, dimensione 1"},{"x":"No, la traccia non &egrave; lineare"}],"hint":"A differenza del determinante, la traccia <b>&egrave;</b> lineare: tr(A+B)=tr&#8202;A+tr&#8202;B e tr(&lambda;A)=&lambda;&#8202;tr&#8202;A.","sol":"<b>S&igrave;, dim = 3.</b> T = ker della forma lineare tr : M&#8322;(&#8477;)&rarr;&#8477;, non nulla. Per il teorema del rango applicato al funzionale (il nucleo di una forma lineare non nulla &egrave; un iperpiano), dim = 4&minus;1 = 3."}]},{"pool":"sottospazi","src":"tipo 1 · {A diagonalizzabile} (trabocchetto)","steps":[{"t":"L&rsquo;insieme D = { A &isin; M&#8322;(&#8477;) : A diagonalizzabile } &egrave; un sottospazio di M&#8322;(&#8477;)?","opts":[{"x":"No: somma di diagonalizzabili pu&ograve; non esserlo","c":true},{"x":"S&igrave;, &egrave; chiuso per somma e prodotto per scalare"},{"x":"S&igrave;, perch&eacute; contiene tutte le simmetriche"},{"x":"No, perch&eacute; non contiene la matrice nulla"}],"hint":"La nulla &egrave; diagonalizzabile, quindi 0&isin;D. Il problema &egrave; la <b>chiusura per somma</b>. Cerca un controesempio con autovalori distinti.","sol":"<b>No.</b> Il criterio di sottospazio richiede la chiusura per somma, che qui fallisce: A=<span class=\"matrix\"><div class=\"mrow\"><span class=\"mcell\">1</span><span class=\"mcell\">2</span></div><div class=\"mrow\"><span class=\"mcell\">0</span><span class=\"mcell\">&minus;1</span></div></span> (autovalori 1,&minus;1: diag.) e B=diag(&minus;1,1) (diag.) danno A+B=<span class=\"matrix\"><div class=\"mrow\"><span class=\"mcell\">0</span><span class=\"mcell\">2</span></div><div class=\"mrow\"><span class=\"mcell\">0</span><span class=\"mcell\">0</span></div></span>, che ha autovalore 0 doppio ma non &egrave; nulla: non diagonalizzabile."}]},{"pool":"sottospazi","src":"tipo 1 · sottospazi di R[t]","steps":[{"t":"In &#8477;[t]<sub>&le;3</sub> (polinomi di grado &le; 3, dim 4) considera U = { p : p(1)=0 }. Quanto vale dim&#8202;U?","opts":[{"x":"3","c":true},{"x":"4"},{"x":"2"},{"x":"1"}],"hint":"p &#8614; p(1) &egrave; un <b>funzionale lineare non nullo</b>. Il suo nucleo abbassa la dimensione di 1.","sol":"<b>3.</b> La valutazione p&#8614;p(1) &egrave; un funzionale lineare non nullo; U &egrave; il suo nucleo. Per il teorema del rango (nucleo di una forma lineare non nulla = iperpiano), dim = 4&minus;1 = 3."}]},{"pool":"sottospazi","src":"tipo 1 · vincoli multipli su polinomi","steps":[{"t":"In &#8477;[t]<sub>&le;2</sub> (dim 3) sia U = { p : p(0)=0 e p&prime;(0)=0 }. Quanto vale dim&#8202;U?","opts":[{"x":"1","c":true},{"x":"2"},{"x":"0"},{"x":"3"}],"hint":"Scrivi p = a+bt+ct&sup2;. Traduci p(0)=0 e p&prime;(0)=0 in condizioni su a,b,c.","sol":"<b>1.</b> p(0)=a=0 e p&prime;(0)=b=0, q dentro un singolo autospazio degenere. Q ortogonale richiede colonne di norma 1: saltare la normalizzazione (opzione 3) d&agrave; solo C invertibile, non Q ortogonale. GS sulle colonne di A (opzione 1) non c&rsquo;entra con gli autovettori."}]},{"pool":"spettrale","src":"tipo 3 · MODUS OPERANDI · ordine di Gram&ndash;Schmidt","steps":[{"t":"<b>MODUS OPERANDI.</b> Applichi Gram&ndash;Schmidt alla lista ordinata (v&#8321;,v&#8322;,v&#8323;) indipendente e hai gi&agrave; costruito u&#8321;,u&#8322; ortogonali. Qual &egrave; la formula corretta per u&#8323;?","opts":[{"x":"u&#8323; = v&#8323; &minus; (&#9001;v&#8323;,u&#8321;&#9002;/&#9001;u&#8321;,u&#8321;&#9002;)u&#8321; &minus; (&#9001;v&#8323;,u&#8322;&#9002;/&#9001;u&#8322;,u&#8322;&#9002;)u&#8322;","c":true},{"x":"u&#8323; = v&#8323; &minus; (&#9001;v&#8323;,v&#8321;&#9002;/&#9001;v&#8321;,v&#8321;&#9002;)v&#8321; &minus; (&#9001;v&#8323;,v&#8322;&#9002;/&#9001;v&#8322;,v&#8322;&#9002;)v&#8322;"},{"x":"u&#8323; = v&#8323; &minus; (&#9001;v&#8323;,u&#8322;&#9002;/&#9001;u&#8322;,u&#8322;&#9002;)u&#8322; (solo l&rsquo;ultimo costruito)"},{"x":"u&#8323; = v&#8323; &minus; (&#9001;v&#8323;,u&#8321;+u&#8322;&#9002;/&#9001;u&#8321;+u&#8322;,u&#8321;+u&#8322;&#9002;)(u&#8321;+u&#8322;)"}],"hint":"Le proiezioni vanno sottratte sui vettori GI&Agrave; ORTOGONALIZZATI u&#8321;,u&#8322; (uno per uno), non sugli originali v&#8321;,v&#8322; e non solo sull&rsquo;ultimo.","sol":"<b>u&#8323; = v&#8323; &minus; (&#9001;v&#8323;,u&#8321;&#9002;/&#9001;u&#8321;,u&#8321;&#9002;)u&#8321; &minus; (&#9001;v&#8323;,u&#8322;&#9002;/&#9001;u&#8322;,u&#8322;&#9002;)u&#8322;.</b> Nel processo di Gram&ndash;Schmidt ogni nuovo vettore si ottiene sottraendo a v&#8323; la sua proiezione su <i>tutti</i> i vettori gi&agrave; resi ortogonali. Proiettare sugli originali v&#8321;,v&#8322; (opzione 2) non garantisce &#9001;u&#8323;,u&#8322;&#9002;=0 perch&eacute; v&#8321;,v&#8322; non sono ortogonali; fermarsi a u&#8322; (opzione 3) lascia una componente lungo u&#8321;."}]},{"pool":"spettrale","src":"tipo 3 · Gram&ndash;Schmidt su 3 vettori (L1+L2)","steps":[{"t":"<span class=\"lbl\">L1</span> In &#8477;&#179; standard applica Gram&ndash;Schmidt a v&#8321;=(1,1,1), v&#8322;=(1,1,0), v&#8323;=(1,0,0). Posto u&#8321;=v&#8321;, quanto vale u&#8322;?","opts":[{"x":"(&#8531;, &#8531;, &minus;&#8532;)","c":true},{"x":"(1, 1, 0)"},{"x":"(&#8532;, &#8532;, &#8531;)"},{"x":"(0, 0, &minus;1)"}],"hint":"u&#8322; = v&#8322; &minus; (&#9001;v&#8322;,u&#8321;&#9002;/&#9001;u&#8321;,u&#8321;&#9002;)u&#8321;. Calcola &#9001;v&#8322;,u&#8321;&#9002;=2 e &#9001;u&#8321;,u&#8321;&#9002;=3.","sol":"<b>(&#8531;, &#8531;, &minus;&#8532;).</b> Per Gram&ndash;Schmidt u&#8322;=(1,1,0)&minus;(2/3)(1,1,1)=(&#8531;,&#8531;,&minus;&#8532;). Verifica: u&#8322;&middot;u&#8321;=&#8531;+&#8531;&minus;&#8532;=0.","cont":"Continua &rarr; calcola u&#8323;"},{"t":"<span class=\"lbl\">L2</span> Con u&#8321;=(1,1,1) e u&#8322;=(&#8531;,&#8531;,&minus;&#8532;), quanto vale u&#8323;?","opts":[{"x":"(&frac12;, &minus;&frac12;, 0)","c":true},{"x":"(1, 0, 0)"},{"x":"(&#8531;, &minus;&#8531;, 0)"},{"x":"(0, &minus;&frac12;, &frac12;)"}],"hint":"u&#8323; = v&#8323; &minus; (&#9001;v&#8323;,u&#8321;&#9002;/&#9001;u&#8321;,u&#8321;&#9002;)u&#8321; &minus; (&#9001;v&#8323;,u&#8322;&#9002;/&#9001;u&#8322;,u&#8322;&#9002;)u&#8322;. Qui &#9001;v&#8323;,u&#8321;&#9002;=1, &#9001;v&#8323;,u&#8322;&#9002;=&#8531;, &#9001;u&#8322;,u&#8322;&#9002;=&#8532;.","sol":"<b>(&frac12;, &minus;&frac12;, 0).</b> u&#8323;=(1,0,0)&minus;(1/3)(1,1,1)&minus;(&frac12;)(&#8531;,&#8531;,&minus;&#8532;)=(&frac12;,&minus;&frac12;,0). Per il processo di Gram&ndash;Schmidt vanno sottratte le proiezioni su ENTRAMBI u&#8321;,u&#8322;: fermarsi a u&#8321; (opzione 2) lascia u&#8323; non ortogonale a u&#8322;. Verifica: u&#8323;&middot;u&#8321;=0 e u&#8323;&middot;u&#8322;=0."}]},{"pool":"spettrale","src":"tipo 3 · MODUS OPERANDI · proiezione su base non ortogonale","steps":[{"t":"<b>MODUS OPERANDI.</b> Devi proiettare x su W=Span(a,b) con a,b indipendenti ma NON ortogonali. Il coefficiente lungo a &egrave; &#9001;x,a&#9002;/&#9001;a,a&#9002; come nel caso di un solo vettore?","opts":[{"x":"No: con base non ortogonale risolvi il sistema normale (o prima ortogonalizzi con GS)","c":true},{"x":"S&igrave;: la formula &#9001;x,a&#9002;/&#9001;a,a&#9002; vale per ogni vettore della base"},{"x":"S&igrave;, purch&eacute; prima normalizzi a e b"},{"x":"No: se a,b non sono ortogonali la proiezione su W non esiste"}],"hint":"La formula proj<sub>W</sub>x=&sum;(&#9001;x,e<sub>i</sub>&#9002;/&#9001;e<sub>i</sub>,e<sub>i</sub>&#9002;)e<sub>i</sub> vale SOLO se gli e<sub>i</sub> sono ortogonali tra loro. La sola normalizzazione non toglie l&rsquo;obliquit&agrave;.","sol":"<b>No: sistema normale (o GS prima).</b> Per il teorema di proiezione ortogonale proj<sub>W</sub>x esiste sempre ed &egrave; unica (W di dim finita), ma la scrittura per coefficienti disaccoppiati &#9001;x,a&#9002;/&#9001;a,a&#9002; richiede base ORTOGONALE. Con a,b obliqui i coefficienti c&#8321;,c&#8322; risolvono il sistema normale (le equazioni &#9001;x&minus;c&#8321;a&minus;c&#8322;b, a&#9002;=0, &#9001;x&minus;c&#8321;a&minus;c&#8322;b, b&#9002;=0), matrice di Gram non diagonale. Normalizzare (opzione 3) cambia la lunghezza ma non annulla &#9001;a,b&#9002;."}]},{"pool":"spettrale","src":"tipo 3 · autospazio degenere e ortonormalizzazione (spettrale)","steps":[{"t":"Diagonalizzi ortogonalmente A simmetrica 3&times;3 con &lambda;=5 (m.a.=2) e &lambda;=&minus;1 (m.a.=1). Per &lambda;=5 trovi due autovettori w&#8321;,w&#8322; NON ortogonali tra loro. Come costruisci la parte di Q relativa a &lambda;=5?","opts":[{"x":"Applico GS a {w&#8321;,w&#8322;} DENTRO l&rsquo;autospazio, poi normalizzo","c":true},{"x":"Scarto w&#8322; e tengo solo w&#8321; normalizzato"},{"x":"Sono autovettori dello stesso &lambda;: sono gi&agrave; ortogonali, normalizzo e basta"},{"x":"Applico GS mescolando w&#8321;,w&#8322; con l&rsquo;autovettore di &lambda;=&minus;1"}],"hint":"Autovettori dello STESSO autovalore NON sono automaticamente ortogonali. GS va fatto solo dentro l&rsquo;autospazio di &lambda;=5; l&rsquo;autovettore di &lambda;=&minus;1 &egrave; gi&agrave; ortogonale ad essi per il teorema spettrale.","sol":"<b>GS su {w&#8321;,w&#8322;} dentro l&rsquo;autospazio, poi normalizzo.</b> Il teorema spettrale garantisce l&rsquo;ortogonalit&agrave; tra autospazi di autovalori DISTINTI, non tra due autovettori dello stesso &lambda;: dentro l&rsquo;autospazio di dim&#8202;2 servono Gram&ndash;Schmidt e normalizzazione. Scartare w&#8322; (opzione 2) perde una dimensione; mescolare con l&rsquo;autovettore di &lambda;=&minus;1 (opzione 4) distrugge la struttura ad autovettori."}]},{"pool":"spettrale","src":"tipo 3 · Cauchy&ndash;Schwarz · caso di uguaglianza","steps":[{"t":"In uno spazio con prodotto scalare vale |&#9001;u,v&#9002;| &le; &#8741;u&#8741;&#8741;v&#8741; (Cauchy&ndash;Schwarz). L&rsquo;uguaglianza |&#9001;u,v&#9002;|=&#8741;u&#8741;&#8741;v&#8741; vale se e solo se...","opts":[{"x":"u e v sono linearmente dipendenti (paralleli)","c":true},{"x":"u &egrave; ortogonale a v"},{"x":"&#8741;u&#8741;=&#8741;v&#8741;"},{"x":"sempre: &egrave; un&rsquo;uguaglianza"}],"hint":"Nella disuguaglianza di Cauchy&ndash;Schwarz l&rsquo;uguaglianza &egrave; il caso estremo dei vettori PROPORZIONALI. L&rsquo;ortogonalit&agrave; d&agrave; &#9001;u,v&#9002;=0, l&rsquo;estremo opposto.","sol":"<b>u,v linearmente dipendenti.</b> La disuguaglianza di Cauchy&ndash;Schwarz si dimostra da &#8741;v&#8741;&sup2;&#8741;u&minus;tv&#8741;&sup2;&ge;0 (con t=&#9001;u,v&#9002;/&#8741;v&#8741;&sup2;) e diventa uguaglianza esattamente quando u&minus;tv=0, cio&egrave; u&#8741;v proporzionali. Se u&perp;v allora &#9001;u,v&#9002;=0&lt;&#8741;u&#8741;&#8741;v&#8741; (per u,v&ne;0): disuguaglianza stretta."}]},{"pool":"spettrale","src":"tipo 3 · Cauchy&ndash;Schwarz · vincolo sul prodotto","steps":[{"t":"In uno spazio con prodotto scalare &#8741;u&#8741;=2 e &#8741;v&#8741;=3. Pu&ograve; essere &#9001;u,v&#9002;=7?","opts":[{"x":"No: |&#9001;u,v&#9002;| &le; &#8741;u&#8741;&#8741;v&#8741;=6 per Cauchy&ndash;Schwarz","c":true},{"x":"S&igrave;: non c&rsquo;&egrave; alcun limite superiore per &#9001;u,v&#9002;"},{"x":"No: il prodotto scalare &egrave; sempre positivo"},{"x":"S&igrave;, purch&eacute; u e v siano paralleli"}],"hint":"Per la disuguaglianza di Cauchy&ndash;Schwarz |&#9001;u,v&#9002;| non pu&ograve; superare &#8741;u&#8741;&#8741;v&#8741;=2&middot;3=6.","sol":"<b>No.</b> Per la disuguaglianza di Cauchy&ndash;Schwarz |&#9001;u,v&#9002;|&le;&#8741;u&#8741;&#8741;v&#8741;=6, quindi &#9001;u,v&#9002;=7 &egrave; impossibile. Il massimo 6 si raggiungerebbe solo con u,v paralleli concordi. Il prodotto scalare NON &egrave; sempre positivo (opzione 3): &egrave; &#9001;u,u&#9002; ad esserlo, non &#9001;u,v&#9002;."}]},{"pool":"spettrale","src":"tipo 3 · lettura di Q<sup>T</sup>AQ=D (teorema spettrale)","steps":[{"t":"A &egrave; reale simmetrica e Q ortogonale soddisfa Q<sup>T</sup>AQ=D con D diagonale. Le colonne di Q sono...","opts":[{"x":"una base ortonormale di autovettori di A (con autovalori sulla diagonale di D)","c":true},{"x":"gli autovalori di A"},{"x":"una base qualunque di autovettori, non necessariamente ortonormale"},{"x":"le righe di A normalizzate"}],"hint":"Q ortogonale &hArr; le sue colonne sono ortonormali. Da AQ=QD, la k-esima colonna q<sub>k</sub> soddisfa Aq<sub>k</sub>=d<sub>kk</sub>q<sub>k</sub>: &egrave; autovettore.","sol":"<b>Base ortonormale di autovettori.</b> Q ortogonale significa Q<sup>T</sup>Q=I, cio&egrave; colonne ortonormali; riscrivendo Q<sup>T</sup>AQ=D come AQ=QD, colonna per colonna Aq<sub>k</sub>=d<sub>kk</sub>q<sub>k</sub>, quindi ogni colonna &egrave; autovettore con autovalore l&rsquo;elemento diagonale di D. &Egrave; esattamente la tesi costruttiva del teorema spettrale. Gli autovalori stanno in D, non in Q (opzione 2)."}]},{"pool":"sp "x":"Calcoli solo det&#8202;A: se det&#8202;A=0 il sistema ha infinite soluzioni, altrimenti nessuna"},{"x":"Riduci a scala la sola completa B e conti i pivot: quello &egrave; il numero di soluzioni"}],"hint":"La compatibilit&agrave; si decide sempre confrontando rk(A) e rk(B). Il determinante da solo (quando A &egrave; quadrata) individua i valori critici, ma poi ciascuno va discusso singolarmente: det=0 non dice se le soluzioni sono infinite o assenti.","sol":"<b>Prima procedura.</b> Impianto corretto per il teorema di Rouch&eacute;&ndash;Capelli: (1) calcola rk(A) al variare di t &mdash; se A &egrave; quadrata, det&#8202;A(t)=0 individua i valori critici; (2) per t generico (rango massimo) il sistema &egrave; di Cramer, soluzione unica; (3) per ciascun valore critico ricalcoli rk(A) e rk(B): se uguali, infinite soluzioni (dim n&minus;rk); se rk(B)&gt;rk(A), incompatibile. Sostituire un solo valore o guardare solo det&#8202;A salta casi."}]},{"pool":"sistemi","src":"MODUS OPERANDI · struttura affine e dimensione delle soluzioni","steps":[{"t":"<span class=\"lbl\">MODUS OPERANDI</span> Come stabilisci se le soluzioni di Ax=b formano uno spazio affine e di che dimensione?","opts":[{"x":"Verifichi la compatibilit&agrave; con Rouch&eacute;&ndash;Capelli; se compatibile e b&ne;0 sono un sottospazio affine di dimensione n&minus;rk(A) = (una soluzione particolare) + (nucleo di A)","c":true},{"x":"Sono sempre un sottospazio vettoriale di dimensione n&minus;rk(A)"},{"x":"La dimensione &egrave; m&minus;rk(A), con m = numero di equazioni"},{"x":"La dimensione &egrave; rk(A): tanti parametri quanti i pivot"}],"hint":"La dimensione dipende dal numero di INCOGNITE n (colonne), non dal numero di equazioni m. E un sistema non omogeneo (b&ne;0) NON contiene lo 0: &egrave; affine, non vettoriale.","sol":"<b>Prima procedura.</b> Per il teorema di struttura: se il sistema &egrave; compatibile, l&rsquo;insieme delle soluzioni &egrave; x&#8320; + ker(A), un sottospazio affine di dimensione n&minus;rk(A) (parametri liberi = incognite meno rango). &Egrave; vettoriale solo se b=0 (contiene l&rsquo;origine); se b&ne;0 &egrave; un traslato del nucleo. Usare m al posto di n, o chiamarlo vettoriale, sono gli errori tipici."}]},{"pool":"sistemi","src":"MODUS OPERANDI · scrivere la soluzione generale (particolare + nucleo)","steps":[{"t":"<span class=\"lbl\">MODUS OPERANDI</span> Un sistema Ax=b &egrave; compatibile con infinite soluzioni. Per scriverne la soluzione GENERALE, che fai?","opts":[{"x":"Trovi una soluzione particolare x&#8320; di Ax=b e una base del nucleo di A (soluzioni di Ax=0); la generale &egrave; x&#8320; + (combinazioni lineari della base del nucleo)","c":true},{"x":"Ti basta una base del nucleo di A: quella descrive gi&agrave; tutte le soluzioni"},{"x":"Trovi tutte le soluzioni particolari x&#8320;, x&#8321;, &hellip; e le sommi tra loro"},{"x":"Poni tutte le incognite uguali a un unico parametro t"}],"hint":"Manca sempre un pezzo se dimentichi x&#8320; (la traslazione) OPPURE il nucleo (la direzione). Il nucleo da solo ti d&agrave; le soluzioni dell&rsquo;omogeneo, non del sistema con b&ne;0.","sol":"<b>Prima procedura.</b> Teorema di struttura: soluzione generale = una soluzione particolare x&#8320; + soluzione generale dell&rsquo;omogeneo associato (una base del nucleo, con coefficienti liberi). Servono ENTRAMBI: x&#8320; colloca l&rsquo;affine nello spazio, il nucleo ne d&agrave; la giacitura. Sommare pi&ugrave; soluzioni particolari non ha senso (la loro differenza sta nel nucleo, la somma no)."}]},{"pool":"sistemi","src":"b03 · discussione completa 3&times;3 con due valori critici","steps":[{"t":"<span class=\"lbl\">L1</span> Sia A=<span class=\"matrix\"><div class=\"mrow\"><span class=\"mcell\">t</span><span class=\"mcell\">1</span><span class=\"mcell\">1</span></div><div class=\"mrow\"><span class=\"mcell\">1</span><span class=\"mcell\">t</span><span class=\"mcell\">1</span></div><div class=\"mrow\"><span class=\"mcell\">1</span><span class=\"mcell\">1</span><span class=\"mcell\">t</span></div></span>. Quali sono i valori critici di t (dove il sistema Ax=b non &egrave; di Cramer)?","opts":[{"x":"t=1 e t=&minus;2","c":true},{"x":"solo t=1"},{"x":"t=1 e t=&minus;1"},{"x":"t=0 e t=1"}],"hint":"det&#8202;A=t&sup3;&minus;3t+2. Fattorizza completamente: NON fermarti al fattore (t&minus;1), perch&eacute; resta un secondo fattore che d&agrave; un&rsquo;altra radice.","sol":"<b>t=1 (doppio) e t=&minus;2.</b> det&#8202;A=t&sup3;&minus;3t+2=(t&minus;1)&sup2;(t+2). Per t&ne;1,&minus;2 il sistema &egrave; di Cramer (soluzione unica). I due valori critici vanno discussi separatamente.","cont":"Continua &rarr; discuti il caso t=1"},{"t":"<span class=\"lbl\">L2</span> Per t=1 e b=(1,1,1), il sistema A&#8202;x=b &egrave;...","opts":[{"x":"compatibile con &infin;&sup2; soluzioni: rk(A)=rk(B)=1","c":true},{"x":"incompatibile: rk(A)=1 &lt; rk(B)=2"},{"x":"di Cramer, soluzione unica"},{"x":"compatibile con &infin;&sup1; soluzioni"}],"hint":"Per t=1 tutte le righe di A diventano (1,1,1): rk(A)=1. Il termine noto (1,1,1) &egrave; coerente con questa unica riga? Confronta rk(A) e rk(B).","sol":"<b>Compatibile, &infin;&sup2; soluzioni.</b> Per t=1 le tre righe coincidono con (1,1,1) e i termini noti sono tutti 1: la completa ha righe (1,1,1|1) ripetute, rk(B)=1=rk(A). Per Rouch&eacute;&ndash;Capelli compatibile; dim = n&minus;rk = 3&minus;1 = 2 (un piano affine).","cont":"Continua &rarr; ora il caso t=&minus;2"},{"t":"<span class=\"lbl\">L3</span> Per t=&minus;2 e b=(1,1,1), lo stesso sistema &egrave;...","opts":[{"x":"incompatibile: rk(A)=2 ma rk(B)=3","c":true},{"x":"compatibile con &infin;&sup1; soluzioni: rk(A)=rk(B)=2"},{"x":"di Cramer"},{"x":"compatibile con &infin;&sup2; soluzioni"}],"hint":"Per t=&minus;2 le COLONNE di A sommano a zero, quindi (1,1,1)&middot;(ogni colonna)=0: il vettore (1,1,1) sta nel nucleo sinistro di A. Perch&eacute; b sia nello spazio colonne serve (1,1,1)&middot;b=0. Vale per b=(1,1,1)?","sol":"<b>Incompatibile.</b> Per t=&minus;2, det&#8202;A=0 con rk(A)=2 (un minore 2&times;2 &egrave; non nullo). Le colonne di A sommano a 0, cio&egrave; (1,1,1) &egrave; ortogonale allo spazio colonne; ma (1,1,1)&middot;b=3&ne;0, quindi b non vi appartiene: rk(B)=3&gt;2=rk(A). Per Rouch&eacute;&ndash;Capelli nessuna soluzione. Stesso det=0 di t=1, esito opposto: ecco perch&eacute; ogni valore critico va discusso a s&eacute;."}]},{"pool":"sistemi","src":"tipo 4 · omogeneo vs non omogeneo, stesso A (confronto struttura)","steps":[{"t":"Sia A di rango 2 in 3 incognite. Confronta l&rsquo;omogeneo Ax=0 col non omogeneo Ax=b (compatibile, b&ne;0): come sono i due insiemi di soluzioni?","opts":[{"x":"Entrambi di dimensione 1; l&rsquo;omogeneo &egrave; una retta per l&rsquo;origine (sottospazio vettoriale), il non omogeneo una retta affine traslata (non contiene 0)","c":true},{"x":"L&rsquo;omogeneo ha dimensione 1, il non omogeneo dimensione 2"},{"x":"Sono lo stesso identico insieme"},{"x":"L&rsquo;omogeneo &egrave; solo {0}, il non omogeneo una retta"}],"hint":"La dimensione dipende solo da n&minus;rk(A), UGUALE per i due sistemi (stessa A): 3&minus;2=1 in entrambi. Cambia solo la posizione: l&rsquo;omogeneo passa per 0, il non omogeneo no.","sol":"<b>Stessa dimensione 1, posizione diversa.</b> Per il teorema del rango dim = n&minus;rk = 1 per entrambi. Per il teorema di struttura le soluzioni di Ax=b sono x&#8320;+ker(A): stesso nucleo (la retta dell&rsquo;omogeneo) traslato di x&#8320;. L&rsquo;omogeneo &egrave; vettoriale (contiene 0), il non omogeneo affine (b&ne;0 &rArr; 0 non &egrave; soluzione)."}]},{"pool":"sistemi","src":"b03 soluzioniesame20200713 · scrivere la soluzione generale","steps":[{"t":"L&rsquo;insieme delle soluzioni del sistema { x+y+z=6 ; x&minus;y+z=2 } &egrave;:","opts":[{"x":"(4,2,0) + Span((&minus;1,0,1))","c":true},{"x":"Span((&minus;1,0,1))"},{"x":"(4,2,0) + Span((1,1,1))"},{"x":"il solo punto (4,2,0)"}],"hint":"Sottraendo le due equazioni: 2y=4 &rArr; y=2. Resta x+z=4 con z libero. Scrivi (x,y,z) come soluzione particolare + parametro&middot;(direzione del nucleo). NON dimenticare x&#8320;.","sol":"<b>(4,2,0)+Span((&minus;1,0,1)).</b> Da x&minus;y+z=2 e x+y+z=6 segue y=2; posto z=t: x=4&minus;t, quindi (x,y,z)=(4&minus;t,2,t)=(4,2,0)+t(&minus;1,0,1). Per il teorema di struttura: soluzione particolare (4,2,0) + nucleo Span((&minus;1,0,1)). Retta affine di dimensione n&minus;rk=3&minus;2=1."}]},{"pool":"sistemi","src":"b02 · sistema sovradeterminato incompatibile (trabocchetto rk A vs rk B)","steps":[{"t":"Il sistema { x+y=1 ; x&minus;y=3 ; 2x+y=1 } (3 equazioni, 2 incognite) &egrave; compatibile?","opts":[{"x":"No, incompatibile: rk(A)=2 ma rk(B)=3","c":true},{"x":"S&igrave;, soluzione unica x=2, y=&minus;1"},{"x":"S&igrave;, infinite soluzioni"},{"x":"S&igrave;, perch&eacute; ci sono pi&ugrave; equazioni che incognite"}],"hint":"Le prime due danno x=2, y=&minus;1. Ma DEVI verificare la terza: 2&middot;2+(&minus;1)=3&ne;1. Se una soluzione candidata non soddisfa TUTTE le equazioni, rk(B) supera rk(A).","sol":"<b>Incompatibile.</b> Le prime due equazioni danno x=2, y=&minus;1, che per&ograve; viola la terza (2x+y=3&ne;1). Per Rouch&eacute;&ndash;Capelli: A ha 2 colonne, rk(A)=2; la completa B ha rk=3&gt;2, quindi nessuna soluzione. L&rsquo;errore &egrave; fermarsi alle prime due equazioni e non confrontare rk(A) con rk(B) su TUTTO il sistema."}]},{"pool":"sistemi","src":"tipo 4 · parametro sul termine noto con riga dipendente","steps":[{"t":"Data A=<span class=\"matrix\"><div class=\"mrow\"><span class=\"mcell\">1</span><span class=\"mcell\">0</span><span class=\"mcell\">1</span></div><div class=\"mrow\"><span class=\"mcell\">0</span><span class=\"mcell\">1</span><span class=\"mcell\">1</span></div><div class=\"mrow\"><span class=\"mcell\">1</span><span class=\"mcell\">1</span><span class=\"mcell\">2</span></div></span> e b=(1,2,h), per quali h il sistema &egrave; compatibile?","opts":[{"x":"Solo h=3, con &infin;&sup1; soluzioni","c":true},{"x":"Per ogni h, soluzione unica"},{"x":"Solo h=3, con soluzione unica"},{"x":"Per ogni h&ne;3"}],"hint":"La terza riga di A &egrave; la somma delle prime due: rk(A)=2. Per compatibilit&agrave; il termine noto deve rispettare la STESSA relazione: h = (primo)+(secondo).","sol":"<b>Solo h=3.</b> R&#8323;=R&#8321;+R&#8322; in A &rArr; rk(A)=2. Per Rouch&eacute;&ndash;Capelli serve che la completa mantenga rk=2, cio&egrave; h=1+2=3 (altrimenti rk(B)=3&gt;2, incompatibile). Con h=3 le soluzioni sono &infin;&sup1; (dim = 3&minus;2 = 1), non uniche: rk(A)=2&lt;3."}]},{"pool":"sistemi","src":"tipo 4 · regola di Cramer, forma della soluzione","steps":[{"t":"Per un sistema di Cramer Ax=b (A quadrata n&times;n, det&#8202;A&ne;0), la regola di Cramer d&agrave; la i-esima incognita come:","opts":[{"x":"x&#8305; = det(A&#8305;)/det(A), dove A&#8305; &egrave; A con la i-esima colonna sostituita da b","c":true},{"x":"x&#8305; = det(A)/det(A&#8305;)"},{"x":"x&#8305; = det(A&#8305;), senza dividere"},{"x":"x&#8305; = b&#8305;/det(A), con b&#8305; la i-esima componente di b"}],"hint":"Si sostituisce la COLONNA i-esima di A col vettore b, si prende il determinante e si divide per det&#8202;A (non il contrario, e non senza dividere).","sol":"<b>x&#8305;=det(A&#8305;)/det(A).</b> Per il teorema di Cramer, valido solo se det&#8202;A&ne;0: A&#8305; &egrave; la matrice ottenuta rimpiazzando la i-esima colonna di A col termine noto b. La divisione per det&#8202;A &egrave; essenziale &mdash; se det&#8202;A=0 la regola non si applica e serve Rouch&eacute;&ndash;Capelli."}]},{"pool":"sistemi","src":"tipo 4 · omogeneo quadrato singolare (trabocchetto dim = rk)","steps":[{"t":"Un sistema omogeneo Ax=0 con A quadrata 3&times;3 e rk(A)=2 ha spazio delle soluzioni di dimensione...","opts":[{"x":"1","c":true},{"x":"2"},{"x":"0"},{"x":"3"}],"hint":"dim delle soluzioni = n&minus;rk(A) = 3&minus;2, NON rk(A). Confondere la dimensione col rango &egrave; l&rsquo; ass=\"mrow\"><span class=\"mcell\">1</span><span class=\"mcell\">0</span><span class=\"mcell\">0</span><span class=\"mcell\">1</span></div></span>"},{"x":"<span class=\"matrix\"><div class=\"mrow\"><span class=\"mcell\">3</span><span class=\"mcell\">0</span><span class=\"mcell\">0</span><span class=\"mcell\">0</span></div><div class=\"mrow\"><span class=\"mcell\">0</span><span class=\"mcell\">1</span><span class=\"mcell\">0</span><span class=\"mcell\">0</span></div><div class=\"mrow\"><span class=\"mcell\">0</span><span class=\"mcell\">0</span><span class=\"mcell\">1</span><span class=\"mcell\">0</span></div><div class=\"mrow\"><span class=\"mcell\">0</span><span class=\"mcell\">0</span><span class=\"mcell\">0</span><span class=\"mcell\">1</span></div></span>"}],"hint":"Diagonale: coefficienti di x&#8321;&sup2;,x&#8322;&sup2;,x&#8323;&sup2;,x&#8324;&sup2; = 3,1,1,<b>0</b> (il termine x&#8324;&sup2; non compare). Il termine 2x&#8321;x&#8324; d&agrave; a&#8321;&#8324;=a&#8324;&#8321;=1.","sol":"A=<span class=\"matrix\"><div class=\"mrow\"><span class=\"mcell\">3</span><span class=\"mcell\">0</span><span class=\"mcell\">0</span><span class=\"mcell\">1</span></div><div class=\"mrow\"><span class=\"mcell\">0</span><span class=\"mcell\">1</span><span class=\"mcell\">0</span><span class=\"mcell\">0</span></div><div class=\"mrow\"><span class=\"mcell\">0</span><span class=\"mcell\">0</span><span class=\"mcell\">1</span><span class=\"mcell\">0</span></div><div class=\"mrow\"><span class=\"mcell\">1</span><span class=\"mcell\">0</span><span class=\"mcell\">0</span><span class=\"mcell\">0</span></div></span>. Manca x&#8324;&sup2; &rArr; a&#8324;&#8324;=0; il misto 2x&#8321;x&#8324; d&agrave; a&#8321;&#8324;=a&#8324;&#8321;=1 (met&agrave; del coefficiente).","cont":"Continua &rarr; definita positiva? vettore isotropo?"},{"t":"<span class=\"lbl\">L2</span> La stessa g &egrave; definita positiva? E c&rsquo;&egrave; un vettore isotropo evidente?","opts":[{"x":"No: manca x&#8324;&sup2;, e (0,0,0,1) d&agrave; g=0","c":true},{"x":"S&igrave;: i coefficienti dei quadrati presenti sono positivi"},{"x":"No, ma non esistono vettori isotropi"},{"x":"S&igrave;, dopo aver completato i quadrati"}],"hint":"Def. positiva richiede g(x,x)&gt;0 per OGNI x&ne;0. Prova x=e&#8324;=(0,0,0,1): quanto vale g(e&#8324;,e&#8324;)=a&#8324;&#8324;?","sol":"No. g(e&#8324;,e&#8324;)=a&#8324;&#8324;=0 con e&#8324;=(0,0,0,1)&ne;0: subito un vettore isotropo, senza calcoli pesanti &rArr; g non &egrave; definita positiva. Il blocco <span class=\"matrix\"><div class=\"mrow\"><span class=\"mcell\">3</span><span class=\"mcell\">1</span></div><div class=\"mrow\"><span class=\"mcell\">1</span><span class=\"mcell\">0</span></div></span> su x&#8321;,x&#8324; ha det=&minus;1 &rArr; contributo (1,1); con x&#8322;&sup2;,x&#8323;&sup2; la segnatura totale &egrave; (3,1,0). Fonte: soluzioniesame20200204 Es. 5."}]},{"pool":"forme","src":"tipo 8 · isotropo &ne; radicale (trabocchetto a)","steps":[{"t":"Per q=x&#8321;&sup2;&minus;x&#8322;&sup2; (non degenere) il vettore (1,1) &egrave; isotropo. Appartiene al nucleo (radicale) della forma, cio&egrave; g((1,1),y)=0 per ogni y?","opts":[{"x":"No: isotropo (g(x,x)=0) &ne; nel radicale (g(x,&middot;)&equiv;0)","c":true},{"x":"S&igrave;: g(x,x)=0 implica x nel radicale"},{"x":"S&igrave;, perch&eacute; la forma &egrave; indefinita"},{"x":"No, perch&eacute; (1,1) non &egrave; isotropo"}],"hint":"Calcola g((1,1),y)=x&#8321;y&#8321;&minus;x&#8322;y&#8322; con x=(1,1): ottieni y&#8321;&minus;y&#8322;. Si annulla per OGNI y?","sol":"No. g((1,1),y)=y&#8321;&minus;y&#8322;, non identicamente nullo (y=(1,0) d&agrave; 1). Quindi (1,1) &egrave; isotropo ma NON sta nel radicale. Isotropo = g(x,x)=0; radicale = g(x,y)=0 &forall;y. Ogni vettore del radicale &egrave; isotropo, non viceversa: per g non degenere il radicale &egrave; {0} mentre gli isotropi sono infiniti."}]},{"pool":"forme","src":"tipo 8 · radicale = ker della matrice","steps":[{"t":"La forma q=(x&#8321;+x&#8322;)&sup2; ha matrice <span class=\"matrix\"><div class=\"mrow\"><span class=\"mcell\">1</span><span class=\"mcell\">1</span></div><div class=\"mrow\"><span class=\"mcell\">1</span><span class=\"mcell\">1</span></div></span>. Qual &egrave; il radicale (nucleo della forma) e la sua dimensione?","opts":[{"x":"Span((1,&minus;1)), dimensione 1","c":true},{"x":"{0}, dimensione 0"},{"x":"tutto &#8477;&sup2;, dimensione 2"},{"x":"Span((1,1)), dimensione 1"}],"hint":"Il radicale &egrave; ker della matrice A: risolvi A&#8202;x=0. La dimensione &egrave; n&minus;rk(A)=2&minus;1.","sol":"Per la definizione di radicale (= ker della matrice della forma, dim = n &minus; rk): rk(A)=1 &rArr; dim radicale =2&minus;1=1. A(x&#8321;,x&#8322;)<sup>T</sup>=0 d&agrave; x&#8321;+x&#8322;=0, cio&egrave; Span((1,&minus;1)). Il radicale coincide con la parte r della segnatura, qui (1,0,1)."}]},{"pool":"forme","src":"tipo 8 · ordine dei passi in una forma parametrica (trabocchetto b)","steps":[{"t":"Devi determinare la segnatura (p,q,r) di una forma parametrica g<sub>&alpha;</sub>. Qual &egrave; l&rsquo;ordine corretto dei passi?","opts":[{"x":"Prima il rango (r=n&minus;rk) ai valori critici di &alpha;, poi p e q","c":true},{"x":"Prima p e q via minori, il rango non serve"},{"x":"Prima gli autovettori, poi il segno dei quadrati"},{"x":"L&rsquo;ordine &egrave; indifferente"}],"hint":"r (dimensione del radicale) dipende da rk(A<sub>&alpha;</sub>): ai valori di &alpha; che annullano det&#8202;A il rango cala e la segnatura cambia struttura. Individuali PRIMA.","sol":"Prima il rango. I valori critici (det&#8202;A<sub>&alpha;</sub>=0) fanno cadere il rango e vanno trattati a parte: per ciascuno r=n&minus;rk cambia e p+q=rk. Calcolare p,q ignorando dove il rango scende produce segnature sbagliate proprio nei casi d&rsquo;esame."}]},{"pool":"forme","src":"tipo 8 · segnatura parametrica (diagonale)","steps":[{"t":"Per quali &alpha;&isin;&#8477; la forma con matrice <span class=\"matrix\"><div class=\"mrow\"><span class=\"mcell\">1</span><span class=\"mcell\">0</span><span class=\"mcell\">0</span></div><div class=\"mrow\"><span class=\"mcell\">0</span><span class=\"mcell\">1</span><span class=\"mcell\">0</span></div><div class=\"mrow\"><span class=\"mcell\">0</span><span class=\"mcell\">0</span><span class=\"mcell\">&alpha;</span></div></span> &egrave; definita positiva? E qual &egrave; la segnatura per &alpha;&lt;0?","opts":[{"x":"&alpha;&gt;0 def. positiva; per &alpha;&lt;0 segnatura (2,1,0)","c":true},{"x":"&alpha;&ge;0 def. positiva; per &alpha;&lt;0 segnatura (2,0,1)"},{"x":"&alpha;&gt;0 def. positiva; per &alpha;&lt;0 segnatura (1,2,0)"},{"x":"def. positiva per ogni &alpha;"}],"hint":"Matrice gi&agrave; diagonale: la segnatura &egrave; data dai segni degli elementi diagonali. Def. positiva &hArr; tutti &gt;0. &alpha;=0 d&agrave; un autovalore nullo (degenere).","sol":"Per il teorema spettrale la segnatura si legge dai segni degli autovalori 1,1,&alpha;. Def. positiva &hArr; &alpha;&gt;0. Con &alpha;=0 la forma &egrave; degenere, segnatura (2,0,1). Per &alpha;&lt;0: due segni + e uno &minus;, segnatura (2,1,0)."}]},{"pool":"forme","src":"geomefis24.1.22 · segnatura parametrica (misto)","steps":[{"t":"<span class=\"lbl\">L1</span> Sia A<sub>&alpha;</sub>=<span class=\"matrix\"><div class=\"mrow\"><span class=\"mcell\">1</span><span class=\"mcell\">&alpha;</span></div><div class=\"mrow\"><span class=\"mcell\">&alpha;</span><span class=\"mcell\">1</span></div></span>. Per quali &alpha; la forma &egrave; degenere (rk&lt;2)?","opts":[{"x":"&alpha;=&plusmn;1","c":true},{"x":"solo &alpha;=1"},{"x":"&alpha;=0"},{"x":"nessun &alpha;"}],"hint":"Degenere &hArr; det&#8202;A<sub>&alpha;</sub>=0. Calcola det=1&minus;&alpha;&sup2;.","sol":"det&#8202;A<sub>&alpha;</sub>=1&minus;&alpha;&sup2;=0 &hArr; &alpha;=&plusmn;1: sono i valori critici dove rk cala a 1 (r=1).","cont":"Continua &rarr; segnatura nei tre regimi"},{"t":"<span class=\"lbl\">L2</span> Segnatura di A<sub>&alpha;</sub> nei tre regimi |&alpha;|&lt;1, &alpha;=&plusmn;1, |&alpha;|&gt;1?","opts":[{"x":"|&alpha;|&lt;1: (2,0,0); &alpha;=&plusmn;1: (1,0,1); |&alpha;|&gt;1: (1,1,0)","c":true},{"x":"|&alpha;|&lt;1: (2,0,0); &alpha;=&plusmn;1: (2,0,0); |&alpha;|&gt;1: (0,2,0)"},{"x":"sempre (2,0,0)"},{"x":"|&alpha;|&lt;1: (1,1,0); &alpha;=&plusmn;1: (1,0,1); |&alpha;|&gt;1: (2,0,0)"}],"hint":"Minori di testa: D&#8321;=1&gt;0 sempre; D&#8322;=1&minus;&alpha;&sup2;. D&#8322;&gt;0 def. pos; D&#8322;=0 degenere (rk 1, r=1); D&#8322;&lt;0 indefinita. Oppure autovalori 1&plusmn;&alpha;.","sol":"Per il teorema spettrale (segni degli autovalori) o il criterio di Sylvester: autovalori 1+&alpha; e 1&minus;&alpha;. |&alpha;|&lt;1: entrambi &gt;0 &rArr; (2,0,0) def. positiva. &alpha;=&plusmn;1: uno si annulla &rArr; (1,0,1). |&alpha;|&gt;1: segni opposti &rArr; (1,1,0) indefinita. Aver trovato prima i valori critici &plusmn;1 rende immediata la discussione."}]},{"pool":"forme","src":"tipo 8 · indice di Witt (forma indefinita)","steps":[{"t":"Una forma non degenere su &#8477;&sup3; ha segnatura (2,1). Qual &egrave; il suo indice di Witt, cio&egrave; la dimensione del massimo sottospazio totalmente isotropo?","opts":[{"x":"1","c":true},{"x":"2"},{"x":"3"},{"x":"0"}],"hint":"Per una forma non degenere di segnatura (p,q), l&rsquo;indice di Witt &egrave; min(p,q).","sol":"1 = min(2,1). Il massimo sottospazio su cui g &egrave; identicamente nulla ha dimensione min(p,q): con segnatura (2,1) esiste una retta totalmente isotropa, ma non un piano."}]},{"pool":"forme","src":"tipo 8 · indice di Witt (definita positiva)","steps":[{"t":"Una forma definita positiva su &#8477;&#8319; (segnatura (n,0)) ha indice di Witt pari a:","opts":[{"x":"0: l&rsquo;unico vettore isotropo &egrave; 0","c":true},{"x":"n"},{"x":"1"},{"x":"n&minus;1"}],"hint":"min(p,q)=min(n,0)=0. Def. positiva &rArr; g(x,x)&gt;0 per x&ne;0: nessun isotropo non nullo.","sol":"0. min(n,0)=0: non esistono vettori isotropi non nulli, quindi nessun sottospazio totalmente isotropo di dimensione &ge;1. Presenza di isotropi non banali &hArr; forma indefinita o degenere."}]},{"pool":"forme","src":"tipo 8 · invariante di congruenza vs similitudine","steps":[{"t":"Sotto congruenza A &#8614; P<sup>T</sup>AP (P invertibile), quale grandezza si conserva SEMPRE, a differenza di quanto accade con la similitudine P<sup>&minus;1</sup>AP?","opts":[{"x":"La segnatura (p,q,r)","c":true},{"x":"Gli autovalori"},{"x":"Il determinante"},{"x":"La traccia"}],"hint":"Teorema di inerzia di Sylvester: due matrici simmetriche congruenti hanno la stessa segnatura. Gli autovalori invece cambiano, perch&eacute; P<sup>T</sup>AP&ne;P<sup>&minus;1</sup>AP in generale.","sol":"La segnatura, per la legge di inerzia di Sylvester. La congruenza P<sup>T</sup>AP &egrave; un cambio di base per la FORMA: conserva p,q,r ma non gli autovalori (n&eacute; det, che diventa (det&#8202;P)&sup2;&middot;det&#8202;A, di cui resta invariato solo il segno). La similitudine P<sup>&minus;1</sup>AP conserva gli autovalori. Le due operazioni coincidono solo se P &egrave; ortogonale."}]},{"pool":"forme","src":"tipo 8 · congruenti ma non simili (trabocchetto Sylvester)","steps":[{"t":"Le matrici diag(1,1,&minus;1) e diag(2,3,&minus;5) sono congruenti? E simili?","opts":[{"x":"Congruenti (stessa segnatura (2,1)), ma NON simili (autovalori diversi)","c":true},{"x":"Simili e congruenti"},{"x":"Simili ma non congruenti"},{"x":"N&eacute; simili n&eacute; congruenti"}],"hint":"Congruenza &hArr; stessa segnatura (Sylvester); similitudine &hArr; stessi autovalori. Verifica i due criteri separatamente.","sol":"Per la legge di inerzia di Sylvester (due simmetriche sono congruenti &hArr; stessa segnatura): entrambe hanno segnatura (2,1,0) &rArr; congruenti, esiste P con P<sup>T</sup>&#8202;diag(1,1,&minus;1)&#8202;P=diag(2,3,&minus;5). Ma gli autovalori {1,1,&minus;1} e {2,3,&minus;5} sono diversi &rArr; NON simili. Congruente non implica simile."}]},{"pool":"forme","src":"tipo 8 · segnatura dagli autovalori (matrice simmetrica)","steps":[{"t":"Una matrice simmetrica reale ha autovalori 3, 0, &minus;2. Qual &egrave; la segnatura della forma associata?","opts":[{"x":"(1,1,1)","c":true},{"x":"(2,1,0)"},{"x":"(1,2,0)"},{"x":"(3,0,0)"}],"hint":"Per una simmetrica reale la segnatura si legge dai segni degli autovalori: p = n. positivi, q = n. negativi, r = n. nulli.","sol":"Autovalori 3(&gt;0), 0, &minus;2(&lt;0) &rArr; p=1, q=1, r=1: segnatura (1,1,1). Degenere (un autovalore nullo) e indefinita. Il teorema spettrale garantisce che i segni degli autovalori sono un invariante di congruenza."}]},{"pool":"forme","src":"tipo 8 · forma senza quadrati puri (trabocchetto)","steps":[{"t":"La forma q=2x&#8321;x&#8322; su &#8477;&sup2; (nessun quadrato puro) &egrave; degenere? Qual &egrave; la sua segnatura?","opts":[{"x":"Non degenere, segnatura (1,1,0)","c":true},{"x":"Degenere, segnatura (0,0,2)"},{"x":"Definita positiva, (2,0,0)"},{"x":"Degenere, (1,0,1)"}],"hint":"Matrice <span class=\"matrix\"><div class=\"mrow\"><span class=\"mcell\">0</span><span class=\"mcell\">1</span></div><div class=\"mrow\"><span class=\"mcell\">1</span><span class=\"mcell\">0</span></div></span>, det=&minus;1&ne;0 &rArr; non degenere. Sostituisci x&#8321;=u+v, x&#8322;=u&minus;v: 2x&#8321;x&#8322;=2(u&sup2;&minus;v&sup2;).","sol":"Per il criterio del determinante (non degenere &hArr; det della matrice &ne;0): A=<span class=\"matrix\"><div class=\"mrow\"><span class=\"mcell\">0</span><span class=\"mcell\">1</span></div><div class=\"mrow\"><span class=\"mcell\">1</span><span class=\"mcell\">0</span></div></span> ha det=&minus;1&ne;0. Con la sostituzione x&#8321;=u+v, x&#8322;=u&minus;v (metodo di Lagrange) si ottiene q=2(u&sup2;&minus;v&sup2;): segnatura (1,1,0). L&rsquo;assenza di quadrati puri NON significa forma nulla n&eacute; degenere."}]},{"pool":"forme","src":"Prova 8_2_23sol Es. 3 · segnatura per restrizione","steps":[{"t":"Una forma b su &#8477;&#8308; &egrave; definita positiva su Span(e&#8321;,e&#8322;) e definita negativa su Span(e&#8323;,e&#8324;). Cosa si conclude su rango e segnatura, senza altri conti?","opts":[{"x":"n&#8330;&ge;2 e n&#8331;&ge;2, quindi rango 4 e segnatura (2,2)","c":true},{"x":"segnatura (4,0)"},{"x":"segnatura (2,2) ma rango 2"},{"x":"nulla, servono gli autovalori"}],"hint":"Se b &egrave; def. positiva su un sottospazio di dim 2, allora n&#8330;&ge;2; analogamente def. negativa &rArr; n&#8331;&ge;2. In &#8477;&#8308; vale n&#8330;+n&#8331;+n&#8320;&le;4.","sol":"<b>Rango 4, segnatura (2,2).</b> La restrizione def. positiva su un piano forza n&#8330;&ge;2; quella def. negativa forza n&#8331;&ge;2. Ma n&#8330;+n&#8331;&le;4, quindi n&#8330;=n&#8331;=2 e n&#8320;=0. L&rsquo;argomento di restrizione evita di diagonalizzare."}]},{"pool":"forme","src":"geomefis24.1.22 Es. 4 · segnatura parametrica (misto)","steps":[{"t":"<span class=\"lbl\">L1</span> Sia q(x)=&alpha;x&#8321;&sup2;+x&#8322;&sup2;+x&#8323;&sup2;+2x&#8321;x&#8322;&minus;4x&#8321;x&#8323;, matrice A&#8341;=<span class=\"matrix\"><div class=\"mrow\"><span class=\"mcell\">&alpha;</span><span class=\"mcell\">1</span><span class=\"mcell\">&minus;2</span></div><div class=\"mrow\"><span class=\"mcell\">1</span><span class=\"mcell\">1</span><span class=\"mcell\">0</span></div><div class=\"mrow\"><span class=\"mcell\">&minus;2</span><span class=\"mcell\">0</span><span class=\"mcell\">1</span></div></span>. Per quale &alpha; la forma &egrave; degenere?","opts":[{"x":"&alpha;=5","c":true},{"x":"&alpha;=0"},{"x":"&alpha;=1"},{"x":"nessun &alpha;"}],"hint":"Degenere &hArr; det&#8202;A&#8341;=0. Sviluppa il determinante lungo la prima riga.","sol":"det&#8202;A&#8341;=&alpha;(1&middot;1)&minus;1(1&middot;1)&minus;2(&minus;(&minus;2))=&alpha;&minus;1&minus;4=&alpha;&minus;5. Si annulla per &alpha;=5: unico valore critico (r=1).","cont":"Continua &rarr; segnatura per &alpha;&gt;5 e &alpha;&lt;5"},{"t":"<span class=\"lbl\">L2</span> Segnatura "x":"n=B&minus;A"},{"x":"n=(B&minus;A)+(C&minus;A)"}],"hint":"Due vettori giacenti nel piano sono B&minus;A e C&minus;A; il normale &egrave; ortogonale a entrambi.","sol":"n=(B&minus;A)&times;(C&minus;A): il prodotto vettoriale di due lati &egrave; ortogonale al piano. L&rsquo;equazione &egrave; n&middot;(X&minus;A)=0. La somma (B&minus;A)+(C&minus;A) giace NEL piano, non &egrave; normale."}]},{"pool":"e3","src":"tipo 7 · direttore da retta come intersezione di piani","steps":[{"t":"La retta &egrave; l&rsquo;intersezione dei piani &pi;&#8321;: x+y+z=0 e &pi;&#8322;: x&minus;y=0. Un suo direttore &egrave;:","opts":[{"x":"(1,1,&minus;2)","c":true},{"x":"(1,1,1)"},{"x":"(1,&minus;1,0)"},{"x":"(2,0,1)"}],"hint":"La retta giace in entrambi i piani &rArr; il direttore &egrave; ortogonale a ENTRAMBE le normali: v=n&#8321;&times;n&#8322;.","sol":"v=n&#8321;&times;n&#8322;=(1,1,1)&times;(1,&minus;1,0)=(1,1,&minus;2). &Egrave; ortogonale sia a n&#8321;=(1,1,1) sia a n&#8322;=(1,&minus;1,0), quindi parallelo alla retta."}]},{"pool":"e3","src":"Compito 02_02_2016 Es. 4 · distanza punto-retta","steps":[{"t":"La distanza del punto P dalla retta r (punto Q, direttore v) &egrave; data da:","opts":[{"x":"&#8741;(P&minus;Q)&times;v&#8741; / &#8741;v&#8741;","c":true},{"x":"&#8741;P&minus;Q&#8741;"},{"x":"|(P&minus;Q)&middot;v| / &#8741;v&#8741;"},{"x":"&#8741;(P&minus;Q)&times;v&#8741;"}],"hint":"&Egrave; l&rsquo;altezza del parallelogramma di lati (P&minus;Q) e v: area diviso base. L&rsquo;area &egrave; la norma del prodotto vettoriale.","sol":"<b>&#8741;(P&minus;Q)&times;v&#8741; / &#8741;v&#8741;.</b> Numeratore = area del parallelogramma su (P&minus;Q) e v; dividendo per la base &#8741;v&#8741; si ottiene l&rsquo;altezza = distanza. La formula col prodotto SCALARE d&agrave; invece la proiezione lungo r, non la distanza."}]},{"pool":"e3","src":"25sett_soluz Es. 3 · quattro punti e area","steps":[{"t":"Dati A,B,C,D&isin;&#8477;&#179;, come si verifica che sono complanari e come si 322;&rarr;R&#8323;&rarr;R&#8321;. Se det=6, il nuovo determinante vale:","opts":[{"x":"6","c":true},{"x":"&minus;6"},{"x":"18"},{"x":"2"}],"hint":"Il ciclo (1&#8202;2&#8202;3) si scrive come due trasposizioni: permutazione PARI, segno (&minus;1)&sup2;=+1.","sol":"<b>6.</b> Una permutazione ciclica di 3 righe &egrave; pari (due scambi), quindi il determinante resta invariato. Cambierebbe segno solo con un numero DISPARI di scambi."}]}],"strutture":[{"pool":"strutture","src":"b03 secondoesosol Q6 · endomorfismo prodotto vettoriale","steps":[{"t":"Fissato x&#8320;&ne;0 in &#8477;&sup3;, sia T(x)=x&times;x&#8320; (prodotto vettoriale). Cosa sono ker&#8202;T e im&#8202;T?","opts":[{"x":"ker&#8202;T=Span(x&#8320;), im&#8202;T=piano ortogonale a x&#8320;","c":true},{"x":"ker&#8202;T={0}, im&#8202;T=&#8477;&sup3;"},{"x":"ker&#8202;T=piano ortogonale, im&#8202;T=Span(x&#8320;)"},{"x":"T &egrave; iniettivo"}],"hint":"x&times;x&#8320;=0 &hArr; x parallelo a x&#8320;. Il prodotto vettoriale &egrave; sempre ortogonale a x&#8320;.","sol":"<b>ker&#8202;T=Span(x&#8320;), im&#8202;T=(x&#8320;)<sup>&#8869;</sup> (dim 2).</b> x&times;x&#8320;=0 &hArr; x&#8741;x&#8320; (annullamento del prodotto vettoriale), e ogni x&times;x&#8320; &egrave; ortogonale a x&#8320;. Il teorema del rango chiude: dim&#8202;ker+dim&#8202;im=1+2=3. T non &egrave; n&eacute; iniettivo n&eacute; suriettivo."}]},{"pool":"strutture","src":"tipo 12 · prodotto vettoriale non associativo","steps":[{"t":"Il prodotto vettoriale in &#8477;&sup3; &egrave; associativo, cio&egrave; (u&times;v)&times;w = u&times;(v&times;w)?","opts":[{"x":"No: vale l&rsquo;identit&agrave; di Jacobi al posto dell&rsquo;associativit&agrave;","c":true},{"x":"S&igrave;, sempre"},{"x":"S&igrave;, ma solo per vettori ortogonali"},{"x":"S&igrave;, perch&eacute; &egrave; bilineare"}],"hint":"Prova u=v=e&#8321;, w=e&#8322;: (e&#8321;&times;e&#8321;)&times;e&#8322;=0, ma e&#8321;&times;(e&#8321;&times;e&#8322;)=e&#8321;&times;e&#8323;=&minus;e&#8322;&ne;0.","sol":"<b>No, non &egrave; associativo.</b> Controesempio: (e&#8321;&times;e&#8321;)&times;e&#8322;=0&times;e&#8322;=0, mentre e&#8321;&times;(e&#8321;&times;e&#8322;)=e&#8321;&times;e&#8323;=&minus;e&#8322;. Il prodotto vettoriale &egrave; bilineare e antisimmetrico ma NON associativo: al suo posto vale l&rsquo;identit&agrave; di Jacobi u&times;(v&times;w)+v&times;(w&times;u)+w&times;(u&times;v)=0, che fa di (&#8477;&sup3;,&times;) un&rsquo;algebra di Lie. Utile anche la formula BAC&minus;CAB: u&times;(v&times;w)=v(u&middot;w)&minus;w(u&middot;v)."}]},{"pool":"strutture","src":"ex_Fis6 Es. 5 · L&#8354; moltiplicazione per z (&#8450; come &#8477;-spazio)","steps":[{"t":"Sia z=a+ib e L&#8354;:&#8450;&rarr;&#8450;, L&#8354;(w)=z&middot;w. Vista &#8450; come &#8477;-spazio con base {1,i}, qual &egrave; la matrice di L&#8354;?","opts":[{"x":"<span class=\"matrix\"><div class=\"mrow\"><span class=\"mcell\">a</span><span class=\"mcell\">&minus;b</span></div><div class=\"mrow\"><span class=\"mcell\">b</span><span class=\"mcell\">a</span></div></span>","c":true},{"x":"<span class=\"matrix\"><div class=\"mrow\"><span class=\"mcell\">a</span><span class=\"mcell\">b</span></div><div class=\"mrow\"><span class=\"mcell\">b</span><span class=\"mcell\">a</span></div></span>"},{"x":"<span class=\"matrix\"><div class=\"mrow\"><span class=\"mcell\">a</span><span class=\"mcell\">0</span></div><div class=\"mrow\"><span class=\"mcell\">0</span><span class=\"mcell\">b</span></div></span>"},{"x":"<span class=\"matrix\"><div class=\"mrow\"><span class=\"mcell\">a</span><span class=\"mcell\">b</span></div><div class=\"mrow\"><span class=\"mcell\">&minus;b</span><span class=\"mcell\">a</span></div></span>"}],"hint":"Calcola L&#8354;(1)=z=a+bi e L&#8354;(i)=zi=&minus;b+ai. Le colonne sono le coordinate di queste immagini nella base {1,i}.","sol":"A=<span class=\"matrix\"><div class=\"mrow\"><span class=\"mcell\">a</span><span class=\"mcell\">&minus;b</span></div><div class=\"mrow\"><span class=\"mcell\">b</span><span class=\"mcell\">a</span></div></span>. L&#8354;(1)=a+bi &rarr; colonna (a,b); L&#8354;(i)=ai&minus;b &rarr; colonna (&minus;b,a). &Egrave; la rappresentazione reale della moltiplicazione complessa: rotazione-dilatazione di modulo |z| e angolo arg(z). La sottoalgebra { <span class=\"matrix\"><div class=\"mrow\"><span class=\"mcell\">a</span><span class=\"mcell\">&minus;b</span></div><div class=\"mrow\"><span class=\"mcell\">b</span><span class=\"mcell\">a</span></div></span> } di M&#8322;(&#8477;) &egrave; isomorfa al campo &#8450; come &#8477;-algebra, e per z=i la matrice J=<span class=\"matrix\"><div class=\"mrow\"><span class=\"mcell\">0</span><span class=\"mcell\">&minus;1</span></div><div class=\"mrow\"><span class=\"mcell\">1</span><span class=\"mcell\">0</span></div></span> soddisfa J&sup2;=&minus;I: &egrave; la struttura complessa su &#8477;&sup2;."}]},{"pool":"strutture","src":"tipo 12 · struttura complessa J&sup2;=&minus;Id","steps":[{"t":"Su &#8477;&sup2; sia J=<span class=\"matrix\"><div class=\"mrow\"><span class=\"mcell\">0</span><span class=\"mcell\">&minus;1</span></div><div class=\"mrow\"><span class=\"mcell\">1</span><span class=\"mcell\">0</span></div></span>. Quale ruolo gioca J nel rendere &#8477;&sup2; uno spazio su &#8450;?","opts":[{"x":"J&sup2;=&minus;I, quindi &laquo;i&middot;v&raquo;:=Jv definisce una struttura di &#8450;-spazio su &#8477;&sup2;","c":true},{"x":"J&sup2;=I, quindi J &egrave; una riflessione"},{"x":"J &egrave; diagonalizzabile su &#8477;"},{"x":"J non ha alcun legame con &#8450;"}],"hint":"Verifica J&sup2;. Perch&eacute; &laquo;moltiplicare per i&raquo; abbia senso su &#8477;&sup2; serve un operatore che al quadrato dia &minus;Id, imitando i&sup2;=&minus;1.","sol":"<b>J&sup2;=&minus;I.</b> Ponendo (a+ib)&middot;v:=av+bJv si dota &#8477;&sup2; di una struttura di spazio vettoriale complesso: la condizione J&sup2;=&minus;Id &egrave; esattamente ci&ograve; che serve perch&eacute; i&sup2;=&minus;1 sia rispettato. Gli autovalori di J sono &plusmn;i (non reali): J non &egrave; diagonalizzabile su &#8477;, ma lo &egrave; su &#8450;. Una &laquo;struttura complessa&raquo; su uno spazio reale &egrave; per definizione un endomorfismo J con J&sup2;=&minus;Id."}]},{"pool":"strutture","src":"27gen12consoluz Es. 6 · coniugio su M&#8322;(&#8450;) (semilineare)","steps":[{"t":"Su M&#8322;(&#8450;) sia T(A)=A&#773; (coniugio entrata per entrata). Rispetto a quale struttura T &egrave; lineare?","opts":[{"x":"Lineare come &#8477;-spazio, NON come &#8450;-spazio","c":true},{"x":"Lineare come &#8450;-spazio"},{"x":"Lineare in entrambi"},{"x":"Non lineare in nessuno dei due"}],"hint":"Verifica T(&lambda;A)=&lambda;&#773;&#8202;A&#773;. Per &lambda; reale &lambda;&#773;=&lambda;; per &lambda; complesso no.","sol":"<b>&#8477;-lineare, non &#8450;-lineare.</b> T(&lambda;A)=&lambda;&#773;&#8202;A&#773;=&lambda;&#773;&#8202;T(A). Se &lambda;&isin;&#8477; allora &lambda;&#773;=&lambda; e T rispetta lo scalare; se &lambda;=i, T(iA)=&minus;i&#8202;T(A)&ne;i&#8202;T(A). Per definizione di applicazione semilineare (antilineare), T soddisfa T(&lambda;A)=&lambda;&#773;&#8202;T(A): &egrave; additiva ma coniuga lo scalare."}]},{"pool":"strutture","src":"tipo 6 · indipendenza su &#8477; vs su &#8450;","steps":[{"t":"I vettori 1 e i, come elementi di &#8450; visto come spazio vettoriale, sono indipendenti?","opts":[{"x":"Indipendenti su &#8477;, dipendenti su &#8450;","c":true},{"x":"Indipendenti sia su &#8477; sia su &#8450;"},{"x":"Dipendenti su &#8477;"},{"x":"Dipendenti sia su &#8477; sia su &#8450;"}],"hint":"Su &#8450; puoi moltiplicare per scalari complessi: i = i&middot;1. Su &#8477; no.","sol":"<b>Indipendenti su &#8477;, dipendenti su &#8450;.</b> Per la definizione di indipendenza lineare, che dipende dal campo degli scalari: su &#8450; vale i&middot;1&minus;1&middot;i=0 con coefficienti non nulli (dipendenti); su &#8477; l&rsquo;uguaglianza a&middot;1+b&middot;i=0 con a,b&isin;&#8477; forza a=b=0 (indipendenti). &Egrave; il motivo per cui dim<sub>&#8477;</sub>&#8450;=2 e dim<sub>&#8450;</sub>&#8450;=1."}]},{"pool":"strutture","src":"b03 simulaz.nov2012 Q2 · matrici di Pauli","steps":[{"t":"Le matrici di Pauli &sigma;&#8321;,&sigma;&#8322;,&sigma;&#8323; in M&#8322;(&#8450;) soddisfano &sigma;&#8342;&sup2;=I e &sigma;&#8321;&sigma;&#8322;=i&sigma;&#8323;. Sono linearmente indipendenti su &#8450;?","opts":[{"x":"S&igrave;; con I formano una base di M&#8322;(&#8450;)","c":true},{"x":"No: &sigma;&#8323;=&sigma;&#8321;&sigma;&#8322;"},{"x":"No: sono solo 3 in uno spazio di dim 4"},{"x":"S&igrave; ma solo su &#8477;"}],"hint":"{I,&sigma;&#8321;,&sigma;&#8322;,&sigma;&#8323;} sono 4 matrici in M&#8322;(&#8450;) (dim 4): le &sigma;&#8342; hanno traccia 0, I no.","sol":"<b>S&igrave;, indipendenti; {I,&sigma;&#8321;,&sigma;&#8322;,&sigma;&#8323;} &egrave; una base di M&#8322;(&#8450;).</b> Per il criterio di indipendenza lineare in dimensione 4: le tre &sigma;&#8342; hanno traccia nulla e I no, e nessuna &sigma; &egrave; combinazione delle altre. La relazione &sigma;&#8321;&sigma;&#8322;=i&sigma;&#8323; &egrave; un PRODOTTO, non una combinazione lineare, quindi non intacca l&rsquo;indipendenza. Le &sigma;&#8342; generano l&rsquo;algebra di Lie su(2) tramite i commutatori [&sigma;&#8342;,&sigma;&#8343;]=2i&#8202;&epsilon;&#8342;&#8343;&#8342;&#8342;&sigma;&#8342;."}]},{"pool":"strutture","src":"3appellosol Es. 2 · T(P)=P(0)+P(1)x+P(2)x&sup2; (Vandermonde)","steps":[{"t":"Sia T : &#8477;[x]<sub>&le;2</sub>&rarr;&#8477;[x]<sub>&le;2</sub>, T(P)=P(0)+P(1)x+P(2)x&sup2;. T &egrave; un isomorfismo?","opts":[{"x":"S&igrave;: la matrice &egrave; di Vandermonde nei nodi 0,1,2, rango 3","c":true},{"x":"No: non &egrave; lineare"},{"x":"No: ha nucleo di dimensione 1"},{"x":"S&igrave;, ma solo su &#8450;"}],"hint":"T(P)=0 &hArr; P(0)=P(1)=P(2)=0: un polinomio di grado &le;2 con 3 radici distinte &egrave; nullo. Nucleo banale &rArr; ?","sol":"<b>S&igrave;.</b> ker&#8202;T: P si annulla in 0,1,2 (3 radici distinte, grado &le;2) &rArr; P=0. Nucleo {0} &rArr; T iniettiva, e su spazio di dimensione finita anche suriettiva: isomorfismo. La matrice nella base {1,x,x&sup2;} &egrave; la matrice di Vandermonde V(0,1,2), con det&nbsp;=&nbsp;&prod;<sub>i&lt;j</sub>(&alpha;<sub>j</sub>&minus;&alpha;<sub>i</sub>)&ne;0 perch&eacute; i nodi sono distinti."}]}]};

/* ===== ENGINE ===== */
var S = { units:[], ui:0, si:0, correct:0, total:0, answered:false };

/* TRACCIA innestata (quiz_innesta_traccia.py) — il quiz ricorda le risposte. */
var TRACCIA = (function(){
  var CHIAVE = 'navicella.quiz.attempts.v1';
  var attivo = true;
  try { window.localStorage.setItem('__t','1'); window.localStorage.removeItem('__t'); }
  catch(e){ attivo = false; }
  function leggi(){
    if(!attivo) return [];
    try { return JSON.parse(window.localStorage.getItem(CHIAVE)||'[]'); } catch(e){ return []; }
  }
  function scrivi(a){
    if(!attivo) return;
    try { window.localStorage.setItem(CHIAVE, JSON.stringify(a)); } catch(e){}
  }
  function registra(rec){
    if(!attivo) return;
    var a = leggi();
    rec.ts = new Date().toISOString();
    rec.corso = (document.title||'').trim();
    a.push(rec);
    if(a.length > 5000) a = a.slice(-5000);
    scrivi(a);
    aggiornaBottone();
  }
  function esporta(){
    var a = leggi(); if(!a.length) return;
    var jsonl = a.map(function(r){ return JSON.stringify(r); }).join('\n')+'\n';
    var url = URL.createObjectURL(new Blob([jsonl], {type:'application/x-ndjson'}));
    var nome = 'quiz-attempts-'+(document.title||'quiz').replace(/[^A-Za-z0-9]+/g,'-')
             + '-' + new Date().toISOString().slice(0,10) + '.jsonl';
    var el = document.createElement('a');
    el.href = url; el.download = nome; document.body.appendChild(el); el.click();
    document.body.removeChild(el); URL.revokeObjectURL(url);
  }
  function svuota(){
    if(!confirm('Cancellare i tentativi salvati in questo browser?')) return;
    scrivi([]); aggiornaBottone();
  }
  function aggiornaBottone(){
    var b = document.getElementById('tracciaBtn'); var n = leggi().length;
    if(!b){
      if(!n) return;
      b = document.createElement('div'); b.id='tracciaBtn';
      b.style.cssText='position:fixed;right:14px;bottom:14px;z-index:9999;'
        +'font:600 13px/1.2 system-ui,sans-serif;display:flex;gap:6px;align-items:center;'
        +'background:#1f2937;color:#fff;padding:8px 12px;border-radius:10px;'
        +'box-shadow:0 2px 10px rgba(0,0,0,.25);cursor:pointer;opacity:.92';
      b.title='Scarica i tentativi come .jsonl da consegnare alla navicella';
      b.onclick=esporta; document.body.appendChild(b);
      var x=document.createElement('span'); x.textContent='×';
      x.style.cssText='margin-left:6px;opacity:.6;padding:0 3px'; x.title='Svuota';
      x.onclick=function(ev){ ev.stopPropagation(); svuota(); };
      b.appendChild(x);
    }
    if(!n){ b.remove(); return; }
    if(b.firstChild && b.firstChild.nodeType===3) b.firstChild.nodeValue='↓ esporta '+n+' risposte';
    else b.insertBefore(document.createTextNode('↓ esporta '+n+' risposte'), b.firstChild);
  }
  var ultimoGiusto = 0, ultimoVisto = null;
  /* famiglia "meccanica": un solo aggancio, l'esito dalla variazione di correctCount */
  function daStato(st, q){
    if(!st) return;
    var chiave = (q && (q._pool||'?')) + '::' + st.idx;
    if(chiave === ultimoVisto) return;              // gia' registrato questo passo
    ultimoVisto = chiave;
    var giusto = (st.correctCount||0) > ultimoGiusto;
    ultimoGiusto = st.correctCount||0;
    registra({ pool: (q && q._pool) || null, ui: st.idx, si: 0,
               esito: giusto, primo: true, tipo: (q && q.type) || null });
  }
  return { registra:registra, esporta:esporta, daStato:daStato,
           conta:function(){ return leggi().length; }, aggiorna:aggiornaBottone };
})();


function poolCount(id){ return (Q[id]||[]).reduce(function(n,u){return n+u.steps.length;},0); }

function renderMenu(){
  var g = document.getElementById('poolGrid');
  g.innerHTML = '';
  POOLS.forEach(function(p){
    var units = Q[p.id]||[];
    var n = poolCount(p.id);
    var empty = units.length===0;
    var card = document.createElement(empty?'div':'button');
    card.className = 'pool-card'+(empty?' empty':'');
    if(!empty) card.onclick = function(){ start(p.id); };
    card.innerHTML =
      '<div class="n">'+p.name+'</div>'+
      '<div class="meta">Difficolt&agrave; '+p.diff+' &middot; '+(empty?'0 unit&agrave;':(n+' unit&agrave;'))+'</div>'+
      '<span class="badge '+(p.status==='full'?'full':'todo')+'">'+
        (p.status==='full'?'COMPLETO':'DA ESTENDERE')+'</span>';
    g.appendChild(card);
  });
}

function start(poolId){
  var units = [];
  if(poolId==='ALL'){
    POOLS.forEach(function(p){ (Q[p.id]||[]).forEach(function(u){ units.push(u); }); });
  } else {
    units = (Q[poolId]||[]).slice();
  }
  if(units.length===0) return;
  units = shuffle(units.slice());
  S = { units:units, ui:0, si:0, correct:0, total:0, answered:false, poolId:poolId };
  show('quiz');
  renderStep();
}

function poolNameById(id){
  for(var i=0;i<POOLS.length;i++) if(POOLS[i].id===id) return POOLS[i].name;
  return id;
}

function renderStep(){
  var u = S.units[S.ui];
  var st = u.steps[S.si];
  S.answered = false;

  // header
  document.getElementById('qpool').innerHTML =
    (S.poolId==='ALL'?'Mischia':poolNameById(S.poolId));
  document.getElementById('qpos').innerHTML =
    'Domanda '+(S.ui+1)+' / '+S.units.length+
    (u.steps.length>1?(' &middot; parte '+(S.si+1)+'/'+u.steps.length):'')+
    ' &middot; <span class="src">'+u.src+'</span>';
  document.getElementById('qbar').style.width = (100*(S.ui)/S.units.length)+'%';

  // figura: di step se presente, altrimenti di unit
  var fig = document.getElementById('qfig');
  var svg = st.svg || (S.si===0 ? u.svg : null);
  if(svg){ fig.innerHTML = svg; fig.classList.remove('hidden'); }
  else { fig.innerHTML=''; fig.classList.add('hidden'); }

  document.getElementById('qtext').innerHTML = st.t;

  // opzioni mescolate
  var opts = shuffle(st.opts.map(function(o){return o;}));
  var box = document.getElementById('qopts');
  box.innerHTML = '';
  opts.forEach(function(o){
    var b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = o.x;
    b.onclick = function(){ answer(b, o, st); };
    box.appendChild(b);
  });

  document.getElementById('qhint').classList.remove('show');
  document.getElementById('qsol').classList.remove('show');
  document.getElementById('qcont').classList.add('hidden');
}

function answer(btn, opt, st){
  TRACCIA.registra({ pool: S.poolId, ui: S.ui, si: S.si,
                     esito: !!opt.c, primo: !S.answered,
                     hint: document.getElementById('qhint').classList.contains('show') });
  if(opt.c){
    // corretto
    btn.classList.add('correct');
    Array.prototype.forEach.call(document.querySelectorAll('#qopts .opt'),
      function(b){ b.disabled = true; });
    document.getElementById('qhint').classList.remove('show');
    var sol = document.getElementById('qsol');
    sol.innerHTML = '<b>Corretto.</b> '+st.sol;
    sol.classList.add('show');
    if(!S.answered){ S.correct++; }
    S.answered = true;
    var c = document.getElementById('qcont');
    var last = (S.si === S.units[S.ui].steps.length-1);
    c.innerHTML = last ? 'Prossima domanda &rarr;' : (st.cont || 'Continua &rarr;');
    c.classList.remove('hidden');
    c.onclick = nextStep;
  } else {
    // sbagliato: suggerimento mirato, ritenta
    btn.classList.add('wrong');
    btn.disabled = true;
    var h = document.getElementById('qhint');
    h.innerHTML = '<b>Rivedi.</b> '+st.hint;
    h.classList.add('show');
  }
}

function nextStep(){
  var u = S.units[S.ui];
  S.total++;
  if(S.si < u.steps.length-1){
    S.si++;
    renderStep();
  } else {
    S.ui++;
    S.si = 0;
    if(S.ui >= S.units.length){ endQuiz(); }
    else renderStep();
  }
}

function endQuiz(){
  show('end');
  document.getElementById('endScore').innerHTML = S.correct+' / '+S.total;
  var pct = S.total? Math.round(100*S.correct/S.total):0;
  var msg = pct>=85 ? 'Livello d&rsquo;esame solido.' :
            pct>=60 ? 'Buona base, ma alcuni trabocchetti ti hanno preso.' :
                      'Rivedi i suggerimenti: gli errori sono concettuali, non di calcolo.';
  document.getElementById('endMsg').innerHTML = 'Risposte corrette al primo tentativo. '+msg;
}

function toMenu(){ show('menu'); }

function show(which){
  ['menu','quiz','end'].forEach(function(id){
    document.getElementById(id).classList.toggle('hidden', id!==which);
  });
  window.scrollTo(0,0);
}

renderMenu();
</script>
