Sigma$.","opts":[{"x":"$\\gamma(t)=(3\\cos t,\\ 3\\sin t,\\ -6\\cos t-3\\sin t+2)$, $t\\in[0,2\\pi]$","c":true},{"x":"$\\gamma(t)=(3\\cos t,\\ 3\\sin t,\\ 0)$, $t\\in[0,2\\pi]$"},{"x":"$\\gamma(t)=(\\cos t,\\ \\sin t,\\ -2\\cos t-\\sin t+2)$, $t\\in[0,2\\pi]$"}],"hint":"$\\partial\\Sigma$ e' l'immagine di $\\partial D$ (il cerchio di raggio $3$) tramite la parametrizzazione: la $z$ NON e' costante, si legge da $f$.","sol":"Il bordo $\\partial\\Sigma$ e' l'immagine di $\\partial D=\\{x^2+y^2=9\\}$ tramite $X$. Con $x=3\\cos t,\\ y=3\\sin t$ e $z=f(x,y)=-2x-y+2$ si ottiene $\\gamma(t)=(3\\cos t,\\,3\\sin t,\\,-6\\cos t-3\\sin t+2)$, $t\\in[0,2\\pi]$.","cont":"rotore"},{"t":"Per $F=(y^2+z^2+e^x,\\ xy+z+\\cos y,\\ 2xz+3yz+z^2)$ calcola $\\operatorname{rot}F$.","opts":[{"x":"$(3z-1,\\ 0,\\ -y)$","c":true},{"x":"$(3z-1,\\ 2z,\\ -y)$"},{"x":"$(1-3z,\\ 0,\\ y)$"}],"hint":"Rotore come determinante formale. La componente $j$ e' $\\partial_z F_1-\\partial_x F_3=2z-2z=0$.","sol":"$\\operatorname{rot}F=(\\partial_yF_3-\\partial_zF_2,\\ \\partial_zF_1-\\partial_xF_3,\\ \\partial_xF_2-\\partial_yF_1)=(3z-1,\\ 2z-2z,\\ y-2y)=(3z-1,0,-y)$.","cont":"Stokes"},{"t":"Calcola la circuitazione di $F$ lungo $\\partial\\Sigma$ orientato in modo compatibile con $\\Sigma$ orientata dalla normale a terza componente NEGATIVA.","opts":[{"x":"$-90\\pi$","c":true},{"x":"$90\\pi$"},{"x":"$0$"}],"hint":"Normale a terza componente negativa: usa il vettore $(f_x,f_y,-1)=(-2,-1,-1)$. Poi $\\iint_D x=\\iint_D y=0$ per simmetria, sopravvive solo il termine costante.","sol":"Teorema di Stokes: $\\oint_{+\\partial\\Sigma}F\\cdot T\\,ds=\\iint_\\Sigma\\operatorname{rot}F\\cdot n\\,d\\sigma$. Con normale a terza componente negativa $n\\,d\\sigma=(f_x,f_y,-1)\\,dx\\,dy=(-2,-1,-1)\\,dx\\,dy$. Allora $\\operatorname{rot}F\\cdot(-2,-1,-1)=-2(3z-1)+y=-6z+2+y$; con $z=-2x-y+2$ diventa $12x+7y-10$. Per simmetria del disco $\\iint_D x=\\iint_D y=0$, resta $-10\\,m_2(D)=-10\\cdot 9\\pi=-90\\pi$. (La stampa scrive il vettore di test come $(-2,-2,-1)$: refuso sulla comp. centrale, ininfluente perche' $\\operatorname{rot}F$ ha comp. centrale $0$.)"}]},{"pool":"superfici","src":"20240122 Es.4","steps":[{"t":"$E=\\{(x,y,z):\\ 1+z^2\\le\\sqrt{x^2+y^2}\\le 3-z^2\\}$. Riconosci il solido e determina l'intervallo di $z$ ammesso.","opts":[{"x":"solido di rotazione attorno a $z$, profilo $1+z^2\\le r\\le 3-z^2$, esiste per $z\\in[-1,1]$","c":true},{"x":"solido di rotazione, esiste per ogni $z\\in\\mathbb{R}$"},{"x":"non e' di rotazione, va integrato in cartesiane"}],"hint":"Poni $r=\\sqrt{x^2+y^2}$: il profilo esiste solo dove $1+z^2\\le 3-z^2$.","sol":"E' un solido di rotazione attorno all'asse $z$: nel semipiano $(r,z)$ il profilo e' $\\{1+z^2\\le r\\le 3-z^2\\}$, non vuoto solo se $1+z^2\\le 3-z^2\\Rightarrow z^2\\le 1\\Rightarrow z\\in[-1,1]$.","cont":"volume"},{"t":"Calcola il volume di $E$.","opts":[{"x":"$\\dfrac{32}{3}\\pi$","c":true},{"x":"$\\dfrac{16}{3}\\pi$"},{"x":"$8\\pi$"}],"hint":"$(3-z^2)^2-(1+z^2)^2=8-8z^2$; poi integra su $[-1,1]$.","sol":"Teorema di Guldino (Pappo): $V=2\\pi\\iint_{\\text{profilo}} r\\,dr\\,dz=\\pi\\int_{-1}^{1}\\big[(3-z^2)^2-(1+z^2)^2\\big]dz=\\pi\\int_{-1}^{1}(8-8z^2)\\,dz=8\\pi\\big[z-\\tfrac{z^3}{3}\\big]_{-1}^{1}=\\dfrac{32}{3}\\pi$.","cont":"flusso totale"},{"t":"Calcola il flusso di $F=(0,0,z)$ uscente da tutta la frontiera di $E$.","opts":[{"x":"$\\dfrac{32}{3}\\pi$","c":true},{"x":"$0$"},{"x":"$\\dfrac{32}{5}\\pi$"}],"hint":"$\\operatorname{div}F=1$: il flusso uscente da una superficie chiusa eguaglia il volume racchiuso.","sol":"Teorema della divergenza (Gauss): $\\Phi_{\\partial E}=\\iiint_E\\operatorname{div}F\\,dV=\\iiint_E 1\\,dV=V=\\dfrac{32}{3}\\pi$.","cont":"parametrizzazione"},{"t":"Parametrizza le due superfici di rotazione $\\Sigma_1,\\Sigma_2$ che delimitano $E$ ($\\gamma_1=1+z^2$, $\\gamma_2=3-z^2$).","opts":[{"x":"$X_i(\\theta,z)=(\\gamma_i(z)\\cos\\theta,\\ \\gamma_i(z)\\sin\\theta,\\ z)$, $\\theta\\in[0,2\\pi]$, $z\\in[-1,1]$","c":true},{"x":"$X_i(\\theta,z)=(\\gamma_i(z)\\cos\\theta,\\ \\gamma_i(z)\\sin\\theta,\\ \\gamma_i(z))$"},{"x":"$X_i(\\theta,z)=(\\cos\\theta,\\ \\sin\\theta,\\ z)$"}],"hint":"Rotazione attorno a $z$ del profilo $r=\\gamma_i(z)$: la $z$ resta il parametro, non la funzione.","sol":"Superficie di rotazione: $X_i(\\theta,z)=(\\gamma_i(z)\\cos\\theta,\\,\\gamma_i(z)\\sin\\theta,\\,z)$ con $\\gamma_1(z)=1+z^2$, $\\gamma_2(z)=3-z^2$, $\\theta\\in[0,2\\pi]$, $z\\in[-1,1]$.","cont":"vettore normale"},{"t":"Calcola $X_\\theta\\times X_z$ per la parametrizzazione precedente (scrivi $\\gamma,\\gamma'$).","opts":[{"x":"$(\\gamma\\cos\\theta,\\ \\gamma\\sin\\theta,\\ -\\gamma\\gamma')$","c":true},{"x":"$(\\gamma\\cos\\theta,\\ \\gamma\\sin\\theta,\\ \\gamma\\gamma')$"},{"x":"$(-\\gamma\\sin\\theta,\\ \\gamma\\cos\\theta,\\ 0)$"}],"hint":"$X_\\theta=(-\\gamma\\sin\\theta,\\gamma\\cos\\theta,0)$, $X_z=(\\gamma'\\cos\\theta,\\gamma'\\sin\\theta,1)$; attenzione al segno della terza componente.","sol":"$X_\\theta\\times X_z=(-\\gamma\\sin\\theta,\\gamma\\cos\\theta,0)\\times(\\gamma'\\cos\\theta,\\gamma'\\sin\\theta,1)=(\\gamma\\cos\\theta,\\ \\gamma\\sin\\theta,\\ -\\gamma\\gamma')$.","cont":"flussi Sigma_i"},{"t":"Calcola il flusso di $F=(0,0,z)$ uscente attraverso $\\Sigma_1$ e $\\Sigma_2$.","opts":[{"x":"$\\Phi(\\Sigma_2)=\\dfrac{32}{5}\\pi,\\quad\\Phi(\\Sigma_1)=\\dfrac{64}{15}\\pi$","c":true},{"x":"$\\Phi(\\Sigma_2)=\\dfrac{32}{3}\\pi,\\quad\\Phi(\\Sigma_1)=0$"},{"x":"$\\Phi(\\Sigma_1)=\\Phi(\\Sigma_2)=\\dfrac{16}{3}\\pi$"}],"hint":"Per $\\Sigma_2$ ($\\gamma_2=3-z^2$, $\\gamma_2'=-2z$) il vettore $X_\\theta\\times X_z$ punta all'esterno; poi $\\Phi(\\Sigma_1)=\\Phi(\\partial E)-\\Phi(\\Sigma_2)$.","sol":"$F\\cdot(X_\\theta\\times X_z)=-z\\gamma\\gamma'$. Per $i=2$: $-z(3-z^2)(-2z)=2z^2(3-z^2)$, e $\\Phi(\\Sigma_2)=\\int_0^{2\\pi}\\!\\!\\int_{-1}^{1}2z^2(3-z^2)\\,dz\\,d\\theta=\\dfrac{32}{5}\\pi$. Per additivita' del flusso su una frontiera chiusa: $\\Phi(\\Sigma_1)=\\Phi(\\partial E)-\\Phi(\\Sigma_2)=\\dfrac{32}{3}\\pi-\\dfrac{32}{5}\\pi=\\dfrac{64}{15}\\pi$."}]},{"pool":"superfici","src":"20230210 Es.4","steps":[{"t":"$E=\\{x^2+y^2+z^2\\le 25,\\ x^2+y^2\\le 9\\}$. Calcola il volume di $E$.","opts":[{"x":"$\\dfrac{244}{3}\\pi$","c":true},{"x":"$\\dfrac{250}{3}\\pi$"},{"x":"$36\\pi$"}],"hint":"Dominio normale su $D=\\{x^2+y^2\\le 9\\}$: $-\\sqrt{25-x^2-y^2}\\le z\\le\\sqrt{25-x^2-y^2}$; integra in coordinate polari.","sol":"$V=\\iint_D 2\\sqrt{25-x^2-y^2}\\,dx\\,dy=\\int_0^{2\\pi}\\!\\!\\int_0^3 2\\sqrt{25-\\rho^2}\\,\\rho\\,d\\rho\\,d\\theta=2\\pi\\big[-\\tfrac{2}{3}(25-\\rho^2)^{3/2}\\big]_0^3=\\dfrac{244}{3}\\pi$.","cont":"tre superfici"},{"t":"Parametrizza le tre superfici che compongono $\\partial E$.","opts":[{"x":"$\\Sigma_{1,2}:\\ z=\\pm\\sqrt{25-x^2-y^2}$ su $D$; $\\Sigma_3:\\ (3\\cos\\theta,3\\sin\\theta,t)$, $t\\in[-4,4]$","c":true},{"x":"$\\Sigma_{1,2}$ come detto; $\\Sigma_3:\\ (3\\cos\\theta,3\\sin\\theta,t)$, $t\\in[-5,5]$"},{"x":"solo due superfici: le due calotte sferiche"}],"hint":"Il cilindro $x^2+y^2=9$ interseca la sfera dove $z^2=25-9=16$, cioe' $z=\\pm4$: e' li' il taglio in $t$.","sol":"Le due calotte sferiche $\\Sigma_1:\\ z=\\sqrt{25-x^2-y^2}$ e $\\Sigma_2:\\ z=-\\sqrt{25-x^2-y^2}$ (cartesiane su $D=\\{x^2+y^2\\le 9\\}$, regolari), e il mantello cilindrico $\\Sigma_3:\\ r_3(\\theta,t)=(3\\cos\\theta,3\\sin\\theta,t)$, $\\theta\\in[0,2\\pi]$, $t\\in[-4,4]$.","cont":"bordi"},{"t":"Individua i bordi delle tre superfici.","opts":[{"x":"$\\partial\\Sigma_1=\\{x^2+y^2=9,z=4\\}$, $\\partial\\Sigma_2=\\{x^2+y^2=9,z=-4\\}$, $\\partial\\Sigma_3=\\partial\\Sigma_1\\cup\\partial\\Sigma_2$","c":true},{"x":"tutte e tre hanno bordo vuoto (sono chiuse)"},{"x":"$\\partial\\Sigma_3$ e' un solo cerchio"}],"hint":"Le calotte hanno per bordo il cerchio di raccordo col cilindro; il cilindro e' aperto sopra e sotto.","sol":"$\\partial\\Sigma_1$ e $\\partial\\Sigma_2$ sono i due cerchi $\\{x^2+y^2=9,\\ z=\\pm4\\}$; il mantello $\\Sigma_3$ ha per bordo entrambi: $\\partial\\Sigma_3=\\partial\\Sigma_1\\cup\\partial\\Sigma_2$.","cont":"flusso calotta"},{"t":"Con $F=(x,y,z)$, calcola il flusso uscente attraverso la calotta superiore $\\Sigma_1$.","opts":[{"x":"$50\\pi$","c":true},{"x":"$25\\pi$"},{"x":"$\\dfrac{244}{3}\\pi$"}],"hint":"$(r_1)_x\\times(r_1)_y=(-f_x,-f_y,1)$; nel prodotto $F\\cdot$ i termini $x^2,y^2$ e $z^2=25-x^2-y^2$ si combinano in $25$.","sol":"$(r_1)_x\\times(r_1)_y=\\big(\\tfrac{x}{\\sqrt{25-x^2-y^2}},\\tfrac{y}{\\sqrt{25-x^2-y^2}},1\\big)$ (terza comp. positiva = uscente). $F\\cdot(\\cdot)=\\tfrac{x^2+y^2}{\\sqrt{25-x^2-y^2}}+z=\\tfrac{25}{\\sqrt{25-x^2-y^2}}$; quindi $\\Phi(\\Sigma_1)=\\int_0^{2\\pi}\\!\\!\\int_0^3\\tfrac{25\\,\\rho}{\\sqrt{25-\\rho^2}}\\,d\\rho\\,d\\theta=50\\pi$. Per simmetria $\\Phi(\\Sigma_2)=50\\pi$.","cont":"flusso mantello"},{"t":"Calcola il flusso uscente attraverso il mantello $\\Sigma_3$ nel modo piu' rapido.","opts":[{"x":"$144\\pi$, via $\\Phi(\\Sigma_3)=3V-\\Phi(\\Sigma_1)-\\Phi(\\Sigma_2)$","c":true},{"x":"$100\\pi$"},{"x":"$\\dfrac{244}{3}\\pi$"}],"hint":"$\\operatorname{div}F=3$: il flusso totale uscente e' $3V$; sottrai i due flussi gia' noti delle calotte.","sol":"Teorema della divergenza: $\\Phi(\\partial E)=\\iiint_E 3\\,dV=3V=244\\pi$. Quindi $\\Phi(\\Sigma_3)=244\\pi-\\Phi(\\Sigma_1)-\\Phi(\\Sigma_2)=244\\pi-100\\pi=144\\pi$.","cont":"verifica diretta"},{"t":"Verifica $\\Phi(\\Sigma_3)$ con il calcolo diretto sul cilindro.","opts":[{"x":"$(r_3)_\\theta\\times(r_3)_t=(3\\cos\\theta,3\\sin\\theta,0)$, $F\\cdot=9$, $\\ \\Phi=144\\pi$","c":true},{"x":"$F\\cdot=t^2$, $\\ \\Phi=0$"},{"x":"$F\\cdot=3$, $\\ \\Phi=48\\pi$"}],"hint":"Sul cilindro $F=(3\\cos\\theta,3\\sin\\theta,t)$ e la normale radiale uscente e' $(\\cos\\theta,\\sin\\theta,0)$: il prodotto e' costante in $t$.","sol":"$(r_3)_\\theta\\times(r_3)_t=(-3\\sin\\theta,3\\cos\\theta,0)\\times(0,0,1)=(3\\cos\\theta,3\\sin\\theta,0)$ (uscente). $F\\cdot(\\cdot)=9\\cos^2\\theta+9\\sin^2\\theta=9$, e $\\Phi(\\Sigma_3)=\\int_0^{2\\pi}\\!\\!\\int_{-4}^{4}9\\,dt\\,d\\theta=9\\cdot 8\\cdot 2\\pi=144\\pi$: conferma il risultato di Gauss."}]},{"pool":"superfici","src":"Esame 27.06.2025 Es.5","steps":[{"t":"$\\gamma:\\ x=1+t^2,\\ z=t,\\ t\\in[1,2]$. E' semplice e regolare?","opts":[{"x":"si': e' cartesiana $x=f(z)=1+z^2$ con $f\\in C^1([1,2])$ e $z'(t)=1\\ne0$","c":true},{"x":"no: si autointerseca"},{"x":"no: $x'(t)=0$ in $t=1$"}],"hint":"Curva cartesiana rispetto a $z$: la terza coordinata $z=t$ e' iniettiva, quindi semplice.","sol":"E' una curva cartesiana $x=f(z)=1+z^2$ con $f\\in C^1$; $z(t)=t$ iniettiva $\\Rightarrow$ semplice, $z'(t)=1\\ne0$ $\\Rightarrow$ regolare.","cont":"superficie"},{"t":"Scrivi la parametrizzazione della superficie $\\Sigma$ ottenuta ruotando $\\gamma$ di $2\\pi$ attorno all'asse $z$.","opts":[{"x":"$X(\\theta,t)=((1+t^2)\\cos\\theta,\\ (1+t^2)\\sin\\theta,\\ t)$, $\\theta\\in[0,2\\pi]$, $t\\in[1,2]$","c":true},{"x":"$X(\\theta,t)=(\\cos\\theta,\\ \\sin\\theta,\\ 1+t^2)$"},{"x":"$X(\\theta,t)=((1+t^2)\\cos\\theta,\\ (1+t^2)\\sin\\theta,\\ 1+t^2)$"}],"hint":"Il raggio a quota $z=t$ e' $r=1+t^2$; la quota resta il parametro $t$.","sol":"Superficie di rotazione: $X(\\theta,t)=((1+t^2)\\cos\\theta,\\,(1+t^2)\\sin\\theta,\\,t)$, $\\theta\\in[0,2\\pi]$, $t\\in[1,2]$.","cont":"divergenza"},{"t":"Sia $E$ il solido delimitato da $\\Sigma$ e dai piani $z=1$, $z=2$, e $F=\\big(\\tfrac{2x}{1+z^2},\\ \\sin(xz)+20,\\ e^x+y^3\\big)$. Calcola $\\operatorname{div}F$.","opts":[{"x":"$\\dfrac{2}{1+z^2}$","c":true},{"x":"$\\dfrac{2}{1+z^2}+3y^2$"},{"x":"$0$"}],"hint":"Solo $F_1$ dipende da $x$; $\\partial_yF_2$ e $\\partial_zF_3$ sono derivate rispetto a variabili che non compaiono in quelle componenti.","sol":"$\\operatorname{div}F=\\partial_x\\!\\big(\\tfrac{2x}{1+z^2}\\big)+\\partial_y(\\sin(xz)+20)+\\partial_z(e^x+y^3)=\\dfrac{2}{1+z^2}+0+0$.","cont":"strati"},{"t":"A quota $z$ fissata, qual e' la sezione $E_z$ del solido?","opts":[{"x":"disco $\\sqrt{x^2+y^2}\\le 1+z^2$, di area $\\pi(1+z^2)^2$","c":true},{"x":"disco di raggio $1$, area $\\pi$"},{"x":"corona $1\\le\\rho\\le 1+z^2$"}],"hint":"Il bordo di $\\Sigma$ a quota $z$ e' a $r=1+z^2$: la sezione e' il disco pieno fino a quel raggio.","sol":"A quota $z\\in[1,2]$ la superficie e' a raggio $r=1+z^2$, quindi $E_z=\\{\\sqrt{x^2+y^2}\\le 1+z^2\\}$, disco di area $\\pi(1+z^2)^2$.","cont":"flusso"},{"t":"Calcola il flusso uscente di $F$ da $E$.","opts":[{"x":"$\\dfrac{20}{3}\\pi$","c":true},{"x":"$\\dfrac{10}{3}\\pi$"},{"x":"$20\\pi$"}],"hint":"Integrazione per strati: $\\iiint_E\\tfrac{2}{1+z^2}\\,dV=\\int_1^2\\tfrac{2}{1+z^2}\\cdot\\pi(1+z^2)^2\\,dz$; il fattore $1+z^2$ si semplifica.","sol":"Teorema della divergenza + integrazione per strati: $\\Phi=\\iiint_E\\tfrac{2}{1+z^2}\\,dV=\\int_1^2\\tfrac{2}{1+z^2}\\,\\pi(1+z^2)^2\\,dz=2\\pi\\int_1^2(1+z^2)\\,dz=2\\pi\\big[z+\\tfrac{z^3}{3}\\big]_1^2=2\\pi\\cdot\\tfrac{10}{3}=\\dfrac{20}{3}\\pi$."}]},{"pool":"superfici","src":"variante · da MIT 18.02SC · manuale","steps":[{"t":"$\\Sigma$ e' la parte di sfera $x^2+y^2+z^2=4$ con $z\\ge0$ che si proietta su $D=\\{x^2+y^2\\le 3\\}$. Scrivi $F$ e $\\nabla F$ per trattarla come superficie di livello.","opts":[{"x":"$F=x^2+y^2+z^2-4$, $\\ \\nabla F=(2x,2y,2z)$","c":true},{"x":"$F=\\sqrt{x^2+y^2+z^2}-2$, $\\ \\nabla F=(x,y,z)$"},{"x":"$F=x^2+y^2+z^2$, $\\ \\nabla F=(x,y,z)$"}],"hint":"Scegli $F$ che si annulla su $\\Sigma$; $\\nabla F$ e' normale (non tangente) alla superficie di livello.","sol":"$\\Sigma=\\{F=0\\}$ con $F=x^2+y^2+z^2-4$; $\\nabla F=(2x,2y,2z)$ e' normale a ogni superficie di livello di $F$.","cont":"formula implicita"},{"t":"Per $\\Sigma:\\ F(x,y,z)=0$ proiettata sul piano $xy$, quale formula da' l'elemento d'area?","opts":[{"x":"$dS=\\dfrac{\\|\\nabla F\\|}{|F_z|}\\,dA$","c":true},{"x":"$dS=\\|\\nabla F\\|\\,dA$"},{"x":"$dS=\\dfrac{|F_z|}{\\|\\nabla F\\|}\\,dA$"}],"hint":"Deriva dal Dini: da $F=0$ si esplicita $z=g(x,y)$ con $g_x=-F_x/F_z$, e $\\sqrt{1+g_x^2+g_y^2}$ si riscrive con $\\nabla F$.","sol":"Teorema di Dini + area cartesiana: esplicitando $z=g(x,y)$ si ha $g_x=-F_x/F_z,\\ g_y=-F_y/F_z$, quindi $\\sqrt{1+g_x^2+g_y^2}=\\dfrac{\\sqrt{F_x^2+F_y^2+F_z^2}}{|F_z|}=\\dfrac{\\|\\nabla F\\|}{|F_z|}$: e' l'elemento d'area senza parametrizzazione esplicita.","cont":"calcolo dS"},{"t":"Calcola $dS$ per la nostra sfera $R=2$.","opts":[{"x":"$dS=\\dfrac{2}{\\sqrt{4-x^2-y^2}}\\,dA$","c":true},{"x":"$dS=\\dfrac{4}{z}\\,dA$"},{"x":"$dS=\\sqrt{4-x^2-y^2}\\,dA$"}],"hint":"Sulla sfera $\\|\\nabla F\\|=2\\sqrt{x^2+y^2+z^2}=2R=4$; $|F_z|=|2z|=2z$ con $z=\\sqrt{4-x^2-y^2}$.","sol":"$\\|\\nabla F\\|=2\\sqrt{x^2+y^2+z^2}=2\\cdot2=4$ sulla sfera; $|F_z|=2z=2\\sqrt{4-x^2-y^2}$. Quindi $dS=\\dfrac{4}{2\\sqrt{4-x^2-y^2}}\\,dA=\\dfrac{2}{\\sqrt{4-x^2-y^2}}\\,dA$.","cont":"integrale"},{"t":"Imposta l'integrale per l'area di $\\Sigma$ su $D=\\{x^2+y^2\\le 3\\}$.","opts":[{"x":"$\\displaystyle\\int_0^{2\\pi}\\!\\!\\int_0^{\\sqrt3}\\frac{2\\rho}{\\sqrt{4-\\rho^2}}\\,d\\rho\\,d\\theta$","c":true},{"x":"$\\displaystyle\\int_0^{2\\pi}\\!\\!\\int_0^{2}\\frac{2\\rho}{\\sqrt{4-\\rho^2}}\\,d\\rho\\,d\\theta$"},{"x":"$\\displaystyle\\int_0^{2\\pi}\\!\\!\\int_0^{\\sqrt3}2\\rho\\sqrt{4-\\rho^2}\\,d\\rho\\,d\\theta$"}],"hint":"$D$ ha raggio $\\sqrt3$ (proiezione richiesta): NON il raggio $2$ dell'equatore. In polari $dA=\\rho\\,d\\rho\\,d\\theta$.","sol":"$A=\\iint_D dS=\\int_0^{2\\pi}\\!\\!\\int_0^{\\sqrt3}\\dfrac{2\\rho}{\\sqrt{4-\\rho^2}}\\,d\\rho\\,d\\theta$: raggio $\\sqrt3$ perche' la proiezione richiesta e' $D=\\{x^2+y^2\\le3\\}$.","cont":"area"},{"t":"Calcola l'area e verificala con la formula della calotta.","opts":[{"x":"$A=4\\pi$, e $2\\pi R h=2\\pi\\cdot2\\cdot1=4\\pi$","c":true},{"x":"$A=2\\pi$, e $2\\pi R h=2\\pi$"},{"x":"$A=4\\pi(2-\\sqrt3)$"}],"hint":"Primitiva di $\\rho/\\sqrt{4-\\rho^2}$ e' $-\\sqrt{4-\\rho^2}$. La calotta va da $z=1$ (a $\\rho=\\sqrt3$) a $z=2$: altezza $h=1$.","sol":"$A=2\\pi\\cdot 2\\big[-\\sqrt{4-\\rho^2}\\big]_0^{\\sqrt3}=4\\pi\\big(-1-(-2)\\big)=4\\pi$. Verifica con l'area della calotta sferica $2\\pi R h$: qui $h=2-1=1$, $2\\pi\\cdot2\\cdot1=4\\pi$. Coincidono."}]},{"pool":"superfici","src":"variante · da LibreTexts · manuale","steps":[{"t":"Su una sfera di raggio $R$, qual e' l'elemento d'area in coordinate sferiche?","opts":[{"x":"$dS=R^2\\sin\\phi\\,d\\phi\\,d\\theta$","c":true},{"x":"$dS=R^2\\,d\\phi\\,d\\theta$"},{"x":"$dS=R\\sin\\phi\\,d\\phi\\,d\\theta$"}],"hint":"$\\|X_\\phi\\times X_\\theta\\|=R^2\\sin\\phi$ ($\\phi$ = angolo polare dal polo nord).","sol":"Con $X(\\phi,\\theta)=(R\\sin\\phi\\cos\\theta,R\\sin\\phi\\sin\\theta,R\\cos\\phi)$ si ha $\\|X_\\phi\\times X_\\theta\\|=R^2\\sin\\phi$, quindi $dS=R^2\\sin\\phi\\,d\\phi\\,d\\theta$.","cont":"area calotta"},{"t":"Calcola l'area della calotta $x^2+y^2+z^2=9$ con apertura polare $\\phi\\in[0,\\pi/3]$.","opts":[{"x":"$9\\pi$","c":true},{"x":"$18\\pi$"},{"x":"$\\tfrac{9}{2}\\pi$"}],"hint":"$\\int_0^{\\pi/3}\\sin\\phi\\,d\\phi=1-\\cos(\\pi/3)=1-\\tfrac12=\\tfrac12$; poi $\\times 2\\pi\\times R^2$.","sol":"$A=R^2\\int_0^{2\\pi}\\!\\!\\int_0^{\\pi/3}\\sin\\phi\\,d\\phi\\,d\\theta=9\\cdot 2\\pi\\cdot\\tfrac12=9\\pi$. Verifica: $2\\pi R h$ con $h=R(1-\\cos\\tfrac{\\pi}{3})=3\\cdot\\tfrac12=\\tfrac32$, $2\\pi\\cdot3\\cdot\\tfrac32=9\\pi$."}]},{"pool":"superfici","src":"variante · da MIT 18.02SC · manuale","steps":[{"t":"Due superfici $\\Sigma_1,\\Sigma_2$ hanno lo STESSO bordo orientato. Per quale campo $F$ il flusso e' uguale attraverso entrambe?","opts":[{"x":"se $\\operatorname{div}F=0$ (campo solenoidale)","c":true},{"x":"sempre, per qualunque $F$"},{"x":"se $\\operatorname{rot}F=0$"}],"hint":"Unisci $\\Sigma_1$ con $\\Sigma_2$ orientata all'incontrario: ottieni una superficie chiusa. Cosa dice Gauss sul solido racchiuso?","sol":"Se $\\operatorname{div}F=0$: $\\Sigma_1\\cup(-\\Sigma_2)$ e' una superficie chiusa e per il Teorema della divergenza il flusso uscente totale e' $\\iiint\\operatorname{div}F\\,dV=0$, da cui $\\Phi(\\Sigma_1)=\\Phi(\\Sigma_2)$. E' l'analogo, per il flusso, del fatto che in Stokes conta solo il bordo."}]},{"pool":"superfici","src":"modus operandi · manuale","steps":[{"t":"Devi calcolare il flusso di $F$ attraverso una singola superficie di rotazione $\\Sigma$ (aperta), con $\\operatorname{div}F$ semplice. Qual e' la strategia piu' efficiente?","opts":[{"x":"tappare $\\Sigma$ con superfici note, applicare Gauss al solido chiuso, poi sottrarre i flussi delle tappe","c":true},{"x":"sempre l'integrale diretto $\\iint_\\Sigma F\\cdot n\\,dS$"},{"x":"applicare Stokes al bordo"}],"hint":"Sulle rotazioni $X_\\theta\\times X_z$ e' spesso pesante; se $\\operatorname{div}F$ e' semplice conviene chiudere e usare il volume.","sol":"Modus operandi: se $\\Sigma$ e' aperta e $\\operatorname{div}F$ e' semplice, la si chiude con superfici note (dischi, piani), si applica il Teorema della divergenza al solido, e $\\Phi(\\Sigma)=\\Phi_{\\text{tot}}-\\Phi_{\\text{tappe}}$. Il calcolo diretto resta corretto ma conviene solo quando $X_u\\times X_v$ e $F$ si semplificano (come nel mantello cilindrico)."}]},{"pool":"superfici","src":"tipo B &middot; modus operandi &middot; manuale","steps":[{"t":"Devi calcolare la circuitazione $\\oint_\\gamma F\\cdot T\\,ds$ dove $\\gamma$ &egrave; l'intersezione del paraboloide $z=x^2+y^2$ col piano $z=2y$. Qual &egrave; il PRIMO passo strategico?","opts":[{"x":"Riconoscere che $\\gamma$ &egrave; il bordo di infinite superfici e scegliere, fra quelle con bordo $\\gamma$, la pi&ugrave; semplice su cui integrare $\\operatorname{rot}F\\cdot n$","c":true},{"x":"Parametrizzare subito il paraboloide $z=x^2+y^2$, che &egrave; la superficie 'naturale' su cui giace $\\gamma$"},{"x":"Concludere che la circuitazione &egrave; nulla perch&eacute; $\\gamma$ &egrave; chiusa"}],"hint":"Il teorema di Stokes lega l'integrale al flusso del rotore su UNA QUALUNQUE superficie con quel bordo: la superficie la scegli tu.","sol":"Teorema di Stokes: $\\oint_{\\partial\\Sigma}F\\cdot T\\,ds=\\iint_\\Sigma\\operatorname{rot}F\\cdot n\\,d\\sigma$ vale per OGNI superficie regolare $\\Sigma$ con $\\partial\\Sigma=\\gamma$. Poich&eacute; il risultato dipende solo dal bordo, si sceglie la superficie che rende $\\operatorname{rot}F\\cdot n$ pi&ugrave; semplice: qui la scelta del paraboloide &egrave; possibile ma non conviene.","cont":"Quale superficie conviene?"},{"t":"L'intersezione $z=x^2+y^2=2y$ d&agrave; $x^2+(y-1)^2=1$ nel piano $z=2y$. Quale superficie conviene per applicare Stokes?","opts":[{"x":"Il disco piano $\\Sigma:\\ z=2y$ con $(x,y)\\in\\{x^2+(y-1)^2\\le1\\}$, in forma cartesiana","c":true},{"x":"La calotta di paraboloide $z=x^2+y^2$ sopra lo stesso disco"},{"x":"La porzione del piano $z=0$ delimitata dalla proiezione di $\\gamma$"}],"hint":"Il piano d&agrave; $z=2y$ lineare e normale costante; il paraboloide infila $z=x^2+y^2$ dentro il rotore. Il piano $z=0$ non ha $\\gamma$ come bordo.","sol":"Il disco e la calotta hanno entrambi bordo $\\gamma$, ma sul piano $z=2y$ la normale $(-f_x,-f_y,1)=(0,-2,1)$ &egrave; costante e la sostituzione $z=2y$ &egrave; lineare: l'integrando resta polinomiale di primo grado, spesso annullato per simmetria sul disco. Criterio: fra le superfici ammissibili si sceglie quella di normale/quota pi&ugrave; semplici. Il piano $z=0$ &egrave; inammissibile perch&eacute; il suo orlo non &egrave; $\\gamma$."}]},{"pool":"superfici","src":"tipo A/H &middot; modus operandi &middot; manuale","steps":[{"t":"Vuoi il flusso uscente di $F$ attraverso la sola superficie laterale $\\Sigma$ del paraboloide $z=x^2+y^2$, $0\\le z\\le4$ (senza il tappo superiore). Perch&eacute; NON puoi applicare direttamente il teorema della divergenza a $\\Sigma$?","opts":[{"x":"Perch&eacute; $\\Sigma$ &egrave; una superficie APERTA: Gauss richiede una superficie chiusa, frontiera di un solido","c":true},{"x":"Perch&eacute; $\\operatorname{div}F$ non &egrave; costante"},{"x":"Perch&eacute; il paraboloide non &egrave; orientabile"}],"hint":"Gauss trasforma un flusso in un integrale di VOLUME: serve un volume, cio&egrave; un bordo chiuso.","sol":"Teorema della divergenza: $\\iint_{\\partial E}F\\cdot n\\,d\\sigma=\\iiint_E\\operatorname{div}F\\,dV$ vale solo se $\\partial E$ &egrave; CHIUSA. La calotta di paraboloide da sola &egrave; aperta (ha per bordo il cerchio $x^2+y^2=4$, $z=4$) e non racchiude alcun volume. L'orientabilit&agrave; c'&egrave;: non &egrave; quello il problema.","cont":"Come procedo?"},{"t":"Come rendi applicabile Gauss al paraboloide aperto $\\Sigma$?","opts":[{"x":"Aggiungo il tappo $\\Sigma_0$: il disco $z=4$, $x^2+y^2\\le4$, con normale uscente $(0,0,1)$; applico Gauss al solido $E$ e poi $\\Phi_\\Sigma=\\Phi_{\\partial E}-\\Phi_{\\Sigma_0}$","c":true},{"x":"Aggiungo il disco $z=4$ con normale $(0,0,-1)$ e sommo i due flussi"},{"x":"Chiudo con il vertice $z=0$, che &egrave; un punto, e applico Gauss"}],"hint":"Il tappo va orientato USCENTE dal solido e alla fine va SOTTRATTO, perch&eacute; non fa parte di $\\Sigma$.","sol":"Si chiude il solido $E=\\{x^2+y^2\\le z\\le4\\}$ col disco superiore $\\Sigma_0$ orientato uscente $(0,0,1)$. Gauss d&agrave; $\\Phi_{\\partial E}=\\iiint_E\\operatorname{div}F\\,dV$; poi $\\Phi_\\Sigma=\\Phi_{\\partial E}-\\Phi_{\\Sigma_0}$. Trappole: normale del tappo verso l'interno (segno sbagliato) oppure dimenticare di sottrarlo. Il vertice &egrave; un punto di misura nulla: non chiude nulla."}]},{"pool":"superfici","src":"tipo B &middot; modus operandi &middot; manuale","steps":[{"t":"Su una superficie $\\Sigma$ orientata con normale $n$, quale regola lega il verso di $n$ all'orientazione del bordo $\\partial\\Sigma$ nel teorema di Stokes?","opts":[{"x":"La regola della mano destra: pollice lungo $n$, le dita danno il verso di percorrenza di $\\partial\\Sigma$","c":true},{"x":"Sono indipendenti: l'orientazione del bordo si sceglie liberamente"},{"x":"Il bordo si percorre sempre in senso antiorario, qualunque sia $n$"}],"hint":"Cambiare il verso di $n$ obbliga a cambiare il verso del bordo, altrimenti Stokes cambia segno.","sol":"Orientazione compatibile (regola della mano destra / vite destrorsa): fissato $n$, $\\partial\\Sigma$ si percorre lasciando la superficie 'a sinistra'. &Egrave; la condizione sotto cui $\\oint_{\\partial\\Sigma}F\\cdot T\\,ds=\\iint_\\Sigma\\operatorname{rot}F\\cdot n\\,d\\sigma$ &egrave; un'uguaglianza esatta e non differisce per un segno.","cont":"Un caso concreto"},{"t":"Una superficie cartesiana $\\Sigma:\\ z=f(x,y)$ &egrave; orientata con normale a TERZA componente NEGATIVA. Come si percorre $\\partial\\Sigma$ visto dall'alto (dall'asse $z$ positivo)?","opts":[{"x":"In senso ORARIO","c":true},{"x":"In senso antiorario"},{"x":"Il verso non &egrave; determinato dal segno della terza componente"}],"hint":"Normale a terza componente positiva ⟷ antiorario; invertire la normale inverte il bordo.","sol":"Con $n$ a terza componente positiva $(-f_x,-f_y,1)$ il bordo &egrave; antiorario visto da $+z$ (mano destra). La normale a terza componente negativa $(f_x,f_y,-1)$ &egrave; l'opposta, quindi il bordo diventa ORARIO. Ignorarlo produce l'errore di segno pi&ugrave; frequente in Stokes."}]},{"pool":"superfici","src":"27giu25 Es.1 &middot; variante &middot; manuale","steps":[{"t":"$\\Sigma$ &egrave; la parte del piano $z=2x+2y+1$ che sta SOPRA il paraboloide $z=x^2+y^2$ (cio&egrave; $2x+2y+1\\ge x^2+y^2$). Determina il dominio $D$ dei parametri $(x,y)$.","opts":[{"x":"$D=\\{(x-1)^2+(y-1)^2\\le3\\}$: disco di centro $(1,1)$ e raggio $\\sqrt3$","c":true},{"x":"$D=\\{x^2+y^2\\le1\\}$: disco centrato nell'origine di raggio $1$"},{"x":"$D=\\{x^2+y^2\\le3\\}$: disco centrato nell'origine di raggio $\\sqrt3$"}],"hint":"Completa i quadrati in $x^2-2x+y^2-2y\\le1$; il centro NON &egrave; l'origine.","sol":"La condizione $2x+2y+1\\ge x^2+y^2$ diventa $x^2-2x+y^2-2y\\le1$, cio&egrave; $(x-1)^2+(y-1)^2\\le3$ (si aggiunge $1+1$ a destra completando i quadrati): disco di centro $(1,1)$ e raggio $\\sqrt3$. Il dominio dei parametri &egrave; la proiezione di $\\Sigma$ sul piano $xy$, non un disco centrato per default: dimenticare la traslazione falsa poi bordo e integrali.","cont":"Elemento d'area"},{"t":"Per $\\Sigma:\\ z=f(x,y)=2x+2y+1$, quanto vale l'elemento d'area $\\sqrt{1+f_x^2+f_y^2}$?","opts":[{"x":"$3$","c":true},{"x":"$\\sqrt5$"},{"x":"$1$"}],"hint":"$f_x=2$, $f_y=2$: vanno ELEVATE AL QUADRATO dentro la radice.","sol":"$f_x=2$, $f_y=2$, quindi $\\sqrt{1+f_x^2+f_y^2}=\\sqrt{1+4+4}=\\sqrt9=3$ (elemento d'area del grafico cartesiano). Il risultato $\\sqrt5$ nasce dal sommare $f_x,f_y$ senza elevarli al quadrato; $1$ dall'ignorare il gradiente.","cont":"Area"},{"t":"Calcola l'area di $\\Sigma$.","opts":[{"x":"$9\\pi$","c":true},{"x":"$3\\pi$"},{"x":"$3\\sqrt3\\,\\pi$"}],"hint":"$A=\\iint_D 3\\,dx\\,dy=3\\cdot m_2(D)$; il disco di raggio $\\sqrt3$ ha area $3\\pi$.","sol":"$A(\\Sigma)=\\iint_D\\sqrt{1+f_x^2+f_y^2}\\,dx\\,dy=3\\iint_D dx\\,dy=3\\cdot m_2(D)$. Il disco ha raggio $\\sqrt3$, area $\\pi(\\sqrt3)^2=3\\pi$, quindi $A=3\\cdot3\\pi=9\\pi$ (formula dell'area di una superficie cartesiana). $3\\pi$ dimentica l'elemento d'area; $3\\sqrt3\\,\\pi$ confonde raggio e area del disco.","cont":"Bordo"},{"t":"Scrivi una parametrizzazione del bordo $\\partial\\Sigma$.","opts":[{"x":"$\\gamma(t)=\\big(1+\\sqrt3\\cos t,\\ 1+\\sqrt3\\sin t,\\ 5+2\\sqrt3(\\cos t+\\sin t)\\big),\\ t\\in[0,2\\pi]$","c":true},{"x":"$\\gamma(t)=\\big(\\sqrt3\\cos t,\\ \\sqrt3\\sin t,\\ 1+2\\sqrt3(\\cos t+\\sin t)\\big),\\ t\\in[0,2\\pi]$"},{"x":"$\\gamma(t)=\\big(1+\\sqrt3\\cos t,\\ 1+\\sqrt3\\sin t,\\ 0\\big),\\ t\\in[0,2\\pi]$"}],"hint":"$\\partial\\Sigma=X(\\partial D)$: prendi il cerchio $\\partial D$ e alzalo con $z=2x+2y+1$.","sol":"$\\partial\\Sigma$ &egrave; l'immagine di $\\partial D$ tramite $X(x,y)=(x,y,2x+2y+1)$. Il cerchio $\\partial D$ &egrave; $(1+\\sqrt3\\cos t,\\,1+\\sqrt3\\sin t)$; sostituendo nella quota: $z=2(1+\\sqrt3\\cos t)+2(1+\\sqrt3\\sin t)+1=5+2\\sqrt3(\\cos t+\\sin t)$. La curva giace su $\\Sigma$: non &egrave; un cerchio piano, e la seconda opzione dimentica la traslazione del centro, la terza mette $z=0$.","cont":"Normale"},{"t":"Scrivi il versore normale a $\\Sigma$ con terza componente positiva.","opts":[{"x":"$n=\\dfrac{(-2,-2,1)}{3}$","c":true},{"x":"$n=\\dfrac{(2,2,-1)}{3}$"},{"x":"$n=\\dfrac{(-2,-2,1)}{\\sqrt5}$"}],"hint":"$n=\\dfrac{(-f_x,-f_y,1)}{\\sqrt{1+f_x^2+f_y^2}}$ e il denominatore vale $3$ (gi&agrave; calcolato).","sol":"$n=\\dfrac{(-f_x,-f_y,1)}{\\sqrt{1+f_x^2+f_y^2}}=\\dfrac{(-2,-2,1)}{3}$, terza componente $1/3>0$. Il vettore $(2,2,-1)/3$ &egrave; l'orientazione opposta (terza componente negativa); il denominatore $\\sqrt5$ &egrave; il valore errato dell'elemento d'area.","cont":"Regolarit&agrave;"},{"t":"$\\Sigma$ &egrave; regolare su tutto $D$?","opts":[{"x":"S&igrave;: &egrave; il grafico di $f\\in C^1$, quindi $X_x\\times X_y=(-f_x,-f_y,1)$ ha terza componente $1$ e non si annulla mai","c":true},{"x":"No: si perde regolarit&agrave; sul bordo $\\partial D$"},{"x":"No: nel centro $(1,1)$ la normale si annulla"}],"hint":"Per un grafico cartesiano $\\|X_x\\times X_y\\|=\\sqrt{1+|\\nabla f|^2}\\ge1$ sempre.","sol":"Una superficie cartesiana $z=f(x,y)$ con $f\\in C^1(D)$ &egrave; automaticamente regolare: $X_x\\times X_y=(-f_x,-f_y,1)$ ha terza componente $1\\neq0$, dunque $\\|X_x\\times X_y\\|\\ge1>0$ ovunque (definizione di superficie regolare: $C^1$, iniettiva, $\\|X_u\\times X_v\\|\\neq0$). Nessun punto singolare, a differenza della parametrizzazione sferica ai poli."}]},{"pool":"superfici","src":"22gen24 Es.4 &middot; variante &middot; manuale","steps":[{"t":"Il segmento $x=1+t,\\ z=t$, $t\\in[0,2]$ nel semipiano $x\\ge0$ viene ruotato di $2\\pi$ attorno all'asse $z$ (tronco di cono). Scrivi la parametrizzazione $X(\\theta,t)$ e i domini.","opts":[{"x":"$X(\\theta,t)=\\big((1+t)\\cos\\theta,\\ (1+t)\\sin\\theta,\\ t\\big)$, $\\theta\\in[0,2\\pi]$, $t\\in[0,2]$","c":true},{"x":"$X(\\theta,t)=\\big((1+t)\\cos\\theta,\\ (1+t)\\sin\\theta,\\ 1+t\\big)$, $\\theta\\in[0,2\\pi]$, $t\\in[0,2]$"},{"x":"$X(\\theta,t)=\\big(\\cos\\theta,\\ \\sin\\theta,\\ t\\big)$, $\\theta\\in[0,2\\pi]$, $t\\in[0,2]$"}],"hint":"Nella rotazione attorno a $z$ la distanza dall'asse &egrave; $\\gamma(t)=x=1+t$ e la quota resta $z=t$.","sol":"Rotazione attorno all'asse $z$: $X(\\theta,t)=(\\gamma(t)\\cos\\theta,\\gamma(t)\\sin\\theta,\\,z(t))$ con raggio $\\gamma(t)=1+t$ e quota $z(t)=t$. Domini: $\\theta\\in[0,2\\pi]$ (giro completo), $t\\in[0,2]$ (estensione del profilo). La seconda opzione mette erroneamente $z=1+t$; la terza ignora il profilo e d&agrave; un cilindro.","cont":"Vettore normale"},{"t":"Calcola $X_\\theta\\times X_t$.","opts":[{"x":"$\\big((1+t)\\cos\\theta,\\ (1+t)\\sin\\theta,\\ -(1+t)\\big)$","c":true},{"x":"$\\big((1+t)\\cos\\theta,\\ (1+t)\\sin\\theta,\\ (1+t)\\big)$"},{"x":"$\\big(-(1+t)\\sin\\theta,\\ (1+t)\\cos\\theta,\\ 0\\big)$"}],"hint":"$X_\\theta=(-(1+t)\\sin\\theta,(1+t)\\cos\\theta,0)$, $X_t=(\\cos\\theta,\\sin\\theta,1)$; fai il determinante.","sol":"Con $X_\\theta=(-(1+t)\\sin\\theta,(1+t)\\cos\\theta,0)$ e $X_t=(\\cos\\theta,\\sin\\theta,1)$ il prodotto vettoriale &egrave; $\\big((1+t)\\cos\\theta,(1+t)\\sin\\theta,-(1+t)\\big)$: coerente con la formula generale $X_\\theta\\times X_t=(\\gamma\\cos\\theta,\\gamma\\sin\\theta,-\\gamma\\gamma')$ con $\\gamma'=1$. La terza opzione &egrave; il solo $X_\\theta$; la seconda sbaglia il segno della terza componente.","cont":"Norma"},{"t":"Quanto vale $\\|X_\\theta\\times X_t\\|$ e come imposti l'area?","opts":[{"x":"$\\|X_\\theta\\times X_t\\|=(1+t)\\sqrt2$; $A=\\displaystyle\\int_0^{2\\pi}\\!\\!\\int_0^2(1+t)\\sqrt2\\,dt\\,d\\theta$","c":true},{"x":"$\\|X_\\theta\\times X_t\\|=(1+t)$; $A=\\displaystyle\\int_0^{2\\pi}\\!\\!\\int_0^2(1+t)\\,dt\\,d\\theta$"},{"x":"$\\|X_\\theta\\times X_t\\|=1+t^2$; $A=\\displaystyle\\int_0^{2\\pi}\\!\\!\\int_0^2(1+t^2)\\,dt\\,d\\theta$"}],"hint":"$\\sqrt{(1+t)^2\\cos^2\\theta+(1+t)^2\\sin^2\\theta+(1+t)^2}=(1+t)\\sqrt2$.","sol":"$\\|X_\\theta\\times X_t\\|=\\sqrt{(1+t)^2(\\cos^2\\theta+\\sin^2\\theta+1)}=(1+t)\\sqrt2$. Quindi $A=\\iint\\|X_\\theta\\times X_t\\|\\,dt\\,d\\theta=\\int_0^{2\\pi}\\!\\int_0^2(1+t)\\sqrt2\\,dt\\,d\\theta$ (formula dell'area per superficie parametrica). Dimenticare il $\\sqrt2$ &egrave; l'errore tipico.","cont":"Calcolo"},{"t":"Completa il calcolo dell'area.","opts":[{"x":"$A=8\\sqrt2\\,\\pi$","c":true},{"x":"$A=4\\sqrt2\\,\\pi$"},{"x":"$A=8\\pi$"}],"hint":"$\\int_0^2(1+t)\\,dt=[t+t^2/2]_0^2=4$; poi $\\times2\\pi\\sqrt2$.","sol":"$\\int_0^2(1+t)\\,dt=\\big[t+\\tfrac{t^2}{2}\\big]_0^2=2+2=4$; l'integrale in $\\theta$ d&agrave; $2\\pi$. Dunque $A=\\sqrt2\\cdot2\\pi\\cdot4=8\\sqrt2\\,\\pi$. $8\\pi$ ha perso il $\\sqrt2$; $4\\sqrt2\\,\\pi$ dimezza l'integrale in $t$.","cont":"Verifica (Guldino)"},{"t":"Verifica l'area con il teorema di Guldino per le superfici di rotazione.","opts":[{"x":"$A=2\\pi\\int_\\gamma x\\,ds$ con $ds=\\sqrt2\\,dt$ e $x=1+t$: $2\\pi\\int_0^2(1+t)\\sqrt2\\,dt=2\\pi\\cdot4\\sqrt2=8\\sqrt2\\,\\pi$. Coincide","c":true},{"x":"$A=2\\pi\\int_0^2 x\\,dt=2\\pi\\cdot4=8\\pi$, diverso: c'&egrave; un errore nel calcolo diretto"},{"x":"Il teorema di Guldino non si applica a un profilo rettilineo"}],"hint":"Nel teorema di Guldino l'elemento &egrave; l'ARCO $ds$ del profilo, non $dt$: qui $ds=\\sqrt{(dx)^2+(dz)^2}=\\sqrt2\\,dt$.","sol":"Guldino (superfici): $A=2\\pi\\int_\\gamma x\\,ds$. Il profilo ha $ds=\\sqrt{(x')^2+(z')^2}\\,dt=\\sqrt{1+1}\\,dt=\\sqrt2\\,dt$ e $x=1+t$, quindi $2\\pi\\int_0^2(1+t)\\sqrt2\\,dt=8\\sqrt2\\,\\pi$: conferma il calcolo diretto. L'errore $8\\pi$ nasce dall'usare $dt$ al posto di $ds$; Guldino vale per qualunque profilo, retto incluso.","cont":"Orientazione"},{"t":"La normale $X_\\theta\\times X_t=\\big((1+t)\\cos\\theta,(1+t)\\sin\\theta,-(1+t)\\big)$ punta verso l'alto o verso il basso, e la superficie &egrave; regolare?","opts":[{"x":"Terza componente $-(1+t)<0$ su $[0,2]$: punta verso il basso; ed &egrave; regolare perch&eacute; $\\|X_\\theta\\times X_t\\|=(1+t)\\sqrt2\\ge\\sqrt2>0$","c":true},{"x":"Punta verso l'alto perch&eacute; il cono si apre salendo"},{"x":"Non &egrave; regolare in $t=0$, dove il raggio si annulla"}],"hint":"Il segno della terza componente si legge direttamente; la regolarit&agrave; richiede solo $\\|X_\\theta\\times X_t\\|\\neq0$.","sol":"La terza componente $-(1+t)$ &egrave; negativa per ogni $t\\in[0,2]$ (dato che $1+t>0$): la normale indotta punta verso il basso; per invertirla si scambia l'ordine in $X_t\\times X_\\theta$. La superficie &egrave; regolare ovunque perch&eacute; $\\|X_\\theta\\times X_t\\|=(1+t)\\sqrt2\\ge\\sqrt2>0$: il raggio $1+t$ non si annulla su $[0,2]$, quindi niente vertice singolare, a differenza di un cono completo che tocca l'asse in $\\gamma=0$."}]},{"pool":"superfici","src":"variante &middot; da MIT 18.02SC &middot; manuale","steps":[{"t":"Una superficie &egrave; data implicitamente da $F(x,y,z)=0$ e, localmente, come grafico $z=g(x,y)$ su una proiezione $D$. Qual &egrave; l'elemento d'area espresso con $\\nabla F$, SENZA esplicitare $g$?","opts":[{"x":"$dS=\\dfrac{\\|\\nabla F\\|}{|\\partial F/\\partial z|}\\,dx\\,dy$","c":true},{"x":"$dS=\\|\\nabla F\\|\\,dx\\,dy$"},{"x":"$dS=\\dfrac{|\\partial F/\\partial z|}{\\|\\nabla F\\|}\\,dx\\,dy$"}],"hint":"Deriva dalla formula cartesiana $\\sqrt{1+g_x^2+g_y^2}$ usando il Dini: $g_x=-F_x/F_z$, $g_y=-F_y/F_z$.","sol":"Dal teorema di Dini $g_x=-F_x/F_z$, $g_y=-F_y/F_z$, quindi $\\sqrt{1+g_x^2+g_y^2}=\\dfrac{\\sqrt{F_x^2+F_y^2+F_z^2}}{|F_z|}=\\dfrac{\\|\\nabla F\\|}{|F_z|}$: elemento d'area per superficie implicita, valido dove $F_z\\neq0$. La versione invertita e quella senza denominatore non hanno le unit&agrave; corrette.","cont":"Applica alla semisfera"},{"t":"Sia $\\Sigma$ la semisfera superiore di $F(x,y,z)=x^2+y^2+z^2-4=0$, $z\\ge0$. Quanto vale $\\|\\nabla F\\|$ SUI punti di $\\Sigma$?","opts":[{"x":"$\\|\\nabla F\\|=2\\sqrt{x^2+y^2+z^2}=4$, perch&eacute; $x^2+y^2+z^2=4$ su $\\Sigma$","c":true},{"x":"$\\|\\nabla F\\|=2\\sqrt{x^2+y^2+z^2}$ e non si semplifica"},{"x":"$\\|\\nabla F\\|=\\sqrt{x^2+y^2+z^2}=2$"}],"hint":"$\\nabla F=(2x,2y,2z)$; sfrutta il vincolo $x^2+y^2+z^2=4$ valido sulla superficie.","sol":"$\\nabla F=(2x,2y,2z)$, $\\|\\nabla F\\|=2\\sqrt{x^2+y^2+z^2}$. Sui punti della sfera vale $x^2+y^2+z^2=4$, dunque $\\|\\nabla F\\|=2\\cdot2=4$ (costante). Sfruttare il vincolo &egrave; il passo chiave; il fattore $2$ non va perso.","cont":"Elemento"},{"t":"Scrivi l'elemento d'area $dS$ in funzione di $(x,y)$.","opts":[{"x":"$dS=\\dfrac{4}{2z}\\,dx\\,dy=\\dfrac{2}{\\sqrt{4-x^2-y^2}}\\,dx\\,dy$","c":true},{"x":"$dS=\\dfrac{4}{2z}\\,dx\\,dy=\\dfrac{2}{4-x^2-y^2}\\,dx\\,dy$"},{"x":"$dS=\\dfrac{2z}{4}\\,dx\\,dy=\\dfrac{\\sqrt{4-x^2-y^2}}{2}\\,dx\\,dy$"}],"hint":"$|F_z|=|2z|=2z$ su $z\\ge0$, e $z=\\sqrt{4-x^2-y^2}$.","sol":"$|F_z|=2z=2\\sqrt{4-x^2-y^2}$ (con $z\\ge0$). Quindi $dS=\\dfrac{\\|\\nabla F\\|}{|F_z|}\\,dx\\,dy=\\dfrac{4}{2\\sqrt{4-x^2-y^2}}\\,dx\\,dy=\\dfrac{2}{\\sqrt{4-x^2-y^2}}\\,dx\\,dy$. La seconda opzione ha perso la radice; la terza ha invertito il rapporto.","cont":"Dominio e caso limite"},{"t":"Su quale dominio $D$ integri, e c'&egrave; un problema al bordo di $D$?","opts":[{"x":"$D=\\{x^2+y^2\\le4\\}$; sul bordo $x^2+y^2=4$ l'integrando diverge ($F_z\\to0$): l'integrale &egrave; improprio ma converge","c":true},{"x":"$D=\\{x^2+y^2\\le4\\}$ e l'integrando &egrave; limitato ovunque"},{"x":"$D=\\{x^2+y^2\\le2\\}$, disco di raggio $2$... cio&egrave; raggio $\\sqrt2$"}],"hint":"La semisfera si proietta sul disco di raggio $2$; all'equatore $z=0$ e la formula con $F_z$ salta.","sol":"La proiezione di $\\Sigma$ &egrave; $D=\\{x^2+y^2\\le4\\}$ (raggio $2$). All'equatore $x^2+y^2=4$ si ha $z=0$, cio&egrave; $F_z=0$: la superficie diventa verticale e l'integrando $\\to\\infty$. L'integrale &egrave; IMPROPRIO ma converge (la singolarit&agrave; $1/\\sqrt{4-\\rho^2}$ &egrave; integrabile). &Egrave; il motivo per cui la formula implicita richiede $F_z\\neq0$ nei punti interni.","cont":"Calcolo"},{"t":"Calcola l'area della semisfera con questo integrale (coordinate polari).","opts":[{"x":"$A=\\displaystyle\\int_0^{2\\pi}\\!\\!\\int_0^2\\frac{2\\rho}{\\sqrt{4-\\rho^2}}\\,d\\rho\\,d\\theta=8\\pi$","c":true},{"x":"$A=4\\pi$"},{"x":"$A=16\\pi$"}],"hint":"$\\int_0^2\\frac{2\\rho}{\\sqrt{4-\\rho^2}}\\,d\\rho=\\big[-2\\sqrt{4-\\rho^2}\\big]_0^2=4$; poi $\\times2\\pi$.","sol":"In polari $dx\\,dy=\\rho\\,d\\rho\\,d\\theta$: $A=\\int_0^{2\\pi}\\!\\int_0^2\\frac{2\\rho}{\\sqrt{4-\\rho^2}}\\,d\\rho\\,d\\theta$. Primitiva $-2\\sqrt{4-\\rho^2}$, da $0$ a $2$ d&agrave; $-2(0)-(-2\\cdot2)=4$; per $2\\pi$: $A=8\\pi$. $16\\pi$ &egrave; la sfera intera; $4\\pi$ perde un fattore.","cont":"Verifica"},{"t":"Il risultato $8\\pi$ &egrave; coerente con la geometria?","opts":[{"x":"S&igrave;: la sfera di raggio $2$ ha area $4\\pi R^2=16\\pi$, la semisfera ne &egrave; met&agrave;, $8\\pi$","c":true},{"x":"No: la semisfera dovrebbe dare $16\\pi$"},{"x":"S&igrave;, ma per caso: la formula con $\\nabla F$ e quella in sferiche danno in generale valori diversi"}],"hint":"$4\\pi R^2$ con $R=2$ &egrave; l'area della sfera intera.","sol":"Area della sfera $=4\\pi R^2=4\\pi\\cdot4=16\\pi$; la semisfera &egrave; esattamente met&agrave;, $8\\pi$. La formula implicita $\\|\\nabla F\\|/|F_z|$ e quella in sferiche $R^2\\sin\\phi$ danno SEMPRE lo stesso valore: sono due parametrizzazioni della stessa superficie, non due approssimazioni."}]},{"pool":"superfici","src":"variante &middot; da Paul's Online &middot; manuale","steps":[{"t":"$\\Sigma$ &egrave; la superficie laterale del cilindro $x^2+y^2=4$, $0\\le z\\le3$. Scrivi la parametrizzazione e i domini.","opts":[{"x":"$X(\\theta,z)=(2\\cos\\theta,\\,2\\sin\\theta,\\,z)$, $\\theta\\in[0,2\\pi]$, $z\\in[0,3]$","c":true},{"x":"$X(\\theta,z)=(\\theta\\cos z,\\,\\theta\\sin z,\\,z)$, $\\theta\\in[0,2]$, $z\\in[0,3]$"},{"x":"$X(\\rho,\\theta)=(\\rho\\cos\\theta,\\,\\rho\\sin\\theta,\\,3)$, $\\rho\\in[0,2]$, $\\theta\\in[0,2\\pi]$"}],"hint":"Sul cilindro il raggio &egrave; FISSO $=2$; i parametri liberi sono l'angolo $\\theta$ e la quota $z$.","sol":"Il cilindro $x^2+y^2=4$ ha raggio costante $2$: $X(\\theta,z)=(2\\cos\\theta,2\\sin\\theta,z)$, $\\theta\\in[0,2\\pi]$, $z\\in[0,3]$. La terza opzione ($z=3$ fissa, $\\rho$ libera) parametrizza il disco-tappo superiore, non la superficie laterale.","cont":"Elemento d'area"},{"t":"Calcola $X_\\theta\\times X_z$ e $\\|X_\\theta\\times X_z\\|$.","opts":[{"x":"$X_\\theta\\times X_z=(2\\cos\\theta,2\\sin\\theta,0)$, norma $2$; quindi $dS=2\\,d\\theta\\,dz$","c":true},{"x":"$X_\\theta\\times X_z=(4\\cos\\theta,4\\sin\\theta,0)$, norma $4$; quindi $dS=4\\,d\\theta\\,dz$"},{"x":"norma $1$; quindi $dS=d\\theta\\,dz$"}],"hint":"$X_\\theta=(-2\\sin\\theta,2\\cos\\theta,0)$, $X_z=(0,0,1)$.","sol":"$X_\\theta=(-2\\sin\\theta,2\\cos\\theta,0)$, $X_z=(0,0,1)$; il prodotto &egrave; $(2\\cos\\theta,2\\sin\\theta,0)$ di norma $\\sqrt{4\\cos^2\\theta+4\\sin^2\\theta}=2$. Dunque $dS=2\\,d\\theta\\,dz$; la normale &egrave; radiale (orizzontale), come atteso per un cilindro. L'errore norma $=4$ nasce dallo scambiare $R$ con $R^2$.","cont":"Area"},{"t":"Calcola l'area laterale.","opts":[{"x":"$12\\pi$","c":true},{"x":"$24\\pi$"},{"x":"$6\\pi$"}],"hint":"$A=\\int_0^{2\\pi}\\!\\int_0^3 2\\,dz\\,d\\theta=2\\pi R h$ con $R=2$, $h=3$.","sol":"$A=\\int_0^{2\\pi}\\!\\int_0^3 2\\,dz\\,d\\theta=2\\cdot2\\pi\\cdot3=12\\pi$, cio&egrave; la formula nota $2\\pi R h=2\\pi\\cdot2\\cdot3=12\\pi$. $24\\pi$ deriva dall'usare $R^2=4$ nell'elemento d'area invece di $R=2$."}]},{"pool":"superfici","src":"variante &middot; da LibreTexts &middot; manuale","steps":[{"t":"$\\Sigma$ &egrave; la calotta della sfera di raggio $3$ con apertura polare $\\phi\\in[0,\\pi/3]$ (attorno al polo nord), $\\theta\\in[0,2\\pi]$. Qual &egrave; l'elemento d'area in coordinate sferiche?","opts":[{"x":"$dS=9\\sin\\phi\\,d\\phi\\,d\\theta$","c":true},{"x":"$dS=9\\,d\\phi\\,d\\theta$"},{"x":"$dS=3\\sin\\phi\\,d\\phi\\,d\\theta$"}],"hint":"$\\|X_\\phi\\times X_\\theta\\|=R^2\\sin\\phi$ con $R=3$.","sol":"Per la sfera di raggio $R$ vale $\\|X_\\phi\\times X_\\theta\\|=R^2\\sin\\phi$; con $R=3$, $dS=9\\sin\\phi\\,d\\phi\\,d\\theta$. Dimenticare $\\sin\\phi$ (il fattore che 'chiude' i paralleli verso il polo) &egrave; l'errore pi&ugrave; comune; usare $R$ al posto di $R^2$ d&agrave; $3\\sin\\phi$.","cont":"Dominio"},{"t":"Qual &egrave; il dominio dei parametri, e perch&eacute; NON &egrave; $\\phi\\in[0,\\pi]$?","opts":[{"x":"$\\phi\\in[0,\\pi/3]$, $\\theta\\in[0,2\\pi]$: $\\phi=\\pi$ coprirebbe l'intera sfera, non la calotta","c":true},{"x":"$\\phi\\in[0,\\pi]$, $\\theta\\in[0,\\pi/3]$: l'apertura &egrave; sull'angolo $\\theta$"},{"x":"$\\phi\\in[\\pi/3,\\pi]$, $\\theta\\in[0,2\\pi]$"}],"hint":"$\\phi$ &egrave; la colatitudine misurata dal polo nord: una calotta piccola ha $\\phi$ piccolo.","sol":"$\\phi$ misura l'angolo dal polo nord: la calotta &egrave; $\\phi\\in[0,\\pi/3]$, $\\theta\\in[0,2\\pi]$ (giro completo in longitudine). Estendere a $\\phi\\in[0,\\pi]$ darebbe tutta la sfera; $\\phi\\in[\\pi/3,\\pi]$ &egrave; la calotta complementare (tutto TRANNE la nostra).","cont":"Area"},{"t":"Calcola l'area della calotta.","opts":[{"x":"$A=2\\pi R^2\\big(1-\\cos\\tfrac{\\pi}{3}\\big)=9\\pi$","c":true},{"x":"$A=2\\pi R^2=18\\pi$"},{"x":"$A=2\\pi R^2\\big(1-\\cos\\tfrac{\\pi}{3}\\big)=\\tfrac{9\\pi}{2}$"}],"hint":"$\\int_0^{\\pi/3}\\sin\\phi\\,d\\phi=1-\\cos\\tfrac{\\pi}{3}=1-\\tfrac12=\\tfrac12$; poi $\\times9\\times2\\pi$.","sol":"$A=\\int_0^{2\\pi}\\!\\int_0^{\\pi/3}9\\sin\\phi\\,d\\phi\\,d\\theta=9\\cdot2\\pi\\cdot[-\\cos\\phi]_0^{\\pi/3}=18\\pi\\,(1-\\tfrac12)=9\\pi$. In generale una calotta ha area $2\\pi R^2(1-\\cos\\phi_0)$: formula utile da riconoscere. $18\\pi$ dimentica il fattore $(1-\\cos\\phi_0)$; $9\\pi/2$ &egrave; un errore aritmetico su $18\\pi\\cdot\\tfrac12$."}]},{"pool":"superfici","src":"14feb25 Es.5 &middot; tipo B &middot; manuale","steps":[{"t":"Per la parametrizzazione sferica $X(\\phi,\\theta)=(R\\sin\\phi\\cos\\theta,R\\sin\\phi\\sin\\theta,R\\cos\\phi)$, dove si annulla $\\|X_\\phi\\times X_\\theta\\|=R^2\\sin\\phi$?","opts":[{"x":"Nei poli $\\phi=0$ e $\\phi=\\pi$","c":true},{"x":"All'equatore $\\phi=\\pi/2$"},{"x":"Mai: $R^2\\sin\\phi>0$ per ogni $\\phi$"}],"hint":"$\\sin\\phi=0$ per $\\phi=0$ e $\\phi=\\pi$; all'equatore $\\sin\\phi=1$ &egrave; massimo.","sol":"$\\|X_\\phi\\times X_\\theta\\|=R^2\\sin\\phi=0$ solo per $\\sin\\phi=0$, cio&egrave; $\\phi=0$ (polo nord) e $\\phi=\\pi$ (polo sud). L&igrave; la parametrizzazione perde regolarit&agrave;: la mappa non &egrave; localmente invertibile, tutti i valori di $\\theta$ collassano nello stesso punto.","cont":"La sfera &egrave; irregolare?"},{"t":"Questo significa che la sfera NON &egrave; una superficie regolare?","opts":[{"x":"No: &egrave; un difetto della PARAMETRIZZAZIONE ai poli, non della superficie; con un'altra carta locale quei punti sono regolari","c":true},{"x":"S&igrave;: la sfera ha due punti singolari, i poli"},{"x":"S&igrave;: qualunque parametrizzazione della sfera degenera nei poli"}],"hint":"La regolarit&agrave; di una superficie &egrave; una propriet&agrave; geometrica: non dipende dalla scelta della carta.","sol":"La sfera &egrave; una superficie regolare (liscia) ovunque: i poli sono singolarit&agrave; delle COORDINATE sferiche, non della sfera. Ruotando la parametrizzazione (spostando i poli altrove) quei punti diventano regolari. Ai fini del calcolo dell'area la degenerazione &egrave; innocua perch&eacute; l'insieme $\\{\\phi=0,\\pi\\}$ ha misura nulla."}]},{"pool":"superfici","src":"tipo B &middot; manuale","steps":[{"t":"Calcola il flusso di $F=(0,0,z)$ attraverso $\\Sigma:\\ z=x+y+2$ su $D=\\{x^2+y^2\\le1\\}$, normale a terza componente positiva. Come imposti $F\\cdot n\\,d\\sigma$?","opts":[{"x":"$F\\cdot n\\,d\\sigma=F\\cdot(-f_x,-f_y,1)\\,dx\\,dy=z\\,dx\\,dy$, e sostituisco $z=x+y+2$","c":true},{"x":"Devo prima normalizzare: $F\\cdot n\\,d\\sigma=\\dfrac{z}{\\sqrt3}\\,dx\\,dy$"},{"x":"$F\\cdot n\\,d\\sigma=z\\sqrt3\\,dx\\,dy$"}],"hint":"Per il flusso si usa il vettore NON normalizzato $(-f_x,-f_y,1)$: il $d\\sigma$ compensa la norma.","sol":"$n\\,d\\sigma=(X_x\\times X_y)\\,dx\\,dy=(-f_x,-f_y,1)\\,dx\\,dy=(-1,-1,1)\\,dx\\,dy$. Con $F=(0,0,z)$ il prodotto scalare &egrave; $z\\,dx\\,dy$. Non si normalizza: $\\|(-f_x,-f_y,1)\\|$ &egrave; gi&agrave; il fattore d'area e si cancella (regola tipo B). Dividere per $\\sqrt3$ &egrave; l'errore classico.","cont":"Calcolo"},{"t":"Completa il calcolo del flusso.","opts":[{"x":"$\\Phi=\\iint_D(x+y+2)\\,dx\\,dy=2\\pi$ (i termini in $x,y$ si annullano per simmetria)","c":true},{"x":"$\\Phi=\\iint_D(x+y+2)\\,dx\\,dy$ con i contributi di $x,y$ non nulli"},{"x":"$\\Phi=0$"}],"hint":"$D$ &egrave; centrato nell'origine: $\\iint_D x=\\iint_D y=0$; resta $2\\cdot\\text{area}(D)$.","sol":"$\\Phi=\\iint_D(x+y+2)\\,dx\\,dy$. Su $D$ centrato in $(0,0)$ le funzioni dispari $x$ e $y$ integrano a zero; resta $2\\iint_D dx\\,dy=2\\cdot\\pi(1)^2=2\\pi$. La simmetria del dominio &egrave; la scorciatoia da riconoscere; $\\Phi=0$ dimentica il termine costante $2$."}]},{"pool":"superfici","src":"variante &middot; da MIT 18.02SC &middot; modus operandi","steps":[{"t":"Due superfici aperte $\\Sigma_1,\\Sigma_2$ hanno lo STESSO bordo orientato $\\gamma$. Per quale propriet&agrave; di $F$ vale $\\iint_{\\Sigma_1}F\\cdot n\\,d\\sigma=\\iint_{\\Sigma_2}F\\cdot n\\,d\\sigma$?","opts":[{"x":"Se $\\operatorname{div}F=0$","c":true},{"x":"Se $\\operatorname{rot}F=0$"},{"x":"Sempre, indipendentemente da $F$"}],"hint":"Insieme, $\\Sigma_1$ e $-\\Sigma_2$ chiudono un volume: chi controlla il flusso attraverso una superficie CHIUSA?","sol":"$\\Sigma_1\\cup(-\\Sigma_2)$ &egrave; una superficie CHIUSA che racchiude un solido $E$. Per il teorema della divergenza $\\Phi_{\\Sigma_1}-\\Phi_{\\Sigma_2}=\\iiint_E\\operatorname{div}F\\,dV$; se $\\operatorname{div}F=0$ i due flussi coincidono. Trappola classica: $\\operatorname{rot}F=0$ &egrave; la condizione per la CIRCUITAZIONE (Stokes / campi conservativi), non per il flusso.","cont":"Uso pratico"},{"t":"Come sfrutti $\\operatorname{div}F=0$ nel calcolo di un flusso attraverso una superficie complicata $\\Sigma$?","opts":[{"x":"Sostituisco $\\Sigma$ con una superficie pi&ugrave; semplice avente lo stesso bordo (es. il disco piano che $\\partial\\Sigma$ delimita) e calcolo l&igrave;","c":true},{"x":"Concludo subito che il flusso &egrave; zero"},{"x":"Applico il teorema di Stokes al campo $F$"}],"hint":"Stesso bordo $+$ $\\operatorname{div}F=0$ ⟹ stesso flusso: scegli la superficie che rende l'integrale banale.","sol":"Con $\\operatorname{div}F=0$ il flusso dipende solo dal bordo: si rimpiazza $\\Sigma$ con la superficie pi&ugrave; comoda con lo stesso $\\partial\\Sigma$ (tipicamente il disco piano). Non &egrave; detto che il flusso sia nullo: lo &egrave; solo se il bordo &egrave; vuoto (superficie chiusa). Stokes riguarda il rotore e la circuitazione, non questo flusso."}]},{"pool":"superfici","src":"tipo B &middot; manuale","steps":[{"t":"Qual &egrave; il bordo $\\partial\\Sigma$ della sfera completa $\\Sigma=\\{x^2+y^2+z^2=R^2\\}$?","opts":[{"x":"&Egrave; vuoto: $\\partial\\Sigma=\\varnothing$ (superficie chiusa)","c":true},{"x":"&Egrave; l'equatore $\\{z=0\\}$"},{"x":"Sono i due poli"}],"hint":"Una superficie chiusa non ha 'orlo': puoi camminarci sopra senza mai cadere da un bordo.","sol":"La sfera intera &egrave; una superficie CHIUSA: non ha bordo, $\\partial\\Sigma=\\varnothing$. L'equatore &egrave; il bordo della SEMISFERA, non della sfera. Conseguenza: per una superficie chiusa Stokes d&agrave; $\\iint_\\Sigma\\operatorname{rot}F\\cdot n\\,d\\sigma=0$ (bordo vuoto).","cont":"E la semisfera?"},{"t":"E il bordo della semisfera superiore $\\{x^2+y^2+z^2=R^2,\\ z\\ge0\\}$?","opts":[{"x":"&Egrave; l'equatore $\\{x^2+y^2=R^2,\\ z=0\\}$, una circonferenza","c":true},{"x":"&Egrave; vuoto, come la sfera"},{"x":"&Egrave; il polo nord"}],"hint":"Tagliando la sfera a met&agrave; compare un orlo circolare.","sol":"La semisfera &egrave; APERTA: il taglio $z=0$ crea l'orlo $\\{x^2+y^2=R^2,\\,z=0\\}$, cio&egrave; l'equatore. Distinguere superficie chiusa (bordo vuoto → Gauss) da aperta (bordo curva → Stokes, oppure 'tappare' per Gauss) &egrave; la prima decisione in ogni esercizio di flusso o circuitazione."}]},{"pool":"superfici","src":"tipo superfici &middot; da Paul &middot; manuale","steps":[{"t":"$\\Sigma$ &egrave; la superficie laterale del paraboloide $z=x^2+y^2$ con $0\\le z\\le 4$, orientata con la normale rivolta verso l'alto ($n_z>0$). Si vuole il flusso di $F=(x,y,z)$. Parametrizzando $\\Sigma$ come grafico $X(x,y)=(x,\\,y,\\,x^2+y^2)$, quanto vale $X_x\\times X_y$?","opts":[{"x":"$(-2x,\\,-2y,\\,1)$","c":true},{"x":"$(2x,\\,2y,\\,1)$"},{"x":"$(-2x,\\,-2y,\\,-1)$"},{"x":"$(x,\\,y,\\,1)$"}],"hint":"$X_x=(1,0,2x)$, $X_y=(0,1,2y)$; la terza componente del prodotto vettoriale &egrave; $1\\cdot 1-0\\cdot 0$.","sol":"Per un grafico $z=f(x,y)$ vale la formula della normale al grafico $X_x\\times X_y=(-f_x,-f_y,1)$. Con $f=x^2+y^2$ si ha $(-2x,-2y,1)$. La terza componente $+1>0$ conferma che questa normale punta verso l'alto, coerente con l'orientazione richiesta."},{"t":"Su quale dominio $D$ del piano si integra, e come si scrive il flusso in termini di $D$?","opts":[{"x":"$D=\\{x^2+y^2\\le 4\\}$, e $\\iint_\\Sigma F\\cdot n\\,dS=\\iint_D F(X)\\cdot(X_x\\times X_y)\\,dx\\,dy$","c":true},{"x":"$D=\\{x^2+y^2\\le 2\\}$, con lo stesso integrale"},{"x":"$D=\\mathbb{R}^2$, e $\\iint_D \\|X_x\\times X_y\\|\\,dx\\,dy$"}],"hint":"La proiezione di $\\Sigma$ sul piano $xy$ si ricava da $0\\le z\\le 4$ e $z=x^2+y^2$; e il flusso NON usa la norma.","sol":"Riduzione del flusso a integrale doppio sul dominio dei parametri: $\\iint_\\Sigma F\\cdot n\\,dS=\\iint_D F(X)\\cdot(X_x\\times X_y)\\,dx\\,dy$. Da $z=x^2+y^2\\le 4$ segue $D=\\{x^2+y^2\\le 4\\}$ (disco di raggio $2$). Si integra $F\\cdot(X_x\\times X_y)$, NON la norma (quella d&agrave; l'area)."},{"t":"Valuta l'integranda $F\\cdot(X_x\\times X_y)$ sostituendo $z=x^2+y^2$.","opts":[{"x":"$-(x^2+y^2)$","c":true},{"x":"$x^2+y^2$"},{"x":"$1-x^2-y^2$"},{"x":"$2(x^2+y^2)+1$"}],"hint":"$F=(x,\\,y,\\,x^2+y^2)$; fai il prodotto scalare con $(-2x,-2y,1)$ e somma.","sol":"$F\\cdot(X_x\\times X_y)=x(-2x)+y(-2y)+(x^2+y^2)(1)=-2x^2-2y^2+x^2+y^2=-(x^2+y^2)$."},{"t":"Calcola $\\displaystyle\\iint_D -(x^2+y^2)\\,dx\\,dy$ in coordinate polari.","opts":[{"x":"$-8\\pi$","c":true},{"x":"$8\\pi$"},{"x":"$-16\\pi$"},{"x":"$-4\\pi$"}],"hint":"$x^2+y^2=r^2$, $dx\\,dy=r\\,dr\\,d\\theta$; $\\int_0^2 r^3\\,dr=\\left[r^4/4\\right]_0^2=4$.","sol":"Cambio di variabile in polari (Jacobiano $r$): $-\\int_0^{2\\pi}\\!\\!\\int_0^2 r^2\\cdot r\\,dr\\,d\\theta=-2\\pi\\left[\\tfrac{r^4}{4}\\right]_0^2=-2\\pi\\cdot 4=-8\\pi$."},{"t":"PERCHE'. Se avessimo scelto la normale OPPOSTA ($n_z<0$, cio&egrave; l'ordine $X_y\\times X_x$), come cambia il flusso, e perch&eacute; l'AREA della stessa $\\Sigma$ NON cambierebbe?","opts":[{"x":"Il flusso cambia segno e diventa $+8\\pi$; l'area resta invariata perch&eacute; usa la norma $\\|X_x\\times X_y\\|\\ge 0$, indipendente dall'orientazione","c":true},{"x":"Cambiano segno entrambi: flusso $+8\\pi$ e area negativa"},{"x":"Non cambia nessuno dei due: sono entrambi scalari"},{"x":"Il flusso resta $-8\\pi$; solo l'area raddoppia"}],"hint":"Il flusso &egrave; un integrale di II specie ($F\\cdot(X_x\\times X_y)$), l'area di I specie ($\\|X_x\\times X_y\\|$): quale dei due porta un segno?","sol":"Qui sta la distinzione fra le due specie. Il flusso $\\iint_D F\\cdot(X_x\\times X_y)\\,dx\\,dy$ &egrave; un integrale di SECONDA specie: dipende dall'orientazione, e invertire l'ordine dei parametri cambia il segno del prodotto vettoriale, quindi il flusso diventa $+8\\pi$. L'area $\\iint_D \\|X_x\\times X_y\\|\\,dx\\,dy$ &egrave; di PRIMA specie: la norma &egrave; $\\ge 0$ e non porta segno, dunque &egrave; indipendente dall'orientazione. E' il perch&eacute; per cui il flusso ha bisogno di un'orientazione scelta e l'area no."},{"t":"Controllo di coerenza del segno: valuta l'integranda in un punto e concludi.","opts":[{"x":"$F\\cdot(X_x\\times X_y)=-(x^2+y^2)\\le 0$ su tutto $D$: l'integranda ha segno costante $\\le 0$, quindi il flusso deve risultare $\\le 0$; $-8\\pi$ &egrave; coerente","c":true},{"x":"L'integranda cambia segno su $D$, quindi il risultato pu&ograve; essere qualsiasi"},{"x":"L'integranda &egrave; positiva, il segno $-8\\pi$ &egrave; un errore"}],"hint":"Ad esempio in $(2,0,4)$: $F=(2,0,4)$, $X_x\\times X_y=(-4,0,1)$, prodotto scalare $=-8+4=-4<0$.","sol":"Monotonia dell'integrale: una funzione a segno costante ha integrale dello stesso segno. Qui $-(x^2+y^2)\\le 0$ ovunque su $D$, quindi il flusso &egrave; necessariamente $\\le 0$: il valore $-8\\pi$ passa il controllo. In $(2,0,4)$ l'integranda vale $-4$, confermando il segno."}]},{"pool":"superfici","src":"tipo superfici &middot; manuale","steps":[{"t":"$\\Sigma$ &egrave; il cono $z=\\sqrt{x^2+y^2}$ con $0\\le z\\le 1$, parametrizzato da $X(r,\\theta)=(r\\cos\\theta,\\,r\\sin\\theta,\\,r)$, $r\\in[0,1]$, $\\theta\\in[0,2\\pi]$. Quali sono $X_r$ e $X_\\theta$?","opts":[{"x":"$X_r=(\\cos\\theta,\\,\\sin\\theta,\\,1)$, $\\ X_\\theta=(-r\\sin\\theta,\\,r\\cos\\theta,\\,0)$","c":true},{"x":"$X_r=(\\cos\\theta,\\,\\sin\\theta,\\,0)$, $\\ X_\\theta=(-r\\sin\\theta,\\,r\\cos\\theta,\\,1)$"},{"x":"$X_r=(-\\sin\\theta,\\,\\cos\\theta,\\,1)$, $\\ X_\\theta=(\\cos\\theta,\\,\\sin\\theta,\\,0)$"}],"hint":"Deriva componente per componente: $\\partial_r$ tiene $\\theta$ fisso, $\\partial_\\theta$ tiene $r$ fisso; la quota &egrave; $z=r$.","sol":"Derivate parziali della parametrizzazione: $X_r=(\\cos\\theta,\\sin\\theta,1)$ (la quota $z=r$ d&agrave; il $+1$), $X_\\theta=(-r\\sin\\theta,r\\cos\\theta,0)$ (la quota non dipende da $\\theta$)."},{"t":"Calcola $X_r\\times X_\\theta$ e la sua norma.","opts":[{"x":"$X_r\\times X_\\theta=(-r\\cos\\theta,\\,-r\\sin\\theta,\\,r)$, norma $r\\sqrt{2}$","c":true},{"x":"$(-r\\cos\\theta,\\,-r\\sin\\theta,\\,r)$, norma $r$"},{"x":"$(r\\cos\\theta,\\,r\\sin\\theta,\\,r)$, norma $r\\sqrt{2}$"},{"x":"$(0,0,r)$, norma $r$"}],"hint":"La componente $k$ &egrave; $\\cos\\theta\\cdot r\\cos\\theta-\\sin\\theta\\cdot(-r\\sin\\theta)=r$; poi $\\sqrt{r^2\\cos^2\\theta+r^2\\sin^2\\theta+r^2}$.","sol":"$X_r\\times X_\\theta=(-r\\cos\\theta,-r\\sin\\theta,r)$; norma $=\\sqrt{r^2\\cos^2\\theta+r^2\\sin^2\\theta+r^2}=\\sqrt{2r^2}=r\\sqrt{2}$."},{"t":"In quale punto del dominio dei parametri la parametrizzazione NON &egrave; regolare?","opts":[{"x":"In $r=0$ (il vertice del cono): l&igrave; $X_r\\times X_\\theta=\\mathbf 0$ (la norma $r\\sqrt2$ si annulla) e i vettori tangenti non generano un piano","c":true},{"x":"In $\\theta=0$, dove la parametrizzazione si richiude"},{"x":"Ovunque, perch&eacute; il cono non &egrave; liscio"},{"x":"Mai: la parametrizzazione &egrave; regolare in tutto $[0,1]\\times[0,2\\pi]$"}],"hint":"Condizione di regolarit&agrave;: $X_r\\times X_\\theta\\ne\\mathbf 0$; dove si annulla $r\\sqrt2$?","sol":"Definizione di regolarit&agrave;: $X$ &egrave; regolare in un punto se $X_r\\times X_\\theta\\ne\\mathbf 0$. Qui la norma vale $r\\sqrt2$, che si annulla per $r=0$: nel vertice i due vettori tangenti degenerano e non esiste piano tangente. La singolarit&agrave; della PARAMETRIZZAZIONE nel vertice riflette lo spigolo geometrico del cono."},{"t":"PERCHE'. La parametrizzazione &egrave; singolare nel vertice: perch&eacute; l'area $\\iint_D r\\sqrt2\\,dr\\,d\\theta$ ha comunque valore finito e ben definito?","opts":[{"x":"Perch&eacute; l'insieme dei punti non regolari &egrave; $\\{r=0\\}$, di misura (bidimensionale) nulla nel dominio dei parametri, e un integrale non cambia se si modifica l'integranda su un insieme di misura nulla; inoltre $r\\sqrt2$ &egrave; continua e limitata su $[0,1]\\times[0,2\\pi]$","c":true},{"x":"Perch&eacute; il cono in realt&agrave; non ha un vertice"},{"x":"Perch&eacute; nel vertice si pone per convenzione $dS=0$ e si ignora il problema"},{"x":"Perch&eacute; l'integranda diverge, ma la divergenza si compensa"}],"hint":"Che 'dimensione' ha l'insieme $\\{r=0\\}$ dentro il rettangolo $[0,1]\\times[0,2\\pi]$? E l'integranda $r\\sqrt2$ &egrave; limitata l&igrave; vicino?","sol":"Il valore di un integrale non cambia se l'integranda viene modificata (o &egrave; indefinita) su un insieme di misura nulla. L'insieme dei parametri non regolari &egrave; $\\{r=0\\}$, un segmento sul bordo di $D$, di misura di Lebesgue bidimensionale nulla. Inoltre $r\\sqrt2$ &egrave; continua e limitata, quindi l'integrale esiste finito. E' esattamente il perch&eacute; per cui coni (vertice) e sfere (poli) hanno area ben definita nonostante la parametrizzazione sia singolare in quei punti: si perde tempo all'esame a temere una singolarit&agrave; che non contribuisce."},{"t":"Calcola l'area del cono.","opts":[{"x":"$\\sqrt{2}\\,\\pi$","c":true},{"x":"$2\\sqrt{2}\\,\\pi$"},{"x":"$\\pi$"},{"x":"$\\dfrac{\\sqrt2}{2}\\,\\pi$"}],"hint":"$\\int_0^{2\\pi}d\\theta=2\\pi$, $\\int_0^1 r\\,dr=\\tfrac12$; moltiplica per $\\sqrt2$.","sol":"$\\text{Area}=\\iint_D \\|X_r\\times X_\\theta\\|\\,dr\\,d\\theta=\\sqrt2\\int_0^{2\\pi}\\!\\!\\int_0^1 r\\,dr\\,d\\theta=\\sqrt2\\cdot 2\\pi\\cdot\\tfrac12=\\sqrt2\\,\\pi$."},{"t":"Verifica indipendente con la formula elementare del cono.","opts":[{"x":"Coincide con $\\pi R\\ell$ (area laterale, $R$ raggio di base, $\\ell$ apotema): $R=1$, $\\ell=\\sqrt{1^2+1^2}=\\sqrt2$, quindi $\\pi\\cdot 1\\cdot\\sqrt2=\\sqrt2\\,\\pi$","c":true},{"x":"Coincide con $\\pi R^2=\\pi$ (area del disco di base)"},{"x":"Coincide con $2\\pi R h=2\\pi$ (area laterale del cilindro)"}],"hint":"L'apotema &egrave; l'ipotenusa del triangolo di cateti $R=1$ (raggio) e $h=1$ (altezza).","sol":"Area laterale del cono $A=\\pi R\\ell$ con $\\ell$ apotema. Con base $z=1$: raggio $R=1$, altezza $h=1$, apotema $\\ell=\\sqrt{R^2+h^2}=\\sqrt2$, quindi $A=\\pi\\cdot1\\cdot\\sqrt2=\\sqrt2\\,\\pi$. Coincide col conto per integrale: verifica superata."}]}],"curve":[{"pool":"curve","src":"20220124 Es.4","steps":[{"t":"La curva $\\gamma=\\{x^2+y^2=4,\\ z=x+3y+4\\}$. Una parametrizzazione corretta è:","opts":[{"x":"$(2\\cos t,\\,2\\sin t,\\,2\\cos t+6\\sin t+4)$, $t\\in[0,2\\pi]$","c":true},{"x":"$(\\cos t,\\,\\sin t,\\,\\cos t+3\\sin t+4)$"},{"x":"$(2\\cos t,\\,2\\sin t,\\,4)$"},{"x":"$(t,\\,t,\\,2t+4)$"}],"hint":"Dal cilindro $x^2+y^2=4$ prendi $x=2\\cos t$, $y=2\\sin t$ (raggio $2$), poi sostituisci nel piano per $z$.","sol":"$x=2\\cos t$, $y=2\\sin t$ soddisfa $x^2+y^2=4$; nel piano $z=x+3y+4=2\\cos t+6\\sin t+4$. Il raggio è $2$, non $1$: usarne $1$ è l'errore tipico.","cont":"Continua &rarr; la regolarità"},{"t":"La stessa $\\gamma$ è regolare su $(0,2\\pi)$?","opts":[{"x":"Sì: $\\|\\gamma'\\|^2\\ge (x')^2+(y')^2=4>0$","c":true},{"x":"No, si annulla in $t=\\pi$"},{"x":"No, non è semplice"},{"x":"Serve calcolare l'intero $\\|\\gamma'\\|^2$ per concludere"}],"hint":"Basta una minorazione: $\\|\\gamma'\\|^2\\ge (x')^2+(y')^2=4\\sin^2 t+4\\cos^2 t=4$, senza toccare $z'$.","sol":"$\\gamma'=(-2\\sin t,\\,2\\cos t,\\,\\ldots)$; già le prime due componenti danno $\\|\\gamma'\\|^2\\ge 4>0$. Vettore tangente mai nullo $\\Rightarrow$ curva regolare (definizione)."}]},{"pool":"curve","src":"tipo curve · manuale","steps":[{"t":"Nell'integrale di PRIMA specie $\\int_\\gamma f\\,ds$, l'elemento d'arco è:","opts":[{"x":"$ds=\\|\\gamma'(t)\\|\\,dt$","c":true},{"x":"$ds=\\gamma'(t)\\,dt$ (vettoriale)"},{"x":"$ds=dt$"},{"x":"$ds=\\|\\gamma(t)\\|\\,dt$"}],"hint":"$ds$ è uno SCALARE positivo: la NORMA del vettore velocità per $dt$, non il vettore velocità.","sol":"L'ascissa curvilinea è $s(t)=\\int_a^t\\|\\gamma'(\\tau)\\|\\,d\\tau$, quindi $ds=\\|\\gamma'(t)\\|\\,dt$: indipendente dall'orientazione (la norma è positiva)."}]},{"pool":"curve","src":"tipo curve · lavoro","steps":[{"t":"Il lavoro $\\int_\\gamma F\\cdot d\\ell$ (integrale di SECONDA specie) come cambia se inverti il verso di percorrenza di $\\gamma$?","opts":[{"x":"cambia SEGNO","c":true},{"x":"resta invariato"},{"x":"cambia solo se $F$ non è conservativo"},{"x":"si annulla"}],"hint":"$d\\ell=\\gamma'(t)\\,dt$ è VETTORIALE: invertire l'orientazione manda $\\gamma'\\to-\\gamma'$.","sol":"L'integrale di seconda specie è ORIENTATO: $\\int_{-\\gamma}F\\cdot d\\ell=-\\int_{\\gamma}F\\cdot d\\ell$, perché il versore tangente cambia verso. (Quello di prima specie, con $ds$, resta invariato.)"}]},{"pool":"curve","src":"tipo curve · trabocchetto orientazione","steps":[{"t":"L'integrale di PRIMA specie $\\int_\\gamma f\\,ds$ dipende dal verso di percorrenza?","opts":[{"x":"No: $ds=\\|\\gamma'\\|\\,dt>0$ è indipendente dall'orientazione","c":true},{"x":"Sì, cambia segno come il lavoro"},{"x":"Sì, solo se $f<0$"},{"x":"Dipende dalla parametrizzazione scelta"}],"hint":"Distingui: l'elemento d'arco $ds$ usa la NORMA (sempre positiva); solo l'integrale di SECONDA specie è orientato.","sol":"$ds=\\|\\gamma'\\|\\,dt$ non cambia segno invertendo l'orientazione né riparametrizzando, quindi $\\int_\\gamma f\\,ds$ è invariante (misura massa/lunghezza). Confonderlo col lavoro è la trappola."}]},{"pool":"curve","src":"20220706 Es.4","steps":[{"t":"Per $\\gamma(t)=(\\cos t,\\,\\sin t,\\,4\\cos t+\\sin t+1)$, l'argomento standard di regolarità è:","opts":[{"x":"$(x',y')=(-\\sin t,\\cos t)\\ne(0,0)$ perché seno e coseno non si annullano insieme","c":true},{"x":"$z'(t)\\ne 0$ per ogni $t$"},{"x":"è un cerchio, quindi regolare per definizione"},{"x":"$\\|\\gamma(t)\\|$ è costante"}],"hint":"Basta che le prime due componenti di $\\gamma'$ non siano simultaneamente nulle: $\\sin^2 t+\\cos^2 t=1$.","sol":"$\\gamma'=(-\\sin t,\\cos t,-4\\sin t+\\cos t)$; già $(-\\sin t,\\cos t)$ ha norma $1\\ne 0$, quindi $\\gamma'\\ne 0$ e la curva è regolare. $z'$ può annullarsi senza comprometterla."}]},{"pool":"curve","src":"tipo curve · trabocchetto semplicità","steps":[{"t":"La mappa $t\\mapsto(\\cos t,\\sin t)$ è semplice (iniettiva) su quale insieme?","opts":[{"x":"$[0,2\\pi)$ ma non su $[0,2\\pi]$ (gli estremi coincidono)","c":true},{"x":"tutto $\\mathbb{R}$"},{"x":"nessun intervallo"},{"x":"solo $[0,\\pi]$"}],"hint":"Per una curva CHIUSA la semplicità si richiede sull'intervallo semiaperto: gli estremi $0$ e $2\\pi$ danno lo stesso punto.","sol":"$(\\cos 0,\\sin 0)=(\\cos 2\\pi,\\sin 2\\pi)$: su $[0,2\\pi]$ la mappa non è iniettiva; su $[0,2\\pi)$ sì. È la definizione corretta di curva chiusa semplice."}]},{"pool":"curve","src":"20230210 Es.3","steps":[{"t":"Se $F=\\nabla U$ è conservativo e $\\gamma$ va da $A$ a $B$, il lavoro $\\int_\\gamma F\\cdot d\\ell$ vale:","opts":[{"x":"$U(B)-U(A)$, indipendente dal cammino","c":true},{"x":"$U(A)-U(B)$"},{"x":"$0$ sempre"},{"x":"il flusso del rotore attraverso $\\gamma$"}],"hint":"Teorema fondamentale per campi conservativi: dipende solo dagli estremi, nell'ordine finale meno iniziale.","sol":"$\\int_\\gamma \\nabla U\\cdot d\\ell=U(\\gamma(b))-U(\\gamma(a))=U(B)-U(A)$. Su curva chiusa ($A=B$) dà $0$. L'ordine è finale meno iniziale: invertirlo cambia segno (distrattore)."}]},{"pool":"curve","src":"tipo curve · riparametrizzazione","steps":[{"t":"L'integrale di seconda specie $\\int_\\gamma F\\cdot d\\ell$ come dipende dalla parametrizzazione della curva?","opts":[{"x":"È invariante per riparametrizzazioni che PRESERVANO l'orientazione; cambia solo di segno se l'orientazione si inverte","c":true},{"x":"Dipende dalla velocità di percorrenza scelta"},{"x":"Dipende dal dominio $[a,b]$ del parametro"},{"x":"È sempre lo stesso, anche invertendo il verso"}],"hint":"Riparametrizzare significa comporre con un cambio di variabile monotono: se crescente conserva il verso, se decrescente lo inverte.","sol":"Per il teorema di invarianza dell'integrale di linea, $\\int_\\gamma F\\cdot d\\ell$ non cambia sotto riparametrizzazioni $C^1$ con derivata positiva (stesso verso); una riparametrizzazione con derivata negativa inverte l'orientazione e cambia il segno. La velocità di percorrenza è irrilevante: contano solo il sostegno e il verso."}]},{"pool":"curve","src":"tipo curve · manuale (I specie)","steps":[{"t":"Calcola la lunghezza dell'elica $\\gamma(t)=(\\cos t,\\ \\sin t,\\ t)$, $t\\in[0,2\\pi]$, cioè $\\int_\\gamma 1\\,ds$.","opts":[{"x":"$2\\sqrt{2}\\,\\pi$","c":true},{"x":"$2\\pi$"},{"x":"$\\sqrt{2}\\,\\pi$"},{"x":"$4\\pi$"}],"hint":"$ds=\\|\\gamma'(t)\\|\\,dt$: includi anche la componente $z'=1$, non solo le due del cerchio.","sol":"Imposta $\\gamma'=(-\\sin t,\\cos t,1)$, da cui $\\|\\gamma'\\|=\\sqrt{\\sin^2 t+\\cos^2 t+1}=\\sqrt{2}$ (costante). Allora $L=\\int_\\gamma ds=\\int_0^{2\\pi}\\sqrt{2}\\,dt=2\\sqrt{2}\\,\\pi$. Definizione: $ds=\\|\\gamma'\\|\\,dt$. Dimenticare $z'$ dà $\\|\\gamma'\\|=1$ e il valore errato $2\\pi$."}]},{"pool":"curve","src":"tipo curve · manuale (I specie)","steps":[{"t":"Calcola $\\int_\\gamma x\\,ds$ sul quarto di circonferenza $\\gamma(t)=(2\\cos t,\\ 2\\sin t)$, $t\\in[0,\\pi/2]$.","opts":[{"x":"$4$","c":true},{"x":"$2$"},{"x":"$8$"},{"x":"$4\\pi$"}],"hint":"$ds=\\|\\gamma'\\|\\,dt$ con $\\|\\gamma'\\|=2$ (raggio $2$), non $dt$. Sostituisci anche $x=2\\cos t$ nell'integranda.","sol":"Passi: $\\gamma'=(-2\\sin t,2\\cos t)$, $\\|\\gamma'\\|=2$; $x=2\\cos t$. Quindi $\\int_\\gamma x\\,ds=\\int_0^{\\pi/2}(2\\cos t)\\cdot 2\\,dt=4\\int_0^{\\pi/2}\\cos t\\,dt=4[\\sin t]_0^{\\pi/2}=4$. Formula dell'integrale di I specie $\\int_\\gamma f\\,ds=\\int_a^b f(\\gamma(t))\\|\\gamma'(t)\\|\\,dt$. Omettere il fattore $\\|\\gamma'\\|=2$ dà l'errore $2$."}]},{"pool":"curve","src":"tipo curve · lavoro (II specie)","steps":[{"t":"Calcola il lavoro $\\int_\\gamma F\\cdot d\\ell$ del campo $F=(-y,\\ x)$ lungo la circonferenza unitaria $\\gamma(t)=(\\cos t,\\sin t)$, $t\\in[0,2\\pi]$ (verso antiorario).","opts":[{"x":"$2\\pi$","c":true},{"x":"$0$"},{"x":"$-2\\pi$"},{"x":"$\\pi$"}],"hint":"Scrivi $d\\ell=\\gamma'(t)\\,dt$ e valuta $F$ SU $\\gamma(t)$: $F(\\gamma)=(-\\sin t,\\cos t)$.","sol":"Passi: $\\gamma'=(-\\sin t,\\cos t)$ e $F(\\gamma)=(-\\sin t,\\cos t)$, quindi $F\\cdot\\gamma'=\\sin^2 t+\\cos^2 t=1$. $\\int_\\gamma F\\cdot d\\ell=\\int_0^{2\\pi}1\\,dt=2\\pi$. Il campo $(-y,x)$ non è conservativo (il suo rotore vale $2$): il lavoro su un giro chiuso non è nullo. Invertire il verso darebbe $-2\\pi$."}]},{"pool":"curve","src":"tipo curve · lavoro (II specie)","steps":[{"t":"Calcola $\\int_\\gamma F\\cdot d\\ell$ con $F=(x^2,\\ xy)$ lungo l'arco di parabola $\\gamma(t)=(t,\\ t^2)$, $t\\in[0,1]$.","opts":[{"x":"$\\dfrac{11}{15}$","c":true},{"x":"$\\dfrac{1}{3}$"},{"x":"$\\dfrac{2}{5}$"},{"x":"$\\dfrac{13}{15}$"}],"hint":"$d\\ell=(1,\\ 2t)\\,dt$: la seconda componente porta un fattore $2t$ da non dimenticare. Sostituisci $x=t$, $y=t^2$.","sol":"Passi: $\\gamma'=(1,2t)$; $F(\\gamma)=(t^2,\\ t\\cdot t^2)=(t^2,t^3)$. Allora $F\\cdot\\gamma'=t^2+2t\\cdot t^3=t^2+2t^4$ e $\\int_0^1(t^2+2t^4)\\,dt=\\tfrac13+\\tfrac25=\\tfrac{11}{15}$. Definizione di II specie: $\\int_\\gamma F\\cdot d\\ell=\\int_a^b F(\\gamma)\\cdot\\gamma'\\,dt$. Tralasciare il secondo addendo (il contributo $2t\\,dy$) dà $\\tfrac13$."}]},{"pool":"curve","src":"tipo curve · ascissa curvilinea","steps":[{"t":"Per $\\gamma(t)=(3\\cos t,\\ 3\\sin t)$, $t\\in[0,2\\pi]$, l'ascissa curvilinea $s(t)=\\int_0^t\\|\\gamma'(\\tau)\\|\\,d\\tau$ vale:","opts":[{"x":"$s(t)=3t$","c":true},{"x":"$s(t)=t$"},{"x":"$s(t)=9t$"},{"x":"$s(t)=\\tfrac{3}{2}t^2$"}],"hint":"$\\|\\gamma'\\|$ è costante per un cerchio di raggio $3$: vale $3$, non $1$.","sol":"$\\gamma'=(-3\\sin t,3\\cos t)$, $\\|\\gamma'\\|=\\sqrt{9\\sin^2 t+9\\cos^2 t}=3$. Quindi $s(t)=\\int_0^t 3\\,d\\tau=3t$; la lunghezza totale è $s(2\\pi)=6\\pi$ (circonferenza di raggio $3$).","cont":"Continua &rarr; la riparametrizzazione"},{"t":"Riparametrizzando $\\gamma$ con l'ascissa curvilinea (velocità unitaria), quale mappa $\\tilde\\gamma(s)$ si ottiene, $s\\in[0,6\\pi]$?","opts":[{"x":"$\\tilde\\gamma(s)=(3\\cos(s/3),\\ 3\\sin(s/3))$","c":true},{"x":"$\\tilde\\gamma(s)=(3\\cos(3s),\\ 3\\sin(3s))$"},{"x":"$\\tilde\\gamma(s)=(3\\cos s,\\ 3\\sin s)$"},{"x":"$\\tilde\\gamma(s)=(\\cos(s/3),\\ \\sin(s/3))$"}],"hint":"Da $s=3t$ ricava $t=s/3$ e sostituisci. Controlla poi che $\\|\\tilde\\gamma'(s)\\|=1$.","sol":"Invertendo $s=3t$ si ottiene $t=s/3$: $\\tilde\\gamma(s)=\\gamma(s/3)=(3\\cos(s/3),3\\sin(s/3))$. Verifica: $\\tilde\\gamma'=(-\\sin(s/3),\\cos(s/3))$, $\\|\\tilde\\gamma'\\|=1$. La riparametrizzazione per ascissa curvilinea dà sempre velocità unitaria (il raggio $3$ resta: gli estremi cambiano)."}]},{"pool":"curve","src":"tipo curve · coordinate polari","steps":[{"t":"In coordinate polari, la curva $r=2\\cos\\theta$, $\\theta\\in[-\\pi/2,\\pi/2]$. La sua lunghezza, con $ds=\\sqrt{r^2+(dr/d\\theta)^2}\\,d\\theta$, vale:","opts":[{"x":"$2\\pi$","c":true},{"x":"$4\\pi$"},{"x":"$\\pi$"},{"x":"$2$"}],"hint":"Calcola $r'=-2\\sin\\theta$ e semplifica $r^2+r'^2$: la curva è in realtà una circonferenza di raggio $1$.","sol":"Passi: $r'=-2\\sin\\theta$, quindi $r^2+r'^2=4\\cos^2\\theta+4\\sin^2\\theta=4$ e $ds=\\sqrt{4}\\,d\\theta=2\\,d\\theta$. $L=\\int_{-\\pi/2}^{\\pi/2}2\\,d\\theta=2\\pi$. Coerente col fatto che $r=2\\cos\\theta$ è la circonferenza di centro $(1,0)$ e raggio $1$, lunghezza $2\\pi$. Usare $ds=r\\,d\\theta$ (formula dell'area, non della lunghezza) è l'errore."}]},{"pool":"curve","src":"tipo curve · orientazione (calcolo)","steps":[{"t":"Calcola il lavoro di $F=(-y,\\ x)$ lungo la semicirconferenza superiore di raggio $1$ percorsa da $(-1,0)$ a $(1,0)$ (verso ORARIO).","opts":[{"x":"$-\\pi$","c":true},{"x":"$\\pi$"},{"x":"$2\\pi$"},{"x":"$0$"}],"hint":"Il verso richiesto va da $(-1,0)$ a $(1,0)$ sull'arco superiore: parametrizza con $t$ da $\\pi$ a $0$, oppure calcola il verso antiorario e cambia segno.","sol":"Su $\\gamma(t)=(\\cos t,\\sin t)$ vale $F\\cdot\\gamma'=1$. Il verso antiorario ($t:0\\to\\pi$, da $(1,0)$ a $(-1,0)$) dà $\\int_0^{\\pi}1\\,dt=+\\pi$. Il verso RICHIESTO è opposto, quindi $\\int_{-\\gamma}F\\cdot d\\ell=-\\pi$: l'integrale di II specie è orientato. Ignorare il verso è l'errore che porta a $+\\pi$."}]},{"pool":"curve","src":"tipo curve · conservativo (scorciatoia)","steps":[{"t":"Calcola $\\int_\\gamma F\\cdot d\\ell$ con $F=(2xy+1,\\ x^2)$ lungo un cammino qualsiasi da $(0,0)$ a $(2,1)$ (ad es. l'arco $\\gamma(t)=(2t,\\ t^2)$, $t\\in[0,1]$).","opts":[{"x":"$6$","c":true},{"x":"$4$"},{"x":"$8$"},{"x":"$0$"}],"hint":"Verifica $\\partial_y F_1=\\partial_x F_2$: se il campo è conservativo, non serve integrare lungo l'arco, basta il potenziale valutato agli estremi.","sol":"Passi: $\\partial_y F_1=2x=\\partial_x F_2$, quindi su $\\mathbb{R}^2$ (semplicemente connesso) $F$ è conservativo. Potenziale: da $U_x=2xy+1$ segue $U=x^2y+x+c(y)$, e $U_y=x^2$ impone $c'=0$, dunque $U=x^2y+x$. Per il teorema fondamentale degli integrali di linea $\\int_\\gamma F\\cdot d\\ell=U(2,1)-U(0,0)=(4+2)-0=6$, indipendente dal cammino. Dimenticare il termine $+x$ del potenziale dà $4$."}]},{"pool":"curve","src":"tipo curve · manuale (indipendenza dal cammino)","steps":[{"t":"Per un campo $F\\in C^0$ su un aperto CONNESSO $\\Omega$, quali affermazioni sono EQUIVALENTI?","opts":[{"x":"$F$ è conservativo $\\iff$ $\\int_\\gamma F\\cdot d\\ell$ dipende solo dagli estremi $\\iff$ $\\oint_\\gamma F\\cdot d\\ell=0$ su ogni curva chiusa in $\\Omega$","c":true},{"x":"$F$ è conservativo $\\iff$ $\\operatorname{div}F=0$"},{"x":"l'indipendenza dal cammino vale per ogni campo irrotazionale, senza ipotesi sul dominio"},{"x":"$\\int_\\gamma F\\cdot d\\ell$ dipende solo dagli estremi $\\iff$ $\\|\\gamma'\\|$ è costante"}],"hint":"Esistenza del potenziale, indipendenza dal cammino e circuitazione nulla su OGNI ciclo sono la stessa proprietà. L'irrotazionalità è solo necessaria: diventa sufficiente col dominio semplicemente connesso.","sol":"Teorema di caratterizzazione dei campi conservativi: su $\\Omega$ connesso le tre condizioni sono equivalenti, perché $\\oint_\\gamma F\\cdot d\\ell$ su un cammino chiuso $=U(A)-U(A)=0$, e viceversa la circuitazione nulla permette di definire $U(P)=\\int_{P_0}^{P}F\\cdot d\\ell$ senza ambiguità. $\\operatorname{div}F=0$ (solenoidale) è tutt'altra proprietà; $\\operatorname{rot}F=0$ (irrotazionale) basta solo se $\\Omega$ è semplicemente connesso."}]},{"pool":"curve","src":"tipo curve · manuale (regolare a tratti)","steps":[{"t":"Una curva è REGOLARE A TRATTI se:","opts":[{"x":"$[a,b]$ si partiziona in un numero finito di sottointervalli su ciascuno dei quali $\\gamma$ è $C^1$ e $\\gamma'\\ne 0$; nei punti di raccordo $\\gamma'$ può saltare","c":true},{"x":"$\\gamma$ è $C^1$ su tutto $[a,b]$ e $\\gamma'\\ne 0$ ovunque"},{"x":"$\\gamma$ è continua ma mai derivabile"},{"x":"$\\gamma$ ha punti di non regolarità in cui $\\gamma$ stessa è discontinua"}],"hint":"Regolare a tratti = incollamento CONTINUO di archi regolari; nei vertici (es. di una spezzata) il versore tangente può cambiare bruscamente, ma la curva resta continua.","sol":"Definizione: $\\gamma$ continua su $[a,b]$ e $C^1$ con $\\gamma'\\ne 0$ su ciascun sottointervallo di una partizione finita. Gli integrali di linea si calcolano spezzando: $\\int_\\gamma=\\sum_i\\int_{\\gamma_i}$ sui singoli archi. La prima opzione senza salti descrive una curva regolare (più forte)."}]},{"pool":"curve","src":"tipo curve · manuale (lunghezza e ascissa)","steps":[{"t":"Per $\\gamma:[a,b]\\to\\mathbb{R}^n$ regolare, che relazione lega la lunghezza $L$ e l'ascissa curvilinea $s(t)=\\int_a^t\\|\\gamma'(\\tau)\\|\\,d\\tau$?","opts":[{"x":"$s'(t)=\\|\\gamma'(t)\\|$ e $L=s(b)=\\int_a^b\\|\\gamma'\\|\\,dt$; riparametrizzando in $s$ la velocità diventa unitaria","c":true},{"x":"$s'(t)=\\gamma'(t)$ e $L=\\gamma(b)-\\gamma(a)$"},{"x":"$L=s(b)-s(a)$ con $s(a)\\ne 0$ in generale"},{"x":"$s(t)=\\|\\gamma(t)\\|$, cioè la distanza dall'origine"}],"hint":"$s(t)$ è l'integrale della norma della velocità: per il teorema fondamentale del calcolo la sua derivata è la velocità scalare, e $s(a)=0$.","sol":"Per il teorema fondamentale del calcolo $s'(t)=\\|\\gamma'(t)\\|\\ge 0$, quindi $s$ è crescente e $L=s(b)-s(a)=s(b)$ (perché $s(a)=0$). Nella riparametrizzazione per ascissa $\\tilde\\gamma(s)=\\gamma(t(s))$ si ha $\\|\\tilde\\gamma'(s)\\|=1$: $s$ è il parametro naturale. Confondere $s(t)$ con $\\|\\gamma(t)\\|$ è l'errore."}]},{"pool":"curve","src":"tipo curve · manuale (I vs II specie)","steps":[{"t":"Come si scrive l'integrale di SECONDA specie $\\int_\\gamma F\\cdot d\\ell$ come integrale di PRIMA specie?","opts":[{"x":"$\\int_\\gamma F\\cdot d\\ell=\\int_\\gamma (F\\cdot T)\\,ds$, con $T=\\gamma'/\\|\\gamma'\\|$ versore tangente","c":true},{"x":"$\\int_\\gamma F\\cdot d\\ell=\\int_\\gamma \\|F\\|\\,ds$"},{"x":"i due integrali coincidono sempre"},{"x":"$\\int_\\gamma F\\cdot d\\ell=\\int_\\gamma (F\\cdot n)\\,ds$ con $n$ normale"}],"hint":"$d\\ell=\\gamma'\\,dt=\\dfrac{\\gamma'}{\\|\\gamma'\\|}\\,\\|\\gamma'\\|\\,dt=T\\,ds$: il lavoro è la componente TANGENZIALE di $F$ integrata rispetto all'arco.","sol":"$d\\ell=\\gamma'(t)\\,dt=T(t)\\,\\|\\gamma'(t)\\|\\,dt=T\\,ds$, quindi $\\int_\\gamma F\\cdot d\\ell=\\int_\\gamma(F\\cdot T)\\,ds$. Il lavoro misura quanto $F$ è allineato al moto. L'orientazione entra tramite $T$, che cambia verso invertendo $\\gamma$; l'elemento $ds$ da solo è invariante. La versione con la normale $n$ è il flusso 2D, oggetto diverso."}]},{"pool":"curve","src":"20230907 Es.2 · analvett.tex cap.Curve","steps":[{"t":"Il campo $F=\\left(\\dfrac{-y}{x^2+y^2},\\ \\dfrac{x}{x^2+y^2}\\right)$ su $\\mathbb{R}^2\\setminus\\{0\\}$ è irrotazionale ($\\partial_x F_2=\\partial_y F_1$). È conservativo?","opts":[{"x":"No: $\\mathbb{R}^2\\setminus\\{0\\}$ non è semplicemente connesso; infatti $\\oint$ sul cerchio unitario vale $2\\pi\\ne 0$","c":true},{"x":"Sì: irrotazionale implica sempre conservativo"},{"x":"Sì, perché $F$ è $C^1$ su tutto il suo dominio"},{"x":"No, perché in realtà non è irrotazionale"}],"hint":"Irrotazionale $\\Rightarrow$ conservativo SOLO su domini semplicemente connessi. Qui il dominio ha un buco nell'origine.","sol":"Il teorema inverso (irrotazionale $\\Rightarrow$ conservativo) richiede il dominio semplicemente connesso: $\\mathbb{R}^2\\setminus\\{0\\}$ ha un buco, quindi l'implicazione cade. La circuitazione lungo un cerchio che avvolge l'origine vale $2\\pi\\ne 0$: incompatibile con l'esistenza di un potenziale globale. È l'esempio-controesempio classico (esame 20230907, es.2)."}]},{"pool":"curve","src":"tipo curve · manuale (massa e baricentro)","steps":[{"t":"Un filo materiale ha sostegno $\\gamma$ e densità lineare $\\delta(x,y)$. Massa e ascissa $\\bar x$ del baricentro sono:","opts":[{"x":"$m=\\int_\\gamma \\delta\\,ds$ e $\\bar x=\\dfrac{1}{m}\\int_\\gamma x\\,\\delta\\,ds$","c":true},{"x":"$m=\\int_\\gamma \\delta\\,d\\ell$ (vettoriale) e $\\bar x=\\int_\\gamma x\\,ds$"},{"x":"$m=\\int_\\gamma \\delta\\,dt$ e $\\bar x=\\int_\\gamma x\\,dt$"},{"x":"$m=\\delta\\cdot L$ sempre, anche con $\\delta$ non costante"}],"hint":"Massa e momenti sono integrali di PRIMA specie: usano $ds=\\|\\gamma'\\|\\,dt$ (scalare, indipendente dal verso). Il baricentro è il momento diviso la massa.","sol":"Definizione: massa $m=\\int_\\gamma\\delta\\,ds$, momento $M_x=\\int_\\gamma x\\,\\delta\\,ds$, baricentro $\\bar x=M_x/m$ (analogamente $\\bar y$). Sono integrali di prima specie perché una proprietà fisica del filo non deve dipendere dal verso di percorrenza. Solo se $\\delta$ è costante $m=\\delta\\,L$; usare $d\\ell$ o $dt$ al posto di $ds$ è l'errore."}]},{"pool":"curve","src":"analvett.tex cap.Teoremi · tabella decisionale","steps":[{"t":"Davanti a $\\int_\\gamma F\\cdot d\\ell$, quale scorciatoia va valutata PRIMA di parametrizzare?","opts":[{"x":"Se $F$ conservativo: $U(B)-U(A)$. Se $\\gamma$ chiusa in $\\mathbb{R}^2$ con $F
