cdot2x}{(x^2+y^2)^2}$; fai lo stesso per $\\partial_y\\dfrac{-y}{x^2+y^2}$.","sol":"$\\partial_x F_2=\\dfrac{(x^2+y^2)-2x^2}{(x^2+y^2)^2}=\\dfrac{y^2-x^2}{(x^2+y^2)^2}$; $\\partial_y F_1=\\dfrac{-(x^2+y^2)+2y^2}{(x^2+y^2)^2}=\\dfrac{y^2-x^2}{(x^2+y^2)^2}$. La differenza &egrave; $0$: $F$ &egrave; irrotazionale (forma chiusa) su tutto $\\Omega$. Definizione di rotore piano nullo / forma differenziale chiusa."},{"t":"Essendo irrotazionale su $\\Omega$, $F$ &egrave; automaticamente conservativo (esatto) su $\\Omega=\\mathbb{R}^2\\setminus\\{0\\}$?","opts":[{"x":"No: irrotazionale $\\Rightarrow$ conservativo solo su domini semplicemente connessi, e $\\Omega$ non lo &egrave;","c":true},{"x":"S&igrave;: irrotazionale implica sempre conservativo"},{"x":"S&igrave;, ma solo se $F$ &egrave; anche limitato"}],"hint":"Il teorema che lega chiuso ed esatto ha un'ipotesi TOPOLOGICA sul dominio.","sol":"L'implicazione chiuso $\\Rightarrow$ esatto &egrave; garantita dal Lemma di Poincar&eacute; SOLO su aperti semplicemente connessi (in particolare stellati). $\\mathbb{R}^2\\setminus\\{0\\}$ ha un buco, quindi il teorema non si applica e la conclusione va verificata a parte."},{"t":"PERCH&Eacute; il buco nell'origine rompe l'implicazione? Che cosa ha di speciale $\\Omega$?","opts":[{"x":"$\\Omega$ non &egrave; semplicemente connesso: un laccio attorno all'origine non si pu&ograve; contrarre a un punto restando in $\\Omega$, e questo permette a un campo chiuso di NON essere esatto","c":true},{"x":"$\\Omega$ non &egrave; connesso, quindi il potenziale non &egrave; unico"},{"x":"$\\Omega$ non &egrave; limitato, quindi l'integrale diverge"}],"hint":"Semplicemente connesso = ogni curva chiusa &egrave; contraibile con continuit&agrave; dentro il dominio.","sol":"Semplice connessione significa che ogni curva chiusa &egrave; omotopa a un punto DENTRO il dominio. In $\\mathbb{R}^2\\setminus\\{0\\}$ un laccio attorno all'origine non si contrae senza attraversare il buco: la classe di omotopia non banale &egrave; esattamente ci&ograve; che consente $\\oint\\ne0$ pur essendo $F$ chiuso. Qui sta il PERCH&Eacute;, non nel conto: &egrave; una propriet&agrave; topologica del DOMINIO, non del campo."},{"t":"Calcola la circuitazione $\\oint_\\gamma F\\cdot d\\ell$ sulla circonferenza unitaria $\\gamma(t)=(\\cos t,\\sin t)$, $t\\in[0,2\\pi]$ (antioraria).","opts":[{"x":"$\\oint_\\gamma F\\cdot d\\ell=2\\pi$","c":true},{"x":"$\\oint_\\gamma F\\cdot d\\ell=0$"},{"x":"$\\oint_\\gamma F\\cdot d\\ell=\\pi$"}],"hint":"Su $x^2+y^2=1$ il denominatore vale $1$: $F=(-\\sin t,\\cos t)$ e $\\gamma'=(-\\sin t,\\cos t)$.","sol":"Su $x^2+y^2=1$: $F=(-\\sin t,\\cos t)$, $\\gamma'=(-\\sin t,\\cos t)$, quindi $F\\cdot\\gamma'=\\sin^2t+\\cos^2t=1$ e $\\oint=\\int_0^{2\\pi}1\\,dt=2\\pi\\ne0$. La circuitazione non nulla PROVA, per la caratterizzazione dei campi conservativi (esatto $\\iff$ $\\oint=0$ su ogni curva chiusa), che $F$ non &egrave; conservativo su $\\Omega$."},{"t":"Prendi due cammini da $A=(1,0)$ a $B=(-1,0)$: la semicirconferenza SUPERIORE $\\gamma_+$ ($t:0\\to\\pi$) e quella INFERIORE $\\gamma_-$ ($t:0\\to-\\pi$). Quanto valgono i due lavori?","opts":[{"x":"$\\int_{\\gamma_+}F\\cdot d\\ell=\\pi$ e $\\int_{\\gamma_-}F\\cdot d\\ell=-\\pi$: dipendono dal cammino","c":true},{"x":"Entrambi valgono $\\pi$: il lavoro &egrave; indipendente dal cammino"},{"x":"Entrambi valgono $0$: $F$ &egrave; irrotazionale"}],"hint":"Su ciascun arco $F\\cdot\\gamma'=1$; cambia solo l'intervallo di $t$ (e il verso di quello inferiore).","sol":"Su entrambi gli archi (che stanno su $x^2+y^2=1$) $F\\cdot\\gamma'=1$. Superiore: $\\int_0^\\pi 1\\,dt=\\pi$. Inferiore, percorsa con $t:0\\to-\\pi$: $\\int_0^{-\\pi}1\\,dt=-\\pi$. Il lavoro dipende dal cammino, coerentemente con la non-conservativit&agrave;."},{"t":"Controllo di coerenza: la differenza dei due lavori deve pareggiare la circuitazione. Torna?","opts":[{"x":"$\\int_{\\gamma_+}-\\int_{\\gamma_-}=\\pi-(-\\pi)=2\\pi$: uguale a $\\oint$ sul cerchio; localmente $F=\\nabla\\theta$ con $\\theta$ l'angolo polare, multivoco sul giro completo","c":true},{"x":"La differenza &egrave; $0$, come dev'essere per un campo irrotazionale"},{"x":"La differenza &egrave; $\\pi$, met&agrave; della circuitazione"}],"hint":"$\\gamma_+$ seguito da $\\gamma_-$ percorso all'indietro &egrave; il giro completo antiorario.","sol":"$\\gamma_+$ meno $\\gamma_-$ equivale a percorrere $\\gamma_+$ e poi $\\gamma_-$ al contrario: &egrave; il laccio chiuso attorno all'origine, la cui circuitazione &egrave; $2\\pi=\\pi-(-\\pi)$. Coerente. Il potenziale LOCALE &egrave; $\\theta=\\operatorname{atan2}(y,x)$ (si ha $F=\\nabla\\theta$), ma $\\theta$ cresce di $2\\pi$ a ogni giro: &egrave; multivoco, quindi non esiste potenziale GLOBALE su $\\Omega$. Questo chiude il cerchio col passo 3."}]},{"pool":"curve","src":"20230123 Es.3 &middot; bordo di spicchio di sfera e lavoro via Stokes","steps":[{"t":"Campo $F=(y^2-x,\\ 2xy,\\ -xz-x)$ e $\\Sigma=\\{x^2+y^2+z^2=9,\\ x\\ge0,\\ y\\ge0\\}$ (spicchio di sfera $R=3$). Calcola $\\nabla\\times F$.","opts":[{"x":"$\\nabla\\times F=(0,\\ 1+z,\\ 0)$","c":true},{"x":"$\\nabla\\times F=(0,\\ 0,\\ 0)$: $F$ &egrave; irrotazionale"},{"x":"$\\nabla\\times F=(2y,\\ 0,\\ -z)$"}],"hint":"$(\\partial_yF_3-\\partial_zF_2,\\ \\partial_zF_1-\\partial_xF_3,\\ \\partial_xF_2-\\partial_yF_1)$; solo la terza componente di $F$ dipende da $x,z$.","sol":"$\\partial_yF_3-\\partial_zF_2=0-0=0$; $\\partial_zF_1-\\partial_xF_3=0-(-z-1)=1+z$; $\\partial_xF_2-\\partial_yF_1=2y-2y=0$. Dunque $\\nabla\\times F=(0,1+z,0)$. Definizione di rotore in $\\mathbb{R}^3$."},{"t":"Il bordo $\\partial\\Sigma$ &egrave; formato da due semicirconferenze, sui piani $y=0$ e $x=0$. Quale coppia lo parametrizza correttamente?","opts":[{"x":"$\\gamma_1=(3\\sin\\phi,0,3\\cos\\phi)$ e $\\gamma_2=(0,3\\sin\\phi,3\\cos\\phi)$, $\\phi\\in[0,\\pi]$","c":true},{"x":"$\\gamma_1=(3\\cos\\phi,3\\sin\\phi,0)$ e $\\gamma_2=(0,3\\cos\\phi,3\\sin\\phi)$, $\\phi\\in[0,2\\pi]$"},{"x":"Un'unica circonferenza $x^2+y^2=9$ nel piano $z=0$"}],"hint":"Sul bordo o $x=0$ o $y=0$; e serve $x\\ge0,\\ y\\ge0$, quindi mezze circonferenze, non intere.","sol":"Lo spicchio $x\\ge0,y\\ge0$ ha bordo dove uno dei due vincoli &egrave; attivo: su $y=0$ resta $x^2+z^2=9$ con $x\\ge0$, cio&egrave; $\\gamma_1=(3\\sin\\phi,0,3\\cos\\phi)$, $\\phi\\in[0,\\pi]$; su $x=0$ resta $y^2+z^2=9$ con $y\\ge0$, cio&egrave; $\\gamma_2=(0,3\\sin\\phi,3\\cos\\phi)$. Sono semicirconferenze (non intere) perch&eacute; $x,y\\ge0$: il bordo &egrave; regolare a tratti."},{"t":"PERCH&Eacute; conviene il Teorema di Stokes invece di integrare $F$ direttamente sul bordo, e quale ipotesi lo rende lecito?","opts":[{"x":"Perch&eacute; $\\nabla\\times F=(0,1+z,0)$ &egrave; semplice ed &egrave; $C^\\infty$ su TUTTA $\\Sigma$: Stokes richiede $F\\in C^1$ su un aperto contenente la superficie regolare a bordo regolare a tratti; se il campo avesse una singolarit&agrave; su $\\Sigma$ il teorema non si applicherebbe","c":true},{"x":"Perch&eacute; Stokes vale sempre, senza ipotesi sul campo"},{"x":"Perch&eacute; il bordo non &egrave; parametrizzabile"}],"hint":"Pensa a un campo come $(-y,x,0)/(x^2+y^2)$: cosa impedirebbe di usare Stokes?","sol":"Il Teorema di Stokes $\\oint_{\\partial\\Sigma}F\\cdot d\\ell=\\iint_\\Sigma(\\nabla\\times F)\\cdot N\\,d\\sigma$ richiede $F\\in C^1$ su un aperto che contiene la superficie regolare $\\Sigma$, con bordo regolare a tratti e orientazioni coerenti. Qui $F\\in C^\\infty(\\mathbb{R}^3)$: lecito, e conviene perch&eacute; $\\nabla\\times F$ &egrave; elementare mentre $F$ sul bordo no. Con un campo singolare su $\\Sigma$ (es. $(-y,x,0)/(x^2+y^2)$ se $\\Sigma$ tocca l'asse $z$) l'ipotesi cadrebbe: qui sta il PERCH&Eacute;."},{"t":"Parametrizzata $\\Sigma$ con $r(\\phi,\\theta)=(3\\sin\\phi\\cos\\theta,3\\sin\\phi\\sin\\theta,3\\cos\\phi)$, $(\\phi,\\theta)\\in[0,\\pi]\\times[0,\\tfrac\\pi2]$, il prodotto $r_\\phi\\wedge r_\\theta$ &egrave; orientato come la normale uscente dalla sfera?","opts":[{"x":"S&igrave;: $r_\\phi\\wedge r_\\theta=(9\\sin^2\\phi\\cos\\theta,\\,9\\sin^2\\phi\\sin\\theta,\\,9\\sin\\phi\\cos\\phi)=3\\sin\\phi\\,(x,y,z)$, multiplo positivo del raggio, quindi radiale uscente","c":true},{"x":"No: punta verso il centro della sfera"},{"x":"S&igrave;, ma solo dopo aver scambiato $\\phi$ con $\\theta$"}],"hint":"Se $r_\\phi\\wedge r_\\theta$ &egrave; radiale, confronta il suo segno con $r=(x,y,z)$.","sol":"$r_\\phi=(3\\cos\\phi\\cos\\theta,3\\cos\\phi\\sin\\theta,-3\\sin\\phi)$, $r_\\theta=(-3\\sin\\phi\\sin\\theta,3\\sin\\phi\\cos\\theta,0)$; il prodotto vettoriale d&agrave; $(9\\sin^2\\phi\\cos\\theta,9\\sin^2\\phi\\sin\\theta,9\\sin\\phi\\cos\\phi)=3\\sin\\phi\\,(x,y,z)$, con $3\\sin\\phi\\ge0$ su $[0,\\pi]$: &egrave; radiale USCENTE, coerente con l'orientazione richiesta. Il verso del bordo &egrave; quello indotto dalla regola della mano destra rispetto a $N$."},{"t":"Calcola $L=\\iint_\\Sigma(\\nabla\\times F)\\cdot N\\,d\\sigma=\\iint_D(1+3\\cos\\phi)\\,9\\sin^2\\phi\\,\\sin\\theta\\,d\\theta\\,d\\phi$.","opts":[{"x":"$L=\\dfrac{9\\pi}{2}$","c":true},{"x":"$L=9\\pi$"},{"x":"$L=0$, perch&eacute; il campo &egrave; conservativo"}],"hint":"$\\int_0^\\pi\\sin^2\\phi\\,d\\phi=\\tfrac\\pi2$; $\\int_0^\\pi\\cos\\phi\\sin^2\\phi\\,d\\phi=0$; $\\int_0^{\\pi/2}\\sin\\theta\\,d\\theta=1$.","sol":"$(\\nabla\\times F)\\cdot(r_\\phi\\wedge r_\\theta)=(0,1+z,0)\\cdot(\\dots)=(1+3\\cos\\phi)\\,9\\sin^2\\phi\\,\\sin\\theta$ con $z=3\\cos\\phi$. Quindi $L=9\\!\\int_0^\\pi\\!\\sin^2\\phi\\,d\\phi\\!\\int_0^{\\pi/2}\\!\\sin\\theta\\,d\\theta+27\\!\\int_0^\\pi\\!\\cos\\phi\\sin^2\\phi\\,d\\phi\\!\\int_0^{\\pi/2}\\!\\sin\\theta\\,d\\theta=9\\cdot\\tfrac\\pi2\\cdot1+27\\cdot0\\cdot1=\\tfrac{9\\pi}{2}$. Teorema di Stokes. La risposta $0$ &egrave; il trabocchetto: $F$ NON &egrave; conservativo, $\\nabla\\times F\\ne0$."}]},{"pool":"curve","src":"20240122 Es.3 &middot; conservativit&agrave; con parametro e circuitazione via Green","steps":[{"t":"Campo $F=(2x\\cos(x^2+y)+axy,\\ \\cos(x^2+y)+x^2+1)$, $a\\in\\mathbb{R}$. Per quali $a$ &egrave; conservativo su tutto $\\mathbb{R}^2$?","opts":[{"x":"$a=2$","c":true},{"x":"Per ogni $a$"},{"x":"Nessun $a$: il campo non &egrave; mai chiuso"}],"hint":"Su $\\mathbb{R}^2$ (semplicemente connesso) basta $\\partial_xF_2=\\partial_yF_1$.","sol":"$\\partial_yF_1=-2x\\sin(x^2+y)+ax$, $\\partial_xF_2=-2x\\sin(x^2+y)+2x$. L'uguaglianza $\\partial_xF_2=\\partial_yF_1$ d&agrave; $2x=ax$ per ogni $x$, cio&egrave; $a=2$. Criterio: campo chiuso su aperto semplicemente connesso $\\Rightarrow$ esatto (Lemma di Poincar&eacute;)."},{"t":"Per $a=2$ trova tutte le primitive (potenziali) $U$.","opts":[{"x":"$U(x,y)=\\sin(x^2+y)+x^2y+y+k$, $k\\in\\mathbb{R}$","c":true},{"x":"$U(x,y)=\\cos(x^2+y)+x^2y$"},{"x":"$U(x,y)=x^2\\sin(x^2+y)+y^2$"}],"hint":"Integra $F_2=\\cos(x^2+y)+x^2+1$ in $y$, poi imponi $\\partial_xU=F_1$.","sol":"Da $\\partial_yU=\\cos(x^2+y)+x^2+1$ integrando in $y$: $U=\\sin(x^2+y)+x^2y+y+c(x)$. Imponendo $\\partial_xU=2x\\cos(x^2+y)+2xy+c'(x)=F_1=2x\\cos(x^2+y)+2xy$ si ottiene $c'(x)=0$, dunque $U=\\sin(x^2+y)+x^2y+y+k$. Metodo di ricostruzione del potenziale."},{"t":"PERCH&Eacute; su $\\mathbb{R}^2$ la condizione $\\partial_xF_2=\\partial_yF_1$ &egrave; SUFFICIENTE (non solo necessaria) per la conservativit&agrave;? Cosa cambierebbe su $\\mathbb{R}^2\\setminus\\{0\\}$?","opts":[{"x":"Perch&eacute; $\\mathbb{R}^2$ &egrave; semplicemente connesso: l&igrave; chiuso $\\Rightarrow$ esatto (Poincar&eacute;). Su un dominio bucato la condizione resterebbe solo NECESSARIA, e un campo chiuso potrebbe non essere conservativo","c":true},{"x":"Perch&eacute; $F$ &egrave; limitato"},{"x":"Perch&eacute; $F$ &egrave; polinomiale: il dominio non c'entra"}],"hint":"L'implicazione chiuso $\\Rightarrow$ esatto &egrave; TOPOLOGICA, non algebrica.","sol":"Su un aperto semplicemente connesso il Lemma di Poincar&eacute; garantisce chiuso $\\Rightarrow$ esatto: ogni forma chiusa &egrave; il differenziale di una funzione. $\\mathbb{R}^2$ lo &egrave;. Su $\\mathbb{R}^2\\setminus\\{0\\}$ il buco fa cadere il teorema (esempio: $(-y,x)/(x^2+y^2)$, chiuso ma non esatto). Qui il PERCH&Eacute; sta nella topologia del dominio, non nel campo."},{"t":"Sia $D=\\{0\\le y\\le x,\\ x^2+y^2\\le4\\}$ (settore di raggio $2$, $\\theta\\in[0,\\tfrac\\pi4]$). Con il Teorema di Green, quanto vale la circuitazione $\\oint_{\\partial D}F\\cdot d\\ell$ (antioraria) al variare di $a$?","opts":[{"x":"$\\oint_{\\partial D}F\\cdot d\\ell=(2-a)\\dfrac{4\\sqrt2}{3}$","c":true},{"x":"$\\oint_{\\partial D}F\\cdot d\\ell=(a-2)\\dfrac{4\\sqrt2}{3}$"},{"x":"$\\oint_{\\partial D}F\\cdot d\\ell=0$ per ogni $a$"}],"hint":"Green: $\\oint=\\iint_D(\\partial_xF_2-\\partial_yF_1)\\,dA=\\iint_D(2-a)x\\,dA$; passa in coordinate polari.","sol":"Teorema di Green nel piano: $\\oint_{\\partial D}F\\cdot d\\ell=\\iint_D(\\partial_xF_2-\\partial_yF_1)\\,dA$. Qui $\\partial_xF_2-\\partial_yF_1=2x-ax=(2-a)x$. In polari sul settore: $(2-a)\\int_0^{\\pi/4}\\!\\!\\int_0^2\\rho\\cos\\theta\\cdot\\rho\\,d\\rho\\,d\\theta=(2-a)\\cdot\\tfrac{8}{3}\\cdot\\tfrac{\\sqrt2}{2}=(2-a)\\tfrac{4\\sqrt2}{3}$. NB: la stampa ufficiale riporta $(a-2)$ &mdash; refuso di SEGNO; il valore corretto ha il fattore $(2-a)$."},{"t":"Caso $a=2$: quanto vale la circuitazione, e perch&eacute; era prevedibile senza calcolarla?","opts":[{"x":"$0$: per $a=2$ il campo &egrave; conservativo, e la circuitazione di un campo conservativo su una curva chiusa &egrave; sempre nulla","c":true},{"x":"$\\tfrac{4\\sqrt2}{3}$: il valore massimo"},{"x":"Dipende dal punto di partenza del giro"}],"hint":"Un campo esatto ha $\\oint=0$ su OGNI curva chiusa, indipendentemente da $D$.","sol":"Per $a=2$, $(2-a)\\tfrac{4\\sqrt2}{3}=0$. Coerente col fatto che per $a=2$ il campo &egrave; conservativo: per la caratterizzazione dei campi conservativi la circuitazione su ogni curva chiusa &egrave; nulla. Il conto via Green e la conservativit&agrave; danno la stessa risposta, come dev'essere."}]},{"pool":"curve","src":"20230504 Es.4 &middot; campo conservativo: lavoro su curva chiusa e regolarit&agrave; agli estremi","steps":[{"t":"Campo $F=(x+f(y)+z^2,\\ x\\,f(y),\\ 2xz)$ con $f\\in C^1$, $f(0)=1$. Trova $f$ affinch&eacute; $F$ sia conservativo su $\\mathbb{R}^3$.","opts":[{"x":"$f(y)=e^y$","c":true},{"x":"$f(y)=1$ costante"},{"x":"$f(y)=1+y$"}],"hint":"$\\mathbb{R}^3$ &egrave; semplicemente connesso: imponi $\\nabla\\times F=0$, che d&agrave; un'EDO su $f$.","sol":"$\\nabla\\times F=(0,0,\\,f(y)-f'(y))$ (le altre componenti si annullano). Su $\\mathbb{R}^3$ semplicemente connesso, chiuso $\\Rightarrow$ esatto (Poincar&eacute;): serve $f'(y)=f(y)$, EDO lineare la cui soluzione con $f(0)=1$ &egrave; $f(y)=e^y$."},{"t":"Con $f(y)=e^y$, quanto vale il lavoro lungo la curva CHIUSA $\\gamma(t)=(\\cos t,\\sin t,3)$, $t\\in[0,2\\pi]$?","opts":[{"x":"$0$, perch&eacute; il campo &egrave; conservativo e la curva &egrave; chiusa","c":true},{"x":"$2\\pi$"},{"x":"$6\\pi$"}],"hint":"Non serve alcun conto: che dice il teorema fondamentale per gli integrali di linea su una curva chiusa?","sol":"Per il teorema fondamentale del calcolo per integrali curvilinei, se $F=\\nabla U$ allora $\\int_\\gamma F\\cdot d\\ell=U(\\gamma(b))-U(\\gamma(a))$; su una curva CHIUSA $\\gamma(a)=\\gamma(b)$, quindi il lavoro &egrave; $0$. Nessun calcolo esplicito serve: lo garantisce la conservativit&agrave;."},{"t":"Verifica la regolarit&agrave; della curva $\\delta(t)=(1+e^{t^2},\\ \\log(t^4+1),\\ \\sin((\\pi t)^6))$, $t\\in[0,1]$. Attenzione all'estremo $t=0$.","opts":[{"x":"$\\delta$ &egrave; regolare su $(0,1)$ ma NON in $t=0$: l&igrave; $\\delta'(0)=(0,0,0)$","c":true},{"x":"$\\delta$ &egrave; regolare su tutto $[0,1]$, estremi inclusi"},{"x":"$\\delta$ non &egrave; mai regolare perch&eacute; non &egrave; $C^1$"}],"hint":"Calcola $\\delta'(t)$: ogni componente ha un fattore che si annulla in $t=0$.","sol":"$\\delta'(t)=\\big(2t\\,e^{t^2},\\ \\tfrac{4t^3}{t^4+1},\\ 6\\pi^6 t^5\\cos((\\pi t)^6)\\big)$: in $t=0$ tutte le componenti si annullano, $\\delta'(0)=(0,0,0)$, quindi $\\delta$ non &egrave; regolare nell'estremo. Su $(0,1)$ invece $2t\\,e^{t^2}>0$, dunque $\\delta'\\ne0$ e $\\delta$ &egrave; regolare. Definizione di curva regolare ($\\delta\\in C^1$, $\\delta'\\ne0$): &egrave; lo stesso fenomeno della cuspide."},{"t":"Per calcolare il lavoro di $F$ lungo $\\delta$ conviene un potenziale $U$ con $F=\\nabla U$. Quale imposta correttamente il conto?","opts":[{"x":"$U=\\tfrac{x^2}{2}+xe^y+xz^2$, e $L=U(\\delta(1))-U(\\delta(0))$ con $\\delta(0)=(2,0,0)$, $\\delta(1)=(1+e,\\log2,\\sin(\\pi^6))$","c":true},{"x":"$L=\\int_0^1 F(\\delta(t))\\cdot\\delta'(t)\\,dt$, da svolgere per forza componente per componente"},{"x":"$L=0$ perch&eacute; anche $\\delta$ &egrave; chiusa"}],"hint":"Integra $F_1=x+e^y+z^2$ in $x$; poi valuta $U$ agli estremi (indipendenza dal cammino).","sol":"Integrando $F_1=x+e^y+z^2$ in $x$: $U=\\tfrac{x^2}{2}+xe^y+xz^2+\\varphi(y,z)$; il confronto con $F_2=xe^y$ e $F_3=2xz$ d&agrave; $\\varphi=$ costante. Poich&eacute; $F$ &egrave; conservativo, $L=U(\\delta(1))-U(\\delta(0))$: dipende SOLO dagli estremi $\\delta(0)=(2,0,0)$ e $\\delta(1)=(1+e,\\log2,\\sin(\\pi^6))$, non dalla forma di $\\delta$. Teorema fondamentale per integrali curvilinei."},{"t":"Ai fini del lavoro, l'irregolarit&agrave; di $\\delta$ in $t=0$ &egrave; un problema?","opts":[{"x":"No: essendo $F$ conservativo, $L=U(\\text{fine})-U(\\text{inizio})$ dipende solo dai due estremi; la mancata regolarit&agrave; in un punto isolato non altera il valore","c":true},{"x":"S&igrave;: senza regolarit&agrave; in $t=0$ il lavoro non &egrave; definito"},{"x":"S&igrave;: bisogna spezzare la curva e il lavoro raddoppia"}],"hint":"Il lavoro di un campo conservativo guarda gli estremi, non la cinematica del percorso.","sol":"Per un campo conservativo il lavoro &egrave; $U(\\text{fine})-U(\\text{inizio})$: non vede n&eacute; la forma del cammino n&eacute; un singolo punto con $\\delta'=0$ (basta che $\\delta$ sia continua e regolare a tratti). L'indipendenza dal cammino, garantita dalla conservativit&agrave;, assorbe la cuspide dell'estremo. Chiude il tema aperto ai passi 2 e 3."}]},{"pool":"curve","src":"tipo curve &middot; da Univ. Bari (Lazzo) &middot; manuale (massa e baricentro, I specie)","steps":[{"t":"Filo con sostegno il quarto di circonferenza $\\gamma(t)=(\\cos t,\\sin t)$, $t\\in[0,\\tfrac\\pi2]$, e densit&agrave; lineare $\\delta(x,y)=xy$. Qual &egrave; l'elemento d'arco $ds$?","opts":[{"x":"$ds=\\|\\gamma'\\|\\,dt=dt$, perch&eacute; $\\|\\gamma'\\|=\\|(-\\sin t,\\cos t)\\|=1$","c":true},{"x":"$ds=dt$ sempre, per definizione di parametro"},{"x":"$ds=xy\\,dt$"}],"hint":"$ds=\\|\\gamma'(t)\\|\\,dt$; qui $\\gamma$ &egrave; la circonferenza unitaria, parametrizzata per angolo.","sol":"$\\gamma'=(-\\sin t,\\cos t)$, $\\|\\gamma'\\|=\\sqrt{\\sin^2t+\\cos^2t}=1$, dunque $ds=1\\cdot dt=dt$. &Egrave; una coincidenza di questa parametrizzazione (velocit&agrave; unitaria: $t$ &egrave; gi&agrave; l'ascissa curvilinea), NON una regola generale. Definizione di elemento d'arco."},{"t":"Calcola la massa $M=\\int_\\gamma \\delta\\,ds$.","opts":[{"x":"$M=\\dfrac12$","c":true},{"x":"$M=1$"},{"x":"$M=\\dfrac\\pi4$"}],"hint":"$\\delta(\\gamma(t))=\\cos t\\,\\sin t$; primitiva di $\\cos t\\sin t$ &egrave; $\\tfrac12\\sin^2 t$.","sol":"$M=\\int_0^{\\pi/2}\\cos t\\,\\sin t\\cdot1\\,dt=\\big[\\tfrac12\\sin^2 t\\big]_0^{\\pi/2}=\\tfrac12$. Definizione di massa come integrale di prima specie della densit&agrave; lungo il sostegno."},{"t":"PERCH&Eacute; la massa si calcola con l'integrale di PRIMA specie ($ds$) e non di seconda ($d\\ell$)? E l'orientazione conta?","opts":[{"x":"Perch&eacute; la massa &egrave; uno scalare fisico che somma contributi $\\delta\\,ds$ lungo il filo: l'integrale di I specie &egrave; indipendente dal verso di percorrenza, com'&egrave; giusto sia per una massa","c":true},{"x":"Perch&eacute; la II specie non esiste per campi scalari, ma se esistesse darebbe lo stesso valore"},{"x":"Conta l'orientazione: invertendo il verso la massa cambia segno"}],"hint":"Cosa succede a $\\int_\\gamma f\\,ds$ se inverti il verso? E a $\\int_\\gamma F\\cdot d\\ell$?","sol":"L'integrale di I specie $\\int_\\gamma f\\,ds$ &egrave; INDIPENDENTE dall'orientazione (dipende solo dal sostegno e da $|\\gamma'|$), mentre quello di II specie $\\int_\\gamma F\\cdot d\\ell$ cambia segno invertendo il verso. Una massa non pu&ograve; dipendere dal verso in cui immagino di percorrere il filo n&eacute; essere negativa: perci&ograve; &egrave; una quantit&agrave; di I specie. Qui il PERCH&Eacute; distingue le due specie."},{"t":"Calcola le coordinate del baricentro $\\bar x=\\tfrac1M\\int_\\gamma x\\,\\delta\\,ds$ e $\\bar y=\\tfrac1M\\int_\\gamma y\\,\\delta\\,ds$.","opts":[{"x":"$\\bar x=\\bar y=\\dfrac23$","c":true},{"x":"$\\bar x=\\bar y=\\dfrac12$"},{"x":"$\\bar x=\\dfrac23,\\ \\bar y=\\dfrac13$"}],"hint":"$\\int_0^{\\pi/2}\\cos^2 t\\,\\sin t\\,dt$ con $u=\\cos t$; per simmetria $x\\leftrightarrow y$ il risultato non cambia.","sol":"$\\bar x=\\tfrac1{1/2}\\int_0^{\\pi/2}\\cos t\\cdot(\\cos t\\sin t)\\,dt=2\\int_0^{\\pi/2}\\cos^2t\\sin t\\,dt=2\\big[-\\tfrac{\\cos^3 t}{3}\\big]_0^{\\pi/2}=2\\cdot\\tfrac13=\\tfrac23$. Per la simmetria dell'arco e di $\\delta=xy$ nello scambio $x\\leftrightarrow y$, anche $\\bar y=\\tfrac23$. Definizione di baricentro di un filo materiale."},{"t":"Controllo: il baricentro $(\\tfrac23,\\tfrac23)$ giace SUL filo (la circonferenza unitaria)?","opts":[{"x":"No: $\\left(\\tfrac23\\right)^2+\\left(\\tfrac23\\right)^2=\\tfrac89<1$, sta all'INTERNO dell'arco; il baricentro di un filo non giace in generale sul sostegno","c":true},{"x":"S&igrave;: ogni baricentro giace sempre sulla curva che lo genera"},{"x":"No: sta all'esterno, a distanza $>1$ dall'origine"}],"hint":"Distanza dall'origine al quadrato: $\\tfrac49+\\tfrac49$; confronta con $1$.","sol":"$\\|(\\tfrac23,\\tfrac23)\\|^2=\\tfrac49+\\tfrac49=\\tfrac89<1$: il baricentro sta DENTRO l'arco, a distanza $\\tfrac{2\\sqrt2}{3}\\approx0.94<1$ dall'origine. Come per un arco omogeneo, il baricentro di un oggetto unidimensionale curvo cade in generale FUORI dal suo sostegno: &egrave; una media pesata di posizioni, non un punto del filo. Controllo di plausibilit&agrave; geometrico."}]}],"gauss":[{"pool":"gauss","src":"tipo A · manuale","steps":[{"t":"Il teorema della divergenza $\\iint_{\\partial V} F\\cdot n\\,dS=\\iiint_V \\nabla\\cdot F\\,dV$ si applica. Quale ipotesi NON puoi omettere?","opts":[{"x":"$F\\in C^1$ su un aperto che contiene $\\overline V$, e $\\partial V$ regolare a tratti con normale uscente","c":true},{"x":"$F$ soltanto continua su $V$"},{"x":"$V$ semplicemente connesso"},{"x":"$\\nabla\\cdot F$ costante"}],"hint":"La regolarità richiesta è $C^1$; la semplice connessione riguarda i campi conservativi, non Gauss.","sol":"Il Teorema della divergenza richiede $F\\in C^1$ su un intorno del compatto $\\overline V$ e $\\partial V$ regolare a tratti con normale $n$ USCENTE. La semplice connessione è irrilevante qui; $\\nabla\\cdot F$ può essere una qualsiasi funzione continua."}]},{"pool":"gauss","src":"tipo A · manuale","steps":[{"t":"Nel teorema della divergenza la normale $n$ su $\\partial V$ deve essere:","opts":[{"x":"uscente da $V$","c":true},{"x":"entrante in $V$"},{"x":"tangente a $\\partial V$"},{"x":"quella con terza componente sempre positiva"}],"hint":"Il segno del flusso dipende dal verso della normale; il teorema fissa un verso preciso.","sol":"$n$ è la normale USCENTE. Se usi quella entrante il flusso cambia segno: $\\iint_{\\partial V}F\\cdot n_{\\text{ent}}\\,dS=-\\iiint_V\\nabla\\cdot F\\,dV$. Teorema della divergenza."}]},{"pool":"gauss","src":"tipo A · manuale","steps":[{"t":"Se $\\nabla\\cdot F\\equiv 0$ su tutto $V$, quanto vale il flusso uscente attraverso $\\partial V$?","opts":[{"x":"$0$","c":true},{"x":"il volume di $V$"},{"x":"non determinabile senza calcolo diretto"},{"x":"dipende dalla forma di $V$"}],"hint":"Integra la divergenza sul volume.","sol":"$\\iint_{\\partial V}F\\cdot n\\,dS=\\iiint_V 0\\,dV=0$. Un campo solenoidale ($\\nabla\\cdot F=0$) ha flusso nullo attraverso ogni superficie chiusa che borda un volume in cui $F\\in C^1$. Teorema della divergenza."}]},{"pool":"gauss","src":"tipo A · manuale","steps":[{"t":"Se $\\nabla\\cdot F=c$ costante, il flusso uscente da $V$ vale:","opts":[{"x":"$c\\cdot\\operatorname{vol}(V)$","c":true},{"x":"$c$"},{"x":"$c\\cdot\\operatorname{area}(\\partial V)$"},{"x":"$\\operatorname{vol}(V)$"}],"hint":"L'integrale di una costante sul volume è la costante per il volume.","sol":"$\\iiint_V c\\,dV=c\\,\\operatorname{vol}(V)$. Quando la divergenza è costante il flusso si riduce a un volume: è il motivo per cui Gauss conviene. Teorema della divergenza."}]},{"pool":"gauss","src":"tipo A · manuale","steps":[{"t":"La frontiera $\\partial V$ è fatta di tre superfici e $\\nabla\\cdot F=2$. Conviene di più:","opts":[{"x":"calcolare $\\iiint_V 2\\,dV=2\\operatorname{vol}(V)$ con Gauss","c":true},{"x":"parametrizzare le tre superfici e sommare i tre flussi"},{"x":"applicare Stokes al bordo"},{"x":"costruire il potenziale scalare"}],"hint":"Con divergenza semplice, un integrale di volume batte tre integrali di superficie.","sol":"Con $\\nabla\\cdot F$ costante o semplice, Gauss trasforma tre flussi di superficie in un unico integrale di volume $\\iiint_V\\nabla\\cdot F$. È il criterio di convenienza. Teorema della divergenza."}]},{"pool":"gauss","src":"tipo H · manuale","steps":[{"t":"$\\Sigma$ è una superficie APERTA (una calotta senza coperchio). Per calcolarne il flusso con Gauss devi:","opts":[{"x":"aggiungere un tappo $T$ che chiuda $\\Sigma$, applicare Gauss al solido, poi sottrarre il flusso su $T$","c":true},{"x":"applicare Gauss direttamente a $\\Sigma$"},{"x":"usare Stokes"},{"x":"il flusso è nullo perché $\\Sigma$ è aperta"}],"hint":"Gauss vale solo per superfici CHIUSE; una superficie aperta va prima chiusa.","sol":"Gauss richiede una superficie chiusa. Chiudi $\\Sigma$ con un tappo $T$: $\\iint_\\Sigma+\\iint_T=\\iiint_V\\nabla\\cdot F$, quindi $\\iint_\\Sigma F\\cdot n\\,dS=\\iiint_V\\nabla\\cdot F\\,dV-\\iint_T F\\cdot n\\,dS$. È il trucco 'tappare e Gauss'. Teorema della divergenza (tipo A/H, manuale)."}]},{"pool":"gauss","src":"tipo H · manuale","steps":[{"t":"Chiudi $\\Sigma$ con un tappo $T$ e applichi Gauss al solido $V$. Con quale orientazione entra $T$ in $\\iint_\\Sigma=\\iiint_V\\nabla\\cdot F-\\iint_T$?","opts":[{"x":"con la normale USCENTE da $V$","c":true},{"x":"con la normale entrante in $V$"},{"x":"con orientazione arbitraria"},{"x":"con la normale di $\\Sigma$ cambiata di segno"}],"hint":"Nel bilancio di Gauss ogni pezzo di $\\partial V$ è orientato verso l'esterno.","sol":"Applicando Gauss al solido chiuso, sia $\\Sigma$ sia $T$ vanno con normale uscente da $V$. Isolando $\\Sigma$: $\\iint_\\Sigma=\\iiint_V\\nabla\\cdot F-\\iint_T$ con $T$ uscente. Sbagliarne il verso è l'errore classico del metodo. Teorema della divergenza."}]},{"pool":"gauss","src":"tipo H · manuale","steps":[{"t":"Su una superficie cartesiana $z=f(x,y)$ si ha $r_x\\wedge r_y=(-f_x,-f_y,1)$ (terza componente positiva, punta in alto). Se questa è il tappo INFERIORE di un solido, la normale uscente da $V$ è:","opts":[{"x":"$(f_x,f_y,-1)$, cioè verso il basso","c":true},{"x":"$(-f_x,-f_y,1)$, invariata"},{"x":"$(0,0,1)$"},{"x":"$(0,0,-1)$"}],"hint":"Sul fondo del solido, 'uscente' significa verso il basso.","sol":"$(-f_x,-f_y,1)$ punta in alto; sul tappo inferiore l'uscente da $V$ punta in basso, quindi si prende $(f_x,f_y,-1)$. Confondere i due segni è la trappola più frequente. Teorema della divergenza."}]},{"pool":"gauss","src":"20230210 Es.4","steps":[{"t":"$\\partial V=\\Sigma_1\\cup\\Sigma_2\\cup\\Sigma_3$. Conosci il flusso totale (via Gauss) e i flussi su $\\Sigma_1,\\Sigma_2$. Il flusso su $\\Sigma_3$ è:","opts":[{"x":"$\\iiint_V\\nabla\\cdot F\\,dV-\\Phi_{\\Sigma_1}-\\Phi_{\\Sigma_2}$","c":true},{"x":"$\\iiint_V\\nabla\\cdot F\\,dV+\\Phi_{\\Sigma_1}+\\Phi_{\\Sigma_2}$"},{"x":"$\\Phi_{\\Sigma_1}+\\Phi_{\\Sigma_2}$"},{"x":"$0$"}],"hint":"Il flusso totale è la somma dei flussi sui pezzi, tutti uscenti.","sol":"Poiché $\\Phi_{\\partial V}=\\Phi_{\\Sigma_1}+\\Phi_{\\Sigma_2}+\\Phi_{\\Sigma_3}=\\iiint_V\\nabla\\cdot F$, si isola $\\Phi_{\\Sigma_3}=\\iiint_V\\nabla\\cdot F-\\Phi_{\\Sigma_1}-\\Phi_{\\Sigma_2}$. Tecnica del flusso 'per differenza', 20230210 Es.4. Teorema della divergenza."}]},{"pool":"gauss","src":"tipo A · manuale","steps":[{"t":"$F=\\dfrac{(x,y,z)}{(x^2+y^2+z^2)^{3/2}}$ ha $\\nabla\\cdot F=0$ dove definito. Il flusso uscente dalla sfera unitaria centrata nell'origine è $0$?","opts":[{"x":"No: $F$ non è $C^1$ nell'origine, che sta dentro $V$; Gauss non si applica e il flusso vale $4\\pi$","c":true},{"x":"Sì, perché $\\nabla\\cdot F=0$"},{"x":"Sì, per ogni superficie chiusa"},{"x":"No, ma il flusso è comunque $0$"}],"hint":"Gauss richiede $F\\in C^1$ in TUTTO $V$, origine inclusa.","sol":"La divergenza è nulla solo fuori dall'origine, dove $F$ ha una singolarità. Con l'origine dentro $V$ l'ipotesi $F\\in C^1(\\overline V)$ cade e Gauss non vale: il flusso è $4\\pi$ (campo di Coulomb). Teorema della divergenza, ipotesi di regolarità."}]},{"pool":"gauss","src":"tipo A · manuale","steps":[{"t":"$\\nabla\\cdot F(P)>0$ in un punto $P$ significa che, localmente, $P$ si comporta come:","opts":[{"x":"una sorgente (flusso netto uscente da un intorno di $P$ positivo)","c":true},{"x":"un pozzo"},{"x":"un punto di sella del potenziale"},{"x":"un punto dove $F=0$"}],"hint":"Il flusso su un piccolo volume attorno a $P$ è $\\approx\\nabla\\cdot F(P)\\cdot\\operatorname{vol}$.","sol":"$\\nabla\\cdot F(P)=\\lim_{V\\to P}\\frac{1}{\\operatorname{vol}(V)}\\iint_{\\partial V}F\\cdot n\\,dS$: è la densità di flusso uscente. Positiva = sorgente, negativa = pozzo. È la lettura fisica del Teorema della divergenza."}]},{"pool":"gauss","src":"tipo A · manuale","steps":[{"t":"Vuoi calcolare $\\operatorname{vol}(V)$ come integrale di flusso. Quale campo scegli?","opts":[{"x":"un $F$ con $\\nabla\\cdot F=1$, per esempio $F=(0,0,z)$ o $F=\\tfrac13(x,y,z)$","c":true},{"x":"un $F$ con $\\nabla\\cdot F=0$"},{"x":"$F=(x,y,z)$ senza fattori"},{"x":"un campo qualsiasi"}],"hint":"Serve $\\iiint_V\\nabla\\cdot F=\\operatorname{vol}(V)$, cioè divergenza unitaria.","sol":"Se $\\nabla\\cdot F=1$ allora $\\iint_{\\partial V}F\\cdot n\\,dS=\\iiint_V 1\\,dV=\\operatorname{vol}(V)$. Con $F=(x,y,z)$ la divergenza è $3$, quindi $\\operatorname{vol}(V)=\\tfrac13\\iint_{\\partial V}(x,y,z)\\cdot n\\,dS$. Teorema della divergenza."}]},{"pool":"gauss","src":"tipo H · manuale","steps":[{"t":"Scrivi $\\iint_\\Sigma F\\cdot n=\\iiint_V\\nabla\\cdot F$ per una calotta APERTA $\\Sigma$. Cosa c'è di sbagliato?","opts":[{"x":"$\\Sigma$ non è chiusa: non borda alcun volume, quindi Gauss non è applicabile senza prima tapparla","c":true},{"x":"niente, è corretto"},{"x":"$V$ va preso bidimensionale"},{"x":"manca solo un fattore $2\\pi$"}],"hint":"Gauss lega un volume alla sua frontiera CHIUSA.","sol":"Una superficie aperta non è la frontiera di un solido: $\\iiint_V\\nabla\\cdot F$ non ha nemmeno un $V$ ben definito. Bisogna chiudere $\\Sigma$ con un tappo e poi sottrarne il flusso. Teorema della divergenza."}]},{"pool":"gauss","src":"tipo A · manuale","steps":[{"t":"Per $F=(x,y,z)$ il flusso uscente da un qualunque solido $V$ (con $\\partial V$ regolare) vale:","opts":[{"x":"$3\\operatorname{vol}(V)$","c":true},{"x":"$\\operatorname{vol}(V)$"},{"x":"$4\\pi$ sempre"},{"x":"$0$"}],"hint":"Calcola la divergenza di $(x,y,z)$.","sol":"$\\nabla\\cdot(x,y,z)=1+1+1=3$, quindi $\\iint_{\\partial V}(x,y,z)\\cdot n\\,dS=3\\operatorname{vol}(V)$ per ogni solido. Teorema della divergenza."}]},{"pool":"gauss","src":"20240619 Es.1","steps":[{"t":"$F=(e^x+2z,\\,2y,\\,5-z\\,e^x)$. Prima di parametrizzare, calcola $\\nabla\\cdot F$:","opts":[{"x":"$2$ (i termini $e^x$ si cancellano)","c":true},{"x":"$e^x+2-z\\,e^x$"},{"x":"$2e^x+2$"},{"x":"$0$"}],"hint":"$\\partial_x(e^x+2z)=e^x$ e $\\partial_z(5-z\\,e^x)=-e^x$: si elidono.","sol":"$\\partial_x F_1=e^x$, $\\partial_y F_2=2$, $\\partial_z F_3=-e^x$; somma $=2$. Un campo dall'aspetto complicato ha spesso divergenza semplice: calcolarla subito rivela la convenienza di Gauss. 20240619 Es.1. Teorema della divergenza."}]},{"pool":"gauss","src":"20240122 Es.4","steps":[{"t":"$F=(0,0,z)$ e il flusso uscente da un solido $E$ vale $\\tfrac{32}{3}\\pi$. Quanto vale $\\operatorname{vol}(E)$?","opts":[{"x":"$\\tfrac{32}{3}\\pi$","c":true},{"x":"$32\\pi$"},{"x":"$\\tfrac{32}{9}\\pi$"},{"x":"$\\tfrac{16}{3}\\pi$"}],"hint":"$\\nabla\\cdot(0,0,z)=1$.","sol":"$\\nabla\\cdot F=1$, quindi per Gauss $\\Phi=\\iiint_E 1\\,dV=\\operatorname{vol}(E)$. Dal flusso $\\tfrac{32}{3}\\pi$ segue $\\operatorname{vol}(E)=\\tfrac{32}{3}\\pi$. 20240122 Es.4. Teorema della divergenza."}]},{"pool":"gauss","src":"tipo A · manuale","steps":[{"t":"Flusso uscente di $F=(x,y,z)$ dalla sfera $x^2+y^2+z^2\\le 4$:","opts":[{"x":"$32\\pi$","c":true},{"x":"$16\\pi$"},{"x":"$\\tfrac{32}{3}\\pi$"},{"x":"$4\\pi$"}],"hint":"$\\nabla\\cdot F=3$ e $\\operatorname{vol}=\\tfrac43\\pi R^3$ con $R=2$.","sol":"$\\nabla\\cdot F=3$; $\\operatorname{vol}=\\tfrac43\\pi\\cdot 8=\\tfrac{32}{3}\\pi$; flusso $=3\\cdot\\tfrac{32}{3}\\pi=32\\pi$. Teorema della divergenza."}]},{"pool":"gauss","src":"tipo A · manuale","steps":[{"t":"Flusso uscente di $F=(x,y,z)$ dal cubo $[0,1]^3$:","opts":[{"x":"$3$","c":true},{"x":"$1$"},{"x":"$6$"},{"x":"$0$"}],"hint":"$\\nabla\\cdot F=3$, $\\operatorname{vol}=1$.","sol":"$\\nabla\\cdot F=3$, $\\operatorname{vol}([0,1]^3)=1$, flusso $=3\\cdot 1=3$. Verificabile anche faccia per faccia: le tre coppie di facce danno $1$ ciascuna. Teorema della divergenza."}]},{"pool":"gauss","src":"20220706 Es.2","steps":[{"t":"$F=(z+x^2\\sin y,\\,2x\\cos y,\\,x^2+y^2+8z)$ sul solido $E$. Il flusso uscente vale:","opts":[{"x":"$8\\operatorname{vol}(E)$","c":true},{"x":"$\\operatorname{vol}(E)$"},{"x":"$10\\operatorname{vol}(E)$"},{"x":"$0$"}],"hint":"$\\partial_x(x^2\\sin y)=2x\\sin y$ e $\\partial_y(2x\\cos y)=-2x\\sin y$ si elidono.","sol":"$\\nabla\\cdot F=2x\\sin y-2x\\sin y+8=8$; flusso $=\\iiint_E 8\\,dV=8\\operatorname{vol}(E)$. 20220706 Es.2. Teorema della divergenza."}]},{"pool":"gauss","src":"20250627 Es.3","steps":[{"t":"$F=(x^2z+4,\\,-2xyz-y\\,e^z,\\,e^z+2z+1)$ sul cilindro $\\{0\\le z\\le4,\\;(x-z)^2+y^2\\le4\\}$. Calcola $\\nabla\\cdot F$:","opts":[{"x":"$2$","c":true},{"x":"$2e^z+2$"},{"x":"$2xz+e^z+2$"},{"x":"$0$"}],"hint":"$\\partial_y(-2xyz-y\\,e^z)=-2xz-e^z$: attento al segno di $e^z$.","sol":"$\\partial_x F_1=2xz$; $\\partial_y F_2=-2xz-e^z$; $\\partial_z F_3=e^z+2$. Somma $=2$: il termine $e^z$ si cancella. Sbagliarne il segno produce il falso $2e^z+2$. 20250627 Es.3. Teorema della divergenza.","cont":"Ora il flusso &rarr;"},{"t":"Con $\\nabla\\cdot F=2$ e il cilindro traslato (per ogni $z$ un disco di raggio $2$, area $4\\pi$, con $z\\in[0,4]$), il flusso uscente vale:","opts":[{"x":"$32\\pi$","c":true},{"x":"$16\\pi$"},{"x":"$8\\pi e^4+24\\pi$"},{"x":"$64\\pi$"}],"hint":"$\\operatorname{vol}=\\int_0^4 4\\pi\\,dz$; la traslazione $(x-z)$ non cambia l'area della sezione.","sol":"$\\operatorname{vol}(E)=\\int_0^4 4\\pi\\,dz=16\\pi$ (il disco ha sempre raggio $2$: la traslazione dipendente da $z$ non altera l'area). Flusso $=2\\cdot16\\pi=32\\pi$. Con il falso $\\nabla\\cdot F=2e^z+2$ otterresti $8\\pi e^4+24\\pi$. Teorema della divergenza."}]},{"pool":"gauss","src":"20220124 Es.3","steps":[{"t":"$T=\\{x^2+y^2\\le z\\le 3+2y\\}$ (proiezione: disco $x^2+(y-1)^2\\le4$), con $\\nabla\\cdot F=y-1$. Il flusso uscente vale:","opts":[{"x":"$0$","c":true},{"x":"$4\\pi$"},{"x":"$-\\pi$"},{"x":"$16\\pi$"}],"hint":"Centra le polari nel disco: $y-1=\\rho\\sin\\theta$, e $\\int_0^{2\\pi}\\sin\\theta\\,d\\theta=0$.","sol":"$\\Phi=\\iint_D(3+2y-x^2-y^2)(y-1)\\,dx\\,dy$. Con $y=1+\\rho\\sin\\theta$ il fattore $(y-1)=\\rho\\sin\\theta$ è dispari in $\\theta$ mentre l'altro fattore dipende da $\\rho$: l'integrale angolare $\\int_0^{2\\pi}\\sin\\theta\\,d\\theta=0$, quindi il flusso è $0$. 20220124 Es.3. Teorema della divergenza."}]},{"pool":"gauss","src":"20230210 Es.4","steps":[{"t":"$E=\\{x^2+y^2+z^2\\le25,\\;x^2+y^2\\le9\\}$ (sfera $\\cap$ cilindro), $F=(x,y,z)$. Per il flusso sul mantello cilindrico $\\Sigma_3$ la via più rapida è:","opts":[{"x":"$\\Phi_{\\Sigma_3}=3\\operatorname{vol}(E)-\\Phi_{\\Sigma_1}-\\Phi_{\\Sigma_2}$ (Gauss per il totale, calotte dirette, mantello per differenza)","c":true},{"x":"parametrizzare solo $\\Sigma_3$ e integrare $F\\cdot n$"},{"x":"applicare Stokes al bordo di $\\Sigma_3$"},{"x":"il flusso è $0$ per simmetria"}],"hint":"Gauss dà il totale; le calotte sono cartesiane e semplici, il mantello si ottiene per differenza.","sol":"Gauss fornisce $\\Phi_{\\partial E}=3\\operatorname{vol}(E)$. Le calotte $\\Sigma_1,\\Sigma_2$ sono cartesiane e si integrano direttamente; sottraendole si isola $\\Phi_{\\Sigma_3}=3\\operatorname{vol}(E)-\\Phi_{\\Sigma_1}-\\Phi_{\\Sigma_2}=144\\pi$. 20230210 Es.4. Teorema della divergenza."}]},{"pool":"gauss","src":"tipo A · manuale","steps":[{"t":"Volume del solido $E=\\{x^2+y^2\\le z\\le 2-x^2-y^2\\}$ (fra i due paraboloidi):","opts":[{"x":"$\\pi$","c":true},{"x":"$2\\pi$"},{"x":"$\\tfrac{\\pi}{2}$"},{"x":"$\\tfrac{2\\pi}{3}$"}],"hint":"Intersezione $x^2+y^2=1$; integra $(2-2\\rho^2)$ in polari con Jacobiano $\\rho$.","sol":"I paraboloidi si incontrano dove $\\rho^2=2-\\rho^2\\Rightarrow\\rho=1$. $\\operatorname{vol}=\\int_0^{2\\pi}\\!\\!\\int_0^1(2-2\\rho^2)\\rho\\,d\\rho\\,d\\theta=2\\pi[\\rho^2-\\tfrac{\\rho^4}{2}]_0^1=2\\pi\\cdot\\tfrac12=\\pi$. Volume come integrale triplo, $\\operatorname{vol}=\\iint_D(z_{sup}-z_{inf})$."}]},{"pool":"gauss","src":"tipo H · manuale","steps":[{"t":"$\\Sigma$ è il paraboloide $z=x^2+y^2$ con $0\\le z\\le1$ (coppa APERTA), normale uscente dal solido sottostante. Chiudi con il disco $T=\\{x^2+y^2\\le1,\\,z=1\\}$. Con $F=(x,y,z)$, quanto vale $\\iiint_V\\nabla\\cdot F\\,dV$ sul solido $V$ fra paraboloide e disco?","opts":[{"x":"$\\tfrac{3\\pi}{2}$","c":true},{"x":"$3\\pi$"},{"x":"$\\tfrac{\\pi}{2}$"},{"x":"$\\pi$"}],"hint":"$\\nabla\\cdot F=3$; $\\operatorname{vol}(V)=\\int_0^{2\\pi}\\int_0^1(1-\\rho^2)\\rho\\,d\\rho\\,d\\theta$.","sol":"$\\operatorname{vol}(V)=\\int_0^{2\\pi}\\int_0^1(1-\\rho^2)\\rho\\,d\\rho\\,d\\theta=2\\pi(\\tfrac12-\\tfrac14)=\\tfrac{\\pi}{2}$. Con $\\nabla\\cdot F=3$: $\\iiint_V 3\\,dV=\\tfrac{3\\pi}{2}$. Teorema della divergenza.","cont":"Ora sottrai il tappo &rarr;"},{"t":"Il flusso uscente attraverso il tappo $T$ (normale $(0,0,1)$, $F\\cdot n=z=1$) è l'area $\\pi$. Il flusso uscente attraverso la coppa $\\Sigma$ vale allora:","opts":[{"x":"$\\tfrac{3\\pi}{2}-\\pi=\\tfrac{\\pi}{2}$","c":true},{"x":"$\\tfrac{3\\pi}{2}$"},{"x":"$\\tfrac{3\\pi}{2}+\\pi=\\tfrac{5\\pi}{2}$"},{"x":"$\\pi$"}],"hint":"$\\iint_\\Sigma=\\iiint_V\\nabla\\cdot F-\\iint_T$: sottrai il tappo, non sommarlo.","sol":"$\\iint_\\Sigma F\\cdot n\\,dS=\\iiint_V\\nabla\\cdot F\\,dV-\\iint_T F\\cdot n\\,dS=\\tfrac{3\\pi}{2}-\\pi=\\tfrac{\\pi}{2}$. Dimenticare il tappo (rispondere $\\tfrac{3\\pi}{2}$) è l'errore da evitare. Trucco 'tappare e Gauss' (tipo A/H). Teorema della divergenza."}]},{"pool":"gauss","src":"20230907 Es.3","steps":[{"t":"$T=\\{(x-(1-z))^2+y^2\\le(1-z)^2,\\;0\\le z\\le1\\}$ (cono decentrato che si restringe), $\\nabla\\cdot F=4x$. Il flusso uscente vale:","opts":[{"x":"$\\pi$","c":true},{"x":"$\\tfrac{\\pi}{3}$"},{"x":"$4\\pi$"},{"x":"$0$"}],"hint":"Per strati: $\\iint_{E_z}x\\,dA=(1-z)\\cdot\\pi(1-z)^2$ (baricentro del disco in $x=1-z$).","sol":"$\\iiint_T 4x\\,dV=\\int_0^1 4\\big(\\iint_{E_z}x\\,dA\\big)dz$. La sezione a quota $z$ è un disco di raggio $1-z$ centrato in $x=1-z$: $\\iint_{E_z}x\\,dA=(1-z)\\,\\pi(1-z)^2=\\pi(1-z)^3$. Flusso $=\\int_0^1 4\\pi(1-z)^3\\,dz=4\\pi\\cdot\\tfrac14=\\pi$. 20230907 Es.3. Teorema della divergenza."}]},{"pool":"gauss","src":"tipo A · manuale","steps":[{"t":"Flusso uscente di $F=(x,y,0)$ dal cilindro chiuso $\\{x^2+y^2\\le R^2,\\,0\\le z\\le h\\}$ (mantello più due basi):","opts":[{"x":"$2\\pi R^2 h$","c":true},{"x":"$\\pi R^2 h$"},{"x":"$0$ (perché $F_z=0$)"},{"x":"$2\\pi R h$"}],"hint":"$\\nabla\\cdot F=2$; sulle basi $F\\cdot(0,0,\\pm1)=0$, ma Gauss dà comunque $2\\operatorname{vol}$.","sol":"$\\nabla\\cdot F=1+1+0=2$; $\\operatorname{vol}=\\pi R^2h$; flusso $=2\\pi R^2h$. Tutto passa dal mantello: sulle basi $F\\cdot n=0$. Rispondere $0$ confonde 'flusso nullo sulle basi' con 'flusso totale nullo'. Teorema della divergenza."}]},{"pool":"gauss","src":"tipo A · manuale","steps":[{"t":"Volume di $E=\\{x^2+y^2\\le4,\\;0\\le z\\le x^2+y^2\\}$ (sotto il paraboloide, entro il cilindro di raggio $2$):","opts":[{"x":"$8\\pi$","c":true},{"x":"$4\\pi$"},{"x":"$16\\pi$"},{"x":"$\\tfrac{8\\pi}{3}$"}],"hint":"In cilindriche $z$ va da $0$ a $\\rho^2$; non dimenticare il Jacobiano $\\rho$.","sol":"$\\operatorname{vol}=\\int_0^{2\\pi}\\!\\!\\int_0^2\\!\\!\\int_0^{\\rho^2}\\rho\\,dz\\,d\\rho\\,d\\theta=\\int_0^{2\\pi}\\!\\!\\int_0^2\\rho^3\\,d\\rho\\,d\\theta=2\\pi\\cdot\\tfrac{16}{4}=8\\pi$. Il fattore $\\rho$ è il Jacobiano cilindrico: ometterlo darebbe $\\tfrac{8\\pi}{3}$ o simili. Volume come integrale triplo."}]},{"pool":"gauss","src":"tipo H · manuale","steps":[{"t":"Il tappo inferiore di un solido è il paraboloide $z=x^2+y^2$ (sotto), su $D=\\{x^2+y^2\\le1\\}$, con $F=(0,0,z)$. Per il flusso USCENTE da $V$: quale normale e quanto vale il flusso sul tappo?","opts":[{"x":"$n\\,dS=(2x,2y,-1)\\,dx\\,dy$ (verso il basso); flusso $=-\\tfrac{\\pi}{2}$","c":true},{"x":"$n\\,dS=(-2x,-2y,1)\\,dx\\,dy$; flusso $=+\\tfrac{\\pi}{2}$"},{"x":"$n=(0,0,1)$; flusso $=\\tfrac{\\pi}{2}$"},{"x":"flusso $=0$"}],"hint":"Sul fondo del solido l'uscente punta in basso: terza componente negativa.","sol":"Uscente dal fondo = verso il basso: $n\\,dS=(f_x,f_y,-1)\\,dx\\,dy=(2x,2y,-1)\\,dx\\,dy$. $F\\cdot(2x,2y,-1)=-z=-\\rho^2$; $\\iint_D(-\\rho^2)\\,dA=-\\int_0^{2\\pi}\\!\\int_0^1\\rho^3\\,d\\rho\\,d\\theta=-\\tfrac{\\pi}{2}$. Usare $(-2x,-2y,1)$ (entrante) inverte il segno. Teorema della divergenza, orientazione uscente."}]},{"pool":"gauss","src":"tipo A · manuale","steps":[{"t":"Il flusso uscente di $F=(x,y,z)$ da un solido $V$ vale $12$. Allora $\\operatorname{vol}(V)$ è:","opts":[{"x":"$4$","c":true},{"x":"$12$"},{"x":"$36$"},{"x":"$3$"}],"hint":"$\\nabla\\cdot(x,y,z)=3$, quindi flusso $=3\\operatorname{vol}$.","sol":"$\\nabla\\cdot F=3\\Rightarrow 12=3\\operatorname{vol}(V)\\Rightarrow\\operatorname{vol}(V)=4$. Volume ricavato dal flusso via Teorema della divergenza."}]},{"pool":"gauss","src":"tipo A · manuale","steps":[{"t":"Flusso uscente di $F=(x^3,y^3,z^3)$ dalla sfera unitaria $x^2+y^2+z^2\\le1$:","opts":[{"x":"$\\tfrac{12\\pi}{5}$","c":true},{"x":"$4\\pi$"},{"x":"$4\\pi$ perché $\\nabla\\cdot F=3$"},{"x":"$\\tfrac{3\\pi}{5}$"}],"hint":"$\\nabla\\cdot F=3(x^2+y^2+z^2)=3r^2$, NON costante; in sferiche $dV=r^2\\sin\\phi\\,dr\\,d\\phi\\,d\\theta$.","sol":"$\\nabla\\cdot F=3x^2+3y^2+3z^2=3r^2$. $\\Phi=\\iiint 3r^2\\,dV=3\\int_0^1 r^2\\cdot 4\\pi r^2\\,dr=12\\pi\\int_0^1 r^4\\,dr=\\tfrac{12\\pi}{5}$. Con divergenza non costante si integra davvero il volume, non basta $3\\operatorname{vol}$. Teorema della divergenza."}]},{"pool":"gauss","src":"20230621 Es.4","steps":[{"t":"Sia $E=\\{(x,y,z):\\,z^2+3\\le x^2+y^2\\le 3z+1\\}$ (fra iperboloide a una falda e paraboloide) e $F=(x,y,z)$. Vuoi il flusso uscente da $E$: la sua frontiera $\\partial E=\\Sigma_1\\cup\\Sigma_2$ ha DUE facce. Qual e' il primo controllo prima di applicare Gauss?","opts":[{"x":"$F\\in C^1(\\mathbb{R}^3)$ e $E$ e' un solido chiuso e limitato con $\\partial E$ regolare a tratti: Gauss si applica al flusso attraverso TUTTA $\\partial E$.","c":true},{"x":"Gauss si applica separatamente a $\\Sigma_1$ e a $\\Sigma_2$ perche' entrambe sono regolari."},{"x":"Serve prima parametrizzare le due facce: Gauss non riguarda i solidi a due facce."}],"hint":"Il teorema della divergenza lega l'integrale di volume al flusso attraverso l'INTERA frontiera chiusa, non attraverso una singola faccia.","sol":"Teorema della divergenza: ipotesi $F\\in C^1$ su un aperto contenente il solido chiuso e limitato $E$ con $\\partial E$ regolare a tratti. Entrambe valgono, quindi $\\iint_{\\partial E}F\\cdot n\\,dS=\\iiint_E\\nabla\\cdot F\\,dV$; la frontiera va presa tutta insieme, orientata verso l'esterno.","cont":"Calcola la divergenza"},{"t":"$\\nabla\\cdot F$ per $F=(x,y,z)$?","opts":[{"x":"$3$","c":true},{"x":"$1$"},{"x":"$0$"}],"hint":"Somma delle derivate parziali $\\partial_x F_1+\\partial_y F_2+\\partial_z F_3$.","sol":"$\\nabla\\cdot F=\\partial_x x+\\partial_y y+\\partial_z z=1+1+1=3$. Costante: il flusso sara' $3\\,\\operatorname{Vol}(E)$.","cont":"Trova il range di z"},{"t":"Dalla condizione di compatibilita' $z^2+3\\le 3z+1$ si ricava l'intervallo di $z$ su cui $E$ e' non vuoto. Quale?","opts":[{"x":"$1\\le z\\le 2$","c":true},{"x":"$0\\le z\\le 3$"},{"x":"$-1\\le z\\le 2$"}],"hint":"Riporta tutto a sinistra: $z^2-3z+2\\le 0$ e fattorizza.","sol":"$z^2+3\\le 3z+1\\iff z^2-3z+2\\le 0\\iff (z-1)(z-2)\\le 0\\iff 1\\le z\\le 2$. A quota $z$ la sezione e' la corona $\\sqrt{z^2+3}\\le\\rho\\le\\sqrt{3z+1}$.","cont":"Volume in cilindriche"},{"t":"Calcola $\\operatorname{Vol}(E)$ in coordinate cilindriche (jacobiano $\\rho$). Quanto vale?","opts":[{"x":"$\\dfrac{\\pi}{6}$","c":true},{"x":"$\\dfrac{\\pi}{3}$"},{"x":"$\\pi$"}],"hint":"$\\int_0^{2\\pi}\\!d\\theta\\int_1^2\\!dz\\int_{\\sqrt{z^2+3}}^{\\sqrt{3z+1}}\\rho\\,d\\rho$: non dimenticare il fattore $\\rho\\,d\\rho$ (jacobiano), altrimenti l'area della corona sparisce.","sol":"$\\operatorname{Vol}(E)=\\int_0^{2\\pi}\\!d\\theta\\int_1^2\\!dz\\int_{\\sqrt{z^2+3}}^{\\sqrt{3z+1}}\\!\\rho\\,d\\rho=\\pi\\int_1^2\\big[(3z+1)-(z^2+3)\\big]dz=\\pi\\int_1^2(-z^2+3z-2)\\,dz=\\pi\\cdot\\tfrac{1}{6}=\\tfrac{\\pi}{6}$ (Fubini per strati).","cont":"Flusso totale"},{"t":"Quanto vale il flusso uscente totale $\\iint_{\\partial E}F\\cdot n\\,dS$?","opts":[{"x":"$\\dfrac{\\pi}{2}$","c":true},{"x":"$\\dfrac{\\pi}{6}$"},{"x":"$3$"}],"hint":"Divergenza costante $=3$: il flusso e' $3$ per il volume.","sol":"Teorema della divergenza con $\\nabla\\cdot F=3$ costante: $\\iint_{\\partial E}F\\cdot n=\\iiint_E 3\\,dV=3\\operatorname{Vol}(E)=3\\cdot\\tfrac{\\pi}{6}=\\tfrac{\\pi}{2}$.","cont":"Il flusso su UNA sola faccia"},{"t":"Il testo chiede il flusso uscente attraverso il solo iperboloide $\\Sigma_2$. Qual e' la strategia piu' economica?","opts":[{"x":"Calcolare direttamente il flusso sulla faccia piu' semplice $\\Sigma_1$ e ricavare $\\Sigma_2$ per differenza dal totale gia' noto.","c":true},{"x":"Applicare Gauss alla sola $\\Sigma_2$."},{"x":"Calcolare direttamente $\\Sigma_2$: e' comunque piu' rapido del totale."}],"hint":"Il totale lo conosci gia' (Gauss). Ti resta solo la faccia piu' comoda da integrare a mano.","sol":"Modus operandi del flusso su UNA faccia di un solido chiuso: $\\iint_{\\Sigma_2}=\\iint_{\\partial E}-\\iint_{\\Sigma_1}$. Gauss da' il totale; si integra direttamente solo $\\Sigma_1$ (cartesiana $z=f_1$, la piu' semplice) e si sottrae. Additivita' del flusso su $\\partial E=\\Sigma_1\\cup\\Sigma_2$.","cont":"Chiudi il conto"},{"t":"Su $\\Sigma_1:\\,z=\\tfrac13(x^2+y^2-1)$, con $D=\\{4\\le x^2+y^2\\le 7\\}$ e normale uscente $(-f_{1x},-f_{1y},1)$, il flusso diretto vale $-\\tfrac{13}{2}\\pi$. Quanto vale allora il flusso uscente attraverso $\\Sigma_2$?","opts":[{"x":"$7\\pi$","c":true},{"x":"$-6\\pi$"},{"x":"$\\dfrac{\\pi}{2}$"}],"hint":"$\\Phi_{\\Sigma_2}=\\Phi_{\\text{tot}}-\\Phi_{\\Sigma_1}$; attento ai due segni meno.","sol":"$\\Phi_{\\Sigma_2}=\\tfrac{\\pi}{2}-\\left(-\\tfrac{13}{2}\\pi\\right)=\\tfrac{\\pi}{2}+\\tfrac{13}{2}\\pi=7\\pi$. Verifica del diretto: $\\iint_D\\big[x(-\\tfrac23 x)+y(-\\tfrac23 y)+\\tfrac13(x^2+y^2-1)\\big]dA=-\\tfrac13\\iint_D(x^2+y^2+1)\\,dA=-\\tfrac{2\\pi}{3}\\int_2^{\\sqrt7}(1+\\rho^2)\\rho\\,d\\rho=-\\tfrac{2\\pi}{3}\\cdot\\tfrac{39}{4}=-\\tfrac{13}{2}\\pi$."}]},{"pool":"gauss","src":"20240209 Es.1","steps":[{"t":"$T=\\{y\\ge 0,\\;1\\le x^2+y^2+z^2\\le 4,\\;z\\le\\sqrt{x^2+y^2}\\}$ e $F=(x+\\arctan(yz)+3y,\\;yz^2+\\sin z+x,\\;-z-\\cos x)$. Vuoi il flusso uscente. Perche' conviene Gauss e non il calcolo diretto?","opts":[{"x":"$T$ e' chiuso e limitato e $F\\in C^1(\\mathbb{R}^3)$: Gauss trasforma un flusso su una frontiera complicata in un integrale triplo.","c":true},{"x":"Perche' $\\partial T$ e' una sfera e il flusso della sfera e' noto."},{"x":"Perche' $F$ e' conservativo, quindi il flusso e' nullo."}],"hint":"Guarda la forma di $F$: $\\arctan$, $\\sin$, $\\cos$ renderebbero l'integrale di superficie diretto un incubo. La divergenza invece si semplifica.","sol":"Teorema della divergenza: $T$ compatto con $\\partial T$ regolare a tratti, $F\\in C^1$. La convenienza sta nel fatto che $\\nabla\\cdot F$ elide i termini trascendenti. $F$ NON e' conservativo (e comunque il flusso di un campo conservativo non e' nullo in generale).","cont":"Calcola la divergenza"},{"t":"Calcola $\\nabla\\cdot F$.","opts":[{"x":"$z^2$","c":true},{"x":"$1+z^2-\\cos x$"},{"x":"$z^2+3y$"}],"hint":"$\\partial_x(x+\\arctan(yz)+3y)=1$; $\\partial_y(yz^2+\\sin z+x)=z^2$; $\\partial_z(-z-\\cos x)=-1$. I termini con variabili 'estranee' non contribuiscono alla loro derivata.","sol":"$\\nabla\\cdot F=1+z^2+(-1)=z^2$. Il $3y$ e il $\\cos x$ non sopravvivono perche' derivati rispetto alla variabile sbagliata; $\\arctan(yz)$ e $\\sin z$ idem.","cont":"Scegli le coordinate"},{"t":"Come traduci il dominio $T$ in coordinate sferiche $(\\rho,\\varphi,\\theta)$, con $\\varphi$ angolo dall'asse $z$?","opts":[{"x":"$1\\le\\rho\\le 2$, $\\;\\varphi\\in[\\tfrac{\\pi}{4},\\pi]$, $\\;\\theta\\in[0,\\pi]$","c":true},{"x":"$1\\le\\rho\\le 2$, $\\;\\varphi\\in[0,\\tfrac{\\pi}{4}]$, $\\;\\theta\\in[0,2\\pi]$"},{"x":"$0\\le\\rho\\le 2$, $\\;\\varphi\\in[\\tfrac{\\pi}{4},\\pi]$, $\\;\\theta\\in[0,\\pi]$"}],"hint":"$z\\le\\sqrt{x^2+y^2}$ significa $\\rho\\cos\\varphi\\le\\rho\\sin\\varphi$, cioe' $\\tan\\varphi\\ge 1$. $y\\ge 0$ vincola $\\theta$, non $\\varphi$.","sol":"Guscio: $1\\le\\rho\\le 2$. Cono $z\\le\\sqrt{x^2+y^2}\\iff\\cos\\varphi\\le\\sin\\varphi\\iff\\varphi\\in[\\tfrac{\\pi}{4},\\pi]$. Semispazio $y=\\rho\\sin\\varphi\\sin\\theta\\ge 0$ con $\\sin\\varphi\\ge 0\\iff\\sin\\theta\\ge 0\\iff\\theta\\in[0,\\pi]$.","cont":"Fattorizza l'integrale"},{"t":"In sferiche $\\nabla\\cdot F=z^2=\\rho^2\\cos^2\\varphi$ e $dV=\\rho^2\\sin\\varphi\\,d\\rho\\,d\\varphi\\,d\\theta$. L'integrale $\\iiint_T z^2\\,dV$ si fattorizza come:","opts":[{"x":"$\\left(\\int_1^2\\!\\rho^4 d\\rho\\right)\\left(\\int_{\\pi/4}^{\\pi}\\!\\cos^2\\varphi\\sin\\varphi\\,d\\varphi\\right)\\left(\\int_0^{\\pi}\\!d\\theta\\right)$","c":true},{"x":"$\\left(\\int_1^2\\!\\rho^2 d\\rho\\right)\\left(\\int_{\\pi/4}^{\\pi}\\!\\cos^2\\varphi\\,d\\varphi\\right)\\left(\\int_0^{2\\pi}\\!d\\theta\\right)$"},{"x":"$\\left(\\int_1^2\\!\\rho^4 d\\rho\\right)\\left(\\int_{\\pi/4}^{\\pi}\\!\\cos^2\\varphi\\,d\\varphi\\right)\\left(\\int_0^{\\pi}\\!\\sin\\theta\\,d\\theta\\right)$"}],"hint":"$\\rho^2\\cdot\\rho^2=\\rho^4$; il $\\sin\\varphi$ dello jacobiano moltiplica $\\cos^2\\varphi$; l'integrando non dipende da $\\theta$.","sol":"$z^2\\,dV=\\rho^2\\cos^2\\varphi\\cdot\\rho^2\\sin\\varphi\\,d\\rho\\,d\\varphi\\,d\\theta=\\rho^4\\cos^2\\varphi\\sin\\varphi\\,d\\rho\\,d\\varphi\\,d\\theta$. Le variabili si separano (dominio a scatola nelle nuove coordinate) per Fubini.","cont":"Chiudi il conto"},{"t":"Metti insieme i tre fattori. Quanto vale il flusso uscente da $T$?","opts":[{"x":"$\\dfrac{31(4+\\sqrt{2})}{60}\\,\\pi$","c":true},{"x":"$\\dfrac{31}{5}\\pi$"},{"x":"$\\dfrac{31\\sqrt{2}}{60}\\pi$"}],"hint":"$\\int_1^2\\rho^4=\\tfrac{31}{5}$; $\\int_{\\pi/4}^{\\pi}\\cos^2\\varphi\\sin\\varphi\\,d\\varphi=[-\\tfrac{\\cos^3\\varphi}{3}]_{\\pi/4}^{\\pi}$; $\\int_0^\\pi d\\theta=\\pi$.","sol":"$\\int_1^2\\rho^4 d\\rho=\\tfrac{32-1}{5}=\\tfrac{31}{5}$; $\\int_{\\pi/4}^{\\pi}\\cos^2\\varphi\\sin\\varphi\\,d\\varphi=\\left[-\\tfrac{\\cos^3\\varphi}{3}\\right]_{\\pi/4}^{\\pi}=\\tfrac13+\\tfrac{\\sqrt2}{12}=\\tfrac{4+\\sqrt2}{12}$; $\\int_0^\\pi d\\theta=\\pi$. Prodotto: $\\tfrac{31}{5}\\cdot\\tfrac{4+\\sqrt2}{12}\\cdot\\pi=\\dfrac{31(4+\\sqrt2)}{60}\\pi$. (Ricalcolato ex novo: la stampa non riporta il valore numerico.)"}]},{"pool":"gauss","src":"20240619 Es.1","steps":[{"t":"$E=\\{(x,y,z):\\,x^2+2(y-1)^2\\le z\\le y^2-x\\}$ e $F=(e^x+2z,\\;2y,\\;5-z\\,e^x)$: flusso uscente. Prima mossa?","opts":[{"x":"Verificare le ipotesi di Gauss ($E$ chiuso e limitato, $F\\in C^1$) e calcolare $\\nabla\\cdot F$.","c":true},{"x":"Parametrizzare separatamente le due superfici che bordano $E$."},{"x":"Verificare se $F$ e' irrotazionale."}],"hint":"$E$ e' compreso fra due superfici cartesiane $z=\\text{basso}$ e $z=\\text{alto}$: e' un solido normale rispetto a $z$, ideale per Gauss.","sol":"Teorema della divergenza: $E$ e' un dominio normale (chiuso e limitato), $F\\in C^1(\\mathbb{R}^3)$. Prima la divergenza, che qui si semplifica; l'irrotazionalita' non c'entra col flusso.","cont":"Calcola la divergenza"},{"t":"$\\nabla\\cdot F$ per $F=(e^x+2z,\\,2y,\\,5-z\\,e^x)$?","opts":[{"x":"$2$","c":true},{"x":"$2e^x+2$"},{"x":"$e^x+2-e^x z$"}],"hint":"$\\partial_x(e^x+2z)=e^x$ e $\\partial_z(5-z\\,e^x)=-e^x$: si cancellano.","sol":"$\\nabla\\cdot F=e^x+2+(-e^x)=2$. La cancellazione dell'$e^x$ e' il punto: la divergenza e' costante, quindi flusso $=2\\operatorname{Vol}(E)$.","cont":"Proietta e completa il quadrato"},{"t":"La proiezione $D$ di $E$ sul piano $xy$ e' dove basso $\\le$ alto: $x^2+2(y-1)^2\\le y^2-x$. Che insieme e'?","opts":[{"x":"Il disco di centro $(-\\tfrac12,2)$ e raggio $\\tfrac32$.","c":true},{"x":"Il disco di centro $(0,1)$ e raggio $1$."},{"x":"L'ellisse $x^2+2(y-1)^2\\le 1$."}],"hint":"Porta tutto a sinistra e completa i quadrati in $x$ e in $y$.","sol":"$x^2+2(y-1)^2\\le y^2-x\\iff x^2+x+y^2-4y+2\\le 0\\iff (x+\\tfrac12)^2+(y-2)^2\\le \\tfrac94$. Disco centro $(-\\tfrac12,2)$, raggio $\\tfrac32$.","cont":"Volume"},{"t":"Con lo shift $u=x+\\tfrac12,\\;v=y-2$ (disco $u^2+v^2\\le\\tfrac94$), il volume $\\operatorname{Vol}(E)=\\iint_D[(y^2-x)-(x^2+2(y-1)^2)]\\,dA$ vale:","opts":[{"x":"$\\dfrac{81}{32}\\pi$","c":true},{"x":"$\\dfrac{9}{8}\\pi$"},{"x":"$\\dfrac{81}{16}\\pi$"}],"hint":"L'integrando diventa $\\tfrac94-u^2-v^2=\\tfrac94-r^2$; in polari $\\int_0^{2\\pi}\\!\\int_0^{3/2}(\\tfrac94-r^2)r\\,dr\\,d\\theta$.","sol":"$\\operatorname{Vol}(E)=\\iint_{u^2+v^2\\le 9/4}\\!\\!\\big(\\tfrac94-u^2-v^2\\big)dA=2\\pi\\int_0^{3/2}\\!\\big(\\tfrac94 r-r^3\\big)dr=2\\pi\\big[\\tfrac98 r^2-\\tfrac{r^4}{4}\\big]_0^{3/2}=2\\pi\\cdot\\tfrac{81}{64}=\\tfrac{81}{32}\\pi$.","cont":"Flusso"},{"t":"Quanto vale il flusso uscente da $E$?","opts":[{"x":"$\\dfrac{81}{16}\\pi$","c":true},{"x":"$\\dfrac{81}{32}\\pi$"},{"x":"$\\dfrac{81}{64}\\pi$"}],"hint":"Divergenza costante $2$: flusso $=2\\operatorname{Vol}(E)$.","sol":"$\\iint_{\\partial E}F\\cdot n=\\iiint_E 2\\,dV=2\\operatorname{Vol}(E)=2\\cdot\\tfrac{81}{32}\\pi=\\tfrac{81}{16}\\pi$ (teorema della divergenza, div costante)."}]},{"pool":"gauss","src":"20250127 Es.5","steps":[{"t":"La curva $\\gamma:\\,x=1+t^2,\\,z=t,\\;t\\in[1,2]$ ruota di $2\\pi$ attorno all'asse $z$; $E$ e' il solido fra $\\Sigma$ (superficie di rotazione), $z=1$ e $z=2$. Parametrizzazione di $\\Sigma$?","opts":[{"x":"$x=(1+t^2)\\cos\\theta,\\;y=(1+t^2)\\sin\\theta,\\;z=t,\\quad t\\in[1,2],\\;\\theta\\in[0,2\\pi]$","c":true},{"x":"$x=t\\cos\\theta,\\;y=t\\sin\\theta,\\;z=1+t^2$"},{"x":"$x=(1+t^2)\\cos\\theta,\\;y=t\\sin\\theta,\\;z=t$"}],"hint":"Ruotando attorno a $z$, la distanza dall'asse a quota $z=t$ e' il valore $x(t)=1+t^2$.","sol":"Superficie di rotazione standard: si sostituisce $x(t)$ con il raggio $\\sqrt{x^2+y^2}=1+t^2$ e si aggiunge l'angolo $\\theta$. A quota $z=t$ il raggio e' $1+t^2$.","cont":"Gauss e divergenza"},{"t":"Il campo e' $F=\\left(\\dfrac{2x}{1+z^2},\\;\\sin(xz)+20,\\;e^x+y^3\\right)$. Per il flusso uscente da $E$ conviene Gauss: quanto vale $\\nabla\\cdot F$?","opts":[{"x":"$\\dfrac{2}{1+z^2}$","c":true},{"x":"$\\dfrac{2}{1+z^2}+z\\cos(xz)$"},{"x":"$\\dfrac{2}{1+z^2}+3y^2$"}],"hint":"$\\partial_x\\!\\left(\\tfrac{2x}{1+z^2}\\right)=\\tfrac{2}{1+z^2}$; $\\partial_y(\\sin(xz)+20)=0$; $\\partial_z(e^x+y^3)=0$.","sol":"$\\nabla\\cdot F=\\tfrac{2}{1+z^2}+0+0=\\tfrac{2}{1+z^2}$. Dipende solo da $z$: e' il segnale per integrare per strati.","cont":"Integrazione per strati"},{"t":"$\\nabla\\cdot F$ dipende solo da $z$: si integra per strati. A quota $z\\in[1,2]$ la sezione $E_z$ e':","opts":[{"x":"il disco $\\{x^2+y^2\\le (1+z^2)^2\\}$, di area $\\pi(1+z^2)^2$","c":true},{"x":"il disco $\\{x^2+y^2\\le 1+z^2\\}$, di area $\\pi(1+z^2)$"},{"x":"la circonferenza $x^2+y^2=(1+z^2)^2$, di lunghezza $2\\pi(1+z^2)$"}],"hint":"Il bordo $\\Sigma$ a quota $z$ ha raggio $1+z^2$; la SEZIONE piena e' il disco di quel raggio, non la sua circonferenza.","sol":"Fubini per strati: $\\iiint_E g(z)\\,dV=\\int_1^2 g(z)\\,\\big[\\text{area}(E_z)\\big]dz$. Qui $E_z$ e' il disco pieno di raggio $1+z^2$, area $\\pi(1+z^2)^2$.","cont":"Il conto interno"},{"t":"Scrivi il flusso come $\\displaystyle\\int_1^2\\frac{2}{1+z^2}\\cdot\\pi(1+z^2)^2\\,dz$. Cosa succede?","opts":[{"x":"Il denominatore si semplifica: $=2\\pi\\displaystyle\\int_1^2(1+z^2)\\,dz$.","c":true},{"x":"Resta $2\\pi\\displaystyle\\int_1^2\\dfrac{1}{1+z^2}\\,dz$, che da' un $\\arctan$."},{"x":"Non si semplifica nulla: serve l'integrale di $\\dfrac{(1+z^2)^2}{1+z^2}$ per parti."}],"hint":"$\\dfrac{(1+z^2)^2}{1+z^2}=1+z^2$.","sol":"$\\dfrac{2}{1+z^2}\\cdot\\pi(1+z^2)^2=2\\pi(1+z^2)$. La cancellazione del $1+z^2$ e' la ragione per cui il testo sceglie proprio questa superficie di rotazione.","cont":"Chiudi il conto"},{"t":"Quanto vale il flusso uscente da $E$?","opts":[{"x":"$\\dfrac{20\\pi}{3}$","c":true},{"x":"$\\dfrac{14\\pi}{3}$"},{"x":"$\\dfrac{10\\pi}{3}$"}],"hint":"$2\\pi\\big[z+\\tfrac{z^3}{3}\\big]_1^2$.","sol":"$2\\pi\\int_1^2(1+z^2)\\,dz=2\\pi\\big[z+\\tfrac{z^3}{3}\\big]_1^2=2\\pi\\big[(2+\\tfrac83)-(1+\\tfrac13)\\big]=2\\pi\\cdot\\tfrac{10}{3}=\\tfrac{20\\pi}{3}$ (teorema della divergenza + Fubini). TORNA con la stampa."}]},{"pool":"gauss","src":"20250127 Es.1 · refuso accertato","steps":[{"t":"Traccia (superficie cartesiana su un disco $D$): il TESTO scrive $D=\\{x^2+y^2\\le 9\\}$, ma la SOLUZIONE ritrascrive $D=\\{x^2+y^2\\le 3\\}$. Prima di calcolare qualunque cosa, cosa fai?","opts":[{"x":"Mi fermo: la traccia e' internamente incoerente sul raggio di $D$ e va risolta prima di andare avanti.","c":true},{"x":"Uso $x^2+y^2\\le 3$ perche' e' quello scritto nella soluzione ufficiale."},{"x":"Uso la media dei due, $x^2+y^2\\le 6$."}],"hint":"Un raggio $3$ ($x^2+y^2\\le 9$) e un raggio $\\sqrt3$ ($x^2+y^2\\le 3$) danno aree diverse: $9\\pi$ contro $3\\pi$. Non e' un dettaglio.","sol":"Criterio di coerenza interna della traccia: due scritture in conflitto vanno riconciliate con gli altri dati PRIMA di calcolare. $x^2+y^2\\le 9$ e $x^2+y^2\\le 3$ non descrivono lo stesso disco.","cont":"Quale lettura regge?"},{"t":"La soluzione ufficiale usa $m_2(D)=9\\pi$ per l'area del disco. Quale raggio implica?","opts":[{"x":"Raggio $3$ (cioe' $x^2+y^2\\le 9$): $\\pi r^2=9\\pi\\Rightarrow r=3$.","c":true},{"x":"Raggio $\\sqrt3$ (cioe' $x^2+y^2\\le 3$): coerente con $m_2(D)=9\\pi$."},{"x":"Raggio $9$: $\\pi r^2=9\\pi\\Rightarrow r=9$."}],"hint":"$m_2(\\{x^2+y^2\\le R^2\\})=\\pi R^2$.","sol":"$m_2(D)=\\pi R^2=9\\pi\\Rightarrow R^2=9\\Rightarrow R=3$, cioe' $x^2+y^2\\le 9$. La ritrascrizione $\\le 3$ e' incompatibile con l'area $9\\pi$ usata subito dopo.","cont":"Conferma dal bordo"},{"t":"La stessa soluzione parametrizza il bordo come $\\gamma=(3\\cos t,\\,3\\sin t,\\,\\dots)$ e lo chiama 'cerchio di raggio 3'. Questo conferma che:","opts":[{"x":"Il raggio corretto e' $3$; il refuso e' nel '$\\le 3$' della ritrascrizione (doveva restare $\\le 9$).","c":true},{"x":"Il raggio corretto e' $\\sqrt3$; il bordo e' scritto male."},{"x":"La traccia e' irrecuperabile: non si puo' decidere."}],"hint":"$\\gamma=(3\\cos t,3\\sin t)$ percorre $x^2+y^2=9$: raggio $3$. Tre indizi ($m_2=9\\pi$, 'raggio 3', $\\gamma$) contro uno ($\\le 3$).","sol":"Convergenza di tre dati indipendenti ($m_2(D)=9\\pi$, dicitura 'raggio 3', $\\gamma=(3\\cos t,3\\sin t)$) sul raggio $3$. Il refuso e' l'unico dato discorde, il '$\\le 3$'. Lettura corretta: $D=\\{x^2+y^2\\le 9\\}$.","cont":"Ora calcola"},{"t":"Deciso $R=3$: per un campo con $\\nabla\\cdot F=c$ costante su un cilindro di base $D$ e altezza $h$, il flusso uscente e' $c\\cdot\\pi R^2\\cdot h$. Con $R=3$ invece che (erroneamente) $R=\\sqrt3$, il flusso cambia di un fattore:","opts":[{"x":"$3$: le aree stanno come $9\\pi:3\\pi=3:1$.","c":true},{"x":"$\\sqrt3$: i raggi stanno come $3:\\sqrt3=\\sqrt3:1$."},{"x":"$9$: come i quadrati dei raggi $9:1$."}],"hint":"Il flusso e' proporzionale all'AREA di base $\\pi R^2$, non al raggio.","sol":"Flusso $\\propto \\pi R^2$: con $R^2=9$ vs $R^2=3$ il rapporto e' $9:3=3$. Sbagliare il refuso costa un intero fattore $3$ sul risultato: ecco perche' riconoscere l'incoerenza vale piu' del calcolo.","cont":"La lezione"},{"t":"Qual e' il principio operativo che questa traccia insegna, valido a ogni esame?","opts":[{"x":"Confrontare sempre i dati ridondanti (area, raggio, parametrizzazione): se convergono, un valore discorde e' un refuso, non un vincolo.","c":true},{"x":"Fidarsi sempre della soluzione ufficiale quando differisce dal testo."},{"x":"Scegliere il valore che rende il calcolo piu' semplice."}],"hint":"La ridondanza dei dati e' uno strumento di controllo, non rumore.","sol":"Criterio di consistenza: in una traccia i dati sono spesso ridondanti; la ridondanza permette di individuare il refuso (il dato che non torna con gli altri). Mai adottare il valore comodo o quello 'ufficiale' per autorita': si adotta quello coerente col resto."}]},{"pool":"gauss","src":"20240704 Es.1","steps":[{"t":"$E=\\{x^2+y^2+z^2\\le 1,\\;x^2-x+y^2\\le 0,\\;y\\ge 0,\\;z\\ge 0\\}$ e $F=(x^2y,\\;z-xy^2,\\;4z)$: flusso uscente. Gauss e' applicabile? Prima mossa?","opts":[{"x":"Si': $E$ compatto, $F\\in C^1$. Calcolo $\\nabla\\cdot F$, che qui si semplifica.","c":true},{"x":"No: $E$ non e' un solido di rotazione."},{"x":"Si', ma prima devo parametrizzare le quattro facce di $E$."}],"hint":"$E$ e' un pezzo di palla ritagliato da un cilindro e da due semispazi: chiuso e limitato. La divergenza va calcolata subito.","sol":"Teorema della divergenza: $E$ chiuso e limitato con frontiera regolare a tratti, $F\\in C^1(\\mathbb{R}^3)$. Non serve parametrizzare nulla: il flusso diventa un integrale triplo.","cont":"Calcola la divergenza"},{"t":"$\\nabla\\cdot F$ per $F=(x^2y,\\;z-xy^2,\\;4z)$?","opts":[{"x":"$4$","c":true},{"x":"$2xy-2xy+4z$"},{"x":"$2xy+4$"}],"hint":"$\\partial_x(x^2y)=2xy$ e $\\partial_y(z-xy^2)=-2xy$ si cancellano; $\\partial_z(4z)=4$.","sol":"$\\nabla\\cdot F=2xy+(-2xy)+4=4$. Costante: il flusso e' $4\\operatorname{Vol}(E)$.","cont":"Riduci a un volume"},{"t":"Quindi il flusso uscente e':","opts":[{"x":"$4\\operatorname{Vol}(E)$, e resta da calcolare solo il volume.","c":true},{"x":"$4$, indipendentemente dalla forma di $E$."},{"x":"$0$, perche' i termini $\\pm 2xy$ si annullano."}],"hint":"Div costante $c$ implica flusso $=c\\cdot$volume, non $=c$.","sol":"$\\iint_{\\partial E}F\\cdot n=\\iiint_E 4\\,dV=4\\operatorname{Vol}(E)$. Il problema di flusso e' ricondotto a un problema di volume.","cont":"Imposta il volume"},{"t":"$E$ e' sotto la calotta $z=\\sqrt{1-x^2-y^2}$ (con $z\\ge 0$) sopra il semidisco $D=\\{x^2-x+y^2\\le 0,\\,y\\ge 0\\}$. In polari, $D$ e':","opts":[{"x":"$0\\le\\rho\\le\\cos\\theta$, $\\;\\theta\\in[0,\\tfrac{\\pi}{2}]$","c":true},{"x":"$0\\le\\rho\\le 1$, $\\;\\theta\\in[0,\\pi]$"},{"x":"$0\\le\\rho\\le\\cos\\theta$, $\\;\\theta\\in[0,\\pi]$"}],"hint":"$x^2-x+y^2\\le 0\\iff\\rho^2\\le\\rho\\cos\\theta\\iff\\rho\\le\\cos\\theta$; serve $\\cos\\theta\\ge 0$ e $y\\ge 0$.","sol":"$x^2+y^2\\le x\\iff\\rho\\le\\cos\\theta$; disco di centro $(\\tfrac12,0)$ raggio $\\tfrac12$. Con $y=\\rho\\sin\\theta\\ge 0$ e $\\cos\\theta\\ge 0$ si ha $\\theta\\in[0,\\tfrac{\\pi}{2}]$ (meta' superiore).","cont":"Chiudi il conto"},{"t":"$\\operatorname{Vol}(E)=\\displaystyle\\int_0^{\\pi/2}\\!\\!\\int_0^{\\cos\\theta}\\!\\sqrt{1-\\rho^2}\\,\\rho\\,d\\rho\\,d\\theta$. Flusso uscente da $E$?","opts":[{"x":"$\\dfrac{2\\pi}{3}-\\dfrac{8}{9}$","c":true},{"x":"$\\dfrac{2\\pi}{3}$"},{"x":"$\\dfrac{\\pi}{6}-\\dfrac{2}{9}$"}],"hint":"Interno: $\\int_0^{\\cos\\theta}\\!\\sqrt{1-\\rho^2}\\,\\rho\\,d\\rho=\\tfrac13(1-\\sin^3\\theta)$; poi $\\int_0^{\\pi/2}\\sin^3\\theta\\,d\\theta=\\tfrac23$. Ricorda il fattore $4$.","sol":"$\\int_0^{\\cos\\theta}\\sqrt{1-\\rho^2}\\,\\rho\\,d\\rho=\\big[-\\tfrac13(1-\\rho^2)^{3/2}\\big]_0^{\\cos\\theta}=\\tfrac13(1-\\sin^3\\theta)$. Quindi $\\operatorname{Vol}(E)=\\tfrac13\\int_0^{\\pi/2}(1-\\sin^3\\theta)\\,d\\theta=\\tfrac13\\big(\\tfrac{\\pi}{2}-\\tfrac23\\big)=\\tfrac{\\pi}{6}-\\tfrac29$. Flusso $=4\\operatorname{Vol}(E)=\\tfrac{2\\pi}{3}-\\tfrac89$. (Ricalcolato: la stampa da' solo l'impostazione.)"}]},{"pool":"gauss","src":"tipo H · modus operandi · manuale","steps":[{"t":"Un solido chiuso ha frontiera $\\partial V=\\Sigma_1\\cup\\Sigma_2$ e il testo chiede il flusso attraverso la sola $\\Sigma_2$, che e' geometricamente complicata mentre $\\Sigma_1$ e' un disco piano. Strategia corretta?","opts":[{"x":"Applico Gauss a tutto $V$ per il flusso totale, calcolo direttamente il flusso sulla facile $\\Sigma_1$, e ottengo $\\Sigma_2$ per differenza.","c":true},{"x":"Applico Gauss direttamente alla sola $\\Sigma_2$."},{"x":"Calcolo direttamente $\\Sigma_2$: Gauss non aiuta se non voglio l'intera frontiera."}],"hint":"Gauss vale per la frontiera CHIUSA; ma il flusso e' additivo, quindi il totale meno la faccia facile da' quella difficile.","sol":"Modus operandi: $\\Phi_{\\Sigma_2}=\\Phi_{\\partial V}-\\Phi_{\\Sigma_1}$, con $\\Phi_{\\partial V}=\\iiint_V\\nabla\\cdot F\\,dV$ (Gauss) e $\\Phi_{\\Sigma_1}$ per calcolo diretto (superficie semplice). Gauss non si applica a una superficie aperta, ma alla frontiera chiusa si', e l'additivita' del flusso fa il resto."}]},{"pool":"gauss","src":"tipo H · modus operandi · manuale","steps":[{"t":"Davanti a 'calcola il flusso uscente di $F$', prima ancora di scegliere coordinate o parametrizzare, qual e' il primo passo che fa risparmiare piu' tempo?","opts":[{"x":"Calcolare $\\nabla\\cdot F$: spesso termini con variabili 'estranee' ($e^x$ nella prima componente, $\\cos x$ nella terza, $\\sin(xz)$...) si cancellano o si annullano, e la divergenza risulta costante o funzione di una sola variabile.","c":true},{"x":"Parametrizzare subito ogni faccia della frontiera."},{"x":"Verificare se $F$ e' conservativo."}],"hint":"La divergenza usa solo $\\partial_x F_1,\\partial_y F_2,\\partial_z F_3$: i termini che dipendono dalle altre variabili scompaiono.","sol":"Modus operandi: calcolare $\\nabla\\cdot F$ per primo. $\\partial_x F_1$ ignora tutto cio' che sta in $F_1$ e non dipende da $x$; spesso le derivate incrociate di termini simmetrici ($e^x$ in $F_1$ e $-z e^x$ in $F_3$; $x^2 y$ e $-x y^2$) si elidono, lasciando una divergenza banale. E' il passo che decide se l'integrale triplo sara' facile."}]},{"pool":"gauss","src":"tipo H · modus operandi · manuale","steps":[{"t":"Devi calcolare il flusso di $F$ attraverso una superficie APERTA $\\Sigma$ (una calotta senza coperchio). La chiudi con un tappo $T$. Come scegli $T$?","opts":[{"x":"Il tappo piu' semplice su cui il flusso si calcoli a mano — tipicamente un disco piano — e lo oriento verso l'esterno del solido $V=\\Sigma\\cup T$.","c":true},{"x":"Un tappo qualsiasi, purche' chiuda $\\Sigma$: l'orientazione non conta."},{"x":"Un tappo curvo che segua la forma di $\\Sigma$, per simmetria."}],"hint":"Alla fine calcolerai $\\Phi_\\Sigma=\\Phi_{\\partial V}-\\Phi_T$: ti conviene un $T$ dove $\\Phi_T$ sia banale (piano su cui $F\\cdot n$ e' semplice).","sol":"Modus operandi della chiusura: $\\Phi_\\Sigma=\\iiint_V\\nabla\\cdot F\\,dV-\\Phi_T$. Si sceglie $T$ per rendere $\\Phi_T$ facile (disco/piano dove $n$ e' costante), orientato uscente da $V$. L'orientazione conta eccome: sbagliarla cambia il segno di $\\Phi_T$ e quindi il risultato."}]},{"pool":"gauss","src":"tipo H · modus operandi · manuale","steps":[{"t":"Applicato Gauss, resta l'integrale triplo $\\iiint_V\\nabla\\cdot F\\,dV$. Come scegli il sistema di coordinate?","opts":[{"x":"Cilindriche se $V$ ha simmetria attorno a un asse; sferiche se e' una palla o un guscio; per strati se $\\nabla\\cdot F$ dipende solo da $z$.","c":true},{"x":"Sempre cartesiane: gli altri sistemi complicano lo jacobiano."},{"x":"Sempre sferiche: sono le piu' generali."}],"hint":"La scelta segue la simmetria del DOMINIO e la forma della divergenza, non una regola fissa.","sol":"Modus operandi: la geometria di $V$ e la forma di $\\nabla\\cdot F$ dettano le coordinate. Cilindri/coni/paraboloidi $\\to$ cilindriche (jacobiano $\\rho$); palle/gusci/coni con vertice nell'origine $\\to$ sferiche (jacobiano $\\rho^2\\sin\\varphi$); $\\nabla\\cdot F=g(z)$ $\\to$ per strati $\\int g(z)\\,\\text{area}(V_z)\\,dz$. Scegliere male raddoppia il lavoro."}]},{"pool":"gauss","src":"tipo A · manuale","steps":[{"t":"Qual e' il flusso uscente di $F=(y,z,x)$ attraverso una QUALUNQUE superficie chiusa e regolare?","opts":[{"x":"$0$, perche' $\\nabla\\cdot F=0$.","c":true},{"x":"$0$, perche' $F$ e' irrotazionale."},{"x":"Dipende dalla superficie: senza conoscerla non si puo' dire."}],"hint":"Calcola la divergenza, non il rotore. $\\partial_x y+\\partial_y z+\\partial_z x=?$","sol":"$\\nabla\\cdot F=\\partial_x y+\\partial_y z+\\partial_z x=0+0+0=0$, quindi per Gauss il flusso e' nullo su ogni superficie chiusa. Attenzione: $F$ NON e' irrotazionale ($\\nabla\\wedge F=(-1,-1,-1)\\ne 0$); il flusso nullo dipende dalla divergenza, non dal rotore. Confondere $\\nabla\\cdot F$ con $\\nabla\\wedge F$ e' l'errore classico."}]},{"pool":"gauss","src":"tipo A · manuale (Coulomb)","steps":[{"t":"$F=\\dfrac{(x,y,z)}{(x^2+y^2+z^2)^{3/2}}$ (campo coulombiano) ha $\\nabla\\cdot F=0$ dove definito. Puoi concludere subito che il flusso uscente da una sfera $S$ centrata nell'ORIGINE e' nullo?","opts":[{"x":"No: $F$ non e' $C^1$ nell'origine, che sta DENTRO $S$; Gauss non si applica al solido che contiene la singolarita'. Il flusso vale $4\\pi$.","c":true},{"x":"Si': $\\nabla\\cdot F=0$ ovunque, quindi il flusso e' $0$."},{"x":"No, ma il flusso e' $0$ lo stesso per simmetria."}],"hint":"L'ipotesi di Gauss e' $F\\in C^1$ su un aperto che contiene TUTTO il solido, origine inclusa. Qui salta.","sol":"Il teorema della divergenza richiede $F\\in C^1$ su un aperto contenente il solido chiuso; qui $F$ ha una singolarita' non integrabile per la divergenza nell'origine, interna a $S$. Calcolo diretto: $F\\cdot n=1/R^2$ sulla sfera di raggio $R$ e area $4\\pi R^2$, quindi $\\Phi=4\\pi$ (indipendente da $R$: e' l'angolo solido totale). Se invece l'origine e' FUORI dal solido, allora $\\nabla\\cdot F=0$ vale ovunque dentro e il flusso e' $0$."}]},{"pool":"gauss","src":"tipo A · manuale","steps":[{"t":"$\\nabla\\cdot F=g(z)$ dipende SOLO da $z$, e il solido $V$ ha sezioni $V_z$ a quota $z$. Come si riduce $\\iiint_V\\nabla\\cdot F\\,dV$?","opts":[{"x":"$\\displaystyle\\int_{z_{\\min}}^{z_{\\max}} g(z)\\,\\operatorname{area}(V_z)\\,dz$","c":true},{"x":"$\\displaystyle\\int_{z_{\\min}}^{z_{\\max}} g(z)\\,\\operatorname{perimetro}(\\partial V_z)\\,dz$"},{"x":"$g(z)\\cdot\\operatorname{Vol}(V)$"}],"hint":"Fubini per strati: fissato $z$, $g(z)$ e' costante sulla sezione e si porta fuori dall'integrale doppio, che diventa l'area della sezione.","sol":"Fubini (integrazione per strati): $\\iiint_V g(z)\\,dV=\\int\\!\\Big(\\iint_{V_z} g(z)\\,dA\\Big)dz=\\int g(z)\\,\\operatorname{area}(V_z)\\,dz$, perche' $g(z)$ e' costante sullo strato. E' la scorciatoia quando la divergenza dipende da una sola variabile (vedi 20250127 Es.5)."}]},{"pool":"gauss","src":"tipo A · da Paul's Online · manuale","steps":[{"t":"Flusso uscente di $F=(x,y,z)$ dall'ellissoide pieno $\\dfrac{x^2}{a^2}+\\dfrac{y^2}{b^2}+\\dfrac{z^2}{c^2}\\le 1$. Prima $\\nabla\\cdot F$:","opts":[{"x":"$\\nabla\\cdot F=3$","c":true},{"x":"$\\nabla\\cdot F=1$"},{"x":"$\\nabla\\cdot F=x+y+z$"}],"hint":"$\\partial_x x+\\partial_y y+\\partial_z z$.","sol":"$\\nabla\\cdot F=3$. Flusso $=3\\operatorname{Vol}$ dell'ellissoide.","cont":"Il volume"},{"t":"Il volume dell'ellissoide e' $\\tfrac43\\pi abc$. Flusso uscente?","opts":[{"x":"$4\\pi abc$","c":true},{"x":"$\\tfrac43\\pi abc$"},{"x":"$3\\pi abc$"}],"hint":"$3\\cdot\\tfrac43\\pi abc$.","sol":"Per il teorema della divergenza $\\Phi=3\\operatorname{Vol}=3\\cdot\\tfrac43\\pi abc=4\\pi abc$. (Con $a=b=c=R$ ritrovi $4\\pi R^3$, cioe' $3\\cdot\\tfrac43\\pi R^3$, il flusso dalla sfera.)"}]},{"pool":"gauss","src":"tipo A · da Paul's Online · manuale","steps":[{"t":"Flusso uscente di $F=(x^2,y^2,z^2)$ dal cubo $[0,1]^3$. Divergenza?","opts":[{"x":"$\\nabla\\cdot F=2x+2y+2z$","c":true},{"x":"$\\nabla\\cdot F=2(x+y+z)^2$"},{"x":"$\\nabla\\cdot F=x^2+y^2+z^2$"}],"hint":"$\\partial_x x^2=2x$, ecc. Non e' costante: va integrata.","sol":"$\\nabla\\cdot F=2x+2y+2z$. Divergenza non costante: serve l'integrale triplo vero e proprio.","cont":"Integra sul cubo"},{"t":"$\\displaystyle\\iiint_{[0,1]^3}(2x+2y+2z)\\,dV=?$","opts":[{"x":"$3$","c":true},{"x":"$6$"},{"x":"$1$"}],"hint":"Per simmetria i tre addendi danno lo stesso valore; $\\int_0^1 2x\\,dx\\cdot 1\\cdot 1=1$.","sol":"$\\iiint 2x\\,dV=\\big(\\int_0^1 2x\\,dx\\big)\\cdot 1\\cdot 1=1$; idem per $y$ e $z$. Totale $1+1+1=3$. Quindi $\\Phi=3$ (teorema della divergenza)."}]},{"pool":"gauss","src":"tipo A · da MIT 18.02SC · manuale","steps":[{"t":"Flusso uscente di $F=(xy^2,\\,yz^2,\\,zx^2)$ dalla palla unitaria $x^2+y^2+z^2\\le 1$. Divergenza?","opts":[{"x":"$\\nabla\\cdot F=x^2+y^2+z^2$","c":true},{"x":"$\\nabla\\cdot F=y^2+z^2+x^2+2(xy+yz+zx)$"},{"x":"$\\nabla\\cdot F=2(xy+yz+zx)$"}],"hint":"$\\partial_x(xy^2)=y^2$, $\\partial_y(yz^2)=z^2$, $\\partial_z(zx^2)=x^2$.","sol":"$\\nabla\\cdot F=y^2+z^2+x^2=x^2+y^2+z^2=\\rho^2$ in sferiche. Nessun termine misto: le derivate colpiscono ciascuna il quadrato 'giusto'.","cont":"Integra sulla palla"},{"t":"$\\displaystyle\\iiint_{\\text{palla}}(x^2+y^2+z^2)\\,dV$ in sferiche?","opts":[{"x":"$\\dfrac{4\\pi}{5}$","c":true},{"x":"$\\dfrac{4\\pi}{3}$"},{"x":"$4\\pi$"}],"hint":"$\\rho^2\\cdot\\rho^2\\sin\\varphi=\\rho^4\\sin\\varphi$; $\\int_0^1\\rho^4 d\\rho=\\tfrac15$, l'angolare da' $4\\pi$.","sol":"$\\iiint\\rho^2\\,dV=\\int_0^{2\\pi}\\!d\\theta\\int_0^{\\pi}\\!\\sin\\varphi\\,d\\varphi\\int_0^1\\!\\rho^4\\,d\\rho=2\\pi\\cdot 2\\cdot\\tfrac15=\\tfrac{4\\pi}{5}$. Flusso $=\\tfrac{4\\pi}{5}$ (teorema della divergenza). Non dimenticare lo jacobiano $\\rho^2\\sin\\varphi$."}]},{"pool":"gauss","src":"tipo A · manuale (simmetria)","steps":[{"t":"Flusso uscente di $F=(3x^2,\\,0,\\,0)$... anzi, di un campo con $\\nabla\\cdot F=6x$, dalla palla $x^2+y^2+z^2\\le R^2$ centrata nell'origine. Quanto vale?","opts":[{"x":"$0$, perche' $\\iiint 6x\\,dV=0$ per simmetria (la palla e' simmetrica rispetto a $x\\to -x$).","c":true},{"x":"$6\\cdot\\tfrac43\\pi R^3$, perche' div $\\ne 0$."},{"x":"$8\\pi R^3$."}],"hint":"L'integrando $6x$ e' dispari in $x$ e il dominio e' simmetrico rispetto al piano $x=0$: i contributi $x>0$ e $x<0$ si cancellano.","sol":"$\\iint_{\\partial V}F\\cdot n=\\iiint_V 6x\\,dV$; poiche' $6x$ e' dispari in $x$ e la palla e' simmetrica rispetto a $\\{x=0\\}$, l'integrale e' nullo per parita'. Div $\\ne 0$ NON implica flusso $\\ne 0$: conta l'integrale, e la simmetria puo' annullarlo."}]},{"pool":"gauss","src":"tipo A · manuale","steps":[{"t":"Flusso uscente di $F=(x,\\,y,\\,2z)$ dal cilindro pieno $\\{x^2+y^2\\le 4,\\;0\\le z\\le 3\\}$. Divergenza?","opts":[{"x":"$\\nabla\\cdot F=4$","c":true},{"x":"$\\nabla\\cdot F=1+1+2z$"},{"x":"$\\nabla\\cdot F=2$"}],"hint":"$\\partial_x x+\\partial_y y+\\partial_z(2z)=1+1+2$.","sol":"$\\nabla\\cdot F=1+1+2=4$, costante. Flusso $=4\\operatorname{Vol}$.","cont":"Il volume"},{"t":"Il cilindro ha raggio $2$ e altezza $3$. Flusso uscente?","opts":[{"x":"$48\\pi$","c":true},{"x":"$12\\pi$"},{"x":"$24\\pi$"}],"hint":"$\\operatorname{Vol}=\\pi r^2 h=\\pi\\cdot 4\\cdot 3=12\\pi$; poi $\\times 4$.","sol":"$\\operatorname{Vol}=\\pi\\cdot 2^2\\cdot 3=12\\pi$; per Gauss $\\Phi=4\\cdot 12\\pi=48\\pi$. (Fare il calcolo diretto sulle tre facce — mantello + due basi — darebbe lo stesso, ma con molta piu' fatica.)"}]},{"pool":"gauss","src":"tipo A · manuale (concettuale)","steps":[{"t":"Due solidi $V_1$ e $V_2$ di FORMA diversa ma stesso volume; $F$ ha $\\nabla\\cdot F=c$ costante. I flussi uscenti sono uguali?","opts":[{"x":"Si': $\\Phi=c\\operatorname{Vol}$ dipende solo dal volume, non dalla forma.","c":true},{"x":"No: il flusso dipende dalla forma della frontiera."},{"x":"Solo se $V_1$ e $V_2$ hanno anche la stessa area di frontiera."}],"hint":"$\\iiint_V c\\,dV=c\\operatorname{Vol}(V)$: nella formula compare solo il volume.","sol":"Teorema della divergenza con $\\nabla\\cdot F=c$: $\\Phi=\\iiint_V c\\,dV=c\\operatorname{Vol}(V)$. Il flusso e' invariante rispetto alla forma a parita' di volume; l'area della frontiera e' irrilevante. E' la ragione per cui, con div costante, non serve mai parametrizzare le facce."}]},{"pool":"gauss","src":"tipo A · manuale (simmetria)","steps":[{"t":"Nel calcolo di un flusso spunta $\\iint_D(-12x-10+7y)\\,dA$, con $D$ disco centrato nell'origine. Come lo semplifichi senza integrare tutto?","opts":[{"x":"$\\iint_D x\\,dA=\\iint_D y\\,dA=0$ per simmetria, quindi resta $-10\\,m_2(D)$.","c":true},{"x":"Si integra termine per termine in polari, nessuna semplificazione possibile."},{"x":"$\\iint_D x\\,dA=\\iint_D y\\,dA=m_2(D)$, quindi resta $-15\\,m_2(D)$."}],"hint":"$x$ e $y$ sono dispari; su un disco centrato nell'origine i loro integrali si annullano. Sopravvive solo la costante.","sol":"Per parita' su un dominio simmetrico rispetto agli assi, $\\iint_D x\\,dA=\\iint_D y\\,dA=0$. Resta $\\iint_D(-10)\\,dA=-10\\,m_2(D)$. Riconoscere i termini lineari dispari prima di integrare evita conti inutili (e' esattamente cio' che fa la soluzione ufficiale del 20250127 Es.1, con $m_2(D)=9\\pi$)."}]},{"pool":"gauss","src":"tipo A · uso inverso · da LibreTexts · manuale","steps":[{"t":"Sai che il flusso uscente di un campo $F$ con $\\nabla\\cdot F=3$ da un solido $V$ vale $\\Phi=27$. Quanto vale $\\operatorname{Vol}(V)$?","opts":[{"x":"$9$","c":true},{"x":"$81$"},{"x":"$27$"}],"hint":"Uso 'inverso' di Gauss: $\\Phi=(\\nabla\\cdot F)\\operatorname{Vol}$, ricava il volume.","sol":"Da $\\Phi=\\iiint_V\\nabla\\cdot F\\,dV=3\\operatorname{Vol}(V)$ si ricava $\\operatorname{Vol}(V)=\\Phi/3=27/3=9$. E' l'uso inverso del teorema della divergenza: scegliere un campo con divergenza $1$ (o costante nota) trasforma una misura di flusso in una misura di volume — la strategia dietro le 'formule di volume come flusso' (es. $\\operatorname{Vol}=\\tfrac13\\iint_{\\partial V}r\\cdot n\\,dS$, dove $r=(x,y,z)$ ha div $3$)."}]},{"pool":"gauss","src":"tipo A · da Paul's Online · manuale","steps":[{"t":"Flusso uscente di $F=(x,y,z)$ dal tetraedro pieno $V$ di vertici $(0,0,0),(1,0,0),(0,1,0),(0,0,1)$. Divergenza?","opts":[{"x":"$\\nabla\\cdot F=3$","c":true},{"x":"$\\nabla\\cdot F=1$"},{"x":"$\\nabla\\cdot F=3xyz$"}],"hint":"$\\partial_x x+\\partial_y y+\\partial_z z$: la forma del solido non tocca la divergenza.","sol":"$\\nabla\\cdot F=3$. Flusso $=3\\operatorname{Vol}(V)$: Gauss evita di calcolare il flusso sulle quattro facce triangolari separatamente.","cont":"Il volume del tetraedro"},{"t":"I
