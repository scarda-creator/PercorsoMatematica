 candidato di valore più alto, il min quello più basso.","sol":"$\\nabla f=\\lambda\\nabla g$ è condizione necessaria per gli estremi vincolati. Trovati i candidati, si calcola $f$ in ciascuno e si confrontano i valori; Weierstrass garantisce che max e min siano fra loro (su compatto). Il segno di $\\lambda$ non è un criterio di scarto."}]},{"pool":"ottim","src":"20230621 · punto critico fuori dominio","steps":[{"t":"Il sistema $\\nabla f=0$ dà il candidato interno $P=(3,0)$, ma il dominio è $D=\\{2x^2+y^2\\le 1\\}$. $P$ va inserito fra i candidati?","opts":[{"x":"No: $2\\cdot 3^2=18>1$, quindi $P\\notin D$; un punto critico interno conta solo se appartiene al dominio","c":true},{"x":"Sì, i punti critici vanno sempre confrontati"},{"x":"Sì, ma solo il valore $f(P)$, non la posizione"},{"x":"Solo se $P$ giace sul bordo $\\partial D$"}],"hint":"Prima di classificare, controlla l'appartenenza: un candidato interno fuori dal dominio non è ammissibile.","sol":"$P=(3,0)$ non soddisfa $2x^2+y^2\\le 1$ (dà $18>1$): fuori da $D$, si scarta. I candidati interni sono i punti critici che CADONO nel dominio; poi si aggiunge il bordo via Lagrange."}]},{"pool":"ottim","src":"20230504 Es.5 · confronto interno/bordo","steps":[{"t":"Devi trovare max e min ASSOLUTI di $f$ continua sul compatto $D$. Quali insiemi di candidati devi mettere in gara?","opts":[{"x":"Punti critici interni ($\\nabla f=0$ in $\\mathrm{int}\\,D$) UNITI ai punti di Lagrange sul bordo $\\partial D$","c":true},{"x":"Solo i punti critici interni: il bordo non conta"},{"x":"Solo i punti di Lagrange sul bordo"},{"x":"Tutti i punti dove $f$ è definita"}],"hint":"Un estremo assoluto su un compatto sta o all'interno (allora $\\nabla f=0$) o sul bordo (allora Lagrange). Devi coprire entrambi.","sol":"Su un compatto: candidati = {punti critici interni} $\\cup$ {punti di Lagrange su $\\partial D$}. Si valuta $f$ in tutti e si prende il massimo e il minimo. Dimenticare il bordo è la trappola più comune."}]},{"pool":"ottim","src":"tipo D · manuale · TRAPPOLA bordo","steps":[{"t":"Su $D=\\{x^2+y^2\\le 1\\}$ trovi che $f=x+y$ non ha punti critici interni ($\\nabla f=(1,1)\\ne 0$). Che concludi?","opts":[{"x":"Che max e min stanno sul BORDO: vanno cercati con Lagrange su $x^2+y^2=1$, non dichiarati inesistenti","c":true},{"x":"Che $f$ non ha massimo né minimo su $D$"},{"x":"Che $f$ è costante su $D$"},{"x":"Che il minimo è $f(0,0)=0$"}],"hint":"Nessun critico interno è un'informazione utile, non un vicolo cieco: gli estremi devono allora vivere sul bordo.","sol":"$f$ è continua su un compatto: Weierstrass garantisce max e min. Se $\\nabla f\\ne 0$ ovunque all'interno, gli estremi sono sul bordo. Su $x^2+y^2=1$, Lagrange dà $(\\pm 1/\\sqrt2,\\pm 1/\\sqrt2)$: $\\max f=\\sqrt2$, $\\min f=-\\sqrt2$."}]},{"pool":"ottim","src":"tipo D · manuale · coercività","steps":[{"t":"$f$ è continua su tutto $\\mathbb{R}^2$ (nessun bordo) e $f(x,y)\\to+\\infty$ quando $\\|(x,y)\\|\\to\\infty$. Cosa puoi affermare?","opts":[{"x":"$f$ ammette minimo assoluto (coercività), ma non necessariamente massimo","c":true},{"x":"$f$ ammette sia massimo sia minimo assoluti"},{"x":"$f$ non ammette estremi perché $\\mathbb{R}^2$ non è compatto"},{"x":"Il minimo è nel punto critico solo se $\\det H>0$"}],"hint":"Coerciva verso $+\\infty$: fuori da una palla grande $f$ è alta, quindi il minimo (se c'è) è dentro, su un compatto. Il massimo scappa all'infinito.","sol":"Coercività: $f$ continua e $f\\to+\\infty$ all'infinito ammette minimo assoluto. Su una palla $\\overline{B_R}$ abbastanza grande, Weierstrass dà il minimo interno; fuori $f$ è più grande. Il massimo tipicamente non esiste ($f\\to+\\infty$)."}]},{"pool":"ottim","src":"tipo D · manuale · Hessiana 3D","steps":[{"t":"In un punto critico di $f(x,y,z)$ hai $\\det H>0$. Basta per concludere \"minimo\"?","opts":[{"x":"No: in 3D $\\det H>0$ è il prodotto dei tre autovalori; serve il criterio di Sylvester (tutti i minori principali di testa $>0$)","c":true},{"x":"Sì, come in 2D $\\det H>0$ e $f_{xx}>0$ bastano"},{"x":"Sì, $\\det H>0$ in 3D è sempre un minimo"},{"x":"No, in 3D è sempre una sella"}],"hint":"In 3D $\\det H=\\lambda_1\\lambda_2\\lambda_3>0$ vale anche con DUE autovalori negativi (una sella): il solo determinante non basta.","sol":"Criterio di Sylvester per un minimo in $n$ dimensioni: tutti i minori principali di testa positivi ($H_1=f_{xx}>0$, $H_2>0$, $H_3=\\det H>0$). Per un massimo i segni alternano ($-,+,-$). Il solo $\\det H>0$ in 3D è compatibile con una sella."}]},{"pool":"ottim","src":"20230210 Es.2 · regolarità vincolo","steps":[{"t":"Il teorema di Lagrange scrive $\\nabla f=\\lambda\\nabla g$ nei punti del vincolo $g=c$. Quale ipotesi sul vincolo serve perché il moltiplicatore esista?","opts":[{"x":"$\\nabla g\\ne 0$ sul vincolo (regolarità): dove $\\nabla g=0$ la formula può fallire e il punto va esaminato a parte","c":true},{"x":"$g$ deve essere lineare"},{"x":"$f$ deve essere convessa"},{"x":"Il vincolo deve essere limitato"}],"hint":"Se $\\nabla g=0$ il vincolo non ha una normale ben definita e $\\nabla f=\\lambda\\nabla g$ perde senso: sono punti singolari.","sol":"Lagrange richiede la regolarità del vincolo, $\\nabla g\\ne 0$ (rango massimo della matrice dei gradienti). I punti con $\\nabla g=0$ non sono coperti dalla condizione e vanno aggiunti a mano ai candidati."}]},{"pool":"ottim","src":"tipo D · manuale · classificazione","steps":[{"t":"Trova i punti critici di $f(x,y)=x^3-3x+y^2$.","opts":[{"x":"$(1,0)$ e $(-1,0)$","c":true},{"x":"Solo $(0,0)$"},{"x":"$(1,0)$, $(-1,0)$ e $(0,0)$"},{"x":"$(\\pm 1,\\pm 1)$"}],"hint":"Imponi $\\nabla f=0$: $3x^2-3=0$ e $2y=0$. La seconda forza $y=0$.","sol":"$\\nabla f=(3x^2-3,\\;2y)=0\\Rightarrow x=\\pm 1,\\;y=0$. Punti critici $(1,0)$ e $(-1,0)$ (Fermat, condizione necessaria).","cont":"Continua &rarr; classifica"},{"t":"Con $H=\\begin{pmatrix}6x&0\\\\0&2\\end{pmatrix}$, classifica $(1,0)$ e $(-1,0)$.","opts":[{"x":"$(1,0)$ minimo ($\\det H=12>0$, $f_{xx}=6>0$); $(-1,0)$ sella ($\\det H=-12<0$)","c":true},{"x":"Entrambi minimi, perché $f_{yy}=2>0$"},{"x":"$(1,0)$ sella, $(-1,0)$ minimo"},{"x":"Entrambi selle, perché $f_{xy}=0$"}],"hint":"$\\det H=12x$: cambia segno tra i due punti. In $(-1,0)$ vale $-12<0$.","sol":"Test dell'Hessiana: in $(1,0)$ $\\det H=12>0$ e $f_{xx}=6>0\\Rightarrow$ minimo; in $(-1,0)$ $\\det H=-12<0\\Rightarrow$ sella. $f_{xy}=0$ non implica sella."}]},{"pool":"ottim","src":"tipo D · manuale · classificazione","steps":[{"t":"I punti critici di $f(x,y)=x^3+y^3-3xy$ sono:","opts":[{"x":"$(0,0)$ e $(1,1)$","c":true},{"x":"$(0,0)$ e $(-1,-1)$"},{"x":"Solo $(1,1)$"},{"x":"$(0,0)$, $(1,1)$ e $(-1,-1)$"}],"hint":"Da $\\nabla f=0$: $x^2=y$ e $y^2=x$. Sostituendo, $x^4=x\\Rightarrow x(x^3-1)=0$.","sol":"$\\nabla f=(3x^2-3y,\\,3y^2-3x)=0\\Rightarrow y=x^2,\\;x=y^2$. Allora $x^4=x$, cioè $x=0$ o $x=1$: candidati $(0,0)$ e $(1,1)$ (Fermat).","cont":"Continua &rarr; natura di $(0,0)$"},{"t":"Con $H=\\begin{pmatrix}6x&-3\\\\-3&6y\\end{pmatrix}$, che punto è $(0,0)$?","opts":[{"x":"Sella: $\\det H=0-9=-9<0$","c":true},{"x":"Minimo, perché $f=x^3+y^3-3xy$ vale $0$ nell'origine"},{"x":"Massimo"},{"x":"Degenere, perché $f_{xx}=0$"}],"hint":"In $(0,0)$: $f_{xx}=f_{yy}=0$, $f_{xy}=-3$, quindi $\\det H=-9$, non nullo.","sol":"In $(0,0)$: $\\det H=(0)(0)-(-3)^2=-9<0\\Rightarrow$ sella (test dell'Hessiana). $f_{xx}=0$ non rende il test degenere: conta $\\det H$, qui $\\ne 0$."},{"t":"E $(1,1)$?","opts":[{"x":"Minimo locale: $\\det H=36-9=27>0$ e $f_{xx}=6>0$","c":true},{"x":"Massimo locale"},{"x":"Sella"},{"x":"Minimo assoluto su $\\mathbb{R}^2$"}],"hint":"$\\det H=36x y-9$; in $(1,1)$ vale $27>0$. Il segno di $f_{xx}$ dice min o max.","sol":"In $(1,1)$: $\\det H=27>0$ e $f_{xx}=6>0\\Rightarrow$ minimo LOCALE. Non è assoluto: $f(x,0)=x^3\\to-\\infty$, quindi $f$ è illimitata inferiormente su $\\mathbb{R}^2$."}]},{"pool":"ottim","src":"20250127 Es.2","steps":[{"t":"Sia $f(x,y)=x^2-2xy+y^3+1$. Nel punto critico $(0,0)$ l'Hessiana ha $\\det H=-4<0$. Che punto è?","opts":[{"x":"Sella: $\\det H<0$ classifica come sella, indipendentemente dal segno di $f_{xx}$","c":true},{"x":"Minimo, perché $f_{xx}=2>0$"},{"x":"Massimo"},{"x":"Non classificabile col test dell'Hessiana"}],"hint":"Con $\\det H<0$ gli autovalori hanno segni opposti: il segno di $f_{xx}$ è irrilevante.","sol":"Test dell'Hessiana in 2D: $\\det H<0\\Rightarrow$ sella. Il controllo di $f_{xx}$ serve solo a distinguere min da max quando $\\det H>0$.","cont":"Continua &rarr; l'altro punto critico"},{"t":"Stessa $f$, nel punto critico $(2/3,2/3)$ si ha $\\det H=4>0$ e $f_{xx}=2>0$. Che punto è?","opts":[{"x":"Minimo locale: $\\det H>0$ e $f_{xx}>0$","c":true},{"x":"Massimo locale"},{"x":"Sella"},{"x":"Serve calcolare esplicitamente gli autovalori"}],"hint":"Con $\\det H>0$ gli autovalori sono concordi; il segno di $f_{xx}$ dice quale.","sol":"$\\det H>0$ e $f_{xx}>0\\Rightarrow$ minimo locale ($f_{xx}<0\\Rightarrow$ massimo). Test dell'Hessiana in 2D."}]},{"pool":"ottim","src":"20230504 Es.5","steps":[{"t":"Estremi assoluti di $F(x,y)=x^2+y^2-5y$ su $D=\\{1\\le x^2+y^2\\le 16\\}$. Primo passo: il punto critico interno.","opts":[{"x":"$\\nabla F=(2x,2y-5)=0\\Rightarrow P=(0,5/2)$; sta in $D$ ($1\\le 25/4\\le 16$), $F(P)=-25/4$","c":true},{"x":"$\\nabla F=0$ non ha soluzioni: nessun candidato interno"},{"x":"$P=(0,5/2)$ ma va scartato perché il gradiente non è nullo lì"},{"x":"$P=(0,0)$, con $F(P)=0$"}],"hint":"Risolvi $\\nabla F=0$ e verifica che il punto cada DENTRO l'anello $1\\le x^2+y^2\\le 16$.","sol":"$\\nabla F=0\\Rightarrow(0,5/2)$, con $|P|^2=25/4=6{,}25\\in[1,16]$: interno ammissibile. $F(0,5/2)=25/4-25/2=-25/4$. Va confrontato col bordo.","cont":"Continua &rarr; i due bordi"},{"t":"Sui bordi $x^2+y^2=1$ e $x^2+y^2=16$ si sostituisce $x^2=R^2-y^2$: $F=R^2-5y$. Qual è il verdetto assoluto?","opts":[{"x":"$\\min F=F(0,5/2)=-25/4$ (interno); $\\max F=F(0,-4)=36$ (bordo esterno)","c":true},{"x":"$\\min$ e $\\max$ stanno entrambi sul bordo esterno"},{"x":"$\\max F=F(0,4)=-4$"},{"x":"$\\min F=-4$ sul bordo interno"}],"hint":"Su ciascun cerchio $F=R^2-5y$ è massimo per $y$ minimo: $y=-4$ sull'esterno dà $16+20=36$. Confronta con l'interno.","sol":"Bordo interno ($R=1$): $F=1-5y$, $y\\in[-1,1]$, valori in $[-4,6]$. Esterno ($R=4$): $F=16-5y$, $y\\in[-4,4]$, valori in $[-4,36]$. Con l'interno $-25/4$: $\\min=-25/4$, $\\max=36$. Weierstrass su compatto garantisce l'esistenza; il confronto dei candidati dà i valori."}]},{"pool":"ottim","src":"tipo D · manuale · Lagrange","steps":[{"t":"Estremi di $f(x,y)=xy$ sul vincolo $g=x^2+y^2=1$. Lagrange $\\nabla f=\\lambda\\nabla g$ dà:","opts":[{"x":"$y=x$ oppure $y=-x$; sul cerchio: $\\max f=1/2$ in $(\\tfrac1{\\sqrt2},\\tfrac1{\\sqrt2})$, $\\min f=-1/2$","c":true},{"x":"Solo $(1,0)$ e $(0,1)$, con $f=0$"},{"x":"$\\max f=1$, $\\min f=-1$"},{"x":"Nessun candidato: $\\nabla f$ e $\\nabla g$ non sono mai paralleli"}],"hint":"Da $(y,x)=\\lambda(2x,2y)$ ricavi $\\lambda^2=1/4$, cioè $y=\\pm x$. Poi imponi $x^2+y^2=1$.","sol":"Lagrange: $y=2\\lambda x$, $x=2\\lambda y\\Rightarrow\\lambda=\\pm1/2$, quindi $y=x$ o $y=-x$. Sul cerchio $x=\\pm1/\\sqrt2$: $f=xy=\\pm1/2$. $\\max=1/2$, $\\min=-1/2$ (candidati confrontati, Weierstrass su compatto)."}]},{"pool":"ottim","src":"20230705 Es.2 · Lagrange 3D","steps":[{"t":"Estremi di $f(x,y,z)=4-z$ sulla curva $\\Gamma=\\{x^2+y^2=8,\\;x+y+z=1\\}$. Come riduci il problema?","opts":[{"x":"Da $z=1-x-y$: $f=3+x+y$; resta da estremizzare $x+y$ su $x^2+y^2=8$","c":true},{"x":"$f$ è costante perché non dipende da $x,y$"},{"x":"Si annulla $\\nabla f=(0,0,-1)$: nessun candidato"},{"x":"Serve l'Hessiana $3\\times 3$ di $f$"}],"hint":"Usa il vincolo lineare per eliminare $z$: $f=4-z=4-(1-x-y)=3+x+y$.","sol":"Sostituendo $z=1-x-y$ dal piano, $f=3+x+y$. Il problema diventa: estremizzare $x+y$ sul cerchio $x^2+y^2=8$. Un vincolo lineare si elimina per sostituzione; resta un solo vincolo quadratico.","cont":"Continua &rarr; risolvi"},{"t":"Estremizza $x+y$ su $x^2+y^2=8$ (Lagrange o Cauchy-Schwarz):","opts":[{"x":"$x=y=2\\Rightarrow x+y=4$ (max) e $x=y=-2\\Rightarrow x+y=-4$ (min); quindi $\\max f=7$, $\\min f=-1$","c":true},{"x":"$\\max f=4$, $\\min f=-4$"},{"x":"$\\max(x+y)=8$"},{"x":"$\\max f=3$, $\\min f=3$"}],"hint":"$\\nabla(x+y)=(1,1)\\parallel(2x,2y)\\Rightarrow x=y$; poi $2x^2=8$. Ricorda $f=3+(x+y)$.","sol":"Lagrange: $(1,1)=\\lambda(2x,2y)\\Rightarrow x=y$, e $2x^2=8\\Rightarrow x=\\pm2$. $x+y=\\pm4$, quindi $f=3\\pm4$: $\\max f=7$ in $(2,2,-3)$, $\\min f=-1$ in $(-2,-2,5)$. La curva è compatta: Weierstrass garantisce che questi siano gli estremi assoluti."}]},{"pool":"ottim","src":"20250721 Es.1","steps":[{"t":"Per $F(x,y,z)=x^2 e^{yz}$: dal sistema $\\nabla F=0$ risulta che TUTTI i punti $(0,y,z)$ sono critici. Qual è il minimo assoluto su $\\mathbb{R}^3$?","opts":[{"x":"$0$: $F\\ge 0$ ovunque e $F=0$ su tutto il piano $x=0$, un continuo di punti di minimo","c":true},{"x":"Non esiste minimo perché i punti critici sono infiniti"},{"x":"$-\\infty$"},{"x":"$1$"}],"hint":"Guarda il segno: $F$ è un quadrato per un esponenziale, quindi $F\\ge 0$. Infiniti punti critici non impediscono il minimo.","sol":"$F=x^2e^{yz}\\ge 0$ e $F=0\\iff x=0$: l'insieme dei minimi è il piano $x=0$, il minimo assoluto è $0$. La classificazione via Hessiana è degenere qui (autovalori nulli lungo il piano critico), ma il segno di $F$ risolve direttamente."}]},{"pool":"ottim","src":"tipo D · manuale · degenere min","steps":[{"t":"Classifica l'origine per $f(x,y)=x^4+y^4$. L'Hessiana in $(0,0)$ è nulla ($\\det H=0$).","opts":[{"x":"Minimo assoluto: il test dell'Hessiana è muto, ma $f\\ge 0=f(0,0)$ direttamente","c":true},{"x":"Sella, perché $\\det H=0$"},{"x":"Il test dell'Hessiana dice che è degenere, quindi non è un estremo"},{"x":"Massimo, perché $H=0$"}],"hint":"$\\det H=0$ non classifica: torna alla definizione. Quanto vale $f$ fuori dall'origine rispetto a $f(0,0)=0$?","sol":"$\\nabla f=(4x^3,4y^3)=0$ solo in $(0,0)$; l'Hessiana è la matrice nulla, test inconcludente ($\\det H=0$). Ma $f=x^4+y^4>0$ per $(x,y)\\ne(0,0)$ e $f(0,0)=0$: minimo assoluto. Il caso degenere si risolve con la definizione, non con l'Hessiana."}]},{"pool":"ottim","src":"tipo D · manuale · TRAPPOLA degenere","steps":[{"t":"Per $f(x,y)=x^2-y^4$ l'Hessiana in $(0,0)$ è $\\mathrm{diag}(2,0)$, semidefinita positiva ($\\det H=0$). Che punto è davvero?","opts":[{"x":"Sella: lungo l'asse $x$ $f=x^2>0$, lungo l'asse $y$ $f=-y^4<0$; l'Hessiana semidefinita non decideva","c":true},{"x":"Minimo, perché l'Hessiana è semidefinita POSITIVA"},{"x":"Minimo, perché $f_{xx}=2>0$"},{"x":"Massimo"},{"x":"Non è un punto critico"}],"hint":"Hessiana semidefinita con un autovalore nullo: NON garantisce estremo. Guarda $f$ lungo le direzioni deboli (asse $y$).","sol":"$\\det H=0$: caso degenere, l'Hessiana semidefinita positiva NON implica minimo. Direttamente: $f(x,0)=x^2>0$ ma $f(0,y)=-y^4<0$ vicino all'origine: valori di entrambi i segni $\\Rightarrow$ sella. Trattare la semidefinita come definita è l'errore da evitare."}]},{"pool":"ottim","src":"tipo D · manuale · Lagrange ellisse","steps":[{"t":"Estremi di $f(x,y)=x$ sul vincolo $g=x^2+4y^2=4$. Lagrange dà:","opts":[{"x":"$y=0$, quindi $x=\\pm2$: $\\max f=2$ in $(2,0)$, $\\min f=-2$ in $(-2,0)$","c":true},{"x":"$x=0$, quindi $\\max f=0$"},{"x":"$\\max f=4$, $\\min f=-4$"},{"x":"Nessun candidato: $\\nabla f=(1,0)$ non è mai parallelo a $\\nabla g$"}],"hint":"$(1,0)=\\lambda(2x,8y)$: la seconda componente dà $8\\lambda y=0$. Con $\\lambda\\ne0$ resta $y=0$.","sol":"Lagrange: $1=2\\lambda x$, $0=8\\lambda y$. La seconda forza $y=0$ (se $\\lambda=0$ la prima è impossibile). Sul vincolo $x^2=4\\Rightarrow x=\\pm2$: $\\max f=2$, $\\min f=-2$. Sono i vertici dell'ellisse sull'asse $x$."}]},{"pool":"ottim","src":"tipo D · manuale · sella","steps":[{"t":"Classifica l'unico punto critico di $f(x,y)=x^2-y^2$.","opts":[{"x":"$(0,0)$ è una sella: $H=\\mathrm{diag}(2,-2)$, $\\det H=-4<0$","c":true},{"x":"$(0,0)$ è un minimo, perché $f_{xx}=2>0$"},{"x":"$(0,0)$ è un massimo, perché $f_{yy}=-2<0$"},{"x":"Non ci sono punti critici"}],"hint":"Autovalori $2$ e $-2$: segni opposti. Una direzione sale, l'altra scende: prototipo di sella.","sol":"$\\nabla f=(2x,-2y)=0\\Rightarrow(0,0)$. $H=\\mathrm{diag}(2,-2)$, $\\det H=-4<0\\Rightarrow$ sella (test dell'Hessiana). È il controesempio standard a \"$\\nabla f=0\\Rightarrow$ estremo\"."}]},{"pool":"ottim","src":"tipo D · manuale · assoluti su disco","steps":[{"t":"Max e min ASSOLUTI di $f(x,y)=xy$ su $D=\\{x^2+y^2\\le 1\\}$. Interno: $\\nabla f=0$ dà $(0,0)$, una sella con $f=0$. Che fai di questo candidato?","opts":[{"x":"Lo tengo comunque in gara col suo valore $f(0,0)=0$: sul compatto conto i VALORI, non la natura locale","c":true},{"x":"Lo scarto perché è una sella, non un estremo locale"},{"x":"È già il minimo assoluto perché $f(0,0)=0$"},{"x":"Lo scarto perché $\\det H<0$"}],"hint":"Per gli estremi ASSOLUTI su un compatto conta il valore di $f$ nei candidati, non se localmente sono min/max/sella.","sol":"Sul bordo, Lagrange (come per $xy$ su $x^2+y^2=1$) dà $f=\\pm1/2$. Confronto: candidato interno $0$, candidati di bordo $\\pm1/2$. $\\max f=1/2$, $\\min f=-1/2$: entrambi sul bordo. Il punto interno, pur sella, entra col valore $0$ e semplicemente non vince."}]},{"pool":"ottim","src":"tipo D · manuale · min quadratica","steps":[{"t":"Classifica l'unico punto critico di $f(x,y)=x^2+xy+y^2$.","opts":[{"x":"$(0,0)$ minimo: $H=\\begin{pmatrix}2&1\\\\1&2\\end{pmatrix}$, $\\det H=3>0$ e $f_{xx}=2>0$","c":true},{"x":"$(0,0)$ sella, perché c'è il termine misto $xy$"},{"x":"$(0,0)$ massimo"},{"x":"Nessun punto critico, perché $f>0$"}],"hint":"Il termine $xy$ non implica sella: conta $\\det H=f_{xx}f_{yy}-f_{xy}^2=4-1=3>0$.","sol":"$\\nabla f=(2x+y,\\,x+2y)=0\\Rightarrow(0,0)$. $\\det H=2\\cdot2-1^2=3>0$ e $f_{xx}=2>0\\Rightarrow$ minimo (test dell'Hessiana). La forma è definita positiva; il minimo è anche assoluto ($f$ coerciva)."}]},{"pool":"ottim","src":"20220504 Es.2 · assoluti 3D vincolati","steps":[{"t":"Estremi assoluti di $f(x,y,z)=x^2+y^2-z^2$ su $D=\\{x^4+y^4+2z^4\\le 1\\}$. Il punto critico interno è $O=(0,0,0)$ con $f(O)=0$. È il minimo?","opts":[{"x":"No: $O$ è una sella (autovalori $2,2,-2$); min e max stanno sul bordo, da cercare con Lagrange","c":true},{"x":"Sì, $f(O)=0$ è il minimo assoluto"},{"x":"Sì, perché $O$ è l'unico punto critico interno"},{"x":"$O$ va scartato perché sul bordo"}],"hint":"$H(O)=\\mathrm{diag}(2,2,-2)$: due positivi e uno negativo. È una sella, non un estremo: il bordo compatto ospita gli assoluti.","sol":"$O$ ha $H=\\mathrm{diag}(2,2,-2)$: sella (autovalori discordi), non estremo. $D$ è compatto: Weierstrass dà max/min, che vanno cercati sul bordo $x^4+y^4+2z^4=1$ via Lagrange.","cont":"Continua &rarr; il bordo"},{"t":"Sul bordo, i candidati di Lagrange danno tra gli altri $(0,0,\\pm 2^{-1/4})$ con $2z^4=1$. Quanto vale lì $f$, e chi è il minimo assoluto?","opts":[{"x":"$f=-z^2=-1/\\sqrt2$: è il minimo assoluto (il massimo, $\\sqrt2$, sta dove $x^4+y^4=1$, $z=0$)","c":true},{"x":"$f=0$, uguale al centro"},{"x":"$f=-1$, il minimo"},{"x":"$f=1$, il minimo"}],"hint":"In $(0,0,2^{-1/4})$: $z^2=(2^{-1/4})^2=2^{-1/2}=1/\\sqrt2$, e $f=-z^2$. Il termine $-z^2$ tira $f$ verso il basso.","sol":"In $(0,0,\\pm2^{-1/4})$: $f=-z^2=-1/\\sqrt2$, il valore più basso $\\Rightarrow\\min f=-1/\\sqrt2$. Il massimo si ha dove $z=0$ e $x^4+y^4=1$ è \"usato\" per $x^2+y^2$: es. $x=y=2^{-1/4}$ dà $f=2\\cdot2^{-1/2}=\\sqrt2$. Weierstrass + Lagrange sul bordo."}]},{"pool":"ottim","src":"20240209 Es.2 · critici liberi 3D","steps":[{"t":"Per $f(x,y,z)=2x^3+yx^2+y^2z-9z$, quante equazioni scalari impone $\\nabla f=0$ e cosa sono?","opts":[{"x":"Tre: $f_x=6x^2+2xy=0$, $f_y=x^2+2yz=0$, $f_z=y^2-9=0$ (sistema per i candidati)","c":true},{"x":"Una sola: $f=0$"},{"x":"Due, perché $z$ compare linearmente"},{"x":"Tre, ma sono già i minimi essendo $f$ un polinomio"}],"hint":"$\\nabla f=0$ è un sistema con tante equazioni quante le variabili: qui tre derivate parziali annullate.","sol":"$\\nabla f=(6x^2+2xy,\\;x^2+2yz,\\;y^2-9)=0$: tre equazioni. Da $f_z=0$: $y=\\pm3$. Sono i CANDIDATI (Fermat, necessaria); la classificazione richiede poi l'Hessiana $3\\times3$ e il criterio di Sylvester, dove $\\det H>0$ da solo non basterebbe."}]},{"pool":"ottim","src":"tipo D · manuale · modus operandi · ordine d'attacco degli estremi assoluti su un compatto","steps":[{"t":"Devi trovare massimo e minimo ASSOLUTI di $f$ continua su un compatto $D\\subset\\mathbb{R}^2$. Qual e' il primo passo e cosa garantisce che i due valori esistano?","opts":[{"x":"Il teorema di Weierstrass garantisce l'esistenza ($f$ continua su compatto); la strategia e' raccogliere i candidati: punti critici interni ammissibili $+$ punti del bordo.","c":true},{"x":"Basta risolvere $\\nabla f=0$: i punti critici interni danno gia' max e min assoluti."},{"x":"Si applica subito Lagrange su tutto $D$, interno compreso."}],"hint":"Il bordo non e' opzionale, e l'esistenza non la dà $\\nabla f=0$.","sol":"Teorema di Weierstrass: $f$ continua su un compatto assume massimo e minimo. La strategia standard raccoglie i candidati (critici interni $+$ bordo); $\\nabla f=0$ dà solo i critici interni, non l'esistenza né il bordo.","cont":"Interno"},{"t":"Passi all'interno: risolvi $\\nabla f=0$ e trovi il candidato $P$. Verifichi pero' che $P$ cade FUORI da $D$ (oppure esattamente sul bordo). Cosa ne fai?","opts":[{"x":"Lo scarto dai candidati interni: un punto critico non ammissibile non entra; se sta sul bordo lo cattura l'analisi del bordo.","c":true},{"x":"Lo tengo comunque: $\\nabla f=0$ e' condizione sufficiente di estremo."},{"x":"Concludo che $f$ non ha estremi su $D$."}],"hint":"Ammissibilita' prima di tutto: il candidato deve stare nel dominio.","sol":"Definizione di candidato interno ammissibile: un punto critico serve solo se appartiene all'interno del dominio. Fuori da $D$ non e' ammissibile; sul bordo lo cattura l'analisi del bordo.","cont":"Confronto"},{"t":"Hai la lista completa: critici interni ammissibili $+$ candidati di bordo. Perche' il CONFRONTO dei valori e' l'unico passo che decide, e la classificazione locale (max/sella via Hessiana) non serve?","opts":[{"x":"Perche' max/min ASSOLUTI si leggono solo confrontando $f$ su tutti i candidati (il piu' grande e' il massimo, il piu' piccolo il minimo): la natura locale di un punto critico non dice nulla sul confronto globale.","c":true},{"x":"Serve l'Hessiana: il minimo assoluto e' il critico con $\\det H>0$ e $f_{xx}>0$."},{"x":"Il massimo assoluto sta sempre sul bordo, il minimo sempre all'interno."}],"hint":"Locale non e' globale: un massimo locale puo' non essere assoluto.","sol":"Per gli estremi ASSOLUTI vale solo il confronto dei valori: $\\max=\\max f$, $\\min=\\min f$ sui candidati. Il criterio dell'Hessiana (classificazione locale) e' irrilevante qui.","cont":"Chiudi"}]},{"pool":"ottim","src":"tipo D · manuale · modus operandi · Lagrange contro sostituzione sul bordo","steps":[{"t":"Devi ottimizzare $f$ sul bordo $\\{g(x,y)=c\\}$. Quando conviene la SOSTITUZIONE invece di Lagrange?","opts":[{"x":"Quando il vincolo si risolve esplicitamente in una variabile (o si parametrizza con un solo parametro), riducendo a un problema 1D $\\phi(t)$ da studiare con $\\phi'(t)=0$.","c":true},{"x":"Mai: sul bordo Lagrange e' sempre obbligatorio."},{"x":"Sempre, anche in 3D con due vincoli."}],"hint":"Se ricavi $y=y(x)$ dal vincolo, resti con una variabile sola.","sol":"Metodo di sostituzione: se $g=c$ si esplicita in una variabile, il problema vincolato diventa lo studio di $\\phi(t)$ di una sola variabile (teorema di Fermat 1D: $\\phi'=0$, piu' gli estremi dell'intervallo).","cont":"Attenzione"},{"t":"Sul cerchio $x^2+y^2=R^2$ preferisci parametrizzare $x=R\\cos t,\\ y=R\\sin t$. Cosa NON devi dimenticare per non perdere candidati?","opts":[{"x":"Coprire tutto il vincolo: percorrere l'intero $t\\in[0,2\\pi]$ (curva chiusa), trattare ogni componente del bordo, e includere gli estremi dell'intervallo se il parametro e' limitato.","c":true},{"x":"Basta un quarto di giro per simmetria, sempre valido."},{"x":"Gli estremi dell'intervallo del parametro non contano mai."}],"hint":"Un pezzo di curva non percorso e' un candidato perso.","sol":"Copertura del vincolo: la parametrizzazione deve percorrere l'INTERA curva (cerchio: $t\\in[0,2\\pi]$) e includere gli estremi se il parametro e' vincolato; ogni componente del bordo va parametrizzata a parte.","cont":"Quando Lagrange"},{"t":"Quando invece Lagrange e' la scelta giusta?","opts":[{"x":"Quando il vincolo non si esplicita comodamente (es. $x^4+y^4=1$) o in dimensione superiore / con piu' vincoli: $\\nabla f=\\lambda\\nabla g$ evita di risolvere $g=c$.","c":true},{"x":"Mai: la sostituzione e' sempre piu' veloce."},{"x":"Solo quando $f$ e' lineare."}],"hint":"Se non riesci a scrivere $y=y(x)$, la sostituzione si blocca.","sol":"Metodo dei moltiplicatori di Lagrange: preferibile quando il vincolo non si esplicita o in dimensione/vincoli multipli; $\\nabla f=\\lambda\\nabla g$ non richiede di risolvere il vincolo.","cont":"Chiudi"}]},{"pool":"ottim","src":"tipo D · manuale · modus operandi · Hessiana degenere e l'inganno delle rette (Peano)","steps":[{"t":"In un punto critico risulta $\\det H=0$ (Hessiana degenere/semidefinita). Cosa puoi e cosa NON puoi concludere dal test?","opts":[{"x":"Il test e' INconclusivo: non puoi concludere né estremo né sella. In particolare $\\det H=0$ NON significa 'non e' un estremo' — serve un'analisi diretta.","c":true},{"x":"$\\det H=0$ implica che il punto non e' un estremo (e' una degenerazione)."},{"x":"$\\det H=0$ con $f_{xx}>0$ implica minimo."}],"hint":"Inconclusivo vuol dire: lavora di piu', non concludere.","sol":"Criterio dell'Hessiana: se $\\det H=0$ il criterio e' inconclusivo — non distingue estremo da sella. Non e' lecito dedurre 'non estremo'; serve analisi diretta (segno, restrizioni, Taylor).","cont":"Le rette"},{"t":"Per $f(x,y)=y^2-4x^2y+3x^4=(y-x^2)(y-3x^2)$, nel punto critico $O$ hai $H(0,0)=\\mathrm{diag}(0,2)$ (degenere). Studi il segno lungo ogni retta $y=mx$. Cosa trovi?","opts":[{"x":"$f(x,mx)=m^2x^2-4mx^3+3x^4\\ge 0$ vicino a $0$ (domina $m^2x^2$; per $m=0$ vale $3x^4$): l'origine appare come minimo locale su OGNI retta.","c":true},{"x":"Lungo qualche retta $f<0$, quindi e' subito una sella."},{"x":"Lungo le rette $f$ cambia segno solo per $m<0$."}],"hint":"Sostituisci $y=mx$ e guarda il termine dominante vicino all'origine.","sol":"Restrizione a rette: $f(x,mx)=m^2x^2-4mx^3+3x^4$, termine dominante $m^2x^2\\ge0$ (e $3x^4$ per $m=0$) $\\Rightarrow$ minimo su ogni retta. Ma e' condizione necessaria, non sufficiente.","cont":"La parabola"},{"t":"Le rette dicono tutte 'minimo'. Provi allora la parabola $y=2x^2$. Cosa succede e cosa insegna?","opts":[{"x":"$f(x,2x^2)=(2x^2-x^2)(2x^2-3x^2)=(x^2)(-x^2)=-x^4<0$: in ogni intorno di $O$ ci sono punti con $f<0$, quindi $O$ NON e' un minimo. Le rette sono necessarie ma non sufficienti: con $\\det H=0$ vanno provate curve o si argomenta il segno direttamente.","c":true},{"x":"Su $y=2x^2$ resta $f\\ge0$, quindi il minimo e' confermato."},{"x":"La parabola non e' ammissibile: conta solo il test dell'Hessiana."}],"hint":"Sostituisci $y=2x^2$ e leggi il segno di $f$.","sol":"Controesempio di Peano: su $y=2x^2$ si ha $f=-x^4<0$, quindi in ogni intorno esistono punti con $f<0$: l'origine non e' estremo. Lezione: quando $\\det H=0$ le rette non bastano.","cont":"Chiudi"}]},{"pool":"ottim","src":"tipo D · manuale · modus operandi · condizione necessaria contro classificazione (Lagrange)","steps":[{"t":"Risolvi il sistema di Lagrange $\\nabla f=\\lambda\\nabla g$ sul vincolo e trovi 4 punti candidati. Cosa sono, di per se'?","opts":[{"x":"Solo candidati: soddisfano una condizione NECESSARIA di estremo vincolato (punti stazionari vincolati), non sono ancora classificati né garantiti estremi.","c":true},{"x":"Sono i 2 massimi e i 2 minimi, gia' classificati dal segno di $\\lambda$."},{"x":"Il candidato con $\\lambda>0$ e' il massimo, quello con $\\lambda<0$ il minimo."}],"hint":"$\\lambda$ misura il rapporto fra i gradienti, non l'ordine dei valori.","sol":"Condizione necessaria di Lagrange: i punti con $\\nabla f=\\lambda\\nabla g$ sono stazionari vincolati (candidati), non classificati. Il moltiplicatore $\\lambda$ non dice se e' max o min.","cont":"Classificare"},{"t":"Il vincolo e' compatto (es. un'ellisse). Come passi da candidati a estremi, e qual e' l'errore classico?","opts":[{"x":"Valuti $f$ su TUTTI i candidati e confronti: il valore piu' grande e' il massimo assoluto, il piu' piccolo il minimo (Weierstrass ne garantisce l'esistenza). L'errore classico e' eleggere un candidato a massimo senza confrontare i valori.","c":true},{"x":"Classifichi ciascuno con l'Hessiana di $f$ (non bordata) e leggi max/min."},{"x":"Il segno di $\\lambda$ decide max vs min: nessun confronto necessario."}],"hint":"Su un vincolo compatto il confronto e' sempre sufficiente.","sol":"Classificazione per confronto (Weierstrass su compatto): valuta $f$ su tutti i candidati e confronta. L'errore classico e' prendere un candidato di Lagrange per il massimo senza il confronto.","cont":"Chiudi"}]},{"pool":"ottim","src":"tipo D · manuale · modus operandi · regolarita' del vincolo ($\\nabla g\\ne0$)","steps":[{"t":"Il teorema di Lagrange scrive $\\nabla f=\\lambda\\nabla g$ nei punti del vincolo $\\{g=c\\}$. Quale ipotesi sul vincolo rende lecita la scrittura, e perche'?","opts":[{"x":"Serve $\\nabla g\\ne 0$ nel punto (punto regolare): garantisce che $\\{g=c\\}$ sia una curva/superficie liscia e che $\\nabla g$ dia la direzione normale, cosi' $\\nabla f\\parallel\\nabla g$.","c":true},{"x":"Serve che $g$ sia lineare."},{"x":"Serve $\\nabla f\\ne0$; il gradiente di $g$ e' irrilevante."}],"hint":"E' l'ipotesi del teorema del Dini che sta sotto Lagrange.","sol":"Ipotesi di regolarita' del vincolo (teorema dei moltiplicatori di Lagrange, via teorema del Dini): $\\nabla g\\ne0$ nel punto garantisce che $\\{g=c\\}$ sia liscia e che $\\nabla g$ generi la normale; solo cosi' $\\nabla f\\parallel\\nabla g$.","cont":"Punto singolare"},{"t":"In un punto $P$ del vincolo risulta $\\nabla g(P)=0$ (vincolo singolare, es. una cuspide). Cosa devi fare per non perdere un possibile estremo?","opts":[{"x":"$P$ NON e' coperto da Lagrange: va aggiunto a mano ai candidati e analizzato direttamente ($\\nabla f=\\lambda\\cdot 0$ non ha soluzione generica). Ignorarlo puo' far perdere un estremo.","c":true},{"x":"Si scarta $P$: se $\\nabla g=0$ allora $P$ non sta sul vincolo."},{"x":"Si applica Lagrange con $\\lambda=0$."}],"hint":"Dove $\\nabla g=0$ il metodo tace: il punto va comunque esaminato.","sol":"Punti singolari del vincolo ($\\nabla g=0$): non coperti da Lagrange, vanno aggiunti a mano ai candidati e studiati direttamente. Trascurarli fa perdere possibili estremi.","cont":"Chiudi"}]},{"pool":"ottim","src":"tipo D · manuale · percorso intero · estremo vincolato su ellisse","steps":[{"t":"Cerca max e min di $f(x,y)=xy$ sull'ellisse $\\dfrac{x^2}{4}+y^2=1$. Imposta: che tipo di problema e', e cosa garantisce l'esistenza degli estremi?","opts":[{"x":"Ottimizzazione vincolata su una CURVA (l'ellisse e' il dominio, non c'e' interno); l'ellisse e' compatta e $f$ continua $\\Rightarrow$ Weierstrass garantisce max e min. Metodo: Lagrange con $g=\\frac{x^2}{4}+y^2-1$.","c":true},{"x":"Si studia $\\nabla f=0$ nell'interno: $(0,0)$ e' il minimo."},{"x":"Non essendoci interno, gli estremi non esistono."}],"hint":"Il vincolo E' il dominio; e' una curva compatta.","sol":"Teorema di Weierstrass: ellisse compatta $+$ $f$ continua $\\Rightarrow$ esistono max/min. Nessun interno da studiare; si usa il metodo di Lagrange.","cont":"Sistema"},{"t":"Scrivi il sistema di Lagrange $\\nabla f=\\lambda\\nabla g$ con $\\nabla f=(y,x)$ e $\\nabla g=\\left(\\frac{x}{2},\\,2y\\right)$.","opts":[{"x":"$y=\\lambda\\,\\frac{x}{2},\\quad x=2\\lambda y,\\quad \\frac{x^2}{4}+y^2=1$.","c":true},{"x":"$y=\\lambda x,\\quad x=\\lambda y,\\quad \\frac{x^2}{4}+y^2=1$."},{"x":"$1=\\lambda\\,\\frac{x}{2},\\quad 1=2\\lambda y$."}],"hint":"$\\nabla f=(f_x,f_y)=(y,x)$; uguaglia componente per componente.","sol":"Sistema di Lagrange con $\\nabla f=(y,x)$, $\\nabla g=(x/2,\\,2y)$: $y=\\lambda x/2$, $x=2\\lambda y$, piu' il vincolo.","cont":"Risolvi"},{"t":"Sostituendo $y=\\lambda x/2$ in $x=2\\lambda y$ ottieni $x=\\lambda^2 x$, cioe' $x(1-\\lambda^2)=0$. Quali casi generano?","opts":[{"x":"Due casi: (i) $x=0\\Rightarrow$ dal vincolo $y=\\pm1$, punti $(0,\\pm1)$; (ii) $\\lambda^2=1\\Rightarrow\\lambda=\\pm1$, che legano $y=\\pm x/2$.","c":true},{"x":"Solo $x=0$: $\\lambda^2=1$ e' impossibile."},{"x":"Solo $\\lambda=\\pm1$; il caso $x=0$ non e' ammissibile."}],"hint":"$x(1-\\lambda^2)=0$: annulla un fattore per volta.","sol":"Fattorizzazione: $x=\\lambda^2x\\Rightarrow x(1-\\lambda^2)=0$. Caso $x=0$ (dà $(0,\\pm1)$) e caso $\\lambda=\\pm1$ (dà $y=\\pm x/2$).","cont":"Candidati"},{"t":"Trova i candidati e valuta $f$. Per $\\lambda=1$ ($y=x/2$) e $\\lambda=-1$ ($y=-x/2$), imponi il vincolo.","opts":[{"x":"$\\lambda=1$: $\\frac{x^2}{2}=1\\Rightarrow x=\\pm\\sqrt2,\\ y=\\pm\\frac{1}{\\sqrt2}$, $f=xy=1$. $\\lambda=-1$: $x=\\pm\\sqrt2,\\ y=\\mp\\frac{1}{\\sqrt2}$, $f=-1$. Nei punti $(0,\\pm1)$: $f=0$.","c":true},{"x":"$\\lambda=1$: $f=2$; $\\lambda=-1$: $f=-2$."},{"x":"In tutti i candidati $f=0$."}],"hint":"Con $y=x/2$: $\\frac{x^2}{4}+\\frac{x^2}{4}=1\\Rightarrow x^2=2$.","sol":"Imposizione del vincolo: con $y=x/2$, $x^2/2=1\\Rightarrow x=\\pm\\sqrt2$, $f=1$; con $y=-x/2$, $f=-1$; nei punti $(0,\\pm1)$, $f=0$.","cont":"Confronto"},{"t":"Confronta i valori $\\{1,-1,0\\}$ e concludi.","opts":[{"x":"Massimo $=1$ nei punti $(\\sqrt2,\\tfrac{1}{\\sqrt2})$ e $(-\\sqrt2,-\\tfrac{1}{\\sqrt2})$; minimo $=-1$ nei punti $(\\sqrt2,-\\tfrac{1}{\\sqrt2})$ e $(-\\sqrt2,\\tfrac{1}{\\sqrt2})$; i punti $(0,\\pm1)$ danno $0$, valore intermedio (non estremi).","c":true},{"x":"$(0,\\pm1)$ sono i minimi perche' $f=0$ e' il valore piu' piccolo."},{"x":"Il massimo e' $0$."}],"hint":"Il piu' grande e' il max, il piu' piccolo il min.","sol":"Confronto dei valori (estremi assoluti su compatto): $\\max=1$, $\\min=-1$; $(0,\\pm1)$ danno un valore intermedio, non estremi.","cont":"Chiudi"}]},{"pool":"ottim","src":"tipo D · manuale · percorso intero · compatto con bordo a due componenti (corona)","steps":[{"t":"Estremi ASSOLUTI di $f(x,y)=x^2+y^2-4x$ sulla corona $D=\\{1\\le x^2+y^2\\le4\\}$. Imposta: quanti insiemi di candidati e perche'?","opts":[{"x":"$D$ e' compatto, $f$ continua $\\Rightarrow$ Weierstrass. Candidati: (a) critici interni ammissibili, (b) bordo, che qui ha DUE componenti — la circonferenza interna $x^2+y^2=1$ e l'esterna $x^2+y^2=4$.","c":true},{"x":"Un solo bordo, quello esterno $x^2+y^2=4$."},{"x":"Nessun bordo: la corona e' un insieme aperto."}],"hint":"La corona e' delimitata da DUE circonferenze.","sol":"Teorema di Weierstrass su compatto. Il bordo della corona ha DUE componenti ($r=1$ e $r=2$): entrambe vanno trattate.","cont":"Interno"},{"t":"Interno: risolvi $\\nabla f=0$ e verifica l'ammissibilita'.","opts":[{"x":"$\\nabla f=(2x-4,\\,2y)=0\\Rightarrow(2,0)$. Ma $2^2+0^2=4$: sta sulla circonferenza ESTERNA, non nell'interno aperto $1<x^2+y^2<4$. Nessun candidato interno; $(2,0)$ sara' pescato dal bordo esterno.","c":true},{"x":"$(2,0)$ e' interno: lo tengo come minimo."},{"x":"$\\nabla f=0$ non ha soluzione."}],"hint":"$2^2+0^2=4$: interno o bordo?","sol":"Ammissibilita': $\\nabla f=(2x-4,2y)=0\\Rightarrow(2,0)$, che sta su $x^2+y^2=4$ (bordo esterno), non nell'interno aperto: scartato come candidato interno.","cont":"Bordo esterno"},{"t":"Bordo esterno $x^2+y^2=4$: riduci $f$ e trova gli estremi lungo questa componente.","opts":[{"x":"Su $x^2+y^2=4$: $f=4-4x$ con $x\\in[-2,2]$. Minimo in $x=2$: $f(2,0)=-4$; massimo in $x=-2$: $f(-2,0)=12$.","c":true},{"x":"$f=4-4x$ ha l'estremo in $x=0$: $f=4$."},{"x":"Su $x^2+y^2=4$ risulta $f=8-4x$."}],"hint":"$x^2+y^2=4\\Rightarrow f=4-4x$; poi $x\\in[-2,2]$.","sol":"Riduzione al bordo (sostituzione): $x^2+y^2=4\\Rightarrow f=4-4x$, $x\\in[-2,2]$; estremi agli estremi dell'intervallo: $f(2,0)=-4$, $f(-2,0)=12$.","cont":"Bordo interno"},{"t":"Bordo interno $x^2+y^2=1$ (la componente che si dimentica): riduci e trova gli estremi.","opts":[{"x":"Su $x^2+y^2=1$: $f=1-4x$ con $x\\in[-1,1]$. Minimo in $x=1$: $f(1,0)=-3$; massimo in $x=-1$: $f(-1,0)=5$.","c":true},{"x":"Il bordo interno non va considerato, e' dentro $D$."},{"x":"Su $x^2+y^2=1$ risulta $f=1$ costante."}],"hint":"Stessa riduzione: $f=1-4x$, $x\\in[-1,1]$.","sol":"Bordo interno (la componente che l'errore classico dimentica): $x^2+y^2=1\\Rightarrow f=1-4x$, $x\\in[-1,1]$: $f(1,0)=-3$, $f(-1,0)=5$.","cont":"Confronto"},{"t":"Confronta tutti i valori $\\{-4,\\,12,\\,-3,\\,5\\}$ e concludi.","opts":[{"x":"Massimo assoluto $=12$ in $(-2,0)$; minimo assoluto $=-4$ in $(2,0)$. Il bordo interno qui non ospita l'estremo, ma andava comunque controllato.","c":true},{"x":"Massimo $=5$ in $(-1,0)$, minimo $=-3$ in $(1,0)$ (solo bordo interno)."},{"x":"Massimo $=4$, minimo $=-4$."}],"hint":"Il piu' grande dei quattro e' il max, il piu' piccolo il min.","sol":"Confronto: $\\max\\{-4,12,-3,5\\}=12$ (max in $(-2,0)$), $\\min=-4$ (min in $(2,0)$).","cont":"Chiudi"}]},{"pool":"ottim","src":"tipo D · manuale · percorso intero · estremo su sfera in 3D (Lagrange)","steps":[{"t":"Max e min di $f(x,y,z)=x+2y+2z$ sulla sfera $x^2+y^2+z^2=9$. Imposta: esistenza e regolarita' del vincolo.","opts":[{"x":"Sfera compatta, $f$ continua $\\Rightarrow$ Weierstrass. $g=x^2+y^2+z^2-9$, $\\nabla g=(2x,2y,2z)=0$ solo in $O$, che NON sta sulla sfera $\\Rightarrow$ vincolo regolare ovunque: Lagrange applicabile. Il vincolo e' la superficie: nessun interno da studiare.","c":true},{"x":"Bisogna anche studiare l'interno della palla con $\\nabla f=0$."},{"x":"$f$ lineare non ha estremi vincolati."}],"hint":"$\\nabla g=0$ solo nell'origine, che non appartiene alla sfera.","sol":"Weierstrass (sfera compatta). Regolarita': $\\nabla g=(2x,2y,2z)=0$ solo in $O\\notin$ sfera $\\Rightarrow$ Lagrange applicabile ovunque; il vincolo e' la superficie, non c'e' interno.","cont":"Sistema"},{"t":"Scrivi il sistema di Lagrange $\\nabla f=\\lambda\\nabla g$ componente per componente e ricava $x,y,z$ in funzione di $\\lambda$.","opts":[{"x":"$1=2\\lambda x,\\ 2=2\\lambda y,\\ 2=2\\lambda z$, con $\\lambda\\ne0\\Rightarrow x=\\frac{1}{2\\lambda},\\ y=\\frac{1}{\\lambda},\\ z=\\frac{1}{\\lambda}$.","c":true},{"x":"$1=\\lambda x,\\ 2=\\lambda y,\\ 2=\\lambda z$."},{"x":"$x=y=z=\\lambda$."}],"hint":"$f_x=1=2\\lambda x$, $f_y=2=2\\lambda y$, $f_z=2=2\\lambda z$.","sol":"Lagrange componente per componente: $1=2\\lambda x$, $2=2\\lambda y$, $2=2\\lambda z$ $\\Rightarrow x=\\frac{1}{2\\lambda}$, $y=z=\\frac{1}{\\lambda}$ ($\\lambda\\ne0$).","cont":"Vincolo"},{"t":"Sostituisci nel vincolo $x^2+y^2+z^2=9$ per trovare $\\lambda$.","opts":[{"x":"$\\frac{1}{4\\lambda^2}+\\frac{1}{\\lambda^2}+\\frac{1}{\\lambda^2}=\\frac{9}{4\\lambda^2}=9\\Rightarrow \\lambda^2=\\frac14\\Rightarrow\\lambda=\\pm\\frac12$.","c":true},{"x":"$\\frac{3}{\\lambda^2}=9\\Rightarrow\\lambda=\\pm\\frac{1}{\\sqrt3}$."},{"x":"$\\lambda=\\pm3$."}],"hint":"$\\frac{1}{4\\lambda^2}+\\frac{2}{\\lambda^2}=\\frac{1+8}{4\\lambda^2}$.","sol":"Vincolo: $\\frac{1}{4\\lambda^2}+\\frac{2}{\\lambda^2}=\\frac{9}{4\\lambda^2}=9\\Rightarrow\\lambda^2=\\frac14\\Rightarrow\\lambda=\\pm\\frac12$.","cont":"Punti"},{"t":"Ricava i due punti candidati da $\\lambda=\\pm\\frac12$.","opts":[{"x":"$\\lambda=\\frac12$: $x=1,\\ y=2,\\ z=2$; $\\lambda=-\\frac12$: $x=-1,\\ y=-2,\\ z=-2$. Verifica: $1+4+4=9$.","c":true},{"x":"$\\lambda=\\frac12$: $x=2,\\ y=1,\\ z=1$."},{"x":"Un solo punto, $\\lambda=\\frac12$."}],"hint":"$x=\\frac{1}{2\\lambda}$, $y=z=\\frac{1}{\\lambda}$.","sol":"$\\lambda=\\frac12\\Rightarrow(1,2,2)$; $\\lambda=-\\frac12\\Rightarrow(-1,-2,-2)$; entrambi verificano $1+4+4=9$.","cont":"Confronto"},{"t":"Valuta $f$ nei due punti, concludi e verifica con una stima nota.","opts":[{"x":"$f(1,2,2)=9$ (massimo); $f(-1,-2,-2)=-9$ (minimo). Croce-verifica con Cauchy-Schwarz: il massimo di $\\vec a\\cdot\\vec x$ sulla sfera di raggio $R$ vale $R\\,|\\vec a|=3\\cdot\\sqrt{1+4+4}=3\\cdot3=9$.","c":true},{"x":"Massimo $=3$, minimo $=-3$."},{"x":"Massimo $=9$, ma il minimo e' $0$ (nell'origine)."}],"hint":"$|\\vec a|=\\sqrt{1^2+2^2+2^2}=3$, $R=3$.","sol":"Confronto: $\\max=9$, $\\min=-9$. Disuguaglianza di Cauchy-Schwarz: $\\max\\vec a\\cdot\\vec x$ su $|\\vec x|=R$ vale $R|\\vec a|=3\\cdot3=9$, conferma.","cont":"Chiudi"}]},{"pool":"ottim","src":"20230504 Es.5","steps":[{"t":"$F(x,y)=x^2+y^2-5y$ sulla corona $D=\\{1\\le x^2+y^2\\le16\\}$: si chiede max e min ASSOLUTI su $D$. Qual e' l'ordine d'attacco corretto?","opts":[{"x":"Esistenza per Weierstrass, poi candidati critici interni a $D$, poi candidati sul bordo (le due circonferenze) via Lagrange, infine confronto dei valori.","c":true},{"x":"Basta studiare l'Hessiana nel punto critico: se e' definita positiva quello e' il minimo assoluto, e il massimo non serve cercarlo."},{"x":"Si parametrizza subito solo la circonferenza esterna $x^2+y^2=16$, perche' il massimo di una forma quadratica sta sempre sul bordo piu' lontano."}],"hint":"Su un compatto l'estremo assoluto sta o in un punto critico interno o sul bordo: nessuna delle due liste va saltata.","sol":"Modus operandi standard per estremi assoluti su un COMPATTO. Per il Teorema di Weierstrass (funzione continua su chiuso e limitato) max e min esistono; poi il Teorema di Fermat dice che un estremo interno annulla il gradiente, mentre sul bordo si usa Lagrange. Il confronto finale dei valori e' obbligatorio: l'Hessiana classifica solo estremi LOCALI, non decide l'assoluto.","cont":"Cerco i critici interni"},{"t":"Punti critici interni di $F$ su $\\mathbb{R}^2$ e loro natura?","opts":[{"x":"$\\nabla F=(2x,\\,2y-5)=0\\Rightarrow P=(0,\\tfrac52)$; $H_F=\\left(\\begin{smallmatrix}2&0\\\\0&2\\end{smallmatrix}\\right)$, autovalori $2,2>0$: minimo locale stretto.","c":true},{"x":"$\\nabla F=(2x,\\,2y-5)=0\\Rightarrow P=(0,\\tfrac52)$, ma $\\det H_F=0$ quindi il test e' inconcludente."},{"x":"Non ci sono punti critici perche' il termine $-5y$ e' lineare e impedisce l'annullamento del gradiente."}],"hint":"Il gradiente si annulla dove $2x=0$ e $2y-5=0$; l'Hessiana e' costante.","sol":"Criterio dell'Hessiana (test delle derivate seconde). $\\nabla F=(2x,2y-5)$ si annulla in $P=(0,5/2)$. $H_F=\\mathrm{diag}(2,2)$ e' definita positiva (autovalori $2,2$, oppure $\\det=4>0$ e $F_{xx}=2>0$ per il criterio di Sylvester): $P$ e' minimo locale stretto. E' anche interno a $D$ perche' $1\\le 25/4\\le16$.","cont":"Perche' esistono gli assoluti"},{"t":"Perche' $F$ ammette massimo e minimo assoluti su $D$?","opts":[{"x":"$D=h^{-1}([1,16])$ con $h(x,y)=x^2+y^2$ continua e' chiuso, ed e' limitato ($D\\subset\\{x^2+y^2<17\\}$): compatto. $F$ continua su compatto -> Teorema di Weierstrass.","c":true},{"x":"Perche' $F$ e' un polinomio, e ogni polinomio ha sempre massimo e minimo assoluti."},{"x":"Perche' $F$ e' convessa, e le funzioni convesse hanno sempre sia massimo sia minimo."}],"hint":"Weierstrass chiede continuita' su un COMPATTO: bisogna certificare chiuso E limitato.","sol":"Teorema di Weierstrass. $D$ e' controimmagine dell'intervallo chiuso $[1,16]$ tramite la funzione continua $h=x^2+y^2$, dunque chiuso; e' contenuto in un disco, dunque limitato: e' compatto. $F$ continua su compatto ha massimo e minimo assoluti. (Attenzione: la convessita' garantirebbe il minimo, non il massimo.)","cont":"Bordo con Lagrange"},{"t":"Sul bordo $\\partial D=\\{h=1\\}\\cup\\{h=16\\}$ si applica Lagrange. La condizione $\\nabla F\\parallel\\nabla h$ (cioe' $\\det\\left(\\begin{smallmatrix}F_x&F_y\\\\h_x&h_y\\end{smallmatrix}\\right)=0$) da':","opts":[{"x":"$\\det\\left(\\begin{smallmatrix}2x&2y-5\\\\2x&2y\\end{smallmatrix}\\right)=2x\\cdot2y-(2y-5)2x=10x=0\\Rightarrow x=0$.","c":true},{"x":"$\\det=2x\\cdot2y-(2y-5)2x=-10x=0$, che vale ovunque perche' e' identicamente nullo."},{"x":"$\\nabla h=0$ sulle circonferenze, quindi Lagrange non e' applicabile e serve la parametrizzazione."}],"hint":"$\\nabla h=(2x,2y)$ non e' mai nullo sul bordo (raggi $\\ge1$): il vincolo e' regolare. Sviluppa il determinante.","sol":"Teorema dei moltiplicatori di Lagrange (forma 2D senza $\\lambda$: $\\nabla F$ e $\\nabla h$ paralleli $\\Leftrightarrow$ determinante nullo). Il vincolo e' regolare perche' $\\nabla h=(2x,2y)\\ne0$ su ogni circonferenza. Sviluppando: $F_xh_y-F_yh_x=4xy-(4xy-10x)=10x$, che si annulla per $x=0$.","cont":"I quattro candidati"},{"t":"Con $x=0$, i candidati di bordo sono:","opts":[{"x":"su $h=1$: $y^2=1\\Rightarrow(0,\\pm1)$; su $h=16$: $y^2=16\\Rightarrow(0,\\pm4)$. Quattro punti.","c":true},{"x":"solo $(0,1)$ e $(0,4)$, perche' i valori negativi di $y$ non sono ammessi nel dominio."},{"x":"solo $(0,\\pm4)$, perche' il massimo di una funzione sta sempre sul bordo esterno."}],"hint":"Su ciascuna circonferenza $x=0$ da due punti (segni opposti di $y$): sono tutti sul bordo, quindi ammissibili.","sol":"Sostituendo $x=0$ nelle due equazioni di vincolo si ottengono $Q_\\pm=(0,\\pm1)$ e $R_\\pm=(0,\\pm4)$. Errore tipico (distrattore): scartare i punti con $y<0$ pensando a un dominio ristretto, o tenere solo il bordo esterno: entrambe le circonferenze fanno parte di $\\partial D$.","cont":"Confronto e conclusione"},{"t":"Confrontando tutti i valori, quali sono min e max assoluti su $D$?","opts":[{"x":"$F(P)=-\\tfrac{25}{4}$, $F(0,-1)=6$, $F(0,1)=-4$, $F(0,-4)=36$, $F(0,4)=-4$: min $=-\\tfrac{25}{4}$ (in $P$), max $=36$ (in $(0,-4)$).","c":true},{"x":"min $=-4$ e max $=36$: il minimo assoluto e' sul bordo interno, non nel punto critico."},{"x":"min $=-\\tfrac{25}{4}$ e max $=6$: il massimo e' in $(0,-1)$ dove $F$ vale $6$."}],"hint":"Calcola $F=x^2+y^2-5y$ in ognuno dei 5 candidati; il minimo interno vince perche' $-25/4<-4$.","sol":"Confronto dei valori (chiude il modus operandi su compatto). $F(0,5/2)=25/4-25/2=-25/4$; $F(0,-1)=1+5=6$; $F(0,1)=1-5=-4$; $F(0,-4)=16+20=36$; $F(0,4)=16-20=-4$. Minimo assoluto $-25/4$ nel critico interno $P$ (piu' basso di ogni candidato di bordo), massimo assoluto $36$ in $(0,-4)$. Nota: il minimo assoluto qui NON e' sul bordo, contro l'intuizione che spinge a guardare solo $\\partial D$.","cont":"E su tutto il piano?"},{"t":"$F$ ammette max/min assoluti su TUTTO $\\mathbb{R}^2$?","opts":[{"x":"$H_F$ definita positiva ovunque $\\Rightarrow F$ strettamente convessa $\\Rightarrow$ min assoluto $F(P)=-\\tfrac{25}{4}$; ma $F(x,0)=x^2\\to+\\infty$, quindi niente max assoluto (illimitata superiormente).","c":true},{"x":"Si': lo stesso $-25/4$ e $36$ valgono su tutto il piano, perche' un minimo/massimo assoluto su un compatto lo e' anche fuori."},{"x":"No a entrambi: senza compattezza il Teorema di Weierstrass non vale, quindi nessun estremo puo' esistere."}],"hint":"Convessita' stretta forza l'esistenza del minimo globale; per il massimo cerca una direzione lungo cui $F$ esplode.","sol":"Criterio di convessita' (Hessiana definita positiva ovunque $\\Rightarrow$ stretta convessita' $\\Rightarrow$ unico minimo globale nel punto critico) piu' analisi di illimitatezza. $F(P)=-25/4$ e' minimo assoluto su $\\mathbb{R}^2$; lungo $x\\to\\infty$ con $y=0$, $F\\to+\\infty$ (o per coercivita': $\\lim_{\\rho\\to\\infty}F=+\\infty$), dunque nessun massimo. L'assenza di compattezza non implica assenza di estremi: qui il minimo esiste per convessita'.","cont":""}]},{"pool":"ottim","src":"20250127 Es.2","steps":[{"t":"$F_0(x,y)=x^2+y^3+1$ sul compatto $E=\\{4x^2+y^4\\le1\\}$. Ordine d'attacco e prima cosa da certificare?","opts":[{"x":"Esistenza per Weierstrass (E compatto), poi critici interni, poi bordo $\\{4x^2+y^4=1\\}$ con Lagrange, poi confronto valori.","c":true},{"x":"Prima si verifica se $F_0$ ha max/min su tutto $\\mathbb{R}^2$; se non ne ha, non ne ha nemmeno su $E$."},{"x":"Si parametrizza subito il bordo con $x=\\tfrac12\\cos t,\\ y=\\sin t$ e si deriva: e' l'unica strada."}],"hint":"E' un compatto: la struttura e' sempre interni + bordo + confronto, dopo aver garantito l'esistenza.","sol":"Modus operandi su compatto. L'esistenza su $E$ NON dipende dal comportamento su $\\mathbb{R}^2$ (su tutto il piano $F_0(0,y)=y^3+1$ e' illimitata: nessun estremo, ma cio' e' irrilevante su $E$). La parametrizzazione del bordo e' un'alternativa a Lagrange, non l'unica via, e comunque $y=\\sin t$ non copre $4x^2+y^4=1$.","cont":"E compatto"},{"t":"Perche' $E=\\{4x^2+y^4\\le1\\}$ e' compatto?","opts":[{"x":"$E=g^{-1}((-\\infty,1])$ con $g=4x^2+y^4$ continua $\\Rightarrow$ chiuso; e $4x^2\\le1,\\ y^4\\le1\\Rightarrow E\\subset[-\\tfrac12,\\tfrac12]\\times[-1,1]$ $\\Rightarrow$ limitato.","c":true},{"x":"Perche' e' definito da una disuguaglianza $\\le$, e ogni insieme di tipo $\\le$ e' automaticamente compatto."},{"x":"Perche' e' convesso, e i convessi sono compatti."}],"hint":"Chiuso = controimmagine di un chiuso via funzione continua; limitato = i due termini positivi sono separatamente $\\le1$.","sol":"Teorema di Weierstrass, ipotesi di compattezza. Chiuso perche' controimmagine di $(-\\infty,1]$ chiuso tramite $g$ continua; limitato perche' $4x^2+y^4\\le1$ forza $4x^2\\le1$ e $y^4\\le1$ simultaneamente. Compatto + $F_0$ continua $\\Rightarrow$ esistono max e min.","cont":"Critici interni"},{"t":"Punto critico interno di $F_0=x^2+y^3+1$ e sua classificazione?","opts":[{"x":"$\\nabla F_0=(2x,3y^2)=0\\Rightarrow(0,0)$; $H(0,0)=\\left(\\begin{smallmatrix}2&0\\\\0&0\\end{smallmatrix}\\right)$, $\\det=0$: test INCONCLUSIVO. A mano $y^3$ cambia segno $\\Rightarrow$ non e' estremo. Valore $F_0(0,0)=1$: resta candidato assoluto.","c":true},{"x":"$(0,0)$ e' una sella per il test dell'Hessiana, esattamente come nel caso $\\alpha=2$: si puo' scartare subito."},{"x":"$(0,0)$ e' minimo locale perche' $F_{xx}=2>0$."}],"hint":"$H(0,0)=\\mathrm{diag}(2,0)$: determinante nullo, il test tace. Guarda $F_0$ lungo l'asse $y$.","sol":"Criterio dell'Hessiana nel caso DEGENERE. $\\nabla F_0=(2x,3y^2)$ si annulla solo in $(0,0)$; $H(0,0)=\\mathrm{diag}(2,0)$ ha $\\det=0$, quindi il test e' inconcludente (la stampa ufficiale scrive 'sella come in $F_2$', ma li' $\\alpha=2$ dava $\\det H=-4<0$: qui NO). Restringendo a $x=0$, $F_0(0,y)=y^3+1$ cambia concavita'/segno attraverso $0$: non e' estremo. Come candidato assoluto vale $F_0(0,0)=1$.","cont":"Lagrange sul bordo"},{"t":"Lagrange sul bordo $\\{g=4x^2+y^4=1\\}$: il sistema $\\det\\left(\\begin{smallmatrix}F_{0x}&F_{0y}\\\\g_x&g_y\\end{smallmatrix}\\right)=0$ diventa:","opts":[{"x":"$\\det\\left(\\begin{smallmatrix}2x&3y^2\\\\8x&4y^3\\end{smallmatrix}\\right)=8xy^3-24xy^2=8xy^2(y-3)=0$, con $4x^2+y^4=1$.","c":true},{"x":"$8xy^3-24xy^2=8xy^2(y+3)=0$, quindi $y=-3$ e' un candidato interno."},{"x":"$\\nabla g=(8x,4y^3)$ non si annulla mai su $E$, quindi Lagrange non serve."}],"hint":"$F_{0x}g_y-F_{0y}g_x=2x\\cdot4y^3-3y^2\\cdot8x$. Raccogli $8xy^2$.","sol":"Teorema di Lagrange (forma determinante). $F_{0x}g_y-F_{0y}g_x=8xy^3-24xy^2=8xy^2(y-3)$. Si annulla per $x=0$, $y=0$, oppure $y=3$. Nota: $\\nabla g=(8x,4y^3)$ si annulla in $(0,0)$, ma quel punto e' interno (non sul bordo), quindi il vincolo e' regolare su $\\{g=1\\}$: Lagrange e' lecito.","cont":"Candidati di bordo"},{"t":"Quali candidati sul bordo (e quale caso si scarta)?","opts":[{"x":"$x=0\\Rightarrow y^4=1\\Rightarrow(0,\\pm1)$; $y=0\\Rightarrow4x^2=1\\Rightarrow(\\pm\\tfrac12,0)$; $y=3$ incompatibile con $4x^2+y^4=1$ (si scarta).","c":true},{"x":"$y=3$ con $x$ dato da $4x^2=1-81<0$: si tiene comunque come candidato complesso."},{"x":"solo $(0,\\pm1)$; i punti con $y=0$ non stanno sul bordo."}],"hint":"$y=3$ darebbe $4x^2=1-81<0$, impossibile. Gli altri due casi danno 4 punti reali.","sol":"Sostituzione nel vincolo. $x=0$: $y^4=1\\Rightarrow y=\\pm1$, cioe' $(0,\\pm1)$. $y=0$: $4x^2=1\\Rightarrow x=\\pm1/2$, cioe' $(\\pm1/2,0)$. $y=3$: $4x^2+81=1$ non ha soluzioni reali, si scarta (distrattore: trascinare un candidato fuori dal vincolo).","cont":"Valori e conclusione"},{"t":"Confronto dei valori di $F_0$: min e max assoluti su $E$?","opts":[{"x":"$F_0(0,0)=1$, $F_0(0,-1)=0$, $F_0(0,1)=2$, $F_0(\\pm\\tfrac12,0)=\\tfrac54$: min $=0$ in $(0,-1)$, max $=2$ in $(0,1)$.","c":true},{"x":"min $=-1$ in $(0,-1)$ e max $=2$ in $(0,1)$ (usando $x^2+y^3$ senza il $+1$)."},{"x":"min $=1$ in $(0,0)$ e max $=\\tfrac54$ in $(\\pm\\tfrac12,0)$."}],"hint":"Ricorda il $+1$: $F_0=x^2+y^3+1$. $F_0(0,-1)=0+(-1)+1=0$.","sol":"Confronto dei valori. Con $F_0=x^2+y^3+1$: $F_0(0,-1)=0-1+1=0$ (min assoluto), $F_0(0,1)=0+1+1=2$ (max assoluto); $F_0(0,0)=1$ e $F_0(\\pm1/2,0)=1/4+1=5/4$ restano intermedi. Nota di fonte: la stampa scrive 'h$=x^2+y^3$' ma calcola $h(Q_1)=1$ ecc., valori che tornano solo col $+1$; ho tenuto il $+1$ (refuso di notazione nella stampa, non errore numerico).","cont":""}]},{"pool":"ottim","src":"20230705 Es.2","steps":[{"t":"$f(x,y,z)=4-z$ sulla curva $\\Gamma=\\{x^2+y^2=8\\}\\cap\\{x+y+z=1\\}$ (cilindro $\\cap$ piano). Come si imposta la ricerca di max/min?","opts":[{"x":"$\\Gamma$ e' compatta (chiusa e limitata), quindi Weierstrass da esistenza; poi Lagrange con DUE vincoli di uguaglianza $g_1=x^2+y^2-8$, $g_2=x+y+z-1$.","c":true},{"x":"Si sostituisce $z=1-x-y$ in $f$ e si minimizza $4-(1-x-y)=3+x+y$ senza vincoli su $x,y$."},{"x":"Si usa Lagrange con un solo moltiplicatore, ignorando il piano perche' $f$ non dipende da $x,y$."}],"hint":"$\\Gamma$ e' l'intersezione di DUE superfici: e' una curva, servono due vincoli simultanei.","sol":"Modus operandi con vincoli multipli. $\\Gamma$ e' una curva chiusa nello spazio: Lagrange a due vincoli chiede $\\nabla f=\\lambda_1\\nabla g_1+\\lambda_2\\nabla g_2$, equivalente ad annullare il determinante $3\\times3$ dei tre gradienti. Sostituire $z$ non basta perche' resta ancora il vincolo $x^2+y^2=8$: la minimizzazione di $3+x+y$ e' vincolata, non libera.","cont":"Perche' esistono"},{"t":"Perche' $f$ ammette max e min su $\\Gamma$?","opts":[{"x":"$\\Gamma$ e' chiusa (vincoli di uguaglianza con funzioni continue) e limitata ($|x|,|y|\\le\\sqrt8$ dal cilindro, $|z|=|1-x-y|\\le1+2\\sqrt8$): compatta. $f$ continua $\\Rightarrow$ Weierstrass.","c":true},{"x":"Perche' $f=4-z$ e' lineare, e le funzioni lineari hanno sempre max e min."},{"x":"Perche' il cilindro e' illimitato in $z$, ma $f$ non dipende da $z$."}],"hint":"Il cilindro limita $x,y$; il piano lega $z$ a $x,y$, quindi limita anche $z$.","sol":"Teorema di Weierstrass. Chiusura: intersezione di due luoghi di zero di funzioni continue. Limitatezza: dal cilindro $|x|,|y|\\le\\sqrt8$, e dal piano $|z|=|1-x-y|\\le1+2\\sqrt8=1+4\\sqrt2$. Compatta + $f$ continua $\\Rightarrow$ max e min esistono. (Il distrattore 'lineare quindi sempre max/min' e' falso in generale: serve il dominio compatto.)","cont":"Sistema di Lagrange"},{"t":"Il sistema $\\det\\left(\\begin{smallmatrix}f_x&f_y&f_z\\\\g_{1x}&g_{1y}&g_{1z}\\\\g_{2x}&g_{2y}&g_{2z}\\end{smallmatrix}\\right)=0$ con $\\nabla f=(0,0,-1)$ da':","opts":[{"x":"$\\det\\left(\\begin{smallmatrix}0&0&-1\\\\2x&2y&0\\\\1&1&1\\end{smallmatrix}\\right)=-(2x-2y)=2(y-x)=0\\Rightarrow x=y$.","c":true},{"x":"$\\det=2x+2y=0\\Rightarrow y=-x$, che con il cilindro da' i due punti."},{"x":"il determinante e' identicamente nullo perche' $\\nabla f$ ha due componenti nulle, quindi ogni punto e' candidato."}],"hint":"Sviluppa lungo la prima riga: solo il termine $-1$ sopravvive, con minore $\\det\\left(\\begin{smallmatrix}2x&2y\\\\1&1\\end{smallmatrix}\\right)$.","sol":"Teorema di Lagrange a due vincoli (condizione di dipendenza lineare dei tre gradienti = determinante nullo). Sviluppo lungo la prima riga: $-1\\cdot(2x\\cdot1-2y\\cdot1)=-(2x-2y)=2(y-x)$. Si annulla per $x=y$.","cont":"I due punti"},{"t":"Con $x=y$ e i due vincoli, quali punti si trovano?","opts":[{"x":"$2x^2=8\\Rightarrow x=\\pm2$; $z=1-2x$: $P=(2,2,-3)$ e $Q=(-2,-2,5)$.","c":true},{"x":"$x^2=8\\Rightarrow x=\\pm2\\sqrt2$, dando quattro punti sul cilindro."},{"x":"solo $P=(2,2,-3)$, perche' $z$ deve essere negativa sul cilindro."}],"hint":"$x=y$ nel cilindro: $x^2+x^2=8$. Poi $z$ dal piano $z=1-x-y=1-2x$.","sol":"Sostituzione nei vincoli. $x=y$ nel cilindro: $2x^2=8\\Rightarrow x=\\pm2$; dal piano $z=1-2x$. Per $x=2$: $P=(2,2,-3)$; per $x=-2$: $Q=(-2,-2,5)$. (Distrattore: $x^2=8$ dimentica il raddoppio $2x^2$.)","cont":"Valori e conclusione"},{"t":"Valori di $f=4-z$ e conclusione:","opts":[{"x":"$f(P)=4-(-3)=7$ (massimo), $f(Q)=4-5=-1$ (minimo).","c":true},{"x":"$f(P)=-3$ e $f(Q)=5$: minimo $-3$, massimo $5$ (dimenticando il $4-$)."},{"x":"$f(P)=f(Q)=4$, perche' $f$ e' costante sulla curva."}],"hint":"$f$ premia $z$ piccola: massimo dove $z=-3$, minimo dove $z=5$.","sol":"Confronto dei valori. $f=4-z$: $f(2,2,-3)=7$ (max, la $z$ minima), $f(-2,-2,5)=-1$ (min, la $z$ massima). Modus operandi: qui bastavano due vincoli e Lagrange; in alternativa si poteva parametrizzare il cerchio $x=2\\sqrt2\\cos t,\\ y=2\\sqrt2\\sin t$, $z=1-x-y$, e massimizzare $-z$ in una variabile, ottenendo gli stessi due punti.","cont":""}]},{"pool":"ottim","src":"20220504 Es.2","steps":[{"t":"$f(x,y,z)=x^2+y^2-z^2$ su $D=\\{x^4+y^4+2z^4\\le1\\}$: max e min assoluti. Impostazione ed esistenza?","opts":[{"x":"$D$ e' compatto ($D=g^{-1}((-\\infty,1])$ chiuso, e $|x|,|y|,|z|\\le1$ limitato), $f$ continua $\\Rightarrow$ Weierstrass; poi critici interni e bordo $\\{g=1\\}$ con Lagrange.","c":true},{"x":"$f$ non e' limitata (il termine $-z^2$), quindi non ha ne' max ne' min su $D$."},{"x":"Bastano i critici interni: $f$ e' un polinomio, l'estremo assoluto e' sempre interno."}],"hint":"$x^4+y^4+2z^4\\le1$ limita separatamente $|x|,|y|,|z|\\le1$. Il $-z^2$ non toglie l'esistenza su un compatto.","sol":"Teorema di Weierstrass. $D$ chiuso (controimmagine di $(-\\infty,1]$ via $g=x^4+y^4+2z^4$ continua) e limitato ($x^4\\le1\\Rightarrow|x|\\le1$, idem $y,z$): compatto. $f$ continua $\\Rightarrow$ max e min esistono, indifferentemente dal segno indefinito di $f$.","cont":"Critico interno"},{"t":"Punti critici interni di $f$?","opts":[{"x":"$\\nabla f=(2x,2y,-2z)=0\\Rightarrow O=(0,0,0)$, con $f(O)=0$: unico candidato interno.","c":true},{"x":"$\\nabla f=0$ non ha soluzioni perche' $-2z=0$ e' incompatibile con $2x=0$."},{"x":"tutti i punti dell'asse $z$ sono critici, perche' $f$ non dipende linearmente da $z$."}],"hint":"Il gradiente e' lineare e si annulla solo nell'origine.","sol":"Teorema di Fermat. $\\nabla f=(2x,2y,-2z)$ si annulla solo in $O=(0,0,0)$, interno a $D$, con $f(O)=0$. La sua Hessiana $\\mathrm{diag}(2,2,-2)$ e' indefinita (sella), ma come candidato ad assoluto lo si tiene comunque e lo si valuta nel confronto.","cont":"Lagrange sul bordo"},{"t":"Sul bordo $\\{g=1\\}$ si impone $\\mathrm{rango}\\left(\\begin{smallmatrix}\\nabla f\\\\\\nabla g\\end{smallmatrix}\\right)=1$, cioe' l'annullarsi di tutti i minori $2\\times2$ di $\\left(\\begin{smallmatrix}x&y&-z\\\\x^3&y^3&2z^3\\end{smallmatrix}\\right)$. Il sistema e':","opts":[{"x":"$xy(y^2-x^2)=0,\\ \\ xz(x^2+2z^2)=0,\\ \\ yz(y^2+2z^2)=0$, con $x^4+y^4+2z^4=1$.","c":true},{"x":"$x^3=y^3=2z^3$, cioe' $x=y$ e $z=x/\\sqrt[3]2$, un solo punto."},{"x":"$\\nabla f=\\nabla g$ componente per componente, cioe' $2x=x^3$, $2y=y^3$, $-2z=2z^3$."}],"hint":"$\\nabla f\\parallel\\nabla g$ significa proporzionalita', non uguaglianza: annulla i tre minori $2\\times2$ (a meno di costanti $\\ne0$).","sol":"Teorema di Lagrange (condizione di rango: $\\nabla f$ e $\\nabla g$ linearmente dipendenti $\\Leftrightarrow$ tutti i minori $2\\times2$ nulli). I tre minori danno (a meno di costanti) $xy(y^2-x^2)=0$, $xz(x^2+2z^2)=0$, $yz(y^2+2z^2)=0$. Il distrattore '$\\nabla f=\\nabla g$' confonde il parallelismo con l'uguaglianza (dimentica $\\lambda$).","cont":"Famiglie di soluzioni"},{"t":"Quali candidati di bordo emergono?","opts":[{"x":"$P_\\pm=(0,0,\\pm\\tfrac1{\\sqrt[4]2})$; $Q_\\pm=(0,\\pm1,0)$; $R_\\pm=(\\pm1,0,0)$; $S_\\pm,T_\\pm=(\\pm\\tfrac1{\\sqrt[4]2},\\pm\\tfrac1{\\sqrt[4]2},0)$.","c":true},{"x":"solo $(\\pm1,0,0)$ e $(0,\\pm1,0)$, i vertici sugli assi."},{"x":"solo l'origine, perche' il sistema forza $x=y=z=0$."}],"hint":"I fattori $x^2+2z^2$ e $y^2+2z^2$ sono positivi se il rispettivo termine non e' gia' nullo: le soluzioni vengono dagli assi e dai piani coordinati.","sol":"Risoluzione per casi del sistema. Assi: $P_\\pm$ ($x=y=0$, $2z^4=1$), $Q_\\pm$ ($y=\\pm1$), $R_\\pm$ ($x=\\pm1$). Piano $z=0$ con $x^2=y^2$: $2x^4=1\\Rightarrow x=\\pm 2^{-1/4}$, da cui $S_\\pm,T_\\pm$. I fattori $(x^2+2z^2),(y^2+2z^2)$ obbligano $z=0$ appena $x$ o $y$ non e' nullo.","cont":"Valori e conclusione"},{"t":"Valutando $f$ nei candidati, max e min assoluti su $D$?","opts":[{"x":"$f(O)=0$, $f(P_\\pm)=-\\tfrac1{\\sqrt2}$, $f(Q_\\pm)=f(R_\\pm)=1$, $f(S_\\pm)=f(T_\\pm)=\\sqrt2$: max $=\\sqrt2$, min $=-\\tfrac1{\\sqrt2}$.","c":true},{"x":"max $=1$ in $(\\pm1,0,0)$, min $=0$ nell'origine."},{"x":"max $=\\sqrt2$, min $=0$: l'origine e' il minimo assoluto."}],"hint":"$f(S_\\pm)=x^2+y^2=2\\cdot2^{-1/2}=\\sqrt2$; $f(P_\\pm)=-z^2=-2^{-1/2}$. L'origine da' $0$, intermedio.","sol":"Confronto dei valori. $f(P_\\pm)=-z^2=-2^{-1/2}=-1/\\sqrt2$ (min assoluto); $f(S_\\pm)=f(T_\\pm)=x^2+y^2=2\\cdot2^{-1/2}=\\sqrt2$ (max assoluto); $f(Q_\\pm)=f(R_\\pm)=1$; $f(O)=0$. L'origine, pur essendo l'unico critico interno, NON e' estremo assoluto (e' una sella): il confronto dei valori e' cio' che lo esclude.","cont":""}]},{"pool":"ottim","src":"20240209 Es.2","steps":[{"t":"$f(x,y,z)=2x^3+yx^2+y^2z-9z$: si cercano i punti critici. Da quale equazione di $\\nabla f=0$ conviene partire, e perche'? (NB: file 20240209 senza soluzione ufficiale, tutto ri-derivato)","opts":[{"x":"Da $f_z=y^2-9=0$: e' l'unica equazione in una sola variabile ($y=\\pm3$), che poi sblocca le altre due.","c":true},{"x":"Da $f_x=6x^2+2xy=0$, perche' e' quadratica e ha piu' soluzioni."},{"x":"Da $f_y=x^2+2yz=0$, isolando subito $z$ in funzione di $x,y$."}],"hint":"$\\nabla f=0$ sono 3 equazioni; parti da quella disaccoppiata in una sola incognita.","sol":"Modus operandi (ordine d'attacco di un sistema critico). $\\nabla f=(6x^2+2xy,\\ x^2+2yz,\\ y^2-9)$. La terza, $y^2-9=0$, e' l'unica in una sola incognita: da' $y=\\pm3$ e riduce le altre due a un sistema in $x,z$. Partire dalla piu' vincolata e' la strategia standard.","cont":"Risolvi il sistema"},{"t":"Quanti e quali punti critici?","opts":[{"x":"Quattro: $(0,3,0)$, $(-1,3,-\\tfrac16)$, $(0,-3,0)$, $(1,-3,\\tfrac16)$.","c":true},{"x":"Due soli: $(0,3,0)$ e $(0,-3,0)$, perche' $f_x=0$ impone $x=0$."},{"x":"Infiniti, perche' $z$ resta libera in $f_y=x^2+2yz=0$."}],"hint":"$f_x=2x(3x+y)=0\\Rightarrow x=0$ oppure $x=-y/3$; per ciascun $y=\\pm3$ ricavi $z=-x^2/(2y)$.","sol":"Risoluzione. $f_x=2x(3x+y)=0\\Rightarrow x=0$ o $x=-y/3$. Con $y=3$: $x=0\\Rightarrow z=0$ (da $f_y$), $x=-1\\Rightarrow z=-1/6$. Con $y=-3$: $x=0\\Rightarrow z=0$, $x=1\\Rightarrow z=1/6$. Quattro punti. (Distrattore: $f_x=0$ NON impone $x=0$ perche' esiste il ramo $x=-y/3$.)","cont":"Costruisci l'Hessiana"},{"t":"L'Hessiana generale e':","opts":[{"x":"$H=\\left(\\begin{smallmatrix}12x+2y&2x&0\\\\2x&2z&2y\\\\0&2y&0\\end{smallmatrix}\\right)$.","c":true},{"x":"$H=\\left(\\begin{smallmatrix}12x+2y&2x&0\\\\2x&2z&2y\\\\0&2y&2y\\end{smallmatrix}\\right)$."},{"x":"$H=\\mathrm{diag}(12x+2y,\\ 2z,\\ 0)$, perche' i termini misti sono nulli."}],"hint":"$f_{zz}=\\partial_z(y^2-9)=0$; $f_{yz}=\\partial_z(x^2+2yz)=2y$; $f_{xz}=0$.","sol":"Calcolo delle derivate seconde. $f_{xx}=12x+2y$, $f_{xy}=2x$, $f_{xz}=0$, $f_{yy}=2z$, $f_{yz}=2y$, $f_{zz}=0$. La presenza di $f_{zz}=0$ con $f_{yz}=2y\\ne0$ e' il segnale che l'Hessiana sara' tipicamente indefinita.","cont":"Classifica i punti"},{"t":"Natura dei quattro punti critici (test dell'Hessiana / Sylvester)?","opts":[{"x":"Tutti e quattro sono selle. In $(0,\\pm3,0)$ gli autovalori sono $\\pm6,\\ \\pm6$ (indefinita); in $(\\mp1,\\pm3,\\mp\\tfrac16)$ i minori di testa danno $D_1<0$ (o $>0$) ma $D_2<0$: indefinita.","c":true},{"x":"$(0,3,0)$ minimo, $(0,-3,0)$ massimo; gli altri due selle."},{"x":"$(-1,3,-\\tfrac16)$ minimo perche' $\\det H=216>0$."}],"hint":"$\\det H>0$ in 3D NON basta per un estremo: servono TUTTI i minori di testa concordi (Sylvester). In $(0,\\pm3,0)$ guarda gli autovalori del blocco antidiagonale.","sol":"Criterio di Sylvester per la segnatura. In $(0,3,0)$: $H=\\left(\\begin{smallmatrix}6&0&0\\\\0&0&6\\\\0&6&0\\end{smallmatrix}\\right)$, autovalori $6,6,-6$: indefinita, sella (idem $(0,-3,0)$ con $-6,6,-6$). In $(-1,3,-1/6)$: $D_1=-6<0$, $D_2=\\det\\left(\\begin{smallmatrix}-6&-2\\\\-2&-1/3\\end{smallmatrix}\\right)=2-4=-2<0$, $D_3=216>0$: la sequenza non e' ne' quella (def. positiva) ne' quella (def. negativa) $\\Rightarrow$ indefinita, sella. Analogo in $(1,-3,1/6)$ ($D_1=6>0$, $D_2=-2<0$). Trappola: $\\det H_3=216>0$ scambiato per condizione di minimo (vale solo in 2D).","cont":"Assoluti su R^3"},{"t":"$f$ ammette max o min assoluti in tutto $\\mathbb{R}^3$?","opts":[{"x":"No: non essendoci alcun estremo locale (tutte selle) e restringendo a $x=y=0$ si ha $f(0,0,z)=-9z$, illimitata sopra e sotto.","c":true},{"x":"Si': il minimo assoluto e' $f(0,3,0)=0$."},{"x":"Ammette minimo ma non massimo, per coercivita' del termine $2x^3$."}],"hint":"Cerca una retta lungo cui $f$ e' lineare in un parametro che va a $\\pm\\infty$.","sol":"Analisi di illimitatezza. Lungo $x=y=0$: $f(0,0,z)=-9z\\to\\pm\\infty$, quindi $f$ e' illimitata in entrambi i versi e non ha ne' massimo ne' minimo assoluto su $\\mathbb{R}^3$ (coerente col fatto che i critici sono tutte selle). Il termine $2x^3$ e' dispari, quindi neppure lui da' coercivita'.","cont":""}]},{"pool":"ottim","src":"20250721 Es.1","steps":[{"t":"$F(x,y,z)=x^2e^{yz}$: determinare tutti i punti critici in $\\mathbb{R}^3$. Cosa si ottiene da $\\nabla F=0$?","opts":[{"x":"$F_x=2xe^{yz}=0\\Rightarrow x=0$; con $x=0$ anche $F_y=x^2ze^{yz}$ e $F_z=x^2ye^{yz}$ si annullano: l'INTERO piano $\\{x=0\\}$ e' critico (varieta' critica).","c":true},{"x":"L'unico punto critico e' l'origine $(0,0,0)$."},{"x":"Non ci sono punti critici perche' $e^{yz}>0$ impedisce l'annullarsi del gradiente."}],"hint":"$e^{yz}$ non e' mai nullo: $F_x=0$ forza $x=0$, e quel valore azzera anche $F_y,F_z$ (che hanno $x^2$ a fattore).","sol":"Teorema di Fermat con SOLUZIONI INFINITE. Poiche' $e^{yz}>0$, $F_x=2xe^{yz}=0\\Leftrightarrow x=0$; ma $F_y=x^2ze^{yz}$ e $F_z=x^2ye^{yz}$ hanno $x^2$ a fattore, quindi si annullano identicamente su $x=0$. L'insieme critico e' tutto il piano $\\{x=0\\}$: una varieta' critica, non punti isolati. Modus operandi: quando $\\nabla f=0$ ha infinite soluzioni non si classifica col test punto per punto, si ragiona sul segno di $f$.","cont":"Sono minimi?"},{"t":"Perche' ogni punto critico e' minimo assoluto di $F$ in $\\mathbb{R}^3$?","opts":[{"x":"$F=x^2e^{yz}\\ge0$ ovunque (prodotto di $x^2\\ge0$ e $e^{yz}>0$), e $F=0$ esattamente su $\\{x=0\\}$: dunque $0$ e' il minimo globale, raggiunto proprio nei critici.","c":true},{"x":"Perche' l'Hessiana e' definita positiva in ogni punto del piano $x=0$."},{"x":"Perche' $F$ e' convessa su tutto $\\mathbb{R}^3$."}],"hint":"Non serve l'Hessiana (sarebbe degenere): basta il segno di $F$.","sol":"Argomento diretto sul segno (il test dell'Hessiana e' degenere qui, $F_{xx}=2e^{yz}$ ma le seconde in $y,z$ si annullano su $x=0$). $F=x^2e^{yz}\\ge0$ e vale $0$ se e solo se $x=0$: il valore minimo globale e' $0$, assunto in tutti e soli i punti critici. Quindi ogni punto critico e' minimo assoluto.","cont":"Esistenza su D"},{"t":"Sull'ellissoide $D=\\{\\tfrac{x^2}2+y^2+z^2\\le1\\}$: perche' $F$ ha max e min assoluti?","opts":[{"x":"$D$ e' compatto (chiuso e limitato) e $F$ e' continua $\\Rightarrow$ Teorema di Weierstrass.","c":true},{"x":"Perche' $F\\ge0$ e ogni funzione non negativa ha max e min."},{"x":"Perche' $F$ e' limitata da $e^{yz}$, che su $D$ e' limitato."}],"hint":"L'ellissoide pieno e' un compatto: e' l'ipotesi che serve a Weierstrass.","sol":"Teorema di Weierstrass. $D$ e' controimmagine di $(-\\infty,1]$ tramite $\\tfrac{x^2}2+y^2+z^2$ continua (chiuso) ed e' contenuto in una palla (limitato): compatto. $F$ continua $\\Rightarrow$ max e min assoluti esistono.","cont":"Lagrange sul bordo"},{"t":"Il minimo su $D$ e' $0$ (sul disco $\\{x=0\\}\\cap D$). Per il massimo si usa Lagrange su $\\{g=\\tfrac{x^2}2+y^2+z^2-1=0\\}$ con $x\\ne0$ (dove $x=0$ da' il min). Dalle equazioni si ricava:","opts":[{"x":"$\\lambda=2e^{yz}$, poi $x^2z=4y$ e $x^2y=4z$, da cui $yz(x^4-16)=0$.","c":true},{"x":"$x^2=y^2=z^2$, cioe' i punti sono i vertici dell'ellissoide."},{"x":"$y=z=0$ direttamente, senza altre condizioni."}],"hint":"$\\nabla F=\\lambda\\nabla g$ con $\\nabla g=(x,2y,2z)$; dalla prima ($x\\ne0$) ricavi $\\lambda$, sostituisci nelle altre due e moltiplicale.","sol":"Teorema di Lagrange. $\\nabla F=(2xe^{yz},x^2ze^{yz},x^2ye^{yz})=\\lambda(x,2y,2z)$. Con $x\\ne0$: dalla prima $\\lambda=2e^{yz}$; sostituendo, $x^2z\\,e^{yz}=4y\\,e^{yz}\\Rightarrow x^2z=4y$ e analogamente $x^2y=4z$. Moltiplicando: $x^4yz=16yz\\Rightarrow yz(x^4-16)=0$.","cont":"Chiudi il massimo"},{"t":"Risolvendo $yz(x^4-16)=0$ sul vincolo, dove sta il massimo e quanto vale?","opts":[{"x":"$x^4=16$ da' $x^2=4$, incompatibile con $\\tfrac{x^2}2\\le1$ (cioe' $x^2\\le2$): si scarta. Resta $yz=0\\Rightarrow y=z=0$, $x^2=2$: punti $(\\pm\\sqrt2,0,0)$, $F=2$. Quindi max $=2$, min $=0$.","c":true},{"x":"$x^2=4$ e' ammesso, dando $F=4e^{yz}$ come massimo."},{"x":"il massimo e' $F=e$ nei punti con $yz=1$ sul bordo."}],"hint":"Sul vincolo $x^2\\le2$: puo' mai essere $x^2=4$? E se $y=z=0$, quanto vale $x^2$ sul bordo?","sol":"Chiusura per confronto. Il ramo $x^4=16$ ($x^2=4$) viola $\\tfrac{x^2}2\\le1\\Rightarrow x^2\\le2$: incompatibile, si scarta (distrattore: candidato fuori vincolo). Resta $y=z=0$: sul bordo $\\tfrac{x^2}2=1\\Rightarrow x^2=2$, punti $(\\pm\\sqrt2,0,0)$ con $F=x^2e^0=2$. Massimo assoluto $2$; minimo assoluto $0$ su $\\{x=0\\}\\cap D$. La varieta' critica interna da' solo il minimo; il massimo vive tutto sul bordo.","cont":""}]},{"pool":"ottim","src":"20250116 Es.2","steps":[{"t":"$f(x,y)=e^{4x^2+y^2}-\\tfrac12x^2-y^2$ su $D=\\{3x^2+4y^2\\le9\\}$: max e min assoluti. (NB: file 20250116_esoneroA, intestazione interna '10/02/2022'; l'Es.2 combacia col dominio richiesto.) Prima mossa?","opts":[{"x":"Weierstrass ($D$ compatto), poi critici interni, poi bordo $\\{3x^2+4y^2=9\\}$ con Lagrange, poi confronto.","c":true},{"x":"Si sviluppa $e^{4x^2+y^2}$ in serie e si tronca al secondo ordine, riducendo a una quadratica."},{"x":"Poiche' l'esponenziale cresce, il massimo e' certamente in $(0,0)$ e non serve il bordo."}],"hint":"E' un compatto: schema interni + bordo + confronto, dopo Weierstrass.","sol":"Modus operandi su compatto. $D=g^{-1}((-\\infty,9])$ con $g=3x^2+4y^2$ continua e' chiuso, ed e' limitato ($3x^2+4y^2\\le9\\Rightarrow$ contenuto in un disco): compatto. $f$ continua $\\Rightarrow$ Weierstrass. Troncare l'esponenziale falserebbe i valori: si lavora con $f$ esatta.","cont":"Critico interno"},{"t":"Punti critici interni di $f$?","opts":[{"x":"$\\nabla f=(x(8e^{4x^2+y^2}-1),\\,2y(e^{4x^2+y^2}-1))=0$; poiche' $e^{4x^2+y^2}\\ge1$, i fattori $8e^{..}-1\\ge7$ e $e^{..}-1$ forzano $x=0,y=0$: unico critico $O$, $f(O)=1$.","c":true},{"x":"infiniti punti critici, lungo la curva $e^{4x^2+y^2}=\\tfrac18$."},{"x":"$\\nabla f=0$ non ha soluzioni perche' l'esponenziale non si annulla mai."}],"hint":"$8e^{4x^2+y^2}-1$ e' sempre $\\ge7>0$: annulla il primo fattore solo $x=0$. Il secondo fattore si annulla solo nell'origine.","sol":"Teorema di Fermat. $f_x=8xe^{4x^2+y^2}-x=x(8e^{4x^2+y^2}-1)$; il fattore parentesi e' $\\ge7$, quindi $f_x=0\\Leftrightarrow x=0$. $f_y=2y(e^{4x^2+y^2}-1)$; $e^{..}-1=0$ solo nell'origine, quindi $f_y=0\\Leftrightarrow y=0$ (dato $x=0$). Unico critico $O=(0,0)$, interno, $f(O)=e^0=1$.","cont":"Lagrange sul bordo"},{"t":"Lagrange su $\\{3x^2+4y^2=9\\}$: $\\det\\left(\\begin{smallmatrix}f_x&f_y\\\\g_x&g_y\\end{smallmatrix}\\right)=0$ diventa:","opts":[{"x":"$xy\\,(52e^{4x^2+y^2}+4)=0\\Rightarrow xy=0$ (la parentesi e' sempre $>0$).","c":true},{"x":"$xy\\,(52e^{4x^2+y^2}+4)=0\\Rightarrow e^{4x^2+y^2}=-\\tfrac1{13}$, impossibile: nessun punto di bordo."},{"x":"$x=y$, perche' il gradiente e' simmetrico nelle due variabili."}],"hint":"$f_xg_y-f_yg_x=x(8e^{..}-1)8y-2y(e^{..}-1)6x$. Raccogli $xy$; la parentesi risultante e' strettamente positiva.","sol":"Teorema di Lagrange. $f_xg_y-f_yg_x=8xy(8e^{4x^2+y^2}-1)-12xy(e^{4x^2+y^2}-1)=xy(64e^{..}-8-12e^{..}+12)=xy(52e^{4x^2+y^2}+4)$. La parentesi e' sempre $>0$, dunque $xy=0$: si annulla $x$ o $y$, non l'esponenziale (distrattore).","cont":"Candidati di bordo"},{"t":"Con $xy=0$ sul vincolo, i candidati sono:","opts":[{"x":"$x=0\\Rightarrow4y^2=9\\Rightarrow A_\\pm=(0,\\pm\\tfrac32)$; $y=0\\Rightarrow3x^2=9\\Rightarrow B_\\pm=(\\pm\\sqrt3,0)$.","c":true},{"x":"$x=0\\Rightarrow y=\\pm3$; $y=0\\Rightarrow x=\\pm3$ (leggendo $9$ come raggio)."},{"x":"solo $A_\\pm=(0,\\pm\\tfrac32)$: i punti con $y=0$ non sono di bordo."}],"hint":"Sostituisci nel vincolo $3x^2+4y^2=9$: $x=0$ da' $y^2=9/4$, $y=0$ da' $x^2=3$.","sol":"Sostituzione nel vincolo. $x=0$: $4y^2=9\\Rightarrow y=\\pm3/2$, cioe' $A_\\pm=(0,\\pm3/2)$. $y=0$: $3x^2=9\\Rightarrow x=\\pm\\sqrt3$, cioe' $B_\\pm=(\\pm\\sqrt3,0)$. (Distrattore: confondere il livello $9$ con un raggio.)","cont":"Valori e conclusione"},{"t":"Confronto dei valori: min e max assoluti su $D$?","opts":[{"x":"$f(O)=1$, $f(A_\\pm)=e^{9/4}-\\tfrac94$, $f(B_\\pm)=e^{12}-\\tfrac32$: min $=1$ (in $O$), max $=e^{12}-\\tfrac32$ (in $B_\\pm$).","c":true},{"x":"min $=e^{9/4}-\\tfrac94$ in $A_\\pm$ e max $=e^{12}-\\tfrac32$ in $B_\\pm$."},{"x":"min $=1$ in $O$ e max $=e^{9/4}-\\tfrac94$ in $A_\\pm$."}],"hint":"$f(A_\\pm)=e^{4\\cdot0+9/4}-0-9/4$; $f(B_\\pm)=e^{4\\cdot3}-\\tfrac12\\cdot3$. Confronta con $f(O)=1$.","sol":"Confronto dei valori. $f(A_\\pm)=e^{9/4}-9/4\\approx7.24$; $f(B_\\pm)=e^{12}-3/2$ (enorme); $f(O)=1$. Massimo assoluto $e^{12}-3/2$ in $B_\\pm$; minimo assoluto $1$ nel critico interno $O$. Il minimo NON e' sul bordo: il critico interno lo batte.","cont":"Minimo su tutto il piano"},{"t":"$f$ ammette minimo assoluto su tutto $\\mathbb{R}^2$? Quanto vale?","opts":[{"x":"Si': $f(x,y)\\ge e^{x^2+y^2}-x^2-y^2\\to+\\infty$ (coerciva), quindi per Weierstrass generalizzato il min esiste ed e' in un critico; unico critico $O$: min $=f(O)=1$.","c":true},{"x":"No: senza compattezza il minimo non puo' esistere."},{"x":"Si', ma vale $0$, perche' l'esponenziale domina i termini negativi."}],"hint":"Minorizza $4x^2+y^2\\ge x^2+y^2$ nell'esponente e usa la coercivita'; il min di una funzione coerciva e' in un punto critico.","sol":"Teorema di Weierstrass generalizzato (coercivita') + Teorema di Fermat. $f\\ge e^{x^2+y^2}-(x^2+y^2)\\to+\\infty$ per $\\|(x,y)\\|\\to\\infty$: $f$ e' coerciva e continua, dunque ammette minimo assoluto, che (essendo $f\\in C^1$) e' un punto critico. L'unico e' $O$: min $=f(O)=1$.","cont":""}]},{"pool":"ottim","src":"20230621 Es.3","steps":[{"t":"$F(x,y)=x^2+3y^2-6x$ su $D=\\{2x^2+y^2\\le1\\}$. Punti critici liberi in $\\mathbb{R}^2$ e loro natura?","opts":[{"x":"$\\nabla F=(2x-6,6y)=0\\Rightarrow P=(3,0)$; $H_F=\\mathrm{diag}(4,6)$ definita positiva: minimo locale stretto. MA $P\\notin D$ perche' $2\\cdot9+0=18>1$.","c":true},{"x":"$P=(3,0)$ e' minimo locale ed e' interno a $D$, quindi e' il candidato principale."},{"x":"non ci sono critici perche' il termine $-6x$ e' lineare."}],"hint":"Il gradiente si annulla in $(3,0)$; poi VERIFICA se sta dentro $D$: $2x^2+y^2\\le1$?","sol":"Teorema di Fermat + criterio dell'Hessiana. $\\nabla F=(2x-6,6y)$ si annulla in $P=(3,0)$; $H_F=\\mathrm{diag}(4,6)$, autovalori positivi: minimo locale stretto. Ma $2(3)^2+0=18>1$: $P$ e' FUORI da $D$. Trappola classica (il 'candidato fuori dominio'): un critico non ammissibile va scartato dai candidati su $D$.","cont":"Esistenza su D"},{"t":"Perche' $F$ ha max e min assoluti su $D$, e cosa comporta $P\\notin D$?","opts":[{"x":"$D$ compatto ($=h^{-1}((-\\infty,1])$ chiuso e limitato, $h=2x^2+y^2$) e $F$ continua $\\Rightarrow$ Weierstrass; poiche' NON ci sono critici interni ammissibili, gli estremi stanno tutti su $\\partial D$.","c":true},{"x":"Non ha estremi su $D$ perche' l'unico critico e' fuori."},{"x":"Gli estremi sono in $P=(3,0)$ comunque, perche' e' il minimo della funzione."}],"hint":"Nessun critico dentro $D$ significa che il gioco si decide interamente sul bordo.","sol":"Teorema di Weierstrass. $D$ e' compatto e $F$ continua: max e min esistono. Poiche' l'unico critico e' esterno, non ci sono candidati interni: max e min assoluti sono sul bordo $\\partial D=\\{2x^2+y^2=1\\}$, da cercare con Lagrange.","cont":"Lagrange sul bordo"},{"t":"Lagrange su $\\{2x^2+y^2=1\\}$: $\\det\\left(\\begin{smallmatrix}2x-6&6y\\\\4x&2y\\end{smallmatrix}\\right)=0$ da':","opts":[{"x":"$(2x-6)2y-6y\\cdot4x=-20xy-12y=-4y(5x+3)=0\\Rightarrow y=0$ oppure $x=-\\tfrac35$.","c":true},{"x":"$-4y(5x+3)=0\\Rightarrow y=0$ oppure $x=\\tfrac35$."},{"x":"$x=y$, dalla proporzionalita' dei gradienti."}],"hint":"$\\det=(2x-6)(2y)-(6y)(4x)=4xy-12y-24xy$. Raccogli $-4y$.","sol":"Teorema di Lagrange (forma determinante). $(2x-6)2y-24xy=4xy-12y-24xy=-20xy-12y=-4y(5x+3)$. Si annulla per $y=0$ o $x=-3/5$ (attenzione al segno: $5x+3=0\\Rightarrow x=-3/5$, non $+3/5$).","cont":"I candidati di bordo"},{"t":"Quali candidati sul bordo?","opts":[{"x":"$y=0\\Rightarrow2x^2=1\\Rightarrow R_\\pm=(\\pm\\tfrac1{\\sqrt2},0)$; $x=-\\tfrac35\\Rightarrow y^2=\\tfrac7{25}\\Rightarrow Q_\\pm=(-\\tfrac35,\\pm\\tfrac{\\sqrt7}5)$.","c":true},{"x":"solo $R_\\pm=(\\pm\\tfrac1{\\sqrt2},0)$; il caso $x=-3/5$ non da' punti reali."},{"x":"$Q_\\pm=(\\tfrac35,\\pm\\tfrac{\\sqrt7}5)$ (segno di $x$ positivo)."}],"hint":"$x=-3/5$ nel vincolo: $2(9/25)+y^2=1\\Rightarrow y^2=1-18/25=7/25$.","sol":"Sostituzione nel vincolo $2x^2+y^2=1$. $y=0$: $x=\\pm1/\\sqrt2$, cioe' $R_\\pm$. $x=-3/5$: $18/25+y^2=1\\Rightarrow y^2=7/25\\Rightarrow y=\\pm\\sqrt7/5$, cioe' $Q_\\pm$.","cont":"Valori e conclusione su D"},{"t":"Confronto dei valori: min e max assoluti su $D$?","opts":[{"x":"$F(R_+)=\\tfrac12-3\\sqrt2$, $F(R_-)=\\tfrac12+3\\sqrt2$, $F(Q_\\pm)=\\tfrac{24}5$: min $=\\tfrac12-3\\sqrt2$ (in $R_+$), max $=\\tfrac{24}5$ (in $Q_\\pm$).","c":true},{"x":"min $=\\tfrac12-3\\sqrt2$ in $R_+$ e max $=\\tfrac12+3\\sqrt2$ in $R_-$."},{"x":"min $=\\tfrac{24}5$ e max $=\\tfrac12+3\\sqrt2$."}],"hint":"$6/\\sqrt2=3\\sqrt2\\approx4.24$; $24/5=4.8$. Confronta $\\tfrac12+3\\sqrt2\\approx4.74$ con $4.8$.","sol":"Confronto dei valori. $F(R_\\pm)=1/2\\mp6/\\sqrt2=1/2\\mp3\\sqrt2$; $F(Q_\\pm)=9/25+21/25+18/5=24/5$. Numericamente $F(R_+)\\approx-3.74$ (min), e tra $F(R_-)\\approx4.74$ e $24/5=4.8$ vince $24/5$ (max in $Q_\\pm$). Trappola sottile: $R_-$ sembra il massimo ma i punti $Q_\\pm$ lo superano di poco.","cont":"Su R x [-1,1]"},{"t":"Su $\\mathbb{R}\\times[-1,1]$: esistono max/min assoluti? (attenzione al valore di $F(P)$)","opts":[{"x":"$F$ e' strettamente convessa ($H_F$ def. positiva ovunque) e $P=(3,0)\\in\\mathbb{R}\\times[-1,1]$: min assoluto $F(3,0)=9-18=-9$. Nessun max: $F(x,0)=x^2-6x\\to+\\infty$.","c":true},{"x":"min assoluto $F(P)=-\\tfrac{25}4$ e nessun massimo."},{"x":"non esistono ne' max ne' min, perche' la striscia non e' compatta."}],"hint":"$P=(3,0)$ ha $y=0\\in[-1,1]$: e' ammissibile. Calcola $F(3,0)$ da $x^2+3y^2-6x$, NON copiare valori di altri esercizi.","sol":"Criterio di convessita' + analisi di illimitatezza. $H_F=\\mathrm{diag}(4,6)$ def. positiva ovunque $\\Rightarrow F$ strettamente convessa $\\Rightarrow$ unico minimo globale in $P=(3,0)$, che appartiene alla striscia. $F(3,0)=9+0-18=-9$: minimo assoluto. DISCREPANZ
