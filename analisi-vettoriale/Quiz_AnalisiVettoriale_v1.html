 su $\\mathbb{R}$?","opts":[{"x":"$f_n(n)=\\cos(1)\\frac{n^2+3}{3n^2}\\to\\frac{\\cos1}{3}\\ne0$, quindi $\\sup_{\\mathbb{R}}|f_n|\\ge|f_n(n)|\\not\\to0$: NON uniforme su $\\mathbb{R}$","c":true},{"x":"$f_n(n)\\to0$, quindi uniforme su $\\mathbb{R}$"},{"x":"$f_n(n)\\to1$"}],"hint":"scegli un punto che viaggia con $n$ e valuta la successione dei valori","sol":"Con $x_n=n$: $\\cos(x_n/n)=\\cos1$ e $\\frac{n\\cdot n+3}{n^2+2n^2}=\\frac{n^2+3}{3n^2}\\to\\frac13$, quindi $f_n(n)\\to\\frac{\\cos1}{3}\\approx0.18\\ne0$. Poich&eacute; $\\sup_{\\mathbb{R}}|f_n|\\ge|f_n(n)|$, il sup non &egrave; infinitesimo: la convergenza NON &egrave; uniforme su $\\mathbb{R}$. &Egrave; il tranello di confondere uniforme sui compatti con uniforme su $\\mathbb{R}$.","cont":"Conclusione"},{"t":"Sintesi e conseguenza per l'integrazione:","opts":[{"x":"$f_n\\to0$ puntualmente e uniformemente su ogni compatto ma non su $\\mathbb{R}$; dunque $\\int_a^b f_n\\to0$ su ogni $[a,b]$ limitato, ma nulla si conclude direttamente su $\\int_{\\mathbb{R}}f_n$","c":true},{"x":"Essendo uniforme su $\\mathbb{R}$, $\\int_{\\mathbb{R}}f_n\\to0$"},{"x":"$f_n$ non &egrave; integrabile su nessun intervallo"}],"hint":"lo scambio limite-integrale su intervallo illimitato richiede pi&ugrave; della uniforme sui compatti","sol":"La convergenza uniforme su ogni $[a,b]$ limitato garantisce $\\int_a^b f_n\\to\\int_a^b 0=0$ (passaggio al limite sotto integrale). Sull'intera retta la sola uniforme-sui-compatti non basta: servirebbe uniforme su $\\mathbb{R}$ o una dominante sommabile (convergenza dominata)."}]},{"pool":"serie","src":"20240122 Es.2","steps":[{"t":"Prima mossa su $\\sum_{k\\ge0}\\frac{(\\log x)^k}{3^{k+1}(k+e^{-k})}$?","opts":[{"x":"Porre $y=\\frac{\\log x}{3}$: la serie diventa $\\frac13\\sum_{k\\ge0}\\frac{y^k}{k+e^{-k}}$, serie di potenze in $y$","c":true},{"x":"Porre $y=\\log x$ senza il $3$"},{"x":"Derivare in $x$"}],"hint":"il $3^{k+1}$ suggerisce di assorbire il $3^k$ dentro $(\\log x)^k$","sol":"Scrivendo $\\frac{(\\log x)^k}{3^{k+1}}=\\frac13\\big(\\frac{\\log x}{3}\\big)^k$, con $y=\\frac{\\log x}{3}$ la serie &egrave; $\\frac13\\sum_{k\\ge0}\\frac{y^k}{k+e^{-k}}$: serie di potenze in $y$, centro $0$.","cont":"Raggio"},{"t":"Raggio di convergenza di $\\sum_{k\\ge0}\\frac{y^k}{k+e^{-k}}$?","opts":[{"x":"$R=1$: col criterio del rapporto $\\frac{k+e^{-k}}{k+1+e^{-(k+1)}}\\to1$","c":true},{"x":"$R=3$"},{"x":"$R=e$"}],"hint":"$a_k=\\frac1{k+e^{-k}}$, rapporto $a_{k+1}/a_k$","sol":"Con $a_k=\\frac1{k+e^{-k}}$, il criterio del rapporto d&agrave; $\\frac1R=\\lim_k\\frac{a_{k+1}}{a_k}=\\lim_k\\frac{k+e^{-k}}{k+1+e^{-(k+1)}}=1$, quindi $R=1$.","cont":"I due bordi"},{"t":"I bordi $y=1$ e $y=-1$ si comportano allo stesso modo?","opts":[{"x":"No: in $y=1$, $\\sum\\frac1{k+e^{-k}}$ diverge (confronto asintotico, $\\sim\\frac1k$); in $y=-1$, $\\sum\\frac{(-1)^k}{k+e^{-k}}$ converge per Leibniz. Puntuale su $[-1,1)$","c":true},{"x":"S&igrave;, entrambi convergono: puntuale su $[-1,1]$"},{"x":"S&igrave;, entrambi divergono: puntuale su $(-1,1)$"}],"hint":"segno alternato + monotonia $\\Rightarrow$ Leibniz al bordo sinistro; termine positivo $\\sim\\frac1k$ al destro","sol":"Bordo $y=1$: termini positivi $\\frac1{k+e^{-k}}\\sim\\frac1k$, $\\sum\\frac1k=+\\infty$, per confronto asintotico diverge. Bordo $y=-1$: serie a segni alterni, $\\frac1{k+e^{-k}}$ decrescente (poich&eacute; $k+1+e^{-(k+1)}>k+e^{-k}$, dato $1\\ge e^{-k}$) e infinitesima, quindi converge per Leibniz. Convergenza puntuale $y\\in[-1,1)$; assoluta $(-1,1)$; uniforme $[-1,1-\\delta]$ (teorema di Abel); totale $[-1+\\delta,1-\\delta]$.","cont":"Dominio in x"},{"t":"Traducendo in $x$ l'insieme di convergenza puntuale $y\\in[-1,1)$:","opts":[{"x":"$-1\\le\\frac{\\log x}{3}<1\\iff -3\\le\\log x<3\\iff x\\in[e^{-3},e^{3})$","c":true},{"x":"$x\\in(e^{-3},e^{3}]$"},{"x":"$x\\in[e^{-1},e)$"}],"hint":"$y=\\frac{\\log x}{3}$, poi esponenzia; l'estremo chiuso a sinistra viene da $y=-1$ (Leibniz)","sol":"Da $y=\\frac{\\log x}{3}\\in[-1,1)$: moltiplicando per $3$, $\\log x\\in[-3,3)$; esponenziando (funzione crescente), $x\\in[e^{-3},e^{3})$. Estremo sinistro incluso ($y=-1$ converge), destro escluso ($y=1$ diverge).","cont":"Integrale t.-a-t."},{"t":"Per la serie $\\sum_{k\\ge0}\\frac{e^{-kx}}{3^{k+1}(k+e^{-k})}$ su $[1,10]$: perch&eacute; $\\int_1^{10}\\sum_k(\\cdots)dx=\\sum_k\\int_1^{10}(\\cdots)dx$?","opts":[{"x":"Su $[1,10]$ i termini sono positivi: un corollario del teorema di convergenza monotona (Beppo Levi) autorizza lo scambio; si ottiene $\\sum_{k\\ge1}\\frac{e^{-k}-e^{-10k}}{3^{k+1}(k+e^{-k})\\,k}$ (pi&ugrave; il termine $k=0$)","c":true},{"x":"Non &egrave; mai lecito scambiare serie e integrale"},{"x":"&Egrave; lecito solo perch&eacute; l'intervallo &egrave; simmetrico"}],"hint":"termini positivi su $[1,10]$: pensa a Beppo Levi; in alternativa $z=\\frac{e^{-x}}{3}$ d&agrave; uniforme sul compatto","sol":"Con $z=\\frac{e^{-x}}{3}$ ritrovi $\\frac13\\sum\\frac{z^k}{k+e^{-k}}$, raggio $1$, uniforme sui compatti di $(-\\log3,+\\infty)$ e $[1,10]$ &egrave; uno di questi $\\Rightarrow$ scambio lecito. Pi&ugrave; direttamente: i termini sono positivi su $[1,10]$, e un corollario del teorema di convergenza monotona (Beppo Levi) d&agrave; $\\int\\sum=\\sum\\int$. Con $\\int_1^{10}e^{-kx}dx=\\frac{e^{-k}-e^{-10k}}{k}$ ($k\\ge1$) si ottiene $\\sum_{k\\ge1}\\frac{e^{-k}-e^{-10k}}{3^{k+1}(k+e^{-k})k}$."}]},{"pool":"serie","src":"20250214 Es.4","steps":[{"t":"Posto $u=\\arctan(x^2)$, in quale intervallo varia $u$ e quando vale $1$?","opts":[{"x":"$u\\in[0,\\frac\\pi2)$; $u=1\\iff x^2=\\tan1\\iff|x|=\\sqrt{\\tan1}$; per $|x|$ grande $u>1$ (fino a $\\frac\\pi2\\approx1.571$)","c":true},{"x":"$u\\in[0,1]$ sempre, quindi $u\\le1$ per ogni $x$"},{"x":"$u\\in\\mathbb{R}$"}],"hint":"$\\arctan$ di un argomento $\\ge0$ sta in $[0,\\frac\\pi2)$, e $\\frac\\pi2>1$","sol":"Essendo $x^2\\ge0$, $u=\\arctan(x^2)\\in[0,\\frac\\pi2)$. Poich&eacute; $\\frac\\pi2\\approx1.571>1$, $u$ pu&ograve; superare $1$: precisamente $u=1\\iff x^2=\\tan1\\iff|x|=\\sqrt{\\tan1}\\approx1.25$, e $u>1$ per $|x|>\\sqrt{\\tan1}$. La serie diventa $\\sum_n\\frac{(-u)^n}{\\sqrt{n+3}}$, serie di potenze in $u\\ge0$.","cont":"Successione f_n"},{"t":"Limite puntuale della successione $f_n=u^n$ con $u=\\arctan(x^2)$?","opts":[{"x":"$0$ se $u<1$; $1$ se $u=1$; $+\\infty$ se $u>1$. Il limite (discontinuo) esiste solo per $|x|\\le\\sqrt{\\tan1}$, quindi $f_n$ non converge uniformemente su tutto l'insieme di convergenza","c":true},{"x":"$f_n\\to0$ ovunque"},{"x":"$f_n\\to1$ ovunque"}],"hint":"$u^n$ dipende dal fatto che $u\\lessgtr1$; il limite &egrave; discontinuo","sol":"Per $u<1$: $u^n\\to0$; per $u=1$: $u^n=1$; per $u>1$: $u^n\\to+\\infty$. Il limite puntuale esiste solo dove $u\\le1$, cio&egrave; $|x|\\le\\sqrt{\\tan1}$, e vale $0$ (con salto a $1$ nel bordo): funzione limite discontinua, quindi le $f_n$ (continue) non convergono uniformemente su $[-\\sqrt{\\tan1},\\sqrt{\\tan1}]$.","cont":"Raggio e assoluta"},{"t":"Serie $\\sum_n\\frac{(-1)^n u^n}{\\sqrt{n+3}}$: raggio e convergenza assoluta?","opts":[{"x":"$R=1$ (poich&eacute; $\\sqrt[n]{1/\\sqrt{n+3}}\\to1$): assoluta per $u<1$, cio&egrave; $|x|<\\sqrt{\\tan1}$; per $u>1$ diverge (termine generale non infinitesimo)","c":true},{"x":"$R=+\\infty$: assoluta ovunque"},{"x":"$R=0$"}],"hint":"criterio della radice sui coefficienti $\\frac1{\\sqrt{n+3}}$","sol":"Col criterio della radice $\\frac1R=\\lim_n\\sqrt[n]{\\frac1{\\sqrt{n+3}}}=1$, dunque $R=1$: convergenza assoluta per $u<1\\iff|x|<\\sqrt{\\tan1}$. Per $u>1$ il termine $\\frac{u^n}{\\sqrt{n+3}}\\to+\\infty$ non &egrave; infinitesimo, quindi la serie diverge (condizione necessaria violata).","cont":"Bordo: Leibniz"},{"t":"Sul bordo $u=1$ (cio&egrave; $|x|=\\sqrt{\\tan1}$): converge? Come?","opts":[{"x":"Converge per Leibniz ($\\sum\\frac{(-1)^n}{\\sqrt{n+3}}$, con $\\frac1{\\sqrt{n+3}}$ decrescente a $0$), ma NON assolutamente ($\\sum\\frac1{\\sqrt{n+3}}$ diverge): convergenza condizionata. Puntuale su $|x|\\le\\sqrt{\\tan1}$","c":true},{"x":"Diverge, quindi puntuale su $|x|<\\sqrt{\\tan1}$"},{"x":"Converge assolutamente per confronto con $\\sum\\frac1{n^2}$"}],"hint":"segni alterni + $\\frac1{\\sqrt{n+3}}$ monotona infinitesima; ma $\\sum\\frac1{\\sqrt{n+3}}=\\infty$","sol":"In $u=1$: $\\sum_n\\frac{(-1)^n}{\\sqrt{n+3}}$ &egrave; a segni alterni con $\\frac1{\\sqrt{n+3}}$ decrescente e infinitesima $\\Rightarrow$ converge per Leibniz. Non converge assolutamente perch&eacute; $\\sum\\frac1{\\sqrt{n+3}}$ diverge (serie armonica generalizzata con esponente $\\frac12\\le1$): convergenza condizionata. Insieme di convergenza puntuale: $|x|\\le\\sqrt{\\tan1}$.","cont":"Uniforme vs totale"},{"t":"Dove &egrave; uniforme e dove totale?","opts":[{"x":"Uniforme su tutto $[-\\sqrt{\\tan1},\\sqrt{\\tan1}]$ (teorema di Abel, la serie converge in $u=1$); totale SOLO sui compatti $|x|\\le r<\\sqrt{\\tan1}$ (cio&egrave; $u\\le q<1$), perch&eacute; al bordo $\\sum\\sup=\\sum\\frac1{\\sqrt{n+3}}=+\\infty$","c":true},{"x":"Totale ovunque converge, incluso il bordo"},{"x":"Mai uniforme"}],"hint":"Abel d&agrave; l'uniforme fino al bordo; la totale muore al bordo perch&eacute; $\\sup$ del termine &egrave; $\\frac1{\\sqrt{n+3}}$","sol":"Per il teorema di Abel una serie di potenze convergente in un estremo del raggio converge uniformemente fino a quell'estremo: qui uniforme su $[-\\sqrt{\\tan1},\\sqrt{\\tan1}]$. La convergenza totale richiede $\\sum_n\\sup\\frac{u^n}{\\sqrt{n+3}}<\\infty$: su $u\\le q<1$ si ha $\\sup=\\frac{q^n}{\\sqrt{n+3}}\\le q^n$ e $\\sum q^n<\\infty$ (totale); includendo $u=1$, $\\sup=\\frac1{\\sqrt{n+3}}$ e $\\sum\\frac1{\\sqrt{n+3}}=+\\infty$, quindi NON totale fino al bordo. Totale solo sui compatti interni $|x|\\le r<\\sqrt{\\tan1}$."}]},{"pool":"serie","src":"20240619 Es.4","steps":[{"t":"Dominio (insieme di convergenza puntuale) di $S(x)=\\sum_{n\\ge0}\\frac{(\\log x)^n}{n^2+1}$?","opts":[{"x":"Serie di potenze in $y=\\log x$ con $R=1$; entrambi i bordi convergono ($\\sum\\frac{(\\pm1)^n}{n^2+1}$, dominata da $\\frac1{n^2}$), quindi $y\\in[-1,1]\\iff x\\in[e^{-1},e]$","c":true},{"x":"$x\\in(e^{-1},e)$, i bordi divergono"},{"x":"$x\\in(0,+\\infty)$"}],"hint":"i coefficienti $\\frac1{n^2+1}$ sono sommabili: i bordi $y=\\pm1$ convergono","sol":"Con $y=\\log x$: $\\sum\\frac{y^n}{n^2+1}$, e $\\sqrt[n]{1/(n^2+1)}\\to1\\Rightarrow R=1$. In $y=1$: $\\sum\\frac1{n^2+1}$ converge (confronto con $\\sum\\frac1{n^2}$); in $y=-1$: $\\sum\\frac{(-1)^n}{n^2+1}$ converge assolutamente. Dunque $y\\in[-1,1]$, cio&egrave; $\\log x\\in[-1,1]$, $x\\in[e^{-1},e]$.","cont":"Derivazione t.-a-t."},{"t":"Derivando termine a termine, qual &egrave; l'espressione di $S'(x)$?","opts":[{"x":"$S'(x)=\\frac1x\\sum_{n\\ge1}\\frac{n(\\log x)^{n-1}}{n^2+1}$","c":true},{"x":"$S'(x)=\\sum_{n\\ge0}\\frac{n(\\log x)^{n}}{n^2+1}$"},{"x":"$S'(x)=\\sum_{n\\ge1}\\frac{(\\log x)^{n-1}}{n^2+1}$"}],"hint":"$\\frac{d}{dx}(\\log x)^n=n(\\log x)^{n-1}\\cdot\\frac1x$; il termine $n=0$ &egrave; costante","sol":"Per la regola della catena $\\frac{d}{dx}\\frac{(\\log x)^n}{n^2+1}=\\frac{n(\\log x)^{n-1}}{n^2+1}\\cdot\\frac1x$; il termine $n=0$ &egrave; costante e sparisce. Dunque (formalmente) $S'(x)=\\frac1x\\sum_{n\\ge1}\\frac{n(\\log x)^{n-1}}{n^2+1}$.","cont":"Perch&eacute; lecito"},{"t":"Perch&eacute; la derivazione termine a termine &egrave; lecita in un intorno di $x=1$ (e non ai bordi)?","opts":[{"x":"La serie delle derivate ha raggio $1$ e converge uniformemente sui compatti interni a $(e^{-1},e)$; per il teorema di derivazione per serie ($\\sum f_n$ convergente in un punto e $\\sum f_n'$ uniformemente convergente) $S'=\\sum f_n'$ l&igrave;. Ai bordi $y=\\pm1$ la serie delle derivate $\\sum\\frac{n}{n^2+1}\\sim\\sum\\frac1n$ diverge","c":true},{"x":"Basta che $S$ converga: si pu&ograve; sempre derivare termine a termine"},{"x":"&Egrave; lecito ovunque su $[e^{-1},e]$, bordi compresi"}],"hint":"il teorema chiede la convergenza uniforme della serie DELLE DERIVATE, non di $S$","sol":"Il teorema di derivazione per serie richiede: (a) $\\sum f_n$ converge in almeno un punto, (b) $\\sum f_n'$ converge uniformemente sull'intervallo. La serie delle derivate $\\sum\\frac{ny^{n-1}}{n^2+1}$ ha raggio $1$ e converge uniformemente su ogni $[-1+\\delta,1-\\delta]$, cio&egrave; per $x$ in un intorno compatto di $1$ interno a $(e^{-1},e)$: l&igrave; $S'=\\sum f_n'$. Ai bordi $y=\\pm1$ ha termini $\\sim\\frac1n$ e diverge: derivare l&igrave; sarebbe illecito. Ma $x=1$ &egrave; interno, quindi tutto regolare.","cont":"Calcolo S'(1)"},{"t":"Valore di $S'(1)$?","opts":[{"x":"$S'(1)=\\frac12$: in $x=1$, $\\log1=0$, sopravvive solo $n=1$ ($(\\log x)^{0}=1$), dando $\\frac1x\\cdot\\frac{1\\cdot1}{1^2+1}=\\frac12$","c":true},{"x":"$S'(1)=0$"},{"x":"$S'(1)=1$"}],"hint":"in $x=1$ tutte le potenze $(\\log x)^{n-1}$ con $n\\ge2$ si annullano","sol":"In $x=1$: $\\frac1x=1$ e $(\\log x)^{n-1}=0^{n-1}=0$ per $n\\ge2$, mentre per $n=1$ vale $(\\log1)^0=1$. Resta $S'(1)=1\\cdot\\frac{1\\cdot1}{1^2+1}=\\frac12$.","cont":"Verifica"},{"t":"Controllo di coerenza sul risultato:","opts":[{"x":"Coerente: $x=1$ &egrave; interno al dominio $[e^{-1},e]$, la serie delle derivate vi converge uniformemente, e solo il termine $n=1$ contribuisce $\\Rightarrow S'(1)=\\frac12$","c":true},{"x":"Incoerente: $S'(1)$ non esiste perch&eacute; $x=1$ &egrave; un bordo"},{"x":"Coerente solo sommando anche il termine $n=0$"}],"hint":"il termine $n=0$ &egrave; costante: derivata nulla, non entra in $S'$","sol":"Il termine $n=0$ (costante $\\frac11$) ha derivata nulla e non contribuisce. Poich&eacute; $x=1$ &egrave; interno al dominio e la serie delle derivate vi converge uniformemente, lo scambio derivata-serie &egrave; giustificato e $S'(1)=\\frac12$ &egrave; corretto."}]},{"pool":"serie","src":"20230504 Es.2","steps":[{"t":"Limite puntuale di $f_n(x)=e^{-(n-x)^2}$ su $\\mathbb{R}$?","opts":[{"x":"$f_n(x)\\to0$ per ogni $x$: a $x$ fissato $(n-x)^2\\to+\\infty$, quindi $e^{-(n-x)^2}\\to0$","c":true},{"x":"$f_n(x)\\to1$ per ogni $x$"},{"x":"$f_n(x)\\to e^{-x^2}$"}],"hint":"$x$ fissato, $n\\to\\infty$: l'esponente $-(n-x)^2\\to-\\infty$","sol":"A $x$ fissato, $(n-x)^2\\to+\\infty$ per $n\\to\\infty$, dunque $f_n(x)=e^{-(n-x)^2}\\to0$. Limite puntuale identicamente nullo su $\\mathbb{R}$.","cont":"Uniforme su R"},{"t":"La convergenza a $0$ &egrave; uniforme su $\\mathbb{R}$?","opts":[{"x":"No: $\\sup_{x\\in\\mathbb{R}}f_n(x)=f_n(n)=e^0=1$ per ogni $n$, quindi $\\|f_n-0\\|_\\infty=1\\not\\to0$. La gobba gaussiana trasla mantenendo altezza $1$","c":true},{"x":"S&igrave;, perch&eacute; $f_n\\to0$ puntualmente"},{"x":"No, perch&eacute; $\\sup=0$"}],"hint":"dov'&egrave; il massimo di $f_n$? Segue la posizione $x=n$","sol":"La gaussiana $f_n$ ha massimo dove l'esponente si annulla, cio&egrave; $x=n$, con $f_n(n)=e^0=1$. Dunque $\\sup_{\\mathbb{R}}|f_n-0|=1$ per ogni $n$: non tende a $0$, la convergenza NON &egrave; uniforme. La gobba di altezza $1$ trasla verso $+\\infty$.","cont":"Uniforme su compatti"},{"t":"E su un compatto $[-M,M]$?","opts":[{"x":"S&igrave;, uniforme: per $n>M$, su $[-M,M]$ il massimo &egrave; in $x=M$ e vale $e^{-(n-M)^2}\\to0$","c":true},{"x":"No, mai uniforme su alcun insieme"},{"x":"S&igrave;, ma solo su $[0,M]$"}],"hint":"la gobba per $n$ grande &egrave; tutta a destra di $M$: su $[-M,M]$ resta solo la coda","sol":"Su $[-M,M]$, per $n>M$ la funzione $x\\mapsto e^{-(n-x)^2}$ &egrave; crescente (il picco $x=n$ &egrave; a destra di $M$), quindi $\\sup_{[-M,M]}f_n=f_n(M)=e^{-(n-M)^2}\\to0$. Convergenza uniforme su ogni compatto: &egrave; il contrasto con $\\mathbb{R}$.","cont":"Integrale"},{"t":"Quanto vale $\\int_{\\mathbb{R}}f_n(x)\\,dx$?","opts":[{"x":"$\\sqrt\\pi$ per ogni $n$: con $u=x-n$, $\\int_{\\mathbb{R}}e^{-(n-x)^2}dx=\\int_{\\mathbb{R}}e^{-u^2}du=\\sqrt\\pi$ (invarianza per traslazione)","c":true},{"x":"$0$, perch&eacute; $f_n\\to0$"},{"x":"$\\pi$"}],"hint":"la traslazione non cambia l'integrale su tutta la retta; integrale gaussiano","sol":"Sostituendo $u=x-n$, $\\int_{\\mathbb{R}}e^{-(n-x)^2}dx=\\int_{\\mathbb{R}}e^{-u^2}du=\\sqrt\\pi$, indipendente da $n$ (invarianza per traslazione dell'integrale su $\\mathbb{R}$). La massa $\\sqrt\\pi$ non si disperde: viaggia verso $+\\infty$.","cont":"Conclusione"},{"t":"Cosa smonta l'intuizione qui?","opts":[{"x":"$\\lim_n\\int_{\\mathbb{R}}f_n=\\sqrt\\pi\\ne0=\\int_{\\mathbb{R}}\\lim_n f_n$: limite e integrale NON si scambiano. Manca sia la convergenza uniforme su $\\mathbb{R}$ sia una dominante sommabile (la massa fugge all'infinito)","c":true},{"x":"Nulla: $\\lim\\int=\\int\\lim=0$"},{"x":"L'integrale non esiste"}],"hint":"convergenza puntuale (e uniforme sui compatti) NON basta per lo scambio su tutta la retta","sol":"$\\int_{\\mathbb{R}}\\lim_n f_n=\\int_{\\mathbb{R}}0=0$, ma $\\lim_n\\int_{\\mathbb{R}}f_n=\\sqrt\\pi$: lo scambio limite-integrale FALLISCE. La convergenza &egrave; puntuale e uniforme sui compatti, ma non uniforme su $\\mathbb{R}$, e non esiste $g\\in L^1(\\mathbb{R})$ con $f_n\\le g$ (la convergenza dominata non si applica): la massa $\\sqrt\\pi$ scappa a $+\\infty$. &Egrave; il controesempio canonico."}]},{"pool":"serie","src":"20230123 Es.5","steps":[{"t":"$y_n$ soluzione massimale di $y'=x^3(y-3)\\arctan y$, $y(0)=\\frac1n$. Esistenza e unicit&agrave; locale?","opts":[{"x":"S&igrave;: $f(x,u)=x^3(u-3)\\arctan u\\in C^\\infty(\\mathbb{R}^2)\\subset C^1$, quindi localmente lipschitziana in $u$; il teorema di Cauchy-Lipschitz d&agrave; esistenza e unicit&agrave; locale per ogni $n$","c":true},{"x":"No, $\\arctan$ non &egrave; derivabile"},{"x":"Solo esistenza, non unicit&agrave;"}],"hint":"$f$ &egrave; prodotto/composizione di funzioni lisce: $C^1\\Rightarrow$ Cauchy-Lipschitz","sol":"$f(x,u)=x^3(u-3)\\arctan u$ &egrave; $C^\\infty(\\mathbb{R}^2)$, in particolare $C^1$, dunque localmente lipschitziana nella seconda variabile. Il teorema di Cauchy-Lipschitz (esistenza e unicit&agrave; locale) si applica per ogni dato $y(0)=\\frac1n$.","cont":"Confinamento"},{"t":"Perch&eacute; $0<y_n(x)<3$ su tutto l'intervallo massimale (e la soluzione &egrave; globale)?","opts":[{"x":"$\\bar y\\equiv0$ e $\\bar y\\equiv3$ sono soluzioni costanti ($f(x,0)=f(x,3)=0$); poich&eacute; $0<\\frac1n<3$, per unicit&agrave; $y_n$ non pu&ograve; attraversarle, quindi $0<y_n<3$; la limitatezza d&agrave; esistenza globale su $\\mathbb{R}$","c":true},{"x":"Perch&eacute; $y_n$ &egrave; decrescente e parte da $\\frac1n$"},{"x":"Perch&eacute; $f$ &egrave; limitata da $3$"}],"hint":"le soluzioni costanti fanno da barriere: l'unicit&agrave; vieta gli attraversamenti","sol":"Gli zeri di $f$ in $u$ sono $u=0$ ($\\arctan0=0$) e $u=3$: dunque $\\bar y\\equiv0$ e $\\bar y\\equiv3$ sono soluzioni costanti. Il dato $y_n(0)=\\frac1n\\in(0,3)$ &egrave; strettamente fra le barriere; per unicit&agrave; le soluzioni non si intersecano, quindi $0<y_n(x)<3$ per ogni $x$. La limitatezza (soluzione confinata in un compatto in $u$) esclude esplosioni in tempo finito $\\Rightarrow$ esistenza globale su tutto $\\mathbb{R}$.","cont":"Monotonia"},{"t":"Segno di $y_n'$ e punto di massimo?","opts":[{"x":"Con $0<y_n<3$: $(y_n-3)<0$, $\\arctan y_n>0$, quindi $(y_n-3)\\arctan y_n<0$; allora $y_n'>0$ per $x<0$ e $y_n'<0$ per $x>0$: massimo assoluto in $x=0$, pari a $\\frac1n$","c":true},{"x":"$y_n$ sempre crescente"},{"x":"$y_n$ sempre decrescente"}],"hint":"il segno di $y_n'$ &egrave; quello di $x^3$ moltiplicato per una quantit&agrave; negativa fissa","sol":"Poich&eacute; $0<y_n<3$: $y_n-3<0$ e $\\arctan y_n>0$, dunque $(y_n-3)\\arctan y_n<0$. Allora $y_n'=x^3\\cdot[\\text{negativo}]$ ha segno opposto a $x^3$: $y_n'>0$ per $x<0$, $y_n'<0$ per $x>0$. La soluzione cresce su $(-\\infty,0)$ e decresce su $(0,+\\infty)$: massimo assoluto in $x=0$, dove vale $y_n(0)=\\frac1n$.","cont":"Convergenza uniforme"},{"t":"In che senso $y_n\\to$ soluzione costante nulla?","opts":[{"x":"UNIFORMEMENTE su tutto $\\mathbb{R}$: $\\sup_{x}|y_n(x)-0|=\\max_x y_n=y_n(0)=\\frac1n\\to0$; il limite &egrave; la soluzione costante $\\bar y\\equiv0$","c":true},{"x":"Solo puntualmente, non uniformemente"},{"x":"Non converge, perch&eacute; ogni $y_n$ &egrave; diversa"}],"hint":"il massimo di $|y_n|$ &egrave; proprio il dato iniziale $\\frac1n$, indipendente da $x$","sol":"Il massimo assoluto di $y_n$ (positiva) &egrave; in $x=0$: $\\sup_{x\\in\\mathbb{R}}|y_n(x)-0|=\\max_x y_n=y_n(0)=\\frac1n$. Quindi $\\sup_x|y_n|\\to0$: la successione converge UNIFORMEMENTE su tutto $\\mathbb{R}$ alla soluzione costante $\\bar y\\equiv0$. &Egrave; il legame fra i due esercizi d'esame (EDO che confina + successione che collassa sul dato iniziale).","cont":"Conseguenza integrale"},{"t":"Valore di $\\lim_{n}\\int_0^4 y_n(x)\\,dx$?","opts":[{"x":"$0$: la convergenza uniforme su $[0,4]$ (di funzioni continue) autorizza il passaggio al limite sotto integrale, $\\int_0^4\\lim_n y_n=\\int_0^4 0=0$","c":true},{"x":"$4$, perch&eacute; $y_n\\to$ costante"},{"x":"non calcolabile senza $y_n$ esplicita"}],"hint":"uniforme su $\\mathbb{R}$ $\\Rightarrow$ uniforme su $[0,4]$: applica lo scambio limite-integrale","sol":"La convergenza uniforme su $\\mathbb{R}$ implica quella su $[0,4]$; essendo le $y_n$ continue, il teorema di passaggio al limite sotto il segno di integrale (in ipotesi di convergenza uniforme) d&agrave; $\\lim_n\\int_0^4 y_n=\\int_0^4\\lim_n y_n=\\int_0^4 0\\,dx=0$. In alternativa, convergenza dominata: $|y_n|<3$ costante sommabile su $[0,4]$. Non serve $y_n$ esplicita."}]},{"pool":"serie","src":"serie · variante da dispensa Paronetto (Padova) · manuale","steps":[{"t":"Profilo di temperatura su una sbarra $[0,1]$: $u_n(x)=\\dfrac{n^a x}{1+n^2x^2}$ con parametro $a<2$. Limite puntuale per $n\\to\\infty$?","opts":[{"x":"$u_n(x)\\to0$ per ogni $x\\in[0,1]$ (in $x=0$ vale $0$; per $x>0$, $u_n\\sim\\frac{n^{a-2}}{x}\\to0$ essendo $a<2$)","c":true},{"x":"$u_n(x)\\to\\frac1x$"},{"x":"$u_n(x)\\to+\\infty$"}],"hint":"a $x>0$ fissato il denominatore cresce come $n^2$, il numeratore come $n^a$ con $a<2$","sol":"In $x=0$: $u_n(0)=0$. Per $x>0$ fissato: $u_n(x)=\\frac{n^a x}{1+n^2x^2}\\sim\\frac{n^a x}{n^2x^2}=\\frac{n^{a-2}}{x}\\to0$ poich&eacute; $a<2$. Il profilo limite &egrave; identicamente nullo su $[0,1]$.","cont":"Punto di massimo"},{"t":"Dove sta il massimo di $u_n$ su $[0,1]$ e quanto vale?","opts":[{"x":"In $x_n=\\frac1n$ (annullando $u_n'$: $1-n^2x^2=0$), con $u_n(x_n)=\\frac{n^{a-1}}{2}$","c":true},{"x":"In $x=1$, con $u_n(1)=\\frac{n^a}{1+n^2}$"},{"x":"In $x=0$, con valore $0$"}],"hint":"annulla la derivata: $u_n'\\propto 1-n^2x^2$","sol":"$u_n'(x)=n^a\\frac{(1+n^2x^2)-x\\cdot2n^2x}{(1+n^2x^2)^2}=n^a\\frac{1-n^2x^2}{(1+n^2x^2)^2}$, che si annulla in $x_n=\\frac1n\\in[0,1]$. Il valore &egrave; $u_n(x_n)=\\frac{n^a\\cdot\\frac1n}{1+1}=\\frac{n^{a-1}}{2}$. Il picco si trova in $x_n=\\frac1n\\to0^+$: si addossa all'estremo sinistro.","cont":"Uniforme su [0,1]"},{"t":"Per quali $a$ la convergenza &egrave; uniforme su tutto $[0,1]$?","opts":[{"x":"Se e solo se $a<1$: allora $\\|u_n\\|_\\infty=\\frac{n^{a-1}}{2}\\to0$. Per $a=1$ il sup vale $\\frac12$ (non uniforme); per $1<a<2$ il sup diverge","c":true},{"x":"Per ogni $a<2$"},{"x":"Mai, per nessun $a$"}],"hint":"il sup &egrave; $\\frac{n^{a-1}}{2}$: infinitesimo solo se l'esponente $a-1<0$","sol":"$\\|u_n-0\\|_\\infty=\\sup_{[0,1]}u_n=\\frac{n^{a-1}}{2}$, che tende a $0\\iff a-1<0\\iff a<1$: uniforme su $[0,1]$. Per $a=1$ vale costantemente $\\frac12\\not\\to0$ (non uniforme); per $1<a<2$ addirittura $\\to+\\infty$, pur restando la convergenza puntuale a $0$.","cont":"Localizzazione"},{"t":"Per $a\\in[1,2)$ (puntuale ma non uniforme): dove si concentra la perdita di uniformit&agrave;?","opts":[{"x":"Solo vicino all'estremo $x=0$: il picco &egrave; in $x_n=\\frac1n\\to0^+$; su ogni $[\\delta,1]$ con $\\delta>0$ la convergenza &egrave; uniforme, perch&eacute; $\\sup_{[\\delta,1]}u_n=u_n(\\delta)\\sim\\frac{n^{a-2}}{\\delta}\\to0$","c":true},{"x":"Su tutto $[0,1]$ in modo uniforme"},{"x":"Vicino a $x=1$"}],"hint":"allontanandoti da $0$ di un $\\delta$ fisso, il picco (in $\\frac1n$) esce definitivamente da $[\\delta,1]$","sol":"Fissato $\\delta>0$, definitivamente $x_n=\\frac1n<\\delta$: su $[\\delta,1]$ la funzione &egrave; decrescente e $\\sup_{[\\delta,1]}u_n=u_n(\\delta)=\\frac{n^a\\delta}{1+n^2\\delta^2}\\sim\\frac{n^{a-2}}{\\delta}\\to0$ (perch&eacute; $a<2$). Dunque la convergenza &egrave; uniforme su ogni $[\\delta,1]$: la non-uniformit&agrave; &egrave; confinata in un intorno arbitrariamente piccolo dell'estremo $x=0$.","cont":"Bilancio energia"},{"t":"Per $a=1$ (picco alto $\\frac12$, non uniforme): quanto vale $\\int_0^1 u_n\\,dx$ nel limite?","opts":[{"x":"$\\to0$: $\\int_0^1\\frac{n x}{1+n^2x^2}dx=\\frac{1}{2n}\\log(1+n^2)\\to0$. Il picco &egrave; alto ($\\frac12$) ma stretto ($\\sim\\frac1n$): il contributo integrale svanisce","c":true},{"x":"$\\to\\frac12$, come l'altezza del picco"},{"x":"$\\to+\\infty$"}],"hint":"altezza $\\times$ larghezza $\\approx\\frac12\\cdot\\frac1n\\to0$: la primitiva &egrave; un logaritmo","sol":"Con $a=1$: $\\int_0^1\\frac{nx}{1+n^2x^2}dx=\\frac{n}{2n^2}\\big[\\log(1+n^2x^2)\\big]_0^1=\\frac{\\log(1+n^2)}{2n}\\to0$. Quindi $\\lim_n\\int_0^1 u_n=0=\\int_0^1\\lim_n u_n$: qui limite e integrale SI scambiano pur senza convergenza uniforme su $[0,1]$, perch&eacute; il picco &egrave; alto ma troppo stretto per pesare. Mostra che la convergenza uniforme &egrave; sufficiente ma non necessaria per lo scambio."}]},{"pool":"serie","src":"serie · manuale","steps":[{"t":"Data $S(x)=\\sum_{n\\ge1}\\dfrac{\\sin(n^2x)}{n^2}$, si vuole $S'(x)$ derivando termine a termine. Prima: $S$ &egrave; ben definita e continua su $\\mathbb{R}$?","opts":[{"x":"S&igrave;: $\\big|\\frac{\\sin(n^2x)}{n^2}\\big|\\le\\frac1{n^2}$ e $\\sum\\frac1{n^2}<\\infty$, quindi per Weierstrass (M-test) la serie converge totalmente, dunque uniformemente, su $\\mathbb{R}$; $S$ &egrave; continua","c":true},{"x":"No, la serie diverge"},{"x":"S&igrave;, ma solo su intervalli limitati"}],"hint":"maggiora il termine generale con qualcosa di indipendente da $x$ e sommabile","sol":"$\\big|\\frac{\\sin(n^2x)}{n^2}\\big|\\le\\frac1{n^2}=:M_n$ con $\\sum M_n<\\infty$: per il criterio di Weierstrass la serie converge totalmente (quindi uniformemente) su tutto $\\mathbb{R}$. Somma di funzioni continue con convergenza uniforme $\\Rightarrow S\\in C^0(\\mathbb{R})$.","cont":"Serie delle derivate"},{"t":"Qual &egrave; la serie delle derivate, e converge?","opts":[{"x":"$\\sum_{n\\ge1}\\frac{d}{dx}\\frac{\\sin(n^2x)}{n^2}=\\sum_{n\\ge1}\\cos(n^2x)$: il termine generale $\\cos(n^2x)$ non &egrave; infinitesimo, quindi la serie diverge (per quasi ogni $x$)","c":true},{"x":"$\\sum\\frac{\\cos(n^2x)}{n^2}$, che converge"},{"x":"$\\sum\\frac{\\cos(n^2x)}{n^4}$"}],"hint":"$\\frac{d}{dx}\\sin(n^2x)=n^2\\cos(n^2x)$: il fattore $n^2$ cancella il denominatore","sol":"$\\frac{d}{dx}\\frac{\\sin(n^2x)}{n^2}=\\frac{n^2\\cos(n^2x)}{n^2}=\\cos(n^2x)$. La serie delle derivate &egrave; $\\sum_n\\cos(n^2x)$, il cui termine generale non tende a $0$ (per quasi ogni $x$): viola la condizione necessaria, quindi diverge.","cont":"Conclusione"},{"t":"Si pu&ograve; concludere $S'(x)=\\sum\\cos(n^2x)$?","opts":[{"x":"No: il teorema di derivazione per serie richiede la convergenza UNIFORME della serie delle DERIVATE, che qui nemmeno converge. La convergenza uniforme di $\\sum f_n$ NON basta a derivare termine a termine","c":true},{"x":"S&igrave;, perch&eacute; $S$ converge uniformemente"},{"x":"S&igrave;, perch&eacute; ogni termine &egrave; derivabile"}],"hint":"l'ipotesi chiave del teorema riguarda $\\sum f_n'$, non $\\sum f_n$","sol":"Il teorema di derivazione per serie chiede: $\\sum f_n$ convergente in un punto E $\\sum f_n'$ uniformemente convergente sull'intervallo. Qui $\\sum f_n'=\\sum\\cos(n^2x)$ non converge affatto: l'ipotesi &egrave; violata, quindi NON si pu&ograve; scrivere $S'=\\sum\\cos(n^2x)$. &Egrave; il tranello: la convergenza (anche uniforme) di $\\sum f_n$ da sola non autorizza la derivazione termine a termine.","cont":"Morale"},{"t":"Cosa insegna questo esempio (tipo Weierstrass)?","opts":[{"x":"Che una serie pu&ograve; convergere uniformemente a una funzione continua senza che la si possa derivare termine a termine: la regolarit&agrave; della somma NON si eredita dalla convergenza uniforme dei termini","c":true},{"x":"Che ogni serie uniformemente convergente &egrave; derivabile termine a termine"},{"x":"Che $S$ non &egrave; continua"}],"hint":"la convergenza uniforme controlla la continuit&agrave;, non la derivabilit&agrave;","sol":"La convergenza uniforme trasmette la continuit&agrave; alla somma, ma NON la derivabilit&agrave;: per quest'ultima serve un'ipotesi pi&ugrave; forte (uniforme convergenza della serie derivata). Le funzioni tipo Weierstrass $\\sum a^n\\cos(b^n x)$ sono l'esempio estremo (continue ovunque, derivabili in nessun punto).","cont":"Riconoscimento"},{"t":"Modus operandi: davanti a una serie di funzioni di cui chiedono $S'$, qual &egrave; l'ordine corretto delle verifiche?","opts":[{"x":"1) verifica che $\\sum f_n$ converga (almeno in un punto); 2) scrivi la serie delle derivate $\\sum f_n'$; 3) verifica che $\\sum f_n'$ converga UNIFORMEMENTE (tipicamente Weierstrass sui compatti); solo allora $S'=\\sum f_n'$","c":true},{"x":"Deriva subito termine a termine: &egrave; sempre lecito"},{"x":"Basta che $S$ sia continua"}],"hint":"il controllo decisivo &egrave; sul secondo oggetto, $\\sum f_n'$","sol":"Procedura corretta: (1) $\\sum f_n$ converge in un punto (o su un insieme); (2) forma $\\sum f_n'$; (3) prova la convergenza uniforme di $\\sum f_n'$ su ogni compatto dell'intervallo (Weierstrass, oppure Dirichlet-Abel). Se e solo se il passo (3) riesce, $S$ &egrave; derivabile e $S'=\\sum f_n'$. Nell'esempio il passo (3) fallisce gi&agrave; alla convergenza."}]}],"conserv":[{"pool":"conserv","src":"tipo E · manuale (cap. Campi vettoriali)","steps":[{"t":"Cosa significa, per definizione, che un campo $F$ è <b>conservativo</b> su un aperto $\\Omega$?","opts":[{"x":"Esiste un campo scalare $U$ tale che $F=\\nabla U$","c":true},{"x":"Vale $\\nabla\\times F=0$ in ogni punto di $\\Omega$"},{"x":"Vale $\\nabla\\cdot F=0$ in ogni punto di $\\Omega$"},{"x":"Il flusso di $F$ attraverso ogni superficie chiusa è nullo"}],"hint":"Irrotazionale ($\\nabla\\times F=0$) e conservativo NON sono la definizione l'uno dell'altro: uno è conseguenza, non definizione.","sol":"<b>Conservativo = ammette potenziale.</b> Per definizione $F=\\nabla U$ per un opportuno scalare $U$ (il potenziale). Irrotazionalità e indipendenza dal cammino sono <i>caratterizzazioni</i> che ne seguono sotto ipotesi sul dominio, non la definizione. $\\nabla\\cdot F=0$ è la definizione di <i>solenoidale</i>, un'altra cosa."}]},{"pool":"conserv","src":"tipo E · manuale (Teorema: conservativo $\\Rightarrow$ irrotazionale)","steps":[{"t":"Perché ogni campo conservativo $F\\in C^1$ è necessariamente irrotazionale?","opts":[{"x":"Perché $F=\\nabla U$ e vale l'identità $\\nabla\\times(\\nabla U)=0$","c":true},{"x":"Perché il dominio è sempre semplicemente connesso"},{"x":"Perché $\\nabla\\cdot(\\nabla U)=0$"},{"x":"Non è vero: esistono campi conservativi con $\\nabla\\times F\\neq 0$"}],"hint":"L'implicazione conservativo$\\Rightarrow$irrotazionale vale SEMPRE (per $F\\in C^1$), senza ipotesi sul dominio. È l'inversa che le richiede.","sol":"$F$ conservativo significa $F=\\nabla U$. Il rotore di un gradiente è identicamente nullo: $\\nabla\\times(\\nabla U)=0$ per il teorema di Schwarz sull'uguaglianza delle derivate miste ($U\\in C^2$). Quindi $\\nabla\\times F=0$. <b>Questa direzione non usa alcuna ipotesi sul dominio.</b> $\\nabla\\cdot(\\nabla U)=\\Delta U$ non è in generale nullo: quella è un'altra identità, sbagliata qui."}]},{"pool":"conserv","src":"tipo E · manuale (trappola tipica) + 20230907 Es.2","steps":[{"t":"Il campo $F(x,y)=\\dfrac{(-y,\\,x)}{x^2+y^2}$ su $\\mathbb{R}^2\\setminus\\{(0,0)\\}$ soddisfa $\\nabla\\times F=0$ ovunque. È conservativo?","opts":[{"x":"No: il dominio $\\mathbb{R}^2\\setminus\\{0\\}$ non è semplicemente connesso, quindi $\\nabla\\times F=0$ non basta","c":true},{"x":"Sì: $\\nabla\\times F=0$ è condizione necessaria e sufficiente per la conservatività"},{"x":"Sì, ma solo perché $F$ è di classe $C^1$"},{"x":"No, perché $\\nabla\\cdot F\\neq 0$"}],"hint":"Irrotazionale $\\Rightarrow$ conservativo SOLO se il dominio è semplicemente connesso. Qui c'è un buco nell'origine.","sol":"<b>No.</b> È il controesempio-principe. $\\nabla\\times F=0$ in ogni punto del dominio, ma $\\mathbb{R}^2\\setminus\\{0\\}$ ha un buco: NON è semplicemente connesso. Il teorema inverso (irrotazionale $\\Rightarrow$ conservativo) richiede il dominio semplicemente connesso, quindi qui non si applica. Infatti la circolazione su un giro attorno all'origine vale $2\\pi\\neq 0$: incompatibile con l'esistenza di un potenziale."}]},{"pool":"conserv","src":"tipo E · manuale + 20230907 Es.2","steps":[{"t":"Qual è la prova <i>concreta</i> che $F(x,y)=\\dfrac{(-y,\\,x)}{x^2+y^2}$ non è conservativo, nonostante sia irrotazionale?","opts":[{"x":"La sua circolazione lungo il cerchio unitario percorso in senso antiorario vale $2\\pi\\neq 0$","c":true},{"x":"La sua divergenza è diversa da zero"},{"x":"Non è definito nell'origine, quindi non è $C^1$"},{"x":"Il suo rotore cambia segno lungo il cerchio"}],"hint":"Se $F$ fosse conservativo, ogni integrale su una curva chiusa sarebbe zero. Basta esibirne uno diverso da zero.","sol":"Se $F=\\nabla U$, allora $\\oint_\\gamma F\\cdot d\\mathbf{r}=0$ su ogni curva chiusa (il potenziale torna al valore di partenza). Sul cerchio unitario $\\gamma(t)=(\\cos t,\\sin t)$, $t\\in[0,2\\pi]$: $F(\\gamma)=(-\\sin t,\\cos t)$, $\\gamma'=(-\\sin t,\\cos t)$, quindi $F\\cdot\\gamma'=\\sin^2 t+\\cos^2 t=1$ e $\\oint=\\int_0^{2\\pi}1\\,dt=2\\pi\\neq 0$. <b>Una circolazione non nulla su una curva chiusa dimostra che il potenziale non esiste.</b>"}]},{"pool":"conserv","src":"tipo E · manuale (Teorema inverso su domini s.c.)","steps":[{"t":"Quale insieme, tra i seguenti, NON è semplicemente connesso (e quindi può far fallire l'implicazione irrotazionale $\\Rightarrow$ conservativo)?","opts":[{"x":"$\\mathbb{R}^2\\setminus\\{(0,0)\\}$","c":true},{"x":"$\\mathbb{R}^3\\setminus\\{(0,0,0)\\}$"},{"x":"Una palla aperta di $\\mathbb{R}^3$"},{"x":"Tutto $\\mathbb{R}^2$"}],"hint":"In $\\mathbb{R}^2$ togliere un punto crea un buco che i cammini non possono aggirare restando nel dominio. In $\\mathbb{R}^3$ togliere un punto no: si può scavalcare.","sol":"<b>$\\mathbb{R}^2\\setminus\\{0\\}$</b> non è semplicemente connesso: un laccio attorno all'origine non si contrae a un punto restando nel dominio. Invece $\\mathbb{R}^3\\setminus\\{0\\}$ SÌ lo è (un laccio si sfila scavalcando il punto nella terza dimensione); una palla e tutto $\\mathbb{R}^2$ sono convessi, quindi stellati, quindi semplicemente connessi. Su questi ultimi, irrotazionale $\\Rightarrow$ conservativo."}]},{"pool":"conserv","src":"tipo E · manuale (Teorema inverso)","steps":[{"t":"Su un aperto $\\Omega$ <b>semplicemente connesso</b>, quale condizione su $F\\in C^1$ garantisce che $F$ è conservativo?","opts":[{"x":"$\\nabla\\times F=0$ su tutto $\\Omega$ (in $\\mathbb{R}^2$: $\\partial_y F_1=\\partial_x F_2$)","c":true},{"x":"$\\nabla\\cdot F=0$ su tutto $\\Omega$"},{"x":"$F$ limitato su $\\Omega$"},{"x":"$F$ continuo su $\\Omega$"}],"hint":"Su un dominio senza buchi, l'irrotazionalità diventa anche sufficiente, non solo necessaria.","sol":"Teorema inverso: se $\\Omega$ è semplicemente connesso e $\\nabla\\times F=0$, allora $F$ è conservativo su $\\Omega$. È la metà difficile della caratterizzazione: l'irrotazionalità è sempre necessaria, ma diventa <i>sufficiente</i> solo grazie all'ipotesi topologica sul dominio. La divergenza non c'entra: riguarda i campi solenoidali."}]},{"pool":"conserv","src":"tipo E · manuale (indipendenza dal cammino)","steps":[{"t":"Per un campo continuo $F$ su un aperto connesso, quale affermazione è <b>equivalente</b> all'essere conservativo?","opts":[{"x":"$\\int_\\gamma F\\cdot d\\mathbf{r}$ dipende solo dagli estremi di $\\gamma$, non dal cammino","c":true},{"x":"$\\int_\\gamma F\\cdot d\\mathbf{r}=0$ per ogni curva $\\gamma$, chiusa o aperta"},{"x":"$\\int_\\gamma \\|F\\|\\,ds=0$ per ogni $\\gamma$"},{"x":"$F$ ha modulo costante lungo ogni curva"}],"hint":"L'indipendenza dal cammino non dice che ogni integrale è zero: dice che due cammini con gli stessi estremi danno lo stesso valore.","sol":"<b>Conservativo $\\iff$ integrale indipendente dal cammino.</b> Se $F=\\nabla U$, allora $\\int_\\gamma F\\cdot d\\mathbf{r}=U(B)-U(A)$, che dipende solo dagli estremi. Viceversa, se l'integrale dipende solo dagli estremi si costruisce $U(P)=\\int_{P_0}^{P}F\\cdot d\\mathbf{r}$. L'opzione sempre-zero è falsa per cammini aperti: vale zero solo sui cammini <i>chiusi</i>."}]},{"pool":"conserv","src":"tipo E · manuale","steps":[{"t":"$F$ è conservativo su un aperto connesso. Quanto vale $\\oint_\\gamma F\\cdot d\\mathbf{r}$ lungo una qualunque curva chiusa $\\gamma$ contenuta nel dominio?","opts":[{"x":"$0$, perché gli estremi coincidono e $\\oint=U(B)-U(A)$ con $B=A$","c":true},{"x":"$2\\pi$, come per ogni campo irrotazionale"},{"x":"Dipende dalla lunghezza di $\\gamma$"},{"x":"$U(A)$, valore del potenziale nel punto di partenza"}],"hint":"Su una curva chiusa punto iniziale e finale coincidono: la differenza di potenziale è automaticamente nulla.","sol":"$\\oint_\\gamma F\\cdot d\\mathbf{r}=U(B)-U(A)$ e su una curva chiusa $B=A$, quindi il valore è $0$. È la firma dei campi conservativi. Il $2\\pi$ dell'esempio col buco NON contraddice questo: lì il campo <i>non</i> è conservativo, proprio perché il dominio non è semplicemente connesso e la circolazione non si annulla."}]},{"pool":"conserv","src":"tipo E · manuale (forme differenziali)","steps":[{"t":"Per una 1-forma $\\omega=P\\,dx+Q\\,dy$ (con $P,Q\\in C^1$), qual è la differenza tra <b>chiusa</b> ed <b>esatta</b>?","opts":[{"x":"Chiusa: $\\partial_y P=\\partial_x Q$. Esatta: esiste $U$ con $dU=\\omega$. Esatta $\\Rightarrow$ chiusa, non viceversa in generale","c":true},{"x":"Sono sinonimi: ogni forma chiusa è esatta"},{"x":"Chiusa: esiste $U$ con $dU=\\omega$. Esatta: $\\partial_y P=\\partial_x Q$"},{"x":"Esatta $\\Rightarrow$ chiusa è falso; vale solo il viceversa"}],"hint":"Esatta = ha una primitiva (analogo di conservativo). Chiusa = passa il test delle derivate incrociate (analogo di irrotazionale).","sol":"<b>Esatta</b> $\\iff$ esiste il potenziale $U$ con $dU=\\omega$ (cioè $\\nabla U=(P,Q)$): è l'analogo di <i>conservativo</i>. <b>Chiusa</b> $\\iff$ $\\partial_y P=\\partial_x Q$: è l'analogo di <i>irrotazionale</i>. Esatta $\\Rightarrow$ chiusa sempre (derivate miste di $U$). Il viceversa vale solo su domini semplicemente connessi: $\\dfrac{-y\\,dx+x\\,dy}{x^2+y^2}$ è chiusa ma non esatta su $\\mathbb{R}^2\\setminus\\{0\\}$."}]},{"pool":"conserv","src":"tipo E · manuale (Lemma di Poincaré)","steps":[{"t":"Cosa afferma il <b>Lemma di Poincaré</b> per una 1-forma differenziale $\\omega$?","opts":[{"x":"Su un aperto stellato, ogni forma chiusa è esatta","c":true},{"x":"Ogni forma chiusa è esatta, su qualunque aperto"},{"x":"Ogni forma esatta è chiusa, su qualunque aperto"},{"x":"Su un aperto stellato, ogni forma esatta è chiusa"}],"hint":"Esatta $\\Rightarrow$ chiusa è banale e non richiede ipotesi. Poincaré dà il verso difficile, con un'ipotesi geometrica.","sol":"<b>Poincaré:</b> su un aperto <i>stellato</i> (o più in generale semplicemente connesso) chiusa $\\Rightarrow$ esatta. È il verso non banale: fornisce la primitiva. Il verso opposto (esatta $\\Rightarrow$ chiusa) vale ovunque e non richiede alcuna ipotesi. L'ipotesi stellato è esattamente ciò che manca a $\\mathbb{R}^2\\setminus\\{0\\}$."}]},{"pool":"conserv","src":"tipo E · manuale (caso 2D)","steps":[{"t":"In $\\mathbb{R}^2$, per $F=(P,Q)$ su dominio semplicemente connesso, la conservatività equivale a una sola condizione scalare. Quale?","opts":[{"x":"$\\partial_y P=\\partial_x Q$","c":true},{"x":"$\\partial_x P=\\partial_y Q$"},{"x":"$\\partial_x P+\\partial_y Q=0$"},{"x":"$\\partial_y P=-\\partial_x Q$"}],"hint":"In 2D il rotore ha una sola componente non banale, la terza: $(\\nabla\\times F)_3=\\partial_x Q-\\partial_y P$.","sol":"In 2D $\\nabla\\times F$ si riduce alla terza componente $\\partial_x Q-\\partial_y P$; annullarla dà <b>$\\partial_y P=\\partial_x Q$</b>. La scelta $\\partial_x P+\\partial_y Q=0$ è la condizione di <i>solenoidale</i> ($\\nabla\\cdot F=0$), da non confondere. Su dominio semplicemente connesso questa singola uguaglianza è necessaria e sufficiente."}]},{"pool":"conserv","src":"tipo E · manuale (formula del potenziale)","steps":[{"t":"$F$ è conservativo con potenziale $U$. Quanto vale il lavoro $\\int_\\gamma F\\cdot d\\mathbf{r}$ lungo una curva che va da $A$ a $B$?","opts":[{"x":"$U(B)-U(A)$","c":true},{"x":"$U(A)-U(B)$"},{"x":"$\\tfrac12[U(B)+U(A)]$"},{"x":"$\\int_\\gamma \\|\\nabla U\\|\\,ds$"}],"hint":"È il teorema fondamentale del calcolo lungo le curve: il campo è il gradiente, l'integrale recupera la funzione agli estremi.","sol":"<b>$\\int_\\gamma F\\cdot d\\mathbf{r}=U(B)-U(A)$</b> (estremo finale meno iniziale): teorema fondamentale del calcolo per gli integrali di linea di un gradiente. Il segno conta: invertirlo è l'errore più comune. La formula col modulo $\\|\\nabla U\\|$ è l'integrale di <i>prima</i> specie, un oggetto diverso che non usa l'orientazione."}]},{"pool":"conserv","src":"tipo E · manuale (trappola: conservativo vs solenoidale)","steps":[{"t":"Un campo ha $\\nabla\\cdot F=0$ ovunque. Se ne può concludere che $F$ è conservativo?","opts":[{"x":"No: $\\nabla\\cdot F=0$ è la condizione di campo solenoidale, che nulla dice sulla conservatività","c":true},{"x":"Sì: divergenza nulla implica esistenza del potenziale"},{"x":"Sì, ma solo se il dominio è semplicemente connesso"},{"x":"No, perché serve anche $\\nabla\\cdot F>0$"}],"hint":"Conservativo è controllato dal ROTORE ($\\nabla\\times F$), non dalla divergenza. Sono due proprietà indipendenti.","sol":"<b>No.</b> $\\nabla\\cdot F=0$ definisce i campi <i>solenoidali</i> (privi di sorgenti, flusso conservato). La conservatività dipende invece dal <i>rotore</i>: serve $\\nabla\\times F=0$ (più il dominio semplicemente connesso). Le due condizioni sono logicamente indipendenti: $F=(-y,x)$ ha $\\nabla\\cdot F=0$ ma non è conservativo, perché $\\nabla\\times F=(0,0,2)\\neq 0$."}]},{"pool":"conserv","src":"tipo E · manuale","steps":[{"t":"Se $U$ è un potenziale di $F$, quali altre funzioni sono ancora potenziali dello stesso $F$ (su un dominio connesso)?","opts":[{"x":"Tutte e sole le $U+c$ con $c$ costante","c":true},{"x":"Solo $U$ stessa: il potenziale è unico"},{"x":"Tutte le $\\lambda U$ con $\\lambda$ costante"},{"x":"Tutte le $U+g(x,y)$ con $g$ qualunque"}],"hint":"Due potenziali dello stesso campo hanno gradiente uguale, quindi la loro differenza ha gradiente nullo. Su un connesso ciò forza una costante.","sol":"<b>$U$ è definito a meno di una costante additiva.</b> Se $\\nabla U_1=\\nabla U_2=F$, allora $\\nabla(U_1-U_2)=0$; su un dominio connesso una funzione a gradiente nullo è costante, quindi $U_1=U_2+c$. Per questo il potenziale si scrive sempre $+k$: la costante è irrilevante per il lavoro, che è una differenza."}]},{"pool":"conserv","src":"tipo E · manuale (domini stellati)","steps":[{"t":"Perché su un dominio <b>convesso</b> (es. una palla, un rettangolo) l'irrotazionalità basta per la conservatività?","opts":[{"x":"Perché convesso $\\Rightarrow$ stellato $\\Rightarrow$ semplicemente connesso, quindi vale il Lemma di Poincaré","c":true},{"x":"Perché su un convesso ogni campo è automaticamente conservativo"},{"x":"Perché su un convesso $\\nabla\\times F=0$ implica $\\nabla\\cdot F=0$"},{"x":"Non basta: serve comunque calcolare la circolazione"}],"hint":"La catena di implicazioni topologiche: convesso $\\Rightarrow$ stellato rispetto a ogni suo punto $\\Rightarrow$ semplicemente connesso.","sol":"Un convesso è stellato rispetto a ogni suo punto, e ogni stellato è semplicemente connesso. Su un semplicemente connesso il teorema inverso (Poincaré) garantisce chiusa $\\Rightarrow$ esatta, cioè irrotazionale $\\Rightarrow$ conservativo. È il motivo per cui su tutto $\\mathbb{R}^n$ o su una palla non serve mai preoccuparsi del buco: non c'è."}]},{"pool":"conserv","src":"tipo E · manuale (esempio svolto cap.3)","steps":[{"t":"Esercizio. Stabilisci se $F=(yz+2x,\\; xz+2y,\\; xy+2z)$ è conservativo su $\\mathbb{R}^3$.","opts":[{"x":"Sì: $\\nabla\\times F=0$ e $\\mathbb{R}^3$ è semplicemente connesso","c":true},{"x":"No: $\\nabla\\cdot F=6\\neq 0$"},{"x":"Sì, ma solo perché $\\nabla\\cdot F=6>0$"},{"x":"Non decidibile senza calcolare la circolazione"}],"hint":"La conservatività si controlla col rotore, non con la divergenza. E su $\\mathbb{R}^3$ intero il dominio non ha buchi.","sol":"Calcolo il rotore. $(\\nabla\\times F)_1=\\partial_y(xy+2z)-\\partial_z(xz+2y)=x-x=0$; $(\\nabla\\times F)_2=\\partial_z(yz+2x)-\\partial_x(xy+2z)=y-y=0$; $(\\nabla\\times F)_3=\\partial_x(xz+2y)-\\partial_y(yz+2x)=z-z=0$. Dunque $\\nabla\\times F=0$. Poiché $\\mathbb{R}^3$ è semplicemente connesso, per il <b>teorema inverso</b> (irrotazionale + dominio s.c.) $F$ è conservativo. La divergenza $\\nabla\\cdot F=6$ è irrilevante per questa domanda."}]},{"pool":"conserv","src":"tipo E · manuale (esempio svolto cap.3)","steps":[{"t":"Esercizio (trabocchetto). Trova il potenziale $U$ di $F=(yz+2x,\\; xz+2y,\\; xy+2z)$.","opts":[{"x":"$U=xyz+x^2+y^2+z^2+k$","c":true},{"x":"$U=xyz+x^2+y^2+k$"},{"x":"$U=xyz+2x+2y+2z+k$"},{"x":"$U=xyz+x^2+y^2+z^2+xyz+k$"}],"hint":"Dopo aver integrato $F_1$ in $x$, non dimenticare che le condizioni su $U_y$ e $U_z$ fanno emergere i termini $y^2$ E $z^2$: mancarne uno è l'errore tipico.","sol":"Integro $U_x=yz+2x$ in $x$: $U=xyz+x^2+g(y,z)$. Impongo $U_y=xz+g_y=xz+2y\\Rightarrow g_y=2y\\Rightarrow g=y^2+h(z)$. Impongo $U_z=xy+h'(z)=xy+2z\\Rightarrow h'=2z\\Rightarrow h=z^2+k$. Quindi <b>$U=xyz+x^2+y^2+z^2+k$</b>. Ricetta del potenziale: integra $F_1$, poi imponi $F_2$ e $F_3$ per ricostruire gli addendi mancanti. Fermarsi a $y^2$ dimentica il $z^2$."}]},{"pool":"conserv","src":"22gen24 Es.3","steps":[{"t":"Esercizio. Per quale valore di $a$ il campo $F=\\big(2x\\cos(x^2+y)+a\\,xy,\\; \\cos(x^2+y)+x^2+1\\big)$ è conservativo su $\\mathbb{R}^2$?","opts":[{"x":"$a=2$","c":true},{"x":"$a=0$"},{"x":"$a=-2$"},{"x":"$a=1$"}],"hint":"Imponi la condizione 2D $\\partial_y F_1=\\partial_x F_2$ e confronta i termini. Il termine $-2x\\sin(x^2+y)$ compare da entrambi i lati e si cancella.","sol":"Su $\\mathbb{R}^2$ (semplicemente connesso) basta $\\partial_y F_1=\\partial_x F_2$. $\\partial_y F_1=-2x\\sin(x^2+y)+ax$; $\\partial_x F_2=-2x\\sin(x^2+y)+2x$. Uguagliando, i termini in $\\sin$ si elidono e resta $ax=2x$ per ogni $x$, cioè <b>$a=2$</b>. Criterio: irrotazionalità in 2D su dominio semplicemente connesso."}]},{"pool":"conserv","src":"22gen24 Es.3","steps":[{"t":"Esercizio. Con $a=2$, il campo $F=\\big(2x\\cos(x^2+y)+2xy,\\; \\cos(x^2+y)+x^2+1\\big)$ ammette potenziale. Qual è?","opts":[{"x":"$U=\\sin(x^2+y)+x^2y+y+k$","c":true},{"x":"$U=\\sin(x^2+y)+x^2y+k$"},{"x":"$U=\\cos(x^2+y)+x^2y+y+k$"},{"x":"$U=\\sin(x^2+y)+xy^2+y+k$"}],"hint":"Integra $F_1$ in $x$ (nota $\\int 2x\\cos(x^2+y)\\,dx=\\sin(x^2+y)$), poi imponi $U_y=F_2$: il termine $+1$ di $F_2$ genera l'addendo $+y$.","sol":"$U_x=2x\\cos(x^2+y)+2xy\\Rightarrow U=\\sin(x^2+y)+x^2y+g(y)$. Impongo $U_y=\\cos(x^2+y)+x^2+g'(y)=\\cos(x^2+y)+x^2+1\\Rightarrow g'(y)=1\\Rightarrow g=y+k$. Quindi <b>$U=\\sin(x^2+y)+x^2y+y+k$</b>. L'addendo $+y$ nasce dal $+1$ in $F_2$: dimenticarlo è l'errore del primo distrattore."}]},{"pool":"conserv","src":"19giu24 Es.3 iv","steps":[{"t":"Esercizio. È conservativo il campo $F=(-x^2y+z,\\; y+z,\\; x^3+y+e^z)$ su $\\mathbb{R}^3$?","opts":[{"x":"No: $\\nabla\\times F=(0,\\;1-3x^2,\\;x^2)\\neq 0$","c":true},{"x":"Sì: $\\nabla\\times F=0$ e il dominio è $\\mathbb{R}^3$"},{"x":"No: $\\nabla\\cdot F\\neq 0$"},{"x":"Sì, perché $\\mathbb{R}^3$ è semplicemente connesso"}],"hint":"Su $\\mathbb{R}^3$ il dominio è a posto: l'unico ostacolo possibile è che il rotore non sia nullo. Calcolalo componente per componente.","sol":"$(\\nabla\\times F)_1=\\partial_y(x^3+y+e^z)-\\partial_z(y+z)=1-1=0$; $(\\nabla\\times F)_2=\\partial_z(-x^2y+z)-\\partial_x(x^3+y+e^z)=1-3x^2$; $(\\nabla\\times F)_3=\\partial_x(y+z)-\\partial_y(-x^2y+z)=0-(-x^2)=x^2$. Il rotore $(0,\\,1-3x^2,\\,x^2)$ non è identicamente nullo, quindi <b>$F$ non è conservativo</b>: fallisce già la condizione necessaria (conservativo $\\Rightarrow$ irrotazionale). Il dominio, pur ottimo, non salva un rotore non nullo."}]},{"pool":"conserv","src":"20220706 Es.4 iii","steps":[{"t":"Esercizio. Per quale $a$ il campo $F=(y^2+y+z^2,\\; 2xy+x,\\; 2axz)$ è conservativo su $\\mathbb{R}^3$?","opts":[{"x":"$a=1$","c":true},{"x":"$a=0$"},{"x":"$a=2$"},{"x":"Per ogni $a$, perché il dominio è semplicemente connesso"}],"hint":"Calcola il rotore: le componenti 1 e 3 si annullano da sole; è la seconda, $\\partial_z F_1-\\partial_x F_3$, a fissare $a$.","sol":"$(\\nabla\\times F)_1=\\partial_y(2axz)-\\partial_z(2xy+x)=0$; $(\\nabla\\times F)_3=\\partial_x(2xy+x)-\\partial_y(y^2+y+z^2)=(2y+1)-(2y+1)=0$; $(\\nabla\\times F)_2=\\partial_z(y^2+y+z^2)-\\partial_x(2axz)=2z-2az=2z(1-a)$. Nullo per ogni $z$ solo se <b>$a=1$</b>. L'ultima opzione è la trappola: il dominio semplicemente connesso rende l'irrotazionalità <i>sufficiente</i>, ma non la regala: va comunque imposta."}]},{"pool":"conserv","src":"20220706 Es.4 iii","steps":[{"t":"Esercizio. Con $a=1$, trova il potenziale di $F=(y^2+y+z^2,\\; 2xy+x,\\; 2xz)$.","opts":[{"x":"$U=xy^2+xy+xz^2+k$","c":true},{"x":"$U=xy^2+xy+k$"},{"x":"$U=y^2+y+z^2+xz^2+k$"},{"x":"$U=xy^2+xy+2xz^2+k$"}],"hint":"Integra $F_1$ in $x$: ogni termine di $F_1$ (che non dipende da $x$) si moltiplica per $x$. Poi verifica che $U_y$ e $U_z$ tornino.","sol":"$U_x=y^2+y+z^2\\Rightarrow U=x(y^2+y+z^2)+g(y,z)=xy^2+xy+xz^2+g(y,z)$. $U_y=2xy+x+g_y=2xy+x\\Rightarrow g_y=0$; $U_z=2xz+g_z=2xz\\Rightarrow g_z=0$. Quindi <b>$U=xy^2+xy+xz^2+k$</b>. Attenzione al coefficiente: $\\int z^2\\,dx=xz^2$, non $2xz^2$ (ultimo distrattore)."}]},{"pool":"conserv","src":"20230504 Es.4 i","steps":[{"t":"Esercizio. Per quale funzione $f$ il campo $F=(x+f(y)+z^2,\\; x\\,f(y),\\; 2xz)$ è conservativo su $\\mathbb{R}^3$?","opts":[{"x":"$f(y)=e^y$ (a meno di costante moltiplicativa), da $f'=f$","c":true},{"x":"$f(y)=y$, da $f'=1$"},{"x":"$f(y)=\\cos y$, da $f'=-f$"},{"x":"Qualunque $f\\in C^1$, perché $\\mathbb{R}^3$ è s.c."}],"hint":"Solo la terza componente del rotore è non banale: $\\partial_x F_2-\\partial_y F_1=f(y)-f'(y)$. Annullarla è un'equazione differenziale su $f$.","sol":"$(\\nabla\\times F)_1=0$ e $(\\nabla\\times F)_2=\\partial_z F_1-\\partial_x F_3=2z-2z=0$. $(\\nabla\\times F)_3=\\partial_x(x f(y))-\\partial_y(x+f(y)+z^2)=f(y)-f'(y)$. Annullando: $f'=f\\Rightarrow f(y)=Ce^y$. Con $f(y)=e^y$: <b>conservativo</b>. Criterio: irrotazionalità; qui produce una EDO sul parametro-funzione."}]},{"pool":"conserv","src":"20230705 Es.3 ii","steps":[{"t":"Esercizio. Il campo piano $F=\\Big(\\dfrac{2xy}{(1+x^2)^2},\\; \\dfrac{a}{1+x^2}\\Big)$ è conservativo su $\\mathbb{R}^2$: per quale $a$, e con quale potenziale?","opts":[{"x":"$a=-1$, con $U=-\\dfrac{y}{1+x^2}+k$","c":true},{"x":"$a=1$, con $U=\\dfrac{y}{1+x^2}+k$"},{"x":"$a=-1$, con $U=\\dfrac{y}{(1+x^2)^2}+k$"},{"x":"$a=2$, con $U=-\\dfrac{2y}{1+x^2}+k$"}],"hint":"Imponi $\\partial_y F_1=\\partial_x F_2$. Calcola $\\partial_x\\big(a(1+x^2)^{-1}\\big)=-2ax(1+x^2)^{-2}$ e confronta.","sol":"$\\partial_y F_1=\\dfrac{2x}{(1+x^2)^2}$; $\\partial_x F_2=a\\cdot(-1)(1+x^2)^{-2}\\cdot 2x=\\dfrac{-2ax}{(1+x^2)^2}$. Uguali $\\Rightarrow 2x=-2ax\\Rightarrow a=-1$. Potenziale: $U_x=\\dfrac{2xy}{(1+x^2)^2}\\Rightarrow U=y\\int\\dfrac{2x}{(1+x^2)^2}dx=-\\dfrac{y}{1+x^2}+g(y)$; $U_y=-\\dfrac{1}{1+x^2}+g'(y)=F_2=-\\dfrac{1}{1+x^2}\\Rightarrow g'=0$. Quindi <b>$a=-1$, $U=-\\dfrac{y}{1+x^2}+k$</b>."}]},{"pool":"conserv","src":"21lug25 Es.5 i","steps":[{"t":"Esercizio. La 1-forma $\\omega=(z-2y)\\,dx+(z-2x)\\,dy+\\big(x+y+\\Psi(y)\\big)dz$ è esatta su $\\mathbb{R}^3$. Che condizione deve soddisfare $\\Psi$?","opts":[{"x":"$\\Psi'(y)=0$, cioè $\\Psi$ costante","c":true},{"x":"$\\Psi'(y)=1$"},{"x":"$\\Psi(y)=y$"},{"x":"Nessuna: è sempre esatta perché $\\mathbb{R}^3$ è s.c."}],"hint":"Esatta su $\\mathbb{R}^3$ $\\iff$ chiusa: imponi tutte e tre le uguaglianze di derivate incrociate. Solo l'ultima coinvolge $\\Psi'$.","sol":"Con $P=z-2y$, $Q=z-2x$, $R=x+y+\\Psi(y)$: $\\partial_y P=\\partial_x Q$ dà $-2=-2$ (ok); $\\partial_z P=\\partial_x R$ dà $1=1$ (ok); $\\partial_z Q=\\partial_y R$ dà $1=1+\\Psi'(y)$, quindi <b>$\\Psi'(y)=0$</b>: $\\Psi$ costante. Su $\\mathbb{R}^3$ chiusa $\\iff$ esatta, ma la chiusura va comunque imposta: non è gratis (ultimo distrattore)."}]},{"pool":"conserv","src":"21lug25 Es.5","steps":[{"t":"Esercizio. Con $\\Psi\\equiv 0$, trova il potenziale $U$ ($dU=\\omega$) della forma $\\omega=(z-2y)dx+(z-2x)dy+(x+y)dz$.","opts":[{"x":"$U=xz-2xy+yz+k$","c":true},{"x":"$U=xz-2xy+k$"},{"x":"$U=xz-2xy+yz+xy+k$"},{"x":"$U=xz+2xy+yz+k$"}],"hint":"Integra $U_x=z-2y$ in $x$, poi imponi $U_y$ ricostruendo l'addendo $yz$, infine controlla $U_z$.","sol":"$U_x=z-2y\\Rightarrow U=xz-2xy+g(y,z)$. $U_y=-2x+g_y=z-2x\\Rightarrow g_y=z\\Rightarrow g=yz+h(z)$. $U_z=x+y+h'(z)=x+y\\Rightarrow h'=0$. Quindi <b>$U=xz-2xy+yz+k$</b>. Verifica: $\\nabla U=(z-2y,\\,-2x+z,\\,x+y)=(P,Q,R)$. Il termine $yz$ emerge dalla condizione su $U_y$: ometterlo è l'errore del secondo distrattore."}]},{"pool":"conserv","src":"20230907 Es.2","steps":[{"t":"Esercizio (trabocchetto). Il campo $F=\\Big(\\dfrac{-\\alpha x+y}{x^2+y^2},\\; \\dfrac{\\alpha y-x}{x^2+y^2}\\Big)$ su $\\mathbb{R}^2\\setminus\\{0\\}$: per $\\alpha=0$ risulta irrotazionale. È conservativo?","opts":[{"x":"No: il dominio $\\mathbb{R}^2\\setminus\\{0\\}$ non è semplicemente connesso, e la circolazione attorno all'origine è non nulla","c":true},{"x":"Sì: per $\\alpha=0$ è irrotazionale, quindi conservativo"},{"x":"Sì, ma solo lungo curve che non girano attorno all'origine"},{"x":"No, perché non è irrotazionale nemmeno per $\\alpha=0$"}],"hint":"Irrotazionale + dominio con un buco = non basta. Cerca la circolazione su un giro attorno all'origine: se è diversa da zero, il potenziale globale non esiste.","sol":"Per $\\alpha=0$: $F=\\big(\\tfrac{y}{x^2+y^2},\\,\\tfrac{-x}{x^2+y^2}\\big)$, irrotazionale. Ma $\\mathbb{R}^2\\setminus\\{0\\}$ non è semplicemente connesso, quindi il teorema inverso non si applica. Sul cerchio unitario antiorario $\\gamma(t)=(\\cos t,\\sin t)$: $F\\cdot\\gamma'=-1$, e $\\oint=-2\\pi\\neq 0$. <b>Non conservativo.</b> È la trappola del buco: irrotazionale creduto sempre conservativo."}]},{"pool":"conserv","src":"20230907 Es.2","steps":[{"t":"Esercizio. Con $\\alpha=0$, $F=\\Big(\\dfrac{y}{x^2+y^2},\\; \\dfrac{-x}{x^2+y^2}\\Big)$. Quanto vale la circolazione lungo il cerchio unitario percorso in senso antiorario?","opts":[{"x":"$-2\\pi$","c":true},{"x":"$0$"},{"x":"$2\\pi$"},{"x":"$-\\pi$"}],"hint":"Parametrizza $\\gamma(t)=(\\cos t,\\sin t)$, $t\\in[0,2\\pi]$. Sul cerchio $x^2+y^2=1$, quindi $F(\\gamma)=(\\sin t,-\\cos t)$; poi fai $F\\cdot\\gamma'$.","sol":"$\\gamma(t)=(\\cos t,\\sin t)$, $\\gamma'=(-\\sin t,\\cos t)$; sul cerchio $x^2+y^2=1$ quindi $F(\\gamma)=(\\sin t,-\\cos t)$. $F\\cdot\\gamma'=-\\sin^2 t-\\cos^2 t=-1$, e $\\oint=\\int_0^{2\\pi}(-1)\\,dt=-2\\pi$. Il valore non nullo <b>certifica la non conservatività</b> e misura il flusso di rotore intrappolato nel buco (periodo della forma chiusa non esatta)."}]},{"pool":"conserv","src":"tipo E · manuale (formula $L=U(B)-U(A)$)","steps":[{"t":"Esercizio. $F=(yz+2x,\\,xz+2y,\\,xy+2z)$ ha potenziale $U=xyz+x^2+y^2+z^2$. Quanto vale il lavoro lungo una qualunque curva da $A=(0,0,0)$ a $B=(1,1,1)$?","opts":[{"x":"$4$","c":true},{"x":"$0$"},{"x":"$-4$"},{"x":"Dipende dalla curva scelta"}],"hint":"Il campo è conservativo: usa $L=U(B)-U(A)$, senza parametrizzare nulla. Attento al segno e all'ordine (finale meno iniziale).","sol":"$F$ è conservativo, quindi $L=U(B)-U(A)$ indipendentemente dal cammino. $U(1,1,1)=1+1+1+1=4$, $U(0,0,0)=0$, dunque <b>$L=4$</b>. Dipende-dalla-curva è la trappola: proprio la conservatività elimina questa dipendenza. Invertire l'ordine darebbe $-4$ (secondo errore tipico)."}]},{"pool":"conserv","src":"tipo E · manuale (forma esatta 2D con parametro)","steps":[{"t":"Esercizio. Per quale $a$ la forma $\\omega=(a\\,xy+y)\\,dx+(x^2+x)\\,dy$ è esatta su $\\mathbb{R}^2$, e qual è la primitiva?","opts":[{"x":"$a=2$, con $U=x^2y+xy+k$","c":true},{"x":"$a=1$, con $U=\\tfrac12 x^2y+xy+k$"},{"x":"$a=2$, con $U=x^2y+k$"},{"x":"Per ogni $a$: ogni forma su $\\mathbb{R}^2$ è esatta"}],"hint":"Esatta su $\\mathbb{R}^2$ $\\iff$ chiusa: $\\partial_y M=\\partial_x N$. Poi costruisci $U$ integrando $M$ in $x$ e imponendo $U_y=N$.","sol":"$M=axy+y$, $N=x^2+x$. Chiusura: $\\partial_y M=ax+1$, $\\partial_x N=2x+1$; uguali $\\Rightarrow a=2$. Con $a=2$: $U_x=2xy+y\\Rightarrow U=x^2y+xy+g(y)$; $U_y=x^2+x+g'(y)=x^2+x\\Rightarrow g'=0$. Quindi <b>$a=2$, $U=x^2y+xy+k$</b>. L'ultima opzione è falsa: nemmeno su $\\mathbb{R}^2$ ogni forma è esatta, serve la chiusura."}]},{"pool":"conserv","src":"chiusura necessaria 2D/3D · manuale","steps":[{"t":"Sia $F=(F_1,F_2)\\in C^1(\\Omega)$, $\\Omega\\subseteq\\mathbb{R}^2$ aperto. Quale uguaglianza e' condizione NECESSARIA affinche' $F$ sia conservativo?","opts":[{"x":"$\\partial_y F_1=\\partial_x F_2$ in ogni punto di $\\Omega$","c":true},{"x":"$\\partial_x F_1=\\partial_y F_2$"},{"x":"$\\partial_x F_1+\\partial_y F_2=0$ (divergenza nulla)"}],"hint":"Il potenziale ha derivate seconde miste uguali: $\\partial_y\\partial_x U=\\partial_x\\partial_y U$.","sol":"Se $F=\\nabla U$ allora $F_1=\\partial_x U,\\ F_2=\\partial_y U$; per il <b>teorema di Schwarz</b> (derivate miste, $U\\in C^2$) $\\partial_y F_1=\\partial_y\\partial_x U=\\partial_x\\partial_y U=\\partial_x F_2$. E' la condizione di CHIUSURA (irrotazionalita' nel piano). La divergenza nulla e' altra cosa (campo solenoidale)."},{"t":"In $\\mathbb{R}^3$, come si scrive la stessa condizione necessaria per $F=(F_1,F_2,F_3)\\in C^1$?","opts":[{"x":"$\\nabla\\wedge F=0$: $\\ \\partial_y F_3=\\partial_z F_2,\\ \\ \\partial_z F_1=\\partial_x F_3,\\ \\ \\partial_x F_2=\\partial_y F_1$","c":true},{"x":"$\\nabla\\cdot F=0$"},{"x":"solo $\\partial_x F_2=\\partial_y F_1$"}],"hint":"Tre uguaglianze, una per ogni componente del rotore.","sol":"$F$ conservativo $\\Rightarrow$ irrotazionale, perche' $\\nabla\\wedge(\\nabla U)=0$ identicamente (<b>identita' rot-grad</b>). Le tre componenti del rotore nullo danno le tre uguaglianze delle derivate incrociate. Necessaria, non sufficiente."},{"t":"Verifica operativa: $F=(y\\cos x,\\ \\sin x+2y)$ e' chiuso su $\\mathbb{R}^2$?","opts":[{"x":"Si': $\\partial_y F_1=\\cos x=\\partial_x F_2$ ovunque","c":true},{"x":"No"},{"x":"Si' ma solo dove $\\cos x\\neq0$"}],"hint":"Deriva $F_1$ in $y$ e $F_2$ in $x$ e confronta.","sol":"$\\partial_y(y\\cos x)=\\cos x$ e $\\partial_x(\\sin x+2y)=\\cos x$: coincidono su tutto $\\mathbb{R}^2$. Essendo $\\mathbb{R}^2$ semplicemente connesso, per il teorema inverso il campo e' anche esatto (conservativo)."}]},{"pool":"conserv","src":"irrotazionale non basta · manuale","steps":[{"t":"$F\\in C^1(\\Omega)$ e' irrotazionale ($\\nabla\\wedge F=0$) su tutto $\\Omega$. Segue che $F$ e' conservativo?","opts":[{"x":"Non necessariamente: dipende dalla TOPOLOGIA di $\\Omega$; serve $\\Omega$ semplicemente connesso","c":true},{"x":"Si', sempre"},{"x":"Si', purche' $F$ sia continuo"}],"hint":"L'implicazione irrotazionale $\\Rightarrow$ conservativo e' un teorema CON ipotesi sul dominio.","sol":"<b>Teorema (condizione sufficiente / Poincare'):</b> se $\\Omega$ e' semplicemente connesso e $F\\in C^1$ e' chiuso, allora $F$ e' esatto. Senza semplice connessione l'implicazione puo' fallire (piano bucato). La chiusura e' LOCALE, la conservativita' e' GLOBALE."},{"t":"Cosa significa che $\\Omega$ e' <b>semplicemente connesso</b>?","opts":[{"x":"E' connesso per archi e ogni curva chiusa in $\\Omega$ si contrae con continuita' a un punto restando in $\\Omega$ (nessun buco)","c":true},{"x":"E' limitato e chiuso"},{"x":"E' convesso"}],"hint":"Riguarda i lacci, non la limitatezza.","sol":"Definizione topologica: connesso + gruppo fondamentale banale ($\\pi_1(\\Omega)=0$, ogni laccio e' omotopo a un punto). Convesso $\\Rightarrow$ stellato $\\Rightarrow$ s.c., non viceversa: una corona circolare e' connessa ma NON semplicemente connessa."}]},{"pool":"conserv","src":"campo angolare (-y,x)/(x^2+y^2): chiuso non esatto · manuale","steps":[{"t":"Campo angolare $F=\\dfrac{(-y,\\,x)}{x^2+y^2}$ su $\\Omega=\\mathbb{R}^2\\setminus\\{(0,0)\\}$. Primo passo: e' CHIUSO? Calcola $\\partial_y F_1$ e $\\partial_x F_2$.","opts":[{"x":"$\\partial_y F_1=\\partial_x F_2=\\dfrac{y^2-x^2}{(x^2+y^2)^2}$: chiuso","c":true},{"x":"$\\partial_y F_1=\\partial_x F_2=0$"},{"x":"Non e' chiuso, le derivate differiscono"}],"hint":"Regola del quoziente su ciascuna componente.","sol":"$\\partial_y\\!\\big(\\tfrac{-y}{x^2+y^2}\\big)=\\tfrac{-(x^2+y^2)+2y^2}{(x^2+y^2)^2}=\\tfrac{y^2-x^2}{(x^2+y^2)^2}$; $\\ \\partial_x\\!\\big(\\tfrac{x}{x^2+y^2}\\big)=\\tfrac{(x^2+y^2)-2x^2}{(x^2+y^2)^2}=\\tfrac{y^2-x^2}{(x^2+y^2)^2}$. Uguali: la forma e' CHIUSA su $\\Omega$."},{"t":"Secondo passo: dov'e' definito $F$ e $\\Omega$ e' semplicemente connesso?","opts":[{"x":"Non definito in $(0,0)$; $\\mathbb{R}^2\\setminus\\{0\\}$ ha un buco, NON e' semplicemente connesso","c":true},{"x":"Definito ovunque, s.c."},{"x":"Non definito sull'asse $x$"}],"hint":"Dove si annulla $x^2+y^2$? Il laccio attorno a quel punto si contrae?","sol":"Il denominatore si annulla solo nell'origine. Il piano bucato e' connesso ma il laccio attorno all'origine non si contrae: $\\pi_1=\\mathbb{Z}$. Quindi il <b>teorema inverso non si applica</b> e la sola chiusura NON garantisce l'esattezza."},{"t":"Terzo passo: calcola $\\oint_\\gamma F\\cdot d\\mathbf{r}$ sul cerchio unitario $\\gamma:\\ x=\\cos t,\\ y=\\sin t,\\ t\\in[0,2\\pi]$.","opts":[{"x":"$\\displaystyle\\int_0^{2\\pi}1\\,dt=2\\pi$","c":true},{"x":"$0$"},{"x":"$\\pi$"}],"hint":"Su $\\gamma$ vale $x^2+y^2=1$; sostituisci $dx,dy$.","sol":"Su $\\gamma$, $x^2+y^2=1$, $dx=-\\sin t\\,dt$, $dy=\\cos t\\,dt$. Allora $F\\cdot d\\mathbf{r}=(-\\sin t)(-\\sin t)\\,dt+(\\cos t)(\\cos t)\\,dt=(\\sin^2 t+\\cos^2 t)\\,dt=dt$. Integrale $=2\\pi\\neq0$."},{"t":"Quarto passo: cosa concludi sull'esattezza?","opts":[{"x":"NON esatto su $\\Omega$: se lo fosse, la circuitazione su una curva chiusa sarebbe $0$; qui vale $2\\pi$","c":true},{"x":"Esatto, perche' chiuso"},{"x":"Esatto solo fuori dal cerchio unitario"}],"hint":"Applica il criterio circuitazione-nulla al contrario.","sol":"<b>Criterio:</b> $F$ conservativo $\\Leftrightarrow$ $\\oint_\\gamma F\\cdot d\\mathbf{r}=0$ per ogni curva chiusa. Qui $2\\pi\\neq0$ $\\Rightarrow$ NON conservativo, benche' chiuso. Il 'potenziale' e' l'angolo $\\theta=\\operatorname{atan2}(y,x)$, definito solo a meno di $2\\pi$ (multivalore)."},{"t":"Quinto passo: quanto vale la circuitazione su una curva chiusa che NON racchiude l'origine, e su una che gira $n$ volte attorno all'origine?","opts":[{"x":"$0$ se non racchiude l'origine; $2\\pi n$ se compie $n$ giri (numero di avvolgimento)","c":true},{"x":"Sempre $2\\pi$"},{"x":"Sempre $0$"}],"hint":"La forma e' esatta su ogni sottodominio s.c. che eviti l'origine.","sol":"Dove il laccio non circonda il buco la forma e' esatta e $\\oint=0$. In generale $\\oint_\\gamma F\\cdot d\\mathbf{r}=2\\pi\\,\\mathrm{Ind}_\\gamma(0)$, con l'<b>indice di avvolgimento</b>: dipende SOLO dalla classe di omotopia di $\\gamma$. E' l'ostruzione topologica all'esistenza di un potenziale globale."},{"t":"Sesto passo (trappola d'esame): qualcuno scrive 'il rotore e' nullo dunque il campo e' conservativo'. Dov'e' l'errore?","opts":[{"x":"Ignora il dominio: rotore nullo $\\Rightarrow$ conservativo SOLO se il dominio e' semplicemente connesso; qui non lo e'","c":true},{"x":"Il rotore in realta' non e' nullo"},{"x":"Nessun errore"}],"hint":"Locale vs globale.","sol":"E' l'errore che costa l'intero esercizio. Rotore nullo = condizione LOCALE necessaria; la conservativita' e' GLOBALE. Va sempre esaminato dove il campo NON e' definito e se il dominio e' s.c. Controprova operativa: una circuitazione non nulla, come i $2\\pi$ appena calcolati."}]},{"pool":"conserv","src":"indipendenza dal cammino · manuale","steps":[{"t":"Per $F$ continuo su un aperto CONNESSO $\\Omega$, quale proprieta' e' EQUIVALENTE all'essere conservativo?","opts":[{"x":"L'integrale di linea $\\int_\\gamma F\\cdot d\\mathbf{r}$ dipende solo dagli estremi, non dal cammino","c":true},{"x":"Il campo e' limitato"},{"x":"$\\nabla\\cdot F=0$"}],"hint":"Equivale anche a: circuitazione nulla su ogni curva chiusa.","sol":"<b>Teorema di caratterizzazione:</b> su $\\Omega$ connesso, $F$ conservativo $\\Leftrightarrow$ indipendenza dal cammino $\\Leftrightarrow$ $\\oint=0$ su ogni curva chiusa. Il potenziale si costruisce come $U(P)=\\int_{P_0}^{P}F\\cdot d\\mathbf{r}$, ben definito proprio grazie all'indipendenza dal cammino."},{"t":"So che $\\int_{\\gamma_1}F\\cdot d\\mathbf{r}=5$ su un cammino da $A$ a $B$ e che $F$ e' conservativo. Quanto vale $\\int_{\\gamma_2}F\\cdot d\\mathbf{r}$ su un ALTRO cammino da $A$ a $B$?","opts":[{"x":"$5$: stessi estremi $\\Rightarrow$ stesso valore","c":true},{"x":"$-5$"},{"x":"Non determinabile senza conoscere $\\gamma_2$"}],"hint":"La differenza $\\gamma_1-\\gamma_2$ e' una curva chiusa.","sol":"Per indipendenza dal cammino $\\int_{\\gamma_1}=\\int_{\\gamma_2}=U(B)-U(A)=5$. Infatti $\\gamma_1$ seguito da $\\gamma_2$ percorso a ritroso e' chiuso, e su una curva chiusa $\\oint=0$."}]},{"pool":"conserv","src":"lavoro su circuito chiuso · manuale","steps":[{"t":"$F$ conservativo su $\\Omega$ connesso, $\\gamma$ curva CHIUSA in $\\Omega$. Quanto vale $\\oint_\\gamma F\\cdot d\\mathbf{r}$?","opts":[{"x":"$0$","c":true},{"x":"$2\\pi$"},{"x":"Dipende dalla lunghezza di $\\gamma$"}],"hint":"Teorema fondamentale del calcolo per gli integrali di linea.","sol":"$\\oint_\\gamma\\nabla U\\cdot d\\mathbf{r}=U(\\gamma(b))-U(\\gamma(a))=0$ perche' su una curva chiusa gli estremi coincidono (<b>teorema fondamentale degli integrali di linea</b>). E' il criterio operativo di conservativita'."},{"t":"Un campo ha $\\oint_{\\gamma_0}F\\cdot d\\mathbf{r}=3$ su UNA curva chiusa $\\gamma_0$. Cosa concludi?","opts":[{"x":"$F$ NON e' conservativo su alcun aperto contenente $\\gamma_0$","c":true},{"x":"$F$ e' conservativo"},{"x":"Nulla, servirebbe controllare tutte le curve"}],"hint":"Per NEGARE la conservativita' basta un solo controesempio.","sol":"Una sola circuitazione non nulla nega l'indipendenza dal cammino, dunque la conservativita'. E' la strategia piu' rapida per DIMOSTRARE che un campo non e' conservativo: esibire una curva chiusa con $\\oint\\neq0$."}]},{"pool":"conserv","src":"costruzione del potenziale 3D per integrazioni successive · manuale","steps":[{"t":"$F=(2xy+z^2,\\ x^2+2yz,\\ 2xz+y^2)$ su $\\mathbb{R}^3$. Primo passo: e' irrotazionale? Controlla le tre coppie di derivate incrociate.","opts":[{"x":"Si': $\\partial_yF_3=\\partial_zF_2=2y$, $\\ \\partial_zF_1=\\partial_xF_3=2z$, $\\ \\partial_xF_2=\\partial_yF_1=2x$","c":true},{"x":"No, $\\partial_yF_3\\neq\\partial_zF_2$"},{"x":"Basta la divergenza, che e' nulla"}],"hint":"Confronta a coppie le componenti del rotore.","sol":"$\\partial_y(2xz+y^2)=2y=\\partial_z(x^2+2yz)$; $\\ \\partial_z(2xy+z^2)=2z=\\partial_x(2xz+y^2)$; $\\ \\partial_x(x^2+2yz)=2x=\\partial_y(2xy+z^2)$. Dunque $\\nabla\\wedge F=0$: campo <b>chiuso</b> (la divergenza e' irrilevante alla conservativita')."},{"t":"Secondo passo: il dominio e' $\\mathbb{R}^3$. Posso gia' concludere l'esattezza?","opts":[{"x":"Si': $\\mathbb{R}^3$ e' semplicemente connesso (anzi stellato), quindi chiuso $\\Rightarrow$ esatto: esiste $U$ globale","c":true},{"x":"No, prima devo calcolare $U$"},{"x":"Solo localmente"}],"hint":"Che teorema garantisce chiuso $\\Rightarrow$ esatto su uno stellato?","sol":"<b>Lemma di Poincare':</b> su un aperto stellato (e $\\mathbb{R}^3$ lo e' rispetto all'origine) ogni forma chiusa e' esatta. L'esistenza di $U$ e' garantita PRIMA di costruirlo; ora lo si ricava esplicitamente."},{"t":"Terzo passo: integra $\\partial_x U=2xy+z^2$ rispetto a $x$. Cosa ottieni?","opts":[{"x":"$U=x^2y+xz^2+g(y,z)$, con costante d'integrazione $g$ FUNZIONE di $(y,z)$","c":true},{"x":"$U=x^2y+xz^2+C$ con $C$ costante"},{"x":"$U=2x^2y+xz^2$"}],"hint":"Integrando in $x$ le altre variabili sono parametri.","sol":"$\\int(2xy+z^2)\\,dx=x^2y+xz^2+g(y,z)$: la 'costante' e' costante SOLO rispetto a $x$, quindi dipende da $y,z$. Ridurla a una costante numerica e' l'errore piu' comune in questa costruzione."},{"t":"Quarto passo: imponi $\\partial_y U=F_2=x^2+2yz$. Ricava $g$.","opts":[{"x":"$\\partial_yU=x^2+g_y=x^2+2yz\\Rightarrow g_y=2yz\\Rightarrow g=y^2z+h(z)$","c":true},{"x":"$g_y=2yz\\Rightarrow g=y^2z+C$"},{"x":"$g_y=0$"}],"hint":"Deriva la $U$ del passo 3 in $y$ e uguaglia $F_2$; di nuovo compare una costante-funzione.","sol":"$\\partial_y(x^2y+xz^2+g)=x^2+g_y$. Uguagliando a $F_2$: $g_y=2yz$, che integrata in $y$ da' $g=y^2z+h(z)$ — la nuova costante d'integrazione e' funzione della sola $z$."},{"t":"Quinto passo: imponi $\\partial_z U=F_3=2xz+y^2$ e concludi $U$.","opts":[{"x":"$2xz+y^2+h'(z)=2xz+y^2\\Rightarrow h'=0\\Rightarrow U=x^2y+xz^2+y^2z+C$","c":true},{"x":"$U=x^2y+xz^2+y^2z+z+C$"},{"x":"$h'(z)=2xz$"}],"hint":"Ora $U=x^2y+xz^2+y^2z+h(z)$: deriva in $z$.","sol":"$\\partial_z(x^2y+xz^2+y^2z+h)=2xz+y^2+h'(z)$. Uguagliando a $F_3=2xz+y^2$ si ha $h'(z)=0$, cioe' $h=C$. Potenziale: $U=x^2y+xz^2+y^2z+C$."},{"t":"Sesto passo (verifica + lavoro): calcola il lavoro di $F$ da $A=(0,0,0)$ a $B=(1,1,1)$ e verifica $\\nabla U=F$.","opts":[{"x":"$L=U(B)-U(A)=3-0=3$; e $\\nabla U=(2xy+z^2,\\,x^2+2yz,\\,2xz+y^2)=F$","c":true},{"x":"$L=0$ perche' il campo e' conservativo"},{"x":"$L=6$"}],"hint":"$L=0$ vale solo su circuito chiuso; qui $A\\neq B$.","sol":"$U(1,1,1)=1+1+1=3$, $U(0,0,0)=0$, quindi $L=U(B)-U(A)=3$ (<b>teorema fondamentale degli integrali di linea</b>, indipendente dal cammino). Verifica: $\\partial_xU=2xy+z^2$, $\\partial_yU=x^2+2yz$, $\\partial_zU=2xz+y^2$ ricostruiscono $F$. La risposta $L=0$ sarebbe la trappola del circuito chiuso."}]},{"pool":"conserv","src":"forma esatta vs chiusa · manuale","steps":[{"t":"Per una 1-forma $\\omega=P\\,dx+Q\\,dy$ con $P,Q\\in C^1$, cosa distingue CHIUSA da ESATTA?","opts":[{"x":"Chiusa: $\\partial_yP=\\partial_xQ$ (locale). Esatta: esiste $U$ con $dU=\\omega$ (globale). Esatta $\\Rightarrow$ chiusa, non viceversa","c":true},{"x":"Sono sinonimi"},{"x":"Chiusa $\\Rightarrow$ esatta sempre"}],"hint":"Una condizione e' un test di derivate, l'altra e' l'esistenza di una primitiva.","sol":"$\\omega$ esatta $\\Rightarrow$ $P=\\partial_xU,\\ Q=\\partial_yU$ $\\Rightarrow$ $\\partial_yP=\\partial_xQ$ (Schwarz): esatta implica chiusa. Il viceversa richiede il <b>Lemma di Poincare'</b> e un dominio semplicemente connesso; il campo angolare e' il controesempio in cui l'implicazione fallisce."},{"t":"Il difetto 'chiusa ma non esatta' e' un'informazione su cosa?","opts":[{"x":"Sulla TOPOLOGIA del dominio (presenza di buchi): misura la coomologia di de Rham $H^1$","c":true},{"x":"Sulla regolarita' di $P,Q$"},{"x":"Sul segno di $\\omega$"}],"hint":"Su un aperto s.c. chiuso ed esatto coincidono.","sol":"Su un aperto s.c. chiuso $=$ esatto (Poincare'). Le forme chiuse non esatte, modulo le esatte, formano $H^1_{dR}(\\Omega)$: per il piano bucato $H^1\\cong\\mathbb{R}$, generato proprio da $d\\theta=\\dfrac{-y\\,dx+x\\,dy}{x^2+y^2}$. E' un invariante del dominio, non del campo."},{"t":"$\\omega=\\dfrac{-y\\,dx+x\\,dy}{x^2+y^2}$ e' chiusa su $\\mathbb{R}^2\\setminus\\{0\\}$. E' esatta?","opts":[{"x":"No: la circuitazione sul cerchio unitario vale $2\\pi\\neq0$; e' il generatore di $H^1$","c":true},{"x":"Si', con $U=\\arctan(y/x)$ globale"},{"x":"Si', perche' chiusa"}],"hint":"$\\arctan(y/x)$ e' un potenziale locale o globale?","sol":"$\\arctan(y/x)$ e' un potenziale LOCALE, non globale: salta di $2\\pi$ e non e' definito su $x=0$. L'angolo $\\theta$ e' multivalore, nessun $U$ monovalore esiste su tutto $\\Omega$; quindi $\\omega$ NON e' esatta, benche' chiusa. La circuitazione $2\\pi$ e' la prova."}]},{"pool":"conserv","src":"domini stellati e Lemma di Poincare' · manuale","steps":[{"t":"Perche' su un dominio CONVESSO (palla, rettangolo, tutto $\\mathbb{R}^n$) l'irrotazionalita' basta per la conservativita'?","opts":[{"x":"Convesso $\\Rightarrow$ stellato $\\Rightarrow$ semplicemente connesso; per il Lemma di Poincare' ogni forma chiusa e' esatta","c":true},{"x":"Perche' i convessi sono limitati"},{"x":"Perche' su un convesso ogni campo e' costante"}],"hint":"La chiave e' la contrattilita' dei lacci, non la limitatezza.","sol":"<b>Lemma di Poincare':</b> su un aperto stellato rispetto a $x_0$ ogni forma chiusa e' esatta, con potenziale esplicito $U(x)=\\int_0^1 F\\big(x_0+t(x-x_0)\\big)\\cdot(x-x_0)\\,dt$. Convesso $\\Rightarrow$ stellato rispetto a ogni punto; nessun buco $\\Rightarrow$ nessuna ostruzione."},{"t":"Cosa significa che $\\Omega$ e' STELLATO rispetto a $x_0$?","opts":[{"x":"Per ogni $x\\in\\Omega$ l'intero segmento $[x_0,x]$ e' contenuto in $\\Omega$","c":true},{"x":"$\\Omega$ ha la forma di una stella"},{"x":"$\\Omega$ e' simmetrico rispetto a $x_0$"}],"hint":"Esiste un 'centro' visibile da tutti i punti via segmento rettilineo.","sol":"Definizione: esiste $x_0$ tale che ogni punto e' collegato a $x_0$ da un segmento tutto contenuto in $\\Omega$. Convesso $\\Rightarrow$ stellato rispetto a OGNI punto; stellato $\\Rightarrow$ s.c. (si contrae lungo i segmenti verso $x_0$). Nessuna delle inverse vale."},{"t":"Una corona circolare $1<|(x,y)|<2$ e' stellata? Ci si puo' fidare della sola chiusura per l'esattezza?","opts":[{"x":"No, non e' stellata ne' s.c. (ha un buco): la sola chiusura NON garantisce l'esattezza","c":true},{"x":"Si', e' stellata rispetto al centro"},{"x":"Si', ogni corona e' s.c."}],"hint":"I segmenti verso un ipotetico centro attraverserebbero il buco.","sol":"Nessun punto della corona 'vede' tutti gli altri via segmento (il buco centrale interrompe i segmenti). Non e' s.c.: come per il piano bucato esistono forme chiuse non esatte. Va sempre verificata la circuitazione attorno al buco, non basta il rotore."}]},{"pool":"conserv","src":"lavoro su cammino quando F NON e' conservativo · manuale","steps":[{"t":"$F=(-y,\\,x)$ su $\\mathbb{R}^2$. Devo calcolare il lavoro da $A=(1,0)$ a $B=(0,1)$: posso usare $U(B)-U(A)$? Primo passo: e' conservativo?","opts":[{"x":"No: $\\partial_yF_1=-1\\neq1=\\partial_xF_2$, non e' chiuso, quindi non conservativo; niente potenziale","c":true},{"x":"Si', $\\mathbb{R}^2$ e' s.c."},{"x":"Si', ha potenziale $U=xy$"}],"hint":"Confronta $\\partial_yF_1$ e $\\partial_xF_2$ prima di cercare un potenziale.","sol":"$\\partial_y(-y)=-1$ e $\\partial_x(x)=+1$: la <b>condizione di chiusura</b> e' violata, il campo non e' irrotazionale, dunque non conservativo su alcun aperto. La scorciatoia $U(B)-U(A)$ NON e' disponibile: si deve parametrizzare e integrare. Applicare un potenziale a un campo che non ne ha e' l'errore piu' costoso."},{"t":"Cammino 1: arco di cerchio unitario $\\gamma_1:\\ (\\cos t,\\sin t),\\ t\\in[0,\\pi/2]$. Calcola l'integranda $F\\cdot d\\mathbf{r}$.","opts":[{"x":"$dt$: infatti $(-\\sin t)(-\\sin t)+(\\cos t)(\\cos t)\\,dt=dt$","c":true},{"x":"$0$"},{"x":"$\\cos 2t\\,dt$"}],"hint":"Su $\\gamma_1$ vale $F=(-\\sin t,\\cos t)$ e $d\\mathbf{r}=(-\\sin t,\\cos t)\\,dt$.","sol":"$F=(-y,x)=(-\\sin t,\\cos t)$, $d\\mathbf{r}=(-\\sin t,\\cos t)\\,dt$; il prodotto scalare da' $\\sin^2 t+\\cos^2 t=1$, cioe' $F\\cdot d\\mathbf{r}=dt$."},{"t":"Integra il lavoro lungo $\\gamma_1$.","opts":[{"x":"$\\int_0^{\\pi/2}dt=\\pi/2$","c":true},{"x":"$2\\pi$"},{"x":"$1$"}],"hint":"Gli estremi vanno da $0$ a $\\pi/2$.","sol":"$\\int_0^{\\pi/2}1\\,dt=\\pi/2$: e' il lavoro lungo l'arco di quarto di cerchio."},{"t":"Cammino 2: segmento rettilineo $\\gamma_2:\\ (1-s,\\,s),\\ s\\in[0,1]$, stessi estremi $A,B$. Calcola il lavoro.","opts":[{"x":"$\\int_0^1 1\\,ds=1$","c":true},{"x":"$\\pi/2$, come sull'arco"},{"x":"$0$"}],"hint":"$d\\mathbf{r}=(-1,1)\\,ds$ e $F=(-y,x)=(-s,\\,1-s)$.","sol":"$F=(-s,1-s)$, $d\\mathbf{r}=(-1,1)\\,ds$; $F\\cdot d\\mathbf{r}=(-s)(-1)+(1-s)(1)\\,ds=(s+1-s)\\,ds=ds$. Integrale $=\\int_0^1 ds=1$."},{"t":"Confronta i due risultati e concludi.","opts":[{"x":"$\\pi/2\\neq1$: il lavoro dipende dal cammino, conferma diretta che $F$ non e' conservativo","c":true},{"x":"Coincidono, dunque conservativo"},{"x":"Il calcolo e' sbagliato, devono coincidere"}],"hint":"Cosa dice la caratterizzazione conservativo $\\Leftrightarrow$ indipendenza dal cammino?","sol":"Per il <b>teorema di caratterizzazione</b> un campo conservativo da' integrale indipendente dal cammino. Qui $\\pi/2\\neq1$: la dipendenza dal cammino e' la controprova operativa della non-conservativita'. Morale d'esame: quando il campo non e' chiuso si PARAMETRIZZA sempre, mai $U(B)-U(A)$."}]},{"pool":"conserv","src":"stesso campo angolare ristretto a x>0: cambia il dominio, diventa esatto · manuale","steps":[{"t":"Riprendi $F=\\dfrac{(-y,\\,x)}{x^2+y^2}$, ora ristretto a $\\Omega'=\\{x>0\\}$ (semipiano destro). Primo passo: $\\Omega'$ e' semplicemente connesso?","opts":[{"x":"Si': e' convesso (dunque stellato, dunque s.c.) e non contiene l'origine","c":true},{"x":"No, ha ancora il buco nell'origine"},{"x":"No, e' illimitato"}],"hint":"L'origine appartiene a $\\{x>0\\}$? E un convesso e' s.c.?","sol":"L'origine ha $x=0\\notin\\Omega'$: il buco e' escluso dal dominio. Un semipiano aperto e' <b>convesso</b> $\\Rightarrow$ stellato $\\Rightarrow$ semplicemente connesso. L'illimitatezza non c'entra con la semplice connessione."},{"t":"$F$ e' chiuso su $\\Omega'$?","opts":[{"x":"Si': $\\partial_yF_1=\\partial_xF_2=\\dfrac{y^2-x^2}{(x^2+y^2)^2}$, come su tutto il dominio di definizione","c":true},{"x":"No, la chiusura vale solo sull'asse $x$"},{"x":"$F$ non e' definito su $\\Omega'$"}],"hint":"La chiusura e' una proprieta' locale: vale ovunque $F$ e' definito.","sol":"Il calcolo delle derivate incrociate e' identico e da' l'uguaglianza in ogni punto con $x^2+y^2\\neq0$, in particolare su tutto $\\Omega'$. La chiusura non dipende dal dominio scelto: e' <b>locale</b>."},{"t":"Chiuso $+$ $\\Omega'$ s.c.: quale teorema applichi e cosa ottieni?","opts":[{"x":"Lemma di Poincare': su uno stellato ogni forma chiusa e' esatta, quindi esiste $U$ su $\\Omega'$","c":true},{"x":"Nessuno: resta non esatto come su $\\mathbb{R}^2\\setminus\\{0\\}$"},{"x":"Il teorema di Stokes"}],"hint":"E' proprio l'ipotesi di semplice connessione che prima mancava.","sol":"<b>Lemma di Poincare':</b> su un aperto stellato chiuso $\\Rightarrow$ esatto. Sul piano bucato mancava la semplice connessione; ristretti a $\\Omega'$ l'ipotesi c'e' e la conclusione cambia: ora un potenziale globale esiste."},{"t":"Verifica che $U(x,y)=\\arctan\\!\\big(\\tfrac{y}{x}\\big)$ e' un potenziale su $\\Omega'$: calcola $\\nabla U$.","opts":[{"x":"$\\nabla U=\\big(\\tfrac{-y}{x^2+y^2},\\,\\tfrac{x}{x^2+y^2}\\big)=F$","c":true},{"x":"$\\nabla U=(0,0)$"},{"x":"$\\nabla U=\\big(\\tfrac{y}{x^2+y^2},\\,\\tfrac{-x}{x^2+y^2}\\big)=-F$"}],"hint":"$\\partial_x\\arctan(y/x)$ con $\\tfrac{d}{du}\\arctan u=\\tfrac{1}{1+u^2}$ e $u=y/x$.","sol":"$\\partial_xU=\\tfrac{1}{1+(y/x)^2}\\cdot(-y/x^2)=\\tfra
