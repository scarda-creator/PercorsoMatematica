"cont":"Il resto in polari"},{"t":"Con $\\nabla f(0,0)=0$, il resto &egrave; $R=\\dfrac{f(h,k)}{\\sqrt{h^2+k^2}}$. Passa in polari.","opts":[{"x":"$R=\\rho\\cos^2\\theta\\sin^2\\theta\\le\\rho\\to0$ UNIFORMEMENTE in $\\theta$","c":true},{"x":"$R=\\cos^2\\theta\\sin^2\\theta$, dipende da $\\theta$, quindi non tende a 0"},{"x":"$R\\to\\tfrac14$"}],"hint":"$h=\\rho\\cos\\theta$, $k=\\rho\\sin\\theta$; conta i gradi: numeratore $\\rho^4$, denominatore $\\rho^2\\cdot\\rho=\\rho^3$.","sol":"$R=\\dfrac{h^2k^2}{(h^2+k^2)^{3/2}}=\\dfrac{\\rho^4\\cos^2\\theta\\sin^2\\theta}{\\rho^3}=\\rho\\cos^2\\theta\\sin^2\\theta$. Poich&eacute; $\\cos^2\\theta\\sin^2\\theta\\le\\tfrac14$, si ha $0\\le R\\le\\tfrac14\\rho\\to0$: la maggiorazione &egrave; UNIFORME in $\\theta$. Per il criterio delle polari il resto tende a 0.","cont":"Conclusione: differenziabile"},{"t":"Conclusione sulla differenziabilit&agrave;.","opts":[{"x":"il resto tende a 0 uniformemente: per definizione $f$ &egrave; differenziabile in $(0,0)$, con differenziale nullo","c":true},{"x":"non &egrave; differenziabile perch&eacute; le direzionali non sono lineari"},{"x":"&egrave; solo derivabile, non differenziabile"}],"hint":"la definizione di differenziabilit&agrave; chiede solo che il resto tenda a 0.","sol":"Il resto tende a 0, quindi per DEFINIZIONE $f$ &egrave; differenziabile in $(0,0)$ con $df_{(0,0)}=0$. Contrasto con l'unit&agrave; precedente: l&igrave; la stima polare NON era uniforme in $\\theta$; qui lo &egrave;, e questo fa la differenza tra concludere e non concludere.","cont":"Piano tangente"},{"t":"Scrivi il piano tangente al grafico in $(0,0,0)$.","opts":[{"x":"$z=0$ (il piano $z=f(0,0)+\\nabla f(0,0)\\cdot(x,y)=0$)","c":true},{"x":"$z=x+y$"},{"x":"il piano tangente non esiste perch&eacute; $f$ &egrave; un quoziente"}],"hint":"$z=f(0,0)+f_x(0,0)\\,x+f_y(0,0)\\,y$.","sol":"Poich&eacute; $f$ &egrave; differenziabile, il piano tangente esiste ed &egrave; $z=f(0,0)+f_x(0,0)x+f_y(0,0)y=0$. Il piano tangente ha senso PROPRIO perch&eacute; abbiamo verificato la differenziabilit&agrave; (senza di essa, il &laquo;piano dei gradienti&raquo; non sarebbe tangente).","cont":"Approssimazione lineare"},{"t":"Usa il piano tangente per stimare $f(0.1,\\,0.1)$ e confronta col valore vero.","opts":[{"x":"stima $\\approx0$; vero $=\\dfrac{0.01\\cdot0.01}{0.02}=0.005$: errore $\\sim\\tfrac14\\rho\\approx0.035$, coerente col resto","c":true},{"x":"stima $=0.1$; l'approssimazione &egrave; esatta"},{"x":"non si pu&ograve; usare il piano tangente per approssimare"}],"hint":"approssimazione lineare $f(h,k)\\approx f(0,0)+\\nabla f(0,0)\\cdot(h,k)=0$; poi calcola il valore esatto.","sol":"L'approssimazione lineare d&agrave; $f(0.1,0.1)\\approx0$. Il valore vero &egrave; $\\dfrac{(0.01)(0.01)}{0.02}=0.005$. L'errore ($0.005$) &egrave; dell'ordine di $\\tfrac14\\rho^2$ del resto (qui $R\\cdot\\rho$), coerente con $R\\to0$: la differenziabilit&agrave; garantisce che l'errore sia $o(\\rho)$."}]},{"pool":"diff","src":"tipo C · manuale · (x^2+y^2)sin(1/r) — C^1 fallisce (parziali discontinue) ma f e' differenziabile","steps":[{"t":"Sia $f(x,y)=(x^2+y^2)\\sin\\dfrac{1}{\\sqrt{x^2+y^2}}$ per $(x,y)\\ne(0,0)$, $f(0,0)=0$. Continuit&agrave; in $(0,0)$?","opts":[{"x":"$|f|\\le x^2+y^2\\to0$, continua","c":true},{"x":"non continua: $\\sin(1/r)$ oscilla e non ha limite"},{"x":"il limite vale 1"}],"hint":"$|\\sin(\\cdot)|\\le1$: il fattore $(x^2+y^2)$ schiaccia l'oscillazione.","sol":"Poich&eacute; $\\big|\\sin\\tfrac1r\\big|\\le1$ (con $r=\\sqrt{x^2+y^2}$), si ha $|f|\\le x^2+y^2\\to0$. Per il teorema del confronto $f\\to0=f(0,0)$: continua. L'oscillazione &egrave; irrilevante perch&eacute; limitata e moltiplicata per un infinitesimo.","cont":"Parziali nell'origine"},{"t":"Calcola $\\nabla f(0,0)$ dalla definizione.","opts":[{"x":"$\\nabla f(0,0)=(0,0)$","c":true},{"x":"$\\nabla f(0,0)$ non esiste perch&eacute; $\\sin(1/r)$ oscilla"},{"x":"$\\nabla f(0,0)=(1,1)$"}],"hint":"$\\dfrac{f(t,0)}{t}=t\\sin\\tfrac{1}{|t|}$: usa di nuovo lo squeeze.","sol":"$f_x(0,0)=\\lim_{t\\to0}\\dfrac{f(t,0)}{t}=\\lim_{t\\to0}\\dfrac{t^2\\sin(1/|t|)}{t}=\\lim_{t\\to0}t\\sin\\tfrac{1}{|t|}=0$ per confronto ($|t\\sin(\\cdot)|\\le|t|$). Analogamente $f_y(0,0)=0$. Quindi $\\nabla f(0,0)=(0,0)$.","cont":"Le parziali FUORI dall'origine"},{"t":"Per $(x,y)\\ne(0,0)$ si ha $f_x=2x\\sin\\tfrac1r-\\dfrac{x}{r}\\cos\\tfrac1r$. &Egrave; continua in $(0,0)$?","opts":[{"x":"no: lungo l'asse $x$, $f_x(x,0)=2x\\sin\\tfrac1{|x|}-\\operatorname{sgn}(x)\\cos\\tfrac1{|x|}$ oscilla e non ha limite","c":true},{"x":"s&igrave;: $f_x\\to0=f_x(0,0)$"},{"x":"$f_x$ non &egrave; nemmeno definita fuori dall'origine"}],"hint":"il termine $2x\\sin\\to0$, ma $\\tfrac{x}{r}\\cos\\tfrac1r$ lungo $y=0$ diventa $\\pm\\cos\\tfrac1{|x|}$.","sol":"Derivando con le regole (validi fuori dall'origine): $f_x=2x\\sin\\tfrac1r-\\tfrac{x}{r}\\cos\\tfrac1r$. Lungo $y=0$, $x\\to0^+$: $2x\\sin\\tfrac1x\\to0$ ma $\\cos\\tfrac1x$ oscilla senza limite. Quindi $\\lim_{(x,y)\\to0}f_x$ NON esiste: $f_x$ non &egrave; continua in $(0,0)$.","cont":"La strada C^1 e perch&eacute; fallisce"},{"t":"Le parziali esistono ovunque ma $f_x$ non &egrave; continua in $(0,0)$. Cosa si conclude sulla differenziabilit&agrave;?","opts":[{"x":"nulla per ora: il teorema del differenziale totale (C^1 implica differenziabile) &egrave; solo SUFFICIENTE; la sua ipotesi qui salta, quindi non decide — bisogna passare al resto","c":true},{"x":"non &egrave; differenziabile, perch&eacute; $C^1$ &egrave; necessario per la differenziabilit&agrave;"},{"x":"&egrave; differenziabile, perch&eacute; le parziali esistono ovunque"}],"hint":"$C^1$ &egrave; condizione sufficiente o necessaria? La sua negazione conclude?","sol":"Il teorema del differenziale totale afferma: parziali continue in un intorno implica differenziabile. &Egrave; SUFFICIENTE, non necessaria. Qui l'ipotesi ($f_x$ continua) &egrave; falsa, quindi il teorema NON si applica e NON dice che $f$ non &egrave; differenziabile. La via $C^1$ &egrave; inconcludente: si torna alla definizione (il resto).","cont":"Il resto decide"},{"t":"Calcola il limite del resto (con $\\nabla f(0,0)=0$).","opts":[{"x":"$R=\\dfrac{f(h,k)}{\\sqrt{h^2+k^2}}=\\rho\\sin\\tfrac1\\rho\\to0$, quindi $f$ &egrave; differenziabile","c":true},{"x":"$R=\\sin\\tfrac1\\rho$ non ha limite, quindi $f$ non &egrave; differenziabile"},{"x":"$R\\to1$"}],"hint":"in polari $f(h,k)=\\rho^2\\sin\\tfrac1\\rho$; dividi per $\\rho$.","sol":"$R=\\dfrac{f(h,k)}{\\rho}=\\dfrac{\\rho^2\\sin(1/\\rho)}{\\rho}=\\rho\\sin\\tfrac1\\rho$, e $|R|\\le\\rho\\to0$ per confronto. Il resto tende a 0: per DEFINIZIONE $f$ &egrave; differenziabile in $(0,0)$.","cont":"La lezione"},{"t":"Cosa ti porti a casa da questo esercizio?","opts":[{"x":"$f$ pu&ograve; essere differenziabile senza essere $C^1$: il fallimento della continuit&agrave; delle parziali NON &egrave; una prova di non differenziabilit&agrave;; serve il resto","c":true},{"x":"differenziabile e $C^1$ sono equivalenti"},{"x":"se le parziali non sono continue, la funzione non &egrave; nemmeno derivabile"}],"hint":"in che direzione va l'implicazione del differenziale totale?","sol":"$C^1$ implica differenziabile, ma NON viceversa: questa $f$ &egrave; differenziabile pur avendo parziali discontinue in $(0,0)$. Errore d'esame tipico: dedurre &laquo;parziali discontinue quindi non differenziabile&raquo;. La sola via sicura quando $C^1$ salta &egrave; il limite del resto."}]},{"pool":"diff","src":"tipo C · manuale · piano tangente: scriverlo e usarlo, e il caso in cui NON esiste","steps":[{"t":"Sia $f(x,y)=\\ln(1+2x+y^2)$. &Egrave; differenziabile in $(0,0)$? (giustifica prima di scrivere il piano)","opts":[{"x":"s&igrave;: vicino a $(0,0)$ l'argomento $1+2x+y^2$ vale $\\approx1>0$ e $\\ln$ &egrave; $C^\\infty$, quindi $f$ &egrave; $C^1$ e per il teorema del differenziale totale differenziabile","c":true},{"x":"no, perch&eacute; contiene un logaritmo"},{"x":"solo dopo aver verificato il limite del resto si pu&ograve; dire"}],"hint":"composizione di funzioni lisce dove l'argomento del log &egrave; positivo.","sol":"L'argomento $1+2x+y^2$ &egrave; $>0$ in un intorno di $(0,0)$ (vale 1 nell'origine), e $\\ln$ &egrave; $C^\\infty$ sui positivi: $f$ &egrave; composizione di funzioni $C^\\infty$, dunque $C^1$. Per il teorema del differenziale totale ($C^1$ implica differenziabile), $f$ &egrave; differenziabile: qui il piano tangente esiste di diritto, senza passare dal resto.","cont":"Il gradiente"},{"t":"Calcola $\\nabla f(0,0)$.","opts":[{"x":"$\\nabla f(0,0)=(2,0)$","c":true},{"x":"$\\nabla f(0,0)=(0,0)$"},{"x":"$\\nabla f(0,0)=(2,2)$"}],"hint":"$f_x=\\dfrac{2}{1+2x+y^2}$, $f_y=\\dfrac{2y}{1+2x+y^2}$; valuta in $(0,0)$.","sol":"$f_x=\\dfrac{2}{1+2x+y^2}$ e $f_y=\\dfrac{2y}{1+2x+y^2}$ (regola della catena). In $(0,0)$: $f_x=2$, $f_y=0$, quindi $\\nabla f(0,0)=(2,0)$. Qui le regole sono lecite perch&eacute; $f$ &egrave; liscia nell'intorno.","cont":"Il piano tangente"},{"t":"Scrivi il piano tangente al grafico in $(0,0,0)$.","opts":[{"x":"$z=2x$","c":true},{"x":"$z=2x+2y$"},{"x":"$z=\\ln(1)+2x+y^2=2x+y^2$"}],"hint":"$z=f(0,0)+\\nabla f(0,0)\\cdot(x,y)$: il piano tangente &egrave; LINEARE, niente $y^2$.","sol":"$z=f(0,0)+f_x(0,0)x+f_y(0,0)y=0+2x+0=2x$. Trabocchetto: il piano tangente &egrave; l'approssimazione LINEARE, non il troncamento della formula; il termine $y^2$ non vi compare.","cont":"Approssimazione lineare"},{"t":"Stima $f(0.1,\\,0.2)$ con il piano tangente e confronta col valore vero.","opts":[{"x":"stima $=2(0.1)=0.2$; vero $=\\ln(1.24)\\approx0.215$: errore $\\approx0.015$, coerente con l'ordine $o(\\rho)$","c":true},{"x":"stima $=0.24$; coincide col valore vero"},{"x":"non si pu&ograve; approssimare perch&eacute; $0.2$ non &egrave; abbastanza piccolo"}],"hint":"$f(h,k)\\approx f(0,0)+\\nabla f(0,0)\\cdot(h,k)=2h$; poi $\\ln(1+0.2+0.04)$.","sol":"Approssimazione lineare: $f(0.1,0.2)\\approx2\\cdot0.1=0.2$. Valore vero: $\\ln(1+0.2+0.04)=\\ln(1.24)\\approx0.2151$. L'errore ($\\approx0.015$) &egrave; un $o(\\rho)$ garantito dalla differenziabilit&agrave;.","cont":"Quando il piano NON esiste"},{"t":"Per $g(x,y)=\\dfrac{x^3}{x^2+y^2}$ ($g(0,0)=0$) qualcuno calcola $\\nabla g(0,0)=(1,0)$ e scrive &laquo;piano tangente $z=x$&raquo;. &Egrave; corretto?","opts":[{"x":"no: $g$ NON &egrave; differenziabile in $(0,0)$ (resto non nullo), quindi non esiste alcun piano tangente; $z=x$ non &egrave; tangente al grafico","c":true},{"x":"s&igrave;: il gradiente esiste, quindi $z=x$ &egrave; il piano tangente"},{"x":"s&igrave;, ma solo lungo l'asse $x$"}],"hint":"l'esistenza del gradiente basta per scrivere l'espressione, ma la rende TANGENTE?","sol":"L'esistenza di $\\nabla g(0,0)$ permette di scrivere il piano candidato $z=x$, ma il piano &egrave; tangente SOLO se $g$ &egrave; differenziabile. Per $g$ il resto $\\dfrac{-hk^2}{(h^2+k^2)^{3/2}}$ non tende a 0 (vedi la prima unit&agrave; di questo lotto): $g$ non &egrave; differenziabile, il piano tangente NON esiste, e $z=x$ non approssima $g$ al primo ordine.","cont":"Il criterio"},{"t":"Enuncia il criterio che distingue i due casi.","opts":[{"x":"il piano $z=f(0,0)+\\nabla f(0,0)\\cdot(x,y)$ &egrave; tangente al grafico se e solo se $f$ &egrave; differenziabile in $(0,0)$; il solo gradiente non basta","c":true},{"x":"il piano tangente esiste sempre che esista il gradiente"},{"x":"il piano tangente esiste sempre che $f$ sia continua"}],"hint":"cosa lega &laquo;piano tangente&raquo; e &laquo;differenziabile&raquo; per definizione?","sol":"Per definizione, il grafico ha piano tangente in $(0,0)$ se e solo se $f$ &egrave; differenziabile l&igrave;; in tal caso il piano &egrave; $z=f(0,0)+\\nabla f(0,0)\\cdot(x,y)$. L'esistenza di $\\nabla f(0,0)$ (cio&egrave; delle parziali) &egrave; necessaria ma non sufficiente: serve che il resto tenda a 0."}]},{"pool":"diff","src":"tipo C · manuale · x|y|/sqrt(x^2+y^2) — tutte le direzionali esistono, non differenziabile","steps":[{"t":"Sia $f(x,y)=\\dfrac{x|y|}{\\sqrt{x^2+y^2}}$ per $(x,y)\\ne(0,0)$, $f(0,0)=0$. Continuit&agrave; in $(0,0)$?","opts":[{"x":"$|f|\\le|y|\\le\\sqrt{x^2+y^2}\\to0$, continua","c":true},{"x":"non continua per la presenza del valore assoluto"},{"x":"lungo $y=x$ vale $\\tfrac{1}{\\sqrt2}$"}],"hint":"$|x|\\le\\sqrt{x^2+y^2}$: semplifica con la radice a denominatore.","sol":"Da $|x|\\le\\sqrt{x^2+y^2}$ segue $|f|=\\dfrac{|x||y|}{\\sqrt{x^2+y^2}}\\le|y|\\le\\sqrt{x^2+y^2}\\to0$. Per il teorema del confronto $f$ &egrave; continua in $(0,0)$.","cont":"Parziali dalla definizione"},{"t":"Calcola $\\nabla f(0,0)$ dalla definizione.","opts":[{"x":"$\\nabla f(0,0)=(0,0)$","c":true},{"x":"$f_y(0,0)$ non esiste per il valore assoluto"},{"x":"$\\nabla f(0,0)=(1,0)$"}],"hint":"$f(t,0)=0$ e $f(0,t)=\\dfrac{0\\cdot|t|}{|t|}=0$.","sol":"$f(t,0)=\\dfrac{t\\cdot0}{|t|}=0$ quindi $f_x(0,0)=0$; $f(0,t)=\\dfrac{0\\cdot|t|}{|t|}=0$ quindi $f_y(0,0)=0$. Entrambe esistono (il valore assoluto non le impedisce, perch&eacute; lungo gli assi il numeratore si annulla): $\\nabla f(0,0)=(0,0)$.","cont":"Derivate direzionali"},{"t":"Per $v=(v_1,v_2)$ versore, quanto vale $\\partial_v f(0,0)$?","opts":[{"x":"$\\partial_v f(0,0)=v_1|v_2|$, esiste per ogni $v$","c":true},{"x":"$\\partial_v f(0,0)=0$ per ogni $v$, come il gradiente"},{"x":"non esiste per direzioni con $v_2<0$"}],"hint":"$\\dfrac{f(tv_1,tv_2)}{t}=\\dfrac{tv_1|tv_2|/|t|}{t}$; nota $|tv_2|=|t||v_2|$.","sol":"$\\partial_v f(0,0)=\\lim_{t\\to0}\\dfrac{f(tv_1,tv_2)}{t}=\\lim\\dfrac{tv_1\\,|t||v_2|/|t|}{t}=\\lim\\dfrac{tv_1|v_2|}{t}=v_1|v_2|$. Esiste per OGNI versore $v$.","cont":"Il test e la conclusione"},{"t":"$\\partial_v f(0,0)=v_1|v_2|$ e $\\nabla f(0,0)\\cdot v=0$. Concludi.","opts":[{"x":"$v_1|v_2|$ non &egrave; lineare in $v$ (c'&egrave; $|v_2|$) e non coincide con 0: violata la condizione necessaria, $f$ NON &egrave; differenziabile","c":true},{"x":"sono uguali, quindi $f$ &egrave; differenziabile"},{"x":"la presenza di $|v_2|$ rende $f$ differenziabile solo nel primo quadrante"}],"hint":"per $v=(\\tfrac{\\sqrt2}{2},\\tfrac{\\sqrt2}{2})$: $v_1|v_2|=\\tfrac12\\ne0$.","sol":"Condizione necessaria di differenziabilit&agrave;: $\\partial_v f=\\nabla f\\cdot v$, LINEARE in $v$. Qui $\\partial_v f=v_1|v_2|$ non &egrave; lineare (il modulo rompe l'omogeneit&agrave; dispari) e vale $\\tfrac12\\ne0$ per $v=(\\tfrac{\\sqrt2}{2},\\tfrac{\\sqrt2}{2})$, mentre $\\nabla f\\cdot v=0$. Dunque $f$ NON &egrave; differenziabile: continua, con tutte le direzionali, ma non differenziabile."}]},{"pool":"diff","src":"tipo C · manuale · (x^3+y^3)/(x^2+y^2) — polari salvano la continuita' ma il resto nega la differenziabilita'","steps":[{"t":"Sia $f(x,y)=\\dfrac{x^3+y^3}{x^2+y^2}$ per $(x,y)\\ne(0,0)$, $f(0,0)=0$. Continuit&agrave; via coordinate polari.","opts":[{"x":"$f=\\rho(\\cos^3\\theta+\\sin^3\\theta)$, $|f|\\le2\\rho\\to0$ uniformemente: continua","c":true},{"x":"$f=\\cos^3\\theta+\\sin^3\\theta$, dipende da $\\theta$: non continua"},{"x":"il limite non esiste, lungo $y=x$ vale 1"}],"hint":"$h=\\rho\\cos\\theta$, $k=\\rho\\sin\\theta$: numeratore $\\rho^3$, denominatore $\\rho^2$.","sol":"In polari $f=\\dfrac{\\rho^3(\\cos^3\\theta+\\sin^3\\theta)}{\\rho^2}=\\rho(\\cos^3\\theta+\\sin^3\\theta)$. Poich&eacute; $|\\cos^3\\theta+\\sin^3\\theta|\\le2$, si ha $|f|\\le2\\rho\\to0$ UNIFORMEMENTE in $\\theta$: per il criterio delle polari $f$ &egrave; continua in $(0,0)$.","cont":"Parziali dalla definizione"},{"t":"Calcola $\\nabla f(0,0)$ dalla definizione.","opts":[{"x":"$\\nabla f(0,0)=(1,1)$","c":true},{"x":"$\\nabla f(0,0)=(0,0)$"},{"x":"le parziali non esistono"}],"hint":"$f(t,0)=\\dfrac{t^3}{t^2}=t$: il rapporto incrementale vale 1.","sol":"$f_x(0,0)=\\lim_{t\\to0}\\dfrac{f(t,0)}{t}=\\lim\\dfrac{t^3/t^2}{t}=\\lim\\dfrac{t}{t}=1$; per simmetria $f_y(0,0)=1$. Quindi $\\nabla f(0,0)=(1,1)$.","cont":"Il resto"},{"t":"Calcola il resto con $\\nabla f(0,0)=(1,1)$.","opts":[{"x":"$R=\\dfrac{f(h,k)-(h+k)}{\\sqrt{h^2+k^2}}=\\dfrac{-hk(h+k)}{(h^2+k^2)^{3/2}}=-\\cos\\theta\\sin\\theta(\\cos\\theta+\\sin\\theta)$","c":true},{"x":"$R\\to0$, quindi $f$ &egrave; differenziabile"},{"x":"$R$ &egrave; identicamente nullo"}],"hint":"$f(h,k)-(h+k)=\\dfrac{h^3+k^3-(h+k)(h^2+k^2)}{h^2+k^2}$: sviluppa il prodotto.","sol":"$f(h,k)-(h+k)=\\dfrac{h^3+k^3-(h+k)(h^2+k^2)}{h^2+k^2}=\\dfrac{-hk^2-h^2k}{h^2+k^2}=\\dfrac{-hk(h+k)}{h^2+k^2}$. Dividendo per $\\rho$ e passando in polari: $R=-\\cos\\theta\\sin\\theta(\\cos\\theta+\\sin\\theta)$, indipendente da $\\rho$.","cont":"Conclusione"},{"t":"Il resto vale $R=-\\cos\\theta\\sin\\theta(\\cos\\theta+\\sin\\theta)$. Concludi sulla differenziabilit&agrave;.","opts":[{"x":"$R$ dipende da $\\theta$ e non &egrave; nullo (es. $\\theta=\\tfrac\\pi4$: $R=-\\tfrac{1}{\\sqrt2}$): il limite del resto non esiste/non &egrave; 0, quindi $f$ NON &egrave; differenziabile","c":true},{"x":"$R$ &egrave; limitato, quindi $f$ &egrave; differenziabile"},{"x":"$f$ &egrave; differenziabile perch&eacute; continua"}],"hint":"perch&eacute; il resto tenda a 0 deve annullarsi al tendere di $\\rho\\to0$ per OGNI $\\theta$; qui non dipende da $\\rho$.","sol":"Il resto non dipende da $\\rho$ e vale $-\\tfrac{1}{\\sqrt2}\\cdot\\tfrac{\\sqrt2}{1}$... in $\\theta=\\tfrac\\pi4$: $-\\tfrac12\\cdot\\sqrt2=-\\tfrac{\\sqrt2}{2}\\ne0$. Il limite del resto per $\\rho\\to0$ dipende dalla direzione e non &egrave; 0: per definizione $f$ NON &egrave; differenziabile. Lezione: le polari con stima uniforme provano la CONTINUIT&Agrave;, ma la differenziabilit&agrave; ha un grado di omogeneit&agrave; in meno (il resto perde una potenza di $\\rho$) ed &egrave; una domanda separata."}]},{"pool":"diff","src":"tipo C · manuale · strategia (modus operandi) — ordine d'attacco di un esercizio tipo C","steps":[{"t":"Ti danno $f$ definita a pezzi, con $f(0,0)=0$ e l'origine punto critico. Qual &egrave; la PRIMA cosa da controllare, e perch&eacute;?","opts":[{"x":"la continuit&agrave; in $(0,0)$: se $f$ non &egrave; continua, per la contrappositiva di &laquo;differenziabile implica continua&raquo; hai gi&agrave; concluso che non &egrave; differenziabile, senza altri calcoli","c":true},{"x":"il limite del resto, che &egrave; la definizione di differenziabilit&agrave;"},{"x":"il piano tangente, cos&igrave; hai subito il gradiente"}],"hint":"qual &egrave; il test che, se fallisce, chiude l'esercizio in una riga?","sol":"Si parte SEMPRE dalla continuit&agrave;: &egrave; il filtro pi&ugrave; economico. Se $f$ non &egrave; continua in $(0,0)$, la contrappositiva del teorema &laquo;differenziabile implica continua&raquo; d&agrave; subito la non differenziabilit&agrave;, e ci si ferma. Partire dal resto significa rischiare un calcolo lungo quando bastava una curva per la discontinuit&agrave;.","cont":"Le parziali"},{"t":"$f$ &egrave; risultata continua. Ora servono le parziali in $(0,0)$: con quale strumento?","opts":[{"x":"dalla definizione, cio&egrave; $f_x(0,0)=\\lim_{t\\to0}\\frac{f(t,0)-f(0,0)}{t}$; le regole del quoziente NON valgono nel punto singolare","c":true},{"x":"con le regole di derivazione applicate alla formula del quoziente"},{"x":"non servono: se $f$ &egrave; continua &egrave; anche derivabile"}],"hint":"nel punto dove $f$ cambia definizione, la formula &laquo;liscia&raquo; non &egrave; valida.","sol":"Nel punto di raccordo si usa SEMPRE la definizione di derivata parziale (limite del rapporto incrementale lungo gli assi). Le regole di derivazione valgono solo dove $f$ &egrave; data da un'unica espressione liscia; applicarle in $(0,0)$ &egrave; l'errore pi&ugrave; frequente e produce gradienti sbagliati.","cont":"Direzionali e differenziabilit&agrave;"},{"t":"Hai verificato che TUTTE le derivate direzionali esistono. Puoi concludere che $f$ &egrave; differenziabile?","opts":[{"x":"no: l'esistenza delle direzionali &egrave; necessaria ma non sufficiente; devi ancora controllare che $\\partial_v f=\\nabla f\\cdot v$ (linearit&agrave;) e poi il limite del resto","c":true},{"x":"s&igrave;: se esistono tutte le direzionali, $f$ &egrave; differenziabile"},{"x":"s&igrave;, purch&eacute; siano tutte finite"}],"hint":"ricorda l'unit&agrave; con $\\partial_v f=v_1^3$: direzionali tutte esistenti, ma non differenziabile.","sol":"L'esistenza (anche di TUTTE) le direzionali NON basta: la condizione necessaria &egrave; che $\\partial_v f(0,0)=\\nabla f(0,0)\\cdot v$, LINEARE in $v$. Se questa fallisce, si conclude subito la non differenziabilit&agrave;; se regge, resta l'unico test decisivo: il limite del resto.","cont":"L'ordine completo"},{"t":"Riassumi l'ordine ottimale d'attacco.","opts":[{"x":"continuit&agrave; -> parziali dalla definizione -> (test linearit&agrave; delle direzionali) -> resto; oppure, se le parziali sono continue in un intorno, scorciatoia $C^1$","c":true},{"x":"resto -> continuit&agrave; -> parziali -> direzionali"},{"x":"piano tangente -> continuit&agrave; -> resto"}],"hint":"dal filtro pi&ugrave; economico al test decisivo; e la scorciatoia quando le parziali sono continue.","sol":"Ordine: (1) continuit&agrave; (se salta, chiuso); (2) parziali in $(0,0)$ dalla definizione, per avere $\\nabla f(0,0)$; (3) eventualmente le direzionali e il test di linearit&agrave; $\\partial_v f=\\nabla f\\cdot v$; (4) il limite del resto, che decide. Scorciatoia: se le parziali esistono e sono CONTINUE in un intorno, il teorema del differenziale totale ($C^1$ implica differenziabile) chiude senza calcolare il resto."}]},{"pool":"diff","src":"tipo C · manuale · |x|^a y/(x^2+y^2) — soglia continuita' vs soglia differenziabilita'","steps":[{"t":"Sia $f(x,y)=\\dfrac{|x|^\\alpha y}{x^2+y^2}$ per $(x,y)\\ne(0,0)$, $f(0,0)=0$, con $\\alpha>0$. Per quali $\\alpha$ &egrave; continua in $(0,0)$?","opts":[{"x":"per $\\alpha>1$","c":true},{"x":"per ogni $\\alpha>0$"},{"x":"per $\\alpha>2$"}],"hint":"polari: $|f|\\le\\rho^{\\alpha-1}$; l'esponente deve essere positivo. Controlla $\\alpha=1$ lungo $y=x$.","sol":"In polari $f=\\dfrac{\\rho^\\alpha|\\cos\\theta|^\\alpha\\,\\rho\\sin\\theta}{\\rho^2}=\\rho^{\\alpha-1}|\\cos\\theta|^\\alpha\\sin\\theta$, quindi $|f|\\le\\rho^{\\alpha-1}\\to0$ uniformemente sse e solo se $\\alpha>1$. Per $\\alpha=1$ resta $|\\cos\\theta|\\sin\\theta$ (lungo $y=x$ vale $\\tfrac12\\ne0$): non continua. Continua sse $\\alpha>1$ (criterio delle polari con stima uniforme).","cont":"Parziali dalla definizione"},{"t":"Per gli $\\alpha$ in cui $f$ &egrave; continua, calcola $\\nabla f(0,0)$ dalla definizione.","opts":[{"x":"$\\nabla f(0,0)=(0,0)$","c":true},{"x":"$\\nabla f(0,0)=(1,0)$"},{"x":"dipende da $\\alpha$"}],"hint":"$f(t,0)=0$ (c'&egrave; il fattore $y$) e $f(0,t)=0$ (c'&egrave; il fattore $|x|^\\alpha$).","sol":"$f(t,0)=\\dfrac{|t|^\\alpha\\cdot0}{t^2}=0$ quindi $f_x(0,0)=0$; $f(0,t)=\\dfrac{0\\cdot t}{t^2}=0$ quindi $f_y(0,0)=0$. Dunque $\\nabla f(0,0)=(0,0)$ per ogni $\\alpha$, per definizione di derivata parziale.","cont":"Soglia di differenziabilit&agrave;"},{"t":"Con $\\nabla f(0,0)=0$, il resto &egrave; $R=\\dfrac{f(h,k)}{\\rho}$. Per quali $\\alpha$ tende a 0?","opts":[{"x":"per $\\alpha>2$: $R=\\rho^{\\alpha-2}|\\cos\\theta|^\\alpha\\sin\\theta$, con $|R|\\le\\rho^{\\alpha-2}\\to0$ sse $\\alpha>2$","c":true},{"x":"per $\\alpha>1$, come la continuit&agrave;"},{"x":"per ogni $\\alpha>0$"}],"hint":"dividere per $\\rho$ abbassa di 1 l'esponente rispetto alla continuit&agrave;.","sol":"$R=\\dfrac{f(h,k)}{\\rho}=\\rho^{\\alpha-2}|\\cos\\theta|^\\alpha\\sin\\theta$, quindi $|R|\\le\\rho^{\\alpha-2}\\to0$ uniformemente sse $\\alpha>2$. Per $\\alpha=2$ resta $|\\cos\\theta|^2\\sin\\theta$ (dipende da $\\theta$, non nullo lungo $y=x$): il resto non tende a 0. Differenziabile sse $\\alpha>2$.","cont":"Il confronto delle soglie"},{"t":"Confronta le due soglie. Cosa succede per $1<\\alpha\\le2$?","opts":[{"x":"soglia continuit&agrave; ($\\alpha>1$) meno restrittiva di soglia differenziabilit&agrave; ($\\alpha>2$): per $1<\\alpha\\le2$ la $f$ &egrave; continua ma NON differenziabile","c":true},{"x":"le due soglie coincidono, quindi continua sse differenziabile"},{"x":"per $1<\\alpha\\le2$ non &egrave; nemmeno continua"}],"hint":"differenziabile implica continua: la soglia di differenziabilit&agrave; deve essere pi&ugrave; alta o uguale.","sol":"Poich&eacute; differenziabile implica continua, la soglia della differenziabilit&agrave; &egrave; sempre $\\ge$ quella della continuit&agrave;: qui $\\alpha>2$ contro $\\alpha>1$. Nella finestra $1<\\alpha\\le2$ la funzione &egrave; continua ma non differenziabile. Il &laquo;grado in meno&raquo; ($-1$ nell'esponente) &egrave; la firma della divisione per $\\rho$ nel resto: ogni ordine di differenziabilit&agrave; costa una potenza di $\\rho$ in pi&ugrave;."}]},{"pool":"diff","src":"tipo C · da Insubria (dispensa Analisi 2) · manuale — (1-cos xy)/(x^2+y^2)^a, soglie via limite notevole","steps":[{"t":"Sia $f(x,y)=\\dfrac{1-\\cos(xy)}{(x^2+y^2)^a}$ per $(x,y)\\ne(0,0)$, $f(0,0)=0$, con $a>0$. Primo passo: sostituire il limite notevole. Cosa usi?","opts":[{"x":"$1-\\cos(xy)\\sim\\dfrac{(xy)^2}{2}=\\dfrac{x^2y^2}{2}$ e la maggiorazione $1-\\cos t\\le\\dfrac{t^2}{2}$","c":true},{"x":"$1-\\cos(xy)\\sim xy$"},{"x":"$1-\\cos(xy)\\sim1$ vicino all'origine"}],"hint":"sviluppo di Taylor del coseno: $\\cos t=1-\\tfrac{t^2}{2}+o(t^2)$.","sol":"Da $\\cos t=1-\\tfrac{t^2}{2}+o(t^2)$ segue $1-\\cos(xy)\\sim\\dfrac{x^2y^2}{2}$, e vale la maggiorazione esatta $0\\le1-\\cos t\\le\\dfrac{t^2}{2}$. Questo &egrave; il primo passo canonico degli Es.1 in stile De Marchis/Terracina: ridurre il numeratore al suo ordine dominante prima di stimare.","cont":"Continuit&agrave;"},{"t":"Per quali $a$ &egrave; continua in $(0,0)$?","opts":[{"x":"per $a<2$: $|f|\\le\\dfrac{x^2y^2}{2(x^2+y^2)^a}\\le\\dfrac18(x^2+y^2)^{2-a}\\to0$ sse $a<2$","c":true},{"x":"per $a>2$"},{"x":"per ogni $a>0$"}],"hint":"usa $x^2y^2\\le\\big(\\tfrac{x^2+y^2}{2}\\big)^2$; poi conta l'esponente $2-a$.","sol":"$|f|\\le\\dfrac{x^2y^2}{2(x^2+y^2)^a}$; con $x^2y^2\\le\\dfrac{(x^2+y^2)^2}{4}$ si ha $|f|\\le\\dfrac18(x^2+y^2)^{2-a}=\\dfrac18\\rho^{2(2-a)}\\to0$ uniformemente sse $a<2$. Per $a=2$ la stima polare $\\tfrac12\\cos^2\\theta\\sin^2\\theta$ dipende da $\\theta$ (lungo $y=x$ vale $\\tfrac18\\ne0$): non continua. Continua sse $a<2$.","cont":"Parziali dalla definizione"},{"t":"Calcola $\\nabla f(0,0)$ dalla definizione.","opts":[{"x":"$\\nabla f(0,0)=(0,0)$ per ogni $a$","c":true},{"x":"$\\nabla f(0,0)=(1,1)$"},{"x":"le parziali esistono solo per $a<2$"}],"hint":"sugli assi $xy=0$, quindi $1-\\cos(xy)=0$: $f$ &egrave; identicamente nulla lungo gli assi.","sol":"Lungo gli assi $xy=0$, dunque $1-\\cos(xy)=0$ e $f(t,0)=f(0,t)=0$ per ogni $a$. Quindi $f_x(0,0)=f_y(0,0)=0$ dalla definizione, e $\\nabla f(0,0)=(0,0)$ indipendentemente da $a$ (la soglia $a<2$ riguarda la continuit&agrave;, non l'esistenza delle parziali).","cont":"Differenziabilit&agrave;"},{"t":"Con $\\nabla f(0,0)=0$, per quali $a$ il resto $R=\\dfrac{f(h,k)}{\\rho}$ tende a 0?","opts":[{"x":"per $a<3/2$: $|R|\\le\\dfrac18\\rho^{3-2a}\\to0$ sse $a<3/2$","c":true},{"x":"per $a<2$, come la continuit&agrave;"},{"x":"per ogni $a>0$"}],"hint":"dividere per $\\rho$ toglie una potenza: dall'esponente $2(2-a)$ della continuit&agrave; a $2(2-a)-1=3-2a$.","sol":"$|R|=\\dfrac{|f(h,k)|}{\\rho}\\le\\dfrac18\\rho^{2(2-a)-1}=\\dfrac18\\rho^{3-2a}\\to0$ uniformemente sse $3-2a>0$, cio&egrave; $a<3/2$. Per $a=3/2$ il calcolo esatto lungo $y=x$ d&agrave; $R\\to\\tfrac18\\ne0$ (con $1-\\cos t^2\\sim\\tfrac{t^4}{2}$): non differenziabile. Differenziabile sse $a<3/2$.","cont":"Il confronto"},{"t":"Metti in fila le due soglie e concludi.","opts":[{"x":"continua per $a<2$, differenziabile per $a<3/2$: nella finestra $3/2\\le a<2$ &egrave; continua ma non differenziabile; coerente con differenziabile implica continua","c":true},{"x":"le due soglie coincidono a $a=2$"},{"x":"differenziabile per $a<2$ e continua per $a<3/2$"}],"hint":"la soglia della differenziabilit&agrave; &egrave; sempre pi&ugrave; bassa (pi&ugrave; restrittiva) di quella della continuit&agrave;.","sol":"Continuit&agrave; per $a<2$, differenziabilit&agrave; per $a<3/2$: la soglia della differenziabilit&agrave; &egrave; pi&ugrave; restrittiva, come impone &laquo;differenziabile implica continua&raquo;. Nella finestra $3/2\\le a<2$ la funzione &egrave; continua ma non differenziabile. La distanza $2-\\tfrac32=\\tfrac12$ tra le soglie &egrave; l'esatta met&agrave; della potenza persa nel resto ($3-2a$ contro $2(2-a)=4-2a$): la firma numerica della definizione di differenziabilit&agrave;."}]},{"pool":"diff","src":"tipo C · manuale · percorso completo a parametro $|x|^a y/(x^2+y^2)$","steps":[{"t":"Sia $f(x,y)=\\dfrac{|x|^a\\,y}{x^2+y^2}$ per $(x,y)\\ne(0,0)$, $f(0,0)=0$, con $a>0$. In polari ($x=\\rho\\cos\\theta$, $y=\\rho\\sin\\theta$) si ottiene $f=\\rho^{\\,a-1}\\,|\\cos\\theta|^a\\sin\\theta$. Per quali $a$ la funzione &egrave; continua in $(0,0)$?","opts":[{"x":"$a>1$","c":true},{"x":"$a>2$"},{"x":"ogni $a>0$"},{"x":"$a\\ge 1$"}],"hint":"La maggiorazione $|f|\\le\\rho^{\\,a-1}$ non dipende da $\\theta$: decide il segno dell'esponente. Il valore di frontiera $a=1$ va testato a parte, non incluso per inerzia.","sol":"Per $a>1$ si ha $|f|\\le\\rho^{\\,a-1}\\to 0$ con stima uniforme in $\\theta$: per il teorema del confronto $f\\to 0=f(0,0)$, dunque continua. Per $a=1$ resta $f=|\\cos\\theta|\\sin\\theta$, indipendente da $\\rho$ ma dipendente da $\\theta$: lungo $y=x$ con $x>0$ vale costantemente $1/2$, sugli assi vale $0$; per l'unicit&agrave; del limite il limite non esiste. Per $a<1$ l'esponente &egrave; negativo e $f$ diverge lungo $y=x$. Soglia: $a>1$.","cont":"Ora il gradiente"},{"t":"Per $a>0$ qualsiasi, quanto vale $\\nabla f(0,0)$?","opts":[{"x":"$(0,0)$, perch&eacute; $f\\equiv 0$ su entrambi gli assi","c":true},{"x":"Non si pu&ograve; dire: bisogna derivare il quoziente con la regola del rapporto e poi passare al limite"},{"x":"$(1,0)$"},{"x":"Esiste solo per $a>1$, perch&eacute; prima serve la continuit&agrave;"}],"hint":"Le derivate parziali in un punto dove la funzione &egrave; definita a tratti si calcolano SOLO dalla definizione, come limite del rapporto incrementale.","sol":"Per definizione $f_x(0,0)=\\lim_{t\\to0}\\frac{f(t,0)-f(0,0)}{t}$. Ma $f(t,0)=\\frac{|t|^a\\cdot 0}{t^2}=0$, quindi il rapporto &egrave; identicamente nullo e $f_x(0,0)=0$. Analogamente $f(0,t)=\\frac{0\\cdot t}{t^2}=0$ (per $a>0$), quindi $f_y(0,0)=0$. Applicare la regola di derivazione del quoziente in $(0,0)$ &egrave; illegittimo: quella regola vale dove la formula &egrave; l'espressione della funzione in un intorno del punto, e qui in $(0,0)$ la funzione &egrave; assegnata a parte. Nota che l'esistenza delle parziali non richiede la continuit&agrave;: sono due propriet&agrave; logicamente indipendenti.","cont":"Quoziente della differenziabilit&agrave;"},{"t":"Con $\\nabla f(0,0)=(0,0)$, il quoziente della differenziabilit&agrave; &egrave; $\\dfrac{f(x,y)-f(0,0)-\\nabla f(0,0)\\cdot(x,y)}{\\sqrt{x^2+y^2}}=\\dfrac{f}{\\rho}$. Per quali $a$ tende a $0$?","opts":[{"x":"$a>2$","c":true},{"x":"$a>1$, come la continuit&agrave;"},{"x":"$a>3$"},{"x":"$a\\ge 2$"}],"hint":"Dividere per $\\rho$ abbassa di uno l'esponente: la soglia si sposta esattamente di $1$ rispetto a quella di continuit&agrave;.","sol":"$\\dfrac{f}{\\rho}=\\rho^{\\,a-2}|\\cos\\theta|^a\\sin\\theta$, con $\\big|\\tfrac{f}{\\rho}\\big|\\le\\rho^{\\,a-2}$. Per $a>2$ la stima &egrave; uniforme in $\\theta$ e tende a $0$: per la definizione di differenziabilit&agrave; $f$ &egrave; differenziabile in $(0,0)$ con differenziale nullo. Per $a\\le 2$ il quoziente non &egrave; infinitesimo (caso $a=2$ nel passo seguente). Le due soglie sono diverse ($a>1$ per la continuit&agrave;, $a>2$ per la differenziabilit&agrave;) proprio perch&eacute; il quoziente porta un $\\rho$ in pi&ugrave; al denominatore.","cont":"Il caso di frontiera $a=2$"},{"t":"Caso di frontiera $a=2$: cosa succede esattamente in $(0,0)$?","opts":[{"x":"$f$ &egrave; continua, ha $\\nabla f(0,0)=(0,0)$, ma NON &egrave; differenziabile","c":true},{"x":"$f$ &egrave; differenziabile: il quoziente &egrave; limitato e questo basta"},{"x":"$f$ non &egrave; nemmeno continua"},{"x":"$f$ &egrave; differenziabile ma non di classe $C^1$"}],"hint":"Un quoziente limitato non &egrave; un quoziente infinitesimo. Testalo lungo una restrizione.","sol":"Per $a=2$: la continuit&agrave; vale ($2>1$). Il quoziente diventa $\\tfrac{f}{\\rho}=\\cos^2\\theta\\,\\sin\\theta$, indipendente da $\\rho$: lungo gli assi vale $0$, lungo $y=x$ (cio&egrave; $\\theta=\\pi/4$) vale $\\tfrac12\\cdot\\tfrac{1}{\\sqrt2}=\\tfrac{1}{2\\sqrt2}\\ne 0$. Per l'unicit&agrave; del limite il quoziente non tende a $0$, quindi per la definizione $f$ non &egrave; differenziabile. Restare limitato significa solo $f=O(\\rho)$, mentre la differenziabilit&agrave; chiede $f=o(\\rho)$: &egrave; la differenza fra $O$ e $o$ a decidere.","cont":"Le direzionali in $a=2$"},{"t":"Sempre per $a=2$, calcola $\\partial_v f(0,0)$ per il versore $v=(v_1,v_2)$ e di' cosa se ne deduce.","opts":[{"x":"$\\partial_v f(0,0)=v_1^2v_2$: esiste per ogni $v$ ma NON &egrave; lineare in $v$, e questo da solo nega la differenziabilit&agrave;","c":true},{"x":"$\\partial_v f(0,0)=0$ per ogni $v$, quindi $f$ &egrave; differenziabile con differenziale nullo"},{"x":"$\\partial_v f(0,0)$ non esiste per nessun $v$ fuori dagli assi"},{"x":"$\\partial_v f(0,0)=v_2$"}],"hint":"Scrivi il rapporto incrementale lungo la retta $t\\mapsto(tv_1,tv_2)$ e semplifica le potenze di $t$, tenendo il valore assoluto dove c'&egrave;.","sol":"$\\frac{f(tv_1,tv_2)}{t}=\\frac{1}{t}\\cdot\\frac{|t|^2 v_1^2\\, t v_2}{t^2(v_1^2+v_2^2)}=|t|^{\\,0}v_1^2v_2=v_1^2v_2$ (con $|v|=1$). Il limite esiste per ogni $v$ e vale $v_1^2v_2$. Ma se $f$ fosse differenziabile, per il teorema del differenziale totale (la formula $\\partial_v f(0,0)=\\nabla f(0,0)\\cdot v$) la mappa $v\\mapsto\\partial_v f(0,0)$ sarebbe LINEARE in $v$; qui &egrave; un polinomio di terzo grado ($v_1^2v_2$), e $\\nabla f(0,0)\\cdot v=0\\ne v_1^2v_2$. Per contronominale $f$ non &egrave; differenziabile. Questa &egrave; la seconda via, indipendente dal passo precedente.","cont":"La fascia intermedia"},{"t":"Ultimo tassello: per $1<a<2$, quale quadro &egrave; corretto in $(0,0)$?","opts":[{"x":"$f$ &egrave; continua, esistono le due parziali (entrambe nulle), ma le direzionali lungo ogni $v$ con $v_1v_2\\ne0$ NON esistono (divergono)","c":true},{"x":"$f$ &egrave; continua e tutte le direzionali esistono, ma non sono lineari"},{"x":"$f$ non &egrave; continua e non ha parziali"},{"x":"$f$ &egrave; continua e differenziabile: la continuit&agrave; in questa fascia basta"}],"hint":"Riusa il conto del passo precedente lasciando $a$ generico: l'esponente di $|t|$ non &egrave; pi&ugrave; zero.","sol":"In generale $\\frac{f(tv_1,tv_2)}{t}=|t|^{\\,a-2}|v_1|^a v_2$. Per $1<a<2$ l'esponente $a-2$ &egrave; negativo: se $v_1v_2\\ne 0$ il rapporto diverge, quindi $\\partial_v f(0,0)$ non esiste. Se invece $v_1=0$ oppure $v_2=0$ il coefficiente $|v_1|^av_2$ &egrave; nullo e la direzionale vale $0$: ecco perch&eacute; le due parziali esistono comunque. Morale del percorso: al variare di $a$ si attraversano tutti i piani della gerarchia — $a\\le 1$ nemmeno continua, $1<a<2$ continua con sole parziali, $a=2$ tutte le direzionali ma non lineari, $a>2$ differenziabile."}]},{"pool":"diff","src":"tipo C · manuale · dimostrazione del teorema del differenziale totale","steps":[{"t":"Vuoi dimostrare che se $f_x,f_y$ esistono in un intorno di $(x_0,y_0)$ e sono continue in $(x_0,y_0)$ allora $f$ &egrave; differenziabile l&igrave;. Qual &egrave; il primo passo della dimostrazione?","opts":[{"x":"Spezzare l'incremento in due incrementi parziali: $f(x_0+h,y_0+k)-f(x_0,y_0)=\\big[f(x_0+h,y_0+k)-f(x_0,y_0+k)\\big]+\\big[f(x_0,y_0+k)-f(x_0,y_0)\\big]$","c":true},{"x":"Applicare direttamente il teorema di Lagrange in due variabili all'incremento totale"},{"x":"Sviluppare $f$ con la formula di Taylor al secondo ordine"},{"x":"Passare in coordinate polari e stimare il quoziente"}],"hint":"Gli strumenti che hai sono a UNA variabile: devi ricondurti a variazioni in cui una sola coordinata si muove.","sol":"Il trucco strutturale &egrave; muovere una variabile alla volta, aggiungendo e togliendo il termine intermedio $f(x_0,y_0+k)$: nel primo blocco varia solo $x$ (con $y$ fissato a $y_0+k$), nel secondo solo $y$. Solo cos&igrave; si pu&ograve; invocare il teorema di Lagrange (valor medio) in una variabile, che &egrave; l'unico strumento disponibile. Un teorema di Lagrange in due variabili applicato all'incremento totale non esiste in questa forma.","cont":"Applica Lagrange"},{"t":"A quali condizioni puoi applicare Lagrange ai due blocchi, e cosa ottieni?","opts":[{"x":"Servono le parziali in un INTORNO (non solo nel punto): si ottiene $h\\,f_x(\\xi,y_0+k)+k\\,f_y(x_0,\\eta)$ con $\\xi$ fra $x_0$ e $x_0+h$, $\\eta$ fra $y_0$ e $y_0+k$","c":true},{"x":"Bastano le parziali nel solo punto $(x_0,y_0)$: si ottiene $h\\,f_x(x_0,y_0)+k\\,f_y(x_0,y_0)$"},{"x":"Serve la continuit&agrave; di $f$, e si ottiene $h\\,f_x(x_0,y_0+k)+k\\,f_y(x_0,y_0)$"},{"x":"Serve che $f$ sia di classe $C^2$"}],"hint":"Il valor medio ha bisogno di derivabilit&agrave; su tutto un segmento, non in un punto isolato: &egrave; qui che l'ipotesi di intorno paga.","sol":"La funzione $t\\mapsto f(t,y_0+k)$ &egrave; derivabile sul segmento $[x_0,x_0+h]$ perch&eacute; $f_x$ esiste in un intorno: per il teorema di Lagrange il primo blocco vale $h\\,f_x(\\xi,y_0+k)$ per un $\\xi$ interno. Idem per il secondo, $k\\,f_y(x_0,\\eta)$. I punti $\\xi,\\eta$ non sono noti, ma tendono a $x_0,y_0$ quando $(h,k)\\to(0,0)$: &egrave; questo che permetter&agrave; di usare la continuit&agrave; delle parziali.","cont":"Usa la continuit&agrave;"},{"t":"Adesso entra l'ipotesi di continuit&agrave; delle parziali nel punto. Come si conclude?","opts":[{"x":"Si scrive $f_x(\\xi,y_0+k)=f_x(x_0,y_0)+\\varepsilon_1$ e $f_y(x_0,\\eta)=f_y(x_0,y_0)+\\varepsilon_2$ con $\\varepsilon_i\\to0$; il resto &egrave; $h\\varepsilon_1+k\\varepsilon_2$ e $\\frac{|h\\varepsilon_1+k\\varepsilon_2|}{\\sqrt{h^2+k^2}}\\le|\\varepsilon_1|+|\\varepsilon_2|\\to0$","c":true},{"x":"Si osserva che $\\xi\\to x_0$ e $\\eta\\to y_0$, quindi il resto &egrave; nullo identicamente"},{"x":"Si applica il teorema di Schwarz sulle derivate miste"},{"x":"Si passa al limite sotto il segno di derivata"}],"hint":"Il resto va confrontato con $\\rho=\\sqrt{h^2+k^2}$, e le disuguaglianze $|h|\\le\\rho$, $|k|\\le\\rho$ sono tutto ci&ograve; che serve.","sol":"Sottraendo la parte lineare $h f_x(x_0,y_0)+k f_y(x_0,y_0)$ resta $h\\varepsilon_1+k\\varepsilon_2$, dove $\\varepsilon_1,\\varepsilon_2\\to 0$ proprio perch&eacute; $f_x,f_y$ sono continue in $(x_0,y_0)$ e $(\\xi,y_0+k)\\to(x_0,y_0)$, $(x_0,\\eta)\\to(x_0,y_0)$. Poich&eacute; $|h|,|k|\\le\\rho$, il quoziente della differenziabilit&agrave; &egrave; maggiorato in modulo da $|\\varepsilon_1|+|\\varepsilon_2|\\to0$: per la definizione, $f$ &egrave; differenziabile. Il resto NON &egrave; identicamente nullo, &egrave; solo $o(\\rho)$.","cont":"Quanto serve davvero"},{"t":"L'ipotesi si pu&ograve; indebolire? Quale versione &egrave; corretta?","opts":[{"x":"S&igrave;: basta che UNA delle due parziali esista in un intorno e sia continua nel punto, mentre dell'altra basta l'esistenza nel punto","c":true},{"x":"No: servono entrambe continue in tutto un intorno"},{"x":"S&igrave;: basta l'esistenza di entrambe le parziali nel punto"},{"x":"S&igrave;: basta la continuit&agrave; di $f$ pi&ugrave; l'esistenza delle parziali"}],"hint":"Guarda la dimostrazione: i due blocchi non sono trattati allo stesso modo. Uno usa Lagrange, l'altro potrebbe usare solo la definizione di derivata.","sol":"Nella dimostrazione il blocco che richiede Lagrange (e quindi l'esistenza in un intorno e la continuit&agrave; nel punto) &egrave; solo uno; per l'altro si pu&ograve; usare direttamente la definizione di derivata parziale in $(x_0,y_0)$, scrivendo $f(x_0,y_0+k)-f(x_0,y_0)=k f_y(x_0,y_0)+o(k)$. Questa &egrave; la forma forte del teorema del differenziale totale. Le opzioni con la sola esistenza delle parziali sono false: $f(x,y)=\\frac{xy}{x^2+y^2}$ ha entrambe le parziali in $(0,0)$ e non &egrave; nemmeno continua.","cont":"Il verso opposto"},{"t":"Il teorema si inverte? Cio&egrave;: $f$ differenziabile in $(0,0)$ implica $f_x,f_y$ continue in $(0,0)$?","opts":[{"x":"No: $f(x,y)=(x^2+y^2)\\sin\\frac{1}{\\sqrt{x^2+y^2}}$ (con $f(0,0)=0$) &egrave; differenziabile in $(0,0)$ ma $f_x,f_y$ non hanno limite in $(0,0)$","c":true},{"x":"S&igrave;: differenziabile equivale a $C^1$"},{"x":"S&igrave;, ma solo per funzioni limitate"},{"x":"No, e infatti non esiste nessun controesempio esplicito: si dimostra per assurdo"}],"hint":"Cerca la funzione in cui l'oscillazione &egrave; schiacciata da un fattore quadratico: il quoziente muore, la derivata no.","sol":"Il controesempio classico: $|f|\\le\\rho^2$ d&agrave; $f/\\rho\\le\\rho\\to0$ con $\\nabla f(0,0)=(0,0)$, dunque differenziabile. Ma per $(x,y)\\ne(0,0)$ la derivata contiene il termine $-\\frac{x}{\\rho}\\cos\\frac1\\rho$, che oscilla senza limite per $\\rho\\to0$: $f_x$ non &egrave; continua in $(0,0)$. Quindi $C^1\\Rightarrow$ differenziabile &egrave; una implicazione stretta: la classe $C^1$ &egrave; condizione sufficiente e non necessaria. Operativamente: se le parziali risultano continue hai finito subito; se non lo sono, non hai concluso nulla e devi passare al quoziente."}]},{"pool":"diff","src":"tipo C · manuale · ordine dello sviluppo e doppia soglia (esponenziale a parametro)","steps":[{"t":"Sia $f(x,y)=\\dfrac{e^{x^2y}-1-x^2y}{(x^2+y^2)^{\\beta}}$ per $(x,y)\\ne(0,0)$, $f(0,0)=0$, $\\beta>0$. A quale ordine va sviluppato il numeratore, e cosa si ottiene?","opts":[{"x":"Al secondo ordine in $u=x^2y$: $e^u-1-u=\\frac{u^2}{2}+o(u^2)$, quindi il numeratore $\\sim\\frac{x^4y^2}{2}$","c":true},{"x":"Al primo ordine: $e^u-1\\sim u$, quindi il numeratore $\\sim x^2y$"},{"x":"Al primo ordine: $e^u-1-u\\sim u$, quindi il numeratore $\\sim x^2y$"},{"x":"Non serve alcuno sviluppo: si maggiora $e^{x^2y}-1-x^2y$ con una costante"}],"hint":"Guarda cosa &egrave; stato SOTTRATTO al numeratore: i primi due termini dello sviluppo sono stati cancellati apposta. Fermarsi al primo ordine restituisce $0$, cio&egrave; nessuna informazione.","sol":"Con $u=x^2y\\to0$: $e^u=1+u+\\frac{u^2}{2}+o(u^2)$, per la formula di Taylor-MacLaurin. Poich&eacute; il testo sottrae proprio $1+u$, il primo termine sopravvissuto &egrave; $\\frac{u^2}{2}=\\frac{x^4y^2}{2}$. Fermarsi al primo ordine &egrave; l'errore che costa l'intero esercizio: darebbe numeratore infinitesimo di ordine sbagliato e soglie sbagliate. Regola operativa: si sviluppa fino al primo termine che NON si cancella.","cont":"Grado e continuit&agrave;"},{"t":"Il termine dominante $\\frac{x^4y^2}{2}$ &egrave; omogeneo di grado $6$. Per quali $\\beta$ la funzione &egrave; continua in $(0,0)$?","opts":[{"x":"$\\beta<3$","c":true},{"x":"$\\beta<3/2$"},{"x":"$\\beta<6$"},{"x":"$\\beta\\le 3$"}],"hint":"In polari il numeratore porta $\\rho^{6}$, il denominatore $\\rho^{2\\beta}$: confronta gli esponenti. Il caso di uguaglianza non &egrave; automaticamente incluso.","sol":"In polari $f=\\tfrac12\\rho^{\\,6-2\\beta}\\cos^4\\theta\\sin^2\\theta\\,(1+o(1))$, con $|f|\\le\\tfrac12\\rho^{\\,6-2\\beta}(1+o(1))$: stima uniforme in $\\theta$. Per $6-2\\beta>0$, cio&egrave; $\\beta<3$, il teorema del confronto d&agrave; $f\\to0=f(0,0)$: continua. Per $\\beta>3$ diverge lungo $y=x$. Il caso $\\beta=3$ &egrave; il passo successivo.","cont":"Frontiera della continuit&agrave;"},{"t":"Caso $\\beta=3$: la funzione &egrave; continua in $(0,0)$?","opts":[{"x":"No: il limite dipende dalla direzione ($0$ sugli assi, $1/16$ lungo $y=x$), quindi non esiste","c":true},{"x":"S&igrave;: il limite esiste e vale $0$ perch&eacute; il rapporto &egrave; limitato"},{"x":"S&igrave;, ma solo lungo le rette"},{"x":"No, perch&eacute; la funzione diverge"}],"hint":"Con esponente $0$ il fattore $\\rho$ sparisce e resta una funzione della sola $\\theta$. Confronta due direzioni.","sol":"Per $\\beta=3$ si ha $f\\to\\tfrac12\\cos^4\\theta\\sin^2\\theta$, che dipende da $\\theta$: sugli assi ($\\theta=0,\\pi/2$) vale $0$, lungo $y=x$ vale $\\tfrac12\\cdot\\tfrac14\\cdot\\tfrac12=\\tfrac{1}{16}$. Per l'unicit&agrave; del limite (restrizioni diverse, limiti diversi) il limite non esiste, quindi $f$ non &egrave; continua. Essere limitata non &egrave; essere convergente.","cont":"Il gradiente"},{"t":"Per $\\beta<3$, quanto vale $\\nabla f(0,0)$?","opts":[{"x":"$(0,0)$: sugli assi il numeratore &egrave; identicamente nullo, quindi entrambi i rapporti incrementali sono nulli","c":true},{"x":"$\\big(\\tfrac12,0\\big)$"},{"x":"Dipende da $\\beta$"},{"x":"Non esiste per $\\beta$ vicino a $3$"}],"hint":"Valuta $f$ sugli assi PRIMA di derivare: $u=x^2y$ si annulla su entrambi.","sol":"$f(t,0)$: qui $u=t^2\\cdot0=0$ e $e^0-1-0=0$, quindi $f(t,0)=0$ e $f_x(0,0)=\\lim_{t\\to0}\\frac{0-0}{t}=0$. Analogamente $f(0,t)=0$ e $f_y(0,0)=0$. Il calcolo &egrave; fatto dalla definizione di derivata parziale, non con le regole di derivazione applicate al quoziente: in $(0,0)$ quelle non sono lecite. Il gradiente non dipende da $\\beta$ in tutto il regime considerato.","cont":"Soglia di differenziabilit&agrave;"},{"t":"Con $\\nabla f(0,0)=(0,0)$ il quoziente della differenziabilit&agrave; &egrave; $f/\\rho$. Per quali $\\beta$ tende a $0$?","opts":[{"x":"$\\beta<5/2$","c":true},{"x":"$\\beta<3$, la stessa della continuit&agrave;"},{"x":"$\\beta<2$"},{"x":"$\\beta<7/2$"}],"hint":"Un $\\rho$ in pi&ugrave; al denominatore sposta la soglia di mezza unit&agrave; nel parametro, perch&eacute; il parametro compare come $2\\beta$.","sol":"$\\frac{f}{\\rho}=\\tfrac12\\rho^{\\,5-2\\beta}\\cos^4\\theta\\sin^2\\theta\\,(1+o(1))$, maggiorato uniformemente da $\\tfrac12\\rho^{\\,5-2\\beta}$. Tende a $0$ sse $5-2\\beta>0$, cio&egrave; $\\beta<5/2$: per la definizione di differenziabilit&agrave; l&igrave; $f$ &egrave; differenziabile con $df(0,0)=0$. Il confronto delle due soglie ($3$ e $5/2$) &egrave; il cuore dell'esercizio: differenziabile &egrave; strettamente pi&ugrave; forte di continua.","cont":"La fascia critica"},{"t":"Che cosa succede esattamente per $5/2\\le\\beta<3$?","opts":[{"x":"$f$ &egrave; continua in $(0,0)$, ha entrambe le parziali nulle, ma NON &egrave; differenziabile","c":true},{"x":"$f$ non &egrave; continua e non &egrave; differenziabile"},{"x":"$f$ &egrave; differenziabile ma non $C^1$"},{"x":"$f$ &egrave; continua e differenziabile, ma il differenziale non &egrave; nullo"}],"hint":"&Egrave; la fascia fra le due soglie: sopravvive la propriet&agrave; pi&ugrave; debole, cade quella pi&ugrave; forte. Il caso $\\beta=5/2$ va verificato esplicitamente.","sol":"Per $\\beta=5/2$ il quoziente tende a $\\tfrac12\\cos^4\\theta\\sin^2\\theta$, che vale $0$ sugli assi e $\\tfrac{1}{16}$ lungo $y=x$: non &egrave; infinitesimo, quindi non differenziabile (definizione + unicit&agrave; del limite); per $5/2<\\beta<3$ l'esponente $5-2\\beta$ &egrave; negativo e il quoziente diverge lungo $y=x$. La continuit&agrave; per&ograve; regge fino a $\\beta<3$, e le parziali restano nulle per ogni $\\beta$. Quindi in tutta la fascia: continua, derivabile, non differenziabile — il piano intermedio della gerarchia."}]},{"pool":"diff","src":"tipo C · manuale · fino a che ordine si sviluppa","steps":[{"t":"Sia $f(x,y)=\\dfrac{\\sin(xy)-xy}{(x^2+y^2)^{\\gamma}}$, $f(0,0)=0$. Qual &egrave; il comportamento del numeratore vicino all'origine?","opts":[{"x":"$\\sin u-u=-\\frac{u^3}{6}+o(u^4)$ con $u=xy$, quindi numeratore $\\sim-\\frac{x^3y^3}{6}$, omogeneo di grado $6$","c":true},{"x":"$\\sin u\\sim u$, quindi il numeratore &egrave; nullo e $f\\equiv 0$"},{"x":"$\\sin u-u\\sim-\\frac{u^2}{2}$, grado $4$"},{"x":"Il numeratore &egrave; $\\sim xy$, grado $2$"}],"hint":"Lo sviluppo di $\\sin$ ha solo potenze dispari: dopo la cancellazione del primo termine il successivo non &egrave; quadratico.","sol":"Per la formula di MacLaurin $\\sin u=u-\\frac{u^3}{6}+o(u^4)$: sottraendo $u$ resta $-\\frac{u^3}{6}$. Con $u=xy$ il termine dominante &egrave; $-\\frac{x^3y^3}{6}$, omogeneo di grado $6$. Il fatto che manchi il termine di grado $2$ in $u$ (la parit&agrave; di $\\sin$) &egrave; la ragione per cui non si pu&ograve; indovinare l'ordine: va scritto.","cont":"Soglia"},{"t":"Per quali $\\gamma>0$ la funzione &egrave; continua in $(0,0)$?","opts":[{"x":"$\\gamma<3$","c":true},{"x":"$\\gamma<6$"},{"x":"$\\gamma<3/2$"},{"x":"ogni $\\gamma>0$"}],"hint":"Grado del numeratore contro $2\\gamma$ del denominatore, come sempre.","sol":"In polari $|f|\\le\\frac{1}{6}\\rho^{\\,6-2\\gamma}(1+o(1))$: stima uniforme in $\\theta$, tende a $0$ sse $\\gamma<3$ (teorema del confronto). Per $\\gamma=3$ il limite &egrave; $-\\frac16\\cos^3\\theta\\sin^3\\theta$, dipendente dalla direzione: non esiste.","cont":"La regola generale"},{"t":"Modus operandi: davanti a un numeratore con sviluppi, fino a che ordine si sviluppa?","opts":[{"x":"Fino al primo termine che NON si cancella con gli altri addendi; solo allora il grado di omogeneit&agrave; di quel termine si confronta col denominatore","c":true},{"x":"Sempre al primo ordine: gli infinitesimi equivalenti bastano"},{"x":"Sempre al secondo ordine: &egrave; il compromesso standard"},{"x":"Fino all'ordine del denominatore"}],"hint":"La domanda non &egrave; quanto sviluppare in astratto, ma cosa resta dopo le cancellazioni imposte dal testo.","sol":"Il testo d'esame costruisce apposta numeratori in cui i primi termini si elidono ($e^u-1-u$, $\\sin u-u$, $1-\\cos u-\\frac{u^2}{2}$, $\\log(1+u)-u$): il principio di sostituzione con infinitesimi equivalenti fallisce esattamente quando il termine equivalente viene cancellato. La procedura corretta &egrave;: sviluppare con resto di Peano fino al primo termine superstite, controllare che il resto sia di ordine strettamente superiore, e solo allora contare il grado di omogeneit&agrave; e confrontarlo con $2\\gamma$."}]},{"pool":"diff","src":"tipo C · manuale · come si sceglie la curva che nega il limite","steps":[{"t":"Sia $f(x,y)=\\dfrac{x^2y}{x^4+y^2}$, $f(0,0)=0$. Tutte le restrizioni a rette $y=mx$ danno limite $0$. Come si sceglie la curva giusta per negare il limite?","opts":[{"x":"Si prende $y=kx^2$, cio&egrave; l'esponente che rende i due addendi del denominatore dello stesso ordine ($x^4$ e $y^2$)","c":true},{"x":"Si prova a caso finch&eacute; una funziona"},{"x":"Si prende $y=kx^3$, per abbassare ancora il grado"},{"x":"Si prende $y=e^{-1/x}$, perch&eacute; le curve esponenziali sono le pi&ugrave; sensibili"}],"hint":"Il denominatore &egrave; una somma di due potenze: la restrizione critica &egrave; quella lungo cui NESSUNO dei due domina l'altro.","sol":"Il criterio &egrave; la quasi-omogeneit&agrave;: si cerca $y=kx^p$ tale che $x^4$ e $y^2=k^2x^{2p}$ abbiano lo stesso grado, cio&egrave; $2p=4$, $p=2$. Lungo qualunque curva pi&ugrave; piatta o pi&ugrave; ripida uno dei due termini schiaccia l'altro e il rapporto tende a $0$; solo sulla curva di bilanciamento sopravvive un valore non nullo. Non &egrave; tentativi a caso: l'esponente si legge dal denominatore.","cont":"Fai il conto"},{"t":"Calcola il limite lungo $y=kx^2$ ($k\\ne0$).","opts":[{"x":"$\\dfrac{k}{1+k^2}$: dipende da $k$, quindi il limite non esiste","c":true},{"x":"$0$ per ogni $k$"},{"x":"$+\\infty$"},{"x":"$\\dfrac{1}{k}$, ma la dipendenza da $k$ non conta"}],"hint":"Sostituisci e semplifica $x^4$: numeratore e denominatore hanno lo stesso grado, quindi $x$ sparisce.","sol":"$f(x,kx^2)=\\frac{x^2\\cdot kx^2}{x^4+k^2x^4}=\\frac{k}{1+k^2}$, costante lungo la parabola. Al variare di $k$ si ottengono valori diversi (per $k=1$ vale $\\tfrac12$, per $k=2$ vale $\\tfrac25$): per il teorema di unicit&agrave; del limite, il limite in $(0,0)$ non esiste, quindi $f$ non &egrave; continua nell'origine. Basta esibire DUE restrizioni con limiti diversi (ad esempio $k=1$ e l'asse $x$).","cont":"Perch&eacute; le rette non bastano"},{"t":"Le rette davano tutte $0$. Che valore ha, allora, il test lungo le rette?","opts":[{"x":"&Egrave; solo una condizione necessaria: se le rette danno limiti diversi si conclude subito che il limite non esiste, ma se danno tutte lo stesso valore non si conclude nulla","c":true},{"x":"&Egrave; una condizione sufficiente: se tutte le rette danno $0$, il limite &egrave; $0$"},{"x":"Non serve a niente: va sempre usato il metodo delle polari"},{"x":"&Egrave; sufficiente per la continuit&agrave;, non per la differenziabilit&agrave;"}],"hint":"Il limite &egrave; per $(x,y)\\to(0,0)$ in TUTTI i modi possibili: le rette sono un sottoinsieme delle restrizioni.","sol":"Lungo $y=mx$: $f=\\frac{mx^3}{x^4+m^2x^2}=\\frac{mx}{x^2+m^2}\\to0$. Tutte le rette danno $0$, eppure il limite non esiste. La definizione di limite chiede il controllo su tutti gli intorni bucati, non su una famiglia privilegiata di restrizioni: il test delle rette pu&ograve; solo FALSIFICARE (per unicit&agrave; del limite), mai confermare. Per confermare servono maggiorazioni uniformi (polari con stima $|f|\\le g(\\rho)$, $g\\to0$)."}]},{"pool":"diff","src":"tipo C · manuale · quando la stima in polari non conclude","steps":[{"t":"Sempre per $f=\\dfrac{x^2y}{x^4+y^2}$, in polari si ottiene $f=\\dfrac{\\rho\\cos^2\\theta\\,\\sin\\theta}{\\rho^2\\cos^4\\theta+\\sin^2\\theta}$. Per ogni $\\theta$ FISSATO con $\\sin\\theta\\ne0$ si ha $f\\to0$ per $\\rho\\to0$. Si pu&ograve; concludere che $f\\to0$?","opts":[{"x":"No: &egrave; il limite lungo ciascuna retta, non il limite in due variabili; manca una maggiorazione uniforme in $\\theta$","c":true},{"x":"S&igrave;: in polari il limite per $\\rho\\to0$ a $\\theta$ fissato &egrave; per definizione il limite in due variabili"},{"x":"S&igrave;, purch&eacute; si controlli anche $\\theta$ con $\\sin\\theta=0$"},{"x":"No, perch&eacute; il passaggio in polari non &egrave; lecito quando il denominatore non &egrave; omogeneo"}],"hint":"Fissare $\\theta$ e mandare $\\rho\\to0$ &egrave; esattamente muoversi lungo una semiretta. Nulla vieta a $\\theta$ di dipendere da $\\rho$.","sol":"Il metodo delle polari conclude solo nella forma: esiste $g(\\rho)\\to0$ con $|f(\\rho,\\theta)-L|\\le g(\\rho)$ per OGNI $\\theta$. Fare il limite a $\\theta$ fissato riproduce il test delle rette, che &egrave; solo necessario. Qui la quantit&agrave; $\\sup_\\theta|f|$ non tende a $0$, come mostra il passo seguente.","cont":"Trova la direzione che si muove"},{"t":"Scegli $\\theta=\\theta(\\rho)$ in modo che $\\sin\\theta=\\rho\\cos^2\\theta$. Quanto vale $f$ lungo questa scelta?","opts":[{"x":"$f=\\dfrac{\\rho\\cos^2\\theta\\cdot\\rho\\cos^2\\theta}{\\rho^2\\cos^4\\theta+\\rho^2\\cos^4\\theta}=\\dfrac12$, e la curva corrispondente &egrave; proprio $y=x^2$","c":true},{"x":"$f=0$: la scelta non cambia nulla"},{"x":"$f=1$"},{"x":"$f\\to+\\infty$"}],"hint":"Sostituisci $\\sin\\theta$ con $\\rho\\cos^2\\theta$ ovunque compaia: numeratore e denominatore diventano lo stesso monomio a meno del fattore $2$.","sol":"Con $\\sin\\theta=\\rho\\cos^2\\theta$ il numeratore &egrave; $\\rho^2\\cos^4\\theta$ e il denominatore $2\\rho^2\\cos^4\\theta$, quindi $f\\equiv\\tfrac12$ mentre $\\rho\\to0$. In cartesiane: $y=\\rho\\sin\\theta=\\rho^2\\cos^2\\theta=x^2$, cio&egrave; la stessa parabola trovata col criterio di quasi-omogeneit&agrave;. Le due strade (curva critica in cartesiane, angolo mobile in polari) sono la stessa cosa vista due volte.","cont":"Il criterio corretto"},{"t":"Enuncia il criterio operativo corretto per il metodo delle polari.","opts":[{"x":"La stima conclude se e solo se $|f(\\rho,\\theta)-L|\\le g(\\rho)$ con $g(\\rho)\\to0$ indipendente da $\\theta$; se il maggiorante contiene $\\theta$ e non &egrave; limitato uniformemente, il metodo non decide","c":true},{"x":"La stima conclude sempre, purch&eacute; si semplifichino i fattori trigonometrici"},{"x":"La stima conclude se $f$ &egrave; limitata in $\\rho$"},{"x":"La stima conclude se il limite per $\\rho\\to0$ esiste per ogni $\\theta$ e vale sempre lo stesso numero"}],"hint":"L'ultima opzione &egrave; il trabocchetto: &egrave; la formulazione che sembra giusta ed &egrave; falsa, come mostra questo esempio.","sol":"La condizione &egrave; l'uniformit&agrave; in $\\theta$, che equivale alla definizione di limite ($\\forall\\varepsilon\\ \\exists\\delta$ valido per tutti i punti del disco bucato, non per ciascuna semiretta). L'opzione con il limite per ogni $\\theta$ fisso &egrave; falsa proprio per questa $f$: ogni retta d&agrave; $0$ e il limite non esiste. Quando la maggiorazione non &egrave; uniforme (compaiono $\\theta$ che dipendono da $\\rho$), il metodo si abbandona e si passa alla ricerca della curva critica."}]},{"pool":"diff","src":"tipo C · manuale · il valore assoluto non impedisce la differenziabilit&agrave;","steps":[{"t":"Sia $f(x,y)=|xy|$ su tutto $\\mathbb{R}^2$. Quanto vale $\\nabla f(0,0)$?","opts":[{"x":"$(0,0)$: $f$ &egrave; identicamente nulla su entrambi gli assi","c":true},{"x":"Non esiste: il valore assoluto non &egrave; derivabile nell'origine"},{"x":"$(1,1)$"},{"x":"Esiste solo la derivata rispetto a $x$"}],"hint":"Prima di dire non esiste, valuta la restrizione agli assi: il modulo di zero &egrave; zero, e la funzione ristretta &egrave; liscia.","sol":"$f(t,0)=|t\\cdot0|=0$ per ogni $t$, quindi $f_x(0,0)=\\lim_{t\\to0}\\frac{0-0}{t}=0$, e analogamente $f_y(0,0)=0$ (definizione di derivata parziale). Il valore assoluto &egrave; non derivabile in $0$ come funzione di una variabile, ma qui la restrizione agli assi &egrave; la funzione nulla: il punto di non derivabilit&agrave; del modulo non viene toccato.","cont":"Differenziabile o no"},{"t":"$f(x,y)=|xy|$ &egrave; differenziabile in $(0,0)$?","opts":[{"x":"S&igrave;: $\\dfrac{|xy|}{\\sqrt{x^2+y^2}}\\le\\dfrac{\\rho^2/2}{\\rho}=\\dfrac{\\rho}{2}\\to0$","c":true},{"x":"No: una funzione con un valore assoluto non pu&ograve; mai essere differenziabile"},{"x":"No: il quoziente lungo $y=x$ vale $1/\\sqrt2\\ne0$"},{"x":"S&igrave;, e inoltre &egrave; di classe $C^1$ in un intorno dell'origine"}],"hint":"Usa $|xy|\\le\\frac{x^2+y^2}{2}$ (media aritmetico-geometrica) e dividi per $\\rho$.","sol":"Con $\\nabla f(0,0)=(0,0)$ il quoziente della differenziabilit&agrave; &egrave; $\\frac{|xy|}{\\rho}$; dalla disuguaglianza $|xy|\\le\\frac12(x^2+y^2)=\\frac{\\rho^2}{2}$ segue $\\frac{|xy|}{\\rho}\\le\\frac{\\rho}{2}\\to0$, uniformemente in $\\theta$: per la definizione, $f$ &egrave; differenziabile in $(0,0)$ con $df(0,0)=0$ (piano tangente $z=0$). Lungo $y=x$ il quoziente vale $\\frac{x^2}{\\sqrt2|x|}=\\frac{|x|}{\\sqrt2}\\to0$, coerente. La quarta opzione &egrave; falsa: vedi il passo seguente.","cont":"Negli altri punti degli assi"},{"t":"E nel punto $(1,0)$, che sta sull'asse $x$?","opts":[{"x":"$f$ NON &egrave; differenziabile in $(1,0)$: $f(1,t)=|t|$ non &egrave; derivabile in $t=0$, quindi $f_y(1,0)$ non esiste","c":true},{"x":"&Egrave; differenziabile, per continuit&agrave; con il caso dell'origine"},{"x":"&Egrave; differenziabile perch&eacute; $f$ &egrave; continua ovunque"},{"x":"Non &egrave; nemmeno continua in $(1,0)$"}],"hint":"Muoviti solo in verticale a partire da quel punto e guarda che funzione di una variabile ottieni.","sol":"$f(1,t)=|1\\cdot t|=|t|$, che in $t=0$ ha derivata destra $+1$ e sinistra $-1$: la derivata parziale $f_y(1,0)$ non esiste. Poich&eacute; la differenziabilit&agrave; implica l'esistenza di tutte le derivate direzionali (in particolare le parziali), per contronominale $f$ non &egrave; differenziabile in $(1,0)$. Due lezioni: la differenziabilit&agrave; &egrave; una propriet&agrave; PUNTUALE (vale nell'origine e cade nei punti vicini sullo stesso asse), e la presenza di un valore assoluto non decide nulla da sola — va guardato dove la funzione tocca davvero lo spigolo."}]},{"pool":"diff","src":"tipo C · manuale · radice di modulo: parziali s&igrave;, direzionali no","steps":[{"t":"Sia $f(x,y)=\\sqrt{|xy|}$, $f(0,0)=0$. &Egrave; continua in $(0,0)$?","opts":[{"x":"S&igrave;: $\\sqrt{|xy|}\\le\\frac{|x|+|y|}{2}\\le\\rho\\to0$","c":true},{"x":"No: lungo $y=x$ il limite vale $1$"},{"x":"S&igrave;, ma solo lungo gli assi"},{"x":"No: la radice del modulo non &egrave; continua nell'origine"}],"hint":"Media geometrica minore o uguale della media aritmetica: la maggiorazione &egrave; immediata e uniforme.","sol":"Per la disuguaglianza fra media geometrica e aritmetica $\\sqrt{|x||y|}\\le\\frac{|x|+|y|}{2}$, e $|x|,|y|\\le\\rho$, quindi $0\\le f\\le\\rho\\to0$: teorema del confronto, $f$ &egrave; continua in $(0,0)$. In polari $f=\\rho\\sqrt{|\\cos\\theta\\sin\\theta|}\\le\\rho$, stessa conclusione con stima uniforme in $\\theta$.","cont":"Il gradiente"},{"t":"Quanto vale $\\nabla f(0,0)$?","opts":[{"x":"$(0,0)$: sugli assi $f\\equiv0$","c":true},{"x":"Non esiste, perch&eacute; la radice ha derivata infinita in $0$"},{"x":"$\\big(\\tfrac12,\\tfrac12\\big)$"},{"x":"Esiste $f_x(0,0)$ ma non $f_y(0,0)$"}],"hint":"Come sempre: valuta la restrizione all'asse prima di temere la radice.","sol":"$f(t,0)=\\sqrt{|t\\cdot0|}=0$, quindi il rapporto incrementale &egrave; nullo e $f_x(0,0)=0$; idem $f_y(0,0)=0$ (definizione di derivata parziale). La derivata infinita della radice si manifesterebbe solo se la restrizione fosse del tipo $\\sqrt{|t|}$, cosa che accade lungo le direzioni oblique, non lungo gli assi.","cont":"Direzionali e differenziabilit&agrave;"},{"t":"Che succede lungo una direzione obliqua $v=(v_1,v_2)$ con $v_1v_2\\ne0$, e cosa se ne conclude?","opts":[{"x":"$\\frac{f(tv)}{t}=\\frac{|t|\\sqrt{|v_1v_2|}}{t}$ non ha limite per $t\\to0$: la direzionale non esiste, quindi $f$ non &egrave; differenziabile","c":true},{"x":"La direzionale vale $\\sqrt{|v_1v_2|}$ e $f$ &egrave; differenziabile con quel differenziale"},{"x":"La direzionale vale $0$ come le parziali, e $f$ &egrave; differenziabile"},{"x":"La direzionale diverge a $+\\infty$"}],"hint":"Il rapporto $|t|/t$ vale $+1$ a destra e $-1$ a sinistra: il limite bilatero non esiste, non &egrave; infinito.","sol":"$f(tv_1,tv_2)=\\sqrt{|t^2v_1v_2|}=|t|\\sqrt{|v_1v_2|}$, quindi il rapporto incrementale &egrave; $\\frac{|t|}{t}\\sqrt{|v_1v_2|}$, che vale $\\pm\\sqrt{|v_1v_2|}$ a seconda del segno di $t$: limite bilatero inesistente (la dicotomia $|t|^\\alpha/t$ con $\\alpha=1$). Poich&eacute; la differenziabilit&agrave; implica l'esistenza di TUTTE le derivate direzionali, per contronominale $f$ non &egrave; differenziabile in $(0,0)$. In alternativa, il quoziente $\\frac{f}{\\rho}=\\sqrt{|\\cos\\theta\\sin\\theta|}$ non dipende da $\\rho$ e vale $\\tfrac{1}{\\sqrt2}$ lungo $y=x$: non infinitesimo. Quadro finale: continua, con entrambe le parziali nulle, non differenziabile."}]}],"dini":[{"pool":"dini","src":"tipo G · manuale · ipotesi","steps":[{"t":"Il teorema del Dini applicato a $F(x,y)=0$ per esplicitare $y=g(x)$ vicino a $(x_0,y_0)$ richiede:","opts":[{"x":"$F\\in C^1$ in un intorno, $F(x_0,y_0)=0$ e $F_y(x_0,y_0)\\ne 0$","c":true},{"x":"$F\\in C^1$ e $F_x(x_0,y_0)\\ne 0$"},{"x":"soltanto $F(x_0,y_0)=0$"},{"x":"$\\nabla F(x_0,y_0)=0$"}],"hint":"La derivata che deve essere non nulla è quella rispetto alla variabile che vuoi ESPLICITARE ($y$), non l'altra.","sol":"Teorema del Dini: se $F\\in C^1$, $F(x_0,y_0)=0$ (il punto sta sull'insieme di livello) e $F_y(x_0,y_0)\\ne 0$, allora esiste un'unica $y=g(x)$ di classe $C^1$ in un intorno di $x_0$ con $g(x_0)=y_0$ e $F(x,g(x))=0$. Se invece è $F_x\\ne 0$ si esplicita $x=h(y)$."}]},{"pool":"dini","src":"tipo G · manuale · scelta variabile","steps":[{"t":"In un punto $P$ di $\\{F(x,y)=0\\}$ risulta $F_x(P)\\ne 0$ e $F_y(P)=0$. Cosa garantisce il Dini?","opts":[{"x":"esplicitabilità di $x=h(y)$ (curva localmente grafico su $y$), NON di $y=g(x)$","c":true},{"x":"esplicitabilità di $y=g(x)$"},{"x":"nulla: serve che entrambe le parziali siano non nulle"},{"x":"$P$ è un punto singolare, la curva non è regolare in $P$"}],"hint":"Si esplicita sempre la variabile la cui derivata parziale è non nulla.","sol":"Dini: la derivata parziale non nulla decide la variabile esplicitabile. $F_x(P)\\ne 0$ dà $x=h(y)$ con $h'=-F_y/F_x=0$: qui la curva ha tangente verticale (nel piano $xy$), quindi non è grafico di $y$ su $x$ ma lo è di $x$ su $y$. Il punto è regolare perché $\\nabla F(P)\\ne 0$."}]},{"pool":"dini","src":"tipo G · manuale · derivazione di $g'$","steps":[{"t":"Derivando l'identità $F(x,g(x))\\equiv 0$ rispetto a $x$ si ottiene la formula della derivata implicita. Qual è?","opts":[{"x":"$F_x+F_y\\,g'(x)=0\\ \\Rightarrow\\ g'(x)=-\\dfrac{F_x}{F_y}$","c":true},{"x":"$F_x\\,g'(x)+F_y=0\\ \\Rightarrow\\ g'(x)=-\\dfrac{F_y}{F_x}$"},{"x":"$g'(x)=\\dfrac{F_x}{F_y}$"},{"x":"$g'(x)=F_x-F_y$"}],"hint":"È la regola della catena su $x\\mapsto(x,g(x))$: la variabile $y=g(x)$ dipende da $x$, la $x$ da sé stessa.","sol":"Teorema del Dini + regola della catena: $\\frac{d}{dx}F(x,g(x))=F_x\\cdot 1+F_y\\cdot g'(x)=0$. Isolando: $g'(x)=-F_x/F_y$, ben definita perché il Dini garantisce $F_y\\ne 0$. La $F_x$ sta al numeratore, non al denominatore."}]},{"pool":"dini","src":"tipo G · manuale · segno","steps":[{"t":"Sia $F_x(x_0,y_0)=3$ e $F_y(x_0,y_0)=-2$. Quanto vale $g'(x_0)$ per $y=g(x)$?","opts":[{"x":"$g'(x_0)=-\\dfrac{F_x}{F_y}=-\\dfrac{3}{-2}=\\dfrac{3}{2}$","c":true},{"x":"$g'(x_0)=\\dfrac{F_x}{F_y}=-\\dfrac{3}{2}$"},{"x":"$g'(x_0)=-\\dfrac{3}{2}$"},{"x":"$g'(x_0)=\\dfrac{F_y}{F_x}=-\\dfrac{2}{3}$"}],"hint":"Il segno meno sta DAVANTI alla frazione $F_x/F_y$; poi si porta dentro il segno di $F_y$.","sol":"Dini: $g'=-F_x/F_y=-(3)/(-2)=+3/2$. L'errore tipico è dimenticare che $F_y$ è già negativo, e scrivere $-3/2$: il doppio segno negativo dà un risultato positivo."}]},{"pool":"dini","src":"20220124 Es.1 · trappola g''","steps":[{"t":"La formula $g''(x_0)=-\\dfrac{F_{xx}}{F_y}$ per la funzione implicita $y=g(x)$ è corretta:","opts":[{"x":"solo quando $g'(x_0)=0$; altrimenti compaiono termini con $F_{xy}$ e $F_{yy}$","c":true},{"x":"sempre, in ogni punto"},{"x":"mai: la derivata seconda implicita non ha formula chiusa"},{"x":"solo se $F$ è un polinomio"}],"hint":"Deriva due volte $F(x,g(x))=0$: i termini $F_{xy}g'$ e $F_{yy}(g')^2$ spariscono solo se $g'=0$.","sol":"Derivando due volte l'identità del Dini: $F_{xx}+2F_{xy}g'+F_{yy}(g')^2+F_y\\,g''=0$. Se $g'=0$ resta $g''=-F_{xx}/F_y$; altrimenti servono anche $F_{xy},F_{yy}$. Usare la formula ridotta con $g'\\ne 0$ è la trappola più frequente. Src 20220124 es.1."}]},{"pool":"dini","src":"tipo G · manuale · Dini 3D","steps":[{"t":"Per esplicitare $z=g(x,y)$ da $F(x,y,z)=0$ vicino a $P=(x_0,y_0,z_0)$, il Dini richiede:","opts":[{"x":"$F\\in C^1$, $F(P)=0$ e $F_z(P)\\ne 0$","c":true},{"x":"$F\\in C^1$, $F(P)=0$ e $F_x(P)\\ne 0$"},{"x":"$\\nabla F(P)=0$"},{"x":"solo $F(P)=0$ e $F$ continua"}],"hint":"Per ottenere $z$ come funzione delle altre due, deve essere non nulla la parziale rispetto a $z$.","sol":"Teorema del Dini in $\\mathbb{R}^3$: $F\\in C^1$, $F(P)=0$ e $F_z(P)\\ne 0$ danno un'unica $z=g(x,y)$ di classe $C^1$ vicino a $(x_0,y_0)$ con $F(x,y,g(x,y))=0$. Se fosse $F_z=0$ ma, ad esempio, $F_x\\ne 0$, si esplicita $x$ in funzione di $(y,z)$."}]},{"pool":"dini","src":"tipo G · manuale · gradiente di $g$ in 3D","steps":[{"t":"Dal Dini $z=g(x,y)$ con $F(x,y,g)=0$. Le derivate parziali di $g$ sono:","opts":[{"x":"$g_x=-\\dfrac{F_x}{F_z},\\quad g_y=-\\dfrac{F_y}{F_z}$","c":true},{"x":"$g_x=-\\dfrac{F_z}{F_x},\\quad g_y=-\\dfrac{F_z}{F_y}$"},{"x":"$g_x=\\dfrac{F_x}{F_z},\\quad g_y=\\dfrac{F_y}{F_z}$"},{"x":"$g_x=-F_x,\\quad g_y=-F_y$"}],"hint":"Deriva $F(x,y,g(x,y))=0$ rispetto a $x$ (poi $y$) tenendo $g$ funzione di entrambe: $F_x+F_z g_x=0$.","sol":"Teorema del Dini + catena: $\\partial_x[F(x,y,g)]=F_x+F_z g_x=0\\Rightarrow g_x=-F_x/F_z$; analogamente $g_y=-F_y/F_z$. Al denominatore c'è sempre la parziale rispetto alla variabile esplicitata ($z$)."}]},{"pool":"dini","src":"tipo G · manuale · retta tangente","steps":[{"t":"La retta tangente alla curva di livello $\\{F(x,y)=0\\}$ nel punto regolare $P=(x_0,y_0)$ ($\\nabla F(P)\\ne 0$) ha equazione:","opts":[{"x":"$F_x(P)(x-x_0)+F_y(P)(y-y_0)=0$, cioè $\\nabla F(P)\\cdot(x-P)=0$","c":true},{"x":"$F_y(P)(x-x_0)-F_x(P)(y-y_0)=0$"},{"x":"$F_x(P)(x-x_0)+F_y(P)(y-y_0)=1$"},{"x":"$y-y_0=\\nabla F(P)\\cdot(x-x_0)$"}],"hint":"Il gradiente è ORTOGONALE alla curva di livello: la tangente è il luogo dei vettori perpendicolari a $\\nabla F$ uscenti da $P$.","sol":"$\\nabla F(P)$ è normale alla linea di livello, quindi la tangente è $\\nabla F(P)\\cdot(x-P)=0$. Equivale al grafico linearizzato del Dini: $y-y_0=g'(x_0)(x-x_0)$ con $g'=-F_x/F_y$, che moltiplicato per $F_y$ dà la stessa equazione. La seconda opzione è la retta NORMALE (usa il gradiente come direzione, non come normale)."}]},{"pool":"dini","src":"22gen24 Es.1 · piano tangente","steps":[{"t":"Il piano tangente alla superficie di livello $\\{F(x,y,z)=0\\}$ nel punto regolare $P$ è:","opts":[{"x":"$\\nabla F(P)\\cdot(x-P)=0$, cioè $F_x(P)(x-x_0)+F_y(P)(y-y_0)+F_z(P)(z-z_0)=0$","c":true},{"x":"$z-z_0=\\nabla F(P)\\cdot(x-x_0,y-y_0)$"},{"x":"$F_x(P)x+F_y(P)y+F_z(P)z=0$"},{"x":"$(x-P)=\\lambda\\nabla F(P)$"}],"hint":"Il gradiente è il vettore normale al piano tangente; l'ultima opzione descrive invece la retta normale.","sol":"$\\nabla F(P)$ è ortogonale alla superficie di livello, quindi il piano tangente ha equazione $\\nabla F(P)\\cdot(x-P)=0$. Se $F_z(P)\\ne 0$ questo coincide col piano tangente al grafico di $g$ dato dal Dini: $z-z_0=g_x(x-x_0)+g_y(y-y_0)$ con $g_x=-F_x/F_z$, $g_y=-F_y/F_z$. Src 22gen24 es.1."}]},{"pool":"dini","src":"tipo G · manuale · dove Dini NON si applica","steps":[{"t":"In quale caso il teorema del Dini NON garantisce l'esplicitabilità (né $y=g(x)$ né $x=h(y)$) attorno a $P\\in\\{F=0\\}$?","opts":[{"x":"quando $\\nabla F(P)=0$ (punto singolare): entrambe le parziali si annullano","c":true},{"x":"quando $F_x(P)\\ne 0$"},{"x":"quando $F_y(P)\\ne 0$"},{"x":"quando $F(P)=0$"}],"hint":"Il teorema fallisce solo se TUTTE le parziali si annullano; basta una parziale non nulla per esplicitare la variabile corrispondente.","sol":"Se $\\nabla F(P)=0$ il punto è singolare: l'insieme di livello può non essere localmente un grafico (es. due rami che si incrociano, un punto isolato, una cuspide). Se anche solo una parziale è non nulla, il Dini esplicita la variabile corrispondente. $F(P)=0$ è invece un'ipotesi necessaria, non un ostacolo."}]},{"pool":"dini","src":"tipo G · manuale · gradiente ortogonale","steps":[{"t":"Perché $\\nabla F(P)$ è ortogonale all'insieme di livello $\\{F=0\\}$ in $P$?","opts":[{"x":"perché per ogni curva $\\gamma(t)$ dentro il livello, $\\frac{d}{dt}F(\\gamma)=\\nabla F\\cdot\\gamma'=0$, quindi $\\nabla F\\perp\\gamma'$","c":true},{"x":"perché $\\nabla F$ punta nella direzione della curva di livello"},{"x":"perché $\\|\\nabla F\\|=0$ sul livello"},{"x":"perché $F$ è costante lungo il gradiente"}],"hint":"Deriva $F(\\gamma(t))=0$ lungo una curva contenuta nell'insieme di livello.","sol":"Ogni curva $\\gamma$ contenuta in $\\{F=0\\}$ soddisfa $F(\\gamma(t))\\equiv 0$, quindi $\\nabla F\\cdot\\gamma'=0$: il gradiente è perpendicolare a ogni vettore tangente, cioè all'intera curva/superficie di livello. Da qui l'equazione della tangente $\\nabla F\\cdot(x-P)=0$. Il gradiente punta nella direzione di massima crescita, TRASVERSALE al livello, non lungo di esso."}]},{"pool":"dini","src":"tipo G · manuale · carattere locale","steps":[{"t":"Il teorema del Dini garantisce l'esistenza di $y=g(x)$:","opts":[{"x":"solo in un intorno di $x_0$ (risultato locale); globalmente $\\{F=0\\}$ può non essere un grafico","c":true},{"x":"su tutto $\\mathbb{R}$"},{"x":"su tutto l'insieme dove $F_y\\ne 0$, in modo unico e globale"},{"x":"solo nel singolo punto $x_0$, non in un intorno"}],"hint":"Pensa alla circonferenza $x^2+y^2-1=0$: attorno a $(1,0)$ non è grafico di $y$ su $x$, e globalmente ha due rami.","sol":"Il Dini è un teorema LOCALE: dà $g$ in un intorno di $x_0$, non oltre. Esempio: $F=x^2+y^2-1$; in $(0,1)$ ($F_y=2\\ne 0$) esiste $y=\\sqrt{1-x^2}$ localmente, ma la circonferenza intera non è grafico di una sola $g(x)$ (ha ramo superiore e inferiore). Nei punti $(\\pm 1,0)$ è $F_y=0$ e infatti lì la curva ha tangente verticale."}]},{"pool":"dini","src":"tipo G · manuale · regolarità $C^1$","steps":[{"t":"L'ipotesi $F\\in C^1$ nel teorema del Dini serve a garantire:","opts":[{"x":"che $g$ esista e sia essa stessa $C^1$, con la formula $g'=-F_x/F_y$ valida","c":true},{"x":"che $F(P)=0$"},{"x":"che il gradiente sia nullo"},{"x":"solo la continuità di $F$, non la derivabilità di $g$"}],"hint":"Senza la continuità delle derivate parziali non si può garantire né l'esistenza di $g$ né la sua derivabilità.","sol":"La regolarità $C^1$ (derivate parziali continue) è ciò che, insieme a $F_y(P)\\ne 0$, produce una $g$ derivabile con continuità e legittima la formula $g'=-F_x/F_y$. La sola continuità di $F$ non basta: senza differenziabilità il rapporto $-F_x/F_y$ non ha senso e $g$ può non essere liscia."}]},{"pool":"dini","src":"tipo G · manuale · il punto sta sul livello","steps":[{"t":"Prima di applicare il Dini in $P=(x_0,y_0)$ per $F(x,y)=0$, il controllo IMPRESCINDIBILE oltre a $F_y(P)\\ne 0$ è:","opts":[{"x":"verificare che $F(x_0,y_0)=0$, cioè che $P$ appartiene all'insieme di livello","c":true},{"x":"verificare che $F_x(P)=0$"},{"x":"verificare che $F$ sia un polinomio"},{"x":"verificare che $g'(x_0)=0$"}],"hint":"Il teorema esplicita la curva $\\{F=0\\}$: ha senso solo in un punto che ci sta sopra.","sol":"Il Dini parte dall'ipotesi $F(P)=0$: $P$ deve stare sull'insieme di livello. È il primo passo negli esercizi in cui si cercano i valori $y_0$ risolvendo $F(x_0,y)=0$. Applicare la formula $g'=-F_x/F_y$ in un punto con $F(P)\\ne 0$ non ha significato: non c'è curva da esplicitare lì."}]},{"pool":"dini","src":"tipo G · manuale · tangente al grafico vs alla superficie","steps":[{"t":"Con $F_z(P)\\ne 0$, il piano tangente al GRAFICO di $g$ (dato dal Dini) e il piano tangente alla SUPERFICIE di livello $\\{F=0\\}$ in $P$:","opts":[{"x":"coincidono: $z-z_0=g_x(x-x_0)+g_y(y-y_0)$ è la stessa equazione di $\\nabla F\\cdot(x-P)=0$","c":true},{"x":"sono ortogonali fra loro"},{"x":"coincidono solo se $\\nabla F(P)=0$"},{"x":"sono diversi: il primo è un piano, il secondo una retta"}],"hint":"Sostituisci $g_x=-F_x/F_z$, $g_y=-F_y/F_z$ nell'equazione del grafico e moltiplica per $F_z$.","sol":"Sono lo stesso piano. Dal grafico: $z-z_0=-\\frac{F_x}{F_z}(x-x_0)-\\frac{F_y}{F_z}(y-y_0)$; moltiplicando per $F_z$ e riordinando si ottiene $F_x(x-x_0)+F_y(y-y_0)+F_z(z-z_0)=0$, cioè $\\nabla F(P)\\cdot(x-P)=0$. La superficie di livello è localmente proprio il grafico di $g$, quindi hanno lo stesso piano tangente."}]},{"pool":"dini","src":"20220124 Es.1","steps":[{"t":"Sia $F(x,y)=y^3\\sin x+y^2-2ye^x-3-x$, con $F(0,-1)=0$ e $F_y(0,-1)=-4\\ne 0$. Dini dà $y=g_0(x)$, $g_0(0)=-1$. Quanto vale $g_0'(0)$?","opts":[{"x":"$g_0'(0)=-\\dfrac{F_x(0,-1)}{F_y(0,-1)}=0$ (il punto è critico per $g_0$)","c":true},{"x":"$g_0'(0)=-\\dfrac{F_y(0,-1)}{F_x(0,-1)}$"},{"x":"$g_0'(0)=F_x(0,-1)$"},{"x":"$g_0'(0)=-4$"}],"hint":"La formula del Dini è $g'=-F_x/F_y$, con $F_x$ al NUMERATORE. Calcola $F_x(0,-1)$.","sol":"Teorema del Dini: $g'=-F_x/F_y$. Qui $F_x=y^3\\cos x-2ye^x-1$, e $F_x(0,-1)=(-1)(1)-2(-1)(1)-1=-1+2-1=0$. Dunque $g_0'(0)=0$: punto critico di $g_0$. Src 20220124 es.1.","cont":"Continua &rarr; la natura del punto"},{"t":"Poiché $g_0'(0)=0$ si può usare $g_0''(0)=-\\dfrac{F_{xx}(0,-1)}{F_y(0,-1)}$. Con $F_{xx}(0,-1)=2$ si ha $g_0''(0)=1/2>0$: che punto è?","opts":[{"x":"minimo locale di $g_0$: $g_0'(0)=0$ e $g_0''(0)>0$","c":true},{"x":"massimo locale"},{"x":"flesso a tangente orizzontale"},{"x":"sella"}],"hint":"Per una funzione di una variabile: $g'=0$ e $g''>0$ classificano il punto.","sol":"$g_0'(0)=0$ e $g_0''(0)=1/2>0\\Rightarrow$ minimo locale. La formula $g''=-F_{xx}/F_y$ vale SOLO perché $g'=0$; in generale compaiono anche $F_{xy}$ e $F_{yy}$. Src 20220124 es.1."}]},{"pool":"dini","src":"20220504 Es.1","steps":[{"t":"$F(x,y)=y^2+x(e^y-e^2)-x^2-4$. Per trovare i punti di $\\{F=0\\}$ sull'asse $x=0$ si risolve $F(0,y)=0$. Quali sono?","opts":[{"x":"$y^2-4=0\\Rightarrow y_0=-2,\\ y_1=2$","c":true},{"x":"$y=0$ soltanto"},{"x":"$y^2-e^2-4=0$"},{"x":"nessuno: $F(0,y)$ non si annulla"}],"hint":"Sostituisci $x=0$: i termini con $x$ spariscono, resta un'equazione in $y$.","sol":"Il Dini si applica in punti dell'insieme di livello: prima li si cerca. $F(0,y)=y^2+0-0-4=y^2-4=0\\Rightarrow y=\\pm 2$. I candidati sono $(0,-2)$ e $(0,2)$. Src 20220504 es.1.","cont":"Continua &rarr; applica il Dini in $(0,2)$"},{"t":"In $(0,2)$: $F_y=2y+xe^y$, $F_y(0,2)=4\\ne 0$ (Dini ok), e $F_x=e^y-e^2-2x$, $F_x(0,2)=e^2-e^2=0$. Quanto vale $g_1'(0)$ e che punto è (con $F_{xx}=-2$)?","opts":[{"x":"$g_1'(0)=0$ e, da $g_1''(0)=-F_{xx}/F_y=2/4=1/2>0$, è un minimo","c":true},{"x":"$g_1'(0)=-2$, punto non critico"},{"x":"$g_1'(0)=0$ ma è un massimo"},{"x":"Dini non si applica perché $F_x(0,2)=0$"}],"hint":"$F_x=0$ non blocca il Dini (basta $F_y\\ne 0$): significa solo $g'=0$. Poi usa $g''=-F_{xx}/F_y$ perché $g'=0$.","sol":"Dini: $F_y(0,2)=4\\ne 0$ garantisce $y=g_1(x)$. $g_1'(0)=-F_x/F_y=-0/4=0$: punto critico. Essendo $g_1'=0$, vale $g_1''(0)=-F_{xx}/F_y=-(-2)/4=1/2>0\\Rightarrow$ minimo. Src 20220504 es.1."}]},{"pool":"dini","src":"20230210 Es.1","steps":[{"t":"$F(x,y)=x^3+ye^{x^2y^2}-3x^2$. Sull'asse $y=0$ si cercano i punti di $\\{F=0\\}$ risolvendo $F(x,0)=0$, e si vuole esplicitare $y=g(x)$. Quali punti e Dini applicabile?","opts":[{"x":"$x^2(x-3)=0\\Rightarrow x_0=0,\\ x_1=3$; $F_y(x,0)=e^{x^2y^2}|_{y=0}=1\\ne 0$, quindi Dini dà $y=g(x)$","c":true},{"x":"$x=0$ soltanto; e Dini non si applica perché $F_y(x,0)=0$"},{"x":"nessun punto reale"},{"x":"$x=3$ soltanto; si esplicita $x=h(y)$"}],"hint":"$F(x,0)=x^3-3x^2$. Per $F_y$ deriva rispetto a $y$: il termine $ye^{x^2y^2}$ dà $e^{x^2y^2}(1+2x^2y^2)$, che in $y=0$ vale $1$.","sol":"$F(x,0)=x^3-3x^2=x^2(x-3)=0\\Rightarrow x_0=0,\\ x_1=3$. $F_y=e^{x^2y^2}(1+2x^2y^2)$, in $y=0$ vale $1\\ne 0$: il Dini garantisce $y=g(x)$ in entrambi i punti. Src 20230210 es.1.","cont":"Continua &rarr; monotonia in $x_1=3$"},{"t":"In $(3,0)$: $F_x=3x^2-6x+2xy^3e^{x^2y^2}$, quindi $F_x(3,0)=27-18=9$ e $F_y(3,0)=1$. Segno di $g_1'(3)$?","opts":[{"x":"$g_1'(3)=-\\dfrac{F_x}{F_y}=-\\dfrac{9}{1}=-9<0$: $g_1$ è decrescente in $x=3$","c":true},{"x":"$g_1'(3)=+9>0$: crescente"},{"x":"$g_1'(3)=-\\dfrac{F_y}{F_x}=-1/9$"},{"x":"$g_1'(3)=0$: punto critico"}],"hint":"Formula del Dini con il segno meno davanti: $g'=-F_x/F_y=-9/1$.","sol":"Teorema del Dini: $g_1'(3)=-F_x(3,0)/F_y(3,0)=-9/1=-9<0$, quindi $g_1$ decresce in $x=3$. (Nell'altro punto $x_0=0$ risulta $F_x(0,0)=0$, dunque $g_0'(0)=0$: lì è critico.) Src 20230210 es.1."}]},{"pool":"dini","src":"20240122 Es.1 · piano tangente","steps":[{"t":"$F(x,y,z)=\\sqrt{x^2+y^2+z^2+1}+x-z=1$ con $\\nabla F(0,0,0)=(1,0,-1)$ e $F_z(0,0,0)=-1\\ne 0$. Piano tangente in $(0,0,0)$ alla superficie $z=g(x,y)$ del Dini:","opts":[{"x":"$z=x$: da $g_x=-F_x/F_z=1$ e $g_y=-F_y/F_z=0$","c":true},{"x":"$z=-x$"},{"x":"$z=x-y$"},{"x":"non definito perché $\\nabla F=0$"}],"hint":"$g_x=-F_x/F_z$, $g_y=-F_y/F_z$; il piano è $z=g(0,0)+g_x x+g_y y$ con $g(0,0)=0$.","sol":"Dini: $g_x=-\\frac{1}{-1}=1$, $g_y=-\\frac{0}{-1}=0$, $g(0,0)=0$, quindi $z=x$. Equivale a $\\nabla F\\cdot(x,y,z)=0$ perché $\\nabla F=(1,0,-1)$ dà $x-z=0$. Src 20240122 es.1."}]},{"pool":"dini","src":"20220907 Es.2 · Dini 3D + Hessiana","steps":[{"t":"$F(x,y,z)=e^z+x^2y^2z-e^{xy}+x^4-y^4=0$ con $F_z(0,0,0)=1\\ne 0$ definisce $z=g(x,y)$; risulta $\\nabla g(0,0)=0$ e $g_{xx}=g_{yy}=0$, $g_{xy}=1$. Che punto critico è $(0,0)$ per $g$?","opts":[
