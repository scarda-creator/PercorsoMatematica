l tetraedro $\\{x,y,z\\ge 0,\\;x+y+z\\le 1\\}$ ha volume $\\tfrac16$. Flusso uscente?","opts":[{"x":"$\\dfrac{1}{2}$","c":true},{"x":"$\\dfrac{1}{6}$"},{"x":"$\\dfrac{1}{3}$"}],"hint":"$3\\cdot\\tfrac16$.","sol":"$\\operatorname{Vol}=\\tfrac16$ (tetraedro con tre spigoli unitari ortogonali: $\\tfrac{1}{3!}$). Per Gauss $\\Phi=3\\cdot\\tfrac16=\\tfrac12$. Il calcolo diretto richiederebbe quattro flussi su triangoli con normali diverse: qui inutile."}]},{"pool":"gauss","src":"20220504 Es.4","steps":[{"t":"Devi calcolare il flusso uscente di $F=(e^{y^2}+x,\\;e^{x^2}+y,\\;\\sin x+z)$ da $E=\\{x^2+y^2\\le1,\\;0\\le z\\le3-x^2-y^2\\}$. Conto diretto sulle facce o teorema della divergenza?","opts":[{"x":"Teorema della divergenza: $\\nabla\\cdot F$ e' costante, mentre le componenti $e^{y^2},e^{x^2},\\sin x$ renderebbero il conto diretto sulle superfici proibitivo.","c":true},{"x":"Conto diretto: la superficie e' un grafico cartesiano, quindi la parametrizzazione e' immediata e veloce."},{"x":"Nessuno dei due: $e^{x^2}$ non ha primitiva elementare, l'integrale semplicemente non si puo' fare."}],"hint":"Guarda cosa diventa $\\nabla\\cdot F$ prima di spaventarti per le esponenziali.","sol":"Teorema della divergenza (Gauss): $\\iint_{\\partial E}F\\cdot n\\,dS=\\iiint_E\\nabla\\cdot F\\,dV$. Le esponenziali $e^{y^2},e^{x^2}$ e $\\sin x$ spariscono nella divergenza (ognuna derivata nella variabile in cui NON compare), lasciando un integrando costante: e' il caso da manuale in cui Gauss trasforma un conto di superficie impossibile in un volume banale."},{"t":"Quale ipotesi del teorema stai usando quando scrivi $\\iint_{\\partial E}F\\cdot n=\\iiint_E\\nabla\\cdot F$, e cosa la garantisce qui?","opts":[{"x":"$F\\in C^1$ su TUTTO il solido $E$: qui $e^{y^2},e^{x^2},\\sin x$ sono intere, nessuna singolarita' dentro $E$, quindi l'ipotesi vale.","c":true},{"x":"Basta che $F$ sia continua sul bordo $\\partial E$; cosa succede all'interno di $E$ e' irrilevante."},{"x":"Basta che $E$ sia convesso; la regolarita' di $F$ non entra fra le ipotesi."}],"hint":"Il teorema chiede regolarita' del campo dove? Solo sul bordo o in tutto il pieno?","sol":"Ipotesi di Gauss: $F\\in C^1$ su un aperto che contiene $\\overline E$, con $E$ limitato e $\\partial E$ regolare a tratti. Se vi fosse una singolarita' interna (es. un campo coulombiano con polo dentro $E$) il teorema NON si applicherebbe e il flusso non sarebbe $\\iiint\\nabla\\cdot F$. Qui tutte le componenti sono $C^\\infty(\\mathbb R^3)$: ipotesi soddisfatta."},{"t":"$E$ e' il solido sotto il paraboloide $z=3-x^2-y^2$ e sopra $z=0$, con $(x,y)$ nel disco $D=\\{x^2+y^2\\le1\\}$. Come imposti $\\iiint_E\\nabla\\cdot F\\,dV$?","opts":[{"x":"$3\\iiint_E dV=3\\iint_D\\big[(3-x^2-y^2)-0\\big]\\,dA$, integrando $z$ da $0$ a $3-x^2-y^2$.","c":true},{"x":"$3\\iint_D(3-x^2-y^2)\\,dA$ con $D$ il disco di raggio $\\sqrt3$, perche' il paraboloide arriva a $z=0$ dove $x^2+y^2=3$."},{"x":"$3\\cdot\\text{area}(D)\\cdot 3$, trattando l'altezza come la costante $z=3$."}],"hint":"Il disco di base e' fissato dal vincolo $x^2+y^2\\le1$, non da dove il paraboloide tocca $z=0$. E l'altezza dipende da $(x,y)$.","sol":"Definizione di regione $z$-semplice: $\\iiint_E g\\,dV=\\iint_D\\big(\\int_{z_{inf}}^{z_{sup}}g\\,dz\\big)dA$. Il disco e' $D=\\{x^2+y^2\\le1\\}$ (dato dal vincolo, non il raggio $\\sqrt3$ del bordo naturale del paraboloide). L'altezza e' $3-x^2-y^2$, non la costante $3$: chi la tratta costante integra un cilindro, non il solido."},{"t":"Calcola $3\\iint_D(3-x^2-y^2)\\,dA$ in coordinate polari su $D=\\{0\\le\\rho\\le1\\}$.","opts":[{"x":"$3\\int_0^{2\\pi}\\!\\!\\int_0^1(3-\\rho^2)\\rho\\,d\\rho\\,d\\theta=3\\cdot2\\pi\\cdot(\\tfrac32-\\tfrac14)=\\tfrac{15}{2}\\pi.$","c":true},{"x":"$3\\int_0^{2\\pi}\\!\\!\\int_0^1(3-\\rho^2)\\,d\\rho\\,d\\theta=3\\cdot2\\pi\\cdot(3-\\tfrac13)=16\\pi$ (senza il fattore $\\rho$)."},{"x":"$3\\cdot\\pi\\cdot3=9\\pi.$"}],"hint":"Il $dA$ polare porta sempre un $\\rho$ con se': dimenticarlo e' l'errore piu' comune.","sol":"Cambio in polari: $dA=\\rho\\,d\\rho\\,d\\theta$ (Jacobiano $=\\rho$). $\\int_0^1(3\\rho-\\rho^3)d\\rho=\\tfrac32-\\tfrac14=\\tfrac54$; $\\times2\\pi\\times3=\\tfrac{15}{2}\\pi$. CONCORDE con la stampa ufficiale. Il distrattore $16\\pi$ e' esattamente il risultato di chi dimentica il Jacobiano $\\rho$."},{"t":"Verifica finale: cosa avrebbe comportato il conto DIRETTO del flusso, e perche' $e^{y^2},e^{x^2}$ non pesano sul risultato?","opts":[{"x":"Diretto avrebbe richiesto $\\iint e^{x^2}\\dots$ sulle facce (primitiva non elementare); pesano zero perche' entrano in $\\nabla\\cdot F$ solo via $\\partial_x e^{y^2}=0$ e $\\partial_y e^{x^2}=0$.","c":true},{"x":"Diretto darebbe lo stesso conto facile; le esponenziali si annullano per simmetria del disco."},{"x":"Diretto e' obbligatorio: Gauss non vale per campi che contengono esponenziali."}],"hint":"$\\partial_x$ di una funzione della sola $y$ quanto fa?","sol":"Nella divergenza $\\partial_x(e^{y^2}+x)=1$, $\\partial_y(e^{x^2}+y)=1$, $\\partial_z(\\sin x+z)=1$: le esponenziali e il seno derivano rispetto a una variabile da cui non dipendono, quindi $\\to0$. E' il motivo strutturale per cui $\\nabla\\cdot F=3$. Il conto diretto invece le incontrerebbe non derivate, e $\\int e^{x^2}$ non e' elementare: la scelta di Gauss al passo 1 era obbligata."}]},{"pool":"gauss","src":"20220622 Es.3","steps":[{"t":"$F=(3x+yz,\\;\\cos x+y,\\;4z+e^{x^2})$, flusso uscente da $E=\\{x\\ge0,\\;x^2+y^2\\le16,\\;(x-1)^2+y^2\\ge1,\\;0\\le z\\le y+4\\}$. Perche' conviene Gauss?","opts":[{"x":"$e^{x^2}$ non ha primitiva elementare: sul bordo il conto diretto e' proibitivo, mentre $\\nabla\\cdot F$ e' costante.","c":true},{"x":"Perche' $E$ non e' un solido chiuso e Gauss e' l'unico modo per chiuderne il bordo."},{"x":"Perche' il campo e' conservativo e quindi il flusso e' automaticamente nullo."}],"hint":"Guarda la terza componente: sapresti integrare $e^{x^2}$ su una faccia?","sol":"Teorema della divergenza. $E$ e' gia' un solido chiuso e limitato con bordo regolare a tratti (non serve chiuderlo); la scelta di Gauss e' dettata da $e^{x^2}$ (nessuna primitiva elementare) e dal fatto che $\\nabla\\cdot F$ e' costante."},{"t":"Il vincolo $(x-1)^2+y^2\\ge1$ scava un buco nel dominio. Cosa comporta per l'ipotesi di Gauss e per il calcolo?","opts":[{"x":"$F$ resta $C^1$ ovunque (il buco e' geometrico, non una singolarita' del campo): Gauss vale, ma l'area di base va calcolata SOTTRAENDO il disco mancante.","c":true},{"x":"Il buco e' una singolarita' di $F$: Gauss non si applica e va esclusa una pallina attorno."},{"x":"Il buco non cambia nulla: si integra sul mezzo disco pieno."}],"hint":"Il buco toglie punti al dominio, ma $F$ e' definito anche li'. E' un problema di ipotesi o di misura d'integrazione?","sol":"Ipotesi di Gauss ($F\\in C^1$) intatta: $F$ e' regolare su tutto $\\mathbb R^3$, il buco e' solo una regione tolta a $E$. L'effetto e' sull'insieme d'integrazione, non sul teorema: $D$ e' il semidisco $\\{x\\ge0,\\,x^2+y^2\\le16\\}$ MENO il disco $(x-1)^2+y^2\\le1$."},{"t":"In polari: $\\{x\\ge0\\}\\Rightarrow\\theta\\in[-\\tfrac\\pi2,\\tfrac\\pi2]$, $x^2+y^2\\le16\\Rightarrow\\rho\\le4$. La circonferenza $(x-1)^2+y^2=1$ diventa?","opts":[{"x":"$\\rho=2\\cos\\theta$, quindi $D=\\{\\theta\\in[-\\tfrac\\pi2,\\tfrac\\pi2],\\;2\\cos\\theta\\le\\rho\\le4\\}$.","c":true},{"x":"$\\rho=2\\sin\\theta$, e $D=\\{0\\le\\rho\\le2\\sin\\theta\\}$."},{"x":"$\\rho=1$, cioe' un cerchio centrato nell'origine di raggio $1$."}],"hint":"$(x-1)^2+y^2=1\\Leftrightarrow x^2+y^2=2x$. Sostituisci $x=\\rho\\cos\\theta$.","sol":"$(x-1)^2+y^2=1\\Leftrightarrow x^2+y^2=2x\\Leftrightarrow\\rho^2=2\\rho\\cos\\theta\\Leftrightarrow\\rho=2\\cos\\theta$ (equazione polare della circonferenza per l'origine centrata sull'asse $x$). Il buco e' $\\rho\\le2\\cos\\theta$, quindi il dominio parte da $\\rho=2\\cos\\theta$."},{"t":"$\\nabla\\cdot F=3+1+4=8$, quindi $\\Phi=8\\iint_D(y+4)\\,dA$. Come sfrutti la simmetria di $D$?","opts":[{"x":"$\\iint_D y\\,dA=0$ ($D$ simmetrico rispetto all'asse $x$, integrando dispari in $y$), quindi $\\Phi=8\\cdot4\\cdot\\text{Area}(D)=32(8\\pi-\\pi)=224\\pi.$","c":true},{"x":"$\\iint_D y\\,dA=0$ ma $\\text{Area}(D)=8\\pi$ (dimenticando di togliere il buco), quindi $\\Phi=256\\pi.$"},{"x":"Non c'e' simmetria utile: va calcolato $\\iint_D y\\,dA$ per intero."}],"hint":"$D$ e' simmetrico rispetto a $y\\mapsto-y$? E l'area del buco quanto vale?","sol":"$\\Phi=\\iiint_E8\\,dV=8\\iint_D(y+4)\\,dA$. Simmetria: $D$ e' simmetrico rispetto all'asse $x$ (il buco e' centrato in $(1,0)$), $y$ e' dispari, quindi $\\iint_D y\\,dA=0$. Area$(D)=$ semidisco $\\tfrac12\\pi\\cdot4^2=8\\pi$ meno disco unitario $\\pi$, cioe' $7\\pi$. $\\Phi=8\\cdot4\\cdot7\\pi=224\\pi$, CONCORDE con la stampa. Il $256\\pi$ e' il flusso di chi non sottrae il buco."},{"t":"Controllo: perche' i termini $yz$ in $F_1$ e $\\cos x$ in $F_2$ non compaiono nel risultato?","opts":[{"x":"Entrano in $\\nabla\\cdot F$ solo via $\\partial_x(3x+yz)=3$ e $\\partial_y(\\cos x+y)=1$: $yz$ e $\\cos x$ derivano rispetto alla variabile sbagliata e cadono.","c":true},{"x":"Perche' sono dispari e si annullano integrando su $D$."},{"x":"Perche' $yz$ e $\\cos x$ sono trascurabili rispetto ai termini lineari."}],"hint":"$\\partial_x(yz)$ quanto fa? E $\\partial_y(\\cos x)$?","sol":"$\\partial_x(3x+yz)=3$, $\\partial_y(\\cos x+y)=1$, $\\partial_z(4z+e^{x^2})=4$: $\\nabla\\cdot F=8$. I pezzi $yz,\\cos x,e^{x^2}$ derivano in una variabile da cui non dipendono e spariscono. E' la stessa struttura del passo 1: la divergenza annega le componenti scomode."}]},{"pool":"gauss","src":"20220907 Es.3","steps":[{"t":"$E=\\{z^2+1\\le x^2+y^2\\le z+7\\}$, $F=(x+\\cos(y^2),\\,y+\\sin y,\\,-z\\cos y)$. Riconosci le superfici e scegli la strada.","opts":[{"x":"Iperboloide a una falda $x^2+y^2=z^2+1$ (il suo esterno) e paraboloide $x^2+y^2=z+7$ (il suo interno); Gauss in coordinate cilindriche.","c":true},{"x":"Due sfere concentriche; Gauss in coordinate sferiche."},{"x":"Un cono e un cilindro; conto diretto sulle due falde."}],"hint":"$x^2+y^2=z^2+1$ e' un iperboloide a una falda; $x^2+y^2=z+7$ e' un paraboloide.","sol":"Teorema della divergenza in coordinate cilindriche. $x^2+y^2\\ge z^2+1$ e' l'esterno dell'iperboloide a UNA falda; $x^2+y^2\\le z+7$ e' l'interno del paraboloide. $E$ e' l'intercapedine fra i due."},{"t":"Prima di integrare: fra quali quote $z$ vive $E$, e le ipotesi di Gauss valgono?","opts":[{"x":"$z^2+1\\le z+7\\Rightarrow z\\in[-2,3]$; $F\\in C^\\infty$ (seno e coseno interi), $E$ limitato: Gauss vale.","c":true},{"x":"$z\\in[-2,3]$, ma $-z\\cos y$ ha una singolarita' in $y=\\pi/2$: va esclusa."},{"x":"$z\\in[0,7]$, e le ipotesi non vanno verificate perche' il campo e' polinomiale."}],"hint":"L'intercapedine esiste dove il pavimento (iperboloide) sta sotto il soffitto (paraboloide): $z^2+1\\le z+7$.","sol":"$E$ e' non vuoto dove $z^2+1\\le z+7\\Leftrightarrow z^2-z-6\\le0\\Leftrightarrow z\\in[-2,3]$. Ipotesi di Gauss: $F\\in C^1$; qui $\\cos(y^2),\\sin y,\\cos y$ sono $C^\\infty(\\mathbb R^3)$, nessuna singolarita' (il coseno e' ovunque definito), $E$ compatto: il teorema si applica."},{"t":"Calcola $\\nabla\\cdot F$ e osserva cosa succede ai due termini in $\\cos y$.","opts":[{"x":"$\\partial_x(x+\\cos y^2)=1$, $\\partial_y(y+\\sin y)=1+\\cos y$, $\\partial_z(-z\\cos y)=-\\cos y$: somma $=2$.","c":true},{"x":"$\\nabla\\cdot F=1+(1+\\cos y)+(-\\cos y)=2+2\\cos y$ (dimenticando che i due $\\cos y$ hanno segno opposto)."},{"x":"$\\nabla\\cdot F=1$: solo la prima componente dipende dalla propria variabile."}],"hint":"$\\partial_y(y+\\sin y)$ e $\\partial_z(-z\\cos y)$: i due $\\cos y$ hanno segno opposto.","sol":"$\\nabla\\cdot F=1+(1+\\cos y)+(-\\cos y)=2$. Il $+\\cos y$ della seconda componente e il $-\\cos y$ della terza si elidono: il campo e' costruito apposta perche' la divergenza collassi a una costante."},{"t":"$\\Phi=2\\,\\text{Vol}(E)$. In cilindriche $\\text{Vol}(E)=2\\pi\\int_{-2}^{3}\\tfrac12[(z+7)-(z^2+1)]\\,dz$. Quanto vale $\\Phi$?","opts":[{"x":"$\\text{Vol}=\\pi\\int_{-2}^{3}(z+6-z^2)dz=\\tfrac{125}{6}\\pi$, quindi $\\Phi=\\tfrac{125}{3}\\pi.$","c":true},{"x":"$\\text{Vol}=2\\pi\\int_{-2}^3(z+6-z^2)dz=\\tfrac{125}{3}\\pi$, quindi $\\Phi=\\tfrac{250}{3}\\pi$ (fattore $2\\pi$ contato due volte)."},{"x":"$\\text{Vol}=\\pi\\int_{-2}^3(\\sqrt{z+7}-\\sqrt{z^2+1})\\,dz$, senza il quadrato dei raggi."}],"hint":"$\\int_{\\sqrt{z^2+1}}^{\\sqrt{z+7}}\\rho\\,d\\rho=\\tfrac12[(z+7)-(z^2+1)]$: l'area dell'anello e' $\\pi(R^2-r^2)$.","sol":"Cilindriche: $dV=\\rho\\,d\\rho\\,d\\theta\\,dz$, $\\int_{\\sqrt{z^2+1}}^{\\sqrt{z+7}}\\rho\\,d\\rho=\\tfrac12[(z+7)-(z^2+1)]$. $\\text{Vol}=2\\pi\\cdot\\tfrac12\\int_{-2}^3(6+z-z^2)dz=\\pi[\\tfrac{z^2}2+6z-\\tfrac{z^3}3]_{-2}^3=\\tfrac{125}{6}\\pi$. $\\Phi=2\\,\\text{Vol}=\\tfrac{125}{3}\\pi$, CONCORDE con la stampa. Il distrattore raddoppia il $2\\pi$ (gia' dentro Vol)."},{"t":"Perche' era lecito ridurre $\\Phi=\\iiint_E\\nabla\\cdot F\\,dV$ a $2\\,\\text{Vol}(E)$, e cosa cambierebbe se $\\nabla\\cdot F$ non fosse costante?","opts":[{"x":"Perche' $\\nabla\\cdot F=2$ e' costante: $\\iiint_E2\\,dV=2\\,\\text{Vol}$. Se dipendesse da $(x,y,z)$ andrebbe integrata punto per punto sul solido.","c":true},{"x":"Perche' il flusso e' sempre proporzionale al volume, qualunque campo."},{"x":"Perche' $E$ e' simmetrico e ogni divergenza si media a $2$."}],"hint":"$\\iiint_E c\\,dV$ con $c$ costante quanto fa?","sol":"$\\iiint_E c\\,dV=c\\,\\text{Vol}(E)$ vale SOLO perche' $c=2$ e' costante. Con una divergenza non costante (es. $\\nabla\\cdot F=1+2y$ di altri appelli) il flusso non e' proporzionale al volume: va integrata la funzione, spesso annullando i termini dispari per simmetria."}]}],"stokes":[{"pool":"stokes","src":"tipo B · manuale","steps":[{"t":"Il teorema di Stokes afferma che, sotto le sue ipotesi, la circuitazione di $F$ lungo $\\partial S$ uguaglia:","opts":[{"x":"$\\iint_S (\\nabla\\times F)\\cdot n\\,dS$","c":true},{"x":"$\\iint_S (\\nabla\\cdot F)\\,dS$"},{"x":"$\\iiint_V (\\nabla\\cdot F)\\,dV$"},{"x":"$\\iint_S F\\cdot n\\,dS$"}],"hint":"Il secondo membro è il flusso del ROTORE, non della divergenza né di $F$ stesso.","sol":"Teorema di Stokes: $\\oint_{\\partial S} F\\cdot d\\ell=\\iint_S (\\nabla\\times F)\\cdot n\\,dS$. A sinistra la circuitazione, a destra il flusso del rotore attraverso una qualunque superficie $S$ che abbia $\\partial S$ come bordo."}]},{"pool":"stokes","src":"tipo B · manuale","steps":[{"t":"Quali ipotesi servono per applicare il teorema di Stokes a $\\oint_{\\partial S} F\\cdot d\\ell$?","opts":[{"x":"$F$ di classe $C^1$ su un aperto contenente $S$, e $S$ superficie regolare orientabile con bordo","c":true},{"x":"$F$ solo continuo e $S$ chiusa"},{"x":"$F$ irrotazionale e $S$ piana"},{"x":"$F$ di classe $C^1$ e $S$ superficie chiusa senza bordo"}],"hint":"Una superficie CHIUSA non ha bordo: la circuitazione non è definita. E serve $C^1$, non la sola continuità.","sol":"Il teorema di Stokes richiede $F\\in C^1$ su un aperto che contiene $S$, e $S$ superficie regolare, orientabile, con bordo $\\partial S$. La superficie deve avere bordo (non essere chiusa) e l'orientazione della normale deve essere coerente col verso di $\\partial S$."}]},{"pool":"stokes","src":"tipo B · manuale","steps":[{"t":"Come si sceglie il verso di percorrenza di $\\partial S$ una volta fissata la normale $n$ di $S$?","opts":[{"x":"Regola della mano destra: pollice lungo $n$, le dita indicano il verso di $\\partial S$","c":true},{"x":"Sempre antiorario, indipendentemente da $n$"},{"x":"Sempre orario visto dall'alto"},{"x":"Il verso è arbitrario e non influenza il segno"}],"hint":"Verso del bordo e verso della normale NON sono indipendenti: uno determina l'altro.","sol":"L'orientazione coerente è data dalla regola della mano destra: se il pollice punta come $n$, le dita danno il verso positivo di $\\partial S$. Scambiare uno dei due senza l'altro introduce un errore di segno nel teorema di Stokes."}]},{"pool":"stokes","src":"tipo B · manuale","steps":[{"t":"La prima componente di $\\nabla\\times F$ è:","opts":[{"x":"$\\partial_y F_3 - \\partial_z F_2$","c":true},{"x":"$\\partial_z F_2 - \\partial_y F_3$"},{"x":"$\\partial_x F_2 - \\partial_y F_1$"},{"x":"$\\partial_y F_2 - \\partial_z F_3$"}],"hint":"È la componente $x$: si ottiene ciclicamente da $y,z$ sulle componenti $F_3,F_2$.","sol":"Dal determinante formale del rotore: $(\\nabla\\times F)_1=\\partial_y F_3-\\partial_z F_2$, poi ciclicamente $x\\to y\\to z$. Invertire l'ordine della differenza cambia il segno dell'intera componente."}]},{"pool":"stokes","src":"tipo B · manuale","steps":[{"t":"La seconda componente del rotore è $\\partial_z F_1-\\partial_x F_3$. Perché è facile sbagliarla?","opts":[{"x":"Perché l'ordine ciclico dà $z,x$ su $F_1,F_3$: scriverla come $\\partial_x F_3-\\partial_z F_1$ inverte il segno","c":true},{"x":"Perché la componente $y$ del rotore è sempre nulla"},{"x":"Perché va calcolata con la divergenza"},{"x":"Perché richiede le derivate seconde"}],"hint":"L'errore tipico è invertire i due termini della differenza sulla componente centrale.","sol":"$(\\nabla\\times F)_2=\\partial_z F_1-\\partial_x F_3$. La regola ciclica $x\\to y\\to z\\to x$ fissa l'ordine; scriverla al contrario ($\\partial_x F_3-\\partial_z F_1$) è l'errore più frequente e falsa il segno della circuitazione via Stokes."}]},{"pool":"stokes","src":"tipo B · manuale","steps":[{"t":"Se $F$ è irrotazionale ($\\nabla\\times F=0$) su un aperto, quanto vale $\\oint_{\\partial S} F\\cdot d\\ell$ per una superficie $S$ tutta contenuta in quell'aperto?","opts":[{"x":"Zero, perché il flusso di un rotore nullo è nullo","c":true},{"x":"Sempre $2\\pi$"},{"x":"Dipende solo dalla lunghezza di $\\partial S$"},{"x":"Non è calcolabile senza il potenziale"}],"hint":"Se $\\nabla\\times F=0$ ovunque su $S$, l'integrando del secondo membro di Stokes è identicamente nullo.","sol":"Per Stokes $\\oint_{\\partial S} F\\cdot d\\ell=\\iint_S (\\nabla\\times F)\\cdot n\\,dS=\\iint_S 0=0$. Serve che TUTTA $S$ stia nell'aperto dove $\\nabla\\times F=0$: nessun buco del dominio deve essere attraversato."}]},{"pool":"stokes","src":"tipo B · manuale","steps":[{"t":"Perché per calcolare $\\oint_{\\partial S} F\\cdot d\\ell$ posso sostituire $S$ con un'altra superficie $S'$ avente lo stesso bordo?","opts":[{"x":"Perché Stokes lega la circuitazione al bordo: ogni $S'$ con $\\partial S'=\\partial S$ dà lo stesso flusso del rotore","c":true},{"x":"Perché due superfici hanno sempre lo stesso flusso del rotore"},{"x":"Perché il rotore non dipende da $F$"},{"x":"Non è lecito: la superficie è unica"}],"hint":"Il primo membro di Stokes dipende SOLO dal bordo, purché $F\\in C^1$ nella regione tra le due superfici.","sol":"Stokes: $\\oint_{\\partial S}F\\cdot d\\ell=\\iint_{S}(\\nabla\\times F)\\cdot n\\,dS$ dipende solo da $\\partial S$. Se $\\partial S'=\\partial S$ con la stessa orientazione e $F\\in C^1$ nella regione racchiusa, il flusso del rotore è identico. Si sceglie allora la $S'$ più comoda, tipicamente un disco piano."}]},{"pool":"stokes","src":"tipo B · manuale","steps":[{"t":"Il teorema di Green nel piano, $\\oint_{\\partial D} F\\cdot d\\ell=\\iint_D(\\partial_x F_2-\\partial_y F_1)\\,dx\\,dy$, è:","opts":[{"x":"Il caso particolare di Stokes per $S$ piana nel piano $xy$ con $n=(0,0,1)$","c":true},{"x":"Un teorema indipendente da Stokes"},{"x":"Il teorema della divergenza in 2D"},{"x":"Valido solo per campi conservativi"}],"hint":"$\\partial_x F_2-\\partial_y F_1$ è proprio la terza componente del rotore.","sol":"Green è Stokes con $S$ regione piana e $n=(0,0,1)$: allora $(\\nabla\\times F)\\cdot n=(\\nabla\\times F)_3=\\partial_x F_2-\\partial_y F_1$. Non è la divergenza (quello è il teorema di Gauss)."}]},{"pool":"stokes","src":"tipo B · manuale","steps":[{"t":"Se la normale $n$ di una superficie cartesiana ha terza componente NEGATIVA, il bordo $\\partial S$ orientato coerentemente è:","opts":[{"x":"Percorso in senso orario visto dall'alto","c":true},{"x":"Percorso in senso antiorario visto dall'alto"},{"x":"Percorso due volte"},{"x":"Indeterminato"}],"hint":"Mano destra: pollice verso il basso ribalta il verso rispetto al caso 'normale verso l'alto'.","sol":"Con $n_3>0$ (normale verso l'alto) il bordo è antiorario visto dall'alto; con $n_3<0$ è orario. Invertire la normale senza invertire il verso del bordo introduce un segno sbagliato in Stokes (cfr. esame 20250127, es.1)."}]},{"pool":"stokes","src":"tipo B · manuale","steps":[{"t":"Per una superficie cartesiana $z=f(x,y)$ si integra $\\iint_D (\\nabla\\times F)\\cdot(-f_x,-f_y,1)\\,dx\\,dy$ SENZA normalizzare $(-f_x,-f_y,1)$. Perché?","opts":[{"x":"Perché $n\\,dS=(-f_x,-f_y,1)\\,dx\\,dy$: la norma nel $dS$ e quella nel versore si semplificano","c":true},{"x":"Perché la normale è già un versore"},{"x":"Perché il rotore è costante"},{"x":"Perché l'area di $D$ vale $1$"}],"hint":"$dS=|X_x\\times X_y|\\,dx\\,dy$ e $n=(X_x\\times X_y)/|X_x\\times X_y|$: nel prodotto $n\\,dS$ la norma sparisce.","sol":"$n\\,dS=\\frac{X_x\\times X_y}{|X_x\\times X_y|}\\,|X_x\\times X_y|\\,dx\\,dy=(X_x\\times X_y)\\,dx\\,dy=(-f_x,-f_y,1)\\,dx\\,dy$. Si usa il vettore NON normalizzato: normalizzare e poi rimoltiplicare per $\\sqrt{1+f_x^2+f_y^2}$ è un doppio conteggio."}]},{"pool":"stokes","src":"tipo B · manuale","steps":[{"t":"Quanto vale $\\nabla\\times(\\nabla U)$ per un campo scalare $U\\in C^2$?","opts":[{"x":"$0$: il rotore di un gradiente è sempre nullo","c":true},{"x":"$\\nabla U$"},{"x":"$\\nabla^2 U$"},{"x":"Dipende da $U$"}],"hint":"Segue dall'uguaglianza delle derivate miste (teorema di Schwarz).","sol":"$\\nabla\\times(\\nabla U)=0$ perché ogni componente è una differenza di derivate miste uguali (Schwarz): $\\partial_y\\partial_z U-\\partial_z\\partial_y U=0$, ecc. Un campo conservativo è quindi irrotazionale, e per Stokes la sua circuitazione su ogni bordo di superficie contenuta nel dominio è nulla."}]},{"pool":"stokes","src":"tipo B · manuale","steps":[{"t":"Due superfici $S_1,S_2$ con lo stesso bordo danno lo stesso flusso del rotore. Qual è la ragione profonda?","opts":[{"x":"$\\nabla\\cdot(\\nabla\\times F)=0$: chiudendo $S_1\\cup S_2$ e applicando Gauss, il flusso totale del rotore è nullo","c":true},{"x":"Perché i rotori sono sempre uguali"},{"x":"Perché le aree sono uguali"},{"x":"È una coincidenza numerica"}],"hint":"Unisci le due superfici in una chiusa e usa che la divergenza del rotore è identicamente zero.","sol":"$\\nabla\\cdot(\\nabla\\times F)=0$ identicamente. Se $S_1$ e $S_2$ hanno lo stesso bordo, $S_1\\cup(-S_2)$ è chiusa e racchiude un volume $V$: per Gauss $\\iint_{\\partial V}(\\nabla\\times F)\\cdot n=\\iiint_V \\nabla\\cdot(\\nabla\\times F)=0$, cioè i due flussi coincidono. È la base per cambiare superficie in Stokes."}]},{"pool":"stokes","src":"tipo B · manuale","steps":[{"t":"Sul campo $F=\\frac{(-y,\\,x)}{x^2+y^2}$ (su $\\mathbb{R}^2\\setminus\\{0\\}$) si ha $\\nabla\\times F=0$, eppure la circuitazione su un cerchio attorno all'origine vale $2\\pi$. Contraddice Stokes?","opts":[{"x":"No: nessuna superficie con quel bordo sta tutta nel dominio (l'origine è esclusa), quindi Stokes non si applica","c":true},{"x":"Sì, Stokes è violato"},{"x":"No, perché in realtà il rotore non è nullo"},{"x":"Sì, perché il campo non è $C^1$"}],"hint":"Per applicare Stokes servirebbe una superficie CONTENUTA nel dominio: ma ogni disco con quel bordo contiene l'origine.","sol":"Nessuna contraddizione: Stokes richiede una superficie tutta nel dominio di $C^1$ di $F$. Ogni superficie col bordo attorno all'origine contiene il buco, dove $F$ non è definito. Irrotazionale su dominio NON semplicemente connesso non implica circuitazione nulla (cfr. esame 20230907)."}]},{"pool":"stokes","src":"tipo B · manuale","steps":[{"t":"Se inverto il verso di percorrenza di $\\partial S$, la circuitazione $\\oint_{\\partial S} F\\cdot d\\ell$:","opts":[{"x":"Cambia segno","c":true},{"x":"Resta invariata"},{"x":"Si annulla"},{"x":"Raddoppia"}],"hint":"$d\\ell$ cambia verso: l'integrale di linea di seconda specie è orientato.","sol":"L'integrale di linea di seconda specie è orientato: invertendo $\\partial S$ si ha $d\\ell\\to-d\\ell$ e la circuitazione cambia segno. Coerentemente, in Stokes cambia anche il verso di $n$ e quindi il segno del flusso del rotore."}]},{"pool":"stokes","src":"tipo B · manuale","steps":[{"t":"Perché spesso conviene passare da $\\oint_{\\partial S} F\\cdot d\\ell$ al flusso $\\iint_S(\\nabla\\times F)\\cdot n\\,dS$?","opts":[{"x":"Perché $\\nabla\\times F$ è spesso più semplice di $F$ (componenti costanti o nulle) e $S$ si sceglie piana","c":true},{"x":"Perché l'integrale di linea non è mai calcolabile"},{"x":"Perché il flusso è sempre nullo"},{"x":"Perché così si evita di calcolare il rotore"}],"hint":"Il vantaggio è doppio: rotore semplice + libertà di scegliere la superficie col medesimo bordo.","sol":"Il rotore dei campi da esame ha spesso componenti costanti o nulle (es. $(0,1+z,0)$, $(-1,2(x-z),0)$), e per Stokes si sceglie la superficie più comoda con lo stesso bordo (un disco su un piano). L'integrale doppio diventa elementare. A volte conviene il verso opposto: flusso difficile ridotto a circuitazione facile."}]},{"pool":"stokes","src":"20220124 · es.4","steps":[{"t":"Curva $\\gamma$: $z=x+3y+4$ su $x^2+y^2=4$; per il campo $F$ si trova $\\nabla\\times F=(-1,\\,2(x-z),\\,0)$. Con $S$ il pezzo di piano ($X_x\\times X_y=(-1,-3,1)$), quanto vale $\\oint_\\gamma F\\cdot d\\ell$?","opts":[{"x":"$100\\pi$","c":true},{"x":"$0$"},{"x":"$25\\pi$"},{"x":"$-100\\pi$"}],"hint":"Sostituisci $z=x+3y+4$ nel rotore PRIMA di integrare; poi usa $\\iint_D y\\,dx\\,dy=0$ sul disco centrato.","sol":"Per Stokes $\\oint_\\gamma F\\cdot d\\ell=\\iint_D(\\nabla\\times F)\\cdot(-1,-3,1)\\,dx\\,dy$. Il prodotto scalare dà $1-6(x-z)$; con $z=x+3y+4$ si ha $x-z=-3y-4$, quindi l'integrando è $25+18y$. Su $D=\\{x^2+y^2\\le4\\}$: $\\iint 18y=0$ e $\\iint 25=25\\cdot4\\pi=100\\pi$."}]},{"pool":"stokes","src":"20220706 · es.4","steps":[{"t":"Per $F=(y^2+y+z^2,\\,2xy+x,\\,2axz)$, il rotore $\\nabla\\times F$ vale:","opts":[{"x":"$(0,\\,2z-2az,\\,0)$","c":true},{"x":"$(0,\\,2az-2z,\\,0)$"},{"x":"$(2z,\\,0,\\,1)$"},{"x":"$(0,\\,0,\\,2az)$"}],"hint":"Componente 2: $\\partial_z F_1-\\partial_x F_3=2z-2az$. Attento all'ordine della differenza.","sol":"Dal determinante formale: comp1 $=\\partial_y(2axz)-\\partial_z(2xy+x)=0$; comp2 $=\\partial_z(y^2+y+z^2)-\\partial_x(2axz)=2z-2az$; comp3 $=\\partial_x(2xy+x)-\\partial_y(y^2+y+z^2)=(2y+1)-(2y+1)=0$. Quindi $\\nabla\\times F=(0,2z-2az,0)$."}]},{"pool":"stokes","src":"20220706 · es.4","steps":[{"t":"Con $\\nabla\\times F=(0,\\,2z-2az,\\,0)$, per quale valore di $a$ la circuitazione $\\oint_\\gamma F\\cdot d\\ell$ è nulla su OGNI curva chiusa?","opts":[{"x":"$a=1$: allora $\\nabla\\times F=0$ e il campo è irrotazionale (conservativo su dominio semplice)","c":true},{"x":"$a=0$"},{"x":"$a=-1$"},{"x":"Nessun valore: dipende sempre dalla curva"}],"hint":"Circuitazione nulla su ogni bordo di superficie semplice richiede rotore identicamente nullo.","sol":"Per $a=1$: $\\nabla\\times F=(0,2z-2z,0)=0$. Per Stokes $\\oint_\\gamma F\\cdot d\\ell=\\iint_S 0=0$ su ogni bordo di superficie contenuta nel dominio; su $\\mathbb{R}^3$ (semplicemente connesso) $F$ è anche conservativo."}]},{"pool":"stokes","src":"20230705 · es.2","steps":[{"t":"Curva $\\Gamma$: $x^2+y^2=8$, $x+y+z=1$; $F=(x^2y,\\,y^2z,\\,xz)$. Usando il piano $z=1-x-y$ (con $X_x\\times X_y=(1,1,1)$), quanto vale $\\oint_\\Gamma F\\cdot d\\ell$?","opts":[{"x":"$-40\\pi$","c":true},{"x":"$40\\pi$"},{"x":"$-8\\pi$"},{"x":"$0$"}],"hint":"$\\nabla\\times F=(-y^2,-z,-x^2)$; sostituisci $z=1-x-y$ e integra su $D=\\{x^2+y^2\\le8\\}$ in coordinate polari.","sol":"Stokes: $\\oint_\\Gamma F\\cdot d\\ell=\\iint_D(-y^2,-z,-x^2)\\cdot(1,1,1)\\,dx\\,dy=\\iint_D(-x^2-y^2-z)$ con $z=1-x-y$, cioè $-x^2-y^2+x+y-1$. Su $D$ (raggio $\\sqrt8$): $\\iint(-x^2-y^2)=-32\\pi$, $\\iint(x+y)=0$, $\\iint(-1)=-8\\pi$. Totale $-40\\pi$."}]},{"pool":"stokes","src":"20230123 · es.3","steps":[{"t":"Per $F=(y^2-x,\\,2xy,\\,-xz-x)$ (bordo di uno spicchio di sfera), il rotore $\\nabla\\times F$ è:","opts":[{"x":"$(0,\\,1+z,\\,0)$","c":true},{"x":"$(0,\\,-1-z,\\,0)$"},{"x":"$(2y,\\,0,\\,2y)$"},{"x":"$(1+z,\\,0,\\,0)$"}],"hint":"Comp2 $=\\partial_z F_1-\\partial_x F_3=0-(-z-1)=z+1$.","sol":"comp1 $=\\partial_y(-xz-x)-\\partial_z(2xy)=0$; comp2 $=\\partial_z(y^2-x)-\\partial_x(-xz-x)=0-(-z-1)=1+z$; comp3 $=\\partial_x(2xy)-\\partial_y(y^2-x)=2y-2y=0$. Quindi $\\nabla\\times F=(0,1+z,0)$; via Stokes il lavoro sul bordo dello spicchio vale $9\\pi/2$."}]},{"pool":"stokes","src":"20250127 · es.1","steps":[{"t":"$\\nabla\\times F=(3z-1,\\,0,\\,-y)$ su $S$: piano $z=-2x-y+2$, $D=\\{x^2+y^2\\le9\\}$, normale con TERZA componente negativa. Quanto vale $\\oint_{\\partial S} F\\cdot d\\ell$?","opts":[{"x":"$-90\\pi$","c":true},{"x":"$90\\pi$"},{"x":"$-10\\pi$"},{"x":"$0$"}],"hint":"Normale con 3ª componente negativa: usa $(-2,-1,-1)$, opposto di $(2,1,1)$. Poi sostituisci $z=-2x-y+2$.","sol":"Con $n_3<0$ si ha $n\\,dS=(-2,-1,-1)\\,dx\\,dy$. $(\\nabla\\times F)\\cdot(-2,-1,-1)=-6z+2+y$; con $z=-2x-y+2$ diventa $12x+7y-10$. Su $D$ (raggio 3, centrato): $\\iint(12x+7y)=0$, $\\iint(-10)=-90\\pi$. Il segno della normale determina il verso del bordo (Stokes)."}]},{"pool":"stokes","src":"20240704 · es.3","steps":[{"t":"Per $F=(y+xz,\\,z+e^y,\\,x+e^z)$, il rotore $\\nabla\\times F$ è:","opts":[{"x":"$(-1,\\,x-1,\\,-1)$","c":true},{"x":"$(0,\\,0,\\,-1)$"},{"x":"$(1,\\,1-x,\\,1)$"},{"x":"$(-1,\\,1-x,\\,-1)$"}],"hint":"Comp1 $=\\partial_y F_3-\\partial_z F_2=0-1$; comp2 $=\\partial_z F_1-\\partial_x F_3=x-1$.","sol":"comp1 $=\\partial_y(x+e^z)-\\partial_z(z+e^y)=0-1=-1$; comp2 $=\\partial_z(y+xz)-\\partial_x(x+e^z)=x-1$; comp3 $=\\partial_x(z+e^y)-\\partial_y(y+xz)=0-1=-1$. Quindi $\\nabla\\times F=(-1,x-1,-1)$, da inserire nel flusso di Stokes."}]},{"pool":"stokes","src":"tipo B · manuale","steps":[{"t":"Calcola $\\oint_{\\partial D} F\\cdot d\\ell$ con $F=(-y,\\,x)$ e $D$ disco unitario, percorso antiorario, via Green.","opts":[{"x":"$2\\pi$","c":true},{"x":"$0$"},{"x":"$\\pi$"},{"x":"$-2\\pi$"}],"hint":"$\\partial_x F_2-\\partial_y F_1=1-(-1)=2$; l'integrale doppio è $2$ volte l'area.","sol":"Green (Stokes 2D): $\\oint_{\\partial D}F\\cdot d\\ell=\\iint_D(\\partial_x F_2-\\partial_y F_1)\\,dx\\,dy=\\iint_D 2\\,dx\\,dy=2\\cdot\\text{area}(D)=2\\pi$."}]},{"pool":"stokes","src":"tipo B · manuale","steps":[{"t":"Usando Green, $\\oint_{\\partial D} x\\,dy$ (cioè $F=(0,\\,x)$) lungo il cerchio di raggio $R$ antiorario vale:","opts":[{"x":"$\\pi R^2$","c":true},{"x":"$2\\pi R$"},{"x":"$0$"},{"x":"$2\\pi R^2$"}],"hint":"$\\partial_x F_2-\\partial_y F_1=1$: l'integrale doppio diventa l'area di $D$.","sol":"Green: $\\oint_{\\partial D} x\\,dy=\\iint_D(\\partial_x(x)-\\partial_y(0))\\,dx\\,dy=\\iint_D 1\\,dx\\,dy=\\text{area}(D)=\\pi R^2$. È la formula dell'area via circuitazione, caso 2D di Stokes."}]},{"pool":"stokes","src":"tipo B · manuale","steps":[{"t":"Calcola $\\nabla\\times F$ per $F=(xy,\\,yz,\\,zx)$.","opts":[{"x":"$(-y,\\,-z,\\,-x)$","c":true},{"x":"$(y,\\,z,\\,x)$"},{"x":"$(z,\\,x,\\,y)$"},{"x":"$(0,\\,0,\\,0)$"}],"hint":"comp1 $=\\partial_y(zx)-\\partial_z(yz)=0-y$.","sol":"comp1 $=\\partial_y(zx)-\\partial_z(yz)=0-y=-y$; comp2 $=\\partial_z(xy)-\\partial_x(zx)=0-z=-z$; comp3 $=\\partial_x(yz)-\\partial_y(xy)=0-x=-x$. Quindi $\\nabla\\times F=(-y,-z,-x)$."}]},{"pool":"stokes","src":"tipo B · manuale","steps":[{"t":"Per $F=(-y,\\,x,\\,0)$ si ha $\\nabla\\times F=(0,0,2)$. La circuitazione lungo il cerchio unitario nel piano $xy$ (antiorario, $n=(0,0,1)$) vale:","opts":[{"x":"$2\\pi$","c":true},{"x":"$0$"},{"x":"$\\pi$"},{"x":"$4\\pi$"}],"hint":"Flusso di $(0,0,2)$ attraverso il disco unitario $=2\\cdot$ area.","sol":"Stokes: $\\oint F\\cdot d\\ell=\\iint_S(0,0,2)\\cdot(0,0,1)\\,dS=2\\cdot\\text{area}(\\text{disco})=2\\pi$. Il rotore costante $2\\hat z$ misura la vorticità del campo rotante."}]},{"pool":"stokes","src":"tipo B · manuale","steps":[{"t":"Per $F=(0,\\,0,\\,z)$, la circuitazione $\\oint_{\\partial S} F\\cdot d\\ell$ su un qualunque bordo vale:","opts":[{"x":"$0$, perché $\\nabla\\times F=0$","c":true},{"x":"$z\\cdot$ lunghezza del bordo"},{"x":"L'area di $S$"},{"x":"Dipende dalla superficie scelta"}],"hint":"Calcola prima il rotore: tutte le derivate incrociate di $F=(0,0,z)$ si annullano.","sol":"comp1 $=\\partial_y z-\\partial_z 0=0$; comp2 $=\\partial_z 0-\\partial_x z=0$; comp3 $=\\partial_x 0-\\partial_y 0=0$. Quindi $\\nabla\\times F=0$ e per Stokes $\\oint_{\\partial S} F\\cdot d\\ell=0$ su ogni bordo (il campo $z\\hat z$ è un gradiente: $F=\\nabla(z^2/2)$)."}]},{"pool":"stokes","src":"20220706 · es.4","steps":[{"t":"Con $\\nabla\\times F=(0,\\,2z-2az,\\,0)$ e superficie $S$: $z=4x+y+1$ su $x^2+y^2\\le1$, la circuitazione risulta $2(a-1)\\pi$. Per $a=2$ quanto vale?","opts":[{"x":"$2\\pi$","c":true},{"x":"$0$"},{"x":"$-2\\pi$"},{"x":"$4\\pi$"}],"hint":"Sostituisci $a=2$ nella formula $2(a-1)\\pi$.","sol":"Per Stokes il flusso di $(0,2z-2az,0)$ attraverso $S$ si riduce, dopo l'integrazione sul disco, a $2(a-1)\\pi$; con $a=2$ vale $2\\pi$. Per $a=1$ tornerebbe $0$, coerente col campo irrotazionale."}]},{"pool":"stokes","src":"tipo B · manuale","steps":[{"t":"Devi calcolare $\\oint_\\gamma F\\cdot d\\ell$ dove $\\gamma$ è il cerchio $x^2+y^2=1$ che giace sul piano $z=x+2$. Quale superficie conviene per Stokes?","opts":[{"x":"Il disco piano $\\{x^2+y^2\\le1,\\ z=x+2\\}$, di cui $\\gamma$ è il bordo","c":true},{"x":"Una semisfera qualsiasi"},{"x":"Il cilindro $x^2+y^2=1$"},{"x":"Nessuna: si deve calcolare l'integrale di linea direttamente"}],"hint":"Il bordo determina la superficie: scegli la più semplice con quel bordo, cioè un pezzo di piano.","sol":"Per Stokes ogni superficie con $\\partial S=\\gamma$ va bene; si sceglie la più semplice, il disco piano $z=x+2$ sopra $D=\\{x^2+y^2\\le1\\}$, con $X_x\\times X_y=(-f_x,-f_y,1)=(-1,0,1)$. Cilindro e semisfera complicano l'integrale senza motivo."}]},{"pool":"stokes","src":"20220124 · es.4","steps":[{"t":"Superficie cartesiana con $X_x\\times X_y=(-1,-3,1)$ (terza componente $+1$). Per Stokes il bordo va percorso:","opts":[{"x":"In senso antiorario visto dall'alto: coerente con $n_3>0$, nessun segno da aggiungere","c":true},{"x":"In senso orario visto dall'alto"},{"x":"In un verso qualunque"},{"x":"Va sempre aggiunto un segno meno"}],"hint":"$n_3>0$ (normale verso l'alto) corrisponde a bordo antiorario, per la regola della mano destra.","sol":"$X_x\\times X_y=(-f_x,-f_y,1)$ ha terza componente positiva: la normale punta verso l'alto e il bordo coerente è antiorario visto dall'alto, senza correzioni di segno. Se il testo imponesse $n_3<0$, si userebbe $-(X_x\\times X_y)$ e bordo orario."}]},{"pool":"stokes","src":"tipo B · ipotesi · manuale","steps":[{"t":"Perche' il teorema di Stokes richiede $F\\in C^1$ su un aperto che CONTIENE $S$, e non basta che $F$ sia regolare solo sul bordo $\\partial S$?","opts":[{"x":"Perche' il membro destro $\\iint_S(\\nabla\\times F)\\cdot n\\,dS$ richiede che $\\nabla\\times F$ esista e sia continuo su TUTTA la superficie $S$, non solo lungo $\\partial S$.","c":true},{"x":"Basta che $F$ sia continuo sul bordo: l'integrale vive solo li'."},{"x":"Serve soltanto che $F$ sia definito nell'origine."}],"hint":"Guarda DOVE si integra il rotore nel secondo membro dell'uguaglianza.","sol":"Ipotesi del teorema di Stokes: $S$ superficie regolare a pezzi e orientabile, $\\partial S$ curva regolare a pezzi, e $F\\in C^1$ su un aperto che contiene $S$. La tesi $\\oint_{\\partial S}F\\cdot d\\ell=\\iint_S(\\nabla\\times F)\\cdot n\\,dS$ integra il rotore sull'intera $S$: se $F$ non e' $C^1$ in un punto interno di $S$ (p.es. una singolarita'), il teorema non si applica cosi' com'e'."}]},{"pool":"stokes","src":"tipo B · superficie chiusa · manuale","steps":[{"t":"$S$ e' una superficie CHIUSA (per esempio una sfera intera). Quanto vale $\\iint_S(\\nabla\\times F)\\cdot n\\,dS$ con $F\\in C^1$?","opts":[{"x":"$0$: una superficie chiusa non ha bordo, quindi $\\partial S=\\varnothing$ e la circuitazione a cui e' uguale il flusso e' nulla.","c":true},{"x":"Uguale al volume racchiuso da $S$."},{"x":"Non calcolabile senza conoscere $F$."}],"hint":"Cos'e' il bordo di una sfera? E cosa dice Stokes quando il bordo non c'e'?","sol":"Per Stokes $\\iint_S(\\nabla\\times F)\\cdot n\\,dS=\\oint_{\\partial S}F\\cdot d\\ell$. Una superficie chiusa ha $\\partial S=\\varnothing$, quindi il flusso del rotore e' $0$. Coerente col teorema della divergenza applicato a $\\nabla\\times F$: $\\iint_{\\partial V}(\\nabla\\times F)\\cdot n\\,dS=\\iiint_V \\nabla\\cdot(\\nabla\\times F)\\,dV=0$ perche' $\\nabla\\cdot(\\nabla\\times F)\\equiv0$."}]},{"pool":"stokes","src":"tipo B · bordo multi-componente · manuale","steps":[{"t":"$S$ e' la corona circolare $\\{1\\le x^2+y^2\\le4,\\ z=0\\}$ con normale $n=(0,0,1)$. Il bordo ha DUE circonferenze. Come vanno orientate per applicare Stokes?","opts":[{"x":"Cerchio esterno ($r=2$) antiorario, cerchio interno ($r=1$) ORARIO: cosi' la superficie resta sempre a sinistra del cammino.","c":true},{"x":"Entrambe antiorarie, viste dall'alto."},{"x":"Entrambe orarie."}],"hint":"La regola della mano destra vale per OGNI componente del bordo, con la superficie 'a sinistra': i due cerchi non girano nello stesso verso.","sol":"Criterio: orientazione coerente del bordo (regola della mano destra / superficie a sinistra). Con $n$ verso l'alto il bordo esterno va antiorario; ma per il bordo interno 'superficie a sinistra' impone il verso ORARIO. L'errore tipico (entrambe antiorarie) sbaglia il contributo interno. Stokes diventa $\\oint_{\\text{est}}-\\oint_{\\text{int}}$ se si scrivono entrambi in antiorario."}]},{"pool":"stokes","src":"tipo B · rotore vs divergenza · manuale","steps":[{"t":"Nel teorema di Stokes il campo che si integra su $S$ e' il rotore $\\nabla\\times F$ o la divergenza $\\nabla\\cdot F$?","opts":[{"x":"Il ROTORE $\\nabla\\times F$: e' un campo vettoriale di cui si prende il FLUSSO attraverso $S$.","c":true},{"x":"La divergenza $\\nabla\\cdot F$, che e' uno scalare."},{"x":"Entrambi, sommati."}],"hint":"Distingui Stokes (circuitazione ↔ flusso del rotore) da Gauss (flusso ↔ integrale di volume della divergenza).","sol":"Teorema di Stokes: $\\oint_{\\partial S}F\\cdot d\\ell=\\iint_S(\\nabla\\times F)\\cdot n\\,dS$, dove $\\nabla\\times F$ e' un VETTORE. Da non confondere col teorema della divergenza (Gauss): $\\iint_{\\partial V}F\\cdot n\\,dS=\\iiint_V(\\nabla\\cdot F)\\,dV$, dove $\\nabla\\cdot F$ e' uno SCALARE. Scambiarli e' l'errore che azzera l'esercizio."}]},{"pool":"stokes","src":"tipo B · irrotazionale + connessione · manuale","steps":[{"t":"So che $\\nabla\\times F=0$ su un aperto $\\Omega$. Posso concludere $\\oint_\\gamma F\\cdot d\\ell=0$ per OGNI curva chiusa $\\gamma\\subset\\Omega$?","opts":[{"x":"Solo se $\\Omega$ e' semplicemente connesso: allora rotore nullo ⇒ campo conservativo ⇒ circuitazione nulla.","c":true},{"x":"Si', sempre: rotore nullo basta."},{"x":"No, mai: rotore nullo non dice nulla sulla circuitazione."}],"hint":"C'e' un contro-esempio celebre su $\\mathbb{R}^2\\setminus\\{0\\}$ con circuitazione $2\\pi$ pur avendo rotore nullo.","sol":"Lemma di Poincare' / criterio del campo conservativo: su un aperto SEMPLICEMENTE CONNESSO, $\\nabla\\times F=0\\Rightarrow F$ conservativo $\\Rightarrow \\oint_\\gamma F\\cdot d\\ell=0$. Senza semplice connessione la conclusione cade: $F=\\frac{(-y,x)}{x^2+y^2}$ su $\\mathbb{R}^2\\setminus\\{0\\}$ ha $\\nabla\\times F=0$ ma $\\oint=2\\pi$ attorno all'origine. La topologia del dominio e' l'ipotesi nascosta."}]},{"pool":"stokes","src":"tipo B · modus operandi (scelta strada) · manuale","steps":[{"t":"Devi calcolare $\\oint_\\gamma F\\cdot d\\ell$ su una curva chiusa $\\gamma$ geometricamente scomoda, ma $\\nabla\\times F$ risulta COSTANTE. Qual e' la strategia migliore?","opts":[{"x":"Passare a Stokes: $\\iint_S(\\nabla\\times F)\\cdot n\\,dS$ con $S$ una superficie comoda avente bordo $\\gamma$; rotore costante ⇒ l'integrale e' (rotore)$\\cdot$(vettore area).","c":true},{"x":"Parametrizzare $\\gamma$ e integrare direttamente: e' sempre piu' rapido."},{"x":"Nessuna delle due: serve il teorema della divergenza."}],"hint":"Chiediti quale membro dell'uguaglianza di Stokes e' piu' semplice DA CALCOLARE, non quale sia piu' 'naturale'.","sol":"Modus operandi: Stokes e' uno strumento di semplificazione bidirezionale. Se $\\nabla\\times F$ e' semplice/costante conviene il FLUSSO (con rotore costante, $\\iint_S(\\nabla\\times F)\\cdot n\\,dS=(\\nabla\\times F)\\cdot\\vec A$ dove $\\vec A=\\iint_S n\\,dS$ e' il vettore area di $S$); se invece $F$ sul bordo e' semplice e $\\gamma$ e' facile, conviene il conto DIRETTO. Si sceglie il membro piu' economico."}]},{"pool":"stokes","src":"tipo B · jacobiano · manuale","steps":[{"t":"Parametrizzi $S$ con $X(u,v)$ e vuoi $\\iint_S(\\nabla\\times F)\\cdot n\\,dS$. Se usi la normale UNITARIA $n=\\dfrac{X_u\\times X_v}{|X_u\\times X_v|}$, per cosa devi moltiplicare $du\\,dv$?","opts":[{"x":"Per $|X_u\\times X_v|\\,du\\,dv=dS$: il modulo si semplifica e resta $\\iint(\\nabla\\times F)\\cdot(X_u\\times X_v)\\,du\\,dv$.","c":true},{"x":"Per $du\\,dv$ e basta: la normale unitaria non richiede fattore d'area."},{"x":"Per $\\dfrac{1}{|X_u\\times X_v|}\\,du\\,dv$."}],"hint":"L'elemento d'area $dS$ NON e' $du\\,dv$: porta lo jacobiano $|X_u\\times X_v|$. Dimenticarlo e' l'errore piu' comune.","sol":"Elemento d'area di una superficie parametrizzata: $dS=|X_u\\times X_v|\\,du\\,dv$. Quindi $\\iint_S(\\nabla\\times F)\\cdot n\\,dS=\\iint_D(\\nabla\\times F)\\cdot\\frac{X_u\\times X_v}{|X_u\\times X_v|}\\,|X_u\\times X_v|\\,du\\,dv=\\iint_D(\\nabla\\times F)\\cdot(X_u\\times X_v)\\,du\\,dv$. In pratica si usa direttamente il vettore $X_u\\times X_v$ (gia' con modulo e verso), senza normalizzare: cosi' lo jacobiano non si perde."}]},{"pool":"stokes","src":"tipo B · segno orientazione · manuale","steps":[{"t":"Per $F=(-y,x,0)$ si ha $\\nabla\\times F=(0,0,2)$; sul disco unitario $z=0$ con $n=(0,0,1)$ Stokes da' $\\iint_D 2\\,dS=2\\pi$. Se orientassi $\\gamma$ in senso ORARIO tenendo $n=(0,0,1)$, cosa succede?","opts":[{"x":"Il conto diretto sul bordo darebbe $-2\\pi$: quell'orientazione e' INCOERENTE con $n$, e per riusare Stokes bisogna invertire anche $n$ in $(0,0,-1)$.","c":true},{"x":"Ancora $2\\pi$: il verso del bordo non conta."},{"x":"$0$, per simmetria."}],"hint":"Bordo e normale sono legati dalla mano destra: cambiare il verso del bordo SENZA cambiare $n$ rompe l'ipotesi di orientazione coerente.","sol":"Orientazione coerente (mano destra) del teorema di Stokes. Diretto antiorario: $\\oint_\\gamma F\\cdot d\\ell=\\int_0^{2\\pi}(-\\sin t,\\cos t,0)\\cdot(-\\sin t,\\cos t,0)\\,dt=2\\pi$, che coincide col flusso $2\\pi$. Invertire il verso del bordo cambia segno alla circuitazione ($-2\\pi$): per mantenere l'uguaglianza di Stokes si deve invertire anche la normale a $(0,0,-1)$, ottenendo $\\iint_D(-2)\\,dS=-2\\pi$. Segno del bordo e verso di $n$ vanno sempre insieme."}]},{"pool":"stokes","src":"20230705 Es.2 · circuitazione via Stokes","steps":[{"t":"$\\Gamma=\\{x^2+y^2=8,\\ x+y+z=1\\}$ e' l'intersezione di un cilindro e un piano; devi calcolare $\\oint_\\Gamma F\\cdot d\\ell$ con $F=(x^2y,\\,y^2z,\\,xz)$, $\\Gamma$ antioraria vista dall'alto. Prima mossa?","opts":[{"x":"Applicare Stokes prendendo come $\\Sigma$ la porzione di piano $z=1-x-y$ che ha bordo $\\Gamma$: il flusso di $\\nabla\\times F$ e' piu' maneggevole del conto diretto su $\\Gamma$.","c":true},{"x":"Parametrizzare $\\Gamma$ e integrare $F$ direttamente: e' l'unica via."},{"x":"Usare il teorema della divergenza sul volume del cilindro."}],"hint":"Quando il bordo e' dato come intersezione di due superfici, la superficie 'naturale' e' la porzione di piano che il cilindro ritaglia.","sol":"Teorema di Stokes: $\\oint_\\Gamma F\\cdot d\\ell=\\iint_\\Sigma(\\nabla\\times F)\\cdot n\\,dS$. Il bordo $\\Gamma$ e' la frontiera della porzione di piano $\\Sigma:\\,z=1-x-y$ sopra $D=\\{x^2+y^2\\le8\\}$; si integra su $\\Sigma$."},{"t":"Calcola $\\nabla\\times F$ per $F=(x^2y,\\,y^2z,\\,xz)$.","opts":[{"x":"$(-y^2,\\,-z,\\,-x^2)$","c":true},{"x":"$(2xy,\\,2yz,\\,z)$"},{"x":"$(0,0,0)$"}],"hint":"Componente per componente: $(\\partial_yF_3-\\partial_zF_2,\\ \\partial_zF_1-\\partial_xF_3,\\ \\partial_xF_2-\\partial_yF_1)$.","sol":"$\\partial_y(xz)-\\partial_z(y^2z)=-y^2$; $\\partial_z(x^2y)-\\partial_x(xz)=-z$; $\\partial_x(y^2z)-\\partial_y(x^2y)=-x^2$. Quindi $\\nabla\\times F=(-y^2,-z,-x^2)$."},{"t":"$\\Sigma:\\ z=1-x-y$ su $D=\\{x^2+y^2\\le8\\}$, orientata verso l'alto. Quale vettore rimpiazza $n\\,dS$ nell'integrale?","opts":[{"x":"$X_x\\times X_y=(-f_x,-f_y,1)=(1,1,1)$, moltiplicato per $dx\\,dy$.","c":true},{"x":"$(-1,-1,1)\\,dx\\,dy$."},{"x":"il versore $\\tfrac{(1,1,1)}{\\sqrt3}$ moltiplicato per $dx\\,dy$ (senza jacobiano)."}],"hint":"Per una superficie cartesiana $z=f(x,y)$ il vettore $n\\,dS$ e' $(-f_x,-f_y,1)\\,dx\\,dy$: gia' comprende lo jacobiano.","sol":"Elemento orientato: $n\\,dS=(X_x\\times X_y)\\,dx\\,dy=(-f_x,-f_y,1)\\,dx\\,dy$. Con $f=1-x-y$, $f_x=f_y=-1$, quindi $(1,1,1)\\,dx\\,dy$. La terza componente $+1$ conferma la normale verso l'alto."},{"t":"L'integrando $(\\nabla\\times F)\\cdot(1,1,1)$ ristretto a $\\Sigma$ (dove $z=1-x-y$) vale:","opts":[{"x":"$-(x^2+y^2+z)=-(x^2+y^2+1-x-y)$","c":true},{"x":"$x^2+y^2+z$"},{"x":"$-(x^2+y^2)$"}],"hint":"$(-y^2,-z,-x^2)\\cdot(1,1,1)=-y^2-z-x^2$; poi sostituisci $z$.","sol":"$(-y^2-z-x^2)=-(x^2+y^2+z)$; su $\\Sigma$, $z=1-x-y$, quindi $-(x^2+y^2+1-x-y)$."},{"t":"$\\displaystyle\\iint_D -(x^2+y^2+1-x-y)\\,dx\\,dy$ su $D=\\{x^2+y^2\\le8\\}$, in polari, vale:","opts":[{"x":"$-40\\pi$","c":true},{"x":"$-20\\pi$"},{"x":"$40\\pi$"}],"hint":"I termini lineari $-x$ e $-y$ hanno integrale nullo sul disco per simmetria: restano $x^2+y^2$ e $1$.","sol":"In polari $\\iint_D(x^2+y^2+1)\\,dA=2\\pi\\int_0^{\\sqrt8}(\\rho^2+1)\\rho\\,d\\rho=2\\pi\\big[\\tfrac{\\rho^4}{4}+\\tfrac{\\rho^2}{2}\\big]_0^{\\sqrt8}=2\\pi(16+4)=40\\pi$; col segno meno, $-40\\pi$ (i termini $-x-y$ danno $0$). Concorda con la stampa ufficiale ($-40\\pi$)."},{"t":"Il testo chiede $\\Gamma$ 'antioraria vista dall'alto'. Il segno $-40\\pi$ e' coerente con la normale $(1,1,1)$ scelta?","opts":[{"x":"Si': 'antiorario visto dall'alto' corrisponde alla normale con terza componente $>0$ (mano destra), quindi nessun cambio di segno.","c":true},{"x":"No, va corretto in $+40\\pi$."},{"x":"Il segno e' irrilevante, e' una circuitazione."}],"hint":"Bordo antiorario dall'alto e normale verso l'alto sono la coppia coerente della regola della mano destra.","sol":"Orientazione coerente (mano destra): bordo antiorario visto dall'alto $\\Leftrightarrow$ $n$ con terza componente positiva. La scelta $(1,1,1)$ (terza comp. $+1$) e' quella giusta, il risultato $-40\\pi$ va preso col suo segno."}]},{"pool":"stokes","src":"20220124 Es.4 · circuitazione, campo con denominatore","steps":[{"t":"$F=\\big(\\tfrac{x}{x^2+y^2+z^2+4}+x^2-z^2,\\ \\dots\\big)$ e $\\gamma:\\,z=x+3y+4,\\ x^2+y^2=4$. Il denominatore preoccupa: qual e' la mossa corretta?","opts":[{"x":"Notare che $x^2+y^2+z^2+4\\ge4>0$ ovunque: $F\\in C^1(\\mathbb{R}^3)$, nessuna singolarita', Stokes si applica.","c":true},{"x":"Il campo e' singolare nell'origine, quindi Stokes non vale."},{"x":"Bisogna escludere una pallina attorno all'origine."}],"hint":"Dove si annulla $x^2+y^2+z^2+4$? Mai. Il $+4$ toglie ogni singolarita'.","sol":"Ipotesi di Stokes: $F\\in C^1$ su un aperto contenente la superficie. Qui il denominatore $\\ge4$, dunque $F$ e' liscio ovunque e il teorema si applica senza precauzioni."},{"t":"La parte radiale $\\tfrac{(x,y,z)}{x^2+y^2+z^2+4}$ e' un gradiente (rotore nullo). Sommando la parte polinomiale, $\\nabla\\times F$ risulta:","opts":[{"x":"$(-1,\\ 2(x-z),\\ 0)$","c":true},{"x":"$(0,0,0)$"},{"x":"$(2x,\\ -2z,\\ 1)$"}],"hint":"La parte radiale e' $\\nabla\\big(\\tfrac12\\ln(x^2+y^2+z^2+4)\\big)$, rotore nullo: conta solo la parte polinomiale.","sol":"$\\nabla\\times(\\nabla U)=0$ elimina la parte radiale. Sulla parte polinomiale $(x^2-z^2,\\,y^2+z,\\,-x^2+z^2)$: $\\partial_y(-x^2+z^2)-\\partial_z(y^2+z)=-1$; $\\partial_z(x^2-z^2)-\\partial_x(-x^2+z^2)=-2z+2x=2(x-z)$; $\\partial_x(y^2+z)-\\partial_y(x^2-z^2)=0$. Quindi $(-1,2(x-z),0)$."},{"t":"Superficie $\\Sigma:\\,z=x+3y+4$ su $D=\\{x^2+y^2\\le4\\}$. Il vettore $X_x\\times X_y$ e':","opts":[{"x":"$(-f_x,-f_y,1)=(-1,-3,1)$","c":true},{"x":"$(1,3,1)$"},{"x":"$(-1,-3,-1)$"}],"hint":"$f=x+3y+4$, quindi $f_x=1$, $f_y=3$.","sol":"Per $z=f(x,y)$: $X_x\\times X_y=(-f_x,-f_y,1)=(-1,-3,1)$, terza componente $+1$ (verso l'alto)."},{"t":"L'integrando $(\\nabla\\times F)\\cdot(-1,-3,1)$ ristretto a $\\Sigma$ (dove $x-z=-3y-4$) vale:","opts":[{"x":"$25+18y$","c":true},{"x":"$1-6x$"},{"x":"$25-18y$"}],"hint":"$(-1,2(x-z),0)\\cdot(-1,-3,1)=1-6(x-z)$; poi sostituisci $x-z$ dalla equazione del piano.","sol":"$(-1)(-1)+2(x-z)(-3)+0=1-6(x-z)$. Su $\\Sigma$: $x-z=x-(x+3y+4)=-3y-4$, quindi $1-6(-3y-4)=1+18y+24=25+18y$."},{"t":"$\\displaystyle\\iint_D(25+18y)\\,dx\\,dy$ su $D=\\{x^2+y^2\\le4\\}$ (area $4\\pi$) vale:","opts":[{"x":"$100\\pi$","c":true},{"x":"$25\\pi$"},{"x":"$0$"}],"hint":"$\\iint_D y\\,dA=0$ per simmetria; resta $25\\cdot\\text{area}(D)$.","sol":"$\\iint_D 18y\\,dA=0$ (simmetria); $\\iint_D 25\\,dA=25\\cdot4\\pi=100\\pi$. Concorda con la stampa ufficiale ($100\\pi$)."}]},{"pool":"stokes","src":"20230123 Es.3 · Stokes su superficie curva (spicchio di sfera)","steps":[{"t":"$F=(y^2-x,\\,2xy,\\,-xz-x)$, $\\Sigma=\\{x^2+y^2+z^2=9,\\ x\\ge0,\\ y\\ge0\\}$ (spicchio di sfera). Il bordo sono DUE semicirconferenze. Conviene il conto diretto o Stokes?","opts":[{"x":"Stokes: il bordo diretto sarebbe la somma di due integrali su semicirconferenze; il flusso di $\\nabla\\times F$ su $\\Sigma$ e' un solo integrale.","c":true},{"x":"Diretto: un solo integrale sulla curva."},{"x":"Gauss, perche' la superficie e' sferica."}],"hint":"Conta i pezzi del bordo: due archi contro una sola superficie.","sol":"Teorema di Stokes: $\\oint_{\\partial\\Sigma}F\\cdot d\\ell=\\iint_\\Sigma(\\nabla\\times F)\\cdot n\\,dS$. Con bordo spezzato in due archi, il membro-flusso e' operativamente piu' semplice."},{"t":"Calcola $\\nabla\\times F$ per $F=(y^2-x,\\,2xy,\\,-xz-x)$.","opts":[{"x":"$(0,\\,1+z,\\,0)$","c":true},{"x":"$(0,\\,z,\\,0)$"},{"x":"$(1+z,\\,0,\\,0)$"}],"hint":"Solo la seconda componente sopravvive: $\\partial_zF_1-\\partial_xF_3$.","sol":"$\\partial_y(-xz-x)-\\partial_z(2xy)=0$; $\\partial_z(y^2-x)-\\partial_x(-xz-x)=0-(-z-1)=z+1$; $\\partial_x(2xy)-\\partial_y(y^2-x)=2y-2y=0$. Quindi $(0,1+z,0)$."},{"t":"Parametrizzando la sfera di raggio 3, $r_\\varphi\\times r_\\theta=(9\\sin^2\\varphi\\cos\\theta,\\,9\\sin^2\\varphi\\sin\\theta,\\,9\\cos\\varphi\\sin\\varphi)$. Perche' questo e' gia' il verso della normale USCENTE?","opts":[{"x":"Perche' la sua terza componente ha lo stesso segno di $z=3\\cos\\varphi$, cioe' punta verso l'esterno della sfera (radialmente).","c":true},{"x":"Perche' ha modulo 9."},{"x":"Perche' e' ortogonale all'asse $z$."}],"hint":"Per una sfera la normale uscente e' radiale: $r_\\varphi\\times r_\\theta$ deve avere componente $z$ con lo stesso segno di $z$.","sol":"$\\mathrm{sgn}(\\cos\\varphi\\sin\\varphi)=\\mathrm{sgn}(\\cos\\varphi)=\\mathrm{sgn}(z)$ (con $\\sin\\varphi\\ge0$): la normale e' radiale-uscente, coerente con l'orientazione richiesta."},{"t":"L'integrando $(\\nabla\\times F)\\cdot(r_\\varphi\\times r_\\theta)$, con $z=3\\cos\\varphi$, vale:","opts":[{"x":"$(1+3\\cos\\varphi)\\cdot 9\\sin^2\\varphi\\sin\\theta$","c":true},{"x":"$9\\sin^2\\varphi\\cos\\theta$"},{"x":"$(1+3\\cos\\varphi)\\cdot 9\\cos\\varphi\\sin\\varphi$"}],"hint":"Solo la seconda componente di $\\nabla\\times F$ e' non nulla: la moltiplichi per la seconda componente del prodotto vettoriale.","sol":"$(0,1+z,0)\\cdot(\\dots,9\\sin^2\\varphi\\sin\\theta,\\dots)=(1+z)\\,9\\sin^2\\varphi\\sin\\theta$; con $z=3\\cos\\varphi$, $=(1+3\\cos\\varphi)9\\sin^2\\varphi\\sin\\theta$."},{"t":"$\\displaystyle\\int_0^{\\pi}\\!\\!\\int_0^{\\pi/2}(1+3\\cos\\varphi)\\,9\\sin^2\\varphi\\sin\\theta\\,d\\theta\\,d\\varphi$ vale:","opts":[{"x":"$\\dfrac{9\\pi}{2}$","c":true},{"x":"$9\\pi$"},{"x":"$0$"}],"hint":"Separa: $\\int_0^{\\pi/2}\\sin\\theta\\,d\\theta=1$; $\\int_0^\\pi\\sin^2\\varphi\\,d\\varphi=\\tfrac\\pi2$; $\\int_0^\\pi\\cos\\varphi\\sin^2\\varphi\\,d\\varphi=0$.","sol":"Il termine con $\\cos\\varphi$ si annulla ($\\int_0^\\pi\\cos\\varphi\\sin^2\\varphi\\,d\\varphi=[\\tfrac{\\sin^3\\varphi}{3}]_0^\\pi=0$). Resta $9\\int_0^\\pi\\sin^2\\varphi\\,d\\varphi\\cdot\\int_0^{\\pi/2}\\sin\\theta\\,d\\theta=9\\cdot\\tfrac\\pi2\\cdot1=\\tfrac{9\\pi}{2}$. Concorda con la stampa ufficiale."}]},{"pool":"stokes","src":"20220706 Es.4 · circuitazione con parametro $a$","steps":[{"t":"$F=(y^2+y+z^2,\\,2xy+x,\\,2axz)$, $\\gamma:\\,z=4x+y+1,\\ x^2+y^2=1$. Calcola $\\nabla\\times F$.","opts":[{"x":"$(0,\\ 2z-2az,\\ 0)=(0,\\ 2z(1-a),\\ 0)$","c":true},{"x":"$(0,\\ 2z,\\ 0)$"},{"x":"$(2z-2az,\\ 0,\\ 0)$"}],"hint":"La componente non banale e' $\\partial_zF_1-\\partial_xF_3=2z-2az$.","sol":"$\\partial_y(2axz)-\\partial_z(2xy+x)=0$; $\\partial_z(y^2+y+z^2)-\\partial_x(2axz)=2z-2az$; $\\partial_x(2xy+x)-\\partial_y(y^2+y+z^2)=(2y+1)-(2y+1)=0$. Quindi $(0,2z(1-a),0)$."},{"t":"Caso $a=1$: il rotore diventa $(0,0,0)$. Quanto vale la circuitazione lungo $\\gamma$?","opts":[{"x":"$0$: $F$ e' irrotazionale su $\\mathbb{R}^3$ (semplicemente connesso), quindi conservativo, e $\\oint$ su curva chiusa e' nulla.","c":true},{"x":"$2\\pi$, indipendente da tutto."},{"x":"Non determinabile senza integrare."}],"hint":"Rotore nullo su un dominio semplicemente connesso: che tipo di campo e'?","sol":"Lemma di Poincare': $\\nabla\\times F=0$ su $\\mathbb{R}^3$ semplicemente connesso $\\Rightarrow F$ conservativo $\\Rightarrow\\oint_\\gamma F\\cdot d\\ell=0$ per ogni curva chiusa."},{"t":"Caso $a\\neq1$: usi Stokes con $\\Sigma:\\,z=4x+y+1$ su $D=\\{x^2+y^2\\le1\\}$. Il vettore $X_x\\times X_y$ e':","opts":[{"x":"$(-4,-1,1)$","c":true},{"x":"$(4,1,1)$"},{"x":"$(-4,-1,-1)$"}],"hint":"$f=4x+y+1\\Rightarrow f_x=4,\\ f_y=1$; poi $(-f_x,-f_y,1)$.","sol":"$X_x\\times X_y=(-f_x,-f_y,1)=(-4,-1,1)$, terza componente $+1$ per l'orientazione antioraria vista dall'alto."},{"t":"L'integrando $(\\nabla\\times F)\\cdot(-4,-1,1)$ ristretto a $\\Sigma$ vale:","opts":[{"x":"$(2a-2)(4x+y+1)$","c":true},{"x":"$(2-2a)(4x+y+1)$"},{"x":"$-(4x+y+1)$"}],"hint":"$(0,2z-2az,0)\\cdot(-4,-1,1)=-(2z-2az)$; poi sostituisci $z=4x+y+1$.","sol":"$-(2z-2az)=(2a-2)z$; su $\\Sigma$, $z=4x+y+1$, quindi $(2a-2)(4x+y+1)$."},{"t":"$\\displaystyle\\iint_D(2a-2)(4x+y+1)\\,dx\\,dy$ su $D=\\{x^2+y^2\\le1\\}$ vale, e il caso $a=1$ e' coerente col passo 2?","opts":[{"x":"$2(a-1)\\pi$; e per $a=1$ da' $0$, coerente con la circuitazione nulla del campo conservativo.","c":true},{"x":"$2(a-1)\\pi$, ma per $a=1$ da' $2\\pi$, in contraddizione."},{"x":"$(a-1)\\pi$."}],"hint":"$\\iint_D 4x\\,dA=\\iint_D y\\,dA=0$; resta $(2a-2)\\cdot\\text{area}(D)$ con area $\\pi$. Poi verifica il limite $a\\to1$.","sol":"$\\iint_D(4x+y+1)\\,dA=0+0+\\pi=\\pi$, quindi $(2a-2)\\pi=2(a-1)\\pi$. Per $a=1$ vale $0$: consistente con il passo 2 (campo conservativo). Concorda con la stampa ufficiale."}]},{"pool":"stokes","src":"tipo verifica incrociata (diretto vs Stokes) · manuale","steps":[{"t":"Verifica il teorema di Stokes calcolando ENTRAMBI i membri per $F=(-y,x,0)$, $\\gamma$: cerchio di raggio $R$ nel piano $z=0$, antiorario. Membro sinistro (conto DIRETTO sul bordo): quanto vale $\\oint_\\gamma F\\cdot d\\ell$?","opts":[{"x":"$2\\pi R^2$","c":true},{"x":"$2\\pi$"},{"x":"$\\pi R^2$"}],"hint":"Parametrizza $\\gamma(t)=(R\\cos t,R\\sin t,0)$ e calcola $F(\\gamma)\\cdot\\gamma'(t)$.","sol":"$\\gamma'(t)=(-R\\sin t,R\\cos t,0)$, $F(\\gamma)=(-R\\sin t,R\\cos t,0)$, $F\\cdot\\gamma'=R^2\\sin^2t+R^2\\cos^2t=R^2$. $\\oint=\\int_0^{2\\pi}R^2\\,dt=2\\pi R^2$."},{"t":"Membro destro: calcola $\\nabla\\times F$ per $F=(-y,x,0)$.","opts":[{"x":"$(0,0,2)$","c":true},{"x":"$(0,0,0)$"},{"x":"$(0,0,1)$"}],"hint":"Solo la componente $z$: $\\partial_x(x)-\\partial_y(-y)$.","sol":"$\\partial_x F_2-\\partial_y F_1=1-(-1)=2$, le altre nulle: $\\nabla\\times F=(0,0,2)$."},{"t":"Flusso del rotore attraverso il disco $D=\\{x^2+y^2\\le R^2,\\ z=0\\}$ con $n=(0,0,1)$:","opts":[{"x":"$2\\pi R^2$","c":true},{"x":"$2\\pi$"},{"x":"$4\\pi R^2$"}],"hint":"Rotore costante: flusso $=$ (terza componente)$\\times$area del disco.","sol":"$\\iint_D(0,0,2)\\cdot(0,0,1)\\,dS=2\\cdot\\text{area}(D)=2\\cdot\\pi R^2=2\\pi R^2$."},{"t":"Confronto: i due membri sono $2\\pi R^2$ e $2\\pi R^2$. Cosa hai verificato?","opts":[{"x":"Coincidono: Stokes e' confermato su questo esempio, e il conto diretto e' un controllo indipendente del flusso del rotore.","c":true},{"x":"Nulla, e' una coincidenza."},{"x":"Che $F$ e' conservativo."}],"hint":"La verifica incrociata serve proprio a questo: due strade, stesso numero.","sol":"Teorema di Stokes verificato: $\\oint_\\gamma F\\cdot d\\ell=\\iint_D(\\nabla\\times F)\\cdot n\\,dS=2\\pi R^2$. ($F$ non e' conservativo: $\\nabla\\times F\\ne0$.)"},{"t":"Se percorressi $\\gamma$ in senso ORARIO tenendo $n=(0,0,1)$, cosa succede alla verifica?","opts":[{"x":"Il diretto darebbe $-2\\pi R^2$: per riallineare i due membri si deve invertire anche la normale a $(0,0,-1)$.","c":true},{"x":"Nulla, entrambi restano $2\\pi R^2$."},{"x":"Il flusso diventa $-2\\pi R^2$ automaticamente."}],"hint":"Cambiare il verso del bordo cambia segno alla circuitazione; per la coerenza di Stokes anche $n$ deve cambiare segno.","sol":"Orientazione coerente (mano destra): invertire $\\gamma$ da' $\\oint=-2\\pi R^2$, e l'uguaglianza di Stokes si mantiene solo con $n=(0,0,-1)$, che da' flusso $-2\\pi R^2$."}]},{"pool":"stokes","src":"tipo cambio di superficie a bordo fissato · manuale","steps":[{"t":"Due superfici $S_1,S_2$ (orientate coerentemente) hanno lo STESSO bordo $\\gamma$. Cosa puoi dire di $\\iint_{S_i}(\\nabla\\times F)\\cdot n\\,dS$?","opts":[{"x":"Sono uguali: dipendono solo dal bordo, quindi conviene scegliere la superficie piu' comoda.","c":true},{"x":"Dipendono dalla forma della superficie."},{"x":"Sono sempre opposti."}],"hint":"Entrambi valgono $\\oint_\\gamma F\\cdot d\\ell$: il bordo e' lo stesso.","sol":"Per Stokes, $\\iint_{S_i}(\\nabla\\times F)\\cdot n\\,dS=\\oint_\\gamma F\\cdot d\\ell$, indipendente da $S_i$. E' il trucco che all'esame fa risparmiare: si sostituisce la superficie difficile con una facile a bordo fissato."},{"t":"Qual e' la ragione profonda di questa indipendenza?","opts":[{"x":"$\\nabla\\cdot(\\nabla\\times F)=0$: $\\nabla\\times F$ e' solenoidale, e $S_1\\cup S_2$ racchiude un volume; per il teorema della divergenza la differenza dei flussi e' nulla.","c":true},{"x":"Perche' il rotore e' sempre costante."},{"x":"Perche' le due superfici hanno la stessa area."}],"hint":"Chiudi le due superfici in una superficie chiusa e applica Gauss al campo $\\nabla\\times F$.","sol":"$S_1\\cup(-S_2)$ e' chiusa e racchiude $V$: $\\iint(\\nabla\\times F)\\cdot n\\,dS=\\iiint_V\\nabla\\cdot(\\nabla\\times F)\\,dV=0$ perche' $\\nabla\\cdot(\\nabla\\times F)\\equiv0$. Quindi i due flussi coincidono."},{"t":"Esempio: $\\gamma$ = cerchio unitario nel piano $z=0$, $F=(-y,x,0)$ ($\\nabla\\times F=(0,0,2)$). Flusso attraverso il DISCO piatto $z=0$ con $n=(0,0,1)$:","opts":[{"x":"$2\\pi$","c":true},{"x":"$\\pi$"},{"x":"$4\\pi$"}],"hint":"Rotore costante $\\times$ area del disco unitario.","sol":"$\\iint_D(0,0,2)\\cdot(0,0,1)\\,dS=2\\cdot\\pi\\cdot1^2=2\\pi$."},{"t":"Ora la SEMISFERA superiore $z=\\sqrt{1-x^2-y^2}$ ha lo stesso bordo $\\gamma$. Flusso di $\\nabla\\times F$ attraverso di essa (normale verso l'alto)?","opts":[{"x":"$2\\pi$, uguale al disco: $X_x\\times X_y=(-f_x,-f_y,1)$ e $(0,0,2)\\cdot(-f_x,-f_y,1)=2$, quindi $\\iint_D 2\\,dx\\,dy=2\\pi$.","c":true},{"x":"Cambia perche' la semisfera ha area maggiore."},{"x":"$4\\pi$, il doppio."}],"hint":"Non serve nemmeno il conto: bordo uguale $\\Rightarrow$ flusso uguale. Ma verificalo col vettore $(-f_x,-f_y,1)$.","sol":"$(0,0,2)\\cdot(-f_x,-f_y,1)=2$ per ogni $f$; $\\iint_D 2\\,dx\\,dy=2\\cdot\\text{area}(D)=2\\pi$. Conferma il principio: all'esame usa il disco, non la semisfera."},{"t":"Morale operativa (modus operandi) del cambio di superficie:","opts":[{"x":"Quando la superficie assegnata e' scomoda, sostituiscila con la piu' semplice che ha lo stesso bordo (tipicamente una porzione di piano o un disco).","c":true},{"x":"Bisogna sempre usare la superficie assegnata nel testo."},{"x":"Conviene sempre la superficie di area minima."}],"hint":"Il bordo comanda, la superficie e' una scelta libera.","sol":"Corollario di Stokes: il flusso di $\\nabla\\times F$ dipende solo da $\\partial S$. Strategia d'esame: rimpiazzare $S$ con la superficie a bordo uguale che rende il conto banale."}]},{"pool":"stokes","src":"tipo Green nel piano · manuale","steps":[{"t":"Calcola $\\oint_{\\partial R}F\\cdot d\\ell$ con $F=(xy,\\,x^2)$ e $R=[0,1]\\times[0,1]$, percorso antiorario, usando Green.","opts":[{"x":"Imposto $\\oint_{\\partial R}=\\iint_R(\\partial_x F_2-\\partial_y F_1)\\,dx\\,dy=\\iint_R(2x-x)\\,dx\\,dy$.","c":true},{"x":"$\\iint_R(\\partial_x F_1-\\partial_y F_2)\\,dx\\,dy$."},{"x":"$\\iint_R(2x+x)\\,dx\\,dy$."}],"hint":"Green nel piano usa $\\partial_x F_2-\\partial_y F_1$, cioe' la terza componente del rotore.","sol":"Teorema di Green: $\\oint_{\\partial R}F\\cdot d\\ell=\\iint_R(\\partial_x F_2-\\partial_y F_1)\\,dA$. Qui $\\partial_x(x^2)=2x$, $\\partial_y(xy)=x$, integrando $2x-x=x$."},{"t":"Completa: $\\displaystyle\\iint_{[0,1]^2}x\\,dx\\,dy=$","opts":[{"x":"$\\dfrac12$","c":true},{"x":"$1$"},{"x":"$\\dfrac14$"}],"hint":"$\\int_0^1 x\\,dx=\\tfrac12$, poi $\\int_0^1 dy=1$.","sol":"$\\int_0^1\\!\\!\\int_0^1 x\\,dx\\,dy=\\big(\\int_0^1 x\\,dx\\big)\\big(\\int_0^1 dy\\big)=\\tfrac12\\cdot1=\\tfrac12$. Green come caso planare di Stokes."}]},{"pool":"stokes","src":"tipo bordo multi-componente (corona) · manuale","steps":[{"t":"$S$ = corona $\\{1\\le x^2+y^2\\le4,\\ z=0\\}$, $F=(-y,x,0)$ ($\\nabla\\times F=(0,0,2)$), $n=(0,0,1)$. Flusso del rotore:","opts":[{"x":"$2\\cdot\\text{area}(S)=2(4\\pi-\\pi)=6\\pi$","c":true},{"x":"$2\\cdot4\\pi=8\\pi$"},{"x":"$2\\pi$"}],"hint":"L'area della corona e' $\\pi(2^2-1^2)$, non quella del disco esterno.","sol":"Rotore costante: flusso $=(\\nabla\\times F)_z\\cdot\\text{area}=2\\cdot(4\\pi-\\pi)=6\\pi$."},{"t":"Verifica sul bordo (due circonferenze). Con $n$ verso l'alto, come vanno orientate e quanto danno?","opts":[{"x":"Esterno ($r=2$) antiorario: $\\oint=2\\cdot4\\pi=8\\pi$; interno ($r=1$) ORARIO: $-2\\pi$; totale $8\\pi-2\\pi=6\\pi$.","c":true},{"x":"Entrambe antiorarie: $8\\pi+2\\pi=10\\pi$."},{"x":"Solo l'esterno conta: $8\\pi$."}],"hint":"La superficie deve restare a sinistra su OGNI componente: il cerchio interno gira al contrario e va SOTTRATTO.","sol":"Con $\\oint_{r}(-y\\,dx+x\\,dy)=2\\cdot\\pi r^2$: esterno $2\\cdot4\\pi=8\\pi$; interno percorso in verso opposto (orario) $-2\\pi$. Somma $6\\pi$, uguale al flusso. L'errore tipico (entrambe antiorarie) darebbe $10\\pi$."}]},{"pool":"stokes","src":"tipo irrotazionale su dominio bucato · manuale","steps":[{"t":"$F=\\dfrac{(-y,\\,x)}{x^2+y^2}$ su $\\mathbb{R}^2\\setminus\\{0\\}$. Verifica: quanto vale $\\partial_x F_2-\\partial_y F_1$?","opts":[{"x":"$0$: $F$ e' irrotazionale (chiuso) fuori dall'origine.","c":true},{"x":"$2$."},{"x":"$\\dfrac{1}{x^2+y^2}$."}],"hint":"Calcola le due derivate: vengono uguali, la differenza si annulla.","sol":"$\\partial_x\\!\\big(\\tfrac{x}{x^2+y^2}\\big)=\\tfrac{y^2-x^2}{(x^2+y^2)^2}$ e $\\partial_y\\!\\big(\\tfrac{-y}{x^2+y^2}\\big)=\\tfrac{y^2-x^2}{(x^2+y^2)^2}$: differenza $0$. Il campo e' chiuso su $\\mathbb{R}^2\\setminus\\{0\\}$."},{"t":"Eppure $\\oint_\\gamma F\\cdot d\\ell$ sul cerchio unitario antiorario vale:","opts":[{"x":"$2\\pi$","c":true},{"x":"$0$"},{"x":"$\\pi$"}],"hint":"Parametrizza $\\gamma(t)=(\\cos t,\\sin t)$: l'integrando si semplifica a $1$.","sol":"$\\gamma(t)=(\\cos t,\\sin t)$, $F(\\gamma)=(-\\sin t,\\cos t)$, $\\gamma'=(-\\sin t,\\cos t)$, $F\\cdot\\gamma'=1$, $\\oint=\\int_0^{2\\pi}1\\,dt=2\\pi$."},{"t":"Perche' circuitazione $\\neq0$ pur essendo $F$ chiuso? Qual e' l'ipotesi che salta?","opts":[{"x":"$\\mathbb{R}^2\\setminus\\{0\\}$ NON e' semplicemente connesso, e $F$ non e' $C^1$ nell'origine racchiusa da $\\gamma$: Stokes/Green non e' applicabile sul disco.","c":true},{"x":"Il calcolo del rotore e' sbagliato."},{"x":"Il campo non e' continuo su $\\gamma$."}],"hint":"Per applicare Green al disco servirebbe $F\\in C^1$ su TUTTO il disco, origine inclusa.","sol":"Criterio del campo conservativo: chiuso $\\Rightarrow$ esatto solo su domini semplicemente connessi (lemma di Poincare'). Qui l'origine e' un buco: il disco racchiuso da $\\gamma$ contiene la singolarita', quindi $\\iint_D(\\nabla\\times F)$ non e' definito e Green non si applica."}]},{"pool":"stokes","src":"tipo flusso di rotore costante (vettore area) · manuale","steps":[{"t":"Se $\\nabla\\times F=c$ e' un vettore COSTANTE, come si semplifica $\\iint_S(\\nabla\\times F)\\cdot n\\,dS$?","opts":[{"x":"$=c\\cdot\\vec A$, dove $\\vec A=\\iint_S n\\,dS$ e' il 'vettore area' di $S$ (per $S$ piana, $\\vec A=\\text{area}\\cdot n$).","c":true},{"x":"$=|c|\\cdot\\text{area}(S)$ sempre."},{"x":"$=0$ perche' $c$ e' costante."}],"hint":"Porta $c$ fuori dall'integrale: resta $\\iint_S n\\,dS$.","sol":"$\\iint_S c\\cdot n\\,dS=c\\cdot\\iint_S n\\,dS=c\\cdot\\vec A$. Per una superficie piana con normale fissa $n$, $\\vec A=\\text{area}(S)\\,n$."},{"t":"Esempio: $\\nabla\\times F=(0,0,2)$, $S$ = regione ellittica piana $z=0$ di semiassi $a,b$ (area $\\pi ab$), $n=(0,0,1)$. Flusso:","opts":[{"x":"$2\\pi ab$","c":true},{"x":"$2\\pi(a+b)$"},{"x":"$\\pi ab$"}],"hint":"$c\\cdot\\vec A=(0,0,2)\\cdot(0,0,\\pi ab)$.","sol":"$\\vec A=(0,0,\\pi ab)$, quindi $(0,0,2)\\cdot(0,0,\\pi ab)=2\\pi ab$. Nessuna parametrizzazione necessaria."}]},{"pool":"stokes","src":"tipo orientazione normale (verso il basso) · manuale","steps":[{"t":"Su $z=f(x,y)$ scegli la normale con terza componente NEGATIVA, cioe' $X_x\\times X_y$ letto come $(f_x,f_y,-1)$. Rispetto alla scelta verso l'alto, la circuitazione:","opts":[{"x":"Cambia segno: e' l'opposto, e il bordo va ora percorso ORARIO visto dall'alto.","c":true},{"x":"Resta invariata."},{"x":"Raddoppia."}],"hint":"Invertire la normale inverte l'orientazione coerente del bordo, quindi il segno della circuitazione.","sol":"Orientazione coerente (mano destra): $n\\to-n$ inverte il verso di $\\partial S$, dunque $\\oint_{\\partial S}F\\cdot d\\ell\\to-\\oint_{\\partial S}F\\cdot d\\ell$. Con $n$ verso il basso il bordo e' orario visto dall'alto."},{"t":"Conseguenza pratica sull'integrale $\\iint_D(\\nabla\\times F)\\cdot(f_x,f_y,-1)\\,dx\\,dy$:","opts":[{"x":"E' l'opposto di $\\iint_D(\\nabla\\times F)\\cdot(-f_x,-f_y,1)\\,dx\\,dy$: basta cambiare tutti i segni del vettore.","c":true},{"x":"E' lo stesso valore assoluto ma con $dx\\,dy$ diverso."},{"x":"Non ha relazione con la scelta verso l'alto."}],"hint":"$(f_x,f_y,-1)=-(-f_x,-f_y,1)$.","sol":"$(f_x,f_y,-1)=-(-f_x,-f_y,1)$, quindi l'integrale cambia segno. Coerente col fatto che si sta calcolando $\\oint$ con l'orientazione opposta del bordo."}]},{"pool":"stokes","src":"tipo Stokes su triangolo · da MIT 18.02SC PS12 · manuale","steps":[{"t":"$F=(z,x,y)$, triangolo di vertici $(1,0,0),(0,1,0),(0,0,1)$ sul piano $x+y+z=1$, normale verso l'esterno. Calcola $\\nabla\\times F$.","opts":[{"x":"$(1,1,1)$","c":true},{"x":"$(0,0,0)$"},{"x":"$(1,-1,1)$"}],"hint":"Ogni componente del rotore da' $1$: $\\partial_y y-\\partial_z x$, ecc.","sol":"$\\partial_y(y)-\\partial_z(x)=1$; $\\partial_z(z)-\\partial_x(y)=1$; $\\partial_x(x)-\\partial_y(z)=1$. Quindi $\\nabla\\times F=(1,1,1)$."},{"t":"Proietti sul piano $z=1-x-y$, con $D$ = triangolo di vertici $(0,0),(1,0),(0,1)$. L'integrando $(\\nabla\\times F)\\cdot(X_x\\times X_y)$ vale:","opts":[{"x":"$3$, perche' $X_x\\times X_y=(1,1,1)$ e $(1,1,1)\\cdot(1,1,1)=3$.","c":true},{"x":"$\\sqrt3$"},{"x":"$1$"}],"hint":"$f=1-x-y\\Rightarrow(-f_x,-f_y,1)=(1,1,1)$.","sol":"$X_x\\times X_y=(-f_x,-f_y,1)=(1,1,1)$; $(1,1,1)\\cdot(1,1,1)=3$, costante su $D$."},{"t":"Circuitazione $=\\iint_D 3\\,dx\\,dy$, con area del triangolo $D$ pari a $\\tfrac12$:","opts":[{"x":"$\\dfrac32$","c":true},{"x":"$3$"},{"x":"$\\dfrac12$"}],"hint":"$3\\times$ area del triangolo unitario nel piano $xy$.","sol":"$\\iint_D 3\\,dA=3\\cdot\\tfrac12=\\tfrac32$. (Alternativa geometrica: rotore costante $\\cdot$ vettore area del triangolo.)"}]},{"pool":"stokes","src":"tipo Stokes su paraboloide (cambio col disco) · da Paul's Online · manuale","steps":[{"t":"$F=(y,-x,z)$, $\\Sigma$ = paraboloide $z=4-x^2-y^2$ con $z\\ge0$, bordo $\\gamma$: cerchio $x^2+y^2=4$ su $z=0$, normale verso l'alto. Mossa piu' rapida?","opts":[{"x":"Sostituire $\\Sigma$ col DISCO piatto $x^2+y^2\\le4$ su $z=0$ (stesso bordo): flusso del rotore identico.","c":true},{"x":"Parametrizzare il paraboloide con coordinate polari e integrare."},{"x":"Usare Gauss sul solido sotto il paraboloide."}],"hint":"Bordo fissato $\\Rightarrow$ flusso del rotore indipendente dalla superficie: scegli il disco.","sol":"Corollario di Stokes (cambio di superficie a bordo fissato): $\\Sigma$ e il disco condividono $\\gamma$, quindi danno lo stesso $\\iint(\\nabla\\times F)\\cdot n\\,dS$. Il disco e' banale."},{"t":"Calcola $\\nabla\\times F$ per $F=(y,-x,z)$.","opts":[{"x":"$(0,0,-2)$","c":true},{"x":"$(0,0,2)$"},{"x":"$(0,0,0)$"}],"hint":"$\\partial_x(-x)-\\partial_y(y)=-1-1$.","sol":"$\\partial_x F_2-\\partial_y F_1=-1-1=-2$, le altre nulle: $\\nabla\\times F=(0,0,-2)$."},{"t":"Flusso attraverso il disco $x^2+y^2\\le4$, $z=0$, $n=(0,0,1)$ (e quindi $\\oint_\\gamma F\\cdot d\\ell$):","opts":[{"x":"$-8\\pi$","c":true},{"x":"$8\\pi$"},{"x":"$-4\\pi$"}],"hint":"Rotore costante $-2$ per l'area del disco di raggio 2 ($4\\pi$).","sol":"$\\iint_D(0,0,-2)\\cdot(0,0,1)\\,dS=-2\\cdot4\\pi=-8\\pi$. Verifica diretta: $\\gamma(t)=(2\\cos t,2\\sin t,0)$ da' $F\\cdot\\gamma'=-4$, $\\oint=-8\\pi$."}]},{"pool":"stokes","src":"tipo modus operandi (riconoscere Stokes) · manuale","steps":[{"t":"Quali segnali in una traccia dicono 'usa Stokes' invece di parametrizzare il bordo?","opts":[{"x":"Il bordo e' dato come intersezione di due superfici (es. cilindro $\\cap$ piano) e/o $\\nabla\\times F$ e' semplice mentre $F$ sul bordo e' complicato.","c":true},{"x":"Il campo e' definito solo lungo la curva."},{"x":"L'integrale richiesto e' triplo."}],"hint":"Curva chiusa + campo scomodo sul bordo + rotore semplice = terreno di Stokes.","sol":"Modus operandi: Stokes conviene quando (i) $\\gamma$ e' chiusa e nasce come $\\{$superficie$\\}\\cap\\{$superficie$\\}$, e (ii) $\\nabla\\times F$ e' piu' maneggevole di $F$ sul bordo. Il conto diretto conviene solo se $\\gamma$ e $F|_\\gamma$ sono entrambi semplici."},{"t":"Riconosciuto il tipo, qual e' il PRIMO passo concreto?","opts":[{"x":"Scegliere la superficie piu' comoda con quel bordo (spesso la porzione di piano) e calcolare $\\nabla\\times F$.","c":true},{"x":"Calcolare subito la lunghezza di $\\gamma$."},{"x":"Verificare che $F$ sia conservativo."}],"hint":"Superficie comoda + rotore: sono i due ingredienti di $\\iint_S(\\nabla\\times F)\\cdot n\\,dS$.","sol":"Ordine operativo: (1) fissa $\\Sigma$ a bordo $\\gamma$ (la porzione di piano ritagliata dal cilindro), (2) calcola $\\nabla\\times F$, (3) scrivi $n\\,dS=(X_u\\times X_v)\\,du\\,dv$, (4) integra su $D$. Verificare se $F$ e' conservativo e' utile solo come scorciatoia (circuitazione $0$)."}]},{"pool":"stokes","src":"tipo caso limite (curva chiusa vs arco) · manuale","steps":[{"t":"Il teorema di Stokes calcola $\\oint$ su una curva CHIUSA. Se $\\gamma$ e' un ARCO aperto, posso usarlo?","opts":[{"x":"No: il bordo di una superficie e' una curva chiusa. Per un arco aperto serve il conto diretto, oppure un potenziale se $F$ e' conservativo.","c":true},{"x":"Si', sempre."},{"x":"Solo se $F$ e' irrotazionale."}],"hint":"Cos'e' $\\partial S$? Sempre una curva chiusa (o unione di curve chiuse).","sol":"Stokes richiede $\\gamma=\\partial S$, che e' chiusa. Per un arco aperto non c'e' superficie di cui sia bordo: si integra direttamente, o si usa $\\int_\\gamma\\nabla U\\cdot d\\ell=U(\\text{fine})-U(\\text{inizio})$ se $F=\\nabla U$."},{"t":"Se $F$ e' conservativo e $\\gamma$ va da $A$ a $B$ (arco aperto), $\\int_\\gamma F\\cdot d\\ell$ vale:","opts":[{"x":"$U(B)-U(A)$, indipendente dal cammino.","c":true},{"x":"$0$, sempre."},{"x":"$\\iint_S(\\nabla\\times F)\\cdot n\\,dS$."}],"hint":"Teorema fondamentale per gli integrali di linea di un gradiente.","sol":"Teorema fondamentale del calcolo per campi conservativi: $\\int_\\gamma\\nabla U\\cdot d\\ell=U(B)-U(A)$. Vale $0$ solo se $A=B$ (curva chiusa)."}]}],"ottim":[{"pool":"ottim","src":"20250116 Es.2 · Weierstrass","steps":[{"t":"Per cercare max e min ASSOLUTI di $f$ continua su $D=\\{3x^2+4y^2\\le 9\\}$, cosa garantisce la loro ESISTENZA prima ancora di calcolarli?","opts":[{"x":"Il teorema di Weierstrass: $D$ è chiuso e limitato (compatto) e $f$ è continua, quindi max e min esistono","c":true},{"x":"Il teorema di Fermat, perché il gradiente si annulla in un punto interno"},{"x":"Nulla: l'esistenza va verificata caso per caso risolvendo il sistema $\\nabla f=0$"},{"x":"Il teorema di Lagrange, perché il dominio ha un bordo"}],"hint":"L'esistenza di max/min assoluti dipende da due proprietà topologiche del dominio più la continuità di $f$, non dal calcolo dei punti critici.","sol":"Teorema di Weierstrass: $f$ continua su un compatto (chiuso e limitato) ammette massimo e minimo assoluti. Verificare la compattezza è il PRIMO passo, prima di cercare candidati interni e di bordo."}]},{"pool":"ottim","src":"tipo D · manuale · Fermat","steps":[{"t":"Sia $f$ differenziabile e $P_0$ un punto INTERNO al dominio. Quale relazione lega \"$P_0$ è di estremo locale\" e \"$\\nabla f(P_0)=0$\"?","opts":[{"x":"$\\nabla f(P_0)=0$ è NECESSARIA (Fermat) ma non sufficiente: un punto critico può essere una sella","c":true},{"x":"$\\nabla f(P_0)=0$ è sufficiente: ogni punto critico è un estremo"},{"x":"Le due condizioni sono equivalenti"},{"x":"$\\nabla f(P_0)=0$ non ha nulla a che vedere con gli estremi interni"}],"hint":"Il gradiente nullo è la porta d'ingresso ai candidati, non la classificazione. Pensa a $f=x^2-y^2$ nell'origine.","sol":"Teorema di Fermat: in un estremo locale interno il gradiente si annulla, quindi $\\nabla f=0$ è NECESSARIA. Non è sufficiente: la sella (es. $x^2-y^2$) ha $\\nabla f=0$ senza essere estremo. Serve un test del secondo ordine (Hessiana)."}]},{"pool":"ottim","src":"20250127 Es.2 · Hessiana","steps":[{"t":"In un punto critico di $f(x,y)$ hai $\\det H>0$ e $f_{xx}>0$. Come lo classifichi?","opts":[{"x":"Minimo locale: $\\det H>0$ dà autovalori concordi, $f_{xx}>0$ dice che sono positivi","c":true},{"x":"Massimo locale"},{"x":"Sella, perché $\\det H\\ne 0$"},{"x":"Non classificabile senza calcolare gli autovalori"}],"hint":"$\\det H=\\lambda_1\\lambda_2$: se è positivo gli autovalori hanno lo stesso segno; $f_{xx}$ (traccia parziale) dice quale.","sol":"Test dell'Hessiana in 2D: $\\det H>0$ e $f_{xx}>0\\Rightarrow$ minimo; $\\det H>0$ e $f_{xx}<0\\Rightarrow$ massimo. Il segno di $f_{xx}$ discrimina solo quando $\\det H>0$."}]},{"pool":"ottim","src":"20250127 Es.2 · sella","steps":[{"t":"In un punto critico si ha $\\det H<0$. Che punto è, e conta il segno di $f_{xx}$?","opts":[{"x":"Sella: $\\det H<0$ dà autovalori di segno opposto; il segno di $f_{xx}$ è irrilevante","c":true},{"x":"Minimo se $f_{xx}>0$, massimo se $f_{xx}<0$"},{"x":"Massimo, sempre"},{"x":"Degenere: il test non decide"}],"hint":"$\\det H<0$ significa $\\lambda_1\\lambda_2<0$: una direzione sale, una scende. Nessun controllo aggiuntivo serve.","sol":"Test dell'Hessiana: $\\det H<0\\Rightarrow$ sella, indipendentemente da $f_{xx}$. Il controllo di $f_{xx}$ serve solo a distinguere min da max nel caso $\\det H>0$."}]},{"pool":"ottim","src":"tipo D · manuale · TRAPPOLA","steps":[{"t":"In un punto critico sai solo che $\\det H>0$. Puoi concludere che è un minimo?","opts":[{"x":"No: $\\det H>0$ dice solo che è un estremo (autovalori concordi); serve il segno di $f_{xx}$ per sapere se min o max","c":true},{"x":"Sì, $\\det H>0$ è sempre un minimo"},{"x":"No, con $\\det H>0$ è sempre una sella"},{"x":"Sì, se il punto è interno al dominio"}],"hint":"Due autovalori NEGATIVI danno lo stesso $\\det H>0$ di due positivi: è un massimo, non un minimo.","sol":"$\\det H>0\\Rightarrow$ autovalori dello stesso segno: minimo se $f_{xx}>0$, massimo se $f_{xx}<0$. Concludere \"minimo\" dal solo $\\det H>0$ è l'errore classico del test dell'Hessiana."}]},{"pool":"ottim","src":"tipo D · manuale · degenere","steps":[{"t":"In un punto critico risulta $\\det H=0$. Cosa dice il test dell'Hessiana?","opts":[{"x":"Nulla: il caso $\\det H=0$ è degenere, il test è inconcludente e serve un'analisi diretta di ordine superiore","c":true},{"x":"È certamente una sella"},{"x":"È certamente un minimo se $f_{xx}\\ge 0$"},{"x":"È un punto di flesso, mai un estremo"}],"hint":"$\\det H=0$ significa almeno un autovalore nullo: la forma quadratica è semidefinita e non decide. Guarda $f$ direttamente lungo le direzioni.","sol":"Con $\\det H=0$ (Hessiana semidefinita) il test fallisce: $f=x^4+y^4$ e $f=x^2-y^4$ hanno entrambe $\\det H=0$ nell'origine ma sono rispettivamente un minimo e una sella. Si studia $f$ direttamente (segno lungo le direzioni, sviluppo di ordine superiore)."}]},{"pool":"ottim","src":"20230504 Es.5 · Lagrange","steps":[{"t":"Sul vincolo $g(x,y)=c$, cosa impone geometricamente la condizione dei moltiplicatori $\\nabla f=\\lambda\\nabla g$?","opts":[{"x":"Che $\\nabla f$ e $\\nabla g$ siano PARALLELI: nel candidato $f$ non ha componente lungo il vincolo","c":true},{"x":"Che $\\nabla f$ e $\\nabla g$ siano ortogonali"},{"x":"Che $\\nabla f=0$ nel candidato"},{"x":"Che $\\nabla g=0$ nel candidato"}],"hint":"Se $\\nabla f$ avesse una componente tangente al vincolo, potresti muoverti sul vincolo e far crescere $f$: non saresti in un estremo.","sol":"Teorema di Lagrange: in un estremo vincolato $\\nabla f=\\lambda\\nabla g$, cioè i gradienti sono paralleli. Equivale a chiedere che la derivata di $f$ lungo il vincolo sia nulla: $\\nabla f$ è tutto normale al vincolo."}]},{"pool":"ottim","src":"20230504 Es.5 · Lagrange 2D","steps":[{"t":"In 2D, la condizione $\\nabla f=\\lambda\\nabla g$ si riscrive senza il moltiplicatore come:","opts":[{"x":"$f_x\\,g_y-f_y\\,g_x=0$: annullamento del minore $2\\times 2$ (gradienti paralleli)","c":true},{"x":"$\\nabla f\\cdot\\nabla g=0$: prodotto scalare nullo"},{"x":"$f_x+f_y=g_x+g_y$"},{"x":"$f_x g_x+f_y g_y=\\lambda$"}],"hint":"Paralleli $\\iff$ determinante dei due vettori nullo. Il prodotto scalare nullo è ortogonalità, l'opposto.","sol":"$\\nabla f\\parallel\\nabla g\\iff\\det\\begin{pmatrix}f_x&f_y\\\\g_x&g_y\\end{pmatrix}=f_xg_y-f_yg_x=0$. Insieme a $g=c$ dà il sistema per i candidati di bordo, eliminando $\\lambda$."}]},{"pool":"ottim","src":"tipo D · manuale · necessaria vs sufficiente","steps":[{"t":"Risolvendo il sistema di Lagrange trovi 4 candidati. Cosa sono, di per sé?","opts":[{"x":"Candidati: la condizione è NECESSARIA. Per trovare max e min si confrontano i valori $f$ in tutti","c":true},{"x":"Sono già i punti di massimo e minimo, uno per tipo"},{"x":"Sono selle del vincolo"},{"x":"Vanno scartati se $\\lambda<0$"}],"hint":"Lagrange è come Fermat: dà i CANDIDATI. Il max è il
