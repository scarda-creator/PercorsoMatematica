\\in C^1$ dentro: Green. Se $\\gamma$ chiusa in $\\mathbb{R}^3$: Stokes.","c":true},{"x":"Parametrizzare direttamente è sempre la via più rapida"},{"x":"Usare il teorema della divergenza (Gauss) per ogni integrale di linea"},{"x":"Se $F$ è conservativo l'integrale è sempre $0$, che $\\gamma$ sia chiusa o aperta"}],"hint":"Tre scorciatoie: potenziale (campo conservativo), Green (ciclo in $\\mathbb{R}^2$), Stokes (ciclo in $\\mathbb{R}^3$). Il potenziale dà $0$ solo se la curva è CHIUSA.","sol":"Tabella decisionale del manuale: campo conservativo su cammino aperto $\\to U(B)-U(A)$, su cammino chiuso $\\to 0$; ciclo in $\\mathbb{R}^2$ $\\to$ Green $\\oint=\\iint_D(Q_x-P_y)$; ciclo in $\\mathbb{R}^3$ $\\to$ Stokes $\\oint=\\iint_S\\operatorname{rot}F\\cdot n\\,d\\sigma$. Gauss riguarda i flussi da superfici chiuse, non i lavori. Dire che il conservativo dà sempre $0$ ignora che serve la chiusura."}]},{"pool":"curve","src":"tipo curve · massa I specie","steps":[{"t":"Un filo ha sostegno la semicirconferenza $\\gamma(t)=(\\cos t,\\ \\sin t)$, $t\\in[0,\\pi]$, e densità lineare $\\delta(x,y)=y$. Calcola la massa $m=\\int_\\gamma \\delta\\,ds$.","opts":[{"x":"$2$","c":true},{"x":"$\\pi$"},{"x":"$0$"},{"x":"$\\dfrac{\\pi}{2}$"}],"hint":"$ds=\\|\\gamma'\\|\\,dt$ con $\\|\\gamma'\\|=1$; sostituisci $\\delta=y=\\sin t$ e integra su $[0,\\pi]$.","sol":"Passi: $\\gamma'=(-\\sin t,\\cos t)$, $\\|\\gamma'\\|=1$, quindi $ds=dt$; $\\delta(\\gamma)=\\sin t$. Allora $m=\\int_0^\\pi \\sin t\\,dt=[-\\cos t]_0^\\pi=1-(-1)=2$. Formula della massa (integrale di I specie) $m=\\int_\\gamma\\delta\\,ds$. Rispondere $\\pi$ significa aver integrato $\\delta\\equiv 1$ (la lunghezza) invece di $\\delta=\\sin t$."}]},{"pool":"curve","src":"tipo curve · baricentro I specie","steps":[{"t":"Per un filo OMOGENEO (densità costante) sulla semicirconferenza superiore di raggio $1$, $\\gamma(t)=(\\cos t,\\sin t)$, $t\\in[0,\\pi]$, l'ordinata del baricentro $\\bar y=\\dfrac{\\int_\\gamma y\\,ds}{\\int_\\gamma ds}$ vale:","opts":[{"x":"$\\dfrac{2}{\\pi}$","c":true},{"x":"$\\dfrac{1}{2}$"},{"x":"$\\dfrac{\\pi}{2}$"},{"x":"$1$"}],"hint":"Numeratore $\\int_\\gamma y\\,ds=\\int_0^\\pi \\sin t\\,dt=2$; denominatore = lunghezza della semicirconferenza $=\\pi$.","sol":"Passi: con $\\|\\gamma'\\|=1$, il momento $\\int_\\gamma y\\,ds=\\int_0^\\pi\\sin t\\,dt=2$ e la lunghezza $\\int_\\gamma ds=\\pi$. Quindi $\\bar y=2/\\pi\\approx 0{,}64$, che cade all'interno della semicirconferenza (coerente). Definizione di baricentro $\\bar y=M_x/m$ con integrali di I specie. Per simmetria $\\bar x=0$."}]},{"pool":"curve","src":"tipo curve · lavoro a tratti (II specie)","steps":[{"t":"Calcola il lavoro $\\int_\\gamma F\\cdot d\\ell$ del campo $F=(y,\\ 2x)$ lungo la spezzata da $(0,0)$ a $(1,0)$ a $(1,2)$.","opts":[{"x":"$4$","c":true},{"x":"$2$"},{"x":"$0$"},{"x":"$6$"}],"hint":"Spezza in due tratti. Sul primo (orizzontale, $y=0$) è $dy=0$; sul secondo (verticale, $x=1$) è $dx=0$. Somma i due contributi.","sol":"Curva regolare a tratti: $\\int_\\gamma=\\int_{\\gamma_1}+\\int_{\\gamma_2}$. Tratto 1 $(0,0)\\to(1,0)$: $y=0$, $dy=0$, contributo $\\int F_1\\,dx=\\int y\\,dx=0$. Tratto 2 $(1,0)\\to(1,2)$: $x=1$, $dx=0$, contributo $\\int F_2\\,dy=\\int_0^2 2x\\,dy=\\int_0^2 2\\,dy=4$. Totale $0+4=4$. Il campo non è conservativo ($\\partial_y F_1=1\\ne 2=\\partial_x F_2$), quindi il cammino conta. Dimenticare un tratto porta a $0$."}]},{"pool":"curve","src":"analvett.tex cap.Curve · cardioide","steps":[{"t":"Calcola la lunghezza della cardioide $r=1+\\cos\\theta$, $\\theta\\in[0,2\\pi]$, con $L=\\int_0^{2\\pi}\\sqrt{r^2+r'^2}\\,d\\theta$.","opts":[{"x":"$8$","c":true},{"x":"$2\\pi$"},{"x":"$4$"},{"x":"$4\\pi$"}],"hint":"$r^2+r'^2=2+2\\cos\\theta=4\\cos^2(\\theta/2)$, quindi $\\sqrt{\\cdot}=2\\,|\\cos(\\theta/2)|$: NON dimenticare il modulo.","sol":"Passi: $r'=-\\sin\\theta$; $r^2+r'^2=(1+\\cos\\theta)^2+\\sin^2\\theta=2+2\\cos\\theta=4\\cos^2(\\theta/2)$, dunque $\\sqrt{r^2+r'^2}=2\\,|\\cos(\\theta/2)|$. Poiché $\\cos(\\theta/2)\\ge 0$ su $[0,\\pi]$ e $\\le 0$ su $[\\pi,2\\pi]$, $L=\\int_0^{2\\pi}2\\,|\\cos(\\theta/2)|\\,d\\theta=2\\cdot 4=8$. Formula della lunghezza in polari $ds=\\sqrt{r^2+r'^2}\\,d\\theta$. Togliere il modulo fa cancellare i due semiarchi e dà $0$."}]},{"pool":"curve","src":"tipo curve · spirale (I specie)","steps":[{"t":"Calcola la lunghezza della spirale logaritmica $\\gamma(t)=(e^{-t}\\cos t,\\ e^{-t}\\sin t)$, $t\\in[0,+\\infty)$.","opts":[{"x":"$\\sqrt{2}$","c":true},{"x":"$+\\infty$"},{"x":"$2$"},{"x":"$1$"}],"hint":"$\\|\\gamma'\\|=\\sqrt{2}\\,e^{-t}$; l'integrale improprio $\\int_0^{+\\infty}e^{-t}\\,dt$ converge a $1$.","sol":"Passi: $x'=-e^{-t}(\\cos t+\\sin t)$, $y'=e^{-t}(\\cos t-\\sin t)$, quindi $\\|\\gamma'\\|^2=e^{-2t}[(\\cos t+\\sin t)^2+(\\cos t-\\sin t)^2]=2e^{-2t}$ e $\\|\\gamma'\\|=\\sqrt{2}\\,e^{-t}$. Allora $L=\\int_0^{+\\infty}\\sqrt{2}\\,e^{-t}\\,dt=\\sqrt{2}\\,[-e^{-t}]_0^{+\\infty}=\\sqrt{2}$. La spirale compie infiniti giri attorno all'origine ma ha lunghezza FINITA. Credere che l'esponenziale non pesi porta a $+\\infty$."}]},{"pool":"curve","src":"20230907 Es.2 · scorciatoia con dominio problematico","steps":[{"t":"Calcola $\\oint_\\gamma F\\cdot d\\ell$ con $F=\\left(\\dfrac{-y}{x^2+y^2},\\ \\dfrac{x}{x^2+y^2}\\right)$ lungo il cerchio unitario $\\gamma(t)=(\\cos t,\\sin t)$, $t\\in[0,2\\pi]$ (antiorario).","opts":[{"x":"$2\\pi$","c":true},{"x":"$0$"},{"x":"$-2\\pi$"},{"x":"$\\pi$"}],"hint":"$F$ è irrotazionale, ma il dominio $\\mathbb{R}^2\\setminus\\{0\\}$ ha un buco: NON puoi concludere $\\oint=0$ con la scorciatoia del potenziale. Calcola direttamente sul cerchio.","sol":"Passi: su $\\gamma$ vale $x^2+y^2=1$, quindi $F(\\gamma)=(-\\sin t,\\cos t)$ e $\\gamma'=(-\\sin t,\\cos t)$; $F\\cdot\\gamma'=\\sin^2 t+\\cos^2 t=1$. $\\oint=\\int_0^{2\\pi}1\\,dt=2\\pi$. Sebbene $\\partial_x F_2=\\partial_y F_1$ (irrotazionale), il dominio non è semplicemente connesso: la scorciatoia $U(B)-U(A)$ NON si applica e il risultato è $2\\pi\\ne 0$. Rispondere $0$ 'perché irrotazionale' è la trappola (esame 20230907)."}]},{"pool":"curve","src":"tipo curve · Green come scorciatoia (II specie)","steps":[{"t":"Calcola $\\oint_\\gamma (-y\\,dx+x\\,dy)$ lungo l'ellisse $\\gamma(t)=(a\\cos t,\\ b\\sin t)$, $t\\in[0,2\\pi]$ (antiorario).","opts":[{"x":"$2\\pi ab$","c":true},{"x":"$\\pi ab$"},{"x":"$0$"},{"x":"$2\\pi$"}],"hint":"Calcolo diretto: $-y\\,dx+x\\,dy=(ab\\sin^2 t+ab\\cos^2 t)\\,dt$. Oppure Green: $Q_x-P_y=2$ dà $2\\cdot\\text{Area}$.","sol":"Passi (diretto): $dx=-a\\sin t\\,dt$, $dy=b\\cos t\\,dt$; $-y\\,dx=ab\\sin^2 t\\,dt$, $x\\,dy=ab\\cos^2 t\\,dt$, somma $ab\\,dt$; $\\oint=\\int_0^{2\\pi}ab\\,dt=2\\pi ab$. Verifica con Green: con $P=-y$, $Q=x$, $Q_x-P_y=1-(-1)=2$, quindi $\\oint=\\iint_D 2\\,dx\\,dy=2\\,\\text{Area}(D)=2\\cdot\\pi ab=2\\pi ab$. È la formula dell'area via integrale di linea $\\text{Area}=\\tfrac12\\oint(x\\,dy-y\\,dx)$. Rispondere $\\pi ab$ è l'area, non l'integrale (manca il fattore $2$)."}]},{"pool":"curve","src":"tipo curve · modus operandi (intersezione di superfici)","steps":[{"t":"Una curva è data come intersezione di due superfici, $\\gamma=\\{F(x,y,z)=0\\}\\cap\\{G(x,y,z)=0\\}$ (es. $x^2+y^2=1$ e $z=2x+3$). Qual è la strategia CORRETTA per parametrizzarla?","opts":[{"x":"Parametrizzare la superficie più semplice (di solito quella che fissa una proiezione: cilindro o cono $\\to$ angolo $t$), poi RICAVARE le altre coordinate sostituendo nell'altra equazione","c":true},{"x":"Risolvere il sistema delle due equazioni in forma cartesiana esplicita $y=y(x)$ e $z=z(x)$ e porre $x=t$, sempre"},{"x":"Scegliere tre funzioni $x(t),y(t),z(t)$ a caso e verificare a posteriori che soddisfino entrambe le equazioni"}],"hint":"Il vincolo che 'gira' (cerchio, ellisse, cardioide in una proiezione) suggerisce da solo l'angolo; l'altra equazione è ESPLICITA nella coordinata mancante.","sol":"Metodo standard per curve come intersezione: si parametrizza il vincolo con simmetria di rotazione (cilindro $x^2+y^2=1\\to x=\\cos t,\\ y=\\sin t$) e si usa l'ALTRA equazione, tipicamente esplicita in $z$ ($z=2\\cos t+3$), per la coordinata residua. Porre $x=t$ funziona solo se ENTRAMBE le altre coordinate sono funzioni univoche di $x$, il che quasi mai vale su un cerchio (due valori di $y$ per ogni $x$).","cont":"Perché non porre sempre x=t?"},{"t":"Perché su $x^2+y^2=1$ la scelta $x=t$ NON dà una parametrizzazione regolare dell'intera curva?","opts":[{"x":"Perché a ogni $x\\in(-1,1)$ corrispondono DUE valori $y=\\pm\\sqrt{1-x^2}$: la mappa non è iniettiva e $y'(x)\\to\\infty$ ai poli $x=\\pm1$, dove si perde la regolarità","c":true},{"x":"Perché $x=t$ non è mai una funzione di classe $C^1$"},{"x":"Perché il cerchio non è una curva ma una superficie"}],"hint":"Cosa succede al vettore tangente quando la curva è verticale nel piano $(x,y)$?","sol":"Il grafico $y=\\sqrt{1-x^2}$ copre solo mezza circonferenza e ha derivata infinita in $x=\\pm1$: la parametrizzazione $x=t$ perde regolarità ($\\gamma'$ esplode) e iniettività globale. L'uso dell'angolo $t$ evita entrambe: $\\gamma'(t)=(-\\sin t,\\cos t,\\dots)$ non si annulla mai."}]},{"pool":"curve","src":"tipo curve · sfera ∩ piano (calcolo completo)","steps":[{"t":"Sia $\\gamma$ l'intersezione della sfera $x^2+y^2+z^2=4$ col piano $z=1$. Qual è il sostegno di $\\gamma$?","opts":[{"x":"La circonferenza $x^2+y^2=3$ nel piano $z=1$, di raggio $\\sqrt3$","c":true},{"x":"La circonferenza $x^2+y^2=4$ nel piano $z=1$, di raggio $2$"},{"x":"L'ellisse $x^2+y^2+1=4$ proiettata sul piano $xy$"}],"hint":"Sostituisci $z=1$ NELL'equazione della sfera prima di leggere il raggio. Il raggio della sfera non è il raggio della sezione.","sol":"Sostituendo $z=1$: $x^2+y^2+1=4\\Rightarrow x^2+y^2=3$. È una circonferenza di raggio $\\sqrt3$ (non $2$: il piano non passa per il centro, quindi la sezione è più piccola dell'equatore). Errore tipico: tenere il raggio $2$ della sfera.","cont":"Parametrizza"},{"t":"Una parametrizzazione regolare di $\\gamma$ e la sua lunghezza sono:","opts":[{"x":"$\\gamma(t)=(\\sqrt3\\cos t,\\ \\sqrt3\\sin t,\\ 1)$, $t\\in[0,2\\pi]$; lunghezza $L=2\\pi\\sqrt3$","c":true},{"x":"$\\gamma(t)=(2\\cos t,\\ 2\\sin t,\\ 1)$, $t\\in[0,2\\pi]$; lunghezza $L=4\\pi$"},{"x":"$\\gamma(t)=(\\sqrt3\\cos t,\\ \\sqrt3\\sin t,\\ t)$, $t\\in[0,2\\pi]$; lunghezza $L=2\\pi\\sqrt{3+1}$"}],"hint":"La quota è COSTANTE ($z=1$), quindi $z'(t)=0$: non contribuisce a $\\|\\gamma'\\|$. Il raggio è $\\sqrt3$.","sol":"Con $\\gamma(t)=(\\sqrt3\\cos t,\\sqrt3\\sin t,1)$ si ha $\\gamma'=(-\\sqrt3\\sin t,\\sqrt3\\cos t,0)$, $\\|\\gamma'\\|=\\sqrt3$ costante. Per la definizione di lunghezza $L=\\int_0^{2\\pi}\\|\\gamma'(t)\\|\\,dt=2\\pi\\sqrt3$. Mettere $z=t$ è l'errore: renderebbe la curva un'elica, non la sezione piana."}]},{"pool":"curve","src":"20220706 Es.4 · cilindro∩piano, orientazione (lavoro completo)","steps":[{"t":"Curva $\\gamma$: intersezione del cilindro $x^2+y^2=1$ col piano $z=2x+3$, percorsa in verso ANTIORARIO vista dall'alto. Campo $F=(-y,\\ x,\\ 1)$. La parametrizzazione coerente con l'orientazione richiesta è:","opts":[{"x":"$\\gamma(t)=(\\cos t,\\ \\sin t,\\ 2\\cos t+3)$, $t:0\\to2\\pi$","c":true},{"x":"$\\gamma(t)=(\\cos t,\\ -\\sin t,\\ 2\\cos t+3)$, $t:0\\to2\\pi$"},{"x":"$\\gamma(t)=(\\sin t,\\ \\cos t,\\ 2\\sin t+3)$, $t:0\\to2\\pi$"}],"hint":"'Antiorario vista dall'alto' riguarda solo la proiezione $(x,y)$: deve girare in senso antiorario nel piano $xy$. Quale delle tre lo fa con $t$ crescente?","sol":"La proiezione $(\\cos t,\\sin t)$ con $t$ crescente ruota in senso antiorario (verso positivo standard): è quella richiesta. $(\\cos t,-\\sin t)$ gira in senso orario; $(\\sin t,\\cos t)$ pure orario. La quota si legge dal piano: $z=2x+3=2\\cos t+3$. È il criterio di orientazione delle curve piane.","cont":"Calcola il lavoro"},{"t":"Calcola $\\int_\\gamma F\\cdot d\\ell$ con $F=(-y,x,1)$ lungo quella $\\gamma$.","opts":[{"x":"$2\\pi$","c":true},{"x":"$0$"},{"x":"$-2\\pi$"}],"hint":"Scrivi $F(\\gamma(t))\\cdot\\gamma'(t)$: la terza componente di $F$ è $1$ e $z'(t)=-2\\sin t$, che integrata su un periodo dà $0$; restano i primi due termini.","sol":"$\\gamma'=(-\\sin t,\\cos t,-2\\sin t)$, $F(\\gamma)=(-\\sin t,\\cos t,1)$. Prodotto scalare: $\\sin^2t+\\cos^2t+(1)(-2\\sin t)=1-2\\sin t$. Per la definizione di integrale di II specie $\\int_\\gamma F\\cdot d\\ell=\\int_0^{2\\pi}(1-2\\sin t)\\,dt=2\\pi$ ($\\int_0^{2\\pi}\\sin t\\,dt=0$). Il termine $z$ non contribuisce proprio perché la sua primitiva è periodica."}]},{"pool":"curve","src":"tipo curve · modus operandi (quando conta l'orientazione)","steps":[{"t":"Davanti a un integrale su una curva, come RICONOSCI se l'orientazione (verso di percorrenza) cambia il risultato?","opts":[{"x":"Conta SOLO negli integrali di II specie $\\int_\\gamma F\\cdot d\\ell$ (cambia segno invertendo il verso); negli integrali di I specie $\\int_\\gamma f\\,ds$ NON conta (il risultato è invariante)","c":true},{"x":"Conta in entrambi i tipi allo stesso modo: invertendo il verso cambiano segno sia $\\int f\\,ds$ sia $\\int F\\cdot d\\ell$"},{"x":"Non conta mai: l'integrale su una curva è un numero geometrico indipendente da come la percorri"}],"hint":"$ds=\\|\\gamma'\\|dt>0$ è positivo comunque; $d\\ell=\\gamma'\\,dt$ è un VETTORE che punta nel verso di percorrenza.","sol":"In $\\int_\\gamma f\\,ds$ l'elemento d'arco $ds=\\|\\gamma'\\|dt\\ge0$ è indipendente dal verso, quindi il risultato è invariante per riparametrizzazione (anche invertente). In $\\int_\\gamma F\\cdot d\\ell$ compare il vettore tangente $\\gamma'$: invertendo il verso $\\gamma'\\to-\\gamma'$ e l'integrale cambia SEGNO. È la distinzione fondamentale I specie vs II specie.","cont":"E come fissi il segno?"},{"t":"Il testo chiede il lavoro con $\\gamma$ percorsa 'in verso antiorario' ma la tua parametrizzazione risulta oraria. Cosa fai?","opts":[{"x":"Calcolo con la mia parametrizzazione e CAMBIO segno al risultato finale (oppure inverto il parametro $t\\to-t$ prima di integrare)","c":true},{"x":"Prendo il valore assoluto del risultato, tanto un lavoro è sempre positivo"},{"x":"Il verso non è specificabile: lascio il risultato con doppio segno $\\pm$"}],"hint":"Invertire il verso in un integrale di II specie è un'operazione algebrica esatta, non un'ambiguità.","sol":"$\\int_{-\\gamma}F\\cdot d\\ell=-\\int_{\\gamma}F\\cdot d\\ell$: basta cambiare segno. Il lavoro NON è in generale positivo (può essere negativo), quindi il valore assoluto è sbagliato. Regola: si controlla il verso della propria parametrizzazione e si aggiusta il segno secondo la richiesta."}]},{"pool":"curve","src":"tipo curve · coordinate sferiche (parallelo su sfera)","steps":[{"t":"Su una sfera di raggio $R$ centrata nell'origine, considera il 'parallelo' a quota $z=R/2$. Qual è il raggio di questa circonferenza?","opts":[{"x":"$\\dfrac{R\\sqrt3}{2}$","c":true},{"x":"$R/2$"},{"x":"$R$"}],"hint":"In coordinate sferiche $z=R\\cos\\varphi$ (con $\\varphi$ colatitudine); il raggio del parallelo è $R\\sin\\varphi$. Trova prima $\\varphi$.","sol":"Da $z=R\\cos\\varphi=R/2$ segue $\\cos\\varphi=1/2$, $\\varphi=\\pi/3$, quindi $\\sin\\varphi=\\sqrt3/2$. Il raggio del parallelo (distanza dall'asse $z$) è $\\rho=R\\sin\\varphi=R\\sqrt3/2$. È l'uso diretto della parametrizzazione sferica $x=R\\sin\\varphi\\cos\\theta,\\ y=R\\sin\\varphi\\sin\\theta,\\ z=R\\cos\\varphi$.","cont":"Lunghezza e confronto"},{"t":"La lunghezza di questo parallelo è $L=\\pi R\\sqrt3$. Un MERIDIANO completo (da polo a polo e ritorno, cioè un cerchio massimo) quanto è lungo, e quale dei due è una GEODETICA della sfera?","opts":[{"x":"Il cerchio massimo ha lunghezza $2\\pi R>L$ ed è la geodetica; il parallelo (tranne l'equatore) NON è geodetica","c":true},{"x":"Entrambi lunghi $2\\pi R$; entrambi geodetiche"},{"x":"Il parallelo è più lungo perché sta più in basso; è lui la geodetica"}],"hint":"Le geodetiche della sfera sono i cerchi MASSIMI (raggio $=R$). Un parallelo ha raggio $<R$ salvo l'equatore.","sol":"Il parallelo ha $L=2\\pi\\cdot R\\sqrt3/2=\\pi R\\sqrt3\\approx1.73\\,\\pi R<2\\pi R$. I cerchi massimi (raggio $R$, lunghezza $2\\pi R$) sono le geodetiche della sfera: il cammino più corto tra due punti giace su un cerchio massimo. Aggancio cross-domain: è la stessa nozione di geodetica che in Geometria Differenziale (III anno) e in Relatività Generale governa il moto libero."}]},{"pool":"curve","src":"tipo curve · vettore tangente/normale e curvatura (segno)","steps":[{"t":"Per una curva piana regolare, la curvatura $\\kappa$ misura:","opts":[{"x":"Quanto rapidamente ruota il versore tangente $T$ rispetto alla lunghezza d'arco: $\\kappa=\\|dT/ds\\|$; il versore normale principale $N$ punta verso la concavità (il centro del cerchio osculatore)","c":true},{"x":"La pendenza della curva, cioè $\\kappa=|y'(x)|$"},{"x":"La lunghezza della curva per unità di parametro, $\\kappa=\\|\\gamma'(t)\\|$"}],"hint":"$T$ ha modulo costante $1$: la sua variazione è puramente rotazione. La curvatura è quel tasso di rotazione RISPETTO ALL'ARCO.","sol":"Per definizione la curvatura è $\\kappa=\\|dT/ds\\|$, con $T=\\gamma'/\\|\\gamma'\\|$ e $s$ ascissa curvilinea. Poiché $\\|T\\|=1$, $dT/ds\\perp T$ e definisce il versore normale principale $N=(dT/ds)/\\kappa$, orientato verso la concavità. Pendenza e velocità sono altra cosa.","cont":"Calcolo"},{"t":"Calcola la curvatura della parabola $y=x^2$ nel punto $(0,0)$. (Formula per grafici: $\\kappa=\\dfrac{|y''|}{(1+y'^2)^{3/2}}$.)","opts":[{"x":"$\\kappa=2$","c":true},{"x":"$\\kappa=0$"},{"x":"$\\kappa=1/2$"}],"hint":"In $x=0$ la parabola è orizzontale: $y'(0)=0$. Il denominatore vale $1$.","sol":"$y'=2x\\Rightarrow y'(0)=0$; $y''=2$. Quindi $\\kappa(0)=\\dfrac{|2|}{(1+0)^{3/2}}=2$. Il cerchio osculatore nell'origine ha raggio $1/\\kappa=1/2$ e $N$ punta verso l'alto (concavità), come dev'essere per una parabola aperta verso l'alto. La curvatura NON è zero: $(0,0)$ è il vertice, punto di massima curvatura."}]},{"pool":"curve","src":"tipo curve · astroide, cuspidi e regolarità a tratti","steps":[{"t":"L'astroide $\\gamma(t)=(\\cos^3 t,\\ \\sin^3 t)$, $t\\in[0,2\\pi]$. È una curva REGOLARE su tutto $[0,2\\pi]$?","opts":[{"x":"No: $\\gamma'(t)=0$ per $t=0,\\tfrac\\pi2,\\pi,\\tfrac{3\\pi}2$ (le quattro cuspidi), quindi è solo regolare A TRATTI","c":true},{"x":"Sì, è regolare ovunque perché $\\cos^3 t,\\sin^3 t\\in C^\\infty$"},{"x":"No, non è nemmeno continua nelle cuspidi"}],"hint":"$C^\\infty$ garantisce derivabilità, NON regolarità: regolare significa in più $\\gamma'\\neq0$. Calcola $\\gamma'$ e vedi dove si annulla.","sol":"$\\gamma'(t)=(-3\\cos^2t\\sin t,\\ 3\\sin^2t\\cos t)$ si annulla quando $\\sin t\\cos t=0$, cioè $t=0,\\pi/2,\\pi,3\\pi/2$: nelle quattro cuspidi il vettore tangente svanisce. La curva è continua e $C^\\infty$ ma NON regolare lì; è però regolare a tratti (definizione: regolare su ciascun sotto-intervallo aperto), dunque rettificabile.","cont":"Lunghezza"},{"t":"Calcola la lunghezza totale dell'astroide.","opts":[{"x":"$L=6$","c":true},{"x":"$L=2\\pi$"},{"x":"$L=0$ perché $\\gamma'$ si annulla"}],"hint":"$\\|\\gamma'\\|=3|\\cos t\\sin t|=\\tfrac32|\\sin 2t|$. Attento al valore assoluto: integrando su $[0,2\\pi]$ non puoi ignorarlo.","sol":"$\\|\\gamma'(t)\\|=\\sqrt{9\\cos^4t\\sin^2t+9\\sin^4t\\cos^2t}=3|\\cos t\\sin t|=\\tfrac32|\\sin2t|$. Per la definizione di lunghezza $L=\\int_0^{2\\pi}\\tfrac32|\\sin2t|\\,dt=\\tfrac32\\cdot4=6$ (l'integrale di $|\\sin2t|$ su un periodo pieno vale $4$). Le cuspidi non annullano la lunghezza: sono punti isolati di misura nulla. Dimenticare il valore assoluto dà $0$, che è l'errore."}]},{"pool":"curve","src":"tipo curve · cicloide, un arco (lunghezza completa)","steps":[{"t":"La cicloide $\\gamma(t)=(t-\\sin t,\\ 1-\\cos t)$ descrive un arco per $t\\in[0,2\\pi]$. Il vettore velocità e la sua norma sono:","opts":[{"x":"$\\gamma'=(1-\\cos t,\\ \\sin t)$, con $\\|\\gamma'\\|=\\sqrt{2-2\\cos t}=2\\left|\\sin\\tfrac t2\\right|$","c":true},{"x":"$\\gamma'=(1-\\cos t,\\ \\sin t)$, con $\\|\\gamma'\\|=\\sqrt{2+2\\cos t}$"},{"x":"$\\gamma'=(1,\\ 1)$ costante, con $\\|\\gamma'\\|=\\sqrt2$"}],"hint":"Usa l'identità di bisezione $1-\\cos t=2\\sin^2\\tfrac t2$ per togliere la radice. Su $[0,2\\pi]$, $\\sin\\tfrac t2\\ge0$.","sol":"$\\|\\gamma'\\|^2=(1-\\cos t)^2+\\sin^2t=1-2\\cos t+\\cos^2t+\\sin^2t=2-2\\cos t$. Con $1-\\cos t=2\\sin^2\\tfrac t2$: $\\|\\gamma'\\|=2|\\sin\\tfrac t2|=2\\sin\\tfrac t2$ su $[0,2\\pi]$. È il passo chiave: la formula di bisezione rende l'integrando elementare.","cont":"Lunghezza"},{"t":"Calcola la lunghezza dell'arco di cicloide.","opts":[{"x":"$L=8$","c":true},{"x":"$L=2\\pi$"},{"x":"$L=4\\pi$"}],"hint":"$\\int_0^{2\\pi}2\\sin\\tfrac t2\\,dt$: la primitiva di $\\sin\\tfrac t2$ è $-2\\cos\\tfrac t2$.","sol":"Per la definizione di lunghezza $L=\\int_0^{2\\pi}2\\sin\\tfrac t2\\,dt=2\\left[-2\\cos\\tfrac t2\\right]_0^{2\\pi}=2(-2)(\\cos\\pi-\\cos0)=2(-2)(-2)=8$. Risultato notevole: un arco di cicloide di raggio $1$ è lungo $8$ (quattro volte il diametro), indipendente da $\\pi$."}]},{"pool":"curve","src":"20230210 Es.3 · semiellisse con verso imposto (parametrizzazione e dominio)","steps":[{"t":"Si vuole percorrere la semiellisse $\\Gamma=\\{\\tfrac{x^2}{4}+y^2=1,\\ y\\ge0\\}$ dal punto $(2,0)$ al punto $(-2,0)$. Quale parametrizzazione, con quale dominio, realizza esattamente questo?","opts":[{"x":"$\\gamma(\\varphi)=(2\\cos\\varphi,\\ \\sin\\varphi)$, $\\varphi\\in[0,\\pi]$","c":true},{"x":"$\\gamma(\\varphi)=(2\\cos\\varphi,\\ \\sin\\varphi)$, $\\varphi\\in[0,2\\pi]$"},{"x":"$\\gamma(\\varphi)=(2\\cos\\varphi,\\ -\\sin\\varphi)$, $\\varphi\\in[0,\\pi]$"}],"hint":"Controlla i due estremi ($\\varphi=0$ e $\\varphi=\\pi$) e verifica che il punto intermedio $\\varphi=\\pi/2$ stia nel semipiano $y\\ge0$ richiesto.","sol":"$\\gamma(0)=(2,0)$, $\\gamma(\\pi)=(-2,0)$: estremi corretti. $\\gamma(\\pi/2)=(0,1)$ ha $y>0$, quindi il cammino sta nel semipiano richiesto (verso antiorario). Dominio $[0,2\\pi]$ percorrerebbe l'ELLISSE intera (anche $y<0$), violando $y\\ge0$; il segno $-\\sin\\varphi$ manderebbe la curva in $y\\le0$. La scelta del dominio è parte della parametrizzazione.","cont":"Perché il dominio conta?"},{"t":"Se per distrazione si usasse $\\varphi\\in[0,2\\pi]$ in un integrale di II specie su questa $\\Gamma$, cosa si otterrebbe?","opts":[{"x":"Si integrerebbe sull'INTERA ellisse (curva chiusa), non sulla semiellisse aperta: risultato in generale diverso, e per un campo conservativo darebbe $0$ invece di $U(-2,0)-U(2,0)$","c":true},{"x":"Lo stesso risultato: il tratto $y<0$ si cancella sempre da solo"},{"x":"Il risultato raddoppierebbe esattamente"}],"hint":"Un dominio $[0,2\\pi]$ chiude la curva. Su una curva chiusa l'integrale di un campo conservativo è nullo; su un arco aperto no.","sol":"Estendere a $[0,2\\pi]$ trasforma un arco aperto (da $(2,0)$ a $(-2,0)$) in una curva CHIUSA. Per un campo conservativo $F=\\nabla U$, sull'arco aperto $\\int_\\gamma F\\cdot d\\ell=U(-2,0)-U(2,0)$, mentre sulla chiusa $\\oint=0$: risultati diversi. Il dominio del parametro è tanto essenziale quanto la formula."}]},{"pool":"curve","src":"tipo curve · riparametrizzazione per ascissa curvilinea (calcolo completo)","steps":[{"t":"La retta $\\gamma(t)=(1+2t,\\ 3-t,\\ 2t)$, $t\\ge0$. L'ascissa curvilinea $s(t)=\\int_0^t\\|\\gamma'(\\tau)\\|\\,d\\tau$ vale:","opts":[{"x":"$s(t)=3t$","c":true},{"x":"$s(t)=\\sqrt5\\,t$"},{"x":"$s(t)=t$"}],"hint":"$\\gamma'$ è costante (è una retta): $\\|\\gamma'\\|$ non dipende da $\\tau$, quindi $s(t)=\\|\\gamma'\\|\\,t$.","sol":"$\\gamma'=(2,-1,2)$, $\\|\\gamma'\\|=\\sqrt{4+1+4}=3$. Essendo costante, $s(t)=\\int_0^t3\\,d\\tau=3t$. Ricorda: $\\|\\gamma'\\|$ è la VELOCITÀ scalare, e $s(t)$ la si costruisce da lì per definizione di ascissa curvilinea.","cont":"Riparametrizza"},{"t":"La riparametrizzazione per lunghezza d'arco $\\delta(s)$ (velocità unitaria) è:","opts":[{"x":"$\\delta(s)=\\left(1+\\tfrac{2s}{3},\\ 3-\\tfrac{s}{3},\\ \\tfrac{2s}{3}\\right)$, e $\\|\\delta'(s)\\|=1$","c":true},{"x":"$\\delta(s)=(1+2s,\\ 3-s,\\ 2s)$, e $\\|\\delta'(s)\\|=1$"},{"x":"$\\delta(s)=\\left(1+\\tfrac{2s}{3},\\ 3-\\tfrac{s}{3},\\ \\tfrac{2s}{3}\\right)$, e $\\|\\delta'(s)\\|=3$"}],"hint":"Inverti $s=3t\\Rightarrow t=s/3$ e sostituisci in $\\gamma$. Dopo, $\\|\\delta'\\|$ DEVE valere $1$: è la firma della parametrizzazione d'arco.","sol":"Invertendo $t=s/3$ e sostituendo: $\\delta(s)=\\gamma(s/3)=(1+\\tfrac{2s}{3},3-\\tfrac s3,\\tfrac{2s}3)$. Allora $\\delta'=(\\tfrac23,-\\tfrac13,\\tfrac23)$, $\\|\\delta'\\|=\\sqrt{\\tfrac49+\\tfrac19+\\tfrac49}=\\sqrt{\\tfrac99}=1$. Il teorema di riparametrizzazione per ascissa curvilinea garantisce $\\|\\delta'\\|\\equiv1$: se non torna $1$, l'inversione è sbagliata."}]},{"pool":"curve","src":"tipo curve · integrale di I specie su elica (calcolo completo)","steps":[{"t":"Per l'elica $\\gamma(t)=(\\cos t,\\ \\sin t,\\ t)$, $t\\in[0,2\\pi]$, l'elemento d'arco è:","opts":[{"x":"$ds=\\sqrt2\\,dt$","c":true},{"x":"$ds=dt$"},{"x":"$ds=\\sqrt{1+t^2}\\,dt$"}],"hint":"$\\gamma'=(-\\sin t,\\cos t,1)$: somma i quadrati. Le prime due componenti danno $1$ per l'identità fondamentale.","sol":"$\\|\\gamma'\\|=\\sqrt{\\sin^2t+\\cos^2t+1}=\\sqrt2$, quindi $ds=\\|\\gamma'\\|dt=\\sqrt2\\,dt$. È costante perché l'elica ha velocità scalare uniforme.","cont":"Calcola l'integrale"},{"t":"Calcola $\\int_\\gamma z\\,ds$ (integrale di I specie della funzione $f(x,y,z)=z$).","opts":[{"x":"$2\\sqrt2\\,\\pi^2$","c":true},{"x":"$2\\pi\\sqrt2$"},{"x":"$0$"}],"hint":"Sul sostegno $z=t$, quindi $f(\\gamma(t))=t$. Integra $t\\cdot\\sqrt2$ tra $0$ e $2\\pi$; non è nullo perché $z\\ge0$ lungo l'elica.","sol":"Per la formula dell'integrale di I specie $\\int_\\gamma f\\,ds=\\int_0^{2\\pi}f(\\gamma(t))\\|\\gamma'(t)\\|dt=\\int_0^{2\\pi}t\\cdot\\sqrt2\\,dt=\\sqrt2\\left[\\tfrac{t^2}{2}\\right]_0^{2\\pi}=\\sqrt2\\cdot2\\pi^2=2\\sqrt2\\,\\pi^2$. Non si annulla: a differenza di $\\int F\\cdot d\\ell$, l'integrale di I specie di una funzione positiva è positivo."}]},{"pool":"curve","src":"tipo curve · ellisse, il parametro non è l'angolo polare (trappola)","steps":[{"t":"Nell'ellisse $\\gamma(t)=(a\\cos t,\\ b\\sin t)$ con $a\\ne b$, il parametro $t$ coincide con l'angolo polare $\\theta$ (l'angolo del raggio dall'origine al punto)?","opts":[{"x":"No: in generale $\\tan\\theta=\\dfrac{b\\sin t}{a\\cos t}=\\dfrac ba\\tan t\\neq\\tan t$; $t$ è il parametro (angolo eccentrico), non l'angolo polare","c":true},{"x":"Sì, $t$ è sempre l'angolo polare $\\theta$ del punto sull'ellisse"},{"x":"Sì, ma solo se l'ellisse è percorsa in verso antiorario"}],"hint":"Calcola $\\tan\\theta=y/x$ e confrontalo con $\\tan t$. Coincidono solo se $a=b$ (cerchio).","sol":"L'angolo polare soddisfa $\\tan\\theta=y/x=\\tfrac ba\\tan t$: coincide con $t$ solo per $a=b$. Il parametro $t$ è l'anomalia eccentrica (angolo sul cerchio ausiliario), non la direzione geometrica del punto. Conseguenza pratica: per l'ellisse NON si può usare $ds=\\sqrt{r^2+r'^2}\\,d\\theta$ con $t$ al posto di $\\theta$; si usa $ds=\\|\\gamma'(t)\\|dt$."}]},{"pool":"curve","src":"tipo curve · dominio del parametro su un arco (giustificazione)","steps":[{"t":"Vuoi parametrizzare l'ARCO di parabola $y=x^2$ dal punto $(-1,1)$ al punto $(2,4)$. Qual è la scelta corretta di parametrizzazione e dominio, con la relativa giustificazione?","opts":[{"x":"$\\gamma(t)=(t,\\ t^2)$, $t\\in[-1,2]$: la curva è un grafico, $x=t$ la copre iniettivamente, e gli estremi fissano gli estremi del dominio","c":true},{"x":"$\\gamma(t)=(t,\\ t^2)$, $t\\in[0,2]$: il parametro parte sempre da $0$"},{"x":"$\\gamma(t)=(\\cos t,\\ \\cos^2 t)$, $t\\in[0,2\\pi]$: serve un angolo per ogni curva"}],"hint":"Un arco di grafico si parametrizza con $x=t$; il dominio si LEGGE dagli estremi richiesti, non parte per default da $0$ né da $-\\pi$.","sol":"Per un grafico $y=f(x)$ la parametrizzazione naturale è $\\gamma(t)=(t,f(t))$, regolare ($\\gamma'=(1,2t)\\ne0$) e iniettiva. Il dominio è imposto DAGLI ESTREMI: $x=-1\\to t=-1$, $x=2\\to t=2$, quindi $t\\in[-1,2]$. Partire da $0$ taglierebbe il tratto $[-1,0]$; l'angolo non serve (la curva non è chiusa né gira). Errore d'esame tipico: dominio 'automatico' scollegato dagli estremi del testo."}]},{"pool":"curve","src":"20250127 Es.5 · curva cartesiana in un piano (riconoscimento)","steps":[{"t":"La curva $\\gamma(t)=(1+t^2,\\ t)$, $t\\in[1,2]$, nel piano $(x,z)$ (qui $x=1+t^2$, $z=t$). Come si riconosce subito che è semplice e regolare, senza calcoli lunghi?","opts":[{"x":"È il grafico cartesiano $x=1+z^2$ letto come $z=t$, $x=f(t)$ con $f\\in C^1$: ogni curva cartesiana $t\\mapsto(f(t),t)$ è automaticamente semplice (la componente $z=t$ è iniettiva) e regolare ($\\gamma'=(f'(t),1)\\neq0$ sempre)","c":true},{"x":"Bisogna calcolare $\\gamma'$, verificare che sia $\\neq0$ e poi provare l'iniettività risolvendo $\\gamma(t_1)=\\gamma(t_2)$: non c'è scorciatoia"},{"x":"Non è regolare perché $x=1+t^2$ ha derivata nulla in $t=0$"}],"hint":"Una componente è esattamente $t$. Cosa garantisce ciò su iniettività e su una componente di $\\gamma'$?","sol":"Quando una componente è il parametro stesso ($z=t$), la mappa è iniettiva (a $t$ diversi corrispondono $z$ diversi) $\\Rightarrow$ semplice; e $\\gamma'=(f'(t),1)$ ha la seconda componente $=1\\neq0$ $\\Rightarrow$ non si annulla mai $\\Rightarrow$ regolare, purché $f\\in C^1$. Qui $f(t)=1+t^2\\in C^\\infty$. Nota: $t=0$ è FUORI da $[1,2]$, e comunque $\\gamma'=(2t,1)\\ne0$ anche in $0$. È il criterio 'curva cartesiana' che gli appelli usano per liquidare regolarità e semplicità in una riga."}]},{"pool":"curve","src":"tipo curve · elemento d'arco in coordinate cilindriche (concetto)","steps":[{"t":"Una curva è data in coordinate cilindriche da $r(t),\\ \\theta(t),\\ z(t)$. Qual è l'elemento d'arco corretto $ds$?","opts":[{"x":"$ds=\\sqrt{\\dot r^2+r^2\\dot\\theta^2+\\dot z^2}\\,dt$","c":true},{"x":"$ds=\\sqrt{\\dot r^2+\\dot\\theta^2+\\dot z^2}\\,dt$"},{"x":"$ds=\\sqrt{r^2\\dot r^2+r^2\\dot\\theta^2+\\dot z^2}\\,dt$"}],"hint":"Il termine angolare porta un fattore $r^2$: uno spostamento angolare $d\\theta$ percorre un arco di lunghezza $r\\,d\\theta$, non $d\\theta$.","sol":"Da $x=r\\cos\\theta,\\ y=r\\sin\\theta,\\ z=z$ si ottiene $\\dot x^2+\\dot y^2=\\dot r^2+r^2\\dot\\theta^2$ (i termini misti si cancellano), da cui $ds=\\sqrt{\\dot r^2+r^2\\dot\\theta^2+\\dot z^2}\\,dt$. Il fattore metrico $r^2$ davanti a $\\dot\\theta^2$ è il cuore della faccenda: dimenticarlo è l'errore classico nel passaggio a coordinate non cartesiane. Con $r$ costante si ritrova $ds=\\sqrt{r^2\\dot\\theta^2+\\dot z^2}\\,dt$ dell'elica su cilindro."}]},{"pool":"curve","src":"tipo curve · derivazione di ds in coordinate polari (first principles)","steps":[{"t":"Da dove viene la formula $ds=\\sqrt{r^2+r'^2}\\,d\\theta$ per una curva piana $r=r(\\theta)$ in coordinate polari?","opts":[{"x":"Da $x=r\\cos\\theta,\\ y=r\\sin\\theta$: derivando rispetto a $\\theta$ e sommando i quadrati, i termini misti si cancellano e resta $x'^2+y'^2=r'^2+r^2$","c":true},{"x":"È una definizione data per convenzione, senza derivazione da $x,y$"},{"x":"Da $ds^2=dr^2+d\\theta^2$, cioè trattando $r$ e $\\theta$ come coordinate cartesiane"}],"hint":"Parametrizza con $\\theta$: $x(\\theta)=r(\\theta)\\cos\\theta$. Applica la regola del prodotto e usa $\\cos^2+\\sin^2=1$.","sol":"$x=r\\cos\\theta\\Rightarrow x'=r'\\cos\\theta-r\\sin\\theta$; $y=r\\sin\\theta\\Rightarrow y'=r'\\sin\\theta+r\\cos\\theta$. Allora $x'^2+y'^2=r'^2(\\cos^2+\\sin^2)+r^2(\\sin^2+\\cos^2)+2r'r(-\\cos\\sin+\\sin\\cos)=r'^2+r^2$ (i doppi prodotti si elidono). Quindi $ds=\\sqrt{x'^2+y'^2}\\,d\\theta=\\sqrt{r^2+r'^2}\\,d\\theta$. NON è $\\sqrt{dr^2+d\\theta^2}$: la metrica polare non è euclidea in $(r,\\theta)$, c'è il fattore $r^2$."}]},{"pool":"curve","src":"tipo curve · lavoro su spezzata nello spazio (campo non conservativo)","steps":[{"t":"Campo $F=(z,\\ x,\\ y)$. Prima di calcolare $\\int_\\gamma F\\cdot d\\ell$ su un cammino da $A$ a $B$, verifichi se $F$ è conservativo: cosa trovi?","opts":[{"x":"$\\operatorname{rot}F=(1,1,1)\\neq0$: NON è irrotazionale, quindi non è conservativo e il lavoro DIPENDE dal cammino","c":true},{"x":"$\\operatorname{rot}F=0$: è conservativo, quindi il lavoro dipende solo dagli estremi $A,B$"},{"x":"$\\operatorname{rot}F=(0,0,0)$ ma il dominio è forato, quindi è ambiguo"}],"hint":"$\\operatorname{rot}F=(\\partial_yF_3-\\partial_zF_2,\\ \\partial_zF_1-\\partial_xF_3,\\ \\partial_xF_2-\\partial_yF_1)$. Calcola le sei derivate.","sol":"$\\operatorname{rot}F=(\\partial_y y-\\partial_z x,\\ \\partial_z z-\\partial_x y,\\ \\partial_x x-\\partial_y z)=(1-0,\\ 1-0,\\ 1-0)=(1,1,1)\\neq0$. La condizione necessaria di conservatività (irrotazionalità) FALLISCE, quindi va calcolato esplicitamente sul cammino: nessuna scorciatoia col potenziale.","cont":"Calcola sulla spezzata"},{"t":"Calcola il lavoro lungo la spezzata $A=(0,0,0)\\to(1,0,0)\\to(1,1,0)\\to(1,1,1)=B$.","opts":[{"x":"$2$","c":true},{"x":"$0$"},{"x":"$3$"}],"hint":"Somma i tre tratti. Su ciascuno solo UNA componente di $\\gamma'$ è non nulla, quindi sopravvive un solo termine di $F$.","sol":"Tratto 1 $(t,0,0)$: $F=(0,t,0)$, $\\gamma'=(1,0,0)$, $F\\cdot\\gamma'=0\\Rightarrow0$. Tratto 2 $(1,t,0)$: $F=(0,1,t)$, $\\gamma'=(0,1,0)$, prodotto $=1\\Rightarrow\\int_0^1 1=1$. Tratto 3 $(1,1,t)$: $F=(t,1,1)$, $\\gamma'=(0,0,1)$, prodotto $=1\\Rightarrow\\int_0^1 1=1$. Totale $=0+1+1=2$ (additività dell'integrale su curva regolare a tratti). Poiché $F$ non è conservativo, un altro cammino da $A$ a $B$ darebbe in generale un valore diverso."}]},{"pool":"curve","src":"tipo curve · lunghezza del sostegno vs curva con molteplicità (caso limite)","steps":[{"t":"Considera $\\gamma(t)=(\\cos t,\\ \\sin t)$ con $t\\in[0,4\\pi]$. Quanto vale $\\int_0^{4\\pi}\\|\\gamma'(t)\\|\\,dt$, e coincide con la lunghezza del SOSTEGNO (la circonferenza unitaria)?","opts":[{"x":"L'integrale vale $4\\pi$, ma il sostegno (la circonferenza) è lungo $2\\pi$: la parametrizzazione percorre il cerchio DUE volte, quindi $\\int\\|\\gamma'\\|dt$ conta la lunghezza con molteplicità","c":true},{"x":"Entrambi valgono $4\\pi$: l'integrale è sempre la lunghezza del sostegno"},{"x":"Entrambi valgono $2\\pi$: l'integrale non dipende dal dominio"}],"hint":"$\\|\\gamma'\\|=1$, quindi l'integrale è la misura del dominio, $4\\pi$. Ma la curva è iniettiva su $[0,4\\pi]$? Che punto è $\\gamma(0)$ vs $\\gamma(2\\pi)$?","sol":"$\\|\\gamma'\\|=1\\Rightarrow\\int_0^{4\\pi}1\\,dt=4\\pi$. La mappa NON è iniettiva ($\\gamma(t+2\\pi)=\\gamma(t)$): non è una curva semplice, percorre il cerchio due volte. La formula $L=\\int\\|\\gamma'\\|dt$ misura la lunghezza PERCORSA (con molteplicità), che coincide con la lunghezza del sostegno solo per curve semplici. Caso limite da tenere presente: la definizione di lunghezza è legata alla parametrizzazione, non al puro insieme immagine."}]},{"pool":"curve","src":"tipo curve · Viviani, intersezione sfera∩cilindro (parametrizzazione implicita)","steps":[{"t":"Curva di Viviani: intersezione della sfera $x^2+y^2+z^2=4$ col cilindro $x^2+y^2=2x$. Primo passo: come si parametrizza la proiezione $(x,y)$ data dal cilindro?","opts":[{"x":"$x^2+y^2=2x\\Leftrightarrow(x-1)^2+y^2=1$: cerchio di centro $(1,0)$ raggio $1$, quindi $x=1+\\cos t,\\ y=\\sin t$, $t\\in[0,2\\pi]$","c":true},{"x":"$x^2+y^2=2x$ è già un cerchio centrato nell'origine: $x=\\cos t,\\ y=\\sin t$"},{"x":"Il cilindro non si può parametrizzare, si deve usare $x=t$"}],"hint":"Completa il quadrato in $x$: $x^2-2x=(x-1)^2-1$. Il cilindro NON è centrato sull'asse $z$.","sol":"Completando il quadrato: $x^2-2x+y^2=0\\Rightarrow(x-1)^2+y^2=1$, cerchio traslato di centro $(1,0)$ e raggio $1$. Parametrizzazione $x=1+\\cos t,\\ y=\\sin t$. È il metodo standard per curve come intersezione: si parte dal vincolo con simmetria rotazionale (il cilindro), qui però decentrato — l'errore è trattarlo come centrato nell'origine.","cont":"Ricava z"},{"t":"Ricava $z(t)$ dalla sfera. Cosa ne segue per il dominio del parametro?","opts":[{"x":"$z^2=4-(x^2+y^2)=4-2x=2-2\\cos t=4\\sin^2\\tfrac t2$, quindi $z=\\pm2\\sin\\tfrac t2$: con $t\\in[0,2\\pi]$ e il segno $+$ si ottiene solo META' della curva (il tratto $z\\ge0$); serve anche il ramo $z\\le0$ per la Viviani completa","c":true},{"x":"$z=4-2x$ direttamente, e $t\\in[0,2\\pi]$ dà tutta la curva"},{"x":"$z=\\sqrt{4-2x}$ e la curva è regolare ovunque su $[0,2\\pi]$ senza altre cautele"}],"hint":"Dalla sfera $z^2=4-(x^2+y^2)$ e $x^2+y^2=2x$ sul cilindro, quindi $z^2=4-2x$. Attenzione: è $z^2$, non $z$: due rami di segno.","sol":"Sul cilindro $x^2+y^2=2x$, quindi dalla sfera $z^2=4-2x=4-2(1+\\cos t)=2-2\\cos t=4\\sin^2\\tfrac t2$, da cui $z=\\pm2|\\sin\\tfrac t2|$. Il ramo $z=+2\\sin\\tfrac t2$ ($t\\in[0,2\\pi]$) descrive solo la metà superiore ($z\\ge0$): la curva completa richiede entrambi i segni (o un dominio esteso con la giusta scelta di radice). Punto chiave: parametrizzare un'intersezione implicita $\\{F=0\\}\\cap\\{G=0\\}$ significa anche gestire i RAMI di segno e il dominio, non solo scrivere tre funzioni di $t$."}]},{"pool":"curve","src":"20220706 Es.4 · esercizio completo da 8 punti (cilindro∩piano, Stokes al variare di a)","steps":[{"t":"[Es. da 8 punti] Dati il campo $F(x,y,z)=(y^2+z^2,\\ 2xy,\\ 2a\\,xz)$, $a\\in\\mathbb{R}$, e la curva $\\gamma=\\{x^2+y^2=1\\}\\cap\\{z=2x+y+3\\}$. Passo 1: parametrizzazione regolare di $\\gamma$.","opts":[{"x":"$\\gamma(t)=(\\cos t,\\ \\sin t,\\ 2\\cos t+\\sin t+3)$, $t\\in[0,2\\pi]$; regolare perché $\\gamma\\in C^\\infty$ e $\\gamma'=(-\\sin t,\\cos t,-2\\sin t+\\cos t)\\neq0$ (seno e coseno non si annullano insieme)","c":true},{"x":"$\\gamma(t)=(t,\\ \\sqrt{1-t^2},\\ 2t+\\sqrt{1-t^2}+3)$, $t\\in[-1,1]$"},{"x":"$\\gamma(t)=(\\cos t,\\ \\sin t,\\ t)$, $t\\in[0,2\\pi]$"}],"hint":"Il vincolo che gira è il cilindro $\\to$ angolo $t$ per $(x,y)$; la quota si legge dal piano $z=2x+y+3$. Verifica che $\\gamma'$ non svanisca mai.","sol":"Metodo standard per intersezioni: $x=\\cos t,\\ y=\\sin t$ dal cilindro e $z=2\\cos t+\\sin t+3$ dal piano. Regolarità: $\\gamma'=(-\\sin t,\\cos t,-2\\sin t+\\cos t)$, e le prime due componenti non si annullano simultaneamente $\\Rightarrow\\gamma'\\neq0$ ovunque. La scelta $x=t$ (grafico) coprirebbe solo metà cilindro con derivata infinita ai poli.","cont":"Passo 2: area"},{"t":"Passo 2: calcola l'AREA della porzione di piano $z=2x+y+3$ sul disco $D=\\{x^2+y^2\\le1\\}$ (la superficie che ha $\\gamma$ come bordo).","opts":[{"x":"$\\sqrt6\\,\\pi$","c":true},{"x":"$\\pi$"},{"x":"$3\\pi$"}],"hint":"Superficie cartesiana $z=f(x,y)$: $\\text{Area}=\\iint_D\\sqrt{1+f_x^2+f_y^2}\\,dx\\,dy$, con $f_x=2,\\ f_y=1$.","sol":"Per la formula dell'area di una superficie cartesiana, $\\sqrt{1+f_x^2+f_y^2}=\\sqrt{1+4+1}=\\sqrt6$ costante, quindi $\\text{Area}=\\sqrt6\\cdot m_2(D)=\\sqrt6\\,\\pi$ (disco unitario, area $\\pi$).","cont":"Passo 3: rotore"},{"t":"Passo 3: calcola $\\operatorname{rot}F$ e stabilisci per quale $a$ il campo è conservativo su $\\mathbb{R}^3$.","opts":[{"x":"$\\operatorname{rot}F=(0,\\ 2(1-a)z,\\ 0)$; è irrotazionale sse $a=1$, e su $\\mathbb{R}^3$ (semplicemente connesso) irrotazionale $\\Rightarrow$ conservativo, dunque conservativo sse e solo se $a=1$","c":true},{"x":"$\\operatorname{rot}F=(0,0,0)$ per ogni $a$: sempre conservativo"},{"x":"$\\operatorname{rot}F=(2z,0,2ax)$; mai conservativo"}],"hint":"$\\operatorname{rot}F=(\\partial_yF_3-\\partial_zF_2,\\ \\partial_zF_1-\\partial_xF_3,\\ \\partial_xF_2-\\partial_yF_1)$. Solo la componente centrale dipende da $a$.","sol":"$\\partial_zF_1-\\partial_xF_3=2z-2az=2(1-a)z$; le altre due componenti sono nulle ($\\partial_yF_3=\\partial_zF_2=0$, $\\partial_xF_2-\\partial_yF_1=2y-2y=0$). Quindi $\\operatorname{rot}F=(0,2(1-a)z,0)$, che si annulla identicamente sse $a=1$. Su un aperto semplicemente connesso vale il teorema: irrotazionale $\\Rightarrow$ conservativo.","cont":"Passo 4: caso a=1"},{"t":"Passo 4: per $a=1$ trova un potenziale e la circuitazione $\\oint_\\gamma F\\cdot d\\ell$.","opts":[{"x":"$U(x,y,z)=xy^2+xz^2$; poiché $\\gamma$ è CHIUSA e $F$ è conservativo, $\\oint_\\gamma F\\cdot d\\ell=0$","c":true},{"x":"$U=xy^2+xz^2$, ma $\\oint_\\gamma F\\cdot d\\ell=U(\\gamma(2\\pi))-U(\\gamma(0))\\neq0$"},{"x":"Non esiste potenziale perché il piano non passa per l'origine"}],"hint":"Integra $\\partial_xU=y^2+z^2$; poi impone $\\partial_yU=2xy$ e $\\partial_zU=2xz$. Su una curva chiusa il lavoro di un campo conservativo è sempre lo stesso valore.","sol":"$\\partial_xU=y^2+z^2\\Rightarrow U=xy^2+xz^2+g(y,z)$; $\\partial_yU=2xy+g_y=2xy\\Rightarrow g_y=0$; $\\partial_zU=2xz+g_z=2xz\\Rightarrow g_z=0$; quindi $U=xy^2+xz^2$. Per il teorema fondamentale degli integrali di linea, su una curva CHIUSA $\\gamma(0)=\\gamma(2\\pi)$ e $\\oint=U(\\gamma(2\\pi))-U(\\gamma(0))=0$.","cont":"Passo 5: caso a≠1, Stokes"},{"t":"Passo 5: per $a\\neq1$ il campo non è conservativo; imposta il calcolo di $\\oint_\\gamma F\\cdot d\\ell$ (verso antiorario visto dall'alto) col Teorema di Stokes.","opts":[{"x":"$\\oint_\\gamma F\\cdot d\\ell=\\iint_\\Sigma\\operatorname{rot}F\\cdot N\\,d\\sigma$ con $\\Sigma:z=2x+y+3$ su $D$ e normale con terza componente positiva $N\\,d\\sigma=(-2,-1,1)\\,dx\\,dy$ (compatibile col verso antiorario)","c":true},{"x":"$\\oint_\\gamma F\\cdot d\\ell=\\iint_\\Sigma\\operatorname{rot}F\\cdot N\\,d\\sigma$ con $N\\,d\\sigma=(2,1,1)\\,dx\\,dy$"},{"x":"Non si può usare Stokes perché $\\gamma$ non è piana"}],"hint":"Per una superficie cartesiana $z=f$, $N\\,d\\sigma=(-f_x,-f_y,1)\\,dx\\,dy$. Terza componente $+1$ $\\leftrightarrow$ bordo antiorario visto dall'alto (regola della mano destra).","sol":"Il Teorema di Stokes lega la circuitazione al flusso del rotore. La superficie cartesiana $\\Sigma:z=2x+y+3$ ha $N\\,d\\sigma=(-f_x,-f_y,1)\\,dx\\,dy=(-2,-1,1)\\,dx\\,dy$; la terza componente positiva è orientata in accordo (mano destra) col verso antiorario del bordo visto dall'alto. La compatibilità orientazione bordo↔normale è la condizione del teorema.","cont":"Passo 6: calcolo"},{"t":"Passo 6: completa il calcolo per $a\\neq1$.","opts":[{"x":"$\\oint_\\gamma F\\cdot d\\ell=6(a-1)\\pi$","c":true},{"x":"$\\oint_\\gamma F\\cdot d\\ell=0$ per ogni $a$"},{"x":"$\\oint_\\gamma F\\cdot d\\ell=2(a-1)\\pi$"}],"hint":"$\\operatorname{rot}F\\cdot(-2,-1,1)=2(1-a)z\\cdot(-1)$ con $z=2x+y+3$ su $\\Sigma$. Poi $\\iint_D x=\\iint_D y=0$ per simmetria; resta il termine costante.","sol":"$\\operatorname{rot}F\\cdot N\\,d\\sigma=(0,2(1-a)z,0)\\cdot(-2,-1,1)\\,dx\\,dy=-2(1-a)z\\,dx\\,dy=-2(1-a)(2x+y+3)\\,dx\\,dy$. Integrando su $D$: $\\iint_D x=\\iint_D y=0$ (simmetria del disco), $\\iint_D 3=3\\pi$, quindi $\\oint=-2(1-a)\\cdot3\\pi=6(a-1)\\pi$. Coerente col caso $a=1$ (dà $0$). Verifica finale superata."}]},{"pool":"curve","src":"tipo curve · lavoro spaziale per via diretta con verifica Stokes (esercizio completo)","steps":[{"t":"[Es. da 8 punti] Campo $F=(-y,\\ x,\\ z^2)$ e curva $\\gamma=\\{x^2+y^2=4\\}\\cap\\{z=y+1\\}$. Passo 1: parametrizza $\\gamma$ e giustifica la regolarità.","opts":[{"x":"$\\gamma(t)=(2\\cos t,\\ 2\\sin t,\\ 2\\sin t+1)$, $t\\in[0,2\\pi]$; $\\gamma'=(-2\\sin t,2\\cos t,2\\cos t)\\neq0$, componenti $C^\\infty\\Rightarrow$ regolare","c":true},{"x":"$\\gamma(t)=(2\\cos t,\\ 2\\sin t,\\ 2\\cos t+1)$, $t\\in[0,2\\pi]$"},{"x":"$\\gamma(t)=(\\cos t,\\ \\sin t,\\ \\sin t+1)$, $t\\in[0,2\\pi]$ (il cilindro ha raggio $1$)"}],"hint":"Il cilindro $x^2+y^2=4$ ha raggio $2$, non $1$; la quota viene dal piano $z=y+1$, cioè $z=2\\sin t+1$.","sol":"Raggio $2$: $x=2\\cos t,\\ y=2\\sin t$; quota dal piano $z=y+1=2\\sin t+1$. $\\gamma'=(-2\\sin t,2\\cos t,2\\cos t)$ non si annulla (prime due componenti mai nulle insieme). Errore tipico: leggere raggio $1$ da $x^2+y^2=4$.","cont":"Passo 2: orientazione"},{"t":"Passo 2: si vuole il verso antiorario visto dall'alto. La parametrizzazione scelta lo rispetta?","opts":[{"x":"Sì: la proiezione $(2\\cos t,2\\sin t)$ con $t$ crescente ruota in senso antiorario, quindi si integra con $t:0\\to2\\pi$ senza cambiare segno","c":true},{"x":"No: bisogna invertire, $t:2\\pi\\to0$"},{"x":"L'orientazione è irrilevante perché $F$ è conservativo"}],"hint":"Antiorario visto dall'alto riguarda solo la proiezione nel piano $xy$. $(\\cos t,\\sin t)$ crescente = antiorario standard.","sol":"La proiezione $(2\\cos t,2\\sin t)$ percorsa con $t$ crescente è antioraria: coerente con la richiesta. $F=(-y,x,z^2)$ non è conservativo ($\\operatorname{rot}F=(0,0,2)\\neq0$), quindi il verso conta (integrale di II specie).","cont":"Passo 3: integranda"},{"t":"Passo 3: scrivi $F(\\gamma(t))\\cdot\\gamma'(t)$ e semplifica.","opts":[{"x":"$F\\cdot\\gamma'=4+2\\cos t\\,(2\\sin t+1)^2$","c":true},{"x":"$F\\cdot\\gamma'=2\\cos t\\,(2\\sin t+1)^2$"},{"x":"$F\\cdot\\gamma'=4\\cos2t$"}],"hint":"$F(\\gamma)=(-2\\sin t,\\ 2\\cos t,\\ (2\\sin t+1)^2)$. I primi due termini danno $4\\sin^2t+4\\cos^2t=4$.","sol":"$(-2\\sin t)(-2\\sin t)+(2\\cos t)(2\\cos t)+(2\\sin t+1)^2(2\\cos t)=4\\sin^2t+4\\cos^2t+2\\cos t(2\\sin t+1)^2=4+2\\cos t(2\\sin t+1)^2$. La parte $(-y,x)$ dà il termine costante $4$; la terza componente porta il resto.","cont":"Passo 4: integrale"},{"t":"Passo 4: calcola $\\int_\\gamma F\\cdot d\\ell=\\int_0^{2\\pi}\\big[4+2\\cos t\\,(2\\sin t+1)^2\\big]dt$.","opts":[{"x":"$8\\pi$","c":true},{"x":"$0$"},{"x":"$4\\pi$"}],"hint":"$\\int_0^{2\\pi}4\\,dt=8\\pi$. Ogni pezzo $\\int_0^{2\\pi}2\\cos t\\cdot(\\dots)\\,dt$ è nullo: sono derivate di funzioni periodiche (es. $2\\cos t\\cdot4\\sin^2 t=\\tfrac{d}{dt}(\\tfrac{8}{3}\\sin^3t)$).","sol":"$\\int_0^{2\\pi}4\\,dt=8\\pi$. Sviluppando $(2\\sin t+1)^2=4\\sin^2t+4\\sin t+1$, ciascun termine $2\\cos t\\cdot(\\cdot)$ integra a $0$ su un periodo (primitive $\\tfrac83\\sin^3t,\\ 4\\sin^2t/... ,\\ 2\\sin t$, tutte periodiche). Quindi $\\int_\\gamma F\\cdot d\\ell=8\\pi$.","cont":"Passo 5: verifica Stokes"},{"t":"Passo 5: verifica il risultato col Teorema di Stokes sulla superficie $\\Sigma:z=y+1$ sul disco $x^2+y^2\\le4$.","opts":[{"x":"$\\operatorname{rot}F=(0,0,2)$, $N\\,d\\sigma=(0,-1,1)\\,dx\\,dy$, quindi $\\iint_\\Sigma\\operatorname{rot}F\\cdot N=\\iint_D 2\\,dx\\,dy=2\\cdot4\\pi=8\\pi$: concorda","c":true},{"x":"$\\operatorname{rot}F=(0,0,2)$ ma $\\iint_\\Sigma\\operatorname{rot}F\\cdot N=2\\cdot\\pi=2\\pi$: non concorda, c'è un errore"},{"x":"Stokes non è applicabile perché $\\Sigma$ non è piana"}],"hint":"$\\operatorname{rot}F\\cdot(0,-1,1)=2$; l'integrale è $2$ per l'area del disco di raggio $2$, cioè $4\\pi$.","sol":"$\\operatorname{rot}F=(\\partial_yz^2-\\partial_zx,\\ \\partial_z(-y)-\\partial_xz^2,\\ \\partial_xx-\\partial_y(-y))=(0,0,2)$. Con $N\\,d\\sigma=(-f_x,-f_y,1)\\,dx\\,dy=(0,-1,1)\\,dx\\,dy$, $\\operatorname{rot}F\\cdot N=2$, e $\\iint_D 2\\,dx\\,dy=2\\cdot\\pi\\cdot2^2=8\\pi$. Coincide col calcolo diretto: la doppia via (parametrica e Stokes) è la verifica d'esame che blinda gli 8 punti."}]},{"pool":"curve","src":"tipo curve · massa e baricentro di un filo (I specie, calcolo completo)","steps":[{"t":"[Es. da 8 punti] Un filo ha sostegno l'elica $\\gamma(t)=(\\cos t,\\ \\sin t,\\ t)$, $t\\in[0,2\\pi]$, e densità lineare $\\delta(x,y,z)=z^2$. Passo 1: elemento d'arco e densità in funzione di $t$.","opts":[{"x":"$ds=\\sqrt2\\,dt$ e $\\delta(\\gamma(t))=t^2$","c":true},{"x":"$ds=dt$ e $\\delta=t^2$"},{"x":"$ds=\\sqrt2\\,dt$ e $\\delta=t$"}],"hint":"$\\|\\gamma'\\|=\\sqrt{\\sin^2t+\\cos^2t+1}=\\sqrt2$; sul sostegno $z=t$, quindi $\\delta=z^2=t^2$.","sol":"$\\gamma'=(-\\sin t,\\cos t,1)\\Rightarrow\\|\\gamma'\\|=\\sqrt2$, $ds=\\sqrt2\\,dt$. La densità va valutata SUL sostegno: $\\delta=z^2=t^2$. Questi due ingredienti alimentano tutti gli integrali di I specie successivi.","cont":"Passo 2: massa"},{"t":"Passo 2: calcola la massa $M=\\int_\\gamma\\delta\\,ds$.","opts":[{"x":"$M=\\dfrac{8\\sqrt2}{3}\\pi^3$","c":true},{"x":"$M=\\dfrac{8}{3}\\pi^3$"},{"x":"$M=2\\sqrt2\\,\\pi^2$"}],"hint":"$M=\\int_0^{2\\pi}t^2\\cdot\\sqrt2\\,dt=\\sqrt2\\cdot\\dfrac{(2\\pi)^3}{3}$.","sol":"Per la definizione di massa di un filo, $M=\\int_\\gamma\\delta\\,ds=\\int_0^{2\\pi}t^2\\sqrt2\\,dt=\\sqrt2\\left[\\tfrac{t^3}{3}\\right]_0^{2\\pi}=\\sqrt2\\cdot\\tfrac{8\\pi^3}{3}=\\tfrac{8\\sqrt2}{3}\\pi^3$.","cont":"Passo 3: quota del baricentro"},{"t":"Passo 3: calcola la quota $\\bar z=\\dfrac1M\\int_\\gamma z\\,\\delta\\,ds$.","opts":[{"x":"$\\bar z=\\dfrac{3\\pi}{2}$","c":true},{"x":"$\\bar z=\\pi$"},{"x":"$\\bar z=\\dfrac{4\\pi}{3}$"}],"hint":"$\\int_\\gamma z\\,\\delta\\,ds=\\int_0^{2\\pi}t\\cdot t^2\\cdot\\sqrt2\\,dt=\\sqrt2\\int_0^{2\\pi}t^3\\,dt$. Poi dividi per $M$.","sol":"$\\int_\\gamma z\\delta\\,ds=\\sqrt2\\int_0^{2\\pi}t^3\\,dt=\\sqrt2\\cdot\\tfrac{(2\\pi)^4}{4}=4\\sqrt2\\pi^4$. Quindi $\\bar z=\\dfrac{4\\sqrt2\\pi^4}{\\tfrac{8\\sqrt2}{3}\\pi^3}=\\dfrac{4\\pi^4\\cdot3}{8\\pi^3}=\\dfrac{3\\pi}{2}$. Coerente: $0<\\tfrac{3\\pi}{2}<2\\pi$, ma spostato verso l'alto perché la densità $z^2$ pesa di più le quote alte.","cont":"Passo 4: componenti orizzontali"},{"t":"Passo 4: calcola $\\bar x=\\dfrac1M\\int_\\gamma x\\,\\delta\\,ds$ (serve $\\int_0^{2\\pi}t^2\\cos t\\,dt$, per parti).","opts":[{"x":"$\\int_0^{2\\pi}t^2\\cos t\\,dt=4\\pi$, quindi $\\bar x=\\dfrac{3}{2\\pi^2}$","c":true},{"x":"$\\int_0^{2\\pi}t^2\\cos t\\,dt=0$, quindi $\\bar x=0$"},{"x":"$\\int_0^{2\\pi}t^2\\cos t\\,dt=2\\pi$, quindi $\\bar x=\\dfrac{3}{4\\pi^2}$"}],"hint":"Per parti due volte: $\\int t^2\\cos t\\,dt=t^2\\sin t+2t\\cos t-2\\sin t$. Valuta in $2\\pi$ e $0$.","sol":"Primitiva $t^2\\sin t+2t\\cos t-2\\sin t$; in $2\\pi$ vale $0+4\\pi\\cdot1-0=4\\pi$, in $0$ vale $0$. Quindi $\\int_\\gamma x\\delta\\,ds=\\sqrt2\\cdot4\\pi=4\\sqrt2\\pi$ e $\\bar x=\\dfrac{4\\sqrt2\\pi}{\\tfrac{8\\sqrt2}{3}\\pi^3}=\\dfrac{12\\pi}{8\\pi^3}=\\dfrac{3}{2\\pi^2}$. Non è nullo: la densità $z^2$ rompe la simmetria che per densità costante annullerebbe $\\bar x$.","cont":"Passo 5: baricentro completo"},{"t":"Passo 5: analogamente $\\int_0^{2\\pi}t^2\\sin t\\,dt=-4\\pi^2$. Il baricentro del filo è:","opts":[{"x":"$\\left(\\dfrac{3}{2\\pi^2},\\ -\\dfrac{3}{2\\pi},\\ \\dfrac{3\\pi}{2}\\right)$","c":true},{"x":"$\\left(\\dfrac{3}{2\\pi^2},\\ \\dfrac{3}{2\\pi},\\ \\dfrac{3\\pi}{2}\\right)$"},{"x":"$\\left(0,\\ 0,\\ \\dfrac{3\\pi}{2}\\right)$"}],"hint":"$\\bar y=\\dfrac1M\\int_\\gamma y\\delta\\,ds=\\dfrac{\\sqrt2\\cdot(-4\\pi^2)}{M}$. Il segno negativo viene dall'integrale, non è un errore.","sol":"$\\int_\\gamma y\\delta\\,ds=\\sqrt2\\int_0^{2\\pi}t^2\\sin t\\,dt=\\sqrt2(-4\\pi^2)$, quindi $\\bar y=\\dfrac{-4\\sqrt2\\pi^2}{\\tfrac{8\\sqrt2}{3}\\pi^3}=-\\dfrac{12\\pi^2}{8\\pi^3}=-\\dfrac{3}{2\\pi}$. Baricentro $\\left(\\tfrac{3}{2\\pi^2},-\\tfrac{3}{2\\pi},\\tfrac{3\\pi}{2}\\right)$. Verifica di coerenza: il baricentro NON sta sul sostegno (è interno al cilindro, distanza dall'asse $\\sqrt{\\bar x^2+\\bar y^2}<1$), come dev'essere per un baricentro di una curva non rettilinea."}]},{"pool":"curve","src":"20230210 Es.3 · esercizio completo (Green su semiellisse + potenziale)","steps":[{"t":"[Es. da 8 punti] Per $\\alpha\\in\\mathbb{R}$, campo $F=(ye^{xy}-2x\\sin y,\\ xe^{xy}-x^2\\cos y+\\alpha x^3)$ e $D=\\{\\tfrac{x^2}{4}+y^2\\le1,\\ y\\ge0\\}$. Passo 1: per calcolare $\\oint_{+\\partial D}F\\cdot d\\ell$ (antiorario) col Teorema di Green, calcola $\\partial_xF_2-\\partial_yF_1$.","opts":[{"x":"$\\partial_xF_2-\\partial_yF_1=3\\alpha x^2$","c":true},{"x":"$\\partial_xF_2-\\partial_yF_1=0$ per ogni $\\alpha$"},{"x":"$\\partial_xF_2-\\partial_yF_1=\\alpha x^3$"}],"hint":"I termini con $e^{xy}$ e $\\sin y$ si cancellano tra le due derivate; sopravvive solo la derivata di $\\alpha x^3$.","sol":"$\\partial_yF_1=e^{xy}+xye^{xy}-2x\\cos y$; $\\partial_xF_2=e^{xy}+xye^{xy}-2x\\cos y+3\\alpha x^2$. La differenza è $3\\alpha x^2$: tutta la parte 'conservativa' si elide, resta il termine di rottura $\\alpha x^3$.","cont":"Passo 2: Green"},{"t":"Passo 2: calcola $\\oint_{+\\partial D}F\\cdot d\\ell=\\iint_D 3\\alpha x^2\\,dx\\,dy$ usando coordinate ellittiche $x=2\\rho\\cos\\varphi,\\ y=\\rho\\sin\\varphi$.","opts":[{"x":"$3\\alpha\\pi$","c":true},{"x":"$3\\alpha\\pi^2$"},{"x":"$6\\alpha\\pi$"}],"hint":"Jacobiano $|J|=2\\rho$; il semidisco $y\\ge0$ dà $\\rho\\in[0,1],\\ \\varphi\\in[0,\\pi]$. Ricorda $\\int_0^\\pi\\cos^2\\varphi\\,d\\varphi=\\pi/2$.","sol":"$\\iint_D3\\alpha x^2=3\\alpha\\int_0^1\\!\\!\\int_0^\\pi(2\\rho\\cos\\varphi)^2\\cdot2\\rho\\,d\\varphi\\,d\\rho=3\\alpha\\cdot8\\int_0^1\\rho^3d\\rho\\int_0^\\pi\\cos^2\\varphi\\,d\\varphi=3\\alpha\\cdot8\\cdot\\tfrac14\\cdot\\tfrac\\pi2=3\\alpha\\pi$. Il Teorema di Green ha trasformato una circuitazione in un integrale doppio elementare.","cont":"Passo 3: parametrizza l'arco"},{"t":"Passo 3: sia $\\Gamma=\\{\\tfrac{x^2}{4}+y^2=1,\\ y\\ge0\\}$ la semiellisse, da $(2,0)$ a $(-2,0)$. Una parametrizzazione regolare e semplice è:","opts":[{"x":"$\\gamma(\\varphi)=(2\\cos\\varphi,\\ \\sin\\varphi)$, $\\varphi\\in[0,\\pi]$; $C^\\infty$, $\\gamma'=(-2\\sin\\varphi,\\cos\\varphi)\\neq0$, iniettiva su $(0,\\pi)$","c":true},{"x":"$\\gamma(\\varphi)=(2\\cos\\varphi,\\ \\sin\\varphi)$, $\\varphi\\in[0,2\\pi]$"},{"x":"$\\gamma(x)=(x,\\ \\sqrt{1-x^2/4})$, $x\\in[-2,2]$, sempre regolare"}],"hint":"Il dominio $[0,\\pi]$ dà l'arco superiore da $(2,0)$ a $(-2,0)$. Su $[0,2\\pi]$ chiuderesti l'ellisse; il grafico $y=\\sqrt{1-x^2/4}$ ha derivata infinita agli estremi.","sol":"$\\gamma(0)=(2,0),\\ \\gamma(\\pi)=(-2,0)$, e $\\gamma(\\pi/2)=(0,1)$ conferma il tratto $y\\ge0$. Regolare ($\\gamma'\\neq0$: seno e coseno non si annullano insieme) e semplice su $(0,\\pi)$. Il dominio è parte della risposta: $[0,2\\pi]$ darebbe l'ellisse intera.","cont":"Passo 4: caso conservativo"},{"t":"Passo 4: per $\\alpha=0$ il campo è conservativo. Trova un potenziale $U$.","opts":[{"x":"$U(x,y)=e^{xy}-x^2\\sin y$","c":true},{"x":"$U(x,y)=e^{xy}+x^2\\cos y$"},{"x":"Non esiste potenziale perché il dominio $y\\ge0$ non è aperto"}],"hint":"Integra $\\partial_xU=F_1=ye^{xy}-2x\\sin y$ rispetto a $x$, poi imponi $\\partial_yU=F_2$.","sol":"$\\partial_xU=ye^{xy}-2x\\sin y\\Rightarrow U=e^{xy}-x^2\\sin y+g(y)$; $\\partial_yU=xe^{xy}-x^2\\cos y+g'(y)$ deve uguagliare $F_2=xe^{xy}-x^2\\cos y$ (con $\\alpha=0$), quindi $g'=0$. $U=e^{xy}-x^2\\sin y$. Per $\\alpha=0$ il campo è irrotazionale su $\\mathbb{R}^2$ semplicemente connesso $\\Rightarrow$ conservativo.","cont":"Passo 5: lavoro finale"},{"t":"Passo 5: per $\\alpha=0$ calcola $\\int_\\gamma F\\cdot d\\ell$ sull'arco aperto $\\Gamma$ (da $(2,0)$ a $(-2,0)$).","opts":[{"x":"$\\int_\\gamma F\\cdot d\\ell=U(-2,0)-U(2,0)=1-1=0$","c":true},{"x":"$\\int_\\gamma F\\cdot d\\ell=3\\alpha\\pi=0$, come al passo 2"},{"x":"$\\int_\\gamma F\\cdot d\\ell=2$"}],"hint":"Su un arco APERTO vale $\\int=U(\\text{fine})-U(\\text{inizio})$, NON $0$ per default: qui torna $0$ solo perché i valori agli estremi coincidono.","sol":"Per il teorema fondamentale degli integrali di linea, $\\int_\\gamma F\\cdot d\\ell=U(-2,0)-U(2,0)$. Con $U=e^{xy}-x^2\\sin y$: $U(\\pm2,0)=e^0-4\\sin0=1$, quindi $1-1=0$. Attenzione: NON è il risultato di Green del passo 2 (quello era la curva CHIUSA $\\partial D$, che include il diametro sull'asse $x$); qui è solo l'arco. Distinguere curva chiusa e arco aperto è il punto in cui si perdono punti."}]},{"pool":"curve","src":"tipo A &middot; manuale","steps":[{"t":"Astroide $\\gamma(t)=(a\\cos^3 t,\\ a\\sin^3 t)$, $a>0$, $t\\in[0,2\\pi]$. Vuoi la LUNGHEZZA totale. Primo passo: la curva &egrave; regolare su tutto $[0,2\\pi]$? E perch&eacute; la risposta condiziona il calcolo?","opts":[{"x":"No: $\\gamma'(t)=0$ nei quattro punti $t=0,\\tfrac{\\pi}{2},\\pi,\\tfrac{3\\pi}{2}$ (cuspidi), quindi &egrave; regolare solo a TRATTI; la lunghezza esiste comunque perch&eacute; $|\\gamma'|$ &egrave; integrabile e i punti singolari sono un insieme di misura nulla.","c":true},{"x":"S&igrave;, $\\gamma$ &egrave; regolare ovunque perch&eacute; le componenti sono $C^\\infty$."},{"x":"No, e dove $\\gamma'=0$ la lunghezza diverge."}],"hint":"Regolarit&agrave; &egrave; $\\gamma'\\ne0$, non solo differenziabilit&agrave;. Guarda i punti a cuspide.","sol":"$\\gamma'(t)=(-3a\\cos^2 t\\sin t,\\ 3a\\sin^2 t\\cos t)$ si annulla dove $\\sin t\\cos t=0$, cio&egrave; $t=0,\\tfrac\\pi2,\\pi,\\tfrac{3\\pi}2$: sono le quattro cuspide dell'astroide. La curva &egrave; regolare A TRATTI. Per la DEFINIZIONE di lunghezza $L=\\int_a^b|\\gamma'(t)|\\,dt$ basta che $|\\gamma'|$ sia integrabile (Riemann): un numero finito di zeri non toglie l'integrabilit&agrave;. Differenziabile $\\ne$ regolare: $C^\\infty$ non implica $\\gamma'\\ne0$.","cont":"Ho classificato i punti"},{"t":"Calcola $|\\gamma'(t)|$ e semplificalo. Qui si perde il primo punto: come scrivi $\\sqrt{\\cos^2 t\\,\\sin^2 t}$?","opts":[{"x":"$|\\gamma'(t)|=3a\\,|\\cos t\\,\\sin t|=\\tfrac{3a}{2}\\,|\\sin 2t|$: il VALORE ASSOLUTO &egrave; obbligatorio perch&eacute; $\\sqrt{x^2}=|x|$, non $x$.","c":true},{"x":"$|\\gamma'(t)|=3a\\cos t\\,\\sin t=\\tfrac{3a}{2}\\sin 2t$ (la radice cancella il quadrato)."},{"x":"$|\\gamma'(t)|=3a$ (il modulo di un versore &egrave; $1$, riscalato)."}],"hint":"$\\sqrt{f^2}=|f|$. Su $[0,2\\pi]$ il segno di $\\cos t\\sin t$ cambia.","sol":"$|\\gamma'|^2=9a^2\\cos^4 t\\sin^2 t+9a^2\\sin^4 t\\cos^2 t=9a^2\\cos^2 t\\sin^2 t(\\cos^2 t+\\sin^2 t)=9a^2\\cos^2 t\\sin^2 t$. Quindi $|\\gamma'|=3a\\sqrt{\\cos^2 t\\sin^2 t}=3a|\\cos t\\sin t|=\\tfrac{3a}{2}|\\sin 2t|$. Il criterio &egrave; l'identit&agrave; $\\sqrt{u^2}=|u|$: su $[0,2\\pi]$ la quantit&agrave; $\\cos t\\sin t$ &egrave; negativa su due dei quattro quadranti, quindi togliere il modulo falsa il calcolo (e porta a $0$).","cont":"Ho $|\\gamma'|$"},{"t":"Imposta e calcola $L=\\int_0^{2\\pi}\\tfrac{3a}{2}|\\sin 2t|\\,dt$. Perch&eacute; NON puoi togliere il modulo e integrare $\\sin 2t$ su tutto $[0,2\\pi]$?","opts":[{"x":"Perch&eacute; $\\int_0^{2\\pi}\\sin 2t\\,dt=0$ (contributi $\\pm$ che si elidono): darebbe $L=0$, assurdo per una curva di lunghezza positiva. Con il modulo, per simmetria $L=4\\cdot\\tfrac{3a}{2}\\int_0^{\\pi/2}\\sin 2t\\,dt=6a$.","c":true},{"x":"Si pu&ograve; togliere: $\\int_0^{2\\pi}\\sin 2t\\,dt=6a$."},{"x":"$L=\\tfrac{3a}{2}\\cdot 2\\pi=3\\pi a$ (base per altezza media)."}],"hint":"La lunghezza &egrave; positiva. Un integrale che d&agrave; $0$ &egrave; il campanello del modulo dimenticato.","sol":"$|\\sin 2t|$ ha periodo $\\tfrac\\pi2$ ed &egrave; simmetrico: $\\int_0^{2\\pi}|\\sin 2t|\\,dt=4\\int_0^{\\pi/2}\\sin 2t\\,dt=4\\cdot\\big[-\\tfrac12\\cos 2t\\big]_0^{\\pi/2}=4\\cdot\\big(\\tfrac12+\\tfrac12\\big)=4$. Quindi $L=\\tfrac{3a}{2}\\cdot4=6a$. Senza il modulo $\\int_0^{2\\pi}\\sin 2t\\,dt=0$: il segnale che si &egrave; violato $\\sqrt{f^2}=|f|$. Criterio usato: additivit&agrave; e simmetria dell'integrale della funzione periodica $|\\sin 2t|$.","cont":"$L=6a$"},{"t":"Verifica finale. $L=6a$: &egrave; dimensionalmente e geometricamente sensato?","opts":[{"x":"S&igrave;: $[L]=$ lunghezza (l'astroide vive nel quadrato $[-a,a]^2$, e $6a$ supera il diametro $2a\\sqrt2\\approx2.83a$ perch&eacute; la curva &egrave; concava a festone, non un segmento).","c":true},{"x":"No: la lunghezza dovrebbe essere minore del diametro $2a\\sqrt2$."},{"x":"$6a$ non ha dimensioni fisiche, quindi la verifica non si pu&ograve; fare."}],"hint":"Confronta con l'ingombro della curva; una curva non rettilinea &egrave; pi&ugrave; lunga della corda.","sol":"$L=6a$ ha le dimensioni di una lunghezza (coerente con $a$). Controllo geometrico: l'astroide &egrave; iscritta nel quadrato $[-a,a]^2$; la sua estensione &egrave; dell'ordine di $a$, e una curva a quattro archi concavi &egrave; naturalmente pi&ugrave; lunga della diagonale $2a\\sqrt2$. Il valore $6a$ &egrave; il risultato classico noto per l'astroide: coerente. Criterio: analisi dimensionale + confronto con un lower bound geometrico (lunghezza $\\ge$ corda).","cont":"Verificato"}]},{"pool":"curve","src":"tipo A &middot; manuale","steps":[{"t":"Cicloide $\\gamma(t)=(t-\\sin t,\\ 1-\\cos t)$, $t\\in[0,2\\pi]$ (un arco). Vuoi $L$ e poi $\\int_\\gamma y\\,ds$. Primo passo: dove $\\gamma$ NON &egrave; regolare, e perch&eacute; il dato geometrico lo prevede?","opts":[{"x":"$\\gamma'(t)=(1-\\cos t,\\ \\sin t)$ si annulla a $t=0$ e $t=2\\pi$: sono i punti in cui la ruota tocca il suolo (cuspidi). Regolare a tratti; l'integrale di I specie resta ben definito.","c":true},{"x":"$\\gamma$ &egrave; regolare ovunque perch&eacute; $\\sin t$ e $1-\\cos t$ non si annullano mai insieme."},{"x":"Non &egrave; regolare a $t=\\pi$, il punto pi&ugrave; alto."}],"hint":"$\\gamma'=0$ richiede $\\sin t=0$ E $1-\\cos t=0$ insieme. Pensa al punto di contatto della ruota.","sol":"$\\gamma'(t)=(1-\\cos t,\\ \\sin t)$; si annulla dove $1-\\cos t=0$ e $\\sin t=0$, cio&egrave; $t=0,2\\pi$: la cuspide sul suolo, dove il punto della ruota ha velocit&agrave; istantanea nulla. Regolare a TRATTI. Per la definizione di integrale curvilineo di prima specie $\\int_\\gamma f\\,ds=\\int_a^b f(\\gamma(t))|\\gamma'(t)|\\,dt$, gli zeri isolati di $|\\gamma'|$ non tolgono l'integrabilit&agrave;.","cont":"Punti singolari trovati"},{"t":"Calcola $|\\gamma'(t)|$ e giustifica se serve il valore assoluto sul dominio $[0,2\\pi]$.","opts":[{"x":"$|\\gamma'(t)|=\\sqrt{2-2\\cos t}=2\\big|\\sin\\tfrac t2\\big|=2\\sin\\tfrac t2$: qui il modulo si pu&ograve; TOGLIERE perch&eacute; $\\tfrac t2\\in[0,\\pi]$ e $\\sin\\tfrac t2\\ge0$ su tutto il dominio.","c":true},{"x":"$|\\gamma'(t)|=2\\big|\\sin\\tfrac t2\\big|$ e il modulo va tenuto: $\\sin\\tfrac t2$ cambia segno su $[0,2\\pi]$."},{"x":"$|\\gamma'(t)|=\\sqrt{2}$ costante."}],"hint":"$1-\\cos t=2\\sin^2\\tfrac t2$. Poi controlla il segno di $\\sin\\tfrac t2$ su $[0,2\\pi]$: $\\tfrac t2$ dove sta?","sol":"$|\\gamma'|^2=(1-\\cos t)^2+\\sin^2 t=1-2\\cos t+\\cos^2 t+\\sin^2 t=2-2\\cos t=4\\sin^2\\tfrac t2$ (formula di bisezione $1-\\cos t=2\\sin^2\\tfrac t2$). Quindi $|\\gamma'|=2|\\sin\\tfrac t2|$. A DIFFERENZA dell'astroide, qui $\\tfrac t2$ percorre solo $[0,\\pi]$, dove $\\sin\\ge0$: il modulo si toglie lecitamente, $|\\gamma'|=2\\sin\\tfrac t2$. Il criterio &egrave; sempre $\\sqrt{u^2}=|u|$, ma il segno di $u$ va controllato sul dominio effettivo.","cont":"$|\\gamma'|=2\\sin\\tfrac t2$"},{"t":"Calcola la lunghezza $L=\\int_0^{2\\pi}2\\sin\\tfrac t2\\,dt$.","opts":[{"x":"$L=\\big[-4\\cos\\tfrac t2\\big]_0^{2\\pi}=-4\\cos\\pi+4\\cos 0=4+4=8$.","c":true},{"x":"$L=\\big[-4\\cos\\tfrac t2\\big]_0^{2\\pi}=0$."},{"x":"$L=2\\pi$."}],"hint":"Primitiva di $\\sin\\tfrac t2$ &egrave; $-2\\cos\\tfrac t2$. Attenzione al fattore.","sol":"$\\int 2\\sin\\tfrac t2\\,dt=2\\cdot(-2\\cos\\tfrac t2)=-4\\cos\\tfrac t2$. Valutando: $-4\\cos\\pi-(-4\\cos 0)=-4(-1)+4(1)=8$. Quindi $L=8$ (il classico $8r$ con $r=1$). Teorema di Torricelli-Barrow (fondamentale del calcolo) per la primitiva.","cont":"$L=8$"},{"t":"Ora $\\int_\\gamma y\\,ds$ con $y=1-\\cos t$. Impostazione corretta e valore?","opts":[{"x":"$\\int_0^{2\\pi}(1-\\cos t)\\cdot 2\\sin\\tfrac t2\\,dt=\\int_0^{2\\pi}4\\sin^3\\tfrac t2\\,dt=8\\!\\int_0^{\\pi}\\!\\sin^3u\\,du=8\\cdot\\tfrac43=\\tfrac{32}{3}$.","c":true},{"x":"$\\int_0^{2\\pi}(1-\\cos t)\\,dt=2\\pi$ (l'elemento $ds$ non entra nel peso)."},{"x":"$\\int_0^{2\\pi}4\\sin^3\\tfrac t2\\,dt=0$ per simmetria dispari."}],"hint":"Usa $1-\\cos t=2\\sin^2\\tfrac t2$ per fondere il peso con $ds$; poi sostituzione $u=\\tfrac t2$.","sol":"$\\int_\\gamma y\\,ds=\\int_0^{2\\pi}(1-\\cos t)\\,|\\gamma'|\\,dt=\\int_0^{2\\pi}2\\sin^2\\tfrac t2\\cdot 2\\sin\\tfrac t2\\,dt=\\int_0^{2\\pi}4\\sin^3\\tfrac t2\\,dt$. Sostituzione $u=\\tfrac t2$, $dt=2\\,du$, $u\\in[0,\\pi]$: $=8\\int_0^\\pi\\sin^3u\\,du$. Con $\\int_0^\\pi\\sin^3u\\,du=\\big[-\\cos u+\\tfrac{\\cos^3u}{3}\\big]_0^\\pi=\\tfrac43$ si ha $\\tfrac{32}{3}$. Il trabocchetto &egrave; scordare $ds=|\\gamma'|\\,dt$ e integrare $y\\,dt$ (darebbe $2\\pi$): definizione di integrale di I specie.","cont":"$\\int_\\gamma y\\,ds=\\tfrac{32}{3}$"},{"t":"Verifica geometrica. Il valore medio $\\bar y=\\dfrac{\\int_\\gamma y\\,ds}{L}$ deve stare in un intervallo prevedibile: quale, e torna?","opts":[{"x":"$\\bar y=\\dfrac{32/3}{8}=\\tfrac43\\approx1.33$, compreso fra il minimo $y=0$ (suolo) e il massimo $y=2$ (cima dell'arco): coerente.","c":true},{"x":"$\\bar y=\\tfrac43$, ma dovrebbe essere $\\le 1$ (met&agrave; dell'altezza), quindi c'&egrave; un errore."},{"x":"$\\bar y=\\tfrac{32}{3}$: il valore medio coincide con l'integrale."}],"hint":"Media = integrale diviso lunghezza. Confrontala con $[y_{min},y_{max}]=[0,2]$.","sol":"Per la DEFINIZIONE di valore medio integrale su una curva, $\\bar y=\\frac1L\\int_\\gamma y\\,ds=\\frac{32/3}{8}=\\frac43$. Deve stare fra i valori estremi assunti da $y=1-\\cos t$ su $[0,2\\pi]$, cio&egrave; $[0,2]$: $\\tfrac43\\in[0,2]$ e sta sopra la met&agrave; $1$, coerente col fatto che l'arco spende pi&ugrave; lunghezza in alto (dove $ds$ &egrave; grande). Check superato.","cont":"Verificato"}]},{"pool":"curve","src":"tipo A &middot; manuale","steps":[{"t":"Elica circolare $\\gamma(t)=(a\\cos t,\\ a\\sin t,\\ b t)$, $a>0$, $b\\ne0$. Vuoi CURVATURA e TORSIONE. Primo passo: calcola $|\\gamma'|$ e di' perch&eacute; il suo essere COSTANTE semplifica tutto il resto.","opts":[{"x":"$\\gamma'=(-a\\sin t,a\\cos t,b)$, $|\\gamma'|=\\sqrt{a^2+b^2}$ costante: l'elica &egrave; percorsa a velocit&agrave; scalare costante (proporzionale all'ascissa curvilinea), quindi il triedro di Frenet si calcola senza riparametrizzare.","c":true},{"x":"$|\\gamma'|=\\sqrt{a^2\\sin^2 t+b^2}$, dipende da $t$."},{"x":"$|\\gamma'|=a$: la componente $z$ non contribuisce alla velocit&agrave;."}],"hint":"$\\sin^2 t+\\cos^2 t=1$ elimina la dipendenza da $t$. Velocit&agrave; costante $\\Rightarrow$ $s(t)$ lineare.","sol":"$\\gamma'=(-a\\sin t,\\,a\\cos t,\\,b)$, $|\\gamma'|=\\sqrt{a^2(\\sin^2 t+\\cos^2 t)+b^2}=\\sqrt{a^2+b^2}$: costante. Quindi $s(t)=\\sqrt{a^2+b^2}\\,t$ &egrave; lineare e la curva &egrave; gi&agrave; parametrizzata proporzionalmente all'ascissa curvilinea. &Egrave; la simmetria elicoidale della curva a garantire velocit&agrave; e curvatura costanti (definizione di curva parametrizzata regolare $+$ omogeneit&agrave; dell'elica).","cont":"$|\\gamma'|=\\sqrt{a^2+b^2}$"},{"t":"Per la curvatura conviene la formula $\\kappa=\\dfrac{|\\gamma'\\times\\gamma''|}{|\\gamma'|^3}$ (valida per parametrizzazione qualsiasi). Perch&eacute; questa e non $\\kappa=|T'|/|\\gamma'|$ con $T$ da normalizzare?","opts":[{"x":"Entrambe valgono, ma $\\dfrac{|\\gamma'\\times\\gamma''|}{|\\gamma'|^3}$ evita di derivare il versore normalizzato $T=\\gamma'/|\\gamma'|$ (quoziente scomodo): con $\\gamma$ NON a velocit&agrave; unitaria &egrave; la via pi&ugrave; sicura.","c":true},{"x":"Solo $\\kappa=|T'|/|\\gamma'|$ &egrave; corretta; la formula col prodotto vettoriale vale in $\\mathbb{R}^2$."},{"x":"$\\kappa=|\\gamma''|$ basta, senza dividere per $|\\gamma'|^3$."}],"hint":"La formula col prodotto vettoriale &egrave; invariante per riparametrizzazione: non richiede $|\\gamma'|=1$.","sol":"La definizione pura $\\kappa=|dT/ds|=|T'|/|\\gamma'|$ richiede di derivare $T=\\gamma'/|\\gamma'|$, quoziente scomodo se $|\\gamma'|\\ne1$. La formula $\\kappa=\\dfrac{|\\gamma'\\times\\gamma''|}{|\\gamma'|^3}$ &egrave; algebricamente equivalente ma invariante per riparametrizzazione e non chiede la velocit&agrave; unitaria: preferibile qui. Solo saltare la divisione per $|\\gamma'|^3$ ($\\kappa=|\\gamma''|$) &egrave; l'errore: sarebbe corretto solo a velocit&agrave; unitaria.","cont":"Uso il prodotto vettoriale"},{"t":"Calcola $\\kappa$. Con $\\gamma''=(-a\\cos t,-a\\sin t,0)$ si ha $\\gamma'\\times\\gamma''=(ab\\sin t,-ab\\cos t,a^2)$. Quanto vale $\\kappa$?","opts":[{"x":"$|\\gamma'\\times\\gamma''|=a\\sqrt{a^2+b^2}$, quindi $\\kappa=\\dfrac{a\\sqrt{a^2+b^2}}{(a^2+b^2)^{3/2}}=\\dfrac{a}{a^2+b^2}$: costante.","c":true},{"x":"$\\kappa=\\dfrac{a}{\\sqrt{a^2+b^2}}$."},{"x":"$\\kappa=\\dfrac{1}{a}$ sempre, come per una circonferenza."}],"hint":"$|\\gamma'\\times\\gamma''|^2=a^2b^2\\sin^2 t+a^2b^2\\cos^2 t+a^4=a^2(a^2+b^2)$. Poi dividi per $|\\gamma'|^3=(a^2+b^2)^{3/2}$.","sol":"$|\\gamma'\\times\\gamma''|=\\sqrt{a^2b^2\\sin^2 t+a^2b^2\\cos^2 t+a^4}=\\sqrt{a^2b^2+a^4}=a\\sqrt{a^2+b^2}$. Dividendo per $|\\gamma'|^3=(a^2+b^2)^{3/2}$: $\\kappa=\\dfrac{a\\sqrt{a^2+b^2}}{(a^2+b^2)^{3/2}}=\\dfrac{a}{a^2+b^2}$. Costante, come previsto dalla simmetria elicoidale. Criterio: formula della curvatura via prodotto vettoriale.","cont":"$\\kappa=\\dfrac{a}{a^2+b^2}$"},{"t":"Torsione: $\\tau=\\dfrac{(\\gamma'\\times\\gamma'')\\cdot\\gamma'''}{|\\gamma'\\times\\gamma''|^2}$, con $\\gamma'''=(a\\sin t,-a\\cos t,0)$. Valore e significato del segno?","opts":[{"x":"$(\\gamma'\\times\\gamma'')\\cdot\\gamma'''=a^2b$, quindi $\\tau=\\dfrac{a^2b}{a^2(a^2+b^2)}=\\dfrac{b}{a^2+b^2}$: il segno di $\\tau$ &egrave; quello di $b$ (elica destrorsa/sinistrorsa).","c":true},{"x":"$\\tau=\\dfrac{b}{\\sqrt{a^2+b^2}}$ ed &egrave; sempre positiva."},{"x":"$\\tau=0$: l'elica &egrave; una curva piana."}],"hint":"Prodotto scalare: $ab\\sin t\\cdot a\\sin t+(-ab\\cos t)(-a\\cos t)+0=a^2b$. $|\\gamma'\\times\\gamma''|^2=a^2(a^2+b^2)$.","sol":"$(\\gamma'\\times\\gamma'')\\cdot\\gamma'''=(ab\\sin t)(a\\sin t)+(-ab\\cos t)(-a\\cos t)+a^2\\cdot0=a^2b(\\sin^2 t+\\cos^2 t)=a^2b$. Con $|\\gamma'\\times\\gamma''|^2=a^2(a^2+b^2)$: $\\tau=\\dfrac{a^2b}{a^2(a^2+b^2)}=\\dfrac{b}{a^2+b^2}$. La torsione ha il segno di $b$: misura quanto la curva esce dal piano osculatore, ed &egrave; $\\ne0$ perch&eacute; l'elica non &egrave; piana. Formula della torsione (Frenet-Serret).","cont":"$\\tau=\\dfrac{b}{a^2+b^2}$"},{"t":"Caso limite $b\\to0$: la curva degenera nella circonferenza $(a\\cos t,a\\sin t,0)$. I tuoi $\\kappa,\\tau$ danno il risultato giusto?","opts":[{"x":"$\\kappa\\to\\dfrac{a}{a^2}=\\dfrac1a$ (raggio di curvatura $a$) e $\\tau\\to0$ (curva piana): coerente col fatto che una circonferenza di raggio $a$ ha $\\kappa=1/a$ e nessuna torsione.","c":true},{"x":"$\\kappa\\to0$ e $\\tau\\to0$: la curva diventa un punto."},{"x":"$\\kappa\\to a$ e $\\tau\\to b$."}],"hint":"Sostituisci $b=0$ nelle due formule e ricorda: circonferenza di raggio $a$ ha curvatura $1/a$.","sol":"Per $b\\to0$: $\\kappa=\\dfrac{a}{a^2+b^2}\\to\\dfrac{a}{a^2}=\\dfrac1a$ e $\\tau=\\dfrac{b}{a^2+b^2}\\to0$. La circonferenza di raggio $a$ ha esattamente curvatura $1/a$ e torsione nulla (curva piana): il limite &egrave; consistente. &Egrave; il test di degenerazione che valida le formule ottenute.","cont":"Limite coerente"},{"t":"Verifica dimensionale finale su $\\kappa$ e $\\tau$.","opts":[{"x":"$[\\kappa]=[\\tau]=$ lunghezza$^{-1}$: infatti $\\dfrac{a}{a^2+b^2}$ ha dimensioni $\\dfrac{L}{L^2}=L^{-1}$, coerente con $\\kappa=1/R$ (inverso di un raggio).","c":true},{"x":"$[\\kappa]=[\\tau]=$ lunghezza, come la lunghezza d'arco."},{"x":"$\\kappa$ e $\\tau$ sono adimensionali (angoli)."}],"hint":"Curvatura = inverso di un raggio. Che dimensioni ha $a/(a^2+b^2)$?","sol":"$a,b$ sono lunghezze, quindi $\\dfrac{a}{a^2+b^2}$ ha dimensioni $\\dfrac{L}{L^2}=L^{-1}$: sia $\\kappa$ sia $\\tau$ sono inversi di lunghezza, come dev'essere ($\\kappa=1/R$, con $R$ raggio di curvatura). Analisi dimensionale superata: la struttura $\\dfrac{\\text{lung}}{\\text{lung}^2}$ &egrave; il marchio corretto di una curvatura.","cont":"Verificato"}]},{"pool":"curve","src":"tipo curve &middot; manuale (cuspide, lunghezza d'arco)","steps":[{"t":"Considera la parabola semicubica $\\gamma(t)=(t^2,\\,t^3)$, $t\\in[0,1]$. Calcola $\\gamma'(t)$ e la norma $\\|\\gamma'(t)\\|$.","opts":[{"x":"$\\gamma'=(2t,3t^2)$, $\\|\\gamma'\\|=t\\sqrt{4+9t^2}$","c":true},{"x":"$\\gamma'=(2t,3t^2)$, $\\|\\gamma'\\|=\\sqrt{4+9t^2}$"},{"x":"$\\gamma'=(t^2,t^3)$, $\\|\\gamma'\\|=t^2\\sqrt{1+t^2}$"}],"hint":"$\\|(2t,3t^2)\\|=\\sqrt{4t^2+9t^4}$: raccogli $t^2$ sotto radice, e su $[0,1]$ vale $\\sqrt{t^2}=|t|=t$.","sol":"$\\gamma'=(2t,3t^2)$, quindi $\\|\\gamma'\\|=\\sqrt{4t^2+9t^4}=\\sqrt{t^2(4+9t^2)}=|t|\\sqrt{4+9t^2}$. Su $[0,1]$ si ha $t\\ge0$, dunque $|t|=t$ e $\\|\\gamma'\\|=t\\sqrt{4+9t^2}$. Definizione di norma euclidea del vettore velocit&agrave;."},{"t":"In quali punti di $[0,1]$ la curva &egrave; regolare (cio&egrave; $\\gamma'\\ne 0$)?","opts":[{"x":"Ovunque tranne in $t=0$, dove $\\gamma'(0)=(0,0)$: c'&egrave; una cuspide","c":true},{"x":"Ovunque: $\\gamma$ &egrave; regolare su tutto $[0,1]$"},{"x":"In nessun punto, perch&eacute; $\\gamma'$ non &egrave; mai continuo"}],"hint":"Annulla contemporaneamente le due componenti di $\\gamma'=(2t,3t^2)$.","sol":"$\\gamma'(t)=(2t,3t^2)=(0,0)$ solo per $t=0$. Per la definizione di curva regolare ($\\gamma\\in C^1$ e $\\gamma'\\ne0$), $\\gamma$ &egrave; regolare su $(0,1]$ ma NON in $t=0$: l'immagine ha una cuspide nell'origine."},{"t":"PERCH&Eacute; la formula della lunghezza $L=\\int_0^1\\|\\gamma'\\|\\,dt$ &egrave; ancora applicabile, nonostante $\\gamma'(0)=0$?","opts":[{"x":"Perch&eacute; serve solo che $\\|\\gamma'\\|$ sia integrabile (qui &egrave; continua): la regolarit&agrave; garantisce la riparametrizzazione per ascissa curvilinea, non l'esistenza della lunghezza","c":true},{"x":"Non &egrave; applicabile: con $\\gamma'(0)=0$ la lunghezza &egrave; infinita"},{"x":"&Egrave; applicabile solo dopo aver rimosso il punto $t=0$ dal dominio, cambiando il valore dell'integrale"}],"hint":"Che cosa chiede davvero l'integrale di Riemann di $\\|\\gamma'\\|$? Continuit&agrave; o non-annullamento?","sol":"La lunghezza $L=\\int_a^b\\|\\gamma'\\|\\,dt$ esiste appena $\\|\\gamma'\\|$ &egrave; integrabile secondo Riemann; qui $\\|\\gamma'\\|=t\\sqrt{4+9t^2}$ &egrave; continua su $[0,1]$, dunque integrabile. Il non-annullamento di $\\gamma'$ (regolarit&agrave;) serve per altro: garantire un versore tangente $T=\\gamma'/\\|\\gamma'\\|$ ben definito e la riparametrizzazione per ascissa curvilinea. Un solo punto con $\\gamma'=0$ non intacca l'integrabilit&agrave;. &Egrave; il punto del debrief: qui conta il PERCH&Eacute;, non la procedura."},{"t":"Calcola $L=\\int_0^1 t\\sqrt{4+9t^2}\\,dt$.","opts":[{"x":"$L=\\dfrac{13\\sqrt{13}-8}{27}$","c":true},{"x":"$L=\\dfrac{13\\sqrt{13}}{27}$"},{"x":"$L=\\dfrac{1}{18}(13^{3/2}-4^{3/2})$"}],"hint":"Sostituzione $u=4+9t^2$, $du=18t\\,dt$; estremi $u:4\\to13$.","sol":"Con $u=4+9t^2$, $du=18t\\,dt$: $L=\\frac{1}{18}\\int_4^{13}\\sqrt{u}\\,du=\\frac{1}{18}\\cdot\\frac{2}{3}\\big[u^{3/2}\\big]_4^{13}=\\frac{1}{27}(13^{3/2}-8)=\\frac{13\\sqrt{13}-8}{27}$. Teorema di integrazione per sostituzione."},{"t":"Controllo di plausibilit&agrave;: la corda da $(0,0)$ a $(1,1)$ misura $\\sqrt2\\approx1.414$. Il valore trovato &egrave; coerente?","opts":[{"x":"$L\\approx1.44>\\sqrt2$: coerente, la curva &egrave; pi&ugrave; lunga della corda","c":true},{"x":"$L\\approx1.44<\\sqrt2$: la curva &egrave; pi&ugrave; corta della corda"},{"x":"$L\\approx0.72$: met&agrave; della corda"}],"hint":"$13\\sqrt{13}\\approx46.87$; poi $(46.87-8)/27$.","sol":"$13\\sqrt{13}\\approx46.87$, quindi $L\\approx38.87/27\\approx1.44$. La lunghezza di un arco &egrave; sempre $\\ge$ della corda che unisce gli estremi (disuguaglianza triangolare in forma integrale): $1.44>1.414$ conferma il conto. Un $L<\\sqrt2$ avrebbe segnalato un errore."}]},{"pool":"curve","src":"tipo curve &middot; da MIT 18.02SC &middot; manuale (cardioide, il valore assoluto in ds)","steps":[{"t":"Cardioide $r(\\theta)=1+\\cos\\theta$, $\\theta\\in[0,2\\pi]$. Imposta $r^2+r'^2$ per la formula polare $ds=\\sqrt{r^2+r'^2}\\,d\\theta$.","opts":[{"x":"$r'=-\\sin\\theta$, $r^2+r'^2=2+2\\cos\\theta$","c":true},{"x":"$r'=-\\sin\\theta$, $r^2+r'^2=1+\\cos\\theta$"},{"x":"$r'=\\cos\\theta$, $r^2+r'^2=2+2\\sin\\theta$"}],"hint":"$(1+\\cos\\theta)^2+\\sin^2\\theta$: sviluppa e usa $\\cos^2+\\sin^2=1$.","sol":"$r'=-\\sin\\theta$, quindi $r^2+r'^2=(1+\\cos\\theta)^2+\\sin^2\\theta=1+2\\cos\\theta+\\cos^2\\theta+\\sin^2\\theta=2+2\\cos\\theta$. Formula della lunghezza in coordinate polari, che discende da $ds^2=dr^2+r^2\\,d\\theta^2$."},{"t":"Semplifica $\\sqrt{2+2\\cos\\theta}$ con la formula di bisezione.","opts":[{"x":"$\\sqrt{2+2\\cos\\theta}=2\\left|\\cos\\tfrac{\\theta}{2}\\right|$","c":true},{"x":"$\\sqrt{2+2\\cos\\theta}=2\\cos\\tfrac{\\theta}{2}$"},{"x":"$\\sqrt{2+2\\cos\\theta}=\\sqrt2\\,\\cos\\tfrac{\\theta}{2}$"}],"hint":"$1+\\cos\\theta=2\\cos^2(\\theta/2)$; la radice di un quadrato &egrave; il MODULO.","sol":"Formula di bisezione $1+\\cos\\theta=2\\cos^2(\\theta/2)$, dunque $2+2\\cos\\theta=4\\cos^2(\\theta/2)$ e $\\sqrt{4\\cos^2(\\theta/2)}=2|\\cos(\\theta/2)|$. La radice quadrata aritmetica &egrave; la determinazione NON negativa: $\\sqrt{x^2}=|x|$, non $x$."},{"t":"PERCH&Eacute; il valore assoluto &egrave; indispensabile e non un formalismo? Dove $\\cos(\\theta/2)$ cambia segno su $[0,2\\pi]$?","opts":[{"x":"$\\theta/2\\in[0,\\pi]$: $\\cos(\\theta/2)\\ge0$ per $\\theta\\in[0,\\pi]$ e $\\le0$ per $\\theta\\in[\\pi,2\\pi]$; senza $|\\cdot|$ l'elemento d'arco diventerebbe negativo, assurdo perch&eacute; $ds\\ge0$","c":true},{"x":"Non cambia mai segno su $[0,2\\pi]$: il valore assoluto &egrave; superfluo"},{"x":"Cambia segno in $\\theta=\\pi/2$, ma non influisce sull'integrale"}],"hint":"$\\cos$ &egrave; positivo fino a $\\pi/2$ del SUO argomento, cio&egrave; fino a $\\theta/2=\\pi/2$, ovvero $\\theta=\\pi$.","sol":"$\\cos(\\theta/2)$ si annulla in $\\theta/2=\\pi/2$, cio&egrave; $\\theta=\\pi$, ed &egrave; $\\ge0$ su $[0,\\pi]$, $\\le0$ su $[\\pi,2\\pi]$. Poich&eacute; $ds=\\|\\gamma'\\|\\,d\\theta\\ge0$ per definizione, su $[\\pi,2\\pi]$ si deve usare $-\\cos(\\theta/2)$: ecco perch&eacute; il modulo non &egrave; decorazione. &Egrave; l'errore che azzera la lunghezza (passo finale)."},{"t":"Calcola $L=\\int_0^{2\\pi}2|\\cos(\\theta/2)|\\,d\\theta$ sfruttando la simmetria.","opts":[{"x":"$L=2\\int_0^{\\pi}2\\cos(\\theta/2)\\,d\\theta=8$","c":true},{"x":"$L=\\int_0^{2\\pi}2\\cos(\\theta/2)\\,d\\theta=0$"},{"x":"$L=4\\pi$"}],"hint":"Su $[0,\\pi]$ il modulo si toglie ($\\cos\\ge0$); la primitiva di $\\cos(\\theta/2)$ &egrave; $2\\sin(\\theta/2)$.","sol":"Per simmetria $L=2\\int_0^\\pi 2\\cos(\\theta/2)\\,d\\theta=4\\big[2\\sin(\\theta/2)\\big]_0^\\pi=4\\cdot2\\,(\\sin\\tfrac\\pi2-0)=8$. Teorema fondamentale del calcolo, dopo aver spezzato il modulo sull'intervallo di positivit&agrave;."},{"t":"Trabocchetto: uno studente ignora il modulo e scrive $\\int_0^{2\\pi}2\\cos(\\theta/2)\\,d\\theta$. Che cosa ottiene, e perch&eacute; svela l'errore?","opts":[{"x":"Ottiene $0$: una lunghezza nulla per una curva non degenere &egrave; assurda, quindi il modulo era obbligatorio","c":true},{"x":"Ottiene $8$ comunque: il modulo non cambia il risultato"},{"x":"Ottiene $16$: il doppio, perch&eacute; conta l'arco due volte"}],"hint":"$\\big[2\\sin(\\theta/2)\\big]_0^{2\\pi}=2(\\sin\\pi-\\sin0)$.","sol":"$\\int_0^{2\\pi}2\\cos(\\theta/2)\\,d\\theta=2\\big[2\\sin(\\theta/2)\\big]_0^{2\\pi}=4(\\sin\\pi-0)=0$. Una lunghezza nulla &egrave; impossibile per una curva con sostegno non puntiforme: il segno negativo di $\\cos(\\theta/2)$ su $[\\pi,2\\pi]$ ha cancellato il contributo positivo. &Egrave; la verifica di coerenza che smaschera l'omissione del valore assoluto ($\\sqrt{x^2}=|x|$)."}]},{"pool":"curve","src":"tipo curve &middot; manuale (campo irrotazionale non conservativo, le due strade)","steps":[{"t":"Campo $F=\\left(\\dfrac{-y}{x^2+y^2},\\ \\dfrac{x}{x^2+y^2}\\right)$ su $\\Omega=\\mathbb{R}^2\\setminus\\{0\\}$. Verifica se &egrave; irrotazionale, cio&egrave; $\\partial_x F_2-\\partial_y F_1=0$.","opts":[{"x":"$\\partial_x F_2=\\partial_y F_1=\\dfrac{y^2-x^2}{(x^2+y^2)^2}$, quindi $\\partial_x F_2-\\partial_y F_1=0$: irrotazionale","c":true},{"x":"$\\partial_x F_2-\\partial_y F_1=\\dfrac{2}{x^2+y^2}\\ne0$: non irrotazionale"},{"x":"Non si pu&ograve; calcolare perch&eacute; $F$ non &egrave; definito nell'origine"}],"hint":"$\\partial_x\\dfrac{x}{x^2+y^2}=\\dfrac{(x^2+y^2)-x\\
