c{-y}{x^2+y^2}=F_1$; $\\ \\partial_yU=\\tfrac{1}{1+(y/x)^2}\\cdot(1/x)=\\tfrac{x}{x^2+y^2}=F_2$. Dunque $\\nabla U=F$: $\\arctan(y/x)$ e' la branca dell'angolo polare monodroma per $x>0$."},{"t":"Morale: il campo e' lo stesso di prima, cosa e' cambiato?","opts":[{"x":"E' cambiato il DOMINIO: su $x>0$ nessun laccio avvolge l'origine, l'ostruzione topologica sparisce e $F$ diventa conservativo","c":true},{"x":"E' cambiato il campo"},{"x":"Nulla, era gia' conservativo"}],"hint":"Su $\\Omega'$ esiste ancora una curva chiusa che avvolge l'origine?","sol":"Il campo e' identico; su $\\Omega'$ nessuna curva chiusa circonda l'origine, quindi ogni circuitazione e' nulla e il potenziale monodromo $\\arctan(y/x)$ esiste. La conservativita' e' proprieta' della COPPIA (campo, dominio), non del solo campo. E' il cuore dell'Es.3 tipico."}]},{"pool":"conserv","src":"tipo E · da Paul's Online / MIT 18.02SC · manuale","steps":[{"t":"$F=(2xy+e^x,\\ x^2+\\cos y)$ su $\\mathbb{R}^2$. Primo passo: e' chiuso?","opts":[{"x":"Si': $\\partial_yF_1=2x=\\partial_xF_2$","c":true},{"x":"No: $\\partial_yF_1=2x$ ma $\\partial_xF_2=2x+\\cos y$"},{"x":"No: la divergenza non e' nulla"}],"hint":"Deriva $F_1$ in $y$ e $F_2$ in $x$.","sol":"$\\partial_y(2xy+e^x)=2x$ e $\\partial_x(x^2+\\cos y)=2x$: uguali su $\\mathbb{R}^2$. <b>Condizione di chiusura</b> soddisfatta (la divergenza e' irrilevante alla conservativita')."},{"t":"Dominio $\\mathbb{R}^2$: posso gia' concludere l'esattezza?","opts":[{"x":"Si': $\\mathbb{R}^2$ e' semplicemente connesso, quindi chiuso $\\Rightarrow$ esatto","c":true},{"x":"No, serve prima costruire $U$"},{"x":"Solo se $F$ e' limitato"}],"hint":"Quale ipotesi topologica rende chiuso $\\Rightarrow$ esatto?","sol":"$\\mathbb{R}^2$ e' convesso, dunque semplicemente connesso: per il <b>teorema (Lemma di Poincare')</b> ogni campo chiuso e' esatto. Un potenziale globale esiste ancor prima di costruirlo."},{"t":"Integra $\\partial_xU=2xy+e^x$ rispetto a $x$.","opts":[{"x":"$U=x^2y+e^x+g(y)$, con $g$ funzione di $y$","c":true},{"x":"$U=x^2y+e^x+C$ con $C$ costante"},{"x":"$U=x^2y+xe^x$"}],"hint":"La 'costante' d'integrazione in $x$ dipende da $y$.","sol":"$\\int(2xy+e^x)\\,dx=x^2y+e^x+g(y)$: $g$ e' costante SOLO rispetto a $x$, quindi funzione di $y$. Ridurla a una costante numerica e' l'errore tipico."},{"t":"Determina $g(y)$ imponendo $\\partial_yU=F_2=x^2+\\cos y$.","opts":[{"x":"$x^2+g'(y)=x^2+\\cos y\\Rightarrow g(y)=\\sin y$, quindi $U=x^2y+e^x+\\sin y$","c":true},{"x":"$g(y)=\\cos y$"},{"x":"$g(y)=-\\sin y$"}],"hint":"Deriva in $y$ la $U$ del passo precedente e confronta con $F_2$.","sol":"$\\partial_yU=x^2+g'(y)$; imponendo $=x^2+\\cos y$ si ha $g'(y)=\\cos y$, dunque $g(y)=\\sin y$ (a meno di costante). Quindi $U=x^2y+e^x+\\sin y$."},{"t":"Passo di verifica (dove si perde l'ultimo punto): controlla $\\nabla U=F$.","opts":[{"x":"$\\partial_xU=2xy+e^x=F_1$ e $\\partial_yU=x^2+\\cos y=F_2$: verificato","c":true},{"x":"$\\partial_yU=x^2-\\cos y\\neq F_2$"},{"x":"Non serve verificare"}],"hint":"Ricalcola entrambe le derivate parziali della $U$ trovata.","sol":"$\\partial_x(x^2y+e^x+\\sin y)=2xy+e^x=F_1$; $\\partial_y(\\cdots)=x^2+\\cos y=F_2$. La <b>verifica $\\nabla U=F$</b> chiude l'esercizio: senza, un errore di segno in $g$ resterebbe invisibile."},{"t":"Calcola il lavoro da $(0,0)$ a $(1,\\pi)$.","opts":[{"x":"$U(1,\\pi)-U(0,0)=(\\pi+e+0)-(0+1+0)=\\pi+e-1$","c":true},{"x":"$\\pi+e+1$"},{"x":"$0$"}],"hint":"$\\sin\\pi=0$, $e^0=1$; ora $U(B)-U(A)$ e' lecito.","sol":"Essendo $F$ conservativo, per il <b>teorema fondamentale degli integrali di linea</b> $W=U(B)-U(A)$. $U(1,\\pi)=\\pi+e^1+\\sin\\pi=\\pi+e$; $U(0,0)=0+e^0+\\sin0=1$. Quindi $W=\\pi+e-1$."}]},{"pool":"conserv","src":"modus operandi · come si attacca un Es.3/Es.4 · manuale","steps":[{"t":"Traccia tipo: 'stabilire se $F$ e' conservativo e, in caso, calcolare il lavoro da $A$ a $B$'. Qual e' il PRIMO passo, prima di ogni calcolo?","opts":[{"x":"Identificare il DOMINIO di $F$ (dove non e' definito) e verificare la chiusura $\\partial_yF_1=\\partial_xF_2$","c":true},{"x":"Costruire subito il potenziale integrando $F_1$"},{"x":"Parametrizzare il cammino"}],"hint":"Serve sapere PRIMA se un potenziale puo' esistere e su quale insieme.","sol":"Ordine corretto: (1) dominio $+$ chiusura. Il dominio dice se e dove il teorema chiuso $\\Rightarrow$ esatto e' applicabile; la chiusura e' la condizione necessaria. Partire dal potenziale ignorando questo e' cio' che fa sbagliare i campi tipo $1/r^2$."},{"t":"La chiusura e' verificata. Come decidi se $F$ e' conservativo?","opts":[{"x":"Guardo il dominio: se e' semplicemente connesso concludo esatto; se ha buchi, controllo la circuitazione attorno ai buchi","c":true},{"x":"E' senz'altro conservativo: chiuso basta"},{"x":"Calcolo la divergenza"}],"hint":"Il ponte chiuso $\\Rightarrow$ esatto ha un'ipotesi sul dominio.","sol":"Chiuso $\\Rightarrow$ esatto vale sui domini semplicemente connessi (<b>Poincare'</b>). Su un dominio bucato la conclusione va testata con $\\oint$ attorno al buco: se qualche circuitazione e' $\\neq0$, non e' conservativo malgrado la chiusura."},{"t":"Concluso che $F$ e' conservativo, come calcoli il lavoro; e se NON lo fosse?","opts":[{"x":"Se conservativo: $W=U(B)-U(A)$ costruendo $U$; se non conservativo: parametrizzo il cammino e integro","c":true},{"x":"In entrambi i casi $U(B)-U(A)$"},{"x":"In entrambi i casi parametrizzo"}],"hint":"La scorciatoia col potenziale esiste solo per i campi che il potenziale ce l'hanno.","sol":"La biforcazione finale: conservativo $\\to$ <b>teorema fondamentale degli integrali di linea</b>, $W=U(B)-U(A)$ indipendente dal cammino; non conservativo $\\to$ nessuna scorciatoia, si parametrizza $\\gamma$ e si integra $\\int_\\gamma F\\cdot d\\mathbf{r}$."}]},{"pool":"conserv","src":"modus operandi · come si DIMOSTRA che un campo non e' conservativo · manuale","steps":[{"t":"Devi dimostrare che $F$ NON e' conservativo. Qual e' la via piu' economica?","opts":[{"x":"Esibire UN solo controesempio: o la chiusura fallisce in un punto, o una curva chiusa con $\\oint_\\gamma F\\cdot d\\mathbf{r}\\neq0$","c":true},{"x":"Verificare $\\oint=0$ su tutte le curve chiuse"},{"x":"Costruire il potenziale e mostrare che diverge"}],"hint":"Negare una proprieta' universale richiede un solo controesempio.","sol":"Conservativo $\\Leftrightarrow$ $\\oint=0$ su OGNI curva chiusa (e $\\Rightarrow$ chiusura ovunque). Per NEGARLO basta un controesempio: una violazione della chiusura oppure una singola circuitazione non nulla."},{"t":"Il campo E' chiuso ma il dominio ha un buco (es. l'angolare $1/r^2$). Quale curva scegli per la circuitazione?","opts":[{"x":"Una che AVVOLGE il buco (tipicamente un cerchio centrato nella singolarita'): li' $\\oint$ puo' essere $\\neq0$","c":true},{"x":"Una curva che non racchiude il buco"},{"x":"Una qualsiasi, il valore non cambia"}],"hint":"Su lacci che non circondano il buco una forma chiusa da' sempre $0$: non provano nulla.","sol":"Su dominio bucato una forma chiusa da' $\\oint=0$ su ogni laccio che NON circonda il buco (li' e' localmente esatta). La firma della non-esattezza sta solo sui lacci che avvolgono la singolarita': il cerchio centrato e' la scelta standard."},{"t":"Distingui i due modi in cui un campo puo' fallire la conservativita'.","opts":[{"x":"(i) chiusura violata $\\Rightarrow$ non conservativo su NESSUN aperto; (ii) chiuso ma dominio non s.c. con $\\oint\\neq0$ $\\Rightarrow$ ostruzione topologica","c":true},{"x":"Sono la stessa cosa"},{"x":"Solo (i) e' possibile"}],"hint":"Uno e' un difetto locale, l'altro globale.","sol":"Difetto LOCALE (chiusura falsa): il campo non e' irrotazionale, nessun potenziale nemmeno locale. Difetto GLOBALE (chiuso ma buco): potenziale locale si', globale no; e' l'<b>indice di avvolgimento</b> a misurarlo. Riconoscere quale dei due e' in gioco decide la strategia."}]},{"pool":"conserv","src":"forma esatta, potenziale e segno fisico F=-grad V · manuale","steps":[{"t":"Una 1-forma $\\omega=F_1\\,dx+F_2\\,dy$ si dice ESATTA quando...","opts":[{"x":"Esiste $U$ con $\\omega=dU$, cioe' $F=\\nabla U$ ($U$ potenziale del campo)","c":true},{"x":"Quando $d\\omega=0$"},{"x":"Quando $F$ e' limitato"}],"hint":"Esatta $\\neq$ chiusa: la chiusura e' $d\\omega=0$.","sol":"<b>Definizione:</b> $\\omega$ esatta $\\Leftrightarrow$ $\\omega=dU$ per qualche $U$ (equivalentemente $F=\\nabla U$). $d\\omega=0$ e' la CHIUSURA, condizione necessaria ma in generale non sufficiente."},{"t":"In fisica la forza conservativa si scrive $F=-\\nabla V$ ($V$ energia potenziale); in analisi $F=\\nabla U$. Che relazione lega $U$ e $V$?","opts":[{"x":"$U=-V$: il potenziale matematico e' l'opposto dell'energia potenziale fisica","c":true},{"x":"$U=V$"},{"x":"$U=V^2$"}],"hint":"Confronta $\\nabla U$ con $-\\nabla V$.","sol":"Da $\\nabla U=F=-\\nabla V$ segue $U=-V$ (a meno di costante). E' una <b>convenzione di segno</b>: la fisica sceglie $V$ crescente contro la forza, l'analisi sceglie $U$ concorde con $F$."},{"t":"Il lavoro della forza da $A$ a $B$ vale allora...","opts":[{"x":"$W=U(B)-U(A)=V(A)-V(B)=-\\Delta V$: il lavoro e' la diminuzione di energia potenziale","c":true},{"x":"$W=V(B)-V(A)$"},{"x":"$W=U(A)-U(B)$"}],"hint":"Sostituisci $U=-V$ in $U(B)-U(A)$.","sol":"$W=\\int_A^B F\\cdot d\\mathbf{r}=U(B)-U(A)=-V(B)+V(A)=-\\Delta V$ (<b>teorema fondamentale degli integrali di linea</b>). Il segno spiega la conservazione dell'energia: $W>0\\Leftrightarrow V$ cala."}]},{"pool":"conserv","src":"il potenziale e' unico a meno di costante (su connesso) · manuale","steps":[{"t":"$U_1,U_2$ sono entrambi potenziali di $F$ su $\\Omega$ connesso. Quanto vale $\\nabla(U_1-U_2)$?","opts":[{"x":"$\\nabla(U_1-U_2)=F-F=0$ su tutto $\\Omega$","c":true},{"x":"$=F$"},{"x":"$=2F$"}],"hint":"Entrambi hanno gradiente $F$.","sol":"$\\nabla U_1=\\nabla U_2=F$ $\\Rightarrow$ $\\nabla(U_1-U_2)=0$ ovunque su $\\Omega$."},{"t":"Da $\\nabla g=0$ su $\\Omega$ CONNESSO cosa segue?","opts":[{"x":"$g$ e' costante: il potenziale e' unico a meno di una costante additiva","c":true},{"x":"$g$ e' lineare"},{"x":"$g$ puo' essere una qualsiasi funzione armonica"}],"hint":"Gradiente nullo su un connesso.","sol":"Su un aperto <b>connesso</b>, gradiente identicamente nullo $\\Rightarrow$ funzione costante (via teorema del valor medio lungo cammini interni). Dunque $U_1=U_2+c$: il potenziale e' definito a meno di costante."},{"t":"E se $\\Omega$ NON e' connesso (due componenti disgiunte)?","opts":[{"x":"$g$ puo' valere costanti DIVERSE su componenti diverse: l'unicita' a meno di UNA costante cade","c":true},{"x":"Nulla cambia"},{"x":"Non esiste potenziale"}],"hint":"Il teorema chiede la connessione: senza, ogni pezzo e' indipendente.","sol":"La connessione e' essenziale: su ciascuna componente $g$ e' costante, ma le costanti sono indipendenti. Su $\\Omega$ con $k$ componenti il potenziale e' determinato a meno di $k$ costanti. E' il motivo per cui 'connesso' compare sempre nell'enunciato."}]},{"pool":"conserv","src":"forma chiusa su dominio bucato: la circuitazione dipende solo dall'avvolgimento · manuale","steps":[{"t":"$\\omega$ e' chiusa su una corona $\\{1<r<2\\}$ (non s.c.). Due curve chiuse $\\gamma_a,\\gamma_b$ nella corona sono OMOTOPE. Che relazione lega $\\oint_{\\gamma_a}\\omega$ e $\\oint_{\\gamma_b}\\omega$?","opts":[{"x":"Sono uguali: per una forma chiusa l'integrale e' invariante per omotopia","c":true},{"x":"Sono opposti"},{"x":"Non c'e' relazione"}],"hint":"La chiusura $d\\omega=0$ piu' Green/Stokes sull'anello tra le due curve.","sol":"<b>Invarianza omotopica</b> della circuitazione di una forma chiusa: se $\\gamma_a,\\gamma_b$ sono omotope, la regione tra loro ha $d\\omega=0$ e per il <b>teorema di Green</b> $\\oint_{\\gamma_a}\\omega-\\oint_{\\gamma_b}\\omega=\\iint d\\omega=0$."},{"t":"Cosa determina allora il valore di $\\oint_\\gamma\\omega$?","opts":[{"x":"Solo la classe di omotopia, cioe' il numero di giri (avvolgimento) attorno al buco: $\\oint=n\\cdot P$","c":true},{"x":"La lunghezza di $\\gamma$"},{"x":"L'area racchiusa"}],"hint":"Curve omotope $\\Rightarrow$ stesso integrale: conta quante volte girano.","sol":"Tutte le curve con lo stesso avvolgimento $n$ danno lo stesso valore $nP$, dove $P=\\oint_{\\text{giro base}}\\omega$ e' il <b>periodo</b> della forma (per l'angolare $P=2\\pi$). E' un invariante topologico, non geometrico."},{"t":"Caso limite: $\\gamma$ e' una curva chiusa nella corona che NON racchiude il buco. Quanto vale $\\oint_\\gamma\\omega$?","opts":[{"x":"$0$: avvolgimento nullo, e li' la forma chiusa e' localmente esatta","c":true},{"x":"$2\\pi$"},{"x":"Indeterminato"}],"hint":"Avvolgimento $n=0$.","sol":"Avvolgimento $0\\Rightarrow\\oint=0\\cdot P=0$. La curva sta in un sottoinsieme s.c. della corona, dove chiuso $\\Rightarrow$ esatto: non basta che il DOMINIO sia bucato, conta se la CURVA circonda il buco."}]},{"pool":"conserv","src":"tipo E - campo 3D con parametro - conto intero: parametro, potenziale, lavoro, verifica, caso limite","steps":[{"t":"Dato $F=(a\\,y^2+z,\\;2xy+z,\\;x+y)$ su $\\mathbb{R}^3$, per quale $a$ il campo &egrave; conservativo?","opts":[{"x":"$a=1$","c":true},{"x":"$a=-1$"},{"x":"$a=0$"},{"x":"per ogni $a\\in\\mathbb{R}$"}],"hint":"Impone $\\nabla\\times F=0$: solo la componente $z$ del rotore dipende da $a$.","sol":"$\\mathbb{R}^3$ &egrave; semplicemente connesso, quindi (teorema inverso / Lemma di Poincar&eacute;) conservativo $\\Leftrightarrow$ irrotazionale. Le componenti $x,y$ del rotore sono gi&agrave; nulle; la $z$ vale $\\partial_xF_2-\\partial_yF_1=2y-2ay=2y(1-a)$, identicamente nulla solo se $a=1$.","cont":"Fissa $a=1$"},{"t":"Con $a=1$, $F=(y^2+z,\\;2xy+z,\\;x+y)$. Cosa garantisce, prima di ogni conto, che un potenziale esista?","opts":[{"x":"$\\mathbb{R}^3$ &egrave; semplicemente connesso e $F$ &egrave; irrotazionale: Lemma di Poincar&eacute;","c":true},{"x":"Basta che $F$ sia continuo"},{"x":"Basta $\\nabla\\cdot F=0$"}],"hint":"Chiuso $\\Rightarrow$ esatto vale solo con la topologia giusta; la divergenza &egrave; un'altra cosa.","sol":"Lemma di Poincar&eacute;: su un aperto semplicemente connesso (qui $\\mathbb{R}^3$, addirittura stellato) una forma chiusa &egrave; esatta. La sola $\\nabla\\cdot F=0$ definisce i campi solenoidali, non i conservativi.","cont":"Costruisci $U$"},{"t":"Costruisci $U$ con $\\nabla U=F$ per integrazioni successive. Quale?","opts":[{"x":"$U=xy^2+xz+yz$","c":true},{"x":"$U=xy^2+xz$"},{"x":"$U=xy^2+xz+yz+xyz$"},{"x":"$U=xy^2-xz+yz$"}],"hint":"Dopo $\\partial_xU=y^2+z$ resta una costante d'integrazione $g(y,z)$: fissala con $\\partial_yU$ e $\\partial_zU$.","sol":"$\\partial_xU=y^2+z\\Rightarrow U=xy^2+xz+g(y,z)$. $\\partial_yU=2xy+g_y=2xy+z\\Rightarrow g_y=z\\Rightarrow g=yz+h(z)$. $\\partial_zU=x+y+h'(z)=x+y\\Rightarrow h'=0$. Quindi $U=xy^2+xz+yz$ (a meno di costante). La variante con $+xyz$ nasce dal dimenticare che $\\partial_x(xyz)=yz$ romperebbe la prima equazione.","cont":"Calcola il lavoro"},{"t":"Lavoro $L=\\int_\\gamma F\\cdot d\\mathbf r$ da $A=(0,0,0)$ a $B=(1,1,1)$ lungo una qualunque curva. Quanto vale?","opts":[{"x":"$L=3$","c":true},{"x":"$L=0$"},{"x":"$L=6$"},{"x":"dipende dalla curva"}],"hint":"Per un campo conservativo $L=U(B)-U(A)$; l'annullarsi vale sulle curve CHIUSE, non fra estremi distinti.","sol":"Teorema fondamentale per gli integrali di linea (campi conservativi): $L=U(B)-U(A)=(1+1+1)-0=3$. Il distrattore $L=0$ &egrave; la trappola classica: la circuitazione &egrave; nulla su curve chiuse, non tra due punti diversi.","cont":"Verifica per via diretta"},{"t":"Verifica su $\\gamma(t)=(t,t,t)$, $t\\in[0,1]$. Il calcolo diretto d&agrave;:","opts":[{"x":"$\\int_0^1(3t^2+4t)\\,dt=3$","c":true},{"x":"$\\int_0^1 3t^2\\,dt=1$"},{"x":"$\\int_0^1(t^2+t)\\,dt=5/6$"}],"hint":"Serve $F(\\gamma(t))\\cdot\\gamma'(t)$ con $\\gamma'=(1,1,1)$.","sol":"$F(\\gamma)=(t^2+t,\\,2t^2+t,\\,2t)$, $\\gamma'=(1,1,1)$, prodotto scalare $=(t^2+t)+(2t^2+t)+2t=3t^2+4t$. $\\int_0^1(3t^2+4t)\\,dt=[t^3+2t^2]_0^1=3$: coincide con $U(B)-U(A)$, come deve.","cont":"Caso limite"},{"t":"Se invece $a=2$ (campo NON conservativo), la circuitazione su una curva chiusa $\\gamma$ nel piano $z=0$:","opts":[{"x":"pu&ograve; essere non nulla: per Green vale $\\iint_D 2y(1-a)\\,dA=-2\\iint_D y\\,dA$","c":true},{"x":"&egrave; sempre nulla comunque"},{"x":"non &egrave; definita"}],"hint":"Con $a\\neq1$ il rotore-$z$ non &egrave; identicamente nullo: usa il teorema di Green.","sol":"Teorema di Green: $\\oint_\\gamma F\\cdot d\\mathbf r=\\iint_D(\\partial_xF_2-\\partial_yF_1)\\,dA=\\iint_D 2y(1-a)\\,dA$; per $a=2$ vale $-2\\iint_D y\\,dA$, non nullo appena il baricentro di $D$ ha $\\bar y\\neq0$. Attenzione: un campo non conservativo pu&ograve; comunque dare circuitazione nulla su curve simmetriche, quindi l'annullarsi su UNA curva non prova la conservativit&agrave;."}]},{"pool":"conserv","src":"tipo E - forma differenziale 2D con parametro - conto intero con verifica a cammino spezzato","steps":[{"t":"La forma $\\omega=(e^x\\cos y+a\\,y)\\,dx+(-e^x\\sin y+x)\\,dy$ &egrave; esatta su $\\mathbb{R}^2$ per quale $a$?","opts":[{"x":"$a=1$","c":true},{"x":"$a=-1$"},{"x":"$a=0$"},{"x":"per ogni $a$"}],"hint":"$\\mathbb{R}^2$ &egrave; convesso: chiusa $\\Leftrightarrow$ esatta. Impone $\\partial_yP=\\partial_xQ$.","sol":"Criterio di chiusura in 2D (+ Lemma di Poincar&eacute; su $\\mathbb{R}^2$ convesso): $\\partial_yP=-e^x\\sin y+a$ e $\\partial_xQ=-e^x\\sin y+1$; uguali per ogni $(x,y)$ solo se $a=1$.","cont":"Fissa $a=1$"},{"t":"Con $a=1$, trova il potenziale $U$ con $dU=\\omega$.","opts":[{"x":"$U=e^x\\cos y+xy$","c":true},{"x":"$U=e^x\\sin y+xy$"},{"x":"$U=e^x\\cos y-xy$"},{"x":"$U=e^x\\cos y+x+y$"}],"hint":"Integra $\\partial_xU=e^x\\cos y+y$ in $x$, poi correggi con $\\partial_yU$.","sol":"$\\partial_xU=e^x\\cos y+y\\Rightarrow U=e^x\\cos y+xy+g(y)$. $\\partial_yU=-e^x\\sin y+x+g'(y)=-e^x\\sin y+x\\Rightarrow g'=0$. Quindi $U=e^x\\cos y+xy$. La variante con $\\sin$ sbaglia $\\int e^x\\cos y\\,dx=e^x\\cos y$ (si integra in $x$, con $\\cos y$ costante).","cont":"Calcola il lavoro"},{"t":"Lavoro da $A=(0,0)$ a $B=(1,\\tfrac{\\pi}{2})$. Quanto vale?","opts":[{"x":"$\\tfrac{\\pi}{2}-1$","c":true},{"x":"$1-\\tfrac{\\pi}{2}$"},{"x":"$\\tfrac{\\pi}{2}$"},{"x":"$\\tfrac{\\pi}{2}+1$"}],"hint":"$L=U(B)-U(A)$; attenzione a $U(A)=e^0\\cos0=1$, non $0$.","sol":"$U(B)=e\\cos\\tfrac{\\pi}{2}+1\\cdot\\tfrac{\\pi}{2}=0+\\tfrac{\\pi}{2}$; $U(A)=e^0\\cos0+0=1$. Per il teorema fondamentale $L=U(B)-U(A)=\\tfrac{\\pi}{2}-1$. Il distrattore $\\tfrac{\\pi}{2}$ dimentica $U(A)=1$; $1-\\tfrac{\\pi}{2}$ inverte gli estremi.","cont":"Verifica a cammino spezzato"},{"t":"Verifica scegliendo il cammino spezzato $A\\to(1,0)\\to B$. Perch&eacute; &egrave; lecito e conveniente?","opts":[{"x":"$\\omega$ esatta $\\Rightarrow$ indipendenza dal cammino; sui tratti assiali un addendo si annulla","c":true},{"x":"perch&eacute; il cammino spezzato d&agrave; sempre un valore diverso"},{"x":"perch&eacute; contano solo i segmenti verticali"}],"hint":"Su un tratto a $y$ costante $dy=0$; su uno a $x$ costante $dx=0$.","sol":"Essendo $\\omega$ esatta, il lavoro dipende solo dagli estremi (indipendenza dal cammino, equivalente alla conservativit&agrave;): si sceglie il cammino che semplifica i conti. Sul tratto orizzontale $dy=0$ resta $P\\,dx$; sul verticale $dx=0$ resta $Q\\,dy$.","cont":"Esegui i due integrali"},{"t":"I due tratti danno rispettivamente:","opts":[{"x":"$\\int_0^1 e^x\\,dx=e-1$ e $\\int_0^{\\pi/2}(-e\\sin y+1)\\,dy=\\tfrac{\\pi}{2}-e$, somma $\\tfrac{\\pi}{2}-1$","c":true},{"x":"$e-1$ e $\\tfrac{\\pi}{2}+e$, somma $\\tfrac{\\pi}{2}+2e-1$"},{"x":"$e$ e $-e$, somma $0$"}],"hint":"Sul primo tratto $y=0\\Rightarrow\\cos y=1,\\ \\sin y=0$; sul secondo $x=1$.","sol":"Tratto 1 ($y=0$, $x:0\\to1$): $\\int_0^1(e^x\\cos0+0)\\,dx=e-1$. Tratto 2 ($x=1$, $y:0\\to\\tfrac{\\pi}{2}$): $\\int_0^{\\pi/2}(-e\\sin y+1)\\,dy=[e\\cos y+y]_0^{\\pi/2}=(0+\\tfrac{\\pi}{2})-(e+0)=\\tfrac{\\pi}{2}-e$. Somma $=(e-1)+(\\tfrac{\\pi}{2}-e)=\\tfrac{\\pi}{2}-1$: conferma $U(B)-U(A)$."}]},{"pool":"conserv","src":"tipo E - variante da Paul's Online (Conservative Vector Fields) - campo con parametro, potenziale, lavoro, verifica, modus operandi","steps":[{"t":"Un campo di forze piano $\\vec F=(2xy^3,\\;k\\,x^2y^2+1)$. Per quale $k$ ammette potenziale su $\\mathbb{R}^2$?","opts":[{"x":"$k=3$","c":true},{"x":"$k=2$"},{"x":"$k=6$"},{"x":"per ogni $k$"}],"hint":"Impone $\\partial_yF_1=\\partial_xF_2$.","sol":"Criterio di chiusura 2D + Poincar&eacute; su $\\mathbb{R}^2$ convesso: $\\partial_yF_1=6xy^2$, $\\partial_xF_2=2k\\,xy^2$; uguali per ogni $(x,y)$ solo se $2k=6$, cio&egrave; $k=3$.","cont":"Fissa $k=3$"},{"t":"Con $k=3$, il potenziale $U$ (con $\\nabla U=\\vec F$) &egrave;:","opts":[{"x":"$U=x^2y^3+y$","c":true},{"x":"$U=x^2y^3$"},{"x":"$U=x^2y^3+x$"},{"x":"$U=2x^2y^3+y$"}],"hint":"$\\partial_xU=2xy^3\\Rightarrow U=x^2y^3+g(y)$; poi usa $\\partial_yU$.","sol":"$\\partial_xU=2xy^3\\Rightarrow U=x^2y^3+g(y)$. $\\partial_yU=3x^2y^2+g'(y)=3x^2y^2+1\\Rightarrow g'=1\\Rightarrow g=y$. Dunque $U=x^2y^3+y$. Dimenticare il termine $+1$ in $F_2$ fa perdere $g=y$.","cont":"Calcola il lavoro"},{"t":"Lavoro da $A=(1,1)$ a $B=(2,3)$:","opts":[{"x":"$L=109$","c":true},{"x":"$L=111$"},{"x":"$L=0$"},{"x":"$L=106$"}],"hint":"$L=U(B)-U(A)$; $U(A)=1+1=2$, non $0$.","sol":"Teorema fondamentale degli integrali di linea: $U(B)=2^2\\cdot3^3+3=108+3=111$; $U(A)=1^2\\cdot1^3+1=2$; $L=111-2=109$. Il distrattore $111$ dimentica $U(A)$; $0$ confonde con la circuitazione su curva chiusa.","cont":"Verifica a cammino spezzato"},{"t":"Verifica sul cammino $A\\to(2,1)\\to B$. I due tratti danno:","opts":[{"x":"$\\int_1^2 2x\\,dx=3$ e $\\int_1^3(12y^2+1)\\,dy=106$, somma $109$","c":true},{"x":"$3$ e $111$, somma $114$"},{"x":"$0$ e $109$"}],"hint":"Tratto 1: $y=1\\Rightarrow F_1=2x$. Tratto 2: $x=2\\Rightarrow F_2=12y^2+1$.","sol":"Tratto 1 ($y=1$, $x:1\\to2$, $dy=0$): $\\int_1^2 2x\\cdot1\\,dx=[x^2]_1^2=3$. Tratto 2 ($x=2$, $y:1\\to3$, $dx=0$): $\\int_1^3(3\\cdot4\\,y^2+1)\\,dy=[4y^3+y]_1^3=(108+3)-(4+1)=106$. Somma $=109$: conferma $U(B)-U(A)$; l'indipendenza dal cammino (campo esatto) autorizza la scelta.","cont":"Modus operandi"},{"t":"Modus operandi: davanti a un campo piano con parametro, qual &egrave; l'ordine corretto delle mosse?","opts":[{"x":"(1) chiusura $\\partial_yP=\\partial_xQ$ per fissare il parametro; (2) controllo topologia dominio; (3) $U$ per integrazioni successive; (4) $L=U(B)-U(A)$; (5) croce-verifica su cammino comodo","c":true},{"x":"parametrizzare subito la curva data e integrare"},{"x":"controllare $\\nabla\\cdot F=0$ e poi integrare"}],"hint":"Il parametro va fissato PRIMA di parlare di potenziale; la divergenza non c'entra con la conservativit&agrave;.","sol":"Ordine efficiente: chiusura (fissa il parametro) $\\to$ topologia del dominio ($\\mathbb{R}^2$ convesso: chiusa $\\Rightarrow$ esatta, Poincar&eacute;) $\\to$ potenziale per integrazioni successive $\\to$ lavoro come differenza di potenziale $\\to$ verifica indipendente. Parametrizzare la curva &egrave; l'ultima risorsa (pi&ugrave; lunga e pi&ugrave; esposta a errori); $\\nabla\\cdot F$ riguarda i solenoidali, non la conservativit&agrave;."}]},{"pool":"conserv","src":"20240122 Es.3 (De Marchis/Terracina) - conservativit&agrave;, potenziale e circuitazione su settore via Green - DISCREPANZA di segno con la stampa ufficiale al punto iii","steps":[{"t":"Campo $F=(2x\\cos(x^2+y)+a\\,xy,\\;\\cos(x^2+y)+x^2+1)$ su $\\mathbb{R}^2$. Per quale $a$ &egrave; conservativo?","opts":[{"x":"$a=2$","c":true},{"x":"$a=1$"},{"x":"$a=0$"},{"x":"per ogni $a$"}],"hint":"Chiusura $\\partial_yF_1=\\partial_xF_2$: i termini in $\\sin$ si elidono.","sol":"$\\partial_yF_1=-2x\\sin(x^2+y)+ax$; $\\partial_xF_2=-2x\\sin(x^2+y)+2x$. Uguali per ogni $(x,y)$ (criterio di chiusura + Poincar&eacute; su $\\mathbb{R}^2$) solo se $ax=2x$, cio&egrave; $a=2$.","cont":"Circuitazione su un settore"},{"t":"Sia $D=\\{0\\le y\\le x,\\ x^2+y^2\\le4\\}$. Per la circuitazione di $F$ (a generico) su $\\partial D$ antioraria conviene:","opts":[{"x":"il teorema di Green: $\\oint_{\\partial D}F\\cdot d\\mathbf r=\\iint_D(\\partial_xF_2-\\partial_yF_1)\\,dA$","c":true},{"x":"integrare $F$ sui tre archi separati"},{"x":"usare il potenziale (che per&ograve; esiste solo se $a=2$)"}],"hint":"$\\partial D$ &egrave; fatta di 3 tratti: parametrizzarli tutti &egrave; lungo e con termini $\\cos(x^2+y)$ ostici.","sol":"Teorema di Green (Stokes nel piano): la circuitazione antioraria &egrave; il flusso del rotore scalare $\\partial_xF_2-\\partial_yF_1$ su $D$. Il potenziale non serve (e per $a\\neq2$ non esiste); i tre archi darebbero integrali di $\\cos(x^2+y)$ scomodi.","cont":"Calcola il rotore scalare"},{"t":"Quanto vale $\\partial_xF_2-\\partial_yF_1$?","opts":[{"x":"$(2-a)\\,x$","c":true},{"x":"$(a-2)\\,x$"},{"x":"$(2-a)$"},{"x":"$0$ sempre"}],"hint":"Gi&agrave; calcolato al passo 1: $\\partial_xF_2=-2x\\sin+2x$, $\\partial_yF_1=-2x\\sin+ax$.","sol":"$\\partial_xF_2-\\partial_yF_1=(-2x\\sin+2x)-(-2x\\sin+ax)=2x-ax=(2-a)x$. Attenzione al segno: la stampa ufficiale dell'appello scrive il fattore $(a-2)$, che &egrave; il segno OPPOSTO; il calcolo diretto d&agrave; $(2-a)x$.","cont":"Integra in coordinate polari"},{"t":"In polari $D=[0,\\tfrac{\\pi}{4}]\\times[0,2]$ (settore). L'integrale $\\iint_D(2-a)x\\,dA$ si riduce a:","opts":[{"x":"$(2-a)\\displaystyle\\int_0^{\\pi/4}\\!\\cos\\theta\\,d\\theta\\int_0^2\\!\\rho^2\\,d\\rho=(2-a)\\tfrac{\\sqrt2}{2}\\cdot\\tfrac{8}{3}$","c":true},{"x":"$(2-a)\\int_0^{\\pi/4}\\!\\sin\\theta\\,d\\theta\\int_0^2\\!\\rho\\,d\\rho$"},{"x":"$(2-a)\\cdot\\pi\\cdot4$"}],"hint":"$x=\\rho\\cos\\theta$ e $dA=\\rho\\,d\\rho\\,d\\theta$: nasce $\\rho^2\\cos\\theta$.","sol":"$x\\,dA=\\rho\\cos\\theta\\cdot\\rho\\,d\\rho\\,d\\theta=\\rho^2\\cos\\theta\\,d\\rho\\,d\\theta$. $\\int_0^2\\rho^2d\\rho=\\tfrac{8}{3}$; $\\int_0^{\\pi/4}\\cos\\theta\\,d\\theta=\\sin\\tfrac{\\pi}{4}=\\tfrac{\\sqrt2}{2}$. Il settore $0\\le y\\le x$ corrisponde a $\\theta\\in[0,\\tfrac{\\pi}{4}]$.","cont":"Risultato e verifica del segno"},{"t":"Il valore finale della circuitazione &egrave;:","opts":[{"x":"$\\dfrac{4\\sqrt2}{3}(2-a)$; per $a=2$ vale $0$, coerente con la conservativit&agrave;","c":true},{"x":"$\\dfrac{4\\sqrt2}{3}(a-2)$, come nella stampa"},{"x":"$\\dfrac{8}{3}$ indipendente da $a$"}],"hint":"$\\tfrac{8}{3}\\cdot\\tfrac{\\sqrt2}{2}=\\tfrac{4\\sqrt2}{3}$; il segno segue $(2-a)$, non $(a-2)$.","sol":"Circuitazione $=(2-a)\\cdot\\tfrac{8}{3}\\cdot\\tfrac{\\sqrt2}{2}=\\dfrac{4\\sqrt2}{3}(2-a)$. Croce-verifica: per $a=2$ (campo conservativo) la circuitazione su curva chiusa &egrave; $0$, come deve. DISCREPANZA: la stampa ufficiale riporta $\\dfrac{4\\sqrt2}{3}(a-2)$ (segno opposto), perch&eacute; l&igrave; il rotore scalare &egrave; trascritto $(a-2)x$; il calcolo corretto d&agrave; $(2-a)x$. In modulo coincidono, il segno no."}]},{"pool":"conserv","src":"20240619 Es.3 iv-v (De Marchis/Terracina) - campo NON conservativo: niente potenziale, circuitazione via Stokes $=15\\pi/8$","steps":[{"t":"Il campo $F=(-x^2y+z,\\;y+z,\\;x^3+y+e^z)$ &egrave; conservativo su $\\mathbb{R}^3$?","opts":[{"x":"No: $\\nabla\\times F=(0,\\,1-3x^2,\\,x^2)\\neq0$","c":true},{"x":"S&igrave;, perch&eacute; $\\mathbb{R}^3$ &egrave; semplicemente connesso"},{"x":"S&igrave;, con potenziale $U=-x^2y/2+\\dots$"}],"hint":"Conservativo $\\Rightarrow$ irrotazionale: basta un termine del rotore non nullo per negarlo.","sol":"$\\nabla\\times F$: componente $i=\\partial_yF_3-\\partial_zF_2=1-1=0$; $j=\\partial_zF_1-\\partial_xF_3=1-3x^2$; $k=\\partial_xF_2-\\partial_yF_1=0-(-x^2)=x^2$. Quindi $\\nabla\\times F=(0,1-3x^2,x^2)\\neq0$: per la contronominale del teorema (conservativo $\\Rightarrow$ irrotazionale) $F$ NON &egrave; conservativo. La semplice connessione di $\\mathbb{R}^3$ non serve se manca l'irrotazionalit&agrave;.","cont":"Conseguenza operativa"},{"t":"$\\Sigma=\\{y\\ge0,\\ 1\\le x^2+y^2\\le4,\\ z=xy\\}$. Per la circuitazione di $F$ su $\\partial\\Sigma$, dato che $F$ non &egrave; conservativo:","opts":[{"x":"niente potenziale: si usa Stokes $\\oint_{\\partial\\Sigma}F\\cdot d\\mathbf r=\\iint_\\Sigma(\\nabla\\times F)\\cdot\\mathbf n\\,d\\sigma$","c":true},{"x":"la circuitazione &egrave; $0$ perch&eacute; $\\partial\\Sigma$ &egrave; chiusa"},{"x":"si integra su $\\partial\\Sigma$ ma il risultato non dipende da $\\Sigma$"}],"hint":"Circuitazione nulla su curve chiuse vale SOLO per campi conservativi.","sol":"Non essendo $F$ conservativo, $\\oint$ su curva chiusa NON &egrave; $0$ in generale e non esiste potenziale. Il teorema di Stokes converte la circuitazione nel flusso del rotore attraverso $\\Sigma$, grafico regolare $z=xy$ sul semianello.","cont":"Proietta il rotore sulla normale"},{"t":"Per il grafico $z=g(x,y)=xy$ con normale a terza componente positiva, $\\mathbf n\\,d\\sigma=(-g_x,-g_y,1)\\,dA=(-y,-x,1)\\,dA$. Quanto vale $(\\nabla\\times F)\\cdot(-y,-x,1)$?","opts":[{"x":"$3x^3+x^2-x$","c":true},{"x":"$x^2$"},{"x":"$-x^2y+x^3$"}],"hint":"$(0,1-3x^2,x^2)\\cdot(-y,-x,1)$: la prima componente &egrave; nulla.","sol":"$(0,1-3x^2,x^2)\\cdot(-y,-x,1)=0\\cdot(-y)+(1-3x^2)(-x)+x^2=-x+3x^3+x^2$. Il termine $z=xy$ del campo NON entra: qui si usa il rotore, non $F$.","cont":"Sfrutta la simmetria"},{"t":"Il dominio $D=\\{y\\ge0,\\ 1\\le x^2+y^2\\le4\\}$ &egrave; simmetrico in $x\\to-x$. Nell'integrale $\\iint_D(3x^3+x^2-x)\\,dA$:","opts":[{"x":"i termini dispari in $x$ ($3x^3$ e $-x$) danno $0$; resta $\\iint_D x^2\\,dA$","c":true},{"x":"si annulla tutto per simmetria"},{"x":"resta $\\iint_D 3x^3\\,dA$"}],"hint":"$D$ dipende solo da $x^2+y^2$ con $y\\ge0$: simmetrico rispetto all'asse $y$; le funzioni dispari in $x$ integrano a zero.","sol":"Su dominio simmetrico rispetto a $x\\to-x$ l'integrale di una funzione dispari in $x$ &egrave; nullo: $3x^3$ e $-x$ spariscono, resta $\\iint_D x^2\\,dA$ (pari). Riconoscere la simmetria PRIMA di integrare risparmia due primitive scomode.","cont":"Integra in polari"},{"t":"In polari ($x^2=\\rho^2\\cos^2\\theta$, $\\theta\\in[0,\\pi]$, $\\rho\\in[1,2]$) la circuitazione vale:","opts":[{"x":"$\\displaystyle\\int_0^\\pi\\cos^2\\theta\\,d\\theta\\int_1^2\\rho^3\\,d\\rho=\\frac{\\pi}{2}\\cdot\\frac{15}{4}=\\frac{15\\pi}{8}$","c":true},{"x":"$\\pi\\cdot\\frac{15}{4}=\\frac{15\\pi}{4}$"},{"x":"$\\frac{\\pi}{2}\\cdot\\frac{15}{3}=\\frac{5\\pi}{2}$"}],"hint":"$x^2\\,dA=\\rho^2\\cos^2\\theta\\cdot\\rho\\,d\\rho\\,d\\theta=\\rho^3\\cos^2\\theta$; $y\\ge0\\Rightarrow\\theta\\in[0,\\pi]$.","sol":"$\\iint_D x^2\\,dA=\\int_0^\\pi\\cos^2\\theta\\,d\\theta\\int_1^2\\rho^3\\,d\\rho$. $\\int_0^\\pi\\cos^2\\theta\\,d\\theta=\\tfrac{\\pi}{2}$; $\\int_1^2\\rho^3d\\rho=\\tfrac{16-1}{4}=\\tfrac{15}{4}$. Prodotto $=\\dfrac{15\\pi}{8}$: circuitazione con normale a terza componente positiva (orientazione richiesta)."}]},{"pool":"conserv","src":"tipo E - modus operandi - albero decisionale per un integrale di linea 2D: quale strada scegliere e in che ordine","steps":[{"t":"Davanti a $\\int_\\gamma F\\cdot d\\mathbf r$ (campo piano), qual &egrave; la PRIMA domanda da porsi?","opts":[{"x":"$F$ &egrave; chiuso ($\\partial_yP=\\partial_xQ$) e su quale dominio &egrave; definito?","c":true},{"x":"quanto &egrave; lunga $\\gamma$"},{"x":"$\\nabla\\cdot F=0$?"}],"hint":"La conservativit&agrave; dipende da chiusura + topologia del dominio, non dalla curva.","sol":"Prima si testa la chiusura ($\\partial_yP=\\partial_xQ$, criterio necessario) e si guarda il DOMINIO. La lunghezza di $\\gamma$ &egrave; irrilevante; $\\nabla\\cdot F$ (solenoidalit&agrave;) non c'entra con la conservativit&agrave;.","cont":"Caso chiuso, dominio buono"},{"t":"$F$ &egrave; chiuso e il dominio &egrave; semplicemente connesso (es. tutto $\\mathbb{R}^2$). Come procedi?","opts":[{"x":"$F$ &egrave; conservativo (Poincar&eacute;): trovo $U$ e uso $L=U(B)-U(A)$; se $\\gamma$ &egrave; chiusa, $L=0$","c":true},{"x":"applico comunque Green"},{"x":"parametrizzo $\\gamma$: &egrave; l'unico modo sicuro"}],"hint":"Chiuso + semplicemente connesso $=$ esatto: sfrutta il potenziale.","sol":"Lemma di Poincar&eacute;: chiuso su semplicemente connesso $\\Rightarrow$ esatto. Si costruisce il potenziale e si usa il teorema fondamentale $L=U(B)-U(A)$ (con $L=0$ su curve chiuse): la strada pi&ugrave; rapida e meno esposta a errori.","cont":"Caso chiuso, dominio bucato"},{"t":"$F$ &egrave; chiuso ma il dominio ha un buco (es. $\\mathbb{R}^2\\setminus\\{0\\}$, campo angolare). Su una curva chiusa $\\gamma$:","opts":[{"x":"$\\oint_\\gamma$ dipende SOLO dal numero di avvolgimenti attorno al buco; per il campo angolare vale $2\\pi n$","c":true},{"x":"$\\oint_\\gamma=0$ perch&eacute; $F$ &egrave; chiuso"},{"x":"non &egrave; calcolabile"}],"hint":"Chiuso su dominio NON semplicemente connesso non basta per l'esattezza.","sol":"Su dominio non semplicemente connesso chiuso $\\not\\Rightarrow$ esatto: la circuitazione &egrave; un invariante di omotopia e dipende dall'indice di avvolgimento. Per il campo angolare $\\tfrac{(-y,x)}{x^2+y^2}$ vale $2\\pi n$, con $n$ numero di giri attorno all'origine.","cont":"Caso non chiuso"},{"t":"$F$ NON &egrave; chiuso ($\\partial_yP\\neq\\partial_xQ$). Ultima riga dell'albero:","opts":[{"x":"se $\\gamma$ &egrave; chiusa uso Green ($\\iint_D(\\partial_xQ-\\partial_yP)$); se &egrave; aperta parametrizzo $\\gamma$ direttamente","c":true},{"x":"cerco comunque un potenziale"},{"x":"la circuitazione &egrave; sempre $2\\pi$"}],"hint":"Niente potenziale se non &egrave; chiuso: restano Green (curva chiusa) o il calcolo diretto (curva aperta).","sol":"Campo non chiuso $=$ non conservativo: il potenziale non esiste. Su curva CHIUSA conviene Green (flusso del rotore scalare sul dominio racchiuso); su curva APERTA non resta che parametrizzare $\\gamma$ e integrare $\\int_a^b F(\\gamma(t))\\cdot\\gamma'(t)\\,dt$."}]}],"diff":[{"pool":"diff","src":"tipo C · manuale · gerarchia","steps":[{"t":"Nell'origine una funzione può essere continua e avere entrambe le derivate parziali, ma NON essere differenziabile?","opts":[{"x":"Sì: l'esistenza delle parziali (derivabilità) non implica la differenziabilità","c":true},{"x":"No: se le parziali esistono, $f$ è differenziabile"},{"x":"No: se $f$ è continua e derivabile è automaticamente differenziabile"},{"x":"Sì, ma solo se $f$ non è continua"}],"hint":"La catena corretta è $C^1\\Rightarrow$ differenziabile $\\Rightarrow$ (continua $\\wedge$ derivabile). Le frecce non si invertono.","sol":"Derivabile $\\not\\Rightarrow$ differenziabile. La differenziabilità chiede che il resto $\\dfrac{f(x,y)-f(0,0)-\\nabla f(0,0)\\cdot(x,y)}{\\|(x,y)\\|}\\to 0$: è più forte della sola esistenza delle due parziali. Controesempi tipici: 20230123, 20220622 con $\\alpha\\le 1$."}]},{"pool":"diff","src":"tipo C · manuale · diff ⇒ continua","steps":[{"t":"$f$ è differenziabile in $(0,0)$. Cosa si può concludere sulla continuità?","opts":[{"x":"$f$ è continua in $(0,0)$: la differenziabilità implica la continuità","c":true},{"x":"Nulla: differenziabilità e continuità sono indipendenti"},{"x":"$f$ è continua solo se in più le parziali sono continue"},{"x":"$f$ potrebbe essere discontinua se $\\nabla f(0,0)=0$"}],"hint":"Scrivi $f(h)-f(0,0)=\\nabla f(0,0)\\cdot h+o(\\|h\\|)$ e fai $h\\to 0$.","sol":"Per definizione $f(h)=f(0,0)+\\nabla f(0,0)\\cdot h+o(\\|h\\|)$. Per $h\\to 0$ il termine lineare e il resto tendono a $0$, quindi $f(h)\\to f(0,0)$: continua. Differenziabile $\\Rightarrow$ continua. Il viceversa è falso."}]},{"pool":"diff","src":"tipo C · manuale · diff ⇒ direzionali","steps":[{"t":"Se $f$ è differenziabile in $(0,0)$, cosa vale per le derivate direzionali $\\partial_v f(0,0)$?","opts":[{"x":"Esistono per OGNI versore $v$ e valgono $\\partial_v f(0,0)=\\nabla f(0,0)\\cdot v$ (lineari in $v$)","c":true},{"x":"Esistono solo lungo gli assi coordinati"},{"x":"Esistono ma in generale non sono legate a $\\nabla f$"},{"x":"Possono non esistere anche se $f$ è differenziabile"}],"hint":"La differenziabilità dà l'approssimazione lineare $f(tv)-f(0)=t\\,\\nabla f\\cdot v+o(t)$; dividi per $t$.","sol":"$f(tv)=f(0,0)+t\\,\\nabla f(0,0)\\cdot v+o(t)$, quindi $\\dfrac{f(tv)-f(0,0)}{t}\\to\\nabla f(0,0)\\cdot v$. Tutte le direzionali esistono e sono la funzione LINEARE $v\\mapsto\\nabla f\\cdot v$. È la forma forte del teorema: diff. $\\Rightarrow$ direzionali $=\\nabla f\\cdot v$."}]},{"pool":"diff","src":"20230907 Es.1 · direzionali ⇏ diff","steps":[{"t":"In $(0,0)$ le derivate direzionali $\\partial_v f$ esistono per ogni versore $v$. Segue che $f$ è differenziabile?","opts":[{"x":"No: l'esistenza di tutte le direzionali non implica la differenziabilità (né la continuità)","c":true},{"x":"Sì: è la definizione di differenziabilità"},{"x":"Sì, se $\\partial_v f=\\nabla f\\cdot v$ per almeno due versori"},{"x":"Sì, purché $f$ sia continua in $(0,0)$"}],"hint":"L'implicazione buona va nell'altro verso. Esistono funzioni con TUTTE le direzionali eppure non differenziabili, e persino non continue.","sol":"Diff. $\\Rightarrow\\partial_v f=\\nabla f\\cdot v$ per ogni $v$; il viceversa è falso. Le direzionali possono esistere una per una senza essere lineari in $v$ e senza dare la vera approssimazione lineare. Es. 20230907: $f$ derivabile, con direzionali, ma non differenziabile."}]},{"pool":"diff","src":"tipo C · manuale · differenziale totale","steps":[{"t":"Se le derivate parziali $f_x,f_y$ esistono in un intorno di $(0,0)$ e sono CONTINUE in $(0,0)$, allora:","opts":[{"x":"$f$ è differenziabile in $(0,0)$ (Teorema del differenziale totale): è una condizione SUFFICIENTE","c":true},{"x":"$f$ è differenziabile: è condizione necessaria e sufficiente"},{"x":"$f$ è solo continua, ma non necessariamente differenziabile"},{"x":"nulla, serve calcolare il limite del resto in ogni caso"}],"hint":"$C^1$ è più forte della differenziabilità: la implica ma non è implicata. Esistono funzioni differenziabili con parziali discontinue.","sol":"Teorema del differenziale totale: $f_x,f_y$ continue in un intorno $\\Rightarrow f$ differenziabile lì. È SUFFICIENTE, non necessaria: $f(x,y)=(x^2+y^2)\\sin\\frac{1}{\\sqrt{x^2+y^2}}$ è differenziabile in $0$ ma con parziali discontinue. In pratica: se la formula esplicita è $C^1$ vicino (ma fuori) all'origine, resta da controllare SOLO l'origine col limite del resto."}]},{"pool":"diff","src":"tipo C · manuale · continua ⇏ derivabile","steps":[{"t":"Quali di queste implicazioni sono FALSE in generale, in un punto?","opts":[{"x":"«continua $\\Rightarrow$ derivabile» e «derivabile $\\Rightarrow$ continua»: entrambe false","c":true},{"x":"solo «continua $\\Rightarrow$ derivabile» è falsa"},{"x":"nessuna: sono tutte vere"},{"x":"«differenziabile $\\Rightarrow$ continua» è falsa"}],"hint":"L'esistenza delle parziali guarda solo lungo gli assi: non vede cosa fa $f$ nelle altre direzioni, quindi non garantisce continuità.","sol":"Continua $\\not\\Rightarrow$ derivabile (es. $|x|+|y|$ ha parziali non definite in $0$). Derivabile $\\not\\Rightarrow$ continua: $f=\\frac{xy}{x^2+y^2}$, $f(0,0)=0$, ha $f_x(0,0)=f_y(0,0)=0$ (è nulla sugli assi) ma NON è continua in $0$. Le uniche frecce sempre vere partono dalla differenziabilità."}]},{"pool":"diff","src":"tipo C · manuale · definizione","steps":[{"t":"Qual è la definizione corretta di «$f$ differenziabile in $(0,0)$»?","opts":[{"x":"$\\lim_{(x,y)\\to(0,0)}\\dfrac{f(x,y)-f(0,0)-f_x(0,0)x-f_y(0,0)y}{\\sqrt{x^2+y^2}}=0$","c":true},{"x":"esistono $f_x(0,0)$ e $f_y(0,0)$"},{"x":"$f$ è continua e ammette derivate direzionali in ogni direzione"},{"x":"$\\lim_{(x,y)\\to(0,0)}\\big(f(x,y)-f(0,0)-f_x(0,0)x-f_y(0,0)y\\big)=0$"}],"hint":"L'ultima opzione dimentica di dividere per $\\|(x,y)\\|$: senza quel denominatore chiedi solo la continuità, non la differenziabilità.","sol":"$f$ è differenziabile in $(0,0)$ sse il resto dell'approssimazione lineare è $o(\\|(x,y)\\|)$, cioè il rapporto col $\\sqrt{x^2+y^2}$ tende a $0$. Il gradiente $\\big(f_x(0,0),f_y(0,0)\\big)$ va prima calcolato dalla definizione. Togliere il denominatore riduce tutto alla sola continuità."}]},{"pool":"diff","src":"tipo C · manuale · parziali dalla definizione","steps":[{"t":"Per $f$ definita a tratti ($f(0,0)=0$ e una formula col quoziente per $(x,y)\\ne 0$), come si calcola $f_x(0,0)$?","opts":[{"x":"dal rapporto incrementale $f_x(0,0)=\\lim_{h\\to 0}\\dfrac{f(h,0)-f(0,0)}{h}$","c":true},{"x":"derivando la formula esplicita con la regola del quoziente e valutando in $(0,0)$"},{"x":"$f_x(0,0)=0$ perché $f(0,0)=0$"},{"x":"applicando la regola della catena all'espressione del numeratore"}],"hint":"La formula esplicita vale solo FUORI dall'origine: derivarla e valutarla in $(0,0)$ è un errore, quel valore non è la derivata parziale nel punto.","sol":"Nel punto di raccordo la parziale è per definizione il limite del rapporto incrementale lungo l'asse: $f_x(0,0)=\\lim_{h\\to 0}\\frac{f(h,0)-f(0,0)}{h}$. Le regole di derivazione presuppongono che valga la stessa formula in un intorno, cosa falsa in $(0,0)$ per una funzione spezzata (trappola 20230907, 14feb25)."}]},{"pool":"diff","src":"20230907 Es.1 · formula del gradiente","steps":[{"t":"La formula $\\partial_v f(0,0)=\\nabla f(0,0)\\cdot v$ (derivata direzionale = gradiente per il versore):","opts":[{"x":"vale SOLO se $f$ è differenziabile in $(0,0)$; se non lo è, va calcolata dalla definizione","c":true},{"x":"vale sempre, appena esistono $f_x(0,0)$ e $f_y(0,0)$"},{"x":"vale se $f$ è continua in $(0,0)$"},{"x":"vale se esistono tutte le derivate direzionali"}],"hint":"Usare $\\nabla f\\cdot v$ quando $f$ non è differenziabile è l'errore più insidioso: le direzionali possono esistere ma NON essere lineari in $v$.","sol":"La linearità $\\partial_v f=\\nabla f\\cdot v$ è una CONSEGUENZA della differenziabilità, non della sola derivabilità. Senza differenziabilità le direzionali si calcolano una per una come $\\lim_{t\\to 0}\\frac{f(tv)-f(0,0)}{t}$ e in genere non seguono la formula del gradiente."}]},{"pool":"diff","src":"20230504 Es.1 · soglie diverse","steps":[{"t":"Per la stessa funzione a parametro, la soglia del parametro per la DIFFERENZIABILITÀ rispetto a quella per la CONTINUITÀ è:","opts":[{"x":"più restrittiva: la differenziabilità aggiunge un fattore $\\|(x,y)\\|$ al denominatore","c":true},{"x":"identica: continuità e differenziabilità danno la stessa soglia"},{"x":"meno restrittiva: differenziabile è più facile che continuo"},{"x":"senza relazione fissa tra le due"}],"hint":"Continuità: studi $|f|$. Differenziabilità: studi $|f|/\\rho$. Il $\\rho$ in più abbassa di uno l'esponente netto, quindi alza la richiesta sul parametro.","sol":"In polari $|f|\\sim\\rho^{p-2\\beta}$: continua $\\iff p-2\\beta>0$. Per la differenziabilità (con $\\nabla f(0,0)=0$) si studia $\\frac{|f|}{\\rho}\\sim\\rho^{p-1-2\\beta}$: diff. $\\iff p-1-2\\beta>0$, soglia più stretta. Es. 20230504: continua $\\beta<5/2$, differenziabile $\\beta<2$. Non confondere le due soglie."}]},{"pool":"diff","src":"20230123 Es.1 · negare la differenziabilità","steps":[{"t":"Per DIMOSTRARE che $f$ (con $\\nabla f(0,0)=0$) non è differenziabile in $(0,0)$, cosa basta e cosa NON basta?","opts":[{"x":"Basta una direzione lungo cui $f/\\rho$ non tende a $0$; NON basta controllare solo gli assi","c":true},{"x":"Basta verificare che $f$ è discontinua sugli assi"},{"x":"Bisogna verificare il limite lungo tutte le rette per concludere che è differenziabile"},{"x":"Basta che $f_x(0,0)\\ne f_y(0,0)$"}],"hint":"Per NEGARE serve un solo controesempio di direzione. Per AFFERMARE serve invece una stima uniforme in $\\theta$: gli assi da soli non bastano mai.","sol":"Il resto è $\\frac{f(x,y)-\\nabla f\\cdot(x,y)}{\\rho}$. Se lungo UNA direzione (tipicamente $y=x$) questo tende a una costante $\\ne 0$, il limite globale non è $0$: non differenziabile. Sugli assi $f$ è spesso nulla, quindi controllare solo gli assi non vede la patologia (trappola 20230123)."}]},{"pool":"diff","src":"20220622 Es.1 · dicotomia |t|^α/t","steps":[{"t":"Studiando una derivata direzionale compare $\\lim_{t\\to 0}\\dfrac{|t|^\\alpha}{t}$ (con $\\alpha>0$). Quando esiste finito?","opts":[{"x":"vale $0$ se $\\alpha>1$; se $\\alpha=1$ i limiti destro/sinistro sono $\\pm 1$ (finiti ma diversi); se $\\alpha<1$ diverge","c":true},{"x":"esiste sempre e vale $0$"},{"x":"esiste finito solo se $\\alpha<1$"},{"x":"non esiste mai, per la presenza di $|t|$"}],"hint":"Scrivi $\\frac{|t|^\\alpha}{t}=\\operatorname{sgn}(t)\\,|t|^{\\alpha-1}$: tutto dipende dal segno di $\\alpha-1$.","sol":"$\\frac{|t|^\\alpha}{t}=\\operatorname{sgn}(t)\\,|t|^{\\alpha-1}$. Se $\\alpha>1\\Rightarrow 0$; se $\\alpha=1\\Rightarrow\\pm 1$ (esiste come limite unilaterale, non bilaterale); se $\\alpha<1\\Rightarrow\\pm\\infty$. Questa dicotomia governa l'esistenza delle derivate direzionali nei problemi a parametro (20220622)."}]},{"pool":"diff","src":"tipo C · manuale · stima uniforme in θ","steps":[{"t":"In coordinate polari si ottiene $|f|\\le C(\\theta)\\,\\rho^{\\,p}$ con $p>0$. Quando questo garantisce $f\\to 0$?","opts":[{"x":"se la costante $C(\\theta)$ è LIMITATA in $\\theta$ (stima uniforme); allora $|f|\\le C_{\\max}\\rho^p\\to 0$","c":true},{"x":"sempre, perché $\\rho^p\\to 0$"},{"x":"mai: in polari non si può concludere nulla sui limiti"},{"x":"solo se $f$ non dipende da $\\theta$"}],"hint":"Se $C(\\theta)$ potesse esplodere per certi $\\theta$, il prodotto $C(\\theta)\\rho^p$ non tenderebbe uniformemente a $0$ e il limite direzionale potrebbe cambiare.","sol":"Il limite $(x,y)\\to 0$ è $\\rho\\to 0$ per OGNI $\\theta$: serve che il maggiorante $C(\\theta)\\rho^p$ vada a $0$ indipendentemente da $\\theta$. Se $\\sup_\\theta C(\\theta)=C_{\\max}<\\infty$, allora $|f|\\le C_{\\max}\\rho^p\\to 0$. Se invece il rapporto tende a $g(\\theta)\\ne$ cost., il limite NON esiste (dipende dalla direzione)."}]},{"pool":"diff","src":"14feb25 Es.2 · il gradiente all'origine","steps":[{"t":"Prima di scrivere il quoziente della differenziabilità, il vettore $\\nabla f(0,0)=\\big(f_x(0,0),f_y(0,0)\\big)$:","opts":[{"x":"va calcolato dalla definizione (rapporti incrementali sugli assi); solo dopo entra nel resto $f-\\nabla f\\cdot(x,y)$","c":true},{"x":"è sempre $(0,0)$ per le funzioni spezzate"},{"x":"si legge dai coefficienti dei termini lineari della formula esplicita"},{"x":"non serve: la differenziabilità non usa il gradiente"}],"hint":"Molte funzioni sono nulle sugli assi $\\Rightarrow\\nabla f(0,0)=0$, ma NON tutte: es. 14feb25 ha $f_x(0,0)=1$, $f_y(0,0)=2$.","sol":"Il resto da studiare è $\\frac{f(x,y)-f(0,0)-f_x(0,0)x-f_y(0,0)y}{\\rho}$: servono i veri $f_x(0,0),f_y(0,0)$ dal limite del rapporto incrementale. Assumerli $=0$ è corretto solo se $f$ è nulla sugli assi. In 14feb25 valgono $1$ e $2$: sbagliarli falsa tutto il numeratore."}]},{"pool":"diff","src":"20230621 Es.1 · due termini","steps":[{"t":"$f=g_1+g_2$, con $g_1$ differenziabile in $(0,0)$ sse $\\beta<5/2$ e $g_2$ differenziabile sse $\\beta>1/2$. Per quali $\\beta$ è differenziabile $f$?","opts":[{"x":"$1/2<\\beta<5/2$: serve che ENTRAMBI i termini siano differenziabili (intersezione)","c":true},{"x":"$\\beta<5/2$: basta il termine con la soglia più ampia"},{"x":"$\\beta>1/2$: basta un termine differenziabile"},{"x":"ogni $\\beta>0$: la somma è sempre differenziabile"}],"hint":"La differenziabilità è stabile per somma: $f$ diff. se e solo se lo sono tutti gli addendi. Prendi l'intersezione, cioè la condizione più restrittiva.","sol":"Somma di differenziabili è differenziabile; e se $g_1$ diff. e $f=g_1+g_2$ diff., allora $g_2=f-g_1$ diff. Quindi $f$ diff. $\\iff$ $g_1$ e $g_2$ entrambi diff. $\\iff 1/2<\\beta<5/2$. Non basta che uno solo lo sia (trappola 20230621)."}]},{"pool":"diff","src":"tipo C · manuale · significato geometrico","steps":[{"t":"Che cosa aggiunge la differenziabilità in $(0,0)$ rispetto alla sola esistenza delle parziali?","opts":[{"x":"l'esistenza di un piano tangente che approssima $f$ con errore $o(\\|(x,y)\\|)$ in TUTTE le direzioni","c":true},{"x":"solo la continuità di $f$"},{"x":"l'esistenza delle derivate seconde"},{"x":"nulla di geometrico: è solo una condizione algebrica sulle parziali"}],"hint":"Le parziali danno le pendenze lungo due direzioni. La differenziabilità chiede che il piano costruito con quelle pendenze approssimi bene $f$ ovunque intorno.","sol":"Differenziabilità $=$ esistenza dell'applicazione lineare $L(h)=\\nabla f(0,0)\\cdot h$ (il piano tangente $z=f(0,0)+\\nabla f\\cdot h$) con $f(h)-f(0,0)-L(h)=o(\\|h\\|)$. Le parziali fissano i coefficienti di $L$; la differenziabilità certifica che $L$ approssima $f$ in ogni direzione, non solo lungo gli assi."}]},{"pool":"diff","src":"20250214 / 14feb25 Es.2 · $f_x$ dalla definizione","steps":[{"t":"Sia $f(x,y)=\\dfrac{\\sin(x^3y^2)+x^3+2y^3}{x^2+y^2}$ per $(x,y)\\ne(0,0)$, $f(0,0)=0$. Quanto vale $f_x(0,0)$?","opts":[{"x":"$f_x(0,0)=\\lim_{h\\to 0}\\dfrac{f(h,0)}{h}=\\lim_{h\\to 0}\\dfrac{h^3/h^2}{h}=1$","c":true},{"x":"si deriva la formula con la regola del quoziente e si valuta in $(0,0)$"},{"x":"$f_x(0,0)=0$ perché $f(0,0)=0$"},{"x":"$f_x(0,0)$ non esiste"}],"hint":"Metti $y=0$: molti termini spariscono. La parziale nell'origine è il limite del rapporto incrementale lungo l'asse $x$, non la derivata della formula.","sol":"$f(h,0)=\\frac{\\sin 0+h^3+0}{h^2}=\\frac{h^3}{h^2}=h$, quindi $\\frac{f(h,0)}{h}=1\\to 1$: $f_x(0,0)=1$. Definizione di derivata parziale come limite del rapporto incrementale; la regola del quoziente non vale in $(0,0)$ (formula spezzata). Src 14feb25 es.2."}]},{"pool":"diff","src":"14feb25 Es.2 · $f_y$ dalla definizione","steps":[{"t":"Per la stessa $f(x,y)=\\dfrac{\\sin(x^3y^2)+x^3+2y^3}{x^2+y^2}$, $f(0,0)=0$, quanto vale $f_y(0,0)$?","opts":[{"x":"$f_y(0,0)=\\lim_{k\\to 0}\\dfrac{f(0,k)}{k}=\\lim_{k\\to 0}\\dfrac{2k^3/k^2}{k}=2$","c":true},{"x":"$f_y(0,0)=1$, come $f_x(0,0)$"},{"x":"$f_y(0,0)=0$"},{"x":"$f_y(0,0)=3$, dal coefficiente di $y^3$"}],"hint":"Metti $x=0$: resta solo il termine $2y^3$ al numeratore. Poi rapporto incrementale sull'asse $y$.","sol":"$f(0,k)=\\frac{0+0+2k^3}{k^2}=2k$, quindi $\\frac{f(0,k)}{k}=2\\to 2$: $f_y(0,0)=2$. Definizione di parziale lungo l'asse $y$. Quindi $\\nabla f(0,0)=(1,2)\\ne(0,0)$: attenzione, questa funzione NON è nulla sugli assi. Src 14feb25 es.2."}]},{"pool":"diff","src":"20220622 Es.1 · continuità (soglia $\\alpha$)","steps":[{"t":"Sia $f(x,y)=\\dfrac{|y|^\\alpha\\tan(x^4)}{(x^2+y^2)^2}$, $f(0,0)=0$. Per quali $\\alpha>0$ è CONTINUA in $(0,0)$?","opts":[{"x":"ogni $\\alpha>0$: $|f|\\le\\dfrac{\\rho^\\alpha\\,\\rho^4}{\\rho^4}=\\rho^\\alpha\\to 0$","c":true},{"x":"$\\alpha>1$"},{"x":"$\\alpha>2$"},{"x":"$\\alpha>4$"}],"hint":"Usa $\\tan(x^4)\\sim x^4$, $|y|\\le\\rho$, $x^4\\le\\rho^4$, $(x^2+y^2)^2=\\rho^4$. Conta gli esponenti netti di $\\rho$.","sol":"Vicino all'origine $\\tan(x^4)\\sim x^4$, quindi $|f|\\le\\frac{|y|^\\alpha x^4}{\\rho^4}\\le\\frac{\\rho^\\alpha\\rho^4}{\\rho^4}=\\rho^\\alpha$. La stima è uniforme in $\\theta$ e $\\rho^\\alpha\\to 0$ per ogni $\\alpha>0$: continua. Criterio: $|f|\\le C\\rho^p$ con $p>0\\Rightarrow$ limite $0$. Src 20220622 es.1."}]},{"pool":"diff","src":"20220622 Es.1 · differenziabilità (soglia $\\alpha$)","steps":[{"t":"Per la stessa $f=\\dfrac{|y|^\\alpha\\tan(x^4)}{(x^2+y^2)^2}$, sapendo che $f\\equiv 0$ sugli assi (quindi $\\nabla f(0,0)=0$), per quali $\\alpha$ è DIFFERENZIABILE in $(0,0)$?","opts":[{"x":"$\\alpha>1$: si studia $\\dfrac{|f|}{\\rho}\\le\\dfrac{\\rho^\\alpha\\rho^4}{\\rho^5}=\\rho^{\\alpha-1}\\to 0\\iff\\alpha>1$","c":true},{"x":"ogni $\\alpha>0$, come la continuità"},{"x":"$\\alpha>2$"},{"x":"$\\alpha>1/2$"}],"hint":"Con $\\nabla f(0,0)=0$ il resto è $f/\\rho$: rispetto alla continuità c'è un $\\rho$ in più al denominatore, quindi la soglia sale.","sol":"Con $\\nabla f(0,0)=0$ il quoziente della differenziabilità è $\\frac{|f-0|}{\\rho}=\\frac{|f|}{\\rho}\\le\\frac{\\rho^{\\alpha+4}}{\\rho^5}=\\rho^{\\alpha-1}\\to 0\\iff\\alpha>1$. Definizione di differenziabilità (resto $o(\\rho)$). Soglia $\\alpha>1$, più restrittiva della continuità $\\alpha>0$. Src 20220622 es.1."}]},{"pool":"diff","src":"20230504 Es.1 · continuità → differenziabilità","steps":[{"t":"Sia $f(x,y)=\\dfrac{\\sin y\\,(1-\\cos(xy))}{(x^2+y^2)^\\beta}$, $f(0,0)=0$, con numeratore $\\sim\\tfrac12 x^2y^3$. Per quali $\\beta$ è CONTINUA in $(0,0)$?","opts":[{"x":"$\\beta<5/2$: in polari $|f|\\sim\\rho^{\\,5-2\\beta}\\to 0\\iff 5-2\\beta>0$","c":true},{"x":"$\\beta<2$"},{"x":"$\\beta<5$"},{"x":"ogni $\\beta>0$"}],"hint":"Il numeratore è $O(\\rho^5)$, il denominatore $\\rho^{2\\beta}$: la continuità chiede esponente netto positivo.","sol":"$\\sin y\\sim y$, $1-\\cos(xy)\\sim\\frac{(xy)^2}{2}$: numeratore $\\sim\\frac12 x^2y^3=O(\\rho^5)$. Quindi $|f|\\sim\\rho^{5-2\\beta}\\to 0\\iff\\beta<5/2$. Soglia di CONTINUITÀ $\\beta<5/2$. Src 20230504 es.1.","cont":"Continua &rarr; ora la differenziabilità"},{"t":"Per la stessa $f$ (con $\\nabla f(0,0)=(0,0)$), la soglia di DIFFERENZIABILITÀ coincide con $\\beta<5/2$?","opts":[{"x":"No: si studia $\\dfrac{|f|}{\\rho}\\sim\\rho^{\\,4-2\\beta}\\to 0\\iff\\beta<2$, soglia più restrittiva","c":true},{"x":"Sì, coincidono: $\\beta<5/2$"},{"x":"Sì, $\\beta<5$"},{"x":"La differenziabilità vale ovunque c'è continuità"}],"hint":"La differenziabilità aggiunge il $\\|(x,y)\\|=\\rho$ del resto al denominatore: l'esponente netto cala di $1$.","sol":"Con $\\nabla f(0,0)=0$: $\\frac{|f|}{\\rho}\\sim\\rho^{4-2\\beta}\\to 0\\iff\\beta<2$. Soglia di DIFFERENZIABILITÀ $\\beta<2<5/2$: strettamente più piccola della continuità. Definizione del resto $o(\\rho)$. Src 20230504 es.1."}]},{"pool":"diff","src":"20230123 Es.1 · non differenziabile via $y=x$","steps":[{"t":"Per mostrare che $f(x,y)=\\dfrac{(x^2+2xy)\\sin(xy)}{(x^2+y^2)^{3/2}}$ (con $\\nabla f(0,0)=0$) NON è differenziabile in $(0,0)$, la via più rapida è:","opts":[{"x":"calcolare $\\lim\\frac{f}{\\rho}$ lungo $y=x$: dà una costante $\\ne 0$, quindi il resto non è $o(\\rho)$","c":true},{"x":"verificare che $f$ è continua in $(0,0)$"},{"x":"controllare il limite solo lungo gli assi $x$ e $y$"},{"x":"calcolare $f_x(0,0)$ e $f_y(0,0)$"}],"hint":"Per NEGARE la differenziabilità basta UNA direzione lungo cui $f/\\rho\\not\\to 0$: la diagonale $y=x$ è la scelta standard.","sol":"Il quoziente $\\frac{f}{\\rho}$ lungo $y=x$: numeratore $\\sim (x^2+2x^2)(x^2)=3x^4$, denominatore $(2x^2)^{3/2}\\cdot(\\sqrt2|x|)=$ ordine $x^4$; il rapporto tende a una costante $\\ne 0$. Quindi il resto non è $o(\\rho)$: non differenziabile. Gli assi (dove $f=0$) non lo rivelano. Src 20230123 es.1."}]},{"pool":"diff","src":"10feb22 Es.1 · continuità (soglia $a$)","steps":[{"t":"Sia $f(x,y)=\\dfrac{e^{x^4y^2}-1}{(x^2+y^2)^a}+xy$, $f(0,0)=0$. Per quali $a>0$ è CONTINUA in $(0,0)$?","opts":[{"x":"$a<3$: usando $e^t-1\\sim t$, la parte con quoziente è $\\sim\\dfrac{x^4y^2}{\\rho^{2a}}\\le\\rho^{6-2a}\\to 0\\iff a<3$","c":true},{"x":"$a<5/2$"},{"x":"$a<2$"},{"x":"ogni $a>0$"}],"hint":"Limite notevole $\\frac{e^t-1}{t}\\to 1$ con $t=x^4y^2$: il numeratore si comporta come $x^4y^2$, di grado $6$. Il termine $xy$ è continuo e non pesa.","sol":"$e^{x^4y^2}-1\\sim x^4y^2=O(\\rho^6)$, quindi la parte col quoziente è $\\le\\rho^{6-2a}\\to 0\\iff a<3$; $xy\\to 0$ è continuo. Continua $\\iff a<3$. Criterio: stima $|f|\\le C\\rho^p$, $p>0$. Src 10feb22 es.1."}]},{"pool":"diff","src":"10feb22 Es.1 · differenziabilità (soglia $a$)","steps":[{"t":"Per la stessa $f=\\dfrac{e^{x^4y^2}-1}{(x^2+y^2)^a}+xy$: sapendo che $\\nabla f(0,0)=(0,0)$, per quali $a$ è DIFFERENZIABILE in $(0,0)$?","opts":[{"x":"$a<5/2$: la parte col quoziente dà $\\dfrac{|\\cdot|}{\\rho}\\le\\rho^{5-2a}\\to 0\\iff a<5/2$ (il termine $xy$ è già differenziabile)","c":true},{"x":"$a<3$, come la continuità"},{"x":"$a<2$"},{"x":"ogni $a$ dove è continua"}],"hint":"$xy$ è liscio (differenziabile). Per la parte col quoziente aggiungi un $\\rho$ al denominatore: da $\\rho^{6-2a}$ passi a $\\rho^{5-2a}$.","sol":"$\\nabla f(0,0)=(0,0)$ ($e^{x^4y^2}-1$ è nulla sugli assi e $\\partial(xy)$ è $0$ in $0$). Il resto della parte col quoziente è $\\frac{x^4y^2/\\rho^{2a}}{\\rho}\\le\\rho^{5-2a}\\to 0\\iff a<5/2$; $xy$ è polinomio quindi differenziabile. Diff. $\\iff a<5/2$, contro continuità $a<3$. Src 10feb22 es.1."}]},{"pool":"diff","src":"20230621 Es.1 · due termini, intersezione","steps":[{"t":"Sia $f(x,y)=\\dfrac{x^2\\log(1+x^2y^2)}{(x^2+y^2)^\\beta}+|xy|^\\beta$. Il primo termine è differenziabile per $\\beta<5/2$, il secondo per $\\beta>1/2$. Per quali $\\beta$ è differenziabile $f$?","opts":[{"x":"$1/2<\\beta<5/2$: l'intersezione delle due condizioni (servono ENTRAMBI differenziabili)","c":true},{"x":"$\\beta<5/2$: domina il primo termine"},{"x":"$\\beta>1/2$: basta il secondo"},{"x":"ogni $\\beta>0$"}],"hint":"$\\log(1+x^2y^2)\\sim x^2y^2$: primo termine $\\sim\\rho^{6-2\\beta}$, secondo $|xy|^\\beta\\sim\\rho^{2\\beta}$. Ogni addendo ha la sua soglia; prendi l'intersezione.","sol":"Primo termine $\\sim\\frac{x^4y^2}{\\rho^{2\\beta}}$: diff. (con $\\nabla=0$) $\\iff\\rho^{5-2\\beta}\\to 0\\iff\\beta<5/2$. Secondo $|xy|^\\beta\\sim\\rho^{2\\beta}$: diff. $\\iff\\rho^{2\\beta-1}\\to 0\\iff\\beta>1/2$. La somma è differenziabile $\\iff$ entrambi lo sono $\\iff 1/2<\\beta<5/2$. Src 20230621 es.1."}]},{"pool":"diff","src":"21lug25 Es.3 · continuità (soglia $\\alpha$)","steps":[{"t":"Sia $f(x,y)=\\dfrac{e^{x^2(y-1)}-e^{y^2}}{(x^2+y^2)^\\alpha}$ per $(x,y)\\ne(0,0)$, $f(0,0)=0$. Per quali $\\alpha>0$ è CONTINUA in $(0,0)$?","opts":[{"x":"$\\alpha<1$: il numeratore $\\sim x^2(y-1)-y^2$ è $O(\\rho^2)$ (domina $-x^2-y^2$), quindi $|f|\\le\\rho^{2-2\\alpha}\\to 0\\iff\\alpha<1$","c":true},{"x":"$\\alpha<2$"},{"x":"$\\alpha<5/2$"},{"x":"ogni $\\alpha>0$"}],"hint":"Sviluppa $e^u\\sim 1+u$ separatamente sui due esponenti: la differenza $1+x^2(y-1)-(1+y^2)=x^2y-x^2-y^2$ ha parte dominante di grado $2$.","sol":"$e^{x^2(y-1)}-e^{y^2}\\approx x^2(y-1)-y^2=x^2y-x^2-y^2$; i termini dominanti $-x^2-y^2$ danno numeratore $O(\\rho^2)$. Quindi $|f|\\le C\\frac{\\rho^2}{\\rho^{2\\alpha}}=C\\rho^{2-2\\alpha}\\to 0\\iff\\alpha<1$. Continua $\\iff\\alpha<1$. Src 21lug25 es.3."}]},{"pool":"diff","src":"20230907 Es.1 · derivabile ma non differenziabile","steps":[{"t":"Sia $f(x,y)=\\dfrac{x^4+y^4-\\sin(xy^2)}{x^2+y^2}$, $f(0,0)=0$. Quanto valgono $f_x(0,0)$ e $f_y(0,0)$?","opts":[{"x":"entrambe $0$: $f(x,0)=\\frac{x^4}{x^2}=x^2\\Rightarrow f_x(0,0)=\\lim\\frac{x^2}{x}=0$; analogamente $f_y(0,0)=0$","c":true},{"x":"$f_x(0,0)=1$, $f_y(0,0)=1$"},{"x":"non esistono, perché il denominatore si annulla"},{"x":"$f_x(0,0)=4$, $f_y(0,0)=4$ dai coefficienti di $x^4,y^4$"}],"hint":"Metti $y=0$ (poi $x=0$): $\\sin$ e potenze incrociate spariscono. Rapporto incrementale.","sol":"$f(x,0)=\\frac{x^4}{x^2}=x^2$, quindi $\\frac{f(x,0)}{x}=x\\to 0$: $f_x(0,0)=0$. Simmetricamente $f(0,y)=\\frac{y^4}{y^2}=y^2\\Rightarrow f_y(0,0)=0$. Quindi $\\nabla f(0,0)=(0,0)$. Definizione di derivata parziale. Src 20230907 es.1.","cont":"Continua &rarr; è differenziabile?"},{"t":"Con $\\nabla f(0,0)=0$, $f$ è differenziabile in $(0,0)$?","opts":[{"x":"No: $\\dfrac{f}{\\rho}$ contiene $-\\dfrac{\\sin(xy^2)}{\\rho^3}\\sim-\\dfrac{xy^2}{\\rho^3}=-\\cos\\theta\\sin^2\\theta$, che dipende da $\\theta$","c":true},{"x":"Sì: le parziali esistono, quindi è differenziabile"},{"x":"Sì, perché $f$ è continua in $(0,0)$"},{"x":"Non si può stabilire senza le derivate seconde"}],"hint":"Il termine $x^4+y^4$ dà $\\rho^2\\to 0$, innocuo; è $\\sin(xy^2)\\sim xy^2$ (grado $3$) diviso $\\rho^3$ a lasciare una funzione di $\\theta$.","sol":"$\\frac{f}{\\rho}=\\frac{x^4+y^4-\\sin(xy^2)}{\\rho^3}$. La parte $\\frac{x^4+y^4}{\\rho^3}\\sim\\rho\\to 0$; ma $\\frac{-\\sin(xy^2)}{\\rho^3}\\sim\\frac{-xy^2}{\\rho^3}=-\\cos\\theta\\sin^2\\theta$ dipende dalla direzione. Il limite del resto NON è $0$: non differenziabile, pur essendo continua e derivabile. Src 20230907 es.1."}]},{"pool":"diff","src":"20220622 Es.1 · derivate direzionali","steps":[{"t":"Per $f=\\dfrac{|y|^\\alpha\\tan(x^4)}{(x^2+y^2)^2}$ ($f(0,0)=0$), la derivata direzionale $\\partial_v f(0,0)$ lungo $v=(v_1,v_2)$ con $v_1v_2\\ne 0$ esiste:","opts":[{"x":"sse $\\alpha>1$: $\\dfrac{f(tv)}{t}=\\dfrac{|t|^\\alpha}{t}\\cdot\\dfrac{|v_2|^\\alpha v_1^4}{(v_1^2+v_2^2)^2}$, e $\\frac{|t|^\\alpha}{t}\\to 0\\iff\\alpha>1$","c":true},{"x":"per ogni $\\alpha>0$"},{"x":"sse $\\alpha<1$"},{"x":"mai, perché compare $|t|$"}],"hint":"Sostituisci $x=tv_1$, $y=tv_2$ e semplifica $t$: resta $\\frac{|t|^\\alpha}{t}$ per una costante direzionale. Applica la dicotomia di $\\frac{|t|^\\alpha}{t}$.","sol":"$f(tv)=\\frac{|t|^\\alpha|v_2|^\\alpha\\,t^4v_1^4}{t^4(v_1^2+v_2^2)^2}$, quindi $\\frac{f(tv)}{t}=\\frac{|t|^\\alpha}{t}\\cdot\\frac{|v_2|^\\alpha v_1^4}{(v_1^2+v_2^2)^2}$. Poiché $\\frac{|t|^\\alpha}{t}\\to 0\\iff\\alpha>1$, la direzionale esiste (e vale $0$) sse $\\alpha>1$; sugli assi ($v_1v_2=0$) esiste sempre ed è $0$. Definizione $\\partial_v f=\\lim_{t\\to0}\\frac{f(tv)-f(0,0)}{t}$. Src 20220622 es.1."}]},{"pool":"diff","src":"tipo C · manuale · rette vs parabola","steps":[{"t":"Per $f(x,y)=\\dfrac{x^2y}{x^4+y^2}$, $f(0,0)=0$, esiste $\\lim_{(x,y)\\to(0,0)}f$ (quindi $f$ continua in $0$)?","opts":[{"x":"No: lungo ogni retta $y=mx$ il limite è $0$, ma lungo la parabola $y=x^2$ vale $\\tfrac12\\ne 0$","c":true},{"x":"Sì, vale $0$: lungo tutte le rette $y=mx$ tende a $0$"},{"x":"Sì, vale $\\tfrac12$"},{"x":"No, perché $f$ non è definita in $(0,0)$"}],"hint":"Il limite lungo tutte le RETTE non basta: prova un cammino di ordine diverso, come $y=x^2$, adattato al denominatore $x^4+y^2$.","sol":"Lungo $y=mx$: $\\frac{x^2\\cdot mx}{x^4+m^2x^2}=\\frac{mx}{x^2+m^2}\\to 0$. Lungo $y=x^2$: $\\frac{x^2\\cdot x^2}{x^4+x^4}=\\frac12$. Due cammini danno limiti diversi $\\Rightarrow$ il limite non esiste, $f$ non è continua in $0$. Morale: controllare solo le rette è insufficiente."}]},{"pool":"diff","src":"tipo C · manuale · derivabile ma discontinua","steps":[{"t":"Sia $f(x,y)=\\dfrac{xy}{x^2+y^2}$, $f(0,0)=0$. Cosa è vero in $(0,0)$?","opts":[{"x":"$f_x(0,0)=f_y(0,0)=0$ ma $f$ NON è continua (lungo $y=x$ vale $\\tfrac12$): derivabile $\\not\\Rightarrow$ continua","c":true},{"x":"$f$ è continua e differenziabile"},{"x":"$f_x(0,0)$ e $f_y(0,0)$ non esistono"},{"x":"$f$ è continua ma non derivabile"}],"hint":"Sugli assi $f\\equiv 0$, quindi le parziali sono $0$. Ma lungo la diagonale $y=x$ la funzione è costante $\\ne 0$: guarda cosa fa fuori dagli assi.","sol":"$f(x,0)=0$ e $f(0,y)=0\\Rightarrow f_x(0,0)=f_y(0,0)=0$: derivabile. Lungo $y=x$: $\\frac{x^2}{2x^2}=\\frac12$, mentre sugli assi $f=0$: limite inesistente, $f$ discontinua in $0$. Controesempio canonico: l'esistenza delle parziali (sguardo solo sugli assi) non vede la discontinuità."}]},{"pool":"diff","src":"22gen24 Es.1 · gradiente e derivata direzionale","steps":[{"t":"Sia $f(x,y,z)=\\sqrt{x^2+y^2+z^2+1}+x-z$ (liscia: argomento sempre $\\ge 1$). Quanto vale $\\nabla f(0,0,0)$?","opts":[{"x":"$(1,0,-1)$: $\\nabla f=\\Big(\\tfrac{x}{\\sqrt{\\cdots}}+1,\\ \\tfrac{y}{\\sqrt{\\cdots}},\\ \\tfrac{z}{\\sqrt{\\cdots}}-1\\Big)$ valutato in $0$, con $\\sqrt{\\cdots}=1$","c":true},{"x":"$(0,0,0)$"},{"x":"$(1,1,-1)$"},{"x":"non definito, la radice non è derivabile in $0$"}],"hint":"L'argomento della radice vale $1$ nell'origine, quindi $\\sqrt{\\cdots}=1$ e $f$ è $C^\\infty$ lì: usa le normali regole di derivazione.","sol":"$\\partial_x=\\frac{x}{\\sqrt{x^2+y^2+z^2+1}}+1$, $\\partial_y=\\frac{y}{\\sqrt{\\cdots}}$, $\\partial_z=\\frac{z}{\\sqrt{\\cdots}}-1$. In $(0,0,0)$ la radice è $1$: $\\nabla f=(1,0,-1)$. Qui la formula esplicita è liscia in un intorno (non è spezzata), quindi le regole di derivazione valgono. Src 22gen24 es.1.","cont":"Continua &rarr; la derivata direzionale"},{"t":"Poiché $f$ è differenziabile in $(0,0,0)$, quanto vale $\\partial_v f(0,0,0)$ lungo un versore $v=(v_1,v_2,v_3)$?","opts":[{"x":"$\\partial_v f=\\nabla f\\cdot v=v_1-v_3$: la formula del gradiente vale perché $f$ è differenziabile","c":true},{"x":"$\\partial_v f=v_1+v_3$"},{"x":"va calcolata dalla definizione, la formula del gradiente non si applica"},{"x":"$\\partial_v f=|v_1-v_3|$"}],"hint":"$f$ è liscia $\\Rightarrow$ differenziabile $\\Rightarrow$ $\\partial_v f=\\nabla f\\cdot v$. Fai il prodotto scalare con $\\nabla f=(1,0,-1)$.","sol":"Essendo $f$ differenziabile, $\\partial_v f(0,0,0)=\\nabla f(0,0,0)\\cdot v=(1,0,-1)\\cdot(v_1,v_2,v_3)=v_1-v_3$. Teorema: diff. $\\Rightarrow$ direzionali esistono e valgono $\\nabla f\\cdot v$. Qui è lecito proprio perché la differenziabilità è garantita dalla liscezza. Src 22gen24 es.1."}]},{"pool":"diff","src":"tipo C · manuale · x^3/(x^2+y^2) — continua ma non differenziabile, direzionali non lineari","steps":[{"t":"Sia $f(x,y)=\\dfrac{x^3}{x^2+y^2}$ per $(x,y)\\ne(0,0)$, $f(0,0)=0$. Primo passo del tipo C: la continuit&agrave; in $(0,0)$. Quale stima la stabilisce?","opts":[{"x":"$|f|\\le|x|\\le\\sqrt{x^2+y^2}\\to0$, quindi $f$ &egrave; continua","c":true},{"x":"il limite non esiste perch&eacute; lungo $y=x$ vale $\\tfrac12$"},{"x":"$f$ non &egrave; definita in $(0,0)$, quindi la continuit&agrave; non ha senso"}],"hint":"$|x|^3=|x|\\,x^2\\le|x|(x^2+y^2)$: cosa resta dividendo per $x^2+y^2$?","sol":"Da $|x|^3\\le|x|(x^2+y^2)$ segue $|f|=\\dfrac{|x|^3}{x^2+y^2}\\le|x|\\le\\sqrt{x^2+y^2}\\to0$. Per il teorema del confronto (squeeze) $f\\to0=f(0,0)$: $f$ &egrave; continua in $(0,0)$.","cont":"Parziali dalla definizione"},{"t":"Calcola le derivate parziali in $(0,0)$ DALLA DEFINIZIONE (non con le regole di derivazione).","opts":[{"x":"$f_x(0,0)=1,\\ f_y(0,0)=0$, quindi $\\nabla f(0,0)=(1,0)$","c":true},{"x":"$f_x(0,0)=0,\\ f_y(0,0)=0$, quindi $\\nabla f(0,0)=(0,0)$"},{"x":"le parziali non esistono perch&eacute; $f$ &egrave; un quoziente"}],"hint":"$f_x(0,0)=\\lim_{t\\to0}\\dfrac{f(t,0)-f(0,0)}{t}$; osserva che $f(t,0)=t$.","sol":"Per definizione di derivata parziale: $f_x(0,0)=\\lim_{t\\to0}\\dfrac{f(t,0)}{t}=\\lim_{t\\to0}\\dfrac{t^3/t^2}{t}=\\lim\\dfrac{t}{t}=1$; $f_y(0,0)=\\lim_{t\\to0}\\dfrac{f(0,t)}{t}=\\lim\\dfrac{0}{t}=0$. Quindi $\\nabla f(0,0)=(1,0)$. Usare le regole del quoziente qui sarebbe un errore: nel punto singolare vale solo la definizione.","cont":"Derivate direzionali"},{"t":"Per un versore $v=(\\cos\\theta,\\sin\\theta)$, quanto vale $\\partial_v f(0,0)$?","opts":[{"x":"$\\partial_v f(0,0)=\\cos^3\\theta$, cio&egrave; $v_1^3$","c":true},{"x":"$\\partial_v f(0,0)=\\cos\\theta=v_1=\\nabla f(0,0)\\cdot v$"},{"x":"$\\partial_v f(0,0)$ non esiste per $v$ non assiale"}],"hint":"in $\\dfrac{f(tv_1,tv_2)}{t}$ usa $v_1^2+v_2^2=1$: il $t$ si semplifica.","sol":"$\\partial_v f(0,0)=\\lim_{t\\to0}\\dfrac{f(tv_1,tv_2)}{t}=\\lim_{t\\to0}\\dfrac{t^3v_1^3/(t^2(v_1^2+v_2^2))}{t}=v_1^3=\\cos^3\\theta$. Tutte le direzionali ESISTONO, per ogni $v$.","cont":"Il test di linearit&agrave;"},{"t":"$\\partial_v f(0,0)=v_1^3$. Cosa dice il confronto con $\\nabla f(0,0)\\cdot v=v_1$?","opts":[{"x":"$v_1^3\\ne v_1$ in generale: le direzionali NON sono lineari in $v$, quindi $f$ non pu&ograve; essere differenziabile","c":true},{"x":"$v_1^3=v_1$ per ogni $v$, quindi $f$ &egrave; differenziabile"},{"x":"la linearit&agrave; delle direzionali non ha relazione con la differenziabilit&agrave;"}],"hint":"prova $v_1=\\tfrac{\\sqrt2}{2}$: &egrave; vero che $v_1^3=v_1$?","sol":"Criterio (condizione necessaria di differenziabilit&agrave;): se $f$ &egrave; differenziabile allora $\\partial_v f(0,0)=\\nabla f(0,0)\\cdot v$, LINEARE in $v$. Qui $\\partial_v f=v_1^3$ non &egrave; lineare (per $v_1=\\tfrac{\\sqrt2}{2}$ vale $\\tfrac{\\sqrt2}{4}\\ne\\tfrac{\\sqrt2}{2}$). Dunque $f$ NON &egrave; differenziabile.","cont":"Conferma col resto"},{"t":"Conferma con il limite del resto, usando $\\nabla f(0,0)=(1,0)$.","opts":[{"x":"$\\dfrac{f(h,k)-h}{\\sqrt{h^2+k^2}}=\\dfrac{-hk^2}{(h^2+k^2)^{3/2}}$ non tende a 0 (lungo $h=k$ vale $-2^{-3/2}$)","c":true},{"x":"il resto tende a 0, quindi $f$ &egrave; differenziabile"},{"x":"il resto vale identicamente 0"}],"hint":"$f(h,k)-h=\\dfrac{h^3-h(h^2+k^2)}{h^2+k^2}$: semplifica il numeratore.","sol":"Il resto &egrave; $R=\\dfrac{f(h,k)-f(0,0)-\\nabla f(0,0)\\cdot(h,k)}{\\sqrt{h^2+k^2}}=\\dfrac{\\frac{h^3}{h^2+k^2}-h}{\\sqrt{h^2+k^2}}=\\dfrac{-hk^2}{(h^2+k^2)^{3/2}}$. Lungo $h=k>0$: $\\dfrac{-h^3}{(2h^2)^{3/2}}=-2^{-3/2}\\ne0$. Per la definizione di differenziabilit&agrave; il resto deve tendere a 0: qui non accade, $f$ NON &egrave; differenziabile.","cont":"Conclusione e gerarchia"},{"t":"Quale anello della gerarchia hai visto fallire con questa $f$?","opts":[{"x":"$f$ &egrave; continua, con entrambe le parziali e tutte le direzionali, ma NON differenziabile: l'esistenza delle direzionali non implica la differenziabilit&agrave;","c":true},{"x":"differenziabile implica non continua"},{"x":"continua implica differenziabile"}],"hint":"cosa avevi in mano (continuit&agrave;, direzionali) e cosa mancava (linearit&agrave;/resto)?","sol":"$f$ &egrave; continua, ha entrambe le parziali e TUTTE le direzionali, eppure non &egrave; differenziabile: l'implicazione &laquo;esistenza delle direzionali implica differenziabilit&agrave;&raquo; &egrave; FALSA. Vale solo il verso opposto: differenziabile implica direzionali esistenti e lineari ($\\partial_v f=\\nabla f\\cdot v$)."}]},{"pool":"diff","src":"tipo C · manuale · x^2 y/(x^2+y^2) — continua, gradiente nullo, direzionali non nulle","steps":[{"t":"Sia $f(x,y)=\\dfrac{x^2y}{x^2+y^2}$ per $(x,y)\\ne(0,0)$, $f(0,0)=0$. Studia la continuit&agrave; in $(0,0)$.","opts":[{"x":"$|f|\\le|y|\\to0$, quindi $f$ &egrave; continua","c":true},{"x":"lungo $y=x$ il limite vale $\\tfrac12$, quindi $f$ non &egrave; continua"},{"x":"il limite dipende dalla direzione, quindi non esiste"}],"hint":"$\\dfrac{x^2}{x^2+y^2}\\le1$: cosa resta moltiplicando per $|y|$?","sol":"Poich&eacute; $\\dfrac{x^2}{x^2+y^2}\\le1$, si ha $|f|=\\dfrac{x^2|y|}{x^2+y^2}\\le|y|\\le\\sqrt{x^2+y^2}\\to0$. Per il teorema del confronto $f$ &egrave; continua in $(0,0)$.","cont":"Parziali dalla definizione"},{"t":"Calcola $\\nabla f(0,0)$ dalla definizione.","opts":[{"x":"$\\nabla f(0,0)=(0,0)$","c":true},{"x":"$\\nabla f(0,0)=(1,0)$"},{"x":"$\\nabla f(0,0)=(0,1)$"}],"hint":"$f(t,0)=0$ e $f(0,t)=0$: i rapporti incrementali sono nulli.","sol":"$f_x(0,0)=\\lim_{t\\to0}\\dfrac{f(t,0)}{t}=\\lim\\dfrac{0}{t}=0$ (perch&eacute; $f(t,0)=t^2\\cdot0/t^2=0$); analogamente $f_y(0,0)=\\lim\\dfrac{f(0,t)}{t}=0$. Quindi $\\nabla f(0,0)=(0,0)$ per definizione di derivata parziale.","cont":"Derivate direzionali"},{"t":"Per $v=(\\cos\\theta,\\sin\\theta)$, quanto vale $\\partial_v f(0,0)$?","opts":[{"x":"$\\partial_v f(0,0)=v_1^2v_2=\\cos^2\\theta\\sin\\theta$","c":true},{"x":"$\\partial_v f(0,0)=0$ per ogni $v$, perch&eacute; $\\nabla f(0,0)=0$"},{"x":"$\\partial_v f(0,0)$ esiste solo lungo gli assi"}],"hint":"non dedurre la direzionale dal gradiente: qui $f$ non &egrave; (ancora) nota differenziabile. Calcola il limite.","sol":"$\\partial_v f(0,0)=\\lim_{t\\to0}\\dfrac{f(tv_1,tv_2)}{t}=\\lim\\dfrac{t^3v_1^2v_2/(t^2)}{t}=v_1^2v_2=\\cos^2\\theta\\sin\\theta$. Esiste per ogni $v$. Attenzione al trabocchetto: NON si pu&ograve; scrivere $\\partial_v f=\\nabla f\\cdot v$ finch&eacute; non si sa che $f$ &egrave; differenziabile.","cont":"Il test di linearit&agrave;"},{"t":"Confronta $\\partial_v f(0,0)=v_1^2v_2$ con $\\nabla f(0,0)\\cdot v=0$.","opts":[{"x":"$v_1^2v_2\\ne0$ per $v$ non assiale (es. $\\tfrac{1}{2\\sqrt2}$): non lineari, quindi $f$ non &egrave; differenziabile","c":true},{"x":"coincidono, entrambi nulli, quindi $f$ &egrave; differenziabile"},{"x":"la discrepanza riguarda la continuit&agrave;, non la differenziabilit&agrave;"}],"hint":"per $v=(\\tfrac{\\sqrt2}{2},\\tfrac{\\sqrt2}{2})$: $v_1^2v_2=\\tfrac12\\cdot\\tfrac{\\sqrt2}{2}\\ne0$.","sol":"Se $f$ fosse differenziabile si avrebbe $\\partial_v f=\\nabla f\\cdot v=0$ per ogni $v$. Ma $\\partial_v f=v_1^2v_2$ vale $\\tfrac{\\sqrt2}{4}\\ne0$ per $v=(\\tfrac{\\sqrt2}{2},\\tfrac{\\sqrt2}{2})$. Violata la condizione necessaria $\\partial_v f=\\nabla f\\cdot v$: $f$ NON &egrave; differenziabile.","cont":"Conferma col resto"},{"t":"Verifica col resto (qui $\\nabla f(0,0)=0$, quindi $R=\\dfrac{f(h,k)}{\\sqrt{h^2+k^2}}$).","opts":[{"x":"$R=\\dfrac{h^2k}{(h^2+k^2)^{3/2}}$; lungo $h=k$ vale $2^{-3/2}\\ne0$","c":true},{"x":"$R\\to0$, quindi $f$ &egrave; differenziabile"},{"x":"$R$ non &egrave; definito perch&eacute; il gradiente &egrave; nullo"}],"hint":"con gradiente nullo il resto &egrave; semplicemente $f$ diviso $\\rho$; passa in polari o metti $h=k$.","sol":"$R=\\dfrac{f(h,k)}{\\sqrt{h^2+k^2}}=\\dfrac{h^2k}{(h^2+k^2)^{3/2}}$. Lungo $h=k>0$: $\\dfrac{h^3}{(2h^2)^{3/2}}=2^{-3/2}\\ne0$. Il limite del resto non &egrave; 0: per definizione $f$ NON &egrave; differenziabile.","cont":"Conclusione"},{"t":"Qual &egrave; il &laquo;segnale&raquo; diagnostico specifico di questo caso?","opts":[{"x":"il gradiente &egrave; nullo ma le direzionali non lo sono: gi&agrave; questo, senza calcolare il resto, esclude la differenziabilit&agrave;","c":true},{"x":"la funzione &egrave; discontinua"},{"x":"le parziali non esistono"}],"hint":"quando $\\nabla f=0$, cosa devono valere tutte le direzionali se $f$ &egrave; differenziabile?","sol":"Se $\\nabla f(0,0)=0$ e $f$ fosse differenziabile, TUTTE le direzionali sarebbero nulle. Qui $\\partial_v f=v_1^2v_2\\not\\equiv0$: la sola incoerenza gradiente-nullo/direzionali-non-nulle basta a negare la differenziabilit&agrave;, senza passare dal resto. &Egrave; il modus operandi rapido su questa famiglia."}]},{"pool":"diff","src":"tipo C · manuale · x^3 y/(x^6+y^2) — rette ingannano, serve la curva; polari non uniformi","steps":[{"t":"Sia $f(x,y)=\\dfrac{x^3y}{x^6+y^2}$ per $(x,y)\\ne(0,0)$, $f(0,0)=0$. Primo tentativo: il limite lungo le rette $y=mx$. Cosa d&agrave;?","opts":[{"x":"$\\dfrac{mx^2}{x^4+m^2}\\to0$ per ogni $m$; anche lungo gli assi vale 0","c":true},{"x":"dipende da $m$, quindi il limite non esiste"},{"x":"vale $\\tfrac12$ per ogni $m$"}],"hint":"sostituisci $y=mx$ e semplifica $x^2$ a numeratore e denominatore.","sol":"Lungo $y=mx$: $f=\\dfrac{x^3\\cdot mx}{x^6+m^2x^2}=\\dfrac{mx^4}{x^2(x^4+m^2)}=\\dfrac{mx^2}{x^4+m^2}\\to0$. Lungo gli assi $f\\equiv0$. Tutte le rette danno 0: TENTAZIONE di concludere la continuit&agrave;. Ma il limite lungo tutte le rette non &egrave; sufficiente per l'esistenza del limite in due variabili.","cont":"La curva critica"},{"t":"Il grado a numeratore ($x^3y$) suggerisce di provare $y=x^3$. Cosa succede?","opts":[{"x":"$f=\\dfrac{x^6}{2x^6}=\\tfrac12\\ne0$: il limite lungo $y=x^3$ vale $\\tfrac12$","c":true},{"x":"$f\\to0$ anche lungo $y=x^3$"},{"x":"$f\\to\\infty$ lungo $y=x^3$"}],"hint":"scegli la curva che rende numeratore e denominatore dello stesso ordine: $x^3\\cdot y$ contro $y^2$ suggerisce $y\\sim x^3$.","sol":"Lungo $y=x^3$: $f=\\dfrac{x^3\\cdot x^3}{x^6+x^6}=\\dfrac{x^6}{2x^6}=\\tfrac12$. Poich&eacute; lungo le rette il limite &egrave; 0 e lungo $y=x^3$ &egrave; $\\tfrac12$, i limiti direzionali/curvilinei NON coincidono: il limite in $(0,0)$ NON esiste. La curva si sceglie bilanciando gli ordini (regola pratica dei &laquo;pesi&raquo; delle variabili).","cont":"Perch&eacute; le polari ingannano"},{"t":"In coordinate polari, per $\\theta$ FISSATO ($\\sin\\theta\\ne0$), $f\\to0$ quando $\\rho\\to0$. Questo dimostra la continuit&agrave;?","opts":[{"x":"no: il limite per $\\theta$ fisso &egrave; 0 ma la stima non &egrave; uniforme in $\\theta$; la curva $y=x^3$ (non una retta) lo smentisce","c":true},{"x":"s&igrave;: se per ogni $\\theta$ il limite &egrave; 0, la funzione &egrave; continua"},{"x":"le polari non si applicano perch&eacute; il denominatore ha $x^6$"}],"hint":"il limite per $\\theta$ fisso equivale al limite lungo una retta: gi&agrave; visto che le rette danno 0. Cosa serve in pi&ugrave;?","sol":"In polari $f=\\dfrac{\\rho^2\\cos^3\\theta\\sin\\theta}{\\rho^4\\cos^6\\theta+\\sin^2\\theta}$. Per $\\theta$ fisso con $\\sin\\theta\\ne0$: numeratore $\\sim\\rho^2$, denominatore $\\to\\sin^2\\theta$, quindi $\\to0$. Ma il limite per $\\theta$ fisso &egrave; il limite lungo una retta: non basta. Il criterio delle polari conclude SOLO con una maggiorazione $|f|\\le g(\\rho)\\to0$ UNIFORME in $\\theta$; qui la stima peggiora avvicinando $\\rho^4\\cos^6\\theta\\approx\\sin^2\\theta$, ci&ograve; che accade proprio su $y=x^3$. Le polari qui ingannano.","cont":"Le parziali"},{"t":"Calcola le parziali in $(0,0)$ dalla definizione.","opts":[{"x":"$f_x(0,0)=0$ e $f_y(0,0)=0$: entrambe esistono","c":true},{"x":"non esistono perch&eacute; $f$ non &egrave; continua"},{"x":"$f_x(0,0)=1$, $f_y(0,0)=0$"}],"hint":"$f(t,0)=0$ e $f(0,t)=0$: i rapporti incrementali sono identicamente nulli.","sol":"$f(t,0)=\\dfrac{t^3\\cdot0}{t^6}=0$ e $f(0,t)=\\dfrac{0}{t^2}=0$, quindi $f_x(0,0)=f_y(0,0)=0$. Le parziali ESISTONO. Nota: l'esistenza delle parziali non richiede la continuit&agrave; (dipendono solo dal comportamento lungo gli assi).","cont":"Conclusione"},{"t":"Concludi sulla differenziabilit&agrave; e nomina la gerarchia usata.","opts":[{"x":"$f$ non &egrave; continua in $(0,0)$, quindi per la contrappositiva di &laquo;differenziabile implica continua&raquo; non &egrave; differenziabile — pur avendo entrambe le parziali","c":true},{"x":"$f$ &egrave; differenziabile perch&eacute; le parziali esistono"},{"x":"serve calcolare il resto: senza quel calcolo non si conclude"}],"hint":"se la funzione &egrave; gi&agrave; discontinua, qual &egrave; la via pi&ugrave; rapida?","sol":"Poich&eacute; $f$ non &egrave; continua in $(0,0)$, per la contrappositiva del teorema &laquo;differenziabile implica continua&raquo; $f$ NON &egrave; differenziabile. Il calcolo del resto sarebbe superfluo. La lezione: verificata la discontinuit&agrave;, si chiude subito; e l'esistenza delle sole parziali non salva nulla (parziali non implica continuit&agrave;).","cont":"Il modus operandi"},{"t":"Modus operandi che questo esercizio insegna, in ordine.","opts":[{"x":"prova le rette; se danno tutte lo stesso valore NON hai finito, cerca una curva bilanciando gli ordini; le polari concludono solo con stima uniforme in $\\theta$","c":true},{"x":"le polari sono sempre il metodo pi&ugrave; sicuro per la continuit&agrave;"},{"x":"basta calcolare il gradiente e il resto, ignorando la continuit&agrave;"}],"hint":"quale illusione hai smontato due volte (rette, polari-per-theta)?","sol":"Strategia: (1) rette come primo test — se il limite dipende dalla retta, chiuso; se &egrave; costante, NON hai concluso; (2) cerca una curva $y=x^\\alpha$ che pareggi gli ordini di numeratore e denominatore (qui $\\alpha=3$); (3) le polari dimostrano la continuit&agrave; solo con $|f|\\le g(\\rho)\\to0$ indipendente da $\\theta$ — il limite &laquo;per $\\theta$ fisso&raquo; equivale alle rette e non basta."}]},{"pool":"diff","src":"tipo C · manuale · x^2 y^2/(x^2+y^2) — patologica all'apparenza, in realta' differenziabile (polari uniformi)","steps":[{"t":"Sia $f(x,y)=\\dfrac{x^2y^2}{x^2+y^2}$ per $(x,y)\\ne(0,0)$, $f(0,0)=0$. Continuit&agrave; in $(0,0)$?","opts":[{"x":"$|f|\\le\\dfrac{x^2+y^2}{4}\\to0$, continua","c":true},{"x":"non continua, lungo $y=x$ vale $\\tfrac14$"},{"x":"non si pu&ograve; decidere con le rette"}],"hint":"usa $x^2y^2\\le\\big(\\tfrac{x^2+y^2}{2}\\big)^2$ (media geometrica-aritmetica).","sol":"Per AM-GM $x^2y^2\\le\\Big(\\dfrac{x^2+y^2}{2}\\Big)^2$, quindi $|f|=\\dfrac{x^2y^2}{x^2+y^2}\\le\\dfrac{x^2+y^2}{4}\\to0$. Per il teorema del confronto $f$ &egrave; continua in $(0,0)$.","cont":"Parziali dalla definizione"},{"t":"Calcola $\\nabla f(0,0)$ dalla definizione.","opts":[{"x":"$\\nabla f(0,0)=(0,0)$","c":true},{"x":"$\\nabla f(0,0)=(1,1)$"},{"x":"le parziali non esistono"}],"hint":"$f(t,0)=0$ e $f(0,t)=0$.","sol":"$f(t,0)=\\dfrac{t^2\\cdot0}{t^2}=0$ e $f(0,t)=0$, quindi $f_x(0,0)=f_y(0,0)=0$ e $\\nabla f(0,0)=(0,0)$ per definizione.",
