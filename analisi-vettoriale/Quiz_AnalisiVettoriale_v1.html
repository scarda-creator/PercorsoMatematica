 esattamente la trappola su cui si va sotto tempo.</b>"}]},{"pool":"edo","src":"tipo F &middot; manuale","steps":[{"t":"Problema autonomo $y'=(2-y)(y+1)$, $y(0)=0$. La soluzione locale esiste ed &egrave; unica? In virt&ugrave; di quale ipotesi, e cosa accadrebbe se questa mancasse?","opts":[{"x":"S&iacute;: $f(y)=(2-y)(y+1)$ &egrave; polinomiale, dunque $C^1$ e localmente lipschitziana in $y$; il teorema di Picard-Lindel&ouml;f d&agrave; esistenza e unicit&agrave; locali. Con la sola continuit&agrave; (Peano) avremmo esistenza ma non unicit&agrave;.","c":true},{"x":"Esiste ma non &egrave; detto sia unica, perch&eacute; $f$ &egrave; soltanto continua."},{"x":"No: manca la dipendenza esplicita da $t$, quindi il teorema di Cauchy non si applica."}],"hint":"L'unicit&agrave; non si compra con la continuit&agrave; di $f$, ma con una condizione pi&ugrave; forte sulla sua variazione in $y$.","sol":"$f(y)=(2-y)(y+1)$ &egrave; un polinomio, quindi $C^1$ e in particolare localmente lipschitziana in $y$ su ogni compatto. Il teorema di Picard-Lindel&ouml;f (Cauchy-Lipschitz) garantisce allora esistenza e unicit&agrave; locali. Senza la lipschitzianit&agrave;, il solo teorema di Peano darebbe esistenza ma non unicit&agrave; (come per $y'=\\sqrt{|y|}$).","cont":"Equilibri e segno"},{"t":"Individua gli equilibri e il segno di $y'$ nel dato iniziale. Che monotonia ne segue, e perch&eacute; la soluzione non pu&ograve; attraversare $y=2$?","opts":[{"x":"Equilibri $y=2$ e $y=-1$; in $y(0)=0\\in(-1,2)$ &egrave; $f>0$, quindi $y$ strettamente crescente; non tocca $y=2$ perch&eacute; l&igrave; vive la soluzione costante $y\\equiv2$ e due soluzioni distinte non si intersecano (unicit&agrave;).","c":true},{"x":"Equilibri $y=2$ e $y=-1$; $y$ cresce e raggiunge $y=2$ in tempo finito attraversandola."},{"x":"Nessun equilibrio; $y'$ ha segno costante ovunque."}],"hint":"Attraversare un equilibrio vorrebbe dire due soluzioni per lo stesso punto: cosa lo vieta?","sol":"$f(y)=0$ per $y=2$ e $y=-1$. Su $(-1,2)$ si ha $f>0$, quindi con $y(0)=0$ la soluzione &egrave; strettamente crescente. La retta $y=2$ &egrave; a sua volta una soluzione (costante); per l'unicit&agrave; di Picard-Lindel&ouml;f i grafici di due soluzioni non si incontrano, dunque $y(t)<2$ sempre: $y=2$ &egrave; asintoto, non valore raggiunto.","cont":"Dominio massimale"},{"t":"Su quale intervallo &egrave; definita la soluzione massimale, e perch&eacute;?","opts":[{"x":"Su tutto $\\mathbb{R}$: la soluzione resta confinata in $-1<y<2$, cio&egrave; in un compatto, e per il teorema di fuga dai compatti non pu&ograve; esplodere in tempo finito.","c":true},{"x":"Solo su $(-1,2)$, l'intervallo in cui $f>0$."},{"x":"Su un intervallo limitato $(a,b)$ perch&eacute; ogni soluzione non lineare esplode."}],"hint":"Il dominio massimale vive sull'asse dei tempi $t$, non sui valori di $y$: non scambiare le ordinate con le ascisse.","sol":"Poich&eacute; $-1<y(t)<2$ per ogni $t$ del dominio (passo precedente), la traiettoria $(t,y(t))$ resta in una striscia orizzontale limitata. Il teorema di fuga dai compatti afferma che una soluzione massimale con estremo destro finito $b$ dovrebbe uscire da ogni compatto per $t\\to b^-$; ma $y$ resta limitata, assurdo. Quindi il dominio massimale &egrave; $\\mathbb{R}$.","cont":"Comportamento a $+\\infty$"},{"t":"Calcola $\\lim_{t\\to+\\infty}y(t)$. Il teorema dell'asintoto richiede che esista $\\lim y'(t)$: perch&eacute; qui l'ipotesi &egrave; soddisfatta?","opts":[{"x":"$y$ &egrave; crescente e limitata da $2$, quindi $L=\\lim_{t\\to+\\infty}y(t)$ esiste finito; essendo l'equazione autonoma, $y'=f(y)\\to f(L)$, dunque $\\lim y'$ esiste. Il teorema dell'asintoto impone $\\lim y'=0$, cio&egrave; $f(L)=0$; con $y$ crescente da $0$ si ha $L=2$.","c":true},{"x":"$L=2$ perch&eacute; &egrave; il pi&ugrave; grande equilibrio, senza bisogno di controllare che $\\lim y'$ esista."},{"x":"$L=+\\infty$ perch&eacute; $y$ &egrave; crescente."}],"hint":"Il teorema dell'asintoto non &egrave; automatico: l'esistenza di $\\lim y'$ va giustificata, e qui la offre l'autonomia dell'equazione.","sol":"Monotona e limitata $\\Rightarrow$ $L=\\lim_{t\\to+\\infty}y(t)$ esiste finito (teorema di monotonia). Essendo l'equazione autonoma e $f$ continua, $y'(t)=f(y(t))\\to f(L)$: &egrave; questa l'ipotesi cruciale, l'esistenza di $\\lim y'$. Il teorema dell'asintoto conclude $\\lim y'=0$, cio&egrave; $f(L)=0$; tra gli zeri $-1,2$ la crescenza da $0$ seleziona $L=2$.","cont":"Comportamento a $-\\infty$"},{"t":"Determina $\\lim_{t\\to-\\infty}y(t)$ con lo stesso argomento.","opts":[{"x":"Andando indietro nel tempo la crescente $y$ decresce restando $>-1$; monotona e limitata inferiormente $\\Rightarrow$ $L_-$ esiste, e l'asintoto d&agrave; $f(L_-)=0$, quindi $L_-=-1$. Il profilo &egrave; una sigmoide da $-1$ a $2$.","c":true},{"x":"$\\lim_{t\\to-\\infty}y(t)=-\\infty$ perch&eacute; $y$ &egrave; crescente."},{"x":"$\\lim_{t\\to-\\infty}y(t)=0$, il dato iniziale."}],"hint":"All'indietro nel tempo una funzione crescente diminuisce, ma non pu&ograve; scavalcare l'equilibrio inferiore.","sol":"Per $t\\to-\\infty$ la $y$ crescente decresce restando $>-1$ (non attraversa l'equilibrio, di nuovo per unicit&agrave;). Monotona e limitata inferiormente $\\Rightarrow$ $L_-$ esiste; l'argomento dell'asintoto (equazione autonoma) d&agrave; $f(L_-)=0$, e l'unico equilibrio sotto lo $0$ &egrave; $-1$.","cont":"Variante del dato"},{"t":"Caso limite: come cambia il quadro se il dato &egrave; $y(0)=3$ invece di $y(0)=0$?","opts":[{"x":"Ora $y(0)=3>2$, dove $f(y)=(2-y)(y+1)<0$: la soluzione &egrave; decrescente e tende a $2$ da sopra; il ruolo di attrattore di $y=2$ resta, ma vi si arriva dall'alto.","c":true},{"x":"Nulla cambia: la soluzione tende comunque a $2$ crescendo."},{"x":"La soluzione esplode a $+\\infty$ perch&eacute; parte sopra tutti gli equilibri."}],"hint":"Controlla il segno di $f$ per $y>2$: &egrave; lo stesso che avevi in $(-1,2)$?","sol":"Per $y>2$ &egrave; $2-y<0$ e $y+1>0$, quindi $f<0$: con $y(0)=3$ la soluzione decresce, limitata inferiormente da $2$, e tende a $2^+$. Ci&ograve; mostra che $y=2$ &egrave; asintoticamente stabile (attrae da entrambi i lati) e $y=-1$ instabile.","cont":"Verifica"},{"t":"Verifica di coerenza: controlla equilibri e stabilit&agrave; valutando $f$ e $f'$.","opts":[{"x":"$f(2)=f(-1)=0$; $f'(y)=1-2y$ d&agrave; $f'(2)=-3<0$ (stabile) e $f'(-1)=3>0$ (instabile), in accordo con l'analisi del segno.","c":true},{"x":"$f'(y)=2-2y$, quindi $f'(2)=-2$ e $f'(-1)=4$: numeri diversi, stesse conclusioni."},{"x":"$f'$ non serve: la stabilit&agrave; si legge solo dal dato iniziale."}],"hint":"Sviluppa $f(y)=(2-y)(y+1)=-y^2+y+2$ prima di derivare, cos&iacute; non sbagli i segni.","sol":"$f(y)=(2-y)(y+1)=-y^2+y+2$, quindi $f'(y)=-2y+1=1-2y$. Allora $f'(2)=-3<0$: linearizzazione con autovalore negativo, equilibrio asintoticamente stabile. $f'(-1)=3>0$: instabile. Coerente con il ritratto di fase (convergenza a $2$, fuga da $-1$)."}]},{"pool":"edo","src":"tipo F &middot; manuale","steps":[{"t":"Problema $y'=(1+t^2)\\,y^2$, $y(0)=1$. Esistenza e unicit&agrave; locali: quale ipotesi le garantisce, e su cosa deve essere lipschitziana $f$?","opts":[{"x":"$f(t,y)=(1+t^2)y^2$ &egrave; $C^1$ in $(t,y)$, dunque localmente lipschitziana in $y$ uniformemente su compatti di $t$: Picard-Lindel&ouml;f d&agrave; soluzione locale unica. La lipschitzianit&agrave; richiesta &egrave; nella sola variabile $y$.","c":true},{"x":"Serve la lipschitzianit&agrave; in $t$: dato che $1+t^2$ &egrave; liscia, l'unicit&agrave; &egrave; garantita."},{"x":"Non c'&egrave; unicit&agrave; perch&eacute; $f$ cresce quadraticamente in $y$."}],"hint":"Il teorema chiede la lipschitzianit&agrave; in una sola delle due variabili: quale?","sol":"$f(t,y)=(1+t^2)y^2$ ha derivate parziali continue, quindi &egrave; $C^1$ e localmente lipschitziana rispetto a $y$ (uniformemente sui compatti in $t$): &egrave; esattamente l'ipotesi di Picard-Lindel&ouml;f, che chiede la lipschitzianit&agrave; solo in $y$. La crescita quadratica in $y$ non tocca l'unicit&agrave; locale (semmai la globalit&agrave;, come si vedr&agrave;).","cont":"Segno e monotonia"},{"t":"Senza risolvere: che segno e che monotonia ha $y$ per $t\\ge0$, e perch&eacute; $y$ resta positiva?","opts":[{"x":"$y(0)=1>0$ e $y\\equiv0$ &egrave; soluzione: per unicit&agrave; $y$ non pu&ograve; annullarsi, quindi $y>0$; allora $y'=(1+t^2)y^2\\ge0$ e $y$ &egrave; crescente.","c":true},{"x":"$y$ pu&ograve; cambiare segno perch&eacute; $y^2$ &egrave; sempre $\\ge0$."},{"x":"$y$ &egrave; decrescente perch&eacute; parte da un valore positivo."}],"hint":"C'&egrave; una soluzione costante che fa da barriera: quale, e cosa impedisce di attraversarla?","sol":"$y\\equiv0$ risolve l'equazione; per l'unicit&agrave; di Picard-Lindel&ouml;f la soluzione con $y(0)=1$ non pu&ograve; toccarla, dunque $y(t)>0$ finch&eacute; esiste. Allora $y'=(1+t^2)y^2\\ge0$: $y$ &egrave; (strettamente) crescente per $t\\ge0$.","cont":"Risoluzione"},{"t":"Risolvi per separazione delle variabili e imponi il dato.","opts":[{"x":"$\\int y^{-2}\\,dy=\\int(1+t^2)\\,dt$ d&agrave; $-\\tfrac1y=t+\\tfrac{t^3}{3}+C$; con $y(0)=1$, $C=-1$, quindi $y(t)=\\dfrac{1}{1-t-\\tfrac{t^3}{3}}$.","c":true},{"x":"$\\ln|y|=t+\\tfrac{t^3}{3}+C$, quindi $y(t)=e^{\\,t+t^3/3}$."},{"x":"$y(t)=1+t+\\tfrac{t^3}{3}$, sommando l'integrale al dato."}],"hint":"Il primo membro &egrave; $\\int y^{-2}dy$, non $\\int y^{-1}dy$: attenzione alla primitiva.","sol":"Separando: $y^{-2}\\,dy=(1+t^2)\\,dt$. Integrando, $-y^{-1}=t+\\tfrac{t^3}{3}+C$. Il dato $y(0)=1$ d&agrave; $-1=C$. Quindi $-\\tfrac1y=t+\\tfrac{t^3}{3}-1$, cio&egrave; $y(t)=\\dfrac{1}{1-t-\\tfrac{t^3}{3}}$.","cont":"Dominio massimale"},{"t":"Qual &egrave; il dominio massimale, e perch&eacute; NON &egrave; tutto $\\mathbb{R}$ nonostante $f$ sia $C^1$ ovunque?","opts":[{"x":"Il denominatore $D(t)=1-t-\\tfrac{t^3}{3}$ vale $1$ in $t=0$ e $-\\tfrac13$ in $t=1$, quindi si annulla in un $t^\\ast\\in(0,1)$; per $t\\to t^{\\ast-}$ si ha $y\\to+\\infty$. Il dominio (a destra) &egrave; $[0,t^\\ast)$: $C^1$ d&agrave; solo esistenza LOCALE, non globale.","c":true},{"x":"&Egrave; tutto $\\mathbb{R}$: $f\\in C^1$ ovunque, quindi la soluzione &egrave; globale."},{"x":"&Egrave; $(0,1)$ perch&eacute; l&igrave; il denominatore &egrave; positivo."}],"hint":"$C^1$ garantisce vita locale; per la vita globale serve un controllo sulla crescita di $f$ in $y$, che qui manca.","sol":"$D(t)=1-t-\\tfrac{t^3}{3}$ &egrave; continua, $D(0)=1>0$, $D(1)=-\\tfrac13<0$: per il teorema degli zeri esiste $t^\\ast\\in(0,1)$ con $D(t^\\ast)=0$. Poich&eacute; $D$ &egrave; strettamente decrescente ($D'=-1-t^2<0$), $t^\\ast$ &egrave; unico e $y=1/D\\to+\\infty$ per $t\\to t^{\\ast-}$. La regolarit&agrave; $C^1$ garantisce solo esistenza locale; la crescita quadratica in $y$ produce esplosione in tempo finito.","cont":"Perch&eacute; esplode: confronto"},{"t":"Perch&eacute; potevamo prevedere l'esplosione in tempo finito SENZA la formula esplicita?","opts":[{"x":"Per $t\\ge0$, $y'=(1+t^2)y^2\\ge y^2$; confrontando con $Y'=Y^2,\\ Y(0)=1$ (che esplode in $t=1$), il teorema del confronto d&agrave; $y\\ge Y$, quindi $y$ esplode entro $t=1$.","c":true},{"x":"Perch&eacute; $f$ non &egrave; limitata: ogni $f$ illimitata produce esplosione."},{"x":"Perch&eacute; $y(0)=1\\ne0$: i dati non nulli esplodono sempre."}],"hint":"Cerca una minorante autonoma pi&ugrave; semplice di cui conosci gi&agrave; il tempo di esplosione.","sol":"Su $t\\ge0$ vale $1+t^2\\ge1$, quindi $y'\\ge y^2$ (con $y>0$). La soluzione di $Y'=Y^2$, $Y(0)=1$ &egrave; $Y=1/(1-t)$, che esplode in $t=1$. Il teorema del confronto (sub/soluzioni) d&agrave; $y(t)\\ge Y(t)$ finch&eacute; entrambe esistono, dunque $y$ esplode a un tempo $t^\\ast\\le1$. &Egrave; la fuga dai compatti: la traiettoria esce da ogni compatto in tempo finito.","cont":"Verifica"},{"t":"Verifica che $y(t)=\\dfrac{1}{1-t-t^3/3}$ risolve davvero l'equazione.","opts":[{"x":"Con $D=1-t-\\tfrac{t^3}{3}$, $D'=-1-t^2$, si ha $y'=-D'/D^2=(1+t^2)/D^2=(1+t^2)y^2$: coincide con l'equazione. E $y(0)=1/1=1$.","c":true},{"x":"$y'=1/D'=1/(-1-t^2)$, che non coincide con $(1+t^2)y^2$: la soluzione &egrave; sbagliata."},{"x":"Basta $y(0)=1$; la derivata non va controllata."}],"hint":"Deriva $1/D$ con la regola della catena: $y'=-D'/D^2$, non $1/D'$.","sol":"$y=1/D$ con $D=1-t-\\tfrac{t^3}{3}$, $D'=-1-t^2=-(1+t^2)$. Allora $y'=-D'/D^2=(1+t^2)/D^2=(1+t^2)\\,y^2$, esattamente l'equazione; e $y(0)=1$. La soluzione &egrave; corretta."}]},{"pool":"edo","src":"tipo F &middot; manuale","steps":[{"t":"Problema $y'=3\\,y^{2/3}$, $y(0)=0$. Le ipotesi di Picard-Lindel&ouml;f valgono in $(0,0)$? Cosa vale comunque?","opts":[{"x":"$f(y)=3y^{2/3}$ &egrave; continua (Peano d&agrave; esistenza), ma $f'(y)=2y^{-1/3}\\to\\infty$ per $y\\to0$: $f$ NON &egrave; lipschitziana vicino a $0$, quindi Picard non si applica e l'unicit&agrave; non &egrave; garantita.","c":true},{"x":"$f$ &egrave; $C^1$ ovunque, quindi la soluzione &egrave; unica."},{"x":"$f$ non &egrave; nemmeno continua in $0$, quindi non esiste soluzione."}],"hint":"Guarda la derivata $f'(y)$ vicino a $y=0$: resta limitata o esplode?","sol":"$f(y)=3y^{2/3}$ &egrave; continua su tutto $\\mathbb{R}$ (Peano garantisce esistenza locale). Ma $f'(y)=2y^{-1/3}$ diverge per $y\\to0$: non esiste costante di Lipschitz in un intorno di $0$. L'ipotesi di Picard-Lindel&ouml;f fallisce proprio in $(0,0)$, quindi l'unicit&agrave; non &egrave; assicurata.","cont":"Prima soluzione"},{"t":"Verifica che $y\\equiv0$ &egrave; una soluzione del problema.","opts":[{"x":"$y\\equiv0$: $y'=0$ e $3\\cdot0^{2/3}=0$, e $y(0)=0$. &Egrave; soluzione.","c":true},{"x":"$y\\equiv0$ non risolve: $3\\cdot0^{2/3}$ non &egrave; definito."}],"hint":"Sostituisci direttamente: $0^{2/3}$ vale $0$, non &egrave; una forma indeterminata.","sol":"Per $y\\equiv0$: $y'=0$ e $3y^{2/3}=3\\cdot0=0$, con $y(0)=0$. Entrambi i membri sono nulli: la funzione nulla &egrave; soluzione.","cont":"Seconda soluzione"},{"t":"Verifica che anche $y(t)=t^3$ risolve il problema per $t\\ge0$.","opts":[{"x":"$y=t^3$: $y'=3t^2$ e $3y^{2/3}=3(t^3)^{2/3}=3t^2$ per $t\\ge0$, con $y(0)=0$. &Egrave; una seconda soluzione distinta da $y\\equiv0$.","c":true},{"x":"$y=t^3$ non risolve: $y'=t^2$, diverso da $3t^2$."},{"x":"$y=t^3$ coincide con $y\\equiv0$, quindi non &egrave; nuova."}],"hint":"Per $t\\ge0$, $(t^3)^{2/3}=t^2$: la radice cubica di $t^3$ &egrave; $t$.","sol":"Per $t\\ge0$: $y=t^3\\Rightarrow y'=3t^2$; e $3y^{2/3}=3(t^3)^{2/3}=3t^2$. Il dato $y(0)=0$ &egrave; soddisfatto. Dunque $y=t^3$ &egrave; una soluzione diversa da $y\\equiv0$: gi&agrave; due soluzioni per lo stesso Cauchy.","cont":"Perch&eacute; niente contraddizione"},{"t":"Esibiamo l'intera famiglia $y_a(t)=0$ per $t\\le a$ e $y_a(t)=(t-a)^3$ per $t>a$, con $a\\ge0$. Perch&eacute; l'esistenza di infinite soluzioni NON contraddice Picard-Lindel&ouml;f?","opts":[{"x":"Perch&eacute; Picard richiede la lipschitzianit&agrave; di $f$, che qui fallisce esattamente sull'equilibrio $y=0$ per cui passano tutte le $y_a$: senza quell'ipotesi il teorema non promette unicit&agrave;. Peano (esistenza) &egrave; salvo, l'unicit&agrave; no.","c":true},{"x":"Perch&eacute; le $y_a$ hanno dati iniziali diversi tra loro."},{"x":"Contraddice il teorema: significa che Picard &egrave; falso."}],"hint":"Le $y_a$ passano tutte per $(a,0)$ raccordandosi con la soluzione nulla: dove vive il difetto di lipschitzianit&agrave;?","sol":"Ogni $y_a$ &egrave; $C^1$ (il raccordo in $t=a$ ha $y'=0$ da entrambi i lati) e risolve il problema con $y(0)=0$. Sono infinite, tutte transitanti per il luogo $y=0$ dove $f$ non &egrave; lipschitziana. Non c'&egrave; contraddizione perch&eacute; Picard-Lindel&ouml;f conclude l'unicit&agrave; SOLO sotto l'ipotesi di lipschitzianit&agrave;, qui violata; resta valido Peano, che d&agrave; solo esistenza.","cont":"Dato lontano dallo zero"},{"t":"E se il dato fosse $y(0)=1$ anzich&eacute; $y(0)=0$? La soluzione &egrave; unica? Perch&eacute; il fenomeno cambia?","opts":[{"x":"S&iacute;, unica in piccolo: vicino a $y=1$ la funzione $y^{2/3}$ &egrave; $C^1$ (l'unico punto critico &egrave; $y=0$), quindi $f$ &egrave; localmente lipschitziana e Picard d&agrave; unicit&agrave;. La non-unicit&agrave; &egrave; un fenomeno locale legato al punto $y=0$.","c":true},{"x":"No, ci sono comunque infinite soluzioni: la non-unicit&agrave; &egrave; globale."},{"x":"Non esiste soluzione perch&eacute; $y=1$ non &egrave; un equilibrio."}],"hint":"$f'(y)=2y^{-1/3}$ &egrave; finita per $y=1$: la patologia sta solo dove $y=0$.","sol":"Per $y$ vicino a $1$, $f(y)=3y^{2/3}$ &egrave; $C^1$ (la sola singolarit&agrave; di $f'$ &egrave; in $y=0$), dunque localmente lipschitziana: Picard-Lindel&ouml;f d&agrave; esistenza e unicit&agrave; locali. La non-unicit&agrave; vista prima &egrave; strettamente legata al passaggio per l'equilibrio $y=0$, dove la lipschitzianit&agrave; cade.","cont":"Conteggio"},{"t":"Quante soluzioni massimali passano per $(0,0)$, e con quale analogia?","opts":[{"x":"Infinite: la famiglia $\\{y_a\\}_{a\\ge0}$ (pi&ugrave; la nulla, che &egrave; il caso $a=+\\infty$), esattamente come per $y'=\\sqrt{|y|}$: entrambe hanno $f$ non lipschitziana nell'equilibrio $y=0$.","c":true},{"x":"Esattamente due: $y\\equiv0$ e $y=t^3$."},{"x":"Una sola, per il teorema di Peano."}],"hint":"Ogni scelta del tempo di distacco $a$ d&agrave; una soluzione diversa: quante scelte hai?","sol":"Al variare di $a\\in[0,+\\infty)$ le $y_a$ sono tutte distinte e massimali; con la nulla si ha un continuo di soluzioni. Il meccanismo &egrave; lo stesso di $y'=\\sqrt{|y|}$, $y(0)=0$: la perdita di lipschitzianit&agrave; sull'equilibrio $y=0$ apre a un tempo di distacco arbitrario. Peano garantisce l'esistenza; l'unicit&agrave; &egrave; genuinamente falsa."}]},{"pool":"edo","src":"20250127 Es.3","steps":[{"t":"Problema $y'=\\dfrac{t\\,(y-1)}{1+3y^2}$, $y(0)=\\tfrac12$. Perch&eacute; esiste una e una sola soluzione locale?","opts":[{"x":"$f(t,u)=\\dfrac{t(u-1)}{1+3u^2}$ ha denominatore $1+3u^2\\ge1$ mai nullo, quindi &egrave; $C^1$ su tutto $\\mathbb{R}^2$: &egrave; localmente lipschitziana in $u$ e vale Picard-Lindel&ouml;f.","c":true},{"x":"Perch&eacute; $f$ &egrave; limitata, e ogni $f$ limitata d&agrave; unicit&agrave;."},{"x":"Perch&eacute; l'equazione &egrave; a variabili separabili, e la separabilit&agrave; garantisce l'unicit&agrave;."}],"hint":"L'unicit&agrave; viene da una regolarit&agrave; di $f$ come campo $(t,u)$, non dalla separabilit&agrave; n&eacute; dalla limitatezza.","sol":"Il denominatore $1+3u^2\\ge1$ non si annulla mai, dunque $f(t,u)=\\dfrac{t(u-1)}{1+3u^2}$ &egrave; $C^1(\\mathbb{R}^2)$, in particolare localmente lipschitziana in $u$. Il teorema di Picard-Lindel&ouml;f d&agrave; esistenza e unicit&agrave; locali per ogni dato.","cont":"Globalit&agrave;"},{"t":"Perch&eacute; la soluzione massimale &egrave; globale (definita su tutto $\\mathbb{R}$)? E perch&eacute; il solo restare $<1$ NON basta a dirlo?","opts":[{"x":"$f$ &egrave; sublineare: $|f(t,u)|\\le|t(u-1)|\\le|t|\\,|u|+|t|$ (poich&eacute; il denominatore &egrave; $\\ge1$), con $L_1(t)=L_2(t)=|t|$ continue; il teorema di esistenza globale d&agrave; $I_{\\max}=\\mathbb{R}$. Restare $<1$ limita solo dall'alto, non esclude la fuga a $-\\infty$ in tempo finito.","c":true},{"x":"&Egrave; globale perch&eacute; $y(t)<1$: essere limitata superiormente basta per la globalit&agrave;."},{"x":"&Egrave; globale perch&eacute; $f\\in C^1$, e $C^1$ implica esistenza su tutto $\\mathbb{R}$."}],"hint":"$C^1$ d&agrave; solo vita locale; una barriera superiore non impedisce l'esplosione verso il basso: serve una stima sulla crescita di $f$ in $u$.","sol":"La stima $\\Big|\\dfrac{t(u-1)}{1+3u^2}\\Big|\\le|t(u-1)|\\le|t|\\,|u|+|t|$ (usando $1+3u^2\\ge1$) mostra la sublinearit&agrave; di $f$ con $L_1(t)=L_2(t)=|t|$ continue. Il teorema di esistenza globale (o di Gronwall) esclude allora l'esplosione in tempo finito: $I_{\\max}=\\mathbb{R}$. La barriera $y<1$ (soluzione costante $y\\equiv1$, mai attraversata per unicit&agrave;) confina solo dall'alto e da sola non escluderebbe una fuga a $-\\infty$ in tempo finito.","cont":"Monotonia"},{"t":"Intervalli di crescenza e decrescenza. Come si usa qui l'informazione $y(t)<1$?","opts":[{"x":"Con $y<1$ &egrave; $y-1<0$ e $1+3y^2>0$, quindi il segno di $y'=\\dfrac{t(y-1)}{1+3y^2}$ coincide col segno di $-t$: crescente per $t<0$, decrescente per $t>0$, massimo assoluto in $t=0$.","c":true},{"x":"$y'$ ha il segno di $t$: decrescente per $t<0$, crescente per $t>0$, minimo in $t=0$."},{"x":"$y$ &egrave; sempre decrescente perch&eacute; $y(0)<1$."}],"hint":"Isola i tre fattori: $t$, $(y-1)$, $(1+3y^2)$. Due hanno segno noto grazie al passo precedente; il terzo cambia il verso.","sol":"$1+3y^2>0$ sempre; $y-1<0$ perch&eacute; $y<1$. Dunque $\\operatorname{sgn}(y')=\\operatorname{sgn}\\big(t\\cdot(\\text{neg})\\big)=\\operatorname{sgn}(-t)$: $y'>0$ per $t<0$ e $y'<0$ per $t>0$. In $t=0$ c'&egrave; il massimo assoluto.","cont":"Esistenza del limite"},{"t":"Perch&eacute; esiste $\\lim_{t\\to+\\infty}y(t)$? Attenzione: chi lo garantisce?","opts":[{"x":"Lo garantisce la MONOTONIA: per $t>0$ la $y$ &egrave; strettamente decrescente e limitata superiormente da $y(0)=\\tfrac12$, quindi il limite esiste (finito $\\ge$ o uguale a $-\\infty$). Il teorema dell'asintoto NON serve a provarne l'esistenza.","c":true},{"x":"Lo garantisce il teorema dell'asintoto, che assicura l'esistenza del limite di ogni soluzione."},{"x":"Non esiste il limite, perch&eacute; $y$ non &egrave; limitata inferiormente."}],"hint":"Il teorema dell'asintoto &egrave; uno strumento per CALCOLARE un limite gi&agrave; noto esistere, non per farlo esistere. Chi produce l'esistenza qui?","sol":"Una funzione monotona ha sempre limite (finito o infinito) agli estremi del dominio: &egrave; il teorema di monotonia. Per $t>0$ la $y$ &egrave; decrescente e limitata sopra, quindi $\\ell=\\lim_{t\\to+\\infty}y(t)$ esiste, con $\\ell\\in\\{-\\infty\\}\\cup(-\\infty,\\tfrac12)$. Il teorema dell'asintoto non prova mai l'esistenza di un limite: serve solo, semmai, a determinarlo.","cont":"Valore del limite"},{"t":"Calcola $\\lim_{t\\to+\\infty}y(t)$. Come interviene ora il teorema dell'asintoto?","opts":[{"x":"Per assurdo, se $\\ell$ fosse finito, allora $y'=\\dfrac{t(y-1)}{1+3y^2}\\to-\\infty$ (il fattore $\\tfrac{y-1}{1+3y^2}\\to\\tfrac{\\ell-1}{1+3\\ell^2}<0$ e $t\\to+\\infty$); ma il teorema dell'asintoto impone $\\lim y'=0$ se $y\\to\\ell$ finito e $\\lim y'$ esiste. Assurdo, quindi $\\ell=-\\infty$.","c":true},{"x":"$\\ell=\\tfrac12$, perch&eacute; il massimo &egrave; in $t=0$ e la soluzione vi resta vicina."},{"x":"$\\ell=1$, l'equilibrio pi&ugrave; vicino da sopra."}],"hint":"Assumi il limite finito e guarda cosa fa $y'$: se non tende a $0$, il teorema dell'asintoto ti d&agrave; l'assurdo che cercavi.","sol":"Supposto $\\ell$ finito (esistenza gi&agrave; acquisita dalla monotonia), $\\dfrac{y-1}{1+3y^2}\\to\\dfrac{\\ell-1}{1+3\\ell^2}<0$ e $t\\to+\\infty$ danno $y'\\to-\\infty$. Ma il teorema dell'asintoto afferma: se $y\\to\\ell$ finito e $\\lim y'$ esiste (in $\\mathbb{R}\\cup\\{\\pm\\infty\\}$), allora $\\lim y'=0$. Qui $\\lim y'=-\\infty\\ne0$: assurdo. Dunque il limite non pu&ograve; essere finito, cio&egrave; $\\lim_{t\\to+\\infty}y(t)=-\\infty$.","cont":"Perch&eacute; non l'autonoma"},{"t":"Perch&eacute; NON possiamo concludere, come per un'equazione autonoma, che il limite sia uno zero del secondo membro?","opts":[{"x":"Perch&eacute; l'equazione &egrave; NON autonoma: il fattore esplicito $t$ non tende a un valore, quindi da $y\\to\\ell$ non segue $y'\\to f(\\ell)$ come nel caso autonomo. La conclusione $f(\\ell)=0$ vale solo se $y'$ dipende da $y$ soltanto.","c":true},{"x":"Perch&eacute; il secondo membro non ha zeri."},{"x":"Perch&eacute; $y(0)=\\tfrac12$ non &egrave; un equilibrio."}],"hint":"Nel caso autonomo $y'=g(y)$ si ha $y'\\to g(\\ell)$; qui compare un $t$ esplicito che non si stabilizza.","sol":"Per l'autonoma $y'=g(y)$, da $y\\to\\ell$ segue $y'\\to g(\\ell)$ e l'asintoto forza $g(\\ell)=0$. Qui $y'=\\dfrac{t(y-1)}{1+3y^2}$ contiene il fattore esplicito $t\\to+\\infty$: non esiste un $f(\\ell)$ verso cui $y'$ converga, e infatti $y'\\to-\\infty$. La struttura non autonoma &egrave; ci&ograve; che spinge il limite a $-\\infty$ anzich&eacute; a uno zero. L'equilibrio $y=1$ &egrave; irrilevante perch&eacute; il dato parte sotto di esso."}]},{"pool":"edo","src":"20230705 Es.5","steps":[{"t":"Problema $y'=\\dfrac{2}{t}\\,y+4t^2y^3$, $y(1)=1$. Perch&eacute; esiste una sola soluzione locale, e su quale semiretta di $t$?","opts":[{"x":"$f(t,p)=\\dfrac{2}{t}p+4t^2p^3$ &egrave; $C^1$ per $t\\ne0$; in un intorno di $(1,1)$ (con $t>0$) &egrave; localmente lipschitziana in $p$: Picard-Lindel&ouml;f d&agrave; esistenza e unicit&agrave;. Il dominio naturale &egrave; $t>0$.","c":true},{"x":"$f\\in C^1(\\mathbb{R}^2)$, quindi la soluzione &egrave; unica su tutto $\\mathbb{R}$."},{"x":"Non c'&egrave; unicit&agrave; perch&eacute; compare $y^3$."}],"hint":"Dov'&egrave; che $f$ perde regolarit&agrave;? Guarda il coefficiente $2/t$.","sol":"$f(t,p)=\\tfrac{2}{t}p+4t^2p^3$ ha una singolarit&agrave; in $t=0$; per $t>0$ &egrave; $C^1$, quindi localmente lipschitziana in $p$ intorno a $(1,1)$. Picard-Lindel&ouml;f d&agrave; soluzione locale unica. Poich&eacute; il dato &egrave; in $t=1>0$, l'intervallo di esistenza vive in $(0,+\\infty)$.","cont":"Positivit&agrave;"},{"t":"Perch&eacute; la soluzione &egrave; strettamente positiva in tutto il suo insieme di definizione?","opts":[{"x":"$y\\equiv0$ &egrave; soluzione; per unicit&agrave; la soluzione con $y(1)=1>0$ non pu&ograve; toccarla, quindi $y(t)>0$. Allora $y'=\\tfrac2t y+4t^2y^3>0$ per $t>0$.","c":true},{"x":"$y>0$ perch&eacute; $y^3$ &egrave; sempre positivo."},{"x":"Non si pu&ograve; dire senza risolvere."}],"hint":"C'&egrave; una soluzione costante nulla che fa da barriera: cosa impedisce di attraversarla?","sol":"$y\\equiv0$ risolve l'equazione (entrambi i termini si annullano). Per l'unicit&agrave; di Picard-Lindel&ouml;f la soluzione con $y(1)=1$ non pu&ograve; incontrarla, dunque resta $y>0$. Di conseguenza $y'=\\tfrac2t y+4t^2y^3>0$ su $(0,+\\infty)$: la soluzione &egrave; anche strettamente crescente.","cont":"Concavit&agrave; in $t=1$"},{"t":"La soluzione &egrave; convessa o concava in un intorno di $t=1$? (Segno di $y''(1)$.)","opts":[{"x":"Convessa: derivando l'equazione, $y''=-\\tfrac{2}{t^2}y+\\tfrac2t y'+8t y^3+12t^2y^2y'$; con $y(1)=1$ e $y'(1)=\\tfrac21+4=6$ si ottiene $y''(1)=-2+12+8+72=90>0$.","c":true},{"x":"Concava: $y''(1)<0$ perch&eacute; $y$ &egrave; crescente."},{"x":"N&eacute; l'una n&eacute; l'altra: $y''(1)=0$."}],"hint":"Deriva l'intera equazione rispetto a $t$ (non serve la soluzione esplicita) e valuta in $t=1$ usando $y(1)=1$, $y'(1)=6$.","sol":"Da $y'=\\tfrac2t y+4t^2y^3$ segue $y''=-\\tfrac{2}{t^2}y+\\tfrac2t y'+8t y^3+12t^2y^2y'$. Con $y(1)=1$ e $y'(1)=\\tfrac21\\cdot1+4\\cdot1\\cdot1=6$: $y''(1)=-2+2\\cdot6+8+12\\cdot6=-2+12+8+72=90>0$, quindi la soluzione &egrave; (strettamente) convessa in un intorno di $t=1$. Nota: la stampa ufficiale riporta $-2+6+8+72=84$ (usa $\\tfrac2t y'=6$ invece di $12$); il segno, e con esso la convessit&agrave;, non cambia.","cont":"Bernoulli"},{"t":"Riconosci il tipo e imposta la sostituzione risolutiva. Perch&eacute; proprio $z=y^{-2}$?","opts":[{"x":"&Egrave; una Bernoulli con $n=3$; la sostituzione $z=y^{1-n}=y^{-2}$ la linearizza. Con $z'=-2y^{-3}y'$ si ottiene $z'=-\\tfrac4t z-8t^2$.","c":true},{"x":"&Egrave; lineare cos&iacute; com'&egrave;: nessuna sostituzione serve."},{"x":"&Egrave; Bernoulli con $n=3$, e si pone $z=y^{3}$."}],"hint":"Per $y'=a(t)y+b(t)y^n$ la sostituzione standard &egrave; $z=y^{1-n}$: con $n=3$ quanto vale $1-n$?","sol":"L'equazione $y'=\\tfrac2t y+4t^2y^3$ &egrave; di Bernoulli con $n=3$. Si pone $z=y^{1-n}=y^{-2}$, da cui $z'=-2y^{-3}y'$. Dividendo l'equazione per $y^3$: $\\tfrac{y'}{y^3}=\\tfrac2t y^{-2}+4t^2=\\tfrac2t z+4t^2$, e poich&eacute; $\\tfrac{y'}{y^3}=-\\tfrac12 z'$, si ricava l'equazione lineare $z'=-\\tfrac4t z-8t^2$.","cont":"Soluzione esplicita"},{"t":"Risolvi la lineare in $z$ e torna a $y$.","opts":[{"x":"Fattore integrante $t^4$: $(t^4z)'=-8t^6\\Rightarrow t^4z=-\\tfrac{8}{7}t^7+C$, $z=\\tfrac{C}{t^4}-\\tfrac{8}{7}t^3$. Da $z(1)=1$, $C=\\tfrac{15}{7}$, quindi $z=\\dfrac{15-8t^7}{7t^4}$ e $y=\\dfrac{1}{\\sqrt z}=\\sqrt{\\dfrac{7t^4}{15-8t^7}}$.","c":true},{"x":"$z=Ce^{-4t}-2t^3$, da cui $y=1/\\sqrt z$."},{"x":"$z=\\tfrac{C}{t^4}+\\tfrac87 t^3$, con $C=-\\tfrac17$."}],"hint":"L'equazione $z'+\\tfrac4t z=-8t^2$ ha fattore integrante $e^{\\int 4/t\\,dt}=t^4$. Attento al segno del termine noto.","sol":"Da $z'+\\tfrac4t z=-8t^2$, fattore integrante $\\mu=e^{\\int\\frac4t dt}=t^4$: $(t^4z)'=-8t^6$, dunque $t^4z=-\\tfrac{8}{7}t^7+C$ e $z=\\tfrac{C}{t^4}-\\tfrac87 t^3$. Il dato $z(1)=y(1)^{-2}=1$ d&agrave; $C-\\tfrac87=1$, cio&egrave; $C=\\tfrac{15}{7}$. Quindi $z=\\dfrac{15-8t^7}{7t^4}$ e, essendo $y>0$, $y(t)=z^{-1/2}=\\sqrt{\\dfrac{7t^4}{15-8t^7}}$.","cont":"Intervallo massimale"},{"t":"Qual &egrave; l'intervallo di esistenza massimale, e perch&eacute; non &egrave; tutto $(0,+\\infty)$?","opts":[{"x":"Serve $t>0$ e $15-8t^7>0$, cio&egrave; $t<\\big(\\tfrac{15}{8}\\big)^{1/7}$: dunque $I_{\\max}=\\Big(0,\\ \\big(\\tfrac{15}{8}\\big)^{1/7}\\Big)$. All'estremo destro il denominatore si annulla e $y\\to+\\infty$ (asintoto verticale).","c":true},{"x":"$I_{\\max}=(0,+\\infty)$, perch&eacute; $f\\in C^1$ per $t>0$."},{"x":"$I_{\\max}=(1,+\\infty)$, a destra del dato iniziale."}],"hint":"$y=\\sqrt{7t^4/(15-8t^7)}$ esiste finch&eacute; il radicando &egrave; positivo: dove si annulla il denominatore?","sol":"Il radicando $\\dfrac{7t^4}{15-8t^7}$ &egrave; positivo per $t>0$ finch&eacute; $15-8t^7>0$, cio&egrave; $t<t^\\ast=\\big(\\tfrac{15}{8}\\big)^{1/7}$. Quindi $I_{\\max}=(0,t^\\ast)$: la regolarit&agrave; $C^1$ garantiva solo esistenza locale, e la nonlinearit&agrave; (Bernoulli con $y^3$) produce esplosione in tempo finito, $y\\to+\\infty$ per $t\\to t^{\\ast-}$."}]},{"pool":"edo","src":"20240122 Es.5","steps":[{"t":"Problema $y'=\\dfrac{y^2}{1+y^2}\\,e^{t}$, $y(0)=2$. Esistenza e unicit&agrave; locali: su quale funzione va imposta la regolarit&agrave;, e perch&eacute; &egrave; scorretto dire che $\\tfrac{y^2}{1+y^2}e^t$ &egrave; $C^1$?","opts":[{"x":"La condizione &egrave; su $f(t,u)=\\dfrac{u^2}{1+u^2}e^{t}$ (campo nelle variabili indipendenti $t,u$), che &egrave; $C^1(\\mathbb{R}^2)$: da qui Picard-Lindel&ouml;f. Parlare di $C^1$ di $\\tfrac{y(t)^2}{1+y(t)^2}e^t$ &egrave; un errore, perch&eacute; $y(t)$ &egrave; proprio l'incognita che si vuole costruire.","c":true},{"x":"La regolarit&agrave; va imposta su $y(t)$: se $y$ &egrave; $C^1$, la soluzione esiste unica."},{"x":"Nessuna regolarit&agrave; serve: basta che l'equazione sia separabile."}],"hint":"Il teorema chiede la regolarit&agrave; del CAMPO $f(t,u)$, non della soluzione $y(t)$ che ancora non conosci.","sol":"L'ipotesi di Picard-Lindel&ouml;f riguarda $f$ come funzione delle variabili $(t,u)$: $f(t,u)=\\dfrac{u^2}{1+u^2}e^{t}$ &egrave; $C^1(\\mathbb{R}^2)$, dunque localmente lipschitziana in $u$; segue esistenza e unicit&agrave; locali. Scrivere che $\\tfrac{y(t)^2}{1+y(t)^2}e^t$ &egrave; $C^1$ &egrave; un errore concettuale: $y(t)$ &egrave; l'oggetto incognito, per questo si separa la variabile muta $u$.","cont":"Globalit&agrave;"},{"t":"Perch&eacute; la soluzione massimale &egrave; definita su tutto $\\mathbb{R}$?","opts":[{"x":"$|f(t,u)|=\\dfrac{u^2}{1+u^2}e^{t}\\le e^{t}$, perch&eacute; $\\tfrac{u^2}{1+u^2}<1$: $f$ &egrave; sublineare con $L_1\\equiv0$, $L_2(t)=e^t$ continue, quindi la soluzione &egrave; globale. Le stime a priori sulla soluzione (positivit&agrave;) NON basterebbero.","c":true},{"x":"&Egrave; globale perch&eacute; $y$ &egrave; positiva e crescente."},{"x":"&Egrave; globale perch&eacute; $f\\in C^1$, e $C^1$ d&agrave; esistenza su $\\mathbb{R}$."}],"hint":"$\\tfrac{u^2}{1+u^2}$ &egrave; sempre $<1$: sfrutta questo per maggiorare $f$ con una funzione del solo $t$.","sol":"Poich&eacute; $0\\le\\dfrac{u^2}{1+u^2}<1$, si ha $|f(t,u)|\\le e^{t}$: &egrave; una stima di sublinearit&agrave; con $L_1\\equiv0$ e $L_2(t)=e^t$ continue. Il teorema di esistenza globale d&agrave; allora $I_{\\max}=\\mathbb{R}$. Sapere solo che $y>0$ e crescente non escluderebbe un asintoto verticale: &egrave; la sublinearit&agrave; di $f$ a garantire la globalit&agrave;.","cont":"Monotonia"},{"t":"Segno e monotonia di $y$: perch&eacute; &egrave; strettamente crescente?","opts":[{"x":"$y\\equiv0$ &egrave; soluzione; per unicit&agrave; $y$ non pu&ograve; annullarsi, e con $y(0)=2>0$ resta $y>0$. Allora $y'=\\dfrac{y^2}{1+y^2}e^{t}>0$: strettamente crescente su $\\mathbb{R}$.","c":true},{"x":"Non &egrave; monotona, perch&eacute; $e^t$ cambia il segno di $y'$."},{"x":"&Egrave; decrescente perch&eacute; parte da $2$."}],"hint":"La barriera $y\\equiv0$ tiene $y$ positiva; e i due fattori $\\tfrac{y^2}{1+y^2}$ ed $e^t$ che segno hanno?","sol":"$y\\equiv0$ risolve l'equazione; per unicit&agrave; la soluzione con $y(0)=2$ resta strettamente positiva. Entrambi i fattori $\\tfrac{y^2}{1+y^2}$ ed $e^t$ sono positivi, quindi $y'>0$: la soluzione &egrave; strettamente crescente su tutto $\\mathbb{R}$.","cont":"Limite a $+\\infty$"},{"t":"Determina $\\lim_{t\\to+\\infty}y(t)$.","opts":[{"x":"Crescente e globale $\\Rightarrow$ il limite esiste (finito $>2$ o $+\\infty$). Se fosse finito $\\ell$, allora $y'\\to\\dfrac{\\ell^2}{1+\\ell^2}e^{t}\\to+\\infty$, contro il teorema dell'asintoto ($\\lim y'$ dovrebbe essere $0$). Dunque $\\lim_{t\\to+\\infty}y(t)=+\\infty$.","c":true},{"x":"$\\ell=2$, il dato iniziale, perch&eacute; l&igrave; c'&egrave; il minimo."},{"x":"Il limite non esiste perch&eacute; $y'$ oscilla."}],"hint":"Esistenza dal fatto che $y$ &egrave; monotona; poi assumi il limite finito e guarda cosa impone il teorema dell'asintoto su $y'$.","sol":"Monotona crescente e definita su $\\mathbb{R}$: $\\ell=\\lim_{t\\to+\\infty}y(t)$ esiste (finito $>2$ o $+\\infty$). Se $\\ell$ finito, $\\dfrac{y^2}{1+y^2}\\to\\dfrac{\\ell^2}{1+\\ell^2}\\ne0$ e $e^t\\to+\\infty$ danno $y'\\to+\\infty$: assurdo per il teorema dell'asintoto (che vorrebbe $\\lim y'=0$). Quindi $\\lim_{t\\to+\\infty}y(t)=+\\infty$.","cont":"La trappola a $-\\infty$"},{"t":"Caso delicato: quanto vale $\\lim_{t\\to-\\infty}y(t)$? Perch&eacute; NON &egrave; $0$, come suggerirebbe l'analogia con l'autonoma?","opts":[{"x":"Non &egrave; $0$: integrando $\\int_{-\\infty}^{0}y'\\,dt=\\int_{-\\infty}^{0}\\dfrac{y^2}{1+y^2}e^t\\,dt<\\int_{-\\infty}^{0}e^t\\,dt=1$, e il primo membro vale $2-\\ell_-$; dunque $2-\\ell_-<1$, cio&egrave; $\\ell_->1$. L'equazione &egrave; non autonoma, quindi $y=0$ non agisce da attrattore.","c":true},{"x":"$\\ell_-=0$, perch&eacute; $0$ &egrave; l'unico equilibrio dell'equazione."},{"x":"$\\ell_-=-\\infty$, per simmetria con il comportamento a $+\\infty$."}],"hint":"Non trattarla come autonoma: il peso di $e^t$ a $-\\infty$ &egrave; piccolo ma la variazione totale di $y$ &egrave; limitata. Integra $y'$ su $(-\\infty,0]$.","sol":"$y$ decresce (andando indietro) e resta $>0$, quindi $\\ell_-=\\lim_{t\\to-\\infty}y(t)$ esiste finito. Integrando: $\\int_{-\\infty}^{0}y'\\,dt=y(0)-\\ell_-=2-\\ell_-$, mentre $\\int_{-\\infty}^{0}\\dfrac{y^2}{1+y^2}e^t\\,dt<\\int_{-\\infty}^{0}e^t\\,dt=1$ (poich&eacute; $\\tfrac{y^2}{1+y^2}<1$). Quindi $2-\\ell_-<1$, cio&egrave; $\\ell_->1\\ne0$. La tentazione di dire $\\ell_-=0$ (zero del secondo membro) &egrave; sbagliata: l'equazione &egrave; NON autonoma e il termine $e^t$ rompe l'analogia con $y'=g(y)$.","cont":"Verifica esplicita"},{"t":"Verifica: separando le variabili si trova l'equazione implicita $y-\\tfrac1y=e^t+c$. Determina $c$ e controlla la coerenza a $-\\infty$.","opts":[{"x":"$\\int\\dfrac{1+y^2}{y^2}dy=\\int e^t dt\\Rightarrow y-\\tfrac1y=e^t+c$; con $y(0)=2$, $c=2-\\tfrac12-1=\\tfrac12$. Risolvendo in $y$: $y=\\dfrac{2e^t+1+\\sqrt{(2e^t+1)^2+16}}{4}$, e $\\lim_{t\\to-\\infty}y=\\dfrac{1+\\sqrt{17}}4>1$, coerente col passo precedente.","c":true},{"x":"$c=0$, e $\\lim_{t\\to-\\infty}y=0$."},{"x":"L'equazione implicita &egrave; $y+\\tfrac1y=e^t+c$, con $c=\\tfrac52$."}],"hint":"Separa come $\\tfrac{1+y^2}{y^2}dy=e^t dt$ e integra $\\int(1+y^{-2})dy=y-\\tfrac1y$. Poi imponi $y(0)=2$.","sol":"Da $\\dfrac{1+y^2}{y^2}\\,dy=e^t\\,dt$ si integra $y-\\tfrac1y=e^t+c$; con $y(0)=2$, $2-\\tfrac12=1+c$ d&agrave; $c=\\tfrac12$. Moltiplicando per $y>0$: $2y^2-(2e^t+1)y-2=0$, e la radice positiva &egrave; $y=\\dfrac{2e^t+1+\\sqrt{(2e^t+1)^2+16}}{4}$. Per $t\\to-\\infty$, $e^t\\to0$ e $y\\to\\dfrac{1+\\sqrt{17}}{4}\\approx1{,}28>1$: esattamente la stima $\\ell_->1$ del passo precedente, e in particolare $\\ne0$."}]},{"pool":"edo","src":"20230210 Es.5","steps":[{"t":"Per ogni $n\\ge1$ fissato, problema $y'=\\dfrac{y\\,(\\log y-n)}{t^2+1}$, $y(0)=1$. Perch&eacute; esiste un'unica soluzione, e su quale dominio deve stare $y$?","opts":[{"x":"$f(t,u)=\\dfrac{u(\\log u-n)}{t^2+1}$ &egrave; $C^1$ sul suo dominio $\\mathbb{R}\\times(0,+\\infty)$ (serve $u>0$ per $\\log u$); poich&eacute; $y(0)=1>0$, Picard-Lindel&ouml;f d&agrave; esistenza e unicit&agrave; locali.","c":true},{"x":"$f\\in C^1(\\mathbb{R}^2)$, quindi l'unicit&agrave; vale ovunque."},{"x":"Non c'&egrave; unicit&agrave; perch&eacute; compare $\\log y$."}],"hint":"$\\log u$ esige $u>0$: il campo &egrave; regolare solo dove la seconda variabile &egrave; positiva.","sol":"Il campo $f(t,u)=\\dfrac{u(\\log u-n)}{t^2+1}$ &egrave; definito e $C^1$ su $\\mathbb{R}\\times(0,+\\infty)$ (il $\\log$ richiede $u>0$; il denominatore $t^2+1\\ge1$ non si annulla). Essendo $y(0)=1>0$, il dato cade nel dominio di regolarit&agrave; e Picard-Lindel&ouml;f garantisce esistenza e unicit&agrave; locali.","cont":"Retta tangente"},{"t":"Scrivi la retta tangente alla soluzione in $t=0$.","opts":[{"x":"$y(0)=1$ e $y'(0)=\\dfrac{1\\cdot(\\log1-n)}{0+1}=-n$, quindi la tangente &egrave; $y=1-nt$.","c":true},{"x":"$y'(0)=n$, quindi $y=1+nt$."},{"x":"$y'(0)=0$ perch&eacute; $\\log1=0$, quindi $y=1$."}],"hint":"$y'(0)$ si legge dall'equazione valutata in $(t,y)=(0,1)$: ricorda $\\log1=0$, ma poi resta il $-n$.","sol":"La tangente &egrave; $y=y(0)+y'(0)\\,t$. Dall'equazione $y'(0)=\\dfrac{y(0)(\\log y(0)-n)}{0^2+1}=\\dfrac{1\\cdot(0-n)}{1}=-n$. Quindi $y=1-nt$.","cont":"Monotonia"},{"t":"Perch&eacute; la soluzione &egrave; sempre decrescente nel suo dominio?","opts":[{"x":"L'equazione ha la soluzione costante $y\\equiv e^{n}$ (dove $\\log y=n$); poich&eacute; $y(0)=1<e^{n}$, per unicit&agrave; $y<e^{n}$, dunque $\\log y-n<0$; con $y>0$ e $t^2+1>0$ si ha $y'<0$.","c":true},{"x":"$y$ decresce perch&eacute; $y'(0)=-n<0$, e il segno di $y'$ non cambia mai per continuit&agrave;."},{"x":"$y$ decresce perch&eacute; $\\log y<0$ vicino a $y=1$."}],"hint":"C'&egrave; una barriera costante dove il fattore $\\log y-n$ si annulla: individuala e usa l'unicit&agrave;.","sol":"$y\\equiv e^{n}$ risolve l'equazione ($\\log e^n-n=0$). Con $y(0)=1<e^n$, per unicit&agrave; la soluzione resta $0<y<e^n$, quindi $\\log y-n<0$. Poich&eacute; $y>0$ e $t^2+1>0$, il segno di $y'=\\dfrac{y(\\log y-n)}{t^2+1}$ &egrave; negativo su tutto il dominio: strettamente decrescente.","cont":"Soluzione esplicita"},{"t":"Determina esplicitamente $y_n(t)$ per separazione. Quale sostituzione sull'integrale in $y$?","opts":[{"x":"$\\displaystyle\\int\\frac{dy}{y(\\log y-n)}=\\int\\frac{dt}{t^2+1}$; con $w=\\log y$, il primo membro &egrave; $\\int\\frac{dw}{w-n}=\\log|w-n|$. Si ottiene $\\log(n-\\log y)=\\arctan t+c$, e con $y(0)=1$ (cio&egrave; $c=\\log n$) $\\ y_n(t)=e^{\\,n(1-e^{\\arctan t})}$.","c":true},{"x":"$y_n(t)=e^{n}\\,e^{-\\arctan t}$."},{"x":"$y_n(t)=1-n\\arctan t$."}],"hint":"Il fattore $\\tfrac1{y}\\,dy$ suggerisce $w=\\log y$; e ricorda $\\log y-n<0$, quindi $|\\log y-n|=n-\\log y$.","sol":"Separando: $\\dfrac{dy}{y(\\log y-n)}=\\dfrac{dt}{t^2+1}$. Con $w=\\log y$, $dw=\\tfrac{dy}{y}$, il primo membro &egrave; $\\int\\tfrac{dw}{w-n}=\\log|w-n|=\\log(n-\\log y)$ (perch&eacute; $\\log y<n$). Dunque $\\log(n-\\log y)=\\arctan t+c$. Da $y(0)=1$: $\\log n=c$. Allora $n-\\log y=n\\,e^{\\arctan t}$, cio&egrave; $\\log y=n(1-e^{\\arctan t})$ e $y_n(t)=e^{\\,n(1-e^{\\arctan t})}$.","cont":"Intervallo massimale"},{"t":"Qual &egrave; l'insieme di esistenza massimale, e perch&eacute;?","opts":[{"x":"Tutto $\\mathbb{R}$: $\\arctan t$ &egrave; finito per ogni $t$, quindi $y_n(t)=e^{n(1-e^{\\arctan t})}$ &egrave; ben definita e positiva ($0<y<e^n$); restando in un compatto di valori, per la fuga dai compatti non pu&ograve; esplodere.","c":true},{"x":"Solo $(-\\tfrac{\\pi}{2},\\tfrac{\\pi}{2})$, il dominio di $\\arctan$."},{"x":"Un intervallo limitato $(a,b)$, perch&eacute; la soluzione tende a $e^n$ in tempo finito."}],"hint":"$\\arctan t$ non esplode mai: &egrave; la soluzione a poter esplodere, ma qui resta confinata. In quale striscia?","sol":"$\\arctan t$ &egrave; definita e limitata su tutto $\\mathbb{R}$ (valori in $(-\\tfrac\\pi2,\\tfrac\\pi2)$), quindi $y_n(t)=e^{n(1-e^{\\arctan t})}$ &egrave; definita e positiva ovunque, con $0<y_n<e^n$. La soluzione resta in una striscia limitata: per il teorema di fuga dai compatti non c'&egrave; esplosione in tempo finito, dunque $I_{\\max}=\\mathbb{R}$.","cont":"Limiti agli estremi"},{"t":"Calcola $\\lim_{t\\to\\pm\\infty}y_n(t)$. Perch&eacute; NON valgono $0$ n&eacute; $e^n$?","opts":[{"x":"$\\arctan t\\to\\pm\\tfrac\\pi2$, quindi $\\lim_{t\\to+\\infty}y_n=e^{\\,n(1-e^{\\pi/2})}$ e $\\lim_{t\\to-\\infty}y_n=e^{\\,n(1-e^{-\\pi/2})}$: valori finiti e positivi, entrambi in $(0,e^n)$. Non sono gli equilibri $0$ o $e^n$ perch&eacute; l'equazione &egrave; NON autonoma: $\\arctan t$ si ferma a un valore finito, non lascia arrivare $y$ all'equilibrio.","c":true},{"x":"$\\lim_{t\\to+\\infty}y_n=0$ e $\\lim_{t\\to-\\infty}y_n=e^n$, gli equilibri."},{"x":"Entrambi i limiti valgono $1$, il dato iniziale."}],"hint":"Sostituisci $\\arctan t\\to\\pm\\tfrac\\pi2$ nella formula esplicita; i valori sono strettamente fra $0$ ed $e^n$, non agli equilibri.","sol":"Poich&eacute; $\\arctan t\\to+\\tfrac\\pi2$ per $t\\to+\\infty$, $y_n\\to e^{n(1-e^{\\pi/2})}$ (piccolo, essendo $e^{\\pi/2}>1$); poich&eacute; $\\arctan t\\to-\\tfrac\\pi2$ per $t\\to-\\infty$, $y_n\\to e^{n(1-e^{-\\pi/2})}>1$. Sono limiti finiti in $(0,e^n)$, non gli equilibri $0$ o $e^n$: l'equazione &egrave; non autonoma e il fattore $\\arctan t$, saturando a $\\pm\\tfrac\\pi2$, blocca $y$ prima dell'equilibrio."}]},{"pool":"edo","src":"tipo F &middot; manuale","steps":[{"t":"Problema lineare $y'=t(1-2y)$, cio&egrave; $y'+2t\\,y=t$, $y(0)=0$. Esistenza e unicit&agrave; locali: quale ipotesi, e che tipo di equazione &egrave;?","opts":[{"x":"$f(t,y)=t(1-2y)$ &egrave; un polinomio, dunque $C^1$ e localmente lipschitziana in $y$: Picard-Lindel&ouml;f d&agrave; unicit&agrave; locale. Inoltre l'equazione &egrave; LINEARE del primo ordine, $a(t)=2t$, $b(t)=t$.","c":true},{"x":"&Egrave; separabile ma non lineare, e la sola continuit&agrave; d&agrave; esistenza senza unicit&agrave;."},{"x":"Non &egrave; ben posta perch&eacute; il coefficiente $2t$ si annulla in $t=0$."}],"hint":"Riscrivila come $y'+a(t)y=b(t)$: riconoscere che &egrave; lineare sar&agrave; decisivo per la globalit&agrave;.","sol":"$f(t,y)=t(1-2y)=t-2ty$ &egrave; polinomiale, quindi $C^1$ e localmente lipschitziana in $y$: Picard-Lindel&ouml;f d&agrave; esistenza e unicit&agrave; locali. La forma $y'+2t\\,y=t$ mostra che &egrave; un'equazione lineare del primo ordine, con coefficienti $a(t)=2t$ e $b(t)=t$ continui su $\\mathbb{R}$ (l'annullarsi di $2t$ in $t=0$ non &egrave; una singolarit&agrave;, &egrave; solo uno zero del coefficiente).","cont":"Globalit&agrave;"},{"t":"Perch&eacute; la soluzione &egrave; definita su tutto $\\mathbb{R}$? Qual &egrave; il meccanismo, diverso da una stima di limitatezza?","opts":[{"x":"Perch&eacute; l'equazione &egrave; LINEARE con coefficienti $a(t)=2t$, $b(t)=t$ continui su $\\mathbb{R}$: le soluzioni di un'EDO lineare non esplodono in tempo finito (formula esplicita col fattore integrante / Gronwall), quindi vivono su tutto l'intervallo di continuit&agrave; dei coefficienti, cio&egrave; $\\mathbb{R}$.","c":true},{"x":"Perch&eacute; $f\\in C^1$, e la regolarit&agrave; $C^1$ garantisce esistenza globale."},{"x":"Perch&eacute; la soluzione &egrave; limitata, e ci&ograve; da solo implica la globalit&agrave; per qualunque equazione."}],"hint":"La linearit&agrave; &egrave; una garanzia di globalit&agrave; a s&eacute;: non serve n&eacute; $C^1$ (solo locale) n&eacute; sapere a priori che $y$ &egrave; limitata.","sol":"Per un'equazione lineare $y'+a(t)y=b(t)$ con $a,b$ continue su un intervallo $I$, la soluzione esiste ed &egrave; unica su tutto $I$ (la formula col fattore integrante $\\mu=e^{\\int a}$ la costruisce esplicitamente, e Gronwall esclude l'esplosione). Qui $a(t)=2t$ e $b(t)=t$ sono continue su $\\mathbb{R}$, dunque $I_{\\max}=\\mathbb{R}$. &Egrave; un meccanismo diverso dalla sublinearit&agrave; o dalla limitatezza a priori: la linearit&agrave; basta da sola.","cont":"Soluzione"},{"t":"Risolvi col fattore integrante.","opts":[{"x":"$\\mu=e^{\\int 2t\\,dt}=e^{t^2}$: $(e^{t^2}y)'=t\\,e^{t^2}$, quindi $e^{t^2}y=\\tfrac12 e^{t^2}+C$ e $y=\\tfrac12+Ce^{-t^2}$. Da $y(0)=0$, $C=-\\tfrac12$: $\\ y(t)=\\tfrac12\\big(1-e^{-t^2}\\big)$.","c":true},{"x":"$\\mu=e^{2t}$, da cui $y=\\tfrac12+Ce^{-2t}$ e $C=-\\tfrac12$."},{"x":"$y=\\tfrac12 t^2+C$, con $C=0$."}],"hint":"$\\int 2t\\,dt=t^2$, non $2t$: il fattore integrante &egrave; $e^{t^2}$.","sol":"Fattore integrante $\\mu(t)=e^{\\int 2t\\,dt}=e^{t^2}$. Allora $(e^{t^2}y)'=t\\,e^{t^2}$; integrando, $e^{t^2}y=\\tfrac12 e^{t^2}+C$, cio&egrave; $y=\\tfrac12+Ce^{-t^2}$. Il dato $y(0)=0$ d&agrave; $\\tfrac12+C=0$, $C=-\\tfrac12$. Quindi $y(t)=\\tfrac12\\big(1-e^{-t^2}\\big)$.","cont":"Monotonia senza risolvere"},{"t":"Senza usare la formula: perch&eacute; $y<\\tfrac12$ sempre, e dove sta il minimo?","opts":[{"x":"$y\\equiv\\tfrac12$ &egrave; soluzione (annulla $1-2y$); poich&eacute; $y(0)=0<\\tfrac12$, per unicit&agrave; $y<\\tfrac12$, dunque $1-2y>0$ e $\\operatorname{sgn}(y')=\\operatorname{sgn}(t)$: decrescente per $t<0$, crescente per $t>0$, minimo in $t=0$.","c":true},{"x":"$y$ &egrave; sempre crescente perch&eacute; $y(0)=0$ &egrave; il valore minimo possibile."},{"x":"$y>\\tfrac12$ definitivamente, perch&eacute; $y'$ ha il segno di $t$."}],"hint":"Cerca la soluzione costante che annulla il fattore $1-2y$: &egrave; una barriera che l'unicit&agrave; rende invalicabile.","sol":"$y\\equiv\\tfrac12$ risolve l'equazione (l&igrave; $1-2y=0$). Con $y(0)=0<\\tfrac12$, per unicit&agrave; $y(t)<\\tfrac12$ sempre, quindi $1-2y>0$; allora $\\operatorname{sgn}(y')=\\operatorname{sgn}\\big(t(1-2y)\\big)=\\operatorname{sgn}(t)$: $y$ decresce per $t<0$, cresce per $t>0$, con minimo assoluto in $t=0$ (dove $y=0$). Coerente con $y=\\tfrac12(1-e^{-t^2})$.","cont":"Asintotica"},{"t":"Comportamento per $t\\to\\pm\\infty$?","opts":[{"x":"$e^{-t^2}\\to0$ da entrambi i lati, quindi $y\\to\\tfrac12$ sia a $+\\infty$ sia a $-\\infty$: la costante $y=\\tfrac12$ &egrave; un attrattore, pur essendo l'equazione non autonoma.","c":true},{"x":"$y\\to+\\infty$ per $t\\to+\\infty$ e $y\\to-\\infty$ per $t\\to-\\infty$."},{"x":"$y\\to0$, il dato iniziale."}],"hint":"Guarda $e^{-t^2}$ quando $|t|\\to\\infty$: quanto vale il termine transitorio?","sol":"Da $y=\\tfrac12(1-e^{-t^2})$, poich&eacute; $e^{-t^2}\\to0$ per $t\\to\\pm\\infty$, si ha $y\\to\\tfrac12$ a entrambi gli estremi. Equivalentemente: $y$ &egrave; monotona e limitata da $\\tfrac12$ su ciascuna semiretta, quindi il limite esiste e vale $\\tfrac12$. La retta $y=\\tfrac12$ funge da attrattore anche se l'equazione &egrave; non autonoma.","cont":"Verifica"},{"t":"Verifica che $y=\\tfrac12(1-e^{-t^2})$ risolve $y'=t(1-2y)$.","opts":[{"x":"$y'=\\tfrac12\\cdot 2t\\,e^{-t^2}=t\\,e^{-t^2}$; e $t(1-2y)=t\\big(1-(1-e^{-t^2})\\big)=t\\,e^{-t^2}$: coincidono, con $y(0)=0$.","c":true},{"x":"$y'=t^2 e^{-t^2}$, che non coincide con $t(1-2y)$."},{"x":"Basta $y(0)=0$; la derivata non va controllata."}],"hint":"Deriva $-\\tfrac12 e^{-t^2}$ con la catena e semplifica $1-2y$.","sol":"$y=\\tfrac12-\\tfrac12 e^{-t^2}\\Rightarrow y'=-\\tfrac12(-2t)e^{-t^2}=t\\,e^{-t^2}$. D'altra parte $1-2y=1-(1-e^{-t^2})=e^{-t^2}$, quindi $t(1-2y)=t\\,e^{-t^2}=y'$. La soluzione &egrave; corretta e $y(0)=0$."}]},{"pool":"edo","src":"tipo F &middot; manuale","steps":[{"t":"Problema $y'=\\dfrac{t\\,y}{1+y^2}$, $y(0)=1$. Esistenza e unicit&agrave; locali: quale ipotesi?","opts":[{"x":"$f(t,y)=\\dfrac{ty}{1+y^2}$ ha denominatore $1+y^2\\ge1$ mai nullo, quindi &egrave; $C^1(\\mathbb{R}^2)$ e localmente lipschitziana in $y$: Picard-Lindel&ouml;f d&agrave; esistenza e unicit&agrave; locali.","c":true},{"x":"L'unicit&agrave; segue dalla separabilit&agrave; dell'equazione."},{"x":"Non c'&egrave; unicit&agrave; perch&eacute; il numeratore contiene $t$."}],"hint":"Il denominatore non si annulla mai: quale regolarit&agrave; di $f$ ne segue, e cosa d&agrave;?","sol":"$1+y^2\\ge1$ non si annulla, dunque $f(t,y)=\\dfrac{ty}{1+y^2}$ &egrave; $C^1(\\mathbb{R}^2)$, in particolare localmente lipschitziana in $y$. Il teorema di Picard-Lindel&ouml;f d&agrave; esistenza e unicit&agrave; locali.","cont":"Globalit&agrave;"},{"t":"Perch&eacute; la soluzione &egrave; globale su $\\mathbb{R}$? Su quale disuguaglianza si regge?","opts":[{"x":"$|f(t,y)|=|t|\\dfrac{|y|}{1+y^2}\\le\\dfrac{|t|}{2}$, poich&eacute; $1+y^2\\ge2|y|$ (AM-GM) d&agrave; $\\dfrac{|y|}{1+y^2}\\le\\tfrac12$. Dunque $f$ &egrave; sublineare (anzi limitata in $y$ da $\\tfrac{|t|}2$), $L_1\\equiv0$, $L_2(t)=\\tfrac{|t|}2$: soluzione globale, $I_{\\max}=\\mathbb{R}$.","c":true},{"x":"&Egrave; globale perch&eacute; $f\\in C^1(\\mathbb{R}^2)$."},{"x":"&Egrave; globale perch&eacute; $y$ &egrave; monotona."}],"hint":"Maggiora $\\tfrac{|y|}{1+y^2}$ con una costante usando $1+y^2\\ge2|y|$: cos&iacute; $f$ dipende (in modulo) solo da $t$.","sol":"Da $1+y^2\\ge2|y|$ (media aritmetico-geometrica) segue $\\dfrac{|y|}{1+y^2}\\le\\tfrac12$, quindi $|f(t,y)|\\le\\tfrac{|t|}{2}$: $f$ &egrave; sublineare con $L_1\\equiv0$, $L_2(t)=\\tfrac{|t|}2$ continue. Il teorema di esistenza globale d&agrave; $I_{\\max}=\\mathbb{R}$. La sola $C^1$ darebbe vita locale; la monotonia non c'entra con la globalit&agrave;.","cont":"Monotonia"},{"t":"Segno e monotonia della soluzione.","opts":[{"x":"$y\\equiv0$ &egrave; soluzione; con $y(0)=1>0$, per unicit&agrave; $y>0$. Allora $\\operatorname{sgn}(y')=\\operatorname{sgn}(t)$: decrescente per $t<0$, crescente per $t>0$, minimo in $t=0$ con $y=1$.","c":true},{"x":"$y'$ ha sempre segno positivo, quindi $y$ &egrave; crescente ovunque."},{"x":"$y$ pu&ograve; cambiare segno perch&eacute; $ty$ cambia segno."}],"hint":"Barriera $y\\equiv0$ per la positivit&agrave;; poi il segno di $y'$ dipende solo da $t$ (gli altri fattori sono positivi).","sol":"$y\\equiv0$ risolve l'equazione; per unicit&agrave; la soluzione con $y(0)=1$ resta $y>0$. Con $y>0$ e $1+y^2>0$, $\\operatorname{sgn}(y')=\\operatorname{sgn}(t)$: $y$ decresce per $t<0$, cresce per $t>0$, minimo assoluto in $t=0$ ($y=1$).","cont":"Globale ma non limitata"},{"t":"La soluzione &egrave; limitata? Calcola $\\lim_{t\\to+\\infty}y(t)$. (Attenzione: globale non vuol dire limitata.)","opts":[{"x":"Separando: $\\dfrac{1+y^2}{y}dy=t\\,dt\\Rightarrow \\log y+\\dfrac{y^2}{2}=\\dfrac{t^2+1}{2}$. Per $t\\to+\\infty$ il secondo membro $\\to+\\infty$, quindi $y\\to+\\infty$: la soluzione &egrave; globale ma NON limitata.","c":true},{"x":"$y\\to\\tfrac12$, perch&eacute; $y/(1+y^2)\\to0$ e quindi $y$ si stabilizza."},{"x":"$y\\to1$, il valore del minimo."}],"hint":"Globalit&agrave; e limitatezza sono cose diverse: qui integra e guarda dove va il primo membro quando $y$ cresce.","sol":"$\\dfrac{1+y^2}{y}\\,dy=t\\,dt$, cio&egrave; $\\int\\big(\\tfrac1y+y\\big)dy=\\int t\\,dt$, d&agrave; $\\log y+\\tfrac{y^2}{2}=\\tfrac{t^2}2+C$; con $y(0)=1$, $C=\\tfrac12$, quindi $\\log y+\\tfrac{y^2}{2}=\\tfrac{t^2+1}{2}$. Il primo membro &egrave; crescente in $y$ e tende a $+\\infty$ solo se $y\\to+\\infty$; poich&eacute; il secondo membro $\\to+\\infty$, deve essere $\\lim_{t\\to+\\infty}y=+\\infty$. La soluzione &egrave; globale (esiste su $\\mathbb{R}$) ma illimitata.","cont":"Asintoto: si applica?"},{"t":"Perch&eacute; il teorema dell'asintoto NON serve a concludere qui, ed &egrave; sbagliato dedurre che $y$ tende a una costante?","opts":[{"x":"Il teorema dell'asintoto ha per ipotesi che $\\lim y$ sia FINITO; qui $y\\to+\\infty$, quindi l'ipotesi non &egrave; soddisfatta e il teorema non dice nulla. Osservare che $\\tfrac{y}{1+y^2}\\to0$ non implica $y'\\to0$ (c'&egrave; il fattore $t\\to+\\infty$), tanto meno che $y$ si stabilizzi.","c":true},{"x":"Il teorema dell'asintoto dice che $y'\\to0$, quindi $y$ tende a una costante."},{"x":"Il teorema si applica e d&agrave; $\\lim y=0$."}],"hint":"L'ipotesi del teorema &egrave; l'esistenza di un limite FINITO: qui c'&egrave;? E $y'=\\tfrac{ty}{1+y^2}$ &egrave; un prodotto $t\\cdot(\\to0)$, forma indeterminata.","sol":"Il teorema dell'asintoto si applica solo quando $\\lim_{t\\to+\\infty}y(t)$ esiste FINITO; qui $y\\to+\\infty$, quindi l'ipotesi cade e il teorema &egrave; muto. Il fatto che $\\tfrac{y}{1+y^2}\\to0$ non aiuta: $y'=t\\cdot\\tfrac{y}{1+y^2}$ &egrave; una forma $\\infty\\cdot0$, e infatti $y$ diverge. Dedurre $y\\to\\text{const}$ &egrave; una tipica applicazione illecita del teorema.","cont":"Verifica"},{"t":"Verifica che $\\log y+\\tfrac{y^2}{2}=\\tfrac{t^2+1}{2}$ definisce la soluzione.","opts":[{"x":"Derivando implicitamente: $\\big(\\tfrac1y+y\\big)y'=t$, cio&egrave; $\\dfrac{1+y^2}{y}\\,y'=t$, da cui $y'=\\dfrac{ty}{1+y^2}$; e in $t=0$, $\\log y+\\tfrac{y^2}2=\\tfrac12$ d&agrave; $y=1$.","c":true},{"x":"Derivando si ottiene $y'=\\dfrac{t}{1+y^2}$, che non coincide con l'equazione."},{"x":"Non &egrave; verificabile perch&eacute; la soluzione &egrave; solo implicita."}],"hint":"Deriva entrambi i membri rispetto a $t$ ricordando che $y=y(t)$; poi isola $y'$.","sol":"Derivando $\\log y+\\tfrac{y^2}2=\\tfrac{t^2+1}2$ rispetto a $t$: $\\big(\\tfrac1y+y\\big)y'=t$, cio&egrave; $\\dfrac{1+y^2}{y}y'=t$, da cui $y'=\\dfrac{ty}{1+y^2}$: &egrave; l'equazione. In $t=0$: $\\log y+\\tfrac{y^2}2=\\tfrac12$, soddisfatta da $y=1$ (e unica per monotonia del primo membro). La soluzione implicita &egrave; corretta."}]}],"superfici":[{"pool":"superfici","src":"tipo B · manuale","steps":[{"t":"Che cosa è una superficie parametrica regolare $\\Sigma$ in $\\mathbb{R}^3$?","opts":[{"x":"L'immagine di una mappa $X:D\\subset\\mathbb{R}^2\\to\\mathbb{R}^3$ di classe $C^1$ con $X_u\\times X_v\\neq 0$ nei punti interni","c":true},{"x":"Il grafico di una funzione $z=f(x,y)$, e nient'altro"},{"x":"Una curva $\\gamma:[a,b]\\to\\mathbb{R}^3$ percorsa due volte"},{"x":"Un insieme definito da una sola equazione $g(x,y,z)=0$, sempre e comunque"}],"hint":"Servono tre ingredienti: una mappa da un dominio 2D, differenziabilità $C^1$, vettori tangenti indipendenti.","sol":"Una superficie regolare è l'immagine di $X:D\\subset\\mathbb{R}^2\\to\\mathbb{R}^3$, $C^1$, con $X_u\\times X_v\\neq 0$ nei punti interni (definizione di superficie regolare, cap. Superfici). Il grafico $z=f(x,y)$ è solo un caso particolare; una singola equazione $g=0$ dà una superficie di livello, non una parametrizzazione."}]},{"pool":"superfici","src":"tipo B · manuale","steps":[{"t":"L'elemento d'area $dS$ di una superficie parametrizzata da $X(u,v)$ vale:","opts":[{"x":"$dS=\\|X_u\\times X_v\\|\\,du\\,dv$","c":true},{"x":"$dS=(X_u\\times X_v)\\,du\\,dv$ (un vettore)"},{"x":"$dS=\\|X_u\\|\\,\\|X_v\\|\\,du\\,dv$"},{"x":"$dS=(X_u\\cdot X_v)\\,du\\,dv$"}],"hint":"L'area di un parallelogramma è il MODULO del prodotto vettoriale: uno scalare, non un vettore.","sol":"$dS=\\|X_u\\times X_v\\|\\,du\\,dv$ (formula dell'area superficiale). Il prodotto vettoriale dà un vettore, ma l'area è la sua norma. $\\|X_u\\|\\,\\|X_v\\|$ sovrastima quando i tangenti non sono ortogonali; $X_u\\cdot X_v$ è lo scalare sbagliato."}]},{"pool":"superfici","src":"tipo B · manuale","steps":[{"t":"Perché nell'area compare proprio $\\|X_u\\times X_v\\|$?","opts":[{"x":"Perché $\\|X_u\\times X_v\\|$ è l'area del parallelogramma infinitesimo generato dai vettori tangenti $X_u\\,du$ e $X_v\\,dv$","c":true},{"x":"Perché è la lunghezza della diagonale del rettangolo dei parametri"},{"x":"Perché $X_u\\times X_v$ è sempre un versore"},{"x":"Perché $\\|X_u\\times X_v\\|=\\|X_u\\|+\\|X_v\\|$"}],"hint":"La mappa $X$ trasforma il rettangolino $du\\,dv$ nel piano dei parametri in un parallelogramma tangente sulla superficie.","sol":"$X$ manda il rettangolo $du\\times dv$ nel parallelogramma di lati $X_u\\,du$ e $X_v\\,dv$; la sua area è $\\|X_u\\times X_v\\|\\,du\\,dv$. Il prodotto vettoriale non è un versore (ha norma pari all'area), e la sua norma non è la somma delle norme."}]},{"pool":"superfici","src":"tipo B · manuale","steps":[{"t":"Per la superficie cartesiana $X(x,y)=(x,\\,y,\\,f(x,y))$, quanto vale $X_x\\times X_y$?","opts":[{"x":"$(-f_x,\\,-f_y,\\,1)$","c":true},{"x":"$(f_x,\\,f_y,\\,1)$"},{"x":"$(f_x,\\,f_y,\\,-1)$ sempre"},{"x":"$(1,\\,1,\\,f_x+f_y)$"}],"hint":"$X_x=(1,0,f_x)$, $X_y=(0,1,f_y)$: fai il determinante formale $3\\times3$.","sol":"$X_x=(1,0,f_x)$, $X_y=(0,1,f_y)$, quindi $X_x\\times X_y=(-f_x,-f_y,1)$: la terza componente è $+1$, la normale non normalizzata punta sempre verso l'alto (cap. Superfici, sottotipo cartesiano)."}]},{"pool":"superfici","src":"tipo B · manuale","steps":[{"t":"L'area di $\\Sigma:\\ z=f(x,y)$, $(x,y)\\in D$, è:","opts":[{"x":"$\\iint_D\\sqrt{1+f_x^2+f_y^2}\\,dx\\,dy$","c":true},{"x":"$\\iint_D (1+f_x^2+f_y^2)\\,dx\\,dy$"},{"x":"$\\iint_D\\sqrt{f_x^2+f_y^2}\\,dx\\,dy$"},{"x":"$\\iint_D\\sqrt{1+f_x+f_y}\\,dx\\,dy$"}],"hint":"È il modulo di $(-f_x,-f_y,1)$: la radice del quadrato delle tre componenti.","sol":"$A(\\Sigma)=\\iint_D\\|X_x\\times X_y\\|\\,dx\\,dy=\\iint_D\\sqrt{1+f_x^2+f_y^2}\\,dx\\,dy$. Dimenticare l'$1$ (dalla terza componente) o la radice sono gli errori più comuni."}]},{"pool":"superfici","src":"tipo B · manuale","steps":[{"t":"Orientare una superficie $\\Sigma$ significa:","opts":[{"x":"scegliere uno dei due versori normali $\\pm n$ con continuità su tutta la superficie","c":true},{"x":"scegliere il verso di percorrenza del dominio $D$ dei parametri"},{"x":"scegliere l'ordine con cui si integrano $u$ e $v$"},{"x":"scegliere il segno del jacobiano nel cambio di coordinate"}],"hint":"In ogni punto ci sono due normali opposte; orientare vuol dire sceglierne una in modo coerente ovunque.","sol":"Un'orientazione è un campo continuo di versori normali $n$ (uno dei due possibili) su tutta $\\Sigma$. Non tutte le superfici sono orientabili (il nastro di Möbius no), ma quelle d'esame lo sono. L'ordine di integrazione non c'entra con l'orientazione geometrica."}]},{"pool":"superfici","src":"20230210 Es.4 · b01 Tipo 8","steps":[{"t":"$\\Sigma$ è la calotta INFERIORE della frontiera di un solido $E$, parametrizzata come $z=f(x,y)$. Il prodotto $X_x\\times X_y=(-f_x,-f_y,1)$ ha terza componente positiva. Per il flusso USCENTE da $E$ devi:","opts":[{"x":"cambiare segno e usare $(f_x,f_y,-1)$, perché sulla calotta inferiore la normale uscente punta verso il basso","c":true},{"x":"usare $(-f_x,-f_y,1)$ così com'è"},{"x":"usare il versore costante $(0,0,1)$"},{"x":"normalizzare e basta: il verso non conta"}],"hint":"Uscente da $E$ significa allontanarsi dal solido; sotto $E$ questo vuol dire guardare in giù, terza componente $<0$.","sol":"$(-f_x,-f_y,1)$ punta verso l'alto, ma sotto il solido la normale USCENTE guarda in basso: si prende $-(X_x\\times X_y)=(f_x,f_y,-1)$. Il verso conta eccome: sbagliarlo cambia il segno del flusso (trappola ricorrente, 20230210 Es.4)."}]},{"pool":"superfici","src":"tipo B · manuale","steps":[{"t":"Il bordo $\\partial\\Sigma$ di una superficie parametrizzata da $X:D\\to\\mathbb{R}^3$ è:","opts":[{"x":"l'immagine $X(\\partial D)$ della frontiera del dominio dei parametri","c":true},{"x":"la frontiera $\\partial D$ nel piano dei parametri"},{"x":"l'insieme dei punti dove $X_u\\times X_v=0$"},{"x":"sempre un cerchio nello spazio"}],"hint":"Il bordo vive in $\\mathbb{R}^3$, sulla superficie: è dove finisce $D$, trasportato da $X$.","sol":"$\\partial\\Sigma=X(\\partial D)$: la frontiera del dominio dei parametri, mandata sulla superficie da $X$. È una curva in $\\mathbb{R}^3$ che giace su $\\Sigma$, non la frontiera piatta $\\partial D$ né il luogo di singolarità (b02 Tipo 3, trappola 5)."}]},{"pool":"superfici","src":"b02 Tipo 3 trappola 5","steps":[{"t":"$\\Sigma:\\ z=f(x,y)$ su $D=\\{x^2+y^2\\le R^2\\}$. Il bordo $\\partial\\Sigma$ è:","opts":[{"x":"la curva $\\gamma(t)=(R\\cos t,\\,R\\sin t,\\,f(R\\cos t,R\\sin t))$, che giace su $\\Sigma$","c":true},{"x":"il cerchio $x^2+y^2=R^2$ nel piano $z=0$"},{"x":"il disco $D$ stesso"},{"x":"vuoto, perché la superficie è chiusa"}],"hint":"Devi salire sulla superficie: la $z$ del bordo è $f$ valutata sul cerchio, non zero.","sol":"$\\partial\\Sigma=X(\\partial D)=\\{(R\\cos t,R\\sin t,f(R\\cos t,R\\sin t))\\}$. È una curva nello spazio che proietta sul cerchio $\\partial D$, non il cerchio piatto in $z=0$. Confonderli è l'errore classico (b02 Tipo 3, trappola 5)."}]},{"pool":"superfici","src":"tipo B · manuale","steps":[{"t":"La condizione di regolarità di una superficie parametrica in un punto interno è:","opts":[{"x":"$X_u\\times X_v\\neq 0$ (i vettori tangenti sono linearmente indipendenti)","c":true},{"x":"$X_u\\times X_v=0$"},{"x":"$X_u\\cdot X_v=0$ (tangenti ortogonali)"},{"x":"$\\|X_u\\|=\\|X_v\\|$"}],"hint":"Se il prodotto vettoriale si annulla, il piano tangente degenera e $dS=0$.","sol":"Regolare in un punto significa $X_u\\times X_v\\neq0$: i due tangenti generano un vero piano tangente. L'ortogonalità dei tangenti o l'uguaglianza delle norme non sono richieste. Questa è la condizione più spesso dimenticata (b02 Tipo 3, trappola 4)."}]},{"pool":"superfici","src":"b02 Tipo 3 trappola 3","steps":[{"t":"Nel calcolo del flusso $\\iint_\\Sigma F\\cdot n\\,dS$ tramite parametrizzazione, quanto vale $n\\,dS$?","opts":[{"x":"$(X_u\\times X_v)\\,du\\,dv$, senza normalizzare","c":true},{"x":"$\\dfrac{X_u\\times X_v}{\\|X_u\\times X_v\\|}\\,du\\,dv$"},{"x":"$\\|X_u\\times X_v\\|\\,du\\,dv$ (uno scalare)"},{"x":"$(X_u\\cdot X_v)\\,du\\,dv$"}],"hint":"Il modulo che normalizza $n$ e quello che compare in $dS$ si cancellano fra loro.","sol":"$n=\\dfrac{X_u\\times X_v}{\\|X_u\\times X_v\\|}$ e $dS=\\|X_u\\times X_v\\|\\,du\\,dv$, quindi $n\\,dS=(X_u\\times X_v)\\,du\\,dv$: il modulo si semplifica. Nel flusso NON si normalizza; si usa direttamente il prodotto vettoriale (b02 Tipo 3, trappola 3)."}]},{"pool":"superfici","src":"b02 sottotipo 3b","steps":[{"t":"Ruotando attorno all'asse $z$ il profilo $x=\\gamma(t)$, $z=t$, la parametrizzazione della superficie di rotazione è:","opts":[{"x":"$X(\\theta,t)=(\\gamma(t)\\cos\\theta,\\,\\gamma(t)\\sin\\theta,\\,t)$, $\\theta\\in[0,2\\pi]$","c":true},{"x":"$X(\\theta,t)=(\\gamma(t)\\cos\\theta,\\,\\gamma(t)\\sin\\theta,\\,\\gamma(t))$"},{"x":"$X(\\theta,t)=(t\\cos\\theta,\\,t\\sin\\theta,\\,\\gamma(t))$"},{"x":"$X(\\theta,t)=(\\cos\\theta,\\,\\sin\\theta,\\,\\gamma(t))$"}],"hint":"A quota $z=t$ il punto dista $\\gamma(t)$ dall'asse: ruotalo di $\\theta$ nel piano orizzontale.","sol":"$X(\\theta,t)=(\\gamma(t)\\cos\\theta,\\gamma(t)\\sin\\theta,t)$: il raggio dall'asse è $\\gamma(t)$, la quota resta $t$. Mettere $\\gamma(t)$ in terza componente confonde il profilo con l'altezza (b02 sottotipo 3b)."}]},{"pool":"superfici","src":"22gen24 Es.4 · b02 sottotipo 3b","steps":[{"t":"Per $X(\\theta,t)=(\\gamma\\cos\\theta,\\,\\gamma\\sin\\theta,\\,t)$ il vettore $X_\\theta\\times X_t$ vale:","opts":[{"x":"$(\\gamma\\cos\\theta,\\,\\gamma\\sin\\theta,\\,-\\gamma\\gamma')$","c":true},{"x":"$(\\gamma\\cos\\theta,\\,\\gamma\\sin\\theta,\\,\\gamma\\gamma')$"},{"x":"$(-\\gamma\\cos\\theta,\\,-\\gamma\\sin\\theta,\\,0)$"},{"x":"$(\\cos\\theta,\\,\\sin\\theta,\\,\\gamma')$"}],"hint":"La terza componente è $-\\gamma\\gamma'$: il suo segno decide se la normale punta dentro o fuori dal solido.","sol":"$X_\\theta=(-\\gamma\\sin\\theta,\\gamma\\cos\\theta,0)$, $X_t=(\\gamma'\\cos\\theta,\\gamma'\\sin\\theta,1)$; il prodotto è $(\\gamma\\cos\\theta,\\gamma\\sin\\theta,-\\gamma\\gamma')$. Il segno di $-\\gamma\\gamma'$ non è costante: la normale può puntare dentro per certi $z$ e fuori per altri (22gen24 Es.4, b02 trappola 6)."}]},{"pool":"superfici","src":"14feb25 Es.5 · tipo B","steps":[{"t":"Per la sfera $x=R\\sin\\phi\\cos\\theta$, $y=R\\sin\\phi\\sin\\theta$, $z=R\\cos\\phi$, l'elemento d'area $\\|X_\\phi\\times X_\\theta\\|$ vale:","opts":[{"x":"$R^2\\sin\\phi$","c":true},{"x":"$R\\sin\\phi$"},{"x":"$R^2$"},{"x":"$\\sqrt{1+R^2}$"}],"hint":"Non usare la formula cartesiana $\\sqrt{1+f_x^2+f_y^2}$: la sfera non è un grafico. Calcola il prodotto vettoriale sferico.","sol":"$\\|X_\\phi\\times X_\\theta\\|=R^2\\sin\\phi$, da cui $dS=R^2\\sin\\phi\\,d\\phi\\,d\\theta$. La formula cartesiana è sbagliata per superfici non-grafico: per la sfera si calcola direttamente (b01 Tipo 8, trappola sulle superfici non cartesiane)."}]},{"pool":"superfici","src":"27giu25 Es.1 · b02 sottotipo 3a","steps":[{"t":"$\\Sigma:\\ z=f(x,y)$ è la parte di piano che sta SOPRA il paraboloide, dove $f(x,y)\\ge x^2+y^2$. Il dominio $D$ dei parametri è:","opts":[{"x":"$\\{(x,y): f(x,y)\\ge x^2+y^2\\}$, cioè la proiezione del vincolo sul piano $xy$","c":true},{"x":"tutto $\\mathbb{R}^2$"},{"x":"il cerchio $x^2+y^2=1$"},{"x":"$\\{(x,y): f(x,y)=0\\}$"}],"hint":"Il dominio è l'ombra della superficie sul piano $xy$: risolvi la disuguaglianza che delimita $\\Sigma$.","sol":"$D$ è la proiezione di $\\Sigma$: l'insieme dei $(x,y)$ per cui il punto $(x,y,f)$ appartiene a $\\Sigma$, cioè $f(x,y)\\ge x^2+y^2$. Ignorare questo vincolo (prendere tutto $\\mathbb{R}^2$) invalida area e bordo (27giu25 Es.1, b02 trappola 1)."}]},{"pool":"superfici","src":"b02 Tipo 3 trappola 3","steps":[{"t":"Che relazione lega $\\sqrt{1+f_x^2+f_y^2}$ (fattore d'area) e $(-f_x,-f_y,1)$ (normale non normalizzata) di una superficie cartesiana?","opts":[{"x":"Il primo è il MODULO del secondo: $\\|(-f_x,-f_y,1)\\|=\\sqrt{1+f_x^2+f_y^2}$","c":true},{"x":"Sono lo stesso oggetto: uno scalare e un vettore intercambiabili"},{"x":"Il primo è il quadrato del secondo"},{"x":"Non c'è alcuna relazione"}],"hint":"L'area usa il modulo; il flusso usa il vettore. Stesso $(-f_x,-f_y,1)$, due usi diversi.","sol":"$\\sqrt{1+f_x^2+f_y^2}=\\|(-f_x,-f_y,1)\\|$: il fattore d'area è la NORMA della normale non normalizzata. Nell'area si usa lo scalare $\\|\\cdot\\|$; nel flusso il vettore $(-f_x,-f_y,1)$. Sono facce dello stesso oggetto (b02 Tipo 3, trappola 3)."}]},{"pool":"superfici","src":"20220124 Es.4 iii","steps":[{"t":"Calcola l'area di $\\Sigma:\\ z=x+3y+4$ con $(x,y)\\in D=\\{x^2+y^2\\le 4\\}$.","opts":[{"x":"$4\\pi\\sqrt{11}$","c":true},{"x":"$4\\pi$"},{"x":"$4\\pi\\sqrt{10}$"},{"x":"$2\\pi\\sqrt{11}$"}],"hint":"$f_x=1$, $f_y=3$: il fattore d'area è costante e esce dall'integrale; resta l'area del disco.","sol":"$\\sqrt{1+f_x^2+f_y^2}=\\sqrt{1+1+9}=\\sqrt{11}$, costante. Quindi $A=\\sqrt{11}\\cdot\\text{Area}(D)=\\sqrt{11}\\cdot 4\\pi=4\\pi\\sqrt{11}$ (formula dell'area cartesiana; 20220124 Es.4 iii). Il distrattore $\\sqrt{10}$ dimentica l'$1$."}]},{"pool":"superfici","src":"20220622 Es.4 i","steps":[{"t":"Calcola l'area di $\\Sigma:\\ z=1+\\tfrac{x^2}{2}+\\tfrac{y^2}{2}$ su $D=\\{x^2+y^2\\le 16\\}$.","opts":[{"x":"$\\dfrac{2\\pi}{3}\\,(17\\sqrt{17}-1)$","c":true},{"x":"$\\dfrac{2\\pi}{3}\\,(17\\sqrt{17}+1)$"},{"x":"$\\dfrac{\\pi}{3}\\,(17\\sqrt{17}-1)$"},{"x":"$16\\pi\\sqrt{17}$"}],"hint":"$f_x=x$, $f_y=y$: il fattore è $\\sqrt{1+x^2+y^2}$, non costante. Polari, e non dimenticare $\\rho\\,d\\rho$.","sol":"$\\sqrt{1+f_x^2+f_y^2}=\\sqrt{1+\\rho^2}$. In polari $A=\\int_0^{2\\pi}\\!\\!\\int_0^4\\sqrt{1+\\rho^2}\\,\\rho\\,d\\rho\\,d\\theta=2\\pi\\cdot\\tfrac{1}{3}\\big[(1+\\rho^2)^{3/2}\\big]_0^4=\\tfrac{2\\pi}{3}(17\\sqrt{17}-1)$ (formula dell'area cartesiana; 20220622 Es.4 i). Il distrattore $16\\pi\\sqrt{17}$ tratta il fattore come costante."}]},{"pool":"superfici","src":"20220706 Es.4 ii","steps":[{"t":"Calcola l'area di $\\Sigma:\\ z=4x+y+1$ su $x^2+y^2\\le 1$.","opts":[{"x":"$3\\sqrt{2}\\,\\pi$","c":true},{"x":"$\\sqrt{17}\\,\\pi$"},{"x":"$3\\pi$"},{"x":"$\\sqrt{2}\\,\\pi$"}],"hint":"$|\\nabla f|^2=16+1=17$; il fattore è $\\sqrt{1+17}$, non $\\sqrt{17}$.","sol":"$\\sqrt{1+f_x^2+f_y^2}=\\sqrt{1+16+1}=\\sqrt{18}=3\\sqrt{2}$, costante. $A=3\\sqrt{2}\\cdot\\pi$ (area del disco unitario $=\\pi$; 20220706 Es.4 ii). Il distrattore $\\sqrt{17}\\pi$ dimentica di sommare l'$1$."}]},{"pool":"superfici","src":"20230907 Es.4","steps":[{"t":"Calcola l'area di $\\Sigma:\\ z=2+x^2+(y-1)^2$ su $D=\\{x^2+(y-1)^2\\le 1\\}$.","opts":[{"x":"$\\dfrac{\\pi}{6}\\,(5\\sqrt{5}-1)$","c":true},{"x":"$\\dfrac{\\pi}{6}\\,(5\\sqrt{5}+1)$"},{"x":"$\\dfrac{\\pi}{3}\\,(5\\sqrt{5}-1)$"},{"x":"$\\pi(5\\sqrt{5}-1)$"}],"hint":"$f_x=2x$, $f_y=2(y-1)$: $|\\nabla f|^2=4(x^2+(y-1)^2)=4\\rho^2$ con polari CENTRATE in $(0,1)$.","sol":"Polari centrate in $(0,1)$: $x=\\rho\\cos\\theta$, $y-1=\\rho\\sin\\theta$, jacobiano $\\rho$. $A=\\int_0^{2\\pi}\\!\\!\\int_0^1\\sqrt{1+4\\rho^2}\\,\\rho\\,d\\rho\\,d\\theta=2\\pi\\cdot\\tfrac{1}{12}\\big[(1+4\\rho^2)^{3/2}\\big]_0^1=\\tfrac{\\pi}{6}(5\\sqrt{5}-1)$ (20230907 Es.4). Il centro del disco è $(0,1)$, non l'origine."}]},{"pool":"superfici","src":"20250127 Es.1","steps":[{"t":"Calcola l'area di $\\Sigma:\\ z+2x+y-2=0$ con $(x,y)\\in\\{x^2+y^2\\le 9\\}$.","opts":[{"x":"$9\\sqrt{6}\\,\\pi$","c":true},{"x":"$9\\sqrt{5}\\,\\pi$"},{"x":"$3\\sqrt{6}\\,\\pi$"},{"x":"$9\\pi$"}],"hint":"$z=-2x-y+2$, quindi $f_x=-2$, $f_y=-1$; fattore $\\sqrt{1+4+1}$, area del disco $9\\pi$.","sol":"$\\sqrt{1+f_x^2+f_y^2}=\\sqrt{1+4+1}=\\sqrt{6}$, costante. $A=\\sqrt{6}\\cdot 9\\pi=9\\sqrt{6}\\pi$ (area del disco di raggio 3 $=9\\pi$; 20250127 Es.1). Il distrattore $\\sqrt{5}$ dimentica l'$1$."}]},{"pool":"superfici","src":"20240209 Es.4","steps":[{"t":"Per $\\Sigma:\\ z=2x+2y+5$, quanto vale l'elemento d'area $\\sqrt{1+f_x^2+f_y^2}$?","opts":[{"x":"$3$","c":true},{"x":"$\\sqrt{5}$"},{"x":"$9$"},{"x":"$\\sqrt{8}$"}],"hint":"$f_x=f_y=2$: $\\sqrt{1+4+4}$.","sol":"$\\sqrt{1+2^2+2^2}=\\sqrt{9}=3$ (09feb24 Es.4). Il distrattore $\\sqrt{8}$ dimentica l'$1$; $9$ dimentica la radice."}]},{"pool":"superfici","src":"20240704 Es.3","steps":[{"t":"$\\Sigma:\\ z=4y+5$ con $x^2+y^2\\le z$. Determina il dominio $D$ dei parametri.","opts":[{"x":"$x^2+(y-2)^2\\le 9$: disco di centro $(0,2)$ e raggio 3","c":true},{"x":"$x^2+y^2\\le 5$"},{"x":"$x^2+y^2\\le 9$, centrato nell'origine"},{"x":"tutto il piano"}],"hint":"Sostituisci $z=4y+5$ nel vincolo $x^2+y^2\\le z$ e completa il quadrato in $y$.","sol":"$x^2+y^2\\le 4y+5\\iff x^2+(y-2)^2\\le 9$: disco di centro $(0,2)$, raggio 3 (20240704 Es.3, b02 trappola 1 sulla traslazione).","cont":"Ora l'area →"},{"t":"Con $D=\\{x^2+(y-2)^2\\le 9\\}$, calcola l'area di $\\Sigma:\\ z=4y+5$.","opts":[{"x":"$9\\sqrt{17}\\,\\pi$","c":true},{"x":"$9\\pi$"},{"x":"$3\\sqrt{17}\\,\\pi$"},{"x":"$9\\sqrt{17}$"}],"hint":"$f_x=0$, $f_y=4$: fattore $\\sqrt{1+16}=\\sqrt{17}$, costante; area del disco $9\\pi$.","sol":"$\\sqrt{1+0+16}=\\sqrt{17}$; $A=\\sqrt{17}\\cdot 9\\pi=9\\sqrt{17}\\pi$ (area del disco di raggio 3; 20240704 Es.3)."}]},{"pool":"superfici","src":"20250627 Es.1","steps":[{"t":"Trova il dominio $D$ di $\\Sigma:\\ z=2x+4y-4$ con $z\\ge x^2+y^2$.","opts":[{"x":"$(x-1)^2+(y-2)^2\\le 1$","c":true},{"x":"$x^2+y^2\\le 4$"},{"x":"$(x-1)^2+(y-2)^2\\le 5$"},{"x":"$(x-2)^2+(y-4)^2\\le 1$"}],"hint":"Imponi $x^2+y^2\\le 2x+4y-4$ e completa i quadrati in $x$ e in $y$.","sol":"$x^2+y^2\\le 2x+4y-4\\iff x^2-2x+y^2-4y+4\\le 0\\iff (x-1)^2+(y-2)^2\\le 1$: disco di centro $(1,2)$, raggio 1 (27giu25 Es.1). Il distrattore col $5$ dimentica di portare il $-4$ a sinistra."}]},{"pool":"superfici","src":"20240305 Es.3","steps":[{"t":"Per $\\Sigma:\\ z=\\sqrt{3}\\,x+1$, quanto vale l'elemento d'area?","opts":[{"x":"$2$","c":true},{"x":"$\\sqrt{3}$"},{"x":"$\\sqrt{2}$"},{"x":"$4$"}],"hint":"$f_x=\\sqrt{3}$, $f_y=0$: $\\sqrt{1+3+0}$.","sol":"$\\sqrt{1+(\\sqrt{3})^2+0}=\\sqrt{4}=2$ (05mar24 Es.3). Il distrattore $\\sqrt{3}$ dimentica l'$1$."}]},{"pool":"superfici","src":"20240704 Es.3","steps":[{"t":"Scrivi il bordo $\\partial\\Sigma$ di $\\Sigma:\\ z=4y+5$ su $D=\\{x^2+(y-2)^2\\le 9\\}$.","opts":[{"x":"$\\gamma(t)=(3\\cos t,\\ 2+3\\sin t,\\ 13+12\\sin t)$, $t\\in[0,2\\pi]$","c":true},{"x":"$\\gamma(t)=(3\\cos t,\\ 2+3\\sin t,\\ 8+12\\sin t)$"},{"x":"il cerchio $x^2+(y-2)^2=9$ nel piano $z=0$"},{"x":"$\\gamma(t)=(3\\cos t,\\ 3\\sin t,\\ 5)$"}],"hint":"Su $\\partial D$: $x=3\\cos t$, $y=2+3\\sin t$; poi $z=4y+5$ INCLUDENDO il $+5$.","sol":"$\\partial D$: $x=3\\cos t$, $y=2+3\\sin t$. Sul bordo $z=4y+5=4(2+3\\sin t)+5=13+12\\sin t$, quindi $\\gamma(t)=(3\\cos t,2+3\\sin t,13+12\\sin t)$ (20240704 Es.3). Il distrattore $8+12\\sin t$ dimentica il $+5$; il bordo NON è il cerchio piatto in $z=0$."}]},{"pool":"superfici","src":"20250127 Es.1","steps":[{"t":"Scrivi il bordo di $\\Sigma:\\ z=-2x-y+2$ su $D=\\{x^2+y^2\\le 9\\}$.","opts":[{"x":"$\\gamma(t)=(3\\cos t,\\ 3\\sin t,\\ -6\\cos t-3\\sin t+2)$","c":true},{"x":"$\\gamma(t)=(3\\cos t,\\ 3\\sin t,\\ 0)$"},{"x":"il cerchio $x^2+y^2=9$"},{"x":"$\\gamma(t)=(3\\cos t,\\ 3\\sin t,\\ -2\\cos t-\\sin t+2)$"}],"hint":"Sul cerchio $x=3\\cos t$, $y=3\\sin t$; sostituisci in $z=-2x-y+2$ tenendo i fattori $3$.","sol":"$z=-2(3\\cos t)-(3\\sin t)+2=-6\\cos t-3\\sin t+2$, quindi $\\gamma(t)=(3\\cos t,3\\sin t,-6\\cos t-3\\sin t+2)$ (20250127 Es.1). Il distrattore con $-2\\cos t-\\sin t$ dimentica di moltiplicare $x,y$ per il raggio 3."}]},{"pool":"superfici","src":"tipo B · manuale","steps":[{"t":"Calcola il flusso di $F=(0,0,z)$ attraverso $\\Sigma:\\ z=x+3y+4$ su $D=\\{x^2+y^2\\le 4\\}$, con normale a terza componente positiva.","opts":[{"x":"$16\\pi$","c":true},{"x":"$0$"},{"x":"$4\\pi\\sqrt{11}$"},{"x":"$32\\pi$"}],"hint":"$F\\cdot(X_x\\times X_y)=(0,0,z)\\cdot(-f_x,-f_y,1)=z$; poi $z=x+3y+4$ e su disco centrato $\\iint x=\\iint y=0$.","sol":"$n\\,dS=(-f_x,-f_y,1)\\,dx\\,dy$, quindi $\\iint_\\Sigma F\\cdot n\\,dS=\\iint_D (x+3y+4)\\,dx\\,dy$. Per simmetria $\\iint_D x=\\iint_D y=0$, resta $4\\cdot\\text{Area}(D)=4\\cdot4\\pi=16\\pi$ (flusso via parametrizzazione, b02 Tipo 3 trappola 3). Il distrattore $4\\pi\\sqrt{11}$ confonde flusso con area."}]},{"pool":"superfici","src":"20250127 Es.5 · b02 sottotipo 3b","steps":[{"t":"Ruotando attorno all'asse $z$ il profilo $x=1+t^2$, $z=t$, $t\\in[1,2]$, la parametrizzazione della superficie è:","opts":[{"x":"$X(\\theta,t)=((1+t^2)\\cos\\theta,\\ (1+t^2)\\sin\\theta,\\ t)$","c":true},{"x":"$X(\\theta,t)=(t\\cos\\theta,\\ t\\sin\\theta,\\ 1+t^2)$"},{"x":"$X(\\theta,t)=((1+t^2)\\cos\\theta,\\ (1+t^2)\\sin\\theta,\\ 1+t^2)$"},{"x":"$X(\\theta,t)=(\\cos\\theta,\\ \\sin\\theta,\\ t)$"}],"hint":"Il raggio dall'asse è $x=1+t^2$; la quota resta $z=t$.","sol":"$X(\\theta,t)=((1+t^2)\\cos\\theta,(1+t^2)\\sin\\theta,t)$, $\\theta\\in[0,2\\pi]$, $t\\in[1,2]$ (27gen25 Es.5). Scambiare raggio e quota (mettere $1+t^2$ in terza componente) è l'errore tipico."}]},{"pool":"superfici","src":"20250214 Es.5","steps":[{"t":"Per $\\Sigma=\\{x^2+y^2+z^2=9,\\ 0\\le y\\le x\\}$ in coordinate sferiche $x=3\\sin\\phi\\cos\\theta$, $y=3\\sin\\phi\\sin\\theta$, l'intervallo di $\\theta$ è:","opts":[{"x":"$\\theta\\in[0,\\tfrac{\\pi}{4}]$","c":true},{"x":"$\\theta\\in[0,\\tfrac{\\pi}{2}]$"},{"x":"$\\theta\\in[0,2\\pi]$"},{"x":"$\\theta\\in[\\tfrac{\\pi}{4},\\tfrac{\\pi}{2}]$"}],"hint":"Con $\\sin\\phi>0$, il vincolo $0\\le y\\le x$ diventa $0\\le\\sin\\theta\\le\\cos\\theta$, cioè $\\tan\\theta\\le 1$.","sol":"$0\\le y\\le x\\iff 0\\le\\sin\\theta\\le\\cos\\theta\\iff 0\\le\\tan\\theta\\le 1\\iff\\theta\\in[0,\\tfrac{\\pi}{4}]$; $\\phi\\in[0,\\pi]$ (14feb25 Es.5). Il settore è uno spicchio, non un ottante generico."}]},{"pool":"superfici","src":"20230210 Es.4 · b01 Tipo 8","steps":[{"t":"$E=\\{x^2+y^2+z^2\\le 25,\\ x^2+y^2\\le 9\\}$. Sulla calotta INFERIORE $\\Sigma_2:\\ z=-\\sqrt{25-x^2-y^2}$, la normale USCENTE da $E$ si ottiene da $X_x\\times X_y=(-f_x,-f_y,1)$:","opts":[{"x":"prendendo $-(X_x\\times X_y)$, perché sotto $E$ la normale uscente ha terza componente negativa","c":true},{"x":"prendendo $+(X_x\\times X_y)$ così com'è"},{"x":"usando il versore costante $(0,0,-1)$"},{"x":"l'orientazione è irrilevante per il flusso"}],"hint":"Sotto il solido, 'uscente' significa allontanarsi verso il basso: terza componente $<0$.","sol":"$(-f_x,-f_y,1)$ ha terza componente $+1$ (punta in alto, verso l'interno di $E$ sulla calotta inferiore). La normale uscente guarda in basso, quindi si usa $-(X_x\\times X_y)$ (20230210 Es.4; b01 Tipo 8, segno del normale). L'orientazione decide il segno del flusso: non è mai irrilevante."}]},{"pool":"superfici","src":"tipo B · manuale","steps":[{"t":"Usando $\\|X_\\phi\\times X_\\theta\\|=R^2\\sin\\phi$, calcola l'area della sfera di raggio $R$.","opts":[{"x":"$4\\pi R^2$","c":true},{"x":"$2\\pi R^2$"},{"x":"$\\tfrac{4}{3}\\pi R^3$"},{"x":"$\\pi R^2$"}],"hint":"$A=\\int_0^{2\\pi}\\!\\!\\int_0^\\pi R^2\\sin\\phi\\,d\\phi\\,d\\theta$; ricorda $\\int_0^\\pi\\sin\\phi\\,d\\phi=2$.","sol":"$A=\\int_0^{2\\pi}\\!\\!\\int_0^\\pi R^2\\sin\\phi\\,d\\phi\\,d\\theta=R^2\\cdot 2\\pi\\cdot 2=4\\pi R^2$ (formula dell'area superficiale). Il distrattore $\\tfrac{4}{3}\\pi R^3$ è il VOLUME, non l'area; $\\phi$ va da $0$ a $\\pi$, non a $2\\pi$."}]},{"pool":"superfici","src":"20250127 Es.1","steps":[{"t":"$\\Sigma=\\{z+2x+y-2=0,\\ x^2+y^2\\le 9\\}$. Scrivi una parametrizzazione regolare e il dominio dei parametri.","opts":[{"x":"cartesiana $X(x,y)=(x,\\,y,\\,-2x-y+2)$, $(x,y)\\in D=\\{x^2+y^2\\le 9\\}$","c":true},{"x":"$X(x,y)=(x,\\,y,\\,2x+y-2)$, $(x,y)\\in D=\\{x^2+y^2\\le 9\\}$"},{"x":"$X(x,y)=(x,\\,y,\\,-2x-y+2)$, $(x,y)\\in\\{x^2+y^2\\le 3\\}$"}],"hint":"Isola $z$: il segno conta. Il vincolo sui parametri e' la proiezione di $\\Sigma$ sul piano $xy$, un cerchio di raggio $3$ perche' il raggio al quadrato e' $9$.","sol":"Superficie cartesiana $z=f(x,y)=-2x-y+2$, regolare perche' $f\\in C^1$. Il dominio dei parametri e' la proiezione $D=\\{x^2+y^2\\le 9\\}$, disco di raggio $3$. NB: la stampa ufficiale scrive $x^2+y^2\\le 3$, ma nel calcolo dell'area usa $m_2(D)=9\\pi$, cioe' raggio $3$: e' un refuso, il raggio corretto e' $3$.","cont":"normale"},{"t":"Determina il versore normale a $\\Sigma$ con terza componente positiva.","opts":[{"x":"$n=\\dfrac{1}{\\sqrt6}(2,\\,1,\\,1)$","c":true},{"x":"$n=\\dfrac{1}{\\sqrt6}(-2,\\,-1,\\,1)$"},{"x":"$n=\\dfrac{1}{\\sqrt6}(2,\\,1,\\,-1)$"}],"hint":"Per $z=f(x,y)$ la normale non normalizzata e' $(-f_x,-f_y,1)$; qui $f_x=-2,\\ f_y=-1$, quindi la terza componente $+1$ e' gia' quella voluta.","sol":"La normale a una superficie cartesiana e' $\\pm(-f_x,-f_y,1)$. Con $f_x=-2,\\ f_y=-1$ si ha $(-f_x,-f_y,1)=(2,1,1)$, norma $\\sqrt{4+1+1}=\\sqrt6$; il versore a terza componente positiva e' $n=(2,1,1)/\\sqrt6$.","cont":"area"},{"t":"Calcola l'area di $\\Sigma$.","opts":[{"x":"$9\\sqrt6\\,\\pi$","c":true},{"x":"$9\\pi$"},{"x":"$6\\sqrt6\\,\\pi$"}],"hint":"$dS=\\sqrt{1+f_x^2+f_y^2}\\,dx\\,dy$ e qui il fattore e' costante: esce dall'integrale e resta l'area di $D$.","sol":"Formula dell'area per superfici cartesiane: $A=\\iint_D\\sqrt{1+f_x^2+f_y^2}\\,dx\\,dy=\\sqrt{1+4+1}\\;m_2(D)=\\sqrt6\\cdot 9\\pi=9\\sqrt6\\,\\pi$ (disco di raggio $3$).","cont":"bordo"},{"t":"Scrivi una parametrizzazione del bordo $\\partial\\
